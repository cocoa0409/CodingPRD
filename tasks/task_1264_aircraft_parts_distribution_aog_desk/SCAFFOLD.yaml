# =============================================================================
# Task 1264: Aircraft Parts Distribution & AOG Desk — seed tables
# Difficulty target: beyond Expert (14 entities, 66 endpoints, 40 error codes,
# 10 calculations with 3 dual-variant pairs, 11 state machines incl. cyclic,
# parallel-dimension and branching shapes, 3 OCC concurrency rules).
# =============================================================================

scenario: |
  1264. Aircraft Parts Distribution & AOG Desk (aviation parts distributor):
  24/7 AOG request handling & sourcing search, part condition
  (new/overhauled/as-removed) & trace documentation, exchange/core return with
  due-date & penalty, loan/lease of rotable unit, hazmat & export control on
  shipment, hot-shot courier & charter freight decision, quote validity &
  priority tiering, warranty & return

domain_name: aircraft-parts-aog-desk
api_prefix: /aog

complexity_profile:
  primary_archetype: compliance_audit      # hazmat / export-control / trace-doc gating with segregation of duties
  secondary_archetype: pricing_engine      # tiered quote fees, freight decision, penalty tiers
  complexity_layers:
    - optimistic_concurrency               # OCC on Quote (accept/revise) and Customer (credit adjustments)
    - cascading_side_effects               # accept/deliver/sweep chains spanning 4+ entities
    - dual_variant_calculation             # core penalty provisional-vs-final; loan vs lease settlement
    - rate_threshold_triggers              # tier evaluation, penalty tiers, overdue sweeps
  entity_topology: flat                    # peer entities joined by FK references; no nested creation paths
  state_machine_shape: parallel            # SalesOrder: fulfillment x compliance x payment; Quote is cyclic; CoreReturn branches
  relationship_patterns:
    - one_to_many
    - cross_aggregate
    - polymorphic                          # AccountLedgerEntry.reference_* points at several entity types
  role_model: segregation_of_duties        # warranty review vs approval; compliance clearing vs warehouse shipping
  consistency_model: immediate             # every mutation + cascade is atomic in the request

# =============================================================================
# 1.0 Response Envelope (FIXED)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# 1.1 Entity-Relationship Table
# Trace doc rank (used by InventoryUnit.trace_doc_level and
# AogRequest.min_trace_doc): TRACE_MISSING(0) < TEARDOWN_REPORT(1) <
# FAA_8130(2) < EASA_FORM1(3) < DUAL_RELEASE(4).
# =============================================================================
entities:
  - name: Customer
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Airline / operator legal name" }
      - { name: country_code, type: string, source: input, description: "ISO 3166-1 alpha-2 country of the operator's principal base" }
      - { name: credit_limit_cents, type: integer, source: input, description: "Maximum allowed outstanding balance in cents; must be >= 0" }
      - { name: outstanding_balance_cents, type: integer, source: computed, default: 0, description: "Read-only. Always equals sum(ledger debits) - sum(ledger credits) for this customer; recomputed synchronously on every posted AccountLedgerEntry" }
      - { name: priority_tier, type: enum, source: computed, default: STANDARD, description: "STANDARD | PRIORITY | PLATINUM. Recomputed only by POST /_system/run-sweeps from trailing-180-day core-return metrics; never directly writable" }
      - { name: core_returns_settled_180d, type: integer, source: computed, default: 0, description: "Count of this customer's CoreReturn rows reaching SETTLED with received_at inside the trailing 180-day window" }
      - { name: core_returns_on_time_180d, type: integer, source: computed, default: 0, description: "Subset of core_returns_settled_180d with received_at <= due_at" }
      - { name: warranty_fraud_flags, type: integer, source: computed, default: 0, description: "Count of WarrantyClaim rows rejected with fraud_flag=true" }
      - { name: status, type: enum, source: system, default: ACTIVE, description: "ACTIVE | SUSPENDED. SUSPENDED blocks quote acceptance and loan creation" }

  - name: PartMaster
    parent: null
    common_fields: true
    fields:
      - { name: part_number, type: string, source: input, description: "Catalog part number; unique across PartMaster" }
      - { name: description, type: string, source: input, description: "Free-text part description" }
      - { name: rotable, type: boolean, source: input, description: "True if the part is repairable/exchangeable (eligible for EXCHANGE, LOAN, LEASE sale types)" }
      - { name: hazmat_class, type: enum, source: input, default: NONE, description: "NONE | CLASS_2 | CLASS_3 | CLASS_9. Non-NONE forces hazmat declaration at shipment tender" }
      - { name: export_control_code, type: enum, source: input, default: EAR99, description: "EAR99 | EAR9X610 | ITAR. Non-EAR99 forces export screening and license reference at tender" }
      - { name: list_price_cents, type: integer, source: input, description: "Catalog list price in cents; must be > 0" }
      - { name: core_value_cents, type: integer, source: input, default: 0, description: "Core deposit value in cents; must be > 0 when rotable is true, must be 0 when rotable is false" }
      - { name: warranty_months, type: integer, source: input, default: 12, description: "Warranty coverage length in 30-day months from delivery; must be > 0" }
      - { name: available_count, type: integer, source: computed, default: 0, description: "Read-only count of InventoryUnit rows of this part with status AVAILABLE" }
      - { name: reserved_count, type: integer, source: computed, default: 0, description: "Read-only count of InventoryUnit rows of this part with status RESERVED" }

  - name: InventoryUnit
    parent: null
    common_fields: true
    fields:
      - { name: part_id, type: string, source: input, description: "FK -> PartMaster.id; the catalog part this serialized unit belongs to" }
      - { name: serial_number, type: string, source: input, description: "Manufacturer serial number; unique per part_id" }
      - { name: condition, type: enum, source: input, description: "NEW | OVERHAULED | SERVICEABLE | AS_REMOVED" }
      - { name: trace_doc_level, type: enum, source: input, description: "TRACE_MISSING | TEARDOWN_REPORT | FAA_8130 | EASA_FORM1 | DUAL_RELEASE; ranked 0..4" }
      - { name: warehouse_code, type: string, source: input, description: "Stocking warehouse identifier" }
      - { name: status, type: enum, source: system, default: AVAILABLE, description: "AVAILABLE | RESERVED | ALLOCATED | SHIPPED | SOLD | ON_LOAN | UNDER_INSPECTION | QUARANTINED | SCRAPPED" }
      - { name: reserved_by_request_id, type: string, source: system, description: "FK -> AogRequest.id; set while RESERVED by a sourcing search, null otherwise" }

  - name: AogRequest
    parent: null
    common_fields: true
    fields:
      - { name: customer_id, type: string, source: input, description: "FK -> Customer.id; operator with the grounded aircraft" }
      - { name: aircraft_tail, type: string, source: input, description: "Tail number of the AOG aircraft" }
      - { name: airport_code, type: string, source: input, description: "IATA airport where the aircraft is grounded" }
      - { name: part_id, type: string, source: input, description: "FK -> PartMaster.id; the requested part" }
      - { name: quantity, type: integer, source: input, description: "Units requested; must be >= 1" }
      - { name: condition_acceptable, type: array, source: input, description: "Non-empty subset of {NEW, OVERHAULED, SERVICEABLE, AS_REMOVED}" }
      - { name: min_trace_doc, type: enum, source: input, description: "Minimum acceptable trace_doc_level: TRACE_MISSING | TEARDOWN_REPORT | FAA_8130 | EASA_FORM1 | DUAL_RELEASE" }
      - { name: needed_by_utc, type: datetime, source: input, description: "Latest acceptable dispatch time; must be strictly after current clock time" }
      - { name: escalated, type: boolean, source: system, default: false, description: "Set true by the escalate action; drives the 1.25 freight multiplier" }
      - { name: status, type: enum, source: system, default: OPEN, description: "OPEN | QUOTED | FULFILLING | FULFILLED | CLOSED | CANCELLED" }
      - { name: reserved_unit_id, type: string, source: system, description: "FK -> InventoryUnit.id; unit pinned by the most recent successful source search, null if none" }
      - { name: last_search_candidate_count, type: integer, source: computed, default: 0, description: "Read-only count of eligible units found by the most recent source search" }

  - name: Quote
    parent: null
    common_fields: true
    fields:
      - { name: aog_request_id, type: string, source: input, description: "FK -> AogRequest.id; exactly one non-terminal quote per AogRequest" }
      - { name: customer_id, type: string, source: input, description: "FK -> Customer.id; must equal the AogRequest customer" }
      - { name: lines, type: array, source: input, description: "Array of {part_id, quantity, sale_type, unit_price_cents, discount_pct, condition_required, lease_periods?}; sale_type OUTRIGHT | EXCHANGE | LOAN | LEASE; lease_periods integer >= 1 required when sale_type == LEASE" }
      - { name: validity_hours, type: integer, source: input, description: "Requested validity window in hours; must be >= 1 and <= the customer tier cap at issue time" }
      - { name: freight_mode, type: enum, source: input, default: STANDARD, description: "STANDARD | HOT_SHOT | CHARTER" }
      - { name: distance_km, type: integer, source: input, description: "Great-circle distance warehouse to destination; must be >= 1" }
      - { name: chargeable_weight_kg, type: integer, source: input, description: "Chargeable weight; must be >= 1" }
      - { name: destination_country, type: string, source: input, description: "ISO country code of the delivery airport country" }
      - { name: revision_count, type: integer, source: system, default: 0, description: "Increments on every revise transition" }
      - { name: status, type: enum, source: system, default: DRAFT, description: "DRAFT | ISSUED | ACCEPTED | REJECTED | EXPIRED | CANCELLED" }
      - { name: tier_at_issue, type: enum, source: system, description: "Snapshot of Customer.priority_tier taken at the issue transition; null while DRAFT" }
      - { name: issued_at, type: datetime, source: system, description: "Clock time of the ISSUED transition; null while DRAFT" }
      - { name: expires_at, type: datetime, source: system, description: "issued_at + validity_hours; null while DRAFT" }
      - { name: subtotal_cents, type: integer, source: computed, default: 0, description: "Sum of per-line totals (see quote_line_pricing); recomputed at create, revise and issue" }
      - { name: handling_fee_cents, type: integer, source: computed, default: 0, description: "Bracketed small-order handling fee (see quote_total_fees)" }
      - { name: tier_fee_cents, type: integer, source: computed, default: 0, description: "Priority-tier percentage fee (see quote_total_fees)" }
      - { name: freight_cost_cents, type: integer, source: computed, default: 0, description: "Freight charge (see freight_cost)" }
      - { name: total_cents, type: integer, source: computed, default: 0, description: "subtotal_cents + handling_fee_cents + tier_fee_cents; excludes freight" }
      - { name: max_penalty_cents, type: integer, source: computed, default: 0, description: "Provisional worst-case core penalty disclosure = sum of core_value_cents over EXCHANGE lines (see core_return_penalty PROVISIONAL variant)" }

  - name: SalesOrder
    parent: null
    common_fields: true
    fields:
      - { name: quote_id, type: string, source: system, description: "FK -> Quote.id; the accepted quote this order was created from; unique" }
      - { name: customer_id, type: string, source: system, description: "FK -> Customer.id; copied from the quote" }
      - { name: fulfillment_status, type: enum, source: system, default: PENDING_ALLOCATION, description: "PENDING_ALLOCATION | ALLOCATED | SHIPPED | DELIVERED | CLOSED. Parallel dimension 1" }
      - { name: compliance_status, type: enum, source: system, default: PENDING_SCREENING, description: "PENDING_SCREENING | CLEARED | EXPORT_HELD | BLOCKED. Parallel dimension 2" }
      - { name: payment_status, type: enum, source: system, default: UNBILLED, description: "UNBILLED | INVOICED | PAID. Parallel dimension 3" }
      - { name: invoiced_cents, type: integer, source: computed, default: 0, description: "Goods + fees invoiced at delivery (quote.total_cents); excludes freight and core deposits" }
      - { name: freight_mode, type: enum, source: system, description: "Copied from the accepted quote" }
      - { name: distance_km, type: integer, source: system, description: "Copied from the accepted quote" }
      - { name: chargeable_weight_kg, type: integer, source: system, description: "Copied from the accepted quote" }
      - { name: destination_country, type: string, source: system, description: "Copied from the accepted quote" }

  - name: OrderLine
    parent: null
    common_fields: true
    fields:
      - { name: order_id, type: string, source: system, description: "FK -> SalesOrder.id; owning order" }
      - { name: part_id, type: string, source: system, description: "FK -> PartMaster.id" }
      - { name: quantity, type: integer, source: system, description: "Always 1: quote lines are exploded per unit at order creation" }
      - { name: sale_type, type: enum, source: system, description: "OUTRIGHT | EXCHANGE | LOAN | LEASE" }
      - { name: condition_required, type: enum, source: system, description: "NEW | OVERHAULED | SERVICEABLE | AS_REMOVED" }
      - { name: unit_price_cents, type: integer, source: system, description: "Negotiated unit price copied from the quote line" }
      - { name: discount_pct, type: number, source: system, description: "Line discount fraction in [0, 1), copied from the quote line" }
      - { name: line_total_cents, type: integer, source: system, description: "Per-unit value: round_half_up(unit_price_cents * (1 - discount_pct)); fixed at order creation" }
      - { name: lease_periods, type: integer, source: system, description: "Contracted 30-day periods; only meaningful for LEASE lines; null otherwise" }
      - { name: allocated_unit_id, type: string, source: system, description: "FK -> InventoryUnit.id; null until allocated" }
      - { name: allocation_status, type: enum, source: system, default: PENDING, description: "PENDING | ALLOCATED" }
      - { name: delivered_at, type: datetime, source: system, description: "Clock time when the covering shipment was delivered; null until then" }

  - name: Shipment
    parent: null
    common_fields: true
    fields:
      - { name: order_id, type: string, source: input, description: "FK -> SalesOrder.id; exactly one shipment per order" }
      - { name: hazmat_declaration_ref, type: string, source: input, description: "Dangerous-goods declaration reference; required at tender when any line's part has hazmat_class != NONE" }
      - { name: export_license_ref, type: string, source: input, description: "Export license reference; required at tender when any line's part has export_control_code != EAR99" }
      - { name: depart_at, type: datetime, source: input, description: "Planned departure; required when the order freight_mode is CHARTER, forbidden otherwise" }
      - { name: arrive_at, type: datetime, source: input, description: "Planned arrival; required when CHARTER, must be strictly after depart_at" }
      - { name: charter_slot_id, type: string, source: input, description: "FK -> CharterSlot.id; required when CHARTER, forbidden otherwise" }
      - { name: freight_cost_cents, type: integer, source: computed, default: 0, description: "Copied from the order's quote freight_cost_cents at creation" }
      - { name: status, type: enum, source: system, default: DRAFT, description: "DRAFT | TENDERED | IN_TRANSIT | DELIVERED | EXCEPTION" }

  - name: CharterSlot
    parent: null
    common_fields: true
    fields:
      - { name: tail_number, type: string, source: input, description: "Charter aircraft tail; unique among CharterSlot rows" }
      - { name: home_base, type: string, source: input, description: "IATA home base airport" }
      - { name: status, type: enum, source: system, default: OPEN, description: "OPEN | BOOKED | RELEASED" }

  - name: CoreReturn
    parent: null
    common_fields: true
    fields:
      - { name: order_line_id, type: string, source: system, description: "FK -> OrderLine.id; one CoreReturn per EXCHANGE line" }
      - { name: customer_id, type: string, source: system, description: "FK -> Customer.id; denormalized from the order" }
      - { name: core_value_cents, type: integer, source: system, description: "Deposit held; snapshot of PartMaster.core_value_cents * line quantity at delivery" }
      - { name: due_at, type: datetime, source: system, description: "delivery clock time + 21 days" }
      - { name: received_at, type: datetime, source: system, description: "Clock time of core receipt; null until received" }
      - { name: days_overdue, type: integer, source: computed, default: 0, description: "0 while received_at <= due_at; else ceil((received_at - due_at) / 86400s)" }
      - { name: penalty_cents, type: integer, source: computed, default: 0, description: "Final penalty per core_return_penalty FINAL variant; 0 until receipt" }
      - { name: refunded_cents, type: integer, source: computed, default: 0, description: "Deposit refunded at inspect" }
      - { name: penalty_retained_cents, type: integer, source: computed, default: 0, description: "Portion of deposit retained as penalty at inspect" }
      - { name: forfeited_cents, type: integer, source: computed, default: 0, description: "Portion of deposit forfeited (REJECTED verdict) at inspect" }
      - { name: penalty_waived_cents, type: integer, source: computed, default: 0, description: "Cumulative waived penalty via waive-penalty" }
      - { name: status, type: enum, source: system, default: OPEN, description: "OPEN | OVERDUE | RECEIVED | SETTLED" }
      - { name: verdict, type: enum, source: system, description: "ACCEPTED | ACCEPTED_WITH_PENALTY | REJECTED; set at inspect; null until then" }

  - name: LoanAgreement
    parent: null
    common_fields: true
    fields:
      - { name: customer_id, type: string, source: input, description: "FK -> Customer.id; borrowing operator" }
      - { name: unit_id, type: string, source: input, description: "FK -> InventoryUnit.id; the rotable unit going out" }
      - { name: order_line_id, type: string, source: system, description: "FK -> OrderLine.id; set when the loan originates from an order delivery, null for desk-direct loans" }
      - { name: loan_type, type: enum, source: input, description: "LOAN | LEASE" }
      - { name: daily_rate_cents, type: integer, source: input, description: "Daily rate in cents; must be > 0" }
      - { name: lease_periods, type: integer, source: input, description: "Contracted 30-day periods; required when loan_type == LEASE, forbidden when LOAN" }
      - { name: start_at, type: datetime, source: input, description: "Loan window start; must not be in the past" }
      - { name: due_at, type: datetime, source: input, description: "Return deadline; strictly after start_at. For LEASE must equal start_at + lease_periods * 30 days" }
      - { name: returned_at, type: datetime, source: system, description: "Clock time of return; null until returned" }
      - { name: billed_cents, type: integer, source: computed, default: 0, description: "Cumulative amount billed (see loan_settlement)" }
      - { name: status, type: enum, source: system, default: ACTIVE, description: "ACTIVE | OVERDUE | RETURNED | DAMAGE_REVIEW | SETTLED" }

  - name: WarrantyClaim
    parent: null
    common_fields: true
    fields:
      - { name: customer_id, type: string, source: input, description: "FK -> Customer.id; claimant" }
      - { name: order_line_id, type: string, source: input, description: "FK -> OrderLine.id; the delivered line under claim" }
      - { name: fault_category, type: enum, source: input, description: "DOA | PREMATURE_FAILURE | COSMETIC" }
      - { name: description, type: string, source: input, description: "Free-text fault description" }
      - { name: months_in_service, type: integer, source: computed, default: 0, description: "floor((claim clock time - OrderLine.delivered_at) / (30*86400s))" }
      - { name: coverage_pct, type: number, source: computed, default: 0, description: "Coverage fraction per warranty_credit calculation" }
      - { name: credit_cents, type: integer, source: computed, default: 0, description: "Approved credit per warranty_credit; 0 until APPROVED" }
      - { name: reviewed_by, type: string, source: system, description: "X-User-ID of the WarrantyAdjuster who performed the most recent review" }
      - { name: reopen_count, type: integer, source: system, default: 0, description: "Number of REJECTED -> UNDER_REVIEW reopens; hard cap 1" }
      - { name: fraud_flag, type: boolean, source: input, default: false, description: "Adjuster-set marker on reject; increments Customer.warranty_fraud_flags" }
      - { name: status, type: enum, source: system, default: FILED, description: "FILED | UNDER_REVIEW | APPROVED | CREDIT_ISSUED | REJECTED" }

  - name: ReturnAuthorization
    parent: null
    common_fields: true
    fields:
      - { name: customer_id, type: string, source: input, description: "FK -> Customer.id; returning operator" }
      - { name: order_line_id, type: string, source: input, description: "FK -> OrderLine.id; the delivered OUTRIGHT line being returned" }
      - { name: reason, type: string, source: input, description: "Free-text return reason" }
      - { name: days_since_delivery, type: integer, source: computed, default: 0, description: "floor((receive clock time - OrderLine.delivered_at) / 86400s) at receipt; computed as floor((creation clock - delivered_at)/86400s) at creation" }
      - { name: restock_fee_cents, type: integer, source: computed, default: 0, description: "Restocking fee per restocking_fee calculation" }
      - { name: credit_cents, type: integer, source: computed, default: 0, description: "Credit issued at receipt (line_total_cents - restock_fee_cents when RESALEABLE; 0 when DAMAGED)" }
      - { name: condition_grade, type: enum, source: system, description: "RESALEABLE | DAMAGED; recorded at receipt; null until then" }
      - { name: status, type: enum, source: system, default: APPROVED, description: "APPROVED | RECEIVED | SETTLED" }

  - name: AccountLedgerEntry
    parent: null
    common_fields: false
    fields:
      - { name: customer_id, type: string, source: system, description: "FK -> Customer.id; account owner" }
      - { name: entry_type, type: enum, source: system, description: "INVOICE_DEBIT | CORE_DEPOSIT_DEBIT | FREIGHT_DEBIT | LOAN_DEBIT | LEASE_DEBIT | CORE_REFUND_CREDIT | WARRANTY_CREDIT | RESTOCK_CREDIT | WAIVER_CREDIT | PAYMENT_CREDIT | MANUAL_DEBIT | MANUAL_CREDIT" }
      - { name: amount_cents, type: integer, source: system, description: "Positive amount in cents; debits increase, credits decrease outstanding_balance_cents" }
      - { name: reference_type, type: enum, source: system, description: "SALES_ORDER | SHIPMENT | CORE_RETURN | LOAN_AGREEMENT | WARRANTY_CLAIM | RETURN_AUTH | CUSTOMER; polymorphic companion of reference_id (not a fixed FK)" }
      - { name: reference_id, type: string, source: system, description: "id of the referenced entity; polymorphic, resolved via reference_type" }
      - { name: memo, type: string, source: input, description: "Optional operator note on manual entries" }

# =============================================================================
# 1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Customer
    initial_state: ACTIVE
    terminal_states: []
    transitions:
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /aog/customers/{id}/suspend, or POST /_system/run-sweeps when outstanding_balance_cents > credit_limit_cents"
        actor: FinanceController | system
        preconditions:
          - "Customer.status == ACTIVE (ERR_INVALID_STATE)"
          - "System path: outstanding_balance_cents > credit_limit_cents strictly (balance == limit does NOT suspend)"
        side_effects:
          - "Customer.version increments by 1"
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /aog/customers/{id}/reactivate"
        actor: FinanceController
        preconditions:
          - "Customer.status == SUSPENDED (ERR_INVALID_STATE)"
          - "outstanding_balance_cents <= credit_limit_cents (ERR_CREDIT_LIMIT_EXCEEDED)"
        side_effects:
          - "Customer.version increments by 1"

  - entity: AogRequest
    initial_state: OPEN
    terminal_states: [FULFILLED, CLOSED, CANCELLED]
    transitions:
      - from: OPEN
        to: QUOTED
        trigger: "POST /aog/quotes/{id}/issue on a quote referencing this request"
        actor: AogDeskAgent
        preconditions: []
        side_effects:
          - "AogRequest.version increments by 1"
      - from: QUOTED
        to: FULFILLING
        trigger: "POST /aog/quotes/{id}/accept (cascade from quote acceptance)"
        actor: CustomerContact
        preconditions: []
        side_effects:
          - "AogRequest.version increments by 1"
      - from: FULFILLING
        to: FULFILLED
        trigger: "POST /aog/shipments/{id}/deliver on the order's shipment (cascade)"
        actor: WarehouseOperator
        preconditions: []
        side_effects:
          - "AogRequest.version increments by 1"
      - from: FULFILLED
        to: CLOSED
        trigger: "system (automatic when every CoreReturn and LoanAgreement derived from the order is SETTLED)"
        actor: system
        preconditions: []
        side_effects: []
      - from: OPEN
        to: CANCELLED
        trigger: "POST /aog/aog-requests/{id}/cancel"
        actor: AogDeskAgent | CustomerContact
        preconditions:
          - "CustomerContact caller: AogRequest.customer_id == X-User-ID (ERR_FORBIDDEN)"
        side_effects:
          - "If reserved_unit_id is set, that unit transitions RESERVED -> AVAILABLE and reserved_by_request_id is cleared; reserved_unit_id set to null"
      - from: QUOTED
        to: CANCELLED
        trigger: "POST /aog/aog-requests/{id}/cancel"
        actor: AogDeskAgent
        preconditions:
          - "Every DRAFT or ISSUED quote for this request is CANCELLED in the same request (cascade)"
        side_effects:
          - "All non-terminal Quote rows for this request -> CANCELLED"
          - "If reserved_unit_id is set, that unit transitions RESERVED -> AVAILABLE; reserved_unit_id set to null"

  - entity: Quote
    initial_state: DRAFT
    terminal_states: [ACCEPTED, CANCELLED]
    transitions:
      - from: DRAFT
        to: ISSUED
        trigger: "POST /aog/quotes/{id}/issue"
        actor: AogDeskAgent
        preconditions:
          - "Customer.status == ACTIVE (ERR_CUSTOMER_SUSPENDED)"
          - "validity_hours <= tier cap: STANDARD 24, PRIORITY 48, PLATINUM 72 (ERR_VALIDITY_EXCEEDS_TIER_CAP)"
        side_effects:
          - "tier_at_issue := Customer.priority_tier (snapshot)"
          - "issued_at := clock; expires_at := issued_at + validity_hours hours"
          - "Recompute subtotal_cents, handling_fee_cents, tier_fee_cents, total_cents, freight_cost_cents, max_penalty_cents"
          - "AogRequest -> QUOTED (cascade)"
          - "Quote.version increments by 1"
      - from: ISSUED
        to: ACCEPTED
        trigger: "POST /aog/quotes/{id}/accept"
        actor: CustomerContact
        preconditions:
          - "CustomerContact caller: Quote.customer_id == X-User-ID (ERR_FORBIDDEN)"
          - "clock <= expires_at; a quote past expires_at is treated as EXPIRED even before any sweep (ERR_QUOTE_EXPIRED)"
          - "expected_quote_version == Quote.version (ERR_STALE_QUOTE_VERSION, 412)"
          - "Customer.status == ACTIVE (ERR_CUSTOMER_SUSPENDED)"
          - "Customer.outstanding_balance_cents + total_cents + sum(core_value_cents * quantity over EXCHANGE lines) <= credit_limit_cents; equality passes (ERR_CREDIT_LIMIT_EXCEEDED, 402)"
        side_effects:
          - "Create SalesOrder (quote_id=this, fulfillment PENDING_ALLOCATION, compliance PENDING_SCREENING, payment UNBILLED)"
          - "Explode each quote line per unit: create `quantity` OrderLine rows, each quantity=1, line_total_cents = round_half_up(unit_price_cents * (1 - discount_pct)), allocation PENDING"
          - "If AogRequest.reserved_unit_id is set: that InventoryUnit stays RESERVED (awaiting allocate); reserved_by_request_id unchanged"
          - "AogRequest QUOTED -> FULFILLING (cascade; bumps AogRequest.version)"
          - "Quote.version increments by 1"
      - from: ISSUED
        to: REJECTED
        trigger: "POST /aog/quotes/{id}/reject"
        actor: CustomerContact
        preconditions:
          - "CustomerContact caller: Quote.customer_id == X-User-ID (ERR_FORBIDDEN)"
        side_effects:
          - "Quote.version increments by 1"
      - from: REJECTED
        to: DRAFT
        trigger: "POST /aog/quotes/{id}/revise"
        actor: AogDeskAgent
        preconditions:
          - "expected_quote_version == Quote.version (ERR_STALE_QUOTE_VERSION, 412)"
        side_effects:
          - "Apply any provided lines/validity_hours/freight_mode/distance_km/chargeable_weight_kg/destination_country overrides"
          - "revision_count += 1; issued_at/expires_at/tier_at_issue cleared to null"
          - "Recompute all computed price fields"
          - "Quote.version increments by 1 (cyclic loop DRAFT->ISSUED->REJECTED->DRAFT)"
      - from: EXPIRED
        to: DRAFT
        trigger: "POST /aog/quotes/{id}/revise"
        actor: AogDeskAgent
        preconditions:
          - "expected_quote_version == Quote.version (ERR_STALE_QUOTE_VERSION, 412)"
        side_effects:
          - "Same as REJECTED -> DRAFT revise"
      - from: ISSUED
        to: EXPIRED
        trigger: "POST /_system/run-sweeps when clock > expires_at"
        actor: system
        preconditions: []
        side_effects:
          - "Quote.version increments by 1"
          - "If AogRequest has no other ISSUED quote: AogRequest remains QUOTED (no revert)"
      - from: DRAFT
        to: CANCELLED
        trigger: "POST /aog/quotes/{id}/cancel"
        actor: AogDeskAgent
        preconditions: []
        side_effects:
          - "Quote.version increments by 1"

  - entity: SalesOrder
    initial_state: "fulfillment=PENDING_ALLOCATION, compliance=PENDING_SCREENING, payment=UNBILLED"
    terminal_states: ["fulfillment=CLOSED"]
    transitions:
      - from: "fulfillment=PENDING_ALLOCATION"
        to: "fulfillment=ALLOCATED"
        trigger: "system (automatic when every OrderLine of the order reaches allocation_status == ALLOCATED)"
        actor: system
        preconditions: []
        side_effects:
          - "SalesOrder.version increments by 1"
      - from: "fulfillment=ALLOCATED"
        to: "fulfillment=SHIPPED"
        trigger: "POST /aog/shipments/{id}/tender (cascade)"
        actor: WarehouseOperator
        preconditions: []
        side_effects: []
      - from: "fulfillment=SHIPPED"
        to: "fulfillment=DELIVERED"
        trigger: "POST /aog/shipments/{id}/deliver (cascade)"
        actor: WarehouseOperator
        preconditions: []
        side_effects:
          - "payment: UNBILLED -> INVOICED"
          - "invoiced_cents := quote.total_cents"
          - "Post AccountLedgerEntry INVOICE_DEBIT invoiced_cents (reference SALES_ORDER); recompute Customer.outstanding_balance_cents (cascade link: deliver -> order DELIVERED -> invoice debit -> balance recompute)"
          - "Post CORE_DEPOSIT_DEBIT per EXCHANGE line (core_value_cents * quantity); recompute balance"
          - "Create one CoreReturn per EXCHANGE line (due_at = clock + 21 days)"
          - "Create one LoanAgreement per LOAN/LEASE line (start_at = clock, ACTIVE, unit ON_LOAN; LOAN due_at = clock + 30d; LEASE due_at = clock + lease_periods*30d)"
          - "OrderLine.delivered_at := clock for all lines"
          - "AogRequest FULFILLING -> FULFILLED (cascade)"
      - from: "fulfillment=DELIVERED"
        to: "fulfillment=CLOSED"
        trigger: "system (automatic when every CoreReturn and LoanAgreement of the order is SETTLED)"
        actor: system
        preconditions: []
        side_effects:
          - "AogRequest FULFILLED -> CLOSED (cascade)"
      - from: "compliance=PENDING_SCREENING"
        to: "compliance=CLEARED"
        trigger: "POST /aog/orders/{id}/compliance-decision {decision: CLEARED}"
        actor: ComplianceOfficer
        preconditions: []
        side_effects:
          - "SalesOrder.version increments by 1"
      - from: "compliance=PENDING_SCREENING"
        to: "compliance=EXPORT_HELD"
        trigger: "POST /aog/orders/{id}/compliance-decision {decision: EXPORT_HELD}"
        actor: ComplianceOfficer
        preconditions: []
        side_effects:
          - "SalesOrder.version increments by 1"
      - from: "compliance=EXPORT_HELD"
        to: "compliance=CLEARED"
        trigger: "POST /aog/orders/{id}/compliance-decision {decision: CLEARED}"
        actor: ComplianceOfficer
        preconditions: []
        side_effects:
          - "SalesOrder.version increments by 1"
      - from: "compliance=EXPORT_HELD"
        to: "compliance=BLOCKED"
        trigger: "POST /aog/orders/{id}/compliance-decision {decision: BLOCKED}"
        actor: ComplianceOfficer
        preconditions:
          - "destination is a denied country OR export license denied (recorded in decision_memo)"
        side_effects:
          - "All allocated lines are released (InventoryUnit ALLOCATED -> AVAILABLE, OrderLine.allocation_status -> PENDING); fulfillment reverts ALLOCATED -> PENDING_ALLOCATION"
          - "SalesOrder.version increments by 1"
      - from: "payment=INVOICED"
        to: "payment=PAID"
        trigger: "system (automatic when cumulative PAYMENT_CREDIT entries referencing this order >= invoiced_cents)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: InventoryUnit
    initial_state: AVAILABLE
    terminal_states: [SOLD, SCRAPPED]
    transitions:
      - from: AVAILABLE
        to: RESERVED
        trigger: "POST /aog/aog-requests/{id}/source-search selecting this unit"
        actor: AogDeskAgent
        preconditions:
          - "Unit wins the sourcing_rank selector for the request"
        side_effects:
          - "reserved_by_request_id := request id"
          - "PartMaster.available_count -= 1; PartMaster.reserved_count += 1"
      - from: RESERVED
        to: AVAILABLE
        trigger: "AogRequest cancel cascade, quote expiry sweep releasing the pin, or POST /aog/order-lines/{id}/release before allocation"
        actor: system | WarehouseOperator
        preconditions: []
        side_effects:
          - "reserved_by_request_id := null"
          - "PartMaster.available_count += 1; PartMaster.reserved_count -= 1"
      - from: RESERVED
        to: ALLOCATED
        trigger: "POST /aog/order-lines/{id}/allocate on a line of the order created from the reserving request's quote"
        actor: WarehouseOperator
        preconditions:
          - "Unit.condition == OrderLine.condition_required (ERR_CONDITION_NOT_ACCEPTABLE)"
          - "trace_doc_level rank >= the originating AogRequest.min_trace_doc rank (ERR_TRACE_DOC_INSUFFICIENT)"
        side_effects:
          - "PartMaster.reserved_count -= 1"
          - "OrderLine.allocation_status := ALLOCATED; allocated_unit_id := unit id"
      - from: AVAILABLE
        to: ALLOCATED
        trigger: "POST /aog/order-lines/{id}/allocate with explicit unit_id"
        actor: WarehouseOperator
        preconditions:
          - "Unit.condition == OrderLine.condition_required (ERR_CONDITION_NOT_ACCEPTABLE)"
          - "trace_doc_level rank >= the originating AogRequest.min_trace_doc rank (ERR_TRACE_DOC_INSUFFICIENT)"
        side_effects:
          - "PartMaster.available_count -= 1"
          - "OrderLine.allocation_status := ALLOCATED; allocated_unit_id := unit id"
      - from: ALLOCATED
        to: AVAILABLE
        trigger: "POST /aog/order-lines/{id}/release, or compliance BLOCKED cascade"
        actor: WarehouseOperator | system
        preconditions:
          - "Order fulfillment_status != SHIPPED/DELIVERED/CLOSED (ERR_INVALID_STATE)"
        side_effects:
          - "PartMaster.available_count += 1"
          - "OrderLine.allocation_status := PENDING; allocated_unit_id := null"
      - from: ALLOCATED
        to: SHIPPED
        trigger: "POST /aog/shipments/{id}/tender (cascade)"
        actor: WarehouseOperator
        preconditions: []
        side_effects: []
      - from: SHIPPED
        to: SOLD
        trigger: "POST /aog/shipments/{id}/deliver for OUTRIGHT or EXCHANGE lines (cascade)"
        actor: WarehouseOperator
        preconditions: []
        side_effects: []
      - from: SHIPPED
        to: ON_LOAN
        trigger: "POST /aog/shipments/{id}/deliver for LOAN/LEASE lines (cascade)"
        actor: WarehouseOperator
        preconditions: []
        side_effects: []
      - from: ON_LOAN
        to: UNDER_INSPECTION
        trigger: "POST /aog/loans/{id}/return (cascade)"
        actor: WarehouseOperator
        preconditions: []
        side_effects: []
      - from: UNDER_INSPECTION
        to: AVAILABLE
        trigger: "POST /aog/loans/{id}/return with damage_flag=false (same-request cascade), or POST /aog/core-returns/{id}/inspect verdict ACCEPTED / ACCEPTED_WITH_PENALTY (cascade), or POST /aog/return-authorizations/{id}/receive with condition_grade=RESALEABLE (cascade)"
        actor: WarehouseOperator
        preconditions: []
        side_effects:
          - "PartMaster.available_count += 1"
      - from: UNDER_INSPECTION
        to: QUARANTINED
        trigger: "POST /aog/loans/{id}/return with damage_flag=true (same-request cascade), or POST /aog/return-authorizations/{id}/receive with condition_grade=DAMAGED (cascade)"
        actor: WarehouseOperator
        preconditions: []
        side_effects: []
      - from: QUARANTINED
        to: SCRAPPED
        trigger: "system (automatic at the next POST /_system/run-sweeps)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: Shipment
    initial_state: DRAFT
    terminal_states: [DELIVERED]
    transitions:
      - from: DRAFT
        to: TENDERED
        trigger: "POST /aog/shipments/{id}/tender"
        actor: WarehouseOperator
        preconditions:
          - "SalesOrder.compliance_status == CLEARED (ERR_COMPLIANCE_NOT_CLEARED)"
          - "SalesOrder.fulfillment_status == ALLOCATED (ERR_INVALID_STATE)"
          - "If any line's part hazmat_class != NONE: hazmat_declaration_ref present (ERR_HAZMAT_DECLARATION_MISSING)"
          - "If any line's part export_control_code != EAR99: export_license_ref present (ERR_EXPORT_LICENSE_REQUIRED)"
          - "If destination_country is KP, CU, IR, SY: always rejected (ERR_EXPORT_DESTINATION_DENIED)"
        side_effects:
          - "Allocated units of all lines: ALLOCATED -> SHIPPED"
          - "SalesOrder.fulfillment ALLOCATED -> SHIPPED"
          - "When freight_mode == CHARTER: CharterSlot OPEN -> BOOKED"
      - from: TENDERED
        to: IN_TRANSIT
        trigger: "system (automatic immediately after tender succeeds)"
        actor: system
        preconditions: []
        side_effects: []
      - from: IN_TRANSIT
        to: DELIVERED
        trigger: "POST /aog/shipments/{id}/deliver"
        actor: WarehouseOperator
        preconditions: []
        side_effects:
          - "Full delivery cascade per SalesOrder SHIPPED -> DELIVERED (invoice, deposits, core returns, loans, unit SOLD/ON_LOAN, AogRequest FULFILLED)"
      - from: TENDERED
        to: EXCEPTION
        trigger: "POST /aog/shipments/{id}/deliver cannot proceed — not used; EXCEPTION only via sweep when clock > arrive_at + 48h for CHARTER"
        actor: system
        preconditions: []
        side_effects: []
      - from: EXCEPTION
        to: IN_TRANSIT
        trigger: "POST /aog/shipments/{id}/tender (re-tender after exception)"
        actor: WarehouseOperator
        preconditions:
          - "Same preconditions as DRAFT -> TENDERED"
        side_effects: []

  - entity: CharterSlot
    initial_state: OPEN
    terminal_states: [RELEASED]
    transitions:
      - from: OPEN
        to: BOOKED
        trigger: "POST /aog/shipments/{id}/tender on a CHARTER shipment referencing this slot"
        actor: WarehouseOperator
        preconditions: []
        side_effects: []
      - from: OPEN
        to: RELEASED
        trigger: "POST /aog/charter-slots/{id}/release"
        actor: AogDeskAgent
        preconditions: []
        side_effects: []
      - from: BOOKED
        to: OPEN
        trigger: "POST /aog/charter-slots/{id}/release (un-book; allowed until the referencing shipment is DELIVERED)"
        actor: AogDeskAgent
        preconditions:
          - "No TENDERED/IN_TRANSIT shipment references this slot (ERR_INVALID_STATE)"
        side_effects: []

  - entity: CoreReturn
    initial_state: OPEN
    terminal_states: [SETTLED]
    transitions:
      - from: OPEN
        to: OVERDUE
        trigger: "POST /_system/run-sweeps when clock > due_at"
        actor: system
        preconditions: []
        side_effects:
          - "CoreReturn.version increments by 1"
      - from: OPEN
        to: RECEIVED
        trigger: "POST /aog/core-returns/{id}/receive"
        actor: WarehouseOperator
        preconditions: []
        side_effects:
          - "received_at := clock; days_overdue computed (0 when received_at <= due_at)"
          - "penalty_cents := core_return_penalty FINAL variant"
          - "Create inbound InventoryUnit (same part_id, condition AS_REMOVED, status UNDER_INSPECTION, serial_number from payload core_serial_number)"
      - from: OVERDUE
        to: RECEIVED
        trigger: "POST /aog/core-returns/{id}/receive"
        actor: WarehouseOperator
        preconditions: []
        side_effects:
          - "Same as OPEN -> RECEIVED"
      - from: RECEIVED
        to: SETTLED
        trigger: "POST /aog/core-returns/{id}/inspect with verdict ACCEPTED | ACCEPTED_WITH_PENALTY | REJECTED (branching)"
        actor: WarehouseOperator
        preconditions:
          - "verdict == REJECTED requires reject_reason in payload (ERR_INVALID_REQUEST)"
          - "verdict == ACCEPTED_WITH_PENALTY requires penalty_cents > 0 (ERR_INVALID_REQUEST)"
        side_effects:
          - "Branch ACCEPTED: refunded_cents := core_value_cents; penalty_retained_cents := 0; forfeited_cents := 0; inbound unit UNDER_INSPECTION -> AVAILABLE"
          - "Branch ACCEPTED_WITH_PENALTY: penalty_retained_cents := penalty_cents - penalty_waived_cents; refunded_cents := core_value_cents - penalty_retained_cents; forfeited_cents := 0; inbound unit UNDER_INSPECTION -> AVAILABLE"
          - "Branch REJECTED: forfeited_cents := core_value_cents - penalty_waived_cents; refunded_cents := 0; penalty_retained_cents := penalty_waived_cents; inbound unit -> QUARANTINED"
          - "Post CORE_REFUND_CREDIT refunded_cents when > 0 (reference CORE_RETURN); recompute Customer.outstanding_balance_cents"
          - "Post WAIVER_CREDIT only via waive-penalty, never implicitly"
          - "Invariant at SETTLED: core_value_cents == refunded_cents + penalty_retained_cents + forfeited_cents"
          - "Tier metrics core_returns_settled_180d / core_returns_on_time_180d recomputed at next sweep"

  - entity: LoanAgreement
    initial_state: ACTIVE
    terminal_states: [SETTLED]
    transitions:
      - from: ACTIVE
        to: OVERDUE
        trigger: "POST /_system/run-sweeps when clock > due_at"
        actor: system
        preconditions: []
        side_effects:
          - "LoanAgreement.version increments by 1"
      - from: ACTIVE
        to: RETURNED
        trigger: "POST /aog/loans/{id}/return with damage_flag=false"
        actor: WarehouseOperator
        preconditions: []
        side_effects:
          - "returned_at := clock; billed_cents := loan_settlement (LOAN or LEASE variant)"
          - "Post LOAN_DEBIT or LEASE_DEBIT for any unbilled remainder; recompute Customer.outstanding_balance_cents"
          - "Unit ON_LOAN -> UNDER_INSPECTION -> AVAILABLE (same-request cascade)"
          - "LoanAgreement transitions RETURNED -> SETTLED immediately (same request)"
      - from: OVERDUE
        to: RETURNED
        trigger: "POST /aog/loans/{id}/return with damage_flag=false"
        actor: WarehouseOperator
        preconditions: []
        side_effects:
          - "Same as ACTIVE -> RETURNED including late-day billing"
      - from: ACTIVE
        to: DAMAGE_REVIEW
        trigger: "POST /aog/loans/{id}/return with damage_flag=true"
        actor: WarehouseOperator
        preconditions: []
        side_effects:
          - "returned_at := clock; billed_cents computed as normal (damage billing is out of scope and handled by warranty/claims offline)"
          - "Unit ON_LOAN -> UNDER_INSPECTION -> QUARANTINED (same-request cascade)"
      - from: OVERDUE
        to: DAMAGE_REVIEW
        trigger: "POST /aog/loans/{id}/return with damage_flag=true"
        actor: WarehouseOperator
        preconditions: []
        side_effects:
          - "Same as ACTIVE -> DAMAGE_REVIEW"
      - from: RETURNED
        to: SETTLED
        trigger: "system (same-request cascade after billing posts)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: WarrantyClaim
    initial_state: FILED
    terminal_states: [CREDIT_ISSUED, REJECTED]
    transitions:
      - from: FILED
        to: UNDER_REVIEW
        trigger: "POST /aog/warranty-claims/{id}/review"
        actor: WarrantyAdjuster
        preconditions: []
        side_effects:
          - "reviewed_by := X-User-ID"
      - from: UNDER_REVIEW
        to: APPROVED
        trigger: "POST /aog/warranty-claims/{id}/approve"
        actor: WarrantyApprover
        preconditions:
          - "X-User-ID != reviewed_by (ERR_SEGREGATION_OF_DUTIES, 403)"
        side_effects:
          - "credit_cents := warranty_credit result"
          - "Post WARRANTY_CREDIT credit_cents (reference WARRANTY_CLAIM); recompute Customer.outstanding_balance_cents"
          - "Transition APPROVED -> CREDIT_ISSUED immediately (same request)"
      - from: APPROVED
        to: CREDIT_ISSUED
        trigger: "system (same-request cascade)"
        actor: system
        preconditions: []
        side_effects: []
      - from: UNDER_REVIEW
        to: REJECTED
        trigger: "POST /aog/warranty-claims/{id}/reject"
        actor: WarrantyApprover
        preconditions:
          - "X-User-ID != reviewed_by (ERR_SEGREGATION_OF_DUTIES, 403)"
        side_effects:
          - "If fraud_flag true: Customer.warranty_fraud_flags += 1 (applied at next sweep's tier recompute)"
      - from: REJECTED
        to: UNDER_REVIEW
        trigger: "POST /aog/warranty-claims/{id}/review (reopen)"
        actor: WarrantyAdjuster
        preconditions:
          - "reopen_count < 1 (ERR_REOPEN_LIMIT_REACHED)"
        side_effects:
          - "reopen_count += 1; reviewed_by := X-User-ID"

  - entity: ReturnAuthorization
    initial_state: APPROVED
    terminal_states: [SETTLED]
    transitions:
      - from: APPROVED
        to: RECEIVED
        trigger: "POST /aog/return-authorizations/{id}/receive"
        actor: WarehouseOperator
        preconditions: []
        side_effects:
          - "condition_grade := payload value; days_since_delivery recomputed at receipt clock"
          - "RESALEABLE: restock_fee_cents := restocking_fee; credit_cents := line_total_cents - restock_fee_cents; unit SHIPPED -> UNDER_INSPECTION -> AVAILABLE (same-request cascade); post RESTOCK_CREDIT credit_cents; recompute balance"
          - "DAMAGED: restock_fee_cents := 0; credit_cents := 0; unit SHIPPED -> UNDER_INSPECTION -> QUARANTINED (same-request cascade); no ledger entry"
      - from: RECEIVED
        to: SETTLED
        trigger: "system (same-request cascade after credit posts)"
        actor: system
        preconditions: []
        side_effects: []

# =============================================================================
# 1.2.1 Concurrency Rules (OCC only)
# =============================================================================
concurrency_rules:
  - rule_id: quote-accept-stale-version
    parent_entity: Quote
    write_endpoint: "POST /aog/quotes/{id}/accept"
    occ_field: expected_quote_version
    description: |
      Accepting a Quote whose version has advanced since the customer last
      observed it is rejected: a revise cycle may have re-priced the quote, so
      an accept carrying a stale expected_quote_version must not bind the
      customer to terms they never saw.
    error_id: ERR_STALE_QUOTE_VERSION
    http_status: 412
  - rule_id: quote-revise-stale-version
    parent_entity: Quote
    write_endpoint: "POST /aog/quotes/{id}/revise"
    occ_field: expected_quote_version
    description: |
      Revising a Quote whose version has advanced since the desk agent last
      observed it is rejected: another writer may already have revised it back
      to DRAFT and re-issued it, so a stale expected_quote_version indicates
      the caller's view of the revision lineage is out of date.
    error_id: ERR_STALE_QUOTE_VERSION
    http_status: 412
  - rule_id: customer-adjust-stale-version
    parent_entity: Customer
    write_endpoint: "POST /aog/customers/{id}/credit-adjustments"
    occ_field: expected_customer_version
    description: |
      Posting a manual or payment adjustment against a Customer whose version
      has advanced since the controller last read the account is rejected:
      cascaded ledger postings (invoices, debits, waivers) advance the version,
      so a stale expected_customer_version would apply the adjustment to a
      balance the caller never observed.
    error_id: ERR_STALE_CUSTOMER_VERSION
    http_status: 412

# =============================================================================
# 1.3 Calculation Rules Table
# All money in integer cents; round_half_up to whole cents wherever noted.
# =============================================================================
calculations:
  - name: quote_line_pricing
    trigger: "Quote create, revise, and issue"
    algorithm: aggregation
    formula: |
      per line: line_total_cents = round_half_up(unit_price_cents * quantity * (1 - discount_pct))
      subtotal_cents = sum(line_total_cents over all lines)
      PINNED ROUNDING ORDER: round each line FIRST, then sum the rounded
      line totals. Sum-then-round is forbidden (it can differ by >= 1 cent).
    input_set: "Quote.lines as supplied in the request (all lines, any sale_type)"
    constants:
      ROUNDING: round_half_up
    precision: "integer cents, round_half_up per line before summation"

  - name: quote_total_fees
    trigger: "Quote create, revise, and issue (after quote_line_pricing)"
    algorithm: tiered_pricing
    formula: |
      # Circular-looking dependency, PINNED evaluation order:
      # (1) subtotal_cents from quote_line_pricing
      # (2) handling_fee bracket is evaluated on the PRE-FEE subtotal only:
      #       subtotal < 100000            -> handling_fee_cents = 9500
      #       100000 <= subtotal <= 1000000 -> handling_fee_cents = 4500
      #       subtotal > 1000000           -> handling_fee_cents = 0
      #     (Evaluating the bracket on the post-fee amount is forbidden even
      #     though the prose 'order value including handling' suggests it.)
      # (3) tier_fee_cents = round_half_up((subtotal_cents + handling_fee_cents) * tier_fee_pct)
      #     where tier_fee_pct is taken from the tier in effect: at issue use
      #     the tier_at_issue snapshot; while DRAFT use the customer's current tier.
      # (4) total_cents = subtotal_cents + handling_fee_cents + tier_fee_cents  (excludes freight)
    input_set: "Quote.lines, Customer.priority_tier (current for DRAFT, snapshot for ISSUED)"
    constants:
      HANDLING_BRACKET_1_MAX: 100000
      HANDLING_BRACKET_2_MAX: 1000000
      HANDLING_FEE_SMALL: 9500
      HANDLING_FEE_MID: 4500
      TIER_FEE_PCT: { STANDARD: 0.06, PRIORITY: 0.03, PLATINUM: 0.0 }
    precision: "integer cents, round_half_up"

  - name: freight_cost
    trigger: "Quote create, revise, and issue; copied onto Shipment at creation"
    algorithm: tiered_pricing
    formula: |
      # Combinatorial: weight bracket x distance multiplier x mode premium x surcharges.
      base_per_kg = 1200 if chargeable_weight_kg <= 5
                    900 if 5 < chargeable_weight_kg <= 20
                    650 if 20 < chargeable_weight_kg <= 100
                    480 if chargeable_weight_kg > 100
      dist_mult   = 1.0  if distance_km < 1000
                    1.35 if 1000 <= distance_km <= 4000
                    1.8  if distance_km > 4000
      STANDARD:  base = base_per_kg * chargeable_weight_kg * dist_mult; premium = 0
      HOT_SHOT:  base = base_per_kg * chargeable_weight_kg * dist_mult; premium = 250000
      CHARTER:   base = max(750000, 2900 * distance_km); premium = 0   # weight ignored for charter
      subtotal = base + premium
      if any line's part hazmat_class != NONE: subtotal = subtotal * 1.25
      if AogRequest.escalated == true:          subtotal = subtotal * 1.25
      freight_cost_cents = round_half_up(subtotal)   # round ONCE at the very end
    input_set: "Quote.freight_mode, distance_km, chargeable_weight_kg, hazmat flag over lines, AogRequest.escalated"
    constants:
      HOT_SHOT_PREMIUM: 250000
      CHARTER_MIN: 750000
      CHARTER_PER_KM: 2900
      HAZMAT_MULT: 1.25
      ESCALATION_MULT: 1.25
    precision: "integer cents, single round_half_up at the end"
    variants:
      - name: charter_flat_floor
        when: "freight_mode == CHARTER"
        difference: "per-kg/weight math ignored entirely; max(CHARTER_MIN, CHARTER_PER_KM * distance_km)"

  - name: core_return_penalty
    trigger: "PROVISIONAL: Quote create/revise/issue (disclosure field max_penalty_cents). FINAL: CoreReturn receive."
    algorithm: threshold
    formula: |
      FINAL (chronological, at receipt):
        days_overdue = 0 if received_at <= due_at else ceil((received_at - due_at) / 86400)
        accrual = 0.005 * core_value_cents * min(days_overdue, 7)
                + 0.01  * core_value_cents * max(0, min(days_overdue, 21) - 7)
        penalty_cents = min(core_value_cents,
                            (25000 if days_overdue >= 1 else 0) + round_half_up(accrual))
      PROVISIONAL (quote-time disclosure): max_penalty_cents = sum of
      core_value_cents * quantity over EXCHANGE lines (worst-case forfeiture).
    input_set: "FINAL: the single CoreReturn. PROVISIONAL: EXCHANGE lines of the quote."
    constants:
      LATE_FEE: 25000
      TIER1_DAYS: 7
      TIER1_RATE: 0.005
      TIER2_DAYS: 21
      TIER2_RATE: 0.01
    precision: "integer cents, round_half_up on the accrual before adding LATE_FEE"
    variants:
      - name: PROVISIONAL
        when: "quote issuance disclosure"
        difference: "forward-looking worst case: full core forfeiture; ignores any calendar position"
      - name: FINAL
        when: "physical core receipt"
        difference: "chronological accrual by actual days overdue; same core returns different numbers than PROVISIONAL"

  - name: loan_settlement
    trigger: "POST /aog/loans/{id}/return; LEASE also bills at activation and at each crossed 30-day boundary during POST /_system/run-sweeps"
    algorithm: chronological
    formula: |
      actual_days = ceil((returned_at - start_at) / 86400)   # minimum 1
      LOAN variant (bill everything at return):
        on_time_days = min(actual_days, floor((due_at - start_at)/86400))
        late_days    = max(0, actual_days - on_time_days)
        billed_cents = on_time_days * daily_rate_cents
                     + round_half_up(late_days * daily_rate_cents * 1.5)
      LEASE variant (forward billing, no late multiplier, no early-return credit):
        periods_used = ceil(actual_days / 30)
        periods_billable = min(lease_periods, periods_used)
        + extra full periods when periods_used > lease_periods
        billed_cents = max(lease_periods, periods_used) * 30 * daily_rate_cents
        # period debits of 30 * daily_rate_cents are posted at activation and
        # per crossed boundary by the sweep; return posts only the remainder so
        # that cumulative debits == billed_cents.
    input_set: "the single LoanAgreement"
    constants:
      PERIOD_DAYS: 30
      LATE_MULT: 1.5
    precision: "integer cents, round_half_up"
    variants:
      - name: LOAN
        when: "loan_type == LOAN"
        difference: "chronological actual-days billing with 1.5x late tier, all at return"
      - name: LEASE
        when: "loan_type == LEASE"
        difference: "forward-looking whole-period billing (partial period rounds UP), no late multiplier; identical dates yield a different total than LOAN"

  - name: customer_priority_tier
    trigger: "POST /_system/run-sweeps (after core/loan processing)"
    algorithm: threshold
    formula: |
      window: CoreReturn rows of the customer with status SETTLED and received_at
              within (clock - 180d, clock]  # trailing 180 days, exclusive start
      count   = core_returns_settled_180d
      on_time = core_returns_on_time_180d
      rate    = if count == 0 then 0 else on_time / count
      tier = PLATINUM if count >= 2 and rate >= 0.95 and warranty_fraud_flags == 0
             PRIORITY if count >= 1 and rate >= 0.90 and warranty_fraud_flags == 0
             STANDARD otherwise
    input_set: "SETTLED CoreReturn rows of the customer in the trailing 180-day window"
    constants:
      WINDOW_DAYS: 180
      PLATINUM_MIN_COUNT: 2
      PLATINUM_MIN_RATE: 0.95
      PRIORITY_MIN_COUNT: 1
      PRIORITY_MIN_RATE: 0.90
    precision: "rate compared exactly at the stated boundaries (>=)"

  - name: sourcing_rank
    trigger: "POST /aog/aog-requests/{id}/source-search"
    algorithm: constraint_propagation
    formula: |
      eligibility filter: InventoryUnit rows where
        part_id == request.part_id AND status == AVAILABLE
        AND condition IN request.condition_acceptable
        AND rank(trace_doc_level) >= rank(request.min_trace_doc)
      ranking: created_at ASC (oldest stock first — FIFO rotation)
      tie-break: none needed (created_at is unique); never use id
      selection: first row of the ranked list
      empty-pool fallback: no reservation; request stays OPEN; endpoint returns
        ERR_NO_SOURCE_AVAILABLE (422) and last_search_candidate_count := 0
    input_set: "InventoryUnit rows (status AVAILABLE only) for the request's part"
    constants: {}
    precision: "n/a (selector)"

  - name: warranty_credit
    trigger: "WarrantyClaim approve"
    algorithm: tiered_pricing
    formula: |
      months_in_service = floor((approve clock - OrderLine.delivered_at) / (30*86400))
      coverage_pct = 1.00 if months_in_service <= 6
                     0.75 if 7  <= months_in_service <= 12
                     0.50 if 13 <= months_in_service <= 24
                     0.00 if months_in_service > 24
      credit_cents = round_half_up(OrderLine.line_total_cents * coverage_pct)
    input_set: "the single WarrantyClaim + its OrderLine"
    constants: {}
    precision: "integer cents, round_half_up"

  - name: restocking_fee
    trigger: "ReturnAuthorization receive with condition_grade == RESALEABLE"
    algorithm: threshold
    formula: |
      days = floor((receive clock - OrderLine.delivered_at) / 86400)
      restock_fee_cents = round_half_up(line_total_cents * 0.10) if days <= 7
                          round_half_up(line_total_cents * 0.20) if 8 <= days <= 30
      credit_cents = line_total_cents - restock_fee_cents
      (days > 30 cannot occur: creation is rejected by ERR_RETURN_WINDOW_CLOSED)
    input_set: "the single ReturnAuthorization + its OrderLine"
    constants:
      FEE_PCT_7D: 0.10
      FEE_PCT_30D: 0.20
    precision: "integer cents, round_half_up"

  - name: outstanding_balance_recompute
    trigger: "every AccountLedgerEntry posting"
    algorithm: aggregation
    formula: |
      outstanding_balance_cents = sum(amount_cents over debit entry_types)
                                - sum(amount_cents over credit entry_types)
      debit types:  INVOICE_DEBIT, CORE_DEPOSIT_DEBIT, FREIGHT_DEBIT, LOAN_DEBIT,
                    LEASE_DEBIT, MANUAL_DEBIT
      credit types: CORE_REFUND_CREDIT, WARRANTY_CREDIT, RESTOCK_CREDIT,
                    WAIVER_CREDIT, PAYMENT_CREDIT, MANUAL_CREDIT
    input_set: "all AccountLedgerEntry rows of the customer (append-only; no deletions)"
    constants: {}
    precision: "integer cents, exact"

# =============================================================================
# 1.4 Validation Rules Table (ordered by priority; lower number wins)
# =============================================================================
validations:
  - { priority: 1, category: auth, check: "X-User-Role and X-User-ID headers present and role is a declared role", error_id: ERR_UNAUTHENTICATED, http_status: 401, applies_to: "all" }
  - { priority: 2, category: auth, check: "Role permitted for the endpoint per §1.5 roles; CustomerContact may only act on resources whose customer_id == X-User-ID", error_id: ERR_FORBIDDEN, http_status: 403, applies_to: "all" }
  - { priority: 3, category: existence, check: "Path ids exist, validated left-to-right; body FK references exist", error_id: "ERR_*_NOT_FOUND (one per entity: ERR_CUSTOMER_NOT_FOUND, ERR_PART_NOT_FOUND, ERR_UNIT_NOT_FOUND, ERR_AOG_REQUEST_NOT_FOUND, ERR_QUOTE_NOT_FOUND, ERR_ORDER_NOT_FOUND, ERR_ORDER_LINE_NOT_FOUND, ERR_SHIPMENT_NOT_FOUND, ERR_CORE_RETURN_NOT_FOUND, ERR_LOAN_NOT_FOUND, ERR_CLAIM_NOT_FOUND, ERR_RMA_NOT_FOUND, ERR_CHARTER_SLOT_NOT_FOUND)", http_status: 404, applies_to: "all" }
  - { priority: 4, category: state, check: "Target entity status permits the transition (incl. lazy quote expiry: ISSUED with clock > expires_at is treated as EXPIRED)", error_id: ERR_INVALID_STATE / ERR_QUOTE_EXPIRED / ERR_CUSTOMER_SUSPENDED, http_status: 409, applies_to: "all action endpoints" }
  - { priority: 5, category: state, check: "OCC: expected_<parent>_version == current version on endpoints that declare it", error_id: ERR_STALE_QUOTE_VERSION / ERR_STALE_CUSTOMER_VERSION, http_status: 412, applies_to: "quote accept/revise, customer credit-adjustments" }
  - { priority: 6, category: auth, check: "Segregation of duties: warranty approve/reject requires X-User-ID != reviewed_by", error_id: ERR_SEGREGATION_OF_DUTIES, http_status: 403, applies_to: "warranty approve/reject" }
  - { priority: 7, category: business_safety, check: "Hazmat declaration present for hazmat parts; export license present for controlled parts; denied destinations (KP, CU, IR, SY) rejected; trace doc rank and condition satisfy line/request requirements", error_id: ERR_HAZMAT_DECLARATION_MISSING / ERR_EXPORT_LICENSE_REQUIRED / ERR_EXPORT_DESTINATION_DENIED / ERR_TRACE_DOC_INSUFFICIENT / ERR_CONDITION_NOT_ACCEPTABLE, http_status: 422, applies_to: "tender, allocate, source-search" }
  - { priority: 8, category: business_temporal, check: "needed_by_utc strictly in the future; loan start_at not in the past; due_at after start_at; warranty filed within warranty window; return requested within 30 days of delivery; validity_hours within tier cap", error_id: ERR_NEEDED_BY_IN_PAST / ERR_LOAN_WINDOW_IN_PAST / ERR_WARRANTY_PERIOD_ELAPSED / ERR_RETURN_WINDOW_CLOSED / ERR_VALIDITY_EXCEEDS_TIER_CAP, http_status: 422, applies_to: "aog create, loan create, warranty create, rma create, quote issue" }
  - { priority: 9, category: business_constraint, check: "serial unique per part; one non-terminal quote per AogRequest; one shipment per order; unit AVAILABLE/RESERVED for allocation; loan window overlap (half-open); charter window overlap (120-minute buffer); line not already allocated", error_id: ERR_DUPLICATE_SERIAL / ERR_UNIT_NOT_AVAILABLE / ERR_LOAN_WINDOW_OVERLAP / ERR_CHARTER_WINDOW_OVERLAP / ERR_LINE_ALREADY_ALLOCATED / ERR_DUPLICATE_ACTIVE_QUOTE, http_status: 409, applies_to: "unit create, quote create, shipment create, allocate, loan create" }
  - { priority: 10, category: business_fiscal, check: "credit exposure = outstanding_balance_cents + total_cents + core deposits > credit_limit_cents (strictly greater rejects; equality passes); reactivation requires balance <= limit; waiver amount <= penalty_cents - penalty_waived_cents", error_id: ERR_CREDIT_LIMIT_EXCEEDED / ERR_WAIVER_EXCEEDS_PENALTY, http_status: 402, applies_to: "quote accept, customer reactivate, waive-penalty" }

# =============================================================================
# 1.5 API Endpoint Table
# Read roles shorthand: every business role may read (reads are unrestricted
# beyond authentication; ownership scoping applies to CustomerContact lists,
# which are filtered to customer_id == X-User-ID when the caller is a
# CustomerContact).
# =============================================================================
endpoints:
  # --- Customer ---
  - { method: POST, path: "/aog/customers", description: "Onboard an operator account", roles: [FinanceController], code: 201, input: [name, country_code, credit_limit_cents], output: Customer, side_effects: ["status=ACTIVE, priority_tier=STANDARD, balances zeroed, version=1"] }
  - { method: GET, path: "/aog/customers", description: "List customers", roles: [AogDeskAgent, CustomerContact, WarehouseOperator, ComplianceOfficer, FinanceController, WarrantyAdjuster, WarrantyApprover], code: 200, input: ["limit?", "offset?", "status?", "priority_tier?"], output: "Customer[]", side_effects: [] }
  - { method: GET, path: "/aog/customers/{id}", description: "Get one customer", roles: [AogDeskAgent, CustomerContact, WarehouseOperator, ComplianceOfficer, FinanceController, WarrantyAdjuster, WarrantyApprover], code: 200, input: [], output: Customer, side_effects: [] }
  - { method: POST, path: "/aog/customers/{id}/credit-adjustments", description: "Post a manual or payment ledger adjustment (OCC-guarded)", roles: [FinanceController], code: 201, input: [entry_type, amount_cents, expected_customer_version, "memo?", "order_id?"], output: AccountLedgerEntry, side_effects: ["create AccountLedgerEntry (entry_type PAYMENT_CREDIT | MANUAL_DEBIT | MANUAL_CREDIT); reference is SALES_ORDER/order_id when order_id supplied (required for PAYMENT_CREDIT), else CUSTOMER/customer id", "recompute Customer.outstanding_balance_cents", "increments Customer.version by 1", "payment >= invoiced_cents on an order flips payment INVOICED -> PAID"] }
  - { method: POST, path: "/aog/customers/{id}/suspend", description: "Manually suspend an account", roles: [FinanceController], code: 200, input: [], output: Customer, side_effects: ["status -> SUSPENDED", "increments Customer.version by 1"] }
  - { method: POST, path: "/aog/customers/{id}/reactivate", description: "Reactivate a suspended account when balance <= limit", roles: [FinanceController], code: 200, input: [], output: Customer, side_effects: ["status -> ACTIVE", "increments Customer.version by 1"] }
  - { method: GET, path: "/aog/customers/{id}/ledger-entries", description: "Ledger entries for a customer (newest first)", roles: [AogDeskAgent, WarehouseOperator, ComplianceOfficer, FinanceController, WarrantyAdjuster, WarrantyApprover], code: 200, input: ["limit?", "offset?", "entry_type?"], output: "AccountLedgerEntry[]", side_effects: [] }

  # --- PartMaster / InventoryUnit ---
  - { method: POST, path: "/aog/parts", description: "Register a catalog part", roles: [WarehouseOperator], code: 201, input: [part_number, description, rotable, list_price_cents, "hazmat_class?", "export_control_code?", "core_value_cents?", "warranty_months?"], output: PartMaster, side_effects: ["available_count=0, reserved_count=0"] }
  - { method: GET, path: "/aog/parts", description: "List parts", roles: [AogDeskAgent, CustomerContact, WarehouseOperator, ComplianceOfficer, FinanceController, WarrantyAdjuster, WarrantyApprover], code: 200, input: ["limit?", "offset?", "part_number?"], output: "PartMaster[]", side_effects: [] }
  - { method: GET, path: "/aog/parts/{id}", description: "Get one part", roles: [AogDeskAgent, CustomerContact, WarehouseOperator, ComplianceOfficer, FinanceController, WarrantyAdjuster, WarrantyApprover], code: 200, input: [], output: PartMaster, side_effects: [] }
  - { method: POST, path: "/aog/inventory-units", description: "Register a serialized unit", roles: [WarehouseOperator], code: 201, input: [part_id, serial_number, condition, trace_doc_level, warehouse_code], output: InventoryUnit, side_effects: ["status=AVAILABLE", "PartMaster.available_count += 1"] }
  - { method: GET, path: "/aog/inventory-units", description: "List units with filters", roles: [AogDeskAgent, CustomerContact, WarehouseOperator, ComplianceOfficer, FinanceController, WarrantyAdjuster, WarrantyApprover], code: 200, input: ["limit?", "offset?", "part_id?", "status?", "condition?", "reserved_by_request_id?"], output: "InventoryUnit[]", side_effects: [] }
  - { method: GET, path: "/aog/inventory-units/{id}", description: "Get one unit", roles: [AogDeskAgent, CustomerContact, WarehouseOperator, ComplianceOfficer, FinanceController, WarrantyAdjuster, WarrantyApprover], code: 200, input: [], output: InventoryUnit, side_effects: [] }
  - { method: POST, path: "/aog/inventory-units/{id}/certify-trace", description: "Upgrade a unit's trace documentation level", roles: [ComplianceOfficer], code: 200, input: [trace_doc_level], output: InventoryUnit, side_effects: ["trace_doc_level := payload value (must rank >= current; downgrade rejected ERR_INVALID_REQUEST)", "increments InventoryUnit.version by 1"] }

  # --- AogRequest ---
  - { method: POST, path: "/aog/aog-requests", description: "File a 24/7 AOG request", roles: [AogDeskAgent, CustomerContact], code: 201, input: [customer_id, aircraft_tail, airport_code, part_id, quantity, condition_acceptable, min_trace_doc, needed_by_utc], output: AogRequest, side_effects: ["status=OPEN", "CustomerContact caller must match customer_id (ERR_FORBIDDEN)"] }
  - { method: GET, path: "/aog/aog-requests", description: "List AOG requests", roles: [AogDeskAgent, CustomerContact, WarehouseOperator, ComplianceOfficer, FinanceController, WarrantyAdjuster, WarrantyApprover], code: 200, input: ["limit?", "offset?", "customer_id?", "status?", "part_id?", "reserved_unit_id?"], output: "AogRequest[]", side_effects: [] }
  - { method: GET, path: "/aog/aog-requests/{id}", description: "Get one AOG request", roles: [AogDeskAgent, CustomerContact, WarehouseOperator, ComplianceOfficer, FinanceController, WarrantyAdjuster, WarrantyApprover], code: 200, input: [], output: AogRequest, side_effects: [] }
  - { method: POST, path: "/aog/aog-requests/{id}/source-search", description: "Run the sourcing selector; reserves the winning unit", roles: [AogDeskAgent], code: 200, input: [], output: AogRequest, side_effects: ["sourcing_rank selector over AVAILABLE units", "winning unit AVAILABLE -> RESERVED with reserved_by_request_id := request id", "reserved_unit_id := unit id; last_search_candidate_count := pool size", "empty pool -> ERR_NO_SOURCE_AVAILABLE (422) and no state change", "prior reservation of this request released first (RESERVED -> AVAILABLE)"] }
  - { method: POST, path: "/aog/aog-requests/{id}/escalate", description: "Escalate the request (freight multiplier 1.25 applies from now on)", roles: [AogDeskAgent], code: 200, input: [], output: AogRequest, side_effects: ["escalated := true", "increments AogRequest.version by 1"] }
  - { method: POST, path: "/aog/aog-requests/{id}/cancel", description: "Cancel an open or quoted request", roles: [AogDeskAgent, CustomerContact], code: 200, input: [], output: AogRequest, side_effects: ["status -> CANCELLED", "non-terminal quotes cascade to CANCELLED", "reserved unit released"] }
  - { method: GET, path: "/aog/aog-requests/{id}/quotes", description: "Quotes for a request", roles: [AogDeskAgent, CustomerContact, WarehouseOperator, ComplianceOfficer, FinanceController, WarrantyAdjuster, WarrantyApprover], code: 200, input: ["limit?", "offset?"], output: "Quote[]", side_effects: [] }

  # --- Quote ---
  - { method: POST, path: "/aog/quotes", description: "Draft a quote against an AOG request", roles: [AogDeskAgent], code: 201, input: [aog_request_id, customer_id, lines, validity_hours, distance_km, chargeable_weight_kg, destination_country, "freight_mode?"], output: Quote, side_effects: ["status=DRAFT", "compute subtotal/handling/tier fee/total/freight per calculations (tier at current Customer.priority_tier)", "ERR_DUPLICATE_ACTIVE_QUOTE if the request already has a DRAFT or ISSUED quote", "ERR_INVALID_REQUEST when EXCHANGE/LOAN/LEASE line targets a non-rotable part or LOAN/LEASE line quantity != 1"] }
  - { method: GET, path: "/aog/quotes", description: "List quotes", roles: [AogDeskAgent, CustomerContact, WarehouseOperator, ComplianceOfficer, FinanceController, WarrantyAdjuster, WarrantyApprover], code: 200, input: ["limit?", "offset?", "customer_id?", "status?", "aog_request_id?"], output: "Quote[]", side_effects: [] }
  - { method: GET, path: "/aog/quotes/{id}", description: "Get one quote", roles: [AogDeskAgent, CustomerContact, WarehouseOperator, ComplianceOfficer, FinanceController, WarrantyAdjuster, WarrantyApprover], code: 200, input: [], output: Quote, side_effects: [] }
  - { method: POST, path: "/aog/quotes/{id}/issue", description: "Issue the quote (starts validity clock, snapshots tier)", roles: [AogDeskAgent], code: 200, input: [], output: Quote, side_effects: ["DRAFT -> ISSUED per state machine", "AogRequest OPEN -> QUOTED", "increments Quote.version by 1"] }
  - { method: POST, path: "/aog/quotes/{id}/accept", description: "Customer accepts (OCC-guarded); creates the order cascade", roles: [CustomerContact], code: 200, input: [expected_quote_version], output: Quote, side_effects: ["ISSUED -> ACCEPTED cascade per state machine (SalesOrder + OrderLines created, AogRequest FULFILLING)", "increments Quote.version by 1"] }
  - { method: POST, path: "/aog/quotes/{id}/reject", description: "Customer rejects the issued quote", roles: [CustomerContact], code: 200, input: [], output: Quote, side_effects: ["ISSUED -> REJECTED", "increments Quote.version by 1"] }
  - { method: POST, path: "/aog/quotes/{id}/revise", description: "Revise a REJECTED or EXPIRED quote back to DRAFT (OCC-guarded)", roles: [AogDeskAgent], code: 200, input: [expected_quote_version, "lines?", "validity_hours?", "freight_mode?", "distance_km?", "chargeable_weight_kg?", "destination_country?"], output: Quote, side_effects: ["-> DRAFT, revision_count += 1, validity/tier fields cleared", "recompute price fields", "increments Quote.version by 1"] }
  - { method: POST, path: "/aog/quotes/{id}/cancel", description: "Desk cancels a draft quote", roles: [AogDeskAgent], code: 200, input: [], output: Quote, side_effects: ["DRAFT -> CANCELLED", "increments Quote.version by 1"] }

  # --- SalesOrder / OrderLine ---
  - { method: GET, path: "/aog/orders", description: "List orders", roles: [AogDeskAgent, CustomerContact, WarehouseOperator, ComplianceOfficer, FinanceController, WarrantyAdjuster, WarrantyApprover], code: 200, input: ["limit?", "offset?", "quote_id?", "customer_id?", "fulfillment_status?"], output: "SalesOrder[]", side_effects: [] }
  - { method: GET, path: "/aog/orders/{id}", description: "Get one order", roles: [AogDeskAgent, CustomerContact, WarehouseOperator, ComplianceOfficer, FinanceController, WarrantyAdjuster, WarrantyApprover], code: 200, input: [], output: SalesOrder, side_effects: [] }
  - { method: POST, path: "/aog/orders/{id}/compliance-decision", description: "Compliance screening outcome", roles: [ComplianceOfficer], code: 200, input: [decision, "decision_memo?"], output: SalesOrder, side_effects: ["compliance_status := decision (CLEARED | EXPORT_HELD | BLOCKED)", "BLOCKED releases all allocations and reverts fulfillment to PENDING_ALLOCATION", "increments SalesOrder.version by 1"] }
  - { method: GET, path: "/aog/order-lines", description: "List order lines", roles: [AogDeskAgent, CustomerContact, WarehouseOperator, ComplianceOfficer, FinanceController, WarrantyAdjuster, WarrantyApprover], code: 200, input: ["limit?", "offset?", "order_id?", "part_id?", "allocated_unit_id?", "allocation_status?"], output: "OrderLine[]", side_effects: [] }
  - { method: GET, path: "/aog/order-lines/{id}", description: "Get one order line", roles: [AogDeskAgent, CustomerContact, WarehouseOperator, ComplianceOfficer, FinanceController, WarrantyAdjuster, WarrantyApprover], code: 200, input: [], output: OrderLine, side_effects: [] }
  - { method: POST, path: "/aog/order-lines/{id}/allocate", description: "Allocate a unit to a line (explicit unit_id or the reserving unit)", roles: [WarehouseOperator], code: 200, input: ["unit_id?"], output: OrderLine, side_effects: ["unit -> ALLOCATED (from RESERVED or AVAILABLE)", "line allocation_status -> ALLOCATED", "when all lines allocated: order fulfillment -> ALLOCATED", "increments OrderLine.version by 1"] }
  - { method: POST, path: "/aog/order-lines/{id}/release", description: "Deallocate a line (compensating action of allocate)", roles: [WarehouseOperator], code: 200, input: [], output: OrderLine, side_effects: ["unit ALLOCATED -> AVAILABLE", "line allocation_status -> PENDING, allocated_unit_id := null", "order fulfillment ALLOCATED -> PENDING_ALLOCATION if it had flipped", "increments OrderLine.version by 1"] }

  # --- Shipment / CharterSlot ---
  - { method: POST, path: "/aog/shipments", description: "Create the shipment for an order", roles: [WarehouseOperator], code: 201, input: [order_id, "hazmat_declaration_ref?", "export_license_ref?", "depart_at?", "arrive_at?", "charter_slot_id?"], output: Shipment, side_effects: ["status=DRAFT", "refs may be supplied at create or at tender; the effective ref at tender is the tender payload value when present, else the create value", "freight_cost_cents copied from quote", "post FREIGHT_DEBIT freight_cost_cents and recompute balance", "ERR_DUPLICATE_SHIPMENT when the order already has a shipment", "CHARTER: charter overlap check with 120-minute buffer on the slot (ERR_CHARTER_WINDOW_OVERLAP)"] }
  - { method: GET, path: "/aog/shipments", description: "List shipments", roles: [AogDeskAgent, CustomerContact, WarehouseOperator, ComplianceOfficer, FinanceController, WarrantyAdjuster, WarrantyApprover], code: 200, input: ["limit?", "offset?", "order_id?", "charter_slot_id?", "status?"], output: "Shipment[]", side_effects: [] }
  - { method: GET, path: "/aog/shipments/{id}", description: "Get one shipment", roles: [AogDeskAgent, CustomerContact, WarehouseOperator, ComplianceOfficer, FinanceController, WarrantyAdjuster, WarrantyApprover], code: 200, input: [], output: Shipment, side_effects: [] }
  - { method: POST, path: "/aog/shipments/{id}/tender", description: "Tender to carrier after all compliance gates", roles: [WarehouseOperator], code: 200, input: ["hazmat_declaration_ref?", "export_license_ref?"], output: Shipment, side_effects: ["DRAFT -> TENDERED -> IN_TRANSIT", "units ALLOCATED -> SHIPPED", "order fulfillment ALLOCATED -> SHIPPED", "CHARTER: slot OPEN -> BOOKED"] }
  - { method: POST, path: "/aog/shipments/{id}/deliver", description: "Confirm delivery; fires the invoice/deposit/core/loan cascade", roles: [WarehouseOperator], code: 200, input: [], output: Shipment, side_effects: ["IN_TRANSIT -> DELIVERED", "full SalesOrder delivery cascade (see state machine)", "CHARTER: slot BOOKED -> OPEN released after delivery"] }

  - { method: POST, path: "/aog/charter-slots", description: "Register a charter aircraft", roles: [AogDeskAgent], code: 201, input: [tail_number, home_base], output: CharterSlot, side_effects: ["status=OPEN"] }
  - { method: GET, path: "/aog/charter-slots", description: "List charter slots", roles: [AogDeskAgent, CustomerContact, WarehouseOperator, ComplianceOfficer, FinanceController, WarrantyAdjuster, WarrantyApprover], code: 200, input: ["limit?", "offset?", "status?"], output: "CharterSlot[]", side_effects: [] }
  - { method: GET, path: "/aog/charter-slots/{id}", description: "Get one charter slot", roles: [AogDeskAgent, CustomerContact, WarehouseOperator, ComplianceOfficer, FinanceController, WarrantyAdjuster, WarrantyApprover], code: 200, input: [], output: CharterSlot, side_effects: [] }
  - { method: POST, path: "/aog/charter-slots/{id}/release", description: "Release a slot (OPEN -> RELEASED, or un-book while not yet delivered)", roles: [AogDeskAgent], code: 200, input: [], output: CharterSlot, side_effects: ["OPEN -> RELEASED or BOOKED -> OPEN"] }

  # --- CoreReturn ---
  - { method: GET, path: "/aog/core-returns", description: "List core returns", roles: [AogDeskAgent, CustomerContact, WarehouseOperator, ComplianceOfficer, FinanceController, WarrantyAdjuster, WarrantyApprover], code: 200, input: ["limit?", "offset?", "order_line_id?", "customer_id?", "status?"], output: "CoreReturn[]", side_effects: [] }
  - { method: GET, path: "/aog/core-returns/{id}", description: "Get one core return", roles: [AogDeskAgent, CustomerContact, WarehouseOperator, ComplianceOfficer, FinanceController, WarrantyAdjuster, WarrantyApprover], code: 200, input: [], output: CoreReturn, side_effects: [] }
  - { method: POST, path: "/aog/core-returns/{id}/receive", description: "Record physical core receipt; computes final penalty", roles: [WarehouseOperator], code: 200, input: [core_serial_number], output: CoreReturn, side_effects: ["-> RECEIVED, received_at/days_overdue/penalty_cents computed", "inbound InventoryUnit created UNDER_INSPECTION"] }
  - { method: POST, path: "/aog/core-returns/{id}/inspect", description: "Inspect the core; settles the deposit waterfall", roles: [WarehouseOperator], code: 200, input: [verdict, "reject_reason?"], output: CoreReturn, side_effects: ["RECEIVED -> SETTLED with per-verdict refund waterfall", "CORE_REFUND_CREDIT posted when refunded_cents > 0", "inbound unit -> AVAILABLE or QUARANTINED", "invariant: core_value_cents == refunded + penalty_retained + forfeited"] }
  - { method: POST, path: "/aog/core-returns/{id}/waive-penalty", description: "Waive part of the accrued penalty (compensating ledger credit)", roles: [FinanceController], code: 200, input: [amount_cents], output: CoreReturn, side_effects: ["penalty_waived_cents += amount_cents (<= penalty_cents - penalty_waived_cents else ERR_WAIVER_EXCEEDS_PENALTY)", "post WAIVER_CREDIT amount_cents; recompute balance", "allowed while status in OVERDUE or RECEIVED"] }

  # --- LoanAgreement ---
  - { method: POST, path: "/aog/loans", description: "Desk-direct loan/lease of a rotable unit", roles: [AogDeskAgent], code: 201, input: [customer_id, unit_id, loan_type, daily_rate_cents, start_at, due_at, "lease_periods?"], output: LoanAgreement, side_effects: ["status=ACTIVE", "precondition: unit.status not in {SOLD, SCRAPPED, QUARANTINED} (ERR_UNIT_NOT_AVAILABLE)", "half-open overlap check vs other ACTIVE/OVERDUE loans of the unit (ERR_LOAN_WINDOW_OVERLAP); the loan book is the unit schedule - desk-direct loans do not change unit status", "LEASE: post first-period LEASE_DEBIT 30*daily_rate_cents and recompute balance", "Customer must be ACTIVE (ERR_CUSTOMER_SUSPENDED)"] }
  - { method: GET, path: "/aog/loans", description: "List loans", roles: [AogDeskAgent, CustomerContact, WarehouseOperator, ComplianceOfficer, FinanceController, WarrantyAdjuster, WarrantyApprover], code: 200, input: ["limit?", "offset?", "customer_id?", "unit_id?", "order_line_id?", "status?"], output: "LoanAgreement[]", side_effects: [] }
  - { method: GET, path: "/aog/loans/{id}", description: "Get one loan", roles: [AogDeskAgent, CustomerContact, WarehouseOperator, ComplianceOfficer, FinanceController, WarrantyAdjuster, WarrantyApprover], code: 200, input: [], output: LoanAgreement, side_effects: [] }
  - { method: POST, path: "/aog/loans/{id}/return", description: "Receive the unit back; settles billing per loan_type variant", roles: [WarehouseOperator], code: 200, input: [damage_flag], output: LoanAgreement, side_effects: ["billed_cents := loan_settlement", "post remaining LOAN_DEBIT/LEASE_DEBIT; recompute balance", "damage_flag=false: -> RETURNED -> SETTLED, unit ON_LOAN -> AVAILABLE via UNDER_INSPECTION", "damage_flag=true: -> DAMAGE_REVIEW, unit -> QUARANTINED"] }

  # --- WarrantyClaim ---
  - { method: POST, path: "/aog/warranty-claims", description: "File a warranty claim against a delivered line", roles: [CustomerContact], code: 201, input: [customer_id, order_line_id, fault_category, description], output: WarrantyClaim, side_effects: ["status=FILED", "months_in_service computed", "ERR_WARRANTY_PERIOD_ELAPSED beyond warranty window", "CustomerContact caller must match customer_id (ERR_FORBIDDEN)"] }
  - { method: GET, path: "/aog/warranty-claims", description: "List warranty claims", roles: [AogDeskAgent, CustomerContact, WarehouseOperator, ComplianceOfficer, FinanceController, WarrantyAdjuster, WarrantyApprover], code: 200, input: ["limit?", "offset?", "customer_id?", "order_line_id?", "status?"], output: "WarrantyClaim[]", side_effects: [] }
  - { method: GET, path: "/aog/warranty-claims/{id}", description: "Get one warranty claim", roles: [AogDeskAgent, CustomerContact, WarehouseOperator, ComplianceOfficer, FinanceController, WarrantyAdjuster, WarrantyApprover], code: 200, input: [], output: WarrantyClaim, side_effects: [] }
  - { method: POST, path: "/aog/warranty-claims/{id}/review", description: "Adjuster review (also reopens a REJECTED claim once)", roles: [WarrantyAdjuster], code: 200, input: ["review_notes?"], output: WarrantyClaim, side_effects: ["FILED|REJECTED -> UNDER_REVIEW; reviewed_by := X-User-ID", "reopen enforces reopen_count < 1 (ERR_REOPEN_LIMIT_REACHED)"] }
  - { method: POST, path: "/aog/warranty-claims/{id}/approve", description: "Approve credit (segregated from reviewer)", roles: [WarrantyApprover], code: 200, input: [], output: WarrantyClaim, side_effects: ["UNDER_REVIEW -> APPROVED -> CREDIT_ISSUED", "credit_cents per warranty_credit", "post WARRANTY_CREDIT; recompute balance"] }
  - { method: POST, path: "/aog/warranty-claims/{id}/reject", description: "Reject the claim (segregated from reviewer)", roles: [WarrantyApprover], code: 200, input: ["fraud_flag?"], output: WarrantyClaim, side_effects: ["UNDER_REVIEW -> REJECTED", "fraud_flag true increments Customer.warranty_fraud_flags at next sweep"] }

  # --- ReturnAuthorization ---
  - { method: POST, path: "/aog/return-authorizations", description: "Request return of a delivered OUTRIGHT line (auto-approved within 30 days)", roles: [CustomerContact], code: 201, input: [customer_id, order_line_id, reason], output: ReturnAuthorization, side_effects: ["status=APPROVED", "ERR_RETURN_WINDOW_CLOSED beyond 30 days since delivery", "ERR_INVALID_REQUEST for non-OUTRIGHT lines or lines whose OrderLine.delivered_at is null (not yet delivered)", "CustomerContact caller must match customer_id (ERR_FORBIDDEN)"] }
  - { method: GET, path: "/aog/return-authorizations", description: "List return authorizations", roles: [AogDeskAgent, CustomerContact, WarehouseOperator, ComplianceOfficer, FinanceController, WarrantyAdjuster, WarrantyApprover], code: 200, input: ["limit?", "offset?", "customer_id?", "order_line_id?", "status?"], output: "ReturnAuthorization[]", side_effects: [] }
  - { method: GET, path: "/aog/return-authorizations/{id}", description: "Get one return authorization", roles: [AogDeskAgent, CustomerContact, WarehouseOperator, ComplianceOfficer, FinanceController, WarrantyAdjuster, WarrantyApprover], code: 200, input: [], output: ReturnAuthorization, side_effects: [] }
  - { method: POST, path: "/aog/return-authorizations/{id}/receive", description: "Receive the returned unit; computes restocking fee and credit", roles: [WarehouseOperator], code: 200, input: [condition_grade], output: ReturnAuthorization, side_effects: ["APPROVED -> RECEIVED -> SETTLED", "restock fee + credit per restocking_fee when RESALEABLE", "unit -> AVAILABLE (RESALEABLE) or QUARANTINED (DAMAGED)"] }

  # --- Test-driving endpoints (scaffold contract, not business surface) ---
  - { method: POST, path: "/_clock/set_current_utc", description: "Set the logical clock. Startup default is exactly 2026-05-01T00:00:00Z; the clock never falls back to wall-clock time. Monotonic: moving backwards is rejected (ERR_CLOCK_REGRESSION)", roles: [PlatformOps], code: 200, input: [to_iso8601], output: { current_utc: string }, side_effects: [] }
  - { method: POST, path: "/_system/run-sweeps", description: "Run the ops checkpoint in pinned order: (1) expire ISSUED quotes past expires_at; (2) flip OPEN core returns past due_at to OVERDUE; (3) flip ACTIVE loans past due_at to OVERDUE; (4) post LEASE period debits for crossed 30-day boundaries; (5) recompute customer tiers and auto-suspend customers with outstanding_balance_cents > credit_limit_cents; (6) scrap QUARANTINED units", roles: [PlatformOps], code: 200, input: [], output: { expired_quotes: integer, overdue_core_returns: integer, overdue_loans: integer, lease_debits_posted: integer, customers_suspended: integer, tiers_updated: integer, units_scrapped: integer }, side_effects: ["per-step cascades per state machines"] }

# =============================================================================
# 1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "Missing or unknown X-User-Role / X-User-ID headers" }
  - { id: ERR_FORBIDDEN, http: 403, condition: "Role not permitted for the endpoint, or CustomerContact acting on a resource whose customer_id != X-User-ID" }
  - { id: ERR_SEGREGATION_OF_DUTIES, http: 403, condition: "Warranty approve/reject attempted by the same X-User-ID recorded as reviewed_by" }
  - { id: ERR_CUSTOMER_NOT_FOUND, http: 404, condition: "customer id in path or body does not exist" }
  - { id: ERR_PART_NOT_FOUND, http: 404, condition: "part id in path or body does not exist" }
  - { id: ERR_UNIT_NOT_FOUND, http: 404, condition: "unit id in path or body does not exist" }
  - { id: ERR_AOG_REQUEST_NOT_FOUND, http: 404, condition: "AOG request id in path or body does not exist" }
  - { id: ERR_QUOTE_NOT_FOUND, http: 404, condition: "quote id in path or body does not exist" }
  - { id: ERR_ORDER_NOT_FOUND, http: 404, condition: "order id in path or body does not exist" }
  - { id: ERR_ORDER_LINE_NOT_FOUND, http: 404, condition: "order line id in path or body does not exist" }
  - { id: ERR_SHIPMENT_NOT_FOUND, http: 404, condition: "shipment id in path or body does not exist" }
  - { id: ERR_CORE_RETURN_NOT_FOUND, http: 404, condition: "core return id in path or body does not exist" }
  - { id: ERR_LOAN_NOT_FOUND, http: 404, condition: "loan id in path or body does not exist" }
  - { id: ERR_CLAIM_NOT_FOUND, http: 404, condition: "warranty claim id in path or body does not exist" }
  - { id: ERR_RMA_NOT_FOUND, http: 404, condition: "return authorization id in path or body does not exist" }
  - { id: ERR_CHARTER_SLOT_NOT_FOUND, http: 404, condition: "charter slot id in path or body does not exist" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Missing required field, invalid enum value, negative/zero quantity, malformed timestamp, forbidden field combination (e.g. lease_periods on a LOAN, charter fields on a STANDARD shipment, trace downgrade)" }
  - { id: ERR_CLOCK_REGRESSION, http: 400, condition: "set_current_utc to a time before the current logical clock" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Entity status does not permit the requested transition (generic)" }
  - { id: ERR_QUOTE_EXPIRED, http: 409, condition: "Accept attempted on an ISSUED quote whose expires_at is in the past (lazy expiry, independent of sweeps), or on an EXPIRED quote" }
  - { id: ERR_CUSTOMER_SUSPENDED, http: 409, condition: "Quote issue/accept or loan creation while Customer.status == SUSPENDED" }
  - { id: ERR_COMPLIANCE_NOT_CLEARED, http: 409, condition: "Shipment tender while SalesOrder.compliance_status != CLEARED" }
  - { id: ERR_DUPLICATE_SERIAL, http: 409, condition: "InventoryUnit serial_number already exists for the same part_id" }
  - { id: ERR_DUPLICATE_ACTIVE_QUOTE, http: 409, condition: "AogRequest already has a DRAFT or ISSUED quote" }
  - { id: ERR_DUPLICATE_SHIPMENT, http: 409, condition: "SalesOrder already has a shipment" }
  - { id: ERR_UNIT_NOT_AVAILABLE, http: 409, condition: "Allocation requested for a unit not in AVAILABLE/RESERVED-for-this-request, or no reserving unit pinned" }
  - { id: ERR_LINE_ALREADY_ALLOCATED, http: 409, condition: "allocate on a line with allocation_status == ALLOCATED" }
  - { id: ERR_LOAN_WINDOW_OVERLAP, http: 409, condition: "New loan window [start_at, due_at) intersects an existing ACTIVE/OVERDUE loan of the same unit; touching endpoints (existing due_at == new start_at) is allowed" }
  - { id: ERR_CHARTER_WINDOW_OVERLAP, http: 409, condition: "Charter booking [depart_at, arrive_at] falls within 120 minutes of another booking on the same slot (gap < 120 min rejected; gap >= 120 min allowed)" }
  - { id: ERR_STALE_QUOTE_VERSION, http: 412, condition: "expected_quote_version != current Quote.version on accept or revise" }
  - { id: ERR_STALE_CUSTOMER_VERSION, http: 412, condition: "expected_customer_version != current Customer.version on credit-adjustments" }
  - { id: ERR_CREDIT_LIMIT_EXCEEDED, http: 402, condition: "Credit exposure (outstanding + quote total + core deposits) strictly greater than credit_limit_cents; or reactivate with balance > limit" }
  - { id: ERR_WAIVER_EXCEEDS_PENALTY, http: 402, condition: "waive-penalty amount greater than penalty_cents - penalty_waived_cents" }
  - { id: ERR_NO_SOURCE_AVAILABLE, http: 422, condition: "Sourcing search found zero eligible units (empty pool fallback)" }
  - { id: ERR_TRACE_DOC_INSUFFICIENT, http: 422, condition: "Unit trace_doc_level rank below the required rank (request min_trace_doc)" }
  - { id: ERR_CONDITION_NOT_ACCEPTABLE, http: 422, condition: "Unit condition not in the request's condition_acceptable set or != line condition_required" }
  - { id: ERR_HAZMAT_DECLARATION_MISSING, http: 422, condition: "Tender with a hazmat-classed part and no hazmat_declaration_ref" }
  - { id: ERR_EXPORT_LICENSE_REQUIRED, http: 422, condition: "Tender with an export-controlled part (non-EAR99) and no export_license_ref" }
  - { id: ERR_EXPORT_DESTINATION_DENIED, http: 422, condition: "Shipment destination_country in the denied set {KP, CU, IR, SY}" }
  - { id: ERR_NEEDED_BY_IN_PAST, http: 422, condition: "AogRequest.needed_by_utc not strictly after the current clock" }
  - { id: ERR_LOAN_WINDOW_IN_PAST, http: 422, condition: "Loan start_at before the current clock, or due_at <= start_at, or LEASE due_at != start_at + lease_periods*30d" }
  - { id: ERR_VALIDITY_EXCEEDS_TIER_CAP, http: 422, condition: "Quote validity_hours exceeds the cap of the tier in effect at issue (24/48/72)" }
  - { id: ERR_WARRANTY_PERIOD_ELAPSED, http: 422, condition: "Claim filed at or after delivered_at + warranty_months*30 days (strict < required)" }
  - { id: ERR_RETURN_WINDOW_CLOSED, http: 422, condition: "Return requested more than 30 days after delivery" }
  - { id: ERR_REOPEN_LIMIT_REACHED, http: 409, condition: "Second reopen of a REJECTED warranty claim (reopen_count cap 1)" }

# =============================================================================
# 1.7 RBAC Matrix
# =============================================================================
roles:
  - name: AogDeskAgent
    description: "24/7 AOG desk agent: works requests, sourcing, quotes, desk-direct loans, charter slots"
    identity: opaque
    exclusive_operations:
      - "POST /aog/aog-requests/{id}/source-search"
      - "POST /aog/aog-requests/{id}/escalate"
      - "POST /aog/quotes (create)"
      - "POST /aog/quotes/{id}/issue"
      - "POST /aog/quotes/{id}/revise"
      - "POST /aog/quotes/{id}/cancel"
      - "POST /aog/loans"
      - "POST /aog/charter-slots and /release"
    shared_operations:
      - "POST /aog/aog-requests, POST /aog/aog-requests/{id}/cancel (with CustomerContact)"
      - "all GET endpoints"
  - name: CustomerContact
    description: "Airline/operator contact acting on their own account only (customer_id == X-User-ID)"
    identity: "entity_backed:Customer"
    exclusive_operations:
      - "POST /aog/quotes/{id}/accept"
      - "POST /aog/quotes/{id}/reject"
      - "POST /aog/warranty-claims"
      - "POST /aog/return-authorizations"
    shared_operations:
      - "POST /aog/aog-requests, POST /aog/aog-requests/{id}/cancel (with AogDeskAgent)"
      - "all GET endpoints (rows scoped to own customer_id)"
  - name: WarehouseOperator
    description: "Warehouse/logistics operator: parts, units, allocation, shipping, core and loan and return receipt"
    identity: opaque
    exclusive_operations:
      - "POST /aog/parts"
      - "POST /aog/inventory-units"
      - "POST /aog/order-lines/{id}/allocate and /release"
      - "POST /aog/shipments, /tender, /deliver"
      - "POST /aog/core-returns/{id}/receive and /inspect"
      - "POST /aog/loans/{id}/return"
      - "POST /aog/return-authorizations/{id}/receive"
    shared_operations:
      - "all GET endpoints"
  - name: ComplianceOfficer
    description: "Regulatory officer: trace certification and export/compliance screening; cannot ship or allocate"
    identity: opaque
    exclusive_operations:
      - "POST /aog/inventory-units/{id}/certify-trace"
      - "POST /aog/orders/{id}/compliance-decision"
    shared_operations:
      - "all GET endpoints"
  - name: FinanceController
    description: "Finance controller: account onboarding, credit, suspension, penalty waivers"
    identity: opaque
    exclusive_operations:
      - "POST /aog/customers"
      - "POST /aog/customers/{id}/credit-adjustments"
      - "POST /aog/customers/{id}/suspend and /reactivate"
      - "POST /aog/core-returns/{id}/waive-penalty"
    shared_operations:
      - "all GET endpoints"
  - name: WarrantyAdjuster
    description: "Warranty adjuster: reviews claims; cannot approve or reject"
    identity: opaque
    exclusive_operations:
      - "POST /aog/warranty-claims/{id}/review"
    shared_operations:
      - "all GET endpoints"
  - name: WarrantyApprover
    description: "Warranty approver: approves/rejects reviewed claims; must differ from the reviewing adjuster (segregation of duties)"
    identity: opaque
    exclusive_operations:
      - "POST /aog/warranty-claims/{id}/approve"
      - "POST /aog/warranty-claims/{id}/reject"
    shared_operations:
      - "all GET endpoints"
  - name: PlatformOps
    description: "Test-driving operator for the logical clock and ops sweeps; no business-surface permissions"
    identity: opaque
    exclusive_operations:
      - "POST /_clock/set_current_utc"
      - "POST /_system/run-sweeps"
    shared_operations: []
