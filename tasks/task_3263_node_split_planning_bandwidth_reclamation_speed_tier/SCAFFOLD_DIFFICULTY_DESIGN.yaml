            - call: "POST /service-groups/${sg}/utilization-samples"
              payload: { measured_at: "2026-09-30T18:00:00Z", downstream_mbps: 250, upstream_mbps: 10 }
              as: PlatformAdmin
            - call: "POST /speed-tiers"
              payload: { tier_code: "BIG", downstream_mbps: 100, upstream_mbps: 10, min_capability_class: "D40", min_upstream_config: "LEGACY" }
              as: PlatformAdmin
