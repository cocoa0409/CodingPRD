# =============================================================================
# Task 1978 — §1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty
# Tests). Breadth walk over §1.1–§1.7 per the claim-extraction guide.
# excluded_because stubs cite §1.8 instances by name and carry no test_recipe.
# =============================================================================
scaffold_corner_design:
  # ============================================================= entities ====
  - section: entities
    instances:
      - name: channel_create_applies_documented_defaults
        claim_type: defaults
        grounds: ["entities.Channel.fields.loop_duration_seconds", "entities.Channel.fields.refresh_cadence_days", "entities.Channel.fields.ad_separation_window_seconds", "entities.Channel.fields.avg_slot_impressions"]
        distinguishing_aspect: "Creating a channel with only required inputs yields loop_duration_seconds 86400, refresh_cadence_days 7, ad_separation_window_seconds 600, avg_slot_impressions 1000."
        test_recipe:
          setup: ["Empty database; a platform exists (unrelated seed)"]
          setup_api_calls:
            - { call: "POST /v1/distributor-platforms", payload: { name: "Seed", reporting_tier: "STANDARD" }, as: PlatformAdmin }
          trigger:
            - { call: "POST /v1/channels", payload: { name: "Ch Defaults", genre: "movies", timezone: "UTC" }, as: PlatformAdmin, captures: { ch: $.data.id } }
          assert:
            - "Channel.${ch}.loop_duration_seconds == 86400 and refresh_cadence_days == 7"
            - "Channel.${ch}.ad_separation_window_seconds == 600 and avg_slot_impressions == 1000"
            - "Channel.${ch}.channel_status == DRAFT and channel_posture == ACTIVE and ops_run_index == 0 and version == 1"

      - name: channel_create_missing_name_returns_invalid_request
        claim_type: required_fields
        grounds: ["entities.Channel.fields.name", "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "Omitting the required field name on channel create is rejected with ERR_INVALID_REQUEST (400)."
        test_recipe:
          setup: ["Empty database; a platform exists (unrelated seed)"]
          setup_api_calls:
            - { call: "POST /v1/distributor-platforms", payload: { name: "Seed", reporting_tier: "STANDARD" }, as: PlatformAdmin }
          trigger:
            - { call: "POST /v1/channels", payload: { genre: "movies", timezone: "UTC" }, as: PlatformAdmin, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_INVALID_REQUEST and http status == 400"

      - name: content_asset_create_with_invalid_enum_rejected
        claim_type: type_constraints
        grounds: ["entities.ContentAsset.fields.content_type", "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "content_type SERIES is outside the declared enum {MOVIE, EPISODE, SHORT} and is rejected."
        test_recipe:
          setup: ["Empty database; a channel exists (unrelated seed)"]
          setup_api_calls:
            - { call: "POST /v1/channels", payload: { name: "Seed Ch", genre: "movies", timezone: "UTC" }, as: PlatformAdmin }
          trigger:
            - { call: "POST /v1/content-assets", payload: { title: "Bad", content_type: "SERIES", runtime_seconds: 540, rating: "PG", genre: "movies" }, as: ContentLicensing, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_INVALID_REQUEST"

      - name: viewership_event_immutable_no_version_field
        claim_type: immutability
        grounds: ["entities.ViewershipEvent"]
        distinguishing_aspect: "ViewershipEvent has common_fields false: its response carries id and created_at but no version/updated_at, and §1.5 declares no update endpoint for it."
        test_recipe:
          setup: ["Channel ch and platform p1 exist"]
          setup_api_calls:
            - { call: "POST /v1/channels", payload: { name: "Ch Ev", genre: "movies", timezone: "UTC" }, as: PlatformAdmin, captures: { ch: $.data.id } }
            - { call: "POST /v1/distributor-platforms", payload: { name: "P1", reporting_tier: "STANDARD" }, as: PlatformAdmin, captures: { p1: $.data.id } }
          trigger:
            - { call: "POST /v1/viewership-events", payload: { channel_id: "${ch}", platform_id: "${p1}", event_type: "SESSION_START", viewer_session_id: "s1", occurred_at_utc: "2026-09-01T00:00:00Z" }, as: PlatformAdmin, captures: { ev: $.data.id } }
          assert:
            - "ViewershipEvent.${ev} response has no version key and no updated_at key"
            - "GET /v1/viewership-events/${ev} returns the same immutable row"

      - name: channel_get_missing_id_returns_not_found
        claim_type: not_found
        grounds: ["errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "GET with a well-formed but absent UUID returns 404 ERR_NOT_FOUND even when other channels exist."
        test_recipe:
          setup: ["One channel exists"]
          setup_api_calls:
            - { call: "POST /v1/channels", payload: { name: "Ch Real", genre: "movies", timezone: "UTC" }, as: PlatformAdmin }
          trigger:
            - { call: "GET /v1/channels/00000000-0000-0000-0000-000000000000", payload: {}, as: PlatformAdmin, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_NOT_FOUND and http status == 404"

      - name: channel_create_client_id_input_ignored
        claim_type: system_fields
        grounds: ["entities.Channel"]
        distinguishing_aspect: "Client-supplied id/version in the create payload are ignored: the server mints a UUID and sets version 1."
        test_recipe:
          setup: ["A platform exists (unrelated seed)"]
          setup_api_calls:
            - { call: "POST /v1/distributor-platforms", payload: { name: "Seed", reporting_tier: "STANDARD" }, as: PlatformAdmin }
          trigger:
            - { call: "POST /v1/channels", payload: { name: "Ch Sys", genre: "movies", timezone: "UTC", id: "client-supplied", version: 99 }, as: PlatformAdmin, captures: { ch: $.data.id } }
          assert:
            - "Channel.${ch}.id != \"client-supplied\" (server-minted UUID)"
            - "Channel.${ch}.version == 1"

      - name: loop_offset_walk_recomputes_positions
        claim_type: computed_fields
        grounds: ["calculations.loop_offset_walk", "entities.PlaylistLoop.fields.used_seconds", "entities.AdBreak.fields.start_offset_seconds"]
        distinguishing_aspect: "Adding a 540s entry then a 60s break computes entry start_offset 0, break start_offset 540, and loop used_seconds 600 — all computed, none client-supplied."
        test_recipe:
          setup: ["Channel ch (600s), content ct (540s) AVAILABLE, ACTIVE grant"]
          setup_api_calls:
            - { call: "POST /v1/channels", payload: { name: "Ch Walk", genre: "movies", timezone: "UTC", loop_duration_seconds: 600 }, as: PlatformAdmin, captures: { ch: $.data.id } }
            - { call: "POST /v1/content-assets", payload: { title: "Movie 540", content_type: "MOVIE", runtime_seconds: 540, rating: "PG", genre: "movies" }, as: ContentLicensing, captures: { ct: $.data.id } }
            - { call: "POST /v1/content-assets/${ct}/mark-available", payload: {}, as: ContentLicensing }
            - { call: "POST /v1/rights-grants", payload: { channel_id: "${ch}", content_id: "${ct}", window_start_utc: "2026-08-01T00:00:00Z", window_end_utc: "2026-10-01T00:00:00Z", max_plays: 10 }, as: ContentLicensing, captures: { g: $.data.id } }
            - { call: "POST /v1/rights-grants/${g}/activate", payload: {}, as: ContentLicensing }
            - { call: "POST /v1/playlist-loops", payload: { channel_id: "${ch}", broadcast_date: "2026-09-01" }, as: ChannelProgrammer, captures: { lp: $.data.id } }
          trigger:
            - { call: "POST /v1/playlist-loops/${lp}/entries", payload: { content_id: "${ct}" }, as: ChannelProgrammer, captures: { en: $.data.id } }
            - { call: "POST /v1/playlist-loops/${lp}/ad-breaks", payload: { duration_seconds: 60 }, as: ChannelProgrammer, captures: { br: $.data.id } }
          assert:
            - "PlaylistEntry.${en}.start_offset_seconds == 0 and end_offset_seconds == 540 and sequence_index == 0"
            - "AdBreak.${br}.start_offset_seconds == 540 and after_entry_index == 1"
            - "PlaylistLoop.${lp}.used_seconds == 600"

  # ======================================================== state_machines ====
  - section: state_machines
    instances:
      - name: loop_create_starts_in_draft
        claim_type: initial_state
        grounds: ["state_machines.PlaylistLoop"]
        distinguishing_aspect: "A newly created loop starts in DRAFT with used_seconds 0."
        test_recipe:
          setup: ["Channel ch exists"]
          setup_api_calls:
            - { call: "POST /v1/channels", payload: { name: "Ch Init", genre: "movies", timezone: "UTC" }, as: PlatformAdmin, captures: { ch: $.data.id } }
          trigger:
            - { call: "POST /v1/playlist-loops", payload: { channel_id: "${ch}", broadcast_date: "2026-09-01" }, as: ChannelProgrammer, captures: { lp: $.data.id } }
          assert:
            - "PlaylistLoop.${lp}.loop_status == DRAFT and used_seconds == 0 and published_at is null"

      - name: channel_go_live_without_locked_loop_rejected
        claim_type: precondition_enforcement
        grounds: ["state_machines.Channel.DRAFT_to_LIVE", "errors[ERR_INVALID_STATE_TRANSITION]"]
        distinguishing_aspect: "go-live requires a LOCKED or PUBLISHED loop with broadcast_date >= today; with none, the transition is rejected."
        test_recipe:
          setup: ["Channel ch in DRAFT with no loops"]
          setup_api_calls:
            - { call: "POST /v1/channels", payload: { name: "Ch GL", genre: "movies", timezone: "UTC" }, as: PlatformAdmin, captures: { ch: $.data.id } }
          trigger:
            - { call: "POST /v1/channels/${ch}/go-live", payload: {}, as: PlatformAdmin, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_INVALID_STATE_TRANSITION and Channel.${ch}.channel_status == DRAFT"

      - name: publish_from_validated_loop_rejected
        claim_type: invalid_transition
        grounds: ["state_machines.PlaylistLoop.LOCKED_to_PUBLISHED", "errors[ERR_INVALID_STATE_TRANSITION]"]
        distinguishing_aspect: "Publish is only legal from LOCKED; a VALIDATED loop (break never decided) is rejected with ERR_INVALID_STATE_TRANSITION."
        test_recipe:
          setup: ["Channel ch; loop lp 2026-09-01 tiled (entry ct540 + 60s break) and VALIDATED, no decision run"]
          setup_api_calls:
            - { call: "POST /v1/channels", payload: { name: "Ch PV", genre: "movies", timezone: "UTC", loop_duration_seconds: 600 }, as: PlatformAdmin, captures: { ch: $.data.id } }
            - { call: "POST /v1/content-assets", payload: { title: "Movie 540", content_type: "MOVIE", runtime_seconds: 540, rating: "PG", genre: "movies" }, as: ContentLicensing, captures: { ct: $.data.id } }
            - { call: "POST /v1/content-assets/${ct}/mark-available", payload: {}, as: ContentLicensing }
            - { call: "POST /v1/rights-grants", payload: { channel_id: "${ch}", content_id: "${ct}", window_start_utc: "2026-08-01T00:00:00Z", window_end_utc: "2026-10-01T00:00:00Z", max_plays: 10 }, as: ContentLicensing, captures: { g: $.data.id } }
            - { call: "POST /v1/rights-grants/${g}/activate", payload: {}, as: ContentLicensing }
            - { call: "POST /v1/playlist-loops", payload: { channel_id: "${ch}", broadcast_date: "2026-09-01" }, as: ChannelProgrammer, captures: { lp: $.data.id } }
            - { call: "POST /v1/playlist-loops/${lp}/entries", payload: { content_id: "${ct}" }, as: ChannelProgrammer }
            - { call: "POST /v1/playlist-loops/${lp}/ad-breaks", payload: { duration_seconds: 60 }, as: ChannelProgrammer }
            - { call: "POST /v1/playlist-loops/${lp}/validate", payload: {}, as: ChannelProgrammer }
            - { call: "GET /v1/channels/${ch}", payload: {}, as: PlatformAdmin, captures: { cv: $.data.version } }
          trigger:
            - { call: "POST /v1/playlist-loops/${lp}/publish", payload: { expected_channel_version: "${cv}" }, as: ChannelProgrammer, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_INVALID_STATE_TRANSITION and PlaylistLoop.${lp}.loop_status == VALIDATED"

      - name: archived_content_terminal_lockdown
        claim_type: terminal_state_lockdown
        grounds: ["state_machines.ContentAsset"]
        distinguishing_aspect: "ARCHIVED is terminal: reinstate on an ARCHIVED asset is rejected."
        test_recipe:
          setup: ["Content ct AVAILABLE then PULLED then ARCHIVED (no PENDING/ACTIVE grants)"]
          setup_api_calls:
            - { call: "POST /v1/content-assets", payload: { title: "Old Movie", content_type: "MOVIE", runtime_seconds: 540, rating: "PG", genre: "movies" }, as: ContentLicensing, captures: { ct: $.data.id } }
            - { call: "POST /v1/content-assets/${ct}/mark-available", payload: {}, as: ContentLicensing }
            - { call: "POST /v1/content-assets/${ct}/pull", payload: {}, as: ContentLicensing }
            - { call: "POST /v1/content-assets/${ct}/archive", payload: {}, as: ContentLicensing }
          trigger:
            - { call: "POST /v1/content-assets/${ct}/reinstate", payload: {}, as: ContentLicensing, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_INVALID_STATE_TRANSITION and ContentAsset.${ct}.content_status == ARCHIVED"

      - name: retired_creative_terminal_lockdown
        claim_type: terminal_state_lockdown
        grounds: ["state_machines.AdCreative"]
        distinguishing_aspect: "RETIRED is terminal: approve on a RETIRED creative is rejected."
        test_recipe:
          setup: ["Campaign c1; creative crv APPROVED then RETIRED"]
          setup_api_calls:
            - { call: "POST /v1/ad-campaigns", payload: { advertiser_name: "Acme", iab_category: "IAB-9", total_budget_cents: 5000, daily_budget_cents: 5000, cpm_cents: 500, flight_start_date: "2026-08-01", flight_end_date: "2026-12-31" }, as: AdOps, captures: { c1: $.data.id } }
            - { call: "POST /v1/ad-creatives", payload: { campaign_id: "${c1}", brand: "Acme Soda", iab_category: "IAB-9", duration_seconds: 30 }, as: AdOps, as_user_id: "ops-1", captures: { crv: $.data.id } }
            - { call: "POST /v1/ad-creatives/${crv}/approve", payload: {}, as: AdQualityReviewer, as_user_id: "rev-1" }
            - { call: "POST /v1/ad-creatives/${crv}/retire", payload: {}, as: AdOps, as_user_id: "ops-1" }
          trigger:
            - { call: "POST /v1/ad-creatives/${crv}/approve", payload: {}, as: AdQualityReviewer, as_user_id: "rev-2", captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_INVALID_STATE_TRANSITION and AdCreative.${crv}.creative_status == RETIRED"

      - name: lock_requires_all_breaks_decided
        claim_type: precondition_enforcement
        grounds: ["state_machines.PlaylistLoop.VALIDATED_to_LOCKED", "errors[ERR_INVALID_STATE_TRANSITION]"]
        distinguishing_aspect: "Locking a VALIDATED loop whose only break is still MARKED (no decision run) is rejected."
        test_recipe:
          setup: ["Channel ch; loop lp tiled (entry ct540 + 60s break br) and VALIDATED; br never decided"]
          setup_api_calls:
            - { call: "POST /v1/channels", payload: { name: "Ch LK", genre: "movies", timezone: "UTC", loop_duration_seconds: 600 }, as: PlatformAdmin, captures: { ch: $.data.id } }
            - { call: "POST /v1/content-assets", payload: { title: "Movie 540", content_type: "MOVIE", runtime_seconds: 540, rating: "PG", genre: "movies" }, as: ContentLicensing, captures: { ct: $.data.id } }
            - { call: "POST /v1/content-assets/${ct}/mark-available", payload: {}, as: ContentLicensing }
            - { call: "POST /v1/rights-grants", payload: { channel_id: "${ch}", content_id: "${ct}", window_start_utc: "2026-08-01T00:00:00Z", window_end_utc: "2026-10-01T00:00:00Z", max_plays: 10 }, as: ContentLicensing, captures: { g: $.data.id } }
            - { call: "POST /v1/rights-grants/${g}/activate", payload: {}, as: ContentLicensing }
            - { call: "POST /v1/playlist-loops", payload: { channel_id: "${ch}", broadcast_date: "2026-09-01" }, as: ChannelProgrammer, captures: { lp: $.data.id } }
            - { call: "POST /v1/playlist-loops/${lp}/entries", payload: { content_id: "${ct}" }, as: ChannelProgrammer }
            - { call: "POST /v1/playlist-loops/${lp}/ad-breaks", payload: { duration_seconds: 60 }, as: ChannelProgrammer, captures: { br: $.data.id } }
            - { call: "POST /v1/playlist-loops/${lp}/validate", payload: {}, as: ChannelProgrammer }
          trigger:
            - { call: "POST /v1/playlist-loops/${lp}/lock", payload: {}, as: ChannelProgrammer, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_INVALID_STATE_TRANSITION; PlaylistLoop.${lp}.loop_status == VALIDATED; AdBreak.${br}.break_status == MARKED"

      - name: creative_reject_resubmit_cycle_clears_reason
        claim_type: valid_transition
        grounds: ["state_machines.AdCreative.REJECTED_to_PENDING_REVIEW"]
        distinguishing_aspect: "The cyclic review loop works: REJECTED -> PENDING_REVIEW via resubmit clears rejection_reason, and a later approve succeeds."
        test_recipe:
          setup: ["Campaign c1; creative crv PENDING_REVIEW (created by ops-1)"]
          setup_api_calls:
            - { call: "POST /v1/ad-campaigns", payload: { advertiser_name: "Acme", iab_category: "IAB-9", total_budget_cents: 5000, daily_budget_cents: 5000, cpm_cents: 500, flight_start_date: "2026-08-01", flight_end_date: "2026-12-31" }, as: AdOps, captures: { c1: $.data.id } }
            - { call: "POST /v1/ad-creatives", payload: { campaign_id: "${c1}", brand: "Acme Soda", iab_category: "IAB-9", duration_seconds: 30 }, as: AdOps, as_user_id: "ops-1", captures: { crv: $.data.id } }
          trigger:
            - { call: "POST /v1/ad-creatives/${crv}/reject", payload: { reason: "loud audio" }, as: AdQualityReviewer, as_user_id: "rev-1" }
            - { call: "POST /v1/ad-creatives/${crv}/resubmit", payload: {}, as: AdOps, as_user_id: "ops-1" }
            - { call: "POST /v1/ad-creatives/${crv}/approve", payload: {}, as: AdQualityReviewer, as_user_id: "rev-1" }
          assert:
            - "After reject: creative_status == REJECTED and rejection_reason == \"loud audio\""
            - "After resubmit: creative_status == PENDING_REVIEW and rejection_reason is null"
            - "After second review: creative_status == APPROVED"

      - name: platform_offboard_terminates_agreements
        claim_type: side_effect_execution
        grounds: ["state_machines.DistributorPlatform.ONBOARDING_to_OFFBOARDED", "state_machines.DistributionAgreement"]
        distinguishing_aspect: "Offboarding a platform cascades: its NEGOTIATION/ACTIVE/SUSPENDED agreements all become TERMINATED."
        test_recipe:
          setup: ["Platform p1 ACTIVE; channel ch; agreement ag ACTIVE for (ch, p1)"]
          setup_api_calls:
            - { call: "POST /v1/channels", payload: { name: "Ch OF", genre: "movies", timezone: "UTC" }, as: PlatformAdmin, captures: { ch: $.data.id } }
            - { call: "POST /v1/distributor-platforms", payload: { name: "P1", reporting_tier: "STANDARD" }, as: PlatformAdmin, captures: { p1: $.data.id } }
            - { call: "PATCH /v1/distributor-platforms/${p1}", payload: { target_status: "ACTIVE" }, as: PlatformAdmin }
            - { call: "POST /v1/distribution-agreements", payload: { channel_id: "${ch}", platform_id: "${p1}", rev_share_bps_below: 3000, rev_share_bps_above: 4000, tier_threshold_cents: 100000, minimum_guarantee_cents: 0, effective_start_date: "2026-01-01", effective_end_date: "2026-12-31" }, as: PlatformAdmin, captures: { ag: $.data.id } }
            - { call: "PATCH /v1/distribution-agreements/${ag}", payload: { target_status: "ACTIVE" }, as: PlatformAdmin }
          trigger:
            - { call: "PATCH /v1/distributor-platforms/${p1}", payload: { target_status: "OFFBOARDED" }, as: PlatformAdmin }
          assert:
            - "DistributorPlatform.${p1}.platform_status == OFFBOARDED"
            - "DistributionAgreement.${ag}.agreement_status == TERMINATED (cascade)"

      - name: unlock_compensates_committed_decisions
        claim_type: compensation
        grounds: ["state_machines.PlaylistLoop.LOCKED_to_VALIDATED", "state_machines.FillDecision.COMMITTED_to_VOIDED"]
        distinguishing_aspect: "Unlock is the compensation path distinct from void: COMMITTED decisions return to PROVISIONAL and campaign spend is refunded to its pre-lock value."
        test_recipe:
          setup: ["Channel ch; loop lp VALIDATED with 30s break br; campaign c1 (cpm 500, budget 5000, daily 5000) ACTIVE with creative cr1; decision run made d1; loop LOCKED (d1 COMMITTED, spent 500)"]
          setup_api_calls:
            - { call: "POST /v1/channels", payload: { name: "Ch UN", genre: "movies", timezone: "UTC", loop_duration_seconds: 600 }, as: PlatformAdmin, captures: { ch: $.data.id } }
            - { call: "POST /v1/content-assets", payload: { title: "Movie 570", content_type: "MOVIE", runtime_seconds: 570, rating: "PG", genre: "movies" }, as: ContentLicensing, captures: { ct: $.data.id } }
            - { call: "POST /v1/content-assets/${ct}/mark-available", payload: {}, as: ContentLicensing }
            - { call: "POST /v1/rights-grants", payload: { channel_id: "${ch}", content_id: "${ct}", window_start_utc: "2026-08-01T00:00:00Z", window_end_utc: "2026-10-01T00:00:00Z", max_plays: 10 }, as: ContentLicensing, captures: { g: $.data.id } }
            - { call: "POST /v1/rights-grants/${g}/activate", payload: {}, as: ContentLicensing }
            - { call: "POST /v1/playlist-loops", payload: { channel_id: "${ch}", broadcast_date: "2026-09-01" }, as: ChannelProgrammer, captures: { lp: $.data.id } }
            - { call: "POST /v1/playlist-loops/${lp}/entries", payload: { content_id: "${ct}" }, as: ChannelProgrammer }
            - { call: "POST /v1/playlist-loops/${lp}/ad-breaks", payload: { duration_seconds: 30 }, as: ChannelProgrammer, captures: { br: $.data.id, br_v: $.data.version } }
            - { call: "POST /v1/playlist-loops/${lp}/validate", payload: {}, as: ChannelProgrammer }
            - { call: "POST /v1/ad-campaigns", payload: { advertiser_name: "Acme", iab_category: "IAB-9", total_budget_cents: 5000, daily_budget_cents: 5000, cpm_cents: 500, flight_start_date: "2026-08-01", flight_end_date: "2026-12-31" }, as: AdOps, captures: { c1: $.data.id } }
            - { call: "POST /v1/ad-creatives", payload: { campaign_id: "${c1}", brand: "Acme Soda", iab_category: "IAB-9", duration_seconds: 30 }, as: AdOps, as_user_id: "ops-1", captures: { cr1: $.data.id } }
            - { call: "POST /v1/ad-creatives/${cr1}/approve", payload: {}, as: AdQualityReviewer, as_user_id: "rev-1" }
            - { call: "POST /v1/ad-campaigns/${c1}/activate", payload: {}, as: AdOps, as_user_id: "ops-1" }
            - { call: "POST /v1/ad-breaks/${br}/decision-runs", payload: { expected_break_version: "${br_v}" }, as: AdOps, as_user_id: "ops-1", captures: { d1: "$.data[0].id" } }
            - { call: "POST /v1/playlist-loops/${lp}/lock", payload: {}, as: ChannelProgrammer }
          trigger:
            - { call: "POST /v1/playlist-loops/${lp}/unlock", payload: {}, as: ChannelProgrammer }
          assert:
            - "PlaylistLoop.${lp}.loop_status == VALIDATED"
            - "FillDecision.${d1}.decision_status == PROVISIONAL (compensated, not voided)"
            - "AdCampaign.${c1}.spent_cents == 0 (pre-lock baseline restored)"

      - name: mark_aired_requires_published_loop
        claim_type: guarded_transitions
        grounds: ["state_machines.AdBreak.DECIDED_to_AIRED"]
        distinguishing_aspect: "Cross-entity guard: a DECIDED break cannot be marked aired while its loop is merely LOCKED (not PUBLISHED)."
        test_recipe:
          setup: ["Channel ch; loop lp VALIDATED with decided 30s break br; loop LOCKED (never published)"]
          setup_api_calls:
            - { call: "POST /v1/channels", payload: { name: "Ch MA", genre: "movies", timezone: "UTC", loop_duration_seconds: 600 }, as: PlatformAdmin, captures: { ch: $.data.id } }
            - { call: "POST /v1/content-assets", payload: { title: "Movie 570", content_type: "MOVIE", runtime_seconds: 570, rating: "PG", genre: "movies" }, as: ContentLicensing, captures: { ct: $.data.id } }
            - { call: "POST /v1/content-assets/${ct}/mark-available", payload: {}, as: ContentLicensing }
