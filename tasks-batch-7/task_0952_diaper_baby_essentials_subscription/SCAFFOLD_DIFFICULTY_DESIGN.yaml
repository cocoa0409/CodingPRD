            - "Referral.${ref_id}.status == VESTED"
            - "Referral.${ref_id}.credit_cents == 1500"
            - "Referral.${ref_id}.vesting_cycle_id == ${cb1}"
            - "Account.${a_id}.available_credit_cents == 1500"

      - name: sku_stock_drop_forces_allocated_line_into_substitution_pending
        grounds:
          - state_machines.CycleLine.ALLOCATED_to_SUBSTITUTION_PENDING
          - entities.Sku.fields.stock_packs
          - entities.CycleLine.fields.status
        distinguishing_aspect: |
          ENTITY PAIR CycleLine -> Sku, a third distinct pair: the CycleLine's own status is a
          perfectly valid ALLOCATED, and only the Sku's stock_packs falling to 0 — below the line's
          allocated quantity of 2 — forces the line into SUBSTITUTION_PENDING.
        test_recipe:
          setup:
