  # =====================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: id_deadline_exact_45th_day_inclusive
        grounds:
          - validations[priority=7]
          - entities.Exchange.fields.id_deadline_at
          - errors[ERR_ID_DEADLINE_PASSED]
        distinguishing_aspect: |
          Numeric-threshold boundary on the finalize endpoint: finalize AT exactly
          id_deadline_at (2026-04-15T00:00:00Z, the 45th day) succeeds (<= is inclusive);
          one second later it would fail. This instance pins the inclusive boundary.
        test_recipe:
          setup:
            - "FORWARD exchange closed at 2026-03-01 (id_deadline_at 2026-04-15T00:00:00Z); a DRAFT identification with one candidate."
          setup_api_calls:
