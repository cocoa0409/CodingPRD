              captures: { err_decision: $.data.error_id }
            - call: "POST /scan-cycles/${cycle_id}/complete"
              payload: {}
              as: AsvVendor
              as_user_id: "${vendor_other_id}"
              captures: { err_complete: $.data.error_id }
            - call: "POST /scan-findings/${find_id}/dispute-decision"
              payload: { decision: "ACCEPT", decision_note: "Confirmed as a false positive after manual review." }
              as: AsvVendor
              as_user_id: "${vendor_own_id}"
          assert:
            - "All three attempts by the non-owning vendor return HTTP 403: ${err_findings} == ${err_decision} == ${err_complete} == ERR_VENDOR_SCOPE_FORBIDDEN"
            - "GET /scan-findings?scan_cycle_id=${cycle_id} returns total_count 1 - the foreign finding was never appended"
            - "ScanCycle.${cycle_id}.status is still SCHEDULED and scan_completed_at is null after the refused completion"
            - "The owning vendor's decision returns HTTP 200: ScanFinding.${find_id}.dispute_status == ACCEPTED_FALSE_POSITIVE with decided_at == 2026-08-01T00:00:00Z"
            - "ScanCycle.${cycle_id}.accepted_false_positive_count == 1 and effective_high_finding_count == 0 while raw_finding_count stays 1 - the conserved identity raw == effective + accepted holds"
            - "The lead could raise the dispute but not decide it, and the vendor could decide it but not raise it - neither party appears in both endpoints' role lists"

      - name: rbac_qa_nomination_enforces_separation_qualification_and_active_status_in_order
        claim_type: segregation_of_duties
        grounds:
          - validations[priority=11]
          - errors[ERR_SEGREGATION_OF_DUTIES]
          - errors[ERR_QA_NOT_QUALIFIED]
          - errors[ERR_ASSESSOR_NOT_ACTIVE]
        distinguishing_aspect: "Three priority-11 rules guard one endpoint and their declaration order decides the answer: the engagement lead is also not qa_qualified, yet the nomination answers ERR_SEGREGATION_OF_DUTIES; an unqualified outsider answers ERR_QA_NOT_QUALIFIED; and a qualified but suspended assessor answers ERR_ASSESSOR_NOT_ACTIVE only because she clears the two earlier rules."
        test_recipe:
          setup:
            - "Assessors: Dana Reyes (lead, qa_qualified false), Owen Marsh (qa_qualified false, ACTIVE), Lena Ortiz (qa_qualified true, then SUSPENDED) and Kim Vance (qa_qualified true, ACTIVE)."
            - "Engagement 'Northwind Retail Inc' was opened with no qa_reviewer_id."
          setup_api_calls:
            - call: "POST /assessors"
              payload: { full_name: "Dana Reyes", email: "dana.reyes@qsa.example", certification_expires_at: "2027-06-30T00:00:00Z", qa_qualified: false }
              as: PlatformAdmin
              captures: { lead_id: $.data.id }
            - call: "POST /assessors"
              payload: { full_name: "Owen Marsh", email: "owen.marsh@qsa.example", certification_expires_at: "2027-06-30T00:00:00Z", qa_qualified: false }
              as: PlatformAdmin
              captures: { plain_id: $.data.id }
            - call: "POST /assessors"
              payload: { full_name: "Lena Ortiz", email: "lena.ortiz@qsa.example", certification_expires_at: "2027-06-30T00:00:00Z", qa_qualified: true }
              as: PlatformAdmin
              captures: { suspended_id: $.data.id }
            - call: "POST /assessors"
              payload: { full_name: "Kim Vance", email: "kim.vance@qsa.example", certification_expires_at: "2027-06-30T00:00:00Z", qa_qualified: true }
              as: PlatformAdmin
              captures: { qa_id: $.data.id }
            - call: "PATCH /assessors/${suspended_id}"
              payload: { status: "SUSPENDED" }
              as: PlatformAdmin
            - call: "POST /engagements"
              payload: { client_legal_name: "Northwind Retail Inc", merchant_level: "L1", assessment_year: 2026, acquirer_name: "First Coast Bank", fieldwork_start_date: "2026-08-10", fieldwork_end_date: "2026-08-28", approved_budget_amount: 200000.00, lead_assessor_id: "${lead_id}" }
              as: LeadAssessor
              as_user_id: "${lead_id}"
              captures: { eng_id: $.data.id }
          trigger:
            - call: "POST /engagements/${eng_id}/qa-reviewer"
              payload: { qa_reviewer_id: "${lead_id}" }
              as: LeadAssessor
              as_user_id: "${lead_id}"
              captures: { err_sod: $.data.error_id }
            - call: "POST /engagements/${eng_id}/qa-reviewer"
              payload: { qa_reviewer_id: "${plain_id}" }
              as: LeadAssessor
              as_user_id: "${lead_id}"
              captures: { err_not_qualified: $.data.error_id }
            - call: "POST /engagements/${eng_id}/qa-reviewer"
              payload: { qa_reviewer_id: "${suspended_id}" }
              as: LeadAssessor
              as_user_id: "${lead_id}"
              captures: { err_not_active: $.data.error_id }
            - call: "POST /engagements"
              payload: { client_legal_name: "Harbor Fuel Stops LLC", merchant_level: "L1", assessment_year: 2026, acquirer_name: "Second Harbor Bank", fieldwork_start_date: "2026-11-02", fieldwork_end_date: "2026-11-20", approved_budget_amount: 200000.00, lead_assessor_id: "${plain_id}", qa_reviewer_id: "${plain_id}" }
              as: PlatformAdmin
              captures: { err_sod_create: $.data.error_id }
            - call: "POST /engagements/${eng_id}/qa-reviewer"
              payload: { qa_reviewer_id: "${qa_id}" }
              as: LeadAssessor
              as_user_id: "${lead_id}"
              captures: { linked_qa: $.data.qa_reviewer_id }
          assert:
            - "${err_sod} == ERR_SEGREGATION_OF_DUTIES with HTTP 422 - nominating the lead is refused under the separation rule even though he is also not qa_qualified"
            - "${err_not_qualified} == ERR_QA_NOT_QUALIFIED with HTTP 422 for the unqualified outsider"
            - "Assessor.${suspended_id}.status == SUSPENDED and qa_qualified == true, and ${err_not_active} == ERR_ASSESSOR_NOT_ACTIVE with HTTP 422"
            - "${err_sod_create} == ERR_SEGREGATION_OF_DUTIES - the same rule guards engagement creation, and no engagement is created for 'Harbor Fuel Stops LLC'"
            - "Engagement.${eng_id}.qa_reviewer_id stayed null across all four refusals and its version was not bumped by any of them"
            - "The final nomination returns HTTP 200 with ${linked_qa} == ${qa_id}"
            - "GET /engagements?qa_reviewer_id=${qa_id} returns total_count 1 and GET /engagements returns total_count 1"

      - name: rbac_reviewer_independence_from_evidence_collection
        claim_type: segregation_of_duties
        grounds:
          - validations[priority=11]
          - errors[ERR_INDEPENDENCE_VIOLATION]
        excluded_because:
          difficulty_instance: independence_violation_beats_lapsed_certification_on_qa_review
          rationale: "That §1.8 instance covers the independence half of the role model: the nominated reviewer who collected a single evidence item on the engagement is refused with ERR_INDEPENDENCE_VIOLATION on qa-review, which also outranks her lapsed certification at priority 12."

  # ---------------------------------------------------------------------------
  # Section 8 — Cross-Cutting Complexity Layers (one group per declared layer)
  # ---------------------------------------------------------------------------
  - section: cross_cutting_complexity_layers
    instances:

      - name: layer_optimistic_concurrency_on_worksheet_creation
        claim_type: optimistic_concurrency
        grounds:
          - validations[priority=10]
          - errors[ERR_STALE_REQUIREMENT_VERSION]
          - endpoints[POST /requirement-assessments/{id}/ccws]
        distinguishing_aspect: "The guarded resource is the requirement row, not the engagement: a version read before the conclusion is stale the moment the conclusion lands, so drafting a worksheet against it answers 412 ERR_STALE_REQUIREMENT_VERSION - a status distinct from every 4xx business refusal - and the retry with the refreshed value succeeds with identical content."
        test_recipe:
          setup:
            - "Engagement 'Northwind Retail Inc' is in FIELDWORK with a VALIDATED CDE segment, three sampled components, an ACTIVE FINAL plan and requirement 1.2.1 (family R1) in IN_TESTING with complete evidence."
            - "The caller read the requirement's version while it was still IN_TESTING and holds that value."
          setup_api_calls:
            - call: "POST /assessors"
              payload: { full_name: "Dana Reyes", email: "dana.reyes@qsa.example", certification_expires_at: "2027-06-30T00:00:00Z", qa_qualified: false }
              as: PlatformAdmin
              captures: { lead_id: $.data.id }
            - call: "POST /assessors"
              payload: { full_name: "Kim Vance", email: "kim.vance@qsa.example", certification_expires_at: "2027-06-30T00:00:00Z", qa_qualified: true }
              as: PlatformAdmin
              captures: { qa_id: $.data.id }
            - call: "POST /engagements"
              payload: { client_legal_name: "Northwind Retail Inc", merchant_level: "L1", assessment_year: 2026, acquirer_name: "First Coast Bank", fieldwork_start_date: "2026-08-10", fieldwork_end_date: "2026-08-28", approved_budget_amount: 200000.00, lead_assessor_id: "${lead_id}", qa_reviewer_id: "${qa_id}" }
              as: LeadAssessor
              as_user_id: "${lead_id}"
              captures: { eng_id: $.data.id }
            - call: "POST /engagements/${eng_id}/network-segments"
              payload: { name: "CDE-CORE", segment_class: "CDE" }
              as: LeadAssessor
              as_user_id: "${lead_id}"
              captures: { seg_cde_id: $.data.id }
            - call: "POST /network-segments/${seg_cde_id}/segmentation-test-plan"
              payload: { test_method: "PEN_TEST", planned_date: "2026-08-05" }
              as: LeadAssessor
              as_user_id: "${lead_id}"
            - call: "POST /network-segments/${seg_cde_id}/validation-result"
              payload: { outcome: "PASS", note: "Segmentation verified." }
              as: LeadAssessor
              as_user_id: "${lead_id}"
            - call: "POST /engagements/${eng_id}/system-components"
              payload: { hostname: "app-01", component_type: "SERVER", function_class: "SECURITY_SERVICE", stores_chd: false, facility_name: "DC-EAST", facility_type: "DATA_CENTER", segment_id: "${seg_cde_id}" }
              as: LeadAssessor
              as_user_id: "${lead_id}"
            - call: "POST /engagements/${eng_id}/system-components"
              payload: { hostname: "pay-01", component_type: "APPLICATION", function_class: "PAYMENT_APPLICATION", stores_chd: true, facility_name: "DC-EAST", facility_type: "DATA_CENTER", segment_id: "${seg_cde_id}" }
              as: LeadAssessor
              as_user_id: "${lead_id}"
              captures: { comp_pay_01_id: $.data.id }
            - call: "POST /engagements/${eng_id}/system-components"
              payload: { hostname: "pay-02", component_type: "APPLICATION", function_class: "PAYMENT_APPLICATION", stores_chd: true, facility_name: "DC-EAST", facility_type: "DATA_CENTER", segment_id: "${seg_cde_id}" }
              as: LeadAssessor
              as_user_id: "${lead_id}"
            - call: "GET /engagements/${eng_id}"
              payload: {}
              as: LeadAssessor
              as_user_id: "${lead_id}"
              captures: { eng_v1: $.data.version }
            - call: "POST /engagements/${eng_id}/sampling-plans"
              payload: { plan_variant: "FINAL", justification_text: "Full coverage of the in-scope inventory.", expected_engagement_version: "${eng_v1}" }
              as: LeadAssessor
              as_user_id: "${lead_id}"
            - call: "POST /engagements/${eng_id}/scope-lock"
              payload: {}
              as: LeadAssessor
              as_user_id: "${lead_id}"
            - call: "POST /engagements/${eng_id}/requirement-assessments"
              payload: { requirement_ref: "1.2.1", requirement_family: "R1", testing_procedure_count: 3, applicability: "APPLICABLE" }
              as: LeadAssessor
              as_user_id: "${lead_id}"
              captures: { req_a_id: $.data.id }
            - call: "POST /requirement-assessments/${req_a_id}/start-testing"
              payload: {}
              as: LeadAssessor
              as_user_id: "${lead_id}"
            - call: "POST /requirement-assessments/${req_a_id}/evidence-items"
              payload: { evidence_type: "DOCUMENT_REVIEW", procedure_ref: "1.2.1.a", sufficiency: "SUFFICIENT", note: "Firewall standard reviewed." }
              as: LeadAssessor
              as_user_id: "${lead_id}"
            - call: "POST /requirement-assessments/${req_a_id}/evidence-items"
              payload: { evidence_type: "INTERVIEW", procedure_ref: "1.2.1.b", sufficiency: "SUFFICIENT", interviewee_name: "Priya Raman", interviewee_title: "Network Engineering Manager" }
              as: LeadAssessor
              as_user_id: "${lead_id}"
            - call: "POST /requirement-assessments/${req_a_id}/evidence-items"
              payload: { evidence_type: "OBSERVATION", procedure_ref: "1.2.1.c", sufficiency: "SUFFICIENT", component_id: "${comp_pay_01_id}" }
              as: LeadAssessor
              as_user_id: "${lead_id}"
            - call: "GET /requirement-assessments/${req_a_id}"
              payload: {}
              as: LeadAssessor
              as_user_id: "${lead_id}"
              captures: { req_v_stale: $.data.version }
            - call: "POST /requirement-assessments/${req_a_id}/conclusion"
              payload: { conclusion: "NOT_IN_PLACE", conclusion_rationale: "Two documented services are not restricted by the ruleset." }
              as: LeadAssessor
              as_user_id: "${lead_id}"
          trigger:
            - call: "POST /requirement-assessments/${req_a_id}/ccws"
              payload: { constraint_text: "The legacy terminal firmware cannot enforce per-session keys.", objective_text: "Prevent replay of captured authorisation traffic.", identified_risk_text: "Captured traffic could be replayed against the acquirer.", control_refs: ["NET-SEG-01", "MON-04", "TOK-02", "LOG-11"], monitoring_interval_days: 7, validation_text: "Replay attempts are exercised during the annual penetration test.", maintenance_text: "Quarterly review by the network team.", expected_requirement_assessment_version: "${req_v_stale}" }
              as: LeadAssessor
              as_user_id: "${lead_id}"
              captures: { err_stale: $.data.error_id }
            - call: "GET /requirement-assessments/${req_a_id}"
              payload: {}
              as: LeadAssessor
              as_user_id: "${lead_id}"
              captures: { req_v_fresh: $.data.version }
            - call: "POST /requirement-assessments/${req_a_id}/ccws"
              payload: { constraint_text: "The legacy terminal firmware cannot enforce per-session keys.", objective_text: "Prevent replay of captured authorisation traffic.", identified_risk_text: "Captured traffic could be replayed against the acquirer.", control_refs: ["NET-SEG-01", "MON-04", "TOK-02", "LOG-11"], monitoring_interval_days: 7, validation_text: "Replay attempts are exercised during the annual penetration test.", maintenance_text: "Quarterly review by the network team.", expected_requirement_assessment_version: "${req_v_fresh}" }
              as: LeadAssessor
              as_user_id: "${lead_id}"
              captures: { ccw_id: $.data.id, rigor: $.data.rigor_score }
          assert:
            - "The first attempt returns HTTP 412 with ${err_stale} == ERR_STALE_REQUIREMENT_VERSION - a 412 rather than a 409 or 422"
            - "${req_v_fresh} == ${req_v_stale} + 1 - the conclusion bumped the requirement exactly once"
            - "GET /ccws?requirement_assessment_id=${req_a_id} returns total_count 0 after the refusal"
            - "The retry with the refreshed value returns HTTP 201 with byte-identical content: CompensatingControlWorksheet.${ccw_id}.status == DRAFT and ${rigor} == 71.25 (depth 80 -> 32.00, monitoring 7 days -> 80 -> 28.00, risk 3 points -> 45 -> 11.25)"
            - "RequirementAssessment.${req_a_id}.version == ${req_v_fresh} + 1 after the accepted create, and its test_status is still NOT_IN_PLACE"
            - "Engagement.${eng_id}.open_gap_count == 1 and accepted_ccw_count == 0 - drafting a worksheet does not close a gap"

      - name: layer_optimistic_concurrency_against_the_engagement_row
        claim_type: optimistic_concurrency
        grounds:
          - validations[priority=10]
          - errors[ERR_STALE_ENGAGEMENT_VERSION]
        excluded_because:
          difficulty_instance: stale_engagement_version_412_beats_budget_exceeded_422
          rationale: "The engagement-scoped half of this layer is already driven there: the sampling plan carries expected_engagement_version, and the instance shows the 412 beating a co-violated budget ceiling before the repaired retry exposes the 422."

      - name: layer_cascading_side_effects_from_a_segmentation_failure
        claim_type: cascading_side_effects
        grounds:
          - state_machines.NetworkSegment
          - calculations.engagement_posture
        excluded_because:
          difficulty_instance: segmentation_failure_five_link_scope_cascade
          rationale: "That instance follows the five-link chain from one FAIL verdict through subtree reclassification, sample invalidation, plan staleness, gap ledger and posture, which is exactly what this layer requires; repeating a shorter version here would only re-test its first link."

      - name: layer_dual_variant_calculation_across_scope_and_compliance
        claim_type: dual_variant_calculation
        grounds:
          - calculations.compliance_projection
          - calculations.component_sample_allocation
        excluded_because:
          difficulty_instance: compliance_projection_as_found_versus_as_attested
          rationale: "The two-variant arithmetic is covered twice in §1.8 - once for compliance (as-found versus as-attested over the same requirement set) and once for sampling (PRELIMINARY versus FINAL over the same inventory in sampling_plan_preliminary_vs_final_scope_divergence) - so both variants of the layer are already pinned."

      - name: layer_rate_threshold_flips_reassessment_at_the_third_qualifying_change
        claim_type: rate_threshold_triggers
        grounds:
          - calculations.reassessment_trigger
          - entities.Engagement.fields.reassessment_required
          - entities.Engagement.fields.reassessment_due_date
        distinguishing_aspect: "The counter is a filtered rate, not a row count: only entries whose change_type is one of the three qualifying kinds AND whose affects_scope is true increment it, the threshold is inclusive at 3 so the second entry leaves the flag false, and once the accelerated due date is set at clock + 90 days a fourth qualifying entry must not move it again."
        test_recipe:
          setup:
            - "Engagement 'Northwind Retail Inc' is in SCOPING with no change-log entries; reassessment_due_date is null and the clock stands at 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /assessors"
              payload: { full_name: "Dana Reyes", email: "dana.reyes@qsa.example", certification_expires_at: "2027-06-30T00:00:00Z", qa_qualified: false }
              as: PlatformAdmin
              captures: { lead_id: $.data.id }
            - call: "POST /assessors"
              payload: { full_name: "Kim Vance", email: "kim.vance@qsa.example", certification_expires_at: "2027-06-30T00:00:00Z", qa_qualified: true }
              as: PlatformAdmin
              captures: { qa_id: $.data.id }
            - call: "POST /engagements"
              payload: { client_legal_name: "Northwind Retail Inc", merchant_level: "L1", assessment_year: 2026, acquirer_name: "First Coast Bank", fieldwork_start_date: "2026-08-10", fieldwork_end_date: "2026-08-28", approved_budget_amount: 200000.00, lead_assessor_id: "${lead_id}", qa_reviewer_id: "${qa_id}" }
              as: LeadAssessor
              as_user_id: "${lead_id}"
              captures: { eng_id: $.data.id }
          trigger:
            - call: "POST /engagements/${eng_id}/change-log-entries"
              payload: { change_type: "COMPONENT_ADDED_TO_CDE", description: "A reporting server was joined to the cardholder network.", affects_scope: true }
              as: ClientRepresentative
              captures: { cl_1_id: $.data.id }
            - call: "POST /engagements/${eng_id}/change-log-entries"
              payload: { change_type: "APPLICATION_UPDATED", description: "Payment application patched to 4.2.1.", affects_scope: true }
              as: ClientRepresentative
              captures: { cl_2_id: $.data.id }
            - call: "POST /engagements/${eng_id}/change-log-entries"
              payload: { change_type: "SEGMENT_RECLASSIFIED", description: "The warehouse VLAN was reclassified as connected.", affects_scope: false }
              as: ClientRepresentative
              captures: { cl_3_id: $.data.id }
            - call: "POST /engagements/${eng_id}/change-log-entries"
              payload: { change_type: "SEGMENT_RECLASSIFIED", description: "The call-centre VLAN was reclassified as connected.", affects_scope: true }
              as: ClientRepresentative
              captures: { cl_4_id: $.data.id }
            - call: "GET /engagements/${eng_id}"
              payload: {}
              as: LeadAssessor
              as_user_id: "${lead_id}"
              captures: { required_at_two: $.data.reassessment_required }
            - call: "POST /engagements/${eng_id}/change-log-entries"
              payload: { change_type: "THIRD_PARTY_ADDED", description: "A managed hosting provider took over the DC-EAST cage.", affects_scope: true }
              as: ClientRepresentative
              captures: { cl_5_id: $.data.id }
            - call: "GET /engagements/${eng_id}"
              payload: {}
              as: LeadAssessor
              as_user_id: "${lead_id}"
              captures: { due_at_three: $.data.reassessment_due_date }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /engagements/${eng_id}/change-log-entries"
              payload: { change_type: "COMPONENT_ADDED_TO_CDE", description: "A second reporting server was joined to the cardholder network.", affects_scope: true }
              as: ClientRepresentative
              captures: { cl_6_id: $.data.id }
            - call: "GET /engagements/${eng_id}/summary"
              payload: {}
              as: LeadAssessor
              as_user_id: "${lead_id}"
              captures: { count_final: $.data.scope_affecting_change_count }
          assert:
            - "ChangeLogEntry.${cl_1_id}.triggers_reassessment == true; ChangeLogEntry.${cl_2_id}.triggers_reassessment == false (APPLICATION_UPDATED is not a qualifying kind even with affects_scope true); ChangeLogEntry.${cl_3_id}.triggers_reassessment == false (qualifying kind but affects_scope false); ChangeLogEntry.${cl_4_id}.triggers_reassessment == true"
            - "${required_at_two} == false with scope_affecting_change_count == 2 - the inclusive threshold of 3 is not yet met after four entries"
            - "reassessment_due_date is still null at that point - nothing has been submitted and the flag has not flipped"
            - "ChangeLogEntry.${cl_5_id}.triggers_reassessment == true and the flag flips: reassessment_required == true with scope_affecting_change_count == 3"
            - "${due_at_three} == 2026-10-30 - the clock date 2026-08-01 plus the 90-day accelerated interval"
            - "After the clock moves to 2026-09-01 and ${cl_6_id} lands, ${count_final} == 4 and reassessment_required is still true, but reassessment_due_date is still 2026-10-30 - the accelerated date is set only when the flag first flips and is never pushed back out"
            - "GET /change-log-entries?engagement_id=${eng_id} returns total_count 6 and GET /change-log-entries?engagement_id=${eng_id}&triggers_reassessment=true returns total_count 4"
            - "Engagement.${eng_id}.status is still SCOPING and posture == OPEN - change tracking never moves the engagement by itself"

  # ---------------------------------------------------------------------------
  # Section 9 — Consistency Model (declared: immediate)
  # ---------------------------------------------------------------------------
  - section: consistency_model
    instances:

      - name: consistency_every_cascade_effect_is_visible_in_the_triggering_response
        claim_type: immediate
        grounds:
          - complexity_profile.consistency_model
          - calculations.engagement_posture
          - calculations.compliance_projection
        distinguishing_aspect: "The declared model is immediate, so a single FAIL verdict must return an already-recomputed world: the verdict response itself carries the segment's FAILED status, and the very next read - with no intervening write, no polling and no queue drain - shows the reclassified components, the stale plan, the new gap and the RESTRICTED posture. Any implementation that defers part of the cascade to a background pass fails on the first read after the verdict."
        test_recipe:
          setup:
            - "Engagement 'Northwind Retail Inc' is in FIELDWORK with segment 'CDE-CORE' VALIDATED, three sampled components at DC-EAST, an ACTIVE FINAL plan and requirement 1.2.1 concluded IN_PLACE on complete evidence."
            - "Segment 'CONNECTED-OPS' has just been declared and test-planned, so it is the only pre-VALIDATED segment when the verdict lands."
          setup_api_calls:
            - call: "POST /assessors"
              payload: { full_name: "Dana Reyes", email: "dana.reyes@qsa.example", certification_expires_at: "2027-06-30T00:00:00Z", qa_qualified: false }
              as: PlatformAdmin
              captures: { lead_id: $.data.id }
            - call: "POST /assessors"
              payload: { full_name: "Kim Vance", email: "kim.vance@qsa.example", certification_expires_at: "2027-06-30T00:00:00Z", qa_qualified: true }
              as: PlatformAdmin
              captures: { qa_id: $.data.id }
            - call: "POST /engagements"
