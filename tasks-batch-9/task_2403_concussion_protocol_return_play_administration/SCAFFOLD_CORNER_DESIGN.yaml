          - calculations.baseline_status_resolution
          - errors.ERR_RESOURCE_STATE_INVALID
        distinguishing_aspect: "Invalidation is one-way: the first invalidate drops the player's only VALID baseline so baseline_status becomes NONE, and a second invalidate on the same row returns ERR_RESOURCE_STATE_INVALID (409)."
        test_recipe:
          setup: ["K Mbeki with a single VALID pre-season baseline (composite 88) filed 2026-08-01"]
