            - "Variety.${v_id}.lifecycle_state is still IN_TRIAL - one region is below MIN_RELEASE_REGIONS 2"

      - name: royalty_rate_volume_band_boundary_at_ten_thousand_units
        claim_type: tiered_pricing
        grounds:
          - calculations.effective_royalty_rate.constants
          - calculations.royalty_report_totals.formula
          - entities.RoyaltyLineItem.fields.effective_rate_cents
        distinguishing_aspect: "VOLUME_BAND_1_UPPER is inclusive: at exactly 10000 billable units the multiplier is 1.00 giving rate 40.2500 and amount 402500, while one unit more (10001) drops into VOLUME_MULT_10001_50000 0.95 giving rate 38.2375 and amount 382413 - the marginal unit LOWERS the line total by 20087 cents because the discount applies to the whole line, not just the excess."
        test_recipe:
          setup:
            - "One Variety with base_royalty_cents_per_plant 35 and regional_performance_index 0.00, one Propagator, one ACTIVE TIER_A agreement for US-WA, two ACTIVE DOMESTIC PER_PLANT quotas Q1 and Q2 each of 20000 units with tags_activated_units 0."
            - "One DRAFT report carrying two lines: L1 on Q1 with reported_units 10000 and L2 on Q2 with reported_units 10001. due_at 2026-11-15T00:00:00Z with the clock at 2026-08-01T00:00:00Z, so the report is not late."
          setup_api_calls:
            - call: "POST /varieties"
              payload: { denomination: "Ironwood Bramble", species: "Rubus idaeus", breeder_code: "IW", base_royalty_cents_per_plant: 35, base_royalty_cents_per_acre: 1200 }
