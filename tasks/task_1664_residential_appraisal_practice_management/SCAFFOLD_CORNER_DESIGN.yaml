              payload: { order_id: "${o_id}", address: "9 Cmp Rd", sale_price_cents: 45250000, sale_date: "2026-06-01", distance_miles: 0.30, site_adjustment_cents: 0, gla_adjustment_cents: 0, condition_adjustment_cents: 0 }
              as: Appraiser
