# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# Task: task_3379_product_certification_testing_follow_up_inspection_mark
# 9 rules x 2 instances = 18 instances. Canonical capture names reused across
# instances: std_id, mfr_id, fac_id, proj_id, proj_v, cr_id, samp1, cert_id,
# cert_v. YAML anchors define reusable call blocks at first use.
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:

      - name: factory_conformity_window_vs_open_findings_diverge
        grounds:
          - calculations.factory_conformity_score
          - entities.Factory.fields.conformity_score
          - entities.Factory.fields.conformity_regime
        distinguishing_aspect: |
          Same finding history, two variants on the Factory domain: the STANDARD variant
          counts only findings from inspections completed within the trailing 24 months,
          while the PROBATION variant counts all open findings regardless of age — after
          the clock ages the CRITICAL inspection past 24 months, the STANDARD factory
          recomputes to 100 while the PROBATION factory stays at 60.
        test_recipe:
          setup:
            - "Clock at 2024-06-01. Manufacturer with factories F (site A) and G (site B)."
            - "F: CRITICAL inspection completed 2024-06-01 -> PROBATION, score 60; never re-inspected."
            - "G: identical CRITICAL inspection 2024-06-01 -> PROBATION, then a CONFORMING inspection 2024-07-01 -> STANDARD (score 60 under the then-current window)."
            - "Clock advanced to 2026-09-01: sweep recomputes only STANDARD-regime scores; G's 2024-06-01 inspection (27 months old) falls out of the window."
          setup_api_calls:
            - &k_clock_2024
              call: "POST /certification/_clock/set_current_utc"
              payload: { to_iso8601: "2024-06-01T00:00:00Z" }
              as: CertificationBodyAdmin
            - &k_mfr_std
              call: "POST /certification/manufacturers"
              payload: { legal_name: "Fenix Parts Inc", home_jurisdiction_code: "US-OSHA", annual_revenue_tier: "STANDARD" }
              as: CertificationBodyAdmin
              captures: { mfr_id: $.data.id }
            - call: "POST /certification/manufacturers/${mfr_id}/factories"
              payload: { site_code: "A", country_code: "US", jurisdiction_code: "US-OSHA" }
              as: CertificationBodyAdmin
              captures: { fac_f: $.data.id }
            - call: "POST /certification/manufacturers/${mfr_id}/factories"
              payload: { site_code: "B", country_code: "US", jurisdiction_code: "US-OSHA" }
              as: CertificationBodyAdmin
              captures: { fac_g: $.data.id }
            - call: "POST /certification/factories/${fac_f}/inspections"
              payload: { scheduled_for: "2024-06-01T00:00:00Z" }
              as: FactoryInspector
              as_user_id: "insp-1"
              captures: { insp_f1: $.data.id }
            - call: "POST /certification/inspections/${insp_f1}/complete"
              payload: { findings: [{ finding_ref: "FD-F1", severity: "CRITICAL", description: "Unlisted capacitor in primary circuit" }] }
              as: FactoryInspector
              as_user_id: "insp-1"
            - call: "POST /certification/factories/${fac_g}/inspections"
              payload: { scheduled_for: "2024-06-01T00:00:00Z" }
              as: FactoryInspector
              as_user_id: "insp-1"
              captures: { insp_g1: $.data.id }
            - call: "POST /certification/inspections/${insp_g1}/complete"
              payload: { findings: [{ finding_ref: "FD-G1", severity: "CRITICAL", description: "Unlisted capacitor in primary circuit" }] }
              as: FactoryInspector
              as_user_id: "insp-1"
            - call: "POST /certification/factories/${fac_g}/inspections"
              payload: { scheduled_for: "2024-07-01T00:00:00Z" }
              as: FactoryInspector
              as_user_id: "insp-1"
              captures: { insp_g2: $.data.id }
            - call: "POST /certification/inspections/${insp_g2}/complete"
              payload: { findings: [] }
              as: FactoryInspector
              as_user_id: "insp-1"
            - call: "POST /certification/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: CertificationBodyAdmin
          trigger:
            - call: "GET /certification/factories/${fac_f}"
              payload: {}
              as: ComplianceOfficer
            - call: "GET /certification/factories/${fac_g}"
              payload: {}
              as: ComplianceOfficer
          assert:
            - "Factory.${fac_f}.conformity_score == 60 and Factory.${fac_f}.conformity_regime == PROBATION and Factory.${fac_f}.open_critical_findings == 1"
            - "Factory.${fac_g}.conformity_score == 100 and Factory.${fac_g}.conformity_regime == STANDARD and Factory.${fac_g}.open_critical_findings == 1"
            - "Factory.${fac_g}.next_inspection_due_on == 2024-07-01T00:00:00Z + 12 months (score >= 90 interval)"

      - name: label_quota_standard_vs_probation_regimes_diverge
        grounds:
          - calculations.label_quota_allocation
          - entities.MarkLicense.fields.authorized_quantity
          - entities.MarkLicense.fields.quota_variant
        distinguishing_aspect: |
          Same declared_annual_volume (10000), two quota variants on the MarkLicense
          domain (a different entity domain than the Factory conformity score):
          STANDARD_QUOTA authorizes 11000 labels while PROBATION_QUOTA hard-caps at 500.
        test_recipe:
          setup:
            - "Clock at 2026-09-01 (default). Standard IT-AV/UL-62368 with protocols P-SAFE (mandatory, safety, threshold 50, fee 5000), P-TEMP (mandatory, threshold 100, fee 10001), P-MARK (optional, threshold 200, fee 10001); slots [enclosure, power_supply]."
            - "Manufacturer M1 (SMALL) with factory F1 (STANDARD regime) holds certification C1."
            - "Manufacturer M2 (SMALL) with factory F2 holds certification C2; afterwards F2 is driven to PROBATION via a factory-level CRITICAL finding (score 60)."
          setup_api_calls:
            - &k_clock
              call: "POST /certification/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: CertificationBodyAdmin
            - &k_std
              call: "POST /certification/standards"
              payload: { category_code: "IT-AV", standard_code: "UL-62368", edition_label: "Ed. 4", effective_from: "2026-01-01T00:00:00Z", effective_to: null, construction_requirements: ["enclosure", "power_supply"], test_protocols: [{ protocol_code: "P-SAFE", name: "Electric shock", mandatory: true, safety_critical: true, pass_threshold: 50, base_fee_cents: 5000 }, { protocol_code: "P-TEMP", name: "Temperature rise", mandatory: true, safety_critical: false, pass_threshold: 100, base_fee_cents: 10001 }, { protocol_code: "P-MARK", name: "Marking durability", mandatory: false, safety_critical: false, pass_threshold: 200, base_fee_cents: 10001 }] }
              as: CertificationBodyAdmin
              captures: { std_id: $.data.id }
            - &k_mfr_small
              call: "POST /certification/manufacturers"
              payload: { legal_name: "Acme Devices LLC", home_jurisdiction_code: "US-OSHA", annual_revenue_tier: "SMALL" }
              as: CertificationBodyAdmin
              captures: { mfr_id: $.data.id }
            - &k_fac
              call: "POST /certification/manufacturers/${mfr_id}/factories"
              payload: { site_code: "SZ-1", country_code: "CN", jurisdiction_code: "CN-SZ" }
              as: CertificationBodyAdmin
              captures: { fac_id: $.data.id }
            - &k_proj
              call: "POST /certification/projects"
              payload: { factory_id: "${fac_id}", category_code: "IT-AV", standard_id: "${std_id}", product_model: "AC-100" }
              as: ManufacturerRep
              as_user_id: "${mfr_id}"
              captures: { proj_id: $.data.id, proj_v: $.data.version }
            - &k_cr
              call: "POST /certification/projects/${proj_id}/construction-records"
              payload: { components: [{ slot: "enclosure", component_name: "BayBlend FR3010", material: "PC/ABS", part_number: "BB-FR3010", rating: "V-0" }, { slot: "power_supply", component_name: "MeanWell RS-25", material: "n/a", part_number: "MW-RS-25", rating: "100-240VAC" }], expected_project_version: "${proj_v}" }
              as: ManufacturerRep
              as_user_id: "${mfr_id}"
              captures: { cr_id: $.data.id }
            - &k_samp1
              call: "POST /certification/projects/${proj_id}/samples"
              payload: { serial_no: "S-1", condition: "INTACT" }
              as: ManufacturerRep
              as_user_id: "${mfr_id}"
              captures: { samp1: $.data.id }
            - &k_acc1
              call: "POST /certification/samples/${samp1}/triage"
              payload: { decision: "ACCEPT" }
              as: TestEngineer
              as_user_id: "eng-1"
            - &k_res_safe
              call: "POST /certification/samples/${samp1}/results"
              payload: { protocol_code: "P-SAFE", measured_value: 60 }
              as: TestEngineer
              as_user_id: "eng-1"
            - &k_res_temp
              call: "POST /certification/samples/${samp1}/results"
              payload: { protocol_code: "P-TEMP", measured_value: 110 }
              as: TestEngineer
              as_user_id: "eng-1"
            - &k_decide_ok
              call: "POST /certification/projects/${proj_id}/decide"
              payload: { outcome: "APPROVED", validity_months: 12 }
              as: CertificationReviewer
              as_user_id: "rev-1"
            - &k_get_cert
              call: "GET /certification/certifications"
              payload: { project_id: "${proj_id}" }
              as: ComplianceOfficer
              captures: { cert_id: $.data.0.id, cert_v: $.data.0.version }
            # --- second manufacturer / factory / certification, all inline ---
            - call: "POST /certification/manufacturers"
              payload: { legal_name: "Beacon Power Co", home_jurisdiction_code: "US-OSHA", annual_revenue_tier: "SMALL" }
              as: CertificationBodyAdmin
              captures: { mfr2_id: $.data.id }
            - call: "POST /certification/manufacturers/${mfr2_id}/factories"
              payload: { site_code: "GZ-1", country_code: "CN", jurisdiction_code: "CN-GZ" }
              as: CertificationBodyAdmin
              captures: { fac2_id: $.data.id }
            - call: "POST /certification/projects"
              payload: { factory_id: "${fac2_id}", category_code: "IT-AV", standard_id: "${std_id}", product_model: "BP-9" }
              as: ManufacturerRep
              as_user_id: "${mfr2_id}"
              captures: { proj2_id: $.data.id, proj2_v: $.data.version }
            - call: "POST /certification/projects/${proj2_id}/construction-records"
              payload: { components: [{ slot: "enclosure", component_name: "BayBlend FR3010", material: "PC/ABS", part_number: "BB-FR3010", rating: "V-0" }, { slot: "power_supply", component_name: "MeanWell RS-25", material: "n/a", part_number: "MW-RS-25", rating: "100-240VAC" }], expected_project_version: "${proj2_v}" }
              as: ManufacturerRep
              as_user_id: "${mfr2_id}"
            - call: "POST /certification/projects/${proj2_id}/samples"
              payload: { serial_no: "S-1", condition: "INTACT" }
              as: ManufacturerRep
              as_user_id: "${mfr2_id}"
              captures: { samp2: $.data.id }
            - call: "POST /certification/samples/${samp2}/triage"
              payload: { decision: "ACCEPT" }
              as: TestEngineer
              as_user_id: "eng-2"
            - call: "POST /certification/samples/${samp2}/results"
              payload: { protocol_code: "P-SAFE", measured_value: 60 }
              as: TestEngineer
              as_user_id: "eng-2"
            - call: "POST /certification/samples/${samp2}/results"
              payload: { protocol_code: "P-TEMP", measured_value: 110 }
              as: TestEngineer
              as_user_id: "eng-2"
            - call: "POST /certification/projects/${proj2_id}/decide"
              payload: { outcome: "APPROVED", validity_months: 12 }
              as: CertificationReviewer
              as_user_id: "rev-1"
            - call: "GET /certification/certifications"
              payload: { project_id: "${proj2_id}" }
              as: ComplianceOfficer
              captures: { cert2_id: $.data.0.id }
            # --- drive factory 2 to PROBATION before its license is created ---
            - call: "POST /certification/factories/${fac2_id}/inspections"
              payload: { scheduled_for: "2026-09-01T00:00:00Z" }
              as: FactoryInspector
              as_user_id: "insp-1"
              captures: { insp_p: $.data.id }
            - call: "POST /certification/inspections/${insp_p}/complete"
              payload: { findings: [{ finding_ref: "FD-P1", severity: "CRITICAL", description: "Factory substituted enclosure resin" }] }
              as: FactoryInspector
              as_user_id: "insp-1"
          trigger:
            - call: "POST /certification/certifications/${cert_id}/mark-licenses"
              payload: { label_type: "STANDARD", declared_annual_volume: 10000 }
              as: ManufacturerRep
              as_user_id: "${mfr_id}"
              captures: { lic1: $.data.id }
            - call: "POST /certification/certifications/${cert2_id}/mark-licenses"
              payload: { label_type: "STANDARD", declared_annual_volume: 10000 }
              as: ManufacturerRep
              as_user_id: "${mfr2_id}"
              captures: { lic2: $.data.id }
          assert:
            - "MarkLicense.${lic1}.quota_variant == STANDARD_QUOTA and MarkLicense.${lic1}.authorized_quantity == 11000"
            - "MarkLicense.${lic2}.quota_variant == PROBATION_QUOTA and MarkLicense.${lic2}.authorized_quantity == 500"
            - "MarkLicense.${lic1}.status == ACTIVE and MarkLicense.${lic2}.status == ACTIVE"
            - "Certification.${cert2_id}.status == ACTIVE (the CRITICAL finding named no certification, so no suspension cascade reached it)"
            - "Factory.${fac2_id}.conformity_regime == PROBATION and Factory.${fac2_id}.conformity_score == 60"

  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:

      - name: test_outcome_conditional_band_and_damage_cap
        grounds:
          - calculations.test_outcome_determination
          - entities.Sample.fields.results
        distinguishing_aspect: |
          Mode (a): a >=3-input non-linear formula (measured_value x pass_threshold x
          sample.condition x protocol.mandatory/safety_critical) — an INTACT sample at
          97/100 lands in the CONDITIONAL band, a DAMAGED sample at 105/100 is capped
          to CONDITIONAL despite exceeding the threshold, and a safety-critical protocol
          at 48/50 (inside the band) converts CONDITIONAL to FAIL.
        test_recipe:
          setup:
            - "Clock at 2026-09-01. Standard/manufacturer/factory/project as canonical. Samples SI (INTACT) and SD (DAMAGED) both ACCEPTED; project in TESTING."
          setup_api_calls:
            - *k_clock
            - *k_std
            - *k_mfr_small
            - *k_fac
            - *k_proj
            - call: "POST /certification/projects/${proj_id}/samples"
              payload: { serial_no: "SI-1", condition: "INTACT" }
              as: ManufacturerRep
              as_user_id: "${mfr_id}"
              captures: { samp_i: $.data.id }
            - call: "POST /certification/projects/${proj_id}/samples"
              payload: { serial_no: "SD-1", condition: "DAMAGED" }
              as: ManufacturerRep
              as_user_id: "${mfr_id}"
              captures: { samp_d: $.data.id }
            - call: "POST /certification/samples/${samp_i}/triage"
              payload: { decision: "ACCEPT" }
              as: TestEngineer
              as_user_id: "eng-1"
            - call: "POST /certification/samples/${samp_d}/triage"
              payload: { decision: "ACCEPT" }
              as: TestEngineer
              as_user_id: "eng-1"
          trigger:
            - call: "POST /certification/samples/${samp_i}/results"
              payload: { protocol_code: "P-TEMP", measured_value: 97 }
              as: TestEngineer
              as_user_id: "eng-1"
            - call: "POST /certification/samples/${samp_d}/results"
              payload: { protocol_code: "P-TEMP", measured_value: 105 }
              as: TestEngineer
              as_user_id: "eng-1"
            - call: "POST /certification/samples/${samp_i}/results"
              payload: { protocol_code: "P-SAFE", measured_value: 48 }
              as: TestEngineer
              as_user_id: "eng-1"
          assert:
            - "Sample.${samp_i}.results entry for P-TEMP has outcome == CONDITIONAL and margin == -3"
            - "Sample.${samp_d}.results entry for P-TEMP has outcome == CONDITIONAL and margin == 5 (DAMAGED cap: 105 >= 100 would be PASS on an INTACT sample)"
            - "Sample.${samp_i}.results entry for P-SAFE has outcome == FAIL (safety-critical converts in-band CONDITIONAL to FAIL; 48 >= 47.5 band floor)"
            - "Sample.${samp_i}.status == TESTED and Sample.${samp_d}.status == TESTED"

      - name: project_fee_per_line_rounding_order
        grounds:
          - calculations.project_fee_calculation
          - entities.CertificationProject.fields.fee_snapshot_cents
        distinguishing_aspect: |
          Mode (b): nested rounding with pinned order — each protocol fee is rounded to
          integer cents BEFORE summation (12501.25 -> 12501 twice), then the 10% SMALL
          discount is applied to the rounded subtotal: fee_snapshot_cents == 27002.
          Summing first (30002.50) and rounding after would yield 27003.
        test_recipe:
          setup:
            - "Clock at 2026-09-01. Canonical standard/manufacturer (SMALL tier)/factory/project with FROZEN construction record."
            - "Sample SI (INTACT, ACCEPTED) carries P-SAFE 60 (PASS). Sample SD (DAMAGED, ACCEPTED) carries P-TEMP 110 (CONDITIONAL by cap) and P-MARK 250 (CONDITIONAL by cap)."
            - "Recording P-MARK completes the mandatory-protocol gate; project auto-enters EVALUATION and snapshots the fee."
          setup_api_calls:
            - *k_clock
            - *k_std
            - *k_mfr_small
            - *k_fac
            - *k_proj
            - *k_cr
            - call: "POST /certification/projects/${proj_id}/samples"
              payload: { serial_no: "SI-1", condition: "INTACT" }
              as: ManufacturerRep
              as_user_id: "${mfr_id}"
              captures: { samp_i: $.data.id }
            - call: "POST /certification/projects/${proj_id}/samples"
              payload: { serial_no: "SD-1", condition: "DAMAGED" }
              as: ManufacturerRep
              as_user_id: "${mfr_id}"
              captures: { samp_d: $.data.id }
            - call: "POST /certification/samples/${samp_i}/triage"
              payload: { decision: "ACCEPT" }
              as: TestEngineer
              as_user_id: "eng-1"
            - call: "POST /certification/samples/${samp_d}/triage"
              payload: { decision: "ACCEPT" }
              as: TestEngineer
              as_user_id: "eng-1"
            - call: "POST /certification/samples/${samp_i}/results"
              payload: { protocol_code: "P-SAFE", measured_value: 60 }
              as: TestEngineer
              as_user_id: "eng-1"
            - call: "POST /certification/samples/${samp_d}/results"
              payload: { protocol_code: "P-TEMP", measured_value: 110 }
              as: TestEngineer
              as_user_id: "eng-1"
          trigger:
            - call: "POST /certification/samples/${samp_d}/results"
              payload: { protocol_code: "P-MARK", measured_value: 250 }
              as: TestEngineer
              as_user_id: "eng-1"
            - call: "GET /certification/projects/${proj_id}"
              payload: {}
              as: ComplianceOfficer
          assert:
            - "CertificationProject.${proj_id}.status == EVALUATION"
            - "CertificationProject.${proj_id}.fee_snapshot_cents == 27002"
            - "fee decomposition: lines 5000 (P-SAFE x1.0) + 12501 (P-TEMP x1.25 rounded) + 12501 (P-MARK x1.25 rounded) = 30002; round_half_up(30002 x 0.9) = 27002; retest_count 0 surcharge"

  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:

      - name: certification_suspend_reinstate_cycle_restores_licenses
        grounds:
          - state_machines.Certification.ACTIVE_to_SUSPENDED
          - state_machines.Certification.SUSPENDED_to_ACTIVE
          - state_machines.MarkLicense.SUSPENDED_to_ACTIVE
        distinguishing_aspect: |
          Certification has a cycle (ACTIVE -> SUSPENDED -> ACTIVE) on the
          Certification entity — distinct from the project's TESTING <-> EVALUATION
          loop — and the cycle mirrors onto its MarkLicense both ways.
        test_recipe:
          setup:
            - "Clock at 2026-09-01. Canonical certified setup: certification ACTIVE with a mark license (quota 11000, used 0) also ACTIVE."
          setup_api_calls:
            - *k_clock
            - *k_std
            - *k_mfr_small
            - *k_fac
            - *k_proj
            - *k_cr
            - *k_samp1
            - *k_acc1
            - *k_res_safe
            - *k_res_temp
            - *k_decide_ok
            - *k_get_cert
            - call: "POST /certification/certifications/${cert_id}/mark-licenses"
              payload: { label_type: "HOLOGRAM", declared_annual_volume: 10000 }
              as: ManufacturerRep
              as_user_id: "${mfr_id}"
              captures: { lic_id: $.data.id }
          trigger:
            - call: "POST /certification/certifications/${cert_id}/suspend"
              payload: { reason: "Routine surveillance hold" }
              as: ComplianceOfficer
            - call: "POST /certification/certifications/${cert_id}/reinstate"
              payload: {}
              as: ComplianceOfficer
            - call: "GET /certification/certifications/${cert_id}"
              payload: {}
              as: ComplianceOfficer
            - call: "GET /certification/mark-licenses/${lic_id}"
              payload: {}
              as: ComplianceOfficer
          assert:
            - "Certification.${cert_id}.status == ACTIVE after the suspend-then-reinstate cycle"
            - "Certification.${cert_id}.suspension_causes == [] (causes cleared on reinstate)"
            - "MarkLicense.${lic_id}.status == ACTIVE (mirrored down on suspend, restored on reinstate)"
            - "MarkLicense.${lic_id}.authorized_quantity == 11000 and used_quantity == 0 (cycle does not disturb quota fields)"

      - name: project_retest_loop_increments_and_reapproves
        grounds:
          - state_machines.CertificationProject.EVALUATION_to_TESTING
          - state_machines.CertificationProject.TESTING_to_EVALUATION
          - calculations.project_fee_calculation
        distinguishing_aspect: |
          CertificationProject has a cyclic retest loop (TESTING -> EVALUATION ->
          TESTING -> EVALUATION) on the project entity — a different entity than the
          Certification cycle — and each loop increments retest_count, adding a 50%
          surcharge on the discounted subtotal: fee 13501 -> 20252.
        test_recipe:
          setup:
            - "Clock at 2026-09-01. Canonical project to TESTING; sample S-1 (INTACT, ACCEPTED) carries P-SAFE 60 (PASS) and P-TEMP 90 (FAIL); project auto-enters EVALUATION with fee 13501."
          setup_api_calls:
            - *k_clock
            - *k_std
            - *k_mfr_small
            - *k_fac
            - *k_proj
            - *k_cr
            - *k_samp1
            - *k_acc1
            - *k_res_safe
            - call: "POST /certification/samples/${samp1}/results"
              payload: { protocol_code: "P-TEMP", measured_value: 90 }
              as: TestEngineer
              as_user_id: "eng-1"
            - call: "POST /certification/projects/${proj_id}/decide"
              payload: { outcome: "RETEST" }
              as: CertificationReviewer
              as_user_id: "rev-1"
            - call: "POST /certification/projects/${proj_id}/samples"
              payload: { serial_no: "S-2", condition: "INTACT" }
              as: ManufacturerRep
              as_user_id: "${mfr_id}"
              captures: { samp2: $.data.id }
            - call: "POST /certification/samples/${samp2}/triage"
              payload: { decision: "ACCEPT" }
              as: TestEngineer
              as_user_id: "eng-1"
            - call: "POST /certification/samples/${samp2}/results"
              payload: { protocol_code: "P-TEMP", measured_value: 115 }
              as: TestEngineer
              as_user_id: "eng-1"
          trigger:
            - call: "POST /certification/projects/${proj_id}/decide"
              payload: { outcome: "APPROVED", validity_months: 12 }
              as: CertificationReviewer
              as_user_id: "rev-1"
            - call: "GET /certification/projects/${proj_id}"
              payload: {}
              as: ComplianceOfficer
            - call: "GET /certification/certifications"
              payload: { project_id: "${proj_id}" }
              as: ComplianceOfficer
              captures: { cert_id: $.data.0.id }
          assert:
            - "CertificationProject.${proj_id}.retest_count == 1"
            - "CertificationProject.${proj_id}.status == APPROVED (second EVALUATION entry succeeded after the loop)"
            - "CertificationProject.${proj_id}.fee_snapshot_cents == 20252 (lines 5000 + 10001 = 15001; x0.9 = 13501; surcharge round_half_up(13501 x 0.5 x 1) = 6751; 13501 + 6751)"
            - "Certification.${cert_id} exists with status ACTIVE, listing_number matches ^E\\d{6}$"

  # ===========================================================================
  - rule_id: transitive_cascade
    instances:

      - name: withdrawal_enforcement_cascades_notice_cert_license_batch
        grounds:
          - state_machines.WithdrawalNotice.PUBLISHED_to_EFFECTIVE
          - state_machines.Certification.ACTIVE_to_WITHDRAWN
          - state_machines.MarkLicense.ACTIVE_to_REVOKED
          - state_machines.LabelBatch.ISSUED_to_VOIDED
        distinguishing_aspect: |
          Depth-3 cascade triggered by the clock sweep enforcing a withdrawal notice:
          notice EFFECTIVE causes certification WITHDRAWN, which causes each license
          REVOKED, which causes each ISSUED batch VOIDED — each hop caused by the
          previous mutation, not by the original trigger.
        test_recipe:
          setup:
            - "Clock at 2026-09-01. Canonical certified setup; license L (quota 11000) with batches B1 (qty 100, serials 1..100) and B2 (qty 50, serials 101..150); used_quantity 150, next_serial 151."
            - "WithdrawalNotice N drafted and published at 2026-09-01 -> effective_on 2026-09-15T00:00:00Z."
          setup_api_calls:
            - *k_clock
            - *k_std
            - *k_mfr_small
            - *k_fac
            - *k_proj
            - *k_cr
            - *k_samp1
            - *k_acc1
            - *k_res_safe
            - *k_res_temp
            - *k_decide_ok
            - *k_get_cert
            - call: "POST /certification/certifications/${cert_id}/mark-licenses"
              payload: { label_type: "STANDARD", declared_annual_volume: 10000 }
              as: ManufacturerRep
              as_user_id: "${mfr_id}"
              captures: { lic_id: $.data.id }
            - call: "POST /certification/mark-licenses/${lic_id}/label-batches"
              payload: { quantity: 100 }
              as: ManufacturerRep
              as_user_id: "${mfr_id}"
              captures: { b1: $.data.id }
            - call: "POST /certification/mark-licenses/${lic_id}/label-batches"
              payload: { quantity: 50 }
              as: ManufacturerRep
              as_user_id: "${mfr_id}"
              captures: { b2: $.data.id }
            - call: "POST /certification/certifications/${cert_id}/withdrawal-notices"
              payload: { reason_code: "NONCONFORMITY", public_text: "Listing E000001 withdrawn due to factory nonconformity." }
              as: ComplianceOfficer
              captures: { notice_id: $.data.id }
            - call: "POST /certification/withdrawal-notices/${notice_id}/publish"
              payload: {}
              as: ComplianceOfficer
          trigger:
            - call: "POST /certification/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-15T00:00:00Z" }
              as: CertificationBodyAdmin
            - call: "GET /certification/certifications/${cert_id}"
              payload: {}
              as: ComplianceOfficer
            - call: "GET /certification/mark-licenses/${lic_id}"
              payload: {}
              as: ComplianceOfficer
            - call: "GET /certification/mark-licenses/${lic_id}/label-batches"
              payload: {}
              as: ComplianceOfficer
          assert:
            - "WithdrawalNotice.${notice_id}.status == EFFECTIVE (observed via the certification's notice list)"
            - "Certification.${cert_id}.status == WITHDRAWN"
            - "MarkLicense.${lic_id}.status == REVOKED"
            - "both LabelBatch.${b1} and LabelBatch.${b2} statuses == VOIDED"
            - "MarkLicense.${lic_id}.used_quantity == 0 while MarkLicense.${lic_id}.next_serial == 151 (serials never rewound)"

      - name: critical_finding_cascades_cert_suspend_to_license_block
        grounds:
          - state_machines.FollowUpInspection.SCHEDULED_to_COMPLETED
          - state_machines.Certification.ACTIVE_to_SUSPENDED
          - state_machines.MarkLicense.ACTIVE_to_SUSPENDED
        distinguishing_aspect: |
          Depth-2 cascade from a different trigger (inspection completion, not clock
          enforcement): a CRITICAL finding naming the certification suspends it, and
          the certification's suspension in turn suspends its license, which then
          blocks label issuance with ERR_LICENSE_NOT_ACTIVE.
        test_recipe:
          setup:
            - "Clock at 2026-09-01. Canonical certified setup; license L ACTIVE (quota 11000, used 0)."
          setup_api_calls:
            - *k_clock
            - *k_std
            - *k_mfr_small
            - *k_fac
            - *k_proj
            - *k_cr
            - *k_samp1
            - *k_acc1
            - *k_res_safe
            - *k_res_temp
            - *k_decide_ok
            - *k_get_cert
            - call: "POST /certification/certifications/${cert_id}/mark-licenses"
              payload: { label_type: "STANDARD", declared_annual_volume: 10000 }
              as: ManufacturerRep
              as_user_id: "${mfr_id}"
              captures: { lic_id: $.data.id }
          trigger:
            - call: "POST /certification/factories/${fac_id}/inspections"
              payload: { scheduled_for: "2026-09-01T00:00:00Z" }
              as: FactoryInspector
              as_user_id: "insp-1"
              captures: { insp_id: $.data.id }
            - call: "POST /certification/inspections/${insp_id}/complete"
              payload: { findings: [{ finding_ref: "FD-9", certification_id: "${cert_id}", severity: "CRITICAL", description: "Production unit uses unlisted relay" }] }
              as: FactoryInspector
              as_user_id: "insp-1"
            - call: "POST /certification/mark-licenses/${lic_id}/label-batches"
              payload: { quantity: 100 }
              as: ManufacturerRep
              as_user_id: "${mfr_id}"
              captures: { err_id: $.data.error_id }
          assert:
            - "Certification.${cert_id}.status == SUSPENDED and suspension_causes contains 'CRITICAL_FINDING:FD-9'"
            - "MarkLicense.${lic_id}.status == SUSPENDED"
            - "the label-batch call is rejected with error_id == ERR_LICENSE_NOT_ACTIVE"
            - "Factory.${fac_id}.open_critical_findings == 1 and conformity_score == 60 and conformity_regime == PROBATION"

  # ===========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:

      - name: label_batch_on_exhausted_license_state_error_wins_over_quota
        grounds:
          - validations[priority=6]
          - validations[priority=11]
          - errors[ERR_LICENSE_NOT_ACTIVE]
          - errors[ERR_LABEL_QUOTA_EXCEEDED]
        distinguishing_aspect: |
          Category pair state vs business_fiscal: a batch request on an EXHAUSTED
          license violates two rules at once — the state precondition (license not
          ACTIVE) and the quota rule (quantity exceeds remaining 0); the priority-6
          state error ERR_LICENSE_NOT_ACTIVE must win over the priority-11 fiscal error.
        test_recipe:
          setup:
            - "Clock at 2026-09-01. Canonical certified setup; license L (STANDARD_QUOTA, authorized 11000); batch of 11000 consumes the entire quota -> EXHAUSTED."
          setup_api_calls:
            - *k_clock
            - *k_std
            - *k_mfr_small
            - *k_fac
            - *k_proj
            - *k_cr
            - *k_samp1
            - *k_acc1
            - *k_res_safe
            - *k_res_temp
            - *k_decide_ok
            - *k_get_cert
            - call: "POST /certification/certifications/${cert_id}/mark-licenses"
              payload: { label_type: "STANDARD", declared_annual_volume: 10000 }
              as: ManufacturerRep
              as_user_id: "${mfr_id}"
              captures: { lic_id: $.data.id }
            - call: "POST /certification/mark-licenses/${lic_id}/label-batches"
              payload: { quantity: 11000 }
              as: ManufacturerRep
              as_user_id: "${mfr_id}"
          trigger:
            - call: "POST /certification/mark-licenses/${lic_id}/label-batches"
              payload: { quantity: 1 }
              as: ManufacturerRep
              as_user_id: "${mfr_id}"
              captures: { err_id: $.data.error_id }
          assert:
            - "error_id == ERR_LICENSE_NOT_ACTIVE (state priority 6 beats business_fiscal priority 11)"
            - "MarkLicense.${lic_id}.used_quantity == 11000 and status == EXHAUSTED (no mutation from the rejected call)"

      - name: safety_protocol_failure_wins_over_mandatory_constraint_failure
        grounds:
          - validations[priority=7]
          - validations[priority=10]
          - errors[ERR_SAFETY_PROTOCOL_NOT_PASSED]
          - errors[ERR_MANDATORY_PROTOCOL_FAILING]
        distinguishing_aspect: |
          Different category pair than the license conflict: business_safety vs
          business_constraint at project approval — the safety-critical protocol's
          in-band CONDITIONAL-turned-FAIL and an ordinary mandatory FAIL both hold,
          and ERR_SAFETY_PROTOCOL_NOT_PASSED (priority 7) must win.
        test_recipe:
          setup:
            - "Clock at 2026-09-01. Canonical project with FROZEN construction record; sample S-1 (INTACT, ACCEPTED) carries P-SAFE 48 (in-band -> FAIL because safety-critical) and P-TEMP 90 (FAIL); project has auto-entered EVALUATION (gate requires only that latest outcomes exist)."
          setup_api_calls:
            - *k_clock
            - *k_std
            - *k_mfr_small
            - *k_fac
            - *k_proj
            - *k_cr
            - *k_samp1
            - *k_acc1
            - call: "POST /certification/samples/${samp1}/results"
              payload: { protocol_code: "P-SAFE", measured_value: 48 }
              as: TestEngineer
              as_user_id: "eng-1"
            - call: "POST /certification/samples/${samp1}/results"
              payload: { protocol_code: "P-TEMP", measured_value: 90 }
              as: TestEngineer
              as_user_id: "eng-1"
          trigger:
            - call: "POST /certification/projects/${proj_id}/decide"
              payload: { outcome: "APPROVED", validity_months: 12 }
              as: CertificationReviewer
              as_user_id: "rev-1"
              captures: { err_id: $.data.error_id }
          assert:
            - "project status was EVALUATION before the decide call (both mandatory protocols have latest outcomes)"
            - "error_id == ERR_SAFETY_PROTOCOL_NOT_PASSED (priority 7 beats priority 10 ERR_MANDATORY_PROTOCOL_FAILING)"
            - "CertificationProject.${proj_id}.status == EVALUATION afterwards (failed decide mutates nothing)"
            - "no Certification exists for the project (GET /certification/certifications?project_id returns empty array)"

  # ===========================================================================
  - rule_id: boundary_precision_check
    instances:

      - name: label_batch_exact_fit_allowed_over_by_one_rejected
        grounds:
          - calculations.serial_range_allocation
          - errors[ERR_LABEL_QUOTA_EXCEEDED]
          - entities.MarkLicense.fields.used_quantity
        distinguishing_aspect: |
          Metric: label count. The quota comparison is strict-greater rejection:
          quantity == remaining (exact fit) succeeds and flips the license to
          EXHAUSTED, while quantity == remaining + 1 fails with ERR_LABEL_QUOTA_EXCEEDED.
        test_recipe:
          setup:
            - "Clock at 2026-09-01. Canonical certified setup; factory driven to PROBATION by a factory-level CRITICAL finding; license L created under PROBATION_QUOTA -> authorized_quantity 500."
          setup_api_calls:
            - *k_clock
            - *k_std
            - *k_mfr_small
            - *k_fac
            - *k_proj
            - *k_cr
            - *k_samp1
            - *k_acc1
            - *k_res_safe
            - *k_res_temp
            - *k_decide_ok
            - *k_get_cert
            - call: "POST /certification/factories/${fac_id}/inspections"
              payload: { scheduled_for: "2026-09-01T00:00:00Z" }
              as: FactoryInspector
              as_user_id: "insp-1"
              captures: { insp_id: $.data.id }
            - call: "POST /certification/inspections/${insp_id}/complete"
              payload: { findings: [{ finding_ref: "FD-P", severity: "CRITICAL", description: "Unauthorized material on line 2" }] }
              as: FactoryInspector
              as_user_id: "insp-1"
            - call: "POST /certification/certifications/${cert_id}/mark-licenses"
              payload: { label_type: "STANDARD", declared_annual_volume: 10000 }
              as: ManufacturerRep
              as_user_id: "${mfr_id}"
              captures: { lic_id: $.data.id }
            - call: "POST /certification/mark-licenses/${lic_id}/label-batches"
              payload: { quantity: 499 }
              as: ManufacturerRep
              as_user_id: "${mfr_id}"
              captures: { b1: $.data.id }
          trigger:
            - call: "POST /certification/mark-licenses/${lic_id}/label-batches"
              payload: { quantity: 2 }
              as: ManufacturerRep
              as_user_id: "${mfr_id}"
              captures: { err_id: $.data.error_id }
            - call: "POST /certification/mark-licenses/${lic_id}/label-batches"
              payload: { quantity: 1 }
              as: ManufacturerRep
              as_user_id: "${mfr_id}"
              captures: { b2: $.data.id }
            - call: "GET /certification/mark-licenses/${lic_id}"
              payload: {}
              as: ComplianceOfficer
          assert:
            - "after the 499 batch: MarkLicense.${lic_id}.used_quantity == 499 and status == ACTIVE"
            - "quantity 2 with remaining 1 -> error_id == ERR_LABEL_QUOTA_EXCEEDED (strictly-greater rejects over-by-one)"
            - "quantity 1 with remaining 1 -> 201; LabelBatch.${b2}.serial_start == 500 and serial_end == 500"
            - "MarkLicense.${lic_id}.used_quantity == 500 and status == EXHAUSTED (exact fit is allowed and flips status)"

      - name: conformity_score_exactly_70_stays_standard_regime
        grounds:
          - calculations.factory_conformity_score
          - calculations.inspection_interval_derived
          - entities.Factory.fields.conformity_score
        distinguishing_aspect: |
          Different metric (conformity score) on a different endpoint (inspection
          complete): penalties totaling exactly 30 leave the score at exactly 70.00,
          which does NOT trigger PROBATION (threshold is < 70); one further MINOR
          finding (65) flips the regime.
        test_recipe:
          setup:
            - "Clock at 2026-09-01 (default). Manufacturer + factory, no inspections yet."
          setup_api_calls:
            - *k_clock
            - *k_mfr_std
            - &k_fac_b
              call: "POST /certification/manufacturers/${mfr_id}/factories"
              payload: { site_code: "SZ-1", country_code: "CN", jurisdiction_code: "CN-SZ" }
              as: CertificationBodyAdmin
              captures: { fac_id: $.data.id }
            - call: "POST /certification/factories/${fac_id}/inspections"
              payload: { scheduled_for: "2026-09-01T00:00:00Z" }
              as: FactoryInspector
              as_user_id: "insp-1"
              captures: { insp1: $.data.id }
            - call: "POST /certification/inspections/${insp1}/complete"
              payload: { findings: [{ finding_ref: "FD-1", severity: "MAJOR", description: "Missing torque records" }, { finding_ref: "FD-2", severity: "MAJOR", description: "Un calibrated hipot tester" }] }
              as: FactoryInspector
              as_user_id: "insp-1"
            - call: "GET /certification/factories/${fac_id}"
              payload: {}
              as: ComplianceOfficer
              captures: { score_at_70: $.data.conformity_score, regime_at_70: $.data.conformity_regime }
            - call: "POST /certification/factories/${fac_id}/inspections"
              payload: { scheduled_for: "2026-09-26T00:00:00Z" }
              as: FactoryInspector
              as_user_id: "insp-1"
              captures: { insp2: $.data.id }
          trigger:
            - call: "POST /certification/inspections/${insp2}/complete"
              payload: { findings: [{ finding_ref: "FD-3", severity: "MINOR", description: "Label log missing a page" }] }
              as: FactoryInspector
              as_user_id: "insp-1"
            - call: "GET /certification/factories/${fac_id}"
              payload: {}
              as: ComplianceOfficer
          assert:
            - "after two MAJOR findings: conformity_score == 70 and conformity_regime == STANDARD (70 is not < 70)"
            - "after the additional MINOR: conformity_score == 65 and conformity_regime == PROBATION"
            - "at score 70 the derived interval was 6 months (next_inspection_due_on == 2027-03-01T00:00:00Z); at 65 / PROBATION it becomes 3 months (2026-12-26T00:00:00Z)"

  # ===========================================================================
  - rule_id: cross_entity_state_dependency
    instances:

      - name: project_evaluation_gate_depends_on_sample_states
        grounds:
          - state_machines.CertificationProject.TESTING_to_EVALUATION
          - state_machines.Sample.SUBMITTED_to_REJECTED
          - calculations.evaluation_readiness
        distinguishing_aspect: |
          Entity pair Sample -> CertificationProject: the project's TESTING ->
          EVALUATION auto-transition is gated on the states of its Sample children —
          a REJECTED sample contributes nothing, so the project stays stuck until an
          ACCEPTED sample carries the mandatory results.
        test_recipe:
          setup:
            - "Clock at 2026-09-01. Canonical project with FROZEN construction record; sample S-1 submitted then REJECTED at triage; no accepted samples exist."
          setup_api_calls:
            - *k_clock
            - *k_std
            - *k_mfr_small
            - *k_fac
            - *k_proj
            - *k_cr
            - *k_samp1
            - call: "POST /certification/samples/${samp1}/triage"
              payload: { decision: "REJECT", note: "Cracked enclosure" }
              as: TestEngineer
              as_user_id: "eng-1"
          trigger:
            - call: "POST /certification/projects/${proj_id}/decide"
              payload: { outcome: "APPROVED" }
              as: CertificationReviewer
              as_user_id: "rev-1"
              captures: { err_id: $.data.error_id }
            - call: "POST /certification/projects/${proj_id}/samples"
              payload: { serial_no: "S-2", condition: "INTACT" }
              as: ManufacturerRep
              as_user_id: "${mfr_id}"
              captures: { samp2: $.data.id }
            - call: "POST /certification/samples/${samp2}/triage"
              payload: { decision: "ACCEPT" }
              as: TestEngineer
              as_user_id: "eng-1"
            - call: "POST /certification/samples/${samp2}/results"
              payload: { protocol_code: "P-SAFE", measured_value: 60 }
              as: TestEngineer
              as_user_id: "eng-1"
            - call: "POST /certification/samples/${samp2}/results"
              payload: { protocol_code: "P-TEMP", measured_value: 110 }
              as: TestEngineer
              as_user_id: "eng-1"
            - call: "GET /certification/projects/${proj_id}"
              payload: {}
              as: ComplianceOfficer
          assert:
            - "while only a REJECTED sample exists: project status == STANDARD_SELECTED (never reached TESTING) and decide fails with error_id == ERR_PROJECT_NOT_EVALUABLE"
            - "the REJECTED sample's nonexistent results do not count: after S-2's results the project status == EVALUATION"
            - "CertificationProject.${proj_id}.fee_snapshot_cents == 13501 once EVALUATION is reached"

      - name: substitution_implement_blocked_while_certification_suspended
        grounds:
          - state_machines.SubstitutionRequest.APPROVED_to_IMPLEMENTED
          - state_machines.Certification.SUSPENDED_to_ACTIVE
          - errors[ERR_CERTIFICATION_NOT_ACTIVE]
        distinguishing_aspect: |
          Different entity pair (Certification -> SubstitutionRequest): an APPROVED
          substitution cannot be implemented while its certification is SUSPENDED;
          reinstating the certification re-opens the transition.
        test_recipe:
          setup:
            - "Clock at 2026-09-01. Canonical certified setup; substitution request for slot 'power_supply' created and APPROVED."
          setup_api_calls:
            - *k_clock
            - *k_std
            - *k_mfr_small
            - *k_fac
            - *k_proj
            - *k_cr
            - *k_samp1
            - *k_acc1
            - *k_res_safe
            - *k_res_temp
            - *k_decide_ok
            - *k_get_cert
            - call: "POST /certification/certifications/${cert_id}/substitution-requests"
              payload: { slot: "power_supply", proposed_component: { component_name: "MeanWell RS-25-PRO", material: "n/a", part_number: "MW-RS-25-PRO", rating: "100-240VAC" }, rationale: "Original PSU discontinued" }
              as: ManufacturerRep
              as_user_id: "${mfr_id}"
              captures: { sub_id: $.data.id }
            - call: "POST /certification/substitution-requests/${sub_id}/decide"
              payload: { outcome: "APPROVE" }
              as: CertificationReviewer
              as_user_id: "rev-1"
          trigger:
            - call: "POST /certification/certifications/${cert_id}/suspend"
              payload: { reason: "Surveillance hold" }
              as: ComplianceOfficer
            - call: "GET /certification/certifications/${cert_id}"
              payload: {}
              as: ComplianceOfficer
              captures: { cert_vs: $.data.version }
            - call: "POST /certification/substitution-requests/${sub_id}/implement"
              payload: { expected_certification_version: "${cert_vs}" }
              as: ManufacturerRep
              as_user_id: "${mfr_id}"
              captures: { err_id: $.data.error_id }
            - call: "POST /certification/certifications/${cert_id}/reinstate"
              payload: {}
              as: ComplianceOfficer
            - call: "GET /certification/certifications/${cert_id}"
              payload: {}
              as: ComplianceOfficer
              captures: { cert_v2: $.data.version }
            - call: "POST /certification/substitution-requests/${sub_id}/implement"
              payload: { expected_certification_version: "${cert_v2}" }
              as: ManufacturerRep
              as_user_id: "${mfr_id}"
            - call: "GET /certification/projects/${proj_id}/construction-records"
              payload: {}
              as: ComplianceOfficer
          assert:
            - "while SUSPENDED: implement fails with error_id == ERR_CERTIFICATION_NOT_ACTIVE and the substitution stays APPROVED"
            - "after reinstate: implement succeeds and SubstitutionRequest.${sub_id}.status == IMPLEMENTED"
            - "Certification.${cert_id}.construction_record_revision == 2 and permitted_variations contains {slot: power_supply, allowed_alternates: [MW-RS-25-PRO]}"
            - "the project's construction-records list shows revision 1 SUPERSEDED and revision 2 FROZEN with the substituted power_supply"

  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:

      - name: standard_edition_half_open_window_adjacency
        grounds:
          - calculations.standard_edition_overlap
          - errors[ERR_STANDARD_EDITION_OVERLAP]
          - entities.Standard.fields.effective_to
        distinguishing_aspect: |
          Resource: Standard editions within (category_code, standard_code). Interval
          semantics are half-open [effective_from, effective_to): an edition starting
          exactly when the previous one ends is legal, while one day earlier overlaps.
        test_recipe:
          setup:
            - "Clock at 2026-09-01. Standard A: IT-AV/UL-60335 Ed.5 with window [2026-01-01, 2027-01-01)."
          setup_api_calls:
            - *k_clock
            - call: "POST /certification/standards"
              payload: { category_code: "IT-AV", standard_code: "UL-60335", edition_label: "Ed. 5", effective_from: "2026-01-01T00:00:00Z", effective_to: "2027-01-01T00:00:00Z", construction_requirements: ["enclosure"], test_protocols: [{ protocol_code: "P-1", name: "p", mandatory: true, safety_critical: false, pass_threshold: 10, base_fee_cents: 1000 }] }
              as: CertificationBodyAdmin
              captures: { std_a: $.data.id }
          trigger:
            - call: "POST /certification/standards"
              payload: { category_code: "IT-AV", standard_code: "UL-60335", edition_label: "Ed. 6", effective_from: "2027-01-01T00:00:00Z", effective_to: null, construction_requirements: ["enclosure"], test_protocols: [{ protocol_code: "P-1", name: "p", mandatory: true, safety_critical: false, pass_threshold: 10, base_fee_cents: 1000 }] }
              as: CertificationBodyAdmin
              captures: { std_b: $.data.id }
            - call: "POST /certification/standards"
              payload: { category_code: "IT-AV", standard_code: "UL-60335", edition_label: "Ed. 5.1", effective_from: "2026-12-31T00:00:00Z", effective_to: null, construction_requirements: ["enclosure"], test_protocols: [{ protocol_code: "P-1", name: "p", mandatory: true, safety_critical: false, pass_threshold: 10, base_fee_cents: 1000 }] }
              as: CertificationBodyAdmin
              captures: { err_id: $.data.error_id }
            - call: "POST /certification/standards"
              payload: { category_code: "IT-AV", standard_code: "UL-9999", edition_label: "Ed. 1", effective_from: "2026-06-01T00:00:00Z", effective_to: null, construction_requirements: ["enclosure"], test_protocols: [{ protocol_code: "P-1", name: "p", mandatory: true, safety_critical: false, pass_threshold: 10, base_fee_cents: 1000 }] }
              as: CertificationBodyAdmin
              captures: { std_d: $.data.id }
          assert:
            - "Standard.${std_b} created (201): adjacency at 2027-01-01 is allowed because the window is half-open"
            - "the Ed. 5.1 call is rejected with error_id == ERR_STANDARD_EDITION_OVERLAP (one day of overlap with A suffices)"
            - "Standard.${std_d} created (201): the overlap rule scopes to the same (category_code, standard_code) pair only"

      - name: factory_inspection_minimum_gap_buffer
        grounds:
          - calculations.inspection_scheduling_gap
          - errors[ERR_INSPECTION_GAP_VIOLATION]
        distinguishing_aspect: |
          Different resource (FollowUpInspection on a Factory) with different interval
          semantics: a minimum-gap buffer — even non-overlapping instants closer than
          25 days are rejected, and exactly 25 days passes (>= comparison).
        test_recipe:
          setup:
            - "Clock at 2026-09-01. Manufacturer + factory with inspection I1 scheduled for 2026-10-01."
          setup_api_calls:
            - *k_clock
            - *k_mfr_std
            - *k_fac_b
            - call: "POST /certification/factories/${fac_id}/inspections"
              payload: { scheduled_for: "2026-10-01T00:00:00Z" }
              as: FactoryInspector
              as_user_id: "insp-1"
              captures: { insp1: $.data.id }
          trigger:
            - call: "POST /certification/factories/${fac_id}/inspections"
              payload: { scheduled_for: "2026-10-25T00:00:00Z" }
              as: FactoryInspector
              as_user_id: "insp-1"
              captures: { err_id: $.data.error_id }
            - call: "POST /certification/factories/${fac_id}/inspections"
              payload: { scheduled_for: "2026-10-26T00:00:00Z" }
              as: FactoryInspector
              as_user_id: "insp-1"
              captures: { insp2: $.data.id }
          assert:
            - "2026-10-25 (24 days after I1) -> error_id == ERR_INSPECTION_GAP_VIOLATION"
            - "2026-10-26 (exactly 25 days) -> 201, FollowUpInspection.${insp2}.status == SCHEDULED (boundary is inclusive-pass)"
            - "the gap check is bidirectional: it uses absolute difference, so scheduling 24 days BEFORE I1 would fail identically"

  # ===========================================================================
  - rule_id: compensating_invariant
    instances:

      - name: label_batch_void_restores_quota_without_serial_rewind
        grounds:
          - state_machines.LabelBatch.ISSUED_to_VOIDED
          - calculations.serial_range_allocation
          - entities.MarkLicense.fields.used_quantity
          - entities.MarkLicense.fields.next_serial
        distinguishing_aspect: |
          Conserved quantity: label units — invariant used_quantity == sum(quantity
          over ISSUED batches) and used_quantity + remaining == authorized_quantity;
          voiding restores the quota while next_serial is explicitly NOT conserved
          (monotonic, never rewound).
        test_recipe:
          setup:
            - "Clock at 2026-09-01. Canonical certified setup; factory in PROBATION (factory-level CRITICAL finding); license L authorized 500. Batches B1 (300, serials 1..300) and B2 (200, serials 301..500) issued -> EXHAUSTED, used 500."
          setup_api_calls:
            - *k_clock
            - *k_std
            - *k_mfr_small
            - *k_fac
            - *k_proj
            - *k_cr
            - *k_samp1
            - *k_acc1
            - *k_res_safe
            - *k_res_temp
            - *k_decide_ok
            - *k_get_cert
            - call: "POST /certification/factories/${fac_id}/inspections"
              payload: { scheduled_for: "2026-09-01T00:00:00Z" }
              as: FactoryInspector
              as_user_id: "insp-1"
              captures: { insp_id: $.data.id }
            - call: "POST /certification/inspections/${insp_id}/complete"
              payload: { findings: [{ finding_ref: "FD-P", severity: "CRITICAL", description: "Unauthorized material on line 2" }] }
              as: FactoryInspector
              as_user_id: "insp-1"
            - call: "POST /certification/certifications/${cert_id}/mark-licenses"
              payload: { label_type: "STANDARD", declared_annual_volume: 10000 }
              as: ManufacturerRep
              as_user_id: "${mfr_id}"
              captures: { lic_id: $.data.id }
            - call: "POST /certification/mark-licenses/${lic_id}/label-batches"
              payload: { quantity: 300 }
              as: ManufacturerRep
              as_user_id: "${mfr_id}"
              captures: { b1: $.data.id }
            - call: "POST /certification/mark-licenses/${lic_id}/label-batches"
              payload: { quantity: 200 }
              as: ManufacturerRep
              as_user_id: "${mfr_id}"
              captures: { b2: $.data.id }
          trigger:
            - call: "POST /certification/label-batches/${b1}/void"
              payload: { reason: "Print defect on roll" }
              as: ManufacturerRep
              as_user_id: "${mfr_id}"
            - call: "GET /certification/mark-licenses/${lic_id}"
              payload: {}
              as: ComplianceOfficer
              captures: { used_after_void: $.data.used_quantity, next_after_void: $.data.next_serial }
            - call: "POST /certification/mark-licenses/${lic_id}/label-batches"
              payload: { quantity: 300 }
              as: ManufacturerRep
              as_user_id: "${mfr_id}"
              captures: { b3: $.data.id }
          assert:
            - "after voiding B1: MarkLicense.${lic_id}.used_quantity == 200 and status == ACTIVE (EXHAUSTED reopens)"
            - "MarkLicense.${lic_id}.next_serial == 501 — voids never rewind serials"
            - "LabelBatch.${b3}.serial_start == 501 and serial_end == 800 (no reuse of the voided 1..300 range)"
            - "final invariant: used_quantity == 500 == 200 (B2) + 300 (B3), the sum over ISSUED batches; status back to EXHAUSTED"

      - name: inspection_void_restores_conformity_and_reinstates_certification
        grounds:
          - state_machines.FollowUpInspection.COMPLETED_to_VOIDED
          - state_machines.Certification.SUSPENDED_to_ACTIVE
          - calculations.factory_conformity_score
          - entities.Factory.fields.open_critical_findings
        distinguishing_aspect: |
          Different conserved quantity than label units: the factory's open critical
          finding count and conformity score — completing a CRITICAL-finding
          inspection and then voiding it must leave open_critical_findings == 0 and
          conformity_score == 100 (the pre-inspection baseline), and the finding-
          caused certification suspension must unwind end-to-end.
        test_recipe:
          setup:
            - "Clock at 2026-09-01. Canonical certified setup with license L ACTIVE; factory baseline score 100, regime STANDARD, open_critical_findings 0."
          setup_api_calls:
            - *k_clock
            - *k_std
            - *k_mfr_small
            - *k_fac
            - *k_proj
            - *k_cr
            - *k_samp1
            - *k_acc1
            - *k_res_safe
            - *k_res_temp
            - *k_decide_ok
            - *k_get_cert
            - call: "POST /certification/certifications/${cert_id}/mark-licenses"
              payload: { label_type: "STANDARD", declared_annual_volume: 10000 }
              as: ManufacturerRep
              as_user_id: "${mfr_id}"
              captures: { lic_id: $.data.id }
            - call: "POST /certification/factories/${fac_id}/inspections"
              payload: { scheduled_for: "2026-09-01T00:00:00Z" }
              as: FactoryInspector
              as_user_id: "insp-1"
              captures: { insp_id: $.data.id }
            - call: "POST /certification/inspections/${insp_id}/complete"
              payload: { findings: [{ finding_ref: "FD-7", certification_id: "${cert_id}", severity: "CRITICAL", description: "Line-built units omit listed fuse" }] }
              as: FactoryInspector
              as_user_id: "insp-1"
          trigger:
            - call: "POST /certification/inspections/${insp_id}/void"
              payload: { reason: "Inspection record created against the wrong production line" }
              as: ComplianceOfficer
            - call: "GET /certification/factories/${fac_id}"
              payload: {}
              as: ComplianceOfficer
            - call: "GET /certification/certifications/${cert_id}"
              payload: {}
              as: ComplianceOfficer
            - call: "GET /certification/mark-licenses/${lic_id}"
              payload: {}
              as: ComplianceOfficer
          assert:
            - "before void: factory score was 60 / PROBATION / open_critical_findings 1; certification SUSPENDED with cause CRITICAL_FINDING:FD-7; license SUSPENDED"
            - "after void: FollowUpInspection.${insp_id}.status == VOIDED"
            - "Factory.${fac_id}.conformity_score == 100 and open_critical_findings == 0 and conformity_regime == STANDARD (baseline restored)"
            - "Certification.${cert_id}.status == ACTIVE and suspension_causes == [] (finding-caused suspension unwound)"
            - "MarkLicense.${lic_id}.status == ACTIVE (cascade restoration)"
