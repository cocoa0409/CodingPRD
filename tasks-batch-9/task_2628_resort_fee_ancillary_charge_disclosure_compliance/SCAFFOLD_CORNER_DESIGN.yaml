              payload: {}
              as: ComplianceOfficer
              as_user_id: "u-comp-1"
              captures: { fp1_v: $.data.version }
            - call: "POST /channels"
              payload: { name: "GlobalGDS", channel_type: "GDS", supports_total_price_display: true, supports_itemization: true }
              as: PlatformAdmin
              as_user_id: "u-admin-1"
              captures: { c_gds: $.data.id }
            - call: "POST /channel-disclosure-profiles"
              payload: { property_id: "${p1}", channel_id: "${c_gds}", fee_program_id: "${fp1}", first_quote_shows_total: false, itemized_at_first_quote: false, disclosure_placement: "ABSENT", deployed_from: "2026-09-01T00:00:00Z", deployed_to: "2026-11-30T00:00:00Z", expected_fee_program_version: "${fp1_v}" }
              as: ChannelOperator
              as_user_id: "${c_gds}"
              captures: { prof_low: $.data.id }
            - call: "POST /channel-disclosure-profiles"
              payload: { property_id: "${p1}", channel_id: "${c_ota}", fee_program_id: "${fp1}", first_quote_shows_total: true, itemized_at_first_quote: true, disclosure_placement: "FIRST_QUOTE", deployed_from: "2026-09-01T00:00:00Z", deployed_to: "2026-11-30T00:00:00Z", expected_fee_program_version: "${fp1_v}" }
              as: ChannelOperator
