              captures: { not_released_error: $.data.error_id }
            - call: "POST /motor-designs/${d1_id}/review-decision"
              payload: { decision: "APPROVE" }
              as: DesignReviewer
              as_user_id: "u_rev_1"
              captures: { d1_v_rereleased: $.data.version }
            - call: "POST /work-orders"
