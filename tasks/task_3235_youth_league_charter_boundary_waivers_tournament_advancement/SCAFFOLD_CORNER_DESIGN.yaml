  # ===========================================================================
  - section: calculations
    instances:

      - name: renewal_window_classification_on_time_late_outside
        claim_type: Constants Applied
        grounds: [calculations.renewal_window_classification, errors.ERR_RENEWAL_WINDOW_CLOSED]
        distinguishing_aspect: "Window edges are closed: 2026-10-01 and 2026-12-31 classify ON_TIME for season 2027; 2027-01-01 and 2027-03-31 classify LATE; 2027-04-01 is outside and the submission is rejected ERR_RENEWAL_WINDOW_CLOSED."
        test_recipe:
          setup: ["Three leagues created; each submits a season-2027 renewal at a different clock position."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-01T00:00:00Z" }
              as: DistrictAdministrator
            - call: "POST /leagues"
              payload: { league_name: "Early Bird LL", region_code: "WEST", season_year: 2027 }
              as: DistrictAdministrator
              captures: { lg1: $.data.id }
            - call: "POST /leagues"
              payload: { league_name: "Late Bird LL", region_code: "WEST", season_year: 2027 }
              as: DistrictAdministrator
              captures: { lg2: $.data.id }
            - call: "POST /leagues"
              payload: { league_name: "Too Late LL", region_code: "WEST", season_year: 2027 }
              as: DistrictAdministrator
              captures: { lg3: $.data.id }
          trigger:
            - call: "POST /leagues/${lg1}/charter-renewals"
              payload: { season_year: 2027 }
              as: LeagueAdministrator
              captures: { c1: $.data.window_classification }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2027-03-31T00:00:00Z" }
              as: DistrictAdministrator
            - call: "POST /leagues/${lg2}/charter-renewals"
              payload: { season_year: 2027 }
              as: LeagueAdministrator
              captures: { c2: $.data.window_classification }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2027-04-01T00:00:00Z" }
              as: DistrictAdministrator
            - call: "POST /leagues/${lg3}/charter-renewals"
              payload: { season_year: 2027 }
              as: LeagueAdministrator
              captures: { err: $.data.error_id }
          assert:
            - "${c1} == ON_TIME at the first instant of the ON_TIME window"
            - "${c2} == LATE at the last instant of the LATE window"
            - "${err} == ERR_RENEWAL_WINDOW_CLOSED on 2027-04-01"

      - name: renewal_approve_requires_insurance_containment
        claim_type: Input Set Filtering
        grounds: [state_machines.CharterRenewal.SUBMITTED_to_APPROVED, errors.ERR_INSURANCE_NOT_ACTIVE]
        distinguishing_aspect: "The approval-time insurance check uses the season window [2027-03-01, 2027-10-31]: a certificate covering 2027-06-01..2027-12-31 misses the season start and approval fails ERR_INSURANCE_NOT_ACTIVE; adding a containing certificate unblocks it."
        test_recipe:
          setup: ["League PROVISIONAL with a too-short certificate; renewal SUBMITTED at clock 2026-10-15."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-15T00:00:00Z" }
              as: DistrictAdministrator
            - call: "POST /leagues"
              payload: { league_name: "Coverage LL", region_code: "WEST", season_year: 2027 }
              as: DistrictAdministrator
              captures: { lg: $.data.id }
            - call: "POST /leagues/${lg}/insurance-certificates"
              payload: { carrier_name: "Short Coverage", coverage_start: "2027-06-01", coverage_end: "2027-12-31" }
              as: DistrictAdministrator
            - call: "POST /leagues/${lg}/charter-renewals"
              payload: { season_year: 2027 }
              as: LeagueAdministrator
              captures: { ren: $.data.id }
          trigger:
            - call: "POST /leagues/${lg}/charter-renewals/${ren}/decide"
              payload: { action: "APPROVE", late_fee_paid: false }
              as: DistrictAdministrator
              captures: { err: $.data.error_id }
            - call: "POST /leagues/${lg}/insurance-certificates"
              payload: { carrier_name: "Full Coverage", coverage_start: "2027-01-01", coverage_end: "2027-12-31" }
              as: DistrictAdministrator
            - call: "POST /leagues/${lg}/charter-renewals/${ren}/decide"
              payload: { action: "APPROVE", late_fee_paid: false }
              as: DistrictAdministrator
              captures: { st: $.data.status }
          assert:
            - "${err} == ERR_INSURANCE_NOT_ACTIVE (certificate misses the season start 2027-03-01)"
            - "${st} == APPROVED after the containing certificate is added"
            - "League.${lg}.charter_status == CHARTERED"

      - name: late_fee_gate_on_late_renewal
        claim_type: Correct Result
        grounds: ["validations[priority=9]", errors.ERR_LATE_FEE_UNPAID]
        distinguishing_aspect: "A LATE renewal approved without late_fee_paid fails 402 ERR_LATE_FEE_UNPAID; retrying with late_fee_paid true succeeds and records late_fee_paid on the renewal."
        test_recipe:
          setup: ["League PROVISIONAL; insurance covering the season; renewal submitted at clock 2027-02-01 (LATE)."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-15T00:00:00Z" }
              as: DistrictAdministrator
            - call: "POST /leagues"
              payload: { league_name: "Late Payer LL", region_code: "WEST", season_year: 2027 }
              as: DistrictAdministrator
              captures: { lg: $.data.id }
            - call: "POST /leagues/${lg}/insurance-certificates"
              payload: { carrier_name: "LL-INS", coverage_start: "2027-01-01", coverage_end: "2027-12-31" }
              as: DistrictAdministrator
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2027-02-01T00:00:00Z" }
              as: DistrictAdministrator
            - call: "POST /leagues/${lg}/charter-renewals"
              payload: { season_year: 2027 }
              as: LeagueAdministrator
              captures: { ren: $.data.id }
          trigger:
            - call: "POST /leagues/${lg}/charter-renewals/${ren}/decide"
              payload: { action: "APPROVE", late_fee_paid: false }
              as: DistrictAdministrator
              captures: { err: $.data.error_id }
            - call: "POST /leagues/${lg}/charter-renewals/${ren}/decide"
              payload: { action: "APPROVE", late_fee_paid: true }
              as: DistrictAdministrator
              captures: { st: $.data.status, paid: $.data.late_fee_paid, fin: $.data.final_fee_cents }
          assert:
            - "${err} == ERR_LATE_FEE_UNPAID with http 402"
            - "${st} == APPROVED and ${paid} == true"
            - "${fin} == 58750 (base 50000 x 1.175, all team_counts 0)"

      - name: league_age_boundary_and_participation_excluded
        claim_type: Correct Result
        grounds: [calculations.league_age_determination, calculations.participation_percentage]
        excluded_because:
          difficulty_instance: boundary_precision_check / participation_exactly_60_passes_and_below_fails
          rationale: "Participation threshold and zero-denominator behavior are asserted there; league_age cutoff edges are asserted in player_computed_fields_league_age_and_division_assignment (entities section)."

  # ===========================================================================
  - section: validations
    instances:

      - name: missing_auth_headers_rejected_before_anything
        claim_type: violation_to_error
        grounds: ["validations[priority=1]", errors.ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER]
        distinguishing_aspect: "A request without X-User-ID / X-User-Role fails priority-1 with 400 even for a well-formed call against an existing resource."
        test_recipe:
          setup: ["One league exists."]
          setup_api_calls:
            - call: "POST /leagues"
              payload: { league_name: "Auth LL", region_code: "WEST", season_year: 2027 }
              as: DistrictAdministrator
              captures: { lg: $.data.id }
          trigger:
            - call: "GET /leagues/${lg}"
              payload: {}
              as: DistrictAdministrator
              captures: { err: $.data.error_id }
          assert:
            - "${err} == ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER with http 400 (no X-User-ID / X-User-Role headers sent)"

      - name: wrong_role_for_write_returns_forbidden
        claim_type: violation_to_error
        grounds: ["validations[priority=2]", errors.ERR_INSUFFICIENT_PERMISSIONS]
        distinguishing_aspect: "Priority-2 role check: TournamentDirector cannot create players (LeagueAdministrator-exclusive) — 403 ERR_INSUFFICIENT_PERMISSIONS; LeagueAdministrator cannot decide renewals (DistrictAdministrator-exclusive)."
        test_recipe:
          setup: ["League created; renewal submitted."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-15T00:00:00Z" }
              as: DistrictAdministrator
            - call: "POST /leagues"
              payload: { league_name: "Roles LL", region_code: "WEST", season_year: 2027 }
              as: DistrictAdministrator
              captures: { lg: $.data.id }
            - call: "POST /leagues/${lg}/charter-renewals"
              payload: { season_year: 2027 }
              as: LeagueAdministrator
              captures: { ren: $.data.id }
          trigger:
            - call: "POST /leagues/${lg}/players"
              payload: { first_name: "X", last_name: "Y", birth_date: "2015-03-10", residence_within_boundary: true, school_within_boundary: false, games_played: 3, games_scheduled: 5 }
              as: TournamentDirector
              captures: { err1: $.data.error_id }
