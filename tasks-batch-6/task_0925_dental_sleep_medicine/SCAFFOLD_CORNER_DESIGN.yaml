      - name: unattended_psg_is_non_diagnostic_regardless_of_artifact
        claim_type: Input Set Filtering
        grounds:
          - calculations.study_diagnostic_validity
          - state_machines.SleepStudy.ORDERED_to_NON_DIAGNOSTIC
        distinguishing_aspect: |
          The PSG gate ignores artifact_pct entirely and insists on attendance plus
          MIN_PSG_TST_MINUTES: an unattended PSG with a clean 240 minutes of sleep is NON_DIAGNOSTIC,
          while an attended PSG with artifact_pct 90 and the same sleep time is DIAGNOSTIC_VALID.
        test_recipe:
          setup:
            - "Two ORDERED PSG DIAGNOSTIC studies on one patient."
          setup_api_calls:
            - call: "POST /payers"
              payload: { name: "MedFirst", payer_kind: "MEDICAL", prior_auth_required: false }
