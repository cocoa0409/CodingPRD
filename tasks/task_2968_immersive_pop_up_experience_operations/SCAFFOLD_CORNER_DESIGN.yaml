      - name: slot_release_writes_the_capacity_ledger_it_declares
        claim_type: side_effect_execution
        grounds:
          - state_machines[TimedEntrySlot].transitions[DRAFT -> OPEN]
          - endpoints[POST /timed-entry-slots/{slotId}/release]
          - entities.TimedEntrySlot.fields.released_capacity
        distinguishing_aspect: |
          Release is the only call that turns base_capacity into a live ledger, and §1.5 names four
          writes plus a timestamp: released_capacity = base_capacity, available_capacity =
          base_capacity, released_at = current_utc and status = OPEN, with held_capacity, sold_capacity
          and wheelchair_sold untouched at 0. An implementation that flips only the status leaves the
          slot sellable-looking with available_capacity 0, which no later test would attribute to
          release.
