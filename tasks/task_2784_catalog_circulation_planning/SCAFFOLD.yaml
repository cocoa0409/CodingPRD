  # ---------- computed read --------------------------------------------------
  - method: GET
    path: /catalog-circulation/circulation-plans/{id}/profitability
    roles: [PlatformAdmin, CirculationPlanner, CirculationDirector, MarketingAnalyst]
    input: []
    output: CirculationPlan
    side_effects: []
    errors: [ERR_UNAUTHENTICATED, ERR_FORBIDDEN_ROLE, ERR_PLAN_NOT_FOUND]
    note: "Recomputes calculations.plan_profitability_rollup from the plan's currently ALLOCATED lines and returns the plan with planned_cost_cents, planned_demand_cents and planned_contribution_cents refreshed. A pure read: it does not change plan.status and does not increment plan.version."

  # ---------- writes: season & housefile -------------------------------------
  - method: POST
    path: /catalog-circulation/seasons
    roles: [PlatformAdmin]
    input: ["season_code", "fiscal_year", "print_cost_per_page_per_thousand_cents?", "paper_cost_per_lb_cents?", "paper_oz_per_page_milli?", "usable_sq_in_per_page?", "default_postage_estimate_cents_per_piece?", "cogs_rate_bps?", "prospect_base_response_bps?", "prospect_avg_order_value_cents?", "min_inhome_gap_days?", "fatigue_window_days?", "fatigue_suppression_threshold?"]
    output: CatalogSeason
    side_effects: ["creates the season rate card that every downstream cost, response and fatigue calculation reads"]
    errors: [ERR_UNAUTHENTICATED, ERR_FORBIDDEN_ROLE, ERR_INVALID_REQUEST, ERR_DUPLICATE_SEASON_CODE]

  - method: POST
    path: /catalog-circulation/housefile-segments
    roles: [CirculationPlanner]
    input: ["season_id", "segment_code", "recency_days", "orders_12mo", "ltv_cents", "housefile_count", "avg_order_value_cents", "historical_response_rate_bps", "parent_segment_id?", "contact_strategy?"]
    output: HousefileSegment
    side_effects:
      - "computes calculations.segment_rfm_score: rfm_score, segment_tier and the default contact_strategy"
      - "sets is_leaf = true; if parent_segment_id is supplied, the parent's is_leaf becomes false and the parent's rollup_housefile_count is recomputed as the sum of its descendants' housefile_count"
    errors: [ERR_UNAUTHENTICATED, ERR_FORBIDDEN_ROLE, ERR_SEASON_NOT_FOUND, ERR_SEGMENT_NOT_FOUND, ERR_INVALID_REQUEST, ERR_SEGMENT_CYCLE, ERR_DUPLICATE_SEGMENT_CODE]

  - method: PATCH
    path: /catalog-circulation/housefile-segments/{id}
    roles: [CirculationPlanner]
    input: ["recency_days?", "orders_12mo?", "ltv_cents?", "housefile_count?", "avg_order_value_cents?", "historical_response_rate_bps?", "parent_segment_id?", "contact_strategy?"]
    output: HousefileSegment
    side_effects:
      - "recomputes calculations.segment_rfm_score; an explicit contact_strategy in the payload overrides the tier default and is the only way to lift a fatigue-imposed SUPPRESS_ONLY"
      - "recomputes rollup_housefile_count and is_leaf for the old and new parent when parent_segment_id changes"
      - "increments HousefileSegment.version by 1"
    errors: [ERR_UNAUTHENTICATED, ERR_FORBIDDEN_ROLE, ERR_SEGMENT_NOT_FOUND, ERR_INVALID_REQUEST, ERR_SEGMENT_CYCLE]

  # ---------- writes: prospect list rentals ----------------------------------
  - method: POST
    path: /catalog-circulation/prospect-list-rentals
    roles: [ListBroker]
    input: ["season_id", "list_source_name", "requested_gross_names", "cost_per_thousand_cents", "housefile_overlap_bps", "inter_list_overlap_bps"]
    output: ProspectListRental
    side_effects: ["creates the rental in status REQUESTED with coop_model_score, expected_response_rate_bps, gross_names, net_names_delivered and unit_cost_cents_per_name all 0/null"]
    errors: [ERR_UNAUTHENTICATED, ERR_FORBIDDEN_ROLE, ERR_SEASON_NOT_FOUND, ERR_INVALID_REQUEST]

  - method: POST
    path: /catalog-circulation/prospect-list-rentals/{id}/model
    roles: [ListBroker]
    input: ["coop_model_score"]
    output: ProspectListRental
    side_effects:
      - "REQUESTED -> MODELED"
      - "stores coop_model_score and computes calculations.rental_expected_response_rate"
      - "increments ProspectListRental.version by 1"
    errors: [ERR_UNAUTHENTICATED, ERR_FORBIDDEN_ROLE, ERR_RENTAL_NOT_FOUND, ERR_INVALID_REQUEST, ERR_INVALID_RENTAL_STATE]

  - method: POST
    path: /catalog-circulation/prospect-list-rentals/{id}/order
    roles: [ListBroker]
    input: []
    output: ProspectListRental
    side_effects:
      - "MODELED -> ORDERED"
      - "sets unit_cost_cents_per_name = round_half_up(cost_per_thousand_cents / 1000)"
      - "increments ProspectListRental.version by 1"
    errors: [ERR_UNAUTHENTICATED, ERR_FORBIDDEN_ROLE, ERR_RENTAL_NOT_FOUND, ERR_INVALID_RENTAL_STATE]

  - method: POST
    path: /catalog-circulation/prospect-list-rentals/{id}/deliver
    roles: [ListBroker]
    input: ["delivered_gross_names"]
    output: ProspectListRental
    side_effects:
      - "ORDERED -> DELIVERED"
      - "sets gross_names = delivered_gross_names (the broker may ship more or fewer names than requested)"
      - "increments ProspectListRental.version by 1"
    errors: [ERR_UNAUTHENTICATED, ERR_FORBIDDEN_ROLE, ERR_RENTAL_NOT_FOUND, ERR_INVALID_REQUEST, ERR_INVALID_RENTAL_STATE]

  - method: POST
    path: /catalog-circulation/prospect-list-rentals/{id}/cancel
    roles: [ListBroker]
    input: ["reason?"]
    output: ProspectListRental
    side_effects:
      - "any non-CANCELLED status -> CANCELLED; gross_names and net_names_delivered set to 0"
      - "every COMPLETED MergePurgeRun that consumed this rental moves to STALE and recomputes its name aggregates without it"
      - "cascade depth 4: PROPOSED/ALLOCATED lines on this rental are VOIDED, their committed_cost_cents is credited back to the plan, each affected drop's quantities and cost per book are recomputed, and each owning plan's planned_* aggregates are recomputed with a COSTED plan falling back to DRAFT"
      - "increments ProspectListRental.version by 1"
    errors: [ERR_UNAUTHENTICATED, ERR_FORBIDDEN_ROLE, ERR_RENTAL_NOT_FOUND, ERR_INVALID_RENTAL_STATE]

  # ---------- writes: circulation plan lifecycle -----------------------------
  - method: POST
    path: /catalog-circulation/circulation-plans
    roles: [CirculationPlanner]
    input: ["season_id", "plan_code", "budget_cents"]
    output: CirculationPlan
    side_effects: ["creates the plan in status DRAFT with revision_round 0, committed_cost_cents 0 and uncommitted_budget_cents == budget_cents"]
    errors: [ERR_UNAUTHENTICATED, ERR_FORBIDDEN_ROLE, ERR_SEASON_NOT_FOUND, ERR_INVALID_REQUEST, ERR_DUPLICATE_PLAN_CODE]

  - method: POST
    path: /catalog-circulation/circulation-plans/{id}/merge-purge-runs
    roles: [ListBroker]
    input: ["expected_plan_version", "input_rental_ids"]
    output: MergePurgeRun
    side_effects:
      - "OCC: rejects the write unless expected_plan_version == plan.version (ERR_STALE_PLAN_VERSION, 412)"
      - "runs calculations.merge_purge_net_mailable_names and forks PENDING -> COMPLETED (net_mailable_names > 0) or PENDING -> FAILED (net_mailable_names == 0)"
      - "on the COMPLETED branch only: every input rental moves DELIVERED -> NETTED with net_names_delivered set, and every other COMPLETED run of the plan moves to SUPERSEDED"
      - "records observed_plan_version and increments CirculationPlan.version by 1"
    errors: [ERR_UNAUTHENTICATED, ERR_FORBIDDEN_ROLE, ERR_PLAN_NOT_FOUND, ERR_RENTAL_NOT_FOUND, ERR_INVALID_REQUEST, ERR_PLAN_NOT_EDITABLE, ERR_STALE_PLAN_VERSION, ERR_RENTAL_NOT_NETTED]
    note: "input_rental_ids may legitimately be an empty array: a housefile-only universe still needs a COMPLETED merge-purge run before circulation can be allocated or the plan costed. Every id in a non-empty array must resolve to a ProspectListRental of the same season in status DELIVERED (ERR_RENTAL_NOT_NETTED, 409, if any is still REQUESTED/MODELED/ORDERED or already CANCELLED)."

  - method: POST
    path: /catalog-circulation/circulation-plans/{id}/cost
    roles: [CirculationPlanner]
    input: []
    output: CirculationPlan
    side_effects:
      - "DRAFT -> COSTED"
      - "recomputes calculations.drop_cost_per_book (ESTIMATED_POSTAGE) for every PLANNED/PRESORTED drop, then line_profitability, then plan_profitability_rollup"
      - "records costed_by_user_id = X-User-ID"
      - "increments CirculationPlan.version by 1"
    errors: [ERR_UNAUTHENTICATED, ERR_FORBIDDEN_ROLE, ERR_PLAN_NOT_FOUND, ERR_INVALID_PLAN_STATE, ERR_MERGE_PURGE_REQUIRED]

  - method: POST
    path: /catalog-circulation/circulation-plans/{id}/submit-review
    roles: [CirculationPlanner]
    input: []
    output: CirculationPlan
    side_effects: ["COSTED -> UNDER_REVIEW", "records submitted_by_user_id = X-User-ID", "increments CirculationPlan.version by 1"]
    errors: [ERR_UNAUTHENTICATED, ERR_FORBIDDEN_ROLE, ERR_PLAN_NOT_FOUND, ERR_INVALID_PLAN_STATE]

  - method: POST
    path: /catalog-circulation/circulation-plans/{id}/request-revision
    roles: [CirculationDirector]
    input: ["note?"]
    output: CirculationPlan
    side_effects:
      - "UNDER_REVIEW -> DRAFT or APPROVED -> DRAFT (the two cyclic back-edges)"
      - "increments revision_round and clears costed_by_user_id / submitted_by_user_id (and approved_by_user_id on the APPROVED edge)"
      - "on the APPROVED edge: every PRESORTED drop reverts to PLANNED, its presort batches are deleted, postage fields reset and cost per book falls back to ESTIMATED_POSTAGE"
      - "increments CirculationPlan.version by 1"
    errors: [ERR_UNAUTHENTICATED, ERR_FORBIDDEN_ROLE, ERR_PLAN_NOT_FOUND, ERR_INVALID_PLAN_STATE]

  - method: POST
    path: /catalog-circulation/circulation-plans/{id}/approve
    roles: [CirculationDirector]
    input: []
    output: CirculationPlan
    side_effects: ["UNDER_REVIEW -> APPROVED", "records approved_by_user_id = X-User-ID", "increments CirculationPlan.version by 1"]
    errors: [ERR_UNAUTHENTICATED, ERR_FORBIDDEN_ROLE, ERR_PLAN_NOT_FOUND, ERR_INVALID_PLAN_STATE, ERR_SEGREGATION_OF_DUTIES, ERR_PLAN_CONTRIBUTION_NEGATIVE]

  - method: POST
    path: /catalog-circulation/circulation-plans/{id}/cancel
    roles: [CirculationDirector]
    input: ["reason?"]
    output: CirculationPlan
    side_effects:
      - "any non-terminal status -> CANCELLED"
      - "voids every PROPOSED/ALLOCATED line with a full budget credit, cancels every PLANNED/PRESORTED drop, supersedes every COMPLETED merge-purge run"
      - "increments CirculationPlan.version by 1"
    errors: [ERR_UNAUTHENTICATED, ERR_FORBIDDEN_ROLE, ERR_PLAN_NOT_FOUND, ERR_INVALID_PLAN_STATE]

  # ---------- writes: drops, lines, allocation --------------------------------
  - method: POST
    path: /catalog-circulation/circulation-plans/{id}/drops
    roles: [CirculationPlanner]
    input: ["drop_number", "in_home_date", "page_count"]
    output: Drop
    side_effects:
      - "creates the drop with production_status PLANNED and measurement_status PENDING"
      - "computes calculations.drop_piece_weight: weight_oz_milli and square_inch_capacity; unallocated_square_inches == square_inch_capacity and allocated_square_inches == 0"
    errors: [ERR_UNAUTHENTICATED, ERR_FORBIDDEN_ROLE, ERR_PLAN_NOT_FOUND, ERR_INVALID_REQUEST, ERR_PLAN_NOT_EDITABLE, ERR_INHOME_DATE_IN_PAST, ERR_DUPLICATE_DROP_NUMBER]

  - method: PATCH
    path: /catalog-circulation/drops/{id}
    roles: [CirculationPlanner]
    input: ["in_home_date?", "page_count?"]
    output: Drop
    side_effects:
      - "recomputes weight_oz_milli, square_inch_capacity and unallocated_square_inches when page_count changes, then re-runs calculations.drop_cost_per_book at the drop's current cost_basis"
      - "recomputes the owning plan's planned_* aggregates; a COSTED plan auto-transitions to DRAFT"
      - "increments Drop.version by 1"
    errors: [ERR_UNAUTHENTICATED, ERR_FORBIDDEN_ROLE, ERR_DROP_NOT_FOUND, ERR_INVALID_REQUEST, ERR_PLAN_NOT_EDITABLE, ERR_INVALID_DROP_STATE, ERR_INHOME_DATE_IN_PAST, ERR_DROP_SQ_IN_CAPACITY_EXCEEDED]

  - method: POST
    path: /catalog-circulation/drops/{id}/circulation-lines
    roles: [CirculationPlanner]
    input: ["audience_type", "requested_quantity", "housefile_segment_id?", "prospect_list_rental_id?", "is_holdout?", "holdout_pct_bps?"]
    output: CirculationLine
    side_effects:
      - "creates the line in status PROPOSED with allocation_rank null and every allocated/committed field 0"
      - "computes the PRE_MERGE_GROSS variant of calculations.line_demand_forecast: effective_response_bps and gross_forecast_demand_cents"
      - "recomputes drop.requested_quantity_total; a COSTED owning plan auto-transitions to DRAFT"
    errors: [ERR_UNAUTHENTICATED, ERR_FORBIDDEN_ROLE, ERR_DROP_NOT_FOUND, ERR_SEGMENT_NOT_FOUND, ERR_RENTAL_NOT_FOUND, ERR_INVALID_REQUEST, ERR_AUDIENCE_SPEC_INVALID, ERR_PLAN_NOT_EDITABLE, ERR_INVALID_DROP_STATE, ERR_SEGMENT_SUPPRESSED, ERR_INHOME_SPACING_VIOLATION, ERR_DUPLICATE_AUDIENCE_LINE]

  - method: POST
    path: /catalog-circulation/drops/{id}/allocate
    roles: [CirculationPlanner]
    input: []
    output: Drop
    side_effects:
      - "computes drop.provisional_cost_per_book_cents from requested_quantity_total (PROVISIONAL_REQUESTED), then runs calculations.drop_allocation_waterfall over every PROPOSED line of the drop in priority order"
      - "each funded line moves PROPOSED -> ALLOCATED with allocation_rank, allocated_quantity, holdout_quantity, mailable_quantity, unit_cost_cents and committed_cost_cents frozen at the provisional rate; a line clamped to 0 stays PROPOSED"
      - "debits plan.committed_cost_cents and recomputes plan.uncommitted_budget_cents"
      - "sets drop.planned_quantity, then re-runs calculations.drop_cost_per_book, line_demand_forecast (POST_MERGE_NET), line_profitability and plan_profitability_rollup"
      - "a COSTED owning plan auto-transitions to DRAFT"
      - "increments Drop.version by 1 and each affected CirculationLine.version by 1"
    errors: [ERR_UNAUTHENTICATED, ERR_FORBIDDEN_ROLE, ERR_DROP_NOT_FOUND, ERR_PLAN_NOT_EDITABLE, ERR_INVALID_DROP_STATE, ERR_SEGMENT_SUPPRESSED, ERR_RENTAL_NOT_NETTED, ERR_MERGE_PURGE_REQUIRED, ERR_PLAN_BUDGET_EXHAUSTED]

  - method: POST
    path: /catalog-circulation/circulation-lines/{id}/void
    roles: [CirculationPlanner]
    input: ["reason?"]
    output: CirculationLine
    side_effects:
      - "PROPOSED -> VOIDED or ALLOCATED -> VOIDED"
      - "credits plan.committed_cost_cents back by exactly the line's committed_cost_cents, then zeroes it (compensating invariant: budget_cents == committed_cost_cents + uncommitted_budget_cents)"
      - "zeroes the line's allocated/holdout/mailable quantities and every demand, margin, cost and contribution field"
      - "recomputes the drop's requested_quantity_total, planned_quantity and cost per book, then the plan's planned_* aggregates; a COSTED plan auto-transitions to DRAFT"
      - "increments CirculationLine.version by 1 and Drop.version by 1"
    errors: [ERR_UNAUTHENTICATED, ERR_FORBIDDEN_ROLE, ERR_LINE_NOT_FOUND, ERR_PLAN_NOT_EDITABLE, ERR_INVALID_LINE_STATE, ERR_INVALID_DROP_STATE]

  # ---------- writes: page space ---------------------------------------------
  - method: POST
    path: /catalog-circulation/drops/{id}/page-placements
    roles: [CirculationPlanner]
    input: ["product_sku", "product_name", "unit_price_cents", "unit_cogs_cents", "demand_per_sq_inch_cents", "page_number", "sq_in_offset", "square_inches", "placement_position"]
    output: PagePlacement
    side_effects:
      - "computes calculations.page_placement_space_productivity: position_multiplier_bps, forecast_space_demand_cents and space_productivity_cents_per_sq_in"
      - "adds square_inches to drop.allocated_square_inches and subtracts it from drop.unallocated_square_inches (invariant: square_inch_capacity == allocated_square_inches + unallocated_square_inches)"
      - "increments Drop.version by 1"
    errors: [ERR_UNAUTHENTICATED, ERR_FORBIDDEN_ROLE, ERR_DROP_NOT_FOUND, ERR_INVALID_REQUEST, ERR_PLAN_NOT_EDITABLE, ERR_INVALID_DROP_STATE, ERR_DUPLICATE_PLACEMENT_SKU, ERR_PAGE_SPACE_OVERLAP, ERR_PAGE_CAPACITY_EXCEEDED, ERR_DROP_SQ_IN_CAPACITY_EXCEEDED]

  - method: DELETE
    path: /catalog-circulation/page-placements/{id}
    roles: [CirculationPlanner]
    input: []
    output: Drop
    side_effects:
      - "removes the placement, returns its square_inches to drop.unallocated_square_inches and subtracts them from drop.allocated_square_inches with no drift"
      - "returns the parent Drop so the reconciled square-inch figures are directly observable"
      - "increments Drop.version by 1"
    errors: [ERR_UNAUTHENTICATED, ERR_FORBIDDEN_ROLE, ERR_PLACEMENT_NOT_FOUND, ERR_PLAN_NOT_EDITABLE, ERR_INVALID_DROP_STATE]

  # ---------- writes: postal presort & production ----------------------------
  - method: POST
    path: /catalog-circulation/drops/{id}/presort-batches
    roles: [CirculationPlanner]
    input: ["declared_tier", "piece_count"]
    output: PostalPresortBatch
    side_effects:
      - "applies the per-batch minimum-volume threshold: effective_tier falls back to MIXED_AADC when piece_count is below the declared tier's minimum"
      - "computes rate_cents_per_piece, weight_surcharge_cents_per_piece, batch_postage_cents and is_automation_qualified for the batch (an immutable row: no version, no update endpoint)"
    errors: [ERR_UNAUTHENTICATED, ERR_FORBIDDEN_ROLE, ERR_DROP_NOT_FOUND, ERR_INVALID_REQUEST, ERR_PLAN_NOT_EDITABLE, ERR_INVALID_DROP_STATE]

  - method: POST
    path: /catalog-circulation/drops/{id}/presort
    roles: [CirculationPlanner]
    input: []
    output: Drop
    side_effects:
      - "PLANNED -> PRESORTED (requires the owning plan to be APPROVED)"
      - "runs calculations.drop_postage_total: postage_total_cents, automation_share_bps and the all-or-nothing automation_qualified discount"
      - "re-runs calculations.drop_cost_per_book with variant PRESORTED_ACTUAL, then line_profitability and plan_profitability_rollup"
      - "increments Drop.version by 1"
    errors: [ERR_UNAUTHENTICATED, ERR_FORBIDDEN_ROLE, ERR_DROP_NOT_FOUND, ERR_INVALID_DROP_STATE, ERR_INVALID_PLAN_STATE, ERR_PRESORT_COVERAGE_MISMATCH]

  - method: POST
    path: /catalog-circulation/drops/{id}/mail
    roles: [CirculationPlanner]
    input: []
    output: Drop
    side_effects:
      - "PRESORTED -> MAILED and sets mailed_at"
      - "cascade depth 5: creates a MAIL ContactEvent for every allocated housefile audience, recomputes each segment's fatigue_score, flips over-threshold segments to SUPPRESS_ONLY, SUPPRESSES those segments' lines on still-PLANNED drops, and credits the freed budget back to the owning plans while recomputing every affected drop and plan aggregate"
      - "increments Drop.version by 1"
    errors: [ERR_UNAUTHENTICATED, ERR_FORBIDDEN_ROLE, ERR_DROP_NOT_FOUND, ERR_INVALID_DROP_STATE]

  - method: POST
    path: /catalog-circulation/drops/{id}/deliver
    roles: [CirculationPlanner]
    input: []
    output: Drop
    side_effects: ["MAILED -> DELIVERED; measurement_status is deliberately untouched", "increments Drop.version by 1"]
    errors: [ERR_UNAUTHENTICATED, ERR_FORBIDDEN_ROLE, ERR_DROP_NOT_FOUND, ERR_INVALID_DROP_STATE]

  # ---------- writes: measurement -------------------------------------------
  - method: POST
    path: /catalog-circulation/drops/{id}/matchback-runs
    roles: [MarketingAnalyst]
    input: ["expected_drop_version", "attribution_variant", "attribution_window_days?"]
    output: MatchbackRun
    side_effects:
      - "OCC: rejects the write unless expected_drop_version == drop.version (ERR_STALE_DROP_VERSION, 412)"
      - "requires drop.production_status in {MAILED, DELIVERED} and drop.measurement_status in {PENDING, MATCHBACK_OPEN}"
      - "supersedes every existing OPEN or FINALIZED run of the drop, then creates a new run in status OPEN"
      - "runs calculations.matchback_attribution for the chosen variant: matched_order_count, attributed_order_count, unmatched_order_count, attributed_demand_cents"
      - "moves drop.measurement_status PENDING -> MATCHBACK_OPEN (a self-loop when already MATCHBACK_OPEN) and increments Drop.version by 1"
    errors: [ERR_UNAUTHENTICATED, ERR_FORBIDDEN_ROLE, ERR_DROP_NOT_FOUND, ERR_INVALID_REQUEST, ERR_STALE_DROP_VERSION, ERR_INVALID_DROP_STATE, ERR_INVALID_MEASUREMENT_STATE]

  - method: POST
    path: /catalog-circulation/matchback-runs/{id}/finalize
    roles: [MarketingAnalyst]
    input: []
    output: MatchbackRun
    side_effects:
      - "OPEN -> FINALIZED and sets finalized_at"
      - "moves the drop's measurement_status MATCHBACK_OPEN -> MATCHBACK_CLOSED"
      - "increments MatchbackRun.version by 1 and Drop.version by 1"
    errors: [ERR_UNAUTHENTICATED, ERR_FORBIDDEN_ROLE, ERR_MATCHBACK_RUN_NOT_FOUND, ERR_INVALID_MATCHBACK_STATE, ERR_INVALID_MEASUREMENT_STATE]

  # ---------- writes: contact governance & tests -----------------------------
  - method: POST
    path: /catalog-circulation/seasons/{id}/suppression-rules
    roles: [PlatformAdmin]
    input: ["rule_code", "channel_scope", "window_days", "max_contacts_per_window", "priority", "is_enabled?"]
    output: SuppressionRule
    side_effects: ["creates a contact-frequency cap consulted in ascending priority whenever a ContactEvent is created"]
    errors: [ERR_UNAUTHENTICATED, ERR_FORBIDDEN_ROLE, ERR_SEASON_NOT_FOUND, ERR_INVALID_REQUEST, ERR_DUPLICATE_SUPPRESSION_RULE_CODE]

  - method: POST
    path: /catalog-circulation/contact-events
    roles: [MarketingAnalyst]
    input: ["housefile_segment_id", "channel", "contact_date", "drop_id?", "source?"]
    output: ContactEvent
    side_effects:
      - "creates an immutable contact row (no version, no update endpoint) with channel_weight, decay_factor_bps and weighted_points frozen at creation"
      - "re-runs calculations.contact_fatigue_score for the segment and flips contact_strategy to SUPPRESS_ONLY (setting suppressed_at) the moment the score reaches CatalogSeason.fatigue_suppression_threshold"
      - "increments HousefileSegment.version by 1"
    errors: [ERR_UNAUTHENTICATED, ERR_FORBIDDEN_ROLE, ERR_SEGMENT_NOT_FOUND, ERR_DROP_NOT_FOUND, ERR_INVALID_REQUEST, ERR_CONTACT_CAP_EXCEEDED]

  - method: POST
    path: /catalog-circulation/circulation-lines/{id}/test-cells
    roles: [MarketingAnalyst]
    input: ["cell_code", "test_type", "cell_role", "quantity"]
    output: TestCell
    side_effects: ["creates the cell in status PLANNED with significance UNMEASURED"]
    errors: [ERR_UNAUTHENTICATED, ERR_FORBIDDEN_ROLE, ERR_LINE_NOT_FOUND, ERR_INVALID_REQUEST, ERR_INVALID_LINE_STATE, ERR_DUPLICATE_TEST_CELL_CODE, ERR_DUPLICATE_CONTROL_CELL, ERR_TEST_CELL_QUANTITY_EXCEEDS_LINE]

  - method: POST
    path: /catalog-circulation/test-cells/{id}/measure
    roles: [MarketingAnalyst]
    input: ["responders", "demand_cents"]
    output: TestCell
    side_effects:
      - "PLANNED -> MEASURED"
      - "runs calculations.test_cell_lift: response_rate_bps, lift_bps and significance"
      - "when the measured cell is the CONTROL, re-scores every already-MEASURED sibling cell on the same CirculationLine"
      - "increments TestCell.version by 1"
    errors: [ERR_UNAUTHENTICATED, ERR_FORBIDDEN_ROLE, ERR_TEST_CELL_NOT_FOUND, ERR_INVALID_REQUEST, ERR_INVALID_TEST_CELL_STATE, ERR_INVALID_DROP_STATE]

  # ---------- test-driving endpoints (§1.5 priority ladder, last resort) -----
  - method: POST
    path: /catalog-circulation/_clock/set_current_utc
    roles: [PlatformAdmin]
    input: ["current_utc"]
    output: "{ current_utc: string }"
    side_effects: ["sets the logical clock that every in-home spacing check, fatigue decay window and matchback window reads"]
    errors: [ERR_UNAUTHENTICATED, ERR_FORBIDDEN_ROLE, ERR_INVALID_REQUEST]
    note: "Mandatory logical clock. Default value at process start is 2026-08-01T00:00:00Z. Required because contact fatigue decay bands, the in-home spacing buffer and the matchback attribution window are all measured against 'now' and cannot otherwise be driven deterministically."

  - method: POST
    path: /catalog-circulation/_online-orders/ingest
    roles: [PlatformAdmin]
    input: ["orders"]
    output: "{ ingested_count: integer, external_order_ids: string[] }"
    side_effects: ["stores the ecommerce order feed (external_order_id, housefile_segment_id, order_date, demand_cents) that calculations.matchback_attribution reads"]
    errors: [ERR_UNAUTHENTICATED, ERR_FORBIDDEN_ROLE, ERR_SEGMENT_NOT_FOUND, ERR_INVALID_REQUEST]
    note: "Last-resort test-driving endpoint: matchback attribution credits mail contacts for orders placed on the retailer's website, and there is no business endpoint in this domain that creates those orders (they originate in an external ecommerce system). Composing existing endpoints cannot produce them."

# -----------------------------------------------------------------------------
# §1.6 Error Catalog (every code is triggerable by at least one §1.8/§1.9 test)
# -----------------------------------------------------------------------------
errors:
  - error_id: ERR_UNAUTHENTICATED
    http_status: 401
    when: "X-User-ID header missing or empty"
  - error_id: ERR_FORBIDDEN_ROLE
    http_status: 403
    when: "the caller's role is not listed in the endpoint's roles"
  - error_id: ERR_INVALID_REQUEST
    http_status: 422
    when: "schema violation: missing required field, unknown enum value, out-of-range integer, negative money or quantity"

  - error_id: ERR_SEASON_NOT_FOUND
    http_status: 404
    when: "season_id in the path or body does not resolve"
  - error_id: ERR_SEGMENT_NOT_FOUND
    http_status: 404
    when: "segment_id, parent_segment_id or housefile_segment_id does not resolve"
  - error_id: ERR_RENTAL_NOT_FOUND
    http_status: 404
    when: "rental_id, prospect_list_rental_id or an element of input_rental_ids does not resolve"
  - error_id: ERR_PLAN_NOT_FOUND
    http_status: 404
    when: "plan_id does not resolve"
  - error_id: ERR_DROP_NOT_FOUND
    http_status: 404
    when: "drop_id does not resolve"
  - error_id: ERR_LINE_NOT_FOUND
    http_status: 404
    when: "line_id does not resolve"
  - error_id: ERR_PLACEMENT_NOT_FOUND
    http_status: 404
    when: "placement_id does not resolve"
  - error_id: ERR_TEST_CELL_NOT_FOUND
    http_status: 404
    when: "cell_id does not resolve"
  - error_id: ERR_MATCHBACK_RUN_NOT_FOUND
    http_status: 404
    when: "run_id does not resolve"

  - error_id: ERR_DUPLICATE_SEASON_CODE
    http_status: 409
    when: "season_code already exists"
  - error_id: ERR_DUPLICATE_SEGMENT_CODE
    http_status: 409
    when: "segment_code already exists within the season"
  - error_id: ERR_DUPLICATE_PLAN_CODE
    http_status: 409
    when: "plan_code already exists within the season"
  - error_id: ERR_DUPLICATE_DROP_NUMBER
    http_status: 409
    when: "drop_number already exists within the circulation plan"
  - error_id: ERR_DUPLICATE_PLACEMENT_SKU
    http_status: 409
    when: "product_sku already placed in this drop"
  - error_id: ERR_DUPLICATE_SUPPRESSION_RULE_CODE
    http_status: 409
    when: "rule_code already exists within the season"
  - error_id: ERR_DUPLICATE_TEST_CELL_CODE
    http_status: 409
    when: "cell_code already exists on this circulation line"
  - error_id: ERR_DUPLICATE_AUDIENCE_LINE
    http_status: 409
    when: "the drop already carries a PROPOSED or ALLOCATED line for the same audience"
  - error_id: ERR_DUPLICATE_CONTROL_CELL
    http_status: 409
    when: "the circulation line already carries a TestCell with cell_role CONTROL"

  - error_id: ERR_SEGMENT_CYCLE
    http_status: 422
    when: "parent_segment_id would make a HousefileSegment its own ancestor, or points at a segment in another season"
  - error_id: ERR_AUDIENCE_SPEC_INVALID
    http_status: 422
    when: "a CirculationLine supplies both audience FKs, neither, or an audience_type that disagrees with the FK supplied"

  - error_id: ERR_PLAN_NOT_EDITABLE
    http_status: 409
    when: "a structural mutation targets a plan whose status is not DRAFT or COSTED"
  - error_id: ERR_INVALID_PLAN_STATE
    http_status: 409
    when: "the requested CirculationPlan transition does not exist from its current status, or a guard on the plan's status fails (for example presorting a drop of a plan that is not APPROVED)"
  - error_id: ERR_INVALID_DROP_STATE
    http_status: 409
    when: "the requested Drop production_status transition does not exist from its current value, or a guard on the drop's production_status fails"
  - error_id: ERR_INVALID_MEASUREMENT_STATE
    http_status: 409
    when: "the requested Drop measurement_status transition does not exist from its current value (for example a new matchback run on a MATCHBACK_CLOSED drop)"
  - error_id: ERR_INVALID_RENTAL_STATE
    http_status: 409
    when: "the requested ProspectListRental transition does not exist from its current status"
  - error_id: ERR_INVALID_LINE_STATE
    http_status: 409
    when: "the requested CirculationLine transition does not exist from its current status, or a test cell is created on a line that is not ALLOCATED"
  - error_id: ERR_INVALID_TEST_CELL_STATE
    http_status: 409
    when: "measuring a TestCell that is already MEASURED"
  - error_id: ERR_INVALID_MATCHBACK_STATE
    http_status: 409
    when: "finalizing a MatchbackRun that is not OPEN"

  - error_id: ERR_STALE_PLAN_VERSION
    http_status: 412
    when: "expected_plan_version does not equal the CirculationPlan's current version (§1.2.1 merge-purge-create-stale-plan)"
  - error_id: ERR_STALE_DROP_VERSION
    http_status: 412
    when: "expected_drop_version does not equal the Drop's current version (§1.2.1 matchback-create-stale-drop)"

  - error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    when: "the approver equals the plan's costed_by_user_id or submitted_by_user_id"
  - error_id: ERR_SEGMENT_SUPPRESSED
    http_status: 422
    when: "circulation is requested for a HousefileSegment whose contact_strategy is SUPPRESS_ONLY"
  - error_id: ERR_CONTACT_CAP_EXCEEDED
    http_status: 422
    when: "a ContactEvent would breach the governing SuppressionRule's max_contacts_per_window for the segment on that channel"

  - error_id: ERR_RENTAL_NOT_NETTED
    http_status: 409
    when: "a rental line is allocated before its ProspectListRental reaches NETTED, or a merge-purge run is asked to consume a rental that is not DELIVERED"
  - error_id: ERR_MERGE_PURGE_REQUIRED
    http_status: 409
    when: "allocation or costing is attempted before the plan has a COMPLETED MergePurgeRun"

  - error_id: ERR_INHOME_DATE_IN_PAST
    http_status: 422
    when: "in_home_date is earlier than the logical clock's current date"
  - error_id: ERR_INHOME_SPACING_VIOLATION
    http_status: 409
    when: "the same HousefileSegment would be mailed by two drops whose in_home_date are closer than CatalogSeason.min_inhome_gap_days whole days"

  - error_id: ERR_PAGE_SPACE_OVERLAP
    http_status: 409
    when: "two live PagePlacement square-inch intervals overlap on the same page of the same drop"
  - error_id: ERR_PAGE_CAPACITY_EXCEEDED
    http_status: 422
    when: "a placement runs past the end of its page, or page_number is outside 1..drop.page_count"
  - error_id: ERR_DROP_SQ_IN_CAPACITY_EXCEEDED
    http_status: 422
    when: "the drop's allocated square inches would exceed square_inch_capacity, or a page_count reduction would strand already-allocated square inches"

  - error_id: ERR_TEST_CELL_QUANTITY_EXCEEDS_LINE
    http_status: 422
    when: "the sum of a line's TestCell quantities would exceed the line's allocated_quantity"
  - error_id: ERR_PRESORT_COVERAGE_MISMATCH
    http_status: 422
    when: "the sum of PostalPresortBatch.piece_count does not equal drop.planned_quantity at presort time"

  - error_id: ERR_PLAN_BUDGET_EXHAUSTED
    http_status: 422
    when: "the highest-priority PROPOSED line of the drop cannot afford a single book out of plan.uncommitted_budget_cents"
  - error_id: ERR_PLAN_CONTRIBUTION_NEGATIVE
    http_status: 422
    when: "approval is attempted while plan.planned_contribution_cents is negative"

# -----------------------------------------------------------------------------
# §1.7 Role Table (identity is an opaque X-User-ID string; no user entity)
# -----------------------------------------------------------------------------
roles:
  - role: PlatformAdmin
    identity: opaque
    exclusive_operations:
      - "POST /catalog-circulation/seasons"
      - "POST /catalog-circulation/seasons/{id}/suppression-rules"
      - "POST /catalog-circulation/_clock/set_current_utc"
      - "POST /catalog-circulation/_online-orders/ingest"
    shared_operations:
      - "every GET in §1.5"
    note: "Owns the season rate card, the contact-frequency governance rules, the logical clock and the ecommerce order feed. Deliberately cannot plan, cost, approve, buy lists or measure."

  - role: CirculationPlanner
    identity: opaque
    exclusive_operations:
      - "POST /catalog-circulation/housefile-segments"
      - "PATCH /catalog-circulation/housefile-segments/{id}"
      - "POST /catalog-circulation/circulation-plans"
      - "POST /catalog-circulation/circulation-plans/{id}/cost"
      - "POST /catalog-circulation/circulation-plans/{id}/submit-review"
      - "POST /catalog-circulation/circulation-plans/{id}/drops"
      - "PATCH /catalog-circulation/drops/{id}"
      - "POST /catalog-circulation/drops/{id}/circulation-lines"
      - "POST /catalog-circulation/drops/{id}/allocate"
      - "POST /catalog-circulation/circulation-lines/{id}/void"
      - "POST /catalog-circulation/drops/{id}/page-placements"
      - "DELETE /catalog-circulation/page-placements/{id}"
      - "POST /catalog-circulation/drops/{id}/presort-batches"
      - "POST /catalog-circulation/drops/{id}/presort"
      - "POST /catalog-circulation/drops/{id}/mail"
      - "POST /catalog-circulation/drops/{id}/deliver"
    shared_operations:
      - "every GET in §1.5"
    note: "Builds and executes the circulation plan. May cost it and submit it for review but may never approve it - and the approve guard additionally forbids the specific operators who costed or submitted it."

  - role: CirculationDirector
    identity: opaque
    exclusive_operations:
      - "POST /catalog-circulation/circulation-plans/{id}/approve"
      - "POST /catalog-circulation/circulation-plans/{id}/request-revision"
      - "POST /catalog-circulation/circulation-plans/{id}/cancel"
    shared_operations:
      - "every GET in §1.5"
    note: "Holds the budget authority: approve, send back for revision, or kill the plan. Cannot author any of the artefacts being judged."

  - role: ListBroker
    identity: opaque
    exclusive_operations:
      - "POST /catalog-circulation/prospect-list-rentals"
      - "POST /catalog-circulation/prospect-list-rentals/{id}/model"
      - "POST /catalog-circulation/prospect-list-rentals/{id}/order"
      - "POST /catalog-circulation/prospect-list-rentals/{id}/deliver"
      - "POST /catalog-circulation/prospect-list-rentals/{id}/cancel"
      - "POST /catalog-circulation/circulation-plans/{id}/merge-purge-runs"
    shared_operations:
      - "every GET in §1.5"
    note: "Owns outside-list procurement, cooperative-database modeling and the merge-purge universe build. Cannot allocate circulation against the names it delivers."

  - role: MarketingAnalyst
    identity: opaque
    exclusive_operations:
      - "POST /catalog-circulation/contact-events"
      - "POST /catalog-circulation/drops/{id}/matchback-runs"
      - "POST /catalog-circulation/matchback-runs/{id}/finalize"
      - "POST /catalog-circulation/circulation-lines/{id}/test-cells"
      - "POST /catalog-circulation/test-cells/{id}/measure"
    shared_operations:
      - "every GET in §1.5"
    note: "Owns measurement: non-mail contact logging, test design and readout, and matchback attribution. Cannot change what is circulated, only how it is measured."
