      - name: withdrawing_a_route_reconciles_the_segment_fill_fields
        claim_type: derived_field_reconciliation
        grounds: [calculations.pathway_fill_evaluation, state_machines.LinkPathwayRoute.OCCUPYING_to_WITHDRAWN]
        excluded_because:
          difficulty_instance: compensating_invariant / route_withdraw_returns_exactly_the_pathway_area_it_consumed
          rationale: "Create-then-reverse reconciliation of fill_area_used_sq_mm, fill_ratio and allowed_fill_pct is asserted by the named §1.8 instance."

      - name: releasing_an_assignment_reconciles_the_room_power_fields
        claim_type: derived_field_reconciliation
        grounds: [calculations.room_power_ledger, state_machines.RackUnitAssignment.ACTIVE_to_RELEASED]
        excluded_because:
          difficulty_instance: compensating_invariant / assignment_release_returns_exactly_the_room_volt_amperes_it_drew
          rationale: "Create-then-reverse reconciliation of power_load_va and power_headroom_va is asserted by the named §1.8 instance."

  - section: consistency_model
    instances:
      - name: a_write_response_already_carries_every_derived_field_it_moved
        claim_type: immediate
        grounds:
          - complexity_profile.consistency_model
          - calculations.pathway_fill_evaluation
          - endpoints[POST /cabling/link-routes]
        distinguishing_aspect: "The route creation response and an immediately following read of the segment agree exactly on consumed_area_sq_mm, fill_area_used_sq_mm, fill_ratio, allowed_fill_pct and version — no second request, delay or refresh is needed for the denormalised segment fields to settle."
        test_recipe:
          setup: ["Project RVT1 with a 573.00 sq mm EMT conduit PS-N at version 1 and one DESIGNED link on a 7.9 mm CAT6A cable"]
          setup_api_calls:
            - call: "POST /cabling/projects"
              payload: { name: "Riverside Tower Cabling", site_code: "RVT1", plenum_ceiling: true, identifier_scheme: "TIA_606_CLASS_1" }
              as: ProjectManager
              captures: { proj: $.data.id }
            - call: "POST /cabling/telecom-rooms"
              payload: { project_id: "${proj}", room_code: "TR01", floor: 3, branch_circuit_amps: 20, ups_capacity_va: 3000 }
              as: ProjectManager
              captures: { room: $.data.id }
            - call: "POST /cabling/cable-types"
              payload: { category: "CAT6A", jacket_rating: "CMP", outer_diameter_mm: 7.9, max_channel_length_m: 100.0, shielded: false, cost_per_meter_cents: 150, applications: ["DATA_HORIZONTAL"] }
              as: DesignEngineer
              captures: { ct: $.data.id }
            - call: "POST /cabling/pathway-segments"
              payload: { project_id: "${proj}", segment_code: "PS-N", pathway_type: "EMT_CONDUIT", usable_area_sq_mm: 573.0, length_m: 20.0, bend_count: 0, in_plenum_space: false }
              as: DesignEngineer
              captures: { seg_n: $.data.id, seg_n_v1: $.data.version }
            - call: "POST /cabling/links"
              payload: { project_id: "${proj}", telecom_room_id: "${room}", cable_type_id: "${ct}", identifier: "TR01-A01", application: "DATA_HORIZONTAL", horizontal_length_m: 18.00, consolidation_point_stub_m: 0, patch_cord_allowance_m: 2.00 }
              as: DesignEngineer
              captures: { link: $.data.id }
          trigger:
            - call: "POST /cabling/link-routes"
              payload: { link_id: "${link}", pathway_segment_id: "${seg_n}", sequence_index: 1, expected_segment_version: "${seg_n_v1}" }
              as: DesignEngineer
              captures: { route: $.data.id }
            - call: "GET /cabling/pathway-segments/${seg_n}"
              payload: {}
              as: DesignEngineer
            - call: "GET /cabling/links/${link}"
              payload: {}
              as: DesignEngineer
          assert:
            - "the route response returns 201 with consumed_area_sq_mm == 49.02 and route_state == \"OCCUPYING\" in that same response body"
            - "the immediately following segment read returns fill_area_used_sq_mm == 49.02, fill_ratio == 0.0855, allowed_fill_pct == 53, occupying_route_count == 1 and version == 2"
            - "the immediately following link read returns routed_segment_count == 1 with install_state still \"DESIGNED\""
            - "no repeated read is required: the first read after the write already shows the final values"
