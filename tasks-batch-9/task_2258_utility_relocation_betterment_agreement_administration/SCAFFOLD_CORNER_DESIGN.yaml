      - name: a_stale_conflict_version_stops_a_plan_submittal_that_would_have_superseded_an_unseen_revision
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[plan-create-stale-conflict]", "errors[ERR_STALE_VERSION]", "endpoints.POST_/uro/relocation-plans", "state_machines.RelocationPlan"]
        distinguishing_aspect: "The OCC field guards a destructive side effect rather than an update: creating a plan supersedes every earlier plan for the conflict, so a submittal carrying a conflict version observed before the previous plan existed is refused with ERR_STALE_VERSION 412. The same body with the refreshed version succeeds and only then does the earlier plan move to SUPERSEDED - and the version that matters is the CONFLICT's, which the plan create itself bumps."
        test_recipe:
          setup: ["A conflict with an ISSUED determination, whose version is read once and then invalidated by a first plan submittal."]
          setup_api_calls:
            - { call: "POST /uro/projects", payload: { name: "SR-14 Widening Section 3", route_designation: "SR-14", letting_date: "2027-01-15T00:00:00Z", construction_start_date: "2027-03-01T00:00:00Z", construction_end_date: "2028-06-30T00:00:00Z", row_acquisition_year: 1975, reimbursement_authority_cents: 100000000, contract_daily_overhead_cents: 250000 }, as: ProgramAdmin, captures: { p1: "$.data.id" } }
