        as: BookingAgent
        as_user_id: ${ag_b}
        captures:
          err: $.data.error_id
      assert:
      - err == ERR_INVALID_REQUEST (missing estimated_weight_lbs and expected_order_version)
      - GET /estimates?order_id=${ord} returns total_count == 0
  - name: self_referential_estimate_revision_chain
    claim_type: parent_relationships
    grounds:
    - entities.Estimate.fields.supersedes_estimate_id
    - entities.Estimate.fields.revision_number
    distinguishing_aspect: 'A second estimate supersedes the first: revision_number
      increments to 2 and supersedes_estimate_id points at the prior estimate (self-referential
      FK), queryable via the supersedes filter.'
    test_recipe:
      setup:
      - order REGISTERED with one ISSUED estimate
      setup_api_calls:
