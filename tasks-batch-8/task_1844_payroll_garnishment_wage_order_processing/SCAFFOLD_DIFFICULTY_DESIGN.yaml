              as: payroll_specialist
              captures: { ord_d: $.data.id }
            - call: "POST /orders/${ord_c}/validate"
              payload: {}
              as: payroll_specialist
            - call: "POST /orders/${ord_c}/notify"
              payload: {}
              as: payroll_specialist
            - call: "POST /orders/${ord_c}/activate"
              payload: {}
              as: payroll_specialist
            - call: "POST /orders/${ord_d}/validate"
              payload: {}
              as: payroll_specialist
            - call: "POST /orders/${ord_d}/notify"
              payload: {}
              as: payroll_specialist
            - call: "POST /orders/${ord_d}/activate"
              payload: {}
              as: payroll_specialist
            - call: "GET /employers/${emp_id}"
