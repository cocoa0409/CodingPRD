              payload: { full_name: "Pat Rowe", level: "PARTNER", service_center: "DOMESTIC", industry_specialization: "MANUFACTURING", cpa_licensed: true, base_weekly_cap_hours: 45.00, hourly_bill_rate: 400.00 }
              as: FirmAdmin
              captures: { p1_id: $.data.id }
            - call: "POST /scheduling/staff-members"
              payload: { full_name: "Sam Oyelaran", level: "SENIOR", service_center: "DOMESTIC", industry_specialization: "MANUFACTURING", cpa_licensed: true, base_weekly_cap_hours: 40.00, hourly_bill_rate: 180.00 }
              as: FirmAdmin
              captures: { s1_id: $.data.id }
            - call: "POST /scheduling/engagements"
              payload: { client_id: "${c_id}", engagement_partner_staff_id: "${p1_id}", service_line: "AUDIT", busy_season_year: 2026, deadline_date: "2026-10-15", budget_fee_amount: 6000.00 }
              as: SchedulingManager
              captures: { e1_id: $.data.id }
            - call: "POST /scheduling/engagement-phases"
              payload: { engagement_id: "${e1_id}", phase_type: "FIELDWORK", expected_hours: 21.00, window_start_date: "2026-08-03", window_end_date: "2026-08-31", required_level: "SENIOR", required_industry_specialization: "MANUFACTURING", requires_cpa_licensed: true }
              as: SchedulingManager
              captures: { ph1_id: $.data.id }
            - call: "POST /scheduling/assignments"
              payload: { engagement_phase_id: "${ph1_id}", staff_member_id: "${s1_id}", start_date: "2026-08-24", end_date: "2026-08-31", allocated_hours: 21.00 }
              as: SchedulingManager
              captures: { a1_id: $.data.id }
            - call: "POST /scheduling/engagements/${e1_id}/schedule"
              payload: {}
              as: SchedulingManager
              captures: { e_ver: $.data.version }
            - call: "POST /scheduling/reschedule-plans"
              payload: { engagement_id: "${e1_id}", trigger_reason: "CLIENT_READINESS_SLIP", shift_days: 7 }
              as: SchedulingManager
              captures: { pl1_id: $.data.id }
            - call: "POST /scheduling/reschedule-plans/${pl1_id}/simulate"
              payload: {}
              as: SchedulingManager
              captures: { sim_ver: $.data.simulated_at_engagement_version }
          trigger:
