# =============================================================================
# Task 1816 — §1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# Breadth coverage of every §1.1–§1.7 claim not already exercised by §1.8.
# Names are unique across both design files. All chains replay from empty-DB.
# =============================================================================
scaffold_corner_design:
  # ===========================================================================
  - section: entities
    instances:
      - name: showtime_create_computes_daypart_forecast_and_reel
        claim_type: creation
        grounds: ["entities.Showtime", "entities.PreShowReel", "calculations.forecast_attendance"]
        distinguishing_aspect: "Showtime creation (201) returns server-computed daypart/forecast_attendance, and its PreShowReel side effect is observable via the reverse-reachability GET with ASSEMBLING status, version 1, and pools 720/480."
        test_recipe:
          setup: ["MAJOR_METRO theater with 200-seat screen; PG13 feature released 2026-08-10"]
          setup_api_calls:
            - { call: "POST /network/theaters", payload: { name: "MetroPlex", market_tier: MAJOR_METRO }, as: NetworkOps, captures: { t_id: "$.data.id" } }
            - { call: "POST /network/theaters/${t_id}/screens", payload: { auditorium_label: "Aud 1", seat_count: 200 }, as: NetworkOps, captures: { s_id: "$.data.id" } }
            - { call: "POST /network/features", payload: { title: "Skyline", content_rating: PG13, runtime_minutes: 120, release_date: "2026-08-10" }, as: NetworkOps, captures: { f_id: "$.data.id" } }
          trigger:
            - { call: "POST /network/screens/${s_id}/showtimes", payload: { feature_id: "${f_id}", starts_at: "2026-08-14T19:00:00Z" }, as: NetworkOps, captures: { st_id: "$.data.id" } }
            - { call: "GET /network/showtimes/${st_id}/reel", payload: {}, as: NetworkOps, captures: { r0_status: "$.data[0].reel_status", r0_version: "$.data[0].version" } }
          assert:
            - "Showtime.${st_id}.daypart == EVENING and forecast_attendance == 132 (computed, not client-supplied)"
            - "auto-created reel: reel_status == ASSEMBLING, version == 1, capacity_seconds == 1200, national_pool_seconds == 720, local_pool_seconds == 480"

      - name: campaign_create_applies_strict_default
        claim_type: defaults
        grounds: ["entities.Campaign.fields.partial_credit_mode"]
        distinguishing_aspect: "Omitting partial_credit_mode yields the STRICT default; reserved_estimated_cents and delivered_impressions initialize to 0 and campaign_status to DRAFT."
        test_recipe:
          setup: ["ACTIVE advertiser exists"]
          setup_api_calls:
            - { call: "POST /network/advertisers", payload: { name: "AutoCo", advertiser_type: NATIONAL, category: AUTOMOTIVE }, as: SalesManager, captures: { a_id: "$.data.id" } }
          trigger:
            - { call: "POST /network/campaigns", payload: { advertiser_id: "${a_id}", name: "C1", flight_start_date: "2026-08-10", flight_end_date: "2026-08-20", contracted_impressions: 10000, cpm_cents: 2500, budget_cents: 500000 }, as: SalesManager, as_user_id: "sm-1", captures: { c_id: "$.data.id" } }
          assert:
            - "Campaign.${c_id}.partial_credit_mode == STRICT (default applied)"
            - "campaign_status == DRAFT; reserved_estimated_cents == 0; delivered_impressions == 0; version == 1"

      - name: playlog_record_is_immutable_without_version
        claim_type: immutability
        grounds: ["entities.PlayLog"]
        distinguishing_aspect: "PlayLog declares common_fields: false — its creation response carries id and created_at but no version/updated_at, and §1.5 declares no update or delete endpoint for it."
        test_recipe:
          setup: ["aired chain to a CONFIRMED slot on a DELIVERED reel, clock advanced past the showtime"]
          setup_api_calls:
            - { call: "POST /network/theaters", payload: { name: "MetroPlex", market_tier: MAJOR_METRO }, as: NetworkOps, captures: { t_id: "$.data.id" } }
            - { call: "POST /network/theaters/${t_id}/screens", payload: { auditorium_label: "Aud 1", seat_count: 200 }, as: NetworkOps, captures: { s_id: "$.data.id" } }
            - { call: "POST /network/features", payload: { title: "Skyline", content_rating: PG13, runtime_minutes: 120, release_date: "2026-08-10" }, as: NetworkOps, captures: { f_id: "$.data.id" } }
            - { call: "POST /network/screens/${s_id}/showtimes", payload: { feature_id: "${f_id}", starts_at: "2026-08-14T19:00:00Z" }, as: NetworkOps, captures: { st_id: "$.data.id" } }
            - { call: "GET /network/showtimes/${st_id}/reel", payload: {}, as: NetworkOps, captures: { r_id: "$.data[0].id", rv: "$.data[0].version" } }
            - { call: "POST /network/advertisers", payload: { name: "AutoCo", advertiser_type: NATIONAL, category: AUTOMOTIVE }, as: SalesManager, captures: { a_id: "$.data.id" } }
            - { call: "POST /network/campaigns", payload: { advertiser_id: "${a_id}", name: "C1", flight_start_date: "2026-08-10", flight_end_date: "2026-08-20", contracted_impressions: 10000, cpm_cents: 2500, budget_cents: 500000 }, as: SalesManager, as_user_id: "sm-1", captures: { c_id: "$.data.id" } }
            - { call: "POST /network/campaigns/${c_id}/submit", payload: {}, as: SalesManager, as_user_id: "sm-1" }
            - { call: "POST /network/campaigns/${c_id}/approve", payload: {}, as: SalesManager, as_user_id: "sm-2" }
            - { call: "POST /network/reels/${r_id}/slots", payload: { campaign_id: "${c_id}", start_offset_seconds: 0, duration_seconds: 60, expected_reel_version: "${rv}" }, as: SalesManager, captures: { sl: "$.data.id" } }
            - { call: "GET /network/reels/${r_id}", payload: {}, as: NetworkOps, captures: { rv2: "$.data.version" } }
            - { call: "POST /network/reels/${r_id}/lock", payload: { expected_reel_version: "${rv2}" }, as: NetworkOps }
            - { call: "POST /network/_clock/set_current_utc", payload: { to_iso8601: "2026-08-14T21:30:00Z" }, as: NetworkOps }
          trigger:
            - { call: "POST /network/slots/${sl}/playlogs", payload: { outcome: VERIFIED }, as: TheaterOps, as_user_id: "${t_id}", captures: { pl_id: "$.data.id" } }
          assert:
            - "PlayLog.${pl_id} response contains id, created_at, slot_id, outcome, played_at, reported_by_user_id, reported_by_theater_id"
            - "response contains no version field and no updated_at field"
            - "played_at == 2026-08-14T21:30:00Z (the logical clock value at record time)"

      - name: campaign_get_unknown_id_not_found
        claim_type: not_found
        grounds: ["validations[priority=5]", "errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "GET with a well-formed but nonexistent UUID returns 404 ERR_NOT_FOUND."
        test_recipe:
          setup: ["empty DB suffices"]
          setup_api_calls: []
          trigger:
            - { call: "GET /network/campaigns/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2", payload: {}, as: SalesManager, captures: { err: "$.data.error_id" } }
          assert:
            - "http status 404 and error_id == ERR_NOT_FOUND"

      - name: theater_create_missing_required_field_returns_invalid_request
        claim_type: required_fields
        grounds: ["validations[priority=4]", "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "POST /network/theaters without market_tier (a source: input field with no default) returns 400 ERR_INVALID_REQUEST."
        test_recipe:
          setup: ["empty DB suffices"]
          setup_api_calls: []
          trigger:
            - { call: "POST /network/theaters", payload: { name: "NoTier" }, as: NetworkOps, captures: { err: "$.data.error_id" } }
          assert:
            - "http status 400 and error_id == ERR_INVALID_REQUEST"

      - name: feature_create_invalid_enum_returns_invalid_request
        claim_type: type_constraints
        grounds: ["validations[priority=4]", "entities.Feature.fields.content_rating"]
        distinguishing_aspect: "content_rating 'PG-13' is not in the declared enum {G, PG, PG13, R, NC17} and is rejected with ERR_INVALID_REQUEST."
        test_recipe:
          setup: ["empty DB suffices"]
          setup_api_calls: []
          trigger:
            - { call: "POST /network/features", payload: { title: "Bad", content_rating: "PG-13", runtime_minutes: 100, release_date: "2026-08-01" }, as: NetworkOps, captures: { err: "$.data.error_id" } }
          assert:
            - "http status 400 and error_id == ERR_INVALID_REQUEST"

      - name: campaign_create_with_unknown_advertiser_not_found
        claim_type: parent_relationships
        grounds: ["entities.Campaign.fields.advertiser_id", "validations[priority=5]"]
        distinguishing_aspect: "Flat-topology FK integrity: the body FK advertiser_id referencing a nonexistent Advertiser is rejected with 404 ERR_NOT_FOUND."
        test_recipe:
          setup: ["empty DB suffices"]
          setup_api_calls: []
          trigger:
            - { call: "POST /network/campaigns", payload: { advertiser_id: "8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2", name: "C1", flight_start_date: "2026-08-10", flight_end_date: "2026-08-20", contracted_impressions: 10000, cpm_cents: 2500, budget_cents: 500000 }, as: SalesManager, captures: { err: "$.data.error_id" } }
          assert:
            - "http status 404 and error_id == ERR_NOT_FOUND"

  # ===========================================================================
  - section: state_machines
    instances:
      - name: campaign_submit_from_canceled_rejected
        claim_type: terminal_state_lockdown
        grounds: ["state_machines.Campaign", "errors[ERR_INVALID_STATE_TRANSITION]"]
        distinguishing_aspect: "CANCELED is terminal: a submit trigger against it fails with ERR_INVALID_STATE_TRANSITION and no status change occurs."
        test_recipe:
          setup: ["campaign created and canceled before any submission"]
          setup_api_calls:
            - { call: "POST /network/advertisers", payload: { name: "AutoCo", advertiser_type: NATIONAL, category: AUTOMOTIVE }, as: SalesManager, captures: { a_id: "$.data.id" } }
            - { call: "POST /network/campaigns", payload: { advertiser_id: "${a_id}", name: "C1", flight_start_date: "2026-08-10", flight_end_date: "2026-08-20", contracted_impressions: 10000, cpm_cents: 2500, budget_cents: 500000 }, as: SalesManager, as_user_id: "sm-1", captures: { c_id: "$.data.id" } }
            - { call: "POST /network/campaigns/${c_id}/cancel", payload: {}, as: SalesManager }
          trigger:
            - { call: "POST /network/campaigns/${c_id}/submit", payload: {}, as: SalesManager, captures: { err: "$.data.error_id" } }
          assert:
            - "error_id == ERR_INVALID_STATE_TRANSITION (409); Campaign.${c_id}.campaign_status remains CANCELED"

      - name: reel_delivery_failure_retry_cycle
        claim_type: valid_transition
        grounds: ["state_machines.PreShowReel"]
        distinguishing_aspect: "Cyclic redelivery: IN_TRANSIT --FAILED--> DELIVERY_FAILED --dispatch--> IN_TRANSIT --DELIVERED--> DELIVERED traverses the retry loop and exits forward."
        test_recipe:
          setup: ["reel LOCKED with one CONFIRMED slot; clock before showtime start"]
          setup_api_calls:
            - { call: "POST /network/theaters", payload: { name: "MetroPlex", market_tier: MAJOR_METRO }, as: NetworkOps, captures: { t_id: "$.data.id" } }
            - { call: "POST /network/theaters/${t_id}/screens", payload: { auditorium_label: "Aud 1", seat_count: 200 }, as: NetworkOps, captures: { s_id: "$.data.id" } }
            - { call: "POST /network/features", payload: { title: "Skyline", content_rating: PG13, runtime_minutes: 120, release_date: "2026-08-10" }, as: NetworkOps, captures: { f_id: "$.data.id" } }
            - { call: "POST /network/screens/${s_id}/showtimes", payload: { feature_id: "${f_id}", starts_at: "2026-08-14T19:00:00Z" }, as: NetworkOps, captures: { st_id: "$.data.id" } }
            - { call: "GET /network/showtimes/${st_id}/reel", payload: {}, as: NetworkOps, captures: { r_id: "$.data[0].id", rv: "$.data[0].version" } }
            - { call: "POST /network/advertisers", payload: { name: "AutoCo", advertiser_type: NATIONAL, category: AUTOMOTIVE }, as: SalesManager, captures: { a_id: "$.data.id" } }
            - { call: "POST /network/campaigns", payload: { advertiser_id: "${a_id}", name: "C1", flight_start_date: "2026-08-10", flight_end_date: "2026-08-20", contracted_impressions: 10000, cpm_cents: 2500, budget_cents: 500000 }, as: SalesManager, as_user_id: "sm-1", captures: { c_id: "$.data.id" } }
            - { call: "POST /network/campaigns/${c_id}/submit", payload: {}, as: SalesManager, as_user_id: "sm-1" }
            - { call: "POST /network/campaigns/${c_id}/approve", payload: {}, as: SalesManager, as_user_id: "sm-2" }
            - { call: "POST /network/reels/${r_id}/slots", payload: { campaign_id: "${c_id}", start_offset_seconds: 0, duration_seconds: 60, expected_reel_version: "${rv}" }, as: SalesManager }
            - { call: "GET /network/reels/${r_id}", payload: {}, as: NetworkOps, captures: { rv2: "$.data.version" } }
            - { call: "POST /network/reels/${r_id}/lock", payload: { expected_reel_version: "${rv2}" }, as: NetworkOps }
            - { call: "POST /network/reels/${r_id}/dispatch", payload: {}, as: NetworkOps }
          trigger:
            - { call: "POST /network/reels/${r_id}/acknowledge-delivery", payload: { outcome: FAILED }, as: TheaterOps, as_user_id: "${t_id}", captures: { st_failed: "$.data.reel_status" } }
            - { call: "POST /network/reels/${r_id}/dispatch", payload: {}, as: NetworkOps, captures: { st_retry: "$.data.reel_status" } }
            - { call: "POST /network/reels/${r_id}/acknowledge-delivery", payload: { outcome: DELIVERED }, as: TheaterOps, as_user_id: "${t_id}", captures: { st_ok: "$.data.reel_status" } }
          assert:
            - "first ack(FAILED): reel_status == DELIVERY_FAILED"
            - "redispatch from DELIVERY_FAILED: reel_status == IN_TRANSIT (retry loop)"
            - "second ack(DELIVERED): reel_status == DELIVERED"

      - name: reel_lock_empty_reel_rejected
        claim_type: precondition_enforcement
        grounds: ["state_machines.PreShowReel.ASSEMBLING_to_LOCKED", "errors[ERR_REEL_NOT_LOCKABLE]"]
        distinguishing_aspect: "Lock requires at least one RESERVED slot; an empty ASSEMBLING reel fails with ERR_REEL_NOT_LOCKABLE even with a correct OCC version."
        test_recipe:
          setup: ["showtime with auto-created empty reel (version 1)"]
          setup_api_calls:
            - { call: "POST /network/theaters", payload: { name: "MetroPlex", market_tier: MAJOR_METRO }, as: NetworkOps, captures: { t_id: "$.data.id" } }
            - { call: "POST /network/theaters/${t_id}/screens", payload: { auditorium_label: "Aud 1", seat_count: 200 }, as: NetworkOps, captures: { s_id: "$.data.id" } }
            - { call: "POST /network/features", payload: { title: "Skyline", content_rating: PG13, runtime_minutes: 120, release_date: "2026-08-10" }, as: NetworkOps, captures: { f_id: "$.data.id" } }
            - { call: "POST /network/screens/${s_id}/showtimes", payload: { feature_id: "${f_id}", starts_at: "2026-08-14T19:00:00Z" }, as: NetworkOps, captures: { st_id: "$.data.id" } }
            - { call: "GET /network/showtimes/${st_id}/reel", payload: {}, as: NetworkOps, captures: { r_id: "$.data[0].id", rv: "$.data[0].version" } }
          trigger:
            - { call: "POST /network/reels/${r_id}/lock", payload: { expected_reel_version: "${rv}" }, as: NetworkOps, captures: { err: "$.data.error_id" } }
          assert:
            - "error_id == ERR_REEL_NOT_LOCKABLE; reel stays ASSEMBLING and version stays ${rv}"

      - name: slot_cancel_after_lock_rejected
        claim_type: invalid_transition
        grounds: ["state_machines.ReelSlot.RESERVED_to_CANCELED", "errors[ERR_REEL_NOT_ASSEMBLING]"]
        distinguishing_aspect: "Cancel is legal only while the reel is ASSEMBLING; once locked, the RESERVED->CANCELED path is closed and the slot is CONFIRMED forever."
        test_recipe:
          setup: ["reel LOCKED with one slot CONFIRMED"]
          setup_api_calls:
            - { call: "POST /network/theaters", payload: { name: "MetroPlex", market_tier: MAJOR_METRO }, as: NetworkOps, captures: { t_id: "$.data.id" } }
            - { call: "POST /network/theaters/${t_id}/screens", payload: { auditorium_label: "Aud 1", seat_count: 200 }, as: NetworkOps, captures: { s_id: "$.data.id" } }
            - { call: "POST /network/features", payload: { title: "Skyline", content_rating: PG13, runtime_minutes: 120, release_date: "2026-08-10" }, as: NetworkOps, captures: { f_id: "$.data.id" } }
            - { call: "POST /network/screens/${s_id}/showtimes", payload: { feature_id: "${f_id}", starts_at: "2026-08-14T19:00:00Z" }, as: NetworkOps, captures: { st_id: "$.data.id" } }
            - { call: "GET /network/showtimes/${st_id}/reel", payload: {}, as: NetworkOps, captures: { r_id: "$.data[0].id", rv: "$.data[0].version" } }
            - { call: "POST /network/advertisers", payload: { name: "AutoCo", advertiser_type: NATIONAL, category: AUTOMOTIVE }, as: SalesManager, captures: { a_id: "$.data.id" } }
            - { call: "POST /network/campaigns", payload: { advertiser_id: "${a_id}", name: "C1", flight_start_date: "2026-08-10", flight_end_date: "2026-08-20", contracted_impressions: 10000, cpm_cents: 2500, budget_cents: 500000 }, as: SalesManager, as_user_id: "sm-1", captures: { c_id: "$.data.id" } }
            - { call: "POST /network/campaigns/${c_id}/submit", payload: {}, as: SalesManager, as_user_id: "sm-1" }
            - { call: "POST /network/campaigns/${c_id}/approve", payload: {}, as: SalesManager, as_user_id: "sm-2" }
            - { call: "POST /network/reels/${r_id}/slots", payload: { campaign_id: "${c_id}", start_offset_seconds: 0, duration_seconds: 60, expected_reel_version: "${rv}" }, as: SalesManager, captures: { sl: "$.data.id" } }
            - { call: "GET /network/reels/${r_id}", payload: {}, as: NetworkOps, captures: { rv2: "$.data.version" } }
            - { call: "POST /network/reels/${r_id}/lock", payload: { expected_reel_version: "${rv2}" }, as: NetworkOps }
          trigger:
            - { call: "POST /network/slots/${sl}/cancel", payload: {}, as: SalesManager, captures: { err: "$.data.error_id" } }
          assert:
            - "error_id == ERR_REEL_NOT_ASSEMBLING; ReelSlot.${sl}.slot_status remains CONFIRMED"

      - name: playlog_on_reserved_slot_rejected
        claim_type: precondition_enforcement
        grounds: ["state_machines.ReelSlot", "errors[ERR_PLAYLOG_SLOT_NOT_CONFIRMED]"]
        distinguishing_aspect: "A PlayLog against a RESERVED slot (reel never locked) fails with ERR_PLAYLOG_SLOT_NOT_CONFIRMED; the clock precondition is not even reached."
        test_recipe:
          setup: ["slot RESERVED in an ASSEMBLING reel; clock already past showtime start"]
          setup_api_calls:
            - { call: "POST /network/theaters", payload: { name: "MetroPlex", market_tier: MAJOR_METRO }, as: NetworkOps, captures: { t_id: "$.data.id" } }
            - { call: "POST /network/theaters/${t_id}/screens", payload: { auditorium_label: "Aud 1", seat_count: 200 }, as: NetworkOps, captures: { s_id: "$.data.id" } }
            - { call: "POST /network/features", payload: { title: "Skyline", content_rating: PG13, runtime_minutes: 120, release_date: "2026-08-10" }, as: NetworkOps, captures: { f_id: "$.data.id" } }
            - { call: "POST /network/screens/${s_id}/showtimes", payload: { feature_id: "${f_id}", starts_at: "2026-08-14T19:00:00Z" }, as: NetworkOps, captures: { st_id: "$.data.id" } }
            - { call: "GET /network/showtimes/${st_id}/reel", payload: {}, as: NetworkOps, captures: { r_id: "$.data[0].id", rv: "$.data[0].version" } }
            - { call: "POST /network/advertisers", payload: { name: "AutoCo", advertiser_type: NATIONAL, category: AUTOMOTIVE }, as: SalesManager, captures: { a_id: "$.data.id" } }
            - { call: "POST /network/campaigns", payload: { advertiser_id: "${a_id}", name: "C1", flight_start_date: "2026-08-10", flight_end_date: "2026-08-20", contracted_impressions: 10000, cpm_cents: 2500, budget_cents: 500000 }, as: SalesManager, as_user_id: "sm-1", captures: { c_id: "$.data.id" } }
            - { call: "POST /network/campaigns/${c_id}/submit", payload: {}, as: SalesManager, as_user_id: "sm-1" }
            - { call: "POST /network/campaigns/${c_id}/approve", payload: {}, as: SalesManager, as_user_id: "sm-2" }
            - { call: "POST /network/reels/${r_id}/slots", payload: { campaign_id: "${c_id}", start_offset_seconds: 0, duration_seconds: 60, expected_reel_version: "${rv}" }, as: SalesManager, captures: { sl: "$.data.id" } }
            - { call: "POST /network/_clock/set_current_utc", payload: { to_iso8601: "2026-08-14T21:30:00Z" }, as: NetworkOps }
          trigger:
            - { call: "POST /network/slots/${sl}/playlogs", payload: { outcome: VERIFIED }, as: TheaterOps, as_user_id: "${t_id}", captures: { err: "$.data.error_id" } }
          assert:
            - "error_id == ERR_PLAYLOG_SLOT_NOT_CONFIRMED; slot stays RESERVED"

      - name: duplicate_playlog_rejected_after_first
        claim_type: idempotency
        grounds: ["validations[priority=7]", "errors[ERR_PLAYLOG_ALREADY_RECORDED]"]
        distinguishing_aspect: "At most one PlayLog per slot: the second POST is rejected with ERR_PLAYLOG_ALREADY_RECORDED (checked before the generic CONFIRMED-state gate), distinguishing it from playlog_on_reserved_slot_rejected."
        test_recipe:
          setup: ["aired chain: slot PLAYED via a VERIFIED playlog"]
          setup_api_calls:
            - { call: "POST /network/theaters", payload: { name: "MetroPlex", market_tier: MAJOR_METRO }, as: NetworkOps, captures: { t_id: "$.data.id" } }
            - { call: "POST /network/theaters/${t_id}/screens", payload: { auditorium_label: "Aud 1", seat_count: 200 }, as: NetworkOps, captures: { s_id: "$.data.id" } }
            - { call: "POST /network/features", payload: { title: "Skyline", content_rating: PG13, runtime_minutes: 120, release_date: "2026-08-10" }, as: NetworkOps, captures: { f_id: "$.data.id" } }
            - { call: "POST /network/screens/${s_id}/showtimes", payload: { feature_id: "${f_id}", starts_at: "2026-08-14T19:00:00Z" }, as: NetworkOps, captures: { st_id: "$.data.id" } }
            - { call: "GET /network/showtimes/${st_id}/reel", payload: {}, as: NetworkOps, captures: { r_id: "$.data[0].id", rv: "$.data[0].version" } }
            - { call: "POST /network/advertisers", payload: { name: "AutoCo", advertiser_type: NATIONAL, category: AUTOMOTIVE }, as: SalesManager, captures: { a_id: "$.data.id" } }
            - { call: "POST /network/campaigns", payload: { advertiser_id: "${a_id}", name: "C1", flight_start_date: "2026-08-10", flight_end_date: "2026-08-20", contracted_impressions: 10000, cpm_cents: 2500, budget_cents: 500000 }, as: SalesManager, as_user_id: "sm-1", captures: { c_id: "$.data.id" } }
            - { call: "POST /network/campaigns/${c_id}/submit", payload: {}, as: SalesManager, as_user_id: "sm-1" }
            - { call: "POST /network/campaigns/${c_id}/approve", payload: {}, as: SalesManager, as_user_id: "sm-2" }
            - { call: "POST /network/reels/${r_id}/slots", payload: { campaign_id: "${c_id}", start_offset_seconds: 0, duration_seconds: 60, expected_reel_version: "${rv}" }, as: SalesManager, captures: { sl: "$.data.id" } }
            - { call: "GET /network/reels/${r_id}", payload: {}, as: NetworkOps, captures: { rv2: "$.data.version" } }
            - { call: "POST /network/reels/${r_id}/lock", payload: { expected_reel_version: "${rv2}" }, as: NetworkOps }
