              as: PlatformAdmin
            - call: "POST /connections/${gb_conn_a}/heartbeats"
              payload: { reported_at: "2026-09-01T10:00:00Z", payload_completeness_pct: 80 }
              as: CarrierRep
              as_user_id: "${gb_car_a}"
            - call: "POST /connections/${gb_conn_b}/heartbeats"
              payload: { reported_at: "2026-09-01T10:00:00Z", payload_completeness_pct: 77 }
              as: CarrierRep
              as_user_id: "${gb_car_b}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-02T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /connections/${gb_conn_a}/heartbeats"
              payload: { reported_at: "2026-09-02T00:00:00Z", payload_completeness_pct: 80 }
              as: CarrierRep
              as_user_id: "${gb_car_a}"
            - call: "POST /connections/${gb_conn_b}/heartbeats"
              payload: { reported_at: "2026-09-02T00:00:00Z", payload_completeness_pct: 77 }
              as: CarrierRep
              as_user_id: "${gb_car_b}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-05T04:00:00Z" }
              as: PlatformAdmin
            - call: "POST /_ops/run-checkpoint"
              payload: {}
              as: PlatformAdmin
          trigger:
            - call: "POST /connections/${gb_conn_a}/activate"
              payload: {}
              as: NetworkOps
              captures: { gb_a_status: $.data.status }
            - call: "POST /connections/${gb_conn_b}/activate"
              payload: {}
              as: NetworkOps
              captures: { gb_b_err: $.data.error_id }
          assert:
            - "Connection ${gb_conn_a}.data_quality_score == 70 and the activate response shows status ACTIVE (>= gate is inclusive at 70)"
            - "Connection ${gb_conn_b}.data_quality_score == 69 (round_half_up(40 + 26.95 + 2) = round_half_up(68.95)) and activate fails 422 with error_id ERR_QUALITY_GATE_NOT_MET"
            - "CarrierConnection.${gb_conn_b}.status remains TESTING after the failed activation"

      - name: match_score_exactly_ninety_fails_confirm
        grounds:
          - calculations.identity_match_score
          - state_machines.ShipmentIdentityLink.PROPOSED_to_CONFIRMED
          - errors.ERR_MATCH_SCORE_BELOW_THRESHOLD
        distinguishing_aspect: |
          Boundary on the match-score metric via the confirm endpoint with
          strict > semantics (opposite polarity from the >= quality gate): a
          link scoring exactly 0.90 (PO-number match + booking-reference
          match, destination mismatch) is rejected, while a score-1.0 link
          confirms.
        test_recipe:
          setup:
            - "Connection TESTING (shipment creation allowed). Shipper with PO po_number PO-9, booking_reference BK-9, destination_code LAX."
            - "Shipment A: po_reference_claim PO-9, tracking_reference BK-9, destination_code ORD (score 0.5 + 0.4 + 0 = 0.90)."
            - "Shipment B: po_reference_claim PO-9, tracking_reference BK-9, destination_code LAX (score 1.0)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
