        payload:
          hub_center_id: ${hub_id}
          spoke_center_id: ${spoke_id}
          coverage_tier: TIER_1_FULL
          max_concurrent_consults: 3
          effective_from: '2026-08-01T00:00:00Z'
          effective_until: '2027-08-01T00:00:00Z'
        as: ProgramCoordinator
        captures:
          agr_id: $.data.id
      - call: POST /stroke-network/spoke-agreements/${agr_id}/activate
        payload: {}
        as: ProgramCoordinator
      - call: GET /stroke-network/stroke-centers/${spoke_id}
        as: ProgramCoordinator
        captures:
          cv1: $.data.version
      - call: POST /stroke-network/certification-reports
        payload:
          center_id: ${spoke_id}
          period_start: '2026-08-01T00:00:00Z'
          period_end: '2026-09-01T00:00:00Z'
          expected_center_version: ${cv1}
        as: ProgramCoordinator
        as_user_id: pc_carl
        captures:
          rep_aug: $.data.id
          aug_status: $.data.status
      - call: GET /stroke-network/stroke-centers/${spoke_id}
        as: ProgramCoordinator
        captures:
          cv2: $.data.version
      trigger:
      - call: POST /stroke-network/certification-reports
        payload:
          center_id: ${spoke_id}
          period_start: '2026-09-01T00:00:00Z'
          period_end: '2026-10-01T00:00:00Z'
          expected_center_version: ${cv2}
        as: ProgramCoordinator
        as_user_id: pc_carl
        captures:
          rep_sep: $.data.id
          sep_status: $.data.status
          sep_ps: $.data.period_start
          sep_sup: $.data.superseded_by_report_id
      - call: GET /stroke-network/certification-reports/${rep_aug}
        as: ProgramCoordinator
        captures:
          aug_status2: $.data.status
          aug_sup: $.data.superseded_by_report_id
      - call: GET /stroke-network/stroke-centers/${spoke_id}
        as: ProgramCoordinator
        captures:
          cv3: $.data.version
      - call: POST /stroke-network/certification-reports
        payload:
          center_id: ${spoke_id}
          period_start: '2026-09-15T00:00:00Z'
          period_end: '2026-10-15T00:00:00Z'
          expected_center_version: ${cv3}
        as: ProgramCoordinator
        as_user_id: pc_carl
        captures:
          err_id: $.data.error_id
          err_msg: $.data.message
      - call: GET /stroke-network/stroke-centers/${spoke_id}
        as: ProgramCoordinator
        captures:
