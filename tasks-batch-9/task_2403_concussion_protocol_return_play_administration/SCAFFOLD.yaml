# =============================================================================
# PRD-Bench seed tables — task 2403
# Concussion Protocol & Return-to-Play Administration
# Difficulty target: EXPERT+ (deliberately above the §0.4 Expert band on
# endpoint/error surface, because the protocol has four independent authority
# layers — club medical, unaffiliated observer, independent consultant, league
# audit — each of which must be separately reachable and separately gated.)
# =============================================================================

scenario: |
  2403. Concussion Protocol & Return-to-Play Administration (professional sports league health and safety): baseline neurocognitive testing before the season with retest triggers, sideline evaluation with unaffiliated observer authority to require removal, locker room examination protocol and independent neurological consultant involvement, diagnosis documentation and mandatory removal-from-play enforcement, graduated return-to-participation steps with medical clearance at each stage, independent consultant final clearance requirement before return to contact, protocol compliance auditing with club penalties for violations, injury reporting to the league and public injury designation rules, post-season and off-season monitoring for prolonged symptoms

domain_name: concussion-protocol-rtp
api_prefix: /concussion-program

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: workflow_orchestration
  complexity_layers:
    - cascading_side_effects        # sweep -> evaluation breach -> audit -> club posture -> case freeze
    - dual_variant_calculation      # provisional vs accrued RTP timeline; preliminary vs adjudicated compliance score
    - rate_threshold_triggers       # symptom-score >= 4, severity >= 70, 21-day prolonged-symptom line, score->tier/posture bands
    - optimistic_concurrency        # OCC on Player.version (baseline supersede) and ConcussionCase.version (clearance supersede)

  entity_topology: flat
  # 11 peer entities linked by explicit foreign keys; no entity is nested inside
  # another in the URL surface. Every collection sits directly under the api
  # prefix (`/concussion-program/<collection>`), and every cross-entity link is
  # an FK field, never a path ancestor.

  state_machine_shape: cyclic
  state_machine_shape_secondary: parallel
  # ConcussionCase carries three independent state dimensions on one row
  # (case_status x monitoring_status x roster_exemption_status) and its
  # case_status dimension cycles (RTP_IN_PROGRESS -> PENDING_INC_CLEARANCE ->
  # RTP_IN_PROGRESS on consultant denial, and RTP_IN_PROGRESS -> STAGE_FROZEN ->
  # RTP_IN_PROGRESS on club-posture change). ProtocolAudit cycles independently
  # (FINDINGS_ISSUED -> CLUB_RESPONDED -> FINDINGS_ISSUED).

  relationship_patterns:
    - one_to_many          # Club -> Player, ConcussionCase -> ReturnStep
    - self_referential     # ConcussionCase.prior_case_id -> ConcussionCase.id
    - cross_aggregate      # ConcussionCase.club_id denormalised from Player; ProtocolAudit spans Club + Case + Evaluation

  role_model: segregation_of_duties
  # The clinician who documents the diagnosis may not grant final clearance; the
  # auditor who opens an audit may not issue its findings; the auditor who
  # issues findings may not close it; under club probation the clinician who
  # diagnosed the case may not sign off return-to-participation stages.

  consistency_model: immediate

  surface_summary:
    entities: 11
    state_machines: 12          # 3 of them are dimensions of ConcussionCase
    calculations: 12
    validations: 59
    endpoints: 52               # 29 writes + 23 reads
    errors: 57
    concurrency_rules: 2
    roles: 6

# =============================================================================
# §1.0 Response Envelope (FIXED)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:

  - name: Club
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Club display name", constraints: "1..80 chars" }
      - { name: market_code, type: string, source: input, description: "Three-letter market code", constraints: "exactly 3 uppercase letters; unique across Clubs (ERR_UNIQUENESS_VIOLATION)" }
      - { name: exemption_slots_total, type: integer, source: input, default: 3, description: "Roster concussion-exemption slots the club may hold at once", constraints: "1..5" }
      - { name: compliance_score, type: integer, source: computed, default: 100, description: "PRELIMINARY variant of club_compliance_score; drives escalation_tier and status" }
      - { name: adjudicated_compliance_score, type: integer, source: computed, default: 100, description: "ADJUDICATED variant of club_compliance_score; counts only CLOSED_UPHELD audits" }
      - { name: escalation_tier, type: enum, source: computed, default: TIER_0, description: "Fine escalation tier derived from compliance_score", constraints: "TIER_0 | TIER_1 | TIER_2 | TIER_3" }
      - { name: status, type: enum, source: computed, default: ACTIVE, description: "Compliance posture derived from compliance_score", constraints: "ACTIVE | PROBATION | SANCTIONED" }
      - { name: outstanding_fine_cents, type: integer, source: computed, default: 0, description: "Conserved ledger: sum of assessed_fine_cents over the club's audits in status FINDINGS_ISSUED, CLUB_RESPONDED or CLOSED_UPHELD" }
      - { name: open_violation_count, type: integer, source: computed, default: 0, description: "Count of the club's audits in status OPEN, FINDINGS_ISSUED or CLUB_RESPONDED" }
      - { name: exemption_slots_used, type: integer, source: computed, default: 0, description: "Count of the club's ConcussionCases with roster_exemption_status == GRANTED" }
      - { name: exemption_slots_available, type: integer, source: computed, description: "exemption_slots_total - exemption_slots_used; conserved with exemption_slots_used" }

  - name: Clinician
    parent: null
    common_fields: true
    fields:
      - { name: full_name, type: string, source: input, description: "Clinician name" }
      - { name: affiliation, type: enum, source: input, description: "Authority class of the clinician", constraints: "CLUB_AFFILIATED | UNAFFILIATED_OBSERVER | INDEPENDENT_CONSULTANT" }
      - { name: club_id, type: string, source: input, description: "FK -> Club.id; REQUIRED when affiliation == CLUB_AFFILIATED, MUST be omitted for the other two affiliations (ERR_INVALID_REQUEST)" }
      - { name: license_number, type: string, source: input, description: "Medical licence number", constraints: "unique across Clinicians (ERR_UNIQUENESS_VIOLATION)" }
      - { name: credential_expires_at, type: datetime, source: input, description: "Instant at which league credentialing lapses; actions at or after this instant are refused" }
      - { name: status, type: enum, source: system, default: ACTIVE, description: "Credential standing", constraints: "ACTIVE | SUSPENDED" }
      - { name: suspension_reason, type: string, source: system, description: "Reason recorded when the league suspends the clinician; null while ACTIVE" }
      - { name: cases_cleared_count, type: integer, source: computed, default: 0, description: "Count of IncClearance rows with status APPROVED whose inc_clinician_id is this clinician and whose case reached CLEARED_FOR_CONTACT" }

  - name: Player
    parent: null
    common_fields: true
    fields:
      - { name: club_id, type: string, source: input, description: "FK -> Club.id; the club that employs the player" }
      - { name: full_name, type: string, source: input, description: "Player name" }
      - { name: jersey_number, type: integer, source: input, description: "Jersey number", constraints: "0..99; unique per club (ERR_UNIQUENESS_VIOLATION)" }
      - { name: position, type: enum, source: input, description: "Roster position", constraints: "QB | RB | WR | TE | OL | DL | LB | DB | K | P" }
      - { name: baseline_status, type: enum, source: computed, default: NONE, description: "Baseline neurocognitive readiness derived by baseline_status_resolution", constraints: "NONE | VALID | RETEST_REQUIRED" }
      - { name: availability_status, type: enum, source: computed, default: AVAILABLE, description: "Protocol availability derived from the player's cases", constraints: "AVAILABLE | PROTOCOL_RESTRICTED" }
      - { name: public_injury_designation, type: enum, source: computed, default: NONE, description: "League public designation derived by public_designation_resolution", constraints: "NONE | QUESTIONABLE | DOUBTFUL | OUT" }
      - { name: diagnosed_case_count, type: integer, source: computed, default: 0, description: "Count of ConcussionCase rows for this player (all statuses)" }

  - name: Game
    parent: null
    common_fields: true
    fields:
      - { name: season_year, type: integer, source: input, description: "Season the game belongs to", constraints: "2020..2100" }
      - { name: week_index, type: integer, source: input, description: "Regular-season week", constraints: "1..18" }
      - { name: home_club_id, type: string, source: input, description: "FK -> Club.id; home club" }
      - { name: away_club_id, type: string, source: input, description: "FK -> Club.id; away club, MUST differ from home_club_id" }
      - { name: kickoff_at, type: datetime, source: input, description: "Scheduled kickoff instant (UTC)" }
      - { name: status, type: enum, source: system, default: SCHEDULED, description: "Game lifecycle", constraints: "SCHEDULED | IN_PROGRESS | FINAL" }
      - { name: report_window_opens_at, type: datetime, source: computed, description: "kickoff_at - 96h; earliest instant an InjuryReportEntry may be filed (inclusive)" }
      - { name: report_window_closes_at, type: datetime, source: computed, description: "kickoff_at - 90min; first instant at which a filing is stamped LATE_FILED (inclusive)" }

  - name: BaselineTest
    parent: null
    common_fields: true
    fields:
      - { name: player_id, type: string, source: input, description: "FK -> Player.id; subject of the baseline" }
      - { name: administered_by_clinician_id, type: string, source: system, description: "FK -> Clinician.id; taken from X-User-ID of the administering ClubPhysician" }
      - { name: season_year, type: integer, source: input, description: "Season the baseline is filed for", constraints: "2020..2100" }
      - { name: composite_score, type: integer, source: input, description: "Neurocognitive composite", constraints: "0..100" }
      - { name: reaction_time_ms, type: integer, source: input, description: "Mean reaction time in ms", constraints: "200..1500" }
      - { name: symptom_score, type: integer, source: input, description: "Baseline symptom burden", constraints: "0..20" }
      - { name: administered_at, type: datetime, source: system, description: "Logical-clock instant at which the test was recorded" }
      - { name: validity_expires_at, type: datetime, source: computed, description: "administered_at + 365 days; the sweep marks the test EXPIRED at or after this instant" }
      - { name: status, type: enum, source: system, default: VALID, description: "Baseline lifecycle", constraints: "VALID | SUPERSEDED | INVALIDATED | EXPIRED" }
      - { name: retest_required_reason, type: enum, source: system, default: NONE, description: "Why a retest is owed before the player may return to contact", constraints: "NONE | NEW_DIAGNOSIS | ADMIN_INVALIDATION | SEASON_ROLLOVER" }

  - name: SidelineEvaluation
    parent: null
    common_fields: true
    fields:
      - { name: player_id, type: string, source: input, description: "FK -> Player.id; evaluated player" }
      - { name: game_id, type: string, source: input, description: "FK -> Game.id; game during which the evaluation was initiated" }
      - { name: initiating_clinician_id, type: string, source: system, description: "FK -> Clinician.id; X-User-ID of the ClubPhysician or UnaffiliatedObserver who initiated the evaluation" }
      - { name: evaluating_clinician_id, type: string, source: system, description: "FK -> Clinician.id; X-User-ID of the ClubPhysician who performed the sideline screen; null until SCREENED" }
      - { name: inc_clinician_id, type: string, source: system, description: "FK -> Clinician.id; consultant who attended the locker-room examination; null until LOCKER_ROOM_EXAM" }
      - { name: trigger_source, type: enum, source: input, description: "Who required the evaluation", constraints: "CLUB_MEDICAL_STAFF | UNAFFILIATED_OBSERVER | GAME_OFFICIAL | VIDEO_SPOTTER | COACH" }
      - { name: mandatory_removal, type: boolean, source: computed, description: "true iff trigger_source in {UNAFFILIATED_OBSERVER, GAME_OFFICIAL, VIDEO_SPOTTER}; when true the player may not be cleared on field" }
      - { name: status, type: enum, source: system, default: INITIATED, description: "Evaluation lifecycle", constraints: "INITIATED | SCREENED | LOCKER_ROOM_EXAM | CLEARED_ON_FIELD | DIAGNOSED | NO_CONCUSSION_CLEARED | HELD_OUT_INCONCLUSIVE | PROTOCOL_BREACH" }
      - { name: initiated_at, type: datetime, source: system, description: "Logical-clock instant of creation" }
      - { name: protocol_deadline_at, type: datetime, source: computed, description: "initiated_at + 15min when mandatory_removal is true, else initiated_at + 45min; the sweep breaches the evaluation at or after this instant" }
      - { name: no_go_signs, type: array, source: input, default: [], description: "No-go sign codes observed during the screen", constraints: "each of LOSS_OF_CONSCIOUSNESS | ATAXIA | CONFUSION | AMNESIA | BLANK_STARE | MOTOR_INCOORDINATION; may be empty" }
      - { name: screen_symptom_score, type: integer, source: system, description: "Symptom score recorded at the screen", constraints: "0..20" }
      - { name: screened_at, type: datetime, source: system, description: "Instant the sideline screen completed" }
      - { name: exam_started_at, type: datetime, source: system, description: "Instant the locker-room examination began" }
      - { name: inc_block_ends_at, type: datetime, source: computed, description: "exam_started_at + 30min; the consultant's exam block, treated as a CLOSED interval for conflict detection" }
      - { name: exam_completed_at, type: datetime, source: system, description: "Instant the locker-room examination concluded (diagnosis or no-concussion decision)" }
      - { name: exam_duration_minutes, type: integer, source: computed, description: "floor((exam_completed_at - exam_started_at) / 60s); must be >= 8 for any exam conclusion" }
      - { name: diagnosis_outcome, type: enum, source: system, default: PENDING, description: "Locker-room examination conclusion", constraints: "PENDING | CONCUSSION | NO_CONCUSSION | INCONCLUSIVE" }

  - name: ConcussionCase
    parent: null
    common_fields: true
    fields:
      - { name: player_id, type: string, source: system, description: "FK -> Player.id; copied from the diagnosing evaluation" }
      - { name: club_id, type: string, source: system, description: "FK -> Club.id; denormalised from Player.club_id at diagnosis and never re-derived" }
      - { name: sideline_evaluation_id, type: string, source: system, description: "FK -> SidelineEvaluation.id; the evaluation whose locker-room exam produced the diagnosis" }
      - { name: diagnosing_clinician_id, type: string, source: system, description: "FK -> Clinician.id; X-User-ID of the ClubPhysician who documented the diagnosis" }
      - { name: prior_case_id, type: string, source: system, description: "FK -> ConcussionCase.id; the same player's most recent earlier case in the same season_year selected by greatest diagnosis_at then created_at ASC; null when none" }
      - { name: season_year, type: integer, source: system, description: "Copied from the game of the diagnosing evaluation" }
      - { name: diagnosis_at, type: datetime, source: system, description: "Logical-clock instant of diagnosis" }
      - { name: initial_symptom_score, type: integer, source: system, description: "Symptom score recorded at diagnosis", constraints: "0..20" }
      - { name: diagnosis_composite_score, type: integer, source: system, description: "Neurocognitive composite measured at diagnosis", constraints: "0..100" }
      - { name: baseline_deviation_points, type: integer, source: computed, description: "max(0, latest VALID BaselineTest.composite_score at diagnosis - diagnosis_composite_score); 0 when the player had no VALID baseline" }
      - { name: severity_index, type: integer, source: computed, description: "case_severity_index output", constraints: "0..100" }
      - { name: recurrence_count, type: integer, source: system, default: 0, description: "Number of symptom recurrences recorded against this case (failed stages plus recurrence symptom-checks)" }
      - { name: rtp_stage, type: integer, source: system, default: 0, description: "Highest stage_index with a PASSED, non-REVOKED ReturnStep", constraints: "0..5" }
      - { name: case_status, type: enum, source: system, default: MANDATORY_REMOVAL, description: "Protocol dimension", constraints: "MANDATORY_REMOVAL | RTP_IN_PROGRESS | PENDING_INC_CLEARANCE | STAGE_FROZEN | CLEARED_FOR_CONTACT" }
      - { name: frozen_from_status, type: enum, source: system, description: "case_status captured when a club sanction froze the case; restored verbatim when the sanction lifts; null unless STAGE_FROZEN", constraints: "RTP_IN_PROGRESS | PENDING_INC_CLEARANCE" }
      - { name: monitoring_status, type: enum, source: system, default: ACTIVE_SYMPTOM_WATCH, description: "Monitoring dimension, independent of case_status", constraints: "ACTIVE_SYMPTOM_WATCH | PROLONGED_SYMPTOM_WATCH | OFFSEASON_MONITORING | MONITORING_CLOSED" }
      - { name: roster_exemption_status, type: enum, source: system, default: NONE, description: "Roster-exemption dimension, independent of case_status", constraints: "NONE | GRANTED | RELEASED" }
      - { name: heightened_review_required, type: boolean, source: computed, default: false, description: "true while the owning club's status is PROBATION or SANCTIONED and the case is not CLEARED_FOR_CONTACT; forces stage sign-off by a clinician other than diagnosing_clinician_id" }
      - { name: projected_return_at, type: datetime, source: computed, description: "PROVISIONAL_PROJECTION variant of case_return_readiness_timeline, stamped at diagnosis and never revised" }
      - { name: earliest_return_at, type: datetime, source: computed, description: "FINAL_ACCRUED variant of case_return_readiness_timeline; null until a stage-5 ReturnStep passes" }
      - { name: cleared_for_contact_at, type: datetime, source: system, description: "Instant the case reached CLEARED_FOR_CONTACT; null before" }
      - { name: last_symptom_check_score, type: integer, source: system, description: "Symptom score of the most recent symptom-check; null when none", constraints: "0..20" }
      - { name: last_symptomatic_at, type: datetime, source: system, description: "Most recent instant at which a symptom score >= 4 was recorded (diagnosis counts when initial_symptom_score >= 4)" }
      - { name: days_since_diagnosis, type: integer, source: computed, description: "floor((logical clock now - diagnosis_at) / 24h)" }

  - name: ReturnStep
    parent: null
    common_fields: true
    fields:
      - { name: case_id, type: string, source: system, description: "FK -> ConcussionCase.id; owning case" }
      - { name: stage_index, type: integer, source: input, description: "Graduated return stage", constraints: "1..5; must equal case.rtp_stage + 1" }
      - { name: stage_name, type: enum, source: computed, description: "Stage label derived from stage_index", constraints: "1=SYMPTOM_LIMITED_ACTIVITY | 2=AEROBIC_EXERCISE | 3=SPORT_SPECIFIC_DRILLS | 4=NON_CONTACT_TRAINING | 5=FULL_CONTACT_PRACTICE" }
      - { name: attempt_index, type: integer, source: computed, description: "1 + count of earlier ReturnStep rows with the same case_id and stage_index" }
      - { name: status, type: enum, source: system, default: IN_PROGRESS, description: "Step lifecycle", constraints: "IN_PROGRESS | PASSED | FAILED_SYMPTOM_RECURRENCE | REVOKED" }
      - { name: started_at, type: datetime, source: system, description: "Logical-clock instant the stage began" }
      - { name: min_start_at, type: datetime, source: computed, description: "For stage_index >= 2: previous PASSED step's evaluated_at + STAGE_REST_HOURS[stage_index]; equals diagnosis_at for stage 1" }
      - { name: dwell_complete_at, type: datetime, source: computed, description: "started_at + STAGE_MIN_HOURS[stage_index]; the step may not be evaluated before this instant" }
      - { name: evaluated_at, type: datetime, source: system, description: "Instant the stage was signed off or failed; null while IN_PROGRESS" }
      - { name: cleared_by_clinician_id, type: string, source: system, description: "FK -> Clinician.id; X-User-ID of the ClubPhysician who evaluated the stage; null while IN_PROGRESS" }
      - { name: evaluation_symptom_score, type: integer, source: system, description: "Symptom score recorded at evaluation", constraints: "0..20" }

  - name: IncClearance
    parent: null
    common_fields: true
    fields:
      - { name: case_id, type: string, source: system, description: "FK -> ConcussionCase.id; case under final review" }
      - { name: inc_clinician_id, type: string, source: input, description: "FK -> Clinician.id; the independent neurological consultant assigned to decide" }
      - { name: requested_by_clinician_id, type: string, source: system, description: "FK -> Clinician.id; X-User-ID of the requesting ClubPhysician" }
      - { name: requested_at, type: datetime, source: system, description: "Logical-clock instant of the request" }
      - { name: decided_at, type: datetime, source: system, description: "Instant of the consultant decision; null while PENDING" }
      - { name: expires_at, type: datetime, source: computed, description: "decided_at + 168h when status == APPROVED; null otherwise" }
      - { name: status, type: enum, source: system, default: PENDING, description: "Clearance lifecycle", constraints: "PENDING | APPROVED | DENIED_MORE_REST | DENIED_INSUFFICIENT_DOCUMENTATION | SUPERSEDED | EXPIRED" }
      - { name: decision_notes, type: string, source: input, description: "Consultant rationale recorded with the decision" }
      - { name: documented_stage_count, type: integer, source: computed, description: "Count of distinct stage_index values with a PASSED, non-REVOKED ReturnStep on the case at request time", constraints: "0..5" }

  - name: ProtocolAudit
    parent: null
    common_fields: true
    fields:
      - { name: club_id, type: string, source: input, description: "FK -> Club.id; club under audit" }
      - { name: case_id, type: string, source: input, description: "FK -> ConcussionCase.id; case under audit; null for evaluation-only or reporting-only audits" }
      - { name: sideline_evaluation_id, type: string, source: input, description: "FK -> SidelineEvaluation.id; evaluation under audit; null when not evaluation-related" }
      - { name: opened_by_user_id, type: string, source: system, description: "Opaque X-User-ID of the LeagueAuditor who opened the audit; null when auto_opened is true" }
      - { name: auto_opened, type: boolean, source: system, default: false, description: "true when the system opened the audit from a sweep breach or a late injury-report filing" }
      - { name: status, type: enum, source: system, default: OPEN, description: "Audit lifecycle", constraints: "OPEN | FINDINGS_ISSUED | CLUB_RESPONDED | CLOSED_UPHELD | CLOSED_DISMISSED" }
      - { name: violation_codes, type: array, source: system, default: [], description: "Violation codes carried by the issued findings", constraints: "each of UNAUTHORIZED_SAME_GAME_RETURN | MISSING_INC_CLEARANCE | MISSED_MANDATORY_REMOVAL | EVALUATION_DEADLINE_BREACH | INCOMPLETE_LOCKER_ROOM_EXAM | BASELINE_TEST_MISSING | LATE_INJURY_REPORT; 1..7 entries once findings are issued" }
      - { name: exposure_days, type: integer, source: system, default: 0, description: "Days the violation persisted, supplied with the findings", constraints: "0..30" }
      - { name: escalation_tier_at_issuance, type: enum, source: system, description: "the club escalation_tier derived from compliance_score recomputed with THIS audit excluded, stamped when findings are issued (for an OPEN audit that equals the club live escalation_tier); null until findings are issued", constraints: "TIER_0 | TIER_1 | TIER_2 | TIER_3" }
      - { name: assessed_fine_cents, type: integer, source: computed, default: 0, description: "audit_fine_amount_cents output; reset to 0 when the audit closes DISMISSED" }
      - { name: response_round_count, type: integer, source: system, default: 0, description: "Number of club responses filed against this audit", constraints: "0..2" }
      - { name: club_response_note, type: string, source: input, description: "Most recent club response text; null until first response" }
      - { name: findings_issued_by_user_id, type: string, source: system, description: "Opaque X-User-ID of the auditor who issued the most recent findings; null when auto_opened findings" }
      - { name: closed_by_user_id, type: string, source: system, description: "Opaque X-User-ID of the auditor who closed the audit" }
      - { name: disposition, type: enum, source: system, default: PENDING, description: "Final adjudication", constraints: "PENDING | UPHELD | DISMISSED" }
      - { name: findings_issued_at, type: datetime, source: system, description: "Instant findings were most recently issued" }
      - { name: closed_at, type: datetime, source: system, description: "Instant the audit closed" }

  - name: InjuryReportEntry
    parent: null
    common_fields: true
    fields:
      - { name: game_id, type: string, source: input, description: "FK -> Game.id; game the report covers" }
      - { name: player_id, type: string, source: input, description: "FK -> Player.id; reported player" }
      - { name: club_id, type: string, source: system, description: "FK -> Club.id; copied from Player.club_id at filing" }
      - { name: practice_participation, type: enum, source: input, description: "Practice participation level", constraints: "DNP | LIMITED | FULL" }
      - { name: designation, type: enum, source: input, description: "Public game-status designation filed by the club", constraints: "NONE | QUESTIONABLE | DOUBTFUL | OUT" }
      - { name: required_designation, type: enum, source: computed, description: "public_designation_resolution output stamped at filing; the filed designation must equal it", constraints: "NONE | QUESTIONABLE | DOUBTFUL | OUT" }
      - { name: filed_at, type: datetime, source: system, description: "Logical-clock instant of filing" }
      - { name: amended_at, type: datetime, source: system, description: "Instant of the most recent amendment; null when never amended" }
      - { name: amended_from_designation, type: enum, source: system, description: "Designation replaced by the most recent amendment; null when never amended", constraints: "NONE | QUESTIONABLE | DOUBTFUL | OUT" }
      - { name: status, type: enum, source: system, default: FILED, description: "Report lifecycle", constraints: "FILED | LATE_FILED | AMENDED" }

# =============================================================================
# §1.2 State Machine Table
# All datetime comparisons use the logical clock (see POST /_clock/set_current_utc).
# =============================================================================
state_machines:

  - entity: Game
    state_field: status
    initial_state: SCHEDULED
    terminal_states: [FINAL]
    transitions:
      - from: SCHEDULED
        to: IN_PROGRESS
        trigger: "POST /concussion-program/games/{id}/advance-status {to_status: IN_PROGRESS}"
        preconditions:
          - "game.status == SCHEDULED (else ERR_RESOURCE_STATE_INVALID)"
        side_effects:
          - "sets Game.status = IN_PROGRESS"
          - "increments Game.version by 1"
      - from: IN_PROGRESS
        to: FINAL
        trigger: "POST /concussion-program/games/{id}/advance-status {to_status: FINAL}"
        preconditions:
          - "game.status == IN_PROGRESS (else ERR_RESOURCE_STATE_INVALID)"
        side_effects:
          - "sets Game.status = FINAL"
          - "no SidelineEvaluation for this game may afterwards be screened or cleared on field (ERR_GAME_NOT_IN_PROGRESS)"
          - "increments Game.version by 1"
      - from: SCHEDULED
        to: FINAL
        trigger: "POST /concussion-program/games/{id}/advance-status {to_status: FINAL}"
        preconditions:
          - "REJECTED: a game may not skip IN_PROGRESS; returns ERR_RESOURCE_STATE_INVALID"
        side_effects: []

  - entity: BaselineTest
    state_field: status
    initial_state: VALID
    terminal_states: [SUPERSEDED, INVALIDATED, EXPIRED]
    transitions:
      - from: VALID
        to: SUPERSEDED
        trigger: "POST /concussion-program/baseline-tests (a newer test for the same player_id)"
        preconditions:
          - "an existing BaselineTest for the same player_id has status VALID"
        side_effects:
          - "sets the older BaselineTest.status = SUPERSEDED"
          - "re-derives Player.baseline_status via baseline_status_resolution"
          - "increments Player.version by 1"
      - from: VALID
        to: INVALIDATED
        trigger: "POST /concussion-program/baseline-tests/{id}/invalidate"
        preconditions:
          - "baselineTest.status == VALID (else ERR_RESOURCE_STATE_INVALID)"
        side_effects:
          - "sets BaselineTest.status = INVALIDATED and retest_required_reason = ADMIN_INVALIDATION"
          - "re-derives Player.baseline_status (becomes NONE when no other VALID test exists, else re-resolved)"
          - "increments Player.version by 1"
      - from: VALID
        to: EXPIRED
        trigger: "POST /concussion-program/protocol-sweeps"
        preconditions:
          - "logical clock now >= baselineTest.validity_expires_at"
        side_effects:
          - "sets BaselineTest.status = EXPIRED and retest_required_reason = SEASON_ROLLOVER"
          - "re-derives Player.baseline_status = NONE when the player has no other VALID test"
          - "increments Player.version by 1"

  - entity: SidelineEvaluation
    state_field: status
    initial_state: INITIATED
    terminal_states: [CLEARED_ON_FIELD, DIAGNOSED, NO_CONCUSSION_CLEARED, HELD_OUT_INCONCLUSIVE, PROTOCOL_BREACH]
    transitions:
      - from: INITIATED
        to: SCREENED
        trigger: "POST /concussion-program/sideline-evaluations/{id}/screen"
        preconditions:
          - "evaluation.status == INITIATED (else ERR_EVALUATION_STATE_INVALID)"
          - "game.status == IN_PROGRESS (else ERR_GAME_NOT_IN_PROGRESS)"
          - "acting clinician affiliation == CLUB_AFFILIATED and clinician.club_id == player.club_id (else ERR_CLUB_SCOPE_VIOLATION)"
          - "acting clinician.status == ACTIVE (else ERR_CLINICIAN_SUSPENDED)"
          - "logical clock now < acting clinician.credential_expires_at (else ERR_CLINICIAN_CREDENTIAL_EXPIRED)"
        side_effects:
          - "sets evaluating_clinician_id = X-User-ID, screened_at = now, no_go_signs and screen_symptom_score from the request"
          - "increments SidelineEvaluation.version by 1"
      - from: SCREENED
        to: LOCKER_ROOM_EXAM
        trigger: "POST /concussion-program/sideline-evaluations/{id}/locker-room-exam"
        preconditions:
          - "evaluation.status == SCREENED (else ERR_EVALUATION_STATE_INVALID)"
          - "inc_clinician_id resolves to a Clinician whose affiliation is UNAFFILIATED_OBSERVER or INDEPENDENT_CONSULTANT and which is not evaluating_clinician_id (else ERR_EXAM_INC_INELIGIBLE)"
          - "that clinician is ACTIVE and credentialed (else ERR_CLINICIAN_SUSPENDED / ERR_CLINICIAN_CREDENTIAL_EXPIRED)"
          - "the requested exam block does not conflict with the same consultant's existing block (else ERR_INC_EXAM_WINDOW_CONFLICT)"
        side_effects:
          - "sets exam_started_at = now, inc_clinician_id, and derives inc_block_ends_at = now + 30min"
          - "increments SidelineEvaluation.version by 1"
      - from: SCREENED
        to: CLEARED_ON_FIELD
        trigger: "POST /concussion-program/sideline-evaluations/{id}/clear-to-return"
        preconditions:
          - "evaluation.status == SCREENED (else ERR_EVALUATION_STATE_INVALID)"
          - "evaluation.mandatory_removal == false (else ERR_MANDATORY_REMOVAL_ENFORCED)"
          - "evaluation.no_go_signs is empty and screen_symptom_score == 0 (else ERR_MANDATORY_REMOVAL_ENFORCED)"
          - "game.status == IN_PROGRESS (else ERR_GAME_NOT_IN_PROGRESS)"
          - "no other SidelineEvaluation for the same player_id and game_id has status DIAGNOSED or HELD_OUT_INCONCLUSIVE (else ERR_SAME_GAME_RETURN_PROHIBITED)"
        side_effects:
          - "sets status = CLEARED_ON_FIELD and diagnosis_outcome = NO_CONCUSSION"
          - "Player.availability_status remains AVAILABLE and public_injury_designation is re-derived"
          - "increments SidelineEvaluation.version by 1"
      - from: LOCKER_ROOM_EXAM
        to: DIAGNOSED
        trigger: "POST /concussion-program/sideline-evaluations/{id}/diagnose-concussion"
        preconditions:
          - "evaluation.status == LOCKER_ROOM_EXAM (else ERR_EVALUATION_STATE_INVALID)"
          - "floor((now - exam_started_at)/60s) >= MIN_LOCKER_ROOM_EXAM_MINUTES (else ERR_LOCKER_ROOM_EXAM_TOO_SHORT)"
          - "the player has no ConcussionCase whose case_status is not CLEARED_FOR_CONTACT (else ERR_OPEN_CASE_EXISTS)"
          - "acting clinician is the evaluating_clinician_id's club physician for player.club_id (else ERR_CLUB_SCOPE_VIOLATION)"
        side_effects:
          - "sets exam_completed_at = now, exam_duration_minutes, diagnosis_outcome = CONCUSSION, status = DIAGNOSED"
          - "creates ConcussionCase with case_status = MANDATORY_REMOVAL, monitoring_status = ACTIVE_SYMPTOM_WATCH, roster_exemption_status = NONE, rtp_stage = 0, recurrence_count = 0"
          - "resolves prior_case_id, computes baseline_deviation_points, severity_index (case_severity_index) and projected_return_at (PROVISIONAL_PROJECTION variant)"
          - "sets ConcussionCase.last_symptomatic_at = diagnosis_at when initial_symptom_score >= SYMPTOM_RECURRENCE_THRESHOLD"
          - "sets Player.availability_status = PROTOCOL_RESTRICTED, public_injury_designation = OUT, diagnosed_case_count += 1"
          - "sets the player's latest VALID BaselineTest.retest_required_reason = NEW_DIAGNOSIS and Player.baseline_status = RETEST_REQUIRED"
          - "increments Player.version by 1 and SidelineEvaluation.version by 1"
      - from: LOCKER_ROOM_EXAM
        to: NO_CONCUSSION_CLEARED
        trigger: "POST /concussion-program/sideline-evaluations/{id}/conclude-no-concussion {outcome: NO_CONCUSSION}"
        preconditions:
          - "evaluation.status == LOCKER_ROOM_EXAM (else ERR_EVALUATION_STATE_INVALID)"
          - "exam duration >= MIN_LOCKER_ROOM_EXAM_MINUTES (else ERR_LOCKER_ROOM_EXAM_TOO_SHORT)"
          - "evaluation.no_go_signs is empty (else ERR_NO_GO_SIGNS_PRESENT)"
        side_effects:
          - "sets exam_completed_at = now, exam_duration_minutes, diagnosis_outcome = NO_CONCUSSION, status = NO_CONCUSSION_CLEARED"
          - "no ConcussionCase is created; Player fields unchanged"
          - "increments SidelineEvaluation.version by 1"
      - from: LOCKER_ROOM_EXAM
        to: HELD_OUT_INCONCLUSIVE
        trigger: "POST /concussion-program/sideline-evaluations/{id}/conclude-no-concussion {outcome: INCONCLUSIVE}"
        preconditions:
          - "evaluation.status == LOCKER_ROOM_EXAM (else ERR_EVALUATION_STATE_INVALID)"
          - "exam duration >= MIN_LOCKER_ROOM_EXAM_MINUTES (else ERR_LOCKER_ROOM_EXAM_TOO_SHORT)"
        side_effects:
          - "sets exam_completed_at = now, diagnosis_outcome = INCONCLUSIVE, status = HELD_OUT_INCONCLUSIVE"
          - "the player may not be cleared on field for this game by any other evaluation (ERR_SAME_GAME_RETURN_PROHIBITED)"
          - "increments SidelineEvaluation.version by 1"
      - from: INITIATED
        to: PROTOCOL_BREACH
        trigger: "POST /concussion-program/protocol-sweeps"
        preconditions:
          - "logical clock now >= evaluation.protocol_deadline_at"
        side_effects:
          - "sets status = PROTOCOL_BREACH"
          - "creates ProtocolAudit with auto_opened = true, opened_by_user_id = null, club_id = player.club_id, sideline_evaluation_id = evaluation.id, violation_codes = [EVALUATION_DEADLINE_BREACH], exposure_days = 0, then immediately advances it to FINDINGS_ISSUED stamping escalation_tier_at_issuance and assessed_fine_cents"
          - "runs club_posture_propagation for the club"
      - from: SCREENED
        to: PROTOCOL_BREACH
        trigger: "POST /concussion-program/protocol-sweeps"
        preconditions:
          - "logical clock now >= evaluation.protocol_deadline_at"
        side_effects:
          - "identical to the INITIATED -> PROTOCOL_BREACH side effects"
      - from: LOCKER_ROOM_EXAM
        to: PROTOCOL_BREACH
        trigger: "POST /concussion-program/protocol-sweeps"
        preconditions:
          - "logical clock now >= evaluation.protocol_deadline_at"
        side_effects:
          - "sets status = PROTOCOL_BREACH"
          - "creates the auto ProtocolAudit with violation_codes = [EVALUATION_DEADLINE_BREACH, INCOMPLETE_LOCKER_ROOM_EXAM] because the examination was left unconcluded, then advances it to FINDINGS_ISSUED"
          - "runs club_posture_propagation for the club"

  - entity: ConcussionCase
    state_field: case_status
    initial_state: MANDATORY_REMOVAL
    terminal_states: [CLEARED_FOR_CONTACT]
    transitions:
      - from: MANDATORY_REMOVAL
        to: RTP_IN_PROGRESS
        trigger: "POST /concussion-program/concussion-cases/{id}/return-steps {stage_index: 1}"
        preconditions:
          - "case.case_status == MANDATORY_REMOVAL (else ERR_CASE_STATE_INVALID)"
          - "club.status != SANCTIONED (else ERR_CASE_STAGE_FROZEN)"
          - "stage_index == case.rtp_stage + 1 (else ERR_STAGE_SEQUENCE_VIOLATION)"
          - "no ReturnStep for the case has status IN_PROGRESS (else ERR_STEP_ALREADY_IN_PROGRESS)"
          - "acting ClubPhysician's club_id == case.club_id (else ERR_CLUB_SCOPE_VIOLATION)"
        side_effects:
          - "creates ReturnStep(stage_index = 1, status = IN_PROGRESS, started_at = now, attempt_index derived)"
          - "sets case_status = RTP_IN_PROGRESS"
          - "increments ConcussionCase.version by 1"
      - from: RTP_IN_PROGRESS
        to: RTP_IN_PROGRESS
        trigger: "POST /concussion-program/return-steps/{id}/evaluate {outcome: PASS} for stage_index 1..4, then POST /concussion-program/concussion-cases/{id}/return-steps for the next stage"
        preconditions:
          - "see ReturnStep IN_PROGRESS -> PASSED and the stage rest-buffer rule"
        side_effects:
          - "sets case.rtp_stage = the passed stage_index (self-loop; the case remains RTP_IN_PROGRESS through stages 1..4)"
          - "increments ConcussionCase.version by 1"
      - from: RTP_IN_PROGRESS
        to: PENDING_INC_CLEARANCE
        trigger: "POST /concussion-program/concussion-cases/{id}/inc-clearances"
        preconditions:
          - "case.case_status == RTP_IN_PROGRESS (else ERR_CASE_STATE_INVALID)"
          - "expected_case_version == case.version (else ERR_STALE_CASE_VERSION)"
          - "the case has at least one ReturnStep (else ERR_NO_RETURN_STEPS_RECORDED)"
          - "every stage_index 1..5 has a PASSED non-REVOKED ReturnStep (else ERR_RTP_STAGES_INCOMPLETE)"
          - "inc_clinician_id is an ACTIVE, credentialed INDEPENDENT_CONSULTANT whose club_id is null and which is not case.diagnosing_clinician_id (else ERR_INC_NOT_INDEPENDENT)"
          - "club.status != SANCTIONED (else ERR_CASE_STAGE_FROZEN)"
        side_effects:
          - "sets any existing IncClearance for the case with status PENDING to SUPERSEDED"
          - "creates IncClearance(status = PENDING, requested_at = now, requested_by_clinician_id = X-User-ID, documented_stage_count derived)"
          - "sets case_status = PENDING_INC_CLEARANCE"
          - "increments ConcussionCase.version by 1"
      - from: PENDING_INC_CLEARANCE
        to: RTP_IN_PROGRESS
        trigger: "POST /concussion-program/inc-clearances/{id}/decide {decision: DENIED_MORE_REST}"
        preconditions:
          - "clearance.status == PENDING (else ERR_CLEARANCE_STATE_INVALID)"
          - "X-User-ID == clearance.inc_clinician_id (else ERR_INC_ASSIGNMENT_MISMATCH)"
        side_effects:
          - "sets clearance.status = DENIED_MORE_REST, decided_at = now"
          - "REVOKES the case's highest PASSED ReturnStep (selected by stage_index DESC, then attempt_index DESC, then created_at DESC)"
          - "sets case.rtp_stage = max(0, rtp_stage - 1) and case_status = RTP_IN_PROGRESS, clears earliest_return_at to null"
          - "increments ConcussionCase.version by 1"
      - from: PENDING_INC_CLEARANCE
        to: RTP_IN_PROGRESS
        trigger: "POST /concussion-program/inc-clearances/{id}/decide {decision: DENIED_INSUFFICIENT_DOCUMENTATION}"
        preconditions:
          - "clearance.status == PENDING (else ERR_CLEARANCE_STATE_INVALID)"
          - "X-User-ID == clearance.inc_clinician_id (else ERR_INC_ASSIGNMENT_MISMATCH)"
        side_effects:
          - "sets clearance.status = DENIED_INSUFFICIENT_DOCUMENTATION, decided_at = now"
          - "DIVERGENT from DENIED_MORE_REST: no ReturnStep is revoked and case.rtp_stage is unchanged; earliest_return_at is retained"
          - "sets case_status = RTP_IN_PROGRESS"
          - "increments ConcussionCase.version by 1"
      - from: PENDING_INC_CLEARANCE
        to: RTP_IN_PROGRESS
        trigger: "POST /concussion-program/clinicians/{id}/suspend (the case's pending consultant)"
        preconditions:
          - "an IncClearance for the case has status PENDING and inc_clinician_id == the suspended clinician"
        side_effects:
          - "sets that IncClearance.status = SUPERSEDED"
          - "sets case_status = RTP_IN_PROGRESS without revoking any ReturnStep"
          - "increments ConcussionCase.version by 1"
      - from: PENDING_INC_CLEARANCE
        to: RTP_IN_PROGRESS
        trigger: "POST /concussion-program/concussion-cases/{id}/symptom-check {symptom_score >= 4}"
        preconditions:
          - "case.case_status == PENDING_INC_CLEARANCE"
        side_effects:
          - "sets last_symptom_check_score, last_symptomatic_at = now, recurrence_count += 1 and recomputes severity_index"
          - "sets the case's PENDING IncClearance to DENIED_MORE_REST with decided_at = now"
          - "REVOKES the case's highest PASSED ReturnStep and sets rtp_stage = max(0, rtp_stage - 1), earliest_return_at = null"
          - "sets case_status = RTP_IN_PROGRESS"
          - "sets monitoring_status = PROLONGED_SYMPTOM_WATCH when recurrence_count >= 2"
          - "increments ConcussionCase.version by 1"
      - from: PENDING_INC_CLEARANCE
        to: CLEARED_FOR_CONTACT
        trigger: "POST /concussion-program/concussion-cases/{id}/return-to-contact"
        preconditions:
          - "case.case_status == PENDING_INC_CLEARANCE (else ERR_CASE_STATE_INVALID)"
          - "club.status != SANCTIONED (else ERR_CASE_STAGE_FROZEN)"
          - "the case's most recent IncClearance has status APPROVED (else ERR_INC_CLEARANCE_MISSING) and expires_at > now (else ERR_INC_CLEARANCE_EXPIRED)"
          - "logical clock now >= case.earliest_return_at (else ERR_RETURN_BEFORE_EARLIEST_DATE)"
          - "Player.baseline_status == VALID (else ERR_BASELINE_RETEST_REQUIRED when RETEST_REQUIRED, ERR_BASELINE_NOT_ESTABLISHED when NONE)"
          - "acting ClubPhysician's club_id == case.club_id (else ERR_CLUB_SCOPE_VIOLATION)"
        side_effects:
          - "sets case_status = CLEARED_FOR_CONTACT, cleared_for_contact_at = now, heightened_review_required = false"
          - "when roster_exemption_status == GRANTED: sets it to RELEASED, Club.exemption_slots_used -= 1 and exemption_slots_available += 1"
          - "sets Player.availability_status = AVAILABLE and re-derives public_injury_designation (becomes QUESTIONABLE for POST_CLEARANCE_QUESTIONABLE_HOURS)"
          - "increments the approving consultant's cases_cleared_count by 1"
          - "increments ConcussionCase.version, Player.version and (when a slot was released) Club.version by 1"
      - from: RTP_IN_PROGRESS
        to: STAGE_FROZEN
        trigger: "POST /concussion-program/protocol-audits/{id}/findings | POST /concussion-program/protocol-audits/{id}/close | POST /concussion-program/protocol-sweeps (via club_posture_propagation when the club's status becomes SANCTIONED)"
        preconditions:
          - "club.status transitions to SANCTIONED and case.case_status == RTP_IN_PROGRESS"
        side_effects:
          - "sets frozen_from_status = RTP_IN_PROGRESS and case_status = STAGE_FROZEN"
          - "sets heightened_review_required = true"
          - "increments ConcussionCase.version by 1"
      - from: PENDING_INC_CLEARANCE
        to: STAGE_FROZEN
        trigger: "POST /concussion-program/protocol-audits/{id}/findings | POST /concussion-program/protocol-audits/{id}/close | POST /concussion-program/protocol-sweeps (via club_posture_propagation)"
        preconditions:
          - "club.status transitions to SANCTIONED and case.case_status == PENDING_INC_CLEARANCE"
        side_effects:
          - "sets frozen_from_status = PENDING_INC_CLEARANCE and case_status = STAGE_FROZEN; any PENDING IncClearance is left PENDING"
          - "increments ConcussionCase.version by 1"
      - from: STAGE_FROZEN
        to: RTP_IN_PROGRESS
        trigger: "POST /concussion-program/protocol-audits/{id}/close {disposition: DISMISSED} (via club_posture_propagation when the club leaves SANCTIONED)"
        preconditions:
          - "club.status becomes ACTIVE or PROBATION and case.frozen_from_status == RTP_IN_PROGRESS"
        side_effects:
          - "restores case_status = RTP_IN_PROGRESS and sets frozen_from_status = null"
          - "increments ConcussionCase.version by 1"
      - from: STAGE_FROZEN
        to: PENDING_INC_CLEARANCE
        trigger: "POST /concussion-program/protocol-audits/{id}/close {disposition: DISMISSED} (via club_posture_propagation when the club leaves SANCTIONED)"
        preconditions:
          - "club.status becomes ACTIVE or PROBATION and case.frozen_from_status == PENDING_INC_CLEARANCE"
        side_effects:
          - "restores case_status = PENDING_INC_CLEARANCE and sets frozen_from_status = null"
          - "increments ConcussionCase.version by 1"

  - entity: ConcussionCase
    state_field: monitoring_status
    initial_state: ACTIVE_SYMPTOM_WATCH
    terminal_states: [MONITORING_CLOSED]
    transitions:
      - from: ACTIVE_SYMPTOM_WATCH
        to: PROLONGED_SYMPTOM_WATCH
        trigger: "POST /concussion-program/protocol-sweeps"
        preconditions:
          - "case.days_since_diagnosis >= PROLONGED_SYMPTOM_DAYS and case_status != CLEARED_FOR_CONTACT"
        side_effects:
          - "sets monitoring_status = PROLONGED_SYMPTOM_WATCH"
          - "sets Player.availability_status = PROTOCOL_RESTRICTED and public_injury_designation = OUT"
          - "increments ConcussionCase.version and Player.version by 1"
      - from: ACTIVE_SYMPTOM_WATCH
        to: PROLONGED_SYMPTOM_WATCH
        trigger: "POST /concussion-program/return-steps/{id}/evaluate {outcome: SYMPTOM_RECURRENCE} | POST /concussion-program/concussion-cases/{id}/symptom-check {symptom_score >= 4}"
        preconditions:
          - "the resulting case.recurrence_count >= 2"
        side_effects:
          - "sets monitoring_status = PROLONGED_SYMPTOM_WATCH"
          - "sets Player.availability_status = PROTOCOL_RESTRICTED and public_injury_designation = OUT"
          - "increments ConcussionCase.version and Player.version by 1"
      - from: ACTIVE_SYMPTOM_WATCH
        to: OFFSEASON_MONITORING
        trigger: "POST /concussion-program/protocol-sweeps"
        preconditions:
          - "logical clock now >= OFFSEASON_START_AT for case.season_year"
        side_effects:
          - "sets monitoring_status = OFFSEASON_MONITORING"
          - "increments ConcussionCase.version by 1"
      - from: PROLONGED_SYMPTOM_WATCH
        to: OFFSEASON_MONITORING
        trigger: "POST /concussion-program/protocol-sweeps"
        preconditions:
          - "logical clock now >= OFFSEASON_START_AT for case.season_year"
        side_effects:
          - "sets monitoring_status = OFFSEASON_MONITORING (the prolonged flag is superseded by the off-season programme)"
          - "increments ConcussionCase.version by 1"
      - from: OFFSEASON_MONITORING
        to: MONITORING_CLOSED
        trigger: "POST /concussion-program/concussion-cases/{id}/symptom-check {symptom_score: 0}"
        preconditions:
          - "case.monitoring_status == OFFSEASON_MONITORING and case.case_status == CLEARED_FOR_CONTACT"
        side_effects:
          - "sets monitoring_status = MONITORING_CLOSED (terminal) and last_symptom_check_score = 0"
          - "increments ConcussionCase.version by 1"

  - entity: ConcussionCase
    state_field: roster_exemption_status
    initial_state: NONE
    terminal_states: [RELEASED]
    transitions:
      - from: NONE
        to: GRANTED
        trigger: "POST /concussion-program/concussion-cases/{id}/roster-exemption"
        preconditions:
          - "case.roster_exemption_status == NONE (else ERR_EXEMPTION_ALREADY_GRANTED)"
          - "case.case_status != CLEARED_FOR_CONTACT (else ERR_CASE_STATE_INVALID)"
          - "club.exemption_slots_available >= 1 (else ERR_NO_EXEMPTION_SLOTS)"
          - "X-User-ID == case.club_id for the ClubComplianceOfficer (else ERR_CLUB_SCOPE_VIOLATION)"
        side_effects:
          - "sets roster_exemption_status = GRANTED"
          - "increments Club.exemption_slots_used by 1 and decrements exemption_slots_available by 1"
          - "increments ConcussionCase.version and Club.version by 1"
      - from: GRANTED
        to: RELEASED
        trigger: "POST /concussion-program/concussion-cases/{id}/return-to-contact"
        preconditions:
          - "case reaches CLEARED_FOR_CONTACT while roster_exemption_status == GRANTED"
        side_effects:
          - "sets roster_exemption_status = RELEASED (compensating release of the slot)"
          - "decrements Club.exemption_slots_used by 1 and increments exemption_slots_available by 1"
          - "increments ConcussionCase.version and Club.version by 1"

  - entity: ReturnStep
    state_field: status
    initial_state: IN_PROGRESS
    terminal_states: [FAILED_SYMPTOM_RECURRENCE, REVOKED]
    transitions:
      - from: IN_PROGRESS
        to: PASSED
        trigger: "POST /concussion-program/return-steps/{id}/evaluate {outcome: PASS}"
        preconditions:
          - "step.status == IN_PROGRESS (else ERR_STEP_STATE_INVALID)"
          - "case.case_status != STAGE_FROZEN (else ERR_CASE_STAGE_FROZEN)"
          - "logical clock now >= step.dwell_complete_at (else ERR_STAGE_DWELL_NOT_MET)"
          - "symptom_score < SYMPTOM_RECURRENCE_THRESHOLD (else ERR_SYMPTOM_OUTCOME_MISMATCH)"
          - "when case.heightened_review_required is true: X-User-ID != case.diagnosing_clinician_id (else ERR_HEIGHTENED_REVIEW_CLINICIAN_REQUIRED)"
        side_effects:
          - "sets status = PASSED, evaluated_at = now, cleared_by_clinician_id = X-User-ID, evaluation_symptom_score"
          - "sets case.rtp_stage = step.stage_index"
          - "when stage_index == 5: computes case.earliest_return_at (FINAL_ACCRUED variant)"
          - "increments ReturnStep.version and ConcussionCase.version by 1"
      - from: IN_PROGRESS
        to: FAILED_SYMPTOM_RECURRENCE
        trigger: "POST /concussion-program/return-steps/{id}/evaluate {outcome: SYMPTOM_RECURRENCE}"
        preconditions:
          - "step.status == IN_PROGRESS (else ERR_STEP_STATE_INVALID)"
          - "case.case_status != STAGE_FROZEN (else ERR_CASE_STAGE_FROZEN)"
          - "symptom_score >= SYMPTOM_RECURRENCE_THRESHOLD (else ERR_SYMPTOM_OUTCOME_MISMATCH)"
        side_effects:
          - "sets status = FAILED_SYMPTOM_RECURRENCE, evaluated_at = now, cleared_by_clinician_id = X-User-ID"
          - "sets case.recurrence_count += 1, case.last_symptomatic_at = now, rtp_stage = max(0, step.stage_index - 2), earliest_return_at = null and recomputes severity_index"
          - "sets case.monitoring_status = PROLONGED_SYMPTOM_WATCH when the new recurrence_count >= 2, which in turn sets Player.availability_status = PROTOCOL_RESTRICTED and public_injury_designation = OUT"
          - "increments ReturnStep.version, ConcussionCase.version and (when the player was touched) Player.version by 1"
          - "NOTE: the dwell requirement is NOT enforced on this branch - a recurrence may be reported at any time"
      - from: PASSED
        to: REVOKED
        trigger: "POST /concussion-program/inc-clearances/{id}/decide {decision: DENIED_MORE_REST} | POST /concussion-program/concussion-cases/{id}/symptom-check {symptom_score >= 4}"
        preconditions:
          - "the step is the case's highest PASSED step by stage_index DESC, attempt_index DESC, created_at DESC"
        side_effects:
          - "sets status = REVOKED (the stage must be repeated as a new ReturnStep with attempt_index + 1)"
          - "increments ReturnStep.version by 1"

  - entity: IncClearance
    state_field: status
    initial_state: PENDING
    terminal_states: [DENIED_MORE_REST, DENIED_INSUFFICIENT_DOCUMENTATION, SUPERSEDED, EXPIRED]
    transitions:
      - from: PENDING
        to: APPROVED
        trigger: "POST /concussion-program/inc-clearances/{id}/decide {decision: APPROVED}"
        preconditions:
          - "clearance.status == PENDING (else ERR_CLEARANCE_STATE_INVALID)"
          - "X-User-ID == clearance.inc_clinician_id (else ERR_INC_ASSIGNMENT_MISMATCH)"
          - "acting clinician is ACTIVE (else ERR_CLINICIAN_SUSPENDED) and credentialed (else ERR_CLINICIAN_CREDENTIAL_EXPIRED)"
          - "case.case_status == PENDING_INC_CLEARANCE (else ERR_CASE_STATE_INVALID)"
          - "every stage_index 1..5 still has a PASSED non-REVOKED ReturnStep (else ERR_RTP_STAGES_INCOMPLETE)"
        side_effects:
          - "sets status = APPROVED, decided_at = now, expires_at = now + INC_CLEARANCE_VALIDITY_HOURS"
          - "case_status remains PENDING_INC_CLEARANCE until return-to-contact is invoked"
          - "increments IncClearance.version by 1"
      - from: PENDING
        to: DENIED_MORE_REST
        trigger: "POST /concussion-program/inc-clearances/{id}/decide {decision: DENIED_MORE_REST} | POST /concussion-program/concussion-cases/{id}/symptom-check {symptom_score >= 4}"
        preconditions:
          - "clearance.status == PENDING"
        side_effects:
          - "see ConcussionCase PENDING_INC_CLEARANCE -> RTP_IN_PROGRESS (step revocation and stage regression)"
      - from: PENDING
        to: DENIED_INSUFFICIENT_DOCUMENTATION
        trigger: "POST /concussion-program/inc-clearances/{id}/decide {decision: DENIED_INSUFFICIENT_DOCUMENTATION}"
        preconditions:
          - "clearance.status == PENDING"
        side_effects:
          - "sets status and decided_at only; no step revocation (divergent from DENIED_MORE_REST)"
      - from: PENDING
        to: SUPERSEDED
        trigger: "POST /concussion-program/concussion-cases/{id}/inc-clearances (a fresh request) | POST /concussion-program/clinicians/{id}/suspend"
        preconditions:
          - "clearance.status == PENDING"
        side_effects:
          - "sets status = SUPERSEDED with decided_at = null"
          - "increments IncClearance.version by 1"
      - from: APPROVED
        to: EXPIRED
        trigger: "POST /concussion-program/protocol-sweeps"
        preconditions:
          - "logical clock now >= clearance.expires_at and case.case_status != CLEARED_FOR_CONTACT"
        side_effects:
          - "sets status = EXPIRED; the case remains PENDING_INC_CLEARANCE and return-to-contact then fails with ERR_INC_CLEARANCE_EXPIRED"
          - "increments IncClearance.version by 1"

  - entity: ProtocolAudit
    state_field: status
    initial_state: OPEN
    terminal_states: [CLOSED_UPHELD, CLOSED_DISMISSED]
    transitions:
      - from: OPEN
        to: FINDINGS_ISSUED
        trigger: "POST /concussion-program/protocol-audits/{id}/findings"
        preconditions:
          - "audit.status == OPEN (else ERR_AUDIT_STATE_INVALID)"
          - "X-User-ID != audit.opened_by_user_id (else ERR_SEGREGATION_OF_DUTIES)"
          - "the resulting Club.outstanding_fine_cents must not exceed SEASON_FINE_CAP_CENTS (else ERR_CLUB_FINE_CAP_EXCEEDED)"
        side_effects:
          - "ORDER IS PINNED: (1) stamp escalation_tier_at_issuance = the tier band of club_compliance_score PRELIMINARY recomputed over the club's counted audits with THIS audit excluded (for an OPEN audit that is just the club's live escalation_tier); (2) store violation_codes and exposure_days; (3) compute assessed_fine_cents via audit_fine_amount_cents using the stamped tier; (4) set status = FINDINGS_ISSUED, findings_issued_at = now, findings_issued_by_user_id = X-User-ID; (5) run club_posture_propagation, which recomputes compliance_score, outstanding_fine_cents, escalation_tier and status and then freezes or unfreezes the club's cases"
          - "increments ProtocolAudit.version and Club.version by 1"
      - from: FINDINGS_ISSUED
        to: CLUB_RESPONDED
        trigger: "POST /concussion-program/protocol-audits/{id}/respond"
        preconditions:
          - "audit.status == FINDINGS_ISSUED (else ERR_AUDIT_STATE_INVALID)"
          - "X-User-ID == audit.club_id (else ERR_CLUB_SCOPE_VIOLATION)"
          - "audit.response_round_count < MAX_AUDIT_RESPONSE_ROUNDS (else ERR_AUDIT_RESPONSE_ROUNDS_EXHAUSTED)"
        side_effects:
          - "sets status = CLUB_RESPONDED, response_round_count += 1, club_response_note"
          - "compliance_score is unaffected: CLUB_RESPONDED remains inside the PRELIMINARY variant's included set"
          - "increments ProtocolAudit.version by 1"
      - from: CLUB_RESPONDED
        to: FINDINGS_ISSUED
        trigger: "POST /concussion-program/protocol-audits/{id}/findings (revised findings)"
        preconditions:
          - "audit.status == CLUB_RESPONDED (else ERR_AUDIT_STATE_INVALID)"
          - "X-User-ID != audit.opened_by_user_id (else ERR_SEGREGATION_OF_DUTIES)"
        side_effects:
          - "CYCLE: replaces violation_codes and exposure_days, RE-STAMPS escalation_tier_at_issuance from the tier band of club_compliance_score PRELIMINARY recomputed with THIS audit excluded (so a CLUB_RESPONDED audit does not price itself), and recomputes assessed_fine_cents"
          - "runs club_posture_propagation"
          - "increments ProtocolAudit.version and Club.version by 1"
      - from: FINDINGS_ISSUED
        to: CLOSED_UPHELD
        trigger: "POST /concussion-program/protocol-audits/{id}/close {disposition: UPHELD}"
        preconditions:
          - "audit.status is FINDINGS_ISSUED or CLUB_RESPONDED (else ERR_AUDIT_STATE_INVALID)"
          - "X-User-ID != audit.findings_issued_by_user_id (else ERR_SEGREGATION_OF_DUTIES)"
        side_effects:
          - "sets status = CLOSED_UPHELD, disposition = UPHELD, closed_at = now, closed_by_user_id = X-User-ID"
          - "runs club_posture_propagation: compliance_score and outstanding_fine_cents are unchanged (CLOSED_UPHELD stays in both included sets) while adjudicated_compliance_score now drops and open_violation_count decreases"
          - "increments ProtocolAudit.version and Club.version by 1"
      - from: CLUB_RESPONDED
        to: CLOSED_DISMISSED
        trigger: "POST /concussion-program/protocol-audits/{id}/close {disposition: DISMISSED}"
        preconditions:
          - "audit.status is OPEN, FINDINGS_ISSUED or CLUB_RESPONDED (else ERR_AUDIT_STATE_INVALID)"
          - "X-User-ID != audit.findings_issued_by_user_id (else ERR_SEGREGATION_OF_DUTIES); the check is skipped when findings_issued_by_user_id is null"
        side_effects:
          - "COMPENSATION: sets status = CLOSED_DISMISSED, disposition = DISMISSED, assessed_fine_cents = 0, closed_at = now"
          - "runs club_posture_propagation: the audit leaves both compliance sets, so compliance_score and outstanding_fine_cents return to their pre-findings values, escalation_tier and status are re-derived, and any case frozen by the sanction is restored to frozen_from_status"
          - "increments ProtocolAudit.version and Club.version by 1"
      - from: FINDINGS_ISSUED
        to: CLOSED_DISMISSED
        trigger: "POST /concussion-program/protocol-audits/{id}/close {disposition: DISMISSED}"
        preconditions:
          - "audit.status is OPEN, FINDINGS_ISSUED or CLUB_RESPONDED (else ERR_AUDIT_STATE_INVALID)"
          - "X-User-ID != audit.findings_issued_by_user_id (else ERR_SEGREGATION_OF_DUTIES)"
        side_effects:
          - "COMPENSATION: identical to the CLUB_RESPONDED -> CLOSED_DISMISSED edge - status = CLOSED_DISMISSED, disposition = DISMISSED, assessed_fine_cents = 0, closed_at = now, closed_by_user_id = X-User-ID"
          - "runs club_posture_propagation: the audit leaves both compliance sets, so compliance_score and outstanding_fine_cents return to their pre-findings values, escalation_tier and Club.status are re-derived, and any case frozen by the sanction is restored to frozen_from_status"
          - "increments ProtocolAudit.version and Club.version by 1"
      - from: CLUB_RESPONDED
        to: CLOSED_UPHELD
        trigger: "POST /concussion-program/protocol-audits/{id}/close {disposition: UPHELD}"
        preconditions:
          - "audit.status is FINDINGS_ISSUED or CLUB_RESPONDED (else ERR_AUDIT_STATE_INVALID)"
          - "X-User-ID != audit.findings_issued_by_user_id (else ERR_SEGREGATION_OF_DUTIES)"
        side_effects:
          - "identical to the FINDINGS_ISSUED -> CLOSED_UPHELD edge: status = CLOSED_UPHELD, disposition = UPHELD, closed_at = now, closed_by_user_id = X-User-ID; the club's response does not change the arithmetic"
          - "runs club_posture_propagation: compliance_score and outstanding_fine_cents are unchanged while adjudicated_compliance_score drops and open_violation_count decreases"
          - "increments ProtocolAudit.version and Club.version by 1"
      - from: OPEN
        to: CLOSED_DISMISSED
        trigger: "POST /concussion-program/protocol-audits/{id}/close {disposition: DISMISSED}"
        preconditions:
          - "audit.status == OPEN and no findings were ever issued"
        side_effects:
          - "sets status = CLOSED_DISMISSED, disposition = DISMISSED, closed_at = now; club figures are unchanged because an OPEN audit never entered the compliance sets (only open_violation_count decreases)"
          - "increments ProtocolAudit.version and Club.version by 1"
      - from: OPEN
        to: CLOSED_UPHELD
        trigger: "POST /concussion-program/protocol-audits/{id}/close {disposition: UPHELD}"
        preconditions:
          - "REJECTED: an audit with no issued findings may not be upheld; returns ERR_AUDIT_STATE_INVALID"
        side_effects: []

  - entity: Club
    state_field: status
    initial_state: ACTIVE
    terminal_states: []
    transitions:
      - from: ACTIVE
        to: PROBATION
        trigger: "club_posture_propagation, invoked by POST /concussion-program/protocol-audits/{id}/findings, POST /concussion-program/protocol-audits/{id}/close or POST /concussion-program/protocol-sweeps"
        preconditions:
          - "recomputed compliance_score is in the closed range 70..89"
        side_effects:
          - "sets status = PROBATION and sets heightened_review_required = true on every non-cleared case of the club"
      - from: ACTIVE
        to: SANCTIONED
        trigger: "club_posture_propagation"
        preconditions:
          - "recomputed compliance_score < 70"
        side_effects:
          - "sets status = SANCTIONED, freezes the club's RTP_IN_PROGRESS and PENDING_INC_CLEARANCE cases into STAGE_FROZEN and sets heightened_review_required = true on them"
      - from: PROBATION
        to: SANCTIONED
        trigger: "club_posture_propagation"
        preconditions:
          - "recomputed compliance_score < 70"
        side_effects:
          - "freezes the club's non-cleared cases as above"
      - from: SANCTIONED
        to: PROBATION
        trigger: "club_posture_propagation after POST /concussion-program/protocol-audits/{id}/close {disposition: DISMISSED}"
        preconditions:
          - "recomputed compliance_score is in the closed range 70..89"
        side_effects:
          - "restores every STAGE_FROZEN case to its frozen_from_status and clears frozen_from_status; heightened_review_required stays true"
      - from: SANCTIONED
        to: ACTIVE
        trigger: "club_posture_propagation after POST /concussion-program/protocol-audits/{id}/close {disposition: DISMISSED}"
        preconditions:
          - "recomputed compliance_score >= 90"
        side_effects:
          - "restores frozen cases and sets heightened_review_required = false on the club's cases"
      - from: PROBATION
        to: ACTIVE
        trigger: "club_posture_propagation after POST /concussion-program/protocol-audits/{id}/close {disposition: DISMISSED}"
        preconditions:
          - "recomputed compliance_score >= 90"
        side_effects:
          - "sets status = ACTIVE and heightened_review_required = false on the club's cases"

  - entity: Clinician
    state_field: status
    initial_state: ACTIVE
    terminal_states: [SUSPENDED]
    transitions:
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /concussion-program/clinicians/{id}/suspend"
        preconditions:
          - "clinician.status == ACTIVE (else ERR_CLINICIAN_SUSPENDED)"
        side_effects:
          - "sets status = SUSPENDED and suspension_reason"
          - "CASCADE: every IncClearance with status PENDING and inc_clinician_id == this clinician becomes SUPERSEDED, and each such clearance's case returns from PENDING_INC_CLEARANCE to RTP_IN_PROGRESS"
          - "increments Clinician.version, and IncClearance.version / ConcussionCase.version for every touched row, by 1"

  - entity: InjuryReportEntry
    state_field: status
    initial_state: FILED
    terminal_states: [AMENDED]
    transitions:
      - from: FILED
        to: AMENDED
        trigger: "POST /concussion-program/injury-report-entries/{id}/amend"
        preconditions:
          - "entry.status is FILED or LATE_FILED (else ERR_RESOURCE_STATE_INVALID)"
          - "logical clock now < game.kickoff_at (else ERR_REPORT_WINDOW_CLOSED)"
          - "the new designation equals the freshly recomputed required_designation (else ERR_INJURY_DESIGNATION_MISMATCH)"
        side_effects:
          - "sets status = AMENDED, amended_at = now, amended_from_designation = the previous designation, designation and required_designation to the new values"
          - "increments InjuryReportEntry.version by 1"
      - from: LATE_FILED
        to: AMENDED
        trigger: "POST /concussion-program/injury-report-entries/{id}/amend"
        preconditions:
          - "same as FILED -> AMENDED"
        side_effects:
          - "same as FILED -> AMENDED; the late-filing audit already opened at filing time is NOT withdrawn"

# =============================================================================
# §1.2.1 Concurrency Rules (optimistic concurrency control only)
# =============================================================================
concurrency_rules:
  - rule_id: baseline-create-supersedes-prior
    parent_entity: Player
    child_entity: BaselineTest
    write_endpoint: "POST /concussion-program/baseline-tests"
    occ_field: expected_player_version
    error_id: ERR_STALE_PLAYER_VERSION
    http_status: 412
    rationale: |
      Filing a baseline test supersedes the player's previous VALID test and rewrites
      Player.baseline_status, so the caller must prove it read the player's current
      version. A caller holding an out-of-date Player.version - for example one that
      was read before a diagnosis flipped baseline_status to RETEST_REQUIRED - is
      refused with ERR_STALE_PLAYER_VERSION (412) and must re-read the player.
    version_side_effect: "a successful POST increments Player.version by 1"

  - rule_id: inc-clearance-create-supersedes-pending
    parent_entity: ConcussionCase
    child_entity: IncClearance
    write_endpoint: "POST /concussion-program/concussion-cases/{id}/inc-clearances"
    occ_field: expected_case_version
    error_id: ERR_STALE_CASE_VERSION
    http_status: 412
    rationale: |
      Requesting final consultant clearance supersedes any PENDING clearance and moves
      the case into PENDING_INC_CLEARANCE, so it must be issued against the case state
      the requester actually inspected. Any earlier write to the case - a stage pass, a
      revocation, a club-posture freeze - has already advanced ConcussionCase.version, so
      a stale expected_case_version is refused with ERR_STALE_CASE_VERSION (412).
    version_side_effect: "a successful POST increments ConcussionCase.version by 1"

# =============================================================================
# §1.3 Calculation Rules
# All money is whole cents. All rounding is round_half_up unless stated.
# "now" always means the logical clock value.
# =============================================================================
constants:
  SYMPTOM_RECURRENCE_THRESHOLD: 4            # symptom_score >= 4 is a recurrence; <= 3 may pass a stage
  MIN_LOCKER_ROOM_EXAM_MINUTES: 8
  INC_EXAM_BLOCK_MINUTES: 30
  MANDATORY_EVAL_DEADLINE_MINUTES: 15        # mandatory_removal == true
  DISCRETIONARY_EVAL_DEADLINE_MINUTES: 45    # mandatory_removal == false
  BASELINE_VALIDITY_DAYS: 365
  NO_BASELINE_PENALTY_POINTS: 15
  SEVERITY_BASE_POINTS: 40
  SEVERITY_SYMPTOM_POINTS_PER_UNIT: 3
  SEVERITY_SYMPTOM_CAP: 30
  SEVERITY_RECURRENCE_POINTS_PER_UNIT: 12
  SEVERITY_RECURRENCE_CAP: 24
  SEVERITY_BASELINE_MULTIPLIER: 1.5
  SEVERITY_BASELINE_CAP: 15
  SEVERITY_PRIOR_CASE_POINTS: 10
  SEVERITY_HIGH_THRESHOLD: 70                # severity_index >= 70 is a high-severity case
  BASE_RTP_HOURS: 168
  SEVERITY_SURCHARGE_HOURS: 72
  POST_STAGE5_REST_HOURS: 24
  RECURRENCE_PENALTY_HOURS: 48
  STAGE_MIN_HOURS: { 1: 24, 2: 24, 3: 24, 4: 48, 5: 48 }     # dwell before a stage may be evaluated
  STAGE_REST_HOURS: { 2: 24, 3: 24, 4: 24, 5: 48 }           # rest after the previous stage passed, before the next may start
  INC_CLEARANCE_VALIDITY_HOURS: 168
  PROLONGED_SYMPTOM_DAYS: 21
  POST_CLEARANCE_QUESTIONABLE_HOURS: 72
  REPORT_WINDOW_OPEN_HOURS_BEFORE_KICKOFF: 96
  REPORT_WINDOW_LATE_MINUTES_BEFORE_KICKOFF: 90
  MAX_AUDIT_RESPONSE_ROUNDS: 2
  SEASON_FINE_CAP_CENTS: 150000000
  OFFSEASON_START_AT: "for season_year Y, (Y+1)-02-15T00:00:00Z"
  VIOLATION_CODE_CANONICAL_ORDER:
    - UNAUTHORIZED_SAME_GAME_RETURN
    - MISSING_INC_CLEARANCE
    - MISSED_MANDATORY_REMOVAL
    - EVALUATION_DEADLINE_BREACH
    - INCOMPLETE_LOCKER_ROOM_EXAM
    - BASELINE_TEST_MISSING
    - LATE_INJURY_REPORT
  VIOLATION_WEIGHT:
    UNAUTHORIZED_SAME_GAME_RETURN: 25
    MISSING_INC_CLEARANCE: 20
    MISSED_MANDATORY_REMOVAL: 18
    EVALUATION_DEADLINE_BREACH: 15
    INCOMPLETE_LOCKER_ROOM_EXAM: 12
    BASELINE_TEST_MISSING: 8
    LATE_INJURY_REPORT: 6
  VIOLATION_BASE_CENTS:
    UNAUTHORIZED_SAME_GAME_RETURN: 25000000
    MISSING_INC_CLEARANCE: 20000000
    MISSED_MANDATORY_REMOVAL: 15000000
    EVALUATION_DEADLINE_BREACH: 5000000
    INCOMPLETE_LOCKER_ROOM_EXAM: 7500000
    BASELINE_TEST_MISSING: 2500000
    LATE_INJURY_REPORT: 1500000
  ESCALATION_TIER_MULTIPLIER: { TIER_0: 1.00, TIER_1: 1.50, TIER_2: 2.00, TIER_3: 3.00 }
  ESCALATION_TIER_BANDS: "TIER_0: compliance_score >= 90; TIER_1: 75..89; TIER_2: 60..74; TIER_3: < 60"
  CLUB_POSTURE_BANDS: "ACTIVE: compliance_score >= 90; PROBATION: 70..89; SANCTIONED: < 70"

calculations:

  - name: case_severity_index
    entity: ConcussionCase
    algorithm: weighted_scoring
    trigger: "recomputed at diagnosis (POST /concussion-program/sideline-evaluations/{id}/diagnose-concussion) and on every recurrence (POST /concussion-program/return-steps/{id}/evaluate {outcome: SYMPTOM_RECURRENCE}, POST /concussion-program/concussion-cases/{id}/symptom-check with symptom_score >= 4)"
    formula: |
      baseline_deviation_points =
          0                                                        when the player had no BaselineTest with status VALID at diagnosis
          max(0, latest_valid_baseline.composite_score - diagnosis_composite_score)   otherwise
      baseline_component =
          NO_BASELINE_PENALTY_POINTS (15)                           when the player had no VALID baseline at diagnosis
          min(15, round_half_up(1.5 * baseline_deviation_points))   otherwise
      symptom_component    = min(30, 3 * initial_symptom_score)
      recurrence_component = min(24, 12 * recurrence_count)
      history_component    = 10 when prior_case_id is not null, else 0
      raw = 40 + symptom_component + recurrence_component + baseline_component + history_component
      severity_index = min(100, max(0, raw))
    input_set: "the case's own stamped fields plus the player's latest VALID BaselineTest as of diagnosis_at (the baseline snapshot is never re-read afterwards)"
    precision: "integer points; the only rounding is round_half_up inside baseline_component, applied BEFORE the min(15, ...) cap"
    worked_example: |
      Canonical case: latest VALID baseline composite_score = 88, diagnosis_composite_score = 70,
      initial_symptom_score = 9, recurrence_count = 0, prior_case_id = null.
        baseline_deviation_points = 88 - 70 = 18
        baseline_component        = min(15, round_half_up(1.5 * 18) = 27) = 15
        symptom_component         = min(30, 27) = 27
        raw = 40 + 27 + 0 + 15 + 0 = 82  ->  severity_index = 82   (>= 70, so high severity)
      After one recurrence: recurrence_component = min(24, 12) = 12 -> severity_index = 94.
      After two recurrences: 40 + 27 + 24 + 15 + 0 = 106 -> capped to 100.
      Low-severity contrast: baseline 88, diagnosis composite 86, symptom 9, no prior case
        -> deviation 2, baseline_component = min(15, 3) = 3, raw = 40 + 27 + 3 = 70 (exactly at the
        high-severity threshold). With symptom 8 instead: 40 + 24 + 3 = 67 (below the threshold).

  - name: case_return_readiness_timeline
    entity: ConcussionCase
    algorithm: threshold
    trigger: "PROVISIONAL_PROJECTION at diagnosis; FINAL_ACCRUED when a stage-5 ReturnStep passes"
    variants:
      - variant: PROVISIONAL_PROJECTION
        target_field: projected_return_at
        applies_when: "stamped once at diagnosis; never revised, not even by recurrences"
        formula: |
          projected_return_at = diagnosis_at
                              + BASE_RTP_HOURS (168h)
                              + (SEVERITY_SURCHARGE_HOURS (72h) when severity_index >= 70 else 0h)
      - variant: FINAL_ACCRUED
        target_field: earliest_return_at
        applies_when: "computed when the stage-5 ReturnStep passes; reset to null whenever that stage-5 pass is revoked or a recurrence is recorded"
        formula: |
          earliest_return_at = stage5_step.evaluated_at
                             + POST_STAGE5_REST_HOURS (24h)
                             + RECURRENCE_PENALTY_HOURS (48h) * case.recurrence_count
    input_set: "PROVISIONAL uses only diagnosis-time fields; FINAL uses the passing stage-5 step's evaluated_at and the case's recurrence_count as of that pass"
    precision: "millisecond-exact ISO-8601 UTC; no rounding to day boundaries"
    divergence_note: |
      The two variants deliberately disagree. For the canonical fixture
      (diagnosis_at = 2026-09-13T18:19:00Z, severity_index = 82) the provisional projection is
      2026-09-23T18:19:00.000Z, while the accrued value after a clean five-stage progression whose
      stage-5 step is signed off at 2026-09-27T12:00:00Z is 2026-09-28T12:00:00.000Z - four days
      and 17h41m later. return-to-contact is gated on earliest_return_at ONLY; projected_return_at is
      a publication figure and never gates anything.

  - name: club_compliance_score
    entity: Club
    algorithm: aggregation
    trigger: "club_posture_propagation, run by POST /concussion-program/protocol-audits/{id}/findings, POST /concussion-program/protocol-audits/{id}/close and POST /concussion-program/protocol-sweeps"
    variants:
      - variant: PRELIMINARY
        target_field: compliance_score
        applies_when: "always; this is the variant that drives escalation_tier, status and case freezing"
        formula: |
          included = the club's ProtocolAudits with status in {FINDINGS_ISSUED, CLUB_RESPONDED, CLOSED_UPHELD}
          compliance_score = max(0, 100 - sum over included audits of
                                          sum over audit.violation_codes of VIOLATION_WEIGHT[code])
      - variant: ADJUDICATED
        target_field: adjudicated_compliance_score
        applies_when: "always; a publication figure that lags the preliminary score until audits close"
        formula: |
          included = the club's ProtocolAudits with status == CLOSED_UPHELD only
          adjudicated_compliance_score = max(0, 100 - sum over included audits of
                                          sum over audit.violation_codes of VIOLATION_WEIGHT[code])
    input_set: "audits in the included status set only; OPEN and CLOSED_DISMISSED audits are excluded from both variants; a duplicated code inside one audit counts once per occurrence in the array"
    precision: "integer points, floored at 0"
    divergence_note: |
      One audit carrying [MISSED_MANDATORY_REMOVAL] (weight 18) at status FINDINGS_ISSUED gives
      compliance_score 82 and adjudicated_compliance_score 100. Closing it UPHELD leaves
      compliance_score 82 and pulls adjudicated_compliance_score down to 82. Closing it DISMISSED
      instead restores compliance_score to 100 and leaves adjudicated_compliance_score at 100.

  - name: audit_fine_amount_cents
    entity: ProtocolAudit
    algorithm: tiered_pricing
    trigger: "POST /concussion-program/protocol-audits/{id}/findings (including the CLUB_RESPONDED -> FINDINGS_ISSUED revision cycle) and the auto-issued findings created by POST /concussion-program/protocol-sweeps or a late injury-report filing"
    formula: |
      exposure_factor = (7 + audit.exposure_days) / 7            # exact rational, NOT pre-rounded
      severity_factor = 1.15 when audit.case_id is not null AND that case's severity_index >= 70
                        1.00 otherwise
      for each code in VIOLATION_CODE_CANONICAL_ORDER that appears in audit.violation_codes:
          line_cents[code] = round_half_up(VIOLATION_BASE_CENTS[code] * exposure_factor * severity_factor)
      gross_cents = sum of line_cents                            # ROUND PER LINE, THEN SUM
      assessed_fine_cents = round_half_up(gross_cents * ESCALATION_TIER_MULTIPLIER[audit.escalation_tier_at_issuance])
    input_set: "only the codes present on this audit; codes are processed in VIOLATION_CODE_CANONICAL_ORDER regardless of request order, and the tier multiplier is the one STAMPED on the audit, never the club's live tier"
    precision: |
      Whole cents, round_half_up, applied TWICE and in this order: once per violation line, then once
      after the escalation multiplier. Summing the unrounded line values and rounding once at the end
      is WRONG and is detectably different (see worked_example).
    worked_example: |
      (A) violation_codes = [UNAUTHORIZED_SAME_GAME_RETURN, MISSING_INC_CLEARANCE], exposure_days = 2,
          linked case severity_index = 82, escalation_tier_at_issuance = TIER_0.
            exposure_factor = 9/7,  severity_factor = 1.15
            line UNAUTHORIZED_SAME_GAME_RETURN = round_half_up(25000000 * 9/7 * 1.15)
                                              = round_half_up(36964285.714...) = 36964286
            line MISSING_INC_CLEARANCE         = round_half_up(20000000 * 9/7 * 1.15)
                                              = round_half_up(29571428.571...) = 29571429
            gross_cents = 66535715
            assessed_fine_cents = round_half_up(66535715 * 1.00) = 66535715
          Rounding once at the end instead would give 66535714 - one cent lower.
      (B) violation_codes = [MISSED_MANDATORY_REMOVAL], exposure_days = 2, linked case severity 82,
          escalation_tier_at_issuance = TIER_1 (club score was 85 when the findings were stamped).
            line = round_half_up(15000000 * 9/7 * 1.15) = round_half_up(22178571.428...) = 22178571
            gross_cents = 22178571
            assessed_fine_cents = round_half_up(22178571 * 1.50) = round_half_up(33267856.5) = 33267857
          Using the club's POST-transaction tier (TIER_2, because the score falls to 67) would give
          44357142 - wrong by more than 11 million cents.
      (C) violation_codes = [EVALUATION_DEADLINE_BREACH], exposure_days = 0, audit.case_id = null,
          escalation_tier_at_issuance = TIER_0.
            exposure_factor = 1, severity_factor = 1.00, line = 5000000, assessed = 5000000

  - name: club_posture_propagation
    entity: Club
    algorithm: constraint_propagation
    trigger: "POST /concussion-program/protocol-audits/{id}/findings, POST /concussion-program/protocol-audits/{id}/respond, POST /concussion-program/protocol-audits/{id}/close, POST /concussion-program/protocol-sweeps, and the auto-audit paths"
    formula: |
      STEP ORDER IS PINNED AND MUST NOT BE REORDERED:
      1. compliance_score              = club_compliance_score PRELIMINARY variant
      2. adjudicated_compliance_score  = club_compliance_score ADJUDICATED variant
      3. outstanding_fine_cents        = sum of assessed_fine_cents over the club's audits whose status
                                         is in {FINDINGS_ISSUED, CLUB_RESPONDED, CLOSED_UPHELD}
      4. open_violation_count          = count of the club's audits whose status is in
                                         {OPEN, FINDINGS_ISSUED, CLUB_RESPONDED}
      5. escalation_tier               = TIER_0 when compliance_score >= 90
                                         TIER_1 when 75 <= compliance_score <= 89
                                         TIER_2 when 60 <= compliance_score <= 74
                                         TIER_3 when compliance_score < 60
      6. status                        = ACTIVE     when compliance_score >= 90
                                         PROBATION  when 70 <= compliance_score <= 89
                                         SANCTIONED when compliance_score < 70
      7. case propagation over the club's ConcussionCases in created_at ASC order:
           a. when status == SANCTIONED and case_status in {RTP_IN_PROGRESS, PENDING_INC_CLEARANCE}:
              frozen_from_status = case_status; case_status = STAGE_FROZEN
           b. when status != SANCTIONED and case_status == STAGE_FROZEN:
              case_status = frozen_from_status; frozen_from_status = null
           c. heightened_review_required = (status in {PROBATION, SANCTIONED}) for every case whose
              case_status != CLEARED_FOR_CONTACT
      The escalation_tier used to price an audit is read in step 0 of the findings transition, BEFORE
      step 1 of this routine runs. The routine reaches a fixed point in one pass: no step in 1..7
      changes an input of an earlier step.
    input_set: "all ProtocolAudit rows of the club and all ConcussionCase rows of the club"
    precision: "integer points and whole cents; bands are closed intervals exactly as written"
    worked_example: |
      Club with no audits: compliance_score 100, adjudicated 100, TIER_0, ACTIVE, outstanding 0.
      Auto-audit for EVALUATION_DEADLINE_BREACH issued (weight 15, fine 5000000):
        compliance_score 85, adjudicated 100, TIER_1, PROBATION, outstanding_fine_cents 5000000,
        open_violation_count 1, every non-cleared case gains heightened_review_required = true.
      A second audit carrying [UNAUTHORIZED_SAME_GAME_RETURN, MISSING_INC_CLEARANCE] (weights 25 + 20)
      is then issued: compliance_score 85 - 45 = 40, TIER_3, SANCTIONED, and every RTP_IN_PROGRESS or
      PENDING_INC_CLEARANCE case of the club is frozen with frozen_from_status recorded.
      Closing that second audit DISMISSED restores compliance_score to 85, TIER_1, PROBATION,
      outstanding_fine_cents back to 5000000, and unfreezes each case to its frozen_from_status.

  - name: baseline_status_resolution
    entity: Player
    algorithm: projection
    trigger: "POST /concussion-program/baseline-tests, POST /concussion-program/baseline-tests/{id}/invalidate, POST /concussion-program/sideline-evaluations/{id}/diagnose-concussion, POST /concussion-program/protocol-sweeps"
    formula: |
      candidates = the player's BaselineTests with status == VALID
      when candidates is empty                      -> baseline_status = NONE
      latest = candidate with the greatest administered_at, tie-break created_at DESC
      when latest.retest_required_reason != NONE     -> baseline_status = RETEST_REQUIRED
      otherwise                                      -> baseline_status = VALID
    input_set: "only BaselineTests with status VALID; SUPERSEDED, INVALIDATED and EXPIRED rows are ignored entirely"
    precision: "not applicable - enum resolution"
    worked_example: |
      Pre-season test filed 2026-08-01 -> VALID. Diagnosis on 2026-09-13 stamps that row with
      retest_required_reason = NEW_DIAGNOSIS -> baseline_status = RETEST_REQUIRED, which blocks
      return-to-contact with ERR_BASELINE_RETEST_REQUIRED. A fresh test filed during stage 4 supersedes
      the old row (status SUPERSEDED) and carries retest_required_reason = NONE -> baseline_status = VALID.

  - name: public_designation_resolution
    entity: Player
    algorithm: threshold
    trigger: "recomputed on every write that touches the player's cases, and stamped as InjuryReportEntry.required_designation at filing and amendment time"
    formula: |
      FIRST MATCH WINS, in exactly this order:
      1. OUT         when the player has any ConcussionCase with case_status in
                     {MANDATORY_REMOVAL, RTP_IN_PROGRESS, PENDING_INC_CLEARANCE, STAGE_FROZEN},
                     or any case with monitoring_status == PROLONGED_SYMPTOM_WATCH
      2. DOUBTFUL    when the player's most recent case (greatest diagnosis_at) is CLEARED_FOR_CONTACT,
                     now < cleared_for_contact_at + POST_CLEARANCE_QUESTIONABLE_HOURS (72h),
                     and that case's recurrence_count >= 1
      3. QUESTIONABLE when the same window applies and that case's recurrence_count == 0
      4. NONE        otherwise
    input_set: "all of the player's ConcussionCases; SidelineEvaluations never affect the designation"
    precision: "not applicable - enum precedence"
    worked_example: |
      Case diagnosed and open -> OUT. Cleared at 2026-09-28T12:00:00Z with recurrence_count 0:
      at 2026-09-30T00:00:00Z -> QUESTIONABLE; at 2026-10-01T12:00:00Z (exactly 72h) -> NONE
      (the window is half-open). Same clearance with recurrence_count 2 -> DOUBTFUL inside the window.

  - name: rtp_stage_gating_windows
    entity: ConcussionCase
    algorithm: interval_merge
    trigger: "POST /concussion-program/concussion-cases/{id}/return-steps (rest buffer) and POST /concussion-program/return-steps/{id}/evaluate (dwell)"
    formula: |
      REST BUFFER (half-open, trailing buffer, adjacency ALLOWED):
        for stage_index s >= 2, let prev = the case's PASSED step with stage_index s-1
        min_start_at = prev.evaluated_at + STAGE_REST_HOURS[s]
        the new step is REJECTED when now < min_start_at (ERR_STAGE_REST_BUFFER_VIOLATION);
        starting at exactly min_start_at is ACCEPTED, i.e. the forbidden window is the half-open
        interval [prev.evaluated_at, min_start_at)
        for stage_index 1 there is no rest buffer; min_start_at = case.diagnosis_at
      DWELL (half-open, adjacency ALLOWED):
        dwell_complete_at = step.started_at + STAGE_MIN_HOURS[step.stage_index]
        a PASS is REJECTED when now < dwell_complete_at (ERR_STAGE_DWELL_NOT_MET); a PASS at exactly
        dwell_complete_at is ACCEPTED. A SYMPTOM_RECURRENCE outcome ignores the dwell entirely.
    input_set: "the case's PASSED non-REVOKED steps only; FAILED or REVOKED steps never supply a rest anchor"
    precision: "second-exact comparisons; both boundaries use >= (inclusive at the boundary instant)"
    worked_example: |
      Stage 4 passes at 2026-09-23T12:00:00Z. STAGE_REST_HOURS[5] = 48 so
      min_start_at = 2026-09-25T12:00:00Z. A stage-5 start at 2026-09-25T11:59:59Z is refused with
      ERR_STAGE_REST_BUFFER_VIOLATION; a start at exactly 2026-09-25T12:00:00Z is accepted.
      That step's dwell_complete_at = 2026-09-27T12:00:00Z (STAGE_MIN_HOURS[5] = 48); a PASS at
      2026-09-27T11:59:59Z is refused with ERR_STAGE_DWELL_NOT_MET, a PASS at 2026-09-27T12:00:00Z passes.

  - name: inc_exam_block_conflict
    entity: Clinician
    algorithm: interval_merge
    trigger: "POST /concussion-program/sideline-evaluations/{id}/locker-room-exam"
    formula: |
      requested block  = [now, now + INC_EXAM_BLOCK_MINUTES (30min)]                 CLOSED interval
      existing blocks  = for every SidelineEvaluation whose inc_clinician_id is the requested
                         consultant and whose status is in {LOCKER_ROOM_EXAM, DIAGNOSED,
                         NO_CONCUSSION_CLEARED, HELD_OUT_INCONCLUSIVE}:
                         [exam_started_at, inc_block_ends_at]                        CLOSED interval
      the request is REJECTED with ERR_INC_EXAM_WINDOW_CONFLICT when the requested block intersects any
      existing block in AT LEAST ONE INSTANT - touching endpoints DO collide, which is the opposite of
      the half-open rest-buffer rule in rtp_stage_gating_windows
    input_set: "only evaluations that actually reached the locker room; INITIATED, SCREENED, CLEARED_ON_FIELD and PROTOCOL_BREACH evaluations hold no block"
    precision: "second-exact; closed-closed intersection"
    worked_example: |
      Consultant starts an exam at 2026-09-13T18:10:00Z, so the block is
      [18:10:00, 18:40:00]. A second exam requested at exactly 2026-09-13T18:40:00Z is REFUSED
      (the closed intervals share the instant 18:40:00). A request at 2026-09-13T18:40:01Z is accepted.

  - name: prolonged_symptom_monitoring
    entity: ConcussionCase
    algorithm: threshold
    trigger: "POST /concussion-program/protocol-sweeps and every recurrence write"
    formula: |
      days_since_diagnosis = floor((now - diagnosis_at) / 24h)
      the sweep moves monitoring_status ACTIVE_SYMPTOM_WATCH -> PROLONGED_SYMPTOM_WATCH when
        days_since_diagnosis >= PROLONGED_SYMPTOM_DAYS (21) AND case_status != CLEARED_FOR_CONTACT
      a recurrence write moves it to PROLONGED_SYMPTOM_WATCH when the new recurrence_count >= 2,
        regardless of elapsed days
      the sweep moves any of {ACTIVE_SYMPTOM_WATCH, PROLONGED_SYMPTOM_WATCH} -> OFFSEASON_MONITORING
        when now >= OFFSEASON_START_AT for the case's season_year, which takes precedence over the
        21-day rule in the same sweep
    input_set: "the case's own diagnosis_at, case_status, recurrence_count and season_year"
    precision: "integer days by floor; the comparison is >= so day 21 exactly qualifies"
    worked_example: |
      diagnosis_at = 2026-09-13T18:19:00Z. At 2026-10-04T18:18:59Z days_since_diagnosis = 20 and the
      sweep leaves the case in ACTIVE_SYMPTOM_WATCH. At 2026-10-04T18:19:00Z it is exactly 21 and the
      sweep flips it to PROLONGED_SYMPTOM_WATCH, which also drives the player to OUT.

  - name: exemption_slot_ledger
    entity: Club
    algorithm: aggregation
    trigger: "POST /concussion-program/concussion-cases/{id}/roster-exemption and POST /concussion-program/concussion-cases/{id}/return-to-contact"
    formula: |
      exemption_slots_used      = count of the club's ConcussionCases with roster_exemption_status == GRANTED
      exemption_slots_available = exemption_slots_total - exemption_slots_used
      INVARIANT: exemption_slots_used + exemption_slots_available == exemption_slots_total at every
      observable instant, and 0 <= exemption_slots_used <= exemption_slots_total
    input_set: "GRANTED cases only; NONE and RELEASED cases hold no slot"
    precision: "integers; a grant that would drive exemption_slots_available below 0 is refused with ERR_NO_EXEMPTION_SLOTS instead of being clamped"
    worked_example: |
      exemption_slots_total = 1. Granting an exemption to case A gives used 1 / available 0; a grant
      for case B is refused with ERR_NO_EXEMPTION_SLOTS. Case A reaching CLEARED_FOR_CONTACT releases
      the slot (used 0 / available 1) and the grant for case B then succeeds.

  - name: injury_report_window_classification
    entity: InjuryReportEntry
    algorithm: chronological
    trigger: "POST /concussion-program/injury-report-entries"
    formula: |
      report_window_opens_at  = game.kickoff_at - 96h
      report_window_closes_at = game.kickoff_at - 90min
      now < report_window_opens_at                      -> REJECT with ERR_REPORT_WINDOW_NOT_OPEN
      report_window_opens_at <= now < report_window_closes_at -> status = FILED
      report_window_closes_at <= now < game.kickoff_at   -> status = LATE_FILED and the system opens an
            auto ProtocolAudit (auto_opened = true, violation_codes = [LATE_INJURY_REPORT],
            exposure_days = 0, case_id = null) and advances it straight to FINDINGS_ISSUED, then runs
            club_posture_propagation
      now >= game.kickoff_at                             -> REJECT with ERR_REPORT_WINDOW_CLOSED
    input_set: "the game's kickoff_at and the logical clock only"
    precision: "second-exact; both interior boundaries are inclusive on the left, exclusive on the right"
    worked_example: |
      kickoff_at = 2026-09-13T17:00:00Z -> opens 2026-09-09T17:00:00Z, late from 2026-09-13T15:30:00Z.
      Filing at 2026-09-09T16:59:59Z -> ERR_REPORT_WINDOW_NOT_OPEN.
      Filing at exactly 2026-09-09T17:00:00Z -> FILED.
      Filing at exactly 2026-09-13T15:30:00Z -> LATE_FILED plus a LATE_INJURY_REPORT audit
        (fine 1500000 at TIER_0, compliance_score 100 -> 94, club stays ACTIVE).
      Filing at 2026-09-13T17:00:00Z -> ERR_REPORT_WINDOW_CLOSED.

# =============================================================================
# §1.4 Ordered Validation Table
# Lower priority number = checked first. When two rules are violated by the same
# request, the lower-priority-number error is the one returned.
# =============================================================================
validations:

  - { priority: 1,  category: auth,        rule: "X-User-Role and X-User-ID headers are present and X-User-Role is one of the six §1.7 roles", error_id: ERR_UNAUTHENTICATED, http_status: 401, applies_to: "every endpoint" }
  - { priority: 2,  category: auth,        rule: "the acting role appears in the endpoint's roles list", error_id: ERR_UNAUTHORIZED, http_status: 403, applies_to: "every endpoint" }
  - { priority: 3,  category: business_constraint, rule: "request body and query schema: required fields present, JSON types correct, enum members valid, integers inside their declared ranges (symptom_score 0..20, composite_score 0..100, reaction_time_ms 200..1500, stage_index 1..5, exposure_days 0..30, jersey_number 0..99, week_index 1..18, exemption_slots_total 1..5, limit 1..100, offset >= 0), violation_codes non-empty on findings, Clinician.club_id present iff affiliation == CLUB_AFFILIATED, Game.home_club_id != away_club_id", error_id: ERR_INVALID_REQUEST, http_status: 400, applies_to: "every endpoint" }
  - { priority: 4,  category: existence,   rule: "the path id resolves to an existing Club", error_id: ERR_CLUB_NOT_FOUND, http_status: 404, applies_to: "GET /clubs/{id}, GET /clubs/{id}/players, GET /clubs/{id}/compliance-summary" }
  - { priority: 4,  category: existence,   rule: "the path id resolves to an existing Clinician", error_id: ERR_CLINICIAN_NOT_FOUND, http_status: 404, applies_to: "GET /clinicians/{id}, POST /clinicians/{id}/suspend" }
  - { priority: 4,  category: existence,   rule: "the path id resolves to an existing Player", error_id: ERR_PLAYER_NOT_FOUND, http_status: 404, applies_to: "GET /players/{id}" }
  - { priority: 4,  category: existence,   rule: "the path id resolves to an existing Game", error_id: ERR_GAME_NOT_FOUND, http_status: 404, applies_to: "GET /games/{id}, POST /games/{id}/advance-status" }
  - { priority: 4,  category: existence,   rule: "the path id resolves to an existing SidelineEvaluation", error_id: ERR_EVALUATION_NOT_FOUND, http_status: 404, applies_to: "GET /sideline-evaluations/{id} and all five evaluation action endpoints" }
  - { priority: 4,  category: existence,   rule: "the path id resolves to an existing ConcussionCase", error_id: ERR_CASE_NOT_FOUND, http_status: 404, applies_to: "GET /concussion-cases/{id} and all four case action endpoints" }
  - { priority: 4,  category: existence,   rule: "the path id resolves to an existing BaselineTest, ReturnStep, IncClearance, ProtocolAudit or InjuryReportEntry", error_id: ERR_RESOURCE_NOT_FOUND, http_status: 404, applies_to: "the single-resource GETs and action endpoints of those five entities" }
  - { priority: 5,  category: existence,   rule: "every FK supplied in the request body resolves to an existing row (club_id, player_id, game_id, inc_clinician_id, case_id, sideline_evaluation_id)", error_id: "the matching NOT_FOUND error for the referenced entity (ERR_CLUB_NOT_FOUND, ERR_PLAYER_NOT_FOUND, ERR_GAME_NOT_FOUND, ERR_CLINICIAN_NOT_FOUND, ERR_CASE_NOT_FOUND, ERR_EVALUATION_NOT_FOUND)", http_status: 404, applies_to: "POST /clinicians, POST /players, POST /games, POST /baseline-tests, POST /sideline-evaluations, POST /concussion-cases/{id}/inc-clearances, POST /injury-report-entries, POST /protocol-audits" }
  - { priority: 6,  category: auth,        rule: "for the three Clinician-backed roles, X-User-ID must be an existing Clinician whose affiliation matches the header role (ClubPhysician<->CLUB_AFFILIATED, UnaffiliatedObserver<->UNAFFILIATED_OBSERVER, IndependentConsultant<->INDEPENDENT_CONSULTANT)", error_id: ERR_ROLE_IDENTITY_MISMATCH, http_status: 403, applies_to: "every endpoint whose roles include ClubPhysician, UnaffiliatedObserver or IndependentConsultant" }
  - { priority: 7,  category: auth,        rule: "for ClubComplianceOfficer, X-User-ID must equal the club_id of the target resource (audit.club_id, case.club_id, player.club_id)", error_id: ERR_CLUB_SCOPE_VIOLATION, http_status: 403, applies_to: "POST /players, POST /concussion-cases/{id}/roster-exemption, POST /protocol-audits/{id}/respond, POST /injury-report-entries, POST /injury-report-entries/{id}/amend" }
  - { priority: 8,  category: auth,        rule: "for ClubPhysician, the acting clinician's club_id must equal the club of the player or case being acted on", error_id: ERR_CLUB_SCOPE_VIOLATION, http_status: 403, applies_to: "POST /baseline-tests, POST /sideline-evaluations, all five evaluation action endpoints, POST /concussion-cases/{id}/return-steps, POST /return-steps/{id}/evaluate, POST /concussion-cases/{id}/inc-clearances, POST /concussion-cases/{id}/return-to-contact, POST /concussion-cases/{id}/symptom-check" }
  - { priority: 9,  category: state,       rule: "the acting clinician's status is ACTIVE", error_id: ERR_CLINICIAN_SUSPENDED, http_status: 409, applies_to: "every clinician-role write endpoint; also applies to the referenced inc_clinician_id on POST /sideline-evaluations/{id}/locker-room-exam and POST /concussion-cases/{id}/inc-clearances" }
  - { priority: 10, category: state,       rule: "the Game is in a permitted status", error_id: ERR_RESOURCE_STATE_INVALID, http_status: 409, applies_to: "POST /games/{id}/advance-status" }
  - { priority: 10, category: state,       rule: "the BaselineTest is VALID, or the InjuryReportEntry is FILED or LATE_FILED", error_id: ERR_RESOURCE_STATE_INVALID, http_status: 409, applies_to: "POST /baseline-tests/{id}/invalidate, POST /injury-report-entries/{id}/amend" }
  - { priority: 10, category: state,       rule: "the SidelineEvaluation is in a from-state permitted by the requested transition", error_id: ERR_EVALUATION_STATE_INVALID, http_status: 409, applies_to: "POST /sideline-evaluations/{id}/screen, .../locker-room-exam, .../diagnose-concussion, .../conclude-no-concussion, .../clear-to-return" }
  - { priority: 10, category: state,       rule: "the ConcussionCase case_status is a permitted from-state for the requested transition (return-steps: MANDATORY_REMOVAL, RTP_IN_PROGRESS; inc-clearances: MANDATORY_REMOVAL, RTP_IN_PROGRESS; return-to-contact: PENDING_INC_CLEARANCE; roster-exemption: MANDATORY_REMOVAL, RTP_IN_PROGRESS, PENDING_INC_CLEARANCE, STAGE_FROZEN; symptom-check: any status, including CLEARED_FOR_CONTACT, because post-clearance and off-season monitoring writes are deliberately permitted on a cleared case). STAGE_FROZEN is deliberately NOT rejected here for return-steps and inc-clearances so the dedicated priority-11 rule reports ERR_CASE_STAGE_FROZEN, and a MANDATORY_REMOVAL case requesting inc-clearances is deliberately deferred to the priority-34 empty-collection rule", error_id: ERR_CASE_STATE_INVALID, http_status: 409, applies_to: "POST /concussion-cases/{id}/return-steps, .../inc-clearances, .../return-to-contact, .../roster-exemption, .../symptom-check" }
  - { priority: 10, category: state,       rule: "the ReturnStep status is IN_PROGRESS", error_id: ERR_STEP_STATE_INVALID, http_status: 409, applies_to: "POST /return-steps/{id}/evaluate" }
  - { priority: 10, category: state,       rule: "the IncClearance status is PENDING", error_id: ERR_CLEARANCE_STATE_INVALID, http_status: 409, applies_to: "POST /inc-clearances/{id}/decide" }
  - { priority: 10, category: state,       rule: "the ProtocolAudit status is a permitted from-state (OPEN or CLUB_RESPONDED for findings; FINDINGS_ISSUED for respond; OPEN, FINDINGS_ISSUED or CLUB_RESPONDED for close, and UPHELD requires findings to exist)", error_id: ERR_AUDIT_STATE_INVALID, http_status: 409, applies_to: "POST /protocol-audits/{id}/findings, .../respond, .../close" }
  - { priority: 11, category: state,       rule: "the owning ConcussionCase must not be STAGE_FROZEN, and the owning club must not be SANCTIONED", error_id: ERR_CASE_STAGE_FROZEN, http_status: 409, applies_to: "POST /concussion-cases/{id}/return-steps, POST /return-steps/{id}/evaluate, POST /concussion-cases/{id}/inc-clearances, POST /concussion-cases/{id}/return-to-contact" }
  - { priority: 12, category: state,       rule: "expected_player_version equals the current Player.version", error_id: ERR_STALE_PLAYER_VERSION, http_status: 412, applies_to: "POST /baseline-tests" }
  - { priority: 12, category: state,       rule: "expected_case_version equals the current ConcussionCase.version", error_id: ERR_STALE_CASE_VERSION, http_status: 412, applies_to: "POST /concussion-cases/{id}/inc-clearances" }
  - { priority: 13, category: business_safety, rule: "an evaluation with mandatory_removal == true, a non-empty no_go_signs list, or screen_symptom_score > 0 may never be cleared on field", error_id: ERR_MANDATORY_REMOVAL_ENFORCED, http_status: 409, applies_to: "POST /sideline-evaluations/{id}/clear-to-return" }
  - { priority: 14, category: business_safety, rule: "a player with a DIAGNOSED or HELD_OUT_INCONCLUSIVE evaluation in the same game may not be cleared on field by any other evaluation for that game", error_id: ERR_SAME_GAME_RETURN_PROHIBITED, http_status: 409, applies_to: "POST /sideline-evaluations/{id}/clear-to-return" }
  - { priority: 15, category: business_safety, rule: "no-go signs recorded at the screen forbid a NO_CONCUSSION conclusion; the exam must end in CONCUSSION or INCONCLUSIVE", error_id: ERR_NO_GO_SIGNS_PRESENT, http_status: 409, applies_to: "POST /sideline-evaluations/{id}/conclude-no-concussion" }
  - { priority: 16, category: business_safety, rule: "the locker-room examination must have run for at least MIN_LOCKER_ROOM_EXAM_MINUTES before any conclusion is recorded", error_id: ERR_LOCKER_ROOM_EXAM_TOO_SHORT, http_status: 409, applies_to: "POST /sideline-evaluations/{id}/diagnose-concussion, POST /sideline-evaluations/{id}/conclude-no-concussion" }
  - { priority: 17, category: business_safety, rule: "while the case carries heightened_review_required, the clinician signing off a stage must not be case.diagnosing_clinician_id", error_id: ERR_HEIGHTENED_REVIEW_CLINICIAN_REQUIRED, http_status: 403, applies_to: "POST /return-steps/{id}/evaluate" }
  - { priority: 18, category: business_safety, rule: "segregation of duties: the auditor issuing findings must not be audit.opened_by_user_id, and the auditor closing the audit must not be audit.findings_issued_by_user_id (skipped when the compared field is null)", error_id: ERR_SEGREGATION_OF_DUTIES, http_status: 403, applies_to: "POST /protocol-audits/{id}/findings, POST /protocol-audits/{id}/close" }
  - { priority: 19, category: business_referential, rule: "the final-clearance consultant must be an INDEPENDENT_CONSULTANT with club_id null, must not be case.diagnosing_clinician_id, and must not be the same clinician who attended the case's locker-room exam", error_id: ERR_INC_NOT_INDEPENDENT, http_status: 422, applies_to: "POST /concussion-cases/{id}/inc-clearances" }
  - { priority: 20, category: business_referential, rule: "the locker-room examination consultant must be UNAFFILIATED_OBSERVER or INDEPENDENT_CONSULTANT and must not be evaluation.evaluating_clinician_id", error_id: ERR_EXAM_INC_INELIGIBLE, http_status: 422, applies_to: "POST /sideline-evaluations/{id}/locker-room-exam" }
  - { priority: 21, category: business_referential, rule: "only the assigned consultant may decide a clearance", error_id: ERR_INC_ASSIGNMENT_MISMATCH, http_status: 403, applies_to: "POST /inc-clearances/{id}/decide" }
  - { priority: 22, category: business_referential, rule: "the evaluated player must be on the home or away club of the referenced game", error_id: ERR_PLAYER_CLUB_MISMATCH, http_status: 422, applies_to: "POST /sideline-evaluations, POST /injury-report-entries" }
  - { priority: 23, category: business_temporal, rule: "the acting clinician's credential_expires_at must be strictly after now; the referenced consultant's credential must also be valid", error_id: ERR_CLINICIAN_CREDENTIAL_EXPIRED, http_status: 422, applies_to: "every clinician-role write endpoint" }
  - { priority: 24, category: business_temporal, rule: "the referenced Game must be IN_PROGRESS", error_id: ERR_GAME_NOT_IN_PROGRESS, http_status: 409, applies_to: "POST /sideline-evaluations, POST /sideline-evaluations/{id}/screen, POST /sideline-evaluations/{id}/clear-to-return" }
  - { priority: 25, category: business_temporal, rule: "the consultant's requested 30-minute exam block must not intersect an existing block of the same consultant (closed intervals)", error_id: ERR_INC_EXAM_WINDOW_CONFLICT, http_status: 409, applies_to: "POST /sideline-evaluations/{id}/locker-room-exam" }
  - { priority: 26, category: business_temporal, rule: "a stage may not start before the previous stage's rest buffer has elapsed (now >= min_start_at)", error_id: ERR_STAGE_REST_BUFFER_VIOLATION, http_status: 409, applies_to: "POST /concussion-cases/{id}/return-steps" }
  - { priority: 27, category: business_temporal, rule: "a stage may not be passed before its dwell has elapsed (now >= dwell_complete_at); not checked on the SYMPTOM_RECURRENCE branch", error_id: ERR_STAGE_DWELL_NOT_MET, http_status: 409, applies_to: "POST /return-steps/{id}/evaluate" }
  - { priority: 28, category: business_temporal, rule: "return to contact may not occur before case.earliest_return_at", error_id: ERR_RETURN_BEFORE_EARLIEST_DATE, http_status: 409, applies_to: "POST /concussion-cases/{id}/return-to-contact" }
  - { priority: 29, category: business_temporal, rule: "the case's most recent IncClearance must not have expired (status EXPIRED, or expires_at <= now)", error_id: ERR_INC_CLEARANCE_EXPIRED, http_status: 409, applies_to: "POST /concussion-cases/{id}/return-to-contact" }
  - { priority: 30, category: business_temporal, rule: "the injury-report filing window must be open (now >= kickoff_at - 96h)", error_id: ERR_REPORT_WINDOW_NOT_OPEN, http_status: 409, applies_to: "POST /injury-report-entries" }
  - { priority: 31, category: business_temporal, rule: "the injury-report filing window must not have shut (now < kickoff_at)", error_id: ERR_REPORT_WINDOW_CLOSED, http_status: 409, applies_to: "POST /injury-report-entries, POST /injury-report-entries/{id}/amend" }
  - { priority: 32, category: business_constraint, rule: "stage_index must equal case.rtp_stage + 1", error_id: ERR_STAGE_SEQUENCE_VIOLATION, http_status: 422, applies_to: "POST /concussion-cases/{id}/return-steps" }
  - { priority: 33, category: business_constraint, rule: "the case must have no ReturnStep with status IN_PROGRESS", error_id: ERR_STEP_ALREADY_IN_PROGRESS, http_status: 409, applies_to: "POST /concussion-cases/{id}/return-steps" }
  - { priority: 34, category: business_constraint, rule: "the case must have at least one ReturnStep before final clearance can be requested (empty-collection case)", error_id: ERR_NO_RETURN_STEPS_RECORDED, http_status: 422, applies_to: "POST /concussion-cases/{id}/inc-clearances" }
  - { priority: 35, category: business_constraint, rule: "every stage_index 1..5 must have a PASSED, non-REVOKED ReturnStep (partial-progress case)", error_id: ERR_RTP_STAGES_INCOMPLETE, http_status: 422, applies_to: "POST /concussion-cases/{id}/inc-clearances, POST /inc-clearances/{id}/decide {decision: APPROVED}" }
  - { priority: 36, category: business_constraint, rule: "an APPROVED IncClearance must exist for the case", error_id: ERR_INC_CLEARANCE_MISSING, http_status: 409, applies_to: "POST /concussion-cases/{id}/return-to-contact" }
  - { priority: 37, category: business_constraint, rule: "the player's baseline_status must be VALID: NONE means no baseline was ever established, RETEST_REQUIRED means a post-diagnosis retest is owed", error_id: "ERR_BASELINE_NOT_ESTABLISHED when baseline_status == NONE, ERR_BASELINE_RETEST_REQUIRED when baseline_status == RETEST_REQUIRED", http_status: 422, applies_to: "POST /concussion-cases/{id}/return-to-contact" }
  - { priority: 38, category: business_constraint, rule: "a player may have at most one ConcussionCase whose case_status is not CLEARED_FOR_CONTACT", error_id: ERR_OPEN_CASE_EXISTS, http_status: 409, applies_to: "POST /sideline-evaluations/{id}/diagnose-concussion" }
  - { priority: 39, category: business_constraint, rule: "outcome PASS requires symptom_score < SYMPTOM_RECURRENCE_THRESHOLD and outcome SYMPTOM_RECURRENCE requires symptom_score >= SYMPTOM_RECURRENCE_THRESHOLD", error_id: ERR_SYMPTOM_OUTCOME_MISMATCH, http_status: 422, applies_to: "POST /return-steps/{id}/evaluate" }
  - { priority: 40, category: business_constraint, rule: "the filed designation must equal the recomputed required_designation", error_id: ERR_INJURY_DESIGNATION_MISMATCH, http_status: 422, applies_to: "POST /injury-report-entries, POST /injury-report-entries/{id}/amend" }
  - { priority: 41, category: business_constraint, rule: "at most one InjuryReportEntry may exist per (game_id, player_id)", error_id: ERR_DUPLICATE_INJURY_REPORT, http_status: 409, applies_to: "POST /injury-report-entries" }
  - { priority: 42, category: business_constraint, rule: "the club may file at most MAX_AUDIT_RESPONSE_ROUNDS responses per audit", error_id: ERR_AUDIT_RESPONSE_ROUNDS_EXHAUSTED, http_status: 409, applies_to: "POST /protocol-audits/{id}/respond" }
  - { priority: 43, category: business_constraint, rule: "the case must not already hold a roster exemption (GRANTED or RELEASED)", error_id: ERR_EXEMPTION_ALREADY_GRANTED, http_status: 409, applies_to: "POST /concussion-cases/{id}/roster-exemption" }
  - { priority: 44, category: business_constraint, rule: "uniqueness: Club.market_code, Clinician.license_number and (Player.club_id, Player.jersey_number)", error_id: ERR_UNIQUENESS_VIOLATION, http_status: 409, applies_to: "POST /clubs, POST /clinicians, POST /players" }
  - { priority: 45, category: business_fiscal, rule: "the club must have exemption_slots_available >= 1", error_id: ERR_NO_EXEMPTION_SLOTS, http_status: 409, applies_to: "POST /concussion-cases/{id}/roster-exemption" }
  - { priority: 46, category: business_fiscal, rule: "the club's outstanding_fine_cents after this issuance must not exceed SEASON_FINE_CAP_CENTS", error_id: ERR_CLUB_FINE_CAP_EXCEEDED, http_status: 409, applies_to: "POST /protocol-audits/{id}/findings" }

# =============================================================================
# §1.5 Endpoint Table
# Path parameters are uniformly named {id} (every path addresses exactly one
# resource). Fields suffixed with ? are optional.
# =============================================================================
endpoints:

  # ---- Club -----------------------------------------------------------------
  - method: POST
    path: /concussion-program/clubs
    roles: [LeagueAdmin]
    input: [name, market_code, "exemption_slots_total?"]
    output: Club
    status: 201
    side_effects:
      - "initialises compliance_score = 100, adjudicated_compliance_score = 100, escalation_tier = TIER_0, status = ACTIVE, outstanding_fine_cents = 0, open_violation_count = 0, exemption_slots_used = 0, exemption_slots_available = exemption_slots_total"
    errors: [ERR_UNAUTHENTICATED, ERR_UNAUTHORIZED, ERR_INVALID_REQUEST, ERR_UNIQUENESS_VIOLATION]

  - method: GET
    path: /concussion-program/clubs/{id}
    roles: [LeagueAdmin, LeagueAuditor, ClubPhysician, ClubComplianceOfficer, IndependentConsultant, UnaffiliatedObserver]
    input: []
    output: Club
    status: 200
    side_effects: []
    errors: [ERR_UNAUTHENTICATED, ERR_UNAUTHORIZED, ERR_CLUB_NOT_FOUND]

  - method: GET
    path: /concussion-program/clubs/{id}/players
    roles: [LeagueAdmin, LeagueAuditor, ClubPhysician, ClubComplianceOfficer, IndependentConsultant, UnaffiliatedObserver]
    input: ["availability_status?", "baseline_status?", "limit?", "offset?"]
    output: Player[]
    status: 200
    side_effects: []
    errors: [ERR_UNAUTHENTICATED, ERR_UNAUTHORIZED, ERR_INVALID_REQUEST, ERR_CLUB_NOT_FOUND]

  - method: GET
    path: /concussion-program/clubs/{id}/compliance-summary
    roles: [LeagueAdmin, LeagueAuditor, ClubComplianceOfficer]
    input: []
    output: "{ club_id: string, compliance_score: integer, adjudicated_compliance_score: integer, escalation_tier: string, status: string, outstanding_fine_cents: integer, open_violation_count: integer, exemption_slots_total: integer, exemption_slots_used: integer, exemption_slots_available: integer, frozen_case_count: integer }"
    status: 200
    side_effects: []
    errors: [ERR_UNAUTHENTICATED, ERR_UNAUTHORIZED, ERR_CLUB_NOT_FOUND]
    notes: "computed read: every field is derived by club_posture_propagation and exemption_slot_ledger, never stored independently"

  # ---- Clinician ------------------------------------------------------------
  - method: POST
    path: /concussion-program/clinicians
    roles: [LeagueAdmin]
    input: [full_name, affiliation, license_number, credential_expires_at, "club_id?"]
    output: Clinician
    status: 201
    side_effects:
      - "sets status = ACTIVE and cases_cleared_count = 0"
    errors: [ERR_UNAUTHENTICATED, ERR_UNAUTHORIZED, ERR_INVALID_REQUEST, ERR_CLUB_NOT_FOUND, ERR_UNIQUENESS_VIOLATION]

  - method: POST
    path: /concussion-program/clinicians/{id}/suspend
    roles: [LeagueAdmin]
    input: [reason]
    output: Clinician
    status: 200
    side_effects:
      - "sets status = SUSPENDED and suspension_reason"
      - "sets every PENDING IncClearance assigned to this clinician to SUPERSEDED"
      - "returns each affected ConcussionCase from PENDING_INC_CLEARANCE to RTP_IN_PROGRESS without revoking any ReturnStep"
      - "increments Clinician.version, and the version of every touched IncClearance and ConcussionCase, by 1"
    errors: [ERR_UNAUTHENTICATED, ERR_UNAUTHORIZED, ERR_CLINICIAN_NOT_FOUND, ERR_CLINICIAN_SUSPENDED]

  - method: GET
    path: /concussion-program/clinicians/{id}
    roles: [LeagueAdmin, LeagueAuditor, ClubPhysician, ClubComplianceOfficer, IndependentConsultant, UnaffiliatedObserver]
    input: []
    output: Clinician
    status: 200
    side_effects: []
    errors: [ERR_UNAUTHENTICATED, ERR_UNAUTHORIZED, ERR_CLINICIAN_NOT_FOUND]

  - method: GET
    path: /concussion-program/clinicians
    roles: [LeagueAdmin, LeagueAuditor, ClubPhysician, ClubComplianceOfficer, IndependentConsultant, UnaffiliatedObserver]
    input: ["club_id?", "affiliation?", "status?", "limit?", "offset?"]
    output: Clinician[]
    status: 200
    side_effects: []
    errors: [ERR_UNAUTHENTICATED, ERR_UNAUTHORIZED, ERR_INVALID_REQUEST]

  # ---- Player ---------------------------------------------------------------
  - method: POST
    path: /concussion-program/players
    roles: [LeagueAdmin, ClubComplianceOfficer]
    input: [club_id, full_name, jersey_number, position]
    output: Player
    status: 201
    side_effects:
      - "sets baseline_status = NONE, availability_status = AVAILABLE, public_injury_designation = NONE, diagnosed_case_count = 0"
    errors: [ERR_UNAUTHENTICATED, ERR_UNAUTHORIZED, ERR_INVALID_REQUEST, ERR_CLUB_NOT_FOUND, ERR_CLUB_SCOPE_VIOLATION, ERR_UNIQUENESS_VIOLATION]

  - method: GET
    path: /concussion-program/players/{id}
    roles: [LeagueAdmin, LeagueAuditor, ClubPhysician, ClubComplianceOfficer, IndependentConsultant, UnaffiliatedObserver]
    input: []
    output: Player
    status: 200
    side_effects: []
    errors: [ERR_UNAUTHENTICATED, ERR_UNAUTHORIZED, ERR_PLAYER_NOT_FOUND]

  - method: GET
    path: /concussion-program/players
    roles: [LeagueAdmin, LeagueAuditor, ClubPhysician, ClubComplianceOfficer, IndependentConsultant, UnaffiliatedObserver]
    input: ["club_id?", "availability_status?", "baseline_status?", "public_injury_designation?", "limit?", "offset?"]
    output: Player[]
    status: 200
    side_effects: []
    errors: [ERR_UNAUTHENTICATED, ERR_UNAUTHORIZED, ERR_INVALID_REQUEST]

  # ---- Game -----------------------------------------------------------------
  - method: POST
    path: /concussion-program/games
    roles: [LeagueAdmin]
    input: [season_year, week_index, home_club_id, away_club_id, kickoff_at]
    output: Game
    status: 201
    side_effects:
      - "sets status = SCHEDULED and derives report_window_opens_at and report_window_closes_at"
    errors: [ERR_UNAUTHENTICATED, ERR_UNAUTHORIZED, ERR_INVALID_REQUEST, ERR_CLUB_NOT_FOUND]

  - method: POST
    path: /concussion-program/games/{id}/advance-status
    roles: [LeagueAdmin]
    input: [to_status]
    output: Game
    status: 200
    side_effects:
      - "advances SCHEDULED -> IN_PROGRESS -> FINAL only; increments Game.version by 1"
    errors: [ERR_UNAUTHENTICATED, ERR_UNAUTHORIZED, ERR_INVALID_REQUEST, ERR_GAME_NOT_FOUND, ERR_RESOURCE_STATE_INVALID]

  - method: GET
    path: /concussion-program/games/{id}
    roles: [LeagueAdmin, LeagueAuditor, ClubPhysician, ClubComplianceOfficer, IndependentConsultant, UnaffiliatedObserver]
    input: []
    output: Game
    status: 200
    side_effects: []
    errors: [ERR_UNAUTHENTICATED, ERR_UNAUTHORIZED, ERR_GAME_NOT_FOUND]

  - method: GET
    path: /concussion-program/games
    roles: [LeagueAdmin, LeagueAuditor, ClubPhysician, ClubComplianceOfficer, IndependentConsultant, UnaffiliatedObserver]
    input: ["season_year?", "week_index?", "home_club_id?", "away_club_id?", "status?", "limit?", "offset?"]
    output: Game[]
    status: 200
    side_effects: []
    errors: [ERR_UNAUTHENTICATED, ERR_UNAUTHORIZED, ERR_INVALID_REQUEST]

  # ---- BaselineTest ---------------------------------------------------------
  - method: POST
    path: /concussion-program/baseline-tests
    roles: [ClubPhysician]
    input: [player_id, season_year, composite_score, reaction_time_ms, symptom_score, expected_player_version]
    output: BaselineTest
    status: 201
    side_effects:
      - "sets administered_by_clinician_id = X-User-ID, administered_at = now, status = VALID, retest_required_reason = NONE, validity_expires_at = now + 365 days"
      - "sets the player's previous VALID BaselineTest to SUPERSEDED"
      - "re-derives Player.baseline_status via baseline_status_resolution"
      - "increments Player.version by 1"
    errors: [ERR_UNAUTHENTICATED, ERR_UNAUTHORIZED, ERR_INVALID_REQUEST, ERR_PLAYER_NOT_FOUND, ERR_ROLE_IDENTITY_MISMATCH, ERR_CLUB_SCOPE_VIOLATION, ERR_CLINICIAN_SUSPENDED, ERR_CLINICIAN_CREDENTIAL_EXPIRED, ERR_STALE_PLAYER_VERSION]

  - method: POST
    path: /concussion-program/baseline-tests/{id}/invalidate
    roles: [LeagueAdmin]
    input: [reason]
    output: BaselineTest
    status: 200
    side_effects:
      - "sets status = INVALIDATED and retest_required_reason = ADMIN_INVALIDATION"
      - "re-derives Player.baseline_status and increments Player.version by 1"
    errors: [ERR_UNAUTHENTICATED, ERR_UNAUTHORIZED, ERR_RESOURCE_NOT_FOUND, ERR_RESOURCE_STATE_INVALID]

  - method: GET
    path: /concussion-program/baseline-tests/{id}
    roles: [LeagueAdmin, LeagueAuditor, ClubPhysician, ClubComplianceOfficer, IndependentConsultant, UnaffiliatedObserver]
    input: []
    output: BaselineTest
    status: 200
    side_effects: []
    errors: [ERR_UNAUTHENTICATED, ERR_UNAUTHORIZED, ERR_RESOURCE_NOT_FOUND]

  - method: GET
    path: /concussion-program/baseline-tests
    roles: [LeagueAdmin, LeagueAuditor, ClubPhysician, ClubComplianceOfficer, IndependentConsultant, UnaffiliatedObserver]
    input: ["player_id?", "administered_by_clinician_id?", "season_year?", "status?", "limit?", "offset?"]
    output: BaselineTest[]
    status: 200
    side_effects: []
    errors: [ERR_UNAUTHENTICATED, ERR_UNAUTHORIZED, ERR_INVALID_REQUEST]

  # ---- SidelineEvaluation ---------------------------------------------------
  - method: POST
    path: /concussion-program/sideline-evaluations
    roles: [ClubPhysician, UnaffiliatedObserver]
    input: [player_id, game_id, trigger_source]
    output: SidelineEvaluation
    status: 201
    side_effects:
      - "sets initiating_clinician_id = X-User-ID, initiated_at = now, status = INITIATED, diagnosis_outcome = PENDING, no_go_signs = []"
      - "derives mandatory_removal from trigger_source and protocol_deadline_at (15min when mandatory, else 45min)"
    errors: [ERR_UNAUTHENTICATED, ERR_UNAUTHORIZED, ERR_INVALID_REQUEST, ERR_PLAYER_NOT_FOUND, ERR_GAME_NOT_FOUND, ERR_ROLE_IDENTITY_MISMATCH, ERR_CLUB_SCOPE_VIOLATION, ERR_CLINICIAN_SUSPENDED, ERR_CLINICIAN_CREDENTIAL_EXPIRED, ERR_PLAYER_CLUB_MISMATCH, ERR_GAME_NOT_IN_PROGRESS]
    notes: "an UnaffiliatedObserver may initiate an evaluation for ANY player of either club in the game and is the only role that may pass trigger_source = UNAFFILIATED_OBSERVER; a ClubPhysician may only initiate for players of their own club and may only pass CLUB_MEDICAL_STAFF, GAME_OFFICIAL, VIDEO_SPOTTER or COACH"

  - method: POST
    path: /concussion-program/sideline-evaluations/{id}/screen
    roles: [ClubPhysician]
    input: [no_go_signs, symptom_score]
    output: SidelineEvaluation
    status: 200
    side_effects:
      - "sets status = SCREENED, evaluating_clinician_id = X-User-ID, screened_at = now, no_go_signs, screen_symptom_score"
      - "increments SidelineEvaluation.version by 1"
    errors: [ERR_UNAUTHENTICATED, ERR_UNAUTHORIZED, ERR_INVALID_REQUEST, ERR_EVALUATION_NOT_FOUND, ERR_ROLE_IDENTITY_MISMATCH, ERR_CLUB_SCOPE_VIOLATION, ERR_CLINICIAN_SUSPENDED, ERR_CLINICIAN_CREDENTIAL_EXPIRED, ERR_EVALUATION_STATE_INVALID, ERR_GAME_NOT_IN_PROGRESS]

  - method: POST
    path: /concussion-program/sideline-evaluations/{id}/locker-room-exam
    roles: [ClubPhysician]
    input: [inc_clinician_id]
    output: SidelineEvaluation
    status: 200
    side_effects:
      - "sets status = LOCKER_ROOM_EXAM, inc_clinician_id, exam_started_at = now, inc_block_ends_at = now + 30min"
      - "increments SidelineEvaluation.version by 1"
    errors: [ERR_UNAUTHENTICATED, ERR_UNAUTHORIZED, ERR_INVALID_REQUEST, ERR_EVALUATION_NOT_FOUND, ERR_CLINICIAN_NOT_FOUND, ERR_ROLE_IDENTITY_MISMATCH, ERR_CLUB_SCOPE_VIOLATION, ERR_CLINICIAN_SUSPENDED, ERR_CLINICIAN_CREDENTIAL_EXPIRED, ERR_EVALUATION_STATE_INVALID, ERR_EXAM_INC_INELIGIBLE, ERR_INC_EXAM_WINDOW_CONFLICT]

  - method: POST
    path: /concussion-program/sideline-evaluations/{id}/diagnose-concussion
    roles: [ClubPhysician]
    input: [symptom_score, composite_score, "documentation_note?"]
    output: ConcussionCase
    status: 201
    side_effects:
      - "sets evaluation.status = DIAGNOSED, diagnosis_outcome = CONCUSSION, exam_completed_at = now, exam_duration_minutes"
      - "creates the ConcussionCase (case_status = MANDATORY_REMOVAL, monitoring_status = ACTIVE_SYMPTOM_WATCH, roster_exemption_status = NONE) with severity_index and projected_return_at computed and prior_case_id resolved"
      - "sets Player.availability_status = PROTOCOL_RESTRICTED, public_injury_designation = OUT, diagnosed_case_count += 1, baseline_status = RETEST_REQUIRED and stamps retest_required_reason = NEW_DIAGNOSIS on the latest VALID BaselineTest"
      - "increments Player.version and SidelineEvaluation.version by 1"
    errors: [ERR_UNAUTHENTICATED, ERR_UNAUTHORIZED, ERR_INVALID_REQUEST, ERR_EVALUATION_NOT_FOUND, ERR_ROLE_IDENTITY_MISMATCH, ERR_CLUB_SCOPE_VIOLATION, ERR_CLINICIAN_SUSPENDED, ERR_CLINICIAN_CREDENTIAL_EXPIRED, ERR_EVALUATION_STATE_INVALID, ERR_LOCKER_ROOM_EXAM_TOO_SHORT, ERR_OPEN_CASE_EXISTS]

  - method: POST
    path: /concussion-program/sideline-evaluations/{id}/conclude-no-concussion
    roles: [ClubPhysician]
    input: [outcome, "documentation_note?"]
    output: SidelineEvaluation
    status: 200
    side_effects:
      - "outcome NO_CONCUSSION -> status = NO_CONCUSSION_CLEARED; outcome INCONCLUSIVE -> status = HELD_OUT_INCONCLUSIVE"
      - "sets exam_completed_at = now, exam_duration_minutes and diagnosis_outcome; creates no ConcussionCase"
      - "increments SidelineEvaluation.version by 1"
    errors: [ERR_UNAUTHENTICATED, ERR_UNAUTHORIZED, ERR_INVALID_REQUEST, ERR_EVALUATION_NOT_FOUND, ERR_ROLE_IDENTITY_MISMATCH, ERR_CLUB_SCOPE_VIOLATION, ERR_EVALUATION_STATE_INVALID, ERR_LOCKER_ROOM_EXAM_TOO_SHORT, ERR_NO_GO_SIGNS_PRESENT]

  - method: POST
    path: /concussion-program/sideline-evaluations/{id}/clear-to-return
    roles: [ClubPhysician]
    input: ["documentation_note?"]
    output: SidelineEvaluation
    status: 200
    side_effects:
      - "sets status = CLEARED_ON_FIELD and diagnosis_outcome = NO_CONCUSSION"
      - "increments SidelineEvaluation.version by 1"
    errors: [ERR_UNAUTHENTICATED, ERR_UNAUTHORIZED, ERR_EVALUATION_NOT_FOUND, ERR_ROLE_IDENTITY_MISMATCH, ERR_CLUB_SCOPE_VIOLATION, ERR_EVALUATION_STATE_INVALID, ERR_MANDATORY_REMOVAL_ENFORCED, ERR_SAME_GAME_RETURN_PROHIBITED, ERR_GAME_NOT_IN_PROGRESS]

  - method: GET
    path: /concussion-program/sideline-evaluations/{id}
