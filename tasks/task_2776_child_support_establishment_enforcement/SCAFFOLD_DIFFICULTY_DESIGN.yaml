            - "${coid_after} == null"
            - "${costate_after} == null"
            - "${role_after_return} == \"NONE\"  # no other live referral exists"
            - "${o2_st_after} == \"ENTERED\"  # the identical entry request now passes the CEJ gate"
            - "${o2_monthly} == 75000  # monthly_obligation_cents := guideline_monthly_cents on entry"
            - "${o2_accrual} == \"2026-09-01\""

  # =====================================================================
  # RULE 8 — resource_temporal_overlap
  # Differentiation: instance 1 is the SupportOrder effective interval with
  # CLOSED [effective_date, terminated_date] semantics where abutment must be
  # exactly one day; instance 2 is the ObligationCharge billing period with
  # HALF-OPEN [period_start_date, period_end_date) semantics where touching
  # periods are legal. Different resource entities, opposite endpoint
  # boundaries.
  # =====================================================================
  - rule_id: resource_temporal_overlap
    instances:

      - name: order_interval_overlap_closed_interval_semantics
        grounds:
          - validations[priority=22]
          - errors[ERR_ORDER_INTERVAL_OVERLAP]
          - state_machines.SupportOrder.status.ENTERED_to_VACATED
          - entities.SupportOrder.fields.terminated_date
          - endpoints[POST /child-support/orders/{order_id}/entry]
        distinguishing_aspect: |
          A live ENTERED order has terminated_date null, so its closed interval
          is open-ended and blocks a second CURRENT_SUPPORT order in BOTH time
          directions (a later 2027-01-01 order and an earlier 2026-01-01 order
          are each rejected), while a MEDICAL_SUPPORT order at the same
          2027-01-01 date enters freely because the rule is scoped by
          order_type; only after vacatur sets terminated_date to 2026-12-31 —
          exactly the new effective_date minus one day — does the 2027-01-01
          CURRENT_SUPPORT order become legal by abutment.
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00Z."
            - "DIRECT_APPLICATION MN case, child_count 2, tanf_assistance false; CP income 200000, NCP income 300000, both VERIFIED_WAGE_RECORD; NCP LOCATED; PRESUMED_MARITAL paternity."
            - "Order 1: CURRENT_SUPPORT MN effective 2026-08-01, ENTERED at 75000, terminated_date null."
            - "Order 2: CURRENT_SUPPORT MN effective 2027-01-01, taken to CALCULATED only."
            - "Order 3: CURRENT_SUPPORT MN effective 2026-01-01, taken to CALCULATED only."
            - "Order 4: MEDICAL_SUPPORT MN effective 2027-01-01, medical_support_monthly_cents 20000, taken to CALCULATED only."
            - "No CompromiseOffer exists, so the vacatur precondition is satisfied."
          setup_api_calls:
            - call: "POST /child-support/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /child-support/participants"
              payload: { role_type: "CUSTODIAL_PARTY", full_name: "Pia Quill", ssn_last4: "3030", residence_state_code: "MN", monthly_gross_income_cents: 200000, income_verification_source: "VERIFIED_WAGE_RECORD" }
              as: CaseWorker
              captures: { cp_id: $.data.id }
            - call: "POST /child-support/participants"
              payload: { role_type: "NONCUSTODIAL_PARTY", full_name: "Rex Quill", ssn_last4: "3131", residence_state_code: "MN", monthly_gross_income_cents: 300000, income_verification_source: "VERIFIED_WAGE_RECORD", supports_second_family: false, has_valid_drivers_license: true }
              as: CaseWorker
              captures: { ncp_id: $.data.id }
            - call: "POST /child-support/participants/${ncp_id}/locate-results"
              payload: { locate_outcome: "LOCATED" }
              as: CaseWorker
            - call: "POST /child-support/cases"
              payload: { case_type: "DIRECT_APPLICATION", custodial_party_id: "${cp_id}", noncustodial_party_id: "${ncp_id}", child_count: 2, tanf_assistance: false, good_cause_claim: false }
              as: CaseWorker
              captures: { case_id: $.data.id }
            - call: "POST /child-support/cases/${case_id}/paternity-actions"
              payload: { method: "PRESUMED_MARITAL" }
              as: CaseWorker
            - call: "POST /child-support/cases/${case_id}/orders"
              payload: { order_type: "CURRENT_SUPPORT", origin_state_code: "MN", effective_date: "2026-08-01" }
              as: CaseWorker
              captures: { order1_id: $.data.id }
            - call: "POST /child-support/orders/${order1_id}/guideline-calculation"
              payload: {}
              as: CaseWorker
            - call: "POST /child-support/orders/${order1_id}/entry"
              payload: {}
              as: SupervisingAttorney
              captures: { o1_st: $.data.status, o1_term: $.data.terminated_date }
            - call: "POST /child-support/cases/${case_id}/orders"
              payload: { order_type: "CURRENT_SUPPORT", origin_state_code: "MN", effective_date: "2027-01-01" }
              as: CaseWorker
              captures: { order2_id: $.data.id }
            - call: "POST /child-support/orders/${order2_id}/guideline-calculation"
              payload: {}
              as: CaseWorker
            - call: "POST /child-support/cases/${case_id}/orders"
              payload: { order_type: "CURRENT_SUPPORT", origin_state_code: "MN", effective_date: "2026-01-01" }
              as: CaseWorker
              captures: { order3_id: $.data.id }
            - call: "POST /child-support/orders/${order3_id}/guideline-calculation"
              payload: {}
              as: CaseWorker
            - call: "POST /child-support/cases/${case_id}/orders"
              payload: { order_type: "MEDICAL_SUPPORT", origin_state_code: "MN", effective_date: "2027-01-01", medical_support_monthly_cents: 20000 }
              as: CaseWorker
              captures: { order4_id: $.data.id }
            - call: "POST /child-support/orders/${order4_id}/guideline-calculation"
              payload: {}
              as: CaseWorker
          trigger:
            - call: "POST /child-support/orders/${order2_id}/entry"
              payload: {}
              as: SupervisingAttorney
              captures: { err_future: $.data.error_id }
            - call: "POST /child-support/orders/${order3_id}/entry"
              payload: {}
              as: SupervisingAttorney
              captures: { err_past: $.data.error_id }
            - call: "POST /child-support/orders/${order4_id}/entry"
              payload: {}
              as: SupervisingAttorney
              captures: { o4_st: $.data.status }
            - call: "POST /child-support/_clock/set_current_utc"
              payload: { to_iso8601: "2026-12-31T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /child-support/orders/${order1_id}/vacatur"
              payload: { vacate_reason: "CLERICAL_ERROR" }
              as: SupervisingAttorney
              captures: { o1_st_after: $.data.status, o1_term_after: $.data.terminated_date }
            - call: "POST /child-support/orders/${order2_id}/entry"
              payload: {}
              as: SupervisingAttorney
              captures: { o2_st_after: $.data.status, o2_monthly: $.data.monthly_obligation_cents }
          assert:
            - "${o1_st} == \"ENTERED\""
            - "${o1_term} == null  # an ENTERED order's interval is open-ended"
            - "${err_future} == \"ERR_ORDER_INTERVAL_OVERLAP\"  # HTTP 409; [2027-01-01, null] overlaps [2026-08-01, null]"
            - "${err_past} == \"ERR_ORDER_INTERVAL_OVERLAP\"  # HTTP 409; [2026-01-01, null] also overlaps — the open right end blocks both directions"
            - "${o4_st} == \"ENTERED\"  # MEDICAL_SUPPORT is a different order_type, so the rule's scope excludes it"
            - "${o1_st_after} == \"VACATED\""
            - "${o1_term_after} == \"2026-12-31\"  # terminated_date := current logical clock date"
            - "${o2_st_after} == \"ENTERED\"  # 2026-12-31 == 2027-01-01 - 1 day, exactly the legal abutment"
            - "${o2_monthly} == 75000"

      - name: charge_period_overlap_half_open_interval_semantics
        grounds:
          - validations[priority=23]
          - errors[ERR_CHARGE_PERIOD_OVERLAP]
          - endpoints[POST /child-support/orders/{order_id}/charges]
          - entities.ObligationCharge.fields.period_end_date
