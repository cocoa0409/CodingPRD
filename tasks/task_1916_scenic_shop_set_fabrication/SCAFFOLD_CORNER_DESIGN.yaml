            - "after CO reject + reservation release: close succeeds, Production.${prod_id}.status == CLOSED"

      - name: accept_after_valid_until_returns_bid_expired
        claim_type: violation_to_error
        grounds:
          - 'errors[ERR_BID_EXPIRED]'
          - 'validations[priority=8]'
        distinguishing_aspect: "valid_until is enforced at accept even before any epoch runs: clock 2026-08-07 > valid_until 2026-08-06 (validity_days 5 from submit at 2026-08-01) fails with ERR_BID_EXPIRED while the bid is still SUBMITTED."
        test_recipe:
          setup: ["shop, client, package; bid validity_days 5 SUBMITTED at default clock 2026-08-01 (valid_until 2026-08-06); clock advanced to 2026-08-07"]
          setup_api_calls:
            - call: "POST /scenic/shops"
              payload: { name: "Metro Scenic", weekly_crew_hours_capacity: 100, horizon_weeks: 4, bay_count: 2, truck_fleet_size: 6, labor_rate_cents_per_hour: 8000, overtime_multiplier_bp: 15000, overhead_pct_bp: 1000, margin_pct_bp: 2000 }
