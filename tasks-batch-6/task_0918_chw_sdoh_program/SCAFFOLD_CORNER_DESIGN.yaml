  # =========================================================================
  # SECTION: calculations
  # =========================================================================
  - section: calculations
    instances:

      - name: goal_progress_direction_variants_diverge_on_same_numbers
        claim_type: Variant Divergence
        grounds:
          - calculations.goal_progress_pct
          - entities.CarePlanGoal.fields.direction
        distinguishing_aspect: "The same numeric triple read in opposite directions gives different answers: baseline 40, target 60, current 45 under INCREASE_GOOD is 25.0, while baseline 60, target 40, current 45 under DECREASE_GOOD is 75.0."
        test_recipe:
          setup:
            - "Logical clock at 2026-06-01T00:00:00Z."
            - "One worker and one ENROLLED patient."
            - "Two ACTIVE goals: one INCREASE_GOOD from 40 to 60, one DECREASE_GOOD from 60 to 40."
          setup_api_calls:
            - call: "POST /chw/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /chw/workers"
              payload: { full_name: "Ana Reyes", employee_code: "C-020" }
              as: ProgramAdmin
              captures: { w1: $.data.id }
            - call: "POST /chw/patients"
              payload: { mrn: "MRN-C20", full_name: "Direction Case", household_size: 2, monthly_income_cents: 100000, residence_zip: "60614" }
              as: CHW
              as_user_id: "${w1}"
              captures: { p1: $.data.id }
            - call: "PATCH /chw/patients/${p1}"
              payload: { enrollment_action: "ENROLL" }
              as: Supervisor
              as_user_id: "sup-1"
            - call: "POST /chw/goals"
              payload: { patient_id: "${p1}", domain: "EMPLOYMENT", direction: "INCREASE_GOOD", baseline_value: 40, target_value: 60, review_cycle_days: 30 }
              as: CHW
              as_user_id: "${w1}"
              captures: { g_inc: $.data.id }
            - call: "POST /chw/goals"
              payload: { patient_id: "${p1}", domain: "HEALTH_LITERACY", direction: "DECREASE_GOOD", baseline_value: 60, target_value: 40, review_cycle_days: 30 }
              as: CHW
              as_user_id: "${w1}"
              captures: { g_dec: $.data.id }
          trigger:
            - call: "POST /chw/goals/${g_inc}/progress"
              payload: { current_value: 45 }
              as: CHW
              as_user_id: "${w1}"
            - call: "POST /chw/goals/${g_dec}/progress"
              payload: { current_value: 45 }
              as: CHW
              as_user_id: "${w1}"
          assert:
            - "CarePlanGoal.${g_inc}.progress_pct == 25.0"
            - "CarePlanGoal.${g_dec}.progress_pct == 75.0"
            - "CarePlanGoal.${g_inc}.current_value == 45 and CarePlanGoal.${g_dec}.current_value == 45"
            - "CarePlanGoal.${g_inc}.review_due_at == 2026-07-01T00:00:00.000Z"
            - "CarePlanGoal.${g_inc}.status == ACTIVE"

      - name: risk_tier_band_boundary_at_exactly_twentyfive
        claim_type: Constants Applied
        grounds:
          - calculations.sdoh_weighted_risk_score
          - entities.Patient.fields.risk_tier
          - state_machines.Patient.PROSPECTIVE_to_ENROLLED
        distinguishing_aspect: "The MODERATE band opens at >= 25: domain scores 1/1/1 give exactly 25.00 and tier MODERATE, which auto-enrols the patient, whereas 1/1/0 gives 20.00 and tier LOW, which leaves the patient PROSPECTIVE."
        test_recipe:
          setup:
            - "Logical clock at 2026-06-01T00:00:00Z."
            - "One worker; two PROSPECTIVE patients."
            - "One PUBLISHED instrument with weights FOOD 40, HOUSING 40, TRANSPORT 20."
          setup_api_calls:
            - call: "POST /chw/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /chw/workers"
              payload: { full_name: "Ana Reyes", employee_code: "C-021" }
              as: ProgramAdmin
              captures: { w1: $.data.id }
            - call: "POST /chw/patients"
              payload: { mrn: "MRN-C21", full_name: "Band Edge", household_size: 2, monthly_income_cents: 100000, residence_zip: "60614" }
              as: CHW
              as_user_id: "${w1}"
              captures: { p_at: $.data.id, p_at_v: $.data.version }
            - call: "POST /chw/patients"
              payload: { mrn: "MRN-C22", full_name: "Band Below", household_size: 2, monthly_income_cents: 100000, residence_zip: "60614" }
              as: CHW
              as_user_id: "${w1}"
              captures: { p_below: $.data.id, p_below_v: $.data.version }
            - call: "POST /chw/screening-instruments"
              payload: { name: "PRAPARE-Local", version_label: "v2.1", domain_weights: { FOOD: 40, HOUSING: 40, TRANSPORT: 20 }, effective_from: "2026-05-01T00:00:00Z", rescreen_cadence_days: 90 }
              as: ProgramAdmin
              captures: { inst1: $.data.id }
            - call: "POST /chw/screening-instruments/${inst1}/publish"
              payload: {}
              as: ProgramAdmin
          trigger:
            - call: "POST /chw/screenings"
              payload: { patient_id: "${p_at}", instrument_id: "${inst1}", domain_scores: { FOOD: 1, HOUSING: 1, TRANSPORT: 1 }, expected_patient_version: "${p_at_v}" }
              as: CHW
              as_user_id: "${w1}"
              captures: { s_at: $.data.id }
            - call: "POST /chw/screenings"
              payload: { patient_id: "${p_below}", instrument_id: "${inst1}", domain_scores: { FOOD: 1, HOUSING: 1, TRANSPORT: 0 }, expected_patient_version: "${p_below_v}" }
              as: CHW
              as_user_id: "${w1}"
              captures: { s_below: $.data.id }
          assert:
            - "Screening.${s_at}.weighted_score == 25.00"
            - "Screening.${s_at}.risk_tier == MODERATE"
            - "Patient.${p_at}.enrollment_status == ENROLLED"
            - "Screening.${s_below}.weighted_score == 20.00"
            - "Screening.${s_below}.risk_tier == LOW"
            - "Patient.${p_below}.enrollment_status == PROSPECTIVE"
            - "Patient.${p_below}.risk_tier == LOW"

      - name: mileage_third_band_marginal_rate_applied
        claim_type: tiered_pricing
        grounds:
          - calculations.travel_mileage_reimbursement
          - entities.Encounter.fields.travel_reimbursement_cents
        distinguishing_aspect: "35.0 miles reimburse 1970 cents under MARGINAL banding (10 at 67, 20 at 55, 5 at 40); an average-rate reading would give a different figure, and the 5000-cent cap does not bind here."
        test_recipe:
          setup:
            - "Logical clock at 2026-06-20T00:00:00Z."
            - "One worker and one ENROLLED patient."
          setup_api_calls:
            - call: "POST /chw/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-20T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /chw/workers"
              payload: { full_name: "Ana Reyes", employee_code: "C-023" }
              as: ProgramAdmin
              captures: { w1: $.data.id }
            - call: "POST /chw/patients"
              payload: { mrn: "MRN-C23", full_name: "Mileage Case", household_size: 2, monthly_income_cents: 100000, residence_zip: "60614" }
              as: CHW
              as_user_id: "${w1}"
              captures: { p1: $.data.id }
            - call: "PATCH /chw/patients/${p1}"
              payload: { enrollment_action: "ENROLL" }
              as: Supervisor
              as_user_id: "sup-1"
          trigger:
            - call: "POST /chw/encounters"
              payload: { patient_id: "${p1}", chw_id: "${w1}", encounter_date: "2026-06-11", direct_minutes: 30, indirect_minutes: 0, travel_minutes: 60, documentation_minutes: 0, travel_miles: 35.0 }
              as: CHW
              as_user_id: "${w1}"
              captures: { e1: $.data.id }
          assert:
            - "Encounter.${e1}.travel_reimbursement_cents == 1970"
            - "Encounter.${e1}.total_minutes == 90"
            - "Encounter.${e1}.raw_billable_minutes == 30"
            - "Encounter.${e1}.billable_minutes == 30"

      - name: eligibility_income_failure_reported_before_geography_failure
        claim_type: Input Set Filtering
        grounds:
          - calculations.eligibility_gauntlet
          - validations[priority=27]
          - validations[priority=28]
        distinguishing_aspect: "A patient failing BOTH INCOME_BAND (rank 1) and GEOGRAPHY (rank 2) reports only the income failure: first_failing_criterion_type is INCOME_BAND, first_failing_error_id is ERR_ELIGIBILITY_INCOME and evaluated_count is 1, proving evaluation stops at the first failure."
        test_recipe:
          setup:
            - "Logical clock at 2026-06-01T00:00:00Z."
            - "One worker; one ENROLLED patient with income 300000 and ZIP 60640."
            - "One FOOD_BOX offering carrying an INCOME_BAND criterion (max 200000) and a GEOGRAPHY criterion (allowed_zips 60614), created in that order."
          setup_api_calls:
            - call: "POST /chw/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /chw/workers"
              payload: { full_name: "Ana Reyes", employee_code: "C-024" }
              as: ProgramAdmin
              captures: { w1: $.data.id }
            - call: "POST /chw/patients"
              payload: { mrn: "MRN-C24", full_name: "Double Fail", household_size: 3, monthly_income_cents: 300000, residence_zip: "60640" }
              as: CHW
              as_user_id: "${w1}"
              captures: { p1: $.data.id }
            - call: "PATCH /chw/patients/${p1}"
              payload: { enrollment_action: "ENROLL" }
              as: Supervisor
              as_user_id: "sup-1"
            - call: "POST /chw/resource-orgs"
              payload: { name: "Northside Pantry", org_type: "FOOD", service_zips: ["60614"], contact_email: "ops@northside.example" }
              as: ProgramAdmin
              captures: { org1: $.data.id }
            - call: "POST /chw/offerings"
              payload: { resource_org_id: "${org1}", unit_type: "FOOD_BOX", capacity_total: 5 }
              as: ProgramAdmin
              captures: { off1: $.data.id }
            - call: "POST /chw/offerings/${off1}/criteria"
              payload: { criterion_type: "INCOME_BAND", max_monthly_income_cents: 200000 }
              as: ProgramAdmin
              captures: { crit_income: $.data.id }
            - call: "POST /chw/offerings/${off1}/criteria"
              payload: { criterion_type: "GEOGRAPHY", allowed_zips: ["60614"] }
              as: ProgramAdmin
          trigger:
            - call: "POST /chw/offerings/${off1}/eligibility-check"
              payload: { patient_id: "${p1}" }
              as: CHW
              as_user_id: "${w1}"
          assert:
            - "response.eligible == false"
            - "response.evaluated_count == 1"
            - "response.first_failing_criterion_id == ${crit_income}"
            - "response.first_failing_criterion_type == INCOME_BAND"
            - "response.first_failing_error_id == ERR_ELIGIBILITY_INCOME"
            - "HTTP status == 200"

      - name: report_denominator_basis_variants_diverge_after_disenrollment
        claim_type: Variant Divergence
        grounds:
          - calculations.program_report_rollups
          - state_machines.Patient.ENROLLED_to_DISENROLLED
        distinguishing_aspect: "With one ENROLLED screened patient and one DISENROLLED unscreened patient, ENROLLED_ONLY reports denominator 1 and screening_coverage_pct 100.0, while EVER_ENROLLED reports denominator 2 and 50.0 — identical data, two answers."
        test_recipe:
          setup:
            - "Logical clock at 2026-06-01T00:00:00Z."
            - "One worker; one PUBLISHED instrument."
            - "Patient A: ENROLLED via a HIGH-tier screening on 2026-06-01."
            - "Patient B: manually ENROLLED then DISENROLLED, with no screening at all."
          setup_api_calls:
            - call: "POST /chw/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /chw/workers"
              payload: { full_name: "Ana Reyes", employee_code: "C-025" }
              as: ProgramAdmin
              captures: { w1: $.data.id }
            - call: "POST /chw/screening-instruments"
              payload: { name: "PRAPARE-Local", version_label: "v2.1", domain_weights: { FOOD: 40, HOUSING: 40, TRANSPORT: 20 }, effective_from: "2026-05-01T00:00:00Z", rescreen_cadence_days: 90 }
              as: ProgramAdmin
              captures: { inst1: $.data.id }
            - call: "POST /chw/screening-instruments/${inst1}/publish"
              payload: {}
              as: ProgramAdmin
            - call: "POST /chw/patients"
              payload: { mrn: "MRN-C25", full_name: "Screened Enrolled", household_size: 2, monthly_income_cents: 100000, residence_zip: "60614" }
              as: CHW
              as_user_id: "${w1}"
              captures: { p_a: $.data.id, p_a_v: $.data.version }
            - call: "POST /chw/screenings"
              payload: { patient_id: "${p_a}", instrument_id: "${inst1}", domain_scores: { FOOD: 3, HOUSING: 2, TRANSPORT: 1 }, expected_patient_version: "${p_a_v}" }
              as: CHW
              as_user_id: "${w1}"
            - call: "POST /chw/patients"
              payload: { mrn: "MRN-C26", full_name: "Unscreened Disenrolled", household_size: 2, monthly_income_cents: 100000, residence_zip: "60614" }
              as: CHW
              as_user_id: "${w1}"
              captures: { p_b: $.data.id }
            - call: "PATCH /chw/patients/${p_b}"
              payload: { enrollment_action: "ENROLL" }
              as: Supervisor
              as_user_id: "sup-1"
            - call: "PATCH /chw/patients/${p_b}"
              payload: { enrollment_action: "DISENROLL" }
              as: Supervisor
              as_user_id: "sup-1"
          trigger:
            - call: "GET /chw/reports/program-summary"
              payload: { service_month: "2026-06", denominator_basis: "ENROLLED_ONLY" }
              as: ProgramAdmin
            - call: "GET /chw/reports/program-summary"
              payload: { service_month: "2026-06", denominator_basis: "EVER_ENROLLED" }
              as: ProgramAdmin
          assert:
            - "under ENROLLED_ONLY: patient_denominator_count == 1 and screening_coverage_pct == 100.0"
            - "under EVER_ENROLLED: patient_denominator_count == 2 and screening_coverage_pct == 50.0"
            - "under both bases: referral_loop_closure_pct == 0.0 because the resolved-referral denominator is empty"
            - "under both bases: payer_minutes == 0, grant_minutes == 0, unfunded_minutes == 0"
            - "under both bases: travel_reimbursement_monthly_cents == 0"
            - "Patient.${p_b}.enrollment_status == DISENROLLED"

      - name: claim_units_use_floor_not_rounding
        claim_type: Precision
        grounds:
          - calculations.billable_minutes_monthly_rollup
          - entities.PayerClaim.fields.units
        excluded_because:
          difficulty_instance: payer_claim_provisional_vs_final_basis_divergence
          rationale: "That instance pins units 6 for 102 minutes (102/15 = 6.8 floored to 6) and units 5 for 78 minutes, which is exactly the floor-versus-round distinction."

      - name: minute_rounding_order_is_per_encounter
        claim_type: Precision
        grounds:
          - calculations.billable_minutes_monthly_rollup
        excluded_because:
          difficulty_instance: minute_rounding_per_encounter_before_summing
          rationale: "That instance asserts claimed_minutes 72 and explicitly rejects the sum-then-round value 66."

      - name: travel_reimbursement_variant_selection
        claim_type: Variant Selection
        grounds:
          - calculations.travel_mileage_reimbursement
        excluded_because:
          difficulty_instance: travel_reimbursement_per_encounter_vs_monthly_aggregate
          rationale: "That instance asserts 670 per encounter and 1220 for the month on the same two encounters."

  # =========================================================================
  # SECTION: validations
  # =========================================================================
  - section: validations
    instances:

      - name: request_missing_headers_returns_unauthenticated
        claim_type: Violation to Error
        grounds:
          - validations[priority=1]
          - errors[ERR_UNAUTHENTICATED]
        distinguishing_aspect: "Rung 1 fires before everything else: a POST /chw/patients sent with no X-User-Role and no X-User-ID header returns ERR_UNAUTHENTICATED (401) even though the body is perfectly valid."
        test_recipe:
          setup:
            - "Empty database. The trigger call deliberately carries NO X-User-Role and NO X-User-ID header, which is why it declares no `as:` role."
          setup_api_calls:
            - call: "POST /chw/workers"
              payload: { full_name: "Ana Reyes", employee_code: "C-030" }
              as: ProgramAdmin
          trigger:
            - call: "POST /chw/patients"
              payload: { mrn: "MRN-C30", full_name: "No Headers", household_size: 2, monthly_income_cents: 100000, residence_zip: "60614" }
              captures: { err_id: $.data.error_id }
          assert:
            - "${err_id} == ERR_UNAUTHENTICATED"
            - "HTTP status == 401"

      - name: chw_cannot_place_records_hold
        claim_type: Violation to Error
        grounds:
          - validations[priority=2]
          - roles.CHW
          - roles.Supervisor
        distinguishing_aspect: "Rung 2 role checking: POST /chw/patients/{id}/records-hold is exclusive to Supervisor, so a CHW attempt returns ERR_FORBIDDEN_ROLE (403) and gate_status stays OPEN."
        test_recipe:
          setup:
            - "One worker and one Patient with gate_status OPEN."
          setup_api_calls:
            - call: "POST /chw/workers"
              payload: { full_name: "Ana Reyes", employee_code: "C-031" }
              as: ProgramAdmin
              captures: { w1: $.data.id }
            - call: "POST /chw/patients"
              payload: { mrn: "MRN-C31", full_name: "Role Case", household_size: 2, monthly_income_cents: 100000, residence_zip: "60614" }
              as: CHW
              as_user_id: "${w1}"
              captures: { p1: $.data.id }
          trigger:
            - call: "POST /chw/patients/${p1}/records-hold"
              payload: { action: "PLACE", reason: "Attempted by a CHW" }
              as: CHW
              as_user_id: "${w1}"
              captures: { err_id: $.data.error_id }
          assert:
            - "${err_id} == ERR_FORBIDDEN_ROLE"
            - "HTTP status == 403"
            - "Patient.${p1}.gate_status == OPEN"
            - "Patient.${p1}.gate_reason == null"

      - name: body_offering_reference_unknown_returns_not_found
        claim_type: Violation to Error
        grounds:
          - validations[priority=12]
          - errors[ERR_RESOURCE_NOT_FOUND]
        distinguishing_aspect: "Rung 6 body-reference existence: a referral naming an offering_id that resolves to nothing returns ERR_RESOURCE_NOT_FOUND (404), distinct from the ERR_PATIENT_NOT_FOUND used when patient_id is the dangling reference."
        test_recipe:
          setup:
            - "Logical clock at 2026-06-01T00:00:00Z."
            - "One worker and one ENROLLED patient; no offerings exist."
          setup_api_calls:
            - call: "POST /chw/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /chw/workers"
              payload: { full_name: "Ana Reyes", employee_code: "C-032" }
              as: ProgramAdmin
              captures: { w1: $.data.id }
            - call: "POST /chw/patients"
              payload: { mrn: "MRN-C32", full_name: "Dangling Case", household_size: 2, monthly_income_cents: 100000, residence_zip: "60614" }
              as: CHW
              as_user_id: "${w1}"
              captures: { p1: $.data.id, p1_v: $.data.version }
            - call: "PATCH /chw/patients/${p1}"
              payload: { enrollment_action: "ENROLL" }
              as: Supervisor
              as_user_id: "sup-1"
          trigger:
            - call: "POST /chw/referrals"
              payload: { patient_id: "${p1}", offering_id: "8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2", opened_by_chw_id: "${w1}", urgency: "ROUTINE", units_requested: 1, expected_offering_version: "${p1_v}" }
              as: CHW
              as_user_id: "${w1}"
              captures: { err_id: $.data.error_id }
          assert:
            - "${err_id} == ERR_RESOURCE_NOT_FOUND"
            - "HTTP status == 404"
            - "GET /chw/referrals with patient_id=${p1} returns total_count == 0"

      - name: stale_offering_version_on_referral_create_rejected
        claim_type: Violation to Error
        grounds:
          - concurrency_rules[referral-create-stale-offering]
