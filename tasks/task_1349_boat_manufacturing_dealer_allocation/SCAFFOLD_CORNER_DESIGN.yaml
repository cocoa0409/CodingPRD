# =============================================================================
# §1.9 Scaffold Corner Design — Coverage Index for Non-Difficulty Tests
# Boat Manufacturing & Dealer Allocation
# Breadth probe: every testable claim in §1.1–§1.7 not already covered by §1.8.
# Sections + claim_types come from references/claim-extraction-guide.md.
# =============================================================================

scaffold_corner_design:

  # ============================================================ entities
  - section: entities
    instances:
      - name: boat_model_creation_defaults_to_orderable
        claim_type: defaults
        grounds: ["entities.BoatModel.fields.status"]
        distinguishing_aspect: "BoatModel.status defaults to ORDERABLE when omitted at creation."
        test_recipe:
          setup: ["Empty catalog"]
          setup_api_calls: []
          trigger:
            - call: "POST /boat-models"
              payload: { model_code: "SP190", model_name: "Sport 190", model_year: 2027, base_price_cents: 2500000, length_feet: 19.5, production_hours: 40 }
              as: SystemAdmin
              captures: { m: $.data.id, st: $.data.status }
          assert:
            - "BoatModel.${m}.status == ORDERABLE (default applied when status omitted)"

      - name: boat_model_creation_explicit_discontinued
        claim_type: creation
        grounds: ["entities.BoatModel.fields.status"]
        distinguishing_aspect: "BoatModel may be seeded DISCONTINUED via explicit status input."
        test_recipe:
          setup: ["Empty catalog"]
          setup_api_calls: []
          trigger:
            - call: "POST /boat-models"
              payload: { model_code: "OLD10", model_name: "Legacy 10", model_year: 2020, base_price_cents: 1000000, length_feet: 18.0, production_hours: 30, status: "DISCONTINUED" }
              as: SystemAdmin
              captures: { m: $.data.id, st: $.data.status }
          assert:
            - "BoatModel.${m}.status == DISCONTINUED (explicit seeding honored)"

      - name: boat_model_missing_required_field_returns_invalid_request
        claim_type: required_field
        grounds: ["entities.BoatModel.fields.base_price_cents", "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "Omitting required base_price_cents on POST /boat-models returns ERR_INVALID_REQUEST 400."
        test_recipe:
          setup: ["Empty catalog"]
          setup_api_calls: []
          trigger:
            - call: "POST /boat-models"
              payload: { model_code: "SP190", model_name: "Sport 190", model_year: 2027, length_feet: 19.5, production_hours: 40 }
              as: SystemAdmin
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_REQUEST (missing required field base_price_cents)"

      - name: boat_model_invalid_enum_status_returns_invalid_request
        claim_type: type_constraint
        grounds: ["entities.BoatModel.fields.status", "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "Invalid enum member on BoatModel.status returns ERR_INVALID_REQUEST 400."
        test_recipe:
          setup: ["Empty catalog"]
          setup_api_calls: []
          trigger:
            - call: "POST /boat-models"
              payload: { model_code: "SP190", model_name: "Sport 190", model_year: 2027, base_price_cents: 2500000, length_feet: 19.5, production_hours: 40, status: "BROKEN" }
              as: SystemAdmin
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_REQUEST (status enum not in {ORDERABLE, DISCONTINUED})"

      - name: dealer_creation_computed_fields_initialized
        claim_type: computed_field
        grounds: ["entities.Dealer.fields.allocation_used", "entities.Dealer.fields.floor_plan_utilized_cents", "entities.Dealer.fields.current_rate_tier"]
        distinguishing_aspect: "Dealer creation initializes computed fields: allocation_used=0, floor_plan_utilized_cents=0, current_rate_tier=TIER_STANDARD."
        test_recipe:
          setup: ["Empty catalog"]
          setup_api_calls: []
          trigger:
            - call: "POST /dealers"
              payload: { dealer_code: "D-100", name: "Coastal Marine", region: "SE", annual_allocation_quota: 5, floor_plan_limit_cents: 10000000 }
              as: AllocationManager
              captures: { d: $.data.id, au: $.data.allocation_used, fu: $.data.floor_plan_utilized_cents, tier: $.data.current_rate_tier, st: $.data.standing }
          assert:
            - "Dealer.${d}.allocation_used == 0"
            - "Dealer.${d}.floor_plan_utilized_cents == 0"
            - "Dealer.${d}.current_rate_tier == TIER_STANDARD"
            - "Dealer.${d}.standing == STANDARD (default)"

      - name: dealer_get_by_id_returns_persisted_fields
        claim_type: retrieval
        grounds: ["entities.Dealer", "endpoints[\"GET /dealers/{id}\"]"]
        distinguishing_aspect: "GET /dealers/{id} returns the dealer with all persisted input and computed fields."
        test_recipe:
          setup: ["One dealer created"]
          setup_api_calls:
            - call: "POST /dealers"
              payload: { dealer_code: "D-100", name: "Coastal Marine", region: "SE", annual_allocation_quota: 5, floor_plan_limit_cents: 10000000 }
              as: AllocationManager
              captures: { d: $.data.id }
          trigger:
            - call: "GET /dealers/${d}"
              payload: {}
              as: Any
              captures: { got_code: $.data.dealer_code, got_quota: $.data.annual_allocation_quota }
          assert:
            - "Dealer.${d}.dealer_code == D-100"
            - "Dealer.${d}.annual_allocation_quota == 5"
            - "Dealer.${d}.floor_plan_limit_cents == 10000000"

      - name: dealer_get_not_found
        claim_type: not_found
        grounds: ["errors[ERR_DEALER_NOT_FOUND]"]
        distinguishing_aspect: "GET /dealers/{id} with unknown UUID returns ERR_DEALER_NOT_FOUND 404."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls: []
          trigger:
            - call: "GET /dealers/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: Any
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_DEALER_NOT_FOUND"

      - name: option_package_self_referential_incompatibility_stored
        claim_type: creation
        grounds: ["entities.OptionPackage.fields.incompatible_with_option_id"]
        distinguishing_aspect: "OptionPackage may declare incompatible_with_option_id referencing another option; both directions are honored."
        test_recipe:
          setup: ["Model SP190 created"]
          setup_api_calls:
            - call: "POST /boat-models"
              payload: { model_code: "SP190", model_name: "Sport 190", model_year: 2027, base_price_cents: 2500000, length_feet: 19.5, production_hours: 40 }
              as: SystemAdmin
              captures: { m: $.data.id }
            - call: "POST /option-packages"
              payload: { model_id: "${m}", option_code: "TOWER", name: "Wake Tower", price_cents: 350000, production_hours: 6 }
              as: SystemAdmin
              captures: { opt_a: $.data.id }
          trigger:
            - call: "POST /option-packages"
              payload: { model_id: "${m}", option_code: "BIMINI", name: "Bimini Top", price_cents: 80000, production_hours: 2, incompatible_with_option_id: "${opt_a}" }
              as: SystemAdmin
              captures: { opt_b: $.data.id, inc: $.data.incompatible_with_option_id }
          assert:
            - "OptionPackage.${opt_b}.incompatible_with_option_id == ${opt_a}"

      - name: option_package_list_filtered_by_model_id
        claim_type: listing
        grounds: ["endpoints[\"GET /option-packages\"]", "entities.OptionPackage.fields.model_id"]
        distinguishing_aspect: "GET /option-packages with model_id filter returns only options for that model."
        test_recipe:
          setup: ["Two models SP190 and SP210; SP190 has TOWER; SP210 has TOWER-XL"]
          setup_api_calls:
            - call: "POST /boat-models"
              payload: { model_code: "SP190", model_name: "Sport 190", model_year: 2027, base_price_cents: 2500000, length_feet: 19.5, production_hours: 40 }
              as: SystemAdmin
              captures: { m1: $.data.id }
            - call: "POST /boat-models"
              payload: { model_code: "SP210", model_name: "Sport 210", model_year: 2027, base_price_cents: 3000000, length_feet: 21.0, production_hours: 50 }
              as: SystemAdmin
              captures: { m2: $.data.id }
            - call: "POST /option-packages"
              payload: { model_id: "${m1}", option_code: "TOWER", name: "Wake Tower", price_cents: 350000, production_hours: 6 }
              as: SystemAdmin
            - call: "POST /option-packages"
              payload: { model_id: "${m2}", option_code: "TOWER-XL", name: "XL Tower", price_cents: 450000, production_hours: 8 }
              as: SystemAdmin
          trigger:
            - call: "GET /option-packages?model_id=${m1}"
              payload: {}
              as: Any
              captures: { first_code: "$.data[0].option_code" }
          assert:
            - "Filtered list length == 1 and option_code == TOWER (only SP190 option returned)"

      - name: order_option_line_immutable_no_update_endpoint
        claim_type: immutability
        grounds: ["entities.OrderOptionLine"]
        distinguishing_aspect: "OrderOptionLine has common_fields:false (no version field) and no PATCH endpoint exists in §1.5 — it is an event/line entity mutated only by atomic replacement via PATCH /dealer-orders/{id}."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /boat-models"
              payload: { model_code: "SP190", model_name: "Sport 190", model_year: 2027, base_price_cents: 2500000, length_feet: 19.5, production_hours: 40 }
              as: SystemAdmin
          assert:
            - "§1.5 declares no PATCH /order-option-lines or PATCH /order-option-lines/{id} — line replacement only via parent PATCH /dealer-orders/{id}"

      - name: boat_show_event_creation_validates_date_order
        claim_type: type_constraint
        grounds: ["entities.BoatShowEvent.fields.start_date", "entities.BoatShowEvent.fields.end_date", "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "BoatShowEvent with end_date < start_date returns ERR_INVALID_REQUEST 400."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /boat-show-events"
              payload: { event_name: "Miami", region: "SE", start_date: "2026-08-15", end_date: "2026-08-10", surge_deposit_rate: 0.05, allocation_boost: 1 }
              as: AllocationManager
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_REQUEST (end_date must be >= start_date)"

      - name: production_run_week_must_be_exactly_seven_days
        claim_type: type_constraint
        grounds: ["entities.ProductionRun.fields.build_week_end", "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "ProductionRun with build_week_end != build_week_start + 7 days returns ERR_INVALID_REQUEST 400."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /production-runs"
              payload: { plant_line_code: "L1", season: "PEAK", build_week_start: "2026-08-03", build_week_end: "2026-08-12", option_change_cutoff_at: "2026-08-05T12:00:00Z" }
              as: ProductionPlanner
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_REQUEST (build week must be exactly 7 days)"

      - name: recall_campaign_serial_range_must_be_ordered
        claim_type: type_constraint
        grounds: ["entities.RecallCampaign.fields.hin_serial_start", "entities.RecallCampaign.fields.hin_serial_end", "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "RecallCampaign with hin_serial_start > hin_serial_end returns ERR_INVALID_REQUEST 400."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /recall-campaigns"
              payload: { campaign_code: "RC-1", severity: "SAFETY_STOP", model_code: "SP190", model_year: 2027, hin_serial_start: 10, hin_serial_end: 5 }
              as: ComplianceOfficer
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_REQUEST (serial range inverted)"

      - name: hull_fields_created_by_user_id_stamped
        claim_type: system_field
        grounds: ["entities.Hull.fields.created_by_user_id"]
        distinguishing_aspect: "Hull.created_by_user_id is stamped from X-User-ID of the ProductionPlanner; later used for segregation of duties."
        test_recipe:
          setup: ["Order COMMITTED; hull created by planner-42"]
          setup_api_calls:
            - call: "POST /boat-models"
              payload: { model_code: "SP190", model_name: "Sport 190", model_year: 2027, base_price_cents: 2500000, length_feet: 19.5, production_hours: 40 }
              as: SystemAdmin
              captures: { m: $.data.id }
            - call: "POST /dealers"
              payload: { dealer_code: "D-1", name: "D", region: "SE", annual_allocation_quota: 5, floor_plan_limit_cents: 10000000 }
              as: AllocationManager
              captures: { d: $.data.id }
            - call: "POST /production-runs"
              payload: { plant_line_code: "L1", season: "PEAK", build_week_start: "2026-08-03", build_week_end: "2026-08-10", option_change_cutoff_at: "2026-08-05T12:00:00Z" }
              as: ProductionPlanner
              captures: { r: $.data.id }
            - call: "POST /build-slots"
              payload: { run_id: "${r}", slot_code: "S1", capacity_hours: 200 }
              as: ProductionPlanner
              captures: { s: $.data.id }
            - call: "POST /dealer-orders"
              payload: { dealer_id: "${d}", model_id: "${m}", source: "RETAIL", deposit_paid_cents: 257500, option_package_ids: [], slot_id: "${s}" }
              as: DealerPrincipal
              as_user_id: "${d}"
              captures: { o: $.data.id }
            - call: "POST /dealer-orders/${o}/confirm"
              payload: {}
              as: DealerPrincipal
              as_user_id: "${d}"
          trigger:
            - call: "POST /hulls"
              payload: { order_id: "${o}" }
              as: ProductionPlanner
              as_user_id: "planner-42"
              captures: { h: $.data.id, creator: $.data.created_by_user_id }
          assert:
            - "Hull.${h}.created_by_user_id == planner-42"
            - "Hull.${h}.certification_status == UNCERTIFIED (initial)"
            - "Hull.${h}.delivery_status == AT_PLANT (initial)"

  # ============================================================ state_machines
  - section: state_machines
    instances:
      - name: dealer_order_initial_state_allocated_when_slot_secured
        claim_type: initial_state
        grounds: ["state_machines.DealerOrder"]
        distinguishing_aspect: "DealerOrder creation with explicit slot_id that fits capacity lands directly in ALLOCATED, bypassing WAITLISTED initial state."
        test_recipe:
          setup: ["Model+dealer+run+slot all OPEN"]
          setup_api_calls:
            - call: "POST /boat-models"
              payload: { model_code: "SP190", model_name: "Sport 190", model_year: 2027, base_price_cents: 2500000, length_feet: 19.5, production_hours: 40 }
              as: SystemAdmin
              captures: { m: $.data.id }
            - call: "POST /dealers"
              payload: { dealer_code: "D-1", name: "D", region: "SE", annual_allocation_quota: 5, floor_plan_limit_cents: 10000000 }
              as: AllocationManager
              captures: { d: $.data.id }
            - call: "POST /production-runs"
              payload: { plant_line_code: "L1", season: "PEAK", build_week_start: "2026-08-03", build_week_end: "2026-08-10", option_change_cutoff_at: "2026-08-05T12:00:00Z" }
              as: ProductionPlanner
              captures: { r: $.data.id }
            - call: "POST /build-slots"
              payload: { run_id: "${r}", slot_code: "S1", capacity_hours: 200 }
              as: ProductionPlanner
              captures: { s: $.data.id }
          trigger:
            - call: "POST /dealer-orders"
              payload: { dealer_id: "${d}", model_id: "${m}", source: "RETAIL", deposit_paid_cents: 257500, option_package_ids: [], slot_id: "${s}" }
              as: DealerPrincipal
              as_user_id: "${d}"
              captures: { o: $.data.id, st: $.data.status }
          assert:
            - "DealerOrder.${o}.status == ALLOCATED (slot secured at creation)"

      - name: dealer_order_initial_state_waitlisted_when_no_slot_fits
        claim_type: initial_state
        grounds: ["state_machines.DealerOrder"]
        distinguishing_aspect: "DealerOrder creation without slot_id and no OPEN slot with capacity lands in WAITLISTED initial state."
        test_recipe:
          setup: ["Model+dealer created; NO runs or slots exist"]
          setup_api_calls:
            - call: "POST /boat-models"
              payload: { model_code: "SP190", model_name: "Sport 190", model_year: 2027, base_price_cents: 2500000, length_feet: 19.5, production_hours: 40 }
              as: SystemAdmin
              captures: { m: $.data.id }
            - call: "POST /dealers"
              payload: { dealer_code: "D-1", name: "D", region: "SE", annual_allocation_quota: 5, floor_plan_limit_cents: 10000000 }
              as: AllocationManager
              captures: { d: $.data.id }
          trigger:
            - call: "POST /dealer-orders"
              payload: { dealer_id: "${d}", model_id: "${m}", source: "RETAIL", deposit_paid_cents: 257500, option_package_ids: [] }
              as: DealerPrincipal
              as_user_id: "${d}"
              captures: { o: $.data.id, st: $.data.status, sl: $.data.slot_id }
          assert:
            - "DealerOrder.${o}.status == WAITLISTED (no slot available)"
            - "DealerOrder.${o}.slot_id == null"

      - name: dealer_order_terminal_lockdown_cancelled
        claim_type: terminal_lockdown
        grounds: ["state_machines.DealerOrder"]
        distinguishing_aspect: "CANCELLED is terminal: confirm, amend, cancel all rejected with ERR_INVALID_ORDER_STATE."
        test_recipe:
          setup: ["Order WAITLISTED then cancelled"]
          setup_api_calls:
            - call: "POST /boat-models"
              payload: { model_code: "SP190", model_name: "Sport 190", model_year: 2027, base_price_cents: 2500000, length_feet: 19.5, production_hours: 40 }
              as: SystemAdmin
              captures: { m: $.data.id }
            - call: "POST /dealers"
              payload: { dealer_code: "D-1", name: "D", region: "SE", annual_allocation_quota: 5, floor_plan_limit_cents: 10000000 }
              as: AllocationManager
              captures: { d: $.data.id }
            - call: "POST /dealer-orders"
              payload: { dealer_id: "${d}", model_id: "${m}", source: "RETAIL", deposit_paid_cents: 257500, option_package_ids: [] }
              as: DealerPrincipal
              as_user_id: "${d}"
              captures: { o: $.data.id }
            - call: "POST /dealer-orders/${o}/cancel"
              payload: {}
              as: DealerPrincipal
              as_user_id: "${d}"
            - call: "GET /dealer-orders/${o}"
              payload: {}
              as: Any
              captures: { ov: $.data.version }
          trigger:
            - call: "POST /dealer-orders/${o}/confirm"
              payload: {}
              as: DealerPrincipal
              as_user_id: "${d}"
              captures: { err1: $.data.error_id }
            - call: "PATCH /dealer-orders/${o}"
              payload: { expected_order_version: "${ov}", deposit_paid_cents: 257500 }
              as: DealerPrincipal
              as_user_id: "${d}"
              captures: { err2: $.data.error_id }
          assert:
            - "POST confirm on CANCELLED returns ERR_INVALID_ORDER_STATE"
            - "PATCH on CANCELLED returns ERR_INVALID_ORDER_STATE"

      - name: dealer_order_amend_rejected_on_committed
        claim_type: invalid_transition
        grounds: ["state_machines.DealerOrder.COMMITTED_to_IN_PRODUCTION", "errors[ERR_INVALID_ORDER_STATE]"]
        distinguishing_aspect: "PATCH /dealer-orders/{id} on COMMITTED order rejected with ERR_INVALID_ORDER_STATE (amend only legal from WAITLISTED/ALLOCATED)."
        test_recipe:
          setup: ["Order ALLOCATED then confirmed to COMMITTED"]
          setup_api_calls:
            - call: "POST /boat-models"
              payload: { model_code: "SP190", model_name: "Sport 190", model_year: 2027, base_price_cents: 2500000, length_feet: 19.5, production_hours: 40 }
              as: SystemAdmin
              captures: { m: $.data.id }
            - call: "POST /dealers"
              payload: { dealer_code: "D-1", name: "D", region: "SE", annual_allocation_quota: 5, floor_plan_limit_cents: 10000000 }
              as: AllocationManager
              captures: { d: $.data.id }
            - call: "POST /production-runs"
              payload: { plant_line_code: "L1", season: "PEAK", build_week_start: "2026-08-03", build_week_end: "2026-08-10", option_change_cutoff_at: "2026-08-05T12:00:00Z" }
              as: ProductionPlanner
              captures: { r: $.data.id }
            - call: "POST /build-slots"
              payload: { run_id: "${r}", slot_code: "S1", capacity_hours: 200 }
              as: ProductionPlanner
              captures: { s: $.data.id }
            - call: "POST /dealer-orders"
              payload: { dealer_id: "${d}", model_id: "${m}", source: "RETAIL", deposit_paid_cents: 257500, option_package_ids: [], slot_id: "${s}" }
              as: DealerPrincipal
              as_user_id: "${d}"
              captures: { o: $.data.id }
            - call: "POST /dealer-orders/${o}/confirm"
              payload: {}
              as: DealerPrincipal
              as_user_id: "${d}"
            - call: "GET /dealer-orders/${o}"
              payload: {}
              as: Any
              captures: { ov: $.data.version }
          trigger:
            - call: "PATCH /dealer-orders/${o}"
              payload: { expected_order_version: "${ov}", deposit_paid_cents: 300000 }
              as: DealerPrincipal
              as_user_id: "${d}"
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_ORDER_STATE (amend on COMMITTED)"

      - name: dealer_order_cancel_rejected_on_in_production
        claim_type: invalid_transition
        grounds: ["state_machines.DealerOrder.IN_PRODUCTION_to_CANCELLED", "errors[ERR_INVALID_ORDER_STATE]"]
        distinguishing_aspect: "POST /dealer-orders/{id}/cancel on IN_PRODUCTION order rejected with ERR_INVALID_ORDER_STATE (production already started)."
        test_recipe:
          setup: ["Order COMMITTED, hull created -> IN_PRODUCTION"]
          setup_api_calls:
            - call: "POST /boat-models"
              payload: { model_code: "SP190", model_name: "Sport 190", model_year: 2027, base_price_cents: 2500000, length_feet: 19.5, production_hours: 40 }
              as: SystemAdmin
              captures: { m: $.data.id }
            - call: "POST /dealers"
              payload: { dealer_code: "D-1", name: "D", region: "SE", annual_allocation_quota: 5, floor_plan_limit_cents: 10000000 }
              as: AllocationManager
              captures: { d: $.data.id }
            - call: "POST /production-runs"
              payload: { plant_line_code: "L1", season: "PEAK", build_week_start: "2026-08-03", build_week_end: "2026-08-10", option_change_cutoff_at: "2026-08-05T12:00:00Z" }
              as: ProductionPlanner
              captures: { r: $.data.id }
            - call: "POST /build-slots"
              payload: { run_id: "${r}", slot_code: "S1", capacity_hours: 200 }
              as: ProductionPlanner
              captures: { s: $.data.id }
            - call: "POST /dealer-orders"
              payload: { dealer_id: "${d}", model_id: "${m}", source: "RETAIL", deposit_paid_cents: 257500, option_package_ids: [], slot_id: "${s}" }
              as: DealerPrincipal
              as_user_id: "${d}"
              captures: { o: $.data.id }
            - call: "POST /dealer-orders/${o}/confirm"
              payload: {}
              as: DealerPrincipal
              as_user_id: "${d}"
            - call: "POST /hulls"
              payload: { order_id: "${o}" }
              as: ProductionPlanner
              as_user_id: "planner-1"
          trigger:
            - call: "POST /dealer-orders/${o}/cancel"
              payload: {}
              as: DealerPrincipal
              as_user_id: "${d}"
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_ORDER_STATE (cancel on IN_PRODUCTION rejected)"

      - name: production_run_terminal_lockdown_closed
        claim_type: terminal_lockdown
        grounds: ["state_machines.ProductionRun", "errors[ERR_RUN_NOT_OPEN]"]
        distinguishing_aspect: "Second POST /production-runs/{id}/close on already-CLOSED run returns ERR_RUN_NOT_OPEN."
        test_recipe:
          setup: ["Run closed once"]
          setup_api_calls:
            - call: "POST /production-runs"
