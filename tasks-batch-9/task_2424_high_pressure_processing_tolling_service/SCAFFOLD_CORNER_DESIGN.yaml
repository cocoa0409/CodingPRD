            - { call: "POST /product-qualifications", payload: { customer_id: "${cust2_id}", product_family_id: "${ded_id}", sku_code: "DED-B", version_label: "REV-A", pressure_mpa: 600.0, hold_time_seconds: 180, max_water_temp_c: 8.0, package_format: "POUCH", package_burst_pressure_mpa: 660.0, film_thickness_micron: 90, target_log_reduction: 5.0 }, as: Customer, as_user_id: "${cust2_id}", captures: { qb_id: $.data.id } }
            - { call: "POST /product-qualifications/${qb_id}/submit", payload: {}, as: Customer, as_user_id: "${cust2_id}" }
            - &c_vrun_b { call: "POST /product-qualifications/${qb_id}/validation-runs", payload: { measured_pressure_mpa: 600.0, measured_hold_time_seconds: 180, achieved_log_reduction: 5.2, package_integrity_result: "PASS", units_tested: 50, leaker_count: 0 }, as: QualityManager, as_user_id: "qm_alice" }
            - *c_vrun_b
            - { call: "POST /product-qualifications/${qb_id}/decision", payload: { outcome: "QUALIFY" }, as: QualityManager, as_user_id: "qm_alice" }
            - *c_contract
            - *c_activate
            - &c_contract2 { call: "POST /capacity-contracts", payload: { customer_id: "${cust2_id}", season_code: "FY26", window_start: "2026-08-01T00:00:00Z", window_end: "2026-12-31T23:59:59Z", committed_slots: 5, slot_take_or_pay_cents: 60000, priority_rank: 2, peak_window_start: "2026-10-01T00:00:00Z", peak_window_end: "2026-11-30T23:59:59Z", peak_multiplier: 1.25 }, as: FacilityAdmin, captures: { contract2_id: $.data.id } }
            - { call: "POST /capacity-contracts/${contract2_id}/activate", payload: {}, as: FacilityAdmin }
            - { call: "POST /lots", payload: { customer_id: "${cust_id}", qualification_id: "${qa_id}", cold_room_id: "${room_id}", pallet_ref: "PAL-A", unit_count: 500, gross_weight_kg: 320.0, carrier_temp_c: 2.5, ship_by: "2026-08-20T00:00:00Z" }, as: PlantOperator, captures: { lota_id: $.data.id } }
            - { call: "POST /lots/${lota_id}/inspect", payload: { outcome: "ACCEPT", pulp_temp_c: 3.2 }, as: PlantOperator }
            - { call: "POST /lots", payload: { customer_id: "${cust2_id}", qualification_id: "${qb_id}", cold_room_id: "${room_id}", pallet_ref: "PAL-B", unit_count: 500, gross_weight_kg: 320.0, carrier_temp_c: 2.5, ship_by: "2026-08-20T00:00:00Z" }, as: PlantOperator, captures: { lotb_id: $.data.id } }
            - { call: "POST /lots/${lotb_id}/inspect", payload: { outcome: "ACCEPT", pulp_temp_c: 3.2 }, as: PlantOperator }
            - { call: "POST /vessel-cycles", payload: { vessel_id: "${vessel_id}", product_family_id: "${ded_id}", scheduled_start: "2026-08-05T09:00:00Z", target_pressure_mpa: 600.0, target_hold_seconds: 180 }, as: PlantScheduler, captures: { cycd_id: $.data.id, cycd_v0: $.data.version } }
            - { call: "POST /vessel-cycles/${cycd_id}/loads", payload: { lot_id: "${lota_id}", contract_id: "${contract_id}", baskets_used: 1, units_loaded: 500, expected_cycle_version: "${cycd_v0}" }, as: PlantScheduler, captures: { loada_id: $.data.id } }
            - { call: "GET /vessel-cycles/${cycd_id}", as: PlantScheduler, captures: { cycd_v1: $.data.version } }
          trigger:
            - { call: "POST /vessel-cycles/${cycd_id}/loads", payload: { lot_id: "${lotb_id}", contract_id: "${contract2_id}", baskets_used: 1, units_loaded: 500, expected_cycle_version: "${cycd_v1}" }, as: PlantScheduler, captures: { e_ded: $.data.error_id } }
          assert:
            - "HTTP 422 with data.error_id == ERR_DEDICATED_CYCLE_REQUIRED"
            - "VesselCycle.${cycd_id}.baskets_used_total == 1 and exactly 1 CycleLoad exists"
            - "CapacityContract.${contract2_id}.reserved_slots == 0 and available_slots == 5"
            - "CapacityContract.${contract_id}.reserved_slots == 1"

      - name: corner_start_below_the_qualified_process_targets_is_refused
        claim_type: Violation → Error
        grounds:
          - validations.p9[POST /vessel-cycles/{id}/start -> ERR_CYCLE_TARGET_BELOW_QUALIFIED]
          - errors[ERR_CYCLE_TARGET_BELOW_QUALIFIED]
        distinguishing_aspect: "The under-spec target is legal at scheduling time and legal at loading time; only start compares the cycle's 500 MPa against the loaded lot's qualified 600 MPa, so the pallet is already booked when the refusal lands."
        test_recipe:
          setup:
            - "the standard world; cycle CU on HPP-1 is scheduled at 500.0 MPa / 180 s and carries PAL-001"
          setup_api_calls:
            - *c_clock
            - *c_cust
            - *c_fam
            - *c_vessel
            - *c_room
            - *c_qual
            - *c_submit
            - *c_vrun
            - *c_vrun
            - *c_qualify
            - *c_contract
            - *c_activate
            - *c_lot1
            - *c_accept1
            - { call: "POST /vessel-cycles", payload: { vessel_id: "${vessel_id}", product_family_id: "${fam_id}", scheduled_start: "2026-08-05T09:00:00Z", target_pressure_mpa: 500.0, target_hold_seconds: 180 }, as: PlantScheduler, captures: { cycu_id: $.data.id, cycu_v0: $.data.version } }
            - { call: "POST /vessel-cycles/${cycu_id}/loads", payload: { lot_id: "${lot1_id}", contract_id: "${contract_id}", baskets_used: 2, units_loaded: 1000, expected_cycle_version: "${cycu_v0}" }, as: PlantScheduler, captures: { loadu_id: $.data.id } }
          trigger:
            - { call: "POST /vessel-cycles/${cycu_id}/start", payload: {}, as: PlantOperator, as_user_id: "op_bob", captures: { e_target: $.data.error_id } }
          assert:
            - "HTTP 422 with data.error_id == ERR_CYCLE_TARGET_BELOW_QUALIFIED"
            - "VesselCycle.${cycu_id}.state is still LOADED and Vessel.${vessel_id}.status == AVAILABLE"
            - "Lot.${lot1_id}.custody_state is still IN_COLD_STORAGE with units_in_vessel == 0"

      - name: corner_target_pressure_above_the_vessel_rating_is_refused
        claim_type: Violation → Error
        grounds:
          - validations.p11[POST /vessel-cycles -> ERR_PRESSURE_ABOVE_VESSEL_MAX]
          - errors[ERR_PRESSURE_ABOVE_VESSEL_MAX]
        distinguishing_aspect: "A 700 MPa target on a 600 MPa vessel is refused at scheduling time, before any temporal rule can look at the window."
        test_recipe:
          setup:
            - "vessel HPP-1 (max 600.0 MPa) and family RTE_GUAC exist; no cycles"
          setup_api_calls:
            - *c_clock
            - *c_fam
            - *c_vessel
          trigger:
            - { call: "POST /vessel-cycles", payload: { vessel_id: "${vessel_id}", product_family_id: "${fam_id}", scheduled_start: "2026-08-05T09:00:00Z", target_pressure_mpa: 700.0, target_hold_seconds: 180 }, as: PlantScheduler, captures: { e_pmax: $.data.error_id } }
          assert:
            - "HTTP 422 with data.error_id == ERR_PRESSURE_ABOVE_VESSEL_MAX"
            - "no VesselCycle row was created"

      - name: corner_basket_capacity_is_checked_against_the_running_total
        claim_type: Violation → Error
        grounds:
          - validations.p11[POST /vessel-cycles/{id}/loads -> ERR_BASKET_CAPACITY_EXCEEDED]
          - errors[ERR_BASKET_CAPACITY_EXCEEDED]
          - entities.VesselCycle.fields.baskets_used_total
        distinguishing_aspect: "2 + 3 exceeds HPP-1's 4 baskets, and the check reads the accumulated baskets_used_total rather than the single request, so the first load survives untouched."
        test_recipe:
          setup:
            - "the standard world; cycle C1 already carries PAL-001 in 2 of 4 baskets; PAL-002 (500 units) is accepted in CR-1"
          setup_api_calls:
            - *c_clock
            - *c_cust
            - *c_fam
            - *c_vessel
            - *c_room
            - *c_qual
            - *c_submit
            - *c_vrun
            - *c_vrun
            - *c_qualify
            - *c_contract
            - *c_activate
            - *c_lot1
            - *c_accept1
            - *c_cycle1
            - *c_load1
            - &c_lot2 { call: "POST /lots", payload: { customer_id: "${cust_id}", qualification_id: "${qual_id}", cold_room_id: "${room_id}", pallet_ref: "PAL-002", unit_count: 500, gross_weight_kg: 320.0, carrier_temp_c: 2.5, ship_by: "2026-08-20T00:00:00Z" }, as: PlantOperator, captures: { lot2_id: $.data.id } }
            - &c_accept2 { call: "POST /lots/${lot2_id}/inspect", payload: { outcome: "ACCEPT", pulp_temp_c: 3.2 }, as: PlantOperator }
            - &c_get_cyc1 { call: "GET /vessel-cycles/${cyc1_id}", as: PlantScheduler, captures: { cyc1_v1: $.data.version } }
          trigger:
            - { call: "POST /vessel-cycles/${cyc1_id}/loads", payload: { lot_id: "${lot2_id}", contract_id: "${contract_id}", baskets_used: 3, units_loaded: 500, expected_cycle_version: "${cyc1_v1}" }, as: PlantScheduler, captures: { e_bask: $.data.error_id } }
          assert:
            - "HTTP 422 with data.error_id == ERR_BASKET_CAPACITY_EXCEEDED"
            - "VesselCycle.${cyc1_id}.baskets_used_total is still 2 and utilization_pct == 50.00"
            - "CapacityContract.${contract_id}.reserved_slots == 1 (only the accepted load holds a slot)"

      - name: corner_leaker_count_above_the_inspected_count_is_refused
        claim_type: Violation → Error
        grounds:
          - validations.p11[POST /cycle-loads/{id}/inspection -> ERR_LEAKERS_EXCEED_INSPECTED]
          - errors[ERR_LEAKERS_EXCEED_INSPECTED]
          - calculations.load_package_chargeback_amount
        distinguishing_aspect: "An arithmetically impossible sample (101 leakers in 100 units) is refused before any ppm is computed, so no chargeback line is minted and the load stays uninspected."
        test_recipe:
          setup:
            - "the standard world with C1 DISPOSITIONED and load L1 still PENDING_INSPECTION"
          setup_api_calls:
            - *c_clock
            - *c_cust
            - *c_fam
            - *c_vessel
            - *c_room
            - *c_qual
            - *c_submit
            - *c_vrun
            - *c_vrun
            - *c_qualify
            - *c_contract
            - *c_activate
            - *c_lot1
            - *c_accept1
            - *c_cycle1
            - *c_load1
            - *c_start1
            - *c_log_clean
            - *c_disp
          trigger:
            - { call: "POST /cycle-loads/${load1_id}/inspection", payload: { units_inspected: 100, leaker_units: 101 }, as: QualityManager, as_user_id: "qm_alice", captures: { e_leak: $.data.error_id } }
          assert:
            - "HTTP 422 with data.error_id == ERR_LEAKERS_EXCEED_INSPECTED"
            - "CycleLoad.${load1_id}.inspection_state is still PENDING_INSPECTION and leaker_ppm == null"
            - "Customer.${cust_id}.chargeback_balance_cents == 0 and 0 ChargebackLine rows exist"

      - name: corner_starting_an_empty_scheduled_cycle_is_refused
        claim_type: Violation → Error
        grounds:
          - validations.p11[POST /vessel-cycles/{id}/start -> ERR_EMPTY_CYCLE]
          - validations.p8[POST /vessel-cycles/{id}/start -> ERR_INVALID_CYCLE_STATE]
          - errors[ERR_EMPTY_CYCLE]
        distinguishing_aspect: "SCHEDULED passes the priority-8 state gate for start, so an unloaded cycle falls through to the priority-11 emptiness rule and reports ERR_EMPTY_CYCLE rather than a state error."
        test_recipe:
          setup:
            - "cycle C1 is SCHEDULED on HPP-1 with no loads at all"
          setup_api_calls:
            - *c_clock
            - *c_fam
            - *c_vessel
            - *c_cycle1
          trigger:
            - { call: "POST /vessel-cycles/${cyc1_id}/start", payload: {}, as: PlantOperator, as_user_id: "op_bob", captures: { e_empty: $.data.error_id } }
          assert:
            - "HTTP 422 with data.error_id == ERR_EMPTY_CYCLE"
            - "data.error_id != ERR_INVALID_CYCLE_STATE (SCHEDULED is an accepted start state)"
            - "VesselCycle.${cyc1_id}.state is still SCHEDULED and Vessel.${vessel_id}.status == AVAILABLE"

      - name: corner_load_against_a_cycle_outside_the_contract_window_is_refused
        claim_type: Violation → Error
        grounds:
          - validations.p13[POST /vessel-cycles/{id}/loads -> ERR_CONTRACT_WINDOW_MISMATCH]
          - errors[ERR_CONTRACT_WINDOW_MISMATCH]
          - entities.CapacityContract.fields.window_end
        distinguishing_aspect: "The FY26 contract closes 2026-12-31T23:59:59Z; a cycle scheduled 2027-01-05 is refused on the window rule at priority 13, after every safety and capacity rule has already passed."
        test_recipe:
          setup:
            - "the standard world with PAL-001 accepted; cycle CN is scheduled on HPP-1 at 2027-01-05T09:00:00Z"
          setup_api_calls:
            - *c_clock
            - *c_cust
            - *c_fam
            - *c_vessel
            - *c_room
            - *c_qual
            - *c_submit
            - *c_vrun
            - *c_vrun
            - *c_qualify
            - *c_contract
            - *c_activate
            - *c_lot1
            - *c_accept1
            - { call: "POST /vessel-cycles", payload: { vessel_id: "${vessel_id}", product_family_id: "${fam_id}", scheduled_start: "2027-01-05T09:00:00Z", target_pressure_mpa: 600.0, target_hold_seconds: 180 }, as: PlantScheduler, captures: { cycn_id: $.data.id, cycn_v0: $.data.version } }
          trigger:
            - { call: "POST /vessel-cycles/${cycn_id}/loads", payload: { lot_id: "${lot1_id}", contract_id: "${contract_id}", baskets_used: 2, units_loaded: 1000, expected_cycle_version: "${cycn_v0}" }, as: PlantScheduler, captures: { e_win: $.data.error_id } }
          assert:
            - "HTTP 422 with data.error_id == ERR_CONTRACT_WINDOW_MISMATCH"
            - "the qualification was still valid (expires_at 2027-08-03T08:00:00Z), so ERR_QUALIFICATION_EXPIRED did not pre-empt this row"
            - "CapacityContract.${contract_id}.reserved_slots == 0 and available_slots == 5"

      - name: corner_duplicate_pallet_ref_for_the_same_customer_is_refused
        claim_type: Violation → Error
        grounds:
          - validations.p10[POST /lots -> ERR_DUPLICATE_PALLET_REF]
          - errors[ERR_DUPLICATE_PALLET_REF]
        distinguishing_aspect: "Uniqueness is scoped to (customer_id, pallet_ref) and is checked at priority 10, ahead of every cold-room capacity rule, so a repeat PAL-001 is a duplicate error and not a capacity error."
        test_recipe:
          setup:
            - "PAL-001 already exists for VERDE in CR-1"
          setup_api_calls:
            - *c_clock
            - *c_cust
            - *c_fam
            - *c_room
            - *c_qual
            - *c_submit
            - *c_vrun
            - *c_vrun
            - *c_qualify
            - *c_lot1
          trigger:
            - { call: "POST /lots", payload: { customer_id: "${cust_id}", qualification_id: "${qual_id}", cold_room_id: "${room_id}", pallet_ref: "PAL-001", unit_count: 250, gross_weight_kg: 160.0, carrier_temp_c: 2.5, ship_by: "2026-08-20T00:00:00Z" }, as: PlantOperator, captures: { e_dup_pal: $.data.error_id } }
          assert:
            - "HTTP 409 with data.error_id == ERR_DUPLICATE_PALLET_REF"
            - "exactly 1 Lot row exists for VERDE and its unit_count is still 1000"

      - name: corner_full_cold_room_reports_the_posture_gate_not_the_interval_rule
        claim_type: Priority Ordering
        grounds:
          - validations.p11[POST /lots -> ERR_COLD_ROOM_AT_CAPACITY]
          - validations.p12[POST /lots -> ERR_COLD_ROOM_CAPACITY_EXCEEDED]
          - state_machines.ColdRoom
        distinguishing_aspect: "Two accepted pallets flip CR-1 to AT_CAPACITY, so a third receipt violates the priority-11 posture gate and the priority-12 interval rule simultaneously; the instantaneous gate wins and the 409 names ERR_COLD_ROOM_AT_CAPACITY."
        test_recipe:
          setup:
            - "CR-1 has capacity 2 and both PAL-001 and PAL-002 have been accepted, so capacity_state == AT_CAPACITY"
          setup_api_calls:
            - *c_clock
            - *c_cust
            - *c_fam
            - *c_room
            - *c_qual
            - *c_submit
            - *c_vrun
            - *c_vrun
            - *c_qualify
            - *c_lot1
            - *c_accept1
            - *c_lot2
            - *c_accept2
          trigger:
            - { call: "POST /lots", payload: { customer_id: "${cust_id}", qualification_id: "${qual_id}", cold_room_id: "${room_id}", pallet_ref: "PAL-003", unit_count: 100, gross_weight_kg: 70.0, carrier_temp_c: 2.5, ship_by: "2026-08-20T00:00:00Z" }, as: PlantOperator, captures: { e_room: $.data.error_id } }
          assert:
            - "ColdRoom.${room_id}.occupied_pallets == 2 and capacity_state == AT_CAPACITY"
            - "HTTP 409 with data.error_id == ERR_COLD_ROOM_AT_CAPACITY"
            - "data.error_id != ERR_COLD_ROOM_CAPACITY_EXCEEDED"
            - "no third Lot row was created"

      - name: corner_cycle_state_versus_expired_qualification_ordering
        claim_type: Priority Ordering
        grounds:
          - validations.p8[POST /vessel-cycles/{id}/loads -> ERR_INVALID_CYCLE_STATE]
          - validations.p9[POST /vessel-cycles/{id}/loads -> ERR_QUALIFICATION_EXPIRED]
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / cycle_state_beats_expired_qualification_on_load
          rationale: "That instance constructs a request that violates both rows and asserts the priority-8 winner plus the priority-9 loser in isolation."

      - name: corner_unit_shortage_versus_exhausted_contract_ordering
        claim_type: Priority Ordering
        grounds:
          - validations.p11[POST /vessel-cycles/{id}/loads -> ERR_INSUFFICIENT_UNTREATED_UNITS]
          - validations.p14[POST /vessel-cycles/{id}/loads -> ERR_CONTRACT_CAPACITY_EXHAUSTED]
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / unit_shortage_beats_contract_exhaustion_on_load
          rationale: "Both the joint violation and each rule in isolation are asserted there."

      - name: corner_interval_occupancy_over_the_storage_window
        claim_type: Violation → Error
        grounds:
          - validations.p12[POST /lots -> ERR_COLD_ROOM_CAPACITY_EXCEEDED]
        excluded_because:
          difficulty_instance: resource_temporal_overlap / cold_room_closed_interval_declared_occupancy
          rationale: "That instance keeps the incumbents AT_DOCK so occupied_pallets stays 0, isolating the priority-12 interval rule from the priority-11 posture gate."

      - name: corner_vessel_window_and_cleanout_conflicts_on_scheduling
        claim_type: Violation → Error
        grounds:
          - validations.p13[POST /vessel-cycles -> ERR_VESSEL_WINDOW_CONFLICT]
          - validations.p13[POST /vessel-cycles -> ERR_CLEANOUT_GAP_REQUIRED]
        excluded_because:
          difficulty_instance: resource_temporal_overlap / vessel_half_open_windows_and_cleanout_buffer
          rationale: "Half-open touching windows, the one-second overlap and the exact cleanout-gap equality are all asserted there."

  - section: endpoints
    instances:
      - name: corner_vessel_create_read_and_status_patch_round_trip
        claim_type: Standard CRUD
        grounds:
          - endpoints[POST /vessels]
          - endpoints[GET /vessels/{id}]
          - endpoints[PATCH /vessels/{id}]
          - entities.Vessel.fields.status
        distinguishing_aspect: "The reference-data surface is create-read-update only: the vessel reads back exactly what was posted with cycles_run_count 0, and the PATCH moves status to MAINTENANCE and bumps version to 2 without touching any other field."
        test_recipe:
          setup:
            - "logical clock at 2026-08-03T08:00:00Z; no vessels"
          setup_api_calls:
            - *c_clock
            - *c_vessel
          trigger:
            - { call: "GET /vessels/${vessel_id}", as: FacilityAdmin, captures: { v_status: $.data.status } }
            - { call: "PATCH /vessels/${vessel_id}", payload: { status: "MAINTENANCE" }, as: FacilityAdmin, captures: { v_status2: $.data.status } }
            - { call: "GET /vessels/${vessel_id}", as: PlantOperator, captures: { v_ver: $.data.version } }
          assert:
            - "trigger step 1: HTTP 200 with vessel_code == HPP-1, basket_count == 4, max_pressure_mpa == 600.0, hourly_operating_cost_cents == 90000, status == AVAILABLE, cycles_run_count == 0, version == 1"
            - "trigger step 2: HTTP 200 with status == MAINTENANCE"
            - "trigger step 3: version == 2 and every other field is unchanged"

      - name: corner_activate_action_endpoint_initialises_the_slot_ledger
        claim_type: Action endpoint
        grounds:
          - endpoints[POST /capacity-contracts/{id}/activate]
          - state_machines.CapacityContract.DRAFT_to_ACTIVE
          - calculations.contract_slot_ledger
        distinguishing_aspect: "Activation is a pure action endpoint with an empty payload whose only job is to open the ledger: reserved 0, consumed 0, available == committed_slots 5, and the peak window is stored but inert."
        test_recipe:
          setup:
            - "contract FY26 for VERDE exists in DRAFT with committed_slots 5"
          setup_api_calls:
            - *c_clock
            - *c_cust
            - *c_contract
          trigger:
            - { call: "POST /capacity-contracts/${contract_id}/activate", payload: {}, as: FacilityAdmin, captures: { cstat: $.data.status } }
          assert:
            - "HTTP 200 and CapacityContract.${contract_id}.status == ACTIVE"
            - "CapacityContract.${contract_id}.reserved_slots == 0, consumed_slots == 0, available_slots == 5"
            - "CapacityContract.${contract_id}.shortfall_slots == 0 and take_or_pay_cents == 0"
            - "CapacityContract.${contract_id}.version == 2"

      - name: corner_day_close_sweep_expires_every_stale_qualification_at_once
        claim_type: Bulk action
        grounds:
          - endpoints[POST /operations/day-close]
          - state_machines.ProductQualification.QUALIFIED_to_EXPIRED
          - calculations.customer_package_failure_risk
        distinguishing_aspect: "One day-close call sweeps both of VERDE's qualifications (each qualified 2026-08-03T08:00:00Z, so each expires 2027-08-03T08:00:00Z) and reports the counts in its inline response rather than mutating one row per call."
        test_recipe:
          setup:
            - "two QUALIFIED qualifications for VERDE: GUAC-500 REV-A and SOUP-300 REV-A"
          setup_api_calls:
            - *c_clock
            - *c_cust
            - *c_fam
            - *c_qual
            - *c_submit
            - *c_vrun
            - *c_vrun
            - *c_qualify
            - { call: "POST /product-qualifications", payload: { customer_id: "${cust_id}", product_family_id: "${fam_id}", sku_code: "SOUP-300", version_label: "REV-A", pressure_mpa: 600.0, hold_time_seconds: 180, max_water_temp_c: 8.0, package_format: "POUCH", package_burst_pressure_mpa: 660.0, film_thickness_micron: 90, target_log_reduction: 5.0 }, as: Customer, as_user_id: "${cust_id}", captures: { qual2_id: $.data.id } }
            - { call: "POST /product-qualifications/${qual2_id}/submit", payload: {}, as: Customer, as_user_id: "${cust_id}" }
            - &c_vrun2 { call: "POST /product-qualifications/${qual2_id}/validation-runs", payload: { measured_pressure_mpa: 600.0, measured_hold_time_seconds: 180, achieved_log_reduction: 5.2, package_integrity_result: "PASS", units_tested: 50, leaker_count: 0 }, as: QualityManager, as_user_id: "qm_alice" }
            - *c_vrun2
            - { call: "POST /product-qualifications/${qual2_id}/decision", payload: { outcome: "QUALIFY" }, as: QualityManager, as_user_id: "qm_alice" }
          trigger:
            - { call: "POST /_clock/set_current_utc", payload: { current_utc: "2027-08-04T08:00:00Z" }, as: FacilityAdmin }
            - { call: "POST /operations/day-close", payload: {}, as: FacilityAdmin, captures: { expired_n: $.data.expired_qualification_count } }
          assert:
            - "both qualifications carried expires_at == 2027-08-03T08:00:00Z"
            - "day-close returns HTTP 200 with expired_qualification_count == 2, customers_rescored == 1 and closed_at == 2027-08-04T08:00:00Z"
            - "ProductQualification.${qual_id}.status == EXPIRED and ProductQualification.${qual2_id}.status == EXPIRED"
            - "Customer.${cust_id}.trailing_leaker_ppm == 0"

      - name: corner_load_endpoint_links_lot_cycle_and_contract_in_one_write
        claim_type: Cross-reference link
        grounds:
          - endpoints[POST /vessel-cycles/{id}/loads]
          - entities.CycleLoad.fields.contract_id
          - calculations.contract_slot_ledger
          - calculations.cycle_time_and_tolling_fee
        distinguishing_aspect: "A single write links three parents and moves both of them: the junction row carries cycle_id, lot_id and contract_id, the cycle turns LOADED with a recomputed estimate, and the contract reserves a slot."
        test_recipe:
          setup:
            - "the standard world with PAL-001 accepted in CR-1 and cycle C1 SCHEDULED on HPP-1"
          setup_api_calls:
            - *c_clock
            - *c_cust
            - *c_fam
            - *c_vessel
            - *c_room
            - *c_qual
            - *c_submit
            - *c_vrun
            - *c_vrun
            - *c_qualify
            - *c_contract
            - *c_activate
            - *c_lot1
            - *c_accept1
            - *c_cycle1
          trigger:
            - *c_load1
          assert:
            - "HTTP 201 with CycleLoad.${load1_id}.cycle_id == ${cyc1_id}, lot_id == ${lot1_id}, contract_id == ${contract_id}"
            - "CycleLoad.${load1_id}.disposition_state == PENDING, inspection_state == PENDING_INSPECTION, allocated_fee_cents == null"
            - "VesselCycle.${cyc1_id}.state == LOADED, baskets_used_total == 2, utilization_pct == 50.00, estimated_tolling_fee_cents == 11400"
            - "CapacityContract.${contract_id}.reserved_slots == 1, consumed_slots == 0, available_slots == 4, status == ACTIVE"

      - name: corner_customer_read_exposes_the_derived_risk_and_balance
        claim_type: Computed read
        grounds:
          - endpoints[GET /customers/{id}]
          - entities.Customer.fields.trailing_leaker_ppm
          - entities.Customer.fields.chargeback_balance_cents
          - calculations.customer_package_failure_risk
        distinguishing_aspect: "A 2000 ppm inspection sits above the 1500 ppm watch line but below the 3000 ppm chargeback line, and the customer's stored trailing rate is still 0, so the party is FACILITY: the customer read shows trailing_leaker_ppm 2000 after day-close with the balance still 0."
        test_recipe:
          setup:
            - "the standard world with C1 DISPOSITIONED at 2026-08-03T08:00:00Z and load L1 inspected at 2 leakers in 1000 units"
          setup_api_calls:
            - *c_clock
            - *c_cust
            - *c_fam
            - *c_vessel
            - *c_room
            - *c_qual
            - *c_submit
            - *c_vrun
            - *c_vrun
            - *c_qualify
            - *c_contract
            - *c_activate
            - *c_lot1
            - *c_accept1
            - *c_cycle1
            - *c_load1
            - *c_start1
            - *c_log_clean
            - *c_disp
            - { call: "POST /cycle-loads/${load1_id}/inspection", payload: { units_inspected: 1000, leaker_units: 2 }, as: QualityManager, as_user_id: "qm_alice" }
          trigger:
            - { call: "POST /_clock/set_current_utc", payload: { current_utc: "2026-08-03T20:00:00Z" }, as: FacilityAdmin }
            - { call: "POST /operations/day-close", payload: {}, as: FacilityAdmin, captures: { rescored_n: $.data.customers_rescored } }
            - { call: "GET /customers/${cust_id}", as: FacilityAdmin, captures: { tppm: $.data.trailing_leaker_ppm } }
          assert:
            - "CycleLoad.${load1_id}.leaker_ppm == 2000 and inspection_state == INSPECTED"
            - "no ChargebackLine was minted (chargeback_party == FACILITY because the stored trailing rate was 0)"
            - "day-close returns customers_rescored == 1"
            - "GET /customers/${cust_id} returns trailing_leaker_ppm == 2000 and chargeback_balance_cents == 0"

      - name: corner_close_is_only_available_from_an_open_contract
        claim_type: Conditional action
        grounds:
          - endpoints[POST /capacity-contracts/{id}/close]
          - state_machines.CapacityContract.ACTIVE_to_CLOSED
          - calculations.contract_take_or_pay_shortfall
          - errors[ERR_INVALID_CONTRACT_STATE]
        distinguishing_aspect: "Close is conditional on the contract being open: from DRAFT it is refused, and once activated the same call closes it and freezes a 4-slot shortfall (ceil(5 * 0.80) == 4) worth 240000 cents."
        test_recipe:
          setup:
            - "contract FY26 for VERDE exists in DRAFT with committed_slots 5 and slot_take_or_pay_cents 60000"
          setup_api_calls:
            - *c_clock
            - *c_cust
            - *c_contract
          trigger:
            - { call: "POST /capacity-contracts/${contract_id}/close", payload: {}, as: FacilityAdmin, captures: { e_close: $.data.error_id } }
            - *c_activate
            - { call: "POST /capacity-contracts/${contract_id}/close", payload: {}, as: FacilityAdmin, captures: { closed_status: $.data.status } }
            - { call: "GET /chargeback-lines?customer_id=${cust_id}", as: FacilityAdmin, captures: { top4_id: "$.data[0].id" } }
          assert:
            - "trigger step 1: HTTP 409 with data.error_id == ERR_INVALID_CONTRACT_STATE and status still DRAFT"
            - "trigger step 3: HTTP 200 with status == CLOSED, shortfall_slots == 4, take_or_pay_cents == 240000"
            - "ChargebackLine.${top4_id}.basis == TAKE_OR_PAY_SHORTFALL and amount_cents == 240000"
            - "Customer.${cust_id}.chargeback_balance_cents == 240000"

  - section: errors
    instances:
      - name: corner_every_path_id_404_names_its_own_entity
        claim_type: Triggerable
        grounds:
          - errors[ERR_CUSTOMER_NOT_FOUND]
          - errors[ERR_PRODUCT_FAMILY_NOT_FOUND]
          - errors[ERR_VESSEL_NOT_FOUND]
          - errors[ERR_COLD_ROOM_NOT_FOUND]
          - errors[ERR_CONTRACT_NOT_FOUND]
          - errors[ERR_LOT_NOT_FOUND]
          - errors[ERR_CYCLE_LOAD_NOT_FOUND]
          - errors[ERR_DEVIATION_NOT_FOUND]
          - errors[ERR_CHARGEBACK_LINE_NOT_FOUND]
          - validations.p4
        distinguishing_aspect: "Priority 4 resolves the path id per entity, so nine different single-resource reads on an empty database return nine distinct 404 error_ids rather than one shared code."
        test_recipe:
          setup:
            - "logical clock set; the database holds no rows of any of these nine entities"
          setup_api_calls:
            - *c_clock
          trigger:
            - { call: "GET /customers/00000000-0000-4000-8000-000000000001", as: FacilityAdmin, captures: { e_cust: $.data.error_id } }
            - { call: "GET /product-families/00000000-0000-4000-8000-000000000002", as: FacilityAdmin, captures: { e_famnf: $.data.error_id } }
            - { call: "GET /vessels/00000000-0000-4000-8000-000000000003", as: FacilityAdmin, captures: { e_vesnf: $.data.error_id } }
            - { call: "GET /cold-rooms/00000000-0000-4000-8000-000000000004", as: FacilityAdmin, captures: { e_roomnf: $.data.error_id } }
            - { call: "GET /capacity-contracts/00000000-0000-4000-8000-000000000005", as: FacilityAdmin, captures: { e_connf: $.data.error_id } }
            - { call: "GET /lots/00000000-0000-4000-8000-000000000006", as: QualityManager, as_user_id: "qm_alice", captures: { e_lotnf: $.data.error_id } }
            - { call: "GET /cycle-loads/00000000-0000-4000-8000-000000000007", as: FacilityAdmin, captures: { e_loadnf: $.data.error_id } }
            - { call: "GET /deviations/00000000-0000-4000-8000-000000000008", as: FacilityAdmin, captures: { e_devnf: $.data.error_id } }
            - { call: "GET /chargeback-lines/00000000-0000-4000-8000-000000000009", as: FacilityAdmin, captures: { e_cbnf: $.data.error_id } }
          assert:
            - "every call returns HTTP 404 with response_type == error"
            - "the nine error_ids are, in order: ERR_CUSTOMER_NOT_FOUND, ERR_PRODUCT_FAMILY_NOT_FOUND, ERR_VESSEL_NOT_FOUND, ERR_COLD_ROOM_NOT_FOUND, ERR_CONTRACT_NOT_FOUND, ERR_LOT_NOT_FOUND, ERR_CYCLE_LOAD_NOT_FOUND, ERR_DEVIATION_NOT_FOUND, ERR_CHARGEBACK_LINE_NOT_FOUND"

      - name: corner_body_foreign_keys_404_by_referenced_entity
        claim_type: Triggerable
        grounds:
          - errors[ERR_CUSTOMER_NOT_FOUND]
          - errors[ERR_COLD_ROOM_NOT_FOUND]
          - errors[ERR_VESSEL_NOT_FOUND]
          - errors[ERR_PRODUCT_FAMILY_NOT_FOUND]
          - errors[ERR_LOT_NOT_FOUND]
          - errors[ERR_CONTRACT_NOT_FOUND]
          - validations.p5
        distinguishing_aspect: "Priority 5 resolves body foreign keys one entity at a time: each request below carries exactly one unknown id against an otherwise complete world, so the reported code identifies which reference failed."
        test_recipe:
          setup:
            - "the standard world with QUALIFIED GUAC-500, CR-1, HPP-1, ACTIVE FY26, PAL-001 accepted and cycle C1 SCHEDULED"
          setup_api_calls:
            - *c_clock
            - *c_cust
            - *c_fam
            - *c_vessel
            - *c_room
            - *c_qual
            - *c_submit
            - *c_vrun
            - *c_vrun
            - *c_qualify
            - *c_contract
            - *c_activate
            - *c_lot1
            - *c_accept1
            - *c_cycle1
          trigger:
            - { call: "POST /lots", payload: { customer_id: "00000000-0000-4000-8000-0000000000a1", qualification_id: "${qual_id}", cold_room_id: "${room_id}", pallet_ref: "PAL-FK1", unit_count: 100, gross_weight_kg: 70.0, carrier_temp_c: 2.5, ship_by: "2026-08-20T00:00:00Z" }, as: PlantOperator, captures: { e_fk_cust: $.data.error_id } }
            - { call: "POST /lots", payload: { customer_id: "${cust_id}", qualification_id: "${qual_id}", cold_room_id: "00000000-0000-4000-8000-0000000000a2", pallet_ref: "PAL-FK2", unit_count: 100, gross_weight_kg: 70.0, carrier_temp_c: 2.5, ship_by: "2026-08-20T00:00:00Z" }, as: PlantOperator, captures: { e_fk_room: $.data.error_id } }
            - { call: "POST /vessel-cycles", payload: { vessel_id: "00000000-0000-4000-8000-0000000000a3", product_family_id: "${fam_id}", scheduled_start: "2026-08-06T09:00:00Z", target_pressure_mpa: 600.0, target_hold_seconds: 180 }, as: PlantScheduler, captures: { e_fk_ves: $.data.error_id } }
            - { call: "POST /vessel-cycles", payload: { vessel_id: "${vessel_id}", product_family_id: "00000000-0000-4000-8000-0000000000a4", scheduled_start: "2026-08-06T09:00:00Z", target_pressure_mpa: 600.0, target_hold_seconds: 180 }, as: PlantScheduler, captures: { e_fk_fam: $.data.error_id } }
            - { call: "POST /vessel-cycles/${cyc1_id}/loads", payload: { lot_id: "00000000-0000-4000-8000-0000000000a5", contract_id: "${contract_id}", baskets_used: 1, units_loaded: 100, expected_cycle_version: "${cyc1_v0}" }, as: PlantScheduler, captures: { e_fk_lot: $.data.error_id } }
            - { call: "POST /vessel-cycles/${cyc1_id}/loads", payload: { lot_id: "${lot1_id}", contract_id: "00000000-0000-4000-8000-0000000000a6", baskets_used: 1, units_loaded: 100, expected_cycle_version: "${cyc1_v0}" }, as: PlantScheduler, captures: { e_fk_con: $.data.error_id } }
          assert:
            - "the six error_ids are, in order: ERR_CUSTOMER_NOT_FOUND, ERR_COLD_ROOM_NOT_FOUND, ERR_VESSEL_NOT_FOUND, ERR_PRODUCT_FAMILY_NOT_FOUND, ERR_LOT_NOT_FOUND, ERR_CONTRACT_NOT_FOUND, each with HTTP 404"
            - "no Lot, VesselCycle or CycleLoad row was created by any of the six calls"
            - "VesselCycle.${cyc1_id}.state is still SCHEDULED with version ${cyc1_v0}"

      - name: corner_each_uniqueness_constraint_has_its_own_code
        claim_type: Triggerable
        grounds:
          - errors[ERR_DUPLICATE_CUSTOMER_CODE]
          - errors[ERR_DUPLICATE_FAMILY_CODE]
          - errors[ERR_DUPLICATE_VESSEL_CODE]
          - errors[ERR_DUPLICATE_ROOM_CODE]
          - errors[ERR_DUPLICATE_QUALIFICATION_VERSION]
          - errors[ERR_DUPLICATE_CONTRACT_SEASON]
          - validations.p10
        distinguishing_aspect: "Six independent uniqueness scopes each answer with their own 409 code; the qualification scope is the composite (customer_id, sku_code, version_label) and the contract scope is (customer_id, season_code)."
        test_recipe:
          setup:
            - "VERDE, RTE_GUAC, HPP-1, CR-1, GUAC-500 REV-A and contract FY26 all exist exactly once"
          setup_api_calls:
            - *c_clock
            - *c_cust
            - *c_fam
            - *c_vessel
            - *c_room
            - *c_qual
            - *c_contract
          trigger:
            - { call: "POST /customers", payload: { name: "Verde Foods Duplicate", code: "VERDE", billing_email: "dup@verde.example" }, as: FacilityAdmin, captures: { e_dc: $.data.error_id } }
            - { call: "POST /product-families", payload: { family_code: "RTE_GUAC", cross_contamination_group: "RTE_PRODUCE", cleanout_minutes: 45, max_receipt_temp_c: 4.0, max_outbound_temp_c: 4.0, requires_dedicated_cycle: false }, as: FacilityAdmin, captures: { e_df: $.data.error_id } }
            - { call: "POST /vessels", payload: { vessel_code: "HPP-1", chamber_volume_liters: 350, max_pressure_mpa: 600.0, pump_ramp_rate_mpa_per_sec: 6.0, decompression_seconds: 12, basket_count: 4, hourly_operating_cost_cents: 90000 }, as: FacilityAdmin, captures: { e_dv: $.data.error_id } }
            - { call: "POST /cold-rooms", payload: { room_code: "CR-1", capacity_pallets: 2, setpoint_c: 2.0, allowed_family_groups: ["RTE_PRODUCE"] }, as: FacilityAdmin, captures: { e_dr: $.data.error_id } }
            - { call: "POST /product-qualifications", payload: { customer_id: "${cust_id}", product_family_id: "${fam_id}", sku_code: "GUAC-500", version_label: "REV-A", pressure_mpa: 600.0, hold_time_seconds: 180, max_water_temp_c: 8.0, package_format: "POUCH", package_burst_pressure_mpa: 660.0, film_thickness_micron: 90, target_log_reduction: 5.0 }, as: Customer, as_user_id: "${cust_id}", captures: { e_dq: $.data.error_id } }
            - { call: "POST /capacity-contracts", payload: { customer_id: "${cust_id}", season_code: "FY26", window_start: "2026-08-01T00:00:00Z", window_end: "2026-12-31T23:59:59Z", committed_slots: 3, slot_take_or_pay_cents: 50000, priority_rank: 3, peak_window_start: "2026-10-01T00:00:00Z", peak_window_end: "2026-11-30T23:59:59Z", peak_multiplier: 1.10 }, as: FacilityAdmin, captures: { e_dcs: $.data.error_id } }
          assert:
            - "the six error_ids are, in order: ERR_DUPLICATE_CUSTOMER_CODE, ERR_DUPLICATE_FAMILY_CODE, ERR_DUPLICATE_VESSEL_CODE, ERR_DUPLICATE_ROOM_CODE, ERR_DUPLICATE_QUALIFICATION_VERSION, ERR_DUPLICATE_CONTRACT_SEASON, each with HTTP 409"
            - "exactly one row still exists for each of the six entities"

      - name: corner_second_load_of_the_same_pallet_on_one_cycle_is_refused
        claim_type: Triggerable
        grounds:
          - errors[ERR_DUPLICATE_CYCLE_LOAD]
          - validations.p8[POST /vessel-cycles/{id}/loads -> ERR_DUPLICATE_CYCLE_LOAD]
        distinguishing_aspect: "The same pallet cannot occupy one cycle twice even with a fresh expected_cycle_version and enough spare baskets, so the refusal is the duplicate rule rather than an OCC or capacity failure."
        test_recipe:
          setup:
            - "the standard world; cycle C1 is LOADED with PAL-001 in 2 of 4 baskets"
          setup_api_calls:
            - *c_clock
            - *c_cust
            - *c_fam
            - *c_vessel
            - *c_room
            - *c_qual
            - *c_submit
            - *c_vrun
            - *c_vrun
            - *c_qualify
            - *c_contract
