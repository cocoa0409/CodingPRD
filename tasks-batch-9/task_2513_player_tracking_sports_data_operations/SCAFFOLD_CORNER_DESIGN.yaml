      - name: calibration_result_gate_precedes_the_installation_state_gate
        claim_type: priority_ordering
        grounds:
          - validations[priority=39]
          - validations[priority=40]
          - errors[ERR_CALIBRATION_NOT_PASSING]
          - state_machines.TrackingInstallation
        distinguishing_aspect: |
          On a never-calibrated DEPLOYED rig both gates are violated (latest_run_result is null, and DEPLOYED
          is outside certify's {VALIDATED} from-set); the accuracy answer must win because it is the more
          informative one. A FAIL run moves the rig to CALIBRATING and still yields
          ERR_CALIBRATION_NOT_PASSING, and only after a PASS run does certify succeed.
        test_recipe:
          setup:
            - "logical clock at 2026-08-01T12:00:00Z; Harbor Arena with one DEPLOYED rig and no calibration runs"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T12:00:00Z" }
              as: LeagueDataOps
              as_user_id: "ops-01"
            - call: "POST /venues"
              payload: { name: "Harbor Arena", city: "Harbor", tracking_tech: "HYBRID", required_certified_installations: 1, transport_capacity_mbps: 100, min_achievable_latency_ms: 200 }
              as: LeagueDataOps
              as_user_id: "ops-01"
              captures: { v_id: $.data.id }
            - call: "POST /installations"
              payload: { venue_id: "${v_id}", rig_label: "RIG-A", modality: "OPTICAL_CAMERA" }
              as: LeagueDataOps
              as_user_id: "ops-01"
              captures: { i_id: $.data.id }
          trigger:
            - call: "POST /installations/${i_id}/certify"
              as: LeagueDataOps
              as_user_id: "ops-01"
              captures: { e_nopass: $.data.error_id }
            - call: "POST /installations/${i_id}/calibration-runs"
              payload: { axis_rms_x_mm: 200.0, axis_rms_y_mm: 200.0, axis_rms_z_mm: 200.0, sample_count: 6000, reference_point_count: 16 }
              as: CalibrationEngineer
              as_user_id: "eng-01"
              captures: { r_fail: $.data.result }
            - call: "POST /installations/${i_id}/certify"
              as: LeagueDataOps
              as_user_id: "ops-01"
              captures: { e_nopass2: $.data.error_id }
            - call: "POST /installations/${i_id}/calibration-runs"
              payload: { axis_rms_x_mm: 90.0, axis_rms_y_mm: 90.0, axis_rms_z_mm: 90.0, sample_count: 6000, reference_point_count: 16 }
              as: CalibrationEngineer
              as_user_id: "eng-01"
              captures: { r_pass: $.data.result }
            - call: "POST /installations/${i_id}/certify"
              as: LeagueDataOps
              as_user_id: "ops-01"
              captures: { final_status: $.data.status }
          assert:
            - "call 1: HTTP 409 error_id \"ERR_CALIBRATION_NOT_PASSING\" - NOT ERR_INVALID_INSTALLATION_STATE, although DEPLOYED is outside certify's from-set"
            - "call 2: HTTP 201 with data.composite_rms_mm == 200.00 and data.result \"FAIL\"; the rig is CALIBRATING"
            - "call 3: HTTP 409 error_id \"ERR_CALIBRATION_NOT_PASSING\" again (CALIBRATING is also outside the from-set; the accuracy gate still answers first)"
            - "call 4: HTTP 201 with data.result \"PASS\"; GET /installations/${i_id} shows status \"VALIDATED\", calibration_run_count 2, latest_run_composite_rms_mm 90.00"
            - "call 5: HTTP 200 with data.status \"CERTIFIED\"; GET /venues/${v_id} shows data_posture \"CERTIFIED\", certified_installation_count 1, active_installation_count 1"

      - name: certification_valid_at_exactly_seventy_two_hours_expired_at_seventy_three
        claim_type: violation_to_error
        grounds:
