      - name: a_second_forward_receipt_is_refused_but_a_reversed_subject_may_be_receipted_again
        claim_type: Violation → Error
        grounds:
          - validations[priority=33]
          - validations[priority=10]
          - errors.ERR_DUPLICATE_RECEIPT
          - errors.ERR_RECEIPT_IMMUTABLE
        distinguishing_aspect: "The uniqueness rule counts only UN-REVERSED forward receipts, so the same registration is refused a second receipt while the first is live and then accepted once the first is reversed - and the append-only rule refuses both reversing the same receipt twice and reversing a REVERSAL row."
        test_recipe:
          setup:
            - "An OPEN outing with one CONFIRMED registration on a 30000 tier whose gsv_cents is 0, so the receipt's deductible_amount_cents is the full 30000."
          setup_api_calls:
