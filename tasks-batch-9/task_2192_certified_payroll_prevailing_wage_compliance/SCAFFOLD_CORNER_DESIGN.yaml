          rationale: "That §1.8 instance asserts both stored credits and their 147-cent delta from a single plan row."

      - name: underpayment_variant_divergence_on_one_finalized_week
        claim_type: variant_divergence
        grounds:
          - calculations.underpayment_restitution.variants
        excluded_because:
          difficulty_instance: dual_variant_calc / underpayment_straight_time_only_vs_full_make_whole
          rationale: "That §1.8 instance asserts both totals and the 6400-cent delta on one finalized submission."

      - name: per_line_rounding_order_changes_the_submission_total
        claim_type: precision
        grounds:
          - calculations.underpayment_restitution
        excluded_because:
          difficulty_instance: combinatorial_formula / per_line_rounding_then_sum_beats_aggregate_then_round_by_one_cent
          rationale: "That §1.8 instance pins round-then-sum against sum-then-round with a one-cent separation."

      - name: apprentice_ratio_single_pass_fixed_point
        claim_type: constraint_propagation
        grounds:
          - calculations.apprentice_ratio_compliance
        excluded_because:
          difficulty_instance: combinatorial_formula / apprentice_ratio_single_pass_pins_circular_reclassification
          rationale: "That §1.8 instance asserts the single-pass answer against the second-pass answer the circular reading would produce."

      - name: posture_freeze_dollar_threshold_is_strictly_greater_than
        claim_type: threshold_boundary
        grounds:
          - calculations.project_posture.constants.POSTURE_FROZEN_RESTITUTION_CENTS
        excluded_because:
