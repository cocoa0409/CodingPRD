# =============================================================================
# Cable/Satellite TV Subscription — seed tables (SCAFFOLD.yaml)
# §1.0–§1.7 + preamble. No scaffold_difficulty_design / scaffold_corner_design keys.
# =============================================================================

scenario: |
  Cable/Satellite TV Subscription: package/channel tiers, premium & add-on channels,
  equipment (box/DVR) lease, install/service visit, promotional pricing & rollback,
  regional sports fee, downgrade/win-back, early-termination fee

domain_name: cable-satellite-tv-subscription
api_prefix: ""   # multi-root REST surface; collections are first path segment (/accounts, /channel-packages, ...)

# =============================================================================
# Complexity Profile (§0.1–§0.4) — Expert
# =============================================================================
complexity_profile:
  primary_archetype: pricing_engine
  secondary_archetype: event_sourcing
  complexity_layers:
    - dual_variant_calculation        # proration-on-the-day vs full-cycle catalog price; promo-active vs rolled-back
    - cascading_side_effects          # downgrade -> add-on auto-drop -> equipment lease recompute -> recurring-charge recompute
    - rate_threshold_triggers         # promo expiry crossing, ETF tenure schedule breakpoints, regional-sports-fee tier
    - derived_field_reconciliation    # Account.monthly_recurring_cents kept consistent with all active line items
    - optimistic_concurrency          # OCC on Account.version for tier-change / win-back create

  entity_topology: hybrid
  # Account is the aggregate root; Subscription, EquipmentLease, AddOnSubscription,
  # ServiceVisit, Promotion application, and BillingStatement hang off it, with
  # flat FK references to catalog config entities (ChannelPackage, PremiumChannel,
  # PromotionOffer, EquipmentModel).

  state_machine_shape: parallel
  # Account carries two independent state dimensions: lifecycle_status
  # (PROSPECT -> ACTIVE -> SUSPENDED <-> ACTIVE -> CANCELLED) and
  # promo_status (NONE -> PROMO_ACTIVE -> ROLLED_BACK). ServiceVisit has a
  # branching fork-join machine; Subscription has a downgrade cycle.

  relationship_patterns:
    - one_to_many            # Account -> Subscription/EquipmentLease/AddOnSubscription/ServiceVisit/BillingStatement
    - cross_aggregate        # line items reference catalog config across aggregate boundary

  role_model: peer_roles
  # CustomerServiceAgent owns plan/promo/billing operations; FieldTechnician owns
  # install/service-visit execution; Subscriber acts on own self-service operations;
  # BillingAdmin owns statement generation and ETF waivers.

  consistency_model: immediate

# =============================================================================
# §1.0 Response Envelope (FIXED — EMIT VERBATIM)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  # ---- Catalog / configuration entities (rarely change) --------------------
  - name: ChannelPackage
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID, no prefix" }
      - { name: tier_code, type: enum, source: input, description: "BASIC | PLUS | PREMIER — ordered rank BASIC<PLUS<PREMIER", constraints: "unique across active packages" }
      - { name: name, type: string, source: input, description: "Display name of the package" }
      - { name: monthly_fee_cents, type: integer, source: input, description: "Catalog monthly fee in cents", constraints: ">= 0" }
      - { name: channel_count, type: integer, source: input, description: "Number of linear channels included", constraints: ">= 0" }
      - { name: rank, type: integer, source: input, description: "Ordinal tier rank: BASIC=1, PLUS=2, PREMIER=3; higher rank = upgrade", constraints: "1..3" }
      - { name: active, type: boolean, source: input, description: "Whether catalog package can be newly subscribed", default: true }

  - name: PremiumChannel
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID, no prefix" }
      - { name: code, type: string, source: input, description: "Short channel code e.g. HBOX, SHOWX", constraints: "unique" }
      - { name: name, type: string, source: input, description: "Display name" }
      - { name: kind, type: enum, source: input, description: "PREMIUM (movie/entertainment) | ADD_ON (sports/intl tier)" }
      - { name: monthly_fee_cents, type: integer, source: input, description: "Catalog monthly fee in cents", constraints: ">= 0" }
      - { name: min_package_rank, type: integer, source: input, description: "Minimum ChannelPackage.rank required to carry this channel", constraints: "1..3" }
      - { name: active, type: boolean, source: input, description: "Whether the channel can be newly added", default: true }

  - name: EquipmentModel
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID, no prefix" }
      - { name: model_code, type: string, source: input, description: "Hardware model code e.g. BOX-HD, DVR-4K", constraints: "unique" }
      - { name: kind, type: enum, source: input, description: "BOX (set-top, no recording) | DVR (recording)" }
      - { name: monthly_lease_cents, type: integer, source: input, description: "Per-unit monthly lease fee in cents", constraints: ">= 0" }
      - { name: replacement_cost_cents, type: integer, source: input, description: "Unreturned-equipment charge per unit in cents", constraints: ">= 0" }
      - { name: active, type: boolean, source: input, description: "Whether the model can be newly leased", default: true }

  - name: PromotionOffer
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID, no prefix" }
      - { name: code, type: string, source: input, description: "Promo code e.g. SAVE20, FREEDVR", constraints: "unique" }
      - { name: discount_kind, type: enum, source: input, description: "PERCENT_OFF_PACKAGE | FLAT_OFF_TOTAL | EQUIPMENT_WAIVER" }
      - { name: percent_off, type: number, source: input, description: "Fraction 0..1 applied to package fee when PERCENT_OFF_PACKAGE; else 0", default: 0, constraints: "0..1" }
      - { name: flat_off_cents, type: integer, source: input, description: "Cents removed from monthly total when FLAT_OFF_TOTAL; else 0", default: 0, constraints: ">= 0" }
      - { name: promo_months, type: integer, source: input, description: "Number of billing cycles the promo applies before rollback", constraints: ">= 1" }
      - { name: requires_min_rank, type: integer, source: input, description: "Minimum ChannelPackage.rank the account must hold to keep the promo", constraints: "1..3" }
      - { name: rollback_protected, type: boolean, source: input, description: "If true, a win-back re-application is allowed after rollback", default: false }
      - { name: active, type: boolean, source: input, description: "Whether the promo can be newly applied", default: true }

  # ---- Aggregate root ------------------------------------------------------
  - name: Account
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID, no prefix" }
      - { name: customer_name, type: string, source: input, description: "Subscriber name" }
      - { name: service_state_code, type: string, source: input, description: "US state code of service address, drives regional sports fee", constraints: "2-letter code" }
      - { name: tenure_months, type: integer, source: input, description: "Completed billing cycles since activation; drives ETF schedule; starts 0", default: 0, constraints: ">= 0" }
      - { name: lifecycle_status, type: enum, source: system, description: "PROSPECT | ACTIVE | SUSPENDED | CANCELLED", default: "PROSPECT" }
      - { name: promo_status, type: enum, source: system, description: "NONE | PROMO_ACTIVE | ROLLED_BACK", default: "NONE" }
      - { name: active_package_id, type: string, source: system, description: "FK -> ChannelPackage.id; null until first subscription activated; mirrors current Subscription" }
      - { name: contract_term_months, type: integer, source: input, description: "Committed contract length; 0 means month-to-month (no ETF)", default: 0, constraints: ">= 0" }
      - { name: regional_sports_fee_cents, type: integer, source: computed, description: "Regional sports fee for service_state_code at current package rank (calc regional_sports_fee)" }
      - { name: monthly_recurring_cents, type: integer, source: computed, description: "Derived sum of all active line items minus active promo discount (calc monthly_recurring_charge)" }
      - { name: cancellation_effective_cycle, type: integer, source: system, description: "tenure_months snapshot at cancellation; null until CANCELLED" }
      - { name: created_at, type: datetime, source: system, description: "ISO 8601 UTC, 3 fractional digits" }
      - { name: updated_at, type: datetime, source: system, description: "Refreshed on every mutation incl. cascades" }
      - { name: version, type: integer, source: system, description: "OCC version, starts 1, +1 per mutation" }

  # ---- Account children (resources with lifecycle) -------------------------
  - name: Subscription
    parent: Account
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID, no prefix" }
      - { name: account_id, type: string, source: system, description: "FK -> Account.id" }
      - { name: package_id, type: string, source: input, description: "FK -> ChannelPackage.id; the tier this subscription carries" }
      - { name: status, type: enum, source: system, description: "PENDING | ACTIVE | DOWNGRADED | SUPERSEDED | TERMINATED", default: "PENDING" }
      - { name: base_fee_cents, type: integer, source: computed, description: "Snapshot of ChannelPackage.monthly_fee_cents at activation" }
      - { name: previous_subscription_id, type: string, source: system, description: "FK -> Subscription.id; the subscription this one superseded, null for first" }
      - { name: created_at, type: datetime, source: system, description: "ISO 8601 UTC, 3 fractional digits" }
      - { name: updated_at, type: datetime, source: system, description: "Refreshed on every mutation incl. cascades" }
      - { name: version, type: integer, source: system, description: "OCC version, starts 1, +1 per mutation" }

  - name: AddOnSubscription
    parent: Account
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID, no prefix" }
      - { name: account_id, type: string, source: system, description: "FK -> Account.id" }
      - { name: premium_channel_id, type: string, source: input, description: "FK -> PremiumChannel.id; the premium/add-on channel carried" }
      - { name: status, type: enum, source: system, description: "ACTIVE | DROPPED", default: "ACTIVE" }
      - { name: fee_cents, type: integer, source: computed, description: "Snapshot of PremiumChannel.monthly_fee_cents at attach" }
      - { name: drop_reason, type: enum, source: system, description: "USER | INCOMPATIBLE_DOWNGRADE | CANCELLED, null while ACTIVE" }
      - { name: created_at, type: datetime, source: system, description: "ISO 8601 UTC, 3 fractional digits" }
      - { name: updated_at, type: datetime, source: system, description: "Refreshed on every mutation incl. cascades" }
      - { name: version, type: integer, source: system, description: "OCC version, starts 1, +1 per mutation" }

  - name: EquipmentLease
    parent: Account
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID, no prefix" }
      - { name: account_id, type: string, source: system, description: "FK -> Account.id" }
      - { name: equipment_model_id, type: string, source: input, description: "FK -> EquipmentModel.id; the leased hardware model" }
      - { name: quantity, type: integer, source: input, description: "Number of units leased of this model", constraints: ">= 1" }
      - { name: status, type: enum, source: system, description: "ASSIGNED | RETURNED | UNRETURNED", default: "ASSIGNED" }
      - { name: monthly_lease_cents, type: integer, source: computed, description: "Snapshot of EquipmentModel.monthly_lease_cents * quantity at assignment" }
      - { name: unreturned_charge_cents, type: integer, source: system, description: "Replacement cost billed when never returned; 0 until UNRETURNED" }
      - { name: created_at, type: datetime, source: system, description: "ISO 8601 UTC, 3 fractional digits" }
      - { name: updated_at, type: datetime, source: system, description: "Refreshed on every mutation incl. cascades" }
      - { name: version, type: integer, source: system, description: "OCC version, starts 1, +1 per mutation" }

  - name: ServiceVisit
    parent: Account
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID, no prefix" }
      - { name: account_id, type: string, source: system, description: "FK -> Account.id" }
      - { name: visit_type, type: enum, source: input, description: "INSTALL | SERVICE" }
      - { name: window_start, type: datetime, source: input, description: "Scheduled appointment window start (ISO 8601 UTC)" }
      - { name: window_end, type: datetime, source: input, description: "Scheduled appointment window end (ISO 8601 UTC)" }
      - { name: technician_id, type: string, source: input, description: "FK -> Technician.id; assigned field technician" }
      - { name: status, type: enum, source: system, description: "SCHEDULED | DISPATCHED | COMPLETED | NO_SHOW | CANCELLED", default: "SCHEDULED" }
      - { name: truck_roll_fee_cents, type: integer, source: computed, description: "Visit fee per calc visit_fee; 0 for waived INSTALL" }
      - { name: outcome_note, type: string, source: input, description: "Technician completion note, null until COMPLETED" }
      - { name: created_at, type: datetime, source: system, description: "ISO 8601 UTC, 3 fractional digits" }
      - { name: updated_at, type: datetime, source: system, description: "Refreshed on every mutation incl. cascades" }
      - { name: version, type: integer, source: system, description: "OCC version, starts 1, +1 per mutation" }

  - name: Technician
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID, no prefix; equals X-User-ID when acting as FieldTechnician" }
      - { name: name, type: string, source: input, description: "Technician name" }
      - { name: home_state_code, type: string, source: input, description: "State the technician services" }
      - { name: active, type: boolean, source: input, description: "Whether available for dispatch", default: true }

  - name: PromotionApplication
    parent: Account
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID, no prefix" }
      - { name: account_id, type: string, source: system, description: "FK -> Account.id" }
      - { name: promotion_offer_id, type: string, source: input, description: "FK -> PromotionOffer.id; the offer applied" }
      - { name: status, type: enum, source: system, description: "ACTIVE | ROLLED_BACK | CANCELLED", default: "ACTIVE" }
      - { name: applied_at_tenure, type: integer, source: system, description: "Account.tenure_months snapshot at application" }
      - { name: rollback_at_tenure, type: integer, source: system, description: "applied_at_tenure + PromotionOffer.promo_months; tenure at which rollback fires" }
      - { name: discount_cents_snapshot, type: integer, source: computed, description: "Discount this application contributes while ACTIVE (calc promo_discount)" }
      - { name: is_winback, type: boolean, source: system, description: "True if this application re-applied a rollback_protected offer after a prior rollback", default: false }
      - { name: created_at, type: datetime, source: system, description: "ISO 8601 UTC, 3 fractional digits" }
      - { name: updated_at, type: datetime, source: system, description: "Refreshed on every mutation incl. cascades" }
      - { name: version, type: integer, source: system, description: "OCC version, starts 1, +1 per mutation" }

  - name: BillingStatement
    parent: Account
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID, no prefix" }
      - { name: account_id, type: string, source: system, description: "FK -> Account.id" }
      - { name: cycle_index, type: integer, source: input, description: "The billing cycle (tenure month) this statement bills", constraints: ">= 0" }
      - { name: proration_mode, type: enum, source: input, description: "FULL_CYCLE | PRORATED; FULL_CYCLE bills the whole cycle, PRORATED bills mid-cycle portion" }
      - { name: days_in_cycle, type: integer, source: input, description: "Calendar days in the billing cycle (e.g. 30)", default: 30, constraints: ">= 28" }
      - { name: active_days, type: integer, source: input, description: "Days the service was active in the cycle for PRORATED mode; ignored for FULL_CYCLE", default: 30, constraints: ">= 0" }
      - { name: status, type: enum, source: system, description: "DRAFT | ISSUED | VOID", default: "DRAFT" }
      - { name: package_charge_cents, type: integer, source: computed, description: "Package portion billed (calc statement_total)" }
      - { name: addon_charge_cents, type: integer, source: computed, description: "Premium/add-on portion billed (calc statement_total)" }
      - { name: equipment_charge_cents, type: integer, source: computed, description: "Equipment lease portion billed (calc statement_total)" }
      - { name: regional_sports_fee_cents, type: integer, source: computed, description: "Regional sports fee portion billed (calc statement_total)" }
      - { name: visit_charge_cents, type: integer, source: computed, description: "One-time service-visit fees billed in this cycle (calc statement_total)" }
      - { name: promo_discount_cents, type: integer, source: computed, description: "Promo discount applied in this cycle (calc statement_total)" }
      - { name: etf_charge_cents, type: integer, source: computed, description: "Early-termination fee billed if cancellation occurs in this cycle (calc early_termination_fee)" }
      - { name: total_cents, type: integer, source: computed, description: "Net billed total (calc statement_total)" }
      - { name: created_at, type: datetime, source: system, description: "ISO 8601 UTC, 3 fractional digits" }
      - { name: updated_at, type: datetime, source: system, description: "Refreshed on every mutation incl. cascades" }
      - { name: version, type: integer, source: system, description: "OCC version, starts 1, +1 per mutation" }

  - name: RegionalSportsFeeRule
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID, no prefix" }
      - { name: state_code, type: string, source: input, description: "US state code this rule covers", constraints: "2-letter, unique" }
      - { name: base_fee_cents, type: integer, source: input, description: "Regional sports fee for BASIC/PLUS rank in this state", constraints: ">= 0" }
      - { name: premier_surcharge_cents, type: integer, source: input, description: "Extra fee added when package rank == 3 (PREMIER)", constraints: ">= 0" }
      - { name: active, type: boolean, source: input, description: "Whether rule is in force", default: true }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  # ---- Account.lifecycle_status (parallel dimension A) ---------------------
  - entity: Account
    field: lifecycle_status
    initial_state: PROSPECT
    terminal_states: [CANCELLED]
    note: "Lifecycle evolves independently of promo_status (parallel dimension)."
    transitions:
      - from: PROSPECT
        to: ACTIVE
        trigger: "POST /accounts/{id}/subscriptions  (first subscription activation)"
        actor: CustomerServiceAgent
        preconditions:
          - "Account.lifecycle_status == PROSPECT"
          - "referenced ChannelPackage.active == true"
        side_effects:
          - "creates Subscription with status ACTIVE, base_fee_cents = package.monthly_fee_cents"
          - "sets Account.active_package_id = subscription.package_id"
          - "recompute Account.regional_sports_fee_cents (calc regional_sports_fee)"
          - "recompute Account.monthly_recurring_cents (calc monthly_recurring_charge)"
          - "increments Account.version by 1"
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /accounts/{id}/suspend"
        actor: CustomerServiceAgent
        preconditions:
          - "Account.lifecycle_status == ACTIVE"
        side_effects:
          - "all ACTIVE AddOnSubscription remain but billing pauses (handled at statement time)"
          - "recompute Account.monthly_recurring_cents (calc monthly_recurring_charge)"
          - "increments Account.version by 1"
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /accounts/{id}/reactivate"
        actor: CustomerServiceAgent
        preconditions:
          - "Account.lifecycle_status == SUSPENDED"
        side_effects:
          - "recompute Account.monthly_recurring_cents (calc monthly_recurring_charge)"
          - "increments Account.version by 1"
      - from: ACTIVE
        to: CANCELLED
        trigger: "POST /accounts/{id}/cancel"
        actor: [CustomerServiceAgent, Subscriber]
        preconditions:
          - "Account.lifecycle_status == ACTIVE"
        side_effects:
          - "sets Account.cancellation_effective_cycle = Account.tenure_months"
          - "transitions active Subscription -> TERMINATED"
          - "CASCADE: that Subscription termination drops every ACTIVE AddOnSubscription -> DROPPED (drop_reason=CANCELLED)"
          - "CASCADE: each AddOnSubscription drop recomputes Account.monthly_recurring_cents"
          - "every ASSIGNED EquipmentLease that is not RETURNED transitions -> UNRETURNED, billing unreturned_charge_cents = model.replacement_cost_cents * quantity"
          - "compute ETF: if Account.contract_term_months > 0 and tenure_months < contract_term_months, an ETF is owed (calc early_termination_fee) and recorded on the next BillingStatement"
          - "recompute Account.monthly_recurring_cents -> 0"
          - "increments Account.version by 1"
      - from: SUSPENDED
        to: CANCELLED
        trigger: "POST /accounts/{id}/cancel"
        actor: [CustomerServiceAgent, Subscriber]
        preconditions:
          - "Account.lifecycle_status == SUSPENDED"
        side_effects:
          - "same cascade as ACTIVE->CANCELLED (subscription terminate -> add-on drop -> equipment unreturned -> ETF)"
          - "increments Account.version by 1"

  # ---- Account.promo_status (parallel dimension B) ------------------------
  - entity: Account
    field: promo_status
    initial_state: NONE
    terminal_states: []
    note: "Promo dimension is independent of lifecycle; an ACTIVE account may be NONE/PROMO_ACTIVE/ROLLED_BACK. Cyclic: ROLLED_BACK -> PROMO_ACTIVE via win-back."
    transitions:
      - from: NONE
        to: PROMO_ACTIVE
        trigger: "POST /accounts/{id}/promotions  (apply a PromotionOffer)"
        actor: CustomerServiceAgent
        preconditions:
          - "Account.lifecycle_status == ACTIVE"
          - "Account.promo_status == NONE"
          - "PromotionOffer.active == true"
          - "current package rank >= PromotionOffer.requires_min_rank"
        side_effects:
          - "creates PromotionApplication status ACTIVE, applied_at_tenure = Account.tenure_months, rollback_at_tenure = tenure + promo_months"
          - "sets Account.promo_status = PROMO_ACTIVE"
          - "recompute Account.monthly_recurring_cents (calc monthly_recurring_charge incl. promo discount)"
          - "increments Account.version by 1"
      - from: PROMO_ACTIVE
        to: ROLLED_BACK
        trigger: "POST /accounts/{id}/advance-cycle  (when new tenure >= application.rollback_at_tenure)"
        actor: BillingAdmin
        preconditions:
          - "Account.promo_status == PROMO_ACTIVE"
          - "advancing tenure reaches/exceeds the ACTIVE PromotionApplication.rollback_at_tenure"
        side_effects:
          - "transitions ACTIVE PromotionApplication -> ROLLED_BACK"
          - "sets Account.promo_status = ROLLED_BACK"
          - "CASCADE: discount_cents_snapshot drops to 0 -> recompute Account.monthly_recurring_cents (price rolls back to catalog)"
          - "increments Account.version by 1"
      - from: PROMO_ACTIVE
        to: ROLLED_BACK
        trigger: "POST /accounts/{id}/subscriptions/{sid}/downgrade  (if new rank < promo.requires_min_rank)"
        actor: CustomerServiceAgent
        preconditions:
          - "Account.promo_status == PROMO_ACTIVE"
          - "post-downgrade package rank < ACTIVE PromotionApplication offer.requires_min_rank"
        side_effects:
          - "transitions ACTIVE PromotionApplication -> ROLLED_BACK (eligibility lost)"
          - "sets Account.promo_status = ROLLED_BACK"
          - "recompute Account.monthly_recurring_cents"
          - "increments Account.version by 1"
      - from: ROLLED_BACK
        to: PROMO_ACTIVE
        trigger: "POST /accounts/{id}/promotions  (win-back re-application of a rollback_protected offer)"
        actor: CustomerServiceAgent
        preconditions:
          - "Account.lifecycle_status == ACTIVE"
          - "Account.promo_status == ROLLED_BACK"
          - "PromotionOffer.rollback_protected == true"
          - "current package rank >= PromotionOffer.requires_min_rank"
        side_effects:
          - "creates PromotionApplication status ACTIVE, is_winback = true"
          - "sets Account.promo_status = PROMO_ACTIVE"
          - "recompute Account.monthly_recurring_cents"
          - "increments Account.version by 1"

  # ---- Subscription (downgrade cycle + supersede) -------------------------
  - entity: Subscription
    field: status
    initial_state: PENDING
    terminal_states: [SUPERSEDED, TERMINATED]
    note: "Cyclic via upgrade/downgrade: an ACTIVE subscription is SUPERSEDED by a new one; DOWNGRADED is a marked ACTIVE state on the prior row."
    transitions:
      - from: PENDING
        to: ACTIVE
        trigger: "POST /accounts/{id}/subscriptions  (activation as part of account first-subscribe)"
        actor: CustomerServiceAgent
        preconditions:
          - "ChannelPackage.active == true"
        side_effects:
          - "base_fee_cents = package.monthly_fee_cents"
      - from: ACTIVE
        to: SUPERSEDED
        trigger: "POST /accounts/{id}/subscriptions/{sid}/downgrade  OR  /upgrade"
        actor: CustomerServiceAgent
        preconditions:
          - "Subscription.status == ACTIVE"
          - "target ChannelPackage.active == true and rank != current rank"
          - "expected_account_version matches Account.version (OCC)"
        side_effects:
          - "creates a new Subscription (status ACTIVE for upgrade; status DOWNGRADED for downgrade) with previous_subscription_id = this.id"
          - "sets Account.active_package_id = new subscription.package_id"
          - "CASCADE (downgrade): every ACTIVE AddOnSubscription whose PremiumChannel.min_package_rank > new package rank -> DROPPED (drop_reason=INCOMPATIBLE_DOWNGRADE)"
          - "CASCADE: each incompatible add-on drop recomputes Account.monthly_recurring_cents"
          - "recompute Account.regional_sports_fee_cents (rank may change premier surcharge)"
          - "increments Account.version by 1"
      - from: ACTIVE
        to: TERMINATED
        trigger: "Account cancel cascade"
        actor: system
        preconditions:
          - "Account transitions to CANCELLED"
        side_effects:
          - "subscription closed; drives add-on cascade drop"

  # ---- ServiceVisit (branching fork-join: COMPLETED vs NO_SHOW vs CANCELLED)
  - entity: ServiceVisit
    field: status
    initial_state: SCHEDULED
    terminal_states: [COMPLETED, NO_SHOW, CANCELLED]
    note: "Branch from DISPATCHED into {COMPLETED, NO_SHOW}, each with divergent side-effect sets; CANCELLED is an early-exit branch from SCHEDULED."
    transitions:
      - from: SCHEDULED
        to: DISPATCHED
        trigger: "POST /accounts/{id}/service-visits/{vid}/dispatch"
        actor: FieldTechnician
        preconditions:
          - "ServiceVisit.status == SCHEDULED"
          - "ServiceVisit.technician_id == acting technician id"
        side_effects:
          - "marks visit en route"
      - from: DISPATCHED
        to: COMPLETED
        trigger: "POST /accounts/{id}/service-visits/{vid}/complete"
        actor: FieldTechnician
        preconditions:
          - "ServiceVisit.status == DISPATCHED"
          - "outcome_note provided"
        side_effects:
          - "compute truck_roll_fee_cents (calc visit_fee): waived for INSTALL, charged for SERVICE"
          - "INSTALL completion: if any ASSIGNED EquipmentLease exists, it stays ASSIGNED; no fee"
          - "fee recorded for billing on next BillingStatement visit_charge_cents"
      - from: DISPATCHED
        to: NO_SHOW
        trigger: "POST /accounts/{id}/service-visits/{vid}/no-show"
        actor: FieldTechnician
        preconditions:
          - "ServiceVisit.status == DISPATCHED"
        side_effects:
          - "compute truck_roll_fee_cents (calc visit_fee): NO_SHOW always charges the full SERVICE truck-roll fee regardless of visit_type"
          - "fee recorded for billing"
      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /accounts/{id}/service-visits/{vid}/cancel"
        actor: [CustomerServiceAgent, Subscriber]
        preconditions:
          - "ServiceVisit.status == SCHEDULED"
        side_effects:
          - "truck_roll_fee_cents = 0; no billing impact"

  # ---- EquipmentLease ------------------------------------------------------
  - entity: EquipmentLease
    field: status
    initial_state: ASSIGNED
    terminal_states: [RETURNED, UNRETURNED]
    transitions:
      - from: ASSIGNED
        to: RETURNED
        trigger: "POST /accounts/{id}/equipment-leases/{lid}/return"
        actor: [FieldTechnician, CustomerServiceAgent]
        preconditions:
          - "EquipmentLease.status == ASSIGNED"
        side_effects:
          - "monthly_lease_cents contribution removed -> recompute Account.monthly_recurring_cents"
          - "unreturned_charge_cents stays 0"
          - "increments Account.version by 1"
      - from: ASSIGNED
        to: UNRETURNED
        trigger: "Account cancel cascade (lease not returned before cancel)"
        actor: system
        preconditions:
          - "Account transitions to CANCELLED and EquipmentLease.status == ASSIGNED"
        side_effects:
          - "unreturned_charge_cents = model.replacement_cost_cents * quantity"
          - "monthly lease contribution removed"

# =============================================================================
# §1.2.1 Concurrency Rules
# =============================================================================
concurrency_rules:
  - rule_id: tier-change-stale-account
    parent_entity: Account
    write_endpoint: "POST /accounts/{id}/subscriptions/{sid}/downgrade"
    occ_field: "expected_account_version"
    description: |
      Changing the package tier (downgrade/upgrade) supersedes the current
      Subscription and rewrites Account.active_package_id, monthly_recurring_cents,
      and regional_sports_fee_cents. A tier change carrying an Account.version the
      client observed before another tier change already advanced it is rejected as
      a stale-version write; the prior change legitimately superseded the same
      Subscription, so this writer's view of the account is out of date.
    error_id: ERR_STALE_ACCOUNT_VERSION
    http_status: 412

  - rule_id: winback-stale-account
    parent_entity: Account
    write_endpoint: "POST /accounts/{id}/promotions"
    occ_field: "expected_account_version"
    description: |
      A win-back re-application creates a new PromotionApplication that legitimately
      supersedes the rolled-back one and flips Account.promo_status back to
      PROMO_ACTIVE. An apply call carrying an Account.version observed before a prior
      promotion mutation already advanced it is rejected as a stale-version write.
    error_id: ERR_STALE_ACCOUNT_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: monthly_recurring_charge
    trigger: "recomputed on subscription activate/downgrade/upgrade, add-on attach/drop, equipment assign/return, promo apply/rollback/winback, suspend/reactivate/cancel"
    algorithm: aggregation
    formula: |
      # Evaluation order is PINNED (circular-looking dependency resolved):
      # Step 1: package_base = ACTIVE/DOWNGRADED Subscription.base_fee_cents (exactly one current subscription)
      # Step 2: addon_sum    = sum(AddOnSubscription.fee_cents WHERE status == ACTIVE)
      # Step 3: equip_sum    = sum(EquipmentLease.monthly_lease_cents WHERE status == ASSIGNED)
      # Step 4: rsf          = Account.regional_sports_fee_cents  (already computed by regional_sports_fee)
      # Step 5: gross        = package_base + addon_sum + equip_sum + rsf
      # Step 6: discount     = promo_discount(gross, package_base)   # promo depends on gross/package tier -> compute AFTER gross
      # Step 7: monthly_recurring_cents = max(0, gross - discount)
      # If Account.lifecycle_status == SUSPENDED -> monthly_recurring_cents = 0 (service paused)
      # If Account.lifecycle_status == CANCELLED -> monthly_recurring_cents = 0
    input_set: "All current line items on the Account: the single ACTIVE-or-DOWNGRADED Subscription, AddOnSubscription rows with status ACTIVE, EquipmentLease rows with status ASSIGNED, plus the Account regional sports fee and the ACTIVE PromotionApplication discount."
    constants: {}
    precision: "integer cents; no rounding needed (all inputs already integer cents)"

  - name: promo_discount
    trigger: "subcalculation of monthly_recurring_charge and statement_total; runs whenever a discount is needed"
    algorithm: tiered_pricing
    formula: |
      # gross and package_base are passed in; the ACTIVE PromotionApplication's offer drives the kind.
      # If no ACTIVE PromotionApplication -> discount = 0
      # PERCENT_OFF_PACKAGE : discount = round_half_up(package_base * offer.percent_off)   # applied to PACKAGE fee only
      # FLAT_OFF_TOTAL      : discount = min(offer.flat_off_cents, gross)                  # capped so net >= 0
      # EQUIPMENT_WAIVER    : discount = sum(EquipmentLease.monthly_lease_cents WHERE status == ASSIGNED)  # waives all equipment lease
      # Exactly one ACTIVE PromotionApplication may exist at a time.
    input_set: "The single ACTIVE PromotionApplication and its PromotionOffer; package_base and gross from monthly_recurring_charge; ASSIGNED EquipmentLease rows for the waiver variant."
    constants: {}
    precision: "2 decimal places conceptually but stored integer cents, round_half_up on the percent multiplication"
    variants:
      - name: percent_off_package
        when: "offer.discount_kind == PERCENT_OFF_PACKAGE"
        difference: "discount is a fraction of package_base ONLY, not of gross; equipment/add-on/rsf untouched"
      - name: flat_off_total
        when: "offer.discount_kind == FLAT_OFF_TOTAL"
        difference: "flat cents removed from the whole gross, capped at gross so net never negative"
      - name: equipment_waiver
        when: "offer.discount_kind == EQUIPMENT_WAIVER"
        difference: "discount equals the full ASSIGNED equipment lease sum; changes whenever equipment changes even with promo unchanged"

  - name: regional_sports_fee
    trigger: "recomputed on subscription activate and on every tier change (rank may cross PREMIER surcharge)"
    algorithm: threshold
    formula: |
      # rule = RegionalSportsFeeRule WHERE state_code == Account.service_state_code AND active == true
      # If no matching active rule -> regional_sports_fee_cents = 0
      # current_rank = rank of Account.active_package_id's ChannelPackage
      # base = rule.base_fee_cents
      # surcharge = (current_rank >= 3) ? rule.premier_surcharge_cents : 0   # threshold at rank == PREMIER (3)
      # regional_sports_fee_cents = base + surcharge
    input_set: "The single active RegionalSportsFeeRule for the account's service state and the current package rank."
    constants: { PREMIER_RANK: 3 }
    precision: "integer cents"

  - name: visit_fee
    trigger: "on ServiceVisit complete or no-show transition"
    algorithm: threshold
    formula: |
      # On COMPLETED:
      #   visit_type == INSTALL  -> truck_roll_fee_cents = 0      (installs are waived)
      #   visit_type == SERVICE  -> truck_roll_fee_cents = SERVICE_TRUCK_ROLL_CENTS
      # On NO_SHOW (regardless of visit_type):
      #   truck_roll_fee_cents = SERVICE_TRUCK_ROLL_CENTS         (no-show always billed full)
      # On CANCELLED (from SCHEDULED): truck_roll_fee_cents = 0
    input_set: "The single ServiceVisit's visit_type and terminal transition taken."
    constants: { SERVICE_TRUCK_ROLL_CENTS: 9900 }
    precision: "integer cents"

  - name: statement_total
    trigger: "POST /accounts/{id}/billing-statements  (statement issuance)"
    algorithm: aggregation
    formula: |
      # proration_mode pins which algorithm runs (DUAL VARIANT):
      # Common gross line items for the cycle:
      #   package    = current Subscription.base_fee_cents
      #   addon      = sum(AddOnSubscription.fee_cents WHERE status == ACTIVE)
      #   equipment  = sum(EquipmentLease.monthly_lease_cents WHERE status == ASSIGNED)
      #              + sum(EquipmentLease.unreturned_charge_cents WHERE status == UNRETURNED)   # one-time
      #   rsf        = Account.regional_sports_fee_cents
      #   visits     = sum(ServiceVisit.truck_roll_fee_cents for visits that COMPLETED/NO_SHOW this cycle)  # one-time
      #   promo      = promo_discount(gross_recurring, package) over recurring lines only
      #   etf        = early_termination_fee() if Account cancelled in this cycle, else 0   # one-time
      #
      # ROUNDING ORDER IS PINNED: prorate EACH recurring line item independently, round_half_up
      # to whole cents PER LINE, THEN sum (NOT sum-then-prorate). One-time charges
      # (visits, unreturned equipment, etf) are NEVER prorated.
      #
      # FULL_CYCLE variant:
      #   package_charge_cents   = package
      #   addon_charge_cents     = addon
      #   equipment_charge_cents = equipment (incl. unreturned one-time)
      #   regional_sports_fee_cents = rsf
      #   promo_discount_cents   = promo_discount over (package+addon+equipment_recurring+rsf)
      #
      # PRORATED variant (factor f = active_days / days_in_cycle):
      #   package_charge_cents   = round_half_up(package * f)
      #   addon_charge_cents     = round_half_up(addon * f)        # add-on recurring portion only
      #   equipment_recurring    = round_half_up(equipment_recurring * f)
      #   regional_sports_fee_cents = round_half_up(rsf * f)
      #   promo_discount_cents   = round_half_up(promo_over_prorated_recurring)   # promo computed on the PRORATED recurring base
      #   unreturned one-time + visits + etf are added at full value (not * f)
      #
      # visit_charge_cents = visits ; etf_charge_cents = etf
      # total_cents = package_charge + addon_charge + equipment_charge + regional_sports_fee
      #             + visit_charge + etf_charge - promo_discount   (floored at 0)
    input_set: "All current Subscription/AddOnSubscription(ACTIVE)/EquipmentLease/PromotionApplication(ACTIVE) line items plus ServiceVisits whose terminal transition landed in this cycle and any ETF owed."
    constants: {}
    precision: "round_half_up to integer cents, PER LINE ITEM before summing"
    variants:
      - name: full_cycle
        when: "proration_mode == FULL_CYCLE"
        difference: "each recurring line billed at full catalog value; active_days/days_in_cycle ignored"
      - name: prorated
        when: "proration_mode == PRORATED"
        difference: "each recurring line scaled by active_days/days_in_cycle and rounded PER LINE before summing; produces a different total than FULL_CYCLE for the same inputs"

  - name: early_termination_fee
    trigger: "Account cancel transition when contract_term_months > 0; recorded on the cancellation-cycle BillingStatement"
    algorithm: tiered_pricing
    formula: |
      # remaining = contract_term_months - tenure_months   (months left on contract)
      # If contract_term_months == 0 -> etf = 0 (month-to-month, no ETF)
      # If tenure_months >= contract_term_months -> etf = 0 (contract satisfied)
      # Else tiered by remaining months (tenure schedule breakpoints):
      #   remaining >= 12  -> etf = ETF_MAX_CENTS
      #   6 <= remaining < 12 -> etf = ETF_MID_CENTS
      #   1 <= remaining < 6  -> etf = ETF_MIN_CENTS + (remaining * ETF_PER_MONTH_CENTS)
      # Boundary precision: remaining == 12 lands in the >=12 tier (uses ETF_MAX_CENTS),
      # remaining == 6 lands in the mid tier, remaining == 5 lands in the low tier.
    input_set: "Account.contract_term_months and Account.tenure_months at cancellation."
    constants: { ETF_MAX_CENTS: 24000, ETF_MID_CENTS: 15000, ETF_MIN_CENTS: 2000, ETF_PER_MONTH_CENTS: 1500 }
    precision: "integer cents"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present and well-formed"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all except Anonymous-permitted reads"

  - priority: 2
    category: auth
    check: "Acting role is permitted to perform this operation per §1.7 RBAC"
    error_id: ERR_FORBIDDEN_ROLE
    http_status: 403
    applies_to: "all"

  - priority: 3
    category: auth
    check: "FieldTechnician acting on a ServiceVisit must equal that visit's technician_id; Subscriber acting on an account must own it (X-User-ID == account_id is not used; Subscriber X-User-ID equals Account.id)"
    error_id: ERR_NOT_RESOURCE_OWNER
    http_status: 403
    applies_to: "service-visit dispatch/complete/no-show; subscriber self-service cancel"

  - priority: 4
    category: existence
    check: "Path resources exist, validated left-to-right (Account, then Subscription/visit/lease/etc.)"
    error_id: ERR_ACCOUNT_NOT_FOUND
    http_status: 404
    applies_to: "all /accounts/{id}/** paths"

  - priority: 5
    category: existence
    check: "Referenced catalog entity in body exists and is active (ChannelPackage, PremiumChannel, EquipmentModel, PromotionOffer, Technician)"
    error_id: ERR_CATALOG_ENTITY_NOT_FOUND
    http_status: 404
    applies_to: "subscribe, downgrade/upgrade, add-on attach, equipment assign, promo apply, visit schedule"

  - priority: 6
    category: existence
    check: "Sub-resource (Subscription/AddOnSubscription/EquipmentLease/ServiceVisit/PromotionApplication) exists under the Account"
    error_id: ERR_SUBRESOURCE_NOT_FOUND
    http_status: 404
    applies_to: "all sub-resource action endpoints"

  - priority: 7
    category: state
    check: "Target resource is in a state from which the requested transition is allowed (§1.2)"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all transition endpoints"

  - priority: 8
    category: state
    check: "Account.lifecycle_status must be ACTIVE for plan/add-on/promo mutations (not SUSPENDED/CANCELLED/PROSPECT)"
    error_id: ERR_ACCOUNT_NOT_ACTIVE
    http_status: 409
    applies_to: "downgrade/upgrade, add-on attach, equipment assign, promo apply"

  - priority: 9
    category: business_constraint
    check: "OCC: expected_account_version must equal current Account.version on tier-change and promo-apply"
    error_id: ERR_STALE_ACCOUNT_VERSION
    http_status: 412
    applies_to: "subscription downgrade/upgrade, promo apply"

  - priority: 10
    category: business_safety
    check: "ServiceVisit window_start < window_end and window_start is in the future relative to clock"
    error_id: ERR_INVALID_VISIT_WINDOW
    http_status: 422
    applies_to: "service-visit schedule"

  - priority: 11
    category: business_temporal
    check: "A new ServiceVisit window must not overlap an existing non-terminal ServiceVisit (status IN {SCHEDULED, DISPATCHED}) for the same technician_id; intervals are half-open [start,end) so adjacency (existing.end == new.start, or new.end == existing.start) is allowed; any strictly-positive overlap is rejected"
    error_id: ERR_TECHNICIAN_DOUBLE_BOOKED
    http_status: 409
    applies_to: "service-visit schedule"

  - priority: 12
    category: business_temporal
    check: "A new ServiceVisit window must not overlap an existing non-terminal ServiceVisit for the same Account, and must keep a >= 60-minute (TECH_BUFFER_MIN) gap from another visit on the same account; gap < 60 min is rejected (closed-interval + 60-min buffer semantics). Non-terminal = status IN {SCHEDULED, DISPATCHED}."
    error_id: ERR_ACCOUNT_VISIT_CONFLICT
    http_status: 409
    applies_to: "service-visit schedule"

  - priority: 13
    category: business_constraint
    check: "Add-on PremiumChannel.min_package_rank must be <= current package rank; cannot attach a premium that the current tier does not support"
    error_id: ERR_ADDON_RANK_TOO_HIGH
    http_status: 422
    applies_to: "add-on attach"

  - priority: 14
    category: business_constraint
    check: "Promo apply: current package rank >= PromotionOffer.requires_min_rank"
    error_id: ERR_PROMO_RANK_NOT_MET
    http_status: 422
    applies_to: "promo apply"

  - priority: 15
    category: business_constraint
    check: "Promo apply when promo_status == ROLLED_BACK requires PromotionOffer.rollback_protected == true (win-back); a non-protected offer cannot be re-applied"
    error_id: ERR_PROMO_NOT_WINBACK_ELIGIBLE
    http_status: 422
    applies_to: "promo apply"

  - priority: 16
    category: business_constraint
    check: "Only one ACTIVE PromotionApplication at a time: cannot apply when promo_status == PROMO_ACTIVE"
    error_id: ERR_PROMO_ALREADY_ACTIVE
    http_status: 409
    applies_to: "promo apply"

  - priority: 17
    category: business_constraint
    check: "Downgrade/upgrade target package rank must differ from current rank and target must be active"
    error_id: ERR_SAME_OR_INVALID_TIER
    http_status: 422
    applies_to: "subscription downgrade/upgrade"

  - priority: 18
    category: business_constraint
    check: "Required body fields present and well-typed (e.g. quantity >= 1, percent_off in 0..1)"
    error_id: ERR_INVALID_REQUEST
    http_status: 422
    applies_to: "all create/mutation endpoints"

  - priority: 19
    category: business_constraint
    check: "BillingStatement PRORATED mode requires active_days in 0..days_in_cycle"
    error_id: ERR_INVALID_PRORATION
    http_status: 422
    applies_to: "billing-statement issue"

  - priority: 20
    category: business_referential
    check: "Cannot issue a BillingStatement for a cycle_index already ISSUED on the account (duplicate cycle)"
    error_id: ERR_DUPLICATE_STATEMENT_CYCLE
    http_status: 409
    applies_to: "billing-statement issue"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # ---- Catalog config ------------------------------------------------------
  - { method: POST, path: "/channel-packages", description: "Create a channel package tier", roles: [BillingAdmin], code: 201, input: [tier_code, name, monthly_fee_cents, channel_count, rank, "active?"], output: ChannelPackage, side_effects: [] }
  - { method: GET, path: "/channel-packages", description: "List channel packages", roles: [BillingAdmin, CustomerServiceAgent, Subscriber], code: 200, input: ["active?", "limit?", "offset?"], output: "ChannelPackage[]", side_effects: [] }
  - { method: GET, path: "/channel-packages/{id}", description: "Get a channel package", roles: [BillingAdmin, CustomerServiceAgent, Subscriber], code: 200, input: [], output: ChannelPackage, side_effects: [] }

  - { method: POST, path: "/premium-channels", description: "Create a premium/add-on channel", roles: [BillingAdmin], code: 201, input: [code, name, kind, monthly_fee_cents, min_package_rank, "active?"], output: PremiumChannel, side_effects: [] }
  - { method: GET, path: "/premium-channels", description: "List premium/add-on channels", roles: [BillingAdmin, CustomerServiceAgent, Subscriber], code: 200, input: ["kind?", "active?", "limit?", "offset?"], output: "PremiumChannel[]", side_effects: [] }

  - { method: POST, path: "/equipment-models", description: "Create an equipment model", roles: [BillingAdmin], code: 201, input: [model_code, kind, monthly_lease_cents, replacement_cost_cents, "active?"], output: EquipmentModel, side_effects: [] }
  - { method: GET, path: "/equipment-models", description: "List equipment models", roles: [BillingAdmin, CustomerServiceAgent], code: 200, input: ["active?", "limit?", "offset?"], output: "EquipmentModel[]", side_effects: [] }

  - { method: POST, path: "/promotion-offers", description: "Create a promotion offer", roles: [BillingAdmin], code: 201, input: [code, discount_kind, "percent_off?", "flat_off_cents?", promo_months, requires_min_rank, "rollback_protected?", "active?"], output: PromotionOffer, side_effects: [] }
  - { method: GET, path: "/promotion-offers", description: "List promotion offers", roles: [BillingAdmin, CustomerServiceAgent], code: 200, input: ["active?", "limit?", "offset?"], output: "PromotionOffer[]", side_effects: [] }

  - { method: POST, path: "/regional-sports-fee-rules", description: "Create a regional sports fee rule for a state", roles: [BillingAdmin], code: 201, input: [state_code, base_fee_cents, premier_surcharge_cents, "active?"], output: RegionalSportsFeeRule, side_effects: [] }
  - { method: GET, path: "/regional-sports-fee-rules", description: "List regional sports fee rules", roles: [BillingAdmin, CustomerServiceAgent], code: 200, input: ["state_code?", "limit?", "offset?"], output: "RegionalSportsFeeRule[]", side_effects: [] }

  - { method: POST, path: "/technicians", description: "Create a field technician", roles: [BillingAdmin], code: 201, input: [name, home_state_code, "active?"], output: Technician, side_effects: [] }
  - { method: GET, path: "/technicians", description: "List technicians", roles: [BillingAdmin, CustomerServiceAgent], code: 200, input: ["home_state_code?", "active?", "limit?", "offset?"], output: "Technician[]", side_effects: [] }

  # ---- Cross-aggregate reverse-lookup lists (admin/reporting; FK reverse-reachability) ----
  - { method: GET, path: "/subscriptions", description: "List subscriptions filtered by account/package/previous (reverse-reachability for Subscription.package_id and self-ref previous_subscription_id)", roles: [BillingAdmin, CustomerServiceAgent], code: 200, input: ["account_id?", "package_id?", "previous_subscription_id?", "status?", "limit?", "offset?"], output: "Subscription[]", side_effects: [] }
  - { method: GET, path: "/subscriptions/{id}", description: "Get a single subscription (establishes the subscriptions collection segment)", roles: [BillingAdmin, CustomerServiceAgent, Subscriber], code: 200, input: [], output: Subscription, side_effects: [] }
  - { method: GET, path: "/add-ons", description: "List add-on subscriptions filtered by premium channel (reverse-reachability for AddOnSubscription.premium_channel_id)", roles: [BillingAdmin, CustomerServiceAgent], code: 200, input: ["account_id?", "premium_channel_id?", "status?", "limit?", "offset?"], output: "AddOnSubscription[]", side_effects: [] }
  - { method: GET, path: "/add-ons/{id}", description: "Get a single add-on subscription (establishes the add-ons collection segment)", roles: [BillingAdmin, CustomerServiceAgent, Subscriber], code: 200, input: [], output: AddOnSubscription, side_effects: [] }
  - { method: GET, path: "/equipment-leases", description: "List equipment leases filtered by equipment model (reverse-reachability for EquipmentLease.equipment_model_id)", roles: [BillingAdmin, CustomerServiceAgent], code: 200, input: ["account_id?", "equipment_model_id?", "status?", "limit?", "offset?"], output: "EquipmentLease[]", side_effects: [] }
  - { method: GET, path: "/equipment-leases/{id}", description: "Get a single equipment lease (establishes the equipment-leases collection segment)", roles: [BillingAdmin, CustomerServiceAgent, FieldTechnician], code: 200, input: [], output: EquipmentLease, side_effects: [] }
  - { method: GET, path: "/service-visits", description: "List service visits filtered by technician (reverse-reachability for ServiceVisit.technician_id)", roles: [BillingAdmin, CustomerServiceAgent, FieldTechnician], code: 200, input: ["account_id?", "technician_id?", "status?", "limit?", "offset?"], output: "ServiceVisit[]", side_effects: [] }
  - { method: GET, path: "/service-visits/{id}", description: "Get a single service visit (establishes the service-visits collection segment)", roles: [BillingAdmin, CustomerServiceAgent, Subscriber, FieldTechnician], code: 200, input: [], output: ServiceVisit, side_effects: [] }
  - { method: GET, path: "/promotion-applications", description: "List promotion applications filtered by offer (reverse-reachability for PromotionApplication.promotion_offer_id)", roles: [BillingAdmin, CustomerServiceAgent], code: 200, input: ["account_id?", "promotion_offer_id?", "status?", "limit?", "offset?"], output: "PromotionApplication[]", side_effects: [] }
  - { method: GET, path: "/promotion-applications/{id}", description: "Get a single promotion application (establishes the promotion-applications collection segment)", roles: [BillingAdmin, CustomerServiceAgent, Subscriber], code: 200, input: [], output: PromotionApplication, side_effects: [] }

  # ---- Account lifecycle ---------------------------------------------------
  - { method: POST, path: "/accounts", description: "Create a prospect account", roles: [CustomerServiceAgent], code: 201, input: [customer_name, service_state_code, "contract_term_months?"], output: Account, side_effects: ["lifecycle_status=PROSPECT, promo_status=NONE"] }
  - { method: GET, path: "/accounts", description: "List accounts (reverse-reachability for Account.active_package_id via active_package_id filter)", roles: [BillingAdmin, CustomerServiceAgent], code: 200, input: ["lifecycle_status?", "active_package_id?", "limit?", "offset?"], output: "Account[]", side_effects: [] }
  - { method: GET, path: "/accounts/{id}", description: "Get account with computed monthly_recurring_cents and regional_sports_fee_cents", roles: [BillingAdmin, CustomerServiceAgent, Subscriber], code: 200, input: [], output: Account, side_effects: [] }
  - { method: POST, path: "/accounts/{id}/suspend", description: "Suspend an active account", roles: [CustomerServiceAgent], code: 200, input: [], output: Account, side_effects: ["lifecycle_status ACTIVE->SUSPENDED", "recompute monthly_recurring_cents", "increments Account.version by 1"] }
  - { method: POST, path: "/accounts/{id}/reactivate", description: "Reactivate a suspended account", roles: [CustomerServiceAgent], code: 200, input: [], output: Account, side_effects: ["lifecycle_status SUSPENDED->ACTIVE", "recompute monthly_recurring_cents", "increments Account.version by 1"] }
  - { method: POST, path: "/accounts/{id}/cancel", description: "Cancel an account (cascades termination, add-on drop, equipment unreturned, ETF)", roles: [CustomerServiceAgent, Subscriber], code: 200, input: [], output: Account, side_effects: ["lifecycle->CANCELLED", "Subscription->TERMINATED", "AddOnSubscription->DROPPED", "ASSIGNED EquipmentLease->UNRETURNED with replacement charge", "ETF computed (calc early_termination_fee)", "monthly_recurring_cents->0", "increments Account.version by 1"] }
  - { method: POST, path: "/accounts/{id}/advance-cycle", description: "Advance the account one billing cycle (tenure_months += 1); fires promo rollback when due", roles: [BillingAdmin], code: 200, input: [], output: Account, side_effects: ["tenure_months += 1", "if tenure >= ACTIVE PromotionApplication.rollback_at_tenure: PromotionApplication->ROLLED_BACK, promo_status->ROLLED_BACK, recompute monthly_recurring_cents", "increments Account.version by 1"] }

  # ---- Subscription (tier) -------------------------------------------------
  - { method: POST, path: "/accounts/{id}/subscriptions", description: "Activate the account's first subscription (PROSPECT->ACTIVE)", roles: [CustomerServiceAgent], code: 201, input: [package_id], output: Subscription, side_effects: ["lifecycle PROSPECT->ACTIVE", "Subscription ACTIVE, base_fee_cents snapshot", "Account.active_package_id set", "recompute regional_sports_fee_cents", "recompute monthly_recurring_cents", "increments Account.version by 1"] }
  - { method: GET, path: "/accounts/{id}/subscriptions", description: "List subscriptions for an account (reverse-reachability for Subscription.account_id)", roles: [BillingAdmin, CustomerServiceAgent, Subscriber], code: 200, input: ["status?", "limit?", "offset?"], output: "Subscription[]", side_effects: [] }
  - { method: POST, path: "/accounts/{id}/subscriptions/{sid}/downgrade", description: "Downgrade to a lower-rank package; supersedes current sub; may drop incompatible add-ons and roll back promo", roles: [CustomerServiceAgent], code: 201, input: [package_id, expected_account_version], output: Subscription, side_effects: ["old Subscription->SUPERSEDED", "new Subscription DOWNGRADED", "incompatible AddOnSubscription->DROPPED (INCOMPATIBLE_DOWNGRADE)", "if rank < promo.requires_min_rank: promo ROLLED_BACK", "recompute regional_sports_fee_cents + monthly_recurring_cents", "increments Account.version by 1"] }
  - { method: POST, path: "/accounts/{id}/subscriptions/{sid}/upgrade", description: "Upgrade to a higher-rank package; supersedes current sub", roles: [CustomerServiceAgent], code: 201, input: [package_id, expected_account_version], output: Subscription, side_effects: ["old Subscription->SUPERSEDED", "new Subscription ACTIVE", "recompute regional_sports_fee_cents + monthly_recurring_cents", "increments Account.version by 1"] }

  # ---- Add-ons -------------------------------------------------------------
  - { method: POST, path: "/accounts/{id}/add-ons", description: "Attach a premium/add-on channel to an active account", roles: [CustomerServiceAgent, Subscriber], code: 201, input: [premium_channel_id], output: AddOnSubscription, side_effects: ["AddOnSubscription ACTIVE, fee_cents snapshot", "recompute monthly_recurring_cents", "increments Account.version by 1"] }
  - { method: GET, path: "/accounts/{id}/add-ons", description: "List add-on subscriptions (reverse-reachability for AddOnSubscription.account_id)", roles: [BillingAdmin, CustomerServiceAgent, Subscriber], code: 200, input: ["status?", "limit?", "offset?"], output: "AddOnSubscription[]", side_effects: [] }
  - { method: POST, path: "/accounts/{id}/add-ons/{aid}/drop", description: "Drop an active add-on (user-initiated)", roles: [CustomerServiceAgent, Subscriber], code: 200, input: [], output: AddOnSubscription, side_effects: ["AddOnSubscription->DROPPED (USER)", "recompute monthly_recurring_cents", "increments Account.version by 1"] }

  # ---- Equipment -----------------------------------------------------------
  - { method: POST, path: "/accounts/{id}/equipment-leases", description: "Assign leased equipment to an active account", roles: [CustomerServiceAgent, FieldTechnician], code: 201, input: [equipment_model_id, quantity], output: EquipmentLease, side_effects: ["EquipmentLease ASSIGNED, monthly_lease_cents snapshot = model.monthly_lease_cents*quantity", "recompute monthly_recurring_cents", "increments Account.version by 1"] }
  - { method: GET, path: "/accounts/{id}/equipment-leases", description: "List equipment leases (reverse-reachability for EquipmentLease.account_id)", roles: [BillingAdmin, CustomerServiceAgent, FieldTechnician], code: 200, input: ["status?", "limit?", "offset?"], output: "EquipmentLease[]", side_effects: [] }
  - { method: POST, path: "/accounts/{id}/equipment-leases/{lid}/return", description: "Return leased equipment", roles: [CustomerServiceAgent, FieldTechnician], code: 200, input: [], output: EquipmentLease, side_effects: ["EquipmentLease->RETURNED", "recompute monthly_recurring_cents", "increments Account.version by 1"] }

  # ---- Service visits ------------------------------------------------------
  - { method: POST, path: "/accounts/{id}/service-visits", description: "Schedule an install/service visit", roles: [CustomerServiceAgent, Subscriber], code: 201, input: [visit_type, window_start, window_end, technician_id], output: ServiceVisit, side_effects: ["ServiceVisit SCHEDULED"] }
  - { method: GET, path: "/accounts/{id}/service-visits", description: "List service visits (reverse-reachability for ServiceVisit.account_id)", roles: [BillingAdmin, CustomerServiceAgent, Subscriber, FieldTechnician], code: 200, input: ["status?", "technician_id?", "limit?", "offset?"], output: "ServiceVisit[]", side_effects: [] }
  - { method: POST, path: "/accounts/{id}/service-visits/{vid}/dispatch", description: "Technician dispatches to the visit", roles: [FieldTechnician], code: 200, input: [], output: ServiceVisit, side_effects: ["ServiceVisit SCHEDULED->DISPATCHED"] }
  - { method: POST, path: "/accounts/{id}/service-visits/{vid}/complete", description: "Technician completes the visit; computes truck-roll fee", roles: [FieldTechnician], code: 200, input: [outcome_note], output: ServiceVisit, side_effects: ["ServiceVisit DISPATCHED->COMPLETED", "compute truck_roll_fee_cents (calc visit_fee)"] }
  - { method: POST, path: "/accounts/{id}/service-visits/{vid}/no-show", description: "Technician marks customer no-show; charges full truck-roll fee", roles: [FieldTechnician], code: 200, input: [], output: ServiceVisit, side_effects: ["ServiceVisit DISPATCHED->NO_SHOW", "compute truck_roll_fee_cents = SERVICE_TRUCK_ROLL_CENTS"] }
  - { method: POST, path: "/accounts/{id}/service-visits/{vid}/cancel", description: "Cancel a scheduled visit", roles: [CustomerServiceAgent, Subscriber], code: 200, input: [], output: ServiceVisit, side_effects: ["ServiceVisit SCHEDULED->CANCELLED", "truck_roll_fee_cents=0"] }

  # ---- Promotions ----------------------------------------------------------
  - { method: POST, path: "/accounts/{id}/promotions", description: "Apply (or win-back) a promotion offer to an active account", roles: [CustomerServiceAgent], code: 201, input: [promotion_offer_id, expected_account_version], output: PromotionApplication, side_effects: ["PromotionApplication ACTIVE", "promo_status NONE->PROMO_ACTIVE or ROLLED_BACK->PROMO_ACTIVE (winback)", "recompute monthly_recurring_cents", "increments Account.version by 1"] }
  - { method: GET, path: "/accounts/{id}/promotions", description: "List promotion applications (reverse-reachability for PromotionApplication.account_id)", roles: [BillingAdmin, CustomerServiceAgent, Subscriber], code: 200, input: ["status?", "limit?", "offset?"], output: "PromotionApplication[]", side_effects: [] }

  # ---- Billing -------------------------------------------------------------
  - { method: POST, path: "/accounts/{id}/billing-statements", description: "Issue a billing statement for a cycle (FULL_CYCLE or PRORATED)", roles: [BillingAdmin], code: 201, input: [cycle_index, proration_mode, "days_in_cycle?", "active_days?"], output: BillingStatement, side_effects: ["BillingStatement ISSUED", "compute all charge lines (calc statement_total)", "include ETF if cancellation occurred this cycle (calc early_termination_fee)"] }
  - { method: GET, path: "/accounts/{id}/billing-statements", description: "List billing statements (reverse-reachability for BillingStatement.account_id)", roles: [BillingAdmin, CustomerServiceAgent, Subscriber], code: 200, input: ["cycle_index?", "status?", "limit?", "offset?"], output: "BillingStatement[]", side_effects: [] }
  - { method: GET, path: "/accounts/{id}/billing-statements/{bid}", description: "Get a single billing statement with line-item breakdown", roles: [BillingAdmin, CustomerServiceAgent, Subscriber], code: 200, input: [], output: BillingStatement, side_effects: [] }

  # ---- Test-driving clock --------------------------------------------------
  - { method: POST, path: "/_clock/set_current_utc", description: "Set server clock for deterministic visit-window validation", roles: [BillingAdmin], code: 200, input: [to_iso8601], output: "{ current_utc: datetime }", side_effects: ["sets server clock"] }

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "Missing/invalid X-User-Role or X-User-ID header" }
  - { id: ERR_FORBIDDEN_ROLE, http: 403, condition: "Acting role not permitted for this operation" }
  - { id: ERR_NOT_RESOURCE_OWNER, http: 403, condition: "FieldTechnician not assigned to the visit, or Subscriber acting on a non-owned account" }
  - { id: ERR_ACCOUNT_NOT_FOUND, http: 404, condition: "Account id in path does not exist" }
  - { id: ERR_CATALOG_ENTITY_NOT_FOUND, http: 404, condition: "Referenced catalog entity (package/channel/model/promo/technician/rsf rule) missing or inactive" }
  - { id: ERR_SUBRESOURCE_NOT_FOUND, http: 404, condition: "Sub-resource (subscription/add-on/lease/visit/promo application/statement) not found under account" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Requested transition not allowed from the resource's current state" }
  - { id: ERR_ACCOUNT_NOT_ACTIVE, http: 409, condition: "Account lifecycle_status is not ACTIVE for a mutation that requires it" }
  - { id: ERR_STALE_ACCOUNT_VERSION, http: 412, condition: "expected_account_version != current Account.version (OCC)" }
  - { id: ERR_INVALID_VISIT_WINDOW, http: 422, condition: "window_start >= window_end or window_start in the past" }
  - { id: ERR_TECHNICIAN_DOUBLE_BOOKED, http: 409, condition: "Visit window overlaps another non-terminal visit for the same technician (half-open, adjacency allowed)" }
  - { id: ERR_ACCOUNT_VISIT_CONFLICT, http: 409, condition: "Visit window overlaps or is within buffer of another non-terminal visit on the same account (closed + buffer)" }
  - { id: ERR_ADDON_RANK_TOO_HIGH, http: 422, condition: "Premium channel min_package_rank exceeds current package rank" }
  - { id: ERR_PROMO_RANK_NOT_MET, http: 422, condition: "Current package rank below PromotionOffer.requires_min_rank" }
  - { id: ERR_PROMO_NOT_WINBACK_ELIGIBLE, http: 422, condition: "Re-applying after rollback but offer.rollback_protected is false" }
  - { id: ERR_PROMO_ALREADY_ACTIVE, http: 409, condition: "Promo apply while an ACTIVE PromotionApplication already exists" }
  - { id: ERR_SAME_OR_INVALID_TIER, http: 422, condition: "Downgrade/upgrade target rank equals current rank or target inactive" }
  - { id: ERR_INVALID_REQUEST, http: 422, condition: "Missing/ill-typed required body field" }
  - { id: ERR_INVALID_PRORATION, http: 422, condition: "PRORATED statement with active_days outside 0..days_in_cycle" }
  - { id: ERR_DUPLICATE_STATEMENT_CYCLE, http: 409, condition: "A statement for this cycle_index is already ISSUED on the account" }
  - { id: ERR_VALIDATION, http: 422, condition: "Generic body validation fallback (enum out of range, negative amounts)" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: BillingAdmin
    description: "Owns catalog configuration, billing-statement issuance, cycle advancement, and ETF/waiver authority"
    identity: "opaque"
    exclusive_operations:
      - "Create catalog config (packages, channels, equipment models, promo offers, rsf rules, technicians)"
      - "POST /accounts/{id}/billing-statements"
      - "POST /accounts/{id}/advance-cycle"
      - "POST /_clock/set_current_utc"
    shared_operations:
      - "Read accounts, sub-resources, catalog, statements"

  - name: CustomerServiceAgent
    description: "Owns account lifecycle, plan/tier changes, add-on management, promotions"
    identity: "opaque"
    exclusive_operations:
      - "POST /accounts (create prospect)"
      - "POST /accounts/{id}/subscriptions (first activation)"
      - "POST /accounts/{id}/subscriptions/{sid}/downgrade and /upgrade"
      - "POST /accounts/{id}/promotions"
      - "POST /accounts/{id}/suspend and /reactivate"
    shared_operations:
      - "Add-on attach/drop (with Subscriber)"
      - "Equipment assign/return (with FieldTechnician)"
      - "Service-visit schedule/cancel (with Subscriber)"
      - "Account cancel (with Subscriber)"
      - "Read accounts, sub-resources, catalog"

  - name: FieldTechnician
    description: "Executes service visits in the field; assigned per visit; may handle equipment at site"
    identity: "entity_backed:Technician"
    exclusive_operations:
      - "POST /accounts/{id}/service-visits/{vid}/dispatch"
      - "POST /accounts/{id}/service-visits/{vid}/complete"
      - "POST /accounts/{id}/service-visits/{vid}/no-show"
    shared_operations:
      - "Equipment assign/return (with CustomerServiceAgent)"
      - "Read service visits and equipment leases"

  - name: Subscriber
    description: "The account holder performing self-service; X-User-ID equals the owned Account.id"
    identity: "entity_backed:Account"
    exclusive_operations: []
    shared_operations:
      - "Add-on attach/drop (with CustomerServiceAgent)"
      - "Service-visit schedule/cancel (with CustomerServiceAgent)"
      - "Account cancel (with CustomerServiceAgent)"
      - "Read own account, sub-resources, catalog"
