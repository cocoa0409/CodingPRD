              payload: {}
              as: ClientManager
              as_user_id: "${client_id}"
            - call: "POST /scripts/${script_id}/archive"
              payload: {}
              as: ClientManager
              as_user_id: "${client_id}"
          trigger:
            - call: "POST /scripts/${script_id}/publish"
              payload: {}
              as: ClientManager
              as_user_id: "${client_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_INVALID_STATE (409); script stays ARCHIVED"

      - name: sweep_deadline_expires_overdue_assigned_and_penalizes
        claim_type: Side Effect Execution
        grounds: [state_machines.Assignment.ASSIGNED_to_EXPIRED, entities.Shopper.fields.reliability_score]
        distinguishing_aspect: "After the clock advances past due_at, sweep-deadline expires an ASSIGNED Assignment and drops reliability_score by 20 (100→80)."
        test_recipe:
          setup: ["An ASSIGNED Assignment due 2026-06-05; clock advanced to 2026-06-06."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /clients"
              payload: { company_name: "SwpCo", billing_email: "s@x.test", fee_per_completed_shop_cents: 15000 }
              as: Anonymous
              captures: { client_id: $.data.id }
            - call: "POST /clients/${client_id}/locations"
              payload: { label: "SL", lat: 40.0, lng: -74.0, scenario_family: "RETAIL" }
              as: ClientManager
              as_user_id: "${client_id}"
              captures: { loc_id: $.data.id }
            - call: "POST /clients/${client_id}/scripts"
              payload: { title: "S", scenario_family: "RETAIL", required_photo_count: 1, receipt_required: false, reimburse_cap_cents: 5000, base_fee_cents: 2000, weights_json: { greeting: 1.0 }, passing_score: 70 }
              as: ClientManager
              as_user_id: "${client_id}"
              captures: { script_id: $.data.id }
            - call: "POST /scripts/${script_id}/publish"
              payload: {}
              as: ClientManager
              as_user_id: "${client_id}"
            - call: "POST /clients/${client_id}/waves"
              payload: { name: "SW", field_window_start: "2026-06-01T00:00:00Z", field_window_end: "2026-06-30T00:00:00Z", rotation_cooldown_days: 30 }
              as: ClientManager
              as_user_id: "${client_id}"
              captures: { wave_id: $.data.id }
            - call: "POST /waves/${wave_id}/publish"
              payload: {}
              as: ClientManager
              as_user_id: "${client_id}"
            - call: "POST /shoppers"
              payload: { full_name: "S Shop", email: "ss@x.test", home_lat: 40.0, home_lng: -74.0 }
              as: Anonymous
              captures: { shopper_id: $.data.id }
            - call: "POST /shoppers/${shopper_id}/certification-attempts"
              payload: { raw_score: 90, scenario_family: "RETAIL" }
              as: QaValidator
            - call: "POST /assignments"
              payload: { wave_id: "${wave_id}", shopper_id: "${shopper_id}", location_id: "${loc_id}", script_id: "${script_id}", due_at: "2026-06-05T00:00:00Z" }
              as: ClientManager
              as_user_id: "${client_id}"
