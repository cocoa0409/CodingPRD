              as: LeadAssessor
              as_user_id: "${lead_id}"
            - call: "POST /engagements/${eng_id}/system-components"
              payload: { hostname: "pay-01", component_type: "APPLICATION", function_class: "PAYMENT_APPLICATION", stores_chd: true, facility_name: "DC-EAST", facility_type: "DATA_CENTER", segment_id: "${seg_cde_id}" }
              as: LeadAssessor
              as_user_id: "${lead_id}"
            - call: "POST /engagements/${eng_id}/system-components"
              payload: { hostname: "pos-01", component_type: "POS_TERMINAL", function_class: "PAYMENT_APPLICATION", stores_chd: false, facility_name: "RETAIL-12", facility_type: "RETAIL_STORE", segment_id: "${seg_cde_id}" }
              as: LeadAssessor
