scaffold_corner_design:
  # ===================================================================
  # Section: entities
  # ===================================================================
  - section: entities
    instances:
      - name: producer_company_create_defaults_and_system_fields
        claim_type: creation
        grounds:
          - "entities.ProducerCompany"
          - "entities.ProducerCompany.fields.status"
          - "entities.ProducerCompany.fields.signatory_since"
        distinguishing_aspect: "A new company starts PENDING with signatory_since null, version 1, and a server-minted UUID id; the client cannot set status."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls:
            - { call: "POST /union-compliance/producer-companies", payload: { legal_name: "Aster Films LLC", fein: "20-0000001" }, as: ProducerRep, captures: { co_id: $.data.id } }
          trigger:
            - { call: "GET /union-compliance/producer-companies/${co_id}", payload: {}, as: ProducerRep, as_user_id: "${co_id}" }
          assert:
            - "ProducerCompany.${co_id}.status == PENDING"
            - "ProducerCompany.${co_id}.signatory_since == null"
            - "ProducerCompany.${co_id}.version == 1"
            - "ProducerCompany.${co_id}.id matches UUID format"

      - name: signatory_application_defaults_on_create
        claim_type: defaults
        grounds:
          - "entities.SignatoryApplication.fields.review_rounds"
          - "entities.SignatoryApplication.fields.status"
        distinguishing_aspect: "A created application starts DRAFT with review_rounds == 0 and denial_reason == null."
        test_recipe:
          setup: ["company PENDING"]
          setup_api_calls:
            - { call: "POST /union-compliance/producer-companies", payload: { legal_name: "Bracken LLC", fein: "20-0000002" }, as: ProducerRep, captures: { co_id: $.data.id } }
          trigger:
            - { call: "POST /union-compliance/signatory-applications", payload: { producer_company_id: "${co_id}", requested_agreement_scope: "TELEVISION", estimated_slate_budget_cents: 9000000 }, as: ProducerRep, as_user_id: "${co_id}", captures: { app_id: $.data.id } }
          assert:
            - "SignatoryApplication.${app_id}.status == DRAFT"
            - "SignatoryApplication.${app_id}.review_rounds == 0"
            - "SignatoryApplication.${app_id}.denial_reason == null"

      - name: production_create_rejects_computed_field_input
        claim_type: computed_fields
        grounds:
          - "entities.Production.fields.compliance_posture"
          - "validations[priority=4]"
        distinguishing_aspect: "compliance_posture is computed: supplying it in the create payload is rejected with ERR_VALIDATION (400), not silently honored."
        test_recipe:
          setup: ["SIGNATORY company"]
          setup_api_calls:
            - { call: "POST /union-compliance/producer-companies", payload: { legal_name: "Cinder LLC", fein: "20-0000003" }, as: ProducerRep, captures: { co_id: $.data.id } }
            - { call: "POST /union-compliance/signatory-applications", payload: { producer_company_id: "${co_id}", requested_agreement_scope: "THEATRICAL", estimated_slate_budget_cents: 20000000 }, as: ProducerRep, as_user_id: "${co_id}", captures: { app_id: $.data.id } }
            - { call: "POST /union-compliance/signatory-applications/${app_id}/submit", payload: {}, as: ProducerRep, as_user_id: "${co_id}" }
            - { call: "POST /union-compliance/signatory-applications/${app_id}/decide", payload: { decision: "APPROVE" }, as: UnionRep }
          trigger:
            - { call: "POST /union-compliance/productions", payload: { producer_company_id: "${co_id}", title: "Cinder Cut", agreement_tier: "ULTRA_LOW_BUDGET", budget_cents: 20000000, compliance_posture: "FROZEN" }, as: ProducerRep, as_user_id: "${co_id}", captures: { err: $.data.error_id } }
          assert:
            - "${err} == ERR_VALIDATION"
            - "no Production exists for the company (GET /union-compliance/producer-companies/${co_id}/productions returns an empty list)"

      - name: production_get_not_found_returns_404
        claim_type: not_found
        grounds:
          - "validations[priority=5]"
          - "errors[ERR_RESOURCE_NOT_FOUND]"
        distinguishing_aspect: "GET with a well-formed but unknown UUID returns 404 ERR_RESOURCE_NOT_FOUND in the error envelope."
        test_recipe:
          setup: ["one company exists"]
          setup_api_calls:
            - { call: "POST /union-compliance/producer-companies", payload: { legal_name: "Dovetail LLC", fein: "20-0000004" }, as: ProducerRep, captures: { co_id: $.data.id } }
          trigger:
            - { call: "GET /union-compliance/productions/00000000-0000-0000-0000-000000000000", payload: {}, as: ProducerRep, as_user_id: "${co_id}", captures: { err: $.data.error_id } }
          assert:
            - "${err} == ERR_RESOURCE_NOT_FOUND"

      - name: bond_auto_created_with_tier_requirement
        claim_type: computed_fields
        grounds:
          - "entities.Bond.fields.amount_required_cents"
          - "calculations.bond_requirement"
          - "endpoints.POST /union-compliance/productions"
        distinguishing_aspect: "Creating an ULTRA_LOW_BUDGET production auto-creates exactly one Bond: status PENDING, amount_required_cents 2500000, amount_held_cents 0, all ledger totals 0."
        test_recipe:
          setup: ["SIGNATORY company"]
          setup_api_calls:
            - { call: "POST /union-compliance/producer-companies", payload: { legal_name: "Elmwood LLC", fein: "20-0000005" }, as: ProducerRep, captures: { co_id: $.data.id } }
            - { call: "POST /union-compliance/signatory-applications", payload: { producer_company_id: "${co_id}", requested_agreement_scope: "THEATRICAL", estimated_slate_budget_cents: 20000000 }, as: ProducerRep, as_user_id: "${co_id}", captures: { app_id: $.data.id } }
            - { call: "POST /union-compliance/signatory-applications/${app_id}/submit", payload: {}, as: ProducerRep, as_user_id: "${co_id}" }
            - { call: "POST /union-compliance/signatory-applications/${app_id}/decide", payload: { decision: "APPROVE" }, as: UnionRep }
          trigger:
            - { call: "POST /union-compliance/productions", payload: { producer_company_id: "${co_id}", title: "Elm Row", agreement_tier: "ULTRA_LOW_BUDGET", budget_cents: 20000000 }, as: ProducerRep, as_user_id: "${co_id}", captures: { prod_id: $.data.id } }
            - { call: "GET /union-compliance/productions/${prod_id}/bonds", payload: {}, as: ProducerRep, as_user_id: "${co_id}", captures: { bond_id: "$.data[0].id", bond_status: "$.data[0].status", bond_req: "$.data[0].amount_required_cents" } }
          assert:
            - "the bonds list has exactly 1 element"
            - "${bond_status} == PENDING"
            - "${bond_req} == 2500000"
            - "Bond.${bond_id}.amount_held_cents == 0 and total_posted_cents == 0 and total_released_cents == 0 and total_forfeited_cents == 0"

      - name: fk_integrity_crew_assignment_unknown_production_rejected
        claim_type: parent_relationships
        grounds:
          - "entities.CrewAssignment.fields.production_id"
          - "validations[priority=5]"
        distinguishing_aspect: "A crew assignment referencing a non-existent production_id fails FK existence with ERR_RESOURCE_NOT_FOUND (flat-topology referential integrity)."
        test_recipe:
          setup: ["one company exists"]
          setup_api_calls:
            - { call: "POST /union-compliance/producer-companies", payload: { legal_name: "Fernhill LLC", fein: "20-0000006" }, as: ProducerRep, captures: { co_id: $.data.id } }
          trigger:
            - { call: "POST /union-compliance/crew-assignments", payload: { production_id: "00000000-0000-0000-0000-000000000000", crew_member_ref: "W-X-1", department: "CAMERA", classification: "CAMERA_OPERATOR", daily_rate_cents: 100000 }, as: ProducerRep, as_user_id: "${co_id}", captures: { err: $.data.error_id } }
          assert:
            - "${err} == ERR_RESOURCE_NOT_FOUND"

      - name: productions_list_pagination_envelope
        claim_type: listing
        grounds:
          - "response_envelope"
          - "endpoints.GET /union-compliance/producer-companies/{id}/productions"
        distinguishing_aspect: "List pagination: with 3 productions, limit=2&offset=0 returns total_count 3 and has_more true; offset=2 returns 1 item and has_more false."
        test_recipe:
          setup: ["SIGNATORY company with 3 productions (P1, P2, P3)"]
          setup_api_calls:
            - { call: "POST /union-compliance/producer-companies", payload: { legal_name: "Galewood LLC", fein: "20-0000007" }, as: ProducerRep, captures: { co_id: $.data.id } }
            - { call: "POST /union-compliance/signatory-applications", payload: { producer_company_id: "${co_id}", requested_agreement_scope: "THEATRICAL", estimated_slate_budget_cents: 60000000 }, as: ProducerRep, as_user_id: "${co_id}", captures: { app_id: $.data.id } }
            - { call: "POST /union-compliance/signatory-applications/${app_id}/submit", payload: {}, as: ProducerRep, as_user_id: "${co_id}" }
            - { call: "POST /union-compliance/signatory-applications/${app_id}/decide", payload: { decision: "APPROVE" }, as: UnionRep }
            - { call: "POST /union-compliance/productions", payload: { producer_company_id: "${co_id}", title: "P1", agreement_tier: "ULTRA_LOW_BUDGET", budget_cents: 10000000 }, as: ProducerRep, as_user_id: "${co_id}" }
            - { call: "POST /union-compliance/productions", payload: { producer_company_id: "${co_id}", title: "P2", agreement_tier: "ULTRA_LOW_BUDGET", budget_cents: 10000000 }, as: ProducerRep, as_user_id: "${co_id}" }
            - { call: "POST /union-compliance/productions", payload: { producer_company_id: "${co_id}", title: "P3", agreement_tier: "ULTRA_LOW_BUDGET", budget_cents: 10000000 }, as: ProducerRep, as_user_id: "${co_id}" }
          trigger:
            - { call: "GET /union-compliance/producer-companies/${co_id}/productions?limit=2&offset=0", payload: {}, as: ProducerRep, as_user_id: "${co_id}" }
            - { call: "GET /union-compliance/producer-companies/${co_id}/productions?limit=2&offset=2", payload: {}, as: ProducerRep, as_user_id: "${co_id}" }
          assert:
            - "first page: total_count == 3, has_more == true, data length == 2"
            - "second page: total_count == 3, has_more == false, data length == 1"

  # ===================================================================
  # Section: state_machines
  # ===================================================================
  - section: state_machines
    instances:
      - name: signatory_application_submit_twice_rejected
        claim_type: invalid_transition
        grounds:
          - "state_machines.SignatoryApplication.DRAFT_to_UNDER_REVIEW"
          - "errors[ERR_APPLICATION_STATE]"
        distinguishing_aspect: "From UNDER_REVIEW the submit trigger is not in the transition list — the second submit fails with ERR_APPLICATION_STATE and no side effects."
        test_recipe:
          setup: ["company PENDING; application submitted once (UNDER_REVIEW)"]
          setup_api_calls:
            - { call: "POST /union-compliance/producer-companies", payload: { legal_name: "Hollyhock LLC", fein: "20-0000008" }, as: ProducerRep, captures: { co_id: $.data.id } }
            - { call: "POST /union-compliance/signatory-applications", payload: { producer_company_id: "${co_id}", requested_agreement_scope: "NEW_MEDIA", estimated_slate_budget_cents: 9000000 }, as: ProducerRep, as_user_id: "${co_id}", captures: { app_id: $.data.id } }
            - { call: "POST /union-compliance/signatory-applications/${app_id}/submit", payload: {}, as: ProducerRep, as_user_id: "${co_id}" }
          trigger:
            - { call: "POST /union-compliance/signatory-applications/${app_id}/submit", payload: {}, as: ProducerRep, as_user_id: "${co_id}", captures: { err: $.data.error_id } }
          assert:
            - "${err} == ERR_APPLICATION_STATE"
            - "SignatoryApplication.${app_id}.status == UNDER_REVIEW (unchanged)"

      - name: bond_release_before_close_rejected
        claim_type: precondition_enforcement
        grounds:
          - "state_machines.Bond.POSTED_to_RELEASED"
          - "errors[ERR_BOND_STATE]"
        distinguishing_aspect: "Release requires production CLOSED; a POSTED bond of a STAFFING production rejects with ERR_BOND_STATE and no ledger movement."
        test_recipe:
          setup: ["SIGNATORY company; ULB production STAFFING; bond POSTED 2500000"]
          setup_api_calls:
            - { call: "POST /union-compliance/producer-companies", payload: { legal_name: "Ironbark LLC", fein: "20-0000009" }, as: ProducerRep, captures: { co_id: $.data.id } }
            - { call: "POST /union-compliance/signatory-applications", payload: { producer_company_id: "${co_id}", requested_agreement_scope: "THEATRICAL", estimated_slate_budget_cents: 20000000 }, as: ProducerRep, as_user_id: "${co_id}", captures: { app_id: $.data.id } }
            - { call: "POST /union-compliance/signatory-applications/${app_id}/submit", payload: {}, as: ProducerRep, as_user_id: "${co_id}" }
            - { call: "POST /union-compliance/signatory-applications/${app_id}/decide", payload: { decision: "APPROVE" }, as: UnionRep }
            - { call: "POST /union-compliance/productions", payload: { producer_company_id: "${co_id}", title: "Iron Run", agreement_tier: "ULTRA_LOW_BUDGET", budget_cents: 20000000 }, as: ProducerRep, as_user_id: "${co_id}", captures: { prod_id: $.data.id } }
            - { call: "GET /union-compliance/productions/${prod_id}/bonds", payload: {}, as: ProducerRep, as_user_id: "${co_id}", captures: { bond_id: "$.data[0].id" } }
            - { call: "POST /union-compliance/bonds/${bond_id}/post", payload: { amount_cents: 2500000 }, as: ProducerRep, as_user_id: "${co_id}" }
          trigger:
            - { call: "POST /union-compliance/bonds/${bond_id}/release", payload: {}, as: FundTrustee, as_user_id: "ft_1", captures: { err: $.data.error_id } }
          assert:
            - "${err} == ERR_BOND_STATE"
            - "Bond.${bond_id}.status == POSTED and total_released_cents == 0"

      - name: grievance_decide_before_escalation_rejected
        claim_type: precondition_enforcement
        grounds:
          - "state_machines.Grievance.ESCALATED_to_DECIDED"
          - "errors[ERR_GRIEVANCE_STATE]"
        distinguishing_aspect: "Arbitrator decide requires ESCALATED; on a FILED grievance it fails with ERR_GRIEVANCE_STATE (correct role, wrong state)."
        test_recipe:
          setup: ["SIGNATORY company; ULB production STAFFING; grievance FILED (incident 2026-07-20)"]
          setup_api_calls:
            - { call: "POST /union-compliance/producer-companies", payload: { legal_name: "Jackpine LLC", fein: "20-0000010" }, as: ProducerRep, captures: { co_id: $.data.id } }
            - { call: "POST /union-compliance/signatory-applications", payload: { producer_company_id: "${co_id}", requested_agreement_scope: "THEATRICAL", estimated_slate_budget_cents: 20000000 }, as: ProducerRep, as_user_id: "${co_id}", captures: { app_id: $.data.id } }
            - { call: "POST /union-compliance/signatory-applications/${app_id}/submit", payload: {}, as: ProducerRep, as_user_id: "${co_id}" }
            - { call: "POST /union-compliance/signatory-applications/${app_id}/decide", payload: { decision: "APPROVE" }, as: UnionRep }
            - { call: "POST /union-compliance/productions", payload: { producer_company_id: "${co_id}", title: "Jack Pine", agreement_tier: "ULTRA_LOW_BUDGET", budget_cents: 20000000 }, as: ProducerRep, as_user_id: "${co_id}", captures: { prod_id: $.data.id } }
            - { call: "GET /union-compliance/productions/${prod_id}/bonds", payload: {}, as: ProducerRep, as_user_id: "${co_id}", captures: { bond_id: "$.data[0].id" } }
            - { call: "POST /union-compliance/bonds/${bond_id}/post", payload: { amount_cents: 2500000 }, as: ProducerRep, as_user_id: "${co_id}" }
            - { call: "POST /union-compliance/grievances", payload: { production_id: "${prod_id}", category: "SAFETY", incident_date: "2026-07-20", description: "Unsafe rigging" }, as: UnionRep, as_user_id: "ur_1", captures: { grv_id: $.data.id } }
          trigger:
            - { call: "POST /union-compliance/grievances/${grv_id}/decide", payload: { award_cents: 5000 }, as: Arbitrator, as_user_id: "arb_1", captures: { err: $.data.error_id } }
          assert:
            - "${err} == ERR_GRIEVANCE_STATE"
            - "Grievance.${grv_id}.status == FILED (unchanged)"

      - name: report_review_from_draft_rejected
        claim_type: invalid_transition
        grounds:
          - "state_machines.ContributionReport.SUBMITTED_to_ACCEPTED"
          - "errors[ERR_REPORT_STATE]"
        distinguishing_aspect: "Review requires SUBMITTED; reviewing a DRAFT report fails with ERR_REPORT_STATE."
        test_recipe:
          setup: ["SIGNATORY company; ULB production IN_PRODUCTION; CAMERA ACTIVE with L1 SUBMITTED; report period 1 DRAFT"]
          setup_api_calls:
            - { call: "POST /union-compliance/producer-companies", payload: { legal_name: "Knotweed LLC", fein: "20-0000011" }, as: ProducerRep, captures: { co_id: $.data.id } }
            - { call: "POST /union-compliance/signatory-applications", payload: { producer_company_id: "${co_id}", requested_agreement_scope: "TELEVISION", estimated_slate_budget_cents: 20000000 }, as: ProducerRep, as_user_id: "${co_id}", captures: { app_id: $.data.id } }
            - { call: "POST /union-compliance/signatory-applications/${app_id}/submit", payload: {}, as: ProducerRep, as_user_id: "${co_id}" }
            - { call: "POST /union-compliance/signatory-applications/${app_id}/decide", payload: { decision: "APPROVE" }, as: UnionRep }
            - { call: "POST /union-compliance/productions", payload: { producer_company_id: "${co_id}", title: "Knot Line", agreement_tier: "ULTRA_LOW_BUDGET", budget_cents: 20000000 }, as: ProducerRep, as_user_id: "${co_id}", captures: { prod_id: $.data.id } }
            - { call: "GET /union-compliance/productions/${prod_id}/bonds", payload: {}, as: ProducerRep, as_user_id: "${co_id}", captures: { bond_id: "$.data[0].id" } }
            - { call: "POST /union-compliance/bonds/${bond_id}/post", payload: { amount_cents: 2500000 }, as: ProducerRep, as_user_id: "${co_id}" }
            - { call: "POST /union-compliance/crew-assignments", payload: { production_id: "${prod_id}", crew_member_ref: "W-CAM-1", department: "CAMERA", classification: "CAMERA_OPERATOR", daily_rate_cents: 100000 }, as: ProducerRep, as_user_id: "${co_id}", captures: { cam_id: $.data.id } }
            - { call: "POST /union-compliance/crew-assignments", payload: { production_id: "${prod_id}", crew_member_ref: "W-GRIP-1", department: "GRIP_ELECTRIC", classification: "GAFFER", daily_rate_cents: 90000 }, as: ProducerRep, as_user_id: "${co_id}" }
            - { call: "POST /union-compliance/crew-assignments", payload: { production_id: "${prod_id}", crew_member_ref: "W-SND-1", department: "SOUND", classification: "BOOM_OPERATOR", daily_rate_cents: 80000 }, as: ProducerRep, as_user_id: "${co_id}" }
            - { call: "POST /union-compliance/productions/${prod_id}/start-production", payload: {}, as: ProducerRep, as_user_id: "${co_id}" }
            - { call: "POST /union-compliance/crew-assignments/${cam_id}/transition", payload: { to_state: "ACTIVE" }, as: ProducerRep, as_user_id: "${co_id}" }
            - { call: "POST /union-compliance/work-day-logs", payload: { crew_assignment_id: "${cam_id}", work_date: "2026-08-10", call_time_minutes: 480, wrap_time_minutes: 960, meal_breaks: [ { start_minutes: 600, end_minutes: 630 } ] }, as: ProducerRep, as_user_id: "${co_id}", captures: { l1_id: $.data.id } }
            - { call: "POST /union-compliance/work-day-logs/${l1_id}/submit", payload: {}, as: ProducerRep, as_user_id: "${co_id}" }
            - { call: "POST /union-compliance/contribution-reports", payload: { production_id: "${prod_id}", period_index: 1, work_day_log_ids: [ "${l1_id}" ] }, as: ProducerRep, as_user_id: "${co_id}", captures: { rep_id: $.data.id } }
          trigger:
            - { call: "POST /union-compliance/contribution-reports/${rep_id}/review", payload: { decision: "ACCEPT" }, as: FundTrustee, as_user_id: "ft_1", captures: { err: $.data.error_id } }
          assert:
            - "${err} == ERR_REPORT_STATE"
            - "ContributionReport.${rep_id}.status == DRAFT (unchanged)"

      - name: work_log_submit_after_void_rejected
        claim_type: invalid_transition
        grounds:
          - "state_machines.WorkDayLog.OPEN_to_VOIDED"
          - "state_machines.WorkDayLog.OPEN_to_SUBMITTED"
          - "errors[ERR_WORKLOG_STATE]"
        distinguishing_aspect: "VOIDED is terminal: submitting a voided log fails with ERR_WORKLOG_STATE."
        test_recipe:
          setup: ["SIGNATORY company; ULB production IN_PRODUCTION; CAMERA ACTIVE; L1 created then voided"]
          setup_api_calls:
            - { call: "POST /union-compliance/producer-companies", payload: { legal_name: "Larkspur LLC", fein: "20-0000012" }, as: ProducerRep, captures: { co_id: $.data.id } }
            - { call: "POST /union-compliance/signatory-applications", payload: { producer_company_id: "${co_id}", requested_agreement_scope: "THEATRICAL", estimated_slate_budget_cents: 20000000 }, as: ProducerRep, as_user_id: "${co_id}", captures: { app_id: $.data.id } }
            - { call: "POST /union-compliance/signatory-applications/${app_id}/submit", payload: {}, as: ProducerRep, as_user_id: "${co_id}" }
            - { call: "POST /union-compliance/signatory-applications/${app_id}/decide", payload: { decision: "APPROVE" }, as: UnionRep }
            - { call: "POST /union-compliance/productions", payload: { producer_company_id: "${co_id}", title: "Lark Spur", agreement_tier: "ULTRA_LOW_BUDGET", budget_cents: 20000000 }, as: ProducerRep, as_user_id: "${co_id}", captures: { prod_id: $.data.id } }
            - { call: "GET /union-compliance/productions/${prod_id}/bonds", payload: {}, as: ProducerRep, as_user_id: "${co_id}", captures: { bond_id: "$.data[0].id" } }
            - { call: "POST /union-compliance/bonds/${bond_id}/post", payload: { amount_cents: 2500000 }, as: ProducerRep, as_user_id: "${co_id}" }
            - { call: "POST /union-compliance/crew-assignments", payload: { production_id: "${prod_id}", crew_member_ref: "W-CAM-1", department: "CAMERA", classification: "CAMERA_OPERATOR", daily_rate_cents: 100000 }, as: ProducerRep, as_user_id: "${co_id}", captures: { cam_id: $.data.id } }
            - { call: "POST /union-compliance/crew-assignments", payload: { production_id: "${prod_id}", crew_member_ref: "W-GRIP-1", department: "GRIP_ELECTRIC", classification: "GAFFER", daily_rate_cents: 90000 }, as: ProducerRep, as_user_id: "${co_id}" }
            - { call: "POST /union-compliance/crew-assignments", payload: { production_id: "${prod_id}", crew_member_ref: "W-SND-1", department: "SOUND", classification: "BOOM_OPERATOR", daily_rate_cents: 80000 }, as: ProducerRep, as_user_id: "${co_id}" }
            - { call: "POST /union-compliance/productions/${prod_id}/start-production", payload: {}, as: ProducerRep, as_user_id: "${co_id}" }
            - { call: "POST /union-compliance/crew-assignments/${cam_id}/transition", payload: { to_state: "ACTIVE" }, as: ProducerRep, as_user_id: "${co_id}" }
            - { call: "POST /union-compliance/work-day-logs", payload: { crew_assignment_id: "${cam_id}", work_date: "2026-08-10", call_time_minutes: 480, wrap_time_minutes: 960, meal_breaks: [ { start_minutes: 600, end_minutes: 630 } ] }, as: ProducerRep, as_user_id: "${co_id}", captures: { l1_id: $.data.id } }
            - { call: "POST /union-compliance/work-day-logs/${l1_id}/void", payload: {}, as: ProducerRep, as_user_id: "${co_id}" }
          trigger:
            - { call: "POST /union-compliance/work-day-logs/${l1_id}/submit", payload: {}, as: ProducerRep, as_user_id: "${co_id}", captures: { err: $.data.error_id } }
          assert:
            - "${err} == ERR_WORKLOG_STATE"
            - "WorkDayLog.${l1_id}.status == VOIDED (unchanged)"

      - name: closed_production_start_rejected_terminal_lockdown
        claim_type: terminal_state_lockdown
        grounds:
          - "state_machines.Production"
          - "errors[ERR_PRODUCTION_STATE]"
        distinguishing_aspect: "CLOSED is terminal: start-production on a CLOSED production fails with ERR_PRODUCTION_STATE; no lifecycle action fires from CLOSED."
        test_recipe:
