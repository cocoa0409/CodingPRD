      - name: plan_room_access_tracking_and_declined_block
        claim_type: conditional_action
        grounds: ["endpoints[POST /invitations/{id}/plan-room-access]", entities.Invitation.fields.plan_room_access_count, "errors[ERR_INVITATION_DECLINED]", "errors[ERR_PACKAGE_NOT_ACCEPTING_BIDS]"]
        distinguishing_aspect: "Plan-room access is recorded monotonically (count increments, first-access timestamp stable), blocked before publish (package DRAFT) and after decline."
        test_recipe:
          setup: ["Package with invitation (SENT); first access attempt while DRAFT; then PUBLISHED"]
          setup_api_calls:
            - call: "POST /subcontractors"
              payload: { legal_name: "Room LLC", contact_email: "rm@x.com", license_number: "LIC-R-5002" }
              as: Anonymous
              captures: { sub_r: $.data.id }
            - call: "POST /bid-packages"
              payload: { name: "Room Package", trade_code: "051200", bid_due_at: "2026-08-10T14:00:00Z" }
              as: LeadEstimator
              captures: { pkg: $.data.id }
            - call: "POST /invitations"
              payload: { bid_package_id: "${pkg}", subcontractor_id: "${sub_r}" }
              as: LeadEstimator
              captures: { inv_r: $.data.id }
          trigger:
            - call: "POST /invitations/${inv_r}/plan-room-access"
              as: Subcontractor
              as_user_id: "${sub_r}"
              captures: { e_draft: $.data.error_id }
            - call: "POST /bid-packages/${pkg}/publish"
              as: LeadEstimator
            - call: "POST /invitations/${inv_r}/plan-room-access"
              as: Subcontractor
              as_user_id: "${sub_r}"
              captures: { first_at: $.data.first_plan_room_access_at }
            - call: "POST /invitations/${inv_r}/plan-room-access"
              as: Subcontractor
              as_user_id: "${sub_r}"
            - call: "POST /invitations/${inv_r}/respond"
              payload: { intent: "DECLINED" }
              as: Subcontractor
              as_user_id: "${sub_r}"
            - call: "POST /invitations/${inv_r}/plan-room-access"
              as: Subcontractor
              as_user_id: "${sub_r}"
              captures: { e_dec: $.data.error_id }
          assert:
            - "While DRAFT: e_draft == ERR_PACKAGE_NOT_ACCEPTING_BIDS (409; plan room opens at publish)"
            - "After publish: first access 200, first_plan_room_access_at set, plan_room_access_count == 1"
            - "Second access: count == 2 and first_plan_room_access_at unchanged (== ${first_at})"
            - "After DECLINED: e_dec == ERR_INVITATION_DECLINED (409), count stays 2"

