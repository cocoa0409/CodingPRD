            - "Call 1: the band rates are BAND_A 100.00 (2 of 2 COMPLIANT) and BAND_B 50.00 (1 of 2), so equity_variance_pct == round_half_up(100.00 - 50.00, 2) == 50.00 and equity_flag == true (50.00 > 20.00)"
            - "Call 1: the suppressed BAND_C would have scored 0.00 and widened the spread to 100.00 - the asserted 50.00 proves the small cell was dropped rather than merely down-weighted"
            - "Call 1: collaboration_index == 60.00 - T-A is the only team with a settled week, its sub_score is round_half_up(100 * (3 + 3) / (5 + 5), 2) == 60.00, and a single-team weighted mean returns it unchanged - so meets_collaboration_target == false against the 70.00 target"
            - "Call 1: total_space_chargeback_cents == 0 because no allocation is COMMITTED anywhere in the cycle"
            - "Call 2: HTTP 409 ERR_EQUITY_FLAG_BLOCKS_ADOPTION with state still 'SUBMITTED', no Team touched and PolicyCycle.posture still 'RECALIBRATING'"
            - "Call 3: HTTP 200, state == 'REJECTED' - the equity flag blocks only ADOPT; posture returns to 'OPEN' and the cycle version advances by 1"

      - name: auto_desk_selection_prefers_the_anchor_team_over_lower_utilization
        claim_type: correct_result
        grounds:
          - calculations.desk_selector
          - endpoints[POST /desk-assignments/auto]
        distinguishing_aspect: "Rank 1 (anchor match) strictly dominates rank 2 (lower utilization), so the server picks the BUSIER anchor neighborhood over an emptier non-anchor one; within the winner it takes the lowest free desk index, and a vacated desk re-enters the pool at its original index rather than at the end."
        test_recipe:
          setup:
            - "Cycle, teams T-A (12 planned / 3 days -> entitled_seats 10) and T-B, three employees on T-A, and two neighborhoods each with seat_count 13 and buffer_seats 4 (capacity 9): N-ANCHOR anchored to T-A with desks 1..13 and N-OTHER anchored to T-B with desks 21..33. T-A holds a COMMITTED 6-seat allocation on N-ANCHOR (utilization 100 * 6 / 9 == 66.67) and a COMMITTED 2-seat allocation on N-OTHER (22.22), both over [2026-W37, 2026-W40)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T09:00:00Z" }
