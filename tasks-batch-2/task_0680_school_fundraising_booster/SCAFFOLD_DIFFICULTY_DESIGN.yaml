  # ===========================================================================
  - rule_id: compensating_invariant
    instances:
      # --- #1: refund conserves campaign.gross_collected_cents (money) ---
      - name: pay_then_refund_conserves_gross_collected
        grounds:
          - state_machines.Order.PENDING_to_PAID
          - state_machines.Order.PAID_to_REFUNDED
          - calculations.campaign_gross
          - entities.Campaign.fields.gross_collected_cents
        distinguishing_aspect: |
          Conserved quantity = campaign.gross_collected_cents (MONEY). Pay adds
          total_charged_cents (10825) to gross_collected; the compensating refund
          removes exactly the same amount, returning gross_collected to its
          pre-pay value (0). Invariant: gross_collected after (pay,refund) ==
          gross_collected before pay.
        test_recipe:
          setup:
            - "ACTIVE CATALOG campaign, 1 seller, 1 product (price2000/cost800/stock100), 1 prize tier; one PLACED+PENDING order (total 10825)."
          setup_api_calls:
            - call: "POST /fundraising/campaigns"
