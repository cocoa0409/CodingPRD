            - { call: "POST /api/posting-records", payload: { flight_id: "${fl1}", posted_on: "2026-08-10", photo_proof_url: "https://proof.example/1.jpg" }, as: FieldInstaller, as_user_id: "installer-1", captures: { pr: $.data.id } }
            - { call: "PUT /api/posting-records/${pr}", payload: { status: "VERIFIED" }, as: OperationsAuditor, as_user_id: "auditor-1" }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-08-20T00:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /api/campaigns", payload: { advertiser_id: "${adv}", name: "C2", start_date: "2026-08-01", end_date: "2026-10-31" }, as: SalesPlanner, captures: { camp2: $.data.id } }
            - { call: "GET /api/faces/${f1}", payload: {}, as: SalesPlanner, captures: { f1_v2: $.data.version } }
          trigger:
            - { call: "POST /api/flights", payload: { campaign_id: "${camp2}", face_id: "${f1}", rate_card_id: "${rc}", start_date: "2026-08-25", end_date: "2026-09-21", expected_face_version: "${f1_v2}" }, as: SalesPlanner, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_FACE_NOT_BOOKABLE (business_safety P7 beats business_constraint P10 even though the window also overlaps the LIVE flight with no changeover day)"
      - name: state_beats_fiscal_on_confirm
        grounds:
          - validations[priority=5]
          - validations[priority=14]
        distinguishing_aspect: |
          Category pair = state (P5) vs business_fiscal (P14) — different pair from the
          safety/constraint instance. One confirm call violates BOTH (flight already
          BOOKED; advertiser exposure would exceed the credit limit) and the state error
          ERR_INVALID_STATE must win.
        test_recipe:
          setup:
            - "Static faces F1 (illuminated, 300000) and F2 (not illuminated, 50000), each with permit to 2026-12-31; PUBLISHED static card"
            - "Advertiser credit_limit 1900000; campaign APPROVED with two HELD flights: A on F1 (net 1150000), B on F2 (net 800000), both 2026-08-10..2026-09-06"
            - "A confirmed (exposure 1150000); first confirm of B rejected 402 (1950000 > 1900000); limit raised to 10000000; B confirmed (exposure 1950000); limit lowered to exactly 1950000 (== current exposure, allowed)"
