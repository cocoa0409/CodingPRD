          - concurrency_rules[scaling-stale-warehouse]
        distinguishing_aspect: "The scaling action declares expected_warehouse_version as a required input, so omitting it is a request-shape failure before any OCC comparison happens."
        test_recipe:
          setup: ["one running LARGE warehouse with clusters_max 3"]
