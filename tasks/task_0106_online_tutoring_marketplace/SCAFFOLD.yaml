scenario: |
  Online Tutoring Marketplace (Wyzant style): tutor credential verification,
  subject tagging, hourly pricing, trial lesson rules, per-session settlement
  and platform commission, refund arbitration, parent account child management.

domain_name: online-tutoring-marketplace
api_prefix: /tutoring

complexity_profile:
  primary_archetype: multi_party_negotiation
  secondary_archetype: pricing_engine
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers
    - scheduled_deferred_actions
  entity_topology: hybrid
  state_machine_shape: cyclic
  relationship_patterns:
    - one_to_many
    - many_to_many
    - cross_aggregate
  role_model: segregation_of_duties
  consistency_model: immediate

# =============================================================================
# §1.0 Response Envelope (FIXED — EMITTED VERBATIM)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Tutor
    parent: null
    common_fields: true
    fields:
      - name: display_name
        type: string
        source: input
        description: "Public tutor name."
        constraints: "1..80 chars"
      - name: email
        type: string
        source: input
        description: "Login email; globally unique."
        constraints: "RFC5322; unique among Tutor.email"
      - name: hourly_rate_cents
        type: integer
        source: input
        description: "Standard hourly price in cents."
        constraints: "1000 <= value <= 50000 (i.e. $10..$500/hr)"
      - name: trial_rate_cents
        type: integer
        source: input
        description: "Per-hour price for the (at most one) eligible trial lesson; must be <= hourly_rate_cents."
        constraints: "0 <= value <= hourly_rate_cents"
      - name: verification_status
        type: enum
        source: computed
        description: "Aggregate credential posture; gates whether tutor may accept bookings."
        default: UNVERIFIED
        constraints: "{UNVERIFIED, PENDING_REVIEW, VERIFIED, REJECTED, SUSPENDED}"
      - name: subject_tags
        type: array
        source: computed
        description: "Snapshot list of subject codes from approved SubjectTag rows (denormalized cache, refreshed on SubjectTag transitions). Each entry is the SubjectTag.subject_code string."
      - name: payout_balance_cents
        type: integer
        source: computed
        description: "Cents currently owed to the tutor — settled but not yet paid out."
        default: 0
      - name: lifetime_completed_sessions
        type: integer
        source: computed
        description: "Count of Session rows for this tutor in state COMPLETED. Used by trial eligibility for Students."
        default: 0

  - name: Student
    parent: null
    common_fields: true
    fields:
      - name: display_name
        type: string
        source: input
        description: "Student name."
        constraints: "1..80 chars"
      - name: email
        type: string
        source: input
        description: "Login email; globally unique among Student.email."
        constraints: "RFC5322; unique among Student.email"
      - name: account_type
        type: enum
        source: input
        description: "ADULT students self-book; MINOR students MUST have parent_id set and may only book through a ParentChildLink approved by a Parent."
        constraints: "{ADULT, MINOR}"
      - name: parent_id
        type: string
        source: input
        description: "Parent.id when account_type=MINOR; MUST be null for ADULT."
      - name: credit_balance_cents
        type: integer
        source: computed
        description: "Credits issued by refund arbitration; spendable on future Session bookings via apply_credits flag."
        default: 0

  - name: Parent
    parent: null
    common_fields: true
    fields:
      - name: display_name
        type: string
        source: input
        description: "Parent name."
        constraints: "1..80 chars"
      - name: email
        type: string
        source: input
        description: "Login email; globally unique among Parent.email."
        constraints: "RFC5322; unique among Parent.email"
      - name: managed_child_count
        type: integer
        source: computed
        description: "Number of Student rows with parent_id=self.id AND account_type=MINOR AND deleted_at IS NULL. Hard cap 10."
        default: 0

  - name: Credential
    parent: Tutor
    common_fields: true
    fields:
      - name: tutor_id
        type: string
        source: input
        description: "Owning tutor."
      - name: credential_type
        type: enum
        source: input
        description: "Kind of evidence submitted."
        constraints: "{GOVERNMENT_ID, DEGREE, TEACHING_LICENSE, BACKGROUND_CHECK}"
      - name: document_ref
        type: string
        source: input
        description: "Opaque blob reference for the uploaded document."
      - name: status
        type: enum
        source: computed
        description: "Per-credential verification state."
        default: SUBMITTED
        constraints: "{SUBMITTED, APPROVED, REJECTED, EXPIRED}"
      - name: reviewed_by
        type: string
        source: computed
        description: "Verifier opaque user id (set on APPROVE/REJECT)."
      - name: expires_at
        type: datetime
        source: input
        description: "ISO timestamp at which APPROVED credential auto-expires; null = no expiry."

  - name: SubjectTag
    parent: Tutor
    common_fields: true
    fields:
      - name: tutor_id
        type: string
        source: input
        description: "Owning tutor."
      - name: subject_code
        type: string
        source: input
        description: "Subject identifier from controlled vocabulary; unique per tutor."
        constraints: "matches ^[A-Z][A-Z0-9_]{2,29}$ ; unique on (tutor_id, subject_code)"
      - name: proficiency_level
        type: enum
        source: input
        description: "Self-declared tier."
        constraints: "{BEGINNER, INTERMEDIATE, ADVANCED, EXPERT}"
      - name: status
        type: enum
        source: computed
        description: "Tag posture."
        default: PROPOSED
        constraints: "{PROPOSED, APPROVED, REMOVED}"

  - name: Session
    parent: null
    common_fields: true
    fields:
      - name: tutor_id
        type: string
        source: input
        description: "FK to Tutor."
      - name: student_id
        type: string
        source: input
        description: "FK to Student."
      - name: subject_code
        type: string
        source: input
        description: "Must match an APPROVED SubjectTag for the tutor."
      - name: start_at
        type: datetime
        source: input
        description: "Scheduled start (ISO UTC, three fractional digits)."
      - name: end_at
        type: datetime
        source: input
        description: "Scheduled end (ISO UTC). MUST be > start_at."
      - name: is_trial
        type: boolean
        source: input
        description: "Tutor-student pair gets at most one trial. Server validates eligibility at booking."
        default: false
      - name: apply_credits
        type: boolean
        source: input
        description: "If true, available Student.credit_balance_cents is consumed at booking time up to gross price."
        default: false
      - name: status
        type: enum
        source: computed
        description: "Session lifecycle."
        default: REQUESTED
        constraints: "{REQUESTED, CONFIRMED, IN_PROGRESS, COMPLETED, CANCELLED_BY_STUDENT, CANCELLED_BY_TUTOR, DISPUTED, REFUNDED, SETTLED}"
      - name: gross_price_cents
        type: integer
        source: computed
        description: "Per pricing_gross calculation; pinned at REQUESTED."
      - name: credit_applied_cents
        type: integer
        source: computed
        description: "Credits actually consumed at booking (<= min(gross_price_cents, Student.credit_balance_cents at booking)). Pinned at REQUESTED."
        default: 0
      - name: charged_amount_cents
        type: integer
        source: computed
        description: "gross_price_cents - credit_applied_cents; the amount logically captured from the student at REQUESTED."
      - name: provisional_commission_cents
        type: integer
        source: computed
        description: "Forward-looking platform cut quoted at booking time; per pricing_commission variant=PROVISIONAL."
      - name: final_commission_cents
        type: integer
        source: computed
        description: "Final platform cut written at COMPLETED, per pricing_commission variant=FINAL. May differ from provisional when actuals (e.g., adjusted_minutes) deviate."
      - name: actual_gross_cents
        type: integer
        source: computed
        description: "Recomputed at COMPLETED from adjusted_minutes (clamped to scheduled minutes). Pinned thereafter; referenced by FINAL and FINAL_AFTER_REFUND commission variants."
      - name: arbitration_refund_cents
        type: integer
        source: computed
        description: "Refund amount granted by RefundDispute resolution (RESOLVED_REFUND); 0 when no dispute or DENY. Distinct from short_delivery_refund booked at COMPLETED."
        default: 0
      - name: tutor_payout_cents
        type: integer
        source: computed
        description: "At COMPLETED: actual_gross_cents - final_commission_cents (clamped >= 0). At REFUNDED: service_revenue_retained - final_commission_cents (clamped >= 0). Credited to Tutor.payout_balance_cents only when Session enters SETTLED."
      - name: adjusted_minutes
        type: integer
        source: input
        description: "Actual minutes delivered, reported at completion; defaults to scheduled minutes if omitted."
      - name: cancellation_fee_cents
        type: integer
        source: computed
        description: "Per cancellation_fee calculation; non-zero only when status moves to CANCELLED_BY_STUDENT or CANCELLED_BY_TUTOR within penalty window."
        default: 0
      - name: refund_to_student_cents
        type: integer
        source: computed
        description: "Cents returned to Student.credit_balance_cents on refund/cancellation; pinned by the relevant transition."
        default: 0

  - name: RefundDispute
    parent: Session
    common_fields: true
    fields:
      - name: session_id
        type: string
        source: input
        description: "Session being disputed; MUST be in {COMPLETED, SETTLED}."
      - name: opened_by_role
        type: enum
        source: input
        description: "Initiator role."
        constraints: "{Student, Parent}"
      - name: opened_by_user_id
        type: string
        source: input
        description: "X-User-ID of the opener; if MINOR, MUST be the linked Parent.id."
      - name: reason_code
        type: enum
        source: input
        description: "Why the refund is requested."
        constraints: "{TUTOR_NO_SHOW, QUALITY_ISSUE, TECHNICAL_FAILURE, OTHER}"
      - name: requested_amount_cents
        type: integer
        source: input
        description: "Amount the opener wants refunded; bounded by Session.charged_amount_cents."
      - name: status
        type: enum
        source: computed
        description: "Dispute lifecycle (cyclic — see §1.2)."
        default: OPEN
        constraints: "{OPEN, TUTOR_RESPONDED, COUNTER_PROPOSED, ARBITRATION, RESOLVED_REFUND, RESOLVED_DENY, WITHDRAWN}"
      - name: round_count
        type: integer
        source: computed
        description: "Number of OPEN ↔ COUNTER_PROPOSED cycles consumed; cap 3."
        default: 0
      - name: arbitrated_by
        type: string
        source: computed
        description: "Opaque PlatformArbiter user id; set when ARBITRATION is entered."
      - name: resolved_refund_cents
        type: integer
        source: computed
        description: "Final refund amount applied at RESOLVED_REFUND (0 on RESOLVED_DENY)."

  - name: ParentChildLink
    parent: null
    common_fields: false
    fields:
      - name: parent_id
        type: string
        source: input
        description: "FK to Parent."
      - name: student_id
        type: string
        source: input
        description: "FK to Student where account_type=MINOR."
      - name: link_status
        type: enum
        source: computed
        description: "Approval gate before parent can book/refund on child's behalf."
        default: PENDING_PARENT_APPROVAL
        constraints: "{PENDING_PARENT_APPROVAL, ACTIVE, REVOKED}"
      - name: approved_at
        type: datetime
        source: computed
        description: "Set when link_status transitions to ACTIVE; null otherwise."

  - name: PayoutBatch
    parent: null
    common_fields: false
    fields:
      - name: tutor_id
        type: string
        source: input
        description: "Tutor receiving payout."
      - name: status
        type: enum
        source: computed
        description: "Payout lifecycle."
        default: REQUESTED
        constraints: "{REQUESTED, PAID, REVERSED}"
      - name: amount_cents
        type: integer
        source: computed
        description: "Snapshot of Tutor.payout_balance_cents at the moment REQUESTED is created. Pinned."
      - name: session_ids
        type: array
        source: computed
        description: "Ids of Session rows in SETTLED whose tutor_payout_cents was included in amount_cents."
      - name: requested_by
        type: string
        source: input
        description: "Opaque PlatformAdmin user id."

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Credential
    initial_state: SUBMITTED
    terminal_states: [EXPIRED]
    transitions:
      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /tutoring/tutors/{tutor_id}/credentials/{credential_id}/approve"
        actor: CredentialVerifier
        preconditions:
          - "credential.status == SUBMITTED"
          - "CredentialVerifier.id != credential.tutor_id (segregation; verifier cannot be the tutor)"
        side_effects:
          - "set credential.status=APPROVED, reviewed_by=acting user id"
          - "recompute Tutor.verification_status per verification_posture calculation (may bubble to VERIFIED)"
      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /tutoring/tutors/{tutor_id}/credentials/{credential_id}/reject"
        actor: CredentialVerifier
        preconditions:
          - "credential.status == SUBMITTED"
          - "CredentialVerifier.id != credential.tutor_id"
        side_effects:
          - "set credential.status=REJECTED, reviewed_by=acting user id"
          - "recompute Tutor.verification_status per verification_posture; if any REJECTED credential of type GOVERNMENT_ID or BACKGROUND_CHECK exists -> Tutor.verification_status=REJECTED"
      - from: APPROVED
        to: EXPIRED
        trigger: "POST /tutoring/_clock/advance (sweep) — credential.expires_at <= clock.now"
        actor: system
        preconditions:
          - "credential.status == APPROVED"
          - "credential.expires_at != null AND credential.expires_at <= clock.now"
        side_effects:
          - "credential.status := EXPIRED"
          - "recompute Tutor.verification_status; if drops below VERIFIED, Tutor.verification_status:=SUSPENDED"
          - "for every Session of this tutor in CONFIRMED whose start_at > clock.now : transition to CANCELLED_BY_TUTOR with refund_to_student_cents=charged_amount_cents and cancellation_fee_cents=0 (force-cancel cascade depth=3: Credential -> Tutor -> Session)"

  - entity: Tutor
    initial_state: UNVERIFIED
    terminal_states: []
    transitions:
      - from: UNVERIFIED
        to: PENDING_REVIEW
        trigger: "POST /tutoring/tutors/{tutor_id}/credentials (any credential submission)"
        actor: Tutor
        preconditions:
          - "tutor.verification_status == UNVERIFIED"
        side_effects: []
      - from: PENDING_REVIEW
        to: VERIFIED
        trigger: "Credential APPROVED transition side-effect"
        actor: system
        preconditions:
          - "verification_posture(tutor) == VERIFIED (i.e., APPROVED credentials of types {GOVERNMENT_ID, BACKGROUND_CHECK} both exist AND not EXPIRED)"
        side_effects: []
      - from: PENDING_REVIEW
        to: REJECTED
        trigger: "Credential REJECTED transition side-effect"
        actor: system
        preconditions:
          - "any Credential of type in {GOVERNMENT_ID, BACKGROUND_CHECK} has status=REJECTED"
        side_effects: []
      - from: VERIFIED
        to: SUSPENDED
        trigger: "Credential EXPIRED auto-transition OR POST /tutoring/tutors/{tutor_id}/suspend"
        actor: system | PlatformAdmin
        preconditions:
          - "verification_posture(tutor) != VERIFIED OR explicit admin action"
        side_effects:
          - "for each Session of this tutor in CONFIRMED with start_at > clock.now: cascade CANCELLED_BY_TUTOR with refund_to_student_cents = charged_amount_cents"
      - from: SUSPENDED
        to: VERIFIED
        trigger: "POST /tutoring/tutors/{tutor_id}/reinstate (after fresh credentials)"
        actor: PlatformAdmin
        preconditions:
          - "verification_posture(tutor) == VERIFIED"
        side_effects: []

  - entity: SubjectTag
    initial_state: PROPOSED
    terminal_states: [REMOVED]
    transitions:
      - from: PROPOSED
        to: APPROVED
        trigger: "POST /tutoring/tutors/{tutor_id}/subjects/{subject_id}/approve"
        actor: CredentialVerifier
        preconditions:
          - "Tutor.verification_status IN {VERIFIED}"
          - "CredentialVerifier.id != Tutor.id (segregation)"
        side_effects:
          - "append subject_code to Tutor.subject_tags (denormalized cache)"
      - from: APPROVED
        to: REMOVED
        trigger: "DELETE /tutoring/tutors/{tutor_id}/subjects/{subject_id}"
        actor: Tutor | PlatformAdmin
        preconditions:
          - "no Session for this (tutor_id, subject_code) in {REQUESTED, CONFIRMED, IN_PROGRESS}"
        side_effects:
          - "remove subject_code from Tutor.subject_tags"
      - from: PROPOSED
        to: REMOVED
        trigger: "DELETE /tutoring/tutors/{tutor_id}/subjects/{subject_id}"
        actor: Tutor | PlatformAdmin
        preconditions: []
        side_effects: []

  - entity: ParentChildLink
    initial_state: PENDING_PARENT_APPROVAL
    terminal_states: [REVOKED]
    transitions:
      - from: PENDING_PARENT_APPROVAL
        to: ACTIVE
        trigger: "POST /tutoring/parents/{parent_id}/links/{link_id}/approve"
        actor: Parent
        preconditions:
          - "acting Parent.id == link.parent_id"
          - "linked Student.account_type == MINOR"
        side_effects:
          - "set link.approved_at := clock.now"
          - "Parent.managed_child_count += 1"
      - from: ACTIVE
        to: REVOKED
        trigger: "DELETE /tutoring/parents/{parent_id}/links/{link_id}"
        actor: Parent | PlatformAdmin
        preconditions: []
        side_effects:
          - "Parent.managed_child_count -= 1"
          - "for every Session of this child in {REQUESTED, CONFIRMED} with start_at > clock.now: cascade CANCELLED_BY_STUDENT with refund_to_student_cents = charged_amount_cents - cancellation_fee_cents_for_child (computed by cancellation_fee)"

  - entity: Session
    initial_state: REQUESTED
    terminal_states: [SETTLED, REFUNDED]
    transitions:
      - from: REQUESTED
        to: CONFIRMED
        trigger: "POST /tutoring/sessions/{session_id}/confirm"
        actor: Tutor
        preconditions:
          - "acting Tutor.id == session.tutor_id"
          - "Tutor.verification_status == VERIFIED"
          - "session has no temporal overlap with another Session for same tutor in {CONFIRMED, IN_PROGRESS} per overlap rule (closed-open [start_at, end_at) + 0-min buffer)"
        side_effects: []
      - from: REQUESTED
        to: CANCELLED_BY_STUDENT
        trigger: "POST /tutoring/sessions/{session_id}/cancel (by student or linked parent)"
        actor: Student | Parent
        preconditions:
          - "acting Student.id == session.student_id OR (acting Parent links to session.student_id via ACTIVE ParentChildLink)"
        side_effects:
          - "cancellation_fee_cents := cancellation_fee(session, clock.now)  (likely 0 here)"
          - "refund_to_student_cents := charged_amount_cents - cancellation_fee_cents"
          - "Student.credit_balance_cents += refund_to_student_cents"
      - from: CONFIRMED
        to: CANCELLED_BY_STUDENT
        trigger: "POST /tutoring/sessions/{session_id}/cancel"
        actor: Student | Parent
        preconditions:
          - "acting actor == student or linked parent"
        side_effects:
          - "cancellation_fee_cents := cancellation_fee(session, clock.now)"
          - "refund_to_student_cents := charged_amount_cents - cancellation_fee_cents"
          - "Student.credit_balance_cents += refund_to_student_cents"
      - from: CONFIRMED
        to: CANCELLED_BY_TUTOR
        trigger: "POST /tutoring/sessions/{session_id}/cancel (by tutor) OR cascade from Tutor SUSPENDED / Credential EXPIRED"
        actor: Tutor | system
        preconditions:
          - "acting Tutor.id == session.tutor_id (when manual)"
        side_effects:
          - "cancellation_fee_cents := 0 (tutor-initiated)"
          - "refund_to_student_cents := charged_amount_cents"
          - "Student.credit_balance_cents += refund_to_student_cents"
      - from: CONFIRMED
        to: IN_PROGRESS
        trigger: "POST /tutoring/_clock/advance (sweep) — clock.now >= start_at AND clock.now < end_at"
        actor: system
        preconditions:
          - "session.status == CONFIRMED"
        side_effects: []
      - from: IN_PROGRESS
        to: COMPLETED
        trigger: "POST /tutoring/sessions/{session_id}/complete"
        actor: Tutor
        preconditions:
          - "clock.now >= session.end_at OR adjusted_minutes >= scheduled_minutes - 10"
          - "acting Tutor.id == session.tutor_id"
        side_effects:
          - "actual_gross_cents := pricing_gross-style recompute using adjusted_minutes (see pricing_commission FINAL formula)"
          - "short_delivery_refund_cents := max(gross_price_cents - actual_gross_cents, 0)   # unused-minute portion returned to student first"
          - "if short_delivery_refund_cents > 0: refund_to_student_cents += short_delivery_refund_cents AND Student.credit_balance_cents += short_delivery_refund_cents"
          - "final_commission_cents := pricing_commission(session, variant=FINAL) computed on actual_gross_cents (rate from tier at completion)"
          - "tutor_payout_cents := actual_gross_cents - final_commission_cents (clamped >= 0)"
          - "Tutor.lifetime_completed_sessions += 1"
      - from: COMPLETED
        to: DISPUTED
        trigger: "POST /tutoring/disputes (by student/parent against this session)"
        actor: Student | Parent
        preconditions:
          - "clock.now - session.end_at <= 7 days"
          - "no existing RefundDispute for this session_id in non-terminal state"
        side_effects:
          - "create RefundDispute(status=OPEN)"
      - from: COMPLETED
        to: SETTLED
        trigger: "POST /tutoring/_clock/advance (sweep) — clock.now - end_at >= SETTLEMENT_HOLD_HOURS AND no active RefundDispute"
        actor: system
        preconditions:
          - "no RefundDispute for this session in {OPEN, TUTOR_RESPONDED, COUNTER_PROPOSED, ARBITRATION}"
        side_effects:
          - "Tutor.payout_balance_cents += tutor_payout_cents"
      - from: DISPUTED
        to: REFUNDED
        trigger: "RefundDispute RESOLVED_REFUND side-effect"
        actor: system
        preconditions:
          - "linked RefundDispute.status == RESOLVED_REFUND"
        side_effects:
          - "arbitration_refund_cents := RefundDispute.resolved_refund_cents"
          - "refund_to_student_cents += arbitration_refund_cents   # adds to any short-delivery refund already booked at COMPLETED"
          - "Student.credit_balance_cents += arbitration_refund_cents"
          - "service_revenue_retained := max(actual_gross_cents - arbitration_refund_cents, 0)   # the portion of delivered service the tutor still keeps"
          - "final_commission_cents := pricing_commission(session, variant=FINAL_AFTER_REFUND) computed on service_revenue_retained"
          - "tutor_payout_cents := service_revenue_retained - final_commission_cents (clamped >= 0)"
      - from: DISPUTED
        to: SETTLED
        trigger: "RefundDispute RESOLVED_DENY side-effect"
        actor: system
        preconditions:
          - "linked RefundDispute.status == RESOLVED_DENY"
        side_effects:
          - "Tutor.payout_balance_cents += tutor_payout_cents"

  - entity: RefundDispute
    initial_state: OPEN
    terminal_states: [RESOLVED_REFUND, RESOLVED_DENY, WITHDRAWN]
    transitions:
      - from: OPEN
        to: TUTOR_RESPONDED
        trigger: "POST /tutoring/disputes/{dispute_id}/respond"
        actor: Tutor
        preconditions:
          - "acting Tutor.id == Session.tutor_id"
        side_effects: []
      - from: TUTOR_RESPONDED
        to: COUNTER_PROPOSED
        trigger: "POST /tutoring/disputes/{dispute_id}/counter"
        actor: Tutor
        preconditions:
          - "round_count < 3"
        side_effects:
          - "round_count += 1"
      - from: COUNTER_PROPOSED
        to: OPEN
        trigger: "POST /tutoring/disputes/{dispute_id}/reopen (student/parent rejects counter)"
        actor: Student | Parent
        preconditions:
          - "round_count < 3"
        side_effects: []
      - from: COUNTER_PROPOSED
        to: RESOLVED_REFUND
        trigger: "POST /tutoring/disputes/{dispute_id}/accept (student/parent accepts counter)"
        actor: Student | Parent
        preconditions: []
        side_effects:
          - "resolved_refund_cents := counter offer (server reads from request body, must be 0..requested_amount_cents)"
          - "cascade Session: DISPUTED -> REFUNDED"
      - from: OPEN
        to: ARBITRATION
        trigger: "POST /tutoring/disputes/{dispute_id}/escalate (round_count >= 3 OR clock.now - created_at >= 14 days)"
        actor: Student | Parent | system
        preconditions:
          - "round_count >= 3 OR clock-driven escalation"
        side_effects: []
      - from: TUTOR_RESPONDED
        to: ARBITRATION
        trigger: "POST /tutoring/disputes/{dispute_id}/escalate"
        actor: Student | Parent | system
        preconditions: []
        side_effects: []
      - from: ARBITRATION
        to: RESOLVED_REFUND
        trigger: "POST /tutoring/disputes/{dispute_id}/arbitrate (decision=REFUND)"
        actor: PlatformArbiter
        preconditions:
          - "arbiter.id != Session.tutor_id AND arbiter.id != Session.student_id AND arbiter.id != linked Parent.id (segregation)"
        side_effects:
          - "arbitrated_by := acting user id"
          - "resolved_refund_cents := arbiter-selected amount, bounded by requested_amount_cents"
          - "cascade Session: DISPUTED -> REFUNDED"
      - from: ARBITRATION
        to: RESOLVED_DENY
        trigger: "POST /tutoring/disputes/{dispute_id}/arbitrate (decision=DENY)"
        actor: PlatformArbiter
        preconditions:
          - "arbiter.id != Session.tutor_id AND arbiter.id != Session.student_id AND arbiter.id != linked Parent.id"
        side_effects:
          - "arbitrated_by := acting user id"
          - "resolved_refund_cents := 0"
          - "cascade Session: DISPUTED -> SETTLED"
      - from: OPEN
        to: WITHDRAWN
        trigger: "POST /tutoring/disputes/{dispute_id}/withdraw"
        actor: Student | Parent
        preconditions: []
        side_effects:
          - "cascade Session: DISPUTED -> SETTLED (if hold window already elapsed) or DISPUTED -> COMPLETED (if still inside hold window)"
      - from: COUNTER_PROPOSED
        to: WITHDRAWN
        trigger: "POST /tutoring/disputes/{dispute_id}/withdraw"
        actor: Student | Parent
        preconditions: []
        side_effects:
          - "cascade Session: DISPUTED -> SETTLED or DISPUTED -> COMPLETED per hold window"

  - entity: PayoutBatch
    initial_state: REQUESTED
    terminal_states: [PAID, REVERSED]
    transitions:
      - from: REQUESTED
        to: PAID
        trigger: "POST /tutoring/payouts/{payout_id}/mark-paid"
        actor: PlatformAdmin
        preconditions:
          - "PlatformAdmin.id != requested_by (segregation of duties)"
        side_effects:
          - "Tutor.payout_balance_cents -= amount_cents (must equal balance at request time minus any reversals in between; if mismatch -> ERR_PAYOUT_STALE)"
      - from: REQUESTED
        to: REVERSED
        trigger: "POST /tutoring/payouts/{payout_id}/reverse"
        actor: PlatformAdmin
        preconditions: []
        side_effects:
          - "no balance change (balance was never decremented at REQUESTED)"

# =============================================================================
# §1.2.1 Concurrency Rules
# =============================================================================
concurrency_rules:
  - scenario: "Tutor confirms a session at the same moment student cancels it"
    guarantee: "Exactly one transition succeeds; loser observes ERR_INVALID_STATE"
    error_id: ERR_INVALID_STATE
    http_status: 409
    serialization: "First-writer-wins on Session.status; second mutation sees stale source state"

  - scenario: "Two overlapping Sessions confirmed for the same tutor simultaneously"
    guarantee: "At most one of the overlapping confirms succeeds; the other is rejected"
    error_id: ERR_SESSION_OVERLAP
    http_status: 409
    serialization: "First-writer-wins on overlap reservation per tutor_id"

  - scenario: "Two trial Sessions booked for the same (tutor_id, student_id) pair concurrently"
    guarantee: "At most one trial Session per (tutor, student) pair across all time; second booking with is_trial=true is rejected"
    error_id: ERR_TRIAL_ALREADY_USED
    http_status: 409
    serialization: "First-writer-wins on (tutor_id, student_id, is_trial=true) uniqueness"

  - scenario: "Student opens a second RefundDispute for the same Session while the first is still non-terminal"
    guarantee: "Only one active RefundDispute per session_id; duplicate is rejected"
    error_id: ERR_DISPUTE_ALREADY_OPEN
    http_status: 409
    serialization: "First-writer-wins on (session_id, status NOT IN terminal_states)"

  - scenario: "PayoutBatch marked-paid twice (double payout) by two admins"
    guarantee: "Exactly one mark-paid succeeds; loser observes ERR_INVALID_STATE because the batch already left REQUESTED"
    error_id: ERR_INVALID_STATE
    http_status: 409
    serialization: "First-writer-wins on PayoutBatch.status"

  - scenario: "Credential approve and reject racing on the same SUBMITTED credential"
    guarantee: "Exactly one transition wins; the other observes ERR_INVALID_STATE"
    error_id: ERR_INVALID_STATE
    http_status: 409
    serialization: "First-writer-wins on Credential.status"

  - scenario: "OCC: PATCH /tutors/{id} with stale version while another PATCH advances the version"
    guarantee: "Stale request rejected with ERR_VERSION_CONFLICT; later request sees the post-bump version"
    error_id: ERR_VERSION_CONFLICT
    http_status: 409
    serialization: "Optimistic concurrency on entity.version"

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: pricing_gross
    trigger: "On POST /tutoring/sessions (booking) — pins Session.gross_price_cents at REQUESTED."
    algorithm: tiered_pricing
    formula: |
      scheduled_minutes = ceil((session.end_at - session.start_at) in seconds / 60.0)
      base_rate_per_min = (is_trial ? tutor.trial_rate_cents : tutor.hourly_rate_cents) / 60.0
      raw = base_rate_per_min * scheduled_minutes
      # Tiered multi-hour discount applied to NON-trial bookings only:
      if not is_trial:
        if scheduled_minutes >= 180:
          raw = raw * 0.90
        elif scheduled_minutes >= 120:
          raw = raw * 0.95
      gross_price_cents = round_half_up(raw)   # per-line rounding; only one line
    input_set: "Single Session row; rates pulled from Tutor at booking time (snapshot)."
    constants:
      DISCOUNT_TIER_120: 0.95
      DISCOUNT_TIER_180: 0.90
    precision: "Cents (integer), round_half_up at the final step only."
    variants: []

  - name: pricing_commission
    trigger: "Pinned at REQUESTED (PROVISIONAL); recomputed at COMPLETED (FINAL); recomputed again on DISPUTED→REFUNDED (FINAL_AFTER_REFUND)."
    algorithm: tiered_pricing
    formula: |
      # PROVISIONAL: commission on scheduled charged_amount_cents
      # FINAL:       commission on actuals (adjusted_minutes), keyed on tutor.lifetime_completed_sessions tier at completion
      # FINAL_AFTER_REFUND: commission on (charged_amount_cents - refund_to_student_cents) only

      def commission_rate(tutor_lifetime_completed):
        if tutor_lifetime_completed >= 100: return 0.10
        if tutor_lifetime_completed >= 20:  return 0.15
        return 0.20

      def for_variant(variant):
        if variant == PROVISIONAL:
          base_cents = charged_amount_cents  # set at REQUESTED
          rate = commission_rate(tutor.lifetime_completed_sessions_at_booking)
        elif variant == FINAL:
          # recompute the gross at COMPLETED using adjusted_minutes (NOT scheduled)
          scheduled_minutes = ceil((end_at - start_at)/60s)
          actual_minutes = adjusted_minutes if adjusted_minutes is not null else scheduled_minutes
          actual_minutes = clamp(actual_minutes, 0, scheduled_minutes)   # cannot bill > scheduled
          base_rate_per_min = (is_trial ? tutor.trial_rate_cents : tutor.hourly_rate_cents) / 60.0
          raw = base_rate_per_min * actual_minutes
          if not is_trial and scheduled_minutes >= 180: raw *= 0.90
          elif not is_trial and scheduled_minutes >= 120: raw *= 0.95
          actual_gross_cents = round_half_up(raw)
          base_cents = actual_gross_cents              # commission is on the actual delivered gross
          rate = commission_rate(tutor.lifetime_completed_sessions)   # at completion
        elif variant == FINAL_AFTER_REFUND:
          # After arbitration refund: tutor keeps actual_gross_cents - arbitration_refund_cents,
          # platform charges commission only on that retained portion.
          base_cents = max(actual_gross_cents - arbitration_refund_cents, 0)
          rate = commission_rate(tutor.lifetime_completed_sessions)
        return round_half_up(base_cents * rate)
    input_set: "One Session; tutor.lifetime_completed_sessions read at the moment of variant evaluation."
    constants:
      COMMISSION_RATE_TIER_0: 0.20
      COMMISSION_RATE_TIER_20: 0.15
      COMMISSION_RATE_TIER_100: 0.10
    precision: "Cents; round_half_up; commission rounded AFTER multiplication, not on each minute. Order pinned: gross first (line-level round), then commission (single round)."
    variants:
      - name: PROVISIONAL
        when: "Quoted at booking time on Session.charged_amount_cents using lifetime tier at booking."
        difference: "Uses scheduled charged_amount_cents and lifetime tier as of REQUESTED. May differ from FINAL when tutor crosses a tier between booking and completion OR adjusted_minutes < scheduled_minutes."
      - name: FINAL
        when: "At Session COMPLETED transition."
        difference: "Re-evaluates gross from adjusted_minutes (clamped to scheduled) and uses the tier at completion. Pinned to Session.final_commission_cents."
      - name: FINAL_AFTER_REFUND
        when: "Session moves DISPUTED -> REFUNDED."
        difference: "Commission charged only on the retained delivered portion (actual_gross_cents - arbitration_refund_cents). Tutor keeps a smaller payout but is not penalised commission on refunded cents."

  - name: cancellation_fee
    trigger: "On Session transition into CANCELLED_BY_STUDENT (manual)."
    algorithm: threshold
    formula: |
      hours_to_start = (start_at - clock.now) in seconds / 3600.0
      if cancelling_actor == 'tutor' or trigger == 'system_cascade':
        return 0
      if hours_to_start >= 24:       # >= 24h notice: free cancel
        return 0
      if hours_to_start >= 2:        # 2..24h: 25% of charged_amount_cents
        return round_half_up(0.25 * charged_amount_cents)
      # < 2 hours: 50% fee
      return round_half_up(0.50 * charged_amount_cents)
    input_set: "Single Session; clock.now"
    constants:
      FREE_NOTICE_HOURS: 24
      LATE_NOTICE_HOURS: 2
      LATE_FEE_RATE: 0.25
      VERY_LATE_FEE_RATE: 0.50
    precision: "Cents; round_half_up. Boundaries are CLOSED on the upper side: hours_to_start == 24.0 means free (>=24); hours_to_start == 2.0 means 25% (>=2). Strict inequality only fires below."
    variants: []

  - name: verification_posture
    trigger: "On any Credential APPROVED/REJECTED/EXPIRED transition; pins Tutor.verification_status."
    algorithm: aggregation
    formula: |
      approved = { c.credential_type for c in tutor.credentials if c.status == APPROVED and (c.expires_at is null or c.expires_at > clock.now) }
      rejected_critical = any(c.status == REJECTED and c.credential_type in {GOVERNMENT_ID, BACKGROUND_CHECK} for c in tutor.credentials)
      if rejected_critical: return REJECTED
      if {GOVERNMENT_ID, BACKGROUND_CHECK}.issubset(approved): return VERIFIED
      if any(c.status == SUBMITTED for c in tutor.credentials): return PENDING_REVIEW
      if tutor.verification_status == VERIFIED and not {GOVERNMENT_ID, BACKGROUND_CHECK}.issubset(approved):
        return SUSPENDED
      return UNVERIFIED
    input_set: "All Credential rows for the tutor; clock.now used for expiry filter."
    constants:
      CRITICAL_TYPES: ["GOVERNMENT_ID", "BACKGROUND_CHECK"]
    precision: "Enum; deterministic resolution order: REJECTED > VERIFIED > PENDING_REVIEW > SUSPENDED > UNVERIFIED."
    variants: []

  - name: payout_settlement_balance
    trigger: "Pinned at PayoutBatch creation (POST /tutoring/payouts); equal to Tutor.payout_balance_cents at that instant."
    algorithm: aggregation
    formula: |
      # The balance is itself the running sum:
      #   payout_balance_cents = sum( tutor_payout_cents for Session s where
      #                                s.tutor_id == tutor.id
      #                                AND s.status == SETTLED
      #                                AND s.id NOT IN any PayoutBatch.session_ids where PayoutBatch.status IN {REQUESTED, PAID} )
      # session_ids captured into the batch is the set of SETTLED session ids matching the above filter, sorted by Session.id ascending (tie-break stable).
      amount_cents = current tutor.payout_balance_cents
      session_ids = [s.id for s in SETTLED sessions with no batch, sorted by id asc]
    input_set: "All Session rows for tutor in SETTLED state not yet attached to a PayoutBatch in {REQUESTED, PAID}."
    constants: {}
    precision: "Cents; integer arithmetic only (no rounding)."
    variants: []

  - name: invariant_money_conservation
    trigger: "Implicit invariant checked across every Session transition and every credit application."
    algorithm: aggregation
    formula: |
      # PER-SESSION (the named conserved quantity):
      #   gross_price_cents
      #     == tutor_payout_cents + final_commission_cents + refund_to_student_cents
      # holds AT THE END of every Session terminal transition. (Until completion the
      # session is mid-flight and tutor_payout_cents / final_commission_cents are 0 or
      # provisional — invariant is checked at COMPLETED, SETTLED, REFUNDED, CANCELLED_*.)
      # Note: credit_applied_cents and charged_amount_cents are bookkeeping splits of how
      # the gross was originally paid (credit vs cash); they sum to gross_price_cents by
      # construction and are not on the invariant's right-hand side.
      #
      # GLOBAL (cross-entity check):
      #   SUM over all Students of credit_balance_cents
      #   + SUM over all Tutors of payout_balance_cents
      #   + SUM over all Sessions in COMPLETED with no payout yet (tutor_payout_cents)
      #   + SUM over PayoutBatch in PAID of amount_cents
      #   == SUM over all Sessions of (charged_amount_cents)                                  # cash received
      #      + SUM over Students of initial seeded credit_balance_cents                       # seeded credits
      #      - SUM over Sessions of (final_commission_cents that has not yet been paid out)   # platform-held commission is NOT in any of the above buckets
      #
      # The per-session invariant must hold AT THE END of every Session transition that
      # mutates a money field on the session.
    input_set: "All Session, Student.credit_balance_cents, Tutor.payout_balance_cents, PayoutBatch."
    constants: {}
    precision: "Cents; equality must be exact (no tolerance)."
    variants: []

# =============================================================================
# §1.4 Validation Rules Table (priority-ordered; lower priority number wins on conflict)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present; role is a known value."
    error_id: ERR_AUTH_REQUIRED
    http_status: 401
    applies_to: "all"

  - priority: 2
    category: auth
    check: "Role permitted for the endpoint per RBAC matrix (§1.7)."
    error_id: ERR_FORBIDDEN
    http_status: 403
    applies_to: "all"

  - priority: 3
    category: existence
    check: "Path-level resources exist, validated left-to-right (e.g., tutor before credential)."
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all"

  - priority: 4
    category: existence
    check: "FK fields in body reference existing rows."
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all"

  - priority: 5
    category: state
    check: "Target entity in a state where the requested transition is defined (per §1.2)."
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all state-changing endpoints"

  - priority: 6
    category: state
    check: "Optimistic concurrency: if request supplies version, it must equal the server's current entity.version."
    error_id: ERR_VERSION_CONFLICT
    http_status: 409
    applies_to: "all mutation endpoints"

  - priority: 7
    category: business_safety
    check: "Segregation of duties — credential verifier cannot verify their own credentials; arbiter cannot arbitrate a session in which they are tutor/student/parent; admin marking payout PAID cannot equal the admin who requested it."
    error_id: ERR_SEGREGATION_VIOLATION
    http_status: 403
    applies_to: "POST /tutors/{id}/credentials/{cid}/approve, POST /tutors/{id}/credentials/{cid}/reject, POST /disputes/{id}/arbitrate, POST /payouts/{id}/mark-paid"

  - priority: 8
    category: business_safety
    check: "MINOR Student bookings must be initiated by the linked Parent via ACTIVE ParentChildLink. ADULT Student cannot have parent_id set."
    error_id: ERR_MINOR_REQUIRES_PARENT
    http_status: 403
    applies_to: "POST /sessions, POST /disputes, POST /sessions/{id}/cancel"

  - priority: 9
    category: business_referential
    check: "Session.subject_code must match an APPROVED SubjectTag for Session.tutor_id at booking time."
    error_id: ERR_SUBJECT_NOT_OFFERED
    http_status: 422
    applies_to: "POST /sessions"

  - priority: 10
    category: business_safety
    check: "Tutor.verification_status must be VERIFIED for booking and for accepting confirmations."
    error_id: ERR_TUTOR_NOT_VERIFIED
    http_status: 422
    applies_to: "POST /sessions, POST /sessions/{id}/confirm"

  - priority: 11
    category: business_temporal
    check: "Session.start_at must be at least MIN_LEAD_MINUTES (=60) ahead of clock.now; end_at > start_at; duration must be a positive integer number of minutes <= MAX_SESSION_MINUTES (=240)."
    error_id: ERR_INVALID_SESSION_WINDOW
    http_status: 422
    applies_to: "POST /sessions"

  - priority: 12
    category: business_temporal
    check: "Confirmed session must not overlap with another Session for the same tutor in {CONFIRMED, IN_PROGRESS} per closed-open [start_at, end_at) interval, 0-min buffer."
    error_id: ERR_SESSION_OVERLAP
    http_status: 409
    applies_to: "POST /sessions/{id}/confirm"

  - priority: 13
    category: business_constraint
    check: "Per (tutor_id, student_id) at most ONE Session with is_trial=true across the entire history (active OR terminal). Student must also have lifetime_completed_sessions_with_this_tutor == 0."
    error_id: ERR_TRIAL_ALREADY_USED
    http_status: 422
    applies_to: "POST /sessions (when is_trial=true)"

  - priority: 14
    category: business_constraint
    check: "Parent.managed_child_count must not exceed MAX_CHILDREN_PER_PARENT=10 after the operation."
    error_id: ERR_CHILD_LIMIT_EXCEEDED
    http_status: 422
    applies_to: "POST /parents/{id}/links/{lid}/approve"

  - priority: 15
    category: business_referential
    check: "RefundDispute may be opened only on a Session in {COMPLETED, SETTLED} and within 7 days of Session.end_at; at most one non-terminal dispute per session."
    error_id: ERR_DISPUTE_WINDOW_CLOSED
    http_status: 422
    applies_to: "POST /disputes"

  - priority: 16
    category: business_fiscal
    check: "RefundDispute.requested_amount_cents must be 0 < amount <= Session.charged_amount_cents; counter offer must be 0..requested_amount_cents."
    error_id: ERR_AMOUNT_OUT_OF_RANGE
    http_status: 422
    applies_to: "POST /disputes, POST /disputes/{id}/counter, POST /disputes/{id}/accept"

  - priority: 17
    category: business_fiscal
    check: "apply_credits=true MUST NOT consume more than min(gross_price_cents, Student.credit_balance_cents). The remainder (charged_amount_cents) MUST be >= 0; trial bookings ignore apply_credits and always pin credit_applied_cents=0."
    error_id: ERR_CREDIT_APPLY_INVALID
    http_status: 422
    applies_to: "POST /sessions"

  - priority: 18
    category: business_fiscal
    check: "PayoutBatch requested amount must equal current Tutor.payout_balance_cents; mark-paid must observe an unchanged balance since request (no interleaved refund)."
    error_id: ERR_PAYOUT_STALE
    http_status: 409
    applies_to: "POST /payouts, POST /payouts/{id}/mark-paid"

  - priority: 19
    category: business_constraint
    check: "Cancellation by Parent requires ACTIVE ParentChildLink to the Student; Tutor cancellation must be the session's tutor; Student cancellation must be the session's student."
    error_id: ERR_NOT_AUTHORIZED_FOR_RESOURCE
    http_status: 403
    applies_to: "POST /sessions/{id}/cancel"

  - priority: 20
    category: business_constraint
    check: "Dispute escalation requires round_count >= 3 OR clock.now - created_at >= 14 days (system-driven escalation)."
    error_id: ERR_ESCALATION_NOT_ALLOWED
    http_status: 422
    applies_to: "POST /disputes/{id}/escalate"

  - priority: 21
    category: business_fiscal
    check: "Session.adjusted_minutes (if provided at /complete) must be in [0, scheduled_minutes]."
    error_id: ERR_ADJUSTED_MINUTES_OUT_OF_RANGE
    http_status: 422
    applies_to: "POST /sessions/{id}/complete"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # ---- Tutor management
  - method: POST
    path: "/tutoring/tutors"
    description: "Create tutor."
    roles: [PlatformAdmin, Tutor]
    code: 201
    input: [display_name, email, hourly_rate_cents, trial_rate_cents]
    output: Tutor
    side_effects: ["Tutor created in verification_status=UNVERIFIED"]

  - method: GET
    path: "/tutoring/tutors/{tutor_id}"
    description: "Read tutor with derived fields."
    roles: [PlatformAdmin, Tutor, Student, Parent, CredentialVerifier, PlatformArbiter]
    code: 200
    input: []
    output: Tutor
    side_effects: []

  - method: PATCH
    path: "/tutoring/tutors/{tutor_id}"
    description: "Update rates or display name (OCC)."
    roles: [Tutor, PlatformAdmin]
    code: 200
    input: ["display_name?", "hourly_rate_cents?", "trial_rate_cents?", "version?"]
    output: Tutor
    side_effects: ["Does NOT alter price on any existing Session (snapshotted at booking)"]

  - method: GET
    path: "/tutoring/tutors"
    description: "List/search tutors; filter by subject_code, verification_status, max hourly_rate_cents; paginated."
    roles: [PlatformAdmin, Student, Parent]
    code: 200
    input: ["limit?", "offset?", "subject_code?", "verification_status?", "max_hourly_rate_cents?"]
    output: "Tutor[]"
    side_effects: []

  - method: POST
    path: "/tutoring/tutors/{tutor_id}/suspend"
    description: "Admin suspend (force VERIFIED -> SUSPENDED)."
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: Tutor
    side_effects: ["Cancels all future CONFIRMED sessions with full refund (cascade)"]

  - method: POST
    path: "/tutoring/tutors/{tutor_id}/reinstate"
    description: "Admin restore SUSPENDED -> VERIFIED."
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: Tutor
    side_effects: []

  # ---- Credentials
  - method: POST
    path: "/tutoring/tutors/{tutor_id}/credentials"
    description: "Submit a credential document."
    roles: [Tutor]
    code: 201
    input: [credential_type, document_ref, "expires_at?"]
    output: Credential
    side_effects: ["Tutor: UNVERIFIED -> PENDING_REVIEW (if currently UNVERIFIED)"]

  - method: POST
    path: "/tutoring/tutors/{tutor_id}/credentials/{credential_id}/approve"
    description: "Verifier approves."
    roles: [CredentialVerifier]
    code: 200
    input: []
    output: Credential
    side_effects: ["Credential: SUBMITTED -> APPROVED; recompute Tutor.verification_status"]

  - method: POST
    path: "/tutoring/tutors/{tutor_id}/credentials/{credential_id}/reject"
    description: "Verifier rejects."
    roles: [CredentialVerifier]
    code: 200
    input: []
    output: Credential
    side_effects: ["Credential: SUBMITTED -> REJECTED; recompute Tutor.verification_status"]

  # ---- Subject tags
  - method: POST
    path: "/tutoring/tutors/{tutor_id}/subjects"
    description: "Propose a subject tag."
    roles: [Tutor]
    code: 201
    input: [subject_code, proficiency_level]
    output: SubjectTag
    side_effects: ["Tag created in status=PROPOSED"]

  - method: POST
    path: "/tutoring/tutors/{tutor_id}/subjects/{subject_id}/approve"
    description: "Verifier approves a subject tag."
    roles: [CredentialVerifier]
    code: 200
    input: []
    output: SubjectTag
    side_effects: ["Tutor.subject_tags appended"]

  - method: DELETE
    path: "/tutoring/tutors/{tutor_id}/subjects/{subject_id}"
    description: "Remove a subject tag."
    roles: [Tutor, PlatformAdmin]
    code: 204
    input: []
    output: null
    side_effects: ["Tutor.subject_tags removes subject_code"]

  # ---- Students
  - method: POST
    path: "/tutoring/students"
    description: "Create student (ADULT or MINOR)."
    roles: [Student, Parent, PlatformAdmin]
    code: 201
    input: [display_name, email, account_type, "parent_id?"]
    output: Student
    side_effects: ["If account_type=MINOR with parent_id, creates a ParentChildLink in PENDING_PARENT_APPROVAL"]

  - method: GET
    path: "/tutoring/students/{student_id}"
    description: "Read student."
    roles: [Student, Parent, PlatformAdmin]
    code: 200
    input: []
    output: Student
    side_effects: []

  # ---- Parents + child links
  - method: POST
    path: "/tutoring/parents"
    description: "Create parent."
    roles: [Parent, PlatformAdmin]
    code: 201
    input: [display_name, email]
    output: Parent
    side_effects: []

  - method: GET
    path: "/tutoring/parents/{parent_id}"
    description: "Read parent including managed_child_count."
    roles: [Parent, PlatformAdmin]
    code: 200
    input: []
    output: Parent
    side_effects: []

  - method: GET
    path: "/tutoring/parents/{parent_id}/links"
    description: "List child links."
    roles: [Parent, PlatformAdmin]
    code: 200
    input: ["limit?", "offset?", "link_status?"]
    output: "ParentChildLink[]"
    side_effects: []

  - method: POST
    path: "/tutoring/parents/{parent_id}/links/{link_id}/approve"
    description: "Parent approves the pending link to a MINOR student."
    roles: [Parent]
    code: 200
    input: []
    output: ParentChildLink
    side_effects: ["Link: PENDING_PARENT_APPROVAL -> ACTIVE; Parent.managed_child_count += 1"]

  - method: DELETE
    path: "/tutoring/parents/{parent_id}/links/{link_id}"
    description: "Revoke link; cascade cancellation of upcoming sessions for the child."
    roles: [Parent, PlatformAdmin]
    code: 204
    input: []
    output: null
    side_effects: ["Cancellation cascade; Parent.managed_child_count -= 1"]

  # ---- Sessions
  - method: POST
    path: "/tutoring/sessions"
    description: "Book a session."
    roles: [Student, Parent]
    code: 201
    input: [tutor_id, student_id, subject_code, start_at, end_at, "is_trial?", "apply_credits?"]
    output: Session
    side_effects: ["Calls pricing_gross; pins gross_price_cents, credit_applied_cents, charged_amount_cents, provisional_commission_cents; Student.credit_balance_cents -= credit_applied_cents"]

  - method: GET
    path: "/tutoring/sessions/{session_id}"
    description: "Read session."
    roles: [Tutor, Student, Parent, PlatformAdmin, PlatformArbiter]
    code: 200
    input: []
    output: Session
    side_effects: []

  - method: GET
    path: "/tutoring/sessions"
    description: "List sessions for the calling role's resources; filter by status and date range."
    roles: [Tutor, Student, Parent, PlatformAdmin]
    code: 200
    input: ["limit?", "offset?", "status?", "from?", "to?"]
    output: "Session[]"
    side_effects: []

  - method: POST
    path: "/tutoring/sessions/{session_id}/confirm"
    description: "Tutor confirms a REQUESTED session."
    roles: [Tutor]
    code: 200
    input: []
    output: Session
    side_effects: ["REQUESTED -> CONFIRMED; overlap check enforced"]

  - method: POST
    path: "/tutoring/sessions/{session_id}/cancel"
    description: "Cancel by student/parent or by tutor."
    roles: [Student, Parent, Tutor]
    code: 200
    input: []
    output: Session
    side_effects: ["Pins cancellation_fee_cents; credits Student.credit_balance_cents += refund_to_student_cents"]

  - method: POST
    path: "/tutoring/sessions/{session_id}/complete"
    description: "Tutor marks session complete."
    roles: [Tutor]
    code: 200
    input: ["adjusted_minutes?"]
    output: Session
    side_effects: ["IN_PROGRESS -> COMPLETED; pins final_commission_cents and tutor_payout_cents"]

  # ---- Refund disputes
  - method: POST
    path: "/tutoring/disputes"
    description: "Open a refund dispute against a COMPLETED or SETTLED session."
    roles: [Student, Parent]
    code: 201
    input: [session_id, reason_code, requested_amount_cents]
    output: RefundDispute
    side_effects: ["Session COMPLETED -> DISPUTED (if currently COMPLETED); SETTLED stays SETTLED but dispute attached"]

  - method: GET
    path: "/tutoring/disputes/{dispute_id}"
    description: "Read a dispute."
    roles: [Student, Parent, Tutor, PlatformArbiter, PlatformAdmin]
    code: 200
    input: []
    output: RefundDispute
    side_effects: []

  - method: POST
    path: "/tutoring/disputes/{dispute_id}/respond"
    description: "Tutor responds (OPEN -> TUTOR_RESPONDED)."
    roles: [Tutor]
    code: 200
    input: []
    output: RefundDispute
    side_effects: []

  - method: POST
    path: "/tutoring/disputes/{dispute_id}/counter"
    description: "Tutor offers a counter (TUTOR_RESPONDED -> COUNTER_PROPOSED). Body carries the offer amount."
    roles: [Tutor]
    code: 200
    input: [counter_amount_cents]
    output: RefundDispute
    side_effects: ["round_count += 1"]

  - method: POST
    path: "/tutoring/disputes/{dispute_id}/accept"
    description: "Student/parent accepts the latest counter offer; cascade Session: DISPUTED -> REFUNDED."
    roles: [Student, Parent]
    code: 200
    input: []
    output: RefundDispute
    side_effects: ["resolved_refund_cents := counter_amount_cents; Session.refund flow triggered"]

  - method: POST
    path: "/tutoring/disputes/{dispute_id}/reopen"
    description: "Student/parent rejects counter (COUNTER_PROPOSED -> OPEN)."
    roles: [Student, Parent]
    code: 200
    input: []
    output: RefundDispute
    side_effects: []

  - method: POST
    path: "/tutoring/disputes/{dispute_id}/escalate"
    description: "Escalate to ARBITRATION (round_count >= 3 OR 14 day timer)."
    roles: [Student, Parent, PlatformAdmin]
    code: 200
    input: []
    output: RefundDispute
    side_effects: []

  - method: POST
    path: "/tutoring/disputes/{dispute_id}/arbitrate"
    description: "Arbiter resolves (decision=REFUND or DENY)."
    roles: [PlatformArbiter]
    code: 200
    input: [decision, "refund_amount_cents?"]
    output: RefundDispute
    side_effects: ["cascade Session: DISPUTED -> REFUNDED or DISPUTED -> SETTLED"]

  - method: POST
    path: "/tutoring/disputes/{dispute_id}/withdraw"
    description: "Opener withdraws dispute."
    roles: [Student, Parent]
    code: 200
    input: []
    output: RefundDispute
    side_effects: ["cascade Session: DISPUTED -> SETTLED (if hold elapsed) or DISPUTED -> COMPLETED"]

  # ---- Payouts
  - method: POST
    path: "/tutoring/payouts"
    description: "Admin creates a payout batch from current tutor balance."
    roles: [PlatformAdmin]
    code: 201
    input: [tutor_id]
    output: PayoutBatch
    side_effects: ["Pins amount_cents and session_ids from SETTLED sessions"]

  - method: POST
    path: "/tutoring/payouts/{payout_id}/mark-paid"
    description: "A DIFFERENT admin confirms payout sent."
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: PayoutBatch
    side_effects: ["Tutor.payout_balance_cents -= amount_cents (stale check)"]

  - method: POST
    path: "/tutoring/payouts/{payout_id}/reverse"
    description: "Reverse REQUESTED batch (e.g., balance stale)."
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: PayoutBatch
    side_effects: []

  - method: GET
    path: "/tutoring/payouts"
    description: "List payout batches; filter by tutor_id, status."
    roles: [PlatformAdmin, Tutor]
    code: 200
    input: ["limit?", "offset?", "tutor_id?", "status?"]
    output: "PayoutBatch[]"
    side_effects: []

  # ---- Test-driving endpoints
  - method: POST
    path: "/tutoring/_clock/advance"
    description: "Advance virtual clock; triggers IN_PROGRESS sweep, SETTLED sweep, credential expiry sweep, dispute escalation timer."
    roles: [PlatformAdmin]
    code: 200
    input: [to_iso8601]
    output: object
    side_effects:
      - "For each CONFIRMED Session with start_at <= now < end_at: -> IN_PROGRESS"
      - "For each COMPLETED Session with (now - end_at) >= SETTLEMENT_HOLD_HOURS=72 AND no active dispute: -> SETTLED, credit tutor.payout_balance_cents"
      - "For each APPROVED Credential with expires_at <= now: -> EXPIRED with cascade per §1.2"
      - "For each non-terminal RefundDispute older than 14 days in OPEN/TUTOR_RESPONDED: -> ARBITRATION"

  - method: GET
    path: "/tutoring/_clock"
    description: "Read current virtual clock."
    roles: [PlatformAdmin, Tutor, Student, Parent, CredentialVerifier, PlatformArbiter]
    code: 200
    input: []
    output: object
    side_effects: []

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - id: ERR_AUTH_REQUIRED
    http: 401
    condition: "X-User-Role or X-User-ID missing/unknown."
  - id: ERR_FORBIDDEN
    http: 403
    condition: "Role lacks permission for the endpoint."
  - id: ERR_NOT_AUTHORIZED_FOR_RESOURCE
    http: 403
    condition: "Acting principal is permitted by role but does not own/link to the target resource."
  - id: ERR_NOT_FOUND
    http: 404
    condition: "Path or FK resource does not exist."
  - id: ERR_INVALID_STATE
    http: 409
    condition: "Requested transition not legal from current state."
  - id: ERR_VERSION_CONFLICT
    http: 409
    condition: "Supplied version != server's current version."
  - id: ERR_SESSION_OVERLAP
    http: 409
    condition: "Confirming a Session that overlaps another CONFIRMED/IN_PROGRESS session for the same tutor."
  - id: ERR_TRIAL_ALREADY_USED
    http: 422
    condition: "A trial Session already exists (in any state, including terminal) for this (tutor, student) pair, OR student already has at least one COMPLETED session with this tutor."
  - id: ERR_DISPUTE_ALREADY_OPEN
    http: 409
    condition: "A non-terminal RefundDispute already exists for the session."
  - id: ERR_DISPUTE_WINDOW_CLOSED
    http: 422
    condition: "Dispute opened > 7 days after Session.end_at, or session not in COMPLETED/SETTLED."
  - id: ERR_AMOUNT_OUT_OF_RANGE
    http: 422
    condition: "Refund or counter amount outside the allowed bounds."
  - id: ERR_TUTOR_NOT_VERIFIED
    http: 422
    condition: "Booking/confirming with a tutor whose verification_status != VERIFIED."
  - id: ERR_SUBJECT_NOT_OFFERED
    http: 422
    condition: "Session.subject_code not in tutor's APPROVED SubjectTag set."
  - id: ERR_SEGREGATION_VIOLATION
    http: 403
    condition: "Same actor attempting two segregated roles (e.g., verifier == tutor; arbiter is the session's tutor/student/parent; payout mark-paid by the same admin who requested it)."
  - id: ERR_MINOR_REQUIRES_PARENT
    http: 403
    condition: "MINOR student action without an ACTIVE ParentChildLink, or parent_id mismatch."
  - id: ERR_INVALID_SESSION_WINDOW
    http: 422
    condition: "end_at <= start_at, or start_at < clock.now + 60min, or duration > 240 min."
  - id: ERR_CHILD_LIMIT_EXCEEDED
    http: 422
    condition: "Approving a child link would push Parent.managed_child_count above 10."
  - id: ERR_PAYOUT_STALE
    http: 409
    condition: "Payout amount no longer matches Tutor.payout_balance_cents, OR balance changed between REQUESTED and mark-paid."
  - id: ERR_CREDIT_APPLY_INVALID
    http: 422
    condition: "apply_credits would over-spend credit_balance_cents, or applied on trial booking."
  - id: ERR_ESCALATION_NOT_ALLOWED
    http: 422
    condition: "Escalation requested before round_count >= 3 and before the 14-day timer."
  - id: ERR_ADJUSTED_MINUTES_OUT_OF_RANGE
    http: 422
    condition: "adjusted_minutes < 0 or > scheduled_minutes."
  - id: ERR_VALIDATION
    http: 400
    condition: "Body parse/type error: missing required field, wrong type, malformed datetime, etc."

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: Tutor
    description: "Tutor offering lessons; books no one, accepts sessions, completes them, responds to disputes."
    identity: "entity_backed:Tutor"
    exclusive_operations:
      - "POST /tutoring/tutors/{id}/credentials (own only)"
      - "POST /tutoring/tutors/{id}/subjects (own only)"
      - "POST /tutoring/sessions/{id}/confirm (own session)"
      - "POST /tutoring/sessions/{id}/complete (own session)"
      - "POST /tutoring/disputes/{id}/respond (own session)"
      - "POST /tutoring/disputes/{id}/counter (own session)"
    shared_operations:
      - "GET /tutoring/tutors/{id} (own profile)"
      - "PATCH /tutoring/tutors/{id} (own profile)"
      - "POST /tutoring/sessions/{id}/cancel (own session)"
      - "GET /tutoring/sessions"
      - "GET /tutoring/payouts (own only)"

  - name: Student
    description: "Adult student or the MINOR student row (booking gated through linked Parent for minors)."
    identity: "entity_backed:Student"
    exclusive_operations: []
    shared_operations:
      - "POST /tutoring/sessions (own only, if ADULT)"
      - "POST /tutoring/sessions/{id}/cancel (own only)"
      - "POST /tutoring/disputes (own only)"
      - "POST /tutoring/disputes/{id}/withdraw, /accept, /reopen, /escalate (own only)"
      - "GET /tutoring/tutors"
      - "GET /tutoring/sessions"

  - name: Parent
    description: "Parent managing one or more MINOR Students through ParentChildLink approvals."
    identity: "entity_backed:Parent"
    exclusive_operations:
      - "POST /tutoring/parents/{id}/links/{lid}/approve (own link only)"
    shared_operations:
      - "POST /tutoring/sessions (for ACTIVE-linked MINOR child)"
      - "POST /tutoring/sessions/{id}/cancel (for linked child's session)"
      - "POST /tutoring/disputes (for linked child)"
      - "POST /tutoring/disputes/{id}/withdraw, /accept, /reopen, /escalate (for linked child)"
      - "DELETE /tutoring/parents/{id}/links/{lid}"
      - "GET /tutoring/parents/{id}/links"

  - name: CredentialVerifier
    description: "Operations role that approves/rejects credentials and subject tags. Cannot be the tutor being verified."
    identity: "opaque"
    exclusive_operations:
      - "POST /tutoring/tutors/{id}/credentials/{cid}/approve"
      - "POST /tutoring/tutors/{id}/credentials/{cid}/reject"
      - "POST /tutoring/tutors/{id}/subjects/{sid}/approve"
    shared_operations:
      - "GET /tutoring/tutors/{id}"

  - name: PlatformArbiter
    description: "Operations role that arbitrates escalated disputes. Cannot be the session's tutor/student/parent."
    identity: "opaque"
    exclusive_operations:
      - "POST /tutoring/disputes/{id}/arbitrate"
    shared_operations:
      - "GET /tutoring/disputes/{id}"
      - "GET /tutoring/sessions/{id}"

  - name: PlatformAdmin
    description: "Highest-privilege ops role. Can create/suspend/reinstate tutors and initiate payouts, advance the test clock. Two distinct admins are required to request + mark-paid the same PayoutBatch."
    identity: "opaque"
    exclusive_operations:
      - "POST /tutoring/tutors/{id}/suspend"
      - "POST /tutoring/tutors/{id}/reinstate"
      - "POST /tutoring/payouts"
      - "POST /tutoring/payouts/{id}/mark-paid"
      - "POST /tutoring/payouts/{id}/reverse"
      - "POST /tutoring/_clock/advance"
    shared_operations:
      - "all GET endpoints"
      - "DELETE /tutoring/parents/{id}/links/{lid}"
      - "DELETE /tutoring/tutors/{id}/subjects/{sid}"
