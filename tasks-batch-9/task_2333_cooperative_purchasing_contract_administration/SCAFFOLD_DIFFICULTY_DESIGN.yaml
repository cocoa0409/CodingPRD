            - "One CONFIRMED usage of 25000000 adjustment units gives chargeable_base_cents 25000000, admin_fee_cents 500000 and total_cents 25500000."
            - "The September report swept that usage, was ACCEPTED at 2026-10-01 with reported_fee_cents 500000 and fee_due_at 2026-10-31, and was never remitted."
