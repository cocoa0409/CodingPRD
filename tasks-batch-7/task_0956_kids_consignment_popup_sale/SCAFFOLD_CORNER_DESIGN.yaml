        claim_type: violation_to_error
        grounds: ["validations[priority=2]", "errors[ERR_FORBIDDEN]", roles]
        distinguishing_aspect: "Role-gated endpoint: Consignor calling POST /volunteer-shifts (EventOrganizer-only) gets 403 ERR_FORBIDDEN at priority 2, before payload or FK checks."
        test_recipe:
          setup: ["Event exists; consignor registered."]
          setup_api_calls:
