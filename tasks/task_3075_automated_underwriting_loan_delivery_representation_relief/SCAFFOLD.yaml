# =============================================================================
# PRD Benchmark Seed Tables — task_3075
# Automated Underwriting, Loan Delivery & Representation Relief
# =============================================================================

scenario: |
  Automated Underwriting, Loan Delivery & Representation Relief (Fannie Mae):
  seller and servicer approval with net worth, quality control and eligibility
  requirements, automated underwriting recommendation with data validation
  services for income, assets and employment, loan eligibility matrices covering
  loan-to-value, credit score, occupancy and product type, loan delivery into
  pools with pricing adjustments by risk attribute, representation and warranty
  relief milestones based on payment history or independent validation,
  post-purchase quality control sampling with repurchase demands and appeal,
  servicing transfer approval and subservicer oversight, loan-level price
  adjustment updates and pipeline impact

domain_name: gse-loan-delivery
api_prefix: /gse

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: pricing_engine
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - rate_threshold_triggers
    - ops_run_checkpoint
    - derived_field_reconciliation

  entity_topology: flat
  state_machine_shape: branching
  relationship_patterns:
    - one_to_many
    - many_to_many
    - cross_aggregate
  role_model: segregation_of_duties
  consistency_model: immediate

# =============================================================================
# Table 1: Entity-Relationship Table
# =============================================================================
entities:
  - name: Seller
    parent: null
    common_fields: true
    fields:
      - { name: legal_name, type: string, source: input, description: "Seller legal entity name" }
      - { name: seller_number, type: string, source: input, description: "External seller identifier, unique across all sellers" }
      - { name: net_worth_cents, type: integer, source: input, description: "Reported net worth in cents at application or recertification" }
      - { name: qc_defect_rate_bps, type: integer, source: input, description: "Post-purchase QC defect rate in basis points at application or recertification" }
      - { name: status, type: enum, source: system, description: "PENDING_APPROVAL | APPROVED | SUSPENDED | TERMINATED" }
      - { name: approval_cycle, type: integer, source: system, default: 1, description: "Count of full suspension/re-approval cycles the seller has completed" }
      - { name: probation_relief_enabled, type: boolean, source: system, default: false, description: "True when seller is on its second approval cycle: caps its loans' relief tier at PAYMENT_HISTORY_36 regardless of independent validation" }

  - name: Servicer
    parent: null
    common_fields: true
    fields:
      - { name: legal_name, type: string, source: input, description: "Servicer legal entity name" }
      - { name: servicer_number, type: string, source: input, description: "External servicer identifier, unique across all servicers" }
      - { name: net_worth_cents, type: integer, source: input, description: "Reported net worth in cents at application or recertification" }
      - { name: qc_rating, type: enum, source: input, description: "SATISFACTORY | NEEDS_IMPROVEMENT | UNSATISFACTORY" }
      - { name: status, type: enum, source: system, description: "PENDING_APPROVAL | APPROVED | SUSPENDED | TERMINATED" }
      - { name: oversight_score, type: integer, source: computed, description: "Servicer oversight score: 100 minus pending-issue points minus subservicer findings, clamped to [0, 100]" }

  - name: MasterAgreement
    parent: null
    common_fields: true
    fields:
      - { name: seller_id, type: string, source: input, description: "FK -> Seller.id; the counterparty seller" }
      - { name: servicer_id, type: string, source: input, description: "FK -> Servicer.id; the counterparty servicer" }
      - { name: effective_date, type: datetime, source: input, description: "Agreement effective date (ISO 8601)" }
      - { name: expiration_date, type: datetime, source: input, description: "Agreement expiration date (ISO 8601), must be strictly after effective_date" }
      - { name: status, type: enum, source: system, description: "DRAFT | ACTIVE | EXPIRED | TERMINATED" }

  - name: LlpaMatrix
    parent: null
    common_fields: true
    fields:
      - { name: effective_from, type: datetime, source: input, description: "Grid effective start (ISO 8601), inclusive" }
      - { name: effective_until, type: datetime, source: input, description: "Grid effective end (ISO 8601), exclusive; must be strictly after effective_from" }
      - { name: rows, type: array, source: input, description: "Pricing rows, each a dict {occupancy, product_type, llpa_bps, ltv_max_bp, ltv_min_bp, credit_min, credit_max}; only one active grid at a time" }
      - { name: status, type: enum, source: system, description: "ACTIVE | SUPERSEDED" }

  - name: Loan
    parent: null
    common_fields: true
    fields:
      - { name: seller_id, type: string, source: input, description: "FK -> Seller.id; selling lender" }
      - { name: servicer_id, type: string, source: input, description: "FK -> Servicer.id; current servicer of record" }
      - { name: agreement_id, type: string, source: input, description: "FK -> MasterAgreement.id; agreement under which the loan is delivered" }
      - { name: loan_number, type: string, source: input, description: "Seller-assigned loan number, unique across all loans" }
      - { name: borrower_name, type: string, source: input, description: "Primary borrower full name" }
      - { name: unpaid_principal_balance_cents, type: integer, source: input, description: "Current unpaid principal balance in cents" }
      - { name: appraised_value_cents, type: integer, source: input, description: "Appraised property value in cents at origination" }
      - { name: credit_score, type: integer, source: input, description: "Representative credit score (300-850)" }
      - { name: occupancy, type: enum, source: input, description: "PRIMARY_RESIDENCE | SECOND_HOME | INVESTMENT" }
      - { name: product_type, type: enum, source: input, description: "FIXED_30 | FIXED_15 | ARM_5_1" }
      - { name: ltv_bp, type: integer, source: computed, description: "round_half_up(10000 * unpaid_principal_balance_cents / appraised_value_cents)" }
      - { name: au_status, type: enum, source: system, description: "NOT_SUBMITTED | RECOMMEND_APPROVE | RECOMMEND_REFER | INELIGIBLE" }
      - { name: status, type: enum, source: system, description: "DRAFT | UNDERWRITTEN | DELIVERED | PURCHASED | REJECTED | REPURCHASED" }
      - { name: relief_tier, type: enum, source: computed, description: "NONE | PAYMENT_HISTORY_36 | INDEPENDENT_VALIDATION; capped at PAYMENT_HISTORY_36 when seller.probation_relief_enabled" }
      - { name: consecutive_on_time_payments, type: integer, source: system, default: 0, description: "Count of consecutive monthly payments recorded ON_TIME; resets to 0 on any LATE payment" }
      - { name: independent_validation_complete, type: boolean, source: system, default: false, description: "Set true when the Day-1 income/asset/employment validation package is completed for this loan" }
      - { name: pool_id, type: string, source: system, default: null, description: "FK -> Pool.id; pool the loan is securitized into (null until delivered)" }
      - { name: delivery_price_cents, type: integer, source: computed, description: "unpaid_principal_balance_cents minus applied LLPA dollar adjustment, as computed at delivery" }
      - { name: applied_llpa_bps, type: integer, source: computed, description: "LLPA in basis points applied at delivery, from the LlpaMatrix active at delivery time" }
      - { name: delivered_at, type: datetime, source: system, description: "Timestamp of successful delivery" }

  - name: UnderwritingCase
    parent: null
    common_fields: true
    fields:
      - { name: loan_id, type: string, source: input, description: "FK -> Loan.id; the loan under evaluation" }
      - { name: seller_id, type: string, source: system, description: "Seller id denormalized from the loan at submission (join key; not an FK field)" }
      - { name: submission_round, type: integer, source: system, default: 1, description: "1-based resubmission counter, incremented on each failed final validation and each full re-run" }
      - { name: case_status, type: enum, source: system, description: "SUBMITTED | VALIDATING | VALIDATED | FAILED | FINALIZED" }
      - { name: recommendation, type: enum, source: system, description: "PENDING | APPROVE_ELIGIBLE | REFER_WITH_CAUTION" }
      - { name: final_outcome, type: enum, source: system, default: PENDING, description: "PENDING | PASS | FAIL" }

  - name: ValidationReport
    parent: null
    common_fields: false
    fields:
      - { name: case_id, type: string, source: system, description: "Parent underwriting case id (join key; not an FK field)" }
      - { name: round, type: integer, source: system, description: "Submission round this report belongs to (equals UnderwritingCase.submission_round at creation)" }
      - { name: service_type, type: enum, source: input, description: "INCOME | ASSET | EMPLOYMENT" }
      - { name: result, type: enum, source: system, description: "PENDING | VALIDATED | NOT_VALIDATED" }
      - { name: provider_reference, type: string, source: input, description: "External data-provider reference code" }

  - name: Pool
    parent: null
    common_fields: true
    fields:
      - { name: seller_id, type: string, source: input, description: "FK -> Seller.id; seller securitizing into this pool" }
      - { name: agreement_id, type: string, source: input, description: "FK -> MasterAgreement.id; governing agreement" }
      - { name: pool_number, type: string, source: input, description: "External pool number, unique across all pools" }
      - { name: issue_date, type: datetime, source: input, description: "Pool issue date (ISO 8601), must be strictly after now at creation" }
      - { name: target_balance_cents, type: integer, source: input, description: "Maximum total UPB the pool accepts" }
      - { name: current_balance_cents, type: integer, source: computed, description: "Sum of UPB of loans currently in the pool" }
      - { name: loan_count, type: integer, source: computed, description: "Count of loans currently in the pool" }
      - { name: status, type: enum, source: system, description: "OPEN | LOCKED | ISSUED | CANCELLED" }

  - name: PaymentEvent
    parent: null
    common_fields: false
    fields:
      - { name: loan_id, type: string, source: input, description: "Owning loan id (join key; not an FK field)" }
      - { name: due_date, type: datetime, source: input, description: "Payment due date (ISO 8601); at most one event per (loan_id, due_date)" }
      - { name: paid_on_time, type: boolean, source: input, description: "True if paid on or before due date" }
      - { name: amount_cents, type: integer, source: input, description: "Payment amount in cents" }
      - { name: outcome, type: enum, source: system, description: "ON_TIME | LATE" }

  - name: QcAudit
    parent: null
    common_fields: true
    fields:
      - { name: seller_id, type: string, source: input, description: "FK -> Seller.id; seller under post-purchase review" }
      - { name: sampling_method, type: enum, source: input, description: "RANDOM | TARGETED | DISCRETIONARY" }
      - { name: status, type: enum, source: system, description: "OPEN | IN_REVIEW | FINDINGS_ISSUED | CLOSED" }

  - name: QcFinding
    parent: null
    common_fields: true
    fields:
      - { name: audit_id, type: string, source: system, description: "FK -> QcAudit.id; parent audit" }
      - { name: loan_id, type: string, source: input, description: "FK -> Loan.id; loan cited in the finding" }
      - { name: defect_category, type: enum, source: input, description: "INCOME_MISREP | ASSET_MISREP | EMPLOYMENT_MISREP | COLLATERAL | ELIGIBILITY | OTHER" }
      - { name: severity, type: enum, source: input, description: "SIGNIFICANT | MODERATE | MINOR" }
      - { name: status, type: enum, source: system, description: "IDENTIFIED | REPURCHASE_ISSUED | APPEALED | UPHELD | OVERTURNED | REMEDIATED" }

  - name: RepurchaseDemand
    parent: null
    common_fields: true
    fields:
      - { name: finding_id, type: string, source: input, description: "FK -> QcFinding.id; the finding that grounds this demand" }
      - { name: loan_id, type: string, source: system, description: "FK -> Loan.id; denormalized from the finding" }
      - { name: amount_cents, type: integer, source: system, description: "Repurchase amount: loan.unpaid_principal_balance_cents at demand issuance" }
      - { name: status, type: enum, source: system, description: "ISSUED | APPEALED | UPHELD | WITHDRAWN | SETTLED" }
      - { name: appeal_deadline, type: datetime, source: system, description: "30 days after issuance" }
      - { name: appeal_rounds_used, type: integer, source: system, default: 0, description: "Number of appeals consumed on this demand; maximum 2" }

  - name: ServicingTransfer
    parent: null
    common_fields: true
    fields:
      - { name: loan_id, type: string, source: input, description: "FK -> Loan.id; loan whose servicing transfers" }
      - { name: from_servicer_id, type: string, source: system, description: "FK -> Servicer.id; current servicer, denormalized from loan at request time" }
      - { name: to_servicer_id, type: string, source: input, description: "FK -> Servicer.id; proposed receiving servicer" }
      - { name: effective_date, type: datetime, source: input, description: "Requested transfer effective date (ISO 8601), must be strictly after now" }
      - { name: requester_id, type: string, source: system, description: "X-User-ID of the ServicerOfficer who created the request; drives segregation-of-duties and cancel-ownership checks" }
      - { name: status, type: enum, source: system, description: "REQUESTED | APPROVED | REJECTED | COMPLETED | CANCELLED" }

  - name: SubservicerOversight
    parent: null
    common_fields: true
    fields:
      - { name: servicer_id, type: string, source: input, description: "FK -> Servicer.id; master servicer overseeing" }
      - { name: subservicer_id, type: string, source: input, description: "FK -> Servicer.id; subservicer being overseen" }
      - { name: oversight_period_start, type: datetime, source: input, description: "Oversight period start (ISO 8601)" }
      - { name: oversight_period_end, type: datetime, source: input, description: "Oversight period end (ISO 8601), must be strictly after start" }
      - { name: findings_count, type: integer, source: input, default: 0, description: "Findings recorded this period" }
      - { name: status, type: enum, source: system, description: "OPEN | CLOSED" }

  - name: Pipeline
    parent: null
    common_fields: true
    fields:
      - { name: seller_id, type: string, source: input, description: "FK -> Seller.id; owning seller" }
      - { name: projected_value_cents, type: integer, source: computed, description: "Sum of delivery_price_cents over the seller's loans in DRAFT or UNDERWRITTEN status, using the currently ACTIVE LlpaMatrix" }

  - name: LlpaUpdateEvent
    parent: null
    common_fields: false
    fields:
      - { name: pipeline_id, type: string, source: system, description: "Impacted pipeline id (join key; not an FK field)" }
      - { name: old_matrix_id, type: string, source: system, description: "Superseded grid id (join key; not an FK field)" }
      - { name: new_matrix_id, type: string, source: system, description: "Newly active grid id (join key; not an FK field)" }
      - { name: projected_value_before_cents, type: integer, source: system, description: "Pipeline projected_value_cents immediately before the grid swap" }
      - { name: projected_value_after_cents, type: integer, source: system, description: "Pipeline projected_value_cents immediately after the grid swap" }
      - { name: delta_cents, type: integer, source: system, description: "after minus before" }
      - { name: impacted_loan_count, type: integer, source: system, description: "Count of pipeline loans whose recomputed price changed" }

# =============================================================================
# Table 2: State Machine Table
# =============================================================================
state_machines:
  - entity: Seller
    initial_state: PENDING_APPROVAL
    terminal_states: [TERMINATED]
    transitions:
      - from: PENDING_APPROVAL
        to: APPROVED
        trigger: "POST /gse/sellers/{sellerId}/approve"
        actor: GseAdmin
        preconditions:
          - "seller.net_worth_cents >= MIN_NET_WORTH_CENTS (2,500,000) else ERR_NET_WORTH_BELOW_MINIMUM"
          - "seller.qc_defect_rate_bps <= MAX_QC_DEFECT_BPS (150) else ERR_QC_DEFECT_RATE_EXCEEDED"
        side_effects:
          - "seller.status -> APPROVED"
      - from: APPROVED
        to: SUSPENDED
        trigger: "POST /gse/sellers/{sellerId}/suspend"
        actor: GseAdmin
        preconditions: []
        side_effects:
          - "seller.status -> SUSPENDED"
          - "every MasterAgreement with seller_id = seller.id in status ACTIVE -> SUSPENDED-equivalent is not used; agreements are TERMINATED individually by GseAdmin (no auto-cascade)"
      - from: SUSPENDED
        to: APPROVED
        trigger: "POST /gse/sellers/{sellerId}/approve (re-approval cycle)"
        actor: GseAdmin
        preconditions:
          - "seller.net_worth_cents >= MIN_NET_WORTH_CENTS (2,500,000) else ERR_NET_WORTH_BELOW_MINIMUM"
          - "seller.qc_defect_rate_bps <= MAX_QC_DEFECT_BPS (150) else ERR_QC_DEFECT_RATE_EXCEEDED"
        side_effects:
          - "seller.status -> APPROVED"
          - "seller.approval_cycle += 1"
          - "if approval_cycle == 2: seller.probation_relief_enabled = true"
      - from: APPROVED
        to: TERMINATED
        trigger: "POST /gse/sellers/{sellerId}/terminate"
        actor: GseAdmin
        preconditions:
          - "no loan of this seller in status DELIVERED (open delivery obligation) else ERR_SELLER_HAS_ACTIVE_LOANS"
        side_effects:
          - "seller.status -> TERMINATED"

  - entity: Servicer
    initial_state: PENDING_APPROVAL
    terminal_states: [TERMINATED]
    transitions:
      - from: PENDING_APPROVAL
        to: APPROVED
        trigger: "POST /gse/servicers/{servicerId}/approve"
        actor: GseAdmin
        preconditions:
          - "servicer.net_worth_cents >= MIN_NET_WORTH_CENTS (2,500,000) else ERR_NET_WORTH_BELOW_MINIMUM"
          - "servicer.qc_rating == SATISFACTORY else ERR_SERVICER_QC_RATING_INSUFFICIENT"
        side_effects:
          - "servicer.status -> APPROVED"
      - from: APPROVED
        to: SUSPENDED
        trigger: "POST /gse/servicers/{servicerId}/suspend"
        actor: GseAdmin
        preconditions: []
        side_effects:
          - "servicer.status -> SUSPENDED"
      - from: APPROVED
        to: TERMINATED
        trigger: "POST /gse/servicers/{servicerId}/terminate"
        actor: GseAdmin
        preconditions:
          - "no loan with servicer_id = servicer.id in status DELIVERED or PURCHASED else ERR_SERVICER_HAS_ACTIVE_LOANS"
        side_effects:
          - "servicer.status -> TERMINATED"

  - entity: MasterAgreement
    initial_state: DRAFT
    terminal_states: [TERMINATED]
    transitions:
      - from: DRAFT
        to: ACTIVE
        trigger: "POST /gse/master-agreements/{agreementId}/activate"
        actor: GseAdmin
        preconditions:
          - "seller.status == APPROVED else ERR_SELLER_NOT_APPROVED"
          - "servicer.status == APPROVED else ERR_SERVICER_NOT_APPROVED"
          - "effective_date <= now < expiration_date else ERR_AGREEMENT_NOT_EFFECTIVE"
        side_effects:
          - "agreement.status -> ACTIVE"
      - from: ACTIVE
        to: EXPIRED
        trigger: "system (automatic when logical clock passes expiration_date)"
        actor: system
        preconditions: []
        side_effects:
          - "agreement.status -> EXPIRED"
      - from: ACTIVE
        to: TERMINATED
        trigger: "POST /gse/master-agreements/{agreementId}/terminate"
        actor: GseAdmin
        preconditions: []
        side_effects:
          - "agreement.status -> TERMINATED"

  - entity: LlpaMatrix
    initial_state: ACTIVE
    terminal_states: [SUPERSEDED]
    transitions:
      - from: ACTIVE
        to: SUPERSEDED
        trigger: "POST /gse/llpa-matrices (creating a newer grid)"
        actor: GseAdmin
        preconditions: []
        side_effects:
          - "prior ACTIVE matrix -> SUPERSEDED; new matrix -> ACTIVE"
          - "for every Pipeline: recompute projected_value_cents via pipeline_revaluation (pipeline_loan_price with the new grid)"
          - "append one LlpaUpdateEvent per impacted pipeline"

  - entity: Loan
    initial_state: DRAFT
    terminal_states: [REJECTED, REPURCHASED]
    transitions:
      - from: DRAFT
        to: UNDERWRITTEN
        trigger: "system (upon POST /gse/underwriting-cases finalizing with final_outcome PASS and recommendation APPROVE_ELIGIBLE)"
        actor: system
        preconditions: []
        side_effects:
          - "loan.au_status -> RECOMMEND_APPROVE"
          - "pipeline_revaluation for the loan's seller pipeline"
      - from: DRAFT
        to: DRAFT
        trigger: "system (upon POST /gse/underwriting-cases finalizing with final_outcome PASS and recommendation REFER_WITH_CAUTION)"
        actor: system
        preconditions: []
        side_effects:
          - "loan.au_status -> RECOMMEND_REFER (loan stays DRAFT; a REFER_WITH_CAUTION recommendation does not advance the loan)"
      - from: DRAFT
        to: REJECTED
        trigger: "system (upon POST /gse/underwriting-cases finalizing with final_outcome FAIL)"
        actor: system
        preconditions: []
        side_effects:
          - "loan.au_status -> INELIGIBLE"
          - "pipeline_revaluation for the loan's seller pipeline"
      - from: UNDERWRITTEN
        to: DELIVERED
        trigger: "POST /gse/loans/{loanId}/deliver"
        actor: SellerOfficer
        preconditions:
          - "loan.au_status == RECOMMEND_APPROVE else ERR_LOAN_NOT_ELIGIBLE"
          - "seller.status == APPROVED else ERR_SELLER_NOT_APPROVED"
          - "agreement.status == ACTIVE else ERR_AGREEMENT_NOT_EFFECTIVE"
          - "target pool (pool_id in payload) exists, status == OPEN, pool.agreement_id == loan.agreement_id, pool.seller_id == loan.seller_id else ERR_POOL_NOT_OPEN"
          - "pool.current_balance_cents + loan.unpaid_principal_balance_cents <= pool.target_balance_cents else ERR_POOL_CAPACITY_EXCEEDED"
        side_effects:
          - "loan.status -> DELIVERED"
          - "loan.pool_id = pool.id; loan.delivered_at = now"
          - "pool.current_balance_cents += loan.unpaid_principal_balance_cents; pool.loan_count += 1"
          - "loan_price at delivery: compute delivery_price_cents and applied_llpa_bps against the ACTIVE LlpaMatrix"
          - "pipeline_revaluation for the seller pipeline"
      - from: DELIVERED
        to: PURCHASED
        trigger: "system (upon POST /gse/pools/{poolId}/issue)"
        actor: system
        preconditions: []
        side_effects:
          - "loan.status -> PURCHASED"
      - from: DELIVERED
        to: DRAFT
        trigger: "system (upon POST /gse/pools/{poolId}/cancel)"
        actor: system
        preconditions: []
        side_effects:
          - "loan.status -> DRAFT"
          - "loan.pool_id = null; loan.delivered_at = null"
          - "pool.current_balance_cents -= loan.unpaid_principal_balance_cents; pool.loan_count -= 1"
          - "delivery_price_cents and applied_llpa_bps are retained as computed historical values but no longer count toward pipeline projected value"
          - "pipeline_revaluation for the seller pipeline"
      - from: PURCHASED
        to: REPURCHASED
        trigger: "POST /gse/repurchase-demands/{demandId}/settle"
        actor: SellerOfficer
        preconditions:
          - "demand.status == UPHELD else ERR_DEMAND_NOT_UPHELD"
          - "demand.loan_id == loan.id"
        side_effects:
          - "loan.status -> REPURCHASED"
          - "finding.status -> REMEDIATED"
          - "seller_financial_check on settle: outstanding UPHELD unsettled demand total + this demand amount <= seller.net_worth_cents else ERR_INSUFFICIENT_SELLER_FUNDS (no state change on failure)"

  - entity: UnderwritingCase
    initial_state: SUBMITTED
    terminal_states: [FINALIZED]
    transitions:
      - from: SUBMITTED
        to: VALIDATING
        trigger: "POST /gse/underwriting-cases/{caseId}/reports"
        actor: Underwriter
        preconditions:
          - "case.case_status == SUBMITTED or VALIDATING"
        side_effects:
          - "create ValidationReport with result PENDING, round = case.submission_round"
          - "case.case_status -> VALIDATING"
      - from: VALIDATING
        to: VALIDATED
        trigger: "system (automatic when all 3 service_type reports for the current round have result VALIDATED)"
        actor: system
        preconditions: []
        side_effects:
          - "case.case_status -> VALIDATED"
      - from: VALIDATING
        to: FAILED
        trigger: "system (automatic when any report for the current round has result NOT_VALIDATED)"
        actor: system
        preconditions: []
        side_effects:
          - "case.case_status -> FAILED"
          - "case.submission_round += 1"
      - from: FAILED
        to: VALIDATING
        trigger: "POST /gse/underwriting-cases/{caseId}/reports (resubmission)"
        actor: Underwriter
        preconditions:
          - "case.case_status == FAILED"
        side_effects:
          - "create ValidationReport with result PENDING, round = case.submission_round"
          - "case.case_status -> VALIDATING"
      - from: VALIDATED
        to: FINALIZED
        trigger: "POST /gse/underwriting-cases/{caseId}/finalize"
        actor: GseUnderwritingEngine
        preconditions:
          - "expected_case_version == case.version else ERR_STALE_VERSION (412)"
        side_effects:
          - "case.case_status -> FINALIZED"
          - "case.version += 1"
          - "eligibility_check + score_calculation: set case.recommendation and case.final_outcome"
          - "case outcome cascades onto loan per Loan state machine (UNDERWRITTEN / stays DRAFT with RECOMMEND_REFER / REJECTED)"
          - "pipeline_revaluation for the seller pipeline"

  - entity: Pool
    initial_state: OPEN
    terminal_states: [ISSUED, CANCELLED]
    transitions:
      - from: OPEN
        to: LOCKED
        trigger: "POST /gse/pools/{poolId}/lock"
        actor: SellerOfficer
        preconditions:
          - "pool.loan_count >= 1 else ERR_POOL_EMPTY"
        side_effects:
          - "pool.status -> LOCKED"
      - from: OPEN
        to: CANCELLED
        trigger: "POST /gse/pools/{poolId}/cancel"
        actor: SellerOfficer
        preconditions: []
        side_effects:
          - "pool.status -> CANCELLED"
          - "every loan with pool_id = pool.id in status DELIVERED -> DRAFT (pool_id cleared, delivered_at cleared, balances decremented)"
          - "pipeline_revaluation for the seller pipeline"
      - from: LOCKED
        to: OPEN
        trigger: "POST /gse/pools/{poolId}/unlock"
        actor: SellerOfficer
        preconditions: []
        side_effects:
          - "pool.status -> OPEN"
      - from: LOCKED
        to: ISSUED
        trigger: "POST /gse/pools/{poolId}/issue"
        actor: SellerOfficer
        preconditions:
          - "expected_pool_version == pool.version else ERR_STALE_VERSION (412)"
        side_effects:
          - "pool.status -> ISSUED"
          - "pool.version += 1"
          - "every loan with pool_id = pool.id in status DELIVERED -> PURCHASED"
          - "pipeline_revaluation for the seller pipeline"

  - entity: QcAudit
    initial_state: OPEN
    terminal_states: [CLOSED]
    transitions:
      - from: OPEN
        to: IN_REVIEW
        trigger: "POST /gse/qc-audits/{auditId}/findings (first finding)"
        actor: QcAuditor
        preconditions:
          - "loan referenced by the finding is in status PURCHASED else ERR_LOAN_NOT_PURCHASED"
          - "loan.seller_id == audit.seller_id"
        side_effects:
          - "create QcFinding in status IDENTIFIED"
          - "audit.status -> IN_REVIEW"
          - "servicer_oversight_score recompute for the loan's servicer (significant-findings term)"
      - from: IN_REVIEW
        to: FINDINGS_ISSUED
        trigger: "POST /gse/qc-audits/{auditId}/issue-findings"
        actor: QcAuditor
        preconditions: []
        side_effects:
          - "audit.status -> FINDINGS_ISSUED"
      - from: FINDINGS_ISSUED
        to: CLOSED
        trigger: "POST /gse/qc-audits/{auditId}/close"
        actor: QcAuditor
        preconditions:
          - "every finding of the audit is in a terminal finding state (UPHELD with demand settled or withdrawn, OVERTURNED, or REMEDIATED) else ERR_AUDIT_HAS_OPEN_FINDINGS"
        side_effects:
          - "audit.status -> CLOSED"

  - entity: QcFinding
    initial_state: IDENTIFIED
    terminal_states: [UPHELD, OVERTURNED, REMEDIATED]
    transitions:
      - from: IDENTIFIED
        to: REPURCHASE_ISSUED
        trigger: "POST /gse/qc-findings/{findingId}/issue-demand"
        actor: GseAdmin
        preconditions:
          - "audit.status == FINDINGS_ISSUED else ERR_AUDIT_NOT_ISSUED"
          - "loan.relief_tier evaluation: if relief_tier == INDEPENDENT_VALIDATION and defect_category in {INCOME_MISREP, ASSET_MISREP, EMPLOYMENT_MISREP} -> ERR_RELIEF_TIER_BLOCKS_DEMAND; if relief_tier == PAYMENT_HISTORY_36 and defect_category in {INCOME_MISREP, ASSET_MISREP, EMPLOYMENT_MISREP} -> ERR_RELIEF_TIER_BLOCKS_DEMAND"
        side_effects:
          - "finding.status -> REPURCHASE_ISSUED"
          - "create RepurchaseDemand: amount_cents = loan.unpaid_principal_balance_cents, appeal_deadline = now + 30 days, status ISSUED"
      - from: REPURCHASE_ISSUED
        to: APPEALED
        trigger: "system (upon POST /gse/repurchase-demands/{demandId}/appeal)"
        actor: SellerOfficer
        preconditions:
          - "demand.status in {ISSUED, UPHELD} else ERR_INVALID_STATE"
          - "now <= demand.appeal_deadline else ERR_APPEAL_WINDOW_CLOSED"
          - "demand.appeal_rounds_used < 2 else ERR_APPEAL_ROUNDS_EXHAUSTED"
        side_effects:
          - "finding.status -> APPEALED"
          - "demand.status -> APPEALED"
          - "demand.appeal_rounds_used += 1"
      - from: UPHELD
        to: APPEALED
        trigger: "system (upon POST /gse/repurchase-demands/{demandId}/appeal from an UPHELD demand)"
        actor: SellerOfficer
        preconditions:
          - "demand.status in {ISSUED, UPHELD} else ERR_INVALID_STATE"
          - "now <= demand.appeal_deadline else ERR_APPEAL_WINDOW_CLOSED"
          - "demand.appeal_rounds_used < 2 else ERR_APPEAL_ROUNDS_EXHAUSTED"
        side_effects:
          - "finding.status -> APPEALED"
          - "demand.status -> APPEALED"
          - "demand.appeal_rounds_used += 1"
      - from: APPEALED
        to: UPHELD
        trigger: "POST /gse/repurchase-demands/{demandId}/resolve-appeal with outcome UPHELD"
        actor: GseAdmin
        preconditions:
          - "demand.status == APPEALED else ERR_INVALID_STATE"
        side_effects:
          - "finding.status -> UPHELD"
          - "demand.status -> UPHELD"
      - from: APPEALED
        to: OVERTURNED
        trigger: "POST /gse/repurchase-demands/{demandId}/resolve-appeal with outcome OVERTURNED"
        actor: GseAdmin
        preconditions:
          - "demand.status == APPEALED else ERR_INVALID_STATE"
        side_effects:
          - "finding.status -> OVERTURNED"
          - "demand.status -> WITHDRAWN"
      - from: UPHELD
        to: REMEDIATED
        trigger: "system (upon POST /gse/repurchase-demands/{demandId}/settle)"
        actor: SellerOfficer
        preconditions: []
        side_effects:
          - "finding.status -> REMEDIATED"
          - "demand.status -> SETTLED"
          - "loan.status -> REPURCHASED"

  - entity: RepurchaseDemand
    initial_state: ISSUED
    terminal_states: [WITHDRAWN, SETTLED]
    transitions:
      - from: ISSUED
        to: APPEALED
        trigger: "POST /gse/repurchase-demands/{demandId}/appeal"
        actor: SellerOfficer
        preconditions:
          - "now <= demand.appeal_deadline else ERR_APPEAL_WINDOW_CLOSED"
          - "demand.appeal_rounds_used < 2 else ERR_APPEAL_ROUNDS_EXHAUSTED"
        side_effects:
          - "demand.appeal_rounds_used += 1"
          - "finding.status -> APPEALED"
      - from: UPHELD
        to: APPEALED
        trigger: "POST /gse/repurchase-demands/{demandId}/appeal"
        actor: SellerOfficer
        preconditions:
          - "now <= demand.appeal_deadline else ERR_APPEAL_WINDOW_CLOSED"
          - "demand.appeal_rounds_used < 2 else ERR_APPEAL_ROUNDS_EXHAUSTED"
        side_effects:
          - "demand.appeal_rounds_used += 1"
          - "finding.status -> APPEALED"
      - from: APPEALED
        to: UPHELD
        trigger: "POST /gse/repurchase-demands/{demandId}/resolve-appeal with outcome UPHELD"
        actor: GseAdmin
        preconditions: []
        side_effects:
          - "finding.status -> UPHELD"
      - from: APPEALED
        to: WITHDRAWN
        trigger: "POST /gse/repurchase-demands/{demandId}/resolve-appeal with outcome OVERTURNED"
        actor: GseAdmin
        preconditions: []
        side_effects:
          - "finding.status -> OVERTURNED"
          - "servicer_oversight_score recompute (pending-demand count drops)"
      - from: UPHELD
        to: SETTLED
        trigger: "POST /gse/repurchase-demands/{demandId}/settle"
        actor: SellerOfficer
        preconditions:
          - "seller_financial_check: outstanding UPHELD total + this amount <= seller.net_worth_cents else ERR_INSUFFICIENT_SELLER_FUNDS"
        side_effects:
          - "finding.status -> REMEDIATED"
          - "loan.status -> REPURCHASED"

  - entity: ServicingTransfer
    initial_state: REQUESTED
    terminal_states: [REJECTED, COMPLETED, CANCELLED]
    transitions:
      - from: REQUESTED
        to: APPROVED
        trigger: "POST /gse/servicing-transfers/{transferId}/approve"
        actor: GseAdmin
        preconditions:
          - "to_servicer.status == APPROVED else ERR_SERVICER_NOT_APPROVED"
          - "to_servicer.oversight_score >= 60 else ERR_SUBSERVICER_OVERSIGHT_DEFICIENT"
          - "segregation of duties: acting admin's X-User-ID must differ from the X-User-ID of the ServicerOfficer who created the request else ERR_SEGREGATION_OF_DUTIES"
          - "expected_loan_version == loan.version else ERR_STALE_VERSION (412)"
        side_effects:
          - "transfer.status -> APPROVED"
      - from: REQUESTED
        to: REJECTED
        trigger: "POST /gse/servicing-transfers/{transferId}/reject"
        actor: GseAdmin
        preconditions:
          - "segregation of duties: acting admin's X-User-ID must differ from the requesting ServicerOfficer's X-User-ID else ERR_SEGREGATION_OF_DUTIES"
        side_effects:
          - "transfer.status -> REJECTED"
      - from: APPROVED
        to: COMPLETED
        trigger: "system (automatic when logical clock reaches effective_date)"
        actor: system
        preconditions:
          - "loan is not in status REPURCHASED at completion time else the transfer auto-transitions to CANCELLED instead"
        side_effects:
          - "transfer.status -> COMPLETED"
          - "loan.servicer_id = transfer.to_servicer_id"
      - from: REQUESTED
        to: CANCELLED
        trigger: "POST /gse/servicing-transfers/{transferId}/cancel"
        actor: ServicerOfficer
        preconditions:
          - "cancelling officer's X-User-ID must equal the requesting officer's X-User-ID else ERR_FORBIDDEN_FOR_ROLE"
        side_effects:
          - "transfer.status -> CANCELLED"

  - entity: SubservicerOversight
    initial_state: OPEN
    terminal_states: [CLOSED]
    transitions:
      - from: OPEN
        to: CLOSED
        trigger: "POST /gse/subservicer-oversight/{recordId}/close"
        actor: GseAdmin
        preconditions:
          - "oversight_period_end <= now else ERR_OVERSIGHT_PERIOD_NOT_ENDED"
        side_effects:
          - "record.status -> CLOSED"
          - "servicer_oversight_score recompute for the master servicer"

# =============================================================================
# §1.2.1 Concurrency Rules (OCC only)
# =============================================================================
concurrency_rules:
  - rule_id: uw-finalize-stale-case
    parent_entity: UnderwritingCase
    write_endpoint: "POST /gse/underwriting-cases/{caseId}/finalize"
    occ_field: "expected_case_version"
    description: |
      Finalizing an UnderwritingCase whose version has advanced since the
      caller last observed it is rejected: a prior finalize or a cascaded
      mutation may already have settled the outcome, so the stale caller's
      view of the case is out of date.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: pool-issue-stale-pool
    parent_entity: Pool
    write_endpoint: "POST /gse/pools/{poolId}/issue"
    occ_field: "expected_pool_version"
    description: |
      Issuing a Pool whose version has advanced since the caller last
      observed it is rejected: deliveries, cancellations, or a prior issue
      attempt may have changed the pool contents the caller priced against.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: transfer-approve-stale-loan
    parent_entity: Loan
    write_endpoint: "POST /gse/servicing-transfers/{transferId}/approve"
    occ_field: "expected_loan_version"
    description: |
      Approving a ServicingTransfer against a Loan whose version has advanced
      since the caller last observed it is rejected: a loan-level mutation
      (repurchase, re-underwriting, a prior transfer completion) may have
      invalidated the servicing arrangement the approval was based on.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# Table 3: Calculation Rules Table
# =============================================================================
calculations:
  - name: ltv_calculation
    trigger: "loan creation"
    algorithm: aggregation
    formula: |
      ltv_bp = round_half_up(10000 * unpaid_principal_balance_cents / appraised_value_cents)
      Example: UPB 400,000.00 (40000000 cents), appraisal 500,000.00 -> ltv_bp = 8000 (80.00%)
    input_set: "the loan being created"
    precision: "integer basis points, round_half_up"

  - name: eligibility_check
    trigger: "underwriting case finalize"
    algorithm: threshold
    formula: |
      loan is ELIGIBLE iff ALL of:
        ltv_bp <= 9500
        credit_score >= 620
        occupancy in {PRIMARY_RESIDENCE, SECOND_HOME, INVESTMENT}
        product_type in {FIXED_30, FIXED_15, ARM_5_1}
      If eligible:
        recommendation = REFER_WITH_CAUTION if credit_score < 680 or ltv_bp > 9000
        else recommendation = APPROVE_ELIGIBLE
        final_outcome = PASS
      else:
        final_outcome = FAIL
    input_set: "the loan attached to the case"
    constants:
      MAX_LTV_BP: 9500
      MIN_CREDIT_SCORE: 620
      REFER_CREDIT_SCORE_LT: 680
      REFER_LTV_BP_GT: 9000

  - name: score_calculation
    trigger: "underwriting case finalize"
    algorithm: threshold
    formula: |
      A score of exactly 620 (== MIN_CREDIT_SCORE) is eligible; 619 is not.
      LTV of exactly 9500 (== MAX_LTV_BP) is eligible; 9501 is not.
      REFER band: credit_score in [620, 679] or ltv_bp in (9000, 9500].

  - name: loan_price
    trigger: "loan delivery and pipeline revaluation"
    algorithm: aggregation
    formula: |
      Grid selection (as-of pricing):
        provisional mode (pipeline_revaluation): use the currently ACTIVE LlpaMatrix
        final mode (loan delivery): use the LlpaMatrix ACTIVE at the delivery instant,
          pinned onto the loan as applied_llpa_bps and delivery_price_cents
      Row selection within a grid (exactly one row must match, else no pricing row):
        row.occupancy == loan.occupancy
        row.product_type == loan.product_type
        row.ltv_min_bp < loan.ltv_bp <= row.ltv_max_bp
        row.credit_min <= loan.credit_score <= row.credit_max
      delivery_price_cents = unpaid_principal_balance_cents
          - round_half_up(unpaid_principal_balance_cents * row.llpa_bps / 10000)
    input_set: "one loan + one LlpaMatrix"
    precision: "integer cents, round_half_up"
    variants:
      - name: provisional
        when: "pipeline_revaluation on undelivered loans"
        difference: "uses whichever grid is ACTIVE at revaluation time; not persisted on the loan"
      - name: final
        when: "POST /gse/loans/{loanId}/deliver"
        difference: "uses the grid ACTIVE at delivery instant; persisted on loan as applied_llpa_bps and delivery_price_cents; later grid swaps do not change delivered or purchased loans"

  - name: pipeline_revaluation
    trigger: "LLPA matrix activation, loan create/update in DRAFT or UNDERWRITTEN, loan delivery, loan rejection, pool cancel, pool issue"
    algorithm: aggregation
    formula: |
      pipeline.projected_value_cents =
        sum over loans where loan.seller_id == pipeline.seller_id
          and loan.status in {DRAFT, UNDERWRITTEN}
        of loan_price(loan, ACTIVE LlpaMatrix)
      Loans with no matching pricing row in the ACTIVE grid contribute 0.
      On grid swap, also write an LlpaUpdateEvent capturing before/after/delta
      and the count of loans whose recomputed price changed.
    input_set: "pipeline seller's loans in DRAFT or UNDERWRITTEN + ACTIVE LlpaMatrix"

  - name: relief_tier_evaluation
    trigger: "payment event recording (each event) and independent-validation completion"
    algorithm: threshold
    formula: |
      let validated = loan.independent_validation_complete
      let pay36 = loan.consecutive_on_time_payments >= 36
      raw tier:
        if validated -> INDEPENDENT_VALIDATION
        elif pay36 -> PAYMENT_HISTORY_36
        else -> NONE
      probation cap (seller.probation_relief_enabled == true):
        if raw tier == INDEPENDENT_VALIDATION -> cap to PAYMENT_HISTORY_36
        else raw tier unchanged
      Boundary: exactly 36 consecutive on-time payments qualifies; 35 does not.
    input_set: "the loan + its seller"
    constants:
      PAYMENT_HISTORY_MILESTONE: 36
    variants:
      - name: payment_history_path
        when: "relief earned by payment performance"
        difference: "requires 36 consecutive on-time payments; any LATE event resets the counter to 0 and the tier falls back"
      - name: independent_validation_path
        when: "relief earned by Day-1 data validation"
        difference: "requires all three validation services (INCOME, ASSET, EMPLOYMENT) VALIDATED in the latest submission round; independent of payment count"

  - name: repurchase_amount
    trigger: "repurchase demand issuance"
    algorithm: aggregation
    formula: |
      amount_cents = loan.unpaid_principal_balance_cents at the moment of issuance
      appeal_deadline = issued_at + 30 days (inclusive: appeal allowed while now <= appeal_deadline)
    input_set: "the finding's loan"
    constants:
      APPEAL_WINDOW_DAYS: 30

  - name: seller_financial_check
    trigger: "repurchase demand settle"
    algorithm: threshold
    formula: |
      outstanding = sum of amount_cents over RepurchaseDemand
        where demand.loan_id belongs to this seller and demand.status == UPHELD
      if outstanding + this_demand.amount_cents > seller.net_worth_cents
        -> ERR_INSUFFICIENT_SELLER_FUNDS, no state change
      Boundary: equal to net_worth_cents is allowed (<=), exceeding by 1 cent fails.
    input_set: "the settling seller's UPHELD unsettled demands + this demand"
    note: "this_demand is included in the sum before the comparison"

  - name: servicer_oversight_score
    trigger: "servicing transfer approval check, oversight record close, QC finding creation on a loan serviced by this servicer"
    algorithm: aggregation
    formula: |
      pending_issues = count of RepurchaseDemand with status in {ISSUED, APPEALED}
        on loans where loan.servicer_id == servicer.id
      oversight_findings = sum of findings_count over SubservicerOversight
        records with servicer_id == servicer.id (as master) and status == OPEN
      oversight_score = clamp(100 - 5 * pending_issues - 2 * oversight_findings, 0, 100)
      Transfer approval requires oversight_score >= 60 (boundary: exactly 60 passes).
    input_set: "one servicer's demands + open oversight records"
    constants:
      MIN_OVERSIGHT_SCORE_FOR_TRANSFER: 60
      PENDING_ISSUE_PENALTY: 5
      FINDING_PENALTY: 2

  - name: pool_balance
    trigger: "loan deliver, pool cancel"
    algorithm: aggregation
    formula: |
      pool.current_balance_cents = sum of unpaid_principal_balance_cents
        over loans with pool_id == pool.id and status == DELIVERED
      pool.loan_count = count of those loans
      Capacity rule on delivery: current_balance_cents + incoming UPB <= target_balance_cents
      (boundary: exactly equal is allowed).
    input_set: "the pool's DELIVERED loans"

# =============================================================================
# Table 4: Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers must be present and well-formed"
    error_id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER
    http_status: 400
    applies_to: "all"
  - priority: 2
    category: auth
    check: "Caller role must be permitted for this endpoint per §1.7"
    error_id: ERR_FORBIDDEN_FOR_ROLE
    http_status: 403
    applies_to: "all"
  - priority: 3
    category: existence
    check: "Every id referenced in path and body must exist (validated left-to-right in path)"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all resource endpoints"
  - priority: 4
    category: state
    check: "Target resource must be in a state that permits the requested transition"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all state-transition endpoints"
  - priority: 5
    category: business_temporal
    check: "Temporal gates: appeal window (now <= appeal_deadline), transfer effective_date strictly after now, oversight period ended before close, agreement effective at activation, pool issue_date in future at creation"
    error_id: "ERR_APPEAL_WINDOW_CLOSED | ERR_TRANSFER_DATE_PAST | ERR_OVERSIGHT_PERIOD_NOT_ENDED | ERR_AGREEMENT_NOT_EFFECTIVE"
    http_status: 422
    applies_to: "appeal, transfer create/approve, oversight close, agreement activate, pool create"
  - priority: 6
    category: business_referential
    check: "Referential gates: pool.seller_id == loan.seller_id and pool.agreement_id == loan.agreement_id on delivery; finding loan belongs to audit seller"
    error_id: "ERR_POOL_NOT_OPEN | ERR_LOAN_NOT_PURCHASED"
    http_status: 409
    applies_to: "loan deliver, finding create"
  - priority: 7
    category: business_safety
    check: "Compliance gates: relief tier blocks repurchase demand; segregation of duties on transfer approve/reject; subservicer oversight score >= 60"
    error_id: "ERR_RELIEF_TIER_BLOCKS_DEMAND | ERR_SEGREGATION_OF_DUTIES | ERR_SUBSERVICER_OVERSIGHT_DEFICIENT"
    http_status: 422
    applies_to: "issue-demand, transfer approve/reject"
  - priority: 8
    category: business_fiscal
    check: "Fiscal gates: pool capacity on delivery; seller net worth covers outstanding UPHELD demands on settle"
    error_id: "ERR_POOL_CAPACITY_EXCEEDED | ERR_INSUFFICIENT_SELLER_FUNDS"
    http_status: 422
    applies_to: "loan deliver, demand settle"
  - priority: 9
    category: business_constraint
    check: "Constraint gates: appeal_rounds_used < 2; pool non-empty to lock; seller/servicer approval thresholds; loan eligibility"
    error_id: "ERR_APPEAL_ROUNDS_EXHAUSTED | ERR_POOL_EMPTY | ERR_NET_WORTH_BELOW_MINIMUM | ERR_QC_DEFECT_RATE_EXCEEDED | ERR_SERVICER_QC_RATING_INSUFFICIENT | ERR_LOAN_NOT_ELIGIBLE | ERR_SELLER_NOT_APPROVED | ERR_SERVICER_NOT_APPROVED"
    http_status: 422
    applies_to: "appeal, pool lock, seller/servicer approve, loan deliver"

# =============================================================================
# §1.0 Response Envelope (FIXED — verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# Table 5: API Endpoint Table
# =============================================================================
endpoints:
  # --- test-driving clock ---
  - method: POST
    path: "/gse/_clock/set_current_utc"
    description: "Set the logical clock (ISO 8601 UTC). Startup default is 2026-09-01T00:00:00Z; before any call the logical clock reads exactly that default and never falls back to wall-clock."
    roles: [GseAdmin]
    code: 200
    input: [current_utc]
    output: { current_utc: string }
    side_effects: ["advance-dependent system transitions re-evaluated: MasterAgreement expiry, ServicingTransfer completion"]

  # --- Seller ---
  - method: POST
    path: "/gse/sellers"
    description: "Register a seller (PENDING_APPROVAL)"
    roles: [GseAdmin]
    code: 201
    input: [legal_name, seller_number, net_worth_cents, qc_defect_rate_bps]
    output: Seller
    side_effects: ["status = PENDING_APPROVAL, approval_cycle = 1, probation_relief_enabled = false"]
  - method: GET
    path: "/gse/sellers/{sellerId}"
    description: "Get a seller"
    roles: [GseAdmin, GseUnderwritingEngine, SellerOfficer, Underwriter, QcAuditor, ServicerOfficer]
    code: 200
    input: []
    output: Seller
    side_effects: []
  - method: POST
    path: "/gse/sellers/{sellerId}/approve"
    description: "Approve a seller (initial or re-approval from SUSPENDED)"
    roles: [GseAdmin]
    code: 200
    input: []
    output: Seller
    side_effects: ["status -> APPROVED; on re-approval approval_cycle += 1 and probation_relief_enabled set when cycle reaches 2"]
  - method: POST
    path: "/gse/sellers/{sellerId}/suspend"
    description: "Suspend a seller"
    roles: [GseAdmin]
    code: 200
    input: []
    output: Seller
    side_effects: ["status -> SUSPENDED"]
  - method: POST
    path: "/gse/sellers/{sellerId}/terminate"
    description: "Terminate a seller"
    roles: [GseAdmin]
    code: 200
    input: []
    output: Seller
    side_effects: ["status -> TERMINATED"]

  # --- Servicer ---
  - method: POST
    path: "/gse/servicers"
    description: "Register a servicer (PENDING_APPROVAL)"
    roles: [GseAdmin]
    code: 201
    input: [legal_name, servicer_number, net_worth_cents, qc_rating]
    output: Servicer
    side_effects: ["status = PENDING_APPROVAL, oversight_score = 100"]
  - method: GET
    path: "/gse/servicers/{servicerId}"
    description: "Get a servicer"
    roles: [GseAdmin, GseUnderwritingEngine, SellerOfficer, Underwriter, QcAuditor, ServicerOfficer]
    code: 200
    input: []
    output: Servicer
    side_effects: []
  - method: POST
    path: "/gse/servicers/{servicerId}/approve"
    description: "Approve a servicer"
    roles: [GseAdmin]
    code: 200
    input: []
    output: Servicer
    side_effects: ["status -> APPROVED"]
  - method: POST
    path: "/gse/servicers/{servicerId}/suspend"
    description: "Suspend a servicer"
    roles: [GseAdmin]
    code: 200
    input: []
    output: Servicer
    side_effects: ["status -> SUSPENDED"]
  - method: POST
    path: "/gse/servicers/{servicerId}/terminate"
    description: "Terminate a servicer"
    roles: [GseAdmin]
    code: 200
    input: []
    output: Servicer
    side_effects: ["status -> TERMINATED"]

  # --- MasterAgreement ---
  - method: POST
    path: "/gse/master-agreements"
    description: "Create a master agreement (DRAFT)"
    roles: [GseAdmin]
    code: 201
    input: [seller_id, servicer_id, effective_date, expiration_date]
    output: MasterAgreement
    side_effects: ["status = DRAFT"]
  - method: GET
    path: "/gse/master-agreements/{agreementId}"
    description: "Get a master agreement"
    roles: [GseAdmin, GseUnderwritingEngine, SellerOfficer, Underwriter, QcAuditor, ServicerOfficer]
    code: 200
    input: []
    output: MasterAgreement
    side_effects: []
  - method: GET
    path: "/gse/master-agreements"
    description: "List master agreements, filterable"
    roles: [GseAdmin, GseUnderwritingEngine, SellerOfficer, Underwriter, QcAuditor, ServicerOfficer]
    code: 200
    input: ["seller_id?", "servicer_id?", "status?", "limit?", "offset?"]
    output: "MasterAgreement[]"
    side_effects: []
  - method: POST
    path: "/gse/master-agreements/{agreementId}/activate"
    description: "Activate a master agreement"
    roles: [GseAdmin]
    code: 200
    input: []
    output: MasterAgreement
    side_effects: ["status -> ACTIVE"]
  - method: POST
    path: "/gse/master-agreements/{agreementId}/terminate"
    description: "Terminate a master agreement"
    roles: [GseAdmin]
    code: 200
    input: []
    output: MasterAgreement
    side_effects: ["status -> TERMINATED"]

  # --- LlpaMatrix ---
  - method: POST
    path: "/gse/llpa-matrices"
    description: "Create an LLPA grid; the new grid becomes ACTIVE and any prior ACTIVE grid is SUPERSEDED, triggering pipeline revaluation and LlpaUpdateEvents"
    roles: [GseAdmin]
    code: 201
    input: [effective_from, effective_until, rows]
    output: LlpaMatrix
    side_effects: ["prior ACTIVE matrix -> SUPERSEDED; pipeline_revaluation for every pipeline; one LlpaUpdateEvent per pipeline"]
  - method: GET
    path: "/gse/llpa-matrices/{matrixId}"
    description: "Get an LLPA grid"
    roles: [GseAdmin, GseUnderwritingEngine, SellerOfficer, Underwriter, QcAuditor, ServicerOfficer]
    code: 200
    input: []
    output: LlpaMatrix
    side_effects: []
  - method: GET
    path: "/gse/llpa-matrices"
    description: "List LLPA grids"
    roles: [GseAdmin, GseUnderwritingEngine, SellerOfficer, Underwriter, QcAuditor, ServicerOfficer]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: "LlpaMatrix[]"
    side_effects: []

  # --- Loan ---
  - method: POST
    path: "/gse/loans"
    description: "Register a loan application (DRAFT); ltv_bp computed at creation"
    roles: [SellerOfficer]
    code: 201
    input: [seller_id, servicer_id, agreement_id, loan_number, borrower_name, unpaid_principal_balance_cents, appraised_value_cents, credit_score, occupancy, product_type]
    output: Loan
    side_effects: ["status = DRAFT, au_status = NOT_SUBMITTED, ltv_bp computed, pipeline_revaluation for seller pipeline"]
  - method: GET
    path: "/gse/loans/{loanId}"
    description: "Get a loan"
    roles: [GseAdmin, GseUnderwritingEngine, SellerOfficer, Underwriter, QcAuditor, ServicerOfficer]
    code: 200
    input: []
    output: Loan
    side_effects: []
  - method: GET
    path: "/gse/loans"
    description: "List loans, filterable"
    roles: [GseAdmin, GseUnderwritingEngine, SellerOfficer, Underwriter, QcAuditor, ServicerOfficer]
    code: 200
    input: ["seller_id?", "servicer_id?", "agreement_id?", "pool_id?", "status?", "limit?", "offset?"]
    output: "Loan[]"
    side_effects: []
  - method: POST
    path: "/gse/loans/{loanId}/deliver"
    description: "Deliver an UNDERWRITTEN loan into an OPEN pool; pins final LLPA pricing"
    roles: [SellerOfficer]
    code: 200
    input: [pool_id]
    output: Loan
    side_effects: ["status -> DELIVERED; pool_id, delivered_at set; pool balances incremented; delivery_price_cents and applied_llpa_bps pinned from ACTIVE grid; pipeline_revaluation"]

  # --- UnderwritingCase / ValidationReport ---
  - method: POST
    path: "/gse/underwriting-cases"
    description: "Submit a loan for automated underwriting (SUBMITTED)"
    roles: [SellerOfficer]
    code: 201
    input: [loan_id]
    output: UnderwritingCase
    side_effects: ["case_status = SUBMITTED, submission_round = 1; ERR_LOAN_NOT_UNDERWRITABLE if loan not DRAFT or a non-finalized case already exists for the loan"]
  - method: GET
    path: "/gse/underwriting-cases/{caseId}"
    description: "Get an underwriting case"
    roles: [GseAdmin, GseUnderwritingEngine, SellerOfficer, Underwriter, QcAuditor, ServicerOfficer]
    code: 200
    input: []
    output: UnderwritingCase
    side_effects: []
  - method: GET
    path: "/gse/underwriting-cases"
    description: "List underwriting cases, filterable by loan"
    roles: [GseAdmin, GseUnderwritingEngine, SellerOfficer, Underwriter, QcAuditor, ServicerOfficer]
    code: 200
    input: ["loan_id?", "case_status?", "limit?", "offset?"]
    output: "UnderwritingCase[]"
    side_effects: []
  - method: POST
    path: "/gse/underwriting-cases/{caseId}/reports"
    description: "Record a data-validation report (INCOME, ASSET, or EMPLOYMENT) for the current submission round"
    roles: [Underwriter]
    code: 201
    input: [service_type, provider_reference]
    output: ValidationReport
    side_effects: ["case -> VALIDATING (or stays VALIDATING); report result = PENDING; case auto-transitions VALIDATED when all 3 service types VALIDATED this round, or FAILED on any NOT_VALIDATED (round increments)"]
  - method: GET
    path: "/gse/validation-reports"
    description: "List validation reports, filterable by case"
    roles: [GseAdmin, GseUnderwritingEngine, SellerOfficer, Underwriter, QcAuditor, ServicerOfficer]
    code: 200
    input: ["case_id?", "service_type?", "limit?", "offset?"]
    output: "ValidationReport[]"
    side_effects: []
  - method: POST
    path: "/gse/validation-reports/{reportId}/complete"
    description: "Complete a pending validation report with an outcome"
    roles: [Underwriter]
    code: 200
    input: [result]
    output: ValidationReport
    side_effects: ["result = VALIDATED or NOT_VALIDATED; may trigger case auto-transition VALIDATED/FAILED"]
  - method: POST
    path: "/gse/underwriting-cases/{caseId}/finalize"
    description: "Finalize a VALIDATED case; computes eligibility, recommendation, and cascades onto the loan (OCC-guarded on case version)"
    roles: [GseUnderwritingEngine]
    code: 200
    input: [expected_case_version]
    output: UnderwritingCase
    side_effects: ["case -> FINALIZED; case.version += 1; recommendation and final_outcome set; loan cascade per Loan machine; independent_validation_complete = true on loan when final_outcome == PASS; relief_tier re-evaluated; pipeline_revaluation"]

  # --- Pool ---
  - method: POST
    path: "/gse/pools"
    description: "Create a pool (OPEN); issue_date must be strictly after now"
    roles: [SellerOfficer]
    code: 201
    input: [seller_id, agreement_id, pool_number, issue_date, target_balance_cents]
    output: Pool
    side_effects: ["status = OPEN, current_balance_cents = 0, loan_count = 0"]
  - method: GET
    path: "/gse/pools/{poolId}"
    description: "Get a pool"
    roles: [GseAdmin, GseUnderwritingEngine, SellerOfficer, Underwriter, QcAuditor, ServicerOfficer]
    code: 200
    input: []
    output: Pool
    side_effects: []
  - method: GET
    path: "/gse/pools"
    description: "List pools, filterable"
    roles: [GseAdmin, GseUnderwritingEngine, SellerOfficer, Underwriter, QcAuditor, ServicerOfficer]
    code: 200
    input: ["seller_id?", "agreement_id?", "status?", "limit?", "offset?"]
    output: "Pool[]"
    side_effects: []
  - method: POST
    path: "/gse/pools/{poolId}/lock"
    description: "Lock a pool for issuance (requires >= 1 loan)"
    roles: [SellerOfficer]
    code: 200
    input: []
    output: Pool
    side_effects: ["status -> LOCKED"]
  - method: POST
    path: "/gse/pools/{poolId}/unlock"
    description: "Unlock a pool back to OPEN"
    roles: [SellerOfficer]
    code: 200
    input: []
    output: Pool
    side_effects: ["status -> OPEN"]
  - method: POST
    path: "/gse/pools/{poolId}/issue"
    description: "Issue a LOCKED pool; all DELIVERED loans become PURCHASED (OCC-guarded on pool version)"
    roles: [SellerOfficer]
    code: 200
    input: [expected_pool_version]
    output: Pool
    side_effects: ["status -> ISSUED; pool.version += 1; each DELIVERED loan -> PURCHASED; pipeline_revaluation"]
  - method: POST
    path: "/gse/pools/{poolId}/cancel"
    description: "Cancel an OPEN pool; returns its DELIVERED loans to DRAFT"
    roles: [SellerOfficer]
    code: 200
    input: []
    output: Pool
    side_effects: ["status -> CANCELLED; each DELIVERED loan -> DRAFT with pool_id cleared; pool balances decremented; pipeline_revaluation"]

  # --- PaymentEvent ---
  - method: POST
    path: "/gse/payment-events"
    description: "Record a monthly payment for a loan (at most one per loan per due_date)"
    roles: [ServicerOfficer]
    code: 201
    input: [loan_id, due_date, paid_on_time, amount_cents]
    output: PaymentEvent
    side_effects: ["outcome = ON_TIME or LATE; consecutive_on_time_payments incremented on ON_TIME, reset to 0 on LATE; relief_tier re-evaluated; ERR_DUPLICATE_PAYMENT_PERIOD if an event already exists for (loan_id, due_date); ERR_INVALID_REQUEST if amount_cents <= 0; loan must be PURCHASED else ERR_LOAN_NOT_PURCHASED"]
  - method: GET
    path: "/gse/payment-events"
    description: "List payment events, filterable by loan"
    roles: [GseAdmin, GseUnderwritingEngine, SellerOfficer, Underwriter, QcAuditor, ServicerOfficer]
    code: 200
    input: ["loan_id?", "outcome?", "limit?", "offset?"]
    output: "PaymentEvent[]"
    side_effects: []

  # --- QC audit / findings / repurchase ---
  - method: POST
    path: "/gse/qc-audits"
    description: "Open a post-purchase QC audit for a seller"
    roles: [QcAuditor]
    code: 201
    input: [seller_id, sampling_method]
    output: QcAudit
    side_effects: ["status = OPEN"]
  - method: GET
    path: "/gse/qc-audits/{auditId}"
    description: "Get a QC audit"
    roles: [GseAdmin, GseUnderwritingEngine, SellerOfficer, Underwriter, QcAuditor, ServicerOfficer]
    code: 200
    input: []
    output: QcAudit
    side_effects: []
  - method: GET
    path: "/gse/qc-audits"
    description: "List QC audits, filterable by seller"
    roles: [GseAdmin, GseUnderwritingEngine, SellerOfficer, Underwriter, QcAuditor, ServicerOfficer]
    code: 200
    input: ["seller_id?", "status?", "limit?", "offset?"]
    output: "QcAudit[]"
    side_effects: []
  - method: POST
    path: "/gse/qc-audits/{auditId}/findings"
    description: "Add a finding citing a PURCHASED loan to an OPEN/IN_REVIEW audit"
    roles: [QcAuditor]
    code: 201
    input: [loan_id, defect_category, severity]
    output: QcFinding
    side_effects: ["finding status = IDENTIFIED; audit OPEN -> IN_REVIEW; servicer_oversight_score recompute"]
  - method: GET
    path: "/gse/qc-findings"
    description: "List QC findings, filterable"
    roles: [GseAdmin, GseUnderwritingEngine, SellerOfficer, Underwriter, QcAuditor, ServicerOfficer]
    code: 200
    input: ["audit_id?", "loan_id?", "status?", "limit?", "offset?"]
    output: "QcFinding[]"
    side_effects: []
  - method: GET
    path: "/gse/qc-findings/{findingId}"
    description: "Get a QC finding"
    roles: [GseAdmin, GseUnderwritingEngine, SellerOfficer, Underwriter, QcAuditor, ServicerOfficer]
    code: 200
    input: []
    output: QcFinding
    side_effects: []
  - method: POST
    path: "/gse/qc-audits/{auditId}/issue-findings"
    description: "Move audit to FINDINGS_ISSUED"
    roles: [QcAuditor]
    code: 200
    input: []
    output: QcAudit
    side_effects: ["status -> FINDINGS_ISSUED"]
  - method: POST
    path: "/gse/qc-audits/{auditId}/close"
    description: "Close an audit once all findings are terminal"
    roles: [QcAuditor]
    code: 200
    input: []
    output: QcAudit
    side_effects: ["status -> CLOSED"]
  - method: POST
    path: "/gse/qc-findings/{findingId}/issue-demand"
    description: "Issue a repurchase demand for a finding (blocked by relief tier for INCOME/ASSET/EMPLOYMENT defects)"
    roles: [GseAdmin]
    code: 201
    input: []
    output: RepurchaseDemand
    side_effects: ["finding -> REPURCHASE_ISSUED; demand ISSUED with amount = loan UPB and appeal_deadline = now + 30 days; servicer_oversight_score recompute"]
  - method: GET
    path: "/gse/repurchase-demands/{demandId}"
    description: "Get a repurchase demand"
    roles: [GseAdmin, GseUnderwritingEngine, SellerOfficer, Underwriter, QcAuditor, ServicerOfficer]
    code: 200
    input: []
    output: RepurchaseDemand
    side_effects: []
  - method: GET
    path: "/gse/repurchase-demands"
    description: "List repurchase demands, filterable"
    roles: [GseAdmin, GseUnderwritingEngine, SellerOfficer, Underwriter, QcAuditor, ServicerOfficer]
    code: 200
    input: ["finding_id?", "loan_id?", "status?", "limit?", "offset?"]
    output: "RepurchaseDemand[]"
    side_effects: []
  - method: POST
    path: "/gse/repurchase-demands/{demandId}/appeal"
    description: "Appeal an ISSUED or UPHELD demand (max 2 appeals per demand, window 30 days from issuance; appeal stays within the window even after an early UPHELD ruling)"
    roles: [SellerOfficer]
    code: 200
    input: [appeal_reason]
    output: RepurchaseDemand
    side_effects: ["demand -> APPEALED; appeal_rounds_used += 1; finding -> APPEALED"]
  - method: POST
    path: "/gse/repurchase-demands/{demandId}/resolve-appeal"
    description: "Resolve an appealed demand (outcome UPHELD or OVERTURNED)"
    roles: [GseAdmin]
    code: 200
    input: [outcome]
    output: RepurchaseDemand
    side_effects: ["UPHELD: demand -> UPHELD, finding -> UPHELD; OVERTURNED: demand -> WITHDRAWN, finding -> OVERTURNED; servicer_oversight_score recompute"]
  - method: POST
    path: "/gse/repurchase-demands/{demandId}/settle"
    description: "Seller settles an UPHELD demand; loan becomes REPURCHASED"
    roles: [SellerOfficer]
    code: 200
    input: []
    output: RepurchaseDemand
    side_effects: ["seller_financial_check; demand -> SETTLED; finding -> REMEDIATED; loan -> REPURCHASED"]

  # --- Servicing transfer / oversight ---
  - method: POST
    path: "/gse/servicing-transfers"
    description: "Request a servicing transfer for a PURCHASED loan"
    roles: [ServicerOfficer]
    code: 201
    input: [loan_id, to_servicer_id, effective_date]
    output: ServicingTransfer
    side_effects: ["status = REQUESTED; from_servicer_id = loan.servicer_id; effective_date must be strictly after now else ERR_TRANSFER_DATE_PAST; loan must be PURCHASED else ERR_LOAN_NOT_PURCHASED; the requesting officer's X-User-ID is recorded on the transfer as requester_id for the segregation-of-duties and cancel-ownership checks"]
  - method: GET
    path: "/gse/servicing-transfers/{transferId}"
    description: "Get a servicing transfer"
    roles: [GseAdmin, GseUnderwritingEngine, SellerOfficer, Underwriter, QcAuditor, ServicerOfficer]
    code: 200
    input: []
    output: ServicingTransfer
    side_effects: []
  - method: GET
    path: "/gse/servicing-transfers"
    description: "List servicing transfers, filterable"
    roles: [GseAdmin, GseUnderwritingEngine, SellerOfficer, Underwriter, QcAuditor, ServicerOfficer]
    code: 200
    input: ["loan_id?", "from_servicer_id?", "to_servicer_id?", "status?", "limit?", "offset?"]
    output: "ServicingTransfer[]"
    side_effects: []
  - method: POST
    path: "/gse/servicing-transfers/{transferId}/approve"
    description: "Approve a transfer (segregation of duties + oversight score >= 60 + OCC on loan version); the 422 oversight-deficiency check is evaluated before the 412 stale-version check"
    roles: [GseAdmin]
    code: 200
    input: [expected_loan_version]
    output: ServicingTransfer
    side_effects: ["status -> APPROVED"]
  - method: POST
    path: "/gse/servicing-transfers/{transferId}/reject"
    description: "Reject a transfer (segregation of duties)"
    roles: [GseAdmin]
    code: 200
    input: []
    output: ServicingTransfer
    side_effects: ["status -> REJECTED"]
  - method: POST
    path: "/gse/servicing-transfers/{transferId}/cancel"
    description: "Requesting officer cancels a pending transfer"
    roles: [ServicerOfficer]
    code: 200
    input: []
    output: ServicingTransfer
    side_effects: ["status -> CANCELLED"]
  - method: POST
    path: "/gse/subservicer-oversight"
    description: "Open a subservicer oversight record for a master servicer"
    roles: [GseAdmin]
    code: 201
    input: [servicer_id, subservicer_id, oversight_period_start, oversight_period_end, "findings_count?"]
    output: SubservicerOversight
    side_effects: ["status = OPEN; servicer_oversight_score recompute"]
  - method: GET
    path: "/gse/subservicer-oversight/{recordId}"
    description: "Get an oversight record"
    roles: [GseAdmin, GseUnderwritingEngine, SellerOfficer, Underwriter, QcAuditor, ServicerOfficer]
    code: 200
    input: []
    output: SubservicerOversight
    side_effects: []
  - method: GET
    path: "/gse/subservicer-oversight"
    description: "List oversight records, filterable"
    roles: [GseAdmin, GseUnderwritingEngine, SellerOfficer, Underwriter, QcAuditor, ServicerOfficer]
    code: 200
    input: ["servicer_id?", "subservicer_id?", "status?", "limit?", "offset?"]
    output: "SubservicerOversight[]"
    side_effects: []
  - method: POST
    path: "/gse/subservicer-oversight/{recordId}/close"
    description: "Close an oversight record after its period has ended"
    roles: [GseAdmin]
    code: 200
    input: []
    output: SubservicerOversight
    side_effects: ["status -> CLOSED; servicer_oversight_score recompute"]

  # --- Pipeline / LLPA update events ---
  - method: POST
    path: "/gse/pipelines"
    description: "Create (or return) the pipeline tracker for a seller"
    roles: [SellerOfficer]
    code: 201
    input: [seller_id]
    output: Pipeline
    side_effects: ["projected_value_cents computed from ACTIVE grid; one pipeline per seller (second create returns the existing pipeline)"]
  - method: GET
    path: "/gse/pipelines/{pipelineId}"
    description: "Get a pipeline with current projected value"
    roles: [GseAdmin, GseUnderwritingEngine, SellerOfficer, Underwriter, QcAuditor, ServicerOfficer]
    code: 200
    input: []
    output: Pipeline
    side_effects: []
  - method: GET
    path: "/gse/pipelines"
    description: "List pipelines, filterable by seller"
    roles: [GseAdmin, GseUnderwritingEngine, SellerOfficer, Underwriter, QcAuditor, ServicerOfficer]
    code: 200
    input: ["seller_id?", "limit?", "offset?"]
    output: "Pipeline[]"
    side_effects: []
  - method: GET
    path: "/gse/llpa-update-events"
    description: "List LLPA grid-swap impact events, filterable by pipeline"
    roles: [GseAdmin, GseUnderwritingEngine, SellerOfficer, Underwriter, QcAuditor, ServicerOfficer]
    code: 200
    input: ["pipeline_id?", "limit?", "offset?"]
    output: "LlpaUpdateEvent[]"
    side_effects: []

# =============================================================================
# Table 6: Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER, http: 400, condition: "X-User-ID or X-User-Role header missing or malformed" }
  - { id: ERR_FORBIDDEN_FOR_ROLE, http: 403, condition: "Caller role not permitted for this endpoint, or ownership check failed (e.g., cancel by a different officer)" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Referenced resource id does not exist" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Target resource is in a state that forbids the requested transition" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "OCC expected_*_version does not match the parent's current version" }
  - { id: ERR_NET_WORTH_BELOW_MINIMUM, http: 422, condition: "Seller/servicer net worth below 25,000.00 at approval" }
  - { id: ERR_QC_DEFECT_RATE_EXCEEDED, http: 422, condition: "Seller QC defect rate above 150 bps at approval" }
  - { id: ERR_SERVICER_QC_RATING_INSUFFICIENT, http: 422, condition: "Servicer QC rating is not SATISFACTORY at approval" }
  - { id: ERR_SELLER_NOT_APPROVED, http: 422, condition: "Seller not in APPROVED status where required (agreement activation, loan delivery)" }
  - { id: ERR_SERVICER_NOT_APPROVED, http: 422, condition: "Servicer not in APPROVED status where required (agreement activation, transfer approval)" }
  - { id: ERR_AGREEMENT_NOT_EFFECTIVE, http: 422, condition: "Agreement not ACTIVE or outside its effective window where required" }
  - { id: ERR_SELLER_HAS_ACTIVE_LOANS, http: 409, condition: "Seller termination blocked by loans in DELIVERED status" }
  - { id: ERR_SERVICER_HAS_ACTIVE_LOANS, http: 409, condition: "Servicer termination blocked by loans in DELIVERED or PURCHASED status" }
  - { id: ERR_LOAN_NOT_UNDERWRITABLE, http: 409, condition: "Loan not in DRAFT or a non-finalized underwriting case already exists for it" }
  - { id: ERR_LOAN_NOT_ELIGIBLE, http: 422, condition: "Loan lacks au_status RECOMMEND_APPROVE at delivery" }
  - { id: ERR_POOL_NOT_OPEN, http: 409, condition: "Pool missing, not OPEN, or mismatched seller/agreement at delivery" }
  - { id: ERR_POOL_CAPACITY_EXCEEDED, http: 422, condition: "Delivery would push pool.current_balance_cents above target_balance_cents" }
  - { id: ERR_POOL_EMPTY, http: 422, condition: "Pool lock requires at least one delivered loan" }
  - { id: ERR_DUPLICATE_PAYMENT_PERIOD, http: 409, condition: "A payment event already exists for this loan and due_date" }
  - { id: ERR_DUPLICATE_IDENTIFIER, http: 409, condition: "seller_number, servicer_number, pool_number, or loan_number already in use" }
  - { id: ERR_LOAN_NOT_PURCHASED, http: 409, condition: "Loan must be PURCHASED for payment events, QC findings, and servicing transfers" }
  - { id: ERR_AUDIT_NOT_ISSUED, http: 409, condition: "Findings must be issued (audit FINDINGS_ISSUED) before demands can be created" }
  - { id: ERR_AUDIT_HAS_OPEN_FINDINGS, http: 409, condition: "Audit close blocked by findings not in a terminal state" }
  - { id: ERR_RELIEF_TIER_BLOCKS_DEMAND, http: 422, condition: "Loan relief tier (PAYMENT_HISTORY_36 or INDEPENDENT_VALIDATION) bars repurchase demands for INCOME/ASSET/EMPLOYMENT defect categories" }
  - { id: ERR_APPEAL_WINDOW_CLOSED, http: 422, condition: "Appeal attempted after appeal_deadline" }
  - { id: ERR_APPEAL_ROUNDS_EXHAUSTED, http: 422, condition: "Demand has already consumed its 2 appeal rounds" }
  - { id: ERR_DEMAND_NOT_UPHELD, http: 409, condition: "Settle requires demand status UPHELD" }
  - { id: ERR_INSUFFICIENT_SELLER_FUNDS, http: 422, condition: "Seller net worth cannot cover outstanding UPHELD demands plus this demand" }
  - { id: ERR_SEGREGATION_OF_DUTIES, http: 403, condition: "Transfer approve/reject must be performed by a GseAdmin whose X-User-ID differs from the requesting ServicerOfficer" }
  - { id: ERR_SUBSERVICER_OVERSIGHT_DEFICIENT, http: 422, condition: "Receiving servicer oversight_score below 60 at transfer approval" }
  - { id: ERR_TRANSFER_DATE_PAST, http: 422, condition: "Transfer effective_date must be strictly after the current logical time" }
  - { id: ERR_OVERSIGHT_PERIOD_NOT_ENDED, http: 422, condition: "Oversight record cannot close before oversight_period_end" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Malformed body, missing required field, invalid enum value, negative/zero amount, expiration_date not strictly after effective_date, or pool issue_date not strictly after the current logical time" }

# =============================================================================
# §9 Invariants (compensating-action conserved quantities)
# =============================================================================
invariants:
  - invariant_id: pool_balance_conservation
    formula: |
      For every Pool p:
        p.current_balance_cents == sum of unpaid_principal_balance_cents
          over loans with pool_id == p.id and status == DELIVERED
        p.loan_count == count of those loans
    note: "Deliver + pool cancel is a forward/compensate pair: after both, every affected loan returns to DRAFT with pool_id null and the pool balance returns to its pre-delivery value."
  - invariant_id: relief_counter_consistency
    formula: |
      For every Loan l:
        let pay_events = PaymentEvent with loan_id == l.id ordered by due_date ASC
        l.consecutive_on_time_payments == length of the longest trailing run of
          consecutive pay_events with outcome == ON_TIME (a LATE event breaks the run)
        l.relief_tier == relief_tier_evaluation(l) given seller probation flag
    note: "An ON_TIME event followed later by a LATE event moves the counter from k to 0 and drops the tier from PAYMENT_HISTORY_36 to NONE (when no independent validation): forward/compensate pair with no drift."
  - invariant_id: pipeline_value_conservation
    formula: |
      For every Pipeline p:
        p.projected_value_cents == sum of loan_price(loan, ACTIVE LlpaMatrix)
          over loans with seller_id == p.seller_id and status in {DRAFT, UNDERWRITTEN}
      Across a full deliver->pool-cancel cycle, the pipeline value returns to
      its pre-delivery value; across an LLPA grid swap, the value after equals
      the recomputed sum under the new grid and the LlpaUpdateEvent delta_cents
      equals after - before exactly.

# =============================================================================
# Table 7: RBAC Matrix
# =============================================================================
roles:
  - name: GseAdmin
    description: "GSE operational administrator: counterparty approval/suspension/termination, agreement lifecycle, LLPA grid management, repurchase demand issuance and appeal resolution, servicing transfer adjudication, oversight records, logical clock"
    identity: opaque
    exclusive_operations:
      - "POST /gse/sellers, /gse/sellers/{id}/approve|suspend|terminate"
      - "POST /gse/servicers, /gse/servicers/{id}/approve|suspend|terminate"
      - "POST /gse/master-agreements (+ activate/terminate)"
      - "POST /gse/llpa-matrices"
      - "POST /gse/qc-findings/{id}/issue-demand"
      - "POST /gse/repurchase-demands/{id}/resolve-appeal"
      - "POST /gse/servicing-transfers/{id}/approve|reject"
      - "POST /gse/subservicer-oversight (+ close)"
      - "POST /gse/_clock/set_current_utc"
    shared_operations: ["all GET endpoints"]
  - name: SellerOfficer
    description: "Seller-side officer: registers loans, submits underwriting cases, delivers loans into pools, manages pool lifecycle, appeals and settles repurchase demands, owns the seller pipeline"
    identity: entity_backed:Seller
    exclusive_operations:
      - "POST /gse/loans, /gse/loans/{id}/deliver"
      - "POST /gse/underwriting-cases"
      - "POST /gse/pools (+ lock/unlock/issue/cancel)"
      - "POST /gse/repurchase-demands/{id}/appeal|settle"
      - "POST /gse/pipelines"
    shared_operations: ["all GET endpoints"]
  - name: Underwriter
    description: "Underwriting analyst: records data-validation reports and completes them with outcomes"
    identity: opaque
    exclusive_operations:
      - "POST /gse/underwriting-cases/{id}/reports"
      - "POST /gse/validation-reports/{id}/complete"
    shared_operations: ["all GET endpoints"]
  - name: GseUnderwritingEngine
    description: "Automated underwriting engine operator: finalizes validated cases (OCC-guarded), producing the recommendation and eligibility outcome"
    identity: opaque
    exclusive_operations:
      - "POST /gse/underwriting-cases/{id}/finalize"
    shared_operations: ["all GET endpoints"]
  - name: QcAuditor
    description: "Post-purchase quality control auditor: opens audits, records findings, issues findings, closes audits"
    identity: opaque
    exclusive_operations:
      - "POST /gse/qc-audits (+ issue-findings, close)"
      - "POST /gse/qc-audits/{id}/findings"
    shared_operations: ["all GET endpoints"]
  - name: ServicerOfficer
    description: "Servicer-side officer: records monthly payment events, requests and cancels servicing transfers"
    identity: entity_backed:Servicer
    exclusive_operations:
      - "POST /gse/payment-events"
      - "POST /gse/servicing-transfers, /gse/servicing-transfers/{id}/cancel"
    shared_operations: ["all GET endpoints"]
