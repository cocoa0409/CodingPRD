      - name: platform_ops_performs_the_shared_supplier_and_funder_operations
        claim_type: shared_operations
        grounds:
          - roles.PlatformOps
          - roles.Supplier.shared_operations
          - roles.Funder.shared_operations
          - state_machines.Supplier
          - entities.BankAccount
        distinguishing_aspect: |
          Every operation PlatformOps shares with another role must actually work when PlatformOps
          performs it - onboarding submit, bank-account registration, micro-deposit confirmation and
          funder commitment creation - and the fork-join must complete identically: after the
          back-office confirms the deposit the supplier is still VERIFYING with bank_status VERIFIED,
          and only the PlatformOps-exclusive IDV adjudication takes it to ACTIVE. PlatformOps still
          cannot create a programme, which is BuyerAdmin-exclusive.
        test_recipe:
          setup:
            - "One Buyer, one Supplier row with no onboarding progress, one Funder row with no commitments"
            - "Every call below is made by PlatformOps acting as back office"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
