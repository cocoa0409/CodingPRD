      - name: validation_cascading_validation_settlement_resolution_can_only_be_judged_after_reconciliation
        claim_type: cascading_validation
        grounds: ["validations[priority=82]", "errors[ERR_SETTLEMENTS_UNRESOLVED]", "calculations.settlement_reconciliation", "entities.BusinessDate.fields.unresolved_settlement_batch_count"]
        distinguishing_aspect: "The one rule has two clauses that must fire in sequence at two different hops: at verify-settlements it can only ask whether a mandatory outlet declared anything, and only after that hop has computed each batch's variance can the balance hop ask whether any batch is still unresolved."
        test_recipe:
          setup: ["Standard property with settlement_variance_tolerance_amount 5.00; one ACTIVE outlet with requires_shift_settlement true; date 2026-08-01 walked to CHARGES_SEALED with no batch at all; date 2026-08-02 walked to CHARGES_SEALED carrying one CASH batch declared at 160.48 against no closed tickets."]
          setup_api_calls:
            - call: "POST /night-audit/properties"
              payload: { name: "Harbor Grand", room_count_total: 100, standard_room_rate_amount: 200.00, occupancy_tax_rate_pct: 8.875, fb_tax_rate_pct: 6.25, service_charge_pct: 18.0, large_ticket_threshold_amount: 472.00, large_party_discount_pct: 5.0, allowance_manager_threshold_amount: 250.00, allowance_controller_threshold_amount: 1000.00, rate_variance_tolerance_pct: 95.0, settlement_variance_tolerance_amount: 5.00, city_ledger_fee_pct: 1.5, late_checkout_grace_minutes: 30, card_authorization_valid_days: 7, no_show_charge_policy: "FIRST_NIGHT_PLUS_TAX" }
              as: PropertyAdmin
              as_user_id: "u_admin_1"
              captures: { prop_id: "$.data.id" }
            - call: "POST /night-audit/outlets"
              payload: { property_id: "${prop_id}", outlet_code: "LOBBY", outlet_name: "Lobby Lounge", outlet_type: "FB_OUTLET", requires_shift_settlement: true }
              as: PropertyAdmin
              as_user_id: "u_admin_1"
              captures: { lounge_id: "$.data.id" }
            - call: "POST /night-audit/business-dates"
              payload: { property_id: "${prop_id}", business_date: "2026-08-01", out_of_order_room_count: 4 }
              as: NightAuditor
              as_user_id: "u_na_1"
              captures: { bd1_id: "$.data.id" }
            - call: "POST /night-audit/business-dates"
              payload: { property_id: "${prop_id}", business_date: "2026-08-02", out_of_order_room_count: 4 }
              as: NightAuditor
              as_user_id: "u_na_1"
              captures: { bd2_id: "$.data.id" }
            - call: "POST /night-audit/settlement-batches"
              payload: { business_date_id: "${bd2_id}", outlet_id: "${lounge_id}", tender_type: "CASH", shift_start_at: "2026-08-02T14:00:00.000Z", shift_end_at: "2026-08-02T22:00:00.000Z", declared_amount: 160.48 }
              as: OutletManager
              as_user_id: "${lounge_id}"
              captures: { batch_id: "$.data.id" }
            - call: "POST /night-audit/business-dates/${bd1_id}/post-room-and-tax"
              payload: {}
              as: NightAuditor
              as_user_id: "u_na_1"
            - call: "POST /night-audit/business-dates/${bd1_id}/seal-charges"
              payload: {}
              as: NightAuditor
              as_user_id: "u_na_1"
            - call: "POST /night-audit/business-dates/${bd2_id}/post-room-and-tax"
              payload: {}
              as: NightAuditor
              as_user_id: "u_na_1"
            - call: "POST /night-audit/business-dates/${bd2_id}/seal-charges"
              payload: {}
              as: NightAuditor
              as_user_id: "u_na_1"
          trigger: "POST /night-audit/business-dates/${bd1_id}/verify-settlements as NightAuditor (X-User-ID u_na_1), on the date where the mandatory outlet declared nothing."
          assert:
            - "HTTP 409 with data.error_id == \"ERR_SETTLEMENTS_UNRESOLVED\", and GET /night-audit/business-dates/${bd1_id} still reads status == \"CHARGES_SEALED\" at its pre-trigger version."
            - "POST /night-audit/business-dates/${bd2_id}/verify-settlements returns 200 - the existence clause is satisfied there - and the hop reconciles the batch to system_amount == 0.00 and variance_amount == -160.48 with status == \"VARIANCE_FLAGGED\", because no closed ticket falls in its window."
            - "GET /night-audit/business-dates/${bd2_id} then reads unresolved_settlement_batch_count == 1 and settlement_variance_total_amount == -160.48."
            - "POST /night-audit/business-dates/${bd2_id}/balance fails 409 ERR_SETTLEMENTS_UNRESOLVED: the second clause of the same rule could only be evaluated because verify-settlements had already computed the variance."
            - "POST /night-audit/settlement-batches/${batch_id}/accept-variance as RevenueManager (X-User-ID u_rm_1) returns 200 with status == \"ACCEPTED_WITH_VARIANCE\", ${bd2_id} then reads unresolved_settlement_batch_count == 0, and balance returns 200."
            - "POST /night-audit/outlets/${lounge_id}/suspend as PropertyAdmin returns 200 with status == \"SUSPENDED\", after which the original verify-settlements on ${bd1_id} returns 200 and moves it to SETTLEMENT_REVIEW - a suspended outlet is no longer a mandatory settler."

      - name: validation_priority_ordering_state_gate_before_money_gate
        claim_type: priority_ordering
        excluded_because:
          difficulty_instance: sealed_date_state_gate_outranks_authorization_shortfall_on_checkout
          rationale: "The clean two-rule ordering case in this scaffold is a check-out that violates both the sealed-date gate at priority 31 and the credit-card authorization shortfall at priority 91. The §1.8 instance sets both conditions up simultaneously, asserts the lower-numbered error wins, then removes the state violation and shows the money error surface from the identical request, which is the whole priority-ordering claim."

      - name: validation_priority_conflict_body_shape_before_state
        claim_type: priority_conflict
        excluded_because:
          difficulty_instance: body_existence_outranks_sealed_date_state_on_manual_posting
          rationale: "Violating a rule at priority P and another at P+N and demanding P's error is exactly what the §1.8 instance does with a manual posting that names a non-existent folio against a CHARGES_SEALED date: the body-FK 404 at priority 22 must beat the state 409 at priority 31, and the instance also probes the reverse pairing so the ordering cannot be satisfied by luck."

  - section: endpoints
    instances:

      - name: endpoint_action_endpoint_suspending_an_outlet_closes_it_to_new_traffic_only
        claim_type: action_endpoint
        grounds: ["endpoints[POST /night-audit/outlets/{id}/suspend]", "validations[priority=97]", "errors[ERR_OUTLET_SUSPENDED]", "validations[priority=82]"]
        distinguishing_aspect: "The action is declared to stop new tickets and new batches while leaving already-closed tickets and their revenue in place, and its second declared consequence is that the outlet stops being a mandatory settler for the day."
        test_recipe:
          setup: ["Standard property; one ACTIVE outlet with requires_shift_settlement true; business date 2026-08-01; one CLOSED CASH ticket of gross 128.00 on that outlet."]
          setup_api_calls:
            - call: "POST /night-audit/properties"
              payload: { name: "Harbor Grand", room_count_total: 100, standard_room_rate_amount: 200.00, occupancy_tax_rate_pct: 8.875, fb_tax_rate_pct: 6.25, service_charge_pct: 18.0, large_ticket_threshold_amount: 472.00, large_party_discount_pct: 5.0, allowance_manager_threshold_amount: 250.00, allowance_controller_threshold_amount: 1000.00, rate_variance_tolerance_pct: 95.0, settlement_variance_tolerance_amount: 5.00, city_ledger_fee_pct: 1.5, late_checkout_grace_minutes: 30, card_authorization_valid_days: 7, no_show_charge_policy: "FIRST_NIGHT_PLUS_TAX" }
              as: PropertyAdmin
              as_user_id: "u_admin_1"
              captures: { prop_id: "$.data.id" }
            - call: "POST /night-audit/outlets"
              payload: { property_id: "${prop_id}", outlet_code: "LOBBY", outlet_name: "Lobby Lounge", outlet_type: "FB_OUTLET", requires_shift_settlement: true }
              as: PropertyAdmin
              as_user_id: "u_admin_1"
              captures: { lounge_id: "$.data.id" }
            - call: "POST /night-audit/business-dates"
              payload: { property_id: "${prop_id}", business_date: "2026-08-01", out_of_order_room_count: 4 }
              as: NightAuditor
              as_user_id: "u_na_1"
              captures: { bd1_id: "$.data.id" }
            - call: "POST /night-audit/outlet-tickets"
              payload: { outlet_id: "${lounge_id}", business_date_id: "${bd1_id}", ticket_number: "T-SUS-1", gross_amount: 128.00, settlement_type: "CASH", opened_at: "2026-08-01T18:00:00.000Z" }
              as: OutletManager
              as_user_id: "${lounge_id}"
              captures: { ticket_id: "$.data.id" }
            - call: "POST /night-audit/outlet-tickets/${ticket_id}/close"
