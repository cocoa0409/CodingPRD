        distinguishing_aspect: "A depth-4 chain originating from the evidence-review transition: rejecting a critical evidence row makes the firm LIMITED, which throttles the firm's feeds, which (as the same §1.2 hop) suspends MODEL_MANAGEMENT, which forces the model out of ACTIVE — each hop is caused by the previous hop, not by the original reject."
