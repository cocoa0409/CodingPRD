  - section: errors
    instances:
      - name: err_round_not_open_covered
        claim_type: Violation → Error
        grounds: ["errors[ERR_ROUND_NOT_OPEN]"]
        excluded_because:
          difficulty_instance: "priority_pair_validation_conflict / closed_round_state_beats_eligibility_fiscal"
          rationale: "Asserted as the winning error of the state-vs-fiscal priority conflict."
      - name: err_bid_exceeds_eligibility_shadowed_arm_covered
        claim_type: Violation → Error
        grounds: ["errors[ERR_BID_EXCEEDS_ELIGIBILITY]"]
        excluded_because:
          difficulty_instance: "priority_pair_validation_conflict / closed_round_state_beats_eligibility_fiscal"
          rationale: "The eligibility arm is constructed (20,000,000 units demanded vs 12,500,000 eligible) and explicitly asserted NOT to fire; a standalone trigger adds no new claim."
      - name: err_incumbents_not_cleared_covered
        claim_type: Violation → Error
        grounds: ["errors[ERR_INCUMBENTS_NOT_CLEARED]"]
        excluded_because:
          difficulty_instance: "cross_entity_state_dependency / settlement_blocked_until_incumbents_cleared"
          rationale: "Asserted as the blocking arm of the License x Incumbent dependency."
      - name: err_applicant_invalid_state_on_bid_covered
        claim_type: Violation → Error
        grounds: ["errors[ERR_APPLICANT_INVALID_STATE]"]
        excluded_because:
          difficulty_instance: "cross_entity_state_dependency / bid_gated_on_applicant_qualified"
          rationale: "Asserted as the gate on bid placement by a non-QUALIFIED applicant."
      - name: err_lease_window_overlap_covered
        claim_type: Violation → Error
        grounds: ["errors[ERR_LEASE_WINDOW_OVERLAP]"]
        excluded_because:
          difficulty_instance: "resource_temporal_overlap / lease_windows_half_open_on_license"
          rationale: "Asserted on the intersecting third lease filing."
      - name: err_transition_window_conflict_covered
        claim_type: Violation → Error
        grounds: ["errors[ERR_TRANSITION_WINDOW_CONFLICT]"]
        excluded_because:
          difficulty_instance: "resource_temporal_overlap / incumbent_windows_buffer_gap_in_area"
          rationale: "Asserted on the 29-day-gap relocation window."

  - section: state_machines
    instances:
      - name: auction_pause_resume_covered
        claim_type: Valid Transition
        grounds: [state_machines.Auction.CLOCK_ACTIVE_to_CLOCK_PAUSED]
        excluded_because:
          difficulty_instance: "non_linear_state_machine / auction_pause_resume_cycle"
          rationale: "The cycle and its bid gate are asserted in the named §1.8 instance."
      - name: applicant_correction_loop_covered
        claim_type: Valid Transition
        grounds: [state_machines.Applicant.NEEDS_CORRECTION_to_UNDER_REVIEW]
        excluded_because:
          difficulty_instance: "non_linear_state_machine / applicant_correction_loop"
          rationale: "The correction cycle, including OCC versions, is asserted in the named §1.8 instance."
      - name: milestone_miss_cascade_covered
        claim_type: Side Effect Execution
        grounds: [state_machines.BuildoutMilestone.PENDING_to_MISSED]
        excluded_because:
          difficulty_instance: "transitive_cascade / final_milestone_miss_terminates_license_cascade"
          rationale: "The MISSED sweep, license termination, transfer denial, and supply restoration are all asserted there."

  - section: calculations
    instances:
      - name: activity_boundary_covered
        claim_type: Precision
        grounds: [calculations.activity_requirement]
        excluded_because:
          difficulty_instance: "boundary_precision_check / activity_requirement_exact_boundary"
          rationale: "The inclusive 800/1000 boundary and the reduction formula are asserted with literals."
      - name: unjust_enrichment_boundary_covered
        claim_type: Precision
        grounds: [calculations.unjust_enrichment_repayment]
        excluded_because:
          difficulty_instance: "boundary_precision_check / unjust_enrichment_day_1824_vs_1825"
          rationale: "Day 1824 vs 1825 schedule buckets are asserted with literals."
      - name: settlement_variants_covered
        claim_type: Correct Result
        grounds: [calculations.settlement_pricing]
        excluded_because:
          difficulty_instance: "dual_variant_calc / settlement_provisional_vs_final_net_price and combinatorial_formula / settlement_round_per_license_then_sum"
          rationale: "Variant divergence and the pinned rounding order are both asserted with literals."
      - name: relocation_share_variants_covered
        claim_type: Correct Result
        grounds: [calculations.relocation_cost_shares]
        excluded_because:
          difficulty_instance: "dual_variant_calc / relocation_share_proportional_vs_equal_split"
          rationale: "Both allocation variants plus the remainder rule are asserted with literals."

  - section: errors
    instances:
      - name: bid_over_eligibility_direct_trigger
        claim_type: Violation → Error
        grounds:
          - errors[ERR_BID_EXCEEDS_ELIGIBILITY]
          - calculations.bidding_eligibility
        distinguishing_aspect: "With the round OPEN and every higher-priority check satisfied, a bid whose 10,000,000 units exceed the bidder's 5,000,000-unit eligibility fails with ERR_BID_EXCEEDS_ELIGIBILITY — the fiscal tier's own trigger, unshadowed by any state failure."
        test_recipe:
          setup: ["CATEGORY_A@PEA001 supply 2 (units 10,000,000); bidder SMALL QUALIFIED with eligibility exactly 5,000,000 units (upfront 12,500,000,000); round 1 OPEN"]
          setup_api_calls:
            - *k_clock0
            - *k_plan
            - *k_area_x
            - *k_block_a
            - *k_publish
            - *k_auction
            - *k_open
            - call: "POST /spectrum-auctions/applicants"
              payload: { auction_id: "${auction_id}", legal_name: "Small Wallet", claims_small_business: false, claims_rural_credit: false, own_annual_revenue_cents: 0, service_population: 0, ownership_interests: [{ holder_name: "S", stake_pct: 100, holder_annual_revenue_cents: 0 }] }
              as: Bidder
              captures: { sm_id: "$.data.id" }
            - call: "POST /spectrum-auctions/applicants/${sm_id}/upfront-payments"
              payload: { amount_cents: 12500000000 }
              as: Bidder
              as_user_id: "${sm_id}"
            - call: "POST /spectrum-auctions/applicants/${sm_id}/review"
              payload: { action: "START_REVIEW" }
              as: AuctionAdmin
            - call: "POST /spectrum-auctions/applicants/${sm_id}/review"
              payload: { action: "QUALIFY" }
              as: AuctionAdmin
            - *k_clock_quiet
            - *k_begin_quiet
            - *k_start_clock
            - *k_get_rounds
          trigger:
            - call: "POST /spectrum-auctions/rounds/${r1_id}/bids"
              payload: { area_code: "PEA001", category: "CATEGORY_A", quantity: 1 }
              as: Bidder
              as_user_id: "${sm_id}"
              captures: { elig_err: "$.data.error_id" }
          assert:
            - "elig_err == ERR_BID_EXCEEDS_ELIGIBILITY with status 422 (10,000,000 units demanded > 5,000,000 eligible)"
            - "GET /spectrum-auctions/applicants/${sm_id}/bids returns an empty array"

      - name: transfer_filed_before_license_active_rejected
        claim_type: Violation → Error
        grounds:
          - errors[ERR_LICENSE_INVALID_STATE]
        distinguishing_aspect: "A transfer filed while the license is still PENDING_PAYMENT fails with ERR_LICENSE_INVALID_STATE — secondary-market activity requires an ACTIVE license, and nothing about the license mutates."
        test_recipe:
          setup: ["Rural R won CATEGORY_A@PEA002; assignment complete; license PENDING_PAYMENT; transferee T registered"]
          setup_api_calls:
            - *k_clock0
            - *k_plan
            - *k_area_y
            - *k_block_a
            - *k_publish
            - *k_auction
            - *k_open
            - *k_applicant_rural
            - *k_upfront_rural
            - *k_review_rural
            - *k_qualify_rural
            - *k_transferee_t
            - *k_clock_quiet
            - *k_begin_quiet
            - *k_start_clock
            - *k_get_rounds
            - *k_bid_rural
            - *k_close_r1
            - *k_assignbid_rural
            - *k_complete
            - *k_lic_rural
          trigger:
            - call: "POST /spectrum-auctions/licenses/${lic_id}/transfer-applications"
              payload: { transfer_type: "FULL_ASSIGNMENT", transferee_applicant_id: "${t_id}" }
              as: Bidder
              as_user_id: "${r_id}"
              captures: { ls_err: "$.data.error_id" }
          assert:
            - "ls_err == ERR_LICENSE_INVALID_STATE with status 409"
            - "GET /spectrum-auctions/licenses/${lic_id}/transfer-applications returns an empty array"
            - "License.${lic_id}.status == PENDING_PAYMENT still"

      - name: renewal_decide_twice_rejected_and_deny_terminates
        claim_type: Violation → Error
        grounds:
          - errors[ERR_RENEWAL_INVALID_STATE]
          - state_machines.RenewalApplication.UNDER_REVIEW_to_DENIED
        distinguishing_aspect: "After a DENY (which terminates the license and cascades), a second decide on the same terminal renewal application fails with ERR_RENEWAL_INVALID_STATE — terminal-state lockdown on the renewal machine."
        test_recipe:
          setup: ["Rural R's license ACTIVE (grant 2026-10-01) with BOTH milestones ACCEPTED (interim 500,000 of 40% and final 400,000 of 70% over the 500,000-pop area); renewal filed inside the window at 2035-10-01"]
          setup_api_calls:
            - *k_clock0
            - *k_plan
            - *k_area_y
            - *k_block_a
            - *k_publish
            - *k_auction
            - *k_open
            - *k_applicant_rural
            - *k_upfront_rural
            - *k_review_rural
            - *k_qualify_rural
            - *k_clock_quiet
            - *k_begin_quiet
            - *k_start_clock
            - *k_get_rounds
            - *k_bid_rural
            - *k_close_r1
            - *k_assignbid_rural
            - *k_complete
            - *k_lic_rural
            - *k_clock_grant
            - *k_pay_rural
            - call: "GET /spectrum-auctions/licenses/${lic_id}/buildout-milestones"
              payload: {}
              as: AuctionAdmin
              captures: { ms_int: "$.data[0].id", ms_int_v: "$.data[0].version", ms_fin: "$.data[1].id", ms_fin_v: "$.data[1].version" }
            - call: "POST /spectrum-auctions/buildout-milestones/${ms_int}/file-notice"
              payload: { covered_population: 500000, expected_milestone_version: "${ms_int_v}" }
              as: Bidder
              as_user_id: "${r_id}"
            - call: "POST /spectrum-auctions/buildout-milestones/${ms_int}/review"
              payload: { decision: "ACCEPT" }
              as: AuctionAdmin
            - call: "POST /spectrum-auctions/buildout-milestones/${ms_fin}/file-notice"
              payload: { covered_population: 400000, expected_milestone_version: "${ms_fin_v}" }
              as: Bidder
              as_user_id: "${r_id}"
            - call: "POST /spectrum-auctions/buildout-milestones/${ms_fin}/review"
              payload: { decision: "ACCEPT" }
              as: AuctionAdmin
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2035-10-01T00:00:00Z" }
              as: AuctionAdmin
            - call: "POST /spectrum-auctions/licenses/${lic_id}/renewal-applications"
              payload: {}
              as: Bidder
              as_user_id: "${r_id}"
              captures: { ren_id: "$.data.id" }
          trigger:
            - call: "POST /spectrum-auctions/renewal-applications/${ren_id}/decide"
              payload: { decision: "DENY" }
              as: TransferReviewer
            - call: "POST /spectrum-auctions/renewal-applications/${ren_id}/decide"
              payload: { decision: "GRANT" }
              as: TransferReviewer
              captures: { rd_err: "$.data.error_id" }
          assert:
            - "first decide succeeds: RenewalApplication.${ren_id}.status == DENIED"
            - "License.${lic_id}.status == TERMINATED (DENY cascade) and available_supply for (PEA002, CATEGORY_A) is back to 2"
            - "rd_err == ERR_RENEWAL_INVALID_STATE with status 409 (decide on a terminal application)"

  - section: rbac
    instances:
      - name: missing_auth_headers_returns_unauthenticated
        claim_type: RBAC
        grounds:
          - validations[priority=1]
          - errors[ERR_UNAUTHENTICATED]
        distinguishing_aspect: "A request with neither X-User-Role nor X-User-ID is refused 401 ERR_UNAUTHENTICATED before any role, existence, or state logic runs — priority 1 is the outermost gate."
        test_recipe:
          setup: ["Clock at default; empty database"]
          setup_api_calls:
            - *k_clock0
          trigger:
            - call: "POST /spectrum-auctions/band-plans"
              payload: { band_name: "Anon Band", frequency_start_mhz: 900, frequency_end_mhz: 960 }
              captures: { au_err: "$.data.error_id" }
          assert:
            - "au_err == ERR_UNAUTHENTICATED with status 401"
            - "no BandPlan persists (a subsequent admin GET list of the plan's areas is moot — the create never happened)"
