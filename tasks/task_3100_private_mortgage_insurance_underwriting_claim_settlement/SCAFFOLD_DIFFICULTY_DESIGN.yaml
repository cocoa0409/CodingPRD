  # ===========================================================================
  # Rule 8 — resource_temporal_overlap
  # Two overlap rules with DIFFERENT interval semantics on DIFFERENT resources.
  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:

      - name: reinsurance_treaty_occupation_is_half_open_at_the_upper_bound
        grounds:
          - calculations.reinsurance_cession_allocation
          - entities.ReinsuranceTreaty.fields.inception_utc
          - entities.ReinsuranceTreaty.fields.expiration_utc
          - errors[ERR_TREATY_NOT_IN_FORCE]
        distinguishing_aspect: "Half-open interval semantics on the treaty resource: a claim event at exactly inception is inside the treaty and a claim event at exactly expiration is outside it, so events one second apart across the expiry — with no buffer and no gap — land on opposite sides of the cession decision."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z; one treaty running from 2026-01-01T00:00:00Z inclusive to 2027-01-01T00:00:00Z exclusive, with retention 1000000 cents and a 5000000-cent capacity."
