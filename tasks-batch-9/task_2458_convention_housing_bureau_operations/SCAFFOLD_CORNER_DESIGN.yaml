          - entities.HotelBlock.fields.released_rooms_per_night
          - entities.SubBlock.fields.released_rooms
        distinguishing_aspect: "Releasing 2 of 6 uncommitted rooms is the APPROVED -> APPROVED self-transition: allotted_rooms falls to 4, SubBlock.released_rooms becomes 2, HotelBlock.released_rooms_per_night becomes 2, and approval_status stays APPROVED (it does not become RELEASED)."
