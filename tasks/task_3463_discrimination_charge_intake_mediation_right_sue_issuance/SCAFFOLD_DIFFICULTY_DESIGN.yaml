            - "after fail: conciliation FAILED and charge -> LITIGATION_REFERRED"
            - "identical RTS request now succeeds: issuance_basis == ELAPSED_180_DAYS, charge case_status == RTS_ISSUED"
  - rule_id: resource_temporal_overlap
    instances:
      - name: mediator_sessions_half_open_adjacency
        grounds:
          - entities.MediationSession.fields.status
          - errors[ERR_SESSION_OVERLAP]
          - validations[priority=8]
        distinguishing_aspect: |
          Interval semantics = half-open [start, end) on the mediator resource:
          back-to-back sessions (end == start) are ALLOWED while any interior
          intersection is rejected; the check is scoped per mediator_user_id, so
          the same overlapping slot is legal for a different mediator. The other
          overlap instance uses buffered intervals on a different resource.
        test_recipe:
          setup:
            - "ACTIVE mediation case on a charge (both parties accepted); clock parked at 2027-01-05 so all session times are future"
          setup_api_calls:
            - call: "POST /eeoc/employers"
              payload: { legal_name: "Session Co", state_code: "FL", employee_count_current: 40 }
              as: IntakeOfficer
              captures: { emp_m: $.data.id }
            - call: "POST /eeoc/complainants"
              payload: { full_name: "Pat Seventeen", email: "p17@x.com" }
              as: IntakeOfficer
              captures: { cp_17: $.data.id }
            - call: "POST /eeoc/charges"
              payload: { complainant_id: "${cp_17}", employer_id: "${emp_m}", basis_codes: ["COLOR"], incident_date: "2026-06-01", harm_description: "fired", employee_count_at_incident: 40 }
              as: IntakeOfficer
              captures: { chg_m: $.data.id }
            - call: "POST /eeoc/charges/${chg_m}/mediation-cases"
              as: IntakeOfficer
              captures: { med_m: $.data.id }
            - call: "POST /eeoc/mediation-cases/${med_m}/respond"
              payload: { response: "ACCEPTED" }
              as: ChargingParty
              as_user_id: "${cp_17}"
            - call: "POST /eeoc/mediation-cases/${med_m}/respond"
              payload: { response: "ACCEPTED" }
              as: RespondentRep
              as_user_id: "${emp_m}"
            - call: "POST /eeoc/_clock/set_current_utc"
              payload: { to_iso8601: "2027-01-05T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /eeoc/mediation-cases/${med_m}/sessions"
              payload: { scheduled_start: "2027-01-10T10:00:00Z", scheduled_end: "2027-01-10T11:00:00Z" }
              as: Mediator
              as_user_id: "med-001"
              captures: { ses_m1: $.data.id }
            - call: "POST /eeoc/mediation-cases/${med_m}/sessions"
              payload: { scheduled_start: "2027-01-10T11:00:00Z", scheduled_end: "2027-01-10T12:00:00Z" }
              as: Mediator
              as_user_id: "med-001"
              captures: { ses_m2: $.data.id }
            - call: "POST /eeoc/mediation-cases/${med_m}/sessions"
              payload: { scheduled_start: "2027-01-10T10:30:00Z", scheduled_end: "2027-01-10T11:30:00Z" }
              as: Mediator
              as_user_id: "med-001"
              captures: { ses_overlap_error: $.data.error_id }
            - call: "POST /eeoc/mediation-cases/${med_m}/sessions"
              payload: { scheduled_start: "2027-01-10T10:30:00Z", scheduled_end: "2027-01-10T11:30:00Z" }
              as: Mediator
              as_user_id: "med-002"
              captures: { ses_m3: $.data.id }
          assert:
            - "S1 10:00-11:00 and S2 11:00-12:00 both created for med-001 (half-open adjacency allowed)"
            - "S3 10:30-11:30 for med-001 rejected: ses_overlap_error == ERR_SESSION_OVERLAP"
            - "the identical 10:30-11:30 slot succeeds for med-002 (overlap is per-mediator, not global)"
      - name: investigator_interview_thirty_minute_buffer
        grounds:
          - entities.WitnessInterview.fields.investigator_user_id
          - errors[ERR_INTERVIEW_BUFFER_CONFLICT]
          - validations[priority=8]
        distinguishing_aspect: |
          Interval semantics = closed intervals plus a mandatory 30-minute buffer
          on the investigator resource — adjacency alone is NOT enough (a 20-minute
          gap fails; exactly 30 passes), and the buffer applies across the
          investigator's interviews on DIFFERENT cases, unlike the mediation
          session's per-mediator half-open adjacency rule.
        test_recipe:
          setup:
            - "two UNDER_INVESTIGATION charges, both assigned to investigator inv-007"
          setup_api_calls:
            - call: "POST /eeoc/employers"
              payload: { legal_name: "Buffer Co", state_code: "FL", employee_count_current: 40 }
              as: IntakeOfficer
