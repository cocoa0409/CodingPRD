      - name: minimum_certified_technicians_threshold_is_inclusive_at_two
        claim_type: Constants Applied
        grounds:
          - calculations.service_partner_claim_authority.constants.MIN_CERTIFIED_TECHS_PER_MODEL
          - validations[priority=43]
          - errors[ERR_INSUFFICIENT_CERTIFIED_TECHNICIANS]
        distinguishing_aspect: "One PASSED certification is enough to reach PROVISIONAL but not to be authorized: AUTHORIZE fails with ERR_INSUFFICIENT_CERTIFIED_TECHNICIANS (422) at one certification and succeeds at exactly two, since the >= MIN_CERTIFIED_TECHS_PER_MODEL comparison is inclusive."
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00Z; one ELECTRIC EquipmentModel; ServicePartner SP-1 (FULL stocking) with T1 graded PASSED and T2 still ENROLLED; the partner is already PROVISIONAL."
          setup_api_calls:
