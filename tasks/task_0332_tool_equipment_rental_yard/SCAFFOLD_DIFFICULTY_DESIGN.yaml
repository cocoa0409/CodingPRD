            - call: "POST /rental-yard/reservations/${r_id}/pickup"
              payload: {}
              as: RentalAgent
            - call: "GET /rental-yard/rental-agreements?reservation_id=${r_id}"
              payload: {}
              as: RentalAgent
              captures: { ag_id: "$.data[0].id" }
          trigger:
            - call: "POST /rental-yard/return-inspections"
              payload: { rental_agreement_id: "${ag_id}", return_fuel_level_liters: 40, cleanliness: "CLEAN", damage_assessed_cents: 0 }
              as: Inspector
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_INVALID_STATE"
        # ${ag_id}: ON_RENT agreement from r pickup via GET /rental-yard/rental-agreements?reservation_id=${r_id}.

  # =====================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: equipment_unit_overlap_closed_interval_adjacency_allowed
        grounds:
          - validations[priority=10]
          - entities.Reservation.fields.equipment_unit_id
          - entities.Reservation.fields.rental_start_date
          - entities.Reservation.fields.rental_end_date
        distinguishing_aspect: |
          EquipmentUnit interval semantics: rental intervals are CLOSED and inclusive
          (billed_days = end-start+1) and adjacency is NOT overlap — a second reservation
          starting 2026-06-10 (== first reservation's end) is ACCEPTED, while one starting
          2026-06-09 (inside the closed interval) is rejected ERR_UNIT_DOUBLE_BOOKED.
        test_recipe:
          setup:
            - "Unit eu has CONFIRMED reservation r1 over 2026-06-01..2026-06-10 inclusive."
          setup_api_calls:
            - call: "POST /rental-yard/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T08:00:00.000Z" }
              as: YardManager
            - call: "POST /rental-yard/rate-cards"
              payload: { name: "Std", daily_rate_cents: 4000, weekly_rate_cents: 20000, four_week_rate_cents: 60000, deposit_cents: 50000, damage_waiver_daily_cents: 1500, fuel_refill_cents_per_liter: 200, cleaning_fee_cents: 8000, late_fee_multiplier: 1.5 }
              as: YardManager
              captures: { rc_id: $.data.id }
            - call: "POST /rental-yard/catalog-items"
              payload: { rate_card_id: "${rc_id}", sku: "MX15", name: "Mini Excavator", category: "HEAVY_EQUIPMENT", requires_delivery: false, fuel_capacity_liters: 40 }
              as: YardManager
              captures: { ci_id: $.data.id }
            - call: "POST /rental-yard/equipment-units"
              payload: { catalog_item_id: "${ci_id}", asset_tag: "EU-1", service_due_at_days: 1000 }
              as: YardManager
              captures: { eu_id: $.data.id, eu_v: $.data.version }
            - call: "POST /rental-yard/contractor-accounts"
              payload: { company_name: "Acme", credit_limit_cents: 1000000 }
              as: YardManager
              captures: { acct_id: $.data.id }
            - call: "POST /rental-yard/reservations"
              payload: { contractor_account_id: "${acct_id}", catalog_item_id: "${ci_id}", equipment_unit_id: "${eu_id}", fulfillment_method: "PICKUP", rental_start_date: "2026-06-01", rental_end_date: "2026-06-10", damage_waiver_opted: false }
              as: RentalAgent
              captures: { r1_id: $.data.id, eu_v2: $.data.version }
          trigger:
            - call: "POST /rental-yard/reservations"
              payload: { contractor_account_id: "${acct_id}", catalog_item_id: "${ci_id}", equipment_unit_id: "${eu_id}", fulfillment_method: "PICKUP", rental_start_date: "2026-06-09", rental_end_date: "2026-06-15", damage_waiver_opted: false }
              as: RentalAgent
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_UNIT_DOUBLE_BOOKED"

      - name: delivery_truck_overlap_buffered_half_open_interval
        grounds:
          - validations[priority=16]
          - state_machines.Reservation.CONFIRMED_to_DISPATCHED_DELIVERY
          - entities.DeliveryTruck.fields.buffer_minutes
          - entities.Reservation.fields.delivery_window_start
        distinguishing_aspect: |
          DeliveryTruck interval semantics differ from EquipmentUnit: delivery windows are
          HALF-OPEN datetime intervals padded by buffer_minutes on each side, so a second
          window starting only 30 min after the first ends collides (within the 60-min buffer)
          even though the raw intervals do not overlap — a buffered geometry on a different
          resource entity.
        test_recipe:
          setup:
            - "Truck tk buffer 60 min. Two DELIVERY reservations rA, rB on distinct units, both 2026-06-01..2026-06-05. rA dispatched onto tk window 09:00-10:00Z 2026-06-01."
          setup_api_calls:
            - call: "POST /rental-yard/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T08:00:00.000Z" }
              as: YardManager
            - call: "POST /rental-yard/rate-cards"
              payload: { name: "Std", daily_rate_cents: 4000, weekly_rate_cents: 20000, four_week_rate_cents: 60000, deposit_cents: 50000, damage_waiver_daily_cents: 1500, fuel_refill_cents_per_liter: 200, cleaning_fee_cents: 8000, late_fee_multiplier: 1.5 }
              as: YardManager
              captures: { rc_id: $.data.id }
            - call: "POST /rental-yard/catalog-items"
              payload: { rate_card_id: "${rc_id}", sku: "MX15", name: "Mini Excavator", category: "HEAVY_EQUIPMENT", requires_delivery: true, fuel_capacity_liters: 40 }
              as: YardManager
              captures: { ci_id: $.data.id }
            - call: "POST /rental-yard/equipment-units"
              payload: { catalog_item_id: "${ci_id}", asset_tag: "EU-1", service_due_at_days: 1000 }
              as: YardManager
              captures: { eu1_id: $.data.id, eu1_v: $.data.version }
            - call: "POST /rental-yard/equipment-units"
              payload: { catalog_item_id: "${ci_id}", asset_tag: "EU-2", service_due_at_days: 1000 }
              as: YardManager
              captures: { eu2_id: $.data.id, eu2_v: $.data.version }
            - call: "POST /rental-yard/delivery-trucks"
              payload: { name: "Truck-1", buffer_minutes: 60 }
              as: YardManager
              captures: { tk_id: $.data.id }
            - call: "POST /rental-yard/contractor-accounts"
              payload: { company_name: "Acme", credit_limit_cents: 1000000 }
              as: YardManager
              captures: { acct_id: $.data.id }
            - call: "POST /rental-yard/reservations"
              payload: { contractor_account_id: "${acct_id}", catalog_item_id: "${ci_id}", equipment_unit_id: "${eu1_id}", fulfillment_method: "DELIVERY", rental_start_date: "2026-06-01", rental_end_date: "2026-06-05", damage_waiver_opted: false }
              as: RentalAgent
              captures: { rA_id: $.data.id }
            - call: "POST /rental-yard/reservations"
              payload: { contractor_account_id: "${acct_id}", catalog_item_id: "${ci_id}", equipment_unit_id: "${eu2_id}", fulfillment_method: "DELIVERY", rental_start_date: "2026-06-01", rental_end_date: "2026-06-05", damage_waiver_opted: false }
              as: RentalAgent
              captures: { rB_id: $.data.id }
            - call: "POST /rental-yard/reservations/${rA_id}/dispatch"
              payload: { delivery_truck_id: "${tk_id}", delivery_window_start: "2026-06-01T09:00:00.000Z", delivery_window_end: "2026-06-01T10:00:00.000Z" }
              as: RentalAgent
          trigger:
            - call: "POST /rental-yard/reservations/${rB_id}/dispatch"
              payload: { delivery_truck_id: "${tk_id}", delivery_window_start: "2026-06-01T10:30:00.000Z", delivery_window_end: "2026-06-01T11:30:00.000Z" }
              as: RentalAgent
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_TRUCK_DOUBLE_BOOKED"

  # =====================================================================
  - rule_id: compensating_invariant
    instances:
      - name: cancel_reverses_deposit_hold_account_balance_conserved
        grounds:
          - state_machines.Reservation.CONFIRMED_to_CANCELLED
          - entities.AccountLedgerEntry.fields.entry_type
          - calculations.account_outstanding_balance
          - entities.ContractorAccount.fields.outstanding_balance_cents
        distinguishing_aspect: |
          Conserved quantity = ContractorAccount.outstanding_balance_cents (sum of ledger
          amounts). Confirm posts DEPOSIT_HOLD (+50000); cancel posts the compensating
          DEPOSIT_REFUND (-50000); invariant: outstanding_balance_cents returns EXACTLY to its
          pre-confirm value of 0 (sum of the two lines == 0).
        test_recipe:
          setup:
            - "Account acct balance 0; unit eu AVAILABLE."
          setup_api_calls:
            - call: "POST /rental-yard/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T08:00:00.000Z" }
              as: YardManager
            - call: "POST /rental-yard/rate-cards"
              payload: { name: "Std", daily_rate_cents: 4000, weekly_rate_cents: 20000, four_week_rate_cents: 60000, deposit_cents: 50000, damage_waiver_daily_cents: 1500, fuel_refill_cents_per_liter: 200, cleaning_fee_cents: 8000, late_fee_multiplier: 1.5 }
              as: YardManager
              captures: { rc_id: $.data.id }
            - call: "POST /rental-yard/catalog-items"
              payload: { rate_card_id: "${rc_id}", sku: "MX15", name: "Mini Excavator", category: "HEAVY_EQUIPMENT", requires_delivery: false, fuel_capacity_liters: 40 }
              as: YardManager
              captures: { ci_id: $.data.id }
            - call: "POST /rental-yard/equipment-units"
              payload: { catalog_item_id: "${ci_id}", asset_tag: "EU-1", service_due_at_days: 1000 }
              as: YardManager
              captures: { eu_id: $.data.id, eu_v: $.data.version }
            - call: "POST /rental-yard/contractor-accounts"
              payload: { company_name: "Acme", credit_limit_cents: 1000000 }
              as: YardManager
              captures: { acct_id: $.data.id }
            - call: "POST /rental-yard/reservations"
              payload: { contractor_account_id: "${acct_id}", catalog_item_id: "${ci_id}", equipment_unit_id: "${eu_id}", fulfillment_method: "PICKUP", rental_start_date: "2026-06-01", rental_end_date: "2026-06-10", damage_waiver_opted: false }
              as: RentalAgent
              captures: { r_id: $.data.id }
          trigger:
            - call: "POST /rental-yard/reservations/${r_id}/cancel"
              payload: {}
              as: RentalAgent
          assert:
            - "ContractorAccount.${acct_id}.outstanding_balance_cents == 0"
            - "EquipmentUnit.${eu_id}.availability_state == AVAILABLE"

      - name: maintenance_resolve_restores_available_unit_count_conserved
        grounds:
          - state_machines.EquipmentUnit.AVAILABLE_to_OUT_OF_SERVICE
          - state_machines.EquipmentUnit.OUT_OF_SERVICE_to_AVAILABLE
          - state_machines.MaintenanceTicket.OPEN_to_RESOLVED
          - entities.RentalCatalogItem.fields.available_unit_count
        distinguishing_aspect: |
          A different conserved quantity = RentalCatalogItem.available_unit_count (count of
          AVAILABLE units). A manual maintenance pull decrements it from 1 to 0; resolving the
          ticket (the compensating action) restores it EXACTLY to 1 — a conserved count, not a
          monetary ledger.
        test_recipe:
          setup:
            - "Catalog item ci with a single unit eu AVAILABLE (available_unit_count 1)."
          setup_api_calls:
            - call: "POST /rental-yard/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T08:00:00.000Z" }
              as: YardManager
            - call: "POST /rental-yard/rate-cards"
              payload: { name: "Std", daily_rate_cents: 4000, weekly_rate_cents: 20000, four_week_rate_cents: 60000, deposit_cents: 50000, damage_waiver_daily_cents: 1500, fuel_refill_cents_per_liter: 200, cleaning_fee_cents: 8000, late_fee_multiplier: 1.5 }
              as: YardManager
              captures: { rc_id: $.data.id }
            - call: "POST /rental-yard/catalog-items"
              payload: { rate_card_id: "${rc_id}", sku: "MX15", name: "Mini Excavator", category: "HEAVY_EQUIPMENT", requires_delivery: false, fuel_capacity_liters: 40 }
              as: YardManager
              captures: { ci_id: $.data.id }
            - call: "POST /rental-yard/equipment-units"
              payload: { catalog_item_id: "${ci_id}", asset_tag: "EU-1", service_due_at_days: 1000 }
              as: YardManager
              captures: { eu_id: $.data.id }
            - call: "POST /rental-yard/maintenance-tickets"
              payload: { equipment_unit_id: "${eu_id}", reason: "SCHEDULED_SERVICE" }
              as: YardManager
              captures: { tk_id: $.data.id }
          trigger:
            - call: "POST /rental-yard/maintenance-tickets/${tk_id}/resolve"
              payload: {}
              as: YardManager
          assert:
            - "MaintenanceTicket.${tk_id}.ticket_state == RESOLVED"
            - "EquipmentUnit.${eu_id}.availability_state == AVAILABLE"
            - "RentalCatalogItem.${ci_id}.available_unit_count == 1"
