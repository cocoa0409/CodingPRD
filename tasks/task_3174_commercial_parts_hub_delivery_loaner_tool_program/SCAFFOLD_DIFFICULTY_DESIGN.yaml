- rule_id: resource_temporal_overlap
  instances:
  - name: account_delivery_window_half_open_overlap_detection
    grounds:
    - validations[priority=16]
    - entities.RouteStop.fields.delivery_window_start
    - entities.RouteStop.fields.delivery_window_end
    - calculations.stop_sequence_derivation
    distinguishing_aspect: 'Half-open interval semantics on the RouteStop resource: windows that

      merely touch at an endpoint do NOT collide, while any positive overlap

      does — the geometric treatment of adjacency is what distinguishes this

      rule from the sibling''s buffer-widened rule.

      '
    test_recipe:
      setup:
      - Satellite s_sat; two accounts A and A2 both homed there; a draft route R1 on 2026-09-02
      - Stop S1 covers account A on the window starting 14:00 and ending 15:00
      setup_api_calls:
      - call: POST /commercial/_clock/set_current_utc
        payload:
          to_iso8601: '2026-09-01T08:00:00Z'
        as: PlatformAdmin
      - call: POST /commercial/stores
        payload:
          store_code: S100
          name: Window Satellite
          store_type: SATELLITE
          delivery_radius_miles: 5.0
          cutoff_hour_local: 15
          cutoff_buffer_minutes: 30
          promise_time_minutes: 240
          daily_capacity_units: 500
        as: PartsCategoryManager
        captures:
          s_sat: $.data.id
      - call: POST /commercial/commercial-accounts
        payload:
          shop_name: Window Garage
          tax_id: TX-9992
          billing_address: 8 Window Ave
          home_store_id: ${s_sat}
          credit_limit_cents: 1000000
          credit_terms_days: 30
          delivery_service_level: SHOP_DELIVERY
        as: CommercialSalesRep
        captures:
          acct: $.data.id
      - call: POST /commercial/service-routes
        payload:
          route_code: R-W1
          service_date: '2026-09-02T00:00:00Z'
          driver_id: drv-win
          driver_type: AFFILIATE
          departure_at: '2026-09-02T13:00:00Z'
          shift_end_at: '2026-09-02T21:00:00Z'
        as: RouteDispatcher
        captures:
          r1: $.data.id
          r1_v: $.data.version
      - call: POST /commercial/service-routes/{routeId}/stops
        payload:
          account_id: ${acct}
          stop_kind: CUSTOMER
          delivery_window_start: '2026-09-02T14:00:00Z'
          delivery_window_end: '2026-09-02T15:00:00Z'
          travel_minutes_from_previous: 20
          drop_minutes: 10
          order_ids: []
          expected_route_version: ${r1_v}
        as: RouteDispatcher
        captures:
          st1: $.data.id
          r1_v2: $.data.version
      trigger:
      - call: POST /commercial/service-routes/${r1}/stops
        payload:
          account_id: ${acct}
          stop_kind: CUSTOMER
          delivery_window_start: '2026-09-02T15:00:00Z'
          delivery_window_end: '2026-09-02T16:00:00Z'
          travel_minutes_from_previous: 15
          drop_minutes: 5
          order_ids: []
          expected_route_version: ${r1_v2}
        as: RouteDispatcher
        captures:
          st_adj: $.data.id
          r1_v3: $.data.version
      - call: POST /commercial/service-routes/${r1}/stops
        payload:
          account_id: ${acct}
          stop_kind: CUSTOMER
          delivery_window_start: '2026-09-02T14:30:00Z'
          delivery_window_end: '2026-09-02T15:30:00Z'
          travel_minutes_from_previous: 15
          drop_minutes: 5
          order_ids: []
          expected_route_version: ${r1_v3}
        as: RouteDispatcher
        captures:
          err_overlap: $.data.error_id
      assert:
      - 'the window that only touches the existing one is accepted: RouteStop.${st_adj}.status == "PLANNED", because a shared endpoint is not an overlap under half-open semantics'
      - the genuinely overlapping window is rejected with ${err_overlap} == "ERR_STOP_WINDOW_OVERLAP"
      - after planning, the two accepted stops sequence as RouteStop.${st1}.stop_sequence == 1 and RouteStop.${st_adj}.stop_sequence == 2
      - RouteStop.${st_adj}.projected_arrival_at == "2026-09-02T14:10:00Z" and RouteStop.${st_adj}.lateness_minutes == 0
      - the rejected stop never appears on GET /commercial/service-routes/${r1}/stops
  - name: repcoverage_window_separation_buffer_required
    grounds:
    - validations[priority=17]
    - entities.RepCoverage.fields.effective_from
    - entities.RepCoverage.fields.effective_to
    - errors[ERR_COVERAGE_OVERLAP]
    distinguishing_aspect: 'A different resource and different interval arithmetic from the

      sibling: coverage windows on RepCoverage must be separated by a

      buffer, so even a one-second gap is rejected because the gap is

      smaller than the required buffer.

      '
    test_recipe:
      setup:
      - Satellite s_sat; rep R1 already covers account A for the window starting 2026-09-01T00:00:00Z and ending 2026-10-31T00:00:00Z
      setup_api_calls:
      - call: POST /commercial/_clock/set_current_utc
        payload:
          to_iso8601: '2026-09-01T08:00:00Z'
        as: PlatformAdmin
      - call: POST /commercial/stores
        payload:
          store_code: S100
          name: Buf Satellite
          store_type: SATELLITE
          delivery_radius_miles: 5.0
          cutoff_hour_local: 15
          cutoff_buffer_minutes: 30
          promise_time_minutes: 240
          daily_capacity_units: 500
        as: PartsCategoryManager
        captures:
          s_sat: $.data.id
      - call: POST /commercial/sales-reps
        payload:
          email: rep1@parts.example
          full_name: Rep One
          district_code: D-01
          home_store_id: ${s_sat}
        as: CommercialSalesRep
        captures:
          rep1: $.data.id
      - call: POST /commercial/commercial-accounts
        payload:
          shop_name: Buf Garage
          tax_id: TX-9993
          billing_address: 8 Buf Ave
          home_store_id: ${s_sat}
          credit_limit_cents: 1000000
          credit_terms_days: 30
          delivery_service_level: SHOP_DELIVERY
        as: CommercialSalesRep
        captures:
          acct: $.data.id
      - call: POST /commercial/rep-coverages
        payload:
          rep_id: ${rep1}
          account_id: ${acct}
          effective_from: '2026-09-01T00:00:00Z'
          effective_to: '2026-10-31T00:00:00Z'
        as: CommercialSalesRep
        captures:
          cov1: $.data.id
      trigger:
      - call: POST /commercial/rep-coverages
        payload:
          rep_id: ${rep1}
          account_id: ${acct}
          effective_from: '2026-10-31T00:00:01Z'
          effective_to: '2026-12-01T00:00:00Z'
        as: CommercialSalesRep
        captures:
          err_gap: $.data.error_id
      - call: POST /commercial/rep-coverages
        payload:
          rep_id: ${rep1}
          account_id: ${acct}
          effective_from: '2026-11-01T00:00:00Z'
          effective_to: '2026-12-01T00:00:00Z'
        as: CommercialSalesRep
      assert:
      - a window opening one second after the existing one closes is rejected with ${err_gap} == "ERR_COVERAGE_OVERLAP"
      - a window opening 24 hours after the existing one closes is accepted and RepCoverage.coverage_posture == "SCHEDULED"
      - the accepted window's effective_from == "2026-11-01T00:00:00Z", so the buffer rule is what rejected the first attempt rather than a date-format problem
      - only one RepCoverage row exists for the account after the two attempts
- rule_id: compensating_invariant
  instances:
  - name: loan_close_conserves_petty_cash_minus_deposit_liability
    grounds:
    - state_machines.ToolLoan.field.status.transitions.INSPECTED_to_CLOSED
    - state_machines.ToolLoan.field.status.transitions.REQUESTED_to_CHECKED_OUT
    - calculations.refundable_deposit_amount
    - entities.CommercialAccount.fields.deposit_liability_cents
    distinguishing_aspect: 'The conserved quantity is the store''s deposit position:

      CommercialAccount.petty_cash_cents minus CommercialAccount.deposit_liability_cents

      must be identical before checkout and after close.

      '
    test_recipe:
      setup:
      - Satellite s_sat; account A with the store's deposit position at zero
      - Loan L1 of a 1330-cent deposit is checked out and then returned as GOOD
      setup_api_calls:
      - call: POST /commercial/_clock/set_current_utc
