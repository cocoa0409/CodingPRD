      - name: allocation_budget_split_floors_each_share_and_leaves_a_residue
        claim_type: Precision
        grounds:
          - calculations.allocation_budget_split
          - entities.Campaign.fields.allocated_budget_cents
          - entities.Campaign.fields.unallocated_budget_cents
          - entities.Campaign.fields.planned_grp_total
        distinguishing_aspect: |
          Each share is floored independently - 33.33 percent of 100,000,001 cents is
          33,330,000 and 33.34 percent is 33,340,000 - so the three shares sum to
          100,000,000 and unallocated_budget_cents is exactly 1 cent even though the
          percentages sum to 100.00. Distributing the residue to the last line, or rounding
          instead of flooring, loses that 1 cent.
