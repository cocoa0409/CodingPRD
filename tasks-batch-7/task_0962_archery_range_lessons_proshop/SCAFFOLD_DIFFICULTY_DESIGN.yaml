  - rule_id: priority_pair_validation_conflict
    instances:
      - name: state_beats_fiscal_on_suspended_punch_purchase
        grounds:
          - validations[priority=5]
          - validations[priority=10]
          - errors[ERR_MEMBER_SUSPENDED]
          - errors[ERR_INSUFFICIENT_FUNDS]
        distinguishing_aspect: |
          Error-category pair state vs business_fiscal: the punch-card purchase violates both (member
          SUSPENDED; wallet 0 < price 5000) and MUST return ERR_MEMBER_SUSPENDED (409, priority 5),
          never ERR_INSUFFICIENT_FUNDS (402, priority 10).
        test_recipe:
          setup:
            - "member with wallet 0, suspended by three safety strikes (no future sessions, so no cascade side effects)"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T08:00:00Z" }, as: Admin }
            - call: "POST /members"
              payload: { email: "broke@x.com", full_name: "Broke Archer", date_of_birth: "1990-01-01" }
              as: Anonymous
              captures: { m_id: $.data.id }
            - { call: "POST /members/${m_id}/safety-strikes", payload: {}, as: RangeOfficer }
            - { call: "POST /members/${m_id}/safety-strikes", payload: {}, as: RangeOfficer }
            - { call: "POST /members/${m_id}/safety-strikes", payload: {}, as: RangeOfficer }
          trigger:
            - call: "POST /members/${m_id}/punch-cards"
              payload: { punches_total: 5 }
              as: Member
              as_user_id: "${m_id}"
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_MEMBER_SUSPENDED with http 409 (priority 5 state beats priority 10 fiscal)"
            - "no PunchCard created for member ${m_id}"
      - name: safety_beats_constraint_on_booking
        grounds:
          - validations[priority=6]
          - validations[priority=7]
          - errors[ERR_WAIVER_EXPIRED]
          - errors[ERR_LANE_OVERLAP]
        distinguishing_aspect: |
          Error-category pair business_safety vs business_constraint: the booking violates both (creator's
          waiver EXPIRED; requested window strictly overlaps an existing BOOKED session on the lane) and
          MUST return ERR_WAIVER_EXPIRED (422, priority 6), never ERR_LANE_OVERLAP (409, priority 7).
        test_recipe:
          setup:
            - "member m signed waiver at clock 2025-05-01 (valid_until 2026-05-01); member w signed at 2026-05-01 and holds lane L BOOKED 2026-05-02T10:00-11:00Z"
            - "clock advanced to 2026-05-02T08:00:00Z so the sweep flipped m's waiver to EXPIRED"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2025-05-01T00:00:00Z" }, as: Admin }
            - call: "POST /members"
              payload: { email: "exp@x.com", full_name: "Expired Waiver", date_of_birth: "1990-01-01" }
              as: Anonymous
              captures: { m_id: $.data.id }
            - { call: "POST /members/${m_id}/waivers", payload: {}, as: Member, as_user_id: "${m_id}" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: Admin }
            - call: "POST /members"
              payload: { email: "ok@x.com", full_name: "Okay Waiver", date_of_birth: "1991-01-01" }
              as: Anonymous
              captures: { w_id: $.data.id }
            - { call: "POST /members/${w_id}/waivers", payload: {}, as: Member, as_user_id: "${w_id}" }
            - call: "POST /lanes"
              payload: { name: "HL", lane_type: "INDOOR", max_archers: 4 }
              as: Admin
              captures: { lane_id: $.data.id }
            - call: "POST /range-sessions"
              payload: { lane_id: "${lane_id}", booking_type: "RESERVATION", start_at: "2026-05-02T10:00:00Z", end_at: "2026-05-02T11:00:00Z" }
              as: Member
              as_user_id: "${w_id}"
              captures: { s_id: $.data.id }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-02T08:00:00Z" }, as: Admin }
          trigger:
