  # ===========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: payout_ledger_conserved_across_accept_then_suspension_revocation
        grounds:
          - calculations.cleaner_payout_ledger
          - entities.Cleaner.fields.pending_payout_cents
          - state_machines.PayLine.PROVISIONAL_to_VOIDED
          - state_machines.Assignment.ACCEPTED_to_REVOKED
          - state_machines.Turnover.SCHEDULED_to_PENDING_ASSIGNMENT
          - endpoints["POST /cleaners/{id}/status"]
        distinguishing_aspect: |
          Conserved quantity: MONEY (Cleaner.pending_payout_cents, pinned to
          SUM of net_cents over PayLines in {PROVISIONAL, FINAL, ADJUSTED}). Accepting the offer
          raises the ledger 0 -> 12554 and suspending the cleaner returns it to exactly 0 while the
          VOIDED PayLine row is retained with net_cents 12554, so the compensation leaves no drift.
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00Z."
            - "Property P1 'AUS-101' (ZONE_A, TWO_BR, 2 bathrooms, 3 beds, min_clean_minutes 120, min_skill_level 2) with LIN-SHEET-Q (LINEN 260c par 6) and LIN-TOWEL-B (LINEN 180c par 8) -> PROVISIONAL linen_units 14."
            - "Cleaner C (home ZONE_A, skill 4, quality 92.00) exists with pending_payout_cents 0."
            - "T1 (SAME_DAY, window 270 min, required 198, slack 72, is_tight false) is in PENDING_ASSIGNMENT at version 1."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /properties"
