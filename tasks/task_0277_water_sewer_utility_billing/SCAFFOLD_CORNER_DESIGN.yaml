              payload: { name: "Res", fixed_water_charge_cents: 1200, fixed_sewer_charge_cents: 800, water_tiers: [{up_to_gallons: null, rate_cents_per_kgal: 500}], sewer_rate_cents_per_kgal: 600, sewer_ratio_pct: 90 }
              as: BillingClerk
              captures: { rs_id: $.data.id }
          trigger:
            - call: "POST /accounts"
              payload: { rate_schedule_id: "${rs_id}", holder_name: "A", service_address: "1 Main" }
              as: FieldOps
              captures: { err: $.data.error_id }
          assert:
            - "response.error_id == ERR_FORBIDDEN_ROLE"
            - "response.http_status == 403"

      - name: customer_cannot_approve_leak_adjustment
        claim_type: peer_roles
        grounds: [roles, "validations[priority=2]", "errors[ERR_FORBIDDEN_ROLE]"]
        distinguishing_aspect: "Customer calling POST /leak-adjustments/{id}/approve (AssistanceCaseworker-exclusive) returns ERR_FORBIDDEN_ROLE (403)."
        test_recipe:
          setup: ["A PENDING leak adjustment on a POSTED bill owned by the customer."]
          setup_api_calls:
            - call: "POST /rate-schedules"
              payload: { name: "Res", fixed_water_charge_cents: 1200, fixed_sewer_charge_cents: 800, water_tiers: [{up_to_gallons: null, rate_cents_per_kgal: 500}], sewer_rate_cents_per_kgal: 600, sewer_ratio_pct: 90 }
              as: BillingClerk
              captures: { rs_id: $.data.id }
            - call: "POST /accounts"
              payload: { rate_schedule_id: "${rs_id}", holder_name: "A", service_address: "1 Main" }
              as: BillingClerk
              captures: { acct_id: $.data.id }
            - call: "POST /accounts/${acct_id}/meters"
              payload: { meter_type: "POTABLE", serial: "P" }
              as: BillingClerk
              captures: { mp: $.data.id }
            - call: "POST /billing-cycles"
              payload: { label: "2026-01", period_start: "2026-01-01T00:00:00Z", period_end: "2026-02-01T00:00:00Z", due_date: "2026-02-15T00:00:00Z" }
              as: BillingClerk
              captures: { cyc: $.data.id }
            - call: "POST /meters/${mp}/reads"
              payload: { reading_gallons: 0, read_date: "2026-01-01T00:00:00Z" }
              as: BillingClerk
            - call: "POST /meters/${mp}/reads"
              payload: { reading_gallons: 12000, read_date: "2026-01-31T00:00:00Z" }
              as: BillingClerk
            - call: "POST /bills"
              payload: { account_id: "${acct_id}", billing_cycle_id: "${cyc}" }
              as: BillingClerk
              captures: { bill: $.data.id }
            - call: "POST /bills/${bill}/post"
              payload: {}
              as: BillingClerk
            - call: "POST /leak-adjustments"
              payload: { bill_id: "${bill}", baseline_gallons: 4000, repair_evidence_ref: "doc://r" }
              as: Customer
              as_user_id: "${acct_id}"
              captures: { la: $.data.id }
          trigger:
            - call: "POST /leak-adjustments/${la}/approve"
              payload: {}
              as: Customer
              as_user_id: "${acct_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response.error_id == ERR_FORBIDDEN_ROLE"
            - "response.http_status == 403"

      - name: missing_role_header_returns_401
        claim_type: peer_roles
        grounds: [roles, "validations[priority=1]", "errors[ERR_UNAUTHENTICATED]"]
        distinguishing_aspect: "A request with no/unknown X-User-Role to GET /accounts returns ERR_UNAUTHENTICATED (401)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "GET /accounts"
              payload: {}
              as: Anonymous
              captures: { err: $.data.error_id }
          assert:
            - "response.error_id == ERR_UNAUTHENTICATED"
            - "response.http_status == 401"

  # ===========================================================================
  - section: cross_cutting_complexity_layers
    instances:
      - name: budget_plan_stale_account_version_returns_412
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[budget-plan-create-stale-account]", "validations[priority=7]", "errors[ERR_STALE_ACCOUNT_VERSION]"]
        distinguishing_aspect: "Enrolling a second budget plan with expected_account_version equal to the pre-first-enrollment value (now stale, because the first enrollment bumped Account.version) returns ERR_STALE_ACCOUNT_VERSION (412)."
        test_recipe:
          setup: ["Account created (version 1 captured); one budget plan already enrolled (which bumped version to 2)."]
          setup_api_calls:
            - call: "POST /rate-schedules"
              payload: { name: "Res", fixed_water_charge_cents: 1200, fixed_sewer_charge_cents: 800, water_tiers: [{up_to_gallons: null, rate_cents_per_kgal: 500}], sewer_rate_cents_per_kgal: 600, sewer_ratio_pct: 90 }
              as: BillingClerk
              captures: { rs_id: $.data.id }
            - call: "POST /accounts"
              payload: { rate_schedule_id: "${rs_id}", holder_name: "A", service_address: "1 Main" }
              as: BillingClerk
              captures: { acct_id: $.data.id, v0: $.data.version }
            - call: "POST /accounts/${acct_id}/budget-billing-plans"
              payload: { monthly_amount_cents: 10000, expected_account_version: "${v0}" }
              as: BillingClerk
              captures: { plan1: $.data.id }
          trigger:
            - call: "POST /accounts/${acct_id}/budget-billing-plans"
              payload: { monthly_amount_cents: 12000, expected_account_version: "${v0}" }
              as: BillingClerk
              captures: { err: $.data.error_id }
          assert:
            - "response.error_id == ERR_STALE_ACCOUNT_VERSION"
            - "response.http_status == 412"

      - name: budget_plan_supersede_correct_version_succeeds
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[budget-plan-create-stale-account]", entities.BudgetBillingPlan.fields.status, entities.Account.fields.version]
        distinguishing_aspect: "Re-enrolling with the CURRENT account version (re-read after the first enrollment) succeeds (201), supersedes plan1 (-> CANCELLED), and bumps Account.version again."
        test_recipe:
          setup: ["Account with one ACTIVE budget plan; client re-reads the current Account.version."]
          setup_api_calls:
            - call: "POST /rate-schedules"
              payload: { name: "Res", fixed_water_charge_cents: 1200, fixed_sewer_charge_cents: 800, water_tiers: [{up_to_gallons: null, rate_cents_per_kgal: 500}], sewer_rate_cents_per_kgal: 600, sewer_ratio_pct: 90 }
              as: BillingClerk
              captures: { rs_id: $.data.id }
            - call: "POST /accounts"
              payload: { rate_schedule_id: "${rs_id}", holder_name: "A", service_address: "1 Main" }
              as: BillingClerk
              captures: { acct_id: $.data.id, v0: $.data.version }
            - call: "POST /accounts/${acct_id}/budget-billing-plans"
              payload: { monthly_amount_cents: 10000, expected_account_version: "${v0}" }
              as: BillingClerk
              captures: { plan1: $.data.id }
            - call: "GET /accounts/${acct_id}"
              payload: {}
              as: BillingClerk
              captures: { v1: $.data.version }
          trigger:
            - call: "POST /accounts/${acct_id}/budget-billing-plans"
              payload: { monthly_amount_cents: 12000, expected_account_version: "${v1}" }
              as: BillingClerk
              captures: { plan2: $.data.id }
          assert:
            - "BudgetBillingPlan.${plan2}.status == ACTIVE"
            - "BudgetBillingPlan.${plan1}.status == CANCELLED"
            - "Account.${acct_id}.budget_billing_enrolled == true"

      - name: reconnect_cascade_posts_fee_to_balance
        claim_type: cascading_side_effects
        grounds: [state_machines.ShutoffOrder.EXECUTED_to_RECONNECTED, entities.ShutoffOrder.fields.reconnect_fee_charged_cents, calculations.account_balance_reconciliation]
        excluded_because:
          difficulty_instance: non_linear_state_machine / shutoff_order_cyclic_schedule_execute_reconnect
          rationale: "Reconnect fee posting and service RESTORED are asserted in the named §1.8 cyclic-state-machine instance."

