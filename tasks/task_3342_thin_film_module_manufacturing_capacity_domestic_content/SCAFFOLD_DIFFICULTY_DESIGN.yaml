  # ---------------------------------------------------------------------------
  # Rule 4 — transitive_cascade (>=2 instances, different triggers; depths >=3 / >=2)
  # ---------------------------------------------------------------------------
  - rule_id: transitive_cascade
    instances:
      - name: lot_quarantine_recalls_delivery_three_hop
        grounds:
          - state_machines.ComponentLot.VERIFIED_to_QUARANTINED
          - state_machines.Delivery.SCHEDULED_to_RECALLED
          - entities.Delivery.fields.content_status
        distinguishing_aspect: |
          Depth-3 cascade originating from the quarantine transition: (hop 1)
          ComponentLot VERIFIED -> QUARANTINED mutates the lot; (hop 2) the lot
          mutation itself recalls every SCHEDULED/RESCHEDULED Delivery containing
          it (schedule_status RECALLED, content_status NON_QUALIFYING); (hop 3)
          the recall leaves the reservation ACTIVE but its confirm path blocked —
          a confirm attempt on the recalled delivery now fails with
          ERR_INVALID_STATE. Different trigger than the suspend cascade.
        test_recipe:
          setup:
            - "Customer C (TIER_A) with ACTIVE reservation R on line OH-L3"
            - "Delivery D SCHEDULED against R containing VERIFIED lot L (window 2027-03-01..2027-04-01)"
          setup_api_calls:
            - call: "POST /v1/customers"
              payload: { legal_name: "Acme Solar Dev", credit_tier: "TIER_A", tax_credit_flag: false }
              as: ContractsOfficer
              captures: { cust_id: $.data.id }
            - call: "POST /v1/module-series"
              payload: { series_code: "S6", technology: "CDTE_THIN_FILM", nominal_wattage: 480.0, bin_profile: [{ bin_code: "B1", wattage: 480.0, fraction: 0.5 }, { bin_code: "B2", wattage: 470.0, fraction: 0.5 }], temp_coefficient: -0.0028 }
              as: PlantManager
              captures: { series_id: $.data.id }
            - call: "POST /v1/production-lines"
              payload: { line_code: "OH-L3", site_country: "US", annual_capacity_mw: 100.0 }
              as: PlantManager
              captures: { line_id: $.data.id }
            - call: "POST /v1/production-runs"
              payload: { line_id: "${line_id}", series_id: "${series_id}", quarter: 0, input_modules: 100, good_modules: 70, bin_counts: [{ bin_code: "B1", count: 35 }, { bin_code: "B2", count: 35 }] }
              as: PlantManager
            - call: "POST /v1/production-lines/${line_id}/commission"
              payload: {}
              as: PlantManager
            - call: "GET /v1/production-lines/${line_id}"
              payload: {}
              as: PlantManager
              captures: { line_ver: $.data.version }
            - call: "POST /v1/capacity-reservations"
              payload: { customer_id: "${cust_id}", line_id: "${line_id}", series_id: "${series_id}", delivery_year: 2027, contracted_mw: 10.0, price_usd_per_w: 0.25, deposit_usd: 200000.0, term_years: 1, expected_line_version: "${line_ver}" }
              as: CustomerAdmin
              as_user_id: "${cust_id}"
              captures: { res_id: $.data.id }
            - call: "POST /v1/capacity-reservations/${res_id}/post-deposit"
              payload: {}
              as: CustomerAdmin
              as_user_id: "${cust_id}"
            - call: "POST /v1/capacity-reservations/${res_id}/activate"
              payload: {}
              as: ContractsOfficer
            - call: "POST /v1/component-lots"
              payload: { supplier_name: "GlassCo", lot_code: "LOT-US-1", component_type: "GLASS", country_of_origin: "US", lot_cost_usd: 400.0 }
              as: SupplyChainAuditor
              captures: { lot_id: $.data.id }
            - call: "POST /v1/component-lots/${lot_id}/verify"
              payload: {}
              as: SupplyChainAuditor
            - call: "POST /v1/deliveries"
              payload: { reservation_id: "${res_id}", scheduled_window_start: "2027-03-01T00:00:00Z", scheduled_window_end: "2027-04-01T00:00:00Z", volume_mw: 2.0, lot_ids: ["${lot_id}"] }
              as: CustomerAdmin
              as_user_id: "${cust_id}"
              captures: { del_id: $.data.id }
          trigger:
            - call: "POST /v1/component-lots/${lot_id}/quarantine"
              payload: {}
              as: SupplyChainAuditor
            - call: "POST /v1/deliveries/${del_id}/confirm"
              payload: {}
              as: LogisticsCoordinator
          assert:
            - "ComponentLot.${lot_id}.status == QUARANTINED"
            - "Delivery.${del_id}.schedule_status == RECALLED (cascade hop 2 from the lot mutation)"
            - "Delivery.${del_id}.content_status == NON_QUALIFYING"
            - "CapacityReservation.${res_id}.status == ACTIVE (hop 3: reservation itself is NOT transitioned)"
            - "confirm on recalled delivery: response.http_status == 409"
            - "confirm on recalled delivery: response.error_id == ERR_INVALID_STATE"

      - name: line_suspend_constrains_reservation_blocks_delivery
        grounds:
          - state_machines.ProductionLine.RAMPING_to_SUSPENDED
          - state_machines.CapacityReservation.ACTIVE_to_CONSTRAINED
          - state_machines.CapacityReservation.CONSTRAINED_to_ACTIVE
          - state_machines.ProductionLine.SUSPENDED_to_RAMPING
        distinguishing_aspect: |
          Depth-2 mutation cascade with a third-order behavioral gate, from a
          DIFFERENT trigger (production-line suspend, not lot quarantine):
          (hop 1) ProductionLine RAMPING -> SUSPENDED; (hop 2) the line mutation
          itself forces every ACTIVE CapacityReservation on the line to
          CONSTRAINED; the CONSTRAINED state then gates new delivery scheduling
          with ERR_RESERVATION_CONSTRAINED; resume compensates hop 2 exactly
          (CONSTRAINED -> ACTIVE).
        test_recipe:
          setup:
            - "Customer C (TIER_A) with ACTIVE reservation R on RAMPING line OH-L3"
            - "VERIFIED lot L available for delivery scheduling"
          setup_api_calls:
            - call: "POST /v1/customers"
              payload: { legal_name: "Acme Solar Dev", credit_tier: "TIER_A", tax_credit_flag: false }
