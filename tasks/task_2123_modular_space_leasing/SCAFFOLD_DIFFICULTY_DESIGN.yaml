          setup:
            - "One branch holding two units, both IN_FLEET at creation."
            - "Permit-free, ADA-free TX-RUR jurisdiction and a PUBLISHED 20x48 configuration."
            - "Lease on unit A activated (billing ACCRUING) with a DISPATCHED DELIVERY_INSTALL job, so unit A is IN_TRANSIT and the yard holds 1."
