          assert:
            - "HTTP 200; DealerAudit.${audit_zf_id}.status == FINDINGS_ISSUED"
            - "DealerAudit.${audit_zf_id}.sample_paid_snapshot_cents == 0 and population_paid_snapshot_cents == 50000"
            - "DealerAudit.${audit_zf_id}.error_rate == 0.0000 (guarded zero-denominator branch, not an error)"
            - "DealerAudit.${audit_zf_id}.extrapolation_factor == 0.00 (0.0 < 0.05, so NOT the 0.50 half tier)"
            - "DealerAudit.${audit_zf_id}.sample_chargeback_cents == 0, extrapolated_chargeback_cents == 0 and total_chargeback_cents == 0"
            - "GET /warranty/dealers/${dzf_id}/ledger-entries returns 0 items"
            - "Dealer.${dzf_id}.chargeback_balance_cents == 0 and status == ACTIVE"
            - "WarrantyClaim.${cl_zf_id}.payment_status is still PAID and debited_amount_cents == 0"

      - name: statutory_ceiling_inclusive_boundary_17600_versus_17601
        grounds:
          - calculations.labor_rate_statutory_ceiling
          - validations.priority_80.ERR_LABOR_RATE_ABOVE_STATUTORY_CEILING
          - entities.LaborRateRequest.fields.statutory_ceiling_cents
        distinguishing_aspect: |
          The approval gate at priority 80 is INCLUSIVE against a ceiling that is itself the output
          of a nested min/max, so the accept/reject edge sits at a value no input literal contains:
          17600 is accepted and 17601 is rejected for two dealers whose stored rate is identically
          13750. The one-cent step also proves the ceiling is not silently re-derived from the
          requested amount.
        test_recipe:
          setup:
            - "Clock 2026-05-01T00:00:00Z; CA profile (RETAIL_SAMPLE, min_sample_repair_orders 5, max_labor_rate_cents 19500, markup_cap_pct 0.30)."
            - "Two dealers D_E1 and D_E2, both at approved_labor_rate_cents 13750 and markup 0.30."
            - "Both requests carry sample_repair_order_count 5 and sample_median_rate_cents 17600, so the computed ceiling is 17600 for both."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-05-01T00:00:00Z" }
              as: WarrantyAdmin
              as_user_id: "wa-user-1"
            - call: "POST /warranty/state-law-profiles"
              payload: { state_code: "CA", markup_cap_pct: 0.30, labor_rate_method: "RETAIL_SAMPLE", min_sample_repair_orders: 5, max_labor_rate_cents: 19500, deemed_approved_days: 30, appeal_window_days: 30 }
              as: WarrantyAdmin
              as_user_id: "wa-user-1"
              captures: { slp_ca_id: $.data.id }
            - call: "POST /warranty/dealers"
              payload: { dealer_code: "D-E1", name: "Edge Dealer One", state_law_profile_id: "${slp_ca_id}", vehicles_in_operation: 60, initial_labor_rate_cents: 13750, initial_parts_markup_pct: 0.30 }
              as: WarrantyAdmin
              as_user_id: "wa-user-1"
              captures: { de1_id: $.data.id, de1_version: $.data.version }
            - call: "POST /warranty/dealers"
              payload: { dealer_code: "D-E2", name: "Edge Dealer Two", state_law_profile_id: "${slp_ca_id}", vehicles_in_operation: 60, initial_labor_rate_cents: 13750, initial_parts_markup_pct: 0.30 }
              as: WarrantyAdmin
              as_user_id: "wa-user-1"
              captures: { de2_id: $.data.id, de2_version: $.data.version }
          trigger:
            - call: "POST /warranty/labor-rate-requests"
              payload: { dealer_id: "${de1_id}", requested_labor_rate_cents: 17600, requested_parts_markup_pct: 0.30, sample_repair_order_count: 5, sample_median_rate_cents: 17600, effective_date: "2026-06-01", expected_dealer_version: "${de1_version}" }
              as: DealerWarrantyAdmin
              as_user_id: "${de1_id}"
              captures: { lrr_edge_id: $.data.id }
            - call: "POST /warranty/labor-rate-requests"
              payload: { dealer_id: "${de2_id}", requested_labor_rate_cents: 17601, requested_parts_markup_pct: 0.30, sample_repair_order_count: 5, sample_median_rate_cents: 17600, effective_date: "2026-06-01", expected_dealer_version: "${de2_version}" }
              as: DealerWarrantyAdmin
              as_user_id: "${de2_id}"
          assert:
            - "at the ceiling: HTTP 201, LaborRateRequest.${lrr_edge_id}.statutory_ceiling_cents == 17600, requested_labor_rate_cents == 17600, status == SUBMITTED"
            - "one cent over: HTTP 422 with error_id == ERR_LABOR_RATE_ABOVE_STATUTORY_CEILING"
            - "no LaborRateRequest row exists for D_E2: GET /warranty/labor-rate-requests?dealer_id=${de2_id} returns 0 items"
            - "Dealer.${de1_id}.approved_labor_rate_cents is still 13750 (creation alone never moves the dealer's rate) and its version is unchanged"

      - name: goodwill_manager_limit_inclusive_boundary_48000_versus_48001
        grounds:
          - calculations.goodwill_authorization_limit
          - validations.priority_85.ERR_GOODWILL_LIMIT_EXCEEDED
          - entities.GoodwillAuthorization.fields.manager_limit_cents
          - entities.GoodwillAuthorization.fields.status
        distinguishing_aspect: |
          The manager limit is not an input constant: it is min(round_half_up(250000 * decay),
          round_half_up(provisional_total * 0.80)) where decay comes from a 4-place margin, so the
          accept/reject edge lands on 48000 - the share cap, not the 200000 decayed base. One cent
          over that derived value is rejected outright with no row created, while 48000 exactly is
          accepted AND routed to ESCALATED rather than PENDING because it is simultaneously above
          the 40000 adjudicator limit.
        test_recipe:
          setup:
            - "The segregation_of_duties_outranks_goodwill_state_gate fixture up to and including the creation of claim CL_GW: clock 2026-05-20, dealer D_GW at 10000/0.25, vehicle VEH_GW (warranty_start 2023-06-15, basic 36/36000), labor op GW-200, part GW-P1 at 40000."
            - "CL_GW is SUSPENDED with coverage_type NONE and provisional_total_cents 60000, giving margin 0.1000, decay 0.8, share cap 48000, adjudicator limit 40000 and manager limit 48000."
            - "No goodwill authorization exists yet on the claim."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-05-20T00:00:00Z" }
              as: WarrantyAdmin
              as_user_id: "wa-user-1"
            - call: "POST /warranty/state-law-profiles"
              payload: { state_code: "CA", markup_cap_pct: 0.30, labor_rate_method: "RETAIL_SAMPLE", min_sample_repair_orders: 5, max_labor_rate_cents: 19500, deemed_approved_days: 30, appeal_window_days: 30 }
              as: WarrantyAdmin
              as_user_id: "wa-user-1"
              captures: { slp_ca_id: $.data.id }
            - call: "POST /warranty/dealers"
              payload: { dealer_code: "D-GW", name: "Goodwill Dealer", state_law_profile_id: "${slp_ca_id}", vehicles_in_operation: 100, initial_labor_rate_cents: 10000, initial_parts_markup_pct: 0.25 }
              as: WarrantyAdmin
              as_user_id: "wa-user-1"
              captures: { dgw_id: $.data.id }
            - call: "POST /warranty/vehicles"
              payload: { vin: "VING0000000000001", model_year: 2023, warranty_start_date: "2023-06-15", in_service_odometer: 0, basic_months: 36, basic_miles: 36000, powertrain_months: 60, powertrain_miles: 60000 }
              as: WarrantyAdmin
              as_user_id: "wa-user-1"
              captures: { vehgw_id: $.data.id }
            - call: "POST /warranty/labor-operations"
              payload: { op_code: "GW-200", description: "Cabin blower motor replacement", standard_time_hours: 1.0, max_time_hours: 1.5, category: "BASIC", requires_causal_part: true, causal_failure_group: "HVAC", overlap_group: "HVAC" }
              as: WarrantyAdmin
              as_user_id: "wa-user-1"
              captures: { lo_gw_id: $.data.id }
            - call: "POST /warranty/parts"
              payload: { part_number: "GW-P1", description: "Cabin blower motor", dealer_net_cents: 40000, failure_group: "HVAC", return_required: false, retention_days: 0 }
              as: WarrantyAdmin
              as_user_id: "wa-user-1"
              captures: { part_gw_id: $.data.id }
            - call: "POST /warranty/claims"
              payload: { dealer_id: "${dgw_id}", vehicle_id: "${vehgw_id}", labor_operation_id: "${lo_gw_id}", causal_part_id: "${part_gw_id}", repair_order_number: "RO-GW-1", repair_date: "2026-05-14", odometer_at_repair: 39600, claimed_labor_hours: 1.0, claimed_parts_qty: 1, complaint_text: "Customer reports no airflow from the cabin vents.", cause_text: "Cabin blower motor seized in the housing.", correction_text: "Replaced the cabin blower motor and verified airflow." }
              as: DealerWarrantyAdmin
              as_user_id: "${dgw_id}"
              captures: { cl_gw_id: $.data.id, cl_gw_version: $.data.version }
          trigger:
            - call: "POST /warranty/claims/${cl_gw_id}/goodwill-authorizations"
              payload: { requested_amount_cents: 48001, policy_adjustment_pct: 0.25, justification: "One cent above the derived manager limit.", expected_claim_version: "${cl_gw_version}" }
              as: ClaimAdjudicator
              as_user_id: "adj-user-1"
            - call: "POST /warranty/claims/${cl_gw_id}/goodwill-authorizations"
              payload: { requested_amount_cents: 48000, policy_adjustment_pct: 0.25, justification: "Exactly at the derived manager limit.", expected_claim_version: "${cl_gw_version}" }
              as: ClaimAdjudicator
              as_user_id: "adj-user-1"
              captures: { ga_edge_id: $.data.id }
          assert:
            - "one cent over: HTTP 422 with error_id == ERR_GOODWILL_LIMIT_EXCEEDED, and GET /warranty/goodwill-authorizations?claim_id=${cl_gw_id} returns 0 items immediately afterwards"
            - "the rejected attempt did not bump WarrantyClaim.${cl_gw_id}.version, which is why the second call may reuse the same expected_claim_version"
            - "at the limit: HTTP 201 with GoodwillAuthorization.${ga_edge_id}.status == ESCALATED (above adjudicator_limit_cents 40000, at manager_limit_cents 48000), NOT PENDING"
            - "GoodwillAuthorization.${ga_edge_id}.out_of_warranty_margin_pct == 0.1000, adjudicator_limit_cents == 40000, manager_limit_cents == 48000, approved_amount_cents == null"
            - "WarrantyClaim.${cl_gw_id}.status is still SUSPENDED and coverage_type still NONE (creation alone grants nothing)"

  # =====================================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: claim_payment_blocked_by_dealer_audit_hold_from_a_third_entity
        grounds:
          - validations.priority_47.ERR_DEALER_UNDER_AUDIT_HOLD
          - entities.Dealer.fields.audit_hold
          - state_machines.DealerAudit.status.SCHEDULED_to_IN_FIELD
          - state_machines.WarrantyClaim.payment_status.UNPAID_to_PAID
          - endpoints.POST_/warranty/audits/{id}/close
        distinguishing_aspect: |
          Whether an APPROVED claim can be paid depends on the state of a DealerAudit that the
          claim does not reference and that does not reference the claim - the dependency runs
          claim -> Dealer.audit_hold -> some audit of that dealer being IN_FIELD or FINDINGS_ISSUED
          or APPEALED. The same pay request therefore fails and then succeeds with no change to the
          claim itself, and the hold is released only by CLOSING the audit, not by issuing its
          findings.
        test_recipe:
          setup:
            - "Clock 2026-05-01T00:00:00Z; CA profile; dealer D_H at rate 10000 / markup 0.25."
            - "One vehicle, labor op AUD-100 and part AUD-P1; claim CL_H at repair_date 2026-02-15 approved at 50000 and left UNPAID."
            - "Audit A_H over [2026-01-01, 2026-07-01) with sample_size 1, then STARTED, which sets Dealer.audit_hold true. No findings are attached."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-05-01T00:00:00Z" }
              as: WarrantyAdmin
              as_user_id: "wa-user-1"
            - call: "POST /warranty/state-law-profiles"
              payload: { state_code: "CA", markup_cap_pct: 0.30, labor_rate_method: "RETAIL_SAMPLE", min_sample_repair_orders: 5, max_labor_rate_cents: 19500, deemed_approved_days: 30, appeal_window_days: 30 }
              as: WarrantyAdmin
              as_user_id: "wa-user-1"
