scenario: "2375. Grocery Fuel Points & Cross-Banner Loyalty Redemption (Kroger Fuel Points): point accrual rules by purchase category with gift-card and pharmacy multipliers, point expiration at month boundaries and rollover restrictions, redemption at owned fuel centers versus partner stations with per-gallon caps, household account linkage and alternate ID lookup at the pump, promotional multiplier events and stacking limits, partner settlement for discounted gallons, fraud detection on point transfer and card sharing, points balance disputes and manual adjustment authority"
domain_name: grocery-fuel-points-cross-banner-loyalty
api_prefix: ""   # flat topology: peer top-level collections, no single owning resource path

complexity_profile:
  difficulty_level: beyond_expert   # deliberately above the Expert band of §0.4: 13 entities, 60 endpoints, 53 error codes, 10 calculations (2 dual-variant), 9 state machines
  primary_archetype: ledger_reconciliation
  secondary_archetype: pricing_engine
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers

  entity_topology: flat
  # Peer top-level collections joined by explicit FK fields. Only three GETs are
  # nested (`/banners/{id}/promo-events`, `/banners/{id}/households`,
  # `/households/{id}/fraud-signals`) and they exist purely as FK
  # reverse-reachability channels, not as an ownership hierarchy: no mutation
  # path is nested, and no entity is addressed through a parent.

  state_machine_shape: parallel
  # PurchaseTransaction carries (posting_status x accrual_status) and
  # FuelRedemption carries (authorization_status x settlement_status) as
  # independent axes on the same row. Layered on top: HouseholdLink and
  # Household are cyclic (ACTIVE -> SUSPENDED/FROZEN -> ACTIVE), SettlementBatch
  # is branching (SUBMITTED -> {APPROVED, REJECTED}) with divergent side-effect
  # sets per branch, and PointCycle is a two-phase ops-run epoch.

  relationship_patterns:
    - one_to_many          # Banner -> Site / Member / Household / PointCycle / PromoEvent
    - many_to_many         # HouseholdLink joins Member <-> Household, including across banners
    - self_referential     # PointDispute.supersedes_dispute_id -> PointDispute.id
    - polymorphic          # PointLedgerEntry.source_kind + source_ref_id address five different origin types
    - cross_aggregate      # FuelRedemption reaches Household/HouseholdLink for cross-banner eligibility

  role_model: segregation_of_duties
  # LoyaltyAnalyst proposes point adjustments but can never approve one;
  # LoyaltySupervisor/ProgramAdmin approve but only when the acting X-User-ID
  # differs from the proposer's. SettlementClerk submits settlement batches;
  # ProgramAdmin approves, again only when the acting id differs from the
  # submitter's.

  consistency_model: immediate

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# ---------------------------------------------------------------------------
# §1.1 Entity-Relationship Table
# ---------------------------------------------------------------------------
entities:

  - name: Banner
    parent: null
    common_fields: true
    # Configuration entity. Every accrual, expiry, redemption and fraud rule in
    # this scaffold reads its parameters from here, so two Banners configured
    # differently produce different observable results from identical activity.
    fields:
      - name: banner_code
        type: string
        source: input
        description: Short retail banner code, globally unique
        constraints: "3..8 chars, uppercase A-Z0-9, globally unique"
      - name: name
        type: string
        source: input
        description: Display name of the grocery banner
        constraints: "1..120 chars"
      - name: status
        type: enum
        source: input
        description: Whether the banner's loyalty program accepts new activity
        default: ACTIVE
        constraints: "ACTIVE | SUSPENDED"
      - name: base_points_per_dollar
        type: integer
        source: input
        description: Points earned per whole dollar of eligible line amount before multipliers
        default: 1
        constraints: ">= 1, <= 10"
      - name: gift_card_multiplier
        type: integer
        source: input
        description: Category multiplier applied to GIFT_CARD lines
        default: 4
        constraints: ">= 1, <= 10"
      - name: pharmacy_multiplier
        type: integer
        source: input
        description: Category multiplier applied to PHARMACY lines
        default: 2
        constraints: ">= 1, <= 10"
      - name: pharmacy_points_per_script
        type: integer
        source: input
        description: Flat pre-multiplier point base per PHARMACY script (line.quantity), replacing the dollar base for that category
        default: 50
        constraints: ">= 0, <= 500"
      - name: max_stacked_multiplier
        type: integer
        source: input
        description: Hard ceiling on the product of category multiplier and stacked promotional multipliers for a single line
        default: 8
        constraints: ">= 1, <= 50"
      - name: max_stack_count
        type: integer
        source: input
        description: Maximum number of PromoEvents whose multipliers may be multiplied together on one line
        default: 2
        constraints: ">= 1, <= 5"
      - name: points_per_discount_block
        type: integer
        source: input
        description: Points consumed per discount block at the pump
        default: 100
        constraints: ">= 1"
      - name: cents_off_per_block
        type: integer
        source: input
        description: Cents off per gallon granted by one discount block
        default: 10
        constraints: ">= 1"
      - name: max_cents_off_per_gallon
        type: integer
        source: input
        description: Per-gallon discount ceiling at OWNED_FUEL_CENTER sites of this banner
        default: 100
        constraints: ">= cents_off_per_block, multiple of cents_off_per_block"
      - name: owned_max_gallons_per_redemption
        type: integer
        source: input
        description: Gallons authorized per redemption at OWNED_FUEL_CENTER sites of this banner
        default: 35
        constraints: ">= 1, <= 1000"
      - name: min_points_per_redemption
        type: integer
        source: input
        description: Minimum points_committed accepted at the pump
        default: 100
        constraints: ">= points_per_discount_block"
      - name: rollover_cap_points
        type: integer
        source: input
        description: Maximum unconsumed expiring points that may roll into the next cycle per member per close
        default: 500
        constraints: ">= 0"
      - name: max_transfers_per_cycle
        type: integer
        source: input
        description: Maximum completed point transfers per household per PointCycle
        default: 3
        constraints: ">= 0, <= 50"
      - name: expiry_basis
        type: enum
        source: input
        description: Selects which lot-consumption ordering the expiry sweep replays; drives the dual-variant divergence of calculations.point_expiry_sweep
        default: LOT_FIFO
        constraints: "LOT_FIFO | CYCLE_SCOPED"
      - name: fraud_scoring_mode
        type: enum
        source: input
        description: Selects which variant of calculations.household_fraud_score is authoritative for this banner's households
        default: INSTANTANEOUS
        constraints: "INSTANTANEOUS | TRAILING_WEIGHTED"
      - name: freeze_threshold_score
        type: integer
        source: input
        description: Household.fraud_score value at or above which a household auto-freezes
        default: 60
        constraints: ">= 1, <= 1000"

  - name: Site
    parent: null
    common_fields: true
    # Configuration + settlement counterparty. A PARTNER_STATION site is the
    # settlement counterparty for its own discounted gallons, so its `version`
    # is the OCC anchor for settlement batch creation.
    fields:
      - name: banner_id
        type: string
        source: input
        description: "FK -> Banner.id; the banner that operates or contracts this site"
      - name: site_number
        type: string
        source: input
        description: Operator-facing site number, unique within the banner
        constraints: "1..16 chars, unique per (banner_id, site_number)"
      - name: site_type
        type: enum
        source: input
        description: Which operations this site accepts
        constraints: "GROCERY | OWNED_FUEL_CENTER | PARTNER_STATION"
      - name: status
        type: enum
        source: input
        description: Whether the site accepts new purchases, redemptions and batches
        default: ACTIVE
        constraints: "ACTIVE | SUSPENDED"
      - name: partner_code
        type: string
        source: input
        description: Settlement counterparty code; required when site_type == PARTNER_STATION, must be null otherwise
        constraints: "null, or 3..16 chars uppercase A-Z0-9"
      - name: per_gallon_cap_cents
        type: integer
        source: input
        description: Per-gallon discount ceiling honored at this partner station; required when site_type == PARTNER_STATION, null otherwise
        constraints: "null, or >= 1 and a multiple of the banner's cents_off_per_block"
      - name: max_gallons_per_redemption
        type: integer
        source: input
        description: Gallons authorized per redemption at this partner station; required when site_type == PARTNER_STATION, null otherwise
        constraints: "null, or >= 1 and <= 1000"
      - name: unbatched_gallons
        type: number
        source: computed
        description: Sum of gallons_dispensed over FuelRedemption rows at this site with settlement_status == PENDING; three decimal places
      - name: unbatched_discount_cents
        type: integer
        source: computed
        description: Sum of discount_amount_cents over FuelRedemption rows at this site with settlement_status == PENDING
      - name: settlement_balance_cents
        type: integer
        source: computed
        description: Sum of reimbursement_cents over SettlementBatch rows for this site with status == APPROVED

  - name: Household
    parent: null
    common_fields: true
    fields:
      - name: banner_id
        type: string
        source: input
        description: "FK -> Banner.id; the household's home banner, which also fixes whose fraud_scoring_mode and freeze_threshold_score apply"
      - name: household_code
        type: string
        source: input
        description: Household identifier printed on statements, unique within the banner
        constraints: "4..24 chars, unique per (banner_id, household_code)"
      - name: status
        type: enum
        source: input
        description: Gates point transfers and cross-banner redemptions for every linked member
        default: ACTIVE
        constraints: "ACTIVE | FROZEN"
      - name: frozen_reason
        type: enum
        source: system
        description: Why the household is frozen; null whenever status == ACTIVE
        default: null
        constraints: "null | AUTO_FRAUD_SCORE | MANUAL"
      - name: frozen_at
        type: datetime
        source: system
        description: Logical-clock instant of the most recent freeze; null whenever status == ACTIVE
        default: null
      - name: linked_member_count
        type: integer
        source: computed
        description: Count of HouseholdLink rows for this household with status == ACTIVE
      - name: aggregate_available_points
        type: integer
        source: computed
        description: Sum of Member.available_points over members holding a HouseholdLink to this household with status == ACTIVE
      - name: cross_banner_member_ids
        type: array
        source: computed
        description: Member ids holding a HouseholdLink to this household with status == ACTIVE whose Member.banner_id != this Household.banner_id, ordered by HouseholdLink.created_at ASC
      - name: fraud_score
        type: integer
        source: computed
        description: Output of calculations.household_fraud_score under the banner's fraud_scoring_mode; recomputed on every FraudSignal create/clear and on every logical-clock advance that this household is read through

  - name: Member
    parent: null
    common_fields: true
    fields:
      - name: banner_id
        type: string
        source: input
        description: "FK -> Banner.id; the member's home banner"
      - name: alt_id
        type: string
        source: input
        description: Alternate ID keyed at the pump (digits only), unique within the banner
        constraints: "10..12 digits, unique per (banner_id, alt_id)"
      - name: card_number
        type: string
        source: input
        description: Loyalty card number, unique within the banner
        constraints: "8..19 digits, unique per (banner_id, card_number)"
      - name: full_name
        type: string
        source: input
        description: Member display name
        constraints: "1..120 chars"
      - name: available_points
        type: integer
        source: computed
        description: Sum of PointLedgerEntry.points_delta over every entry with this member_id, no status filter (the ledger is append-only, so every row counts); may be negative between a reversal and its auto-void cascade
      - name: lifetime_points
        type: integer
        source: computed
        description: Sum of PointLedgerEntry.points_delta over entries with this member_id and entry_type IN {ACCRUAL, REVERSAL}; unaffected by redemptions, expiry, rollover, transfers and adjustments

  - name: HouseholdLink
    parent: null
    common_fields: true
    # Junction entity with its own cyclic lifecycle. A link may cross banners:
    # that is exactly what makes a Member of banner X redeemable at a
    # PARTNER_STATION or OWNED_FUEL_CENTER of banner Y.
    fields:
      - name: household_id
        type: string
        source: input
        description: "FK -> Household.id"
      - name: member_id
        type: string
        source: input
        description: "FK -> Member.id"
      - name: link_role
        type: enum
        source: input
        description: Whether this member is the household's single PRIMARY or an additional SECONDARY
        constraints: "PRIMARY | SECONDARY"
      - name: status
        type: enum
        source: system
        description: Link lifecycle state
        default: PENDING
        constraints: "PENDING | ACTIVE | SUSPENDED | REVOKED"
      - name: is_cross_banner
        type: boolean
        source: computed
        description: True when Member.banner_id != Household.banner_id for this pair
      - name: activated_at
        type: datetime
        source: system
        description: Logical-clock instant of the most recent PENDING->ACTIVE or SUSPENDED->ACTIVE transition; null while never activated
        default: null
      - name: revoked_at
        type: datetime
        source: system
        description: Logical-clock instant of the transition into REVOKED; null otherwise
        default: null

  - name: PromoEvent
    parent: null
    common_fields: true
    fields:
      - name: banner_id
        type: string
        source: input
        description: "FK -> Banner.id; only purchases at this banner's sites can be multiplied by this event"
      - name: promo_code
        type: string
        source: input
        description: Promotion code, unique within the banner
        constraints: "3..24 chars, unique per (banner_id, promo_code)"
      - name: multiplier
        type: integer
        source: input
        description: Multiplier contributed by this event when it is one of the selected stacking events
        constraints: ">= 2, <= 10"
      - name: applies_to_categories
        type: array
        source: input
        description: Purchase line categories this event multiplies
        constraints: "1..6 distinct members of {GROCERY, GIFT_CARD, PHARMACY, FUEL, TOBACCO, ALCOHOL}"
      - name: starts_at
        type: datetime
        source: input
        description: Inclusive start of the promotional window
      - name: ends_at
        type: datetime
        source: input
        description: Exclusive end of the promotional window
        constraints: "> starts_at"
      - name: stack_priority
        type: integer
        source: input
        description: Selection rank when more eligible events exist than max_stack_count; higher wins
        constraints: ">= 0, <= 1000"
      - name: status
        type: enum
        source: system
        description: Promotion lifecycle state
        default: SCHEDULED
        constraints: "SCHEDULED | ACTIVE | ENDED"

  - name: PointCycle
    parent: null
    common_fields: true
    # Ops-run epoch. Accruals and redemptions only happen while the covering
    # cycle is OPEN; the CLOSING phase is a freeze window; `close` runs the
    # expiry sweep for every member of the banner.
    fields:
      - name: banner_id
        type: string
        source: input
        description: "FK -> Banner.id"
      - name: cycle_month
        type: string
        source: input
        description: Calendar month this cycle accounts for, unique within the banner
        constraints: "YYYY-MM, unique per (banner_id, cycle_month)"
      - name: opens_at
        type: datetime
        source: input
        description: Inclusive start of the cycle window
      - name: closes_at
        type: datetime
        source: input
        description: Inclusive end of the cycle window and the expiry cut-off used by the sweep
        constraints: "> opens_at"
      - name: status
        type: enum
        source: system
        description: Cycle lifecycle state
        default: OPEN
        constraints: "OPEN | CLOSING | CLOSED"
      - name: expired_points_total
        type: integer
        source: computed
        description: Sum over swept members of (unconsumed_expiring_points - rolled_over_points); 0 until close runs
        default: 0
      - name: rolled_over_points_total
        type: integer
        source: computed
        description: Sum over swept members of rolled_over_points; 0 until close runs
        default: 0
      - name: swept_member_count
        type: integer
        source: computed
        description: Count of members of this banner for which the sweep wrote at least one EXPIRY or ROLLOVER ledger entry; 0 until close runs
        default: 0
      - name: closed_at
        type: datetime
        source: system
        description: Logical-clock instant of the CLOSING->CLOSED transition; null before
        default: null

  - name: PurchaseTransaction
    parent: null
    common_fields: true
    # Parallel state dimensions: posting_status and accrual_status advance
    # independently, and `void` fires a different side-effect set depending on
    # which posting_status it starts from.
    fields:
      - name: member_id
        type: string
        source: input
        description: "FK -> Member.id"
      - name: site_id
        type: string
        source: input
        description: "FK -> Site.id; must have site_type == GROCERY"
      - name: transacted_at
        type: datetime
        source: input
        description: Instant used to select eligible PromoEvents (must fall inside the banner's OPEN PointCycle window)
      - name: lines
        type: array
        source: input
        description: Purchase line items, evaluated in the submitted array order
        constraints: "1..20 elements, each { category: GROCERY|GIFT_CARD|PHARMACY|FUEL|TOBACCO|ALCOHOL, amount_cents: integer >= 0, quantity: integer >= 0 }"
      - name: subtotal_cents
        type: integer
        source: computed
        description: Sum of lines[].amount_cents over every submitted line, including non-accruing categories
      - name: posting_status
        type: enum
        source: system
        description: Financial posting dimension
        default: RECORDED
        constraints: "RECORDED | POSTED | VOIDED"
      - name: accrual_status
        type: enum
        source: system
        description: Loyalty accrual dimension, independent of posting_status
        default: NOT_ACCRUED
        constraints: "NOT_ACCRUED | ACCRUED | REVERSED"
      - name: gross_points_awarded
        type: integer
        source: computed
        description: Output of calculations.purchase_point_accrual; 0 while accrual_status == NOT_ACCRUED, frozen at its posted value once ACCRUED or REVERSED
        default: 0
      - name: line_points_breakdown
        type: array
        source: computed
        description: "One element per submitted line in submitted order: { line_index, category, category_base_points, effective_multiplier, line_points_raw, line_points }; empty while accrual_status == NOT_ACCRUED"
      - name: applied_promo_event_ids
        type: array
        source: computed
        description: Distinct PromoEvent ids selected for at least one line by calculations.promo_multiplier_stack, ordered by stack_priority DESC then PromoEvent.created_at ASC; not a declared FK
      - name: posted_at
        type: datetime
        source: system
        description: Logical-clock instant of the RECORDED->POSTED transition; null before
        default: null
      - name: voided_at
        type: datetime
        source: system
        description: Logical-clock instant of the transition into VOIDED; null before
        default: null

  - name: PointLedgerEntry
    parent: null
    common_fields: false
    # Append-only event log. Never updated, never deleted: every correction is a
    # new signed row. Member.available_points is a pure projection over it.
    fields:
      - name: member_id
        type: string
        source: input
        description: "FK -> Member.id; the member whose balance this row moves"
      - name: point_cycle_id
        type: string
        source: system
        description: "FK -> PointCycle.id; the cycle whose [opens_at, closes_at] window contained the logical clock when this row was written"
      - name: entry_type
        type: enum
        source: system
        description: What produced this row
        constraints: "ACCRUAL | REVERSAL | REDEMPTION | REDEMPTION_RELEASE | TRANSFER_OUT | TRANSFER_IN | EXPIRY | ROLLOVER | ADJUSTMENT"
      - name: points_delta
        type: integer
        source: system
        description: Signed point movement; positive for ACCRUAL/REDEMPTION_RELEASE/TRANSFER_IN/ROLLOVER and positive-or-negative for ADJUSTMENT, negative for REVERSAL/REDEMPTION/TRANSFER_OUT/EXPIRY
        constraints: "!= 0 (zero-delta rows are never written)"
      - name: lot_expires_at
        type: datetime
        source: system
        description: Expiry instant of the point lot this row creates; set only when points_delta > 0, null when points_delta < 0
        default: null
      - name: source_kind
        type: enum
        source: system
        description: Polymorphic discriminator for source_ref_id
        constraints: "PURCHASE_TRANSACTION | FUEL_REDEMPTION | POINT_DISPUTE | POINT_CYCLE | POINT_TRANSFER"
      - name: source_ref_id
        type: string
        source: system
        description: Id of the originating record, interpreted per source_kind; deliberately polymorphic and therefore not a declared FK
      - name: memo
        type: string
        source: system
        description: Human-readable origin note, e.g. "expiry sweep 2026-09 LOT_FIFO"
        default: null

  - name: FuelRedemption
    parent: null
    common_fields: true
    # Parallel state dimensions: authorization_status (pump lifecycle) and
    # settlement_status (partner money lifecycle) advance independently, and
    # settlement_status cycles PENDING -> BATCHED -> PENDING on batch rejection.
    fields:
      - name: member_id
        type: string
        source: input
        description: "FK -> Member.id; the member whose points are debited"
      - name: site_id
        type: string
        source: input
        description: "FK -> Site.id; must have site_type IN {OWNED_FUEL_CENTER, PARTNER_STATION}"
      - name: settlement_batch_id
        type: string
        source: system
        description: "FK -> SettlementBatch.id; set when settlement_status becomes BATCHED, cleared back to null when the batch is rejected"
        default: null
      - name: alt_id_presented
        type: string
        source: input
        description: Alternate ID keyed at the pump; must equal Member.alt_id exactly
      - name: points_committed
        type: integer
        source: input
        description: Points the member offers at the pump before the per-gallon cap is applied
        constraints: ">= banner.min_points_per_redemption"
      - name: blocks_effective
        type: integer
        source: computed
        description: Discount blocks that survive the site's per-gallon cap, per calculations.redemption_authorization
      - name: cents_off_per_gallon
        type: integer
        source: computed
        description: Per-gallon discount actually authorized, per calculations.redemption_authorization
      - name: points_debited_at_auth
        type: integer
        source: computed
        description: Points actually debited at authorization, equal to blocks_effective * banner.points_per_discount_block; the uncapped remainder of points_committed is never debited
      - name: gallons_authorized
        type: number
        source: computed
        description: Gallon ceiling for this fill, three decimal places
      - name: gallons_dispensed
        type: number
        source: input
        description: Gallons actually pumped, supplied at completion; null while AUTHORIZED
        default: null
        constraints: "null, or > 0 with at most 3 decimal places and <= gallons_authorized"
      - name: discount_amount_cents
        type: integer
        source: computed
        description: Output of calculations.redemption_discount_amount; null until authorization_status == DISPENSED
        default: null
      - name: authorization_status
        type: enum
        source: system
        description: Pump lifecycle dimension
        default: AUTHORIZED
        constraints: "AUTHORIZED | DISPENSED | VOIDED | SUPERSEDED"
      - name: settlement_status
        type: enum
        source: system
        description: Partner money lifecycle dimension, independent of authorization_status
        default: NOT_APPLICABLE
        constraints: "NOT_APPLICABLE | PENDING | BATCHED | SETTLED"
      - name: authorized_at
        type: datetime
        source: system
        description: Logical-clock instant of authorization
      - name: dispensed_at
        type: datetime
        source: system
        description: Logical-clock instant of the AUTHORIZED->DISPENSED transition; null before
        default: null

  - name: SettlementBatch
    parent: null
    common_fields: true
    # Branching lifecycle with divergent side-effect sets: APPROVED settles the
    # claimed redemptions and credits the site's settlement_balance_cents;
    # REJECTED returns them to the unbatched pool with zero drift.
    fields:
      - name: site_id
        type: string
        source: input
        description: "FK -> Site.id; must have site_type == PARTNER_STATION"
      - name: period_start
        type: datetime
        source: input
        description: Inclusive start of the settlement period
      - name: period_end
        type: datetime
        source: input
        description: Inclusive end of the settlement period
        constraints: "> period_start"
      - name: status
        type: enum
        source: system
        description: Batch lifecycle state
        default: DRAFT
        constraints: "DRAFT | SUBMITTED | APPROVED | REJECTED"
      - name: redemption_count
        type: integer
        source: computed
        description: Count of FuelRedemption rows claimed by this batch at submit time; 0 while DRAFT
        default: 0
      - name: gallons_total
        type: number
        source: computed
        description: Sum of gallons_dispensed over the claimed redemptions, three decimal places; 0 while DRAFT
        default: 0
      - name: gross_discount_cents
        type: integer
        source: computed
        description: Sum of discount_amount_cents over the claimed redemptions; 0 while DRAFT
        default: 0
      - name: tier_rate_pct
        type: number
        source: computed
        description: Volume tier reimbursement rate selected from gallons_total; 0 while DRAFT
        default: 0
      - name: pre_fee_reimbursement_cents
        type: integer
        source: computed
        description: round_half_up(gross_discount_cents * tier_rate_pct); 0 while DRAFT
        default: 0
      - name: admin_fee_cents
        type: integer
        source: computed
        description: Administrative fee, computed from pre_fee_reimbursement_cents and never from reimbursement_cents; 0 while DRAFT
        default: 0
      - name: reimbursement_cents
        type: integer
        source: computed
        description: pre_fee_reimbursement_cents - admin_fee_cents; 0 while DRAFT
        default: 0
      - name: submitted_by_user_id
        type: string
        source: system
        description: X-User-ID of the SettlementClerk that submitted the batch; null while DRAFT
        default: null
      - name: approved_by_user_id
        type: string
        source: system
        description: X-User-ID of the ProgramAdmin that approved the batch; null unless status == APPROVED
        default: null
      - name: submitted_at
        type: datetime
        source: system
        description: Logical-clock instant of the DRAFT->SUBMITTED transition; null before
        default: null
      - name: decided_at
        type: datetime
        source: system
        description: Logical-clock instant of the transition into APPROVED or REJECTED; null before
        default: null

  - name: PointDispute
    parent: null
    common_fields: true
    # Carries both the dispute lifecycle and the manual-adjustment authority
    # fields, so segregation of duties is enforced on one row.
    fields:
      - name: member_id
        type: string
        source: input
        description: "FK -> Member.id; the disputing member"
      - name: disputed_ledger_entry_id
        type: string
        source: input
        description: "FK -> PointLedgerEntry.id; must be an entry whose member_id equals this dispute's member_id"
      - name: supersedes_dispute_id
        type: string
        source: input
        description: "FK -> PointDispute.id; the RESOLVED_DENIED dispute this refiling replaces, null for a first filing"
        default: null
      - name: applied_ledger_entry_id
        type: string
        source: system
        description: "FK -> PointLedgerEntry.id; the ADJUSTMENT row written when the proposal was approved, null otherwise"
        default: null
      - name: claimed_points
        type: integer
        source: input
        description: Points the member claims are missing or wrongly removed
        constraints: ">= 1, <= 1000000"
      - name: reason_code
        type: enum
        source: input
        description: Why the member disputes the entry
        constraints: "MISSING_ACCRUAL | WRONG_MULTIPLIER | UNAUTHORIZED_REDEMPTION | EXPIRY_ERROR"
      - name: status
        type: enum
        source: system
        description: Dispute lifecycle state
        default: FILED
        constraints: "FILED | INVESTIGATING | ADJUSTMENT_PROPOSED | RESOLVED_UPHELD | RESOLVED_DENIED"
      - name: proposed_points_delta
        type: integer
        source: input
        description: Signed adjustment proposed by the analyst; null until a proposal exists
        default: null
        constraints: "null, or != 0"
      - name: authority_tier
        type: enum
        source: input
        description: Authority tier claimed for the proposal; null until a proposal exists
        default: null
        constraints: "null | TIER1 | TIER2 | TIER3"
      - name: proposed_by_user_id
        type: string
        source: system
        description: X-User-ID of the LoyaltyAnalyst that proposed the adjustment; null until a proposal exists
        default: null
      - name: approved_by_user_id
        type: string
        source: system
        description: X-User-ID of the approver; null unless status == RESOLVED_UPHELD
        default: null
      - name: resolved_at
        type: datetime
        source: system
        description: Logical-clock instant of the transition into RESOLVED_UPHELD or RESOLVED_DENIED; null before
        default: null

  - name: FraudSignal
    parent: null
    common_fields: true
    fields:
      - name: household_id
        type: string
        source: input
        description: "FK -> Household.id; the household this signal scores against"
      - name: signal_type
        type: enum
        source: input
        description: Detection family
        constraints: "ALT_ID_SHARING | RAPID_TRANSFER | CROSS_BANNER_VELOCITY | OVERDRAWN_AUTH | GEO_IMPOSSIBLE"
      - name: severity_weight
        type: integer
        source: input
        description: Weight contributed to Household.fraud_score while status == OPEN
        constraints: ">= 1, <= 100"
      - name: status
        type: enum
        source: system
        description: Signal lifecycle state
        default: OPEN
        constraints: "OPEN | CLEARED"
      - name: source
        type: enum
        source: system
        description: Whether an analyst raised the signal or a cascade wrote it
        constraints: "ANALYST | SYSTEM"
      - name: detected_at
        type: datetime
        source: system
        description: Logical-clock instant at creation; the decay input of the TRAILING_WEIGHTED fraud-score variant
      - name: cleared_at
        type: datetime
        source: system
        description: Logical-clock instant of the OPEN->CLEARED transition; null before
        default: null
      - name: cleared_by_user_id
        type: string
        source: system
        description: X-User-ID of the analyst that cleared the signal; null while OPEN
        default: null

# ---------------------------------------------------------------------------
# §1.2 State Machine Table
# ---------------------------------------------------------------------------
state_machines:

  # -------------------------------------------------------------------------
  # 1. HouseholdLink — CYCLIC (PENDING -> ACTIVE -> SUSPENDED -> ACTIVE)
  # -------------------------------------------------------------------------
  - entity: HouseholdLink
    initial_state: PENDING
    terminal_states: [REVOKED]
    transitions:
      - from: PENDING
        to: ACTIVE
        trigger: "POST /household-links/{id}/activate"
        actor: LoyaltyAnalyst
        preconditions:
          - "HouseholdLink.status == PENDING"
          - "Household.status == ACTIVE for HouseholdLink.household_id (else ERR_HOUSEHOLD_FROZEN)"
          - "Banner.status == ACTIVE for the Household's banner_id (else ERR_BANNER_SUSPENDED)"
          - "when link_role == PRIMARY, no other HouseholdLink for the same household_id has link_role == PRIMARY and status IN {PENDING, ACTIVE, SUSPENDED} (else ERR_PRIMARY_LINK_EXISTS)"
        side_effects:
          - "sets HouseholdLink.status = ACTIVE and activated_at = logical clock"
          - "recomputes Household.linked_member_count, Household.aggregate_available_points and Household.cross_banner_member_ids"
          - "increments Household.version by 1"
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /household-links/{id}/suspend"
        actor: LoyaltyAnalyst
        preconditions:
          - "HouseholdLink.status == ACTIVE"
        side_effects:
          - "sets HouseholdLink.status = SUSPENDED"
          - "recomputes Household.linked_member_count, Household.aggregate_available_points and Household.cross_banner_member_ids"
          - "increments Household.version by 1"
        note: "Suspension does not void existing AUTHORIZED redemptions; only revocation does. This asymmetry is deliberate and testable."
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /household-links/{id}/activate"
        actor: LoyaltyAnalyst
        preconditions:
          - "HouseholdLink.status == SUSPENDED"
          - "Household.status == ACTIVE for HouseholdLink.household_id (else ERR_HOUSEHOLD_FROZEN)"
          - "Banner.status == ACTIVE for the Household's banner_id (else ERR_BANNER_SUSPENDED)"
        side_effects:
          - "sets HouseholdLink.status = ACTIVE and activated_at = logical clock (overwriting the previous activation instant)"
          - "recomputes Household.linked_member_count, Household.aggregate_available_points and Household.cross_banner_member_ids"
          - "increments Household.version by 1"
        note: "This is the cycle back-edge: the same activate endpoint serves PENDING->ACTIVE and SUSPENDED->ACTIVE, and a link may traverse ACTIVE->SUSPENDED->ACTIVE any number of times."
      - from: PENDING
        to: REVOKED
        trigger: "POST /household-links/{id}/revoke"
        actor: LoyaltyAnalyst
        preconditions:
          - "HouseholdLink.status == PENDING"
        side_effects:
          - "sets HouseholdLink.status = REVOKED and revoked_at = logical clock"
          - "no Household recomputation is required because a PENDING link never counted toward linked_member_count"
      - from: SUSPENDED
        to: REVOKED
        trigger: "POST /household-links/{id}/revoke"
        actor: LoyaltyAnalyst
        preconditions:
          - "HouseholdLink.status == SUSPENDED"
        side_effects:
          - "sets HouseholdLink.status = REVOKED and revoked_at = logical clock"
      - from: ACTIVE
        to: REVOKED
        trigger: "POST /household-links/{id}/revoke"
        actor: LoyaltyAnalyst
        preconditions:
          - "HouseholdLink.status == ACTIVE"
        side_effects:
          - "HOP 1 — sets HouseholdLink.status = REVOKED and revoked_at = logical clock"
          - "HOP 2 — caused by HOP 1: because a link left the ACTIVE set, Household.linked_member_count is decremented, Household.aggregate_available_points is recomputed (the revoked member's available_points leaves the pool) and Household.cross_banner_member_ids is recomputed, dropping this member_id; increments Household.version by 1"
          - "HOP 3 — caused by HOP 2: because this member_id is no longer present in Household.cross_banner_member_ids, every FuelRedemption with member_id == this member, authorization_status == AUTHORIZED and Site.banner_id != Member.banner_id transitions AUTHORIZED->VOIDED (processed in created_at ASC order), each writing a REDEMPTION_RELEASE PointLedgerEntry of +points_debited_at_auth and incrementing Member.version by 1"
        note: "Transitive cascade of depth 3 (rule_id transitive_cascade). HOP 3 is a consequence of the coverage set recomputed in HOP 2, not of the status write in HOP 1: a member whose cross-banner coverage came from a second household keeps its redemptions."

  # -------------------------------------------------------------------------
  # 2. Household — CYCLIC (ACTIVE -> FROZEN -> ACTIVE), auto-freeze / manual thaw
  # -------------------------------------------------------------------------
  - entity: Household
    initial_state: ACTIVE
    terminal_states: []
    transitions:
      - from: ACTIVE
        to: FROZEN
        trigger: "POST /households/{id}/freeze"
        actor: LoyaltySupervisor
        preconditions:
          - "Household.status == ACTIVE"
        side_effects:
          - "sets Household.status = FROZEN, frozen_reason = MANUAL, frozen_at = logical clock"
      - from: ACTIVE
        to: FROZEN
        trigger: "system event: Household.fraud_score recomputed to a value >= Banner.freeze_threshold_score during POST /fraud-signals, POST /fraud-signals/{id}/clear, POST /point-transfers, or the OVERDRAWN_AUTH signal written by the purchase-void cascade. Moving the logical clock alone never freezes a household — it only changes what the next of these writes computes under TRAILING_WEIGHTED"
        actor: system
        preconditions:
          - "Household.status == ACTIVE"
          - "calculations.household_fraud_score output >= Banner.freeze_threshold_score"
        side_effects:
          - "sets Household.status = FROZEN, frozen_reason = AUTO_FRAUD_SCORE, frozen_at = logical clock"
          - "blocks POST /point-transfers and cross-banner POST /fuel-redemptions for every linked member (ERR_HOUSEHOLD_FROZEN)"
        note: "Auto-freeze is automatic; the reverse is never automatic. A recomputed score falling back under the threshold leaves status == FROZEN — only POST /households/{id}/unfreeze thaws it."
      - from: FROZEN
        to: ACTIVE
        trigger: "POST /households/{id}/unfreeze"
        actor: LoyaltySupervisor
        preconditions:
          - "Household.status == FROZEN"
          - "no FraudSignal for this household has status == OPEN and signal_type IN {ALT_ID_SHARING, GEO_IMPOSSIBLE} (else ERR_INVALID_STATE_TRANSITION)"
        side_effects:
          - "sets Household.status = ACTIVE, frozen_reason = null, frozen_at = null"
        note: "Cycle back-edge. A household may traverse ACTIVE->FROZEN->ACTIVE repeatedly."

  # -------------------------------------------------------------------------
  # 3. PurchaseTransaction — PARALLEL DIMENSIONS (posting_status x accrual_status)
  #    plus a branching `void` whose side-effect set differs per source branch.
  # -------------------------------------------------------------------------
  - entity: PurchaseTransaction
    initial_state: "RECORDED / NOT_ACCRUED"
    terminal_states: ["VOIDED / NOT_ACCRUED", "VOIDED / REVERSED"]
    transitions:
      - from: "RECORDED / NOT_ACCRUED"
        to: "POSTED / ACCRUED"
        trigger: "POST /purchase-transactions/{id}/post"
        actor: StoreOperator
        preconditions:
          - "PurchaseTransaction.posting_status == RECORDED"
          - "PurchaseTransaction.accrual_status == NOT_ACCRUED"
          - "Banner.status == ACTIVE for the member's banner (else ERR_BANNER_SUSPENDED)"
          - "Site.status == ACTIVE (else ERR_SITE_SUSPENDED)"
          - "a PointCycle exists for the member's banner with status == OPEN whose [opens_at, closes_at] contains the logical clock (else ERR_CYCLE_NOT_OPEN)"
          - "a PointCycle exists for the member's banner whose cycle_month is the calendar month immediately after that OPEN cycle's cycle_month (else ERR_NEXT_CYCLE_NOT_DEFINED)"
        side_effects:
          - "runs calculations.promo_multiplier_stack then calculations.purchase_point_accrual, writing PurchaseTransaction.gross_points_awarded, line_points_breakdown and applied_promo_event_ids"
          - "sets posting_status = POSTED and posted_at = logical clock"
          - "sets accrual_status = ACCRUED (the two dimensions advance in the same request but are independently readable)"
          - "when gross_points_awarded > 0, appends one ACCRUAL PointLedgerEntry with points_delta = gross_points_awarded, point_cycle_id = the OPEN cycle, lot_expires_at = the next cycle's closes_at, source_kind = PURCHASE_TRANSACTION, source_ref_id = this transaction id; when gross_points_awarded == 0 no ledger row is written"
          - "recomputes Member.available_points and Member.lifetime_points and increments Member.version by 1"
          - "recomputes Household.aggregate_available_points for every household holding an ACTIVE link to this member"
      - from: "RECORDED / NOT_ACCRUED"
        to: "VOIDED / NOT_ACCRUED"
        trigger: "POST /purchase-transactions/{id}/void"
        actor: StoreOperator
        preconditions:
          - "PurchaseTransaction.posting_status == RECORDED"
        side_effects:
          - "sets posting_status = VOIDED and voided_at = logical clock"
          - "leaves accrual_status = NOT_ACCRUED and writes NO ledger row, because nothing was ever accrued"
        note: "Branch A of the fork: same endpoint, empty ledger side-effect set. Contrast with the POSTED branch below."
      - from: "POSTED / ACCRUED"
        to: "VOIDED / REVERSED"
        trigger: "POST /purchase-transactions/{id}/void"
        actor: StoreOperator
        preconditions:
          - "PurchaseTransaction.posting_status == POSTED"
          - "PurchaseTransaction.accrual_status == ACCRUED"
          - "the PointCycle that carries this transaction's ACCRUAL entry has status == OPEN (else ERR_CYCLE_NOT_OPEN)"
        side_effects:
          - "HOP 1 — sets posting_status = VOIDED, voided_at = logical clock, and accrual_status = REVERSED"
          - "HOP 2 — caused by HOP 1: because accrual_status entered REVERSED, one REVERSAL PointLedgerEntry is appended with points_delta = -gross_points_awarded, source_kind = PURCHASE_TRANSACTION, source_ref_id = this transaction id, lot_expires_at = null; Member.available_points and Member.lifetime_points are recomputed and Member.version is incremented by 1"
          - "HOP 3 — caused by HOP 2: because the recomputed Member.available_points is < 0, calculations.overdraw_auto_void_selection selects AUTHORIZED FuelRedemptions of that member and transitions each AUTHORIZED->VOIDED, appending a REDEMPTION_RELEASE PointLedgerEntry of +points_debited_at_auth per void, until available_points >= 0 or no candidate remains"
          - "HOP 4 — caused by HOP 3: for each redemption auto-voided in HOP 3, one FraudSignal is appended with signal_type = OVERDRAWN_AUTH, severity_weight = 40, source = SYSTEM, status = OPEN, household_id = the household of that member's oldest ACTIVE HouseholdLink by HouseholdLink.created_at ASC (no signal is written when the member holds no ACTIVE link)"
          - "HOP 5 — caused by HOP 4: because a new OPEN FraudSignal exists, calculations.household_fraud_score is recomputed for that household and, when the result >= Banner.freeze_threshold_score and status == ACTIVE, Household.status becomes FROZEN with frozen_reason = AUTO_FRAUD_SCORE"
        note: "Branch B of the fork and the deep transitive cascade (rule_id transitive_cascade): 5 hops across PurchaseTransaction -> PointLedgerEntry -> FuelRedemption -> FraudSignal -> Household, each caused by its predecessor."

  # -------------------------------------------------------------------------
  # 4. FuelRedemption — PARALLEL DIMENSIONS (authorization_status x settlement_status)
  #    with a cyclic settlement axis (PENDING -> BATCHED -> PENDING).
  # -------------------------------------------------------------------------
  - entity: FuelRedemption
    initial_state: "AUTHORIZED / NOT_APPLICABLE"
    terminal_states: ["VOIDED / NOT_APPLICABLE", "SUPERSEDED / NOT_APPLICABLE", "DISPENSED / SETTLED"]
    transitions:
      - from: "(creation)"
        to: "AUTHORIZED / NOT_APPLICABLE"
        trigger: "POST /fuel-redemptions"
        actor: PumpTerminal
        preconditions:
          - "Site.site_type IN {OWNED_FUEL_CENTER, PARTNER_STATION} (else ERR_FUEL_SITE_REQUIRED)"
          - "Site.status == ACTIVE (else ERR_SITE_SUSPENDED)"
          - "alt_id_presented == Member.alt_id (else ERR_ALT_ID_MISMATCH)"
          - "expected_member_version == Member.version (else ERR_STALE_MEMBER_VERSION)"
          - "when Site.banner_id != Member.banner_id, the member holds a HouseholdLink with status == ACTIVE to a Household whose banner_id == Site.banner_id (else ERR_CROSS_BANNER_LINK_REQUIRED)"
          - "every Household reachable from that member by a HouseholdLink with status == ACTIVE has status == ACTIVE (else ERR_HOUSEHOLD_FROZEN)"
          - "a PointCycle for Member.banner_id has status == OPEN and contains the logical clock (else ERR_CYCLE_NOT_OPEN)"
          - "points_committed >= Banner.min_points_per_redemption (else ERR_BELOW_MIN_REDEMPTION)"
          - "Member.available_points >= points_debited_at_auth as computed by calculations.redemption_authorization (else ERR_INSUFFICIENT_POINTS)"
        side_effects:
          - "runs calculations.redemption_authorization, writing blocks_effective, cents_off_per_gallon, points_debited_at_auth and gallons_authorized"
          - "appends one REDEMPTION PointLedgerEntry with points_delta = -points_debited_at_auth, lot_expires_at = null, source_kind = FUEL_REDEMPTION"
          - "sets authorization_status = AUTHORIZED, settlement_status = NOT_APPLICABLE, authorized_at = logical clock"
          - "supersede: every other FuelRedemption of the same member with authorization_status == AUTHORIZED transitions AUTHORIZED->SUPERSEDED (see the transition below)"
          - "recomputes Member.available_points and increments Member.version by 1"
          - "recomputes Household.aggregate_available_points for every household holding an ACTIVE link to this member"
      - from: "AUTHORIZED / NOT_APPLICABLE"
        to: "SUPERSEDED / NOT_APPLICABLE"
        trigger: "system event: a newer POST /fuel-redemptions succeeded for the same member_id"
        actor: system
        preconditions:
          - "authorization_status == AUTHORIZED"
        side_effects:
          - "sets authorization_status = SUPERSEDED"
          - "appends one REDEMPTION_RELEASE PointLedgerEntry with points_delta = +points_debited_at_auth, lot_expires_at = null, source_kind = FUEL_REDEMPTION, source_ref_id = the superseded redemption id"
        note: "A member may hold at most one AUTHORIZED redemption. The new authorization legitimately displaces the old one, which is why POST /fuel-redemptions is a true CREATE-with-supersede race and carries OCC on Member.version (§1.2.1)."
      - from: "AUTHORIZED / NOT_APPLICABLE"
        to: "DISPENSED / PENDING"
        trigger: "POST /fuel-redemptions/{id}/complete at a PARTNER_STATION"
        actor: PumpTerminal
        preconditions:
          - "authorization_status == AUTHORIZED"
          - "Site.site_type == PARTNER_STATION"
          - "gallons_dispensed > 0 and gallons_dispensed <= gallons_authorized (else ERR_GALLONS_EXCEED_AUTHORIZATION)"
        side_effects:
          - "runs calculations.redemption_discount_amount, writing discount_amount_cents"
          - "sets authorization_status = DISPENSED, dispensed_at = logical clock, settlement_status = PENDING"
          - "recomputes Site.unbatched_gallons and Site.unbatched_discount_cents and increments Site.version by 1"
        note: "The settlement axis leaves NOT_APPLICABLE only here; owned fuel centers never enter it."
      - from: "AUTHORIZED / NOT_APPLICABLE"
        to: "DISPENSED / NOT_APPLICABLE"
        trigger: "POST /fuel-redemptions/{id}/complete at an OWNED_FUEL_CENTER"
        actor: PumpTerminal
        preconditions:
          - "authorization_status == AUTHORIZED"
          - "Site.site_type == OWNED_FUEL_CENTER"
          - "gallons_dispensed > 0 and gallons_dispensed <= gallons_authorized (else ERR_GALLONS_EXCEED_AUTHORIZATION)"
        side_effects:
          - "runs calculations.redemption_discount_amount, writing discount_amount_cents"
          - "sets authorization_status = DISPENSED, dispensed_at = logical clock, settlement_status stays NOT_APPLICABLE"
        note: "Same trigger, divergent side-effect set on the settlement dimension depending on Site.site_type."
      - from: "AUTHORIZED / NOT_APPLICABLE"
        to: "VOIDED / NOT_APPLICABLE"
        trigger: "POST /fuel-redemptions/{id}/void"
        actor: PumpTerminal
        preconditions:
          - "authorization_status == AUTHORIZED"
        side_effects:
          - "sets authorization_status = VOIDED"
          - "appends one REDEMPTION_RELEASE PointLedgerEntry with points_delta = +points_debited_at_auth, lot_expires_at = null, source_kind = FUEL_REDEMPTION"
          - "recomputes Member.available_points and increments Member.version by 1"
          - "recomputes Household.aggregate_available_points for every household holding an ACTIVE link to this member"
        note: "Compensating action for the authorization debit (rule_id compensating_invariant): member_points_ledger_sum returns to its pre-authorization value exactly."
      - from: "AUTHORIZED / NOT_APPLICABLE"
        to: "VOIDED / NOT_APPLICABLE"
        trigger: "system event: HOP 3 of the POSTED purchase-void cascade, or HOP 3 of the ACTIVE HouseholdLink revoke cascade"
        actor: system
        preconditions:
          - "authorization_status == AUTHORIZED"
        side_effects:
          - "identical to the operator-triggered void, plus the HOP 4 FraudSignal write when the trigger was the purchase-void cascade"
      - from: "DISPENSED / PENDING"
        to: "DISPENSED / BATCHED"
        trigger: "system event: POST /settlement-batches/{id}/submit claimed this redemption"
        actor: system
        preconditions:
          - "settlement_status == PENDING"
          - "dispensed_at falls inside [SettlementBatch.period_start, SettlementBatch.period_end] inclusive"
        side_effects:
          - "sets settlement_status = BATCHED and settlement_batch_id = the batch id"
          - "removes this row's gallons and discount from Site.unbatched_gallons / Site.unbatched_discount_cents"
      - from: "DISPENSED / BATCHED"
        to: "DISPENSED / PENDING"
        trigger: "system event: POST /settlement-batches/{id}/reject"
        actor: system
        preconditions:
          - "settlement_status == BATCHED"
        side_effects:
          - "sets settlement_status = PENDING and settlement_batch_id = null"
          - "restores this row's gallons and discount into Site.unbatched_gallons / Site.unbatched_discount_cents"
        note: "Cycle back-edge on the settlement axis; the authorization axis is untouched, which is what makes the two dimensions independent."
      - from: "DISPENSED / BATCHED"
        to: "DISPENSED / SETTLED"
        trigger: "system event: POST /settlement-batches/{id}/approve"
        actor: system
        preconditions:
          - "settlement_status == BATCHED"
        side_effects:
          - "sets settlement_status = SETTLED"
          - "the row's gallons and discount stay out of the unbatched pool permanently"

  # -------------------------------------------------------------------------
  # 5. SettlementBatch — BRANCHING (SUBMITTED -> {APPROVED, REJECTED})
  # -------------------------------------------------------------------------
  - entity: SettlementBatch
    initial_state: DRAFT
    terminal_states: [APPROVED, REJECTED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /settlement-batches/{id}/submit"
        actor: SettlementClerk
        preconditions:
          - "SettlementBatch.status == DRAFT"
          - "Site.status == ACTIVE (else ERR_SITE_SUSPENDED)"
          - "Banner.status == ACTIVE for Site.banner_id (else ERR_BANNER_SUSPENDED)"
          - "at least one FuelRedemption at Site.id has settlement_status == PENDING and dispensed_at inside [period_start, period_end] inclusive (else ERR_NO_SETTLEABLE_GALLONS)"
        side_effects:
          - "claims every qualifying PENDING redemption, driving each PENDING->BATCHED and stamping settlement_batch_id"
          - "runs calculations.settlement_batch_reimbursement, writing redemption_count, gallons_total, gross_discount_cents, tier_rate_pct, pre_fee_reimbursement_cents, admin_fee_cents and reimbursement_cents"
          - "sets status = SUBMITTED, submitted_by_user_id = X-User-ID, submitted_at = logical clock"
          - "recomputes Site.unbatched_gallons and Site.unbatched_discount_cents and increments Site.version by 1"
      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /settlement-batches/{id}/approve"
        actor: ProgramAdmin
        preconditions:
          - "SettlementBatch.status == SUBMITTED"
          - "X-User-ID != SettlementBatch.submitted_by_user_id (else ERR_SELF_APPROVAL_FORBIDDEN)"
        side_effects:
          - "sets status = APPROVED, approved_by_user_id = X-User-ID, decided_at = logical clock"
          - "drives every claimed redemption BATCHED->SETTLED"
          - "recomputes Site.settlement_balance_cents (adds reimbursement_cents) and increments Site.version by 1"
        note: "Branch 1: money moves and the claimed gallons leave the unbatched pool for good."
      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /settlement-batches/{id}/reject"
        actor: ProgramAdmin
        preconditions:
          - "SettlementBatch.status == SUBMITTED"
          - "X-User-ID != SettlementBatch.submitted_by_user_id (else ERR_SELF_APPROVAL_FORBIDDEN)"
        side_effects:
          - "sets status = REJECTED, decided_at = logical clock, approved_by_user_id stays null"
          - "drives every claimed redemption BATCHED->PENDING and clears its settlement_batch_id"
          - "resets redemption_count, gallons_total, gross_discount_cents, tier_rate_pct, pre_fee_reimbursement_cents, admin_fee_cents and reimbursement_cents to 0"
          - "recomputes Site.unbatched_gallons and Site.unbatched_discount_cents and increments Site.version by 1"
        note: "Branch 2 and the compensating action for submit (rule_id compensating_invariant): partner_unbatched_gallons returns to its pre-submit value exactly, with Site.settlement_balance_cents untouched."
      - from: DRAFT
        to: REJECTED
        trigger: "system event: a newer POST /settlement-batches for the same site_id with an overlapping period superseded this draft"
        actor: system
        preconditions:
          - "SettlementBatch.status == DRAFT"
        side_effects:
          - "sets status = REJECTED and decided_at = logical clock; no redemptions were ever claimed by a DRAFT batch, so no settlement_status changes"
        note: "This supersede is why POST /settlement-batches is a true CREATE-with-supersede race and carries OCC on Site.version (§1.2.1)."

  # -------------------------------------------------------------------------
  # 6. PointCycle — two-phase ops-run epoch
  # -------------------------------------------------------------------------
  - entity: PointCycle
    initial_state: OPEN
    terminal_states: [CLOSED]
    transitions:
      - from: OPEN
        to: CLOSING
        trigger: "POST /point-cycles/{id}/begin-close"
        actor: LoyaltySupervisor
        preconditions:
          - "PointCycle.status == OPEN"
          - "logical clock > PointCycle.closes_at (else ERR_CYCLE_NOT_ENDED)"
          - "every PointCycle of the same banner whose cycle_month is lexicographically less than this cycle_month has status == CLOSED (else ERR_PRIOR_CYCLE_NOT_CLOSED)"
        side_effects:
          - "sets status = CLOSING"
          - "from this point on, POST /purchase-transactions/{id}/post, POST /fuel-redemptions, POST /point-transfers and POST /point-disputes/{id}/approve-adjustment for this banner fail with ERR_CYCLE_NOT_OPEN until a later cycle is the OPEN one"
      - from: CLOSING
        to: CLOSED
        trigger: "POST /point-cycles/{id}/close"
        actor: LoyaltySupervisor
        preconditions:
          - "PointCycle.status == CLOSING"
        side_effects:
          - "HOP 1 — runs calculations.point_expiry_sweep for every Member with banner_id == PointCycle.banner_id, in Member.created_at ASC order, writing at most one EXPIRY row (points_delta = -unconsumed_expiring_points) and at most one ROLLOVER row (points_delta = +rolled_over_points, lot_expires_at = the next cycle's closes_at) per member; zero-valued rows are never written"
          - "HOP 2 — caused by HOP 1: every affected Member.available_points is recomputed and Member.version incremented by 1; PointCycle.expired_points_total, rolled_over_points_total and swept_member_count are written"
          - "HOP 3 — caused by HOP 2: Household.aggregate_available_points is recomputed for every household holding an ACTIVE link to an affected member"
          - "sets status = CLOSED and closed_at = logical clock"
          - "every PromoEvent of this banner with status IN {SCHEDULED, ACTIVE} and ends_at <= PointCycle.closes_at transitions to ENDED"
        note: "Ops-run checkpoint. Availability is ledger-sum based, so a lot whose lot_expires_at has already passed on the logical clock remains spendable until this sweep materializes its EXPIRY row."

  # -------------------------------------------------------------------------
  # 7. PointDispute — branching resolution with segregation of duties
  # -------------------------------------------------------------------------
  - entity: PointDispute
    initial_state: FILED
    terminal_states: [RESOLVED_UPHELD, RESOLVED_DENIED]
    transitions:
      - from: FILED
        to: INVESTIGATING
        trigger: "POST /point-disputes/{id}/investigate"
        actor: LoyaltyAnalyst
        preconditions:
          - "PointDispute.status == FILED"
        side_effects:
          - "sets status = INVESTIGATING"
      - from: INVESTIGATING
        to: ADJUSTMENT_PROPOSED
        trigger: "POST /point-disputes/{id}/propose-adjustment"
        actor: LoyaltyAnalyst
        preconditions:
          - "PointDispute.status == INVESTIGATING"
          - "abs(proposed_points_delta) <= the authority_tier ceiling (TIER1 500, TIER2 5000, TIER3 unbounded) (else ERR_ADJUSTMENT_EXCEEDS_AUTHORITY)"
        side_effects:
          - "writes proposed_points_delta, authority_tier and proposed_by_user_id = X-User-ID"
          - "sets status = ADJUSTMENT_PROPOSED"
      - from: ADJUSTMENT_PROPOSED
        to: RESOLVED_UPHELD
        trigger: "POST /point-disputes/{id}/approve-adjustment"
        actor: LoyaltySupervisor | ProgramAdmin
        preconditions:
          - "PointDispute.status == ADJUSTMENT_PROPOSED"
          - "X-User-ID != PointDispute.proposed_by_user_id (else ERR_SELF_APPROVAL_FORBIDDEN)"
          - "authority_tier == TIER3 requires X-User-Role == ProgramAdmin; TIER1 and TIER2 accept LoyaltySupervisor or ProgramAdmin (else ERR_TIER_AUTHORITY_REQUIRED)"
          - "a PointCycle for Member.banner_id has status == OPEN and contains the logical clock (else ERR_CYCLE_NOT_OPEN)"
        side_effects:
          - "appends one ADJUSTMENT PointLedgerEntry with points_delta = proposed_points_delta, point_cycle_id = the OPEN cycle, lot_expires_at = the next cycle's closes_at when points_delta > 0 and null when points_delta < 0, source_kind = POINT_DISPUTE, source_ref_id = this dispute id"
          - "writes applied_ledger_entry_id = the new entry id, approved_by_user_id = X-User-ID, resolved_at = logical clock, status = RESOLVED_UPHELD"
          - "recomputes Member.available_points and increments Member.version by 1"
          - "recomputes Household.aggregate_available_points for every household holding an ACTIVE link to this member"
      - from: INVESTIGATING
        to: RESOLVED_DENIED
        trigger: "POST /point-disputes/{id}/deny"
        actor: LoyaltySupervisor
        preconditions:
          - "PointDispute.status == INVESTIGATING"
        side_effects:
          - "sets status = RESOLVED_DENIED, resolved_at = logical clock; no ledger row is written"
          - "unlocks refiling: a new PointDispute may now carry supersedes_dispute_id == this dispute id"
      - from: ADJUSTMENT_PROPOSED
        to: RESOLVED_DENIED
        trigger: "POST /point-disputes/{id}/deny"
        actor: LoyaltySupervisor
        preconditions:
          - "PointDispute.status == ADJUSTMENT_PROPOSED"
        side_effects:
          - "sets status = RESOLVED_DENIED, resolved_at = logical clock; proposed_points_delta and authority_tier are retained for audit but never applied"

  # -------------------------------------------------------------------------
  # 8. PromoEvent and FraudSignal — short auxiliary lifecycles
  # -------------------------------------------------------------------------
  - entity: PromoEvent
    initial_state: SCHEDULED
    terminal_states: [ENDED]
    transitions:
      - from: SCHEDULED
        to: ACTIVE
        trigger: "POST /promo-events/{id}/activate"
        actor: ProgramAdmin
        preconditions:
          - "PromoEvent.status == SCHEDULED"
          - "no other PromoEvent of the same banner_id with status == ACTIVE has an overlapping [starts_at, ends_at) window, an intersecting applies_to_categories set and an equal stack_priority (else ERR_PROMO_WINDOW_CONFLICT)"
        side_effects:
          - "sets status = ACTIVE, making the event eligible for calculations.promo_multiplier_stack"
      - from: ACTIVE
        to: ENDED
        trigger: "system event: POST /point-cycles/{id}/close where PromoEvent.ends_at <= PointCycle.closes_at"
        actor: system
        preconditions:
          - "PromoEvent.status == ACTIVE"
        side_effects:
          - "sets status = ENDED, permanently removing the event from accrual eligibility"
      - from: SCHEDULED
        to: ENDED
        trigger: "system event: POST /point-cycles/{id}/close where PromoEvent.ends_at <= PointCycle.closes_at"
        actor: system
        preconditions:
          - "PromoEvent.status == SCHEDULED"
        side_effects:
          - "sets status = ENDED; a never-activated event that outlived its window can no longer be activated"

  - entity: FraudSignal
    initial_state: OPEN
    terminal_states: [CLEARED]
    transitions:
      - from: "(creation)"
        to: OPEN
        trigger: "POST /fraud-signals, or HOP 4 of the POSTED purchase-void cascade, or the RAPID_TRANSFER signal written by POST /point-transfers when the household reaches Banner.max_transfers_per_cycle"
        actor: LoyaltyAnalyst | system
        preconditions:
          - "Household exists"
        side_effects:
          - "sets status = OPEN, detected_at = logical clock, source = ANALYST for the endpoint and SYSTEM for both cascades"
          - "recomputes Household.fraud_score and, when the result >= Banner.freeze_threshold_score and Household.status == ACTIVE, drives Household ACTIVE->FROZEN with frozen_reason = AUTO_FRAUD_SCORE"
          - "increments Household.version by 1"
      - from: OPEN
        to: CLEARED
        trigger: "POST /fraud-signals/{id}/clear"
        actor: LoyaltyAnalyst
        preconditions:
          - "FraudSignal.status == OPEN"
        side_effects:
          - "sets status = CLEARED, cleared_at = logical clock, cleared_by_user_id = X-User-ID"
          - "recomputes Household.fraud_score and increments Household.version by 1; Household.status is NOT thawed even when the recomputed score drops below Banner.freeze_threshold_score"

# ---------------------------------------------------------------------------
# §1.2.1 Concurrency Rules — OCC on a parent's `version` only
# ---------------------------------------------------------------------------
concurrency_rules:
  - rule_id: redemption-create-stale-member
    parent_entity: Member
    write_endpoint: "POST /fuel-redemptions"
    occ_field: "expected_member_version"
    description: |
      Authorizing a FuelRedemption against a Member whose version has advanced
      since the client last observed it is rejected. This captures the case
      where another writer has already authorized a redemption for the member
      (which legitimately supersedes the prior AUTHORIZED redemption per the
      FuelRedemption state machine) or an accrual, reversal, transfer, expiry or
      adjustment has moved the member's balance, so the pump's view of the
      member is stale and its points_committed decision was made against a
      balance that no longer exists.
    error_id: ERR_STALE_MEMBER_VERSION
    http_status: 412

  - rule_id: settlement-batch-create-stale-site
    parent_entity: Site
    write_endpoint: "POST /settlement-batches"
    occ_field: "expected_site_version"
    description: |
      Creating a SettlementBatch against a partner Site whose version has
      advanced since the client last observed it is rejected. This captures the
      case where another writer has just created a DRAFT batch (which
      legitimately supersedes any overlapping DRAFT per the SettlementBatch
      state machine) or a completion/submit/approve/reject has moved the site's
      unbatched pool, so the clerk's view of the settleable gallons is stale.
    error_id: ERR_STALE_SITE_VERSION
    http_status: 412

# ---------------------------------------------------------------------------
# §1.3 Calculation Rules
# ---------------------------------------------------------------------------
calculations:

  - name: promo_multiplier_stack
    trigger: "POST /purchase-transactions/{id}/post (per purchase line)"
    algorithm_type: threshold
    input_set: "PromoEvent rows with banner_id == the member's banner_id, status == ACTIVE, starts_at <= PurchaseTransaction.transacted_at < ends_at (half-open window: an event whose starts_at equals transacted_at applies; an event whose ends_at equals transacted_at does not), and line.category present in applies_to_categories"
    formula: |
      eligible = the input_set above, for this line's category
      ranked   = eligible ordered by stack_priority DESC, then created_at ASC
      applied  = the first Banner.max_stack_count rows of `ranked`
      promo_multiplier = product(applied[i].multiplier) for all i, or 1 when `applied` is empty
      PurchaseTransaction.applied_promo_event_ids = the ids of every row in `applied`
      across all lines, de-duplicated, ordered by stack_priority DESC then created_at ASC
    constants:
      MAX_STACK_COUNT_SOURCE: "Banner.max_stack_count (fixture value 2)"
    precision: "promo_multiplier is an exact integer product; no rounding occurs at this stage"
    worked_example: |
      Fixture promos on banner B_MAIN, max_stack_count = 2:
        P_DOUBLE  multiplier 2, applies_to [GROCERY, GIFT_CARD], stack_priority 10, created_at earliest
        P_TRIPLE  multiplier 3, applies_to [GROCERY],            stack_priority  5
        P_QUINT   multiplier 5, applies_to [GROCERY],            stack_priority  1
      For a GROCERY line: eligible = [P_DOUBLE, P_TRIPLE, P_QUINT] -> ranked by
      stack_priority DESC -> [P_DOUBLE(10), P_TRIPLE(5), P_QUINT(1)] -> applied =
      first 2 = [P_DOUBLE, P_TRIPLE] -> promo_multiplier = 2 * 3 = 6.
      P_QUINT is dropped even though it carries the largest multiplier, because the
      cut is by stack_priority, not by multiplier magnitude.
      For a GIFT_CARD line: eligible = [P_DOUBLE] -> promo_multiplier = 2.
      For a PHARMACY line: eligible is empty -> promo_multiplier = 1.

  - name: purchase_point_accrual
    trigger: "POST /purchase-transactions/{id}/post"
    algorithm_type: aggregation
    input_set: "every element of PurchaseTransaction.lines, evaluated independently and then summed"
    formula: |
      For each line, in the array order in which the lines were submitted:
        category_base(line) =
          GROCERY   -> line.amount_cents / 100 * Banner.base_points_per_dollar
          GIFT_CARD -> line.amount_cents / 100 * Banner.base_points_per_dollar
          PHARMACY  -> line.quantity * Banner.pharmacy_points_per_script   (amount_cents ignored)
          FUEL      -> 0
          TOBACCO   -> 0
          ALCOHOL   -> 0
        category_multiplier(line) =
          GIFT_CARD -> Banner.gift_card_multiplier
          PHARMACY  -> Banner.pharmacy_multiplier
          GROCERY   -> 1
          FUEL | TOBACCO | ALCOHOL -> 0
        promo_multiplier(line) = calculations.promo_multiplier_stack for this line
        effective_multiplier(line) =
          min(category_multiplier(line) * promo_multiplier(line), Banner.max_stacked_multiplier)
        line_points(line) = round_half_up(category_base(line) * effective_multiplier(line))
      PurchaseTransaction.line_points_breakdown = [line_points(line) for each line, in submission order]
      PurchaseTransaction.gross_points_awarded  = sum(line_points_breakdown)
      PurchaseTransaction.subtotal_cents        = sum(line.amount_cents)
    constants:
      BASE_POINTS_PER_DOLLAR: "Banner.base_points_per_dollar (fixture value 1)"
      GIFT_CARD_MULTIPLIER: "Banner.gift_card_multiplier (fixture value 4)"
      PHARMACY_MULTIPLIER: "Banner.pharmacy_multiplier (fixture value 2)"
      PHARMACY_POINTS_PER_SCRIPT: "Banner.pharmacy_points_per_script (fixture value 50)"
      MAX_STACKED_MULTIPLIER: "Banner.max_stacked_multiplier (fixture value 8)"
    precision: |
      PINNED ORDER — round-half-up to a whole point PER LINE, then sum the rounded
      line values. Never sum the unrounded line values and round once at the end.
      The two orders diverge whenever two or more lines carry fractional halves.
      Also pinned: the multiplier cap is applied to the PRODUCT of the category and
      promo multipliers BEFORE multiplying the base, never to the promo multiplier
      alone and never to the rounded line result.
    worked_example: |
      Banner B_MAIN: base 1, gift_card_multiplier 4, pharmacy_multiplier 2,
      pharmacy_points_per_script 50, max_stacked_multiplier 8, max_stack_count 2.
      Active promos P_DOUBLE (2x, [GROCERY, GIFT_CARD], prio 10) and
      P_TRIPLE (3x, [GROCERY], prio 5); P_QUINT (5x, [GROCERY], prio 1) is dropped.
      Lines:
        L1 GROCERY   amount_cents 1050, quantity 1
           base 10.50, cat_mult 1, promo 6 -> product 6 (<= 8) -> 63.0   -> 63
        L2 GROCERY   amount_cents  175, quantity 1
           base 1.75,  cat_mult 1, promo 6 -> 6              -> 10.5    -> 11  (half up)
        L3 GROCERY   amount_cents  175, quantity 1
           base 1.75,  cat_mult 1, promo 6 -> 6              -> 10.5    -> 11  (half up)
        L4 GIFT_CARD amount_cents  512, quantity 1
           base 5.12,  cat_mult 4, promo 2 -> product 8 (== cap 8) -> 40.96 -> 41
        L5 PHARMACY  amount_cents 8999, quantity 1
           base 50 (= 1 * 50), cat_mult 2, promo 1 -> 2      -> 100.0   -> 100
        L6 FUEL      amount_cents 4000, quantity 12
           base 0, cat_mult 0                                 -> 0.0     -> 0
      line_points_breakdown = [63, 11, 11, 41, 100, 0]
      gross_points_awarded  = 226
      subtotal_cents        = 1050 + 175 + 175 + 512 + 8999 + 4000 = 14911
      Contrast — sum-then-round would give 63.0 + 10.5 + 10.5 + 40.96 + 100.0 + 0
      = 224.96 -> 225. The correct answer is 226.
      Contrast — capping the promo multiplier alone on L4 would give
      min(2,8)=2 then 4*2=8 -> same 41 here, but on a hypothetical promo 6 line it
      would give 4*6=24 uncapped instead of the pinned min(24,8)=8.

  - name: redemption_authorization
    trigger: "POST /fuel-redemptions"
    algorithm_type: threshold
    input_set: "the requested points_committed, the target Site and the Site's Banner"
    formula: |
      blocks_requested      = floor(points_committed / Banner.points_per_discount_block)
      cents_off_uncapped    = blocks_requested * Banner.cents_off_per_block
      site_cap_cents        = Site.site_type == PARTNER_STATION
                                ? Site.per_gallon_cap_cents
                                : Banner.max_cents_off_per_gallon
      cents_off_per_gallon  = min(cents_off_uncapped, site_cap_cents)
      blocks_effective      = cents_off_per_gallon / Banner.cents_off_per_block
      points_debited_at_auth = blocks_effective * Banner.points_per_discount_block
      gallons_authorized    = Site.site_type == PARTNER_STATION
                                ? Site.max_gallons_per_redemption
                                : Banner.owned_max_gallons_per_redemption
    constants:
      POINTS_PER_DISCOUNT_BLOCK: "Banner.points_per_discount_block (fixture value 100)"
      CENTS_OFF_PER_BLOCK: "Banner.cents_off_per_block (fixture value 10)"
      OWNED_MAX_CENTS_OFF_PER_GALLON: "Banner.max_cents_off_per_gallon (fixture value 100)"
      OWNED_MAX_GALLONS_PER_REDEMPTION: "Banner.owned_max_gallons_per_redemption (fixture value 35)"
    precision: |
      All quantities are integers; floor (not round) converts points to blocks, so
      points_committed that is not a whole multiple of points_per_discount_block
      leaves a remainder that is never debited. Capping happens in CENTS, and the
      debit is then back-derived from the capped cents — the uncapped remainder of
      points is left in the member's balance rather than being consumed and wasted.
    worked_example: |
      Banner B_MAIN: points_per_discount_block 100, cents_off_per_block 10,
      max_cents_off_per_gallon 100, owned_max_gallons_per_redemption 35.
      Site S_PARTNER: PARTNER_STATION, per_gallon_cap_cents 30,
      max_gallons_per_redemption 20.
      (a) points_committed 600 at S_PARTNER:
          blocks_requested 6, cents_off_uncapped 60, site_cap 30,
          cents_off_per_gallon 30, blocks_effective 3,
          points_debited_at_auth 300, gallons_authorized 20.
          300 of the 600 committed points are NOT debited.
      (b) points_committed 649 at an OWNED_FUEL_CENTER:
          blocks_requested 6 (floor(6.49)), cents_off_uncapped 60, site_cap 100,
          cents_off_per_gallon 60, blocks_effective 6,
          points_debited_at_auth 600, gallons_authorized 35. The 49-point
          remainder is never debited.
      (c) points_committed 1200 at an OWNED_FUEL_CENTER:
          blocks_requested 12, cents_off_uncapped 120, site_cap 100,
          cents_off_per_gallon 100, blocks_effective 10,
          points_debited_at_auth 1000, gallons_authorized 35.

  - name: redemption_discount_amount
    trigger: "POST /fuel-redemptions/{id}/complete"
    algorithm_type: aggregation
    input_set: "the submitted gallons_dispensed and the redemption's stored cents_off_per_gallon"
    formula: |
      reject when gallons_dispensed <= 0 or gallons_dispensed > FuelRedemption.gallons_authorized
      discount_amount_cents = round_half_up(gallons_dispensed * FuelRedemption.cents_off_per_gallon)
    constants: {}
    precision: |
      gallons_dispensed carries 3 decimal places (thousandths of a gallon, as pumps
      report). The product is rounded half-up to whole cents. Over-dispense is a
      hard rejection (ERR_GALLONS_EXCEED_AUTHORIZATION), never a silent clamp to
      gallons_authorized, and the redemption stays AUTHORIZED when it is rejected.
    worked_example: |
      cents_off_per_gallon 30, gallons_authorized 20.000.
      (a) gallons_dispensed 12.345 -> 12.345 * 30 = 370.35 -> 370 cents.
      (b) gallons_dispensed 19.985 -> 19.985 * 30 = 599.55 -> 600 cents (half up).
      (c) gallons_dispensed 20.000 -> 600 cents; exactly at the authorization, allowed.
      (d) gallons_dispensed 20.001 -> ERR_GALLONS_EXCEED_AUTHORIZATION (422);
          discount_amount_cents stays null and authorization_status stays AUTHORIZED.

  - name: settlement_batch_reimbursement
    trigger: "POST /settlement-batches/{id}/submit"
    algorithm_type: tiered_pricing
    input_set: "every FuelRedemption with site_id == SettlementBatch.site_id, settlement_status == PENDING, and dispensed_at within [SettlementBatch.period_start, SettlementBatch.period_end] INCLUSIVE on both ends"
    formula: |
      PINNED ORDER — the six steps run in exactly this sequence:
      (1) redemption_count          = count(input_set)
          gallons_total             = sum(r.gallons_dispensed for r in input_set)
      (2) gross_discount_cents      = sum(r.discount_amount_cents for r in input_set)
      (3) tier_rate_pct             = gallons_total <= TIER_LOW_MAX_GALLONS  -> TIER_LOW_RATE
                                      gallons_total <= TIER_MID_MAX_GALLONS  -> TIER_MID_RATE
                                      otherwise                              -> TIER_HIGH_RATE
      (4) pre_fee_reimbursement_cents = round_half_up(gross_discount_cents * tier_rate_pct)
      (5) admin_fee_cents           = min(ADMIN_FEE_CAP_CENTS,
                                          round_half_up(pre_fee_reimbursement_cents * ADMIN_FEE_PCT))
      (6) reimbursement_cents       = pre_fee_reimbursement_cents - admin_fee_cents
    constants:
      TIER_LOW_MAX_GALLONS: 500
      TIER_MID_MAX_GALLONS: 2000
      TIER_LOW_RATE: 0.85
      TIER_MID_RATE: 0.90
      TIER_HIGH_RATE: 0.95
      ADMIN_FEE_PCT: 0.015
      ADMIN_FEE_CAP_CENTS: 50000
    precision: |
      The tier is selected from the WHOLE gallons_total (a flat rate on the entire
      volume), not marginally per band. Rounding happens exactly twice: once at
      step (4) and once inside step (5). The admin fee is computed from the
      PRE-FEE reimbursement — computing it from the final reimbursement, or from
      gross_discount_cents, or applying the cap before the percentage, all give
      different answers. The band edges are INCLUSIVE upper bounds of the LOWER
      band: exactly 500.000 gallons is the LOW tier (0.85) and the MID tier begins
      at 500.001; exactly 2000.000 gallons is the MID tier (0.90) and the HIGH tier
      begins at 2000.001.
    worked_example: |
      (a) gallons_total 500.000, gross_discount_cents 15000:
          clause one (`<= 500`) matches -> tier_rate_pct 0.85,
          pre_fee = round_half_up(12750.0) = 12750,
          admin_fee = min(50000, round_half_up(191.25)) = 191,
          reimbursement_cents = 12559.
      (b) gallons_total 500.001, gross_discount_cents 15000:
          clause one fails, clause two matches -> tier_rate_pct 0.90,
          pre_fee = round_half_up(13500.0) = 13500,
          admin_fee = min(50000, round_half_up(202.5)) = 203  (half UP, not 202),
          reimbursement_cents = 13297.
          The one-thousandth-of-a-gallon step between (a) and (b) moves the
          reimbursement by 738 cents.
      (c) gallons_total 2000.000, gross_discount_cents 60000: clause two matches ->
          0.90, pre_fee 54000, admin_fee min(50000, 810) = 810, reimbursement 53190.
      (d) gallons_total 2000.001, gross_discount_cents 60000: clause three ->
          0.95, pre_fee 57000, admin_fee min(50000, 855) = 855, reimbursement 56145.
      (e) fee cap: gross_discount_cents 4_000_000 at 0.95 -> pre_fee 3_800_000,
          uncapped fee round_half_up(57000.0) = 57000 -> capped to 50000,
          reimbursement 3_750_000. Computing the fee from the final value instead
          would be self-referential; computing it from gross_discount_cents would
          give min(50000, 60000) = 50000 here but 225 instead of 191 in case (a).

  - name: point_expiry_sweep
    trigger: "POST /point-cycles/{id}/close"
    algorithm_type: chronological
    input_set: "for each Member with banner_id == PointCycle.banner_id, every PointLedgerEntry of that member with points_delta > 0 (the credit lots) and every entry with points_delta < 0 (the consumption), swept in Member.created_at ASC order"
    variants:
      - variant_id: LOT_FIFO
        selector: "Banner.expiry_basis == LOT_FIFO"
        formula: |
          lots        = credit entries of the member, ordered by lot_expires_at ASC,
                        then created_at ASC; entries with lot_expires_at == null sort LAST
          consumption = abs(sum(points_delta)) over entries with points_delta < 0
          Walk `lots` in that order, draining `consumption` from each lot's
          points_delta until `consumption` reaches 0; each lot's leftover is its
          unconsumed remainder.
          expiring_remainder = sum(remainder of every lot whose
                               lot_expires_at != null and lot_expires_at <= PointCycle.closes_at)
        description: "Oldest-expiring lot is spent first, so the soonest-to-expire points are protected from expiry by being consumed."
      - variant_id: CYCLE_SCOPED
        selector: "Banner.expiry_basis == CYCLE_SCOPED"
        formula: |
          lots        = credit entries of the member, ordered by lot_expires_at DESC,
                        then created_at DESC; entries with lot_expires_at == null sort FIRST
          consumption = abs(sum(points_delta)) over entries with points_delta < 0
          Walk `lots` in that order, draining `consumption` from each lot's
          points_delta until `consumption` reaches 0; each lot's leftover is its
          unconsumed remainder.
          expiring_remainder = sum(remainder of every lot whose
                               lot_expires_at != null and lot_expires_at <= PointCycle.closes_at)
        description: "Latest-expiring lot is spent first, so spending never rescues a soon-to-expire lot and the current cycle's points expire in full."
    formula: |
      Shared tail, identical for both variants:
        rollover_eligible = the member holds a HouseholdLink with status == ACTIVE to
                            a Household whose status == ACTIVE, AND that Household has
                            zero FraudSignal rows with status == OPEN
        rolled_over_points = rollover_eligible
                               ? min(expiring_remainder, Banner.rollover_cap_points)
                               : 0
        expired_points     = expiring_remainder - rolled_over_points
        when expired_points  > 0: append EXPIRY   entry, points_delta = -expiring_remainder,
                                  point_cycle_id = the closing cycle, lot_expires_at = null
        when rolled_over_points > 0: append ROLLOVER entry, points_delta = +rolled_over_points,
                                  point_cycle_id = the closing cycle,
                                  lot_expires_at = the NEXT cycle's closes_at
      Note the EXPIRY row always debits the FULL expiring_remainder and the ROLLOVER
      row credits the rescued part back; when expiring_remainder == rolled_over_points
      both rows are written (net zero) and when expiring_remainder == 0 neither is.
      PointCycle.expired_points_total     = sum of expired_points across members
      PointCycle.rolled_over_points_total = sum of rolled_over_points across members
      PointCycle.swept_member_count       = count of members for which at least one
                                            row was written
    constants:
      ROLLOVER_CAP_POINTS: "Banner.rollover_cap_points (fixture value 500 on B_MAIN, 0 on B_STRICT)"
    precision: "All values are whole points; no rounding occurs. Comparison against closes_at is <= (a lot expiring exactly at the cycle's closes_at instant is swept by that cycle)."
    worked_example: |
      Member M with two credit lots and one 300-point redemption:
        lot A: ACCRUAL +300, lot_expires_at 2026-09-30T23:59:59.999Z, created earlier
        lot B: ACCRUAL +300, lot_expires_at 2026-10-31T23:59:59.999Z, created later
        REDEMPTION -300
      Closing cycle C_SEP (closes_at 2026-09-30T23:59:59.999Z),
      Banner.rollover_cap_points 0 so nothing is rescued.
      LOT_FIFO:     lots ordered [A, B]; the 300 consumption drains A to 0;
                    A remainder 0, B remainder 300; B's lot_expires_at is after
                    closes_at -> expiring_remainder 0 -> NO rows written ->
                    Member.available_points stays 300.
      CYCLE_SCOPED: lots ordered [B, A]; the 300 consumption drains B to 0;
                    B remainder 0, A remainder 300; A's lot_expires_at <= closes_at
                    -> expiring_remainder 300 -> EXPIRY -300 written ->
                    Member.available_points becomes 0.
      Same ledger, same cycle, same clock; the two variants differ by 300 points.

  - name: household_fraud_score
    trigger: "POST /fraud-signals, POST /fraud-signals/{id}/clear, the OVERDRAWN_AUTH signal written by HOP 4 of the purchase-void cascade, and the RAPID_TRANSFER signal written by POST /point-transfers; also evaluated read-only (no status change) by GET /households/{id}"
    algorithm_type: weighted_scoring
    input_set: "FraudSignal rows with household_id == this household and status == OPEN; CLEARED signals never contribute"
    variants:
      - variant_id: INSTANTANEOUS
        selector: "Banner.fraud_scoring_mode == INSTANTANEOUS"
        formula: "Household.fraud_score = sum(signal.severity_weight for signal in input_set)"
        description: "Raw severity sum; a signal never loses weight while it stays OPEN, so the score is independent of the logical clock."
      - variant_id: TRAILING_WEIGHTED
        selector: "Banner.fraud_scoring_mode == TRAILING_WEIGHTED"
        formula: |
          for each signal in input_set:
            days_open      = floor((logical_clock - signal.detected_at) / 86400 seconds)
            decay_factor   = max(DECAY_FLOOR, 1 - DECAY_PER_DAY * days_open)
            weighted       = signal.severity_weight * decay_factor
          Household.fraud_score = round_half_up(sum(weighted))
        description: "Severity decays 5% per whole elapsed day down to a 25% floor, so advancing the clock alone can drop a household under the freeze threshold — while never thawing an already-FROZEN household."
    formula: |
      After either variant produces Household.fraud_score, the shared tail runs:
        when fraud_score >= Banner.freeze_threshold_score and Household.status == ACTIVE
             -> Household.status = FROZEN, frozen_reason = AUTO_FRAUD_SCORE
        when fraud_score <  Banner.freeze_threshold_score
             -> no status change whatsoever (a FROZEN household stays FROZEN)
    constants:
      DECAY_PER_DAY: 0.05
      DECAY_FLOOR: 0.25
      FREEZE_THRESHOLD_SOURCE: "Banner.freeze_threshold_score (fixture value 60)"
    precision: "Weighted contributions are summed at full precision and the SUM is rounded half-up once; rounding each contribution first would drift. days_open uses floor on whole 86400-second days, so a signal 23h59m old still has days_open == 0 and decay_factor 1.0."
    worked_example: |
      Household H with two OPEN signals, both detected_at 2026-08-01T00:00:00Z:
        ALT_ID_SHARING severity_weight 35
        RAPID_TRANSFER severity_weight 45
      Banner.freeze_threshold_score 60.
      Logical clock 2026-08-11T00:00:00Z -> days_open = 10 for both.
      INSTANTANEOUS:     35 + 45 = 80  -> 80 >= 60 -> Household FROZEN.
      TRAILING_WEIGHTED: decay_factor = max(0.25, 1 - 0.05*10) = 0.50
                         35*0.50 + 45*0.50 = 17.5 + 22.5 = 40.0 -> 40
                         40 < 60 -> Household stays ACTIVE.
      At clock 2026-08-01T00:00:00Z (days_open 0) TRAILING_WEIGHTED also gives 80.
      At clock 2026-09-01T00:00:00Z (days_open 31) the floor binds:
                         max(0.25, 1-1.55) = 0.25 -> 8.75 + 11.25 = 20.0 -> 20.

  - name: member_balance_projection
    trigger: "GET /members/{id}, GET /members, and every write that appends a PointLedgerEntry"
    algorithm_type: projection
    input_set: "every PointLedgerEntry with member_id == Member.id, replayed in created_at ASC order"
    formula: |
      Member.available_points = sum(entry.points_delta) over ALL entries of the member
      Member.lifetime_points  = sum(entry.points_delta) over entries whose
                                entry_type IN {ACCRUAL, REVERSAL}
      Household.aggregate_available_points = sum(Member.available_points) over members
                                reachable by a HouseholdLink with status == ACTIVE
    constants: {}
    precision: |
      available_points is a pure ledger sum and MAY be negative — the purchase-void
      cascade deliberately drives it negative before the auto-void hops repair it.
      lifetime_points counts accruals net of their reversals only; redemptions,
      releases, transfers, expiries, rollovers and adjustments never touch it, so
      lifetime_points is monotonic except for reversals.
      Expiry is NOT applied on read: a lot whose lot_expires_at is already in the
      past on the logical clock still contributes to available_points until
      POST /point-cycles/{id}/close materializes its EXPIRY row.
    worked_example: |
      Entries for member M, in created_at order:
        ACCRUAL           +226
        REDEMPTION        -200
        REDEMPTION_RELEASE +200
        REVERSAL          -226
        ADJUSTMENT        +500
      available_points = 226 - 200 + 200 - 226 + 500 = 500
      lifetime_points  = 226 - 226 = 0

  - name: points_summary_projection
    trigger: "GET /members/{id}/points-summary"
    algorithm_type: forward_looking
    input_set: "the member's PointLedgerEntry rows plus the banner's PointCycle with status == OPEN that contains the logical clock"
    formula: |
      available_points        = calculations.member_balance_projection output
      open_cycle_id           = the banner's OPEN PointCycle containing the logical clock, else null
      pending_authorized_points = sum(FuelRedemption.points_debited_at_auth) over the
                                member's redemptions with authorization_status == AUTHORIZED
      projected_expiring_points, projected_rollover_points =
                                run calculations.point_expiry_sweep for this member
                                against the OPEN cycle WITHOUT writing any ledger row,
                                honouring Banner.expiry_basis
      projected_available_after_close = available_points - projected_expiring_points
    constants: {}
    precision: |
      This is a read-only forecast: it must never append a ledger row nor advance any
      version. It re-evaluates on every read, so authorizing a redemption, clearing a
      fraud signal (which can change rollover eligibility) or moving the clock changes
      the answer immediately. When no OPEN cycle contains the clock, open_cycle_id is
      null and both projected_* values are 0.
    worked_example: |
      Member M on B_MAIN (expiry_basis LOT_FIFO, rollover_cap_points 500), ACTIVE link
      to an ACTIVE household with zero OPEN fraud signals, OPEN cycle C_AUG:
        ACCRUAL +226 lot_expires_at 2026-09-30T23:59:59.999Z
        ACCRUAL +900 lot_expires_at 2026-08-31T23:59:59.999Z
        REDEMPTION -300
      available_points 826. LOT_FIFO drains the 300 from the 2026-08-31 lot first
      (it expires soonest), leaving that lot at 600; that lot expires <= C_AUG.closes_at
      -> projected_expiring 600 -> rollover min(600, 500) = 500 -> the EXPIRY/ROLLOVER
      pair would net -100 -> projected_available_after_close = 826 - 100 = 726.
      pending_authorized_points = 300.

  - name: overdraw_auto_void_selection
    trigger: "HOP 3 of the POSTED->VOIDED PurchaseTransaction cascade"
    algorithm_type: waterfall_allocation
    input_set: "FuelRedemption rows with member_id == the voided transaction's member_id and authorization_status == AUTHORIZED; DISPENSED, VOIDED and SUPERSEDED redemptions are never touched"
    formula: |
      candidates = input_set ordered by created_at DESC, then
                   points_debited_at_auth DESC (newest authorization is sacrificed first)
      balance    = Member.available_points after the REVERSAL row of HOP 2
      for each candidate in that order:
        stop when balance >= 0
        void the candidate (AUTHORIZED -> VOIDED)
        append REDEMPTION_RELEASE with points_delta = +candidate.points_debited_at_auth
        balance = balance + candidate.points_debited_at_auth
      when `candidates` is empty, or when the whole pool is exhausted and balance is
      still < 0, no further action is taken and Member.available_points is LEFT
      NEGATIVE — the reversal is never partially rolled back and no compensating
      accrual is invented.
    constants: {}
    precision: "Only whole redemptions are voided; a redemption is never partially released. The loop stops at the FIRST moment balance >= 0, so a single large authorization can satisfy a small overdraw and leave newer-but-smaller ones untouched only when it is itself the newest."
    worked_example: |
      Member M, available_points 226 before the void, with two AUTHORIZED redemptions
      (a member holds at most one AUTHORIZED redemption at a time under the supersede
      rule, so a multi-candidate pool only arises across banners with separate
      pump sessions; the ordering below is what the implementation must apply):
        R_OLD created 2026-08-01T02:00:00Z, points_debited_at_auth 100
        R_NEW created 2026-08-01T03:00:00Z, points_debited_at_auth 300
      Voiding a POSTED transaction worth 500 points drives balance to 226 - 500 = -274.
      Candidates ordered created_at DESC -> [R_NEW, R_OLD].
      Void R_NEW -> release +300 -> balance 26 >= 0 -> STOP. R_OLD stays AUTHORIZED.
      Two FraudSignals are NOT written — exactly one OVERDRAWN_AUTH signal
      (severity_weight 40) is written, one per redemption actually voided.
      Empty-pool case: the same void with zero AUTHORIZED redemptions leaves
      available_points at -274, writes no FraudSignal, and still succeeds with 200.

# ---------------------------------------------------------------------------
# §1.4 Validation Rules Table — evaluated in ascending `priority` order.
# The first rule whose check fails determines the response; no later rule runs.
# Priorities are numbered with gaps so future rules can be inserted without
# renumbering, and so §1.8 / §1.9 can cite a stable priority pair.
# ---------------------------------------------------------------------------
validations:

  # -- 10..25 : authentication, authorization, request shape ------------------
  - priority: 10
    category: auth
    check: "X-User-Role and X-User-ID headers are both present and non-empty, and X-User-Role is one of the seven roles in §1.7"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all

  - priority: 20
    category: auth
    check: "X-User-Role appears in the target endpoint's `roles` list"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: all

  - priority: 25
    category: business_constraint
    check: "every required field in the endpoint's `input` is present, every enum value is a declared member, every integer field is an integer, amount_cents / quantity / points_committed / severity_weight are >= 0, gallons_dispensed carries at most 3 decimals, timestamps parse as ISO-8601 UTC, `lines` is a non-empty array, period_start <= period_end, starts_at < ends_at, and cycle_month matches YYYY-MM"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: all

  # -- 30..32 : existence ----------------------------------------------------
  - priority: 30
    category: existence
    check: "every id in the request PATH resolves, validated left-to-right: the banner, site, household, member, household-link, promo-event, point-cycle, purchase-transaction, point-ledger-entry, fuel-redemption, settlement-batch, point-dispute or fraud-signal named by {id} exists"
    error_id: "ERR_BANNER_NOT_FOUND | ERR_SITE_NOT_FOUND | ERR_HOUSEHOLD_NOT_FOUND | ERR_MEMBER_NOT_FOUND | ERR_HOUSEHOLD_LINK_NOT_FOUND | ERR_PROMO_EVENT_NOT_FOUND | ERR_POINT_CYCLE_NOT_FOUND | ERR_PURCHASE_TRANSACTION_NOT_FOUND | ERR_LEDGER_ENTRY_NOT_FOUND | ERR_FUEL_REDEMPTION_NOT_FOUND | ERR_SETTLEMENT_BATCH_NOT_FOUND | ERR_POINT_DISPUTE_NOT_FOUND | ERR_FRAUD_SIGNAL_NOT_FOUND"
    http_status: 404
    applies_to: "all endpoints carrying a path id"

  - priority: 32
    category: existence
    check: "every id in the request BODY resolves, validated in the order the fields are listed in the endpoint's `input`"
    error_id: "ERR_BANNER_NOT_FOUND | ERR_SITE_NOT_FOUND | ERR_HOUSEHOLD_NOT_FOUND | ERR_MEMBER_NOT_FOUND | ERR_LEDGER_ENTRY_NOT_FOUND | ERR_POINT_DISPUTE_NOT_FOUND"
    http_status: 404
    applies_to: "POST /sites, POST /households, POST /members, POST /household-links, POST /promo-events, POST /point-cycles, POST /purchase-transactions, POST /point-transfers, POST /fuel-redemptions, POST /settlement-batches, POST /point-disputes, POST /fraud-signals"

  # -- 34..38 : ownership, segregation of duties, authority tiers ------------
  - priority: 34
    category: auth
    check: "for entity_backed roles the acting X-User-ID owns the resource: role Member requires X-User-ID == the target Member.id (or the redemption's / dispute's / transaction's member_id); roles StoreOperator, PumpTerminal and SettlementClerk require X-User-ID == the target Site.id (or the redemption's / batch's site_id). A clause is vacuously satisfied when the endpoint exposes no reference field of that clause's entity type, and opaque roles (ProgramAdmin, LoyaltyAnalyst, LoyaltySupervisor) are never subject to this rule"
    error_id: ERR_NOT_RESOURCE_OWNER
    http_status: 403
    applies_to: "GET /members/{id}, GET /members/{id}/points-summary, POST /purchase-transactions, POST /purchase-transactions/{id}/post, POST /purchase-transactions/{id}/void, POST /fuel-redemptions, POST /fuel-redemptions/{id}/complete, POST /fuel-redemptions/{id}/void, POST /point-transfers, POST /point-disputes, POST /settlement-batches, POST /settlement-batches/{id}/submit"

  - priority: 36
    category: auth
    check: "the acting X-User-ID differs from the user who created the artefact being approved: approve-adjustment requires X-User-ID != PointDispute.proposed_by_user_id; settlement approve and reject both require X-User-ID != SettlementBatch.submitted_by_user_id"
    error_id: ERR_SELF_APPROVAL_FORBIDDEN
    http_status: 403
    applies_to: "POST /point-disputes/{id}/approve-adjustment, POST /settlement-batches/{id}/approve, POST /settlement-batches/{id}/reject"

  - priority: 38
    category: auth
    check: "the acting role carries the authority tier required by the artefact: PointDispute.authority_tier == TIER3 requires X-User-Role == ProgramAdmin, while TIER1 and TIER2 accept LoyaltySupervisor or ProgramAdmin"
    error_id: ERR_TIER_AUTHORITY_REQUIRED
    http_status: 403
    applies_to: "POST /point-disputes/{id}/approve-adjustment"

  - priority: 39
    category: business_constraint
    check: "abs(proposed_points_delta) is within the ceiling of the requested authority_tier: TIER1 <= 500, TIER2 <= 5000, TIER3 unbounded"
    error_id: ERR_ADJUSTMENT_EXCEEDS_AUTHORITY
    http_status: 403
    applies_to: "POST /point-disputes/{id}/propose-adjustment"

  # -- 40 : optimistic concurrency ------------------------------------------
  - priority: 40
    category: state
    check: "expected_member_version equals Member.version"
    error_id: ERR_STALE_MEMBER_VERSION
    http_status: 412
    applies_to: "POST /fuel-redemptions"

  - priority: 40
    category: state
    check: "expected_site_version equals Site.version"
    error_id: ERR_STALE_SITE_VERSION
    http_status: 412
    applies_to: "POST /settlement-batches"

  # -- 42..48 : state preconditions -----------------------------------------
  - priority: 42
    category: state
    check: "every Household reachable from the acting Member by a HouseholdLink with status == ACTIVE has status == ACTIVE"
    error_id: ERR_HOUSEHOLD_FROZEN
    http_status: 409
    applies_to: "POST /fuel-redemptions, POST /point-transfers, POST /household-links/{id}/activate, POST /point-disputes"

  - priority: 44
    category: state
    check: "the Banner governing the operation has status == ACTIVE"
    error_id: ERR_BANNER_SUSPENDED
    http_status: 409
    applies_to: "POST /purchase-transactions/{id}/post, POST /fuel-redemptions, POST /point-transfers, POST /household-links/{id}/activate, POST /promo-events/{id}/activate, POST /settlement-batches/{id}/submit"

  - priority: 45
    category: state
    check: "the Site involved in the operation has status == ACTIVE"
    error_id: ERR_SITE_SUSPENDED
    http_status: 409
    applies_to: "POST /purchase-transactions/{id}/post, POST /fuel-redemptions, POST /settlement-batches, POST /settlement-batches/{id}/submit"

  - priority: 46
    category: state
    check: "the target entity's current state permits the requested transition per §1.2 (includes re-running a terminal transition, activating an ENDED promo, clearing an already-CLEARED signal, unfreezing a household that still has an OPEN ALT_ID_SHARING or GEO_IMPOSSIBLE signal, completing a non-AUTHORIZED redemption, and closing a cycle that is not CLOSING)"
    error_id: ERR_INVALID_STATE_TRANSITION
    http_status: 409
    applies_to: "all POST action endpoints"

  - priority: 48
    category: state
    check: "a PointCycle for the governing banner has status == OPEN and its [opens_at, closes_at] window contains the logical clock"
    error_id: ERR_CYCLE_NOT_OPEN
    http_status: 409
    applies_to: "POST /purchase-transactions/{id}/post, POST /purchase-transactions/{id}/void, POST /fuel-redemptions, POST /point-transfers, POST /point-disputes/{id}/approve-adjustment"

  - priority: 48
    category: state
    check: "the logical clock is strictly after PointCycle.closes_at"
    error_id: ERR_CYCLE_NOT_ENDED
    http_status: 409
    applies_to: "POST /point-cycles/{id}/begin-close"

  - priority: 49
    category: state
    check: "every PointCycle of the same banner with a lexicographically smaller cycle_month has status == CLOSED"
    error_id: ERR_PRIOR_CYCLE_NOT_CLOSED
    http_status: 409
    applies_to: "POST /point-cycles/{id}/begin-close"

  # -- 50..54 : business safety (fraud and identity) ------------------------
  - priority: 50
    category: business_safety
    check: "the sending member's household has fewer than 2 FraudSignal rows with status == OPEN and no OPEN signal with signal_type IN {RAPID_TRANSFER, ALT_ID_SHARING}"
    error_id: ERR_TRANSFER_FRAUD_LOCK
    http_status: 403
    applies_to: "POST /point-transfers"

  - priority: 52
    category: business_safety
    check: "alt_id_presented at the pump equals Member.alt_id exactly (case-sensitive, no normalisation)"
    error_id: ERR_ALT_ID_MISMATCH
    http_status: 422
    applies_to: "POST /fuel-redemptions"

  - priority: 54
    category: business_safety
    check: "when Site.banner_id != Member.banner_id, the member holds a HouseholdLink with status == ACTIVE to a Household whose banner_id == Site.banner_id"
    error_id: ERR_CROSS_BANNER_LINK_REQUIRED
    http_status: 422
    applies_to: "POST /fuel-redemptions"

  # -- 56..60 : business temporal (windows, periods, open-work limits) -------
  - priority: 56
    category: business_temporal
    check: "the new or activating PromoEvent does not overlap an existing PromoEvent of the same banner with status IN {SCHEDULED, ACTIVE}, an intersecting applies_to_categories set and an equal stack_priority; windows are half-open [starts_at, ends_at) so back-to-back events touching at one instant are allowed"
    error_id: ERR_PROMO_WINDOW_CONFLICT
    http_status: 409
    applies_to: "POST /promo-events, POST /promo-events/{id}/activate"

  - priority: 58
    category: business_temporal
    check: "the new SettlementBatch period does not overlap the period of an existing batch for the same site_id with status IN {SUBMITTED, APPROVED}; periods are closed [period_start, period_end] so touching endpoints DO overlap and a following period must begin strictly after the prior period_end (a gap of one millisecond is sufficient). An existing DRAFT batch never blocks: it is superseded to REJECTED instead"
    error_id: ERR_BATCH_PERIOD_OVERLAP
    http_status: 409
    applies_to: "POST /settlement-batches"

  - priority: 60
    category: business_constraint
    check: "the site has fewer than MAX_OPEN_BATCHES (2) SettlementBatch rows with status IN {DRAFT, SUBMITTED}, counted AFTER any DRAFT supersede has been applied"
    error_id: ERR_OPEN_BATCH_LIMIT
    http_status: 409
    applies_to: "POST /settlement-batches"

  # -- 62..68 : business referential and constraint -------------------------
  - priority: 62
    category: business_referential
    check: "the transfer recipient holds a HouseholdLink with status == ACTIVE to the same Household as the sender, and recipient_member_id != member_id"
    error_id: ERR_RECIPIENT_NOT_IN_HOUSEHOLD
    http_status: 422
    applies_to: "POST /point-transfers"

  - priority: 62
    category: business_referential
    check: "the disputed PointLedgerEntry belongs to the member named in the dispute"
    error_id: ERR_DISPUTE_ENTRY_MEMBER_MISMATCH
    http_status: 422
    applies_to: "POST /point-disputes"

  - priority: 63
    category: business_referential
    check: "Site.site_type == GROCERY for a purchase transaction"
    error_id: ERR_GROCERY_SITE_REQUIRED
    http_status: 422
    applies_to: "POST /purchase-transactions"

  - priority: 63
    category: business_referential
    check: "Site.site_type IN {OWNED_FUEL_CENTER, PARTNER_STATION} for a fuel redemption"
    error_id: ERR_FUEL_SITE_REQUIRED
    http_status: 422
    applies_to: "POST /fuel-redemptions"

  - priority: 63
    category: business_referential
    check: "Site.site_type == PARTNER_STATION for a settlement batch, and Site.partner_code is non-null"
    error_id: ERR_PARTNER_SITE_REQUIRED
    http_status: 422
    applies_to: "POST /settlement-batches"

  - priority: 64
    category: business_constraint
    check: "points is a positive whole multiple of Banner.points_per_discount_block"
    error_id: ERR_INVALID_TRANSFER_AMOUNT
    http_status: 422
    applies_to: "POST /point-transfers"

  - priority: 66
    category: business_constraint
    check: "the sender's household has recorded fewer than Banner.max_transfers_per_cycle TRANSFER_OUT ledger entries against the currently OPEN PointCycle"
    error_id: ERR_TRANSFER_LIMIT_EXCEEDED
    http_status: 409
    applies_to: "POST /point-transfers"

  - priority: 68
    category: business_constraint
    check: "a PointCycle exists for the banner whose cycle_month is the calendar month immediately after the OPEN cycle's cycle_month, so an ACCRUAL / ROLLOVER / positive ADJUSTMENT lot can be given a lot_expires_at"
    error_id: ERR_NEXT_CYCLE_NOT_DEFINED
    http_status: 422
    applies_to: "POST /purchase-transactions/{id}/post, POST /point-cycles/{id}/close, POST /point-disputes/{id}/approve-adjustment"

  # -- 69 : uniqueness and structural constraints ---------------------------
  - priority: 69
    category: business_constraint
    check: "alt_id is unique across all members of the same banner_id"
    error_id: ERR_ALT_ID_DUPLICATE
    http_status: 409
    applies_to: "POST /members"

  - priority: 69
    category: business_constraint
    check: "household_code is unique across all households of the same banner_id"
    error_id: ERR_HOUSEHOLD_CODE_DUPLICATE
    http_status: 409
    applies_to: "POST /households"

  - priority: 69
    category: business_constraint
    check: "cycle_month is unique per banner_id"
    error_id: ERR_CYCLE_MONTH_DUPLICATE
    http_status: 409
    applies_to: "POST /point-cycles"

  - priority: 69
    category: business_constraint
    check: "no other HouseholdLink for the same (household_id, member_id) pair has status IN {PENDING, ACTIVE, SUSPENDED}"
    error_id: ERR_DUPLICATE_ACTIVE_LINK
    http_status: 409
    applies_to: "POST /household-links"

  - priority: 69
    category: business_constraint
    check: "when link_role == PRIMARY, no other HouseholdLink of the same household_id with link_role == PRIMARY has status IN {PENDING, ACTIVE, SUSPENDED}"
    error_id: ERR_PRIMARY_LINK_EXISTS
    http_status: 409
    applies_to: "POST /household-links, POST /household-links/{id}/activate"

  - priority: 69
    category: business_constraint
    check: "the supersedes_dispute_id chain is at most 3 disputes long, and the superseded dispute has status == RESOLVED_DENIED"
    error_id: ERR_SUPERSEDE_CHAIN_TOO_LONG
    http_status: 409
    applies_to: "POST /point-disputes"

  - priority: 70
    category: business_constraint
    check: "points_committed >= Banner.min_points_per_redemption"
    error_id: ERR_BELOW_MIN_REDEMPTION
    http_status: 422
    applies_to: "POST /fuel-redemptions"

  # -- 72..76 : business fiscal (balances, gallons, settleable volume) -------
  - priority: 72
    category: business_fiscal
    check: "Member.available_points >= the points_debited_at_auth computed by calculations.redemption_authorization (redemption) or >= the requested points (transfer)"
    error_id: ERR_INSUFFICIENT_POINTS
    http_status: 422
    applies_to: "POST /fuel-redemptions, POST /point-transfers"

  - priority: 74
    category: business_fiscal
    check: "0 < gallons_dispensed <= FuelRedemption.gallons_authorized"
    error_id: ERR_GALLONS_EXCEED_AUTHORIZATION
    http_status: 422
    applies_to: "POST /fuel-redemptions/{id}/complete"

  - priority: 76
    category: business_fiscal
    check: "at least one FuelRedemption at the batch's site has settlement_status == PENDING and dispensed_at within the batch's inclusive period"
    error_id: ERR_NO_SETTLEABLE_GALLONS
    http_status: 422
    applies_to: "POST /settlement-batches/{id}/submit"

# ---------------------------------------------------------------------------
# Declared priority conflicts (rule_id priority_pair_validation_conflict)
# 1. state ERR_HOUSEHOLD_FROZEN (42) beats business_fiscal ERR_INSUFFICIENT_POINTS
#    (72) on POST /fuel-redemptions — a frozen household with a zero balance
#    returns 409 ERR_HOUSEHOLD_FROZEN, never 422 ERR_INSUFFICIENT_POINTS.
# 2. business_safety ERR_TRANSFER_FRAUD_LOCK (50) beats business_referential
#    ERR_RECIPIENT_NOT_IN_HOUSEHOLD (62) on POST /point-transfers — a
#    fraud-locked sender naming an unrelated recipient returns 403
#    ERR_TRANSFER_FRAUD_LOCK, never 422 ERR_RECIPIENT_NOT_IN_HOUSEHOLD.
# ---------------------------------------------------------------------------

# ---------------------------------------------------------------------------
# §1.5 API Endpoint Table
# Every single-id path parameter is spelled `{id}`.
# ---------------------------------------------------------------------------
endpoints:

  # -- Banner ---------------------------------------------------------------
  - method: POST
    path: "/banners"
    description: "Register a loyalty banner and its full rule configuration."
    roles: [ProgramAdmin]
    code: 201
    input: [banner_code, name, "base_points_per_dollar?", "gift_card_multiplier?", "pharmacy_multiplier?", "pharmacy_points_per_script?", "max_stacked_multiplier?", "max_stack_count?", "points_per_discount_block?", "cents_off_per_block?", "max_cents_off_per_gallon?", "owned_max_gallons_per_redemption?", "min_points_per_redemption?", "rollover_cap_points?", "max_transfers_per_cycle?", "expiry_basis?", "fraud_scoring_mode?", "freeze_threshold_score?"]
    output: Banner
    side_effects: ["creates the Banner with status ACTIVE and every omitted knob at its declared default"]

  - method: GET
    path: "/banners/{id}"
    description: "Fetch one banner with its rule configuration."
    roles: [ProgramAdmin, LoyaltyAnalyst, LoyaltySupervisor, StoreOperator, SettlementClerk]
    code: 200
    input: []
    output: Banner
    side_effects: []

  - method: POST
    path: "/banners/{id}/suspend"
    description: "Suspend a banner, blocking accrual, redemption, transfer, link activation, promo activation and settlement submission across it."
    roles: [ProgramAdmin]
    code: 200
    input: []
    output: Banner
    side_effects: ["sets Banner.status = SUSPENDED"]

  - method: GET
    path: "/banners/{id}/promo-events"
    description: "List every promotional multiplier event configured on this banner, ordered by stack_priority DESC then created_at ASC."
    roles: [ProgramAdmin, LoyaltyAnalyst, LoyaltySupervisor, StoreOperator]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: PromoEvent[]
    side_effects: []

  - method: GET
    path: "/banners/{id}/households"
    description: "List every household registered under this banner, ordered by created_at ASC."
    roles: [ProgramAdmin, LoyaltyAnalyst, LoyaltySupervisor]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: Household[]
    side_effects: []

  # -- Site -----------------------------------------------------------------
  - method: POST
    path: "/sites"
    description: "Register a grocery store, an owned fuel center, or a partner station with its per-gallon cap."
    roles: [ProgramAdmin]
    code: 201
    input: [banner_id, site_number, site_type, "partner_code?", "per_gallon_cap_cents?", "max_gallons_per_redemption?"]
    output: Site
    side_effects: ["creates the Site with status ACTIVE, version 1, and zeroed unbatched_gallons, unbatched_discount_cents and settlement_balance_cents"]

  - method: GET
    path: "/sites/{id}"
    description: "Fetch one site including its live unbatched settlement pool and its current version for optimistic concurrency."
    roles: [ProgramAdmin, LoyaltyAnalyst, LoyaltySupervisor, StoreOperator, PumpTerminal, SettlementClerk]
    code: 200
    input: []
    output: Site
    side_effects: []

  - method: GET
    path: "/sites"
    description: "List sites, filterable by banner, type and status; ordered by created_at ASC."
    roles: [ProgramAdmin, LoyaltyAnalyst, LoyaltySupervisor, SettlementClerk]
    code: 200
    input: ["banner_id?", "site_type?", "status?", "limit?", "offset?"]
    output: Site[]
    side_effects: []

  - method: POST
    path: "/sites/{id}/suspend"
    description: "Suspend a site, blocking purchase posting, redemption authorization and settlement batch creation or submission at it."
    roles: [ProgramAdmin]
    code: 200
    input: []
    output: Site
    side_effects: ["sets Site.status = SUSPENDED and increments Site.version by 1"]

  # -- Household ------------------------------------------------------------
  - method: POST
    path: "/households"
    description: "Open a household account that members can be linked to."
    roles: [ProgramAdmin, LoyaltyAnalyst]
    code: 201
    input: [banner_id, household_code]
    output: Household
    side_effects: ["creates the Household with status ACTIVE, fraud_score 0, linked_member_count 0 and version 1"]

  - method: GET
    path: "/households/{id}"
    description: "Fetch one household with its recomputed linkage counts, aggregate available points, cross-banner member ids and fraud score."
    roles: [ProgramAdmin, LoyaltyAnalyst, LoyaltySupervisor, PumpTerminal]
    code: 200
    input: []
    output: Household
    side_effects: ["projects fraud_score per calculations.household_fraud_score against the current logical clock for the response only — this read never changes Household.status and never advances Household.version; the freeze evaluation runs solely on the write triggers listed in calculations.household_fraud_score"]

  - method: GET
    path: "/households/{id}/fraud-signals"
    description: "List every fraud signal raised against this household, ordered by detected_at ASC then created_at ASC."
    roles: [ProgramAdmin, LoyaltyAnalyst, LoyaltySupervisor]
    code: 200
    input: ["status?", "signal_type?", "limit?", "offset?"]
    output: FraudSignal[]
    side_effects: []

  - method: POST
    path: "/households/{id}/freeze"
    description: "Manually freeze a household, blocking transfers and cross-banner redemptions for every linked member."
    roles: [LoyaltySupervisor, ProgramAdmin]
    code: 200
    input: []
    output: Household
    side_effects: ["Household ACTIVE -> FROZEN with frozen_reason MANUAL"]

  - method: POST
    path: "/households/{id}/unfreeze"
    description: "Manually thaw a frozen household. This is the only path out of FROZEN — a decayed fraud score never thaws a household on its own."
    roles: [LoyaltySupervisor, ProgramAdmin]
    code: 200
    input: []
    output: Household
    side_effects: ["Household FROZEN -> ACTIVE, clearing frozen_reason and frozen_at"]

  # -- Member ---------------------------------------------------------------
  - method: POST
    path: "/members"
    description: "Enroll a loyalty member with the alternate ID they will key at the pump."
    roles: [ProgramAdmin, LoyaltyAnalyst, StoreOperator]
    code: 201
    input: [banner_id, alt_id, card_number, full_name]
    output: Member
    side_effects: ["creates the Member with available_points 0, lifetime_points 0 and version 1"]

  - method: GET
    path: "/members/{id}"
    description: "Fetch one member with the ledger-projected available_points and lifetime_points, plus the version required by POST /fuel-redemptions."
    roles: [ProgramAdmin, LoyaltyAnalyst, LoyaltySupervisor, StoreOperator, PumpTerminal, Member]
    code: 200
    input: []
    output: Member
    side_effects: ["recomputes available_points and lifetime_points per calculations.member_balance_projection"]

  - method: GET
    path: "/members"
    description: "List members, filterable by banner, alternate ID and card number; this is the pump's alternate-ID lookup channel."
    roles: [ProgramAdmin, LoyaltyAnalyst, LoyaltySupervisor, StoreOperator, PumpTerminal]
    code: 200
    input: ["banner_id?", "alt_id?", "card_number?", "limit?", "offset?"]
    output: Member[]
    side_effects: []

  - method: GET
    path: "/members/{id}/points-summary"
    description: "Forward-looking points forecast: current balance, points held by an open authorization, and what the next cycle close would expire or roll over."
    roles: [ProgramAdmin, LoyaltyAnalyst, LoyaltySupervisor, PumpTerminal, Member]
    code: 200
    input: []
    output: "{ member_id: string, available_points: integer, open_cycle_id: string, pending_authorized_points: integer, projected_expiring_points: integer, projected_rollover_points: integer, projected_available_after_close: integer }"
    side_effects: ["runs calculations.points_summary_projection read-only; writes no ledger row and advances no version"]

  # -- HouseholdLink --------------------------------------------------------
  - method: POST
    path: "/household-links"
    description: "Propose a household linkage for a member; the link starts PENDING and must be activated before it grants cross-banner redemption or transfer rights."
    roles: [ProgramAdmin, LoyaltyAnalyst]
    code: 201
    input: [household_id, member_id, link_role]
    output: HouseholdLink
    side_effects: ["creates the HouseholdLink with status PENDING and is_cross_banner = (Household.banner_id != Member.banner_id)"]

  - method: GET
    path: "/household-links/{id}"
    description: "Fetch one household linkage."
    roles: [ProgramAdmin, LoyaltyAnalyst, LoyaltySupervisor, PumpTerminal, Member]
    code: 200
    input: []
    output: HouseholdLink
    side_effects: []

  - method: GET
    path: "/household-links"
    description: "List household linkages, filterable by household, member, role and status."
    roles: [ProgramAdmin, LoyaltyAnalyst, LoyaltySupervisor, PumpTerminal]
    code: 200
    input: ["household_id?", "member_id?", "link_role?", "status?", "limit?", "offset?"]
    output: HouseholdLink[]
    side_effects: []

  - method: POST
    path: "/household-links/{id}/activate"
    description: "Activate a PENDING or SUSPENDED linkage. The same endpoint serves both source states, which is what makes the linkage lifecycle cyclic."
    roles: [LoyaltyAnalyst, ProgramAdmin]
    code: 200
    input: []
    output: HouseholdLink
    side_effects: ["HouseholdLink PENDING|SUSPENDED -> ACTIVE", "recomputes Household.linked_member_count, aggregate_available_points and cross_banner_member_ids and increments Household.version"]

  - method: POST
    path: "/household-links/{id}/suspend"
    description: "Suspend an ACTIVE linkage without voiding the member's open authorizations."
    roles: [LoyaltyAnalyst, ProgramAdmin]
    code: 200
    input: []
    output: HouseholdLink
    side_effects: ["HouseholdLink ACTIVE -> SUSPENDED", "recomputes the household's derived linkage fields and increments Household.version"]

  - method: POST
    path: "/household-links/{id}/revoke"
    description: "Permanently revoke a linkage. From ACTIVE this fires the depth-3 cascade that recomputes household coverage and voids the member's cross-banner authorizations."
    roles: [LoyaltyAnalyst, ProgramAdmin]
    code: 200
    input: []
    output: HouseholdLink
    side_effects: ["HouseholdLink -> REVOKED", "HOP 2 recomputes Household.linked_member_count, aggregate_available_points and cross_banner_member_ids", "HOP 3 voids the member's AUTHORIZED cross-banner FuelRedemptions and appends a REDEMPTION_RELEASE ledger entry per void"]

  # -- PromoEvent -----------------------------------------------------------
  - method: POST
    path: "/promo-events"
    description: "Schedule a promotional multiplier event over a half-open [starts_at, ends_at) window for a set of purchase categories."
    roles: [ProgramAdmin]
    code: 201
    input: [banner_id, promo_code, multiplier, applies_to_categories, starts_at, ends_at, stack_priority]
    output: PromoEvent
    side_effects: ["creates the PromoEvent with status SCHEDULED"]

  - method: POST
    path: "/promo-events/{id}/activate"
    description: "Activate a scheduled promotional event, making it eligible for the accrual multiplier stack."
    roles: [ProgramAdmin]
    code: 200
    input: []
    output: PromoEvent
    side_effects: ["PromoEvent SCHEDULED -> ACTIVE"]

  # -- PointCycle -----------------------------------------------------------
  - method: POST
    path: "/point-cycles"
    description: "Define a monthly point cycle for a banner. Accrual lots expire at the end of the month AFTER the cycle they were earned in, so the next month's cycle must exist before points can be accrued."
    roles: [ProgramAdmin, LoyaltySupervisor]
    code: 201
    input: [banner_id, cycle_month, opens_at, closes_at]
    output: PointCycle
    side_effects: ["creates the PointCycle with status OPEN and zeroed sweep totals"]

  - method: GET
    path: "/point-cycles/{id}"
    description: "Fetch one point cycle with its expiry and rollover totals."
    roles: [ProgramAdmin, LoyaltyAnalyst, LoyaltySupervisor, StoreOperator]
    code: 200
    input: []
    output: PointCycle
    side_effects: []

  - method: GET
    path: "/point-cycles"
    description: "List point cycles, filterable by banner and status; ordered by cycle_month ASC."
    roles: [ProgramAdmin, LoyaltyAnalyst, LoyaltySupervisor, StoreOperator]
    code: 200
    input: ["banner_id?", "status?", "limit?", "offset?"]
    output: PointCycle[]
    side_effects: []

  - method: POST
    path: "/point-cycles/{id}/begin-close"
    description: "Freeze a cycle for closing once its window has elapsed and every earlier cycle of the banner is CLOSED. Accrual, redemption, transfer and adjustment for the banner stop here."
    roles: [LoyaltySupervisor, ProgramAdmin]
    code: 200
    input: []
    output: PointCycle
    side_effects: ["PointCycle OPEN -> CLOSING"]

  - method: POST
    path: "/point-cycles/{id}/close"
    description: "Run the month-boundary sweep: expire unconsumed expiring lots, roll over the eligible remainder up to the banner cap, and end every promotional event whose window has elapsed."
    roles: [LoyaltySupervisor, ProgramAdmin]
    code: 200
    input: []
    output: PointCycle
    side_effects: ["PointCycle CLOSING -> CLOSED", "runs calculations.point_expiry_sweep per member in the banner, appending EXPIRY and ROLLOVER ledger entries", "recomputes every affected Member.available_points and every affected Household.aggregate_available_points", "writes expired_points_total, rolled_over_points_total and swept_member_count", "ends every SCHEDULED or ACTIVE PromoEvent of the banner whose ends_at <= closes_at"]

  # -- PurchaseTransaction --------------------------------------------------
  - method: POST
    path: "/purchase-transactions"
    description: "Record a basket at a grocery site. Recording does not accrue points; posting does."
    roles: [StoreOperator, ProgramAdmin]
    code: 201
    input: [member_id, site_id, transacted_at, lines]
    output: PurchaseTransaction
    side_effects: ["creates the PurchaseTransaction with posting_status RECORDED, accrual_status NOT_ACCRUED and computed subtotal_cents"]

  - method: GET
    path: "/purchase-transactions/{id}"
    description: "Fetch one purchase transaction with its per-line point breakdown and the promo events that were applied."
    roles: [ProgramAdmin, LoyaltyAnalyst, LoyaltySupervisor, StoreOperator, Member]
    code: 200
    input: []
    output: PurchaseTransaction
    side_effects: []

  - method: GET
    path: "/purchase-transactions"
    description: "List purchase transactions, filterable by member, site and posting status."
    roles: [ProgramAdmin, LoyaltyAnalyst, LoyaltySupervisor, StoreOperator]
    code: 200
    input: ["member_id?", "site_id?", "posting_status?", "accrual_status?", "limit?", "offset?"]
    output: PurchaseTransaction[]
    side_effects: []

  - method: POST
    path: "/purchase-transactions/{id}/post"
    description: "Post a recorded basket, running the category and promotional multiplier stack and accruing the resulting points as a dated lot."
    roles: [StoreOperator, ProgramAdmin]
    code: 200
    input: []
    output: PurchaseTransaction
    side_effects: ["posting_status RECORDED -> POSTED and accrual_status NOT_ACCRUED -> ACCRUED", "runs calculations.promo_multiplier_stack then calculations.purchase_point_accrual", "appends an ACCRUAL PointLedgerEntry when gross_points_awarded > 0, with lot_expires_at = the next cycle's closes_at", "recomputes Member.available_points / lifetime_points and increments Member.version"]

  - method: POST
    path: "/purchase-transactions/{id}/void"
    description: "Void a basket. From RECORDED this is a bare status flip; from POSTED it fires the depth-5 cascade through reversal, overdraw auto-void, fraud signalling and household freeze."
    roles: [StoreOperator, ProgramAdmin]
    code: 200
    input: []
    output: PurchaseTransaction
    side_effects: ["posting_status -> VOIDED", "from POSTED only: accrual_status ACCRUED -> REVERSED and a REVERSAL PointLedgerEntry of -gross_points_awarded is appended", "from POSTED only: calculations.overdraw_auto_void_selection voids AUTHORIZED redemptions while available_points < 0, appending REDEMPTION_RELEASE entries", "from POSTED only: one OVERDRAWN_AUTH FraudSignal per auto-voided redemption, then calculations.household_fraud_score, which can flip the Household to FROZEN"]

  # -- PointLedgerEntry and transfers ---------------------------------------
  - method: GET
    path: "/point-ledger-entries/{id}"
    description: "Fetch one immutable ledger entry."
    roles: [ProgramAdmin, LoyaltyAnalyst, LoyaltySupervisor, Member]
    code: 200
    input: []
    output: PointLedgerEntry
    side_effects: []

  - method: GET
    path: "/point-ledger-entries"
    description: "List ledger entries, filterable by member, cycle and entry type; ordered by created_at ASC. This is the audit channel for accrual, expiry, rollover, transfer and adjustment history."
    roles: [ProgramAdmin, LoyaltyAnalyst, LoyaltySupervisor, Member]
    code: 200
    input: ["member_id?", "point_cycle_id?", "entry_type?", "source_kind?", "limit?", "offset?"]
    output: PointLedgerEntry[]
    side_effects: []

  - method: POST
    path: "/point-transfers"
    description: "Transfer points between two members of the same household, in whole discount-block multiples, subject to the per-cycle transfer limit and the fraud lock."
    roles: [Member, LoyaltyAnalyst, ProgramAdmin]
    code: 201
    input: [member_id, recipient_member_id, points]
    output: PointLedgerEntry
    side_effects: ["appends a TRANSFER_OUT entry of -points for the sender and a TRANSFER_IN entry of +points for the recipient, whose lot_expires_at is the minimum lot_expires_at over the sender's unconsumed lots", "recomputes both members' available_points and increments both Member.version values", "when the household reaches Banner.max_transfers_per_cycle TRANSFER_OUT entries in the open cycle, appends a SYSTEM RAPID_TRANSFER FraudSignal of severity_weight 25 and reruns calculations.household_fraud_score", "returns the sender's TRANSFER_OUT entry"]

  # -- FuelRedemption -------------------------------------------------------
  - method: POST
    path: "/fuel-redemptions"
    description: "Authorize a discount at the pump against the alternate ID keyed by the customer. Debits only the points backing the capped cents-off and supersedes any prior open authorization for the member."
    roles: [PumpTerminal, ProgramAdmin]
    code: 201
    input: [member_id, site_id, alt_id_presented, points_committed, expected_member_version]
    output: FuelRedemption
    side_effects: ["runs calculations.redemption_authorization and appends a REDEMPTION PointLedgerEntry of -points_debited_at_auth", "supersedes the member's prior AUTHORIZED redemption to SUPERSEDED and releases its points", "recomputes Member.available_points and increments Member.version"]

  - method: GET
    path: "/fuel-redemptions/{id}"
    description: "Fetch one redemption with its capped cents-off, authorized gallons and settlement state."
    roles: [ProgramAdmin, LoyaltyAnalyst, LoyaltySupervisor, PumpTerminal, SettlementClerk, Member]
    code: 200
    input: []
    output: FuelRedemption
    side_effects: []

  - method: GET
    path: "/fuel-redemptions"
    description: "List redemptions, filterable by member, site, batch, authorization status and settlement status."
    roles: [ProgramAdmin, LoyaltyAnalyst, LoyaltySupervisor, PumpTerminal, SettlementClerk]
    code: 200
    input: ["member_id?", "site_id?", "settlement_batch_id?", "authorization_status?", "settlement_status?", "limit?", "offset?"]
    output: FuelRedemption[]
    side_effects: []

  - method: POST
    path: "/fuel-redemptions/{id}/complete"
    description: "Close out the fueling with the gallons actually dispensed. At a partner station this moves the redemption into the settlement pipeline; at an owned fuel center it does not."
    roles: [PumpTerminal, ProgramAdmin]
    code: 200
    input: [gallons_dispensed]
    output: FuelRedemption
    side_effects: ["authorization_status AUTHORIZED -> DISPENSED and runs calculations.redemption_discount_amount", "at a PARTNER_STATION only: settlement_status NOT_APPLICABLE -> PENDING and Site.unbatched_gallons / unbatched_discount_cents recomputed with Site.version incremented"]

  - method: POST
    path: "/fuel-redemptions/{id}/void"
    description: "Abandon an open authorization and release the points it was holding."
    roles: [PumpTerminal, ProgramAdmin]
    code: 200
    input: []
    output: FuelRedemption
    side_effects: ["authorization_status AUTHORIZED -> VOIDED", "appends a REDEMPTION_RELEASE PointLedgerEntry of +points_debited_at_auth", "recomputes Member.available_points and increments Member.version"]

  # -- SettlementBatch ------------------------------------------------------
  - method: POST
    path: "/settlement-batches"
    description: "Open a draft settlement batch for a partner station over a closed [period_start, period_end] period. A newer draft supersedes an overlapping draft; only SUBMITTED or APPROVED periods block."
    roles: [SettlementClerk, ProgramAdmin]
    code: 201
    input: [site_id, period_start, period_end, expected_site_version]
    output: SettlementBatch
    side_effects: ["creates the SettlementBatch with status DRAFT and zeroed totals", "drives any overlapping DRAFT batch of the same site DRAFT -> REJECTED", "increments Site.version by 1"]

  - method: GET
    path: "/settlement-batches/{id}"
    description: "Fetch one settlement batch with its tier rate, pre-fee reimbursement, admin fee and net reimbursement."
    roles: [ProgramAdmin, LoyaltyAnalyst, LoyaltySupervisor, SettlementClerk]
    code: 200
    input: []
    output: SettlementBatch
    side_effects: []

  - method: GET
    path: "/settlement-batches"
    description: "List settlement batches, filterable by site and status."
    roles: [ProgramAdmin, LoyaltyAnalyst, LoyaltySupervisor, SettlementClerk]
    code: 200
    input: ["site_id?", "status?", "limit?", "offset?"]
    output: SettlementBatch[]
    side_effects: []

  - method: POST
    path: "/settlement-batches/{id}/submit"
    description: "Claim every pending discounted gallon dispensed inside the batch period and price the reimbursement through the volume tier and the admin fee."
    roles: [SettlementClerk, ProgramAdmin]
    code: 200
    input: []
    output: SettlementBatch
    side_effects: ["status DRAFT -> SUBMITTED", "claims qualifying redemptions PENDING -> BATCHED", "runs calculations.settlement_batch_reimbursement", "recomputes Site.unbatched_gallons / unbatched_discount_cents and increments Site.version"]

  - method: POST
    path: "/settlement-batches/{id}/approve"
    description: "Approve a submitted batch, settling the claimed gallons and crediting the partner's settlement balance. The submitter may not approve their own batch."
    roles: [ProgramAdmin]
    code: 200
    input: []
    output: SettlementBatch
    side_effects: ["status SUBMITTED -> APPROVED", "claimed redemptions BATCHED -> SETTLED", "adds reimbursement_cents to Site.settlement_balance_cents and increments Site.version"]

  - method: POST
    path: "/settlement-batches/{id}/reject"
    description: "Reject a submitted batch, returning every claimed gallon to the site's unbatched pool and zeroing the batch totals."
    roles: [ProgramAdmin]
    code: 200
    input: []
    output: SettlementBatch
    side_effects: ["status SUBMITTED -> REJECTED", "claimed redemptions BATCHED -> PENDING with settlement_batch_id cleared", "restores Site.unbatched_gallons / unbatched_discount_cents to their pre-submit values, leaves Site.settlement_balance_cents untouched, and increments Site.version"]

  # -- PointDispute ---------------------------------------------------------
  - method: POST
    path: "/point-disputes"
    description: "File a balance dispute against a specific ledger entry, optionally superseding a previously denied dispute."
    roles: [Member, LoyaltyAnalyst, ProgramAdmin]
    code: 201
    input: [member_id, disputed_ledger_entry_id, claimed_points, reason_code, "supersedes_dispute_id?"]
    output: PointDispute
    side_effects: ["creates the PointDispute with status FILED"]

  - method: GET
    path: "/point-disputes/{id}"
    description: "Fetch one dispute with its proposed adjustment, authority tier and the ledger entry the resolution wrote."
    roles: [ProgramAdmin, LoyaltyAnalyst, LoyaltySupervisor, Member]
    code: 200
    input: []
    output: PointDispute
    side_effects: []

  - method: GET
    path: "/point-disputes"
    description: "List disputes, filterable by member, disputed entry, superseded dispute, applied entry and status."
    roles: [ProgramAdmin, LoyaltyAnalyst, LoyaltySupervisor, Member]
    code: 200
    input: ["member_id?", "disputed_ledger_entry_id?", "supersedes_dispute_id?", "applied_ledger_entry_id?", "status?", "limit?", "offset?"]
    output: PointDispute[]
    side_effects: []

  - method: POST
    path: "/point-disputes/{id}/investigate"
    description: "Take a filed dispute into investigation."
    roles: [LoyaltyAnalyst, ProgramAdmin]
    code: 200
    input: []
    output: PointDispute
    side_effects: ["status FILED -> INVESTIGATING"]

  - method: POST
    path: "/point-disputes/{id}/propose-adjustment"
    description: "Propose a manual point adjustment at a stated authority tier. The proposer is recorded and may not approve their own proposal."
    roles: [LoyaltyAnalyst, ProgramAdmin]
    code: 200
    input: [proposed_points_delta, authority_tier]
    output: PointDispute
    side_effects: ["status INVESTIGATING -> ADJUSTMENT_PROPOSED", "records proposed_points_delta, authority_tier and proposed_by_user_id"]

  - method: POST
    path: "/point-disputes/{id}/approve-adjustment"
    description: "Approve a proposed adjustment and write it to the ledger. TIER3 requires ProgramAdmin; no user may approve their own proposal."
    roles: [LoyaltySupervisor, ProgramAdmin]
    code: 200
    input: []
    output: PointDispute
    side_effects: ["status ADJUSTMENT_PROPOSED -> RESOLVED_UPHELD", "appends an ADJUSTMENT PointLedgerEntry of proposed_points_delta and records applied_ledger_entry_id", "recomputes Member.available_points and increments Member.version"]

  - method: POST
    path: "/point-disputes/{id}/deny"
    description: "Deny a dispute from INVESTIGATING or ADJUSTMENT_PROPOSED without writing any ledger entry, unlocking a superseding refile."
    roles: [LoyaltySupervisor, ProgramAdmin]
    code: 200
    input: []
    output: PointDispute
    side_effects: ["status -> RESOLVED_DENIED with resolved_at stamped and no ledger write"]

  # -- FraudSignal ----------------------------------------------------------
  - method: POST
    path: "/fraud-signals"
    description: "Raise an analyst fraud signal against a household. Crossing the banner's freeze threshold freezes the household immediately."
    roles: [LoyaltyAnalyst, ProgramAdmin]
    code: 201
    input: [household_id, signal_type, severity_weight]
    output: FraudSignal
    side_effects: ["creates the FraudSignal with status OPEN, source ANALYST and detected_at = the logical clock", "runs calculations.household_fraud_score and can drive Household ACTIVE -> FROZEN with frozen_reason AUTO_FRAUD_SCORE", "increments Household.version"]

  - method: POST
    path: "/fraud-signals/{id}/clear"
    description: "Clear an open fraud signal. The household's score is recomputed, but a frozen household is never thawed by this call."
    roles: [LoyaltyAnalyst, ProgramAdmin]
    code: 200
    input: []
    output: FraudSignal
    side_effects: ["status OPEN -> CLEARED with cleared_at and cleared_by_user_id stamped", "recomputes Household.fraud_score and increments Household.version without changing Household.status"]

  # -- Logical clock (test-driving endpoint) --------------------------------
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the server's logical UTC clock, which every timestamp default, window check, cycle boundary and fraud-decay computation reads. The server's startup default is exactly 2026-08-01T00:00:00Z and MUST NOT fall back to real wall-clock time before the first call."
    roles: [ProgramAdmin]
    code: 200
    input: [to_iso8601]
    output: "{ current_utc: datetime }"
    side_effects: ["moves the logical clock", "changes the result of calculations.household_fraud_score under TRAILING_WEIGHTED and the OPEN-cycle window checks; performs no writes of its own"]

# ---------------------------------------------------------------------------
# §1.6 Error Code Catalog — 53 codes
# ---------------------------------------------------------------------------
errors:

  # -- authentication, authorization, shape ---------------------------------
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "X-User-Role or X-User-ID header missing, empty, or X-User-Role not one of the seven declared roles"
  - id: ERR_UNAUTHORIZED
    http: 403
    condition: "the acting role is not listed in the target endpoint's roles"
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "missing required field, unknown enum member, non-integer where an integer is required, negative amount / quantity / points, more than 3 decimals on gallons_dispensed, unparsable timestamp, empty lines array, period_start > period_end, starts_at >= ends_at, or cycle_month not matching YYYY-MM"

  # -- existence -------------------------------------------------------------
  - id: ERR_BANNER_NOT_FOUND
    http: 404
    condition: "the banner id in the path or body does not resolve"
  - id: ERR_SITE_NOT_FOUND
    http: 404
    condition: "the site id in the path or body does not resolve"
  - id: ERR_HOUSEHOLD_NOT_FOUND
    http: 404
    condition: "the household id in the path or body does not resolve"
  - id: ERR_MEMBER_NOT_FOUND
    http: 404
    condition: "the member id (including recipient_member_id) in the path or body does not resolve"
  - id: ERR_HOUSEHOLD_LINK_NOT_FOUND
    http: 404
    condition: "the household-link id in the path does not resolve"
  - id: ERR_PROMO_EVENT_NOT_FOUND
    http: 404
    condition: "the promo-event id in the path does not resolve"
  - id: ERR_POINT_CYCLE_NOT_FOUND
    http: 404
    condition: "the point-cycle id in the path or body does not resolve"
  - id: ERR_PURCHASE_TRANSACTION_NOT_FOUND
    http: 404
    condition: "the purchase-transaction id in the path does not resolve"
  - id: ERR_LEDGER_ENTRY_NOT_FOUND
    http: 404
    condition: "the point-ledger-entry id in the path or body (disputed_ledger_entry_id) does not resolve"
  - id: ERR_FUEL_REDEMPTION_NOT_FOUND
    http: 404
    condition: "the fuel-redemption id in the path does not resolve"
  - id: ERR_SETTLEMENT_BATCH_NOT_FOUND
    http: 404
    condition: "the settlement-batch id in the path or body does not resolve"
  - id: ERR_POINT_DISPUTE_NOT_FOUND
    http: 404
    condition: "the point-dispute id in the path or body (supersedes_dispute_id) does not resolve"
  - id: ERR_FRAUD_SIGNAL_NOT_FOUND
    http: 404
    condition: "the fraud-signal id in the path does not resolve"

  # -- ownership, segregation of duties, authority --------------------------
  - id: ERR_NOT_RESOURCE_OWNER
    http: 403
    condition: "an entity_backed role acts on a resource it does not own: role Member with X-User-ID != the member being acted for, or a Site-backed role with X-User-ID != the site of the transaction, redemption or batch"
  - id: ERR_SELF_APPROVAL_FORBIDDEN
    http: 403
    condition: "X-User-ID equals PointDispute.proposed_by_user_id on approve-adjustment, or SettlementBatch.submitted_by_user_id on batch approve or reject"
  - id: ERR_TIER_AUTHORITY_REQUIRED
    http: 403
    condition: "approving a TIER3 adjustment as a role other than ProgramAdmin"
  - id: ERR_ADJUSTMENT_EXCEEDS_AUTHORITY
    http: 403
    condition: "abs(proposed_points_delta) exceeds the ceiling of the requested authority_tier (TIER1 500, TIER2 5000)"

  # -- optimistic concurrency ----------------------------------------------
  - id: ERR_STALE_MEMBER_VERSION
    http: 412
    condition: "expected_member_version does not equal the member's current version on POST /fuel-redemptions"
  - id: ERR_STALE_SITE_VERSION
    http: 412
    condition: "expected_site_version does not equal the site's current version on POST /settlement-batches"

  # -- state ----------------------------------------------------------------
  - id: ERR_HOUSEHOLD_FROZEN
    http: 409
    condition: "a household reachable from the acting member by an ACTIVE link has status FROZEN, whether frozen manually or automatically by fraud score"
  - id: ERR_BANNER_SUSPENDED
    http: 409
    condition: "the banner governing the operation has status SUSPENDED"
  - id: ERR_SITE_SUSPENDED
    http: 409
    condition: "the site involved in the operation has status SUSPENDED"
  - id: ERR_INVALID_STATE_TRANSITION
    http: 409
    condition: "the requested transition is not declared from the entity's current state in §1.2, including terminal-state re-entry, repeating an action already performed, and unfreezing a household that still carries an OPEN ALT_ID_SHARING or GEO_IMPOSSIBLE signal"
  - id: ERR_CYCLE_NOT_OPEN
    http: 409
    condition: "no PointCycle of the governing banner is OPEN with the logical clock inside its window"
  - id: ERR_CYCLE_NOT_ENDED
    http: 409
    condition: "begin-close attempted while the logical clock is at or before PointCycle.closes_at"
  - id: ERR_PRIOR_CYCLE_NOT_CLOSED
    http: 409
    condition: "begin-close attempted while an earlier cycle_month of the same banner is not CLOSED"

  # -- business safety ------------------------------------------------------
  - id: ERR_TRANSFER_FRAUD_LOCK
    http: 403
    condition: "the sender's household carries 2 or more OPEN fraud signals, or any OPEN RAPID_TRANSFER or ALT_ID_SHARING signal"
  - id: ERR_ALT_ID_MISMATCH
    http: 422
    condition: "alt_id_presented at the pump does not exactly match Member.alt_id"
  - id: ERR_CROSS_BANNER_LINK_REQUIRED
    http: 422
    condition: "redeeming at a site of another banner without an ACTIVE household link into that banner"

  # -- business temporal ----------------------------------------------------
  - id: ERR_PROMO_WINDOW_CONFLICT
    http: 409
    condition: "the promotional window overlaps a SCHEDULED or ACTIVE event of the same banner sharing a category and stack_priority; half-open windows make touching endpoints non-overlapping"
  - id: ERR_BATCH_PERIOD_OVERLAP
    http: 409
    condition: "the settlement period overlaps a SUBMITTED or APPROVED batch of the same site; closed periods make touching endpoints overlapping"
  - id: ERR_OPEN_BATCH_LIMIT
    http: 409
    condition: "the site already carries 2 DRAFT or SUBMITTED settlement batches after any DRAFT supersede has been applied"

  # -- business referential -------------------------------------------------
  - id: ERR_RECIPIENT_NOT_IN_HOUSEHOLD
    http: 422
    condition: "the transfer recipient holds no ACTIVE link to the sender's household, or recipient_member_id equals member_id"
  - id: ERR_DISPUTE_ENTRY_MEMBER_MISMATCH
    http: 422
    condition: "the disputed ledger entry belongs to a different member than the dispute names"
  - id: ERR_GROCERY_SITE_REQUIRED
    http: 422
    condition: "recording a purchase transaction at a site whose site_type is not GROCERY"
  - id: ERR_FUEL_SITE_REQUIRED
    http: 422
    condition: "authorizing a redemption at a site whose site_type is neither OWNED_FUEL_CENTER nor PARTNER_STATION"
  - id: ERR_PARTNER_SITE_REQUIRED
    http: 422
    condition: "opening a settlement batch for a site that is not a PARTNER_STATION with a partner_code"

  # -- business constraint --------------------------------------------------
  - id: ERR_INVALID_TRANSFER_AMOUNT
    http: 422
    condition: "transfer points is not a positive whole multiple of Banner.points_per_discount_block"
  - id: ERR_TRANSFER_LIMIT_EXCEEDED
    http: 409
    condition: "the household has already recorded Banner.max_transfers_per_cycle TRANSFER_OUT entries against the open cycle"
  - id: ERR_NEXT_CYCLE_NOT_DEFINED
    http: 422
    condition: "a positive lot must be dated but no PointCycle exists for the calendar month after the open cycle"
  - id: ERR_ALT_ID_DUPLICATE
    http: 409
    condition: "alt_id already used by another member of the same banner"
  - id: ERR_HOUSEHOLD_CODE_DUPLICATE
    http: 409
    condition: "household_code already used within the same banner"
  - id: ERR_CYCLE_MONTH_DUPLICATE
    http: 409
    condition: "cycle_month already defined for the banner"
  - id: ERR_DUPLICATE_ACTIVE_LINK
    http: 409
    condition: "a PENDING, ACTIVE or SUSPENDED link already exists for the same household and member"
  - id: ERR_PRIMARY_LINK_EXISTS
    http: 409
    condition: "a second PRIMARY link is created or activated for a household that already has a non-revoked PRIMARY link"
  - id: ERR_SUPERSEDE_CHAIN_TOO_LONG
    http: 409
    condition: "the supersedes_dispute_id chain would exceed 3 disputes, or the superseded dispute is not RESOLVED_DENIED"
  - id: ERR_BELOW_MIN_REDEMPTION
    http: 422
    condition: "points_committed is below Banner.min_points_per_redemption"

  # -- business fiscal ------------------------------------------------------
  - id: ERR_INSUFFICIENT_POINTS
    http: 422
    condition: "the member's available_points is below the points the authorization would debit, or below the requested transfer amount"
  - id: ERR_GALLONS_EXCEED_AUTHORIZATION
    http: 422
    condition: "gallons_dispensed is zero, negative, or greater than gallons_authorized; the redemption is never clamped"
  - id: ERR_NO_SETTLEABLE_GALLONS
    http: 422
    condition: "submitting a batch whose period contains no PENDING dispensed redemption at the site"

# ---------------------------------------------------------------------------
# §1.7 RBAC Matrix — segregation of duties
# ---------------------------------------------------------------------------
roles:

  - name: ProgramAdmin
    description: "Loyalty program owner. Configures banners, sites and promotions, and is the only role that can approve settlement money or a TIER3 manual adjustment. Also the sole holder of the logical clock."
    identity: "opaque"
    exclusive_operations:
      - "POST /banners"
      - "POST /banners/{id}/suspend"
      - "POST /sites"
      - "POST /sites/{id}/suspend"
      - "POST /promo-events"
      - "POST /promo-events/{id}/activate"
      - "POST /settlement-batches/{id}/approve"
      - "POST /settlement-batches/{id}/reject"
      - "POST /_clock/set_current_utc"
      - "approving a PointDispute whose authority_tier is TIER3"
    shared_operations:
      - "every GET endpoint"
      - "POST /households, POST /members, POST /household-links and its activate / suspend / revoke actions"
      - "POST /point-cycles and its begin-close / close actions"
      - "POST /purchase-transactions and its post / void actions"
      - "POST /point-transfers, POST /fuel-redemptions and its complete / void actions"
      - "POST /settlement-batches and its submit action"
      - "POST /point-disputes and its investigate / propose-adjustment / approve-adjustment / deny actions"
      - "POST /fraud-signals, POST /fraud-signals/{id}/clear"
      - "POST /households/{id}/freeze, POST /households/{id}/unfreeze"

  - name: StoreOperator
    description: "Grocery lane and service-desk operator. Records and posts baskets at its own store and enrolls members."
    identity: "entity_backed:Site"
    exclusive_operations: []
    shared_operations:
      - "POST /members"
      - "POST /purchase-transactions, POST /purchase-transactions/{id}/post, POST /purchase-transactions/{id}/void — only for site_id == X-User-ID"
      - "GET /banners/{id}, GET /banners/{id}/promo-events, GET /sites/{id}, GET /members, GET /members/{id}, GET /point-cycles, GET /point-cycles/{id}, GET /purchase-transactions, GET /purchase-transactions/{id}"

  - name: PumpTerminal
    description: "Unattended fuel dispenser controller. Looks members up by alternate ID, authorizes a per-gallon discount, and closes the transaction out with the gallons actually pumped."
    identity: "entity_backed:Site"
    exclusive_operations: []
    shared_operations:
      - "POST /fuel-redemptions, POST /fuel-redemptions/{id}/complete, POST /fuel-redemptions/{id}/void — only for site_id == X-User-ID"
      - "GET /members, GET /members/{id}, GET /members/{id}/points-summary, GET /sites/{id}, GET /households/{id}, GET /household-links, GET /household-links/{id}, GET /fuel-redemptions, GET /fuel-redemptions/{id}"

  - name: Member
    description: "The enrolled shopper acting for themself. May move points inside their own household and dispute their own ledger entries."
    identity: "entity_backed:Member"
    exclusive_operations: []
    shared_operations:
      - "POST /point-transfers, POST /point-disputes — only for member_id == X-User-ID"
      - "GET /members/{id}, GET /members/{id}/points-summary, GET /household-links/{id}, GET /point-ledger-entries, GET /point-ledger-entries/{id}, GET /purchase-transactions/{id}, GET /fuel-redemptions/{id}, GET /point-disputes, GET /point-disputes/{id}"

  - name: LoyaltyAnalyst
    description: "Fraud and linkage analyst. Manages household linkage, raises and clears fraud signals, investigates disputes and PROPOSES adjustments — but may never approve one."
    identity: "opaque"
    exclusive_operations:
      - "POST /point-disputes/{id}/propose-adjustment"
      - "POST /point-disputes/{id}/investigate"
      - "POST /fraud-signals"
      - "POST /fraud-signals/{id}/clear"
      - "POST /household-links"
      - "POST /household-links/{id}/activate"
      - "POST /household-links/{id}/suspend"
      - "POST /household-links/{id}/revoke"
    shared_operations:
      - "POST /households, POST /members, POST /point-transfers, POST /point-disputes"
      - "every GET endpoint except GET /settlement-batches money detail, which it may read but not act on"

  - name: LoyaltySupervisor
    description: "Loyalty operations supervisor. Runs the month-boundary cycle close, freezes and thaws households, and approves TIER1 and TIER2 adjustments proposed by someone else."
    identity: "opaque"
    exclusive_operations:
      - "POST /point-cycles/{id}/begin-close"
      - "POST /point-cycles/{id}/close"
      - "POST /households/{id}/freeze"
      - "POST /households/{id}/unfreeze"
      - "POST /point-disputes/{id}/deny"
    shared_operations:
      - "POST /point-cycles"
      - "POST /point-disputes/{id}/approve-adjustment — only for TIER1 and TIER2, and only when X-User-ID != proposed_by_user_id"
      - "every GET endpoint"

  - name: SettlementClerk
    description: "Partner settlement clerk acting for one partner station. Opens and submits reimbursement batches for its own site but can never approve them."
    identity: "entity_backed:Site"
    exclusive_operations: []
    shared_operations:
      - "POST /settlement-batches, POST /settlement-batches/{id}/submit — only for site_id == X-User-ID"
      - "GET /banners/{id}, GET /sites, GET /sites/{id}, GET /fuel-redemptions, GET /fuel-redemptions/{id}, GET /settlement-batches, GET /settlement-batches/{id}"

# Segregation-of-duties invariants that span the matrix:
#   * LoyaltyAnalyst proposes an adjustment; only LoyaltySupervisor (TIER1/TIER2)
#     or ProgramAdmin (any tier) approves it, and never the proposer.
#   * SettlementClerk submits a batch; only ProgramAdmin decides it, and never
#     the submitter — ERR_SELF_APPROVAL_FORBIDDEN fires even for ProgramAdmin
#     when ProgramAdmin was the submitter.
#   * PumpTerminal authorizes discounts but cannot post baskets; StoreOperator
#     posts baskets but cannot authorize discounts.
