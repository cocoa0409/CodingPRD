              captures: { err: $.data.error_id }
          assert:
            - "first replace succeeds (version now 2)"
            - "second replace with stale version rejected: err == ERR_STALE_VERSION (412)"

      - name: row_replace_on_published_set_immutable
        claim_type: violation_to_error
