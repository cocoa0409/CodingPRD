            - { call: "POST /forestry/stands", payload: { tract_id: "${tr_id}", name: "Stand 1", acres: 50, primary_species: "PINE" }, as: Forester, as_user_id: "${f_id}", captures: { st_id: "$.data.id", st_v: "$.data.version" } }
            - { call: "POST /forestry/cruises", payload: { stand_id: "${st_id}", cruise_date: "2026-03-01", plots: [ { plot_number: 1, species: "PINE", volume_bf: 1165 }, { plot_number: 2, species: "PINE", volume_bf: 1285 }, { plot_number: 3, species: "PINE", volume_bf: 1165 }, { plot_number: 4, species: "PINE", volume_bf: 1285 }, { plot_number: 5, species: "PINE", volume_bf: 1165 }, { plot_number: 6, species: "PINE", volume_bf: 1285 } ] }, as: Forester, as_user_id: "${f_id}", captures: { cra_id: "$.data.id" } }
            - { call: "POST /forestry/cruises/${cra_id}/finalize-tally", payload: {}, as: Forester, as_user_id: "${f_id}" }
            - { call: "POST /forestry/cruises/${cra_id}/reconcile", payload: { reconciled_plot_numbers: [1, 2, 3, 4, 5, 6] }, as: Forester, as_user_id: "${f_id}" }
            - { call: "POST /forestry/cruises/${cra_id}/certify", payload: { expected_stand_version: "${st_v}" }, as: Forester, as_user_id: "${f_id}" }
            - { call: "POST /forestry/cruises", payload: { stand_id: "${st_id}", cruise_date: "2026-04-01", plots: [ { plot_number: 1, species: "PINE", volume_bf: 1200 }, { plot_number: 2, species: "PINE", volume_bf: 1300 }, { plot_number: 3, species: "PINE", volume_bf: 1200 }, { plot_number: 4, species: "PINE", volume_bf: 1300 }, { plot_number: 5, species: "PINE", volume_bf: 1200 }, { plot_number: 6, species: "PINE", volume_bf: 1300 } ] }, as: Forester, as_user_id: "${f_id}", captures: { crb_id: "$.data.id" } }
            - { call: "POST /forestry/cruises/${crb_id}/finalize-tally", payload: {}, as: Forester, as_user_id: "${f_id}" }
            - { call: "POST /forestry/cruises/${crb_id}/reconcile", payload: { reconciled_plot_numbers: [1, 2, 3, 4, 5, 6] }, as: Forester, as_user_id: "${f_id}" }
          trigger:
            - { call: "POST /forestry/cruises/${crb_id}/certify", payload: { expected_stand_version: "${st_v}" }, as: Forester, as_user_id: "${f_id}", captures: { err: "$.data.error_id" } }
            - { call: "GET /forestry/stands/${st_id}", payload: {}, as: Forester, as_user_id: "${f_id}", captures: { st_v2: "$.data.version" } }
            - { call: "POST /forestry/cruises/${crb_id}/certify", payload: { expected_stand_version: "${st_v2}" }, as: Forester, as_user_id: "${f_id}", captures: { crb_status: "$.data.status" } }
          assert:
            - "${err} == ERR_STALE_VERSION"
            - "${crb_status} == CERTIFIED"
            - "InventoryCruise.${cra_id}.status == SUPERSEDED"
            - "Stand.${st_id}.certified_cruise_id == ${crb_id}"

      - name: occ_stale_valuation_create_returns_412
        claim_type: occ_stale_version
        grounds: ["concurrency_rules[valuation-create-stale-tract]", "errors[ERR_STALE_VERSION]"]
        distinguishing_aspect: "Creating a valuation against a tract version advanced by another valuation create is rejected 412 ERR_STALE_VERSION; the fresh-version create succeeds and supersedes the prior VALUED valuation."
        test_recipe:
          setup: ["tract OPEN at version 1 (captured at create)"]
          setup_api_calls:
            - { call: "POST /forestry/foresters", payload: { license_no: "F-100", full_name: "Francis Forester", email: "f@x.com" }, as: PlatformAdmin, captures: { f_id: "$.data.id" } }
