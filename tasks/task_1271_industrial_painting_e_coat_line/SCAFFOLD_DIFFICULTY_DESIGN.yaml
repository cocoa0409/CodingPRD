  # ---------------------------------------------------------------- Rule 6 ---
  - rule_id: boundary_precision_check
    instances:
      - name: film_build_exact_minimum_window_allowed
        grounds:
          - calculations.film_build_estimation
          - errors[ERR_FILM_BUILD_OUT_OF_WINDOW]
        distinguishing_aspect: |
          Boundary on the film-build metric (microns) via POST /run-slots: predicted
          value exactly equal to spec.film_build_min_um (20.0 at speed 11.0, factor 1.00)
          is ACCEPTED because the window is inclusive (>=), while 13.0 fpm predicts 16.9
          and is rejected — precision of >= vs > on a numeric threshold.
        test_recipe:
          setup:
            - "Customer; spec S3 film 20.0-26.0 µm; line at 11.0 fpm; stage IN_RANGE; permit cap 500.0"
            - "Lots LB (qty 100) and LT (qty 100) QUEUED"
          setup_api_calls:
            - call: "POST /ecoat/customers"
              payload: { name: "Acme Housings" }
              as: PlantAdmin
              captures: { c1: $.data.id }
            - call: "POST /ecoat/coating-specs"
              payload: { customer_id: "${c1}", color_code: "RAL9005", film_build_min_um: 20.0, film_build_max_um: 26.0, cure_metal_temp_c: 180.0, cure_minutes_at_temp: 20, adhesion_class_min: 2, impact_joules_min: 40.0, voc_g_per_l: 320.0, area_dm2_per_part: 12.0 }
              as: PlantAdmin
              captures: { spec3: $.data.id }
            - call: "POST /ecoat/paint-lines"
              payload: { name: "L1", current_color_code: "RAL9005", line_speed_fpm: 11.0, hanger_capacity_parts: 60, allocation_policy: "FULL_TO_NEXT_LOT" }
              as: PlantAdmin
              captures: { line1: $.data.id }
            - call: "POST /ecoat/pretreatment-stages"
              payload: { paint_line_id: "${line1}", stage_name: "alkaline_clean", sequence_no: 1, chemical_family: "CLEANER", conc_min_gpl: 20.0, conc_max_gpl: 30.0 }
              as: PlantAdmin
            - call: "POST /ecoat/voc-permits"
              payload: { period_start: "2026-05-01T00:00:00Z", period_end: "2026-06-01T00:00:00Z", cap_kg: 500.0 }
              as: PlantAdmin
            - call: "POST /ecoat/lots"
              payload: { customer_id: "${c1}", spec_id: "${spec3}", part_quantity: 100 }
              as: LineScheduler
              captures: { lot_b: $.data.id }
            - call: "POST /ecoat/lots/${lot_b}/accept"
              payload: {}
              as: LineScheduler
            - call: "POST /ecoat/lots"
              payload: { customer_id: "${c1}", spec_id: "${spec3}", part_quantity: 100 }
              as: LineScheduler
              captures: { lot_t: $.data.id }
            - call: "POST /ecoat/lots/${lot_t}/accept"
              payload: {}
              as: LineScheduler
            - call: "GET /ecoat/paint-lines/${line1}"
              as: LineScheduler
              captures: { lv1: $.data.version }
          trigger:
            - call: "POST /ecoat/run-slots"
              payload: { paint_line_id: "${line1}", lot_id: "${lot_b}", start_utc: "2026-05-05T08:00:00Z", end_utc: "2026-05-05T10:00:00Z", parts_per_hanger: 20, expected_paint_line_version: "${lv1}" }
              as: LineScheduler
              captures: { slot_b: $.data.id, film_b: $.data.predicted_film_build_um }
            - call: "POST /ecoat/paint-lines/${line1}/set-line-speed"
              payload: { line_speed_fpm: 13.0 }
              as: LineScheduler
            - call: "GET /ecoat/paint-lines/${line1}"
              as: LineScheduler
              captures: { lv2: $.data.version }
            - call: "POST /ecoat/run-slots"
              payload: { paint_line_id: "${line1}", lot_id: "${lot_t}", start_utc: "2026-05-05T10:00:00Z", end_utc: "2026-05-05T12:00:00Z", parts_per_hanger: 20, expected_paint_line_version: "${lv2}" }
              as: LineScheduler
              captures: { err: $.data.error_id }
          assert:
            - "Boundary slot created: RunSlot.${slot_b}.predicted_film_build_um == 20.0 == film_build_min_um (inclusive >= accepted)"
            - "After speed change to 13.0: prediction 16.9 < 20.0 → err == ERR_FILM_BUILD_OUT_OF_WINDOW (422)"

      - name: voc_cap_exact_equality_allowed_then_exceeded
        grounds:
          - calculations.voc_cap_projection_check
          - errors[ERR_VOC_CAP_EXCEEDED]
        distinguishing_aspect: |
          Boundary on the VOC-mass metric (kg) via POST /color-changes — a different
          metric and endpoint than film build: landing used_kg exactly on cap_kg
          (4.120 + 0.880 == 5.000) is ALLOWED; +0.088 more (5.088 > 5.000) is rejected —
          strictly-greater semantics at the exact cap.
        test_recipe:
