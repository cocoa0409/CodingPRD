      - name: closing_after_the_deferral_window_returns_deferral_expired
        claim_type: Error Triggerable
        grounds: ["validations[priority=70]", "errors[ERR_CLOSING_DEFERRAL_EXPIRED]", "state_machines.Invoice.DEFERRED_CLOSING_to_ISSUED"]
        distinguishing_aspect: "The invoice was deferred on 2026-06-02T14:00:00Z, so a closing recorded on 2026-10-20 lies past CLOSING_DEFERRAL_MAX_DAYS and returns ERR_CLOSING_DEFERRAL_EXPIRED (409); the invoice stays DEFERRED_CLOSING."
        test_recipe:
          setup: ["An OCCUPIED PAY_AT_CLOSING project with a DEFERRED_CLOSING invoice issued at 2026-06-02T14:00:00Z."]
          setup_api_calls: *occ_pac_c
          trigger:
            - call: "POST /staging/_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-20T09:00:00Z" }
              as: PlatformAdmin
            - call: "POST /staging/listings/${listing_id}/under-contract"
              payload: {}
              as: ListingAgent
              as_user_id: "${agent_id}"
            - call: "POST /staging/listings/${listing_id}/close"
              payload: {}
              as: ListingAgent
              as_user_id: "${agent_id}"
              captures: { err: "$.data.error_id" }
          assert:
            - "HTTP status == 409"
            - "response.data.error_id == ERR_CLOSING_DEFERRAL_EXPIRED"
            - "Invoice.${inv_id}.state == DEFERRED_CLOSING"
            - "Listing.${listing_id}.listing_state == UNDER_CONTRACT"
            - "Listing.${listing_id}.closed_at is null"

      - name: fiscal_hold_blocks_a_reshoot_request
        claim_type: Error Triggerable
        grounds: ["validations[priority=71]", "errors[ERR_FISCAL_HOLD]", "entities.Project.fields.fiscal_hold", "state_machines.Invoice.DEFERRED_CLOSING_to_ESCALATED"]
        distinguishing_aspect: "Escalating the deferred invoice sets Project.fiscal_hold true, and the reshoot request — which would otherwise pass its entitlement check with one credit remaining — is refused at rung 71 with ERR_FISCAL_HOLD (402)."
        test_recipe:
          setup: ["An OCCUPIED PAY_AT_CLOSING project with a DEFERRED_CLOSING invoice and one COMPLETED shoot."]
          setup_api_calls: *occ_pac_c
          trigger:
            - call: "POST /staging/invoices/${inv_id}/escalate"
              payload: {}
              as: BillingClerk
            - call: "POST /staging/photo-shoots/${shoot_id}/request-reshoot"
              payload: { scheduled_at: "2026-06-04T10:00:00Z" }
              as: ListingAgent
              as_user_id: "${agent_id}"
              captures: { err: "$.data.error_id" }
          assert:
            - "HTTP status == 402"
            - "response.data.error_id == ERR_FISCAL_HOLD"
            - "Invoice.${inv_id}.state == ESCALATED"
            - "Project.${proj_id}.fiscal_hold == true"
            - "Project.${proj_id}.payment_state == ESCALATED"
            - "Project.${proj_id}.reshoot_credits_remaining == 1"

      - name: error_crew_double_booked_on_install_creation
        claim_type: Error Triggerable
        grounds: ["errors[ERR_CREW_DOUBLE_BOOKED]"]
        excluded_because:
          difficulty_instance: resource_temporal_overlap / crew_day_bucket_rejects_a_second_install_on_the_same_utc_date
          rationale: "Asserted as the failure path of the named §1.8 instance, which pins both the calendar-day bucketing and CREW_DAY_CAPACITY."

      - name: error_shoot_time_conflict_on_shoot_creation
        claim_type: Error Triggerable
        grounds: ["errors[ERR_SHOOT_TIME_CONFLICT]"]
        excluded_because:
          difficulty_instance: resource_temporal_overlap / shoot_block_buffer_rejects_a_start_239_minutes_later
          rationale: "Asserted as the failure path of the named §1.8 instance, which pins the half-open block plus its asymmetric trailing buffer."

      - name: error_service_window_expired_on_visit_creation
        claim_type: Error Triggerable
        grounds: ["errors[ERR_SERVICE_WINDOW_EXPIRED]"]
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / expired_service_window_beats_uncollected_deposit_returns_window_expired
          rationale: "Asserted as the winning error of the named §1.8 priority-conflict instance."

      - name: error_assessment_invalid_state_on_pickup_completion
        claim_type: Error Triggerable
        grounds: ["errors[ERR_ASSESSMENT_INVALID_STATE]"]
        excluded_because:
          difficulty_instance: cross_entity_state_dependency / pickup_cannot_complete_while_an_assessment_is_not_final
          rationale: "Asserted as the failure path of the named §1.8 cross-entity instance."

      - name: unknown_role_value_is_refused_as_unauthenticated
        claim_type: Error Triggerable
        grounds: ["validations[priority=2]", "errors[ERR_UNAUTHENTICATED]", "entities.InventoryPull.fields.state"]
        distinguishing_aspect: "An X-User-Role naming a role that §1.7 does not declare is refused at rung 2 with ERR_UNAUTHENTICATED (401), the same code as a missing header, and no InventoryPull row is created."
        test_recipe:
          setup: ["The canonical VACANT project in DRAFT."]
          setup_api_calls: *v_draft_c
          trigger:
            - call: "POST /staging/projects/${proj_id}/pulls"
              payload: {}
              as: WarehouseSupervisor
              captures: { err: "$.data.error_id" }
          assert:
            - "HTTP status == 401"
            - "response.data.error_id == ERR_UNAUTHENTICATED"
            - "GET /staging/pulls?project_id=${proj_id} returns total_count 0"

      - name: deposit_refund_before_payment_is_refused
        claim_type: Error Triggerable
        grounds: ["validations[priority=73]", "errors[ERR_DEPOSIT_INVALID_STATE]", "calculations.initial_lease_charge"]
        distinguishing_aspect: "Refunding a HELD deposit while the invoice is still ISSUED is refused at rung 73 with ERR_DEPOSIT_INVALID_STATE (409); held_remaining stays at the full 829.00 and refunded_amount stays 0.00."
        test_recipe:
          setup: ["An OCCUPIED AGENT-payer project with an ISSUED invoice of 3058.06 and a HELD 829.00 deposit."]
          setup_api_calls: *occ_issued_c
          trigger:
            - call: "POST /staging/deposits/${dep_id}/refund"
              payload: {}
              as: BillingClerk
              captures: { err: "$.data.error_id" }
          assert:
            - "HTTP status == 409"
            - "response.data.error_id == ERR_DEPOSIT_INVALID_STATE"
            - "Deposit.${dep_id}.state == HELD"
            - "Deposit.${dep_id}.held_remaining == 829.00"
            - "Deposit.${dep_id}.refunded_amount == 0.00"

      - name: partial_extension_returns_the_vendor_lines_and_credits_half_a_cycle
        claim_type: Error Triggerable
        grounds: ["calculations.partial_extension_swap_credit", "calculations.extension_charge", "state_machines.Extension.REQUESTED_to_APPROVED_PARTIAL", "state_machines.PullLine.DEPLOYED_to_SWAPPED"]
        distinguishing_aspect: "A three-cycle request outruns the vendor's six-cycle effective term (4 + 3 = 7 > 6), so the extension lands APPROVED_PARTIAL: the 1147.50 vendor line is returned, the charge is priced on the surviving 720.00 of owned lines at 2160.00, and swap_credit is 573.75."
        test_recipe:
          setup: ["The canonical VACANT project with a four-cycle lease, three owned lines totalling 720.00 and one vendor line at 1147.50."]
          setup_api_calls: *v_staged_c
          trigger:
            - call: "GET /staging/leases/${lease_id}"
              payload: {}
              as: StagingCoordinator
              captures: { lease_v: "$.data.version" }
            - call: "POST /staging/leases/${lease_id}/extensions"
              payload: { requested_cycles: 3, expected_lease_version: "${lease_v}" }
              as: StagingCoordinator
              captures: { ext_id: "$.data.id" }
            - call: "POST /staging/extensions/${ext_id}/adjudicate"
              payload: { decision: "APPROVE" }
              as: WarehouseManager
            - call: "POST /staging/extensions/${ext_id}/apply"
              payload: {}
              as: StagingCoordinator
          assert:
            - "Extension.${ext_id}.state == APPLIED"
            - "Extension.${ext_id}.granted_cycles == 3"
            - "Extension.${ext_id}.extended_line_count == 3"
            - "Extension.${ext_id}.returned_line_count == 1"
            - "Extension.${ext_id}.extension_charge == 2160.00"
            - "Extension.${ext_id}.swap_credit == 573.75"
            - "PullLine.${line_v}.state == SWAPPED"
            - "Lease.${lease_id}.billed_cycles == 7"
            - "Lease.${lease_id}.monthly_rent == 720.00"

      - name: escalating_a_deferred_invoice_books_the_closing_escalation_fee
        claim_type: Error Triggerable
        grounds: ["calculations.closing_escalation_charge", "state_machines.Invoice.DEFERRED_CLOSING_to_ESCALATED", "entities.Invoice.fields.line_summary"]
        distinguishing_aspect: "Escalation adds CLOSING_ESCALATION_FEE to line_summary.closing_escalation, lifting subtotal from 2825.00 to 3475.00 and total_due to 3761.69 — a charge that exists only on the pay-at-closing path."
        test_recipe:
          setup: ["An OCCUPIED PAY_AT_CLOSING project with a DEFERRED_CLOSING invoice of subtotal 2825.00."]
          setup_api_calls: *occ_pac_c
          trigger:
            - call: "POST /staging/invoices/${inv_id}/escalate"
              payload: {}
              as: BillingClerk
          assert:
            - "Invoice.${inv_id}.state == ESCALATED"
            - "Invoice.${inv_id}.line_summary.closing_escalation == 650.00"
            - "Invoice.${inv_id}.subtotal == 3475.00"
            - "Invoice.${inv_id}.tax_amount == 286.69"
            - "Invoice.${inv_id}.total_due == 3761.69"
            - "Project.${proj_id}.fiscal_hold == true"
