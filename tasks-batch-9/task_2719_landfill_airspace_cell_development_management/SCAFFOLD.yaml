# =============================================================================
# Landfill Airspace & Cell Development Management — Scaffold (§1.0–§1.7)
# =============================================================================
scenario: |
  Generate task harder than expert level!

  2719. Landfill Airspace & Cell Development Management (municipal solid waste landfill): airspace consumption tracking with aerial surveys, density measurement and remaining life projection, cell development scheduling with liner construction, quality assurance documentation and regulatory approval before waste placement, daily operations with working face management, cover material selection and compaction density targets, leachate collection, storage and disposal with treatment agreements and generation forecasting, landfill gas collection expansion with wellfield tuning and surface emission monitoring, waste acceptance screening with special waste approvals and prohibited material load checks, financial assurance for closure and post-closure care with annual cost updates, host community agreements and tipping fee structure

domain_name: landfill-airspace-cell-development
api_prefix: /

complexity_profile:
  primary_archetype: quota_allocation
  secondary_archetype: compliance_audit
  complexity_layers:
    - dual_variant_calculation
    - cascading_side_effects
    - rate_threshold_triggers
    - optimistic_concurrency

  entity_topology: flat
  # Thirteen peer entities linked by explicit foreign keys. No URL nesting: every
  # collection is a top-level path (/cells, /waste-loads, /gas-wells) and every
  # parent reference travels in the request body or as a query filter.

  state_machine_shape: cyclic
  # LinerQaPackage (SUBMITTED->UNDER_REVIEW->RETURNED->SUBMITTED),
  # HostCommunityAgreement (EXECUTED->UNDER_AMENDMENT->EXECUTED),
  # OperatingDay (OPEN->CLOSED->AMENDED->CLOSED) and
  # GasWell (ONLINE->TUNING_REQUIRED->ONLINE) all loop.
  # Cell adds a fork-join (independent CQA branch + regulatory branch) with a
  # revert edge; WasteLoad carries two independent state dimensions.

  relationship_patterns:
    - one_to_many          # Landfill -> Cell, Cell -> LinerQaPackage / GasWell
    - self_referential     # Cell.piggyback_over_cell_id -> Cell.id
    - cross_aggregate      # WasteLoad -> SpecialWasteApproval, SurfaceEmissionScan -> GasWell

  role_model: segregation_of_duties
  # The CQA reviewer that approves a liner package MUST NOT be the user that
  # submitted it; waste-placement authorization is reserved to RegulatoryAgency
  # and can never be performed by the SiteOperator that built the cell.

  consistency_model: immediate

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:

  - name: Landfill
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: Facility name.
        constraints: 1..120 chars
      - name: permit_number
        type: string
        source: input
        description: State solid-waste permit number; globally unique.
        constraints: 1..40 chars, unique across all Landfill rows
      - name: permitted_total_airspace_cy
        type: number
        source: input
        description: Total permitted airspace in cubic yards across all cells.
        constraints: "> 0"
      - name: design_footprint_sf
        type: number
        source: input
        description: Permitted waste footprint in square feet.
        constraints: "> 0"
      - name: planned_density_tons_per_cy
        type: number
        source: input
        description: Design in-place density (tons per cubic yard) used by the ledger_based projection variant.
        constraints: "0.40 <= value <= 1.20"
      - name: annual_tonnage_forecast
        type: number
        source: input
        description: Forecast annual accepted tonnage; denominator of both remaining-life variants.
        constraints: "> 0"
      - name: daily_load_limit
        type: integer
        source: input
        default: 200
        description: Maximum number of non-REJECTED WasteLoad rows allowed on one OperatingDay of this landfill.
        constraints: "1 <= value <= 2000"
      - name: assurance_funded_amount
        type: number
        source: system
        default: 0
        description: Cumulative face amount of closure/post-closure financial-assurance instruments posted for this landfill. Set from initial_assurance_amount at creation, then incremented by POST /closure-cost-estimates/{id}/fund-assurance.
      - name: certified_airspace_cy
        type: number
        source: computed
        default: 0
        description: "Sum of Cell.design_airspace_cy over Cells of this landfill whose status IN {QA_CERTIFIED, READY_FOR_WASTE, ACTIVE, FULL, CLOSED}."
      - name: consumed_airspace_cy
        type: number
        source: computed
        default: 0
        description: Sum of Cell.consumed_airspace_cy over ALL Cells of this landfill regardless of status.
      - name: remaining_airspace_cy
        type: number
        source: computed
        default: 0
        description: "certified_airspace_cy - consumed_airspace_cy, rounded to 2 decimal places."
      - name: remaining_life_years
        type: number
        source: computed
        default: 0
        description: Output of the remaining_life_projection calculation; refreshed on OperatingDay close/amend, AerialSurvey create/void, and the LinerQaPackage APPROVED cascade.
      - name: active_cell_count
        type: integer
        source: computed
        default: 0
        description: "Count of Cells of this landfill whose status == ACTIVE."
      - name: operating_status
        type: enum
        source: system
        default: OPEN
        description: Gate for all waste-acceptance operations at this site.
        constraints: "one of {OPEN, RESTRICTED_AIRSPACE, SUSPENDED_NO_AIRSPACE, SUSPENDED_FINANCIAL, CLOSED}"
      - name: gas_collection_status
        type: enum
        source: system
        default: COMPLIANT
        description: CORRECTIVE_ACTION whenever at least one SurfaceEmissionScan of this landfill is EXCEEDANCE_OPEN or at least one GasWell of its cells is TUNING_REQUIRED.
        constraints: "one of {COMPLIANT, CORRECTIVE_ACTION}"
      - name: financial_assurance_status
        type: enum
        source: system
        default: UNFUNDED
        description: UNFUNDED until a ClosureCostEstimate of this landfill is CERTIFIED; FUNDED when the newest CERTIFIED estimate has funding_shortfall == 0; SHORTFALL_REVIEW when it has funding_shortfall > 0; LAPSED when the posted instrument is withdrawn.
        constraints: "one of {UNFUNDED, FUNDED, SHORTFALL_REVIEW, LAPSED}"

  - name: Cell
    parent: null
    common_fields: true
    fields:
      - name: landfill_id
        type: string
        source: input
        description: FK -> Landfill.id; the site this cell belongs to.
      - name: piggyback_over_cell_id
        type: string
        source: input
        default: null
        description: "FK -> Cell.id; nullable; the already-CLOSED cell this cell is built over. When present the referenced cell MUST be in the same landfill and its status MUST be CLOSED."
      - name: cell_code
        type: string
        source: input
        description: Operator cell designation.
        constraints: 1..20 chars, unique per landfill_id
      - name: design_airspace_cy
        type: number
        source: input
        description: Permitted airspace of this cell in cubic yards.
        constraints: "> 0"
      - name: design_area_sf
        type: number
        source: input
        description: Lined area in square feet; basis of the per-cell closure cost.
        constraints: "> 0"
      - name: liner_type
        type: enum
        source: input
        description: Bottom liner system installed.
        constraints: "one of {SINGLE_COMPOSITE, DOUBLE_COMPOSITE, GCL_ONLY}"
      - name: construction_start_date
        type: datetime
        source: input
        description: Planned liner-construction start (ISO 8601 UTC).
      - name: construction_end_date
        type: datetime
        source: input
        description: Planned liner-construction completion (ISO 8601 UTC); MUST be strictly after construction_start_date.
      - name: consumed_airspace_cy
        type: number
        source: computed
        default: 0
        description: Sum of OperatingDay.airspace_consumed_cy over OperatingDays whose active_cell_id is this cell and whose status == CLOSED.
      - name: fill_pct
        type: number
        source: computed
        default: 0
        description: "round(100 * consumed_airspace_cy / design_airspace_cy, 2)."
      - name: authorized_by_agency_user_id
        type: string
        source: system
        default: null
        description: X-User-ID of the RegulatoryAgency operator that authorized waste placement; null until authorization.
      - name: final_cover_reference
        type: string
        source: input
        default: null
        description: Final-cover certification reference supplied on POST /cells/{cell_id}/close; null until the cell is CLOSED.
      - name: status
        type: enum
        source: system
        default: DESIGN
        description: Cell development lifecycle state.
        constraints: "one of {DESIGN, UNDER_CONSTRUCTION, QA_REVIEW, QA_CERTIFIED, READY_FOR_WASTE, ACTIVE, FULL, CLOSED, REJECTED}"

  - name: LinerQaPackage
    parent: null
    common_fields: true
    fields:
      - name: cell_id
        type: string
        source: input
        description: FK -> Cell.id; the cell whose liner this construction-quality-assurance package documents.
      - name: seam_length_ft
        type: number
        source: input
        description: Total field-seamed geomembrane length in feet; drives the required destructive-test count.
        constraints: "> 0"
      - name: destructive_test_count
        type: integer
        source: input
        description: Number of destructive seam samples taken.
        constraints: ">= 1"
      - name: passing_test_count
        type: integer
        source: input
        description: Number of destructive samples that met peel/shear criteria.
        constraints: "0 <= value <= destructive_test_count"
      - name: panel_count
        type: integer
        source: input
        description: Number of geomembrane panels deployed.
        constraints: ">= 1"
      - name: defect_count
        type: integer
        source: input
        description: Number of repaired non-destructive-test defects logged.
        constraints: ">= 0"
      - name: qa_conformance_score
        type: number
        source: computed
        description: Output of the qa_conformance_score calculation; recomputed on create and on every resubmit.
      - name: revision_round
        type: integer
        source: system
        default: 1
        description: Number of times this package has been submitted; incremented on every RETURNED transition.
      - name: submitted_by_user_id
        type: string
        source: system
        description: X-User-ID captured on create and on every resubmit; the segregation-of-duties comparand.
      - name: reviewed_by_user_id
        type: string
        source: system
        default: null
        description: X-User-ID of the CqaEngineer that opened the current review.
      - name: certification_reference
        type: string
        source: system
        default: null
        description: Engineer-of-record certification reference recorded on approval.
      - name: status
        type: enum
        source: system
        default: SUBMITTED
        description: CQA documentation review state.
        constraints: "one of {SUBMITTED, UNDER_REVIEW, RETURNED, APPROVED, REJECTED}"

  - name: AerialSurvey
    parent: null
    common_fields: true
    fields:
      - name: landfill_id
        type: string
        source: input
        description: FK -> Landfill.id; the surveyed site.
      - name: flown_on
        type: datetime
        source: input
        description: Flight date of the photogrammetric survey (ISO 8601 UTC).
      - name: coverage_period_start
        type: datetime
        source: input
        description: Start of the airspace-consumption period this survey measures (ISO 8601 UTC).
      - name: coverage_period_end
        type: datetime
        source: input
        description: End of the measured period (ISO 8601 UTC); MUST be strictly after coverage_period_start and MUST be <= flown_on.
      - name: measured_remaining_airspace_cy
        type: number
        source: input
        description: Remaining airspace in cubic yards derived from the surveyed surface against the permitted final contours.
        constraints: ">= 0"
      - name: tons_placed_in_period
        type: number
        source: input
        description: Scale-house tonnage accepted during the coverage period.
        constraints: "> 0"
      - name: airspace_consumed_in_period_cy
        type: number
        source: computed
        description: Output of the survey_density_measurement calculation, step 1.
      - name: measured_density_tons_per_cy
        type: number
        source: computed
        description: Output of the survey_density_measurement calculation, step 2; feeds the survey_based remaining-life variant.
      - name: void_reason
        type: string
        source: system
        default: null
        description: Reason recorded when the survey is voided.
      - name: status
        type: enum
        source: system
        default: RECORDED
        description: At most one survey per landfill is RECORDED at any time.
        constraints: "one of {RECORDED, SUPERSEDED, VOID}"

  - name: OperatingDay
    parent: null
    common_fields: true
    fields:
      - name: landfill_id
        type: string
        source: input
        description: FK -> Landfill.id; the operating site.
      - name: active_cell_id
        type: string
        source: input
        description: "FK -> Cell.id; the single cell carrying the working face for this day. MUST belong to landfill_id and MUST be in status ACTIVE at creation."
      - name: operating_date
        type: datetime
        source: input
        description: Calendar day of operation (ISO 8601 UTC, midnight); unique per landfill_id.
      - name: working_face_area_sf
        type: number
        source: input
        description: Exposed working-face area in square feet; drives the face_penalty branch of effective density.
        constraints: "> 0"
      - name: cover_material_type
        type: enum
        source: input
        description: Daily cover selected for this operating day; drives the cover_factor branch of effective density.
        constraints: "one of {SOIL_6IN, ALTERNATIVE_TARP, ADC_FOAM, AUTO_SHRED_FINES}"
      - name: tons_placed
        type: number
        source: computed
        default: 0
        description: "Sum of WasteLoad.certified_net_tons over WasteLoads of this day whose screening_status == CLEARED; 0 while the day is OPEN."
      - name: effective_density_tons_per_cy
        type: number
        source: computed
        default: 0
        description: Output of the daily_airspace_consumption calculation, step 1; written on close, cleared to 0 on amend.
      - name: airspace_consumed_cy
        type: number
        source: computed
        default: 0
        description: Output of the daily_airspace_consumption calculation, step 2; written on close, cleared to 0 on amend.
      - name: amend_reason
        type: string
        source: system
        default: null
        description: Reason recorded on the most recent amend.
      - name: status
        type: enum
        source: system
        default: OPEN
        description: Daily operations log state; AMENDED days may be re-closed.
        constraints: "one of {OPEN, CLOSED, AMENDED}"

  - name: WasteLoad
    parent: null
    common_fields: true
    fields:
      - name: operating_day_id
        type: string
        source: input
        description: FK -> OperatingDay.id; the day this load was received on.
      - name: special_waste_approval_id
        type: string
        source: input
        default: null
        description: "FK -> SpecialWasteApproval.id; nullable; REQUIRED when waste_stream IN {INDUSTRIAL_SPECIAL, ASBESTOS_SPECIAL} and MUST be omitted otherwise."
      - name: hauler_ref
        type: string
        source: input
        description: Hauler account reference printed on the manifest.
        constraints: 1..40 chars
      - name: waste_stream
        type: enum
        source: input
        description: Declared waste stream.
        constraints: "one of {MSW, CD, INDUSTRIAL_SPECIAL, ASBESTOS_SPECIAL}"
      - name: manifest_tons
        type: number
        source: input
        description: Tonnage declared on the manifest; basis of the gate_rate billing variant.
        constraints: "> 0"
      - name: load_check_result
        type: enum
        source: input
        description: Result of the prohibited-material load check performed at the working face.
        constraints: "one of {PASS, PROHIBITED_FOUND, UNMANIFESTED}"
      - name: certified_net_tons
        type: number
        source: system
        default: null
        description: Certified scale net weight recorded by POST /waste-loads/{id}/certify-weight; basis of the certified_scale billing variant.
      - name: screening_state_reason
        type: string
        source: system
        default: null
        description: Reason recorded by the most recent flag or reject action.
      - name: gate_charge_amount
        type: number
        source: computed
        default: null
        description: Output of the load_tipping_charge calculation, variant gate_rate; written when screening clears.
      - name: host_royalty_amount
        type: number
        source: computed
        default: null
        description: Output of the host_community_royalty_waterfall calculation; written when billing is finalized, cleared on amend.
      - name: final_charge_amount
        type: number
        source: computed
        default: null
        description: Output of the load_tipping_charge calculation, variant certified_scale; written when billing is finalized, cleared on amend.
      - name: screening_status
        type: enum
        source: system
        default: PENDING
        description: Waste-acceptance screening dimension; evolves independently of billing_status.
        constraints: "one of {PENDING, CLEARED, FLAGGED, REJECTED}"
      - name: billing_status
        type: enum
        source: system
        default: UNBILLED
        description: Tipping-fee dimension; evolves independently of screening_status.
        constraints: "one of {UNBILLED, PROVISIONAL, FINALIZED, VOID}"

  - name: SpecialWasteApproval
    parent: null
    common_fields: true
    fields:
      - name: landfill_id
        type: string
        source: input
        description: FK -> Landfill.id; the site allowed to accept this profile.
      - name: generator_name
        type: string
        source: input
        description: Generator of record.
        constraints: 1..120 chars
      - name: waste_code
        type: string
        source: input
        description: Waste profile code.
        constraints: 1..30 chars
      - name: profile_stream
        type: enum
        source: input
        description: Stream this profile authorizes; MUST equal the waste_stream of any WasteLoad referencing it.
        constraints: "one of {INDUSTRIAL_SPECIAL, ASBESTOS_SPECIAL}"
      - name: approved_tons_cap
        type: number
        source: input
        description: Maximum cumulative tonnage authorized under this profile.
        constraints: "> 0"
      - name: effective_from
        type: datetime
        source: input
        description: First instant the profile may be used (ISO 8601 UTC).
      - name: expires_on
        type: datetime
        source: input
        description: Last instant the profile may be used (ISO 8601 UTC); MUST be strictly after effective_from.
      - name: consumed_tons
        type: number
        source: computed
        default: 0
        description: "Sum over WasteLoads referencing this approval whose screening_status == CLEARED, taking certified_net_tons for loads whose billing_status is FINALIZED and manifest_tons for all others. Increased at clear-screening on the manifest basis, re-based to certified tons at day close, and re-based back to the manifest basis on day amend."
      - name: decision_reason
        type: string
        source: system
        default: null
        description: Reason recorded on deny or revoke.
      - name: status
        type: enum
        source: system
        default: REQUESTED
        description: Special-waste approval lifecycle state.
        constraints: "one of {REQUESTED, APPROVED, DENIED, REVOKED, SUSPENDED, EXHAUSTED}"

  - name: TreatmentAgreement
    parent: null
    common_fields: true
    fields:
      - name: landfill_id
        type: string
        source: input
        description: FK -> Landfill.id; the site whose leachate this agreement disposes of.
      - name: facility_name
        type: string
        source: input
        description: Receiving publicly-owned treatment works or industrial pretreatment facility.
        constraints: 1..120 chars
      - name: daily_gallon_cap
        type: integer
        source: input
        description: Maximum gallons the facility accepts per calendar day.
        constraints: "> 0"
      - name: concurrent_slot_capacity
        type: integer
        source: input
        default: 2
        description: Maximum number of non-terminal shipments whose delivery windows may overlap at this facility.
        constraints: "1 <= value <= 10"
      - name: base_haul_fee
        type: number
        source: input
        description: Flat per-shipment hauling fee in dollars.
        constraints: ">= 0"
      - name: treatment_rate_per_kgal
        type: number
        source: input
        description: Treatment charge per 1000 gallons in dollars.
        constraints: "> 0"
      - name: effective_from
        type: datetime
        source: input
        description: First instant shipments may be scheduled (ISO 8601 UTC).
      - name: expires_on
        type: datetime
        source: input
        description: Last instant shipments may be scheduled (ISO 8601 UTC); MUST be strictly after effective_from.
      - name: scheduled_gallons_today
        type: number
        source: computed
        default: 0
        description: "Sum of LeachateShipment.gallons over shipments of this agreement whose status IN {SCHEDULED, DISPATCHED, ACCEPTED} and whose window_start falls on the current logical-clock UTC calendar date."
      - name: suspension_reason
        type: string
        source: system
        default: null
        description: Reason recorded on suspend.
      - name: status
        type: enum
        source: system
        default: ACTIVE
        description: Agreement availability state.
        constraints: "one of {ACTIVE, SUSPENDED, EXPIRED}"

  - name: LeachateShipment
    parent: null
    common_fields: true
    fields:
      - name: treatment_agreement_id
        type: string
        source: input
        description: FK -> TreatmentAgreement.id; the receiving facility contract.
      - name: gallons
        type: number
        source: input
        description: Tanker volume in gallons.
        constraints: "> 0"
      - name: window_start
        type: datetime
        source: input
        description: Start of the delivery window (ISO 8601 UTC), inclusive.
      - name: window_end
        type: datetime
        source: input
        description: End of the delivery window (ISO 8601 UTC), exclusive; MUST be strictly after window_start and on the same UTC calendar date.
      - name: hauler_ref
        type: string
        source: system
        default: null
        description: Tanker hauler reference recorded on dispatch.
      - name: gate_reason
        type: string
        source: system
        default: null
        description: Reason recorded on reject-at-gate or cancel.
      - name: treatment_fee
        type: number
        source: computed
        default: null
        description: Output of the leachate_disposal_invoice calculation, step 1.
      - name: surcharge_pct
        type: number
        source: computed
        default: null
        description: Output of the leachate_disposal_invoice calculation, step 3.
      - name: invoice_total
        type: number
        source: computed
        default: null
        description: Output of the leachate_disposal_invoice calculation, step 5; written on acceptance.
      - name: status
        type: enum
        source: system
        default: SCHEDULED
        description: Shipment lifecycle state.
        constraints: "one of {SCHEDULED, DISPATCHED, ACCEPTED, REJECTED_AT_GATE, CANCELLED}"

  - name: GasWell
    parent: null
    common_fields: true
    fields:
      - name: cell_id
        type: string
        source: input
        description: FK -> Cell.id; the cell this extraction well is drilled into.
      - name: well_code
        type: string
        source: input
        description: Wellfield designation.
        constraints: 1..20 chars, unique per cell_id
      - name: depth_ft
        type: number
        source: input
        description: Drilled depth in feet.
        constraints: "> 0"
      - name: last_vacuum_in_h2o
        type: number
        source: system
        default: null
        description: Applied vacuum in inches of water column recorded by the most recent tune.
      - name: last_methane_pct
        type: number
        source: system
        default: null
        description: Methane percentage recorded by the most recent tune.
      - name: last_oxygen_pct
        type: number
        source: system
        default: null
        description: Oxygen percentage recorded by the most recent tune.
      - name: last_tuned_at
        type: datetime
        source: system
        default: null
        description: Logical-clock instant of the most recent tune; sort key of the corrective-well selector.
      - name: offline_reason
        type: string
        source: system
        default: null
        description: Reason recorded on take-offline or abandon.
      - name: status
        type: enum
        source: system
        default: DRILLED
        description: Wellfield state.
        constraints: "one of {DRILLED, CONNECTED, TUNING_REQUIRED, ONLINE, OFFLINE, ABANDONED}"

  - name: SurfaceEmissionScan
    parent: null
    common_fields: true
    fields:
      - name: landfill_id
        type: string
        source: input
        description: FK -> Landfill.id; the scanned site.
      - name: corrective_well_id
        type: string
        source: system
        default: null
        description: "FK -> GasWell.id; nullable; NEVER supplied by the client. Written by the exceedance cascade to the well selected for re-tuning, or left null when the candidate pool is empty."
      - name: scanned_on
        type: datetime
        source: input
        description: Date the quarterly instantaneous surface-emission walkover was performed (ISO 8601 UTC).
      - name: grid_points_count
        type: integer
        source: input
        description: Number of grid points walked.
        constraints: ">= 1"
      - name: max_reading_ppm
        type: number
        source: input
        description: Highest instantaneous methane reading in parts per million.
        constraints: ">= 0"
      - name: exceedance_point_ref
        type: string
        source: input
        default: null
        description: Grid-point label of the highest reading; REQUIRED when max_reading_ppm >= 500 and MUST be omitted otherwise.
      - name: remediation_note
        type: string
        source: system
        default: null
        description: Note recorded on resolve.
      - name: status
        type: enum
        source: system
        default: PASSED
        description: Scan outcome; PASSED at creation when max_reading_ppm < 500, EXCEEDANCE_OPEN otherwise.
        constraints: "one of {PASSED, EXCEEDANCE_OPEN, RESOLVED}"

  - name: ClosureCostEstimate
    parent: null
    common_fields: true
    fields:
      - name: landfill_id
        type: string
        source: input
        description: FK -> Landfill.id; the site whose closure and post-closure care this annual update prices.
      - name: estimate_year
        type: integer
        source: input
        description: Calendar year of this annual cost update.
        constraints: "2000 <= value <= 2100"
      - name: closure_unit_cost_per_sf
        type: number
        source: input
        description: Final-cover construction cost per square foot of lined area, in dollars.
        constraints: "> 0"
      - name: post_closure_annual_cost
        type: number
        source: input
        description: First-year post-closure care cost in dollars.
        constraints: "> 0"
      - name: inflation_pct
        type: number
        source: input
        description: Annual inflation factor applied to post-closure care, expressed as a decimal fraction.
        constraints: "0 <= value <= 0.20"
      - name: post_closure_years
        type: integer
        source: input
        default: 30
        description: Length of the post-closure care period in years.
        constraints: "1 <= value <= 60"
      - name: closure_cost_total
        type: number
        source: computed
        description: Output of the closure_and_post_closure_cost calculation, step 1.
      - name: post_closure_cost_total
        type: number
        source: computed
        description: Output of the closure_and_post_closure_cost calculation, step 2.
      - name: required_assurance_amount
        type: number
        source: computed
        description: Output of the closure_and_post_closure_cost calculation, step 3.
      - name: funding_shortfall
        type: number
        source: computed
        description: Output of the closure_and_post_closure_cost calculation, step 4; recomputed on certify and on every fund-assurance.
      - name: instrument_type
        type: enum
        source: system
        default: null
        description: Instrument posted by the most recent fund-assurance call.
        constraints: "one of {TRUST_FUND, SURETY_BOND, LETTER_OF_CREDIT, INSURANCE}"
      - name: status
        type: enum
        source: system
        default: DRAFT
        description: Annual cost-update lifecycle state.
        constraints: "one of {DRAFT, CERTIFIED, STALE, SUPERSEDED}"

  - name: HostCommunityAgreement
    parent: null
    common_fields: true
    fields:
      - name: landfill_id
        type: string
        source: input
        description: FK -> Landfill.id; the site bound by this host-community agreement.
      - name: community_name
        type: string
        source: input
        description: Host municipality name.
        constraints: 1..120 chars
      - name: posted_tipping_fee_per_ton
        type: number
        source: input
        description: Posted gate rate per ton in dollars.
        constraints: "> 0"
      - name: host_fee_per_ton
        type: number
        source: input
        description: Flat host-community fee per ton in dollars.
        constraints: ">= 0"
      - name: tier1_monthly_tons
        type: number
        source: input
        description: Cumulative monthly tonnage covered by the tier-1 royalty rate before the tier-2 rate applies.
        constraints: "> 0"
      - name: royalty_tier1_pct
        type: number
        source: input
        description: Royalty rate on posted tipping revenue for tier-1 tons, as a decimal fraction.
        constraints: "0 <= value <= 0.50"
      - name: royalty_tier2_pct
        type: number
        source: input
        description: Royalty rate on posted tipping revenue for tier-2 tons, as a decimal fraction.
        constraints: "0 <= value <= 0.50"
      - name: minimum_annual_payment
        type: number
        source: input
        description: Contractual annual royalty floor in dollars; reported, never netted against a load.
        constraints: ">= 0"
      - name: effective_from
        type: datetime
        source: input
        description: First instant the fee schedule applies (ISO 8601 UTC).
      - name: expires_on
        type: datetime
        source: input
        description: Last instant the fee schedule applies (ISO 8601 UTC); MUST be strictly after effective_from.
      - name: amendment_round
        type: integer
        source: system
        default: 0
        description: Number of executed amendments; incremented on every UNDER_AMENDMENT -> EXECUTED transition.
      - name: amendment_reason
        type: string
        source: system
        default: null
        description: Reason recorded when an amendment is opened.
      - name: termination_reason
        type: string
        source: system
        default: null
        description: Reason recorded on terminate, or the phrase "SUPERSEDED_BY_NEW_AGREEMENT" when a newly executed agreement displaces this one.
      - name: status
        type: enum
        source: system
        default: DRAFT
        description: Agreement lifecycle state; at most one agreement per landfill is EXECUTED or UNDER_AMENDMENT at any time.
        constraints: "one of {DRAFT, EXECUTED, UNDER_AMENDMENT, TERMINATED}"

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:

  # ---------------------------------------------------------------------------
  # Cell — fork-join: the CQA branch (LinerQaPackage) and the regulatory branch
  # (RegulatoryAgency authorization) must BOTH complete before waste placement.
  # The CQA branch forks into an approve edge and a return edge whose
  # side-effect sets are disjoint, and the return edge is a revert to
  # UNDER_CONSTRUCTION.
  # ---------------------------------------------------------------------------
  - entity: Cell
    initial_state: DESIGN
    terminal_states: [CLOSED, REJECTED]
    transitions:
      - from: DESIGN
        to: UNDER_CONSTRUCTION
        trigger: "POST /cells/{cell_id}/begin-construction"
        actor: SiteOperator
        preconditions:
          - "Cell.status == DESIGN"
          - "Landfill.operating_status != CLOSED for Cell.landfill_id"
          - "if Cell.piggyback_over_cell_id is not null then that Cell.status == CLOSED, else ERR_PIGGYBACK_PARENT_NOT_CLOSED"
        side_effects:
          - "Cell.updated_at refreshed; Cell.version incremented by 1"

      - from: UNDER_CONSTRUCTION
        to: QA_REVIEW
        trigger: "POST /liner-qa-packages (system cascade from LinerQaPackage creation)"
        actor: system
        preconditions:
          - "Cell.status == UNDER_CONSTRUCTION"
          - "no LinerQaPackage of this cell has status IN {SUBMITTED, UNDER_REVIEW}"
        side_effects:
          - "Cell.status set to QA_REVIEW; Cell.version incremented by 1"

      - from: QA_REVIEW
        to: UNDER_CONSTRUCTION
        trigger: "POST /liner-qa-packages/{liner_qa_package_id}/return (system cascade, revision_round < 3)"
        actor: system
        preconditions:
          - "Cell.status == QA_REVIEW"
        side_effects:
          - "Cell.status reverted to UNDER_CONSTRUCTION; Cell.version incremented by 1"
          - "Landfill.certified_airspace_cy is NOT changed on this branch (the return branch grants no airspace credit)"
        note: Revert edge of the CQA fork; its side-effect set is disjoint from the approve edge below.

      - from: QA_REVIEW
        to: REJECTED
        trigger: "POST /liner-qa-packages/{liner_qa_package_id}/return (system cascade, revision_round == 3)"
        actor: system
        preconditions:
          - "Cell.status == QA_REVIEW"
          - "LinerQaPackage.revision_round == 3 (MAX_REVISION_ROUNDS)"
        side_effects:
          - "Cell.status set to REJECTED (terminal); Cell.version incremented by 1"
          - "Landfill.certified_airspace_cy is NOT changed"

      - from: QA_REVIEW
        to: QA_CERTIFIED
        trigger: "POST /liner-qa-packages/{liner_qa_package_id}/approve (system cascade)"
        actor: system
        preconditions:
          - "Cell.status == QA_REVIEW"
          - "LinerQaPackage.qa_conformance_score >= 85.0"
        side_effects:
          - "CASCADE LINK 1: Cell.status set to QA_CERTIFIED; Cell.version incremented by 1"
          - "CASCADE LINK 2 (caused by link 1): Landfill.certified_airspace_cy recomputed (now includes this Cell.design_airspace_cy); Landfill.remaining_airspace_cy and Landfill.remaining_life_years recomputed by remaining_life_projection; Landfill.version incremented by 1"
          - "CASCADE LINK 2b (caused by link 2): if Landfill.operating_status == RESTRICTED_AIRSPACE and the recomputed Landfill.remaining_life_years >= 2.0 then Landfill.operating_status set to OPEN"
          - "CASCADE LINK 3 (caused by link 2, because the certified airspace basis changed): the ClosureCostEstimate of this landfill whose status == CERTIFIED, if any, has status set to STALE and its version incremented by 1"
          - "CASCADE LINK 4 (caused by link 3, because the certified estimate went STALE): Landfill.financial_assurance_status set to SHORTFALL_REVIEW; Landfill.version incremented by 1 again"
        note: Depth-4 transitive cascade; each link is caused by the previous link, not by the approve action itself.

      - from: QA_CERTIFIED
        to: READY_FOR_WASTE
        trigger: "POST /cells/{cell_id}/authorize-waste-placement"
        actor: RegulatoryAgency
        preconditions:
          - "Cell.status == QA_CERTIFIED"
          - "Landfill.operating_status != CLOSED"
          - "Landfill.gas_collection_status == COMPLIANT, else ERR_GAS_CORRECTIVE_ACTION_OPEN"
          - "Landfill.financial_assurance_status == FUNDED, else ERR_FINANCIAL_ASSURANCE_SHORTFALL"
        side_effects:
          - "Cell.authorized_by_agency_user_id set to X-User-ID; Cell.version incremented by 1"
        note: Regulatory branch of the fork-join; the join is complete only when both branches have run.

      - from: READY_FOR_WASTE
        to: ACTIVE
        trigger: "POST /cells/{cell_id}/activate"
        actor: SiteOperator
        preconditions:
          - "Cell.status == READY_FOR_WASTE"
          - "Landfill.operating_status != CLOSED"
        side_effects:
          - "Landfill.active_cell_count recomputed (increases by 1); Landfill.version incremented by 1"
          - "if Landfill.operating_status == SUSPENDED_NO_AIRSPACE then Landfill.operating_status set to OPEN"
          - "caused by the preceding Landfill.operating_status change to OPEN: every SpecialWasteApproval of this landfill whose status == SUSPENDED has status set back to APPROVED and its version incremented by 1"

      - from: ACTIVE
        to: FULL
        trigger: "POST /operating-days/{operating_day_id}/close (system cascade, fill threshold reached)"
        actor: system
        preconditions:
          - "Cell.status == ACTIVE"
          - "Cell.consumed_airspace_cy >= Cell.design_airspace_cy * 0.98 after the day's consumption is applied (CELL_FULL_FRACTION, inclusive >=)"
        side_effects:
          - "Cell.status set to FULL; Cell.version incremented by 1"
          - "Landfill.active_cell_count recomputed (decreases by 1)"
          - "if Landfill.active_cell_count becomes 0 then Landfill.operating_status set to SUSPENDED_NO_AIRSPACE"

      - from: FULL
        to: ACTIVE
        trigger: "POST /operating-days/{operating_day_id}/amend (system cascade, fill drops back under threshold)"
        actor: system
        preconditions:
          - "Cell.status == FULL"
          - "Cell.consumed_airspace_cy < Cell.design_airspace_cy * 0.98 after the amended day's consumption is reversed"
        side_effects:
          - "Cell.status set back to ACTIVE; Cell.version incremented by 1"
          - "Landfill.active_cell_count recomputed (increases by 1)"
          - "if Landfill.operating_status == SUSPENDED_NO_AIRSPACE and Landfill.active_cell_count > 0 then Landfill.operating_status set to OPEN, and every SpecialWasteApproval of this landfill whose status == SUSPENDED has status set back to APPROVED"

      - from: FULL
        to: CLOSED
        trigger: "POST /cells/{cell_id}/close"
        actor: SiteOperator
        preconditions:
          - "Cell.status == FULL"
          - "every GasWell whose cell_id is this cell has status IN {ONLINE, ABANDONED}, else ERR_CELL_HAS_UNFINISHED_WELLS"
        side_effects:
          - "Cell.status set to CLOSED (terminal); final_cover_reference stored; Cell.version incremented by 1"
          - "Landfill.certified_airspace_cy and remaining_airspace_cy recomputed. Both figures are unchanged in value, because a CLOSED cell stays inside the certified set {QA_CERTIFIED, READY_FOR_WASTE, ACTIVE, FULL, CLOSED}; only the closure-cost basis (which excludes CLOSED) shrinks."
          - "Landfill.version incremented by 1"

  # ---------------------------------------------------------------------------
  # LinerQaPackage — cyclic revision loop with a bounded round count.
  # ---------------------------------------------------------------------------
  - entity: LinerQaPackage
    initial_state: SUBMITTED
    terminal_states: [APPROVED, REJECTED]
    transitions:
      - from: SUBMITTED
        to: UNDER_REVIEW
        trigger: "POST /liner-qa-packages/{liner_qa_package_id}/begin-review"
        actor: CqaEngineer
        preconditions:
          - "LinerQaPackage.status == SUBMITTED"
        side_effects:
          - "LinerQaPackage.reviewed_by_user_id set to X-User-ID; version incremented by 1"

      - from: UNDER_REVIEW
        to: RETURNED
        trigger: "POST /liner-qa-packages/{liner_qa_package_id}/return"
        actor: CqaEngineer
        preconditions:
          - "LinerQaPackage.status == UNDER_REVIEW"
          - "LinerQaPackage.revision_round < 3 (MAX_REVISION_ROUNDS)"
        side_effects:
          - "LinerQaPackage.revision_round incremented by 1; version incremented by 1"
          - "caused by this return: the parent Cell transitions QA_REVIEW -> UNDER_CONSTRUCTION"

      - from: UNDER_REVIEW
        to: REJECTED
        trigger: "POST /liner-qa-packages/{liner_qa_package_id}/return"
        actor: CqaEngineer
        preconditions:
          - "LinerQaPackage.status == UNDER_REVIEW"
          - "LinerQaPackage.revision_round == 3 (MAX_REVISION_ROUNDS)"
        side_effects:
          - "LinerQaPackage.status set to REJECTED (terminal); version incremented by 1"
          - "caused by this rejection: the parent Cell transitions QA_REVIEW -> REJECTED"
        note: Same trigger as the RETURNED edge; the branch is selected purely by revision_round.

      - from: RETURNED
        to: SUBMITTED
        trigger: "POST /liner-qa-packages/{liner_qa_package_id}/resubmit"
        actor: SiteOperator | CqaEngineer
        preconditions:
          - "LinerQaPackage.status == RETURNED"
          - "the parent Cell.status == UNDER_CONSTRUCTION"
        side_effects:
          - "seam_length_ft, destructive_test_count, passing_test_count, panel_count, defect_count overwritten from the request body"
          - "LinerQaPackage.qa_conformance_score recomputed by qa_conformance_score"
          - "LinerQaPackage.submitted_by_user_id overwritten with X-User-ID; reviewed_by_user_id reset to null; version incremented by 1"
          - "caused by this resubmission: the parent Cell transitions UNDER_CONSTRUCTION -> QA_REVIEW"
        note: Closes the cycle SUBMITTED -> UNDER_REVIEW -> RETURNED -> SUBMITTED.

      - from: UNDER_REVIEW
        to: APPROVED
        trigger: "POST /liner-qa-packages/{liner_qa_package_id}/approve"
        actor: CqaEngineer
        preconditions:
          - "LinerQaPackage.status == UNDER_REVIEW"
          - "LinerQaPackage.submitted_by_user_id != X-User-ID, else ERR_SEGREGATION_OF_DUTIES"
          - "LinerQaPackage.qa_conformance_score >= 85.0 (QA_APPROVAL_MIN_SCORE, inclusive >=), else ERR_QA_SCORE_BELOW_THRESHOLD"
        side_effects:
          - "LinerQaPackage.certification_reference set from the request body; version incremented by 1"
          - "caused by this approval: the parent Cell transitions QA_REVIEW -> QA_CERTIFIED, which itself drives cascade links 2, 3 and 4 declared on that transition"

  # ---------------------------------------------------------------------------
  # OperatingDay — cyclic: OPEN -> CLOSED -> AMENDED -> CLOSED. The close edge
  # carries the depth-4 airspace cascade; the amend edge is its exact
  # compensating action.
  # ---------------------------------------------------------------------------
  - entity: OperatingDay
    initial_state: OPEN
    terminal_states: []
    transitions:
      - from: OPEN
        to: CLOSED
        trigger: "POST /operating-days/{operating_day_id}/close"
        actor: SiteOperator
        preconditions:
          - "OperatingDay.status == OPEN"
          - "no WasteLoad of this day has screening_status == PENDING, else ERR_PENDING_SCREENING_PRESENT"
          - "every WasteLoad of this day whose screening_status == CLEARED has certified_net_tons != null, else ERR_UNCERTIFIED_LOADS_PRESENT"
          - "a HostCommunityAgreement of this landfill exists with status IN {EXECUTED, UNDER_AMENDMENT}, else ERR_NO_EXECUTED_HOST_AGREEMENT"
        side_effects:
          - "STEP 1: OperatingDay.tons_placed recomputed as the sum of certified_net_tons over this day's CLEARED loads"
          - "STEP 2: OperatingDay.effective_density_tons_per_cy and OperatingDay.airspace_consumed_cy written by daily_airspace_consumption"
          - "STEP 3: every WasteLoad of this day with screening_status == CLEARED and billing_status == PROVISIONAL moves billing_status to FINALIZED, and its host_royalty_amount and final_charge_amount are written by host_community_royalty_waterfall and load_tipping_charge variant certified_scale, processed in chronological order (OperatingDay.operating_date ASC, WasteLoad.created_at ASC)"
          - "STEP 4: OperatingDay.status set to CLOSED; version incremented by 1"
          - "CASCADE LINK 1 (caused by step 2): Cell.consumed_airspace_cy and Cell.fill_pct recomputed for OperatingDay.active_cell_id; Cell.version incremented by 1"
          - "CASCADE LINK 2 (caused by link 1): if Cell.consumed_airspace_cy >= Cell.design_airspace_cy * 0.98 then Cell transitions ACTIVE -> FULL"
          - "CASCADE LINK 3 (caused by link 2): Landfill.active_cell_count recomputed; if it becomes 0 then Landfill.operating_status set to SUSPENDED_NO_AIRSPACE; Landfill.version incremented by 1"
          - "CASCADE LINK 4 (caused by link 3, because the site stopped accepting waste): every SpecialWasteApproval of this landfill whose status == APPROVED has status set to SUSPENDED and its version incremented by 1"
          - "LEDGER SYNC: Landfill.consumed_airspace_cy, Landfill.remaining_airspace_cy and Landfill.remaining_life_years recomputed; if Landfill.remaining_life_years < 2.0 (SITE_LIFE_RESTRICT_YEARS) and Landfill.operating_status == OPEN then Landfill.operating_status set to RESTRICTED_AIRSPACE"
          - "TONNAGE SYNC: SpecialWasteApproval.consumed_tons recomputed for every approval referenced by this day's CLEARED loads; any such approval whose status == APPROVED and whose consumed_tons >= approved_tons_cap has status set to EXHAUSTED"
        note: Depth-4 transitive cascade whose trigger differs from the LinerQaPackage approve cascade.

      - from: CLOSED
        to: AMENDED
        trigger: "POST /operating-days/{operating_day_id}/amend"
        actor: SiteOperator
        preconditions:
          - "OperatingDay.status == CLOSED"
          - "Landfill.operating_status != CLOSED"
        side_effects:
          - "COMPENSATION 1: OperatingDay.airspace_consumed_cy and OperatingDay.effective_density_tons_per_cy reset to 0; OperatingDay.tons_placed reset to 0; amend_reason recorded; status set to AMENDED; version incremented by 1"
          - "COMPENSATION 2: Cell.consumed_airspace_cy and Cell.fill_pct recomputed (the amended day no longer contributes), so the airspace ledger returns to its exact pre-close value"
          - "COMPENSATION 3: if Cell.status == FULL and the recomputed Cell.consumed_airspace_cy < Cell.design_airspace_cy * 0.98 then Cell transitions FULL -> ACTIVE, which recomputes Landfill.active_cell_count and lifts SUSPENDED_NO_AIRSPACE and un-suspends SUSPENDED special-waste approvals"
          - "COMPENSATION 4: every WasteLoad of this day with billing_status == FINALIZED moves billing_status back to PROVISIONAL and has final_charge_amount and host_royalty_amount reset to null; gate_charge_amount is left untouched"
          - "COMPENSATION 5: Landfill.consumed_airspace_cy, Landfill.remaining_airspace_cy and Landfill.remaining_life_years recomputed; SpecialWasteApproval.consumed_tons recomputed and any EXHAUSTED approval whose consumed_tons < approved_tons_cap has status set back to APPROVED"

      - from: AMENDED
        to: CLOSED
        trigger: "POST /operating-days/{operating_day_id}/close"
        actor: SiteOperator
        preconditions:
          - "OperatingDay.status == AMENDED"
          - "no WasteLoad of this day has screening_status == PENDING"
          - "every WasteLoad of this day whose screening_status == CLEARED has certified_net_tons != null"
          - "a HostCommunityAgreement of this landfill exists with status IN {EXECUTED, UNDER_AMENDMENT}"
        side_effects:
          - "identical to the OPEN -> CLOSED edge, re-applying every step and cascade link against the current load set"
        note: Closes the cycle OPEN -> CLOSED -> AMENDED -> CLOSED.

  # ---------------------------------------------------------------------------
  # WasteLoad — two independent state dimensions on one row: screening_status
  # (acceptance) and billing_status (tipping fee). Billing additionally loops
  # PROVISIONAL -> FINALIZED -> PROVISIONAL across day close and day amend.
  # ---------------------------------------------------------------------------
  - entity: WasteLoad
    initial_state: PENDING
    terminal_states: [REJECTED]
    transitions:
      - from: PENDING
        to: CLEARED
        trigger: "POST /waste-loads/{waste_load_id}/clear-screening"
        actor: ScaleOperator
        preconditions:
          - "WasteLoad.screening_status IN {PENDING, FLAGGED}"
          - "OperatingDay.status == OPEN for WasteLoad.operating_day_id, else ERR_INVALID_STATE_TRANSITION"
          - "Landfill.operating_status IN {OPEN, RESTRICTED_AIRSPACE}, else ERR_SITE_NOT_ACCEPTING_WASTE"
          - "the OperatingDay.active_cell_id Cell.status == ACTIVE, else ERR_CELL_NOT_ACCEPTING_WASTE"
          - "WasteLoad.load_check_result == PASS, else ERR_PROHIBITED_MATERIAL"
          - "if WasteLoad.special_waste_approval_id is not null then that SpecialWasteApproval.status == APPROVED and effective_from <= OperatingDay.operating_date <= expires_on, else ERR_APPROVAL_EXPIRED"
          - "a HostCommunityAgreement of this landfill exists with status IN {EXECUTED, UNDER_AMENDMENT}, else ERR_NO_EXECUTED_HOST_AGREEMENT"
          - "if WasteLoad.special_waste_approval_id is not null then SpecialWasteApproval.consumed_tons + WasteLoad.manifest_tons <= SpecialWasteApproval.approved_tons_cap, else ERR_APPROVAL_TONNAGE_CAP_EXCEEDED"
        side_effects:
          - "WasteLoad.screening_status set to CLEARED"
          - "WasteLoad.billing_status moves UNBILLED -> PROVISIONAL and gate_charge_amount is written by load_tipping_charge variant gate_rate (independent dimension advanced by the same call)"
          - "SpecialWasteApproval.consumed_tons recomputed when the load references an approval; its version incremented by 1"
          - "WasteLoad.version incremented by 1"

      - from: PENDING
        to: FLAGGED
        trigger: "POST /waste-loads/{waste_load_id}/flag"
        actor: ScaleOperator
        preconditions:
          - "WasteLoad.screening_status == PENDING"
          - "OperatingDay.status == OPEN"
        side_effects:
          - "WasteLoad.screening_state_reason recorded; version incremented by 1"
          - "WasteLoad.billing_status unchanged (stays UNBILLED)"

      - from: FLAGGED
        to: REJECTED
        trigger: "POST /waste-loads/{waste_load_id}/reject"
        actor: ScaleOperator
        preconditions:
          - "WasteLoad.screening_status IN {PENDING, FLAGGED}"
          - "OperatingDay.status == OPEN"
        side_effects:
          - "WasteLoad.screening_status set to REJECTED (terminal on this dimension); screening_state_reason recorded"
          - "WasteLoad.billing_status set to VOID; gate_charge_amount reset to null"
          - "SpecialWasteApproval.consumed_tons recomputed when the load references an approval, restoring the pre-clearance total exactly"
          - "WasteLoad.version incremented by 1"

      - from: UNBILLED
        to: PROVISIONAL
        trigger: "POST /waste-loads/{waste_load_id}/clear-screening (billing dimension)"
        actor: ScaleOperator
        preconditions:
          - "WasteLoad.billing_status == UNBILLED"
        side_effects:
          - "gate_charge_amount written by load_tipping_charge variant gate_rate"

      - from: PROVISIONAL
        to: FINALIZED
        trigger: "POST /operating-days/{operating_day_id}/close (billing dimension, system cascade)"
        actor: system
        preconditions:
          - "WasteLoad.billing_status == PROVISIONAL"
          - "WasteLoad.screening_status == CLEARED"
          - "WasteLoad.certified_net_tons != null"
        side_effects:
          - "host_royalty_amount and final_charge_amount written by host_community_royalty_waterfall and load_tipping_charge variant certified_scale"

      - from: FINALIZED
        to: PROVISIONAL
        trigger: "POST /operating-days/{operating_day_id}/amend (billing dimension, system cascade)"
        actor: system
        preconditions:
          - "WasteLoad.billing_status == FINALIZED"
        side_effects:
          - "final_charge_amount and host_royalty_amount reset to null; gate_charge_amount retained"
        note: Closes the billing-dimension cycle PROVISIONAL -> FINALIZED -> PROVISIONAL.

  # ---------------------------------------------------------------------------
  # AerialSurvey — at most one RECORDED survey per landfill; void restores the
  # most recent SUPERSEDED survey.
  # ---------------------------------------------------------------------------
  - entity: AerialSurvey
    initial_state: RECORDED
    terminal_states: [VOID]
    transitions:
      - from: RECORDED
        to: SUPERSEDED
        trigger: "POST /aerial-surveys (system cascade when a newer survey is recorded for the same landfill)"
        actor: system
        preconditions:
          - "AerialSurvey.status == RECORDED"
          - "AerialSurvey.landfill_id equals the new survey's landfill_id"
        side_effects:
          - "AerialSurvey.status set to SUPERSEDED; version incremented by 1"

      - from: RECORDED
        to: VOID
        trigger: "POST /aerial-surveys/{aerial_survey_id}/void"
        actor: SurveyorOfRecord
        preconditions:
          - "AerialSurvey.status == RECORDED"
        side_effects:
          - "AerialSurvey.void_reason recorded; status set to VOID (terminal); version incremented by 1"
          - "RESTORE: the AerialSurvey of the same landfill with status == SUPERSEDED ranked first by (flown_on DESC, created_at DESC) has status set back to RECORDED and its version incremented by 1; when the candidate set is empty no survey is restored"
          - "Landfill.remaining_life_years recomputed by remaining_life_projection (the projection variant may flip from survey_based back to ledger_based); Landfill.version incremented by 1"

      - from: SUPERSEDED
        to: RECORDED
        trigger: "POST /aerial-surveys/{aerial_survey_id}/void (system cascade restoring the previous survey)"
        actor: system
        preconditions:
          - "AerialSurvey.status == SUPERSEDED"
          - "this survey is ranked first among the landfill's SUPERSEDED surveys by (flown_on DESC, created_at DESC)"
        side_effects:
          - "AerialSurvey.status set back to RECORDED; version incremented by 1"

  # ---------------------------------------------------------------------------
  # SpecialWasteApproval
  # ---------------------------------------------------------------------------
  - entity: SpecialWasteApproval
    initial_state: REQUESTED
    terminal_states: [DENIED, REVOKED]
    transitions:
      - from: REQUESTED
        to: APPROVED
        trigger: "POST /special-waste-approvals/{special_waste_approval_id}/approve"
        actor: EnvironmentalManager
        preconditions:
          - "SpecialWasteApproval.status == REQUESTED"
          - "Landfill.operating_status != CLOSED"
        side_effects:
          - "SpecialWasteApproval.version incremented by 1"

      - from: REQUESTED
        to: DENIED
        trigger: "POST /special-waste-approvals/{special_waste_approval_id}/deny"
        actor: EnvironmentalManager
        preconditions:
          - "SpecialWasteApproval.status == REQUESTED"
        side_effects:
          - "decision_reason recorded; status set to DENIED (terminal); version incremented by 1"

      - from: APPROVED
        to: REVOKED
        trigger: "POST /special-waste-approvals/{special_waste_approval_id}/revoke"
        actor: EnvironmentalManager
        preconditions:
          - "SpecialWasteApproval.status IN {APPROVED, SUSPENDED, EXHAUSTED}"
        side_effects:
          - "decision_reason recorded; status set to REVOKED (terminal); version incremented by 1"

      - from: APPROVED
        to: SUSPENDED
        trigger: "POST /operating-days/{operating_day_id}/close (system cascade link 4, site stopped accepting waste)"
        actor: system
        preconditions:
          - "SpecialWasteApproval.status == APPROVED"
          - "Landfill.operating_status became SUSPENDED_NO_AIRSPACE on this request"
        side_effects:
          - "SpecialWasteApproval.status set to SUSPENDED; version incremented by 1"

      - from: SUSPENDED
        to: APPROVED
        trigger: "POST /cells/{cell_id}/activate or POST /operating-days/{operating_day_id}/amend (system cascade, site resumed acceptance)"
        actor: system
        preconditions:
          - "SpecialWasteApproval.status == SUSPENDED"
          - "Landfill.operating_status changed away from SUSPENDED_NO_AIRSPACE on this request"
        side_effects:
          - "SpecialWasteApproval.status set back to APPROVED; version incremented by 1"

      - from: APPROVED
        to: EXHAUSTED
        trigger: "POST /operating-days/{operating_day_id}/close (system cascade, tonnage sync)"
        actor: system
        preconditions:
          - "SpecialWasteApproval.status == APPROVED"
          - "SpecialWasteApproval.consumed_tons >= SpecialWasteApproval.approved_tons_cap after the tonnage sync (inclusive >=)"
        side_effects:
          - "SpecialWasteApproval.status set to EXHAUSTED; version incremented by 1"

      - from: EXHAUSTED
        to: APPROVED
        trigger: "POST /operating-days/{operating_day_id}/amend (system cascade, compensation 5)"
        actor: system
        preconditions:
          - "SpecialWasteApproval.status == EXHAUSTED"
          - "SpecialWasteApproval.consumed_tons < SpecialWasteApproval.approved_tons_cap after the compensating recomputation"
        side_effects:
          - "SpecialWasteApproval.status set back to APPROVED; version incremented by 1"

  # ---------------------------------------------------------------------------
  # TreatmentAgreement — cyclic suspend/reinstate plus a lazy expiry edge.
  # ---------------------------------------------------------------------------
  - entity: TreatmentAgreement
    initial_state: ACTIVE
    terminal_states: [EXPIRED]
    transitions:
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /treatment-agreements/{treatment_agreement_id}/suspend"
        actor: EnvironmentalManager
        preconditions:
          - "TreatmentAgreement.status == ACTIVE"
        side_effects:
          - "suspension_reason recorded; version incremented by 1"

      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /treatment-agreements/{treatment_agreement_id}/reinstate"
        actor: EnvironmentalManager
        preconditions:
          - "TreatmentAgreement.status == SUSPENDED"
          - "the current logical clock is <= TreatmentAgreement.expires_on"
        side_effects:
          - "suspension_reason reset to null; version incremented by 1"

      - from: ACTIVE
        to: EXPIRED
        trigger: "POST /leachate-shipments (system lazy-expiry evaluation)"
        actor: system
        preconditions:
          - "TreatmentAgreement.status IN {ACTIVE, SUSPENDED}"
          - "the current logical clock is > TreatmentAgreement.expires_on"
        side_effects:
          - "TreatmentAgreement.status set to EXPIRED (terminal); version incremented by 1"
          - "the triggering POST /leachate-shipments request is then rejected with ERR_AGREEMENT_NOT_ACTIVE"
        note: The only producer of EXPIRED; evaluated before the shipment's own validations 19 and 26.

  # ---------------------------------------------------------------------------
  # LeachateShipment
  # ---------------------------------------------------------------------------
  - entity: LeachateShipment
    initial_state: SCHEDULED
    terminal_states: [ACCEPTED, REJECTED_AT_GATE, CANCELLED]
    transitions:
      - from: SCHEDULED
        to: DISPATCHED
        trigger: "POST /leachate-shipments/{leachate_shipment_id}/dispatch"
        actor: SiteOperator
        preconditions:
          - "LeachateShipment.status == SCHEDULED"
          - "TreatmentAgreement.status == ACTIVE, else ERR_AGREEMENT_NOT_ACTIVE"
        side_effects:
          - "hauler_ref recorded; version incremented by 1"
          - "TreatmentAgreement.scheduled_gallons_today unchanged (DISPATCHED remains inside the counted set)"

      - from: DISPATCHED
        to: ACCEPTED
        trigger: "POST /leachate-shipments/{leachate_shipment_id}/confirm-acceptance"
        actor: SiteOperator
        preconditions:
          - "LeachateShipment.status == DISPATCHED"
        side_effects:
          - "treatment_fee, surcharge_pct and invoice_total written by leachate_disposal_invoice; version incremented by 1"
          - "TreatmentAgreement.scheduled_gallons_today unchanged (ACCEPTED remains inside the counted set)"

      - from: DISPATCHED
        to: REJECTED_AT_GATE
        trigger: "POST /leachate-shipments/{leachate_shipment_id}/reject-at-gate"
        actor: SiteOperator
        preconditions:
          - "LeachateShipment.status == DISPATCHED"
        side_effects:
          - "gate_reason recorded; status set to REJECTED_AT_GATE (terminal); version incremented by 1"
          - "TreatmentAgreement.scheduled_gallons_today recomputed and decreases by exactly LeachateShipment.gallons"

      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /leachate-shipments/{leachate_shipment_id}/cancel"
        actor: SiteOperator
        preconditions:
          - "LeachateShipment.status == SCHEDULED"
        side_effects:
          - "gate_reason recorded; status set to CANCELLED (terminal); version incremented by 1"
          - "COMPENSATION: TreatmentAgreement.scheduled_gallons_today recomputed and decreases by exactly LeachateShipment.gallons, restoring the pre-scheduling total"

  # ---------------------------------------------------------------------------
  # GasWell — cyclic wellfield tuning loop; the tune trigger branches on spec.
  # ---------------------------------------------------------------------------
  - entity: GasWell
    initial_state: DRILLED
    terminal_states: [ABANDONED]
    transitions:
      - from: DRILLED
        to: CONNECTED
        trigger: "POST /gas-wells/{gas_well_id}/connect"
        actor: EnvironmentalManager
        preconditions:
          - "GasWell.status IN {DRILLED, OFFLINE}"
          - "the parent Cell.status IN {ACTIVE, FULL, CLOSED}, else ERR_CELL_NOT_READY_FOR_WELLFIELD"
        side_effects:
          - "GasWell.version incremented by 1"

      - from: CONNECTED
        to: ONLINE
        trigger: "POST /gas-wells/{gas_well_id}/tune (readings within spec)"
        actor: EnvironmentalManager
        preconditions:
          - "GasWell.status IN {CONNECTED, TUNING_REQUIRED, ONLINE}"
          - "oxygen_pct < 12.0 (strictly below WELL_OXYGEN_CRITICAL_PCT, which is itself critical), else ERR_WELL_OXYGEN_CRITICAL and no state change"
          - "methane_pct >= 45.0 AND oxygen_pct <= 5.0 AND vacuum_in_h2o >= 10.0 (all inclusive)"
        side_effects:
          - "last_vacuum_in_h2o, last_methane_pct, last_oxygen_pct written from the request body; last_tuned_at set to the current logical clock; version incremented by 1"
          - "if no GasWell of this landfill's cells remains TUNING_REQUIRED and no SurfaceEmissionScan of this landfill is EXCEEDANCE_OPEN then Landfill.gas_collection_status set to COMPLIANT and Landfill.version incremented by 1"

      - from: CONNECTED
        to: TUNING_REQUIRED
        trigger: "POST /gas-wells/{gas_well_id}/tune (readings outside spec)"
        actor: EnvironmentalManager
        preconditions:
          - "GasWell.status IN {CONNECTED, TUNING_REQUIRED, ONLINE}"
          - "oxygen_pct < 12.0 (strictly below WELL_OXYGEN_CRITICAL_PCT)"
          - "methane_pct < 45.0 OR oxygen_pct > 5.0 OR vacuum_in_h2o < 10.0"
        side_effects:
          - "last_vacuum_in_h2o, last_methane_pct, last_oxygen_pct written; last_tuned_at set to the current logical clock; version incremented by 1"
          - "Landfill.gas_collection_status set to CORRECTIVE_ACTION; Landfill.version incremented by 1"
        note: Same trigger as the ONLINE edge; the branch is selected purely by the three reading thresholds, and the two branches have disjoint side-effect sets.

      - from: ONLINE
        to: TUNING_REQUIRED
        trigger: "POST /surface-emission-scans (system cascade link 2, exceedance recorded)"
        actor: system
        preconditions:
          - "GasWell.status == ONLINE"
          - "this well is the corrective well selected by the surface_exceedance_corrective_well selector"
        side_effects:
          - "GasWell.status set to TUNING_REQUIRED; version incremented by 1"

      - from: TUNING_REQUIRED
        to: ONLINE
        trigger: "POST /gas-wells/{gas_well_id}/tune (readings within spec)"
        actor: EnvironmentalManager
        preconditions:
          - "GasWell.status == TUNING_REQUIRED"
          - "methane_pct >= 45.0 AND oxygen_pct <= 5.0 AND vacuum_in_h2o >= 10.0"
        side_effects:
          - "identical to the CONNECTED -> ONLINE edge"
        note: Closes the cycle ONLINE -> TUNING_REQUIRED -> ONLINE.

      - from: ONLINE
        to: OFFLINE
        trigger: "POST /gas-wells/{gas_well_id}/take-offline"
        actor: EnvironmentalManager
        preconditions:
          - "GasWell.status IN {CONNECTED, TUNING_REQUIRED, ONLINE}"
        side_effects:
          - "offline_reason recorded; version incremented by 1"
          - "if no GasWell of this landfill's cells remains TUNING_REQUIRED and no SurfaceEmissionScan of this landfill is EXCEEDANCE_OPEN then Landfill.gas_collection_status set to COMPLIANT"

      - from: OFFLINE
        to: ABANDONED
        trigger: "POST /gas-wells/{gas_well_id}/abandon"
        actor: EnvironmentalManager
        preconditions:
          - "GasWell.status == OFFLINE"
        side_effects:
          - "offline_reason overwritten with the abandonment reason; status set to ABANDONED (terminal); version incremented by 1"

  # ---------------------------------------------------------------------------
  # SurfaceEmissionScan
  # ---------------------------------------------------------------------------
  - entity: SurfaceEmissionScan
    initial_state: PASSED
    terminal_states: [PASSED, RESOLVED]
    transitions:
      - from: PASSED
        to: EXCEEDANCE_OPEN
        trigger: "POST /surface-emission-scans (system, max_reading_ppm >= 500)"
        actor: system
        preconditions:
          - "max_reading_ppm >= 500.0 (SEM_EXCEEDANCE_PPM, inclusive >=)"
          - "exceedance_point_ref is present in the request body"
        side_effects:
          - "CASCADE LINK 1: SurfaceEmissionScan.status set to EXCEEDANCE_OPEN at creation"
          - "CASCADE LINK 2 (caused by link 1): the GasWell chosen by the surface_exceedance_corrective_well selector transitions ONLINE -> TUNING_REQUIRED and its id is written to SurfaceEmissionScan.corrective_well_id; when the candidate pool is empty corrective_well_id stays null and no well is mutated"
          - "CASCADE LINK 3 (caused by link 2, because the wellfield left compliant operation): Landfill.gas_collection_status set to CORRECTIVE_ACTION; Landfill.version incremented by 1. This link fires even when the candidate pool was empty, because the exceedance itself is unresolved."
        note: Depth-3 transitive cascade whose trigger differs from both the day-close and the QA-approve cascades.

      - from: EXCEEDANCE_OPEN
        to: RESOLVED
        trigger: "POST /surface-emission-scans/{surface_emission_scan_id}/resolve"
        actor: EnvironmentalManager
        preconditions:
          - "SurfaceEmissionScan.status == EXCEEDANCE_OPEN"
          - "SurfaceEmissionScan.corrective_well_id is null OR that GasWell.status == ONLINE, else ERR_INVALID_STATE_TRANSITION"
        side_effects:
          - "remediation_note recorded; status set to RESOLVED (terminal); version incremented by 1"
          - "if no other SurfaceEmissionScan of this landfill has status == EXCEEDANCE_OPEN and no GasWell of this landfill's cells has status == TUNING_REQUIRED then Landfill.gas_collection_status set to COMPLIANT and Landfill.version incremented by 1"

  # ---------------------------------------------------------------------------
  # ClosureCostEstimate — annual financial-assurance cost update.
  # ---------------------------------------------------------------------------
  - entity: ClosureCostEstimate
    initial_state: DRAFT
    terminal_states: [SUPERSEDED]
    transitions:
      - from: DRAFT
        to: CERTIFIED
        trigger: "POST /closure-cost-estimates/{closure_cost_estimate_id}/certify"
        actor: FinanceOfficer
        preconditions:
          - "ClosureCostEstimate.status == DRAFT"
          - "Landfill.operating_status != CLOSED"
        side_effects:
          - "closure_cost_total, post_closure_cost_total, required_assurance_amount and funding_shortfall recomputed by closure_and_post_closure_cost against the CURRENT certified cell set; version incremented by 1"
          - "every other ClosureCostEstimate of this landfill whose status IN {CERTIFIED, STALE} has status set to SUPERSEDED and its version incremented by 1"
          - "if funding_shortfall == 0 then Landfill.financial_assurance_status set to FUNDED"
          - "else if Landfill.financial_assurance_status == SHORTFALL_REVIEW then Landfill.financial_assurance_status set to LAPSED and Landfill.operating_status set to SUSPENDED_FINANCIAL (second consecutive shortfall)"
          - "else Landfill.financial_assurance_status set to SHORTFALL_REVIEW"
          - "Landfill.version incremented by 1"

      - from: CERTIFIED
        to: STALE
        trigger: "POST /liner-qa-packages/{liner_qa_package_id}/approve (system cascade link 3)"
        actor: system
        preconditions:
          - "ClosureCostEstimate.status == CERTIFIED"
          - "the landfill's certified_airspace_cy changed on this request"
        side_effects:
          - "ClosureCostEstimate.status set to STALE; version incremented by 1"
          - "caused by this staleness: Landfill.financial_assurance_status set to SHORTFALL_REVIEW"

      - from: CERTIFIED
        to: SUPERSEDED
        trigger: "POST /closure-cost-estimates/{closure_cost_estimate_id}/certify on a newer estimate of the same landfill"
        actor: system
        preconditions:
          - "ClosureCostEstimate.status IN {CERTIFIED, STALE}"
        side_effects:
          - "ClosureCostEstimate.status set to SUPERSEDED (terminal); version incremented by 1"

  # ---------------------------------------------------------------------------
  # HostCommunityAgreement — cyclic amendment loop.
  # ---------------------------------------------------------------------------
  - entity: HostCommunityAgreement
    initial_state: DRAFT
    terminal_states: [TERMINATED]
    transitions:
      - from: DRAFT
        to: EXECUTED
        trigger: "POST /host-community-agreements/{host_community_agreement_id}/execute"
        actor: FinanceOfficer
        preconditions:
          - "HostCommunityAgreement.status == DRAFT"
          - "no HostCommunityAgreement of this landfill has status == UNDER_AMENDMENT, else ERR_HOST_AGREEMENT_ALREADY_LIVE"
          - "expected_landfill_version matches Landfill.version, else ERR_STALE_LANDFILL_VERSION"
        side_effects:
          - "every other HostCommunityAgreement of this landfill whose status == EXECUTED has status set to TERMINATED with termination_reason SUPERSEDED_BY_NEW_AGREEMENT and its version incremented by 1"
          - "HostCommunityAgreement.version incremented by 1"
          - "Landfill.version incremented by 1"

      - from: EXECUTED
        to: UNDER_AMENDMENT
        trigger: "POST /host-community-agreements/{host_community_agreement_id}/open-amendment, POST /host-community-agreements/{host_community_agreement_id}/execute"
        actor: FinanceOfficer
        preconditions:
          - "HostCommunityAgreement.status == EXECUTED; when the addressed agreement is already UNDER_AMENDMENT the request is refused with ERR_AMENDMENT_IN_PROGRESS instead of ERR_INVALID_STATE_TRANSITION (priority-9 carve-out)"
        side_effects:
          - "amendment_reason recorded; version incremented by 1"

      - from: UNDER_AMENDMENT
        to: EXECUTED
        trigger: "POST /host-community-agreements/{host_community_agreement_id}/execute-amendment"
        actor: FinanceOfficer
        preconditions:
          - "HostCommunityAgreement.status == UNDER_AMENDMENT"
        side_effects:
          - "posted_tipping_fee_per_ton, host_fee_per_ton, tier1_monthly_tons, royalty_tier1_pct and royalty_tier2_pct overwritten from the request body"
          - "amendment_round incremented by 1; amendment_reason reset to null; version incremented by 1"
        note: Closes the cycle EXECUTED -> UNDER_AMENDMENT -> EXECUTED. Already-FINALIZED WasteLoads are never re-priced.

      - from: EXECUTED
        to: TERMINATED
        trigger: "POST /host-community-agreements/{host_community_agreement_id}/terminate"
        actor: FinanceOfficer
        preconditions:
          - "HostCommunityAgreement.status IN {DRAFT, EXECUTED}"
        side_effects:
          - "termination_reason recorded; status set to TERMINATED (terminal); version incremented by 1"

  # ---------------------------------------------------------------------------
  # Landfill — operator-driven posture edges. RESTRICTED_AIRSPACE,
  # SUSPENDED_NO_AIRSPACE and SUSPENDED_FINANCIAL are produced only by system
  # cascades declared above.
  # ---------------------------------------------------------------------------
  - entity: Landfill
    initial_state: OPEN
    terminal_states: [CLOSED]
    transitions:
      - from: RESTRICTED_AIRSPACE
        to: OPEN
        trigger: "POST /landfills/{landfill_id}/operating-status with operating_status OPEN"
        actor: PlatformAdmin
        preconditions:
          - "Landfill.operating_status IN {OPEN, RESTRICTED_AIRSPACE, SUSPENDED_NO_AIRSPACE, SUSPENDED_FINANCIAL}"
          - "if Landfill.operating_status == SUSPENDED_FINANCIAL then Landfill.financial_assurance_status == FUNDED, else ERR_FINANCIAL_ASSURANCE_SHORTFALL"
          - "if Landfill.operating_status == SUSPENDED_NO_AIRSPACE then Landfill.active_cell_count > 0, else ERR_INVALID_STATE_TRANSITION"
        side_effects:
          - "Landfill.operating_status set to OPEN; version incremented by 1"
          - "every SpecialWasteApproval of this landfill whose status == SUSPENDED has status set back to APPROVED"

      - from: OPEN
        to: CLOSED
        trigger: "POST /landfills/{landfill_id}/operating-status with operating_status CLOSED"
        actor: PlatformAdmin
        preconditions:
          - "Landfill.operating_status != CLOSED"
          - "every Cell of this landfill has status IN {CLOSED, REJECTED, DESIGN}, else ERR_INVALID_STATE_TRANSITION"
        side_effects:
          - "Landfill.operating_status set to CLOSED (terminal); version incremented by 1"

# =============================================================================
# §1.2.1 Concurrency Rules — OCC on Landfill.version only.
# =============================================================================
concurrency_rules:
  - rule_id: closure-estimate-create-stale-landfill
    parent_entity: Landfill
    write_endpoint: "POST /closure-cost-estimates"
    occ_field: "expected_landfill_version"
    description: |
      Creating a ClosureCostEstimate against a Landfill whose version has
      advanced since the client last observed it is rejected. An annual cost
      update legitimately supersedes the prior certified estimate for the same
      landfill, so a second create carrying an outdated expected_landfill_version
      would otherwise silently price closure against a certified-airspace basis
      the client never saw.
    error_id: ERR_STALE_LANDFILL_VERSION
    http_status: 412

  - rule_id: hca-execute-stale-landfill
    parent_entity: Landfill
    write_endpoint: "POST /host-community-agreements/{host_community_agreement_id}/execute"
    occ_field: "expected_landfill_version"
    description: |
      Executing a HostCommunityAgreement against a Landfill whose version has
      advanced since the client last observed it is rejected. Execution
      legitimately terminates and supersedes the landfill's prior EXECUTED
      agreement, so an outdated expected_landfill_version means the client is
      about to displace a fee schedule it has not read.
    error_id: ERR_STALE_LANDFILL_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:

  - name: daily_airspace_consumption
    trigger: "OperatingDay OPEN -> CLOSED and AMENDED -> CLOSED (POST /operating-days/{operating_day_id}/close); reversed by CLOSED -> AMENDED"
    algorithm: threshold
    formula: |
      # STEP 0 — input set
      cleared = [ L for L in WasteLoad if L.operating_day_id == day.id
                                      and L.screening_status == CLEARED ]
      tons_placed = round(sum(L.certified_net_tons for L in cleared), 2)

      # STEP 1 — effective in-place density (nested min/max over three inputs
      #          plus a conditional branch on working-face size)
      cover_factor = COVER_FACTOR[day.cover_material_type]
      if   day.working_face_area_sf >  15000: face_penalty = 0.90
      elif day.working_face_area_sf >   8000: face_penalty = 0.96
      else:                                   face_penalty = 1.00
      raw = landfill.planned_density_tons_per_cy * cover_factor * face_penalty
      effective_density_tons_per_cy = round(min(TARGET_DENSITY,
                                               max(DENSITY_FLOOR, raw)), 4)

      # STEP 2 — airspace consumed
      if tons_placed == 0:
          airspace_consumed_cy = 0.00
      else:
          airspace_consumed_cy = round(tons_placed / effective_density_tons_per_cy, 2)
    input_set: "Only WasteLoads of this OperatingDay whose screening_status == CLEARED. PENDING, FLAGGED and REJECTED loads are excluded, and their manifest_tons never enter tons_placed."
    constants:
      TARGET_DENSITY: 0.85
      DENSITY_FLOOR: 0.55
      COVER_FACTOR_SOIL_6IN: 0.92
      COVER_FACTOR_ALTERNATIVE_TARP: 1.00
      COVER_FACTOR_ADC_FOAM: 0.97
      COVER_FACTOR_AUTO_SHRED_FINES: 0.88
      FACE_PENALTY_LARGE_THRESHOLD_SF: 15000
      FACE_PENALTY_MEDIUM_THRESHOLD_SF: 8000
    precision: "effective_density_tons_per_cy 4 decimal places round_half_up; tons_placed and airspace_consumed_cy 2 decimal places round_half_up. The division in STEP 2 uses the ALREADY-ROUNDED 4-decimal density, never the raw product."
    variants: []

  - name: survey_density_measurement
    trigger: "POST /aerial-surveys (on create, before the new survey is marked RECORDED)"
    algorithm: aggregation
    formula: |
      # STEP 1 — airspace consumed over the coverage period
      prior = the AerialSurvey of this landfill with status == RECORDED
              immediately before this create (there is at most one)
      if prior exists:
          airspace_consumed_in_period_cy = round(
              prior.measured_remaining_airspace_cy - new.measured_remaining_airspace_cy, 2)
      else:
          airspace_consumed_in_period_cy = round(
              landfill.certified_airspace_cy - new.measured_remaining_airspace_cy, 2)

      # STEP 2 — measured in-place density
      if airspace_consumed_in_period_cy <= 0:
          measured_density_tons_per_cy = 0.0000
      else:
          measured_density_tons_per_cy = round(
              new.tons_placed_in_period / airspace_consumed_in_period_cy, 4)
    input_set: "Exactly one prior survey participates: the single AerialSurvey of the same landfill whose status == RECORDED at the moment of the create. SUPERSEDED and VOID surveys never participate."
    constants: {}
    precision: "airspace_consumed_in_period_cy 2 decimal places round_half_up; measured_density_tons_per_cy 4 decimal places round_half_up."
    variants: []

  - name: remaining_life_projection
    trigger: "GET /landfills/{landfill_id}/remaining-life-projection; also written to Landfill.remaining_life_years by OperatingDay close/amend, AerialSurvey create/void, and Cell QA_REVIEW -> QA_CERTIFIED cascade link 2"
    algorithm: forward_looking
    formula: |
      recorded = the AerialSurvey of this landfill with status == RECORDED
                 (at most one exists by construction)

      if recorded exists AND recorded.measured_density_tons_per_cy > 0:
          variant                = "survey_based"
          remaining_airspace_cy  = recorded.measured_remaining_airspace_cy
          density_tons_per_cy    = recorded.measured_density_tons_per_cy
          source_survey_id       = recorded.id
      else:
          variant                = "ledger_based"
          remaining_airspace_cy  = round(landfill.certified_airspace_cy
                                       - landfill.consumed_airspace_cy, 2)
          density_tons_per_cy    = landfill.planned_density_tons_per_cy
          source_survey_id       = null

      remaining_life_years = round(max(0.0, remaining_airspace_cy)
                                   * density_tons_per_cy
                                   / landfill.annual_tonnage_forecast, 2)
    input_set: "The survey_based branch reads only the single RECORDED AerialSurvey. The ledger_based branch reads only Landfill.certified_airspace_cy (Cells in {QA_CERTIFIED, READY_FOR_WASTE, ACTIVE, FULL, CLOSED}) and Landfill.consumed_airspace_cy (all Cells)."
    constants:
      SITE_LIFE_RESTRICT_YEARS: 2.0
    precision: "remaining_life_years 2 decimal places round_half_up; remaining_airspace_cy 2 decimal places round_half_up."
    variants:
      - name: survey_based
        when: "A RECORDED AerialSurvey with measured_density_tons_per_cy > 0 exists for the landfill."
        difference: "Uses the surveyed remaining airspace against the FIELD-MEASURED in-place density, so compaction that beat or missed the design target changes the answer. The measured density is derived from tonnage over surveyed volume loss, not from Landfill.planned_density_tons_per_cy."
      - name: ledger_based
        when: "The landfill has zero RECORDED AerialSurveys, or the single RECORDED survey measured a density of 0."
        difference: "Uses the book airspace ledger (certified minus consumed) against Landfill.planned_density_tons_per_cy, so it reports design intent rather than field reality. For identical field data the two variants disagree, and the site-restriction threshold of 2.0 years can be crossed by one and not the other."

  - name: qa_conformance_score
    trigger: "POST /liner-qa-packages (create) and POST /liner-qa-packages/{liner_qa_package_id}/resubmit"
    algorithm: weighted_scoring
    formula: |
      test_pass_rate  = pkg.passing_test_count / pkg.destructive_test_count
      required_tests  = ceil(pkg.seam_length_ft / SEAM_FT_PER_DESTRUCTIVE_TEST)
      coverage_factor = min(1.0, pkg.destructive_test_count / required_tests)
      defect_density  = pkg.defect_count / pkg.panel_count
      if defect_density <= DEFECT_DENSITY_FREE_ALLOWANCE:
          defect_penalty = 0.00
      else:
          defect_penalty = min(DEFECT_PENALTY_CAP,
                               round(100 * (defect_density
                                            - DEFECT_DENSITY_FREE_ALLOWANCE)
                                     * DEFECT_PENALTY_SLOPE, 2))
      qa_conformance_score = round(
          max(0.0, min(100.0, 100 * test_pass_rate * coverage_factor
                              - defect_penalty)), 2)
    input_set: "Only the five input counters of this LinerQaPackage row; no sibling package participates."
    constants:
      SEAM_FT_PER_DESTRUCTIVE_TEST: 500
      DEFECT_DENSITY_FREE_ALLOWANCE: 0.05
      DEFECT_PENALTY_SLOPE: 4
      DEFECT_PENALTY_CAP: 30.0
      QA_APPROVAL_MIN_SCORE: 85.0
    precision: "defect_penalty and qa_conformance_score 2 decimal places round_half_up; the penalty is rounded BEFORE it is subtracted, then the difference is clamped and rounded again."
    variants: []

  - name: load_tipping_charge
    trigger: "variant gate_rate on WasteLoad UNBILLED -> PROVISIONAL (POST /waste-loads/{waste_load_id}/clear-screening); variant certified_scale on WasteLoad PROVISIONAL -> FINALIZED (POST /operating-days/{operating_day_id}/close)"
    algorithm: tiered_pricing
    formula: |
      hca = the HostCommunityAgreement of this landfill whose status
            IN {EXECUTED, UNDER_AMENDMENT} (exactly one exists by construction)

      # variant gate_rate  -- provisional, at the scale house
      billable_tons      = load.manifest_tons
      gross              = round(billable_tons * hca.posted_tipping_fee_per_ton, 2)
      host_fee           = round(billable_tons * hca.host_fee_per_ton, 2)
      gate_charge_amount = round(gross + host_fee, 2)      # NO royalty component

      # variant certified_scale  -- final, at day close
      billable_tons       = load.certified_net_tons
      gross               = round(billable_tons * hca.posted_tipping_fee_per_ton, 2)
      host_fee            = round(billable_tons * hca.host_fee_per_ton, 2)
      host_royalty_amount = host_community_royalty_waterfall(load)
      final_charge_amount = round(gross + host_fee + host_royalty_amount, 2)
    input_set: "gate_rate reads only the load's own manifest_tons. certified_scale reads the load's certified_net_tons plus the month-to-date certified tonnage of every FINALIZED sibling load of the same landfill, which the royalty waterfall needs."
    constants: {}
    precision: "All money 2 decimal places round_half_up. gross and host_fee are each rounded to cents BEFORE the sum; the sum is rounded again."
    variants:
      - name: gate_rate
        when: "Screening clears while the OperatingDay is still OPEN."
        difference: "Prices the MANIFEST tonnage and applies no host-community royalty at all, because the monthly tier position is not yet knowable. Written to gate_charge_amount and never overwritten."
      - name: certified_scale
        when: "The OperatingDay is closed and the load carries a certified scale weight."
        difference: "Prices the CERTIFIED NET tonnage and adds the tiered host-community royalty. For any load whose certified weight differs from its manifest weight, or whose tons cross the monthly tier-1 ceiling, final_charge_amount differs from gate_charge_amount. Written to final_charge_amount; gate_charge_amount is left in place so the divergence is observable on the same row."

  - name: host_community_royalty_waterfall
    trigger: "WasteLoad PROVISIONAL -> FINALIZED during POST /operating-days/{operating_day_id}/close"
    algorithm: waterfall_allocation
    formula: |
      # Loads are finalized in a pinned chronological order across the landfill:
      #   ORDER BY OperatingDay.operating_date ASC, WasteLoad.created_at ASC
      # cumulative_tons_before = sum of certified_net_tons over loads of the SAME
      # landfill and the SAME calendar month (by OperatingDay.operating_date) that
      # already have billing_status == FINALIZED and precede this load in that order.
      tier1_remaining = max(0.0, hca.tier1_monthly_tons - cumulative_tons_before)
      tier1_tons      = min(load.certified_net_tons, tier1_remaining)
      tier2_tons      = load.certified_net_tons - tier1_tons

      # PINNED ROUNDING ORDER: round EACH tier component to cents, THEN add.
      # Summing the un-rounded components and rounding once at the end is a
      # DIFFERENT and forbidden result.
      comp1 = round(tier1_tons * hca.posted_tipping_fee_per_ton
                    * hca.royalty_tier1_pct, 2)
      comp2 = round(tier2_tons * hca.posted_tipping_fee_per_ton
                    * hca.royalty_tier2_pct, 2)
      host_royalty_amount = round(comp1 + comp2, 2)
    input_set: "Only FINALIZED loads of the same landfill whose OperatingDay.operating_date falls in the same calendar month contribute to cumulative_tons_before. Loads with screening_status != CLEARED, billing_status IN {UNBILLED, PROVISIONAL, VOID}, or a different month never contribute."
    constants: {}
    precision: "2 decimal places round_half_up per tier component, then 2 decimal places round_half_up on the sum. Tie-break for the chronological order is WasteLoad.created_at ASC; Landfill.minimum_annual_payment is reported only and never nets against a load."
    variants: []

  - name: leachate_disposal_invoice
    trigger: "POST /leachate-shipments (create) writes treatment_fee and surcharge_pct; LeachateShipment DISPATCHED -> ACCEPTED (POST /leachate-shipments/{leachate_shipment_id}/confirm-acceptance) writes invoice_total"
    algorithm: tiered_pricing
    formula: |
      # STEP 1 — volumetric treatment fee, priced per thousand gallons
      treatment_fee = round(shipment.gallons / 1000.0
                            * agreement.treatment_rate_per_kgal, 2)

      # STEP 2 — fixed haul component
      haul_fee = round(agreement.base_haul_fee, 2)

      # STEP 3 — pre-surcharge subtotal (THE TIER KEY, an intermediate that is
      #          NOT stored on the row) and the surcharge percentage read off it,
      #          never off the final invoice_total
      pre_surcharge_total = round(treatment_fee + haul_fee, 2)
      if   pre_surcharge_total <  SURCHARGE_TIER1_CEILING: surcharge_pct = 0.00
      elif pre_surcharge_total <  SURCHARGE_TIER2_CEILING: surcharge_pct = 0.06
      else:                                               surcharge_pct = 0.10
      # STEP 4 — surcharge amount (intermediate, not stored)
      surcharge_amount = round(pre_surcharge_total * surcharge_pct, 2)

      # STEP 5 — invoice total, written at confirm-acceptance
      invoice_total = round(pre_surcharge_total + surcharge_amount, 2)
      # Stored fields: treatment_fee (step 1), surcharge_pct (step 3),
      # invoice_total (step 5). haul_fee, pre_surcharge_total and
      # surcharge_amount are derivable intermediates and are not persisted.
    input_set: "Only this shipment's own gallons field and its TreatmentAgreement's base_haul_fee and treatment_rate_per_kgal. Sibling shipments never affect the invoice; they affect only the daily-cap and slot-capacity validations."
    constants:
      SURCHARGE_TIER1_CEILING: 500.00
      SURCHARGE_TIER2_CEILING: 1200.00
      SURCHARGE_TIER2_PCT: 0.06
      SURCHARGE_TIER3_PCT: 0.10
    precision: "All money 2 decimal places round_half_up. STEP 4 reads pre_surcharge_total, which is the STEP 3 output. Feeding invoice_total back into the tier lookup (self-referential evaluation) is a DIFFERENT and forbidden result: at pre_surcharge_total 1180.00 the correct answer is 1250.80, whereas a total-keyed lookup would land in the 0.10 tier and produce 1298.00."
    variants: []

  - name: closure_and_post_closure_cost
    trigger: "POST /closure-cost-estimates (create), POST /closure-cost-estimates/{closure_cost_estimate_id}/certify, and POST /closure-cost-estimates/{closure_cost_estimate_id}/fund-assurance (step 4 only)"
    algorithm: aggregation
    formula: |
      # STEP 1 — closure cost, per cell, PINNED round-each-then-sum
      cells = [ C for C in Cell if C.landfill_id == landfill.id
                               and C.status IN {QA_CERTIFIED, READY_FOR_WASTE,
                                                ACTIVE, FULL} ]
      closure_cost = round(sum( round(C.design_area_sf
                                     * est.closure_unit_cost_per_sf, 2)
                                for C in cells ), 2)
      # Multiplying the SUMMED area by the unit cost once is a DIFFERENT and
      # forbidden result: for areas 120001 and 45001 sf at 1.855 the correct
      # closure_cost is 306078.72, while sum-then-multiply gives 306078.71.

      # STEP 2 — post-closure care, inflated per year, PINNED round-each-then-sum
      post_closure_cost = round(sum(
          round(est.post_closure_annual_cost
                * (1 + est.inflation_pct) ** (k - 1), 2)
          for k in 1..est.post_closure_years ), 2)
      # Summing the un-rounded inflated terms and rounding once at the end is a
      # DIFFERENT and forbidden result: 95000.00 at 0.03 over 30 years gives
      # 4519664.50 round-each-then-sum versus 4519664.49 sum-then-round.

      # STEP 3 — required financial assurance
      required_assurance_amount = round(closure_cost + post_closure_cost, 2)

      # STEP 4 — funding shortfall and the landfill's assurance posture
      funding_shortfall = round(max(0.0, required_assurance_amount
                                        - landfill.assurance_funded_amount), 2)
      # Written on certify and recomputed on every fund-assurance call.
      if est.status == CERTIFIED and est is the newest CERTIFIED estimate:
          landfill.financial_assurance_status = (FUNDED
              if funding_shortfall == 0.00 else SHORTFALL_REVIEW)
    input_set: "Only Cells of this landfill in {QA_CERTIFIED, READY_FOR_WASTE, ACTIVE, FULL}. Cells in DESIGN, UNDER_CONSTRUCTION, QA_REVIEW, REJECTED and CLOSED contribute zero closure area, so a landfill with no such cells still owes the full post-closure care total of 4519664.50 (at the pinned 95000.00 / 0.03 / 30-year parameters)."
    constants:
      DEFAULT_POST_CLOSURE_YEARS: 30
    precision: "Every per-cell term and every per-year term is rounded to 2 decimal places round_half_up BEFORE summation; each subtotal is rounded again. Exponentiation uses the un-rounded (1 + inflation_pct) base."
    variants: []

  - name: surface_exceedance_corrective_well
    trigger: "SurfaceEmissionScan PASSED -> EXCEEDANCE_OPEN, evaluated inline on POST /surface-emission-scans when max_reading_ppm >= SEM_EXCEEDANCE_PPM"
    algorithm: chronological
    formula: |
      # Deterministic single-winner selection. No random choice, no id ordering.
      candidates = [ W for W in GasWell
                     if W.cell_id IN (Cell ids of scan.landfill_id)
                     and W.status == ONLINE ]
      rank by last_tuned_at ASC          # never-tuned wells sort as
                                        # last_tuned_at = created_at
      tie-break by created_at ASC
      if candidates is empty:
          corrective_well_id = null      # no well is mutated
      else:
          corrective_well_id = candidates[0].id
          candidates[0].status = TUNING_REQUIRED
      # Landfill.gas_collection_status becomes CORRECTIVE_ACTION either way.
    input_set: "Only GasWells whose Cell belongs to the scan's landfill and whose status == ONLINE. Wells in DRILLED, CONNECTED, TUNING_REQUIRED, OFFLINE and DECOMMISSIONED are never selected."
    constants:
      SEM_EXCEEDANCE_PPM: 500.0
    precision: "No arithmetic. Selection is total and deterministic; the empty-pool case is a defined outcome and not an error."
    variants: []

  - name: leachate_slot_occupancy
    trigger: "POST /leachate-shipments (create) — feeds validation priority 19 and priority 26"
    algorithm: interval_merge
    formula: |
      # Half-open windows: [window_start, window_end). Two shipments overlap iff
      #   new.window_start < other.window_end AND other.window_start < new.window_end
      # Touching windows (new.window_start == other.window_end) do NOT overlap.
      active = [ S for S in LeachateShipment
                 if S.treatment_agreement_id == new.treatment_agreement_id
                 and S.status IN {SCHEDULED, DISPATCHED, ACCEPTED} ]
      overlapping = [ S for S in active if S overlaps new ]
      if len(overlapping) + 1 > agreement.concurrent_slot_capacity:
          -> ERR_SLOT_CAPACITY_EXCEEDED (priority 19)

      # Daily gallon cap, keyed on the calendar date of window_start
      same_day = [ S for S in active
                   if date(S.window_start) == date(new.window_start) ]
      scheduled_gallons_today = sum(S.gallons for S in same_day)
      if scheduled_gallons_today + new.gallons
             > agreement.daily_gallon_cap:
          -> ERR_DAILY_GALLON_CAP_EXCEEDED (priority 26)
      # Exact equality with daily_gallon_cap is ALLOWED.
    input_set: "Only shipments of the SAME TreatmentAgreement in {SCHEDULED, DISPATCHED, ACCEPTED}. CANCELLED and REJECTED_AT_GATE shipments release both their slot and their gallons."
    constants:
      DEFAULT_CONCURRENT_SLOT_CAPACITY: 2
    precision: "Timestamp comparison at whole-second resolution on ISO-8601 UTC strings. The interval is HALF-OPEN, so the capacity test is an aggregate count across the window, not a pairwise check."
    variants: []

  - name: survey_coverage_overlap
    trigger: "POST /aerial-surveys — feeds validation priority 17 and priority 18"
    algorithm: interval_merge
    formula: |
      # CLOSED coverage intervals: [coverage_period_start, coverage_period_end]. Two surveys
      # overlap iff
      #   new.coverage_period_start <= other.coverage_period_end
      #   AND other.coverage_period_start <= new.coverage_period_end
      # Touching endpoints (new.coverage_period_start == other.coverage_period_end) DO overlap,
      # the opposite of the leachate half-open rule.
      live = [ S for S in AerialSurvey
               if S.landfill_id == new.landfill_id
               and S.status IN {RECORDED, SUPERSEDED} ]
      if any S in live overlaps new:
          -> ERR_SURVEY_PERIOD_OVERLAP (priority 17)

      # Minimum flight spacing, evaluated only against the flown_on dates
      for S in live:
          if abs(days_between(new.flown_on, S.flown_on))
                 < SURVEY_MIN_SPACING_DAYS:
              -> ERR_SURVEY_SPACING_VIOLATION (priority 18)
      # Exactly SURVEY_MIN_SPACING_DAYS apart is ALLOWED.
    input_set: "Only surveys of the same landfill with status IN {RECORDED, SUPERSEDED}. VOID surveys free both their coverage interval and their spacing buffer."
    constants:
      SURVEY_MIN_SPACING_DAYS: 90
    precision: "Whole-day arithmetic on the date component of flown_on; whole-second comparison on coverage endpoints. Overlap is checked before spacing, so a survey that violates both returns ERR_SURVEY_PERIOD_OVERLAP."
    variants: []

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
#
# The ladder is: auth -> authorization -> shape -> existence -> tenancy ->
# referential -> concurrency -> own-state -> cross-entity gating states ->
# REGULATORY SAFETY -> segregation of duties -> engineering QA -> temporal
# constraint -> uniqueness -> operational quota -> FISCAL/ASSURANCE last.
# Safety and compliance beat money in a permitted landfill: a prohibited-waste
# load is refused even when refusing it costs the site revenue, and an airspace
# overrun is refused even when the load is fully paid for.
# =============================================================================
validations:

  - priority: 1
    category: auth
    check: "Both X-User-Role and X-User-ID request headers are present and X-User-Role is one of the eight roles declared in §1.7."
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"

  - priority: 2
    category: auth
    check: "The X-User-Role value appears in the called endpoint's roles list in §1.5."
    error_id: ERR_ROLE_NOT_PERMITTED
    http_status: 403
    applies_to: "all"

  - priority: 3
    category: existence
    check: "Request body shape: every required input field is present and non-null, every field has the declared JSON type, every enum field carries a declared member, every ISO-8601 timestamp parses, every quantity that must be positive is > 0 (tons, gallons, areas, counts, unit costs), coverage_period_start <= coverage_period_end, window_start < window_end, effective_from < expires_on, construction_start_date <= construction_end_date, and passing_test_count <= destructive_test_count."
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all write endpoints"

  - priority: 4
    category: existence
    check: "Every id in the request PATH resolves to a stored row, validated left-to-right; each miss returns that entity's own not-found error (ERR_LANDFILL_NOT_FOUND, ERR_CELL_NOT_FOUND, ERR_LINER_QA_PACKAGE_NOT_FOUND, ERR_AERIAL_SURVEY_NOT_FOUND, ERR_OPERATING_DAY_NOT_FOUND, ERR_WASTE_LOAD_NOT_FOUND, ERR_SPECIAL_WASTE_APPROVAL_NOT_FOUND, ERR_TREATMENT_AGREEMENT_NOT_FOUND, ERR_LEACHATE_SHIPMENT_NOT_FOUND, ERR_GAS_WELL_NOT_FOUND, ERR_SURFACE_EMISSION_SCAN_NOT_FOUND, ERR_CLOSURE_COST_ESTIMATE_NOT_FOUND, ERR_HOST_COMMUNITY_AGREEMENT_NOT_FOUND)."
    error_id: ERR_LANDFILL_NOT_FOUND
    http_status: 404
    applies_to: "all endpoints with path ids"

  - priority: 5
    category: existence
    check: "Every foreign-key id in the request BODY resolves to a stored row, validated in the field order declared by the endpoint's input list; each miss returns that entity's own not-found error."
    error_id: ERR_CELL_NOT_FOUND
    http_status: 404
    applies_to: "all write endpoints carrying FK fields in the body"

  - priority: 6
    category: auth
    check: "Site scope for entity-backed roles: when X-User-Role is SiteOperator or ScaleOperator, X-User-ID must equal the id of the Landfill that owns the addressed resource (directly via landfill_id, or transitively via Cell.landfill_id / OperatingDay.landfill_id / TreatmentAgreement.landfill_id)."
    error_id: ERR_SITE_SCOPE_VIOLATION
    http_status: 403
    applies_to: "all write endpoints available to SiteOperator or ScaleOperator (read endpoints are not site-scoped)"

  - priority: 7
    category: business_referential
    check: "Same-landfill referential consistency: every entity named in one request must belong to the same Landfill. Cell.landfill_id must equal OperatingDay.landfill_id on POST /waste-loads; SpecialWasteApproval.landfill_id must match; piggyback_over_cell_id must name a Cell of the same landfill; GasWell.cell_id must name a Cell of the scan's landfill; LeachateShipment.treatment_agreement_id must name an agreement of the same landfill."
    error_id: ERR_CROSS_SITE_REFERENCE
    http_status: 409
    applies_to: "POST /waste-loads, POST /cells, POST /liner-qa-packages, POST /gas-wells, POST /leachate-shipments, POST /surface-emission-scans, POST /gas-wells/{gas_well_id}/connect"

  - priority: 8
    category: state
    check: "Optimistic concurrency: expected_landfill_version must equal the current Landfill.version (§1.2.1)."
    error_id: ERR_STALE_LANDFILL_VERSION
    http_status: 412
    applies_to: "POST /closure-cost-estimates, POST /host-community-agreements/{host_community_agreement_id}/execute"

  - priority: 9
    category: state
    check: "The addressed entity is in one of the from states declared for this trigger in §1.2; otherwise the transition is refused. ONE CARVE-OUT: POST /host-community-agreements/{host_community_agreement_id}/open-amendment addressed to an agreement whose status is already UNDER_AMENDMENT skips this rung and is reported by the more specific priority-28 check as ERR_AMENDMENT_IN_PROGRESS."
    error_id: ERR_INVALID_STATE_TRANSITION
    http_status: 409
    applies_to: "all action endpoints that drive a §1.2 transition"

  - priority: 10
    category: state
    check: "Cross-entity gating states, checked in this fixed order: (a) the owning Landfill.operating_status must be in {OPEN, RESTRICTED_AIRSPACE} to accept a waste load -> ERR_SITE_NOT_ACCEPTING_WASTE; (b) the target Cell.status must be ACTIVE to accept a waste load, and must be in {ACTIVE, FULL, CLOSED} to connect a gas well -> ERR_CELL_NOT_ACCEPTING_WASTE / ERR_CELL_NOT_READY_FOR_WELLFIELD; (c) the TreatmentAgreement.status must be ACTIVE to schedule or dispatch a leachate shipment -> ERR_AGREEMENT_NOT_ACTIVE."
    error_id: ERR_SITE_NOT_ACCEPTING_WASTE
    http_status: 409
    applies_to: "POST /waste-loads, POST /gas-wells/{gas_well_id}/connect, POST /leachate-shipments, POST /leachate-shipments/{leachate_shipment_id}/dispatch"

  - priority: 11
    category: business_safety
    check: "Prohibited-material load check (regulatory, outranks every fiscal check): a WasteLoad whose load_check_result is PROHIBITED_FOUND or UNMANIFESTED may never be cleared for placement, and neither may a load whose waste_stream is INDUSTRIAL_SPECIAL or ASBESTOS_SPECIAL without a linked SpecialWasteApproval whose profile_stream equals that waste_stream."
    error_id: ERR_PROHIBITED_MATERIAL
    http_status: 422
    applies_to: "POST /waste-loads/{waste_load_id}/clear-screening"

  - priority: 12
    category: business_safety
    check: "Segregation of duties: the X-User-ID stored in LinerQaPackage.submitted_by_user_id may not be the X-User-ID that begins review, approves or returns that package, and the X-User-ID that created a ClosureCostEstimate may not be the X-User-ID that certifies it."
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /liner-qa-packages/{liner_qa_package_id}/begin-review, POST /liner-qa-packages/{liner_qa_package_id}/approve, POST /liner-qa-packages/{liner_qa_package_id}/return, POST /closure-cost-estimates/{closure_cost_estimate_id}/certify"

  - priority: 13
    category: business_safety
    check: "Liner QA conformance gate: a LinerQaPackage may be approved only when its computed qa_conformance_score is >= QA_APPROVAL_MIN_SCORE (85.0). Exactly 85.0 passes."
    error_id: ERR_QA_SCORE_BELOW_THRESHOLD
    http_status: 422
    applies_to: "POST /liner-qa-packages/{liner_qa_package_id}/approve"

  - priority: 14
    category: business_safety
    check: "Landfill-gas corrective action: while the Landfill.gas_collection_status is CORRECTIVE_ACTION (an open surface-emission exceedance exists), no Cell of that landfill may be authorized for waste placement and no new Cell may be activated."
    error_id: ERR_GAS_CORRECTIVE_ACTION_OPEN
    http_status: 409
    applies_to: "POST /cells/{cell_id}/authorize-waste-placement, POST /cells/{cell_id}/activate"

  - priority: 15
    category: business_safety
    check: "Wellfield tuning safety: a GasWell reading with oxygen_pct >= WELL_OXYGEN_CRITICAL_PCT (12.0) indicates a subsurface-fire risk and may not be recorded as a return-to-online tune; the well must be taken offline instead."
    error_id: ERR_WELL_OXYGEN_CRITICAL
    http_status: 422
    applies_to: "POST /gas-wells/{gas_well_id}/tune"

  - priority: 16
    category: business_safety
    check: "Special-waste approval validity: a linked SpecialWasteApproval must have status APPROVED, effective_from at or before the current logical clock, and expires_on strictly after it. An approval in REQUESTED, DENIED, REVOKED, SUSPENDED or EXHAUSTED, or one whose window has passed, is refused."
    error_id: ERR_APPROVAL_EXPIRED
    http_status: 422
    applies_to: "POST /waste-loads/{waste_load_id}/clear-screening"

  - priority: 17
    category: business_temporal
    check: "Aerial-survey coverage periods of one landfill may not overlap. Intervals are CLOSED: [coverage_period_start, coverage_period_end]; touching endpoints count as an overlap. Only surveys with status IN {RECORDED, SUPERSEDED} occupy an interval."
    error_id: ERR_SURVEY_PERIOD_OVERLAP
    http_status: 409
    applies_to: "POST /aerial-surveys"

  - priority: 18
    category: business_temporal
    check: "Consecutive aerial surveys of one landfill must be flown at least SURVEY_MIN_SPACING_DAYS (90) apart, measured in whole days between flown_on dates against surveys with status IN {RECORDED, SUPERSEDED}. Exactly 90 days apart is allowed."
    error_id: ERR_SURVEY_SPACING_VIOLATION
    http_status: 409
    applies_to: "POST /aerial-surveys"

  - priority: 19
    category: business_temporal
    check: "Leachate hauling slots: the number of shipments of one TreatmentAgreement whose HALF-OPEN window [window_start, window_end) overlaps the requested window, counting the new shipment, may not exceed concurrent_slot_capacity. Only shipments in {SCHEDULED, DISPATCHED, ACCEPTED} occupy a slot; a window that merely touches another (start == other end) does not overlap."
    error_id: ERR_SLOT_CAPACITY_EXCEEDED
    http_status: 409
    applies_to: "POST /leachate-shipments"

  - priority: 20
    category: business_constraint
    check: "Uniqueness within a scope: Landfill.permit_number unique globally -> ERR_DUPLICATE_PERMIT_NUMBER; Cell.cell_code unique per landfill -> ERR_DUPLICATE_CELL_CODE; OperatingDay.operating_date unique per landfill -> ERR_DUPLICATE_OPERATING_DATE; GasWell.well_code unique per landfill (across all cells of that landfill) -> ERR_DUPLICATE_WELL_CODE; ClosureCostEstimate.estimate_year unique per landfill -> ERR_DUPLICATE_ESTIMATE_YEAR. Rows in REJECTED / ABANDONED / TERMINATED states still hold their code."
    error_id: ERR_DUPLICATE_CELL_CODE
    http_status: 409
    applies_to: "POST /landfills, POST /cells, POST /operating-days, POST /gas-wells, POST /closure-cost-estimates"

  - priority: 21
    category: business_constraint
    check: "Piggyback sequencing: when piggyback_over_cell_id is supplied, the referenced Cell must have status CLOSED, because a new cell may only be built over a cell whose final cover is complete."
    error_id: ERR_PIGGYBACK_PARENT_NOT_CLOSED
    http_status: 409
    applies_to: "POST /cells"

  - priority: 22
    category: business_constraint
    check: "Daily load limit: the count of WasteLoads already attached to an OperatingDay whose screening_status is not REJECTED, plus one, may not exceed Landfill.daily_load_limit. Exact equality with the limit is allowed."
    error_id: ERR_DAILY_LOAD_LIMIT_EXCEEDED
    http_status: 409
    applies_to: "POST /waste-loads"

  - priority: 23
    category: business_fiscal
    check: "Permitted-airspace ceiling: closing an OperatingDay may not drive Landfill.consumed_airspace_cy above permitted_total_airspace_cy. The projected consumption is the day's computed airspace_consumed_cy; exact equality with the permit is allowed."
    error_id: ERR_PERMITTED_AIRSPACE_EXCEEDED
    http_status: 422
    applies_to: "POST /operating-days/{operating_day_id}/close"

  - priority: 24
    category: business_fiscal
    check: "Host-community agreement required for billing: an OperatingDay may not be closed unless its Landfill has exactly one HostCommunityAgreement with status IN {EXECUTED, UNDER_AMENDMENT}, and a WasteLoad may not clear screening without one, because the gate rate and host fee come from that agreement."
    error_id: ERR_NO_EXECUTED_HOST_AGREEMENT
    http_status: 409
    applies_to: "POST /waste-loads/{waste_load_id}/clear-screening, POST /operating-days/{operating_day_id}/close"

  - priority: 25
    category: business_fiscal
    check: "Special-waste tonnage cap: clearing a load linked to a SpecialWasteApproval may not drive that approval's consumed_tons above approved_tons_cap. Exact equality with the cap is allowed and moves the approval to EXHAUSTED."
    error_id: ERR_APPROVAL_TONNAGE_CAP_EXCEEDED
    http_status: 422
    applies_to: "POST /waste-loads/{waste_load_id}/clear-screening"

  - priority: 26
    category: business_fiscal
    check: "Leachate daily gallon cap: scheduled_gallons_today for the TreatmentAgreement, on the calendar date of window_start, plus the requested gallons, may not exceed daily_gallon_cap. Exact equality with the cap is allowed."
    error_id: ERR_DAILY_GALLON_CAP_EXCEEDED
    http_status: 422
    applies_to: "POST /leachate-shipments"

  - priority: 27
    category: business_fiscal
    check: "Financial assurance for closure and post-closure care: a Cell may not be authorized for waste placement unless its Landfill.financial_assurance_status is FUNDED. A landfill in UNFUNDED or SHORTFALL_REVIEW must first record a sufficient assurance instrument."
    error_id: ERR_FINANCIAL_ASSURANCE_SHORTFALL
    http_status: 402
    applies_to: "POST /cells/{cell_id}/authorize-waste-placement"

  - priority: 28
    category: business_constraint
    check: "Closing-out integrity, evaluated after all higher checks: an OperatingDay with any WasteLoad still in screening_status PENDING or FLAGGED cannot be closed -> ERR_PENDING_SCREENING_PRESENT; a day with any CLEARED load lacking certified_net_tons cannot be closed -> ERR_UNCERTIFIED_LOADS_PRESENT; a Cell with any GasWell in {DRILLED, CONNECTED, TUNING_REQUIRED} cannot be closed -> ERR_CELL_HAS_UNFINISHED_WELLS; a HostCommunityAgreement already in UNDER_AMENDMENT cannot open another amendment -> ERR_AMENDMENT_IN_PROGRESS; a DRAFT agreement cannot be executed while another agreement of the same landfill is UNDER_AMENDMENT -> ERR_HOST_AGREEMENT_ALREADY_LIVE (an agreement that is merely EXECUTED is superseded and terminated by the execution instead of blocking it)."
    error_id: ERR_PENDING_SCREENING_PRESENT
    http_status: 409
    applies_to: "POST /operating-days/{operating_day_id}/close, POST /cells/{cell_id}/close, POST /host-community-agreements/{host_community_agreement_id}/open-amendment, POST /host-community-agreements/{host_community_agreement_id}/execute"

# =============================================================================
# §1.5 API Endpoint Table
# All paths are flat (api_prefix "/"); every FK has a filtered-list reverse
# GET, and the four heaviest parents additionally expose a sub-resource GET.
# Read endpoints are open to all eight roles; every mutation is role-gated.
# =============================================================================
endpoints:

  # --- test-driving: logical clock -------------------------------------------
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Sets the server's logical UTC clock, used by expiry, window and calendar-date rules. Before any call to this endpoint the logical clock reads exactly the fixed startup default 2026-08-01T00:00:00Z and MUST NOT fall back to real wall-clock time."
    roles: [PlatformAdmin]
    code: 200
    input: [current_utc]
    output: { current_utc: datetime }
    side_effects: ["Sets the logical clock", "Lazily re-evaluates TreatmentAgreement expiry and SpecialWasteApproval expiry on the next read or write that touches them"]

  # --- Landfill --------------------------------------------------------------
  - method: POST
    path: "/landfills"
    description: "Registers a permitted municipal solid waste landfill."
    roles: [PlatformAdmin]
    code: 201
    input: [name, permit_number, permitted_total_airspace_cy, design_footprint_sf, planned_density_tons_per_cy, annual_tonnage_forecast, "daily_load_limit?"]
    output: Landfill
    side_effects: ["operating_status OPEN", "gas_collection_status COMPLIANT", "financial_assurance_status UNFUNDED", "assurance_funded_amount 0", "all computed airspace ledgers 0", "version 1"]

  - method: GET
    path: "/landfills/{landfill_id}"
    description: "Reads one landfill including its airspace ledger and the three posture fields."
    roles: [PlatformAdmin, SiteOperator, ScaleOperator, CqaEngineer, SurveyorOfRecord, EnvironmentalManager, RegulatoryAgency, FinanceOfficer]
    code: 200
    input: []
    output: Landfill
    side_effects: []

  - method: GET
    path: "/landfills"
    description: "Lists landfills, filterable by permit number and operating posture."
    roles: [PlatformAdmin, SiteOperator, ScaleOperator, CqaEngineer, SurveyorOfRecord, EnvironmentalManager, RegulatoryAgency, FinanceOfficer]
    code: 200
    input: ["permit_number?", "operating_status?", "financial_assurance_status?", "limit?", "offset?"]
    output: Landfill[]
    side_effects: []

  - method: POST
    path: "/landfills/{landfill_id}/operating-status"
    description: "Administratively moves a landfill's operating posture: RESTRICTED_AIRSPACE -> OPEN, or OPEN -> CLOSED."
    roles: [PlatformAdmin]
    code: 200
    input: [operating_status]
    output: Landfill
    side_effects: ["Landfill.operating_status set", "increments Landfill.version by 1"]

  - method: GET
    path: "/landfills/{landfill_id}/remaining-life-projection"
    description: "Computed read: the remaining_life_projection calculation, reporting which variant was selected and the inputs it used."
    roles: [PlatformAdmin, SiteOperator, SurveyorOfRecord, EnvironmentalManager, RegulatoryAgency, FinanceOfficer]
    code: 200
    input: []
    output: { landfill_id: string, variant: string, remaining_airspace_cy: number, density_tons_per_cy: number, annual_tonnage_forecast: number, remaining_life_years: number, source_survey_id: string }
    side_effects: []

  - method: GET
    path: "/landfills/{landfill_id}/cells"
    description: "Sub-resource: every cell of this landfill in creation order."
    roles: [PlatformAdmin, SiteOperator, ScaleOperator, CqaEngineer, SurveyorOfRecord, EnvironmentalManager, RegulatoryAgency, FinanceOfficer]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: Cell[]
    side_effects: []

  # --- Cell ------------------------------------------------------------------
  - method: POST
    path: "/cells"
    description: "Creates a landfill cell in DESIGN, optionally piggybacked over an already-CLOSED cell."
    roles: [SiteOperator]
    code: 201
    input: [landfill_id, cell_code, design_airspace_cy, design_area_sf, liner_type, construction_start_date, construction_end_date, "piggyback_over_cell_id?"]
    output: Cell
    side_effects: ["status DESIGN", "consumed_airspace_cy 0", "fill_pct 0", "version 1"]

  - method: GET
    path: "/cells/{cell_id}"
    description: "Reads one cell including its fill ledger and authorization stamp."
    roles: [PlatformAdmin, SiteOperator, ScaleOperator, CqaEngineer, SurveyorOfRecord, EnvironmentalManager, RegulatoryAgency, FinanceOfficer]
    code: 200
    input: []
    output: Cell
    side_effects: []

  - method: GET
    path: "/cells"
    description: "Lists cells filtered by landfill, by the cell they piggyback over, or by development state."
    roles: [PlatformAdmin, SiteOperator, ScaleOperator, CqaEngineer, SurveyorOfRecord, EnvironmentalManager, RegulatoryAgency, FinanceOfficer]
    code: 200
    input: ["landfill_id?", "piggyback_over_cell_id?", "status?", "limit?", "offset?"]
    output: Cell[]
    side_effects: []

  - method: POST
    path: "/cells/{cell_id}/begin-construction"
    description: "Starts liner construction: DESIGN -> UNDER_CONSTRUCTION."
    roles: [SiteOperator]
    code: 200
    input: []
    output: Cell
    side_effects: ["Cell.status UNDER_CONSTRUCTION", "increments Cell.version by 1"]

  - method: POST
    path: "/cells/{cell_id}/authorize-waste-placement"
    description: "Regulatory authorization to place waste in a QA-certified cell: QA_CERTIFIED -> READY_FOR_WASTE. Requires the landfill to be FUNDED for closure and post-closure care and to have no open gas corrective action."
    roles: [RegulatoryAgency]
    code: 200
    input: [approval_reference]
    output: Cell
    side_effects: ["Cell.status READY_FOR_WASTE", "Cell.authorized_by_agency_user_id set to X-User-ID", "increments Cell.version by 1"]

  - method: POST
    path: "/cells/{cell_id}/activate"
    description: "Opens the working face on an authorized cell: READY_FOR_WASTE -> ACTIVE."
    roles: [SiteOperator]
    code: 200
    input: []
    output: Cell
    side_effects: ["Cell.status ACTIVE", "increments Landfill.active_cell_count", "Landfill.operating_status SUSPENDED_NO_AIRSPACE -> OPEN when airspace is available again", "restores SUSPENDED SpecialWasteApprovals of the landfill to APPROVED", "increments Landfill.version by 1", "increments Cell.version by 1"]

  - method: POST
    path: "/cells/{cell_id}/close"
    description: "Places final cover on a full cell: FULL -> CLOSED."
    roles: [SiteOperator]
    code: 200
    input: [final_cover_reference]
    output: Cell
    side_effects: ["Cell.status CLOSED", "final_cover_reference stored", "recomputes Landfill.certified_airspace_cy and remaining_airspace_cy", "increments Landfill.version by 1", "increments Cell.version by 1"]

  - method: GET
    path: "/cells/{cell_id}/liner-qa-packages"
    description: "Sub-resource: every CQA package submitted for this cell's liner, in revision order."
    roles: [PlatformAdmin, SiteOperator, CqaEngineer, RegulatoryAgency, EnvironmentalManager, ScaleOperator, SurveyorOfRecord, FinanceOfficer]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: LinerQaPackage[]
    side_effects: []

  - method: GET
    path: "/cells/{cell_id}/gas-wells"
    description: "Sub-resource: every landfill-gas extraction well drilled into this cell."
    roles: [PlatformAdmin, SiteOperator, EnvironmentalManager, RegulatoryAgency, CqaEngineer, ScaleOperator, SurveyorOfRecord, FinanceOfficer]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: GasWell[]
    side_effects: []

  # --- LinerQaPackage --------------------------------------------------------
  - method: POST
    path: "/liner-qa-packages"
    description: "Submits construction-quality-assurance documentation for a cell's liner; computes qa_conformance_score and drives the cell into QA_REVIEW."
    roles: [SiteOperator]
    code: 201
    input: [cell_id, seam_length_ft, destructive_test_count, passing_test_count, panel_count, defect_count]
    output: LinerQaPackage
    side_effects: ["computes qa_conformance_score", "status SUBMITTED", "revision_round 1", "submitted_by_user_id set to X-User-ID", "cascade: Cell UNDER_CONSTRUCTION -> QA_REVIEW", "increments Cell.version by 1"]

  - method: GET
    path: "/liner-qa-packages/{liner_qa_package_id}"
    description: "Reads one CQA package including its computed conformance score."
    roles: [PlatformAdmin, SiteOperator, ScaleOperator, CqaEngineer, SurveyorOfRecord, EnvironmentalManager, RegulatoryAgency, FinanceOfficer]
    code: 200
    input: []
    output: LinerQaPackage
    side_effects: []

  - method: GET
    path: "/liner-qa-packages"
    description: "Lists CQA packages filtered by cell or review state."
    roles: [PlatformAdmin, SiteOperator, ScaleOperator, CqaEngineer, SurveyorOfRecord, EnvironmentalManager, RegulatoryAgency, FinanceOfficer]
    code: 200
    input: ["cell_id?", "status?", "limit?", "offset?"]
    output: LinerQaPackage[]
    side_effects: []

  - method: POST
    path: "/liner-qa-packages/{liner_qa_package_id}/begin-review"
    description: "A certifying CQA engineer opens review: SUBMITTED -> UNDER_REVIEW. The submitter may not review their own package."
    roles: [CqaEngineer]
    code: 200
    input: []
    output: LinerQaPackage
    side_effects: ["status UNDER_REVIEW", "reviewed_by_user_id set to X-User-ID", "increments LinerQaPackage.version by 1"]

  - method: POST
    path: "/liner-qa-packages/{liner_qa_package_id}/return"
    description: "Returns a package for rework: UNDER_REVIEW -> RETURNED while revision_round < MAX_REVISION_ROUNDS, or UNDER_REVIEW -> REJECTED on the third round, which rejects the cell outright."
    roles: [CqaEngineer]
    code: 200
    input: [return_note]
    output: LinerQaPackage
    side_effects: ["status RETURNED or REJECTED", "cascade: Cell QA_REVIEW -> UNDER_CONSTRUCTION, or QA_REVIEW -> REJECTED on the third round", "increments Cell.version by 1", "increments LinerQaPackage.version by 1"]

  - method: POST
    path: "/liner-qa-packages/{liner_qa_package_id}/resubmit"
    description: "Resubmits a returned package with corrected test counts: RETURNED -> SUBMITTED, incrementing revision_round and recomputing the score."
    roles: [SiteOperator]
    code: 200
    input: [seam_length_ft, destructive_test_count, passing_test_count, panel_count, defect_count]
    output: LinerQaPackage
    side_effects: ["status SUBMITTED", "revision_round + 1", "recomputes qa_conformance_score", "submitted_by_user_id set to X-User-ID", "cascade: Cell UNDER_CONSTRUCTION -> QA_REVIEW", "increments Cell.version by 1", "increments LinerQaPackage.version by 1"]

  - method: POST
    path: "/liner-qa-packages/{liner_qa_package_id}/approve"
    description: "Approves the liner CQA record: UNDER_REVIEW -> APPROVED, allowed only when qa_conformance_score >= 85.0 and only by a user other than the submitter. Drives the depth-4 certification cascade."
    roles: [CqaEngineer]
    code: 200
    input: [certification_reference]
    output: LinerQaPackage
    side_effects: ["status APPROVED", "certification_reference stored", "cascade link 1: Cell QA_REVIEW -> QA_CERTIFIED", "cascade link 2: Landfill.certified_airspace_cy, remaining_airspace_cy and remaining_life_years recomputed", "cascade link 3: the landfill's newest CERTIFIED ClosureCostEstimate -> STALE (no-op when the landfill has no CERTIFIED estimate yet)", "cascade link 4: Landfill.financial_assurance_status -> SHORTFALL_REVIEW, applied only when link 3 staled an estimate", "increments Cell.version by 1", "increments Landfill.version by 1", "increments LinerQaPackage.version by 1"]

  # --- AerialSurvey ----------------------------------------------------------
  - method: POST
    path: "/aerial-surveys"
    description: "Records an aerial topographic survey: computes the airspace consumed over the coverage period and the field-measured in-place density, and supersedes the previously RECORDED survey."
    roles: [SurveyorOfRecord]
    code: 201
    input: [landfill_id, flown_on, coverage_period_start, coverage_period_end, measured_remaining_airspace_cy, tons_placed_in_period]
    output: AerialSurvey
    side_effects: ["computes airspace_consumed_in_period_cy and measured_density_tons_per_cy", "status RECORDED", "cascade: the landfill's previously RECORDED survey -> SUPERSEDED", "recomputes Landfill.remaining_life_years via the survey_based variant", "Landfill.operating_status OPEN -> RESTRICTED_AIRSPACE when remaining_life_years < 2.0", "increments Landfill.version by 1"]

  - method: GET
    path: "/aerial-surveys/{aerial_survey_id}"
    description: "Reads one aerial survey including its computed density."
    roles: [PlatformAdmin, SiteOperator, ScaleOperator, CqaEngineer, SurveyorOfRecord, EnvironmentalManager, RegulatoryAgency, FinanceOfficer]
    code: 200
    input: []
    output: AerialSurvey
    side_effects: []

  - method: GET
    path: "/aerial-surveys"
    description: "Lists aerial surveys filtered by landfill or status; at most one is RECORDED per landfill."
    roles: [PlatformAdmin, SiteOperator, ScaleOperator, CqaEngineer, SurveyorOfRecord, EnvironmentalManager, RegulatoryAgency, FinanceOfficer]
    code: 200
    input: ["landfill_id?", "status?", "limit?", "offset?"]
    output: AerialSurvey[]
    side_effects: []

  - method: POST
    path: "/aerial-surveys/{aerial_survey_id}/void"
    description: "Voids a RECORDED survey found to be flown on bad ground control: RECORDED -> VOID, and restores the most recently SUPERSEDED survey of the same landfill to RECORDED."
    roles: [SurveyorOfRecord]
    code: 200
    input: [void_reason]
    output: AerialSurvey
    side_effects: ["status VOID", "void_reason stored", "cascade: the landfill's most recently superseded survey (by coverage_period_end DESC, then created_at DESC) -> RECORDED", "recomputes Landfill.remaining_life_years, falling back to the ledger_based variant when no RECORDED survey remains", "frees the voided survey's coverage interval and spacing buffer", "increments Landfill.version by 1"]

  # --- OperatingDay ----------------------------------------------------------
  - method: POST
    path: "/operating-days"
    description: "Opens a daily operations log against one ACTIVE cell, fixing the working-face size and the daily cover material for the day."
    roles: [SiteOperator]
    code: 201
    input: [landfill_id, active_cell_id, operating_date, working_face_area_sf, cover_material_type]
    output: OperatingDay
    side_effects: ["status OPEN", "tons_placed, effective_density_tons_per_cy and airspace_consumed_cy all 0", "version 1"]

  - method: GET
    path: "/operating-days/{operating_day_id}"
    description: "Reads one operating day including its computed density and airspace consumption."
    roles: [PlatformAdmin, SiteOperator, ScaleOperator, CqaEngineer, SurveyorOfRecord, EnvironmentalManager, RegulatoryAgency, FinanceOfficer]
    code: 200
    input: []
    output: OperatingDay
    side_effects: []

  - method: GET
    path: "/operating-days"
    description: "Lists operating days filtered by landfill, by working-face cell, or by state."
    roles: [PlatformAdmin, SiteOperator, ScaleOperator, CqaEngineer, SurveyorOfRecord, EnvironmentalManager, RegulatoryAgency, FinanceOfficer]
    code: 200
    input: ["landfill_id?", "active_cell_id?", "status?", "limit?", "offset?"]
    output: OperatingDay[]
    side_effects: []

  - method: POST
    path: "/operating-days/{operating_day_id}/close"
    description: "Closes the day: OPEN -> CLOSED or AMENDED -> CLOSED. Computes effective density and airspace consumption, finalizes billing for every cleared load, and drives the depth-4 airspace cascade."
    roles: [SiteOperator]
    code: 200
    input: []
    output: OperatingDay
    side_effects: ["computes tons_placed, effective_density_tons_per_cy, airspace_consumed_cy", "status CLOSED", "billing dimension: every CLEARED load PROVISIONAL -> FINALIZED with host_royalty_amount and final_charge_amount written in chronological order", "cascade link 1: Cell.consumed_airspace_cy and fill_pct increased", "cascade link 2: Cell ACTIVE -> FULL when fill_pct >= 98.0", "cascade link 3: Landfill.consumed_airspace_cy, remaining_airspace_cy, remaining_life_years and active_cell_count recomputed; operating_status -> SUSPENDED_NO_AIRSPACE when no ACTIVE cell remains, or -> RESTRICTED_AIRSPACE when remaining_life_years < 2.0", "cascade link 4: every APPROVED SpecialWasteApproval of the landfill -> SUSPENDED when the site stopped accepting waste", "SpecialWasteApproval.consumed_tons re-based per finalized load by (certified_net_tons - manifest_tons); APPROVED -> EXHAUSTED when it reaches approved_tons_cap", "increments Cell.version by 1", "increments Landfill.version by 1", "increments OperatingDay.version by 1"]

  - method: POST
    path: "/operating-days/{operating_day_id}/amend"
    description: "Reopens a closed day for correction: CLOSED -> AMENDED. Fully compensates every side effect of the close, leaving no drift in any ledger."
    roles: [SiteOperator]
    code: 200
    input: [amend_reason]
    output: OperatingDay
    side_effects: ["compensation 1: effective_density_tons_per_cy, airspace_consumed_cy and tons_placed reset to 0", "compensation 2: Cell.consumed_airspace_cy and fill_pct reduced by exactly the reversed amount; Cell FULL -> ACTIVE when fill_pct drops below 98.0", "compensation 3: Landfill airspace ledger, remaining_life_years and active_cell_count recomputed; operating_status SUSPENDED_NO_AIRSPACE -> OPEN when an ACTIVE cell exists again", "compensation 4: billing dimension every FINALIZED load -> PROVISIONAL with host_royalty_amount and final_charge_amount cleared to null; gate_charge_amount left untouched", "compensation 5: SpecialWasteApproval.consumed_tons re-based per reverted load by (manifest_tons - certified_net_tons), restoring the exact pre-close manifest figure; EXHAUSTED -> APPROVED when it falls back below approved_tons_cap; SUSPENDED -> APPROVED when the site resumed acceptance", "amend_reason stored", "increments Cell.version by 1", "increments Landfill.version by 1", "increments OperatingDay.version by 1"]

  - method: GET
    path: "/operating-days/{operating_day_id}/waste-loads"
    description: "Sub-resource: every load received on this operating day, in receipt order."
    roles: [PlatformAdmin, SiteOperator, ScaleOperator, CqaEngineer, SurveyorOfRecord, EnvironmentalManager, RegulatoryAgency, FinanceOfficer]
    code: 200
    input: ["screening_status?", "billing_status?", "limit?", "offset?"]
    output: WasteLoad[]
    side_effects: []

  # --- WasteLoad -------------------------------------------------------------
  - method: POST
    path: "/waste-loads"
    description: "Receives an inbound load at the scale house against an OPEN operating day, recording the manifest weight and the working-face load-check result."
    roles: [ScaleOperator]
    code: 201
    input: [operating_day_id, hauler_ref, waste_stream, manifest_tons, load_check_result, "special_waste_approval_id?"]
    output: WasteLoad
    side_effects: ["screening_status PENDING", "billing_status UNBILLED", "all charge amounts null", "version 1"]

  - method: GET
    path: "/waste-loads/{waste_load_id}"
    description: "Reads one load including both screening and billing dimensions and all three charge amounts."
    roles: [PlatformAdmin, SiteOperator, ScaleOperator, CqaEngineer, SurveyorOfRecord, EnvironmentalManager, RegulatoryAgency, FinanceOfficer]
    code: 200
    input: []
    output: WasteLoad
    side_effects: []

  - method: GET
    path: "/waste-loads"
    description: "Lists loads filtered by operating day, by the special-waste approval they draw on, or by either state dimension."
    roles: [PlatformAdmin, SiteOperator, ScaleOperator, CqaEngineer, SurveyorOfRecord, EnvironmentalManager, RegulatoryAgency, FinanceOfficer]
    code: 200
    input: ["operating_day_id?", "special_waste_approval_id?", "screening_status?", "billing_status?", "limit?", "offset?"]
    output: WasteLoad[]
    side_effects: []

  - method: POST
    path: "/waste-loads/{waste_load_id}/clear-screening"
    description: "Clears a load for placement at the working face: screening PENDING -> CLEARED and billing UNBILLED -> PROVISIONAL, pricing the manifest tonnage at the gate rate."
    roles: [ScaleOperator]
    code: 200
    input: []
    output: WasteLoad
    side_effects: ["screening_status CLEARED", "billing_status PROVISIONAL", "computes gate_charge_amount via the gate_rate variant", "SpecialWasteApproval.consumed_tons increased by manifest_tons; -> EXHAUSTED at the cap", "increments SpecialWasteApproval.version by 1 when one is linked", "increments WasteLoad.version by 1"]

  - method: POST
    path: "/waste-loads/{waste_load_id}/flag"
    description: "Holds a suspicious load for inspection: screening PENDING -> FLAGGED. Billing is untouched."
    roles: [ScaleOperator]
    code: 200
    input: [screening_state_reason]
    output: WasteLoad
    side_effects: ["screening_status FLAGGED", "screening_state_reason stored", "billing_status stays UNBILLED", "increments WasteLoad.version by 1"]

  - method: POST
    path: "/waste-loads/{waste_load_id}/reject"
    description: "Turns a flagged load away at the gate: screening FLAGGED -> REJECTED (terminal). The load never enters tons_placed."
    roles: [ScaleOperator]
    code: 200
    input: [screening_state_reason]
    output: WasteLoad
    side_effects: ["screening_status REJECTED", "screening_state_reason stored", "releases the load's slot against Landfill.daily_load_limit", "increments WasteLoad.version by 1"]

  - method: POST
    path: "/waste-loads/{waste_load_id}/certify-weight"
    description: "Records the certified scale weight for a cleared load, which the day close prices under the certified_scale variant."
    roles: [ScaleOperator]
    code: 200
    input: [certified_net_tons]
    output: WasteLoad
    side_effects: ["certified_net_tons stored", "SpecialWasteApproval.consumed_tons is NOT touched here; the re-basing to certified tons happens at day close", "increments WasteLoad.version by 1"]

  # --- SpecialWasteApproval --------------------------------------------------
  - method: POST
    path: "/special-waste-approvals"
    description: "Requests a special-waste profile approval for a generator, capping the tonnage the site may accept under it."
    roles: [EnvironmentalManager]
    code: 201
    input: [landfill_id, generator_name, waste_code, profile_stream, approved_tons_cap, effective_from, expires_on]
    output: SpecialWasteApproval
    side_effects: ["status REQUESTED", "consumed_tons 0", "version 1"]

  - method: GET
    path: "/special-waste-approvals/{special_waste_approval_id}"
    description: "Reads one special-waste approval including its consumed tonnage."
    roles: [PlatformAdmin, SiteOperator, ScaleOperator, CqaEngineer, SurveyorOfRecord, EnvironmentalManager, RegulatoryAgency, FinanceOfficer]
    code: 200
    input: []
    output: SpecialWasteApproval
    side_effects: []

  - method: GET
    path: "/special-waste-approvals"
    description: "Lists special-waste approvals filtered by landfill or lifecycle state."
    roles: [PlatformAdmin, SiteOperator, ScaleOperator, CqaEngineer, SurveyorOfRecord, EnvironmentalManager, RegulatoryAgency, FinanceOfficer]
    code: 200
    input: ["landfill_id?", "status?", "limit?", "offset?"]
    output: SpecialWasteApproval[]
    side_effects: []

  - method: POST
    path: "/special-waste-approvals/{special_waste_approval_id}/approve"
    description: "Approves the profile: REQUESTED -> APPROVED. Only an APPROVED, in-window approval may back a special-waste load."
    roles: [EnvironmentalManager]
    code: 200
    input: [decision_reason]
    output: SpecialWasteApproval
    side_effects: ["status APPROVED", "decision_reason stored", "increments SpecialWasteApproval.version by 1"]

  - method: POST
    path: "/special-waste-approvals/{special_waste_approval_id}/deny"
    description: "Denies the profile: REQUESTED -> DENIED (terminal)."
    roles: [EnvironmentalManager]
    code: 200
    input: [decision_reason]
    output: SpecialWasteApproval
    side_effects: ["status DENIED", "decision_reason stored", "increments SpecialWasteApproval.version by 1"]

  - method: POST
    path: "/special-waste-approvals/{special_waste_approval_id}/revoke"
    description: "Revokes an approved profile: APPROVED -> REVOKED (terminal)."
    roles: [EnvironmentalManager]
    code: 200
    input: [decision_reason]
    output: SpecialWasteApproval
    side_effects: ["status REVOKED", "decision_reason stored", "increments SpecialWasteApproval.version by 1"]

  # --- TreatmentAgreement ----------------------------------------------------
  - method: POST
    path: "/treatment-agreements"
    description: "Registers a leachate treatment and disposal agreement with a receiving facility, fixing the daily gallon cap, the concurrent hauling-slot capacity and the two price components."
    roles: [EnvironmentalManager]
    code: 201
    input: [landfill_id, facility_name, daily_gallon_cap, base_haul_fee, treatment_rate_per_kgal, effective_from, expires_on, "concurrent_slot_capacity?"]
    output: TreatmentAgreement
    side_effects: ["status ACTIVE", "concurrent_slot_capacity defaults to 2", "scheduled_gallons_today 0", "version 1"]

  - method: GET
    path: "/treatment-agreements/{treatment_agreement_id}"
    description: "Reads one treatment agreement including today's scheduled gallons."
    roles: [PlatformAdmin, SiteOperator, ScaleOperator, CqaEngineer, SurveyorOfRecord, EnvironmentalManager, RegulatoryAgency, FinanceOfficer]
    code: 200
    input: []
    output: TreatmentAgreement
    side_effects: ["lazily moves an ACTIVE agreement whose expires_on is at or before the logical clock to EXPIRED"]

  - method: GET
    path: "/treatment-agreements"
    description: "Lists treatment agreements filtered by landfill or availability state."
    roles: [PlatformAdmin, SiteOperator, ScaleOperator, CqaEngineer, SurveyorOfRecord, EnvironmentalManager, RegulatoryAgency, FinanceOfficer]
    code: 200
    input: ["landfill_id?", "status?", "limit?", "offset?"]
    output: TreatmentAgreement[]
    side_effects: []

  - method: POST
    path: "/treatment-agreements/{treatment_agreement_id}/suspend"
    description: "Suspends a facility contract after a receiving-plant upset: ACTIVE -> SUSPENDED. No new shipment may be scheduled or dispatched while suspended."
    roles: [EnvironmentalManager]
    code: 200
    input: [suspension_reason]
    output: TreatmentAgreement
    side_effects: ["status SUSPENDED", "suspension_reason stored", "already SCHEDULED shipments keep their slot and gallons", "increments TreatmentAgreement.version by 1"]

  - method: POST
    path: "/treatment-agreements/{treatment_agreement_id}/reinstate"
    description: "Restores a suspended contract: SUSPENDED -> ACTIVE."
    roles: [EnvironmentalManager]
    code: 200
    input: []
    output: TreatmentAgreement
    side_effects: ["status ACTIVE", "suspension_reason cleared to null", "increments TreatmentAgreement.version by 1"]

  - method: GET
    path: "/treatment-agreements/{treatment_agreement_id}/leachate-shipments"
    description: "Sub-resource: every leachate shipment booked under this agreement, in window order."
    roles: [PlatformAdmin, SiteOperator, ScaleOperator, CqaEngineer, SurveyorOfRecord, EnvironmentalManager, RegulatoryAgency, FinanceOfficer]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: LeachateShipment[]
    side_effects: []

  # --- LeachateShipment ------------------------------------------------------
  - method: POST
    path: "/leachate-shipments"
    description: "Books a tanker haul of collected leachate into a half-open delivery window, subject to the agreement's concurrent slot capacity and its daily gallon cap."
    roles: [SiteOperator]
    code: 201
    input: [treatment_agreement_id, gallons, window_start, window_end]
    output: LeachateShipment
    side_effects: ["status SCHEDULED", "computes treatment_fee and surcharge_pct", "invoice_total stays null until acceptance", "TreatmentAgreement.scheduled_gallons_today increased by gallons", "increments TreatmentAgreement.version by 1", "version 1"]

  - method: GET
    path: "/leachate-shipments/{leachate_shipment_id}"
    description: "Reads one leachate shipment including its computed fee, surcharge percentage and invoice total."
    roles: [PlatformAdmin, SiteOperator, ScaleOperator, CqaEngineer, SurveyorOfRecord, EnvironmentalManager, RegulatoryAgency, FinanceOfficer]
    code: 200
    input: []
    output: LeachateShipment
    side_effects: []

  - method: GET
    path: "/leachate-shipments"
    description: "Lists leachate shipments filtered by treatment agreement or lifecycle state."
    roles: [PlatformAdmin, SiteOperator, ScaleOperator, CqaEngineer, SurveyorOfRecord, EnvironmentalManager, RegulatoryAgency, FinanceOfficer]
    code: 200
    input: ["treatment_agreement_id?", "status?", "limit?", "offset?"]
    output: LeachateShipment[]
    side_effects: []

  - method: POST
    path: "/leachate-shipments/{leachate_shipment_id}/dispatch"
    description: "Releases the tanker to the receiving facility: SCHEDULED -> DISPATCHED. Requires the agreement to be ACTIVE."
    roles: [SiteOperator]
    code: 200
    input: [hauler_ref]
    output: LeachateShipment
    side_effects: ["status DISPATCHED", "hauler_ref stored", "increments LeachateShipment.version by 1"]

  - method: POST
    path: "/leachate-shipments/{leachate_shipment_id}/confirm-acceptance"
    description: "The receiving facility accepts the load: DISPATCHED -> ACCEPTED, writing the invoice total."
    roles: [SiteOperator]
    code: 200
    input: []
    output: LeachateShipment
    side_effects: ["status ACCEPTED", "computes invoice_total from the stored treatment_fee and surcharge_pct", "increments LeachateShipment.version by 1"]

  - method: POST
    path: "/leachate-shipments/{leachate_shipment_id}/reject-at-gate"
    description: "The receiving facility turns the tanker away on a strength test: DISPATCHED -> REJECTED_AT_GATE (terminal). The gallons are released."
    roles: [SiteOperator]
    code: 200
    input: [gate_reason]
    output: LeachateShipment
    side_effects: ["status REJECTED_AT_GATE", "gate_reason stored", "invoice_total stays null", "TreatmentAgreement.scheduled_gallons_today reduced by exactly gallons", "releases the shipment's window slot", "increments TreatmentAgreement.version by 1", "increments LeachateShipment.version by 1"]

  - method: POST
    path: "/leachate-shipments/{leachate_shipment_id}/cancel"
    description: "Cancels a booked haul before dispatch: SCHEDULED -> CANCELLED (terminal), releasing both the window slot and the gallons."
    roles: [SiteOperator]
    code: 200
    input: [gate_reason]
    output: LeachateShipment
    side_effects: ["status CANCELLED", "gate_reason stored", "TreatmentAgreement.scheduled_gallons_today reduced by exactly gallons", "releases the shipment's window slot", "increments TreatmentAgreement.version by 1", "increments LeachateShipment.version by 1"]

  # --- GasWell ---------------------------------------------------------------
  - method: POST
    path: "/gas-wells"
    description: "Records a landfill-gas extraction well drilled into a cell whose waste column is deep enough to support collection."
    roles: [EnvironmentalManager]
    code: 201
    input: [cell_id, well_code, depth_ft]
    output: GasWell
    side_effects: ["status DRILLED", "all three last_* readings null", "last_tuned_at null", "version 1"]

  - method: GET
    path: "/gas-wells/{gas_well_id}"
    description: "Reads one gas well including its most recent wellhead readings and tuning timestamp."
    roles: [PlatformAdmin, SiteOperator, ScaleOperator, CqaEngineer, SurveyorOfRecord, EnvironmentalManager, RegulatoryAgency, FinanceOfficer]
    code: 200
    input: []
    output: GasWell
    side_effects: []

  - method: GET
    path: "/gas-wells"
    description: "Lists gas wells filtered by cell or wellfield state."
    roles: [PlatformAdmin, SiteOperator, ScaleOperator, CqaEngineer, SurveyorOfRecord, EnvironmentalManager, RegulatoryAgency, FinanceOfficer]
    code: 200
    input: ["cell_id?", "status?", "limit?", "offset?"]
    output: GasWell[]
    side_effects: []

  - method: POST
    path: "/gas-wells/{gas_well_id}/connect"
    description: "Ties the well into the header and blower: DRILLED -> CONNECTED. Allowed only for a cell in ACTIVE, FULL or CLOSED."
    roles: [EnvironmentalManager]
    code: 200
    input: []
    output: GasWell
    side_effects: ["status CONNECTED", "increments GasWell.version by 1"]

  - method: POST
    path: "/gas-wells/{gas_well_id}/tune"
    description: "Records a wellhead tuning visit. Readings within spec (methane >= 45.0 and oxygen <= 5.0 and vacuum >= 10.0) drive the well ONLINE; readings outside spec leave it TUNING_REQUIRED. An oxygen reading at or above 12.0 is refused outright as a subsurface-fire risk."
    roles: [EnvironmentalManager]
    code: 200
    input: [last_vacuum_in_h2o, last_methane_pct, last_oxygen_pct]
    output: GasWell
    side_effects: ["three last_* readings stored", "last_tuned_at set to the logical clock", "status ONLINE or TUNING_REQUIRED", "Landfill.gas_collection_status CORRECTIVE_ACTION -> COMPLIANT when no EXCEEDANCE_OPEN scan and no TUNING_REQUIRED well of the landfill remains", "increments Landfill.version by 1", "increments GasWell.version by 1"]

  - method: POST
    path: "/gas-wells/{gas_well_id}/take-offline"
    description: "Valves the well out of the collection system: ONLINE -> OFFLINE."
    roles: [EnvironmentalManager]
    code: 200
    input: [offline_reason]
    output: GasWell
    side_effects: ["status OFFLINE", "offline_reason stored", "removes the well from the corrective-action candidate pool", "increments GasWell.version by 1"]

  - method: POST
    path: "/gas-wells/{gas_well_id}/abandon"
    description: "Permanently abandons and grouts the well: OFFLINE -> ABANDONED (terminal)."
    roles: [EnvironmentalManager]
    code: 200
    input: [offline_reason]
    output: GasWell
    side_effects: ["status ABANDONED", "offline_reason stored", "increments GasWell.version by 1"]

  # --- SurfaceEmissionScan ---------------------------------------------------
  - method: POST
    path: "/surface-emission-scans"
    description: "Records a quarterly surface-emission monitoring walkover. A max reading at or above 500 ppm opens an exceedance and drives the depth-3 corrective-action cascade onto one deterministically selected online well."
    roles: [EnvironmentalManager]
    code: 201
    input: [landfill_id, scanned_on, grid_points_count, max_reading_ppm, "exceedance_point_ref?"]
    output: SurfaceEmissionScan
    side_effects: ["status PASSED below 500 ppm, EXCEEDANCE_OPEN at or above 500 ppm", "cascade link 1: corrective_well_id set to the ONLINE well of this landfill with the earliest last_tuned_at, tie-broken by created_at ASC; left null when the candidate pool is empty", "cascade link 2: that well ONLINE -> TUNING_REQUIRED", "cascade link 3: Landfill.gas_collection_status -> CORRECTIVE_ACTION even when no well was selected", "increments Landfill.version by 1", "increments GasWell.version by 1 when a well was selected", "version 1"]

  - method: GET
    path: "/surface-emission-scans/{surface_emission_scan_id}"
    description: "Reads one surface-emission scan including the well the cascade selected for re-tuning."
    roles: [PlatformAdmin, SiteOperator, ScaleOperator, CqaEngineer, SurveyorOfRecord, EnvironmentalManager, RegulatoryAgency, FinanceOfficer]
    code: 200
    input: []
    output: SurfaceEmissionScan
    side_effects: []

  - method: GET
    path: "/surface-emission-scans"
    description: "Lists surface-emission scans filtered by landfill, by the well selected for corrective action, or by outcome."
    roles: [PlatformAdmin, SiteOperator, ScaleOperator, CqaEngineer, SurveyorOfRecord, EnvironmentalManager, RegulatoryAgency, FinanceOfficer]
    code: 200
    input: ["landfill_id?", "corrective_well_id?", "status?", "limit?", "offset?"]
    output: SurfaceEmissionScan[]
    side_effects: []

  - method: POST
    path: "/surface-emission-scans/{surface_emission_scan_id}/resolve"
    description: "Closes out an open exceedance after a documented re-scan: EXCEEDANCE_OPEN -> RESOLVED."
    roles: [EnvironmentalManager]
    code: 200
    input: [remediation_note]
    output: SurfaceEmissionScan
    side_effects: ["status RESOLVED", "remediation_note stored", "Landfill.gas_collection_status CORRECTIVE_ACTION -> COMPLIANT when no other EXCEEDANCE_OPEN scan and no TUNING_REQUIRED well of the landfill remains", "increments Landfill.version by 1", "increments SurfaceEmissionScan.version by 1"]

  # --- ClosureCostEstimate ---------------------------------------------------
  - method: POST
    path: "/closure-cost-estimates"
    description: "Files the annual closure and post-closure cost update. Guarded by optimistic concurrency on the landfill: expected_landfill_version must match the version the client last read, because certified airspace changes the closure area."
    roles: [FinanceOfficer]
    code: 201
    input: [landfill_id, estimate_year, closure_unit_cost_per_sf, post_closure_annual_cost, inflation_pct, expected_landfill_version, "post_closure_years?"]
    output: ClosureCostEstimate
    side_effects: ["computes closure_cost_total, post_closure_cost_total, required_assurance_amount and funding_shortfall", "status DRAFT", "post_closure_years defaults to 30", "instrument_type null", "increments Landfill.version by 1", "version 1"]

  - method: GET
    path: "/closure-cost-estimates/{closure_cost_estimate_id}"
    description: "Reads one annual cost update including its two cost totals, the required assurance and the current shortfall."
    roles: [PlatformAdmin, SiteOperator, ScaleOperator, CqaEngineer, SurveyorOfRecord, EnvironmentalManager, RegulatoryAgency, FinanceOfficer]
    code: 200
    input: []
    output: ClosureCostEstimate
    side_effects: []

  - method: GET
    path: "/closure-cost-estimates"
    description: "Lists annual cost updates filtered by landfill or lifecycle state."
    roles: [PlatformAdmin, SiteOperator, ScaleOperator, CqaEngineer, SurveyorOfRecord, EnvironmentalManager, RegulatoryAgency, FinanceOfficer]
    code: 200
    input: ["landfill_id?", "estimate_year?", "status?", "limit?", "offset?"]
    output: ClosureCostEstimate[]
    side_effects: []

  - method: POST
    path: "/closure-cost-estimates/{closure_cost_estimate_id}/certify"
    description: "A second finance officer certifies the cost update: DRAFT -> CERTIFIED. The officer that filed the estimate may not certify it. Certifying supersedes the landfill's previously CERTIFIED estimate."
    roles: [FinanceOfficer]
    code: 200
    input: []
    output: ClosureCostEstimate
    side_effects: ["status CERTIFIED", "recomputes the four money fields against the landfill's current cell set", "cascade: the landfill's previously CERTIFIED estimate -> SUPERSEDED", "Landfill.financial_assurance_status set to FUNDED when funding_shortfall == 0, otherwise SHORTFALL_REVIEW", "increments Landfill.version by 1", "increments ClosureCostEstimate.version by 1"]

  - method: POST
    path: "/closure-cost-estimates/{closure_cost_estimate_id}/fund-assurance"
    description: "Posts a financial-assurance instrument against a certified cost update, recomputing the shortfall and the landfill's assurance posture."
    roles: [FinanceOfficer]
    code: 200
    input: [instrument_type, funded_amount]
    output: ClosureCostEstimate
    side_effects: ["instrument_type stored", "Landfill.assurance_funded_amount set to funded_amount", "recomputes funding_shortfall (step 4 only; the two cost totals are untouched)", "Landfill.financial_assurance_status FUNDED when funding_shortfall == 0, otherwise SHORTFALL_REVIEW", "increments Landfill.version by 1", "increments ClosureCostEstimate.version by 1"]

  # --- HostCommunityAgreement ------------------------------------------------
  - method: POST
    path: "/host-community-agreements"
    description: "Drafts the host community agreement that fixes the posted tipping fee, the per-ton host fee, the monthly royalty tiers and the minimum annual payment."
    roles: [FinanceOfficer]
    code: 201
    input: [landfill_id, community_name, posted_tipping_fee_per_ton, host_fee_per_ton, tier1_monthly_tons, royalty_tier1_pct, royalty_tier2_pct, minimum_annual_payment, effective_from, expires_on]
    output: HostCommunityAgreement
    side_effects: ["status DRAFT", "amendment_round 0", "version 1"]

  - method: GET
    path: "/host-community-agreements/{host_community_agreement_id}"
    description: "Reads one host community agreement including its fee schedule and amendment round."
    roles: [PlatformAdmin, SiteOperator, ScaleOperator, CqaEngineer, SurveyorOfRecord, EnvironmentalManager, RegulatoryAgency, FinanceOfficer]
    code: 200
    input: []
    output: HostCommunityAgreement
    side_effects: []

  - method: GET
    path: "/host-community-agreements"
    description: "Lists host community agreements filtered by landfill or lifecycle state; at most one per landfill is EXECUTED or UNDER_AMENDMENT."
    roles: [PlatformAdmin, SiteOperator, ScaleOperator, CqaEngineer, SurveyorOfRecord, EnvironmentalManager, RegulatoryAgency, FinanceOfficer]
    code: 200
    input: ["landfill_id?", "status?", "limit?", "offset?"]
    output: HostCommunityAgreement[]
    side_effects: []

  - method: POST
    path: "/host-community-agreements/{host_community_agreement_id}/execute"
    description: "Executes the agreement: DRAFT -> EXECUTED. Guarded by optimistic concurrency on the landfill, because executing a second agreement while another is live would double-price every load."
    roles: [FinanceOfficer]
    code: 200
    input: [expected_landfill_version]
    output: HostCommunityAgreement
    side_effects: ["status EXECUTED", "the landfill's tipping-fee schedule becomes effective for gate and final pricing", "increments Landfill.version by 1", "increments HostCommunityAgreement.version by 1"]

  - method: POST
    path: "/host-community-agreements/{host_community_agreement_id}/open-amendment"
    description: "Opens a fee re-negotiation: EXECUTED -> UNDER_AMENDMENT. Pricing continues off the current schedule while the amendment is open."
    roles: [FinanceOfficer]
    code: 200
    input: [amendment_reason]
    output: HostCommunityAgreement
    side_effects: ["status UNDER_AMENDMENT", "amendment_reason stored", "fee fields unchanged", "increments HostCommunityAgreement.version by 1"]

  - method: POST
    path: "/host-community-agreements/{host_community_agreement_id}/execute-amendment"
    description: "Executes the re-negotiated schedule: UNDER_AMENDMENT -> EXECUTED, incrementing amendment_round. The new fees apply only to loads priced after this call."
    roles: [FinanceOfficer]
    code: 200
    input: [posted_tipping_fee_per_ton, host_fee_per_ton, tier1_monthly_tons, royalty_tier1_pct, royalty_tier2_pct]
    output: HostCommunityAgreement
    side_effects: ["status EXECUTED", "the five fee fields replaced", "amendment_round + 1", "amendment_reason cleared to null", "already-written gate_charge_amount and final_charge_amount values are never retro-priced", "increments HostCommunityAgreement.version by 1"]

  - method: POST
    path: "/host-community-agreements/{host_community_agreement_id}/terminate"
    description: "Terminates the agreement: EXECUTED -> TERMINATED (terminal). The site can no longer price loads until a new agreement is executed."
    roles: [FinanceOfficer]
    code: 200
    input: [termination_reason]
    output: HostCommunityAgreement
    side_effects: ["status TERMINATED", "termination_reason stored", "increments Landfill.version by 1", "increments HostCommunityAgreement.version by 1"]

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:

  # --- authentication and authorization ---
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "X-User-Role or X-User-ID header missing, or X-User-Role is not one of the eight declared roles."
  - id: ERR_ROLE_NOT_PERMITTED
    http: 403
    condition: "The acting role is not listed in the called endpoint's roles."
  - id: ERR_SITE_SCOPE_VIOLATION
    http: 403
    condition: "A SiteOperator or ScaleOperator acts on a resource whose owning Landfill.id differs from the acting X-User-ID."
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 403
    condition: "The same X-User-ID both submitted and reviewed/approved/returned a LinerQaPackage, or both filed and certified a ClosureCostEstimate."

  # --- request shape ---
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "Missing required field, wrong JSON type, undeclared enum member, unparseable timestamp, non-positive quantity, inverted interval, or passing_test_count greater than destructive_test_count."

  # --- existence ---
  - id: ERR_LANDFILL_NOT_FOUND
    http: 404
    condition: "No Landfill with the supplied id."
  - id: ERR_CELL_NOT_FOUND
    http: 404
    condition: "No Cell with the supplied id, in the path or in cell_id / active_cell_id / piggyback_over_cell_id."
  - id: ERR_LINER_QA_PACKAGE_NOT_FOUND
    http: 404
    condition: "No LinerQaPackage with the supplied id."
  - id: ERR_AERIAL_SURVEY_NOT_FOUND
    http: 404
    condition: "No AerialSurvey with the supplied id."
  - id: ERR_OPERATING_DAY_NOT_FOUND
    http: 404
    condition: "No OperatingDay with the supplied id, in the path or in operating_day_id."
  - id: ERR_WASTE_LOAD_NOT_FOUND
    http: 404
    condition: "No WasteLoad with the supplied id."
  - id: ERR_SPECIAL_WASTE_APPROVAL_NOT_FOUND
    http: 404
    condition: "No SpecialWasteApproval with the supplied id, in the path or in special_waste_approval_id."
  - id: ERR_TREATMENT_AGREEMENT_NOT_FOUND
    http: 404
    condition: "No TreatmentAgreement with the supplied id, in the path or in treatment_agreement_id."
  - id: ERR_LEACHATE_SHIPMENT_NOT_FOUND
    http: 404
    condition: "No LeachateShipment with the supplied id."
  - id: ERR_GAS_WELL_NOT_FOUND
    http: 404
    condition: "No GasWell with the supplied id."
  - id: ERR_SURFACE_EMISSION_SCAN_NOT_FOUND
    http: 404
    condition: "No SurfaceEmissionScan with the supplied id."
  - id: ERR_CLOSURE_COST_ESTIMATE_NOT_FOUND
    http: 404
    condition: "No ClosureCostEstimate with the supplied id."
  - id: ERR_HOST_COMMUNITY_AGREEMENT_NOT_FOUND
    http: 404
    condition: "No HostCommunityAgreement with the supplied id."

  # --- referential integrity and concurrency ---
  - id: ERR_CROSS_SITE_REFERENCE
    http: 409
    condition: "Two entities named in one request belong to different Landfills, or a SpecialWasteApproval.profile_stream does not equal the referencing load's waste_stream."
  - id: ERR_STALE_LANDFILL_VERSION
    http: 412
    condition: "expected_landfill_version does not equal the current Landfill.version."

  # --- own-state and cross-entity gating states ---
  - id: ERR_INVALID_STATE_TRANSITION
    http: 409
    condition: "The addressed entity is not in one of the from states declared for this trigger in §1.2."
  - id: ERR_SITE_NOT_ACCEPTING_WASTE
    http: 409
    condition: "Landfill.operating_status is not in {OPEN, RESTRICTED_AIRSPACE} when a waste load is received."
  - id: ERR_CELL_NOT_ACCEPTING_WASTE
    http: 409
    condition: "The OperatingDay's active cell is not ACTIVE when a waste load is received."
  - id: ERR_CELL_NOT_READY_FOR_WELLFIELD
    http: 409
    condition: "A gas well is connected to a Cell whose status is not in {ACTIVE, FULL, CLOSED}."
  - id: ERR_AGREEMENT_NOT_ACTIVE
    http: 409
    condition: "A leachate shipment is scheduled or dispatched against a TreatmentAgreement that is SUSPENDED or EXPIRED."

  # --- regulatory safety and compliance ---
  - id: ERR_PROHIBITED_MATERIAL
    http: 422
    condition: "A load with load_check_result PROHIBITED_FOUND or UNMANIFESTED is cleared for placement, or a load whose waste_stream is INDUSTRIAL_SPECIAL or ASBESTOS_SPECIAL is cleared with no linked SpecialWasteApproval."
  - id: ERR_QA_SCORE_BELOW_THRESHOLD
    http: 422
    condition: "A LinerQaPackage is approved with qa_conformance_score below 85.0."
  - id: ERR_GAS_CORRECTIVE_ACTION_OPEN
    http: 409
    condition: "A cell is authorized for waste placement or activated while its Landfill.gas_collection_status is CORRECTIVE_ACTION."
  - id: ERR_WELL_OXYGEN_CRITICAL
    http: 422
    condition: "A tuning visit reports last_oxygen_pct at or above 12.0, indicating subsurface-fire risk."
  - id: ERR_APPROVAL_EXPIRED
    http: 422
    condition: "The linked SpecialWasteApproval is not APPROVED, or the logical clock is outside [effective_from, expires_on)."

  # --- temporal constraints ---
  - id: ERR_SURVEY_PERIOD_OVERLAP
    http: 409
    condition: "The new survey's closed coverage interval overlaps that of a RECORDED or SUPERSEDED survey of the same landfill."
  - id: ERR_SURVEY_SPACING_VIOLATION
    http: 409
    condition: "The new survey's flown_on is fewer than 90 whole days from that of a RECORDED or SUPERSEDED survey of the same landfill."
  - id: ERR_SLOT_CAPACITY_EXCEEDED
    http: 409
    condition: "Counting the new shipment, more than concurrent_slot_capacity shipments of the agreement occupy overlapping half-open delivery windows."

  # --- uniqueness ---
  - id: ERR_DUPLICATE_PERMIT_NUMBER
    http: 409
    condition: "Another Landfill already holds this permit_number."
  - id: ERR_DUPLICATE_CELL_CODE
    http: 409
    condition: "Another Cell of the same landfill already holds this cell_code."
  - id: ERR_DUPLICATE_OPERATING_DATE
    http: 409
    condition: "Another OperatingDay of the same landfill already covers this operating_date."
  - id: ERR_DUPLICATE_WELL_CODE
    http: 409
    condition: "Another GasWell in a cell of the same landfill already holds this well_code."
  - id: ERR_DUPLICATE_ESTIMATE_YEAR
    http: 409
    condition: "Another ClosureCostEstimate of the same landfill already covers this estimate_year."

  # --- structural and operational constraints ---
  - id: ERR_PIGGYBACK_PARENT_NOT_CLOSED
    http: 409
    condition: "piggyback_over_cell_id names a Cell whose status is not CLOSED."
  - id: ERR_DAILY_LOAD_LIMIT_EXCEEDED
    http: 409
    condition: "Receiving the load would push the day's non-rejected load count above Landfill.daily_load_limit."
  - id: ERR_PENDING_SCREENING_PRESENT
    http: 409
    condition: "An OperatingDay with a load still PENDING or FLAGGED is closed."
  - id: ERR_UNCERTIFIED_LOADS_PRESENT
    http: 409
    condition: "An OperatingDay with a CLEARED load whose certified_net_tons is null is closed."
  - id: ERR_CELL_HAS_UNFINISHED_WELLS
    http: 409
    condition: "A Cell with a GasWell in DRILLED, CONNECTED or TUNING_REQUIRED is closed."
  - id: ERR_AMENDMENT_IN_PROGRESS
    http: 409
    condition: "POST /host-community-agreements/{host_community_agreement_id}/open-amendment is addressed to an agreement whose status is already UNDER_AMENDMENT (this endpoint is carved out of the priority-9 state check so the specific error survives)."
  - id: ERR_HOST_AGREEMENT_ALREADY_LIVE
    http: 409
    condition: "A DRAFT HostCommunityAgreement is executed while another agreement of the same landfill is UNDER_AMENDMENT (an EXECUTED one is superseded, not a blocker)."

  # --- fiscal and financial assurance (lowest priority) ---
  - id: ERR_PERMITTED_AIRSPACE_EXCEEDED
    http: 422
    condition: "Closing the day would push Landfill.consumed_airspace_cy above permitted_total_airspace_cy."
  - id: ERR_NO_EXECUTED_HOST_AGREEMENT
    http: 409
    condition: "A load is cleared or a day is closed while the landfill has no HostCommunityAgreement in EXECUTED or UNDER_AMENDMENT."
  - id: ERR_APPROVAL_TONNAGE_CAP_EXCEEDED
    http: 422
    condition: "Clearing the load would push SpecialWasteApproval.consumed_tons above approved_tons_cap."
  - id: ERR_DAILY_GALLON_CAP_EXCEEDED
    http: 422
    condition: "Booking the shipment would push the agreement's gallons for that calendar date above daily_gallon_cap."
  - id: ERR_FINANCIAL_ASSURANCE_SHORTFALL
    http: 402
    condition: "A cell is authorized for waste placement while Landfill.financial_assurance_status is not FUNDED."

# =============================================================================
# §1.7 RBAC Matrix — segregation_of_duties
# =============================================================================
roles:

  - name: PlatformAdmin
    description: "Regulatory data-system administrator: registers permitted landfills, moves site operating posture, and drives the logical clock."
    identity: "opaque"
    exclusive_operations: ["POST /landfills", "POST /landfills/{landfill_id}/operating-status", "POST /_clock/set_current_utc"]
    shared_operations: ["all GET endpoints"]

  - name: SiteOperator
    description: "Landfill operations manager for one site: builds cells, submits liner CQA documentation, runs the daily operations log, and books leachate hauls. X-User-ID is the id of the Landfill being operated."
    identity: "entity_backed:Landfill"
    exclusive_operations: ["POST /cells", "POST /cells/{cell_id}/begin-construction", "POST /cells/{cell_id}/activate", "POST /cells/{cell_id}/close", "POST /liner-qa-packages", "POST /liner-qa-packages/{liner_qa_package_id}/resubmit", "POST /operating-days", "POST /operating-days/{operating_day_id}/close", "POST /operating-days/{operating_day_id}/amend", "POST /leachate-shipments", "POST /leachate-shipments/{leachate_shipment_id}/dispatch", "POST /leachate-shipments/{leachate_shipment_id}/confirm-acceptance", "POST /leachate-shipments/{leachate_shipment_id}/reject-at-gate", "POST /leachate-shipments/{leachate_shipment_id}/cancel"]
    shared_operations: ["all GET endpoints"]

  - name: ScaleOperator
    description: "Scale-house attendant for one site: receives inbound loads, performs waste-acceptance screening, and records certified scale weights. X-User-ID is the id of the Landfill whose scale house is staffed."
    identity: "entity_backed:Landfill"
    exclusive_operations: ["POST /waste-loads", "POST /waste-loads/{waste_load_id}/clear-screening", "POST /waste-loads/{waste_load_id}/flag", "POST /waste-loads/{waste_load_id}/reject", "POST /waste-loads/{waste_load_id}/certify-weight"]
    shared_operations: ["all GET endpoints"]

  - name: CqaEngineer
    description: "Independent construction-quality-assurance engineer of record: reviews, returns and approves liner documentation. Cannot submit the package they review (segregation of duties on submitted_by_user_id)."
    identity: "opaque"
    exclusive_operations: ["POST /liner-qa-packages/{liner_qa_package_id}/begin-review", "POST /liner-qa-packages/{liner_qa_package_id}/return", "POST /liner-qa-packages/{liner_qa_package_id}/approve"]
    shared_operations: ["all GET endpoints"]

  - name: SurveyorOfRecord
    description: "Licensed surveyor who flies and certifies aerial topographic surveys and voids bad ones."
    identity: "opaque"
    exclusive_operations: ["POST /aerial-surveys", "POST /aerial-surveys/{aerial_survey_id}/void"]
    shared_operations: ["all GET endpoints", "GET /landfills/{landfill_id}/remaining-life-projection"]

  - name: EnvironmentalManager
    description: "Site environmental compliance manager: rules on special-waste profiles, contracts leachate treatment, and runs the landfill-gas wellfield and surface-emission monitoring programme."
    identity: "opaque"
    exclusive_operations: ["POST /special-waste-approvals", "POST /special-waste-approvals/{special_waste_approval_id}/approve", "POST /special-waste-approvals/{special_waste_approval_id}/deny", "POST /special-waste-approvals/{special_waste_approval_id}/revoke", "POST /treatment-agreements", "POST /treatment-agreements/{treatment_agreement_id}/suspend", "POST /treatment-agreements/{treatment_agreement_id}/reinstate", "POST /gas-wells", "POST /gas-wells/{gas_well_id}/connect", "POST /gas-wells/{gas_well_id}/tune", "POST /gas-wells/{gas_well_id}/take-offline", "POST /gas-wells/{gas_well_id}/abandon", "POST /surface-emission-scans", "POST /surface-emission-scans/{surface_emission_scan_id}/resolve"]
    shared_operations: ["all GET endpoints"]

  - name: RegulatoryAgency
    description: "State solid-waste permitting authority: the only role that may authorize waste placement in a QA-certified cell."
    identity: "opaque"
    exclusive_operations: ["POST /cells/{cell_id}/authorize-waste-placement"]
    shared_operations: ["all GET endpoints", "GET /landfills/{landfill_id}/remaining-life-projection"]

  - name: FinanceOfficer
    description: "Finance and host-community contracts officer: files and certifies annual closure cost updates, posts assurance instruments, and negotiates the host community agreement. Cannot certify an estimate they filed themselves."
    identity: "opaque"
    exclusive_operations: ["POST /closure-cost-estimates", "POST /closure-cost-estimates/{closure_cost_estimate_id}/certify", "POST /closure-cost-estimates/{closure_cost_estimate_id}/fund-assurance", "POST /host-community-agreements", "POST /host-community-agreements/{host_community_agreement_id}/execute", "POST /host-community-agreements/{host_community_agreement_id}/open-amendment", "POST /host-community-agreements/{host_community_agreement_id}/execute-amendment", "POST /host-community-agreements/{host_community_agreement_id}/terminate"]
    shared_operations: ["all GET endpoints"]
