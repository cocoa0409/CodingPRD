            - *k_finding
            - *k_classify_def
            - *k_rca
            - *k_rca_validate
            - *k_finding_v
            - *k_plan
          trigger:
            - *k_plan_submit
          assert:
            - "HTTP 200"
            - "data.state == \"SUBMITTED\" and data.completed_action_count == 4"
            - "data.raw_completeness == 8.90 and data.completeness_tier == \"STRONG\""
            - "data.acceptance_score == 8.90 (late_days 0, penalty rate 0.05 applied to zero days)"
            - "a follow-up GET /root-cause-analyses/${rca_id} returns depth_score == 9.00 and recurrence_flag == false"

      - name: engagement_risk_score_caps_prior_finding_points_at_twenty
        claim_type: Constants Applied
        grounds:
          - calculations.engagement_risk_score
        distinguishing_aspect: >-
          The prior-finding term is min(20, 4 * count): 9 prior findings would be
          36 raw but is capped at 20, so AUDIT (20) + 0 + 0 + 20 = 40 with no
          load penalty and no specialization credit. 40 < 70 and AUDIT is not a
          must-select type, so eqr_required stays false — the cap must not leak
          into the EQR threshold.
        test_recipe:
          setup:
            - "Firm with a managing partner and an engagement partner holding no industry specializations."
          setup_api_calls:
            - *k_clock
            - *k_firm
            - *k_mp
            - *k_ep
