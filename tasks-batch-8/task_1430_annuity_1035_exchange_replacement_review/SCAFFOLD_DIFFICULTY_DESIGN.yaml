            - { call: "POST /cases", payload: { producer_id: "${p_id}", client_id: "${c_id}", existing_contract_id: "${k_id}", exchange_type: "FULL", new_product_code: "NP-7", new_product_surrender_years: 7, new_product_bonus_bps: 100, new_product_annual_fee_bps: 115 }, as: Producer, as_user_id: "${p_id}", captures: { case_id: $.data.id } }
            - { call: "POST /cases/${case_id}/submit", payload: {}, as: Producer, as_user_id: "${p_id}" }
            - { call: "POST /cases/${case_id}/start_review", payload: {}, as: SuitabilityReviewer, as_user_id: "rev-1" }
          trigger:
            - { call: "POST /cases/${case_id}/documents", payload: { doc_type: "REPLACEMENT_DISCLOSURE" }, as: Producer, as_user_id: "${p_id}", captures: { d_1: $.data.id, d_v1: $.data.version } }
            - { call: "POST /documents/${d_1}/reject", payload: { rationale: "illegible" }, as: SuitabilityReviewer, as_user_id: "rev-1" }
            - { call: "POST /cases/${case_id}/documents", payload: { doc_type: "REPLACEMENT_DISCLOSURE" }, as: Producer, as_user_id: "${p_id}", captures: { d_2: $.data.id } }
            - { call: "POST /documents/${d_2}/reject", payload: { rationale: "wrong client name" }, as: SuitabilityReviewer, as_user_id: "rev-1" }
            - { call: "POST /cases/${case_id}/documents", payload: { doc_type: "REPLACEMENT_DISCLOSURE" }, as: Producer, as_user_id: "${p_id}", captures: { d_3: $.data.id } }
            - { call: "POST /documents/${d_3}/verify", payload: {}, as: SuitabilityReviewer, as_user_id: "rev-1" }
          assert:
            - "First submission has revision == 1 and status SUBMITTED"
            - "Second submission has revision == 2, status SUBMITTED, rejection_reason cleared"
            - "Third submission has revision == 3"
            - "After final verify: the REPLACEMENT_DISCLOSURE document is VERIFIED with revision == 3"
            - "GET /cases/${case_id}/documents?doc_type=REPLACEMENT_DISCLOSURE returns exactly 1 current document (resubmission reopens the same document, it does not fork duplicates)"

  # ---------------------------------------------------------------------------
