      - name: business_safety_vs_business_referential_on_iv_order
        grounds:
          - validations[priority=17]
          - validations[priority=18]
          - errors.ERR_FORMULARY_CAP_EXCEEDED
          - errors.ERR_PREAUTH_REQUIRED
        distinguishing_aspect: |
          Pair = business_safety (formulary cap, priority 17) vs business_safety
          (preauth, priority 18) — same category, different priority — versus
          business_referential (priority 16 encounter state). An IV order that
          violates BOTH the per-visit cap AND the preauth requirement must
          return ERR_FORMULARY_CAP_EXCEEDED (priority 17 < 18).
        test_recipe:
          setup:
            - "Visit driven to ON_SCENE; formulary has IVF-NS-1L max_units_per_visit=2 and a separate drug IV-ABX-VANCO with max_units_per_visit=1 AND requires_physician_preauth=true."
