          cancelled at eight logical instants that straddle all four tier
          boundaries from both sides — 90 then 89 days out, 60 then 59, 30 then
          29, 7 then 6 — so an implementation using `>` instead of `>=` produces
          the wrong percentage on exactly the four inclusive days and the same
          numbers everywhere else. The bookings are never paid, which pins the
          refund/balance split at the degenerate end of the identity: refund 0
