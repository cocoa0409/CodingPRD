          rationale: "The parallel-shape claim - the two Election state dimensions changing independently and combining correctly - is exactly what that non_linear_state_machine instance drives, advancing funding PENDING->FUNDED->REVERSED while fulfillment walks ORDERED->IN_TRANSIT->REPLACEMENT_PENDING on the same row and asserting both axes after every hop."

