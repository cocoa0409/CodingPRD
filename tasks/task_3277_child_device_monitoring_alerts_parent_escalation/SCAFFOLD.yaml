    output: District
    side_effects: []

  - method: GET
    path: "/api/districts/{id}"
    description: "Get a District"
    roles: [SchoolAdmin, PlatformAdmin]
    code: 200
    input: []
    output: District
    side_effects: []

  - method: POST
    path: "/api/districts/{id}/links"
    description: "Request a district link to a child (starts PENDING_CONSENT)"
    roles: [SchoolAdmin]
