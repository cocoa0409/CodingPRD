# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER, http: 400, condition: "X-User-ID or X-User-Role header missing or invalid" }
  - { id: ERR_INSUFFICIENT_PERMISSIONS, http: 403, condition: "Role lacks permission for this operation" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Resource not found" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Malformed request body or missing required field" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "OCC expected_*_version does not match current version" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Resource not in correct lifecycle state for this transition" }
  - { id: ERR_PQR_NOT_DRAFT, http: 409, condition: "PQR must be DRAFT to approve/reject" }
  - { id: ERR_INVALID_THICKNESS_RANGE, http: 422, condition: "thickness_range_max_mm must be > thickness_range_min_mm" }
  - { id: ERR_WPS_NOT_DRAFT, http: 409, condition: "WPS must be DRAFT to approve/reject" }
  - { id: ERR_PQR_NOT_APPROVED, http: 422, condition: "Referenced PQR must be APPROVED at WPS approval" }
  - { id: ERR_WPS_PQR_PROCESS_MISMATCH, http: 422, condition: "WPS.process != PQR.process" }
  - { id: ERR_WPS_PQR_MATERIAL_MISMATCH, http: 422, condition: "WPS.base_metal_spec != PQR.base_metal_spec" }
  - { id: ERR_WPS_THICKNESS_OUTSIDE_PQR, http: 422, condition: "WPS thickness envelope not contained in PQR envelope" }
  - { id: ERR_WPS_REVISION_CONFLICT, http: 409, condition: "Another WPS with same (shop, wps_number, revision) already APPROVED" }
  - { id: ERR_SEGREGATION_OF_DUTIES, http: 403, condition: "Same user cannot perform both sides of a segregation-controlled pair (PQR review vs WPS approve; weld vs VT inspect)" }
  - { id: ERR_WPS_NOT_APPROVED, http: 422, condition: "Referenced WPS must be APPROVED and not SUPERSEDED" }
  - { id: ERR_JOINT_THICKNESS_OUTSIDE_WPS, http: 422, condition: "Joint.base_metal_thickness_mm outside WPS thickness envelope" }
  - { id: ERR_QUAL_NOT_LAPSED, http: 409, condition: "Requalify requires LAPSED status" }
  - { id: ERR_WELDER_TERMINATED, http: 422, condition: "Welder is TERMINATED" }
  - { id: ERR_WELDER_CONTINUITY_LAPSED, http: 422, condition: "Welder qualification continuity has lapsed at weld-pass time" }
  - { id: ERR_OVEN_NOT_ONLINE, http: 409, condition: "Oven must be ONLINE to issue/return" }
  - { id: ERR_OVEN_CAPACITY_EXCEEDED, http: 422, condition: "Projected oven load exceeds capacity_electrodes_kg" }
  - { id: ERR_LOT_NOT_IN_OVEN, http: 409, condition: "Lot must be IN_OVEN to issue" }
  - { id: ERR_LOT_NOT_USABLE, http: 422, condition: "Lot status not usable for this action (QUARANTINED/EXHAUSTED/CONSUMED or wrong state)" }
  - { id: ERR_LOT_NOT_QUARANTINED, http: 409, condition: "Rebake requires QUARANTINED status" }
  - { id: ERR_LOT_REBAKE_LIMIT, http: 422, condition: "Lot has already been rebaked once; further rebake forbidden" }
  - { id: ERR_INSUFFICIENT_LOT_QUANTITY, http: 422, condition: "issued_kg > lot.remaining_kg" }
  - { id: ERR_NDT_VENDOR_INVALID, http: 422, condition: "Vendor missing, not ACTIVE, or method not in supported_methods" }
  - { id: ERR_NDT_VENDOR_SLOT_CONFLICT, http: 409, condition: "Vendor slot capacity exceeded for overlapping interval" }
  - { id: ERR_INSPECTION_TOO_EARLY, http: 422, condition: "Cannot record result before scheduled_end_utc" }
  - { id: ERR_REPAIR_CYCLE_LIMIT, http: 422, condition: "Joint repair_cycle_count would exceed hard cap of 2" }
  - { id: ERR_WELDMENT_NOT_OPEN, http: 409, condition: "Weldment posture not OPEN; action blocked" }
  - { id: ERR_WELDMENT_HAS_PASSES, http: 409, condition: "Cannot cancel weldment with recorded weld passes" }
  - { id: ERR_JOINTS_NOT_WELDED_OUT, http: 409, condition: "Ship requires all joints fabrication_status == WELDED_OUT" }
  - { id: ERR_JOINTS_NOT_NDT_PASSED, http: 409, condition: "Ship requires all joints inspection_status == NDT_PASSED" }
  - { id: ERR_TRAVELER_INCOMPLETE, http: 409, condition: "One or more required traveler steps missing" }
  - { id: ERR_FIXTURE_NOT_DISPOSITIONED, http: 409, condition: "Fixture ownership disposition incomplete at ship" }
  - { id: ERR_NO_WELD_PASSES, http: 409, condition: "Weld-out requires at least one recorded weld pass" }
  - { id: ERR_INVALID_DISPOSITION, http: 422, condition: "Disposition must be REWORK | USE_AS_IS | SCRAP" }
  - { id: ERR_INVALID_NDT_METHOD, http: 422, condition: "Method must be VT | UT | RT; VT must have vendor_id == null; UT/RT must have vendor_id" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: ShopAdmin
    description: "Shop administrator — owns shop, welders, vendors, clock"
    identity: opaque
    exclusive_operations:
      - "POST /weld-shop/shops"
      - "POST /weld-shop/_clock/set_current_utc"
      - "POST /weld-shop/shops/{id}/welders"
      - "POST /weld-shop/shops/{id}/ndt-vendors"
    shared_operations:
      - "GET endpoints (Any)"

  - name: QCManager
    description: "Quality Control manager — owns PQR/WPS approval, qualifications, dispositions"
    identity: opaque
    exclusive_operations:
      - "POST .../pqrs (and approve/reject)"
      - "POST .../wps (and approve/reject)"
      - "POST .../welder-qualifications (and requalify/revoke)"
      - "POST .../joints/{id}/declare-repair"
      - "POST .../joints/{id}/rebind-wps"
      - "POST .../weldments/{id}/clear-repair-review"
      - "POST .../weldments/{id}/unfreeze"
      - "POST .../distortion-reports/{id}/disposition"
    shared_operations: ["GET endpoints (Any)"]

  - name: WeldLead
    description: "Welding lead — manages joints and fabrication workflow"
    identity: opaque
    exclusive_operations:
      - "POST .../weldments/{id}/joints"
      - "POST .../joints/{id}/start-fabrication"
      - "POST .../joints/{id}/weld-out"
    shared_operations:
      - "POST .../weldments/{id}/traveler-sign-offs (step_code ∈ {FIT_UP, WELD_OUT})"
      - "GET endpoints (Any)"

  - name: Welder
    description: "Welder — records weld passes under own identity"
    identity: "entity_backed:Welder"
    exclusive_operations:
      - "POST .../joints/{id}/weld-passes"
    shared_operations: ["GET endpoints (Any)"]

  - name: CWI
    description: "Certified Welding Inspector — VT inspection, NDT scheduling, sign-offs"
    identity: opaque
    exclusive_operations:
      - "POST .../joints/{id}/inspections"
      - "POST .../inspections/{id}/record-result"
    shared_operations:
      - "POST .../weldments/{id}/traveler-sign-offs (step_code ∈ {VT, NDT, FINAL})"
      - "GET endpoints (Any)"

  - name: MaterialController
    description: "Material/oven controller — owns ovens, lots, issues"
    identity: opaque
    exclusive_operations:
      - "POST .../ovens (and take-offline / bring-online)"
      - "POST .../consumable-lots (and rebake)"
      - "POST .../consumable-issues (and return)"
    shared_operations: ["GET endpoints (Any)"]

  - name: ProductionPlanner
    description: "Production planner — owns fixtures, orders, weldments"
    identity: opaque
    exclusive_operations:
      - "POST .../fixtures (and reserve/release)"
      - "POST .../shop-orders"
      - "POST .../shop-orders/{id}/weldments"
      - "POST .../weldments/{id}/cancel"
    shared_operations: ["GET endpoints (Any)"]

  - name: QualityInspector
    description: "Quality inspector — reports distortion, signs traveler"
    identity: opaque
    exclusive_operations:
      - "POST .../weldments/{id}/distortion-reports"
    shared_operations:
      - "POST .../weldments/{id}/traveler-sign-offs (step_code ∈ {VT, NDT})"
      - "GET endpoints (Any)"

  - name: ShippingClerk
    description: "Shipping clerk — ships weldments"
    identity: opaque
    exclusive_operations:
      - "POST .../weldments/{id}/ship"
    shared_operations: ["GET endpoints (Any)"]

  - name: Any
    description: "Any authenticated role may perform GET reads"
    identity: opaque
    exclusive_operations: []
    shared_operations:
      - "GET /weld-shop/shops/{id}"
      - "GET .../welders, .../ndt-vendors, .../ovens, .../pqrs, .../wps"
      - "GET .../welder-qualifications, .../consumable-lots, .../consumable-issues"
      - "GET .../fixtures, .../shop-orders, .../weldments, .../joints"
      - "GET .../weld-passes, .../distortion-reports, .../inspections, .../traveler-sign-offs"
