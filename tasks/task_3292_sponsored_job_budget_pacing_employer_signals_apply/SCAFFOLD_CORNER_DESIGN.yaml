# =============================================================================
# §1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# Task: task_3292_sponsored_job_budget_pacing_employer_signals_apply
#
# Breadth probe. Every testable claim the §1.1–§1.7 surface declares that
# SCAFFOLD_DIFFICULTY_DESIGN.yaml does not already exercise. Corners that §1.8
# already covers appear as `excluded_because:` stubs with no test_recipe.
# Taxonomy §/claim_type values follow references/claim-extraction-guide.md.
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:

      - name: employer_create_returns_all_declared_defaults
        claim_type: Creation
        grounds:
          - entities.Employer
          - endpoints.POST_/api/employers
        distinguishing_aspect: "An employer created from legal_name, domain and ats_provider alone comes back 201 with status ACTIVE, quality_score 100, response_rate_bps 0, balance_cents 0 and billing_status CURRENT — none of those are client-supplied."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Empty database."
          setup_api_calls:
            - call: "POST /api/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /api/employers"
              payload: { legal_name: "Corner Co", domain: "corner.example", ats_provider: "GREENHOUSE" }
              as: PlatformAdmin
              captures: { emp_e1: $.data.id }
          assert:
            - "the response status is 201 and response_type is object"
            - "Employer.${emp_e1}.status == ACTIVE and billing_status == CURRENT"
            - "Employer.${emp_e1}.quality_score == 100 and response_rate_bps == 0 and balance_cents == 0"
            - "Employer.${emp_e1}.version == 1 and the response carries non-null id and created_at"

      - name: campaign_get_returns_computed_budget_fields
        claim_type: Computed Fields
        grounds:
          - entities.Campaign.fields.spent_cents
          - entities.Campaign.fields.daily_spent_cents
          - entities.Campaign.fields.held_cents
          - endpoints.GET_/api/campaigns/{id}
        distinguishing_aspect: "A freshly created campaign reports spent_cents 0, daily_spent_cents 0, held_cents 0 and day_open_date equal to the logical day boundary 2026-09-01T00:00:00Z, all computed rather than supplied."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. One employer and one DRAFT campaign."
          setup_api_calls:
            - call: "POST /api/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/employers"
              payload: { legal_name: "Computed Co", domain: "computed.example", ats_provider: "NONE" }
              as: PlatformAdmin
              captures: { emp_e2: $.data.id }
            - call: "POST /api/campaigns"
              payload: { employer_id: "${emp_e2}", name: "Computed", pricing_model: "CPC", daily_budget_cents: 100000, total_budget_cents: 1000000 }
              as: Employer
              as_user_id: "${emp_e2}"
              captures: { camp_e2: $.data.id }
          trigger:
            - call: "GET /api/campaigns/${camp_e2}"
              payload: {}
              as: Employer
              as_user_id: "${emp_e2}"
          assert:
            - "the response status is 200"
            - "Campaign.${camp_e2}.spent_cents == 0 and daily_spent_cents == 0 and held_cents == 0"
            - "Campaign.${camp_e2}.day_open_date == \"2026-09-01T00:00:00Z\""
            - "Campaign.${camp_e2}.status == DRAFT"

      - name: job_postings_list_paginates_and_filters_by_employer
        claim_type: Listing
        grounds:
          - endpoints.GET_/api/job-postings
          - response_envelope.pagination_fields
          - response_envelope.pagination_defaults
        distinguishing_aspect: "With three postings on file, limit=2&offset=0 returns 2 rows with total_count 3 and has_more true, and offset=2 returns the last row with has_more false — the employer filter is applied before pagination."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. One employer with three postings; one posted 62 days earlier so it is EXPIRED, two posted today."
          setup_api_calls:
            - call: "POST /api/employers"
              payload: { legal_name: "Paged Co", domain: "paged.example", ats_provider: "NONE" }
              as: PlatformAdmin
              captures: { emp_e3: $.data.id }
            - call: "POST /api/_clock/set_current_utc"
              payload: { current_utc: "2026-07-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/job-postings"
              payload: { employer_id: "${emp_e3}", title: "Old Posting", location: "Fargo, ND", description_text: "Aged out.", apply_mode: "HOSTED" }
              as: Employer
              as_user_id: "${emp_e3}"
            - call: "POST /api/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/job-postings"
              payload: { employer_id: "${emp_e3}", title: "Fresh One", location: "Fargo, ND", description_text: "Fresh one.", apply_mode: "HOSTED" }
              as: Employer
              as_user_id: "${emp_e3}"
            - call: "POST /api/job-postings"
              payload: { employer_id: "${emp_e3}", title: "Fresh Two", location: "Fargo, ND", description_text: "Fresh two.", apply_mode: "HOSTED" }
              as: Employer
              as_user_id: "${emp_e3}"
          trigger:
            - call: "GET /api/job-postings?employer_id=${emp_e3}&limit=2&offset=0"
              payload: {}
              as: PlatformAdmin
          assert:
            - "the response status is 200 and response_type is array"
            - "the response returns exactly 2 rows with total_count == 3 and has_more == true"
            - "GET /api/job-postings?employer_id=${emp_e3}&limit=2&offset=2 returns exactly 1 row with has_more == false"
            - "GET /api/job-postings?employer_id=${emp_e3}&state=EXPIRED returns exactly 1 row, the Old Posting"
            - "Campaign pagination defaults apply: an omitted limit behaves as 10 and an omitted offset as 0"

      - name: campaign_get_unknown_id_returns_campaign_not_found
        claim_type: Not Found
        grounds:
          - endpoints.GET_/api/campaigns/{id}
          - errors[ERR_CAMPAIGN_NOT_FOUND]
          - validations[priority=3]
        distinguishing_aspect: "A syntactically valid but unallocated campaign id on the path produces the entity-specific 404 ERR_CAMPAIGN_NOT_FOUND, not a generic error and not 400."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. No campaign has been created."
          setup_api_calls:
            - call: "POST /api/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "GET /api/campaigns/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: PlatformAdmin
              captures: { err_e4: $.data.error_id }
          assert:
            - "the response status is 404 and error_id == ERR_CAMPAIGN_NOT_FOUND"
            - "response_type is error and data carries both error_id and message"

      - name: employer_create_missing_required_field_returns_invalid_request
        claim_type: Required Fields
        grounds:
          - entities.Employer.fields.domain
          - errors[ERR_INVALID_REQUEST]
          - validations[priority=11]
        distinguishing_aspect: "Omitting the required domain field from POST /api/employers is rejected with ERR_INVALID_REQUEST and no Employer row is created."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Empty database."
          setup_api_calls:
            - call: "POST /api/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /api/employers"
              payload: { legal_name: "No Domain Co" }
              as: PlatformAdmin
              captures: { err_e5: $.data.error_id }
          assert:
            - "the response status is 400 and error_id == ERR_INVALID_REQUEST"

      - name: job_seeker_create_defaults_location_to_null
        claim_type: Defaults
        grounds:
          - entities.JobSeeker.fields.location
          - endpoints.POST_/api/job-seekers
        distinguishing_aspect: "Omitting the optional location on POST /api/job-seekers yields location null while status is still server-set to ACTIVE."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Empty database."
          setup_api_calls:
            - call: "POST /api/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /api/job-seekers"
              payload: { email: "nodefault@seek.example", full_name: "No Location" }
              as: PlatformAdmin
              captures: { seek_e6: $.data.id }
          assert:
            - "the response status is 201"
            - "JobSeeker.${seek_e6}.location is null"
            - "JobSeeker.${seek_e6}.status == ACTIVE"

      - name: sponsored_job_creation_assigns_system_fields_ignoring_input
        claim_type: System Fields
        grounds:
          - entities.SponsoredJob.fields.version
          - entities.SponsoredJob.fields.impressions
          - endpoints.POST_/api/sponsored-jobs
        distinguishing_aspect: "A sponsored job always starts at version 1 with impressions, clicks and applications at 0 and pacing multipliers at 1.0 — these system fields are never accepted from the client."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. One employer, one ACTIVE posting, one ACTIVE campaign."
          setup_api_calls:
            - call: "POST /api/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/employers"
              payload: { legal_name: "System Co", domain: "system.example", ats_provider: "NONE" }
              as: PlatformAdmin
              captures: { emp_e7: $.data.id }
            - call: "POST /api/job-postings"
              payload: { employer_id: "${emp_e7}", title: "System Engineer", location: "Austin, TX", description_text: "System fields.", apply_mode: "HOSTED" }
              as: Employer
              as_user_id: "${emp_e7}"
              captures: { post_e7: $.data.id }
            - call: "POST /api/campaigns"
              payload: { employer_id: "${emp_e7}", name: "SY", pricing_model: "CPC", daily_budget_cents: 100000, total_budget_cents: 1000000 }
              as: Employer
              as_user_id: "${emp_e7}"
              captures: { camp_e7: $.data.id }
            - call: "POST /api/campaigns/${camp_e7}/activate"
              payload: {}
              as: Employer
              as_user_id: "${emp_e7}"
          trigger:
            - call: "POST /api/sponsored-jobs"
              payload: { campaign_id: "${camp_e7}", job_posting_id: "${post_e7}", cpc_bid_cents: 250, cpa_bid_cents: 800 }
              as: Employer
              as_user_id: "${emp_e7}"
              captures: { sj_e7: $.data.id }
          assert:
            - "the response status is 201"
            - "SponsoredJob.${sj_e7}.version == 1"
            - "SponsoredJob.${sj_e7}.impressions == 0 and clicks == 0 and applications == 0"
            - "SponsoredJob.${sj_e7}.scheduled_pacing_multiplier == 1.0 and realized_pacing_multiplier == 1.0"
            - "SponsoredJob.${sj_e7}.status == ELIGIBLE"

      - name: employer_campaigns_reverse_lookup_returns_children
        claim_type: Parent Relationships
        grounds:
          - entities.Campaign.fields.employer_id
          - endpoints.GET_/api/employers/{id}/campaigns
        distinguishing_aspect: "Two campaigns owned by one employer are both discoverable from the parent id through GET /api/employers/{id}/campaigns, and a status filter narrows the set."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. One employer with a DRAFT campaign and an ACTIVE campaign."
          setup_api_calls:
            - call: "POST /api/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/employers"
              payload: { legal_name: "Reverse Co", domain: "reverse.example", ats_provider: "NONE" }
              as: PlatformAdmin
              captures: { emp_e8: $.data.id }
            - call: "POST /api/job-postings"
              payload: { employer_id: "${emp_e8}", title: "Reverse Engineer", location: "Austin, TX", description_text: "Reverse.", apply_mode: "HOSTED" }
              as: Employer
              as_user_id: "${emp_e8}"
              captures: { post_e8: $.data.id }
            - call: "POST /api/campaigns"
              payload: { employer_id: "${emp_e8}", name: "Draft One", pricing_model: "CPC", daily_budget_cents: 100000, total_budget_cents: 1000000 }
              as: Employer
              as_user_id: "${emp_e8}"
              captures: { camp_e8a: $.data.id }
            - call: "POST /api/campaigns"
              payload: { employer_id: "${emp_e8}", name: "Live Two", pricing_model: "CPA", daily_budget_cents: 100000, total_budget_cents: 1000000 }
              as: Employer
              as_user_id: "${emp_e8}"
              captures: { camp_e8b: $.data.id }
            - call: "POST /api/campaigns/${camp_e8b}/activate"
              payload: {}
              as: Employer
              as_user_id: "${emp_e8}"
          trigger:
            - call: "GET /api/employers/${emp_e8}/campaigns"
              payload: {}
              as: PlatformAdmin
          assert:
            - "the response returns exactly 2 Campaign rows"
            - "GET /api/employers/${emp_e8}/campaigns?status=ACTIVE returns exactly 1 row, Live Two"
            - "GET /api/employers/${emp_e8}/campaigns?status=DRAFT returns exactly 1 row, Draft One"

      - name: pacing_multiplier_variant_corner_already_covered
        claim_type: Computed Fields
        grounds:
          - calculations.campaign_pacing_multiplier
        excluded_because:
          difficulty_instance: pacing_multiplier_scheduled_vs_realized_diverge_for_fresh_campaign
          rationale: "The scheduled-vs-realized divergence at a single instant is asserted as the §1.8 dual_variant_calc instance; no separate corner is needed."

  # ===========================================================================
  - section: state_machines
    instances:

      - name: campaign_activate_moves_draft_to_active
        claim_type: Valid Transition
        grounds:
          - state_machines.Campaign.DRAFT_to_ACTIVE
          - endpoints.POST_/api/campaigns/{id}/activate
        distinguishing_aspect: "Activating a DRAFT campaign moves it to ACTIVE and bumps its version, and the transition is idempotently rejected once already ACTIVE."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. One employer with one DRAFT campaign."
          setup_api_calls:
            - call: "POST /api/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/employers"
              payload: { legal_name: "Activate Co", domain: "act.example", ats_provider: "NONE" }
              as: PlatformAdmin
              captures: { emp_s1: $.data.id }
            - call: "POST /api/campaigns"
              payload: { employer_id: "${emp_s1}", name: "Act", pricing_model: "CPC", daily_budget_cents: 100000, total_budget_cents: 1000000 }
              as: Employer
              as_user_id: "${emp_s1}"
              captures: { camp_s1: $.data.id }
          trigger:
            - call: "POST /api/campaigns/${camp_s1}/activate"
              payload: {}
              as: Employer
              as_user_id: "${emp_s1}"
          assert:
            - "Campaign.${camp_s1}.status == ACTIVE"
            - "Campaign.${camp_s1}.version == 2"

      - name: campaign_activate_when_already_active_returns_invalid_state
        claim_type: Invalid Transitions
        grounds:
          - state_machines.Campaign.DRAFT_to_ACTIVE
          - errors[ERR_INVALID_STATE_TRANSITION]
        distinguishing_aspect: "Activating an already-ACTIVE campaign is not a declared transition and returns ERR_INVALID_STATE_TRANSITION, leaving status ACTIVE."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. One employer with one ACTIVE campaign."
          setup_api_calls:
            - call: "POST /api/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/employers"
              payload: { legal_name: "Double Co", domain: "dbl.example", ats_provider: "NONE" }
              as: PlatformAdmin
              captures: { emp_s2: $.data.id }
            - call: "POST /api/campaigns"
              payload: { employer_id: "${emp_s2}", name: "Dbl", pricing_model: "CPC", daily_budget_cents: 100000, total_budget_cents: 1000000 }
              as: Employer
              as_user_id: "${emp_s2}"
              captures: { camp_s2: $.data.id }
            - call: "POST /api/campaigns/${camp_s2}/activate"
              payload: {}
              as: Employer
              as_user_id: "${emp_s2}"
          trigger:
            - call: "POST /api/campaigns/${camp_s2}/activate"
              payload: {}
              as: Employer
              as_user_id: "${emp_s2}"
              captures: { err_s2: $.data.error_id }
          assert:
            - "the response status is 409 and error_id == ERR_INVALID_STATE_TRANSITION"
            - "Campaign.${camp_s2}.status stays ACTIVE"

      - name: sponsored_job_paused_when_posting_freshness_expires
        claim_type: Side Effect Execution
        grounds:
          - state_machines.JobPosting.ACTIVE_to_EXPIRED
          - state_machines.SponsoredJob.ELIGIBLE_to_PAUSED
          - calculations.posting_freshness
        distinguishing_aspect: "Advancing the logical clock past the 60-day expiry re-derives the posting to EXPIRED and, as a side effect, pauses the sponsored job that advertises it."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. One employer, one ACTIVE posting, one ACTIVE campaign, one ELIGIBLE sponsored job."
          setup_api_calls:
            - call: "POST /api/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/employers"
              payload: { legal_name: "Expire Co", domain: "exp.example", ats_provider: "NONE" }
              as: PlatformAdmin
              captures: { emp_s3: $.data.id }
            - call: "POST /api/job-postings"
              payload: { employer_id: "${emp_s3}", title: "Expiring Engineer", location: "Tulsa, OK", description_text: "Expiry side effect.", apply_mode: "HOSTED" }
              as: Employer
              as_user_id: "${emp_s3}"
              captures: { post_s3: $.data.id }
            - call: "POST /api/campaigns"
              payload: { employer_id: "${emp_s3}", name: "EX", pricing_model: "CPC", daily_budget_cents: 100000, total_budget_cents: 1000000 }
              as: Employer
              as_user_id: "${emp_s3}"
              captures: { camp_s3: $.data.id }
            - call: "POST /api/campaigns/${camp_s3}/activate"
              payload: {}
              as: Employer
              as_user_id: "${emp_s3}"
            - call: "POST /api/sponsored-jobs"
              payload: { campaign_id: "${camp_s3}", job_posting_id: "${post_s3}", cpc_bid_cents: 300, cpa_bid_cents: 900 }
              as: Employer
              as_user_id: "${emp_s3}"
              captures: { sj_s3: $.data.id }
          trigger:
            - call: "POST /api/_clock/set_current_utc"
              payload: { current_utc: "2026-11-05T00:00:00Z" }
              as: PlatformAdmin
          assert:
            - "JobPosting.${post_s3}.state == EXPIRED"
            - "SponsoredJob.${sj_s3}.status == PAUSED"
            - "Campaign.${camp_s3}.status == ACTIVE (the campaign is not paused by a posting expiry)"

      - name: application_complete_from_closed_returns_invalid_state
        claim_type: Invalid Transitions
        grounds:
          - state_machines.Application.STARTED_to_COMPLETED
          - errors[ERR_INVALID_APPLICATION_STATE]
        distinguishing_aspect: "Completing an application that was already closed is not a declared transition and returns ERR_INVALID_APPLICATION_STATE."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. One employer, one ACTIVE posting, one seeker, one application closed before completion."
          setup_api_calls:
            - call: "POST /api/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/employers"
              payload: { legal_name: "Close Co", domain: "cls.example", ats_provider: "NONE" }
              as: PlatformAdmin
              captures: { emp_s4: $.data.id }
            - call: "POST /api/job-seekers"
              payload: { email: "cls@seek.example", full_name: "Close Seeker", location: "Austin, TX" }
              as: PlatformAdmin
              captures: { seek_s4: $.data.id }
            - call: "POST /api/job-postings"
              payload: { employer_id: "${emp_s4}", title: "Close Engineer", location: "Austin, TX", description_text: "Close path.", apply_mode: "HOSTED" }
              as: Employer
              as_user_id: "${emp_s4}"
              captures: { post_s4: $.data.id }
            - call: "POST /api/applications"
              payload: { job_posting_id: "${post_s4}", job_seeker_id: "${seek_s4}" }
              as: JobSeeker
              as_user_id: "${seek_s4}"
              captures: { appl_s4: $.data.id }
            - call: "POST /api/applications/${appl_s4}/close"
              payload: {}
              as: JobSeeker
              as_user_id: "${seek_s4}"
          trigger:
            - call: "POST /api/applications/${appl_s4}/complete"
              payload: {}
              as: JobSeeker
              as_user_id: "${seek_s4}"
              captures: { err_s4: $.data.error_id }
          assert:
            - "the response status is 409 and error_id == ERR_INVALID_APPLICATION_STATE"
            - "Application.${appl_s4}.status stays CLOSED"

      - name: application_initial_state_is_started
        claim_type: Initial State
        grounds:
          - state_machines.Application
          - endpoints.POST_/api/applications
        distinguishing_aspect: "A newly started apply flow begins in STARTED and increments the posting's apply_started_count, regardless of apply_mode."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. One employer, one ACTIVE ATS_REDIRECT posting with a redirect url, one seeker."
          setup_api_calls:
            - call: "POST /api/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/employers"
              payload: { legal_name: "Start Co", domain: "str.example", ats_provider: "NONE" }
              as: PlatformAdmin
              captures: { emp_s5: $.data.id }
            - call: "POST /api/job-seekers"
              payload: { email: "str@seek.example", full_name: "Start Seeker", location: "Austin, TX" }
              as: PlatformAdmin
              captures: { seek_s5: $.data.id }
            - call: "POST /api/job-postings"
              payload: { employer_id: "${emp_s5}", title: "Start Engineer", location: "Austin, TX", description_text: "Start path.", apply_mode: "ATS_REDIRECT", apply_redirect_url: "https://ats.example/apply/1" }
              as: Employer
              as_user_id: "${emp_s5}"
              captures: { post_s5: $.data.id }
          trigger:
            - call: "POST /api/applications"
              payload: { job_posting_id: "${post_s5}", job_seeker_id: "${seek_s5}" }
              as: JobSeeker
              as_user_id: "${seek_s5}"
              captures: { appl_s5: $.data.id }
          assert:
            - "the response status is 201"
            - "Application.${appl_s5}.status == STARTED and completed_at is null"
            - "JobPosting.${post_s5}.apply_started_count == 1 and apply_completed_count == 0"

      - name: application_close_twice_returns_already_terminal
        claim_type: Terminal State Lockdown
        grounds:
          - state_machines.Application.RESPONDED_to_CLOSED
          - errors[ERR_APPLICATION_ALREADY_TERMINAL]
        distinguishing_aspect: "Once an application is CLOSED it is terminal: a second close returns ERR_APPLICATION_ALREADY_TERMINAL rather than succeeding idempotently."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. One employer, one ACTIVE posting, one seeker, one application completed then closed."
          setup_api_calls:
