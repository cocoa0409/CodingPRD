  # ===========================================================================
  # 6. ERRORS
  #
  # Table 6 of the claim-extraction guide carries no claim-type rows of its own:
  # it asks only that EVERY error code in §1.6 be triggerable. The instances
  # below close that inventory, so each one is a violation_to_error claim over a
  # group of related codes. Coverage map (49 codes):
  #   ERR_UNAUTHENTICATED / ERR_UNAUTHORIZED / ERR_PLANT_NOT_OWNED /
  #   ERR_ORDER_NOT_OWNED / ERR_SEGREGATION_OF_DUTIES ....... rbac section
  #   ERR_STALE_ALLOCATION_CYCLE_VERSION / ERR_STALE_PLANT_VERSION
  #                                          ... complexity-layers section (OCC)
  #   the 12 *_NOT_FOUND codes .......................... errors instance 1
  #   ERR_MELT_POSTURE_RESTRICTED ....................... errors instance 2
  #   ERR_FORMALDEHYDE_FREE_CLAIM_INVALID / ERR_FORMALDEHYDE_LIMIT_EXCEEDED
  #                                                       errors instance 3
  #   ERR_SPECIMEN_COUNT_INSUFFICIENT / ERR_RETEST_LIMIT_REACHED
  #                                                       errors instance 4
  #   ERR_CULLET_BATCH_NOT_STAGED / ERR_CULLET_REVERSAL_WINDOW_CLOSED
  #                                                       errors instance 5
  #   ERR_TRIM_MASS_INCONSISTENT ........................ errors instance 6
  #   ERR_EMISSIONS_PERIOD_INVALID ...................... errors instance 7
  #   ERR_CURE_INDEX_BELOW_MINIMUM ...................... errors instance 8
  #   ERR_PRODUCT_LINE_NOT_CERTIFIED .................... errors instance 9
  #   ERR_LOT_HAS_ALLOCATIONS ........................... errors instance 10
  #   ERR_BINDER_REVISION_LIMIT_REACHED ................. errors instance 11
  #   ERR_INVALID_REQUEST / ERR_INVALID_STATE / ERR_OVEN_ZONE_MISMATCH /
  #   ERR_LINE_INDEX_OUT_OF_RANGE / ERR_MELT_POSTURE_FROZEN /
  #   ERR_LOT_QUARANTINED / ERR_RUN_NOT_CONFORMING / ERR_DERATE_NOT_PERMITTED /
  #   ERR_BAG_MULTIPLE_MISMATCH / ERR_ALLOCATION_EXCEEDS_LOT_AVAILABLE /
  #   ERR_NO_ALLOCATABLE_SUPPLY / ERR_NO_ELIGIBLE_ORDERS
  #                        ... already triggered by the sections above (§1.9)
  #   ERR_BINDER_NOT_CERTIFIED / ERR_CHANGEOVER_WINDOW_CONFLICT /
  #   ERR_LINE_OCCUPANCY_CONFLICT / ERR_LAB_CAPACITY_EXCEEDED /
  #   ERR_WIDTH_CHANGE_OUT_OF_RANGE ..... excluded_because stubs (owned by §1.8)
  # ===========================================================================
  - section: errors
    instances:
      - name: every_unresolved_path_id_returns_its_own_not_found_code
