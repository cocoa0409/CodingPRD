  # ===========================================================================
  - section: calculations
    instances:
      - name: invoice_type_b_discounted_days_partial_exhaustion
        claim_type: Variant Selection
        grounds: [calculations.monthly_invoice_total, entities.ContractPlan.fields.typeb_discounted_days, entities.Residency.fields.skilled_days_used]
        distinguishing_aspect: "TYPE_B plan with typeb_discounted_days=10, skilled_days_used=0, billing 15 skilled days → 5 billable days, care_surcharge_cents == 200000 (5*40000), total == 500000."
        test_recipe:
          setup: ["ACTIVE residency on a TYPE_B plan (per_diem 40000, typeb_discounted_days 10), stepped to SKILLED with an OCCUPIED bed, skilled_days_used still 0."]
          setup_api_calls:
            - call: "POST /ccrc/communities"
              payload: { name: "TypeB", actuarial_discount_rate_bps: 0 }
              as: FinanceOfficer
              captures: { cid: $.data.id }
            - call: "POST /ccrc/contract-plans"
              payload: { community_id: "${cid}", name: "Bp", contract_type: "TYPE_B", entrance_fee_cents: 5000000, refund_plan: "DECLINING", monthly_service_fee_cents: 300000, second_person_fee_cents: 0, skilled_per_diem_cents: 40000, typeb_discounted_days: 10 }
              as: FinanceOfficer
              captures: { pid: $.data.id }
            - call: "POST /ccrc/units"
              payload: { community_id: "${cid}", unit_number: "TBI", care_level: "INDEPENDENT" }
              as: AdmissionsDirector
              captures: { uind: $.data.id }
            - call: "POST /ccrc/units"
              payload: { community_id: "${cid}", unit_number: "TBS", care_level: "SKILLED", bed_capacity: 1 }
              as: AdmissionsDirector
              captures: { usk: $.data.id }
            - call: "POST /ccrc/residents"
              payload: { community_id: "${cid}", full_name: "Bea B", date_of_birth: "1930-01-01" }
              as: AdmissionsDirector
              captures: { resd: $.data.id }
            - call: "POST /ccrc/residencies"
              payload: { community_id: "${cid}", primary_resident_id: "${resd}", contract_plan_id: "${pid}" }
              as: AdmissionsDirector
              captures: { rid: $.data.id }
            - call: "POST /ccrc/residencies/${rid}/assign-unit"
              payload: { unit_id: "${uind}" }
              as: AdmissionsDirector
              captures: { rv: $.data.version }
            - call: "POST /ccrc/residencies/${rid}/activate"
              payload: { expected_residency_version: "${rv}" }
              as: AdmissionsDirector
            - call: "POST /ccrc/bed-reservations"
              payload: { residency_id: "${rid}", unit_id: "${usk}", hold_expiry_period: 10 }
              as: CareCoordinator
              captures: { brid: $.data.id }
            - call: "POST /ccrc/bed-reservations/${brid}/occupy"
              payload: {}
              as: CareCoordinator
            - call: "POST /ccrc/care-transitions"
              payload: { residency_id: "${rid}", to_level: "ASSISTED" }
              as: CareCoordinator
              captures: { ct1: $.data.id }
            - call: "POST /ccrc/care-transitions/${ct1}/apply"
              payload: {}
              as: CareCoordinator
            - call: "POST /ccrc/care-transitions"
              payload: { residency_id: "${rid}", to_level: "SKILLED" }
              as: CareCoordinator
              captures: { ct2: $.data.id }
            - call: "POST /ccrc/care-transitions/${ct2}/apply"
              payload: {}
              as: CareCoordinator
          trigger:
            - call: "POST /ccrc/residencies/${rid}/invoices"
              payload: { skilled_days_in_period: 15 }
              as: FinanceOfficer
              captures: { care: $.data.care_surcharge_cents, total: $.data.total_cents }
          assert:
            - "MonthlyInvoice.care_surcharge_cents == 200000"
            - "MonthlyInvoice.total_cents == 500000"

      - name: occupancy_accrual_increments_months_by_advance
        claim_type: Correct Result
        grounds: [calculations.occupancy_period_accrual, entities.Residency.fields.occupied_months]
        distinguishing_aspect: "An ACTIVE residency at occupied_months 0; advancing the clock by 7 periods sets occupied_months == 7."
        test_recipe:
          setup: ["One ACTIVE residency just activated (occupied_months 0)."]
          setup_api_calls:
            - call: "POST /ccrc/communities"
