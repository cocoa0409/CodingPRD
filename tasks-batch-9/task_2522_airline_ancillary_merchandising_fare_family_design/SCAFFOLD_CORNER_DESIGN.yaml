      - name: booking_state_check_precedes_the_seat_capacity_check
        claim_type: priority_ordering
        grounds:
          - validations.priority_9
          - validations.priority_42
        excluded_because:
          difficulty_instance: booking_state_beats_seat_capacity_on_hold
          rationale: "The named 1.8 instance violates the booking-state rule and the seat-capacity rule in one request and pins ERR_BOOKING_STATE_INVALID as the answer."

      - name: missing_x_user_id_header_beats_the_role_check
        claim_type: priority_conflict
        grounds:
          - validations.priority_1
          - validations.priority_2
          - errors[ERR_MISSING_AUTH_HEADERS]
        distinguishing_aspect: "A request that both omits X-User-ID and carries a role that POST /fare-families does not accept answers with the priority-1 ERR_MISSING_AUTH_HEADERS (401), never with the priority-2 ERR_ROLE_NOT_PERMITTED (403)."
        test_recipe:
          setup:
            - "empty database; no fare family named ECO_NOPE exists"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: MerchandisingAnalyst
              as_user_id: "ma-001"
          trigger:
            - call: "POST /fare-families"
              payload: { code: "ECO_NOPE", name: "Economy Nope", cabin_class: "ECONOMY", base_fare_cents: 12000, bundle_price_cents: 14000, refundability: "NON_REFUNDABLE", change_fee_cents: 7500, boarding_priority_tier: 4 }
              as: ChannelPartner
              as_user_id: ""
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status is 401 and data.error_id == \"ERR_MISSING_AUTH_HEADERS\""
            - "the response is NOT 403 / ERR_ROLE_NOT_PERMITTED even though ChannelPartner is absent from this endpoint's roles"
            - "GET /fare-families with a valid MerchandisingAnalyst header returns total_count == 0: nothing was created"

      - name: channel_scope_violation_beats_booking_state_on_a_foreign_cancel
        claim_type: priority_conflict
        grounds:
          - validations.priority_6
          - validations.priority_9
          - errors[ERR_CHANNEL_SCOPE_VIOLATION]
        distinguishing_aspect: "A ChannelPartner from OTA_SKYDEAL cancelling an already-CANCELLED DIRECT_WEB booking violates the scope rule (priority 6) and the booking-state rule (priority 9) at once, and must be told ERR_CHANNEL_SCOPE_VIOLATION - the foreign partner must not even learn the booking's state."
        test_recipe:
          setup:
            - "channels DIRECT_WEB and OTA_SKYDEAL both exist"
            - "booking SCOPE1 belongs to DIRECT_WEB and has already been cancelled"
          setup_api_calls:
            - call: "POST /fare-families"
              payload: { code: "ECO_BARE", name: "Economy Bare", cabin_class: "ECONOMY", base_fare_cents: 12000, bundle_price_cents: 12000, refundability: "NON_REFUNDABLE", change_fee_cents: 7500, boarding_priority_tier: 4 }
              as: MerchandisingAnalyst
              as_user_id: "ma-001"
              captures: { f_bare_id: $.data.id }
            - call: "POST /distribution-channels"
              payload: { channel_code: "DIRECT_WEB", channel_type: "DIRECT", commission_bp: 0, markup_bp: 0, max_ancillary_price_cents: 20000, supported_categories: ["BAGGAGE", "SEAT", "CHANGE", "BOARDING", "ONBOARD"], parity_required: true }
              as: DistributionManager
              as_user_id: "dm-001"
              captures: { ch_direct_id: $.data.id }
            - call: "POST /distribution-channels"
              payload: { channel_code: "OTA_SKYDEAL", channel_type: "OTA", commission_bp: 900, markup_bp: 500, max_ancillary_price_cents: 6000, supported_categories: ["BAGGAGE", "SEAT", "CHANGE", "BOARDING", "ONBOARD"], parity_required: true }
              as: DistributionManager
              as_user_id: "dm-001"
              captures: { ch_ota_id: $.data.id }
            - call: "POST /flights"
              payload: { flight_no: "AC532", origin: "SFO", destination: "JFK", scheduled_departure_utc: "2026-09-01T15:00:00Z", cabin_seat_total: 120 }
              as: OperationsController
              as_user_id: "oc-001"
              captures: { fl_id: $.data.id }
            - call: "POST /bookings"
              payload: { record_locator: "SCOPE1", flight_id: "${fl_id}", fare_family_id: "${f_bare_id}", distribution_channel_id: "${ch_direct_id}", passenger_name: "Ada Lovelace" }
              as: ChannelPartner
              as_user_id: "${ch_direct_id}"
              captures: { bk_id: $.data.id }
            - call: "POST /bookings/${bk_id}/cancel"
              payload: { cancel_reason: "passenger withdrew" }
              as: ChannelPartner
              as_user_id: "${ch_direct_id}"
          trigger:
            - call: "POST /bookings/${bk_id}/cancel"
              payload: { cancel_reason: "foreign partner tries again" }
              as: ChannelPartner
              as_user_id: "${ch_ota_id}"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status is 403 and data.error_id == \"ERR_CHANNEL_SCOPE_VIOLATION\", not 409 / ERR_BOOKING_STATE_INVALID"
            - "GET /bookings/${bk_id} as DistributionManager shows booking_status == \"CANCELLED\" and version == 2"

      - name: ticket_requires_an_in_parity_publication_for_its_own_channel
        claim_type: cross_entity_validation
        grounds:
          - validations.priority_29
          - errors[ERR_FAMILY_NOT_PUBLISHED_TO_CHANNEL]
          - entities.ChannelPublication.fields.parity_state
        distinguishing_aspect: "The family is PUBLISHED and IN_PARITY on DIRECT_WEB, but the booking was sold through OTA_SKYDEAL: the ticket is refused with ERR_FAMILY_NOT_PUBLISHED_TO_CHANNEL because the publication is looked up on the (family, channel) pair, not on the family alone."
        test_recipe:
          setup:
            - "family ECO_LITE is PUBLISHED with an IN_PARITY publication on DIRECT_WEB and NO publication at all on OTA_SKYDEAL"
            - "booking PARCH1 on flight AC533 was sold through OTA_SKYDEAL, is HELD and has disclosure_state ACKNOWLEDGED"
