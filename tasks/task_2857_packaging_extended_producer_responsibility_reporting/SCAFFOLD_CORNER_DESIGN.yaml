              payload: {}
              as: ProducerComplianceOfficer
              as_user_id: "${p_o_id}"
              captures: { e_o1: $.data.error_id }
            - call: "POST /epr/producers/${p_o_id}/determine-obligation"
              payload: {}
              as: ProgramRegulator
              captures: { e_o2: $.data.error_id }
            - call: "POST /epr/registrations"
              payload: { producer_id: "${p_o_id}", state_program_id: "${sp_o_id}" }
              as: ProducerComplianceOfficer
              as_user_id: "${p_o_id}"
              captures: { e_o3: $.data.error_id }
            - call: "POST /epr/skus/${sku_o_id}/components"
              payload: { material_type: "PAPER", unit_weight_grams: 30.00, recyclability_class: "READILY_RECYCLABLE", pcr_content_pct: 0, is_reusable: false }
