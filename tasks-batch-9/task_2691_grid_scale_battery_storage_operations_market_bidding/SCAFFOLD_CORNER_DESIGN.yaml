# =============================================================================
# SCAFFOLD_CORNER_DESIGN.yaml  (§1.9 Corner Design)
# domain: grid-scale-battery-storage-operations   (task_2691)
#
# One `- section:` block per section of references/claim-extraction-guide.md,
# walked row-by-row against §1.1-§1.7 of SCAFFOLD.yaml. `claim_type:` values are
# the guide's own row labels (snake_cased) - no invented categories.
#
# Corners already carried by a §1.8 instance appear as `excluded_because:` stubs
# (name + claim_type + grounds + excluded_because, never a test_recipe); every
# cited difficulty_instance exists by name in SCAFFOLD_DIFFICULTY_DESIGN.yaml.
#
# Canonical fixture reused by most chains (created through §1.5 only):
#   A1 "Mesa Verde BESS 1"  nameplate 100.0 / power 25.0 / POI 25.0 MW, 27.5 MVA
#                           reactive 12.0 / soc 80.0 / degradation 12.00
#                           warranty throughput 40000.0 / COD 2023-08-01
#                           cycle limit 365  => rated 100.0, available 100.0,
#                           floor_mwh 10.0, free_dispatchable 70.0
# The asset `version` is re-read with `GET /storage-assets/{id}` before every
# additional `POST /soc-reservations`, because each reservation write advances it.
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  # 1. Entities
  # ===========================================================================
  - section: entities
    instances:

      - name: storage_asset_creation_returns_full_computed_envelope
        claim_type: creation
        grounds:
          - entities.StorageAsset
          - endpoints[POST /storage-assets]
          - response_envelope.success
        distinguishing_aspect: |
          Creation must return the whole derived envelope in the 201 body, not just the
          echoed inputs: soc_mwh seeded from initial_soc_mwh, rated_energy_mwh from
          nameplate x soh, available_energy_mwh, the reservation pool fields and both
          parallel state axes (safety_state NORMAL, market_state OFFLINE).
        test_recipe:
          setup:
            - "logical clock at 2026-08-01T00:00:00Z"
            - "empty database"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /storage-assets"
              payload: { name: "Mesa Verde BESS 1", nameplate_energy_mwh: 100.0, power_rating_mw: 25.0, poi_mw_limit: 25.0, poi_mva_limit: 27.5, reactive_capability_mvar: 12.0, initial_soc_mwh: 80.0, degradation_cost_usd_per_mwh: 12.00, warranty_throughput_limit_mwh: 40000.0, commercial_operation_date: "2023-08-01T00:00:00Z", cycle_limit_per_year: 365 }
              as: PlatformAdmin
              captures: { a1: $.data.id, soc: $.data.soc_mwh, rated: $.data.rated_energy_mwh, avail: $.data.available_energy_mwh, free: $.data.free_dispatchable_mwh, soh: $.data.soh_pct, res_total: $.data.reserved_mwh_total, thru: $.data.cumulative_throughput_mwh, efc: $.data.equivalent_full_cycles_ytd, safety: $.data.safety_state, market: $.data.market_state }
          assert:
            - "HTTP 201; ${a1} is a server-generated identifier"
            - "${soc} == 80.0 and ${rated} == 100.0 and ${avail} == 100.0"
            - "${free} == 70.0 (usable 80.0 - floor 10.0 - reserved 0.0)"
            - "${soh} == 100.00, ${res_total} == 0.0, ${thru} == 0.0, ${efc} == 0.0000"
            - "${safety} == \"NORMAL\" and ${market} == \"OFFLINE\" (both axes at their initial_state)"
            - "the body carries meta.api_request_id, meta.api_request_timestamp and response_type == \"object\" per response_envelope"

      - name: storage_asset_retrieval_returns_stored_state
        claim_type: retrieval
        grounds:
          - endpoints[GET /storage-assets/{id}]
          - state_machines.StorageAsset.market_state.OFFLINE_to_AVAILABLE
        distinguishing_aspect: |
          The read-back must expose the post-commission market_state and the same version the
          commission response returned - i.e. GET is not allowed to recompute or re-stamp
          version, which every OCC caller depends on.
        test_recipe:
          setup:
            - "A1 registered and commissioned"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /storage-assets"
              payload: { name: "Mesa Verde BESS 1", nameplate_energy_mwh: 100.0, power_rating_mw: 25.0, poi_mw_limit: 25.0, poi_mva_limit: 27.5, reactive_capability_mvar: 12.0, initial_soc_mwh: 80.0, degradation_cost_usd_per_mwh: 12.00, warranty_throughput_limit_mwh: 40000.0, commercial_operation_date: "2023-08-01T00:00:00Z", cycle_limit_per_year: 365 }
              as: PlatformAdmin
              captures: { a1: $.data.id }
            - call: "POST /storage-assets/${a1}/commission"
              payload: {}
              as: PlatformAdmin
              captures: { v_commission: $.data.version, m_commission: $.data.market_state }
          trigger:
            - call: "GET /storage-assets/${a1}"
              payload: {}
              as: MarketTrader
              captures: { got_id: $.data.id, got_version: $.data.version, got_market: $.data.market_state, got_soc: $.data.soc_mwh }
          assert:
            - "HTTP 200 and ${got_id} == ${a1}"
            - "${got_market} == ${m_commission} == \"AVAILABLE\""
            - "${got_version} == ${v_commission} (a read never advances version)"
            - "${got_soc} == 80.0"

      - name: market_bid_listing_paginates_with_total_count_and_has_more
        claim_type: listing
        grounds:
          - endpoints[GET /market-bids]
          - response_envelope.pagination_fields
          - response_envelope.pagination_defaults
        distinguishing_aspect: |
          Pagination is asserted against a filtered collection (asset_id + limit 1) so that
          total_count reflects the filter, not the table, and has_more flips between the
          first and second page of the same filtered set.
        test_recipe:
          setup:
            - "A1 registered and commissioned"
            - "two HELD reservations in disjoint windows, each backing one DRAFT bid of a different product"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /storage-assets"
              payload: { name: "Mesa Verde BESS 1", nameplate_energy_mwh: 100.0, power_rating_mw: 25.0, poi_mw_limit: 25.0, poi_mva_limit: 27.5, reactive_capability_mvar: 12.0, initial_soc_mwh: 80.0, degradation_cost_usd_per_mwh: 12.00, warranty_throughput_limit_mwh: 40000.0, commercial_operation_date: "2023-08-01T00:00:00Z", cycle_limit_per_year: 365 }
              as: PlatformAdmin
              captures: { a1: $.data.id }
            - call: "POST /storage-assets/${a1}/commission"
              payload: {}
              as: PlatformAdmin
              captures: { v1: $.data.version }
            - call: "POST /soc-reservations"
              payload: { asset_id: "${a1}", purpose: "ENERGY_ARBITRAGE", reserved_mwh: 20.0, window_start: "2026-08-05T00:00:00Z", window_end: "2026-08-05T08:00:00Z", expected_asset_version: "${v1}" }
              as: MarketTrader
              captures: { r1: $.data.id }
            - call: "POST /market-bids"
              payload: { asset_id: "${a1}", reservation_id: "${r1}", market_type: "DAY_AHEAD", product: "ENERGY", direction: "DISCHARGE", delivery_start: "2026-08-05T01:00:00Z", delivery_end: "2026-08-05T05:00:00Z", offer_mw: 20.0 }
              as: MarketTrader
              captures: { b1: $.data.id }
            - call: "GET /storage-assets/${a1}"
              payload: {}
              as: AssetManager
              captures: { v2: $.data.version }
            - call: "POST /soc-reservations"
              payload: { asset_id: "${a1}", purpose: "ANCILLARY", reserved_mwh: 20.0, window_start: "2026-08-20T00:00:00Z", window_end: "2026-08-20T08:00:00Z", expected_asset_version: "${v2}" }
              as: MarketTrader
              captures: { r2: $.data.id }
            - call: "POST /market-bids"
              payload: { asset_id: "${a1}", reservation_id: "${r2}", market_type: "REAL_TIME", product: "REG_UP", direction: "DISCHARGE", delivery_start: "2026-08-20T01:00:00Z", delivery_end: "2026-08-20T05:00:00Z", offer_mw: 5.0 }
              as: MarketTrader
              captures: { b2: $.data.id }
          trigger:
            - call: "GET /market-bids"
              payload: { asset_id: "${a1}", limit: 1, offset: 0 }
              as: MarketOperator
            - call: "GET /market-bids"
              payload: { asset_id: "${a1}", limit: 1, offset: 1 }
              as: MarketOperator
          assert:
            - "first page: HTTP 200, response_type == \"array\", exactly 1 element, total_count == 2, has_more == true, limit == 1, offset == 0"
            - "second page: exactly 1 element, total_count == 2, has_more == false, offset == 1"
            - "the union of the two pages is exactly {${b1}, ${b2}} with no repetition"

      - name: dispatch_instruction_unknown_id_not_found
        claim_type: not_found
        grounds:
          - endpoints[GET /dispatch-instructions/{id}]
          - errors[ERR_DISPATCH_NOT_FOUND]
          - validations[priority=4]
        distinguishing_aspect: |
          Path-id existence is checked at priority 4 with the entity-specific 404 code, so a
          well-formed but unknown identifier must not degrade to a generic 400 or an empty 200.
        test_recipe:
          setup:
            - "empty database"
          setup_api_calls: []
          trigger:
            - call: "GET /dispatch-instructions/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: MarketOperator
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 404 and ${err} == \"ERR_DISPATCH_NOT_FOUND\""
            - "response_type == \"error\" and data carries a human-readable message"

      - name: storage_asset_missing_nameplate_returns_invalid_request
        claim_type: required_fields
        grounds:
          - entities.StorageAsset.fields.nameplate_energy_mwh
          - validations[priority=3]
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: |
          nameplate_energy_mwh is an input field with no default and it feeds rated_energy_mwh,
          so its absence must fail at priority 3 rather than defaulting to 0 and silently
          producing an asset whose available_energy_mwh is 0.
        test_recipe:
          setup:
            - "empty database"
          setup_api_calls: []
          trigger:
            - call: "POST /storage-assets"
              payload: { name: "No Nameplate BESS", power_rating_mw: 25.0, poi_mw_limit: 25.0, poi_mva_limit: 27.5, reactive_capability_mvar: 12.0, initial_soc_mwh: 80.0, degradation_cost_usd_per_mwh: 12.00, warranty_throughput_limit_mwh: 40000.0, commercial_operation_date: "2023-08-01T00:00:00Z", cycle_limit_per_year: 365 }
              as: PlatformAdmin
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 400 and ${err} == \"ERR_INVALID_REQUEST\""
            - "no StorageAsset row is created"

      - name: storage_asset_omitted_optionals_apply_declared_defaults
        claim_type: defaults
        grounds:
          - entities.StorageAsset.fields.round_trip_efficiency_pct
          - entities.StorageAsset.fields.soc_floor_pct
          - entities.StorageAsset.fields.soc_ceiling_pct
          - entities.StorageAsset.fields.warranty_guaranteed_soh_pct
          - entities.StorageAsset.fields.warranty_annual_fade_pct
          - entities.StorageAsset.fields.initial_cumulative_throughput_mwh
        distinguishing_aspect: |
          All six optional inputs are omitted at once; each declared default must materialise,
          because the warranty and reservation formulas read them (fade 2.5 and guaranteed 80.0
          drive expected_soh_pct, floor 10.0 drives free_dispatchable_mwh).
        test_recipe:
          setup:
            - "empty database"
          setup_api_calls: []
          trigger:
            - call: "POST /storage-assets"
              payload: { name: "Defaults BESS", nameplate_energy_mwh: 100.0, power_rating_mw: 25.0, poi_mw_limit: 25.0, poi_mva_limit: 27.5, reactive_capability_mvar: 12.0, initial_soc_mwh: 80.0, degradation_cost_usd_per_mwh: 12.00, warranty_throughput_limit_mwh: 40000.0, commercial_operation_date: "2023-08-01T00:00:00Z", cycle_limit_per_year: 365 }
              as: PlatformAdmin
              captures: { rte: $.data.round_trip_efficiency_pct, floor: $.data.soc_floor_pct, ceiling: $.data.soc_ceiling_pct, guaranteed: $.data.warranty_guaranteed_soh_pct, fade: $.data.warranty_annual_fade_pct, thru: $.data.cumulative_throughput_mwh, free: $.data.free_dispatchable_mwh }
          assert:
            - "${rte} == 88.0, ${floor} == 10.0, ${ceiling} == 95.0"
            - "${guaranteed} == 80.0 and ${fade} == 2.5"
            - "${thru} == 0.0 (initial_cumulative_throughput_mwh default 0.0)"
            - "${free} == 70.0, proving the defaulted soc_floor_pct 10.0 reached the pool formula"

      - name: soc_reservation_computed_fields_client_input_ignored
        claim_type: computed_fields
        grounds:
          - entities.SocReservation.fields.priority_rank
          - entities.SocReservation.fields.status
          - entities.SocReservation.fields.consumed_mwh
          - calculations.soc_reservation_availability
        distinguishing_aspect: |
          priority_rank is derived from purpose alone (CAPACITY 1 / ANCILLARY 2 /
          ENERGY_ARBITRAGE 3) and drives the preemption ladder, so a client that posts
          priority_rank 1 alongside purpose ENERGY_ARBITRAGE must still get rank 3 - otherwise
          a trader could buy preemption immunity through the request body.
        test_recipe:
          setup:
            - "A1 registered and commissioned"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /storage-assets"
              payload: { name: "Mesa Verde BESS 1", nameplate_energy_mwh: 100.0, power_rating_mw: 25.0, poi_mw_limit: 25.0, poi_mva_limit: 27.5, reactive_capability_mvar: 12.0, initial_soc_mwh: 80.0, degradation_cost_usd_per_mwh: 12.00, warranty_throughput_limit_mwh: 40000.0, commercial_operation_date: "2023-08-01T00:00:00Z", cycle_limit_per_year: 365 }
              as: PlatformAdmin
              captures: { a1: $.data.id }
            - call: "POST /storage-assets/${a1}/commission"
              payload: {}
              as: PlatformAdmin
              captures: { v1: $.data.version }
          trigger:
            - call: "POST /soc-reservations"
              payload: { asset_id: "${a1}", purpose: "ENERGY_ARBITRAGE", reserved_mwh: 20.0, window_start: "2026-08-05T00:00:00Z", window_end: "2026-08-05T08:00:00Z", expected_asset_version: "${v1}", priority_rank: 1, status: "CONSUMED", consumed_mwh: 20.0 }
              as: MarketTrader
              captures: { rank: $.data.priority_rank, st: $.data.status, consumed: $.data.consumed_mwh, reason: $.data.released_reason }
          assert:
            - "HTTP 201; the three unsolicited computed values are discarded"
            - "${rank} == 3 (purpose ENERGY_ARBITRAGE), not the posted 1"
            - "${st} == \"HELD\", not the posted CONSUMED"
            - "${consumed} == 0.0 and ${reason} is null"

      - name: storage_asset_system_fields_client_input_ignored
        claim_type: system_fields
        grounds:
          - entities.StorageAsset.common_fields
          - response_envelope.success
        distinguishing_aspect: |
          id, created_at, updated_at and version are server-owned; accepting a client-supplied
          version would let a caller pre-poison the OCC guard used by every
          POST /soc-reservations.
        test_recipe:
          setup:
            - "empty database"
          setup_api_calls: []
          trigger:
            - call: "POST /storage-assets"
              payload: { name: "System Fields BESS", nameplate_energy_mwh: 100.0, power_rating_mw: 25.0, poi_mw_limit: 25.0, poi_mva_limit: 27.5, reactive_capability_mvar: 12.0, initial_soc_mwh: 80.0, degradation_cost_usd_per_mwh: 12.00, warranty_throughput_limit_mwh: 40000.0, commercial_operation_date: "2023-08-01T00:00:00Z", cycle_limit_per_year: 365, id: "11111111-1111-4111-8111-111111111111", created_at: "1999-01-01T00:00:00Z", version: 99 }
              as: PlatformAdmin
              captures: { got_id: $.data.id, got_created: $.data.created_at, got_version: $.data.version }
          assert:
            - "HTTP 201"
            - "${got_id} != \"11111111-1111-4111-8111-111111111111\""
            - "${got_created} != \"1999-01-01T00:00:00Z\" (it equals the logical clock at creation)"
            - "${got_version} == 1, not the posted 99"

      - name: market_bid_unknown_product_returns_invalid_request
        claim_type: type_constraints
        grounds:
          - entities.MarketBid.fields.product
          - validations[priority=3]
          - calculations.bid_floor_price
        distinguishing_aspect: |
          product is an enum that selects a product_factor in the floor-price formula; an
          unknown member has no factor, so it must be rejected at priority 3 instead of
          falling through to a default factor of 1.00.
        test_recipe:
          setup:
            - "A1 registered and commissioned with one HELD reservation"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /storage-assets"
              payload: { name: "Mesa Verde BESS 1", nameplate_energy_mwh: 100.0, power_rating_mw: 25.0, poi_mw_limit: 25.0, poi_mva_limit: 27.5, reactive_capability_mvar: 12.0, initial_soc_mwh: 80.0, degradation_cost_usd_per_mwh: 12.00, warranty_throughput_limit_mwh: 40000.0, commercial_operation_date: "2023-08-01T00:00:00Z", cycle_limit_per_year: 365 }
              as: PlatformAdmin
              captures: { a1: $.data.id }
            - call: "POST /storage-assets/${a1}/commission"
              payload: {}
              as: PlatformAdmin
              captures: { v1: $.data.version }
            - call: "POST /soc-reservations"
              payload: { asset_id: "${a1}", purpose: "ENERGY_ARBITRAGE", reserved_mwh: 20.0, window_start: "2026-08-05T00:00:00Z", window_end: "2026-08-05T08:00:00Z", expected_asset_version: "${v1}" }
              as: MarketTrader
              captures: { r1: $.data.id }
          trigger:
            - call: "POST /market-bids"
              payload: { asset_id: "${a1}", reservation_id: "${r1}", market_type: "DAY_AHEAD", product: "FREQUENCY_TRIM", direction: "DISCHARGE", delivery_start: "2026-08-05T01:00:00Z", delivery_end: "2026-08-05T05:00:00Z", offer_mw: 20.0 }
              as: MarketTrader
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 400 and ${err} == \"ERR_INVALID_REQUEST\""
            - "no MarketBid row is created and the reservation's status stays HELD"

      - name: telemetry_sample_is_immutable_with_no_version_and_no_mutating_endpoint
        claim_type: immutability
        grounds:
          - entities.TelemetrySample.common_fields
          - endpoints[POST /telemetry-samples]
          - endpoints[GET /dispatch-instructions/{id}/telemetry-samples]
        distinguishing_aspect: |
          TelemetrySample is the one entity declared with common_fields false: it is an append-only
          measurement record, so §1.5 exposes no update, no delete and no by-id read, and the
          create response must not invent a version field that later OCC callers could latch on to.
        test_recipe:
          setup:
            - "logical clock at 2026-08-10T00:00:00Z"
            - "A1 registered and commissioned; reservation, CLEARED bid and an EXECUTING instruction of 20.0 MW"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-10T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /storage-assets"
              payload: { name: "Mesa Verde BESS 1", nameplate_energy_mwh: 100.0, power_rating_mw: 25.0, poi_mw_limit: 25.0, poi_mva_limit: 27.5, reactive_capability_mvar: 12.0, initial_soc_mwh: 80.0, degradation_cost_usd_per_mwh: 12.00, warranty_throughput_limit_mwh: 40000.0, commercial_operation_date: "2023-08-01T00:00:00Z", cycle_limit_per_year: 365 }
              as: PlatformAdmin
              captures: { a1: $.data.id }
            - call: "POST /storage-assets/${a1}/commission"
              payload: {}
              as: PlatformAdmin
              captures: { v1: $.data.version }
            - call: "POST /soc-reservations"
              payload: { asset_id: "${a1}", purpose: "ENERGY_ARBITRAGE", reserved_mwh: 40.0, window_start: "2026-08-10T12:00:00Z", window_end: "2026-08-10T20:00:00Z", expected_asset_version: "${v1}" }
              as: MarketTrader
              captures: { r1: $.data.id }
            - call: "POST /market-bids"
              payload: { asset_id: "${a1}", reservation_id: "${r1}", market_type: "DAY_AHEAD", product: "ENERGY", direction: "DISCHARGE", delivery_start: "2026-08-10T12:00:00Z", delivery_end: "2026-08-10T16:00:00Z", offer_mw: 20.0 }
              as: MarketTrader
              captures: { b1: $.data.id }
            - call: "POST /market-bids/${b1}/submit"
              payload: {}
              as: MarketTrader
            - call: "POST /market-bids/${b1}/clearing-result"
              payload: { outcome: "CLEARED", cleared_price_usd_per_mwh: 45.00, cleared_mw: 20.0 }
              as: MarketOperator
            - call: "POST /dispatch-instructions"
              payload: { bid_id: "${b1}", asset_id: "${a1}", instructed_mw: 20.0, setpoint_start: "2026-08-10T14:00:00Z", setpoint_end: "2026-08-10T15:00:00Z" }
              as: MarketOperator
              captures: { d1: $.data.id }
            - call: "POST /dispatch-instructions/${d1}/accept"
              payload: {}
              as: ControlRoomOperator
            - call: "POST /dispatch-instructions/${d1}/execute"
              payload: {}
              as: SiteController
              as_user_id: "${a1}"
          trigger:
            - call: "POST /telemetry-samples"
              payload: { dispatch_id: "${d1}", sample_index: 1, sampled_at: "2026-08-10T14:15:00Z", measured_mw: 20.0, measured_mvar: 0.0, soc_mwh_reading: 75.0, max_cell_temp_c: 30.0 }
              as: SiteController
              as_user_id: "${a1}"
              captures: { idx: $.data.sample_index, mva: $.data.apparent_mva, dev: $.data.deviation_mw, band: $.data.thermal_escalation }
          assert:
            - "HTTP 201, ${idx} == 1, ${mva} == 20.0, ${dev} == 0.0, ${band} == \"NONE\""
            - "the response body contains no `version` and no `updated_at` key (common_fields false)"
            - "§1.5 declares no PUT, PATCH, DELETE or GET-by-id route for TelemetrySample; the only read path is the paginated GET /dispatch-instructions/${d1}/telemetry-samples"

      - name: telemetry_sample_unknown_parent_dispatch_not_found
        claim_type: parent_relationships
        grounds:
          - entities.TelemetrySample.parent
          - validations[priority=5]
          - errors[ERR_DISPATCH_NOT_FOUND]
        distinguishing_aspect: |
          dispatch_id is a body FK, so it is checked at priority 5 (body-FK existence) and must
          answer 404 with the dispatch code, never a 409 about instruction state - the state check
          at priority 9 cannot run without a resolved parent.
        test_recipe:
          setup:
            - "empty database"
          setup_api_calls: []
          trigger:
            - call: "POST /telemetry-samples"
              payload: { dispatch_id: "00000000-0000-4000-8000-0000000000dd", sample_index: 1, sampled_at: "2026-08-10T14:15:00Z", measured_mw: 20.0, measured_mvar: 0.0, soc_mwh_reading: 75.0, max_cell_temp_c: 30.0 }
              as: SiteController
              as_user_id: "00000000-0000-4000-8000-0000000000aa"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 404 and ${err} == \"ERR_DISPATCH_NOT_FOUND\""
            - "no TelemetrySample row is created"

      - name: flat_topology_cross_asset_reservation_reference_rejected
        claim_type: flat
        grounds:
          - complexity_profile.entity_topology
          - validations[priority=6]
          - errors[ERR_ASSET_SCOPE_MISMATCH]
        distinguishing_aspect: |
          The topology is flat, so every child carries its own asset_id next to a sibling FK and
          the two can disagree. A bid that names asset B but reservation R(A) resolves both FKs
          successfully at priority 5 and must then be caught by the scope check at priority 6 -
          otherwise asset B could sell energy held on asset A's state of charge.
        test_recipe:
          setup:
            - "two commissioned assets A and B"
            - "reservation R_A 40.0 MWh belongs to asset A"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /storage-assets"
              payload: { name: "Scope BESS A", nameplate_energy_mwh: 100.0, power_rating_mw: 25.0, poi_mw_limit: 25.0, poi_mva_limit: 27.5, reactive_capability_mvar: 12.0, initial_soc_mwh: 80.0, degradation_cost_usd_per_mwh: 12.00, warranty_throughput_limit_mwh: 40000.0, commercial_operation_date: "2023-08-01T00:00:00Z", cycle_limit_per_year: 365 }
              as: PlatformAdmin
              captures: { aa: $.data.id }
            - call: "POST /storage-assets/${aa}/commission"
              payload: {}
              as: PlatformAdmin
              captures: { aa_v: $.data.version }
            - call: "POST /storage-assets"
              payload: { name: "Scope BESS B", nameplate_energy_mwh: 100.0, power_rating_mw: 25.0, poi_mw_limit: 25.0, poi_mva_limit: 27.5, reactive_capability_mvar: 12.0, initial_soc_mwh: 80.0, degradation_cost_usd_per_mwh: 12.00, warranty_throughput_limit_mwh: 40000.0, commercial_operation_date: "2023-08-01T00:00:00Z", cycle_limit_per_year: 365 }
              as: PlatformAdmin
              captures: { ab: $.data.id }
            - call: "POST /storage-assets/${ab}/commission"
              payload: {}
              as: PlatformAdmin
            - call: "POST /soc-reservations"
              payload: { asset_id: "${aa}", purpose: "ENERGY_ARBITRAGE", reserved_mwh: 40.0, window_start: "2026-08-10T12:00:00Z", window_end: "2026-08-10T20:00:00Z", expected_asset_version: "${aa_v}" }
              as: MarketTrader
              captures: { ra: $.data.id }
          trigger:
            - call: "POST /market-bids"
              payload: { asset_id: "${ab}", reservation_id: "${ra}", market_type: "DAY_AHEAD", product: "ENERGY", direction: "DISCHARGE", delivery_start: "2026-08-10T12:00:00Z", delivery_end: "2026-08-10T16:00:00Z", offer_mw: 20.0 }
              as: MarketTrader
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 409 and ${err} == \"ERR_ASSET_SCOPE_MISMATCH\" (priority 6, after both FKs resolved)"
            - "no MarketBid row is created; R_A stays HELD and asset B's reserved_mwh_total stays 0.0"

  # ===========================================================================
  # 2. State Machines
  # ===========================================================================
  - section: state_machines
    instances:

      - name: market_bid_starts_in_draft_initial_state
        claim_type: initial_state
        grounds:
          - state_machines.MarketBid.initial_state
          - endpoints[POST /market-bids]
          - entities.MarketBid.fields.status
        distinguishing_aspect: |
          Creation must land in DRAFT with a zero revision counter and null clearing fields even
          though the floor price is already computed - the bid is priced before it is offered, and
          nothing may pre-stamp submitted_by_user_id.
        test_recipe:
          setup:
            - "A1 registered and commissioned with one HELD reservation"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /storage-assets"
              payload: { name: "Mesa Verde BESS 1", nameplate_energy_mwh: 100.0, power_rating_mw: 25.0, poi_mw_limit: 25.0, poi_mva_limit: 27.5, reactive_capability_mvar: 12.0, initial_soc_mwh: 80.0, degradation_cost_usd_per_mwh: 12.00, warranty_throughput_limit_mwh: 40000.0, commercial_operation_date: "2023-08-01T00:00:00Z", cycle_limit_per_year: 365 }
              as: PlatformAdmin
              captures: { a1: $.data.id }
            - call: "POST /storage-assets/${a1}/commission"
              payload: {}
              as: PlatformAdmin
              captures: { v1: $.data.version }
            - call: "POST /soc-reservations"
              payload: { asset_id: "${a1}", purpose: "ENERGY_ARBITRAGE", reserved_mwh: 40.0, window_start: "2026-08-10T12:00:00Z", window_end: "2026-08-10T20:00:00Z", expected_asset_version: "${v1}" }
              as: MarketTrader
              captures: { r1: $.data.id }
          trigger:
            - call: "POST /market-bids"
              payload: { asset_id: "${a1}", reservation_id: "${r1}", market_type: "DAY_AHEAD", product: "ENERGY", direction: "DISCHARGE", delivery_start: "2026-08-10T12:00:00Z", delivery_end: "2026-08-10T16:00:00Z", offer_mw: 20.0 }
              as: MarketTrader
              captures: { st: $.data.status, rev: $.data.revision_count, cp: $.data.cleared_price_usd_per_mwh, cm: $.data.cleared_mw, sub: $.data.submitted_by_user_id, wr: $.data.withdrawn_reason }
          assert:
            - "HTTP 201 and ${st} == \"DRAFT\" (initial_state)"
            - "${rev} == 0, ${cp} is null, ${cm} is null, ${sub} is null, ${wr} is null"

      - name: withdrawn_bid_is_terminal_and_second_withdraw_rejected
        claim_type: terminal_state_lockdown
        grounds:
          - state_machines.MarketBid.terminal_states
          - endpoints[POST /market-bids/{id}/withdraw]
          - errors[ERR_BID_NOT_DRAFT]
          - validations[priority=9]
        distinguishing_aspect: |
          WITHDRAWN is the only terminal MarketBid state and it is reachable from three different
          live states, so the lockdown has to be enforced on the target state rather than on the
          path taken: a second withdraw of the same bid is a state error, not an idempotent no-op.
        test_recipe:
          setup:
            - "A1 registered and commissioned with a HELD reservation and one DRAFT bid"
            - "the bid has already been withdrawn once, so it is WITHDRAWN and its reservation is RELEASED"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /storage-assets"
              payload: { name: "Mesa Verde BESS 1", nameplate_energy_mwh: 100.0, power_rating_mw: 25.0, poi_mw_limit: 25.0, poi_mva_limit: 27.5, reactive_capability_mvar: 12.0, initial_soc_mwh: 80.0, degradation_cost_usd_per_mwh: 12.00, warranty_throughput_limit_mwh: 40000.0, commercial_operation_date: "2023-08-01T00:00:00Z", cycle_limit_per_year: 365 }
              as: PlatformAdmin
              captures: { a1: $.data.id }
            - call: "POST /storage-assets/${a1}/commission"
              payload: {}
              as: PlatformAdmin
              captures: { v1: $.data.version }
            - call: "POST /soc-reservations"
              payload: { asset_id: "${a1}", purpose: "ENERGY_ARBITRAGE", reserved_mwh: 40.0, window_start: "2026-08-10T12:00:00Z", window_end: "2026-08-10T20:00:00Z", expected_asset_version: "${v1}" }
              as: MarketTrader
              captures: { r1: $.data.id }
            - call: "POST /market-bids"
              payload: { asset_id: "${a1}", reservation_id: "${r1}", market_type: "DAY_AHEAD", product: "ENERGY", direction: "DISCHARGE", delivery_start: "2026-08-10T12:00:00Z", delivery_end: "2026-08-10T16:00:00Z", offer_mw: 20.0 }
              as: MarketTrader
              captures: { b1: $.data.id }
            - call: "POST /market-bids/${b1}/withdraw"
              payload: {}
              as: MarketTrader
              captures: { st1: $.data.status, wr1: $.data.withdrawn_reason }
          trigger:
            - call: "POST /market-bids/${b1}/withdraw"
              payload: {}
              as: MarketTrader
              captures: { err: $.data.error_id }
          assert:
            - "first withdraw: ${st1} == \"WITHDRAWN\" with ${wr1} == \"TRADER_WITHDRAWAL\""
            - "second withdraw: HTTP 409 and ${err} == \"ERR_BID_NOT_DRAFT\""
            - "the reservation ${r1} stays RELEASED with released_reason BID_WITHDRAWN and is not released twice"
            - "asset ${a1} free_dispatchable_mwh stays 70.0 - the pool is not credited a second time"

      - name: dispatch_second_accept_rejected_as_not_pending
        claim_type: idempotency
        grounds:
          - state_machines.DispatchInstruction.PENDING_to_ACCEPTED
          - endpoints[POST /dispatch-instructions/{id}/accept]
          - errors[ERR_DISPATCH_NOT_PENDING]
        distinguishing_aspect: |
          accept stamps accepted_by_user_id from the header, so a silently idempotent second
          accept would let a different control-room operator overwrite the accountable identity;
          the second call must fail on the departed state instead.
        test_recipe:
          setup:
            - "A1 commissioned, CLEARED bid, one PENDING instruction already accepted once"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-10T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /storage-assets"
              payload: { name: "Mesa Verde BESS 1", nameplate_energy_mwh: 100.0, power_rating_mw: 25.0, poi_mw_limit: 25.0, poi_mva_limit: 27.5, reactive_capability_mvar: 12.0, initial_soc_mwh: 80.0, degradation_cost_usd_per_mwh: 12.00, warranty_throughput_limit_mwh: 40000.0, commercial_operation_date: "2023-08-01T00:00:00Z", cycle_limit_per_year: 365 }
              as: PlatformAdmin
              captures: { a1: $.data.id }
            - call: "POST /storage-assets/${a1}/commission"
              payload: {}
              as: PlatformAdmin
              captures: { v1: $.data.version }
            - call: "POST /soc-reservations"
              payload: { asset_id: "${a1}", purpose: "ENERGY_ARBITRAGE", reserved_mwh: 40.0, window_start: "2026-08-10T12:00:00Z", window_end: "2026-08-10T20:00:00Z", expected_asset_version: "${v1}" }
              as: MarketTrader
              captures: { r1: $.data.id }
            - call: "POST /market-bids"
              payload: { asset_id: "${a1}", reservation_id: "${r1}", market_type: "DAY_AHEAD", product: "ENERGY", direction: "DISCHARGE", delivery_start: "2026-08-10T12:00:00Z", delivery_end: "2026-08-10T16:00:00Z", offer_mw: 20.0 }
              as: MarketTrader
              captures: { b1: $.data.id }
            - call: "POST /market-bids/${b1}/submit"
              payload: {}
              as: MarketTrader
            - call: "POST /market-bids/${b1}/clearing-result"
              payload: { outcome: "CLEARED", cleared_price_usd_per_mwh: 45.00, cleared_mw: 20.0 }
              as: MarketOperator
            - call: "POST /dispatch-instructions"
              payload: { bid_id: "${b1}", asset_id: "${a1}", instructed_mw: 20.0, setpoint_start: "2026-08-10T14:00:00Z", setpoint_end: "2026-08-10T15:00:00Z" }
              as: MarketOperator
              captures: { d1: $.data.id }
            - call: "POST /dispatch-instructions/${d1}/accept"
              payload: {}
              as: ControlRoomOperator
              as_user_id: "cro_first"
              captures: { st1: $.data.execution_status, acc1: $.data.accepted_by_user_id }
          trigger:
            - call: "POST /dispatch-instructions/${d1}/accept"
              payload: {}
              as: ControlRoomOperator
              as_user_id: "cro_second"
              captures: { err: $.data.error_id }
          assert:
            - "first accept: ${st1} == \"ACCEPTED\" and ${acc1} == \"cro_first\""
            - "second accept: HTTP 409 and ${err} == \"ERR_DISPATCH_NOT_PENDING\""
            - "accepted_by_user_id is still \"cro_first\" - the failed call left no trace"

      - name: capacity_test_complete_before_start_is_an_invalid_transition
        claim_type: invalid_transitions
        grounds:
          - state_machines.CapacityTest
          - endpoints[POST /capacity-tests/{id}/complete]
          - errors[ERR_TEST_NOT_IN_PROGRESS]
        distinguishing_aspect: |
          complete is the only trigger that runs the degradation model, so firing it from
          SCHEDULED must be refused rather than treated as start+complete: the asset's soh_pct
          and cumulative_throughput_mwh would otherwise be rewritten by a test that never ran.
        test_recipe:
          setup:
            - "A1 registered and commissioned; one SCHEDULED CapacityTest"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /storage-assets"
              payload: { name: "Mesa Verde BESS 1", nameplate_energy_mwh: 100.0, power_rating_mw: 25.0, poi_mw_limit: 25.0, poi_mva_limit: 27.5, reactive_capability_mvar: 12.0, initial_soc_mwh: 80.0, degradation_cost_usd_per_mwh: 12.00, warranty_throughput_limit_mwh: 40000.0, commercial_operation_date: "2023-08-01T00:00:00Z", cycle_limit_per_year: 365 }
              as: PlatformAdmin
              captures: { a1: $.data.id, soh0: $.data.soh_pct, cum0: $.data.cumulative_throughput_mwh }
            - call: "POST /storage-assets/${a1}/commission"
              payload: {}
              as: PlatformAdmin
            - call: "POST /capacity-tests"
              payload: { asset_id: "${a1}", scheduled_date: "2026-08-05T00:00:00Z" }
              as: AssetManager
              captures: { t1: $.data.id, t1_status: $.data.status }
          trigger:
            - call: "POST /capacity-tests/${t1}/complete"
              payload: { measured_capacity_mwh: 90.0 }
              as: SiteController
              as_user_id: "${a1}"
              captures: { err: $.data.error_id }
          assert:
            - "${t1_status} == \"SCHEDULED\" before the trigger"
            - "HTTP 409 and ${err} == \"ERR_TEST_NOT_IN_PROGRESS\""
            - "the test is still SCHEDULED with measured_capacity_mwh null and warranty_claim_triggered false"
            - "asset soh_pct is still ${soh0} == 100.00 and cumulative_throughput_mwh still ${cum0} == 0.0"

      - name: lockout_event_close_without_suppression_rejected
        claim_type: precondition_enforcement
        grounds:
          - state_machines.SafetyEvent.OPEN_to_CLOSED
          - validations[priority=14]
          - errors[ERR_SUPPRESSION_NOT_DISCHARGED]
        distinguishing_aspect: |
          The unsuppressed close branch is guarded by imposed_safety_state != LOCKOUT, so a
          THERMAL_RUNAWAY event cannot be closed straight from OPEN. The closing user differs
          from the opener so the priority-8 segregation check cannot mask the priority-14 result.
        test_recipe:
          setup:
            - "A1 registered and commissioned"
            - "one manual THERMAL_RUNAWAY SafetyEvent opened by so_open (imposed_safety_state LOCKOUT, status OPEN, suppression_discharged false)"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-10T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /storage-assets"
              payload: { name: "Mesa Verde BESS 1", nameplate_energy_mwh: 100.0, power_rating_mw: 25.0, poi_mw_limit: 25.0, poi_mva_limit: 27.5, reactive_capability_mvar: 12.0, initial_soc_mwh: 80.0, degradation_cost_usd_per_mwh: 12.00, warranty_throughput_limit_mwh: 40000.0, commercial_operation_date: "2023-08-01T00:00:00Z", cycle_limit_per_year: 365 }
              as: PlatformAdmin
              captures: { a1: $.data.id }
            - call: "POST /storage-assets/${a1}/commission"
              payload: {}
              as: PlatformAdmin
            - call: "POST /safety-events"
              payload: { asset_id: "${a1}", event_type: "THERMAL_RUNAWAY", severity: "CRITICAL", detected_max_cell_temp_c: 82.0 }
              as: SafetyOfficer
              as_user_id: "so_open"
              captures: { e1: $.data.id, imposed: $.data.imposed_safety_state, e1_status: $.data.status, discharged: $.data.suppression_discharged }
          trigger:
            - call: "POST /safety-events/${e1}/close"
              payload: { emergency_response_ack_at: "2026-08-10T01:00:00Z", emergency_ack_agencies: ["CITY_FIRE"], responder_cleared: true }
              as: SafetyOfficer
              as_user_id: "so_close"
              captures: { err: $.data.error_id }
          assert:
            - "before the trigger: ${imposed} == \"LOCKOUT\", ${e1_status} == \"OPEN\", ${discharged} == false"
            - "HTTP 409 and ${err} == \"ERR_SUPPRESSION_NOT_DISCHARGED\" (priority 14, not the priority-15 ack error - the ack was supplied)"
            - "the event stays OPEN, the asset's safety_state stays LOCKOUT and market_state stays SUSPENDED"

      - name: reservation_release_withdraws_dependent_draft_bid
        claim_type: side_effect_execution
        grounds:
          - endpoints[POST /soc-reservations/{id}/release]
          - state_machines.MarketBid.DRAFT_to_WITHDRAWN
          - state_machines.SocReservation.HELD_to_RELEASED
        distinguishing_aspect: |
          The release precondition only blocks SUBMITTED and CLEARED bids, so a DRAFT bid does not
          stop the release - it must instead be carried to WITHDRAWN by the release side effect.
          A bid left DRAFT on a RELEASED hold would be submittable later against energy that is no
          longer reserved.
        test_recipe:
          setup:
            - "A1 registered and commissioned"
            - "reservation R1 ENERGY_ARBITRAGE 40.0 MWh with one DRAFT bid B1 on it"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /storage-assets"
              payload: { name: "Mesa Verde BESS 1", nameplate_energy_mwh: 100.0, power_rating_mw: 25.0, poi_mw_limit: 25.0, poi_mva_limit: 27.5, reactive_capability_mvar: 12.0, initial_soc_mwh: 80.0, degradation_cost_usd_per_mwh: 12.00, warranty_throughput_limit_mwh: 40000.0, commercial_operation_date: "2023-08-01T00:00:00Z", cycle_limit_per_year: 365 }
              as: PlatformAdmin
              captures: { a1: $.data.id }
            - call: "POST /storage-assets/${a1}/commission"
              payload: {}
              as: PlatformAdmin
              captures: { v1: $.data.version, free0: $.data.free_dispatchable_mwh }
            - call: "POST /soc-reservations"
              payload: { asset_id: "${a1}", purpose: "ENERGY_ARBITRAGE", reserved_mwh: 40.0, window_start: "2026-08-10T12:00:00Z", window_end: "2026-08-10T20:00:00Z", expected_asset_version: "${v1}" }
              as: MarketTrader
              captures: { r1: $.data.id }
            - call: "POST /market-bids"
              payload: { asset_id: "${a1}", reservation_id: "${r1}", market_type: "DAY_AHEAD", product: "ENERGY", direction: "DISCHARGE", delivery_start: "2026-08-10T12:00:00Z", delivery_end: "2026-08-10T16:00:00Z", offer_mw: 20.0 }
              as: MarketTrader
              captures: { b1: $.data.id, b1_status0: $.data.status }
          trigger:
            - call: "POST /soc-reservations/${r1}/release"
              payload: {}
              as: MarketTrader
              captures: { r1_status: $.data.status, r1_reason: $.data.released_reason }
            - call: "GET /market-bids/${b1}"
              payload: {}
              as: MarketTrader
              captures: { b1_status: $.data.status, b1_reason: $.data.withdrawn_reason }
            - call: "GET /storage-assets/${a1}"
              payload: {}
              as: AssetManager
              captures: { free_after: $.data.free_dispatchable_mwh, reserved_after: $.data.reserved_mwh_total }
          assert:
            - "${b1_status0} == \"DRAFT\" before the release"
            - "${r1_status} == \"RELEASED\" with ${r1_reason} == \"OPERATOR_RELEASE\""
            - "${b1_status} == \"WITHDRAWN\" with ${b1_reason} == \"TRADER_WITHDRAWAL\" - the side effect fired"
            - "${reserved_after} == 0.0 and ${free_after} == ${free0} == 70.0"

      - name: cleared_bid_withdrawal_cascade_is_conditional_on_dispatch_state
        claim_type: conditional_cascade
        grounds:
          - state_machines.MarketBid.CLEARED_to_WITHDRAWN
          - state_machines.DispatchInstruction.PENDING_to_FAILED
          - endpoints[POST /market-bids/{id}/withdraw]
          - errors[ERR_DISPATCH_NOT_PENDING]
        distinguishing_aspect: |
          The same withdraw call is either a cascade or a refusal depending on the children's
          states: while one instruction sits in ACCEPTED the CLEARED -> WITHDRAWN precondition
          forbids the withdraw outright, and once that child has been driven to FAILED the very
          same call succeeds and cascades DELIVERY_VOIDED onto the still-PENDING sibling only.
          Both branches are exercised on one asset, in that order.
        test_recipe:
          setup:
            - "A1 commissioned; reservation 40.0 MWh; CLEARED bid B1 for 20.0 MW"
            - "instructions D1 (setpoint 14:00-14:30, PENDING) and D2 (setpoint 16:00-16:30, already ACCEPTED) under B1"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-10T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /storage-assets"
              payload: { name: "Mesa Verde BESS 1", nameplate_energy_mwh: 100.0, power_rating_mw: 25.0, poi_mw_limit: 25.0, poi_mva_limit: 27.5, reactive_capability_mvar: 12.0, initial_soc_mwh: 80.0, degradation_cost_usd_per_mwh: 12.00, warranty_throughput_limit_mwh: 40000.0, commercial_operation_date: "2023-08-01T00:00:00Z", cycle_limit_per_year: 365 }
              as: PlatformAdmin
              captures: { a1: $.data.id }
            - call: "POST /storage-assets/${a1}/commission"
              payload: {}
              as: PlatformAdmin
              captures: { v1: $.data.version }
            - call: "POST /soc-reservations"
              payload: { asset_id: "${a1}", purpose: "ENERGY_ARBITRAGE", reserved_mwh: 40.0, window_start: "2026-08-10T12:00:00Z", window_end: "2026-08-10T20:00:00Z", expected_asset_version: "${v1}" }
              as: MarketTrader
              captures: { r1: $.data.id }
            - call: "POST /market-bids"
              payload: { asset_id: "${a1}", reservation_id: "${r1}", market_type: "DAY_AHEAD", product: "ENERGY", direction: "DISCHARGE", delivery_start: "2026-08-10T12:00:00Z", delivery_end: "2026-08-10T18:00:00Z", offer_mw: 20.0 }
              as: MarketTrader
              captures: { b1: $.data.id }
            - call: "POST /market-bids/${b1}/submit"
              payload: {}
              as: MarketTrader
            - call: "POST /market-bids/${b1}/clearing-result"
              payload: { outcome: "CLEARED", cleared_price_usd_per_mwh: 45.00, cleared_mw: 20.0 }
              as: MarketOperator
            - call: "POST /dispatch-instructions"
              payload: { bid_id: "${b1}", asset_id: "${a1}", instructed_mw: 20.0, setpoint_start: "2026-08-10T14:00:00Z", setpoint_end: "2026-08-10T14:30:00Z" }
              as: MarketOperator
              captures: { d1: $.data.id }
            - call: "POST /dispatch-instructions"
              payload: { bid_id: "${b1}", asset_id: "${a1}", instructed_mw: 20.0, setpoint_start: "2026-08-10T16:00:00Z", setpoint_end: "2026-08-10T16:30:00Z" }
              as: MarketOperator
              captures: { d2: $.data.id }
            - call: "POST /dispatch-instructions/${d2}/accept"
              payload: {}
              as: ControlRoomOperator
              captures: { d2_status: $.data.execution_status }
          trigger:
            - call: "POST /market-bids/${b1}/withdraw"
              payload: {}
              as: MarketTrader
              captures: { err_blocked: $.data.error_id }
            - call: "POST /dispatch-instructions/${d2}/execute"
              payload: {}
              as: SiteController
              as_user_id: "${a1}"
              captures: { d2_exec: $.data.execution_status }
            - call: "POST /dispatch-instructions/${d2}/fail"
              payload: { failure_reason: "OPERATOR_FAILURE" }
              as: ControlRoomOperator
              captures: { d2_after: $.data.execution_status, d2_delivered: $.data.delivered_mwh }
            - call: "POST /market-bids/${b1}/withdraw"
              payload: {}
              as: MarketTrader
              captures: { b1_status: $.data.status }
            - call: "GET /dispatch-instructions/${d1}"
              payload: {}
              as: MarketOperator
              captures: { d1_status: $.data.execution_status, d1_reason: $.data.failure_reason }
          assert:
            - "${d2_status} == \"ACCEPTED\", so the first withdraw is refused: HTTP 409 and ${err_blocked} == \"ERR_DISPATCH_NOT_PENDING\"; B1 is still CLEARED"
            - "ACCEPTED -> EXECUTING -> FAILED is the only operator route out of ACCEPTED: ${d2_exec} == \"EXECUTING\" then ${d2_after} == \"FAILED\" with ${d2_delivered} == 0.0 (no telemetry, so no ledger movement)"
            - "with no ACCEPTED/EXECUTING/COMPLETED child left, the second withdraw succeeds: ${b1_status} == \"WITHDRAWN\""
            - "the cascade only touches the still-PENDING child: ${d1_status} == \"FAILED\" with ${d1_reason} == \"DELIVERY_VOIDED\""
            - "${d2_after} stays FAILED with failure_reason OPERATOR_FAILURE - the cascade does not overwrite an already terminal child"

      - name: capacity_obligation_assess_valid_transition_corner
        claim_type: valid_transition
        grounds:
          - state_machines.CapacityObligation.ACTIVE_to_SHORTFALL
          - state_machines.CapacityObligation.SHORTFALL_to_PENALIZED
        excluded_because:
          difficulty_instance: capacity_obligation_preliminary_versus_final_penalty
          rationale: |
            That instance already walks ACTIVE -> SHORTFALL -> PENALIZED through real assess calls
            and asserts the resulting status plus the recomputed exposure at each hop, which is
            exactly the valid-transition claim for the obligation machine.

      - name: storage_asset_parallel_axes_corner
        claim_type: parallel
        grounds:
          - complexity_profile.state_machine_shape
          - state_machines.StorageAsset.safety_state
          - state_machines.StorageAsset.market_state
        excluded_because:
          difficulty_instance: storage_asset_parallel_safety_and_market_axes_move_independently
          rationale: |
            The parallel-shape claim (independent dimensions, correct combined state) is the whole
            subject of that instance, which lands the asset in the ELEVATED x AVAILABLE combination
            no single event can produce.

      - name: market_bid_cyclic_revision_corner
        claim_type: cyclic
        grounds:
          - complexity_profile.state_machine_shape
          - state_machines.MarketBid.UNCLEARED_to_DRAFT
        excluded_because:
          difficulty_instance: market_bid_revision_cycle_reaches_revision_limit
          rationale: |
            The loop-back plus termination-condition claim is covered there: the bid cycles
            DRAFT -> SUBMITTED -> UNCLEARED -> DRAFT three times and the fourth revise is refused
            by MAX_BID_REVISIONS.

      - name: bid_submit_guarded_transition_corner
        claim_type: guarded_transitions
        grounds:
          - state_machines.MarketBid.DRAFT_to_SUBMITTED
          - state_machines.SocReservation.HELD_to_EXPIRED
        excluded_because:
          difficulty_instance: bid_submit_blocked_by_expired_reservation_state
          rationale: |
            "A -> B only if entity C is in state X" is precisely that instance: the submit is
            guarded by the backing reservation still being HELD, and it is exercised against a
            reservation the expiry sweep has moved to EXPIRED.

      - name: safety_alarm_cascade_down_corner
        claim_type: cascade_down
        grounds:
          - state_machines.StorageAsset.market_state.AVAILABLE_to_SUSPENDED
          - state_machines.MarketBid.DRAFT_to_WITHDRAWN
          - state_machines.DispatchInstruction.PENDING_to_FAILED
        excluded_because:
          difficulty_instance: telemetry_runaway_cascades_six_levels_through_bids_reservations_dispatches_and_obligation
          rationale: |
            The parent-to-children cascade, including the rule that only non-terminal children are
            touched, is verified end-to-end over six levels there.

      - name: capacity_test_cross_entity_side_effect_corner
        claim_type: cross_entity
        grounds:
          - endpoints[POST /capacity-tests/{id}/complete]
          - entities.CapacityObligation.fields.derated_committed_mw
          - entities.MarketBid.fields.offer_price_usd_per_mwh
        excluded_because:
          difficulty_instance: capacity_test_completion_cascades_four_levels_into_obligation_deration_and_draft_bid_reprice
          rationale: |
            Entity A changing entity B's state and fields is covered there: the completed test
            derates the obligation and re-prices the DRAFT bid, and both targets are asserted.

      - name: reservation_pool_ledger_sync_corner
        claim_type: ledger_sync
        grounds:
          - entities.StorageAsset.fields.reserved_mwh_total
          - entities.StorageAsset.fields.free_dispatchable_mwh
          - endpoints[POST /soc-reservations/{id}/release]
        excluded_because:
          difficulty_instance: reservation_pool_conservation_across_release
          rationale: |
            The ancestor-derived-field reconciliation with a before/after ledger check is the
            subject of that instance, which proves the 70.0 MWh pool is conserved across two
            releases with no drift.

      - name: dispatch_compensation_corner
        claim_type: compensation
        grounds:
          - state_machines.DispatchInstruction.COMPLETED_to_FAILED
          - state_machines.SocReservation.CONSUMED_to_RELEASED
        excluded_because:
          difficulty_instance: throughput_and_soc_conservation_across_dispatch_compensation
          rationale: |
            The undo-transition claim (all original side effects reversed, no drift) is asserted
            there against soc_mwh, cumulative_throughput_mwh, the scores and the reservation.

  # ===========================================================================
  # 3. Calculations
  # ===========================================================================
  - section: calculations
    instances:

      - name: telemetry_apparent_mva_and_deviation_correct_result
        claim_type: correct_result
        grounds:
          - calculations.poi_reactive_compliance
          - entities.TelemetrySample.fields.apparent_mva
          - entities.TelemetrySample.fields.deviation_mw
          - entities.TelemetrySample.fields.error_ratio
        distinguishing_aspect: |
          Known inputs 20.0 MW and 12.0 MVAr give an apparent 23.324 MVA that sits between the
          25.0 MW real-power limit and the 27.5 MVA apparent limit, so the sample is accepted only
          if the implementation actually forms the vector magnitude instead of comparing MW and
          MVAr separately.
        test_recipe:
          setup:
            - "logical clock at 2026-08-10T00:00:00Z"
            - "A1 commissioned; reservation 40.0 MWh; CLEARED bid; instruction of 20.0 MW EXECUTING"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-10T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /storage-assets"
              payload: { name: "Mesa Verde BESS 1", nameplate_energy_mwh: 100.0, power_rating_mw: 25.0, poi_mw_limit: 25.0, poi_mva_limit: 27.5, reactive_capability_mvar: 12.0, initial_soc_mwh: 80.0, degradation_cost_usd_per_mwh: 12.00, warranty_throughput_limit_mwh: 40000.0, commercial_operation_date: "2023-08-01T00:00:00Z", cycle_limit_per_year: 365 }
              as: PlatformAdmin
              captures: { a1: $.data.id }
            - call: "POST /storage-assets/${a1}/commission"
              payload: {}
              as: PlatformAdmin
              captures: { v1: $.data.version }
            - call: "POST /soc-reservations"
              payload: { asset_id: "${a1}", purpose: "ENERGY_ARBITRAGE", reserved_mwh: 40.0, window_start: "2026-08-10T12:00:00Z", window_end: "2026-08-10T20:00:00Z", expected_asset_version: "${v1}" }
              as: MarketTrader
              captures: { r1: $.data.id }
            - call: "POST /market-bids"
              payload: { asset_id: "${a1}", reservation_id: "${r1}", market_type: "DAY_AHEAD", product: "ENERGY", direction: "DISCHARGE", delivery_start: "2026-08-10T12:00:00Z", delivery_end: "2026-08-10T16:00:00Z", offer_mw: 20.0 }
              as: MarketTrader
              captures: { b1: $.data.id }
            - call: "POST /market-bids/${b1}/submit"
              payload: {}
              as: MarketTrader
            - call: "POST /market-bids/${b1}/clearing-result"
              payload: { outcome: "CLEARED", cleared_price_usd_per_mwh: 45.00, cleared_mw: 20.0 }
              as: MarketOperator
            - call: "POST /dispatch-instructions"
              payload: { bid_id: "${b1}", asset_id: "${a1}", instructed_mw: 20.0, setpoint_start: "2026-08-10T14:00:00Z", setpoint_end: "2026-08-10T15:00:00Z" }
              as: MarketOperator
              captures: { d1: $.data.id }
            - call: "POST /dispatch-instructions/${d1}/accept"
              payload: {}
              as: ControlRoomOperator
            - call: "POST /dispatch-instructions/${d1}/execute"
              payload: {}
              as: SiteController
              as_user_id: "${a1}"
          trigger:
            - call: "POST /telemetry-samples"
              payload: { dispatch_id: "${d1}", sample_index: 1, sampled_at: "2026-08-10T14:15:00Z", measured_mw: 20.0, measured_mvar: 12.0, soc_mwh_reading: 75.0, max_cell_temp_c: 40.0 }
              as: SiteController
              as_user_id: "${a1}"
              captures: { mva: $.data.apparent_mva, dev: $.data.deviation_mw, ratio: $.data.error_ratio, within: $.data.within_deadband, band: $.data.thermal_escalation }
          assert:
            - "HTTP 201 - 20.0 MW <= poi_mw_limit 25.0, 23.324 MVA <= poi_mva_limit 27.5 and |12.0| <= reactive_capability_mvar 12.0 (inclusive)"
            - "${mva} == 23.324 (round(sqrt(20.0^2 + 12.0^2), 3) = round(23.32380758, 3))"
            - "${dev} == 0.0, ${ratio} == 0.0000 and ${within} == true"
            - "${band} == \"NONE\" (40.0 < THERMAL_WARNING_TEMP_C 65.0)"

      - name: thermal_band_constant_applied_at_exact_warning_threshold
        claim_type: constants_applied
        grounds:
          - calculations.poi_reactive_compliance.constants.THERMAL_WARNING_TEMP_C
          - entities.TelemetrySample.fields.thermal_escalation
          - state_machines.StorageAsset.safety_state.NORMAL_to_ELEVATED
        distinguishing_aspect: |
          The WARNING band is entered at or above 65.0 C, so 64.99 must stay NONE with no
          SafetyEvent while 65.0 must auto-open a system event and move the safety axis to
          ELEVATED - and, because the imposed state is only ELEVATED, the market axis must NOT
          suspend. Two samples one hundredth of a degree apart separate the two behaviours.
        test_recipe:
          setup:
            - "logical clock at 2026-08-10T00:00:00Z"
            - "A1 commissioned; reservation 40.0 MWh; CLEARED bid; instruction of 20.0 MW EXECUTING"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-10T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /storage-assets"
              payload: { name: "Mesa Verde BESS 1", nameplate_energy_mwh: 100.0, power_rating_mw: 25.0, poi_mw_limit: 25.0, poi_mva_limit: 27.5, reactive_capability_mvar: 12.0, initial_soc_mwh: 80.0, degradation_cost_usd_per_mwh: 12.00, warranty_throughput_limit_mwh: 40000.0, commercial_operation_date: "2023-08-01T00:00:00Z", cycle_limit_per_year: 365 }
              as: PlatformAdmin
              captures: { a1: $.data.id }
            - call: "POST /storage-assets/${a1}/commission"
              payload: {}
              as: PlatformAdmin
              captures: { v1: $.data.version }
            - call: "POST /soc-reservations"
              payload: { asset_id: "${a1}", purpose: "ENERGY_ARBITRAGE", reserved_mwh: 40.0, window_start: "2026-08-10T12:00:00Z", window_end: "2026-08-10T20:00:00Z", expected_asset_version: "${v1}" }
              as: MarketTrader
              captures: { r1: $.data.id }
            - call: "POST /market-bids"
              payload: { asset_id: "${a1}", reservation_id: "${r1}", market_type: "DAY_AHEAD", product: "ENERGY", direction: "DISCHARGE", delivery_start: "2026-08-10T12:00:00Z", delivery_end: "2026-08-10T16:00:00Z", offer_mw: 20.0 }
              as: MarketTrader
              captures: { b1: $.data.id }
            - call: "POST /market-bids/${b1}/submit"
              payload: {}
              as: MarketTrader
            - call: "POST /market-bids/${b1}/clearing-result"
              payload: { outcome: "CLEARED", cleared_price_usd_per_mwh: 45.00, cleared_mw: 20.0 }
              as: MarketOperator
            - call: "POST /dispatch-instructions"
              payload: { bid_id: "${b1}", asset_id: "${a1}", instructed_mw: 20.0, setpoint_start: "2026-08-10T14:00:00Z", setpoint_end: "2026-08-10T15:00:00Z" }
              as: MarketOperator
              captures: { d1: $.data.id }
            - call: "POST /dispatch-instructions/${d1}/accept"
              payload: {}
              as: ControlRoomOperator
            - call: "POST /dispatch-instructions/${d1}/execute"
              payload: {}
              as: SiteController
              as_user_id: "${a1}"
          trigger:
            - call: "POST /telemetry-samples"
              payload: { dispatch_id: "${d1}", sample_index: 1, sampled_at: "2026-08-10T14:15:00Z", measured_mw: 20.0, measured_mvar: 0.0, soc_mwh_reading: 75.0, max_cell_temp_c: 64.99 }
              as: SiteController
              as_user_id: "${a1}"
              captures: { band_below: $.data.thermal_escalation }
            - call: "GET /storage-assets/${a1}"
              payload: {}
              as: SafetyOfficer
              captures: { safety_below: $.data.safety_state, market_below: $.data.market_state }
            - call: "POST /telemetry-samples"
              payload: { dispatch_id: "${d1}", sample_index: 2, sampled_at: "2026-08-10T14:30:00Z", measured_mw: 20.0, measured_mvar: 0.0, soc_mwh_reading: 70.0, max_cell_temp_c: 65.0 }
              as: SiteController
              as_user_id: "${a1}"
              captures: { band_at: $.data.thermal_escalation }
            - call: "GET /storage-assets/${a1}"
              payload: {}
              as: SafetyOfficer
              captures: { safety_at: $.data.safety_state, market_at: $.data.market_state }
            - call: "GET /safety-events"
              payload: { asset_id: "${a1}" }
              as: SafetyOfficer
          assert:
            - "64.99 C: ${band_below} == \"NONE\", ${safety_below} == \"NORMAL\", ${market_below} == \"AVAILABLE\" and GET /safety-events?asset_id=${a1} would return total_count 0 at this point"
            - "65.0 C: ${band_at} == \"WARNING\" (the band is inclusive at THERMAL_WARNING_TEMP_C)"
            - "${safety_at} == \"ELEVATED\" while ${market_at} == \"AVAILABLE\" - a WARNING derates, it does not suspend"
            - "the final GET /safety-events returns total_count 1: one auto-created event with source TELEMETRY_AUTO, opened_by_user_id \"SYSTEM\", severity WARNING, imposed_safety_state ELEVATED, source_dispatch_id ${d1} and source_sample_index 2"

      - name: error_ratio_rounding_precedes_the_deadband_comparison
        claim_type: precision
        grounds:
          - calculations.dispatch_performance_score.precision
          - calculations.poi_reactive_compliance
          - entities.TelemetrySample.fields.error_ratio
          - entities.TelemetrySample.fields.within_deadband
        distinguishing_aspect: |
          The pinned order is deviation_mw to 3 decimals, then error_ratio to 4 decimals, then the
          DEADBAND_RATIO 0.02 comparison against the rounded ratio. A sample measuring 19.5996 MW
          against a 20.0 MW instruction has a raw quotient of 0.02002 (outside the deadband) but a
          rounded deviation of 0.400 and therefore an error_ratio of exactly 0.0200 (inside it).
          Comparing the raw quotient instead drops deadband_pct from 100.00 to 50.00 and the
          composite score from 99.30 to 84.30 - a 15-point divergence from one rounding step.
        test_recipe:
          setup:
            - "logical clock at 2026-08-10T00:00:00Z"
            - "A1 commissioned; reservation 40.0 MWh; CLEARED bid; instruction of 20.0 MW EXECUTING"
            - "two on-time samples at 14:15Z and 14:30Z measuring 20.0 and 19.5996 MW"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-10T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /storage-assets"
              payload: { name: "Mesa Verde BESS 1", nameplate_energy_mwh: 100.0, power_rating_mw: 25.0, poi_mw_limit: 25.0, poi_mva_limit: 27.5, reactive_capability_mvar: 12.0, initial_soc_mwh: 80.0, degradation_cost_usd_per_mwh: 12.00, warranty_throughput_limit_mwh: 40000.0, commercial_operation_date: "2023-08-01T00:00:00Z", cycle_limit_per_year: 365 }
              as: PlatformAdmin
              captures: { a1: $.data.id }
            - call: "POST /storage-assets/${a1}/commission"
              payload: {}
              as: PlatformAdmin
              captures: { v1: $.data.version }
            - call: "POST /soc-reservations"
              payload: { asset_id: "${a1}", purpose: "ENERGY_ARBITRAGE", reserved_mwh: 40.0, window_start: "2026-08-10T12:00:00Z", window_end: "2026-08-10T20:00:00Z", expected_asset_version: "${v1}" }
              as: MarketTrader
              captures: { r1: $.data.id }
            - call: "POST /market-bids"
              payload: { asset_id: "${a1}", reservation_id: "${r1}", market_type: "DAY_AHEAD", product: "ENERGY", direction: "DISCHARGE", delivery_start: "2026-08-10T12:00:00Z", delivery_end: "2026-08-10T16:00:00Z", offer_mw: 20.0 }
              as: MarketTrader
              captures: { b1: $.data.id }
            - call: "POST /market-bids/${b1}/submit"
              payload: {}
              as: MarketTrader
            - call: "POST /market-bids/${b1}/clearing-result"
              payload: { outcome: "CLEARED", cleared_price_usd_per_mwh: 45.00, cleared_mw: 20.0 }
              as: MarketOperator
            - call: "POST /dispatch-instructions"
              payload: { bid_id: "${b1}", asset_id: "${a1}", instructed_mw: 20.0, setpoint_start: "2026-08-10T14:00:00Z", setpoint_end: "2026-08-10T15:00:00Z" }
              as: MarketOperator
              captures: { d1: $.data.id }
            - call: "POST /dispatch-instructions/${d1}/accept"
              payload: {}
              as: ControlRoomOperator
            - call: "POST /dispatch-instructions/${d1}/execute"
              payload: {}
              as: SiteController
              as_user_id: "${a1}"
            - call: "POST /telemetry-samples"
              payload: { dispatch_id: "${d1}", sample_index: 1, sampled_at: "2026-08-10T14:15:00Z", measured_mw: 20.0, measured_mvar: 0.0, soc_mwh_reading: 75.0, max_cell_temp_c: 30.0 }
              as: SiteController
              as_user_id: "${a1}"
              captures: { ratio1: $.data.error_ratio, within1: $.data.within_deadband }
            - call: "POST /telemetry-samples"
              payload: { dispatch_id: "${d1}", sample_index: 2, sampled_at: "2026-08-10T14:30:00Z", measured_mw: 19.5996, measured_mvar: 0.0, soc_mwh_reading: 70.1, max_cell_temp_c: 30.0 }
              as: SiteController
              as_user_id: "${a1}"
              captures: { dev2: $.data.deviation_mw, ratio2: $.data.error_ratio, within2: $.data.within_deadband }
          trigger:
            - call: "POST /dispatch-instructions/${d1}/complete"
              payload: {}
              as: SiteController
              as_user_id: "${a1}"
              captures: { acc: $.data.accuracy_score, db: $.data.deadband_pct, comp: $.data.composite_score, charge: $.data.non_performance_charge_usd, delivered: $.data.delivered_mwh }
            - call: "GET /storage-assets/${a1}"
              payload: {}
              as: AssetManager
              captures: { soc_after: $.data.soc_mwh, cum_after: $.data.cumulative_throughput_mwh, efc_after: $.data.equivalent_full_cycles_ytd }
          assert:
            - "sample 1: ${ratio1} == 0.0000 and ${within1} == true"
            - "sample 2: ${dev2} == 0.4 (round(|19.5996 - 20.0|, 3) = 0.400, NOT 0.4004)"
            - "sample 2: ${ratio2} == 0.02 (round(0.400 / 20.0, 4) = 0.0200) and ${within2} == true, inclusive at DEADBAND_RATIO"
            - "${acc} == 99.00 (mean rounded ratio 0.01 -> (1 - 0.01) * 100)"
            - "${db} == 100.00 - both samples inside the deadband; a raw-quotient implementation would return 50.00 here"
            - "${comp} == 99.30 (0.7 * 99.00 + 0.3 * 100.00); the raw-quotient variant would return 84.30"
            - "${charge} == 0.00 (composite above PERFORMANCE_FLOOR_SCORE 75.0)"
            - "${delivered} == 9.9 (round((20.0 + 19.5996) * 0.25, 3) = 9.900)"
            - "${soc_after} == 70.1, ${cum_after} == 9.9 and ${efc_after} == 0.0495 (9.9 / (2 * 100.0))"

      - name: availability_pct_exactly_at_tier_one_threshold_uses_unit_multiplier
        claim_type: threshold
        grounds:
          - calculations.capacity_obligation_assessment.constants.AVAILABILITY_TIER1_PCT
          - endpoints[POST /capacity-obligations/{id}/assess]
          - state_machines.CapacityObligation.ACTIVE_to_SHORTFALL
          - state_machines.CapacityObligation.SHORTFALL_to_PENALIZED
        distinguishing_aspect: |
          The tier boundary is inclusive on the upper tier, so 876.00 unavailable hours give
          availability_pct exactly 90.00 -> multiplier 1.0 -> status SHORTFALL, while nine more
          unavailable hours give 89.90 -> multiplier 1.5 -> status PENALIZED. Same obligation, same
          FINAL variant: the only thing that moved is which side of the threshold the percentage
          landed on, and the exposure jumps from 348000.00 to 562500.00.
        test_recipe:
          setup:
            - "logical clock at 2026-12-31T00:00:00Z"
            - "A1 registered and commissioned (available_energy_mwh 100.0, so 100.0 / 4.0 = 25.0 MW >= committed 20.0 MW and no capacity derate applies)"
            - "CapacityObligation: program PJM RPM, year 2026, committed 20.0 MW, availability_hours_required 8000.0, penalty rate 150.00 USD per MW-hour"
            - "876.00 unavailable hours posted"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-12-31T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /storage-assets"
              payload: { name: "Mesa Verde BESS 1", nameplate_energy_mwh: 100.0, power_rating_mw: 25.0, poi_mw_limit: 25.0, poi_mva_limit: 27.5, reactive_capability_mvar: 12.0, initial_soc_mwh: 80.0, degradation_cost_usd_per_mwh: 12.00, warranty_throughput_limit_mwh: 40000.0, commercial_operation_date: "2023-08-01T00:00:00Z", cycle_limit_per_year: 365 }
              as: PlatformAdmin
              captures: { a1: $.data.id }
            - call: "POST /storage-assets/${a1}/commission"
              payload: {}
              as: PlatformAdmin
            - call: "POST /capacity-obligations"
              payload: { asset_id: "${a1}", program_name: "PJM RPM", program_year: 2026, committed_mw: 20.0, availability_hours_required: 8000.0, penalty_rate_usd_per_mw_hour: 150.00 }
              as: AssetManager
              captures: { o1: $.data.id, o1_status0: $.data.status, o1_unavail0: $.data.unavailable_hours }
            - call: "POST /capacity-obligations/${o1}/unavailability"
              payload: { unavailable_hours_delta: 876.0, reason: "FORCED_OUTAGE" }
              as: ControlRoomOperator
              captures: { unavail1: $.data.unavailable_hours, pct_before_assess: $.data.availability_pct }
          trigger:
            - call: "POST /capacity-obligations/${o1}/assess"
              payload: { mode: "FINAL" }
              as: MarketOperator
              captures: { m1: $.data.measured_available_hours, p1: $.data.availability_pct, s1: $.data.shortfall_hours, e1: $.data.penalty_exposure_usd, st1: $.data.status, mode1: $.data.assessment_mode, der1: $.data.derated_committed_mw }
            - call: "POST /capacity-obligations/${o1}/unavailability"
              payload: { unavailable_hours_delta: 9.0, reason: "FORCED_OUTAGE" }
              as: ControlRoomOperator
              captures: { unavail2: $.data.unavailable_hours }
            - call: "POST /capacity-obligations/${o1}/assess"
              payload: { mode: "FINAL" }
              as: MarketOperator
              captures: { m2: $.data.measured_available_hours, p2: $.data.availability_pct, s2: $.data.shortfall_hours, e2: $.data.penalty_exposure_usd, st2: $.data.status }
          assert:
            - "on enrolment: ${o1_status0} == \"ACTIVE\", ${o1_unavail0} == 0.0, and ${pct_before_assess} is still null after the unavailability post - unavailability never assesses"
            - "${unavail1} == 876.0"
            - "at the threshold: ${m1} == 7884.0, ${p1} == 90.0 (round(7884.0 / 8760.0 * 100, 2)), ${s1} == 116.0"
            - "${e1} == 348000.00 (20.0 * 150.00 * 116.0 * multiplier 1.0, inclusive at AVAILABILITY_TIER1_PCT)"
            - "${st1} == \"SHORTFALL\" (shortfall > 0 with availability at or above tier 1), ${mode1} == \"FINAL\", ${der1} is null"
            - "one hundredth of a tier later: ${unavail2} == 885.0, ${m2} == 7875.0, ${p2} == 89.9, ${s2} == 125.0"
            - "${e2} == 562500.00 (20.0 * 150.00 * 125.0 * multiplier 1.5) and ${st2} == \"PENALIZED\""

      - name: reservation_waterfall_allocation_corner
        claim_type: waterfall_allocation
        grounds:
          - calculations.soc_reservation_availability
        excluded_because:
          difficulty_instance: half_open_reservation_windows_allow_adjacency_and_capacity_preempts_only_arbitrage
          rationale: |
            First-bucket-fills-first, overflow and remainder behaviour of the allocation ladder are
            all asserted there, including the CAPACITY-only preemption order.

      - name: bid_tiered_pricing_boundary_corner
        claim_type: tiered_pricing
        grounds:
          - calculations.bid_floor_price
        excluded_because:
          difficulty_instance: bid_floor_price_nonlinear_tier_knee_and_direction_branch
          rationale: |
            Each scarcity tier boundary, the warranty-adder knee and the marginal-versus-average
            behaviour across the knee are exercised there on one asset.

      - name: soh_constraint_propagation_corner
        claim_type: constraint_propagation
        grounds:
          - calculations.soh_degradation_model
        excluded_because:
          difficulty_instance: soh_model_pinned_order_sizes_remedy_against_pre_remedy_rated_energy
          rationale: |
            The propagation chain (test -> soh -> rated energy -> remedy sizing -> next test's
            denominator) and its fixed point under the pinned order are the subject of that
            instance.

      - name: performance_weighted_scoring_corner
        claim_type: weighted_scoring
        grounds:
          - calculations.dispatch_performance_score
        excluded_because:
          difficulty_instance: dispatch_performance_provisional_versus_settled_score
          rationale: |
            Weights summing to 1.0 and the score changing when the input set changes are both
            asserted there; the residual rounding-accumulation corner is covered by the precision
            instance in this section.

      - name: ledger_aggregation_corner
        claim_type: aggregation
        grounds:
          - calculations.throughput_and_soc_ledger
        excluded_because:
          difficulty_instance: throughput_and_soc_conservation_across_dispatch_compensation
          rationale: |
            Running total after add, correctness after reversal and the floor/ceiling clamps of the
            energy ledger are all asserted there.

      - name: scoring_input_set_filtering_corner
        claim_type: input_set_filtering
        grounds:
          - calculations.dispatch_performance_score
        excluded_because:
          difficulty_instance: dispatch_performance_provisional_versus_settled_score
          rationale: |
            The PROVISIONAL variant admits only samples with sampled_at <= setpoint_end, and that
            instance proves the late 15:10Z sample is excluded then included.

      - name: performance_variant_divergence_corner
        claim_type: variant_divergence
        grounds:
          - calculations.dispatch_performance_score.variants
        excluded_because:
          difficulty_instance: dispatch_performance_provisional_versus_settled_score
          rationale: |
            Same stored telemetry, two variants, asserted delta (composite 91.10 vs 74.28, charge
            0.00 vs 57.60) - the divergence claim verbatim.

      - name: obligation_variant_selection_corner
        claim_type: variant_selection
        grounds:
          - calculations.capacity_obligation_assessment.variants
        excluded_because:
          difficulty_instance: capacity_obligation_preliminary_versus_final_penalty
          rationale: |
            That instance drives the same obligation through PRELIMINARY and FINAL and shows the
            requested mode - not the calendar - selects the pro-rated or unscaled requirement.

      - name: scoring_reconciliation_corner
        claim_type: reconciliation
        grounds:
          - calculations.dispatch_performance_score.variants
          - entities.DispatchInstruction.fields.non_performance_charge_usd
        excluded_because:
          difficulty_instance: dispatch_performance_provisional_versus_settled_score
          rationale: |
            The provisional-to-final switch and the resulting charge delta written back onto the
            instruction are asserted there.

  # ===========================================================================
  # 4. Validations
  # ===========================================================================
  - section: validations
    instances:

      - name: sibling_instructions_collectively_exceed_the_reservation
        claim_type: aggregate_validation
        grounds:
          - validations[priority=34]
          - errors[ERR_DISPATCH_EXCEEDS_RESERVATION]
          - endpoints[POST /dispatch-instructions]
        distinguishing_aspect: |
          Each instruction is individually legal (20.0 MW <= cleared 20.0 MW, energy 20.0 MWh <=
          reserved 40.0 MWh) and the second one lands exactly on the 40.0 MWh hold, which must be
          accepted because the rule is inclusive. Only the third, aggregated with its live
          siblings, breaches the hold - so the check has to sum siblings rather than look at the
          incoming row alone.
        test_recipe:
          setup:
            - "logical clock at 2026-08-10T00:00:00Z"
            - "A1 commissioned; reservation R1 40.0 MWh, window 12:00Z .. 20:00Z"
            - "bid B1 DAY_AHEAD ENERGY DISCHARGE 20.0 MW, delivery 12:00Z .. 18:00Z, CLEARED at 45.00 for 20.0 MW"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-10T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /storage-assets"
              payload: { name: "Mesa Verde BESS 1", nameplate_energy_mwh: 100.0, power_rating_mw: 25.0, poi_mw_limit: 25.0, poi_mva_limit: 27.5, reactive_capability_mvar: 12.0, initial_soc_mwh: 80.0, degradation_cost_usd_per_mwh: 12.00, warranty_throughput_limit_mwh: 40000.0, commercial_operation_date: "2023-08-01T00:00:00Z", cycle_limit_per_year: 365 }
              as: PlatformAdmin
              captures: { a1: $.data.id }
            - call: "POST /storage-assets/${a1}/commission"
              payload: {}
              as: PlatformAdmin
              captures: { v1: $.data.version }
            - call: "POST /soc-reservations"
              payload: { asset_id: "${a1}", purpose: "ENERGY_ARBITRAGE", reserved_mwh: 40.0, window_start: "2026-08-10T12:00:00Z", window_end: "2026-08-10T20:00:00Z", expected_asset_version: "${v1}" }
              as: MarketTrader
              captures: { r1: $.data.id }
            - call: "POST /market-bids"
              payload: { asset_id: "${a1}", reservation_id: "${r1}", market_type: "DAY_AHEAD", product: "ENERGY", direction: "DISCHARGE", delivery_start: "2026-08-10T12:00:00Z", delivery_end: "2026-08-10T18:00:00Z", offer_mw: 20.0 }
              as: MarketTrader
              captures: { b1: $.data.id }
            - call: "POST /market-bids/${b1}/submit"
              payload: {}
              as: MarketTrader
            - call: "POST /market-bids/${b1}/clearing-result"
              payload: { outcome: "CLEARED", cleared_price_usd_per_mwh: 45.00, cleared_mw: 20.0 }
              as: MarketOperator
          trigger:
            - call: "POST /dispatch-instructions"
              payload: { bid_id: "${b1}", asset_id: "${a1}", instructed_mw: 20.0, setpoint_start: "2026-08-10T13:00:00Z", setpoint_end: "2026-08-10T14:00:00Z" }
              as: MarketOperator
              captures: { d1: $.data.id, d1_energy: $.data.expected_energy_mwh }
            - call: "POST /dispatch-instructions"
              payload: { bid_id: "${b1}", asset_id: "${a1}", instructed_mw: 20.0, setpoint_start: "2026-08-10T15:00:00Z", setpoint_end: "2026-08-10T16:00:00Z" }
              as: MarketOperator
              captures: { d2: $.data.id, d2_energy: $.data.expected_energy_mwh }
            - call: "POST /dispatch-instructions"
              payload: { bid_id: "${b1}", asset_id: "${a1}", instructed_mw: 20.0, setpoint_start: "2026-08-10T17:00:00Z", setpoint_end: "2026-08-10T17:30:00Z" }
              as: MarketOperator
              captures: { err: $.data.error_id }
          assert:
            - "first instruction: HTTP 201 with ${d1_energy} == 20.0"
            - "second instruction: HTTP 201 with ${d2_energy} == 20.0 - the running total is exactly 40.0, accepted because the hold comparison is inclusive"
            - "third instruction (10.0 MWh, total would be 50.0): HTTP 422 and ${err} == \"ERR_DISPATCH_EXCEEDS_RESERVATION\""
            - "no third DispatchInstruction row exists: GET /dispatch-instructions?bid_id=${b1} returns total_count 2 covering ${d1} and ${d2}"

      - name: derate_rule_applies_only_while_safety_state_is_elevated
        claim_type: conditional_validation
        grounds:
          - validations[priority=13]
          - errors[ERR_ASSET_DERATED]
          - calculations.poi_reactive_compliance
          - state_machines.StorageAsset.safety_state.NORMAL_to_ELEVATED
        distinguishing_aspect: |
          The same 20.0 MW offer on the same asset is legal while safety_state is NORMAL and
          illegal once a WARNING event makes it ELEVATED, and a 12.5 MW offer - exactly
          DERATE_POWER_FRACTION_PCT 50.0% of the 25.0 MW rating - is legal in both worlds. The rule
          is conditional on a flag the request body never mentions.
        test_recipe:
          setup:
            - "logical clock at 2026-08-10T00:00:00Z"
            - "A1 commissioned; reservation R1 40.0 MWh, window 12:00Z .. 20:00Z"
            - "three DRAFT DAY_AHEAD ENERGY DISCHARGE bids on R1 in non-touching windows: B1 20.0 MW 12:00-13:00, B2 20.0 MW 14:00-15:00, B3 12.5 MW 16:00-17:00"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-10T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /storage-assets"
              payload: { name: "Mesa Verde BESS 1", nameplate_energy_mwh: 100.0, power_rating_mw: 25.0, poi_mw_limit: 25.0, poi_mva_limit: 27.5, reactive_capability_mvar: 12.0, initial_soc_mwh: 80.0, degradation_cost_usd_per_mwh: 12.00, warranty_throughput_limit_mwh: 40000.0, commercial_operation_date: "2023-08-01T00:00:00Z", cycle_limit_per_year: 365 }
              as: PlatformAdmin
              captures: { a1: $.data.id }
            - call: "POST /storage-assets/${a1}/commission"
              payload: {}
              as: PlatformAdmin
              captures: { v1: $.data.version }
            - call: "POST /soc-reservations"
              payload: { asset_id: "${a1}", purpose: "ENERGY_ARBITRAGE", reserved_mwh: 40.0, window_start: "2026-08-10T12:00:00Z", window_end: "2026-08-10T20:00:00Z", expected_asset_version: "${v1}" }
              as: MarketTrader
              captures: { r1: $.data.id }
            - call: "POST /market-bids"
              payload: { asset_id: "${a1}", reservation_id: "${r1}", market_type: "DAY_AHEAD", product: "ENERGY", direction: "DISCHARGE", delivery_start: "2026-08-10T12:00:00Z", delivery_end: "2026-08-10T13:00:00Z", offer_mw: 20.0 }
              as: MarketTrader
              captures: { b1: $.data.id }
            - call: "POST /market-bids"
              payload: { asset_id: "${a1}", reservation_id: "${r1}", market_type: "DAY_AHEAD", product: "ENERGY", direction: "DISCHARGE", delivery_start: "2026-08-10T14:00:00Z", delivery_end: "2026-08-10T15:00:00Z", offer_mw: 20.0 }
              as: MarketTrader
              captures: { b2: $.data.id }
            - call: "POST /market-bids"
              payload: { asset_id: "${a1}", reservation_id: "${r1}", market_type: "DAY_AHEAD", product: "ENERGY", direction: "DISCHARGE", delivery_start: "2026-08-10T16:00:00Z", delivery_end: "2026-08-10T17:00:00Z", offer_mw: 12.5 }
              as: MarketTrader
              captures: { b3: $.data.id }
          trigger:
            - call: "POST /market-bids/${b1}/submit"
              payload: {}
              as: MarketTrader
              captures: { b1_status: $.data.status }
            - call: "POST /safety-events"
              payload: { asset_id: "${a1}", event_type: "THERMAL_ANOMALY", severity: "WARNING", detected_max_cell_temp_c: 66.0 }
              as: SafetyOfficer
              as_user_id: "so_open"
              captures: { ev: $.data.id, imposed: $.data.imposed_safety_state }
            - call: "GET /storage-assets/${a1}"
              payload: {}
              as: SafetyOfficer
              captures: { safety_now: $.data.safety_state, market_now: $.data.market_state }
            - call: "POST /market-bids/${b2}/submit"
              payload: {}
              as: MarketTrader
              captures: { err: $.data.error_id }
            - call: "POST /market-bids/${b3}/submit"
              payload: {}
              as: MarketTrader
              captures: { b3_status: $.data.status }
          assert:
            - "with safety_state NORMAL the 20.0 MW offer submits cleanly: ${b1_status} == \"SUBMITTED\""
            - "${imposed} == \"ELEVATED\", ${safety_now} == \"ELEVATED\", ${market_now} == \"AVAILABLE\" - a WARNING event derates without suspending, so B1 stays SUBMITTED"
            - "the identical 20.0 MW offer is now refused: HTTP 409 and ${err} == \"ERR_ASSET_DERATED\" (20.0 > 12.5)"
            - "at exactly 50% of the rating the offer still passes: ${b3_status} == \"SUBMITTED\" (12.5 <= 12.5, the rule is `must not exceed`)"
            - "B2 remains DRAFT and can be re-submitted after the event is closed"

      - name: bid_window_ramp_buffer_conflicts_at_fifteen_minutes_and_clears_at_sixteen
        claim_type: temporal_validation
        grounds:
          - validations[priority=21]
          - errors[ERR_BID_WINDOW_CONFLICT]
          - state_machines.MarketBid.DRAFT_to_SUBMITTED
        distinguishing_aspect: |
          Occupancy is the CLOSED interval widened by RAMP_BUFFER_MINUTES = 15 on both sides, so a
          bid starting exactly 15 minutes after the incumbent's delivery_end still touches the
          buffer and conflicts, while starting one minute later clears it. The conflict only counts
          SUBMITTED/CLEARED incumbents of the same market_type, and the DRAFT loser stays alive.
        test_recipe:
          setup:
            - "logical clock at 2026-08-10T00:00:00Z"
            - "A1 commissioned; reservation R1 40.0 MWh, window 12:00Z .. 20:00Z"
            - "B1 DAY_AHEAD ENERGY 20.0 MW delivery 12:00-13:00 already SUBMITTED, so it occupies [11:45, 13:15]"
            - "B2 delivery 13:15-14:15 and B3 delivery 13:16-14:16, both DRAFT"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-10T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /storage-assets"
              payload: { name: "Mesa Verde BESS 1", nameplate_energy_mwh: 100.0, power_rating_mw: 25.0, poi_mw_limit: 25.0, poi_mva_limit: 27.5, reactive_capability_mvar: 12.0, initial_soc_mwh: 80.0, degradation_cost_usd_per_mwh: 12.00, warranty_throughput_limit_mwh: 40000.0, commercial_operation_date: "2023-08-01T00:00:00Z", cycle_limit_per_year: 365 }
              as: PlatformAdmin
              captures: { a1: $.data.id }
            - call: "POST /storage-assets/${a1}/commission"
              payload: {}
              as: PlatformAdmin
              captures: { v1: $.data.version }
            - call: "POST /soc-reservations"
              payload: { asset_id: "${a1}", purpose: "ENERGY_ARBITRAGE", reserved_mwh: 40.0, window_start: "2026-08-10T12:00:00Z", window_end: "2026-08-10T20:00:00Z", expected_asset_version: "${v1}" }
              as: MarketTrader
              captures: { r1: $.data.id }
            - call: "POST /market-bids"
              payload: { asset_id: "${a1}", reservation_id: "${r1}", market_type: "DAY_AHEAD", product: "ENERGY", direction: "DISCHARGE", delivery_start: "2026-08-10T12:00:00Z", delivery_end: "2026-08-10T13:00:00Z", offer_mw: 20.0 }
              as: MarketTrader
              captures: { b1: $.data.id }
            - call: "POST /market-bids/${b1}/submit"
              payload: {}
              as: MarketTrader
              captures: { b1_status: $.data.status }
            - call: "POST /market-bids"
              payload: { asset_id: "${a1}", reservation_id: "${r1}", market_type: "DAY_AHEAD", product: "ENERGY", direction: "DISCHARGE", delivery_start: "2026-08-10T13:15:00Z", delivery_end: "2026-08-10T14:15:00Z", offer_mw: 20.0 }
              as: MarketTrader
              captures: { b2: $.data.id }
            - call: "POST /market-bids"
              payload: { asset_id: "${a1}", reservation_id: "${r1}", market_type: "DAY_AHEAD", product: "ENERGY", direction: "DISCHARGE", delivery_start: "2026-08-10T13:16:00Z", delivery_end: "2026-08-10T14:16:00Z", offer_mw: 20.0 }
              as: MarketTrader
              captures: { b3: $.data.id }
          trigger:
            - call: "POST /market-bids/${b2}/submit"
              payload: {}
              as: MarketTrader
              captures: { err: $.data.error_id }
            - call: "POST /market-bids/${b3}/submit"
              payload: {}
              as: MarketTrader
              captures: { b3_status: $.data.status }
          assert:
            - "${b1_status} == \"SUBMITTED\", so its occupancy is the closed [11:45, 13:15]"
            - "B2 starting at 13:15 touches that closed endpoint: HTTP 409 and ${err} == \"ERR_BID_WINDOW_CONFLICT\""
            - "B2 is still DRAFT after the refusal - a failed submit is not a withdrawal"
            - "B3 starting at 13:16 clears the buffer: ${b3_status} == \"SUBMITTED\""

      - name: body_fk_existence_runs_before_the_scope_check
        claim_type: cascading_validation
        grounds:
          - validations[priority=5]
          - validations[priority=6]
          - errors[ERR_RESERVATION_NOT_FOUND]
        distinguishing_aspect: |
          The scope check at priority 6 compares reservation.asset_id with the request's asset_id,
          which is impossible until priority 5 has resolved the row. An implementation that runs
          the scope comparison first would answer ERR_ASSET_SCOPE_MISMATCH (or crash on a null
          row) for an unknown reservation_id.
        test_recipe:
          setup:
            - "A1 registered and commissioned, no reservations at all"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-10T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /storage-assets"
              payload: { name: "Mesa Verde BESS 1", nameplate_energy_mwh: 100.0, power_rating_mw: 25.0, poi_mw_limit: 25.0, poi_mva_limit: 27.5, reactive_capability_mvar: 12.0, initial_soc_mwh: 80.0, degradation_cost_usd_per_mwh: 12.00, warranty_throughput_limit_mwh: 40000.0, commercial_operation_date: "2023-08-01T00:00:00Z", cycle_limit_per_year: 365 }
              as: PlatformAdmin
              captures: { a1: $.data.id }
            - call: "POST /storage-assets/${a1}/commission"
              payload: {}
              as: PlatformAdmin
          trigger:
            - call: "POST /market-bids"
              payload: { asset_id: "${a1}", reservation_id: "00000000-0000-4000-8000-00000000fff0", market_type: "DAY_AHEAD", product: "ENERGY", direction: "DISCHARGE", delivery_start: "2026-08-10T12:00:00Z", delivery_end: "2026-08-10T16:00:00Z", offer_mw: 20.0 }
              as: MarketTrader
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 404 and ${err} == \"ERR_RESERVATION_NOT_FOUND\", not ERR_ASSET_SCOPE_MISMATCH"
            - "the asset_id in the body resolves fine, so the failure is attributed to the unresolvable sibling FK"

      - name: duplicate_capacity_program_enrolment_rejected
        claim_type: violation_to_error
        grounds:
          - validations[priority=27]
          - errors[ERR_DUPLICATE_OBLIGATION]
          - endpoints[POST /capacity-obligations]
        distinguishing_aspect: |
          Uniqueness is on the (asset_id, program_name, program_year) triple whatever the status,
          so the same program in the next program year must still be enrollable - a naive unique
          index on (asset_id, program_name) would wrongly reject the 2027 enrolment.
        test_recipe:
          setup:
            - "A1 registered and commissioned"
            - "one CapacityObligation for PJM RPM 2026"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-10T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /storage-assets"
              payload: { name: "Mesa Verde BESS 1", nameplate_energy_mwh: 100.0, power_rating_mw: 25.0, poi_mw_limit: 25.0, poi_mva_limit: 27.5, reactive_capability_mvar: 12.0, initial_soc_mwh: 80.0, degradation_cost_usd_per_mwh: 12.00, warranty_throughput_limit_mwh: 40000.0, commercial_operation_date: "2023-08-01T00:00:00Z", cycle_limit_per_year: 365 }
              as: PlatformAdmin
              captures: { a1: $.data.id }
            - call: "POST /storage-assets/${a1}/commission"
              payload: {}
              as: PlatformAdmin
            - call: "POST /capacity-obligations"
              payload: { asset_id: "${a1}", program_name: "PJM RPM", program_year: 2026, committed_mw: 20.0, availability_hours_required: 8000.0, penalty_rate_usd_per_mw_hour: 150.00 }
              as: AssetManager
              captures: { o1: $.data.id }
          trigger:
            - call: "POST /capacity-obligations"
              payload: { asset_id: "${a1}", program_name: "PJM RPM", program_year: 2026, committed_mw: 15.0, availability_hours_required: 7000.0, penalty_rate_usd_per_mw_hour: 120.00 }
              as: MarketOperator
              captures: { err: $.data.error_id }
            - call: "POST /capacity-obligations"
              payload: { asset_id: "${a1}", program_name: "PJM RPM", program_year: 2027, committed_mw: 15.0, availability_hours_required: 7000.0, penalty_rate_usd_per_mw_hour: 120.00 }
              as: MarketOperator
              captures: { o2: $.data.id, o2_year: $.data.program_year, o2_status: $.data.status }
          assert:
            - "duplicate triple: HTTP 409 and ${err} == \"ERR_DUPLICATE_OBLIGATION\"; the committed_mw of ${o1} is unchanged at 20.0 (refused, not merged)"
            - "different program_year: HTTP 201 with ${o2_year} == 2027 and ${o2_status} == \"ACTIVE\""
            - "GET /capacity-obligations?asset_id=${a1} returns total_count 2"

      - name: claim_filed_on_day_thirty_passes_and_day_thirty_one_expires
        claim_type: satisfaction_to_pass
        grounds:
          - validations[priority=23]
          - errors[ERR_CLAIM_FILING_WINDOW_EXPIRED]
          - calculations.soh_degradation_model.constants.CLAIM_FILING_WINDOW_DAYS
        distinguishing_aspect: |
          The window is inclusive of the final day, so filing on the 30th day after the test's
          scheduled_date must SUCCEED - the satisfaction side of the rule - and only the 31st day
          fails. Both probes cite the same COMPLETED, claim-triggering test, so nothing but the
          logical clock differs between the pass and the failure.
        test_recipe:
          setup:
            - "logical clock at 2026-08-01T00:00:00Z"
            - "A3F registered and commissioned with initial_cumulative_throughput_mwh 19.8 (COD 2023-08-01)"
            - "CapacityTest T1 scheduled 2026-08-01, started and completed with measured_capacity_mwh 90.0 -> expected 92.10, measured 90.00, deficit 2.10, warranty_claim_triggered true"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /storage-assets"
              payload: { name: "Mesa Verde BESS 3F", nameplate_energy_mwh: 100.0, power_rating_mw: 25.0, poi_mw_limit: 25.0, poi_mva_limit: 27.5, reactive_capability_mvar: 12.0, initial_soc_mwh: 80.0, initial_cumulative_throughput_mwh: 19.8, degradation_cost_usd_per_mwh: 12.00, warranty_throughput_limit_mwh: 40000.0, commercial_operation_date: "2023-08-01T00:00:00Z", cycle_limit_per_year: 365 }
              as: PlatformAdmin
              captures: { a3f: $.data.id }
            - call: "POST /storage-assets/${a3f}/commission"
              payload: {}
              as: PlatformAdmin
            - call: "POST /capacity-tests"
              payload: { asset_id: "${a3f}", scheduled_date: "2026-08-01T00:00:00Z" }
              as: AssetManager
              captures: { t1: $.data.id }
            - call: "POST /capacity-tests/${t1}/start"
              payload: {}
              as: SiteController
              as_user_id: "${a3f}"
            - call: "POST /capacity-tests/${t1}/complete"
              payload: { measured_capacity_mwh: 90.0 }
              as: SiteController
              as_user_id: "${a3f}"
              captures: { t1_deficit: $.data.soh_deficit_pct, t1_trigger: $.data.warranty_claim_triggered }
          trigger:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-31T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /warranty-claims"
              payload: { asset_id: "${a3f}", capacity_test_id: "${t1}", claim_type: "CAPACITY_SHORTFALL" }
              as: AssetManager
              as_user_id: "am_filer"
              captures: { w_ok: $.data.id, w_ok_status: $.data.status, w_ok_pct: $.data.claimed_shortfall_pct }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /warranty-claims"
              payload: { asset_id: "${a3f}", capacity_test_id: "${t1}", claim_type: "CAPACITY_SHORTFALL" }
              as: AssetManager
              as_user_id: "am_filer"
              captures: { err: $.data.error_id }
          assert:
            - "the cited test qualifies: ${t1_deficit} == 2.1 and ${t1_trigger} == true"
            - "day 30 (2026-08-31): HTTP 201, ${w_ok_status} == \"DRAFT\" and ${w_ok_pct} == 2.1 - elapsed_days 30 <= CLAIM_FILING_WINDOW_DAYS 30 passes"
            - "day 31 (2026-09-01): HTTP 422 and ${err} == \"ERR_CLAIM_FILING_WINDOW_EXPIRED\""
            - "GET /warranty-claims?capacity_test_id=${t1} returns total_count 1, containing only ${w_ok}"

      - name: capacity_test_start_priority_ordering_corner
        claim_type: priority_ordering
        grounds:
          - validations[priority=9]
          - validations[priority=11]
        excluded_because:
          difficulty_instance: state_error_outranks_safety_lockout_on_capacity_test_start
          rationale: |
            Two rules violated at once with the lower-numbered priority winning is exactly what
            that instance asserts (priority 9 state error over the priority 11 lockout).

      - name: reservation_create_priority_conflict_corner
        claim_type: priority_conflict
        grounds:
          - validations[priority=12]
          - validations[priority=33]
        excluded_because:
          difficulty_instance: market_availability_outranks_soc_insufficiency_on_reservation_create
          rationale: |
            The P versus P+N conflict on POST /soc-reservations is asserted there: the priority-12
            market-availability error is returned even though the priority-33 SOC rule is violated
            by the same request.

      - name: bid_submit_cross_entity_validation_corner
        claim_type: cross_entity_validation
        grounds:
          - validations[priority=9]
          - state_machines.SocReservation.HELD_to_EXPIRED
        excluded_because:
          difficulty_instance: bid_submit_blocked_by_expired_reservation_state
          rationale: |
            Validity depending on another entity's state, tested on both the valid and the invalid
            side, is the subject of that instance.

  # ===========================================================================
  # 5. Endpoints
  # ===========================================================================
  - section: endpoints
    instances:

      - name: capacity_obligation_create_read_list_round_trip
        claim_type: standard_crud
        grounds:
          - endpoints[POST /capacity-obligations]
          - endpoints[GET /capacity-obligations/{id}]
          - endpoints[GET /capacity-obligations]
        distinguishing_aspect: |
          The obligation is the one entity with no create-time calculation at all - every derived
          field starts null or zero - so the CRUD round trip pins the pre-assessment shape that the
          assess endpoint later overwrites, and proves the program_year filter works.
        test_recipe:
          setup:
            - "A1 registered and commissioned"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-10T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /storage-assets"
              payload: { name: "Mesa Verde BESS 1", nameplate_energy_mwh: 100.0, power_rating_mw: 25.0, poi_mw_limit: 25.0, poi_mva_limit: 27.5, reactive_capability_mvar: 12.0, initial_soc_mwh: 80.0, degradation_cost_usd_per_mwh: 12.00, warranty_throughput_limit_mwh: 40000.0, commercial_operation_date: "2023-08-01T00:00:00Z", cycle_limit_per_year: 365 }
              as: PlatformAdmin
              captures: { a1: $.data.id }
            - call: "POST /storage-assets/${a1}/commission"
              payload: {}
              as: PlatformAdmin
          trigger:
            - call: "POST /capacity-obligations"
              payload: { asset_id: "${a1}", program_name: "ISO-NE FCM", program_year: 2026, committed_mw: 20.0, availability_hours_required: 8000.0, penalty_rate_usd_per_mw_hour: 150.00, obligation_duration_hours: 4.0 }
              as: AssetManager
              captures: { o1: $.data.id, o1_status: $.data.status, o1_unavail: $.data.unavailable_hours, o1_pct: $.data.availability_pct, o1_exposure: $.data.penalty_exposure_usd, o1_mode: $.data.assessment_mode, o1_der: $.data.derated_committed_mw, o1_accrual: $.data.accrual_started_at }
            - call: "GET /capacity-obligations/${o1}"
              payload: {}
              as: MarketOperator
              captures: { got_id: $.data.id, got_committed: $.data.committed_mw, got_duration: $.data.obligation_duration_hours }
            - call: "GET /capacity-obligations"
              payload: { asset_id: "${a1}", program_year: 2026 }
              as: MarketOperator
          assert:
            - "create: HTTP 201, ${o1_status} == \"ACTIVE\", ${o1_unavail} == 0.0, ${o1_exposure} == 0.0"
            - "${o1_pct} is null, ${o1_mode} is null, ${o1_der} is null, ${o1_accrual} is null - nothing is assessed at enrolment"
            - "read: ${got_id} == ${o1}, ${got_committed} == 20.0, ${got_duration} == 4.0"
            - "list: total_count == 1 and the single element is ${o1}"

      - name: commission_action_endpoint_flips_the_market_axis
        claim_type: action_endpoint
        grounds:
          - endpoints[POST /storage-assets/{id}/commission]
          - state_machines.StorageAsset.market_state.OFFLINE_to_AVAILABLE
        distinguishing_aspect: |
          commission carries no request body: its whole effect is the transition plus the version
          bump that the OCC callers then quote, and it must leave the safety axis untouched.
        test_recipe:
          setup:
            - "A1 registered, still OFFLINE"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-10T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /storage-assets"
              payload: { name: "Mesa Verde BESS 1", nameplate_energy_mwh: 100.0, power_rating_mw: 25.0, poi_mw_limit: 25.0, poi_mva_limit: 27.5, reactive_capability_mvar: 12.0, initial_soc_mwh: 80.0, degradation_cost_usd_per_mwh: 12.00, warranty_throughput_limit_mwh: 40000.0, commercial_operation_date: "2023-08-01T00:00:00Z", cycle_limit_per_year: 365 }
              as: PlatformAdmin
              captures: { a1: $.data.id, v0: $.data.version, m0: $.data.market_state }
          trigger:
            - call: "POST /storage-assets/${a1}/commission"
              payload: {}
              as: AssetManager
              captures: { m1: $.data.market_state, s1: $.data.safety_state, v1: $.data.version, reason: $.data.suspension_reason }
          assert:
            - "${m0} == \"OFFLINE\" and ${v0} == 1 before the action"
            - "HTTP 200, ${m1} == \"AVAILABLE\", ${s1} == \"NORMAL\" (the safety axis is not touched)"
            - "${reason} is null and ${v1} > ${v0} - the write advanced the OCC version"
            - "both PlatformAdmin and AssetManager may call it; this run used AssetManager"

      - name: second_commission_conditional_action_rejected
        claim_type: conditional_action
        grounds:
          - endpoints[POST /storage-assets/{id}/commission]
          - errors[ERR_ASSET_NOT_OFFLINE]
          - validations[priority=9]
        distinguishing_aspect: |
          commission is only meaningful from OFFLINE; a second call on an AVAILABLE asset must be
          refused rather than re-stamped, because re-commissioning a SUSPENDED asset would be a
          back door around the safety cascade.
        test_recipe:
          setup:
            - "A1 registered and already commissioned"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-10T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /storage-assets"
              payload: { name: "Mesa Verde BESS 1", nameplate_energy_mwh: 100.0, power_rating_mw: 25.0, poi_mw_limit: 25.0, poi_mva_limit: 27.5, reactive_capability_mvar: 12.0, initial_soc_mwh: 80.0, degradation_cost_usd_per_mwh: 12.00, warranty_throughput_limit_mwh: 40000.0, commercial_operation_date: "2023-08-01T00:00:00Z", cycle_limit_per_year: 365 }
              as: PlatformAdmin
              captures: { a1: $.data.id }
            - call: "POST /storage-assets/${a1}/commission"
              payload: {}
              as: PlatformAdmin
              captures: { v1: $.data.version }
          trigger:
            - call: "POST /storage-assets/${a1}/commission"
              payload: {}
              as: PlatformAdmin
              captures: { err: $.data.error_id }
            - call: "GET /storage-assets/${a1}"
              payload: {}
              as: PlatformAdmin
              captures: { v_after: $.data.version, m_after: $.data.market_state }
          assert:
            - "HTTP 409 and ${err} == \"ERR_ASSET_NOT_OFFLINE\""
            - "${m_after} == \"AVAILABLE\" and ${v_after} == ${v1} - the refused call did not bump the version"

      - name: telemetry_computed_read_returns_derived_sample_fields
        claim_type: computed_read
        grounds:
          - endpoints[GET /dispatch-instructions/{id}/telemetry-samples]
          - calculations.poi_reactive_compliance
          - response_envelope.pagination_fields
        distinguishing_aspect: |
          The nested collection read is the only way to see TelemetrySample rows again, so it must
          return the stored derived fields (not recompute them from the instruction's current
          state) and paginate in sample order.
        test_recipe:
          setup:
            - "logical clock at 2026-08-10T00:00:00Z"
            - "A1 commissioned; reservation; CLEARED bid; instruction of 20.0 MW EXECUTING"
            - "two samples: 19.6 MW at 14:15Z and 20.4 MW at 14:30Z"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-10T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /storage-assets"
              payload: { name: "Mesa Verde BESS 1", nameplate_energy_mwh: 100.0, power_rating_mw: 25.0, poi_mw_limit: 25.0, poi_mva_limit: 27.5, reactive_capability_mvar: 12.0, initial_soc_mwh: 80.0, degradation_cost_usd_per_mwh: 12.00, warranty_throughput_limit_mwh: 40000.0, commercial_operation_date: "2023-08-01T00:00:00Z", cycle_limit_per_year: 365 }
              as: PlatformAdmin
              captures: { a1: $.data.id }
            - call: "POST /storage-assets/${a1}/commission"
              payload: {}
              as: PlatformAdmin
              captures: { v1: $.data.version }
            - call: "POST /soc-reservations"
              payload: { asset_id: "${a1}", purpose: "ENERGY_ARBITRAGE", reserved_mwh: 40.0, window_start: "2026-08-10T12:00:00Z", window_end: "2026-08-10T20:00:00Z", expected_asset_version: "${v1}" }
              as: MarketTrader
              captures: { r1: $.data.id }
            - call: "POST /market-bids"
              payload: { asset_id: "${a1}", reservation_id: "${r1}", market_type: "DAY_AHEAD", product: "ENERGY", direction: "DISCHARGE", delivery_start: "2026-08-10T12:00:00Z", delivery_end: "2026-08-10T16:00:00Z", offer_mw: 20.0 }
              as: MarketTrader
              captures: { b1: $.data.id }
            - call: "POST /market-bids/${b1}/submit"
              payload: {}
              as: MarketTrader
            - call: "POST /market-bids/${b1}/clearing-result"
              payload: { outcome: "CLEARED", cleared_price_usd_per_mwh: 45.00, cleared_mw: 20.0 }
              as: MarketOperator
            - call: "POST /dispatch-instructions"
              payload: { bid_id: "${b1}", asset_id: "${a1}", instructed_mw: 20.0, setpoint_start: "2026-08-10T14:00:00Z", setpoint_end: "2026-08-10T15:00:00Z" }
              as: MarketOperator
              captures: { d1: $.data.id }
            - call: "POST /dispatch-instructions/${d1}/accept"
              payload: {}
              as: ControlRoomOperator
            - call: "POST /dispatch-instructions/${d1}/execute"
              payload: {}
              as: SiteController
              as_user_id: "${a1}"
            - call: "POST /telemetry-samples"
              payload: { dispatch_id: "${d1}", sample_index: 1, sampled_at: "2026-08-10T14:15:00Z", measured_mw: 19.6, measured_mvar: 0.0, soc_mwh_reading: 75.1, max_cell_temp_c: 30.0 }
              as: SiteController
              as_user_id: "${a1}"
              captures: { s1_ratio: $.data.error_ratio }
            - call: "POST /telemetry-samples"
              payload: { dispatch_id: "${d1}", sample_index: 2, sampled_at: "2026-08-10T14:30:00Z", measured_mw: 20.4, measured_mvar: 0.0, soc_mwh_reading: 70.0, max_cell_temp_c: 30.0 }
              as: SiteController
              as_user_id: "${a1}"
              captures: { s2_ratio: $.data.error_ratio }
          trigger:
            - call: "GET /dispatch-instructions/${d1}/telemetry-samples"
              payload: { limit: 10, offset: 0 }
              as: AssetManager
            - call: "GET /dispatch-instructions/${d1}"
              payload: {}
              as: AssetManager
              captures: { count: $.data.telemetry_sample_count }
          assert:
            - "both stored ratios are symmetric around the instruction: ${s1_ratio} == 0.02 and ${s2_ratio} == 0.02 (deviation 0.4 / 20.0 either side)"
            - "the collection read returns total_count == 2, has_more == false and elements ordered by sample_index 1 then 2"
            - "each element carries apparent_mva 19.6 / 20.4, deviation_mw 0.4 / 0.4, error_ratio 0.02 / 0.02, within_deadband true / true and thermal_escalation \"NONE\""
            - "${count} == 2 - the parent's telemetry_sample_count agrees with the collection"

      - name: warranty_claim_cross_reference_must_cite_the_same_asset
        claim_type: cross_reference_link
        grounds:
          - endpoints[POST /warranty-claims]
          - validations[priority=6]
          - errors[ERR_ASSET_SCOPE_MISMATCH]
        distinguishing_aspect: |
          A warranty claim links an asset to a capacity test, and the remedy it can win is sized
          from the asset's rated energy - so citing another asset's COMPLETED, claim-triggering
          test must fail the scope check even though both rows exist and the test would otherwise
          qualify.
        test_recipe:
          setup:
            - "logical clock at 2026-08-01T00:00:00Z"
            - "asset AX with initial_cumulative_throughput_mwh 19.8, test TX completed with measured 90.0 -> warranty_claim_triggered true"
            - "asset AY commissioned, no tests of its own"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /storage-assets"
              payload: { name: "Cross Ref BESS X", nameplate_energy_mwh: 100.0, power_rating_mw: 25.0, poi_mw_limit: 25.0, poi_mva_limit: 27.5, reactive_capability_mvar: 12.0, initial_soc_mwh: 80.0, initial_cumulative_throughput_mwh: 19.8, degradation_cost_usd_per_mwh: 12.00, warranty_throughput_limit_mwh: 40000.0, commercial_operation_date: "2023-08-01T00:00:00Z", cycle_limit_per_year: 365 }
              as: PlatformAdmin
              captures: { ax: $.data.id }
            - call: "POST /storage-assets/${ax}/commission"
              payload: {}
              as: PlatformAdmin
            - call: "POST /capacity-tests"
              payload: { asset_id: "${ax}", scheduled_date: "2026-08-01T00:00:00Z" }
              as: AssetManager
              captures: { tx: $.data.id }
            - call: "POST /capacity-tests/${tx}/start"
              payload: {}
              as: SiteController
              as_user_id: "${ax}"
            - call: "POST /capacity-tests/${tx}/complete"
              payload: { measured_capacity_mwh: 90.0 }
              as: SiteController
              as_user_id: "${ax}"
              captures: { tx_trigger: $.data.warranty_claim_triggered }
            - call: "POST /storage-assets"
              payload: { name: "Cross Ref BESS Y", nameplate_energy_mwh: 100.0, power_rating_mw: 25.0, poi_mw_limit: 25.0, poi_mva_limit: 27.5, reactive_capability_mvar: 12.0, initial_soc_mwh: 80.0, degradation_cost_usd_per_mwh: 12.00, warranty_throughput_limit_mwh: 40000.0, commercial_operation_date: "2023-08-01T00:00:00Z", cycle_limit_per_year: 365 }
              as: PlatformAdmin
              captures: { ay: $.data.id }
            - call: "POST /storage-assets/${ay}/commission"
              payload: {}
              as: PlatformAdmin
          trigger:
            - call: "POST /warranty-claims"
              payload: { asset_id: "${ay}", capacity_test_id: "${tx}", claim_type: "CAPACITY_SHORTFALL" }
              as: AssetManager
              as_user_id: "am_filer"
              captures: { err: $.data.error_id }
            - call: "POST /warranty-claims"
              payload: { asset_id: "${ax}", capacity_test_id: "${tx}", claim_type: "CAPACITY_SHORTFALL" }
              as: AssetManager
              as_user_id: "am_filer"
              captures: { w_ok: $.data.id, w_pct: $.data.claimed_shortfall_pct }
          assert:
            - "${tx_trigger} == true, so the test itself is claimable"
            - "cross-asset link: HTTP 409 and ${err} == \"ERR_ASSET_SCOPE_MISMATCH\" (both FKs exist; they simply disagree)"
            - "same-asset link: HTTP 201 with ${w_pct} == 2.1 - the association is created only when both references agree"

  # ---------------------------------------------------------------------------
  # 6. ERRORS - every one of the 56 catalog codes must be reachable. Codes whose
  #    only interesting corner is already exercised by SCAFFOLD_DIFFICULTY_DESIGN
  #    appear here as excluded_because stubs so the coverage ledger stays visible.
  # ---------------------------------------------------------------------------
  - section: errors
    instances:

      - name: every_path_id_returns_its_own_entity_specific_not_found
        claim_type: error_triggerable
        grounds:
          - validations[priority=4]
          - errors[ERR_ASSET_NOT_FOUND]
          - errors[ERR_RESERVATION_NOT_FOUND]
          - errors[ERR_BID_NOT_FOUND]
          - errors[ERR_SAFETY_EVENT_NOT_FOUND]
          - errors[ERR_OBLIGATION_NOT_FOUND]
          - errors[ERR_TEST_NOT_FOUND]
          - errors[ERR_CLAIM_NOT_FOUND]
        distinguishing_aspect: |
          Seven separate 404 codes share one validation row, so a lazy implementation that returns
          a single generic ERR_NOT_FOUND passes nothing. Each collection is probed with the same
          well-formed but absent UUID and must answer with the code named for its own entity.
        test_recipe:
          setup:
            - "empty system - no rows of any kind are needed, only well-formed absent ids"
          setup_api_calls: []
          trigger:
            - call: "GET /storage-assets/00000000-0000-4000-8000-00000000fff1"
              payload: {}
              as: AssetManager
              captures: { e_asset: $.data.error_id }
            - call: "GET /soc-reservations/00000000-0000-4000-8000-00000000fff2"
              payload: {}
              as: AssetManager
              captures: { e_res: $.data.error_id }
            - call: "GET /market-bids/00000000-0000-4000-8000-00000000fff3"
              payload: {}
              as: AssetManager
              captures: { e_bid: $.data.error_id }
            - call: "GET /safety-events/00000000-0000-4000-8000-00000000fff4"
              payload: {}
              as: AssetManager
              captures: { e_evt: $.data.error_id }
            - call: "GET /capacity-obligations/00000000-0000-4000-8000-00000000fff5"
              payload: {}
              as: AssetManager
              captures: { e_obl: $.data.error_id }
            - call: "GET /capacity-tests/00000000-0000-4000-8000-00000000fff6"
              payload: {}
              as: AssetManager
              captures: { e_test: $.data.error_id }
            - call: "GET /warranty-claims/00000000-0000-4000-8000-00000000fff7"
              payload: {}
              as: AssetManager
              captures: { e_claim: $.data.error_id }
          assert:
            - "all seven reads return HTTP 404"
            - "${e_asset} == \"ERR_ASSET_NOT_FOUND\" and ${e_res} == \"ERR_RESERVATION_NOT_FOUND\""
            - "${e_bid} == \"ERR_BID_NOT_FOUND\" and ${e_evt} == \"ERR_SAFETY_EVENT_NOT_FOUND\""
            - "${e_obl} == \"ERR_OBLIGATION_NOT_FOUND\" and ${e_test} == \"ERR_TEST_NOT_FOUND\""
            - "${e_claim} == \"ERR_CLAIM_NOT_FOUND\" - seven codes, never one shared generic code"

      - name: clearing_result_and_revise_on_a_draft_bid_return_bid_not_submitted
        claim_type: error_triggerable
        grounds:
          - errors[ERR_BID_NOT_SUBMITTED]
          - validations[priority=9]
          - endpoints[POST /market-bids/{id}/clearing-result]
          - endpoints[POST /market-bids/{id}/revise]
        distinguishing_aspect: |
          ERR_BID_NOT_SUBMITTED guards two different endpoints owned by two different roles, and
          both are reached from the DRAFT state that a freshly created bid occupies - the revision
          path in particular is easy to mis-implement as a DRAFT-editing endpoint.
        test_recipe:
          setup:
            - "logical clock 2026-08-10T00:00:00Z, asset A1 commissioned, reservation R1 HELD 40 MWh over 12:00-20:00"
            - "bid B1 created and left in DRAFT"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-10T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /storage-assets"
              payload: { name: "Mesa Verde BESS 1", nameplate_energy_mwh: 100.0, power_rating_mw: 25.0, poi_mw_limit: 25.0, poi_mva_limit: 27.5, reactive_capability_mvar: 12.0, initial_soc_mwh: 80.0, degradation_cost_usd_per_mwh: 12.00, warranty_throughput_limit_mwh: 40000.0, commercial_operation_date: "2023-08-01T00:00:00Z", cycle_limit_per_year: 365 }
              as: PlatformAdmin
              captures: { a1: $.data.id }
            - call: "POST /storage-assets/${a1}/commission"
              payload: {}
