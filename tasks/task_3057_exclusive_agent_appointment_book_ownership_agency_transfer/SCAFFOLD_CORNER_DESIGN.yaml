    - validations[priority=3]
    - errors[ERR_AGENT_NOT_FOUND]
    - endpoints.POST_/agency-network/policies
    distinguishing_aspect: Creating a policy whose holder_agent_id does not resolve returns 404 ERR_AGENT_NOT_FOUND before any unique-number check.
    test_recipe:
      setup:
