    claim_type: violation_to_error
    grounds:
    - validations[priority=17]
    - errors[ERR_UNIQUENESS_VIOLATION]
    - state_machines.AssumptionSet.transitions.APPROVED_to_DRAFT
    distinguishing_aspect: Reopening an APPROVED (not LOCKED) second set that is referenced by an INITIATED run fails ERR_UNIQUENESS_VIOLATION — the in-use guard fires only when the state check passes.
    test_recipe:
      setup:
