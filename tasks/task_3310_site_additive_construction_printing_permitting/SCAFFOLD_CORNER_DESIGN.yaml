scaffold_corner_design:

  # =====================================================================
  # Section: entities — creation, retrieval, listing, not-found, required
  # =====================================================================
  - section: entities
    instances:

      - name: jurisdiction_create_returns_declared_fields_and_active_status
        claim_type: Creation
        grounds:
          - entities.Jurisdiction
          - endpoints.POST_/construction/jurisdictions
        distinguishing_aspect: "A jurisdiction created with the required fields returns 201 with status ACTIVE, version 1, and server-stamped id/created_at/updated_at."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Empty database."
          setup_api_calls:
            - call: "POST /construction/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /construction/jurisdictions"
              payload: { code: "JA", name: "J-A", permits_prescriptive_printed_path: true, alternative_means_review_days: 30, weather_station_id: "WX" }
              as: PlatformAdmin
              captures: { j_id: $.data.id }
          assert:
            - "response status is 201 and response_type is object"
            - "Jurisdiction.${j_id}.status == ACTIVE"
            - "Jurisdiction.${j_id}.version == 1"
            - "id, created_at, updated_at are non-null"

      - name: site_create_with_optional_community_deployment_omitted
        claim_type: Defaults
        grounds:
          - entities.Site.fields.community_deployment_id
          - endpoints.POST_/construction/sites
        distinguishing_aspect: "community_deployment_id is optional and defaults to null; a site created without it returns null and is not part of any deployment's completed_unit_count."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Jurisdiction J created."
          setup_api_calls:
            - call: "POST /construction/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /construction/jurisdictions"
              payload: { code: "JA2", name: "J-A2", permits_prescriptive_printed_path: true, alternative_means_review_days: 30, weather_station_id: "WX" }
              as: PlatformAdmin
              captures: { j_id: $.data.id }
          trigger:
            - call: "POST /construction/sites"
              payload: { jurisdiction_id: "${j_id}", address: "1 Solo St", soil_class: "A", foundation_kind: "SLAB" }
              as: SiteManager
              captures: { s_id: $.data.id }
          assert:
            - "Site.${s_id}.community_deployment_id is null"
            - "Site.${s_id}.status == REGISTERED"
            - "Site.${s_id}.posture == OPERATING"

      - name: site_list_pagination_limit_offset_total_count_has_more
        claim_type: Listing
        grounds:
          - endpoints.GET_/construction/sites
          - response_envelope.pagination_fields
          - response_envelope.pagination_defaults
        distinguishing_aspect: "With three sites in one jurisdiction, limit=2&offset=0 returns 2 rows with total_count 3 and has_more true; offset=2 returns 1 row with has_more false."
        test_recipe:
          setup:
            - "Jurisdiction J with three sites."
          setup_api_calls:
            - call: "POST /construction/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /construction/jurisdictions"
              payload: { code: "JA3", name: "J-A3", permits_prescriptive_printed_path: true, alternative_means_review_days: 30, weather_station_id: "WX" }
              as: PlatformAdmin
              captures: { j_id: $.data.id }
            - call: "POST /construction/sites"
              payload: { jurisdiction_id: "${j_id}", address: "1 A", soil_class: "A", foundation_kind: "SLAB" }
              as: SiteManager
            - call: "POST /construction/sites"
              payload: { jurisdiction_id: "${j_id}", address: "2 B", soil_class: "A", foundation_kind: "SLAB" }
              as: SiteManager
            - call: "POST /construction/sites"
              payload: { jurisdiction_id: "${j_id}", address: "3 C", soil_class: "A", foundation_kind: "SLAB" }
              as: SiteManager
          trigger:
            - call: "GET /construction/jurisdictions/${j_id}/sites"
              payload: { limit: 2, offset: 0 }
              as: SiteManager
          assert:
            - "response returns 2 rows with total_count == 3 and has_more == true"
            - "GET /construction/jurisdictions/${j_id}/sites?limit=2&offset=2 returns 1 row with total_count == 3 and has_more == false"

      - name: site_get_unknown_id_returns_not_found
        claim_type: Not Found
        grounds:
          - endpoints.GET_/construction/sites/{id}
          - errors.ERR_NOT_FOUND
          - validations.priority_4_existence
        distinguishing_aspect: "A syntactically valid but unallocated UUID on the site path produces 404 ERR_NOT_FOUND."
        test_recipe:
          setup:
            - "Empty database."
          setup_api_calls:
            - call: "POST /construction/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "GET /construction/sites/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: SiteManager
              captures: { err: $.data.error_id }
          assert:
            - "response status is 404 and err == ERR_NOT_FOUND"

      - name: jurisdiction_create_missing_required_field_returns_invalid_request
        claim_type: Required Fields
        grounds:
          - entities.Jurisdiction.fields.alternative_means_review_days
          - validations.priority_14_business_constraint
          - errors.ERR_INVALID_REQUEST
        distinguishing_aspect: "alternative_means_review_days is required input with no default; omitting it returns 400 ERR_INVALID_REQUEST."
        test_recipe:
          setup:
            - "Empty database."
          setup_api_calls:
            - call: "POST /construction/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /construction/jurisdictions"
              payload: { code: "JX", name: "J-X", permits_prescriptive_printed_path: true, weather_station_id: "WX" }
              as: PlatformAdmin
              captures: { err: $.data.error_id }
          assert:
            - "response status is 400 and err == ERR_INVALID_REQUEST"

      - name: printer_setup_computed_is_within_tolerance
        claim_type: Computed Fields
        grounds:
          - entities.PrinterSetup.fields.is_within_tolerance
          - calculations.pumping_window
        distinguishing_aspect: "is_within_tolerance is computed from measured_level_deviation_mm <= leveling_tolerance_mm; client-supplied value is ignored."
        test_recipe:
          setup:
            - "Site created and poured."
          setup_api_calls:
            - call: "POST /construction/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /construction/jurisdictions"
              payload: { code: "JA4", name: "J-A4", permits_prescriptive_printed_path: true, alternative_means_review_days: 30, weather_station_id: "WX" }
              as: PlatformAdmin
              captures: { j_id: $.data.id }
            - call: "POST /construction/sites"
              payload: { jurisdiction_id: "${j_id}", address: "5 E", soil_class: "A", foundation_kind: "SLAB" }
              as: SiteManager
              captures: { s_id: $.data.id, s_v: $.data.version }
          trigger:
            - call: "POST /construction/sites/${s_id}/printer-setups"
              payload: { gantry_model: "VULCAN_II", rail_span_mm: 10000, leveling_tolerance_mm: 5.0, measured_level_deviation_mm: 7.0, expected_site_version: "${s_v}" }
              as: PrintOperator
              captures: { ps_id: $.data.id }
          assert:
            - "PrinterSetup.${ps_id}.is_within_tolerance == false (7.0 > 5.0)"

      - name: system_fields_id_created_at_updated_at_server_stamped
        claim_type: System Fields
        grounds:
          - entities.Site
        distinguishing_aspect: "id, created_at, updated_at, version are server-stamped; client-supplied values are ignored on create."
        test_recipe:
          setup:
            - "Jurisdiction exists."
          setup_api_calls:
            - call: "POST /construction/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /construction/jurisdictions"
              payload: { code: "JA5", name: "J-A5", permits_prescriptive_printed_path: true, alternative_means_review_days: 30, weather_station_id: "WX" }
              as: PlatformAdmin
              captures: { j_id: $.data.id }
          trigger:
            - call: "POST /construction/sites"
              payload: { jurisdiction_id: "${j_id}", address: "7 F", soil_class: "B", foundation_kind: "PIER_AND_BEAM" }
              as: SiteManager
              captures: { s_id: $.data.id }
          assert:
            - "Site.${s_id}.version == 1"
            - "Site.${s_id}.created_at == 2026-09-01T00:00:00Z (server uses logical clock)"
            - "Site.${s_id}.id is a UUID"

      - name: layer_inspection_invalid_outcome_enum_rejected
        claim_type: Type Constraints
        grounds:
          - entities.LayerInspection.fields.disposition
        distinguishing_aspect: "Disposition is enum PENDING | ACCEPTED | REPAIR_REQUIRED | DEMOLISH_REQUIRED; submitting 'UNKNOWN' on the disposition endpoint returns 400 ERR_INVALID_REQUEST."
        test_recipe:
          setup:
            - "PrintJob PRINTING with one PENDING inspection."
          setup_api_calls:
            - call: "POST /construction/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /construction/jurisdictions"
              payload: { code: "JA6", name: "J-A6", permits_prescriptive_printed_path: true, alternative_means_review_days: 30, weather_station_id: "WX" }
              as: PlatformAdmin
              captures: { j_id: $.data.id }
            - call: "POST /construction/structural-plans"
              payload: { title: "P", structural_system: "PRINTED_WALL", wall_thickness_mm: 200, wall_height_mm: 3000, plan_area_m2: 80 }
              as: Engineer
              captures: { plan_id: $.data.id }
            - call: "POST /construction/structural-plans/${plan_id}/revisions"
              payload: { engineering_notes: "r", required_code_path: "PRESCRIPTIVE" }
              as: Engineer
              captures: { rev_id: $.data.id }
            - call: "POST /construction/structural-plans/${plan_id}/revisions/${rev_id}/action"
              payload: { action: "SUBMIT" }
              as: Engineer
              as_user_id: "eng-alice"
            - call: "POST /construction/structural-plans/${plan_id}/revisions/${rev_id}/action"
              payload: { action: "APPROVE" }
              as: Engineer
              as_user_id: "eng-bob"
            - call: "POST /construction/sites"
              payload: { jurisdiction_id: "${j_id}", address: "9 G", soil_class: "A", foundation_kind: "SLAB" }
              as: SiteManager
              captures: { s_id: $.data.id }
            - call: "POST /construction/sites/${s_id}/action"
              payload: { action: "POUR_FOUNDATION" }
              as: SiteManager
            - call: "POST /construction/_clock/set_current_utc"
              payload: { current_utc: "2026-09-04T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /construction/sites/${s_id}/action"
              payload: { action: "CONFIRM_CURE" }
              as: SiteManager
            - call: "GET /construction/sites/${s_id}"
              payload: {}
              as: PrintOperator
              captures: { s_v: $.data.version }
            - call: "POST /construction/sites/${s_id}/printer-setups"
              payload: { gantry_model: "VULCAN_II", rail_span_mm: 10000, leveling_tolerance_mm: 5.0, measured_level_deviation_mm: 3.0, expected_site_version: "${s_v}" }
              as: PrintOperator
              captures: { ps_id: $.data.id }
            - call: "POST /construction/sites/${s_id}/printer-setups/${ps_id}/advance"
              payload: { to_state: "LEVELED" }
              as: PrintOperator
            - call: "POST /construction/sites/${s_id}/printer-setups/${ps_id}/advance"
              payload: { to_state: "QUALIFIED" }
              as: PrintOperator
            - call: "POST /construction/sites/${s_id}/material-batches"
              payload: { mix_code: "LAVACRETE_A", water_cement_ratio: 0.45, target_slump_mm: 100, measured_slump_mm: 100, pump_consistency_kg_per_min: 50 }
              as: PrintOperator
              captures: { batch_id: $.data.id }
            - call: "POST /construction/sites/${s_id}/material-batches/${batch_id}/qualify"
              payload: {}
              as: PrintOperator
            - call: "POST /construction/sites/${s_id}/weather-observations"
              payload: { observed_at: "2026-09-04T07:30:00Z", air_temp_c: 22.0, relative_humidity_pct: 50.0, wind_speed_mps: 3.0, precipitation_mm: 0 }
              as: PrintOperator
            - call: "POST /construction/sites/${s_id}/permit-applications"
              payload: { plan_revision_id: "${rev_id}", requested_path: "PRESCRIPTIVE" }
              as: PermitCoordinator
              captures: { pa_id: $.data.id }
            - call: "POST /construction/sites/${s_id}/permit-applications/${pa_id}/action"
              payload: { action: "SUBMIT" }
              as: PermitCoordinator
            - call: "POST /construction/sites/${s_id}/permit-applications/${pa_id}/action"
              payload: { action: "PAY_FEE", amount_cents: 99999999 }
              as: PermitCoordinator
            - call: "POST /construction/sites/${s_id}/permit-applications/${pa_id}/action"
              payload: { action: "DECIDE", decision: "APPROVE" }
              as: JurisdictionReviewer
            - call: "GET /construction/sites/${s_id}"
              payload: {}
              as: PrintOperator
              captures: { s_v2: $.data.version }
            - call: "POST /construction/sites/${s_id}/print-jobs"
              payload: { plan_revision_id: "${rev_id}", printer_setup_id: "${ps_id}", scheduled_start_at: "2026-09-04T08:00:00Z", scheduled_end_at: "2026-09-04T16:00:00Z", total_layers_planned: 30, expected_site_version: "${s_v2}" }
              as: PrintOperator
              captures: { job_id: $.data.id }
            - call: "POST /construction/sites/${s_id}/print-jobs/${job_id}/transition"
              payload: { to_state: "READY_TO_PRINT" }
              as: PrintOperator
            - call: "POST /construction/_clock/set_current_utc"
              payload: { current_utc: "2026-09-04T08:00:00Z" }
              as: PlatformAdmin
            - call: "POST /construction/sites/${s_id}/print-jobs/${job_id}/transition"
              payload: { to_state: "PRINTING" }
              as: PrintOperator
            - call: "POST /construction/sites/${s_id}/print-jobs/${job_id}/layer-inspections"
              payload: { layer_index_start: 1, layer_index_end: 5, bond_strength_mpa: 2.0, dimensional_deviation_mm: 4 }
              as: QualityInspector
              captures: { insp_id: $.data.id }
          trigger:
            - call: "POST /construction/sites/${s_id}/print-jobs/${job_id}/layer-inspections/${insp_id}/disposition"
              payload: { disposition: "UNKNOWN_ENUM" }
              as: QualityInspector
              captures: { err: $.data.error_id }
          assert:
            - "response status is 400 and err == ERR_INVALID_REQUEST"

  # =====================================================================
  # Section: state_machines — invalid-from, terminal lockdown, idempotency
  # =====================================================================
  - section: state_machines
    instances:

      - name: print_job_invalid_from_completed_to_printing
        claim_type: invalid_transition
        grounds:
          - state_machines.PrintJob
          - errors.ERR_INVALID_STATE
        distinguishing_aspect: "A COMPLETED print job is terminal; POST /start on it returns ERR_INVALID_STATE."
        test_recipe:
          setup:
            - "PrintJob fully completed via ready → start → inspect → accept → complete."
          setup_api_calls:
            - call: "POST /construction/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /construction/jurisdictions"
              payload: { code: "JI", name: "J-I", permits_prescriptive_printed_path: true, alternative_means_review_days: 30, weather_station_id: "WX" }
              as: PlatformAdmin
              captures: { j_id: $.data.id }
            - call: "POST /construction/structural-plans"
              payload: { title: "P2", structural_system: "PRINTED_WALL", wall_thickness_mm: 200, wall_height_mm: 3000, plan_area_m2: 80 }
              as: Engineer
