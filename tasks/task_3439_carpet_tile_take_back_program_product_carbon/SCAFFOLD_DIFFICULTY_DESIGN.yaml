            - "after publishing REP-1, the identical submit call succeeds: CarbonClaim.${cl1}.status == IN_REVIEW"
            - "required_offset_kgco2e == 320.0 (operational 6.400 x 50; neutral claims carry no buffer)"

      - name: negative_claim_blocked_when_target_breached
        grounds:
          - state_machines.CarbonClaim.DRAFT_to_IN_REVIEW
          - validations[priority=9]
          - errors[ERR_TARGET_BREACHED]
          - calculations.target_posture
        distinguishing_aspect: "Entity pair CarbonClaim x ManufacturingTarget: a CARBON_NEGATIVE claim's submit reads the referenced target's derived posture and is rejected with ERR_TARGET_BREACHED while BREACHED, whereas a CARBON_NEUTRAL claim on the same report and day submits freely — the gate binds only the negative-claim/target pair."
        test_recipe:
          setup:
            - "Collection RND with REP-1 CRADLE_TO_GRAVE published (operational 6.400, lifecycle 6.750)."
            - "Target PG-40 (baseline 8.0, reduction 0.25) with one reading of 8.5 -> posture BREACHED."
            - "CL-NEG: CARBON_NEGATIVE volume 10, boundary CRADLE_TO_GRAVE, bound to PG-40; CL-NEU: CARBON_NEUTRAL volume 10, boundary CRADLE_TO_GRAVE, without a target."
