# =============================================================================
# §1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# Community Fire Protection Evaluation & Class Assignment
# =============================================================================
scaffold_corner_design:
  # ---------------------------------------------------------------------------
  # Entities
  # ---------------------------------------------------------------------------
  - section: entities
    instances:
      - name: community_create_returns_201_with_defaults_and_shells
        claim_type: creation
        grounds: ["entities.Community.fields.status", "entities.Community.fields.bound_exposure_cents"]
        distinguishing_aspect: "POST /ppc/communities returns 201 with system fields populated and auto-creates the FireDepartment and WaterSupplySystem shells discoverable by filtered list."
        test_recipe:
          setup: ["empty database, default clock 2026-09-01"]
          setup_api_calls:
            - { call: "POST /ppc/communities", payload: { name: "Shellby", state_code: "TX", population: 4000, area_sq_miles: 40, rural_area_pct: 20, dept_type: "CAREER", needed_fire_flow_gpm: 1000, storage_capacity_gal: 0, supply_works_capacity_gpm: 500, daily_consumption_gpm: 100 }, as: EvaluationCoordinator, captures: { c_id: $.data.id } }
          trigger:
            - { call: "GET /ppc/fire-departments?community_id=${c_id}", as: EvaluationCoordinator }
            - { call: "GET /ppc/water-supply-systems?community_id=${c_id}", as: EvaluationCoordinator }
          assert:
            - "create returned 201 with data.id, created_at, version == 1"
            - "Community.${c_id}.status == REGISTERED, current_class_number == null, bound_exposure_cents == 0, comms_attested == false"
            - "exactly one FireDepartment with community_id == ${c_id}, dept_type == CAREER, data_submitted == false"
            - "exactly one WaterSupplySystem with community_id == ${c_id}, needed_fire_flow_gpm == 1000, alternate_verified == false"

      - name: community_create_missing_required_field_returns_invalid_request
        claim_type: required_fields
        grounds: ["validations[priority=44]", "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "Omitting required dept_type (seed of the department shell) is rejected with 400 ERR_INVALID_REQUEST."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - { call: "POST /ppc/communities", payload: { name: "NoDept", state_code: "TX", population: 4000, area_sq_miles: 40, rural_area_pct: 20, needed_fire_flow_gpm: 1000, storage_capacity_gal: 0, supply_works_capacity_gpm: 500, daily_consumption_gpm: 100 }, as: EvaluationCoordinator, captures: { err: $.data.error_id } }
          assert:
            - "trigger returns 400 with error_id ERR_INVALID_REQUEST"
            - "no Community is created"

      - name: community_create_invalid_enum_returns_invalid_request
        claim_type: type_constraints
        grounds: ["validations[priority=44]", entities.FireDepartment.fields.dept_type]
        distinguishing_aspect: "dept_type outside {CAREER, VOLUNTEER, COMBINATION} is rejected."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - { call: "POST /ppc/communities", payload: { name: "BadEnum", state_code: "TX", population: 4000, area_sq_miles: 40, rural_area_pct: 20, dept_type: "PAID", needed_fire_flow_gpm: 1000, storage_capacity_gal: 0, supply_works_capacity_gpm: 500, daily_consumption_gpm: 100 }, as: EvaluationCoordinator, captures: { err: $.data.error_id } }
          assert:
            - "trigger returns 400 ERR_INVALID_REQUEST"

      - name: community_get_not_found_returns_404
        claim_type: not_found
        grounds: ["validations[priority=4]", "errors[ERR_COMMUNITY_NOT_FOUND]"]
        distinguishing_aspect: "GET on a well-formed but unknown community id returns 404 ERR_COMMUNITY_NOT_FOUND."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - { call: "GET /ppc/communities/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2", as: EvaluationCoordinator, captures: { err: $.data.error_id } }
          assert:
            - "trigger returns 404 with error_id ERR_COMMUNITY_NOT_FOUND"

      - name: premium_quote_get_not_found_returns_404
        claim_type: not_found
        grounds: ["validations[priority=15]", "errors[ERR_QUOTE_NOT_FOUND]"]
        distinguishing_aspect: "GET on an unknown quote id returns 404 ERR_QUOTE_NOT_FOUND."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - { call: "GET /ppc/premium-quotes/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2", as: Insurer, captures: { err: $.data.error_id } }
          assert:
            - "trigger returns 404 with error_id ERR_QUOTE_NOT_FOUND"

      - name: hydrant_create_computed_field_input_ignored
        claim_type: computed_fields
        grounds: [entities.Hydrant.fields.max_flow_gpm]
        distinguishing_aspect: "Client-supplied max_flow_gpm is ignored; the computed field stays null until a certified flow test sets it."
        test_recipe:
          setup: ["community with water system; cycle in DATA_COLLECTION"]
          setup_api_calls:
            - { call: "POST /ppc/communities", payload: { name: "Hydra", state_code: "TX", population: 4000, area_sq_miles: 40, rural_area_pct: 20, dept_type: "CAREER", needed_fire_flow_gpm: 1000, storage_capacity_gal: 0, supply_works_capacity_gpm: 500, daily_consumption_gpm: 100 }, as: EvaluationCoordinator, captures: { c_id: $.data.id } }
            - { call: "POST /ppc/evaluation-cycles", payload: { community_id: "${c_id}", field_analyst_id: "analyst-1", scheduled_open_date: "2026-09-01", data_freeze_date: "2026-12-01" }, as: EvaluationCoordinator, captures: { cy_id: $.data.id } }
            - { call: "POST /ppc/evaluation-cycles/${cy_id}/transition", payload: { target_state: "INTAKE" }, as: EvaluationCoordinator }
            - { call: "POST /ppc/evaluation-cycles/${cy_id}/transition", payload: { target_state: "DATA_COLLECTION" }, as: EvaluationCoordinator }
            - { call: "GET /ppc/water-supply-systems?community_id=${c_id}", as: EvaluationCoordinator, captures: { sys_id: "$.data[0].id" } }
          trigger:
            - { call: "POST /ppc/hydrants", payload: { system_id: "${sys_id}", location_descriptor: "5th & Main", max_flow_gpm: 999 }, as: WaterUtilityManager, as_user_id: "${sys_id}", captures: { h_id: $.data.id } }
          assert:
            - "trigger returns 201 and Hydrant.${h_id}.max_flow_gpm == null (client input ignored)"

      - name: communities_list_pagination_limit_offset
        claim_type: listing
        grounds: [response_envelope]
        distinguishing_aspect: "limit/offset paginate deterministically with total_count and has_more."
        test_recipe:
          setup: ["three communities created"]
          setup_api_calls:
            - { call: "POST /ppc/communities", payload: { name: "P1", state_code: "TX", population: 1000, area_sq_miles: 10, rural_area_pct: 10, dept_type: "CAREER", needed_fire_flow_gpm: 1000, storage_capacity_gal: 0, supply_works_capacity_gpm: 500, daily_consumption_gpm: 50 }, as: EvaluationCoordinator }
            - { call: "POST /ppc/communities", payload: { name: "P2", state_code: "TX", population: 1000, area_sq_miles: 10, rural_area_pct: 10, dept_type: "CAREER", needed_fire_flow_gpm: 1000, storage_capacity_gal: 0, supply_works_capacity_gpm: 500, daily_consumption_gpm: 50 }, as: EvaluationCoordinator }
            - { call: "POST /ppc/communities", payload: { name: "P3", state_code: "TX", population: 1000, area_sq_miles: 10, rural_area_pct: 10, dept_type: "CAREER", needed_fire_flow_gpm: 1000, storage_capacity_gal: 0, supply_works_capacity_gpm: 500, daily_consumption_gpm: 50 }, as: EvaluationCoordinator }
          trigger:
            - { call: "GET /ppc/communities?limit=2&offset=0", as: EvaluationCoordinator }
            - { call: "GET /ppc/communities?limit=2&offset=2", as: EvaluationCoordinator }
          assert:
            - "page 1 returns 2 items with total_count == 3 and has_more == true"
            - "page 2 returns 1 item with total_count == 3 and has_more == false"

      - name: hydrants_list_filter_by_status
        claim_type: listing
        grounds: [entities.Hydrant.fields.status]
        distinguishing_aspect: "status filter on the hydrant list returns only matching rows."
        test_recipe:
          setup: ["community in DATA_COLLECTION with two hydrants; H2 set OUT_OF_SERVICE"]
          setup_api_calls:
            - { call: "POST /ppc/communities", payload: { name: "Filterton", state_code: "TX", population: 4000, area_sq_miles: 40, rural_area_pct: 20, dept_type: "CAREER", needed_fire_flow_gpm: 1000, storage_capacity_gal: 0, supply_works_capacity_gpm: 500, daily_consumption_gpm: 100 }, as: EvaluationCoordinator, captures: { c_id: $.data.id } }
            - { call: "POST /ppc/evaluation-cycles", payload: { community_id: "${c_id}", field_analyst_id: "analyst-1", scheduled_open_date: "2026-09-01", data_freeze_date: "2026-12-01" }, as: EvaluationCoordinator, captures: { cy_id: $.data.id } }
            - { call: "POST /ppc/evaluation-cycles/${cy_id}/transition", payload: { target_state: "INTAKE" }, as: EvaluationCoordinator }
            - { call: "POST /ppc/evaluation-cycles/${cy_id}/transition", payload: { target_state: "DATA_COLLECTION" }, as: EvaluationCoordinator }
            - { call: "GET /ppc/water-supply-systems?community_id=${c_id}", as: EvaluationCoordinator, captures: { sys_id: "$.data[0].id" } }
            - { call: "POST /ppc/hydrants", payload: { system_id: "${sys_id}", location_descriptor: "H1" }, as: WaterUtilityManager, as_user_id: "${sys_id}", captures: { h1: $.data.id } }
            - { call: "POST /ppc/hydrants", payload: { system_id: "${sys_id}", location_descriptor: "H2" }, as: WaterUtilityManager, as_user_id: "${sys_id}", captures: { h2: $.data.id } }
            - { call: "PATCH /ppc/hydrants/${h2}", payload: { status: "OUT_OF_SERVICE" }, as: WaterUtilityManager, as_user_id: "${sys_id}" }
          trigger:
            - { call: "GET /ppc/hydrants?system_id=${sys_id}&status=OUT_OF_SERVICE", as: WaterUtilityManager, as_user_id: "${sys_id}" }
          assert:
            - "exactly one row returned and its id == ${h2}"

      - name: flow_tests_list_filter_by_hydrant
        claim_type: listing
        grounds: [entities.FlowTest.fields.hydrant_id]
        distinguishing_aspect: "hydrant_id filter narrows the flow-test list to tests of one hydrant."
        test_recipe:
          setup: ["two hydrants each with one SUBMITTED flow test"]
          setup_api_calls:
            - { call: "POST /ppc/communities", payload: { name: "Filter Falls", state_code: "TX", population: 4000, area_sq_miles: 40, rural_area_pct: 20, dept_type: "CAREER", needed_fire_flow_gpm: 1000, storage_capacity_gal: 0, supply_works_capacity_gpm: 500, daily_consumption_gpm: 100 }, as: EvaluationCoordinator, captures: { c_id: $.data.id } }
            - { call: "POST /ppc/evaluation-cycles", payload: { community_id: "${c_id}", field_analyst_id: "analyst-1", scheduled_open_date: "2026-09-01", data_freeze_date: "2026-12-01" }, as: EvaluationCoordinator, captures: { cy_id: $.data.id } }
            - { call: "POST /ppc/evaluation-cycles/${cy_id}/transition", payload: { target_state: "INTAKE" }, as: EvaluationCoordinator }
            - { call: "POST /ppc/evaluation-cycles/${cy_id}/transition", payload: { target_state: "DATA_COLLECTION" }, as: EvaluationCoordinator }
            - { call: "GET /ppc/water-supply-systems?community_id=${c_id}", as: EvaluationCoordinator, captures: { sys_id: "$.data[0].id" } }
            - { call: "POST /ppc/hydrants", payload: { system_id: "${sys_id}", location_descriptor: "H1" }, as: WaterUtilityManager, as_user_id: "${sys_id}", captures: { h1: $.data.id } }
            - { call: "POST /ppc/hydrants", payload: { system_id: "${sys_id}", location_descriptor: "H2" }, as: WaterUtilityManager, as_user_id: "${sys_id}", captures: { h2: $.data.id } }
            - { call: "POST /ppc/flow-tests", payload: { system_id: "${sys_id}", hydrant_id: "${h1}", test_date: "2026-08-15", static_psi: 80, residual_psi: 60, measured_flow_gpm: 1000 }, as: WaterUtilityManager, as_user_id: "${sys_id}", captures: { t1: $.data.id } }
            - { call: "POST /ppc/flow-tests", payload: { system_id: "${sys_id}", hydrant_id: "${h2}", test_date: "2026-08-15", static_psi: 80, residual_psi: 60, measured_flow_gpm: 900 }, as: WaterUtilityManager, as_user_id: "${sys_id}", captures: { t2: $.data.id } }
          trigger:
            - { call: "GET /ppc/flow-tests?hydrant_id=${h1}", as: FieldAnalyst }
          assert:
            - "exactly one row returned and its id == ${t1}"

      - name: property_applicable_class_null_before_classification
        claim_type: computed_fields
        grounds: [entities.PropertyRiskProfile.fields.applicable_class]
        excluded_because:
          difficulty_instance: "cross_entity_state_dependency / quote_create_requires_effective_classification"
          rationale: "That instance asserts applicable_class is null before activation and 10 after."

  # ---------------------------------------------------------------------------
  # State machines
  # ---------------------------------------------------------------------------
  - section: state_machines
    instances:
      - name: cycle_invalid_transition_scheduled_to_scoring
        claim_type: invalid_transition
        grounds: [state_machines.EvaluationCycle, "validations[priority=19]"]
        distinguishing_aspect: "SCHEDULED -> SCORING skips the pipeline and is rejected with ERR_CYCLE_INVALID_STATE."
        test_recipe:
          setup: ["community with a SCHEDULED cycle"]
          setup_api_calls:
            - { call: "POST /ppc/communities", payload: { name: "Skipper", state_code: "TX", population: 4000, area_sq_miles: 40, rural_area_pct: 20, dept_type: "CAREER", needed_fire_flow_gpm: 1000, storage_capacity_gal: 0, supply_works_capacity_gpm: 500, daily_consumption_gpm: 100 }, as: EvaluationCoordinator, captures: { c_id: $.data.id } }
            - { call: "POST /ppc/evaluation-cycles", payload: { community_id: "${c_id}", field_analyst_id: "analyst-1", scheduled_open_date: "2026-09-01", data_freeze_date: "2026-12-01" }, as: EvaluationCoordinator, captures: { cy_id: $.data.id } }
          trigger:
            - { call: "POST /ppc/evaluation-cycles/${cy_id}/transition", payload: { target_state: "SCORING" }, as: EvaluationCoordinator, captures: { err: $.data.error_id } }
          assert:
            - "trigger returns 409 ERR_CYCLE_INVALID_STATE and the cycle remains SCHEDULED"

      - name: cycle_withdraw_reverts_community_and_locks_terminal
        claim_type: terminal_state_lockdown
        grounds: [state_machines.EvaluationCycle.SCHEDULED_to_WITHDRAWN, state_machines.Community.UNDER_EVALUATION_to_REGISTERED]
        distinguishing_aspect: "Withdrawing a mid-flight cycle reverts a never-classified community to REGISTERED and the terminal cycle rejects any further transition."
        test_recipe:
          setup: ["community UNDER_EVALUATION with cycle in DATA_COLLECTION"]
          setup_api_calls:
            - { call: "POST /ppc/communities", payload: { name: "Withdrawn City", state_code: "TX", population: 4000, area_sq_miles: 40, rural_area_pct: 20, dept_type: "CAREER", needed_fire_flow_gpm: 1000, storage_capacity_gal: 0, supply_works_capacity_gpm: 500, daily_consumption_gpm: 100 }, as: EvaluationCoordinator, captures: { c_id: $.data.id } }
            - { call: "POST /ppc/evaluation-cycles", payload: { community_id: "${c_id}", field_analyst_id: "analyst-1", scheduled_open_date: "2026-09-01", data_freeze_date: "2026-12-01" }, as: EvaluationCoordinator, captures: { cy_id: $.data.id } }
            - { call: "POST /ppc/evaluation-cycles/${cy_id}/transition", payload: { target_state: "INTAKE" }, as: EvaluationCoordinator }
            - { call: "POST /ppc/evaluation-cycles/${cy_id}/transition", payload: { target_state: "DATA_COLLECTION" }, as: EvaluationCoordinator }
          trigger:
            - { call: "POST /ppc/evaluation-cycles/${cy_id}/transition", payload: { target_state: "WITHDRAWN" }, as: EvaluationCoordinator }
            - { call: "POST /ppc/evaluation-cycles/${cy_id}/transition", payload: { target_state: "INTAKE" }, as: EvaluationCoordinator, captures: { err: $.data.error_id } }
          assert:
            - "withdraw returns 200 and EvaluationCycle.${cy_id}.status == WITHDRAWN"
            - "Community.${c_id}.status == REGISTERED (no EFFECTIVE classification exists)"
            - "second transition returns 409 ERR_CYCLE_INVALID_STATE (terminal lockdown)"

      - name: quote_voided_cannot_bind_again
        claim_type: terminal_state_lockdown
        grounds: [state_machines.PremiumQuote, "validations[priority=24]"]
        distinguishing_aspect: "A VOIDED quote rejects a later bind with ERR_QUOTE_INVALID_STATE."
        test_recipe:
          setup: ["EFFECTIVE class-10 community, property, one BOUND-then-VOIDED quote"]
          setup_api_calls:
            - { call: "POST /ppc/communities", payload: { name: "Voidville", state_code: "TX", population: 4000, area_sq_miles: 40, rural_area_pct: 20, dept_type: "CAREER", needed_fire_flow_gpm: 1000, storage_capacity_gal: 0, supply_works_capacity_gpm: 500, daily_consumption_gpm: 100 }, as: EvaluationCoordinator, captures: { c_id: $.data.id } }
            - { call: "POST /ppc/evaluation-cycles", payload: { community_id: "${c_id}", field_analyst_id: "analyst-1", scheduled_open_date: "2026-09-01", data_freeze_date: "2026-12-01" }, as: EvaluationCoordinator, captures: { cy_id: $.data.id } }
            - { call: "POST /ppc/evaluation-cycles/${cy_id}/transition", payload: { target_state: "INTAKE" }, as: EvaluationCoordinator }
            - { call: "POST /ppc/evaluation-cycles/${cy_id}/transition", payload: { target_state: "DATA_COLLECTION" }, as: EvaluationCoordinator }
            - { call: "GET /ppc/fire-departments?community_id=${c_id}", as: EvaluationCoordinator, captures: { dept_id: "$.data[0].id" } }
            - { call: "PATCH /ppc/fire-departments/${dept_id}", payload: { career_on_duty_per_shift: 0 }, as: FireChief, as_user_id: "${dept_id}" }
            - { call: "PATCH /ppc/communities/${c_id}/attest-comms", payload: { operators_on_duty_min: 0, avg_alarm_to_dispatch_seconds: 999, redundant_circuits: false, backup_power: false }, as: CommsSupervisor }
            - { call: "POST /ppc/evaluation-cycles/${cy_id}/transition", payload: { target_state: "FIELD_VERIFICATION" }, as: EvaluationCoordinator }
            - { call: "POST /ppc/evaluation-cycles/${cy_id}/transition", payload: { target_state: "SCORING" }, as: EvaluationCoordinator }
            - { call: "GET /ppc/evaluation-cycles/${cy_id}", as: FieldAnalyst, captures: { cy_v: $.data.version } }
            - { call: "POST /ppc/evaluation-cycles/${cy_id}/score-sheets", payload: { expected_cycle_version: "${cy_v}" }, as: FieldAnalyst, captures: { sheet1: $.data.id } }
            - { call: "POST /ppc/score-sheets/${sheet1}/finalize", payload: {}, as: FieldAnalyst }
            - { call: "POST /ppc/evaluation-cycles/${cy_id}/transition", payload: { target_state: "CLASSIFICATION_REVIEW" }, as: EvaluationCoordinator }
            - { call: "POST /ppc/evaluation-cycles/${cy_id}/publish-classification", payload: { score_sheet_id: "${sheet1}" }, as: ClassRegistrar, as_user_id: "registrar-1", captures: { cl1: $.data.id } }
            - { call: "POST /ppc/classifications/${cl1}/activate", payload: { effective_from: "2026-09-01" }, as: ClassRegistrar, as_user_id: "registrar-1" }
            - { call: "POST /ppc/property-risk-profiles", payload: { community_id: "${c_id}", address: "2 Vine St", distance_to_nearest_hydrant_ft: 300, distance_to_nearest_station_road_miles: 1.0, construction_type: "FRAME", insured_value_cents: 100000000 }, as: EvaluationCoordinator, captures: { prop_id: $.data.id } }
            - { call: "POST /ppc/premium-quotes", payload: { property_id: "${prop_id}", coverage_amount_cents: 1000000, base_rate_bp: 300, term_months: 6, coverage_start_date: "2027-01-01", coverage_end_date: "2027-06-30" }, as: Insurer, captures: { q1: $.data.id } }
            - { call: "GET /ppc/communities/${c_id}", as: Insurer, captures: { c_v: $.data.version } }
            - { call: "POST /ppc/premium-quotes/${q1}/bind", payload: { expected_community_version: "${c_v}" }, as: Insurer }
            - { call: "POST /ppc/premium-quotes/${q1}/void", payload: {}, as: Insurer }
          trigger:
            - { call: "GET /ppc/communities/${c_id}", as: Insurer, captures: { c_v2: $.data.version } }
            - { call: "POST /ppc/premium-quotes/${q1}/bind", payload: { expected_community_version: "${c_v2}" }, as: Insurer, captures: { err: $.data.error_id } }
          assert:
            - "re-bind returns 409 ERR_QUOTE_INVALID_STATE (VOIDED is terminal)"

      - name: sheet_finalize_superseded_returns_conflict
        claim_type: invalid_transition
        grounds: [state_machines.ScoreSheet.DRAFT_to_SUPERSEDED, "validations[priority=20]"]
        distinguishing_aspect: "Finalizing a sheet already SUPERSEDED by a newer create is rejected with ERR_SHEET_INVALID_STATE."
        test_recipe:
          setup: ["community in SCORING with sheet1 created then superseded by sheet2"]
          setup_api_calls:
            - { call: "POST /ppc/communities", payload: { name: "Sheetville", state_code: "TX", population: 4000, area_sq_miles: 40, rural_area_pct: 20, dept_type: "CAREER", needed_fire_flow_gpm: 1000, storage_capacity_gal: 0, supply_works_capacity_gpm: 500, daily_consumption_gpm: 100 }, as: EvaluationCoordinator, captures: { c_id: $.data.id } }
            - { call: "POST /ppc/evaluation-cycles", payload: { community_id: "${c_id}", field_analyst_id: "analyst-1", scheduled_open_date: "2026-09-01", data_freeze_date: "2026-12-01" }, as: EvaluationCoordinator, captures: { cy_id: $.data.id } }
            - { call: "POST /ppc/evaluation-cycles/${cy_id}/transition", payload: { target_state: "INTAKE" }, as: EvaluationCoordinator }
            - { call: "POST /ppc/evaluation-cycles/${cy_id}/transition", payload: { target_state: "DATA_COLLECTION" }, as: EvaluationCoordinator }
            - { call: "GET /ppc/fire-departments?community_id=${c_id}", as: EvaluationCoordinator, captures: { dept_id: "$.data[0].id" } }
            - { call: "PATCH /ppc/fire-departments/${dept_id}", payload: { career_on_duty_per_shift: 0 }, as: FireChief, as_user_id: "${dept_id}" }
            - { call: "PATCH /ppc/communities/${c_id}/attest-comms", payload: { operators_on_duty_min: 0, avg_alarm_to_dispatch_seconds: 999, redundant_circuits: false, backup_power: false }, as: CommsSupervisor }
            - { call: "POST /ppc/evaluation-cycles/${cy_id}/transition", payload: { target_state: "FIELD_VERIFICATION" }, as: EvaluationCoordinator }
            - { call: "POST /ppc/evaluation-cycles/${cy_id}/transition", payload: { target_state: "SCORING" }, as: EvaluationCoordinator }
            - { call: "GET /ppc/evaluation-cycles/${cy_id}", as: FieldAnalyst, captures: { v1: $.data.version } }
            - { call: "POST /ppc/evaluation-cycles/${cy_id}/score-sheets", payload: { expected_cycle_version: "${v1}" }, as: FieldAnalyst, captures: { sheet1: $.data.id } }
            - { call: "GET /ppc/evaluation-cycles/${cy_id}", as: FieldAnalyst, captures: { v2: $.data.version } }
            - { call: "POST /ppc/evaluation-cycles/${cy_id}/score-sheets", payload: { expected_cycle_version: "${v2}" }, as: FieldAnalyst, captures: { sheet2: $.data.id } }
          trigger:
            - { call: "POST /ppc/score-sheets/${sheet1}/finalize", payload: {}, as: FieldAnalyst, captures: { err: $.data.error_id } }
          assert:
            - "ScoreSheet.${sheet1}.status == SUPERSEDED after the second create"
            - "finalize on the superseded sheet returns 409 ERR_SHEET_INVALID_STATE"
            - "ScoreSheet.${sheet2}.status == DRAFT"

      - name: apparatus_out_of_service_exit_paths
        claim_type: invalid_transition
        grounds: [state_machines.Apparatus, "validations[priority=23]"]
        distinguishing_aspect: "OUT_OF_SERVICE -> FRONTLINE is rejected (ERR_APPARATUS_INVALID_STATE) while OUT_OF_SERVICE -> RESERVE succeeds — asymmetric exit from the out-of-service state."
        test_recipe:
          setup: ["community in DATA_COLLECTION with one apparatus moved FRONTLINE -> OUT_OF_SERVICE"]
          setup_api_calls:
