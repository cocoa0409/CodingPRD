      - name: strata_must_tile_the_scope_with_half_open_adjacency
        grounds:
          - validations.priority_11
          - errors.ERR_STRATUM_GAP
          - errors.ERR_STRATUM_OVERLAP
          - entities.SamplingAgreement.fields.strata
        distinguishing_aspect: |
          Over the scope 2026-01-01..2026-06-30 the strata must tile exactly with
          half-open intervals whose last `to` is 2026-07-01. A one-month gap
          ([01-01,03-01) + [04-01,07-01)) is ERR_STRATUM_GAP (422) and a one-month
          overlap ([01-01,04-01) + [03-01,07-01)) is ERR_STRATUM_OVERLAP (422), while
          the adjacent pair ([01-01,04-01) + [04-01,07-01)) is accepted: adjacency is
          required, not merely tolerated, so both a gap and an overlap must be
          distinguished rather than lumped into one geometry error.
        test_recipe:
          setup:
            - "Ridgeline Tools converted and scoped 2026-01-01..2026-06-30, with the audit version captured; the clock is left at its 2026-08-01 default."
            - "All three proposals reuse the same captured audit version, which is legitimate because a rejected proposal must not increment Audit.version."
