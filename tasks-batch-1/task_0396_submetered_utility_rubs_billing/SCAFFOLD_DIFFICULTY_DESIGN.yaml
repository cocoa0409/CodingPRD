  # ===========================================================================
  - rule_id: transitive_cascade
    instances:
      # --- instance 1: depth >= 3, dispute resolution -> credit -> balance -> PAID
      - name: dispute_resolve_credit_balance_to_paid_depth3
        grounds:
          - state_machines.Dispute.UNDER_REVIEW_to_RESOLVED
          - calculations.statement_totals
          - entities.TenantStatement.fields.credit_cents
          - entities.TenantStatement.fields.balance_due_cents
          - entities.TenantStatement.fields.payment_status
        distinguishing_aspect: |
          One trigger (resolve) chains three caused hops: (1) Dispute -> RESOLVED
          grants credit_cents; (2) that credit recomputes total_due_cents and
          balance_due_cents via statement_totals; (3) the new balance_due_cents <= 0
          itself flips payment_status -> PAID. Each hop is caused by the prior hop,
          not directly by the resolve call. Originates from the dispute-resolution
          trigger, distinct from instance 2's payment-reversal trigger.
        test_recipe:
          setup:
            - "An ISSUED TenantStatement (utility_charge only, total_due 6000) with an UNDER_REVIEW Dispute opened by its tenant."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-15T00:00:00Z" }
              as: PropertyManager
            - call: "POST /properties"
