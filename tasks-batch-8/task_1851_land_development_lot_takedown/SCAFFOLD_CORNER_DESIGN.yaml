              payload: { builder_name: "Dup1", license_number: "LIC-DUP", contact_email: "d1@x.com" }
              as: DeveloperOperator
          trigger:
            - call: "POST /api/builders"
              payload: { builder_name: "Dup2", license_number: "LIC-DUP", contact_email: "d2@x.com" }
              as: DeveloperOperator
              captures: { err: $.data.error_id }
            - call: "POST /api/builders"
              payload: { builder_name: "Dup3", license_number: "LIC-DUP-2", contact_email: "d3@x.com" }
              as: DeveloperOperator
              captures: { ok_id: $.data.id }
          assert:
            - "captured err == ERR_DUPLICATE_BUILDER_LICENSE"
            - "captured ok_id is a non-null UUID (distinct license succeeds)"

      - name: second_open_loan_per_parcel_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=9]", "errors[ERR_LOAN_ALREADY_EXISTS]"]
        distinguishing_aspect: "One open (DRAFT or ACTIVE) loan per parcel: the second create is rejected ERR_LOAN_ALREADY_EXISTS."
        test_recipe:
          setup: ["Parcel P with one DRAFT loan"]
          setup_api_calls:
