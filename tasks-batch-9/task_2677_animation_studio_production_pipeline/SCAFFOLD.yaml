scenario: |
  2677. Animation Studio Production Pipeline (animation production studio): pre-production with
  script, storyboard, animatic and design approval gates, asset production across modeling, rigging,
  surfacing and environment building with reuse libraries, shot production through layout, animation,
  effects, lighting and compositing with per-stage review, review sessions with director notes tracked
  to shot-level tasks and revision counts, render farm capacity management with priority scheduling
  and cost per frame tracking, outsourcing partner management with package definition, quality
  standards and security requirements, schedule and budget tracking with earned value at the shot
  level, final delivery with color management, versioning and deliverable specifications
domain_name: animation-studio-production-pipeline
api_prefix: /studio

complexity_profile:
  primary_archetype: workflow_orchestration
  secondary_archetype: quota_allocation
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers
    - derived_field_reconciliation

  entity_topology: flat
  # Every entity is a peer addressed at /studio/<collection>/{id}; parent linkage is carried by
  # explicit FK fields in request bodies (production_id, shot_id, shot_stage_task_id, ...), never by
  # URL nesting. Cascade-created children (PreProductionGate, ShotStageTask) are discovered only
  # through filtered list endpoints.

  state_machine_shape: cyclic
  # Non-linear in three distinct ways on three distinct entities:
  #   PreProductionGate  — cyclic  (IN_REVIEW -> CHANGES_REQUESTED -> IN_REVIEW revision loop)
  #   Asset              — parallel (build_status x library_status evolve independently on one row)
  #   OutsourcePackage   — branching fork with divergent side-effect sets (QC_PASSED vs QC_FAILED)
  #   ShotStageTask      — cyclic  (SUBMITTED -> IN_REVIEW -> RETAKE -> SUBMITTED)
  #   Shot / Production  — compound (state derived from children)

  relationship_patterns:
    - one_to_many          # Production -> Shot, Shot -> ShotStageTask, ReviewSession -> DirectorNote
    - self_referential     # Asset.derived_from_asset_id (reuse library chain), RenderJob.preempted_by_render_job_id
    - cross_aggregate      # DirectorNote.shot_stage_task_id crosses the review aggregate into shot production
    - polymorphic_scope    # Deliverable.shot_id nullable: a deliverable is production-wide or shot-scoped

  role_model: segregation_of_duties
  # Six peer roles with non-overlapping write surfaces; on top of that, the X-User-ID that submitted a
  # stage/gate/library artifact may never be the X-User-ID that decides it.

  consistency_model: immediate

  difficulty_level: beyond_expert
  # 13 entities, 65 endpoints, 56 error codes, 8 calculation rules (2 dual-variant plus 3 whose
  # step order is normative), 35 ordered validations, 12 state machines / 62 transitions, 2 OCC races.

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

entities:
  # ---------------------------------------------------------------- Production
  - name: Production
    parent: null
    common_fields: true
    entity_kind: resource
    fields:
      - name: title
        type: string
        source: input
        description: human-readable show title
        constraints: 1..200 chars
      - name: production_code
        type: string
        source: input
        description: studio-wide unique production code
        constraints: "unique across all Production rows; 2..16 chars uppercase alphanumeric"
      - name: format
        type: enum
        source: input
        description: delivery format of the production
        constraints: "one of FEATURE, SERIES_EPISODE, SHORT"
      - name: phase
        type: enum
        source: system
        description: production lifecycle phase driven by state_machines.Production
        default: PRE_PRODUCTION
        constraints: "one of PRE_PRODUCTION, PRODUCTION_ACTIVE, DELIVERY, WRAPPED"
      - name: budget_cents
        type: integer
        source: input
        description: approved production budget in cents
        constraints: ">= 0"
      - name: contingency_pct
        type: number
        source: input
        description: fraction of budget_cents released as contingency reserve
        default: 0.10
        constraints: "0 <= contingency_pct <= 0.50, 2 decimal places"
      - name: render_allowance_cents
        type: integer
        source: input
        description: ceiling on committed plus actual render farm spend for this production
        constraints: ">= 0"
      - name: master_color_space
        type: enum
        source: input
        description: mastering color space; MASTER_EXR deliverables must match it exactly
        constraints: "one of ACEScg, LogC, Rec709, sRGB"
      - name: approved_color_spaces
        type: array
        source: input
        description: color spaces any deliverable of this production may carry
        default: "[master_color_space]"
        constraints: "non-empty array of ACEScg|LogC|Rec709|sRGB; must contain master_color_space"
      - name: gate_types
        type: array
        source: input
        description: ordered pre-production gate set materialized at creation
        default: "[SCRIPT, STORYBOARD, ANIMATIC, DESIGN]"
        constraints: "non-empty subset of {SCRIPT, STORYBOARD, ANIMATIC, DESIGN}; stored in canonical order SCRIPT<STORYBOARD<ANIMATIC<DESIGN"
      - name: shot_count
        type: integer
        source: computed
        description: count of Shot rows with production_id equal to this Production.id
        default: 0
      - name: completed_shot_count
        type: integer
        source: computed
        description: count of Shot rows for this production whose status == COMPLETE
        default: 0
      - name: at_risk_shot_count
        type: integer
        source: computed
        description: count of Shot rows for this production whose escalation_flag == true
        default: 0
      - name: total_retake_count
        type: integer
        source: computed
        description: sum of Shot.retake_count over all Shot rows of this production
        default: 0
      - name: direct_committed_cents
        type: integer
        source: computed
        description: pre-overhead committed spend per calculations.production_budget_position
        default: 0
      - name: overhead_fee_cents
        type: integer
        source: computed
        description: studio overhead fee per calculations.production_budget_position
        default: 0
      - name: total_committed_cents
        type: integer
        source: computed
        description: direct_committed_cents + overhead_fee_cents
        default: 0
      - name: available_cents
        type: integer
        source: computed
        description: budget plus contingency minus total_committed_cents; may go negative only via cascades
        default: 0
      - name: render_committed_cents
        type: integer
        source: computed
        description: sum of Shot.render_cost_committed_cents over this production's shots
        default: 0
      - name: render_actual_cents
        type: integer
        source: computed
        description: sum of Shot.render_cost_actual_cents over this production's shots
        default: 0
      - name: bcwp_cents
        type: integer
        source: computed
        description: sum of Shot.bcwp_cents over this production's shots (STAGE_WEIGHT variant)
        default: 0
      - name: bcws_cents
        type: integer
        source: computed
        description: sum of Shot.bcws_cents over this production's shots, recomputed on every read
        default: 0
      - name: acwp_cents
        type: integer
        source: computed
        description: sum of Shot.acwp_cents over this production's shots
        default: 0
      - name: cpi
        type: number
        source: computed
        description: bcwp_cents / acwp_cents rounded to 4 decimals; null when acwp_cents == 0
      - name: spi
        type: number
        source: computed
        description: bcwp_cents / bcws_cents rounded to 4 decimals; null when bcws_cents == 0

  # -------------------------------------------------------- PreProductionGate
  - name: PreProductionGate
    parent: Production
    common_fields: true
    entity_kind: resource
    fields:
      - name: production_id
        type: string
        source: system
        description: "FK -> Production.id; set when the gate set is materialized at production creation"
      - name: gate_type
        type: enum
        source: system
        description: which pre-production artifact this gate approves
        constraints: "one of SCRIPT, STORYBOARD, ANIMATIC, DESIGN; unique per production_id"
      - name: sequence_index
        type: integer
        source: system
        description: canonical gate order SCRIPT=1, STORYBOARD=2, ANIMATIC=3, DESIGN=4
        constraints: "1..4"
      - name: status
        type: enum
        source: system
        description: gate approval state per state_machines.PreProductionGate
        default: DRAFT
        constraints: "one of DRAFT, IN_REVIEW, CHANGES_REQUESTED, APPROVED, LOCKED"
      - name: revision_count
        type: integer
        source: computed
        description: number of CHANGES_REQUESTED decisions this gate has received
        default: 0
      - name: package_url
        type: string
        source: input
        description: artifact bundle location supplied on submit; null before first submit
      - name: submitted_by_user_id
        type: string
        source: system
        description: X-User-ID of the most recent submit; null before first submit
      - name: decided_by_user_id
        type: string
        source: system
        description: X-User-ID of the most recent review decision; null before first decision
      - name: decided_at
        type: datetime
        source: system
        description: logical-clock timestamp of the most recent review decision

  # --------------------------------------------------------------------- Asset
  - name: Asset
    parent: Production
    common_fields: true
    entity_kind: resource
    fields:
      - name: production_id
        type: string
        source: input
        description: "FK -> Production.id; owning production of this asset"
      - name: derived_from_asset_id
        type: string
        source: input
        description: "FK -> Asset.id; reuse-library source this asset was derived from; null for an original build"
      - name: asset_code
        type: string
        source: input
        description: asset code unique within the production
        constraints: "unique per (production_id, asset_code)"
      - name: asset_type
        type: enum
        source: input
        description: discipline family of the asset
        constraints: "one of CHARACTER_MODEL, PROP, ENVIRONMENT, RIG, SURFACING_PACKAGE"
      - name: build_status
        type: enum
        source: system
        description: build dimension of state_machines.Asset.build_status
        default: BRIEFED
        constraints: "one of BRIEFED, MODELING, RIGGING, SURFACING, PUBLISHED, RETIRED"
      - name: library_status
        type: enum
        source: system
        description: reuse-library dimension of state_machines.Asset.library_status, independent of build_status
        default: PRIVATE
        constraints: "one of PRIVATE, LIBRARY_CANDIDATE, LIBRARY_APPROVED, LIBRARY_DEPRECATED"
      - name: base_complexity_points
        type: number
        source: input
        description: unreduced build effort estimate in complexity points
        constraints: "> 0, 2 decimal places"
      - name: reuse_depth
        type: integer
        source: computed
        description: number of derived_from_asset_id edges between this asset and its chain root
        default: 0
      - name: reuse_discount_pct
        type: number
        source: computed
        description: discount selected by calculations.asset_reuse_credit
        default: 0.00
      - name: effective_complexity_points
        type: number
        source: computed
        description: base_complexity_points after reuse discount per calculations.asset_reuse_credit
      - name: reuse_source_stale
        type: boolean
        source: computed
        description: true once any ancestor in the derived_from chain reached library_status LIBRARY_DEPRECATED
        default: false
      - name: library_submitted_by_user_id
        type: string
        source: system
        description: X-User-ID that submitted this asset to the reuse library; null before submission
      - name: library_decided_by_user_id
        type: string
        source: system
        description: X-User-ID that decided the library submission; null before decision

  # ---------------------------------------------------------------------- Shot
  - name: Shot
    parent: Production
    common_fields: true
    entity_kind: resource
    fields:
      - name: production_id
        type: string
        source: input
        description: "FK -> Production.id; owning production of this shot"
      - name: shot_code
        type: string
        source: input
        description: shot code unique within the production
        constraints: "unique per (production_id, shot_code)"
      - name: sequence_code
        type: string
        source: input
        description: sequence grouping label, e.g. 010
      - name: frame_count
        type: integer
        source: input
        description: rendered frame length of the shot
        constraints: ">= 1"
      - name: difficulty_factor
        type: number
        source: input
        description: complexity multiplier used in planning
        default: 1.0
        constraints: "0.5 <= difficulty_factor <= 3.0, 2 decimal places"
      - name: budget_cents
        type: integer
        source: input
        description: budget at completion (BAC) for this shot in cents
        constraints: ">= 0"
      - name: planned_start_at
        type: datetime
        source: input
        description: planned schedule start used as the BCWS accrual origin
      - name: planned_finish_at
        type: datetime
        source: input
        description: planned schedule finish used as the BCWS accrual end
        constraints: "must be strictly after planned_start_at"
      - name: status
        type: enum
        source: computed
        description: compound state derived from Production.phase and this shot's ShotStageTask statuses
        default: BLOCKED_PREPROD
        constraints: "one of BLOCKED_PREPROD, READY, IN_PRODUCTION, COMPLETE"
      - name: current_stage
        type: enum
        source: computed
        description: lowest stage_order ShotStageTask of this shot whose status != APPROVED; null when COMPLETE
        constraints: "one of LAYOUT, ANIMATION, EFFECTS, LIGHTING, COMP or null"
      - name: retake_count
        type: integer
        source: computed
        description: sum of ShotStageTask.revision_count over this shot's five stage tasks
        default: 0
      - name: escalation_flag
        type: boolean
        source: computed
        description: true once any ShotStageTask of this shot has escalated == true
        default: false
      - name: labor_cost_cents
        type: integer
        source: computed
        description: rounded labor spend from logged hours per calculations.shot_earned_value
        default: 0
      - name: render_cost_committed_cents
        type: integer
        source: computed
        description: sum of RenderJob.estimated_cost_cents over RESERVED jobs on this shot's tasks
        default: 0
      - name: render_cost_actual_cents
        type: integer
        source: computed
        description: sum of RenderJob.final_cost_cents over COMPLETED and FAILED jobs on this shot's tasks
        default: 0
      - name: bcwp_cents
        type: integer
        source: computed
        description: earned value, STAGE_WEIGHT variant of calculations.shot_earned_value
        default: 0
      - name: bcws_cents
        type: integer
        source: computed
        description: planned value at the current logical clock, recomputed on every read
        default: 0
      - name: acwp_cents
        type: integer
        source: computed
        description: labor_cost_cents + render_cost_actual_cents
        default: 0
      - name: cpi
        type: number
        source: computed
        description: bcwp_cents / acwp_cents rounded to 4 decimals; null when acwp_cents == 0
      - name: spi
        type: number
        source: computed
        description: bcwp_cents / bcws_cents rounded to 4 decimals; null when bcws_cents == 0

  # ------------------------------------------------------------- ShotStageTask
  - name: ShotStageTask
    parent: Shot
    common_fields: true
    entity_kind: resource
    fields:
      - name: shot_id
        type: string
        source: system
        description: "FK -> Shot.id; set when the five stage tasks are materialized at shot creation"
      - name: outsource_package_id
        type: string
        source: system
        description: "FK -> OutsourcePackage.id; set when a package listing this task is issued, cleared when the package is RECALLED"
      - name: stage
        type: enum
        source: system
        description: shot production stage this task tracks
        constraints: "one of LAYOUT, ANIMATION, EFFECTS, LIGHTING, COMP; unique per shot_id"
      - name: stage_order
        type: integer
        source: system
        description: LAYOUT=1, ANIMATION=2, EFFECTS=3, LIGHTING=4, COMP=5
        constraints: "1..5"
      - name: stage_weight_pct
        type: number
        source: system
        description: earned-value weight of this stage from calculations.shot_earned_value constants
        constraints: "one of 0.10, 0.40, 0.15, 0.15, 0.20 keyed by stage"
      - name: status
        type: enum
        source: system
        description: per-stage review state per state_machines.ShotStageTask
        default: NOT_STARTED
        constraints: "one of NOT_STARTED, IN_PROGRESS, SUBMITTED, IN_REVIEW, RETAKE, APPROVED"
      - name: budgeted_hours
        type: number
        source: input
        description: planned hours for this stage; seeded from the stage_budget_hours map supplied to POST /studio/shots, else 10.0
        default: 10.0
        constraints: "> 0, 2 decimal places"
      - name: actual_hours
        type: number
        source: computed
        description: cumulative hours logged against this task
        default: 0.00
      - name: revision_count
        type: integer
        source: computed
        description: number of RETAKE decisions this task has received
        default: 0
      - name: escalated
        type: boolean
        source: computed
        description: true once revision_count reached RETAKE_ESCALATION_THRESHOLD
        default: false
      - name: assigned_artist_user_id
        type: string
        source: system
        description: X-User-ID recorded by the assign action; null while NOT_STARTED
      - name: submitted_by_user_id
        type: string
        source: system
        description: X-User-ID of the most recent submit; compared against the decider for segregation of duties
      - name: reviewed_by_user_id
        type: string
        source: system
        description: X-User-ID of the most recent review decision
      - name: submitted_at
        type: datetime
        source: system
        description: logical-clock timestamp of the most recent submit
      - name: approved_at
        type: datetime
        source: system
        description: logical-clock timestamp of the APPROVED decision; cleared when the task returns to RETAKE

  # ------------------------------------------------------------- ScreeningRoom
  - name: ScreeningRoom
    parent: null
    common_fields: true
    entity_kind: configuration
    fields:
      - name: name
        type: string
        source: input
        description: room name
      - name: seat_capacity
        type: integer
        source: input
        description: maximum attendees a review session in this room may declare
        constraints: ">= 1"
      - name: turnover_buffer_minutes
        type: integer
        source: input
        description: mandatory idle minutes between two sessions in this room
        default: 30
        constraints: ">= 0"
      - name: room_color_space
        type: enum
        source: input
        description: projector calibration target of this room
        constraints: "one of ACEScg, LogC, Rec709, sRGB"
      - name: calibration_valid_days
        type: integer
        source: input
        description: number of days a calibration stays valid
        default: 30
        constraints: ">= 1"
      - name: last_calibrated_at
        type: datetime
        source: system
        description: logical-clock timestamp of the most recent calibrate action; null when never calibrated
      - name: calibration_status
        type: enum
        source: computed
        description: UNCALIBRATED when last_calibrated_at is null, EXPIRED when age in whole days > calibration_valid_days, else CALIBRATED; recomputed on every read
        default: UNCALIBRATED
        constraints: "one of UNCALIBRATED, CALIBRATED, EXPIRED"

  # -------------------------------------------------------------- ReviewSession
  - name: ReviewSession
    parent: Production
    common_fields: true
    entity_kind: resource
    fields:
      - name: production_id
        type: string
        source: input
        description: "FK -> Production.id; production being reviewed"
      - name: screening_room_id
        type: string
        source: input
        description: "FK -> ScreeningRoom.id; room occupied for the session window"
      - name: session_type
        type: enum
        source: input
        description: review kind; CLIENT_REVIEW carries the color-managed room requirements
        constraints: "one of DAILIES, DIRECTOR_REVIEW, CLIENT_REVIEW"
      - name: window_start
        type: datetime
        source: input
        description: inclusive start of the room occupation interval
      - name: window_end
        type: datetime
        source: input
        description: exclusive end of the room occupation interval
        constraints: "must be strictly after window_start"
      - name: attendee_count
        type: integer
        source: input
        description: declared attendees, checked against ScreeningRoom.seat_capacity
        default: 1
        constraints: ">= 1"
      - name: status
        type: enum
        source: system
        description: session state per state_machines.ReviewSession
        default: SCHEDULED
        constraints: "one of SCHEDULED, IN_PROGRESS, CLOSED, CANCELLED"
      - name: opened_at
        type: datetime
        source: system
        description: logical-clock timestamp of the start action
      - name: closed_at
        type: datetime
        source: system
        description: logical-clock timestamp of the close or cancel action
      - name: note_count
        type: integer
        source: computed
        description: count of DirectorNote rows with review_session_id equal to this session
        default: 0
      - name: retake_issued_count
        type: integer
        source: computed
        description: count of DirectorNote rows of this session whose status == RETAKE_ISSUED
        default: 0

  # --------------------------------------------------------------- DirectorNote
  - name: DirectorNote
    parent: ReviewSession
    common_fields: true
    entity_kind: resource
    fields:
      - name: review_session_id
        type: string
        source: input
        description: "FK -> ReviewSession.id; session in which the note was raised"
      - name: shot_stage_task_id
        type: string
        source: input
        description: "FK -> ShotStageTask.id; shot-level task the note is tracked against"
      - name: severity
        type: enum
        source: input
        description: MAJOR and BLOCKING notes issue a retake at session close; MINOR notes never do
        constraints: "one of MINOR, MAJOR, BLOCKING"
      - name: note_text
        type: string
        source: input
        description: director note body
        constraints: 1..2000 chars
      - name: status
        type: enum
        source: system
        description: note lifecycle per state_machines.DirectorNote
        default: OPEN
        constraints: "one of OPEN, RETAKE_ISSUED, RESOLVED, WAIVED"
      - name: raised_by_user_id
        type: string
        source: system
        description: X-User-ID of the director who raised the note
      - name: resolved_by_user_id
        type: string
        source: system
        description: X-User-ID that resolved or waived the note; null while OPEN or RETAKE_ISSUED

  # ----------------------------------------------------------------- RenderPool
  - name: RenderPool
    parent: null
    common_fields: true
    entity_kind: configuration
    fields:
      - name: name
        type: string
        source: input
        description: render farm pool name
      - name: total_cores
        type: integer
        source: input
        description: total schedulable cores in the pool
        constraints: ">= 1"
      - name: cost_per_core_hour_cents
        type: integer
        source: input
        description: billing rate per core hour in cents
        constraints: ">= 1"
      - name: committed_core_hours
        type: number
        source: computed
        description: sum of RenderJob.committed_core_hours over jobs on this pool whose status == RESERVED, 2 decimal places
        default: 0.00
      - name: reserved_job_count
        type: integer
        source: computed
        description: count of RenderJob rows on this pool whose status == RESERVED
        default: 0

  # ------------------------------------------------------------------ RenderJob
  - name: RenderJob
    parent: RenderPool
    common_fields: true
    entity_kind: resource
    fields:
      - name: render_pool_id
        type: string
        source: input
        description: "FK -> RenderPool.id; pool whose cores are reserved"
      - name: shot_stage_task_id
        type: string
        source: input
        description: "FK -> ShotStageTask.id; task whose frames are rendered"
      - name: priority
        type: enum
        source: input
        description: scheduling priority driving headroom and preemption
        default: NORMAL
        constraints: "one of LOW, NORMAL, HIGH, CRITICAL"
      - name: requested_cores
        type: integer
        source: input
        description: cores held for the whole window
        constraints: ">= 1"
      - name: window_start
        type: datetime
        source: input
        description: inclusive start of the core reservation interval
      - name: window_end
        type: datetime
        source: input
        description: exclusive end of the core reservation interval
        constraints: "must be strictly after window_start"
      - name: frame_count
        type: integer
        source: input
        description: frames this job renders
        constraints: ">= 1"
      - name: seconds_per_frame
        type: number
        source: input
        description: estimated wall seconds per frame used for cost estimation
        constraints: "> 0, 2 decimal places"
      - name: actual_seconds_per_frame
        type: number
        source: system
        description: wall seconds per frame reported by the complete action; null while RESERVED
      - name: frames_completed
        type: integer
        source: system
        description: frames actually rendered as reported by the complete action; null while RESERVED
      - name: status
        type: enum
        source: system
        description: job state per state_machines.RenderJob
        default: RESERVED
        constraints: "one of RESERVED, COMPLETED, FAILED, CANCELLED, PREEMPTED"
      - name: cost_per_frame_cents
        type: integer
        source: computed
        description: rounded per-frame cost per calculations.render_job_cost
      - name: estimated_cost_cents
        type: integer
        source: computed
        description: cost_per_frame_cents * frame_count fixed at reservation time
      - name: final_cost_cents
        type: integer
        source: computed
        description: settled cost from actual_seconds_per_frame and frames_completed; null until COMPLETED or FAILED
      - name: committed_core_hours
        type: number
        source: computed
        description: requested_cores * (window_end - window_start) in hours, 2 decimal places
      - name: preempted_by_render_job_id
        type: string
        source: system
        description: "FK -> RenderJob.id; CRITICAL job whose admission preempted this job; null unless status == PREEMPTED"

  # ------------------------------------------------------------ OutsourcePartner
  - name: OutsourcePartner
    parent: null
    common_fields: true
    entity_kind: resource
    fields:
      - name: legal_name
        type: string
        source: input
        description: partner legal entity name
      - name: security_certification_level
        type: enum
        source: input
        description: highest package security tier this partner is certified to receive
        default: NONE
        constraints: "one of NONE, TIER1, TIER2, TIER3 ordered NONE < TIER1 < TIER2 < TIER3"
      - name: mfa_enforced
        type: boolean
        source: input
        description: partner enforces multi-factor auth on its pipeline
        default: false
      - name: watermark_required
        type: boolean
        source: input
        description: deliveries from this partner must carry a forensic watermark
        default: true
      - name: status
        type: enum
        source: system
        description: partner state per state_machines.OutsourcePartner
        default: ONBOARDING
        constraints: "one of ONBOARDING, APPROVED, SUSPENDED"
      - name: quality_score_rolling
        type: number
        source: computed
        description: ROLLING_90D variant of calculations.partner_quality_score, recomputed on every read
        default: 50.00
      - name: quality_score_lifetime
        type: number
        source: computed
        description: LIFETIME variant of calculations.partner_quality_score, recomputed on every read
        default: 50.00
      - name: qc_decided_package_count
        type: integer
        source: computed
        description: count of OutsourcePackage rows of this partner whose qc_decided_at is not null
        default: 0

  # ------------------------------------------------------------ OutsourcePackage
  - name: OutsourcePackage
    parent: Production
    common_fields: true
    entity_kind: resource
    fields:
      - name: production_id
        type: string
        source: input
        description: "FK -> Production.id; production the package draws work from"
      - name: partner_id
        type: string
        source: input
        description: "FK -> OutsourcePartner.id; vendor the package is issued to"
      - name: package_code
        type: string
        source: input
        description: package code unique within the production
        constraints: "unique per (production_id, package_code)"
      - name: security_tier
        type: enum
        source: input
        description: security classification the partner must be certified for
        constraints: "one of TIER1, TIER2, TIER3"
      - name: quality_min_score
        type: number
        source: input
        description: minimum partner rolling quality score required at issue time
        default: 70.00
        constraints: "0 <= quality_min_score <= 100, 2 decimal places"
      - name: fee_cents
        type: integer
        source: input
        description: agreed package fee in cents
        constraints: ">= 0"
      - name: fee_committed_cents
        type: integer
        source: computed
        description: fee_cents once the partner accepts, 0 while DRAFT or ISSUED and 0 again after RECALLED
        default: 0
      - name: stage_task_ids
        type: array
        source: input
        description: array of ShotStageTask.id values in package scope; each task must belong to a Shot of production_id
        default: "[]"
      - name: status
        type: enum
        source: system
        description: package state per state_machines.OutsourcePackage
        default: DRAFT
        constraints: "one of DRAFT, ISSUED, IN_PROGRESS, DELIVERED, QC_PASSED, QC_FAILED, RECALLED"
      - name: watermark_applied
        type: boolean
        source: system
        description: watermark flag asserted by the partner on the most recent delivery
        default: false
      - name: delivery_count
        type: integer
        source: computed
        description: number of deliver actions accepted on this package
        default: 0
      - name: qc_score
        type: integer
        source: system
        description: 0..100 quality score recorded by the QC decision; null before the first decision
      - name: qc_decided_at
        type: datetime
        source: system
        description: logical-clock timestamp of the most recent QC decision; drives quality-score decay windows

  # ---------------------------------------------------------------- Deliverable
  - name: Deliverable
    parent: Production
    common_fields: true
    entity_kind: resource
    fields:
      - name: production_id
        type: string
        source: input
        description: "FK -> Production.id; production the deliverable belongs to"
      - name: shot_id
        type: string
        source: input
        description: "FK -> Shot.id; shot scope of the deliverable; null for a production-wide deliverable"
      - name: deliverable_type
        type: enum
        source: input
        description: deliverable specification family
        constraints: "one of MASTER_EXR, PROXY_MP4, AUDIO_STEM, SHOT_PLATE"
      - name: color_space
        type: enum
        source: input
        description: color space of the media; MASTER_EXR must equal Production.master_color_space
        constraints: "one of ACEScg, LogC, Rec709, sRGB"
      - name: resolution
        type: string
        source: input
        description: pixel dimensions, e.g. 3840x2160
        constraints: "matches ^[0-9]{3,5}x[0-9]{3,5}$"
      - name: frame_rate
        type: number
        source: input
        description: frames per second of the deliverable
        default: 24.0
        constraints: "one of 23.976, 24.0, 25.0, 29.97, 30.0"
      - name: bit_depth
        type: integer
        source: input
        description: bits per channel
        default: 16
        constraints: "one of 8, 10, 12, 16"
      - name: version_index
        type: integer
        source: computed
        description: 1-based index within the (production_id, shot_id, deliverable_type) group per calculations.deliverable_version_label
      - name: version_label
        type: string
        source: computed
        description: zero-padded version label vNN derived from version_index
      - name: status
        type: enum
        source: system
        description: deliverable state per state_machines.Deliverable
        default: DRAFT
        constraints: "one of DRAFT, SUBMITTED, QC_PASSED, QC_FAILED, DELIVERED, SUPERSEDED"
      - name: qc_note
        type: string
        source: system
        description: reviewer note captured by the QC decision
      - name: delivered_at
        type: datetime
        source: system
        description: logical-clock timestamp of the deliver action

state_machines:
  # ------------------------------------------------------------------ Production
  - entity: Production
    state_field: phase
    shape: compound
    initial_state: PRE_PRODUCTION
    terminal_states: [WRAPPED]
    transitions:
      - from: PRE_PRODUCTION
        to: PRODUCTION_ACTIVE
        trigger: "system: the last PreProductionGate of this production reached APPROVED"
        actor: system
        preconditions:
          - "every PreProductionGate row with production_id == this production has status == APPROVED"
          - "phase == PRE_PRODUCTION"
        side_effects:
          - "every PreProductionGate of this production transitions APPROVED -> LOCKED"
          - "every Shot of this production recomputes status BLOCKED_PREPROD -> READY"
          - "bcws_cents / spi recomputed per calculations.shot_earned_value on next read"
          - "increments Production.version by 1"
        note: "PRODUCTION_ACTIVE is never requested directly; POST /studio/productions/{id}/advance-phase accepts only DELIVERY and WRAPPED."
      - from: PRODUCTION_ACTIVE
        to: DELIVERY
        trigger: "POST /studio/productions/{id}/advance-phase with to_phase DELIVERY"
        actor: ProductionManager
        preconditions:
          - "phase == PRODUCTION_ACTIVE"
          - "completed_shot_count == shot_count, else ERR_SHOTS_INCOMPLETE; the check passes vacuously when shot_count == 0"
        side_effects:
          - "POST /studio/shots is rejected for this production afterwards with ERR_PRODUCTION_PHASE_INVALID"
          - "increments Production.version by 1"
      - from: DELIVERY
        to: WRAPPED
        trigger: "POST /studio/productions/{id}/advance-phase with to_phase WRAPPED"
        actor: ProductionManager
        preconditions:
          - "phase == DELIVERY"
          - "at least one Deliverable of this production has status == DELIVERED and no Deliverable has status in {DRAFT, SUBMITTED, QC_PASSED}, else ERR_DELIVERABLES_INCOMPLETE"
        side_effects:
          - "all write endpoints on this production's children are rejected afterwards with ERR_PRODUCTION_PHASE_INVALID"
          - "increments Production.version by 1"

  # ----------------------------------------------------------- PreProductionGate
  - entity: PreProductionGate
    state_field: status
    shape: cyclic
    initial_state: DRAFT
    terminal_states: [LOCKED]
    transitions:
      - from: DRAFT
        to: IN_REVIEW
        trigger: "POST /studio/pre-production-gates/{id}/submit"
        actor: ProductionManager
        preconditions:
          - "production.phase == PRE_PRODUCTION, else ERR_PRODUCTION_PHASE_INVALID"
          - "every PreProductionGate of the same production with a smaller sequence_index has status == APPROVED, else ERR_GATE_SEQUENCE_VIOLATION"
        side_effects:
          - "package_url stored from the request"
          - "submitted_by_user_id = X-User-ID"
          - "increments PreProductionGate.version by 1"
      - from: IN_REVIEW
        to: CHANGES_REQUESTED
        trigger: "POST /studio/pre-production-gates/{id}/review-decision with decision CHANGES_REQUESTED"
        actor: Director
        preconditions:
          - "status == IN_REVIEW, else ERR_GATE_STATE_INVALID"
          - "X-User-ID != submitted_by_user_id, else ERR_SEGREGATION_OF_DUTIES"
        side_effects:
          - "revision_count += 1"
          - "decided_by_user_id = X-User-ID, decided_at = logical clock now"
      - from: CHANGES_REQUESTED
        to: IN_REVIEW
        trigger: "POST /studio/pre-production-gates/{id}/submit (revision loop)"
        actor: ProductionManager
        preconditions:
          - "production.phase == PRE_PRODUCTION"
          - "sequence predecessors APPROVED"
        side_effects:
          - "package_url replaced, submitted_by_user_id = X-User-ID"
        note: "This edge closes the cycle DRAFT -> IN_REVIEW -> CHANGES_REQUESTED -> IN_REVIEW; revision_count is never reset."
      - from: IN_REVIEW
        to: APPROVED
        trigger: "POST /studio/pre-production-gates/{id}/review-decision with decision APPROVED"
        actor: Director
        preconditions:
          - "status == IN_REVIEW"
          - "X-User-ID != submitted_by_user_id"
        side_effects:
          - "decided_by_user_id / decided_at set"
          - "if every gate of the production is now APPROVED, Production transitions PRE_PRODUCTION -> PRODUCTION_ACTIVE (bubble up)"
      - from: APPROVED
        to: LOCKED
        trigger: "system: owning Production entered PRODUCTION_ACTIVE"
        actor: system
        preconditions:
          - "production.phase == PRODUCTION_ACTIVE"
        side_effects:
          - "gate becomes immutable; further submit attempts return ERR_GATE_STATE_INVALID"

  # ----------------------------------------------------- Asset (build dimension)
  - entity: Asset
    state_field: build_status
    shape: linear_with_terminal_cascade
    initial_state: BRIEFED
    terminal_states: [RETIRED]
    transitions:
      - from: BRIEFED
        to: MODELING
        trigger: "POST /studio/assets/{id}/advance-build with to_build_status MODELING"
        actor: Artist
        preconditions:
          - "production.phase in {PRE_PRODUCTION, PRODUCTION_ACTIVE}, else ERR_PRODUCTION_PHASE_INVALID"
          - "to_build_status is exactly the next state in BRIEFED<MODELING<RIGGING<SURFACING<PUBLISHED, else ERR_ASSET_BUILD_STATE_INVALID"
        side_effects: ["increments Asset.version by 1"]
      - from: MODELING
        to: RIGGING
        trigger: "POST /studio/assets/{id}/advance-build with to_build_status RIGGING"
        actor: Artist
        preconditions: ["to_build_status is the immediate successor"]
        side_effects: ["increments Asset.version by 1"]
      - from: RIGGING
        to: SURFACING
        trigger: "POST /studio/assets/{id}/advance-build with to_build_status SURFACING"
        actor: Artist
        preconditions: ["to_build_status is the immediate successor"]
        side_effects: ["increments Asset.version by 1"]
      - from: SURFACING
        to: PUBLISHED
        trigger: "POST /studio/assets/{id}/advance-build with to_build_status PUBLISHED"
        actor: Artist
        preconditions: ["to_build_status is the immediate successor"]
        side_effects:
          - "asset becomes eligible for library submission (library_status dimension)"
          - "increments Asset.version by 1"
      - from: PUBLISHED
        to: RETIRED
        trigger: "POST /studio/assets/{id}/advance-build with to_build_status RETIRED"
        actor: Artist
        preconditions:
          - "build_status == PUBLISHED, else ERR_ASSET_BUILD_STATE_INVALID"
        side_effects:
          - "if library_status == LIBRARY_APPROVED then library_status -> LIBRARY_DEPRECATED (cross-dimension cascade)"
          - "that deprecation sets reuse_source_stale = true on every Asset whose derived_from_asset_id chain contains this asset, walking descendants in created_at ASC order"
          - "each such descendant recomputes reuse_discount_pct -> 0.00 and effective_complexity_points -> base_complexity_points per calculations.asset_reuse_credit"
          - "increments Asset.version by 1 on this asset and on every mutated descendant"

  # --------------------------------------------------- Asset (library dimension)
  - entity: Asset
    state_field: library_status
    shape: branching
    initial_state: PRIVATE
    terminal_states: [LIBRARY_DEPRECATED]
    transitions:
      - from: PRIVATE
        to: LIBRARY_CANDIDATE
        trigger: "POST /studio/assets/{id}/library-submit"
        actor: Artist
        preconditions:
          - "build_status == PUBLISHED, else ERR_ASSET_BUILD_STATE_INVALID"
          - "library_status == PRIVATE, else ERR_ASSET_LIBRARY_STATE_INVALID"
        side_effects:
          - "library_submitted_by_user_id = X-User-ID"
          - "build_status is NOT changed by this transition (parallel dimensions)"
      - from: LIBRARY_CANDIDATE
        to: LIBRARY_APPROVED
        trigger: "POST /studio/assets/{id}/library-decision with decision APPROVED"
        actor: Supervisor
        preconditions:
          - "library_status == LIBRARY_CANDIDATE"
          - "X-User-ID != library_submitted_by_user_id, else ERR_SEGREGATION_OF_DUTIES"
        side_effects:
          - "library_decided_by_user_id = X-User-ID"
          - "asset becomes a legal derived_from_asset_id source that grants a reuse discount"
      - from: LIBRARY_CANDIDATE
        to: PRIVATE
        trigger: "POST /studio/assets/{id}/library-decision with decision REJECTED"
        actor: Supervisor
        preconditions:
          - "library_status == LIBRARY_CANDIDATE"
          - "X-User-ID != library_submitted_by_user_id"
        side_effects:
          - "library_decided_by_user_id = X-User-ID; the asset may be resubmitted (library cycle)"
      - from: LIBRARY_APPROVED
        to: LIBRARY_DEPRECATED
        trigger: "system: build_status reached RETIRED"
        actor: system
        preconditions: ["build_status == RETIRED"]
        side_effects:
          - "descendants recompute reuse credit as described in the build dimension RETIRED transition"

  # ------------------------------------------------------------------------ Shot
  - entity: Shot
    state_field: status
    shape: compound
    initial_state: BLOCKED_PREPROD
    terminal_states: []
    transitions:
      - from: BLOCKED_PREPROD
        to: READY
        trigger: "system: owning Production entered PRODUCTION_ACTIVE"
        actor: system
        preconditions: ["production.phase != PRE_PRODUCTION"]
        side_effects: ["increments Shot.version by 1"]
      - from: READY
        to: IN_PRODUCTION
        trigger: "system: any ShotStageTask of this shot entered IN_PROGRESS, SUBMITTED, IN_REVIEW or RETAKE"
        actor: system
        preconditions: ["production.phase in {PRODUCTION_ACTIVE, DELIVERY}"]
        side_effects: ["increments Shot.version by 1"]
      - from: IN_PRODUCTION
        to: COMPLETE
        trigger: "system: all five ShotStageTask rows of this shot reached APPROVED"
        actor: system
        preconditions: ["count of this shot's tasks with status == APPROVED equals 5"]
        side_effects:
          - "production.completed_shot_count recomputed"
          - "increments Shot.version by 1"
      - from: COMPLETE
        to: IN_PRODUCTION
        trigger: "system: an APPROVED ShotStageTask of this shot returned to RETAKE"
        actor: system
        preconditions: ["at least one task of this shot has status != APPROVED"]
        side_effects:
          - "production.completed_shot_count recomputed downward"
          - "bcwp_cents recomputed per calculations.shot_earned_value (the retaken stage loses its credit)"
        note: "Shot has no terminal state: a director note raised on an APPROVED COMP task can reopen a COMPLETE shot."

  # --------------------------------------------------------------- ShotStageTask
  - entity: ShotStageTask
    state_field: status
    shape: cyclic
    initial_state: NOT_STARTED
    terminal_states: []
    transitions:
      - from: NOT_STARTED
        to: IN_PROGRESS
        trigger: "POST /studio/stage-tasks/{id}/assign"
        actor: ProductionManager
        preconditions:
          - "shot.production.phase == PRODUCTION_ACTIVE, else ERR_PRODUCTION_PHASE_INVALID"
          - "for stage_order > 1, the sibling task of the same shot with stage_order - 1 has status == APPROVED, else ERR_PREVIOUS_STAGE_NOT_APPROVED"
          - "status == NOT_STARTED, else ERR_TASK_STATE_INVALID"
        side_effects:
          - "assigned_artist_user_id set from the request"
          - "budgeted_hours replaced when budgeted_hours supplied in the request"
          - "shot.current_stage = this task's stage; shot.status recomputed READY -> IN_PRODUCTION"
          - "increments ShotStageTask.version by 1"
      - from: IN_PROGRESS
        to: SUBMITTED
        trigger: "POST /studio/stage-tasks/{id}/submit"
        actor: Artist
        preconditions:
          - "shot.production.phase == PRODUCTION_ACTIVE"
          - "X-User-ID == assigned_artist_user_id, or the caller is the PartnerRepresentative of outsource_package_id, else ERR_NOT_TASK_OWNER"
          - "when outsource_package_id is set, that package has status == IN_PROGRESS, else ERR_PACKAGE_STATE_INVALID"
        side_effects:
          - "submitted_by_user_id = X-User-ID, submitted_at = logical clock now"
          - "actual_hours incremented by hours supplied at submit time when present"
      - from: RETAKE
        to: SUBMITTED
        trigger: "POST /studio/stage-tasks/{id}/submit (retake loop)"
        actor: Artist
        preconditions:
          - "shot.production.phase == PRODUCTION_ACTIVE"
          - "X-User-ID == assigned_artist_user_id or the package representative"
        side_effects:
          - "submitted_by_user_id = X-User-ID, submitted_at refreshed"
          - "revision_count is NOT reset; escalated stays true once set"
        note: "Closes the cycle SUBMITTED -> IN_REVIEW -> RETAKE -> SUBMITTED."
      - from: SUBMITTED
        to: IN_REVIEW
        trigger: "system: a DirectorNote was created against this task"
        actor: system
        preconditions: ["status == SUBMITTED"]
        side_effects:
          - "no counters change; a task already IN_REVIEW or APPROVED keeps its status when further notes are raised"
      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /studio/stage-tasks/{id}/review-decision with decision APPROVED"
        actor: Supervisor
        preconditions:
          - "status in {SUBMITTED, IN_REVIEW}, else ERR_TASK_STATE_INVALID"
          - "X-User-ID != submitted_by_user_id, else ERR_SEGREGATION_OF_DUTIES"
        side_effects:
          - "approved_at = logical clock now, reviewed_by_user_id = X-User-ID"
          - "shot.bcwp_cents recomputed per calculations.shot_earned_value (this stage's weight is now earned)"
          - "shot.status recomputed; COMPLETE once all five tasks are APPROVED, which recomputes production.completed_shot_count"
      - from: IN_REVIEW
        to: APPROVED
        trigger: "POST /studio/stage-tasks/{id}/review-decision with decision APPROVED"
        actor: Supervisor
        preconditions:
          - "X-User-ID != submitted_by_user_id"
        side_effects:
          - "same as SUBMITTED -> APPROVED; DirectorNote rows on this task stay OPEN/RETAKE_ISSUED until resolved explicitly"
      - from: SUBMITTED
        to: RETAKE
        trigger: "POST /studio/stage-tasks/{id}/review-decision with decision RETAKE, or system: the owning OutsourcePackage failed QC or was recalled"
        actor: Supervisor
        preconditions:
          - "status in {SUBMITTED, IN_REVIEW}"
          - "X-User-ID != submitted_by_user_id"
        side_effects:
          - "revision_count += 1; escalated = true once revision_count >= calculations.stage_retake_escalation.constants.RETAKE_ESCALATION_THRESHOLD"
          - "when escalated flips true: shot.escalation_flag = true and production.at_risk_shot_count recomputed"
          - "shot.retake_count and production.total_retake_count recomputed"
      - from: IN_REVIEW
        to: RETAKE
        trigger: "POST /studio/stage-tasks/{id}/review-decision with decision RETAKE, or system: the owning OutsourcePackage failed QC or was recalled"
        actor: Supervisor
        preconditions: ["X-User-ID != submitted_by_user_id"]
        side_effects: ["same as SUBMITTED -> RETAKE"]
      - from: APPROVED
        to: RETAKE
        trigger: "system: a MAJOR or BLOCKING DirectorNote targeting this task was issued when its ReviewSession closed, or the owning OutsourcePackage failed QC or was recalled"
        actor: system
        preconditions: ["status == APPROVED"]
        side_effects:
          - "approved_at cleared; revision_count += 1"
          - "shot.bcwp_cents recomputed downward (the stage loses its earned credit)"
          - "shot.status recomputed COMPLETE -> IN_PRODUCTION; production.completed_shot_count recomputed downward"
        note: "This edge makes APPROVED non-terminal: an approved stage can be reopened from the review or outsourcing aggregate."

  # ----------------------------------------------------------------ReviewSession
  - entity: ReviewSession
    state_field: status
    shape: branching
    initial_state: SCHEDULED
    terminal_states: [CLOSED, CANCELLED]
    transitions:
      - from: SCHEDULED
        to: IN_PROGRESS
        trigger: "POST /studio/review-sessions/{id}/start"
        actor: Director
        preconditions:
          - "status == SCHEDULED, else ERR_SESSION_STATE_INVALID"
          - "production.phase in {PRODUCTION_ACTIVE, DELIVERY}, else ERR_PRODUCTION_PHASE_INVALID"
          - "screening_room.calibration_status == CALIBRATED at the moment of the call, else ERR_CALIBRATION_EXPIRED"
        side_effects:
          - "opened_at = logical clock now"
          - "DirectorNote rows may now be created against this session"
      - from: IN_PROGRESS
        to: CLOSED
        trigger: "POST /studio/review-sessions/{id}/close"
        actor: Director
        preconditions:
          - "status == IN_PROGRESS, else ERR_SESSION_STATE_INVALID"
        side_effects:
          - "closed_at = logical clock now"
          - "each DirectorNote of this session with status == OPEN and severity in {MAJOR, BLOCKING}, processed in created_at ASC order, transitions OPEN -> RETAKE_ISSUED"
          - "each such note whose target ShotStageTask has status in {SUBMITTED, IN_REVIEW, APPROVED} drives that task to RETAKE with revision_count += 1 (conditional cascade)"
          - "notes with severity == MINOR stay OPEN and issue no retake"
          - "notes whose target task is NOT_STARTED, IN_PROGRESS or already RETAKE stay OPEN and issue no retake"
          - "retake_issued_count set to the number of notes moved to RETAKE_ISSUED"
          - "affected shots recompute retake_count, escalation_flag and status; production recomputes total_retake_count, at_risk_shot_count and completed_shot_count"
      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /studio/review-sessions/{id}/cancel"
        actor: Director
        preconditions: ["status in {SCHEDULED, IN_PROGRESS}, else ERR_SESSION_STATE_INVALID"]
        side_effects:
          - "closed_at = logical clock now"
          - "every DirectorNote of this session with status == OPEN transitions to WAIVED and issues no retake (compensation)"
          - "the session's window no longer participates in screening room overlap checks, freeing the room"
      - from: IN_PROGRESS
        to: CANCELLED
        trigger: "POST /studio/review-sessions/{id}/cancel"
        actor: Director
        preconditions: ["status == IN_PROGRESS"]
        side_effects: ["same as SCHEDULED -> CANCELLED"]

  # ----------------------------------------------------------------- DirectorNote
  - entity: DirectorNote
    state_field: status
    shape: branching
    initial_state: OPEN
    terminal_states: [RESOLVED, WAIVED]
    transitions:
      - from: OPEN
        to: RETAKE_ISSUED
        trigger: "system: owning ReviewSession was closed and severity is MAJOR or BLOCKING"
        actor: system
        preconditions:
          - "severity in {MAJOR, BLOCKING}"
          - "target ShotStageTask status in {SUBMITTED, IN_REVIEW, APPROVED}"
        side_effects:
          - "target task driven to RETAKE as described in ReviewSession IN_PROGRESS -> CLOSED"
      - from: OPEN
        to: RESOLVED
        trigger: "POST /studio/director-notes/{id}/resolution with resolution RESOLVED"
        actor: Director
        preconditions:
          - "target ShotStageTask status == APPROVED, else ERR_TASK_STATE_INVALID"
          - "status in {OPEN, RETAKE_ISSUED}, else ERR_NOTE_STATE_INVALID"
        side_effects:
          - "resolved_by_user_id = X-User-ID"
          - "when this was the last non-terminal BLOCKING note of the production, Deliverable submission is unblocked"
      - from: RETAKE_ISSUED
        to: RESOLVED
        trigger: "POST /studio/director-notes/{id}/resolution with resolution RESOLVED"
        actor: Director
        preconditions:
          - "target ShotStageTask status == APPROVED"
        side_effects: ["resolved_by_user_id = X-User-ID"]
      - from: OPEN
        to: WAIVED
        trigger: "POST /studio/director-notes/{id}/resolution with resolution WAIVED, or system when the session is cancelled"
        actor: Director
        preconditions: ["status in {OPEN, RETAKE_ISSUED}"]
        side_effects:
          - "resolved_by_user_id = X-User-ID (null when waived by session cancellation)"
          - "no retake is issued and no counter on Shot or Production changes"
      - from: RETAKE_ISSUED
        to: WAIVED
        trigger: "POST /studio/director-notes/{id}/resolution with resolution WAIVED"
        actor: Director
        preconditions: ["status == RETAKE_ISSUED"]
        side_effects:
          - "the retake already issued to the target task is NOT reverted (waiving the note does not restore the task)"

  # ------------------------------------------------------------------- RenderJob
  - entity: RenderJob
    state_field: status
    shape: branching
    initial_state: RESERVED
    terminal_states: [COMPLETED, FAILED, CANCELLED, PREEMPTED]
    transitions:
      - from: null
        to: RESERVED
        trigger: "POST /studio/render-jobs"
        actor: ProductionManager
        preconditions:
          - "expected_render_pool_version == render_pool.version, else ERR_STALE_RENDER_POOL_VERSION"
          - "window_start < window_end and window_start >= logical clock now, else ERR_INVALID_WINDOW"
          - "target ShotStageTask status in {IN_PROGRESS, SUBMITTED, IN_REVIEW, RETAKE}, else ERR_TASK_STATE_INVALID"
          - "admission succeeds per calculations.render_pool_admission, else ERR_RENDER_CAPACITY_EXCEEDED"
          - "production.render_committed_cents + production.render_actual_cents + estimated_cost_cents <= production.render_allowance_cents, else ERR_RENDER_BUDGET_EXCEEDED"
        side_effects:
          - "cost_per_frame_cents and estimated_cost_cents computed per calculations.render_job_cost from seconds_per_frame"
          - "committed_core_hours computed as requested_cores * window hours"
          - "render_pool.committed_core_hours and reserved_job_count recomputed; render_pool.version += 1"
          - "shot.render_cost_committed_cents recomputed, then production.render_committed_cents recomputed (ledger sync)"
          - "when priority == CRITICAL and free capacity is short, the selected victim jobs transition RESERVED -> PREEMPTED before this job is admitted"
      - from: RESERVED
        to: PREEMPTED
        trigger: "system: a CRITICAL RenderJob was admitted to the same pool over an intersecting window"
        actor: system
        preconditions:
          - "status == RESERVED and priority in {LOW, NORMAL}"
          - "this job's window intersects the incoming CRITICAL job's window (half-open comparison)"
        side_effects:
          - "preempted_by_render_job_id set to the admitting CRITICAL job"
          - "committed_core_hours released: render_pool.committed_core_hours and reserved_job_count recomputed"
          - "estimated_cost_cents no longer counts toward shot.render_cost_committed_cents, so that field and production.render_committed_cents both decrease"
          - "final_cost_cents stays null (a preempted job is never billed)"
      - from: RESERVED
        to: COMPLETED
        trigger: "POST /studio/render-jobs/{id}/complete with outcome COMPLETED"
        actor: ProductionManager
        preconditions:
          - "status == RESERVED, else ERR_RENDER_JOB_STATE_INVALID"
          - "frames_completed == frame_count when outcome is COMPLETED, else ERR_VALIDATION"
        side_effects:
          - "actual_seconds_per_frame stored; cost_per_frame_cents and final_cost_cents recomputed per calculations.render_job_cost using the actual seconds"
          - "committed core hours released from render_pool"
          - "shot.render_cost_actual_cents, shot.acwp_cents and shot.cpi recomputed; production.render_actual_cents, acwp_cents, cpi recomputed"
      - from: RESERVED
        to: FAILED
        trigger: "POST /studio/render-jobs/{id}/complete with outcome FAILED"
        actor: ProductionManager
        preconditions:
          - "status == RESERVED"
          - "frames_completed < frame_count when outcome is FAILED, else ERR_VALIDATION"
        side_effects:
          - "final_cost_cents billed over frames_completed only (partial settlement); cost_per_frame_cents recomputed from actual_seconds_per_frame"
          - "committed core hours released; the same shot and production ledger fields reconcile as for COMPLETED"
      - from: RESERVED
        to: CANCELLED
        trigger: "POST /studio/render-jobs/{id}/cancel"
        actor: ProductionManager
        preconditions:
          - "status == RESERVED"
        side_effects:
          - "final_cost_cents stays null; frames_completed stays 0"
          - "render_pool.committed_core_hours returns to exactly its pre-reservation value and reserved_job_count decrements (compensating invariant)"
          - "shot.render_cost_committed_cents and production.render_committed_cents return to their pre-reservation values"
          - "render_pool.version += 1"

  # ------------------------------------------------------------- OutsourcePartner
  - entity: OutsourcePartner
    state_field: status
    shape: cyclic
    initial_state: ONBOARDING
    terminal_states: []
    transitions:
      - from: ONBOARDING
        to: APPROVED
        trigger: "POST /studio/outsource-partners/{id}/status with status APPROVED"
        actor: OutsourceCoordinator
        preconditions:
          - "security_certification_level != NONE, else ERR_SECURITY_REQUIREMENT_UNMET"
        side_effects:
          - "packages may now be issued to this partner"
      - from: APPROVED
        to: SUSPENDED
        trigger: "POST /studio/outsource-partners/{id}/status with status SUSPENDED"
        actor: OutsourceCoordinator
        preconditions:
          - "status == APPROVED, else ERR_PARTNER_STATE_INVALID"
        side_effects:
          - "every OutsourcePackage of this partner with status in {ISSUED, IN_PROGRESS, DELIVERED}, processed in created_at ASC order, transitions to RECALLED"
          - "each recalled package sets fee_committed_cents = 0, which recomputes production.direct_committed_cents, overhead_fee_cents, total_committed_cents and available_cents (compensation)"
          - "every ShotStageTask whose outsource_package_id is a recalled package and whose status is in {IN_PROGRESS, SUBMITTED, IN_REVIEW, APPROVED} transitions to RETAKE with revision_count += 1 and outsource_package_id cleared"
          - "affected shots recompute retake_count, escalation_flag and status; production recomputes total_retake_count, at_risk_shot_count and completed_shot_count"
      - from: SUSPENDED
        to: APPROVED
        trigger: "POST /studio/outsource-partners/{id}/status with status APPROVED (reinstatement)"
        actor: OutsourceCoordinator
        preconditions:
          - "status == SUSPENDED"
        side_effects:
          - "already recalled packages are NOT restored and already issued retakes are NOT reverted; only new packages may be issued"
        note: "Closes the cycle ONBOARDING -> APPROVED -> SUSPENDED -> APPROVED with deliberately asymmetric side effects."

  # ------------------------------------------------------------- OutsourcePackage
  - entity: OutsourcePackage
    state_field: status
    shape: branching
    initial_state: DRAFT
    terminal_states: [QC_PASSED, RECALLED]
    transitions:
      - from: DRAFT
        to: ISSUED
        trigger: "POST /studio/outsource-packages/{id}/issue"
        actor: OutsourceCoordinator
        preconditions:
          - "partner.status == APPROVED, else ERR_PARTNER_SUSPENDED"
          - "partner.security_certification_level ordinal >= security_tier ordinal on the scale NONE<TIER1<TIER2<TIER3, else ERR_SECURITY_TIER_INSUFFICIENT"
          - "partner.quality_score_rolling >= quality_min_score, else ERR_PARTNER_QUALITY_BELOW_STANDARD"
          - "every ShotStageTask in stage_task_ids belongs to a Shot of this package's production_id, else ERR_CROSS_PRODUCTION_REFERENCE"
          - "production.total_committed_cents + fee_cents + resulting overhead delta <= budget_cents * (1 + contingency_pct), else ERR_BUDGET_WOULD_EXCEED"
        side_effects:
          - "each ShotStageTask in stage_task_ids gets outsource_package_id set to this package"
          - "no money is committed yet: fee_committed_cents stays 0 until the partner accepts"
      - from: ISSUED
        to: IN_PROGRESS
        trigger: "POST /studio/outsource-packages/{id}/accept"
        actor: PartnerRepresentative
        preconditions:
          - "X-User-ID == partner_id, else ERR_NOT_PACKAGE_PARTNER"
          - "partner.status == APPROVED, else ERR_PARTNER_SUSPENDED"
        side_effects:
          - "fee_committed_cents = fee_cents"
          - "production.direct_committed_cents, overhead_fee_cents, total_committed_cents and available_cents recomputed per calculations.production_budget_position (ledger sync)"
      - from: IN_PROGRESS
        to: DELIVERED
        trigger: "POST /studio/outsource-packages/{id}/deliver"
        actor: PartnerRepresentative
        preconditions:
          - "X-User-ID == partner_id"
          - "watermark_applied == true when partner.watermark_required == true, else ERR_SECURITY_REQUIREMENT_UNMET"
          - "partner.mfa_enforced == true when security_tier in {TIER2, TIER3}, else ERR_SECURITY_REQUIREMENT_UNMET"
        side_effects:
          - "delivery_count += 1"
          - "every ShotStageTask in scope with status == IN_PROGRESS transitions to SUBMITTED with submitted_by_user_id = X-User-ID"
      - from: QC_FAILED
        to: DELIVERED
        trigger: "POST /studio/outsource-packages/{id}/deliver (redelivery loop)"
        actor: PartnerRepresentative
        preconditions:
          - "X-User-ID == partner_id"
          - "watermark and MFA requirements still satisfied"
        side_effects:
          - "delivery_count += 1; qc_score and qc_decided_at retain the failed values until the next decision"
          - "every ShotStageTask in scope with status == RETAKE transitions to SUBMITTED"
      - from: DELIVERED
        to: QC_PASSED
        trigger: "POST /studio/outsource-packages/{id}/qc-decision with decision PASS"
        actor: Supervisor
        preconditions:
          - "status == DELIVERED, else ERR_PACKAGE_STATE_INVALID"
          - "qc_score >= quality_min_score, else ERR_VALIDATION"
        side_effects:
          - "qc_score and qc_decided_at stored; partner.qc_decided_package_count += 1"
          - "partner.quality_score_rolling and quality_score_lifetime recomputed per calculations.partner_quality_score"
          - "every ShotStageTask in scope with status in {SUBMITTED, IN_REVIEW} transitions to APPROVED, which recomputes shot.bcwp_cents, shot.status and the production rollups"
          - "fee_committed_cents stays at fee_cents (the fee is earned)"
      - from: DELIVERED
        to: QC_FAILED
        trigger: "POST /studio/outsource-packages/{id}/qc-decision with decision FAIL"
        actor: Supervisor
        preconditions:
          - "status == DELIVERED"
          - "qc_score < quality_min_score, else ERR_VALIDATION"
        side_effects:
          - "qc_score and qc_decided_at stored; partner.qc_decided_package_count += 1"
          - "partner.quality_score_rolling and quality_score_lifetime recomputed per calculations.partner_quality_score"
          - "every ShotStageTask in scope with status in {SUBMITTED, IN_REVIEW, APPROVED} transitions to RETAKE with revision_count += 1, which recomputes shot.retake_count, shot.escalation_flag, shot.status and production.total_retake_count"
          - "fee_committed_cents stays at fee_cents (a failed package is still paid for; only quality is debited)"
        note: "PASS and FAIL are a fork with disjoint side-effect sets on the same trigger: PASS approves tasks and moves bcwp up, FAIL retakes tasks and moves retake counters up."
      - from: ISSUED
        to: RECALLED
        trigger: "system: partner transitioned APPROVED -> SUSPENDED"
        actor: system
        preconditions: ["partner.status == SUSPENDED"]
        side_effects:
          - "fee_committed_cents = 0 and the production budget ledger is restored; scoped tasks are retaken and unlinked"
      - from: IN_PROGRESS
        to: RECALLED
        trigger: "system: partner transitioned APPROVED -> SUSPENDED"
        actor: system
        preconditions: ["partner.status == SUSPENDED"]
        side_effects: ["same as ISSUED -> RECALLED"]
      - from: DELIVERED
        to: RECALLED
        trigger: "system: partner transitioned APPROVED -> SUSPENDED"
        actor: system
        preconditions: ["partner.status == SUSPENDED"]
        side_effects: ["same as ISSUED -> RECALLED"]

  # ------------------------------------------------------------------ Deliverable
  - entity: Deliverable
    state_field: status
    shape: branching
    initial_state: DRAFT
    terminal_states: [DELIVERED, SUPERSEDED]
    transitions:
      - from: null
        to: DRAFT
        trigger: "POST /studio/deliverables"
        actor: ProductionManager
        preconditions:
          - "expected_production_version == production.version, else ERR_STALE_PRODUCTION_VERSION"
          - "production.phase in {PRODUCTION_ACTIVE, DELIVERY}, else ERR_PRODUCTION_PHASE_INVALID"
          - "color_space is a member of production.approved_color_spaces, and equals production.master_color_space when deliverable_type == MASTER_EXR, else ERR_COLOR_PIPELINE_MISMATCH"
          - "no Deliverable in the same version group has status in {DRAFT, SUBMITTED}, else ERR_DELIVERABLE_VERSION_CONFLICT"
        side_effects:
          - "version_index and version_label assigned per calculations.deliverable_version_label"
          - "every Deliverable in the same version group with status == QC_PASSED transitions to SUPERSEDED"
          - "production.version += 1"
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /studio/deliverables/{id}/submit"
        actor: ProductionManager
        preconditions:
          - "status == DRAFT, else ERR_DELIVERABLE_STATE_INVALID"
          - "no DirectorNote with severity == BLOCKING and status in {OPEN, RETAKE_ISSUED} exists in scope (the shot when shot_id is set, otherwise the whole production), else ERR_BLOCKING_NOTES_OPEN"
          - "when deliverable_type == MASTER_EXR, at least one ReviewSession of this production has session_type == CLIENT_REVIEW and status == CLOSED, else ERR_CLIENT_REVIEW_REQUIRED"
        side_effects: ["increments Deliverable.version by 1"]
      - from: SUBMITTED
        to: QC_PASSED
        trigger: "POST /studio/deliverables/{id}/qc-decision with decision PASS"
        actor: Supervisor
        preconditions:
          - "status == SUBMITTED, else ERR_DELIVERABLE_STATE_INVALID"
        side_effects:
          - "qc_note stored from the request when present"
      - from: SUBMITTED
        to: QC_FAILED
        trigger: "POST /studio/deliverables/{id}/qc-decision with decision FAIL"
        actor: Supervisor
        preconditions:
          - "status == SUBMITTED"
          - "qc_note present and non-empty, else ERR_VALIDATION"
        side_effects:
          - "the version group is now free: a new Deliverable version may be created"
      - from: QC_PASSED
        to: DELIVERED
        trigger: "POST /studio/deliverables/{id}/deliver"
        actor: ProductionManager
        preconditions:
          - "status == QC_PASSED, else ERR_DELIVERABLE_STATE_INVALID"
          - "production.phase == DELIVERY, else ERR_PRODUCTION_PHASE_INVALID"
        side_effects:
          - "delivered_at = logical clock now; the row becomes immutable"
      - from: QC_PASSED
        to: SUPERSEDED
        trigger: "system: a newer Deliverable version was created in the same (production_id, shot_id, deliverable_type) group"
        actor: system
        preconditions:
          - "status == QC_PASSED"
        side_effects:
          - "a SUPERSEDED deliverable no longer blocks production advance to WRAPPED and can never be delivered"

concurrency_rules:
  - rule_id: render-job-create-stale-pool
    parent_entity: RenderPool
    write_endpoint: "POST /studio/render-jobs"
    occ_field: "expected_render_pool_version"
    description: |
      Reserving farm capacity requires the caller to prove it is working from the pool state it last
      read. Every accepted reservation, completion, cancellation and preemption advances
      RenderPool.version, so a create that carries an expected_render_pool_version older than the
      stored version is rejected with 412 without touching committed_core_hours. This is a true race
      under the §1.2.1 filter: a second sequential reservation for the same window and the same stage
      task is legitimate product behavior (a shot may hold several reservations), so no state
      precondition on RenderJob would reject it — only the stale view of the pool's capacity does.
    error_id: ERR_STALE_RENDER_POOL_VERSION
    http_status: 412

  - rule_id: deliverable-create-stale-production
    parent_entity: Production
    write_endpoint: "POST /studio/deliverables"
    occ_field: "expected_production_version"
    description: |
      Creating a Deliverable version legitimately supersedes the QC_PASSED version already sitting in
      the same (production_id, shot_id, deliverable_type) group, so a second sequential create is
      valid product behavior and no Deliverable state precondition rejects it. To keep supersession
      intentional, the create must carry the Production.version the client last read; because each
      accepted create advances Production.version, a create carrying an older value is rejected with
      412 and no version_index is consumed.
    error_id: ERR_STALE_PRODUCTION_VERSION
    http_status: 412

calculations:
  - name: shot_earned_value
    trigger: "on GET /studio/shots/{id}/earned-value, and whenever a ShotStageTask is approved, retaken, logs hours, or a RenderJob of the shot settles"
    algorithm: weighted_scoring
    formula: |
      # ---- schedule baseline (identical for both variants) ----
      span_seconds      = planned_finish_at - planned_start_at            # > 0, enforced at create
      elapsed_seconds   = clock_now - planned_start_at
      schedule_fraction = clamp(elapsed_seconds / span_seconds, 0.0, 1.0)
      bcws_cents        = round_half_up(shot.budget_cents * schedule_fraction)

      # ---- actual cost (identical for both variants) ----
      logged_hours      = sum(task.actual_hours for the shot's five ShotStageTask rows)
      acwp_cents        = round_half_up(logged_hours * LABOR_RATE_CENTS_PER_HOUR)
                          + shot.render_cost_actual_cents

      # ---- earned value (VARIANT-DEPENDENT, see variants below) ----
      bcwp_cents        = <variant>

      # ---- indices ----
      cpi = null if acwp_cents == 0 else round_half_up(bcwp_cents / acwp_cents, 4)
      spi = null if bcws_cents == 0 else round_half_up(bcwp_cents / bcws_cents, 4)
    input_set: |
      All five ShotStageTask rows of the shot. STAGE_WEIGHT counts only tasks with status == APPROVED
      (a task driven back to RETAKE loses its credit immediately). HOURS_PROGRESS counts actual_hours
      on every task regardless of status. RenderJob contributions enter acwp only through
      shot.render_cost_actual_cents, i.e. only from jobs in status COMPLETED or FAILED; RESERVED jobs
      sit in render_cost_committed_cents and never touch acwp.
    constants:
      STAGE_WEIGHT_PCT_LAYOUT: 0.10
      STAGE_WEIGHT_PCT_ANIMATION: 0.40
      STAGE_WEIGHT_PCT_EFFECTS: 0.15
      STAGE_WEIGHT_PCT_LIGHTING: 0.15
      STAGE_WEIGHT_PCT_COMP: 0.20
      LABOR_RATE_CENTS_PER_HOUR: 9000
    precision: "cents are integers via round_half_up; cpi and spi carry 4 decimal places, round_half_up; the stage weights sum to exactly 1.00"
    variants:
      - name: STAGE_WEIGHT
        when: "default variant; used by GET /studio/shots/{id}/earned-value when variant is omitted, and the variant persisted into Shot.bcwp_cents / Shot.cpi / Shot.spi and rolled up into Production"
        difference: "bcwp_cents = round_half_up(shot.budget_cents * sum(STAGE_WEIGHT_PCT[task.stage] for tasks with status == APPROVED)); progress is credited only in discrete stage-sized jumps, so a stage 90% worked earns nothing"
      - name: HOURS_PROGRESS
        when: "requested explicitly with variant=HOURS_PROGRESS; the supervisor's in-flight view"
        difference: "bcwp_cents = round_half_up(shot.budget_cents * clamp(sum(task.actual_hours) / sum(task.budgeted_hours), 0.0, 1.0)); credits partial work on unapproved stages, so for identical data the two variants return different bcwp, cpi and spi"

  - name: partner_quality_score
    trigger: "recomputed on every OutsourcePackage QC decision (PASS or FAIL) for the package's partner"
    algorithm: decay_function
    formula: |
      candidates = OutsourcePackage rows with partner_id == partner.id
                   and status in {QC_PASSED, QC_FAILED} and qc_decided_at is not null
      age_days(p) = floor((clock_now - p.qc_decided_at) / 86400 seconds)
      decay(p)    = 1.00 if age_days <= 30
                    0.75 if 30 < age_days <= 60
                    0.50 if 60 < age_days <= 90
                    excluded from the ROLLING_90D input set if age_days > 90
      weight(p)   = TIER_WEIGHT[p.security_tier] * decay(p)     # decay omitted for LIFETIME
      score       = NEUTRAL_DEFAULT if the input set is empty
                    else round_half_up(sum(p.qc_score * weight(p)) / sum(weight(p)), 2)
    input_set: "QC-decided packages of the partner only; DRAFT, ISSUED, IN_PROGRESS, DELIVERED and RECALLED packages never contribute, so a recall silently removes a package from the score base"
    constants:
      TIER_WEIGHT_TIER1: 1.0
      TIER_WEIGHT_TIER2: 1.5
      TIER_WEIGHT_TIER3: 2.0
      NEUTRAL_DEFAULT: 50.00
      ROLLING_WINDOW_DAYS: 90
    precision: "2 decimal places, round_half_up; weights are exact decimals, the division is performed once on the accumulated sums so per-term rounding never accumulates"
    variants:
      - name: ROLLING_90D
        when: "stored in OutsourcePartner.quality_score_rolling and used by the ERR_PARTNER_QUALITY_BELOW_STANDARD gate on POST /studio/outsource-packages/{id}/issue"
        difference: "applies the step decay and drops every decision older than 90 days; a partner whose only bad decision aged past 90 days is judged on its recent work alone"
      - name: LIFETIME
        when: "stored in OutsourcePartner.quality_score_lifetime and reported on GET /studio/outsource-partners/{id}"
        difference: "no decay factor and no age cut-off — weight(p) = TIER_WEIGHT[p.security_tier] only — so identical decision history yields a different score from ROLLING_90D whenever any decision is older than 30 days"

  - name: render_job_cost
    trigger: "on POST /studio/render-jobs (estimate from seconds_per_frame) and on POST /studio/render-jobs/{id}/complete (settlement from actual_seconds_per_frame)"
    algorithm: aggregation
    formula: |
      # STEP ORDER IS NORMATIVE: per-frame cost is rounded to whole cents FIRST,
      # and the frame count multiplies the ALREADY-ROUNDED per-frame cost.
      core_seconds_per_frame = job.requested_cores * seconds_source           # seconds_source below
      raw_cents_per_frame    = pool.cost_per_core_hour_cents
                               * core_seconds_per_frame / 3600
                               * PRIORITY_MULTIPLIER[job.priority]
      cost_per_frame_cents   = round_half_up(raw_cents_per_frame)             # (1) round
      total_cents            = cost_per_frame_cents * frame_source            # (2) multiply

      # reservation:  seconds_source = seconds_per_frame,        frame_source = frame_count
      #               -> estimated_cost_cents
      # settlement:   seconds_source = actual_seconds_per_frame, frame_source = frames_completed
      #               -> final_cost_cents      (frames_completed == frame_count when outcome COMPLETED,
      #                                         strictly less when outcome FAILED)
      committed_core_hours   = requested_cores * ((window_end - window_start) / 3600 seconds)
    input_set: "the single RenderJob being priced plus its RenderPool's cost_per_core_hour_cents; cancelled and preempted jobs are never priced and keep final_cost_cents null"
    constants:
      PRIORITY_MULTIPLIER_LOW: 0.80
      PRIORITY_MULTIPLIER_NORMAL: 1.00
      PRIORITY_MULTIPLIER_HIGH: 1.35
      PRIORITY_MULTIPLIER_CRITICAL: 1.75
      SECONDS_PER_HOUR: 3600
    precision: |
      cost_per_frame_cents is an integer produced by round_half_up on the raw per-frame value;
      estimated_cost_cents and final_cost_cents are exact integer multiples of it. Summing unrounded
      per-frame values and rounding the total at the end is WRONG and observably different: 3 cores,
      175 cents/core-hour, 50 s/frame, NORMAL, 120 frames gives 7 * 120 = 840, not round(875.0) = 875.
      committed_core_hours carries 2 decimal places, round_half_up.

  - name: render_pool_admission
    trigger: "on POST /studio/render-jobs, before any field is written"
    algorithm: interval_merge
    formula: |
      # (1) priority-dependent reserved ceiling — the headroom kept free is NOT linear in priority
      headroom_cores  = ceil(pool.total_cores * HEADROOM_PCT[request.priority])
      reserved_ceiling = pool.total_cores - headroom_cores

      # (2) peak concurrent commitment over the requested window, half-open [window_start, window_end)
      overlapping = RenderJob rows with render_pool_id == pool.id and status == RESERVED
                    and j.window_start < request.window_end
                    and j.window_end   > request.window_start
      instants    = {request.window_start} UNION {j.window_start for j in overlapping
                                                  if j.window_start >= request.window_start}
      peak_used   = max over t in instants of
                      sum(j.requested_cores for j in overlapping where j.window_start <= t < j.window_end)
      peak_used   = 0 when overlapping is empty

      # (3) all-or-nothing admission
      available = reserved_ceiling - peak_used
      if request.requested_cores <= available: admit
      elif request.priority == CRITICAL:       run the preemption selector below
      else:                                   reject with ERR_RENDER_CAPACITY_EXCEEDED

      # (4) preemption selector (CRITICAL only) — fully pinned, no id ever consulted
      eligibility: j.status == RESERVED and j.priority in {LOW, NORMAL}
                   and j.window_start < request.window_end and j.window_end > request.window_start
      ranking:     priority ASC on the scale LOW < NORMAL, then requested_cores DESC,
                   then created_at ASC
      action:      walk the ranked list, preempting one job at a time and recomputing peak_used,
                   until requested_cores <= available
      empty set or still short after the whole list: preempt nothing at all and reject with
                   ERR_RENDER_CAPACITY_EXCEEDED (the admission is atomic — no partial preemption)
    input_set: "only RESERVED RenderJob rows of the same pool whose half-open window intersects the requested window; COMPLETED, FAILED, CANCELLED and PREEMPTED jobs are excluded, and a job whose window merely touches the request (j.window_end == request.window_start) does not intersect"
    constants:
      HEADROOM_PCT_LOW: 0.20
      HEADROOM_PCT_NORMAL: 0.10
      HEADROOM_PCT_HIGH: 0.00
      HEADROOM_PCT_CRITICAL: 0.00
    precision: "headroom_cores uses ceil (never round or floor), so a 100-core pool keeps 10 cores free for NORMAL and 20 for LOW; core counts are integers throughout"

  - name: production_budget_position
    trigger: "on OutsourcePackage accept / QC decision / recall, on RenderJob settlement, on stage-task log-hours, and as the prospective check behind ERR_BUDGET_WOULD_EXCEED"
    algorithm: tiered_pricing
    formula: |
      # (1) direct commitment, BEFORE overhead
      package_fees = sum(pkg.fee_committed_cents for OutsourcePackage rows of this production
                         with status in {IN_PROGRESS, DELIVERED, QC_PASSED, QC_FAILED})
      labor        = sum(round_half_up(task.actual_hours * LABOR_RATE_CENTS_PER_HOUR)
                         for every ShotStageTask of every Shot of this production)
      direct_committed_cents = package_fees + labor + production.render_actual_cents

      # (2) overhead rate is keyed on the PRE-OVERHEAD direct figure, never on the grand total
      overhead_rate = 0.15 if direct_committed_cents <  OVERHEAD_TIER_1_CEILING_CENTS
                      0.12 if direct_committed_cents <  OVERHEAD_TIER_2_CEILING_CENTS
                      0.10 otherwise
      overhead_fee_cents    = round_half_up(direct_committed_cents * overhead_rate)
      total_committed_cents = direct_committed_cents + overhead_fee_cents

      # (3) spending ceiling and headroom
      spend_ceiling_cents = round_half_up(production.budget_cents * (1 + production.contingency_pct))
      available_cents     = spend_ceiling_cents - total_committed_cents

      # (4) prospective check used by POST /studio/outsource-packages/{id}/issue
      recompute steps (1)-(3) with package_fees + pkg.fee_cents; reject with
      ERR_BUDGET_WOULD_EXCEED when the resulting total_committed_cents > spend_ceiling_cents
    input_set: "packages whose fee has actually been committed (accepted or beyond) plus logged labor plus settled render cost; DRAFT, ISSUED and RECALLED packages contribute nothing, so a recall drops the production back to its pre-acceptance position exactly"
    constants:
      OVERHEAD_TIER_1_CEILING_CENTS: 5000000
      OVERHEAD_TIER_2_CEILING_CENTS: 20000000
      OVERHEAD_RATE_TIER_1: 0.15
      OVERHEAD_RATE_TIER_2: 0.12
      OVERHEAD_RATE_TIER_3: 0.10
      LABOR_RATE_CENTS_PER_HOUR: 9000
    precision: |
      All money is integer cents, round_half_up. The tier lookup uses strict < against the ceilings and
      is evaluated on direct_committed_cents only: direct 4,900,000 takes rate 0.15 for a total of
      5,635,000, whereas keying the tier on the resulting total (which lands above tier 1) would give
      the wrong 5,488,000.

  - name: stage_retake_escalation
    trigger: "on every ShotStageTask transition into RETAKE, from any source (supervisor decision, review-session close, package QC failure, partner suspension)"
    algorithm: threshold
    formula: |
      task.revision_count += 1 on each entry into RETAKE
      task.escalated = (task.revision_count >= RETAKE_ESCALATION_THRESHOLD)   # >= not >
      once true, escalated is latching: an approval never clears it and revision_count never resets
      shot.retake_count      = sum(task.revision_count for the shot's five tasks)
      shot.escalation_flag   = any(task.escalated for the shot's five tasks)
      production.total_retake_count = sum(shot.retake_count for the production's shots)
      production.at_risk_shot_count = count(shot where shot.escalation_flag)
    input_set: "the five ShotStageTask rows of the shot; tasks of other shots never influence this shot's flag"
    constants:
      RETAKE_ESCALATION_THRESHOLD: 3
    precision: "integer counters; the comparison is >=, so the third retake escalates and the second does not"

  - name: deliverable_version_label
    trigger: "on POST /studio/deliverables, before persisting the row"
    algorithm: aggregation
    formula: |
      group = Deliverable rows with the same production_id, the same deliverable_type and the same
              shot_id, where a null shot_id matches only other null shot_id rows (a production-wide
              master and a shot-scoped master are separate groups)
      version_index = 1 + count(group)          # every row counts, including SUPERSEDED and QC_FAILED
      version_label = "v" + version_index zero-padded to at least 2 digits   # 1 -> v01, 2 -> v02, 100 -> v100
      reject with ERR_DELIVERABLE_VERSION_CONFLICT when any row of the group has status
      in {DRAFT, SUBMITTED} — only one in-flight version per group
    input_set: "every Deliverable row of the group regardless of status; deleted rows do not exist in this domain, so version_index never decreases"
    constants:
      LABEL_PREFIX: "v"
      LABEL_MIN_DIGITS: 2
    precision: "version_index is a 1-based integer; the label is padded to exactly two digits below 100, so the first deliverable in an empty group is v01, never v1 or v00"

  - name: asset_reuse_credit
    trigger: "on POST /studio/assets, on POST /studio/assets/{id}/relink-source, and whenever an ancestor's library_status changes"
    algorithm: topological
    formula: |
      # walk the derived_from_asset_id chain upward from the asset
      reuse_depth = number of edges from this asset to the root of its chain
                    (null derived_from_asset_id => depth 0)
      if reuse_depth == 0
        or immediate_source.library_status != LIBRARY_APPROVED
        or asset.reuse_source_stale == true:
          reuse_discount_pct = 0.00
      else:
          reuse_discount_pct = REUSE_DISCOUNT_PCT_DEPTH_1 if reuse_depth == 1
                               REUSE_DISCOUNT_PCT_DEPTH_2 if reuse_depth == 2
                               REUSE_DISCOUNT_PCT_DEPTH_3_PLUS otherwise
      effective_complexity_points = round_half_up(
          asset.base_complexity_points * (1 - reuse_discount_pct), 2)
    input_set: |
      The asset's ancestor chain only, walked parent-first in chain order (never by id). A relink or
      create whose chain would revisit an asset already on the walk is rejected with
      ERR_ASSET_REUSE_CYCLE, and a chain longer than MAX_CHAIN_DEPTH is rejected with ERR_VALIDATION,
      so the walk always terminates. Descendant recomputation after an ancestor deprecation proceeds
      in created_at ASC order.
    constants:
      REUSE_DISCOUNT_PCT_DEPTH_1: 0.40
      REUSE_DISCOUNT_PCT_DEPTH_2: 0.25
      REUSE_DISCOUNT_PCT_DEPTH_3_PLUS: 0.10
      MAX_CHAIN_DEPTH: 8
    precision: |
      effective_complexity_points carries 2 decimal places, round_half_up. The discount is a decreasing
      function of depth, so a base of 200.00 yields 120.00 at depth 1, 150.00 at depth 2 and 180.00 at
      depth 3 — deeper reuse is worth less, and depth is never averaged across the chain.

validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers are both present and X-User-Role is one of the six declared roles"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all
  - priority: 2
    category: auth
    check: "X-User-Role appears in the target endpoint's roles list"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: all
  - priority: 3
    category: existence
    check: "every id in the request path resolves to a stored row, validated left-to-right"
    error_id: "ERR_<TARGET>_NOT_FOUND (ERR_PRODUCTION_NOT_FOUND, ERR_GATE_NOT_FOUND, ERR_ASSET_NOT_FOUND, ERR_SHOT_NOT_FOUND, ERR_TASK_NOT_FOUND, ERR_ROOM_NOT_FOUND, ERR_SESSION_NOT_FOUND, ERR_NOTE_NOT_FOUND, ERR_POOL_NOT_FOUND, ERR_RENDER_JOB_NOT_FOUND, ERR_PARTNER_NOT_FOUND, ERR_PACKAGE_NOT_FOUND, ERR_DELIVERABLE_NOT_FOUND)"
    http_status: 404
    applies_to: "all endpoints with a path id"
  - priority: 4
    category: existence
    check: "every foreign key in the request body resolves to a stored row, validated in the order the fields are declared in the endpoint's input list; array FKs such as stage_task_ids are validated element-by-element in array order"
    error_id: "ERR_<PARENT>_NOT_FOUND"
    http_status: 404
    applies_to: "all writes carrying FK fields in the body"
  - priority: 5
    category: business_constraint
    check: "request body satisfies the declared schema: required fields present, types correct, enum members legal, numeric ranges respected, unknown fields ignored rather than rejected"
    error_id: ERR_VALIDATION
    http_status: 422
    applies_to: "all writes"
  - priority: 6
    category: auth
    check: "on stage-task submit and log-hours, X-User-ID equals ShotStageTask.assigned_artist_user_id, or the caller is the PartnerRepresentative whose id equals the partner_id of the task's outsource_package_id"
    error_id: ERR_NOT_TASK_OWNER
    http_status: 403
    applies_to: "POST /studio/stage-tasks/{id}/submit, POST /studio/stage-tasks/{id}/log-hours"
  - priority: 7
    category: auth
    check: "on package accept and deliver, X-User-ID equals OutsourcePackage.partner_id"
    error_id: ERR_NOT_PACKAGE_PARTNER
    http_status: 403
    applies_to: "POST /studio/outsource-packages/{id}/accept, POST /studio/outsource-packages/{id}/deliver"
  - priority: 8
    category: auth
    check: "the deciding X-User-ID differs from the submitting user recorded on the artifact: gate review-decision vs PreProductionGate.submitted_by_user_id, stage review-decision vs ShotStageTask.submitted_by_user_id, asset library-decision vs Asset.library_submitted_by_user_id"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /studio/pre-production-gates/{id}/review-decision, POST /studio/stage-tasks/{id}/review-decision, POST /studio/assets/{id}/library-decision"
  - priority: 9
    category: state
    check: "the optimistic-concurrency field matches the parent's stored version, per concurrency_rules"
    error_id: "ERR_STALE_RENDER_POOL_VERSION on POST /studio/render-jobs, ERR_STALE_PRODUCTION_VERSION on POST /studio/deliverables"
    http_status: 412
    applies_to: "POST /studio/render-jobs, POST /studio/deliverables"
  - priority: 10
    category: state
    check: "the owning Production is in a phase that permits the operation: Shot and Asset creation require phase in {PRE_PRODUCTION, PRODUCTION_ACTIVE}; stage work (assign, log-hours, submit, review-decision), render reservations, review sessions, notes and package issuance require PRODUCTION_ACTIVE; gate submit and gate review-decision require PRE_PRODUCTION; deliverable creation requires PRODUCTION_ACTIVE or DELIVERY; deliverable delivery requires DELIVERY; nothing is writable once WRAPPED. On POST /studio/productions/{id}/advance-phase this rule fires only when the requested to_phase is not the legal successor of the current phase and the current phase is not PRE_PRODUCTION"
    error_id: ERR_PRODUCTION_PHASE_INVALID
    http_status: 409
    applies_to: "all writes under a production"
  - priority: 11
    category: state
    check: "the target row's own state field permits the requested transition per §1.2"
    error_id: "ERR_<TARGET>_STATE_INVALID (ERR_GATE_STATE_INVALID, ERR_ASSET_BUILD_STATE_INVALID, ERR_ASSET_LIBRARY_STATE_INVALID, ERR_TASK_STATE_INVALID, ERR_SESSION_STATE_INVALID, ERR_NOTE_STATE_INVALID, ERR_RENDER_JOB_STATE_INVALID, ERR_PARTNER_STATE_INVALID, ERR_PACKAGE_STATE_INVALID, ERR_DELIVERABLE_STATE_INVALID)"
    http_status: 409
    applies_to: "all action endpoints; also POST /studio/render-jobs, where the referenced ShotStageTask must be in {IN_PROGRESS, SUBMITTED, IN_REVIEW, RETAKE}"
  - priority: 12
    category: state
    check: "the OutsourcePartner behind the operation is not SUSPENDED"
    error_id: ERR_PARTNER_SUSPENDED
    http_status: 409
    applies_to: "POST /studio/outsource-packages/{id}/issue, POST /studio/outsource-packages/{id}/accept, POST /studio/outsource-packages/{id}/deliver"
  - priority: 13
    category: state
    check: "for a ShotStageTask with stage_order > 1, the sibling task with stage_order - 1 has status APPROVED"
    error_id: ERR_PREVIOUS_STAGE_NOT_APPROVED
    http_status: 409
    applies_to: "POST /studio/stage-tasks/{id}/assign"
  - priority: 14
    category: business_safety
    check: "partner.security_certification_level ordinal is at least the package security_tier ordinal on the scale NONE < TIER1 < TIER2 < TIER3"
    error_id: ERR_SECURITY_TIER_INSUFFICIENT
    http_status: 422
    applies_to: "POST /studio/outsource-packages/{id}/issue"
  - priority: 15
    category: business_safety
    check: "partner-level security obligations are met: security_certification_level != NONE before approval; watermark_applied true when partner.watermark_required; partner.mfa_enforced true when the package security_tier is TIER2 or TIER3"
    error_id: ERR_SECURITY_REQUIREMENT_UNMET
    http_status: 422
    applies_to: "POST /studio/outsource-partners/{id}/status, POST /studio/outsource-packages/{id}/deliver"
  - priority: 16
    category: business_safety
    check: "partner.quality_score_rolling >= package.quality_min_score at issue time"
    error_id: ERR_PARTNER_QUALITY_BELOW_STANDARD
    http_status: 422
    applies_to: "POST /studio/outsource-packages/{id}/issue"
  - priority: 17
    category: business_safety
    check: "deliverable color_space is a member of production.approved_color_spaces, and equals production.master_color_space when deliverable_type is MASTER_EXR; a CLIENT_REVIEW session's room_color_space must also be a member of the production's approved_color_spaces"
    error_id: ERR_COLOR_PIPELINE_MISMATCH
    http_status: 422
    applies_to: "POST /studio/deliverables, POST /studio/review-sessions"
  - priority: 18
    category: business_safety
    check: "the screening room has been calibrated at least once (last_calibrated_at is not null) before a session may be scheduled in it"
    error_id: ERR_ROOM_NOT_CALIBRATED
    http_status: 422
    applies_to: "POST /studio/review-sessions"
  - priority: 19
    category: business_safety
    check: "the screening room's calibration is still inside calibration_valid_days at the moment the session starts, i.e. clock_now < last_calibrated_at + calibration_valid_days"
    error_id: ERR_CALIBRATION_EXPIRED
    http_status: 422
    applies_to: "POST /studio/review-sessions/{id}/start"
  - priority: 20
    category: business_safety
    check: "no DirectorNote with severity BLOCKING and status in {OPEN, RETAKE_ISSUED} exists in the deliverable's scope (the shot when shot_id is set, otherwise every shot of the production)"
    error_id: ERR_BLOCKING_NOTES_OPEN
    http_status: 422
    applies_to: "POST /studio/deliverables/{id}/submit"
  - priority: 21
    category: business_referential
    check: "cross-aggregate references stay inside one production: a DirectorNote's target task belongs to a shot of the session's production, a package's stage_task_ids all belong to shots of the package's production, an asset's derived_from_asset_id belongs to the same production, and a deliverable's shot_id belongs to its production"
    error_id: ERR_CROSS_PRODUCTION_REFERENCE
    http_status: 422
    applies_to: "POST /studio/director-notes, POST /studio/outsource-packages/{id}/issue, POST /studio/assets, POST /studio/assets/{id}/relink-source, POST /studio/deliverables (a DRAFT package may hold a foreign stage_task_ids scope; the check fires at issue time)"
  - priority: 22
    category: business_referential
    check: "the derived_from_asset_id chain remains acyclic and no longer than MAX_CHAIN_DEPTH edges"
    error_id: ERR_ASSET_REUSE_CYCLE
    http_status: 422
    applies_to: "POST /studio/assets, POST /studio/assets/{id}/relink-source"
  - priority: 23
    category: business_referential
    check: "a MASTER_EXR deliverable may be submitted only after at least one ReviewSession of the production with session_type CLIENT_REVIEW has reached status CLOSED (a CANCELLED client review does not count)"
    error_id: ERR_CLIENT_REVIEW_REQUIRED
    http_status: 422
    applies_to: "POST /studio/deliverables/{id}/submit"
  - priority: 24
    category: business_temporal
    check: "window_start < window_end and window_start >= the logical clock now; a shot's planned_start_at < planned_finish_at"
    error_id: ERR_INVALID_WINDOW
    http_status: 422
    applies_to: "POST /studio/review-sessions, POST /studio/render-jobs, POST /studio/shots"
  - priority: 25
    category: business_temporal
    check: "the requested session window, expanded by the room's turnover_buffer_minutes on both sides, does not intersect the stored unexpanded window of any SCHEDULED or IN_PROGRESS session in the same room; all intervals are half-open [start, end), CLOSED and CANCELLED sessions are ignored, and a gap exactly equal to turnover_buffer_minutes is therefore legal while any smaller gap conflicts"
    error_id: ERR_ROOM_WINDOW_CONFLICT
    http_status: 409
    applies_to: "POST /studio/review-sessions"
  - priority: 26
    category: business_constraint
    check: "attendee_count <= screening_room.seat_capacity"
    error_id: ERR_ROOM_SEAT_CAPACITY_EXCEEDED
    http_status: 422
    applies_to: "POST /studio/review-sessions"
  - priority: 27
    category: business_constraint
    check: "codes are unique in their scope: production_code across all productions, shot_code and asset_code within a production, package_code within a production"
    error_id: ERR_DUPLICATE_CODE
    http_status: 409
    applies_to: "POST /studio/productions, POST /studio/shots, POST /studio/assets, POST /studio/outsource-packages"
  - priority: 28
    category: business_constraint
    check: "every PreProductionGate of the same production with a smaller sequence_index has status APPROVED before this gate may be submitted"
    error_id: ERR_GATE_SEQUENCE_VIOLATION
    http_status: 409
    applies_to: "POST /studio/pre-production-gates/{id}/submit"
  - priority: 29
    category: business_constraint
    check: "a production still in PRE_PRODUCTION cannot be pushed forward by hand, because it leaves PRE_PRODUCTION only when its gates are all APPROVED; requesting to_phase DELIVERY while phase == PRE_PRODUCTION reports the outstanding gates"
    error_id: ERR_GATES_INCOMPLETE
    http_status: 409
    applies_to: "POST /studio/productions/{id}/advance-phase"
  - priority: 30
    category: business_constraint
    check: "completed_shot_count == shot_count before a production may enter DELIVERY; the check passes vacuously for a production with no shots"
    error_id: ERR_SHOTS_INCOMPLETE
    http_status: 409
    applies_to: "POST /studio/productions/{id}/advance-phase"
  - priority: 31
    category: business_constraint
    check: "at least one Deliverable of the production is DELIVERED and none is left in DRAFT, SUBMITTED or QC_PASSED before the production may be WRAPPED"
    error_id: ERR_DELIVERABLES_INCOMPLETE
    http_status: 409
    applies_to: "POST /studio/productions/{id}/advance-phase"
  - priority: 32
    category: business_constraint
    check: "no Deliverable in the target version group is already in DRAFT or SUBMITTED"
    error_id: ERR_DELIVERABLE_VERSION_CONFLICT
    http_status: 409
    applies_to: "POST /studio/deliverables"
  - priority: 33
    category: business_fiscal
    check: "the render pool admits the requested cores over the requested window per calculations.render_pool_admission, after CRITICAL preemption where applicable"
    error_id: ERR_RENDER_CAPACITY_EXCEEDED
    http_status: 409
    applies_to: "POST /studio/render-jobs"
  - priority: 34
    category: business_fiscal
    check: "production.render_committed_cents + production.render_actual_cents + this job's estimated_cost_cents <= production.render_allowance_cents"
    error_id: ERR_RENDER_BUDGET_EXCEEDED
    http_status: 402
    applies_to: "POST /studio/render-jobs"
  - priority: 35
    category: business_fiscal
    check: "the prospective total_committed_cents including this package fee and its recomputed overhead stays within budget_cents * (1 + contingency_pct)"
    error_id: ERR_BUDGET_WOULD_EXCEED
    http_status: 402
    applies_to: "POST /studio/outsource-packages/{id}/issue"

endpoints:
  # ------------------------------------------------------------------ Production
  - method: POST
    path: "/studio/productions"
    description: "Open a production. The gate set named by gate_types is materialized immediately, one PreProductionGate per type in canonical order with sequence_index 1..n and status DRAFT."
    roles: [ProductionManager]
    code: 201
    input: [title, production_code, format, budget_cents, render_allowance_cents, master_color_space, "contingency_pct?", "approved_color_spaces?", "gate_types?"]
    output: Production
    side_effects:
      - "creates one PreProductionGate per element of gate_types; these rows appear in no creation response and are discoverable only through GET /studio/pre-production-gates?production_id="
      - "phase = PRE_PRODUCTION, all counters 0, available_cents = round_half_up(budget_cents * (1 + contingency_pct))"
  - method: GET
    path: "/studio/productions"
    description: "List productions, newest last by created_at ASC."
    roles: [ProductionManager, Supervisor, Director, Artist, OutsourceCoordinator]
    code: 200
    input: ["phase?", "limit?", "offset?"]
    output: Production[]
    side_effects: []
  - method: GET
    path: "/studio/productions/{id}"
    description: "Read one production including its reconciled budget and earned-value rollups."
    roles: [ProductionManager, Supervisor, Director, Artist, OutsourceCoordinator]
    code: 200
    input: []
    output: Production
    side_effects: []
  - method: POST
    path: "/studio/productions/{id}/advance-phase"
    description: "Advance a production to DELIVERY or to WRAPPED. PRODUCTION_ACTIVE is not requestable here: a production leaves PRE_PRODUCTION only when its last gate is approved, so asking for DELIVERY while still in PRE_PRODUCTION returns ERR_GATES_INCOMPLETE."
    roles: [ProductionManager]
    code: 200
    input: [to_phase]
    output: Production
    side_effects:
      - "increments Production.version by 1"
      - "entering DELIVERY closes the shot surface: POST /studio/shots for this production is rejected afterwards"
  # ----------------------------------------------------------- PreProductionGate
  - method: GET
    path: "/studio/pre-production-gates"
    description: "List pre-production gates; the only discovery channel for the gates cascade-created with a production. Ordered by sequence_index ASC."
    roles: [ProductionManager, Supervisor, Director, Artist, OutsourceCoordinator]
    code: 200
    input: ["production_id?", "gate_type?", "status?", "limit?", "offset?"]
    output: PreProductionGate[]
    side_effects: []
  - method: GET
    path: "/studio/pre-production-gates/{id}"
    description: "Read one pre-production gate."
    roles: [ProductionManager, Supervisor, Director, Artist, OutsourceCoordinator]
    code: 200
    input: []
    output: PreProductionGate
    side_effects: []
  - method: POST
    path: "/studio/pre-production-gates/{id}/submit"
    description: "Submit a gate package for director review; also the re-submission after CHANGES_REQUESTED."
    roles: [ProductionManager]
    code: 200
    input: [package_url]
    output: PreProductionGate
    side_effects:
      - "status DRAFT|CHANGES_REQUESTED -> IN_REVIEW, submitted_by_user_id = X-User-ID"
  - method: POST
    path: "/studio/pre-production-gates/{id}/review-decision"
    description: "Director decision on a gate in review: APPROVED or CHANGES_REQUESTED."
    roles: [Director]
    code: 200
    input: [decision, "note?"]
    output: PreProductionGate
    side_effects:
      - "CHANGES_REQUESTED increments revision_count"
      - "APPROVED of the production's last outstanding gate drives Production PRE_PRODUCTION -> PRODUCTION_ACTIVE, locks every gate and unblocks every shot"
  # ----------------------------------------------------------------------- Asset
  - method: POST
    path: "/studio/assets"
    description: "Brief a new asset, optionally derived from a library asset which sets the reuse discount."
    roles: [ProductionManager, Artist]
    code: 201
    input: [production_id, asset_code, asset_type, base_complexity_points, "derived_from_asset_id?"]
    output: Asset
    side_effects:
      - "build_status = BRIEFED, library_status = PRIVATE"
      - "reuse_depth, reuse_discount_pct and effective_complexity_points computed per calculations.asset_reuse_credit"
  - method: GET
    path: "/studio/assets"
    description: "List assets; filter by production, by reuse source, or by either state dimension."
    roles: [ProductionManager, Supervisor, Director, Artist, OutsourceCoordinator]
    code: 200
    input: ["production_id?", "derived_from_asset_id?", "build_status?", "library_status?", "limit?", "offset?"]
    output: Asset[]
    side_effects: []
  - method: GET
    path: "/studio/assets/{id}"
    description: "Read one asset with both state dimensions and its reuse credit."
    roles: [ProductionManager, Supervisor, Director, Artist, OutsourceCoordinator]
    code: 200
    input: []
    output: Asset
    side_effects: []
  - method: POST
    path: "/studio/assets/{id}/advance-build"
    description: "Move the asset one step along BRIEFED -> MODELING -> RIGGING -> SURFACING -> PUBLISHED, or retire a published asset."
    roles: [Artist]
    code: 200
    input: [to_build_status]
    output: Asset
    side_effects:
      - "RETIRED deprecates an approved library entry and restores full complexity points on every descendant of the reuse chain"
  - method: POST
    path: "/studio/assets/{id}/library-submit"
    description: "Nominate a published asset for the reuse library."
    roles: [Artist]
    code: 200
    input: []
    output: Asset
    side_effects:
      - "library_status PRIVATE -> LIBRARY_CANDIDATE, library_submitted_by_user_id = X-User-ID; build_status is untouched"
  - method: POST
    path: "/studio/assets/{id}/library-decision"
    description: "Supervisor decision on a library candidate: APPROVED promotes it to a reusable source, REJECTED returns it to PRIVATE."
    roles: [Supervisor]
    code: 200
    input: [decision]
    output: Asset
    side_effects:
      - "APPROVED makes the asset a legal derived_from_asset_id source that grants a discount"
  - method: POST
    path: "/studio/assets/{id}/relink-source"
    description: "Repoint an asset at a different reuse source, recomputing its depth and discount."
    roles: [ProductionManager]
    code: 200
    input: [derived_from_asset_id]
    output: Asset
    side_effects:
      - "reuse_depth, reuse_discount_pct, effective_complexity_points and reuse_source_stale recomputed per calculations.asset_reuse_credit"
      - "rejected with ERR_ASSET_REUSE_CYCLE when the new chain would revisit this asset"
  # ------------------------------------------------------------------------ Shot
  - method: POST
    path: "/studio/shots"
    description: "Create a shot. The five stage tasks LAYOUT, ANIMATION, EFFECTS, LIGHTING, COMP are materialized immediately with stage_order 1..5 and their canonical stage weights."
    roles: [ProductionManager]
    code: 201
    input: [production_id, shot_code, sequence_code, frame_count, budget_cents, planned_start_at, planned_finish_at, "difficulty_factor?", "stage_budget_hours?"]
    output: Shot
    side_effects:
      - "creates five ShotStageTask rows in status NOT_STARTED, budgeted_hours taken from stage_budget_hours when supplied and 10.0 otherwise; discoverable only through GET /studio/stage-tasks?shot_id="
      - "status = BLOCKED_PREPROD while the production is in PRE_PRODUCTION, READY once it is PRODUCTION_ACTIVE"
      - "production.shot_count recomputed"
  - method: GET
    path: "/studio/shots"
    description: "List shots, ordered by shot_code ASC."
    roles: [ProductionManager, Supervisor, Director, Artist, OutsourceCoordinator]
    code: 200
    input: ["production_id?", "status?", "limit?", "offset?"]
    output: Shot[]
    side_effects: []
  - method: GET
    path: "/studio/shots/{id}"
    description: "Read one shot with its persisted STAGE_WEIGHT earned-value figures."
    roles: [ProductionManager, Supervisor, Director, Artist, OutsourceCoordinator]
    code: 200
    input: []
    output: Shot
    side_effects: []
  - method: GET
    path: "/studio/shots/{id}/earned-value"
    description: "Computed read of the shot's earned value under either variant of calculations.shot_earned_value; variant defaults to STAGE_WEIGHT."
    roles: [ProductionManager, Supervisor, Director]
    code: 200
    input: ["variant?"]
    output: { shot_id: string, variant: string, bcws_cents: integer, bcwp_cents: integer, acwp_cents: integer, cpi: number, spi: number, computed_at: string }
    side_effects: []
  # --------------------------------------------------------------- ShotStageTask
  - method: GET
    path: "/studio/stage-tasks"
    description: "List stage tasks; the only discovery channel for the five tasks cascade-created with a shot. Ordered by stage_order ASC."
    roles: [ProductionManager, Supervisor, Director, Artist, OutsourceCoordinator, PartnerRepresentative]
    code: 200
    input: ["shot_id?", "outsource_package_id?", "stage?", "status?", "limit?", "offset?"]
    output: ShotStageTask[]
    side_effects: []
  - method: GET
    path: "/studio/stage-tasks/{id}"
    description: "Read one stage task with its revision count and escalation flag."
    roles: [ProductionManager, Supervisor, Director, Artist, OutsourceCoordinator, PartnerRepresentative]
    code: 200
    input: []
    output: ShotStageTask
    side_effects: []
  - method: POST
    path: "/studio/stage-tasks/{id}/assign"
    description: "Start a stage by assigning an artist. Requires the production to be PRODUCTION_ACTIVE and the previous stage of the same shot to be APPROVED."
    roles: [ProductionManager]
    code: 200
    input: [assigned_artist_user_id, "budgeted_hours?"]
    output: ShotStageTask
    side_effects:
      - "status NOT_STARTED -> IN_PROGRESS; shot.current_stage set; shot.status READY -> IN_PRODUCTION"
  - method: POST
    path: "/studio/stage-tasks/{id}/log-hours"
    description: "Add worked hours to a task in progress, feeding acwp and the HOURS_PROGRESS earned-value variant."
    roles: [Artist, PartnerRepresentative]
    code: 200
    input: [hours]
    output: ShotStageTask
    side_effects:
      - "actual_hours += hours; shot.labor_cost_cents, shot.acwp_cents and production.direct_committed_cents, overhead_fee_cents, total_committed_cents, available_cents recomputed"
  - method: POST
    path: "/studio/stage-tasks/{id}/submit"
    description: "Submit a stage for supervisor review; also the re-submission after a retake."
    roles: [Artist, PartnerRepresentative]
    code: 200
    input: ["hours?"]
    output: ShotStageTask
    side_effects:
      - "status IN_PROGRESS|RETAKE -> SUBMITTED, submitted_by_user_id = X-User-ID, submitted_at = clock now"
      - "actual_hours += hours when hours is supplied"
  - method: POST
    path: "/studio/stage-tasks/{id}/review-decision"
    description: "Supervisor decision on a submitted or in-review stage: APPROVED earns the stage weight, RETAKE increments the revision count and can escalate the shot."
    roles: [Supervisor]
    code: 200
    input: [decision, "note?"]
    output: ShotStageTask
    side_effects:
      - "APPROVED recomputes shot.bcwp_cents, shot.cpi, shot.spi, shot.status and the production rollups"
      - "RETAKE increments revision_count, may latch escalated per calculations.stage_retake_escalation, and recomputes shot.retake_count, shot.escalation_flag, production.total_retake_count, production.at_risk_shot_count"
  # --------------------------------------------------------------- ScreeningRoom
  - method: POST
    path: "/studio/screening-rooms"
    description: "Register a screening room. A newly registered room is UNCALIBRATED and cannot host a session until it is calibrated."
    roles: [ProductionManager]
    code: 201
    input: [name, seat_capacity, room_color_space, "turnover_buffer_minutes?", "calibration_valid_days?"]
    output: ScreeningRoom
    side_effects:
      - "last_calibrated_at = null, calibration_status = UNCALIBRATED"
  - method: GET
    path: "/studio/screening-rooms"
    description: "List screening rooms with their calibration status evaluated against the logical clock."
    roles: [ProductionManager, Supervisor, Director, Artist, OutsourceCoordinator]
    code: 200
    input: ["calibration_status?", "limit?", "offset?"]
    output: ScreeningRoom[]
    side_effects: []
  - method: GET
    path: "/studio/screening-rooms/{id}"
    description: "Read one screening room; calibration_status is derived at read time from last_calibrated_at, calibration_valid_days and the logical clock."
    roles: [ProductionManager, Supervisor, Director, Artist, OutsourceCoordinator]
    code: 200
    input: []
    output: ScreeningRoom
    side_effects: []
  - method: POST
    path: "/studio/screening-rooms/{id}/calibrate"
    description: "Record a color calibration, restarting the validity window at the current logical clock."
    roles: [ProductionManager]
    code: 200
    input: []
    output: ScreeningRoom
    side_effects:
      - "last_calibrated_at = clock now; calibration_status becomes CALIBRATED and expires calibration_valid_days later"
  # ---------------------------------------------------------------- ReviewSession
  - method: POST
    path: "/studio/review-sessions"
    description: "Book a review session in a screening room. The room must be calibrated and the buffered window must be free."
    roles: [Director]
    code: 201
    input: [production_id, screening_room_id, session_type, window_start, window_end, attendee_count]
    output: ReviewSession
    side_effects:
      - "status = SCHEDULED; a later booking in the same room must leave at least turnover_buffer_minutes of clear time on either side of this window"
  - method: GET
    path: "/studio/review-sessions"
    description: "List review sessions, ordered by window_start ASC."
    roles: [ProductionManager, Supervisor, Director, Artist, OutsourceCoordinator]
    code: 200
    input: ["production_id?", "screening_room_id?", "session_type?", "status?", "limit?", "offset?"]
    output: ReviewSession[]
    side_effects: []
  - method: GET
    path: "/studio/review-sessions/{id}"
    description: "Read one review session with its note and retake counters."
    roles: [ProductionManager, Supervisor, Director, Artist, OutsourceCoordinator]
    code: 200
    input: []
    output: ReviewSession
    side_effects: []
  - method: POST
    path: "/studio/review-sessions/{id}/start"
    description: "Open a scheduled session so notes can be raised. Rejected when the room's calibration has expired."
    roles: [Director]
    code: 200
    input: []
    output: ReviewSession
    side_effects:
      - "status SCHEDULED -> IN_PROGRESS, opened_at = clock now"
  - method: POST
    path: "/studio/review-sessions/{id}/close"
    description: "Close the session, converting every open MAJOR or BLOCKING note into a retake on its target stage task."
    roles: [Director]
    code: 200
    input: []
    output: ReviewSession
    side_effects:
      - "notes processed in created_at ASC order; MAJOR and BLOCKING notes become RETAKE_ISSUED and drive their target task to RETAKE, MINOR notes stay OPEN"
      - "retake_issued_count set; affected shots and the production recompute retake, escalation and completion counters"
  - method: POST
    path: "/studio/review-sessions/{id}/cancel"
    description: "Abandon a session. Open notes are waived rather than converted into retakes, and the room window is freed."
    roles: [Director, ProductionManager]
    code: 200
    input: ["reason?"]
    output: ReviewSession
    side_effects:
      - "status -> CANCELLED, every OPEN note -> WAIVED, no retake is issued, the buffered window no longer blocks the room"
  # ----------------------------------------------------------------- DirectorNote
  - method: POST
    path: "/studio/director-notes"
    description: "Raise a director note against a stage task during an open session."
    roles: [Director]
    code: 201
    input: [review_session_id, shot_stage_task_id, severity, note_text]
    output: DirectorNote
    side_effects:
      - "status = OPEN; session.note_count recomputed; a target task in SUBMITTED moves to IN_REVIEW"
  - method: GET
    path: "/studio/director-notes"
    description: "List director notes, ordered by created_at ASC."
    roles: [ProductionManager, Supervisor, Director, Artist, OutsourceCoordinator]
    code: 200
    input: ["review_session_id?", "shot_stage_task_id?", "severity?", "status?", "limit?", "offset?"]
    output: DirectorNote[]
    side_effects: []
  - method: GET
    path: "/studio/director-notes/{id}"
    description: "Read one director note."
    roles: [ProductionManager, Supervisor, Director, Artist, OutsourceCoordinator]
    code: 200
    input: []
    output: DirectorNote
    side_effects: []
  - method: POST
    path: "/studio/director-notes/{id}/resolution"
    description: "Resolve a note once its target stage task is approved, or waive it outright."
    roles: [Director]
    code: 200
    input: [resolution]
    output: DirectorNote
    side_effects:
      - "RESOLVED requires the target task to be APPROVED; WAIVED does not revert an already issued retake"
      - "clearing the last non-terminal BLOCKING note of a scope unblocks deliverable submission"
  # ------------------------------------------------------------------ RenderPool
  - method: POST
    path: "/studio/render-pools"
    description: "Register a render farm pool with its core count and per-core-hour rate."
    roles: [ProductionManager]
    code: 201
    input: [name, total_cores, cost_per_core_hour_cents]
    output: RenderPool
    side_effects:
      - "committed_core_hours = 0.00, reserved_job_count = 0, version = 1"
  - method: GET
    path: "/studio/render-pools"
    description: "List render pools with their current commitment."
    roles: [ProductionManager, Supervisor, Director, Artist, OutsourceCoordinator]
    code: 200
    input: ["limit?", "offset?"]
    output: RenderPool[]
    side_effects: []
  - method: GET
    path: "/studio/render-pools/{id}"
    description: "Read one render pool; the version returned here is what POST /studio/render-jobs must echo."
    roles: [ProductionManager, Supervisor, Director, Artist, OutsourceCoordinator]
    code: 200
    input: []
    output: RenderPool
    side_effects: []
  # ------------------------------------------------------------------- RenderJob
  - method: POST
    path: "/studio/render-jobs"
    description: "Reserve farm capacity for a stage task over a window. Admission is all-or-nothing per calculations.render_pool_admission; a CRITICAL request may preempt lower-priority reservations."
    roles: [ProductionManager]
    code: 201
    input: [render_pool_id, shot_stage_task_id, priority, requested_cores, window_start, window_end, frame_count, seconds_per_frame, expected_render_pool_version]
    output: RenderJob
    side_effects:
      - "increments RenderPool.version by 1"
      - "status = RESERVED; cost_per_frame_cents and estimated_cost_cents computed per calculations.render_job_cost"
      - "render_pool.committed_core_hours and reserved_job_count recomputed; shot.render_cost_committed_cents and production.render_committed_cents recomputed"
      - "a CRITICAL admission drives the selected victims RESERVED -> PREEMPTED and releases their commitment first"
  - method: GET
    path: "/studio/render-jobs"
    description: "List render jobs; filter by pool, by stage task, by the CRITICAL job that preempted them, or by status."
    roles: [ProductionManager, Supervisor, Director, Artist, OutsourceCoordinator]
    code: 200
    input: ["render_pool_id?", "shot_stage_task_id?", "preempted_by_render_job_id?", "priority?", "status?", "limit?", "offset?"]
    output: RenderJob[]
    side_effects: []
  - method: GET
    path: "/studio/render-jobs/{id}"
    description: "Read one render job with its estimated and settled cost."
    roles: [ProductionManager, Supervisor, Director, Artist, OutsourceCoordinator]
    code: 200
    input: []
    output: RenderJob
    side_effects: []
  - method: POST
    path: "/studio/render-jobs/{id}/complete"
    description: "Settle a reservation with the actual seconds per frame. outcome COMPLETED requires frames_completed == frame_count; outcome FAILED requires strictly fewer."
    roles: [ProductionManager]
    code: 200
    input: [outcome, actual_seconds_per_frame, frames_completed]
    output: RenderJob
    side_effects:
      - "increments RenderPool.version by 1"
      - "cost_per_frame_cents recomputed from the actual seconds and final_cost_cents = cost_per_frame_cents * frames_completed"
      - "committed core hours released; shot.render_cost_actual_cents, shot.acwp_cents, shot.cpi and production.render_actual_cents, acwp_cents, cpi recomputed"
  - method: POST
    path: "/studio/render-jobs/{id}/cancel"
    description: "Release a reservation before it runs. The pool and every ledger above it return to their exact pre-reservation values."
    roles: [ProductionManager]
    code: 200
    input: []
    output: RenderJob
    side_effects:
      - "increments RenderPool.version by 1"
      - "status RESERVED -> CANCELLED, final_cost_cents stays null"
      - "render_pool.committed_core_hours, reserved_job_count, shot.render_cost_committed_cents and production.render_committed_cents restored to their pre-reservation values"
  # ------------------------------------------------------------- OutsourcePartner
  - method: POST
    path: "/studio/outsource-partners"
    description: "Onboard an outsourcing partner with its security posture. Quality scores start at the neutral default."
    roles: [OutsourceCoordinator]
    code: 201
    input: [legal_name, security_certification_level, "mfa_enforced?", "watermark_required?"]
    output: OutsourcePartner
    side_effects:
      - "status = ONBOARDING; quality_score_rolling = quality_score_lifetime = 50.00; qc_decided_package_count = 0"
  - method: GET
    path: "/studio/outsource-partners"
    description: "List partners with both quality variants."
    roles: [ProductionManager, Supervisor, Director, Artist, OutsourceCoordinator]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: OutsourcePartner[]
    side_effects: []
  - method: GET
    path: "/studio/outsource-partners/{id}"
    description: "Read one partner; quality_score_rolling and quality_score_lifetime are the two variants of calculations.partner_quality_score."
    roles: [ProductionManager, Supervisor, Director, Artist, OutsourceCoordinator]
    code: 200
    input: []
    output: OutsourcePartner
    side_effects: []
  - method: POST
    path: "/studio/outsource-partners/{id}/status"
    description: "Approve, suspend or reinstate a partner. Suspension recalls every live package and retakes the work it covered."
    roles: [OutsourceCoordinator]
    code: 200
    input: [status]
    output: OutsourcePartner
    side_effects:
      - "APPROVED from ONBOARDING requires security_certification_level != NONE"
      - "SUSPENDED recalls packages in created_at ASC order, zeroes their fee_committed_cents, restores the production budget position, drives their scoped stage tasks in {SUBMITTED, IN_REVIEW, APPROVED} to RETAKE while leaving NOT_STARTED and IN_PROGRESS tasks untouched, and clears outsource_package_id on every scoped task"
      - "reinstatement does not restore recalled packages or revert issued retakes"
  # ------------------------------------------------------------- OutsourcePackage
  - method: POST
    path: "/studio/outsource-packages"
    description: "Draft an outsourcing package scoping a set of stage tasks to a partner at a security tier."
    roles: [OutsourceCoordinator]
    code: 201
    input: [production_id, partner_id, package_code, security_tier, fee_cents, stage_task_ids, "quality_min_score?"]
    output: OutsourcePackage
    side_effects:
      - "status = DRAFT; fee_committed_cents = 0; the stage tasks are not linked until the package is issued"
  - method: GET
    path: "/studio/outsource-packages"
    description: "List outsourcing packages, ordered by created_at ASC."
    roles: [ProductionManager, Supervisor, Director, Artist, OutsourceCoordinator, PartnerRepresentative]
    code: 200
    input: ["production_id?", "partner_id?", "status?", "limit?", "offset?"]
    output: OutsourcePackage[]
    side_effects: []
  - method: GET
    path: "/studio/outsource-packages/{id}"
    description: "Read one outsourcing package with its QC result."
    roles: [ProductionManager, Supervisor, Director, Artist, OutsourceCoordinator, PartnerRepresentative]
    code: 200
    input: []
    output: OutsourcePackage
    side_effects: []
  - method: POST
    path: "/studio/outsource-packages/{id}/issue"
    description: "Issue a drafted package: checks partner approval, security tier, rolling quality and the prospective budget position, then links the scoped stage tasks."
    roles: [OutsourceCoordinator]
    code: 200
    input: []
    output: OutsourcePackage
    side_effects:
      - "status DRAFT -> ISSUED; every task in stage_task_ids gets outsource_package_id set"
      - "no money is committed yet"
  - method: POST
    path: "/studio/outsource-packages/{id}/accept"
    description: "Partner accepts an issued package, committing its fee to the production ledger."
    roles: [PartnerRepresentative]
    code: 200
    input: []
    output: OutsourcePackage
    side_effects:
      - "fee_committed_cents = fee_cents; production.direct_committed_cents, overhead_fee_cents, total_committed_cents and available_cents recomputed per calculations.production_budget_position"
  - method: POST
    path: "/studio/outsource-packages/{id}/deliver"
    description: "Partner delivers the package for QC. Watermarking and MFA obligations are enforced here."
    roles: [PartnerRepresentative]
    code: 200
    input: [watermark_applied]
    output: OutsourcePackage
    side_effects:
      - "delivery_count += 1; scoped tasks in IN_PROGRESS or RETAKE move to SUBMITTED with submitted_by_user_id = X-User-ID"
  - method: POST
    path: "/studio/outsource-packages/{id}/qc-decision"
    description: "Supervisor QC on a delivered package. PASS approves the scoped stage work, FAIL retakes it; both recompute the partner's two quality scores."
    roles: [Supervisor]
    code: 200
    input: [decision, qc_score]
    output: OutsourcePackage
    side_effects:
      - "qc_score and qc_decided_at stored; partner.qc_decided_package_count += 1; partner.quality_score_rolling and quality_score_lifetime recomputed"
      - "PASS drives scoped tasks in {SUBMITTED, IN_REVIEW} to APPROVED and lifts shot.bcwp_cents; FAIL drives them to RETAKE and lifts the retake counters"
      - "fee_committed_cents is unchanged by either branch"
  # ------------------------------------------------------------------ Deliverable
  - method: POST
    path: "/studio/deliverables"
    description: "Create the next version of a deliverable. Requires the caller's view of the production to be current, and supersedes the QC_PASSED version of the same group."
    roles: [ProductionManager]
    code: 201
    input: [production_id, deliverable_type, color_space, resolution, expected_production_version, "shot_id?", "frame_rate?", "bit_depth?"]
    output: Deliverable
    side_effects:
      - "increments Production.version by 1"
      - "version_index and version_label assigned per calculations.deliverable_version_label"
      - "any QC_PASSED sibling in the same (production_id, shot_id, deliverable_type) group moves to SUPERSEDED"
  - method: GET
    path: "/studio/deliverables"
    description: "List deliverables, ordered by created_at ASC."
    roles: [ProductionManager, Supervisor, Director, Artist, OutsourceCoordinator]
    code: 200
    input: ["production_id?", "shot_id?", "deliverable_type?", "status?", "limit?", "offset?"]
    output: Deliverable[]
    side_effects: []
  - method: GET
    path: "/studio/deliverables/{id}"
    description: "Read one deliverable with its version label and color specification."
    roles: [ProductionManager, Supervisor, Director, Artist, OutsourceCoordinator]
    code: 200
    input: []
    output: Deliverable
    side_effects: []
  - method: POST
    path: "/studio/deliverables/{id}/submit"
    description: "Submit a drafted deliverable for QC. Blocked by open BLOCKING notes in scope, and a MASTER_EXR additionally requires a closed client review."
    roles: [ProductionManager]
    code: 200
    input: []
    output: Deliverable
    side_effects:
      - "status DRAFT -> SUBMITTED"
  - method: POST
    path: "/studio/deliverables/{id}/qc-decision"
    description: "Supervisor QC on a submitted deliverable. FAIL requires a note and frees the version group for a new version."
    roles: [Supervisor]
    code: 200
    input: [decision, "qc_note?"]
    output: Deliverable
    side_effects:
      - "status SUBMITTED -> QC_PASSED or QC_FAILED; qc_note stored"
  - method: POST
    path: "/studio/deliverables/{id}/deliver"
    description: "Ship a QC-passed deliverable. Only allowed once the production has reached DELIVERY."
    roles: [ProductionManager]
    code: 200
    input: []
    output: Deliverable
    side_effects:
      - "status QC_PASSED -> DELIVERED, delivered_at = clock now; the row becomes immutable"
  # ------------------------------------------------------------ test-driving only
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the server's logical UTC clock, which every window, calibration validity, decay window and earned-value schedule fraction reads. Before any call to this endpoint the logical clock reads exactly 2026-08-01T00:00:00Z and never falls back to real wall-clock time."
    roles: [ProductionManager]
    code: 200
    input: [to_iso8601]
    output: { current_utc: string }
    side_effects:
      - "no business row is mutated; derived reads such as ScreeningRoom.calibration_status and GET /studio/shots/{id}/earned-value change with the clock"

errors:
  # ---- authentication / authorization ----
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "X-User-ID or X-User-Role header missing, empty, or naming an unknown role"
  - id: ERR_UNAUTHORIZED
    http: 403
    condition: "the caller's role is not listed on the endpoint"
  - id: ERR_NOT_TASK_OWNER
    http: 403
    condition: "stage-task submit or log-hours attempted by someone who is neither the assigned artist nor the representative of the task's outsourcing partner"
  - id: ERR_NOT_PACKAGE_PARTNER
    http: 403
    condition: "package accept or deliver attempted by a PartnerRepresentative whose X-User-ID is not the package's partner_id"
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 403
    condition: "the user deciding a gate, a stage or a library candidate is the same user who submitted it"
  # ---- request shape ----
  - id: ERR_VALIDATION
    http: 422
    condition: "missing required field, wrong type, illegal enum member, out-of-range number, to_phase PRODUCTION_ACTIVE on advance-phase, frames_completed inconsistent with the declared outcome, qc_score on the wrong side of quality_min_score for the chosen decision, or a reuse chain deeper than MAX_CHAIN_DEPTH"
  # ---- existence ----
  - id: ERR_PRODUCTION_NOT_FOUND
    http: 404
    condition: "production id in the path or body does not exist"
  - id: ERR_GATE_NOT_FOUND
    http: 404
    condition: "pre-production gate id does not exist"
  - id: ERR_ASSET_NOT_FOUND
    http: 404
    condition: "asset id in the path or a derived_from_asset_id does not exist"
  - id: ERR_SHOT_NOT_FOUND
    http: 404
    condition: "shot id in the path or a deliverable shot_id does not exist"
  - id: ERR_TASK_NOT_FOUND
    http: 404
    condition: "stage task id in the path, a shot_stage_task_id, or an element of stage_task_ids does not exist"
  - id: ERR_ROOM_NOT_FOUND
    http: 404
    condition: "screening room id does not exist"
  - id: ERR_SESSION_NOT_FOUND
    http: 404
    condition: "review session id does not exist"
  - id: ERR_NOTE_NOT_FOUND
    http: 404
    condition: "director note id does not exist"
  - id: ERR_POOL_NOT_FOUND
    http: 404
    condition: "render pool id does not exist"
  - id: ERR_RENDER_JOB_NOT_FOUND
    http: 404
    condition: "render job id does not exist"
  - id: ERR_PARTNER_NOT_FOUND
    http: 404
    condition: "outsource partner id does not exist"
  - id: ERR_PACKAGE_NOT_FOUND
    http: 404
    condition: "outsource package id does not exist"
  - id: ERR_DELIVERABLE_NOT_FOUND
    http: 404
    condition: "deliverable id does not exist"
  # ---- optimistic concurrency ----
  - id: ERR_STALE_RENDER_POOL_VERSION
    http: 412
    condition: "expected_render_pool_version on POST /studio/render-jobs is not the pool's stored version"
  - id: ERR_STALE_PRODUCTION_VERSION
    http: 412
    condition: "expected_production_version on POST /studio/deliverables is not the production's stored version"
  # ---- state ----
  - id: ERR_PRODUCTION_PHASE_INVALID
    http: 409
    condition: "the production's phase forbids the operation: gate work outside PRE_PRODUCTION, stage or child creation outside PRODUCTION_ACTIVE, deliverable delivery outside DELIVERY, anything at all once WRAPPED, or an advance-phase whose to_phase is not the legal successor"
  - id: ERR_GATE_STATE_INVALID
    http: 409
    condition: "gate submit from IN_REVIEW, APPROVED or LOCKED, or a review-decision on a gate that is not IN_REVIEW"
  - id: ERR_ASSET_BUILD_STATE_INVALID
    http: 409
    condition: "advance-build to a state that is not the immediate successor, retiring an unpublished asset, or a library-submit on an asset that is not PUBLISHED"
  - id: ERR_ASSET_LIBRARY_STATE_INVALID
    http: 409
    condition: "library-submit on an asset that is not PRIVATE, or a library-decision on an asset that is not LIBRARY_CANDIDATE"
  - id: ERR_TASK_STATE_INVALID
    http: 409
    condition: "assign on a task that has left NOT_STARTED, submit from NOT_STARTED or APPROVED, review-decision on a task that is not SUBMITTED or IN_REVIEW, resolving a note whose target task is not APPROVED, or reserving render capacity for a task that is not in {IN_PROGRESS, SUBMITTED, IN_REVIEW, RETAKE}"
  - id: ERR_SESSION_STATE_INVALID
    http: 409
    condition: "start on a session that is not SCHEDULED, close on a session that is not IN_PROGRESS, cancel on a CLOSED session, or a note raised against a session that is not IN_PROGRESS"
  - id: ERR_NOTE_STATE_INVALID
    http: 409
    condition: "resolution on a note that is already RESOLVED or WAIVED"
  - id: ERR_RENDER_JOB_STATE_INVALID
    http: 409
    condition: "complete or cancel on a job that is not RESERVED"
  - id: ERR_PARTNER_STATE_INVALID
    http: 409
    condition: "a partner status transition that is not ONBOARDING -> APPROVED, APPROVED -> SUSPENDED or SUSPENDED -> APPROVED"
  - id: ERR_PACKAGE_STATE_INVALID
    http: 409
    condition: "issue on a package that is not DRAFT, accept on a package that is not ISSUED, deliver on a package that is neither IN_PROGRESS nor QC_FAILED, qc-decision on a package that is not DELIVERED, or stage work submitted under a package that is not IN_PROGRESS"
  - id: ERR_DELIVERABLE_STATE_INVALID
    http: 409
    condition: "submit on a deliverable that is not DRAFT, qc-decision on one that is not SUBMITTED, or deliver on one that is not QC_PASSED"
  - id: ERR_PARTNER_SUSPENDED
    http: 409
    condition: "issue, accept or deliver attempted while the partner is SUSPENDED"
  - id: ERR_PREVIOUS_STAGE_NOT_APPROVED
    http: 409
    condition: "assign on a stage whose predecessor stage in the same shot is not APPROVED"
  # ---- safety / compliance ----
  - id: ERR_SECURITY_TIER_INSUFFICIENT
    http: 422
    condition: "the partner's security_certification_level is below the package's security_tier"
  - id: ERR_SECURITY_REQUIREMENT_UNMET
    http: 422
    condition: "approving a partner with certification NONE, delivering without a watermark when the partner requires one, or delivering a TIER2/TIER3 package for a partner without MFA"
  - id: ERR_PARTNER_QUALITY_BELOW_STANDARD
    http: 422
    condition: "partner.quality_score_rolling is below the package's quality_min_score at issue time"
  - id: ERR_COLOR_PIPELINE_MISMATCH
    http: 422
    condition: "deliverable color_space is outside the production's approved list, a MASTER_EXR does not match master_color_space, or a client review is booked into a room whose color space is not approved"
  - id: ERR_ROOM_NOT_CALIBRATED
    http: 422
    condition: "a session is booked into a room that has never been calibrated"
  - id: ERR_CALIBRATION_EXPIRED
    http: 422
    condition: "a session is started after the room's calibration validity window has elapsed"
  - id: ERR_BLOCKING_NOTES_OPEN
    http: 422
    condition: "deliverable submit while a BLOCKING note in scope is still OPEN or RETAKE_ISSUED"
  # ---- referential ----
  - id: ERR_CROSS_PRODUCTION_REFERENCE
    http: 422
    condition: "a note, package scope, reuse source or deliverable shot reference crosses production boundaries"
  - id: ERR_ASSET_REUSE_CYCLE
    http: 422
    condition: "a derived_from_asset_id assignment would make the reuse chain revisit an asset already on the chain"
  - id: ERR_CLIENT_REVIEW_REQUIRED
    http: 422
    condition: "MASTER_EXR submit before any CLIENT_REVIEW session of the production has been closed"
  # ---- temporal / capacity constraints ----
  - id: ERR_INVALID_WINDOW
    http: 422
    condition: "window_start is not strictly before window_end, a window starts in the past relative to the logical clock, or a shot's planned_start_at is not before planned_finish_at"
  - id: ERR_ROOM_WINDOW_CONFLICT
    http: 409
    condition: "the buffered session window intersects the buffered window of another SCHEDULED or IN_PROGRESS session in the same room"
  - id: ERR_ROOM_SEAT_CAPACITY_EXCEEDED
    http: 422
    condition: "attendee_count exceeds the room's seat_capacity"
  - id: ERR_DUPLICATE_CODE
    http: 409
    condition: "production_code, shot_code, asset_code or package_code repeats inside its uniqueness scope"
  - id: ERR_GATE_SEQUENCE_VIOLATION
    http: 409
    condition: "a gate is submitted while an earlier gate of the same production is not yet APPROVED"
  - id: ERR_GATES_INCOMPLETE
    http: 409
    condition: "advance-phase requested while the production is still in PRE_PRODUCTION with outstanding gates"
  - id: ERR_SHOTS_INCOMPLETE
    http: 409
    condition: "advance-phase to DELIVERY while completed_shot_count is below shot_count"
  - id: ERR_DELIVERABLES_INCOMPLETE
    http: 409
    condition: "advance-phase to WRAPPED with no DELIVERED deliverable, or with one still in DRAFT, SUBMITTED or QC_PASSED"
  - id: ERR_DELIVERABLE_VERSION_CONFLICT
    http: 409
    condition: "a new deliverable version is created while the group already holds a DRAFT or SUBMITTED row"
  # ---- fiscal ----
  - id: ERR_RENDER_CAPACITY_EXCEEDED
    http: 409
    condition: "the requested cores exceed the priority-adjusted headroom over the requested window, and preemption cannot free enough capacity"
  - id: ERR_RENDER_BUDGET_EXCEEDED
    http: 402
    condition: "committed plus actual plus estimated render spend would exceed the production's render_allowance_cents"
  - id: ERR_BUDGET_WOULD_EXCEED
    http: 402
    condition: "issuing the package would push total_committed_cents, including recomputed overhead, past budget plus contingency"

roles:
  - name: ProductionManager
    description: "Runs the production: opens shows, submits pre-production gate packages, creates shots, assigns stages, books rooms and pools, reserves render capacity, advances phases and ships deliverables."
    identity: opaque
    exclusive_operations:
      - "POST /studio/productions"
      - "POST /studio/productions/{id}/advance-phase"
      - "POST /studio/pre-production-gates/{id}/submit"
      - "POST /studio/shots"
      - "POST /studio/stage-tasks/{id}/assign"
      - "POST /studio/assets/{id}/relink-source"
      - "POST /studio/screening-rooms"
      - "POST /studio/screening-rooms/{id}/calibrate"
      - "POST /studio/render-pools"
      - "POST /studio/render-jobs"
      - "POST /studio/render-jobs/{id}/complete"
      - "POST /studio/render-jobs/{id}/cancel"
      - "POST /studio/deliverables"
      - "POST /studio/deliverables/{id}/submit"
      - "POST /studio/deliverables/{id}/deliver"
      - "POST /_clock/set_current_utc"
    shared_operations:
      - "POST /studio/assets (with Artist)"
      - "POST /studio/review-sessions/{id}/cancel (with Director)"
      - "every GET under /studio except none — all reads are shared with Supervisor, Director, Artist and OutsourceCoordinator"
  - name: Artist
    description: "Builds assets and executes shot stages. Acts only on the stage tasks assigned to their own X-User-ID."
    identity: opaque
    exclusive_operations:
      - "POST /studio/assets/{id}/advance-build"
      - "POST /studio/assets/{id}/library-submit"
    shared_operations:
      - "POST /studio/assets (with ProductionManager)"
      - "POST /studio/stage-tasks/{id}/log-hours (with PartnerRepresentative)"
      - "POST /studio/stage-tasks/{id}/submit (with PartnerRepresentative)"
      - "all GET reads"
    ownership_rule: "log-hours and submit require X-User-ID == ShotStageTask.assigned_artist_user_id, else ERR_NOT_TASK_OWNER; the opaque id is stored on the task and is never compared to any entity id"
  - name: Supervisor
    description: "Quality authority: decides stage reviews, promotes library assets, and signs off outsourced packages and deliverables."
    identity: opaque
    exclusive_operations:
      - "POST /studio/stage-tasks/{id}/review-decision"
      - "POST /studio/assets/{id}/library-decision"
      - "POST /studio/outsource-packages/{id}/qc-decision"
      - "POST /studio/deliverables/{id}/qc-decision"
    shared_operations:
      - "all GET reads"
    segregation_rule: "may not decide an artifact they submitted themselves (stage, gate or library candidate), else ERR_SEGREGATION_OF_DUTIES"
  - name: Director
    description: "Creative authority: decides pre-production gates, runs review sessions and raises and resolves director notes."
    identity: opaque
    exclusive_operations:
      - "POST /studio/pre-production-gates/{id}/review-decision"
      - "POST /studio/review-sessions"
      - "POST /studio/review-sessions/{id}/start"
      - "POST /studio/review-sessions/{id}/close"
      - "POST /studio/director-notes"
      - "POST /studio/director-notes/{id}/resolution"
    shared_operations:
      - "POST /studio/review-sessions/{id}/cancel (with ProductionManager)"
      - "all GET reads"
  - name: OutsourceCoordinator
    description: "Owns the vendor surface: onboards, approves and suspends partners, and drafts and issues outsourcing packages."
    identity: opaque
    exclusive_operations:
      - "POST /studio/outsource-partners"
      - "POST /studio/outsource-partners/{id}/status"
      - "POST /studio/outsource-packages"
      - "POST /studio/outsource-packages/{id}/issue"
    shared_operations:
      - "all GET reads"
  - name: PartnerRepresentative
    description: "The vendor acting on its own packages: accepts, delivers, and works the stage tasks its package covers. Sees only the stage-task and package read surfaces."
    identity: "entity_backed:OutsourcePartner"
    exclusive_operations:
      - "POST /studio/outsource-packages/{id}/accept"
      - "POST /studio/outsource-packages/{id}/deliver"
    shared_operations:
      - "POST /studio/stage-tasks/{id}/log-hours (with Artist)"
      - "POST /studio/stage-tasks/{id}/submit (with Artist)"
      - "GET /studio/stage-tasks, GET /studio/stage-tasks/{id}, GET /studio/outsource-packages, GET /studio/outsource-packages/{id}"
    ownership_rule: "X-User-ID is the id of an OutsourcePartner row. accept and deliver require X-User-ID == OutsourcePackage.partner_id, else ERR_NOT_PACKAGE_PARTNER; stage work requires the task's outsource_package_id to belong to that partner, else ERR_NOT_TASK_OWNER. Every other read endpoint omits this role, so a partner probing productions, shots, notes or deliverables receives ERR_UNAUTHORIZED."
