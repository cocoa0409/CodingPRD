      - name: cost_share_award_tier_selection
        claim_type: tiered_pricing
        excluded_because:
          difficulty_instance: cost_share_bonus_tier_keyed_on_pre_bonus_award
          rationale: |
            That §1.8 combinatorial_formula instance already pins the tier ladder by keying BONUS_TIERS on
            award_before_bonus_cents rather than on the final award_cents, including the inclusive
            120000 lower edge — the exact confusion a separate tiered_pricing corner would test.

      - name: risk_score_weight_application
        claim_type: weighted_scoring
        excluded_because:
          difficulty_instance: risk_score_intake_provisional_vs_post_inspection_verified
          rationale: |
            That §1.8 dual_variant_calc instance already applies the 0.30/0.30/0.25/0.15 weights under both
            variants on one parcel and pins the credit-before-multiplier evaluation order, which subsumes a
            plain weighted-scoring corner.

      - name: zone_severity_threshold_bands
        claim_type: threshold
        excluded_because:
          difficulty_instance: zone_severity_major_at_exact_0_6000_deficit_ratio
          rationale: |
            That §1.8 boundary_precision_check instance already sits on the inclusive upper edge of the MAJOR
            band and shows the next tick landing in CRITICAL, covering the threshold algorithm's only
            interesting decision.

      - name: cost_recovery_variant_selection
        claim_type: Variant Selection
        excluded_because:
          difficulty_instance: cost_recovery_district_contracted_vs_voluntary_precompliance
          rationale: |
            That §1.8 dual_variant_calc instance already drives both branches of the recovery_basis selector
            from the presence or absence of a prior voluntary SupportEnrollment on the same parcel, and
            asserts the divergent totals.

      - name: risk_basis_reconciliation_after_variant_switch
        claim_type: Variant Reconciliation
        excluded_because:
          difficulty_instance: risk_score_intake_provisional_vs_post_inspection_verified
          rationale: |
            The same §1.8 instance also reconciles the switch: after completion the parcel carries exactly one
            risk_score with risk_score_basis flipped to POST_INSPECTION_VERIFIED, so no stale
            intake_provisional value survives alongside it.

  # ==========================================================================
  - section: validations
    instances:

      - name: notice_lead_time_violation_under_ten_days
        claim_type: Violation → Error
        grounds:
          - validations.priority_54
          - errors[ERR_NOTICE_LEAD_TIME_VIOLATION]
          - entities.InspectionCycle.fields.notice_lead_days
        distinguishing_aspect: |
          Priority 54 measures whole days from the logical clock to scheduled_start_utc against the
          cycle's notice_lead_days: a visit 7 days out is refused 422 ERR_NOTICE_LEAD_TIME_VIOLATION and
          the inspection stays SCHEDULED with notice_method null, so the owner is never deemed noticed.
        test_recipe:
          setup:
            - "Active cycle with the default notice_lead_days 10; clock 2026-08-01T00:00:00Z; an inspection scheduled for 2026-08-08T15:00:00Z, only 7 whole days out."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /fire-district/inspection-cycles"
              payload: { season_year: 2026 }
              as: ProgramAdmin
              captures: { cyc: "$.data.id", lead: "$.data.notice_lead_days" }
            - call: "POST /fire-district/inspection-cycles/${cyc}/activate"
              payload: {}
              as: ProgramAdmin
            - call: "POST /fire-district/inspectors"
              payload: { full_name: "Ivan Ruiz", certification_level: "ADVANCED", status: "ACTIVE" }
              as: ProgramAdmin
              captures: { insp1: "$.data.id" }
            - call: "POST /fire-district/parcels"
              payload: { apn: "APN-4001", owner_name: "Ann Reyes", owner_email: "ann@example.com", situs_address: "12 Ridge Rd", roof_class: "CLASS_B", vegetation_type: "BRUSH", slope_pct: 30, lot_area_sqft: 43560, hazard_zone: "HIGH", access_constraint: "GATED" }
              as: ProgramAdmin
              captures: { p1: "$.data.id" }
            - call: "POST /fire-district/inspections"
              payload: { parcel_id: "${p1}", cycle_id: "${cyc}", inspector_id: "${insp1}", inspection_type: "INITIAL", scheduled_start_utc: "2026-08-08T15:00:00Z", scheduled_end_utc: "2026-08-08T17:00:00Z", access_arrangement: "EXTERIOR_ONLY" }
              as: ProgramAdmin
              captures: { ins1: "$.data.id" }
          trigger:
            - call: "POST /fire-district/inspections/${ins1}/notice"
              payload: { notice_method: "CERTIFIED_MAIL" }
              as: ProgramAdmin
              captures: { err: "$.data.error_id" }
          assert:
            - "${lead} == 10 (the cycle default)"
            - "HTTP 422 and ${err} == \"ERR_NOTICE_LEAD_TIME_VIOLATION\""
            - "Inspection.${ins1}.status == \"SCHEDULED\", notice_method == null and notice_sent_at_utc == null"
            - "GET /fire-district/violation-notices with parcel_id ${p1} returns total_count == 0"
            - "Scheduling itself was legal — the violation is on the notice call, not on POST /fire-district/inspections"

      - name: notice_lead_time_satisfied_at_exactly_ten_days
        claim_type: Satisfaction → Pass
        grounds:
          - validations.priority_54
          - state_machines.Inspection.SCHEDULED_to_NOTICED.preconditions
        distinguishing_aspect: |
          The comparison is >= notice_lead_days, so exactly 10 whole days passes: a 2026-08-11T00:00:00Z
          start noticed at clock 2026-08-01T00:00:00Z succeeds, while one second later (start
          2026-08-10T23:59:59Z) would fall short. The boundary case is a pass, not a failure.
        test_recipe:
          setup:
            - "Active cycle (notice_lead_days 10); clock 2026-08-01T00:00:00Z; an inspection whose scheduled_start_utc is exactly 10 days later."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /fire-district/inspection-cycles"
              payload: { season_year: 2026 }
              as: ProgramAdmin
              captures: { cyc: "$.data.id" }
            - call: "POST /fire-district/inspection-cycles/${cyc}/activate"
              payload: {}
              as: ProgramAdmin
            - call: "POST /fire-district/inspectors"
              payload: { full_name: "Ivan Ruiz", certification_level: "ADVANCED", status: "ACTIVE" }
              as: ProgramAdmin
              captures: { insp1: "$.data.id" }
            - call: "POST /fire-district/parcels"
              payload: { apn: "APN-4101", owner_name: "Ann Reyes", owner_email: "ann@example.com", situs_address: "12 Ridge Rd", roof_class: "CLASS_B", vegetation_type: "BRUSH", slope_pct: 30, lot_area_sqft: 43560, hazard_zone: "HIGH", access_constraint: "GATED" }
              as: ProgramAdmin
              captures: { p1: "$.data.id" }
            - call: "POST /fire-district/inspections"
              payload: { parcel_id: "${p1}", cycle_id: "${cyc}", inspector_id: "${insp1}", inspection_type: "INITIAL", scheduled_start_utc: "2026-08-11T00:00:00Z", scheduled_end_utc: "2026-08-11T02:00:00Z", access_arrangement: "EXTERIOR_ONLY" }
              as: ProgramAdmin
              captures: { ins1: "$.data.id" }
          trigger:
            - call: "POST /fire-district/inspections/${ins1}/notice"
              payload: { notice_method: "IN_PERSON" }
              as: ProgramAdmin
              captures: { st: "$.data.status", sent: "$.data.notice_sent_at_utc" }
          assert:
            - "HTTP 200, ${st} == \"NOTICED\" and ${sent} == \"2026-08-01T00:00:00Z\""
            - "No error envelope is returned: 2026-08-11T00:00:00Z - 2026-08-01T00:00:00Z == 10 whole days == notice_lead_days"
            - "Inspection.${ins1}.notice_method == \"IN_PERSON\" and version == 2"
            - "The same setup with scheduled_start_utc 2026-08-10T23:59:59Z (9 whole days) instead yields 422 ERR_NOTICE_LEAD_TIME_VIOLATION"

      - name: certification_priority_ladder_ordering
        claim_type: Priority Ordering
        excluded_because:
          difficulty_instance: inspector_not_certified_outranks_window_conflict_rejected
          rationale: |
            That §1.8 priority_pair_validation_conflict instance already builds a request that violates
            priority 50 and priority 62 at once and pins the answer to the lower-numbered rule, which is
            exactly the Priority Ordering claim.

      - name: abatement_authorization_priority_conflict
        claim_type: Priority conflict
        excluded_because:
          difficulty_instance: notice_not_overdue_outranks_abatement_cap_exceeded_rejected
          rationale: |
            That §1.8 instance already sends one authorize-abatement request that simultaneously trips
            priority 40 (notice not OVERDUE) and priority 72 (estimated cost above the cap) and pins the
            response to ERR_NOTICE_NOT_OVERDUE.

      - name: certificate_issue_on_never_inspected_parcel_rejected
        claim_type: Cross-entity validation
        grounds:
          - validations.priority_58
          - errors[ERR_PARCEL_NOT_INSPECTED]
          - entities.Parcel.fields.compliance_status
        distinguishing_aspect: |
          The certificate-decision endpoint validates a field on a different entity: with
          Parcel.compliance_status still PENDING_INSPECTION the ISSUE decision is refused 409
          ERR_PARCEL_NOT_INSPECTED (distinct from the ERR_OPEN_VIOLATION_EXISTS branch of the same
          priority), while DENY on the very same certificate succeeds because the cross-entity check
          guards only the ISSUE path.
        test_recipe:
          setup:
            - "A never-inspected parcel with a REQUESTED certificate; no cycle activity is needed."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /fire-district/parcels"
              payload: { apn: "APN-4201", owner_name: "Ann Reyes", owner_email: "ann@example.com", situs_address: "12 Ridge Rd", roof_class: "CLASS_B", vegetation_type: "BRUSH", slope_pct: 30, lot_area_sqft: 43560, hazard_zone: "HIGH", access_constraint: "GATED" }
              as: ProgramAdmin
              captures: { p1: "$.data.id", p1_status: "$.data.compliance_status" }
            - call: "POST /fire-district/parcels/${p1}/compliance-certificates"
              payload: { requester_kind: "REAL_ESTATE", transaction_reference: "ESC-7788" }
              as: TitleAgent
              captures: { cert1: "$.data.id" }
          trigger:
            - call: "POST /fire-district/compliance-certificates/${cert1}/decision"
              payload: { decision: "ISSUE" }
              as: ProgramAdmin
              captures: { err: "$.data.error_id" }
          assert:
            - "${p1_status} == \"PENDING_INSPECTION\" and Parcel.${p1}.last_passed_inspection_at_utc == null"
            - "HTTP 409 and ${err} == \"ERR_PARCEL_NOT_INSPECTED\" — not ERR_OPEN_VIOLATION_EXISTS, since the parcel holds no notice at all"
            - "ComplianceCertificate.${cert1}.status == \"REQUESTED\" with issued_at_utc == null, expires_at_utc == null and both snapshot fields null"
            - "POST /fire-district/compliance-certificates/${cert1}/decision with decision DENY and note \"Parcel has never been inspected\" then returns 200 with status DENIED"

      - name: enrollment_at_exclusive_window_end_rejected
        claim_type: Temporal validation
        grounds:
          - validations.priority_44
          - errors[ERR_PROGRAM_WINDOW_CLOSED]
          - entities.SupportProgram.fields.service_window_end_utc
        distinguishing_aspect: |
          The service window is HALF-OPEN against the logical clock (start <= clock < end): an enrollment
          one second before service_window_end_utc is admitted and the same call with the clock standing
          exactly ON service_window_end_utc is refused 409 ERR_PROGRAM_WINDOW_CLOSED, so an inclusive-end
          or date-only comparison is distinguishable in one instant.
        test_recipe:
          setup:
            - "Active cycle; a CHIPPER_DAY program with 3 slots and window 2026-08-01T00:00:00Z..2026-09-30T00:00:00Z; two parcels; parcel A enrolls at 2026-09-29T23:59:59Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /fire-district/inspection-cycles"
              payload: { season_year: 2026 }
              as: ProgramAdmin
              captures: { cyc: "$.data.id" }
            - call: "POST /fire-district/inspection-cycles/${cyc}/activate"
              payload: {}
              as: ProgramAdmin
            - call: "POST /fire-district/parcels"
              payload: { apn: "APN-4301", owner_name: "Ann Reyes", owner_email: "ann@example.com", situs_address: "12 Ridge Rd", roof_class: "CLASS_B", vegetation_type: "BRUSH", slope_pct: 30, lot_area_sqft: 43560, hazard_zone: "HIGH", access_constraint: "GATED" }
              as: ProgramAdmin
              captures: { pA: "$.data.id" }
            - call: "POST /fire-district/parcels"
              payload: { apn: "APN-4302", owner_name: "Ben Ortiz", owner_email: "ben@example.com", situs_address: "14 Ridge Rd", roof_class: "CLASS_B", vegetation_type: "BRUSH", slope_pct: 30, lot_area_sqft: 43560, hazard_zone: "HIGH", access_constraint: "GATED" }
              as: ProgramAdmin
              captures: { pB: "$.data.id" }
            - call: "POST /fire-district/support-programs"
              payload: { cycle_id: "${cyc}", program_type: "CHIPPER_DAY", budget_total_cents: 0, capacity_slots: 3, service_window_start_utc: "2026-08-01T00:00:00Z", service_window_end_utc: "2026-09-30T00:00:00Z" }
              as: ProgramAdmin
              captures: { prog: "$.data.id", prog_v1: "$.data.version" }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-29T23:59:59Z" }
              as: ProgramAdmin
            - call: "POST /fire-district/support-enrollments"
              payload: { support_program_id: "${prog}", parcel_id: "${pA}", expected_program_version: "${prog_v1}" }
              as: ProgramAdmin
              captures: { enA: "$.data.id", enA_status: "$.data.status" }
            - call: "GET /fire-district/support-programs/${prog}"
              payload: {}
              as: ProgramAdmin
              captures: { prog_v2: "$.data.version", prog_slots: "$.data.reserved_slots" }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-30T00:00:00Z" }
              as: ProgramAdmin
          trigger:
            - call: "POST /fire-district/support-enrollments"
              payload: { support_program_id: "${prog}", parcel_id: "${pB}", expected_program_version: "${prog_v2}" }
              as: ProgramAdmin
              captures: { err: "$.data.error_id" }
          assert:
            - "${enA_status} == \"APPROVED\": a clock one second inside the window admits the enrollment"
            - "${prog_v2} == 2 and ${prog_slots} == 1 after parcel A's admission"
            - "HTTP 409 on the trigger and ${err} == \"ERR_PROGRAM_WINDOW_CLOSED\" — the clock equal to service_window_end_utc is OUTSIDE the half-open window"
            - "GET /fire-district/support-enrollments with support_program_id ${prog} returns total_count == 1 (only ${enA})"
            - "SupportProgram.${prog}.reserved_slots is still 1 and version is still ${prog_v2}: the refused enrollment reserved nothing"
            - "${prog_v2} was the current token, so the answer is a 409 window verdict and not a 412 ERR_STALE_PROGRAM_VERSION"

      - name: contractor_daily_order_capacity_counted_per_calendar_date
        claim_type: Aggregate validation
        grounds:
          - validations.priority_70
          - errors[ERR_CONTRACTOR_CAPACITY_EXCEEDED]
