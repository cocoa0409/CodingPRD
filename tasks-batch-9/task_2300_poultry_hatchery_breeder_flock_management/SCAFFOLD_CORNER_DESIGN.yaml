            - {call: "POST /placement-orders", payload: {farm_id: "${fm1}", requested_breed: "ROSS_308", requested_placement_date: "2026-08-23T00:00:00Z", requested_chicks: 4000}, as: HatcheryManager, captures: {o2: "$.data.id"}}
