          assert:
            - "e_read == ERR_NOT_RESOURCE_OWNER and e_write == ERR_NOT_RESOURCE_OWNER (403)"
            - "e_pay == ERR_NOT_RESOURCE_OWNER (ownership precedes the DRAFT-state payment gate)"
            - "ok_id == ${reg} for the owning guardian"

      - name: chaperone_respond_ownership_and_terminal_lockdown
        claim_type: ownership_denial
        grounds:
          - roles.Chaperone
