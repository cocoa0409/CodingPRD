              as: ShippingClerk
            - call: "POST /reels/${reel_b}/load"
              payload: { lot_id: "${lot_b}", load_length_ft: 2000, occupancy_start_at: "2026-08-01T00:00:00Z" }
              as: ShippingClerk
            - call: "GET /customer-orders/${ord_id}"
