  - region?
  output: Grower
  side_effects: []
- method: GET
  path: /potato-shed/growers/{id}
  description: Read a grower (version for settlement OCC)
  roles:
  - ShedAdmin
  - IntakeClerk
  - StorageManager
  - SettlementClerk
  - Grower
