          setup:
            - "Instructor certified only for LSAT, max_concurrent_cohorts 3, already SCHEDULED on a SAT cohort window [2026-06-01,2026-06-30); a second SAT cohort with an OVERLAPPING window [2026-06-15,2026-07-15) awaits scheduling with the same (uncertified) instructor."
