  - section: cross_cutting_complexity_layers
    instances:

      - name: both_occ_guards_bump_their_parent_version_by_exactly_one
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules.assessment-create-stale-questionnaire
          - concurrency_rules.offer-create-stale-candidate
          - errors[ERR_STALE_QUESTIONNAIRE_VERSION]
          - errors[ERR_STALE_CANDIDATE_VERSION]
          - entities.LateralQuestionnaire.fields.version
          - entities.Candidate.fields.version
          - complexity_layers.optimistic_concurrency
        distinguishing_aspect: |
          This is the honest lost-update race rather than a hand-made bogus version: the SAME
          observed version is replayed after a successful write by the competing writer, which
          is exactly what a second browser tab would send. Both guards must be exercised in
          one recipe because they live on DIFFERENT parents with different occ_field names,
          and each write must advance its parent's version by EXACTLY one - an implementation
          that bumps on every touch (or that bumps the candidate when the assessment is
          written) breaks the arithmetic assertions even though both 412s still fire. The
          successful retries at the refreshed versions prove the guards are not simply
          always-fail, and the supersede semantics on both parents are pinned at the same
          time.
        test_recipe:
          setup:
            - "One OPEN PracticeGroup with guarantee_budget_total_usd 5000000.00 and one ACTIVE SearchFirmEngagement (fee_pct 0.2500)."
            - "One Candidate in DILIGENCE with the SLIM BOOK; its LateralQuestionnaire is UNDER_REVIEW with version captured as lpq_v1 and the candidate's version captured as cand_v1."
            - "No PortabilityAssessment and no CompensationOffer exist yet."
