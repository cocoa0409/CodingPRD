      - name: rebate_ledger_conservation_partial_remit_then_write_off
        grounds:
          - calculations.invariant_rebate_ledger_conservation
          - state_machines.RebateInvoice (ISSUED -> PARTIALLY_PAID and PARTIALLY_PAID -> WRITTEN_OFF)
          - state_machines.Booking (INVOICED -> SHORT_PAID)
          - entities.RebateInvoice.fields.written_off_cents
        distinguishing_aspect: |
          A DIFFERENT conserved quantity — cents on the rebate ledger, not physical rooms:
          collected_cents + written_off_cents + outstanding_cents must always equal
          total_due_cents. A partial remittance of 6200 against 16200 leaves 10000 outstanding,
          and the compensating WRITE_OFF must move exactly those 10000 cents into
          written_off_cents while leaving collected_cents at 6200 and total_due_cents untouched at
          16200. Because collected_cents is greater than zero the covered booking must land on
          SHORT_PAID and not on WRITTEN_OFF, which is where an implementation that only checks
          "invoice was written off" gets it wrong.
        test_recipe:
          setup:
            - "Tournament posture BOOKING_CLOSED then RECONCILING, night_count 3."
            - "One EXECUTED HotelContract, rebate_model PER_ROOM_NIGHT_FLAT at 900 cents, attrition_threshold_pct 0.10."
            - "One 20-room block over 3 nights (contracted_nights 60, threshold_nights 6) with a single booking of 6 rooms actualized at 18 room nights, so the invoice totals 16200 cents with no attrition penalty."
            - "The invoice is ISSUED and then partially remitted with 6200 cents, leaving 10000 outstanding."
          setup_api_calls:
            - call: "POST /housing/tournaments"
              payload: { name: "Fall Classic 2026", rights_holder_org: "USYS", destination_org: "Metro CVB", start_date: "2026-09-10", end_date: "2026-09-13", booking_deadline: "2026-09-01T00:00:00Z", stay_to_play_required: true, share_pct_organizer: 0.50, share_pct_rights_holder: 0.30, share_pct_destination: 0.20 }
              as: HousingManager
              captures: { tourn_id: "$.data.id" }
            - call: "POST /housing/hotels"
              payload: { name: "Host Inn Metro", city: "Metro", total_rooms: 100, distance_miles_from_venue: 3.0 }
              as: HousingManager
              captures: { hotel_id: "$.data.id" }
            - call: "POST /housing/hotel-contracts"
              payload: { tournament_id: "${tourn_id}", hotel_id: "${hotel_id}", negotiated_nightly_rate_cents: 14900, rebate_model: "PER_ROOM_NIGHT_FLAT", rebate_flat_cents_per_room_night: 900, attrition_threshold_pct: 0.10, attrition_penalty_rate_cents_per_room_night: 900, cutoff_date: "2026-08-20" }
              as: HousingManager
              captures: { contract_id: "$.data.id" }
            - call: "POST /housing/room-blocks"
              payload: { contract_id: "${contract_id}", room_type: "DOUBLE_QUEEN", block_size_rooms: 20, arrival_date: "2026-09-10", departure_date: "2026-09-13", release_deadline: "2026-08-25" }
              as: HousingManager
              captures: { block_id: "$.data.id" }
            - call: "POST /housing/hotel-contracts/${contract_id}/negotiation"
              payload: { action: "SUBMIT" }
              as: HousingManager
            - call: "POST /housing/hotel-contracts/${contract_id}/negotiation"
              payload: { action: "COUNTERSIGN" }
              as: HotelRepresentative
              as_user_id: "${hotel_id}"
            - call: "POST /housing/teams"
              payload: { name: "Riverside FC 16U", home_city: "Farville", home_state: "ST", org_contact_email: "riverside@example.com", distance_miles_from_venue: 120.0 }
              as: HousingManager
              captures: { team_id: "$.data.id" }
            - call: "POST /housing/team-registrations"
              payload: { tournament_id: "${tourn_id}", team_id: "${team_id}", roster_player_count: 13, roster_staff_count: 3 }
              as: HousingManager
              captures: { reg_id: "$.data.id", reg_v1: "$.data.version" }
            - call: "POST /housing/bookings"
              payload: { registration_id: "${reg_id}", room_block_id: "${block_id}", rooms_requested: 6, check_in_date: "2026-09-10", check_out_date: "2026-09-13", expected_registration_version: "${reg_v1}" }
              as: HousingManager
              captures: { bk_id: "$.data.id" }
            - call: "POST /housing/bookings/${bk_id}/rooming-list"
              payload:
                entries:
                  - { room_index: 1, occupant_count: 2, minor_occupant_count: 0 }
                  - { room_index: 2, occupant_count: 2, minor_occupant_count: 0 }
                  - { room_index: 3, occupant_count: 2, minor_occupant_count: 0 }
                  - { room_index: 4, occupant_count: 2, minor_occupant_count: 0 }
                  - { room_index: 5, occupant_count: 2, minor_occupant_count: 0 }
                  - { room_index: 6, occupant_count: 2, minor_occupant_count: 0 }
              as: HousingManager
            - call: "POST /housing/bookings/${bk_id}/confirm"
              payload: {}
              as: HousingManager
            - call: "POST /housing/tournaments/${tourn_id}/close-booking"
              payload: {}
              as: HousingManager
            - call: "POST /housing/bookings/${bk_id}/actualizations"
              payload: { reported_room_nights: 18, report_note: "final folio" }
              as: HotelRepresentative
              as_user_id: "${hotel_id}"
            - call: "POST /housing/rebate-invoices"
              payload: { contract_id: "${contract_id}", period_label: "2026-09" }
              as: HousingManager
              captures: { inv_id: "$.data.id" }
            - call: "POST /housing/rebate-invoices/${inv_id}/lifecycle"
              payload: { action: "ISSUE" }
              as: HousingManager
            - call: "POST /housing/rebate-invoices/${inv_id}/remit"
              payload: { amount_cents: 6200 }
              as: HotelRepresentative
              as_user_id: "${hotel_id}"
            - call: "GET /housing/rebate-invoices/${inv_id}"
              payload: {}
              as: HousingManager
          trigger:
            - call: "POST /housing/rebate-invoices/${inv_id}/lifecycle"
              payload: { action: "WRITE_OFF" }
              as: HousingManager
          assert:
            - "RebateInvoice.${inv_id}.total_due_cents == 16200"
            - "RebateInvoice.${inv_id}.status == WRITTEN_OFF"
            - "RebateInvoice.${inv_id}.collected_cents == 6200"
            - "RebateInvoice.${inv_id}.written_off_cents == 10000"
            - "RebateInvoice.${inv_id}.outstanding_cents == 0"
            - "Booking.${bk_id}.rebate_status == SHORT_PAID"
            - "Booking.${bk_id}.booking_status == CHECKED_OUT"
            - "Booking.${bk_id}.rebate_accrued_cents == 16200"
            - "RoomBlock.${block_id}.status == OPEN"
            - "Tournament.${tourn_id}.posture == RECONCILING"
