  # -------------------------------------------------------------------------
  # Rule 5 — Validation priority conflicts across different error-category pairs
  # -------------------------------------------------------------------------
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: state_vs_business_safety_self_approval
        grounds:
          - validations[priority=5]
          - validations[priority=6]
          - errors[ERR_INVALID_STATE]
          - errors[ERR_SELF_APPROVAL_FORBIDDEN]
        distinguishing_aspect: |
          Error-category pair = state vs business_safety. Brief.approve from
          DRAFT (wrong state, would be ERR_INVALID_STATE) AND with approver ==
          author (would be ERR_SELF_APPROVAL_FORBIDDEN) — the state check at
          priority 5 must win because it is checked first.
        test_recipe:
          setup:
            - "Case in BRIEFING with ACTIVE schedule, COMPLETE record"
            - "Brief B in DRAFT (never submitted to review)"
            - "B.author_attorney_id == A1"
