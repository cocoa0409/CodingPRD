      - name: de_minimis_phaseout_at_exactly_one_hundred_thousand
        grounds:
          - calculations.withdrawal_liability_allocation
          - entities.WithdrawalAssessment.fields.de_minimis_reduction_cents
          - entities.WithdrawalAssessment.fields.raw_allocation_cents
          - entities.Fund.fields.unallocated_uvb_cents
        distinguishing_aspect: |
          A money-threshold boundary reached through POST /withdrawal-assessments: a raw
          allocation of exactly 10000000 cents keeps the full 750000-cent de minimis, while
          10000001 cents loses exactly one cent of it, because the phase-out subtracts
          max(0, raw_allocation_cents - 10000000) rather than testing raw >= 10000000.
        test_recipe:
          setup:
            - "Logical clock at 2026-04-01T00:00:00Z."
            - "Fund with total_uvb_cents 100000000, nothing allocated, pool contributions 20000000 in each of five years, giving a de minimis of 750000 cents."
            - "Employer B whose five prior-year contributions sum to exactly 10000000 (10.0000000000% of the pool) and Employer C whose five sum to 10000001."
            - "Both employers have prior_year_base_units of 1000 in each year, so each annual payment base is 825500 cents."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-04-01T00:00:00Z" }
              as: FundAdministrator
            - call: "POST /funds"
