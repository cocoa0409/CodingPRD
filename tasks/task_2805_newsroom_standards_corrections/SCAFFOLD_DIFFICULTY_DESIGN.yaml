            - call: "POST /standards-desk/stories"
              payload: { newsroom_id: "${nr}", lead_journalist_id: "${rep}", headline: "The witness who was never in the courtroom", defamation_claim_count: 4, privacy_subject_count: 2, unverified_document_count: 1 }
              as: Reporter
