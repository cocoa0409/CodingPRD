  # ---------------------------------------------------------------------------
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: state_beats_safety_on_layup_session
        grounds:
          - validations[priority=6]
          - validations[priority=7]
        distinguishing_aspect: |
          Error-category pair {state, business_safety}: the session targets a
          RELEASED work order (state violation) with a resin batch that is also
          past its pot life (safety violation); the priority table pins
          ERR_INVALID_STATE (p6) over ERR_RESIN_POT_LIFE_EXPIRED (p7).
          Companion instance exercises a different category pair.
        test_recipe:
          setup:
            - "Clock T0; permit; approved PN-100; PRODUCTION mold; WO-P1 created but never started (RELEASED); batch mixed at T0 with pot life 60 min; clock advanced 2 hours so the batch is expired"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-06-01T10:00:00Z" }, as: ShopManager }
            - { call: "POST /emission-permits", payload: { permit_code: "PER-Q3", period_start: "2026-06-01T00:00:00Z", period_end: "2026-09-01T00:00:00Z", styrene_quota_kg: 50.0 }, as: EHSOfficer }
            - { call: "POST /molds", payload: { mold_code: "MOLD-P1", maintenance_interval_cycles: 10, prototype_parts_required: 1, tooling_phase: "PRODUCTION" }, as: ToolingEngineer, captures: { mold_id: $.data.id } }
            - { call: "POST /ply-books", payload: { part_number: "PN-100", revision: "A", part_area_m2: 2.0, plies: [ { seq: 1, material_code: "CF-200", orientation_deg: 0, areal_weight_g_m2: 200 }, { seq: 2, material_code: "CF-300", orientation_deg: 90, areal_weight_g_m2: 300 } ], resin_system: "POLYESTER", target_fiber_volume_pct: 0.5 }, as: ToolingEngineer, captures: { pb_id: $.data.id } }
            - { call: "POST /ply-books/${pb_id}/approve", payload: {}, as: ToolingEngineer }
            - { call: "POST /work-orders", payload: { work_order_no: "WO-P1", part_number: "PN-100", mold_id: "${mold_id}", ply_book_id: "${pb_id}", quantity: 1, due_date: "2026-07-01T00:00:00Z" }, as: ShopManager, captures: { wo_id: $.data.id } }
            - { call: "POST /resin-batches", payload: { batch_code: "BATCH-P1", resin_system: "POLYESTER", resin_mass_g: 1000, catalyst_mass_g: 20, target_ratio_pct: 2.0, ratio_tolerance_pct: 1.0, nominal_pot_life_minutes: 60 }, as: Laminator, as_user_id: "op-lam-1", captures: { batch_id: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-06-01T12:00:00Z" }, as: ShopManager }
          trigger:
            - { call: "POST /layup-sessions", payload: { work_order_id: "${wo_id}", resin_batch_id: "${batch_id}", resin_used_g: 100 }, as: Laminator, as_user_id: "op-lam-1", captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_INVALID_STATE (work order not LAYUP_IN_PROGRESS wins over the expired-batch safety check)"

      - name: safety_beats_constraint_on_layup_session
        grounds:
          - validations[priority=7]
          - validations[priority=8]
        distinguishing_aspect: |
          Error-category pair {business_safety, business_constraint}: the
          session would both breach the styrene quota (safety, p7) and mix a
          POLYESTER batch into an EPOXY ply book (constraint, p8); the priority
          table pins ERR_PERMIT_QUOTA_EXCEEDED (p7) over
          ERR_RESIN_SYSTEM_MISMATCH (p8). Companion instance exercises
          {state, business_safety}.
        test_recipe:
          setup:
            - "Clock T0; permit PER-TINY2 quota 0.005 kg; approved EPOXY ply book PN-200; PRODUCTION mold; WO-P2 in LAYUP_IN_PROGRESS; POLYESTER batch (system mismatch)"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-06-01T10:00:00Z" }, as: ShopManager }
            - { call: "POST /emission-permits", payload: { permit_code: "PER-TINY2", period_start: "2026-06-01T00:00:00Z", period_end: "2026-09-01T00:00:00Z", styrene_quota_kg: 0.005 }, as: EHSOfficer, captures: { per_id: $.data.id } }
            - { call: "POST /molds", payload: { mold_code: "MOLD-P2", maintenance_interval_cycles: 10, prototype_parts_required: 1, tooling_phase: "PRODUCTION" }, as: ToolingEngineer, captures: { mold_id: $.data.id } }
