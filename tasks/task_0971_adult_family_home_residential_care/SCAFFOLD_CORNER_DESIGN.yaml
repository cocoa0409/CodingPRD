            - "Admission.${adm2} is excluded from the resident_id-filtered list"
  # =========================================================================
  # Section: errors (§1.6 claims: every error id triggerable)
  # =========================================================================
  - section: errors
    instances:
      - name: err_unauthenticated_entity_backed_missing_user_id
        claim_type: violation_to_error
        grounds:
          - errors[ERR_UNAUTHENTICATED]
          - validations[priority=1]
          - roles[CaregiverRole]
        distinguishing_aspect: "CaregiverRole is entity_backed:Caregiver — a request carrying the role header but no X-User-ID fails authentication itself (401), before any role-permission or existence check."
        test_recipe:
          setup:
            - "Empty database; request omits X-User-ID"
          setup_api_calls: []
          trigger:
            - call: "POST /api/adl-logs"
              payload: { resident_id: "11111111-2222-3333-4444-555555555555", adl_type: "BATHING", assistance_level: "PARTIAL", performed_at: "2026-06-02T15:00:00Z", caregiver_id: "11111111-2222-3333-4444-555555555555" }
              as: CaregiverRole
              captures: { err_id: $.data.error_id }
          assert:
            - "err_id == ERR_UNAUTHENTICATED with HTTP 401 (missing X-User-ID for entity_backed role)"

      - name: err_self_approval_triggered
        claim_type: violation_to_error
        grounds:
          - errors[ERR_SELF_APPROVAL]
