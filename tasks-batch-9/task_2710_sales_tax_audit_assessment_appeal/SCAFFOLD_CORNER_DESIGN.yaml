      - name: a_waived_penalty_blocks_abatement_and_a_reduction_stops_at_the_balance
        claim_type: Error triggerable
        grounds: ["endpoints.POST /assessments/{id}/abate-penalty", "endpoints.POST /appeal-proceedings/{id}/decision", errors.ERR_ABATEMENT_NOT_ALLOWED, errors.ERR_REDUCTION_EXCEEDS_BALANCE, calculations.penalty_abatement]
        distinguishing_aspect: |
          On the small-balance fixture penalty_cents is 0 because the provisional
          total hit the 5000 ceiling, so there is nothing to abate: a
          FIRST_TIME_COMPLIANT request must be refused with
          ERR_ABATEMENT_NOT_ALLOWED (422) rather than posting a 0-cent
          PENALTY_ABATEMENT row. The abatement attempt is made BEFORE any proceeding
          exists, so it cannot be confused with the priority-10
          ERR_APPEAL_PENDING path. A REDUCED decision for 4763 then exceeds the 4762
          balance by one cent and must be refused with ERR_REDUCTION_EXCEEDS_BALANCE
          while leaving the proceeding OPEN, and 4762 exactly must settle the notice.
