              as_user_id: "admin-1"
            - call: "GET /facilities/${fac_id}"
              payload: {}
              as: HealthAuthorityAdmin
              as_user_id: "admin-1"
              captures: { fac_v: $.data.version }
            - call: "POST /closure-orders"
              payload: { facility_id: "${fac_id}", closure_reason: "EQUIPMENT", expected_facility_version: "${fac_v}", note: "Filter pump alarm" }
              as: HealthAuthorityAdmin
              as_user_id: "admin-1"
              captures: { co_id: $.data.id }
          trigger:
            - call: "POST /closure-orders/${co_id}/reopen-decision"
              payload: { decision: "VOID" }
              as: HealthAuthorityAdmin
              as_user_id: "admin-1"
          assert:
            - "ClosureOrder.${co_id}.status == VOIDED — no ERR_SEGREGATION_OF_DUTIES even though admin-1 both ordered and voided it"
            - "Facility.${fac_id}.operating_posture == RESTRICTED and posture_reason == SIGNAGE_INCOMPLETE (the closure no longer gates it)"
            - "A second VOID on the same order returns ERR_INVALID_CLOSURE_STATE"

      - name: complaint_advances_through_full_investigation_to_closed
        claim_type: Valid Transition
        grounds:
          - state_machines.Complaint.RECEIVED_to_TRIAGED
          - state_machines.Complaint.TRIAGED_to_INVESTIGATING
          - state_machines.Complaint.INVESTIGATING_to_SUBSTANTIATED
          - state_machines.Complaint.SUBSTANTIATED_to_CLOSED
        distinguishing_aspect: "A WATER_QUALITY complaint scores 0 with risk_variant null and walks RECEIVED -> TRIAGED -> INVESTIGATING -> SUBSTANTIATED -> CLOSED, with SUBSTANTIATE gated on the linked COMPLAINT inspection being FINALIZED."
        test_recipe:
          setup: ["A pool facility has a RECEIVED water-quality complaint and a scheduled COMPLAINT inspection."]
          setup_api_calls:
            - call: "POST /operators"
              payload: { legal_name: "Blue Lagoon Aquatics", contact_email: "ops@bluelagoon.example" }
              as: Anonymous
              captures: { op_id: $.data.id }
            - call: "POST /facilities"
              payload: { operator_id: "${op_id}", name: "Main Pool", facility_class: "CLASS_B_PUBLIC", surface_area_sqft: 1200, water_volume_gallons: 60000, max_depth_feet: 10, drain_count: 2 }
              as: Operator
              as_user_id: "${op_id}"
              captures: { fac_id: $.data.id }
            - call: "POST /complaints"
              payload: { facility_id: "${fac_id}", complaint_type: "WATER_QUALITY", narrative: "Water was cloudy all weekend", reporter_contact: "swimmer@example.com" }
              as: Anonymous
              captures: { c_id: $.data.id }
            - call: "POST /inspections"
