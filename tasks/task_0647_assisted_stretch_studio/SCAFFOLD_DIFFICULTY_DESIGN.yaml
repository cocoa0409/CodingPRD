  # ===========================================================================
  - rule_id: compensating_invariant
    instances:
      # ----- conserved quantity #1: membership available_credits (hold + free-cancel release)
      - name: membership_available_credits_conserved_across_book_then_free_cancel
        grounds:
          - state_machines.Booking.credit_status.HELD_to_RELEASED
          - calculations.credit_wallet_balance
          - entities.Membership.fields.available_credits
        distinguishing_aspect: |
          Forward action (create booking, hold 2 credits) paired with its compensating
          action (free CANCELLED, release 2 credits) leaves the named conserved quantity
          Membership.available_credits = granted - held - consumed UNCHANGED at 8.
          Conserved quantity = membership available credits.
        test_recipe:
          setup:
            - "Member with intro completed; ACTIVE membership granting 8 credits; available_credits=8 before booking."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-04-10T00:00:00Z" }
              as: StudioManager
            - call: "POST /locations"
              payload: { name: "Inv Loc", open_minute_of_day: 0, close_minute_of_day: 1440, cancel_window_hours: 12 }
              as: StudioManager
              captures: { loc: $.data.id }
            - call: "POST /flexologists"
              payload: { location_id: "${loc}", full_name: "Flex", certified_intro: true }
              as: StudioManager
              captures: { flex: $.data.id }
            - call: "POST /tables"
              payload: { location_id: "${loc}", label: "T1" }
              as: StudioManager
              captures: { tbl: $.data.id }
            - call: "POST /services"
              payload: { location_id: "${loc}", name: "Intro", kind: "INTRO", duration_minutes: 25, credit_cost: 0, list_price_cents: 0 }
              as: StudioManager
              captures: { svc_intro: $.data.id }
            - call: "POST /services"
              payload: { location_id: "${loc}", name: "50m", kind: "ASSISTED_STRETCH", duration_minutes: 50, credit_cost: 2, list_price_cents: 6000 }
              as: StudioManager
              captures: { svc: $.data.id }
            - call: "POST /members"
              payload: { home_location_id: "${loc}", full_name: "Iva", email: "iva@x.com" }
              as: FrontDesk
              captures: { mem: $.data.id }
            - call: "POST /credit-packs"
              payload: { member_id: "${mem}", location_id: "${loc}", pack_credits: 1, base_unit_price_cents: 100, expires_utc: "2027-01-01T00:00:00Z" }
              as: FrontDesk
              captures: { pack0: $.data.id }
            - call: "POST /bookings"
              payload: { member_id: "${mem}", location_id: "${loc}", service_id: "${svc_intro}", flexologist_id: "${flex}", table_id: "${tbl}", session_start_utc: "2026-04-11T08:00:00Z", funding_source: "CREDIT_PACK", funding_id: "${pack0}" }
              as: FrontDesk
              captures: { b_intro: $.data.id }
            - call: "POST /bookings/${b_intro}/confirm"
              payload: {}
              as: FrontDesk
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-04-11T08:30:00Z" }
              as: StudioManager
            - call: "POST /bookings/${b_intro}/complete"
              payload: { assessment_shoulder: 90, assessment_hip: 85, assessment_spine: 80, assessment_ankle: 70 }
              as: Flexologist
              as_user_id: "${flex}"
            - call: "POST /memberships"
              payload: { member_id: "${mem}", location_id: "${loc}", tier: "PRO", monthly_fee_cents: 12000, included_credits: 8, rollover_cap: 4 }
              as: FrontDesk
              captures: { ship: $.data.id }
          trigger:
            # forward: book (hold 2) far in the future
            - call: "POST /bookings"
              payload: { member_id: "${mem}", location_id: "${loc}", service_id: "${svc}", flexologist_id: "${flex}", table_id: "${tbl}", session_start_utc: "2026-04-25T10:00:00Z", funding_source: "MEMBERSHIP", funding_id: "${ship}" }
              as: FrontDesk
              captures: { bk: $.data.id }
            # compensate: free cancel (clock far before window) -> release
            - call: "POST /bookings/${bk}/cancel"
              payload: {}
              as: FrontDesk
              captures: { cs: $.data.credit_status }
          assert:
            - "Booking.${bk}.schedule_status == CANCELLED"
            - "Booking.${bk}.credit_status == RELEASED"
            - "Membership.${ship}.held_credits == 0"
            - "Membership.${ship}.consumed_credits == 0"
            - "Membership.${ship}.available_credits == 8"

      # ----- conserved quantity #2: CreditPack held_credits across reschedule
      - name: pack_held_credits_conserved_across_reschedule
        grounds:
          - state_machines.Booking.schedule_status.CONFIRMED_to_CANCELLED
          - entities.Booking.fields.rescheduled_from_booking_id
          - calculations.credit_wallet_balance
          - entities.CreditPack.fields.held_credits
        distinguishing_aspect: |
          Reschedule cancels the predecessor (release 1 held credit from the pack) and
          immediately re-creates a replacement holding the same 1 credit; the conserved
