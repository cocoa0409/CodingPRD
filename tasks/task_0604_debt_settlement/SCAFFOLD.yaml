# =============================================================================
# Debt Settlement Program — PRD Benchmark Seed Tables (SCAFFOLD.yaml)
# Difficulty band: EXPERT (§0.4)
# Files §1.0–§1.7. Difficulty design (§1.8) and corner design (§1.9) live in
# their own sibling files.
# =============================================================================

scenario: |
  Debt Settlement Program (National Debt Relief/Freedom Debt Relief style):
  enrolled-debt portfolio & dedicated savings account, monthly deposit & reserve
  build, creditor settlement offer (% of balance), tiered settlement-fee accrual,
  1099-C cancellation-of-debt handling, creditor-lawsuit referral, drop/re-enroll,
  completion.

domain_name: debt-settlement
api_prefix: ""

complexity_profile:
  primary_archetype: ledger_reconciliation
  secondary_archetype: compliance_audit
  complexity_layers:
    - dual_variant_calculation        # estimated portfolio savings vs realized savings
    - rate_threshold_triggers          # tiered fee bands + reserve thresholds
    - cascading_side_effects           # settle -> fee accrual -> account debit -> debt close -> 1099-C
    - optimistic_concurrency           # offer acceptance / settlement funding against stale account version

  entity_topology: flat
  # Peer top-level collections (/programs, /clients, /debts, /offers, /settlements,
  # /fees, /lawsuits, /tax-events, /accounts, /deposits) linked by foreign keys in the
  # request body. No nested URL paths; cross-aggregate references (Settlement->Offer->Debt)
  # are plain FK fields.

  state_machine_shape: parallel
  # Program carries two INDEPENDENT state dimensions (account_standing × program_phase);
  # Debt is cyclic (drop -> WITHDRAWN -> re-enroll -> ENROLLED across programs); Offer is
  # branching (ACCEPTED / REJECTED / EXPIRED fork). Multiple non-linear shapes across entities.

  relationship_patterns:
    - one_to_many        # Program has many Debts/Deposits/Offers/Settlements
    - cross_aggregate    # Settlement references Offer references Debt
    - polymorphic        # TaxEvent.source_settlement_id and Lawsuit.debt_id cross-link

  role_model: peer_roles
  # ProgramAdmin (operator) owns program/account ops; NegotiationAgent owns creditor
  # offers/settlements; Client (entity-backed) owns deposits/drop. Non-overlapping
  # exclusive operations with a shared read surface.

  consistency_model: immediate

# =============================================================================
# §1.0 Response Envelope (FIXED — emitted verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Program
    parent: null
    common_fields: true   # id, created_at, updated_at, version
    fields:
      - { name: client_id, type: string, source: input, description: "FK -> Client.id; the enrolled debtor who owns this program" }
      - { name: program_phase, type: enum, source: system, description: "Lifecycle phase: ENROLLING | ACTIVE | COMPLETED | TERMINATED", constraints: "ENROLLING|ACTIVE|COMPLETED|TERMINATED" }
      - { name: account_standing, type: enum, source: computed, description: "Independent dedicated-account health dimension derived from missed deposits: CURRENT | DELINQUENT | DEFAULTED", constraints: "CURRENT|DELINQUENT|DEFAULTED" }
      - { name: target_settlement_pct, type: number, source: input, default: 0.50, description: "Forward-looking assumed settlement fraction used by the estimate variant (e.g. 0.50 = settle at 50% of balance)", constraints: "0 < value <= 1" }
      - { name: monthly_deposit_amount, type: number, source: input, description: "Scheduled recurring deposit into the dedicated account (in dollars)", constraints: "> 0" }
      - { name: deposit_day_of_month, type: integer, source: input, default: 1, description: "Day of month the recurring deposit is due", constraints: "1..28" }
      - { name: total_enrolled_balance, type: number, source: computed, description: "Sum of original_balance over Debts whose status is in {ENROLLED, IN_NEGOTIATION, SETTLED, LAWSUIT}; snapshotted into Debt.fee_rate_pct at enrollment time" }
      - { name: fee_tier_pct, type: number, source: computed, description: "Settlement-fee rate band selected from total_enrolled_balance at the moment a Debt is enrolled: <10000 -> 0.25, [10000,30000) -> 0.22, >=30000 -> 0.18" }
      - { name: missed_deposit_count, type: integer, source: computed, default: 0, description: "Count of MISSED MonthlyDeposit rows; drives account_standing" }
      - { name: estimated_total_savings, type: number, source: computed, description: "Estimate variant: forward-looking projected savings if every still-open debt settles at target_settlement_pct (see calculations.portfolio_savings)" }
      - { name: realized_total_savings, type: number, source: computed, description: "Actual variant: sum of realized savings over SETTLED debts only (see calculations.portfolio_savings)" }
      - { name: completion_eligible, type: boolean, source: computed, description: "True when every Debt is terminal (SETTLED or WITHDRAWN) and no fee is OUTSTANDING" }

  - name: Client
    parent: null
    common_fields: true
    fields:
      - { name: full_name, type: string, source: input, description: "Client legal name" }
      - { name: email, type: string, source: input, description: "Client email" }
      - { name: state_code, type: string, source: input, description: "Two-letter US state of residence", constraints: "2-letter code" }
      - { name: refunded_to_client_cents, type: integer, source: computed, default: 0, description: "Running total (in cents) refunded to the client from dedicated accounts on drop/termination" }

  - name: DedicatedAccount
    parent: Program
    common_fields: true
    fields:
      - { name: program_id, type: string, source: system, description: "FK -> Program.id; the program this savings account funds" }
      - { name: balance, type: number, source: computed, description: "CLEARED deposits minus funded settlement principal minus paid fees: sum(MonthlyDeposit.amount where status=CLEARED) - sum(Settlement.funded_amount where status in {FUNDED,COMPLETED}) - sum(SettlementFee.amount where status=PAID)" }
      - { name: lifetime_deposited, type: number, source: computed, description: "Sum of MonthlyDeposit.amount where status=CLEARED" }
      - { name: lifetime_disbursed, type: number, source: computed, description: "Sum of Settlement.funded_amount where status in {FUNDED,COMPLETED} plus SettlementFee.amount where status=PAID" }
      - { name: reserve_floor, type: number, source: input, default: 0, description: "Minimum balance that must remain after any settlement funding", constraints: ">= 0" }

  - name: Debt
    parent: Program
    common_fields: true
    fields:
      - { name: program_id, type: string, source: input, description: "FK -> Program.id; the program this debt is enrolled under" }
      - { name: creditor_name, type: string, source: input, description: "Original creditor" }
      - { name: account_number, type: string, source: input, description: "Creditor account reference; unique within a program", constraints: "unique per program" }
      - { name: original_balance, type: number, source: input, description: "Enrolled balance at the time the debt was added", constraints: "> 0" }
      - { name: current_balance, type: number, source: computed, description: "Remaining balance: original_balance until SETTLED, then 0; equals original_balance - settled_amount - forgiven_amount once SETTLED" }
      - { name: settled_amount, type: number, source: computed, default: 0, description: "Amount actually paid to the creditor on settlement (0 until SETTLED)" }
      - { name: forgiven_amount, type: number, source: computed, default: 0, description: "Cancellation-of-debt amount: original_balance - settled_amount (0 until SETTLED)" }
      - { name: fee_rate_pct, type: number, source: system, description: "Settlement-fee rate snapshotted from Program.fee_tier_pct at enrollment; immutable thereafter" }
      - { name: status, type: enum, source: system, description: "ENROLLED | IN_NEGOTIATION | LAWSUIT | SETTLED | WITHDRAWN", constraints: "ENROLLED|IN_NEGOTIATION|LAWSUIT|SETTLED|WITHDRAWN" }
      - { name: settled_offer_id, type: string, source: system, description: "FK -> SettlementOffer.id; the offer that produced the settlement, null until SETTLED" }

  - name: MonthlyDeposit
    parent: Program
    common_fields: true
    fields:
      - { name: program_id, type: string, source: input, description: "FK -> Program.id; the program/account this deposit funds" }
      - { name: scheduled_for, type: datetime, source: input, description: "ISO8601 instant the deposit is scheduled/recorded for" }
      - { name: amount, type: number, source: input, description: "Deposit amount in dollars", constraints: "> 0" }
      - { name: status, type: enum, source: system, description: "CLEARED | MISSED | RETURNED", constraints: "CLEARED|MISSED|RETURNED" }

  - name: SettlementOffer
    parent: Program
    common_fields: true
    fields:
      - { name: program_id, type: string, source: input, description: "FK -> Program.id; the program this offer belongs to" }
      - { name: debt_id, type: string, source: input, description: "FK -> Debt.id; the debt the creditor is offering to settle" }
      - { name: offer_pct, type: number, source: input, description: "Creditor's offered fraction of current_balance to accept as full settlement", constraints: "0 < value <= 1" }
      - { name: settlement_amount, type: number, source: computed, description: "round_half_up(Debt.current_balance * offer_pct, 2) — the principal that would be paid" }
      - { name: projected_fee, type: number, source: computed, description: "round_half_up(settlement_amount * effective_fee_rate, 2); effective_fee_rate = Debt.fee_rate_pct plus a +0.03 litigation surcharge capped at 0.25 when the debt is in LAWSUIT" }
      - { name: due_date, type: datetime, source: input, description: "ISO8601 deadline by which the settlement must be funded" }
      - { name: status, type: enum, source: system, description: "PENDING | ACCEPTED | REJECTED | EXPIRED", constraints: "PENDING|ACCEPTED|REJECTED|EXPIRED" }

  - name: Settlement
    parent: Program
    common_fields: true
    fields:
      - { name: program_id, type: string, source: input, description: "FK -> Program.id; the program funding this settlement" }
      - { name: offer_id, type: string, source: input, description: "FK -> SettlementOffer.id; the accepted offer being funded" }
      - { name: debt_id, type: string, source: system, description: "FK -> Debt.id; copied from the offer" }
      - { name: funded_amount, type: number, source: computed, description: "Principal debited from the dedicated account = SettlementOffer.settlement_amount at funding time" }
      - { name: forgiven_amount, type: number, source: computed, description: "Debt.original_balance - funded_amount; the cancellation-of-debt amount" }
      - { name: status, type: enum, source: system, description: "FUNDED | COMPLETED | VOIDED", constraints: "FUNDED|COMPLETED|VOIDED" }

  - name: SettlementFee
    parent: Program
    common_fields: true
    fields:
      - { name: program_id, type: string, source: system, description: "FK -> Program.id; the program owing this fee" }
      - { name: settlement_id, type: string, source: system, description: "FK -> Settlement.id; the settlement this fee was accrued against" }
      - { name: amount, type: number, source: computed, description: "round_half_up(Settlement.funded_amount * effective_fee_rate, 2); effective_fee_rate per SettlementOffer.projected_fee rule" }
      - { name: status, type: enum, source: system, description: "OUTSTANDING | PAID | WAIVED", constraints: "OUTSTANDING|PAID|WAIVED" }

  - name: Lawsuit
    parent: Program
    common_fields: true
    fields:
      - { name: program_id, type: string, source: input, description: "FK -> Program.id; the program whose debt is litigated" }
      - { name: debt_id, type: string, source: input, description: "FK -> Debt.id; the debt referred to litigation" }
      - { name: court_reference, type: string, source: input, description: "Court case reference" }
      - { name: filed_at, type: datetime, source: input, description: "ISO8601 instant the suit was filed" }
      - { name: status, type: enum, source: system, description: "REFERRED | RESOLVED_SETTLED | RESOLVED_DISMISSED", constraints: "REFERRED|RESOLVED_SETTLED|RESOLVED_DISMISSED" }

  - name: TaxEvent
    parent: Program
    common_fields: true
    fields:
      - { name: program_id, type: string, source: system, description: "FK -> Program.id; the program the 1099-C belongs to" }
      - { name: source_settlement_id, type: string, source: system, description: "FK -> Settlement.id; the settlement that generated this cancellation-of-debt record" }
      - { name: forgiven_amount, type: number, source: computed, description: "Cancellation-of-debt amount copied from Settlement.forgiven_amount" }
      - { name: tax_year, type: integer, source: computed, description: "Calendar year (UTC) of the settlement completion that produced this event" }
      - { name: reportable, type: boolean, source: computed, description: "True when forgiven_amount >= 600 (IRS 1099-C reporting threshold), else false" }
      - { name: status, type: enum, source: system, description: "ISSUED | VOIDED", constraints: "ISSUED|VOIDED" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  # ---- Program dimension 1: program_phase ----
  - entity: Program
    field: program_phase
    initial_state: ENROLLING
    terminal_states: [COMPLETED, TERMINATED]
    transitions:
      - from: ENROLLING
        to: ACTIVE
        trigger: "POST /programs/{id}/activate"
        actor: ProgramAdmin
        preconditions:
          - "Program has at least one Debt in status ENROLLED (ERR_NO_ENROLLED_DEBTS)"
          - "program_phase == ENROLLING (ERR_INVALID_STATE)"
        side_effects:
          - "program_phase -> ACTIVE; deposits and offers may now be processed"
          - "increments Program.version by 1"
      - from: ACTIVE
        to: COMPLETED
        trigger: "POST /programs/{id}/complete"
        actor: ProgramAdmin
        preconditions:
          - "completion_eligible == true: every Debt is SETTLED or WITHDRAWN AND no SettlementFee is OUTSTANDING (ERR_COMPLETION_NOT_ELIGIBLE)"
          - "account_standing != DEFAULTED (ERR_ACCOUNT_DEFAULTED)"
        side_effects:
          - "program_phase -> COMPLETED"
          - "Any residual DedicatedAccount.balance is refunded: Client.refunded_to_client_cents += round_half_up(balance*100); balance -> 0"
          - "increments Program.version by 1"
      - from: ACTIVE
        to: TERMINATED
        trigger: "POST /programs/{id}/drop"
        actor: Client
        preconditions:
          - "program_phase == ACTIVE (ERR_INVALID_STATE)"
        side_effects:
          - "CASCADE: every Debt in {ENROLLED, IN_NEGOTIATION, LAWSUIT} -> WITHDRAWN (terminal)"
          - "CASCADE: each WITHDRAWN debt's open SettlementOffers (PENDING) -> EXPIRED"
          - "CASCADE: residual DedicatedAccount.balance refunded: Client.refunded_to_client_cents += round_half_up(balance*100); balance -> 0"
          - "program_phase -> TERMINATED"
          - "increments Program.version by 1"
        note: "A new program may be created for the same Client afterward (re-enroll); fee_rate snapshots are recomputed from the new program's total_enrolled_balance."
      - from: ENROLLING
        to: TERMINATED
        trigger: "POST /programs/{id}/drop"
        actor: Client
        preconditions:
          - "program_phase == ENROLLING (ERR_INVALID_STATE)"
        side_effects:
          - "CASCADE: every Debt in {ENROLLED, IN_NEGOTIATION, LAWSUIT} -> WITHDRAWN"
          - "CASCADE: residual DedicatedAccount.balance refunded as above"
          - "program_phase -> TERMINATED"
          - "increments Program.version by 1"

  # ---- Program dimension 2: account_standing (independent, parallel) ----
  - entity: Program
    field: account_standing
    initial_state: CURRENT
    terminal_states: []
    transitions:
      - from: CURRENT
        to: DELINQUENT
        trigger: "system (automatic when missed_deposit_count becomes >= 1 and < 3)"
        actor: system
        preconditions:
          - "1 <= missed_deposit_count < 3"
        side_effects:
          - "No new SettlementOffer may be ACCEPTED while DELINQUENT (offers may still be recorded)"
      - from: DELINQUENT
        to: DEFAULTED
        trigger: "system (automatic when missed_deposit_count becomes >= 3)"
        actor: system
        preconditions:
          - "missed_deposit_count >= 3"
        side_effects:
          - "All offer acceptance, settlement funding, and completion are blocked until cured"
      - from: DELINQUENT
        to: CURRENT
        trigger: "system (automatic when a previously MISSED deposit is cured via POST /deposits/{id}/cure dropping missed_deposit_count below 1)"
        actor: system
        preconditions:
          - "missed_deposit_count == 0"
        side_effects: []
      - from: DEFAULTED
        to: DELINQUENT
        trigger: "system (automatic when a cure drops missed_deposit_count to 1 or 2)"
        actor: system
        preconditions:
          - "1 <= missed_deposit_count < 3"
        side_effects: []
      - from: DEFAULTED
        to: CURRENT
        trigger: "system (automatic when cures drop missed_deposit_count to 0)"
        actor: system
        preconditions:
          - "missed_deposit_count == 0"
        side_effects: []

  # ---- Debt: cyclic + branching ----
  - entity: Debt
    field: status
    initial_state: ENROLLED
    terminal_states: [SETTLED, WITHDRAWN]
    transitions:
      - from: ENROLLED
        to: IN_NEGOTIATION
        trigger: "POST /offers (first PENDING offer recorded for the debt)"
        actor: NegotiationAgent
        preconditions:
          - "Debt.status == ENROLLED (ERR_INVALID_STATE)"
          - "Program.program_phase == ACTIVE (ERR_INVALID_STATE)"
        side_effects:
          - "Debt.status -> IN_NEGOTIATION"
      - from: IN_NEGOTIATION
        to: SETTLED
        trigger: "POST /settlements/{id}/complete"
        actor: NegotiationAgent
        preconditions:
          - "A Settlement in status FUNDED references an ACCEPTED offer on this debt (ERR_INVALID_STATE)"
        side_effects:
          - "Debt.settled_amount = Settlement.funded_amount; Debt.forgiven_amount = original_balance - funded_amount; Debt.current_balance -> 0; settled_offer_id set"
          - "CASCADE: Settlement -> COMPLETED; SettlementFee accrues (status OUTSTANDING) at effective_fee_rate; that fee accrual debits the DedicatedAccount on fee PAID"
          - "CASCADE: if forgiven_amount >= 600, a TaxEvent (1099-C) is ISSUED with reportable=true; if 0 < forgiven_amount < 600, a TaxEvent is ISSUED with reportable=false"
          - "CASCADE: if the debt had an open Lawsuit (REFERRED), Lawsuit -> RESOLVED_SETTLED"
      - from: LAWSUIT
        to: SETTLED
        trigger: "POST /settlements/{id}/complete"
        actor: NegotiationAgent
        preconditions:
          - "A Settlement in status FUNDED references an ACCEPTED offer on this litigated debt (ERR_INVALID_STATE)"
        side_effects:
          - "Same settlement cascade as IN_NEGOTIATION -> SETTLED, but effective_fee_rate carried the +0.03 litigation surcharge (capped 0.25)"
          - "CASCADE: Lawsuit -> RESOLVED_SETTLED"
      - from: IN_NEGOTIATION
        to: LAWSUIT
        trigger: "POST /lawsuits"
        actor: ProgramAdmin
        preconditions:
          - "Debt.status == IN_NEGOTIATION or ENROLLED (ERR_INVALID_STATE)"
        side_effects:
          - "Debt.status -> LAWSUIT; subsequent offers on this debt accrue the litigation fee surcharge"
      - from: ENROLLED
        to: LAWSUIT
        trigger: "POST /lawsuits"
        actor: ProgramAdmin
        preconditions:
          - "Debt.status == ENROLLED (ERR_INVALID_STATE)"
        side_effects:
          - "Debt.status -> LAWSUIT"
      - from: ENROLLED
        to: WITHDRAWN
        trigger: "system (CASCADE from Program drop)"
        actor: system
        preconditions: []
        side_effects:
          - "Debt.status -> WITHDRAWN; any PENDING offers -> EXPIRED"
      - from: IN_NEGOTIATION
        to: WITHDRAWN
        trigger: "system (CASCADE from Program drop)"
        actor: system
        preconditions: []
        side_effects:
          - "Debt.status -> WITHDRAWN; any PENDING offers -> EXPIRED"
      - from: LAWSUIT
        to: WITHDRAWN
        trigger: "system (CASCADE from Program drop)"
        actor: system
        preconditions: []
        side_effects:
          - "Debt.status -> WITHDRAWN; open Lawsuit -> RESOLVED_DISMISSED; PENDING offers -> EXPIRED"

  # ---- SettlementOffer: branching fork (ACCEPTED / REJECTED / EXPIRED) ----
  - entity: SettlementOffer
    field: status
    initial_state: PENDING
    terminal_states: [ACCEPTED, REJECTED, EXPIRED]
    transitions:
      - from: PENDING
        to: ACCEPTED
        trigger: "POST /offers/{id}/accept"
        actor: NegotiationAgent
        preconditions:
          - "SettlementOffer.status == PENDING (ERR_INVALID_STATE)"
          - "Program.account_standing != DEFAULTED (ERR_ACCOUNT_DEFAULTED)"
          - "Program.account_standing != DELINQUENT (ERR_ACCOUNT_DELINQUENT)"
          - "Debt has no other ACCEPTED offer (ERR_OFFER_ALREADY_ACCEPTED)"
          - "Forward-looking reserve check: DedicatedAccount.balance + scheduled_future_deposits_before_due_date >= settlement_amount + projected_fee + reserve_floor (ERR_PROJECTED_RESERVE_SHORTFALL)"
          - "Client-supplied expected_program_version matches Program.version (ERR_STALE_VERSION)"
        side_effects:
          - "SettlementOffer.status -> ACCEPTED; any sibling PENDING offers on the same debt -> REJECTED"
          - "increments Program.version by 1"
      - from: PENDING
        to: REJECTED
        trigger: "POST /offers/{id}/reject"
        actor: NegotiationAgent
        preconditions:
          - "SettlementOffer.status == PENDING (ERR_INVALID_STATE)"
        side_effects:
          - "SettlementOffer.status -> REJECTED"
      - from: PENDING
        to: EXPIRED
        trigger: "system (automatic when current clock time > due_date, observed on read or on POST /offers/{id}/accept) OR CASCADE from debt withdrawal"
        actor: system
        preconditions:
          - "current_utc > due_date OR parent debt moved to WITHDRAWN"
        side_effects:
          - "SettlementOffer.status -> EXPIRED; acceptance attempts after expiry fail with ERR_OFFER_EXPIRED"

  # ---- Settlement: forward + compensation (void) ----
  - entity: Settlement
    field: status
    initial_state: FUNDED
    terminal_states: [COMPLETED, VOIDED]
    transitions:
      - from: FUNDED
        to: COMPLETED
        trigger: "POST /settlements/{id}/complete"
        actor: NegotiationAgent
        preconditions:
          - "Settlement.status == FUNDED (ERR_INVALID_STATE)"
          - "Program.account_standing != DEFAULTED (ERR_ACCOUNT_DEFAULTED)"
        side_effects:
          - "Settlement.status -> COMPLETED"
          - "CASCADE: parent Debt -> SETTLED (with all SETTLED side effects above)"
          - "CASCADE: SettlementFee.status OUTSTANDING -> PAID (debits DedicatedAccount.balance by fee amount)"
          - "CASCADE: TaxEvent issued per forgiven_amount threshold"
      - from: FUNDED
        to: VOIDED
        trigger: "POST /settlements/{id}/void"
        actor: ProgramAdmin
        preconditions:
          - "Settlement.status == FUNDED (ERR_INVALID_STATE)"
        side_effects:
          - "COMPENSATION: funded_amount credited back to DedicatedAccount.balance; the linked SettlementFee (still OUTSTANDING) -> WAIVED so no fee debit occurs"
          - "COMPENSATION: parent Debt reverts to IN_NEGOTIATION (current_balance restored to original_balance; settled_amount/forgiven_amount reset to 0; settled_offer_id cleared)"
          - "COMPENSATION: the source SettlementOffer reverts ACCEPTED -> PENDING (re-openable)"
          - "COMPENSATION: any ISSUED TaxEvent for this settlement -> VOIDED"
          - "Invariant: DedicatedAccount.balance returns to its pre-funding value (account-conservation)"

  # ---- Lawsuit: linear with two terminal resolutions ----
  - entity: Lawsuit
    field: status
    initial_state: REFERRED
    terminal_states: [RESOLVED_SETTLED, RESOLVED_DISMISSED]
    transitions:
      - from: REFERRED
        to: RESOLVED_SETTLED
        trigger: "system (CASCADE when the litigated Debt becomes SETTLED)"
        actor: system
        preconditions:
          - "Linked Debt.status -> SETTLED"
        side_effects: []
      - from: REFERRED
        to: RESOLVED_DISMISSED
        trigger: "POST /lawsuits/{id}/dismiss"
        actor: ProgramAdmin
        preconditions:
          - "Lawsuit.status == REFERRED (ERR_INVALID_STATE)"
        side_effects:
          - "CASCADE: linked Debt reverts LAWSUIT -> IN_NEGOTIATION (if it had a prior offer) else -> ENROLLED"

  # ---- TaxEvent: append-only with void ----
  - entity: TaxEvent
    field: status
    initial_state: ISSUED
    terminal_states: [VOIDED]
    transitions:
      - from: ISSUED
        to: VOIDED
        trigger: "system (CASCADE when the source Settlement is VOIDED)"
        actor: system
        preconditions:
          - "Source Settlement.status -> VOIDED"
        side_effects:
          - "TaxEvent.status -> VOIDED; forgiven_amount no longer reportable"

# =============================================================================
# §1.2.1 Concurrency Rules
# =============================================================================
concurrency_rules:
  - rule_id: offer-accept-stale-program
    parent_entity: Program
    write_endpoint: "POST /offers/{id}/accept"
    occ_field: "expected_program_version"
    description: |
      Accepting a SettlementOffer against a Program whose version has advanced
      since the client last observed it is rejected. A prior acceptance on a
      sibling offer (which legitimately supersedes other PENDING offers on the
      same debt and bumps Program.version) makes the current acceptor's view of
      the program stale; the OCC check on Program.version rejects the stale
      acceptance rather than double-committing the dedicated account.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: settlement_offer_quote
    trigger: "SettlementOffer creation (POST /offers)"
    algorithm: tiered_pricing
    formula: |
      # Step 1 — principal the creditor will accept
      settlement_amount = round_half_up(Debt.current_balance * offer_pct, 2)
      # Step 2 — effective fee rate (tier snapshot + conditional litigation surcharge)
      base_rate = Debt.fee_rate_pct                       # snapshotted at enrollment
      if Debt.status == LAWSUIT:
          effective_rate = min(base_rate + LITIGATION_SURCHARGE, SURCHARGE_CAP)
      else:
          effective_rate = base_rate
      # Step 3 — projected fee, computed on the settlement principal (NOT original balance)
      projected_fee = round_half_up(settlement_amount * effective_rate, 2)
    input_set: "Single Debt referenced by the offer; current_balance equals original_balance pre-settlement."
    constants:
      LITIGATION_SURCHARGE: 0.03
      SURCHARGE_CAP: 0.25
    precision: "2 decimal places, round_half_up; rounding applied per-step (round settlement_amount first, THEN round fee on the rounded principal)"
    variants:
      - name: standard
        when: "Debt.status in {ENROLLED, IN_NEGOTIATION}"
        difference: "effective_rate = base_rate (no surcharge)"
      - name: litigated
        when: "Debt.status == LAWSUIT"
        difference: "effective_rate = min(base_rate + 0.03, 0.25)"

  - name: fee_tier_snapshot
    trigger: "Debt enrollment (POST /debts) — snapshots Debt.fee_rate_pct"
    algorithm: threshold
    formula: |
      # total_enrolled_balance computed BEFORE adding the new debt's balance,
      # then the new debt's original_balance is added, then the band is selected
      # from the resulting total. The selected band is frozen onto the new Debt.
      total = sum(d.original_balance for d in Program.debts
                  if d.status in {ENROLLED, IN_NEGOTIATION, SETTLED, LAWSUIT})
              + new_debt.original_balance
      if total < TIER_1_CEIL:        fee_rate_pct = 0.25
      elif total < TIER_2_CEIL:      fee_rate_pct = 0.22
      else:                          fee_rate_pct = 0.18
    input_set: "Debts in {ENROLLED, IN_NEGOTIATION, SETTLED, LAWSUIT}; WITHDRAWN debts excluded."
    constants:
      TIER_1_CEIL: 10000      # total < 10000 -> 0.25
      TIER_2_CEIL: 30000      # 10000 <= total < 30000 -> 0.22 ; >= 30000 -> 0.18
    precision: "rate is exact (0.25 / 0.22 / 0.18); comparisons use >= for tier ceilings"

  - name: portfolio_savings
    trigger: "any Debt/Settlement mutation; recomputed on read of Program"
    algorithm: forward_looking
    formula: |
      # ESTIMATE variant (forward-looking, dual-variant subject = Program-level projection)
      estimated_total_savings = 0
      for d in Program.debts where d.status in {ENROLLED, IN_NEGOTIATION, LAWSUIT}:
          est_settlement = round_half_up(d.original_balance * Program.target_settlement_pct, 2)
          est_rate = (min(d.fee_rate_pct + 0.03, 0.25) if d.status == LAWSUIT else d.fee_rate_pct)
          est_fee = round_half_up(est_settlement * est_rate, 2)
          estimated_total_savings += (d.original_balance - est_settlement - est_fee)
      # ACTUAL variant (chronological realized — only SETTLED debts)
      realized_total_savings = 0
      for d in Program.debts where d.status == SETTLED:
          fee = SettlementFee.amount for d's settlement      # PAID or WAIVED amount as accrued
          realized_total_savings += (d.original_balance - d.settled_amount - fee)
    input_set: "ESTIMATE includes open debts only {ENROLLED, IN_NEGOTIATION, LAWSUIT}; ACTUAL includes SETTLED only. WITHDRAWN excluded from both."
    constants:
      DEFAULT_TARGET_PCT: 0.50
    precision: "2 decimal places, round_half_up; per-debt rounding then sum"
    variants:
      - name: estimated
        when: "projection over still-open debts using Program.target_settlement_pct"
        difference: "assumes every open debt settles at target_settlement_pct; ignores realized settlements"
      - name: realized
        when: "tally over SETTLED debts using actual settled_amount and accrued fee"
        difference: "counts only realized outcomes; a WAIVED fee (voided settlement path) contributes 0 to fee so the debt is not double-counted"

  - name: account_reserve_state
    trigger: "POST deposit / cure / settlement funding / offer acceptance reserve check"
    algorithm: aggregation
    formula: |
      # instantaneous balance (used by funding check)
      balance = sum(dep.amount for dep in deposits if dep.status == CLEARED)
                - sum(s.funded_amount for s in settlements if s.status in {FUNDED, COMPLETED})
                - sum(f.amount for f in fees if f.status == PAID)
      # forward-looking projected balance at an offer's due_date (used by acceptance check)
      projected_balance(due_date) = balance
                + sum(monthly_deposit_amount for each scheduled deposit day d
                      where current_utc < d <= due_date)
    input_set: "CLEARED deposits, FUNDED/COMPLETED settlements, PAID fees; projection adds scheduled deposits strictly between now and due_date inclusive of due_date."
    constants: {}
    precision: "2 decimal places, round_half_up"

  - name: interval_overlap_detection
    trigger: "POST /offers (offer due-date buffer) and POST /deposits (deposit month bucket)"
    algorithm: interval_merge
    formula: |
      # Offer due-date adjacency — PAIRWISE CLOSED buffer intervals.
      # Each PENDING offer e on the same debt owns a closed buffer
      #   [e.due_date - MIN_OFFER_GAP_DAYS, e.due_date + MIN_OFFER_GAP_DAYS].
      # The new offer collides iff |new.due_date - e.due_date| <= MIN_OFFER_GAP_DAYS
      # (closed: exactly 30 days apart => buffers touch => overlap => ERR_OFFER_WINDOW_OVERLAP).
      #
      # Deposit month-bucket occupancy — AGGREGATE over a HALF-OPEN month interval.
      # bucket(scheduled_for) = [first instant of its UTC month, first instant of next UTC month).
      # A CLEARED deposit whose scheduled_for shares a bucket with an existing CLEARED
      # deposit collides => ERR_DEPOSIT_MONTH_OCCUPIED. A scheduled_for exactly equal to
      # the next month's first instant belongs to the NEXT bucket (upper bound exclusive).
    input_set: "Offer check: PENDING offers on the same debt. Deposit check: CLEARED deposits on the same program."
    constants:
      MIN_OFFER_GAP_DAYS: 30
    precision: "instant comparisons at millisecond resolution; closed for offer due-date buffers, half-open (lower-closed/upper-open) for deposit buckets"

  - name: cancellation_of_debt_1099c
    trigger: "Debt SETTLED cascade (settlement completion)"
    algorithm: threshold
    formula: |
      forgiven_amount = Debt.original_balance - Settlement.funded_amount
      reportable = (forgiven_amount >= REPORTABLE_FLOOR)
      tax_year = year(current_utc at completion)
      # A TaxEvent row is ALWAYS issued when forgiven_amount > 0; reportable flag
      # distinguishes IRS-reportable (>= 600) from non-reportable (< 600).
    input_set: "Single settled Debt and its Settlement."
    constants:
      REPORTABLE_FLOOR: 600     # forgiven >= 600 is reportable on a 1099-C
    precision: "whole-dollar comparison; forgiven_amount carries 2 decimals"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present and X-User-Role is a known role"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all

  - priority: 2
    category: auth
    check: "Acting role is permitted to perform this operation per §1.7"
    error_id: ERR_FORBIDDEN
    http_status: 403
    applies_to: all

  - priority: 3
    category: existence
    check: "Referenced Program / Debt / Offer / Settlement / Lawsuit / Deposit exists (validated left-to-right; path id then body FKs)"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all resource endpoints"

  - priority: 4
    category: business_referential
    check: "Acting Client (entity-backed) must own the Program for Client-exclusive operations (deposit, drop)"
    error_id: ERR_NOT_PROGRAM_OWNER
    http_status: 403
    applies_to: "POST /deposits, POST /programs/{id}/drop"

  - priority: 5
    category: business_constraint
    check: "Request body well-formed; required fields present; enums valid; numeric ranges respected (offer_pct in (0,1], amounts > 0)"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: all

  - priority: 6
    category: state
    check: "Target resource is in a state from which the requested transition is defined in §1.2"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all transition endpoints"

  - priority: 7
    category: state
    check: "Program must have at least one ENROLLED debt before activation"
    error_id: ERR_NO_ENROLLED_DEBTS
    http_status: 409
    applies_to: "POST /programs/{id}/activate"

  - priority: 8
    category: business_referential
    check: "A new Debt's account_number is unique within its Program; an offer's debt_id belongs to the same program_id"
    error_id: ERR_DUPLICATE_ACCOUNT_NUMBER
    http_status: 409
    applies_to: "POST /debts"

  - priority: 9
    category: business_temporal
    check: "An offer whose due_date is at or before current_utc cannot be created or accepted (it is already expired)"
    error_id: ERR_OFFER_EXPIRED
    http_status: 409
    applies_to: "POST /offers, POST /offers/{id}/accept"

  - priority: 9.5
    category: business_temporal
    check: "Offer due-date adjacency (PAIRWISE CLOSED-interval semantics): a new PENDING offer on a debt whose due_date falls within MIN_OFFER_GAP_DAYS (30) of an existing PENDING offer's due_date on the SAME debt is rejected. Treat each due_date as the center of a closed [due_date - 30d, due_date + 30d] buffer interval; two buffers that share any instant (adjacency at exactly 30 days collides) overlap."
    error_id: ERR_OFFER_WINDOW_OVERLAP
    http_status: 409
    applies_to: "POST /offers"

  - priority: 9.6
    category: business_temporal
    check: "Deposit billing-month overlap (AGGREGATE-CAPACITY over a HALF-OPEN month bucket [month_start, next_month_start)): at most one CLEARED MonthlyDeposit may occupy a given UTC calendar-month bucket for a program. A second CLEARED deposit whose scheduled_for falls in a month bucket already occupied by a CLEARED deposit is rejected; a deposit landing exactly on the next month's first instant belongs to the NEXT bucket (half-open upper boundary)."
    error_id: ERR_DEPOSIT_MONTH_OCCUPIED
    http_status: 409
    applies_to: "POST /deposits"

  - priority: 10
    category: business_safety
    check: "Program.account_standing must not be DEFAULTED for offer acceptance, settlement funding, or completion"
    error_id: ERR_ACCOUNT_DEFAULTED
    http_status: 409
    applies_to: "POST /offers/{id}/accept, POST /settlements, POST /settlements/{id}/complete, POST /programs/{id}/complete"

  - priority: 11
    category: business_safety
    check: "Program.account_standing must not be DELINQUENT for offer acceptance"
    error_id: ERR_ACCOUNT_DELINQUENT
    http_status: 409
    applies_to: "POST /offers/{id}/accept"

  - priority: 12
    category: business_constraint
    check: "Only one ACCEPTED offer may exist per Debt at a time; accepting a second offer on a debt with an ACCEPTED offer is rejected"
    error_id: ERR_OFFER_ALREADY_ACCEPTED
    http_status: 409
    applies_to: "POST /offers/{id}/accept"

  - priority: 13
    category: business_fiscal
    check: "Forward-looking reserve check at acceptance: projected_balance(due_date) >= settlement_amount + projected_fee + reserve_floor"
    error_id: ERR_PROJECTED_RESERVE_SHORTFALL
    http_status: 402
    applies_to: "POST /offers/{id}/accept"

  - priority: 14
    category: business_fiscal
    check: "Instantaneous funding check: DedicatedAccount.balance >= settlement_amount + projected_fee + reserve_floor at funding time"
    error_id: ERR_INSUFFICIENT_RESERVE
    http_status: 402
    applies_to: "POST /settlements"

  - priority: 15
    category: business_constraint
    check: "A Settlement may only be funded from an ACCEPTED offer that has not already produced a non-VOIDED settlement"
    error_id: ERR_OFFER_NOT_ACCEPTED
    http_status: 409
    applies_to: "POST /settlements"

  - priority: 16
    category: business_constraint
    check: "OCC: expected_program_version must equal Program.version"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /offers/{id}/accept"

  - priority: 17
    category: business_constraint
    check: "Program completion requires every Debt terminal and no OUTSTANDING fees"
    error_id: ERR_COMPLETION_NOT_ELIGIBLE
    http_status: 409
    applies_to: "POST /programs/{id}/complete"

# =============================================================================
# §1.5 API Endpoint Table (flat topology)
# =============================================================================
endpoints:
  # ---- Test-driving clock ----
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the server logical clock. Server startup default is 2026-01-01T00:00:00Z; before any call the clock reads exactly this default and never falls back to wall-clock time."
    roles: [ProgramAdmin]
    code: 200
    input: [to_iso8601]
    output: null
    side_effects: ["Logical clock advances; offer expiry and projected-deposit windows are evaluated against it"]

  # ---- Client ----
  - method: POST
    path: "/clients"
    description: "Create a Client (debtor)"
    roles: [ProgramAdmin]
    code: 201
    input: [full_name, email, state_code]
    output: Client
    side_effects: ["refunded_to_client_cents initialized to 0"]

  - method: GET
    path: "/clients/{id}"
    description: "Get a Client"
    roles: [ProgramAdmin, Client]
    code: 200
    input: []
    output: Client
    side_effects: []

  # ---- Program ----
  - method: POST
    path: "/programs"
    description: "Enroll a new Program for a Client; auto-creates the DedicatedAccount"
    roles: [ProgramAdmin]
    code: 201
    input: [client_id, monthly_deposit_amount, "deposit_day_of_month?", "target_settlement_pct?", "reserve_floor?"]
    output: Program
    side_effects:
      - "program_phase=ENROLLING; account_standing=CURRENT; computed aggregates initialized to 0"
      - "Creates DedicatedAccount with balance=0 and the supplied reserve_floor"

  - method: GET
    path: "/programs/{id}"
    description: "Get a Program with all computed aggregates (estimated/realized savings, standing, completion_eligible)"
    roles: [ProgramAdmin, NegotiationAgent, Client]
    code: 200
    input: []
    output: Program
    side_effects: ["Lazily expires any PENDING offers past due_date before computing aggregates"]

  - method: GET
    path: "/programs"
    description: "List programs (reverse-reachability for Program.client_id), optionally filtered by client_id"
    roles: [ProgramAdmin, NegotiationAgent]
    code: 200
    input: ["client_id?", "limit?", "offset?"]
    output: Program[]
    side_effects: []

  - method: POST
    path: "/programs/{id}/activate"
    description: "Activate an enrolling program"
    roles: [ProgramAdmin]
    code: 200
    input: []
    output: Program
    side_effects: ["program_phase ENROLLING -> ACTIVE", "increments Program.version by 1"]

  - method: POST
    path: "/programs/{id}/complete"
    description: "Complete a program once all debts are terminal and no fees outstanding"
    roles: [ProgramAdmin]
    code: 200
    input: []
    output: Program
    side_effects:
      - "program_phase ACTIVE -> COMPLETED"
      - "Residual account balance refunded to Client.refunded_to_client_cents; balance -> 0"
      - "increments Program.version by 1"

  - method: POST
    path: "/programs/{id}/drop"
    description: "Client drops the program (drop/re-enroll lifecycle)"
    roles: [Client]
    code: 200
    input: []
    output: Program
    side_effects:
      - "program_phase -> TERMINATED"
      - "CASCADE: open debts -> WITHDRAWN; PENDING offers -> EXPIRED; open lawsuits -> RESOLVED_DISMISSED"
      - "CASCADE: residual account balance refunded to Client"
      - "increments Program.version by 1"

  # ---- DedicatedAccount ----
  - method: GET
    path: "/accounts/{id}"
    description: "Get a DedicatedAccount by id"
    roles: [ProgramAdmin, NegotiationAgent, Client]
    code: 200
    input: []
    output: DedicatedAccount
    side_effects: []

  - method: GET
    path: "/accounts"
    description: "List dedicated accounts (reverse-reachability for DedicatedAccount.program_id), filtered by program_id (1:1; array length 1)"
    roles: [ProgramAdmin, NegotiationAgent, Client]
    code: 200
    input: ["program_id?", "limit?", "offset?"]
    output: DedicatedAccount[]
    side_effects: []

  # ---- Debt ----
  - method: POST
    path: "/debts"
    description: "Enroll a Debt; snapshots fee_rate_pct from the resulting fee tier"
    roles: [ProgramAdmin]
    code: 201
    input: [program_id, creditor_name, account_number, original_balance]
    output: Debt
    side_effects:
      - "status=ENROLLED; fee_rate_pct snapshotted via fee_tier_snapshot"
      - "Program.total_enrolled_balance and fee_tier_pct recomputed"

  - method: GET
    path: "/debts/{id}"
    description: "Get a single Debt"
    roles: [ProgramAdmin, NegotiationAgent, Client]
    code: 200
    input: []
    output: Debt
    side_effects: []

  - method: GET
    path: "/debts"
    description: "List debts (reverse-reachability for Debt.program_id and Debt.settled_offer_id), filtered by program_id, settled_offer_id, or status"
    roles: [ProgramAdmin, NegotiationAgent, Client]
    code: 200
    input: ["program_id?", "settled_offer_id?", "status?", "limit?", "offset?"]
    output: Debt[]
    side_effects: []

  # ---- Deposit ----
  - method: POST
    path: "/deposits"
    description: "Record a monthly deposit into the dedicated account"
    roles: [Client, ProgramAdmin]
    code: 201
    input: [program_id, scheduled_for, amount, "status?"]
    output: MonthlyDeposit
    side_effects:
      - "status defaults to CLEARED; if status=MISSED, Program.missed_deposit_count increments and account_standing recomputed"
      - "DedicatedAccount.balance recomputed for CLEARED deposits"
      - "Rejected with ERR_DEPOSIT_MONTH_OCCUPIED if a CLEARED deposit already occupies the scheduled_for UTC month bucket"

  - method: GET
    path: "/deposits/{id}"
    description: "Get a single deposit"
    roles: [ProgramAdmin, NegotiationAgent, Client]
    code: 200
    input: []
    output: MonthlyDeposit
    side_effects: []

  - method: GET
    path: "/deposits"
    description: "List deposits (reverse-reachability for MonthlyDeposit.program_id), filtered by program_id or status"
    roles: [ProgramAdmin, NegotiationAgent, Client]
    code: 200
    input: ["program_id?", "status?", "limit?", "offset?"]
    output: MonthlyDeposit[]
    side_effects: []

  - method: POST
    path: "/deposits/{id}/cure"
    description: "Cure a MISSED deposit (catch-up payment), decrementing missed_deposit_count"
    roles: [Client, ProgramAdmin]
    code: 200
    input: []
    output: MonthlyDeposit
    side_effects:
      - "MonthlyDeposit.status MISSED -> CLEARED; Program.missed_deposit_count decrements; account_standing recomputed (may move DEFAULTED -> DELINQUENT -> CURRENT)"
      - "DedicatedAccount.balance increases by the cured amount"

  # ---- Offer ----
  - method: POST
    path: "/offers"
    description: "Record a creditor settlement offer (% of balance) for a debt; computes settlement_amount and projected_fee"
    roles: [NegotiationAgent]
    code: 201
    input: [program_id, debt_id, offer_pct, due_date]
    output: SettlementOffer
    side_effects:
      - "status=PENDING; settlement_amount and projected_fee computed via settlement_offer_quote"
      - "If parent Debt was ENROLLED, Debt.status -> IN_NEGOTIATION"
      - "Rejected with ERR_OFFER_WINDOW_OVERLAP if the new due_date is within 30 days of an existing PENDING offer's due_date on the same debt"

  - method: GET
    path: "/offers/{id}"
    description: "Get a single offer"
    roles: [ProgramAdmin, NegotiationAgent, Client]
    code: 200
    input: []
    output: SettlementOffer
    side_effects: ["Lazily expires the offer if past due_date"]

  - method: GET
    path: "/offers"
    description: "List offers (reverse-reachability for SettlementOffer.program_id and SettlementOffer.debt_id), filtered by program_id, debt_id, or status"
    roles: [ProgramAdmin, NegotiationAgent, Client]
    code: 200
    input: ["program_id?", "debt_id?", "status?", "limit?", "offset?"]
    output: SettlementOffer[]
    side_effects: ["Lazily expires PENDING offers past due_date"]

  - method: POST
    path: "/offers/{id}/accept"
    description: "Accept a PENDING offer (OCC-guarded on Program.version; forward-looking reserve check)"
    roles: [NegotiationAgent]
    code: 200
    input: [expected_program_version]
    output: SettlementOffer
    side_effects:
      - "status PENDING -> ACCEPTED; sibling PENDING offers on the same debt -> REJECTED"
      - "increments Program.version by 1"

  - method: POST
    path: "/offers/{id}/reject"
    description: "Reject a PENDING offer"
    roles: [NegotiationAgent]
    code: 200
    input: []
    output: SettlementOffer
    side_effects: ["status PENDING -> REJECTED"]

  # ---- Settlement ----
  - method: POST
    path: "/settlements"
    description: "Fund a settlement from an ACCEPTED offer; debits the dedicated account principal, accrues an OUTSTANDING fee"
    roles: [NegotiationAgent]
    code: 201
    input: [program_id, offer_id]
    output: Settlement
    side_effects:
      - "status=FUNDED; funded_amount = offer.settlement_amount debited from DedicatedAccount.balance"
      - "Creates SettlementFee (status OUTSTANDING) at effective_fee_rate"
      - "forgiven_amount = Debt.original_balance - funded_amount"

  - method: GET
    path: "/settlements/{id}"
    description: "Get a single settlement"
    roles: [ProgramAdmin, NegotiationAgent, Client]
    code: 200
    input: []
    output: Settlement
    side_effects: []

  - method: GET
    path: "/settlements"
    description: "List settlements (reverse-reachability for Settlement.program_id, Settlement.offer_id and Settlement.debt_id), filtered by program_id, offer_id, debt_id, or status"
    roles: [ProgramAdmin, NegotiationAgent, Client]
    code: 200
    input: ["program_id?", "offer_id?", "debt_id?", "status?", "limit?", "offset?"]
    output: Settlement[]
    side_effects: []

  - method: POST
    path: "/settlements/{id}/complete"
    description: "Complete a funded settlement: settles the debt, pays the fee, issues a 1099-C TaxEvent, resolves any lawsuit"
    roles: [NegotiationAgent]
    code: 200
    input: []
    output: Settlement
    side_effects:
      - "Settlement -> COMPLETED; Debt -> SETTLED; SettlementFee OUTSTANDING -> PAID (debits account)"
      - "TaxEvent ISSUED (reportable per forgiven_amount >= 600); Lawsuit (if any) -> RESOLVED_SETTLED"

  - method: POST
    path: "/settlements/{id}/void"
    description: "Void a funded settlement (creditor reneges): compensating reversal restoring account balance and reverting debt/offer"
    roles: [ProgramAdmin]
    code: 200
    input: []
    output: Settlement
    side_effects:
      - "Settlement -> VOIDED; funded_amount credited back to account; SettlementFee -> WAIVED"
      - "Debt reverts -> IN_NEGOTIATION; SettlementOffer reverts -> PENDING; any ISSUED TaxEvent -> VOIDED"

  # ---- SettlementFee ----
  - method: GET
    path: "/fees/{id}"
    description: "Get a single settlement fee"
    roles: [ProgramAdmin, NegotiationAgent, Client]
    code: 200
    input: []
    output: SettlementFee
    side_effects: []

  - method: GET
    path: "/fees"
    description: "List settlement fees (reverse-reachability for SettlementFee.program_id and SettlementFee.settlement_id), filtered by program_id, settlement_id, or status"
    roles: [ProgramAdmin, NegotiationAgent, Client]
    code: 200
    input: ["program_id?", "settlement_id?", "status?", "limit?", "offset?"]
    output: SettlementFee[]
    side_effects: []

  # ---- Lawsuit ----
  - method: POST
    path: "/lawsuits"
    description: "Refer a debt to litigation; moves the debt to LAWSUIT so later offers carry the surcharge"
    roles: [ProgramAdmin]
    code: 201
    input: [program_id, debt_id, court_reference, filed_at]
    output: Lawsuit
    side_effects: ["status=REFERRED; linked Debt -> LAWSUIT"]

  - method: GET
    path: "/lawsuits/{id}"
    description: "Get a single lawsuit"
    roles: [ProgramAdmin, NegotiationAgent, Client]
    code: 200
    input: []
    output: Lawsuit
    side_effects: []

  - method: GET
    path: "/lawsuits"
    description: "List lawsuits (reverse-reachability for Lawsuit.program_id and Lawsuit.debt_id), filtered by program_id, debt_id, or status"
    roles: [ProgramAdmin, NegotiationAgent, Client]
    code: 200
    input: ["program_id?", "debt_id?", "status?", "limit?", "offset?"]
    output: Lawsuit[]
    side_effects: []

  - method: POST
    path: "/lawsuits/{id}/dismiss"
    description: "Dismiss a lawsuit; reverts the debt out of LAWSUIT"
    roles: [ProgramAdmin]
    code: 200
    input: []
    output: Lawsuit
    side_effects: ["status -> RESOLVED_DISMISSED; linked Debt reverts to IN_NEGOTIATION or ENROLLED"]

  # ---- TaxEvent ----
  - method: GET
    path: "/tax-events/{id}"
    description: "Get a single tax event"
    roles: [ProgramAdmin, NegotiationAgent, Client]
    code: 200
    input: []
    output: TaxEvent
    side_effects: []

  - method: GET
    path: "/tax-events"
    description: "List 1099-C tax events (reverse-reachability for TaxEvent.program_id and TaxEvent.source_settlement_id), filtered by program_id, source_settlement_id, or status"
    roles: [ProgramAdmin, NegotiationAgent, Client]
    code: 200
    input: ["program_id?", "source_settlement_id?", "status?", "limit?", "offset?"]
    output: TaxEvent[]
    side_effects: []

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "Missing/invalid X-User-Role or X-User-ID headers"
  - id: ERR_FORBIDDEN
    http: 403
    condition: "Authenticated role not permitted for this operation per §1.7"
  - id: ERR_NOT_PROGRAM_OWNER
    http: 403
    condition: "Acting Client is not the owner (Program.client_id != X-User-ID) of a Client-exclusive operation"
  - id: ERR_NOT_FOUND
    http: 404
    condition: "Referenced Program/Debt/Offer/Settlement/Lawsuit/Deposit/TaxEvent/Account does not exist"
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "Malformed body, missing required field, invalid enum, or out-of-range numeric (offer_pct not in (0,1], non-positive amount)"
  - id: ERR_INVALID_STATE
    http: 409
    condition: "Resource is not in a state from which the requested transition is defined"
  - id: ERR_NO_ENROLLED_DEBTS
    http: 409
    condition: "Program activation attempted with no ENROLLED debt"
  - id: ERR_DUPLICATE_ACCOUNT_NUMBER
    http: 409
    condition: "Debt account_number already used within the program"
  - id: ERR_OFFER_EXPIRED
    http: 409
    condition: "Offer due_date is at or before current_utc on creation or acceptance"
  - id: ERR_OFFER_WINDOW_OVERLAP
    http: 409
    condition: "New offer's due_date is within 30 days (closed buffer, adjacency collides) of an existing PENDING offer's due_date on the same debt"
  - id: ERR_DEPOSIT_MONTH_OCCUPIED
    http: 409
    condition: "A CLEARED deposit already occupies the same UTC calendar-month bucket (half-open) for this program"
  - id: ERR_ACCOUNT_DEFAULTED
    http: 409
    condition: "Program.account_standing is DEFAULTED, blocking acceptance/funding/completion"
  - id: ERR_ACCOUNT_DELINQUENT
    http: 409
    condition: "Program.account_standing is DELINQUENT, blocking offer acceptance"
  - id: ERR_OFFER_ALREADY_ACCEPTED
    http: 409
    condition: "Debt already has an ACCEPTED offer; a second acceptance is rejected"
  - id: ERR_PROJECTED_RESERVE_SHORTFALL
    http: 402
    condition: "Forward-looking projected balance at due_date is below settlement_amount + projected_fee + reserve_floor"
  - id: ERR_INSUFFICIENT_RESERVE
    http: 402
    condition: "Instantaneous account balance is below settlement_amount + projected_fee + reserve_floor at funding"
  - id: ERR_OFFER_NOT_ACCEPTED
    http: 409
    condition: "Settlement funding requested against an offer that is not ACCEPTED or already produced a non-VOIDED settlement"
  - id: ERR_STALE_VERSION
    http: 412
    condition: "expected_program_version does not match Program.version (OCC)"
  - id: ERR_COMPLETION_NOT_ELIGIBLE
    http: 409
    condition: "Completion attempted while some Debt is non-terminal or a SettlementFee is OUTSTANDING"

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: ProgramAdmin
    description: "Operator who enrolls clients/programs/debts, activates and completes programs, refers/dismisses lawsuits, voids settlements, and operates the test clock."
    identity: "opaque"
    exclusive_operations:
      - "POST /clients"
      - "POST /programs"
      - "POST /debts"
      - "POST /programs/{id}/activate"
      - "POST /programs/{id}/complete"
      - "POST /lawsuits"
      - "POST /lawsuits/{id}/dismiss"
      - "POST /settlements/{id}/void"
      - "POST /_clock/set_current_utc"
    shared_operations:
      - "POST /deposits (also Client)"
      - "POST /deposits/{id}/cure (also Client)"
      - "All GET reads"

  - name: NegotiationAgent
    description: "Settlement specialist who records creditor offers, accepts/rejects them, funds and completes settlements."
    identity: "opaque"
    exclusive_operations:
      - "POST /offers"
      - "POST /offers/{id}/accept"
      - "POST /offers/{id}/reject"
      - "POST /settlements"
      - "POST /settlements/{id}/complete"
    shared_operations:
      - "All GET reads"

  - name: Client
    description: "The enrolled debtor; funds the dedicated account via deposits and may drop the program."
    identity: "entity_backed:Client"
    exclusive_operations:
      - "POST /programs/{id}/drop"
    shared_operations:
      - "POST /deposits (also ProgramAdmin)"
      - "POST /deposits/{id}/cure (also ProgramAdmin)"
      - "GET reads scoped to own programs"
