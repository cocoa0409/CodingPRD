scenario: |
  2805. Newsroom Standards & Corrections (news organization standards desk): sourcing standards with
  anonymous source approval requirements and documentation, pre-publication legal and standards review
  for high-risk stories with defamation and privacy analysis, correction, clarification and update policy
  with severity classification and placement requirements, correction intake from readers and subjects
  with investigation and response deadlines, conflict of interest disclosure and outside activity approval
  for journalists, plagiarism and fabrication investigation with disciplinary and disclosure obligations,
  transparency practices including editor's notes and story removal or unpublishing policy, standards
  training and case study review across the newsroom
domain_name: newsroom-standards-corrections
api_prefix: /standards-desk

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: multi_party_negotiation
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers

  entity_topology: flat
  # Every entity is a peer created through a top-level collection with foreign keys in the
  # request body (`POST /standards-desk/stories` carries `newsroom_id` + `lead_journalist_id`).
  # No write path is nested. Read paths expose parent-scoped sub-collections purely for
  # reverse-reachability (`GET /standards-desk/journalists/{id}/training-records`).

  state_machine_shape: parallel
  # Story carries two independent dimensions — `publication_status` (DRAFT→IN_REVIEW→CLEARED→
  # PUBLISHED→UNPUBLISHED) and `standards_status` (CLEAN→UNDER_INQUIRY→CORRECTED/RETRACTED, with
  # CORRECTED→UNDER_INQUIRY re-entry) — that advance on disjoint triggers. PrePublicationReview is
  # cyclic (SUBMITTED→CHANGES_REQUESTED→SUBMITTED, bounded at review_round 3); CorrectionRequest and
  # MisconductInvestigation branch with divergent side-effect sets per branch.

  relationship_patterns:
    - one_to_many          # Newsroom→Journalist, Story→CorrectionRequest, Journalist→TrainingRecord
    - cross_aggregate      # Story.lead_journalist_id, MisconductInvestigation.story_id, ReviewAssignment.reviewer_id
    - polymorphic          # StandardsAuditEvent.subject_type + subject_id addresses six entity types

  role_model: segregation_of_duties
  # The StandardsEditor who decides an anonymous source or adjudicates a correction may not be the
  # story's lead journalist; the editor who opened a misconduct investigation may not decide it; the
  # ExecutiveEditor who hears an appeal may not be the decider of record nor the subject.

  consistency_model: immediate

# ---------------------------------------------------------------------------
# §1.1 Entity-Relationship Table
# ---------------------------------------------------------------------------

entities:
  - name: Newsroom
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: Newsroom display name
        constraints: required, 1..120 characters
      - name: correction_response_sla_hours
        type: integer
        source: input
        description: Base SLA hours consumed by the correction_response_due_at calculation
        default: 72
        constraints: 1..336
      - name: high_severity_open_threshold
        type: integer
        source: input
        description: Open high-severity case count at which standards_posture becomes HEIGHTENED; twice this value yields LOCKDOWN
        default: 2
        constraints: ">= 1, <= 20"
      - name: required_module_codes
        type: array
        source: input
        description: Standards training module codes every journalist of this newsroom must complete
        default: ["SOURCING"]
        constraints: non-empty, distinct, each member of {SOURCING, CORRECTIONS, LEGAL_RISK, ANONYMOUS_SOURCING, PLAGIARISM}
      - name: standards_posture
        type: enum
        source: computed
        description: Derived desk-wide gate recomputed by the newsroom_standards_posture calculation
        default: OPEN
        constraints: OPEN | HEIGHTENED | LOCKDOWN
      - name: open_high_severity_count
        type: integer
        source: computed
        description: Count of open high-severity cases feeding standards_posture
        default: 0
      - name: training_compliance_index
        type: number
        source: computed
        description: Output of desk_training_compliance_index, 2 decimal places
        default: 0.00

  - name: Journalist
    parent: null
    common_fields: true
    fields:
      - name: newsroom_id
        type: string
        source: input
        description: FK -> Newsroom.id; employing newsroom
        constraints: required, must reference an existing Newsroom
      - name: full_name
        type: string
        source: input
        description: Journalist full name
        constraints: required, 1..120 characters
      - name: email
        type: string
        source: input
        description: Contact email, unique within the newsroom
        constraints: required, contains '@', unique per newsroom_id
      - name: role_title
        type: enum
        source: input
        description: Masthead title that the X-User-Role header must agree with for entity_backed roles
        constraints: REPORTER | STANDARDS_EDITOR | EXECUTIVE_EDITOR
      - name: employment_status
        type: enum
        source: system
        description: Auto-managed standing; SUSPENDED whenever penalty_points >= 12
        default: ACTIVE
        constraints: ACTIVE | SUSPENDED
      - name: penalty_points
        type: integer
        source: computed
        description: Sum of penalty_points over this journalist's SUSTAINED MisconductInvestigation rows
        default: 0
      - name: completed_required_module_count
        type: integer
        source: computed
        description: Count of DISTINCT module_code values in this journalist's TrainingRecord rows that appear in Newsroom.required_module_codes
        default: 0
      - name: training_current
        type: boolean
        source: computed
        description: True when completed_required_module_count equals the length of Newsroom.required_module_codes
        default: false
      - name: restricted_beats
        type: array
        source: computed
        description: Union of restricted_beats over this journalist's ConflictDisclosure rows whose status is RESTRICTION_IMPOSED
        default: []

  - name: Reviewer
    parent: null
    common_fields: true
    fields:
      - name: newsroom_id
        type: string
        source: input
        description: FK -> Newsroom.id; newsroom the reviewer serves
        constraints: required
      - name: full_name
        type: string
        source: input
        description: Reviewer full name
        constraints: required, 1..120 characters
      - name: discipline
        type: enum
        source: input
        description: Review track this reviewer staffs; LegalCounsel identities must be LEGAL reviewers
        constraints: LEGAL | STANDARDS
      - name: weekly_capacity_minutes
        type: integer
        source: input
        description: Total bookable minutes; the conserved quantity of the reviewer-minute ledger
        default: 600
        constraints: ">= 60, <= 4800"
      - name: reserved_minutes
        type: integer
        source: computed
        description: Sum of duration_minutes over this reviewer's ReviewAssignment rows whose status is SCHEDULED
        default: 0
      - name: available_minutes
        type: integer
        source: computed
        description: weekly_capacity_minutes minus reserved_minutes; never negative
        default: 600

  - name: Story
    parent: null
    common_fields: true
    fields:
      - name: newsroom_id
        type: string
        source: input
        description: FK -> Newsroom.id; owning newsroom
        constraints: required
      - name: lead_journalist_id
        type: string
        source: input
        description: FK -> Journalist.id; reporter accountable for the story, must belong to newsroom_id and be ACTIVE at creation
        constraints: required
      - name: headline
        type: string
        source: input
        description: Working headline
        constraints: required, 1..200 characters
      - name: defamation_claim_count
        type: integer
        source: input
        description: Number of potentially defamatory assertions inventoried by the desk
        default: 0
        constraints: 0..50
      - name: privacy_subject_count
        type: integer
        source: input
        description: Number of private individuals identifiable in the story
        default: 0
        constraints: 0..50
      - name: unverified_document_count
        type: integer
        source: input
        description: Number of documents relied on that lack independent verification
        default: 0
        constraints: 0..50
      - name: publication_status
        type: enum
        source: system
        description: Publication dimension of the parallel state machine
        default: DRAFT
        constraints: DRAFT | IN_REVIEW | CLEARED | PUBLISHED | UNPUBLISHED
      - name: standards_status
        type: enum
        source: system
        description: Standards dimension of the parallel state machine, driven by corrections and retractions
        default: CLEAN
        constraints: CLEAN | UNDER_INQUIRY | CORRECTED | RETRACTED
      - name: risk_index_estimate
        type: number
        source: computed
        description: story_risk_index under the pre_publication_estimate variant, 2 decimal places
        default: 0.00
      - name: risk_index_actual
        type: number
        source: computed
        description: story_risk_index under the post_publication_actual variant; null until the story is published
        default: null
      - name: risk_tier
        type: enum
        source: computed
        description: Band of risk_index_estimate; HIGH at >= 40.00, ELEVATED at >= 20.00, otherwise STANDARD
        default: STANDARD
        constraints: STANDARD | ELEVATED | HIGH
      - name: approved_anonymous_source_count
        type: integer
        source: computed
        description: Count of this story's AnonymousSourceApproval rows whose status is APPROVED
        default: 0
      - name: revoked_anonymous_source_count
        type: integer
        source: computed
        description: Count of this story's AnonymousSourceApproval rows whose status is REVOKED
        default: 0
      - name: severe_correction_count
        type: integer
        source: computed
        description: Count of this story's CorrectionRequest rows whose adjudicated_severity_band is MAJOR or SEVERE and whose status is ADJUDICATED or RESOLVED
        default: 0
      - name: open_correction_request_count
        type: integer
        source: computed
        description: Count of this story's CorrectionRequest rows whose status is INTAKE, INVESTIGATING or AWAITING_SUBJECT
        default: 0
      - name: published_at
        type: datetime
        source: system
        description: Logical-clock instant of the publish transition, ISO 8601 UTC with three fractional digits
        default: null
      - name: unpublished_at
        type: datetime
        source: system
        description: Logical-clock instant of the unpublish transition
        default: null
      - name: editors_note_text
        type: string
        source: system
        description: Transparency note recorded by the unpublish transition
        default: null

  - name: AnonymousSourceApproval
    parent: null
    common_fields: true
    fields:
      - name: story_id
        type: string
        source: input
        description: FK -> Story.id; story relying on the anonymous source
        constraints: required
      - name: source_alias
        type: string
        source: input
        description: Non-identifying alias used in copy, unique per story_id
        constraints: required, 1..80 characters, unique per story_id
      - name: source_category
        type: enum
        source: input
        description: Category of the source for sourcing-standards bookkeeping
        constraints: GOVERNMENT | CORPORATE | VICTIM | WHISTLEBLOWER | LAW_ENFORCEMENT
      - name: harm_risk
        type: enum
        source: input
        description: Assessed harm to the source if identified
        constraints: LOW | ELEVATED | SEVERE
      - name: identity_known_to_editor
        type: boolean
        source: input
        description: Whether a standards editor holds the true identity on the record
        constraints: required
      - name: corroboration_count
        type: integer
        source: input
        description: Number of independent corroborating sources for the source's central claim
        default: 0
        constraints: 0..20
      - name: justification_text
        type: string
        source: input
        description: Written justification for granting anonymity
        constraints: required, 0..2000 characters
      - name: documentation_complete
        type: boolean
        source: computed
        description: True when identity_known_to_editor is true AND justification_text length >= 20
        default: false
      - name: status
        type: enum
        source: system
        description: Approval lifecycle state
        default: REQUESTED
        constraints: REQUESTED | APPROVED | DENIED | REVOKED
      - name: decided_by_user_id
        type: string
        source: system
        description: X-User-ID of the deciding StandardsEditor, retained for the segregation-of-duties audit trail; an opaque audit value, not a queryable relationship
        default: null
      - name: decided_at
        type: datetime
        source: system
        description: Logical-clock instant of the decide transition
        default: null
      - name: revocation_reason
        type: string
        source: system
        description: Reason captured by the revoke transition
        default: null

  - name: PrePublicationReview
    parent: null
    common_fields: true
    fields:
      - name: story_id
        type: string
        source: input
        description: FK -> Story.id; story under pre-publication review
        constraints: required
      - name: high_risk_declared
        type: boolean
        source: input
        description: Desk declaration that forces the legal track regardless of computed risk_tier
        default: false
      - name: submission_note
        type: string
        source: input
        description: Reporter note accompanying the submission
        default: null
      - name: requires_legal_review
        type: boolean
        source: computed
        description: True when high_risk_declared is true OR the story's risk_tier is HIGH at submission time
        default: false
      - name: review_round
        type: integer
        source: system
        description: Revision round; incremented by each resubmit, capped at 3
        default: 1
        constraints: 1..3
      - name: status
        type: enum
        source: system
        description: Cyclic review lifecycle state
        default: SUBMITTED
        constraints: SUBMITTED | LEGAL_CLEARED | STANDARDS_CLEARED | CHANGES_REQUESTED | CLEARED | BLOCKED
      - name: legal_verdict
        type: enum
        source: system
        description: Most recent legal verdict recorded on this review
        default: null
        constraints: PASS | CHANGES_REQUIRED | BLOCK
      - name: standards_verdict
        type: enum
        source: system
        description: Most recent standards verdict recorded on this review
        default: null
        constraints: PASS | CHANGES_REQUIRED | BLOCK
      - name: defamation_findings
        type: integer
        source: system
        description: Defamation exposures counted by the legal verdict
        default: 0
        constraints: 0..50
      - name: privacy_findings
        type: integer
        source: system
        description: Privacy exposures counted by the legal verdict
        default: 0
        constraints: 0..50
      - name: cleared_at
        type: datetime
        source: system
        description: Logical-clock instant of the clear transition
        default: null

  - name: ReviewAssignment
    parent: null
    common_fields: true
    fields:
      - name: review_id
        type: string
        source: input
        description: FK -> PrePublicationReview.id; review the slot serves
        constraints: required
      - name: reviewer_id
        type: string
        source: input
        description: FK -> Reviewer.id; reviewer whose minutes the slot occupies
        constraints: required
      - name: starts_at
        type: datetime
        source: input
        description: Inclusive slot start, ISO 8601 UTC
        constraints: required
      - name: ends_at
        type: datetime
        source: input
        description: Inclusive slot end, ISO 8601 UTC; must be strictly after starts_at
        constraints: required
      - name: duration_minutes
        type: integer
        source: computed
        description: Whole minutes between starts_at and ends_at
        default: 0
      - name: status
        type: enum
        source: system
        description: Slot lifecycle; only SCHEDULED slots hold reviewer minutes
        default: SCHEDULED
        constraints: SCHEDULED | COMPLETED | CANCELLED
      - name: cancellation_reason
        type: string
        source: system
        description: Reason captured by the cancel transition
        default: null

  - name: CorrectionRequest
    parent: null
    common_fields: true
    fields:
      - name: story_id
        type: string
        source: input
        description: FK -> Story.id; story the complaint targets
        constraints: required
      - name: submitter_type
        type: enum
        source: input
        description: Who raised the complaint; drives the deadline bump
        constraints: READER | SUBJECT | INTERNAL
      - name: submitter_email
        type: string
        source: input
        description: Reply-to address for the response obligation
        constraints: required, contains '@'
      - name: claim_text
        type: string
        source: input
        description: The complaint as received
        constraints: required, 1..4000 characters
      - name: claimed_error_category
        type: enum
        source: input
        description: Error category as claimed at intake; feeds the provisional variant
        constraints: FACTUAL | QUOTE | NUMERIC | IDENTIFICATION | CONTEXT
      - name: reader_reported_reach
        type: integer
        source: input
        description: Audience reach as reported by the submitter; feeds the provisional variant
        default: 0
        constraints: ">= 0"
      - name: subject_named
        type: boolean
        source: input
        description: Whether a named individual is implicated; feeds the adjudicated variant's subject bonus
        default: false
      - name: provisional_severity_score
        type: integer
        source: computed
        description: correction_severity_score under the intake_provisional variant
        default: 0
      - name: provisional_severity_band
        type: enum
        source: computed
        description: Band pinned from the provisional raw score
        default: TRIVIAL
        constraints: TRIVIAL | MINOR | MAJOR | SEVERE
      - name: adjudicated_error_category
        type: enum
        source: system
        description: Error category as found by the desk; supplied at adjudication
        default: null
        constraints: FACTUAL | QUOTE | NUMERIC | IDENTIFICATION | CONTEXT
      - name: verified_reach
        type: integer
        source: system
        description: Audience reach verified by the desk; supplied at adjudication
        default: null
      - name: adjudicated_severity_score
        type: integer
        source: computed
        description: correction_severity_score under the adjudicated_final variant
        default: null
      - name: adjudicated_severity_band
        type: enum
        source: computed
        description: Band pinned from the adjudicated raw score
        default: null
        constraints: TRIVIAL | MINOR | MAJOR | SEVERE
      - name: outcome_type
        type: enum
        source: system
        description: Disposition chosen at adjudication
        default: null
        constraints: CORRECTION | CLARIFICATION | UPDATE | EDITORS_NOTE | NO_ACTION
      - name: placement
        type: enum
        source: computed
        description: Required notice placement derived from outcome_type and adjudicated_severity_band
        default: null
        constraints: TOP_OF_STORY | END_OF_STORY | INLINE
      - name: notice_text
        type: string
        source: system
        description: Published notice copy supplied at adjudication
        default: null
      - name: notice_published_at
        type: datetime
        source: system
        description: Logical-clock instant at which the resolve transition published the notice
        default: null
      - name: response_due_at
        type: datetime
        source: computed
        description: Deadline pinned at intake by correction_response_due_at
        default: null
      - name: breach_flag
        type: boolean
        source: computed
        description: True when the logical clock is strictly after response_due_at and status is INTAKE, INVESTIGATING or AWAITING_SUBJECT
        default: false
      - name: status
        type: enum
        source: system
        description: Branching intake lifecycle state
        default: INTAKE
        constraints: INTAKE | INVESTIGATING | AWAITING_SUBJECT | ADJUDICATED | RESOLVED | DISMISSED
      - name: resolved_at
        type: datetime
        source: system
        description: Logical-clock instant of the resolve transition
        default: null

  - name: MisconductInvestigation
    parent: null
    common_fields: true
    fields:
      - name: journalist_id
        type: string
        source: input
        description: FK -> Journalist.id; subject of the investigation
        constraints: required
      - name: story_id
        type: string
        source: input
        description: FK -> Story.id; story the allegation arose from, optional
        default: null
      - name: allegation_type
        type: enum
        source: input
        description: Nature of the allegation
        constraints: PLAGIARISM | FABRICATION | UNDISCLOSED_COI
      - name: severity
        type: enum
        source: input
        description: Desk-assessed severity, fixed at opening
        constraints: MINOR | SERIOUS | EGREGIOUS
      - name: allegation_summary
        type: string
        source: input
        description: Written summary of the allegation
        constraints: required, 1..4000 characters
      - name: status
        type: enum
        source: system
        description: Branching investigation lifecycle state
        default: OPENED
        constraints: OPENED | EVIDENCE_REVIEW | RESPONSE_PENDING | SUSTAINED | UNFOUNDED | OVERTURNED
      - name: penalty_points
        type: integer
        source: computed
        description: Points assigned at the SUSTAINED transition by journalist_penalty_points; zero in every other state
        default: 0
      - name: prior_sustained_count
        type: integer
        source: system
        description: Number of the subject's investigations already SUSTAINED when this decision was recorded
        default: 0
      - name: disclosure_obligation
        type: enum
        source: computed
        description: Transparency duty implied by a sustained finding, per misconduct_disclosure_obligation
        default: NONE
        constraints: NONE | EDITORS_NOTE | CORRECTION | RETRACTION_REVIEW
      - name: opened_by_user_id
        type: string
        source: system
        description: X-User-ID of the opening StandardsEditor, retained for segregation-of-duties checks; an opaque audit value, not a queryable relationship
      - name: decided_by_user_id
        type: string
        source: system
        description: X-User-ID of the deciding StandardsEditor, retained for segregation-of-duties checks; an opaque audit value, not a queryable relationship
        default: null
      - name: opened_at
        type: datetime
        source: system
        description: Logical-clock instant the investigation was opened
      - name: decided_at
        type: datetime
        source: system
        description: Logical-clock instant of the decide transition; orders prior_sustained_count
        default: null
      - name: appeal_outcome
        type: enum
        source: system
        description: Result of the executive appeal
        default: null
        constraints: UPHELD | OVERTURNED

  - name: ConflictDisclosure
    parent: null
    common_fields: true
    fields:
      - name: journalist_id
        type: string
        source: input
        description: FK -> Journalist.id; disclosing journalist
        constraints: required
      - name: disclosure_type
        type: enum
        source: input
        description: Category of the conflict disclosed
        constraints: FINANCIAL | FAMILIAL | POLITICAL | EMPLOYMENT
      - name: subject_entity_name
        type: string
        source: input
        description: Organization or person the conflict concerns
        constraints: required, 1..160 characters
      - name: description
        type: string
        source: input
        description: Narrative of the conflict
        constraints: required, 1..4000 characters
      - name: status
        type: enum
        source: system
        description: Disclosure review state
        default: SUBMITTED
        constraints: SUBMITTED | ACKNOWLEDGED | RESTRICTION_IMPOSED | REJECTED
      - name: restricted_beats
        type: array
        source: system
        description: Beat labels barred to the journalist, recorded by an IMPOSE_RESTRICTION review
        default: []
      - name: reviewed_by_user_id
        type: string
        source: system
        description: X-User-ID of the reviewing StandardsEditor, retained for audit; an opaque audit value, not a queryable relationship
        default: null
      - name: reviewed_at
        type: datetime
        source: system
        description: Logical-clock instant of the review transition
        default: null

  - name: OutsideActivityRequest
    parent: null
    common_fields: true
    fields:
      - name: journalist_id
        type: string
        source: input
        description: FK -> Journalist.id; requesting journalist
        constraints: required
      - name: activity_type
        type: enum
        source: input
        description: Kind of outside activity requested
        constraints: SPEAKING | BOOK | CONSULTING | BOARD_SERVICE
      - name: compensated
        type: boolean
        source: input
        description: Whether the activity is paid
        constraints: required
      - name: starts_on
        type: datetime
        source: input
        description: Inclusive interval start, ISO 8601 UTC
        constraints: required
      - name: ends_on
        type: datetime
        source: input
        description: Exclusive interval end, ISO 8601 UTC; must be strictly after starts_on
        constraints: required
      - name: related_beat
        type: string
        source: input
        description: Beat label the activity touches, matched against the journalist's restricted_beats
        constraints: required, 1..80 characters
      - name: host_organization
        type: string
        source: input
        description: Organization hosting the activity
        constraints: required, 1..160 characters
      - name: status
        type: enum
        source: system
        description: Approval lifecycle state
        default: REQUESTED
        constraints: REQUESTED | APPROVED | DENIED | REVOKED
      - name: decided_by_user_id
        type: string
        source: system
        description: X-User-ID of the deciding StandardsEditor, retained for audit; an opaque audit value, not a queryable relationship
        default: null
      - name: decided_at
        type: datetime
        source: system
        description: Logical-clock instant of the decide transition
        default: null
      - name: revocation_reason
        type: string
        source: system
        description: Reason recorded when a suspension cascade revokes the approval
        default: null

  - name: TrainingRecord
    parent: null
    common_fields: false
    fields:
      - name: journalist_id
        type: string
        source: input
        description: FK -> Journalist.id; journalist who completed the module
        constraints: required
      - name: module_code
        type: enum
        source: input
        description: Standards training module completed; at most one record per journalist per module
        constraints: SOURCING | CORRECTIONS | LEGAL_RISK | ANONYMOUS_SOURCING | PLAGIARISM
      - name: case_study_reference
        type: string
        source: input
        description: Case study reviewed during the module
        default: null
      - name: completed_at
        type: datetime
        source: system
        description: Logical-clock instant the record was filed; append-only, never updated

  - name: StandardsAuditEvent
    parent: null
    common_fields: false
    fields:
      - name: newsroom_id
        type: string
        source: system
        description: FK -> Newsroom.id; newsroom the event belongs to
        constraints: system-populated from the subject's newsroom, never accepted from a request body
      - name: event_type
        type: enum
        source: system
        description: Which audited transition emitted the event
        constraints: SOURCE_APPROVED | SOURCE_DENIED | SOURCE_REVOKED | REVIEW_CLEARED | STORY_PUBLISHED | STORY_UNPUBLISHED | CORRECTION_ADJUDICATED | CORRECTION_RESOLVED | INVESTIGATION_SUSTAINED | INVESTIGATION_OVERTURNED | POSTURE_CHANGED | ACTIVITY_REVOKED
      - name: subject_type
        type: enum
        source: system
        description: Entity type the event describes
        constraints: Story | CorrectionRequest | MisconductInvestigation | AnonymousSourceApproval | Newsroom | OutsideActivityRequest
      - name: subject_id
        type: string
        source: system
        description: id of the subject entity; polymorphic reference resolved through subject_type
      - name: actor_role
        type: string
        source: system
        description: X-User-Role that caused the event, or 'system' for cascaded events
      - name: actor_user_id
        type: string
        source: system
        description: X-User-ID that caused the event, null for cascaded events
        default: null
      - name: summary
        type: string
        source: system
        description: One-line human-readable description of the event
      - name: occurred_at
        type: datetime
        source: system
        description: Logical-clock instant the event was emitted; append-only, never updated

# ---------------------------------------------------------------------------
# §1.2 State Machine Table
# ---------------------------------------------------------------------------

state_machines:
  - entity: Story
    state_dimension: publication_status
    initial_state: DRAFT
    terminal_states: [UNPUBLISHED]
    transitions:
      - from: DRAFT
        to: IN_REVIEW
        trigger: "POST /standards-desk/pre-publication-reviews"
        actor: Reporter
        preconditions:
          - "story.publication_status == DRAFT"
          - "expected_story_version equals Story.version"
          - "Journalist.employment_status == ACTIVE for story.lead_journalist_id"
        side_effects:
          - "creates PrePublicationReview in SUBMITTED with review_round 1"
          - "sets PrePublicationReview.requires_legal_review = (high_risk_declared OR story.risk_tier == HIGH)"
          - "recomputes Story.risk_index_estimate via story_risk_index / pre_publication_estimate"
          - "increments Story.version by 1"
      - from: IN_REVIEW
        to: DRAFT
        trigger: "POST /standards-desk/pre-publication-reviews/{id}/legal-verdict with legal_verdict CHANGES_REQUIRED, or POST .../standards-verdict with standards_verdict CHANGES_REQUIRED"
        actor: LegalCounsel | StandardsEditor
        preconditions:
          - "review.status IN {SUBMITTED, LEGAL_CLEARED}"
        side_effects:
          - "sets PrePublicationReview.status = CHANGES_REQUESTED"
          - "because the review left an open stage, every ReviewAssignment of that review whose status is SCHEDULED becomes CANCELLED"
          - "because those assignments left SCHEDULED, each affected Reviewer.reserved_minutes is recomputed by reviewer_minute_ledger and Reviewer.available_minutes follows"
          - "increments Story.version by 1"
      - from: DRAFT
        to: IN_REVIEW
        trigger: "POST /standards-desk/pre-publication-reviews/{id}/resubmit"
        actor: Reporter
        preconditions:
          - "review.status == CHANGES_REQUESTED"
          - "review.review_round < 3"
        side_effects:
          - "sets PrePublicationReview.status = SUBMITTED and increments review_round by 1"
          - "clears PrePublicationReview.legal_verdict and standards_verdict to null"
          - "recomputes Story.risk_index_estimate"
          - "increments Story.version by 1"
        note: "The DRAFT->IN_REVIEW->DRAFT->IN_REVIEW loop is the revision cycle; it terminates because review_round is capped at 3."
      - from: IN_REVIEW
        to: CLEARED
        trigger: "POST /standards-desk/pre-publication-reviews/{id}/clear"
        actor: StandardsEditor | ExecutiveEditor
        preconditions:
          - "review.status == STANDARDS_CLEARED"
          - "newsroom.standards_posture != LOCKDOWN"
          - "newsroom.standards_posture == HEIGHTENED implies X-User-Role == ExecutiveEditor"
        side_effects:
          - "sets PrePublicationReview.status = CLEARED and cleared_at to the logical clock"
          - "because the review reached CLEARED, every ReviewAssignment of that review whose status is SCHEDULED becomes COMPLETED"
          - "because those assignments left SCHEDULED, each affected Reviewer.reserved_minutes is recomputed by reviewer_minute_ledger and Reviewer.available_minutes follows"
          - "emits StandardsAuditEvent REVIEW_CLEARED"
          - "increments Story.version by 1"
      - from: CLEARED
        to: PUBLISHED
        trigger: "POST /standards-desk/stories/{id}/publish"
        actor: ExecutiveEditor
        preconditions:
          - "story.publication_status == CLEARED"
          - "newsroom.standards_posture != LOCKDOWN"
          - "no AnonymousSourceApproval of the story has status REQUESTED or REVOKED"
          - "story.risk_tier == HIGH implies Journalist.training_current == true for story.lead_journalist_id"
          - "Journalist.employment_status == ACTIVE for story.lead_journalist_id"
        side_effects:
          - "sets Story.published_at to the logical clock"
          - "computes Story.risk_index_actual via story_risk_index / post_publication_actual"
          - "emits StandardsAuditEvent STORY_PUBLISHED"
          - "increments Story.version by 1"
      - from: PUBLISHED
        to: UNPUBLISHED
        trigger: "POST /standards-desk/stories/{id}/unpublish"
        actor: ExecutiveEditor
        preconditions:
          - "story.publication_status == PUBLISHED"
          - "at least one MisconductInvestigation with status SUSTAINED references this story_id, OR story.severe_correction_count >= 1"
        side_effects:
          - "sets Story.unpublished_at to the logical clock and stores editors_note_text"
          - "sets Story.standards_status = RETRACTED"
          - "recomputes Story.risk_index_actual"
          - "emits StandardsAuditEvent STORY_UNPUBLISHED"
          - "increments Story.version by 1"
      - from: IN_REVIEW
        to: DRAFT
        trigger: "system cascade from POST /standards-desk/misconduct-investigations/{id}/decide with disposition SUSTAINED that suspends the lead journalist"
        actor: system
        preconditions:
          - "Journalist.employment_status transitioned ACTIVE -> SUSPENDED"
          - "story.publication_status == IN_REVIEW"
        side_effects:
          - "sets Story.publication_status = DRAFT"
          - "because the story left IN_REVIEW, its non-terminal PrePublicationReview rows become BLOCKED"
          - "because those reviews became BLOCKED, their SCHEDULED ReviewAssignment rows become CANCELLED and each Reviewer.reserved_minutes is recomputed"
          - "increments Story.version by 1"

  - entity: Story
    state_dimension: standards_status
    initial_state: CLEAN
    terminal_states: [RETRACTED]
    transitions:
      - from: CLEAN
        to: UNDER_INQUIRY
        trigger: "POST /standards-desk/correction-requests"
        actor: PublicEditor | StandardsEditor
        preconditions:
          - "story.standards_status IN {CLEAN, CORRECTED}"
        side_effects:
          - "creates CorrectionRequest in INTAKE with provisional severity and response_due_at pinned"
          - "increments Story.open_correction_request_count"
          - "increments Story.version by 1"
      - from: CORRECTED
        to: UNDER_INQUIRY
        trigger: "POST /standards-desk/correction-requests"
        actor: PublicEditor | StandardsEditor
        preconditions:
          - "story.standards_status == CORRECTED"
        side_effects:
          - "same as the CLEAN -> UNDER_INQUIRY transition"
          - "increments Story.version by 1"
        note: "Re-entry edge: a corrected story returns to inquiry when a new complaint arrives, which is why standards_status is cyclic while publication_status is not."
      - from: UNDER_INQUIRY
        to: CORRECTED
        trigger: "POST /standards-desk/correction-requests/{id}/adjudicate with outcome_type in {CORRECTION, CLARIFICATION, UPDATE, EDITORS_NOTE}"
        actor: StandardsEditor
        preconditions:
          - "correction.status IN {INVESTIGATING, AWAITING_SUBJECT}"
          - "X-User-ID != story.lead_journalist_id"
        side_effects:
          - "sets CorrectionRequest.status = ADJUDICATED with adjudicated score, band and placement"
          - "because the adjudicated band is MAJOR or SEVERE, Story.severe_correction_count is incremented and Story.risk_index_actual is recomputed via post_publication_actual"
          - "because Story.severe_correction_count changed, Newsroom.open_high_severity_count is recomputed by newsroom_standards_posture"
          - "because Newsroom.open_high_severity_count crossed high_severity_open_threshold, Newsroom.standards_posture advances to HEIGHTENED (or LOCKDOWN at twice the threshold) and a POSTURE_CHANGED audit event is emitted"
          - "emits StandardsAuditEvent CORRECTION_ADJUDICATED"
          - "increments Story.version by 1"
      - from: UNDER_INQUIRY
        to: CLEAN
        trigger: "POST /standards-desk/correction-requests/{id}/adjudicate with outcome_type NO_ACTION"
        actor: StandardsEditor
        preconditions:
          - "correction.status IN {INVESTIGATING, AWAITING_SUBJECT}"
          - "story.open_correction_request_count == 1 (this request is the last open one)"
          - "story.severe_correction_count == 0"
        side_effects:
          - "sets CorrectionRequest.status = DISMISSED with outcome_type NO_ACTION, placement null and no notice"
          - "decrements Story.open_correction_request_count to 0"
          - "increments Story.version by 1"
        note: "Divergent branch of the same trigger: NO_ACTION dismisses without a notice and returns the story to CLEAN, while notice-bearing outcomes drive the CORRECTED branch and the posture cascade."
      - from: CLEAN | UNDER_INQUIRY | CORRECTED
        to: RETRACTED
        trigger: "POST /standards-desk/stories/{id}/unpublish"
        actor: ExecutiveEditor
        preconditions:
          - "story.publication_status == PUBLISHED"
          - "story.standards_status IN {CLEAN, UNDER_INQUIRY, CORRECTED}"
        side_effects:
          - "sets Story.standards_status = RETRACTED"
        note: "The two Story dimensions are independent everywhere except the unpublish transition, which writes both."

  - entity: PrePublicationReview
    initial_state: SUBMITTED
    terminal_states: [CLEARED, BLOCKED]
    transitions:
      - from: SUBMITTED
        to: LEGAL_CLEARED
        trigger: "POST /standards-desk/pre-publication-reviews/{id}/legal-verdict with legal_verdict PASS"
        actor: LegalCounsel
        preconditions:
          - "review.status == SUBMITTED"
          - "review.requires_legal_review == true"
        side_effects:
          - "stores legal_verdict, defamation_findings and privacy_findings"
          - "increments PrePublicationReview.version by 1"
      - from: SUBMITTED
        to: STANDARDS_CLEARED
        trigger: "POST /standards-desk/pre-publication-reviews/{id}/standards-verdict with standards_verdict PASS"
        actor: StandardsEditor
        preconditions:
          - "review.status == SUBMITTED"
          - "review.requires_legal_review == false"
        side_effects:
          - "stores standards_verdict"
          - "increments PrePublicationReview.version by 1"
      - from: LEGAL_CLEARED
        to: STANDARDS_CLEARED
        trigger: "POST /standards-desk/pre-publication-reviews/{id}/standards-verdict with standards_verdict PASS"
        actor: StandardsEditor
        preconditions:
          - "review.status == LEGAL_CLEARED"
        side_effects:
          - "stores standards_verdict"
          - "increments PrePublicationReview.version by 1"
      - from: SUBMITTED
        to: CHANGES_REQUESTED
        trigger: "POST /standards-desk/pre-publication-reviews/{id}/legal-verdict with legal_verdict CHANGES_REQUIRED"
        actor: LegalCounsel
        preconditions:
          - "review.status == SUBMITTED"
          - "review.requires_legal_review == true"
        side_effects:
          - "sets Story.publication_status = DRAFT"
          - "because the review left its open stage, SCHEDULED ReviewAssignment rows of this review become CANCELLED"
          - "because those assignments left SCHEDULED, Reviewer.reserved_minutes and available_minutes are recomputed"
      - from: LEGAL_CLEARED
        to: CHANGES_REQUESTED
        trigger: "POST /standards-desk/pre-publication-reviews/{id}/standards-verdict with standards_verdict CHANGES_REQUIRED"
        actor: StandardsEditor
        preconditions:
          - "review.status == LEGAL_CLEARED"
        side_effects:
          - "sets Story.publication_status = DRAFT"
          - "cancels SCHEDULED ReviewAssignment rows of this review and recomputes the affected reviewer ledgers"
      - from: SUBMITTED
        to: CHANGES_REQUESTED
        trigger: "POST /standards-desk/pre-publication-reviews/{id}/standards-verdict with standards_verdict CHANGES_REQUIRED"
        actor: StandardsEditor
        preconditions:
          - "review.status == SUBMITTED"
          - "review.requires_legal_review == false"
        side_effects:
          - "sets Story.publication_status = DRAFT"
          - "cancels SCHEDULED ReviewAssignment rows of this review and recomputes the affected reviewer ledgers"
        note: "The standards-only track: when no legal review is required the standards editor's revision request closes the round directly from SUBMITTED."
      - from: CHANGES_REQUESTED
        to: SUBMITTED
        trigger: "POST /standards-desk/pre-publication-reviews/{id}/resubmit"
        actor: Reporter
        preconditions:
          - "review.status == CHANGES_REQUESTED"
          - "review.review_round < 3"
          - "X-User-ID == story.lead_journalist_id"
        side_effects:
          - "increments review_round by 1, clears both verdicts, sets Story.publication_status = IN_REVIEW"
        note: "Cycle edge. review_round 3 is the loop bound; a fourth submission is rejected with ERR_INVALID_STATE."
      - from: SUBMITTED
        to: BLOCKED
        trigger: "POST /standards-desk/pre-publication-reviews/{id}/legal-verdict with legal_verdict BLOCK"
        actor: LegalCounsel
        preconditions:
          - "review.status == SUBMITTED"
          - "review.requires_legal_review == true"
        side_effects:
          - "sets Story.publication_status = DRAFT"
          - "cancels SCHEDULED ReviewAssignment rows of this review and recomputes the affected reviewer ledgers"
      - from: STANDARDS_CLEARED
        to: CLEARED
        trigger: "POST /standards-desk/pre-publication-reviews/{id}/clear"
        actor: StandardsEditor | ExecutiveEditor
        preconditions:
          - "review.status == STANDARDS_CLEARED"
          - "newsroom.standards_posture != LOCKDOWN"
          - "newsroom.standards_posture == HEIGHTENED implies X-User-Role == ExecutiveEditor"
        side_effects:
          - "sets cleared_at, sets Story.publication_status = CLEARED"
          - "completes SCHEDULED ReviewAssignment rows of this review and recomputes the affected reviewer ledgers"
          - "emits StandardsAuditEvent REVIEW_CLEARED"
      - from: SUBMITTED
        to: BLOCKED
        trigger: "system cascade from a SUSTAINED misconduct decision that suspends the story's lead journalist"
        actor: system
        preconditions:
          - "review.status IN {SUBMITTED, LEGAL_CLEARED, STANDARDS_CLEARED, CHANGES_REQUESTED}"
          - "Journalist.employment_status transitioned ACTIVE -> SUSPENDED"
        side_effects:
          - "sets PrePublicationReview.status = BLOCKED"
          - "because the review became BLOCKED, its SCHEDULED ReviewAssignment rows become CANCELLED and each Reviewer.reserved_minutes is recomputed"

  - entity: ReviewAssignment
    initial_state: SCHEDULED
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /standards-desk/review-assignments/{id}/cancel"
        actor: LegalCounsel | StandardsEditor
        preconditions:
          - "assignment.status == SCHEDULED"
        side_effects:
          - "recomputes Reviewer.reserved_minutes and Reviewer.available_minutes via reviewer_minute_ledger"
          - "increments Reviewer.version by 1"
        note: "Compensating action for the assignment-create reservation; reviewer_minutes_conserved must hold before and after."
      - from: SCHEDULED
        to: COMPLETED
        trigger: "system cascade from POST /standards-desk/pre-publication-reviews/{id}/clear"
        actor: system
        preconditions:
          - "assignment.status == SCHEDULED"
          - "review.status transitioned STANDARDS_CLEARED -> CLEARED"
        side_effects:
          - "recomputes Reviewer.reserved_minutes and Reviewer.available_minutes"
          - "increments Reviewer.version by 1"
      - from: SCHEDULED
        to: CANCELLED
        trigger: "system cascade from a CHANGES_REQUESTED, BLOCKED or suspension-driven review transition"
        actor: system
        preconditions:
          - "assignment.status == SCHEDULED"
          - "review.status left {SUBMITTED, LEGAL_CLEARED, STANDARDS_CLEARED}"
        side_effects:
          - "recomputes Reviewer.reserved_minutes and Reviewer.available_minutes"
          - "increments Reviewer.version by 1"

  - entity: AnonymousSourceApproval
    initial_state: REQUESTED
    terminal_states: [DENIED, REVOKED]
    transitions:
      - from: REQUESTED
        to: APPROVED
        trigger: "POST /standards-desk/anonymous-source-approvals/{id}/decide with decision APPROVE"
        actor: StandardsEditor
        preconditions:
          - "approval.status == REQUESTED"
          - "X-User-ID != story.lead_journalist_id"
          - "approval.documentation_complete == true"
          - "approval.harm_risk == SEVERE implies approval.corroboration_count >= 2"
        side_effects:
          - "stores decided_by_user_id and decided_at"
          - "increments Story.approved_anonymous_source_count and recomputes Story.risk_index_estimate and risk_tier"
          - "emits StandardsAuditEvent SOURCE_APPROVED"
          - "increments Story.version by 1"
      - from: REQUESTED
        to: DENIED
        trigger: "POST /standards-desk/anonymous-source-approvals/{id}/decide with decision DENY"
        actor: StandardsEditor
        preconditions:
          - "approval.status == REQUESTED"
          - "X-User-ID != story.lead_journalist_id"
        side_effects:
          - "stores decided_by_user_id and decided_at"
          - "emits StandardsAuditEvent SOURCE_DENIED"
          - "increments Story.version by 1"
        note: "Divergent branch: DENY performs no risk recomputation because the source never entered the approved pool."
      - from: APPROVED
        to: REVOKED
        trigger: "POST /standards-desk/anonymous-source-approvals/{id}/revoke"
        actor: StandardsEditor
        preconditions:
          - "approval.status == APPROVED"
        side_effects:
          - "stores revocation_reason"
          - "decrements Story.approved_anonymous_source_count and increments Story.revoked_anonymous_source_count"
          - "because the approved-source pool changed, Story.risk_index_estimate and risk_tier are recomputed, and Story.risk_index_actual is recomputed when the story is PUBLISHED"
          - "because a published story now carries a revoked source, Story.standards_status becomes UNDER_INQUIRY when it was CLEAN or CORRECTED"
          - "emits StandardsAuditEvent SOURCE_REVOKED"
          - "increments Story.version by 1"

  - entity: CorrectionRequest
    initial_state: INTAKE
    terminal_states: [RESOLVED, DISMISSED]
    transitions:
      - from: INTAKE
        to: INVESTIGATING
        trigger: "POST /standards-desk/correction-requests/{id}/start-investigation"
        actor: StandardsEditor
        preconditions:
          - "correction.status == INTAKE"
        side_effects:
          - "increments CorrectionRequest.version by 1"
      - from: INVESTIGATING
        to: AWAITING_SUBJECT
        trigger: "POST /standards-desk/correction-requests/{id}/subject-outreach"
        actor: PublicEditor
        preconditions:
          - "correction.status == INVESTIGATING"
        side_effects:
          - "increments CorrectionRequest.version by 1"
        note: "Optional branch; a request may be adjudicated directly from INVESTIGATING."
      - from: INVESTIGATING
        to: ADJUDICATED
        trigger: "POST /standards-desk/correction-requests/{id}/adjudicate with outcome_type != NO_ACTION"
        actor: StandardsEditor
        preconditions:
          - "correction.status IN {INVESTIGATING, AWAITING_SUBJECT}"
          - "X-User-ID != story.lead_journalist_id"
          - "notice_text is present"
        side_effects:
          - "computes adjudicated_severity_score, adjudicated_severity_band and placement"
          - "Story.standards_status becomes CORRECTED because outcome_type is not NO_ACTION, and because the adjudicated band is MAJOR or SEVERE Story.severe_correction_count is incremented"
          - "because Story.severe_correction_count changed, Newsroom.open_high_severity_count and standards_posture are recomputed"
          - "emits StandardsAuditEvent CORRECTION_ADJUDICATED"
      - from: AWAITING_SUBJECT
        to: ADJUDICATED
        trigger: "POST /standards-desk/correction-requests/{id}/adjudicate with outcome_type != NO_ACTION"
        actor: StandardsEditor
        preconditions:
          - "correction.status == AWAITING_SUBJECT"
        side_effects:
          - "identical to the INVESTIGATING -> ADJUDICATED edge"
      - from: INVESTIGATING
        to: DISMISSED
        trigger: "POST /standards-desk/correction-requests/{id}/adjudicate with outcome_type NO_ACTION"
        actor: StandardsEditor
        preconditions:
          - "correction.status IN {INVESTIGATING, AWAITING_SUBJECT}"
          - "X-User-ID != story.lead_journalist_id"
        side_effects:
          - "sets placement null and leaves notice_text null"
          - "decrements Story.open_correction_request_count; when it reaches 0 and Story.severe_correction_count == 0 the story returns to standards_status CLEAN"
        note: "Fork branch with a strictly smaller side-effect set than the ADJUDICATED branch: no notice, no severe counter, no posture cascade."
      - from: ADJUDICATED
        to: RESOLVED
        trigger: "POST /standards-desk/correction-requests/{id}/resolve"
        actor: StandardsEditor
        preconditions:
          - "correction.status == ADJUDICATED"
        side_effects:
          - "sets notice_published_at and resolved_at to the logical clock"
          - "because the request left ADJUDICATED, Newsroom.open_high_severity_count is recomputed and standards_posture may fall back to OPEN"
          - "emits StandardsAuditEvent CORRECTION_RESOLVED"

  - entity: MisconductInvestigation
    initial_state: OPENED
    terminal_states: [UNFOUNDED, OVERTURNED]
    transitions:
      - from: OPENED
        to: EVIDENCE_REVIEW
        trigger: "POST /standards-desk/misconduct-investigations/{id}/advance"
        actor: StandardsEditor
        preconditions:
          - "investigation.status == OPENED"
        side_effects:
          - "increments MisconductInvestigation.version by 1"
      - from: EVIDENCE_REVIEW
        to: RESPONSE_PENDING
        trigger: "POST /standards-desk/misconduct-investigations/{id}/advance"
        actor: StandardsEditor
        preconditions:
          - "investigation.status == EVIDENCE_REVIEW"
        side_effects:
          - "increments MisconductInvestigation.version by 1"
      - from: RESPONSE_PENDING
        to: SUSTAINED
        trigger: "POST /standards-desk/misconduct-investigations/{id}/decide with disposition SUSTAINED"
        actor: StandardsEditor
        preconditions:
          - "investigation.status == RESPONSE_PENDING"
          - "X-User-ID != investigation.journalist_id"
          - "X-User-ID != investigation.opened_by_user_id"
        side_effects:
          - "assigns penalty_points and prior_sustained_count per journalist_penalty_points, sets disclosure_obligation per misconduct_disclosure_obligation, stores decided_by_user_id and decided_at"
          - "because the finding is SUSTAINED, Journalist.penalty_points is recomputed as the sum over SUSTAINED investigations"
          - "because Journalist.penalty_points reached 12 or more, Journalist.employment_status becomes SUSPENDED"
          - "because the journalist became SUSPENDED, every OutsideActivityRequest of that journalist whose status is APPROVED becomes REVOKED with revocation_reason 'JOURNALIST_SUSPENDED', and every Story led by that journalist whose publication_status is IN_REVIEW returns to DRAFT with its non-terminal PrePublicationReview rows BLOCKED"
          - "because those reviews became BLOCKED, their SCHEDULED ReviewAssignment rows become CANCELLED and each Reviewer.reserved_minutes is recomputed"
          - "recomputes Newsroom.open_high_severity_count and standards_posture"
          - "emits StandardsAuditEvent INVESTIGATION_SUSTAINED plus one ACTIVITY_REVOKED event per revoked activity"
      - from: RESPONSE_PENDING
        to: UNFOUNDED
        trigger: "POST /standards-desk/misconduct-investigations/{id}/decide with disposition UNFOUNDED"
        actor: StandardsEditor
        preconditions:
          - "investigation.status == RESPONSE_PENDING"
          - "X-User-ID != investigation.journalist_id"
          - "X-User-ID != investigation.opened_by_user_id"
        side_effects:
          - "leaves penalty_points at 0 and disclosure_obligation at NONE"
          - "recomputes Newsroom.open_high_severity_count and standards_posture"
        note: "Divergent branch: no journalist ledger write, no suspension cascade, no audit event of type INVESTIGATION_SUSTAINED."
      - from: SUSTAINED
        to: OVERTURNED
        trigger: "POST /standards-desk/misconduct-investigations/{id}/appeal with appeal_outcome OVERTURNED"
        actor: ExecutiveEditor
        preconditions:
          - "investigation.status == SUSTAINED"
          - "X-User-ID != investigation.journalist_id"
          - "X-User-ID != investigation.decided_by_user_id"
        side_effects:
          - "sets appeal_outcome = OVERTURNED, resets MisconductInvestigation.penalty_points to 0 and disclosure_obligation to NONE"
          - "because the investigation left SUSTAINED, Journalist.penalty_points is recomputed as the sum over remaining SUSTAINED investigations"
          - "because Journalist.penalty_points fell below 12, Journalist.employment_status returns to ACTIVE"
          - "emits StandardsAuditEvent INVESTIGATION_OVERTURNED"
        note: "Compensating action for the SUSTAINED transition; journalist_points_conserved must hold exactly after the pair."
      - from: SUSTAINED
        to: SUSTAINED
        trigger: "POST /standards-desk/misconduct-investigations/{id}/appeal with appeal_outcome UPHELD"
        actor: ExecutiveEditor
        preconditions:
          - "investigation.status == SUSTAINED"
          - "X-User-ID != investigation.journalist_id"
          - "X-User-ID != investigation.decided_by_user_id"
        side_effects:
          - "sets appeal_outcome = UPHELD and leaves penalty_points, disclosure_obligation and Journalist.employment_status unchanged"

  - entity: Journalist
    state_dimension: employment_status
    initial_state: ACTIVE
    terminal_states: []
    transitions:
      - from: ACTIVE
        to: SUSPENDED
        trigger: "system cascade from a SUSTAINED misconduct decision"
        actor: system
        preconditions:
          - "Journalist.penalty_points >= 12 after recomputation"
        side_effects:
          - "revokes APPROVED OutsideActivityRequest rows, returns IN_REVIEW stories to DRAFT and BLOCKS their reviews"
          - "increments Journalist.version by 1"
      - from: SUSPENDED
        to: ACTIVE
        trigger: "system cascade from an OVERTURNED appeal"
        actor: system
        preconditions:
          - "Journalist.penalty_points < 12 after recomputation"
        side_effects:
          - "increments Journalist.version by 1"
        note: "Revoked activities and blocked reviews are NOT restored; only the points ledger and employment_status are conserved."

  - entity: ConflictDisclosure
    initial_state: SUBMITTED
    terminal_states: [ACKNOWLEDGED, RESTRICTION_IMPOSED, REJECTED]
    transitions:
      - from: SUBMITTED
        to: ACKNOWLEDGED
        trigger: "POST /standards-desk/conflict-disclosures/{id}/review with review_outcome ACKNOWLEDGE"
        actor: StandardsEditor
        preconditions:
          - "disclosure.status == SUBMITTED"
        side_effects:
          - "stores reviewed_by_user_id and reviewed_at, leaves restricted_beats empty"
      - from: SUBMITTED
        to: RESTRICTION_IMPOSED
        trigger: "POST /standards-desk/conflict-disclosures/{id}/review with review_outcome IMPOSE_RESTRICTION"
        actor: StandardsEditor
        preconditions:
          - "disclosure.status == SUBMITTED"
          - "restricted_beats is a non-empty array"
        side_effects:
          - "stores restricted_beats"
          - "because restricted_beats changed, Journalist.restricted_beats is recomputed as the union over RESTRICTION_IMPOSED disclosures"
      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /standards-desk/conflict-disclosures/{id}/review with review_outcome REJECT"
        actor: StandardsEditor
        preconditions:
          - "disclosure.status == SUBMITTED"
        side_effects:
          - "stores reviewed_by_user_id and reviewed_at with no restriction"

  - entity: OutsideActivityRequest
    initial_state: REQUESTED
    terminal_states: [DENIED, REVOKED]
    transitions:
      - from: REQUESTED
        to: APPROVED
        trigger: "POST /standards-desk/outside-activity-requests/{id}/decide with decision APPROVE"
        actor: StandardsEditor
        preconditions:
          - "activity.status == REQUESTED"
          - "the journalist has no ConflictDisclosure whose status is SUBMITTED"
          - "activity.related_beat is not a member of Journalist.restricted_beats"
          - "the half-open interval [starts_on, ends_on) does not overlap any APPROVED OutsideActivityRequest of the same journalist"
        side_effects:
          - "stores decided_by_user_id and decided_at"
      - from: REQUESTED
        to: DENIED
        trigger: "POST /standards-desk/outside-activity-requests/{id}/decide with decision DENY"
        actor: StandardsEditor
        preconditions:
          - "activity.status == REQUESTED"
        side_effects:
          - "stores decided_by_user_id and decided_at with no interval or disclosure checks"
      - from: APPROVED
        to: REVOKED
        trigger: "system cascade from a SUSTAINED misconduct decision that suspends the journalist"
        actor: system
        preconditions:
          - "activity.status == APPROVED"
          - "Journalist.employment_status transitioned ACTIVE -> SUSPENDED"
        side_effects:
          - "stores revocation_reason 'JOURNALIST_SUSPENDED'"
          - "emits StandardsAuditEvent ACTIVITY_REVOKED"

# ---------------------------------------------------------------------------
# §1.2.1 Concurrency Rules
# ---------------------------------------------------------------------------

concurrency_rules:
  - rule_id: prepub-review-create-stale-story
    parent_entity: Story
    write_endpoint: "POST /standards-desk/pre-publication-reviews"
    occ_field: "expected_story_version"
    description: |
      Submitting a PrePublicationReview against a Story whose version has advanced since the client
      last read it is rejected. A second review submission is legitimate product behaviour once the
      prior round was sent back (the new round supersedes it), so the rejection cannot be expressed as
      a state precondition; it is expressed as a stale-version check on Story.version, which every
      sourcing decision, correction intake and risk recomputation advances.
    error_id: ERR_STALE_STORY_VERSION
    http_status: 412
  - rule_id: review-assignment-create-stale-reviewer
    parent_entity: Reviewer
    write_endpoint: "POST /standards-desk/review-assignments"
    occ_field: "expected_reviewer_version"
    description: |
      Booking a ReviewAssignment against a Reviewer whose version has advanced since the client read
      the reviewer's remaining minutes is rejected. Two bookings for disjoint slots are both
      legitimate under the product semantics, so no state precondition covers the case; the writer's
      view of reserved_minutes and available_minutes is invalidated by the version bump that every
      booking, cancellation and cascade completion applies to the Reviewer.
    error_id: ERR_STALE_REVIEWER_VERSION
    http_status: 412

# ---------------------------------------------------------------------------
# §1.3 Calculation Rules Table
# ---------------------------------------------------------------------------

calculations:
  - name: story_risk_index
    trigger: "On Story creation; on every AnonymousSourceApproval decide/revoke transition; on PrePublicationReview submission and resubmit; on the publish transition; on every correction adjudication of the story"
    algorithm: weighted_scoring
    formula: |
      # ---- shared terms (both variants) -------------------------------------
      anon_severe   = count(AnonymousSourceApproval
                            WHERE story_id == story.id AND status == APPROVED
                              AND harm_risk == SEVERE)
      anon_elevated = count(AnonymousSourceApproval
                            WHERE story_id == story.id AND status == APPROVED
                              AND harm_risk == ELEVATED)
      base = 4 * min(anon_severe, SEVERE_SOURCE_CAP) + 2 * min(anon_elevated, ELEVATED_SOURCE_CAP)

      # ---- variant-specific terms ------------------------------------------
      # pre_publication_estimate:
      claim_load  = 3 * story.defamation_claim_count + 2 * story.privacy_subject_count
      doc_penalty = 5 if story.unverified_document_count > 0 else 0

      # post_publication_actual:
      severe_corrections = count(CorrectionRequest
                                 WHERE story_id == story.id
                                   AND status IN {ADJUDICATED, RESOLVED}
                                   AND adjudicated_severity_band IN {MAJOR, SEVERE})
      claim_load_actual  = claim_load + 6 * severe_corrections
      doc_penalty_actual = doc_penalty + 7 * story.revoked_anonymous_source_count

      # ---- evaluation order is pinned: subtotal first, then the multiplier,
      #      then the cap, then the rounding. -------------------------------
      subtotal = base + claim_load + doc_penalty              # or the _actual terms
      lead_points = Journalist.penalty_points WHERE id == story.lead_journalist_id
      multiplier = 1.25 if lead_points >= 6
                   else 1.10 if lead_points >= 3
                   else 1.00
      risk_index = round_half_up(min(subtotal * multiplier, RISK_CAP), 2)

      risk_tier = HIGH     if story.risk_index_estimate >= 40.00
                  else ELEVATED if story.risk_index_estimate >= 20.00
                  else STANDARD
    input_set: |
      Only AnonymousSourceApproval rows in status APPROVED enter `base`; REQUESTED, DENIED and REVOKED
      rows are excluded from `base` (REVOKED rows re-enter only through doc_penalty_actual). Only
      CorrectionRequest rows in status ADJUDICATED or RESOLVED with adjudicated_severity_band in
      {MAJOR, SEVERE} enter `severe_corrections`; INTAKE, INVESTIGATING, AWAITING_SUBJECT and DISMISSED
      rows are excluded. risk_tier is always banded from risk_index_estimate, never from
      risk_index_actual, so publishing a story can never change its tier.
    constants:
      SEVERE_SOURCE_CAP: 3
      ELEVATED_SOURCE_CAP: 5
      RISK_CAP: 100.00
      TIER_HIGH_AT: 40.00
      TIER_ELEVATED_AT: 20.00
    precision: "2 decimal places, round_half_up; the multiplier is applied to the integer subtotal before the cap and before rounding"
    variants:
      - name: pre_publication_estimate
        when: "Stored in Story.risk_index_estimate; recomputed on create, source decisions, review submission/resubmit and publish"
        difference: "Uses claim_load and doc_penalty only — the inventoried claim counts declared by the desk. Adjudicated corrections and revoked sources contribute nothing."
      - name: post_publication_actual
        when: "Stored in Story.risk_index_actual; first computed at the publish transition, recomputed on each later adjudication, source revocation and unpublish"
        difference: "Adds 6 points per MAJOR/SEVERE adjudicated correction and 7 points per revoked anonymous source, so identical declared inputs yield a strictly larger index once the story has been corrected."

  - name: correction_severity_score
    trigger: "On CorrectionRequest creation (provisional fields) and on the adjudicate transition (adjudicated fields)"
    algorithm: threshold
    formula: |
      # Evaluation order is pinned to break the apparent circularity between the
      # band and the surcharge: the band is derived from `raw` ONLY, the surcharge
      # from that band, and the band is NEVER recomputed from the final score.
      category_points = CATEGORY_WEIGHT[category]
      subject_bonus   = 4 if subject_flag else 0
      reach_points    = 6 if reach >= 100000
                        else 4 if reach >= 10000
                        else 2 if reach >= 1000
                        else 0
      raw   = category_points + subject_bonus + reach_points          # step 1
      band  = SEVERE if raw >= 16
              else MAJOR if raw >= 11
              else MINOR if raw >= 6
              else TRIVIAL                                            # step 2 (from raw)
      score = raw + PLACEMENT_SURCHARGE[band]                          # step 3
      # band is the step-2 value; a score that crosses a band edge does NOT re-band.

      placement = null           if outcome_type == NO_ACTION
                  INLINE         if outcome_type == UPDATE
                  END_OF_STORY   if outcome_type == CLARIFICATION
                  TOP_OF_STORY   if outcome_type == EDITORS_NOTE
                  TOP_OF_STORY   if outcome_type == CORRECTION and band IN {MAJOR, SEVERE}
                  END_OF_STORY   if outcome_type == CORRECTION and band IN {TRIVIAL, MINOR}
    input_set: |
      Both variants read exactly one CorrectionRequest row plus the constants below; no aggregation over
      siblings. `placement` is evaluated from the adjudicated band only and is null while the request is
      in INTAKE, INVESTIGATING or AWAITING_SUBJECT.
    constants:
      CATEGORY_WEIGHT: { FACTUAL: 6, QUOTE: 5, NUMERIC: 4, IDENTIFICATION: 8, CONTEXT: 3 }
      PLACEMENT_SURCHARGE: { TRIVIAL: 0, MINOR: 1, MAJOR: 2, SEVERE: 3 }
      BAND_SEVERE_AT: 16
      BAND_MAJOR_AT: 11
      BAND_MINOR_AT: 6
      REACH_TIER_3_AT: 100000
      REACH_TIER_2_AT: 10000
      REACH_TIER_1_AT: 1000
    precision: "integer arithmetic throughout; no rounding"
    variants:
      - name: intake_provisional
        when: "Runs once at CorrectionRequest creation; writes provisional_severity_score and provisional_severity_band"
        difference: "category = claimed_error_category, reach = reader_reported_reach, subject_flag = (submitter_type == SUBJECT) — the complainant's own account of the error."
      - name: adjudicated_final
        when: "Runs at the adjudicate transition; writes adjudicated_severity_score and adjudicated_severity_band"
        difference: "category = adjudicated_error_category, reach = verified_reach, subject_flag = the request's subject_named field — the desk's verified account. The same row therefore carries two bands that routinely disagree, and only the adjudicated band drives placement, the severe counter and the posture cascade."

  - name: correction_response_due_at
    trigger: "Once, at CorrectionRequest creation; never recomputed, so an adjudicated band change never moves the deadline"
    algorithm: threshold
    formula: |
      band_factor  = BAND_FACTOR[provisional_severity_band]
      submitter_bump_hours = SUBMITTER_BUMP[submitter_type]
      due_hours = max(ceil(newsroom.correction_response_sla_hours * band_factor)
                      + submitter_bump_hours,
                      MIN_DUE_HOURS)
      response_due_at = logical_clock_now + due_hours hours
      breach_flag = (logical_clock_now > response_due_at)
                    AND status IN {INTAKE, INVESTIGATING, AWAITING_SUBJECT}
    input_set: |
      Uses the provisional band from correction_severity_score / intake_provisional (never the
      adjudicated band), the owning Newsroom's correction_response_sla_hours at intake time, and the
      logical clock at intake. breach_flag is evaluated on read against the current logical clock and is
      false for every request in ADJUDICATED, RESOLVED or DISMISSED regardless of how late it is.
    constants:
      BAND_FACTOR: { TRIVIAL: 1.0, MINOR: 1.0, MAJOR: 0.5, SEVERE: 0.25 }
      SUBMITTER_BUMP: { SUBJECT: -12, READER: 0, INTERNAL: 24 }
      MIN_DUE_HOURS: 4
    precision: "whole hours; ceil is applied to the product BEFORE the submitter bump and before the MIN_DUE_HOURS floor"

  - name: desk_training_compliance_index
    trigger: "On Newsroom creation; on Journalist creation; on TrainingRecord creation; read back by GET /standards-desk/newsrooms/{id}/standards-summary"
    algorithm: aggregation
    formula: |
      required = newsroom.required_module_codes            # distinct codes, order irrelevant
      cohort   = [Journalist WHERE newsroom_id == newsroom.id]      # ordered by created_at ASC
      if len(cohort) == 0:
          training_compliance_index = 0.00                  # empty-cohort edge, no division
      else:
          # STEP 1 — round EACH journalist's ratio to 2 decimals first.
          for j in cohort:
              completed_j = count(DISTINCT module_code
                                  FROM TrainingRecord
                                  WHERE journalist_id == j.id
                                    AND module_code IN required)
              pct_j = round_half_up(completed_j / len(required), 2)
          # STEP 2 — average the ROUNDED ratios, scale, round again.
          training_compliance_index = round_half_up(
              (sum(pct_j for j in cohort) / len(cohort)) * 100, 2)
    input_set: |
      Every Journalist of the newsroom is in the cohort regardless of employment_status (SUSPENDED
      journalists still owe training). Only TrainingRecord rows whose module_code appears in
      required_module_codes count, and duplicates are impossible because module_code is unique per
      journalist. Cohort order is created_at ASC; the result is order-independent because summation is
      commutative, but the ordering is pinned so a future weighted variant stays deterministic.
    constants:
      ROUNDING_STEP_1_DECIMALS: 2
      ROUNDING_STEP_2_DECIMALS: 2
    precision: |
      Two-stage round_half_up and the ORDER IS NORMATIVE: round each journalist's completion ratio to 2
      decimals, THEN average, THEN multiply by 100 and round to 2 decimals. The alternative order (sum
      the unrounded ratios, then round once) yields a different value for the same data — with 3 required
      modules and completion counts {1, 1, 2} the pinned order gives 44.33 and the unrounded order gives
      44.44. Implementations MUST produce 44.33.

  - name: reviewer_minute_ledger
    trigger: "On ReviewAssignment creation, on cancel, and on every cascade that moves an assignment out of SCHEDULED (review cleared, changes requested, blocked, suspension cascade)"
    algorithm: aggregation
    formula: |
      duration_minutes = floor((ends_at - starts_at) / 60 seconds)     # ends_at > starts_at enforced
      reserved_minutes = sum(a.duration_minutes
                             FOR a IN ReviewAssignment
                             WHERE a.reviewer_id == reviewer.id AND a.status == SCHEDULED)
      available_minutes = reviewer.weekly_capacity_minutes - reserved_minutes

      # capacity admission check on create (boundary: equality is admissible)
      admissible = (reserved_minutes_before + new_duration_minutes)
                   <= reviewer.weekly_capacity_minutes

      # conserved quantity — must hold after EVERY mutation, cascade included
      INVARIANT reviewer_minutes_conserved:
          reserved_minutes + available_minutes == weekly_capacity_minutes
    input_set: |
      Only ReviewAssignment rows in status SCHEDULED occupy minutes; COMPLETED and CANCELLED rows
      contribute zero. Recomputation is a full re-aggregation over the reviewer's SCHEDULED rows, never
      an incremental delta, so a cascade that moves three assignments at once still lands on the exact
      sum.
    constants:
      SECONDS_PER_MINUTE: 60
    precision: "integer minutes; floor on the duration; available_minutes is never negative because the admission check rejects the over-booking first"

  - name: journalist_penalty_points
    trigger: "On the SUSTAINED decide transition and on the OVERTURN appeal transition"
    algorithm: chronological
    formula: |
      # Per-investigation points, assigned once at the SUSTAINED transition.
      prior_sustained_count = count(MisconductInvestigation
                                    WHERE journalist_id == this.journalist_id
                                      AND status == SUSTAINED
                                      AND decided_at < logical_clock_now)
                              # ties on decided_at are ordered by created_at ASC
      investigation.penalty_points = SEVERITY_POINTS[severity]
                                     + (FABRICATION_SURCHARGE if allegation_type == FABRICATION else 0)
                                     + (REPEAT_SURCHARGE if prior_sustained_count >= 1 else 0)

      # Journalist ledger — always a full re-aggregation, never a delta.
      Journalist.penalty_points = sum(i.penalty_points
                                      FOR i IN MisconductInvestigation
                                      WHERE i.journalist_id == journalist.id
                                        AND i.status == SUSTAINED)
      Journalist.employment_status = SUSPENDED if Journalist.penalty_points >= SUSPENSION_AT
                                     else ACTIVE

      # An OVERTURN resets that investigation's penalty_points to 0 and re-runs the
      # aggregation, so the pair (SUSTAIN, OVERTURN) is exactly compensating.
      INVARIANT journalist_points_conserved:
          Journalist.penalty_points == sum(penalty_points of SUSTAINED investigations of that journalist)
    input_set: |
      Only investigations in status SUSTAINED contribute; OPENED, EVIDENCE_REVIEW, RESPONSE_PENDING,
      UNFOUNDED and OVERTURNED rows contribute zero. prior_sustained_count is evaluated at decision
      time against decided_at strictly earlier than the current logical clock, ordered decided_at ASC
      with created_at ASC as the tie-break, so processing two decisions in the opposite order yields
      different per-investigation points for the same two allegations.
    constants:
      SEVERITY_POINTS: { MINOR: 2, SERIOUS: 5, EGREGIOUS: 9 }
      FABRICATION_SURCHARGE: 3
      REPEAT_SURCHARGE: 2
      SUSPENSION_AT: 12
    precision: "integer points; no rounding"

  - name: misconduct_disclosure_obligation
    trigger: "On the SUSTAINED decide transition (sets the value) and on the OVERTURN appeal transition (resets it to NONE)"
    algorithm: threshold
    formula: |
      disclosure_obligation =
          RETRACTION_REVIEW if status == SUSTAINED and allegation_type == FABRICATION
                                                   and severity == EGREGIOUS
          CORRECTION        if status == SUSTAINED and allegation_type == FABRICATION
                                                   and severity IN {MINOR, SERIOUS}
          EDITORS_NOTE      if status == SUSTAINED and allegation_type IN {PLAGIARISM, UNDISCLOSED_COI}
          NONE              otherwise
    input_set: "One MisconductInvestigation row; evaluated only in status SUSTAINED, NONE in every other status including OVERTURNED"
    constants: {}
    precision: "enum mapping, no arithmetic"

  - name: newsroom_standards_posture
    trigger: "On every correction adjudication and resolution, on every misconduct open/decide/appeal transition, and on Newsroom creation"
    algorithm: threshold
    formula: |
      high_severity_corrections = count(CorrectionRequest cr
                                        JOIN Story s ON cr.story_id == s.id
                                        WHERE s.newsroom_id == newsroom.id
                                          AND cr.status == ADJUDICATED
                                          AND cr.adjudicated_severity_band IN {MAJOR, SEVERE})
      open_investigations = count(MisconductInvestigation i
                                  JOIN Journalist j ON i.journalist_id == j.id
                                  WHERE j.newsroom_id == newsroom.id
                                    AND i.status IN {OPENED, EVIDENCE_REVIEW, RESPONSE_PENDING}
                                    AND i.severity IN {SERIOUS, EGREGIOUS})
      open_high_severity_count = high_severity_corrections + open_investigations

      standards_posture = LOCKDOWN   if open_high_severity_count >= 2 * newsroom.high_severity_open_threshold
                          HEIGHTENED if open_high_severity_count >= newsroom.high_severity_open_threshold
                          OPEN       otherwise
    input_set: |
      Corrections count only while ADJUDICATED — a RESOLVED request has been published and leaves the
      pool, which is what lets the posture fall back. Investigations count only while OPENED,
      EVIDENCE_REVIEW or RESPONSE_PENDING and only at severity SERIOUS or EGREGIOUS; MINOR allegations
      never move the posture. Comparisons are `>=`, so a count exactly equal to the threshold is already
      HEIGHTENED and a count exactly equal to twice the threshold is already LOCKDOWN.
    constants:
      LOCKDOWN_MULTIPLIER: 2
    precision: "integer counts; enum output"

# ---------------------------------------------------------------------------
# §1.4 Validation Rules Table (ordered by priority — lowest number wins)
# ---------------------------------------------------------------------------

validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers are both present and X-User-Role is one of the five declared roles"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all
  - priority: 2
    category: auth
    check: "Identity binding for entity_backed roles: for Reporter / StandardsEditor / ExecutiveEditor the X-User-ID must be an existing Journalist whose role_title is REPORTER / STANDARDS_EDITOR / EXECUTIVE_EDITOR respectively; for LegalCounsel it must be an existing Reviewer whose discipline is LEGAL. Bootstrap exemption: this check is skipped for POST /standards-desk/newsrooms and POST /standards-desk/journalists, the two endpoints that must run before any Journalist exists."
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: "all except POST /standards-desk/newsrooms and POST /standards-desk/journalists"
  - priority: 3
    category: auth
    check: "X-User-Role appears in the endpoint's declared roles list"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: all
  - priority: 4
    category: auth
    check: "Ownership for Reporter-scoped writes: X-User-ID must equal the journalist the resource belongs to — story.lead_journalist_id for pre-publication-review submit/resubmit and anonymous-source-approval create, the body lead_journalist_id for story creation, and the body journalist_id for conflict-disclosure, outside-activity-request and training-record creation"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: "POST /standards-desk/stories, POST /standards-desk/anonymous-source-approvals, POST /standards-desk/pre-publication-reviews, POST /standards-desk/pre-publication-reviews/{id}/resubmit, POST /standards-desk/conflict-disclosures, POST /standards-desk/outside-activity-requests, POST /standards-desk/training-records"
  - priority: 5
    category: auth
    check: "Segregation of duties: the acting X-User-ID must not equal story.lead_journalist_id when deciding an anonymous source or adjudicating a correction on that story; must not equal investigation.journalist_id nor investigation.opened_by_user_id when deciding a misconduct investigation; must not equal investigation.journalist_id nor investigation.decided_by_user_id when hearing its appeal"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /standards-desk/anonymous-source-approvals/{id}/decide, POST /standards-desk/correction-requests/{id}/adjudicate, POST /standards-desk/misconduct-investigations/{id}/decide, POST /standards-desk/misconduct-investigations/{id}/appeal"
  - priority: 6
    category: existence
    check: "Every id in the path resolves, validated left to right"
    error_id: "ERR_NEWSROOM_NOT_FOUND | ERR_JOURNALIST_NOT_FOUND | ERR_STORY_NOT_FOUND | ERR_SOURCE_APPROVAL_NOT_FOUND | ERR_REVIEW_NOT_FOUND | ERR_ASSIGNMENT_NOT_FOUND | ERR_CORRECTION_REQUEST_NOT_FOUND | ERR_INVESTIGATION_NOT_FOUND | ERR_DISCLOSURE_NOT_FOUND | ERR_ACTIVITY_REQUEST_NOT_FOUND"
    http_status: 404
    applies_to: all
  - priority: 7
    category: existence
    check: "Every id supplied in the request body resolves: newsroom_id, lead_journalist_id, journalist_id, story_id, review_id, reviewer_id"
    error_id: "ERR_NEWSROOM_NOT_FOUND | ERR_JOURNALIST_NOT_FOUND | ERR_STORY_NOT_FOUND | ERR_REVIEW_NOT_FOUND | ERR_REVIEWER_NOT_FOUND"
    http_status: 404
    applies_to: "all writes carrying body ids"
  - priority: 8
    category: business_constraint
    check: "Body shape: required fields present, enum members recognized, integers within their declared ranges, strings within their declared lengths, arrays non-empty where required, unknown fields rejected"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all writes"
  - priority: 9
    category: business_temporal
    check: "Interval sanity: ends_at strictly after starts_at on a review assignment, ends_on strictly after starts_on on an outside activity request, and to_iso8601 parseable as ISO 8601 UTC on the clock endpoint"
    error_id: ERR_INVALID_INTERVAL
    http_status: 400
    applies_to: "POST /standards-desk/review-assignments, POST /standards-desk/outside-activity-requests, POST /standards-desk/_clock/set_current_utc"
  - priority: 10
    category: state
    check: "Optimistic concurrency: expected_story_version equals Story.version on review submission; expected_reviewer_version equals Reviewer.version on assignment creation"
    error_id: "ERR_STALE_STORY_VERSION | ERR_STALE_REVIEWER_VERSION"
    http_status: 412
    applies_to: "POST /standards-desk/pre-publication-reviews, POST /standards-desk/review-assignments"
  - priority: 11
    category: state
    check: "The target resource is in a state from which this trigger has a declared transition in §1.2 (covers source revoke from a non-APPROVED row, resubmit from a non-CHANGES_REQUESTED review or at review_round 3, start-investigation from a non-INTAKE request, subject-outreach from a non-INVESTIGATING request, resolve from a non-ADJUDICATED request, advance from a decided investigation, disclosure review from a non-SUBMITTED disclosure, activity decide from a non-REQUESTED request, assignment cancel from a non-SCHEDULED slot, and story create against a story whose lead journalist is SUSPENDED)"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all action endpoints without a more specific state error"
  - priority: 12
    category: state
    check: "Publish requires story.publication_status == CLEARED"
    error_id: ERR_STORY_NOT_CLEARED
    http_status: 409
    applies_to: "POST /standards-desk/stories/{id}/publish"
  - priority: 13
    category: state
    check: "Unpublish requires story.publication_status == PUBLISHED"
    error_id: ERR_STORY_NOT_PUBLISHED
    http_status: 409
    applies_to: "POST /standards-desk/stories/{id}/unpublish"
  - priority: 14
    category: state
    check: "A verdict may only be recorded while the review round is open: status must be SUBMITTED for a legal verdict and SUBMITTED or LEGAL_CLEARED for a standards verdict; CLEARED, BLOCKED, CHANGES_REQUESTED and STANDARDS_CLEARED rounds are closed"
    error_id: ERR_REVIEW_ROUND_NOT_OPEN
    http_status: 409
    applies_to: "POST /standards-desk/pre-publication-reviews/{id}/legal-verdict, POST /standards-desk/pre-publication-reviews/{id}/standards-verdict"
  - priority: 15
    category: state
    check: "Conditional gate: when review.requires_legal_review is true, a standards verdict may only be recorded from LEGAL_CLEARED — the legal verdict PASS must already be on the record"
    error_id: ERR_LEGAL_VERDICT_REQUIRED
    http_status: 409
    applies_to: "POST /standards-desk/pre-publication-reviews/{id}/standards-verdict"
  - priority: 16
    category: state
    check: "An anonymous source decision requires status REQUESTED"
    error_id: ERR_SOURCE_ALREADY_DECIDED
    http_status: 409
    applies_to: "POST /standards-desk/anonymous-source-approvals/{id}/decide"
  - priority: 17
    category: state
    check: "Adjudication requires correction.status IN {INVESTIGATING, AWAITING_SUBJECT}"
    error_id: ERR_CORRECTION_NOT_INVESTIGATED
    http_status: 409
    applies_to: "POST /standards-desk/correction-requests/{id}/adjudicate"
  - priority: 18
    category: state
    check: "An appeal requires investigation.status == SUSTAINED"
    error_id: ERR_APPEAL_NOT_ALLOWED
    http_status: 409
    applies_to: "POST /standards-desk/misconduct-investigations/{id}/appeal"
  - priority: 19
    category: business_safety
    check: "Newsroom.standards_posture must not be LOCKDOWN when clearing a review or publishing a story"
    error_id: ERR_POSTURE_LOCKDOWN
    http_status: 409
    applies_to: "POST /standards-desk/pre-publication-reviews/{id}/clear, POST /standards-desk/stories/{id}/publish"
  - priority: 20
    category: business_safety
    check: "Under HEIGHTENED posture only ExecutiveEditor may clear a review; a StandardsEditor clearance is refused"
    error_id: ERR_HEIGHTENED_REQUIRES_EXEC
    http_status: 403
    applies_to: "POST /standards-desk/pre-publication-reviews/{id}/clear"
  - priority: 21
    category: business_safety
    check: "Approving an anonymous source requires documentation_complete == true (identity_known_to_editor true AND justification_text at least 20 characters)"
    error_id: ERR_INSUFFICIENT_SOURCE_DOCUMENTATION
    http_status: 422
    applies_to: "POST /standards-desk/anonymous-source-approvals/{id}/decide with decision APPROVE"
  - priority: 22
    category: business_safety
    check: "Approving a SEVERE harm_risk anonymous source requires corroboration_count >= 2"
    error_id: ERR_INSUFFICIENT_CORROBORATION
    http_status: 422
    applies_to: "POST /standards-desk/anonymous-source-approvals/{id}/decide with decision APPROVE"
  - priority: 23
    category: business_safety
    check: "Conditional gate: publishing a story whose risk_tier is HIGH requires Journalist.training_current == true for the lead journalist; STANDARD and ELEVATED stories are exempt"
    error_id: ERR_TRAINING_NOT_CURRENT
    http_status: 422
    applies_to: "POST /standards-desk/stories/{id}/publish"
  - priority: 24
    category: business_referential
    check: "No AnonymousSourceApproval of the story may be in status REQUESTED or REVOKED at publication"
    error_id: ERR_SOURCE_NOT_APPROVED
    http_status: 422
    applies_to: "POST /standards-desk/stories/{id}/publish"
  - priority: 25
    category: business_referential
    check: "The story's lead journalist must have employment_status ACTIVE when submitting a review, resubmitting or publishing"
    error_id: ERR_JOURNALIST_SUSPENDED
    http_status: 409
    applies_to: "POST /standards-desk/stories, POST /standards-desk/pre-publication-reviews, POST /standards-desk/pre-publication-reviews/{id}/resubmit, POST /standards-desk/stories/{id}/publish"
  - priority: 26
    category: business_referential
    check: "Cross-newsroom references are refused: Story.lead_journalist_id must belong to Story.newsroom_id, and a ReviewAssignment's Reviewer must belong to the newsroom of the review's story"
    error_id: ERR_CROSS_NEWSROOM_REFERENCE
    http_status: 422
    applies_to: "POST /standards-desk/stories, POST /standards-desk/review-assignments"
  - priority: 27
    category: business_referential
    check: "The reviewer's discipline must match the stage the review is waiting on: LEGAL when review.status == SUBMITTED and requires_legal_review is true, otherwise STANDARDS"
    error_id: ERR_REVIEWER_DISCIPLINE_MISMATCH
    http_status: 422
    applies_to: "POST /standards-desk/review-assignments"
  - priority: 28
    category: business_referential
    check: "Approving an outside activity requires that the journalist has no ConflictDisclosure in status SUBMITTED"
    error_id: ERR_COI_DISCLOSURE_PENDING
    http_status: 422
    applies_to: "POST /standards-desk/outside-activity-requests/{id}/decide with decision APPROVE"
  - priority: 29
    category: business_referential
    check: "The activity's related_beat must not be a member of Journalist.restricted_beats"
    error_id: ERR_ACTIVITY_BEAT_RESTRICTED
    http_status: 422
    applies_to: "POST /standards-desk/outside-activity-requests/{id}/decide with decision APPROVE"
  - priority: 30
    category: business_referential
    check: "Unpublishing requires a documented basis: at least one MisconductInvestigation with status SUSTAINED whose story_id is this story, OR story.severe_correction_count >= 1"
    error_id: ERR_UNPUBLISH_NOT_JUSTIFIED
    http_status: 422
    applies_to: "POST /standards-desk/stories/{id}/unpublish"
  - priority: 31
    category: business_referential
    check: "notice_text is required when outcome_type is CORRECTION, CLARIFICATION, UPDATE or EDITORS_NOTE, and must be absent for NO_ACTION"
    error_id: ERR_NOTICE_TEXT_REQUIRED
    http_status: 422
    applies_to: "POST /standards-desk/correction-requests/{id}/adjudicate"
  - priority: 32
    category: business_temporal
    check: "Half-open interval overlap on the journalist: the requested [starts_on, ends_on) must not overlap any APPROVED OutsideActivityRequest of the same journalist. Overlap iff new.starts_on < other.ends_on AND other.starts_on < new.ends_on, so touching endpoints (new.starts_on == other.ends_on) are admissible."
    error_id: ERR_OUTSIDE_ACTIVITY_OVERLAP
    http_status: 409
    applies_to: "POST /standards-desk/outside-activity-requests/{id}/decide with decision APPROVE"
  - priority: 33
    category: business_temporal
    check: "Closed interval plus buffer on the reviewer: the requested [starts_at, ends_at] must not collide with any SCHEDULED ReviewAssignment of the same reviewer once a 30-minute buffer is applied to both sides. Collision iff new.starts_at < other.ends_at + 30min AND other.starts_at < new.ends_at + 30min, so a slot beginning exactly 30 minutes after another ends is admissible while 29 minutes is refused."
    error_id: ERR_REVIEWER_SLOT_CONFLICT
    http_status: 409
    applies_to: "POST /standards-desk/review-assignments"
  - priority: 34
    category: business_constraint
    check: "Scoped uniqueness: a journalist may file at most one TrainingRecord per module_code, and a story may carry at most one AnonymousSourceApproval per source_alias"
    error_id: "ERR_DUPLICATE_TRAINING_MODULE | ERR_DUPLICATE_SOURCE_ALIAS"
    http_status: 409
    applies_to: "POST /standards-desk/training-records, POST /standards-desk/anonymous-source-approvals"
  - priority: 35
    category: business_fiscal
    check: "Reviewer capacity: reserved_minutes + the new slot's duration_minutes must be <= weekly_capacity_minutes; equality is admissible"
    error_id: ERR_REVIEWER_CAPACITY_EXCEEDED
    http_status: 422
    applies_to: "POST /standards-desk/review-assignments"

# ---------------------------------------------------------------------------
# §1.5 API Endpoint Table
# ---------------------------------------------------------------------------

endpoints:
  # --- Newsroom / people setup -------------------------------------------
  - method: POST
    path: "/standards-desk/newsrooms"
    description: "Register a newsroom standards desk. Bootstrap endpoint: exempt from the identity-binding validation at priority 2 because no Journalist exists yet."
    roles: [ExecutiveEditor]
    code: 201
    input: [name, "correction_response_sla_hours?", "high_severity_open_threshold?", "required_module_codes?"]
    output: Newsroom
    side_effects:
      - "initializes standards_posture to OPEN, open_high_severity_count to 0 and training_compliance_index to 0.00 per newsroom_standards_posture and desk_training_compliance_index"
  - method: POST
    path: "/standards-desk/journalists"
    description: "Add a journalist to a newsroom. Bootstrap endpoint: exempt from the identity-binding validation at priority 2 so the first EXECUTIVE_EDITOR can be created."
    roles: [ExecutiveEditor]
    code: 201
    input: [newsroom_id, full_name, email, role_title]
    output: Journalist
    side_effects:
      - "initializes employment_status to ACTIVE, penalty_points to 0, completed_required_module_count to 0, training_current to false and restricted_beats to []"
      - "recomputes Newsroom.training_compliance_index via desk_training_compliance_index"
  - method: POST
    path: "/standards-desk/reviewers"
    description: "Register a legal or standards reviewer with a weekly review-minute capacity."
    roles: [ExecutiveEditor]
    code: 201
    input: [newsroom_id, full_name, discipline, weekly_capacity_minutes]
    output: Reviewer
    side_effects:
      - "initializes reserved_minutes to 0 and available_minutes to weekly_capacity_minutes per reviewer_minute_ledger"
  # --- Stories ------------------------------------------------------------
  - method: POST
    path: "/standards-desk/stories"
    description: "Open a story file owned by the acting reporter."
    roles: [Reporter]
    code: 201
    input: [newsroom_id, lead_journalist_id, headline, "defamation_claim_count?", "privacy_subject_count?", "unverified_document_count?"]
    output: Story
    side_effects:
      - "initializes publication_status to DRAFT and standards_status to CLEAN"
      - "computes risk_index_estimate, risk_index_actual and risk_tier via story_risk_index"
  - method: POST
    path: "/standards-desk/stories/{id}/publish"
    description: "Publish a cleared story."
    roles: [ExecutiveEditor]
    code: 200
    input: []
    output: Story
    side_effects:
      - "transitions publication_status CLEARED -> PUBLISHED and stamps published_at from the logical clock"
      - "increments Story.version by 1"
      - "appends a StandardsAuditEvent with event_type STORY_PUBLISHED"
  - method: POST
    path: "/standards-desk/stories/{id}/unpublish"
    description: "Remove a published story from the site and attach the mandatory editor's note."
    roles: [ExecutiveEditor]
    code: 200
    input: [removal_reason, editors_note_text]
    output: Story
    side_effects:
      - "transitions publication_status PUBLISHED -> UNPUBLISHED, standards_status -> RETRACTED, stamps unpublished_at and stores editors_note_text"
      - "increments Story.version by 1"
      - "appends a StandardsAuditEvent with event_type STORY_UNPUBLISHED"
  # --- Anonymous sources --------------------------------------------------
  - method: POST
    path: "/standards-desk/anonymous-source-approvals"
    description: "Request approval to use an anonymous source on a story."
    roles: [Reporter]
    code: 201
    input: [story_id, source_alias, source_category, harm_risk, identity_known_to_editor, corroboration_count, justification_text]
    output: AnonymousSourceApproval
    side_effects:
      - "initializes status to REQUESTED and computes documentation_complete"
  - method: POST
    path: "/standards-desk/anonymous-source-approvals/{id}/decide"
    description: "Approve or deny an anonymous-source request. Segregation of duties: the deciding editor must not be the story's lead journalist."
    roles: [StandardsEditor, ExecutiveEditor]
    code: 200
    input: [decision, "decision_note?"]
    output: AnonymousSourceApproval
    side_effects:
      - "transitions status REQUESTED -> APPROVED or DENIED and stamps decided_by_user_id and decided_at"
      - "on APPROVE increments Story.approved_anonymous_source_count and recomputes Story.risk_index_estimate, risk_index_actual and risk_tier"
      - "increments Story.version by 1"
      - "appends a StandardsAuditEvent with event_type SOURCE_APPROVED on APPROVE or SOURCE_DENIED on DENY"
  - method: POST
    path: "/standards-desk/anonymous-source-approvals/{id}/revoke"
    description: "Revoke an approved anonymous source after the fact."
    roles: [StandardsEditor, ExecutiveEditor]
    code: 200
    input: [revocation_reason]
    output: AnonymousSourceApproval
    side_effects:
      - "transitions status APPROVED -> REVOKED, stores revocation_reason and appends a StandardsAuditEvent with event_type SOURCE_REVOKED"
      - "decrements Story.approved_anonymous_source_count, increments Story.revoked_anonymous_source_count and recomputes risk_index_actual"
      - "increments Story.version by 1"
  # --- Pre-publication review --------------------------------------------
  - method: POST
    path: "/standards-desk/pre-publication-reviews"
    description: "Submit a story for pre-publication legal and standards review. Carries the optimistic-concurrency token the client last observed on the story."
    roles: [Reporter]
    code: 201
    input: [story_id, expected_story_version, "high_risk_declared?", "submission_note?"]
    output: PrePublicationReview
    side_effects:
      - "initializes status to SUBMITTED at review_round 1 and computes requires_legal_review"
      - "transitions Story.publication_status DRAFT -> IN_REVIEW"
      - "increments Story.version by 1"
  - method: POST
    path: "/standards-desk/pre-publication-reviews/{id}/legal-verdict"
    description: "Record the legal verdict with the defamation and privacy analysis for the open round."
    roles: [LegalCounsel]
    code: 200
    input: [legal_verdict, defamation_findings, privacy_findings, "findings_note?"]
    output: PrePublicationReview
    side_effects:
      - "on PASS transitions status SUBMITTED -> LEGAL_CLEARED; on BLOCK transitions SUBMITTED -> BLOCKED and Story.publication_status IN_REVIEW -> DRAFT; on CHANGES_REQUIRED transitions SUBMITTED -> CHANGES_REQUESTED and Story.publication_status IN_REVIEW -> DRAFT"
      - "stores legal_verdict, defamation_findings and privacy_findings"
  - method: POST
    path: "/standards-desk/pre-publication-reviews/{id}/standards-verdict"
    description: "Record the standards verdict for the open round. Requires the legal verdict first when the round requires legal review."
    roles: [StandardsEditor, ExecutiveEditor]
    code: 200
    input: [standards_verdict, "findings_note?"]
    output: PrePublicationReview
    side_effects:
      - "on PASS transitions status to STANDARDS_CLEARED; on CHANGES_REQUIRED transitions to CHANGES_REQUESTED and Story.publication_status IN_REVIEW -> DRAFT"
      - "stores standards_verdict"
  - method: POST
    path: "/standards-desk/pre-publication-reviews/{id}/clear"
    description: "Close the review round and clear the story for publication. Refused under LOCKDOWN posture; under HEIGHTENED posture only ExecutiveEditor may clear."
    roles: [StandardsEditor, ExecutiveEditor]
    code: 200
    input: []
    output: PrePublicationReview
    side_effects:
      - "transitions status STANDARDS_CLEARED -> CLEARED and stamps cleared_at"
      - "transitions Story.publication_status IN_REVIEW -> CLEARED and increments Story.version by 1"
      - "completes every SCHEDULED ReviewAssignment of the review and releases the reviewer minutes per reviewer_minute_ledger"
      - "appends a StandardsAuditEvent with event_type REVIEW_CLEARED"
  - method: POST
    path: "/standards-desk/pre-publication-reviews/{id}/resubmit"
    description: "Resubmit a revised story for a further review round; bounded at review_round 3."
    roles: [Reporter]
    code: 200
    input: ["revision_note?"]
    output: PrePublicationReview
    side_effects:
      - "transitions status CHANGES_REQUESTED -> SUBMITTED, increments review_round by 1 and clears legal_verdict and standards_verdict"
      - "transitions Story.publication_status DRAFT -> IN_REVIEW and increments Story.version by 1"
  # --- Review assignments (reviewer minute ledger) ------------------------
  - method: POST
    path: "/standards-desk/review-assignments"
    description: "Book a reviewer slot against an open review round. Carries the optimistic-concurrency token the client last observed on the reviewer."
    roles: [LegalCounsel, StandardsEditor]
    code: 201
    input: [review_id, reviewer_id, starts_at, ends_at, expected_reviewer_version]
    output: ReviewAssignment
    side_effects:
      - "initializes status to SCHEDULED and computes duration_minutes"
      - "increases Reviewer.reserved_minutes and decreases Reviewer.available_minutes per reviewer_minute_ledger"
      - "increments Reviewer.version by 1"
  - method: POST
    path: "/standards-desk/review-assignments/{id}/cancel"
    description: "Release a scheduled reviewer slot."
    roles: [LegalCounsel, StandardsEditor, ExecutiveEditor]
    code: 200
    input: [cancellation_reason]
    output: ReviewAssignment
    side_effects:
      - "transitions status SCHEDULED -> CANCELLED and stores cancellation_reason"
      - "returns duration_minutes to Reviewer.available_minutes and removes them from reserved_minutes per reviewer_minute_ledger"
      - "increments Reviewer.version by 1"
  # --- Corrections --------------------------------------------------------
  - method: POST
    path: "/standards-desk/correction-requests"
    description: "Log a correction request received from a reader, a story subject or an internal desk review."
    roles: [PublicEditor, StandardsEditor]
    code: 201
    input: [story_id, submitter_type, submitter_email, claim_text, claimed_error_category, reader_reported_reach, subject_named]
    output: CorrectionRequest
    side_effects:
      - "initializes status to INTAKE"
      - "computes provisional_severity_score and provisional_severity_band via correction_severity_score variant intake_provisional"
      - "computes response_due_at and breach_flag via correction_response_due_at"
      - "sets Story.standards_status to UNDER_INQUIRY from CLEAN or CORRECTED, increments Story.open_correction_request_count and increments Story.version by 1"
  - method: POST
    path: "/standards-desk/correction-requests/{id}/start-investigation"
    description: "Open the investigation into a logged correction request."
    roles: [PublicEditor, StandardsEditor]
    code: 200
    input: ["assigned_note?"]
    output: CorrectionRequest
    side_effects:
      - "transitions status INTAKE -> INVESTIGATING and increments CorrectionRequest.version by 1"
  - method: POST
    path: "/standards-desk/correction-requests/{id}/subject-outreach"
    description: "Record the outreach to the story subject and pause for their response."
    roles: [PublicEditor]
    code: 200
    input: [outreach_channel, "outreach_note?"]
    output: CorrectionRequest
    side_effects:
      - "transitions status INVESTIGATING -> AWAITING_SUBJECT"
  - method: POST
    path: "/standards-desk/correction-requests/{id}/adjudicate"
    description: "Decide the correction: the adjudicated category, verified reach, outcome type and notice placement. Segregation of duties: the adjudicator must not be the story's lead journalist."
    roles: [StandardsEditor, ExecutiveEditor]
    code: 200
    input: [outcome_type, adjudicated_error_category, verified_reach, "notice_text?"]
    output: CorrectionRequest
    side_effects:
      - "transitions status to ADJUDICATED, or to DISMISSED when outcome_type is NO_ACTION"
      - "computes adjudicated_severity_score, adjudicated_severity_band and placement via correction_severity_score variant adjudicated_final"
      - "on adjudicated_severity_band MAJOR or SEVERE increments Story.severe_correction_count and recomputes Story.risk_index_actual"
      - "sets Story.standards_status to CORRECTED, or back to CLEAN when outcome_type is NO_ACTION, and increments Story.version by 1"
      - "recomputes Newsroom.open_high_severity_count and standards_posture via newsroom_standards_posture"
      - "appends a StandardsAuditEvent with event_type CORRECTION_ADJUDICATED"
  - method: POST
    path: "/standards-desk/correction-requests/{id}/resolve"
    description: "Publish the notice and close out the adjudicated correction."
    roles: [PublicEditor, StandardsEditor, ExecutiveEditor]
    code: 200
    input: ["resolution_note?"]
    output: CorrectionRequest
    side_effects:
      - "transitions status ADJUDICATED -> RESOLVED and stamps notice_published_at and resolved_at from the logical clock"
      - "decrements Story.open_correction_request_count, recomputes Newsroom.open_high_severity_count and standards_posture, increments Story.version by 1 and appends a StandardsAuditEvent with event_type CORRECTION_RESOLVED"
  # --- Misconduct investigations ------------------------------------------
  - method: POST
    path: "/standards-desk/misconduct-investigations"
    description: "Open a plagiarism, fabrication or undisclosed-conflict investigation into a journalist."
    roles: [StandardsEditor, ExecutiveEditor]
    code: 201
    input: [journalist_id, allegation_type, severity, allegation_summary, "story_id?"]
    output: MisconductInvestigation
    side_effects:
      - "initializes status to OPENED, penalty_points to 0 and disclosure_obligation to NONE, snapshots prior_sustained_count and stamps opened_by_user_id and opened_at"
      - "recomputes Newsroom.open_high_severity_count and standards_posture via newsroom_standards_posture"
  - method: POST
    path: "/standards-desk/misconduct-investigations/{id}/advance"
    description: "Move the investigation to the next pre-decision stage."
    roles: [StandardsEditor, ExecutiveEditor]
    code: 200
    input: ["advance_note?"]
    output: MisconductInvestigation
    side_effects:
      - "transitions status OPENED -> EVIDENCE_REVIEW -> RESPONSE_PENDING"
  - method: POST
    path: "/standards-desk/misconduct-investigations/{id}/decide"
    description: "Sustain or dismiss the allegation. Segregation of duties: the decider must be neither the subject journalist nor the editor who opened the case."
    roles: [StandardsEditor, ExecutiveEditor]
    code: 200
    input: [disposition, "decision_note?"]
    output: MisconductInvestigation
    side_effects:
      - "transitions status RESPONSE_PENDING -> SUSTAINED or UNFOUNDED and stamps decided_by_user_id and decided_at"
      - "on disposition SUSTAINED computes penalty_points via journalist_penalty_points, adds them to Journalist.penalty_points and sets disclosure_obligation via misconduct_disclosure_obligation"
      - "on reaching the suspension threshold sets Journalist.employment_status to SUSPENDED, reverts that journalist's IN_REVIEW stories to DRAFT, blocks their open reviews, cancels the blocked reviews' SCHEDULED assignments with reviewer-minute release, and revokes their APPROVED outside-activity requests"
      - "recomputes Newsroom.open_high_severity_count and standards_posture via newsroom_standards_posture"
      - "on SUSTAIN appends a StandardsAuditEvent with event_type INVESTIGATION_SUSTAINED, plus one ACTIVITY_REVOKED event per revoked outside activity"
  - method: POST
    path: "/standards-desk/misconduct-investigations/{id}/appeal"
    description: "Hear the journalist's appeal against a sustained finding. Segregation of duties: the appeal hearer must be neither the subject journalist nor the editor who decided the case."
    roles: [ExecutiveEditor]
    code: 200
    input: [appeal_outcome, "appeal_note?"]
    output: MisconductInvestigation
    side_effects:
      - "on OVERTURNED transitions status SUSTAINED -> OVERTURNED, reverses the case's penalty_points from Journalist.penalty_points and resets disclosure_obligation to NONE"
      - "on UPHELD leaves status SUSTAINED and penalty_points unchanged"
      - "on dropping below the suspension threshold restores Journalist.employment_status to ACTIVE"
      - "recomputes Newsroom.open_high_severity_count and standards_posture via newsroom_standards_posture"
  # --- Conflicts of interest and outside activity -------------------------
  - method: POST
    path: "/standards-desk/conflict-disclosures"
    description: "File a conflict-of-interest disclosure."
    roles: [Reporter]
    code: 201
    input: [journalist_id, disclosure_type, subject_entity_name, description]
    output: ConflictDisclosure
    side_effects:
      - "initializes status to SUBMITTED and restricted_beats to []"
  - method: POST
    path: "/standards-desk/conflict-disclosures/{id}/review"
    description: "Acknowledge, restrict or reject a filed disclosure."
    roles: [StandardsEditor, ExecutiveEditor]
    code: 200
    input: [review_outcome, "restricted_beats?"]
    output: ConflictDisclosure
    side_effects:
      - "transitions status SUBMITTED -> ACKNOWLEDGED, RESTRICTION_IMPOSED or REJECTED and stamps reviewed_by_user_id and reviewed_at"
      - "on RESTRICT stores restricted_beats and unions them into Journalist.restricted_beats"
  - method: POST
    path: "/standards-desk/outside-activity-requests"
    description: "Request approval for a speaking engagement, book, consulting arrangement or board seat."
    roles: [Reporter]
    code: 201
    input: [journalist_id, activity_type, compensated, starts_on, ends_on, related_beat, host_organization]
    output: OutsideActivityRequest
    side_effects:
      - "initializes status to REQUESTED"
  - method: POST
    path: "/standards-desk/outside-activity-requests/{id}/decide"
    description: "Approve or deny an outside-activity request."
    roles: [StandardsEditor, ExecutiveEditor]
    code: 200
    input: [decision, "decision_note?"]
    output: OutsideActivityRequest
    side_effects:
      - "transitions status REQUESTED -> APPROVED or DENIED and stamps decided_by_user_id and decided_at"
  # --- Standards training -------------------------------------------------
  - method: POST
    path: "/standards-desk/training-records"
    description: "File a completed standards training module with its case-study review reference."
    roles: [Reporter, StandardsEditor, ExecutiveEditor]
    code: 201
    input: [journalist_id, module_code, "case_study_reference?"]
    output: TrainingRecord
    side_effects:
      - "stamps completed_at from the logical clock"
      - "recomputes Journalist.completed_required_module_count and training_current"
      - "recomputes Newsroom.training_compliance_index via desk_training_compliance_index"
  # --- Test-driving endpoint ---------------------------------------------
  - method: POST
    path: "/standards-desk/_clock/set_current_utc"
    description: "Set the server's logical UTC clock, which stamps published_at, decided_at, completed_at, response_due_at and breach_flag. Before any call to this endpoint the logical clock reads exactly 2026-08-01T00:00:00Z; it never falls back to real wall-clock time."
    roles: [ExecutiveEditor]
    code: 200
    input: [to_iso8601]
    output: "{ current_utc: string }"
    side_effects:
      - "re-evaluates CorrectionRequest.breach_flag against response_due_at for every request not yet RESOLVED or DISMISSED"
  # --- Reads: newsroom -----------------------------------------------------
  - method: GET
    path: "/standards-desk/newsrooms/{id}"
    description: "Read a newsroom with its derived standards_posture, open_high_severity_count and training_compliance_index."
    roles: [Reporter, StandardsEditor, LegalCounsel, ExecutiveEditor, PublicEditor]
    code: 200
    input: []
    output: Newsroom
    side_effects: []
  - method: GET
    path: "/standards-desk/newsrooms/{id}/standards-summary"
    description: "Computed read: the desk's standing at this instant, including the training compliance index and the breached-correction count measured against the logical clock."
    roles: [StandardsEditor, ExecutiveEditor, PublicEditor]
    code: 200
    input: []
    output: "{ standards_posture: string, open_high_severity_count: integer, training_compliance_index: number, published_story_count: integer, open_correction_request_count: integer, breached_correction_count: integer }"
    side_effects: []
  - method: GET
    path: "/standards-desk/newsrooms/{id}/journalists"
    description: "List the newsroom's journalists."
    roles: [Reporter, StandardsEditor, LegalCounsel, ExecutiveEditor, PublicEditor]
    code: 200
    input: ["role_title?", "employment_status?", "limit?", "offset?"]
    output: Journalist[]
    side_effects: []
  - method: GET
    path: "/standards-desk/newsrooms/{id}/reviewers"
    description: "List the newsroom's legal and standards reviewers with their minute ledgers."
    roles: [StandardsEditor, LegalCounsel, ExecutiveEditor]
    code: 200
    input: ["discipline?", "limit?", "offset?"]
    output: Reviewer[]
    side_effects: []
  - method: GET
    path: "/standards-desk/newsrooms/{id}/audit-events"
    description: "Transparency log: the newsroom's immutable standards audit trail in occurred_at order."
    roles: [StandardsEditor, ExecutiveEditor, PublicEditor]
    code: 200
    input: ["event_type?", "subject_type?", "limit?", "offset?"]
    output: StandardsAuditEvent[]
    side_effects: []
  # --- Reads: people ------------------------------------------------------
  - method: GET
    path: "/standards-desk/journalists/{id}"
    description: "Read a journalist with penalty_points, training_current and restricted_beats."
    roles: [Reporter, StandardsEditor, LegalCounsel, ExecutiveEditor, PublicEditor]
    code: 200
    input: []
    output: Journalist
    side_effects: []
  - method: GET
    path: "/standards-desk/journalists/{id}/conflict-disclosures"
    description: "List the journalist's conflict-of-interest disclosures."
    roles: [Reporter, StandardsEditor, ExecutiveEditor, PublicEditor]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: ConflictDisclosure[]
    side_effects: []
  - method: GET
    path: "/standards-desk/journalists/{id}/outside-activity-requests"
    description: "List the journalist's outside-activity requests."
    roles: [Reporter, StandardsEditor, ExecutiveEditor, PublicEditor]
    code: 200
    input: ["status?", "activity_type?", "limit?", "offset?"]
    output: OutsideActivityRequest[]
    side_effects: []
  - method: GET
    path: "/standards-desk/journalists/{id}/training-records"
    description: "List the journalist's completed standards training modules."
    roles: [Reporter, StandardsEditor, ExecutiveEditor]
    code: 200
    input: ["module_code?", "limit?", "offset?"]
    output: TrainingRecord[]
    side_effects: []
  - method: GET
    path: "/standards-desk/reviewers/{id}"
    description: "Read a reviewer with reserved_minutes and available_minutes."
    roles: [StandardsEditor, LegalCounsel, ExecutiveEditor]
    code: 200
    input: []
    output: Reviewer
    side_effects: []
  # --- Reads: stories -----------------------------------------------------
  - method: GET
    path: "/standards-desk/stories/{id}"
    description: "Read a story with both state dimensions, both risk indices and the correction counters."
    roles: [Reporter, StandardsEditor, LegalCounsel, ExecutiveEditor, PublicEditor]
    code: 200
    input: []
    output: Story
    side_effects: []
  - method: GET
    path: "/standards-desk/stories"
    description: "List stories, filterable by newsroom, lead journalist, either state dimension or risk tier."
    roles: [Reporter, StandardsEditor, LegalCounsel, ExecutiveEditor, PublicEditor]
    code: 200
    input: ["newsroom_id?", "lead_journalist_id?", "publication_status?", "standards_status?", "risk_tier?", "limit?", "offset?"]
    output: Story[]
    side_effects: []
  - method: GET
    path: "/standards-desk/stories/{id}/anonymous-source-approvals"
    description: "List the story's anonymous-source approval records."
    roles: [Reporter, StandardsEditor, ExecutiveEditor]
    code: 200
    input: ["status?", "harm_risk?", "limit?", "offset?"]
    output: AnonymousSourceApproval[]
    side_effects: []
  - method: GET
    path: "/standards-desk/stories/{id}/pre-publication-reviews"
    description: "List the story's pre-publication review rounds."
    roles: [Reporter, StandardsEditor, LegalCounsel, ExecutiveEditor]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: PrePublicationReview[]
    side_effects: []
  - method: GET
    path: "/standards-desk/stories/{id}/correction-requests"
    description: "List the story's correction requests with their provisional and adjudicated severity."
    roles: [Reporter, StandardsEditor, ExecutiveEditor, PublicEditor]
    code: 200
    input: ["status?", "submitter_type?", "limit?", "offset?"]
    output: CorrectionRequest[]
    side_effects: []
  # --- Reads: review artefacts -------------------------------------------
  - method: GET
    path: "/standards-desk/anonymous-source-approvals/{id}"
    description: "Read an anonymous-source approval record."
    roles: [Reporter, StandardsEditor, ExecutiveEditor]
    code: 200
    input: []
    output: AnonymousSourceApproval
    side_effects: []
  - method: GET
    path: "/standards-desk/pre-publication-reviews/{id}"
    description: "Read a pre-publication review round with its legal and standards findings."
    roles: [Reporter, StandardsEditor, LegalCounsel, ExecutiveEditor]
    code: 200
    input: []
    output: PrePublicationReview
    side_effects: []
  - method: GET
    path: "/standards-desk/review-assignments/{id}"
    description: "Read a reviewer slot booking."
    roles: [StandardsEditor, LegalCounsel, ExecutiveEditor]
    code: 200
    input: []
    output: ReviewAssignment
    side_effects: []
  - method: GET
    path: "/standards-desk/review-assignments"
    description: "List reviewer slot bookings, filterable by review round, reviewer or status."
    roles: [StandardsEditor, LegalCounsel, ExecutiveEditor]
    code: 200
    input: ["review_id?", "reviewer_id?", "status?", "limit?", "offset?"]
    output: ReviewAssignment[]
    side_effects: []
  # --- Reads: corrections, misconduct, conflicts -------------------------
  - method: GET
    path: "/standards-desk/correction-requests/{id}"
    description: "Read a correction request with its response deadline and breach flag."
    roles: [Reporter, StandardsEditor, ExecutiveEditor, PublicEditor]
