            - call: "POST /grandstand/offers"
              payload: { fair_edition_id: "${ed}", artist_id: "${ar}", target_stage_id: "${st}", deal_type: "VERSUS", offered_guarantee_cents: 6000000, backend_split_pct: 0.8000, backend_breakeven_cents: 3000000, radius_miles: 150, radius_days_before: 3, radius_days_after: 1, target_show_date: "2026-08-19", load_in_start_utc: "2026-08-19T14:00:00.000Z", load_out_end_utc: "2026-08-19T23:00:00.000Z", response_window_hours: 48 }
