      - name: event_closes_when_last_pending_assignment_confirmed
        claim_type: Bubble Up
        grounds:
          - state_machines.AllocationEvent.LOCKED_to_CLOSED
          - endpoints.POST_/allocation-events/{id}/assignments/{wholesalerId}/decision
        distinguishing_aspect: "The event's CLOSED state is derived from its assignments: confirming the single PENDING assignment drops pending_qty to 0 and auto-closes the event in the same request."
        test_recipe:
          setup:
            - "Logical clock at startup default 2026-09-01T00:00:00Z."
            - "Territory awarded to GOLD wholesaler WV2 with scope [BUD-LTD]; event total 100 (cap 40): WV2 requests 50, lock assigns exactly 40 (phase-1 guarantee capped), pending_qty 40, unassigned_remainder 60."
          setup_api_calls:
            - call: "POST /territories"
              payload: { name: "Close Territory", state_code: "TX" }
              as: BrewerAdmin
              captures: { tcl_id: $.data.id }
            - call: "POST /wholesalers"
              payload: { legal_name: "Close Distributing", home_state: "TX", license_number: "TX-W-1012", tier: "GOLD", financial_capacity_score: 85, warehouse_capacity_score: 85, market_coverage_score: 85 }
