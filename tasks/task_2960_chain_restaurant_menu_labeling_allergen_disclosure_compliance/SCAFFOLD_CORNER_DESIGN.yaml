        distinguishing_aspect: "Publishing is not idempotent and the two refusals differ by state: republishing a PUBLISHED packet returns ERR_PACKET_NOT_DRAFT (409), while republishing the same packet after a newer packet superseded it returns ERR_ALREADY_TERMINAL (409) because SUPERSEDED is terminal."
