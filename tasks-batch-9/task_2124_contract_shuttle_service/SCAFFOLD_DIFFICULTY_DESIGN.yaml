              as: OpsPlanner
              captures: { p1: "$.data[0].id" }
            - call: "POST /trips/${p1}/assign"
              payload: { vehicle_id: "${v11}", driver_id: "${d11a}" }
              as: OpsPlanner
          trigger:
            - call: "POST /trips/${p1}/assign"
              payload: { vehicle_id: "${v11}", driver_id: "${d11b}" }
              as: OpsPlanner
              captures: { err_state: $.data.error_id }
            - call: "POST /trips/${p1}/unassign"
              payload: {}
              as: OpsPlanner
            - call: "POST /trips/${p1}/assign"
              payload: { vehicle_id: "${v11}", driver_id: "${d11b}" }
              as: OpsPlanner
              captures: { err_safety: $.data.error_id }
          assert:
            - "${err_state} == 'ERR_TRIP_NOT_SCHEDULABLE'"
            - "the first trigger responds with HTTP 409"
            - "${err_safety} == 'ERR_DRIVER_NOT_ADA_CERTIFIED'"
            - "the third trigger responds with HTTP 422"
            - "GET /trips/${p1} -> Trip.dispatch_status == 'SCHEDULED' and Trip.driver_id == null and Trip.vehicle_id == null"

      - name: memo_referential_beats_fiscal_cap
        grounds:
          - validations[priority=132]
          - validations[priority=140]
          - errors[ERR_TRIP_CONTRACT_MISMATCH]
          - errors[ERR_MEMO_AMOUNT_EXCEEDS_CAP]
          - endpoints[POST /credit-memos]
        distinguishing_aspect: |
          A different category pair, business_referential (priority 132) against
          business_fiscal (priority 140): a 20000-cent memo naming another contract's trip
          violates both, and ERR_TRIP_CONTRACT_MISMATCH must win; repeating the same 20000
          cents against the trip's own contract then yields ERR_MEMO_AMOUNT_EXCEEDS_CAP,
          since the cap is 3 x 4500 = 13500.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T06:00:00Z."
            - "Two ACTIVE ServiceContracts, each with penalty_rate_cents_per_missed_trip 4500 so the per-memo cap is 13500."
            - "One PUBLISHED Route belonging to the SECOND contract, with one SCHEDULED trip on 2026-09-02."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T06:00:00Z" }
              as: ContractAdmin
            - call: "POST /service-contracts"
              payload: { client_name: "Contract Alpha", site_type: "HOTEL", base_rate_cents_per_service_hour: 9000, term_start_date: "2026-09-01", term_end_date: "2027-08-31", escalation_index_pct: 3.5, sla_on_time_threshold_pct: 92.00, penalty_rate_cents_per_missed_trip: 4500, ada_min_accessible_pct: 25.00 }
              as: ContractAdmin
              captures: { cx: $.data.id }
            - call: "POST /service-contracts/${cx}/activate"
              payload: {}
              as: ContractAdmin
            - call: "POST /service-contracts"
              payload: { client_name: "Contract Beta", site_type: "CAMPUS", base_rate_cents_per_service_hour: 9000, term_start_date: "2026-09-01", term_end_date: "2027-08-31", escalation_index_pct: 3.5, sla_on_time_threshold_pct: 92.00, penalty_rate_cents_per_missed_trip: 4500, ada_min_accessible_pct: 25.00 }
              as: ContractAdmin
              captures: { cy: $.data.id }
            - call: "POST /service-contracts/${cy}/activate"
              payload: {}
              as: ContractAdmin
            - call: "POST /routes"
              payload: { contract_id: "${cy}", name: "Beta Loop", loop_minutes: 48, headway_minutes: 12, service_window_start_min: 420, service_window_end_min: 420, demand_forecast_pax_per_hour: 0, reference_seat_capacity: 20 }
              as: OpsPlanner
              captures: { ry: $.data.id }
            - call: "POST /routes/${ry}/publish"
              payload: { service_date: "2026-09-02" }
              as: OpsPlanner
            - call: "GET /trips"
              payload: { route_id: "${ry}", service_date: "2026-09-02" }
              as: OpsPlanner
              captures: { ty: "$.data[0].id" }
          trigger:
            - call: "POST /credit-memos"
              payload: { contract_id: "${cx}", trip_id: "${ty}", amount_cents: 20000, reason: "GOODWILL" }
              as: ClientLiaison
              captures: { err_ref: $.data.error_id }
            - call: "POST /credit-memos"
              payload: { contract_id: "${cy}", trip_id: "${ty}", amount_cents: 20000, reason: "GOODWILL" }
              as: ClientLiaison
              captures: { err_fiscal: $.data.error_id }
          assert:
            - "${err_ref} == 'ERR_TRIP_CONTRACT_MISMATCH'"
            - "${err_fiscal} == 'ERR_MEMO_AMOUNT_EXCEEDS_CAP'"
            - "both triggers respond with HTTP 422"
            - "GET /service-contracts/${cx} -> ServiceContract.credit_balance_cents == 0"
            - "GET /service-contracts/${cy} -> ServiceContract.credit_balance_cents == 0"

  # =========================================================================
  # Rule 6 — Boundary-precision checks on different metrics / endpoints
  # =========================================================================
  - rule_id: boundary_precision_check
    instances:

      - name: on_time_grace_exactly_five_minutes
        grounds:
          - calculations.period_sla_penalty
          - entities.ServicePeriodReport.fields.on_time_trip_count
          - entities.Trip.fields.actual_departure_min
          - endpoints[POST /trips/{id}/start]
        distinguishing_aspect: |
          Numeric threshold boundary reached through POST /trips/{id}/start: a departure
          delay of exactly 5 minutes counts as on time and a delay of 6 does not, so the
          period reports on_time_trip_count 1 out of countable_trip_count 2 and
          on_time_pct 50.00.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T06:00:00Z."
            - "One ACTIVE ServiceContract with sla_on_time_threshold_pct 92.00 at 9000 cents per service hour."
            - "One PUBLISHED Route over the window 420..432 with headway 12 and loop 48, giving trips at 420 and 432."
            - "Both trips are ASSIGNED, each to its own vehicle and its own driver."
