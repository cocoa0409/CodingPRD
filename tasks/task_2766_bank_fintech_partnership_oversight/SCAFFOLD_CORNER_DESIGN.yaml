            - call: "GET /oversight/settlement-batches"
              payload: { partner_id: "${pa_id}" }
              as: InternalAudit
              as_user_id: "ia-erin"
              captures: { l_sb_total: $.total_count, l_sb_first: "$.data[0].id" }
            - call: "GET /oversight/complaints"
              payload: { partner_id: "${pa_id}" }
              as: InternalAudit
              as_user_id: "ia-erin"
              captures: { l_cmp_total: $.total_count, l_cmp_first: "$.data[0].id" }
            - call: "GET /oversight/alerts"
              payload: { partner_id: "${pa_id}" }
              as: InternalAudit
