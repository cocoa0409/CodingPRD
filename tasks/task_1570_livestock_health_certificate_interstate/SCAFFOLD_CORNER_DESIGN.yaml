            - call: "POST /api/certificates"
              payload: { origin_premises_id: "${prem_id}", destination_state_code: "KS", species_code: "CATTLE", head_count: 5, inspection_date: "2026-08-10T00:00:00Z", test_record_id: "${t1}", vaccination_date: "2026-07-12T00:00:00Z" }
              as: AccreditedVet
