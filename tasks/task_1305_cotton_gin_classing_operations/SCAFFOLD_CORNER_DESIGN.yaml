              as: GinOperator
              captures: { m: $.data.id }
            - call: "POST /gin-ops/modules/${m}/queue"
              payload: { gin_shift_id: "${s}" }
              as: GinOperator
            - call: "POST /gin-ops/modules/${m}/start-ginning"
              as: GinOperator
            - call: "POST /gin-ops/modules/${m}/complete-ginning"
              payload: { bales: [ {bale_tag: "B-ST1", net_weight_lbs: 500}, {bale_tag: "B-ST2", net_weight_lbs: 500} ] }
              as: GinOperator
              as_user_id: "gin-op-1"
            - call: "GET /gin-ops/modules/${m}/bales"
              as: WarehouseManager
              captures: { b1: "$.data[0].id", b2: "$.data[1].id" }
            - call: "POST /gin-ops/warehouse-receipts"
              payload: { bale_id: "${b1}", warehouse_id: "${w}" }
              as: WarehouseManager
              as_user_id: "wm-1"
            - call: "POST /gin-ops/warehouse-receipts"
              payload: { bale_id: "${b2}", warehouse_id: "${w}" }
              as: WarehouseManager
              as_user_id: "wm-1"
            - call: "POST /gin-ops/shipping-orders"
              payload: { warehouse_id: "${w}", grower_id: "${g}", bale_ids: ["${b1}"], dock_number: 1, load_start: "2026-08-16T10:00:00Z", load_end: "2026-08-16T11:00:00Z" }
              as: WarehouseManager
              captures: { o1: $.data.id }
            - call: "POST /gin-ops/shipping-orders"
              payload: { warehouse_id: "${w}", grower_id: "${g}", bale_ids: ["${b2}"], dock_number: 2, load_start: "2026-08-17T10:00:00Z", load_end: "2026-08-17T11:00:00Z" }
              as: WarehouseManager
              captures: { o2: $.data.id }
            - call: "POST /gin-ops/shipping-orders/${o1}/confirm"
              as: WarehouseManager
            - call: "POST /gin-ops/shipping-orders/${o2}/confirm"
              as: WarehouseManager
          trigger:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-16T00:00:00Z" }
              as: CoopAdmin
            - call: "POST /gin-ops/shipping-orders/${o1}/ship"
              as: WarehouseManager
            - call: "GET /gin-ops/ledger-entries"
              payload: { grower_id: "${g}" }
              as: CoopAccountant
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-17T00:00:00Z" }
              as: CoopAdmin
            - call: "POST /gin-ops/shipping-orders/${o2}/ship"
              as: WarehouseManager
            - call: "GET /gin-ops/ledger-entries"
              payload: { grower_id: "${g}" }
              as: CoopAccountant
          assert:
            - "ship at days_stored == 15 (2026-08-01 -> 2026-08-16): no STORAGE_CHARGE entry exists (charge 0 posts nothing)"
            - "ship at days_stored == 16: exactly one STORAGE_CHARGE entry of -12 (1 chargeable day x 12 cents)"
            - "Grower.${g}.credit_balance_cents == -11512 (ginning -11500 - storage 12)"

      - name: provisional_seed_estimate_excluded_once_shift_sold
