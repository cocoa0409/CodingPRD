            - "${m_min} == 123.0 with ${m_class} == 126 (floor 7.0 applied: 114.4 / 0.93 = 123.0107 -> 123.0)"
            - "Neither result is 130.0 for the male wrestler nor 123.0 for the female wrestler — the floor is never taken from the wrong column and never defaulted to a single constant"

      - name: minimum_certified_weight_double_rounding_order_precision
        claim_type: precision
        grounds:
          - calculations.minimum_certified_weight.precision
        distinguishing_aspect: "The pinned two-stage rounding is observable: 121.0 lbs at 13.1% gives lean 105.149 -> 105.1, and 105.1 / 0.93 = 113.0107 -> 113.0, which lands exactly on class 113. Carrying the unrounded 105.149 into the division gives 113.1 and would select class 120, so the two class answers differ by a full class."
        test_recipe:
          setup:
            - "Open season with default constants, one team, one CERTIFIED assessor and one male wrestler."
          setup_api_calls:
            - call: "POST /seasons"
              payload: { name: "2026-27 State Wrestling Season", start_date: "2026-11-01" }
