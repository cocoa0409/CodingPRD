            - "RiskControlMapping.${mid}.status remains PROPOSED"

      - name: riskmanager_cannot_finalize_report_forbidden
        claim_type: rbac_denial
        grounds: ["roles[BoardReporter]", "roles[RiskManager]"]
        distinguishing_aspect: "Report finalization is exclusive to BoardReporter; RiskManager is denied ERR_FORBIDDEN."
