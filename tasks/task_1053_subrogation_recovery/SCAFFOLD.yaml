# =============================================================================
# Subrogation & Recovery Vendor — benchmark seed tables (SCAFFOLD, §1.0–§1.7)
# =============================================================================

scenario: |
  Subrogation & Recovery Vendor: claim referral & liability, demand &
  documentation, arbitration (intercompany) & filing, settlement & payment
  allocation, statute & deadline, deductible-recovery to insured, reporting,
  commission

domain_name: subrogation-recovery
api_prefix: /subro

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: multi_party_negotiation
  complexity_layers:
    - cascading_side_effects
    - dual_variant_calculation
    - scheduled_deferred_actions   # logical clock drives statute / window / hearing deadlines
    - optimistic_concurrency       # OCC on Claim.version for settlement-supersede race
  entity_topology: flat            # peer collections under a common /subro namespace, linked by FK
  state_machine_shape: cyclic      # arbitration negotiation rounds cycle; settlement forks
  relationship_patterns:
    - one_to_many                  # Carrier→Claim, Claim→Demand/Arbitration/Settlement/RecoveryPayment
    - cross_aggregate              # RecoveryPayment allocation touches Claim, DeductibleReimbursement, CommissionStatement
  role_model: segregation_of_duties  # settlement proposer's X-User-ID may not approve it
  consistency_model: immediate

# =============================================================================
# §1.0 Response Envelope (FIXED — EMIT VERBATIM)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Carrier
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Insurance carrier (vendor's client) name" }
      - { name: naic_code, type: string, source: input, description: "NAIC company code" }
      - { name: commission_rate_bps, type: integer, source: input, description: "Vendor recovery commission rate in basis points (e.g., 2500 = 25%)", constraints: "1..10000" }
      - { name: commission_basis, type: enum, source: input, default: "NET", description: "Which commission variant is billed: GROSS | NET (NET = commission on recovery net of insured deductible)" }
      - { name: status, type: enum, source: system, default: "ACTIVE", description: "ACTIVE | SUSPENDED" }

  - name: AdverseParty
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "At-fault party name" }
      - { name: adverse_carrier_name, type: string, source: input, description: "Adverse party's insurer name" }
      - { name: is_arbitration_eligible, type: boolean, source: input, description: "True when adverse insurer is an intercompany-arbitration-forum signatory (gates arbitration filing)" }
      - { name: policy_limit_cents, type: integer, source: input, description: "Adverse policy limit; caps recoverable estimate", constraints: ">= 0" }

  - name: Claim
    parent: null
    common_fields: true
    fields:
      - { name: carrier_id, type: string, source: input, description: "FK -> Carrier.id; the referring carrier" }
      - { name: adverse_party_id, type: string, source: input, description: "FK -> AdverseParty.id; the party recovered against" }
      - { name: claim_reference, type: string, source: input, description: "Carrier's external claim reference" }
      - { name: loss_date, type: datetime, source: input, description: "ISO8601 date of loss" }
      - { name: referral_date, type: datetime, source: system, description: "Logical-clock time when referral was created" }
      - { name: paid_loss_cents, type: integer, source: input, description: "Amount carrier paid its insured (excludes deductible)", constraints: ">= 0" }
      - { name: deductible_cents, type: integer, source: input, description: "Insured's deductible to be recovered (make-whole priority)", constraints: ">= 0" }
      - { name: total_damages_cents, type: integer, source: input, description: "Full claimed damages; liability_pct applies to this", constraints: ">= 0" }
      - { name: statute_deadline, type: datetime, source: input, description: "Statute-of-limitations deadline; at/after this instant pre-recovery claims expire" }
      - { name: liability_pct, type: number, source: system, description: "Assessed adverse liability percentage 0..100; set at assess-liability", default: null }
      - { name: provisional_recoverable_cents, type: integer, source: computed, description: "Estimate at liability assessment; see calc claim_recoverable variant=provisional", default: null }
      - { name: settled_amount_cents, type: integer, source: system, description: "Accepted settlement / award amount; set when a Settlement is accepted", default: null }
      - { name: final_recovered_cents, type: integer, source: computed, description: "Sum of CLEARED RecoveryPayment.amount_cents (net of reversals)", default: 0 }
      - { name: deductible_reimbursed_cents, type: integer, source: computed, description: "Cumulative DISBURSED deductible returned to insured (net of clawbacks)", default: 0 }
      - { name: carrier_recovered_cents, type: integer, source: computed, description: "Cumulative carrier-net allocation across CLEARED payments (net of reversals)", default: 0 }
      - { name: accrued_commission_cents, type: integer, source: computed, description: "Cumulative vendor commission allocated across CLEARED payments (net of reversals)", default: 0 }
      - { name: status, type: enum, source: system, default: "REFERRED", description: "REFERRED | LIABILITY_ASSESSED | DEMAND_ISSUED | ARBITRATION | SETTLED | RECOVERED | WITHDRAWN | STATUTE_EXPIRED" }

  - name: Demand
    parent: null
    common_fields: true
    fields:
      - { name: claim_id, type: string, source: input, description: "FK -> Claim.id" }
      - { name: amount_demanded_cents, type: integer, source: input, description: "Amount demanded from adverse party", constraints: "> 0" }
      - { name: issued_at, type: datetime, source: system, description: "Logical-clock time at issuance" }
      - { name: response_due_at, type: datetime, source: computed, description: "issued_at + DEMAND_RESPONSE_DAYS; response window end (exclusive)" }
      - { name: disputed_at, type: datetime, source: system, description: "Logical-clock time when marked DISPUTED", default: null }
      - { name: arbitration_window_due_at, type: datetime, source: computed, description: "disputed_at + ARBITRATION_FILING_DAYS; arbitration must be filed before this instant", default: null }
      - { name: outcome, type: enum, source: system, description: "null | HONORED | DISPUTED", default: null }
      - { name: status, type: enum, source: system, default: "ISSUED", description: "ISSUED | HONORED | DISPUTED | EXPIRED | WITHDRAWN" }

  - name: Arbitration
    parent: null
    common_fields: true
    fields:
      - { name: claim_id, type: string, source: input, description: "FK -> Claim.id" }
      - { name: forum, type: string, source: input, description: "Intercompany arbitration forum code (e.g., AF)" }
      - { name: filed_at, type: datetime, source: system, description: "Logical-clock time at filing" }
      - { name: hearing_start, type: datetime, source: system, description: "Scheduled hearing window start; set at schedule-hearing", default: null }
      - { name: hearing_end, type: datetime, source: system, description: "Scheduled hearing window end; set at schedule-hearing", default: null }
      - { name: rounds, type: array, source: system, description: "Append-only round log: [{ round_no, filer, filed_at, note }]", default: "[]" }
      - { name: round_count, type: integer, source: computed, description: "len(rounds)", default: 0 }
      - { name: award_amount_cents, type: integer, source: system, description: "Forum decision amount; set at decide", default: null }
      - { name: status, type: enum, source: system, default: "FILED", description: "FILED | AWAITING_RESPONSE | RESPONSE_FILED | DECIDED | WITHDRAWN" }

  - name: Settlement
    parent: null
    common_fields: true
    fields:
      - { name: claim_id, type: string, source: input, description: "FK -> Claim.id" }
      - { name: settled_amount_cents, type: integer, source: input, description: "Proposed settlement amount", constraints: "> 0" }
      - { name: proposed_by_user_id, type: string, source: system, description: "X-User-ID of the RecoverySpecialist who proposed (SoD anchor)" }
      - { name: approved_by_user_id, type: string, source: system, description: "X-User-ID of approving RecoveryManager", default: null }
      - { name: status, type: enum, source: system, default: "PROPOSED", description: "PROPOSED | APPROVED | ACCEPTED | REJECTED | SUPERSEDED" }

  - name: RecoveryPayment
    parent: null
    common_fields: true
    fields:
      - { name: claim_id, type: string, source: input, description: "FK -> Claim.id" }
      - { name: amount_cents, type: integer, source: input, description: "Gross amount received from adverse party", constraints: "> 0" }
      - { name: received_at, type: datetime, source: system, description: "Logical-clock time at recording" }
      - { name: alloc_deductible_cents, type: integer, source: computed, description: "Waterfall bucket 1 — insured deductible; set at clear", default: null }
      - { name: alloc_carrier_cents, type: integer, source: computed, description: "Waterfall bucket 3 — carrier net paid-loss; set at clear", default: null }
      - { name: alloc_commission_cents, type: integer, source: computed, description: "Waterfall bucket 2 — vendor commission; set at clear", default: null }
      - { name: status, type: enum, source: system, default: "RECEIVED", description: "RECEIVED | CLEARED | REVERSED | BOUNCED" }

  - name: DeductibleReimbursement
    parent: null
    common_fields: true
    fields:
      - { name: claim_id, type: string, source: system, description: "FK -> Claim.id" }
      - { name: recovery_payment_id, type: string, source: system, description: "FK -> RecoveryPayment.id; the clearing payment that funded this reimbursement" }
      - { name: amount_cents, type: integer, source: system, description: "= the funding payment's alloc_deductible_cents" }
      - { name: disbursed_at, type: datetime, source: system, description: "Logical-clock time at disbursement", default: null }
      - { name: status, type: enum, source: system, default: "PENDING", description: "PENDING | DISBURSED | CLAWED_BACK" }

  - name: CommissionStatement
    parent: null
    common_fields: true
    fields:
      - { name: carrier_id, type: string, source: input, description: "FK -> Carrier.id" }
      - { name: period_label, type: string, source: input, description: "Reporting period label (e.g., 2026-Q3)" }
      - { name: lines, type: array, source: computed, description: "One line per RECOVERED claim swept at creation: [{ claim_id, net_recovery_cents, commission_cents }]", default: "[]" }
      - { name: total_commission_cents, type: integer, source: computed, description: "Sum of per-line commission_cents; frozen at finalize (see calc statement_commission_total)", default: 0 }
      - { name: status, type: enum, source: system, default: "OPEN", description: "OPEN | FINALIZED | VOID" }

  - name: ClaimDocument
    parent: null
    common_fields: false        # append-only evidence: carries only id + created_at, immutable, no version
    fields:
      - { name: claim_id, type: string, source: input, description: "FK -> Claim.id" }
      - { name: doc_type, type: enum, source: input, description: "POLICE_REPORT | ESTIMATE | POLICY | CORRESPONDENCE | OTHER" }
      - { name: title, type: string, source: input, description: "Document title" }
      - { name: uri, type: string, source: input, description: "Storage URI / external link" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Claim
    initial_state: REFERRED
    terminal_states: [RECOVERED, WITHDRAWN, STATUTE_EXPIRED]
    transitions:
      - from: REFERRED
        to: LIABILITY_ASSESSED
        trigger: "POST /subro/claims/{claim_id}/assess-liability"
        actor: RecoverySpecialist
        preconditions: ["carrier.status == ACTIVE", "0 <= liability_pct <= 100", "clock now < statute_deadline"]
        side_effects: ["set liability_pct", "recompute provisional_recoverable_cents (calc claim_recoverable variant=provisional)"]
      - from: LIABILITY_ASSESSED
        to: DEMAND_ISSUED
        trigger: "POST /subro/claims/{claim_id}/demands"
        actor: RecoverySpecialist
        preconditions: ["state permits: claim in {LIABILITY_ASSESSED, DEMAND_ISSUED}", "no Demand for this claim in status ISSUED with an open response window (temporal, see §1.4 p9 ERR_DEMAND_WINDOW_OPEN)", "clock now < statute_deadline"]
        side_effects: ["create Demand in ISSUED with response_due_at = issued_at + DEMAND_RESPONSE_DAYS"]
      - from: DEMAND_ISSUED
        to: DEMAND_ISSUED
        trigger: "POST /subro/claims/{claim_id}/demands (re-demand after prior window closes)"
        actor: RecoverySpecialist
        preconditions: ["no Demand for this claim in status ISSUED with an open response window (temporal, ERR_DEMAND_WINDOW_OPEN)", "clock now < statute_deadline"]
        side_effects: ["create Demand in ISSUED with response_due_at = issued_at + DEMAND_RESPONSE_DAYS (CYCLE: claim stays DEMAND_ISSUED)"]
      - from: DEMAND_ISSUED
        to: ARBITRATION
        trigger: "POST /subro/claims/{claim_id}/arbitrations"
        actor: RecoverySpecialist
        preconditions: ["adverse_party.is_arbitration_eligible == true", "exists Demand for claim in status DISPUTED", "clock now < that Demand.arbitration_window_due_at", "clock now < statute_deadline"]
        side_effects: ["create Arbitration in FILED"]
      - from: DEMAND_ISSUED
        to: SETTLED
        trigger: "POST /subro/settlements/{settlement_id}/accept (Settlement.claim_id == this claim)"
        actor: CarrierUser
        preconditions: ["settlement.status == APPROVED", "claim.carrier_id == X-User-ID"]
        side_effects: ["set claim.settled_amount_cents = settlement.settled_amount_cents"]
      - from: ARBITRATION
        to: SETTLED
        trigger: "POST /subro/settlements/{settlement_id}/accept (Settlement.claim_id == this claim)"
        actor: CarrierUser
        preconditions: ["settlement.status == APPROVED", "claim.carrier_id == X-User-ID"]
        side_effects: ["set claim.settled_amount_cents = settlement.settled_amount_cents", "CASCADE: any Arbitration for this claim in {FILED, AWAITING_RESPONSE, RESPONSE_FILED} -> WITHDRAWN (moot)"]
      - from: SETTLED
        to: RECOVERED
        trigger: "system (bubble-up on RecoveryPayment clear when final_recovered_cents >= settled_amount_cents)"
        actor: system
        preconditions: ["final_recovered_cents >= settled_amount_cents"]
        side_effects: ["CASCADE: create DeductibleReimbursement (PENDING) for the clearing payment's alloc_deductible_cents when > 0"]
      - from: REFERRED
        to: WITHDRAWN
        trigger: "POST /subro/claims/{claim_id}/withdraw"
        actor: CarrierUser
        preconditions: ["claim.carrier_id == X-User-ID"]
        side_effects: []
      - from: LIABILITY_ASSESSED
        to: WITHDRAWN
        trigger: "POST /subro/claims/{claim_id}/withdraw"
        actor: CarrierUser
        preconditions: ["claim.carrier_id == X-User-ID"]
        side_effects: []
      - from: DEMAND_ISSUED
        to: WITHDRAWN
        trigger: "POST /subro/claims/{claim_id}/withdraw"
        actor: CarrierUser
        preconditions: ["claim.carrier_id == X-User-ID"]
        side_effects: ["CASCADE: open Demand (status ISSUED or DISPUTED) -> WITHDRAWN"]
      - from: ARBITRATION
        to: WITHDRAWN
        trigger: "POST /subro/claims/{claim_id}/withdraw"
        actor: CarrierUser
        preconditions: ["claim.carrier_id == X-User-ID"]
        side_effects: ["CASCADE: open Demand -> WITHDRAWN", "CASCADE: Arbitration in {FILED, AWAITING_RESPONSE, RESPONSE_FILED} -> WITHDRAWN"]
      - from: REFERRED
        to: STATUTE_EXPIRED
        trigger: "system (on POST /_clock/set_current_utc when now >= statute_deadline)"
        actor: system
        preconditions: ["clock now >= statute_deadline"]
        side_effects: []
      - from: LIABILITY_ASSESSED
        to: STATUTE_EXPIRED
        trigger: "system (on POST /_clock/set_current_utc when now >= statute_deadline)"
        actor: system
        preconditions: ["clock now >= statute_deadline"]
        side_effects: []
      - from: DEMAND_ISSUED
        to: STATUTE_EXPIRED
        trigger: "system (on POST /_clock/set_current_utc when now >= statute_deadline)"
        actor: system
        preconditions: ["clock now >= statute_deadline"]
        side_effects: ["CASCADE: open Demand -> WITHDRAWN"]
      - from: ARBITRATION
        to: STATUTE_EXPIRED
        trigger: "system (on POST /_clock/set_current_utc when now >= statute_deadline)"
        actor: system
        preconditions: ["clock now >= statute_deadline"]
        side_effects: ["CASCADE: Arbitration in {FILED, AWAITING_RESPONSE, RESPONSE_FILED} -> WITHDRAWN"]

  - entity: Demand
    initial_state: ISSUED
    terminal_states: [HONORED, EXPIRED, WITHDRAWN]
    transitions:
      - from: ISSUED
        to: HONORED
        trigger: "POST /subro/demands/{demand_id}/record-response (outcome=HONORED)"
        actor: RecoverySpecialist
        preconditions: ["clock now < response_due_at"]
        side_effects: ["set outcome=HONORED"]
      - from: ISSUED
        to: DISPUTED
        trigger: "POST /subro/demands/{demand_id}/record-response (outcome=DISPUTED)"
        actor: RecoverySpecialist
        preconditions: ["clock now < response_due_at"]
        side_effects: ["set outcome=DISPUTED", "set disputed_at = clock now", "set arbitration_window_due_at = disputed_at + ARBITRATION_FILING_DAYS"]
      - from: ISSUED
        to: EXPIRED
        trigger: "system (on POST /_clock/set_current_utc when now >= response_due_at and no response recorded)"
        actor: system
        preconditions: ["clock now >= response_due_at", "outcome is null"]
        side_effects: []
      - from: ISSUED
        to: WITHDRAWN
        trigger: "system (CASCADE from Claim withdraw / statute expiry)"
        actor: system
        preconditions: []
        side_effects: []
      - from: DISPUTED
        to: WITHDRAWN
        trigger: "system (CASCADE from Claim withdraw / statute expiry)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: Arbitration
    initial_state: FILED
    terminal_states: [DECIDED, WITHDRAWN]
    transitions:
      - from: FILED
        to: AWAITING_RESPONSE
        trigger: "POST /subro/arbitrations/{arbitration_id}/schedule-hearing"
        actor: RecoverySpecialist
        preconditions: ["hearing_start < hearing_end", "no other Arbitration on same adverse_party (via its claim) with a hearing window within HEARING_BUFFER_DAYS of [hearing_start, hearing_end]"]
        side_effects: ["set hearing_start, hearing_end"]
      - from: AWAITING_RESPONSE
        to: RESPONSE_FILED
        trigger: "POST /subro/arbitrations/{arbitration_id}/rounds"
        actor: RecoverySpecialist
        preconditions: []
        side_effects: ["append { round_no, filer, filed_at, note } to rounds", "increment round_count"]
      - from: RESPONSE_FILED
        to: AWAITING_RESPONSE
        trigger: "POST /subro/arbitrations/{arbitration_id}/rounds"
        actor: RecoverySpecialist
        preconditions: []
        side_effects: ["append round to rounds (CYCLE: rebuttal opens next round)", "increment round_count"]
      - from: RESPONSE_FILED
        to: DECIDED
        trigger: "POST /subro/arbitrations/{arbitration_id}/decide"
        actor: RecoveryManager
        preconditions: []
        side_effects: ["set award_amount_cents"]
      - from: AWAITING_RESPONSE
        to: DECIDED
        trigger: "POST /subro/arbitrations/{arbitration_id}/decide"
        actor: RecoveryManager
        preconditions: []
        side_effects: ["set award_amount_cents (decision on default)"]
      - from: FILED
        to: WITHDRAWN
        trigger: "system (CASCADE from Claim withdraw / statute expiry / settlement accepted)"
        actor: system
        preconditions: []
        side_effects: []
      - from: AWAITING_RESPONSE
        to: WITHDRAWN
        trigger: "system (CASCADE from Claim withdraw / statute expiry / settlement accepted)"
        actor: system
        preconditions: []
        side_effects: []
      - from: RESPONSE_FILED
        to: WITHDRAWN
        trigger: "system (CASCADE from Claim withdraw / statute expiry / settlement accepted)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: Settlement
    initial_state: PROPOSED
    terminal_states: [ACCEPTED, REJECTED, SUPERSEDED]
    transitions:
      - from: PROPOSED
        to: APPROVED
        trigger: "POST /subro/settlements/{settlement_id}/approve"
        actor: RecoveryManager
        preconditions: ["X-User-ID != proposed_by_user_id (SoD)", "settled_amount_cents <= MANAGER_AUTHORITY_CENTS"]
        side_effects: ["set approved_by_user_id = X-User-ID"]
      - from: PROPOSED
        to: REJECTED
        trigger: "POST /subro/settlements/{settlement_id}/reject"
        actor: RecoveryManager
        preconditions: []
        side_effects: []
      - from: PROPOSED
        to: SUPERSEDED
        trigger: "system (CASCADE: a newer Settlement proposed on the same claim)"
        actor: system
        preconditions: []
        side_effects: []
      - from: APPROVED
        to: ACCEPTED
        trigger: "POST /subro/settlements/{settlement_id}/accept"
        actor: CarrierUser
        preconditions: ["claim.carrier_id == X-User-ID", "claim.status in {DEMAND_ISSUED, ARBITRATION}"]
        side_effects: ["claim -> SETTLED (see Claim SM)"]

  - entity: RecoveryPayment
    initial_state: RECEIVED
    terminal_states: [CLEARED, REVERSED, BOUNCED]
    transitions:
      - from: RECEIVED
        to: CLEARED
        trigger: "POST /subro/recovery-payments/{recovery_payment_id}/clear"
        actor: FinanceOfficer
        preconditions: ["claim.status in {SETTLED, RECOVERED}"]
        side_effects:
          - "run calc recovery_waterfall_allocation -> set alloc_deductible_cents, alloc_commission_cents, alloc_carrier_cents"
          - "CASCADE hop1: claim.final_recovered_cents += amount_cents; claim.deductible_reimbursed pool + carrier_recovered_cents += alloc_carrier_cents; claim.accrued_commission_cents += alloc_commission_cents"
          - "CASCADE hop2: if final_recovered_cents >= settled_amount_cents then claim -> RECOVERED"
          - "CASCADE hop3: if alloc_deductible_cents > 0 then create DeductibleReimbursement (PENDING, amount = alloc_deductible_cents)"
      - from: RECEIVED
        to: BOUNCED
        trigger: "POST /subro/recovery-payments/{recovery_payment_id}/reverse (on an uncleared payment)"
        actor: FinanceOfficer
        preconditions: []
        side_effects: []
      - from: CLEARED
        to: REVERSED
        trigger: "POST /subro/recovery-payments/{recovery_payment_id}/reverse"
        actor: FinanceOfficer
        preconditions: []
        side_effects:
          - "COMPENSATION: claim.final_recovered_cents -= amount_cents; carrier_recovered_cents -= alloc_carrier_cents; accrued_commission_cents -= alloc_commission_cents"
          - "CASCADE hop2: if claim.status == RECOVERED and final_recovered_cents < settled_amount_cents then claim -> SETTLED"
          - "CASCADE hop3: the DeductibleReimbursement funded by this payment (PENDING or DISBURSED) -> CLAWED_BACK; if it was DISBURSED then claim.deductible_reimbursed_cents -= its amount_cents"

  - entity: DeductibleReimbursement
    initial_state: PENDING
    terminal_states: [DISBURSED, CLAWED_BACK]
    transitions:
      - from: PENDING
        to: DISBURSED
        trigger: "POST /subro/deductible-reimbursements/{deductible_reimbursement_id}/disburse"
        actor: FinanceOfficer
        preconditions: ["funding RecoveryPayment.status == CLEARED"]
        side_effects: ["set disbursed_at", "claim.deductible_reimbursed_cents += amount_cents"]
      - from: PENDING
        to: CLAWED_BACK
        trigger: "system (CASCADE from RecoveryPayment reverse)"
        actor: system
        preconditions: []
        side_effects: []
      - from: DISBURSED
        to: CLAWED_BACK
        trigger: "system (CASCADE from RecoveryPayment reverse)"
        actor: system
        preconditions: []
        side_effects: ["claim.deductible_reimbursed_cents -= amount_cents"]

  - entity: CommissionStatement
    initial_state: OPEN
    terminal_states: [FINALIZED, VOID]
    transitions:
      - from: OPEN
        to: FINALIZED
        trigger: "POST /subro/commission-statements/{commission_statement_id}/finalize"
        actor: RecoveryManager
        preconditions: ["lines is non-empty"]
        side_effects: ["freeze lines", "set total_commission_cents (calc statement_commission_total)"]
      - from: OPEN
        to: VOID
        trigger: "POST /subro/commission-statements/{commission_statement_id}/finalize (with void=true)"
        actor: RecoveryManager
        preconditions: []
        side_effects: []

# -----------------------------------------------------------------------------
# §1.2.1 Concurrency Rules
# -----------------------------------------------------------------------------
concurrency_rules:
  - rule_id: settlement-create-stale-claim
    parent_entity: Claim
    write_endpoint: "POST /subro/claims/{claim_id}/settlements"
    occ_field: "expected_claim_version"
    description: |
      Proposing a Settlement against a Claim whose version has advanced since the
      client last observed it is rejected. A new proposal legitimately supersedes
      any prior PROPOSED settlement (which moves to SUPERSEDED and bumps the
      claim's version); a client acting on a stale claim view is therefore
      rejected rather than silently superseding a proposal it never saw.
    error_id: ERR_STALE_CLAIM_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: claim_recoverable
    trigger: "assess-liability (provisional); settlement accept (final)"
    algorithm: forward_looking
    formula: |
      base_exposure_cents = paid_loss_cents + deductible_cents
      liability_share_cents = round_half_up(liability_pct / 100 * total_damages_cents)
      # nested three-way min: liability cap, policy cap, out-of-pocket cap
      provisional = min(liability_share_cents, adverse_party.policy_limit_cents, base_exposure_cents)
      final = settlement.settled_amount_cents   # the actually accepted amount
    input_set: "single Claim + its AdverseParty; provisional uses liability_pct estimate, final uses accepted Settlement amount"
    precision: "integer cents, round_half_up"
    variants:
      - name: provisional
        when: "at assess-liability (forward estimate on Claim)"
        difference: "three-way min of liability_share, policy_limit, base_exposure"
      - name: final
        when: "at settlement accept"
        difference: "equals the accepted settled_amount_cents; ignores the liability estimate"

  - name: recovery_waterfall_allocation
    trigger: "RecoveryPayment clear"
    algorithm: waterfall_allocation
    formula: |
      deductible_outstanding = claim.deductible_cents - claim.deductible_reimbursed_pool_committed
      alloc_deductible_cents = min(amount_cents, deductible_outstanding)
      rem1 = amount_cents - alloc_deductible_cents
      alloc_commission_cents = round_half_up(carrier.commission_rate_bps / 10000 * rem1)
      alloc_carrier_cents = rem1 - alloc_commission_cents
      # conservation: alloc_deductible + alloc_commission + alloc_carrier == amount_cents
    input_set: "the single RecoveryPayment being cleared, its Claim, and the Claim's Carrier"
    constants: {}
    precision: "integer cents, round_half_up; buckets filled in fixed order deductible -> commission -> carrier"

  - name: commission_due
    trigger: "reporting / commission statement sweep on a RECOVERED claim"
    algorithm: threshold
    formula: |
      gross_recovery = claim.final_recovered_cents
      GROSS variant: round_half_up(carrier.commission_rate_bps / 10000 * gross_recovery)
      NET   variant: round_half_up(carrier.commission_rate_bps / 10000 * (gross_recovery - claim.deductible_reimbursed_cents))
      applied = GROSS if carrier.commission_basis == GROSS else NET
    input_set: "a RECOVERED Claim and its Carrier"
    precision: "integer cents, round_half_up"
    variants:
      - name: gross_basis
        when: "carrier.commission_basis == GROSS"
        difference: "commission on full gross recovery including insured deductible"
      - name: net_basis
        when: "carrier.commission_basis == NET (default)"
        difference: "commission on recovery net of deductible reimbursed to insured"

  - name: statement_commission_total
    trigger: "CommissionStatement finalize"
    algorithm: aggregation
    formula: |
      For each line (one per RECOVERED claim swept at statement creation):
        line.commission_cents = commission_due(applied variant) for that claim   # already whole cents
      total_commission_cents = sum(line.commission_cents)   # ROUND PER-CLAIM THEN SUM
      # pinned order: per-claim rounding precedes summation; summing raw fractional
      # commissions then rounding once is NOT used and can differ by a cent.
    input_set: "all lines on the statement (frozen at creation); source claims filtered to status == RECOVERED at sweep time, ordered by Claim.created_at ASC"
    precision: "integer cents, round_half_up; per-line rounding before summation"

  - name: statute_and_window_sweep
    trigger: "POST /_clock/set_current_utc"
    algorithm: threshold
    formula: |
      For each Claim in {REFERRED, LIABILITY_ASSESSED, DEMAND_ISSUED, ARBITRATION}:
        if clock_now >= statute_deadline: claim -> STATUTE_EXPIRED (with declared cascades)
      For each Demand in ISSUED with outcome null:
        if clock_now >= response_due_at: demand -> EXPIRED
    input_set: "all non-terminal Claims and all open Demands, evaluated against the new clock value"
    precision: "instant comparison; deadline is inclusive (>=) i.e. expired at the deadline instant"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers present and valid"
    error_id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER
    http_status: 400
    applies_to: all
  - priority: 2
    category: auth
    check: "Role is permitted for this endpoint (per §1.7)"
    error_id: ERR_FORBIDDEN_FOR_ROLE
    http_status: 403
    applies_to: all
  - priority: 3
    category: existence
    check: "Referenced resources exist (validated left-to-right in path, then body FKs)"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: all resource endpoints
  - priority: 4
    category: auth
    check: "CarrierUser may only act on a Claim whose carrier_id == X-User-ID (refer/withdraw/accept/decline/add-document)"
    error_id: ERR_NOT_CLAIM_OWNER
    http_status: 403
    applies_to: "CarrierUser-owned claim actions"
  - priority: 5
    category: business_constraint
    check: "Request body is well-formed (types, enum members, positive amounts, 0<=liability_pct<=100, hearing_start<hearing_end)"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: all writes
  - priority: 6
    category: business_constraint
    check: "Settlement approver's X-User-ID must differ from proposed_by_user_id (segregation of duties)"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /subro/settlements/{id}/approve"
  - priority: 7
    category: state
    check: "Target resource in a state that permits the transition"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: all transition endpoints
  - priority: 8
    category: business_referential
    check: "Arbitration filing: adverse_party.is_arbitration_eligible == true AND a DISPUTED Demand exists for the claim"
    error_id: "ERR_ADVERSE_NOT_ARBITRABLE (eligibility) / ERR_DEMAND_NOT_DISPUTED (no disputed demand)"
    http_status: 409
    applies_to: "POST /subro/claims/{id}/arbitrations"
  - priority: 9
    category: business_temporal
    check: "Deadline/window checks: statute not expired at action time (claim referred with a past statute_deadline, never swept); arbitration filed before Demand.arbitration_window_due_at; no open Demand window on issue; hearing window respects HEARING_BUFFER_DAYS"
    error_id: "ERR_STATUTE_EXPIRED / ERR_ARBITRATION_WINDOW_CLOSED / ERR_DEMAND_WINDOW_OPEN / ERR_HEARING_WINDOW_CONFLICT"
    http_status: 409
    applies_to: "demand issue, arbitration file, schedule-hearing, assess-liability (statute)"
  - priority: 10
    category: business_fiscal
    check: "Settlement approval authority: settled_amount_cents <= MANAGER_AUTHORITY_CENTS"
    error_id: ERR_EXCEEDS_SETTLEMENT_AUTHORITY
    http_status: 409
    applies_to: "POST /subro/settlements/{id}/approve"
  - priority: 11
    category: business_fiscal
    check: "Recording a RecoveryPayment: cumulative CLEARED + this amount must not exceed claim.settled_amount_cents"
    error_id: ERR_PAYMENT_EXCEEDS_SETTLEMENT
    http_status: 422
    applies_to: "POST /subro/claims/{id}/recovery-payments"
  - priority: 12
    category: business_constraint
    check: "Carrier must be ACTIVE to refer a claim; CommissionStatement must be OPEN to finalize"
    error_id: "ERR_CARRIER_SUSPENDED / ERR_STATEMENT_NOT_OPEN"
    http_status: 409
    applies_to: "claim refer; statement finalize"
  - priority: 13
    category: business_constraint
    check: "OCC: expected_claim_version must equal Claim.version on settlement proposal"
    error_id: ERR_STALE_CLAIM_VERSION
    http_status: 412
    applies_to: "POST /subro/claims/{id}/settlements"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # --- Carrier ---
  - method: POST
    path: "/subro/carriers"
    description: "Create a carrier (vendor client)"
    roles: [RecoveryManager]
    code: 201
    input: [name, naic_code, commission_rate_bps, "commission_basis?"]
    output: Carrier
    side_effects: ["status=ACTIVE"]
  - method: GET
    path: "/subro/carriers/{carrier_id}"
    description: "Get a carrier"
    roles: [Any]
    code: 200
    input: []
    output: Carrier
    side_effects: []
  - method: POST
    path: "/subro/carriers/{carrier_id}/suspend"
    description: "Suspend a carrier"
    roles: [RecoveryManager]
    code: 200
    input: []
    output: Carrier
    side_effects: ["status=SUSPENDED"]

  # --- AdverseParty ---
  - method: POST
    path: "/subro/adverse-parties"
    description: "Create an adverse party"
    roles: [RecoverySpecialist, RecoveryManager]
    code: 201
    input: [name, adverse_carrier_name, is_arbitration_eligible, policy_limit_cents]
    output: AdverseParty
    side_effects: []
  - method: GET
    path: "/subro/adverse-parties/{adverse_party_id}"
    description: "Get an adverse party"
    roles: [Any]
    code: 200
    input: []
    output: AdverseParty
    side_effects: []

  # --- Claim ---
  - method: POST
    path: "/subro/claims"
    description: "Refer a claim (CarrierUser must own carrier_id)"
    roles: [CarrierUser, RecoverySpecialist]
    code: 201
    input: [carrier_id, adverse_party_id, claim_reference, loss_date, paid_loss_cents, deductible_cents, total_damages_cents, statute_deadline]
    output: Claim
    side_effects: ["status=REFERRED", "set referral_date = clock now"]
  - method: GET
    path: "/subro/claims/{claim_id}"
    description: "Get a claim (ledger fields included)"
    roles: [Any]
    code: 200
    input: []
    output: Claim
    side_effects: []
  - method: GET
    path: "/subro/claims"
    description: "List claims (reverse-reachability for Claim.carrier_id and Claim.adverse_party_id)"
    roles: [Any]
    code: 200
    input: ["carrier_id?", "adverse_party_id?", "status?", "limit?", "offset?"]
    output: Claim[]
    side_effects: []
  - method: POST
    path: "/subro/claims/{claim_id}/assess-liability"
    description: "Assess adverse liability; sets provisional recoverable"
    roles: [RecoverySpecialist]
    code: 200
    input: [liability_pct]
    output: Claim
    side_effects: ["REFERRED->LIABILITY_ASSESSED", "recompute provisional_recoverable_cents"]
  - method: POST
    path: "/subro/claims/{claim_id}/withdraw"
    description: "Carrier withdraws the referral"
    roles: [CarrierUser]
    code: 200
    input: []
    output: Claim
    side_effects: ["->WITHDRAWN", "cascade open Demand/Arbitration -> WITHDRAWN"]
  - method: POST
    path: "/subro/claims/{id}/documents"
    description: "Attach a document to a claim (append-only)"
    roles: [RecoverySpecialist, CarrierUser]
    code: 201
    input: [doc_type, title, uri]
    output: ClaimDocument
    side_effects: []
  - method: GET
    path: "/subro/claims/{id}/documents"
    description: "List a claim's documents (reverse-reachability for ClaimDocument.claim_id)"
    roles: [Any]
    code: 200
    input: ["limit?", "offset?"]
    output: ClaimDocument[]
    side_effects: []

  # --- Demand ---
  - method: POST
    path: "/subro/claims/{claim_id}/demands"
    description: "Issue a demand (claim LIABILITY_ASSESSED->DEMAND_ISSUED)"
    roles: [RecoverySpecialist]
    code: 201
    input: [amount_demanded_cents]
    output: Demand
    side_effects: ["Demand ISSUED", "set issued_at, response_due_at", "claim->DEMAND_ISSUED"]
  - method: GET
    path: "/subro/demands/{demand_id}"
    description: "Get a demand"
    roles: [Any]
    code: 200
    input: []
    output: Demand
    side_effects: []
  - method: GET
    path: "/subro/demands"
    description: "List demands (reverse-reachability for Demand.claim_id)"
    roles: [Any]
    code: 200
    input: ["claim_id?", "status?", "limit?", "offset?"]
    output: Demand[]
    side_effects: []
  - method: POST
    path: "/subro/demands/{demand_id}/record-response"
    description: "Record adverse response to a demand"
    roles: [RecoverySpecialist]
    code: 200
    input: [outcome]
    output: Demand
    side_effects: ["ISSUED->HONORED or ISSUED->DISPUTED (sets disputed_at, arbitration_window_due_at)"]

  # --- Arbitration ---
  - method: POST
    path: "/subro/claims/{claim_id}/arbitrations"
    description: "File intercompany arbitration (claim DEMAND_ISSUED->ARBITRATION)"
    roles: [RecoverySpecialist]
    code: 201
    input: [forum]
    output: Arbitration
    side_effects: ["Arbitration FILED", "claim->ARBITRATION"]
  - method: GET
    path: "/subro/arbitrations/{arbitration_id}"
    description: "Get an arbitration"
    roles: [Any]
    code: 200
    input: []
    output: Arbitration
    side_effects: []
  - method: GET
    path: "/subro/arbitrations"
    description: "List arbitrations (reverse-reachability for Arbitration.claim_id)"
    roles: [Any]
    code: 200
    input: ["claim_id?", "status?", "limit?", "offset?"]
    output: Arbitration[]
    side_effects: []
  - method: POST
    path: "/subro/arbitrations/{arbitration_id}/schedule-hearing"
    description: "Schedule the hearing window (FILED->AWAITING_RESPONSE; buffer-overlap check on adverse party)"
    roles: [RecoverySpecialist]
    code: 200
    input: [hearing_start, hearing_end]
    output: Arbitration
    side_effects: ["set hearing_start/hearing_end", "FILED->AWAITING_RESPONSE"]
  - method: POST
    path: "/subro/arbitrations/{arbitration_id}/rounds"
    description: "File a filing/response round (cyclic AWAITING_RESPONSE<->RESPONSE_FILED)"
    roles: [RecoverySpecialist]
    code: 200
    input: [note]
    output: Arbitration
    side_effects: ["append round", "increment round_count", "toggle AWAITING_RESPONSE<->RESPONSE_FILED"]
  - method: POST
    path: "/subro/arbitrations/{arbitration_id}/decide"
    description: "Forum issues a decision/award (->DECIDED)"
    roles: [RecoveryManager]
    code: 200
    input: [award_amount_cents]
    output: Arbitration
    side_effects: ["set award_amount_cents", "->DECIDED"]

  # --- Settlement ---
  - method: POST
    path: "/subro/claims/{claim_id}/settlements"
    description: "Propose a settlement (OCC on claim.version; supersedes prior PROPOSED)"
    roles: [RecoverySpecialist]
    code: 201
    input: [settled_amount_cents, expected_claim_version]
    output: Settlement
    side_effects: ["Settlement PROPOSED", "set proposed_by_user_id", "any prior PROPOSED settlement for claim -> SUPERSEDED", "increments Claim.version by 1"]
  - method: GET
    path: "/subro/settlements/{settlement_id}"
    description: "Get a settlement"
    roles: [Any]
    code: 200
    input: []
    output: Settlement
    side_effects: []
  - method: GET
    path: "/subro/settlements"
    description: "List settlements (reverse-reachability for Settlement.claim_id)"
    roles: [Any]
    code: 200
    input: ["claim_id?", "status?", "limit?", "offset?"]
    output: Settlement[]
    side_effects: []
  - method: POST
    path: "/subro/settlements/{settlement_id}/approve"
    description: "Manager approves (SoD + authority boundary)"
    roles: [RecoveryManager]
    code: 200
    input: []
    output: Settlement
    side_effects: ["PROPOSED->APPROVED", "set approved_by_user_id"]
  - method: POST
    path: "/subro/settlements/{settlement_id}/reject"
    description: "Manager rejects"
    roles: [RecoveryManager]
    code: 200
    input: []
    output: Settlement
    side_effects: ["PROPOSED->REJECTED"]
  - method: POST
    path: "/subro/settlements/{settlement_id}/accept"
    description: "Carrier accepts an approved settlement (cascades claim->SETTLED)"
    roles: [CarrierUser]
    code: 200
    input: []
    output: Settlement
    side_effects: ["APPROVED->ACCEPTED", "claim->SETTLED; set claim.settled_amount_cents", "cascade open Arbitration -> WITHDRAWN"]

  # --- RecoveryPayment ---
  - method: POST
    path: "/subro/claims/{claim_id}/recovery-payments"
    description: "Record a recovery payment against a settled claim"
    roles: [FinanceOfficer]
    code: 201
    input: [amount_cents]
    output: RecoveryPayment
    side_effects: ["RECEIVED", "set received_at"]
  - method: GET
    path: "/subro/recovery-payments/{recovery_payment_id}"
    description: "Get a recovery payment (allocation fields included)"
    roles: [Any]
    code: 200
    input: []
    output: RecoveryPayment
    side_effects: []
  - method: GET
    path: "/subro/recovery-payments"
    description: "List recovery payments (reverse-reachability for RecoveryPayment.claim_id)"
    roles: [Any]
    code: 200
    input: ["claim_id?", "status?", "limit?", "offset?"]
    output: RecoveryPayment[]
    side_effects: []
  - method: POST
    path: "/subro/recovery-payments/{recovery_payment_id}/clear"
    description: "Clear the payment: run waterfall, cascade to claim & deductible reimbursement"
    roles: [FinanceOfficer]
    code: 200
    input: []
    output: RecoveryPayment
    side_effects: ["RECEIVED->CLEARED", "waterfall allocation", "cascade claim ledger + RECOVERED", "create DeductibleReimbursement (PENDING) if alloc_deductible>0"]
  - method: POST
    path: "/subro/recovery-payments/{recovery_payment_id}/reverse"
    description: "Reverse a payment (compensation: back out allocation, claw back reimbursement)"
    roles: [FinanceOfficer]
    code: 200
    input: []
    output: RecoveryPayment
    side_effects: ["CLEARED->REVERSED (or RECEIVED->BOUNCED)", "compensate claim ledger", "RECOVERED->SETTLED if under-collected", "reimbursement -> CLAWED_BACK"]

  # --- DeductibleReimbursement ---
  - method: GET
    path: "/subro/deductible-reimbursements/{deductible_reimbursement_id}"
    description: "Get a deductible reimbursement"
    roles: [Any]
    code: 200
    input: []
    output: DeductibleReimbursement
    side_effects: []
  - method: GET
    path: "/subro/deductible-reimbursements"
    description: "List deductible reimbursements (reverse-reachability for claim_id AND recovery_payment_id)"
    roles: [Any]
    code: 200
    input: ["claim_id?", "recovery_payment_id?", "status?", "limit?", "offset?"]
    output: DeductibleReimbursement[]
    side_effects: []
  - method: POST
    path: "/subro/deductible-reimbursements/{deductible_reimbursement_id}/disburse"
    description: "Disburse the reimbursement to the insured"
    roles: [FinanceOfficer]
    code: 200
    input: []
    output: DeductibleReimbursement
    side_effects: ["PENDING->DISBURSED", "claim.deductible_reimbursed_cents += amount_cents"]

  # --- CommissionStatement ---
  - method: POST
    path: "/subro/carriers/{carrier_id}/commission-statements"
    description: "Create a commission statement; sweeps RECOVERED claims into frozen lines"
    roles: [FinanceOfficer]
    code: 201
    input: [period_label]
    output: CommissionStatement
    side_effects: ["OPEN", "sweep RECOVERED claims for carrier into lines (Claim.created_at ASC)"]
  - method: GET
    path: "/subro/commission-statements/{commission_statement_id}"
    description: "Get a commission statement (report: lines + total)"
    roles: [Any]
    code: 200
    input: []
    output: CommissionStatement
    side_effects: []
  - method: GET
    path: "/subro/commission-statements"
    description: "List commission statements (reverse-reachability for CommissionStatement.carrier_id)"
    roles: [Any]
    code: 200
    input: ["carrier_id?", "status?", "limit?", "offset?"]
    output: CommissionStatement[]
    side_effects: []
  - method: POST
    path: "/subro/commission-statements/{commission_statement_id}/finalize"
    description: "Finalize (compute total, round-per-line-then-sum) or void a statement"
    roles: [RecoveryManager]
    code: 200
    input: ["void?"]
    output: CommissionStatement
    side_effects: ["OPEN->FINALIZED; set total_commission_cents", "or OPEN->VOID when void=true"]

  # --- Logical clock (test-driving) ---
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the server's logical clock. Startup default is 2026-07-01T00:00:00Z (never real wall-clock). Triggers statute_and_window_sweep."
    roles: [System]
    code: 200
    input: [to_iso8601]
    output: null
    side_effects: ["advance logical clock", "run statute_and_window_sweep (Claim STATUTE_EXPIRED, Demand EXPIRED, with declared cascades)"]

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER, http: 400, condition: "X-User-ID or X-User-Role header missing or malformed" }
  - { id: ERR_FORBIDDEN_FOR_ROLE, http: 403, condition: "Role valid but not permitted for this endpoint" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Referenced resource does not exist" }
  - { id: ERR_NOT_CLAIM_OWNER, http: 403, condition: "CarrierUser X-User-ID does not match the claim's carrier_id" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Malformed body: bad type/enum, non-positive amount, liability_pct out of 0..100, hearing_start>=hearing_end" }
  - { id: ERR_SEGREGATION_OF_DUTIES, http: 403, condition: "Settlement approver X-User-ID equals proposed_by_user_id" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Target resource not in a state that permits the requested transition" }
  - { id: ERR_ADVERSE_NOT_ARBITRABLE, http: 409, condition: "Arbitration filing on an adverse party with is_arbitration_eligible == false" }
  - { id: ERR_DEMAND_NOT_DISPUTED, http: 409, condition: "Arbitration filing with no DISPUTED demand on the claim" }
  - { id: ERR_STATUTE_EXPIRED, http: 409, condition: "Action attempted at/after the claim's statute_deadline" }
  - { id: ERR_ARBITRATION_WINDOW_CLOSED, http: 409, condition: "Arbitration filed at/after the disputed demand's arbitration_window_due_at" }
  - { id: ERR_DEMAND_WINDOW_OPEN, http: 409, condition: "Issuing a demand while an existing ISSUED demand's response window is still open" }
  - { id: ERR_HEARING_WINDOW_CONFLICT, http: 409, condition: "Scheduled hearing window is within HEARING_BUFFER_DAYS of another hearing on the same adverse party" }
  - { id: ERR_EXCEEDS_SETTLEMENT_AUTHORITY, http: 409, condition: "Settlement amount exceeds MANAGER_AUTHORITY_CENTS on approve" }
  - { id: ERR_PAYMENT_EXCEEDS_SETTLEMENT, http: 422, condition: "Cumulative cleared + this recovery payment exceeds claim.settled_amount_cents" }
  - { id: ERR_CARRIER_SUSPENDED, http: 409, condition: "Referring a claim to a SUSPENDED carrier" }
  - { id: ERR_STATEMENT_NOT_OPEN, http: 409, condition: "Finalizing a commission statement that is not OPEN, or with no lines" }
  - { id: ERR_STALE_CLAIM_VERSION, http: 412, condition: "expected_claim_version does not equal Claim.version on settlement proposal" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: RecoverySpecialist
    description: "Vendor recovery analyst: builds claims, liability, demands, documents, files arbitration & rounds, proposes settlements"
    identity: "opaque"
    exclusive_operations:
      - "POST /subro/claims/{id}/assess-liability"
      - "POST /subro/claims/{id}/demands"
      - "POST /subro/demands/{id}/record-response"
      - "POST /subro/claims/{id}/arbitrations"
      - "POST /subro/arbitrations/{id}/schedule-hearing"
      - "POST /subro/arbitrations/{id}/rounds"
      - "POST /subro/claims/{id}/settlements"
    shared_operations:
      - "POST /subro/adverse-parties (with RecoveryManager)"
      - "POST /subro/claims (with CarrierUser)"
      - "POST /subro/claims/{id}/documents (with CarrierUser)"

  - name: RecoveryManager
    description: "Vendor manager: creates carriers, approves/rejects settlements (SoD-bound), decides arbitrations, finalizes statements"
    identity: "opaque"
    exclusive_operations:
      - "POST /subro/carriers"
      - "POST /subro/carriers/{id}/suspend"
      - "POST /subro/settlements/{id}/approve"
      - "POST /subro/settlements/{id}/reject"
      - "POST /subro/arbitrations/{id}/decide"
      - "POST /subro/commission-statements/{id}/finalize"
    shared_operations:
      - "POST /subro/adverse-parties (with RecoverySpecialist)"

  - name: CarrierUser
    description: "Client carrier user: refers claims, accepts settlements, withdraws referrals, uploads documents (own carrier only)"
    identity: "entity_backed:Carrier"
    exclusive_operations:
      - "POST /subro/claims/{id}/withdraw"
      - "POST /subro/settlements/{id}/accept"
    shared_operations:
      - "POST /subro/claims (with RecoverySpecialist)"
      - "POST /subro/claims/{id}/documents (with RecoverySpecialist)"

  - name: FinanceOfficer
    description: "Vendor finance: records/clears/reverses recovery payments, disburses deductible reimbursements, opens commission statements"
    identity: "opaque"
    exclusive_operations:
      - "POST /subro/claims/{id}/recovery-payments"
      - "POST /subro/recovery-payments/{id}/clear"
      - "POST /subro/recovery-payments/{id}/reverse"
      - "POST /subro/deductible-reimbursements/{id}/disburse"
      - "POST /subro/carriers/{id}/commission-statements"

  - name: System
    description: "Automation for the logical clock and system-driven sweeps (statute/window expiry, cascades)"
    identity: "opaque"
    exclusive_operations:
      - "POST /_clock/set_current_utc"

  - name: Any
    description: "Any authenticated role may read (GET) resources"
    identity: "opaque"
    shared_operations:
      - "GET /subro/carriers/{id}"
      - "GET /subro/adverse-parties/{id}"
      - "GET /subro/claims/{id}"
      - "GET /subro/claims"
      - "GET /subro/claims/{id}/documents"
      - "GET /subro/demands/{id}"
      - "GET /subro/demands"
      - "GET /subro/arbitrations/{id}"
      - "GET /subro/arbitrations"
      - "GET /subro/settlements/{id}"
      - "GET /subro/settlements"
      - "GET /subro/recovery-payments/{id}"
      - "GET /subro/recovery-payments"
      - "GET /subro/deductible-reimbursements/{id}"
      - "GET /subro/deductible-reimbursements"
      - "GET /subro/commission-statements/{id}"
      - "GET /subro/commission-statements"

