              as: AccountManager
              captures: { plc1_id: "$.data.id" }
            - call: "POST /ocs/sites"
              payload: { account_id: "${acct_id}", route_id: "${route_id}", site_name: "HQ Floor 4", headcount: 40, days_per_week: 5, consumption_model: "HEADCOUNT_MODEL", service_minutes_estimate: 45 }
              as: AccountManager
              captures: { site2_id: "$.data.id" }
            - call: "POST /ocs/sites/${site2_id}/size-and-plan"
              payload: { brew_style: "DRIP" }
              as: AccountManager
              captures: { site2_v: "$.data.version" }
            - call: "POST /ocs/equipment-placements"
              payload: { site_id: "${site2_id}", asset_id: "${asset2_id}", terms_type: "RENTAL", minimum_purchase_cents: 60000, min_term_months: 12, expected_site_version: "${site2_v}" }
