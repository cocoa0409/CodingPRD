            - call: "POST /wish-grant/wish-visits/${visit_id}/conclude"
              payload: { outcome: "COMPLETED", captured_true_wish: "three toy trucks", captured_wish_type: "RECEIVE_ITEM" }
              as: Volunteer
              as_user_id: "${v1_id}"
            - call: "GET /wish-grant/wishes/${wish_id}"
              as: WishCoordinator
              captures: { wish_v2: $.data.version }
            - call: "POST /wish-grant/donation-offers"
              payload: { partner_name: "ToyWorld", category: "RETAILER", valuation_method: "RETAIL_BASIS", description: "toy truck", quantity_total: 10, unit_retail_cents: 12000, valid_from: "2026-08-01", valid_until: "2026-12-31" }
              as: InKindOfficer
              captures: { offer_id: $.data.id }
            - call: "POST /wish-grant/fulfillment-plans"
              payload: { wish_id: "${wish_id}", cash_cost_cents: 0, expected_wish_version: "${wish_v2}" }
              as: WishCoordinator
