    input: [seat_inventory_segment_id, row, seat_letter]
    output: SeatAssignment
    side_effects:
      - "price_charged_cents = 0 when an AncillaryOffer with offer_status == ACCEPTED exists on this booking for the segment's ancillary_product_id, else SeatInventorySegment.effective_price_cents"
      - "assignment_state HELD when the booking is HELD (held_seats +1), CONFIRMED when the booking is TICKETED or CHANGE_PENDING (sold_seats +1 and the seat SALE posted immediately)"
      - "recompute SeatInventorySegment.available_seats"
