# =============================================================================
# SCAFFOLD_CORNER_DESIGN.yaml — §1.9 Coverage Index for Non-Difficulty Tests
# Fiscal Sponsorship Administration. Breadth probe across the nine
# claim-extraction-guide sections. Difficulty-covered corners are emitted as
# excluded_because stubs. All numeric asserts are pre-computed literals.
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:
      - name: e_application_create_success
        claim_type: creation
        grounds: [entities.ProjectApplication, "endpoints[POST /fsa/applications]"]
        distinguishing_aspect: "POST with all required fields returns 201 with status DRAFT, submit_count 0, echoed inputs."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls:
            - { call: "POST /fsa/applications", payload: { project_name: "Alpha", mission_statement: "feed artists", requested_model: "COMPREHENSIVE", budget_estimate_cents: 5000000, contact_email: "a@x.org" }, as: Applicant, as_user_id: user_c_app1, captures: { app: $.data.id, st: $.data.status, sc: $.data.submit_count } }
          trigger: []
          assert:
            - "response 201; status == DRAFT; submit_count == 0; requested_model == COMPREHENSIVE"
            - "version == 1 and id is a UUID without type prefix"

      - name: e_application_requested_model_default
        claim_type: defaults
        grounds: [entities.ProjectApplication.fields.requested_model]
        distinguishing_aspect: "Omitting requested_model applies the default COMPREHENSIVE."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls:
            - { call: "POST /fsa/applications", payload: { project_name: "Beta", mission_statement: "m", budget_estimate_cents: 1000, contact_email: "b@x.org" }, as: Applicant, as_user_id: user_c_app2, captures: { rm: $.data.requested_model } }
          trigger: []
          assert:
            - "requested_model == COMPREHENSIVE (default applied)"

      - name: e_donation_anonymous_default_false
        claim_type: defaults
        grounds: [entities.Donation.fields.anonymous]
        distinguishing_aspect: "Omitting anonymous on donation create yields anonymous == false."
        test_recipe:
          setup: ["COMPREHENSIVE project ACTIVE"]
          setup_api_calls:
            - { call: "POST /fsa/applications", payload: { project_name: "An", mission_statement: "m", requested_model: "COMPREHENSIVE", budget_estimate_cents: 1000, contact_email: "an@x.org" }, as: Applicant, as_user_id: user_c_app3, captures: { app: $.data.id } }
            - { call: "POST /fsa/applications/${app}/submit", payload: {}, as: Applicant, as_user_id: user_c_app3 }
            - { call: "POST /fsa/applications/${app}/mission-score", payload: { purpose_pts: 50, benefit_pts: 50, capacity_pts: 100, risk_pts: 0, action: "ADVANCE" }, as: ProgramOfficer, as_user_id: user_po_1 }
            - { call: "POST /fsa/applications/${app}/compliance-decision", payload: { decision: "APPROVE", sponsorship_model: "COMPREHENSIVE" }, as: ComplianceOfficer, as_user_id: user_co_1, captures: { p: $.data.project_id, ag: $.data.agreement_id } }
            - { call: "POST /fsa/agreements/${ag}/countersign", payload: {}, as: Applicant, as_user_id: user_c_app3 }
          trigger:
            - { call: "POST /fsa/projects/${p}/donations", payload: { amount_cents: 5000, donor_name: "D", donor_email: "d@x.org", payment_method: "CARD" }, as: Donor, as_user_id: user_donor_1, captures: { anon: $.data.anonymous } }
          assert:
            - "anonymous == false (default applied)"

      - name: e_fund_available_computed_after_receive
        claim_type: computed_fields
        grounds: [entities.FundAccount.fields.available_cents, entities.Donation.fields.fee_cents]
        distinguishing_aspect: "Computed fields available_cents and fee_cents are derived at receive: 100,000 gross -> fee 8,000 -> available 92,000; any client-supplied value is irrelevant."
        test_recipe:
          setup: ["COMPREHENSIVE project ACTIVE"]
          setup_api_calls:
            - { call: "POST /fsa/applications", payload: { project_name: "Cf", mission_statement: "m", requested_model: "COMPREHENSIVE", budget_estimate_cents: 1000, contact_email: "cf@x.org" }, as: Applicant, as_user_id: user_c_app4, captures: { app: $.data.id } }
            - { call: "POST /fsa/applications/${app}/submit", payload: {}, as: Applicant, as_user_id: user_c_app4 }
            - { call: "POST /fsa/applications/${app}/mission-score", payload: { purpose_pts: 50, benefit_pts: 50, capacity_pts: 100, risk_pts: 0, action: "ADVANCE" }, as: ProgramOfficer, as_user_id: user_po_1 }
            - { call: "POST /fsa/applications/${app}/compliance-decision", payload: { decision: "APPROVE", sponsorship_model: "COMPREHENSIVE" }, as: ComplianceOfficer, as_user_id: user_co_1, captures: { p: $.data.project_id, ag: $.data.agreement_id, f: $.data.fund_account_id } }
            - { call: "POST /fsa/agreements/${ag}/countersign", payload: {}, as: Applicant, as_user_id: user_c_app4 }
            - { call: "POST /fsa/projects/${p}/donations", payload: { amount_cents: 100000, donor_name: "D", donor_email: "d@x.org", payment_method: "ACH" }, as: Donor, as_user_id: user_donor_1, captures: { d: $.data.id } }
          trigger:
            - { call: "POST /fsa/donations/${d}/receive", payload: {}, as: FinanceOfficer, as_user_id: user_fo_1, captures: { fee: $.data.fee_cents } }
            - { call: "GET /fsa/fund-accounts/${f}", payload: {}, as: FinanceOfficer, as_user_id: user_fo_1, captures: { avail: $.data.available_cents, fees: $.data.total_fees_charged_cents, recv: $.data.total_received_cents } }
          assert:
            - "fee_cents == 8000; total_received_cents == 100000; total_fees_charged_cents == 8000; available_cents == 92000"

      - name: e_system_fields_server_minted
        claim_type: system_fields
        grounds: [entities.ProjectApplication]
        distinguishing_aspect: "id is a server-minted UUID (no type prefix), created_at/updated_at are ISO8601 UTC with three fractional digits, version starts at 1."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls:
            - { call: "POST /fsa/applications", payload: { project_name: "Sf", mission_statement: "m", budget_estimate_cents: 1000, contact_email: "sf@x.org" }, as: Applicant, as_user_id: user_c_app5, captures: { idv: $.data.id, ver: $.data.version } }
          trigger: []
          assert:
            - "id matches UUID shape; version == 1; created_at and updated_at present in ISO8601 UTC millisecond format"

      - name: e_ledger_entry_immutable_shape
        claim_type: immutability
        grounds: [entities.FundLedgerEntry]
        distinguishing_aspect: "FundLedgerEntry has common_fields false: its representation carries id and created_at but no version and no updated_at, and no update endpoint exists."
        test_recipe:
          setup: ["COMPREHENSIVE project ACTIVE with one RECEIVED donation (two ledger entries posted)"]
          setup_api_calls:
            - { call: "POST /fsa/applications", payload: { project_name: "Li", mission_statement: "m", budget_estimate_cents: 1000, contact_email: "li@x.org" }, as: Applicant, as_user_id: user_c_app6, captures: { app: $.data.id } }
            - { call: "POST /fsa/applications/${app}/submit", payload: {}, as: Applicant, as_user_id: user_c_app6 }
            - { call: "POST /fsa/applications/${app}/mission-score", payload: { purpose_pts: 50, benefit_pts: 50, capacity_pts: 100, risk_pts: 0, action: "ADVANCE" }, as: ProgramOfficer, as_user_id: user_po_1 }
            - { call: "POST /fsa/applications/${app}/compliance-decision", payload: { decision: "APPROVE", sponsorship_model: "COMPREHENSIVE" }, as: ComplianceOfficer, as_user_id: user_co_1, captures: { p: $.data.project_id, ag: $.data.agreement_id, f: $.data.fund_account_id } }
            - { call: "POST /fsa/agreements/${ag}/countersign", payload: {}, as: Applicant, as_user_id: user_c_app6 }
            - { call: "POST /fsa/projects/${p}/donations", payload: { amount_cents: 10000, donor_name: "D", donor_email: "d@x.org", payment_method: "CARD" }, as: Donor, as_user_id: user_donor_1, captures: { d: $.data.id } }
            - { call: "POST /fsa/donations/${d}/receive", payload: {}, as: FinanceOfficer, as_user_id: user_fo_1 }
          trigger:
            - { call: "GET /fsa/fund-accounts/${f}/ledger-entries", payload: {}, as: FinanceOfficer, as_user_id: user_fo_1, captures: { t0: "$.data[0].entry_type", t1: "$.data[1].entry_type" } }
          assert:
            - "two entries in created_at ASC order: DONATION_CREDIT +10000 then FEE_DEBIT -800"
            - "each entry object has id and created_at but neither version nor updated_at keys"

      - name: e_not_found_family
        claim_type: not_found
        grounds: ["errors[ERR_APPLICATION_NOT_FOUND]", "errors[ERR_PROJECT_NOT_FOUND]", "errors[ERR_AGREEMENT_NOT_FOUND]", "errors[ERR_FUND_ACCOUNT_NOT_FOUND]", "errors[ERR_DONATION_NOT_FOUND]", "errors[ERR_RECEIPT_NOT_FOUND]", "errors[ERR_DISBURSEMENT_NOT_FOUND]", "errors[ERR_ENGAGEMENT_NOT_FOUND]", "errors[ERR_REVIEW_NOT_FOUND]", "errors[ERR_INCIDENT_NOT_FOUND]", "errors[ERR_EXIT_PLAN_NOT_FOUND]", "errors[ERR_TRANCHE_NOT_FOUND]", "errors[ERR_ASSESSMENT_NOT_FOUND]", "errors[ERR_LEDGER_ENTRY_NOT_FOUND]"]
        distinguishing_aspect: "Every id-bearing GET/section resource returns its domain-specific 404 for a well-formed but unknown UUID."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - { call: "GET /fsa/applications/11111111-1111-4111-8111-111111111111", payload: {}, as: SponsorAdmin, as_user_id: user_sa_1, captures: { e1: $.data.error_id } }
            - { call: "GET /fsa/projects/11111111-1111-4111-8111-111111111111", payload: {}, as: SponsorAdmin, as_user_id: user_sa_1, captures: { e2: $.data.error_id } }
            - { call: "GET /fsa/agreements/11111111-1111-4111-8111-111111111111", payload: {}, as: SponsorAdmin, as_user_id: user_sa_1, captures: { e3: $.data.error_id } }
            - { call: "GET /fsa/fund-accounts/11111111-1111-4111-8111-111111111111", payload: {}, as: SponsorAdmin, as_user_id: user_sa_1, captures: { e4: $.data.error_id } }
            - { call: "GET /fsa/donations/11111111-1111-4111-8111-111111111111", payload: {}, as: SponsorAdmin, as_user_id: user_sa_1, captures: { e5: $.data.error_id } }
            - { call: "GET /fsa/receipts/11111111-1111-4111-8111-111111111111", payload: {}, as: SponsorAdmin, as_user_id: user_sa_1, captures: { e6: $.data.error_id } }
            - { call: "GET /fsa/disbursement-requests/11111111-1111-4111-8111-111111111111", payload: {}, as: SponsorAdmin, as_user_id: user_sa_1, captures: { e7: $.data.error_id } }
            - { call: "GET /fsa/staff-engagements/11111111-1111-4111-8111-111111111111", payload: {}, as: SponsorAdmin, as_user_id: user_sa_1, captures: { e8: $.data.error_id } }
            - { call: "GET /fsa/compliance-reviews/11111111-1111-4111-8111-111111111111", payload: {}, as: SponsorAdmin, as_user_id: user_sa_1, captures: { e9: $.data.error_id } }
            - { call: "GET /fsa/risk-incidents/11111111-1111-4111-8111-111111111111", payload: {}, as: SponsorAdmin, as_user_id: user_sa_1, captures: { e10: $.data.error_id } }
            - { call: "GET /fsa/exit-plans/11111111-1111-4111-8111-111111111111", payload: {}, as: SponsorAdmin, as_user_id: user_sa_1, captures: { e11: $.data.error_id } }
            - { call: "GET /fsa/grant-tranches/11111111-1111-4111-8111-111111111111", payload: {}, as: SponsorAdmin, as_user_id: user_sa_1, captures: { e12: $.data.error_id } }
            - { call: "GET /fsa/fee-assessments/11111111-1111-4111-8111-111111111111", payload: {}, as: SponsorAdmin, as_user_id: user_sa_1, captures: { e13: $.data.error_id } }
            - { call: "GET /fsa/fund-ledger-entries/11111111-1111-4111-8111-111111111111", payload: {}, as: SponsorAdmin, as_user_id: user_sa_1, captures: { e14: $.data.error_id } }
          assert:
            - "e1..e14 == ERR_APPLICATION_NOT_FOUND, ERR_PROJECT_NOT_FOUND, ERR_AGREEMENT_NOT_FOUND, ERR_FUND_ACCOUNT_NOT_FOUND, ERR_DONATION_NOT_FOUND, ERR_RECEIPT_NOT_FOUND, ERR_DISBURSEMENT_NOT_FOUND, ERR_ENGAGEMENT_NOT_FOUND, ERR_REVIEW_NOT_FOUND, ERR_INCIDENT_NOT_FOUND, ERR_EXIT_PLAN_NOT_FOUND, ERR_TRANCHE_NOT_FOUND, ERR_ASSESSMENT_NOT_FOUND, ERR_LEDGER_ENTRY_NOT_FOUND respectively; all HTTP 404"

      - name: e_fk_integrity_donation_unknown_project
        claim_type: parent_relationships
        grounds: [entities.Donation.fields.project_id, "validations[priority=6]"]
        distinguishing_aspect: "Creating a donation under a non-existent project id fails existence validation with ERR_PROJECT_NOT_FOUND before any business rule runs."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - { call: "POST /fsa/projects/22222222-2222-4222-8222-222222222222/donations", payload: { amount_cents: 5000, donor_name: "D", donor_email: "d@x.org", payment_method: "CARD" }, as: Donor, as_user_id: user_donor_1, captures: { e: $.data.error_id } }
          assert:
            - "error_id == ERR_PROJECT_NOT_FOUND (HTTP 404); no Donation persisted"

      - name: e_pagination_filter_limit_offset
        claim_type: listing
        grounds: [response_envelope, "endpoints[GET /fsa/applications]"]
        distinguishing_aspect: "limit/offset/total_count/has_more interact correctly, and the status filter narrows the page contents."
        test_recipe:
          setup: ["three applications exist (all DRAFT)"]
          setup_api_calls:
            - { call: "POST /fsa/applications", payload: { project_name: "P1", mission_statement: "m", budget_estimate_cents: 1000, contact_email: "p1@x.org" }, as: Applicant, as_user_id: user_c_app7 }
            - { call: "POST /fsa/applications", payload: { project_name: "P2", mission_statement: "m", budget_estimate_cents: 1000, contact_email: "p2@x.org" }, as: Applicant, as_user_id: user_c_app8 }
            - { call: "POST /fsa/applications", payload: { project_name: "P3", mission_statement: "m", budget_estimate_cents: 1000, contact_email: "p3@x.org" }, as: Applicant, as_user_id: user_c_app9 }
          trigger:
            - { call: "GET /fsa/applications", payload: { limit: 2 }, as: ProgramOfficer, as_user_id: user_po_1 }
            - { call: "GET /fsa/applications", payload: { limit: 2, offset: 2 }, as: ProgramOfficer, as_user_id: user_po_1 }
            - { call: "GET /fsa/applications", payload: { status: "SUBMITTED" }, as: ProgramOfficer, as_user_id: user_po_1 }
          assert:
            - "page 1: 2 items, total_count == 3, has_more == true"
            - "page 2 (offset 2): 1 item, total_count == 3, has_more == false"
            - "status=SUBMITTED filter: 0 items, total_count == 0 (all three are DRAFT)"

  # ===========================================================================
  - section: state_machines
    instances:
      - name: sm_initial_states
        claim_type: initial_state
        grounds: [state_machines.ProjectApplication, state_machines.Donation, state_machines.StaffEngagement, state_machines.ComplianceReview, state_machines.RiskIncident, state_machines.ExitPlan, state_machines.GrantTranche]
        distinguishing_aspect: "Each entity is created in its declared initial state: DRAFT, PLEDGED, PROPOSED, OPEN, REPORTED, PROPOSED, ISSUED."
        test_recipe:
          setup: ["COMPREHENSIVE project ACTIVE; PRE_APPROVED_GRANT project ACTIVE"]
          setup_api_calls:
            - { call: "POST /fsa/applications", payload: { project_name: "IS1", mission_statement: "m", requested_model: "COMPREHENSIVE", budget_estimate_cents: 1000, contact_email: "is1@x.org" }, as: Applicant, as_user_id: user_c_is1, captures: { app1: $.data.id, st_app: $.data.status } }
            - { call: "POST /fsa/applications/${app1}/submit", payload: {}, as: Applicant, as_user_id: user_c_is1 }
            - { call: "POST /fsa/applications/${app1}/mission-score", payload: { purpose_pts: 50, benefit_pts: 50, capacity_pts: 100, risk_pts: 0, action: "ADVANCE" }, as: ProgramOfficer, as_user_id: user_po_1 }
            - { call: "POST /fsa/applications/${app1}/compliance-decision", payload: { decision: "APPROVE", sponsorship_model: "COMPREHENSIVE" }, as: ComplianceOfficer, as_user_id: user_co_1, captures: { p1: $.data.project_id, ag1: $.data.agreement_id } }
            - { call: "POST /fsa/agreements/${ag1}/countersign", payload: {}, as: Applicant, as_user_id: user_c_is1 }
            - { call: "POST /fsa/projects/${p1}/donations", payload: { amount_cents: 5000, donor_name: "D", donor_email: "d@x.org", payment_method: "CARD" }, as: Donor, as_user_id: user_donor_1, captures: { st_don: $.data.status } }
            - { call: "POST /fsa/projects/${p1}/staff-engagements", payload: { worker_name: "W", worker_email: "wis@x.org", engagement_type: "CONTRACTOR", compensation_type: "HOURLY", rate_cents: 1000, start_date: "2026-06-01" }, as: ProjectLead, as_user_id: "${p1}", captures: { st_eng: $.data.status } }
            - { call: "POST /fsa/projects/${p1}/compliance-reviews", payload: { review_type: "SCHEDULED" }, as: ComplianceOfficer, as_user_id: user_co_1, captures: { st_rev: $.data.status } }
            - { call: "POST /fsa/projects/${p1}/risk-incidents", payload: { category: "LIABILITY", severity: "LOW", description: "minor" }, as: ProjectLead, as_user_id: "${p1}", captures: { st_inc: $.data.status } }
            - { call: "POST /fsa/projects/${p1}/exit-plans", payload: { successor_entity_name: "X", successor_ein: "11-1111111", reason: "r" }, as: ProjectLead, as_user_id: "${p1}", captures: { st_exit: $.data.status } }
            - { call: "POST /fsa/applications", payload: { project_name: "IS2", mission_statement: "m", requested_model: "PRE_APPROVED_GRANT", budget_estimate_cents: 1000, contact_email: "is2@x.org" }, as: Applicant, as_user_id: user_c_is2, captures: { app2: $.data.id } }
            - { call: "POST /fsa/applications/${app2}/submit", payload: {}, as: Applicant, as_user_id: user_c_is2 }
            - { call: "POST /fsa/applications/${app2}/mission-score", payload: { purpose_pts: 50, benefit_pts: 50, capacity_pts: 100, risk_pts: 0, action: "ADVANCE" }, as: ProgramOfficer, as_user_id: user_po_1 }
            - { call: "POST /fsa/applications/${app2}/compliance-decision", payload: { decision: "APPROVE", sponsorship_model: "PRE_APPROVED_GRANT" }, as: ComplianceOfficer, as_user_id: user_co_1, captures: { ag2: $.data.agreement_id } }
            - { call: "POST /fsa/agreements/${ag2}/countersign", payload: {}, as: Applicant, as_user_id: user_c_is2 }
            - { call: "POST /fsa/agreements/${ag2}/grant-tranches", payload: { amount_cents: 100000, period_start: "2026-01-01", period_end: "2026-03-31", purpose: "q1" }, as: SponsorAdmin, as_user_id: user_sa_1, captures: { st_tr: $.data.status } }
          trigger: []
          assert:
            - "st_app == DRAFT; st_don == PLEDGED; st_eng == PROPOSED; st_rev == OPEN; st_inc == REPORTED; st_exit == PROPOSED; st_tr == ISSUED"

      - name: sm_mission_score_on_draft_rejected
        claim_type: invalid_transition
        grounds: [state_machines.ProjectApplication, "errors[ERR_APPLICATION_NOT_ACTIONABLE]"]
        distinguishing_aspect: "mission-score is only valid from SUBMITTED; on DRAFT it fails with ERR_APPLICATION_NOT_ACTIONABLE."
        test_recipe:
          setup: ["application in DRAFT"]
          setup_api_calls:
            - { call: "POST /fsa/applications", payload: { project_name: "DR", mission_statement: "m", budget_estimate_cents: 1000, contact_email: "dr@x.org" }, as: Applicant, as_user_id: user_c_dr, captures: { app: $.data.id } }
          trigger:
            - { call: "POST /fsa/applications/${app}/mission-score", payload: { purpose_pts: 50, benefit_pts: 50, capacity_pts: 100, risk_pts: 0, action: "ADVANCE" }, as: ProgramOfficer, as_user_id: user_po_1, captures: { e: $.data.error_id } }
          assert:
            - "error_id == ERR_APPLICATION_NOT_ACTIONABLE (HTTP 409); status remains DRAFT"

      - name: sm_withdrawn_terminal_lockdown
        claim_type: terminal_state_lockdown
        grounds: [state_machines.ProjectApplication]
        distinguishing_aspect: "WITHDRAWN is terminal: submit and mission-score both fail afterwards."
        test_recipe:
          setup: ["application WITHDRAWN from DRAFT"]
          setup_api_calls:
            - { call: "POST /fsa/applications", payload: { project_name: "WD", mission_statement: "m", budget_estimate_cents: 1000, contact_email: "wd@x.org" }, as: Applicant, as_user_id: user_c_wd, captures: { app: $.data.id } }
            - { call: "POST /fsa/applications/${app}/withdraw", payload: {}, as: Applicant, as_user_id: user_c_wd, captures: { st: $.data.status } }
          trigger:
            - { call: "POST /fsa/applications/${app}/submit", payload: {}, as: Applicant, as_user_id: user_c_wd, captures: { e1: $.data.error_id } }
            - { call: "POST /fsa/applications/${app}/mission-score", payload: { purpose_pts: 50, benefit_pts: 50, capacity_pts: 100, risk_pts: 0, action: "ADVANCE" }, as: ProgramOfficer, as_user_id: user_po_1, captures: { e2: $.data.error_id } }
          assert:
            - "withdraw from DRAFT succeeds: st == WITHDRAWN"
            - "e1 == ERR_APPLICATION_NOT_ACTIONABLE and e2 == ERR_APPLICATION_NOT_ACTIONABLE"

      - name: sm_paid_disbursement_terminal_lockdown
        claim_type: terminal_state_lockdown
        grounds: [state_machines.DisbursementRequest, "errors[ERR_DISBURSEMENT_STATE_INVALID]"]
        distinguishing_aspect: "PAID is terminal: cancel on a PAID request fails with ERR_DISBURSEMENT_STATE_INVALID."
        test_recipe:
          setup: ["COMPREHENSIVE project ACTIVE, funded 460,000 available; disbursement 30,000 PAID"]
          setup_api_calls:
            - { call: "POST /fsa/applications", payload: { project_name: "PD", mission_statement: "m", requested_model: "COMPREHENSIVE", budget_estimate_cents: 1000, contact_email: "pd@x.org" }, as: Applicant, as_user_id: user_c_pd, captures: { app: $.data.id } }
            - { call: "POST /fsa/applications/${app}/submit", payload: {}, as: Applicant, as_user_id: user_c_pd }
            - { call: "POST /fsa/applications/${app}/mission-score", payload: { purpose_pts: 50, benefit_pts: 50, capacity_pts: 100, risk_pts: 0, action: "ADVANCE" }, as: ProgramOfficer, as_user_id: user_po_1 }
            - { call: "POST /fsa/applications/${app}/compliance-decision", payload: { decision: "APPROVE", sponsorship_model: "COMPREHENSIVE" }, as: ComplianceOfficer, as_user_id: user_co_1, captures: { p: $.data.project_id, ag: $.data.agreement_id } }
            - { call: "POST /fsa/agreements/${ag}/countersign", payload: {}, as: Applicant, as_user_id: user_c_pd }
            - { call: "POST /fsa/projects/${p}/donations", payload: { amount_cents: 500000, donor_name: "D", donor_email: "d@x.org", payment_method: "ACH" }, as: Donor, as_user_id: user_donor_1, captures: { d: $.data.id } }
            - { call: "POST /fsa/donations/${d}/receive", payload: {}, as: FinanceOfficer, as_user_id: user_fo_1 }
            - { call: "POST /fsa/projects/${p}/disbursement-requests", payload: { amount_cents: 30000, purpose: "tools", payee_type: "VENDOR", payee_name: "ToolCo", spend_date: "2026-06-01" }, as: ProjectLead, as_user_id: "${p}", captures: { dr: $.data.id } }
            - { call: "POST /fsa/disbursement-requests/${dr}/submit", payload: {}, as: ProjectLead, as_user_id: "${p}" }
