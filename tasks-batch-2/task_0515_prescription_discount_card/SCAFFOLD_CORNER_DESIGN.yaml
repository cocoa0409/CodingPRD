scaffold_corner_design:

  # =========================================================================
  # Entities
  # =========================================================================
  - section: entities
    instances:
      - name: create_drug_returns_201_with_all_fields
        claim_type: Creation
        grounds:
          - entities.Drug
          - endpoints
        distinguishing_aspect: "POST /drugs with all required fields -> 201; response carries name, ndc, dosage_mg, form, awp_cents, is_controlled, id, created_at."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-15T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /drugs"
              payload: { name: "Metformin", ndc: "00093104101", dosage_mg: 500, form: "TABLET", awp_cents: 4000 }
              as: PlatformAdmin
              captures: { drug_id: $.data.id }
          assert:
            - "response.status_code == 201"
            - "Drug.${drug_id}.name == Metformin"
            - "Drug.${drug_id}.awp_cents == 4000"
            - "Drug.${drug_id}.is_controlled == false"

      - name: get_member_returns_computed_zero_savings
        claim_type: Computed Fields
        grounds:
          - entities.Member.fields.lifetime_savings_cents
          - entities.Member.fields.active_gold_membership_id
        distinguishing_aspect: "A freshly registered member's computed lifetime_savings_cents==0 and active_gold_membership_id==null."
        test_recipe:
          setup: ["One registered member, no claims, no gold membership."]
          setup_api_calls:
            - call: "POST /members"
              payload: { email: "fresh@x.com", full_name: "Fresh", state_code: "CA" }
              as: Anonymous
              captures: { m_id: $.data.id }
          trigger:
            - call: "GET /members/${m_id}"
              payload: {}
              as: Member
              as_user_id: "${m_id}"
          assert:
            - "Member.${m_id}.lifetime_savings_cents == 0"
            - "Member.${m_id}.active_gold_membership_id == null"

      - name: drug_not_found_returns_404
        claim_type: Not Found
        grounds:
          - errors[ERR_NOT_FOUND]
          - endpoints
        distinguishing_aspect: "GET /drugs/{id} for a non-existent UUID -> ERR_NOT_FOUND (404)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "GET /drugs/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: PlatformAdmin
              captures: { err: $.data.error_id }
          assert:
            - "response.status_code == 404"
            - "response.data.error_id == ERR_NOT_FOUND"

      - name: create_drug_missing_required_field_returns_invalid_request
        claim_type: Required Fields
        grounds:
          - errors[ERR_INVALID_REQUEST]
          - entities.Drug.fields.awp_cents
        distinguishing_aspect: "POST /drugs missing awp_cents -> ERR_INVALID_REQUEST (400)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /drugs"
              payload: { name: "Lisinopril", ndc: "00000000001", dosage_mg: 10, form: "TABLET" }
              as: PlatformAdmin
              captures: { err: $.data.error_id }
          assert:
            - "response.status_code == 400"
            - "response.data.error_id == ERR_INVALID_REQUEST"

      - name: create_drug_invalid_enum_form_returns_invalid_request
        claim_type: Type Constraints
        grounds:
          - errors[ERR_INVALID_REQUEST]
          - entities.Drug.fields.form
        distinguishing_aspect: "POST /drugs with form='POWDER' (outside {TABLET,CAPSULE,LIQUID,INJECTION}) -> ERR_INVALID_REQUEST (400)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /drugs"
              payload: { name: "Lisinopril", ndc: "00000000002", dosage_mg: 10, form: "POWDER", awp_cents: 3000 }
              as: PlatformAdmin
              captures: { err: $.data.error_id }
          assert:
            - "response.status_code == 400"
            - "response.data.error_id == ERR_INVALID_REQUEST"

      - name: create_drug_default_is_controlled_false
        claim_type: Defaults
        grounds:
          - entities.Drug.fields.is_controlled
        distinguishing_aspect: "Omitting is_controlled defaults it to false on the created Drug."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /drugs"
              payload: { name: "Amoxicillin", ndc: "00000000003", dosage_mg: 250, form: "CAPSULE", awp_cents: 2500 }
              as: PlatformAdmin
              captures: { drug_id: $.data.id }
          assert:
            - "Drug.${drug_id}.is_controlled == false"

      - name: system_fields_generated_on_member_create
        claim_type: System Fields
        grounds:
          - entities.Member
          - endpoints
        distinguishing_aspect: "Member id/created_at/version are server-minted; supplying them in the body is ignored and a fresh UUID id with version==1 is returned."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /members"
              payload: { email: "sys@x.com", full_name: "Sys", state_code: "CA" }
              as: Anonymous
              captures: { m_id: $.data.id, v: $.data.version }
          assert:
            - "Member.${m_id}.version == 1"

      - name: list_drugs_paginated_envelope
        claim_type: Listing
        grounds:
          - endpoints
          - response_envelope
        distinguishing_aspect: "GET /drugs returns an array response_type with pagination fields total_count and has_more."
        test_recipe:
          setup: ["Two drugs created."]
          setup_api_calls:
            - call: "POST /drugs"
              payload: { name: "DrugA", ndc: "11100000001", dosage_mg: 10, form: "TABLET", awp_cents: 1000 }
              as: PlatformAdmin
            - call: "POST /drugs"
              payload: { name: "DrugB", ndc: "11100000002", dosage_mg: 20, form: "TABLET", awp_cents: 2000 }
              as: PlatformAdmin
          trigger:
            - call: "GET /drugs"
              payload: {}
              as: Anonymous
          assert:
            - "response.response_type == array"
            - "response.meta.total_count == 2"
            - "response.meta.has_more == false"

      - name: insurance_estimate_immutable_no_version_field
        claim_type: Immutability
        grounds:
          - entities.InsuranceEstimate
        distinguishing_aspect: "InsuranceEstimate has common_fields:false — it exposes id and created_at but no version field and no update endpoint."
        test_recipe:
          setup: ["A RESOLVED comparison for an insured member."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-15T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /drugs"
              payload: { name: "Atorvastatin", ndc: "00071015523", dosage_mg: 20, form: "TABLET", awp_cents: 10000 }
              as: PlatformAdmin
              captures: { drug_id: $.data.id }
            - call: "POST /pharmacies"
              payload: { name: "PH", chain_code: "CVS", state_code: "CA", dispense_fee_cents: 200 }
              as: PlatformAdmin
              captures: { ph_id: $.data.id }
            - call: "POST /price-quotes"
              payload: { drug_id: "${drug_id}", pharmacy_id: "${ph_id}", cash_price_cents: 7000, discount_price_cents: 5500, gold_price_cents: 5200, effective_at: "2026-05-01T00:00:00Z", expires_at: "2027-01-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /members"
              payload: { email: "imm@x.com", full_name: "Imm", state_code: "CA", has_insurance: true }
              as: Anonymous
              captures: { m_id: $.data.id }
            - call: "POST /comparisons"
              payload: { member_id: "${m_id}", drug_id: "${drug_id}", state_code: "CA" }
              as: Member
              as_user_id: "${m_id}"
              captures: { cmp_id: $.data.id }
            - call: "POST /comparisons/${cmp_id}/run"
              payload: { member_id: "${m_id}" }
              as: Member
              as_user_id: "${m_id}"
          trigger:
            - call: "POST /comparisons/${cmp_id}/insurance-estimate"
              payload: { member_id: "${m_id}", copay_cents: 1000, deductible_remaining_cents: 0 }
              as: Member
              as_user_id: "${m_id}"
              captures: { est_id: $.data.id }
          assert:
            - "response.status_code == 201"
            - "InsuranceEstimate.${est_id}.recommended_path == DISCOUNT"

      - name: create_pharmacy_wrong_state_code_length_rejected
        claim_type: Type Constraints
        grounds:
          - errors[ERR_INVALID_REQUEST]
          - entities.Pharmacy.fields.state_code
        distinguishing_aspect: "POST /pharmacies with state_code='CAL' (not exactly 2 letters) -> ERR_INVALID_REQUEST (400)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /pharmacies"
              payload: { name: "Bad", chain_code: "X", state_code: "CAL", dispense_fee_cents: 100 }
              as: PlatformAdmin
              captures: { err: $.data.error_id }
          assert:
            - "response.status_code == 400"
            - "response.data.error_id == ERR_INVALID_REQUEST"

  # =========================================================================
  # State machines
  # =========================================================================
  - section: state_machines
    instances:
      - name: telehealth_referral_full_linear_lifecycle
        claim_type: Valid Transition
        grounds:
          - state_machines.TelehealthReferral.REQUESTED_to_SCHEDULED
          - state_machines.TelehealthReferral.SCHEDULED_to_COMPLETED
        distinguishing_aspect: "A referral walks REQUESTED -> SCHEDULED -> COMPLETED via schedule then complete; terminal state COMPLETED reached."
        test_recipe:
          setup: ["A RESOLVED comparison; a REQUESTED telehealth referral for a non-controlled drug."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-15T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /drugs"
              payload: { name: "Atorvastatin", ndc: "00071015523", dosage_mg: 20, form: "TABLET", awp_cents: 10000 }
              as: PlatformAdmin
              captures: { drug_id: $.data.id }
            - call: "POST /pharmacies"
              payload: { name: "PH", chain_code: "CVS", state_code: "CA", dispense_fee_cents: 200 }
              as: PlatformAdmin
              captures: { ph_id: $.data.id }
            - call: "POST /price-quotes"
              payload: { drug_id: "${drug_id}", pharmacy_id: "${ph_id}", cash_price_cents: 7000, discount_price_cents: 5500, gold_price_cents: 5200, effective_at: "2026-05-01T00:00:00Z", expires_at: "2027-01-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /members"
              payload: { email: "tr@x.com", full_name: "TR", state_code: "CA" }
              as: Anonymous
              captures: { m_id: $.data.id }
            - call: "POST /comparisons"
              payload: { member_id: "${m_id}", drug_id: "${drug_id}", state_code: "CA" }
              as: Member
              as_user_id: "${m_id}"
              captures: { cmp_id: $.data.id }
            - call: "POST /comparisons/${cmp_id}/run"
              payload: { member_id: "${m_id}" }
              as: Member
              as_user_id: "${m_id}"
            - call: "POST /telehealth-referrals"
              payload: { member_id: "${m_id}", comparison_id: "${cmp_id}", reason: "PRICE_TOO_HIGH" }
              as: Member
              as_user_id: "${m_id}"
              captures: { ref_id: $.data.id }
            - call: "POST /telehealth-referrals/${ref_id}/schedule"
              payload: {}
              as: PlatformAdmin
          trigger:
            - call: "POST /telehealth-referrals/${ref_id}/complete"
              payload: {}
              as: PlatformAdmin
          assert:
            - "TelehealthReferral.${ref_id}.status == COMPLETED"

      - name: complete_telehealth_from_requested_invalid_state
        claim_type: invalid_transition
        grounds:
          - state_machines.TelehealthReferral.SCHEDULED_to_COMPLETED
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "Calling complete on a REQUESTED (not SCHEDULED) referral -> ERR_INVALID_STATE (409); no side effects."
        test_recipe:
          setup: ["A REQUESTED telehealth referral (never scheduled)."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-15T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /drugs"
              payload: { name: "Atorvastatin", ndc: "00071015523", dosage_mg: 20, form: "TABLET", awp_cents: 10000 }
              as: PlatformAdmin
              captures: { drug_id: $.data.id }
            - call: "POST /pharmacies"
              payload: { name: "PH", chain_code: "CVS", state_code: "CA", dispense_fee_cents: 200 }
              as: PlatformAdmin
              captures: { ph_id: $.data.id }
            - call: "POST /price-quotes"
              payload: { drug_id: "${drug_id}", pharmacy_id: "${ph_id}", cash_price_cents: 7000, discount_price_cents: 5500, gold_price_cents: 5200, effective_at: "2026-05-01T00:00:00Z", expires_at: "2027-01-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /members"
              payload: { email: "tr2@x.com", full_name: "TR2", state_code: "CA" }
              as: Anonymous
              captures: { m_id: $.data.id }
            - call: "POST /comparisons"
              payload: { member_id: "${m_id}", drug_id: "${drug_id}", state_code: "CA" }
              as: Member
              as_user_id: "${m_id}"
              captures: { cmp_id: $.data.id }
            - call: "POST /comparisons/${cmp_id}/run"
              payload: { member_id: "${m_id}" }
              as: Member
              as_user_id: "${m_id}"
            - call: "POST /telehealth-referrals"
              payload: { member_id: "${m_id}", comparison_id: "${cmp_id}", reason: "NEW_PRESCRIPTION" }
              as: Member
              as_user_id: "${m_id}"
              captures: { ref_id: $.data.id }
          trigger:
            - call: "POST /telehealth-referrals/${ref_id}/complete"
              payload: {}
              as: PlatformAdmin
              captures: { err: $.data.error_id }
          assert:
            - "response.status_code == 409"
            - "response.data.error_id == ERR_INVALID_STATE"
            - "TelehealthReferral.${ref_id}.status == REQUESTED"

      - name: void_already_void_card_returns_invalid_state
        claim_type: idempotency
        grounds:
          - state_machines.DiscountCard.ISSUED_to_VOID
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "Voiding a card a second time (already VOID, owned by same member) -> ERR_INVALID_STATE (409)."
        test_recipe:
          setup: ["Member M owns a card already VOIDed once."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-15T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /drugs"
              payload: { name: "Atorvastatin", ndc: "00071015523", dosage_mg: 20, form: "TABLET", awp_cents: 10000 }
              as: PlatformAdmin
              captures: { drug_id: $.data.id }
            - call: "POST /pharmacies"
              payload: { name: "PH", chain_code: "CVS", state_code: "CA", dispense_fee_cents: 200 }
              as: PlatformAdmin
              captures: { ph_id: $.data.id }
            - call: "POST /price-quotes"
              payload: { drug_id: "${drug_id}", pharmacy_id: "${ph_id}", cash_price_cents: 7000, discount_price_cents: 5500, gold_price_cents: 5200, effective_at: "2026-05-01T00:00:00Z", expires_at: "2027-01-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /members"
              payload: { email: "vv@x.com", full_name: "VV", state_code: "CA" }
              as: Anonymous
              captures: { m_id: $.data.id }
            - call: "POST /comparisons"
              payload: { member_id: "${m_id}", drug_id: "${drug_id}", state_code: "CA" }
              as: Member
              as_user_id: "${m_id}"
              captures: { cmp_id: $.data.id }
            - call: "POST /comparisons/${cmp_id}/run"
              payload: { member_id: "${m_id}" }
              as: Member
              as_user_id: "${m_id}"
            - call: "POST /discount-cards"
              payload: { member_id: "${m_id}", comparison_id: "${cmp_id}" }
              as: Member
              as_user_id: "${m_id}"
              captures: { card_id: $.data.id }
            - call: "POST /discount-cards/${card_id}/void"
              payload: { member_id: "${m_id}" }
              as: Member
              as_user_id: "${m_id}"
          trigger:
            - call: "POST /discount-cards/${card_id}/void"
              payload: { member_id: "${m_id}" }
              as: Member
              as_user_id: "${m_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response.status_code == 409"
            - "response.data.error_id == ERR_INVALID_STATE"

      - name: gold_lapse_voids_gold_basis_cards_cascade
        claim_type: cascade_down
        grounds:
          - state_machines.GoldMembership.billing_status==PAID_to_billing_status==PAST_DUE
          - state_machines.DiscountCard.ISSUED_to_VOID
          - entities.DiscountCard.fields.pricing_basis
        distinguishing_aspect: "Lapsing a PAID gold membership voids the member's ISSUED GOLD-basis cards and revokes access; billing -> PAST_DUE."
        test_recipe:
          setup: ["Member M with ACTIVE gold (paid); a GOLD-basis ISSUED card."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-15T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /drugs"
              payload: { name: "Atorvastatin", ndc: "00071015523", dosage_mg: 20, form: "TABLET", awp_cents: 10000 }
              as: PlatformAdmin
              captures: { drug_id: $.data.id }
            - call: "POST /pharmacies"
              payload: { name: "PH", chain_code: "CVS", state_code: "CA", dispense_fee_cents: 200 }
              as: PlatformAdmin
              captures: { ph_id: $.data.id }
            - call: "POST /price-quotes"
              payload: { drug_id: "${drug_id}", pharmacy_id: "${ph_id}", cash_price_cents: 7000, discount_price_cents: 5500, gold_price_cents: 5200, effective_at: "2026-05-01T00:00:00Z", expires_at: "2027-01-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /members"
              payload: { email: "gl@x.com", full_name: "GL", state_code: "CA" }
              as: Anonymous
              captures: { m_id: $.data.id }
            - call: "POST /gold-memberships"
              payload: { member_id: "${m_id}", tier: "GOLD_INDIVIDUAL", coverage_start: "2026-05-01T00:00:00Z", coverage_end: "2026-12-31T00:00:00Z" }
              as: Member
              as_user_id: "${m_id}"
              captures: { gm_id: $.data.id }
            - call: "POST /gold-memberships/${gm_id}/record-payment"
              payload: {}
              as: PlatformAdmin
            - call: "POST /comparisons"
              payload: { member_id: "${m_id}", drug_id: "${drug_id}", state_code: "CA" }
              as: Member
              as_user_id: "${m_id}"
              captures: { cmp_id: $.data.id }
            - call: "POST /comparisons/${cmp_id}/run"
              payload: { member_id: "${m_id}" }
              as: Member
              as_user_id: "${m_id}"
            - call: "POST /discount-cards"
              payload: { member_id: "${m_id}", comparison_id: "${cmp_id}" }
              as: Member
              as_user_id: "${m_id}"
              captures: { card_id: $.data.id }
          trigger:
            - call: "POST /gold-memberships/${gm_id}/lapse"
              payload: {}
              as: PlatformAdmin
          assert:
            - "GoldMembership.${gm_id}.billing_status == PAST_DUE"
            - "GoldMembership.${gm_id}.access_status == REVOKED"
            - "DiscountCard.${card_id}.status == VOID"
            - "DiscountCard.${card_id}.pricing_basis == GOLD"
            - "Member.${m_id}.active_gold_membership_id == null"

      - name: copaycard_withdraw_releases_linked_not_applied
        claim_type: conditional_cascade
        grounds:
          - state_machines.CopayCard.ACTIVE_to_WITHDRAWN
          - state_machines.CopayLink.LINKED_to_RELEASED
        distinguishing_aspect: "Withdrawing an ACTIVE copay card releases only LINKED links (not yet APPLIED); the conditional cascade leaves APPLIED links untouched."
        test_recipe:
          setup: ["ACTIVE copay card with one LINKED link to a SUBMITTED claim (not yet adjudicated)."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-15T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /drugs"
              payload: { name: "Atorvastatin", ndc: "00071015523", dosage_mg: 20, form: "TABLET", awp_cents: 10000 }
              as: PlatformAdmin
              captures: { drug_id: $.data.id }
            - call: "POST /pharmacies"
              payload: { name: "PH", chain_code: "CVS", state_code: "CA", dispense_fee_cents: 200 }
              as: PlatformAdmin
              captures: { ph_id: $.data.id }
            - call: "POST /price-quotes"
              payload: { drug_id: "${drug_id}", pharmacy_id: "${ph_id}", cash_price_cents: 7000, discount_price_cents: 5500, gold_price_cents: 5200, effective_at: "2026-05-01T00:00:00Z", expires_at: "2027-01-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /members"
              payload: { email: "cw@x.com", full_name: "CW", state_code: "CA" }
              as: Anonymous
              captures: { m_id: $.data.id }
            - call: "POST /comparisons"
              payload: { member_id: "${m_id}", drug_id: "${drug_id}", state_code: "CA" }
              as: Member
              as_user_id: "${m_id}"
              captures: { cmp_id: $.data.id }
            - call: "POST /comparisons/${cmp_id}/run"
              payload: { member_id: "${m_id}" }
              as: Member
              as_user_id: "${m_id}"
            - call: "POST /discount-cards"
              payload: { member_id: "${m_id}", comparison_id: "${cmp_id}" }
              as: Member
              as_user_id: "${m_id}"
              captures: { card_id: $.data.id }
            - call: "POST /claims"
              payload: { discount_card_id: "${card_id}", pharmacy_id: "${ph_id}", quantity: 2 }
              as: PharmacyOperator
              captures: { claim_id: $.data.id }
            - call: "POST /copay-cards"
              payload: { sponsor_name: "Pfizer", drug_id: "${drug_id}", max_benefit_cents: 50000, per_fill_cap_cents: 4000 }
              as: CopayCardSponsor
              captures: { cc_id: $.data.id }
            - call: "POST /copay-links"
              payload: { copay_card_id: "${cc_id}", member_id: "${m_id}", claim_id: "${claim_id}" }
              as: Member
              as_user_id: "${m_id}"
              captures: { link_id: $.data.id }
          trigger:
            - call: "POST /copay-cards/${cc_id}/withdraw"
              payload: {}
              as: CopayCardSponsor
          assert:
            - "CopayCard.${cc_id}.status == WITHDRAWN"
            - "CopayLink.${link_id}.status == RELEASED"

      - name: terminal_claim_rejected_cannot_adjudicate
        claim_type: terminal_state_lockdown
        grounds:
          - state_machines.Claim.SUBMITTED_to_REJECTED
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "A REJECTED claim (terminal) cannot be adjudicated -> ERR_INVALID_STATE (409)."
        test_recipe:
          setup: ["A SUBMITTED claim that was rejected."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-15T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /drugs"
              payload: { name: "Atorvastatin", ndc: "00071015523", dosage_mg: 20, form: "TABLET", awp_cents: 10000 }
