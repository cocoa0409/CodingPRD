            - call: "PUT /tickets/${tk_id}/lines"
              payload: { service_line_ids: ["${svc_id}"] }
              as: Receptionist
          trigger:
            - call: "POST /tickets/${tk_id}/checkout"
              payload: {}
              as: Receptionist
              captures: { total: $.data.total_due_cents, st: $.data.status }
          assert:
            - "Ticket.total_due_cents == 3000"
            - "Ticket.status == PAID"
