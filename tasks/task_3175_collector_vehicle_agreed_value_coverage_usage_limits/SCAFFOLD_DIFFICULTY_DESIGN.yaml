              as: Member
              as_user_id: "${mb_id}"
              captures: { reg_b: $.data.status }
            - call: "GET /club-events/${ev_id}"
              payload: {}
              as: ClubCoordinator
              captures: { cnt: $.data.registered_count }
          assert:
            - "both registrations succeed with status REGISTERED (count == capacity is reached, not exceeded)"
            - "ClubEvent.registered_count == 2 == capacity (boundary: equality means FULL for the NEXT registration)"

