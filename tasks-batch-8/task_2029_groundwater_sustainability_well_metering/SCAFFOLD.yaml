# =============================================================================
# SCAFFOLD.yaml — Groundwater Sustainability & Well Metering Program
# Task 2029 — California groundwater sustainability agency (GSA)
# =============================================================================

scenario: |
  2029. Groundwater Sustainability & Well Metering Program (California groundwater agency): well registration & meter installation requirement, extraction reporting & allocation accounting, overdraft penalty & pumping fee, transfer/credit market between users, monitoring well data & basin condition, exemption for domestic wells, compliance enforcement & appeals, annual report to state

domain_name: groundwater-sustainability
api_prefix: "/"

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: quota_allocation
  complexity_layers:
    - dual_variant_calculation
    - rate_threshold_triggers
    - cascading_side_effects
    - optimistic_concurrency
  entity_topology: flat
  state_machine_shape: posture_driven
  # BasinConditionSnapshot's latest PUBLISHED condition (NORMAL|WATCH|CRITICAL) is a
  # derived aggregate posture that gates transfer settlement, pumping-fee multipliers,
  # and allocation curtailment. Entity-level machines additionally include a cyclic
  # revision loop (ExtractionReport) and branching appeals (PenaltyAssessment).
  relationship_patterns:
    - one_to_many
    - cross_aggregate
  role_model: segregation_of_duties
  consistency_model: immediate

# =============================================================================
# §1.0 Response Envelope (FIXED — verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# List ordering rule (applies to every GET list endpoint): sort by created_at ASC;
# ties broken by request-arrival order (the order the server accepted the creates).
# `id` is never used for ordering, ranking, or any other business decision.

# =============================================================================
# §1.1 Entity-Relationship Table (8 entities, flat topology)
# =============================================================================
entities:
  - name: WaterUserAccount
    parent: null
    common_fields: true   # id, created_at, updated_at, version (version starts 1, +1 per mutation incl. cascaded ones)
    fields:
      - { name: holder_name, type: string, source: input, description: "Account holder legal name" }
      - { name: account_type, type: enum, source: input, description: "AGRICULTURAL | MUNICIPAL | INDUSTRIAL | DOMESTIC", constraints: "enum membership enforced" }
      - { name: base_allocation_af, type: number, source: input, description: "Annual base groundwater allocation in acre-feet (af)", constraints: "> 0, 3 decimal places" }
      - { name: status, type: enum, source: system, description: "ACTIVE | SUSPENDED | CLOSED; initial ACTIVE", default: ACTIVE }
      - { name: current_water_year, type: integer, source: system, description: "Calendar year of the logical clock at account creation; advanced by close-water-year" }
      - { name: extracted_af_ytd, type: number, source: computed, description: "Sum of reported_af over this account's VERIFIED ExtractionReports whose water_year == current_water_year", default: 0 }
      - { name: pending_extraction_af, type: number, source: computed, description: "Sum of reported_af over this account's ExtractionReports in SUBMITTED status whose water_year == current_water_year (DISPUTED excluded)", default: 0 }
      - { name: credit_balance_af, type: number, source: computed, description: "Banked water credits: carryover grants plus settled inbound transfers, survives year close", default: 0 }
      - { name: transfer_out_af_ytd, type: number, source: computed, description: "Sum of quantity_af over SETTLED TransferOrders where this account is seller, current water year; reset at year close", default: 0 }
      - { name: transfer_reserved_af, type: number, source: computed, description: "Sum of quantity_af over this account's outbound TransferOrders in PROPOSED or ACCEPTED status (reservation against double-selling)", default: 0 }
      - { name: penalty_balance_cents, type: integer, source: computed, description: "Unpaid penalty ledger in cents; debited/credited by PenaltyAssessment transitions", default: 0 }

  - name: Well
    parent: null
    common_fields: true
    fields:
      - { name: account_id, type: string, source: input, description: "FK -> WaterUserAccount.id; owning account" }
      - { name: well_type, type: enum, source: input, description: "PRODUCTION | MONITORING | DOMESTIC", constraints: "enum membership enforced; immutable after creation" }
      - { name: location_description, type: string, source: input, description: "Free-text situs (parcel / lat-long description)" }
      - { name: minimum_threshold_ft, type: number, source: input, description: "Sustainability threshold: depth to water (ft) that must not be exceeded", constraints: "REQUIRED iff well_type == MONITORING; must be absent for PRODUCTION/DOMESTIC (else ERR_INVALID_REQUEST)" }
      - { name: meter_serial, type: string, source: system, description: "Meter identifier stamped by install-meter; null until installed", default: null }
      - { name: status, type: enum, source: system, description: "REGISTERED | METER_INSTALLED | ACTIVE | DECOMMISSIONED; initial REGISTERED", default: REGISTERED }

  - name: ExtractionReport
    parent: null
    common_fields: true
    fields:
      - { name: well_id, type: string, source: input, description: "FK -> Well.id; reported well (must be PRODUCTION and ACTIVE)" }
      - { name: water_year, type: integer, source: input, description: "Water year of the reported period", constraints: "must equal owning account's current_water_year (ERR_REPORT_YEAR_MISMATCH)" }
      - { name: month, type: integer, source: input, description: "Calendar month of the reported period", constraints: "integer 1..12" }
      - { name: reported_af, type: number, source: input, description: "Metered extraction for the period in acre-feet", constraints: ">= 0, 3 decimal places" }
      - { name: late_flag, type: boolean, source: computed, description: "True iff logical clock at submission >= 16th 00:00 UTC of the month following (water_year, month); recomputed on resubmit" }
      - { name: fee_cents, type: integer, source: computed, description: "Pumping fee stamped at VERIFIED transition via report_fee_cents; null while unverified", default: null }
      - { name: amendment_count, type: integer, source: system, description: "Number of resubmissions (DISPUTED -> SUBMITTED)", default: 0 }
      - { name: status, type: enum, source: system, description: "SUBMITTED | VERIFIED | DISPUTED; initial SUBMITTED; VERIFIED terminal", default: SUBMITTED }

  - name: TransferOrder
    parent: null
    common_fields: true
    fields:
      - { name: seller_account_id, type: string, source: input, description: "FK -> WaterUserAccount.id; selling account" }
      - { name: buyer_account_id, type: string, source: input, description: "FK -> WaterUserAccount.id; buying account (must differ from seller)" }
      - { name: quantity_af, type: number, source: input, description: "Water quantity transferred, acre-feet", constraints: "> 0, 3 decimal places" }
      - { name: unit_price_cents, type: integer, source: input, description: "Agreed price per acre-foot in cents (informational; the agency does not clear payments)", constraints: ">= 0" }
      - { name: effective_start_date, type: string, source: input, description: "First date (YYYY-MM-DD) of the buyer's extraction coverage window; half-open [start, end)" }
      - { name: effective_end_date, type: string, source: input, description: "End date (YYYY-MM-DD), exclusive; must be strictly after effective_start_date" }
      - { name: expires_at, type: datetime, source: system, description: "created_at + 72 hours; PROPOSED orders expire when logical clock passes this instant" }
      - { name: settled_at, type: datetime, source: system, description: "Logical-clock timestamp of settlement; null until SETTLED", default: null }
      - { name: status, type: enum, source: system, description: "PROPOSED | ACCEPTED | SETTLED | REJECTED | CANCELLED | EXPIRED; initial PROPOSED", default: PROPOSED }

  - name: MonitoringReading
    parent: null
    common_fields: false   # append-only event log: id + created_at only; no update/delete endpoints
    fields:
      - { name: well_id, type: string, source: input, description: "FK -> Well.id; must reference an ACTIVE MONITORING well" }
      - { name: measured_at, type: datetime, source: input, description: "Measurement instant (ISO8601 UTC)", constraints: "must not be after the logical clock (else ERR_INVALID_REQUEST)" }
      - { name: depth_to_water_ft, type: number, source: input, description: "Measured depth to water in feet; larger = worse", constraints: "> 0, 2 decimal places" }
      - { name: collector_name, type: string, source: input, description: "Field technician / contractor name" }

  - name: BasinConditionSnapshot
    parent: null
    common_fields: true
    fields:
      - { name: computed_at, type: datetime, source: system, description: "Logical-clock timestamp at snapshot creation" }
      - { name: eligible_well_count, type: integer, source: computed, description: "Count of ACTIVE MONITORING wells with a reading inside the 90-day recency window" }
      - { name: breached_well_count, type: integer, source: computed, description: "Eligible wells whose latest reading's depth_to_water_ft > minimum_threshold_ft" }
      - { name: breach_pct, type: number, source: computed, description: "100 * breached_well_count / eligible_well_count, 2 decimal places round_half_up; null when eligible_well_count == 0" }
      - { name: rolling_mean_depth_ft, type: number, source: computed, description: "Mean of latest eligible readings, 2 decimal places round_half_up; null when eligible_well_count == 0" }
      - { name: condition, type: enum, source: computed, description: "OFFICIAL gating condition from threshold_breach variant: NORMAL | WATCH | CRITICAL (NORMAL when eligible_well_count == 0)" }
      - { name: mean_condition, type: enum, source: computed, description: "Published variant from rolling_mean_depth_ft: NORMAL | WATCH | CRITICAL; null when eligible_well_count == 0" }
      - { name: status, type: enum, source: system, description: "DRAFT | PUBLISHED | DISCARDED; initial DRAFT", default: DRAFT }

  - name: PenaltyAssessment
    parent: null
    common_fields: true
    fields:
      - { name: account_id, type: string, source: input, description: "FK -> WaterUserAccount.id; assessed account" }
      - { name: reason, type: enum, source: input, description: "OVERDRAFT | LATE_REPORT | UNMETERED_PUMPING" }
      - { name: water_year, type: integer, source: input, description: "Water year the violation belongs to" }
      - { name: overdraft_af, type: number, source: input, description: "Assessed overdraft volume; REQUIRED iff reason == OVERDRAFT and must equal the computed overdraft (ERR_OVERDRAFT_AMOUNT_MISMATCH); must be absent otherwise" }
      - { name: amount_cents, type: integer, source: computed, description: "Penalty amount via overdraft_penalty_cents (OVERDRAFT) or flat fee constants (LATE_REPORT 10000, UNMETERED_PUMPING 50000)" }
      - { name: reduced_amount_cents, type: integer, source: system, description: "Reduced amount set by a REDUCED appeal decision; null otherwise", default: null }
      - { name: paid_amount_cents, type: integer, source: system, description: "Amount actually collected at pay transition; null until PAID", default: null }
      - { name: assessed_by, type: string, source: system, description: "X-User-ID of the EnforcementOfficer, or the literal 'system' when auto-created by the overdraft cascade" }
      - { name: decided_by, type: string, source: system, description: "X-User-ID of the deciding AppealsOfficer; null until decision", default: null }
      - { name: status, type: enum, source: system, description: "ASSESSED | APPEALED | UPHELD | REDUCED | OVERTURNED | PAID; initial ASSESSED", default: ASSESSED }

  - name: AnnualStateReport
    parent: null
    common_fields: true
    fields:
      - { name: water_year, type: integer, source: input, description: "Water year reported on; must be closed (close-water-year) and not already reported" }
      - { name: total_extracted_af, type: number, source: computed, description: "Sum of reported_af over VERIFIED ExtractionReports with this water_year (all accounts), 3 decimal places" }
      - { name: verified_report_count, type: integer, source: computed, description: "Count of VERIFIED ExtractionReports with this water_year" }
      - { name: overdraft_assessment_count, type: integer, source: computed, description: "Count of PenaltyAssessments with reason == OVERDRAFT and this water_year" }
      - { name: penalties_assessed_cents, type: integer, source: computed, description: "Sum of amount_cents over PenaltyAssessments with this water_year (any status)" }
      - { name: penalties_collected_cents, type: integer, source: computed, description: "Sum of paid_amount_cents over PenaltyAssessments with this water_year in status PAID" }
      - { name: total_pumping_fees_cents, type: integer, source: computed, description: "Sum of fee_cents over VERIFIED ExtractionReports with this water_year (sum of per-report rounded fees — never round the aggregate)" }
      - { name: final_basin_condition, type: enum, source: computed, description: "condition of the official-condition selector (latest PUBLISHED snapshot) at generation; null if none PUBLISHED" }
      - { name: avg_depth_ft, type: number, source: computed, description: "rolling_mean_depth_ft of the same selector snapshot; null if none PUBLISHED" }
      - { name: status, type: enum, source: system, description: "DRAFT | SUBMITTED | ACKNOWLEDGED; initial DRAFT", default: DRAFT }

# =============================================================================
# §1.2 State Machine Table (7 machines)
# =============================================================================
state_machines:
  - entity: WaterUserAccount
    initial_state: ACTIVE
    terminal_states: [CLOSED]
    transitions:
      - from: ACTIVE
        to: SUSPENDED
        trigger: "PATCH /water-user-accounts/{accountId} with status=SUSPENDED"
        actor: WaterMaster
        preconditions: ["expected_account_version matches current version (ERR_STALE_VERSION)"]
        side_effects: ["increments WaterUserAccount.version by 1"]
      - from: SUSPENDED
        to: ACTIVE
        trigger: "PATCH /water-user-accounts/{accountId} with status=ACTIVE"
        actor: WaterMaster
        preconditions: ["expected_account_version matches current version (ERR_STALE_VERSION)"]
        side_effects: ["increments WaterUserAccount.version by 1"]
      - from: ACTIVE
        to: CLOSED
        trigger: "PATCH /water-user-accounts/{accountId} with status=CLOSED"
        actor: WaterMaster
        preconditions:
          - "expected_account_version matches current version (ERR_STALE_VERSION)"
          - "No TransferOrder with buyer_account_id == this account in ACCEPTED status (ERR_ACCOUNT_NOT_ACTIVE)"
          - "No PenaltyAssessment for this account in APPEALED status (ERR_ACCOUNT_NOT_ACTIVE)"
        side_effects:
          - "All Wells of this account not DECOMMISSIONED -> DECOMMISSIONED"
          - "Outbound TransferOrders in PROPOSED -> CANCELLED (transfer_reserved_af released); in ACCEPTED -> REJECTED (transfer_reserved_af released)"
          - "increments WaterUserAccount.version by 1"
      - from: SUSPENDED
        to: CLOSED
        trigger: "PATCH /water-user-accounts/{accountId} with status=CLOSED"
        actor: WaterMaster
        preconditions: ["same as ACTIVE -> CLOSED"]
        side_effects: ["same as ACTIVE -> CLOSED"]

  - entity: Well
    initial_state: REGISTERED
    terminal_states: [DECOMMISSIONED]
    transitions:
      - from: REGISTERED
        to: METER_INSTALLED
        trigger: "POST /wells/{wellId}/install-meter"
        actor: "WellOwner (owner)"
        preconditions:
          - "well_type == PRODUCTION (else ERR_INVALID_WELL_TYPE)"
          - "status == REGISTERED (else ERR_INVALID_WELL_STATE)"
        side_effects: ["meter_serial set from input", "increments Well.version by 1"]
      - from: METER_INSTALLED
        to: ACTIVE
        trigger: "POST /wells/{wellId}/activate"
        actor: WaterMaster
        preconditions:
          - "Owning WaterUserAccount.status == ACTIVE (ERR_ACCOUNT_NOT_ACTIVE)"
          - "status == METER_INSTALLED and well_type == PRODUCTION (else ERR_INVALID_WELL_STATE)"
        side_effects: ["increments Well.version by 1"]
      - from: REGISTERED
        to: ACTIVE
        trigger: "POST /wells/{wellId}/activate (metering exemption path)"
        actor: WaterMaster
        preconditions:
          - "well_type IN {DOMESTIC, MONITORING} (PRODUCTION from REGISTERED -> ERR_INVALID_WELL_STATE)"
          - "Owning WaterUserAccount.status == ACTIVE (ERR_ACCOUNT_NOT_ACTIVE)"
        side_effects: ["increments Well.version by 1"]
        note: "Domestic-well metering exemption: DOMESTIC (and agency MONITORING) wells activate without a meter."
      - from: REGISTERED
        to: DECOMMISSIONED
        trigger: "POST /wells/{wellId}/decommission or account-close cascade"
        actor: "WellOwner (owner) | WaterMaster | system"
        preconditions: ["status != DECOMMISSIONED (else ERR_INVALID_WELL_STATE)"]
        side_effects: ["increments Well.version by 1"]
      - from: METER_INSTALLED
        to: DECOMMISSIONED
        trigger: "POST /wells/{wellId}/decommission or account-close cascade"
        actor: "WellOwner (owner) | WaterMaster | system"
        preconditions: ["status != DECOMMISSIONED"]
        side_effects: ["increments Well.version by 1"]
      - from: ACTIVE
        to: DECOMMISSIONED
        trigger: "POST /wells/{wellId}/decommission or account-close cascade"
        actor: "WellOwner (owner) | WaterMaster | system"
        preconditions: ["status != DECOMMISSIONED"]
        side_effects:
          - "increments Well.version by 1"
          - "If MONITORING well: excluded from future basin_condition_evaluation input sets; historical ExtractionReports remain verifiable"

  - entity: ExtractionReport
    initial_state: SUBMITTED
    terminal_states: [VERIFIED]
    transitions:
      - from: SUBMITTED
        to: VERIFIED
        trigger: "POST /extraction-reports/{reportId}/verify"
        actor: WaterMaster
        preconditions: ["status == SUBMITTED (else ERR_INVALID_REPORT_STATE)"]
        side_effects:
          - "account.pending_extraction_af -= reported_af; account.extracted_af_ytd += reported_af (available_water_af inputs)"
          - "stamp fee_cents via report_fee_cents (basin condition multiplier at verification instant)"
          - "overdraft crossing check (overdraft_penalty_cents): if account overdraft was <= 0 before this verification and is > 0 after, auto-create PenaltyAssessment(reason=OVERDRAFT, water_year=report.water_year, overdraft_af=computed overdraft, assessed_by='system') and debit account.penalty_balance_cents by its amount_cents"
          - "increments ExtractionReport.version by 1 and owning WaterUserAccount.version by 1"
      - from: SUBMITTED
        to: DISPUTED
        trigger: "POST /extraction-reports/{reportId}/dispute"
        actor: WaterMaster
        preconditions: ["status == SUBMITTED (else ERR_INVALID_REPORT_STATE)"]
        side_effects:
          - "account.pending_extraction_af -= reported_af"
          - "increments ExtractionReport.version by 1 and owning WaterUserAccount.version by 1"
      - from: DISPUTED
        to: SUBMITTED
        trigger: "POST /extraction-reports/{reportId}/resubmit (amended reported_af)"
        actor: "WellOwner (owner of well's account)"
        preconditions:
          - "status == DISPUTED (else ERR_INVALID_REPORT_STATE)"
          - "report.water_year == owning account.current_water_year (ERR_REPORT_YEAR_MISMATCH)"
        side_effects:
          - "reported_af replaced by input; amendment_count += 1; late_flag recomputed against logical clock"
          - "account.pending_extraction_af += new reported_af"
          - "increments ExtractionReport.version by 1 and owning WaterUserAccount.version by 1"
        note: "Revision loop: a report may cycle SUBMITTED -> DISPUTED -> SUBMITTED any number of times until verified."

  - entity: TransferOrder
    initial_state: PROPOSED
    terminal_states: [SETTLED, REJECTED, CANCELLED, EXPIRED]
    transitions:
      - from: PROPOSED
        to: ACCEPTED
        trigger: "POST /transfer-orders/{transferId}/accept"
        actor: "WellOwner (owner of buyer account)"
        preconditions: ["status == PROPOSED (else ERR_INVALID_TRANSFER_STATE)"]
        side_effects: ["increments TransferOrder.version by 1"]
      - from: PROPOSED
        to: CANCELLED
        trigger: "POST /transfer-orders/{transferId}/cancel"
        actor: "WellOwner (owner of seller account)"
        preconditions: ["status == PROPOSED (else ERR_INVALID_TRANSFER_STATE)"]
        side_effects:
          - "seller.transfer_reserved_af -= quantity_af (reservation release)"
          - "increments TransferOrder.version by 1 and seller WaterUserAccount.version by 1"
      - from: PROPOSED
        to: EXPIRED
        trigger: "system (logical-clock sweep when clock > expires_at; also fired for every PROPOSED order when a CRITICAL BasinConditionSnapshot is published)"
        actor: system
        preconditions: ["status == PROPOSED"]
        side_effects:
          - "seller.transfer_reserved_af -= quantity_af (reservation release)"
          - "increments TransferOrder.version by 1 and seller WaterUserAccount.version by 1"
      - from: ACCEPTED
        to: SETTLED
        trigger: "POST /transfer-orders/{transferId}/settle"
        actor: WaterMaster
        preconditions:
          - "status == ACCEPTED (else ERR_INVALID_TRANSFER_STATE)"
          - "Official basin condition (latest PUBLISHED snapshot selector) != CRITICAL (ERR_BASIN_CRITICAL_TRANSFERS_SUSPENDED)"
          - "Seller settled-variant available (available_water_af settled variant, with this order's quantity first removed from transfer_reserved_af) >= quantity_af (ERR_SETTLE_INSUFFICIENT_WATER)"
        side_effects:
          - "seller.transfer_reserved_af -= quantity_af; seller.transfer_out_af_ytd += quantity_af"
          - "buyer.credit_balance_af += quantity_af (available_water_af inputs)"
          - "settled_at stamped from logical clock"
          - "increments TransferOrder.version by 1 and both WaterUserAccount versions by 1"
      - from: ACCEPTED
        to: REJECTED
        trigger: "POST /transfer-orders/{transferId}/reject (or account-close cascade on seller)"
        actor: "WaterMaster | system"
        preconditions: ["status == ACCEPTED (else ERR_INVALID_TRANSFER_STATE)"]
        side_effects:
          - "seller.transfer_reserved_af -= quantity_af (reservation release)"
          - "increments TransferOrder.version by 1 and seller WaterUserAccount.version by 1"

  - entity: BasinConditionSnapshot
    initial_state: DRAFT
    terminal_states: [PUBLISHED, DISCARDED]
    transitions:
      - from: DRAFT
        to: PUBLISHED
        trigger: "POST /basin-condition-snapshots/{snapshotId}/publish"
        actor: WaterMaster
        preconditions: ["status == DRAFT (else ERR_INVALID_SNAPSHOT_STATE)"]
        side_effects:
          - "Becomes candidate for official-condition selector (latest PUBLISHED by computed_at DESC, tie-break created_at DESC)"
          - "If condition == CRITICAL: every TransferOrder in PROPOSED -> EXPIRED (market suspension), each releasing its seller reservation (transfer_reserved_af -= quantity_af)"
          - "increments BasinConditionSnapshot.version by 1"
      - from: DRAFT
        to: DISCARDED
        trigger: "system (supersede: creating a new snapshot discards the existing DRAFT, if any)"
        actor: system
        preconditions: ["status == DRAFT"]
        side_effects: ["increments BasinConditionSnapshot.version by 1"]

  - entity: PenaltyAssessment
    initial_state: ASSESSED
    terminal_states: [PAID, OVERTURNED]
    transitions:
      - from: ASSESSED
        to: PAID
        trigger: "POST /penalty-assessments/{assessmentId}/pay"
        actor: "WellOwner (owner of account)"
        preconditions: ["status IN {ASSESSED, UPHELD, REDUCED} (else ERR_INVALID_ASSESSMENT_STATE)"]
        side_effects:
          - "account.penalty_balance_cents -= amount_cents; paid_amount_cents = amount_cents"
          - "increments PenaltyAssessment.version by 1 and WaterUserAccount.version by 1"
      - from: ASSESSED
        to: APPEALED
        trigger: "POST /penalty-assessments/{assessmentId}/appeal"
        actor: "WellOwner (owner of account)"
        preconditions:
          - "status == ASSESSED (else ERR_INVALID_ASSESSMENT_STATE)"
          - "logical clock <= created_at + 30 days (ERR_APPEAL_WINDOW_CLOSED; boundary: exactly at deadline is still allowed)"
        side_effects: ["increments PenaltyAssessment.version by 1"]
      - from: APPEALED
        to: UPHELD
        trigger: "POST /penalty-assessments/{assessmentId}/decide with outcome=UPHELD"
        actor: AppealsOfficer
        preconditions:
          - "status == APPEALED (else ERR_INVALID_ASSESSMENT_STATE)"
          - "decider X-User-ID != assessed_by (ERR_SEGREGATION_OF_DUTIES)"
        side_effects:
          - "decided_by stamped; no change to penalty_balance_cents"
          - "increments PenaltyAssessment.version by 1"
      - from: APPEALED
        to: OVERTURNED
        trigger: "POST /penalty-assessments/{assessmentId}/decide with outcome=OVERTURNED"
        actor: AppealsOfficer
        preconditions: ["same as APPEALED -> UPHELD"]
        side_effects:
          - "decided_by stamped; account.penalty_balance_cents -= amount_cents (full refund)"
          - "increments PenaltyAssessment.version by 1 and WaterUserAccount.version by 1"
      - from: APPEALED
        to: REDUCED
        trigger: "POST /penalty-assessments/{assessmentId}/decide with outcome=REDUCED"
        actor: AppealsOfficer
        preconditions:
          - "same as APPEALED -> UPHELD"
          - "reduced_amount_cents present and 0 < reduced_amount_cents < amount_cents (else ERR_INVALID_REQUEST)"
        side_effects:
          - "decided_by stamped; reduced_amount_cents set; account.penalty_balance_cents -= (amount_cents - reduced_amount_cents) (partial refund)"
          - "increments PenaltyAssessment.version by 1 and WaterUserAccount.version by 1"
      - from: UPHELD
        to: PAID
        trigger: "POST /penalty-assessments/{assessmentId}/pay"
        actor: "WellOwner (owner of account)"
        preconditions: ["status IN {ASSESSED, UPHELD, REDUCED}"]
        side_effects:
          - "account.penalty_balance_cents -= amount_cents; paid_amount_cents = amount_cents"
          - "increments PenaltyAssessment.version by 1 and WaterUserAccount.version by 1"
      - from: REDUCED
        to: PAID
        trigger: "POST /penalty-assessments/{assessmentId}/pay"
        actor: "WellOwner (owner of account)"
        preconditions: ["status IN {ASSESSED, UPHELD, REDUCED}"]
        side_effects:
          - "account.penalty_balance_cents -= reduced_amount_cents; paid_amount_cents = reduced_amount_cents"
          - "increments PenaltyAssessment.version by 1 and WaterUserAccount.version by 1"

  - entity: AnnualStateReport
    initial_state: DRAFT
    terminal_states: [ACKNOWLEDGED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /annual-state-reports/{reportId}/submit"
        actor: WaterMaster
        preconditions: ["status == DRAFT (else ERR_INVALID_ANNUAL_REPORT_STATE)"]
        side_effects: ["increments AnnualStateReport.version by 1"]
      - from: SUBMITTED
        to: ACKNOWLEDGED
        trigger: "POST /annual-state-reports/{reportId}/acknowledge"
        actor: StateRegulator
        preconditions: ["status == SUBMITTED (else ERR_INVALID_ANNUAL_REPORT_STATE)"]
        side_effects: ["increments AnnualStateReport.version by 1"]

# =============================================================================
# §1.2.1 Concurrency Rules (OCC only; state-precondition lookalikes live in §1.2/§1.4)
# =============================================================================
concurrency_rules:
  - rule_id: account-update-stale-version
    parent_entity: WaterUserAccount
    write_endpoint: "PATCH /water-user-accounts/{accountId}"
    occ_field: expected_account_version
    description: |
      Updating a WaterUserAccount (base_allocation_af and/or status) is rejected when
      the account's version has advanced since the client last observed it. This
      captures the case where another writer (including the verify-report cascade,
      which mutates extracted_af_ytd/pending_extraction_af) has legitimately moved
      the account forward and the current writer's view is therefore stale.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table (9 rules)
# =============================================================================
calculations:
  - name: effective_allocation_af
    trigger: "evaluated inside available_water_af, overdraft_penalty_cents, and carryover_credit_af whenever an account's allocation is referenced"
    algorithm: threshold
    formula: |
      effective_allocation_af = round3(base_allocation_af * curtailment_factor)
      curtailment_factor = 0.80 when official basin condition == CRITICAL, else 1.00
      Official-condition selector: among BasinConditionSnapshots with status == PUBLISHED,
      take the one with greatest computed_at; tie-break created_at DESC;
      if none exists, condition defaults to NORMAL (factor 1.00).
      effective_allocation_af is NOT stored; it is derived at each use.
    input_set: "the account's base_allocation_af; the latest PUBLISHED BasinConditionSnapshot"
    constants:
      CURTAILMENT_FACTOR_CRITICAL: 0.80
    precision: "3 decimal places, round_half_up"

  - name: available_water_af
    trigger: "transfer proposal (forward_looking variant, seller sufficiency) and transfer settlement / year-end carryover (settled variant)"
    algorithm: forward_looking
    formula: |
      forward_looking variant (used ONLY by POST /transfer-orders for the seller):
        available = effective_allocation_af + credit_balance_af
                    - extracted_af_ytd - pending_extraction_af
                    - transfer_out_af_ytd - transfer_reserved_af
      settled variant (used by settle re-check, overdraft_penalty_cents basis, and carryover):
        available = effective_allocation_af + credit_balance_af
                    - extracted_af_ytd
                    - transfer_out_af_ytd - transfer_reserved_af
      At settlement, the order being settled is first removed from transfer_reserved_af
      (i.e. its own reservation does not count against it).
      Proposal accepts iff forward_looking available >= quantity_af (equality passes).
    input_set: "single WaterUserAccount; pending_extraction_af includes only SUBMITTED reports for the account's current_water_year (VERIFIED and DISPUTED excluded)"
    precision: "3 decimal places, round_half_up"
    variants:
      - name: forward_looking
        when: "transfer proposal seller-sufficiency check"
        difference: "subtracts pending_extraction_af (SUBMITTED unverified reports count as if they will verify)"
      - name: settled
        when: "settlement re-check, overdraft basis, year-end carryover"
        difference: "excludes pending_extraction_af (only VERIFIED extraction counts)"

  - name: report_fee_cents
    trigger: "ExtractionReport SUBMITTED -> VERIFIED transition"
    algorithm: tiered_pricing
    formula: |
      fee_cents = round_half_up(reported_af * FEE_CENTS_PER_AF * condition_multiplier)
      condition_multiplier from official basin condition at the verification instant:
        NORMAL 1.00 | WATCH 1.10 | CRITICAL 1.25
      PINNED ROUNDING ORDER (nested-rounding rule): the fee is rounded per report to
      integer cents at verification time; any annual total (AnnualStateReport.total_pumping_fees_cents)
      is the SUM of already-rounded per-report fees — never round(aggregate af * rate).
    input_set: "the single ExtractionReport being verified; official-condition selector at verification instant"
    constants:
      FEE_CENTS_PER_AF: 3000
      FEE_MULT_NORMAL: 1.00
      FEE_MULT_WATCH: 1.10
      FEE_MULT_CRITICAL: 1.25
    precision: "integer cents, round_half_up at the per-report step"

  - name: overdraft_penalty_cents
    trigger: "PenaltyAssessment creation with reason == OVERDRAFT (manual or auto-created by the verify cascade)"
    algorithm: tiered_pricing
    formula: |
      overdraft_af = round3(max(0, extracted_af_ytd - effective_allocation_af - credit_balance_af + transfer_out_af_ytd))
      tier1_limit_af = round3(0.10 * base_allocation_af)
      tier1_af = min(overdraft_af, tier1_limit_af)
      tier2_af = max(0, overdraft_af - tier1_limit_af)
      amount_cents = round_half_up((tier1_af * TIER1_RATE_CENTS + tier2_af * TIER2_RATE_CENTS) * condition_multiplier)
      condition_multiplier: same official-condition multiplier as report_fee_cents (1.00 / 1.10 / 1.25),
      evaluated at assessment-creation instant.
      Manual creation: input overdraft_af must equal computed overdraft_af (ERR_OVERDRAFT_AMOUNT_MISMATCH).
      LATE_REPORT flat fee: LATE_REPORT_FEE_CENTS. UNMETERED_PUMPING flat fee: UNMETERED_PUMPING_FEE_CENTS
      (flat fees are NOT multiplied by the basin-condition multiplier).
    input_set: "single WaterUserAccount's computed fields; official-condition selector at creation instant"
    constants:
      TIER1_LIMIT_FRACTION: 0.10
      TIER1_RATE_CENTS: 10000
      TIER2_RATE_CENTS: 25000
      LATE_REPORT_FEE_CENTS: 10000
      UNMETERED_PUMPING_FEE_CENTS: 50000
    precision: "af at 3 decimal places round_half_up; final amount integer cents round_half_up"

  - name: basin_condition_evaluation
    trigger: "BasinConditionSnapshot creation"
    algorithm: aggregation
    formula: |
      Input set: for each Well with well_type == MONITORING and status == ACTIVE,
      take its latest MonitoringReading by measured_at DESC (tie-break created_at DESC),
      but only if that reading's measured_at is within MONITORING_RECENCY_DAYS of the
      logical clock. Wells without an eligible reading are excluded.
      eligible_well_count = number of wells with an eligible reading.
      OFFICIAL variant (threshold_breach):
        breached = wells whose latest depth_to_water_ft > minimum_threshold_ft (strict >)
        breach_pct = round2(100 * breached / eligible_well_count)
        condition = CRITICAL if breach_pct >= 50, WATCH if breach_pct >= 25, else NORMAL
        (boundary: exactly 50.00 -> CRITICAL; exactly 25.00 -> WATCH)
      PUBLISHED variant (rolling_mean):
        rolling_mean_depth_ft = round2(mean of latest eligible depths)
        mean_condition = CRITICAL if mean >= 120.00, WATCH if mean >= 100.00, else NORMAL
      Empty input set (eligible_well_count == 0): condition = NORMAL; breach_pct,
      rolling_mean_depth_ft and mean_condition are null.
    input_set: "ACTIVE MONITORING wells; each well's latest reading inside the 90-day recency window"
    constants:
      MONITORING_RECENCY_DAYS: 90
      WATCH_BREACH_PCT: 25
      CRITICAL_BREACH_PCT: 50
      WATCH_MEAN_FT: 100.00
      CRITICAL_MEAN_FT: 120.00
    precision: "2 decimal places, round_half_up"
    variants:
      - name: threshold_breach
        when: "official gating condition (snapshot.condition) — drives curtailment, fee multiplier, transfer suspension"
        difference: "percentage of wells individually breaching their minimum_threshold_ft"
      - name: rolling_mean
        when: "published mean (snapshot.mean_condition, AnnualStateReport.avg_depth_ft)"
        difference: "arithmetic mean of depths across eligible wells; identical readings can yield a different condition than threshold_breach"

  - name: carryover_credit_af
    trigger: "POST /admin/close-water-year"
    algorithm: aggregation
    formula: |
      For every WaterUserAccount with status IN {ACTIVE, SUSPENDED} and
      current_water_year == closing water_year:
        unused_af = round3(max(0, effective_allocation_af - extracted_af_ytd - transfer_out_af_ytd))
        carryover_af = round3(min(unused_af, CARRYOVER_CAP_FRACTION * base_allocation_af))
        credit_balance_af += carryover_af
        extracted_af_ytd = 0; pending_extraction_af = 0; transfer_out_af_ytd = 0
        current_water_year += 1
        (account.version increments by 1 per rolled account)
      Uses the settled variant basis (pending/unverified extraction does not reduce carryover).
    input_set: "accounts with status IN {ACTIVE, SUSPENDED} and current_water_year == closing year"
    constants:
      CARRYOVER_CAP_FRACTION: 0.25
    precision: "3 decimal places, round_half_up"

  - name: monthly_transfer_cap_check
    trigger: "TransferOrder creation"
    algorithm: aggregation
    formula: |
      For each calendar month M intersected by the new order's half-open window
      [effective_start_date, effective_end_date):
        month_total(M) = sum of quantity_af over TransferOrders with
          status IN {PROPOSED, ACCEPTED, SETTLED} whose windows intersect M
        reject with ERR_MONTHLY_TRANSFER_CAP_EXCEEDED if
          month_total(M) + new quantity_af > MONTHLY_TRANSFER_CAP_AF
      Boundary: a month_total reaching exactly MONTHLY_TRANSFER_CAP_AF is allowed (<=).
    input_set: "TransferOrders with status IN {PROPOSED, ACCEPTED, SETTLED}; month buckets intersected by half-open window intersection"
    constants:
      MONTHLY_TRANSFER_CAP_AF: 5000
    precision: "3 decimal places, round_half_up"

  - name: report_late_flag
    trigger: "ExtractionReport creation and resubmission"
    algorithm: chronological
    formula: |
      due boundary for (water_year, month): the 16th 00:00:00 UTC of the following month
      (month 12 wraps to January of water_year + 1).
      late_flag = (logical clock >= that boundary)
      A report submitted at any instant of the 15th (through 23:59:59) is NOT late.
    input_set: "single report's (water_year, month); logical clock"
    precision: "second precision on the boundary instant"

  - name: annual_report_aggregates
    trigger: "AnnualStateReport creation (POST /annual-state-reports)"
    algorithm: aggregation
    formula: |
      total_extracted_af = round3(sum of reported_af over ExtractionReports with
        status == VERIFIED and water_year == report year)
      verified_report_count = count of the same set
      total_pumping_fees_cents = sum of fee_cents over the same set
        (sum of per-report rounded fees; never recompute from total_extracted_af)
      overdraft_assessment_count = count of PenaltyAssessments with reason == OVERDRAFT
        and water_year == report year
      penalties_assessed_cents = sum of amount_cents over PenaltyAssessments with
        water_year == report year (any status)
      penalties_collected_cents = sum of paid_amount_cents over PenaltyAssessments with
        water_year == report year and status == PAID
      final_basin_condition / avg_depth_ft = condition / rolling_mean_depth_ft of the
        official-condition selector snapshot at generation; null when none PUBLISHED
    input_set: "VERIFIED ExtractionReports of the year; all PenaltyAssessments of the year; latest PUBLISHED snapshot"
    precision: "af 3 decimal places round_half_up; cents integer"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present; X-User-Role is a declared role"
    error_id: ERR_MISSING_AUTH_CONTEXT
    http_status: 400
    applies_to: "all endpoints"
  - priority: 2
    category: auth
    check: "Caller role is listed in the endpoint's roles"
    error_id: ERR_FORBIDDEN_ROLE
    http_status: 403
    applies_to: "all endpoints"
  - priority: 3
    category: auth
    check: "Ownership: for WellOwner-scoped writes, X-User-ID equals the owning WaterUserAccount.id (well create/install-meter/decommission; report create/resubmit; transfer propose/accept/cancel; assessment pay/appeal)"
    error_id: ERR_OWNERSHIP_MISMATCH
    http_status: 403
    applies_to: "POST /wells; POST /wells/{id}/install-meter; POST /wells/{id}/decommission; POST /extraction-reports; POST /extraction-reports/{id}/resubmit; POST /transfer-orders; POST /transfer-orders/{id}/accept; POST /transfer-orders/{id}/cancel; POST /penalty-assessments/{id}/pay; POST /penalty-assessments/{id}/appeal"
  - priority: 4
    category: existence
    check: "Request shape: required fields present, types correct, enum membership, ranges (month 1..12, quantity_af > 0, depth > 0, end_date > start_date); conditional fields (minimum_threshold_ft iff MONITORING; overdraft_af iff reason == OVERDRAFT; reduced_amount_cents iff outcome == REDUCED); MonitoringReading.measured_at not after logical clock"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all endpoints with a request body"
  - priority: 5
    category: existence
    check: "Path ids exist, validated left-to-right, then body foreign keys (account_id, well_id, seller_account_id, buyer_account_id)"
    error_id: "ERR_ACCOUNT_NOT_FOUND | ERR_WELL_NOT_FOUND | ERR_REPORT_NOT_FOUND | ERR_TRANSFER_NOT_FOUND | ERR_ASSESSMENT_NOT_FOUND | ERR_SNAPSHOT_NOT_FOUND | ERR_ANNUAL_REPORT_NOT_FOUND"
    http_status: 404
    applies_to: "all endpoints with path ids or body FKs"
  - priority: 6
    category: state
    check: "WaterUserAccount is ACTIVE where required: well registration, well activation, transfer proposal (both parties)"
    error_id: ERR_ACCOUNT_NOT_ACTIVE
    http_status: 409
    applies_to: "POST /wells; POST /wells/{id}/activate; POST /transfer-orders"
  - priority: 7
    category: state
    check: "Well from-state valid for the transition (install-meter requires REGISTERED; activate requires METER_INSTALLED for PRODUCTION or REGISTERED for DOMESTIC/MONITORING; decommission requires non-DECOMMISSIONED)"
    error_id: ERR_INVALID_WELL_STATE
    http_status: 409
    applies_to: "POST /wells/{id}/install-meter; POST /wells/{id}/activate; POST /wells/{id}/decommission"
  - priority: 8
    category: state
    check: "Well status == ACTIVE when accepting extraction reports or monitoring readings"
    error_id: ERR_WELL_NOT_ACTIVE
    http_status: 409
    applies_to: "POST /extraction-reports; POST /monitoring-readings"
  - priority: 9
    category: state
    check: "ExtractionReport from-state: verify/dispute require SUBMITTED; resubmit requires DISPUTED"
    error_id: ERR_INVALID_REPORT_STATE
    http_status: 409
    applies_to: "POST /extraction-reports/{id}/verify; POST /extraction-reports/{id}/dispute; POST /extraction-reports/{id}/resubmit"
  - priority: 10
    category: state
    check: "TransferOrder from-state: accept/cancel require PROPOSED; settle/reject require ACCEPTED"
    error_id: ERR_INVALID_TRANSFER_STATE
    http_status: 409
    applies_to: "POST /transfer-orders/{id}/accept; POST /transfer-orders/{id}/cancel; POST /transfer-orders/{id}/settle; POST /transfer-orders/{id}/reject"
  - priority: 11
    category: state
    check: "PenaltyAssessment from-state: appeal requires ASSESSED; decide requires APPEALED; pay requires ASSESSED/UPHELD/REDUCED"
    error_id: ERR_INVALID_ASSESSMENT_STATE
    http_status: 409
    applies_to: "POST /penalty-assessments/{id}/appeal; POST /penalty-assessments/{id}/decide; POST /penalty-assessments/{id}/pay"
  - priority: 12
    category: state
    check: "BasinConditionSnapshot from-state: publish requires DRAFT"
    error_id: ERR_INVALID_SNAPSHOT_STATE
    http_status: 409
    applies_to: "POST /basin-condition-snapshots/{id}/publish"
  - priority: 13
    category: state
    check: "AnnualStateReport from-state: submit requires DRAFT; acknowledge requires SUBMITTED"
    error_id: ERR_INVALID_ANNUAL_REPORT_STATE
    http_status: 409
    applies_to: "POST /annual-state-reports/{id}/submit; POST /annual-state-reports/{id}/acknowledge"
  - priority: 14
    category: business_safety
    check: "Transfer settlement suspended while official basin condition == CRITICAL"
    error_id: ERR_BASIN_CRITICAL_TRANSFERS_SUSPENDED
    http_status: 409
    applies_to: "POST /transfer-orders/{id}/settle"
  - priority: 15
    category: business_safety
    check: "Segregation of duties: appeal decider's X-User-ID must differ from the assessment's assessed_by"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /penalty-assessments/{id}/decide"
  - priority: 16
    category: business_constraint
    check: "Well-type gate: extraction reports only for PRODUCTION wells; monitoring readings only for MONITORING wells; install-meter only for PRODUCTION wells"
    error_id: ERR_INVALID_WELL_TYPE
    http_status: 422
    applies_to: "POST /extraction-reports; POST /monitoring-readings; POST /wells/{id}/install-meter"
  - priority: 17
    category: business_constraint
    check: "At most one ExtractionReport per (well_id, water_year, month) across all statuses"
    error_id: ERR_DUPLICATE_REPORT
    http_status: 409
    applies_to: "POST /extraction-reports"
  - priority: 18
    category: business_constraint
    check: "report.water_year == owning account.current_water_year (create and resubmit)"
    error_id: ERR_REPORT_YEAR_MISMATCH
    http_status: 422
    applies_to: "POST /extraction-reports; POST /extraction-reports/{id}/resubmit"
  - priority: 19
    category: business_constraint
    check: "seller_account_id != buyer_account_id"
    error_id: ERR_SELF_TRANSFER
    http_status: 422
    applies_to: "POST /transfer-orders"
  - priority: 20
    category: business_constraint
    check: "Buyer inbound-window overlap: no two TransferOrders with the same buyer_account_id and status IN {PROPOSED, ACCEPTED, SETTLED} may have overlapping half-open windows [start, end); adjacency (existing.end == new.start) is allowed"
    error_id: ERR_TRANSFER_WINDOW_OVERLAP
    http_status: 409
    applies_to: "POST /transfer-orders"
  - priority: 21
    category: business_constraint
    check: "close-water-year: no ExtractionReport in SUBMITTED or DISPUTED status with water_year == closing year (any account)"
    error_id: ERR_CLOSE_YEAR_UNRESOLVED_REPORTS
    http_status: 409
    applies_to: "POST /admin/close-water-year"
  - priority: 22
    category: business_constraint
    check: "AnnualStateReport.water_year must be a closed year (close-water-year already executed for it)"
    error_id: ERR_WATER_YEAR_NOT_CLOSED
    http_status: 409
    applies_to: "POST /annual-state-reports"
  - priority: 23
    category: business_constraint
    check: "At most one AnnualStateReport per water_year"
    error_id: ERR_ANNUAL_REPORT_EXISTS
    http_status: 409
    applies_to: "POST /annual-state-reports"
  - priority: 24
    category: business_temporal
    check: "Appeal filing window: logical clock <= assessment.created_at + 30 days (exactly at deadline allowed)"
    error_id: ERR_APPEAL_WINDOW_CLOSED
    http_status: 409
    applies_to: "POST /penalty-assessments/{id}/appeal"
  - priority: 25
    category: business_fiscal
    check: "Manual OVERDRAFT assessment: input overdraft_af equals computed overdraft (3-decimal comparison)"
    error_id: ERR_OVERDRAFT_AMOUNT_MISMATCH
    http_status: 422
    applies_to: "POST /penalty-assessments"
  - priority: 26
    category: business_fiscal
    check: "Transfer proposal seller sufficiency: forward_looking available_water_af >= quantity_af (equality passes)"
    error_id: ERR_INSUFFICIENT_AVAILABLE_WATER
    http_status: 422
    applies_to: "POST /transfer-orders"
  - priority: 27
    category: business_fiscal
    check: "Basin-wide monthly transfer capacity: per intersected month, aggregate quantity <= 5000 af (equality passes)"
    error_id: ERR_MONTHLY_TRANSFER_CAP_EXCEEDED
    http_status: 422
    applies_to: "POST /transfer-orders"
  - priority: 28
    category: business_fiscal
    check: "Transfer settlement re-check: settled-variant available (order's own reservation first released) >= quantity_af"
    error_id: ERR_SETTLE_INSUFFICIENT_WATER
    http_status: 422
    applies_to: "POST /transfer-orders/{id}/settle"

# =============================================================================
# §1.5 API Endpoint Table (40 endpoints)
# =============================================================================
endpoints:
  # --- WaterUserAccount ---
  - method: POST
    path: "/water-user-accounts"
    description: "Onboard a water user account; current_water_year set from logical clock's calendar year"
    roles: [WaterMaster]
    code: 201
    input: [holder_name, account_type, base_allocation_af]
    output: WaterUserAccount
    side_effects: ["computed counters initialized to 0; status ACTIVE"]
  - method: GET
    path: "/water-user-accounts"
    description: "List accounts (created_at ASC, arrival-order tie-break)"
    roles: [WellOwner, WaterMaster, EnforcementOfficer, AppealsOfficer, StateRegulator]
    code: 200
    input: ["status?", "account_type?", "limit?", "offset?"]
    output: "WaterUserAccount[]"
    side_effects: []
  - method: GET
    path: "/water-user-accounts/{accountId}"
    description: "Get one account including computed ledger fields"
    roles: [WellOwner, WaterMaster, EnforcementOfficer, AppealsOfficer, StateRegulator]
    code: 200
    input: []
    output: WaterUserAccount
    side_effects: []
  - method: PATCH
    path: "/water-user-accounts/{accountId}"
    description: "Update base_allocation_af and/or status (ACTIVE/SUSPENDED/CLOSED transitions) under OCC"
    roles: [WaterMaster]
    code: 200
    input: ["base_allocation_af?", "status?", expected_account_version]
    output: WaterUserAccount
    side_effects: ["increments WaterUserAccount.version by 1", "on CLOSED: cascade per state machine (wells decommissioned, outbound open transfers cancelled/rejected)"]

  # --- Well ---
  - method: POST
    path: "/wells"
    description: "Register a well under an ACTIVE account (owner)"
    roles: [WellOwner]
    code: 201
    input: [account_id, well_type, location_description, "minimum_threshold_ft?"]
    output: Well
    side_effects: ["status REGISTERED"]
  - method: GET
    path: "/wells"
    description: "List wells; FK reverse-reachability for Well.account_id via account_id filter"
    roles: [WellOwner, WaterMaster, EnforcementOfficer, AppealsOfficer, StateRegulator]
    code: 200
    input: ["account_id?", "well_type?", "status?", "limit?", "offset?"]
    output: "Well[]"
    side_effects: []
  - method: GET
    path: "/wells/{wellId}"
    description: "Get one well"
    roles: [WellOwner, WaterMaster, EnforcementOfficer, AppealsOfficer, StateRegulator]
    code: 200
    input: []
    output: Well
    side_effects: []
  - method: POST
    path: "/wells/{wellId}/install-meter"
    description: "Record meter installation on a REGISTERED PRODUCTION well (owner)"
    roles: [WellOwner]
    code: 200
    input: [meter_serial]
    output: Well
    side_effects: ["REGISTERED -> METER_INSTALLED; meter_serial stamped"]
  - method: POST
    path: "/wells/{wellId}/activate"
    description: "Activate a well: METER_INSTALLED -> ACTIVE for PRODUCTION; REGISTERED -> ACTIVE for DOMESTIC/MONITORING (metering exemption)"
    roles: [WaterMaster]
    code: 200
    input: []
    output: Well
    side_effects: ["status -> ACTIVE"]
  - method: POST
    path: "/wells/{wellId}/decommission"
    description: "Decommission a non-terminal well"
    roles: [WellOwner, WaterMaster]
    code: 200
    input: []
    output: Well
    side_effects: ["status -> DECOMMISSIONED; monitoring wells leave future snapshot input sets"]

  # --- ExtractionReport ---
  - method: POST
    path: "/extraction-reports"
    description: "Submit a monthly extraction report for an ACTIVE PRODUCTION well (owner of well's account)"
    roles: [WellOwner]
    code: 201
    input: [well_id, water_year, month, reported_af]
    output: ExtractionReport
    side_effects: ["status SUBMITTED; late_flag computed; account.pending_extraction_af += reported_af"]
  - method: GET
    path: "/extraction-reports"
    description: "List extraction reports; FK reverse-reachability for ExtractionReport.well_id via well_id filter"
    roles: [WellOwner, WaterMaster, EnforcementOfficer, AppealsOfficer, StateRegulator]
    code: 200
    input: ["well_id?", "status?", "water_year?", "limit?", "offset?"]
    output: "ExtractionReport[]"
    side_effects: []
  - method: GET
    path: "/extraction-reports/{reportId}"
    description: "Get one extraction report"
    roles: [WellOwner, WaterMaster, EnforcementOfficer, AppealsOfficer, StateRegulator]
    code: 200
    input: []
    output: ExtractionReport
    side_effects: []
  - method: POST
    path: "/extraction-reports/{reportId}/verify"
    description: "Verify a SUBMITTED report"
    roles: [WaterMaster]
    code: 200
    input: []
    output: ExtractionReport
    side_effects: ["SUBMITTED -> VERIFIED; pending->extracted ledger move; fee_cents stamped via report_fee_cents; overdraft crossing may auto-create PenaltyAssessment (overdraft_penalty_cents) and debit penalty_balance_cents"]
  - method: POST
    path: "/extraction-reports/{reportId}/dispute"
    description: "Dispute a SUBMITTED report"
    roles: [WaterMaster]
    code: 200
    input: []
    output: ExtractionReport
    side_effects: ["SUBMITTED -> DISPUTED; account.pending_extraction_af -= reported_af"]
  - method: POST
    path: "/extraction-reports/{reportId}/resubmit"
    description: "Amend and resubmit a DISPUTED report (owner)"
    roles: [WellOwner]
    code: 200
    input: [reported_af]
    output: ExtractionReport
    side_effects: ["DISPUTED -> SUBMITTED; amendment_count += 1; late_flag recomputed; pending_extraction_af += new reported_af"]

  # --- TransferOrder ---
  - method: POST
    path: "/transfer-orders"
    description: "Propose a water transfer seller -> buyer (owner of seller account)"
    roles: [WellOwner]
    code: 201
    input: [seller_account_id, buyer_account_id, quantity_af, unit_price_cents, effective_start_date, effective_end_date]
    output: TransferOrder
    side_effects: ["status PROPOSED; expires_at = created_at + 72h; seller.transfer_reserved_af += quantity_af"]
  - method: GET
    path: "/transfer-orders"
    description: "List transfer orders; FK reverse-reachability for seller_account_id and buyer_account_id via filters"
    roles: [WellOwner, WaterMaster, EnforcementOfficer, AppealsOfficer, StateRegulator]
    code: 200
    input: ["seller_account_id?", "buyer_account_id?", "status?", "limit?", "offset?"]
    output: "TransferOrder[]"
    side_effects: []
  - method: GET
    path: "/transfer-orders/{transferId}"
    description: "Get one transfer order"
    roles: [WellOwner, WaterMaster, EnforcementOfficer, AppealsOfficer, StateRegulator]
    code: 200
    input: []
    output: TransferOrder
    side_effects: []
  - method: POST
    path: "/transfer-orders/{transferId}/accept"
    description: "Buyer accepts a PROPOSED order (owner of buyer account)"
    roles: [WellOwner]
    code: 200
    input: []
    output: TransferOrder
    side_effects: ["PROPOSED -> ACCEPTED"]
  - method: POST
    path: "/transfer-orders/{transferId}/cancel"
    description: "Seller cancels a PROPOSED order (owner of seller account)"
    roles: [WellOwner]
    code: 200
    input: []
    output: TransferOrder
    side_effects: ["PROPOSED -> CANCELLED; seller.transfer_reserved_af -= quantity_af"]
  - method: POST
    path: "/transfer-orders/{transferId}/settle"
    description: "Agency settles an ACCEPTED order (blocked while basin CRITICAL)"
    roles: [WaterMaster]
    code: 200
    input: []
    output: TransferOrder
    side_effects: ["ACCEPTED -> SETTLED; seller reservation released; seller.transfer_out_af_ytd += quantity_af; buyer.credit_balance_af += quantity_af; settled_at stamped"]
  - method: POST
    path: "/transfer-orders/{transferId}/reject"
    description: "Agency rejects an ACCEPTED order"
    roles: [WaterMaster]
    code: 200
    input: []
    output: TransferOrder
    side_effects: ["ACCEPTED -> REJECTED; seller.transfer_reserved_af -= quantity_af"]

  # --- MonitoringReading ---
  - method: POST
    path: "/monitoring-readings"
    description: "Record a depth reading for an ACTIVE MONITORING well"
    roles: [WaterMaster]
    code: 201
    input: [well_id, measured_at, depth_to_water_ft, collector_name]
    output: MonitoringReading
    side_effects: ["append-only; feeds basin_condition_evaluation"]
  - method: GET
    path: "/wells/{id}/monitoring-readings"
    description: "List readings of a well (FK reverse-reachability for MonitoringReading.well_id, sub-resource form)"
    roles: [WellOwner, WaterMaster, EnforcementOfficer, AppealsOfficer, StateRegulator]
    code: 200
    input: ["limit?", "offset?"]
    output: "MonitoringReading[]"
    side_effects: []

  # --- BasinConditionSnapshot ---
  - method: POST
    path: "/basin-condition-snapshots"
    description: "Compute a new DRAFT snapshot from current monitoring data (basin_condition_evaluation); supersedes any existing DRAFT"
    roles: [WaterMaster]
    code: 201
    input: []
    output: BasinConditionSnapshot
    side_effects: ["existing DRAFT (if any) -> DISCARDED; computed fields populated"]
  - method: GET
    path: "/basin-condition-snapshots"
    description: "List snapshots"
    roles: [WellOwner, WaterMaster, EnforcementOfficer, AppealsOfficer, StateRegulator]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: "BasinConditionSnapshot[]"
    side_effects: []
  - method: POST
    path: "/basin-condition-snapshots/{snapshotId}/publish"
    description: "Publish a DRAFT snapshot; publishing a CRITICAL condition suspends the transfer market"
    roles: [WaterMaster]
    code: 200
    input: []
    output: BasinConditionSnapshot
    side_effects: ["DRAFT -> PUBLISHED; if condition == CRITICAL: all PROPOSED TransferOrders -> EXPIRED with reservation release"]

  # --- PenaltyAssessment ---
  - method: POST
    path: "/penalty-assessments"
    description: "Manually assess a penalty (LATE_REPORT / UNMETERED_PUMPING flat fees; OVERDRAFT with matching overdraft_af)"
    roles: [EnforcementOfficer]
    code: 201
    input: [account_id, reason, water_year, "overdraft_af?"]
    output: PenaltyAssessment
    side_effects: ["status ASSESSED; assessed_by = X-User-ID; account.penalty_balance_cents += amount_cents"]
  - method: GET
    path: "/penalty-assessments"
    description: "List penalty assessments; FK reverse-reachability for PenaltyAssessment.account_id via account_id filter"
    roles: [WellOwner, WaterMaster, EnforcementOfficer, AppealsOfficer, StateRegulator]
    code: 200
    input: ["account_id?", "status?", "reason?", "limit?", "offset?"]
    output: "PenaltyAssessment[]"
    side_effects: []
  - method: GET
    path: "/penalty-assessments/{assessmentId}"
    description: "Get one penalty assessment"
    roles: [WellOwner, WaterMaster, EnforcementOfficer, AppealsOfficer, StateRegulator]
    code: 200
    input: []
    output: PenaltyAssessment
    side_effects: []
  - method: POST
    path: "/penalty-assessments/{assessmentId}/pay"
    description: "Pay an ASSESSED/UPHELD/REDUCED assessment (owner of account)"
    roles: [WellOwner]
    code: 200
    input: []
    output: PenaltyAssessment
    side_effects: ["-> PAID; account.penalty_balance_cents debited; paid_amount_cents stamped"]
  - method: POST
    path: "/penalty-assessments/{assessmentId}/appeal"
    description: "Appeal an ASSESSED assessment within 30 days of creation (owner of account)"
    roles: [WellOwner]
    code: 200
    input: [grounds]
    output: PenaltyAssessment
    side_effects: ["ASSESSED -> APPEALED"]
  - method: POST
    path: "/penalty-assessments/{assessmentId}/decide"
    description: "Decide an APPEALED assessment; decider must differ from assessor (segregation of duties)"
    roles: [AppealsOfficer]
    code: 200
    input: [outcome, "reduced_amount_cents?"]
    output: PenaltyAssessment
    side_effects: ["APPEALED -> UPHELD | OVERTURNED | REDUCED; penalty_balance_cents adjusted per branch; decided_by stamped"]

  # --- AnnualStateReport ---
  - method: POST
    path: "/annual-state-reports"
    description: "Generate the DRAFT annual report for a closed water year (annual_report_aggregates)"
    roles: [WaterMaster]
    code: 201
    input: [water_year]
    output: AnnualStateReport
    side_effects: ["aggregate fields computed from persisted reports, assessments, and latest PUBLISHED snapshot"]
  - method: GET
    path: "/annual-state-reports"
    description: "List annual state reports"
    roles: [WellOwner, WaterMaster, EnforcementOfficer, AppealsOfficer, StateRegulator]
    code: 200
    input: ["water_year?", "status?", "limit?", "offset?"]
    output: "AnnualStateReport[]"
    side_effects: []
  - method: POST
    path: "/annual-state-reports/{reportId}/submit"
    description: "Submit a DRAFT annual report to the state"
    roles: [WaterMaster]
    code: 200
    input: []
    output: AnnualStateReport
    side_effects: ["DRAFT -> SUBMITTED"]
  - method: POST
    path: "/annual-state-reports/{reportId}/acknowledge"
    description: "State regulator acknowledges a SUBMITTED annual report"
    roles: [StateRegulator]
    code: 200
    input: []
    output: AnnualStateReport
    side_effects: ["SUBMITTED -> ACKNOWLEDGED"]

  # --- Admin / test-driving ---
  - method: POST
    path: "/admin/close-water-year"
    description: "Close a water year (ops-run checkpoint): applies carryover_credit_af to each account whose current_water_year equals the given year"
    roles: [WaterMaster]
    code: 200
    input: [water_year]
    output: { closed_water_year: integer, accounts_rolled: integer, total_carryover_af: number }
    side_effects: ["per rolled account: credit_balance_af += carryover; extracted_af_ytd/pending_extraction_af/transfer_out_af_ytd reset to 0; current_water_year += 1; version increments"]
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Test-driving logical clock. Startup default (before any set): 2026-08-01T00:00:00Z; the server never falls back to wall-clock time. Setting the clock also sweeps PROPOSED TransferOrders whose expires_at is strictly before the new time into EXPIRED (reservation release)."
    roles: [WaterMaster]
    code: 200
    input: [to_iso8601]
    output: { current_utc: string }
    side_effects: ["logical clock set; transfer-expiry sweep (PROPOSED -> EXPIRED when clock > expires_at) with seller reservation release"]

# =============================================================================
# §1.6 Error Code Catalog (35 errors)
# =============================================================================
errors:
  - { id: ERR_MISSING_AUTH_CONTEXT, http: 400, condition: "X-User-Role or X-User-ID header missing, or role not declared" }
  - { id: ERR_FORBIDDEN_ROLE, http: 403, condition: "Caller role not permitted on this endpoint" }
  - { id: ERR_OWNERSHIP_MISMATCH, http: 403, condition: "WellOwner's X-User-ID does not own the target resource's account" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Malformed request: missing/invalid fields, enum violation, range violation, conditional-field violation, or future-dated monitoring reading" }
  - { id: ERR_ACCOUNT_NOT_FOUND, http: 404, condition: "No WaterUserAccount with the given id" }
  - { id: ERR_WELL_NOT_FOUND, http: 404, condition: "No Well with the given id" }
  - { id: ERR_REPORT_NOT_FOUND, http: 404, condition: "No ExtractionReport with the given id" }
  - { id: ERR_TRANSFER_NOT_FOUND, http: 404, condition: "No TransferOrder with the given id" }
  - { id: ERR_ASSESSMENT_NOT_FOUND, http: 404, condition: "No PenaltyAssessment with the given id" }
  - { id: ERR_SNAPSHOT_NOT_FOUND, http: 404, condition: "No BasinConditionSnapshot with the given id" }
  - { id: ERR_ANNUAL_REPORT_NOT_FOUND, http: 404, condition: "No AnnualStateReport with the given id" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_account_version does not match the account's current version (OCC)" }
  - { id: ERR_ACCOUNT_NOT_ACTIVE, http: 409, condition: "Operation requires an ACTIVE WaterUserAccount (well registration/activation, transfer parties, or close precondition violation)" }
  - { id: ERR_INVALID_WELL_STATE, http: 409, condition: "Well not in a valid from-state for install-meter/activate/decommission" }
  - { id: ERR_WELL_NOT_ACTIVE, http: 409, condition: "Well must be ACTIVE to accept extraction reports or monitoring readings" }
  - { id: ERR_INVALID_REPORT_STATE, http: 409, condition: "Report not in the required from-state (SUBMITTED for verify/dispute, DISPUTED for resubmit)" }
  - { id: ERR_INVALID_TRANSFER_STATE, http: 409, condition: "Transfer order not in the required from-state (PROPOSED for accept/cancel, ACCEPTED for settle/reject)" }
  - { id: ERR_INVALID_ASSESSMENT_STATE, http: 409, condition: "Assessment not in the required from-state (ASSESSED for appeal, APPEALED for decide, ASSESSED/UPHELD/REDUCED for pay)" }
  - { id: ERR_INVALID_SNAPSHOT_STATE, http: 409, condition: "Snapshot not DRAFT on publish" }
  - { id: ERR_INVALID_ANNUAL_REPORT_STATE, http: 409, condition: "Annual report not in the required from-state (DRAFT for submit, SUBMITTED for acknowledge)" }
  - { id: ERR_BASIN_CRITICAL_TRANSFERS_SUSPENDED, http: 409, condition: "Transfer settlement blocked while official basin condition == CRITICAL" }
  - { id: ERR_SEGREGATION_OF_DUTIES, http: 403, condition: "Appeal decider's X-User-ID equals the assessment's assessed_by" }
  - { id: ERR_INVALID_WELL_TYPE, http: 422, condition: "Well-type gate violated (report on non-PRODUCTION well, reading on non-MONITORING well, meter install on non-PRODUCTION well)" }
  - { id: ERR_DUPLICATE_REPORT, http: 409, condition: "An ExtractionReport already exists for (well_id, water_year, month)" }
  - { id: ERR_REPORT_YEAR_MISMATCH, http: 422, condition: "report.water_year != owning account.current_water_year" }
  - { id: ERR_SELF_TRANSFER, http: 422, condition: "seller_account_id == buyer_account_id" }
  - { id: ERR_TRANSFER_WINDOW_OVERLAP, http: 409, condition: "Buyer already holds a non-terminal inbound transfer whose half-open window overlaps the proposed window" }
  - { id: ERR_CLOSE_YEAR_UNRESOLVED_REPORTS, http: 409, condition: "SUBMITTED or DISPUTED reports exist for the closing water year" }
  - { id: ERR_WATER_YEAR_NOT_CLOSED, http: 409, condition: "AnnualStateReport requested for a water year that has not been closed" }
  - { id: ERR_ANNUAL_REPORT_EXISTS, http: 409, condition: "An AnnualStateReport already exists for the water year" }
  - { id: ERR_APPEAL_WINDOW_CLOSED, http: 409, condition: "Appeal filed after assessment.created_at + 30 days (strictly later than the deadline)" }
  - { id: ERR_OVERDRAFT_AMOUNT_MISMATCH, http: 422, condition: "Manual OVERDRAFT assessment's overdraft_af does not equal the computed overdraft" }
  - { id: ERR_INSUFFICIENT_AVAILABLE_WATER, http: 422, condition: "Seller's forward-looking available water below proposed quantity_af" }
  - { id: ERR_MONTHLY_TRANSFER_CAP_EXCEEDED, http: 422, condition: "Proposed quantity would push some calendar month's basin-wide transfer aggregate above 5000 af" }
  - { id: ERR_SETTLE_INSUFFICIENT_WATER, http: 422, condition: "Seller's settled-variant available water below quantity_af at settlement time" }

# =============================================================================
# §1.7 RBAC Matrix (5 roles, segregation_of_duties model)
# =============================================================================
roles:
  - name: WellOwner
    description: "A registered water user acting on its own account's wells, reports, transfers, and penalties. Ownership: X-User-ID equals the owning WaterUserAccount.id."
    identity: "entity_backed:WaterUserAccount"
    exclusive_operations:
      - "POST /wells — register a well under own account"
      - "POST /wells/{id}/install-meter — record meter installation (own well)"
      - "POST /extraction-reports — submit extraction report (own well)"
      - "POST /extraction-reports/{id}/resubmit — amend disputed report (own)"
      - "POST /transfer-orders — propose transfer (own seller account)"
      - "POST /transfer-orders/{id}/accept — accept as buyer (own buyer account)"
      - "POST /transfer-orders/{id}/cancel — cancel as seller (own)"
      - "POST /penalty-assessments/{id}/pay — pay own assessment"
      - "POST /penalty-assessments/{id}/appeal — appeal own assessment"
    shared_operations:
      - "POST /wells/{id}/decommission — shared with WaterMaster"
      - "All GET list/single endpoints — shared with all roles"
  - name: WaterMaster
    description: "Agency operations staff: onboards accounts, verifies reports and meters, settles transfers, monitors basin, closes water years, generates annual reports."
    identity: "opaque"
    exclusive_operations:
      - "POST /water-user-accounts — onboard account"
      - "PATCH /water-user-accounts/{id} — update allocation/status (OCC)"
      - "POST /wells/{id}/activate — activate wells"
      - "POST /extraction-reports/{id}/verify — verify report"
      - "POST /extraction-reports/{id}/dispute — dispute report"
      - "POST /transfer-orders/{id}/settle — settle transfer"
      - "POST /transfer-orders/{id}/reject — reject transfer"
      - "POST /monitoring-readings — record monitoring reading"
      - "POST /basin-condition-snapshots — compute snapshot"
      - "POST /basin-condition-snapshots/{id}/publish — publish snapshot"
      - "POST /annual-state-reports — generate annual report"
      - "POST /annual-state-reports/{id}/submit — submit annual report"
      - "POST /admin/close-water-year — year-end rollover"
      - "POST /_clock/set_current_utc — logical clock control"
    shared_operations:
      - "POST /wells/{id}/decommission — shared with WellOwner"
      - "All GET list/single endpoints — shared with all roles"
  - name: EnforcementOfficer
    description: "Agency compliance officer who assesses penalties. Segregated from appeal decisions: the same X-User-ID may never decide an appeal it assessed."
    identity: "opaque"
    exclusive_operations:
      - "POST /penalty-assessments — create penalty assessment"
    shared_operations:
      - "All GET list/single endpoints — shared with all roles"
  - name: AppealsOfficer
    description: "Independent hearing officer deciding penalty appeals; must differ from the assessing user (segregation of duties)."
    identity: "opaque"
    exclusive_operations:
      - "POST /penalty-assessments/{id}/decide — decide appeal"
    shared_operations:
      - "All GET list/single endpoints — shared with all roles"
  - name: StateRegulator
    description: "State oversight role: read-only across the program plus acknowledgement of annual reports."
    identity: "opaque"
    exclusive_operations:
      - "POST /annual-state-reports/{id}/acknowledge — acknowledge annual report"
    shared_operations:
      - "All GET list/single endpoints — shared with all roles"
