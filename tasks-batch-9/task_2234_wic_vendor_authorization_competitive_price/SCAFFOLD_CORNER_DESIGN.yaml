              as: VendorUnitAnalyst
              captures: { v1: $.data.id }
            - call: "POST /vendors"
              payload: { store_name: "Bravo Market", store_type: "SUPERMARKET", reported_monthly_redemption_cents: 7000000 }
              as: VendorUnitAnalyst
              captures: { v2: $.data.id }
            - call: "POST /price-submissions"
              payload: { vendor_id: "${v1}", food_item_id: "${item_milk}", price_cycle_id: "${cycle_q3}", shelf_price_cents: 320 }
              as: VendorOperator
              as_user_id: "${v1}"
              captures: { sub_1: $.data.id }
          trigger:
            - call: "POST /price-submissions"
              payload: { vendor_id: "${v1}", food_item_id: "${item_milk}", price_cycle_id: "${cycle_q3}", shelf_price_cents: 330 }
              as: VendorOperator
              as_user_id: "${v1}"
            - call: "POST /price-submissions/${sub_1}/review"
              payload: { decision: "REJECT", review_reason: "PRICE_IMPLAUSIBLE" }
              as: VendorUnitAnalyst
            - call: "POST /price-submissions"
              payload: { vendor_id: "${v1}", food_item_id: "${item_milk}", price_cycle_id: "${cycle_q3}", shelf_price_cents: 340 }
              as: VendorOperator
              as_user_id: "${v1}"
            - call: "POST /price-submissions"
              payload: { vendor_id: "${v2}", food_item_id: "${item_milk}", price_cycle_id: "${cycle_q3}", shelf_price_cents: 320 }
              as: VendorOperator
              as_user_id: "${v2}"
          trigger_note: "the 2026Q4 cycle is present only to show the key is cycle-scoped; its window is not open at this clock, so it is exercised by assertion on GET, not by a submission"
          assert:
            - "First trigger call (same vendor, item and cycle, submission still SUBMITTED): HTTP 409 with error.id == ERR_DUPLICATE_PRICE_SUBMISSION"
            - "After the REJECT, the third call still returns HTTP 409 ERR_DUPLICATE_PRICE_SUBMISSION — REJECTED is inside the blocking status set, so revise is the only forward path"
            - "Fourth call (different vendor, same item and cycle): HTTP 201 — the key includes vendor_id"
            - "GET /price-submissions?vendor_id=${v1}&price_cycle_id=${cycle_q3} reports meta.total_count == 1 and GET /price-submissions?price_cycle_id=${cycle_q4} reports meta.total_count == 0"

      - name: visit_scheduled_in_the_past_rejected_before_blackout_conflict
        claim_type: priority_conflict
        grounds:
          - validations[priority 29]
          - validations[priority 30]
