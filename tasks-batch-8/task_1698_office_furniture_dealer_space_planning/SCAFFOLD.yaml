    roles: [DealerAdmin]
    code: 201
    input: [name, staging_capacity_units, standard_labor_rate_cents_per_hour, "after_hours_start_minute?", "after_hours_multiplier_bp?", "turnover_buffer_minutes?", "credit_cap_pct?"]
    output: Dealership
    side_effects: ["Defaults applied: after_hours_start_minute=1080, after_hours_multiplier_bp=15000, turnover_buffer_minutes=30, credit_cap_pct=25"]

  - method: GET
    path: "/api/dealerships"
    description: "List dealerships"
    roles: [DealerAdmin, AccountExecutive, ContractsOfficer, Designer, ClientApprover, ProjectManager, WarehouseLead, ClaimsCoordinator, ManufacturerRep, LiquidationAppraiser, FinanceManager]
    code: 200
    input: ["limit?", "offset?"]
    output: "Dealership[]"
    side_effects: []

  - method: GET
    path: "/api/dealerships/{id}"
    description: "Get a dealership"
    roles: [DealerAdmin, AccountExecutive, ContractsOfficer, Designer, ClientApprover, ProjectManager, WarehouseLead, ClaimsCoordinator, ManufacturerRep, LiquidationAppraiser, FinanceManager]
    code: 200
    input: []
    output: Dealership
    side_effects: []

  - method: POST
    path: "/api/_clock/set_current_utc"
    description: "Set the logical clock (test-driving endpoint). Server default before any call is exactly 2026-08-01T00:00:00Z and never falls back to wall-clock time. Triggers sweeps: ACTIVE contracts with effective_to < current UTC date -> EXPIRED; APPRAISED lots with appraised_at + 30 days < current UTC date -> EXPIRED."
    roles: [DealerAdmin]
    code: 200
    input: [to_iso8601]
    output: "{ current_utc: string }"
    side_effects: ["Contract expiry sweep", "Lot appraisal-validity sweep"]

  - method: GET
    path: "/api/_clock"
    description: "Read the logical clock; returns the startup default 2026-08-01T00:00:00Z until set"
    roles: [DealerAdmin, AccountExecutive, ContractsOfficer, Designer, ClientApprover, ProjectManager, WarehouseLead, ClaimsCoordinator, ManufacturerRep, LiquidationAppraiser, FinanceManager]
    code: 200
    input: []
    output: "{ current_utc: string }"
    side_effects: []

  # --- Customer ---
  - method: POST
    path: "/api/customers"
    description: "Create a customer"
    roles: [AccountExecutive]
    code: 201
    input: [dealership_id, name, external_ref]
