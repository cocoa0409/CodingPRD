  - rule_id: compensating_invariant
    instances:
      - name: invoice_issue_void_reissue_restores_fee_balance_exactly
        grounds:
          - calculations.producer_fee_balance_rollup
          - state_machines.Invoice.ISSUED_to_VOID
          - calculations.invoice_administrative_fee
        distinguishing_aspect: |
          The conserved quantity is money in whole cents: Producer.assessed_fee_balance_cents must
          return to exactly 0 after an operator void and back to exactly 53 after re-invoicing the
          same report, because the field is recomputed from the ISSUED invoice set rather than
          adjusted by deltas.
        test_recipe:
          setup:
            - "CA program (verification_required_threshold_kg 3000) with one open period and a published GLASS-only schedule at 9 cents/kg, admin_fee_bps_low 500, admin_fee_bps_high 300, membership_fee_cents 250000."
            - "Producer PM (revenue 8000000, brand owner) with one ACTIVE GLASS SKU of 50 g and 110 units estimate, an ACTIVE CA registration and a PAID ACTIVE membership."
            - "The CA-2026-H2 report holds one 110-unit line (5.500 kg), has been submitted and FINAL-assessed at fee_subtotal_cents 50, so the admin fee is round_half_up(50 * 500 / 10000) = 3 and total_cents is 53."
            - "assessed_fee_balance_cents is 0 before any invoice exists."
          setup_api_calls:
            - call: "POST /epr/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: ProgramRegulator
              as_user_id: "reg-1"
