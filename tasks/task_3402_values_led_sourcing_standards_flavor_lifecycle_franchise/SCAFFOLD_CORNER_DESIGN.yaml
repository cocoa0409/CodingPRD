            - call: "POST /creamery/scoop-shops/${shop_id}/approve-site"
              as: FranchiseAdmin
          trigger:
            - call: "POST /creamery/scoop-shops/${shop_id}/open"
              as: FranchiseAdmin
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_NONPROFIT_VERIFICATION_REQUIRED (HTTP 422)"

      - name: claim_resubstantiate_from_substantiated_rejected
        claim_type: invalid_transition
        grounds: ["state_machines.Flavor.claim_status.transitions", "errors[ERR_INVALID_STATE]", "concurrency_rules[claim-substantiate-stale-flavor]"]
        distinguishing_aspect: "With a FRESH flavor version (OCC passes), substantiate from claim_status SUBSTANTIATED still fails ERR_INVALID_STATE — the OCC check and the machine guard are distinct layers."
        test_recipe:
          setup: ["Supplier APPROVED with VERIFIED DAIRY cert (95/95); flavor TEST_BATCH with claim already SUBSTANTIATED"]
          setup_api_calls:
            - call: "POST /creamery/suppliers"
              payload: { name: "Layer Dairy", country_code: "US", ingredient_category: "DAIRY" }
              as: SourcingManager
              captures: { s_id: $.data.id }
            - call: "POST /creamery/suppliers/${s_id}/audits"
              payload: { scheduled_for: "2026-09-05T00:00:00Z" }
              as: SourcingManager
              captures: { a_id: $.data.id }
            - call: "POST /creamery/audits/${a_id}/start"
              as: SustainabilityAuditor
              as_user_id: "aud-1"
            - call: "POST /creamery/audits/${a_id}/complete"
              payload: { labor_score: 80, environment_score: 70, community_score: 60, findings_count: 0 }
              as: SustainabilityAuditor
              as_user_id: "aud-1"
            - call: "POST /creamery/audits/${a_id}/verify"
              as: AuditVerifier
              as_user_id: "ver-1"
            - call: "POST /creamery/suppliers/${s_id}/certifications"
              payload: { scheme: "FAIR_TRADE", certificate_number: "FT-L1", ingredient_scope: "DAIRY", issued_at: "2026-01-01T00:00:00Z", valid_until: "2027-06-01T00:00:00Z", declared_coverage_pct: 95 }
              as: SourcingManager
              captures: { c_id: $.data.id }
            - call: "POST /creamery/certifications/${c_id}/verify"
              payload: { verified_coverage_pct: 95 }
              as: AuditVerifier
              as_user_id: "ver-1"
            - call: "POST /creamery/flavors"
              payload: { name: "Layer Cake", base_type: "DAIRY", chunk_load_pct: 5, swirl_load_pct: 5, pint_price_cents: 150 }
              as: FlavorManager
              captures: { f_id: $.data.id }
            - call: "POST /creamery/flavors/${f_id}/promote"
              payload: { target_state: "TEST_BATCH" }
              as: FlavorManager
            - call: "GET /creamery/flavors/${f_id}"
              as: FlavorManager
              captures: { f_v: $.data.version }
            - call: "POST /creamery/flavors/${f_id}/substantiate-claim"
              payload: { claim_type: "FAIR_TRADE_SOURCING", certification_ids: ["${c_id}"], expected_flavor_version: "${f_v}" }
              as: FlavorManager
          trigger:
            - call: "GET /creamery/flavors/${f_id}"
              as: FlavorManager
              captures: { f_v2: $.data.version }
            - call: "POST /creamery/flavors/${f_id}/substantiate-claim"
              payload: { claim_type: "NON_GMO", certification_ids: ["${c_id}"], expected_flavor_version: "${f_v2}" }
              as: FlavorManager
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_INVALID_STATE (HTTP 409): fresh OCC version passes, machine guard rejects SUBSTANTIATED -> substantiate"

      - name: revival_create_requires_retired_flavor
        claim_type: precondition_enforcement
        grounds: [state_machines.RevivalRequest, "errors[ERR_FLAVOR_NOT_RETIRED]"]
        distinguishing_aspect: "Revival requests can only open against RETIRED flavors; a LIMITED_RUN flavor rejects with ERR_FLAVOR_NOT_RETIRED."
        test_recipe:
          setup: ["Flavor LIMITED_RUN (not retired)"]
          setup_api_calls:
            - call: "POST /creamery/flavors"
              payload: { name: "Still Selling", base_type: "DAIRY", chunk_load_pct: 5, swirl_load_pct: 5, pint_price_cents: 150 }
              as: FlavorManager
              captures: { f_id: $.data.id }
            - call: "POST /creamery/flavors/${f_id}/promote"
              payload: { target_state: "TEST_BATCH" }
              as: FlavorManager
            - call: "POST /creamery/flavors/${f_id}/promote"
              payload: { target_state: "LIMITED_RUN" }
              as: FlavorManager
          trigger:
            - call: "POST /creamery/flavors/${f_id}/revival-requests"
              payload: { fan_email: "eager@x.com", title: "Too soon" }
              as: Fan
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_FLAVOR_NOT_RETIRED (HTTP 409)"

      - name: revival_create_after_window_rejected
        claim_type: violation_to_error
        grounds: [calculations.revival_qualification, "errors[ERR_REVIVAL_WINDOW_EXPIRED]", "validations[priority=15]"]
        distinguishing_aspect: "The revival window is retired_at + 730 days; with the clock at 2028-09-02 (731 days after a 2026-09-01 retirement) creation fails ERR_REVIVAL_WINDOW_EXPIRED."
        test_recipe:
          setup: ["Flavor retired at the default clock 2026-09-01T00:00:00Z; clock advanced to 2028-09-02T00:00:00Z"]
          setup_api_calls:
            - call: "POST /creamery/flavors"
              payload: { name: "Long Gone", base_type: "DAIRY", chunk_load_pct: 5, swirl_load_pct: 5, pint_price_cents: 150 }
              as: FlavorManager
              captures: { f_id: $.data.id }
            - call: "POST /creamery/flavors/${f_id}/promote"
              payload: { target_state: "TEST_BATCH" }
              as: FlavorManager
            - call: "POST /creamery/flavors/${f_id}/promote"
              payload: { target_state: "LIMITED_RUN" }
              as: FlavorManager
            - call: "POST /creamery/flavors/${f_id}/retire"
              as: ParentOpsController
            - call: "POST /creamery/_clock/set_current_utc"
              payload: { to_iso8601: "2028-09-02T00:00:00Z" }
              as: ParentOpsController
          trigger:
            - call: "POST /creamery/flavors/${f_id}/revival-requests"
              payload: { fan_email: "late@x.com", title: "Too late" }
              as: Fan
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_REVIVAL_WINDOW_EXPIRED (HTTP 422); 2028-09-02 > retired_at 2026-09-01 + 730 days"

      - name: slot_completes_on_clock_advance
        claim_type: valid_transition
        grounds: [state_machines.ProductionSlot.CONFIRMED_to_COMPLETED]
        distinguishing_aspect: "A CONFIRMED slot auto-completes when the logical date passes production_date; PLANNED slots do not complete."
        test_recipe:
          setup: ["Flavor TEST_BATCH; slot CONFIRMED for 2026-09-10 DAY at VT_WATERBURY; clock advances to 2026-09-11"]
          setup_api_calls:
            - call: "POST /creamery/flavors"
              payload: { name: "Sched Swirl", base_type: "DAIRY", chunk_load_pct: 5, swirl_load_pct: 5, pint_price_cents: 150 }
              as: FlavorManager
              captures: { f_id: $.data.id }
            - call: "POST /creamery/flavors/${f_id}/promote"
              payload: { target_state: "TEST_BATCH" }
              as: FlavorManager
            - call: "POST /creamery/production-slots"
              payload: { plant_code: "VT_WATERBURY", flavor_id: "${f_id}", production_date: "2026-09-10", shift: "DAY", planned_pints: 500 }
              as: PlantScheduler
              captures: { slot_id: $.data.id }
            - call: "POST /creamery/production-slots/${slot_id}/confirm"
              as: PlantScheduler
          trigger:
            - call: "POST /creamery/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-11T00:00:00Z" }
              as: ParentOpsController
            - call: "GET /creamery/production-slots/${slot_id}"
              as: PlantScheduler
              captures: { st: $.data.status }
          assert:
            - "st == COMPLETED (clock past production_date completes CONFIRMED slots)"

      - name: commitment_create_requires_approved_supplier
        claim_type: precondition_enforcement
        grounds: [state_machines.SourcingCommitment, "errors[ERR_SUPPLIER_NOT_APPROVED]", "validations[priority=9]"]
        distinguishing_aspect: "Creating a commitment on a PROSPECT supplier fails ERR_SUPPLIER_NOT_APPROVED; only APPROVED suppliers carry commitments."
        test_recipe:
