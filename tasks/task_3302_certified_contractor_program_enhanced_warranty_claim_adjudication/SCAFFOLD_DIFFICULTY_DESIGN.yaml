  - rule_id: transitive_cascade
    instances:
      - name: complaint_substantiation_cascade_suspends_contractor_cert_and_recalls_lead
        grounds:
          - state_machines.Complaint.FILED_to_SUBSTANTIATED
          - state_machines.Contractor.ACTIVE_to_SUSPENDED
          - state_machines.Certification.ACTIVE_to_SUSPENDED
          - state_machines.LeadAssignment.ASSIGNED_to_RETURNED
        distinguishing_aspect: |
          Depth-4 chain from a single substantiation: Complaint SUBSTANTIATED ->
          Contractor score recomputed and crosses 5 -> Contractor SUSPENDED ->
          Certification ACTIVE->SUSPENDED -> LeadAssignment ASSIGNED->RETURNED with
          distributor pool restored. Each hop is caused by the previous hop.
        test_recipe:
          setup:
            - "GOLD contractor with ACTIVE cert and one ASSIGNED lead from distributor (pool_total 1) in territory T1 window [2026-10-01, 2026-11-01)"
            - "complaint X filed 2026-09-10 and complaint Y filed 2027-06-01; substantiating both at 2027-08-01 yields 3+2 = 5"
