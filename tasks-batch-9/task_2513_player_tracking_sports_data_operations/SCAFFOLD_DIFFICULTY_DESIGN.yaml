              captures: { rw_id: $.data.id }
          trigger:
            - call: "POST /feed-sessions"
              payload: { game_id: "${g_id}", rights_window_id: "${rw_id}", delivery_mode: "REALTIME", bandwidth_mbps: 20, window_start_utc: "2026-08-01T18:00:00Z", window_end_utc: "2026-08-01T18:30:00Z", requested_latency_ms: 250, scope: ["POSITIONAL"] }
              as: Licensee
              as_user_id: "${lic_id}"
              captures: { err_state: $.data.error_id }
            - call: "POST /games/${g_id}/open-collection"
              as: LeagueDataOps
              as_user_id: "ops-01"
            - call: "POST /feed-sessions"
              payload: { game_id: "${g_id}", rights_window_id: "${rw_id}", delivery_mode: "REALTIME", bandwidth_mbps: 20, window_start_utc: "2026-08-01T18:00:00Z", window_end_utc: "2026-08-01T18:30:00Z", requested_latency_ms: 250, scope: ["POSITIONAL"] }
              as: Licensee
              as_user_id: "${lic_id}"
              captures: { err_fiscal: $.data.error_id }
          assert:
            - "${err_state} == ERR_GAME_NOT_COLLECTING with HTTP 409 (state, priority 41 wins)"
            - "${err_fiscal} == ERR_LICENSEE_QUOTA_EXHAUSTED with HTTP 402 (business_fiscal, priority 81, once the state violation is removed)"
            - "DataLicensee.${lic_id}.available_units == 10 and DataLicensee.${lic_id}.reserved_units == 0 after both rejections"
            - "GET /feed-sessions?game_id=${g_id} returns total_count == 0"
            - "Game.${g_id}.collection_status == LIVE after the open-collection call"

      - name: safety_precedes_referential_on_event_tag_create
        grounds:
          - validations[priority=51]
          - validations[priority=76]
          - errors[ERR_BIOMETRIC_CONSENT_MISSING]
          - errors[ERR_PLAYER_NOT_IN_GAME]
        distinguishing_aspect: |
          A different error-category pair on a different endpoint: business_safety (priority 51,
          biometric payload without GRANTED consent) versus business_referential (priority 76,
          the player's club is neither side of the game). One POST /event-tags violates both and
          must return ERR_BIOMETRIC_CONSENT_MISSING; dropping the biometric flag alone leaves the
          referential violation and yields ERR_PLAYER_NOT_IN_GAME.
        test_recipe:
          setup:
            - "logical clock at 2026-08-01T12:00:00Z"
            - "Harbor Arena venue with one CERTIFIED rig, data_posture CERTIFIED"
            - "Game LIVE between Harbor FC and Summit SC"
            - "a third club Vale United with player Kai Mori who has no consent record at all (biometric_release_state NONE)"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T12:00:00Z" }
              as: LeagueDataOps
              as_user_id: "ops-01"
            - call: "POST /venues"
              payload: { name: "Harbor Arena", city: "Harbor", tracking_tech: "HYBRID", required_certified_installations: 1, transport_capacity_mbps: 100, min_achievable_latency_ms: 200 }
              as: LeagueDataOps
              as_user_id: "ops-01"
              captures: { v_id: $.data.id }
            - call: "POST /installations"
              payload: { venue_id: "${v_id}", rig_label: "RIG-A", modality: "UWB_ANCHOR" }
              as: LeagueDataOps
              as_user_id: "ops-01"
              captures: { i_id: $.data.id }
            - call: "POST /installations/${i_id}/calibration-runs"
              payload: { axis_rms_x_mm: 90.0, axis_rms_y_mm: 90.0, axis_rms_z_mm: 90.0, sample_count: 6000, reference_point_count: 16 }
              as: CalibrationEngineer
              as_user_id: "eng-01"
            - call: "POST /installations/${i_id}/certify"
              as: LeagueDataOps
              as_user_id: "ops-01"
            - call: "POST /clubs"
              payload: { name: "Harbor FC", market_code: "HBR" }
              as: LeagueDataOps
              as_user_id: "ops-01"
              captures: { c_home: $.data.id }
            - call: "POST /clubs"
              payload: { name: "Summit SC", market_code: "SMT" }
              as: LeagueDataOps
              as_user_id: "ops-01"
              captures: { c_away: $.data.id }
            - call: "POST /clubs"
              payload: { name: "Vale United", market_code: "VAL" }
              as: LeagueDataOps
              as_user_id: "ops-01"
              captures: { c_out: $.data.id }
            - call: "POST /players"
              payload: { club_id: "${c_out}", full_name: "Kai Mori", jersey_number: 11 }
              as: LeagueDataOps
              as_user_id: "ops-01"
              captures: { p_out: $.data.id }
            - call: "POST /games"
              payload: { venue_id: "${v_id}", home_club_id: "${c_home}", away_club_id: "${c_away}", scheduled_start_utc: "2026-08-01T18:00:00Z", tracking_generation: "G1", licensable_minutes: 240 }
              as: LeagueDataOps
              as_user_id: "ops-01"
              captures: { g_id: $.data.id }
            - call: "POST /games/${g_id}/open-collection"
              as: LeagueDataOps
              as_user_id: "ops-01"
              captures: { gv1: $.data.version }
          trigger:
            - call: "POST /event-tags"
              payload: { game_id: "${g_id}", player_id: "${p_out}", tag_type: "SHOT", clock_ms: 120000, confidence: 0.9, biometric_payload_present: true, expected_game_version: "${gv1}" }
              as: Statistician
              as_user_id: "stat-01"
              captures: { err_safety: $.data.error_id }
            - call: "POST /event-tags"
              payload: { game_id: "${g_id}", player_id: "${p_out}", tag_type: "SHOT", clock_ms: 120000, confidence: 0.9, biometric_payload_present: false, expected_game_version: "${gv1}" }
              as: Statistician
