# =============================================================================
# SCAFFOLD_DIFFICULTY_DESIGN.yaml — §1.8 Test Targeting Index
# Model Risk Management & Validation. 9 rules × 2 instances.
# All setup chains start from empty-DB; clock default is 2026-08-01T00:00:00Z.
# User ids (opaque role identities): u_own_a / u_own_b (ModelOwner),
# u_val (ModelValidator), u_cro (ModelRiskOfficer), u_rep (RegulatoryReporter).
# =============================================================================

scaffold_difficulty_design:

  # ---------------------------------------------------------------- Rule 1
  - rule_id: dual_variant_calc
    instances:
      - name: model_risk_score_dev_declared_vs_validator_assessed
        grounds:
          - calculations.model_risk_score
          - state_machines.ValidationEngagement.TESTING_to_COMPLETED
        distinguishing_aspect: |
          Entity domain = Model. The same model row (usage_scope MULTI_DESK,
          exposure_amount 500, no findings) yields risk_score 80 under the
          DEV_DECLARED variant (declared_complexity HIGH, weight 20:
          20*3 + 10*1 + 10*1) but 70 under the VALIDATOR_ASSESSED variant
          (assessed_complexity MEDIUM, weight 25: 25*2 + 10*1 + 10*1).
        test_recipe:
          setup:
            - "Clock at default 2026-08-01T00:00:00Z"
            - "Model M registered by u_own_a (declared HIGH / MULTI_DESK / 500) → DEV_DECLARED score 80, TIER_1"
            - "M has an APPROVED documentation package and an open engagement by independent validator u_val"
          setup_api_calls:
            - call: "POST /mrm/models"
              payload: { name: "Score Variant M", business_unit: "Treasury", declared_complexity: "HIGH", usage_scope: "MULTI_DESK", exposure_amount: 500, is_vendor_model: false }
              as: ModelOwner
              as_user_id: u_own_a
              captures: { m_id: $.data.id, m_score_dev: $.data.risk_score, m_tier_dev: $.data.risk_tier }
            - call: "POST /mrm/models/${m_id}/documentations"
              payload: { version_label: "1.0", has_development_evidence: true, has_testing_evidence: true, has_data_lineage: true }
              as: ModelOwner
              as_user_id: u_own_a
              captures: { doc_id: $.data.id }
            - call: "POST /mrm/models/${m_id}/documentations/${doc_id}/decide"
              payload: { decision: "APPROVE" }
              as: ModelRiskOfficer
              as_user_id: u_cro
            - call: "POST /mrm/models/${m_id}/validation-engagements"
              payload: { scope_conceptual_soundness: true, scope_outcomes_analysis: true, period_start: "2026-08-02T00:00:00Z", period_end: "2026-08-20T00:00:00Z" }
              as: ModelValidator
              as_user_id: u_val
              captures: { eng_id: $.data.id }
          trigger:
            - call: "POST /mrm/validation-engagements/${eng_id}/complete"
              payload: { outcome: "EFFECTIVE", assessed_complexity: "MEDIUM" }
              as: ModelValidator
              as_user_id: u_val
          assert:
            - "captured ${m_score_dev} == 80 (20*3 + 10*1 + 10*1, DEV_DECLARED)"
            - "captured ${m_tier_dev} == TIER_1"
            - "After completion: Model.${m_id}.risk_score == 70 (25*2 + 10*1 + 10*1, VALIDATOR_ASSESSED) — same model inputs, different variant, different value"
            - "Model.${m_id}.assessed_complexity == MEDIUM and Model.${m_id}.last_validated_at == 2026-08-01T00:00:00Z"

      - name: inventory_risk_index_equal_vs_exposure_weighted
        grounds:
          - calculations.inventory_risk_index
          - entities.RegulatoryReport.fields.inventory_risk_index
        distinguishing_aspect: |
          Entity domain = RegulatoryReport (inventory-level aggregate), not a
          model-level score: the same two-model inventory yields
          inventory_risk_index 60.00 under EQUAL_WEIGHTED ((80+40)/2) and
          44.00 under EXPOSURE_WEIGHTED ((80*1e6 + 40*9e6)/1e7).
        test_recipe:
          setup:
            - "Clock at default 2026-08-01T00:00:00Z"
            - "M1 REGISTERED: HIGH / SINGLE_DESK / 1000000 → score 20*3+10*0+10*2 = 80"
            - "M2 REGISTERED: LOW / SINGLE_DESK / 9000000 → score 20*1+10*0+10*2 = 40"
          setup_api_calls:
            - call: "POST /mrm/models"
              payload: { name: "Agg M1", business_unit: "Risk", declared_complexity: "HIGH", usage_scope: "SINGLE_DESK", exposure_amount: 1000000 }
              as: ModelOwner
              as_user_id: u_own_a
              captures: { m1_id: $.data.id }
            - call: "POST /mrm/models"
              payload: { name: "Agg M2", business_unit: "Risk", declared_complexity: "LOW", usage_scope: "SINGLE_DESK", exposure_amount: 9000000 }
              as: ModelOwner
              as_user_id: u_own_a
              captures: { m2_id: $.data.id }
          trigger:
            - call: "POST /mrm/regulatory-reports"
              payload: { report_type: "BOARD_QUARTERLY", period_start: "2026-08-01T00:00:00Z", period_end: "2026-09-01T00:00:00Z", aggregation_method: "EQUAL_WEIGHTED" }
              as: RegulatoryReporter
              as_user_id: u_rep
              captures: { idx_eq: $.data.inventory_risk_index }
            - call: "POST /mrm/regulatory-reports"
              payload: { report_type: "REGULATOR_ANNUAL", period_start: "2026-08-01T00:00:00Z", period_end: "2026-09-01T00:00:00Z", aggregation_method: "EXPOSURE_WEIGHTED" }
              as: RegulatoryReporter
              as_user_id: u_rep
              captures: { idx_ew: $.data.inventory_risk_index }
          assert:
            - "captured ${idx_eq} == 60.00"
            - "captured ${idx_ew} == 44.00 ((80*1000000 + 40*9000000) / 10000000)"
            - "captured ${idx_eq} != captured ${idx_ew} — same input set, two variants, different index"

  # ---------------------------------------------------------------- Rule 2
  - rule_id: combinatorial_formula
    instances:
      - name: finding_deadline_severity_tier_source_clamp
        grounds:
          - calculations.finding_deadline_days
          - entities.Finding.fields.remediation_due_at
        distinguishing_aspect: |
          Mode (a): >= 3 inputs (severity, risk_tier, source) with non-linear
          interaction — tier-multiplied severity base, a conditional 5-day
          deduction when source == MONITORING, then a min/max clamp into
          [7, 365]; the four asserted rows land on distinct branches (plain
          product, tier-scaled product, monitoring-deducted product).
        test_recipe:
          setup:
            - "Clock at default 2026-08-01T00:00:00Z (finding created_at == 2026-08-01)"
            - "M_T1: HIGH / SINGLE_DESK / 100 → score 70 → TIER_1"
            - "M_T2: MEDIUM / SINGLE_DESK / 100 → score 50 → TIER_2"
          setup_api_calls:
            - call: "POST /mrm/models"
              payload: { name: "Deadline T1", business_unit: "Risk", declared_complexity: "HIGH", usage_scope: "SINGLE_DESK", exposure_amount: 100 }
              as: ModelOwner
              as_user_id: u_own_a
              captures: { m_t1: $.data.id }
            - call: "POST /mrm/models"
              payload: { name: "Deadline T2", business_unit: "Risk", declared_complexity: "MEDIUM", usage_scope: "SINGLE_DESK", exposure_amount: 100 }
              as: ModelOwner
              as_user_id: u_own_a
              captures: { m_t2: $.data.id }
          trigger:
            - call: "POST /mrm/models/${m_t1}/findings"
              payload: { severity: "CRITICAL", title: "CRIT on T1" }
              as: ModelRiskOfficer
              as_user_id: u_cro
              captures: { f1_due: $.data.remediation_due_at }
            - call: "POST /mrm/models/${m_t2}/findings"
              payload: { severity: "MEDIUM", title: "MED on T2" }
              as: ModelRiskOfficer
              as_user_id: u_cro
              captures: { f2_due: $.data.remediation_due_at }
            - call: "POST /mrm/models/${m_t2}/findings"
              payload: { severity: "LOW", title: "LOW on T2" }
              as: ModelRiskOfficer
              as_user_id: u_cro
              captures: { f3_due: $.data.remediation_due_at }
            - call: "POST /mrm/models/${m_t1}/findings"
              payload: { severity: "HIGH", title: "HIGH on T1" }
              as: ModelRiskOfficer
              as_user_id: u_cro
              captures: { f4_due: $.data.remediation_due_at }
          assert:
            - "captured ${f1_due} == 2026-08-15T00:00:00Z (round(14*1.0) = 14 days after 2026-08-01)"
            - "captured ${f2_due} == 2026-10-30T00:00:00Z (round(60*1.5) = 90 days after 2026-08-01)"
            - "captured ${f3_due} == 2026-12-14T00:00:00Z (round(90*1.5) = 135 days after 2026-08-01)"
            - "captured ${f4_due} == 2026-08-31T00:00:00Z (round(30*1.0) = 30 days after 2026-08-01)"

      - name: inventory_risk_index_nested_rounding_order
        grounds:
          - calculations.inventory_risk_index
        distinguishing_aspect: |
          Mode (b): nested rounding order — the pinned order (full-precision
          products, one division, single round_half_up at 2dp) yields 39.14,
          while the alternative (round each model's contribution to 2dp
          first, then sum) yields 39.15; a per-contribution-rounding
          implementation fails the assertion. Different mode than the
          finding_deadline instance (mode a).
        test_recipe:
          setup:
            - "Clock at default 2026-08-01T00:00:00Z"
            - "M1 REGISTERED: LOW / SINGLE_DESK / exposure 1 → score 30"
            - "M2 REGISTERED: LOW / SINGLE_DESK / exposure 2 → score 30"
            - "M3 REGISTERED: LOW / SINGLE_DESK / exposure 4 → score 30, then findings add penalty +5+5 (two HIGH) +2+2+2 (three MEDIUM) = +16 → score 46"
            - "EXPOSURE_WEIGHTED index over {30@1, 30@2, 46@4}: (30 + 60 + 184)/7 = 274/7 = 39.142857… → 39.14 pinned; contribution-rounded: 4.29 + 8.57 + 26.29 = 39.15"
          setup_api_calls:
            - call: "POST /mrm/models"
              payload: { name: "Round M1", business_unit: "Risk", declared_complexity: "LOW", usage_scope: "SINGLE_DESK", exposure_amount: 1 }
              as: ModelOwner
              as_user_id: u_own_a
              captures: { r_m1: $.data.id }
            - call: "POST /mrm/models"
              payload: { name: "Round M2", business_unit: "Risk", declared_complexity: "LOW", usage_scope: "SINGLE_DESK", exposure_amount: 2 }
              as: ModelOwner
              as_user_id: u_own_a
              captures: { r_m2: $.data.id }
            - call: "POST /mrm/models"
              payload: { name: "Round M3", business_unit: "Risk", declared_complexity: "LOW", usage_scope: "SINGLE_DESK", exposure_amount: 4 }
              as: ModelOwner
              as_user_id: u_own_a
              captures: { r_m3: $.data.id }
            - call: "POST /mrm/models/${r_m3}/findings"
              payload: { severity: "HIGH", title: "penalty +5 (a)" }
              as: ModelRiskOfficer
              as_user_id: u_cro
            - call: "POST /mrm/models/${r_m3}/findings"
              payload: { severity: "HIGH", title: "penalty +5 (b)" }
              as: ModelRiskOfficer
              as_user_id: u_cro
            - call: "POST /mrm/models/${r_m3}/findings"
              payload: { severity: "MEDIUM", title: "penalty +2 (a)" }
              as: ModelRiskOfficer
              as_user_id: u_cro
            - call: "POST /mrm/models/${r_m3}/findings"
              payload: { severity: "MEDIUM", title: "penalty +2 (b)" }
              as: ModelRiskOfficer
              as_user_id: u_cro
            - call: "POST /mrm/models/${r_m3}/findings"
              payload: { severity: "MEDIUM", title: "penalty +2 (c)" }
              as: ModelRiskOfficer
              as_user_id: u_cro
          trigger:
            - call: "POST /mrm/regulatory-reports"
              payload: { report_type: "BOARD_QUARTERLY", period_start: "2026-08-01T00:00:00Z", period_end: "2026-09-01T00:00:00Z", aggregation_method: "EXPOSURE_WEIGHTED" }
              as: RegulatoryReporter
              as_user_id: u_rep
              captures: { idx: $.data.inventory_risk_index, m3_score: $.data.total_models }
          assert:
            - "Model.${r_m1}.risk_score == 30 and Model.${r_m2}.risk_score == 30 (20*1 + 10*0 + 10*1)"
            - "Model.${r_m3}.risk_score == 46 (30 + 5*2 + 2*3 findings penalty)"
            - "captured ${idx} == 39.14 (pinned order: (30*1 + 30*2 + 46*4)/7 = 274/7 = 39.142857…, single round_half_up at 2dp)"
            - "Per-contribution rounding (4.29 + 8.57 + 26.29 = 39.15) is the forbidden order and fails this assertion"

  # ---------------------------------------------------------------- Rule 3
  - rule_id: non_linear_state_machine
    instances:
      - name: model_suspend_resume_cycle_restores_approved
        grounds:
          - state_machines.Model.APPROVED_FOR_USE_to_SUSPENDED
          - state_machines.Model.SUSPENDED_to_APPROVED_FOR_USE
        distinguishing_aspect: |
          Entity = Model; shape = cyclic (APPROVED_FOR_USE → SUSPENDED →
          APPROVED_FOR_USE) via system transitions driven by finding
          escalation and closure — not a linear pipeline.
        test_recipe:
          setup:
            - "TIER_1 model M (HIGH/SINGLE_DESK/100 → 70) approved for use at 2026-08-01"
            - "One ACTIVE metric psi (ABOVE 0.25) on M"
            - "CRITICAL finding F created at clock 2026-08-02 → due 2026-08-16; escalation grace → 2026-08-23"
            - "Clock at 2026-08-24: sweep has moved F OPEN→OVERDUE→ESCALATED, M SUSPENDED, psi PAUSED"
          setup_api_calls:
            - call: "POST /mrm/models"
              payload: { name: "Cycle M", business_unit: "Risk", declared_complexity: "HIGH", usage_scope: "SINGLE_DESK", exposure_amount: 100 }
              as: ModelOwner
              as_user_id: u_own_a
              captures: { m_id: $.data.id }
            - call: "POST /mrm/models/${m_id}/documentations"
              payload: { version_label: "1.0", has_development_evidence: true, has_testing_evidence: true, has_data_lineage: true }
              as: ModelOwner
              as_user_id: u_own_a
              captures: { doc_id: $.data.id }
            - call: "POST /mrm/models/${m_id}/documentations/${doc_id}/decide"
              payload: { decision: "APPROVE" }
              as: ModelRiskOfficer
              as_user_id: u_cro
            - call: "POST /mrm/models/${m_id}/validation-engagements"
              payload: { scope_conceptual_soundness: true, scope_outcomes_analysis: true, period_start: "2026-08-01T00:00:00Z", period_end: "2026-08-01T12:00:00Z" }
              as: ModelValidator
              as_user_id: u_val
              captures: { eng_id: $.data.id }
            - call: "POST /mrm/validation-engagements/${eng_id}/complete"
              payload: { outcome: "EFFECTIVE", assessed_complexity: "HIGH" }
              as: ModelValidator
              as_user_id: u_val
            - call: "POST /mrm/models/${m_id}/approve"
              payload: {}
              as: ModelRiskOfficer
              as_user_id: u_cro
            - call: "POST /mrm/models/${m_id}/monitoring-metrics"
              payload: { metric_name: "psi", direction: "ABOVE_IS_BREACH", threshold_value: 0.25 }
              as: ModelOwner
              as_user_id: u_own_a
              captures: { met_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-02T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /mrm/models/${m_id}/findings"
              payload: { severity: "CRITICAL", title: "cycle finding" }
              as: ModelRiskOfficer
              as_user_id: u_cro
              captures: { f_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-24T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /mrm/models/${m_id}/findings/${f_id}/close"
              payload: {}
              as: ModelRiskOfficer
              as_user_id: u_cro
          assert:
            - "Before trigger: Finding.${f_id}.status == ESCALATED, Model.${m_id}.status == SUSPENDED, MonitoringMetric.${met_id}.status == PAUSED"
            - "After close: Finding.${f_id}.status == CLOSED"
            - "After close: Model.${m_id}.status == APPROVED_FOR_USE (auto-resume) — cycle APPROVED_FOR_USE → SUSPENDED → APPROVED_FOR_USE complete"
            - "After close: MonitoringMetric.${met_id}.status == ACTIVE"

      - name: validation_engagement_reopen_cycle_retest
        grounds:
          - state_machines.ValidationEngagement.COMPLETED_to_TESTING
          - state_machines.ValidationEngagement.TESTING_to_COMPLETED
        distinguishing_aspect: |
          Entity = ValidationEngagement (different entity than the Model
          cycle); shape = cyclic retest loop TESTING → COMPLETED → TESTING →
          COMPLETED on the same engagement row.
        test_recipe:
          setup:
            - "Model M registered (LOW/SINGLE_DESK/100 → 30, TIER_3) with APPROVED documentation"
            - "Engagement E completed once (EFFECTIVE_WITH_FINDINGS, assessed MEDIUM → score 60, TIER_2)"
          setup_api_calls:
            - call: "POST /mrm/models"
              payload: { name: "Retest M", business_unit: "Risk", declared_complexity: "LOW", usage_scope: "SINGLE_DESK", exposure_amount: 100 }
              as: ModelOwner
              as_user_id: u_own_a
              captures: { m_id: $.data.id }
            - call: "POST /mrm/models/${m_id}/documentations"
              payload: { version_label: "1.0", has_development_evidence: true, has_testing_evidence: true, has_data_lineage: true }
              as: ModelOwner
              as_user_id: u_own_a
              captures: { doc_id: $.data.id }
            - call: "POST /mrm/models/${m_id}/documentations/${doc_id}/decide"
              payload: { decision: "APPROVE" }
              as: ModelRiskOfficer
              as_user_id: u_cro
            - call: "POST /mrm/models/${m_id}/validation-engagements"
              payload: { scope_conceptual_soundness: true, scope_outcomes_analysis: false, period_start: "2026-08-02T00:00:00Z", period_end: "2026-08-10T00:00:00Z" }
              as: ModelValidator
              as_user_id: u_val
              captures: { eng_id: $.data.id }
            - call: "POST /mrm/validation-engagements/${eng_id}/complete"
              payload: { outcome: "EFFECTIVE_WITH_FINDINGS", assessed_complexity: "MEDIUM" }
              as: ModelValidator
              as_user_id: u_val
          trigger:
            - call: "POST /mrm/validation-engagements/${eng_id}/reopen"
              payload: {}
              as: ModelValidator
              as_user_id: u_val
            - call: "POST /mrm/validation-engagements/${eng_id}/complete"
              payload: { outcome: "EFFECTIVE", assessed_complexity: "LOW" }
              as: ModelValidator
              as_user_id: u_val
          assert:
            - "After first complete: ValidationEngagement.${eng_id}.status == COMPLETED and Model.${m_id}.risk_score == 60 (25*2 + 10*0 + 10*1) and risk_tier == TIER_2"
            - "After reopen: ValidationEngagement.${eng_id}.status == TESTING, completed_at == null, outcome == null"
            - "After second complete: ValidationEngagement.${eng_id}.status == COMPLETED — the cycle looped"
            - "After second complete: Model.${m_id}.risk_score == 35 (25*1 + 10*0 + 10*1, assessed LOW) and risk_tier == TIER_3"

  # ---------------------------------------------------------------- Rule 4
  - rule_id: transitive_cascade
    instances:
      - name: clock_escalation_suspends_model_pauses_metrics
        grounds:
          - state_machines.Finding.OVERDUE_to_ESCALATED
          - state_machines.Model.APPROVED_FOR_USE_to_SUSPENDED
          - state_machines.MonitoringMetric.ACTIVE_to_PAUSED
        distinguishing_aspect: |
          Trigger = POST /_clock/set_current_utc. Depth-3 chain, each hop
          caused by the previous: finding ESCALATED (hop 1) → TIER_1 model
          SUSPENDED because a HIGH escalation landed on it (hop 2) → the
          model's ACTIVE metrics PAUSED because the model suspended (hop 3).
        test_recipe:
          setup:
            - "TIER_1 model M (HIGH/SINGLE_DESK/100 → 70) approved at 2026-08-01"
            - "Two ACTIVE metrics: psi (ABOVE 0.25), auc (BELOW 0.7)"
            - "HIGH finding F created at 2026-08-01 → due 2026-08-31; grace 7d → escalates when now > 2026-09-07"
          setup_api_calls:
            - call: "POST /mrm/models"
              payload: { name: "Cascade M", business_unit: "Risk", declared_complexity: "HIGH", usage_scope: "SINGLE_DESK", exposure_amount: 100 }
              as: ModelOwner
              as_user_id: u_own_a
              captures: { m_id: $.data.id }
            - call: "POST /mrm/models/${m_id}/documentations"
              payload: { version_label: "1.0", has_development_evidence: true, has_testing_evidence: true, has_data_lineage: true }
              as: ModelOwner
              as_user_id: u_own_a
              captures: { doc_id: $.data.id }
            - call: "POST /mrm/models/${m_id}/documentations/${doc_id}/decide"
              payload: { decision: "APPROVE" }
              as: ModelRiskOfficer
              as_user_id: u_cro
            - call: "POST /mrm/models/${m_id}/validation-engagements"
              payload: { scope_conceptual_soundness: true, scope_outcomes_analysis: true, period_start: "2026-08-01T00:00:00Z", period_end: "2026-08-01T06:00:00Z" }
              as: ModelValidator
              as_user_id: u_val
              captures: { eng_id: $.data.id }
            - call: "POST /mrm/validation-engagements/${eng_id}/complete"
              payload: { outcome: "EFFECTIVE", assessed_complexity: "HIGH" }
              as: ModelValidator
              as_user_id: u_val
            - call: "POST /mrm/models/${m_id}/approve"
              payload: {}
              as: ModelRiskOfficer
              as_user_id: u_cro
            - call: "POST /mrm/models/${m_id}/monitoring-metrics"
              payload: { metric_name: "psi", direction: "ABOVE_IS_BREACH", threshold_value: 0.25 }
              as: ModelOwner
              as_user_id: u_own_a
              captures: { met_psi: $.data.id }
            - call: "POST /mrm/models/${m_id}/monitoring-metrics"
              payload: { metric_name: "auc", direction: "BELOW_IS_BREACH", threshold_value: 0.7 }
              as: ModelOwner
              as_user_id: u_own_a
              captures: { met_auc: $.data.id }
            - call: "POST /mrm/models/${m_id}/findings"
              payload: { severity: "HIGH", title: "escalation source" }
              as: ModelRiskOfficer
              as_user_id: u_cro
              captures: { f_id: $.data.id }
          trigger:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-08T00:00:00Z" }
              as: PlatformAdmin
          assert:
            - "Finding.${f_id}.status == ESCALATED (hop 1: 2026-09-08 > due 2026-08-31 + 7d grace = 2026-09-07)"
            - "Model.${m_id}.status == SUSPENDED (hop 2: HIGH escalation on a TIER_1 model)"
            - "MonitoringMetric.${met_psi}.status == PAUSED (hop 3)"
            - "MonitoringMetric.${met_auc}.status == PAUSED (hop 3 applies to every ACTIVE metric)"

      - name: third_consecutive_breach_autoraises_finding_recomputes_risk
        grounds:
          - calculations.consecutive_breach_escalation
          - calculations.model_risk_score
        distinguishing_aspect: |
          Trigger = POST /mrm/monitoring-metrics/{id}/readings (different
          trigger than the clock sweep). Depth-3 chain: breaching reading
          creates a BreachEvent and flips monitoring_posture to BREACHED
          (hop 1); the breach pushes consecutive_breach_count to exactly 3
          which auto-creates a HIGH MONITORING finding (hop 2); the new
          finding bumps open_findings_count and its +5 penalty recomputes
          Model.risk_score (hop 3).
        test_recipe:
          setup:
            - "TIER_1 model M (HIGH/SINGLE_DESK/100 → 70 at registration; 85 after validation with assessed HIGH: 25*3 + 0 + 10) approved at 2026-08-01; clock never advanced, so logical time stays 2026-08-01"
            - "Metric psi (ABOVE 0.25) ACTIVE"
            - "Two breaching readings recorded (0.30 observed 2026-08-02, 0.31 observed 2026-08-03) → consecutive_breach_count == 2"
          setup_api_calls:
            - call: "POST /mrm/models"
