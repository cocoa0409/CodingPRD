            - "the identical component body re-sent with version 2 succeeds with status CONSUMED, the lot reaches version 3, MaterialLot V-OC-1B falls to available_quantity_units 600.0, and the component list holds exactly two rows with total_count 2"

      - name: cumulative_cold_chain_minutes_are_strictly_compared_at_the_two_hundred_forty_minute_limit
        claim_type: rate_threshold_triggers
        grounds:
          - calculations.cold_chain_verdict
          - state_machines.Allocation.SHIPPED_to_QUARANTINED
          - entities.Allocation.fields.cold_chain_status
        distinguishing_aspect: "The cumulative limit is a RATE threshold aggregated across separate calls, not a per-event limit: three events of 100, 140 and 1 minutes are each far under 240, yet the third must flip the verdict because 241 > 240. The instance walks the aggregate to EXACTLY 240 first — which must remain EXCURSION_ACCEPTABLE under the declared strict comparison — with the second event also sitting exactly on HARD_TEMP_LIMIT_C 15.0, so a >= on either constant fires one event early."
