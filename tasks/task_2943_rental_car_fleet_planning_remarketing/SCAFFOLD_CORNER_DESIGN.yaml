      - name: parallel_state_dimensions_advance_independently
        excluded_because:
          difficulty_instance: vehicle_fleet_and_condition_dimensions_advance_independently
          rationale: "The state_machine_shape `parallel` claim - two independent status dimensions on one Vehicle row moving without disturbing each other and combining into a legal compound state - is exactly what that §1.8 instance walks, across the full IN_SERVICE/HELD_FOR_SALE x SOUND/DAMAGE_REPORTED/RECONDITIONING grid."

      - name: cyclic_reject_repropose_loop_terminates
        excluded_because:
          difficulty_instance: redistribution_reject_repropose_cycle_capped_at_three_revisions
          rationale: "The `cyclic` shape claim - entity loops back and the loop's termination condition is respected - is fully covered there: PROPOSED -> REJECTED -> PROPOSED runs to revision_count 3 and the fourth attempt is ERR_REVISION_LIMIT_REACHED."

      - name: bubble_up_from_vehicle_to_allocation_to_plan
        excluded_because:
          difficulty_instance: task_completion_cascades_vehicle_allocation_plan_four_levels
          rationale: "The `bubble up` side-effect pattern - all children terminal so the parent auto-transitions - is the second half of that instance: the last vehicle reaching IN_SERVICE drives PurchaseAllocation to INFLEETED and then FleetPlan LOCKED -> CLOSED, with the intermediate PARTIALLY_INFLEETED hop asserted on the way."

      - name: cross_entity_side_effects_of_a_total_loss
        excluded_because:
          difficulty_instance: total_loss_cascades_vehicle_orders_and_market_census_three_levels
          rationale: "The `cross-entity` side-effect pattern - entity A changes and entities B and C adjust, verifying their state AND fields - is covered there for RedistributionOrder, Consignment and Market.in_service_unit_count in one transition."

      - name: compensating_transitions_reverse_every_side_effect
        excluded_because:
          difficulty_instance: recondition_ledger_returns_to_zero_after_consignment_withdrawal
          rationale: "The `compensation` side-effect pattern - undo transition reverses all original side effects with no drift - is asserted twice in §1.8: this instance for the RECONDITION_REVERSAL ledger pair and market_in_service_census_restored_after_transit_cancellation for the census counter."

      - name: guarded_transition_reads_a_grandparent_state
        excluded_because:
          difficulty_instance: vehicle_in_fleet_blocked_by_grandparent_plan_not_locked
          rationale: "The `guarded transitions` shape claim - A -> B only if a different entity C is in state X - is covered there through the two-hop Vehicle -> PurchaseAllocation -> FleetPlan guard, which is strictly stronger than a single-hop guard."

