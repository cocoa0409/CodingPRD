  - priority: 40
    category: business_referential
    check: "the buyer's certification is CERTIFIED, is for this transaction's unit, and belongs to the buyer household named in the payload"
    error_id: ERR_BUYER_CERTIFICATION_MISMATCH
    http_status: 422
    applies_to: "POST /iz-compliance/resale-transactions/{resale_transaction_id}/certify-buyer"
  - priority: 41
    category: business_referential
    check: "the certified household's income is within the unit's income limit (calculations.income_limit); and when the unit's occupancy_status is RESERVED the certified household must be that unit's occupant_household_id"
    error_id: ERR_HOUSEHOLD_NOT_ELIGIBLE
    http_status: 422
    applies_to: "POST /iz-compliance/income-certifications"
  - priority: 42
    category: business_fiscal
    check: "the project still owes unit equivalents the requested basis can price (calculations.in_lieu_fee_assessment step 1)"
    error_id: ERR_NO_REMAINING_OBLIGATION
    http_status: 422
    applies_to: "POST /iz-compliance/in-lieu-fees"
  - priority: 43
    category: business_fiscal
    check: "the payment does not exceed the outstanding balance: amount_cents <= assessed_amount_cents - paid_amount_cents"
    error_id: ERR_PAYMENT_EXCEEDS_BALANCE
    http_status: 422
    applies_to: "POST /iz-compliance/in-lieu-fees/{fee_id}/payments"
  - priority: 44
    category: business_fiscal
    check: "the proposed price is within the formula ceiling: proposed_price_cents <= max_resale_price_cents"
    error_id: ERR_RESALE_PRICE_EXCEEDS_MAX
    http_status: 422
    applies_to: "POST /iz-compliance/resale-transactions/{resale_transaction_id}/approve-price"
  - priority: 45
    category: business_fiscal
    check: "the requested refinance balance is within the LTV ceiling (calculations.refinance_capacity)"
    error_id: ERR_REFINANCE_EXCEEDS_CAP
    http_status: 422
    applies_to: "POST /iz-compliance/affordable-units/{unit_id}/refinance-review"
  - priority: 46
    category: business_fiscal
    check: "the source in-lieu assessment is PAID before its proceeds may be drawn"
    error_id: ERR_SOURCE_FEE_NOT_PAID
    http_status: 409
    applies_to: "POST /iz-compliance/trust-fund-disbursements/{disbursement_id}/disburse"
  - priority: 47
    category: business_fiscal
    check: "the reinstate's target SUBSTITUTION assessment has received no payment (calculations.substitution_fee_selection)"
    error_id: ERR_SUBSTITUTION_FEE_PAID
    http_status: 422
    applies_to: "POST /iz-compliance/affordable-units/{unit_id}/reinstate"
  - priority: 48
    category: business_fiscal
    check: "ADMIN draws stay inside the fund-use cap: admin_committed_cents + amount_cents <= admin_cap_cents (calculations.trust_fund_ledger)"
    error_id: ERR_ADMIN_USE_CAP_EXCEEDED
    http_status: 422
    applies_to: "POST /iz-compliance/trust-fund-disbursements"
  - priority: 49
    category: business_fiscal
    check: "the fund can cover the commitment: amount_cents (or proposed_price_cents at ROFR exercise) <= unencumbered_balance_cents"
    error_id: ERR_INSUFFICIENT_FUND_BALANCE
    http_status: 422
    applies_to: "POST /iz-compliance/trust-fund-disbursements, POST /iz-compliance/resale-transactions/{resale_transaction_id}/rofr-decision"

  - priority: 50
    category: state
    check: "approving a marketing plan requires its Project to be in state AGREEMENT_RECORDED"
    error_id: ERR_PROJECT_NOT_READY_FOR_MARKETING
    http_status: 409
    applies_to: "POST /iz-compliance/marketing-plans/{marketing_plan_id}/review"
  - priority: 51
    category: business_constraint
    check: "an agreement is recorded only for a project whose compliance_path is ONSITE or OFFSITE; IN_LIEU_FEE and LAND_DEDICATION projects record none"
    error_id: ERR_AGREEMENT_NOT_REQUIRED
    http_status: 422
    applies_to: "POST /iz-compliance/regulatory-agreements/{agreement_id}/record"
  - priority: 52
    category: business_temporal
    check: "recorded_at is on or after the project's approval_date"
    error_id: ERR_RECORDING_PREDATES_APPROVAL
    http_status: 422
    applies_to: "POST /iz-compliance/regulatory-agreements/{agreement_id}/record"
  - priority: 53
    category: business_constraint
    check: "only an OWNERSHIP unit carries a recorded deed restriction"
    error_id: ERR_RESTRICTION_TENURE_MISMATCH
    http_status: 422
    applies_to: "POST /iz-compliance/affordable-units/{unit_id}/record-restriction"
  - priority: 54
    category: state
    check: "no ResaleTransaction of the unit is in a live state (SUBMITTED, PRICE_APPROVED, ROFR_WAIVED, ROFR_EXERCISED, BUYER_CERTIFIED)"
    error_id: ERR_RESALE_IN_PROGRESS
    http_status: 409
    applies_to: "POST /iz-compliance/affordable-units/{unit_id}/release-restriction"
  - priority: 55
    category: business_temporal
    check: "the application window has closed before the draw: logical now >= plan.lottery_close_at"
    error_id: ERR_APPLICATION_WINDOW_OPEN
    http_status: 409
    applies_to: "POST /iz-compliance/lottery-events/{lottery_event_id}/draw"
  - priority: 56
    category: state
    check: "no household selected by the round being redrawn has already reached CERTIFIED"
    error_id: ERR_REDRAW_AFTER_CERTIFICATION
    http_status: 409
    applies_to: "POST /iz-compliance/lottery-events/{lottery_event_id}/redraw"
  - priority: 57
    category: business_constraint
    check: "only a RENTAL certification (expires_at non-null) recertifies; OWNERSHIP certifications never do"
    error_id: ERR_RECERT_NOT_APPLICABLE
    http_status: 422
    applies_to: "POST /iz-compliance/income-certifications/{certification_id}/recertify"
  - priority: 58
    category: business_fiscal
    check: "the project's compliance_posture is COMPLIANT_ONSITE or COMPLIANT_BY_FEE at close-out"
    error_id: ERR_OBLIGATION_UNSATISFIED
    http_status: 422
    applies_to: "POST /iz-compliance/projects/{project_id}/close-out"
  - priority: 59
    category: business_fiscal
    check: "every InLieuFee of the project is PAID or SUPERSEDED at close-out"
    error_id: ERR_FEE_OUTSTANDING
    http_status: 409
    applies_to: "POST /iz-compliance/projects/{project_id}/close-out"
  - priority: 60
    category: business_safety
    check: "no MonitoringReview on any unit of the project is in state FINDING_ISSUED, CURE_SUBMITTED or ESCALATED at close-out"
    error_id: ERR_OPEN_FINDING_BLOCKS_CLOSEOUT
    http_status: 409
    applies_to: "POST /iz-compliance/projects/{project_id}/close-out"

validation_priority_notes: |
  Two deliberate priority conflicts, each pairing DIFFERENT error categories:
  (1) state (priority 19, ERR_FEE_NOT_PAYABLE) beats business_fiscal (priority 43,
      ERR_PAYMENT_EXCEEDS_BALANCE) — paying an over-balance amount into a SUPERSEDED
      assessment violates both and must surface the state error.
  (2) business_safety (priority 22, ERR_UNIT_OUT_OF_COMPLIANCE) beats
      business_referential (priority 39, ERR_PRIOR_TRANSACTION_MISMATCH) — submitting a
      resale on an OUT_OF_COMPLIANCE unit while naming another unit's CLOSED transaction
      as the prior link violates both and must surface the safety error.
  The OCC guard at priority 8 precedes every state and business rule, so any test that
  targets a lower-priority rule on an OCC-guarded endpoint must supply a fresh
  expected_*_version.

# =============================================================================
# §1.5 API Endpoint Table  (every business path is a flat collection under
# /iz-compliance; the single test-driving endpoint lives under /_clock)
# =============================================================================
endpoints:
  # ---- logical clock (test-driving endpoint, §1.5 priority-ladder rung 3) ----
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the server's logical UTC clock, which every deadline, window and expiry rule in this scaffold reads. Before the first call the clock reads exactly 2026-08-01T00:00:00Z (the mandatory startup default); it never falls back to real wall-clock time. Advancing the clock runs a deterministic sweep in this fixed order: step 1 stores the new instant; step 2 expires every CERTIFIED IncomeCertification whose expires_at is now in the past and vacates its unit; step 3 marks every ASSESSED or PARTIALLY_PAID InLieuFee past its due_date DELINQUENT; step 4 auto-waives every PRICE_APPROVED ResaleTransaction whose rofr_deadline's calendar day has fully elapsed (date(rofr_deadline) < date(new now)), leaving intraday-late transactions PRICE_APPROVED so that an explicit late decision still surfaces ERR_ROFR_WINDOW_EXPIRED."
    roles: [ProgramAdministrator, HousingComplianceOfficer, Developer, Resident, FundAuditor]
    code: 200
    input: [current_utc]
    output: "{ current_utc: string, certifications_expired: integer, fees_marked_delinquent: integer, rofr_windows_auto_waived: integer }"
    side_effects:
      - "IncomeCertification CERTIFIED -> EXPIRED, with the OCCUPIED -> VACANT unit cascade"
      - "InLieuFee ASSESSED/PARTIALLY_PAID -> DELINQUENT"
      - "ResaleTransaction PRICE_APPROVED -> ROFR_WAIVED with rofr_auto_waived = true"

  # ---- ordinances ----
  - method: POST
    path: "/iz-compliance/ordinances"
    description: "Publish an inclusionary-zoning ordinance vintage"
    roles: [ProgramAdministrator]
    code: 201
    input: [code, effective_date, min_project_units_threshold, set_aside_bps_by_district, gap_basis_cents_by_level, fee_gap_level_bps, surcharge_bps, surcharge_cap_cents, discount_tiers, fee_due_days, "alternative_paths_allowed?"]
    output: Ordinance
    side_effects:
      - "status = ACTIVE; every earlier-dated ACTIVE Ordinance -> SUPERSEDED (each bumps its own version)"
  - method: GET
    path: "/iz-compliance/ordinances/{ordinance_id}"
    description: "Read one ordinance vintage"
    roles: [ProgramAdministrator, HousingComplianceOfficer, Developer, FundAuditor]
    code: 200
    input: []
    output: Ordinance
    side_effects: []
  - method: GET
    path: "/iz-compliance/ordinances"
    description: "List ordinance vintages"
    roles: [ProgramAdministrator, HousingComplianceOfficer, Developer, FundAuditor]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: Ordinance[]
    side_effects: []

  # ---- AMI schedules ----
  - method: POST
    path: "/iz-compliance/ami-schedules"
    description: "Publish an area-median-income schedule for a calendar year"
    roles: [ProgramAdministrator]
    code: 201
    input: [effective_year, median_income_cents_by_size, utility_allowance_cents_by_bedrooms]
    output: AmiSchedule
    side_effects:
      - "status = ACTIVE; every earlier-year ACTIVE AmiSchedule -> SUPERSEDED (each bumps its own version)"
  - method: GET
    path: "/iz-compliance/ami-schedules/{ami_schedule_id}"
    description: "Read one AMI schedule"
    roles: [ProgramAdministrator, HousingComplianceOfficer, Developer, FundAuditor]
    code: 200
    input: []
    output: AmiSchedule
    side_effects: []
  - method: GET
    path: "/iz-compliance/ami-schedules"
    description: "List AMI schedules"
    roles: [ProgramAdministrator, HousingComplianceOfficer, Developer, FundAuditor]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: AmiSchedule[]
    side_effects: []

  # ---- projects ----
  - method: POST
    path: "/iz-compliance/projects"
    description: "Register a development in DRAFT"
    roles: [Developer]
    code: 201
    input: [name, zoning_district, total_units, approval_date]
    output: Project
    side_effects:
      - "developer_user_id = X-User-ID; state = DRAFT; applicability = PENDING; compliance_posture = PENDING"
  - method: GET
    path: "/iz-compliance/projects/{project_id}"
    description: "Read one project including its live obligation aggregates and compliance_posture"
    roles: [ProgramAdministrator, HousingComplianceOfficer, Developer, FundAuditor]
    code: 200
    input: []
    output: Project
    side_effects: []
  - method: GET
    path: "/iz-compliance/projects"
    description: "List projects, optionally narrowed to one ordinance vintage (FK reverse reachability for Project.ordinance_id)"
    roles: [ProgramAdministrator, HousingComplianceOfficer, Developer, FundAuditor]
    code: 200
    input: ["ordinance_id?", "state?", "applicability?", "compliance_posture?", "limit?", "offset?"]
    output: Project[]
    side_effects: []
  - method: POST
    path: "/iz-compliance/projects/{project_id}/screen"
    description: "Screen the project for ordinance applicability and compute its obligation"
    roles: [HousingComplianceOfficer, ProgramAdministrator]
    code: 200
    input: []
    output: Project
    side_effects:
      - "calculations.ordinance_vintage_selection pins ordinance_id"
      - "calculations.required_units_and_fraction sets applicability, required_affordable_units, fractional_obligation_bps, total_obligation_bps"
      - "state -> SCREENED_SUBJECT or SCREENED_EXEMPT; screened_at set; screen_count += 1"
      - "calculations.project_compliance_posture recomputes compliance_posture; increments Project.version by 1"
  - method: PATCH
    path: "/iz-compliance/projects/{project_id}"
    description: "Amend the entitlement facts, which re-opens screening"
    roles: [Developer]
    code: 200
    input: ["name?", "zoning_district?", "total_units?", "approval_date?"]
    output: Project
    side_effects:
      - "state -> DRAFT; applicability -> PENDING; ordinance_id, compliance_path cleared; obligation fields zeroed; compliance_posture -> PENDING; increments Project.version by 1"
  - method: POST
    path: "/iz-compliance/projects/{project_id}/elect-path"
    description: "Elect the compliance path permitted by the governing ordinance"
    roles: [Developer]
    code: 200
    input: [compliance_path]
    output: Project
    side_effects:
      - "compliance_path set; state SCREENED_SUBJECT -> PATH_ELECTED; increments Project.version by 1"
  - method: POST
    path: "/iz-compliance/projects/{project_id}/close-out"
    description: "Close out the project's inclusionary obligation and release its agreements"
    roles: [ProgramAdministrator, HousingComplianceOfficer]
    code: 200
    input: []
    output: Project
    side_effects:
      - "calculations.unit_mix_compliance leg B enforced"
      - "state MONITORING -> CLOSED_OUT; every RECORDED RegulatoryAgreement of the project -> RELEASED"
      - "increments Project.version by 1"

  # ---- regulatory agreements ----
  - method: POST
    path: "/iz-compliance/regulatory-agreements"
    description: "Draft the regulatory agreement that carries the resale formula and refinance ceiling"
    roles: [HousingComplianceOfficer, ProgramAdministrator]
    code: 201
    input: [project_id, term_years, resale_formula, owner_appreciation_share_bps, max_refinance_ltv_bps]
    output: RegulatoryAgreement
    side_effects: ["state = DRAFT"]
  - method: GET
    path: "/iz-compliance/regulatory-agreements/{agreement_id}"
    description: "Read one regulatory agreement"
    roles: [ProgramAdministrator, HousingComplianceOfficer, Developer, FundAuditor]
    code: 200
    input: []
    output: RegulatoryAgreement
    side_effects: []
  - method: GET
    path: "/iz-compliance/regulatory-agreements"
    description: "List regulatory agreements, optionally narrowed to one project (FK reverse reachability for RegulatoryAgreement.project_id)"
    roles: [ProgramAdministrator, HousingComplianceOfficer, Developer, FundAuditor]
    code: 200
    input: ["project_id?", "state?", "limit?", "offset?"]
    output: RegulatoryAgreement[]
    side_effects: []
  - method: POST
    path: "/iz-compliance/regulatory-agreements/{agreement_id}/record"
    description: "Record the agreement with the county recorder"
    roles: [HousingComplianceOfficer]
    code: 200
    input: [doc_number, recorded_at]
    output: RegulatoryAgreement
    side_effects:
      - "state DRAFT -> RECORDED; doc_number and recorded_at stored; increments RegulatoryAgreement.version by 1"
      - "CASCADE — project.state PATH_ELECTED -> AGREEMENT_RECORDED; increments Project.version by 1"

  # ---- affordable units ----
  - method: POST
    path: "/iz-compliance/affordable-units"
    description: "Create a restricted unit under a recorded-or-draft agreement of the same project"
    roles: [Developer]
    code: 201
    input: [project_id, agreement_id, unit_number, bedrooms, sqft, tenure, affordability_level_bps, market_comparable_sqft]
    output: AffordableUnit
    side_effects:
      - "calculations.unit_mix_compliance leg A enforced"
      - "occupancy_status = PLANNED; compliance_status = COMPLIANT; restriction_state = NOT_RECORDED"
      - "calculations.project_obligation_equivalents recomputes project.onsite_unit_equivalents_bps; calculations.project_compliance_posture recomputes compliance_posture; increments Project.version by 1"
  - method: GET
    path: "/iz-compliance/affordable-units/{unit_id}"
    description: "Read one restricted unit including all three of its state dimensions and its live rent and refinance ceilings"
    roles: [ProgramAdministrator, HousingComplianceOfficer, Developer, Resident, FundAuditor]
    code: 200
    input: []
    output: AffordableUnit
    side_effects: []
  - method: GET
    path: "/iz-compliance/affordable-units"
    description: "List restricted units (FK reverse reachability for AffordableUnit.project_id, .agreement_id and .occupant_household_id)"
    roles: [ProgramAdministrator, HousingComplianceOfficer, Developer, Resident, FundAuditor]
    code: 200
    input: ["project_id?", "agreement_id?", "occupant_household_id?", "occupancy_status?", "compliance_status?", "restriction_state?", "tenure?", "limit?", "offset?"]
    output: AffordableUnit[]
    side_effects: []
  - method: POST
    path: "/iz-compliance/affordable-units/{unit_id}/withdraw"
    description: "Withdraw a planned or marketing unit from the onsite obligation"
    roles: [Developer]
    code: 200
    input: [reason]
    output: AffordableUnit
    side_effects:
      - "occupancy_status -> WITHDRAWN; withdrawn_reason stored; increments AffordableUnit.version by 1"
      - "CASCADE L2 — calculations.project_obligation_equivalents drops onsite_unit_equivalents_bps by 10000 and calculations.project_compliance_posture yields DEFICIENT"
      - "CASCADE L3 — a SUBSTITUTION InLieuFee is assessed via calculations.in_lieu_fee_assessment"
      - "CASCADE L4 — fee_covered_equivalents_bps rises by 10000 and compliance_posture returns to COMPLIANT_BY_FEE"
  - method: POST
    path: "/iz-compliance/affordable-units/{unit_id}/reinstate"
    description: "Reinstate a withdrawn unit and supersede the substitution fee it triggered"
    roles: [Developer]
    code: 200
    input: []
    output: AffordableUnit
    side_effects:
      - "occupancy_status WITHDRAWN -> PLANNED; withdrawn_reason cleared; increments AffordableUnit.version by 1"
      - "the InLieuFee chosen by calculations.substitution_fee_selection -> SUPERSEDED"
      - "calculations.project_obligation_equivalents and calculations.project_compliance_posture recomputed; increments Project.version by 1"
  - method: POST
    path: "/iz-compliance/affordable-units/{unit_id}/record-restriction"
    description: "Record the deed restriction on an ownership unit and freeze its price and AMI basis"
    roles: [HousingComplianceOfficer]
    code: 200
    input: [original_purchase_price_cents, recorded_at]
    output: AffordableUnit
    side_effects:
      - "restriction_state NOT_RECORDED -> RECORDED; restriction_recorded_at and original_purchase_price_cents stored"
      - "ami_income_at_purchase_cents captured from the schedule chosen by calculations.ami_schedule_selection"
      - "increments AffordableUnit.version by 1"
  - method: POST
    path: "/iz-compliance/affordable-units/{unit_id}/release-restriction"
    description: "Release a recorded deed restriction"
    roles: [HousingComplianceOfficer]
    code: 200
    input: []
    output: AffordableUnit
    side_effects: ["restriction_state RECORDED -> RELEASED; increments AffordableUnit.version by 1"]
  - method: POST
    path: "/iz-compliance/affordable-units/{unit_id}/refinance-review"
    description: "Review a proposed refinance against the agreement's loan-to-restricted-value ceiling"
    roles: [Developer, HousingComplianceOfficer]
    code: 200
    input: [requested_balance_cents]
    output: AffordableUnit
    side_effects:
      - "calculations.refinance_capacity sets approved_refinance_cap_cents and, on approval, last_refinance_balance_cents"
      - "increments AffordableUnit.version by 1"

  # ---- marketing plans ----
  - method: POST
    path: "/iz-compliance/marketing-plans"
    description: "Submit a marketing and outreach plan with its half-open application window"
    roles: [Developer]
    code: 201
    input: [project_id, lottery_open_at, lottery_close_at, "preference_categories?"]
    output: MarketingPlan
    side_effects:
      - "calculations.marketing_window_overlap enforced; state = SUBMITTED; revision_round = 0"
  - method: GET
    path: "/iz-compliance/marketing-plans/{marketing_plan_id}"
    description: "Read one marketing plan"
    roles: [ProgramAdministrator, HousingComplianceOfficer, Developer, Resident, FundAuditor]
    code: 200
    input: []
    output: MarketingPlan
    side_effects: []
  - method: GET
    path: "/iz-compliance/marketing-plans"
    description: "List marketing plans (FK reverse reachability for MarketingPlan.project_id)"
    roles: [ProgramAdministrator, HousingComplianceOfficer, Developer, Resident, FundAuditor]
    code: 200
    input: ["project_id?", "state?", "limit?", "offset?"]
    output: MarketingPlan[]
    side_effects: []
  - method: POST
    path: "/iz-compliance/marketing-plans/{marketing_plan_id}/review"
    description: "Approve a marketing plan or send it back for revision"
    roles: [HousingComplianceOfficer]
    code: 200
    input: [decision, "review_note?"]
    output: MarketingPlan
    side_effects:
      - "APPROVE: state -> APPROVED and every PLANNED unit of the project -> MARKETING"
      - "REQUEST_REVISION: state -> REVISION_REQUESTED and no unit changes"
      - "reviewed_by_user_id and review_note stored; increments MarketingPlan.version by 1"
  - method: POST
    path: "/iz-compliance/marketing-plans/{marketing_plan_id}/resubmit"
    description: "Resubmit a revised plan with a new application window"
    roles: [Developer]
    code: 200
    input: [lottery_open_at, lottery_close_at, "preference_categories?"]
    output: MarketingPlan
    side_effects:
      - "calculations.marketing_window_overlap enforced; window and preference_categories replaced"
      - "state REVISION_REQUESTED -> SUBMITTED; revision_round += 1; increments MarketingPlan.version by 1"

  # ---- lottery events ----
  - method: POST
    path: "/iz-compliance/lottery-events"
    description: "Open a lottery round against an approved marketing plan"
    roles: [ProgramAdministrator]
    code: 201
    input: [marketing_plan_id, units_offered, eligibility_level_bps]
    output: LotteryEvent
    side_effects: ["state = PENDING; round_seq = 1"]
  - method: GET
    path: "/iz-compliance/lottery-events/{lottery_event_id}"
    description: "Read one lottery round including its ranked selection and waitlist"
    roles: [ProgramAdministrator, HousingComplianceOfficer, Developer, Resident, FundAuditor]
    code: 200
    input: []
    output: LotteryEvent
    side_effects: []
  - method: GET
    path: "/iz-compliance/lottery-events"
    description: "List lottery rounds (FK reverse reachability for LotteryEvent.marketing_plan_id)"
    roles: [ProgramAdministrator, HousingComplianceOfficer, Developer, Resident, FundAuditor]
    code: 200
    input: ["marketing_plan_id?", "state?", "limit?", "offset?"]
    output: LotteryEvent[]
    side_effects: []
  - method: POST
    path: "/iz-compliance/lottery-events/{lottery_event_id}/draw"
    description: "Run the draw and pair selected households with marketing units"
    roles: [ProgramAdministrator]
    code: 200
    input: []
    output: LotteryEvent
    side_effects:
      - "calculations.lottery_ranking fills selected_household_ids and waitlisted_household_ids"
      - "state PENDING -> DRAWN; drawn_at and drawn_by_user_id stored; increments LotteryEvent.version by 1"
      - "selected Households -> SELECTED, waitlisted -> WAITLISTED, each with rank_position"
      - "MARKETING units ordered by unit_number ASC -> RESERVED with occupant_household_id set"
      - "the marketing plan -> CLOSED"
  - method: POST
    path: "/iz-compliance/lottery-events/{lottery_event_id}/redraw"
    description: "Void a draw and return the round to PENDING"
    roles: [ProgramAdministrator]
    code: 200
    input: [reason]
    output: LotteryEvent
    side_effects:
      - "state DRAWN -> PENDING; round_seq += 1; selections cleared; redraw_reason stored; increments LotteryEvent.version by 1"
      - "SELECTED and WAITLISTED households -> APPLIED with rank_position cleared"
      - "RESERVED units -> MARKETING with occupant_household_id cleared"

  # ---- households ----
  - method: POST
    path: "/iz-compliance/households"
    description: "Register an applicant household; the created id is the Resident's X-User-ID"
    roles: [ProgramAdministrator, HousingComplianceOfficer]
    code: 201
    input: [applicant_name, household_size, gross_annual_income_cents]
    output: Household
    side_effects: ["state = REGISTERED; preference_score = 0"]
  - method: GET
    path: "/iz-compliance/households/{household_id}"
    description: "Read one household"
    roles: [ProgramAdministrator, HousingComplianceOfficer, Resident, FundAuditor]
    code: 200
    input: []
    output: Household
    side_effects: []
  - method: GET
    path: "/iz-compliance/households"
    description: "List households (FK reverse reachability for Household.lottery_event_id)"
    roles: [ProgramAdministrator, HousingComplianceOfficer, Resident, FundAuditor]
    code: 200
    input: ["lottery_event_id?", "state?", "limit?", "offset?"]
    output: Household[]
    side_effects: []
  - method: POST
    path: "/iz-compliance/households/{household_id}/apply"
    description: "Apply to an open lottery round inside its half-open window"
    roles: [Resident]
    code: 200
    input: [lottery_event_id, "preference_claims?"]
    output: Household
    side_effects:
      - "lottery_event_id and preference_claims stored; preference_score scored against the plan's preference_categories"
      - "state REGISTERED -> APPLIED; increments Household.version by 1"

  # ---- income certifications ----
  - method: POST
    path: "/iz-compliance/income-certifications"
    description: "Certify a household's income against a unit's affordability level"
    roles: [HousingComplianceOfficer]
    code: 201
    input: [household_id, unit_id, certified_income_cents, contract_rent_cents, effective_date]
    output: IncomeCertification
    side_effects:
      - "calculations.ami_schedule_selection pins ami_schedule_year; calculations.income_limit sets income_limit_cents; calculations.max_allowed_rent sets max_rent_cents; ami_pct_bps computed; expires_at set for RENTAL units"
      - "calculations.certification_period_overlap enforced; state = CERTIFIED"
      - "CASCADE — the unit -> OCCUPIED with current_rent_cents and max_allowed_rent_cents refreshed; the household -> CERTIFIED; a fully certified lottery round -> COMPLETED; a project in AGREEMENT_RECORDED -> MONITORING"
  - method: GET
    path: "/iz-compliance/income-certifications/{certification_id}"
    description: "Read one income certification"
    roles: [ProgramAdministrator, HousingComplianceOfficer, Developer, Resident, FundAuditor]
    code: 200
    input: []
    output: IncomeCertification
    side_effects: []
  - method: GET
    path: "/iz-compliance/income-certifications"
    description: "List income certifications (FK reverse reachability for IncomeCertification.household_id and .unit_id)"
    roles: [ProgramAdministrator, HousingComplianceOfficer, Developer, Resident, FundAuditor]
    code: 200
    input: ["household_id?", "unit_id?", "state?", "is_recertification?", "limit?", "offset?"]
    output: IncomeCertification[]
    side_effects: []
  - method: POST
    path: "/iz-compliance/income-certifications/{certification_id}/recertify"
    description: "Annual recertification; the successor period starts the day after the predecessor expires"
    roles: [HousingComplianceOfficer]
    code: 201
    input: [certified_income_cents, contract_rent_cents]
    output: IncomeCertification
    side_effects:
      - "the predecessor -> SUPERSEDED; a successor is created with is_recertification = true and effective_date = predecessor.expires_at + 1 day"
      - "income_limit_cents, max_rent_cents, ami_pct_bps and expires_at recomputed from the schedule chosen by calculations.ami_schedule_selection"
      - "the unit's current_rent_cents and max_allowed_rent_cents refreshed; increments AffordableUnit.version by 1"

  # ---- monitoring reviews ----
  - method: POST
    path: "/iz-compliance/monitoring-reviews"
    description: "Record an annual monitoring review of rent, income and occupancy; findings are evaluated at creation"
    roles: [HousingComplianceOfficer]
    code: 201
    input: [unit_id, review_year, reported_rent_cents, reported_income_cents, occupancy_verified]
    output: MonitoringReview
    side_effects:
      - "calculations.monitoring_findings fills finding_types; state -> COMPLIANT when empty, FINDING_ISSUED otherwise"
      - "on FINDING_ISSUED: calculations.cure_penalty_and_deadline sets overcharge_monthly_cents, penalty_at_base_cents, cure_extension_days and cure_deadline; issued_by_user_id and finding_issued_at stored"
      - "CASCADE — the unit's compliance_status COMPLIANT -> FINDING_OPEN; increments AffordableUnit.version by 1"
  - method: GET
    path: "/iz-compliance/monitoring-reviews/{monitoring_review_id}"
    description: "Read one monitoring review including its frozen deadline and penalty figures"
    roles: [ProgramAdministrator, HousingComplianceOfficer, Developer, FundAuditor]
    code: 200
    input: []
    output: MonitoringReview
    side_effects: []
  - method: GET
    path: "/iz-compliance/monitoring-reviews"
    description: "List monitoring reviews (FK reverse reachability for MonitoringReview.unit_id)"
    roles: [ProgramAdministrator, HousingComplianceOfficer, Developer, FundAuditor]
    code: 200
    input: ["unit_id?", "state?", "review_year?", "limit?", "offset?"]
    output: MonitoringReview[]
    side_effects: []
  - method: POST
    path: "/iz-compliance/monitoring-reviews/{monitoring_review_id}/submit-cure"
    description: "Submit a cure for an issued finding; timeliness is measured against the frozen cure_deadline"
    roles: [Developer]
    code: 200
    input: [corrected_rent_cents]
    output: MonitoringReview
    side_effects:
      - "cure_submitted_at and corrected_rent_cents stored; calculations.cure_penalty_and_deadline step 3 sets penalty_final_cents; cure_deadline and cure_extension_days are NOT re-derived"
      - "state -> CURE_SUBMITTED when submitted on or before cure_deadline, else -> ESCALATED"
      - "CASCADE — the unit's compliance_status -> CURE_PENDING on the timely branch, -> OUT_OF_COMPLIANCE on the late branch; increments AffordableUnit.version by 1"
  - method: POST
    path: "/iz-compliance/monitoring-reviews/{monitoring_review_id}/clear-cure"
    description: "Clear a submitted cure; the officer who issued the finding may not clear it"
    roles: [HousingComplianceOfficer]
    code: 200
    input: []
    output: MonitoringReview
    side_effects:
      - "state CURE_SUBMITTED -> CURED; cleared_by_user_id stored; increments MonitoringReview.version by 1"
      - "CASCADE — the unit's compliance_status CURE_PENDING -> COMPLIANT; calculations.project_compliance_posture recomputed"
  - method: POST
    path: "/iz-compliance/monitoring-reviews/{monitoring_review_id}/escalate"
    description: "Escalate a submitted cure to enforcement"
    roles: [HousingComplianceOfficer]
    code: 200
    input: []
    output: MonitoringReview
    side_effects:
      - "state CURE_SUBMITTED -> ESCALATED; increments MonitoringReview.version by 1"
      - "CASCADE — the unit's compliance_status CURE_PENDING -> OUT_OF_COMPLIANCE; project.compliance_posture -> UNDER_ENFORCEMENT"

  # ---- resale transactions ----
  - method: POST
    path: "/iz-compliance/resale-transactions"
    description: "Submit a resale of a deed-restricted unit; supersedes any open submission for the same unit"
    roles: [Resident, ProgramAdministrator, HousingComplianceOfficer]
    code: 201
    input: [unit_id, expected_unit_version, proposed_price_cents, appraised_value_cents, capital_improvements_cents, deferred_maintenance_cents, broker_fee_cents, "prior_transaction_id?"]
    output: ResaleTransaction
    side_effects:
      - "requires expected_unit_version to equal the live AffordableUnit.version, else ERR_STALE_UNIT_VERSION (§1.2.1 resale-create-stale-unit)"
      - "calculations.max_resale_price sets resale_formula_applied, indexed_base_cents, improvement_credit_cents and max_resale_price_cents"
      - "seller_household_id copied from unit.occupant_household_id; state = SUBMITTED"
      - "any other SUBMITTED ResaleTransaction of the same unit -> SUPERSEDED"
      - "increments AffordableUnit.version by 1"
  - method: GET
    path: "/iz-compliance/resale-transactions/{resale_transaction_id}"
    description: "Read one resale transaction including its ceiling and, once closed, its proceeds waterfall"
    roles: [ProgramAdministrator, HousingComplianceOfficer, Developer, Resident, FundAuditor]
    code: 200
    input: []
    output: ResaleTransaction
    side_effects: []
  - method: GET
    path: "/iz-compliance/resale-transactions"
    description: "List resale transactions (FK reverse reachability for ResaleTransaction.unit_id, .prior_transaction_id, .seller_household_id, .buyer_household_id and .buyer_certification_id)"
    roles: [ProgramAdministrator, HousingComplianceOfficer, Developer, Resident, FundAuditor]
    code: 200
    input: ["unit_id?", "prior_transaction_id?", "seller_household_id?", "buyer_household_id?", "buyer_certification_id?", "state?", "limit?", "offset?"]
    output: ResaleTransaction[]
    side_effects: []
  - method: POST
    path: "/iz-compliance/resale-transactions/{resale_transaction_id}/approve-price"
    description: "Approve the proposed price against the frozen formula ceiling and open the right-of-first-refusal window"
    roles: [HousingComplianceOfficer]
    code: 200
    input: []
    output: ResaleTransaction
    side_effects:
      - "state SUBMITTED -> PRICE_APPROVED; price_approved_at and price_approved_by_user_id stored; rofr_deadline = price_approved_at + ROFR_WINDOW_DAYS"
      - "increments ResaleTransaction.version by 1"
  - method: POST
    path: "/iz-compliance/resale-transactions/{resale_transaction_id}/rofr-decision"
    description: "Exercise or waive the city's right of first refusal inside the window"
    roles: [ProgramAdministrator]
    code: 200
    input: [decision]
    output: ResaleTransaction
    side_effects:
      - "EXERCISE: state -> ROFR_EXERCISED after calculations.trust_fund_ledger confirms unencumbered_balance_cents covers proposed_price_cents"
      - "WAIVE: state -> ROFR_WAIVED"
      - "increments ResaleTransaction.version by 1"
  - method: POST
    path: "/iz-compliance/resale-transactions/{resale_transaction_id}/certify-buyer"
    description: "Attach the certified buyer; the officer who approved the price may not certify the buyer"
    roles: [HousingComplianceOfficer]
    code: 200
    input: [buyer_household_id, certification_id]
    output: ResaleTransaction
    side_effects:
      - "buyer_household_id and buyer_certification_id stored; state ROFR_WAIVED -> BUYER_CERTIFIED; increments ResaleTransaction.version by 1"
  - method: POST
    path: "/iz-compliance/resale-transactions/{resale_transaction_id}/close"
    description: "Close the resale and run the proceeds waterfall"
    roles: [HousingComplianceOfficer]
    code: 200
    input: []
    output: ResaleTransaction
    side_effects:
      - "calculations.resale_proceeds_waterfall fills net_proceeds_cents, seller_equity_cents, seller_improvement_credit_cents, seller_appreciation_share_cents and city_recapture_cents"
      - "state -> CLOSED from BUYER_CERTIFIED or -> CITY_PURCHASE_CLOSED from ROFR_EXERCISED; closed_at stored"
      - "CASCADE L2 — the unit's occupant, original_purchase_price_cents and ami_income_at_purchase_cents are reset; occupancy_status -> OCCUPIED (CLOSED) or VACANT (CITY_PURCHASE_CLOSED)"
      - "CASCADE L3 — the seller's CERTIFIED IncomeCertification -> SUPERSEDED"
      - "CASCADE L4 — calculations.trust_fund_ledger total_recapture_cents, unencumbered_balance_cents and admin_cap_cents all rise"

  # ---- in-lieu fees ----
  - method: POST
    path: "/iz-compliance/in-lieu-fees"
    description: "Assess an in-lieu fee against a project's outstanding obligation"
    roles: [ProgramAdministrator, HousingComplianceOfficer]
    code: 201
    input: [project_id, basis, expected_project_version]
    output: InLieuFee
    side_effects:
      - "requires expected_project_version to equal the live Project.version, else ERR_STALE_PROJECT_VERSION (§1.2.1 fee-assess-stale-project)"
      - "ordinance_id copied from project.ordinance_id; calculations.in_lieu_fee_assessment fills unit_equivalent_bps, base_amount_cents, surcharge_cents, pre_discount_total_cents, discount_bps_applied, discount_cents, assessed_amount_cents and due_date"
      - "state = ASSESSED; any other open assessment of the same project -> SUPERSEDED with superseded_by_fee_id set"
      - "calculations.project_obligation_equivalents and calculations.project_compliance_posture recomputed; increments Project.version by 1"
  - method: GET
    path: "/iz-compliance/in-lieu-fees/{fee_id}"
    description: "Read one in-lieu assessment including its full pricing breakdown"
    roles: [ProgramAdministrator, HousingComplianceOfficer, Developer, FundAuditor]
    code: 200
    input: []
    output: InLieuFee
    side_effects: []
  - method: GET
    path: "/iz-compliance/in-lieu-fees"
    description: "List in-lieu assessments (FK reverse reachability for InLieuFee.project_id, .ordinance_id and .superseded_by_fee_id)"
    roles: [ProgramAdministrator, HousingComplianceOfficer, Developer, FundAuditor]
    code: 200
    input: ["project_id?", "ordinance_id?", "superseded_by_fee_id?", "basis?", "state?", "limit?", "offset?"]
    output: InLieuFee[]
    side_effects: []
  - method: POST
    path: "/iz-compliance/in-lieu-fees/{fee_id}/payments"
    description: "Record a payment against an open assessment"
    roles: [Developer]
    code: 200
    input: [amount_cents]
    output: InLieuFee
    side_effects:
      - "paid_amount_cents increased; last_payment_at stored; state -> PARTIALLY_PAID or PAID; increments InLieuFee.version by 1"
      - "calculations.trust_fund_ledger total_paid_fees_cents, unencumbered_balance_cents and admin_cap_cents all rise"

  # ---- housing trust fund ----
  - method: POST
    path: "/iz-compliance/trust-fund-disbursements"
    description: "Request a draw against a paid assessment, subject to the fund-use restrictions"
    roles: [ProgramAdministrator]
    code: 201
    input: [source_fee_id, eligible_use, amount_cents]
    output: TrustFundDisbursement
    side_effects:
      - "calculations.trust_fund_ledger enforces the unencumbered balance and, for ADMIN draws, the admin cap"
      - "state = REQUESTED; requested_by_user_id stored; the amount becomes encumbered so unencumbered_balance_cents falls"
  - method: GET
    path: "/iz-compliance/trust-fund-disbursements/{disbursement_id}"
    description: "Read one trust-fund draw"
    roles: [ProgramAdministrator, FundAuditor]
    code: 200
    input: []
    output: TrustFundDisbursement
    side_effects: []
  - method: GET
    path: "/iz-compliance/trust-fund-disbursements"
    description: "List trust-fund draws (FK reverse reachability for TrustFundDisbursement.source_fee_id)"
    roles: [ProgramAdministrator, FundAuditor]
    code: 200
    input: ["source_fee_id?", "eligible_use?", "state?", "limit?", "offset?"]
    output: TrustFundDisbursement[]
    side_effects: []
  - method: POST
    path: "/iz-compliance/trust-fund-disbursements/{disbursement_id}/disburse"
    description: "Disburse a requested draw"
    roles: [ProgramAdministrator]
    code: 200
    input: []
    output: TrustFundDisbursement
    side_effects:
      - "state REQUESTED -> DISBURSED; disbursed_at stored; the amount moves from encumbered to disbursed and unencumbered_balance_cents is unchanged"
      - "increments TrustFundDisbursement.version by 1"
  - method: POST
    path: "/iz-compliance/trust-fund-disbursements/{disbursement_id}/void"
    description: "Void a requested or disbursed draw; the compensating action that restores the fund"
    roles: [ProgramAdministrator]
    code: 200
    input: [void_reason]
    output: TrustFundDisbursement
    side_effects:
      - "state -> VOIDED; void_reason stored; the amount leaves both the encumbered and disbursed buckets so unencumbered_balance_cents returns to exactly its pre-request value"
      - "increments TrustFundDisbursement.version by 1"
  - method: GET
    path: "/iz-compliance/trust-fund-summary"
    description: "Computed read of the housing trust fund ledger (calculations.trust_fund_ledger)"
    roles: [ProgramAdministrator, FundAuditor]
    code: 200
    input: []
    output: "{ total_paid_fees_cents: integer, total_recapture_cents: integer, total_inflow_cents: integer, encumbered_cents: integer, disbursed_cents: integer, unencumbered_balance_cents: integer, admin_cap_cents: integer, admin_committed_cents: integer }"
    side_effects: []
  - method: GET
    path: "/iz-compliance/funder-reports"
    description: "Computed program-compliance report for one project on the requested accounting basis (calculations.funder_report_metrics)"
    roles: [FundAuditor, ProgramAdministrator, HousingComplianceOfficer]
    code: 200
    input: [project_id, basis, "limit?", "offset?"]
    output: "{ project_id: string, basis: string, total_obligation_bps: integer, delivered_equivalents_bps: integer, occupied_equivalents_bps: integer, compliance_ratio_bps: integer, open_findings_count: integer, total_fees_assessed_cents: integer, total_fees_paid_cents: integer }"
    side_effects: []

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  # --- authentication / authorization ---
  - id: ERR_MISSING_AUTH_HEADERS
    http: 401
    condition: "X-User-ID or X-User-Role absent or empty"
  - id: ERR_UNKNOWN_ROLE
    http: 401
    condition: "X-User-Role is not one of the five declared roles"
  - id: ERR_UNAUTHORIZED
    http: 403
    condition: "the acting role is not listed in the endpoint's roles"
  - id: ERR_NOT_RESOURCE_OWNER
    http: 403
    condition: "a Developer acts on a project it does not own, a Resident acts on another household, or a Resident submits a resale of a unit it does not occupy"
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 403
    condition: "the finding's issuer attempts to clear its cure, or the price approver attempts to certify the buyer"
  # --- request validation ---
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "missing required field, wrong type, enum outside its domain, out-of-range integer, pagination limit outside 1..100, non-zero contract rent on an OWNERSHIP certification, or malformed discount_tiers"
  # --- existence ---
  - id: ERR_ORDINANCE_NOT_FOUND
    http: 404
    condition: "ordinance_id does not resolve"
  - id: ERR_AMI_SCHEDULE_NOT_FOUND
    http: 404
    condition: "ami_schedule_id does not resolve"
  - id: ERR_PROJECT_NOT_FOUND
    http: 404
    condition: "project_id does not resolve"
  - id: ERR_UNIT_NOT_FOUND
    http: 404
    condition: "unit_id does not resolve"
  - id: ERR_AGREEMENT_NOT_FOUND
    http: 404
    condition: "agreement_id does not resolve"
  - id: ERR_MARKETING_PLAN_NOT_FOUND
    http: 404
    condition: "marketing_plan_id does not resolve"
  - id: ERR_LOTTERY_EVENT_NOT_FOUND
    http: 404
    condition: "lottery_event_id does not resolve"
  - id: ERR_HOUSEHOLD_NOT_FOUND
    http: 404
    condition: "household_id or buyer_household_id does not resolve"
  - id: ERR_CERTIFICATION_NOT_FOUND
    http: 404
    condition: "certification_id does not resolve"
  - id: ERR_MONITORING_REVIEW_NOT_FOUND
    http: 404
    condition: "monitoring_review_id does not resolve"
  - id: ERR_RESALE_TRANSACTION_NOT_FOUND
    http: 404
    condition: "resale_transaction_id or prior_transaction_id does not resolve"
  - id: ERR_FEE_NOT_FOUND
    http: 404
    condition: "fee_id or source_fee_id does not resolve"
  - id: ERR_DISBURSEMENT_NOT_FOUND
    http: 404
    condition: "disbursement_id does not resolve"
  # --- optimistic concurrency (§1.2.1) ---
  - id: ERR_STALE_PROJECT_VERSION
    http: 412
    condition: "expected_project_version does not equal the live Project.version on POST /iz-compliance/in-lieu-fees"
  - id: ERR_STALE_UNIT_VERSION
    http: 412
    condition: "expected_unit_version does not equal the live AffordableUnit.version on POST /iz-compliance/resale-transactions"
  # --- state preconditions ---
  - id: ERR_INVALID_PROJECT_STATE
    http: 409
    condition: "the project's state does not permit screening, amendment, path election, agreement recording, unit creation or close-out"
  - id: ERR_AGREEMENT_NOT_RECORDED
    http: 409
    condition: "the regulatory agreement is not DRAFT for recording, or not RECORDED when a unit restriction is recorded against it"
  - id: ERR_AGREEMENT_NOT_REQUIRED
    http: 422
    condition: "recording is attempted for a project whose compliance_path is IN_LIEU_FEE or LAND_DEDICATION"
  - id: ERR_RECORDING_PREDATES_APPROVAL
    http: 422
    condition: "recorded_at is earlier than the project's approval_date"
  - id: ERR_UNIT_NOT_RESTRICTED
    http: 409
    condition: "the unit's restriction_state does not permit recording, release, refinance review or resale submission"
  - id: ERR_RESTRICTION_TENURE_MISMATCH
    http: 422
    condition: "a deed restriction is recorded against a RENTAL unit"
  - id: ERR_UNIT_OCCUPANCY_STATE_INVALID
    http: 409
    condition: "withdraw is attempted from an occupancy_status other than PLANNED or MARKETING, or reinstate from anything other than WITHDRAWN"
  - id: ERR_RESALE_IN_PROGRESS
    http: 409
    condition: "release-restriction is attempted while a live resale exists for the unit"
  - id: ERR_PLAN_NOT_APPROVED
    http: 409
    condition: "the marketing plan's state does not permit review, resubmission, or opening a lottery round"
  - id: ERR_PROJECT_NOT_READY_FOR_MARKETING
    http: 409
    condition: "a marketing plan is approved before its project reaches AGREEMENT_RECORDED"
  - id: ERR_LOTTERY_STATE_INVALID
    http: 409
    condition: "the lottery round's state does not permit drawing, redrawing or accepting an application"
  - id: ERR_REDRAW_AFTER_CERTIFICATION
    http: 409
    condition: "a redraw is attempted after one of the selected households has already been certified"
  - id: ERR_HOUSEHOLD_STATE_INVALID
    http: 409
    condition: "the household's state does not permit applying or being certified"
  - id: ERR_CERTIFICATION_NOT_ACTIVE
    http: 409
    condition: "recertification targets a certification that is not CERTIFIED"
  - id: ERR_RECERT_NOT_APPLICABLE
    http: 422
    condition: "recertification targets an OWNERSHIP certification, which has no expiry"
  - id: ERR_REVIEW_STATE_INVALID
    http: 409
    condition: "the monitoring review's state does not permit cure submission, clearing or escalation"
  - id: ERR_RESALE_STATE_INVALID
    http: 409
    condition: "the resale transaction's state does not permit price approval, the ROFR decision, buyer certification or closing"
  - id: ERR_FEE_NOT_PAYABLE
    http: 409
    condition: "a payment is recorded against a PAID or SUPERSEDED assessment"
  - id: ERR_DISBURSEMENT_STATE_INVALID
    http: 409
    condition: "disburse is attempted from a state other than REQUESTED, or void from VOIDED"
  # --- compliance and safety ---
  - id: ERR_UNIT_OUT_OF_COMPLIANCE
    http: 422
    condition: "a resale, refinance review or restriction release is attempted on a unit whose compliance_status is OUT_OF_COMPLIANCE"
  - id: ERR_CURE_INSUFFICIENT
    http: 422
    condition: "the cure is cleared although corrected_rent_cents still exceeds the unit's max_allowed_rent_cents"
  - id: ERR_COMPARABILITY_STANDARD_FAILED
    http: 422
    condition: "the unit's sqft is below COMPARABILITY_MIN_BPS of its market comparable"
  - id: ERR_BEDROOM_DISTRIBUTION_FAILED
    http: 422
    condition: "at close-out the project's affordable units do not meet the family-unit bedroom floor"
  - id: ERR_OPEN_FINDING_BLOCKS_CLOSEOUT
    http: 409
    condition: "close-out is attempted while a monitoring finding is still open on any unit of the project"
  # --- program constraints ---
  - id: ERR_NO_GOVERNING_ORDINANCE
    http: 422
    condition: "no ordinance vintage was in force on the project's approval_date"
  - id: ERR_NO_AMI_SCHEDULE
    http: 422
    condition: "no AMI schedule has been published, so no income limit, rent ceiling or indexed price can be computed"
  - id: ERR_PATH_NOT_PERMITTED
    http: 422
    condition: "the elected compliance path is neither ONSITE nor listed in the ordinance's alternative_paths_allowed"
  - id: ERR_DUPLICATE_RESOURCE
    http: 409
    condition: "a uniqueness constraint is violated: ordinance code, AMI schedule effective_year, unit_number within a project, review_year within a unit, or recorder doc_number"
  - id: ERR_EMPTY_ELIGIBLE_POOL
    http: 422
    condition: "a draw or redraw finds no income-eligible applicant attached to the round"
  - id: ERR_NO_SUBSTITUTION_FEE
    http: 422
    condition: "a reinstate finds no open SUBSTITUTION assessment to supersede"
  # --- temporal ---
  - id: ERR_INVALID_MARKETING_WINDOW
    http: 422
    condition: "lottery_open_at is not strictly before lottery_close_at"
  - id: ERR_MARKETING_WINDOW_OVERLAP
    http: 409
    condition: "the half-open marketing window overlaps another live plan of the same project; exact adjacency is permitted"
  - id: ERR_APPLICATION_WINDOW_CLOSED
    http: 422
    condition: "an application arrives outside the plan's half-open window"
  - id: ERR_APPLICATION_WINDOW_OPEN
    http: 409
    condition: "a draw is run before the plan's application window has closed"
  - id: ERR_CERTIFICATION_PERIOD_OVERLAP
    http: 409
    condition: "the new closed certification period intersects a CERTIFIED period for the same RENTAL unit; touching endpoints collide"
  - id: ERR_RECERT_WINDOW_NOT_OPEN
    http: 422
    condition: "recertification is attempted more than RECERT_WINDOW_DAYS before the predecessor expires"
  - id: ERR_ROFR_WINDOW_EXPIRED
    http: 409
    condition: "a right-of-first-refusal decision arrives after rofr_deadline"
  # --- referential integrity ---
  - id: ERR_UNIT_PROJECT_MISMATCH
    http: 422
    condition: "the agreement supplied at unit creation belongs to a different project than the unit"
  - id: ERR_PRIOR_TRANSACTION_MISMATCH
    http: 422
    condition: "prior_transaction_id is not a CLOSED resale of the same unit, or is omitted although the unit has CLOSED resale history"
  - id: ERR_BUYER_CERTIFICATION_MISMATCH
    http: 422
    condition: "the buyer's certification is not CERTIFIED, is for another unit, or belongs to another household"
  - id: ERR_HOUSEHOLD_NOT_ELIGIBLE
    http: 422
    condition: "the household's certified income exceeds the unit's income limit, or the household was never selected for this project"
  # --- fiscal ---
  - id: ERR_NO_REMAINING_OBLIGATION
    http: 422
    condition: "the requested fee basis prices zero or negative unit equivalents"
  - id: ERR_PAYMENT_EXCEEDS_BALANCE
    http: 422
    condition: "the payment exceeds the assessment's outstanding balance"
  - id: ERR_RESALE_PRICE_EXCEEDS_MAX
    http: 422
    condition: "proposed_price_cents exceeds the frozen max_resale_price_cents"
  - id: ERR_REFINANCE_EXCEEDS_CAP
    http: 422
    condition: "requested_balance_cents exceeds approved_refinance_cap_cents"
  - id: ERR_SOURCE_FEE_NOT_PAID
    http: 409
    condition: "a draw is disbursed while its source assessment is not PAID"
  - id: ERR_SUBSTITUTION_FEE_PAID
    http: 422
    condition: "a reinstate targets a SUBSTITUTION assessment that has already received a payment"
  - id: ERR_ADMIN_USE_CAP_EXCEEDED
    http: 422
    condition: "an ADMIN draw would push admin_committed_cents past admin_cap_cents"
  - id: ERR_INSUFFICIENT_FUND_BALANCE
    http: 422
    condition: "a draw request or an exercised right of first refusal exceeds unencumbered_balance_cents"
  - id: ERR_OBLIGATION_UNSATISFIED
    http: 422
    condition: "close-out is attempted while the project's compliance_posture is PENDING, DEFICIENT or UNDER_ENFORCEMENT"
  - id: ERR_FEE_OUTSTANDING
    http: 409
    condition: "close-out is attempted while an assessment of the project is still ASSESSED, PARTIALLY_PAID or DELINQUENT"

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: ProgramAdministrator
    description: "City housing department program lead: publishes ordinance vintages and AMI schedules, assesses in-lieu fees, runs lotteries, decides the city's right of first refusal and administers the housing trust fund"
    identity: opaque
    exclusive_operations:
      - "POST /iz-compliance/ordinances"
      - "POST /iz-compliance/ami-schedules"
      - "POST /iz-compliance/lottery-events"
      - "POST /iz-compliance/lottery-events/{lottery_event_id}/draw"
      - "POST /iz-compliance/lottery-events/{lottery_event_id}/redraw"
      - "POST /iz-compliance/resale-transactions/{resale_transaction_id}/rofr-decision"
      - "POST /iz-compliance/trust-fund-disbursements"
      - "POST /iz-compliance/trust-fund-disbursements/{disbursement_id}/disburse"
      - "POST /iz-compliance/trust-fund-disbursements/{disbursement_id}/void"
    shared_operations:
      - "POST /iz-compliance/projects/{project_id}/screen (with HousingComplianceOfficer)"
      - "POST /iz-compliance/projects/{project_id}/close-out (with HousingComplianceOfficer)"
      - "POST /iz-compliance/regulatory-agreements (with HousingComplianceOfficer)"
      - "POST /iz-compliance/in-lieu-fees (with HousingComplianceOfficer)"
      - "POST /iz-compliance/households (with HousingComplianceOfficer)"
      - "POST /iz-compliance/resale-transactions (with HousingComplianceOfficer and the owning Resident)"
      - "POST /_clock/set_current_utc (with every role)"
      - "all GET reads except none"
  - name: HousingComplianceOfficer
    description: "Monitoring and certification officer: screens projects, records agreements and deed restrictions, approves marketing plans, certifies incomes, issues and resolves monitoring findings and approves resale prices"
    identity: opaque
    exclusive_operations:
      - "POST /iz-compliance/regulatory-agreements/{agreement_id}/record"
      - "POST /iz-compliance/affordable-units/{unit_id}/record-restriction"
      - "POST /iz-compliance/affordable-units/{unit_id}/release-restriction"
      - "POST /iz-compliance/marketing-plans/{marketing_plan_id}/review"
      - "POST /iz-compliance/income-certifications"
      - "POST /iz-compliance/income-certifications/{certification_id}/recertify"
      - "POST /iz-compliance/monitoring-reviews"
      - "POST /iz-compliance/monitoring-reviews/{monitoring_review_id}/clear-cure"
      - "POST /iz-compliance/monitoring-reviews/{monitoring_review_id}/escalate"
      - "POST /iz-compliance/resale-transactions/{resale_transaction_id}/approve-price"
      - "POST /iz-compliance/resale-transactions/{resale_transaction_id}/certify-buyer"
      - "POST /iz-compliance/resale-transactions/{resale_transaction_id}/close"
    shared_operations:
      - "POST /iz-compliance/projects/{project_id}/screen (with ProgramAdministrator)"
      - "POST /iz-compliance/projects/{project_id}/close-out (with ProgramAdministrator)"
      - "POST /iz-compliance/regulatory-agreements (with ProgramAdministrator)"
      - "POST /iz-compliance/in-lieu-fees (with ProgramAdministrator)"
      - "POST /iz-compliance/households (with ProgramAdministrator)"
      - "POST /iz-compliance/affordable-units/{unit_id}/refinance-review (with Developer)"
      - "POST /iz-compliance/resale-transactions (with ProgramAdministrator and the owning Resident)"
      - "GET /iz-compliance/funder-reports (with FundAuditor and ProgramAdministrator)"
      - "POST /_clock/set_current_utc (with every role)"
    segregation_of_duties:
      - "the X-User-ID that created a MonitoringReview may not call that review's clear-cure"
      - "the X-User-ID that approved a resale price may not call that transaction's certify-buyer"
  - name: Developer
    description: "Project sponsor: registers and amends developments, elects the compliance path, creates and withdraws restricted units, submits marketing plans, pays in-lieu fees and cures monitoring findings for projects it owns"
    identity: opaque
    exclusive_operations:
      - "POST /iz-compliance/projects"
      - "PATCH /iz-compliance/projects/{project_id}"
      - "POST /iz-compliance/projects/{project_id}/elect-path"
      - "POST /iz-compliance/affordable-units"
      - "POST /iz-compliance/affordable-units/{unit_id}/withdraw"
      - "POST /iz-compliance/affordable-units/{unit_id}/reinstate"
      - "POST /iz-compliance/marketing-plans"
      - "POST /iz-compliance/marketing-plans/{marketing_plan_id}/resubmit"
      - "POST /iz-compliance/in-lieu-fees/{fee_id}/payments"
      - "POST /iz-compliance/monitoring-reviews/{monitoring_review_id}/submit-cure"
    shared_operations:
      - "POST /iz-compliance/affordable-units/{unit_id}/refinance-review (with HousingComplianceOfficer)"
      - "POST /_clock/set_current_utc (with every role)"
      - "GET reads of projects, units, agreements, plans, lotteries, certifications, reviews, resales and fees"
    ownership_rule: "X-User-ID is an opaque operator id stored on Project.developer_user_id at creation; every Developer write is refused with ERR_NOT_RESOURCE_OWNER unless it matches the owning project's developer_user_id"
  - name: Resident
    description: "Applicant or restricted-unit owner: applies to lottery rounds and initiates the resale of the unit it occupies"
    identity: "entity_backed:Household"
    exclusive_operations:
      - "POST /iz-compliance/households/{household_id}/apply"
    shared_operations:
      - "POST /iz-compliance/resale-transactions (with ProgramAdministrator and HousingComplianceOfficer)"
      - "POST /_clock/set_current_utc (with every role)"
      - "GET reads of households, units, plans, lotteries, certifications and resales"
    ownership_rule: "X-User-ID equals the acting Household.id; applying for another household or reselling a unit whose occupant_household_id differs is refused with ERR_NOT_RESOURCE_OWNER"
  - name: FundAuditor
    description: "External funder's auditor: reads the housing trust fund ledger and the program compliance reports but writes nothing"
    identity: opaque
    exclusive_operations: []
    shared_operations:
      - "GET /iz-compliance/trust-fund-summary (with ProgramAdministrator)"
      - "GET /iz-compliance/trust-fund-disbursements and GET /iz-compliance/trust-fund-disbursements/{disbursement_id} (with ProgramAdministrator)"
      - "GET /iz-compliance/funder-reports (with ProgramAdministrator and HousingComplianceOfficer)"
      - "GET reads of ordinances, AMI schedules, projects, units, agreements, plans, lotteries, households, certifications, reviews, resales and fees"
      - "POST /_clock/set_current_utc (with every role)"
    note: "FundAuditor has no exclusive write; every write endpoint refuses it with ERR_UNAUTHORIZED, which makes it the canonical negative-RBAC actor."
