            - "MemberEnrollment.${enr_a2}.status == ACTIVE (member's latest check is CLEARED)"
            - "the overlapping enrollment [2027-08-14, ...) fails 409 with error_id == ERR_SERVICE_PERIOD_OVERLAP"
            - "GET /enrollments?member_id=${m_a} returns exactly 2 rows"

      - name: visit_thirty_day_buffer_gap
        grounds:
          - validations[priority=27]
          - errors.ERR_VISIT_TOO_SOON
        distinguishing_aspect: "Interval semantics: minimum-gap buffer on the AWARD resource (not point-intersection) — a visit exactly 30 days after an existing one is allowed, while 15 days away is rejected with ERR_VISIT_TOO_SOON; different arithmetic from the enrollment half-open overlap."
        test_recipe:
          setup:
            - "Award ACTIVE (2 FULL_TIME slots)."
          setup_api_calls:
