      - name: low_stock_equality_flag
        grounds: [calculations.low_stock_flag, entities.Part.fields.low_stock, "endpoints[POST /helmet-distributions]"]
        distinguishing_aspect: "Boundary on the stock metric via restock/distribution endpoints: low_stock uses <= so on_hand exactly equal to reorder_threshold (2) is LOW — restock to 3 clears the flag, one distribution to exactly 2 sets it again; distinct from the hours and giveaway-count boundaries."
        test_recipe:
          setup:
            - "HELMET SKU (size M) with reorder_threshold 2; restock 3; one COMMUNITY distribution"
          setup_api_calls:
            - { call: "POST /parts", payload: { name: "Helmet M", category: "HELMET", helmet_size: "M", unit_cost_cents: 1500, reorder_threshold: 2 }, as: ShopCoordinator, captures: { hp: $.data.id, ls0: $.data.low_stock } }
            - { call: "POST /parts/${hp}/restock", payload: { quantity: 3 }, as: ShopCoordinator, captures: { ls1: $.data.low_stock, q1: $.data.quantity_on_hand } }
          trigger:
            - { call: "POST /helmet-distributions", payload: { helmet_part_id: "${hp}", recipient_kind: "COMMUNITY", recipient_name: "Walk-in W" }, as: ShopCoordinator }
            - { call: "GET /parts/${hp}", as: ShopCoordinator, captures: { ls2: $.data.low_stock, q2: $.data.quantity_on_hand } }
          assert:
            - "at creation: low_stock == true  (0 <= 2)"
            - "after restock: quantity_on_hand == 3 and low_stock == false  (3 > 2)"
            - "after one distribution: quantity_on_hand == 2 and low_stock == true  (equality is low: <= semantics)"
