  # ===========================================================================
  # Endpoints
  # ===========================================================================
  - section: endpoints
    instances:
      - name: host_list_pagination_contract_on_an_empty_and_a_populated_page
        claim_type: standard_crud
        grounds:
          - response_envelope.pagination_fields
          - response_envelope.pagination_defaults
          - endpoints./api/hosts
          - entities.HostBusiness.fields.posture
        distinguishing_aspect: "The host list honours limit, offset, total_count and has_more, and a filter that matches nothing returns an empty array rather than an error."
        test_recipe:
          setup: ["Logical clock at the 2026-09-01T00:00:00Z default; three hosts declared in three different categories"]
          setup_api_calls:
            - call: "POST /api/hosts"
              payload: { legal_name: "Page One", category: "FARM", address_line1: "36 Page Rd", state_code: "TX" }
              as: HostOperator
              captures: { h_p1: $.data.id }
            - call: "POST /api/hosts"
              payload: { legal_name: "Page Two", category: "WINERY", address_line1: "37 Page Rd", state_code: "CA" }
              as: HostOperator
              captures: { h_p2: $.data.id }
            - call: "POST /api/hosts"
              payload: { legal_name: "Page Three", category: "BREWERY", address_line1: "38 Page Rd", state_code: "TX" }
              as: HostOperator
              captures: { h_p3: $.data.id }
          trigger:
            - call: "GET /api/hosts"
              payload: { limit: 2, offset: 0 }
              as: HostOperator
              captures: { page1_first: "$.data[0].id", page1_second: "$.data[1].id" }
            - call: "GET /api/hosts"
              payload: { limit: 2, offset: 2 }
              as: HostOperator
              captures: { page2_first: "$.data[0].id" }
            - call: "GET /api/hosts"
              payload: { category: "FARM", limit: 10, offset: 0 }
              as: HostOperator
              captures: { farm_first: "$.data[0].id" }
            - call: "GET /api/incidents"
              payload: { member_id: "${h_p1}", limit: 10, offset: 0 }
              as: HostOperator
              captures: { no_ids: $.data }
          assert:
            - "the first page carries total_count 3 and has_more true in the envelope, and its two array entries are HostBusiness.${page1_first} and HostBusiness.${page1_second}"
            - "the second page carries has_more false and exactly one array entry, HostBusiness.${page2_first}, so the last page is signalled rather than inferred from array length"
            - "the category filter carries total_count 1 and its single entry is HostBusiness.${farm_first}, so the filtered total is the matched count and not the collection size"
            - "a filter that matches nothing, GET /api/incidents?member_id=${h_p1}, returns an empty array with total_count 0 and has_more false, never an error"

