  - rule_id: transitive_cascade
    instances:

      - name: third_quarantine_restricts_publisher_stales_list_and_segment
        grounds:
          - state_machines.MeasurementBatch.SCORED_to_QUARANTINED
          - state_machines.Publisher.ACTIVE_to_RESTRICTED
          - state_machines.InventoryList.PUBLISHED_to_STALE
          - state_machines.PreBidSegment.SYNCED_to_STALE
          - calculations.viewability_and_coverage
        distinguishing_aspect: |
          Depth-4 chain fired by a measurement trigger (certify of the third
          sub-floor batch). Hop 1 increments Publisher.quarantined_batch_count
          to 3; BECAUSE it reached PUBLISHER_QUARANTINE_LIMIT hop 2 flips the
          publisher ACTIVE -> RESTRICTED; BECAUSE the publisher is restricted
          hop 3 stales the PUBLISHED inclusion list that carries an
          ALLOW/PUBLISHER entry naming it; BECAUSE that list went stale hop 4
          stales the SYNCED pre-bid segment referencing it, which makes the
          pre-bid decision endpoint refuse. Certifying only the first two
          batches leaves every downstream hop untouched, so the chain cannot be
          faked by reacting to the trigger alone.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-10T00:00:00Z; campaign format DISPLAY, cpm_cents 875."
            - "One page classified GENERAL (SAFE); three batches on it with windows two hours apart (well past the 60s buffer), each measured 1000, measurable 500, in_view 500, avg_in_view_seconds 0.5 -> coverage_rate 0.5000, below the 0.70 floor."
            - "An INCLUSION list holding one ALLOW/PUBLISHER entry naming the publisher, PUBLISHED while the publisher is still ACTIVE, pinned by a SYNCED segment."
            - "Batches 1 and 2 are scored and certified during setup, taking quarantined_batch_count to 2 with no downstream effect."
