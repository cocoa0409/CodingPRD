  - section: errors
    instances:
      - name: role_permission_rung_precedes_engagement_existence
        claim_type: violation_to_error
        grounds: ['validations[priority=4]', 'validations[priority=8]', 'errors[ERR_ROLE_NOT_PERMITTED]', 'errors[ERR_ENGAGEMENT_NOT_FOUND]', 'gate_precedence[1]', 'gate_precedence[2]']
        distinguishing_aspect: "One request violates rung 4 and rung 8 at once: BILLING_ADMIN holding an unresolvable engagement id gets 403 ERR_ROLE_NOT_PERMITTED because gate 1 closes before gate 2 opens, and the identical path as MOVE_MANAGER then returns 404 ERR_ENGAGEMENT_NOT_FOUND."
        test_recipe:
          setup: ["Empty database apart from the logical clock; no engagement with the probed id exists."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-02T09:00:00.000Z" }
              as: MOVE_MANAGER
          trigger:
            - call: "POST /engagements/00000000-0000-4000-8000-0000000000aa/hold"
              payload: { reason: "Family requested a pause" }
              as: BILLING_ADMIN
              captures: { r1: "$.data.error_id" }
            - call: "POST /engagements/00000000-0000-4000-8000-0000000000aa/hold"
              payload: { reason: "Family requested a pause" }
              as: MOVE_MANAGER
              captures: { r2: "$.data.error_id" }
          assert:
            - "the first call responds 403 and ${r1} == ERR_ROLE_NOT_PERMITTED"
            - "the second call responds 404 and ${r2} == ERR_ENGAGEMENT_NOT_FOUND"

      - name: enum_membership_rung_precedes_item_existence
        claim_type: violation_to_error
        grounds: ['validations[priority=6]', 'validations[priority=14]', 'errors[ERR_INVALID_ENUM]', 'errors[ERR_ITEM_NOT_FOUND]', 'gate_precedence[1]']
        distinguishing_aspect: "A designate call that carries both an undeclared disposition member and an unresolvable item id returns 400 ERR_INVALID_ENUM, because rung 6 sits in gate 1 and rung 14 in gate 2; repeating the call with the declared member DONATE then returns 404 ERR_ITEM_NOT_FOUND."
        test_recipe:
          setup: ["Empty database apart from the logical clock."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-02T09:00:00.000Z" }
              as: MOVE_MANAGER
          trigger:
            - call: "POST /inventory-items/00000000-0000-4000-8000-0000000000bb/designate"
              payload: { disposition: "SCRAP" }
              as: MOVE_MANAGER
              captures: { r1: "$.data.error_id" }
            - call: "POST /inventory-items/00000000-0000-4000-8000-0000000000bb/designate"
              payload: { disposition: "DONATE" }
              as: MOVE_MANAGER
              captures: { r2: "$.data.error_id" }
          assert:
            - "the first call responds 400 and ${r1} == ERR_INVALID_ENUM"
            - "the second call responds 404 and ${r2} == ERR_ITEM_NOT_FOUND"

      - name: missing_user_id_rung_precedes_role_permission_and_plan_existence
        claim_type: violation_to_error
        grounds: ['validations[priority=3]', 'validations[priority=4]', 'validations[priority=16]', 'errors[ERR_MISSING_USER_ID]', 'errors[ERR_ROLE_NOT_PERMITTED]', 'roles.FAMILY_MEMBER']
        distinguishing_aspect: "FAMILY_MEMBER is entity_backed and absent from the roles list of POST /sort-plans/{id}/approve, and the probed plan id does not resolve, so the same request returns 401 ERR_MISSING_USER_ID without the X-User-ID header, 403 ERR_ROLE_NOT_PERMITTED once the header is supplied, and never reaches the 404 at rung 16."
        test_recipe:
          setup: ["One engagement carrying one FAMILY_MEMBER portal party; no sort plan with the probed id exists."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-02T09:00:00.000Z" }
              as: MOVE_MANAGER
            - call: "POST /clients"
              payload: { full_name: "Ada Whitfield", phone: "+1-555-0142" }
              as: MOVE_MANAGER
              captures: { cl: "$.data.id" }
            - call: "POST /engagements"
              payload: { client_id: "${cl}", billing_mode: "HOURLY", home_tier: "STUDIO", scheduled_move_start_utc: "2026-06-15T14:00:00.000Z", mileage_miles: 22, origin_stairs_flights: 2, origin_long_carry_feet: 100 }
              as: MOVE_MANAGER
              captures: { eng: "$.data.id" }
            - call: "POST /portal-parties"
              payload: { engagement_id: "${eng}", party_type: "FAMILY_MEMBER", display_name: "Ruth Whitfield", email: "ruth@example.com" }
              as: MOVE_MANAGER
              captures: { pf: "$.data.id" }
          trigger:
            - call: "POST /sort-plans/00000000-0000-4000-8000-0000000000cc/approve"
              payload: { approved_by_party_id: "${pf}" }
              as: FAMILY_MEMBER
              captures: { r1: "$.data.error_id" }
            - call: "POST /sort-plans/00000000-0000-4000-8000-0000000000cc/approve"
              payload: { approved_by_party_id: "${pf}" }
              as: FAMILY_MEMBER
              as_user_id: "${pf}"
              captures: { r2: "$.data.error_id" }
          assert:
            - "the first call omits the X-User-ID header, responds 401, and ${r1} == ERR_MISSING_USER_ID"
            - "the second call supplies X-User-ID, responds 403, and ${r2} == ERR_ROLE_NOT_PERMITTED"
            - "neither call returns ERR_PLAN_NOT_FOUND even though the plan id does not resolve"

      - name: engagement_cancelled_rung_precedes_actor_ownership
        claim_type: violation_to_error
        grounds: ['validations[priority=23]', 'validations[priority=25]', 'errors[ERR_ENGAGEMENT_CANCELLED]', 'errors[ERR_ACTOR_NOT_OWNER]', 'gate_precedence[3]', 'gate_precedence[4]']
        distinguishing_aspect: "A CLIENT actor whose X-User-ID is a different Client's id designates an item on a CANCELLED engagement and receives 409 ERR_ENGAGEMENT_CANCELLED, because gate 3 closes ahead of the ownership check at rung 25 in gate 4."
        test_recipe:
          setup: ["A CANCELLED engagement owned by Client A with one UNDECIDED item, plus an unrelated Client B."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-02T09:00:00.000Z" }
              as: MOVE_MANAGER
            - call: "POST /clients"
              payload: { full_name: "Ada Whitfield", phone: "+1-555-0142" }
              as: MOVE_MANAGER
              captures: { cla: "$.data.id" }
            - call: "POST /clients"
              payload: { full_name: "Bea Nakamura", phone: "+1-555-0188" }
              as: MOVE_MANAGER
              captures: { clb: "$.data.id" }
            - call: "POST /engagements"
              payload: { client_id: "${cla}", billing_mode: "HOURLY", home_tier: "STUDIO", scheduled_move_start_utc: "2026-06-15T14:00:00.000Z", mileage_miles: 22, origin_stairs_flights: 2, origin_long_carry_feet: 100 }
              as: MOVE_MANAGER
              captures: { eng: "$.data.id" }
            - call: "POST /inventory-items"
              payload: { engagement_id: "${eng}", label: "Wing chair", category: "FURNITURE", footprint_linear_inches: 30, volume_cft: 20 }
              as: MOVE_MANAGER
              captures: { it: "$.data.id" }
            - call: "POST /engagements/${eng}/cancel"
              payload: { reason: "Client moved in with family instead" }
              as: MOVE_MANAGER
          trigger:
            - call: "POST /inventory-items/${it}/designate"
              payload: { disposition: "DONATE" }
              as: CLIENT
              as_user_id: "${clb}"
              captures: { r1: "$.data.error_id" }
          assert:
            - "the trigger responds 409 and ${r1} == ERR_ENGAGEMENT_CANCELLED"
            - "the response is not ERR_ACTOR_NOT_OWNER even though Client B does not own the engagement"
            - "InventoryItem.${it}.disposition == UNDECIDED"
            - "Engagement.${eng}.status == CANCELLED"

      - name: engagement_on_hold_rung_precedes_the_phase_gate
        claim_type: violation_to_error
        grounds: ['validations[priority=24]', 'validations[priority=31]', 'errors[ERR_ENGAGEMENT_ON_HOLD]', 'errors[ERR_PHASE_NOT_PERMITTED]', 'gate_precedence[3]', 'gate_precedence[5]']
        distinguishing_aspect: "Creating a move-day plan on an ON_HOLD engagement still in phase ASSESSMENT violates rung 24 and rung 31 together, and the server reports 409 ERR_ENGAGEMENT_ON_HOLD because gate 3 runs before gate 5."
        test_recipe:
          setup: ["One HOURLY STUDIO engagement placed ON_HOLD while its phase is still ASSESSMENT."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
