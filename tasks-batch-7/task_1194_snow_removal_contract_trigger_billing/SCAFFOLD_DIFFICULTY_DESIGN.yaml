            - { call: "POST /visits", payload: { storm_event_id: "${eE}", contract_site_id: "${csE}", scheduled_start: "2026-12-10T09:00:00Z", scheduled_end: "2026-12-10T11:00:00Z" }, as: OpsDispatcher, captures: { vP: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-12-10T09:05:00Z" }, as: PlatformAdmin }
