              as: Negotiator
              as_user_id: "neg-1"
              captures: { s_id: $.data.id }
            - call: "POST /labor-relations/costing-scenarios/${s_id}/state"
              payload: { to_status: "COMPUTED" }
              as: Negotiator
              as_user_id: "neg-1"
            - call: "POST /labor-relations/costing-scenarios/${s_id}/state"
              payload: { to_status: "REVIEWED" }
              as: Negotiator
              as_user_id: "neg-2"
            - call: "GET /labor-relations/agreements/${a2_id}"
              payload: {}
              as: Negotiator
              as_user_id: "neg-1"
              captures: { a2_v: $.data.version }
            - call: "POST /labor-relations/costing-scenarios/${s_id}/lock"
              payload: { expected_agreement_version: "${a2_v}" }
              as: ChiefNegotiator
              as_user_id: "chief-1"
            - call: "POST /labor-relations/proposals/${p_id}/state"
              payload: { to_status: "ACCEPTED" }
              as: UnionRepresentative
              as_user_id: "${u_id}"
            - call: "POST /labor-relations/ratification-votes"
              payload: { agreement_id: "${a2_id}", eligible_voter_count: 10, ballot_close_at: "2026-06-01T00:00:00Z" }
              as: ChiefNegotiator
              as_user_id: "chief-1"
              captures: { v_id: $.data.id }
            - call: "POST /labor-relations/ratification-votes/${v_id}/state"
              payload: { to_status: "OPEN" }
              as: ChiefNegotiator
              as_user_id: "chief-1"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-02T00:00:00Z" }
              as: LRAdmin
          trigger:
            - call: "POST /labor-relations/ratification-votes/${v_id}/tally"
              payload: { votes_for: 4, votes_against: 1 }
              as: UnionRepresentative
              as_user_id: "${u_id}"
          assert:
            - "RatificationVote.${v_id}.status == RATIFIED and retro_payout_cents == 0 (effective date 1 day before tally)"
            - "CollectiveAgreement.${a2_id}.status == ACTIVE (cascade link 1)"
            - "CollectiveAgreement.${a1_id}.status == REPLACED (cascade link 2)"
            - "Proposal.${p_id}.status == IMPLEMENTED (cascade link 3)"
            - "SideLetter.${sl_id}.status == SUPERSEDED (cascade link 4)"
            - "Clause.${c_id}.interpretation_status == UNDER_REVIEW (cascade link 5)"
            - "CollectiveAgreement.${a2_id}.envelope_committed_cents == 100"

      - name: union_decertify_depth2_cascade
        grounds:
          - state_machines.Union.ACTIVE_to_DECERTIFIED
          - state_machines.CollectiveAgreement.EXPIRED_to_ARCHIVED
          - state_machines.BargainingSession.SCHEDULED_to_CANCELLED
        distinguishing_aspect: |
          A different trigger fires a depth-2 transitive chain: decertifying the union archives its DRAFT
          agreements (link 1), and each archival itself cancels the agreement's SCHEDULED bargaining sessions
          (link 2) with cancel_reason UNION_DECERTIFIED — the session cancellation is caused by the archival,
          not directly by the decertification.
        test_recipe:
          setup:
            - "Union U ACTIVE; agreement A DRAFT for U (effective 2026-06-01, expiration 2029-05-31)"
            - "BargainingSession S SCHEDULED on A (mediator med-9, lead ln-9, 2026-06-01 10:00-11:00)"
          setup_api_calls:
            - call: "POST /labor-relations/unions"
              payload: { name: "Union H", union_code: "UH-1" }
              as: LRAdmin
              captures: { u_id: $.data.id }
            - call: "POST /labor-relations/agreements"
              payload: { union_id: "${u_id}", title: "CBA H", effective_date: "2026-06-01T00:00:00Z", expiration_date: "2029-05-31T00:00:00Z", headcount_baseline: 50, fte_projected: 60, avg_loaded_wage_cents: 4000, costing_envelope_cents: 1000000000 }
              as: LRAdmin
              captures: { a_id: $.data.id }
            - call: "POST /labor-relations/sessions"
              payload: { agreement_id: "${a_id}", mediator_id: "med-9", lead_negotiator_id: "ln-9", location: "Room 1", start_at: "2026-06-01T10:00:00Z", end_at: "2026-06-01T11:00:00Z" }
              as: Negotiator
              as_user_id: "neg-1"
              captures: { s_id: $.data.id }
          trigger:
            - call: "POST /labor-relations/unions/${u_id}/state"
              payload: { to_status: "DECERTIFIED" }
              as: LRAdmin
          assert:
            - "Union.${u_id}.status == DECERTIFIED"
            - "CollectiveAgreement.${a_id}.status == ARCHIVED (cascade link 1)"
            - "BargainingSession.${s_id}.status == CANCELLED and cancel_reason == UNION_DECERTIFIED (cascade link 2)"

  # ---------------------------------------------------------------------------
  # Rule 5 — priority_pair_validation_conflict
  # ---------------------------------------------------------------------------
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: accept_state_beats_fiscal
        grounds:
          - validations[priority=6]
          - validations[priority=13]
          - errors[ERR_INVALID_STATE]
          - errors[ERR_ENVELOPE_EXCEEDED]
        distinguishing_aspect: |
          Category pair state vs business_fiscal: the accept request violates both the from-state rule
          (proposal still DRAFT) and the envelope rule (recurring 999999 cents of headroom needed against a
          1000-cent envelope); priority 6 beats priority 13, so the response is ERR_INVALID_STATE (409),
          never ERR_ENVELOPE_EXCEEDED.
        test_recipe:
          setup:
            - "Union U ACTIVE; agreement A DRAFT with costing_envelope_cents 1000"
            - "Proposal P (EMPLOYER, ECONOMIC, recurring_annual_cost_cents 999999) left in DRAFT (never tendered, never costed)"
          setup_api_calls:
            - call: "POST /labor-relations/unions"
              payload: { name: "Union I", union_code: "UI-1" }
              as: LRAdmin
              captures: { u_id: $.data.id }
            - call: "POST /labor-relations/agreements"
              payload: { union_id: "${u_id}", title: "CBA I", effective_date: "2026-06-01T00:00:00Z", expiration_date: "2029-05-31T00:00:00Z", headcount_baseline: 50, fte_projected: 60, avg_loaded_wage_cents: 4000, costing_envelope_cents: 1000 }
              as: LRAdmin
              captures: { a_id: $.data.id }
            - call: "POST /labor-relations/proposals"
              payload: { agreement_id: "${a_id}", side: "EMPLOYER", title: "Big ask", proposal_type: "ECONOMIC", recurring_annual_cost_cents: 999999 }
              as: Negotiator
              as_user_id: "neg-1"
              captures: { p_id: $.data.id }
          trigger:
            - call: "POST /labor-relations/proposals/${p_id}/state"
              payload: { to_status: "ACCEPTED" }
              as: UnionRepresentative
              as_user_id: "${u_id}"
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_STATE (state priority 6 beats business_fiscal priority 13)"
            - "Proposal.${p_id}.status == DRAFT (no partial mutation)"

      - name: session_safety_beats_temporal
        grounds:
          - validations[priority=8]
          - validations[priority=10]
          - errors[ERR_UNION_TRUSTEED]
          - errors[ERR_MEDIATOR_CONFLICT]
        distinguishing_aspect: |
          Category pair business_safety vs business_temporal: the session-create request violates both the
          union-standing safety rule (union TRUSTEED) and the mediator half-open overlap rule (10:30-12:00
          collides with an existing 10:00-11:00 session on mediator med-1); priority 8 beats priority 10, so
          the response is ERR_UNION_TRUSTEED, never ERR_MEDIATOR_CONFLICT.
        test_recipe:
          setup:
            - "Union U initially ACTIVE; agreement A DRAFT; session S1 SCHEDULED (mediator med-1, lead ln-1, 2026-06-01 10:00-11:00)"
            - "Union U then moved to TRUSTEED"
          setup_api_calls:
            - call: "POST /labor-relations/unions"
              payload: { name: "Union J", union_code: "UJ-1" }
              as: LRAdmin
              captures: { u_id: $.data.id }
            - call: "POST /labor-relations/agreements"
              payload: { union_id: "${u_id}", title: "CBA J", effective_date: "2026-06-01T00:00:00Z", expiration_date: "2029-05-31T00:00:00Z", headcount_baseline: 50, fte_projected: 60, avg_loaded_wage_cents: 4000, costing_envelope_cents: 1000000000 }
              as: LRAdmin
              captures: { a_id: $.data.id }
            - call: "POST /labor-relations/sessions"
              payload: { agreement_id: "${a_id}", mediator_id: "med-1", lead_negotiator_id: "ln-1", location: "Room 1", start_at: "2026-06-01T10:00:00Z", end_at: "2026-06-01T11:00:00Z" }
              as: Negotiator
              as_user_id: "neg-1"
              captures: { s1_id: $.data.id }
            - call: "POST /labor-relations/unions/${u_id}/state"
              payload: { to_status: "TRUSTEED" }
              as: LRAdmin
          trigger:
            - call: "POST /labor-relations/sessions"
              payload: { agreement_id: "${a_id}", mediator_id: "med-1", lead_negotiator_id: "ln-2", location: "Room 2", start_at: "2026-06-01T10:30:00Z", end_at: "2026-06-01T12:00:00Z" }
              as: Negotiator
              as_user_id: "neg-1"
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_UNION_TRUSTEED (business_safety priority 8 beats business_temporal priority 10)"
            - "BargainingSession.${s1_id}.status == SCHEDULED (existing session untouched)"

  # ---------------------------------------------------------------------------
  # Rule 6 — boundary_precision_check
  # ---------------------------------------------------------------------------
  - rule_id: boundary_precision_check
    instances:
      - name: ratification_quorum_approval_boundary
        grounds:
          - calculations.ratification_outcome
          - state_machines.RatificationVote.OPEN_to_RATIFIED
          - state_machines.RatificationVote.OPEN_to_REJECTED
        distinguishing_aspect: |
          Vote-count metric boundary on the tally endpoint: with eligible_voter_count 100, casting exactly
          50 ballots meets quorum (>= boundary, inclusive), but a 25-25 split fails the strict-majority
          approval rule (votes_for * 2 > votes_cast), deciding REJECTED; re-accepting the reverted package
          and tallying 26-24 crosses both thresholds and decides RATIFIED.
        test_recipe:
          setup:
            - "Union U ACTIVE; agreement A DRAFT (envelope 1000000000000)"
            - "Proposal P (EMPLOYER, ECONOMIC, recurring 100) ACCEPTED under LOCKED FINAL scenario"
            - "Vote V1 OPEN (eligible 100, ballot_close 2026-06-01T00:00:00Z); clock 2026-06-02T00:00:00Z"
          setup_api_calls:
            - call: "POST /labor-relations/unions"
              payload: { name: "Union K", union_code: "UK-1" }
              as: LRAdmin
              captures: { u_id: $.data.id }
            - call: "POST /labor-relations/agreements"
              payload: { union_id: "${u_id}", title: "CBA K", effective_date: "2026-06-01T00:00:00Z", expiration_date: "2029-05-31T00:00:00Z", headcount_baseline: 100, fte_projected: 120, avg_loaded_wage_cents: 5000, costing_envelope_cents: 1000000000000 }
              as: LRAdmin
              captures: { a_id: $.data.id }
            - call: "POST /labor-relations/proposals"
              payload: { agreement_id: "${a_id}", side: "EMPLOYER", title: "Allowance", proposal_type: "ECONOMIC", recurring_annual_cost_cents: 100 }
              as: Negotiator
              as_user_id: "neg-1"
              captures: { p_id: $.data.id }
            - call: "POST /labor-relations/proposals/${p_id}/state"
              payload: { to_status: "TENDERED" }
              as: ChiefNegotiator
              as_user_id: "chief-1"
            - call: "POST /labor-relations/proposals/${p_id}/state"
              payload: { to_status: "ON_TABLE" }
              as: UnionRepresentative
              as_user_id: "${u_id}"
            - call: "POST /labor-relations/costing-scenarios"
              payload: { agreement_id: "${a_id}", name: "final", scenario_mode: "FINAL", term_years: 3, proposal_ids: ["${p_id}"] }
              as: Negotiator
              as_user_id: "neg-1"
              captures: { s_id: $.data.id }
            - call: "POST /labor-relations/costing-scenarios/${s_id}/state"
              payload: { to_status: "COMPUTED" }
              as: Negotiator
              as_user_id: "neg-1"
            - call: "POST /labor-relations/costing-scenarios/${s_id}/state"
              payload: { to_status: "REVIEWED" }
              as: Negotiator
              as_user_id: "neg-2"
            - call: "GET /labor-relations/agreements/${a_id}"
              payload: {}
              as: Negotiator
              as_user_id: "neg-1"
              captures: { a_v: $.data.version }
            - call: "POST /labor-relations/costing-scenarios/${s_id}/lock"
              payload: { expected_agreement_version: "${a_v}" }
              as: ChiefNegotiator
              as_user_id: "chief-1"
            - call: "POST /labor-relations/proposals/${p_id}/state"
              payload: { to_status: "ACCEPTED" }
              as: UnionRepresentative
              as_user_id: "${u_id}"
            - call: "POST /labor-relations/ratification-votes"
              payload: { agreement_id: "${a_id}", eligible_voter_count: 100, ballot_close_at: "2026-06-01T00:00:00Z" }
              as: ChiefNegotiator
              as_user_id: "chief-1"
              captures: { v1_id: $.data.id }
            - call: "POST /labor-relations/ratification-votes/${v1_id}/state"
              payload: { to_status: "OPEN" }
              as: ChiefNegotiator
              as_user_id: "chief-1"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-02T00:00:00Z" }
              as: LRAdmin
          trigger:
            - call: "POST /labor-relations/ratification-votes/${v1_id}/tally"
              payload: { votes_for: 25, votes_against: 25 }
              as: UnionRepresentative
              as_user_id: "${u_id}"
            - call: "POST /labor-relations/proposals/${p_id}/state"
              payload: { to_status: "ACCEPTED" }
              as: UnionRepresentative
              as_user_id: "${u_id}"
            - call: "POST /labor-relations/ratification-votes"
              payload: { agreement_id: "${a_id}", eligible_voter_count: 100, ballot_close_at: "2026-06-03T00:00:00Z" }
              as: ChiefNegotiator
              as_user_id: "chief-1"
              captures: { v2_id: $.data.id }
            - call: "POST /labor-relations/ratification-votes/${v2_id}/state"
              payload: { to_status: "OPEN" }
              as: ChiefNegotiator
              as_user_id: "chief-1"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-04T00:00:00Z" }
              as: LRAdmin
            - call: "POST /labor-relations/ratification-votes/${v2_id}/tally"
              payload: { votes_for: 26, votes_against: 24 }
              as: UnionRepresentative
              as_user_id: "${u_id}"
          assert:
            - "RatificationVote.${v1_id}.status == REJECTED and quorum_met == true (exactly 50 of 100 meets the >= quorum)"
            - "25-25 fails approval because votes_for * 2 > votes_cast is strict (50 > 50 is false)"
            - "Proposal.${p_id} reverted to ON_TABLE after V1 and was re-accepted before V2"
            - "RatificationVote.${v2_id}.status == RATIFIED and quorum_met == true (26-24 crosses both thresholds)"

      - name: info_request_overdue_instant_boundary
        grounds:
          - calculations.information_request_deadline
          - entities.InformationRequest.fields.is_overdue
        distinguishing_aspect: |
          Time metric boundary reachable through the clock endpoint plus GET: a BUSINESS-mode request
          received Friday 2026-05-01T09:00:00Z is due 2026-05-15T17:00:00Z (10 business days later); at clock
          == due_at exactly the request is NOT overdue (strictly-greater rule), and at due_at + 1 second the
          sweep flips is_overdue to true.
        test_recipe:
          setup:
            - "Union U ACTIVE; agreement A (BUSINESS mode) exists; information request IR RECEIVED at 2026-05-01T09:00:00Z"
          setup_api_calls:
            - call: "POST /labor-relations/unions"
              payload: { name: "Union L", union_code: "UL-1" }
              as: LRAdmin
              captures: { u_id: $.data.id }
            - call: "POST /labor-relations/agreements"
              payload: { union_id: "${u_id}", title: "CBA L", effective_date: "2026-06-01T00:00:00Z", expiration_date: "2029-05-31T00:00:00Z", headcount_baseline: 50, fte_projected: 60, avg_loaded_wage_cents: 4000, costing_envelope_cents: 1000000000, deadline_mode: "BUSINESS" }
              as: LRAdmin
              captures: { a_id: $.data.id }
            - call: "POST /labor-relations/information-requests"
              payload: { union_id: "${u_id}", agreement_id: "${a_id}", subject: "Overtime records", received_at: "2026-05-01T09:00:00Z" }
              as: UnionRepresentative
              as_user_id: "${u_id}"
              captures: { ir_id: $.data.id }
          trigger:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-15T17:00:00Z" }
              as: LRAdmin
            - call: "GET /labor-relations/information-requests/${ir_id}"
              payload: {}
              as: LRManager
              as_user_id: "mgr-1"
              captures: { overdue_at_due: $.data.is_overdue }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-15T17:00:01Z" }
              as: LRAdmin
            - call: "GET /labor-relations/information-requests/${ir_id}"
              payload: {}
              as: LRManager
              as_user_id: "mgr-1"
              captures: { overdue_after_due: $.data.is_overdue }
          assert:
            - "InformationRequest.${ir_id}.due_at == 2026-05-15T17:00:00Z"
            - "overdue_at_due == false (clock == due_at is NOT overdue; strictly-greater rule)"
            - "overdue_after_due == true (one second past the deadline flips the flag)"
            - "Union.${u_id}.open_information_request_count == 1 throughout"

  # ---------------------------------------------------------------------------
  # Rule 7 — cross_entity_state_dependency
  # ---------------------------------------------------------------------------
  - rule_id: cross_entity_state_dependency
    instances:
      - name: proposal_tender_agreement_gate
        grounds:
          - state_machines.Proposal.DRAFT_to_TENDERED
          - calculations.agreement_posture
          - errors[ERR_AGREEMENT_NOT_BARGAINABLE]
        distinguishing_aspect: |
          Entity pair Proposal -> CollectiveAgreement: tendering is valid only while the parent agreement
          satisfies the bargainable predicate; an ACTIVE agreement in OPEN posture (1121 days left) rejects
          with ERR_AGREEMENT_NOT_BARGAINABLE, while an EXPIRED agreement (posture UNCOVERED) accepts the
          same transition.
        test_recipe:
          setup:
            - "Union UA ACTIVE with agreement AA ACTIVE (expiration 2029-05-31; posture OPEN at default clock)"
            - "Union UB ACTIVE with agreement AB that sweeps to EXPIRED at clock 2026-07-01 (expiration 2026-06-30)"
            - "Proposal PA on AA and proposal PB on AB, both DRAFT"
          setup_api_calls:
            - call: "POST /labor-relations/unions"
              payload: { name: "Union MA", union_code: "UMA-1" }
              as: LRAdmin
              captures: { ua_id: $.data.id }
            - call: "POST /labor-relations/agreements"
              payload: { union_id: "${ua_id}", title: "CBA MA", effective_date: "2026-01-01T00:00:00Z", expiration_date: "2029-05-31T00:00:00Z", headcount_baseline: 50, fte_projected: 60, avg_loaded_wage_cents: 4000, costing_envelope_cents: 1000000000 }
              as: LRAdmin
              captures: { aa_id: $.data.id }
            - call: "POST /labor-relations/agreements/${aa_id}/activate"
              payload: {}
              as: LRAdmin
            - call: "POST /labor-relations/proposals"
              payload: { agreement_id: "${aa_id}", side: "EMPLOYER", title: "Midterm ask", proposal_type: "NON_ECONOMIC" }
              as: Negotiator
              as_user_id: "neg-1"
              captures: { pa_id: $.data.id }
            - call: "POST /labor-relations/unions"
              payload: { name: "Union MB", union_code: "UMB-1" }
              as: LRAdmin
              captures: { ub_id: $.data.id }
            - call: "POST /labor-relations/agreements"
              payload: { union_id: "${ub_id}", title: "CBA MB", effective_date: "2026-01-01T00:00:00Z", expiration_date: "2026-06-30T00:00:00Z", headcount_baseline: 50, fte_projected: 60, avg_loaded_wage_cents: 4000, costing_envelope_cents: 1000000000 }
              as: LRAdmin
              captures: { ab_id: $.data.id }
            - call: "POST /labor-relations/agreements/${ab_id}/activate"
              payload: {}
              as: LRAdmin
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-01T00:00:00Z" }
              as: LRAdmin
            - call: "POST /labor-relations/proposals"
              payload: { agreement_id: "${ab_id}", side: "EMPLOYER", title: "Post-expiry ask", proposal_type: "NON_ECONOMIC" }
              as: Negotiator
              as_user_id: "neg-1"
              captures: { pb_id: $.data.id }
          trigger:
            - call: "POST /labor-relations/proposals/${pa_id}/state"
              payload: { to_status: "TENDERED" }
              as: ChiefNegotiator
              as_user_id: "chief-1"
              captures: { err: $.data.error_id }
            - call: "POST /labor-relations/proposals/${pb_id}/state"
              payload: { to_status: "TENDERED" }
              as: ChiefNegotiator
              as_user_id: "chief-1"
          assert:
            - "first tender error_id == ERR_AGREEMENT_NOT_BARGAINABLE (ACTIVE + OPEN posture is mid-term)"
            - "CollectiveAgreement.${ab_id}.status == EXPIRED after the sweep"
            - "Proposal.${pb_id}.status == TENDERED (EXPIRED agreement remains bargainable)"

      - name: vote_open_scenario_package_gates
        grounds:
          - state_machines.RatificationVote.SCHEDULED_to_OPEN
          - errors[ERR_NO_LOCKED_SCENARIO]
          - errors[ERR_NO_ACCEPTED_PACKAGE]
        distinguishing_aspect: |
          Entity pairs RatificationVote -> CostingScenario and RatificationVote -> Proposal: opening a vote
          first requires a LOCKED scenario for the agreement (ERR_NO_LOCKED_SCENARIO) and only then checks
          for an ACCEPTED package (ERR_NO_ACCEPTED_PACKAGE), so the same OPEN attempt yields two different
          errors as the prerequisites are fixed in order.
        test_recipe:
          setup:
            - "Union U ACTIVE; agreement A DRAFT; vote V SCHEDULED (eligible 10, ballot_close 2026-06-01T00:00:00Z)"
            - "Initially no costing scenario and no ACCEPTED proposal exist for A"
          setup_api_calls:
            - call: "POST /labor-relations/unions"
              payload: { name: "Union N", union_code: "UN-1" }
              as: LRAdmin
              captures: { u_id: $.data.id }
            - call: "POST /labor-relations/agreements"
              payload: { union_id: "${u_id}", title: "CBA N", effective_date: "2026-06-01T00:00:00Z", expiration_date: "2029-05-31T00:00:00Z", headcount_baseline: 100, fte_projected: 120, avg_loaded_wage_cents: 5000, costing_envelope_cents: 1000000000000 }
              as: LRAdmin
              captures: { a_id: $.data.id }
            - call: "POST /labor-relations/ratification-votes"
              payload: { agreement_id: "${a_id}", eligible_voter_count: 10, ballot_close_at: "2026-06-01T00:00:00Z" }
              as: ChiefNegotiator
              as_user_id: "chief-1"
              captures: { v_id: $.data.id }
          trigger:
            - call: "POST /labor-relations/ratification-votes/${v_id}/state"
              payload: { to_status: "OPEN" }
              as: ChiefNegotiator
              as_user_id: "chief-1"
              captures: { err_no_lock: $.data.error_id }
            - call: "POST /labor-relations/proposals"
              payload: { agreement_id: "${a_id}", side: "EMPLOYER", title: "Allowance", proposal_type: "ECONOMIC", recurring_annual_cost_cents: 100 }
              as: Negotiator
              as_user_id: "neg-1"
              captures: { p_id: $.data.id }
            - call: "POST /labor-relations/proposals/${p_id}/state"
              payload: { to_status: "TENDERED" }
              as: ChiefNegotiator
              as_user_id: "chief-1"
            - call: "POST /labor-relations/proposals/${p_id}/state"
              payload: { to_status: "ON_TABLE" }
              as: UnionRepresentative
              as_user_id: "${u_id}"
            - call: "POST /labor-relations/costing-scenarios"
              payload: { agreement_id: "${a_id}", name: "final", scenario_mode: "FINAL", term_years: 3, proposal_ids: ["${p_id}"] }
              as: Negotiator
              as_user_id: "neg-1"
              captures: { s_id: $.data.id }
            - call: "POST /labor-relations/costing-scenarios/${s_id}/state"
              payload: { to_status: "COMPUTED" }
              as: Negotiator
              as_user_id: "neg-1"
            - call: "POST /labor-relations/costing-scenarios/${s_id}/state"
              payload: { to_status: "REVIEWED" }
              as: Negotiator
              as_user_id: "neg-2"
            - call: "GET /labor-relations/agreements/${a_id}"
              payload: {}
              as: Negotiator
              as_user_id: "neg-1"
              captures: { a_v: $.data.version }
            - call: "POST /labor-relations/costing-scenarios/${s_id}/lock"
              payload: { expected_agreement_version: "${a_v}" }
              as: ChiefNegotiator
              as_user_id: "chief-1"
            - call: "POST /labor-relations/ratification-votes/${v_id}/state"
              payload: { to_status: "OPEN" }
              as: ChiefNegotiator
              as_user_id: "chief-1"
              captures: { err_no_pkg: $.data.error_id }
          assert:
            - "err_no_lock == ERR_NO_LOCKED_SCENARIO (checked first)"
            - "err_no_pkg == ERR_NO_ACCEPTED_PACKAGE (checked once a LOCKED scenario exists; proposal still ON_TABLE)"
            - "RatificationVote.${v_id}.status == SCHEDULED after both failed opens"

  # ---------------------------------------------------------------------------
  # Rule 8 — resource_temporal_overlap
  # ---------------------------------------------------------------------------
  - rule_id: resource_temporal_overlap
    instances:
      - name: session_mediator_half_open
        grounds:
          - validations[priority=10]
          - errors[ERR_MEDIATOR_CONFLICT]
        distinguishing_aspect: |
          Half-open interval semantics on the mediator resource via the session-create endpoint: a session
          starting exactly at another session's end (11:00 after 10:00-11:00) is ACCEPTED (adjacency is not
          overlap under [start, end)), while 10:59-11:30 overlaps by one minute and is rejected with
          ERR_MEDIATOR_CONFLICT.
        test_recipe:
          setup:
            - "Union U ACTIVE; agreement A DRAFT; session S1 SCHEDULED on mediator med-1 (2026-06-01 10:00-11:00, lead ln-1)"
          setup_api_calls:
            - call: "POST /labor-relations/unions"
              payload: { name: "Union O", union_code: "UO-1" }
              as: LRAdmin
              captures: { u_id: $.data.id }
            - call: "POST /labor-relations/agreements"
              payload: { union_id: "${u_id}", title: "CBA O", effective_date: "2026-06-01T00:00:00Z", expiration_date: "2029-05-31T00:00:00Z", headcount_baseline: 50, fte_projected: 60, avg_loaded_wage_cents: 4000, costing_envelope_cents: 1000000000 }
              as: LRAdmin
              captures: { a_id: $.data.id }
            - call: "POST /labor-relations/sessions"
              payload: { agreement_id: "${a_id}", mediator_id: "med-1", lead_negotiator_id: "ln-1", location: "Room 1", start_at: "2026-06-01T10:00:00Z", end_at: "2026-06-01T11:00:00Z" }
              as: Negotiator
              as_user_id: "neg-1"
              captures: { s1_id: $.data.id }
          trigger:
            - call: "POST /labor-relations/sessions"
              payload: { agreement_id: "${a_id}", mediator_id: "med-1", lead_negotiator_id: "ln-2", location: "Room 1", start_at: "2026-06-01T11:00:00Z", end_at: "2026-06-01T12:00:00Z" }
              as: Negotiator
              as_user_id: "neg-1"
              captures: { s2_id: $.data.id }
            - call: "POST /labor-relations/sessions"
              payload: { agreement_id: "${a_id}", mediator_id: "med-1", lead_negotiator_id: "ln-3", location: "Room 2", start_at: "2026-06-01T10:59:00Z", end_at: "2026-06-01T11:30:00Z" }
              as: Negotiator
              as_user_id: "neg-1"
              captures: { err: $.data.error_id }
          assert:
            - "BargainingSession.${s2_id} created with status SCHEDULED (half-open adjacency allowed)"
            - "third create error_id == ERR_MEDIATOR_CONFLICT (one-minute interior overlap)"

      - name: side_letter_closed_interval_overlap
        grounds:
          - validations[priority=10]
          - state_machines.SideLetter.PENDING_LEGAL_to_EXECUTED
          - errors[ERR_SIDE_LETTER_OVERLAP]
        distinguishing_aspect: |
          Closed-interval semantics on a different resource (the clause, via the side-letter execute
          endpoint): an EXECUTED letter covering [2026-01-01, 2026-12-31] blocks a new letter whose window
          starts exactly 2026-12-31 (touching inclusive boundaries conflict), while a start of 2027-01-01 is
          accepted — the opposite adjacency verdict from the session mediator rule.
        test_recipe:
          setup:
            - "Union U ACTIVE; agreement A ACTIVE (effective 2026-01-01, expiration 2029-05-31); clause C on A"
            - "SideLetter SL1 EXECUTED on C with window [2026-01-01, 2026-12-31]"
          setup_api_calls:
            - call: "POST /labor-relations/unions"
              payload: { name: "Union P", union_code: "UP-1" }
              as: LRAdmin
              captures: { u_id: $.data.id }
            - call: "POST /labor-relations/agreements"
              payload: { union_id: "${u_id}", title: "CBA P", effective_date: "2026-01-01T00:00:00Z", expiration_date: "2029-05-31T00:00:00Z", headcount_baseline: 50, fte_projected: 60, avg_loaded_wage_cents: 4000, costing_envelope_cents: 1000000000 }
              as: LRAdmin
              captures: { a_id: $.data.id }
            - call: "POST /labor-relations/agreements/${a_id}/activate"
              payload: {}
              as: LRAdmin
            - call: "POST /labor-relations/clauses"
              payload: { agreement_id: "${a_id}", article_ref: "8.2", title: "Scheduling", body_text: "Scheduling terms" }
              as: LRManager
              as_user_id: "mgr-1"
              captures: { c_id: $.data.id }
            - call: "POST /labor-relations/side-letters"
              payload: { agreement_id: "${a_id}", clause_id: "${c_id}", letter_type: "MOA", title: "Letter 1", effective_start: "2026-01-01T00:00:00Z", effective_end: "2026-12-31T00:00:00Z" }
              as: LRManager
              as_user_id: "mgr-1"
              captures: { sl1_id: $.data.id }
            - call: "POST /labor-relations/side-letters/${sl1_id}/state"
              payload: { to_status: "PENDING_LEGAL" }
              as: LRManager
              as_user_id: "mgr-1"
            - call: "POST /labor-relations/side-letters/${sl1_id}/state"
              payload: { to_status: "EXECUTED" }
              as: LegalCounsel
              as_user_id: "lc-1"
            - call: "POST /labor-relations/side-letters"
              payload: { agreement_id: "${a_id}", clause_id: "${c_id}", letter_type: "MOA", title: "Letter 2", effective_start: "2026-12-31T00:00:00Z", effective_end: "2027-06-30T00:00:00Z" }
              as: LRManager
              as_user_id: "mgr-1"
              captures: { sl2_id: $.data.id }
            - call: "POST /labor-relations/side-letters/${sl2_id}/state"
              payload: { to_status: "PENDING_LEGAL" }
              as: LRManager
              as_user_id: "mgr-1"
          trigger:
            - call: "POST /labor-relations/side-letters/${sl2_id}/state"
              payload: { to_status: "EXECUTED" }
              as: LegalCounsel
              as_user_id: "lc-1"
              captures: { err: $.data.error_id }
            - call: "POST /labor-relations/side-letters"
              payload: { agreement_id: "${a_id}", clause_id: "${c_id}", letter_type: "MOU", title: "Letter 3", effective_start: "2027-01-01T00:00:00Z", effective_end: "2027-12-31T00:00:00Z" }
              as: LRManager
              as_user_id: "mgr-1"
              captures: { sl3_id: $.data.id }
            - call: "POST /labor-relations/side-letters/${sl3_id}/state"
              payload: { to_status: "PENDING_LEGAL" }
              as: LRManager
              as_user_id: "mgr-1"
            - call: "POST /labor-relations/side-letters/${sl3_id}/state"
              payload: { to_status: "EXECUTED" }
              as: LegalCounsel
              as_user_id: "lc-1"
          assert:
            - "SL2 execute error_id == ERR_SIDE_LETTER_OVERLAP (closed interval: 2026-12-31 touches SL1's inclusive end)"
            - "SideLetter.${sl2_id}.status == PENDING_LEGAL (failed execute leaves state unchanged)"
            - "SideLetter.${sl3_id}.status == EXECUTED (window starting 2027-01-01 clears SL1's closed interval)"

  # ---------------------------------------------------------------------------
  # Rule 9 — compensating_invariant
  # ---------------------------------------------------------------------------
  - rule_id: compensating_invariant
    instances:
      - name: envelope_commit_void_conservation
        grounds:
          - calculations.envelope_commitment
          - state_machines.Proposal.IMPLEMENTED_to_VOID
          - entities.CollectiveAgreement.fields.envelope_committed_cents
        distinguishing_aspect: |
          Conserved quantity is monetary: agreement.envelope_committed_cents must equal the sum of
          estimated_year1_cost_cents over proposals in {ACCEPTED, IMPLEMENTED} at every step — acceptance at
          exact envelope equality (66523200 <= 66523200) succeeds, ratification keeps the commitment at
          66523200, and void-implementation returns it to exactly 0 (implement + void conserves the envelope).
        test_recipe:
          setup:
            - "Union U ACTIVE; agreement A DRAFT with costing_envelope_cents exactly 66523200"
            - "Proposal P (EMPLOYER, ECONOMIC: pct 0.04, affected 100, benefits true, one_time 120000, recurring 6000000) ACCEPTED under LOCKED FINAL scenario (year-1 line 66523200)"
            - "Vote V OPEN (eligible 10, ballot_close 2026-06-10T00:00:00Z); clock 2026-06-11T00:00:00Z"
          setup_api_calls:
            - call: "POST /labor-relations/unions"
              payload: { name: "Union Q", union_code: "UQ-1" }
              as: LRAdmin
              captures: { u_id: $.data.id }
            - call: "POST /labor-relations/agreements"
              payload: { union_id: "${u_id}", title: "CBA Q", effective_date: "2026-06-01T00:00:00Z", expiration_date: "2029-05-31T00:00:00Z", headcount_baseline: 100, fte_projected: 120, avg_loaded_wage_cents: 5000, costing_envelope_cents: 66523200 }
              as: LRAdmin
              captures: { a_id: $.data.id }
            - call: "POST /labor-relations/proposals"
              payload: { agreement_id: "${a_id}", side: "EMPLOYER", title: "GWI 4%", proposal_type: "ECONOMIC", wage_increase_pct: 0.04, affected_headcount: 100, includes_benefits: true, one_time_cost_cents: 120000, recurring_annual_cost_cents: 6000000 }
              as: Negotiator
              as_user_id: "neg-1"
              captures: { p_id: $.data.id }
            - call: "POST /labor-relations/proposals/${p_id}/state"
              payload: { to_status: "TENDERED" }
              as: ChiefNegotiator
              as_user_id: "chief-1"
            - call: "POST /labor-relations/proposals/${p_id}/state"
              payload: { to_status: "ON_TABLE" }
              as: UnionRepresentative
              as_user_id: "${u_id}"
            - call: "POST /labor-relations/costing-scenarios"
              payload: { agreement_id: "${a_id}", name: "final", scenario_mode: "FINAL", term_years: 3, proposal_ids: ["${p_id}"] }
              as: Negotiator
              as_user_id: "neg-1"
              captures: { s_id: $.data.id }
            - call: "POST /labor-relations/costing-scenarios/${s_id}/state"
              payload: { to_status: "COMPUTED" }
              as: Negotiator
              as_user_id: "neg-1"
            - call: "POST /labor-relations/costing-scenarios/${s_id}/state"
              payload: { to_status: "REVIEWED" }
              as: Negotiator
              as_user_id: "neg-2"
            - call: "GET /labor-relations/agreements/${a_id}"
              payload: {}
              as: Negotiator
              as_user_id: "neg-1"
              captures: { a_v: $.data.version }
            - call: "POST /labor-relations/costing-scenarios/${s_id}/lock"
              payload: { expected_agreement_version: "${a_v}" }
              as: ChiefNegotiator
              as_user_id: "chief-1"
            - call: "POST /labor-relations/proposals/${p_id}/state"
              payload: { to_status: "ACCEPTED" }
              as: UnionRepresentative
              as_user_id: "${u_id}"
            - call: "GET /labor-relations/agreements/${a_id}"
              payload: {}
              as: Negotiator
              as_user_id: "neg-1"
              captures: { committed_after_accept: $.data.envelope_committed_cents }
            - call: "POST /labor-relations/ratification-votes"
              payload: { agreement_id: "${a_id}", eligible_voter_count: 10, ballot_close_at: "2026-06-10T00:00:00Z" }
              as: ChiefNegotiator
              as_user_id: "chief-1"
              captures: { v_id: $.data.id }
            - call: "POST /labor-relations/ratification-votes/${v_id}/state"
              payload: { to_status: "OPEN" }
              as: ChiefNegotiator
              as_user_id: "chief-1"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-11T00:00:00Z" }
              as: LRAdmin
          trigger:
            - call: "POST /labor-relations/ratification-votes/${v_id}/tally"
              payload: { votes_for: 5, votes_against: 0 }
              as: UnionRepresentative
              as_user_id: "${u_id}"
            - call: "GET /labor-relations/agreements/${a_id}"
              payload: {}
              as: Negotiator
              as_user_id: "neg-1"
              captures: { committed_after_ratify: $.data.envelope_committed_cents }
            - call: "POST /labor-relations/proposals/${p_id}/void-implementation"
              payload: {}
              as: LRAdmin
            - call: "GET /labor-relations/agreements/${a_id}"
              payload: {}
              as: Negotiator
              as_user_id: "neg-1"
              captures: { committed_after_void: $.data.envelope_committed_cents }
          assert:
            - "committed_after_accept == 66523200 (acceptance at exact envelope equality is allowed)"
            - "committed_after_ratify == 66523200 (ACCEPTED -> IMPLEMENTED keeps the commitment)"
            - "Proposal.${p_id}.status == VOID after void-implementation"
            - "committed_after_void == 0 (implement + void conserves the envelope exactly)"

      - name: mediator_minutes_cancel_conservation
        grounds:
          - state_machines.BargainingSession.SCHEDULED_to_CANCELLED
          - entities.BargainingSession.fields.mediator_id
        distinguishing_aspect: |
          Conserved quantity is time, not money: the mediator's scheduled-minutes aggregate (sum of
          end_at - start_at over SCHEDULED sessions sharing mediator_id) rises by 60+90=150 after two
          creates and returns to exactly 90 after cancelling the 60-minute session — schedule plus cancel is
          a zero-net pair on the aggregate.
        test_recipe:
          setup:
            - "Union U ACTIVE; agreement A DRAFT; sessions S1 (med-7, 2026-06-01 10:00-11:00, 60 min) and S2 (med-7, 13:00-14:30, 90 min) SCHEDULED"
          setup_api_calls:
            - call: "POST /labor-relations/unions"
              payload: { name: "Union R", union_code: "UR-1" }
              as: LRAdmin
              captures: { u_id: $.data.id }
            - call: "POST /labor-relations/agreements"
              payload: { union_id: "${u_id}", title: "CBA R", effective_date: "2026-06-01T00:00:00Z", expiration_date: "2029-05-31T00:00:00Z", headcount_baseline: 50, fte_projected: 60, avg_loaded_wage_cents: 4000, costing_envelope_cents: 1000000000 }
              as: LRAdmin
              captures: { a_id: $.data.id }
            - call: "POST /labor-relations/sessions"
              payload: { agreement_id: "${a_id}", mediator_id: "med-7", lead_negotiator_id: "ln-7", location: "Room 1", start_at: "2026-06-01T10:00:00Z", end_at: "2026-06-01T11:00:00Z" }
              as: Negotiator
              as_user_id: "neg-1"
              captures: { s1_id: $.data.id }
            - call: "POST /labor-relations/sessions"
              payload: { agreement_id: "${a_id}", mediator_id: "med-7", lead_negotiator_id: "ln-8", location: "Room 2", start_at: "2026-06-01T13:00:00Z", end_at: "2026-06-01T14:30:00Z" }
              as: Negotiator
              as_user_id: "neg-1"
              captures: { s2_id: $.data.id }
          trigger:
            - call: "POST /labor-relations/sessions/${s1_id}/state"
              payload: { to_status: "CANCELLED", cancel_reason: "Mediator conflict resolved" }
              as: Negotiator
              as_user_id: "neg-1"
            - call: "GET /labor-relations/sessions"
              payload: { mediator_id: "med-7", status: "SCHEDULED" }
              as: Negotiator
              as_user_id: "neg-1"
              captures: { remaining_id: "$.data[0].id" }
          assert:
            - "BargainingSession.${s1_id}.status == CANCELLED"
            - "GET sessions?mediator_id=med-7&status=SCHEDULED returns exactly 1 item and remaining_id == ${s2_id}"
            - "mediator scheduled-minutes aggregate == 90 (150 before cancel minus the released 60; the create+cancel pair nets to zero)"
