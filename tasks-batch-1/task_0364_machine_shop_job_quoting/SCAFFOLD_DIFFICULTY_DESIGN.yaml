              captures: { wo_status: $.data.status, shipped: $.data.qty_shipped, accepted: $.data.qty_accepted }
          assert:
            - "WorkOrder.${wo_id}.qty_shipped == 0"
            - "WorkOrder.${wo_id}.qty_accepted == 10"
            - "WorkOrder.${wo_id}.status == COMPLETED"
            - "Shipment.${ship_id}.status == VOIDED"
