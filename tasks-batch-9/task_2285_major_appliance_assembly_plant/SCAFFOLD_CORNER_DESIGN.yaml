        distinguishing_aspect: "SERVICE_OBLIGATION_YEARS is enforced strictly: the outgoing part carries service_obligation_until == cut_in_at + 10 years, and obsoleting it is refused both before and exactly at that instant, succeeding only one second later — while an ACTIVE part answers ERR_INVALID_STATE instead."
