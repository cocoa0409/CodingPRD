scenario: |
  Out-of-Home Billboard Inventory & Booking (Lamar/OUTFRONT style operator): face/unit inventory with illumination & traffic counts, availability calendar & holdover rules, package pricing by market & rotation cycle, artwork production, shipping & posting verification with photo proof, permit compliance & structure maintenance, digital board loop share & flexible scheduling, make-good for missed postings, impressions measurement & audience data

domain_name: ooh-billboard-booking
api_prefix: /api

complexity_profile:
  primary_archetype: temporal_windowing
  secondary_archetype: pricing_engine
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - derived_field_reconciliation
  entity_topology: flat
  state_machine_shape: cyclic
  relationship_patterns:
    - one_to_many
    - self_referential
    - cross_aggregate
  role_model: segregation_of_duties
  consistency_model: immediate

# =============================================================================
# Table 1: Entity-Relationship Table (flat topology; all FKs via fields)
# =============================================================================
entities:
  - name: RateCard
    parent: null
    common_fields: true
    fields:
      - { name: market_code, type: string, source: input, description: "Market (DMA) code this card prices, e.g. NYC" }
      - { name: display_type, type: enum, source: input, description: "STATIC | DIGITAL", constraints: "STATIC | DIGITAL" }
      - { name: base_weekly_cents, type: integer, source: input, description: "Base weekly rate in cents before uplifts" }
      - { name: illumination_premium_pct, type: number, source: input, description: "Multiplier uplift applied when face.illuminated is true, e.g. 0.15" }
      - { name: traffic_tier_1_threshold, type: integer, source: input, description: "daily_traffic_count >= this value applies tier-1 uplift" }
      - { name: traffic_tier_1_uplift_pct, type: number, source: input, description: "Tier-1 multiplier uplift, e.g. 0.10" }
      - { name: traffic_tier_2_threshold, type: integer, source: input, description: "daily_traffic_count >= this value applies tier-2 uplift (must be > tier-1 threshold)" }
      - { name: traffic_tier_2_uplift_pct, type: number, source: input, description: "Tier-2 multiplier uplift, e.g. 0.25" }
      - { name: status, type: enum, source: system, description: "DRAFT | PUBLISHED | RETIRED", constraints: "initial DRAFT" }

  - name: Face
    parent: null
    common_fields: true
    fields:
      - { name: face_code, type: string, source: input, description: "Operator-unique face/unit code", constraints: "unique across all faces" }
      - { name: structure_code, type: string, source: input, description: "Physical structure identifier (informational grouping)" }
      - { name: market_code, type: string, source: input, description: "Market (DMA) code" }
      - { name: display_type, type: enum, source: input, description: "STATIC | DIGITAL", constraints: "STATIC | DIGITAL" }
      - { name: illuminated, type: boolean, source: input, description: "Whether the face is illuminated at night" }
      - { name: daily_traffic_count, type: integer, source: input, description: "Average daily traffic count (DEC impressions basis)" }
      - { name: width_inches, type: integer, source: input, description: "Copy width in inches" }
      - { name: height_inches, type: integer, source: input, description: "Copy height in inches" }
      - { name: loop_slots_total, type: integer, source: input, description: "Total advertising slots in the 64-second loop; required when display_type=DIGITAL, forbidden when STATIC", constraints: "DIGITAL: 1..16; STATIC: must be omitted" }
      - { name: status, type: enum, source: system, description: "AVAILABLE | UNDER_MAINTENANCE | PERMIT_SUSPENDED | DECOMMISSIONED", constraints: "PERMIT_SUSPENDED is system-set only" }
      - { name: booking_posture, type: enum, source: computed, description: "Derived gate: BLOCKED if status in {PERMIT_SUSPENDED, DECOMMISSIONED}; RESTRICTED if UNDER_MAINTENANCE; OPEN if AVAILABLE" }
      - { name: current_permit_id, type: string, source: computed, description: "id of the permit currently in force (status ACTIVE or RENEWAL_PENDING), null when none" }

  - name: Permit
    parent: null
    common_fields: true
    fields:
      - { name: face_id, type: string, source: input, description: "FK -> Face.id" }
      - { name: supersedes_permit_id, type: string, source: input, description: "FK -> Permit.id; optional renewal chain link — when set, the referenced permit must be ACTIVE or RENEWAL_PENDING and becomes SUPERSEDED" }
      - { name: permit_number, type: string, source: input, description: "Jurisdiction-issued permit number" }
      - { name: jurisdiction, type: string, source: input, description: "Issuing authority" }
      - { name: issued_on, type: datetime, source: input, description: "Issue timestamp (ISO 8601 UTC)" }
      - { name: expires_on, type: datetime, source: input, description: "Expiry timestamp; permit valid while now < expires_on; must be > issued_on and > clock now at creation" }
      - { name: status, type: enum, source: system, description: "ACTIVE | RENEWAL_PENDING | EXPIRED | SUPERSEDED | REVOKED", constraints: "initial ACTIVE" }

  - name: MaintenanceWorkOrder
    parent: null
    common_fields: true
    fields:
      - { name: face_id, type: string, source: input, description: "FK -> Face.id" }
      - { name: order_type, type: enum, source: input, description: "ILLUMINATION_OUTAGE | STRUCTURAL_REPAIR | VEGETATION_CLEARANCE | POSTING_DAMAGE", constraints: "enum" }
      - { name: description, type: string, source: input, description: "Free-text scope of work", default: "" }
      - { name: scheduled_start, type: datetime, source: input, description: "Planned window start (set at SCHEDULED transition); half-open window [start, end)" }
      - { name: scheduled_end, type: datetime, source: input, description: "Planned window end (exclusive); must be > scheduled_start" }
      - { name: started_at, type: datetime, source: system, description: "Actual start timestamp stamped at IN_PROGRESS", default: null }
      - { name: completed_at, type: datetime, source: system, description: "Actual completion timestamp stamped at COMPLETED", default: null }
      - { name: status, type: enum, source: system, description: "OPEN | SCHEDULED | IN_PROGRESS | COMPLETED | REOPENED | CANCELLED", constraints: "initial OPEN" }
      - { name: reopen_count, type: integer, source: computed, description: "Number of COMPLETED -> REOPENED cycles", default: 0 }
      - { name: downtime_hours, type: number, source: computed, description: "For COMPLETED orders: (completed_at - started_at) in hours, 2 decimal places; null until completed", default: null }

  - name: AdvertiserAccount
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Advertiser legal name" }
      - { name: credit_limit_cents, type: integer, source: input, description: "Maximum allowed exposure_cents; exposure == limit is allowed, exposure > limit is rejected" }
      - { name: credit_balance_cents, type: integer, source: computed, description: "Ledger of APPLIED make-good credits", default: 0 }
      - { name: exposure_cents, type: integer, source: computed, description: "Sum of net_cents over this advertiser's flights in {BOOKED, ART_CLEARED, LIVE, MISSED, HOLDOVER} plus their holdover_charge_cents", default: 0 }
      - { name: status, type: enum, source: system, description: "ACTIVE | CREDIT_HOLD | SUSPENDED", constraints: "initial ACTIVE" }

  - name: Campaign
    parent: null
    common_fields: true
    fields:
      - { name: advertiser_id, type: string, source: input, description: "FK -> AdvertiserAccount.id" }
      - { name: name, type: string, source: input, description: "Campaign name" }
      - { name: start_date, type: string, source: input, description: "Campaign window start date (YYYY-MM-DD); all flights must lie inside [start_date, end_date]" }
      - { name: end_date, type: string, source: input, description: "Campaign window end date (inclusive); must be >= start_date" }
      - { name: status, type: enum, source: system, description: "DRAFT | SUBMITTED | APPROVED | ACTIVE | COMPLETED | CANCELLED", constraints: "initial DRAFT" }
      - { name: billing_status, type: enum, source: system, description: "UNINVOICED | INVOICED | SETTLED — parallel dimension independent of status", constraints: "initial UNINVOICED" }
      - { name: contracted_cents, type: integer, source: computed, description: "Sum of gross_cents + holdover_charge_cents over flights in {BOOKED, ART_CLEARED, LIVE, MISSED, HOLDOVER, COMPLETED}; HELD/EXPIRED/RELEASED/CANCELLED excluded; cancellation fees NOT included", default: 0 }
      - { name: discount_pct, type: number, source: computed, description: "Volume tier of the most recent confirm: 0.10 if resulting contracted_cents >= 15000000, else 0.05 if >= 5000000, else 0", default: 0 }
      - { name: net_contracted_cents, type: integer, source: computed, description: "Sum over contracted flights of per-flight round_half_up((gross_cents + holdover_charge_cents) * (1 - flight.discount_pct))", default: 0 }
      - { name: cancellation_fees_cents, type: integer, source: computed, description: "Accumulator for cancellation fees; tracked separately from contracted_cents", default: 0 }
      - { name: production_charges_cents, type: integer, source: computed, description: "Accumulator for artwork revision surcharges posted at ArtworkOrder DELIVERED", default: 0 }
      - { name: delivery_posture, type: enum, source: computed, description: "Compound from flights: UNDER_DELIVERED if any COMPLETED flight has delivery_ratio < 0.9; else AT_RISK if any flight in {MISSED, HOLDOVER} or any flight has suspension_started_at set or suspension_days_accrued > 0; else ON_TRACK", default: "ON_TRACK" }

  - name: Flight
    parent: null
    common_fields: true
    fields:
      - { name: campaign_id, type: string, source: input, description: "FK -> Campaign.id" }
      - { name: face_id, type: string, source: input, description: "FK -> Face.id" }
      - { name: rate_card_id, type: string, source: input, description: "FK -> RateCard.id; pinned at creation together with pinned_rate_card_version" }
      - { name: predecessor_flight_id, type: string, source: input, description: "FK -> Flight.id; optional renewal link — predecessor must be LIVE or HOLDOVER and start_date must equal predecessor.end_date + 1 day (DIGITAL face) or + 2 days (STATIC face changeover)", default: null }
      - { name: start_date, type: string, source: input, description: "First display date (YYYY-MM-DD, inclusive)" }
      - { name: end_date, type: string, source: input, description: "Last display date (YYYY-MM-DD, inclusive); must be >= start_date" }
      - { name: loop_slots, type: integer, source: input, description: "Slots occupied in the loop; required when face is DIGITAL (1..face.loop_slots_total), forbidden when STATIC", default: null }
      - { name: held_until, type: datetime, source: system, description: "Hold expiry = created_at + 72 hours; HELD expires when clock now >= held_until" }
      - { name: weeks, type: integer, source: computed, description: "Billing weeks = ceil((end_date - start_date + 1 day) / 7)" }
      - { name: pinned_weekly_cents, type: integer, source: computed, description: "Weekly rate computed by flight_gross_cost at creation; immutable thereafter even if the rate card changes" }
      - { name: gross_cents, type: integer, source: computed, description: "pinned_weekly_cents * weeks; immutable after creation" }
      - { name: discount_pct, type: number, source: computed, description: "Volume tier locked at confirm; 0 while HELD", default: 0 }
      - { name: net_cents, type: integer, source: computed, description: "While HELD: equals gross_cents (provisional). At confirm: round_half_up((gross_cents + holdover_charge_cents) * (1 - discount_pct)), then immutable" }
      - { name: pinned_rate_card_version, type: integer, source: system, description: "RateCard.version observed at creation" }
      - { name: status, type: enum, source: system, description: "HELD | BOOKED | ART_CLEARED | LIVE | MISSED | HOLDOVER | COMPLETED | CANCELLED | EXPIRED | RELEASED", constraints: "initial HELD" }
      - { name: cancellation_fee_cents, type: integer, source: computed, description: "Fee charged on cancel from BOOKED/ART_CLEARED per tiered days-before-start schedule; 0 otherwise", default: 0 }
      - { name: missed_days, type: integer, source: computed, description: "Days from start_date until posting verified (or booked-day count when cancelled from MISSED)", default: 0 }
      - { name: suspension_started_at, type: datetime, source: system, description: "Set when the face enters PERMIT_SUSPENDED while this flight is LIVE; cleared when accrual settles", default: null }
      - { name: suspension_days_accrued, type: integer, source: computed, description: "Total permit-suspension days accrued to this flight", default: 0 }
      - { name: holdover_weeks, type: integer, source: computed, description: "ceil(holdover days / 7), computed at HOLDOVER -> COMPLETED", default: 0 }
      - { name: holdover_charge_cents, type: integer, source: computed, description: "holdover_weeks * round_half_up(pinned_weekly_cents * 1.10), computed at HOLDOVER -> COMPLETED", default: 0 }
      - { name: impression_entries, type: array, source: input, description: "Append-only list of {period_start, period_end, source: TRAFFIC_ESTIMATE | AUDIENCE_MEASURED, impressions} added via POST /flights/{id}/impression-entries", default: [] }
      - { name: estimated_impressions, type: integer, source: computed, description: "Per estimated_impressions rule: sum of per-week round_half_up(daily_traffic_count * 7 * illumination_factor * slot_share) over booked weeks" }
      - { name: delivered_impressions, type: integer, source: computed, description: "Per delivered_impressions rule: chronological replay of impression_entries with AUDIENCE_MEASURED precedence per period", default: 0 }
      - { name: delivery_ratio, type: number, source: computed, description: "delivered_impressions / estimated_impressions, 4 decimal places; 0 when no entries", default: 0 }

  - name: ArtworkOrder
    parent: null
    common_fields: true
    fields:
      - { name: flight_id, type: string, source: input, description: "FK -> Flight.id" }
      - { name: creative_code, type: string, source: input, description: "Creative identifier" }
      - { name: material, type: enum, source: input, description: "VINYL | POLYETHYLENE | DIGITAL_FILE — DIGITAL_FILE required for DIGITAL faces; VINYL or POLYETHYLENE required for STATIC faces", constraints: "enum" }
      - { name: width_inches, type: integer, source: input, description: "Must equal face.width_inches exactly" }
      - { name: height_inches, type: integer, source: input, description: "Must equal face.height_inches exactly" }
      - { name: revision_count, type: integer, source: computed, description: "Increments on every IN_PRODUCTION -> REVISION_REQUESTED", default: 0 }
      - { name: production_charge_cents, type: integer, source: computed, description: "At DELIVERED: max(0, revision_count - 2) * 35000; posted to campaign.production_charges_cents", default: 0 }
      - { name: status, type: enum, source: system, description: "SUBMITTED | IN_PRODUCTION | REVISION_REQUESTED | PRINTED | SHIPPED | DELIVERED | CANCELLED", constraints: "initial SUBMITTED" }

  - name: PostingRecord
    parent: null
    common_fields: true
    fields:
      - { name: flight_id, type: string, source: input, description: "FK -> Flight.id" }
      - { name: installer_user_id, type: string, source: system, description: "X-User-ID of the FieldInstaller who reported the posting" }
      - { name: posted_on, type: string, source: input, description: "Actual posting date (YYYY-MM-DD); must be >= flight.start_date - 7 days and <= clock current date" }
      - { name: photo_proof_url, type: string, source: input, description: "URL of time-stamped photo proof" }
      - { name: notes, type: string, source: input, description: "Optional field notes", default: "" }
      - { name: status, type: enum, source: system, description: "REPORTED | VERIFIED | REJECTED", constraints: "initial REPORTED" }
      - { name: verified_by_user_id, type: string, source: system, description: "X-User-ID of verifying OperationsAuditor; must differ from installer_user_id", default: null }
      - { name: rejection_reason, type: string, source: system, description: "Required when transitioning to REJECTED", default: null }

  - name: MakeGood
    parent: null
    common_fields: true
    fields:
      - { name: flight_id, type: string, source: input, description: "FK -> Flight.id" }
      - { name: reason, type: enum, source: input, description: "MISSED_POSTING | ILLUMINATION_OUTAGE | PERMIT_SUSPENSION | UNDER_DELIVERY", constraints: "enum" }
      - { name: credit_cents, type: integer, source: computed, description: "Computed by make_good_credit per reason; never taken from the request body" }
      - { name: status, type: enum, source: system, description: "PROPOSED | APPROVED | REJECTED | APPLIED", constraints: "initial PROPOSED" }
      - { name: proposed_by, type: string, source: system, description: "X-User-ID of the proposer, or the literal 'system' for auto-proposed make-goods" }

# =============================================================================
# Table 2: State Machine Table
# =============================================================================
state_machines:
  - entity: RateCard
    initial_state: DRAFT
    terminal_states: [RETIRED]
    transitions:
      - from: DRAFT
        to: PUBLISHED
        trigger: "PUT /api/rate-cards/{id} with status=PUBLISHED"
        actor: InventoryManager
        preconditions:
          - "traffic_tier_2_threshold > traffic_tier_1_threshold (ERR_INVALID_REQUEST)"
          - "No other RateCard with same (market_code, display_type) in PUBLISHED (ERR_RATE_CARD_DUPLICATE_PUBLISHED)"
        side_effects:
          - "increments RateCard.version by 1"
      - from: DRAFT
        to: RETIRED
        trigger: "PUT /api/rate-cards/{id} with status=RETIRED"
        actor: InventoryManager
        preconditions: []
        side_effects: ["increments RateCard.version by 1"]
      - from: PUBLISHED
        to: RETIRED
        trigger: "PUT /api/rate-cards/{id} with status=RETIRED"
        actor: InventoryManager
        preconditions: []
        side_effects:
          - "increments RateCard.version by 1"
          - "Flights already created keep pinned_weekly_cents and pinned_rate_card_version (no retroactive repricing)"

  - entity: Face
    initial_state: AVAILABLE
    terminal_states: [DECOMMISSIONED]
    transitions:
      - from: AVAILABLE
        to: UNDER_MAINTENANCE
        trigger: "PUT /api/faces/{id} with status=UNDER_MAINTENANCE, or system when a MaintenanceWorkOrder on this face enters IN_PROGRESS"
        actor: InventoryManager | system
        preconditions: []
        side_effects:
          - "booking_posture recomputed: UNDER_MAINTENANCE -> RESTRICTED"
      - from: UNDER_MAINTENANCE
        to: AVAILABLE
        trigger: "PUT /api/faces/{id} with status=AVAILABLE, or system when a MaintenanceWorkOrder completes and no other work order on this face is IN_PROGRESS"
        actor: InventoryManager | system
        preconditions:
          - "System-driven return requires zero sibling MaintenanceWorkOrders on this face in IN_PROGRESS"
        side_effects:
          - "booking_posture recomputed: AVAILABLE -> OPEN"
      - from: AVAILABLE
        to: PERMIT_SUSPENDED
        trigger: "system (cascade when the face's current permit becomes EXPIRED or REVOKED)"
        actor: system
        preconditions: []
        side_effects:
          - "booking_posture recomputed: BLOCKED"
          - "Each Flight on this face in {LIVE, HOLDOVER}: suspension_started_at := clock now (link 3 of permit cascade)"
          - "For each affected flight, its Campaign.delivery_posture recomputed (link 4)"
      - from: UNDER_MAINTENANCE
        to: PERMIT_SUSPENDED
        trigger: "system (cascade when the face's current permit becomes EXPIRED or REVOKED)"
        actor: system
        preconditions: []
        side_effects:
          - "booking_posture recomputed: BLOCKED"
          - "Each Flight on this face in {LIVE, HOLDOVER}: suspension_started_at := clock now"
          - "For each affected flight, its Campaign.delivery_posture recomputed"
      - from: PERMIT_SUSPENDED
        to: AVAILABLE
        trigger: "system (cascade when a permit on this face becomes ACTIVE via reinstate or superseding renewal)"
        actor: system
        preconditions:
          - "Returns to UNDER_MAINTENANCE instead when a MaintenanceWorkOrder on this face is IN_PROGRESS"
        side_effects:
          - "booking_posture recomputed (OPEN or RESTRICTED)"
          - "For each Flight with suspension_started_at set: suspension_days_accrued += days between suspension_started_at and clock now; suspension_started_at := null; auto-create MakeGood (reason=PERMIT_SUSPENSION, status=PROPOSED, proposed_by='system') with credit per make_good_credit"
          - "For each affected flight, its Campaign.delivery_posture recomputed"
      - from: AVAILABLE
        to: DECOMMISSIONED
        trigger: "PUT /api/faces/{id} with status=DECOMMISSIONED"
        actor: InventoryManager
        preconditions:
          - "No Flight on this face in {HELD, BOOKED, ART_CLEARED, LIVE, MISSED, HOLDOVER} (ERR_INVALID_STATE)"
        side_effects:
          - "booking_posture recomputed: BLOCKED"
      - from: UNDER_MAINTENANCE
        to: DECOMMISSIONED
        trigger: "PUT /api/faces/{id} with status=DECOMMISSIONED"
        actor: InventoryManager
        preconditions:
          - "No Flight on this face in {HELD, BOOKED, ART_CLEARED, LIVE, MISSED, HOLDOVER} (ERR_INVALID_STATE)"
        side_effects:
          - "booking_posture recomputed: BLOCKED"
          - "All MaintenanceWorkOrders on this face in {OPEN, SCHEDULED} -> CANCELLED"

  - entity: Permit
    initial_state: ACTIVE
    terminal_states: [SUPERSEDED, REVOKED]
    transitions:
      - from: ACTIVE
        to: RENEWAL_PENDING
        trigger: "system (clock sweep: expires_on - 30 days <= now < expires_on)"
        actor: system
        preconditions: []
        side_effects: []
      - from: ACTIVE
        to: EXPIRED
        trigger: "system (clock sweep: now >= expires_on)"
        actor: system
        preconditions: []
        side_effects:
          - "Face.current_permit_id := null; Face -> PERMIT_SUSPENDED (cascade link 2)"
      - from: RENEWAL_PENDING
        to: EXPIRED
        trigger: "system (clock sweep: now >= expires_on)"
        actor: system
        preconditions: []
        side_effects:
          - "Face.current_permit_id := null; Face -> PERMIT_SUSPENDED (cascade link 2)"
      - from: ACTIVE
        to: SUPERSEDED
        trigger: "system (when POST /api/permits creates a successor with supersedes_permit_id = this permit)"
        actor: system
        preconditions: []
        side_effects:
          - "Face.current_permit_id := new permit id"
      - from: RENEWAL_PENDING
        to: SUPERSEDED
        trigger: "system (when POST /api/permits creates a successor with supersedes_permit_id = this permit)"
        actor: system
        preconditions: []
        side_effects:
          - "Face.current_permit_id := new permit id"
      - from: EXPIRED
        to: ACTIVE
        trigger: "PUT /api/permits/{id} with status=ACTIVE and expires_on > clock now"
        actor: ComplianceOfficer
        preconditions:
          - "New expires_on must be > clock now (ERR_INVALID_REQUEST)"
        side_effects:
          - "Face.current_permit_id := this permit; Face PERMIT_SUSPENDED -> AVAILABLE (or UNDER_MAINTENANCE) cascade with make-good settlement"
      - from: ACTIVE
        to: REVOKED
        trigger: "PUT /api/permits/{id} with status=REVOKED"
        actor: ComplianceOfficer
        preconditions: []
        side_effects:
          - "Face.current_permit_id := null; Face -> PERMIT_SUSPENDED cascade"
      - from: RENEWAL_PENDING
        to: REVOKED
        trigger: "PUT /api/permits/{id} with status=REVOKED"
        actor: ComplianceOfficer
        preconditions: []
        side_effects:
          - "Face.current_permit_id := null; Face -> PERMIT_SUSPENDED cascade"
      - from: EXPIRED
        to: REVOKED
        trigger: "PUT /api/permits/{id} with status=REVOKED"
        actor: ComplianceOfficer
        preconditions: []
        side_effects:
          - "Face stays PERMIT_SUSPENDED (already suspended)"

  - entity: MaintenanceWorkOrder
    initial_state: OPEN
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - from: OPEN
        to: SCHEDULED
        trigger: "PUT /api/maintenance-work-orders/{id} with status=SCHEDULED, scheduled_start, scheduled_end"
        actor: ComplianceOfficer
        preconditions:
          - "scheduled_end > scheduled_start (ERR_INVALID_REQUEST)"
          - "Half-open window [scheduled_start, scheduled_end) must not touch any date occupied by a Flight on this face in {BOOKED, ART_CLEARED, LIVE, MISSED, HOLDOVER}; occupied date set = {d : date(scheduled_start) <= d <= date(scheduled_end - 1 second)} (ERR_MAINTENANCE_WINDOW_CONFLICT). EXEMPT: order_type = ILLUMINATION_OUTAGE (reactive outage report, not a planned booking)"
        side_effects: []
      - from: SCHEDULED
        to: IN_PROGRESS
        trigger: "PUT /api/maintenance-work-orders/{id} with status=IN_PROGRESS"
        actor: ComplianceOfficer
        preconditions: []
        side_effects:
          - "started_at := clock now"
          - "Face AVAILABLE -> UNDER_MAINTENANCE (posture RESTRICTED)"
      - from: IN_PROGRESS
        to: COMPLETED
        trigger: "PUT /api/maintenance-work-orders/{id} with status=COMPLETED"
        actor: ComplianceOfficer
        preconditions: []
        side_effects:
          - "completed_at := clock now; downtime_hours := (completed_at - started_at) in hours, 2dp"
          - "Face UNDER_MAINTENANCE -> AVAILABLE only when zero sibling work orders on this face remain IN_PROGRESS"
          - "If order_type = ILLUMINATION_OUTAGE and face.illuminated: for each flight on this face in {LIVE, MISSED, HOLDOVER} whose booked dates intersect the outage date span, auto-create MakeGood (reason=ILLUMINATION_OUTAGE, PROPOSED, proposed_by='system') with credit per make_good_credit"
      - from: COMPLETED
        to: REOPENED
        trigger: "PUT /api/maintenance-work-orders/{id} with status=REOPENED"
        actor: ComplianceOfficer
        preconditions: []
        side_effects:
          - "reopen_count += 1"
      - from: REOPENED
        to: IN_PROGRESS
        trigger: "PUT /api/maintenance-work-orders/{id} with status=IN_PROGRESS"
        actor: ComplianceOfficer
        preconditions: []
        side_effects:
          - "started_at := clock now; completed_at := null; downtime_hours := null"
          - "Face AVAILABLE -> UNDER_MAINTENANCE (posture RESTRICTED)"
      - from: OPEN
        to: CANCELLED
        trigger: "PUT /api/maintenance-work-orders/{id} with status=CANCELLED"
        actor: ComplianceOfficer
        preconditions: []
        side_effects: []
      - from: SCHEDULED
        to: CANCELLED
        trigger: "PUT /api/maintenance-work-orders/{id} with status=CANCELLED"
        actor: ComplianceOfficer
        preconditions: []
        side_effects: []

  - entity: AdvertiserAccount
    initial_state: ACTIVE
    terminal_states: []
    transitions:
      - from: ACTIVE
        to: CREDIT_HOLD
        trigger: "PUT /api/advertiser-accounts/{id} with status=CREDIT_HOLD"
        actor: FinanceAnalyst
        preconditions: []
        side_effects: []
      - from: CREDIT_HOLD
        to: ACTIVE
        trigger: "PUT /api/advertiser-accounts/{id} with status=ACTIVE"
        actor: FinanceAnalyst
        preconditions: []
        side_effects: []
      - from: ACTIVE
        to: SUSPENDED
        trigger: "PUT /api/advertiser-accounts/{id} with status=SUSPENDED"
        actor: FinanceAnalyst
        preconditions: []
        side_effects: []
      - from: CREDIT_HOLD
        to: SUSPENDED
        trigger: "PUT /api/advertiser-accounts/{id} with status=SUSPENDED"
        actor: FinanceAnalyst
        preconditions: []
        side_effects: []
      - from: SUSPENDED
        to: ACTIVE
        trigger: "PUT /api/advertiser-accounts/{id} with status=ACTIVE"
        actor: FinanceAnalyst
        preconditions: []
        side_effects: []

  - entity: Campaign
    initial_state: DRAFT
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "PUT /api/campaigns/{id} with status=SUBMITTED"
        actor: SalesPlanner
        preconditions:
          - "At least one Flight with campaign_id = this campaign in HELD (ERR_CAMPAIGN_EMPTY)"
        side_effects: ["increments Campaign.version by 1"]
      - from: SUBMITTED
        to: APPROVED
        trigger: "PUT /api/campaigns/{id} with status=APPROVED"
        actor: SalesManager
        preconditions:
          - "AdvertiserAccount.status == ACTIVE (ERR_ADVERTISER_NOT_BOOKABLE)"
        side_effects: ["increments Campaign.version by 1"]
      - from: SUBMITTED
        to: DRAFT
        trigger: "PUT /api/campaigns/{id} with status=DRAFT (rejected for revision)"
        actor: SalesManager
        preconditions: []
        side_effects: ["increments Campaign.version by 1"]
      - from: APPROVED
        to: ACTIVE
        trigger: "system (automatic when the campaign's first Flight enters LIVE)"
        actor: system
        preconditions: []
        side_effects: ["increments Campaign.version by 1"]
      - from: ACTIVE
        to: COMPLETED
        trigger: "system (automatic when every Flight of this campaign is in {COMPLETED, CANCELLED, EXPIRED, RELEASED})"
        actor: system
        preconditions: []
        side_effects:
          - "increments Campaign.version by 1"
          - "For each COMPLETED flight, evaluate UNDER_DELIVERY auto make-good per make_good_credit"
      - from: APPROVED
        to: CANCELLED
        trigger: "PUT /api/campaigns/{id} with status=CANCELLED"
        actor: SalesManager
        preconditions: []
        side_effects:
          - "Every flight in HELD -> RELEASED; every flight in {BOOKED, ART_CLEARED} -> CANCELLED with fee per cancellation schedule; flights in {LIVE, MISSED, HOLDOVER} unaffected"
          - "increments Campaign.version by 1"
      - from: DRAFT
        to: CANCELLED
        trigger: "PUT /api/campaigns/{id} with status=CANCELLED"
        actor: SalesPlanner
        preconditions:
          - "Every flight of this campaign must be in {HELD, EXPIRED, RELEASED} (ERR_INVALID_STATE if any BOOKED or later)"
        side_effects:
          - "Every HELD flight -> RELEASED"
      - from: UNINVOICED
        to: INVOICED
        trigger: "PUT /api/campaigns/{id} with billing_status=INVOICED (billing_status dimension, parallel to status)"
        actor: FinanceAnalyst
        preconditions:
          - "status in {ACTIVE, COMPLETED} (ERR_INVALID_STATE)"
        side_effects: ["increments Campaign.version by 1"]
      - from: INVOICED
        to: SETTLED
        trigger: "PUT /api/campaigns/{id} with billing_status=SETTLED"
        actor: FinanceAnalyst
        preconditions:
          - "Zero MakeGood in {PROPOSED, APPROVED} across all flights of this campaign (ERR_UNRESOLVED_MAKE_GOODS)"
        side_effects: ["increments Campaign.version by 1"]

  - entity: Flight
    initial_state: HELD
    terminal_states: [COMPLETED, CANCELLED, EXPIRED, RELEASED]
    transitions:
      - from: HELD
        to: BOOKED
        trigger: "POST /api/flights/{id}/confirm"
        actor: SalesPlanner
        preconditions:
          - "clock now < held_until (else the flight is swept to EXPIRED first)"
          - "Campaign.status in {APPROVED, ACTIVE} (ERR_CAMPAIGN_NOT_APPROVED)"
          - "AdvertiserAccount.status == ACTIVE (ERR_ADVERTISER_NOT_BOOKABLE)"
          - "Face.booking_posture == OPEN (ERR_FACE_NOT_BOOKABLE)"
          - "Re-run overlap and loop-capacity checks against current occupancy (ERR_FACE_OVERLAP, ERR_LOOP_CAPACITY_EXCEEDED)"
          - "Advertiser exposure after confirm = exposure_cents + this flight's net_cents must be <= credit_limit_cents; equality allowed (ERR_CREDIT_LIMIT_EXCEEDED)"
          - "expected_campaign_version == Campaign.version (ERR_STALE_VERSION)"
        side_effects:
          - "discount_pct locked from campaign tier at this confirm; net_cents finalized; campaign contracted_cents / net_contracted_cents / discount_pct recomputed; increments Campaign.version by 1; AdvertiserAccount.exposure_cents recomputed"
      - from: HELD
        to: RELEASED
        trigger: "PUT /api/flights/{id} with status=RELEASED"
        actor: SalesPlanner
        preconditions: []
        side_effects:
          - "Forward-calendar occupancy for the face freed (availability restored exactly)"
      - from: HELD
        to: EXPIRED
        trigger: "system (clock sweep: now >= held_until)"
        actor: system
        preconditions: []
        side_effects:
          - "Forward-calendar occupancy for the face freed"
      - from: BOOKED
        to: ART_CLEARED
        trigger: "system (automatic when an ArtworkOrder for this flight reaches DELIVERED)"
        actor: system
        preconditions: []
        side_effects:
          - "Campaign.delivery_posture recomputed"
      - from: BOOKED
        to: MISSED
        trigger: "system (clock sweep: now >= start_date + 3 days and no VERIFIED PostingRecord exists)"
        actor: system
        preconditions: []
        side_effects:
          - "Campaign.delivery_posture recomputed (AT_RISK)"
      - from: ART_CLEARED
        to: MISSED
        trigger: "system (clock sweep: now >= start_date + 3 days and no VERIFIED PostingRecord exists)"
        actor: system
        preconditions: []
        side_effects:
          - "Campaign.delivery_posture recomputed (AT_RISK)"
      - from: ART_CLEARED
        to: LIVE
        trigger: "system (when a PostingRecord for this flight is VERIFIED with posted_on <= start_date + 2 days)"
        actor: system
        preconditions: []
        side_effects:
          - "Campaign APPROVED -> ACTIVE when this is its first LIVE flight; delivery_posture recomputed"
      - from: MISSED
        to: LIVE
        trigger: "system (when a PostingRecord for this flight is VERIFIED with posted_on > start_date + 2 days)"
        actor: system
        preconditions: []
        side_effects:
          - "missed_days := posted_on - start_date (in days)"
          - "Auto-create MakeGood (reason=MISSED_POSTING, PROPOSED, proposed_by='system') with credit = round_half_up(pinned_weekly_cents * missed_days / 7)"
          - "Campaign APPROVED -> ACTIVE when this is its first LIVE flight; delivery_posture recomputed"
      - from: LIVE
        to: HOLDOVER
        trigger: "system (clock sweep: now >= end_date + 1 day and no successor flight on this face has a VERIFIED posting)"
        actor: system
        preconditions: []
        side_effects:
          - "Campaign.delivery_posture recomputed (AT_RISK)"
      - from: LIVE
        to: COMPLETED
        trigger: "system (clock sweep: now >= end_date + 1 day and a successor flight on this face has a VERIFIED posting; or cascade when that successor's PostingRecord is VERIFIED and this flight's end_date < clock current date)"
        actor: system
        preconditions: []
        side_effects:
          - "holdover_weeks = 0; holdover_charge_cents = 0"
          - "Campaign.delivery_posture recomputed; exposure_cents recomputed; evaluate UNDER_DELIVERY make-good per make_good_credit"
      - from: HOLDOVER
        to: COMPLETED
        trigger: "PUT /api/flights/{id} with status=COMPLETED and takedown_confirmed=true (manual takedown), or system cascade when a successor's PostingRecord is VERIFIED on this face and this flight's end_date < clock current date"
        actor: OperationsAuditor | system
        preconditions:
          - "Manual completion requires takedown_confirmed=true (ERR_INVALID_REQUEST)"
        side_effects:
          - "holdover days := clock current date - end_date; holdover_weeks := ceil(days/7); holdover_charge_cents := holdover_weeks * round_half_up(pinned_weekly_cents * 1.10)"
          - "Campaign contracted_cents / net_contracted_cents recomputed with the flight's locked discount_pct; exposure_cents recomputed; delivery_posture recomputed; evaluate UNDER_DELIVERY make-good"
      - from: BOOKED
        to: CANCELLED
        trigger: "PUT /api/flights/{id} with status=CANCELLED"
        actor: SalesPlanner
        preconditions: []
        side_effects:
          - "cancellation_fee_cents per tiered schedule on days_before = start_date - clock current date: >= 28 days -> 10% of gross_cents; 14..27 -> 25%; < 14 -> 50%; fee posted to campaign.cancellation_fees_cents (NOT contracted_cents)"
          - "Campaign contracted_cents / net_contracted_cents recomputed; exposure_cents recomputed; face occupancy freed"
      - from: ART_CLEARED
        to: CANCELLED
        trigger: "PUT /api/flights/{id} with status=CANCELLED"
        actor: SalesPlanner
        preconditions: []
        side_effects:
          - "Same cancellation-fee schedule and recomputes as BOOKED -> CANCELLED"
      - from: MISSED
        to: CANCELLED
        trigger: "PUT /api/flights/{id} with status=CANCELLED"
        actor: SalesPlanner
        preconditions: []
        side_effects:
          - "No cancellation fee; missed_days := booked days (weeks * 7); auto-create MakeGood (reason=MISSED_POSTING, PROPOSED, proposed_by='system') with credit = gross_cents (full flight, never posted)"
          - "Campaign contracted_cents / net_contracted_cents recomputed; exposure_cents recomputed"

  - entity: ArtworkOrder
    initial_state: SUBMITTED
    terminal_states: [DELIVERED, CANCELLED]
    transitions:
      - from: SUBMITTED
        to: IN_PRODUCTION
        trigger: "PUT /api/artwork-orders/{id} with status=IN_PRODUCTION"
        actor: ProductionCoordinator
        preconditions: []
        side_effects: []
      - from: IN_PRODUCTION
        to: REVISION_REQUESTED
        trigger: "PUT /api/artwork-orders/{id} with status=REVISION_REQUESTED"
        actor: ProductionCoordinator
        preconditions: []
        side_effects:
          - "revision_count += 1"
      - from: REVISION_REQUESTED
        to: SUBMITTED
        trigger: "PUT /api/artwork-orders/{id} with status=SUBMITTED (revision loop)"
        actor: ProductionCoordinator
        preconditions: []
        side_effects: []
      - from: IN_PRODUCTION
        to: PRINTED
        trigger: "PUT /api/artwork-orders/{id} with status=PRINTED"
        actor: ProductionCoordinator
        preconditions: []
        side_effects: []
      - from: PRINTED
        to: SHIPPED
        trigger: "PUT /api/artwork-orders/{id} with status=SHIPPED"
        actor: ProductionCoordinator
        preconditions: []
        side_effects: []
      - from: SHIPPED
        to: DELIVERED
        trigger: "PUT /api/artwork-orders/{id} with status=DELIVERED"
        actor: ProductionCoordinator
        preconditions: []
        side_effects:
          - "production_charge_cents := max(0, revision_count - 2) * 35000; posted to campaign.production_charges_cents"
          - "Flight BOOKED -> ART_CLEARED (no-op if the flight is already in MISSED or a later state)"
          - "Campaign.delivery_posture recomputed"
      - from: SUBMITTED
        to: CANCELLED
        trigger: "PUT /api/artwork-orders/{id} with status=CANCELLED"
        actor: ProductionCoordinator
        preconditions: []
        side_effects: []
      - from: IN_PRODUCTION
        to: CANCELLED
        trigger: "PUT /api/artwork-orders/{id} with status=CANCELLED"
        actor: ProductionCoordinator
        preconditions: []
        side_effects: []
      - from: REVISION_REQUESTED
        to: CANCELLED
        trigger: "PUT /api/artwork-orders/{id} with status=CANCELLED"
        actor: ProductionCoordinator
        preconditions: []
        side_effects: []

  - entity: PostingRecord
    initial_state: REPORTED
    terminal_states: [VERIFIED, REJECTED]
    transitions:
      - from: REPORTED
        to: VERIFIED
        trigger: "PUT /api/posting-records/{id} with status=VERIFIED"
        actor: OperationsAuditor
        preconditions:
          - "Segregation of duties: verifier X-User-ID != installer_user_id (ERR_SEGREGATION_OF_DUTIES)"
          - "No other PostingRecord for this flight is already VERIFIED (ERR_INVALID_STATE)"
        side_effects:
          - "verified_by_user_id := verifier X-User-ID"
          - "Flight ART_CLEARED -> LIVE (on-time) or MISSED -> LIVE (late, missed make-good) per posted_on vs start_date + 2 days"
          - "Successor completion cascade: every other flight on the same face in {LIVE, HOLDOVER} with end_date < clock current date -> COMPLETED (ordered by end_date ASC, then created_at ASC), each computing holdover charges"
          - "Campaign auto-ACTIVE / delivery_posture recomputes per flight transitions"
      - from: REPORTED
        to: REJECTED
        trigger: "PUT /api/posting-records/{id} with status=REJECTED and rejection_reason"
        actor: OperationsAuditor
        preconditions:
          - "Segregation of duties: verifier X-User-ID != installer_user_id (ERR_SEGREGATION_OF_DUTIES)"
          - "rejection_reason must be non-empty (ERR_INVALID_REQUEST)"
        side_effects:
          - "Flight remains ART_CLEARED or MISSED; installer must submit a new PostingRecord"

  - entity: MakeGood
    initial_state: PROPOSED
    terminal_states: [APPLIED, REJECTED]
    transitions:
      - from: PROPOSED
        to: APPROVED
        trigger: "PUT /api/make-goods/{id} with status=APPROVED"
        actor: FinanceAnalyst
        preconditions:
          - "If proposed_by is a user id, approver X-User-ID must differ (ERR_SEGREGATION_OF_DUTIES); 'system'-proposed may be approved by any FinanceAnalyst"
        side_effects: []
      - from: PROPOSED
        to: REJECTED
        trigger: "PUT /api/make-goods/{id} with status=REJECTED"
        actor: FinanceAnalyst
        preconditions: []
        side_effects: []
      - from: APPROVED
        to: APPLIED
        trigger: "PUT /api/make-goods/{id} with status=APPLIED"
        actor: FinanceAnalyst
        preconditions: []
        side_effects:
          - "AdvertiserAccount.credit_balance_cents += credit_cents (ledger sync; advertiser resolved via flight.campaign_id -> Campaign.advertiser_id)"
          - "Campaign.delivery_posture recomputed"

# =============================================================================
# Concurrency Rules (OCC only; see SKILL.md 1.2.1)
# =============================================================================
concurrency_rules:
  - rule_id: flight-create-stale-face
    parent_entity: Face
    write_endpoint: "POST /api/flights"
    occ_field: "expected_face_version"
    description: |
      Creating a Flight against a Face whose version has advanced since the
      client last observed it is rejected. The Face version encodes the
      traffic count, illumination flag, and loop configuration the quote was
      priced from; creating from a stale version would book against superseded
      inventory data. The client must re-read the face and re-price.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: flight-confirm-stale-campaign
    parent_entity: Campaign
    write_endpoint: "POST /api/flights/{id}/confirm"
    occ_field: "expected_campaign_version"
    description: |
      Confirming a HELD flight against a Campaign whose version has advanced
      since the client last observed it is rejected. The Campaign version
      encodes contracted_cents, which determines the volume-discount tier the
      confirm will lock; confirming from a stale version would lock a discount
      computed on superseded totals. The client must re-read the campaign.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: rate-card-update-stale
    parent_entity: RateCard
    write_endpoint: "PUT /api/rate-cards/{id}"
    occ_field: "expected_rate_card_version"
    description: |
      Updating a RateCard whose version has advanced since the client last
      observed it is rejected. Every update (rates or status) is based on the
      card state the client read; a stale write would silently discard an
      intervening repricing. The client must re-read the card.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# Table 3: Calculation Rules Table
# =============================================================================
calculations:
  - name: flight_gross_cost
    trigger: "POST /api/flights (creation into HELD); holdover variant at HOLDOVER -> COMPLETED"
    algorithm: tiered_pricing
    formula: |
      weeks = ceil((end_date - start_date + 1) / 7)   # dates inclusive; partial week bills as full
      base  = rate_card.base_weekly_cents             # rate card pinned by id + version at creation
      traffic_mult = 1 + rate_card.traffic_tier_2_uplift_pct  if face.daily_traffic_count >= rate_card.traffic_tier_2_threshold
                     1 + rate_card.traffic_tier_1_uplift_pct  elif face.daily_traffic_count >= rate_card.traffic_tier_1_threshold
                     1                                        otherwise
      ill_mult = (1 + rate_card.illumination_premium_pct) if face.illuminated else 1
      slot_share = (loop_slots / face.loop_slots_total) if face.display_type == DIGITAL else 1
      pinned_weekly_cents = round_half_up(base * traffic_mult * ill_mult * slot_share)   # round ONCE per week
      gross_cents = pinned_weekly_cents * weeks
    input_set: "The new flight's face (current traffic/illumination), the pinned RateCard, and the flight's dates/loop_slots"
    constants:
      HOLDOVER_RATE_PCT: 1.10
    precision: "integer cents, round_half_up, weekly first then multiply by weeks"
    variants:
      - name: holdover_billing
        when: "Flight transitions HOLDOVER -> COMPLETED"
        difference: "Each holdover week bills at round_half_up(pinned_weekly_cents * 1.10); holdover_weeks = ceil((completion_date - end_date)/7); a LIVE flight completing with zero holdover days charges 0"

  - name: campaign_volume_discount
    trigger: "POST /api/flights/{id}/confirm (each confirm re-tiers on the resulting contracted total); holdover additions reuse the flight's locked discount_pct"
    algorithm: threshold
    formula: |
      # Evaluation order is PINNED to break the apparent circle
      # (tier depends on contracted, contracted is a sum of gross, net depends on tier):
      #   (1) gross_cents per flight at creation (excludes make-goods and cancellation fees)
      #   (2) contracted_new = campaign.contracted_cents (current BOOKED-and-later gross+holdover sum) + this flight's gross_cents
      #   (3) tier = 0.10 if contracted_new >= 15000000 else 0.05 if contracted_new >= 5000000 else 0
      #   (4) this flight's discount_pct := tier (locked, immutable after confirm)
      #   (5) this flight's net_cents := round_half_up((gross_cents + holdover_charge_cents) * (1 - discount_pct))
      #   (6) campaign.contracted_cents := contracted_new; campaign.discount_pct := tier (latest confirm);
      #       campaign.net_contracted_cents := SUM of per-flight net_cents  # round PER-FLIGHT then sum
      # The alternative order (sum all grosses, apply tier, round once) produces DIFFERENT
      # cents; this scaffold pins round-per-flight-then-sum. Confirm order is therefore
      # observable: the same flight set confirmed in a different order can lock different
      # per-flight tiers.
    input_set: "Flights of the campaign in {BOOKED, ART_CLEARED, LIVE, MISSED, HOLDOVER, COMPLETED}; HELD/EXPIRED/RELEASED/CANCELLED excluded"
    constants:
      TIER_1_FLOOR_CENTS: 5000000
      TIER_1_PCT: 0.05
      TIER_2_FLOOR_CENTS: 15000000
      TIER_2_PCT: 0.10
    precision: "integer cents, round_half_up per flight, then summed"

  - name: estimated_impressions
    trigger: "Flight creation; recomputed when face.daily_traffic_count or face.illuminated changes (PUT /api/faces/{id}) for flights in {HELD, BOOKED, ART_CLEARED}"
    algorithm: forward_looking
    formula: |
      illumination_factor = 1.12 if face.illuminated else 1.0
      slot_share = (loop_slots / face.loop_slots_total) if DIGITAL else 1
      estimated_impressions = SUM over each billing week w of the booked window of
        round_half_up(face.daily_traffic_count * 7 * illumination_factor * slot_share)
      # per-week round, then sum (rounding order pinned)
    input_set: "Booked weeks [start_date, end_date] of the flight; face snapshot at creation; recompute set limited to flights in {HELD, BOOKED, ART_CLEARED}"
    constants:
      ILLUMINATION_FACTOR: 1.12
    precision: "integer impressions, round_half_up per week then summed"

  - name: delivered_impressions
    trigger: "POST /api/flights/{id}/impression-entries (each append); read of flight.delivery_ratio"
    algorithm: chronological
    formula: |
      Group impression_entries by exact (period_start, period_end).
      Process periods in chronological order (period_start ASC, then entry created_at ASC).
      For each period:
        if any entry has source = AUDIENCE_MEASURED: use SUM of AUDIENCE_MEASURED entries only
        else: use the TRAFFIC_ESTIMATE entry with the latest created_at (supersede, do not sum)
      delivered_impressions = SUM of the per-period values
      delivery_ratio = delivered_impressions / estimated_impressions (4 decimal places)
      # A late-arriving AUDIENCE_MEASURED entry retroactively replaces earlier estimates
      # for its period (event-replay semantics; replay order pinned by created_at).
    input_set: "All impression_entries of the flight regardless of flight status"
    precision: "integer impressions; ratio 4 decimal places, round_half_up"

  - name: make_good_credit
    trigger: "Auto-proposal: MISSED -> LIVE late verification; MISSED -> CANCELLED; face exit from PERMIT_SUSPENDED (or flight completion while suspended); ILLUMINATION_OUTAGE work order COMPLETED; flight completion with delivery shortfall. Manual proposal via POST /api/make-goods (reason=UNDER_DELIVERY only, flight COMPLETED)."
    algorithm: waterfall_allocation
    formula: |
      per-reason branch on flight.pinned_weekly_cents (W), gross_cents (G), net_cents (N):
      MISSED_POSTING:    credit = round_half_up(W * missed_days / 7);
                         when cancelled from MISSED: missed_days = weeks * 7 so credit = G
      ILLUMINATION_OUTAGE: only when face.illuminated;
                         credit = round_half_up(W * 0.15 * outage_days / 7) where outage_days
                         = booked dates of this flight intersect [date(started_at), date(completed_at)]
      PERMIT_SUSPENSION: credit = round_half_up(W * suspension_days / 7) where suspension_days
                         = days from suspension_started_at until face restoration (or flight end_date
                         when the flight completes while suspended)
      UNDER_DELIVERY:    guarantee = 0.90 * estimated_impressions;
                         only when delivered_impressions < guarantee at flight COMPLETED;
                         N := round_half_up(gross_cents * (1 - discount_pct))  # booked net, EXCLUDING holdover charges
                         credit = round_half_up(N * (guarantee - delivered_impressions) / guarantee)
      Credits never exceed G (cap applied after rounding).
    input_set: "The single flight; face illumination flag; work-order outage span or suspension span as applicable"
    constants:
      ILLUMINATION_CREDIT_PCT: 0.15
      AUDIENCE_GUARANTEE_RATIO: 0.90
    precision: "integer cents, round_half_up"

  - name: loop_slot_capacity
    trigger: "POST /api/flights (creation), POST /api/flights/{id}/confirm (re-check), for DIGITAL faces"
    algorithm: aggregation
    formula: |
      occupied = SUM of loop_slots over flights on this face with status in
                 {HELD (and clock now < held_until), BOOKED, ART_CLEARED, LIVE, MISSED, HOLDOVER}
                 whose [start_date, end_date] (inclusive) intersects the new flight's window
      reject when occupied + new.loop_slots > face.loop_slots_total
      # boundary: equality (occupied + new == slots_total) is ALLOWED
    input_set: "Digital flights on the face in the blocking status set, expired holds excluded"
    constants: {}
    precision: "integer slot arithmetic, exact"

  - name: face_availability_calendar
    trigger: "GET /api/faces/{id}/availability"
    algorithm: interval_merge
    formula: |
      committed_calendar = merged union of [start_date, end_date] (inclusive) over flights
        with status in {BOOKED, ART_CLEARED, LIVE, MISSED, HOLDOVER}
      forward_calendar   = merged union over flights with status in
        {HELD (unexpired), BOOKED, ART_CLEARED, LIVE, MISSED, HOLDOVER}
      STATIC booking rule: a new flight must satisfy new.start_date >= existing.end_date + 2 days
        and new.end_date + 2 days <= existing.start_date for every occupied interval
        (one full changeover day between campaigns); DIGITAL faces allow next-day adjacency
        (new.start_date >= existing.end_date + 1 day).
      Adjacent intervals (gap = 0) merge; intervals separated by exactly 1 free day stay split.
    input_set: "Flights of the face filtered by status set per variant; expired HELD excluded"
    constants:
      CHANGEOVER_GAP_DAYS: 1
    precision: "whole days; closed-interval arithmetic"
    variants:
      - name: committed_vs_forward
        when: "Both calendars returned in the same response"
        difference: "Identical inputs, two valid answers: committed excludes HELD holds, forward includes unexpired HELD; the calendars differ exactly on windows covered only by unexpired holds"

# =============================================================================
# Table 4: Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers present and role recognized"
    error_id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER
    http_status: 400
    applies_to: "all endpoints"
  - priority: 2
    category: auth
    check: "Role is permitted for this endpoint, and per-transition role gate passes (e.g., only SalesManager approves a campaign; only FinanceAnalyst moves billing_status; only OperationsAuditor verifies postings)"
    error_id: ERR_INSUFFICIENT_PERMISSIONS
    http_status: 403
    applies_to: "all endpoints"
  - priority: 3
    category: existence
    check: "Path resource ids exist, validated left-to-right"
    error_id: "ERR_{RESOURCE}_NOT_FOUND"
    http_status: 404
    applies_to: "all endpoints with path ids"
  - priority: 4
    category: business_constraint
    check: "Request body shape: required fields present, enum members valid, date/datetime strings parse, end >= start, numeric ranges; digital loop_slots rules (DIGITAL face requires 1..loop_slots_total, STATIC forbids loop_slots and loop_slots_total); artwork dimensions equal face dimensions; material matches face display_type"
    error_id: "ERR_INVALID_REQUEST | ERR_DIGITAL_SLOTS_REQUIRED | ERR_ARTWORK_DIMENSION_MISMATCH | ERR_MATERIAL_FACE_MISMATCH"
    http_status: 400
    applies_to: "POST/PUT endpoints"
  - priority: 5
    category: state
    check: "Target resource is in a state that allows the requested transition (per state_machines); terminal resources reject all mutations; OCC expected_<parent>_version must match the parent's current version"
    error_id: "ERR_INVALID_STATE | ERR_STALE_VERSION"
    http_status: 409
    applies_to: "all transition endpoints (PUT ..., POST .../confirm); OCC-guarded writes (POST /api/flights, POST /api/flights/{id}/confirm, PUT /api/rate-cards/{id})"
  - priority: 6
    category: business_safety
    check: "Segregation of duties: posting verifier X-User-ID != PostingRecord.installer_user_id; make-good approver X-User-ID != MakeGood.proposed_by when proposer is a user"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "PUT /api/posting-records/{id}, PUT /api/make-goods/{id}"
  - priority: 7
    category: business_safety
    check: "Face bookability/compliance: Face.booking_posture == OPEN for flight creation and confirm; a current permit (ACTIVE or RENEWAL_PENDING) must exist for flight creation"
    error_id: ERR_FACE_NOT_BOOKABLE
    http_status: 409
    applies_to: "POST /api/flights, POST /api/flights/{id}/confirm"
  - priority: 8
    category: business_referential
    check: "Related-entity status: campaign in {DRAFT, SUBMITTED} for hold creation and {APPROVED, ACTIVE} for confirm; rate card PUBLISHED; advertiser ACTIVE; predecessor flight LIVE or HOLDOVER; campaign window contains flight dates; posting record creation requires its flight in {ART_CLEARED, MISSED}"
    error_id: "ERR_CAMPAIGN_NOT_APPROVED | ERR_RATE_CARD_NOT_PUBLISHED | ERR_ADVERTISER_NOT_BOOKABLE | ERR_INVALID_REQUEST | ERR_FLIGHT_NOT_POSTABLE"
    http_status: 409
    applies_to: "POST /api/flights, POST /api/flights/{id}/confirm, POST /api/posting-records"
  - priority: 9
    category: business_temporal
    check: "Clock-relative temporal rules: posting posted_on within [start_date - 7 days, clock today]; permit expires_on > now; hold confirm before held_until"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "POST /api/posting-records, POST /api/permits, PUT /api/permits/{id}, POST /api/flights/{id}/confirm"
  - priority: 10
    category: business_constraint
    check: "Static-face interval exclusion with changeover gap (per face_availability_calendar): new window must leave 1 full changeover day vs every blocking flight"
    error_id: ERR_FACE_OVERLAP
    http_status: 409
    applies_to: "POST /api/flights, POST /api/flights/{id}/confirm"
  - priority: 11
    category: business_constraint
    check: "Digital loop capacity: occupied loop_slots + new loop_slots <= face.loop_slots_total (equality allowed)"
    error_id: ERR_LOOP_CAPACITY_EXCEEDED
    http_status: 409
    applies_to: "POST /api/flights, POST /api/flights/{id}/confirm"
  - priority: 12
    category: business_constraint
    check: "Uniqueness: face_code globally unique; at most one PUBLISHED rate card per (market_code, display_type); at most one non-terminal ArtworkOrder per flight; permit creation supersedes the face's current permit or none exists; at most one VERIFIED PostingRecord per flight"
    error_id: "ERR_INVALID_REQUEST | ERR_RATE_CARD_DUPLICATE_PUBLISHED | ERR_ACTIVE_ARTWORK_ORDER_EXISTS | ERR_INVALID_STATE"
    http_status: 409
    applies_to: "POST /api/faces, PUT /api/rate-cards/{id}, POST /api/artwork-orders, POST /api/permits, PUT /api/posting-records/{id}"
  - priority: 13
    category: business_constraint
    check: "Maintenance window exclusion: half-open [scheduled_start, scheduled_end) must not touch dates occupied by flights in {BOOKED, ART_CLEARED, LIVE, MISSED, HOLDOVER} on the face; ILLUMINATION_OUTAGE orders are exempt (reactive)"
    error_id: ERR_MAINTENANCE_WINDOW_CONFLICT
    http_status: 409
    applies_to: "PUT /api/maintenance-work-orders/{id} (SCHEDULED)"
  - priority: 14
    category: business_fiscal
    check: "Credit: exposure after confirm = advertiser.exposure_cents + flight.net_cents must be <= credit_limit_cents (equality allowed); lowering credit_limit below current exposure rejected; campaign SETTLED requires zero unresolved make-goods"
    error_id: "ERR_CREDIT_LIMIT_EXCEEDED | ERR_UNRESOLVED_MAKE_GOODS"
    http_status: 402
    applies_to: "POST /api/flights/{id}/confirm, PUT /api/advertiser-accounts/{id}, PUT /api/campaigns/{id}"

# =============================================================================
# 1.0 Response Envelope (FIXED — verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# Table 5: API Endpoint Table
# =============================================================================
endpoints:
  # --- logical clock (test-driving) ---
  - method: POST
    path: "/api/_clock/set_current_utc"
    description: "Advance the logical clock. Startup default is exactly 2026-08-01T00:00:00Z; before any call the clock reads this default and never the wall clock. Triggers the deterministic sweep in order: (1) permit aging ACTIVE->RENEWAL_PENDING->EXPIRED with face/permit cascade, (2) hold expiry HELD->EXPIRED, (3) missed-posting marking BOOKED/ART_CLEARED->MISSED, (4) end-of-flight LIVE->HOLDOVER or LIVE->COMPLETED. Monotonic: to_iso8601 must be > current clock (ERR_INVALID_REQUEST)."
    roles: [PlatformAdmin]
    code: 200
    input: [to_iso8601]
    output: "{ current_utc: string }"
    side_effects: ["clock sweep steps 1-4 with all cascades per state_machines"]

  # --- RateCard ---
  - method: POST
    path: "/api/rate-cards"
    description: "Create a rate card in DRAFT"
    roles: [InventoryManager]
    code: 201
    input: [market_code, display_type, base_weekly_cents, illumination_premium_pct, traffic_tier_1_threshold, traffic_tier_1_uplift_pct, traffic_tier_2_threshold, traffic_tier_2_uplift_pct]
    output: RateCard
    side_effects: ["status = DRAFT"]
  - method: GET
    path: "/api/rate-cards/{id}"
    description: "Get a rate card"
    roles: [InventoryManager, SalesPlanner]
    code: 200
    input: []
    output: RateCard
    side_effects: []
  - method: PUT
    path: "/api/rate-cards/{id}"
    description: "Update rates and/or drive DRAFT->PUBLISHED->RETIRED; OCC-guarded"
    roles: [InventoryManager]
    code: 200
    input: ["status?", "base_weekly_cents?", "illumination_premium_pct?", "traffic_tier_1_threshold?", "traffic_tier_1_uplift_pct?", "traffic_tier_2_threshold?", "traffic_tier_2_uplift_pct?", expected_rate_card_version]
    output: RateCard
    side_effects: ["increments RateCard.version by 1", "publish uniqueness + tier-config checks"]
  - method: GET
    path: "/api/rate-cards/{id}/flights"
    description: "Flights that pinned this rate card"
    roles: [InventoryManager, SalesPlanner]
    code: 200
    input: ["limit?", "offset?"]
    output: "Flight[]"
    side_effects: []

  # --- Face ---
  - method: POST
    path: "/api/faces"
    description: "Create a face/unit"
    roles: [InventoryManager]
    code: 201
    input: [face_code, structure_code, market_code, display_type, illuminated, daily_traffic_count, width_inches, height_inches, "loop_slots_total?"]
    output: Face
    side_effects: ["status = AVAILABLE", "booking_posture = OPEN", "face_code uniqueness check"]
  - method: GET
    path: "/api/faces/{id}"
    description: "Get a face (includes version for OCC, booking_posture, current_permit_id)"
    roles: [InventoryManager, SalesPlanner, OperationsAuditor, ComplianceOfficer]
    code: 200
    input: []
    output: Face
    side_effects: []
  - method: PUT
    path: "/api/faces/{id}"
    description: "Update traffic count / illumination; manual status AVAILABLE<->UNDER_MAINTENANCE or ->DECOMMISSIONED (PERMIT_SUSPENDED is system-only)"
    roles: [InventoryManager]
    code: 200
    input: ["daily_traffic_count?", "illuminated?", "status?"]
    output: Face
    side_effects:
      - "increments Face.version by 1"
      - "on traffic/illumination change: recompute estimated_impressions of flights in {HELD, BOOKED, ART_CLEARED}"
      - "status transitions per Face state machine"
  - method: GET
    path: "/api/faces/{id}/permits"
    description: "Permit history of the face"
    roles: [InventoryManager, ComplianceOfficer]
    code: 200
    input: ["limit?", "offset?"]
    output: "Permit[]"
    side_effects: []
  - method: GET
    path: "/api/faces/{id}/maintenance-work-orders"
    description: "Work orders of the face"
    roles: [InventoryManager, ComplianceOfficer]
    code: 200
    input: ["limit?", "offset?", "status?"]
    output: "MaintenanceWorkOrder[]"
    side_effects: []
  - method: GET
    path: "/api/faces/{id}/flights"
    description: "Flights booked/held on the face"
    roles: [InventoryManager, SalesPlanner, OperationsAuditor]
    code: 200
    input: ["limit?", "offset?", "status?"]
    output: "Flight[]"
    side_effects: []
  - method: GET
    path: "/api/faces/{id}/availability"
    description: "Dual-variant availability calendar over [from_date, to_date]: committed_calendar (excludes HELD) and forward_calendar (includes unexpired HELD); each calendar is a merged list of occupied intervals encoded as inclusive [start_date, end_date] date pairs, clipped to the query window"
    roles: [InventoryManager, SalesPlanner]
    code: 200
    input: [from_date, to_date]
    output: "{ committed_calendar: array, forward_calendar: array }"
    side_effects: []

  # --- Permit ---
  - method: POST
    path: "/api/permits"
    description: "File a permit (ACTIVE). When supersedes_permit_id is set, the referenced permit must be ACTIVE or RENEWAL_PENDING and becomes SUPERSEDED; otherwise the face must have no current permit"
    roles: [ComplianceOfficer]
    code: 201
    input: [face_id, permit_number, jurisdiction, issued_on, expires_on, "supersedes_permit_id?"]
    output: Permit
    side_effects:
      - "status = ACTIVE; Face.current_permit_id := this permit"
      - "if supersedes: referenced permit -> SUPERSEDED"
      - "if face was PERMIT_SUSPENDED: face restoration cascade with PERMIT_SUSPENSION make-good settlement"
  - method: GET
    path: "/api/permits/{id}"
    description: "Get a permit"
    roles: [ComplianceOfficer, InventoryManager]
    code: 200
    input: []
    output: Permit
    side_effects: []
  - method: PUT
    path: "/api/permits/{id}"
    description: "Reinstate (EXPIRED->ACTIVE with new expires_on) or revoke (->REVOKED)"
    roles: [ComplianceOfficer]
    code: 200
    input: [status, "expires_on?"]
    output: Permit
    side_effects: ["per Permit state machine cascades"]
  - method: GET
    path: "/api/permits/{id}/successors"
    description: "Permits whose supersedes_permit_id points at this permit"
    roles: [ComplianceOfficer, InventoryManager]
    code: 200
    input: ["limit?", "offset?"]
    output: "Permit[]"
    side_effects: []

  # --- MaintenanceWorkOrder ---
  - method: POST
    path: "/api/maintenance-work-orders"
    description: "Open a work order on a face"
    roles: [ComplianceOfficer]
    code: 201
    input: [face_id, order_type, "description?"]
    output: MaintenanceWorkOrder
    side_effects: ["status = OPEN"]
  - method: PUT
    path: "/api/maintenance-work-orders/{id}"
    description: "Drive OPEN->SCHEDULED->IN_PROGRESS->COMPLETED, reopen cycle, or cancel"
    roles: [ComplianceOfficer]
    code: 200
    input: [status, "scheduled_start?", "scheduled_end?"]
    output: MaintenanceWorkOrder
    side_effects: ["per MaintenanceWorkOrder state machine: face posture cascades, downtime computation, ILLUMINATION_OUTAGE make-good auto-proposals"]

  # --- AdvertiserAccount ---
  - method: POST
    path: "/api/advertiser-accounts"
    description: "Create an advertiser"
    roles: [SalesPlanner]
    code: 201
    input: [name, credit_limit_cents]
    output: AdvertiserAccount
    side_effects: ["status = ACTIVE", "credit_balance_cents = 0", "exposure_cents = 0"]
  - method: GET
    path: "/api/advertiser-accounts/{id}"
    description: "Get an advertiser (exposure, credit balance, status)"
    roles: [SalesPlanner, SalesManager, FinanceAnalyst]
    code: 200
    input: []
    output: AdvertiserAccount
    side_effects: []
  - method: PUT
    path: "/api/advertiser-accounts/{id}"
    description: "Credit-hold lifecycle and credit-limit changes (lowering below current exposure rejected)"
    roles: [FinanceAnalyst]
    code: 200
    input: ["status?", "credit_limit_cents?"]
    output: AdvertiserAccount
    side_effects: ["per AdvertiserAccount state machine"]

  # --- Campaign ---
  - method: POST
    path: "/api/campaigns"
    description: "Create a campaign in DRAFT"
    roles: [SalesPlanner]
    code: 201
    input: [advertiser_id, name, start_date, end_date]
    output: Campaign
    side_effects: ["status = DRAFT", "billing_status = UNINVOICED", "delivery_posture = ON_TRACK"]
  - method: GET
    path: "/api/campaigns/{id}"
    description: "Get a campaign (computed ledgers, posture, version for OCC)"
    roles: [SalesPlanner, SalesManager, FinanceAnalyst, OperationsAuditor]
    code: 200
    input: []
    output: Campaign
    side_effects: []
  - method: PUT
    path: "/api/campaigns/{id}"
    description: "Drive status (submit/approve/reject/cancel) or billing_status (invoice/settle); per-transition role gates apply"
    roles: [SalesPlanner, SalesManager, FinanceAnalyst]
    code: 200
    input: ["status?", "billing_status?"]
    output: Campaign
    side_effects: ["per Campaign state machine incl. cascade-cancel of flights"]
  - method: GET
    path: "/api/campaigns/{id}/flights"
    description: "Flights of a campaign"
    roles: [SalesPlanner, SalesManager, FinanceAnalyst]
    code: 200
    input: ["limit?", "offset?", "status?"]
    output: "Flight[]"
    side_effects: []
  - method: GET
    path: "/api/advertiser-accounts/{id}/campaigns"
    description: "Campaigns of an advertiser"
    roles: [SalesPlanner, SalesManager, FinanceAnalyst]
    code: 200
    input: ["limit?", "offset?"]
    output: "Campaign[]"
    side_effects: []

  # --- Flight ---
  - method: POST
    path: "/api/flights"
    description: "Create a HELD flight (space hold): validates posture/permit, overlap (static changeover gap), loop capacity, campaign window; pins pricing; OCC on face version"
    roles: [SalesPlanner]
    code: 201
    input: [campaign_id, face_id, rate_card_id, start_date, end_date, "loop_slots?", "predecessor_flight_id?", expected_face_version]
    output: Flight
    side_effects:
      - "status = HELD; held_until = created_at + 72h"
      - "flight_gross_cost computes pinned_weekly_cents / gross_cents / weeks / estimated_impressions"
      - "increments Face.version by 1 (occupancy basis changed)"
      - "net_cents = gross_cents (provisional while HELD); discount_pct = 0"
  - method: GET
    path: "/api/flights/{id}"
    description: "Get a flight (all computed fields incl. impression ledger)"
    roles: [SalesPlanner, SalesManager, FinanceAnalyst, OperationsAuditor, InventoryManager]
    code: 200
    input: []
    output: Flight
    side_effects: []
  - method: PUT
    path: "/api/flights/{id}"
    description: "Transitions: HELD->RELEASED, BOOKED/ART_CLEARED/MISSED->CANCELLED, HOLDOVER->COMPLETED (takedown_confirmed=true)"
    roles: [SalesPlanner, OperationsAuditor]
    code: 200
    input: [status, "takedown_confirmed?"]
    output: Flight
    side_effects: ["per Flight state machine: cancellation fees, holdover charge, make-good proposals, ledger recomputes"]
  - method: POST
    path: "/api/flights/{id}/confirm"
    description: "Confirm a HELD flight to BOOKED: locks volume-discount tier, finalizes net_cents, checks credit; OCC on campaign version"
    roles: [SalesPlanner]
    code: 200
    input: [expected_campaign_version]
    output: Flight
    side_effects: ["per Flight HELD->BOOKED transition", "increments Campaign.version by 1"]
  - method: GET
    path: "/api/flights/{id}/successor-flights"
    description: "Flights whose predecessor_flight_id points at this flight"
    roles: [SalesPlanner, OperationsAuditor, InventoryManager]
    code: 200
    input: ["limit?", "offset?"]
    output: "Flight[]"
    side_effects: []
  - method: GET
    path: "/api/flights/{id}/artwork-orders"
    description: "Artwork orders of the flight"
    roles: [ProductionCoordinator, SalesPlanner, OperationsAuditor]
    code: 200
    input: ["limit?", "offset?"]
    output: "ArtworkOrder[]"
    side_effects: []
  - method: GET
    path: "/api/flights/{id}/posting-records"
    description: "Posting records (photo proof) of the flight"
    roles: [FieldInstaller, OperationsAuditor, SalesPlanner]
    code: 200
    input: ["limit?", "offset?"]
    output: "PostingRecord[]"
    side_effects: []
  - method: GET
    path: "/api/flights/{id}/make-goods"
    description: "Make-goods of the flight"
    roles: [OperationsAuditor, FinanceAnalyst, SalesPlanner]
    code: 200
    input: ["limit?", "offset?"]
    output: "MakeGood[]"
    side_effects: []
  - method: POST
    path: "/api/flights/{id}/impression-entries"
    description: "Append an impressions measurement entry (traffic estimate or audience measured); re-runs delivered_impressions replay"
    roles: [OperationsAuditor]
    code: 201
    input: [period_start, period_end, source, impressions]
    output: Flight
    side_effects: ["appends to impression_entries", "delivered_impressions and delivery_ratio recomputed per delivered_impressions rule"]

  # --- ArtworkOrder ---
  - method: POST
    path: "/api/artwork-orders"
    description: "Submit artwork production for a BOOKED flight (one non-terminal order per flight)"
    roles: [ProductionCoordinator]
    code: 201
    input: [flight_id, creative_code, material, width_inches, height_inches]
    output: ArtworkOrder
    side_effects: ["status = SUBMITTED", "flight must be BOOKED (ERR_INVALID_STATE)"]
  - method: PUT
    path: "/api/artwork-orders/{id}"
    description: "Drive production pipeline incl. revision loop; DELIVERED clears the flight for posting"
    roles: [ProductionCoordinator]
    code: 200
    input: [status]
    output: ArtworkOrder
    side_effects: ["per ArtworkOrder state machine: revision_count, surcharge posting at DELIVERED, flight BOOKED->ART_CLEARED"]

  # --- PostingRecord ---
  - method: POST
    path: "/api/posting-records"
    description: "Installer reports a posting with photo proof; flight must be ART_CLEARED or MISSED"
    roles: [FieldInstaller]
    code: 201
    input: [flight_id, posted_on, photo_proof_url, "notes?"]
    output: PostingRecord
    side_effects: ["status = REPORTED", "installer_user_id := X-User-ID"]
  - method: PUT
    path: "/api/posting-records/{id}"
    description: "Auditor verifies or rejects photo proof; segregation of duties enforced"
    roles: [OperationsAuditor]
    code: 200
    input: [status, "rejection_reason?"]
    output: PostingRecord
    side_effects: ["per PostingRecord state machine: flight LIVE transition, late make-good, successor completion cascade, campaign auto-ACTIVE"]

  # --- MakeGood ---
  - method: POST
    path: "/api/make-goods"
    description: "Manually propose a make-good (reason=UNDER_DELIVERY only, flight must be COMPLETED); credit computed server-side"
    roles: [OperationsAuditor]
    code: 201
    input: [flight_id, reason]
    output: MakeGood
    side_effects: ["status = PROPOSED", "proposed_by := X-User-ID", "credit_cents computed per make_good_credit"]
  - method: PUT
    path: "/api/make-goods/{id}"
    description: "Approve / reject / apply a make-good; apply credits the advertiser ledger"
    roles: [FinanceAnalyst]
    code: 200
    input: [status]
    output: MakeGood
    side_effects: ["per MakeGood state machine: credit_balance_cents ledger sync on APPLIED"]

# =============================================================================
# Table 6: Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER, http: 400, condition: "X-User-ID or X-User-Role header missing or role unrecognized" }
  - { id: ERR_INSUFFICIENT_PERMISSIONS, http: 403, condition: "Role not permitted for this endpoint or this specific transition" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Missing/invalid field, bad enum, unparseable or inverted dates, tier thresholds not ascending, changeover/adjacency violation on renewal, non-monotonic clock set, duplicate face_code" }
  - { id: ERR_DIGITAL_SLOTS_REQUIRED, http: 400, condition: "DIGITAL face without loop_slots/loop_slots_total, or STATIC face given loop fields" }
  - { id: ERR_ARTWORK_DIMENSION_MISMATCH, http: 400, condition: "Artwork dimensions do not equal the flight's face dimensions" }
  - { id: ERR_MATERIAL_FACE_MISMATCH, http: 400, condition: "DIGITAL face requires DIGITAL_FILE material; STATIC face requires VINYL or POLYETHYLENE" }
  - { id: ERR_RATE_CARD_NOT_FOUND, http: 404, condition: "rate_card id does not exist" }
  - { id: ERR_FACE_NOT_FOUND, http: 404, condition: "face id does not exist" }
  - { id: ERR_PERMIT_NOT_FOUND, http: 404, condition: "permit id does not exist" }
  - { id: ERR_WORK_ORDER_NOT_FOUND, http: 404, condition: "maintenance work order id does not exist" }
  - { id: ERR_ADVERTISER_NOT_FOUND, http: 404, condition: "advertiser id does not exist" }
  - { id: ERR_CAMPAIGN_NOT_FOUND, http: 404, condition: "campaign id does not exist" }
  - { id: ERR_FLIGHT_NOT_FOUND, http: 404, condition: "flight id does not exist" }
  - { id: ERR_ARTWORK_ORDER_NOT_FOUND, http: 404, condition: "artwork order id does not exist" }
  - { id: ERR_POSTING_RECORD_NOT_FOUND, http: 404, condition: "posting record id does not exist" }
  - { id: ERR_MAKE_GOOD_NOT_FOUND, http: 404, condition: "make-good id does not exist" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Target resource not in a state allowing the requested transition; terminal lockdown; manual PERMIT_SUSPENDED set; decommission with live flights; permit creation while an un-superseded current permit exists; second VERIFIED posting per flight" }
  - { id: ERR_FACE_NOT_BOOKABLE, http: 409, condition: "Face booking_posture != OPEN or no current permit at flight creation/confirm" }
  - { id: ERR_CAMPAIGN_NOT_APPROVED, http: 409, condition: "Campaign not in the state this operation needs: hold creation requires DRAFT or SUBMITTED; confirm requires APPROVED or ACTIVE" }
  - { id: ERR_CAMPAIGN_EMPTY, http: 409, condition: "Submit requires at least one HELD flight" }
  - { id: ERR_RATE_CARD_NOT_PUBLISHED, http: 409, condition: "Flight creation requires a PUBLISHED rate card" }
  - { id: ERR_RATE_CARD_DUPLICATE_PUBLISHED, http: 409, condition: "Another rate card for the same (market_code, display_type) is already PUBLISHED" }
  - { id: ERR_ADVERTISER_NOT_BOOKABLE, http: 409, condition: "Advertiser in CREDIT_HOLD or SUSPENDED blocks campaign approval and flight confirm" }
  - { id: ERR_FACE_OVERLAP, http: 409, condition: "Static-face window overlap or missing changeover day vs a blocking flight" }
  - { id: ERR_LOOP_CAPACITY_EXCEEDED, http: 409, condition: "Digital loop slot sum would exceed face.loop_slots_total" }
  - { id: ERR_MAINTENANCE_WINDOW_CONFLICT, http: 409, condition: "Work-order window touches dates occupied by a blocking flight on the face" }
  - { id: ERR_SEGREGATION_OF_DUTIES, http: 403, condition: "Verifier equals installer, or make-good approver equals its user proposer" }
  - { id: ERR_CREDIT_LIMIT_EXCEEDED, http: 402, condition: "Exposure after confirm would exceed credit_limit_cents, or credit limit lowered below current exposure" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_<parent>_version does not match the parent's current version" }
  - { id: ERR_FLIGHT_NOT_POSTABLE, http: 409, condition: "Posting record requires flight in ART_CLEARED or MISSED" }
  - { id: ERR_UNRESOLVED_MAKE_GOODS, http: 409, condition: "Campaign settle blocked by make-goods in PROPOSED or APPROVED" }
  - { id: ERR_ACTIVE_ARTWORK_ORDER_EXISTS, http: 409, condition: "Flight already has a non-terminal artwork order" }

# =============================================================================
# Table 7: RBAC Matrix
# =============================================================================
roles:
  - name: PlatformAdmin
    description: "Operator platform administrator; drives the logical clock"
    identity: opaque
    exclusive_operations:
      - "POST /api/_clock/set_current_utc"
    shared_operations: []
  - name: InventoryManager
    description: "Owns inventory: faces, rate cards; reads availability and permits"
    identity: opaque
    exclusive_operations:
      - "POST /api/rate-cards, PUT /api/rate-cards/{id}"
      - "POST /api/faces, PUT /api/faces/{id}"
    shared_operations:
      - "GET /api/rate-cards/{id}, GET /api/rate-cards/{id}/flights"
      - "GET /api/faces/{id}, GET /api/faces/{id}/permits, GET /api/faces/{id}/maintenance-work-orders, GET /api/faces/{id}/flights, GET /api/faces/{id}/availability"
      - "GET /api/permits/{id}, GET /api/permits/{id}/successors"
      - "GET /api/flights/{id}, GET /api/flights/{id}/successor-flights"
  - name: SalesPlanner
    description: "Builds proposals: advertisers, campaigns, flight holds, confirms, cancels"
    identity: opaque
    exclusive_operations:
      - "POST /api/advertiser-accounts"
      - "POST /api/campaigns"
      - "POST /api/flights, POST /api/flights/{id}/confirm"
    shared_operations:
      - "PUT /api/campaigns/{id} (submit; cancel DRAFT), PUT /api/flights/{id} (release, cancel)"
      - "GET /api/advertiser-accounts/{id}, GET /api/advertiser-accounts/{id}/campaigns"
      - "GET /api/campaigns/{id}, GET /api/campaigns/{id}/flights"
      - "GET /api/rate-cards/{id}, GET /api/rate-cards/{id}/flights"
      - "GET /api/faces/{id}, GET /api/faces/{id}/flights, GET /api/faces/{id}/availability"
      - "GET /api/flights/{id} and flight sub-resource lists"
  - name: SalesManager
    description: "Approves or rejects submitted campaigns; cancels approved campaigns"
    identity: opaque
    exclusive_operations: []
    shared_operations:
      - "PUT /api/campaigns/{id} (approve, reject-to-draft, cancel APPROVED)"
      - "GET /api/advertiser-accounts/{id}, GET /api/advertiser-accounts/{id}/campaigns"
      - "GET /api/campaigns/{id}, GET /api/campaigns/{id}/flights, GET /api/flights/{id}"
  - name: ProductionCoordinator
    description: "Runs artwork production pipeline and revision loops"
    identity: opaque
    exclusive_operations:
      - "POST /api/artwork-orders, PUT /api/artwork-orders/{id}"
    shared_operations:
      - "GET /api/flights/{id}/artwork-orders"
  - name: FieldInstaller
    description: "Reports postings with photo proof; cannot verify own work"
    identity: opaque
    exclusive_operations:
      - "POST /api/posting-records"
    shared_operations:
      - "GET /api/flights/{id}/posting-records"
  - name: OperationsAuditor
    description: "Verifies photo proof (never own installation), proposes make-goods, appends impression entries, confirms takedowns"
    identity: opaque
    exclusive_operations:
      - "PUT /api/posting-records/{id}"
      - "POST /api/make-goods"
      - "POST /api/flights/{id}/impression-entries"
    shared_operations:
      - "PUT /api/flights/{id} (HOLDOVER->COMPLETED takedown)"
      - "GET /api/faces/{id}, GET /api/faces/{id}/flights"
      - "GET /api/campaigns/{id}, GET /api/flights/{id}, flight sub-resource lists"
  - name: ComplianceOfficer
    description: "Files permits, reinstates/revokes, runs structure maintenance work orders"
    identity: opaque
    exclusive_operations:
      - "POST /api/permits, PUT /api/permits/{id}"
      - "POST /api/maintenance-work-orders, PUT /api/maintenance-work-orders/{id}"
    shared_operations:
      - "GET /api/faces/{id}, GET /api/faces/{id}/permits, GET /api/faces/{id}/maintenance-work-orders"
      - "GET /api/permits/{id}, GET /api/permits/{id}/successors"
  - name: FinanceAnalyst
    description: "Manages credit holds/limits, invoices and settles campaigns, approves/applies make-goods"
    identity: opaque
    exclusive_operations:
      - "PUT /api/advertiser-accounts/{id}"
      - "PUT /api/make-goods/{id}"
    shared_operations:
      - "PUT /api/campaigns/{id} (billing_status transitions)"
      - "GET /api/advertiser-accounts/{id}, GET /api/advertiser-accounts/{id}/campaigns"
      - "GET /api/campaigns/{id}, GET /api/campaigns/{id}/flights, GET /api/flights/{id}, GET /api/flights/{id}/make-goods"
