          assert:
            - "The dangling body FK returns HTTP 404 with data.error_id == ${err_fk} == \"ERR_COMPONENT_NOT_FOUND\""
            - "The error id is the FK-specific one, not ERR_NOT_FOUND: priority 4 owns unresolvable body foreign keys while priority 3 owns unresolvable path ids"
            - "The identical payload with a real component id returns HTTP 201 with data.status == ${ok_status} == \"PLACED\", so the 404 is caused by the missing row rather than by the body shape"
            - "Nothing was written by the rejected call: GET /api/v1/component-purchase-orders lists exactly one row, ${only_row} == ${ok_id}"
            - "The FK is checked before any range or enum rule on the same body, since priority 4 precedes priority 17"

