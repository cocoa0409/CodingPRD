      - name: golive_of_the_successor_version_suspends_coaching_plans_five_links_upstream
        grounds:
          - state_machines.ProtocolRollout.GOLIVE_SCHEDULED_to_GOLIVE_LIVE
          - state_machines.ProtocolVersion.APPROVED_to_ACTIVE
          - state_machines.ProtocolVersion.ACTIVE_to_SUPERSEDED
          - state_machines.Dispatcher.CERTIFIED_to_LAPSED
          - state_machines.CoachingPlan.ASSIGNED_to_SUSPENDED
        distinguishing_aspect: |
          CASCADE B crosses four different entity types in one POST: rollout LIVE -> new version
          ACTIVE -> prior version SUPERSEDED -> dispatchers certified on it LAPSED -> their open
          CoachingPlans SUSPENDED and their privilege re-derived, plus the sibling regression of
          the old rollout's training_status. The suspended plan's unmet hours deliberately stay
          in remediation_hours_owed, so the ledger does not move even though the plan's state did.
        test_recipe:
          setup:
            - "Program with two APPROVED MPDS_CARDSET versions on touching half-open windows: v13.0 [2026-07-01, 2026-09-01) and v13.1 [2026-09-01, +inf)."
            - "Dispatcher D1 CERTIFIED on v13.0; rollout R1 on v13.0 already LIVE with training COMPLETE."
            - "D1 carries one MANUAL STANDARD coaching plan (required_hours 4.0, credited 0.00), so remediation_hours_owed is 4.00 and privilege is FULL."
            - "Dispatcher D2 CERTIFIED on v13.1; rollout R2 on v13.1 has training COMPLETE and golive_status SCHEDULED with scheduled_golive_at 2026-08-10."
