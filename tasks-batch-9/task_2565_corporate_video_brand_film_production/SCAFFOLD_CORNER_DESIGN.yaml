# ---------------------------------------------------------------------------
# §1.9 Scaffold Corner Design — task 2565 Corporate Video & Brand Film Production
#
# Breadth probe. Walks references/claim-extraction-guide.md row by row against
# SCAFFOLD.yaml §1.1-§1.7. Corners already asserted by a named
# SCAFFOLD_DIFFICULTY_DESIGN.yaml instance are emitted as excluded_because stubs.
# Every setup_api_calls chain drives an empty DB into the instance's precondition
# using only endpoints declared in §1.5.
# ---------------------------------------------------------------------------
scaffold_corner_design:
  - section: entities
    instances:
      - name: project_creation_returns_persisted_row_with_zeroed_ledger
        claim_type: creation
        grounds:
          - entities.Project
          - endpoints[POST /projects]
          - state_machines.Project.initial_state
        distinguishing_aspect: "POST /projects with every declared input returns 201 with status DRAFT, provisional_cost_cents 0, committed_cost_cents 0, budget_variance_cents 0, approved_budget_cents null and archive_status NOT_PACKAGED."
        test_recipe:
          setup:
            - "An empty database"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: LineProducer
              as_user_id: "producer-1"
          trigger:
            - call: "POST /projects"
              payload: { client_name: "Verity Labs", campaign_title: "Proof Points", creative_brief_summary: "Three-film OLV brand series for a diagnostics company.", channel_scope: ["OLV", "SOCIAL"], usage_term_months: 24, budget_ceiling_cents: 40000000, contracted_revision_rounds: 3, raw_footage_retention_months: 18, raw_footage_terabytes: 22.5 }
              as: LineProducer
              as_user_id: "producer-1"
              captures: { proj: $.data.id }
          assert:
            - "The response is HTTP 201 and response_type == \"object\""
            - "Project.${proj}.status == DRAFT"
            - "Project.${proj}.client_name == \"Verity Labs\" and campaign_title == \"Proof Points\""
            - "Project.${proj}.channel_scope == [\"OLV\", \"SOCIAL\"], usage_term_months == 24, contracted_revision_rounds == 3"
            - "Project.${proj}.provisional_cost_cents == 0, committed_cost_cents == 0, budget_variance_cents == 0"
            - "Project.${proj}.approved_budget_cents is null, handover_at is null, retention_expires_at is null"
            - "Project.${proj}.archive_status == NOT_PACKAGED and review_gate == OPEN"
            - "Project.${proj}.round_entitlement_balance == 3 (contracted 3, none granted, none consumed)"

      - name: project_optional_inputs_fall_back_to_declared_defaults
        claim_type: defaults
        grounds:
          - entities.Project.fields.contracted_revision_rounds
          - entities.Project.fields.raw_footage_retention_months
          - entities.Project.fields.raw_footage_terabytes
        distinguishing_aspect: "Omitting contracted_revision_rounds, raw_footage_retention_months and raw_footage_terabytes yields exactly 2, 12 and 0 — the §1.1 defaults, not nulls."
        test_recipe:
          setup:
            - "An empty database"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: LineProducer
              as_user_id: "producer-1"
          trigger:
            - call: "POST /projects"
              payload: { client_name: "Kestrel Air", campaign_title: "Tailwind", creative_brief_summary: "Single OLV brand film with contract defaults.", channel_scope: ["OLV"], usage_term_months: 12, budget_ceiling_cents: 10000000 }
              as: LineProducer
              as_user_id: "producer-1"
              captures: { proj: $.data.id }
          assert:
            - "Project.${proj}.contracted_revision_rounds == 2"
            - "Project.${proj}.raw_footage_retention_months == 12"
            - "Project.${proj}.raw_footage_terabytes == 0"
            - "Project.${proj}.round_entitlement_balance == 2"

      - name: crew_member_creation_stamps_system_fields
        claim_type: system_fields
        grounds:
          - entities.CrewMember
          - endpoints[POST /crew-members]
        distinguishing_aspect: "The server mints id, created_at, updated_at and version on POST /crew-members; min_turnaround_hours defaults to 10 and union_local stays null when omitted."
        test_recipe:
          setup:
            - "An empty database"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProductionCoordinator
              as_user_id: "coord-1"
          trigger:
            - call: "POST /crew-members"
              payload: { full_name: "Noor Haddad", department: "SOUND", hourly_rate_cents: 6000 }
              as: ProductionCoordinator
              as_user_id: "coord-1"
              captures: { crew_key: $.data.id, crew_ver: $.data.version }
          assert:
            - "The response is HTTP 201 with a non-empty ${crew_key} and ${crew_ver} == 1"
            - "CrewMember.${crew_key}.created_at == \"2026-08-01T00:00:00Z\" and updated_at == \"2026-08-01T00:00:00Z\""
            - "CrewMember.${crew_key}.min_turnaround_hours == 10 and union_local is null"
            - "GET /crew-members/${crew_key} returns the same id, full_name \"Noor Haddad\" and hourly_rate_cents 6000"

      - name: shoot_day_retrieval_returns_window_and_derived_columns
        claim_type: retrieval
        grounds:
          - entities.ShootDay
          - endpoints[GET /shoot-days/{id}]
          - calculations.shoot_day_cost
        distinguishing_aspect: "GET /shoot-days/{id} echoes the stored call_time and wrap_time and carries the derived columns: status PLANNED, compliance_posture BLOCKED with no certs filed, confirmed_crew_count 0, call_sheet_status DRAFT and day_cost_cents equal to the location's 90000-cent daily fee alone."
        test_recipe:
          setup:
            - "A SCOPED project, one location with daily_fee_cents 90000, and one PLANNED shoot day on 2026-09-10 from 06:00Z to 16:00Z with no crew, equipment or certificates"
          setup_api_calls:
            - call: "POST /projects"
              payload: { client_name: "Bell Foundry", campaign_title: "Cast Iron", creative_brief_summary: "One-day OLV brand film at a working foundry.", channel_scope: ["OLV"], usage_term_months: 12, budget_ceiling_cents: 50000000 }
              as: LineProducer
              as_user_id: "producer-1"
              captures: { proj: $.data.id }
            - call: "POST /deliverables"
              payload: { project_id: "${proj}", title: "Cast Iron 60", channel: "OLV", aspect_ratio: "16:9", target_duration_seconds: 60, caption_requirement: "NONE", usage_rights_months: 12, air_date: "2026-12-01T00:00:00Z" }
              as: ProductionCoordinator
              as_user_id: "coord-1"
            - call: "POST /budget-lines"
              payload: { project_id: "${proj}", category: "LOCATION", description: "Foundry day fee", quantity: 1, unit_rate_cents: 90000, markup_pct: 0 }
              as: LineProducer
              as_user_id: "producer-1"
            - call: "POST /projects/${proj}/lock-scope"
              payload: {}
              as: LineProducer
              as_user_id: "producer-1"
            - call: "POST /locations"
              payload: { name: "Bell Foundry Floor", address: "3 Furnace Way, Erie", stage_count: 1, daily_fee_cents: 90000, insurance_minimum_cents: 50000000, permit_authority: "Erie Film Office" }
              as: ProductionCoordinator
              as_user_id: "coord-1"
              captures: { loc: $.data.id }
            - call: "POST /shoot-days"
              payload: { project_id: "${proj}", location_id: "${loc}", shoot_date: "2026-09-10", call_time: "2026-09-10T06:00:00Z", wrap_time: "2026-09-10T16:00:00Z" }
              as: ProductionCoordinator
              as_user_id: "coord-1"
              captures: { day1: $.data.id }
          trigger:
            - call: "GET /shoot-days/${day1}"
              payload: {}
              as: ProductionCoordinator
              as_user_id: "coord-1"
          assert:
            - "The response is HTTP 200 with data.id == ${day1} and data.project_id == ${proj}"
            - "ShootDay.${day1}.call_time == \"2026-09-10T06:00:00Z\" and wrap_time == \"2026-09-10T16:00:00Z\""
            - "ShootDay.${day1}.status == PLANNED, call_sheet_status == DRAFT, call_sheet_published_at is null"
            - "ShootDay.${day1}.compliance_posture == BLOCKED and confirmed_crew_count == 0"
            - "ShootDay.${day1}.day_cost_cents == 90000 (the location fee with no crew or equipment)"

      - name: deliverable_version_list_paginates_with_total_count_and_has_more
        claim_type: listing
        grounds:
          - endpoints[GET /deliverable-versions]
          - response_envelope.pagination_fields
        distinguishing_aspect: "With three cuts on one deliverable, GET /deliverable-versions?deliverable_id=...&limit=2&offset=0 returns 2 rows with total_count 3 and has_more true, and offset 2 returns the final row with has_more false."
        test_recipe:
          setup:
            - "A DRAFT project with one deliverable carrying three DRAFT cuts, each created against the deliverable version observed immediately beforehand"
          setup_api_calls:
            - call: "POST /projects"
              payload: { client_name: "Orchard Bank", campaign_title: "Three Cuts", creative_brief_summary: "OLV brand film with three offline cuts in the bin.", channel_scope: ["OLV"], usage_term_months: 12, budget_ceiling_cents: 50000000 }
              as: LineProducer
              as_user_id: "producer-1"
              captures: { proj: $.data.id }
            - call: "POST /deliverables"
              payload: { project_id: "${proj}", title: "Three Cuts 60", channel: "OLV", aspect_ratio: "16:9", target_duration_seconds: 60, caption_requirement: "NONE", usage_rights_months: 12, air_date: "2026-12-01T00:00:00Z" }
              as: ProductionCoordinator
              as_user_id: "coord-1"
              captures: { dlv: $.data.id, dlv_v1: $.data.version }
            - call: "POST /deliverable-versions"
              payload: { deliverable_id: "${dlv}", expected_deliverable_version: "${dlv_v1}", cut_label: "cut A", aspect_ratio: "16:9", duration_seconds: 60, has_captions: false, caption_format: "NONE", file_size_gb: 8.0 }
              as: PostSupervisor
              as_user_id: "post-1"
            - call: "GET /deliverables/${dlv}"
              payload: {}
              as: PostSupervisor
              as_user_id: "post-1"
              captures: { dlv_v2: $.data.version }
            - call: "POST /deliverable-versions"
              payload: { deliverable_id: "${dlv}", expected_deliverable_version: "${dlv_v2}", cut_label: "cut B", aspect_ratio: "16:9", duration_seconds: 60, has_captions: false, caption_format: "NONE", file_size_gb: 8.1 }
              as: PostSupervisor
              as_user_id: "post-1"
            - call: "GET /deliverables/${dlv}"
              payload: {}
              as: PostSupervisor
              as_user_id: "post-1"
              captures: { dlv_v3: $.data.version }
            - call: "POST /deliverable-versions"
              payload: { deliverable_id: "${dlv}", expected_deliverable_version: "${dlv_v3}", cut_label: "cut C", aspect_ratio: "16:9", duration_seconds: 60, has_captions: false, caption_format: "NONE", file_size_gb: 8.2 }
              as: PostSupervisor
              as_user_id: "post-1"
          trigger:
            - call: "GET /deliverable-versions"
              payload: { deliverable_id: "${dlv}", limit: 2, offset: 0 }
              as: PostSupervisor
              as_user_id: "post-1"
            - call: "GET /deliverable-versions"
              payload: { deliverable_id: "${dlv}", limit: 2, offset: 2 }
              as: PostSupervisor
              as_user_id: "post-1"
          assert:
            - "The first response is HTTP 200 with response_type == \"array\", 2 rows, total_count == 3, limit == 2, offset == 0, has_more == true"
            - "The second response returns 1 row with total_count == 3, offset == 2 and has_more == false"
            - "Every returned row has deliverable_id == ${dlv} and review_status == DRAFT"
            - "Deliverable.${dlv}.version_count == 3"

      - name: deliverable_version_fetch_with_unknown_id_returns_not_found
        claim_type: not_found
        grounds:
          - errors[ERR_DELIVERABLE_VERSION_NOT_FOUND]
          - validations[priority=8]
        distinguishing_aspect: "GET /deliverable-versions/{id} with an id no row carries returns 404 ERR_DELIVERABLE_VERSION_NOT_FOUND, not an empty 200."
        test_recipe:
          setup:
            - "A DRAFT project exists so the database is non-empty, but no DeliverableVersion has ever been created"
          setup_api_calls:
            - call: "POST /projects"
              payload: { client_name: "Solano Wines", campaign_title: "Old Vines", creative_brief_summary: "OLV brand film, nothing shot yet.", channel_scope: ["OLV"], usage_term_months: 12, budget_ceiling_cents: 10000000 }
              as: LineProducer
              as_user_id: "producer-1"
          trigger:
            - call: "GET /deliverable-versions/dv-does-not-exist"
              payload: {}
              as: PostSupervisor
              as_user_id: "post-1"
          assert:
            - "The response is HTTP 404 with data.error_id == ERR_DELIVERABLE_VERSION_NOT_FOUND"
            - "data.message is a non-empty string and response_type == \"error\""

      - name: budget_line_missing_required_unit_rate_rejected
        claim_type: required_fields
        grounds:
          - validations[priority=4]
          - endpoints[POST /budget-lines]
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: "Omitting the required unit_rate_cents on POST /budget-lines returns 400 ERR_INVALID_REQUEST and persists no row, so the project ledger stays at 0."
        test_recipe:
          setup:
            - "A DRAFT project with an empty budget"
          setup_api_calls:
            - call: "POST /projects"
              payload: { client_name: "Marlow Cycles", campaign_title: "Cadence", creative_brief_summary: "OLV brand film being budgeted.", channel_scope: ["OLV"], usage_term_months: 12, budget_ceiling_cents: 10000000 }
              as: LineProducer
              as_user_id: "producer-1"
              captures: { proj: $.data.id }
          trigger:
            - call: "POST /budget-lines"
              payload: { project_id: "${proj}", category: "CREW", description: "Camera package", quantity: 2 }
              as: LineProducer
              as_user_id: "producer-1"
          assert:
            - "The response is HTTP 400 with data.error_id == ERR_INVALID_REQUEST"
            - "GET /projects/${proj}/budget-lines returns total_count == 0"
            - "Project.${proj}.provisional_cost_cents == 0"

      - name: deliverable_with_undeclared_aspect_ratio_rejected
        claim_type: type_constraints
        grounds:
          - validations[priority=4]
          - entities.Deliverable.fields.aspect_ratio
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: "aspect_ratio \"21:9\" is outside the declared enum, so POST /deliverables returns 400 ERR_INVALID_REQUEST before any channel-scope or usage-term rule is consulted."
        test_recipe:
          setup:
            - "A DRAFT project whose channel_scope is [\"OLV\"] and usage_term_months is 12"
          setup_api_calls:
            - call: "POST /projects"
              payload: { client_name: "Perrin Optics", campaign_title: "Clear Field", creative_brief_summary: "OLV brand film in a single aspect ratio.", channel_scope: ["OLV"], usage_term_months: 12, budget_ceiling_cents: 10000000 }
              as: LineProducer
              as_user_id: "producer-1"
              captures: { proj: $.data.id }
          trigger:
            - call: "POST /deliverables"
              payload: { project_id: "${proj}", title: "Clear Field ultrawide", channel: "OLV", aspect_ratio: "21:9", target_duration_seconds: 60, caption_requirement: "NONE", usage_rights_months: 12, air_date: "2026-12-01T00:00:00Z" }
              as: ProductionCoordinator
              as_user_id: "coord-1"
          assert:
            - "The response is HTTP 400 with data.error_id == ERR_INVALID_REQUEST"
            - "data.error_id != ERR_CHANNEL_OUT_OF_SCOPE and != ERR_USAGE_RIGHTS_EXCEED_TERM"
            - "GET /projects/${proj}/deliverables returns total_count == 0"

      - name: shoot_day_with_wrap_before_call_rejected
        claim_type: type_constraints
        grounds:
          - validations[priority=4]
          - entities.ShootDay.fields.call_time
          - entities.ShootDay.fields.wrap_time
        distinguishing_aspect: "An inverted interval (wrap_time 06:00Z earlier than call_time 16:00Z) fails the §1.4 priority-4 interval check with 400 ERR_INVALID_REQUEST and never reaches the location capacity rule."
        test_recipe:
          setup:
            - "A SCOPED project and one location with 1 stage and no shoot days yet"
          setup_api_calls:
            - call: "POST /projects"
              payload: { client_name: "Halden Homes", campaign_title: "Groundwork", creative_brief_summary: "OLV brand film scheduled on one stage day.", channel_scope: ["OLV"], usage_term_months: 12, budget_ceiling_cents: 50000000 }
              as: LineProducer
              as_user_id: "producer-1"
              captures: { proj: $.data.id }
            - call: "POST /deliverables"
              payload: { project_id: "${proj}", title: "Groundwork 60", channel: "OLV", aspect_ratio: "16:9", target_duration_seconds: 60, caption_requirement: "NONE", usage_rights_months: 12, air_date: "2026-12-01T00:00:00Z" }
              as: ProductionCoordinator
              as_user_id: "coord-1"
            - call: "POST /budget-lines"
              payload: { project_id: "${proj}", category: "LOCATION", description: "Stage day", quantity: 1, unit_rate_cents: 90000, markup_pct: 0 }
              as: LineProducer
              as_user_id: "producer-1"
            - call: "POST /projects/${proj}/lock-scope"
              payload: {}
              as: LineProducer
              as_user_id: "producer-1"
            - call: "POST /locations"
              payload: { name: "Halden Stage 1", address: "10 Mill Road, Duluth", stage_count: 1, daily_fee_cents: 90000, insurance_minimum_cents: 50000000, permit_authority: "Duluth Film Office" }
              as: ProductionCoordinator
              as_user_id: "coord-1"
              captures: { loc: $.data.id }
          trigger:
            - call: "POST /shoot-days"
              payload: { project_id: "${proj}", location_id: "${loc}", shoot_date: "2026-09-10", call_time: "2026-09-10T16:00:00Z", wrap_time: "2026-09-10T06:00:00Z" }
              as: ProductionCoordinator
              as_user_id: "coord-1"
          assert:
            - "The response is HTTP 400 with data.error_id == ERR_INVALID_REQUEST"
            - "GET /shoot-days with location_id ${loc} returns total_count == 0"
            - "Location.${loc}.scheduled_shoot_day_count == 0"

      - name: budget_line_against_unknown_project_returns_not_found
        claim_type: parent_relationships
        grounds:
          - validations[priority=6]
          - errors[ERR_PROJECT_NOT_FOUND]
          - entities.BudgetLine.fields.project_id
        distinguishing_aspect: "A BudgetLine naming a project_id no Project carries returns 404 ERR_PROJECT_NOT_FOUND, ahead of any fiscal or state rule."
        test_recipe:
          setup:
            - "One real DRAFT project exists, so the failure is FK resolution rather than an empty table"
          setup_api_calls:
            - call: "POST /projects"
              payload: { client_name: "Tamarind Foods", campaign_title: "Slow Simmer", creative_brief_summary: "OLV brand film with a real project row.", channel_scope: ["OLV"], usage_term_months: 12, budget_ceiling_cents: 10000000 }
              as: LineProducer
              as_user_id: "producer-1"
              captures: { proj: $.data.id }
          trigger:
            - call: "POST /budget-lines"
              payload: { project_id: "prj-does-not-exist", category: "CREW", description: "Ghost crew", quantity: 1, unit_rate_cents: 50000, markup_pct: 0 }
              as: LineProducer
              as_user_id: "producer-1"
          assert:
            - "The response is HTTP 404 with data.error_id == ERR_PROJECT_NOT_FOUND"
            - "GET /projects/${proj}/budget-lines returns total_count == 0, so nothing was attached to the real project either"

      - name: crew_booking_with_unknown_crew_member_returns_not_found
        claim_type: parent_relationships
        grounds:
          - validations[priority=12]
          - errors[ERR_CREW_MEMBER_NOT_FOUND]
          - entities.CrewBooking.fields.crew_member_id
        distinguishing_aspect: "In this flat topology a CrewBooking carries two FKs; a resolvable shoot_day_id with an unresolvable crew_member_id still returns 404 ERR_CREW_MEMBER_NOT_FOUND, proving both references are checked."
        test_recipe:
          setup:
            - "A SCOPED project with one location and one PLANNED shoot day on 2026-09-10 from 06:00Z to 16:00Z, and no crew members on the roster"
          setup_api_calls:
            - call: "POST /projects"
              payload: { client_name: "Ridge Tools", campaign_title: "Hard Edge", creative_brief_summary: "One-day OLV brand film with an unstaffed roster.", channel_scope: ["OLV"], usage_term_months: 12, budget_ceiling_cents: 50000000 }
              as: LineProducer
              as_user_id: "producer-1"
              captures: { proj: $.data.id }
            - call: "POST /deliverables"
              payload: { project_id: "${proj}", title: "Hard Edge 60", channel: "OLV", aspect_ratio: "16:9", target_duration_seconds: 60, caption_requirement: "NONE", usage_rights_months: 12, air_date: "2026-12-01T00:00:00Z" }
              as: ProductionCoordinator
              as_user_id: "coord-1"
            - call: "POST /budget-lines"
              payload: { project_id: "${proj}", category: "CREW", description: "Crew pool", quantity: 1, unit_rate_cents: 90000, markup_pct: 0 }
              as: LineProducer
              as_user_id: "producer-1"
            - call: "POST /projects/${proj}/lock-scope"
              payload: {}
              as: LineProducer
              as_user_id: "producer-1"
            - call: "POST /locations"
              payload: { name: "Ridge Yard", address: "77 Quarry Lane, Boise", stage_count: 1, daily_fee_cents: 90000, insurance_minimum_cents: 50000000, permit_authority: "Boise Film Office" }
              as: ProductionCoordinator
              as_user_id: "coord-1"
              captures: { loc: $.data.id }
            - call: "POST /shoot-days"
              payload: { project_id: "${proj}", location_id: "${loc}", shoot_date: "2026-09-10", call_time: "2026-09-10T06:00:00Z", wrap_time: "2026-09-10T16:00:00Z" }
              as: ProductionCoordinator
              as_user_id: "coord-1"
              captures: { day1: $.data.id }
          trigger:
            - call: "POST /crew-bookings"
              payload: { shoot_day_id: "${day1}", crew_member_id: "crw-does-not-exist", department_role: "Key Grip", call_time: "2026-09-10T06:00:00Z", wrap_time: "2026-09-10T16:00:00Z" }
              as: ProductionCoordinator
              as_user_id: "coord-1"
          assert:
            - "The response is HTTP 404 with data.error_id == ERR_CREW_MEMBER_NOT_FOUND"
            - "GET /crew-bookings with shoot_day_id ${day1} returns total_count == 0"
            - "ShootDay.${day1}.confirmed_crew_count == 0 and day_cost_cents == 90000"

      - name: budget_line_extended_cents_computed_from_quantity_and_markup
        claim_type: computed_fields
        grounds:
          - entities.BudgetLine.fields.extended_cents
          - calculations.budget_line_extended_cents
        excluded_because:
          difficulty_instance: combinatorial_formula / budget_markup_rounds_per_line_before_summing
          rationale: "That §1.8 instance pins extended_cents at 23887 per line and the 71661 roll-up, covering the computed-field claim and its rounding order."

  - section: state_machines
    instances:
      - name: shoot_day_and_crew_booking_start_in_declared_initial_states
        claim_type: initial_state
        grounds:
          - state_machines.ShootDay.initial_state
          - state_machines.CrewBooking.initial_state
          - entities.ShootDay.fields.call_sheet_status
        distinguishing_aspect: "A freshly created ShootDay is PLANNED with call_sheet_status DRAFT and a freshly created CrewBooking is HELD, so neither enters the committed ledger: provisional_cost_cents rises by the 50000-cent booking while committed_cost_cents stays at 0."
        test_recipe:
          setup:
            - "A SCOPED project with one PLANNED 90000-cent budget line, one location and one camera operator at 5000 cents an hour"
          setup_api_calls:
            - call: "POST /projects"
              payload: { client_name: "Vantage Realty", campaign_title: "Open House", creative_brief_summary: "One-day OLV brand film.", channel_scope: ["OLV"], usage_term_months: 12, budget_ceiling_cents: 50000000 }
              as: LineProducer
              as_user_id: "producer-1"
              captures: { proj: $.data.id }
            - call: "POST /deliverables"
              payload: { project_id: "${proj}", title: "Open House 60", channel: "OLV", aspect_ratio: "16:9", target_duration_seconds: 60, caption_requirement: "NONE", usage_rights_months: 12, air_date: "2026-12-01T00:00:00Z" }
              as: ProductionCoordinator
              as_user_id: "coord-1"
