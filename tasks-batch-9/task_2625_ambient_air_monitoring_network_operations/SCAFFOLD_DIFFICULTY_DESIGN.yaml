            - "DesignValue.${dv_id}.design_value == 9.1"

      - name: site_shutdown_cascade_monitor_batch_package_submission
        grounds:
          - state_machines.SiteChangeRequest.SUBMITTED_to_APPROVED
          - state_machines.MonitoringSite.OPERATING_to_SHUTDOWN
          - state_machines.Monitor.OPERATING_to_DECOMMISSIONED
          - state_machines.DataBatch.validation_status.REOPENED_to_INVALIDATED
          - state_machines.CertificationPackage.SUBMITTED_to_DRAFT
          - state_machines.DataBatch.submission_status.SUBMITTED_to_UNSUBMITTED
        distinguishing_aspect: |
          Depth-5 chain from POST /site-change-requests/{id}/decision with APPROVE on a SHUTDOWN request: hop 1 site
          OPERATING -> SHUTDOWN -> hop 2 that shutdown decommissions the site's monitor -> hop 3 the decommissioning
          invalidates that monitor's non-validated quarter with reason SITE_TERMINATED -> hop 4 the invalidated quarter
          returns its SUBMITTED certification package to DRAFT -> hop 5 the package's return unsubmits every quarter it
          carried. The trigger transition differs from the concurrence cascade's determination endpoint.
        test_recipe:
          setup:
            - "logical clock at 2026-01-05T00:00:00Z"
            - "twelve validated complete quarters for 2023-2025 on one primary monitor at the network's only operating site"
            - "a submitted 2025 certification package, so all four 2025 quarters carry submission_status SUBMITTED"
            - "2025 Q1 subsequently reopened, so it is REOPENED on the validation dimension and still SUBMITTED on the submission dimension"
            - "an APPROVED 2026 network assessment for the network"
            - "a SUBMITTED SHUTDOWN site-change request citing that assessment"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-05T00:00:00Z" }
              as: NetworkAdmin
            - call: "POST /pollutants"
              payload: { code: "PM25", averaging_period_hours: 24, standard_form: "ANNUAL_MEAN", primary_standard_value: 9.0, design_value_years: 3, completeness_threshold_pct: 75.0, rounding_decimals: 1 }
