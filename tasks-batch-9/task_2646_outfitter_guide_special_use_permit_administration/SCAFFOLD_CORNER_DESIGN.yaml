      - name: publishing_a_second_assessment_supersedes_the_first_in_the_same_request
        claim_type: valid_transition
        grounds:
          - state_machines.NeedsAssessment.transitions[DRAFT->PUBLISHED]
          - state_machines.NeedsAssessment.transitions[PUBLISHED->SUPERSEDED]
          - endpoints.POST /osup/needs-assessments/{id}/publish
          - calculations.needs_assessment_allocation_recomputation
        distinguishing_aspect: |
          The publish trigger drives TWO rows: the target DRAFT -> PUBLISHED and, inside the same
          request, the incumbent PUBLISHED -> SUPERSEDED, but only when use_area_id AND assessment_year
          both match. A same-area assessment for a DIFFERENT year is left alone. The superseded row
          keeps its published_at and its last computed figures — it is frozen, not cleared.
        test_recipe:
          setup:
            - "logical clock at 2027-01-05T00:00:00Z; use area BRW-01 with allocatable 900 and no applications"
          setup_api_calls:
            - call: "POST /osup/_clock/set_current_utc"
              payload: { to_iso8601: "2027-01-05T00:00:00Z" }
              as: ProgramAdministrator
            - call: "POST /osup/use-areas"
              payload: { area_code: "BRW-01", name: "Bear River Wilderness", total_allocated_service_days: 1000, season_year: 2027, season_open_date: "2027-05-15", season_close_date: "2027-09-30", party_size_max: 12, max_clients_per_guide: 8, reserved_admin_service_days: 100, min_liability_coverage_cents: 100000000 }
              as: ProgramAdministrator
              captures: { ua_id: "$.data.id" }
          trigger:
            - call: "POST /osup/use-areas/${ua_id}/needs-assessments"
              payload: { assessment_year: 2027, public_need_finding: "NEED_EXISTS", determined_capacity_service_days: 900, allocated_service_days: 0 }
              as: PermitSpecialist
              captures: { na1_id: "$.data.id" }
            - call: "POST /osup/needs-assessments/${na1_id}/publish"
              payload: {}
              as: AuthorizedOfficer
            - call: "POST /osup/use-areas/${ua_id}/needs-assessments"
              payload: { assessment_year: 2028, public_need_finding: "NEED_EXISTS", determined_capacity_service_days: 700, allocated_service_days: 0 }
              as: PermitSpecialist
              captures: { na_other_year_id: "$.data.id" }
            - call: "POST /osup/needs-assessments/${na_other_year_id}/publish"
              payload: {}
              as: AuthorizedOfficer
            - call: "POST /osup/use-areas/${ua_id}/needs-assessments"
              payload: { assessment_year: 2027, public_need_finding: "NEED_EXISTS", determined_capacity_service_days: 800, allocated_service_days: 0 }
              as: PermitSpecialist
              captures: { na2_id: "$.data.id" }
            - call: "POST /osup/needs-assessments/${na2_id}/publish"
              payload: {}
              as: AuthorizedOfficer
            - call: "GET /osup/use-areas/${ua_id}/needs-assessments"
              payload: { assessment_year: 2027 }
              as: PermitSpecialist
          assert:
            - "after its publish, ${na1_id} reads status PUBLISHED, published_at \"2027-01-05T00:00:00Z\", version 2, allocated_service_days 0, unallocated_service_days 900, prospectus_required false"
            - "publishing the 2028 assessment does NOT touch ${na1_id}: it is still PUBLISHED at version 2, because supersession requires the SAME assessment_year, not merely the same area"
            - "after publishing ${na2_id}: ${na2_id} is PUBLISHED with unallocated_service_days 800, and ${na1_id} has moved to SUPERSEDED with version 3"
            - "the SUPERSEDED ${na1_id} still carries published_at \"2027-01-05T00:00:00Z\" and its frozen figures allocated 0 / unallocated 900 — supersession freezes the row rather than clearing it"
            - "the 2027 listing returns exactly 2 rows ordered created_at ASC: ${na1_id} SUPERSEDED then ${na2_id} PUBLISHED"

      - name: direct_screen_writes_every_declared_side_effect_in_one_request
