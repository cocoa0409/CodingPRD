            - "GET /dtc/shipments?order_id=${o_id} returns exactly one row: the impostor's attempt created nothing"
      - name: the_officer_who_raised_an_exception_cannot_decide_it_and_the_filer_cannot_remit
        claim_type: segregation_of_duties
        grounds:
          - errors[ERR_SEGREGATION_OF_DUTIES]
          - complexity_profile.role_model
          - validations.priority_35
          - endpoints.POST_/dtc/compliance-exceptions/{id}/decision
          - endpoints.POST_/dtc/remittances/{id}/remit
          - roles.ComplianceOfficer.notes
        distinguishing_aspect: |
          Segregation of duties is enforced on X-User-ID and not on the role, so both actors here are
          ComplianceOfficers and both endpoints list exactly that role: the ONLY thing separating the refusal
          from the success is which officer id signs the second step. The scaffold has two such pairs —
          raise/decide on a ComplianceException and file/remit on a TaxRemittance — and both are exercised on
          live rows so the refusal cannot be confused with a state precondition.
        test_recipe:
          setup:
            - "Estate 1 holds an ACTIVE TX permit and an APPROVED GSO enrollment; Ada is ID-verified. Clock 2026-08-01."
            - "Order A (6 x 750 ml, 4.500 L) cleared, then a 21.000 L manual adjustment dated 2026-07-01 left 1.500 L of headroom under the 27.000 L TX limit."
            - "Order B (6 x 750 ml) breached that headroom and sits in OVERRIDE_PENDING with rejection_error_id ERR_CONSUMER_VOLUME_LIMIT_EXCEEDED."
            - "officer_a raised the exception on order B, so ComplianceException.requested_by_user_id is \"officer_a\" and Winery.open_exception_count is 1."
            - "officer_a also opened and FILED the MONTHLY ACCRUAL_BASIS TX remittance for [2026-08-01, 2026-09-01), so filed_by_user_id is \"officer_a\" and it has a non-zero shipment_count."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /dtc/wineries"
              payload: { name: "Estate 1", ttb_permit_number: "TTB-1001", home_state_code: "CA", annual_production_gallons: 120000 }
              as: PlatformAdmin
              captures: { w_id: $.data.id }
            - call: "POST /dtc/state-rules"
              payload: { state_code: "TX", allows_dtc: true, per_consumer_limit_liters: 27.000, per_consumer_period: "ROLLING_12_MONTHS", per_winery_annual_limit_liters: 5000.000, excise_rate_per_liter_cents: 55, large_format_surcharge_cents_per_liter: 20, excise_cap_cents_per_shipment: 100000, sales_tax_rate_bps: 825, tax_on_shipping: true, excise_in_tax_base: false, adult_signature_required: true, requires_carrier_program: true, reporting_frequency: "MONTHLY", zero_filing_required: true, min_purchaser_age: 21, renewal_lead_days: 45 }
              as: PlatformAdmin
