          assert:
            - "the owner's read -> 200 with data.id == ${app1_id}"
            - "the other developer's read of the same application -> 403 ERR_NOT_RESOURCE_OWNER"
            - "limit 0 -> 400 ERR_INVALID_REQUEST (pagination limit must be 1..100)"
            - "the owner's read repeated with X-User-Role omitted, or present but empty -> 401 ERR_MISSING_AUTH_HEADERS; likewise with X-User-ID absent"
            - "the owner's read repeated with X-User-Role: Operator -> 401 ERR_UNKNOWN_ROLE (checked before authorisation)"
            - "the owner's read repeated with X-User-Role: Developer and X-User-ID: 00000000-0000-4000-8000-000000000000 -> 401 ERR_UNKNOWN_DEVELOPER_IDENTITY"
            - "POST /api-products repeated with X-User-Role: Developer -> 403 ERR_UNAUTHORIZED and no product is created"
            - "GET /_clock/current with no headers at all -> 200 (the single exemption from priority 1)"

      - name: every_path_id_family_has_its_own_not_found
