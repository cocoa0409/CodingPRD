# =============================================================================
# 1.9 Scaffold Corner Design (Breadth Probe)
#   Task: 2860 Homestead Exemption & Property Tax Relief Administration
#   Taxonomy: references/claim-extraction-guide.md — nine sections, per-section
#   claim_type rows only. No invented categories.
#   Every grounds ref resolves into SCAFFOLD.yaml §1.1-§1.7; every name is unique
#   across the union of SCAFFOLD_DIFFICULTY_DESIGN.yaml and this file.
#   Every money / score literal below was computed by executing the §1.3 formula.
#   Fixed logical-clock convention: chains that care about time open with
#   POST /_clock/set_current_utc at 2026-08-01T00:00:00Z.
#   Canonical fixture arithmetic reused throughout:
#     Parcel P1 (base_year 2020, base_year_value 30000000, market 40000000,
#       cap 200 bps, tax_year 2026) -> capped = assessed = 33600000
#     HOMESTEAD_BASIC (relief 2500 bps, ceiling 10000000) on P1 at 10000 bps
#       ownership -> benefit_amount_cents 8400000, taxable 25200000
#     COUNTY_MILL_RATE_BPS 125 -> per-year saving on that benefit = 105000
# =============================================================================

scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:

      - name: parcel_creation_computes_the_full_value_decomposition
        claim_type: creation
        grounds:
          - entities.Parcel.fields.capped_value_cents
          - entities.Parcel.fields.assessed_value_cents
          - entities.Parcel.fields.exempt_value_cents
          - entities.Parcel.fields.taxable_value_cents
          - entities.Parcel.fields.exemption_status
          - calculations.parcel_value_decomposition
          - endpoints[POST /parcels]
        distinguishing_aspect: "A POST /parcels with every required input returns 201 and the four computed value fields are already populated from an empty ACTIVE grant set: capped_value_cents 33600000, assessed_value_cents 33600000, exempt_value_cents 0, taxable_value_cents 33600000, exemption_status UNEXEMPTED."
        test_recipe:
          setup:
            - "Empty database; the logical clock is pinned at 2026-08-01T00:00:00Z."
            - "No ReliefProgram, no OwnershipRecord and no ExemptionGrant exist, so the waterfall input set is empty."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramAdministrator
              as_user_id: "admin-01"
          trigger:
            - call: "POST /parcels"
              payload: { apn: "P-0001", situs_address_normalized: "100 OAK ST NORTHFIELD ST 10001", county_zone: "NORTH", tax_year: 2026, base_year: 2020, base_year_value_cents: 30000000, market_value_cents: 40000000, assessment_cap_pct_bps: 200 }
              as: AssessorAnalyst
              as_user_id: "analyst-01"
              captures: { p1_id: $.data.id, p1_v: $.data.version }
          assert:
            - "the trigger returns HTTP 201"
            - "Parcel.${p1_id}.capped_value_cents == 33600000"
            - "Parcel.${p1_id}.assessed_value_cents == 33600000"
            - "Parcel.${p1_id}.exempt_value_cents == 0"
            - "Parcel.${p1_id}.taxable_value_cents == 33600000"
            - "Parcel.${p1_id}.exemption_status == UNEXEMPTED"
            - "Parcel.${p1_id}.apn == P-0001 and county_zone == NORTH and tax_year == 2026 and base_year == 2020"
            - "${p1_v} == 1"

      - name: parcel_read_returns_the_stored_valuation_and_current_version
        claim_type: retrieval
        grounds:
          - endpoints[GET /parcels/{id}]
          - entities.Parcel.fields.assessed_value_cents
          - response_envelope.success
        distinguishing_aspect: "GET /parcels/{id} returns the same stored row the create call produced — assessed_value_cents 33600000 and version 1 — inside a response_type object envelope, with no recomputation drift."
        test_recipe:
          setup:
            - "Parcel P1 was created with base_year_value_cents 30000000, cap 200 bps and tax_year 2026, so its stored assessed_value_cents is 33600000 and its version is 1."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramAdministrator
              as_user_id: "admin-01"
            - call: "POST /parcels"
              payload: { apn: "P-0001", situs_address_normalized: "100 OAK ST NORTHFIELD ST 10001", county_zone: "NORTH", tax_year: 2026, base_year: 2020, base_year_value_cents: 30000000, market_value_cents: 40000000, assessment_cap_pct_bps: 200 }
              as: AssessorAnalyst
              as_user_id: "analyst-01"
              captures: { p1_id: $.data.id }
          trigger:
            - call: "GET /parcels/${p1_id}"
              payload: {}
              as: AssessorAnalyst
              as_user_id: "analyst-01"
          assert:
            - "the trigger returns HTTP 200 with response_type object"
            - "the returned id equals ${p1_id}"
            - "Parcel.${p1_id}.capped_value_cents == 33600000 and assessed_value_cents == 33600000 and taxable_value_cents == 33600000"
            - "Parcel.${p1_id}.version == 1 and exemption_status == UNEXEMPTED"

      - name: application_list_paginates_with_total_count_and_has_more
        claim_type: listing
        grounds:
          - endpoints[GET /exemption-applications]
          - response_envelope.pagination_fields
          - response_envelope.pagination_defaults
        distinguishing_aspect: "With three DRAFT applications for one taxpayer, GET /exemption-applications?taxpayer_id=...&limit=2&offset=0 returns exactly 2 rows while reporting total_count 3 and has_more true."
        test_recipe:
          setup:
            - "One OPEN HOMESTEAD_BASIC ReliefProgram exists."
            - "Three parcels P-0001, P-0002 and P-0003 exist and one TaxpayerAccount T exists."
            - "Three DRAFT ExemptionApplications exist, one per parcel, all for T, program HOMESTEAD_BASIC and tax_year 2026; none is submitted so no duplicate-application rule can fire."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramAdministrator
              as_user_id: "admin-01"
            - call: "POST /relief-programs"
              payload: { program_code: "HOMESTEAD_BASIC", name: "Basic Homestead", relief_pct_bps: 2500, max_exempt_value_cents: 10000000, statutory_lookback_years: 3, penalty_pct_bps: 1000, interest_pct_bps_per_year: 500, priority_rank: 10 }
              as: ProgramAdministrator
              as_user_id: "admin-01"
              captures: { prog_h_id: $.data.id }
            - call: "POST /parcels"
              payload: { apn: "P-0001", situs_address_normalized: "100 OAK ST NORTHFIELD ST 10001", county_zone: "NORTH", tax_year: 2026, base_year: 2020, base_year_value_cents: 30000000, market_value_cents: 40000000, assessment_cap_pct_bps: 200 }
              as: AssessorAnalyst
              as_user_id: "analyst-01"
              captures: { p1_id: $.data.id }
            - call: "POST /parcels"
              payload: { apn: "P-0002", situs_address_normalized: "2 BIRCH LN NORTHFIELD ST 10002", county_zone: "NORTH", tax_year: 2026, base_year: 2020, base_year_value_cents: 20000000, market_value_cents: 25000000, assessment_cap_pct_bps: 200 }
              as: AssessorAnalyst
              as_user_id: "analyst-01"
              captures: { p2_id: $.data.id }
            - call: "POST /parcels"
              payload: { apn: "P-0003", situs_address_normalized: "3 CEDAR CT NORTHFIELD ST 10003", county_zone: "NORTH", tax_year: 2026, base_year: 2020, base_year_value_cents: 10000000, market_value_cents: 12000000, assessment_cap_pct_bps: 200 }
              as: AssessorAnalyst
              as_user_id: "analyst-01"
              captures: { p3_id: $.data.id }
            - call: "POST /taxpayer-accounts"
              payload: { full_name: "TERESA OWNER", date_of_birth: "1955-03-10", ssn_last4: "4321", mailing_address_normalized: "100 OAK ST NORTHFIELD ST 10001" }
              as: IntakeClerk
              as_user_id: "clerk-01"
              captures: { t_id: $.data.id }
            - call: "POST /exemption-applications"
              payload: { parcel_id: "${p1_id}", taxpayer_id: "${t_id}", program_id: "${prog_h_id}", tax_year: 2026, claimed_occupancy_date: "2019-06-01", claimed_address_normalized: "100 OAK ST NORTHFIELD ST 10001" }
              as: IntakeClerk
              as_user_id: "clerk-01"
              captures: { app1_id: $.data.id }
            - call: "POST /exemption-applications"
              payload: { parcel_id: "${p2_id}", taxpayer_id: "${t_id}", program_id: "${prog_h_id}", tax_year: 2026, claimed_occupancy_date: "2019-06-01", claimed_address_normalized: "2 BIRCH LN NORTHFIELD ST 10002" }
              as: IntakeClerk
              as_user_id: "clerk-01"
              captures: { app2_id: $.data.id }
            - call: "POST /exemption-applications"
              payload: { parcel_id: "${p3_id}", taxpayer_id: "${t_id}", program_id: "${prog_h_id}", tax_year: 2026, claimed_occupancy_date: "2019-06-01", claimed_address_normalized: "3 CEDAR CT NORTHFIELD ST 10003" }
              as: IntakeClerk
              as_user_id: "clerk-01"
              captures: { app3_id: $.data.id }
          trigger:
            - call: "GET /exemption-applications?taxpayer_id=${t_id}&limit=2&offset=0"
              payload: {}
              as: IntakeClerk
              as_user_id: "clerk-01"
          assert:
            - "the trigger returns HTTP 200 with response_type array and exactly 2 rows in data"
            - "the response reports limit == 2, offset == 0, total_count == 3 and has_more == true"
            - "every returned row has status == DRAFT and taxpayer_id == ${t_id}"
            - "GET /exemption-applications?taxpayer_id=${t_id}&limit=2&offset=2 returns exactly 1 row with total_count == 3 and has_more == false"

      - name: unknown_parcel_id_on_read_returns_parcel_not_found
        claim_type: not_found
        grounds:
          - errors[ERR_PARCEL_NOT_FOUND]
          - validations[priority=6]
          - endpoints[GET /parcels/{id}]
        distinguishing_aspect: "A GET /parcels/{id} for an id that was never minted returns HTTP 404 with error_id ERR_PARCEL_NOT_FOUND and no data payload fields."
        test_recipe:
          setup:
            - "One real Parcel P1 exists so the collection is non-empty and the 404 is about the addressed id, not about emptiness."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramAdministrator
              as_user_id: "admin-01"
            - call: "POST /parcels"
              payload: { apn: "P-0001", situs_address_normalized: "100 OAK ST NORTHFIELD ST 10001", county_zone: "NORTH", tax_year: 2026, base_year: 2020, base_year_value_cents: 30000000, market_value_cents: 40000000, assessment_cap_pct_bps: 200 }
              as: AssessorAnalyst
              as_user_id: "analyst-01"
              captures: { p1_id: $.data.id }
          trigger:
            - call: "GET /parcels/00000000-0000-0000-0000-000000009999"
              payload: {}
              as: AssessorAnalyst
              as_user_id: "analyst-01"
              captures: { err: $.data.error_id }
          assert:
            - "the trigger returns HTTP 404 with ${err} == ERR_PARCEL_NOT_FOUND"
            - "the envelope response_type == error"
            - "GET /parcels/${p1_id} still returns HTTP 200, so the failed read had no side effect"

      - name: taxpayer_account_without_full_name_is_rejected
        claim_type: required_fields
        grounds:
          - errors[ERR_INVALID_REQUEST]
          - validations[priority=5]
          - entities.TaxpayerAccount.fields.full_name
          - endpoints[POST /taxpayer-accounts]
        distinguishing_aspect: "POST /taxpayer-accounts omitting the required full_name input returns HTTP 400 ERR_INVALID_REQUEST and persists no TaxpayerAccount row."
        test_recipe:
          setup:
            - "Empty database except for the pinned logical clock; full_name has source input and no default, so omitting it is a hard request error."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramAdministrator
              as_user_id: "admin-01"
          trigger:
            - call: "POST /taxpayer-accounts"
              payload: { date_of_birth: "1955-03-10", ssn_last4: "4321", mailing_address_normalized: "100 OAK ST NORTHFIELD ST 10001" }
              as: IntakeClerk
              as_user_id: "clerk-01"
              captures: { err: $.data.error_id }
          assert:
            - "the trigger returns HTTP 400 with ${err} == ERR_INVALID_REQUEST"
            - "GET /taxpayer-accounts/00000000-0000-0000-0000-000000009999 returns HTTP 404 ERR_TAXPAYER_NOT_FOUND, confirming no account was minted by the rejected call"

      - name: relief_program_omitting_optional_flags_applies_declared_defaults
        claim_type: defaults
        grounds:
          - entities.ReliefProgram.fields.requires_income_certification
          - entities.ReliefProgram.fields.recertification_required
          - entities.ReliefProgram.fields.freeze_enabled
          - entities.ReliefProgram.fields.income_limit_cents
          - entities.ReliefProgram.fields.asset_limit_cents
          - entities.ReliefProgram.fields.status
          - endpoints[POST /relief-programs]
        distinguishing_aspect: "A POST /relief-programs that omits all five optional inputs stores requires_income_certification false, recertification_required false, freeze_enabled false, income_limit_cents null and asset_limit_cents null, and initialises status OPEN."
        test_recipe:
          setup:
            - "Empty database; no other ReliefProgram exists so the priority_rank uniqueness constraint is trivially satisfied."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramAdministrator
              as_user_id: "admin-01"
          trigger:
            - call: "POST /relief-programs"
              payload: { program_code: "HOMESTEAD_BASIC", name: "Basic Homestead", relief_pct_bps: 2500, max_exempt_value_cents: 10000000, statutory_lookback_years: 3, penalty_pct_bps: 1000, interest_pct_bps_per_year: 500, priority_rank: 10 }
              as: ProgramAdministrator
              as_user_id: "admin-01"
              captures: { prog_h_id: $.data.id }
          assert:
            - "the trigger returns HTTP 201"
            - "ReliefProgram.${prog_h_id}.requires_income_certification == false"
            - "ReliefProgram.${prog_h_id}.recertification_required == false"
            - "ReliefProgram.${prog_h_id}.freeze_enabled == false"
            - "ReliefProgram.${prog_h_id}.income_limit_cents == null and asset_limit_cents == null"
            - "ReliefProgram.${prog_h_id}.status == OPEN and version == 1"

      - name: denial_notice_appeal_deadline_is_thirty_days_after_mailing
        claim_type: computed_fields
        grounds:
          - entities.Notice.fields.mailed_at
          - entities.Notice.fields.appeal_deadline
          - entities.Notice.fields.appealable
          - state_machines.ExemptionApplication.UNDER_REVIEW_to_DENIED
          - endpoints[GET /taxpayer-accounts/{id}/notices]
        distinguishing_aspect: "A DENY determination issued while the logical clock reads 2026-08-01T00:00:00Z mails a DENIAL Notice whose computed appeal_deadline is exactly 2026-08-31T00:00:00.000Z (mailed_at + 30 days), and the notice is appealable."
        test_recipe:
          setup:
            - "The logical clock reads 2026-08-01T00:00:00Z."
            - "ExemptionApplication A1 for TaxpayerAccount T on Parcel P1 reached UNDER_REVIEW through one recorded VerificationCheck."
            - "No registry record was injected, so that first check resolved NO_RECORD, which is enough to move SUBMITTED -> UNDER_REVIEW."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramAdministrator
              as_user_id: "admin-01"
            - call: "POST /relief-programs"
              payload: { program_code: "HOMESTEAD_BASIC", name: "Basic Homestead", relief_pct_bps: 2500, max_exempt_value_cents: 10000000, statutory_lookback_years: 3, penalty_pct_bps: 1000, interest_pct_bps_per_year: 500, priority_rank: 10 }
              as: ProgramAdministrator
              as_user_id: "admin-01"
              captures: { prog_h_id: $.data.id }
            - call: "POST /parcels"
              payload: { apn: "P-0001", situs_address_normalized: "100 OAK ST NORTHFIELD ST 10001", county_zone: "NORTH", tax_year: 2026, base_year: 2020, base_year_value_cents: 30000000, market_value_cents: 40000000, assessment_cap_pct_bps: 200 }
              as: AssessorAnalyst
              as_user_id: "analyst-01"
              captures: { p1_id: $.data.id, p1_v: $.data.version }
            - call: "POST /taxpayer-accounts"
              payload: { full_name: "TERESA OWNER", date_of_birth: "1955-03-10", ssn_last4: "4321", mailing_address_normalized: "100 OAK ST NORTHFIELD ST 10001" }
              as: IntakeClerk
              as_user_id: "clerk-01"
              captures: { t_id: $.data.id }
            - call: "POST /exemption-applications"
              payload: { parcel_id: "${p1_id}", taxpayer_id: "${t_id}", program_id: "${prog_h_id}", tax_year: 2026, claimed_occupancy_date: "2019-06-01", claimed_address_normalized: "100 OAK ST NORTHFIELD ST 10001" }
              as: IntakeClerk
              as_user_id: "clerk-01"
              captures: { app1_id: $.data.id }
            - call: "POST /exemption-applications/${app1_id}/submit"
              payload: {}
              as: IntakeClerk
              as_user_id: "clerk-01"
            - call: "POST /exemption-applications/${app1_id}/verification-checks"
              payload: { source: "VOTER_REGISTRY" }
              as: ExemptionsReviewer
              as_user_id: "reviewer-01"
          trigger:
            - call: "POST /exemption-applications/${app1_id}/determine"
              payload: { outcome: "DENY", expected_parcel_version: "${p1_v}", denial_reason: "No voter registration on file at the claimed situs address." }
              as: ExemptionsReviewer
              as_user_id: "reviewer-01"
          assert:
            - "the trigger returns HTTP 200 and ExemptionApplication.${app1_id}.status == DENIED with denial_reason set"
            - "GET /taxpayer-accounts/${t_id}/notices?notice_type=DENIAL returns exactly 1 row"
            - "that Notice has mailed_at == 2026-08-01T00:00:00.000Z and appeal_deadline == 2026-08-31T00:00:00.000Z"
            - "that Notice has appealable == true, subject_type == EXEMPTION_APPLICATION and subject_id == ${app1_id}"
            - "Parcel.${p1_id}.version == ${p1_v} (a DENY determination does not touch the parcel)"

      - name: taxpayer_account_system_fields_and_ledger_are_server_initialised
        claim_type: system_fields
        grounds:
          - entities.TaxpayerAccount.fields.status
          - entities.TaxpayerAccount.fields.lifetime_refund_cents
          - entities.TaxpayerAccount.fields.lifetime_recovery_collected_cents
          - entities.TaxpayerAccount.fields.net_relief_cents
          - endpoints[POST /taxpayer-accounts]
        distinguishing_aspect: "POST /taxpayer-accounts returns a server-minted id with created_at, updated_at and version 1, status GOOD_STANDING and all three ledger fields at 0 — none of which appear in the endpoint's input list."
        test_recipe:
          setup:
            - "Empty database; the caller supplies only the five declared input fields."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramAdministrator
              as_user_id: "admin-01"
          trigger:
            - call: "POST /taxpayer-accounts"
              payload: { full_name: "TERESA OWNER", date_of_birth: "1955-03-10", ssn_last4: "4321", mailing_address_normalized: "100 OAK ST NORTHFIELD ST 10001", disability_rating_pct_bps: 0 }
              as: IntakeClerk
              as_user_id: "clerk-01"
              captures: { t_id: $.data.id, t_v: $.data.version }
          assert:
            - "the trigger returns HTTP 201 and ${t_id} is a non-empty server-generated id"
            - "${t_v} == 1 and created_at and updated_at are both present in the response"
            - "TaxpayerAccount.${t_id}.status == GOOD_STANDING"
            - "TaxpayerAccount.${t_id}.lifetime_refund_cents == 0 and lifetime_recovery_collected_cents == 0 and net_relief_cents == 0"

      - name: relief_program_with_an_undeclared_program_code_is_rejected
        claim_type: type_constraints
        grounds:
          - entities.ReliefProgram.fields.program_code
          - errors[ERR_INVALID_REQUEST]
          - validations[priority=5]
        distinguishing_aspect: "POST /relief-programs with program_code SOLAR_CREDIT — a value outside the five declared enum members — returns HTTP 400 ERR_INVALID_REQUEST and stores nothing."
        test_recipe:
          setup:
            - "Empty database; program_code is an enum constrained to HOMESTEAD_BASIC, SENIOR_FREEZE, VETERAN_DISABILITY, DISABILITY_INCOME and AGRICULTURAL_USE."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramAdministrator
              as_user_id: "admin-01"
          trigger:
            - call: "POST /relief-programs"
              payload: { program_code: "SOLAR_CREDIT", name: "Solar Credit", relief_pct_bps: 2500, max_exempt_value_cents: 10000000, statutory_lookback_years: 3, penalty_pct_bps: 1000, interest_pct_bps_per_year: 500, priority_rank: 10 }
              as: ProgramAdministrator
              as_user_id: "admin-01"
              captures: { err: $.data.error_id }
          assert:
            - "the trigger returns HTTP 400 with ${err} == ERR_INVALID_REQUEST"
            - "a following POST /relief-programs with program_code HOMESTEAD_BASIC and priority_rank 10 succeeds with HTTP 201, proving the rejected call consumed no priority_rank"

      - name: verification_check_is_an_immutable_event_row
        claim_type: immutability
        grounds:
          - entities.VerificationCheck.fields.result
          - entities.VerificationCheck.fields.checked_at
          - endpoints[POST /exemption-applications/{id}/verification-checks]
          - endpoints[GET /exemption-applications/{id}/verification-checks]
        distinguishing_aspect: "VerificationCheck is declared common_fields false: its rows carry no version and no update endpoint exists, so recording a second VOTER_REGISTRY check appends a new row instead of mutating the first, whose result stays NO_RECORD."
        test_recipe:
          setup:
            - "Application A1 is SUBMITTED and no registry record exists for T, so the first VOTER_REGISTRY check resolves NO_RECORD."
            - "A matching VOTER_REGISTRY registry record is then injected and a second VOTER_REGISTRY check is recorded, which resolves MATCH."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramAdministrator
              as_user_id: "admin-01"
            - call: "POST /relief-programs"
              payload: { program_code: "HOMESTEAD_BASIC", name: "Basic Homestead", relief_pct_bps: 2500, max_exempt_value_cents: 10000000, statutory_lookback_years: 3, penalty_pct_bps: 1000, interest_pct_bps_per_year: 500, priority_rank: 10 }
              as: ProgramAdministrator
              as_user_id: "admin-01"
              captures: { prog_h_id: $.data.id }
            - call: "POST /parcels"
              payload: { apn: "P-0001", situs_address_normalized: "100 OAK ST NORTHFIELD ST 10001", county_zone: "NORTH", tax_year: 2026, base_year: 2020, base_year_value_cents: 30000000, market_value_cents: 40000000, assessment_cap_pct_bps: 200 }
              as: AssessorAnalyst
              as_user_id: "analyst-01"
              captures: { p1_id: $.data.id }
            - call: "POST /taxpayer-accounts"
              payload: { full_name: "TERESA OWNER", date_of_birth: "1955-03-10", ssn_last4: "4321", mailing_address_normalized: "100 OAK ST NORTHFIELD ST 10001" }
              as: IntakeClerk
              as_user_id: "clerk-01"
              captures: { t_id: $.data.id }
            - call: "POST /exemption-applications"
              payload: { parcel_id: "${p1_id}", taxpayer_id: "${t_id}", program_id: "${prog_h_id}", tax_year: 2026, claimed_occupancy_date: "2019-06-01", claimed_address_normalized: "100 OAK ST NORTHFIELD ST 10001" }
              as: IntakeClerk
              as_user_id: "clerk-01"
              captures: { app1_id: $.data.id }
            - call: "POST /exemption-applications/${app1_id}/submit"
              payload: {}
              as: IntakeClerk
              as_user_id: "clerk-01"
            - call: "POST /exemption-applications/${app1_id}/verification-checks"
