          - entities.ArtistAssignment.fields.window_start
          - entities.ArtistAssignment.fields.window_end
        distinguishing_aspect: "HandwritingArtist resource, half-open [start,end) semantics: window [10:00,12:00) overlapping an existing [09:00,11:00) is rejected, but the adjacent [11:00,13:00) (start == prior end) is accepted."
