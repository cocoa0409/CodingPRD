              as: BureauAdmin
              captures: { x5_small_line: "$.data.id" }
            - call: "POST /bureau/composition-templates"
              payload: { client_id: "${x5_client_id}", template_code: "T-X5", version_no: 1, duplex_required: true, sheets_per_document: 2, color_pages_per_document: 0, mail_class_preference: "FIRST_CLASS", required_insert_codes: [], variable_content_rules: [] }
              as: BureauAdmin
              captures: { x5_template_id: "$.data.id" }
            - call: "POST /bureau/composition-templates/${x5_template_id}/activate"
              payload: {}
              as: BureauAdmin
            - call: "POST /bureau/data-files"
