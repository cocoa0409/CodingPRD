        grounds:
          - state_machines.ExchangeCase.IN_FREE_LOOK_to_RESCINDED
          - state_machines.FundsTransfer.RECEIVED_to_RETURNED
          - state_machines.ExistingContract.EXCHANGED_to_IN_FORCE
          - entities.Client.fields.last_rescinded_at
        distinguishing_aspect: |
          Depth-4 chain from a single trigger (rescind): case -> RESCINDED
          causes transfer -> RETURNED, which causes contract -> IN_FORCE with
          snapshot restore, which causes client.last_rescinded_at to be stamped
          and the producer counters to recompute. Each hop is caused by the
          previous hop, not by the original request.
        test_recipe:
          setup:
            - "Junior client; K_STD contract; FULL case driven to IN_FREE_LOOK at default clock (delivery 2026-08-01, deadline 2026-08-21); transfer amount 9,800,000 with snapshots 10,000,000 / 8,000,000"
