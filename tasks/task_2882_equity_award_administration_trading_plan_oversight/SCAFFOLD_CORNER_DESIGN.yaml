          - state_machines.EquityPlan.FROZEN_to_ACTIVE
          - entities.EquityPlan.fields.freeze_reason
        distinguishing_aspect: |
          FREEZE stores freeze_reason and UNFREEZE clears it back to null while the version
          climbs 1 -> 2 -> 3, and a second UNFREEZE on the now-ACTIVE plan is refused with
          ERR_PLAN_INVALID_STATE - the round trip is exact and not idempotent.
        test_recipe:
          setup:
            - "Logical clock 2026-01-05T09:00:00Z; one ACTIVE plan at version 1 with freeze_reason null."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
