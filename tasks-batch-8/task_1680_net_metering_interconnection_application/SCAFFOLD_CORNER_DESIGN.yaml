          assert:
            - "UpgradeCostEstimate.${est1}.estimate_status == EXPIRED"
            - "InterconnectionApplication.${app1}.application_status == WITHDRAWN and withdrawal_reason == ESTIMATE_EXPIRED (phase 1 handles it before its own reservation expiry)"
            - "InterconnectionApplication.${app2}.application_status == WITHDRAWN and withdrawal_reason == RESERVATION_EXPIRED"
            - "InterconnectionApplication.${app3}.application_status == CAPACITY_RESERVED, capacity_reserved_watts == 8000, queue_position == null, reservation_expires_at == 2027-07-31T00:00:00Z (sweep instant 2027-02-01 + 180 days)"
            - "Program.${prog}.reserved_watts == 8000 and available_capacity_watts == 22000 and queued_count == 0 and program_status == OPEN"

      - name: ep_mark_work_complete_returns_screen_passed
        claim_type: conditional_action
        grounds:
          - state_machines.UpgradeCostEstimate.ACCEPTED_to_WORK_COMPLETE
          - state_machines.InterconnectionApplication.UPGRADE_IN_PROGRESS_to_SCREEN_PASSED
        distinguishing_aspect: "mark-work-complete is valid only from ACCEPTED and returns the application to SCREEN_PASSED (closing the upgrade loop back into the meter/inspection phase)."
        test_recipe:
          setup: ["Application in UPGRADE_IN_PROGRESS (estimate accepted)."]
