  # ---------------------------------------------------------------------------
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: confirm_state_vs_temporal_conflict
        grounds:
          - validations[priority=7]
          - validations[priority=9]
          - state_machines.Order
        distinguishing_aspect: |
          Error-category pair STATE vs BUSINESS_TEMPORAL: a CANCELLED order whose
