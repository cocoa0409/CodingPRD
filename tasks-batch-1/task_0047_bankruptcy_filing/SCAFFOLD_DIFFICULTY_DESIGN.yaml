              as: Debtor
              as_user_id: "${dbtr_id}"
              captures: { s_debt_id: $.data.id }
            - call: "POST /cases/${case_id}/petition"
              payload: {}
              as: Debtor
              as_user_id: "${dbtr_id}"
            - call: "POST /stay-relief-motions"
