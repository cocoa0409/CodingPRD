        preconditions: []
        side_effects: []

# =============================================================================
# §1.2.1 Concurrency Rules (true create-with-supersede races only, OCC-resolved)
# =============================================================================
concurrency_rules:
  - rule_id: trueup-create-stale-project
    parent_entity: Project
    write_endpoint: "POST /api/true-up-runs"
    occ_field: "expected_project_version"
    description: |
      Creating a TrueUpRun against a Project whose version has advanced since
      the client last observed it is rejected. Creating a run legitimately
      supersedes the project's PUBLISHED run, so a writer holding a stale
      project version would silently supersede a run it never saw.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: segment-schedule-stale-segment
    parent_entity: TrenchSegment
    write_endpoint: "POST /api/trench-segments/{id}/schedule"
    occ_field: "expected_trench_segment_version"
    description: |
      Scheduling (or rescheduling) a TrenchSegment whose version has advanced
      since the client last observed it is rejected. A reschedule legitimately
      replaces the current excavation window, so a writer holding a stale
      segment version would silently discard a window it never saw.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: provisional_cost_share
    trigger: "project MOBILIZE; participation withdrawal cascade; change-order incorporation cascade"
    algorithm: waterfall_allocation
    formula: |
      Let T = project.estimated_total_cost_cents, and P = participations with
      status in {COMMITTED, MOBILIZED, INSTALLED, BILLED, SETTLED} ordered by
      sequence_order ASC (tie-break: created_at ASC).
      Step 1 (round per participant first — pinned rounding order):
        raw_p = round_half_up(T * cost_share_bp_p / 10000) for each p in P.
      Step 2 (remainder reconciliation): remainder = T - sum(raw_p). Distribute
        abs(remainder) cents one at a time, +1 (or -1 when remainder < 0) per
        participant in the pinned order, wrapping is never needed because
        |remainder| < |P|.
      provisional_share_cents_p = adjusted value. Invariant: sum over P == T.
      variance_flag_p = true iff a previous value existed and
        abs(new - old) * 100 >= 10 * old.
    input_set: "participations with status COMMITTED|MOBILIZED|INSTALLED|BILLED|SETTLED; WITHDRAWN excluded (share 0)"
    precision: "integer cents, round_half_up"
    variants:
      - name: provisional
        when: "any time before a DRAFT TrueUpRun exists"
        difference: "based on estimated_total_cost_cents; ignores actuals, credits, exclusives"

  - name: final_trueup_allocation
    trigger: "POST /api/true-up-runs (run creation computes lines)"
    algorithm: waterfall_allocation
    formula: |
      joint_pool = sum(amount_cents where cost_code in {JOINT_TRENCH, RESTORATION, PROGRAM_OVERHEAD})
      exclusive_p = sum(amount_cents where cost_code = EXCLUSIVE and participation_id = p)
      total_actual_cost_cents = joint_pool + sum(exclusive_p)
      Step 1: gross_p with the SAME pinned rounding order as provisional_cost_share
        (round per participant on joint_pool, then remainder reconciliation).
      Step 2 (Rule 20 credit waterfall): remaining = project.rule20_credit_cents.
        For p in sequence_order ASC (tie-break created_at ASC):
          credit_p = min(remaining, gross_p); remaining -= credit_p.
        rule20_credit_applied_cents = rule20_credit_cents - remaining.
      Step 3: final_share_cents_p = gross_p - credit_p + exclusive_p.
      Step 4: delta_cents_p = final_share_cents_p - provisional_share_cents_p;
        refund_cents_p = max(0, -delta_cents_p).
      An Invoice is created at publish only when delta_cents_p > 0.
    input_set: "all ActualCostEntry rows of the project; participations COMMITTED|MOBILIZED|INSTALLED|BILLED|SETTLED (WITHDRAWN excluded from shares and invoices)"
    precision: "integer cents, round_half_up"
    variants:
      - name: final
        when: "TrueUpRun creation"
        difference: "based on actual costs with credit waterfall and exclusive add-backs; diverges from provisional for identical participation data"

  - name: depth_separation_requirement
    trigger: "POST /api/occupancy-slots validation"
    algorithm: constraint_propagation
    formula: |
      For a candidate slot S on segment G, for every existing slot E on G with
      status in {RESERVED, INSTALLING, INSTALL_FAILED, INSTALLED, VERIFIED}
      whose band is vertically distinct (no band overlap is ever allowed):
        gap = abs(S.depth_top_inches - E.depth_bottom_inches) when S is above E,
              else abs(E.depth_top_inches - S.depth_bottom_inches).
        Overlapping bands (S.top < E.bottom and E.top < S.bottom) count as gap 0.
        required = REDUCED_SEPARATION_IN (6) when both participants are
          non-ELECTRIC and both have has_separation_waiver = true;
          otherwise STANDARD_SEPARATION_IN (12).
        gap >= required else ERR_MIN_SEPARATION_VIOLATION.
      ELECTRIC deepest rule: if any slot on G belongs to an ELECTRIC
        participation, every non-electric slot's depth_bottom_inches must be
        <= min(electric slot depth_top_inches) - 12 (ERR_ELECTRIC_NOT_DEEPEST),
        and no electric slot may be placed above a non-electric band.
      Cover rule: depth_top_inches >= MIN_COVER_IN (12) (ERR_MIN_COVER_VIOLATION).
      Capacity: depth_bottom_inches <= G.max_depth_inches (ERR_DEPTH_CAPACITY_EXCEEDED).
    input_set: "slots of the same segment in RESERVED|INSTALLING|INSTALL_FAILED|INSTALLED|VERIFIED; RELEASED excluded"
    constants: { STANDARD_SEPARATION_IN: 12, REDUCED_SEPARATION_IN: 6, MIN_COVER_IN: 12 }
    variants:
      - name: standard
        when: "either participant is ELECTRIC or lacks the waiver"
        difference: "requires 12 inches of vertical separation"
      - name: reduced_waiver
        when: "both participants non-ELECTRIC and both have has_separation_waiver = true"
        difference: "requires only 6 inches — admits bands the standard variant rejects for identical geometry"

  - name: occupancy_window_conflict
    trigger: "POST /api/occupancy-slots validation"
    algorithm: interval_merge
    formula: |
      Half-open windows [install_start_at, install_end_at). Two slots on the
      same segment whose vertical gap < CONCURRENT_SEPARATION_IN (24) must have
      disjoint windows; adjacency (A.install_end_at == B.install_start_at) is
      allowed, and the shallower slot's window must not start before the deeper
      slot's window ends (deeper-first). Gap >= 24 allows overlapping windows.
      Each window must lie within the segment's excavation window
      [excavation_start_on, excavation_end_on] inclusive
      (ERR_SLOT_WINDOW_OUT_OF_RANGE); conflicts raise ERR_SLOT_WINDOW_CONFLICT.
    input_set: "slots of the same segment in RESERVED|INSTALLING|INSTALL_FAILED|INSTALLED|VERIFIED"
    constants: { CONCURRENT_SEPARATION_IN: 24 }

  - name: outage_crew_capacity
    trigger: "OutageWindow PROPOSED -> APPROVED"
    algorithm: threshold
    formula: |
      Half-open intervals [start_at, end_at): back-to-back windows
      (A.end_at == B.start_at) do NOT overlap. At any instant t, let n(t) =
      count of windows on the same feeder with status APPROVED|NOTIFIED|EXECUTED
      covering t plus the candidate. Require n(t) <= MAX_CONCURRENT_OUTAGES (2)
      for all t in [start_at, end_at), else ERR_CREW_CAPACITY_EXCEEDED.
      Duration: end_at - start_at <= MAX_OUTAGE_HOURS (8h); exactly 8h is
      allowed (ERR_OUTAGE_DURATION_EXCEEDED above).
    input_set: "OutageWindows of the same project with equal feeder_id in APPROVED|NOTIFIED|EXECUTED; CLOSED|CANCELLED|PROPOSED excluded"
    constants: { MAX_CONCURRENT_OUTAGES: 2, MAX_OUTAGE_HOURS: 8 }

  - name: notification_lead_time
    trigger: "OutageWindow APPROVED -> NOTIFIED"
    algorithm: threshold
    formula: |
      Require start_at - clock >= 72h. Exactly 72h00m00s passes; one second
      less raises ERR_NOTIFICATION_LEAD_TIME.
    constants: { NOTIFICATION_LEAD_HOURS: 72 }

  - name: panel_upgrade_rule
    trigger: "Parcel creation and panel_capacity_amps validation at PANEL_SET"
    algorithm: threshold
    formula: |
      panel_upgrade_required = (load_calc_amps >= 0.8 * existing_panel_amps)
      (>= is deliberate: exactly 80% requires the upgrade).
      New panel at PANEL_SET must satisfy
      panel_capacity_amps >= ceil(load_calc_amps * 1.25); equality passes,
      one amp less raises ERR_PANEL_CAPACITY_INADEQUATE.
    constants: { PANEL_LOAD_FACTOR: 0.8, PANEL_HEADROOM_FACTOR: 1.25 }

  - name: late_fee_accrual
    trigger: "Invoice read and Invoice PAID validation (evaluated against logical clock)"
    algorithm: chronological
    formula: |
      days_overdue = floor((clock - due_on) / 86400s); no fee when days_overdue < 30.
      periods = floor(days_overdue / 30) when days_overdue >= 30 (30 => 1, 59 => 1, 60 => 2).
      rate = ELEVATED_LATE_RATE (0.02) when principal_cents >= PRINCIPAL_TIER_THRESHOLD_CENTS,
             else STANDARD_LATE_RATE (0.015).
      Evaluation order is pinned (mode c): (1) principal_cents is fixed at
        publish (or dispute adjustment); (2) the tier is keyed on
        principal_cents ONLY — the fee never feeds back into the tier;
        (3) late_fee_cents = round_half_up(principal_cents * rate * periods).
      amount_due_cents = principal_cents + late_fee_cents.
    constants:
      LATE_FEE_GRACE_DAYS: 30
      STANDARD_LATE_RATE: 0.015
      ELEVATED_LATE_RATE: 0.02
      PRINCIPAL_TIER_THRESHOLD_CENTS: 10000000
      INVOICE_DUE_DAYS: 30

  - name: delay_liquidated_damages
    trigger: "change-order incorporation cascade"
    algorithm: tiered_pricing
    formula: |
      For each INCORPORATED change order: days_c = delta_delay_days,
        factor_c = 0.0 (EXCUSABLE) | 1.0 (NEGLIGENT) | 0.5 (MIXED).
      billable_days = sum(days_c * factor_c) - project.contingency_days,
        floored at 0 (max(0, ...)).
      raw = billable_days * LD_RATE_CENTS_PER_DAY.
      cap  = round_half_up(project.estimated_total_cost_cents * LD_CAP_PCT).
      liquidated_damages_cents = min(cap, raw).
    input_set: "change orders with status INCORPORATED only"
    constants: { LD_RATE_CENTS_PER_DAY: 50000, LD_CAP_PCT: 0.10 }
    precision: "integer cents, round_half_up"

  - name: project_posture
    trigger: "change-order transitions, easement transitions, permit expiry/revocation, share recompute"
    algorithm: constraint_propagation
    formula: |
      FROZEN      if any ChangeOrder of the project is APPROVED.
      CONDITIONAL else if any TRENCH Easement on any parcel of the project is REFUSED,
                  or any participation has variance_flag = true.
      CLEAR       otherwise.
      Posture gates: MOBILIZED -> TRENCHING requires posture != FROZEN;
      frozen segments reject schedule/transition/slot creation with
      ERR_CHANGE_ORDER_FREEZE.
    input_set: "all change orders, TRENCH easements, and participations of the project"

  - name: restoration_warranty
    trigger: "RestorationTask COMPLETE and WARRANTY_CLAIM"
    algorithm: threshold
    formula: |
      warranty_expires_on = completed_on + 180 days. A WARRANTY_CLAIM is valid
      while clock <= warranty_expires_on (the expiry instant itself is still
      claimable); one second after raises ERR_WARRANTY_EXPIRED.
    constants: { WARRANTY_DAYS: 180 }

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - { priority: 1, category: auth, check: "X-User-Role header present and a declared role", error_id: ERR_UNAUTHENTICATED, http_status: 401, applies_to: "all endpoints" }
  - { priority: 2, category: auth, check: "Role is listed for this endpoint", error_id: ERR_FORBIDDEN, http_status: 403, applies_to: "all endpoints" }
  - { priority: 3, category: auth, check: "UtilityCoordinator X-User-ID equals the target participation id (or the participation owning the slot/invoice)", error_id: ERR_OWNERSHIP_VIOLATION, http_status: 403, applies_to: "participation transitions, slot transitions, invoice pay/dispute" }
  - { priority: 4, category: existence, check: "Path and body references exist (left-to-right)", error_id: ERR_NOT_FOUND, http_status: 404, applies_to: "all endpoints" }
  - { priority: 5, category: business_constraint, check: "Required fields present, types valid, enum members valid, start < end ordering", error_id: ERR_VALIDATION, http_status: 400, applies_to: "all write endpoints" }
  - { priority: 6, category: state, check: "OCC expected_*_version matches current parent version", error_id: ERR_STALE_VERSION, http_status: 412, applies_to: "POST /api/true-up-runs; POST /api/trench-segments/{id}/schedule" }
  - { priority: 7, category: state, check: "Entity from-state is one of the transition's declared sources; terminal states reject all transitions. Also: slot creation requires segment SCHEDULED|EXCAVATING; participation creation requires project PLANNING|MOBILIZED", error_id: ERR_INVALID_STATE, http_status: 409, applies_to: "all transition/lifecycle endpoints; slot creation; participation creation" }
  - { priority: 8, category: state, check: "Project posture / change-order freeze gates the operation", error_id: ERR_POSTURE_FROZEN, http_status: 409, applies_to: "lifecycle START_TRENCHING; schedule; segment transitions; slot creation", http_status_alt: "ERR_CHANGE_ORDER_FREEZE 409 for frozen segments" }
  - { priority: 9, category: business_safety, check: "Trench geometry: min cover, band capacity, pairwise separation, electric-deepest", error_id: "ERR_MIN_COVER_VIOLATION | ERR_DEPTH_CAPACITY_EXCEEDED | ERR_MIN_SEPARATION_VIOLATION | ERR_ELECTRIC_NOT_DEEPEST", http_status: 422, applies_to: "POST /api/occupancy-slots" }
  - { priority: 10, category: business_safety, check: "Outage execution coverage: every affected conversion energized or temp service active", error_id: ERR_TEMP_SERVICE_REQUIRED, http_status: 409, applies_to: "outage transition to EXECUTED" }
  - { priority: 11, category: business_referential, check: "Easement gates: no TRENCH easement REFUSED on segment parcels; all TRENCH easements RECORDED", error_id: "ERR_EASEMENT_REFUSED_BLOCKING | ERR_EASEMENT_NOT_RECORDED", http_status: 409, applies_to: "segment transition to EXCAVATING" }
  - { priority: 12, category: business_referential, check: "An ISSUED ENCROACHMENT permit exists for the project", error_id: ERR_PERMIT_NOT_ISSUED, http_status: 409, applies_to: "segment transition to EXCAVATING" }
  - { priority: 13, category: business_temporal, check: "Permit validity window covers the excavation window inclusive", error_id: ERR_PERMIT_WINDOW_VIOLATION, http_status: 409, applies_to: "segment transition to EXCAVATING" }
  - { priority: 14, category: business_temporal, check: "Slot install window within segment excavation window inclusive", error_id: ERR_SLOT_WINDOW_OUT_OF_RANGE, http_status: 422, applies_to: "POST /api/occupancy-slots" }
  - { priority: 15, category: business_temporal, check: "Notification lead >= 72h; outage execution within window; warranty claim within warranty", error_id: "ERR_NOTIFICATION_LEAD_TIME | ERR_OUTAGE_WINDOW_MISSED | ERR_WARRANTY_EXPIRED", http_status: 409, applies_to: "outage NOTIFIED/EXECUTED; restoration WARRANTY_CLAIM" }
  - { priority: 16, category: business_constraint, check: "Slot window conflicts (gap < 24 must be disjoint, deeper first); deeper-first install order", error_id: "ERR_SLOT_WINDOW_CONFLICT | ERR_SLOT_ORDER_VIOLATION", http_status: 409, applies_to: "slot creation; slot transition to INSTALLING" }
  - { priority: 17, category: business_constraint, check: "Outage duration <= 8h; crew capacity <= 2 overlapping per feeder (half-open)", error_id: "ERR_OUTAGE_DURATION_EXCEEDED | ERR_CREW_CAPACITY_EXCEEDED", http_status: 422, applies_to: "outage creation/approval", http_status_alt: "ERR_CREW_CAPACITY_EXCEEDED 409" }
  - { priority: 18, category: business_constraint, check: "Panel capacity >= ceil(load * 1.25); segment backfill/close gates; energize requires backfilled segment; true-up prerequisites; min participants; unique sequence_order", error_id: "ERR_PANEL_CAPACITY_INADEQUATE | ERR_RESTORATION_OPEN_BLOCKING | ERR_SEGMENT_NOT_BACKFILLED | ERR_TRUEUP_PREREQUISITES | ERR_MIN_PARTICIPANTS | ERR_DUPLICATE_SEQUENCE", http_status: 409, applies_to: "various", http_status_alt: "ERR_PANEL_CAPACITY_INADEQUATE 422" }
  - { priority: 19, category: business_fiscal, check: "cost_share_bp sum over active participations == 10000 at mobilize", error_id: ERR_SHARE_SUM_INVALID, http_status: 422, applies_to: "project MOBILIZE" }
  - { priority: 20, category: business_fiscal, check: "paid_amount_cents == amount_due_cents exactly", error_id: ERR_PAYMENT_AMOUNT_MISMATCH, http_status: 422, applies_to: "invoice pay" }
  - { priority: 21, category: business_fiscal, check: "Segregation of duties on publish: publisher is neither the run creator nor any included cost submitter", error_id: ERR_SEGREGATION_OF_DUTIES, http_status: 403, applies_to: "true-up-run transition to PUBLISHED" }

