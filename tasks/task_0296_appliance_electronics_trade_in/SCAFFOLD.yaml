# =============================================================================
# Appliance & Electronics Trade-In / Buyback — benchmark seed tables (v1)
# =============================================================================

scenario: |
  296. Appliance & Electronics Trade-In / Buyback: device/model lookup,
  condition-grading questionnaire, quoted offer & price lock, shipping kit/label,
  inspection & re-quote/reject, payout method, data-wipe certification,
  recycling/disposal

domain_name: appliance-electronics-trade-in
api_prefix: ""   # flat/hybrid topology: Catalog, Customer, TradeIn and peers each mount at the root; no single shared resource prefix

# -----------------------------------------------------------------------------
# Complexity profile
# -----------------------------------------------------------------------------
complexity_profile:
  primary_archetype: pricing_engine
  secondary_archetype: workflow_orchestration
  complexity_layers:
    - dual_variant_calculation     # quoted (self-graded) value vs inspected (verified) value
    - cascading_side_effects       # reject/accept fan a chain across kit -> inspection -> payout -> disposition
    - rate_threshold_triggers      # price-lock expiry window; re-quote downgrade auto-decline tolerance
    - optimistic_concurrency       # OCC on TradeIn.version for re-quote acceptance / supersede

  entity_topology: hybrid
  # Catalog -> DeviceModel (config tree); TradeIn is a flat resource referencing
  # Customer + DeviceModel + the locked Quote, with child resources (Quote,
  # ShippingKit, Inspection, Payout, DataWipeCertificate, DispositionRecord)
  # hanging off it. A genuine cross-cutting graph, not a pure tree.

  state_machine_shape: branching
  # TradeIn forks at inspection into {accept-as-quoted, re-quote->customer-decision,
  # reject->return-or-dispose}; the re-quote arm loops back to a customer
  # accept/decline decision (cyclic revision) before converging on payout.

  relationship_patterns:
    - one_to_many        # Catalog -> DeviceModel; TradeIn -> Quote (initial + re-quote)
    - cross_aggregate    # TradeIn references DeviceModel (config aggregate) + Customer

  role_model: peer_roles
  # Customer owns their own trade-ins (entity_backed); GradingAgent runs
  # inspections; CatalogAdmin owns pricing config; FinanceOperator owns payouts.

  consistency_model: immediate

# =============================================================================
# Response envelope (FIXED — EMIT VERBATIM)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# Table 1: Entity-Relationship Table
# =============================================================================
entities:
  - name: Catalog
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Trade-in program / catalog name" }
      - { name: currency, type: string, source: input, default: "USD", description: "ISO currency for all money fields" }
      - { name: price_lock_hours, type: integer, source: input, default: 168, description: "Hours a LOCKED quote remains honored before it expires (price-lock window)" }
      - { name: requote_tolerance_pct, type: number, source: input, default: 0.15, description: "If inspected value is within this fraction below the locked quote, the system auto-accepts at the lower value instead of opening a re-quote; expressed as a fraction of locked amount" }
      - { name: data_wipe_required_categories, type: array, source: input, description: "List of device categories (enum members of DeviceModel.category) that MUST have a passing DataWipeCertificate before payout" }
      - { name: recycle_floor_value_cents, type: integer, source: input, default: 0, description: "If inspected value is at or below this floor, the device is routed to recycling/disposal rather than buyback" }

  - name: DeviceModel
    parent: Catalog
    common_fields: true
    fields:
      - { name: catalog_id, type: string, source: system, description: "FK -> Catalog.id" }
      - { name: manufacturer, type: string, source: input, description: "e.g. Acme, Globex" }
      - { name: model_code, type: string, source: input, description: "Lookup key; unique per catalog among non-RETIRED models (case-insensitive)" }
      - { name: category, type: enum, source: input, description: "SMARTPHONE | LAPTOP | TABLET | REFRIGERATOR | WASHER | TV | WEARABLE" }
      - { name: base_value_cents, type: integer, source: input, description: "Reference buyback value for a FLAWLESS, fully-functional unit before any deductions" }
      - { name: condition_multipliers, type: object, source: input, description: "Map of cosmetic grade enum -> multiplier fraction, keys exactly {FLAWLESS, GOOD, FAIR, POOR}; each a number in [0,1]" }
      - { name: defect_deductions, type: object, source: input, description: "Map of defect-flag key -> flat cents deduction, keys drawn from {CRACKED_SCREEN, BATTERY_DEGRADED, WATER_DAMAGE, MISSING_PARTS, WONT_POWER_ON, DENTED_BODY}" }
      - { name: status, type: enum, source: system, default: "ACTIVE", description: "ACTIVE | RETIRED; RETIRED models reject new trade-ins" }

  - name: PromotionCampaign
    parent: Catalog
    common_fields: true
    fields:
      - { name: catalog_id, type: string, source: system, description: "FK -> Catalog.id" }
      - { name: code, type: string, source: input, description: "Promo code a customer supplies at trade-in creation; unique per catalog among ACTIVE campaigns (case-insensitive)" }
      - { name: category_scope, type: enum, source: input, description: "Single DeviceModel.category the promo applies to, or ALL for any category" }
      - { name: effective_from, type: datetime, source: input, description: "Inclusive start of the promo's active interval (half-open [effective_from, effective_to))" }
      - { name: effective_to, type: datetime, source: input, description: "Exclusive end of the promo's active interval; effective_to > effective_from required" }
      - { name: bonus_pct, type: number, source: input, default: 0, description: "Fraction added on top of the condition-graded subtotal (applied before flat bonus and rounding)" }
      - { name: bonus_flat_cents, type: integer, source: input, default: 0, description: "Flat cents added after the percentage bonus" }
      - { name: bonus_cap_cents, type: integer, source: input, description: "Maximum combined bonus (pct + flat) this promo may contribute to a single quote" }
      - { name: status, type: enum, source: system, default: "ACTIVE", description: "ACTIVE | EXPIRED; EXPIRED campaigns are rejected at trade-in creation" }

  - name: Customer
    parent: null
    common_fields: true
    fields:
      - { name: email, type: string, source: input, description: "Unique contact email (case-insensitive)" }
      - { name: full_name, type: string, source: input, description: "Customer name" }
      - { name: wallet_balance_cents, type: integer, source: computed, default: 0, description: "Running store-credit balance; credited on STORE_CREDIT payouts and debited on reversals" }
      - { name: lifetime_payout_cents, type: integer, source: computed, default: 0, description: "Sum of amount_cents over this customer's PAID Payouts; conserved quantity for the payout invariant" }

  - name: TradeIn
    parent: null
    common_fields: true
    fields:
      - { name: customer_id, type: string, source: input, description: "FK -> Customer.id" }
      - { name: device_model_id, type: string, source: input, description: "FK -> DeviceModel.id; the looked-up model being traded in" }
      - { name: promotion_campaign_id, type: string, source: system, default: null, description: "FK -> PromotionCampaign.id; resolved from the supplied promo_code at creation, null if none" }
      - { name: locked_quote_id, type: string, source: system, default: null, description: "Denormalized pointer to the Quote.id currently in LOCKED state that the buyback honors (null before any quote is locked); the authoritative edge is Quote.trade_in_id, discoverable via GET /trade-ins/{id}/quotes filtered to status==LOCKED" }
      - { name: declared_grade, type: enum, source: input, description: "Customer's self-reported cosmetic grade: FLAWLESS | GOOD | FAIR | POOR" }
      - { name: declared_defects, type: array, source: input, default: [], description: "Customer-declared defect-flag keys (subset of DeviceModel.defect_deductions keys)" }
      - { name: declared_powers_on, type: boolean, source: input, default: true, description: "Customer assertion that the unit powers on" }
      - { name: status, type: enum, source: system, default: "DRAFT", description: "DRAFT | QUOTED | KIT_SENT | RECEIVED | INSPECTED | REQUOTED | ACCEPTED | PAID | REJECTED | RECYCLED | CANCELLED | EXPIRED" }
      - { name: final_value_cents, type: integer, source: computed, default: null, description: "The buyback amount settled at acceptance (from the honored quote), null until ACCEPTED/PAID" }
      - { name: version, type: integer, source: system, description: "OCC version; see common_fields" }

  - name: Quote
    parent: TradeIn
    common_fields: true
    fields:
      - { name: trade_in_id, type: string, source: system, description: "FK -> TradeIn.id" }
      - { name: kind, type: enum, source: system, description: "INITIAL (from the self-graded questionnaire) | REQUOTE (from inspection findings)" }
      - { name: graded_subtotal_cents, type: integer, source: computed, description: "base_value * condition_multiplier minus defect deductions, floored at 0, before promo bonus" }
      - { name: promo_bonus_cents, type: integer, source: computed, default: 0, description: "Bonus contributed by the campaign, capped at bonus_cap_cents (0 on REQUOTE quotes)" }
      - { name: amount_cents, type: integer, source: computed, description: "Final offered amount = graded_subtotal + promo_bonus, rounded per Catalog policy" }
      - { name: lock_expires_at, type: datetime, source: computed, default: null, description: "created_at + Catalog.price_lock_hours; populated only when the quote is LOCKED" }
      - { name: status, type: enum, source: system, default: "DRAFT", description: "DRAFT | LOCKED | SUPERSEDED | EXPIRED | HONORED" }

  - name: ShippingKit
    parent: TradeIn
    common_fields: true
    fields:
      - { name: trade_in_id, type: string, source: system, description: "FK -> TradeIn.id" }
      - { name: tracking_number, type: string, source: system, description: "Carrier tracking number minted on dispatch" }
      - { name: label_url, type: string, source: system, description: "Prepaid return-label URL minted on dispatch" }
      - { name: status, type: enum, source: system, default: "DISPATCHED", description: "DISPATCHED | IN_TRANSIT | DELIVERED_TO_HUB" }

  - name: Inspection
    parent: TradeIn
    common_fields: true
    fields:
      - { name: trade_in_id, type: string, source: system, description: "FK -> TradeIn.id" }
      - { name: graded_at, type: datetime, source: system, description: "When the grading agent submitted findings" }
      - { name: verified_grade, type: enum, source: input, description: "Inspector-verified cosmetic grade: FLAWLESS | GOOD | FAIR | POOR" }
      - { name: verified_defects, type: array, source: input, default: [], description: "Inspector-confirmed defect-flag keys (subset of DeviceModel.defect_deductions keys)" }
      - { name: verified_powers_on, type: boolean, source: input, description: "Inspector confirmation the unit powers on" }
      - { name: inspected_value_cents, type: integer, source: computed, description: "Re-run of the grading formula on verified findings, no promo bonus" }
      - { name: outcome, type: enum, source: computed, description: "MATCH (within tolerance, auto-accept at quote) | REQUOTE (downgrade beyond tolerance, above recycle floor) | RECYCLE (at/below recycle floor)" }

  - name: InspectionSlot
    parent: Catalog
    common_fields: true
    fields:
      - { name: catalog_id, type: string, source: system, description: "FK -> Catalog.id" }
      - { name: lane_category, type: enum, source: input, description: "Hub inspection lane keyed to a DeviceModel.category: SMARTPHONE | LAPTOP | TABLET | REFRIGERATOR | WASHER | TV | WEARABLE" }
      - { name: slot_start, type: datetime, source: input, description: "Inclusive start of the booked inspection window (closed interval [slot_start, slot_end])" }
      - { name: slot_end, type: datetime, source: input, description: "Inclusive end of the booked inspection window; slot_end > slot_start required" }
      - { name: status, type: enum, source: system, default: "BOOKED", description: "BOOKED | RELEASED; RELEASED slots free their interval and no longer conflict" }

  - name: Payout
    parent: TradeIn
    common_fields: true
    fields:
      - { name: trade_in_id, type: string, source: system, description: "FK -> TradeIn.id" }
      - { name: customer_id, type: string, source: system, description: "Denormalized copy of the owning TradeIn.customer_id (the authoritative customer edge runs Payout.trade_in_id -> TradeIn.customer_id); discoverable via GET /trade-ins/{id}/payouts" }
      - { name: method, type: enum, source: input, description: "STORE_CREDIT | ACH | CHECK" }
      - { name: amount_cents, type: integer, source: system, description: "= TradeIn.final_value_cents at the moment the payout is issued" }
      - { name: status, type: enum, source: system, default: "PAID", description: "PAID (minted directly on creation) | REVERSED (after a reversal). ISSUED is the state-machine's pre-persist initial label only; persisted payouts are never observed as ISSUED." }

  - name: DataWipeCertificate
    parent: TradeIn
    common_fields: true
    fields:
      - { name: trade_in_id, type: string, source: system, description: "FK -> TradeIn.id" }
      - { name: method, type: enum, source: input, description: "CRYPTO_ERASE | NIST_PURGE | PHYSICAL_DESTROY" }
      - { name: result, type: enum, source: input, description: "PASS | FAIL" }
      - { name: certificate_serial, type: string, source: system, description: "System-minted certificate serial" }

  - name: DispositionRecord
    parent: TradeIn
    common_fields: true
    fields:
      - { name: trade_in_id, type: string, source: system, description: "FK -> TradeIn.id" }
      - { name: disposition, type: enum, source: input, description: "RETURN_TO_CUSTOMER | RECYCLE | REFURBISH_INVENTORY" }
      - { name: reason, type: string, source: input, default: null, description: "Free-text disposition note" }

# =============================================================================
# Table 2: State Machine Table
# =============================================================================
state_machines:
  - entity: TradeIn
    initial_state: DRAFT
    terminal_states: [PAID, REJECTED, RECYCLED, CANCELLED, EXPIRED]
    transitions:
      - from: DRAFT
        to: QUOTED
        trigger: "POST /trade-ins/{id}/quote"
        actor: Customer
        preconditions:
          - "DeviceModel.status == ACTIVE (ERR_MODEL_RETIRED)"
          - "Any supplied promo resolves to a PromotionCampaign in {ACTIVE} scoped to this category or ALL (ERR_PROMO_INVALID)"
          - "declared_defects is a subset of DeviceModel.defect_deductions keys (ERR_UNKNOWN_DEFECT)"
        side_effects:
          - "Create Quote(kind=INITIAL, status=LOCKED): run grading formula on declared findings (calc graded_value), add promo_bonus (calc promo_bonus), set amount_cents, set lock_expires_at = created_at + price_lock_hours"
          - "Set TradeIn.locked_quote_id = new Quote.id"
      - from: QUOTED
        to: KIT_SENT
        trigger: "POST /trade-ins/{id}/ship-kit"
        actor: Customer
        preconditions:
          - "locked Quote not EXPIRED (its lock_expires_at > current time) (ERR_QUOTE_EXPIRED)"
        side_effects:
          - "Create ShippingKit(status=DISPATCHED) with tracking_number + label_url"
      - from: KIT_SENT
        to: RECEIVED
        trigger: "POST /trade-ins/{id}/receive"
        actor: GradingAgent
        preconditions:
          - "locked Quote not EXPIRED (ERR_QUOTE_EXPIRED)"
        side_effects:
          - "ShippingKit.status -> DELIVERED_TO_HUB"
      - from: RECEIVED
        to: INSPECTED
        trigger: "POST /trade-ins/{id}/inspect"
        actor: GradingAgent
        preconditions:
          - "verified_defects is a subset of DeviceModel.defect_deductions keys (ERR_UNKNOWN_DEFECT)"
        side_effects:
          - "Create Inspection: compute inspected_value_cents (calc graded_value on verified findings, no promo), compute outcome (calc inspection_outcome)"
          - "If outcome == MATCH: bubble TradeIn -> ACCEPTED via the MATCH auto-accept side-effect (see INSPECTED->ACCEPTED)"
          - "If outcome == REQUOTE: bubble TradeIn -> REQUOTED (create Quote kind=REQUOTE LOCKED at inspected_value, SUPERSEDE the prior INITIAL quote)"
          - "If outcome == RECYCLE: bubble TradeIn -> RECYCLED (create DispositionRecord disposition=RECYCLE; SUPERSEDE the prior quote)"
        note: "Exactly one of the three branch side-effects fires, selected by Inspection.outcome; this is the fork point."
      - from: INSPECTED
        to: ACCEPTED
        trigger: "system (Inspection.outcome == MATCH at /inspect)"
        actor: system
        preconditions:
          - "Inspection.outcome == MATCH"
        side_effects:
          - "Quote(INITIAL).status -> HONORED"
          - "TradeIn.final_value_cents = honored Quote.amount_cents"
      - from: INSPECTED
        to: REQUOTED
        trigger: "system (Inspection.outcome == REQUOTE at /inspect)"
        actor: system
        preconditions:
          - "Inspection.outcome == REQUOTE"
        side_effects:
          - "Prior INITIAL Quote.status -> SUPERSEDED"
          - "Create Quote(kind=REQUOTE, status=LOCKED, amount_cents = Inspection.inspected_value_cents, promo_bonus_cents = 0, lock_expires_at = created_at + price_lock_hours)"
          - "TradeIn.locked_quote_id = new REQUOTE Quote.id"
      - from: INSPECTED
        to: RECYCLED
        trigger: "system (Inspection.outcome == RECYCLE at /inspect)"
        actor: system
        preconditions:
          - "Inspection.outcome == RECYCLE"
        side_effects:
          - "Prior LOCKED Quote.status -> SUPERSEDED"
          - "Create DispositionRecord(disposition=RECYCLE)"
      - from: REQUOTED
        to: ACCEPTED
        trigger: "POST /trade-ins/{id}/accept-requote"
        actor: Customer
        preconditions:
          - "requires expected_trade_in_version (OCC) (ERR_STALE_VERSION)"
          - "REQUOTE Quote not EXPIRED (ERR_QUOTE_EXPIRED)"
        side_effects:
          - "REQUOTE Quote.status -> HONORED"
          - "TradeIn.final_value_cents = REQUOTE Quote.amount_cents"
      - from: REQUOTED
        to: REJECTED
        trigger: "POST /trade-ins/{id}/decline-requote"
        actor: Customer
        preconditions:
          - "requires expected_trade_in_version (OCC) (ERR_STALE_VERSION)"
        side_effects:
          - "REQUOTE Quote.status -> SUPERSEDED"
          - "Create DispositionRecord(disposition=RETURN_TO_CUSTOMER)"
      - from: REQUOTED
        to: REQUOTED
        trigger: "POST /trade-ins/{id}/reinspect"
        actor: GradingAgent
        preconditions:
          - "verified_defects is a subset of DeviceModel.defect_deductions keys (ERR_UNKNOWN_DEFECT)"
          - "re-inspection yields a downgrade outcome (inspected above recycle floor); RECYCLE/MATCH re-inspection is out of scope of this loop and rejected with ERR_INVALID_STATE"
        side_effects:
          - "Create a second Inspection with the new verified findings; compute inspected_value_cents"
          - "Current REQUOTE Quote.status -> SUPERSEDED (legitimate supersede: the new finding overrides the prior re-quote)"
          - "Create Quote(kind=REQUOTE, status=LOCKED, amount_cents = new inspected_value_cents, promo_bonus_cents = 0, lock_expires_at = created_at + price_lock_hours); TradeIn.locked_quote_id = new Quote.id"
        note: "Cyclic self-loop: a grading agent may revise the verified findings while the customer has not yet decided. This is the CREATE-with-supersede true race that §1.2.1's OCC on TradeIn.version resolves — a customer accept/decline carrying a pre-revision version is stale even though the trade-in is still legitimately REQUOTED."
      - from: ACCEPTED
        to: PAID
        trigger: "POST /trade-ins/{id}/payouts"
        actor: FinanceOperator
        preconditions:
          - "If DeviceModel.category in Catalog.data_wipe_required_categories, a DataWipeCertificate with result=PASS exists for this TradeIn (ERR_DATA_WIPE_REQUIRED)"
        side_effects:
          - "Create Payout(status=PAID, amount_cents = TradeIn.final_value_cents)"
          - "If method == STORE_CREDIT: Customer.wallet_balance_cents += amount_cents"
          - "Customer.lifetime_payout_cents += amount_cents"
          - "Create DispositionRecord(disposition=REFURBISH_INVENTORY)"
      - from: DRAFT
        to: CANCELLED
        trigger: "POST /trade-ins/{id}/cancel"
        actor: Customer
        preconditions: []
        side_effects: []
      - from: QUOTED
        to: CANCELLED
        trigger: "POST /trade-ins/{id}/cancel"
        actor: Customer
        preconditions: []
        side_effects:
          - "locked Quote.status -> SUPERSEDED"
      - from: QUOTED
        to: EXPIRED
        trigger: "POST /trade-ins/{id}/sweep-expiry (system epoch sweep, current time past lock_expires_at)"
        actor: system
        preconditions:
          - "current time > locked Quote.lock_expires_at"
        side_effects:
          - "locked Quote.status -> EXPIRED"
      - from: KIT_SENT
        to: EXPIRED
        trigger: "POST /trade-ins/{id}/sweep-expiry (system epoch sweep, current time past lock_expires_at)"
        actor: system
        preconditions:
          - "current time > locked Quote.lock_expires_at"
        side_effects:
          - "locked Quote.status -> EXPIRED"

  - entity: Quote
    initial_state: DRAFT
    terminal_states: [SUPERSEDED, EXPIRED, HONORED]
    transitions:
      - from: DRAFT
        to: LOCKED
        trigger: "system (on Quote creation during /quote, /inspect REQUOTE branch)"
        actor: system
        preconditions: []
        side_effects:
          - "Set lock_expires_at = created_at + Catalog.price_lock_hours"
        note: "Quotes are minted directly into LOCKED; DRAFT is the pre-persist initial state."
      - from: LOCKED
        to: HONORED
        trigger: "system (TradeIn accepted: MATCH auto-accept or accept-requote)"
        actor: system
        preconditions: []
        side_effects: []
      - from: LOCKED
        to: SUPERSEDED
        trigger: "system (re-quote replaces it, recycle, decline-requote, or cancel)"
        actor: system
        preconditions: []
        side_effects: []
      - from: LOCKED
        to: EXPIRED
        trigger: "POST /trade-ins/{id}/sweep-expiry (current time > lock_expires_at)"
        actor: system
        preconditions:
          - "current time > lock_expires_at"
        side_effects: []

  - entity: InspectionSlot
    initial_state: BOOKED
    terminal_states: [RELEASED]
    transitions:
      - from: BOOKED
        to: RELEASED
        trigger: "POST /inspection-slots/{id}/release"
        actor: GradingAgent | CatalogAdmin
        preconditions:
          - "slot is BOOKED (ERR_INVALID_STATE)"
        side_effects:
          - "Slot's interval no longer participates in overlap checks for subsequent bookings"

  - entity: Payout
    initial_state: ISSUED
    terminal_states: [REVERSED]
    transitions:
      - from: ISSUED
        to: PAID
        trigger: "system (Payout is created already PAID at /payouts; ISSUED is the pre-persist initial state)"
        actor: system
        preconditions: []
        side_effects: []
        note: "Payouts are minted directly into PAID; ISSUED exists only as the schema-default initial_state."
      - from: PAID
        to: REVERSED
        trigger: "POST /trade-ins/{id}/payouts/{payoutId}/reverse"
        actor: FinanceOperator
        preconditions:
          - "Payout.status == PAID (ERR_INVALID_STATE)"
        side_effects:
          - "If Payout.method == STORE_CREDIT: Customer.wallet_balance_cents -= Payout.amount_cents"
          - "Customer.lifetime_payout_cents -= Payout.amount_cents"
        note: "Compensating action: restores wallet_balance_cents and lifetime_payout_cents to pre-issue values. TradeIn itself stays in PAID; the reversal is a Payout-level transition."

# -----------------------------------------------------------------------------
# Concurrency rules (§1.2.1)
# -----------------------------------------------------------------------------
concurrency_rules:
  - rule_id: requote-decision-stale-tradein
    parent_entity: TradeIn
    write_endpoint: "POST /trade-ins/{id}/accept-requote"
    occ_field: "expected_trade_in_version"
    description: |
      Accepting a re-quote against a TradeIn whose version has advanced since the
      client last observed it is rejected with a stale-version error. The trade-in
      is still legitimately REQUOTED (so the state precondition passes), but a
      grading agent has run /reinspect — which legitimately supersedes the prior
      REQUOTE quote and mints a new one — bumping TradeIn.version. The customer's
      accept therefore carries a stale version and is refused.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: decline-decision-stale-tradein
    parent_entity: TradeIn
    write_endpoint: "POST /trade-ins/{id}/decline-requote"
    occ_field: "expected_trade_in_version"
    description: |
      Declining a re-quote against a TradeIn whose version has advanced since the
      client last observed it is rejected with a stale-version error. As with the
      accept arm, a /reinspect has legitimately superseded the prior REQUOTE quote
      and bumped TradeIn.version while the trade-in remains REQUOTED, so the
      customer's decline carries a stale version.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# Table 3: Calculation Rules Table
# =============================================================================
calculations:
  - name: graded_value
    trigger: "On /quote (declared findings) and on /inspect (verified findings)"
    algorithm: weighted_scoring
    formula: |
      # Inputs: model = DeviceModel, grade in {FLAWLESS,GOOD,FAIR,POOR},
      #         defects = list of defect-flag keys, powers_on = boolean
      multiplier = model.condition_multipliers[grade]          # fraction in [0,1]
      conditioned = round_half_up(model.base_value_cents * multiplier)   # integer cents
      deduction_total = sum(model.defect_deductions[d] for d in defects) # flat cents, sum over the declared/verified defect set
      if powers_on == false:
          # non-powering unit is forced to the POOR multiplier floor AND incurs
          # the WONT_POWER_ON deduction even if not explicitly listed
          conditioned = round_half_up(model.base_value_cents * model.condition_multipliers["POOR"])
          if "WONT_POWER_ON" not in defects:
              deduction_total = deduction_total + model.defect_deductions["WONT_POWER_ON"]
      graded_subtotal_cents = max(0, conditioned - deduction_total)      # floored at 0
      return graded_subtotal_cents
    input_set: "Exactly the grade + defect set + powers_on supplied on the triggering request; on /inspect the verified_* fields, on /quote the declared_* fields."
    constants:
      ROUNDING: round_half_up
    precision: "integer cents, round_half_up when multiplying by a fractional multiplier"
    variants:
      - name: quoted_self_graded
        when: "Quote(kind=INITIAL) at /quote"
        difference: "Uses customer-declared grade/defects/powers_on; promo bonus is then layered on (see promo_bonus); this is the provisional value."
      - name: inspected_verified
        when: "Inspection at /inspect"
        difference: "Uses inspector-verified grade/defects/powers_on; NO promo bonus is ever added; this is the final value and drives outcome selection."

  - name: promo_bonus
    trigger: "On /quote only, after graded_value, for INITIAL quotes that resolved a promo"
    algorithm: threshold
    formula: |
      # Inputs: graded_subtotal_cents (from graded_value), campaign = resolved PromotionCampaign or null
      if campaign is null:
          return 0
      pct_part  = round_half_up(graded_subtotal_cents * campaign.bonus_pct)   # round the percentage part FIRST
      flat_part = campaign.bonus_flat_cents                                   # then add the flat part
      raw_bonus = pct_part + flat_part
      promo_bonus_cents = min(raw_bonus, campaign.bonus_cap_cents)            # cap AFTER summing both parts
      return promo_bonus_cents
    input_set: "The single PromotionCampaign resolved from the trade-in's promo_code at creation; null on every REQUOTE quote."
    constants:
      ROUNDING: round_half_up
    precision: "integer cents; pct part rounded before adding flat part; cap applied to the sum"
    variants:
      - name: bonus_within_cap
        when: "pct_part + flat_part <= bonus_cap_cents"
        difference: "Full pct + flat bonus is granted."
      - name: bonus_capped
        when: "pct_part + flat_part > bonus_cap_cents"
        difference: "Bonus is clamped to bonus_cap_cents; the order (round-pct, add-flat, then cap) is pinned and observable when the cap straddles."

  - name: quote_amount
    trigger: "On /quote, composing graded_value + promo_bonus into the offered amount"
    algorithm: aggregation
    formula: |
      # Evaluation order is pinned: graded_subtotal computed first, then promo_bonus
      # keyed off that subtotal, then summed. amount is NOT re-rounded (both parts
      # are already integer cents) — summation only.
      graded_subtotal_cents = graded_value(...)        # step 1
      promo_bonus_cents     = promo_bonus(graded_subtotal_cents, campaign)  # step 2 (depends on step 1)
      amount_cents          = graded_subtotal_cents + promo_bonus_cents     # step 3
      return amount_cents
    input_set: "A single INITIAL Quote's own graded_subtotal_cents and promo_bonus_cents."
    constants: {}
    precision: "integer cents; pure sum, no additional rounding"
    variants:
      - name: with_promo
        when: "campaign resolved"
        difference: "amount = graded_subtotal + promo_bonus."
      - name: no_promo
        when: "campaign null (always for REQUOTE)"
        difference: "amount = graded_subtotal; promo_bonus_cents = 0."

  - name: inspection_outcome
    trigger: "On /inspect, after inspected_value_cents is computed"
    algorithm: threshold
    formula: |
      # Inputs: inspected = Inspection.inspected_value_cents,
      #         locked = TradeIn's locked Quote.amount_cents,
      #         tol = Catalog.requote_tolerance_pct, floor = Catalog.recycle_floor_value_cents
      if inspected <= floor:
          return "RECYCLE"                       # at-or-below floor: dispose, checked FIRST
      # tolerance band is a fraction of the LOCKED amount; auto-accept if the
      # shortfall does not exceed the band. Boundary is inclusive (>=).
      min_acceptable = locked - round_half_up(locked * tol)
      if inspected >= min_acceptable:
          return "MATCH"                         # within tolerance (or higher): honor locked quote
      return "REQUOTE"                           # downgrade beyond tolerance but above floor
    input_set: "The single Inspection just created and the TradeIn's currently-locked Quote."
    constants:
      ROUNDING: round_half_up
      EVALUATION_ORDER: "recycle-floor check precedes tolerance-band check"
    precision: "integer cents; tolerance band rounded round_half_up; comparison boundaries: inspected <= floor (RECYCLE), inspected >= min_acceptable (MATCH)"
    variants:
      - name: recycle_branch
        when: "inspected_value_cents <= recycle_floor_value_cents"
        difference: "Outcome RECYCLE regardless of tolerance; floor check wins over tolerance."
      - name: match_branch
        when: "inspected >= locked - round_half_up(locked*tol) AND inspected > floor"
        difference: "Outcome MATCH; locked quote honored, customer paid the ORIGINAL locked amount even though inspected is lower (within tolerance)."
      - name: requote_branch
        when: "inspected < min_acceptable AND inspected > floor"
        difference: "Outcome REQUOTE; new quote minted at inspected value, requires fresh customer decision."

  - name: wallet_settlement
    trigger: "On payout creation (STORE_CREDIT) and on payout reversal"
    algorithm: aggregation
    formula: |
      # Forward (issue store-credit payout):
      #   Customer.wallet_balance_cents += Payout.amount_cents
      #   Customer.lifetime_payout_cents += Payout.amount_cents
      # Compensating (reverse store-credit payout):
      #   Customer.wallet_balance_cents -= Payout.amount_cents
      #   Customer.lifetime_payout_cents -= Payout.amount_cents
      # Invariant pinned: after any issue+reverse pair on the same payout,
      #   wallet_balance_cents and lifetime_payout_cents both return to their
      #   pre-issue values (net zero drift).
      return None
    input_set: "All ISSUED/PAID Payouts of a Customer for lifetime; the single payout for wallet on each event."
    constants: {}
    precision: "integer cents, exact"
    variants:
      - name: store_credit
        when: "Payout.method == STORE_CREDIT"
        difference: "Both wallet_balance_cents and lifetime_payout_cents move."
      - name: external_method
        when: "Payout.method in {ACH, CHECK}"
        difference: "Only lifetime_payout_cents moves; wallet_balance_cents is untouched."

# =============================================================================
# Table 4: Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - { priority: 1, category: auth, check: "X-User-Role and X-User-ID headers present and valid", error_id: ERR_UNAUTHENTICATED, http_status: 401, applies_to: "all" }
  - { priority: 2, category: auth, check: "Role permitted for this operation per RBAC matrix", error_id: ERR_FORBIDDEN, http_status: 403, applies_to: "all" }
  - { priority: 3, category: auth, check: "For Customer-owned actions, X-User-ID equals TradeIn.customer_id", error_id: ERR_NOT_OWNER, http_status: 403, applies_to: "Customer-owned trade-in actions" }
  - { priority: 4, category: existence, check: "Path-referenced resource exists, validated left-to-right", error_id: ERR_NOT_FOUND, http_status: 404, applies_to: "all /{id} routes" }
  - { priority: 5, category: existence, check: "Body FK references (customer_id, device_model_id) resolve to existing rows", error_id: ERR_FK_NOT_FOUND, http_status: 404, applies_to: "POST /trade-ins" }
  - { priority: 6, category: business_constraint, check: "Required body fields present and correctly typed; enum members valid", error_id: ERR_INVALID_REQUEST, http_status: 400, applies_to: "all writes" }
  - { priority: 7, category: state, check: "TradeIn / Quote / Payout in a state from which this transition is legal", error_id: ERR_INVALID_STATE, http_status: 409, applies_to: "all state transitions" }
  - { priority: 8, category: state, check: "OCC: expected_trade_in_version equals current TradeIn.version", error_id: ERR_STALE_VERSION, http_status: 412, applies_to: "accept-requote, decline-requote" }
  - { priority: 9, category: business_referential, check: "DeviceModel.status == ACTIVE when creating a trade-in / quote", error_id: ERR_MODEL_RETIRED, http_status: 409, applies_to: "POST /trade-ins, /quote" }
  - { priority: 10, category: business_referential, check: "Supplied promo_code resolves to an ACTIVE PromotionCampaign scoped to the device category or ALL", error_id: ERR_PROMO_INVALID, http_status: 409, applies_to: "POST /trade-ins, /quote" }
  - { priority: 11, category: business_constraint, check: "declared_defects / verified_defects are a subset of DeviceModel.defect_deductions keys", error_id: ERR_UNKNOWN_DEFECT, http_status: 422, applies_to: "/quote, /inspect" }
  - { priority: 12, category: business_temporal, check: "The TradeIn's locked Quote has not expired (current time <= lock_expires_at) at ship/receive/accept-requote", error_id: ERR_QUOTE_EXPIRED, http_status: 409, applies_to: "ship-kit, receive, accept-requote" }
  - { priority: 13, category: business_safety, check: "Before payout, if device category requires data wipe, a PASS DataWipeCertificate exists", error_id: ERR_DATA_WIPE_REQUIRED, http_status: 409, applies_to: "POST /trade-ins/{id}/payouts" }
  - { priority: 14, category: business_temporal, check: "New PromotionCampaign's half-open [effective_from, effective_to) interval must NOT overlap any existing ACTIVE campaign on the same category lane (same category_scope, or either side is ALL). Adjacency (one's effective_to == other's effective_from) is allowed (half-open, no buffer).", error_id: ERR_PROMO_WINDOW_OVERLAP, http_status: 409, applies_to: "POST /catalogs/{id}/promotion-campaigns" }
  - { priority: 15, category: business_temporal, check: "New InspectionSlot's closed interval [slot_start, slot_end] plus a 30-minute buffer on each side must NOT overlap any existing BOOKED slot on the same lane_category. Touching endpoints DO conflict (closed interval); buffer makes near-adjacent bookings collide.", error_id: ERR_SLOT_OVERLAP, http_status: 409, applies_to: "POST /catalogs/{id}/inspection-slots" }
  - { priority: 16, category: business_constraint, check: "model_code unique per catalog among non-RETIRED models; promo code / customer email / catalog uniqueness", error_id: ERR_DUPLICATE, http_status: 409, applies_to: "POST /device-models, /promotion-campaigns, /customers" }
  - { priority: 17, category: business_constraint, check: "condition_multipliers must define exactly {FLAWLESS,GOOD,FAIR,POOR}; each in [0,1]; interval ends must satisfy end > start", error_id: ERR_INVALID_MULTIPLIERS, http_status: 422, applies_to: "POST /catalogs/{id}/device-models" }

# =============================================================================
# Table 5: API Endpoint Table
# =============================================================================
endpoints:
  # ---- Catalog & config ----
  - { method: POST, path: "/catalogs", description: "Create a trade-in catalog/program", roles: [CatalogAdmin], code: 201, input: [name, "currency?", "price_lock_hours?", "requote_tolerance_pct?", data_wipe_required_categories, "recycle_floor_value_cents?"], output: Catalog, side_effects: [] }
  - { method: GET, path: "/catalogs/{id}", description: "Fetch a catalog", roles: [CatalogAdmin, FinanceOperator, GradingAgent], code: 200, input: [], output: Catalog, side_effects: [] }
  - { method: POST, path: "/catalogs/{id}/device-models", description: "Register a device model under a catalog", roles: [CatalogAdmin], code: 201, input: [manufacturer, model_code, category, base_value_cents, condition_multipliers, defect_deductions], output: DeviceModel, side_effects: ["model_code uniqueness check"] }
  - { method: GET, path: "/catalogs/{id}/device-models", description: "List device models under a catalog (reverse-reachability for DeviceModel.catalog_id)", roles: [CatalogAdmin, GradingAgent, Customer], code: 200, input: ["category?", "model_code?"], output: "DeviceModel[]", side_effects: [] }
  - { method: GET, path: "/device-models/{id}", description: "Look up a single device model by id", roles: [CatalogAdmin, GradingAgent, Customer], code: 200, input: [], output: DeviceModel, side_effects: [] }
  - { method: POST, path: "/device-models/{id}/retire", description: "Retire a device model (blocks new trade-ins)", roles: [CatalogAdmin], code: 200, input: [], output: DeviceModel, side_effects: ["DeviceModel.status -> RETIRED"] }
  - { method: POST, path: "/catalogs/{id}/promotion-campaigns", description: "Create a promotion campaign under a catalog", roles: [CatalogAdmin], code: 201, input: [code, category_scope, effective_from, effective_to, "bonus_pct?", "bonus_flat_cents?", bonus_cap_cents], output: PromotionCampaign, side_effects: ["code uniqueness check", "window-overlap check on category lane"] }
  - { method: GET, path: "/catalogs/{id}/promotion-campaigns", description: "List promotion campaigns under a catalog (reverse-reachability for PromotionCampaign.catalog_id)", roles: [CatalogAdmin, Customer], code: 200, input: ["code?", "status?"], output: "PromotionCampaign[]", side_effects: [] }
  - { method: POST, path: "/promotion-campaigns/{id}/expire", description: "Expire a promotion campaign", roles: [CatalogAdmin], code: 200, input: [], output: PromotionCampaign, side_effects: ["PromotionCampaign.status -> EXPIRED"] }
  - { method: POST, path: "/catalogs/{id}/inspection-slots", description: "Book a hub inspection slot on a category lane", roles: [GradingAgent, CatalogAdmin], code: 201, input: [lane_category, slot_start, slot_end], output: InspectionSlot, side_effects: ["buffered-overlap check on lane"] }
  - { method: GET, path: "/catalogs/{id}/inspection-slots", description: "List inspection slots under a catalog (reverse-reachability for InspectionSlot.catalog_id)", roles: [GradingAgent, CatalogAdmin], code: 200, input: ["lane_category?", "status?"], output: "InspectionSlot[]", side_effects: [] }
  - { method: POST, path: "/inspection-slots/{id}/release", description: "Release a booked inspection slot (frees its interval)", roles: [GradingAgent, CatalogAdmin], code: 200, input: [], output: InspectionSlot, side_effects: ["InspectionSlot.status -> RELEASED"] }

  # ---- Customers ----
  - { method: POST, path: "/customers", description: "Register a customer", roles: [CatalogAdmin, Customer], code: 201, input: [email, full_name], output: Customer, side_effects: [] }
  - { method: GET, path: "/customers/{id}", description: "Fetch a customer (wallet + lifetime totals)", roles: [CatalogAdmin, FinanceOperator, Customer], code: 200, input: [], output: Customer, side_effects: [] }

  # ---- Trade-in lifecycle ----
  - { method: POST, path: "/trade-ins", description: "Create a trade-in in DRAFT", roles: [Customer], code: 201, input: [customer_id, device_model_id, declared_grade, "declared_defects?", "declared_powers_on?", "promo_code?"], output: TradeIn, side_effects: ["resolve promo_code -> promotion_campaign_id"] }
  - { method: GET, path: "/trade-ins/{id}", description: "Fetch a trade-in", roles: [CatalogAdmin, FinanceOperator, GradingAgent, Customer], code: 200, input: [], output: TradeIn, side_effects: [] }
  - { method: GET, path: "/trade-ins", description: "List trade-ins (filtered-list reverse-reachability for TradeIn.customer_id, device_model_id, promotion_campaign_id)", roles: [CatalogAdmin, FinanceOperator, GradingAgent, Customer], code: 200, input: ["customer_id?", "device_model_id?", "promotion_campaign_id?", "status?"], output: "TradeIn[]", side_effects: [] }
  - { method: POST, path: "/trade-ins/{id}/quote", description: "Generate and lock the initial quote (DRAFT->QUOTED)", roles: [Customer], code: 200, input: [], output: TradeIn, side_effects: ["create LOCKED INITIAL Quote", "set locked_quote_id", "increments TradeIn.version by 1"] }
  - { method: POST, path: "/trade-ins/{id}/ship-kit", description: "Dispatch shipping kit/label (QUOTED->KIT_SENT)", roles: [Customer], code: 200, input: [], output: TradeIn, side_effects: ["create ShippingKit", "increments TradeIn.version by 1"] }
  - { method: POST, path: "/trade-ins/{id}/receive", description: "Mark device received at hub (KIT_SENT->RECEIVED)", roles: [GradingAgent], code: 200, input: [], output: TradeIn, side_effects: ["ShippingKit.status -> DELIVERED_TO_HUB", "increments TradeIn.version by 1"] }
  - { method: POST, path: "/trade-ins/{id}/inspect", description: "Submit inspection findings; forks to ACCEPTED / REQUOTED / RECYCLED (RECEIVED->INSPECTED->branch)", roles: [GradingAgent], code: 200, input: [verified_grade, "verified_defects?", verified_powers_on], output: TradeIn, side_effects: ["create Inspection", "compute inspected_value + outcome", "fork side-effects per outcome", "increments TradeIn.version by 1"] }
  - { method: POST, path: "/trade-ins/{id}/reinspect", description: "Grading agent revises verified findings while in REQUOTED; mints a fresh REQUOTE quote superseding the prior (REQUOTED->REQUOTED self-loop)", roles: [GradingAgent], code: 200, input: [verified_grade, "verified_defects?", verified_powers_on], output: TradeIn, side_effects: ["create second Inspection", "supersede current REQUOTE quote", "create new LOCKED REQUOTE quote", "increments TradeIn.version by 1"] }
  - { method: POST, path: "/trade-ins/{id}/accept-requote", description: "Customer accepts the re-quote (REQUOTED->ACCEPTED)", roles: [Customer], code: 200, input: [expected_trade_in_version], output: TradeIn, side_effects: ["REQUOTE Quote -> HONORED", "set final_value_cents", "increments TradeIn.version by 1"] }
  - { method: POST, path: "/trade-ins/{id}/decline-requote", description: "Customer declines the re-quote; device returned (REQUOTED->REJECTED)", roles: [Customer], code: 200, input: [expected_trade_in_version], output: TradeIn, side_effects: ["REQUOTE Quote -> SUPERSEDED", "create RETURN_TO_CUSTOMER DispositionRecord", "increments TradeIn.version by 1"] }
  - { method: POST, path: "/trade-ins/{id}/cancel", description: "Cancel a trade-in before shipment (DRAFT/QUOTED->CANCELLED)", roles: [Customer], code: 200, input: [], output: TradeIn, side_effects: ["supersede locked Quote if any", "increments TradeIn.version by 1"] }
  - { method: POST, path: "/trade-ins/{id}/sweep-expiry", description: "System sweep: expire trade-ins whose locked quote lock_expires_at has passed", roles: [CatalogAdmin], code: 200, input: [], output: TradeIn, side_effects: ["TradeIn -> EXPIRED", "locked Quote -> EXPIRED", "increments TradeIn.version by 1"] }

  # ---- Child resources & reads ----
  - { method: GET, path: "/trade-ins/{id}/quotes", description: "List quotes for a trade-in (reverse-reachability for Quote.trade_in_id)", roles: [CatalogAdmin, FinanceOperator, GradingAgent, Customer], code: 200, input: [], output: "Quote[]", side_effects: [] }
  - { method: GET, path: "/trade-ins/{id}/shipping-kits", description: "List shipping kits for a trade-in (reverse-reachability for ShippingKit.trade_in_id)", roles: [CatalogAdmin, GradingAgent, Customer], code: 200, input: [], output: "ShippingKit[]", side_effects: [] }
  - { method: GET, path: "/trade-ins/{id}/inspections", description: "List inspections for a trade-in (reverse-reachability for Inspection.trade_in_id)", roles: [CatalogAdmin, FinanceOperator, GradingAgent, Customer], code: 200, input: [], output: "Inspection[]", side_effects: [] }
  - { method: POST, path: "/trade-ins/{id}/data-wipe", description: "Record a data-wipe certificate for the received device", roles: [GradingAgent], code: 201, input: [method, result], output: DataWipeCertificate, side_effects: ["mint certificate_serial"] }
  - { method: GET, path: "/trade-ins/{id}/data-wipe-certificates", description: "List data-wipe certificates (reverse-reachability for DataWipeCertificate.trade_in_id)", roles: [CatalogAdmin, FinanceOperator, GradingAgent, Customer], code: 200, input: [], output: "DataWipeCertificate[]", side_effects: [] }
  - { method: POST, path: "/trade-ins/{id}/payouts", description: "Issue payout (ACCEPTED->PAID)", roles: [FinanceOperator], code: 201, input: [method], output: Payout, side_effects: ["create PAID Payout", "wallet/lifetime settlement", "create REFURBISH_INVENTORY DispositionRecord", "increments TradeIn.version by 1"] }
  - { method: GET, path: "/trade-ins/{id}/payouts", description: "List payouts for a trade-in (reverse-reachability for Payout.trade_in_id)", roles: [CatalogAdmin, FinanceOperator, Customer], code: 200, input: [], output: "Payout[]", side_effects: [] }
  - { method: GET, path: "/payouts/{id}", description: "Fetch a single payout", roles: [CatalogAdmin, FinanceOperator, Customer], code: 200, input: [], output: Payout, side_effects: [] }
  - { method: POST, path: "/trade-ins/{id}/payouts/{payoutId}/reverse", description: "Reverse a payout (compensation)", roles: [FinanceOperator], code: 200, input: [], output: Payout, side_effects: ["Payout -> REVERSED", "wallet/lifetime reversal"] }
  - { method: GET, path: "/trade-ins/{id}/disposition-records", description: "List disposition records (reverse-reachability for DispositionRecord.trade_in_id)", roles: [CatalogAdmin, GradingAgent, Customer], code: 200, input: [], output: "DispositionRecord[]", side_effects: [] }
  - { method: GET, path: "/customers/{id}/trade-ins", description: "List a customer's trade-ins (reverse-reachability for Payout.customer_id via trade-in)", roles: [CatalogAdmin, FinanceOperator, Customer], code: 200, input: [], output: "TradeIn[]", side_effects: [] }

  # ---- Test-driving endpoint (outside public business surface) ----
  - { method: POST, path: "/_clock/set_current_utc", description: "Set the server's current UTC instant (drives price-lock expiry, promo windows, slot timing deterministically)", roles: [CatalogAdmin], code: 200, input: [to_iso8601], output: "{ current_utc: string }", side_effects: ["server clock set to to_iso8601"] }

# =============================================================================
# Table 6: Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "Missing/invalid X-User-Role or X-User-ID header" }
  - { id: ERR_FORBIDDEN, http: 403, condition: "Role not permitted for this operation" }
  - { id: ERR_NOT_OWNER, http: 403, condition: "Customer X-User-ID does not match the trade-in's customer_id" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Path-referenced resource does not exist" }
  - { id: ERR_FK_NOT_FOUND, http: 404, condition: "Body FK reference (customer_id / device_model_id) does not resolve" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Missing required field, bad type, or invalid enum member" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Resource not in a legal state for the requested transition" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_trade_in_version does not equal current TradeIn.version (OCC)" }
  - { id: ERR_MODEL_RETIRED, http: 409, condition: "DeviceModel.status is RETIRED at trade-in/quote time" }
  - { id: ERR_PROMO_INVALID, http: 409, condition: "Promo code missing, not ACTIVE, or out of category scope" }
  - { id: ERR_UNKNOWN_DEFECT, http: 422, condition: "Declared/verified defect not in DeviceModel.defect_deductions keys" }
  - { id: ERR_QUOTE_EXPIRED, http: 409, condition: "Locked quote's lock_expires_at has passed" }
  - { id: ERR_DATA_WIPE_REQUIRED, http: 409, condition: "Payout attempted on a wipe-required category without a PASS DataWipeCertificate" }
  - { id: ERR_DUPLICATE, http: 409, condition: "Uniqueness violation: model_code, promo code, customer email, or catalog name" }
  - { id: ERR_INVALID_MULTIPLIERS, http: 422, condition: "condition_multipliers do not cover exactly {FLAWLESS,GOOD,FAIR,POOR} in [0,1], or an interval end is not strictly after its start" }
  - { id: ERR_PROMO_WINDOW_OVERLAP, http: 409, condition: "New promo campaign's [effective_from, effective_to) overlaps an existing ACTIVE campaign on the same category lane" }
  - { id: ERR_SLOT_OVERLAP, http: 409, condition: "New inspection slot's buffered closed interval overlaps an existing BOOKED slot on the same lane_category" }

# =============================================================================
# Table 7: RBAC Matrix
# =============================================================================
roles:
  - name: CatalogAdmin
    description: "Manages catalogs, device models, promotions; runs the expiry sweep"
    identity: "opaque"
    exclusive_operations:
      - "POST /catalogs"
      - "POST /catalogs/{id}/device-models"
      - "POST /device-models/{id}/retire"
      - "POST /catalogs/{id}/promotion-campaigns"
      - "POST /promotion-campaigns/{id}/expire"
      - "POST /trade-ins/{id}/sweep-expiry"
    shared_operations:
      - "POST /customers"
      - "GET reads on catalogs, device-models, promotions, customers, trade-ins and their children"
  - name: Customer
    description: "Owns their own trade-ins; drives quote/ship/accept/decline/cancel"
    identity: "entity_backed:Customer"
    exclusive_operations:
      - "POST /trade-ins"
      - "POST /trade-ins/{id}/quote"
      - "POST /trade-ins/{id}/ship-kit"
      - "POST /trade-ins/{id}/accept-requote"
      - "POST /trade-ins/{id}/decline-requote"
      - "POST /trade-ins/{id}/cancel"
    shared_operations:
      - "POST /customers (self-registration)"
      - "GET reads on own trade-ins and their children, device-models, promotions"
  - name: GradingAgent
    description: "Receives, inspects, and certifies data-wipe of incoming devices"
    identity: "opaque"
    exclusive_operations:
      - "POST /trade-ins/{id}/receive"
      - "POST /trade-ins/{id}/inspect"
      - "POST /trade-ins/{id}/data-wipe"
    shared_operations:
      - "GET reads on trade-ins, inspections, device-models"
  - name: FinanceOperator
    description: "Issues and reverses payouts"
    identity: "opaque"
    exclusive_operations:
      - "POST /trade-ins/{id}/payouts"
      - "POST /trade-ins/{id}/payouts/{payoutId}/reverse"
    shared_operations:
      - "GET reads on trade-ins, payouts, customers"
