            - "The stranger's review request: HTTP 403 with data.error_id == \"ERR_NOT_RESOURCE_OWNER\"."
            - "The stranger's cure: HTTP 403 with data.error_id == \"ERR_NOT_RESOURCE_OWNER\", not ERR_SCHEDULE_NOT_ACTIVE."
            - "The OWNER's identical payment: HTTP 409 with data.error_id == \"ERR_INSTALLMENT_NOT_PAYABLE\", which is the proof that priority 6 ran ahead of priority 8 for the stranger."
            - "GET /liability-assessments/${la_id} still reports review_status == \"NONE\" and collection_status == \"NOT_YET_DUE\"."

      - name: the_trustee_who_issued_the_demand_cannot_decide_its_review
        claim_type: Segregation of duties
        grounds:
          - "validations[priority=9]"
          - "errors[ERR_SEGREGATION_OF_DUTIES]"
          - "complexity_profile.role_model"
        distinguishing_aspect: |
          Two distinct segregation pairs exist in this design - certifier versus issuer, and
          issuer versus review decider - and they compare against different stored ids. A
          server that implements only the first one lets the trustee who demanded payment
          adjudicate the employer's objection to it, which is the exact conflict ERISA
          §4219 review is meant to avoid.
