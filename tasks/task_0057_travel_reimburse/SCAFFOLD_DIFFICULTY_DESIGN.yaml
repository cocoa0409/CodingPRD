scaffold_difficulty_design:

  # =========================================================================
  # Rule 1 — Dual-variant calculations across different entity domains
  # =========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: reimbursable_amount_forward_vs_final_diverges_when_standard_version_changes
        grounds:
          - calculations.reimbursable_amount_per_item__forward_estimate
          - calculations.reimbursable_amount_per_item__chronological_final
          - entities.TravelApplication.fields.standard_version_pinned
          - entities.ExpenseStandard.fields.effective_from
        distinguishing_aspect: |
          Operates on the ReimbursementForm cost-accounting domain. The forward-looking variant uses the
          ExpenseStandard row currently active at GET-projection time, while the chronological final
          variant uses the version PINNED on the parent TravelApplication at submit time; therefore
          GET /travel-applications/{id}/budget-projection and POST /reimbursement-forms/{id}/submit
          produce strictly different total_reimbursable values for the SAME items when a new
          ExpenseStandard version was published between application submit and form submit.
        test_recipe:
          setup:
            - "Admin creates ExpenseStandard v1: (TIER_2, STAFF, lodging_daily_cap=400, per_diem=80, transportation_daily_cap=120, holiday_multiplier=1.0), effective_from=t0."
            - "Admin POST /employees -> e1 (STAFF, supervisor=e_sup)."
            - "Applicant e1 POST /travel-applications (destination_tier=TIER_2, scope=DOMESTIC, estimated_budget=2000, planned_start=t0+1d, planned_end=t0+4d)."
            - "Applicant submits the application (pins standard_version=1)."
            - "Approve through chain (SUPERVISOR, FINANCE). Application reaches APPROVED."
            - "Applicant books one HOTEL ItinerarySegment (covered_days=3, cost=1350, option_code seeded as eligible for STAFF/HOTEL)."
            - "Applicant POST /travel-applications/{id}/complete (after /_clock/advance past planned_end)."
            - "Admin creates ExpenseStandard v2: same key (TIER_2, STAFF) but lodging_daily_cap=500, effective_from=t0+5d. (Auto-closes v1 for that (city_tier,employee_level).)"
            - "Applicant POST /reimbursement-forms (application_id), uploads matching invoice (amount=1350), runs OCR + tax-verify, attaches as a LODGING item with covered_days=3 claimed_amount=1350."
          trigger:
            - "GET /travel-applications/{appId}/budget-projection (forward variant — uses v2)."
            - "POST /reimbursement-forms/{formId}/submit (chronological-final variant — uses pinned v1)."
          assert:
            - "Forward projection reports projected_reimbursable for the LODGING segment = min(1350, 500*3) = 1350.00."
            - "After form submit: ReimbursementItem.standard_cap_applied == 1200.00 (= 400 * 3)."
            - "After form submit: ReimbursementForm.total_reimbursable == 1200.00."
            - "After form submit: ReimbursementForm.total_self_paid == 150.00."

      - name: total_booked_cost_estimate_vs_actual_diverges_on_segment_change
        grounds:
          - calculations.total_booked_cost
          - state_machines.TravelApplication.BOOKING_LOCKED_to_BOOKING_LOCKED
          - entities.ItinerarySegment.fields.status
          - entities.ItinerarySegment.fields.prior_segment_id
        distinguishing_aspect: |
          Operates on the TravelApplication budget-allocation domain (different entity from the
          reimbursement domain above). The aggregation iterates only over status==ACTIVE segments;
          a CHANGE transition flips the old row to CHANGED and inserts a new ACTIVE row, so the
          provisional sum (snapshot before /change) and the final sum (after /change) diverge by
          the cost delta even though the same physical trip is being booked. A naive implementation
          that sums all rows ignoring status will produce a sum equal to old.cost + new.cost.
        test_recipe:
          setup:
            - "Set up applicant + APPROVED application with estimated_budget=2000 as in the previous recipe."
            - "Book first FLIGHT segment cost=500.00 (ACTIVE)."
          trigger:
            - "GET /travel-applications/{id} — read total_booked_cost (snapshot)."
            - "POST /travel-applications/{id}/itineraries/{segId}/change with cost=700.00."
            - "GET /travel-applications/{id} — read total_booked_cost (final)."
          assert:
            - "Snapshot total_booked_cost == 500.00."
            - "Final total_booked_cost == 700.00 (old CHANGED row excluded; new ACTIVE included)."
            - "ItinerarySegment count under application == 2 (one CHANGED, one ACTIVE); new row's prior_segment_id == old.id."

  # =========================================================================
  # Rule 2 — Combinatorial formulas across different modes (need 2 different modes)
  # =========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: required_chain_combinatorial_inputs_mode_a
        grounds:
          - calculations.travel_application_required_chain
          - entities.TravelApplication.fields.estimated_budget
          - entities.TravelApplication.fields.travel_scope
          - entities.TravelApplication.fields.urgent
        distinguishing_aspect: |
          Mode (a): a formula with 3 inputs (estimated_budget, travel_scope, urgent) and non-linear
          interaction — DEPT_HEAD is added by either a numeric-threshold branch (budget>5000) OR a
          scope branch (OVERSEAS), GM is added by either threshold (budget>30000) OR scope (OVERSEAS),
          and urgent removes DEPT_HEAD only when scope==DOMESTIC. Two budget points with identical
          scope can produce different chain lengths, and one urgent flag can shrink or fail to shrink
          the chain depending on scope — i.e., the inputs interact non-linearly.
        test_recipe:
          setup:
            - "Three applicants e_a, e_b, e_c all STAFF with the same supervisor."
            - "Each submits a travel application:"
            - "  app_a: estimated_budget=4500, scope=DOMESTIC, urgent=false."
            - "  app_b: estimated_budget=10000, scope=DOMESTIC, urgent=true."
            - "  app_c: estimated_budget=4500, scope=OVERSEAS, urgent=true."
          trigger:
            - "POST /travel-applications/{id}/submit for app_a, app_b, app_c."
          assert:
            - "app_a.required_chain == ['SUPERVISOR', 'FINANCE']."
            - "app_b.required_chain == ['SUPERVISOR', 'FINANCE']  # urgent removes DEPT_HEAD when DOMESTIC."
            - "app_c.required_chain == ['SUPERVISOR', 'DEPT_HEAD', 'FINANCE', 'GM']  # OVERSEAS forces full chain; urgent does NOT strip DEPT_HEAD when OVERSEAS."

      - name: reimbursable_per_item_rounding_order_mode_b
        grounds:
          - calculations.reimbursable_amount_per_item__chronological_final
          - entities.ReimbursementItem.fields.reimbursable_amount
          - entities.ReimbursementForm.fields.total_reimbursable
        distinguishing_aspect: |
          Mode (b): nested rounding where order matters. The scaffold pins "per-item round to 2dp,
          THEN sum form totals" — not "sum then round". With three TRANSPORTATION items at
          claimed_amount=33.335 each (per-unit cap > claim, so reimbursable=claim), per-item rounding
          yields 33.34 each and total 100.02; sum-then-round would yield 100.01 (= round(100.005,2)
          with banker's rounding = 100.00, or 100.01 with round_half_up). The two orders differ.
        test_recipe:
          setup:
            - "Standard STAFF/TIER_1 with transportation_daily_cap=200 (cap will not bind)."
            - "Application submitted, approved, with 3 separate FLIGHT segments (different days), each cost 33.335 (test harness allows fractional inputs)."
            - "Form created, three TRANSPORTATION ReimbursementItems each (covered_days=1, claimed_amount=33.335) attached to the three flight segments respectively."
          trigger:
            - "POST /reimbursement-forms/{id}/submit."
          assert:
            - "Each ReimbursementItem.reimbursable_amount == 33.34 (per-item round_half_up)."
            - "ReimbursementForm.total_reimbursable == 100.02 (sum AFTER per-item rounding)."
            - "ReimbursementForm.total_reimbursable != 100.01."

  # =========================================================================
  # Rule 3 — Non-linear state-machine shape on different entities
  # =========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: reimbursement_form_revision_cycle
        grounds:
          - state_machines.ReimbursementForm.SUPERVISOR_APPROVED_to_DRAFT
          - state_machines.ReimbursementForm.DEPT_APPROVED_to_DRAFT
          - state_machines.ReimbursementForm.FINANCE_APPROVED_to_DRAFT
          - entities.ReimbursementForm.fields.correction_round
        distinguishing_aspect: |
          ReimbursementForm exhibits a CYCLE: DRAFT -> SUBMITTED -> SUPERVISOR_APPROVED ->
          (reject with correction=true) -> DRAFT -> SUBMITTED -> ... The correction_round counter
          increments on every revert, proving the cycle is taken multiple times. This is a non-linear
          (cyclic) shape distinct from any linear pipeline.
        test_recipe:
          setup:
            - "Build an APPROVED travel application with one segment and one TAX_VERIFIED invoice."
            - "Create form, attach item, submit, get supervisor approval (form in SUPERVISOR_APPROVED)."
          trigger:
            - "POST /reimbursement-forms/{id}/reject with correction=true (as DEPT_HEAD)."
            - "POST /reimbursement-forms/{id}/submit again."
            - "POST /reimbursement-forms/{id}/approve as SUPERVISOR."
            - "POST /reimbursement-forms/{id}/reject with correction=true again (as DEPT_HEAD)."
          assert:
            - "After first reject: form.status == 'DRAFT', form.correction_round == 1."
            - "After second submit: form.status == 'SUBMITTED'."
            - "After second supervisor approve: form.status == 'SUPERVISOR_APPROVED'."
            - "After second reject-with-correction: form.status == 'DRAFT', form.correction_round == 2."

      - name: travel_application_branching_chain
        grounds:
          - state_machines.TravelApplication.SUPERVISOR_APPROVED_to_DEPT_HEAD_APPROVED
          - state_machines.TravelApplication.SUPERVISOR_APPROVED_to_FINANCE_APPROVED
          - state_machines.TravelApplication.FINANCE_APPROVED_to_GM_APPROVED
          - state_machines.TravelApplication.FINANCE_APPROVED_to_APPROVED
        distinguishing_aspect: |
          TravelApplication exhibits BRANCHING fork shape on a DIFFERENT entity from the cyclic
          ReimbursementForm above: SUPERVISOR_APPROVED has two outgoing edges (to DEPT_HEAD_APPROVED
          or directly to FINANCE_APPROVED depending on whether DEPT_HEAD is in required_chain), and
          FINANCE_APPROVED branches to either GM_APPROVED or APPROVED based on chain composition.
          The branch taken is selected by the pinned required_chain — branching is non-linear.
        test_recipe:
          setup:
            - "Two applications under the same applicant:"
            - "  app_x: estimated_budget=4500, scope=DOMESTIC (chain=[SUPERVISOR, FINANCE])."
            - "  app_y: estimated_budget=50000, scope=DOMESTIC (chain=[SUPERVISOR, DEPT_HEAD, FINANCE, GM])."
            - "Both submitted, supervisor-approved."
          trigger:
            - "POST /travel-applications/{app_x_id}/approve as FINANCE."
            - "POST /travel-applications/{app_y_id}/approve as DEPT_HEAD, then FINANCE, then GM."
          assert:
            - "After app_x FINANCE-approve: app_x.status == 'APPROVED' (skipped DEPT_HEAD and GM)."
            - "After app_y DEPT_HEAD-approve: app_y.status == 'DEPT_HEAD_APPROVED'."
            - "After app_y FINANCE-approve: app_y.status == 'FINANCE_APPROVED'."
            - "After app_y GM-approve: app_y.status == 'APPROVED' (via GM_APPROVED auto-transition)."

  # =========================================================================
  # Rule 4 — Transitive cascade chains from different triggers
  # =========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: payment_success_cascades_form_then_invoices_depth_three
        grounds:
          - state_machines.Payment.EXECUTING_to_SUCCESS
          - state_machines.ReimbursementForm.APPROVED_to_PAID
          - state_machines.Invoice.ATTACHED_to_CONSUMED
        distinguishing_aspect: |
          Triggered by POST /payments/{id}/result with outcome=SUCCESS. Depth-3 chain:
          (1) Payment EXECUTING -> SUCCESS sets external_ref. (2) That transition CAUSES (not the
          original action) the parent ReimbursementForm APPROVED -> PAID. (3) ReimbursementForm
          PAID transition CAUSES every attached Invoice ATTACHED -> CONSUMED. Each link is caused
          by the previous link, not by the original API call.
        test_recipe:
          setup:
            - "Build APPROVED reimbursement form with two attached invoices."
            - "POST /payments/batches -> creates Payment in PENDING."
            - "POST /payments/{id}/execute -> Payment in EXECUTING."
          trigger:
            - "POST /payments/{id}/result with outcome='SUCCESS', external_ref='BANK-REF-001'."
          assert:
            - "Payment.status == 'SUCCESS' and Payment.external_ref == 'BANK-REF-001'."
            - "ReimbursementForm.status == 'PAID' (cascade hop 2)."
            - "Both attached Invoices have ocr_status == 'CONSUMED' (cascade hop 3)."
            - "AuditLog has at least one PAYMENT_EVENT entry tied to form_id."

      - name: form_reject_with_correction_cascades_invoice_revert_depth_two
        grounds:
          - state_machines.ReimbursementForm.SUPERVISOR_APPROVED_to_DRAFT
          - state_machines.Invoice.ATTACHED_to_TAX_VERIFIED
          - entities.ReimbursementForm.fields.correction_round
        distinguishing_aspect: |
          Different triggering transition (form reject-with-correction, NOT payment success) drives
          a depth-2 cascade on a different propagation pattern: (1) Form SUPERVISOR_APPROVED -> DRAFT,
          which itself triggers (2) every attached Invoice ATTACHED -> TAX_VERIFIED. The Invoice
          revert is caused by the Form revert, not by the original API call.
        test_recipe:
          setup:
            - "Build form with two attached invoices, submitted, supervisor-approved."
          trigger:
            - "POST /reimbursement-forms/{id}/reject with correction=true (as DEPT_HEAD), rejection_reason='need receipts'."
          assert:
            - "ReimbursementForm.status == 'DRAFT', correction_round == 1 (hop 1)."
            - "Both invoices: ocr_status == 'TAX_VERIFIED' (hop 2)."

  # =========================================================================
  # Rule 5 — Validation priority conflicts across different error-category pairs
  # =========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: state_vs_business_safety_dual_failure
        grounds:
          - validations[priority=5]
          - validations[priority=6]
          - errors.ERR_INVALID_STATE
          - errors.ERR_NOT_CURRENT_APPROVER
        distinguishing_aspect: |
          state vs business_safety pair: a request to approve a TravelApplication that is BOTH
          (a) already in REJECTED (state precondition fails) AND (b) sent by the wrong-role actor
          (chain step does not match actor's role). Per priority ordering, state (priority 5) MUST
          win over business_safety (priority 6); the response error_id MUST be ERR_INVALID_STATE,
          not ERR_NOT_CURRENT_APPROVER.
        test_recipe:
          setup:
            - "Build a TravelApplication, submit, then have the correct supervisor REJECT it (status=REJECTED)."
          trigger:
            - "POST /travel-applications/{id}/approve as DeptHead (acting role does NOT match chain step) on the REJECTED application."
          assert:
            - "Response http_status == 409 and error_id == 'ERR_INVALID_STATE' (state wins over business_safety)."

      - name: business_safety_vs_business_fiscal_dual_failure
        grounds:
          - validations[priority=6]
          - validations[priority=15]
          - errors.ERR_NOT_CURRENT_APPROVER
          - errors.ERR_GM_APPROVAL_REQUIRED
        distinguishing_aspect: |
          Different error-category pair from the previous instance: business_safety (priority 6)
          vs business_fiscal (priority 15). A form in FINANCE_APPROVED with requires_special_approval==true
          gets an approve call from a SUPERVISOR (wrong chain step) — both checks fail; per priority
          ordering, ERR_NOT_CURRENT_APPROVER (priority 6) MUST win over ERR_GM_APPROVAL_REQUIRED
          (priority 15).
        test_recipe:
          setup:
            - "Build a form whose total_self_paid > 0 (requires_special_approval=true), approve through SUPERVISOR, DEPT_HEAD, FINANCE so it sits in FINANCE_APPROVED."
          trigger:
            - "POST /reimbursement-forms/{id}/approve as SUPERVISOR (wrong role; current step expects GM)."
          assert:
            - "Response http_status == 403 and error_id == 'ERR_NOT_CURRENT_APPROVER' (safety wins over fiscal)."

  # =========================================================================
  # Rule 6 — Boundary-precision checks on different metrics/endpoints
  # =========================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: budget_overrun_factor_exact_boundary
        grounds:
          - calculations.total_booked_cost
          - errors.ERR_BUDGET_OVERRUN
          - validations[priority=14]
        distinguishing_aspect: |
          Numeric threshold metric on POST /travel-applications/{id}/itineraries. The check is
          total_booked_cost <= estimated_budget * 1.20. With estimated_budget=1000, the cap is
          exactly 1200.00. A booking that brings the sum to exactly 1200.00 MUST succeed; a
          booking that brings it to 1200.01 MUST reject — distinguishes <= from <.
        test_recipe:
          setup:
            - "Application with estimated_budget=1000, APPROVED."
            - "First HOTEL segment booked with cost=900.00 (total_booked_cost=900.00)."
          trigger:
            - "POST /travel-applications/{id}/itineraries with cost=300.00 (would bring total to exactly 1200.00)."
            - "POST /travel-applications/{id}/itineraries with cost=0.01 on a separate test (would bring total to 1200.01)."
          assert:
            - "First call returns 201 and TravelApplication.total_booked_cost == 1200.00."
            - "Second call returns 422 with error_id == 'ERR_BUDGET_OVERRUN'; total_booked_cost remains 1200.00."

      - name: payment_batch_empty_set_boundary
        grounds:
          - calculations.payment_batch_amount
          - errors.ERR_INVALID_BATCH
          - endpoints.POST_/payments/batches
        distinguishing_aspect: |
          Empty-collection edge on a DIFFERENT endpoint and DIFFERENT metric (collection-size, not
          numeric threshold): POST /payments/batches with form_ids=[] MUST reject with
          ERR_INVALID_BATCH; with one valid APPROVED form, MUST succeed and create exactly one
          Payment. This pins the zero-count behavior of a list input.
        test_recipe:
          setup:
            - "Build one ReimbursementForm in APPROVED with total_reimbursable=500.00."
          trigger:
            - "POST /payments/batches with form_ids=[] channel='BANK_TRANSFER' (empty batch)."
            - "POST /payments/batches with form_ids=[the_one_form_id] channel='BANK_TRANSFER' (size-1 batch)."
          assert:
            - "First call returns 422 with error_id == 'ERR_INVALID_BATCH'."
            - "Second call returns 201; exactly one Payment created with amount == 500.00 and status == 'PENDING'."

  # =========================================================================
  # Rule 7 — Cross-entity state dependencies across different entity pairs
  # =========================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: reimbursement_form_submit_depends_on_travel_application_state
        grounds:
          - state_machines.ReimbursementForm.DRAFT_to_SUBMITTED
          - entities.TravelApplication.fields.status
          - errors.ERR_INVALID_STATE
        distinguishing_aspect: |
          Cross-entity pair: ReimbursementForm <-> TravelApplication. ReimbursementForm can move
          DRAFT -> SUBMITTED only if its parent TravelApplication.status is in {BOOKING_LOCKED, COMPLETED}.
          Submitting a form whose parent application is still in APPROVED (no bookings yet) MUST fail.
        test_recipe:
          setup:
            - "Application APPROVED but with NO itinerary segments booked yet."
            - "Create reimbursement form bound to this application; attach one item with a TAX_VERIFIED invoice."
          trigger:
            - "POST /reimbursement-forms/{id}/submit."
          assert:
            - "Response http_status == 409 and error_id == 'ERR_INVALID_STATE'."
            - "ReimbursementForm.status remains 'DRAFT'."

      - name: invoice_attach_depends_on_invoice_state
        grounds:
          - state_machines.Invoice.OCR_RECOGNIZED_to_TAX_VERIFIED
          - state_machines.Invoice.TAX_VERIFIED_to_ATTACHED
          - errors.ERR_INVOICE_NOT_VERIFIED
          - validations[priority=13]
        distinguishing_aspect: |
          Different entity pair: ReimbursementItem (under ReimbursementForm) <-> Invoice. Attaching
          a ReimbursementItem requires the referenced Invoice.ocr_status == TAX_VERIFIED; an Invoice
          still in OCR_RECOGNIZED (tax verification not yet run) MUST be rejected with
          ERR_INVOICE_NOT_VERIFIED. Distinct from the form-vs-application dependency above.
        test_recipe:
          setup:
            - "Application APPROVED with one HOTEL segment booked."
            - "Form created in DRAFT."
            - "Invoice uploaded and OCR run; invoice now in OCR_RECOGNIZED (tax-verify NOT called)."
          trigger:
            - "POST /reimbursement-forms/{id}/items with invoice_id=that_invoice category='LODGING' covered_days=1 claimed_amount=500.00 matched_segment_id=segId."
          assert:
            - "Response http_status == 422 and error_id == 'ERR_INVOICE_NOT_VERIFIED'."
            - "Invoice.ocr_status remains 'OCR_RECOGNIZED'."

  # =========================================================================
  # Rule 8 — Resource temporal-overlap conflicts across different interval semantics
  # =========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: transportation_segments_closed_interval_overlap
        grounds:
          - validations[priority=9]
          - errors.ERR_SEGMENT_TIME_OVERLAP
          - entities.ItinerarySegment.fields.segment_type
        distinguishing_aspect: |
          On the ItinerarySegment resource for segment_type in {FLIGHT, TRAIN, CAR}: the interval
          semantics are CLOSED-CLOSED with adjacency permitted (one ends exactly when the next
          begins). Two segments where seg1.end_at == seg2.start_at MUST be allowed; two segments
          with strict overlap (seg2.start_at < seg1.end_at) MUST be rejected. This pins the
          "touching endpoints OK, strict overlap NOT OK" geometry.
        test_recipe:
          setup:
            - "Application APPROVED. First FLIGHT segment: start=10:00, end=12:00, cost=100.00, eligible option."
          trigger:
            - "POST a TRAIN segment start=12:00, end=15:00 (adjacency)."
            - "POST a TRAIN segment start=11:30, end=15:00 (strict overlap with first FLIGHT)."
          assert:
            - "First POST succeeds (status 201)."
            - "Second POST returns 422 with error_id == 'ERR_SEGMENT_TIME_OVERLAP'."

      - name: hotel_segments_half_open_night_overlap
        grounds:
          - validations[priority=10]
          - errors.ERR_HOTEL_NIGHT_OVERLAP
          - entities.ItinerarySegment.fields.segment_type
        distinguishing_aspect: |
          DIFFERENT resource subtype (HOTEL) with DIFFERENT interval geometry: HOTEL nights use
          HALF-OPEN [start_at, end_at) semantics — checkout day MAY equal next-stay check-in day
          (no overlap because checkout instant is excluded from the first stay). Two HOTEL stays
          whose end_at and start_at coincide at midnight MUST be allowed; any non-zero overlap
          MUST reject. This is structurally different from the closed-closed transportation rule.
        test_recipe:
          setup:
            - "Application APPROVED. First HOTEL segment: start=2025-06-01T15:00Z, end=2025-06-03T11:00Z."
          trigger:
            - "POST a second HOTEL segment start=2025-06-03T11:00Z, end=2025-06-05T11:00Z (touching at end)."
            - "POST a third HOTEL segment start=2025-06-03T10:59Z, end=2025-06-05T11:00Z (1-minute overlap)."
          assert:
            - "Second POST succeeds (status 201) — half-open touching is allowed."
            - "Third POST returns 422 with error_id == 'ERR_HOTEL_NIGHT_OVERLAP'."

  # =========================================================================
  # Rule 9 — Compensating-action invariants across different conserved quantities
  # =========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: segment_change_preserves_count_of_active_segments
        grounds:
          - state_machines.TravelApplication.BOOKING_LOCKED_to_BOOKING_LOCKED
          - entities.ItinerarySegment.fields.status
          - calculations.total_booked_cost
        distinguishing_aspect: |
          Conserved quantity #1 (a COUNT): count of ItinerarySegments with status==ACTIVE under a
          given application. POST /change is a "swap" (mark old CHANGED, insert new ACTIVE), so the
          ACTIVE-count invariant MUST hold: count_active(app) before == count_active(app) after.
          Pinned formula: count(seg for seg in segments where seg.application_id==app.id and seg.status=='ACTIVE').
        test_recipe:
          setup:
            - "Application APPROVED with two ACTIVE segments: seg1 (FLIGHT, cost=500), seg2 (HOTEL, cost=300)."
          trigger:
            - "POST /travel-applications/{id}/itineraries/{seg1_id}/change with new cost=600 (compatible time window)."
          assert:
            - "Count of ItinerarySegments where application_id==app.id AND status=='ACTIVE' before change == 2."
            - "Count of ItinerarySegments where application_id==app.id AND status=='ACTIVE' after  change == 2."
            - "Old seg1 status == 'CHANGED'; the newly inserted row has status == 'ACTIVE' and prior_segment_id == seg1.id."

      - name: form_reject_correct_resubmit_preserves_invoice_attach_count
        grounds:
          - state_machines.ReimbursementForm.SUPERVISOR_APPROVED_to_DRAFT
          - state_machines.Invoice.ATTACHED_to_TAX_VERIFIED
          - state_machines.ReimbursementForm.DRAFT_to_SUBMITTED
        distinguishing_aspect: |
          Conserved quantity #2 of a DIFFERENT type (a SUM, namely the total claimed across attached
          invoices): when a form is rejected-with-correction and then resubmitted with the same
          ReimbursementItems, sum(item.claimed_amount for item in items_of(form)) MUST be identical
          before reject and after resubmit (the compensating ATTACHED->TAX_VERIFIED on reject is
          matched by TAX_VERIFIED->ATTACHED on resubmit; no money "leaks"). Distinct conserved
          quantity from the count above.
        test_recipe:
          setup:
            - "Form with two items: item_a claimed=600.00, item_b claimed=400.00. Both invoices ATTACHED."
            - "Form submitted, supervisor-approved."
          trigger:
            - "POST /reimbursement-forms/{id}/reject with correction=true (as DEPT_HEAD)."
            - "POST /reimbursement-forms/{id}/submit again (no item changes)."
          assert:
            - "Sum of ReimbursementItem.claimed_amount before reject == 1000.00."
            - "Immediately after reject: both Invoice.ocr_status == 'TAX_VERIFIED' (compensation applied)."
            - "After resubmit: both Invoice.ocr_status == 'ATTACHED' (forward action re-applied)."
            - "Sum of ReimbursementItem.claimed_amount after resubmit == 1000.00 (invariant preserved)."
