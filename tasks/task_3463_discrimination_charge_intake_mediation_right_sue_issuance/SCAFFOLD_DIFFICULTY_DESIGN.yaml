  - rule_id: cross_entity_state_dependency
    instances:
      - name: orphaned_mediation_cannot_settle
        grounds:
          - state_machines.MediationCase.ACTIVE_to_SETTLED
          - state_machines.Charge.IN_MEDIATION_to_RTS_ISSUED
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: |
          Entity pair MediationCase x Charge: right-to-sue issuance deliberately
          leaves the mediation case ACTIVE while the charge becomes RTS_ISSUED;
          a subsequent conclude(SETTLED) must fail the cross-entity gate because
          the charge is no longer IN_MEDIATION — the mediation row's own state
          alone would have allowed it.
        test_recipe:
          setup:
            - "charge in IN_MEDIATION (both parties accepted) received at the 2026-09-01 default clock; clock advanced to 2027-02-28 so the 180-day gate passes"
          setup_api_calls:
