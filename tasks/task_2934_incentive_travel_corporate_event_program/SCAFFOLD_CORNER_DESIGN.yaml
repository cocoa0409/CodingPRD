        the same value both before and after all four failures, so a 412 is not itself a write.
      - '${pv_now} equals ${pv_stale} + 1: creating Ana''s seat incremented the parent version by exactly
        one.'
      - The retry with ${pv_now} returns 201 with Ben's registration INVITED, and a following GET /programs/${p_id}
        shows ${pv_now} + 1 — every accepted write on this endpoint increments the parent version, which
        is what makes the previously-held value stale in turn.
