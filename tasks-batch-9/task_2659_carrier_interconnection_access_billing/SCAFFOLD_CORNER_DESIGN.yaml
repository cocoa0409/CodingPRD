- section: state_machines
  instances:
  - name: tariff_filing_approval_moves_filed_to_effective
    claim_type: valid_transition
    grounds:
    - state_machines.TariffFiling.FILED_to_EFFECTIVE
    - endpoints.POST /interconnection/tariff-filings/{filing_id}/approve
    distinguishing_aspect: |
      Valid-transition claim: approve takes a FILED filing to EFFECTIVE and stamps approved_at with the logical clock, leaving the supersession fields null because no predecessor was named.
    test_recipe:
      setup:
      - One FILED LOCAL_RECIPROCAL_COMP filing at 0.061250 for [2026-08-01, 2027-01-01).
      - Logical clock at the 2026-08-01T00:00:00Z default.
      setup_api_calls:
      - call: POST /interconnection/tariff-filings
        payload:
          filing_docket: TF-2026-LOC-001
          rate_element: LOCAL_RECIPROCAL_COMP
          rate_per_mou_usd: 0.061250
          benchmark_interstate_rate_per_mou_usd: 0.512500
          effective_date: '2026-08-01T00:00:00.000Z'
          expiry_date: '2027-01-01T00:00:00.000Z'
        as: RegulatoryAffairsSpecialist
        captures:
          tf_loc_id: $.data.id
      trigger:
      - call: POST /interconnection/tariff-filings/${tf_loc_id}/approve
        payload: {}
        as: RegulatoryAffairsSpecialist
      assert:
      - response.status == 200 and response.data.status == EFFECTIVE
      - response.data.approved_at == 2026-08-01T00:00:00.000Z
      - response.data.superseded_by_filing_id is null and superseded_at is null
      - response.data.rate_per_mou_usd == 0.061250 and version == 2
  - name: agreement_activation_without_an_effective_reciprocal_rate_is_refused
    claim_type: precondition_enforcement
    grounds:
    - state_machines.InterconnectionAgreement.EXECUTED_to_EFFECTIVE
    - validations[priority=26]
    - errors[ERR_NO_EFFECTIVE_RECIPROCAL_RATE]
    distinguishing_aspect: |
      Precondition claim: the EXECUTED -> EFFECTIVE transition requires an EFFECTIVE LOCAL_RECIPROCAL_COMP filing covering the agreement's effective_date; with an empty tariff book the activation is refused and the agreement stays EXECUTED.
    test_recipe:
      setup:
      - A carrier with an EXECUTED agreement pinned at 0.061250 over 36 months.
      - No tariff filing of any rate element exists.
      - Logical clock at the 2026-08-01T00:00:00Z default, which has reached the effective_date.
      setup_api_calls:
      - call: POST /interconnection/carriers
        payload:
          carrier_name: Northstar Telecom LLC
          ocn: '9241'
          carrier_type: ILEC
        as: PlatformAdmin
        captures:
          car_id: $.data.id
          car_v0: $.data.version
      - call: POST /interconnection/agreements
        payload:
          carrier_id: ${car_id}
          agreement_label: ICA-NORTHSTAR-2026
          proposed_reciprocal_rate_per_mou_usd: 0.061250
          proposed_term_months: 36
          transit_traffic_allowed: false
          effective_date: '2026-08-01T00:00:00.000Z'
          poi_facility_capacity_trunks: 192
        as: InterconnectionManager
        captures:
          agr_id: $.data.id
          agr_v0: $.data.version
      - call: POST /interconnection/agreements/${agr_id}/offers
        payload:
          expected_agreement_version: ${agr_v0}
          offer_type: PROPOSAL
          reciprocal_rate_per_mou_usd: 0.061250
          term_months: 36
          poi_financial_responsibility: SHARED
          transit_traffic_allowed: false
        as: InterconnectionManager
        captures:
          offer1_id: $.data.id
      - call: POST /interconnection/negotiation-offers/${offer1_id}/accept
        payload: {}
        as: CarrierRepresentative
        as_user_id: ${car_id}
      trigger:
      - call: POST /interconnection/agreements/${agr_id}/activate
        payload: {}
        as: InterconnectionManager
        captures: *id002
      assert:
      - response.status == 409 and response.data.error_id == ERR_NO_EFFECTIVE_RECIPROCAL_RATE
      - InterconnectionAgreement.${agr_id}.status is still EXECUTED
      - InterconnectionAgreement.${agr_id}.reciprocal_rate_per_mou_usd == 0.061250 and executed_at == 2026-08-01T00:00:00Z
      - The error is ERR_NO_EFFECTIVE_RECIPROCAL_RATE, not ERR_EFFECTIVE_DATE_NOT_REACHED
  - name: agreement_activation_before_its_effective_date_is_refused
    claim_type: precondition_enforcement
    grounds:
    - state_machines.InterconnectionAgreement.EXECUTED_to_EFFECTIVE
    - validations[priority=25]
    - errors[ERR_EFFECTIVE_DATE_NOT_REACHED]
    distinguishing_aspect: |
      Precondition claim: the same transition also requires the logical clock to have reached effective_date; with the clock at 2026-08-01 and an effective_date of 2026-10-01 the activation is refused even though the tariff precondition is satisfied.
    test_recipe:
      setup:
