            - call: "POST /annexation-cases"
              payload: { municipality_id: "${muni_e4}", method: "INVOLUNTARY_ORDINANCE", shared_boundary_feet: 20000, total_lot_count: 2, developed_lot_count: 2, dwelling_units: 4 }
              as: MunicipalPlanner
              as_user_id: "${muni_e4}"
              captures: { case_e4: $.data.id }
            - call: "POST /annexation-cases/${case_e4}/parcels"
              payload: { primary_owner_id: "${ow_e4}", parcel_apn: "E4-1", assessed_value_cents: 50000000, acreage: 5.00, is_developed: true, dwelling_units: 2 }
              as: MunicipalPlanner
              as_user_id: "${muni_e4}"
              captures: { parcel_e4a: $.data.id }
            - call: "POST /annexation-cases/${case_e4}/parcels"
              payload: { primary_owner_id: "${ow_e4}", parcel_apn: "E4-2", assessed_value_cents: 50000000, acreage: 5.00, is_developed: true, dwelling_units: 2 }
              as: MunicipalPlanner
