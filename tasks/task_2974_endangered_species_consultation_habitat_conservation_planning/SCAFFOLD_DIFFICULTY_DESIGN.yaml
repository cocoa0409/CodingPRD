              as_user_id: "fws-user-adjudicator"
            - call: "POST /_clock/set_current_utc"
              payload: {to_iso8601: "2027-07-01T00:00:00Z"}
              as: WildlifeAgency
              as_user_id: "fws-user-registrar"
            - call: "GET /incidental-take-permits/${permit_id}"
              payload: {}
              as: Proponent
              as_user_id: "${proponent_id}"
              captures: {permit_v3: "$.data.version", consumed_before: "$.data.take_consumed_units"}
          trigger:
            - call: "POST /incidental-take-permits/${permit_id}/monitoring-reports"
              payload: {period_start: "2027-04-01", period_end: "2027-07-01", take_units_reported: 1.00, mitigation_units_verified: 59.72, expected_permit_version: "${permit_v3}"}
              as: Proponent
              as_user_id: "${proponent_id}"
              captures: {r2_id: "$.data.id"}
          assert:
            - "the captured ${r1_due} == '2027-05-16' (2027-04-01 + 45 days), ${r1_late} == false and ${consumed_before} == 1.00"
            - "the trigger returns 201: [2027-04-01, 2027-07-01) starts exactly where R1's period ended, and half-open adjacency is not an overlap"
            - "the new report's due_at == '2027-08-15' (2027-07-01 + 45 days) and is_late == false (submitted on 2027-07-01)"
            - "GET /incidental-take-permits/${permit_id} reports take_consumed_units == 2.00 and take_remaining_units == 2.00, still short of the 3.60 trigger, so the permit stays 'ACTIVE'"
            - "a third report for [2027-03-31, 2027-06-30) returns ERR_REPORTING_PERIOD_OVERLAP (409): it overlaps R1 by one day AND R2 by ninety, and one day of overlap is enough"
            - "a report for [2027-07-01, 2027-07-01) returns ERR_PERIOD_OUTSIDE_PERMIT_TERM (422) instead — a zero-length period fails period_start < period_end at priority 19 before the overlap rule at 21 is reached"
            - "REJECTED reports free their interval: after POST /monitoring-reports/${r2_id}/adjudication with decision 'REJECT', a new report for exactly [2027-04-01, 2027-07-01) succeeds with 201, and take_consumed_units returns to 2.00 after having dropped to 1.00"
            - "the freed-interval rule is status-scoped, not permit-scoped: R1 is ACCEPTED, so [2027-01-01, 2027-04-01) still returns ERR_REPORTING_PERIOD_OVERLAP"

