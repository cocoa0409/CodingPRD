            - "FleetInvoice.discount_cents == 4165"

  # =========================================================================
  # Rule 3 — Non-linear state-machine shape on different entities
  # =========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: service_ticket_resolve_reopen_cycle
        grounds:
          - state_machines.ServiceTicket.RESOLVED_to_REOPENED
          - state_machines.ServiceTicket.REOPENED_to_IN_PROGRESS
          - state_machines.ServiceTicket.IN_PROGRESS_to_RESOLVED
        distinguishing_aspect: |
          ServiceTicket is cyclic: OPEN->IN_PROGRESS->RESOLVED->REOPENED->IN_PROGRESS->RESOLVED loops
          back onto IN_PROGRESS, a revision cycle on the ServiceTicket entity (distinct from the
          CoverageClaim fork-join below).
        test_recipe:
          setup:
            - "An ACTIVE rental with a MINOR ServiceTicket; ticket walked OPEN->IN_PROGRESS->RESOLVED."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: OpsAdmin
            - call: "POST /bike-models"
              payload: { name: "Std", model_class: "STANDARD", monthly_fee_cents: 8000, daily_rate_cents: 2000, purchase_price_cents: 90000, deposit_cents: 10000, fleet_size: 5 }
              as: OpsAdmin
              captures: { model_id: $.data.id }
            - call: "POST /bikes"
              payload: { model_id: "${model_id}", serial_number: "S-1" }
              as: OpsAdmin
            - call: "POST /accounts"
              payload: { account_type: "SUBSCRIBER", display_name: "Sam", email: "sam@x.com", rental_cap: 1 }
              as: Anonymous
              captures: { acct_id: $.data.id }
            - call: "GET /bike-models/${model_id}"
              payload: {}
              as: Subscriber
              as_user_id: "${acct_id}"
              captures: { mv0: $.data.version }
