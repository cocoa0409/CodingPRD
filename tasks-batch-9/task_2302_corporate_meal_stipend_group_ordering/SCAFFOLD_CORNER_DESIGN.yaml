            - { call: "POST /employee-groups/${grp_id}/budget-rules", payload: { effective_from: "2026-08-01T00:00:00Z", per_meal_cap_cents: 3000, daily_meal_limit: 2, monthly_allocation_cents: 60000, eligible_weekdays: [1, 2, 3, 4, 5], eligible_window_start_minute: 660, eligible_window_end_minute: 840 }, as: BenefitsController, as_user_id: "ctrl-drafter", captures: { rule2_id: $.data.id } }
