            - "the neighbour's invoice read returns 403 with ${e_read_invoice} == ERR_FORBIDDEN_AGREEMENT"
            - "the neighbour's payment returns 403 with ${e_pay_invoice} == ERR_FORBIDDEN_AGREEMENT, ahead of any amount or state check"
