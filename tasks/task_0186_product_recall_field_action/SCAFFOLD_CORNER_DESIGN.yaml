# =============================================================================
# §1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# Product Recall & Field Action — Expert
# Breadth probe over §1.1–§1.7. Same call-chain discipline as §1.8.
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:
      - name: create_product_returns_201_with_all_fields
        claim_type: Creation
        grounds: [entities.Product, endpoints]
        distinguishing_aspect: "POST /products with sku,name,regulator,unit_list_price_cents returns 201 with server-minted id, created_at, version==1, active_recall_id==null."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /products"
              payload: { sku: "P-NEW", name: "Widget", regulator: "FDA", unit_list_price_cents: 5000 }
              as: PlatformAdmin
              captures: { pid: $.data.id, ver: $.data.version }
          assert:
            - "response status == 201"
            - "Product.${pid}.version == 1"
            - "Product.${pid}.active_recall_id == null"

      - name: get_recall_not_found_returns_404
        claim_type: Not Found
        grounds: [entities.Recall, "errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "GET /recalls/{id} with a non-existent UUID returns ERR_NOT_FOUND (404)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "GET /recalls/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: RecallCoordinator
              captures: { err: $.data.error_id }
          assert:
            - "response status == 404"
            - "data.error_id == ERR_NOT_FOUND"

      - name: create_product_missing_required_field_returns_422
        claim_type: Required Fields
        grounds: [entities.Product.fields.regulator, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "POST /products omitting regulator returns ERR_INVALID_REQUEST (422)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /products"
              payload: { sku: "P-MISS", name: "NoReg", unit_list_price_cents: 5000 }
              as: PlatformAdmin
              captures: { err: $.data.error_id }
          assert:
            - "response status == 422"
            - "data.error_id == ERR_INVALID_REQUEST"

      - name: create_product_invalid_regulator_enum_returns_422
        claim_type: Type Constraints
        grounds: [entities.Product.fields.regulator, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "POST /products with regulator 'EPA' (not in {FDA,CPSC}) returns ERR_INVALID_REQUEST (422)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /products"
              payload: { sku: "P-ENUM", name: "BadReg", regulator: "EPA", unit_list_price_cents: 5000 }
              as: PlatformAdmin
              captures: { err: $.data.error_id }
          assert:
            - "response status == 422"
            - "data.error_id == ERR_INVALID_REQUEST"

      - name: customer_reachable_defaults_true_when_omitted
        claim_type: Defaults
        grounds: [entities.Customer.fields.reachable]
        distinguishing_aspect: "POST /customers without reachable applies default true."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /customers"
              payload: { name: "Def", contact_channel: "EMAIL", contact_address: "d@x.com" }
              as: FieldServiceAgent
              captures: { cid: $.data.id, r: $.data.reachable }
          assert:
            - "Customer.${cid}.reachable == true"

      - name: lot_manufactured_units_computed_from_serial_range
        claim_type: Computed Fields
        grounds: [entities.Lot.fields.manufactured_units]
        distinguishing_aspect: "POST /lots with serial_start 1 serial_end 100 yields manufactured_units == 100 (= end - start + 1), input value ignored."
        test_recipe:
          setup: ["A product exists."]
          setup_api_calls:
            - call: "POST /products"
              payload: { sku: "P-MU", name: "Comp", regulator: "FDA", unit_list_price_cents: 5000 }
              as: PlatformAdmin
              captures: { prod: $.data.id }
          trigger:
            - call: "POST /lots"
              payload: { product_id: "${prod}", lot_code: "MU1", serial_start: 1, serial_end: 100 }
              as: RecallCoordinator
              captures: { lot: $.data.id, mu: $.data.manufactured_units }
          assert:
            - "Lot.${lot}.manufactured_units == 100"
            - "Lot.${lot}.quarantine_status == RELEASED"

      - name: unit_serial_out_of_lot_range_returns_422
        claim_type: Parent Relationships
        grounds: ["validations[priority=18]", "errors[ERR_SERIAL_OUT_OF_RANGE]"]
        distinguishing_aspect: "POST /units with serial_number 200 on a lot [1..100] returns ERR_SERIAL_OUT_OF_RANGE (422)."
        test_recipe:
          setup: ["Product and lot [1..100] and a customer exist."]
          setup_api_calls:
            - call: "POST /products"
              payload: { sku: "P-OOR", name: "Range", regulator: "FDA", unit_list_price_cents: 5000 }
              as: PlatformAdmin
              captures: { prod: $.data.id }
            - call: "POST /lots"
              payload: { product_id: "${prod}", lot_code: "OOR1", serial_start: 1, serial_end: 100 }
              as: RecallCoordinator
              captures: { lot: $.data.id }
            - call: "POST /customers"
              payload: { name: "COOR", contact_channel: "EMAIL", contact_address: "oor@x.com" }
              as: FieldServiceAgent
              captures: { cust: $.data.id }
          trigger:
            - call: "POST /units"
              payload: { lot_id: "${lot}", serial_number: 200, customer_id: "${cust}", sale_price_cents: 5000 }
              as: FieldServiceAgent
              captures: { err: $.data.error_id }
          assert:
            - "response status == 422"
            - "data.error_id == ERR_SERIAL_OUT_OF_RANGE"

      - name: duplicate_product_sku_returns_409
        claim_type: Type Constraints
        grounds: ["validations[priority=25]", "errors[ERR_DUPLICATE_KEY]"]
        distinguishing_aspect: "Creating a second Product with an existing sku returns ERR_DUPLICATE_KEY (409)."
        test_recipe:
          setup: ["A product with sku P-DUP exists."]
          setup_api_calls:
            - call: "POST /products"
              payload: { sku: "P-DUP", name: "First", regulator: "FDA", unit_list_price_cents: 5000 }
              as: PlatformAdmin
          trigger:
            - call: "POST /products"
              payload: { sku: "P-DUP", name: "Second", regulator: "CPSC", unit_list_price_cents: 6000 }
              as: PlatformAdmin
              captures: { err: $.data.error_id }
          assert:
            - "response status == 409"
            - "data.error_id == ERR_DUPLICATE_KEY"

      - name: list_products_paginated_envelope
        claim_type: Listing
        grounds: [entities.Product, response_envelope]
        distinguishing_aspect: "GET /products returns array envelope with total_count and has_more pagination fields."
        test_recipe:
          setup: ["At least two products exist."]
          setup_api_calls:
            - call: "POST /products"
              payload: { sku: "P-L1", name: "L1", regulator: "FDA", unit_list_price_cents: 5000 }
              as: PlatformAdmin
            - call: "POST /products"
              payload: { sku: "P-L2", name: "L2", regulator: "CPSC", unit_list_price_cents: 6000 }
              as: PlatformAdmin
          trigger:
            - call: "GET /products"
              payload: {}
              as: RecallCoordinator
          assert:
            - "response status == 200"
            - "response_type == array; meta.total_count >= 2; has_more present"

  # ===========================================================================
  - section: state_machines
    instances:
      - name: classify_from_announced_returns_invalid_state
        claim_type: Invalid Transitions
        grounds: [state_machines.Recall.DRAFT_to_CLASSIFIED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "POST /recalls/{id}/classify on an ANNOUNCED recall (not DRAFT) returns ERR_INVALID_STATE (409)."
        test_recipe:
          setup: ["Recall classified by U1 and announced by U2 (status ANNOUNCED)."]
          setup_api_calls:
            - call: "POST /products"
              payload: { sku: "P-SM1", name: "SM1", regulator: "FDA", unit_list_price_cents: 5000 }
              as: PlatformAdmin
              captures: { prod: $.data.id }
            - call: "POST /lots"
              payload: { product_id: "${prod}", lot_code: "SM1L", serial_start: 1, serial_end: 100 }
              as: RecallCoordinator
              captures: { lot: $.data.id }
            - call: "POST /recalls"
              payload: { product_id: "${prod}", reason: "x", hazard_severity: "SERIOUS", injury_reported: false }
              as: RecallCoordinator
              captures: { rc: $.data.id, rc_v0: $.data.version }
            - call: "POST /recalls/${rc}/affected-lots"
              payload: { lot_id: "${lot}", expected_recall_version: "${rc_v0}" }
              as: RecallCoordinator
            - call: "POST /recalls/${rc}/classify"
              payload: {}
              as: RecallCoordinator
              as_user_id: "user-1"
            - call: "POST /regulatory-reports"
              payload: { recall_id: "${rc}", report_kind: "INITIAL" }
              as: RecallCoordinator
              captures: { rep: $.data.id }
            - call: "POST /regulatory-reports/${rep}/submit"
              payload: {}
              as: QualityOfficer
            - call: "POST /recalls/${rc}/announce"
              payload: {}
              as: QualityOfficer
              as_user_id: "user-2"
          trigger:
            - call: "POST /recalls/${rc}/classify"
              payload: {}
              as: RecallCoordinator
              as_user_id: "user-1"
              captures: { err: $.data.error_id }
          assert:
            - "response status == 409"
            - "data.error_id == ERR_INVALID_STATE"

      - name: reclassify_loop_clears_classification
        claim_type: Valid Transition
        grounds: [state_machines.Recall.CLASSIFIED_to_DRAFT, entities.Recall.fields.classification]
        distinguishing_aspect: "POST /recalls/{id}/reclassify moves CLASSIFIED->DRAFT (cyclic) and clears classification to null."
        test_recipe:
          setup: ["Recall CLASSIFIED, no report filed yet."]
          setup_api_calls:
            - call: "POST /products"
              payload: { sku: "P-SM2", name: "SM2", regulator: "FDA", unit_list_price_cents: 5000 }
              as: PlatformAdmin
              captures: { prod: $.data.id }
            - call: "POST /lots"
              payload: { product_id: "${prod}", lot_code: "SM2L", serial_start: 1, serial_end: 100 }
              as: RecallCoordinator
              captures: { lot: $.data.id }
            - call: "POST /recalls"
              payload: { product_id: "${prod}", reason: "x", hazard_severity: "MINOR" }
              as: RecallCoordinator
              captures: { rc: $.data.id, rc_v0: $.data.version }
            - call: "POST /recalls/${rc}/affected-lots"
              payload: { lot_id: "${lot}", expected_recall_version: "${rc_v0}" }
              as: RecallCoordinator
            - call: "POST /recalls/${rc}/classify"
              payload: {}
              as: RecallCoordinator
          trigger:
            - call: "POST /recalls/${rc}/reclassify"
              payload: { hazard_severity: "SERIOUS", injury_reported: true }
              as: RecallCoordinator
              captures: { st: $.data.status, cls: $.data.classification }
          assert:
            - "Recall.${rc}.status == DRAFT"
            - "Recall.${rc}.classification == null"

      - name: notification_send_to_unreachable_customer_goes_failed
        claim_type: Side Effect Execution
        grounds: [state_machines.Notification.QUEUED_to_FAILED, entities.Notification.fields.status, "errors[ERR_CUSTOMER_UNREACHABLE]"]
        distinguishing_aspect: "POST /notifications/{id}/send when Customer.reachable==false returns ERR_CUSTOMER_UNREACHABLE and leaves notification FAILED with attempt_count 1."
        test_recipe:
          setup: ["Recall announced with one QUEUED notification to an UNREACHABLE customer."]
          setup_api_calls:
            - call: "POST /products"
              payload: { sku: "P-NF", name: "NF", regulator: "FDA", unit_list_price_cents: 5000 }
              as: PlatformAdmin
              captures: { prod: $.data.id }
            - call: "POST /lots"
              payload: { product_id: "${prod}", lot_code: "NFL", serial_start: 1, serial_end: 100 }
              as: RecallCoordinator
              captures: { lot: $.data.id }
            - call: "POST /customers"
              payload: { name: "CNF", contact_channel: "EMAIL", contact_address: "nf@x.com", reachable: false }
              as: FieldServiceAgent
              captures: { cust: $.data.id }
            - call: "POST /units"
              payload: { lot_id: "${lot}", serial_number: 2, customer_id: "${cust}", sale_price_cents: 5000 }
              as: FieldServiceAgent
              captures: { unit: $.data.id }
            - call: "POST /recalls"
              payload: { product_id: "${prod}", reason: "x", hazard_severity: "SERIOUS", injury_reported: false }
              as: RecallCoordinator
              captures: { rc: $.data.id, rc_v0: $.data.version }
            - call: "POST /recalls/${rc}/affected-lots"
              payload: { lot_id: "${lot}", expected_recall_version: "${rc_v0}" }
              as: RecallCoordinator
            - call: "POST /recalls/${rc}/classify"
              payload: {}
              as: RecallCoordinator
            - call: "POST /regulatory-reports"
              payload: { recall_id: "${rc}", report_kind: "INITIAL" }
              as: RecallCoordinator
              captures: { rep: $.data.id }
            - call: "POST /regulatory-reports/${rep}/submit"
              payload: {}
              as: QualityOfficer
            - call: "POST /recalls/${rc}/announce"
              payload: {}
              as: QualityOfficer
            - call: "GET /notifications"
              payload: {}
              as: RecallCoordinator
              captures: { notif: $.data.0.id }
          trigger:
            - call: "POST /notifications/${notif}/send"
              payload: {}
              as: PlatformAdmin
              captures: { err: $.data.error_id }
          assert:
            - "response status == 409"
            - "data.error_id == ERR_CUSTOMER_UNREACHABLE"
            - "Notification.${notif}.status == FAILED; attempt_count == 1"

      - name: terminate_from_announced_returns_invalid_state
        claim_type: Terminal State Lockdown
        grounds: [state_machines.Recall.MONITORING_to_TERMINATED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "POST /recalls/{id}/terminate while recall is ANNOUNCED (not MONITORING) returns ERR_INVALID_STATE (409)."
        test_recipe:
          setup: ["Recall ANNOUNCED (not yet MONITORING)."]
          setup_api_calls:
            - call: "POST /products"
              payload: { sku: "P-SM4", name: "SM4", regulator: "FDA", unit_list_price_cents: 5000 }
              as: PlatformAdmin
              captures: { prod: $.data.id }
            - call: "POST /lots"
              payload: { product_id: "${prod}", lot_code: "SM4L", serial_start: 1, serial_end: 100 }
              as: RecallCoordinator
              captures: { lot: $.data.id }
            - call: "POST /recalls"
              payload: { product_id: "${prod}", reason: "x", hazard_severity: "SERIOUS", injury_reported: false }
              as: RecallCoordinator
              captures: { rc: $.data.id, rc_v0: $.data.version }
            - call: "POST /recalls/${rc}/affected-lots"
              payload: { lot_id: "${lot}", expected_recall_version: "${rc_v0}" }
              as: RecallCoordinator
            - call: "POST /recalls/${rc}/classify"
              payload: {}
              as: RecallCoordinator
              as_user_id: "user-a"
            - call: "POST /regulatory-reports"
              payload: { recall_id: "${rc}", report_kind: "INITIAL" }
              as: RecallCoordinator
              captures: { rep: $.data.id }
            - call: "POST /regulatory-reports/${rep}/submit"
              payload: {}
              as: QualityOfficer
            - call: "POST /recalls/${rc}/announce"
              payload: {}
              as: QualityOfficer
              as_user_id: "user-b"
          trigger:
            - call: "POST /recalls/${rc}/terminate"
              payload: { force_terminate: true }
              as: QualityOfficer
              as_user_id: "user-b"
              captures: { err: $.data.error_id }
          assert:
            - "response status == 409"
            - "data.error_id == ERR_INVALID_STATE"

      - name: announce_segregation_breach
        claim_type: Precondition Enforcement
        grounds: [state_machines.Recall.CLASSIFIED_to_ANNOUNCED, "errors[ERR_SEGREGATION_OF_DUTIES]"]
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / segregation_beats_missing_initial_report_on_announce
          rationale: "Segregation breach on announce is asserted as the winning error of the named §1.8 priority-pair instance."

      - name: terminate_to_effective_requires_final_report
        claim_type: Precondition Enforcement
        grounds: [state_machines.Recall.MONITORING_to_EFFECTIVE, "errors[ERR_FINAL_REPORT_REQUIRED]"]
        distinguishing_aspect: "Terminate from MONITORING with a PASS effectiveness check but NO FINAL report returns ERR_FINAL_REPORT_REQUIRED (409)."
        test_recipe:
          setup: ["Recall MONITORING with effectiveness 100 (one of one returned) and a PASS check recorded; no FINAL report filed."]
          setup_api_calls:
            - call: "POST /products"
              payload: { sku: "P-FR", name: "FR", regulator: "FDA", unit_list_price_cents: 5000 }
              as: PlatformAdmin
              captures: { prod: $.data.id }
            - call: "POST /lots"
              payload: { product_id: "${prod}", lot_code: "FRL", serial_start: 1, serial_end: 100 }
              as: RecallCoordinator
              captures: { lot: $.data.id }
            - call: "POST /customers"
              payload: { name: "CFR", contact_channel: "EMAIL", contact_address: "fr@x.com" }
              as: FieldServiceAgent
              captures: { cust: $.data.id }
            - call: "POST /units"
              payload: { lot_id: "${lot}", serial_number: 1, customer_id: "${cust}", sale_price_cents: 5000 }
              as: FieldServiceAgent
              captures: { unit: $.data.id }
            - call: "POST /recalls"
              payload: { product_id: "${prod}", reason: "x", hazard_severity: "MINOR" }
              as: RecallCoordinator
              captures: { rc: $.data.id, rc_v0: $.data.version }
            - call: "POST /recalls/${rc}/affected-lots"
              payload: { lot_id: "${lot}", expected_recall_version: "${rc_v0}" }
              as: RecallCoordinator
            - call: "POST /recalls/${rc}/classify"
              payload: {}
              as: RecallCoordinator
              as_user_id: "user-x"
            - call: "POST /regulatory-reports"
              payload: { recall_id: "${rc}", report_kind: "INITIAL" }
              as: RecallCoordinator
              captures: { rep: $.data.id }
            - call: "POST /regulatory-reports/${rep}/submit"
              payload: {}
              as: QualityOfficer
            - call: "POST /recalls/${rc}/announce"
              payload: {}
              as: QualityOfficer
              as_user_id: "user-y"
              captures: { rc_v_ann: $.data.version }
            - call: "GET /recalls/${rc}"
              payload: {}
              as: FieldServiceAgent
              captures: { rcv_d1: $.data.version }
            - call: "POST /dispositions"
              payload: { recall_id: "${rc}", unit_id: "${unit}", disposition_type: "RETURN", expected_recall_version: "${rcv_d1}" }
              as: FieldServiceAgent
              captures: { d: $.data.id }
            - call: "POST /dispositions/${d}/receive-return"
              payload: {}
              as: FieldServiceAgent
            - call: "GET /notifications"
              payload: {}
              as: RecallCoordinator
              captures: { notif: $.data.0.id }
            - call: "POST /notifications/${notif}/send"
              payload: {}
              as: PlatformAdmin
            - call: "POST /recalls/${rc}/begin-monitoring"
              payload: {}
              as: RecallCoordinator
            - call: "POST /effectiveness-checks"
              payload: { recall_id: "${rc}" }
              as: RecallCoordinator
          trigger:
            - call: "POST /recalls/${rc}/terminate"
              payload: {}
              as: QualityOfficer
              as_user_id: "user-y"
              captures: { err: $.data.error_id }
          assert:
            - "response status == 409"
            - "data.error_id == ERR_FINAL_REPORT_REQUIRED"

      - name: lift_hold_while_recall_announced_returns_409
        claim_type: Precondition Enforcement
        grounds: ["state_machines.QuarantineHold.ACTIVE_to_LIFTED", "validations[priority=10]", "errors[ERR_HOLD_LOCKED_BY_RECALL]"]
        distinguishing_aspect: "Lifting an ACTIVE QuarantineHold while its owning Recall is still ANNOUNCED (not yet MONITORING) returns ERR_HOLD_LOCKED_BY_RECALL (409)."
        test_recipe:
          setup: ["Recall ANNOUNCED (not begun-monitoring) with one ACTIVE QuarantineHold on its affected lot."]
          setup_api_calls:
            - call: "POST /products"
              payload: { sku: "P-HL", name: "HL", regulator: "CPSC", unit_list_price_cents: 5000 }
              as: PlatformAdmin
              captures: { prod: $.data.id }
            - call: "POST /lots"
              payload: { product_id: "${prod}", lot_code: "HLL", serial_start: 1, serial_end: 100 }
              as: RecallCoordinator
              captures: { lot: $.data.id }
            - call: "POST /recalls"
              payload: { product_id: "${prod}", reason: "x", hazard_severity: "SERIOUS", injury_reported: false }
              as: RecallCoordinator
              captures: { rc: $.data.id, rc_v0: $.data.version }
            - call: "POST /recalls/${rc}/affected-lots"
              payload: { lot_id: "${lot}", expected_recall_version: "${rc_v0}" }
              as: RecallCoordinator
            - call: "POST /recalls/${rc}/classify"
              payload: {}
              as: RecallCoordinator
            - call: "POST /regulatory-reports"
              payload: { recall_id: "${rc}", report_kind: "INITIAL" }
              as: RecallCoordinator
              captures: { rep: $.data.id }
            - call: "POST /regulatory-reports/${rep}/submit"
              payload: {}
              as: QualityOfficer
            - call: "POST /recalls/${rc}/announce"
              payload: {}
              as: QualityOfficer
            - call: "GET /quarantine-holds"
              payload: {}
              as: RecallCoordinator
              captures: { hold: $.data.0.id }
          trigger:
            - call: "POST /quarantine-holds/${hold}/lift"
              payload: {}
              as: RecallCoordinator
              captures: { err: $.data.error_id }
          assert:
            - "response status == 409"
            - "data.error_id == ERR_HOLD_LOCKED_BY_RECALL"

  # ===========================================================================
  - section: calculations
    instances:
      - name: refund_class_i_goodwill_premium_applied
        claim_type: Constants Applied
        grounds: [calculations.refund_amount_rule, entities.Disposition.fields.refund_amount_cents]
        distinguishing_aspect: "A CLASS_I SALE_PRICE refund on a unit paid 9999c applies the 1.10 goodwill multiplier with round_half_up -> 10999c."
        test_recipe:
          setup: ["CLASS_I recall (SERIOUS+injury) announced; affected unit sold at 9999c; REFUND SALE_PRICE disposition RETURNED+OWED."]
          setup_api_calls:
            - call: "POST /products"
              payload: { sku: "P-GW", name: "GW", regulator: "CPSC", unit_list_price_cents: 9000 }
              as: PlatformAdmin
              captures: { prod: $.data.id }
            - call: "POST /lots"
              payload: { product_id: "${prod}", lot_code: "GWL", serial_start: 1, serial_end: 100 }
              as: RecallCoordinator
              captures: { lot: $.data.id }
            - call: "POST /customers"
              payload: { name: "CGW", contact_channel: "EMAIL", contact_address: "gw@x.com" }
              as: FieldServiceAgent
              captures: { cust: $.data.id }
            - call: "POST /units"
              payload: { lot_id: "${lot}", serial_number: 3, customer_id: "${cust}", sale_price_cents: 9999 }
              as: FieldServiceAgent
              captures: { unit: $.data.id }
            - call: "POST /recalls"
              payload: { product_id: "${prod}", reason: "x", hazard_severity: "SERIOUS", injury_reported: true }
              as: RecallCoordinator
              captures: { rc: $.data.id, rc_v0: $.data.version }
            - call: "POST /recalls/${rc}/affected-lots"
              payload: { lot_id: "${lot}", expected_recall_version: "${rc_v0}" }
              as: RecallCoordinator
            - call: "POST /recalls/${rc}/classify"
              payload: {}
              as: RecallCoordinator
            - call: "POST /regulatory-reports"
              payload: { recall_id: "${rc}", report_kind: "INITIAL" }
              as: RecallCoordinator
              captures: { rep: $.data.id }
            - call: "POST /regulatory-reports/${rep}/submit"
              payload: {}
              as: QualityOfficer
            - call: "POST /recalls/${rc}/announce"
              payload: {}
              as: QualityOfficer
              captures: { rc_v_ann: $.data.version }
