        grounds:
          - calculations.pickup_parcel_slot_reconciliation
          - validations.ERR_PICKUP_HAS_PARCELS
          - validations.ERR_PICKUP_CAPACITY_EXCEEDED
        distinguishing_aspect: |
          Conserved quantity 4 = carrier parcel slots
          (CarrierPickup.reserved_parcels == the count of SHIPPED assignments tendered to it and
          never above parcel_capacity): a pickup that already holds a parcel cannot be cancelled
          away, a third tender into a two-slot window is refused without moving the counter, and
          the three parcels end up partitioned 2 + 1 across two windows while an untouched window
          cancels cleanly at zero.
