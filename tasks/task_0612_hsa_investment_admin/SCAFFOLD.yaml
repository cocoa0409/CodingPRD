# =============================================================================
# HSA Investment & Administration Platform — seed tables (SCAFFOLD.yaml)
# §1.0–§1.7. Difficulty band: EXPERT.
# =============================================================================

scenario: |
  HSA Investment & Administration Platform (HealthEquity/Fidelity HSA style):
  account opening & eligibility (HDHP), contribution (payroll/individual) &
  IRS-limit guardrail, investment threshold & fund sweep, qualified-expense
  substantiation & debit card, receipt vault & reimburse-anytime,
  family/individual & catch-up, 1099-SA/5498-SA, excess-contribution correction

domain_name: hsa-investment-admin
api_prefix: /hsa

# All monetary amounts are integer cents (USD). All dates/times are ISO 8601 UTC.
# A logical server clock governs every deadline/window rule; it starts at the
# fixed default 2026-01-01T00:00:00Z and only moves via POST /_clock/set_current_utc.

complexity_profile:
  primary_archetype: "Ledger reconciliation"
  secondary_archetype: "Compliance / audit"
  complexity_layers:
    - "Optimistic concurrency"        # OCC on HsaAccount.version for sweeps & corrections
    - "Dual-variant calculation"      # last-month-rule vs monthly-proration limit; debit-card vs reimburse distribution
    - "Rate / threshold triggers"     # invest threshold + sweep increment; IRS-limit guardrail
    - "Cascading side effects"        # correction -> contribution reversal -> ledger -> posture; sweep -> ledger -> tax-form basis

  entity_topology: hybrid
  # HsaAccount is the aggregate root; Contribution/Distribution/InvestmentSweep/
  # ExcessCorrection/TaxForm/DebitCard/CoveragePeriod hang off it (nested URLs).
  # Receipt is a flat peer linked to HsaAccount + optionally a Distribution (FK).
  # Accountholder and Employer are flat reference entities (FK from HsaAccount).

  state_machine_shape: parallel
  # HsaAccount carries TWO independent state dimensions: lifecycle_status
  # (PENDING_VERIFICATION -> ACTIVE -> ... ) and contribution_posture
  # (OPEN -> LOCKED), evolving on different triggers. Distribution & Contribution
  # have branching/cyclic shapes. CoveragePeriod is a linear pipeline.

  relationship_patterns:
    - one_to_many        # HsaAccount -> Contribution/Distribution/etc.
    - cross_aggregate    # Receipt -> Distribution; Distribution -> Receipt substantiation
    - polymorphic        # TaxForm.form_type {FORM_1099_SA, FORM_5498_SA} over the same account

  role_model: segregation_of_duties
  # The Accountholder who initiates a Distribution may not be the AccountAdmin who
  # substantiates/clears it; payroll Contributions are posted only by Employer.

  consistency_model: immediate

# =============================================================================
# §1.0 Response Envelope (FIXED — EMIT VERBATIM)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:

  - name: Accountholder
    parent: null
    common_fields: true   # id, created_at, updated_at, version
    fields:
      - { name: full_name, type: string, source: input, description: "Accountholder legal name" }
      - { name: email, type: string, source: input, description: "Unique contact email" }
      - { name: date_of_birth, type: datetime, source: input, description: "ISO 8601 date; drives catch-up eligibility (turns 55 in plan year)" }
      - { name: turns_55_or_older_in_plan_year, type: boolean, source: computed, description: "True when accountholder is 55+ at any point in the open HsaAccount.plan_year (catch-up eligible)" }

  - name: Employer
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Employer / payroll sponsor name" }
      - { name: payroll_contributions_enabled, type: boolean, source: input, default: true, description: "When false, payroll-channel Contributions are rejected" }

  - name: PayrollPeriod
    parent: Employer
    common_fields: true
    fields:
      - { name: employer_id, type: string, source: system, description: "FK -> Employer.id; the sponsor whose payroll calendar this period belongs to" }
      - { name: period_start_day, type: integer, source: input, description: "Inclusive day-of-year index 1..365 the pay period opens (half-open lower bound, closed)" }
      - { name: period_end_day, type: integer, source: input, description: "EXCLUSIVE day-of-year index 2..366 the pay period closes (half-open upper bound, open); period covers [start, end)" }
      - { name: status, type: enum, source: system, description: "SCHEDULED | CANCELLED — CANCELLED periods are excluded from overlap checks" }

  - name: HsaAccount
    parent: null
    common_fields: true
    fields:
      - { name: accountholder_id, type: string, source: input, description: "FK -> Accountholder.id; the owner of this HSA" }
      - { name: employer_id, type: string, source: input, description: "FK -> Employer.id; payroll sponsor (nullable for individual-only accounts)", default: null }
      - { name: plan_year, type: integer, source: input, description: "Calendar year this account's IRS limits apply to, e.g. 2026" }
      - { name: lifecycle_status, type: enum, source: system, description: "PENDING_VERIFICATION | ACTIVE | FROZEN | CLOSED — account lifecycle dimension" }
      - { name: contribution_posture, type: enum, source: computed, description: "OPEN | LOCKED — independent posture; LOCKED when uncorrected excess exists or lifecycle is FROZEN/CLOSED, blocks new contributions" }
      - { name: cash_balance_cents, type: integer, source: computed, description: "Spendable cash ledger; raised by posted contributions, lowered by sweeps/distributions, restored on reversals" }
      - { name: invested_balance_cents, type: integer, source: computed, description: "Funds moved to investments by sweeps; never directly spendable" }
      - { name: contributions_ytd_cents, type: integer, source: computed, description: "Sum of Contribution.amount_cents for POSTED contributions in plan_year, minus corrected excess" }
      - { name: applicable_limit_cents, type: integer, source: computed, description: "Computed IRS contribution ceiling for this account this plan_year (see contribution_limit calc, default variant LAST_MONTH_RULE)" }
      - { name: excess_contribution_cents, type: integer, source: computed, description: "max(0, contributions_ytd_cents - applicable_limit_cents); >0 forces contribution_posture=LOCKED" }
      - { name: invest_threshold_cents, type: integer, source: input, default: 200000, description: "Cash kept liquid; only cash strictly above this is sweepable" }
      - { name: sweep_increment_cents, type: integer, source: input, default: 10000, description: "Sweeps move whole multiples of this increment" }
      - { name: verification_token, type: string, source: system, description: "One-time token minted at open; consumed by the verify endpoint to activate" }

  - name: CoveragePeriod
    parent: HsaAccount
    common_fields: true
    fields:
      - { name: account_id, type: string, source: system, description: "FK -> HsaAccount.id; the account this HDHP coverage attests to" }
      - { name: coverage_tier, type: enum, source: input, description: "SELF_ONLY | FAMILY — HDHP coverage tier for this interval" }
      - { name: effective_month, type: integer, source: input, description: "First covered month index 1..12 within plan_year (inclusive, closed lower bound)" }
      - { name: end_month, type: integer, source: input, description: "Last covered month index 1..12 within plan_year (inclusive, closed upper bound)" }
      - { name: status, type: enum, source: system, description: "ATTESTED | SUPERSEDED — SUPERSEDED periods are excluded from limit math" }

  - name: Contribution
    parent: HsaAccount
    common_fields: true
    fields:
      - { name: account_id, type: string, source: system, description: "FK -> HsaAccount.id; account being funded" }
      - { name: channel, type: enum, source: input, description: "PAYROLL | INDIVIDUAL — PAYROLL requires employer with payroll enabled" }
      - { name: amount_cents, type: integer, source: input, description: "Contribution amount in cents (>0)" }
      - { name: contribution_kind, type: enum, source: input, default: REGULAR, description: "REGULAR | CATCH_UP — CATCH_UP counts against the catch-up sub-limit and requires 55+ eligibility" }
      - { name: status, type: enum, source: system, description: "PENDING -> POSTED -> REVERSED (REVERSED only via excess correction)" }
      - { name: posted_at, type: datetime, source: system, description: "Logical-clock timestamp when moved to POSTED; null while PENDING", default: null }

  - name: InvestmentSweep
    parent: HsaAccount
    common_fields: true
    fields:
      - { name: account_id, type: string, source: system, description: "FK -> HsaAccount.id; account whose cash is swept" }
      - { name: requested_amount_cents, type: integer, source: input, description: "Amount the caller asked to sweep; server clamps to the investable multiple", default: null }
      - { name: swept_amount_cents, type: integer, source: computed, description: "Actual amount moved cash->invested (whole sweep_increment multiple, <= investable_cash)" }
      - { name: status, type: enum, source: system, description: "EXECUTED | UNWOUND — UNWOUND reverses the cash/invested move" }

  - name: Distribution
    parent: HsaAccount
    common_fields: true
    fields:
      - { name: account_id, type: string, source: system, description: "FK -> HsaAccount.id; account funds leave" }
      - { name: method, type: enum, source: input, description: "DEBIT_CARD | REIMBURSEMENT — DEBIT_CARD must clear via a card, REIMBURSEMENT pays the holder" }
      - { name: amount_cents, type: integer, source: input, description: "Distribution amount in cents (>0)" }
      - { name: card_id, type: string, source: input, description: "DebitCard reference id (resolved within the same account at clear time); required when method=DEBIT_CARD, else null. Cards are discoverable via GET /hsa/accounts/{id}/cards.", default: null }
      - { name: substantiation_status, type: enum, source: computed, description: "UNSUBSTANTIATED | QUALIFIED | NONQUALIFIED — set by admin substantiation against receipts" }
      - { name: status, type: enum, source: system, description: "REQUESTED -> CLEARED ; REQUESTED->DENIED ; CLEARED->REVERSED" }
      - { name: receipt_id, type: string, source: input, description: "Receipt reference attached at substantiation time, else null. The authoritative back-link is Receipt.distribution_id, discoverable via GET /hsa/receipts?distribution_id=.", default: null }
      - { name: cleared_by_user_id, type: string, source: system, description: "Opaque X-User-ID of the AccountAdmin who cleared the distribution; null while REQUESTED", default: null }

  - name: Receipt
    parent: null
    common_fields: true
    fields:
      - { name: account_id, type: string, source: input, description: "FK -> HsaAccount.id; vault owner account" }
      - { name: distribution_id, type: string, source: system, description: "FK -> Distribution.id; set when this receipt substantiates a distribution, else null", default: null }
      - { name: merchant, type: string, source: input, description: "Provider/merchant name" }
      - { name: service_date, type: datetime, source: input, description: "ISO date the medical expense was incurred" }
      - { name: amount_cents, type: integer, source: input, description: "Receipt amount in cents (>0)" }
      - { name: is_qualified_medical, type: boolean, source: input, description: "Caller attests the expense is IRS-qualified medical" }
      - { name: status, type: enum, source: system, description: "VAULTED | CONSUMED — CONSUMED once attached to a substantiated distribution" }

  - name: DebitCard
    parent: HsaAccount
    common_fields: true
    fields:
      - { name: account_id, type: string, source: system, description: "FK -> HsaAccount.id; card belongs to this account" }
      - { name: last_four, type: string, source: input, description: "Last four digits (display only)" }
      - { name: status, type: enum, source: system, description: "ISSUED -> ACTIVE -> {SUSPENDED <-> ACTIVE} -> CLOSED" }

  - name: ExcessCorrection
    parent: HsaAccount
    common_fields: true
    fields:
      - { name: account_id, type: string, source: system, description: "FK -> HsaAccount.id; account being corrected" }
      - { name: requested_amount_cents, type: integer, source: input, description: "Amount of excess the holder elects to withdraw (must equal current excess_contribution_cents)" }
      - { name: corrected_amount_cents, type: integer, source: computed, description: "Amount actually removed; equals the excess at execution time" }
      - { name: status, type: enum, source: system, description: "REQUESTED -> COMPLETED ; REQUESTED -> REJECTED" }

  - name: TaxForm
    parent: HsaAccount
    common_fields: false   # immutable snapshot: only id + created_at, no version, no updates
    fields:
      - { name: account_id, type: string, source: system, description: "FK -> HsaAccount.id; account the form reports on" }
      - { name: form_type, type: enum, source: input, description: "FORM_1099_SA (distributions) | FORM_5498_SA (contributions + FMV)" }
      - { name: tax_year, type: integer, source: input, description: "Reporting year (equals plan_year)" }
      - { name: gross_amount_cents, type: integer, source: computed, description: "1099-SA: sum of CLEARED+REVERSED-net distributions; 5498-SA: total POSTED contributions in year" }
      - { name: nonqualified_amount_cents, type: integer, source: computed, description: "1099-SA only: sum of NONQUALIFIED substantiated distributions; 0 for 5498-SA" }
      - { name: fair_market_value_cents, type: integer, source: computed, description: "5498-SA only: cash_balance_cents + invested_balance_cents snapshot at generation; 0 for 1099-SA" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:

  # ---- HsaAccount: PARALLEL state dimensions (lifecycle_status × contribution_posture) ----
  - entity: HsaAccount
    dimension: lifecycle_status
    initial_state: PENDING_VERIFICATION
    terminal_states: [CLOSED]
    transitions:
      - from: PENDING_VERIFICATION
        to: ACTIVE
        trigger: "POST /hsa/accounts/{id}/verify"
        actor: Accountholder
        preconditions:
          - "verification_token in body equals HsaAccount.verification_token (ERR_INVALID_TOKEN)"
          - "At least one ATTESTED CoveragePeriod exists for the account (ERR_HDHP_REQUIRED)"
        side_effects:
          - "lifecycle_status -> ACTIVE"
          - "applicable_limit_cents recomputed (contribution_limit calc)"
          - "contribution_posture recomputed (OPEN unless excess)"

      - from: ACTIVE
        to: FROZEN
        trigger: "POST /hsa/accounts/{id}/freeze"
        actor: AccountAdmin
        preconditions:
          - "lifecycle_status == ACTIVE (ERR_INVALID_STATE)"
        side_effects:
          - "lifecycle_status -> FROZEN"
          - "contribution_posture -> LOCKED (FROZEN forces LOCKED regardless of excess)"

      - from: FROZEN
        to: ACTIVE
        trigger: "POST /hsa/accounts/{id}/unfreeze"
        actor: AccountAdmin
        preconditions:
          - "lifecycle_status == FROZEN (ERR_INVALID_STATE)"
        side_effects:
          - "lifecycle_status -> ACTIVE"
          - "contribution_posture recomputed: OPEN unless excess_contribution_cents > 0"

      - from: ACTIVE
        to: CLOSED
        trigger: "POST /hsa/accounts/{id}/close"
        actor: AccountAdmin
        preconditions:
          - "lifecycle_status == ACTIVE (ERR_INVALID_STATE)"
          - "No Distribution in REQUESTED or CLEARED-unsubstantiated state (ERR_OPEN_DISTRIBUTION)"
        side_effects:
          - "lifecycle_status -> CLOSED"
          - "contribution_posture -> LOCKED"
          - "All ACTIVE DebitCards cascade to CLOSED"

  - entity: HsaAccount
    dimension: contribution_posture
    initial_state: OPEN
    terminal_states: []
    note: |
      Derived dimension. Recomputed (bubble-up) whenever contributions_ytd_cents,
      applicable_limit_cents, or lifecycle_status change. OPEN iff
      lifecycle_status == ACTIVE AND excess_contribution_cents == 0; otherwise LOCKED.
    transitions:
      - from: OPEN
        to: LOCKED
        trigger: "system: excess_contribution_cents becomes > 0 after a POSTED Contribution, OR lifecycle leaves ACTIVE"
        actor: system
        preconditions: []
        side_effects:
          - "New POST /hsa/accounts/{id}/contributions rejected with ERR_POSTURE_LOCKED"
      - from: LOCKED
        to: OPEN
        trigger: "system: excess cleared by a COMPLETED ExcessCorrection while lifecycle ACTIVE"
        actor: system
        preconditions: []
        side_effects:
          - "Contributions accepted again"

  # ---- Contribution: branching with reverse (PENDING -> POSTED, POSTED -> REVERSED) ----
  - entity: Contribution
    dimension: status
    initial_state: PENDING
    terminal_states: [REVERSED]
    transitions:
      - from: PENDING
        to: POSTED
        trigger: "POST /hsa/accounts/{id}/contributions/{contribution_id}/post"
        actor: AccountAdmin
        preconditions:
          - "HsaAccount.lifecycle_status == ACTIVE (ERR_INVALID_STATE)"
          - "HsaAccount.contribution_posture == OPEN at post time (ERR_POSTURE_LOCKED)"
          - "If channel==PAYROLL: Employer.payroll_contributions_enabled == true (ERR_PAYROLL_DISABLED)"
          - "If contribution_kind==CATCH_UP: Accountholder.turns_55_or_older_in_plan_year == true (ERR_CATCHUP_INELIGIBLE)"
        side_effects:
          - "status -> POSTED; posted_at stamped from logical clock"
          - "HsaAccount.cash_balance_cents += amount_cents"
          - "HsaAccount.contributions_ytd_cents recomputed (contribution_accrual calc)"
          - "HsaAccount.excess_contribution_cents recomputed; if >0 -> contribution_posture LOCKED (bubble-up)"

      - from: POSTED
        to: REVERSED
        trigger: "system: a COMPLETED ExcessCorrection reverses the most-recent POSTED contributions to absorb the excess"
        actor: system
        preconditions:
          - "Contribution.status == POSTED"
        side_effects:
          - "status -> REVERSED"
          - "HsaAccount.cash_balance_cents -= amount_cents (compensation; conserves total funds)"
          - "HsaAccount.contributions_ytd_cents recomputed downward"

  # ---- CoveragePeriod: linear (ATTESTED) with system supersede ----
  - entity: CoveragePeriod
    dimension: status
    initial_state: ATTESTED
    terminal_states: [SUPERSEDED]
    transitions:
      - from: ATTESTED
        to: SUPERSEDED
        trigger: "POST /hsa/accounts/{id}/coverage-periods/{coverage_period_id}/supersede"
        actor: AccountAdmin
        preconditions:
          - "CoveragePeriod.status == ATTESTED (ERR_INVALID_STATE)"
          - "HsaAccount.lifecycle_status != CLOSED (ERR_INVALID_STATE)"
        side_effects:
          - "status -> SUPERSEDED (excluded from contribution_limit math)"
          - "HsaAccount.applicable_limit_cents recomputed"
          - "HsaAccount.excess_contribution_cents recomputed; posture re-derived (may LOCK)"

  # ---- PayrollPeriod: linear (SCHEDULED) with cancel ----
  - entity: PayrollPeriod
    dimension: status
    initial_state: SCHEDULED
    terminal_states: [CANCELLED]
    transitions:
      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /hsa/employers/{id}/payroll-periods/{payroll_period_id}/cancel"
        actor: AccountAdmin
        preconditions:
          - "PayrollPeriod.status == SCHEDULED (ERR_INVALID_STATE)"
        side_effects:
          - "status -> CANCELLED (excluded from half-open overlap checks; a new period may reuse the window)"

  # ---- DebitCard: cyclic suspend/resume (ACTIVE <-> SUSPENDED) ----
  - entity: DebitCard
    dimension: status
    initial_state: ISSUED
    terminal_states: [CLOSED]
    transitions:
      - from: ISSUED
        to: ACTIVE
        trigger: "POST /hsa/accounts/{id}/cards/{card_id}/activate"
        actor: Accountholder
        preconditions:
          - "HsaAccount.lifecycle_status == ACTIVE (ERR_INVALID_STATE)"
        side_effects: ["status -> ACTIVE"]
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /hsa/accounts/{id}/cards/{card_id}/suspend"
        actor: Accountholder
        preconditions: ["DebitCard.status == ACTIVE (ERR_INVALID_STATE)"]
        side_effects: ["status -> SUSPENDED"]
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /hsa/accounts/{id}/cards/{card_id}/activate"
        actor: Accountholder
        preconditions: ["DebitCard.status == SUSPENDED (ERR_INVALID_STATE)"]
        side_effects: ["status -> ACTIVE"]
      - from: ACTIVE
        to: CLOSED
        trigger: "POST /hsa/accounts/{id}/cards/{card_id}/close (or cascade from account close)"
        actor: Accountholder
        preconditions: []
        side_effects: ["status -> CLOSED"]
      - from: SUSPENDED
        to: CLOSED
        trigger: "POST /hsa/accounts/{id}/cards/{card_id}/close"
        actor: Accountholder
        preconditions: []
        side_effects: ["status -> CLOSED"]

  # ---- Distribution: branching (REQUESTED -> CLEARED|DENIED) + substantiation + reverse ----
  - entity: Distribution
    dimension: status
    initial_state: REQUESTED
    terminal_states: [DENIED]
    transitions:
      - from: REQUESTED
        to: CLEARED
        trigger: "POST /hsa/accounts/{id}/distributions/{distribution_id}/clear"
        actor: AccountAdmin
        preconditions:
          - "HsaAccount.lifecycle_status == ACTIVE (ERR_INVALID_STATE)"
          - "HsaAccount.cash_balance_cents >= amount_cents (ERR_INSUFFICIENT_CASH)"
          - "If method==DEBIT_CARD: referenced DebitCard.status == ACTIVE (ERR_CARD_NOT_ACTIVE)"
        side_effects:
          - "status -> CLEARED; cleared_by_user_id = acting AccountAdmin X-User-ID"
          - "HsaAccount.cash_balance_cents -= amount_cents"
          - "substantiation_status stays UNSUBSTANTIATED until substantiated"

      - from: REQUESTED
        to: DENIED
        trigger: "POST /hsa/accounts/{id}/distributions/{distribution_id}/deny"
        actor: AccountAdmin
        preconditions:
          - "Distribution.status == REQUESTED (ERR_INVALID_STATE)"
        side_effects:
          - "status -> DENIED (no cash movement)"

      - from: CLEARED
        to: CLEARED
        trigger: "POST /hsa/accounts/{id}/distributions/{distribution_id}/substantiate"
        actor: AccountAdmin
        note: "self-loop: status stays CLEARED; substantiation_status flips. Reimburse-anytime: a VAULTED receipt may attach long after clearing."
        preconditions:
          - "Distribution.status == CLEARED (ERR_INVALID_STATE)"
          - "Distribution.substantiation_status == UNSUBSTANTIATED (ERR_ALREADY_SUBSTANTIATED)"
          - "Acting AccountAdmin X-User-ID must differ from Distribution.cleared_by_user_id (two-person segregation of duties, ERR_SEGREGATION_VIOLATION)"
          - "If receipt_id provided: Receipt.status == VAULTED and Receipt.account_id == account (ERR_RECEIPT_NOT_AVAILABLE)"
          - "If receipt_id provided: Receipt.amount_cents >= Distribution.amount_cents (ERR_RECEIPT_UNDERFUNDED)"
        side_effects:
          - "substantiation_status -> QUALIFIED when a qualifying receipt (is_qualified_medical==true) attached; NONQUALIFIED otherwise"
          - "If receipt attached: Receipt.status -> CONSUMED; Receipt.distribution_id set; Distribution.receipt_id set"

      - from: CLEARED
        to: REVERSED
        trigger: "POST /hsa/accounts/{id}/distributions/{distribution_id}/reverse"
        actor: AccountAdmin
        preconditions:
          - "Distribution.status == CLEARED (ERR_INVALID_STATE)"
        side_effects:
          - "status -> REVERSED"
          - "HsaAccount.cash_balance_cents += amount_cents (compensation; conserves total funds)"
          - "If a Receipt was CONSUMED by substantiation: Receipt.status -> VAULTED; Receipt.distribution_id cleared"

  # ---- InvestmentSweep: EXECUTED with reverse (UNWOUND) ----
  - entity: InvestmentSweep
    dimension: status
    initial_state: EXECUTED
    terminal_states: [UNWOUND]
    transitions:
      - from: EXECUTED
        to: UNWOUND
        trigger: "POST /hsa/accounts/{id}/sweeps/{sweep_id}/unwind"
        actor: AccountAdmin
        preconditions:
          - "InvestmentSweep.status == EXECUTED (ERR_INVALID_STATE)"
        side_effects:
          - "status -> UNWOUND"
          - "HsaAccount.invested_balance_cents -= swept_amount_cents"
          - "HsaAccount.cash_balance_cents += swept_amount_cents (compensation; conserves cash+invested total)"

  # ---- ExcessCorrection: REQUESTED -> COMPLETED|REJECTED ----
  - entity: ExcessCorrection
    dimension: status
    initial_state: REQUESTED
    terminal_states: [COMPLETED, REJECTED]
    transitions:
      - from: REQUESTED
        to: COMPLETED
        trigger: "POST /hsa/accounts/{id}/corrections/{correction_id}/execute"
        actor: AccountAdmin
        preconditions:
          - "HsaAccount.lifecycle_status == ACTIVE (ERR_INVALID_STATE)"
          - "requested_amount_cents == HsaAccount.excess_contribution_cents at execution (ERR_CORRECTION_AMOUNT_MISMATCH)"
          - "excess_contribution_cents > 0 (ERR_NO_EXCESS)"
        side_effects:
          - "status -> COMPLETED; corrected_amount_cents = excess at execution"
          - "Cascade: most-recent POSTED Contributions reversed (POSTED->REVERSED) latest-posted-first until reversed sum >= corrected_amount_cents (excess_correction_sweep calc)"
          - "Each reversal lowers cash_balance_cents and contributions_ytd_cents"
          - "excess_contribution_cents recomputed -> 0; contribution_posture -> OPEN (bubble-up)"

      - from: REQUESTED
        to: REJECTED
        trigger: "POST /hsa/accounts/{id}/corrections/{correction_id}/reject"
        actor: AccountAdmin
        preconditions:
          - "ExcessCorrection.status == REQUESTED (ERR_INVALID_STATE)"
        side_effects:
          - "status -> REJECTED (no ledger movement; excess remains, posture stays LOCKED)"

# -----------------------------------------------------------------------------
# §1.2.1 Concurrency Rules — OCC on HsaAccount.version (the only sanctioned mechanism)
# -----------------------------------------------------------------------------
concurrency_rules:
  - rule_id: sweep-create-stale-account
    parent_entity: HsaAccount
    write_endpoint: "POST /hsa/accounts/{id}/sweeps"
    occ_field: "expected_account_version"
    description: |
      Executing an InvestmentSweep against an HsaAccount whose version has
      advanced since the client last observed it is rejected. A sweep is
      derived from the account's current cash_balance_cents; if another writer
      has just posted a contribution or cleared a distribution (legitimately
      moving cash and bumping the account version), the current writer's view
      of the investable cash is stale and the sweep would move a wrong amount.
    error_id: ERR_STALE_ACCOUNT_VERSION
    http_status: 412

  - rule_id: correction-create-stale-account
    parent_entity: HsaAccount
    write_endpoint: "POST /hsa/accounts/{id}/corrections"
    occ_field: "expected_account_version"
    description: |
      Creating an ExcessCorrection against an HsaAccount whose version has
      advanced since the client last observed it is rejected. The correction's
      requested_amount_cents is keyed to the excess the client saw; if another
      writer has just superseded a CoveragePeriod or posted a contribution
      (changing the applicable limit or contributions and bumping the version),
      the requested amount is stale and would over- or under-correct.
    error_id: ERR_STALE_ACCOUNT_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:

  # -------- DUAL-VARIANT #1 (on HsaAccount): contribution limit ----------------
  - name: contribution_limit
    trigger: "account verify; CoveragePeriod create/supersede; any contribution post; correction execute"
    algorithm: threshold
    formula: |
      Inputs: the set S of ATTESTED CoveragePeriods for the account in plan_year,
      and catch_up_eligible = Accountholder.turns_55_or_older_in_plan_year.
      Per month m in 1..12, monthly_tier_limit[m] =
          FAMILY_MONTHLY  if any ATTESTED period with coverage_tier=FAMILY covers m
          else SELF_MONTHLY if any ATTESTED period covers m   (greatest-tier-per-month rule)
          else 0
      where SELF_MONTHLY = SELF_ANNUAL/12 and FAMILY_MONTHLY = FAMILY_ANNUAL/12 (kept as exact cents*12 numerators).
      A period with effective_month=a, end_month=b covers months a..b inclusive (closed-closed).

      VARIANT selection is fixed by HsaAccount default to LAST_MONTH_RULE.
      base_limit_cents and catch_up_cents are computed per the active variant (see variants).
      applicable_limit_cents = base_limit_cents + (catch_up_cents if catch_up_eligible else 0).
    input_set: "ATTESTED CoveragePeriods only (SUPERSEDED excluded); plan_year fixed on the account."
    constants:
      SELF_ANNUAL: 432000        # cents = $4,320.00
      FAMILY_ANNUAL: 862500      # cents = $8,625.00
      CATCHUP_ANNUAL: 100000     # cents = $1,000.00
    precision: "integer cents; division uses sum-then-floor (see variant PRORATED). round_floor on the final per-variant value."
    variants:
      - name: LAST_MONTH_RULE
        when: "DEFAULT variant for every account. Applies the IRS 'last-month rule': if the account has FAMILY (or SELF) HDHP coverage in month 12, the full annual limit for the greatest December tier applies, undivided."
        difference: |
          base_limit_cents = FAMILY_ANNUAL if month 12 is covered by a FAMILY ATTESTED period,
                             else SELF_ANNUAL if month 12 is covered by any ATTESTED period,
                             else 0.
          catch_up_cents = CATCHUP_ANNUAL (undivided) when catch_up_eligible.
      - name: PRORATED
        when: "Selected only via POST /hsa/accounts/{id}/limit-variant with variant=PRORATED. Sum-of-monthly-proration: each covered month contributes 1/12 of its tier limit."
        difference: |
          base_limit_cents = floor( (sum over m=1..12 of monthly_tier_limit[m]) / 12 ).
          catch_up_cents = floor( CATCHUP_ANNUAL * (count of months with monthly_tier_limit[m] > 0) / 12 ) when catch_up_eligible.
          NOTE: the floor is applied ONCE at the end (sum-then-floor), NOT per-month, so the rounding order is pinned.

  # -------- DUAL-VARIANT #2 (on Distribution): taxable-distribution value -------
  - name: distribution_tax_basis
    trigger: "TaxForm generation for FORM_1099_SA; distribution reverse"
    algorithm: aggregation
    formula: |
      For the plan_year, gross_distributions_cents = sum of amount_cents over Distributions
        whose status is CLEARED (net of those later REVERSED — REVERSED distributions are excluded).
      The taxable portion depends on substantiation_status of each included Distribution.
    input_set: "Distributions with status==CLEARED and NOT later REVERSED, in plan_year."
    constants: {}
    precision: "integer cents; no rounding (pure sums)."
    variants:
      - name: GROSS_REPORTING
        when: "form_type==FORM_1099_SA gross box."
        difference: "value = sum of amount_cents over all included Distributions regardless of substantiation_status."
      - name: TAXABLE_REPORTING
        when: "form_type==FORM_1099_SA taxable box (nonqualified)."
        difference: "value = sum of amount_cents over included Distributions whose substantiation_status == NONQUALIFIED (UNSUBSTANTIATED is treated as NONQUALIFIED for tax reporting)."

  # -------- COMBINATORIAL (a): investable-cash sweep (>=3 inputs, nested floor/min) ---
  - name: investable_cash_sweep
    trigger: "POST /hsa/accounts/{id}/sweeps"
    algorithm: threshold
    formula: |
      excess_cash = max(0, cash_balance_cents - invest_threshold_cents)
      cap_by_request = requested_amount_cents if requested_amount_cents is provided else excess_cash
      sweepable_raw = min(excess_cash, cap_by_request)
      swept_amount_cents = floor(sweepable_raw / sweep_increment_cents) * sweep_increment_cents
      Boundary: cash_balance_cents must be STRICTLY GREATER THAN invest_threshold_cents to
      yield any sweepable amount; at exactly invest_threshold_cents, swept_amount_cents = 0.
      If swept_amount_cents == 0 the sweep is rejected (ERR_NOTHING_TO_SWEEP) and no InvestmentSweep row persists.
    input_set: "single account; reads cash_balance_cents, invest_threshold_cents, sweep_increment_cents, optional requested_amount_cents."
    constants: {}
    precision: "integer cents; floor to whole sweep_increment_cents multiple (>= vs > boundary on the threshold)."

  # -------- COMBINATORIAL (c): contributions accrual w/ pinned evaluation order ----
  - name: contribution_accrual
    trigger: "Contribution post; Contribution reverse (via correction); CoveragePeriod supersede; limit-variant change"
    algorithm: aggregation
    formula: |
      Evaluation order is pinned (the values are mutually dependent, so order is explicit):
        STEP 1: contributions_ytd_cents = sum of amount_cents over Contributions with status==POSTED in plan_year.
        STEP 2: applicable_limit_cents = contribution_limit(active variant)   # depends on coverage, NOT on contributions
        STEP 3: excess_contribution_cents = max(0, contributions_ytd_cents - applicable_limit_cents)
        STEP 4: catch_up sub-limit guard: sum of POSTED CATCH_UP amount_cents must not exceed catch_up_cents
                (checked at post time as ERR_CATCHUP_LIMIT_EXCEEDED, BEFORE STEP 3's general excess).
        STEP 5: contribution_posture = OPEN iff lifecycle_status==ACTIVE AND excess_contribution_cents==0 else LOCKED.
      Because STEP 4 (catch-up guard) is evaluated before STEP 3 (general excess), a contribution that
      breaches BOTH the catch-up sub-limit and the overall limit yields ERR_CATCHUP_LIMIT_EXCEEDED.
    input_set: "POSTED Contributions in plan_year; applicable_limit from contribution_limit."
    constants:
      CATCHUP_ANNUAL: 100000
    precision: "integer cents; no rounding."

  # -------- COMBINATORIAL (a) second-mode anchor + cascade driver: excess correction sweep ----
  - name: excess_correction_sweep
    trigger: "ExcessCorrection execute"
    algorithm: waterfall_allocation
    formula: |
      target = corrected_amount_cents (== excess_contribution_cents at execution).
      Order POSTED Contributions by posted_at DESC, tie-break created_at DESC (latest first).
      Walk the ordered list, marking each POSTED -> REVERSED and accumulating reversed_sum
      until reversed_sum >= target. The LAST contribution touched is reversed in FULL
      (no partial reversal — contributions are atomic), so reversed_sum may exceed target.
      Each reversal: cash_balance_cents -= amount_cents; recompute contributions_ytd_cents.
      After the walk, excess_contribution_cents is recomputed and MUST be 0
      (since reversed_sum >= target and target was the exact excess).
    input_set: "POSTED Contributions in plan_year, ordered posted_at DESC then created_at DESC."
    constants: {}
    precision: "integer cents; whole-contribution granularity (no partial reversal)."

  # -------- aggregation: 5498-SA totals --------------------------------------
  - name: form_5498_totals
    trigger: "TaxForm generation for FORM_5498_SA"
    algorithm: aggregation
    formula: |
      gross_amount_cents = sum of amount_cents over Contributions with status==POSTED in tax_year.
      fair_market_value_cents = cash_balance_cents + invested_balance_cents (snapshot at generation time).
      nonqualified_amount_cents = 0 for 5498-SA.
    input_set: "POSTED Contributions in tax_year; live account balances at generation."
    constants: {}
    precision: "integer cents; pure sums + snapshot."

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role header present and is one of the declared roles"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all

  - priority: 2
    category: auth
    check: "Role is permitted for this operation per §1.7 RBAC"
    error_id: ERR_FORBIDDEN
    http_status: 403
    applies_to: all

  - priority: 3
    category: existence
    check: "Every id in the path exists and child belongs to the path's account (left-to-right)"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: all

  - priority: 4
    category: business_referential
    check: "Acting Accountholder (X-User-ID) must own the HsaAccount for holder-scoped writes (request, verify, card ops)"
    error_id: ERR_NOT_ACCOUNT_OWNER
    http_status: 403
    applies_to: "holder-scoped account operations"

  - priority: 5
    category: business_constraint
    check: "Required body fields present and well-typed; amounts are positive integers; enums valid"
    error_id: ERR_INVALID_REQUEST
    http_status: 422
    applies_to: all write endpoints

  - priority: 6
    category: state
    check: "Target resource is in a state from which this transition is defined"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: all transition endpoints

  - priority: 7
    category: business_referential
    check: "Segregation of duties: the AccountAdmin substantiating a Distribution must not equal the AccountAdmin who cleared it (Distribution.cleared_by_user_id)"
    error_id: ERR_SEGREGATION_VIOLATION
    http_status: 409
    applies_to: "POST /hsa/accounts/{id}/distributions/{id}/substantiate"

  # ---- business_safety/compliance group (regulatory eligibility) precedes fiscal ----
  - priority: 8
    category: business_safety
    check: "Account activation requires at least one ATTESTED CoveragePeriod (HDHP eligibility)"
    error_id: ERR_HDHP_REQUIRED
    http_status: 409
    applies_to: "POST /hsa/accounts/{id}/verify"

  - priority: 9
    category: business_safety
    check: "CATCH_UP contribution requires accountholder 55+ in plan_year"
    error_id: ERR_CATCHUP_INELIGIBLE
    http_status: 409
    applies_to: "POST /hsa/accounts/{id}/contributions/{id}/post"

  - priority: 10
    category: business_safety
    check: "PAYROLL channel requires the account's Employer to have payroll_contributions_enabled==true"
    error_id: ERR_PAYROLL_DISABLED
    http_status: 409
    applies_to: "POST /hsa/accounts/{id}/contributions/{id}/post"

  - priority: 11
    category: business_constraint
    check: "contribution_posture must be OPEN to post a contribution (LOCKED when excess exists or lifecycle not ACTIVE)"
    error_id: ERR_POSTURE_LOCKED
    http_status: 409
    applies_to: "POST /hsa/accounts/{id}/contributions/{id}/post"

  - priority: 12
    category: business_temporal
    check: "CoveragePeriod months are 1..12, effective_month <= end_month, and must not overlap an existing ATTESTED period on the same account (CLOSED-CLOSED interval overlap: two periods overlap iff a.effective_month <= b.end_month AND b.effective_month <= a.end_month; adjacency where one ends at month m and the next begins at m+1 is allowed)"
    error_id: ERR_COVERAGE_OVERLAP
    http_status: 409
    applies_to: "POST /hsa/accounts/{id}/coverage-periods"

  - priority: 12b
    category: business_temporal
    check: "PayrollPeriod days satisfy 1 <= period_start_day < period_end_day <= 366, and the half-open window [period_start_day, period_end_day) must not overlap an existing SCHEDULED PayrollPeriod on the same employer (HALF-OPEN interval overlap: two periods overlap iff a.start < b.end AND b.start < a.end; a period ending at day d and the next starting at day d share NO point and are allowed, but sharing a boundary that falls inside a half-open window IS an overlap)"
    error_id: ERR_PAYROLL_PERIOD_OVERLAP
    http_status: 409
    applies_to: "POST /hsa/employers/{id}/payroll-periods"

  # ---- fiscal group (catch-up sub-limit checked BEFORE general excess) ----
  - priority: 13
    category: business_fiscal
    check: "Posting a CATCH_UP contribution must not push POSTED catch-up sum above catch_up_cents sub-limit"
    error_id: ERR_CATCHUP_LIMIT_EXCEEDED
    http_status: 409
    applies_to: "POST /hsa/accounts/{id}/contributions/{id}/post"

  - priority: 14
    category: business_fiscal
    check: "Clearing a Distribution requires cash_balance_cents >= amount_cents"
    error_id: ERR_INSUFFICIENT_CASH
    http_status: 409
    applies_to: "POST /hsa/accounts/{id}/distributions/{id}/clear"

  - priority: 15
    category: business_fiscal
    check: "Sweep must yield a positive whole-increment swept amount (cash strictly above invest_threshold by >= one increment)"
    error_id: ERR_NOTHING_TO_SWEEP
    http_status: 409
    applies_to: "POST /hsa/accounts/{id}/sweeps"

  - priority: 17
    category: business_fiscal
    check: "Correction requested_amount_cents must equal current excess_contribution_cents and excess must be > 0"
    error_id: ERR_CORRECTION_AMOUNT_MISMATCH
    http_status: 409
    applies_to: "POST /hsa/accounts/{id}/corrections/{id}/execute"

  - priority: 18
    category: business_referential
    check: "DEBIT_CARD distribution must reference a card on the account in ACTIVE status at clear time"
    error_id: ERR_CARD_NOT_ACTIVE
    http_status: 409
    applies_to: "POST /hsa/accounts/{id}/distributions/{id}/clear"

  - priority: 19
    category: business_referential
    check: "Substantiating receipt must be VAULTED, belong to the account, and cover the distribution amount"
    error_id: ERR_RECEIPT_NOT_AVAILABLE
    http_status: 409
    applies_to: "POST /hsa/accounts/{id}/distributions/{id}/substantiate"

  - priority: 20
    category: concurrency
    check: "expected_account_version must equal current HsaAccount.version on OCC-guarded writes"
    error_id: ERR_STALE_ACCOUNT_VERSION
    http_status: 412
    applies_to: "POST /hsa/accounts/{id}/sweeps, POST /hsa/accounts/{id}/corrections"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:

  # ---- reference entities ----
  - method: POST
    path: "/hsa/accountholders"
    description: "Create an Accountholder"
    roles: [AccountAdmin]
    code: 201
    input: [full_name, email, date_of_birth]
    output: Accountholder
    side_effects: ["turns_55_or_older_in_plan_year computed lazily on account verify"]

  - method: GET
    path: "/hsa/accountholders/{id}"
    description: "Get an Accountholder"
    roles: [AccountAdmin, Accountholder]
    code: 200
    input: []
    output: Accountholder
    side_effects: []

  - method: POST
    path: "/hsa/employers"
    description: "Create an Employer (payroll sponsor)"
    roles: [AccountAdmin]
    code: 201
    input: [name, "payroll_contributions_enabled?"]
    output: Employer
    side_effects: []

  - method: GET
    path: "/hsa/employers/{id}"
    description: "Get an Employer"
    roles: [AccountAdmin, Accountholder]
    code: 200
    input: []
    output: Employer
    side_effects: []

  - method: PATCH
    path: "/hsa/employers/{id}"
    description: "Toggle payroll_contributions_enabled on an Employer"
    roles: [AccountAdmin]
    code: 200
    input: [payroll_contributions_enabled]
    output: Employer
    side_effects: ["payroll-channel contribution posting gated by this flag"]

  # ---- PayrollPeriod (half-open day intervals under an Employer) ----
  - method: POST
    path: "/hsa/employers/{id}/payroll-periods"
    description: "Schedule a payroll period (half-open [start, end) day window) for an employer"
    roles: [AccountAdmin]
    code: 201
    input: [period_start_day, period_end_day]
    output: PayrollPeriod
    side_effects: ["status=SCHEDULED; rejected if half-open window overlaps an existing SCHEDULED period"]

  - method: GET
    path: "/hsa/employers/{id}/payroll-periods"
    description: "List payroll periods for an employer (reverse-reachability for employer_id FK)"
    roles: [AccountAdmin]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: PayrollPeriod[]
    side_effects: []

  - method: POST
    path: "/hsa/employers/{id}/payroll-periods/{payroll_period_id}/cancel"
    description: "Cancel a SCHEDULED payroll period (frees its window)"
    roles: [AccountAdmin]
    code: 200
    input: []
    output: PayrollPeriod
    side_effects: ["status -> CANCELLED"]

  # ---- HsaAccount ----
  - method: POST
    path: "/hsa/accounts"
    description: "Open an HSA in PENDING_VERIFICATION; mints verification_token"
    roles: [AccountAdmin]
    code: 201
    input: [accountholder_id, "employer_id?", plan_year, "invest_threshold_cents?", "sweep_increment_cents?"]
    output: HsaAccount
    side_effects:
      - "lifecycle_status=PENDING_VERIFICATION; contribution_posture=LOCKED until ACTIVE"
      - "balances + contributions_ytd_cents + applicable_limit_cents initialized to 0"
      - "verification_token minted"

  - method: GET
    path: "/hsa/accounts/{id}"
    description: "Get an HSA with all derived balances and postures"
    roles: [AccountAdmin, Accountholder]
    code: 200
    input: []
    output: HsaAccount
    side_effects: []

  - method: GET
    path: "/hsa/accounts"
    description: "List HSAs, optionally filtered by accountholder_id or employer_id (reverse-reachability for both FKs)"
    roles: [AccountAdmin]
    code: 200
    input: ["accountholder_id?", "employer_id?", "limit?", "offset?"]
    output: HsaAccount[]
    side_effects: []

  - method: POST
    path: "/hsa/accounts/{id}/verify"
    description: "Activate a PENDING_VERIFICATION HSA"
    roles: [Accountholder]
    code: 200
    input: [verification_token]
    output: HsaAccount
    side_effects:
      - "lifecycle_status -> ACTIVE"
      - "applicable_limit_cents recomputed; contribution_posture re-derived"

  - method: POST
    path: "/hsa/accounts/{id}/freeze"
    description: "Freeze an ACTIVE HSA"
    roles: [AccountAdmin]
    code: 200
    input: []
    output: HsaAccount
    side_effects: ["lifecycle_status -> FROZEN; contribution_posture -> LOCKED"]

  - method: POST
    path: "/hsa/accounts/{id}/unfreeze"
    description: "Return a FROZEN HSA to ACTIVE"
    roles: [AccountAdmin]
    code: 200
    input: []
    output: HsaAccount
    side_effects: ["lifecycle_status -> ACTIVE; posture re-derived (LOCKED if excess)"]

  - method: POST
    path: "/hsa/accounts/{id}/close"
    description: "Close an ACTIVE HSA"
    roles: [AccountAdmin]
    code: 200
    input: []
    output: HsaAccount
    side_effects:
      - "lifecycle_status -> CLOSED; posture -> LOCKED"
      - "Cascade: ACTIVE DebitCards -> CLOSED"

  - method: POST
    path: "/hsa/accounts/{id}/limit-variant"
    description: "Set the active contribution_limit variant for the account (LAST_MONTH_RULE default | PRORATED)"
    roles: [AccountAdmin]
    code: 200
    input: [variant]
    output: HsaAccount
    side_effects:
      - "applicable_limit_cents recomputed under the chosen variant"
      - "excess_contribution_cents recomputed; posture re-derived (may LOCK or OPEN)"

  # ---- CoveragePeriod ----
  - method: POST
    path: "/hsa/accounts/{id}/coverage-periods"
    description: "Attest an HDHP coverage interval for the plan_year"
    roles: [AccountAdmin]
    code: 201
    input: [coverage_tier, effective_month, end_month]
    output: CoveragePeriod
    side_effects:
      - "status=ATTESTED"
      - "applicable_limit_cents recomputed; posture re-derived"

  - method: GET
    path: "/hsa/accounts/{id}/coverage-periods"
    description: "List CoveragePeriods for an account (reverse-reachability for account_id FK)"
    roles: [AccountAdmin, Accountholder]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: CoveragePeriod[]
    side_effects: []

  - method: POST
    path: "/hsa/accounts/{id}/coverage-periods/{coverage_period_id}/supersede"
    description: "Mark a CoveragePeriod SUPERSEDED (excluded from limit math)"
    roles: [AccountAdmin]
    code: 200
    input: []
    output: CoveragePeriod
    side_effects:
      - "status -> SUPERSEDED"
      - "applicable_limit_cents recomputed; excess + posture re-derived"

  # ---- Contribution ----
  - method: POST
    path: "/hsa/accounts/{id}/contributions"
    description: "Create a PENDING contribution"
    roles: [AccountAdmin, Employer]
    code: 201
    input: [channel, amount_cents, "contribution_kind?"]
    output: Contribution
    side_effects: ["status=PENDING; no ledger movement yet"]

  - method: GET
    path: "/hsa/accounts/{id}/contributions"
    description: "List contributions for an account (reverse-reachability for account_id FK)"
    roles: [AccountAdmin, Accountholder, Employer]
    code: 200
    input: ["status?", "channel?", "limit?", "offset?"]
    output: Contribution[]
    side_effects: []

  - method: POST
    path: "/hsa/accounts/{id}/contributions/{contribution_id}/post"
    description: "Post a PENDING contribution (credits cash, runs IRS guardrail)"
    roles: [AccountAdmin]
    code: 200
    input: []
    output: Contribution
    side_effects:
      - "status -> POSTED; posted_at stamped"
      - "cash_balance_cents += amount_cents; contributions_ytd_cents recomputed"
      - "excess + posture re-derived (may LOCK)"

  # ---- InvestmentSweep (OCC-guarded) ----
  - method: POST
    path: "/hsa/accounts/{id}/sweeps"
    description: "Sweep investable cash above invest_threshold into investments"
    roles: [AccountAdmin, Accountholder]
    code: 201
    input: ["requested_amount_cents?", expected_account_version]
    output: InvestmentSweep
    side_effects:
      - "swept_amount_cents computed (investable_cash_sweep calc)"
      - "cash_balance_cents -= swept_amount_cents; invested_balance_cents += swept_amount_cents"
      - "increments HsaAccount.version by 1"

  - method: GET
    path: "/hsa/accounts/{id}/sweeps"
    description: "List sweeps for an account (reverse-reachability for account_id FK)"
    roles: [AccountAdmin, Accountholder]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: InvestmentSweep[]
    side_effects: []

  - method: POST
    path: "/hsa/accounts/{id}/sweeps/{sweep_id}/unwind"
    description: "Reverse an EXECUTED sweep back to cash"
    roles: [AccountAdmin]
    code: 200
    input: []
    output: InvestmentSweep
    side_effects:
      - "status -> UNWOUND"
      - "invested_balance_cents -= swept_amount_cents; cash_balance_cents += swept_amount_cents"

  # ---- DebitCard ----
  - method: POST
    path: "/hsa/accounts/{id}/cards"
    description: "Issue a debit card (ISSUED)"
    roles: [AccountAdmin, Accountholder]
    code: 201
    input: [last_four]
    output: DebitCard
    side_effects: ["status=ISSUED"]

  - method: GET
    path: "/hsa/accounts/{id}/cards"
    description: "List cards for an account (reverse-reachability for account_id FK)"
    roles: [AccountAdmin, Accountholder]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: DebitCard[]
    side_effects: []

  - method: POST
    path: "/hsa/accounts/{id}/cards/{card_id}/activate"
    description: "Activate a card (ISSUED or SUSPENDED -> ACTIVE)"
    roles: [Accountholder]
    code: 200
    input: []
    output: DebitCard
    side_effects: ["status -> ACTIVE"]

  - method: POST
    path: "/hsa/accounts/{id}/cards/{card_id}/suspend"
    description: "Suspend an ACTIVE card"
    roles: [Accountholder]
    code: 200
    input: []
    output: DebitCard
    side_effects: ["status -> SUSPENDED"]

  - method: POST
    path: "/hsa/accounts/{id}/cards/{card_id}/close"
    description: "Close a card (terminal)"
    roles: [Accountholder]
    code: 200
    input: []
    output: DebitCard
    side_effects: ["status -> CLOSED"]

  # ---- Receipt vault (top-level collection) ----
  - method: POST
    path: "/hsa/receipts"
    description: "Vault a receipt for an account (reimburse-anytime)"
    roles: [Accountholder, AccountAdmin]
    code: 201
    input: [account_id, merchant, service_date, amount_cents, is_qualified_medical]
    output: Receipt
    side_effects: ["status=VAULTED"]

  - method: GET
    path: "/hsa/receipts/{id}"
    description: "Get a vaulted receipt"
    roles: [Accountholder, AccountAdmin]
    code: 200
    input: []
    output: Receipt
    side_effects: []

  - method: GET
    path: "/hsa/receipts"
    description: "List receipts filtered by account_id or distribution_id (reverse-reachability for both FKs)"
    roles: [Accountholder, AccountAdmin]
    code: 200
    input: ["account_id?", "distribution_id?", "status?", "limit?", "offset?"]
    output: Receipt[]
    side_effects: []

  # ---- Distribution ----
  - method: POST
    path: "/hsa/accounts/{id}/distributions"
    description: "Request a distribution (REQUESTED)"
    roles: [Accountholder]
    code: 201
    input: [method, amount_cents, "card_id?"]
    output: Distribution
    side_effects: ["status=REQUESTED; substantiation_status=UNSUBSTANTIATED; cleared_by_user_id=null"]

  - method: GET
    path: "/hsa/accounts/{id}/distributions"
    description: "List distributions for an account (reverse-reachability for account_id FK)"
    roles: [AccountAdmin, Accountholder]
    code: 200
    input: ["status?", "substantiation_status?", "limit?", "offset?"]
    output: Distribution[]
    side_effects: []

  - method: POST
    path: "/hsa/accounts/{id}/distributions/{distribution_id}/clear"
    description: "Clear a REQUESTED distribution (debits cash)"
    roles: [AccountAdmin]
    code: 200
    input: []
    output: Distribution
    side_effects:
      - "status -> CLEARED; cash_balance_cents -= amount_cents"
      - "cleared_by_user_id = acting AccountAdmin X-User-ID"

  - method: POST
    path: "/hsa/accounts/{id}/distributions/{distribution_id}/deny"
    description: "Deny a REQUESTED distribution (no ledger movement)"
    roles: [AccountAdmin]
    code: 200
    input: []
    output: Distribution
    side_effects: ["status -> DENIED"]

  - method: POST
    path: "/hsa/accounts/{id}/distributions/{distribution_id}/substantiate"
    description: "Substantiate a CLEARED distribution against a vaulted receipt (must be a different admin than cleared it)"
    roles: [AccountAdmin]
    code: 200
    input: ["receipt_id?"]
    output: Distribution
    side_effects:
      - "substantiation_status -> QUALIFIED|NONQUALIFIED"
      - "If receipt attached: Receipt.status -> CONSUMED; Receipt.distribution_id set"

  - method: POST
    path: "/hsa/accounts/{id}/distributions/{distribution_id}/reverse"
    description: "Reverse a CLEARED distribution (refunds cash; releases receipt)"
    roles: [AccountAdmin]
    code: 200
    input: []
    output: Distribution
    side_effects:
      - "status -> REVERSED; cash_balance_cents += amount_cents"
      - "Any CONSUMED receipt -> VAULTED; distribution_id cleared"

  # ---- ExcessCorrection (OCC-guarded create) ----
  - method: POST
    path: "/hsa/accounts/{id}/corrections"
    description: "Request an excess-contribution correction"
    roles: [AccountAdmin, Accountholder]
    code: 201
    input: [requested_amount_cents, expected_account_version]
    output: ExcessCorrection
    side_effects:
      - "status=REQUESTED"
      - "increments HsaAccount.version by 1"

  - method: GET
    path: "/hsa/accounts/{id}/corrections"
    description: "List corrections for an account (reverse-reachability for account_id FK)"
    roles: [AccountAdmin, Accountholder]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: ExcessCorrection[]
    side_effects: []

  - method: POST
    path: "/hsa/accounts/{id}/corrections/{correction_id}/execute"
    description: "Execute a correction: reverse latest POSTED contributions to absorb the excess"
    roles: [AccountAdmin]
    code: 200
    input: []
    output: ExcessCorrection
    side_effects:
      - "status -> COMPLETED; corrected_amount_cents set"
      - "Cascade: POSTED Contributions reversed latest-first (excess_correction_sweep calc)"
      - "cash + contributions_ytd lowered; excess -> 0; posture -> OPEN"

  - method: POST
    path: "/hsa/accounts/{id}/corrections/{correction_id}/reject"
    description: "Reject a REQUESTED correction (no ledger movement)"
    roles: [AccountAdmin]
    code: 200
    input: []
    output: ExcessCorrection
    side_effects: ["status -> REJECTED"]

  # ---- TaxForm ----
  - method: POST
    path: "/hsa/accounts/{id}/tax-forms"
    description: "Generate an immutable tax form snapshot (1099-SA or 5498-SA)"
    roles: [AccountAdmin]
    code: 201
    input: [form_type, tax_year]
    output: TaxForm
    side_effects:
      - "gross_amount_cents, nonqualified_amount_cents, fair_market_value_cents computed at generation"

  - method: GET
    path: "/hsa/accounts/{id}/tax-forms"
    description: "List tax forms for an account (reverse-reachability for account_id FK)"
    roles: [AccountAdmin, Accountholder]
    code: 200
    input: ["form_type?", "tax_year?", "limit?", "offset?"]
    output: TaxForm[]
    side_effects: []

  - method: GET
    path: "/hsa/accounts/{id}/tax-forms/{tax_form_id}"
    description: "Get a specific tax form snapshot"
    roles: [AccountAdmin, Accountholder]
    code: 200
    input: []
    output: TaxForm
    side_effects: []

  # ---- test-driving: logical clock ----
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the logical server clock. Server startup default is 2026-01-01T00:00:00Z; before any call the clock reads exactly this default and never falls back to wall-clock time. Governs posted_at stamping and all date-derived fields."
    roles: [AccountAdmin]
    code: 200
    input: [to_iso8601]
    output: null
    side_effects: ["logical clock advanced to to_iso8601 for subsequent posted_at stamps and date math"]

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "X-User-Role header missing or not a declared role"
  - id: ERR_FORBIDDEN
    http: 403
    condition: "Role not permitted for this operation"
  - id: ERR_NOT_ACCOUNT_OWNER
    http: 403
    condition: "Acting Accountholder is not the owner of the target HSA for a holder-scoped operation"
  - id: ERR_NOT_FOUND
    http: 404
    condition: "A path id does not exist or child does not belong to the path account"
  - id: ERR_INVALID_REQUEST
    http: 422
    condition: "Missing/invalid body field, non-positive amount, or invalid enum"
  - id: ERR_INVALID_STATE
    http: 409
    condition: "Resource not in a state from which this transition is defined"
  - id: ERR_INVALID_TOKEN
    http: 409
    condition: "verification_token does not match the account's token"
  - id: ERR_HDHP_REQUIRED
    http: 409
    condition: "Account verify attempted with no ATTESTED CoveragePeriod"
  - id: ERR_COVERAGE_OVERLAP
    http: 409
    condition: "CoveragePeriod overlaps an existing ATTESTED period (closed-closed) or has bad month bounds"
  - id: ERR_PAYROLL_PERIOD_OVERLAP
    http: 409
    condition: "PayrollPeriod half-open window overlaps an existing SCHEDULED period on the employer, or has bad day bounds"
  - id: ERR_PAYROLL_DISABLED
    http: 409
    condition: "PAYROLL contribution but Employer.payroll_contributions_enabled is false"
  - id: ERR_CATCHUP_INELIGIBLE
    http: 409
    condition: "CATCH_UP contribution but accountholder not 55+ in plan_year"
  - id: ERR_CATCHUP_LIMIT_EXCEEDED
    http: 409
    condition: "Posting CATCH_UP would push POSTED catch-up sum above the catch-up sub-limit"
  - id: ERR_POSTURE_LOCKED
    http: 409
    condition: "Contribution post blocked because contribution_posture is LOCKED"
  - id: ERR_SEGREGATION_VIOLATION
    http: 409
    condition: "AccountAdmin clearing a distribution is the same identity as the requesting Accountholder"
  - id: ERR_INSUFFICIENT_CASH
    http: 409
    condition: "Distribution clear requires cash_balance_cents >= amount_cents"
  - id: ERR_NOTHING_TO_SWEEP
    http: 409
    condition: "Sweep yields zero whole-increment investable amount"
  - id: ERR_CARD_NOT_ACTIVE
    http: 409
    condition: "DEBIT_CARD distribution clear references a card not in ACTIVE status"
  - id: ERR_RECEIPT_NOT_AVAILABLE
    http: 409
    condition: "Substantiation receipt is not VAULTED, not on this account, or absent"
  - id: ERR_RECEIPT_UNDERFUNDED
    http: 409
    condition: "Substantiation receipt amount is less than the distribution amount"
  - id: ERR_ALREADY_SUBSTANTIATED
    http: 409
    condition: "Distribution already substantiated"
  - id: ERR_OPEN_DISTRIBUTION
    http: 409
    condition: "Account close blocked by a REQUESTED or CLEARED-unsubstantiated distribution"
  - id: ERR_NO_EXCESS
    http: 409
    condition: "Correction execute attempted when excess_contribution_cents is 0"
  - id: ERR_CORRECTION_AMOUNT_MISMATCH
    http: 409
    condition: "Correction requested_amount_cents does not equal current excess_contribution_cents"
  - id: ERR_STALE_ACCOUNT_VERSION
    http: 412
    condition: "expected_account_version does not equal current HsaAccount.version on an OCC-guarded write"

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: Accountholder
    description: "The HSA owner; opens distributions, manages own cards, vaults receipts, verifies the account, may request corrections."
    identity: "entity_backed:Accountholder"
    exclusive_operations:
      - "POST /hsa/accounts/{id}/verify — activate own account"
      - "POST /hsa/accounts/{id}/distributions — request a distribution"
      - "POST /hsa/accounts/{id}/cards/{id}/activate — activate own card"
      - "POST /hsa/accounts/{id}/cards/{id}/suspend — suspend own card"
      - "POST /hsa/accounts/{id}/cards/{id}/close — close own card"
    shared_operations:
      - "POST /hsa/accounts/{id}/sweeps (with AccountAdmin)"
      - "POST /hsa/accounts/{id}/cards (with AccountAdmin)"
      - "POST /hsa/receipts (with AccountAdmin)"
      - "POST /hsa/accounts/{id}/corrections (with AccountAdmin)"
      - "GET reads on own account, coverage-periods, contributions, distributions, cards, sweeps, corrections, tax-forms, receipts"

  - name: Employer
    description: "Payroll sponsor; may create PAYROLL contributions on accounts it sponsors. Cannot post or clear."
    identity: "entity_backed:Employer"
    exclusive_operations: []
    shared_operations:
      - "POST /hsa/accounts/{id}/contributions (PAYROLL channel; shared create surface with AccountAdmin)"
      - "GET /hsa/accounts/{id}/contributions (read sponsored-account contributions)"

  - name: AccountAdmin
    description: "Custodian/operator. Opens accounts and reference data, posts contributions, clears/denies/substantiates/reverses distributions, runs sweep-unwind, executes corrections, generates tax forms, freezes/closes accounts. Bound by segregation of duties on distribution clearing."
    identity: "opaque"
    exclusive_operations:
      - "POST /hsa/accountholders, POST /hsa/employers, PATCH /hsa/employers/{id}"
      - "POST /hsa/accounts — open account"
      - "POST /hsa/accounts/{id}/freeze | /unfreeze | /close | /limit-variant"
      - "POST /hsa/accounts/{id}/coverage-periods | .../supersede"
      - "POST /hsa/accounts/{id}/contributions/{id}/post"
      - "POST /hsa/accounts/{id}/distributions/{id}/clear | /deny | /substantiate | /reverse"
      - "POST /hsa/accounts/{id}/sweeps/{id}/unwind"
      - "POST /hsa/accounts/{id}/corrections/{id}/execute | /reject"
      - "POST /hsa/accounts/{id}/tax-forms"
      - "POST /_clock/set_current_utc"
    shared_operations:
      - "POST /hsa/accounts/{id}/contributions (create; with Employer)"
      - "POST /hsa/accounts/{id}/sweeps, POST /hsa/accounts/{id}/cards, POST /hsa/receipts, POST /hsa/accounts/{id}/corrections (with Accountholder)"
      - "GET reads across all resources"
