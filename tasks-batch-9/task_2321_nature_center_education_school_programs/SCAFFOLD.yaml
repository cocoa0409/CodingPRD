roles:
  - name: EducationDirector
    description: "Owns the education program: hires and clears educators, decides catalog reviews, accepts evaluations, and drives the logical clock in test setups"
    identity: "opaque"
    exclusive_operations:
      - "POST /nature-center/program-offerings/{id}/review"
      - "POST /nature-center/program-offerings/{id}/retire"
      - "POST /nature-center/educators"
      - "POST /nature-center/educators/{id}/advance-hiring"
      - "POST /nature-center/training-records/{id}/reenroll"
      - "POST /nature-center/evaluation-reports/{id}/review"
      - "POST /_clock/set_current_utc"
    shared_operations:
      - "POST /nature-center/schools"
      - "POST /nature-center/educators/{id}/training-records"
      - "POST /nature-center/training-records/{id}/assess"
      - "every GET endpoint except GET /nature-center/scholarship-funds/{id} filters"
  - name: CurriculumSpecialist
    description: "Authors program offerings, standard alignments and curriculum materials, and assesses curriculum training"
    identity: "opaque"
    exclusive_operations:
      - "POST /nature-center/program-offerings"
      - "POST /nature-center/program-offerings/{id}/standard-alignments"
      - "POST /nature-center/program-offerings/{id}/materials"
      - "POST /nature-center/curriculum-materials/{id}/publish"
      - "POST /nature-center/program-offerings/{id}/submit-for-review"
    shared_operations:
      - "POST /nature-center/educators/{id}/training-records"
      - "POST /nature-center/training-records/{id}/assess"
      - "GET /nature-center/program-offerings, GET /nature-center/program-offerings/{id} and its sub-resources"
      - "GET /nature-center/educators/{id}/training-records"
  - name: BookingCoordinator
    description: "Runs the booking desk: creates bookings, assigns resources, confirms, diverts, delivers and invoices"
    identity: "opaque"
    exclusive_operations:
      - "POST /nature-center/bookings/{id}/assign-resources"
      - "POST /nature-center/bookings/{id}/confirm"
      - "POST /nature-center/bookings/{id}/rain-divert"
      - "POST /nature-center/bookings/{id}/no-show"
      - "POST /nature-center/bookings/{id}/equipment-manifests"
      - "POST /nature-center/equipment-manifests/{id}/advance"
      - "POST /nature-center/bookings/{id}/record-payment"
    shared_operations:
      - "POST /nature-center/schools"
      - "POST /nature-center/bookings"
      - "POST /nature-center/bookings/{id}/deliver"
      - "POST /nature-center/bookings/{id}/cancel"
      - "POST /nature-center/aid-applications"
      - "GET /nature-center/bookings, GET /nature-center/bookings/{id}, GET /nature-center/animals, GET /nature-center/trail-segments/{id}, GET /nature-center/scholarship-funds/{id}"
  - name: StewardshipManager
    description: "Owns permits, animal ambassador care and trail/habitat management"
    identity: "opaque"
    exclusive_operations:
      - "POST /nature-center/permits"
      - "POST /nature-center/permits/{id}/set-status"
      - "POST /nature-center/animals"
      - "POST /nature-center/animals/{id}/set-care-status"
      - "POST /nature-center/trail-segments"
      - "POST /nature-center/trail-segments/{id}/set-status"
    shared_operations:
      - "GET /nature-center/permits/{id}, GET /nature-center/animals, GET /nature-center/animals/{id}, GET /nature-center/trail-segments/{id}"
  - name: GrantsOfficer
    description: "Owns funder pools: opens and freezes funds, decides aid applications and reads outcome reports"
    identity: "opaque"
    exclusive_operations:
      - "POST /nature-center/scholarship-funds"
      - "POST /nature-center/scholarship-funds/{id}/set-status"
      - "POST /nature-center/aid-applications/{id}/review"
    shared_operations:
      - "GET /nature-center/scholarship-funds/{id}"
      - "GET /nature-center/scholarship-funds/{id}/outcome-report"
      - "GET /nature-center/aid-applications, GET /nature-center/aid-applications/{id}"
      - "GET /nature-center/bookings, GET /nature-center/schools/{id}"
  - name: Naturalist
    description: "A cleared educator acting on their own assigned bookings; X-User-ID is an Educator.id"
    identity: "entity_backed:Educator"
    exclusive_operations: []
    shared_operations:
      - "POST /nature-center/bookings/{id}/deliver (only when Booking.lead_educator_id equals X-User-ID)"
      - "GET /nature-center/bookings/{id}, GET /nature-center/educators/{id}, GET /nature-center/educators/{id}/training-records, GET /nature-center/animals, GET /nature-center/animals/{id}"
  - name: TeacherContact
    description: "A teacher acting for their own school; X-User-ID is a SchoolPartner.id"
    identity: "entity_backed:SchoolPartner"
    exclusive_operations:
      - "POST /nature-center/bookings/{id}/evaluation-reports"
      - "POST /nature-center/evaluation-reports/{id}/submit"
    shared_operations:
      - "POST /nature-center/bookings (only for their own school_id)"
      - "POST /nature-center/bookings/{id}/cancel"
      - "POST /nature-center/aid-applications"
      - "GET /nature-center/program-offerings, GET /nature-center/program-offerings/{id}, GET /nature-center/program-offerings/{id}/materials, GET /nature-center/bookings/{id}, GET /nature-center/bookings/{id}/evaluation-reports, GET /nature-center/aid-applications/{id}"
