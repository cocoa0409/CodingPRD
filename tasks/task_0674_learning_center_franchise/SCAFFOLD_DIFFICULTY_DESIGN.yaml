            - call: "POST /centers"
              payload: { name: "CV2", territory_code: "TER-V2", instructor_ratio_cap: 6 }
              as: FranchiseAdmin
              captures: { c_id: $.data.id }
            - call: "POST /franchise-agreements"
              payload: { center_id: "${c_id}", royalty_basis: "ROYALTY_FLOOR" }
              as: FranchiseAdmin
              captures: { ag_id: $.data.id }
            - call: "POST /franchise-agreements/${ag_id}/activate"
              payload: {}
              as: FranchiseAdmin
            - call: "POST /centers/${c_id}/activate"
              payload: {}
              as: FranchiseAdmin
            - call: "POST /subjects"
              payload: { center_id: "${c_id}", name: "MATH", code: "MATH" }
              as: FranchiseAdmin
              captures: { subj_id: $.data.id }
            - call: "POST /curriculum-levels"
              payload: { subject_id: "${subj_id}", rank: 1, label: "L1", worksheets_to_master: 2, mastery_score_threshold: 80 }
              as: FranchiseAdmin
              captures: { lv1: $.data.id }
            - call: "POST /families"
              payload: { center_id: "${c_id}", contact_email: "fv2@x.com", contact_name: "FV2" }
              as: CenterDirector
              captures: { fam_id: $.data.id }
            - call: "POST /students"
              payload: { family_id: "${fam_id}", full_name: "K", birthdate: "2016-01-01T00:00:00Z" }
              as: CenterDirector
              captures: { st_id: $.data.id }
            - call: "POST /enrollments"
              payload: { center_id: "${c_id}", student_id: "${st_id}", subject_id: "${subj_id}", diagnostic_raw_score: 10 }
              as: CenterDirector
              captures: { en_id: $.data.id }
            - call: "POST /enrollments/${en_id}/place"
              payload: { placement_policy: "STRICT" }
              as: CenterDirector
            - call: "POST /sessions"
              payload: { center_id: "${c_id}", instructor_user_id: "instr-1", start_at: "2026-05-01T09:00:00Z", end_at: "2026-05-01T10:00:00Z", seat_cap: 2 }
              as: CenterDirector
              captures: { sess_id: $.data.id }
            - call: "POST /sessions/${sess_id}/open"
              payload: {}
              as: CenterDirector
            - call: "GET /sessions/${sess_id}"
              payload: {}
              as: CenterDirector
              captures: { sess_v0: $.data.version }
            - call: "POST /attendance-records"
              payload: { session_id: "${sess_id}", enrollment_id: "${en_id}", expected_session_version: "${sess_v0}" }
              as: CenterDirector
              captures: { ar_id: $.data.id }
          trigger:
            - call: "POST /attendance-records/${ar_id}/cancel"
              payload: {}
              as: CenterDirector
          assert:
            - "AttendanceRecord.${ar_id}.status == CANCELLED"
            - "Session.${sess_id}.booked_seat_count == 0"
