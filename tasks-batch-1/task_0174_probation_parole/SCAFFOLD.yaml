    path: "/supervisees/{id}"
    description: "fetch one supervisee with computed posture and balances"
    roles: [Officer, SupervisingJudge, CompactAdministrator]
    code: 200
    input: []
    output: Supervisee
    side_effects: []
  - method: GET
    path: "/supervisees"
    description: "list supervisees (filterable by assigned_officer_id)"
    roles: [Officer, SupervisingJudge, CompactAdministrator]
    code: 200
    input: ["assigned_officer_id?", "status?", "limit?", "offset?"]
    output: Supervisee[]
    side_effects: ["reverse-reachability for Supervisee.assigned_officer_id -> Officer"]
  - method: POST
    path: "/supervisees/{id}/activate"
    description: "INTAKE -> ACTIVE once a risk assessment is adopted"
    roles: [Officer]
    code: 200
    input: []
    output: Supervisee
    side_effects: ["Supervisee INTAKE->ACTIVE; increments Supervisee.version by 1"]
  - method: POST
    path: "/supervisees/{id}/abscond"
    description: "ACTIVE -> ABSCONDED; auto-files an ABSCOND violation"
    roles: [Officer]
    code: 200
    input: []
    output: Supervisee
    side_effects: ["Supervisee ACTIVE->ABSCONDED; auto-creates ABSCOND Violation (FILED); increments Supervisee.version by 1"]
  - method: POST
    path: "/supervisees/{id}/return-to-supervision"
    description: "ABSCONDED -> ACTIVE rebound (cycle)"
    roles: [Officer]
    code: 200
    input: []
    output: Supervisee
    side_effects: ["Supervisee ABSCONDED->ACTIVE; increments Supervisee.version by 1"]
  - method: POST
    path: "/supervisees/{id}/refer-revocation"
    description: "ACTIVE/ABSCONDED -> REVOCATION_PENDING"
    roles: [Officer]
    code: 200
    input: []
    output: Supervisee
    side_effects: ["Supervisee -> REVOCATION_PENDING; increments Supervisee.version by 1"]
  - method: POST
    path: "/supervisees/{id}/revoke"
    description: "REVOCATION_PENDING -> REVOKED (terminal)"
    roles: [SupervisingJudge]
    code: 200
    input: []
    output: Supervisee
    side_effects: ["Supervisee -> REVOKED; cascade ACTIVE/PROPOSED conditions -> SUSPENDED; increments Supervisee.version by 1"]
  - method: POST
    path: "/supervisees/{id}/reinstate"
    description: "REVOCATION_PENDING -> ACTIVE (judge declines revocation)"
    roles: [SupervisingJudge]
    code: 200
    input: []
    output: Supervisee
    side_effects: ["Supervisee REVOCATION_PENDING->ACTIVE; increments Supervisee.version by 1"]
  - method: POST
    path: "/supervisees/{id}/complete"
    description: "ACTIVE -> COMPLETED when balances clear and no open violations"
    roles: [SupervisingJudge]
    code: 200
    input: []
    output: Supervisee
    side_effects: ["Supervisee -> COMPLETED; cascade ACTIVE conditions -> SATISFIED; increments Supervisee.version by 1"]
