            - "${ap1_review_state} == UNDER_REVIEW for the untainted reviewer"
            - "${e_decide} == ERR_SEGREGATION_OF_DUTIES with HTTP 403, and it is checked before the repeat-offence gate"
            - "${ap1_final} == GRANTED and ${ap1_decider} == ar-2"
            - "after the refused calls Appeal.${ap1} kept its state and EnforcementAction.${a1} stayed ISSUED until the valid decision"

      - name: rbac_escalation_officer_cannot_be_the_first_level_decider_or_the_issuer
        claim_type: segregation_of_duties
        grounds:
          - "validations[priority 60]"
          - "endpoints[POST /appeals/{id}/escalation-decision].side_effects"
        distinguishing_aspect: |
          The final level bars TWO earlier actors, not one: both the investigator who issued the action
          and the reviewer who denied the first-level appeal are excluded, so the escalation guard is a
          disjunction over two different stored user ids. An implementation that copies the
          first-level rule checks only the issuer and lets the denying reviewer rubber-stamp its own
          denial as an officer.
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00.000Z; rule LA-SOD2-1 (LISTING_ACCURACY, base 2.00, ACCOUNT, requires_poa false)."
            - "inv-1 issues the action, ar-1 DENIES the appeal, the seller escalates on 2026-08-02."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00.000Z" }
              as: ComplianceOfficer
              as_user_id: "co-1"
            - call: "POST /policy-rules"
              payload: { code: "LA-SOD2-1", category: "LISTING_ACCURACY", base_severity_weight: 2.00, removal_scope: "ACCOUNT", requires_poa: false }
              as: ComplianceOfficer
              as_user_id: "co-1"
              captures: { rule_sod2: $.data.id }
            - call: "POST /sellers"
              payload: { legal_name: "Harbor Tools LLC", email: "ops@harbor-tools.example", tax_id_hash: "TAX-HT-0001", payout_bank_token: "BANK-HT-0001", address_fingerprint: "ADDR-HT-0001" }
              as: Anonymous
              captures: { s_id: $.data.id }
            - call: "POST /violations"
              payload: { seller_id: "${s_id}", policy_rule_id: "${rule_sod2}", reporter_type: "BUYER", evidence_reference: "EV-SOD2-0001" }
              as: PolicyInvestigator
              as_user_id: "inv-1"
              captures: { v1: $.data.id }
            - call: "POST /violations/${v1}/open-investigation"
              payload: {}
              as: PolicyInvestigator
              as_user_id: "inv-1"
            - call: "POST /violations/${v1}/adjudicate"
              payload: { outcome: "SUBSTANTIATED" }
              as: PolicyInvestigator
              as_user_id: "inv-1"
            - call: "POST /enforcement-actions"
              payload: { violation_id: "${v1}" }
              as: PolicyInvestigator
              as_user_id: "inv-1"
              captures: { a1: $.data.id }
            - call: "POST /appeals"
              payload: { enforcement_action_id: "${a1}", grounds: "The cited attribute came from the manufacturer feed." }
              as: Seller
              as_user_id: "${s_id}"
              captures: { ap1: $.data.id }
            - call: "POST /appeals/${ap1}/start-review"
              payload: {}
              as: AppealReviewer
              as_user_id: "ar-1"
            - call: "POST /appeals/${ap1}/decide"
              payload: { outcome: "DENIED", denial_reason: "NO_NEW_EVIDENCE", rationale: "The feed extract does not cover the reported period." }
              as: AppealReviewer
              as_user_id: "ar-1"
              captures: { ap1_decider: $.data.decided_by_user_id, esc_deadline: $.data.escalation_deadline_at }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-02T00:00:00.000Z" }
              as: ComplianceOfficer
              as_user_id: "co-1"
            - call: "POST /appeals/${ap1}/escalate"
              payload: { escalation_grounds: "A dated manufacturer extract covering the reported period is attached." }
              as: Seller
              as_user_id: "${s_id}"
              captures: { ap1_esc_state: $.data.state }
          trigger:
            - call: "POST /appeals/${ap1}/escalation-decision"
              payload: { outcome: "FINAL_DENIED", denial_reason: "NO_NEW_EVIDENCE", rationale: "Confirming my own denial." }
              as: ComplianceOfficer
              as_user_id: "ar-1"
              captures: { e_by_decider: $.data.error_id }
            - call: "POST /appeals/${ap1}/escalation-decision"
              payload: { outcome: "FINAL_DENIED", denial_reason: "NO_NEW_EVIDENCE", rationale: "Confirming the action I issued." }
              as: ComplianceOfficer
              as_user_id: "inv-1"
              captures: { e_by_issuer: $.data.error_id }
            - call: "POST /appeals/${ap1}/escalation-decision"
              payload: { outcome: "FINAL_DENIED", denial_reason: "NO_NEW_EVIDENCE", rationale: "The extract still does not cover the reported period." }
              as: ComplianceOfficer
              as_user_id: "co-2"
              captures: { ap1_final: $.data.state, ap1_reinstated: $.data.reinstatement_granted }
          assert:
            - "${ap1_decider} == ar-1, ${esc_deadline} == 2026-08-15T00:00:00.000Z, ${ap1_esc_state} == ESCALATED_REVIEW"
            - "${e_by_decider} == ERR_SEGREGATION_OF_DUTIES with HTTP 403"
            - "${e_by_issuer} == ERR_SEGREGATION_OF_DUTIES with HTTP 403"
            - "the co-2 call: HTTP 200, ${ap1_final} == FINAL_DENIED and ${ap1_reinstated} == false"
            - "EnforcementAction.${a1}.resolution_reason == ESCALATION_DENIED"
            - "EnforcementAction.${a1}.state is UPHELD throughout and never VACATED"
            - "Seller.${s_id}.enforcement_state == WATCHLIST — the upheld action was a WARNING, so no ban follows FINAL_DENIED"

      - name: rbac_plan_reviewer_cannot_be_the_investigator_who_issued_the_action
        claim_type: segregation_of_duties
        grounds:
          - "validations[priority 60]"
          - "endpoints[POST /plans-of-action/{id}/review].side_effects"
        distinguishing_aspect: |
          The plan-of-action review is officer-exclusive AND issuer-barred, so the guard has to compare
          X-User-ID against the ACTION's issued_by_user_id reached through the plan — a two-hop lookup
          that a naive implementation skips because the plan itself stores no investigator id.
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00.000Z; rule LA-SOD3-1 (LISTING_ACCURACY, base 2.00, ACCOUNT, requires_poa true)."
            - "inv-1 issues the action; the seller submits a plan whose measures satisfy the length floors."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00.000Z" }
              as: ComplianceOfficer
              as_user_id: "co-1"
            - call: "POST /policy-rules"
              payload: { code: "LA-SOD3-1", category: "LISTING_ACCURACY", base_severity_weight: 2.00, removal_scope: "ACCOUNT", requires_poa: true }
              as: ComplianceOfficer
