  # =========================================================== calculations ==
  - section: calculations
    instances:
      - name: seasonal_multiplier_changes_estimated_credit
        claim_type: constants_applied
        grounds: ["calculations.season_of_date", "calculations.estimated_diversion_credit"]
        distinguishing_aspect: "Identical bin and fullness earn 100 cents in SPRING (2026-05-04, x1.0) but 120 cents in SUMMER (2026-06-01, x1.2) — the season constant is applied before rounding."
        test_recipe:
          setup: ["RES plan (rate 10), route MON, three clean BIN_35L bins (assign + 2 swaps), one ACTIVE subscription; weeks 2026-05-04 and 2026-06-01 generated"]
          setup_api_calls:
            - { call: "POST /service-plans", payload: { code: "RES", name: "Residential", subscriber_type: "RESIDENTIAL", bin_type: "BIN_35L", included_bins: 1, weekly_price_cents: 1200, metered_base_cents: 0, per_kg_rate_cents: 0, included_kg_per_week: 0, credit_rate_cents_per_kg: 10, skip_allowance_per_quarter: 2 }, as: OperationsManager, captures: { plan_res: $.data.id } }
            - { call: "POST /routes", payload: { code: "R1", weekday: "MON", max_stops: 5 }, as: OperationsManager, captures: { route1: $.data.id } }
            - { call: "POST /bins", payload: { bin_type: "BIN_35L", nominal_capacity_kg: 20 }, as: OperationsManager }
            - { call: "POST /bins", payload: { bin_type: "BIN_35L", nominal_capacity_kg: 20 }, as: OperationsManager }
            - { call: "POST /bins", payload: { bin_type: "BIN_35L", nominal_capacity_kg: 20 }, as: OperationsManager }
            - { call: "POST /subscribers", payload: { email: "a@x.com", full_name: "Sub A", subscriber_type: "RESIDENTIAL", address: "1 A St" }, as: Anonymous, captures: { sub_a: $.data.id } }
            - { call: "POST /subscriptions", payload: { subscriber_id: "${sub_a}", plan_id: "${plan_res}", route_id: "${route1}", start_date: "2026-05-01" }, as: OperationsManager, captures: { subs_a: $.data.id } }
            - { call: "POST /routes/${route1}/generate-stops", payload: { service_date: "2026-05-04" }, as: OperationsManager }
            - { call: "POST /routes/${route1}/generate-stops", payload: { service_date: "2026-06-01" }, as: OperationsManager }
            - { call: "GET /pickups", payload: { subscription_id: "${subs_a}" }, as: OperationsManager, captures: { pk_spring: "$.data[0].id", pk_summer: "$.data[1].id" } }
          trigger:
            - { call: "POST /pickups/${pk_spring}/complete", payload: { fullness_pct: 0.5 }, as: Driver, as_user_id: "drv-1" }
            - { call: "POST /pickups/${pk_summer}/complete", payload: { fullness_pct: 0.5 }, as: Driver, as_user_id: "drv-1" }
          assert:
            - "EARNED_ESTIMATED for ${pk_spring}.amount_cents == 100 (round(10.00 x 10 x 1.0)) with season 2026-SPRING"
            - "EARNED_ESTIMATED for ${pk_summer}.amount_cents == 120 (round(10.00 x 10 x 1.2)) with season 2026-SUMMER"
            - "Subscriber.${sub_a}.credit_balance_cents == 220"

      - name: quarterly_skip_counter_resets_at_quarter_boundary
        claim_type: correct_result
        grounds: ["calculations.skip_allowance"]
        distinguishing_aspect: "After two Q2 skips the third Q2 skip is rejected at the allowance boundary (2 >= 2), but the first Q3 skip succeeds and lazily resets the counter to 1 with current_quarter 2026-Q3."
        test_recipe:
          setup: ["RES plan (allowance 2), route MON, one ACTIVE subscription; weeks 2026-06-01, 2026-06-08, 2026-06-15 (Q2) and 2026-07-06 (Q3) generated; clock at default 2026-05-01 so all cutoffs pass"]
          setup_api_calls:
            - { call: "POST /service-plans", payload: { code: "RES", name: "Residential", subscriber_type: "RESIDENTIAL", bin_type: "BIN_35L", included_bins: 1, weekly_price_cents: 1200, metered_base_cents: 0, per_kg_rate_cents: 0, included_kg_per_week: 0, credit_rate_cents_per_kg: 10, skip_allowance_per_quarter: 2 }, as: OperationsManager, captures: { plan_res: $.data.id } }
            - { call: "POST /routes", payload: { code: "R1", weekday: "MON", max_stops: 5 }, as: OperationsManager, captures: { route1: $.data.id } }
            - { call: "POST /bins", payload: { bin_type: "BIN_35L", nominal_capacity_kg: 20 }, as: OperationsManager }
            - { call: "POST /subscribers", payload: { email: "a@x.com", full_name: "Sub A", subscriber_type: "RESIDENTIAL", address: "1 A St" }, as: Anonymous, captures: { sub_a: $.data.id } }
            - { call: "POST /subscriptions", payload: { subscriber_id: "${sub_a}", plan_id: "${plan_res}", route_id: "${route1}", start_date: "2026-05-01" }, as: OperationsManager, captures: { subs_a: $.data.id } }
            - { call: "POST /routes/${route1}/generate-stops", payload: { service_date: "2026-06-01" }, as: OperationsManager }
            - { call: "POST /routes/${route1}/generate-stops", payload: { service_date: "2026-06-08" }, as: OperationsManager }
            - { call: "POST /routes/${route1}/generate-stops", payload: { service_date: "2026-06-15" }, as: OperationsManager }
            - { call: "POST /routes/${route1}/generate-stops", payload: { service_date: "2026-07-06" }, as: OperationsManager }
            - { call: "GET /pickups", payload: { subscription_id: "${subs_a}" }, as: OperationsManager, captures: { pk1: "$.data[0].id", pk2: "$.data[1].id", pk3: "$.data[2].id", pk4: "$.data[3].id" } }
          trigger:
            - { call: "POST /pickups/${pk1}/skip", payload: {}, as: Subscriber, as_user_id: "${sub_a}" }
            - { call: "POST /pickups/${pk2}/skip", payload: {}, as: Subscriber, as_user_id: "${sub_a}" }
            - { call: "POST /pickups/${pk3}/skip", payload: {}, as: Subscriber, as_user_id: "${sub_a}", captures: { err: $.data.error_id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-07-01T00:00:00Z" }, as: OperationsManager }
            - { call: "POST /pickups/${pk4}/skip", payload: {}, as: Subscriber, as_user_id: "${sub_a}" }
          assert:
            - "third Q2 skip: error_id == ERR_SKIP_LIMIT_EXCEEDED (boundary: skips_used == allowance 2 is rejected)"
            - "Q3 skip succeeds: PickupEvent.${pk4}.status == SKIPPED"
            - "Subscription.${subs_a}.skips_used_this_quarter == 1 and current_quarter == '2026-Q3' (lazy reset on the Q3 skip)"

      - name: credit_application_cap_binds_at_fifty_percent
        claim_type: correct_result
        grounds: ["calculations.credit_application_order"]
        distinguishing_aspect: "With balance far above the bill, credit_applied is capped at floor(0.5 x 1200) = 600 — not the full balance — and the debit entry equals exactly 600."
        test_recipe:
          setup: ["RES subscription; week 2026-05-04 completed at 0.5 (credit +100); ops adjustment +10000 -> balance 10100 before billing"]
          setup_api_calls:
            - { call: "POST /service-plans", payload: { code: "RES", name: "Residential", subscriber_type: "RESIDENTIAL", bin_type: "BIN_35L", included_bins: 1, weekly_price_cents: 1200, metered_base_cents: 0, per_kg_rate_cents: 0, included_kg_per_week: 0, credit_rate_cents_per_kg: 10, skip_allowance_per_quarter: 2 }, as: OperationsManager, captures: { plan_res: $.data.id } }
            - { call: "POST /routes", payload: { code: "R1", weekday: "MON", max_stops: 5 }, as: OperationsManager, captures: { route1: $.data.id } }
            - { call: "POST /bins", payload: { bin_type: "BIN_35L", nominal_capacity_kg: 20 }, as: OperationsManager }
            - { call: "POST /bins", payload: { bin_type: "BIN_35L", nominal_capacity_kg: 20 }, as: OperationsManager }
            - { call: "POST /subscribers", payload: { email: "a@x.com", full_name: "Sub A", subscriber_type: "RESIDENTIAL", address: "1 A St" }, as: Anonymous, captures: { sub_a: $.data.id } }
            - { call: "POST /subscriptions", payload: { subscriber_id: "${sub_a}", plan_id: "${plan_res}", route_id: "${route1}", start_date: "2026-05-01" }, as: OperationsManager, captures: { subs_a: $.data.id } }
            - { call: "POST /routes/${route1}/generate-stops", payload: { service_date: "2026-05-04" }, as: OperationsManager }
            - { call: "GET /pickups", payload: { subscription_id: "${subs_a}" }, as: OperationsManager, captures: { pk1: "$.data[0].id" } }
            - { call: "POST /pickups/${pk1}/complete", payload: { fullness_pct: 0.5 }, as: Driver, as_user_id: "drv-1" }
            - { call: "POST /subscribers/${sub_a}/credit-adjustments", payload: { amount_cents: 10000, reason: "promo" }, as: OperationsManager }
          trigger:
            - { call: "POST /billing/run", payload: { week_start_date: "2026-05-04" }, as: OperationsManager }
            - { call: "GET /invoices", payload: { subscriber_id: "${sub_a}" }, as: OperationsManager, captures: { inv1: "$.data[0].id" } }
          assert:
            - "Invoice.${inv1}.subtotal_cents == 1200, credit_applied_cents == 600 (cap floor(0.5 x 1200)), total_cents == 600"
            - "an INVOICE_APPLICATION_DEBIT entry of -600 with invoice_id == ${inv1} exists"
            - "Subscriber.${sub_a}.credit_balance_cents == 9500 (10100 - 600)"

      - name: impact_report_aggregates_completed_pickups_and_confirmed_tags
        claim_type: correct_result
        grounds: ["calculations.impact_report"]
        distinguishing_aspect: "Impact counts COMPLETED pickups (estimated kg when unweighed) and only CONFIRMED tags: 2 completions of 10.00 kg -> 20.0 kg diverted, 10.0 kg CO2e; one waived tag does not count, one confirmed does."
        test_recipe:
