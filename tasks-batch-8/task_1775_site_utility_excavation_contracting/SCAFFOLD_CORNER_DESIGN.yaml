        distinguishing_aspect: "Amount-gated review: a CO with provisional 3425000 (>= 2500000) rejects a ProjectManager review with ERR_UNAUTHORIZED_ROLE but accepts the matching UtilityOwnerRep; approval flips the condition to MITIGATING."
