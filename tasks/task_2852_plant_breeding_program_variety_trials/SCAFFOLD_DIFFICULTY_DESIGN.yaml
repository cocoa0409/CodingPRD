# =============================================================================
# 1.8 Scaffold Difficulty Design (Test Targeting Index) - task 2852
# Plant Breeding Program & Variety Trials
#
# Nine Difficulty Rules from SKILL.md 0.5, two instances each = 18 instances.
# Every numeric literal in every `assert:` below was produced by executing the
# matching `calculations[].formula` with decimal.Decimal / ROUND_HALF_UP.
#
# Recurring fixture vocabulary (each instance still lists its own full chain):
#   * CANONICAL NETWORK - program (plot budget 5000, cash budget 2000000.00),
#     one objective (target 11000.00 kg/ha, weights 0.50/0.30/0.20, required
#     resistances [RUST, SDS] at min score 6, two quality specs, advancement
#     bar 85.00), two lines SX-1001 (A) and SX-1002 (B), three sites S1/S2/S3,
#     one STAGE_1 series with replication_count 4 and min_locations 3, and five
#     entries: A@S1, A@S2, A@S3, B@S1, B@S2 (B is absent from S3, which is what
#     makes the balanced core a strict subset of the tested sites).
#   * Resulting per-entry yields: A@S1 12000.00 (only 3 valid reps, the fourth
#     observation is REJECTED), A@S2 10000.00, A@S3 7200.00, B@S1 11200.00,
#     B@S2 8800.00.
#   * The logical clock is left at its 2026-08-01T00:00:00Z default unless an
#     instance explicitly moves it.
# =============================================================================
scaffold_difficulty_design:

  - rule_id: dual_variant_calc
    instances:
      - name: series_mean_variant_divergence_balanced_core_vs_unbalanced_inclusive
        grounds:
          - calculations.series_adjusted_entry_mean
          - entities.TrialSeriesAnalysis.fields.entry_means
          - entities.TrialSeriesAnalysis.fields.environment_index
          - entities.TrialSeriesAnalysis.fields.is_superseded
          - endpoints["POST /trial-series/{id}/analyses"]
        distinguishing_aspect: |
          This instance's two variants diverge on the INCLUSION SET of an
          agronomic statistics entity (TrialSeriesAnalysis): UNBALANCED_INCLUSIVE
          keeps A's drought site S3 and drags A's rep-weighted mean down to
          9527.27 with a 3-point Finlay-Wilkinson regression (b 1.0909,
          deviation_mse 106666.67), while BALANCED_CORE drops S3 because line B
          was never tested there and reports 10857.14 with a 2-point regression
          (b 0.9091, deviation_mse null). Line B, present at every core site,
          reports exactly 10000.00 under both variants - so the delta is caused
          by the inclusion set, not by the arithmetic.
        test_recipe:
          setup:
            - "One program, one objective, lines A (SX-1001) and B (SX-1002), sites S1/S2/S3, one STAGE_1 series with replication_count 4 and min_locations 3."
            - "Five entries A@S1, A@S2, A@S3, B@S1, B@S2 of 8 plots each; the series is planted; all five entries are finalized."
            - "A@S1 carries four YIELD_KG_PLOT observations of which rep 4 is REJECTED, so its valid_rep_count is 3 while every other entry has 4."
            - "Both analysis variants are then run against the same DATA_COMPLETE series."
          setup_api_calls:
            - call: "POST /breeding-programs"
              payload: { name: "Soy North Central", crop_code: "SOYBEAN", market_zone: "NORTH_CENTRAL", total_plot_budget: 5000, total_budget_usd: 2000000.00 }
              as: PipelineDirector
              captures: { prog_id: $.data.id }
            - call: "POST /breeding-programs/${prog_id}/objectives"
              payload: { market_segment: "MG2_NORTH", target_yield_kg_per_ha: 11000.00, required_disease_resistances: ["RUST", "SDS"], min_resistance_score: 6, quality_trait_specs: { PROTEIN_PCT_MIN: 13.0, TEST_WEIGHT_MIN: 76.0 }, yield_weight: 0.50, disease_weight: 0.30, quality_weight: 0.20, min_advancement_index: 85.00, min_generation_number: 5 }
              as: PipelineDirector
              captures: { obj_id: $.data.id }
            - call: "POST /breeding-lines"
              payload: { program_id: "${prog_id}", objective_id: "${obj_id}", designation: "SX-1001", generation_number: 6, seed_inventory_g: 500000, disease_resistance_scores: { RUST: 8, SDS: 7 }, quality_trait_values: { PROTEIN_PCT: 13.4, TEST_WEIGHT: 75.0 } }
              as: BreedingScientist
              captures: { line_a_id: $.data.id }
            - call: "POST /breeding-lines"
              payload: { program_id: "${prog_id}", objective_id: "${obj_id}", designation: "SX-1002", generation_number: 6, seed_inventory_g: 400000, disease_resistance_scores: { RUST: 8, SDS: 4 }, quality_trait_values: {} }
              as: BreedingScientist
              captures: { line_b_id: $.data.id }
            - call: "POST /trial-sites"
              payload: { site_code: "S1", environment_class: "HIGH_YIELD_IRRIGATED", total_plot_capacity: 400, plot_cost_usd: 45.00, season_start_date: "2027-03-01", season_end_date: "2027-10-31" }
              as: TrialAgronomist
              captures: { site1_id: $.data.id }
            - call: "POST /trial-sites"
              payload: { site_code: "S2", environment_class: "RAINFED_TEMPERATE", total_plot_capacity: 400, plot_cost_usd: 40.00, season_start_date: "2027-03-01", season_end_date: "2027-10-31" }
              as: TrialAgronomist
              captures: { site2_id: $.data.id }
            - call: "POST /trial-sites"
              payload: { site_code: "S3", environment_class: "DROUGHT_STRESS", total_plot_capacity: 400, plot_cost_usd: 36.00, season_start_date: "2027-03-01", season_end_date: "2027-10-31" }
              as: TrialAgronomist
              captures: { site3_id: $.data.id }
            - call: "POST /trial-series"
              payload: { program_id: "${prog_id}", stage: "STAGE_1", season_year: 2027, plot_design: "RCBD", replication_count: 4, min_locations: 3 }
              as: TrialAgronomist
              captures: { series_id: $.data.id }
            - call: "POST /trial-series/${series_id}/entries"
              payload: { line_id: "${line_a_id}", trial_site_id: "${site1_id}", plot_count: 8, planting_window_start: "2027-04-01", planting_window_end: "2027-08-31" }
              as: TrialAgronomist
              captures: { e_a1: $.data.id }
            - call: "POST /trial-series/${series_id}/entries"
              payload: { line_id: "${line_a_id}", trial_site_id: "${site2_id}", plot_count: 8, planting_window_start: "2027-04-01", planting_window_end: "2027-08-31" }
              as: TrialAgronomist
              captures: { e_a2: $.data.id }
            - call: "POST /trial-series/${series_id}/entries"
              payload: { line_id: "${line_a_id}", trial_site_id: "${site3_id}", plot_count: 8, planting_window_start: "2027-04-01", planting_window_end: "2027-08-31" }
              as: TrialAgronomist
              captures: { e_a3: $.data.id }
            - call: "POST /trial-series/${series_id}/entries"
              payload: { line_id: "${line_b_id}", trial_site_id: "${site1_id}", plot_count: 8, planting_window_start: "2027-04-01", planting_window_end: "2027-08-31" }
              as: TrialAgronomist
              captures: { e_b1: $.data.id }
            - call: "POST /trial-series/${series_id}/entries"
              payload: { line_id: "${line_b_id}", trial_site_id: "${site2_id}", plot_count: 8, planting_window_start: "2027-04-01", planting_window_end: "2027-08-31" }
              as: TrialAgronomist
              captures: { e_b2: $.data.id }
            - call: "POST /trial-series/${series_id}/plant"
              payload: {}
              as: TrialAgronomist
            - call: "POST /trial-entries/${e_a1}/observations"
              payload: { trait_code: "YIELD_KG_PLOT", rep_number: 1, value: 14.0 }
              as: TrialAgronomist
            - call: "POST /trial-entries/${e_a1}/observations"
              payload: { trait_code: "YIELD_KG_PLOT", rep_number: 2, value: 15.5 }
              as: TrialAgronomist
            - call: "POST /trial-entries/${e_a1}/observations"
              payload: { trait_code: "YIELD_KG_PLOT", rep_number: 3, value: 15.5 }
              as: TrialAgronomist
            - call: "POST /trial-entries/${e_a1}/observations"
              payload: { trait_code: "YIELD_KG_PLOT", rep_number: 4, value: 20.0, qc_status: "REJECTED" }
              as: TrialAgronomist
            - call: "POST /trial-entries/${e_a2}/observations"
              payload: { trait_code: "YIELD_KG_PLOT", rep_number: 1, value: 12.0 }
              as: TrialAgronomist
            - call: "POST /trial-entries/${e_a2}/observations"
              payload: { trait_code: "YIELD_KG_PLOT", rep_number: 2, value: 12.5 }
              as: TrialAgronomist
            - call: "POST /trial-entries/${e_a2}/observations"
              payload: { trait_code: "YIELD_KG_PLOT", rep_number: 3, value: 12.5 }
              as: TrialAgronomist
            - call: "POST /trial-entries/${e_a2}/observations"
              payload: { trait_code: "YIELD_KG_PLOT", rep_number: 4, value: 13.0 }
              as: TrialAgronomist
            - call: "POST /trial-entries/${e_a3}/observations"
              payload: { trait_code: "YIELD_KG_PLOT", rep_number: 1, value: 8.5 }
              as: TrialAgronomist
            - call: "POST /trial-entries/${e_a3}/observations"
              payload: { trait_code: "YIELD_KG_PLOT", rep_number: 2, value: 9.0 }
              as: TrialAgronomist
            - call: "POST /trial-entries/${e_a3}/observations"
              payload: { trait_code: "YIELD_KG_PLOT", rep_number: 3, value: 9.0 }
              as: TrialAgronomist
            - call: "POST /trial-entries/${e_a3}/observations"
              payload: { trait_code: "YIELD_KG_PLOT", rep_number: 4, value: 9.5 }
              as: TrialAgronomist
            - call: "POST /trial-entries/${e_b1}/observations"
              payload: { trait_code: "YIELD_KG_PLOT", rep_number: 1, value: 13.0 }
              as: TrialAgronomist
            - call: "POST /trial-entries/${e_b1}/observations"
              payload: { trait_code: "YIELD_KG_PLOT", rep_number: 2, value: 14.0 }
              as: TrialAgronomist
            - call: "POST /trial-entries/${e_b1}/observations"
              payload: { trait_code: "YIELD_KG_PLOT", rep_number: 3, value: 14.0 }
              as: TrialAgronomist
            - call: "POST /trial-entries/${e_b1}/observations"
              payload: { trait_code: "YIELD_KG_PLOT", rep_number: 4, value: 15.0 }
              as: TrialAgronomist
            - call: "POST /trial-entries/${e_b2}/observations"
              payload: { trait_code: "YIELD_KG_PLOT", rep_number: 1, value: 10.5 }
              as: TrialAgronomist
            - call: "POST /trial-entries/${e_b2}/observations"
              payload: { trait_code: "YIELD_KG_PLOT", rep_number: 2, value: 11.0 }
              as: TrialAgronomist
            - call: "POST /trial-entries/${e_b2}/observations"
              payload: { trait_code: "YIELD_KG_PLOT", rep_number: 3, value: 11.0 }
              as: TrialAgronomist
            - call: "POST /trial-entries/${e_b2}/observations"
              payload: { trait_code: "YIELD_KG_PLOT", rep_number: 4, value: 11.5 }
              as: TrialAgronomist
            - call: "POST /trial-entries/${e_a1}/finalize"
              payload: {}
              as: TrialAgronomist
            - call: "POST /trial-entries/${e_a2}/finalize"
              payload: {}
              as: TrialAgronomist
            - call: "POST /trial-entries/${e_a3}/finalize"
              payload: {}
              as: TrialAgronomist
            - call: "POST /trial-entries/${e_b1}/finalize"
              payload: {}
              as: TrialAgronomist
            - call: "POST /trial-entries/${e_b2}/finalize"
              payload: {}
              as: TrialAgronomist
            - call: "GET /trial-series/${series_id}"
              payload: {}
              as: DataAnalyst
              captures: { sv1: $.data.version }
          trigger:
            - call: "POST /trial-series/${series_id}/analyses"
              payload: { variant: "UNBALANCED_INCLUSIVE", expected_series_version: "${sv1}" }
              as: DataAnalyst
              captures: { an_inc_id: $.data.id }
            - call: "GET /trial-series/${series_id}"
              payload: {}
              as: DataAnalyst
              captures: { sv2: $.data.version }
            - call: "POST /trial-series/${series_id}/analyses"
              payload: { variant: "BALANCED_CORE", expected_series_version: "${sv2}" }
              as: DataAnalyst
              captures: { an_core_id: $.data.id }
          assert:
            - "TrialEntry.${e_a1}.valid_rep_count == 3 and TrialEntry.${e_a1}.yield_kg_per_ha == 12000.00"
            - "TrialEntry.${e_a2}.yield_kg_per_ha == 10000.00 and TrialEntry.${e_a3}.yield_kg_per_ha == 7200.00"
            - "TrialEntry.${e_b1}.yield_kg_per_ha == 11200.00 and TrialEntry.${e_b2}.yield_kg_per_ha == 8800.00"
            - "TrialSeriesAnalysis.${an_inc_id}.included_location_count == 3 and TrialSeriesAnalysis.${an_inc_id}.included_line_count == 2"
            - "TrialSeriesAnalysis.${an_inc_id}.entry_means row for line ${line_a_id} has adjusted_mean_kg_per_ha == 9527.27, stability_regression_b == 1.0909, deviation_mse == 106666.67, stability_class == STABLE"
            - "TrialSeriesAnalysis.${an_inc_id}.entry_means row for line ${line_b_id} has adjusted_mean_kg_per_ha == 10000.00, stability_regression_b == 1.0909, deviation_mse == null"
            - "TrialSeriesAnalysis.${an_inc_id}.environment_index has exactly three rows with index_kg_per_ha 11600.00 (S1), 9400.00 (S2), 7200.00 (S3), ordered DESC"
            - "TrialSeriesAnalysis.${an_core_id}.included_location_count == 2 and TrialSeriesAnalysis.${an_core_id}.included_line_count == 2"
            - "TrialSeriesAnalysis.${an_core_id}.entry_means row for line ${line_a_id} has adjusted_mean_kg_per_ha == 10857.14, stability_regression_b == 0.9091, deviation_mse == null, stability_class == STABLE"
            - "TrialSeriesAnalysis.${an_core_id}.entry_means row for line ${line_b_id} has adjusted_mean_kg_per_ha == 10000.00 - identical to the UNBALANCED_INCLUSIVE value"
            - "TrialSeriesAnalysis.${an_core_id}.entry_means row for line ${line_a_id} is NOT 11000.00 (the unweighted two-site mean); the rep weights 3 and 4 are what produce 10857.14"
            - "TrialSeriesAnalysis.${an_inc_id}.is_superseded == false and TrialSeriesAnalysis.${an_core_id}.is_superseded == false (different variants never supersede each other)"
            - "TrialSeries.${series_id}.status == ANALYZED"

      - name: line_index_variant_divergence_provisional_vs_cumulative
        grounds:
          - calculations.line_advancement_index
          - entities.BreedingLine.fields.advancement_index_provisional
          - entities.AdvancementDecision.fields.decision_index_value
          - endpoints["POST /advancement-decisions"]
          - state_machines.BreedingLine.pipeline_stage_NURSERY_unchanged_on_HOLD
        distinguishing_aspect: |
          A different entity domain from the sibling instance - portfolio scoring
          on BreedingLine / AdvancementDecision rather than trial statistics on
          TrialSeriesAnalysis - and a different divergence mechanism: the two
          variants share one inclusion set and differ only in MISSING-component
          policy plus stage confidence. Line B has no quality_trait_values, so
          PROVISIONAL imputes 60 and applies no confidence factor (77.91) while
          CUMULATIVE forces the missing component to 0 and multiplies by
          STAGE_CONFIDENCE[NURSERY] = 0.90 (65.91 * 0.90 = 59.32).
        test_recipe:
          setup:
            - "One program, one objective (target 11000.00 kg/ha, weights 0.50/0.30/0.20, bar 85.00), lines A (full trait maps) and B (quality_trait_values empty, SDS score 4 below the min score 6)."
            - "One site S1, one STAGE_1 series with replication_count 4 and min_locations 1, entries A@S1 and B@S1 of 8 plots, both finalized: A has 3 valid reps and 12000.00 kg/ha, B has 4 valid reps and 11200.00 kg/ha."
            - "One BALANCED_CORE analysis has been run, so both lines carry a PROVISIONAL index; the series is ANALYZED."
          setup_api_calls:
            - call: "POST /breeding-programs"
              payload: { name: "Soy North Central", crop_code: "SOYBEAN", market_zone: "NORTH_CENTRAL", total_plot_budget: 5000, total_budget_usd: 2000000.00 }
              as: PipelineDirector
