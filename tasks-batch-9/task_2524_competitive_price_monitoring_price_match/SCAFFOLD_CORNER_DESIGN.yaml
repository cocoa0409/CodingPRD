      - name: corner_order_status_and_signage_dimensions_are_independent
        claim_type: parallel_independent_dimensions
        grounds: [state_machines.PriceChangeOrder.signage_status, complexity_profile.state_machine_shape]
        distinguishing_aspect: "The approval dimension and the signage dimension advance on their own clocks, so one order can be APPROVED with signage NOT_REQUIRED and another PENDING_APPROVAL with signage QUEUED."
        excluded_because:
          difficulty_instance: non_linear_state_machine / order_status_and_signage_status_advance_independently
          rationale: "That instance drives the status dimension to APPROVED and then advances the signage dimension QUEUED -> PRINTED through the batch, asserting each dimension moves without disturbing the other."

      - name: corner_reverse_claim_compensates_every_honor_side_effect
        claim_type: compensation
        grounds: [state_machines.PriceMatchClaim.transitions.HONORED_to_REVERSED, calculations.store_override_budget_ledger]
        distinguishing_aspect: "Reversal must undo all four honor writes together — ledger, budget, spawned order and label slot — leaving no residue in any of them."
        excluded_because:
          difficulty_instance: compensating_invariant / override_budget_conserved_after_honor_then_reverse
          rationale: "That instance asserts the CREDIT ledger row, the restored budget split, the decremented honored_claim_count and the suspended synthesized order after the reversal, with no drift."

      - name: corner_frozen_posture_cascades_down_to_orders_and_labels
        claim_type: cascade_down
        grounds: [state_machines.PriceIndexReport.transitions.DRAFT_to_PUBLISHED, state_machines.PriceChangeOrder.transitions.APPROVED_to_SUSPENDED]
        distinguishing_aspect: "A FROZEN posture reaches sideways into orders, policies and label batches in one publish, and only non-terminal rows are touched."
        excluded_because:
          difficulty_instance: transitive_cascade / publish_frozen_report_suspends_orders_and_releases_labels_depth4
          rationale: "That instance walks the four-level publish cascade end to end: posture FROZEN, orders SUSPENDED, policy SUSPENDED, queued signage RELEASED and store label slots returned."

      - name: corner_guarded_execute_transition_requires_open_market
        claim_type: guarded_transition
        grounds: [state_machines.PriceChangeOrder.transitions.APPROVED_to_EXECUTED, validations.priority_45_ERR_MARKET_POSTURE_BLOCKED]
        distinguishing_aspect: "The APPROVED -> EXECUTED transition is guarded by a field on a different entity, so the identical call flips verdict when only the market posture changes."
        excluded_because:
          difficulty_instance: cross_entity_state_dependency / order_execute_requires_market_posture_open
          rationale: "That instance contrasts a RESTRICTED market (submit and decide pass, execute is blocked) with the same order under OPEN, isolating the cross-entity guard on the execute edge."

  # ===========================================================================
  - section: calculations
    instances:

      - name: corner_effective_price_selector_filters_stock_ttl_and_picks_cheapest
        claim_type: input_set_filtering
        grounds: [calculations.effective_competitor_price, calculations.effective_competitor_price.constants.OBSERVATION_TTL_HOURS]
        distinguishing_aspect: "All four selector elements are exercised at once: an out-of-stock row at 15000 and a 73-hour-old row at 16000 are both excluded, so the cheapest qualifying row is 17000 rather than the newest (17500) or the globally cheapest (15000)."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z, so the qualifying window is (2026-07-29T00:00:00Z, 2026-08-01T00:00:00Z]."
            - "Product SKU-SEL-1 own 20000; ACTIVE PRIMARY competitor C-A; link CONFIRMED at confidence 10000."
            - "Four observations on the link: 15000 ONLINE out of stock at 18:00 on 07-31; 16000 STORE_AUDIT in stock at 2026-07-28T23:00:00Z (73 hours old); 17000 HYBRID in stock at 18:00 on 07-31; 17500 ONLINE in stock at 20:00 on 07-31."
          setup_api_calls:
            - call: "POST /pricing/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /pricing/markets"
              payload: { market_code: "US-WEST", name: "US West", strategic_positioning: "AT_PARITY", strategic_index_target_bp: 9800 }
