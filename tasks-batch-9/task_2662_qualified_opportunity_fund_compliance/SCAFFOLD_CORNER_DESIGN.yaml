      - name: asset_test_measure_twice_rejected
        claim_type: invalid_transitions
        grounds:
          - state_machines.AssetTest.DRAFT_to_MEASURED
          - validations[priority=13]
          - errors[ERR_INVALID_STATE_TRANSITION]
        distinguishing_aspect: "MEASURED is a non-terminal state with no declared measure trigger, so a second measure is priority 13 ERR_INVALID_STATE_TRANSITION (409) — not the terminal-lockdown error — and the first measurement's numbers are left untouched."
        test_recipe:
          setup:
            - "One SELF_CERTIFIED Fund holding a single QUALIFIED QOZ_BUSINESS_PROPERTY asset of 1000000.00 (original_use_in_zone true)."
            - "One AssetTest over [2026-01-01, 2026-07-01) measured once by co-measurer-1, so ratio_pct is 100.0000 and status is MEASURED."
          setup_api_calls:
            - call: "POST /qof/funds"
              payload: { name: "Remeasure Fund", entity_type: "CORPORATION", manager_user_id: "mgr-fund-1" }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { fund_id: $.data.id }
            - call: "POST /qof/funds/${fund_id}/self-certify"
              payload: { first_taxable_month_iso8601: "2026-01-01T00:00:00Z" }
              as: FundManager
              as_user_id: "mgr-fund-1"
            - call: "POST /qof/fund-assets"
              payload: { fund_id: "${fund_id}", asset_class: "QOZ_BUSINESS_PROPERTY", acquisition_date: "2026-01-10T00:00:00Z", unadjusted_cost_basis: 1000000.00, afs_fair_value: 1000000.00, original_use_in_zone: true }
              as: FundManager
              as_user_id: "mgr-fund-1"
            - call: "POST /qof/funds/${fund_id}/asset-tests"
              payload: { measurement_date: "2026-06-30T00:00:00Z", period_start: "2026-01-01T00:00:00Z", period_end: "2026-07-01T00:00:00Z" }
              as: ComplianceOfficer
              as_user_id: "co-measurer-1"
              captures: { at_id: $.data.id }
            - call: "POST /qof/asset-tests/${at_id}/measure"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "co-measurer-1"
              captures: { first_status: $.data.status, first_ratio: $.data.ratio_pct }
          trigger:
            - call: "POST /qof/asset-tests/${at_id}/measure"
