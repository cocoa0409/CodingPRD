          trigger:
            - call: "POST /numbering/relief-plans/${plan_id}/transitions"
              payload: { action: "WITHDRAW" }
              as: NumberingAdministrator
          assert:
            - "HTTP 200 and ReliefPlan.status == \"WITHDRAWN\" with recommended_relief_type still \"UNDETERMINED\""
            - "GET /numbering/npas/${npa_id} reads status == \"JEOPARDY\" (not RELIEF_PLANNED and not ACTIVE), jeopardy_declared_at == \"2026-08-01T00:00:00Z\", available_block_count == 5"
            - "GET /numbering/rate-centers/${rc_id} reads jeopardy_flag == true and accepts_initial_requests == false"

      - name: npa_jeopardy_declaration_flags_every_rate_center_under_the_code
        claim_type: Cascade down
        grounds: ["state_machines.NPA.transitions.ACTIVE_to_JEOPARDY", "endpoints[POST /numbering/npas/{npa_id}/jeopardy-declarations]"]
        distinguishing_aspect: "One declaration fans out to every child rate center of the code - both COLUMBUS and DUBLIN get jeopardy_flag true and accepts_initial_requests false in the same request - while a rate center under a different NPA is untouched."
