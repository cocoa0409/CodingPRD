# =============================================================================
# Table 6: Error Code Catalog (29 codes)
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "Missing or unrecognized X-User-Role / X-User-ID headers" }
  - { id: ERR_FORBIDDEN, http: 403, condition: "Authenticated role is not in the endpoint's roles list" }
  - { id: ERR_VALIDATION, http: 400, condition: "Malformed body: missing required field, undeclared field, unknown enum/action, unparseable date, or bad scalar range" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "A referenced resource id does not exist" }
  - { id: ERR_STALE_AGREEMENT_VERSION, http: 412, condition: "POST /deliveries carried an expected_agreement_version that no longer matches the agreement" }
  - { id: ERR_STALE_DELIVERY_VERSION, http: 412, condition: "POST /sessions/{id}/substitute carried an expected_delivery_version that no longer matches the delivery" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Entity is not in a state from which the requested action is defined (includes terminal-state lockdown)" }
  - { id: ERR_VOLUNTEER_INELIGIBLE, http: 409, condition: "Volunteer fails the eligibility conjunction (screening CLEARED, training COMPLETED, engagement ACTIVE, partner ACTIVE)" }
  - { id: ERR_DISTRICT_NOT_PARTNER, http: 409, condition: "Agreement ACTIVATE attempted while the school's district is not PARTNER" }
  - { id: ERR_SPONSOR_NOT_ACTIVE, http: 409, condition: "Agreement ACTIVATE attempted while the sponsor partner is not ACTIVE" }
  - { id: ERR_SESSION_OVERLAP, http: 409, condition: "Half-open time overlap with another SCHEDULED session of the same volunteer on the same date" }
  - { id: ERR_CADENCE_VIOLATION, http: 422, condition: "Sibling SCHEDULED sessions of a delivery fall outside the inclusive [3, 14] day gap band" }
  - { id: ERR_SESSION_DATE_INVALID, http: 422, condition: "Session/capstone date in the past, on a non-instructional weekday, or a RECORD_* outside its allowed window" }
  - { id: ERR_FACILITY_CAPACITY_EXCEEDED, http: 422, condition: "Buffered-overlap cluster at a facility would exceed its seat capacity" }
  - { id: ERR_PROGRAM_GRADE_MISMATCH, http: 422, condition: "School and program grade bands do not overlap at delivery PLAN" }
  - { id: ERR_ENROLLMENT_OUT_OF_RANGE, http: 422, condition: "enrolled_count outside [program.min_students, program.max_students], or roster add would exceed max_students" }
  - { id: ERR_TERRITORY_LIMIT_REACHED, http: 422, condition: "Creating a district would exceed the area office's max_districts (non-CHURNED districts counted)" }
  - { id: ERR_DUPLICATE_INVENTORY, http: 409, condition: "A kit inventory row already exists for the (area_office_id, program_catalog_id) pair" }
  - { id: ERR_DUPLICATE_CAPSTONE, http: 409, condition: "The delivery already has a non-CANCELLED capstone event" }
  - { id: ERR_ROLE_ASSIGNMENT_INVALID, http: 422, condition: "ASSIGN_ROLES: roster size mismatch, a student missed or duplicated, unknown facility role, or rotation_group out of range" }
  - { id: ERR_SURVEY_SCORE_OUT_OF_RANGE, http: 422, condition: "Survey score outside 0-100" }
  - { id: ERR_KIT_SHORTAGE, http: 422, condition: "RESERVE_KITS: inventory available_count < required_kits (or no inventory row exists for the office/program pair)" }
  - { id: ERR_WRITE_OFF_EXCEEDS_AVAILABLE, http: 422, condition: "WRITE_OFF quantity exceeds available_count" }
  - { id: ERR_TEACHER_NOT_CONFIRMED, http: 409, condition: "Delivery SCHEDULE attempted before CONFIRM_TEACHER" }
  - { id: ERR_KITS_NOT_RESERVED, http: 409, condition: "Delivery SCHEDULE attempted while kit_status is NONE/RELEASED/RECONCILED" }
  - { id: ERR_SESSIONS_INCOMPLETE, http: 409, condition: "A completion gate found sessions not yet DELIVERED, or SCHEDULE found fewer SCHEDULED sessions than the program requires" }
  - { id: ERR_CAPSTONE_REQUIRED, http: 409, condition: "Delivery COMPLETE attempted while a required capstone is not COMPLETED" }
  - { id: ERR_FUNDING_BELOW_FLOOR, http: 422, condition: "Pledge below the program's funding floor at ACTIVATE/RATIFY_AMENDMENT" }
  - { id: ERR_FUNDING_EXCEEDS_PLEDGE, http: 422, condition: "RECORD_FUNDING would push funding_received_cents above funding_pledged_cents, or an amendment would cut the pledge below funds already received" }

# =============================================================================
# Table 7: RBAC Matrix
# =============================================================================
roles:
  - name: PlatformAdmin
    description: "Platform operator: seeds area offices, program catalog, and drives the logical clock"
    identity: opaque
    exclusive_operations:
      - "POST /ja-programs/_clock/set_current_utc"
      - "POST /ja-programs/area-offices"
      - "POST /ja-programs/program-catalogs"
    shared_operations:
      - "All GET endpoints except the evaluation read"

  - name: AreaDirector
    description: "Area office leader: owns territory districts, schools, and partnership agreements"
    identity: opaque
    exclusive_operations:
      - "POST /ja-programs/districts and /ja-programs/districts/{id}/transition"
      - "POST /ja-programs/schools"
      - "POST /ja-programs/partnership-agreements and /ja-programs/partnership-agreements/{id}/transition"
    shared_operations:
      - "All GET endpoints including the evaluation read"

  - name: PartnershipManager
    description: "Corporate relations: owns partners, volunteers, and credential events"
    identity: opaque
    exclusive_operations:
      - "POST /ja-programs/corporate-partners and /ja-programs/corporate-partners/{id}/transition"
      - "POST /ja-programs/volunteers and /ja-programs/volunteers/{id}/credential-events"
    shared_operations:
      - "All GET endpoints including the evaluation read"

  - name: ProgramCoordinator
    description: "Program delivery operator: owns deliveries, sessions, substitution, capstones, rosters, surveys"
    identity: opaque
    exclusive_operations:
      - "POST /ja-programs/deliveries and /ja-programs/deliveries/{id}/transition"
      - "POST /ja-programs/sessions, /ja-programs/sessions/{id}/transition, /ja-programs/sessions/{id}/substitute"
      - "POST /ja-programs/capstone-events and /ja-programs/capstone-events/{id}/transition"
      - "POST /ja-programs/students and /ja-programs/students/{id}/transition"
    shared_operations:
      - "All GET endpoints except the evaluation read"

  - name: LogisticsCoordinator
    description: "Kit warehouse operator: owns kit inventory rows and stock transitions"
    identity: opaque
    exclusive_operations:
      - "POST /ja-programs/kit-inventories and /ja-programs/kit-inventories/{id}/transition"
    shared_operations:
      - "All GET endpoints except the evaluation read"

  - name: Funder
    description: "External funder: read-only access, including the evaluation report"
    identity: opaque
    exclusive_operations: []
    shared_operations:
      - "All GET endpoints including the evaluation read"
