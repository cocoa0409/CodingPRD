          trigger:
            - call: "POST /pallet-ops/routes/${route_id}/stops"
              payload: { stop_sequence: 1, stop_type: "DELIVERY", order_id: "${o1_id}" }
              as: FleetPlanner
              captures: { stop1_id: $.data.id }
            - call: "POST /pallet-ops/routes/${route_id}/stops"
              payload: { stop_sequence: 2, stop_type: "DELIVERY", order_id: "${o2_id}" }
              as: FleetPlanner
              captures: { stop2_id: $.data.id }
            - call: "POST /pallet-ops/routes/${route_id}/stops"
              payload: { stop_sequence: 3, stop_type: "DELIVERY", order_id: "${o3_id}" }
              as: FleetPlanner
              captures: { err: $.data.error_id }
          assert:
            - "RouteStop.${stop1_id}.load_cube_cuft == 493.3358 (74 * 6.6667)"
            - "second stop admitted: exact fit 493.3358 + 6.6667 == 500.0025 <= capacity (inclusive boundary)"
            - "DeliveryRoute.${route_id}.cube_used_cuft == 500.0025 after exact-fit stop"
            - "third stop rejected with ERR_CUBE_OVERFLOW (500.0025 + 6.6667 > 500.0025)"
            - "cube_used_cuft remains 500.0025 after the rejection (no partial mutation)"

  # ---------------------------------------------------------------------------
  # Rule 7 — cross_entity_state_dependency (different entity pairs)
  # ---------------------------------------------------------------------------
  - rule_id: cross_entity_state_dependency
    instances:
      - name: core_sort_gated_by_batch_state
        grounds:
          - state_machines.CoreUnit
          - state_machines.CorePurchaseBatch.SORTING_to_AUDIT
          - errors[ERR_BATCH_NOT_SORTING]
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: |
          Pair CoreUnit -> CorePurchaseBatch: sorting a core is valid only while
          its owning batch is SORTING; after finish-sorting moves the batch to
          AUDIT, both late core creation and any further sort against the batch
          fail — child transitions gated by parent aggregate state.
        test_recipe:
          setup:
            - "batch with 2 cores, both sorted A; batch moved SORTING -> AUDIT -> CLOSED"
          setup_api_calls:
            - call: "POST /pallet-ops/core-batches"
              payload: { supplier_name: "GateCo", agreed_unit_price_cents: 500, manifest_count: 2, estimated_grade_mix: { A: 1.0, B: 0.0, SCRAP: 0.0 } }
              as: ProcurementManager
              captures: { batch_id: $.data.id }
            - call: "POST /pallet-ops/core-batches/${batch_id}/begin-sorting"
              payload: {}
              as: YardSupervisor
            - call: "POST /pallet-ops/core-units"
              payload: { batch_id: "${batch_id}", species: "PINE" }
              as: YardSupervisor
              captures: { c1: $.data.id }
            - call: "POST /pallet-ops/core-units"
              payload: { batch_id: "${batch_id}", species: "PINE" }
              as: YardSupervisor
              captures: { c2: $.data.id }
            - call: "POST /pallet-ops/core-units/${c1}/sort"
              payload: { grade: "A" }
              as: YardSupervisor
            - call: "POST /pallet-ops/core-units/${c2}/sort"
              payload: { grade: "A" }
              as: YardSupervisor
            - call: "POST /pallet-ops/core-batches/${batch_id}/finish-sorting"
              payload: {}
              as: YardSupervisor
            - call: "POST /pallet-ops/core-batches/${batch_id}/close"
              payload: {}
              as: ProcurementManager
          trigger:
            - call: "POST /pallet-ops/core-units"
              payload: { batch_id: "${batch_id}", species: "PINE" }
              as: YardSupervisor
              captures: { err: $.data.error_id }
          assert:
            - "late core creation against a CLOSED batch fails with ERR_INVALID_STATE"
            - "CorePurchaseBatch.${batch_id}.status == CLOSED"
            - "dependency direction: CoreUnit creation/sort validity reads CorePurchaseBatch.status"

      - name: stop_arrive_gated_by_route_and_sibling_stops
        grounds:
          - state_machines.RouteStop.SCHEDULED_to_ARRIVED
          - state_machines.DeliveryRoute.PLAN_to_DISPATCHED
          - errors[ERR_ROUTE_NOT_DISPATCHED]
          - errors[ERR_STOP_OUT_OF_SEQUENCE]
        distinguishing_aspect: |
          Pairs RouteStop -> DeliveryRoute and RouteStop -> sibling RouteStop:
          arrive requires the owning route to be DISPATCHED (parent state gate)
          AND all lower stop_sequence siblings COMPLETED/SKIPPED (sibling-state
          gate) — a different entity pair than CoreUnit -> CorePurchaseBatch.
        test_recipe:
          setup:
            - "route DISPATCHED with 3 delivery stops (sequences 1,2,3) for three allocated 1-pallet orders; stop1 still SCHEDULED"
          setup_api_calls:
            - call: "POST /pallet-ops/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlantManager
            - call: "POST /pallet-ops/lumber-index"
              payload: { species: "PINE", price_per_mbf_cents: 400000, effective_from: "2026-07-01T00:00:00Z", effective_to: "2026-09-01T00:00:00Z" }
              as: ProcurementManager
            - call: "POST /pallet-ops/specs"
              payload: { spec_code: "GMA-48X40-15B", length_in: 48, width_in: 40, height_in: 6.0, board_count: 15, lumber_species: "PINE" }
              as: PlantManager
              captures: { spec_id: $.data.id }
            - call: "POST /pallet-ops/specs/${spec_id}/activate"
              payload: {}
              as: PlantManager
            - call: "POST /pallet-ops/inventory-lots"
              payload: { spec_id: "${spec_id}", origin_type: "NEW_BUILD", quantity_total: 100, quality_grade: "NEW" }
              as: PlantManager
            - call: "POST /pallet-ops/customers"
              payload: { company_name: "SeqTest" }
              as: SalesRep
              captures: { cust_id: $.data.id }
            - call: "POST /pallet-ops/orders"
              payload: { customer_id: "${cust_id}", requested_delivery_date: "2026-08-10T00:00:00Z", spec_id: "${spec_id}", quantity: 1, quality_grade_requested: "NEW" }
              as: SalesRep
              captures: { o1_id: $.data.id, o1_v: $.data.version }
            - call: "POST /pallet-ops/orders/${o1_id}/confirm"
              payload: { expected_order_version: "${o1_v}" }
              as: SalesRep
              captures: { o1_v2: $.data.version }
            - call: "POST /pallet-ops/orders/${o1_id}/allocate"
              payload: { expected_order_version: "${o1_v2}" }
              as: SalesRep
            - call: "POST /pallet-ops/orders"
              payload: { customer_id: "${cust_id}", requested_delivery_date: "2026-08-10T00:00:00Z", spec_id: "${spec_id}", quantity: 1, quality_grade_requested: "NEW" }
              as: SalesRep
              captures: { o2_id: $.data.id, o2_v: $.data.version }
            - call: "POST /pallet-ops/orders/${o2_id}/confirm"
              payload: { expected_order_version: "${o2_v}" }
              as: SalesRep
              captures: { o2_v2: $.data.version }
            - call: "POST /pallet-ops/orders/${o2_id}/allocate"
              payload: { expected_order_version: "${o2_v2}" }
              as: SalesRep
            - call: "POST /pallet-ops/orders"
              payload: { customer_id: "${cust_id}", requested_delivery_date: "2026-08-10T00:00:00Z", spec_id: "${spec_id}", quantity: 1, quality_grade_requested: "NEW" }
              as: SalesRep
              captures: { o3_id: $.data.id, o3_v: $.data.version }
            - call: "POST /pallet-ops/orders/${o3_id}/confirm"
              payload: { expected_order_version: "${o3_v}" }
              as: SalesRep
              captures: { o3_v2: $.data.version }
            - call: "POST /pallet-ops/orders/${o3_id}/allocate"
              payload: { expected_order_version: "${o3_v2}" }
              as: SalesRep
            - call: "POST /pallet-ops/routes"
              payload: { route_date: "2026-08-10T00:00:00Z", trailer_cube_capacity_cuft: 5000, planned_miles: 40 }
              as: FleetPlanner
              captures: { route_id: $.data.id }
            - call: "POST /pallet-ops/routes/${route_id}/stops"
              payload: { stop_sequence: 1, stop_type: "DELIVERY", order_id: "${o1_id}" }
              as: FleetPlanner
              captures: { s1: $.data.id }
            - call: "POST /pallet-ops/routes/${route_id}/stops"
              payload: { stop_sequence: 2, stop_type: "DELIVERY", order_id: "${o2_id}" }
              as: FleetPlanner
              captures: { s2: $.data.id }
            - call: "POST /pallet-ops/routes/${route_id}/stops"
              payload: { stop_sequence: 3, stop_type: "DELIVERY", order_id: "${o3_id}" }
              as: FleetPlanner
              captures: { s3: $.data.id }
            - call: "GET /pallet-ops/routes/${route_id}"
              payload: {}
              as: FleetPlanner
              captures: { route_v: $.data.version }
            - call: "POST /pallet-ops/routes/${route_id}/dispatch"
              payload: { expected_route_version: "${route_v}" }
              as: FleetPlanner
          trigger:
            - call: "POST /pallet-ops/route-stops/${s2}/arrive"
              payload: {}
              as: FleetPlanner
              captures: { err: $.data.error_id }
          assert:
            - "arriving stop2 while stop1 is SCHEDULED fails with ERR_STOP_OUT_OF_SEQUENCE"
            - "RouteStop.${s2}.status remains SCHEDULED"
            - "sibling-state dependency: arrive reads other RouteStops' statuses on the same route"

  # ---------------------------------------------------------------------------
  # Rule 8 — resource_temporal_overlap (different interval semantics)
  # ---------------------------------------------------------------------------
  - rule_id: resource_temporal_overlap
    instances:
      - name: lumber_index_half_open_window_overlap
        grounds:
          - validations[priority=14]
          - entities.LumberPriceIndex
          - errors[ERR_INDEX_WINDOW_OVERLAP]
        distinguishing_aspect: |
          Interval semantics: half-open [from, to) windows partitioned PER
          SPECIES — a PINE row [2026-09-01, 2026-11-01) adjacent to an existing
          PINE [2026-07-01, 2026-09-01) is legal (touching endpoints do not
          overlap), a PINE row [2026-08-15, 2026-10-01) overlaps and is
          rejected, and an OAK row on the same dates is unaffected.
        test_recipe:
          setup:
            - "existing PINE row [2026-07-01, 2026-09-01); adjacent PINE row [2026-09-01, 2026-11-01) accepted"
          setup_api_calls:
            - call: "POST /pallet-ops/lumber-index"
              payload: { species: "PINE", price_per_mbf_cents: 400000, effective_from: "2026-07-01T00:00:00Z", effective_to: "2026-09-01T00:00:00Z" }
              as: ProcurementManager
              captures: { idx1: $.data.id }
            - call: "POST /pallet-ops/lumber-index"
              payload: { species: "PINE", price_per_mbf_cents: 420000, effective_from: "2026-09-01T00:00:00Z", effective_to: "2026-11-01T00:00:00Z" }
              as: ProcurementManager
              captures: { idx2: $.data.id }
          trigger:
            - call: "POST /pallet-ops/lumber-index"
              payload: { species: "PINE", price_per_mbf_cents: 410000, effective_from: "2026-08-15T00:00:00Z", effective_to: "2026-10-01T00:00:00Z" }
              as: ProcurementManager
              captures: { err: $.data.error_id }
            - call: "POST /pallet-ops/lumber-index"
              payload: { species: "OAK", price_per_mbf_cents: 410000, effective_from: "2026-08-15T00:00:00Z", effective_to: "2026-10-01T00:00:00Z" }
              as: ProcurementManager
              captures: { oak_id: $.data.id }
          assert:
            - "adjacent PINE row accepted: LumberPriceIndex.${idx2} created (half-open touching endpoints are legal)"
            - "overlapping PINE row rejected with ERR_INDEX_WINDOW_OVERLAP"
            - "same-date OAK row accepted: LumberPriceIndex.${oak_id} created (resource partitioned by species)"

      - name: ht_chamber_point_in_time_occupancy
        grounds:
          - validations[priority=8]
          - state_machines.HeatTreatmentRun.STAGING_to_RUNNING
          - errors[ERR_CHAMBER_OCCUPIED]
        distinguishing_aspect: |
          Different interval semantics from the lumber index: chamber occupancy
          is POINT-IN-TIME state occupation, not a half-open time window —
          chamber CH-1 may hold arbitrarily many STAGING runs but exactly one
          RUNNING run; starting a second run while the first is RUNNING is
          rejected, and starting it after the first completes is legal because
          occupancy is released by state transition, not by timestamp arithmetic.
        test_recipe:
          setup:
            - "run R1 on chamber CH-1 RUNNING with one PENDING_HT PINE lot"
            - "run R2 on chamber CH-1 STAGING with one PENDING_HT PINE lot"
          setup_api_calls:
            - call: "POST /pallet-ops/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlantManager
            - call: "POST /pallet-ops/lumber-index"
              payload: { species: "PINE", price_per_mbf_cents: 400000, effective_from: "2026-07-01T00:00:00Z", effective_to: "2026-09-01T00:00:00Z" }
              as: ProcurementManager
            - call: "POST /pallet-ops/specs"
              payload: { spec_code: "GMA-48X40-15B", length_in: 48, width_in: 40, height_in: 6.0, board_count: 15, lumber_species: "PINE", requires_heat_treatment_default: true }
              as: PlantManager
              captures: { spec_id: $.data.id }
            - call: "POST /pallet-ops/specs/${spec_id}/activate"
              payload: {}
              as: PlantManager
            - call: "POST /pallet-ops/inventory-lots"
              payload: { spec_id: "${spec_id}", origin_type: "NEW_BUILD", quantity_total: 10, quality_grade: "NEW" }
              as: PlantManager
              captures: { lot1: $.data.id }
            - call: "POST /pallet-ops/inventory-lots"
              payload: { spec_id: "${spec_id}", origin_type: "NEW_BUILD", quantity_total: 10, quality_grade: "NEW" }
              as: PlantManager
              captures: { lot2: $.data.id }
            - call: "POST /pallet-ops/ht-runs"
              payload: { chamber_code: "CH-1", species_profile: "PINE", capacity_pallets: 100 }
              as: HeatTreatOperator
              captures: { run1: $.data.id }
            - call: "POST /pallet-ops/ht-runs/${run1}/assign-lot"
              payload: { lot_id: "${lot1}" }
              as: HeatTreatOperator
            - call: "POST /pallet-ops/ht-runs/${run1}/start"
              payload: {}
              as: HeatTreatOperator
            - call: "POST /pallet-ops/ht-runs"
              payload: { chamber_code: "CH-1", species_profile: "PINE", capacity_pallets: 100 }
              as: HeatTreatOperator
              captures: { run2: $.data.id }
            - call: "POST /pallet-ops/ht-runs/${run2}/assign-lot"
              payload: { lot_id: "${lot2}" }
              as: HeatTreatOperator
          trigger:
            - call: "POST /pallet-ops/ht-runs/${run2}/start"
              payload: {}
              as: HeatTreatOperator
              captures: { err: $.data.error_id }
          assert:
            - "second start rejected with ERR_CHAMBER_OCCUPIED while run1 is RUNNING"
            - "HeatTreatmentRun.${run2}.status remains STAGING"
            - "semantics differ from the lumber window: no time arithmetic, purely state-derived occupancy"

  # ---------------------------------------------------------------------------
  # Rule 9 — compensating_invariant (different conserved quantities)
  # ---------------------------------------------------------------------------
  - rule_id: compensating_invariant
    instances:
      - name: pool_credit_balance_cancel_compensation
        grounds:
          - state_machines.SalesOrder
          - entities.Customer.fields.pool_credit_balance_cents
          - entities.SalesOrder.fields.pool_credit_applied_cents
          - calculations.order_pricing
        distinguishing_aspect: |
          Conserved quantity: Customer.pool_credit_balance_cents. Invariant:
          balance_after_cancel == balance_before_confirm for a confirm-then-
          cancel round trip — confirm debits min(balance, invoice) and cancel
          re-credits exactly pool_credit_applied_cents, leaving zero drift in
          the customer's credit ledger.
        test_recipe:
          setup:
            - "clock 2026-08-01; PINE index; ACTIVE spec; NEW lot 500"
            - "customer with pool_credit_balance_cents exactly 2800 (4-unit A-grade return credited at 700/unit) and pool_units_outstanding 1"
            - "CONFIRMED order qty 3 grade NEW (invoice 4500, credit applied 2800)"
          setup_api_calls:
            - call: "POST /pallet-ops/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlantManager
            - call: "POST /pallet-ops/lumber-index"
              payload: { species: "PINE", price_per_mbf_cents: 400000, effective_from: "2026-07-01T00:00:00Z", effective_to: "2026-09-01T00:00:00Z" }
              as: ProcurementManager
            - call: "POST /pallet-ops/specs"
              payload: { spec_code: "GMA-48X40-15B", length_in: 48, width_in: 40, height_in: 6.0, board_count: 15, lumber_species: "PINE" }
              as: PlantManager
              captures: { spec_id: $.data.id }
            - call: "POST /pallet-ops/specs/${spec_id}/activate"
              payload: {}
              as: PlantManager
            - call: "POST /pallet-ops/inventory-lots"
              payload: { spec_id: "${spec_id}", origin_type: "NEW_BUILD", quantity_total: 500, quality_grade: "NEW" }
              as: PlantManager
            - call: "POST /pallet-ops/customers"
              payload: { company_name: "InvariantCust" }
