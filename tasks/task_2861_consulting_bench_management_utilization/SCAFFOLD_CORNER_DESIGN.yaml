          assert:
            - "${ap_discount} == 35.00 exactly (100 * (250.00 - 162.50) / 250.00) and the create returns 201, not ERR_DISCOUNT_CAP_EXCEEDED — the cap comparison is <=, not <"
            - "${ap_status} == \"PENDING\" with ${ap_tier} == \"L2_FINANCE\", ${ap_escalated} == false, ${ap_provisional} == 65.00 and ${ap_margin} == 50.77 (round(100 * (162.50 - 80.00) / 162.50, 2), LEVEL_FLOOR at min_proficiency_level 3)"
