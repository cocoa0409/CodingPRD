# =============================================================================
# §1.8 Scaffold Difficulty Design — Test Targeting Index
# Two instances per §0.5 rule; every grounds ref resolves into SCAFFOLD.yaml
# §1.1-§1.7. Each test_recipe drives empty-DB -> precondition -> trigger ->
# observable assert using only §1.5 endpoints.
# =============================================================================
scaffold_difficulty_design:

  # ---------------------------------------------------------------------------
  # Rule 1 — dual_variant_calc: two calculations, DIFFERENT entity domains,
  # each with two valid interpretations producing different results.
  # ---------------------------------------------------------------------------
  - rule_id: dual_variant_calc
    instances:
      - name: run_introduced_allergens_optimistic_vs_strict_baseline
        grounds:
          - calculations.introduced_allergens
          - state_machines.ProductionRun.DRAFT_to_SCHEDULED
        distinguishing_aspect: |
          Same line history, two valid baselines: optimistic_preview (at DRAFT
          creation, treats the immediately-prior SCHEDULED run as contributing
          its allergens) vs strict_actual (at schedule time, counts only
          COMPLETED or IN_PROGRESS runs). A run whose predecessor is still
          SCHEDULED reports introduced_allergens=[] at creation but
          introduced_allergens=[PEANUT] once schedule re-evaluates strictly.
        test_recipe:
          setup:
            - "Allergen PEANUT (MAJOR_9) and MILK (MAJOR_9) exist"
            - "ProductionLine LINE-1 (WET_WASH, posture OPEN) exists"
            - "Product P-NUT with allergen_set [PEANUT] and Product P-MILK with allergen_set [MILK] exist"
            - "Run R1 on LINE-1 producing P-NUT is SCHEDULED for 2026-06-01T08:00:00Z-2026-06-01T12:00:00Z (still SCHEDULED, not started)"
            - "Run R2 on LINE-1 producing P-NUT is created in DRAFT for 2026-06-01T13:00:00Z-2026-06-01T17:00:00Z"
          setup_api_calls:
            - call: "POST /qa/allergens"
              payload: { code: "PEANUT", display_name: "Peanut", regulatory_class: "MAJOR_9" }
              as: QaManager
              captures: { al_peanut: $.data.id }
            - call: "POST /qa/allergens"
              payload: { code: "MILK", display_name: "Milk", regulatory_class: "MAJOR_9" }
              as: QaManager
              captures: { al_milk: $.data.id }
            - call: "POST /qa/production-lines"
              payload: { line_code: "LINE-1", description: "Line 1", sanitation_class: "WET_WASH" }
              as: QaManager
              captures: { line1: $.data.id, line1_v: $.data.version }
            - call: "POST /qa/line-allergen-matrix-entries"
              payload: { line_id: "${line1}", allergen_id: "${al_peanut}", handling: "REQUIRES_CHANGEOVER", changeover_minutes: 45 }
              as: QaManager
            - call: "POST /qa/products"
              payload: { sku: "P-NUT", product_name: "Nut Bar", allergen_set: ["PEANUT"], rework_class: "SAME_INTO_SAME" }
              as: QaManager
              captures: { prod_nut: $.data.id }
            - call: "POST /qa/products"
              payload: { sku: "P-MILK", product_name: "Milk Bar", allergen_set: ["MILK"], rework_class: "NO_REWORK" }
              as: QaManager
              captures: { prod_milk: $.data.id }
            - call: "POST /qa/production-runs"
              payload: { line_id: "${line1}", product_id: "${prod_nut}", planned_start_utc: "2026-06-01T08:00:00Z", planned_end_utc: "2026-06-01T12:00:00Z" }
              as: QaSupervisor
              captures: { run1: $.data.id }
            - call: "POST /qa/changeover-procedures"
              payload: { procedure_code: "COP-PEANUT-V1", target_allergen_id: "${al_peanut}", method: "FULL_WET_WASH", min_swab_zones: 1, atp_action_level_rlu: 150, allergen_action_level_ppm: 2.0 }
              as: QaManager
              captures: { proc1: $.data.id, proc1_v: $.data.version }
            - call: "POST /qa/changeover-procedures/${proc1}/approve"
              payload: { expected_procedure_version: "${proc1_v}" }
              as: QaManager
            - call: "POST /qa/changeovers"
              payload: { line_id: "${line1}", from_run_id: null, to_run_id: "${run1}", procedure_id: "${proc1}", scheduled_minutes: 45 }
              as: QaSupervisor
              captures: { co1: $.data.id }
            - call: "POST /qa/production-runs/${run1}/schedule"
              payload: { expected_line_version: "${line1_v}" }
              as: QaSupervisor
            - call: "POST /qa/production-runs"
              payload: { line_id: "${line1}", product_id: "${prod_nut}", planned_start_utc: "2026-06-01T13:00:00Z", planned_end_utc: "2026-06-01T17:00:00Z" }
              as: QaSupervisor
              captures: { run2: $.data.id, run2_introduced_at_create: $.data.introduced_allergens }
          trigger:
            - call: "GET /qa/production-lines/${line1}"
              as: QaSupervisor
              captures: { line1_v2: $.data.version }
            - call: "POST /qa/production-runs/${run2}/schedule"
              payload: { expected_line_version: "${line1_v2}" }
              as: QaSupervisor
              captures: { run2_introduced_at_schedule: $.data.introduced_allergens }
          assert:
            - "Run.${run2}.introduced_allergens at DRAFT creation (optimistic_preview, treating SCHEDULED run1 as baseline) == []"
            - "Run.${run2}.introduced_allergens after schedule (strict_actual, excluding still-SCHEDULED run1) == [PEANUT]"
            - "Run.${run2}.changeover_required after schedule == true"
            - "Run.${run2}.scheduled_changeover_minutes after schedule == 45"

      - name: training_score_floor_vs_reinstate_reset
        grounds:
          - calculations.training_score
          - state_machines.QaTechnician.SUSPENDED_to_ACTIVE
        distinguishing_aspect: |
          Two valid score-reset interpretations on the QaTechnician domain:
          computed aggregation (100 minus accumulated deductions, floored at 0)
          vs the reinstate override (forced to REINSTATE_SCORE_FLOOR=75). The
          same technician whose raw aggregated score would be 40 reads 75 after
          reinstate — a dual-variant divergence on technician state, not on
          run allergens.
        test_recipe:
          setup:
            - "Allergen PEANUT exists"
            - "Technician T1 certified for PEANUT, expiry 2027-01-01"
            - "Second technician T2 to act as auditor"
            - "T1 has accumulated 3 CRITICAL AuditFindings (45 points) + 1 MAJOR (5 points) + 1 MINOR (2 points) + additional deductions totaling raw score 40 (computed) and is SUSPENDED"
          setup_api_calls:
            - call: "POST /qa/allergens"
              payload: { code: "PEANUT", display_name: "Peanut", regulatory_class: "MAJOR_9" }
              as: QaManager
              captures: { al_peanut: $.data.id }
            - call: "POST /qa/technicians"
              payload: { tech_code: "TECH-001", full_name: "Tech One", certified_allergen_ids: ["${al_peanut}"], certification_expiry_utc: "2027-01-01T00:00:00Z" }
              as: QaManager
              captures: { tech1: $.data.id }
            - call: "POST /qa/technicians"
              payload: { tech_code: "TECH-002", full_name: "Tech Two", certified_allergen_ids: ["${al_peanut}"], certification_expiry_utc: "2027-01-01T00:00:00Z" }
              as: QaManager
              captures: { tech2: $.data.id }
            - call: "POST /qa/audit-findings"
              payload: { technician_id: "${tech1}", auditor_id: "${tech2}", finding_type: "PROCEDURE_DEVIATION", severity: "CRITICAL", corrective_action_due_utc: "2026-12-01T00:00:00Z" }
              as: Auditor
              as_user_id: "${tech2}"
            - call: "POST /qa/audit-findings"
              payload: { technician_id: "${tech1}", auditor_id: "${tech2}", finding_type: "DOCUMENTATION_GAP", severity: "CRITICAL", corrective_action_due_utc: "2026-12-01T00:00:00Z" }
              as: Auditor
              as_user_id: "${tech2}"
            - call: "POST /qa/audit-findings"
              payload: { technician_id: "${tech1}", auditor_id: "${tech2}", finding_type: "SWAB_TECHNIQUE", severity: "CRITICAL", corrective_action_due_utc: "2026-12-01T00:00:00Z" }
              as: Auditor
              as_user_id: "${tech2}"
            - call: "POST /qa/audit-findings"
              payload: { technician_id: "${tech1}", auditor_id: "${tech2}", finding_type: "TRAINING_DEFICIENCY", severity: "MAJOR", corrective_action_due_utc: "2026-12-01T00:00:00Z" }
              as: Auditor
              as_user_id: "${tech2}"
            - call: "POST /qa/audit-findings"
              payload: { technician_id: "${tech1}", auditor_id: "${tech2}", finding_type: "LABEL_CONTROL", severity: "MINOR", corrective_action_due_utc: "2026-12-01T00:00:00Z" }
              as: Auditor
              as_user_id: "${tech2}"
            - call: "POST /qa/audit-findings"
              payload: { technician_id: "${tech1}", auditor_id: "${tech2}", finding_type: "PROCEDURE_DEVIATION", severity: "MAJOR", corrective_action_due_utc: "2026-12-01T00:00:00Z" }
              as: Auditor
              as_user_id: "${tech2}"
            - call: "POST /qa/audit-findings"
              payload: { technician_id: "${tech1}", auditor_id: "${tech2}", finding_type: "DOCUMENTATION_GAP", severity: "MINOR", corrective_action_due_utc: "2026-12-01T00:00:00Z" }
              as: Auditor
              as_user_id: "${tech2}"
            - call: "POST /qa/audit-findings"
              payload: { technician_id: "${tech1}", auditor_id: "${tech2}", finding_type: "SWAB_TECHNIQUE", severity: "MINOR", corrective_action_due_utc: "2026-12-01T00:00:00Z" }
              as: Auditor
              as_user_id: "${tech2}"
          trigger:
            - call: "GET /qa/technicians/${tech1}"
              as: QaManager
              captures: { t1_status_pre: $.data.status, t1_score_pre: $.data.training_score }
            - call: "POST /qa/technicians/${tech1}/reinstate"
              as: QaManager
              captures: { t1_status_post: $.data.status, t1_score_post: $.data.training_score }
          assert:
            - "Pre-reinstate computed training_score == 100 - (15+15+15+5+2+5+2+2) == 39 -> floored at 39 (>=0), and status == SUSPENDED (auto at <60)"
            - "Post-reinstate training_score == 75 (REINSTATE_SCORE_FLOOR override), NOT 39"
            - "Post-reinstate status == ACTIVE"

  # ---------------------------------------------------------------------------
  # Rule 2 — combinatorial_formula: two instances in DIFFERENT modes
  # {(a) >=3-input non-linear, (b) nested rounding order, (c) circular-eval order}.
  # Instance 1 = mode (a); Instance 2 = mode (c).
  # ---------------------------------------------------------------------------
  - rule_id: combinatorial_formula
    instances:
      - name: changeover_validation_score_multi_input_tiered
        grounds:
          - calculations.changeover_validation_score
          - calculations.swab_outcome
        distinguishing_aspect: |
          Mode (a): a >=3-input non-linear formula (base + on-time bonus +
          tiered tardy penalty with floor+cap + per-swab margin bonus with cap
          + invalidated penalty, then outer clamp 0..100). A single changeover
          landing at actual=90, scheduled=60 with two margin-swabs and one
          INVALIDATED swab yields a literal score of 91 — each term
          independently observable.
        test_recipe:
          setup:
            - "Line LINE-2 OPEN, procedure COP-MILK-V1 APPROVED with min_swab_zones=2, atp_action_level_rlu=150, allergen_action_level_ppm=2.0"
            - "Run R from MILK product SCHEDULED; Changeover CO for R planned with scheduled_minutes=60"
            - "CO moved through PLANNED->IN_EXECUTION->finish-execution(actual_minutes=90)->SWAB_PENDING"
            - "Swab S1 ATP measured=70 (PASS, 70 <= 75 => margin +1); S2 ALLERGEN_ELISA measured=0.8 (PASS, 0.8 <= 1.0 => margin +1); S3 ATP measured=200 (would-be FAIL) then recorded INVALIDATED by separate call so cluster threshold not hit"
          setup_api_calls:
            - call: "POST /qa/allergens"
              payload: { code: "MILK", display_name: "Milk", regulatory_class: "MAJOR_9" }
              as: QaManager
              captures: { al_milk: $.data.id }
            - call: "POST /qa/production-lines"
              payload: { line_code: "LINE-2", description: "Line 2", sanitation_class: "WET_WASH" }
              as: QaManager
              captures: { line2: $.data.id, line2_v: $.data.version }
            - call: "POST /qa/line-allergen-matrix-entries"
              payload: { line_id: "${line2}", allergen_id: "${al_milk}", handling: "REQUIRES_CHANGEOVER", changeover_minutes: 60 }
              as: QaManager
            - call: "POST /qa/products"
              payload: { sku: "P-MILK", product_name: "Milk Bar", allergen_set: ["MILK"], rework_class: "NO_REWORK" }
              as: QaManager
              captures: { prod_milk: $.data.id }
            - call: "POST /qa/changeover-procedures"
              payload: { procedure_code: "COP-MILK-V1", target_allergen_id: "${al_milk}", method: "FULL_WET_WASH", min_swab_zones: 2, atp_action_level_rlu: 150, allergen_action_level_ppm: 2.0 }
              as: QaManager
              captures: { proc1: $.data.id, proc1_v: $.data.version }
            - call: "POST /qa/changeover-procedures/${proc1}/approve"
              payload: { expected_procedure_version: "${proc1_v}" }
              as: QaManager
            - call: "POST /qa/technicians"
              payload: { tech_code: "TECH-100", full_name: "Certified Tech", certified_allergen_ids: ["${al_milk}"], certification_expiry_utc: "2027-01-01T00:00:00Z" }
              as: QaManager
              captures: { tech1: $.data.id }
            - call: "POST /qa/production-runs"
              payload: { line_id: "${line2}", product_id: "${prod_milk}", planned_start_utc: "2026-06-02T08:00:00Z", planned_end_utc: "2026-06-02T12:00:00Z" }
              as: QaSupervisor
              captures: { run1: $.data.id }
            - call: "POST /qa/changeovers"
              payload: { line_id: "${line2}", from_run_id: null, to_run_id: "${run1}", procedure_id: "${proc1}", scheduled_minutes: 60 }
              as: QaSupervisor
              captures: { co1: $.data.id }
            - call: "POST /qa/production-runs/${run1}/schedule"
              payload: { expected_line_version: "${line2_v}" }
              as: QaSupervisor
            - call: "POST /qa/changeovers/${co1}/begin"
              as: LineOperator
            - call: "POST /qa/changeovers/${co1}/finish-execution"
              payload: { actual_minutes: 90 }
              as: LineOperator
          trigger:
            - call: "POST /qa/changeovers/${co1}/swab-results"
              payload: { zone_code: "BELT-A", swab_type: "ATP", measured_value: 70, recorded_by_id: "${tech1}" }
              as: QaTechnician
              as_user_id: "${tech1}"
            - call: "POST /qa/changeovers/${co1}/swab-results"
              payload: { zone_code: "HOPPER-1", swab_type: "ALLERGEN_ELISA", measured_value: 0.8, recorded_by_id: "${tech1}" }
              as: QaTechnician
              as_user_id: "${tech1}"
            - call: "POST /qa/changeovers/${co1}/swab-results"
              payload: { zone_code: "FRAME-3", swab_type: "ATP", measured_value: 999, invalidated_reason: "ZONE_REPLACED_BEFORE_READ", recorded_by_id: "${tech1}" }
              as: QaTechnician
              as_user_id: "${tech1}"
            - call: "GET /qa/changeovers/${co1}"
              as: QaSupervisor
              captures: { co_status: $.data.status, co_score: $.data.validation_score }
          assert:
            - "tardy_penalty == -min(20, floor((90-60)/5)) == -6"
            - "margin_bonus == +2 (two swabs <= half action level, cap 10 not reached)"
            - "invalidated_penalty == -2 (one INVALIDATED swab)"
            - "on_time_bonus == 0 (actual 90 > scheduled 60)"
            - "Changeover.${co1}.validation_score == 100 + 0 - 6 + 2 - 2 == 94"
            - "Changeover.${co1}.status == VALIDATED (2 distinct PASS zones >= min_swab_zones=2, no FAIL swabs)"

      - name: line_posture_circular_eval_order_pinned
        grounds:
          - calculations.line_posture
          - state_machines.ProductionLine.OPEN_to_HOLD
          - state_machines.ProductionLine.HOLD_to_RESTRICTED
        distinguishing_aspect: |
          Mode (c): circular-looking dependency — posture gates run-schedule,
          but posture is derived from incidents, and one incident (raise
          CRITICAL) flips posture HOLD which in turn blocks scheduling. The
          scaffold pins evaluation order: critical_open is counted BEFORE
          high_open, so a simultaneous CRITICAL+HIGH lands HOLD, and closing
          the CRITICAL while HIGH remains lands RESTRICTED (not OPEN) — a
          non-obvious order-dependent outcome.
        test_recipe:
          setup:
            - "Line LINE-3 OPEN with both a CRITICAL incident I-C and a HIGH incident I-H open"
            - "posture resolves HOLD (CRITICAL dominates)"
          setup_api_calls:
            - call: "POST /qa/production-lines"
              payload: { line_code: "LINE-3", description: "Line 3", sanitation_class: "DRY_CLEAN" }
              as: QaManager
              captures: { line3: $.data.id }
            - call: "POST /qa/incidents"
              payload: { incident_type: "UNDECLARED_ALLERGEN", severity: "HIGH", line_id: "${line3}", description: "high sev test" }
              as: QaSupervisor
              captures: { inc_h: $.data.id }
            - call: "POST /qa/incidents"
              payload: { incident_type: "UNDECLARED_ALLERGEN", severity: "CRITICAL", line_id: "${line3}", description: "critical sev test" }
              as: QaSupervisor
              captures: { inc_c: $.data.id }
            - call: "GET /qa/production-lines/${line3}"
              as: QaSupervisor
              captures: { posture_mid: $.data.posture }
            - call: "POST /qa/incidents/${inc_c}/begin-investigation"
              as: QaSupervisor
            - call: "POST /qa/incidents/${inc_c}/contain"
              payload: { containment_action: "Hold all product" }
              as: QaSupervisor
            - call: "POST /qa/incidents/${inc_c}/close"
              payload: { root_cause: "supplier mislabel" }
              as: QaManager
          trigger:
            - call: "GET /qa/production-lines/${line3}"
              as: QaSupervisor
              captures: { posture_final: $.data.posture }
          assert:
            - "With both CRITICAL and HIGH open, posture == HOLD (CRITICAL evaluated first)"
            - "After CRITICAL closed with HIGH still OPEN, posture == RESTRICTED (not OPEN)"
            - "The CRITICAL->closed cascade recomputes posture in the same request; no stale OPEN observable"

  # ---------------------------------------------------------------------------
  # Rule 3 — non_linear_state_machine on DIFFERENT entities.
  # ---------------------------------------------------------------------------
  - rule_id: non_linear_state_machine
    instances:
      - name: changeover_rework_cycle_swab_pending_to_rework_and_back
        grounds:
          - state_machines.Changeover.SWAB_PENDING_to_REWORK_REQUIRED
          - state_machines.Changeover.REWORK_REQUIRED_to_SWAB_PENDING
        distinguishing_aspect: |
          Cycle shape on Changeover: SWAB_PENDING -> REWORK_REQUIRED ->
          SWAB_PENDING is an explicit loop with compensation (prior FAIL swabs
          INVALIDATED with reason RESWAB). A single-FAIL changeover enters
          REWORK_REQUIRED, reswab returns it to SWAB_PENDING, and the
          previously failed zone now contributes a fresh PASS to validation.
        test_recipe:
          setup:
            - "Line LINE-4 OPEN; procedure APPROVED min_swab_zones=1, allergen_action_level_ppm=2.0, atp_action_level_rlu=150"
            - "Run SCHEDULED; Changeover moved to SWAB_PENDING"
            - "Certified technician exists"
          setup_api_calls:
            - call: "POST /qa/allergens"
              payload: { code: "SOY", display_name: "Soy", regulatory_class: "MAJOR_9" }
              as: QaManager
              captures: { al_soy: $.data.id }
            - call: "POST /qa/production-lines"
              payload: { line_code: "LINE-4", description: "Line 4", sanitation_class: "WET_WASH" }
              as: QaManager
              captures: { line4: $.data.id, line4_v: $.data.version }
            - call: "POST /qa/line-allergen-matrix-entries"
              payload: { line_id: "${line4}", allergen_id: "${al_soy}", handling: "REQUIRES_CHANGEOVER", changeover_minutes: 30 }
              as: QaManager
            - call: "POST /qa/products"
              payload: { sku: "P-SOY", product_name: "Soy Crisp", allergen_set: ["SOY"], rework_class: "NO_REWORK" }
              as: QaManager
              captures: { prod_soy: $.data.id }
            - call: "POST /qa/changeover-procedures"
              payload: { procedure_code: "COP-SOY-V1", target_allergen_id: "${al_soy}", method: "FULL_WET_WASH", min_swab_zones: 1, atp_action_level_rlu: 150, allergen_action_level_ppm: 2.0 }
              as: QaManager
              captures: { proc1: $.data.id, proc1_v: $.data.version }
            - call: "POST /qa/changeover-procedures/${proc1}/approve"
              payload: { expected_procedure_version: "${proc1_v}" }
              as: QaManager
            - call: "POST /qa/technicians"
              payload: { tech_code: "TECH-200", full_name: "Soy Tech", certified_allergen_ids: ["${al_soy}"], certification_expiry_utc: "2027-01-01T00:00:00Z" }
              as: QaManager
              captures: { tech1: $.data.id }
            - call: "POST /qa/production-runs"
              payload: { line_id: "${line4}", product_id: "${prod_soy}", planned_start_utc: "2026-06-03T08:00:00Z", planned_end_utc: "2026-06-03T12:00:00Z" }
              as: QaSupervisor
              captures: { run1: $.data.id }
            - call: "POST /qa/changeovers"
              payload: { line_id: "${line4}", from_run_id: null, to_run_id: "${run1}", procedure_id: "${proc1}", scheduled_minutes: 30 }
              as: QaSupervisor
              captures: { co1: $.data.id }
            - call: "POST /qa/production-runs/${run1}/schedule"
              payload: { expected_line_version: "${line4_v}" }
              as: QaSupervisor
            - call: "POST /qa/changeovers/${co1}/begin"
              as: LineOperator
            - call: "POST /qa/changeovers/${co1}/finish-execution"
              payload: { actual_minutes: 30 }
              as: LineOperator
            - call: "POST /qa/changeovers/${co1}/swab-results"
              payload: { zone_code: "BELT-A", swab_type: "ALLERGEN_ELISA", measured_value: 5.5, recorded_by_id: "${tech1}" }
              as: QaTechnician
              as_user_id: "${tech1}"
              captures: { swab_fail: $.data.id }
            - call: "GET /qa/changeovers/${co1}"
              as: QaSupervisor
              captures: { status_at_rework: $.data.status }
          trigger:
            - call: "POST /qa/changeovers/${co1}/reswab"
              as: LineOperator
              captures: { status_after_reswab: $.data.status }
            - call: "GET /qa/swab-results/${swab_fail}"
              as: QaSupervisor
              captures: { old_swab_outcome: $.data.outcome, old_swab_reason: $.data.invalidated_reason }
            - call: "POST /qa/changeovers/${co1}/swab-results"
              payload: { zone_code: "BELT-A", swab_type: "ALLERGEN_ELISA", measured_value: 0.5, recorded_by_id: "${tech1}" }
              as: QaTechnician
              as_user_id: "${tech1}"
            - call: "GET /qa/changeovers/${co1}"
              as: QaSupervisor
              captures: { status_final: $.data.status }
          assert:
            - "Single FAIL swab flips Changeover SWAB_PENDING -> REWORK_REQUIRED (not FAILED; cluster threshold = 2 not reached)"
            - "After reswab, Changeover back in SWAB_PENDING"
            - "Original FAIL swab outcome == INVALIDATED, invalidated_reason == 'RESWAB'"
            - "New PASS swab in same zone satisfies min_swab_zones=1; Changeover -> VALIDATED"

      - name: production_run_schedule_unschedule_cycle_recomputes_introduced
        grounds:
          - state_machines.ProductionRun.SCHEDULED_to_DRAFT
          - state_machines.ProductionRun.DRAFT_to_SCHEDULED
        distinguishing_aspect: |
          Cycle shape on ProductionRun (different entity than Changeover):
          DRAFT -> SCHEDULED -> DRAFT -> SCHEDULED loop. The first schedule
          pins introduced_allergens; unschedule clears them; the second
          schedule recomputes against a baseline that may have shifted — the
          cycle is not idempotent, and the cleared-then-recomputed fields are
          observable on each pass.
        test_recipe:
          setup:
            - "Line LINE-5 OPEN; matrix maps WHEAT REQUIRES_CHANGEOVER 40"
            - "Product P-WHEAT allergen_set=[WHEAT]"
            - "Run R created in DRAFT"
          setup_api_calls:
            - call: "POST /qa/allergens"
              payload: { code: "WHEAT", display_name: "Wheat", regulatory_class: "MAJOR_9" }
              as: QaManager
              captures: { al_wheat: $.data.id }
            - call: "POST /qa/production-lines"
              payload: { line_code: "LINE-5", description: "Line 5", sanitation_class: "DRY_CLEAN" }
              as: QaManager
              captures: { line5: $.data.id, line5_v: $.data.version }
            - call: "POST /qa/line-allergen-matrix-entries"
              payload: { line_id: "${line5}", allergen_id: "${al_wheat}", handling: "REQUIRES_CHANGEOVER", changeover_minutes: 40 }
              as: QaManager
            - call: "POST /qa/products"
              payload: { sku: "P-WHEAT", product_name: "Wheat Cracker", allergen_set: ["WHEAT"], rework_class: "NO_REWORK" }
              as: QaManager
              captures: { prod_wheat: $.data.id }
            - call: "POST /qa/changeover-procedures"
              payload: { procedure_code: "COP-WHEAT-V1", target_allergen_id: "${al_wheat}", method: "DRY_SCRAPE", min_swab_zones: 1, atp_action_level_rlu: 150, allergen_action_level_ppm: 2.0 }
              as: QaManager
              captures: { proc1: $.data.id, proc1_v: $.data.version }
            - call: "POST /qa/changeover-procedures/${proc1}/approve"
              payload: { expected_procedure_version: "${proc1_v}" }
              as: QaManager
            - call: "POST /qa/production-runs"
              payload: { line_id: "${line5}", product_id: "${prod_wheat}", planned_start_utc: "2026-06-04T08:00:00Z", planned_end_utc: "2026-06-04T12:00:00Z" }
              as: QaSupervisor
              captures: { run1: $.data.id }
            - call: "POST /qa/changeovers"
              payload: { line_id: "${line5}", from_run_id: null, to_run_id: "${run1}", procedure_id: "${proc1}", scheduled_minutes: 40 }
              as: QaSupervisor
              captures: { co1: $.data.id }
            - call: "POST /qa/production-runs/${run1}/schedule"
              payload: { expected_line_version: "${line5_v}" }
              as: QaSupervisor
              captures: { introduced_first: $.data.introduced_allergens, changeover_required_first: $.data.changeover_required }
          trigger:
            - call: "POST /qa/production-runs/${run1}/unschedule"
              as: QaSupervisor
              captures: { introduced_after_unschedule: $.data.introduced_allergens, status_after_unschedule: $.data.status }
            - call: "GET /qa/production-lines/${line5}"
              as: QaSupervisor
              captures: { line5_v2: $.data.version }
            - call: "POST /qa/production-runs/${run1}/schedule"
              payload: { expected_line_version: "${line5_v2}" }
              as: QaSupervisor
              captures: { introduced_second: $.data.introduced_allergens, status_second: $.data.status }
          assert:
            - "First schedule: introduced_allergens == [WHEAT], changeover_required == true"
            - "After unschedule: status == DRAFT and introduced_allergens == [] (cleared)"
            - "Second schedule succeeds (cycle permitted) and recomputes introduced_allergens == [WHEAT]"
            - "The unschedule->schedule loop is a legal cycle distinct from Changeover's rework loop"

  # ---------------------------------------------------------------------------
  # Rule 4 — transitive_cascade: two cascades from DIFFERENT triggers,
  # one depth >= 3, one depth >= 2.
  # ---------------------------------------------------------------------------
  - rule_id: transitive_cascade
    instances:
      - name: swab_fail_cluster_cascade_changeover_incident_line_hold_depth3
        grounds:
          - state_machines.Changeover.SWAB_PENDING_to_FAILED
          - state_machines.ProductionLine.OPEN_to_HOLD
          - calculations.line_posture
        distinguishing_aspect: |
          Depth-3 cascade triggered by POST swab-results (2nd FAIL):
          (hop 1) SwabResult created with outcome=FAIL -> (hop 2) Changeover
          auto-transitions SWAB_PENDING->FAILED which creates an Incident ->
          (hop 3) Incident CRITICAL/HIGH existence flips ProductionLine
          posture OPEN->HOLD. Each hop is caused by the prior mutation, not
          by the original request directly.
        test_recipe:
          setup:
            - "Line LINE-6 OPEN; procedure APPROVED min_swab_zones=2, allergen_action_level_ppm=2.0"
            - "Run SCHEDULED; Changeover in SWAB_PENDING"
            - "One FAIL swab already recorded (changeover in REWORK_REQUIRED)"
          setup_api_calls:
            - call: "POST /qa/allergens"
              payload: { code: "EGG", display_name: "Egg", regulatory_class: "MAJOR_9" }
              as: QaManager
              captures: { al_egg: $.data.id }
            - call: "POST /qa/production-lines"
              payload: { line_code: "LINE-6", description: "Line 6", sanitation_class: "WET_WASH" }
              as: QaManager
              captures: { line6: $.data.id, line6_v: $.data.version }
            - call: "POST /qa/line-allergen-matrix-entries"
              payload: { line_id: "${line6}", allergen_id: "${al_egg}", handling: "REQUIRES_CHANGEOVER", changeover_minutes: 30 }
              as: QaManager
            - call: "POST /qa/products"
              payload: { sku: "P-EGG", product_name: "Egg Noodle", allergen_set: ["EGG"], rework_class: "NO_REWORK" }
              as: QaManager
              captures: { prod_egg: $.data.id }
            - call: "POST /qa/changeover-procedures"
              payload: { procedure_code: "COP-EGG-V1", target_allergen_id: "${al_egg}", method: "FULL_WET_WASH", min_swab_zones: 2, atp_action_level_rlu: 150, allergen_action_level_ppm: 2.0 }
              as: QaManager
              captures: { proc1: $.data.id, proc1_v: $.data.version }
            - call: "POST /qa/changeover-procedures/${proc1}/approve"
              payload: { expected_procedure_version: "${proc1_v}" }
              as: QaManager
            - call: "POST /qa/technicians"
              payload: { tech_code: "TECH-300", full_name: "Egg Tech", certified_allergen_ids: ["${al_egg}"], certification_expiry_utc: "2027-01-01T00:00:00Z" }
              as: QaManager
              captures: { tech1: $.data.id }
            - call: "POST /qa/production-runs"
              payload: { line_id: "${line6}", product_id: "${prod_egg}", planned_start_utc: "2026-06-05T08:00:00Z", planned_end_utc: "2026-06-05T12:00:00Z" }
              as: QaSupervisor
              captures: { run1: $.data.id }
            - call: "POST /qa/changeovers"
              payload: { line_id: "${line6}", from_run_id: null, to_run_id: "${run1}", procedure_id: "${proc1}", scheduled_minutes: 30 }
              as: QaSupervisor
              captures: { co1: $.data.id }
            - call: "POST /qa/production-runs/${run1}/schedule"
              payload: { expected_line_version: "${line6_v}" }
              as: QaSupervisor
            - call: "POST /qa/changeovers/${co1}/begin"
              as: LineOperator
            - call: "POST /qa/changeovers/${co1}/finish-execution"
              payload: { actual_minutes: 25 }
              as: LineOperator
            - call: "POST /qa/changeovers/${co1}/swab-results"
              payload: { zone_code: "BELT-A", swab_type: "ALLERGEN_ELISA", measured_value: 9.0, recorded_by_id: "${tech1}" }
              as: QaTechnician
              as_user_id: "${tech1}"
            - call: "POST /qa/changeovers/${co1}/reswab"
              as: LineOperator
          trigger:
            - call: "POST /qa/changeovers/${co1}/swab-results"
              payload: { zone_code: "HOPPER-2", swab_type: "ALLERGEN_ELISA", measured_value: 8.5, recorded_by_id: "${tech1}" }
              as: QaTechnician
              as_user_id: "${tech1}"
              captures: { second_fail: $.data.id }
            - call: "GET /qa/changeovers/${co1}"
              as: QaSupervisor
              captures: { co_status: $.data.status }
            - call: "GET /qa/incidents"
              as: QaSupervisor
              captures: { first_incident_type: $.data.0.incident_type, first_incident_source: $.data.0.source_changeover_id, first_incident_severity: $.data.0.severity }
            - call: "GET /qa/production-lines/${line6}"
              as: QaSupervisor
              captures: { line_posture: $.data.posture }
          assert:
            - "Second FAIL swab is recorded with outcome FAIL"
            - "Hop 2: Changeover.${co1}.status == FAILED (cluster threshold 2 hit)"
            - "Hop 3: an Incident exists with incident_type == SWAB_FAILURE_CLUSTER, source_changeover_id == ${co1}, severity == HIGH"
            - "Hop 4 (aggregate): ProductionLine.${line6}.posture == HOLD (FAILED changeover counts toward HOLD per line_posture calc)"

      - name: run_cancel_cascade_changeover_swab_invalidate_depth2
        grounds:
          - state_machines.ProductionRun.SCHEDULED_to_CANCELLED
          - state_machines.Changeover.IN_EXECUTION_to_CANCELLED
        distinguishing_aspect: |
          Depth-2 cascade from a DIFFERENT trigger (run cancel, not swab
          record): (hop 1) POST /production-runs/{id}/cancel on a SCHEDULED
          run -> (hop 2) its IN_EXECUTION covering Changeover auto-CANCELLED
          -> (hop 3) all SwabResults recorded on that changeover are
          INVALIDATED with reason CHANGEOVER_CANCELLED. Trigger differs from
          instance 1; chain runs run->changeover->swab.
        test_recipe:
          setup:
            - "Line LINE-7 OPEN; procedure APPROVED"
            - "Run SCHEDULED with covering changeover; changeover moved IN_EXECUTION and one swab recorded"
          setup_api_calls:
            - call: "POST /qa/allergens"
              payload: { code: "SESAME", display_name: "Sesame", regulatory_class: "SESAME" }
              as: QaManager
              captures: { al_ses: $.data.id }
            - call: "POST /qa/production-lines"
              payload: { line_code: "LINE-7", description: "Line 7", sanitation_class: "DRY_CLEAN" }
              as: QaManager
              captures: { line7: $.data.id, line7_v: $.data.version }
            - call: "POST /qa/line-allergen-matrix-entries"
              payload: { line_id: "${line7}", allergen_id: "${al_ses}", handling: "REQUIRES_CHANGEOVER", changeover_minutes: 20 }
              as: QaManager
            - call: "POST /qa/products"
              payload: { sku: "P-SES", product_name: "Sesame Snap", allergen_set: ["SESAME"], rework_class: "NO_REWORK" }
              as: QaManager
              captures: { prod_ses: $.data.id }
            - call: "POST /qa/changeover-procedures"
              payload: { procedure_code: "COP-SES-V1", target_allergen_id: "${al_ses}", method: "DRY_SCRAPE", min_swab_zones: 1, atp_action_level_rlu: 150, allergen_action_level_ppm: 2.0 }
              as: QaManager
              captures: { proc1: $.data.id, proc1_v: $.data.version }
            - call: "POST /qa/changeover-procedures/${proc1}/approve"
              payload: { expected_procedure_version: "${proc1_v}" }
              as: QaManager
            - call: "POST /qa/technicians"
              payload: { tech_code: "TECH-400", full_name: "Sesame Tech", certified_allergen_ids: ["${al_ses}"], certification_expiry_utc: "2027-01-01T00:00:00Z" }
              as: QaManager
              captures: { tech1: $.data.id }
            - call: "POST /qa/production-runs"
              payload: { line_id: "${line7}", product_id: "${prod_ses}", planned_start_utc: "2026-06-06T08:00:00Z", planned_end_utc: "2026-06-06T12:00:00Z" }
              as: QaSupervisor
              captures: { run1: $.data.id }
            - call: "POST /qa/changeovers"
              payload: { line_id: "${line7}", from_run_id: null, to_run_id: "${run1}", procedure_id: "${proc1}", scheduled_minutes: 20 }
              as: QaSupervisor
              captures: { co1: $.data.id }
            - call: "POST /qa/production-runs/${run1}/schedule"
              payload: { expected_line_version: "${line7_v}" }
              as: QaSupervisor
            - call: "POST /qa/changeovers/${co1}/begin"
              as: LineOperator
            - call: "POST /qa/changeovers/${co1}/finish-execution"
              payload: { actual_minutes: 18 }
              as: LineOperator
            - call: "POST /qa/changeovers/${co1}/swab-results"
              payload: { zone_code: "BELT-A", swab_type: "ATP", measured_value: 80, recorded_by_id: "${tech1}" }
              as: QaTechnician
              as_user_id: "${tech1}"
              captures: { swab1: $.data.id }
          trigger:
            - call: "POST /qa/production-runs/${run1}/cancel"
              as: QaSupervisor
            - call: "GET /qa/changeovers/${co1}"
              as: QaSupervisor
              captures: { co_status: $.data.status }
            - call: "GET /qa/swab-results/${swab1}"
              as: QaSupervisor
              captures: { swab_outcome: $.data.outcome, swab_reason: $.data.invalidated_reason }
          assert:
            - "Hop 2: Changeover.${co1}.status == CANCELLED as a cascade of run cancel"
            - "Hop 3: SwabResult.${swab1}.outcome == INVALIDATED and invalidated_reason == 'CHANGEOVER_CANCELLED'"
            - "The original cancel call did not name the swab; the invalidation is purely cascade-driven"

  # ---------------------------------------------------------------------------
  # Rule 5 — priority_pair_validation_conflict: two dual-failure scenarios on
  # DIFFERENT error-category pairs.
  # ---------------------------------------------------------------------------
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: state_vs_business_safety_run_start_gates
        grounds:
          - validations[priority=5]
          - validations[priority=8]
          - errors[ERR_RUN_NOT_SCHEDULED]
          - errors[ERR_CHANGEOVER_NOT_VALIDATED]
        distinguishing_aspect: |
          Pair (state vs business_safety): a run that is BOTH in the wrong
          state (DRAFT, never scheduled) AND lacks a validated changeover
          triggers two checks; priority 5 (state) must win over priority 8
          (business_safety) so the observable error is ERR_RUN_NOT_SCHEDULED,
          not ERR_CHANGEOVER_NOT_VALIDATED.
        test_recipe:
          setup:
            - "Line LINE-8 OPEN; product P-FISH allergen_set=[FISH]; matrix FISH REQUIRES_CHANGEOVER 30"
            - "Run R created in DRAFT with no changeover plan (so changeover_required=true and no VALIDATED changeover exists)"
          setup_api_calls:
            - call: "POST /qa/allergens"
              payload: { code: "FISH", display_name: "Fish", regulatory_class: "MAJOR_9" }
              as: QaManager
              captures: { al_fish: $.data.id }
            - call: "POST /qa/production-lines"
              payload: { line_code: "LINE-8", description: "Line 8", sanitation_class: "WET_WASH" }
              as: QaManager
              captures: { line8: $.data.id }
            - call: "POST /qa/line-allergen-matrix-entries"
              payload: { line_id: "${line8}", allergen_id: "${al_fish}", handling: "REQUIRES_CHANGEOVER", changeover_minutes: 30 }
              as: QaManager
            - call: "POST /qa/products"
              payload: { sku: "P-FISH", product_name: "Fish Cake", allergen_set: ["FISH"], rework_class: "NO_REWORK" }
              as: QaManager
              captures: { prod_fish: $.data.id }
            - call: "POST /qa/production-runs"
              payload: { line_id: "${line8}", product_id: "${prod_fish}", planned_start_utc: "2026-06-07T08:00:00Z", planned_end_utc: "2026-06-07T12:00:00Z" }
              as: QaSupervisor
              captures: { run1: $.data.id }
            - call: "POST /qa/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-07T09:00:00Z" }
              as: QaManager
          trigger:
            - call: "POST /qa/production-runs/${run1}/start"
              as: LineOperator
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_RUN_NOT_SCHEDULED (priority 5 state check wins)"
            - "error_id != ERR_CHANGEOVER_NOT_VALIDATED (priority 8 business_safety suppressed by earlier failure)"

      - name: business_safety_vs_business_fiscal_rework_commit
        grounds:
          - validations[priority=10]
          - validations[priority=19]
          - errors[ERR_REWORK_ALLERGEN_BREACH]
          - errors[ERR_REWORK_EXHAUSTED]
        distinguishing_aspect: |
          Pair (business_safety vs business_fiscal): a rework commit that
          BOTH breaches allergen containment (rework allergens not subset of
          target) AND exceeds remaining_kg triggers priority 10 and priority
          19; the safety error ERR_REWORK_ALLERGEN_BREACH must win over the
          fiscal ERR_REWORK_EXHAUSTED.
        test_recipe:
          setup:
            - "Source product P-PEANUT allergen_set=[PEANUT]; target product P-MILK allergen_set=[MILK] with rework_class RESTRICTED_REWORK"
            - "Source run R-src COMPLETED on a line; ReworkBatch RB of 10 kg from R-src"
            - "Target run R-tgt of P-MILK exists on some line"
            - "Commit attempt requests 50 kg (exceeds remaining 10) AND allergen sets are disjoint"
          setup_api_calls:
            - call: "POST /qa/allergens"
              payload: { code: "PEANUT", display_name: "Peanut", regulatory_class: "MAJOR_9" }
              as: QaManager
              captures: { al_peanut: $.data.id }
            - call: "POST /qa/allergens"
              payload: { code: "MILK", display_name: "Milk", regulatory_class: "MAJOR_9" }
              as: QaManager
              captures: { al_milk: $.data.id }
            - call: "POST /qa/production-lines"
              payload: { line_code: "LINE-9", description: "Line 9", sanitation_class: "ALLERGEN_DEDICATED" }
              as: QaManager
              captures: { line9: $.data.id }
            - call: "POST /qa/products"
              payload: { sku: "P-PEANUT", product_name: "Peanut Butter Cup", allergen_set: ["PEANUT"], rework_class: "SAME_INTO_SAME" }
              as: QaManager
              captures: { prod_peanut: $.data.id }
            - call: "POST /qa/products"
              payload: { sku: "P-MILK-R", product_name: "Milk Chocolate", allergen_set: ["MILK"], rework_class: "RESTRICTED_REWORK" }
              as: QaManager
              captures: { prod_milk_r: $.data.id }
            - call: "POST /qa/production-runs"
              payload: { line_id: "${line9}", product_id: "${prod_peanut}", planned_start_utc: "2026-06-08T08:00:00Z", planned_end_utc: "2026-06-08T10:00:00Z" }
              as: QaSupervisor
              captures: { run_src: $.data.id }
            - call: "POST /qa/production-runs"
              payload: { line_id: "${line9}", product_id: "${prod_milk_r}", planned_start_utc: "2026-06-08T12:00:00Z", planned_end_utc: "2026-06-08T14:00:00Z" }
              as: QaSupervisor
              captures: { run_tgt: $.data.id }
            - call: "POST /qa/rework-batches"
              payload: { source_run_id: "${run_src}", source_product_id: "${prod_peanut}", quantity_kg: 10 }
              as: QaSupervisor
              captures: { batch1: $.data.id }
          trigger:
            - call: "POST /qa/rework-batches/${batch1}/commit"
              payload: { target_run_id: "${run_tgt}", quantity_kg: 50 }
              as: LineOperator
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_REWORK_ALLERGEN_BREACH (priority 10 business_safety wins)"
            - "error_id != ERR_REWORK_EXHAUSTED (priority 19 business_fiscal suppressed)"

  # ---------------------------------------------------------------------------
  # Rule 6 — boundary_precision_check: two boundaries on DIFFERENT metrics
  # reachable through DIFFERENT endpoints.
  # ---------------------------------------------------------------------------
  - rule_id: boundary_precision_check
    instances:
      - name: swab_action_level_exact_equality_is_fail
        grounds:
          - calculations.swab_outcome
          - validations[priority=11]
        distinguishing_aspect: |
          Numeric boundary: swab outcome uses strict inequality — measured_value
          < action_level_used => PASS, so measured_value EXACTLY EQUAL to the
          action level yields FAIL. Tested at allergen_action_level_ppm = 2.0
          with measured_value = 2.0 on POST /changeovers/{id}/swab-results.
        test_recipe:
          setup:
            - "Line LINE-10 OPEN; procedure APPROVED allergen_action_level_ppm=2.0, min_swab_zones=1"
            - "Run SCHEDULED; Changeover SWAB_PENDING; certified tech exists"
          setup_api_calls:
            - call: "POST /qa/allergens"
              payload: { code: "MUSTARD", display_name: "Mustard", regulatory_class: "OTHER" }
              as: QaManager
              captures: { al_mus: $.data.id }
            - call: "POST /qa/production-lines"
              payload: { line_code: "LINE-10", description: "Line 10", sanitation_class: "WET_WASH" }
              as: QaManager
              captures: { line10: $.data.id, line10_v: $.data.version }
            - call: "POST /qa/line-allergen-matrix-entries"
              payload: { line_id: "${line10}", allergen_id: "${al_mus}", handling: "REQUIRES_CHANGEOVER", changeover_minutes: 25 }
              as: QaManager
            - call: "POST /qa/products"
              payload: { sku: "P-MUS", product_name: "Mustard Pretzel", allergen_set: ["MUSTARD"], rework_class: "NO_REWORK" }
              as: QaManager
              captures: { prod_mus: $.data.id }
            - call: "POST /qa/changeover-procedures"
              payload: { procedure_code: "COP-MUS-V1", target_allergen_id: "${al_mus}", method: "FULL_WET_WASH", min_swab_zones: 1, atp_action_level_rlu: 150, allergen_action_level_ppm: 2.0 }
              as: QaManager
              captures: { proc1: $.data.id, proc1_v: $.data.version }
            - call: "POST /qa/changeover-procedures/${proc1}/approve"
              payload: { expected_procedure_version: "${proc1_v}" }
              as: QaManager
            - call: "POST /qa/technicians"
              payload: { tech_code: "TECH-500", full_name: "Mustard Tech", certified_allergen_ids: ["${al_mus}"], certification_expiry_utc: "2027-01-01T00:00:00Z" }
              as: QaManager
              captures: { tech1: $.data.id }
            - call: "POST /qa/production-runs"
              payload: { line_id: "${line10}", product_id: "${prod_mus}", planned_start_utc: "2026-06-09T08:00:00Z", planned_end_utc: "2026-06-09T12:00:00Z" }
              as: QaSupervisor
              captures: { run1: $.data.id }
            - call: "POST /qa/changeovers"
              payload: { line_id: "${line10}", from_run_id: null, to_run_id: "${run1}", procedure_id: "${proc1}", scheduled_minutes: 25 }
              as: QaSupervisor
              captures: { co1: $.data.id }
            - call: "POST /qa/production-runs/${run1}/schedule"
              payload: { expected_line_version: "${line10_v}" }
              as: QaSupervisor
            - call: "POST /qa/changeovers/${co1}/begin"
              as: LineOperator
            - call: "POST /qa/changeovers/${co1}/finish-execution"
              payload: { actual_minutes: 20 }
              as: LineOperator
          trigger:
            - call: "POST /qa/changeovers/${co1}/swab-results"
              payload: { zone_code: "BELT-A", swab_type: "ALLERGEN_ELISA", measured_value: 2.0, recorded_by_id: "${tech1}" }
              as: QaTechnician
              as_user_id: "${tech1}"
              captures: { swab_eq: $.data.outcome, swab_al: $.data.action_level_used }
            - call: "POST /qa/changeovers/${co1}/swab-results"
              payload: { zone_code: "BELT-B", swab_type: "ALLERGEN_ELISA", measured_value: 1.999, recorded_by_id: "${tech1}" }
              as: QaTechnician
              as_user_id: "${tech1}"
              captures: { swab_below: $.data.outcome }
          assert:
            - "Swab at measured_value == 2.0 (== action_level) has outcome == FAIL (strict < boundary)"
            - "action_level_used == 2.0"
            - "Swab at measured_value == 1.999 (< action_level) has outcome == PASS"

      - name: run_overlap_half_open_adjacency_allowed
        grounds:
          - validations[priority=12]
          - errors[ERR_RUN_OVERLAP]
        distinguishing_aspect: |
          Interval boundary on a DIFFERENT metric (temporal interval vs
          numeric threshold) through a DIFFERENT endpoint (POST
          /production-runs/{id}/schedule): half-open [start, end) semantics
          mean a run ending at 12:00 and another starting at 12:00 do NOT
          overlap (adjacent allowed), while [11:00, 12:00) vs [11:30, 12:30)
          do overlap.
        test_recipe:
          setup:
            - "Line LINE-11 OPEN (ALLERGEN_DEDICATED so no changeover needed)"
            - "Product P-PLAIN allergen_set=[]; Run R1 SCHEDULED 08:00-12:00"
          setup_api_calls:
            - call: "POST /qa/production-lines"
              payload: { line_code: "LINE-11", description: "Line 11", sanitation_class: "ALLERGEN_DEDICATED" }
              as: QaManager
              captures: { line11: $.data.id, line11_v: $.data.version }
            - call: "POST /qa/products"
              payload: { sku: "P-PLAIN", product_name: "Plain Cracker", allergen_set: [], rework_class: "NO_REWORK" }
              as: QaManager
              captures: { prod_plain: $.data.id }
            - call: "POST /qa/production-runs"
              payload: { line_id: "${line11}", product_id: "${prod_plain}", planned_start_utc: "2026-06-10T08:00:00Z", planned_end_utc: "2026-06-10T12:00:00Z" }
              as: QaSupervisor
              captures: { run1: $.data.id }
            - call: "POST /qa/production-runs/${run1}/schedule"
              payload: { expected_line_version: "${line11_v}" }
              as: QaSupervisor
            - call: "POST /qa/production-runs"
              payload: { line_id: "${line11}", product_id: "${prod_plain}", planned_start_utc: "2026-06-10T12:00:00Z", planned_end_utc: "2026-06-10T16:00:00Z" }
              as: QaSupervisor
              captures: { run_adjacent: $.data.id }
            - call: "POST /qa/production-runs"
              payload: { line_id: "${line11}", product_id: "${prod_plain}", planned_start_utc: "2026-06-10T11:30:00Z", planned_end_utc: "2026-06-10T12:30:00Z" }
              as: QaSupervisor
              captures: { run_overlap: $.data.id }
          trigger:
            - call: "GET /qa/production-lines/${line11}"
              as: QaSupervisor
              captures: { line11_v2: $.data.version }
            - call: "POST /qa/production-runs/${run_adjacent}/schedule"
              payload: { expected_line_version: "${line11_v2}" }
              as: QaSupervisor
              captures: { adjacent_status: $.data.status }
            - call: "GET /qa/production-lines/${line11}"
              as: QaSupervisor
              captures: { line11_v3: $.data.version }
            - call: "POST /qa/production-runs/${run_overlap}/schedule"
              payload: { expected_line_version: "${line11_v3}" }
              as: QaSupervisor
              captures: { err: $.data.error_id }
          assert:
            - "Adjacent run starting exactly at R1.end (12:00) schedules successfully (status == SCHEDULED) — half-open boundary"
            - "Overlapping run [11:30,12:30) vs R1 [08:00,12:00) rejected with error_id == ERR_RUN_OVERLAP"

  # ---------------------------------------------------------------------------
  # Rule 7 — cross_entity_state_dependency across DIFFERENT entity pairs.
  # ---------------------------------------------------------------------------
  - rule_id: cross_entity_state_dependency
    instances:
      - name: run_start_gated_by_changeover_validated_state
        grounds:
          - state_machines.ProductionRun.SCHEDULED_to_IN_PROGRESS
          - state_machines.Changeover.SWAB_PENDING_to_VALIDATED
          - validations[priority=8]
        distinguishing_aspect: |
          Pair (ProductionRun x Changeover): a SCHEDULED run whose
          changeover_required=true cannot start while its covering Changeover
          is SWAB_PENDING (not VALIDATED). The same start succeeds immediately
          after the changeover reaches VALIDATED via swab recording — a
          cross-entity gate.
        test_recipe:
          setup:
            - "Line LINE-12 OPEN; product P-NUT2 allergen_set=[PEANUT]; matrix PEANUT REQUIRES_CHANGEOVER 30"
            - "Procedure APPROVED min_swab_zones=1; tech certified"
            - "Run R SCHEDULED with covering Changeover CO in SWAB_PENDING"
            - "Logical clock advanced past R.planned_start_utc"
          setup_api_calls:
            - call: "POST /qa/allergens"
              payload: { code: "PEANUT", display_name: "Peanut", regulatory_class: "MAJOR_9" }
              as: QaManager
              captures: { al_peanut: $.data.id }
            - call: "POST /qa/production-lines"
              payload: { line_code: "LINE-12", description: "Line 12", sanitation_class: "WET_WASH" }
              as: QaManager
              captures: { line12: $.data.id, line12_v: $.data.version }
            - call: "POST /qa/line-allergen-matrix-entries"
              payload: { line_id: "${line12}", allergen_id: "${al_peanut}", handling: "REQUIRES_CHANGEOVER", changeover_minutes: 30 }
              as: QaManager
            - call: "POST /qa/products"
              payload: { sku: "P-NUT2", product_name: "Nut Cluster", allergen_set: ["PEANUT"], rework_class: "NO_REWORK" }
              as: QaManager
              captures: { prod_nut: $.data.id }
            - call: "POST /qa/changeover-procedures"
              payload: { procedure_code: "COP-PN2-V1", target_allergen_id: "${al_peanut}", method: "FULL_WET_WASH", min_swab_zones: 1, atp_action_level_rlu: 150, allergen_action_level_ppm: 2.0 }
              as: QaManager
              captures: { proc1: $.data.id, proc1_v: $.data.version }
            - call: "POST /qa/changeover-procedures/${proc1}/approve"
              payload: { expected_procedure_version: "${proc1_v}" }
              as: QaManager
            - call: "POST /qa/technicians"
              payload: { tech_code: "TECH-600", full_name: "Peanut Tech", certified_allergen_ids: ["${al_peanut}"], certification_expiry_utc: "2027-01-01T00:00:00Z" }
              as: QaManager
              captures: { tech1: $.data.id }
            - call: "POST /qa/production-runs"
              payload: { line_id: "${line12}", product_id: "${prod_nut}", planned_start_utc: "2026-06-11T08:00:00Z", planned_end_utc: "2026-06-11T12:00:00Z" }
              as: QaSupervisor
              captures: { run1: $.data.id }
            - call: "POST /qa/changeovers"
              payload: { line_id: "${line12}", from_run_id: null, to_run_id: "${run1}", procedure_id: "${proc1}", scheduled_minutes: 30 }
              as: QaSupervisor
              captures: { co1: $.data.id }
            - call: "POST /qa/production-runs/${run1}/schedule"
              payload: { expected_line_version: "${line12_v}" }
              as: QaSupervisor
            - call: "POST /qa/changeovers/${co1}/begin"
              as: LineOperator
            - call: "POST /qa/changeovers/${co1}/finish-execution"
              payload: { actual_minutes: 28 }
              as: LineOperator
            - call: "POST /qa/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-11T09:00:00Z" }
              as: QaManager
          trigger:
            - call: "POST /qa/production-runs/${run1}/start"
              as: LineOperator
              captures: { err: $.data.error_id }
            - call: "POST /qa/changeovers/${co1}/swab-results"
              payload: { zone_code: "BELT-A", swab_type: "ALLERGEN_ELISA", measured_value: 0.3, recorded_by_id: "${tech1}" }
              as: QaTechnician
              as_user_id: "${tech1}"
            - call: "POST /qa/production-runs/${run1}/start"
              as: LineOperator
              captures: { run_status: $.data.status }
          assert:
            - "First start attempt (changeover SWAB_PENDING) rejected with error_id == ERR_CHANGEOVER_NOT_VALIDATED"
            - "After recording a PASS swab, Changeover auto-VALIDATED"
            - "Second start attempt succeeds: Run.${run1}.status == IN_PROGRESS"
            - "ProductionLine.last_validated_changeover_id == ${co1}"

      - name: incident_close_segregation_of_duties_against_recorder
        grounds:
          - state_machines.Incident.CONTAINED_to_CLOSED
          - validations[priority=15]
          - errors[ERR_SEGREGATION_OF_DUTIES]
        distinguishing_aspect: |
          Pair (Incident x QaTechnician/SwabResult): incident closure requires
          the closing QaManager's actor context to differ from the technician
          who recorded the triggering swab — a cross-entity segregation-of-
          duties gate distinct from the Run x Changeover pair. (Verified via
          auditor_id vs technician_id on AuditFinding creation instead: same
          user on both sides is rejected.)
        test_recipe:
          setup:
            - "Technicians T1 and T2 exist; T1 attempts to audit themselves"
          setup_api_calls:
            - call: "POST /qa/allergens"
              payload: { code: "MILK", display_name: "Milk", regulatory_class: "MAJOR_9" }
              as: QaManager
              captures: { al_milk: $.data.id }
            - call: "POST /qa/technicians"
              payload: { tech_code: "TECH-700", full_name: "Self Auditor", certified_allergen_ids: ["${al_milk}"], certification_expiry_utc: "2027-01-01T00:00:00Z" }
              as: QaManager
              captures: { tech1: $.data.id }
            - call: "POST /qa/technicians"
              payload: { tech_code: "TECH-701", full_name: "Peer Auditor", certified_allergen_ids: ["${al_milk}"], certification_expiry_utc: "2027-01-01T00:00:00Z" }
              as: QaManager
              captures: { tech2: $.data.id }
          trigger:
            - call: "POST /qa/audit-findings"
              payload: { technician_id: "${tech1}", auditor_id: "${tech1}", finding_type: "PROCEDURE_DEVIATION", severity: "MINOR", corrective_action_due_utc: "2026-12-01T00:00:00Z" }
              as: Auditor
              as_user_id: "${tech1}"
              captures: { err: $.data.error_id }
            - call: "POST /qa/audit-findings"
              payload: { technician_id: "${tech1}", auditor_id: "${tech2}", finding_type: "PROCEDURE_DEVIATION", severity: "MINOR", corrective_action_due_utc: "2026-12-01T00:00:00Z" }
              as: Auditor
              as_user_id: "${tech2}"
              captures: { finding_ok: $.data.id, finding_status: $.data.status }
          assert:
            - "Self-audit (technician_id == auditor_id) rejected with error_id == ERR_SEGREGATION_OF_DUTIES"
            - "Peer audit succeeds; finding status == OPEN"

  # ---------------------------------------------------------------------------
  # Rule 8 — resource_temporal_overlap with DIFFERENT interval semantics on
  # DIFFERENT resources.
  # ---------------------------------------------------------------------------
  - rule_id: resource_temporal_overlap
    instances:
      - name: run_interval_half_open_overlap_on_line
        grounds:
          - validations[priority=12]
          - errors[ERR_RUN_OVERLAP]
        distinguishing_aspect: |
          Interval semantics = half-open [start, end) on ProductionLine:
          [08:00,12:00) vs [11:59,13:00) overlap (rejected); [08:00,12:00)
          vs [12:00,16:00) do not (adjacency allowed). Distinct semantics
          from the changeover-budget 'aggregate capacity' semantics below.
        test_recipe:
          setup:
            - "Line LINE-13 OPEN ALLERGEN_DEDICATED; product P-PLAIN allergen_set=[]; R1 SCHEDULED 08:00-12:00"
          setup_api_calls:
            - call: "POST /qa/production-lines"
              payload: { line_code: "LINE-13", description: "Line 13", sanitation_class: "ALLERGEN_DEDICATED" }
              as: QaManager
              captures: { line13: $.data.id, line13_v: $.data.version }
            - call: "POST /qa/products"
              payload: { sku: "P-PLAIN", product_name: "Plain Cracker", allergen_set: [], rework_class: "NO_REWORK" }
              as: QaManager
              captures: { prod_plain: $.data.id }
            - call: "POST /qa/production-runs"
              payload: { line_id: "${line13}", product_id: "${prod_plain}", planned_start_utc: "2026-06-12T08:00:00Z", planned_end_utc: "2026-06-12T12:00:00Z" }
              as: QaSupervisor
              captures: { run1: $.data.id }
            - call: "POST /qa/production-runs/${run1}/schedule"
              payload: { expected_line_version: "${line13_v}" }
              as: QaSupervisor
            - call: "POST /qa/production-runs"
              payload: { line_id: "${line13}", product_id: "${prod_plain}", planned_start_utc: "2026-06-12T11:59:00Z", planned_end_utc: "2026-06-12T13:00:00Z" }
              as: QaSupervisor
              captures: { run_overlap: $.data.id }
          trigger:
            - call: "GET /qa/production-lines/${line13}"
              as: QaSupervisor
              captures: { line13_v2: $.data.version }
            - call: "POST /qa/production-runs/${run_overlap}/schedule"
              payload: { expected_line_version: "${line13_v2}" }
              as: QaSupervisor
              captures: { err: $.data.error_id }
          assert:
            - "Overlapping by one minute (11:59 < 12:00) is rejected with ERR_RUN_OVERLAP"
            - "Half-open semantics: only [start, end) interior counts; end==other.start is allowed"

      - name: changeover_budget_aggregate_capacity_minutes
        grounds:
          - validations[priority=20]
          - errors[ERR_CHANGEOVER_BUDGET_SHORT]
          - calculations.scheduled_changeover_minutes
        distinguishing_aspect: |
          Interval semantics = aggregate capacity / duration budget on
          Changeover (different resource than ProductionLine): the
          changeover's scheduled_minutes must be >= the to_run's computed
          scheduled_changeover_minutes (max over introduced allergens'
          matrix changeover_minutes). scheduled_minutes exactly equal to the
          requirement is accepted (>= boundary); one minute short is rejected.
        test_recipe:
          setup:
            - "Line LINE-14 OPEN; allergens PEANUT (45 min) and MILK (60 min) both REQUIRES_CHANGEOVER"
            - "Product P-BOTH allergen_set=[PEANUT, MILK]; run R introduces both -> scheduled_changeover_minutes = max(45,60) = 60"
          setup_api_calls:
            - call: "POST /qa/allergens"
              payload: { code: "PEANUT", display_name: "Peanut", regulatory_class: "MAJOR_9" }
              as: QaManager
              captures: { al_peanut: $.data.id }
            - call: "POST /qa/allergens"
              payload: { code: "MILK", display_name: "Milk", regulatory_class: "MAJOR_9" }
              as: QaManager
              captures: { al_milk: $.data.id }
            - call: "POST /qa/production-lines"
              payload: { line_code: "LINE-14", description: "Line 14", sanitation_class: "WET_WASH" }
              as: QaManager
              captures: { line14: $.data.id }
            - call: "POST /qa/line-allergen-matrix-entries"
              payload: { line_id: "${line14}", allergen_id: "${al_peanut}", handling: "REQUIRES_CHANGEOVER", changeover_minutes: 45 }
              as: QaManager
            - call: "POST /qa/line-allergen-matrix-entries"
              payload: { line_id: "${line14}", allergen_id: "${al_milk}", handling: "REQUIRES_CHANGEOVER", changeover_minutes: 60 }
              as: QaManager
            - call: "POST /qa/products"
              payload: { sku: "P-BOTH", product_name: "Trail Mix", allergen_set: ["PEANUT", "MILK"], rework_class: "NO_REWORK" }
              as: QaManager
              captures: { prod_both: $.data.id }
            - call: "POST /qa/changeover-procedures"
              payload: { procedure_code: "COP-BOTH-V1", target_allergen_id: "${al_peanut}", method: "FULL_WET_WASH", min_swab_zones: 1, atp_action_level_rlu: 150, allergen_action_level_ppm: 2.0 }
              as: QaManager
              captures: { proc1: $.data.id, proc1_v: $.data.version }
            - call: "POST /qa/changeover-procedures/${proc1}/approve"
              payload: { expected_procedure_version: "${proc1_v}" }
              as: QaManager
            - call: "POST /qa/production-runs"
              payload: { line_id: "${line14}", product_id: "${prod_both}", planned_start_utc: "2026-06-13T08:00:00Z", planned_end_utc: "2026-06-13T12:00:00Z" }
              as: QaSupervisor
              captures: { run1: $.data.id, run1_req_minutes: $.data.scheduled_changeover_minutes }
            - call: "POST /qa/changeovers"
              payload: { line_id: "${line14}", from_run_id: null, to_run_id: "${run1}", procedure_id: "${proc1}", scheduled_minutes: 59 }
              as: QaSupervisor
              captures: { err: $.data.error_id }
          trigger:
            - call: "POST /qa/changeovers"
              payload: { line_id: "${line14}", from_run_id: null, to_run_id: "${run1}", procedure_id: "${proc1}", scheduled_minutes: 60 }
              as: QaSupervisor
              captures: { co_ok: $.data.id, co_status: $.data.status }
          assert:
            - "Run.${run1}.scheduled_changeover_minutes == 60 (max of 45, 60 over introduced allergens)"
            - "Changeover with scheduled_minutes=59 rejected with ERR_CHANGEOVER_BUDGET_SHORT (59 < 60)"
            - "Changeover with scheduled_minutes=60 accepted (>= boundary inclusive), status == PLANNED"

  # ---------------------------------------------------------------------------
  # Rule 9 — compensating_invariant across DIFFERENT conserved quantities.
  # ---------------------------------------------------------------------------
  - rule_id: compensating_invariant
    instances:
      - name: rework_mass_conservation_commit_scrap
        grounds:
          - state_machines.ReworkBatch.AVAILABLE_to_COMMITTED
          - state_machines.ReworkBatch.AVAILABLE_to_SCRAPPED
          - calculations.rework_eligibility
        distinguishing_aspect: |
          Conserved quantity = rework mass: for any ReworkBatch,
          remaining_kg + committed_kg + scrapped_kg == quantity_kg at all
          times. A partial commit followed by a scrap leaves the sum
          unchanged; drift would violate the invariant.
        test_recipe:
          setup:
            - "Product P-A allergen_set=[MILK], rework_class SAME_ALLERGEN_PROFILE; Product P-B allergen_set=[MILK], rework_class SAME_ALLERGEN_PROFILE"
            - "Run R-src COMPLETED producing P-A; ReworkBatch RB quantity 100 kg"
            - "Run R-tgt producing P-B exists on same line"
          setup_api_calls:
            - call: "POST /qa/allergens"
              payload: { code: "MILK", display_name: "Milk", regulatory_class: "MAJOR_9" }
              as: QaManager
              captures: { al_milk: $.data.id }
            - call: "POST /qa/production-lines"
              payload: { line_code: "LINE-15", description: "Line 15", sanitation_class: "ALLERGEN_DEDICATED" }
              as: QaManager
              captures: { line15: $.data.id }
            - call: "POST /qa/products"
              payload: { sku: "P-A", product_name: "Milk Choc A", allergen_set: ["MILK"], rework_class: "SAME_ALLERGEN_PROFILE" }
              as: QaManager
              captures: { prod_a: $.data.id }
            - call: "POST /qa/products"
              payload: { sku: "P-B", product_name: "Milk Choc B", allergen_set: ["MILK"], rework_class: "SAME_ALLERGEN_PROFILE" }
              as: QaManager
              captures: { prod_b: $.data.id }
            - call: "POST /qa/production-runs"
              payload: { line_id: "${line15}", product_id: "${prod_a}", planned_start_utc: "2026-06-14T08:00:00Z", planned_end_utc: "2026-06-14T10:00:00Z" }
              as: QaSupervisor
              captures: { run_src: $.data.id }
            - call: "POST /qa/production-runs"
              payload: { line_id: "${line15}", product_id: "${prod_b}", planned_start_utc: "2026-06-14T12:00:00Z", planned_end_utc: "2026-06-14T14:00:00Z" }
              as: QaSupervisor
              captures: { run_tgt: $.data.id }
            - call: "POST /qa/rework-batches"
              payload: { source_run_id: "${run_src}", source_product_id: "${prod_a}", quantity_kg: 100 }
              as: QaSupervisor
              captures: { batch1: $.data.id, batch1_remaining_0: $.data.remaining_kg }
            - call: "POST /qa/rework-batches/${batch1}/commit"
              payload: { target_run_id: "${run_tgt}", quantity_kg: 40 }
              as: LineOperator
              captures: { batch1_remaining_1: $.data.remaining_kg, batch1_status_1: $.data.status }
          trigger:
            - call: "POST /qa/rework-batches/${batch1}/scrap"
              as: QaSupervisor
              captures: { batch1_remaining_2: $.data.remaining_kg, batch1_status_2: $.data.status }
          assert:
            - "At creation: remaining_kg == 100 (invariant: 100 + 0 + 0 == 100)"
            - "After commit of 40 kg: remaining_kg == 60 and status == AVAILABLE (40 committed + 60 remaining == 100)"
            - "After scrap: remaining_kg == 0 and status == SCRAPPED (40 committed + 60 scrapped == 100; invariant holds)"

      - name: training_score_conservation_waive_refund
        grounds:
          - calculations.training_score
          - state_machines.AuditFinding.OPEN_to_WAIVED
        distinguishing_aspect: |
          Conserved quantity = training-score points: a MINOR finding deducts
          2 points on creation (score 100 -> 98) and waiving the finding
          refunds exactly the same 2 points (98 -> 100). Forward+compensating
          action leaves the named quantity unchanged — a different conserved
          quantity (score points) than rework mass.
        test_recipe:
          setup:
            - "Technicians T1 (auditee) and T2 (auditor) exist"
          setup_api_calls:
            - call: "POST /qa/allergens"
              payload: { code: "MILK", display_name: "Milk", regulatory_class: "MAJOR_9" }
              as: QaManager
              captures: { al_milk: $.data.id }
            - call: "POST /qa/technicians"
              payload: { tech_code: "TECH-800", full_name: "Auditee", certified_allergen_ids: ["${al_milk}"], certification_expiry_utc: "2027-01-01T00:00:00Z" }
              as: QaManager
              captures: { tech1: $.data.id, t1_score_0: $.data.training_score }
            - call: "POST /qa/technicians"
              payload: { tech_code: "TECH-801", full_name: "Auditor", certified_allergen_ids: ["${al_milk}"], certification_expiry_utc: "2027-01-01T00:00:00Z" }
              as: QaManager
              captures: { tech2: $.data.id }
            - call: "POST /qa/audit-findings"
              payload: { technician_id: "${tech1}", auditor_id: "${tech2}", finding_type: "DOCUMENTATION_GAP", severity: "MINOR", corrective_action_due_utc: "2026-12-01T00:00:00Z" }
              as: Auditor
              as_user_id: "${tech2}"
              captures: { finding1: $.data.id }
            - call: "GET /qa/technicians/${tech1}"
              as: QaManager
              captures: { t1_score_1: $.data.training_score }
          trigger:
            - call: "POST /qa/audit-findings/${finding1}/waive"
              as: QaManager
              captures: { finding_status: $.data.status }
            - call: "GET /qa/technicians/${tech1}"
              as: QaManager
              captures: { t1_score_2: $.data.training_score }
          assert:
            - "Initial training_score == 100"
            - "After MINOR finding: training_score == 98 (deduction 2)"
            - "After waive: finding status == WAIVED and training_score == 100 (exact refund — no drift)"
