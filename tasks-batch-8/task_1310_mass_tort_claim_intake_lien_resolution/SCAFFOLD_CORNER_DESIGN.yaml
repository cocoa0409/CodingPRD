              payload: { provider_name: "Y", record_type: "TREATMENT", severity_score: 65, confirms_qualifying_injury: false }
              as: RecordsAnalyst
              captures: { r2: $.data.id }
            - call: "POST /settlement-programs/${pid}/claims/${cid}/medical-records/${r1}/accept"
              payload: {}
              as: RecordsAnalyst
            - call: "POST /settlement-programs/${pid}/claims/${cid}/medical-records/${r2}/accept"
              payload: {}
              as: RecordsAnalyst
            - call: "POST /settlement-programs/${pid}/claims/${cid}/verify-injury"
              payload: {}
              as: RecordsAnalyst
            - call: "GET /settlement-programs/${pid}/claims/${cid}"
              as: ProgramAdministrator
              captures: { v_pre: $.data.version }
          trigger:
            - call: "POST /settlement-programs/${pid}/claims/${cid}/assign-tier"
              payload: { tier_matrix_id: "${tmid}", expected_claim_version: "${v_pre}" }
              as: ProgramAdministrator
              captures: { gross: $.data.gross_award_cents, fee: $.data.attorney_fee_cents, net: $.data.net_award_cents, status: $.data.status }
          assert:
            - "captured status == TIER_ASSIGNED"
            - "captured gross == 5000000"
            - "captured fee == 2000000 (= round(5000000*0.4) - 0)"
            - "captured net == 3000000"
