      - name: crew_lifecycle_blocks_released_crew_windows_and_late_support_plans
        claim_type: cross_entity_validation
        grounds:
          - validations[priority=54]
          - validations[priority=27]
          - errors[ERR_CREW_MISMATCH]
          - errors[ERR_INVALID_CREW_STATE]
          - state_machines.Crew.CERTIFIED_to_RELEASED
        distinguishing_aspect: |
          Crew state constrains work in both directions: a RELEASED crew cannot
          be named on a NEW harvest window (422 ERR_CREW_MISMATCH, the same error
          id the payroll crew check uses), and a CERTIFIED crew's housing and
          transport plan can no longer be re-cut (409 ERR_INVALID_CREW_STATE),
          so the support plan is only writable while the crew is RECRUITING or
          STAFFED.
        test_recipe:
          setup:
            - "One STRAWBERRY block (no water sample needed: window creation has no posture gate)."
            - "Crew R: one trained picker, support plan for 1 bed and 1 seat, certified, then released with a clear wage ledger."
            - "Crew C: one trained picker, support plan recorded, certified and left CERTIFIED."
          setup_api_calls:
            - call: "POST /berry-ops/blocks"
              payload: { name: "BLK-V17", variety: "STRAWBERRY", acres: 8.00, planting_year: 2021, irrigation_source_code: "WELL-V17" }
              as: HarvestManager
              as_user_id: "hm-1"
