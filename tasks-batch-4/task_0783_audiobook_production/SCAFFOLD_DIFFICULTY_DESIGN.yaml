  # =================================================================
  # Rule 8 — resource temporal-overlap conflicts across different interval semantics
  # =================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: booking_halfopen_adjacency_allowed_overlap_rejected
        grounds:
          - validations[priority=11]
          - state_machines.ProductionBooking.transitions
          - errors[ERR_BOOKING_OVERLAP]
        distinguishing_aspect: |
          Resource = Narrator, half-open [start_date, end_date) intervals: an adjacent booking
          [2026-04-10, 2026-04-15) after [2026-04-01, 2026-04-10) is accepted (touching endpoints do not overlap),
          while an interior overlap [2026-04-09, 2026-04-12) is rejected with ERR_BOOKING_OVERLAP.
        test_recipe:
          setup:
            - "A narrator with one ACTIVE booking [2026-04-01, 2026-04-10)."
          setup_api_calls:
            - call: "POST /authors"
              payload: { name: "A15", email: "a15@x.com" }
              as: PlatformAdmin
              captures: { au: $.data.id }
            - call: "POST /narrators"
              payload: { name: "N15", email: "n15@x.com", hourly_rate_cents: 20000 }
              as: PlatformAdmin
              captures: { na: $.data.id }
            - call: "POST /titles"
              payload: { title_name: "T15", isbn: "1515", exclusivity: "NON_EXCLUSIVE", territory: "WORLD", list_price_cents: 2000 }
              as: Author
              as_user_id: "${au}"
              captures: { ti: $.data.id }
            - call: "POST /production-bookings"
              payload: { title_id: "${ti}", start_date: "2026-04-01", end_date: "2026-04-10" }
              as: Narrator
              as_user_id: "${na}"
          trigger:
            - call: "POST /production-bookings"
              payload: { title_id: "${ti}", start_date: "2026-04-10", end_date: "2026-04-15" }
              as: Narrator
              as_user_id: "${na}"
              captures: { adj: $.data.status }
            - call: "POST /production-bookings"
              payload: { title_id: "${ti}", start_date: "2026-04-09", end_date: "2026-04-12" }
              as: Narrator
              as_user_id: "${na}"
              captures: { err: $.data.error_id }
          assert:
            - "adj == ACTIVE"
            - "err == ERR_BOOKING_OVERLAP"

      - name: listing_closed_interval_buffer_gap
        grounds:
          - validations[priority=11]
          - state_machines.DistributionListing.transitions
          - errors[ERR_LISTING_GAP_CONFLICT]
        distinguishing_aspect: |
          Resource = (Title, channel), closed [effective_from, effective_until] intervals with a mandatory
          DISTRIBUTION_GAP_DAYS=1 buffer: after a listing ending 2026-05-31, a new listing starting 2026-06-01 (only
          1 day later) is rejected with ERR_LISTING_GAP_CONFLICT, while one starting 2026-06-02 is accepted. Distinct
          interval geometry (closed + buffer) from the booking half-open adjacency rule.
        test_recipe:
          setup:
            - "A published title with a channel and one ACTIVE listing [2026-05-01, 2026-05-31]."
          setup_api_calls:
            - call: "POST /authors"
