              as: ProgramAdmin
              captures: { cs_id: $.data.id }
            - call: "POST /api/families"
              payload: { family_name: "Alvarez", primary_contact_name: "Maria Alvarez", home_city: "Riverton", distance_miles: 120, child_patient_name: "Nico Alvarez" }
              as: ProgramAdmin
              captures: { fam_id: $.data.id }
            - call: "POST /api/referrals"
              payload: { family_id: "${fam_id}", hospital_id: "${hosp2_id}", treating_unit: "Clinic", care_type: "OUTPATIENT", acuity_level: "LOW", attending_clinician: "Dr. Rao" }
              as: HospitalReferrer
              as_user_id: "${hosp2_id}"
              captures: { ref_id: $.data.id }
            - call: "POST /api/referrals/${ref_id}/verify"
              payload: { decision: "APPROVE" }
              as: HouseManager
              as_user_id: "hm-1"
          trigger:
            - call: "POST /api/care-spaces/${cs_id}/bookings"
              payload: { family_id: "${fam_id}", start_at: "2026-09-03T14:00:00Z", end_at: "2026-09-03T13:00:00Z", party_size: 3 }
              as: FamilyContact
              as_user_id: "${fam_id}"
              captures: { err: $.data.error_id }
          assert:
            - "the response status is 422 and error_id == ERR_BOOKING_REFERRAL_MISMATCH"
            - "error_id != ERR_INVALID_DATE_RANGE  (referential beats temporal at priorities 7 < 8, even though end_at < start_at also violates temporal rules)"

