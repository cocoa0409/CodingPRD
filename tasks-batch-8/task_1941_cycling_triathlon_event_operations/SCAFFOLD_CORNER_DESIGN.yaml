        test_recipe:
          setup: ["event; athlete created then suspended (no registrations yet, so cascade is a no-op)"]
          setup_api_calls:
            - call: "POST /events"
              payload: { name: "Tri A", start_date: "2026-10-15T08:00:00Z", has_swim: false, water_pool_units: 100 }
              as: RaceDirector
              captures: { ev: $.data.id }
