      - name: reconciled_program_cannot_be_reconciled_or_closed_again
        claim_type: Terminal State Lockdown
        grounds:
          - state_machines.AmnestyProgram.terminal_states
          - validations[priority=12]
          - errors[ERR_PROGRAM_NOT_CLOSED]
        distinguishing_aspect: |
          RECONCILED is the only terminal program state and it is sealed in both
          directions: a second /reconcile and a second /close both fail with the
          state-guard error for the operation they attempted, and final_realization_pct
          keeps the value frozen by the first reconciliation.
        test_recipe:
          setup:
            - "Clock at 2026-09-15T00:00:00Z; OPEN program with one SALES_USE term, revenue_forecast_cents 100000000 and no participants"
            - "The clock is advanced to 2026-12-01T00:00:00Z and the program is closed and reconciled"
