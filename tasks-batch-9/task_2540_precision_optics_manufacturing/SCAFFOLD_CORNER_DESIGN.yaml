          - state_machines.Assembly.initial_state
          - state_machines.DocumentationPackage.initial_state
          - state_machines.ExportClassification.initial_state
        distinguishing_aspect: |
          Eight creates in one database must each land on the declared initial state and on nothing else:
          DRAFT, QUARANTINED, the WorkOrder pair BLANKS_RESERVED/UNCLASSIFIED, SCHEDULED, DRAFT with
          verdict PENDING, KITTED, ASSEMBLING, and — because the design is export-controlled and the
          destination is not licence-exempt — LICENSE_REQUIRED rather than EXEMPT_CLEARED.
        test_recipe:
          setup:
            - "A RELEASED design OD-2540-A (aperture 120.0 mm, RMS 0.0400, tolerance budget 0.0800, transmitted-wavefront budget 0.1050, one 0.0375-wave ACTIVE allocation, tolerance_verdict PASS) and a RELEASED lot GL-2540-1 with total_blank_count 20."
