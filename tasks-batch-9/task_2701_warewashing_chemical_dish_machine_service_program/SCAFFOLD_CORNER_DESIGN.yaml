              payload: { customer_id: "${cust_id}", name: "Harbor Grill Main Line", region_code: "NW", operating_window_start_minute_utc: 600, operating_window_end_minute_utc: 1320, baseline_water_l_per_rack: 1.20, baseline_kwh_per_rack: 0.62, water_cost_cents_per_1000l: 480, energy_cost_cents_per_kwh: 14 }
              as: AccountManager
              captures: { site_1: $.data.id }
            - call: "POST /warewashing/sites"
              payload: { customer_id: "${cust_id}", name: "Harbor Grill Annex", region_code: "NW", operating_window_start_minute_utc: 600, operating_window_end_minute_utc: 1320, baseline_water_l_per_rack: 1.20, baseline_kwh_per_rack: 0.62, water_cost_cents_per_1000l: 480, energy_cost_cents_per_kwh: 14 }
              as: AccountManager
              captures: { site_2: $.data.id }
          trigger:
            - call: "GET /warewashing/sites"
              payload: { customer_id: "${cust_id}", limit: 0 }
              as: AccountManager
              captures: { err_1: $.data.error_id }
            - call: "GET /warewashing/sites"
              payload: { customer_id: "${cust_id}", limit: 101 }
              as: AccountManager
              captures: { err_2: $.data.error_id }
            - call: "GET /warewashing/sites"
              payload: { customer_id: "${cust_id}", offset: -1 }
              as: AccountManager
              captures: { err_3: $.data.error_id }
            - call: "GET /warewashing/sites"
              payload: { customer_id: "${cust_id}", limit: 100 }
              as: AccountManager
              captures: { first_id: "$.data[0].id", total: $.total_count }
          assert:
            - "${err_1} == ${err_2} == ${err_3} == ERR_INVALID_PAGINATION with HTTP 400"
            - "the 100-limit request succeeds with ${total} == 2 and ${first_id} present - 100 is inside the range"
            - "no request clamps: a rejected page returns the error envelope, never a partial list"

      - name: sanitizer_window_fields_are_required_only_for_sanitizer_products
        claim_type: Conditional validation
        grounds:
          - validations.request_shape_valid
          - entities.ChemicalProduct.fields.sanitizer_min_ppm
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: |
          The same two fields are mandatory, forbidden or bounded depending on one sibling field: absent
          on a SANITIZER is ERR_INVALID_REQUEST, present on a DETERGENT is ERR_INVALID_REQUEST, and a
          window that does not straddle concentration_target_ppm (min 250 with target 200) is also
          rejected - while the compliant SANITIZER is created.
