        claim_type: Temporal validation
        grounds:
          - validations[priority=11]
          - errors[ERR_CERT_PERIOD_OVERLAP]
        excluded_because:
          difficulty_instance: resource_temporal_overlap / occupancy_cert_annual_bucket_overlap_rejected
          rationale: "The (loan, certification_year) annual-window overlap rejection is the asserted core of the named §1.8 instance."

      - name: error_coverage_window_halfopen_overlap_rejected
        claim_type: Temporal validation
        grounds:
          - validations[priority=12]
          - errors[ERR_COVERAGE_WINDOW_OVERLAP]
        excluded_because:
          difficulty_instance: resource_temporal_overlap / property_charge_halfopen_window_overlap_rejected_adjacent_allowed
          rationale: "The half-open [start,end) coverage-window overlap (adjacency allowed) is the asserted core of the named §1.8 instance."

      - name: error_borrower_under_age_62_rejected
        claim_type: Violation → Error
        grounds:
          - validations[priority=6]
          - errors[ERR_BORROWER_UNDER_AGE]
        excluded_because:
          difficulty_instance: boundary_precision_check / borrower_age_exactly_62_allowed_61_rejected
          rationale: "The age>=62 regulatory floor (61 rejected, exactly 62 allowed) is the asserted core of the named §1.8 instance."

      - name: error_insufficient_line_over_available_rejected
        claim_type: Aggregate validation
        grounds:
          - validations[priority=15]
          - errors[ERR_INSUFFICIENT_LINE]
        excluded_because:
          difficulty_instance: boundary_precision_check / disbursement_request_equal_to_line_allowed_over_rejected
          rationale: "The requested_amount_cents <= available_line (equal allowed, +1 rejected) boundary is the asserted core of the named §1.8 instance."

  # ===========================================================================
  # Section 5 — Endpoints (CRUD, action endpoints, computed read, side effects)
  # ===========================================================================
  - section: endpoints
    instances:
      - name: reject_disbursement_action_sets_rejected_and_zero_approved
        claim_type: Action endpoint
        grounds:
          - state_machines.Disbursement.transitions.REQUESTED_to_REJECTED
          - endpoints["POST /disbursements/{disbursementId}/reject"]
        distinguishing_aspect: "POST /disbursements/{disbursementId}/reject on a REQUESTED draw triggers REQUESTED->REJECTED with side effect approved_amount_cents=0; response status 200, status REJECTED."
        test_recipe:
          setup:
            - "An originated LOC loan with a REQUESTED LINE_DRAW disbursement."
          setup_api_calls:
            - call: "POST /lenders"
              payload: { name: "Reject Servicer", hud_lending_limit_cents: 80000000 }
              as: ServicerOps
              captures: { lender_id: $.data.id }
            - call: "POST /principal-limit-factors"
              payload: { lender_id: "${lender_id}", age: 75, expected_rate_bps: 500, factor_micros: 523000 }
              as: ServicerOps
            - call: "POST /loans/_clock/set"
              payload: { lender_id: "${lender_id}", to_iso8601: "2024-01-01T00:00:00.000Z" }
              as: ServicerOps
            - call: "POST /borrowers"
              payload: { lender_id: "${lender_id}", full_name: "Moe Borrower", birthdate: "1948-06-01" }
              as: ServicerOps
              captures: { borrower_id: $.data.id }
            - call: "POST /loans"
              payload: { lender_id: "${lender_id}", borrower_id: "${borrower_id}", appraised_value_cents: 30000000, expected_rate_bps: 500, draw_type: "LINE_OF_CREDIT", initial_financed_costs_cents: 1000000 }
              as: ServicerOps
              captures: { loan_id: $.data.id }
            - call: "POST /loans/${loan_id}/originate"
              payload: {}
              as: ServicerOps
            - call: "POST /disbursements"
              payload: { loan_id: "${loan_id}", kind: "LINE_DRAW", requested_amount_cents: 100000 }
              as: ServicerOps
              captures: { disb_id: $.data.id }
          trigger:
            - call: "POST /disbursements/${disb_id}/reject"
              payload: {}
              as: ServicerOps
          assert:
            - "HTTP status == 200"
            - "data.status == 'REJECTED'"
            - "data.approved_amount_cents == 0"

      - name: payoff_quote_computed_read_does_not_mutate_balance
        claim_type: Computed read
        grounds:
          - calculations.balance_accrual.variants.payoff_quote_projection
          - endpoints["GET /loans/{loanId}/payoff-quote"]
          - entities.Loan.fields.principal_balance_cents
        distinguishing_aspect: "GET /loans/{loanId}/payoff-quote returns derived fields {loan_id, projected_balance_cents, lesser_of_payoff_cents, deficiency_cents} and is side-effect-free: a re-read of the loan shows principal_balance_cents unchanged from before the quote."
        test_recipe:
          setup:
            - "An originated LUMP_SUM loan; balance fixed by origination advance, unchanged by the quote."
          setup_api_calls:
            - call: "POST /lenders"
              payload: { name: "Quote Servicer", hud_lending_limit_cents: 80000000 }
              as: ServicerOps
              captures: { lender_id: $.data.id }
            - call: "POST /principal-limit-factors"
              payload: { lender_id: "${lender_id}", age: 75, expected_rate_bps: 500, factor_micros: 523000 }
              as: ServicerOps
            - call: "POST /loans/_clock/set"
              payload: { lender_id: "${lender_id}", to_iso8601: "2024-01-01T00:00:00.000Z" }
              as: ServicerOps
            - call: "POST /borrowers"
              payload: { lender_id: "${lender_id}", full_name: "Nia Borrower", birthdate: "1948-06-01" }
              as: ServicerOps
              captures: { borrower_id: $.data.id }
            - call: "POST /loans"
              payload: { lender_id: "${lender_id}", borrower_id: "${borrower_id}", appraised_value_cents: 30000000, expected_rate_bps: 500, draw_type: "LUMP_SUM", initial_financed_costs_cents: 1000000 }
              as: ServicerOps
              captures: { loan_id: $.data.id }
            - call: "POST /loans/${loan_id}/originate"
              payload: {}
              as: ServicerOps
            - call: "GET /loans/${loan_id}"
              payload: {}
              as: ServicerOps
              captures: { bal_before: $.data.principal_balance_cents }
          trigger:
            - call: "GET /loans/${loan_id}/payoff-quote?number_of_months=12"
              payload: {}
              as: ServicerOps
              captures: { quoted: $.data.projected_balance_cents }
            - call: "GET /loans/${loan_id}"
              payload: {}
              as: ServicerOps
              captures: { bal_after: $.data.principal_balance_cents }
          assert:
            - "payoff-quote => HTTP 200; data.loan_id == ${loan_id}; data.projected_balance_cents and data.deficiency_cents present"
            - "data.projected_balance_cents (${quoted}) >= ${bal_before} (forward projection)"
            - "loan re-read: principal_balance_cents (${bal_after}) == ${bal_before} (no mutation)"

      - name: disburse_approved_draw_debits_line_credits_balance_side_effect
        claim_type: Action endpoint
        grounds:
          - state_machines.Disbursement.transitions.APPROVED_to_DISBURSED
          - endpoints["POST /disbursements/{disbursementId}/disburse"]
          - entities.Loan.fields.principal_balance_cents
          - entities.Loan.fields.available_line_of_credit_cents
        distinguishing_aspect: |
          DISBURSE side effects: principal_balance_cents += approved, available_line_of_credit_cents -= approved (conserved).
          On a freshly originated LOC loan with net_principal_limit 14690000 (gross 15690000 - costs 1000000),
          available_line starts 14690000 and balance 1000000; after approving+disbursing 100000 the loan shows
          balance 1100000 and line 14590000.
        test_recipe:
          setup:
            - "Originated LOC loan: available_line_of_credit_cents 14690000, principal_balance_cents 1000000; one REQUESTED LINE_DRAW of 100000 approved."
          setup_api_calls:
            - call: "POST /lenders"
              payload: { name: "Disburse Servicer", hud_lending_limit_cents: 80000000 }
              as: ServicerOps
              captures: { lender_id: $.data.id }
            - call: "POST /principal-limit-factors"
              payload: { lender_id: "${lender_id}", age: 75, expected_rate_bps: 500, factor_micros: 523000 }
              as: ServicerOps
            - call: "POST /loans/_clock/set"
              payload: { lender_id: "${lender_id}", to_iso8601: "2024-01-01T00:00:00.000Z" }
              as: ServicerOps
            - call: "POST /borrowers"
              payload: { lender_id: "${lender_id}", full_name: "Ole Borrower", birthdate: "1948-06-01" }
              as: ServicerOps
              captures: { borrower_id: $.data.id }
            - call: "POST /loans"
              payload: { lender_id: "${lender_id}", borrower_id: "${borrower_id}", appraised_value_cents: 30000000, expected_rate_bps: 500, draw_type: "LINE_OF_CREDIT", initial_financed_costs_cents: 1000000 }
              as: ServicerOps
              captures: { loan_id: $.data.id }
            - call: "POST /loans/${loan_id}/originate"
              payload: {}
              as: ServicerOps
            - call: "GET /loans/${loan_id}"
              payload: {}
              as: ServicerOps
              captures: { loan_v: $.data.version }
            - call: "POST /disbursements"
              payload: { loan_id: "${loan_id}", kind: "LINE_DRAW", requested_amount_cents: 100000 }
              as: ServicerOps
              captures: { disb_id: $.data.id }
            - call: "POST /disbursements/${disb_id}/approve"
              payload: { expected_loan_version: "${loan_v}" }
              as: ServicerOps
          trigger:
            - call: "POST /disbursements/${disb_id}/disburse"
              payload: {}
              as: ServicerOps
            - call: "GET /loans/${loan_id}"
              payload: {}
              as: ServicerOps
          assert:
            - "disburse => HTTP 200; Disbursement.${disb_id}.status == DISBURSED"
            - "loan re-read: principal_balance_cents == 1100000"
            - "loan re-read: available_line_of_credit_cents == 14590000"

      - name: error_disbursement_void_restores_principal_capacity
        claim_type: Action endpoint
        grounds:
          - state_machines.Disbursement.transitions.DISBURSED_to_VOIDED
          - endpoints["POST /disbursements/{disbursementId}/void"]
        excluded_because:
          difficulty_instance: compensating_invariant / disbursement_void_restores_principal_capacity
          rationale: "The void compensating reversal (balance down, line restored, conserved invariant) is the asserted core of the named §1.8 instance."

      - name: error_property_charge_reverse_restores_lesa_pool
        claim_type: Action endpoint
        grounds:
          - endpoints["POST /property-charge-payments/{paymentId}/reverse"]
        excluded_because:
          difficulty_instance: compensating_invariant / property_charge_reverse_restores_lesa_pool
          rationale: "The property-charge reversal restoring LESA drawn/remaining/status is the asserted core of the named §1.8 instance."

  # ===========================================================================
  # Section 6 — Errors (each catalog code triggerable; codes not pinned above)
  # ===========================================================================
  - section: errors
    instances:
      - name: originate_without_matching_plf_returns_plf_not_found
        claim_type: violation_to_error
        grounds:
          - errors[ERR_PLF_NOT_FOUND]
          - calculations.principal_limit
          - endpoints["POST /loans/{loanId}/originate"]
        distinguishing_aspect: "Origination needs a PrincipalLimitFactor row matching the loan's expected_rate_bps and borrower age; with no PLF row registered for the lender, POST /loans/{loanId}/originate fails 422 ERR_PLF_NOT_FOUND."
        test_recipe:
          setup:
            - "A loan whose borrower is age-eligible (>=62) but the lender has NO PrincipalLimitFactor row at all."
          setup_api_calls:
            - call: "POST /lenders"
              payload: { name: "NoPlf Servicer", hud_lending_limit_cents: 80000000 }
              as: ServicerOps
              captures: { lender_id: $.data.id }
            - call: "POST /loans/_clock/set"
              payload: { lender_id: "${lender_id}", to_iso8601: "2024-01-01T00:00:00.000Z" }
              as: ServicerOps
            - call: "POST /borrowers"
              payload: { lender_id: "${lender_id}", full_name: "Pam Borrower", birthdate: "1948-06-01" }
              as: ServicerOps
              captures: { borrower_id: $.data.id }
            - call: "POST /loans"
              payload: { lender_id: "${lender_id}", borrower_id: "${borrower_id}", appraised_value_cents: 30000000, expected_rate_bps: 500, draw_type: "LUMP_SUM", initial_financed_costs_cents: 1000000 }
              as: ServicerOps
              captures: { loan_id: $.data.id }
          trigger:
            - call: "POST /loans/${loan_id}/originate"
              payload: {}
              as: ServicerOps
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 422"
            - "data.error_id == ERR_PLF_NOT_FOUND"

      - name: recompute_reconciles_balance_to_ledger_no_inconsistency
        claim_type: violation_to_error
        grounds:
          - errors[ERR_LEDGER_INCONSISTENT]
          - endpoints["POST /loans/{loanId}/recompute"]
          - entities.LedgerEntry
        distinguishing_aspect: "ERR_LEDGER_INCONSISTENT fires only when recompute cannot reconcile; on a consistently-serviced loan (advance + accrual posted normally) POST /loans/{loanId}/recompute succeeds 200, re-deriving principal_balance_cents from the ledger stream without raising the error."
        test_recipe:
          setup:
            - "An originated LUMP_SUM loan with one month of accrual posted; ledger stream consistent with derived balance."
          setup_api_calls:
            - call: "POST /lenders"
              payload: { name: "Recompute Servicer", hud_lending_limit_cents: 80000000 }
              as: ServicerOps
              captures: { lender_id: $.data.id }
            - call: "POST /principal-limit-factors"
              payload: { lender_id: "${lender_id}", age: 75, expected_rate_bps: 500, factor_micros: 523000 }
              as: ServicerOps
            - call: "POST /loans/_clock/set"
              payload: { lender_id: "${lender_id}", to_iso8601: "2024-01-01T00:00:00.000Z" }
              as: ServicerOps
            - call: "POST /borrowers"
              payload: { lender_id: "${lender_id}", full_name: "Quin Borrower", birthdate: "1948-06-01" }
              as: ServicerOps
              captures: { borrower_id: $.data.id }
            - call: "POST /loans"
              payload: { lender_id: "${lender_id}", borrower_id: "${borrower_id}", appraised_value_cents: 30000000, expected_rate_bps: 500, draw_type: "LUMP_SUM", initial_financed_costs_cents: 1000000 }
              as: ServicerOps
              captures: { loan_id: $.data.id }
            - call: "POST /loans/${loan_id}/originate"
              payload: {}
              as: ServicerOps
            - call: "POST /loans/${loan_id}/post-accrual"
              payload: { number_of_months: 1 }
              as: ServicerOps
            - call: "GET /loans/${loan_id}"
              payload: {}
              as: ServicerOps
              captures: { bal_before: $.data.principal_balance_cents }
          trigger:
            - call: "POST /loans/${loan_id}/recompute"
              payload: {}
              as: HudAuditor
          assert:
            - "HTTP status == 200"
            - "response_type == object (not error)"
            - "data.error_id is absent"
            - "data.principal_balance_cents == ${bal_before} (reconciled, unchanged)"

  # ===========================================================================
  # Section 7 — RBAC (peer_roles: missing context, forbidden-for-role denials)
  # ===========================================================================
  - section: rbac
    instances:
      - name: missing_user_context_header_returns_400
        claim_type: missing_context
        grounds:
          - validations[priority=1]
          - errors[ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER]
          - endpoints["POST /lenders"]
        distinguishing_aspect: "Priority-1 auth gate: a request with no X-User-ID / X-User-Role context fails 400 ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER before any business logic runs."
        test_recipe:
          setup:
            - "Empty DB; request issued with no user-context role."
          setup_api_calls: []
          trigger:
            - call: "POST /lenders"
              payload: { name: "NoCtx Servicer", hud_lending_limit_cents: 80000000 }
              as: "(none)"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 400"
            - "data.error_id == ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER"

      - name: borrower_cannot_create_lender_returns_forbidden
        claim_type: unauthorized_role
        grounds:
          - roles.Borrower
          - roles.ServicerOps
          - validations[priority=2]
          - errors[ERR_FORBIDDEN_FOR_ROLE]
          - endpoints["POST /lenders"]
        distinguishing_aspect: "POST /lenders is ServicerOps-exclusive; the entity-backed Borrower role calling it is denied 403 ERR_FORBIDDEN_FOR_ROLE (peer_roles: Borrower cannot perform ServicerOps' exclusive op)."
        test_recipe:
          setup:
            - "A lender and a persisted Borrower exist so the Borrower identity is valid."
          setup_api_calls:
            - call: "POST /lenders"
              payload: { name: "RbacBase Servicer", hud_lending_limit_cents: 80000000 }
              as: ServicerOps
              captures: { lender_id: $.data.id }
            - call: "POST /borrowers"
              payload: { lender_id: "${lender_id}", full_name: "Rae Borrower", birthdate: "1948-06-01" }
              as: ServicerOps
              captures: { borrower_id: $.data.id }
          trigger:
            - call: "POST /lenders"
              payload: { name: "Sneaky Servicer", hud_lending_limit_cents: 80000000 }
              as: Borrower
              as_user_id: "${borrower_id}"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 403"
            - "data.error_id == ERR_FORBIDDEN_FOR_ROLE"

      - name: servicerops_cannot_open_resolution_returns_forbidden
        claim_type: unauthorized_role
        grounds:
          - roles.ServicerOps
          - roles.ComplianceOfficer
          - validations[priority=2]
          - errors[ERR_FORBIDDEN_FOR_ROLE]
          - endpoints["POST /resolutions"]
        distinguishing_aspect: "POST /resolutions is ComplianceOfficer-exclusive; ServicerOps (a peer role) calling it is denied 403 ERR_FORBIDDEN_FOR_ROLE — peer roles cannot perform each other's exclusive operations even when the loan is DUE_AND_PAYABLE."
        test_recipe:
          setup:
            - "A LUMP_SUM loan driven to DUE_AND_PAYABLE so the only barrier left is the role gate."
          setup_api_calls:
            - call: "POST /lenders"
              payload: { name: "RbacRes Servicer", hud_lending_limit_cents: 80000000 }
              as: ServicerOps
              captures: { lender_id: $.data.id }
            - call: "POST /principal-limit-factors"
              payload: { lender_id: "${lender_id}", age: 75, expected_rate_bps: 500, factor_micros: 523000 }
              as: ServicerOps
            - call: "POST /loans/_clock/set"
              payload: { lender_id: "${lender_id}", to_iso8601: "2024-01-01T00:00:00.000Z" }
              as: ServicerOps
            - call: "POST /borrowers"
              payload: { lender_id: "${lender_id}", full_name: "Sam Borrower", birthdate: "1948-06-01" }
              as: ServicerOps
              captures: { borrower_id: $.data.id }
            - call: "POST /loans"
              payload: { lender_id: "${lender_id}", borrower_id: "${borrower_id}", appraised_value_cents: 30000000, expected_rate_bps: 500, draw_type: "LUMP_SUM", initial_financed_costs_cents: 1000000 }
              as: ServicerOps
              captures: { loan_id: $.data.id }
            - call: "POST /loans/${loan_id}/originate"
              payload: {}
              as: ServicerOps
            - call: "POST /maturity-events"
              payload: { loan_id: "${loan_id}", event_type: "SALE_OF_PROPERTY", event_date: "2024-06-01" }
              as: ServicerOps
          trigger:
            - call: "POST /resolutions"
              payload: { loan_id: "${loan_id}", path: "PAYOFF" }
              as: ServicerOps
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 403"
            - "data.error_id == ERR_FORBIDDEN_FOR_ROLE"
            - "Loan.${loan_id}.disposition_status == DUE_AND_PAYABLE (unchanged)"

      - name: hudauditor_cannot_post_accrual_returns_forbidden
        claim_type: unauthorized_role
        grounds:
          - roles.HudAuditor
          - roles.ServicerOps
          - validations[priority=2]
          - errors[ERR_FORBIDDEN_FOR_ROLE]
          - endpoints["POST /loans/{loanId}/post-accrual"]
        distinguishing_aspect: "POST /loans/{loanId}/post-accrual is permitted only for ServicerOps/System; the read-only HudAuditor calling it is denied 403 ERR_FORBIDDEN_FOR_ROLE."
        test_recipe:
          setup:
            - "An originated LUMP_SUM loan."
          setup_api_calls:
            - call: "POST /lenders"
              payload: { name: "RbacAcc Servicer", hud_lending_limit_cents: 80000000 }
              as: ServicerOps
              captures: { lender_id: $.data.id }
            - call: "POST /principal-limit-factors"
              payload: { lender_id: "${lender_id}", age: 75, expected_rate_bps: 500, factor_micros: 523000 }
              as: ServicerOps
            - call: "POST /loans/_clock/set"
              payload: { lender_id: "${lender_id}", to_iso8601: "2024-01-01T00:00:00.000Z" }
              as: ServicerOps
            - call: "POST /borrowers"
              payload: { lender_id: "${lender_id}", full_name: "Tia Borrower", birthdate: "1948-06-01" }
              as: ServicerOps
              captures: { borrower_id: $.data.id }
            - call: "POST /loans"
              payload: { lender_id: "${lender_id}", borrower_id: "${borrower_id}", appraised_value_cents: 30000000, expected_rate_bps: 500, draw_type: "LUMP_SUM", initial_financed_costs_cents: 1000000 }
              as: ServicerOps
              captures: { loan_id: $.data.id }
            - call: "POST /loans/${loan_id}/originate"
              payload: {}
              as: ServicerOps
          trigger:
            - call: "POST /loans/${loan_id}/post-accrual"
              payload: { number_of_months: 1 }
              as: HudAuditor
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 403"
            - "data.error_id == ERR_FORBIDDEN_FOR_ROLE"

  # ===========================================================================
  # Section 8 — Cross-Cutting Complexity Layers (OCC, pagination, derived-field
  # reconciliation, cascading side effects)
  # ===========================================================================
  - section: cross_cutting
    instances:
      - name: approve_with_stale_expected_loan_version_returns_412
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules.line-draw-approve-stale-loan
          - entities.Loan.fields.version
          - endpoints["POST /disbursements/{disbursementId}/approve"]
          - errors[ERR_STALE_VERSION]
        distinguishing_aspect: |
          OCC on Loan.version: one approve against the loan legitimately bumps Loan.version (per the
          concurrency rule), so a second approve submitting the pre-bump expected_loan_version is
          stale and rejected 412 ERR_STALE_VERSION. The captured ${loan_v0} is the version BEFORE the
          first approve; the first approve uses it (succeeds + bumps), the second reuses it (now stale).
        test_recipe:
          setup:
            - "Originated LOC loan (line 14690000); two REQUESTED LINE_DRAWs of 100000 each; loan version captured before any approve."
          setup_api_calls:
            - call: "POST /lenders"
              payload: { name: "Occ Servicer", hud_lending_limit_cents: 80000000 }
              as: ServicerOps
              captures: { lender_id: $.data.id }
            - call: "POST /principal-limit-factors"
              payload: { lender_id: "${lender_id}", age: 75, expected_rate_bps: 500, factor_micros: 523000 }
              as: ServicerOps
            - call: "POST /loans/_clock/set"
              payload: { lender_id: "${lender_id}", to_iso8601: "2024-01-01T00:00:00.000Z" }
              as: ServicerOps
            - call: "POST /borrowers"
              payload: { lender_id: "${lender_id}", full_name: "Uma Borrower", birthdate: "1948-06-01" }
              as: ServicerOps
              captures: { borrower_id: $.data.id }
            - call: "POST /loans"
              payload: { lender_id: "${lender_id}", borrower_id: "${borrower_id}", appraised_value_cents: 30000000, expected_rate_bps: 500, draw_type: "LINE_OF_CREDIT", initial_financed_costs_cents: 1000000 }
              as: ServicerOps
              captures: { loan_id: $.data.id }
            - call: "POST /loans/${loan_id}/originate"
              payload: {}
              as: ServicerOps
            - call: "GET /loans/${loan_id}"
              payload: {}
              as: ServicerOps
              captures: { loan_v0: $.data.version }
            - call: "POST /disbursements"
              payload: { loan_id: "${loan_id}", kind: "LINE_DRAW", requested_amount_cents: 100000 }
              as: ServicerOps
              captures: { disb1: $.data.id }
            - call: "POST /disbursements"
              payload: { loan_id: "${loan_id}", kind: "LINE_DRAW", requested_amount_cents: 100000 }
              as: ServicerOps
              captures: { disb2: $.data.id }
            - call: "POST /disbursements/${disb1}/approve"
              payload: { expected_loan_version: "${loan_v0}" }
              as: ServicerOps
          trigger:
            - call: "POST /disbursements/${disb2}/approve"
              payload: { expected_loan_version: "${loan_v0}" }
              as: ServicerOps
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 412"
            - "data.error_id == ERR_STALE_VERSION"
            - "Disbursement.${disb2}.status == REQUESTED (unchanged)"

      - name: approve_with_current_version_succeeds_and_bumps_loan_version
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules.line-draw-approve-stale-loan
          - entities.Loan.fields.version
          - endpoints["POST /disbursements/{disbursementId}/approve"]
        distinguishing_aspect: "OCC positive path: approving with the current expected_loan_version succeeds (200), the disbursement goes APPROVED, and Loan.version increments by exactly 1 vs the pre-approve value."
        test_recipe:
          setup:
            - "Originated LOC loan; one REQUESTED LINE_DRAW of 100000; loan version captured immediately before approve."
          setup_api_calls:
            - call: "POST /lenders"
              payload: { name: "OccPos Servicer", hud_lending_limit_cents: 80000000 }
              as: ServicerOps
              captures: { lender_id: $.data.id }
            - call: "POST /principal-limit-factors"
              payload: { lender_id: "${lender_id}", age: 75, expected_rate_bps: 500, factor_micros: 523000 }
              as: ServicerOps
            - call: "POST /loans/_clock/set"
              payload: { lender_id: "${lender_id}", to_iso8601: "2024-01-01T00:00:00.000Z" }
              as: ServicerOps
            - call: "POST /borrowers"
              payload: { lender_id: "${lender_id}", full_name: "Vic Borrower", birthdate: "1948-06-01" }
              as: ServicerOps
              captures: { borrower_id: $.data.id }
            - call: "POST /loans"
              payload: { lender_id: "${lender_id}", borrower_id: "${borrower_id}", appraised_value_cents: 30000000, expected_rate_bps: 500, draw_type: "LINE_OF_CREDIT", initial_financed_costs_cents: 1000000 }
              as: ServicerOps
              captures: { loan_id: $.data.id }
            - call: "POST /loans/${loan_id}/originate"
              payload: {}
              as: ServicerOps
            - call: "GET /loans/${loan_id}"
              payload: {}
              as: ServicerOps
              captures: { loan_v: $.data.version }
            - call: "POST /disbursements"
              payload: { loan_id: "${loan_id}", kind: "LINE_DRAW", requested_amount_cents: 100000 }
              as: ServicerOps
              captures: { disb_id: $.data.id }
          trigger:
            - call: "POST /disbursements/${disb_id}/approve"
              payload: { expected_loan_version: "${loan_v}" }
              as: ServicerOps
            - call: "GET /loans/${loan_id}"
              payload: {}
              as: ServicerOps
              captures: { loan_v_after: $.data.version }
          assert:
            - "approve => HTTP 200; Disbursement.${disb_id}.status == APPROVED, approved_amount_cents == 100000"
            - "loan re-read: version (${loan_v_after}) == ${loan_v} + 1"

      - name: list_loans_invalid_pagination_limit_returns_400
        claim_type: pagination_with_filtering
        grounds:
          - endpoints["GET /loans"]
          - errors[ERR_INVALID_PAGINATION]
          - response_envelope.pagination_defaults
        distinguishing_aspect: "Pagination bounds are limit 1..100, offset >= 0; GET /loans?limit=0 violates the lower bound and returns 400 ERR_INVALID_PAGINATION (limit=100 would be allowed)."
        test_recipe:
          setup:
            - "A lender exists so the listing is well-formed apart from pagination."
          setup_api_calls:
            - call: "POST /lenders"
              payload: { name: "Page Servicer", hud_lending_limit_cents: 80000000 }
              as: ServicerOps
              captures: { lender_id: $.data.id }
          trigger:
            - call: "GET /loans?lender_id=${lender_id}&limit=0"
              payload: {}
              as: ServicerOps
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 400"
            - "data.error_id == ERR_INVALID_PAGINATION"

      - name: list_disbursements_filter_by_status_returns_only_matching
        claim_type: pagination_with_filtering
        grounds:
          - endpoints["GET /disbursements"]
          - entities.Disbursement.fields.status
        distinguishing_aspect: "GET /disbursements?loan_id=...&status=REJECTED returns only the REJECTED draw and excludes the still-REQUESTED one; filter + array envelope interact correctly."
        test_recipe:
          setup:
            - "Originated LOC loan with two LINE_DRAWs: one REJECTED, one left REQUESTED."
          setup_api_calls:
            - call: "POST /lenders"
              payload: { name: "Filter Servicer", hud_lending_limit_cents: 80000000 }
              as: ServicerOps
              captures: { lender_id: $.data.id }
            - call: "POST /principal-limit-factors"
              payload: { lender_id: "${lender_id}", age: 75, expected_rate_bps: 500, factor_micros: 523000 }
              as: ServicerOps
            - call: "POST /loans/_clock/set"
              payload: { lender_id: "${lender_id}", to_iso8601: "2024-01-01T00:00:00.000Z" }
              as: ServicerOps
            - call: "POST /borrowers"
              payload: { lender_id: "${lender_id}", full_name: "Wyn Borrower", birthdate: "1948-06-01" }
              as: ServicerOps
              captures: { borrower_id: $.data.id }
            - call: "POST /loans"
              payload: { lender_id: "${lender_id}", borrower_id: "${borrower_id}", appraised_value_cents: 30000000, expected_rate_bps: 500, draw_type: "LINE_OF_CREDIT", initial_financed_costs_cents: 1000000 }
              as: ServicerOps
              captures: { loan_id: $.data.id }
            - call: "POST /loans/${loan_id}/originate"
              payload: {}
              as: ServicerOps
            - call: "POST /disbursements"
              payload: { loan_id: "${loan_id}", kind: "LINE_DRAW", requested_amount_cents: 100000 }
              as: ServicerOps
              captures: { rej_id: $.data.id }
            - call: "POST /disbursements"
              payload: { loan_id: "${loan_id}", kind: "LINE_DRAW", requested_amount_cents: 200000 }
              as: ServicerOps
              captures: { req_id: $.data.id }
            - call: "POST /disbursements/${rej_id}/reject"
              payload: {}
              as: ServicerOps
          trigger:
            - call: "GET /disbursements?loan_id=${loan_id}&status=REJECTED"
              payload: {}
              as: ServicerOps
          assert:
            - "HTTP status == 200"
            - "response_type == array"
            - "data is an array of length 1"
            - "data[0].id == ${rej_id}"
            - "data[0].status == 'REJECTED'"

      - name: maturity_event_cascades_due_and_payable_voids_pending_draw_freezes_line
        claim_type: cascading_side_effects
        grounds:
          - state_machines.Loan.transitions.ACTIVE_to_DUE_AND_PAYABLE
          - state_machines.Disbursement.transitions.REQUESTED_to_VOIDED
          - entities.Loan.fields.available_line_of_credit_cents
          - endpoints["POST /maturity-events"]
        distinguishing_aspect: |
          One maturity event drives a multi-entity cascade: Loan.disposition_status ACTIVE->DUE_AND_PAYABLE,
          any non-DISBURSED Disbursement (REQUESTED) -> VOIDED, and available_line_of_credit_cents frozen to 0.
          Verified end-to-end after a single POST /maturity-events.
        test_recipe:
          setup:
            - "Originated LOC loan (line 14690000) with one REQUESTED LINE_DRAW outstanding."
          setup_api_calls:
            - call: "POST /lenders"
              payload: { name: "Cascade Servicer", hud_lending_limit_cents: 80000000 }
              as: ServicerOps
              captures: { lender_id: $.data.id }
            - call: "POST /principal-limit-factors"
              payload: { lender_id: "${lender_id}", age: 75, expected_rate_bps: 500, factor_micros: 523000 }
              as: ServicerOps
            - call: "POST /loans/_clock/set"
              payload: { lender_id: "${lender_id}", to_iso8601: "2024-01-01T00:00:00.000Z" }
              as: ServicerOps
            - call: "POST /borrowers"
              payload: { lender_id: "${lender_id}", full_name: "Xia Borrower", birthdate: "1948-06-01" }
              as: ServicerOps
              captures: { borrower_id: $.data.id }
            - call: "POST /loans"
              payload: { lender_id: "${lender_id}", borrower_id: "${borrower_id}", appraised_value_cents: 30000000, expected_rate_bps: 500, draw_type: "LINE_OF_CREDIT", initial_financed_costs_cents: 1000000 }
              as: ServicerOps
              captures: { loan_id: $.data.id }
            - call: "POST /loans/${loan_id}/originate"
              payload: {}
              as: ServicerOps
            - call: "POST /disbursements"
              payload: { loan_id: "${loan_id}", kind: "LINE_DRAW", requested_amount_cents: 100000 }
              as: ServicerOps
              captures: { disb_id: $.data.id }
          trigger:
            - call: "POST /maturity-events"
              payload: { loan_id: "${loan_id}", event_type: "SALE_OF_PROPERTY", event_date: "2024-06-01" }
              as: ComplianceOfficer
            - call: "GET /loans/${loan_id}"
              payload: {}
              as: ServicerOps
            - call: "GET /disbursements/${disb_id}"
              payload: {}
              as: ServicerOps
          assert:
            - "maturity-event => HTTP 201"
            - "loan re-read: disposition_status == DUE_AND_PAYABLE"
            - "loan re-read: available_line_of_credit_cents == 0 (frozen)"
            - "disbursement re-read: Disbursement.${disb_id}.status == VOIDED"

      - name: error_derived_field_reconciliation_balance_and_line
        claim_type: derived_field_reconciliation
        grounds:
          - entities.Loan.fields.principal_balance_cents
          - entities.Loan.fields.available_line_of_credit_cents
        excluded_because:
          difficulty_instance: compensating_invariant / disbursement_void_restores_principal_capacity
          rationale: "Derived balance/line reconciliation after a draw and its compensating void is the asserted core of the named §1.8 instance."

  # ===========================================================================
  # Section 9 — Consistency Model (immediate)
  # ===========================================================================
  - section: consistency_model
    instances:
      - name: disbursement_balance_change_visible_in_same_request_response
        claim_type: immediate
        grounds:
          - complexity_profile.consistency_model
          - state_machines.Disbursement.transitions.APPROVED_to_DISBURSED
          - entities.Loan.fields.principal_balance_cents
        distinguishing_aspect: "Consistency model is immediate: a follow-up GET /loans/{loanId} issued right after disburse already reflects the +100000 balance change; no lag, no eventual reconciliation needed. Net principal limit 14690000 (gross 15690000 - costs 1000000); balance starts 1000000, becomes 1100000."
        test_recipe:
          setup:
            - "Originated LOC loan; one LINE_DRAW of 100000 approved (not yet disbursed)."
          setup_api_calls:
            - call: "POST /lenders"
              payload: { name: "Immed Servicer", hud_lending_limit_cents: 80000000 }
              as: ServicerOps
              captures: { lender_id: $.data.id }
            - call: "POST /principal-limit-factors"
              payload: { lender_id: "${lender_id}", age: 75, expected_rate_bps: 500, factor_micros: 523000 }
              as: ServicerOps
            - call: "POST /loans/_clock/set"
              payload: { lender_id: "${lender_id}", to_iso8601: "2024-01-01T00:00:00.000Z" }
              as: ServicerOps
            - call: "POST /borrowers"
              payload: { lender_id: "${lender_id}", full_name: "Yas Borrower", birthdate: "1948-06-01" }
              as: ServicerOps
              captures: { borrower_id: $.data.id }
            - call: "POST /loans"
              payload: { lender_id: "${lender_id}", borrower_id: "${borrower_id}", appraised_value_cents: 30000000, expected_rate_bps: 500, draw_type: "LINE_OF_CREDIT", initial_financed_costs_cents: 1000000 }
              as: ServicerOps
              captures: { loan_id: $.data.id }
            - call: "POST /loans/${loan_id}/originate"
              payload: {}
              as: ServicerOps
            - call: "GET /loans/${loan_id}"
              payload: {}
              as: ServicerOps
              captures: { loan_v: $.data.version }
            - call: "POST /disbursements"
              payload: { loan_id: "${loan_id}", kind: "LINE_DRAW", requested_amount_cents: 100000 }
              as: ServicerOps
              captures: { disb_id: $.data.id }
            - call: "POST /disbursements/${disb_id}/approve"
              payload: { expected_loan_version: "${loan_v}" }
              as: ServicerOps
          trigger:
            - call: "POST /disbursements/${disb_id}/disburse"
              payload: {}
              as: ServicerOps
            - call: "GET /loans/${loan_id}"
              payload: {}
              as: ServicerOps
          assert:
            - "disburse => HTTP 200"
            - "immediate same-flow GET /loans/${loan_id}: principal_balance_cents == 1100000"
            - "immediate same-flow GET /loans/${loan_id}: available_line_of_credit_cents == 14590000"
