              payload: { product_specification_id: "${ps_id}", lot_code: "CA-LOT-20Q", planned_units: 100 }
              as: ProductionOperator
              captures: { rlq_id: $.data.id, rlq_dist: $.data.distribution_status }
          trigger:
            - call: "POST /bridging-studies"
              payload: { predicate_lot_id: "${rlp_id}", candidate_lot_id: "${rlq_id}", changed_material_lot_id: "${ml_id}", paired_test_codes: ["ACTIVITY"] }
              as: RegulatoryAffairs
              as_user_id: "ra-01"
              captures: { bs1_id: $.data.id, bs1_verdict: $.data.equivalence_verdict, bs1_mean: $.data.mean_bias_pct, bs1_max: $.data.max_bias_pct, bs1_status: $.data.status }
            - call: "POST /bridging-studies/${bs1_id}/decision"
              payload: { decision: "APPROVE", rationale: "Assuming equivalence." }
              as: QAReleaser
              as_user_id: "qa-01"
              captures: { err_paired: $.data.error_id }
            - call: "GET /bridging-studies/${bs1_id}"
              payload: {}
              as: RegulatoryAffairs
              captures: { bs1_status_after: $.data.status }
            - call: "POST /bridging-studies"
              payload: { predicate_lot_id: "${rlp_id}", candidate_lot_id: "${rlq_id}", changed_material_lot_id: "${ml_id}", paired_test_codes: ["ACTIVITY"] }
              as: RegulatoryAffairs
              as_user_id: "ra-01"
              captures: { bs2_id: $.data.id }
            - call: "POST /bridging-studies/${bs2_id}/decision"
              payload: { decision: "REJECT", rationale: "Bridge abandoned; candidate lot will be scrapped." }
              as: QAReleaser
              as_user_id: "qa-01"
              captures: { bs2_status: $.data.status, bs2_decided_by: $.data.decided_by_user_id }
            - call: "GET /material-lots/${ml_id}"
              payload: {}
              as: QAReleaser
              captures: { ml_status_after: $.data.qualification_status, ml_available_after: $.data.available_quantity_units }
          assert:
            - "the study is created with equivalence_verdict PENDING, mean_bias_pct null and max_bias_pct null, because neither lot has an ACTIVITY result to pair"
            - "APPROVE returns HTTP 422 ERR_PAIRED_DATA_MISSING — a 422 for missing data, not the 409 ERR_NOT_EQUIVALENT of a computed failure — and the study stays in DRAFT"
            - "REJECT on the sibling study is ACCEPTED with status FAILED and decided_by_user_id qa-01, because the paired-data gate applies to APPROVE only"
            - "the changed MaterialLot is still RECEIVED with its quantities untouched: the DRAFT to FAILED quarantine side effect only fires for a QUALIFIED material lot"

      - name: state_precondition_ahead_of_environmental_nonconformance
        claim_type: Priority Ordering
        grounds:
          - validations.priority_60
          - validations.priority_80_ERR_ENVIRONMENTAL_NONCONFORMANCE
        excluded_because:
          difficulty_instance: state_precondition_priority_60_beats_environmental_nonconformance_priority_80
          rationale: "That §1.8 instance already builds a lot that is both in the wrong disposition state and carrying a DISQUALIFIED fill run, and asserts the priority 60 state error is returned rather than ERR_ENVIRONMENTAL_NONCONFORMANCE; it also drives the environmental error on its own once the state is fixed."

      - name: product_clearance_gate_ahead_of_the_allocation_shortfall_gate
        claim_type: Priority Ordering
        grounds:
          - validations.priority_130_ERR_PRODUCT_NOT_CLEARED
          - validations.priority_140_ERR_ALLOCATION_SHORTFALL
        excluded_because:
          difficulty_instance: product_not_cleared_priority_130_beats_allocation_shortfall_priority_140
          rationale: "The §1.8 instance already allocates against an uncleared product with insufficient available units under FEFO_STRICT and asserts ERR_PRODUCT_NOT_CLEARED, then clears the product and re-runs the same call to surface ERR_ALLOCATION_SHORTFALL."

      - name: fill_line_changeover_conflict_detection
        claim_type: Violation → Error
        grounds:
          - validations.priority_100_ERR_FILL_LINE_CONFLICT
        excluded_because:
          difficulty_instance: fill_line_changeover_buffer_closed_interval_symmetric_boundaries
          rationale: "That §1.8 resource_temporal_overlap instance already probes the 120-minute changeover buffer on both sides of an existing 06:00-10:00 run, including the two touching boundary instants that must be rejected and the first legal start after the buffer."

      - name: stability_chamber_capacity_enforcement
        claim_type: Violation → Error
        grounds:
          - validations.priority_102_ERR_CHAMBER_CAPACITY_EXCEEDED
        excluded_because:
          difficulty_instance: stability_chamber_half_open_interval_with_aggregate_capacity_two
          rationale: "The §1.8 instance already fills a chamber to its aggregate capacity of two, shows a third overlapping protocol rejected, and shows a protocol starting exactly when another ends accepted because the occupancy interval is half-open."

      - name: material_acceptance_criteria_gate_on_qualify
        claim_type: Violation → Error
        grounds:
          - validations.priority_92_ERR_ACCEPTANCE_CRITERIA_NOT_MET
        excluded_because:
          difficulty_instance: acceptance_score_inclusive_at_exactly_85_00_and_unrounded_subscores_at_84_88
          rationale: "That §1.8 boundary instance already drives ERR_ACCEPTANCE_CRITERIA_NOT_MET from a WEIGHTED_SCORE lot at 84.88 and shows the QUALIFY that succeeds at exactly 85.00, covering both directions of the gate."

      - name: priority_110_ship_enforces_the_product_shelf_life_floor_inclusively_at_the_boundary_day
        claim_type: Violation → Error
        grounds:
          - validations.priority_110_ERR_SHELF_LIFE_TOO_SHORT
          - errors.ERR_SHELF_LIFE_TOO_SHORT
          - state_machines.Allocation.RESERVED_to_SHIPPED
        distinguishing_aspect: "Two different shelf-life floors act on the same shipment: the ORDER's required_min_shelf_life_days filters candidate lots at allocation time, while the PRODUCT's min_shelf_life_days_at_ship is re-checked at the moment of shipping. A lot can therefore be legally allocated and then become unshippable purely by the clock advancing one day — and the remaining life is counted in WHOLE days, so 87 days plus 10 hours satisfies a floor of 87."
        test_recipe:
          setup:
            - "CLEARED ProductSpecification IVD-CA-18 with shelf_life_months_claim 3 and min_shelf_life_days_at_ship 87, deliberately stricter than the orders' own floor of 30 days."
