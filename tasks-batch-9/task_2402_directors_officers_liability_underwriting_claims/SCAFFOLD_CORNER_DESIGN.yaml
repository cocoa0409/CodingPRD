  - section: errors
    instances:
      - name: unknown_path_ids_answer_with_their_own_not_found_code
        claim_type: error_triggerable
        grounds:
          - validations[priority=3]
          - errors[ERR_SUBMISSION_NOT_FOUND]
          - errors[ERR_QUOTE_NOT_FOUND]
          - errors[ERR_EXCLUSION_TERM_NOT_FOUND]
          - errors[ERR_CIRCUMSTANCE_REPORT_NOT_FOUND]
        distinguishing_aspect: |
          Six entity families share the same {id} shape, and each one has its OWN 404 code; a
          handler that answers a generic ERR_NOT_FOUND, or that lets the body-validation rule at
          priority 15 fire first on a deliberately thin body, fails. The path resource is resolved
          at priority 3 — after authentication and the role check but before every state, OCC and
          business guard — so these calls answer 404 even though nothing else about them is valid.
        test_recipe:
          setup:
            - "One insured exists so the entity-backed RiskManager identity resolves; nothing else. The unknown id 00000000-0000-4000-8000-0000000000ff matches no record of any type."
          setup_api_calls:
            - call: "POST /dno/insureds"
              payload: { legal_name: "Vantiq Bio Inc", sector_code: "BIOTECH", exchange_listing: "LISTED", market_cap_usd: 1800000000, fiscal_year_end: "12-31", entity_capacity_cap_usd: 25000000 }
              as: Underwriter
              captures: { insured_id: "$.data.id" }
          trigger:
            - call: "GET /dno/submissions/00000000-0000-4000-8000-0000000000ff"
              payload: {}
              as: Underwriter
            - call: "POST /dno/quotes/00000000-0000-4000-8000-0000000000ff/accept"
              payload: {}
              as: RiskManager
              as_user_id: "${insured_id}"
            - call: "POST /dno/exclusion-terms/00000000-0000-4000-8000-0000000000ff/resolve"
              payload: { resolution: "AGREE" }
              as: Underwriter
            - call: "POST /dno/circumstance-reports/00000000-0000-4000-8000-0000000000ff/mature"
              payload: { claim_type: "SECURITIES_CLASS_ACTION", claimant_name: "Ridgeline Pension Trust", claimant_capacity: "THIRD_PARTY", wrongful_act_date: "2026-05-01T00:00:00Z", alleged_damages_usd: 900000 }
