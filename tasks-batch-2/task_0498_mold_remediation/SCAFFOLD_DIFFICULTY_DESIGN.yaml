              captures: { aid: $.data.id }
          trigger:
            - call: "POST /api/abatement-orders/${aid}/start"
              payload: {}
              as: AbatementSupervisor
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 422"
            - "AbatementOrder.${aid}.data.error_id == ERR_NO_CERTIFIED_CREW"

  # ===========================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      # ---- Instance 1: AbatementOrder.start depends on ContainmentZone.status == ACTIVE
      - name: abatement_start_requires_zone_active
        grounds:
          - state_machines.AbatementOrder.PLANNED_to_IN_PROGRESS
          - state_machines.ContainmentZone.SETUP_to_ACTIVE
          - validations[priority=13]
        distinguishing_aspect: |
          AbatementOrder PLANNED->IN_PROGRESS is gated by the sibling ContainmentZone being
          ACTIVE: starting an order in a SETUP zone fails with ERR_ZONE_NOT_ACTIVE. Entity
          pair AbatementOrder->ContainmentZone, different from instance 2's pair.
        test_recipe:
          setup:
            - "Clock 2026-01-15T00:00:00Z; MOLD project; zone left in SETUP (never activated); PLANNED order with certified lead + assigned certified crew."
          setup_api_calls:
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-15T00:00:00Z" }
              as: ComplianceOfficer
            - call: "POST /api/workers"
              payload: { full_name: "Lead Mold", cert_type: "MOLD", cert_expires_at: "2027-01-01T00:00:00Z", ppe_fit_test_at: "2025-12-15T00:00:00Z" }
              as: ProjectManager
              captures: { lead_id: $.data.id }
            - call: "POST /api/projects"
              payload: { site_name: "Zone Site", hazard_class: "MOLD", structure_sqft: 80, jurisdiction_code: "US-EPA" }
              as: ProjectManager
              captures: { pid: $.data.id }
            - call: "POST /api/containment-zones"
              payload: { project_id: "${pid}", zone_label: "Z1", required_pressure_pa: 10 }
              as: ProjectManager
              captures: { zid: $.data.id }
            - call: "POST /api/abatement-orders"
              payload: { project_id: "${pid}", zone_id: "${zid}", lead_worker_id: "${lead_id}", abatement_type: "MOLD", planned_weight_kg: 50 }
              as: AbatementSupervisor
              captures: { aid: $.data.id }
            - call: "POST /api/assignments"
              payload: { abatement_order_id: "${aid}", worker_id: "${lead_id}", shift_start_at: "2026-01-15T08:00:00Z", shift_end_at: "2026-01-15T16:00:00Z" }
              as: AbatementSupervisor
          trigger:
            - call: "POST /api/abatement-orders/${aid}/start"
              payload: {}
              as: AbatementSupervisor
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "AbatementOrder.${aid}.data.error_id == ERR_ZONE_NOT_ACTIVE"

      # ---- Instance 2: InsuranceClaim.submit depends on Project.posture
      - name: insurance_submit_requires_project_posture_ready
        grounds:
          - state_machines.InsuranceClaim.OPEN_to_SUBMITTED
          - calculations.project_posture
          - validations[priority=23]
        distinguishing_aspect: |
          InsuranceClaim OPEN->SUBMITTED is gated by Project.posture in {CLEARANCE_PENDING,
          VERIFIED}: submitting while posture is still ASSESSMENT fails with
          ERR_PROJECT_NOT_READY_FOR_BILLING. Entity pair InsuranceClaim->Project, different
          from instance 1's AbatementOrder->ContainmentZone pair.
        test_recipe:
          setup:
            - "Clock 2026-01-15T00:00:00Z; fresh MOLD project (posture ASSESSMENT, no zones/orders); an OPEN InsuranceClaim."
          setup_api_calls:
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-15T00:00:00Z" }
              as: ComplianceOfficer
            - call: "POST /api/projects"
              payload: { site_name: "Bill Site", hazard_class: "MOLD", structure_sqft: 80, jurisdiction_code: "US-EPA" }
              as: ProjectManager
              captures: { pid: $.data.id }
            - call: "POST /api/insurance-claims"
              payload: { project_id: "${pid}", policy_number: "POL-9", deductible_cents: 0, coverage_limit_cents: 100000 }
              as: ProjectManager
              captures: { clid: $.data.id }
          trigger:
            - call: "POST /api/insurance-claims/${clid}/submit"
              payload: {}
              as: ProjectManager
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "InsuranceClaim.${clid}.data.error_id == ERR_PROJECT_NOT_READY_FOR_BILLING"

  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      # ---- Instance 1: NESHAP notice lead-time window on Permit (postmark..work_start inclusive day count)
      - name: neshap_notice_lead_window_too_short_blocks_submit
        grounds:
          - calculations.notice_lead_days
          - state_machines.Permit.DRAFT_to_SUBMITTED
          - validations[priority=16]
        distinguishing_aspect: |
          Permit submit enforces a notice WINDOW: notice_days = floor((work_start - postmark)/day)
          must be >= NESHAP_NOTICE_DAYS (10). A NESHAP permit with a 7-day window is rejected.
          Interval semantics = a lead-time duration window measured in floored whole days on the
          Permit resource — different interval arithmetic and resource from instance 2's
          point-in-time pressure-reading comparison.
        test_recipe:
          setup:
            - "Clock 2026-01-15T00:00:00Z; ASBESTOS project; a DRAFT NESHAP_NOTIFICATION permit postmarked 2026-01-01 with work_start 2026-01-08 -> notice_days 7 (< 10)."
          setup_api_calls:
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-15T00:00:00Z" }
              as: ComplianceOfficer
            - call: "POST /api/projects"
              payload: { site_name: "Permit Site", hazard_class: "ASBESTOS", structure_sqft: 80, jurisdiction_code: "US-EPA" }
              as: ProjectManager
              captures: { pid: $.data.id }
            - call: "POST /api/permits"
              payload: { project_id: "${pid}", permit_type: "NESHAP_NOTIFICATION", postmarked_at: "2026-01-01T00:00:00Z", work_start_at: "2026-01-08T00:00:00Z" }
              as: ComplianceOfficer
              captures: { pmid: $.data.id, nd: $.data.notice_days }
          trigger:
            - call: "POST /api/permits/${pmid}/submit"
              payload: {}
              as: ComplianceOfficer
              captures: { err: $.data.error_id }
          assert:
            - "Permit.${pmid}.notice_days == 7"
            - "response.status == 422"
            - "Permit.${pmid}.data.error_id == ERR_NESHAP_NOTICE_NOT_MET"

      # ---- Instance 2: latest pressure reading by reading_at supersedes prior; below-required breaches zone
      - name: latest_pressure_reading_below_required_breaches_active_zone
        grounds:
          - calculations.containment_compliance
          - state_machines.ContainmentZone.ACTIVE_to_BREACHED
          - entities.ContainmentZone.fields.latest_pressure_pa
        distinguishing_aspect: |
          containment_compliance selects the reading with the GREATEST reading_at (tie-break
          greatest created_at) as the live pressure; a later low reading supersedes an earlier
          compliant one and breaches the ACTIVE zone. Interval semantics = latest-by-timestamp
          point selection (not a duration window) on the ContainmentZone resource — different
          arithmetic and resource from instance 1's day-count lead window.
        test_recipe:
          setup:
            - "Clock 2026-01-15T00:00:00Z; MOLD project; zone required_pressure_pa=10; first reading 12 @ 2026-01-14T08:00:00Z makes it compliant; activate; a later reading 4 @ 2026-01-14T10:00:00Z drops below required."
          setup_api_calls:
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-15T00:00:00Z" }
              as: ComplianceOfficer
            - call: "POST /api/projects"
              payload: { site_name: "Pressure Site", hazard_class: "MOLD", structure_sqft: 80, jurisdiction_code: "US-EPA" }
              as: ProjectManager
              captures: { pid: $.data.id }
            - call: "POST /api/containment-zones"
              payload: { project_id: "${pid}", zone_label: "Z1", required_pressure_pa: 10 }
              as: ProjectManager
              captures: { zid: $.data.id }
            - call: "POST /api/containment-zones/${zid}/pressure-logs"
              payload: { zone_id: "${zid}", reading_pa: 12, reading_at: "2026-01-14T08:00:00Z" }
              as: AbatementSupervisor
            - call: "POST /api/containment-zones/${zid}/activate"
              payload: {}
              as: ProjectManager
          trigger:
            - call: "POST /api/containment-zones/${zid}/pressure-logs"
              payload: { zone_id: "${zid}", reading_pa: 4, reading_at: "2026-01-14T10:00:00Z" }
              as: AbatementSupervisor
          assert:
            - "ContainmentZone.${zid}.latest_pressure_pa == 4"
            - "ContainmentZone.${zid}.is_compliant == false"
            - "ContainmentZone.${zid}.status == BREACHED"
            - "Project.${pid}.posture == FROZEN"

  # ===========================================================================
  - rule_id: compensating_invariant
    instances:
      # ---- Instance 1: claim settlement conserved — fail-reopen-recomplete restores settled_amount_cents
      - name: settlement_conserved_across_fail_recomplete_cycle
        grounds:
          - calculations.claim_settlement
          - state_machines.ClearanceTest.ANALYZED_to_FAILED
          - state_machines.AbatementOrder.COMPLETED_to_REOPENED
          - state_machines.DisposalManifest.ACCEPTED_to_VOIDED
        distinguishing_aspect: |
          Conserved quantity = settled_amount_cents (billing dollars). After a clearance FAIL
          drives it to 0 (order reopened, manifest voided), re-completing the order with a fresh
          ACCEPTED manifest of the same weight restores settled_amount_cents to its pre-fail
          value. Invariant pinned: settled == sum(round_half_up(removed*1500)) + sum(ACCEPTED
          fees) - deductible. Different conserved quantity (money) from instance 2 (finding count).
        test_recipe:
          setup:
            - "Clock 2026-01-15T00:00:00Z; MOLD project; ACTIVE zone; order COMPLETED removed=50 with ACCEPTED 50 kg manifest (fee 4000); claim deductible 0; settled == 50*1500 + 4000 = 79000."
            - "A FAILED clearance reopens the order and voids the manifest (settled -> 0)."
          setup_api_calls:
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-15T00:00:00Z" }
              as: ComplianceOfficer
            - call: "POST /api/workers"
              payload: { full_name: "Lead Mold", cert_type: "MOLD", cert_expires_at: "2027-01-01T00:00:00Z", ppe_fit_test_at: "2025-12-15T00:00:00Z" }
              as: ProjectManager
              captures: { lead_id: $.data.id }
            - call: "POST /api/workers"
              payload: { full_name: "Sampler", cert_type: "MOLD", cert_expires_at: "2027-01-01T00:00:00Z", ppe_fit_test_at: "2025-12-15T00:00:00Z" }
              as: ProjectManager
              captures: { sampler_id: $.data.id }
            - call: "POST /api/projects"
              payload: { site_name: "Conserve Site", hazard_class: "MOLD", structure_sqft: 80, jurisdiction_code: "US-EPA" }
              as: ProjectManager
              captures: { pid: $.data.id }
            - call: "POST /api/containment-zones"
              payload: { project_id: "${pid}", zone_label: "Z1", required_pressure_pa: 10 }
              as: ProjectManager
              captures: { zid: $.data.id }
            - call: "POST /api/containment-zones/${zid}/pressure-logs"
              payload: { zone_id: "${zid}", reading_pa: 12, reading_at: "2026-01-14T00:00:00Z" }
              as: AbatementSupervisor
            - call: "POST /api/containment-zones/${zid}/activate"
              payload: {}
              as: ProjectManager
            - call: "POST /api/abatement-orders"
              payload: { project_id: "${pid}", zone_id: "${zid}", lead_worker_id: "${lead_id}", abatement_type: "MOLD", planned_weight_kg: 50 }
              as: AbatementSupervisor
              captures: { aid: $.data.id }
            - call: "POST /api/assignments"
              payload: { abatement_order_id: "${aid}", worker_id: "${lead_id}", shift_start_at: "2026-01-15T08:00:00Z", shift_end_at: "2026-01-15T16:00:00Z" }
              as: AbatementSupervisor
            - call: "POST /api/abatement-orders/${aid}/start"
              payload: {}
              as: AbatementSupervisor
            - call: "POST /api/disposal-manifests"
              payload: { abatement_order_id: "${aid}", project_id: "${pid}", hauler_name: "Acme", manifest_weight_kg: 50 }
              as: AbatementSupervisor
              captures: { mid: $.data.id }
            - call: "POST /api/disposal-manifests/${mid}/submit"
              payload: {}
              as: AbatementSupervisor
            - call: "POST /api/disposal-manifests/${mid}/accept"
              payload: {}
              as: ProjectManager
            - call: "POST /api/abatement-orders/${aid}/complete"
              payload: { removed_weight_kg: 50 }
              as: AbatementSupervisor
            - call: "POST /api/insurance-claims"
              payload: { project_id: "${pid}", policy_number: "POL-4", deductible_cents: 0, coverage_limit_cents: 100000000 }
              as: ProjectManager
              captures: { clid: $.data.id }
            - call: "POST /api/insurance-claims/${clid}/submit"
              payload: {}
              as: ProjectManager
            - call: "POST /api/clearance-tests"
              payload: { project_id: "${pid}", zone_id: "${zid}", abatement_order_id: "${aid}", sampler_worker_id: "${sampler_id}", clearance_air_count: 90, clearance_volume_liters: 100 }
              as: LabTech
              captures: { cid_fail: $.data.id }
            - call: "POST /api/clearance-tests/${cid_fail}/analyze"
              payload: {}
              as: LabTech
            - call: "POST /api/abatement-orders/${aid}/start"
              payload: {}
              as: AbatementSupervisor
            - call: "POST /api/disposal-manifests"
              payload: { abatement_order_id: "${aid}", project_id: "${pid}", hauler_name: "Acme", manifest_weight_kg: 50 }
              as: AbatementSupervisor
              captures: { mid2: $.data.id }
            - call: "POST /api/disposal-manifests/${mid2}/submit"
              payload: {}
              as: AbatementSupervisor
            - call: "POST /api/disposal-manifests/${mid2}/accept"
              payload: {}
              as: ProjectManager
          trigger:
            - call: "POST /api/abatement-orders/${aid}/complete"
              payload: { removed_weight_kg: 50 }
              as: AbatementSupervisor
              captures: { ostatus: $.data.status }
          assert:
            - "AbatementOrder.${aid}.status == COMPLETED"
            - "InsuranceClaim.${clid}.settled_amount_cents == 79000"   # restored: 50*1500 + 4000

      # ---- Instance 2: open_finding_count conserved — clear then void-reanalyze restores the count
      - name: open_finding_count_conserved_across_void_and_reanalyze
        grounds:
          - calculations.open_findings
          - calculations.finding_level
          - state_machines.Sample.ANALYZED_to_VOIDED
          - state_machines.Sample.PENDING_to_ANALYZED
        distinguishing_aspect: |
          Conserved quantity = Project.open_finding_count (a hazard count, NOT money). After
          analyzing a HAZARDOUS sample (count 1), voiding it (count 0), then analyzing a fresh
          HAZARDOUS sample under the same assessment (count back to 1), the count returns to its
          original value. Invariant pinned: open_finding_count == |{Assessment: finding_level in
          {ELEVATED,HAZARDOUS} and status != CLEARED}|. Different conserved quantity from instance 1.
        test_recipe:
          setup:
            - "Clock 2026-01-15T00:00:00Z; MOLD project; assessment; one ANALYZED HAZARDOUS sample raw_count=1200 vol=100 -> open_finding_count 1."
          setup_api_calls:
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-15T00:00:00Z" }
              as: ComplianceOfficer
            - call: "POST /api/workers"
              payload: { full_name: "Assessor", cert_type: "MOLD", cert_expires_at: "2027-01-01T00:00:00Z", ppe_fit_test_at: "2025-12-15T00:00:00Z" }
              as: ProjectManager
              captures: { wid: $.data.id }
            - call: "POST /api/projects"
              payload: { site_name: "Conserve2 Site", hazard_class: "MOLD", structure_sqft: 80, jurisdiction_code: "US-EPA" }
              as: ProjectManager
              captures: { pid: $.data.id }
            - call: "POST /api/assessments"
              payload: { project_id: "${pid}", assessor_worker_id: "${wid}", area_label: "Floor" }
              as: LabTech
              captures: { asid: $.data.id }
            - call: "POST /api/samples"
              payload: { assessment_id: "${asid}", project_id: "${pid}", sample_type: "AIR", collected_at: "2026-01-14T00:00:00Z", volume_liters: 100 }
              as: LabTech
              captures: { sid: $.data.id }
            - call: "POST /api/samples/${sid}/result"
              payload: { raw_count: 1200 }
              as: LabTech
            - call: "POST /api/samples/${sid}/void"
              payload: {}
              as: ProjectManager
            - call: "POST /api/samples"
              payload: { assessment_id: "${asid}", project_id: "${pid}", sample_type: "AIR", collected_at: "2026-01-14T01:00:00Z", volume_liters: 100 }
              as: LabTech
              captures: { sid2: $.data.id }
          trigger:
            - call: "POST /api/samples/${sid2}/result"
              payload: { raw_count: 1200 }
              as: LabTech
          assert:
            - "Assessment.${asid}.finding_level == HAZARDOUS"
            - "Project.${pid}.open_finding_count == 1"   # restored to original
