    input: []
    output: Supplier
    side_effects: ["status DISQUALIFIED", "parts -> DISQUALIFIED", "in-flight lots -> ON_HOLD (SUPPLIER_QUALITY)", "ACTIVE agreement -> TERMINATED"]

