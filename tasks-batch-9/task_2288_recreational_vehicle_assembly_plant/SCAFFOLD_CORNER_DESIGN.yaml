          assert:
            - "e_equal == ERR_INVALID_REQUEST with status 400 (window_end == window_start)"
            - "e_inverted == ERR_INVALID_REQUEST with status 400"
            - "e_short == ERR_INVALID_REQUEST with status 400 — 29 minutes is below MIN_TEST_MINUTES 30"
            - "e_long == ERR_INVALID_REQUEST with status 400 — 241 minutes is above MAX_TEST_MINUTES 240"
            - "e_pdi_booth == ERR_INVALID_REQUEST with status 400 — a PDI must omit test_booth_id, window_start and window_end"
            - "e_clock == ERR_INVALID_REQUEST with status 400 — the clock is forward-only and 2026-08-01T00:00:00Z is not strictly after itself"
