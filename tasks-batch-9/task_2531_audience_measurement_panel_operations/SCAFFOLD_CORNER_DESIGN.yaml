              captures: { h83_id: "$.data.id" }
            - call: "POST /meters"
              payload: { household_id: "${h83_id}", meter_type: "TV_TUNER", serial_no: "MT-002087" }
              as: FieldTechnician
              captures: { mt83t_id: "$.data.id" }
            - call: "POST /meters"
              payload: { household_id: "${h83_id}", meter_type: "STREAMING_ROUTER", serial_no: "MT-002088" }
              as: FieldTechnician
              captures: { mt83s_id: "$.data.id" }
            - call: "POST /meters/${mt83t_id}/install-confirmations"
              payload: {}
              as: FieldTechnician
            - call: "POST /meters/${mt83s_id}/install-confirmations"
              payload: {}
              as: FieldTechnician
            - call: "POST /households/${h83_id}/enumerations"
              payload: { roster_persons_count: 2, tv_sets_count: 1 }
              as: FieldTechnician
            - call: "POST /_clock/set_current_utc"
