              captures: { seg_b: $.data.id, seg_b_v1: $.data.version }
            - call: "POST /cabling/pathway-segments"
              payload: { project_id: "${proj}", segment_code: "PS-D", pathway_type: "EMT_CONDUIT", usable_area_sq_mm: 573.0, length_m: 9.0, bend_count: 0 }
              as: DesignEngineer
              captures: { seg_d: $.data.id, seg_d_v1: $.data.version }
            - call: "POST /cabling/links"
