      - name: loyalty_customer_cannot_manage_catalog_or_stand
        claim_type: Violation → Error
        grounds:
          - roles.LoyaltyCustomer
          - errors[ERR_UNAUTHORIZED_ROLE]
        distinguishing_aspect: "LoyaltyCustomer is confined to its own app-order surface: attempts to throttle a stand, create recipes, or adjust points all fail 403."
        test_recipe:
          setup: ["Stand booted; one loyalty account."]
          setup_api_calls:
            - *k_clock
            - *k_region
            - *k_stand
            - *k_approve
            - *k_op
            - *k_agr
            - *k_agr_ok
            - *k_agr_act
