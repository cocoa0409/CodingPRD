            - { call: "POST /respite/providers/${prov}/status-transitions", payload: { target_status: "ACTIVE" }, as: Coordinator }
            - { call: "POST /respite/providers/${prov}/availability-windows", payload: { start_at: "2026-05-04T00:00:00Z", end_at: "2026-05-15T00:00:00Z", capacity: 2 }, as: Provider, as_user_id: "${prov}", captures: { win: $.data.id } }
            - { call: "POST /respite/vouchers", payload: { allocation_id: "${alloc}", caregiver_id: "${cg}", authorized_hours: 20 }, as: Caregiver, as_user_id: "${cg}", captures: { vch: $.data.id } }
            - { call: "POST /respite/bookings", payload: { voucher_id: "${vch}", caregiver_id: "${cg}", match_mode: "EXPLICIT", provider_id: "${prov}", window_id: "${win}", start_at: "2026-05-04T19:00:00Z", end_at: "2026-05-04T21:00:00Z" }, as: Caregiver, as_user_id: "${cg}", captures: { bk: $.data.id } }
