          assert:
            - "PATCH returns 200 with max_regrind_pct == 25.00, target_wall_thickness_mm == 6.50, msrp_cents == 195000"
            - "after the PATCH: model_code == 'PM-CD-IMM', hull_type == 'KAYAK', size_class == 'MID', warranty_basis == 'PRO_RATA_AGE', initial_warranty_reserve_cents == 500000 — the five fields the endpoint description calls immutable are unchanged and are not accepted inputs"
