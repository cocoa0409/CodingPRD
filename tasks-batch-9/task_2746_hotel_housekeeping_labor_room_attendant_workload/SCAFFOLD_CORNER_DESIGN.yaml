              as: LaundryLead
              captures: { turn: $.data.turnaround_minutes, breach: $.data.sla_breach, cyc_status: $.data.status }
          assert:
            - "After dispatch: LinenItem.${linen_id} holds on_hand_clean 12, in_laundry 8, soiled_queue 0 against total_owned_sets 20"
            - "HTTP 200 and LaundryCycle.${cyc_id}.turnaround_minutes == 240, from floor(4 hours / 60)"
            - "LaundryCycle.${cyc_id}.sla_breach == false and status == RETURNED, since 240 is not strictly greater than 240"
            - "LinenItem.${linen_id}.on_hand_clean == 18, in_laundry == 0, soiled_queue == 0 and total_owned_sets == 18 after the 2-set write-off"
            - "LinenItem.${linen_id}.shortage_status == OK, since coverage_ratio == 9.0000 against a par of 2"

      - name: calc_forecast_projection_diverges_from_the_reconciliation
        claim_type: variant_divergence
        excluded_because:
          difficulty_instance: forecast_projected_inventory_mix_versus_actual_reconciled_credits
          rationale: "Both variants of forecast_required_credits, their delta and the signed credit_variance_pct are computed on one day by that dual_variant_calc instance."

      - name: calc_minutes_per_room_variant_is_selected_by_the_reported_field
        claim_type: variant_selection
        excluded_because:
          difficulty_instance: minutes_per_room_gross_physical_versus_net_credited_after_reclean
          rationale: "The GROSS_PHYSICAL vs NET_CREDITED_ROOMS selection - and the fact that the productivity flag reads the net variant - is the second dual_variant_calc instance."

      - name: calc_forecast_credits_are_rounded_per_room_type_before_summing
        claim_type: precision
        excluded_because:
          difficulty_instance: forecast_credits_round_per_room_type_before_summing
          rationale: "The pinned round-then-sum order and the rejected sum-then-round reading are exactly that combinatorial_formula instance, with its half-cent tail literals."

      - name: calc_credit_value_constants_clamp_the_suite_deep_clean
        claim_type: constants_applied
        excluded_because:
          difficulty_instance: suite_deep_clean_credits_snap_to_quarter_then_clamp_to_ceiling
          rationale: "QUARTER_CREDIT snapping followed by the MAX_SINGLE_ROOM_CREDITS clamp in that order is the boundary_precision_check instance already designed for it."

      - name: calc_premium_tier_is_keyed_on_the_base_wage
        claim_type: tiered_pricing
        excluded_because:
          difficulty_instance: labor_cost_premium_tier_keyed_on_base_wage_not_on_total
          rationale: "Both tier boundaries and the rejected total-keyed reading (31886 vs 30992) are covered by that combinatorial_formula instance."

      - name: calc_day_allocated_credits_is_a_running_total
        claim_type: aggregation
        excluded_because:
          difficulty_instance: forecast_day_allocated_credits_returns_to_pre_assignment_total_after_cancel
          rationale: "The running total after an add and after a reversal is the conserved-quantity subject of that compensating_invariant instance."

  - section: validations
    instances:
      - name: v_missing_identity_headers_are_unauthenticated
        claim_type: violation_to_error
        grounds:
          - validations[priority=1]
          - validations[priority=2]
          - errors[ERR_UNAUTHENTICATED]
        distinguishing_aspect: "A request that carries no recognised role identity is refused at priority 1 with ERR_UNAUTHENTICATED (401) before any body validation runs, so an empty body never surfaces ERR_INVALID_REQUEST."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-03T07:00:00.000Z; empty database."
            - "The trigger request omits the identity headers entirely (no X-Role and no X-User-ID)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T07:00:00.000Z" }
              as: HousekeepingDirector
          trigger:
            - call: "POST /housekeeping/properties"
              payload: {}
              as: ""
              captures: { auth_error: $.data.error_id }
          assert:
            - "HTTP 401 with error_id == ERR_UNAUTHENTICATED"
            - "The response is not ERR_INVALID_REQUEST, even though the body is empty"
            - "GET /housekeeping/properties/{any} for a made-up id with no headers also returns ERR_UNAUTHENTICATED"

      - name: v_role_denial_outranks_the_invalid_body_and_is_rejected
        claim_type: priority_ordering
        grounds:
          - validations[priority=3]
          - validations[priority=4]
          - errors[ERR_ROLE_NOT_PERMITTED]
        distinguishing_aspect: "A RoomAttendant posting an empty property body violates both priority 3 and priority 4, and the response is ERR_ROLE_NOT_PERMITTED (403) rather than ERR_INVALID_REQUEST (400)."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-03T07:00:00.000Z; empty database."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T07:00:00.000Z" }
              as: HousekeepingDirector
          trigger:
            - call: "POST /housekeeping/properties"
              payload: {}
              as: RoomAttendant
              captures: { order_error: $.data.error_id }
          assert:
            - "HTTP 403 with error_id == ERR_ROLE_NOT_PERMITTED"
            - "error_id is not ERR_INVALID_REQUEST, proving priority 3 is evaluated before priority 4"
            - "No Property row is created"

      - name: v_deep_clean_create_passes_every_gate_when_all_conditions_hold
        claim_type: satisfaction_to_pass
        grounds:
          - validations[priority=16]
          - validations[priority=19]
