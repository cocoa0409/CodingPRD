              as_user_id: "${w_coord}"
            - call: "GET /submissions/${sub}/hprd"
              payload: { variant: "AUDIT_ADJUSTED" }
              as: StaffingCoordinator
              as_user_id: "${w_coord}"
            - call: "GET /submissions/${sub}"
              payload: {}
              as: StaffingCoordinator
              as_user_id: "${w_coord}"
          assert:
            - "the audit-readiness read returns considered_entry_count == 1, considered_hours == 8.00, supported_hours == 8.00, support_ratio == 1.0000, vendor_attestation_ratio == 1.0000, census_reconciled_ratio == 1.0000, score == 100.00, at_risk == false"
            - "the hprd read returns variant AUDIT_ADJUSTED with total_direct_care_hours == 8.00, resident_days == 5 taken from mds_resident_count, total_nurse_hprd == 1.6000, rn_hprd == 1.6000, implausible == false"
            - "the hprd read returns weekend_direct_care_hours == 0.00, weekend_resident_days == 0 and weekend_total_nurse_hprd == null, since 2026-04-01 is a Wednesday"
            - "the final GET /submissions/${sub} shows audit_support_score == 100.00 and version == ${sv_acc}, unchanged by either computed read"

      - name: waive_rejected_when_finding_already_waived_or_unknown
        claim_type: conditional_action
        grounds:
          - endpoints[POST /submissions/{id}/findings/{finding_id}/waive]
          - validations[priority 29 ERR_FINDING_NOT_OPEN]
          - errors[ERR_FINDING_NOT_FOUND]
        distinguishing_aspect: "Waiver is allowed only while the finding is OPEN, so the second waiver of the same finding is refused on state and an unknown finding id is refused on existence, with the two probes returning different error ids from the same endpoint."
        test_recipe:
          setup:
