          assert:
            - "o2 submit returns 409 with error_id == ERR_SLOT_FULL (aggregate capacity 1 over the fixed window already consumed)"
            - "PickupSlot.${slot_id}.booked_count == 1 == capacity"

      - name: curbside_space_concurrent_open_ended_overlap
        grounds:
          - entities.Store.fields.curbside_spaces
          - entities.Store.fields.active_curbside_count
          - state_machines.CurbsideCheckIn.BEING_LOADED_to_COMPLETED
          - validations[priority=15]
        distinguishing_aspect: |
          Store curbside interval semantics DIFFER from the slot: a check-in occupies a
          curbside space for an OPEN-ENDED interval [arrival, completion/cancel) that closes
          on an explicit transition, not a pre-declared window. With curbside_spaces 1, a
