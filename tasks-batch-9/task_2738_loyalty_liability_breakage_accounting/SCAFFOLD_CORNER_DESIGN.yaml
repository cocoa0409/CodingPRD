              captures: { coh1_id: $.data.id }
            - call: "POST /programs/${prog_id}/activate"
              payload: {}
              as: ProgramAdmin
            - call: "POST /program-change-orders"
              payload: { program_id: "${prog_id}", change_type: "EXPIRY_DAYS_CHANGE", new_point_expiry_days: 365, behavior_elasticity_bp: -400, effective_at: "2026-12-01T00:00:00Z" }
              as: ProgramAdmin
              captures: { orda_id: $.data.id }
            - call: "POST /program-change-orders"
              payload: { program_id: "${prog_id}", change_type: "SSP_CHANGE", new_ssp_millicents_per_point: 1500, behavior_elasticity_bp: -200, effective_at: "2026-12-01T00:00:00Z" }
              as: ProgramAdmin
              captures: { ordb_id: $.data.id }
            - call: "POST /program-change-orders"
              payload: { program_id: "${prog_id}", change_type: "EXPIRY_DAYS_CHANGE", new_point_expiry_days: 1095, behavior_elasticity_bp: 300, effective_at: "2027-01-01T00:00:00Z" }
              as: ProgramAdmin
              captures: { ordc_id: $.data.id }
          trigger:
            - call: "POST /program-change-orders/${ordc_id}/approve"
              payload: {}
              as: Controller
          assert:
            - "ProgramChangeOrder.${ordc_id}.state == APPROVED with cancelled_by_order_id == null"
            - "ProgramChangeOrder.${orda_id}.state == CANCELLED with cancelled_by_order_id == ${ordc_id} - same program, same change_type, was MODELED"
            - "ProgramChangeOrder.${ordb_id}.state is STILL MODELED with cancelled_by_order_id == null - a different change_type is not a competitor"
            - "GET /program-change-orders?program_id=${prog_id}&state=MODELED returns total_count == 1 and GET /program-change-orders?cancelled_by_order_id=${ordc_id} returns total_count == 1"
            - "LoyaltyProgram.${prog_id}.point_expiry_days is still 730 and ssp_millicents_per_point is still 1200 - approval models the change, only apply writes it"
            - "A second approve on ${ordc_id} returns HTTP 409 ERR_INVALID_STATE_TRANSITION, and approve on the CANCELLED ${orda_id} returns HTTP 409 ERR_INVALID_STATE_TRANSITION as well"

      - name: state_estimate_reject_resubmit_cycle_bounded
        claim_type: cyclic
        grounds:
          - state_machines.BreakageEstimate.transitions[REJECTED->SUBMITTED]
          - validations[priority=86]
          - errors[ERR_REVISION_LIMIT_EXCEEDED]
        excluded_because:
          difficulty_instance: non_linear_state_machine / nonlinear_estimate_reject_resubmit_cycle_bounded_at_two
          rationale: "That instance walks SUBMITTED -> REJECTED -> SUBMITTED twice, asserts revision_count 1 then 2, asserts the frozen estimated_redemption_rate_bp across resubmissions, and asserts the third resubmission fails with ERR_REVISION_LIMIT_EXCEEDED - the entire bounded-cycle claim."

      - name: state_point_lot_two_independent_state_dimensions
        claim_type: parallel
        grounds:
          - state_machines.PointLot.transitions
          - entities.PointLot.fields.settlement_state
        excluded_because:
          difficulty_instance: non_linear_state_machine / nonlinear_pointlot_parallel_lifecycle_and_settlement_dimensions
          rationale: "That instance drives lifecycle_state and settlement_state across their full cross-product on the same lot and asserts each dimension advances without disturbing the other, which is exactly the parallel-region claim."

      - name: state_expiry_sweep_cascades_down_to_escheat_and_program
        claim_type: Cascade down
        grounds:
          - state_machines.PointLot.transitions[EXPIRED->ESCHEATED].side_effects
          - calculations.lot_expiry_and_escheat_measurement
        excluded_because:
          difficulty_instance: transitive_cascade / cascade_expiry_to_escheat_to_program_disclosure_latch
          rationale: "That instance asserts the full three-link chain from the sweep (LINK 1 expiry release, LINK 2 escheat accrual, LINK 3 the program disclosure latch) plus its idempotency on a second sweep."

      - name: state_redemption_reverse_is_the_compensating_edge
        claim_type: Compensation
        grounds:
          - state_machines.PointLot.transitions[FULLY_REDEEMED->OUTSTANDING]
          - calculations.redemption_revenue_release.variants[reversal_compensation]
        excluded_because:
          difficulty_instance: compensating_invariant / compensating_redemption_reverse_conserves_lot_points
          rationale: "That instance asserts the REVERSAL row's negated amounts, the restored points_remaining, the restored lifecycle_state and the exactly restored period ledger figures, which is the whole compensating-transition claim."

  # ===========================================================================
  # SECTION 3 — calculations
  # ===========================================================================
  - section: calculations
    instances:

      - name: calc_issuance_nested_tier_then_promo_rounding
        claim_type: tiered_pricing
        grounds:
          - calculations.point_issuance_measurement
        excluded_because:
          difficulty_instance: combinatorial_formula / combinatorial_issuance_nested_tier_then_promo_rounding
          rationale: "That instance asserts base 250 at SILVER 10300 with promo 10300 yields tier_points 258 and points_issued 266 (not the one-shot 265) and propagates the divergence into gross_ssp_cents 319, which is the whole nested-rounding claim."

      - name: calc_cohort_rate_clamped_per_cohort_before_weighting
        claim_type: weighted_scoring
        grounds:
          - calculations.estimated_redemption_rate
        excluded_because:
          difficulty_instance: combinatorial_formula / combinatorial_cohort_rate_clamped_before_weighting
          rationale: "That instance asserts the two-cohort estimate resolves to 7796 bp (clamp per cohort to the 200 bp floor first) rather than 7791 bp (clamp the aggregate), which is the entire weighting-order claim."

      - name: calc_period_close_eight_steps_in_pinned_order
        claim_type: aggregation
        grounds:
          - calculations.period_close_rollforward
        excluded_because:
          difficulty_instance: combinatorial_formula / combinatorial_period_close_rollforward_pinned_eight_step_order
          rationale: "That instance asserts all eight persisted rollforward outputs for the canonical fixture (pre_catchup 1932, outstanding_gross_at_close 2719, required 2120, catch_up 188, closing 2120, breakage_recognized -188) and that STEP 7 measures the gross AT CLOSE, not at estimate time."

      - name: calc_redemption_provisional_versus_final_divergence
        claim_type: Variant Divergence
        grounds:
          - calculations.redemption_revenue_release.variants
        excluded_because:
          difficulty_instance: dual_variant_calc / dual_variant_redemption_provisional_vs_final_release
          rationale: "That instance asserts provisional 2700 at the lot's frozen 2500 bp, final 2807 at the program's current 2204 bp, remeasurement_delta 107, and the per-line-versus-round-once divergence (383 vs 382) on a three-line event."

      - name: calc_partner_settlement_gross_versus_net_reconciliation
        claim_type: Reconciliation
        grounds:
          - calculations.partner_settlement_net.variants
        excluded_because:
          difficulty_instance: dual_variant_calc / dual_variant_partner_settlement_gross_vs_net
          rationale: "That instance asserts the same (agreement, period) facts produce net_due 72000 under GROSS and 68700 under NET, with the 3300 payable as the reconciling item, which is the whole two-basis reconciliation claim."

      - name: calc_estimate_single_cohort_variant_selected_by_cohort_id
        claim_type: Variant Selection
        grounds:
          - calculations.estimated_redemption_rate.variants[SINGLE_COHORT]
          - calculations.estimated_redemption_rate.variants[COHORT_WEIGHTED]
          - endpoints[POST /programs/{id}/breakage-estimates]
        distinguishing_aspect: "The presence of the OPTIONAL cohort_id input alone selects the variant: on identical facts the program-wide COHORT_WEIGHTED estimate is 4200 bp over a 2400-cent gross, while the SINGLE_COHORT estimate for C1 is 8200 bp over C1's own 1200-cent gross."
        test_recipe:
          setup:
            - "Clock 2026-08-01T00:00:00Z. Program 'Variant Core' ACTIVE with breakage_method COHORT_WEIGHTED, ssp 1200, cap 5000, historical 7500 (so current_breakage_rate_bp is 2500), rule TX."
            - "TWO cohorts: C1 observed 8200 / adjustment 0, and C2 observed 400 / adjustment -300 (raw 100 bp, clamped UP to the 200 bp floor)."
            - "Member M1 BASE/TX in C1 and member M2 BASE/TX in C2, each holding one BASE lot of 1000 points (gross 1200, deferred 900), so both cohort weights are 1000 points."
            - "period per1 [2026-08-01, 2026-09-01) is OPEN."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /programs"
              payload: { name: "Variant Core", currency_code: "USD", ssp_millicents_per_point: 1200, point_expiry_days: 730, per_issuance_point_cap: 5000, tier_multiplier_bp: { BASE: 10000, SILVER: 10300, GOLD: 12500, PLATINUM: 15000 }, promo_multiplier_cap_bp: 30000, breakage_method: "COHORT_WEIGHTED", historical_redemption_rate_bp: 7500, escheat_disclosure_threshold_cents: 100000 }
              as: ProgramAdmin
              captures: { prog_id: $.data.id }
            - call: "POST /state-expiry-rules"
              payload: { program_id: "${prog_id}", state_code: "TX", expiry_permitted: true, min_dormancy_days: 730, escheatment_required: false, escheat_rate_bp: 0 }
              as: ProgramAdmin
            - call: "POST /cohorts"
              payload: { program_id: "${prog_id}", cohort_code: "C1", enrollment_start_date: "2024-01-01T00:00:00Z", enrollment_end_date: "2024-12-31T00:00:00Z", observed_redemption_rate_bp: 8200, sample_size: 40000, program_change_adjustment_bp: 0 }
              as: ProgramAdmin
              captures: { coh1_id: $.data.id }
            - call: "POST /cohorts"
              payload: { program_id: "${prog_id}", cohort_code: "C2", enrollment_start_date: "2025-01-01T00:00:00Z", enrollment_end_date: "2025-12-31T00:00:00Z", observed_redemption_rate_bp: 400, sample_size: 9000, program_change_adjustment_bp: -300 }
              as: ProgramAdmin
              captures: { coh2_id: $.data.id }
            - call: "POST /programs/${prog_id}/activate"
              payload: {}
              as: ProgramAdmin
            - call: "POST /members"
              payload: { program_id: "${prog_id}", cohort_id: "${coh1_id}", external_member_ref: "M1", state_code: "TX", tier: "BASE" }
              as: LoyaltyAccountant
              captures: { m1_id: $.data.id }
            - call: "POST /members"
              payload: { program_id: "${prog_id}", cohort_id: "${coh2_id}", external_member_ref: "M2", state_code: "TX", tier: "BASE" }
              as: LoyaltyAccountant
              captures: { m2_id: $.data.id }
            - call: "POST /accounting-periods"
              payload: { program_id: "${prog_id}", period_code: "2026-08", start_at: "2026-08-01T00:00:00Z", end_at: "2026-09-01T00:00:00Z" }
              as: Controller
              captures: { per1_id: $.data.id }
            - call: "POST /point-lots"
              payload: { member_id: "${m1_id}", period_id: "${per1_id}", base_points: 1000, promo_multiplier_bp: 10000 }
              as: LoyaltyAccountant
              captures: { lot1_id: $.data.id }
            - call: "POST /point-lots"
              payload: { member_id: "${m2_id}", period_id: "${per1_id}", base_points: 1000, promo_multiplier_bp: 10000 }
              as: LoyaltyAccountant
              captures: { lot2_id: $.data.id }
          trigger:
            - call: "POST /programs/${prog_id}/breakage-estimates"
              payload: { period_id: "${per1_id}", memo_narrative: "Program-wide two-cohort estimate.", sensitivity_low_bp: 3700, sensitivity_high_bp: 4700 }
              as: LoyaltyAccountant
              captures: { est_all_id: $.data.id }
            - call: "POST /programs/${prog_id}/breakage-estimates"
              payload: { period_id: "${per1_id}", cohort_id: "${coh1_id}", memo_narrative: "Single-cohort estimate restricted to C1.", sensitivity_low_bp: 7700, sensitivity_high_bp: 8700 }
              as: LoyaltyAccountant
              captures: { est_c1_id: $.data.id }
          assert:
            - "BreakageEstimate.${est_all_id}.method_applied == COHORT_WEIGHTED with cohort_id == null"
            - "BreakageEstimate.${est_all_id}.estimated_redemption_rate_bp == 4200 - adj_C1 8200 and adj_C2 clamp(400 + -300, 200, 9800) == 200, weighted (8200*1000 + 200*1000) / 2000 == 4200"
            - "BreakageEstimate.${est_all_id}.breakage_rate_bp == 5800, outstanding_points_at_estimate == 2000, outstanding_gross_ssp_cents_at_estimate == 2400, required_liability_cents == round_half_up(2400 * 4200 / 10000) == 1008"
            - "BreakageEstimate.${est_c1_id}.method_applied == SINGLE_COHORT with cohort_id == ${coh1_id}"
            - "BreakageEstimate.${est_c1_id}.estimated_redemption_rate_bp == 8200 - the weighted mean collapses to clamp(8200 + 0) with no division"
            - "BreakageEstimate.${est_c1_id}.outstanding_points_at_estimate == 1000 and outstanding_gross_ssp_cents_at_estimate == 1200 - only C1's members' lots are in the candidate set"
            - "BreakageEstimate.${est_c1_id}.required_liability_cents == round_half_up(1200 * 8200 / 10000) == 984"
            - "Both estimates are in state DRAFT with prepared_by_user_id set to the calling LoyaltyAccountant's X-User-ID"

      - name: calc_estimate_program_historical_variant_selected_by_program_method
        claim_type: Variant Selection
        grounds:
          - calculations.estimated_redemption_rate.variants[PROGRAM_HISTORICAL]
          - calculations.estimated_redemption_rate.variants[SINGLE_COHORT]
          - entities.LoyaltyProgram.fields.breakage_method
        distinguishing_aspect: "With breakage_method PROGRAM_HISTORICAL the cohort's observed 8200 bp is ignored entirely and the rate is the program's historical 7500 bp verbatim, yet an explicit cohort_id still overrides the program method and re-selects SINGLE_COHORT."
        test_recipe:
          setup:
            - "Clock 2026-08-01T00:00:00Z. Program 'Historical Core' ACTIVE with breakage_method PROGRAM_HISTORICAL, ssp 1200, cap 5000, historical_redemption_rate_bp 7500 (so activation seeds current_breakage_rate_bp 2500), rule TX."
            - "One cohort C1 observed 8200 / adjustment 0, member M1 GOLD/TX, period per1 [2026-08-01, 2026-09-01)."
            - "One lot of base_points 4000 at GOLD 12500: points_issued 5000, gross 6000, reserve 1500, deferred 4500."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /programs"
              payload: { name: "Historical Core", currency_code: "USD", ssp_millicents_per_point: 1200, point_expiry_days: 730, per_issuance_point_cap: 5000, tier_multiplier_bp: { BASE: 10000, SILVER: 10300, GOLD: 12500, PLATINUM: 15000 }, promo_multiplier_cap_bp: 30000, breakage_method: "PROGRAM_HISTORICAL", historical_redemption_rate_bp: 7500, escheat_disclosure_threshold_cents: 100000 }
              as: ProgramAdmin
              captures: { prog_id: $.data.id }
            - call: "POST /state-expiry-rules"
              payload: { program_id: "${prog_id}", state_code: "TX", expiry_permitted: true, min_dormancy_days: 730, escheatment_required: false, escheat_rate_bp: 0 }
              as: ProgramAdmin
            - call: "POST /cohorts"
              payload: { program_id: "${prog_id}", cohort_code: "C1", enrollment_start_date: "2024-01-01T00:00:00Z", enrollment_end_date: "2024-12-31T00:00:00Z", observed_redemption_rate_bp: 8200, sample_size: 40000, program_change_adjustment_bp: 0 }
              as: ProgramAdmin
              captures: { coh1_id: $.data.id }
            - call: "POST /programs/${prog_id}/activate"
              payload: {}
              as: ProgramAdmin
            - call: "POST /members"
              payload: { program_id: "${prog_id}", cohort_id: "${coh1_id}", external_member_ref: "M1", state_code: "TX", tier: "GOLD" }
              as: LoyaltyAccountant
              captures: { m1_id: $.data.id }
            - call: "POST /accounting-periods"
              payload: { program_id: "${prog_id}", period_code: "2026-08", start_at: "2026-08-01T00:00:00Z", end_at: "2026-09-01T00:00:00Z" }
              as: Controller
              captures: { per1_id: $.data.id }
            - call: "POST /point-lots"
              payload: { member_id: "${m1_id}", period_id: "${per1_id}", base_points: 4000, promo_multiplier_bp: 10000 }
              as: LoyaltyAccountant
              captures: { lot1_id: $.data.id }
          trigger:
            - call: "POST /programs/${prog_id}/breakage-estimates"
              payload: { period_id: "${per1_id}", memo_narrative: "Program-historical estimate, cohort rates ignored.", sensitivity_low_bp: 7000, sensitivity_high_bp: 8000 }
              as: LoyaltyAccountant
              captures: { est_hist_id: $.data.id }
            - call: "POST /programs/${prog_id}/breakage-estimates"
              payload: { period_id: "${per1_id}", cohort_id: "${coh1_id}", memo_narrative: "Explicit cohort overrides the program method.", sensitivity_low_bp: 7700, sensitivity_high_bp: 8700 }
              as: LoyaltyAccountant
              captures: { est_coh_id: $.data.id }
          assert:
            - "BreakageEstimate.${est_hist_id}.method_applied == PROGRAM_HISTORICAL and estimated_redemption_rate_bp == 7500 - taken verbatim from the program, NOT the cohort's 8200"
            - "BreakageEstimate.${est_hist_id}.breakage_rate_bp == 2500, outstanding_points_at_estimate == 5000, outstanding_gross_ssp_cents_at_estimate == 6000"
            - "BreakageEstimate.${est_hist_id}.required_liability_cents == round_half_up(6000 * 7500 / 10000) == 4500 - the gross is still measured over the same lot set, so the figure still tracks the outstanding balance"
            - "BreakageEstimate.${est_coh_id}.method_applied == SINGLE_COHORT and estimated_redemption_rate_bp == 8200 - supplying cohort_id wins regardless of program.breakage_method"
            - "BreakageEstimate.${est_coh_id}.required_liability_cents == round_half_up(6000 * 8200 / 10000) == 4920 - a 420-cent difference driven purely by variant selection"
            - "Cohort.${coh1_id}.observed_redemption_rate_bp is still 8200 and program_change_adjustment_bp is still 0 - measuring an estimate never mutates a cohort"

      - name: calc_required_liability_uses_round_half_up_at_exact_half
        claim_type: Precision
        grounds:
          - calculations.estimated_redemption_rate.precision
          - calculations.breakage_sensitivity_bands.precision
          - calculations.point_issuance_measurement.precision
        distinguishing_aspect: "Four separate quantities land on an exact .5 tie in one fixture (820.5, 770.5, 870.5 and 257.5), so ROUND_HALF_UP gives 821 / 771 / 871 / 258 where banker's rounding would give 820 / 770 / 870 / 258 - the first three are the discriminating assertions."
        test_recipe:
          setup:
            - "Clock 2026-08-01T00:00:00Z. Program 'Tie Core' ACTIVE with ssp_millicents_per_point 1000 (so 1 point == 1 cent of gross SSP), cap 5000, historical 7500 (current_breakage_rate_bp 2500), rule TX."
            - "One cohort C1 with observed_redemption_rate_bp 8205 and adjustment 0."
            - "Member M1 BASE/TX and member M2 SILVER/TX; period per1 [2026-08-01, 2026-09-01)."
            - "M1 holds one BASE lot of 1000 points, so the estimate's outstanding gross is exactly 1000 cents."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /programs"
              payload: { name: "Tie Core", currency_code: "USD", ssp_millicents_per_point: 1000, point_expiry_days: 730, per_issuance_point_cap: 5000, tier_multiplier_bp: { BASE: 10000, SILVER: 10300, GOLD: 12500, PLATINUM: 15000 }, promo_multiplier_cap_bp: 30000, breakage_method: "COHORT_WEIGHTED", historical_redemption_rate_bp: 7500, escheat_disclosure_threshold_cents: 100000 }
              as: ProgramAdmin
              captures: { prog_id: $.data.id }
            - call: "POST /state-expiry-rules"
              payload: { program_id: "${prog_id}", state_code: "TX", expiry_permitted: true, min_dormancy_days: 730, escheatment_required: false, escheat_rate_bp: 0 }
              as: ProgramAdmin
            - call: "POST /cohorts"
              payload: { program_id: "${prog_id}", cohort_code: "C1", enrollment_start_date: "2024-01-01T00:00:00Z", enrollment_end_date: "2024-12-31T00:00:00Z", observed_redemption_rate_bp: 8205, sample_size: 40000, program_change_adjustment_bp: 0 }
              as: ProgramAdmin
              captures: { coh1_id: $.data.id }
            - call: "POST /programs/${prog_id}/activate"
              payload: {}
              as: ProgramAdmin
            - call: "POST /members"
              payload: { program_id: "${prog_id}", cohort_id: "${coh1_id}", external_member_ref: "M1", state_code: "TX", tier: "BASE" }
              as: LoyaltyAccountant
              captures: { m1_id: $.data.id }
            - call: "POST /members"
              payload: { program_id: "${prog_id}", cohort_id: "${coh1_id}", external_member_ref: "M2", state_code: "TX", tier: "SILVER" }
              as: LoyaltyAccountant
              captures: { m2_id: $.data.id }
            - call: "POST /accounting-periods"
              payload: { program_id: "${prog_id}", period_code: "2026-08", start_at: "2026-08-01T00:00:00Z", end_at: "2026-09-01T00:00:00Z" }
              as: Controller
              captures: { per1_id: $.data.id }
            - call: "POST /point-lots"
              payload: { member_id: "${m1_id}", period_id: "${per1_id}", base_points: 1000, promo_multiplier_bp: 10000 }
              as: LoyaltyAccountant
              captures: { lot1_id: $.data.id }
          trigger:
            - call: "POST /programs/${prog_id}/breakage-estimates"
              payload: { period_id: "${per1_id}", memo_narrative: "Tie-breaking fixture for the actuarial memorandum.", sensitivity_low_bp: 7705, sensitivity_high_bp: 8705 }
              as: LoyaltyAccountant
              captures: { est1_id: $.data.id }
            - call: "GET /breakage-estimates/${est1_id}/sensitivity"
              payload: {}
              as: LoyaltyAccountant
            - call: "POST /point-lots"
              payload: { member_id: "${m2_id}", period_id: "${per1_id}", base_points: 250, promo_multiplier_bp: 10000 }
              as: LoyaltyAccountant
              captures: { lot2_id: $.data.id }
            - call: "GET /breakage-estimates/${est1_id}/sensitivity"
              payload: {}
              as: LoyaltyAccountant
          assert:
            - "BreakageEstimate.${est1_id}.estimated_redemption_rate_bp == 8205, outstanding_gross_ssp_cents_at_estimate == 1000"
            - "BreakageEstimate.${est1_id}.required_liability_cents == 821 - 1000 * 8205 / 10000 is exactly 820.5 and ROUND_HALF_UP goes UP; banker's rounding would give 820"
            - "SENSITIVITY READ 1 returns low_required_liability_cents == 771 (exactly 770.5), base_required_liability_cents == 821 (exactly 820.5), high_required_liability_cents == 871 (exactly 870.5) and band_range_cents == 100"
            - "PointLot.${lot2_id}.tier_points == 258 - 250 * 10300 / 10000 is exactly 257.5, rounded UP"
            - "PointLot.${lot2_id}.points_issued == 258 (promo 10000 is the identity), gross_ssp_cents == 258, breakage_reserve_cents == 65 (258 * 2500 / 10000 is exactly 64.5, rounded UP), deferred_revenue_cents == 193"
            - "PointLot.${lot2_id}.tier_benefit_expense_cents == 8 (round_half_up((258 - 250) * 1000 / 1000)) and promo_expense_cents == 0"
            - "SENSITIVITY READ 2, taken AFTER lot2 exists, returns the SAME 771 / 821 / 871 / 100 - the band reads the estimate's frozen outstanding_gross_ssp_cents_at_estimate snapshot, never a fresh measurement"

      - name: calc_estimate_input_set_excludes_fully_redeemed_lots
        claim_type: Input Set Filtering
        grounds:
          - calculations.estimated_redemption_rate.input_set
          - validations[priority=92]
          - errors[ERR_NO_OUTSTANDING_POINTS]
        distinguishing_aspect: "Only lots in OUTSTANDING or PARTIALLY_REDEEMED feed the cohort weight and the gross: with one of three 1000-point lots FULLY_REDEEMED the estimate weighs 2000 points over 2400 cents, and once every lot is fully redeemed the estimate is refused with ERR_NO_OUTSTANDING_POINTS instead of measuring a zero-weight rate."
        test_recipe:
          setup:
            - "Clock 2026-08-01T00:00:00Z. Program 'Filter Core' ACTIVE (ssp 1200, cap 5000, historical 7500 so current_breakage_rate_bp 2500), rule TX, single cohort C1 observed 8200 / adjustment 0, member M1 BASE/TX, period per1 [2026-08-01, 2026-09-01)."
            - "Three BASE lots of 1000 points each (gross 1200, reserve 300, deferred 900 apiece); M1.point_balance is 3000."
