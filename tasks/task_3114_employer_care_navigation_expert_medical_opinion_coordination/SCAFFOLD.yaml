# =============================================================================
# SCAFFOLD: Employer Care Navigation & Expert Medical Opinion Coordination
# Task: task_3114_employer_care_navigation_expert_medical_opinion_coordination
# =============================================================================

scenario: |
  Employer Care Navigation & Expert Medical Opinion Coordination (Included
  Health): member eligibility loaded from employer files with dependent and
  coverage tier handling, navigation intake identifying clinical, benefit and
  cost questions with routing to nurses, advocates or physicians, provider
  quality matching using claims-derived performance data and network status,
  appointment booking and record retrieval on the member's behalf with consent
  capture, expert medical opinion service where records are compiled and
  reviewed by a specialist with a written recommendation, billing advocacy
  including claim error identification and provider negotiation, employer
  reporting on utilization steerage and savings attribution, integration with
  the health plan for authorization and benefit questions

domain_name: employer-care-navigation
api_prefix: /care

complexity_profile:
  primary_archetype: workflow_orchestration
  secondary_archetype: compliance_audit
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - selector_policy
  entity_topology: flat
  state_machine_shape: branching   # navigation fork + EMO revision cycle + billing negotiation rounds
  relationship_patterns:
    - one_to_many
    - many_to_many          # OpinionRecordItem junction: ExpertOpinionCase x RecordRequest
    - self_referential      # Member.subscriber_id (dependents)
    - cross_aggregate       # Appointment -> Provider / NavigationCase; BillingCase -> Claim
  role_model: segregation_of_duties   # EMO compiler != reviewer; plus peer_roles for navigation disciplines
  consistency_model: immediate

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Employer
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Employer legal name" }
      - { name: pepm_fee_cents, type: integer, source: input, description: "Per-employee-per-month navigation fee in cents" }
      - { name: avg_in_out_cost_delta_cents, type: integer, source: input, description: "Employer-provided average cost delta (in-network minus out-of-network) per steered appointment; input to steerage savings" }
      - { name: emo_benefit_enabled, type: boolean, source: input, description: "Whether the employer sponsors the expert medical opinion benefit" }

  - name: Member
    parent: null
    common_fields: true
    fields:
      - { name: employer_id, type: string, source: system, description: "FK -> Employer.id; owning employer from the eligibility file load" }
      - { name: subscriber_id, type: string, source: input, description: "FK -> Member.id; the subscriber this dependent belongs to; null iff relationship == SELF" }
      - { name: relationship, type: enum, source: input, description: "SELF | SPOUSE | CHILD — dependent handling per eligibility file" }
      - { name: full_name, type: string, source: input, description: "Member full name" }
      - { name: date_of_birth, type: string, source: input, description: "ISO 8601 date" }
      - { name: external_member_ref, type: string, source: input, description: "Employer-file member reference; unique within (employer_id)" }
      - { name: eligibility_status, type: enum, source: system, description: "ACTIVE | INACTIVE" }
      - { name: deductible_limit_cents, type: integer, source: input, description: "Annual individual deductible from plan feed" }
      - { name: oop_max_cents, type: integer, source: input, description: "Annual out-of-pocket maximum from plan feed" }
      - { name: deductible_used_cents, type: integer, source: computed, default: 0, description: "Sum of deductible_applied_cents over member's claims in status ADJUDICATED (VOID excluded)" }
      - { name: oop_used_cents, type: integer, source: computed, default: 0, description: "Sum of member_responsibility_cents over member's claims in status ADJUDICATED (VOID excluded)" }

  - name: CoverageWindow
    parent: null
    common_fields: true
    fields:
      - { name: member_id, type: string, source: system, description: "FK -> Member.id; covered member" }
      - { name: coverage_tier, type: enum, source: input, description: "EMPLOYEE_ONLY | EMPLOYEE_SPOUSE | EMPLOYEE_CHILDREN | FAMILY" }
      - { name: effective_start, type: string, source: input, description: "ISO 8601 date, inclusive lower bound of the CLOSED interval" }
      - { name: effective_end, type: string, source: input, description: "ISO 8601 date, inclusive upper bound; null = open-ended", default: null }
      - { name: status, type: enum, source: system, description: "OPEN | CLOSED" }

  - name: Provider
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Provider practice name" }
      - { name: specialty, type: string, source: input, description: "Specialty code used by match eligibility filter (e.g. CARDIOLOGY)" }
      - { name: network_status, type: enum, source: input, description: "IN_NETWORK | OUT_OF_NETWORK" }

  - name: QualitySnapshot
    parent: null
    common_fields: true
    fields:
      - { name: provider_id, type: string, source: system, description: "FK -> Provider.id; measured provider" }
      - { name: period_start, type: string, source: input, description: "ISO 8601 date; claims-derived measurement window start" }
      - { name: period_end, type: string, source: input, description: "ISO 8601 date; measurement window end; unique per (provider_id) together with period_start" }
      - { name: outcome_score, type: number, source: input, description: "0-100 claims-derived outcome score" }
      - { name: cost_efficiency_score, type: number, source: input, description: "0-100 claims-derived cost efficiency score" }
      - { name: access_score, type: number, source: input, description: "0-100 claims-derived access score" }
      - { name: claims_volume, type: integer, source: input, description: "Number of adjudicated claims in the window; drives low-volume shrinkage" }
      - { name: composite_quality_score, type: number, source: computed, description: "per calculations.provider_quality_score" }

  - name: ProviderMatch
    parent: null
    common_fields: false
    fields:
      - { name: provider_id, type: string, source: computed, description: "Ephemeral computed view (not persisted); Provider.id of the candidate" }
      - { name: provider_name, type: string, source: computed, description: "Ephemeral computed view; provider display name" }
      - { name: specialty, type: string, source: computed, description: "Ephemeral computed view; provider specialty" }
      - { name: network_status, type: enum, source: computed, description: "Ephemeral computed view; IN_NETWORK | OUT_OF_NETWORK" }
      - { name: composite_quality_score, type: number, source: computed, description: "Ephemeral computed view; latest snapshot composite score" }
      - { name: network_factor, type: number, source: computed, description: "Ephemeral computed view; 1.0 IN_NETWORK / 0.8 OUT_OF_NETWORK" }
      - { name: match_score, type: number, source: computed, description: "Ephemeral computed view; composite_quality_score * network_factor, 2 dp round_half_up" }
      - { name: rank, type: integer, source: computed, description: "Ephemeral computed view; 1-based position per calculations.provider_match_ranking" }

  - name: ConsentGrant
    parent: null
    common_fields: true
    fields:
      - { name: member_id, type: string, source: system, description: "FK -> Member.id; consenting member (self only)" }
      - { name: scope, type: enum, source: input, description: "RECORD_RETRIEVAL | APPOINTMENT_BOOKING | EMO_REVIEW | BILLING_ADVOCACY" }
      - { name: expires_at, type: string, source: input, description: "ISO 8601 datetime; consent expires when logical clock reaches it" }
      - { name: status, type: enum, source: system, description: "ACTIVE | REVOKED | EXPIRED" }
      - { name: revoked_at, type: string, source: system, description: "ISO 8601 datetime of revocation, null unless REVOKED" }

  - name: NavigationCase
    parent: null
    common_fields: true
    fields:
      - { name: member_id, type: string, source: system, description: "FK -> Member.id; member the intake is for" }
      - { name: question_type, type: enum, source: input, description: "CLINICAL | BENEFIT | COST" }
      - { name: acuity, type: enum, source: input, description: "LOW | MEDIUM | HIGH; required iff question_type == CLINICAL", default: null }
      - { name: estimated_cost_cents, type: integer, source: input, description: "required iff question_type == COST", default: null }
      - { name: routed_discipline, type: enum, source: computed, description: "NURSE | ADVOCATE | PHYSICIAN per calculations.intake_routing" }
      - { name: assigned_user_id, type: string, source: system, description: "X-User-ID of the navigator who started the case" }
      - { name: escalation_count, type: integer, source: system, default: 0, description: "Number of escalations applied" }
      - { name: status, type: enum, source: system, description: "ROUTED | IN_PROGRESS | ESCALATED | RESOLVED | CLOSED" }

  - name: Appointment
    parent: null
    common_fields: true
    fields:
      - { name: member_id, type: string, source: system, description: "FK -> Member.id; patient" }
      - { name: provider_id, type: string, source: input, description: "FK -> Provider.id; booked provider" }
      - { name: navigation_case_id, type: string, source: input, description: "FK -> NavigationCase.id; originating navigation case (steerage attribution link)", default: null }
      - { name: slot_start, type: string, source: input, description: "ISO 8601 datetime; half-open interval lower bound" }
      - { name: slot_end, type: string, source: input, description: "ISO 8601 datetime; half-open interval upper bound (exclusive)" }
      - { name: redirected_from_out_of_network, type: boolean, source: input, default: false, description: "True when the member's original request named an out-of-network provider and navigation steered to this in-network booking" }
      - { name: status, type: enum, source: system, description: "BOOKED | COMPLETED | CANCELLED | NO_SHOW" }
      - { name: booked_by_user_id, type: string, source: system, description: "X-User-ID of the navigator who booked on the member's behalf" }
      - { name: late_cancel, type: boolean, source: computed, default: false, description: "True when cancelled at or after slot_start" }

  - name: RecordRequest
    parent: null
    common_fields: true
    fields:
      - { name: member_id, type: string, source: system, description: "FK -> Member.id; member whose records are retrieved" }
      - { name: provider_id, type: string, source: input, description: "FK -> Provider.id; record custodian" }
      - { name: status, type: enum, source: system, description: "REQUESTED | RECEIVED | FAILED | CANCELLED" }
      - { name: record_pages, type: integer, source: input, description: "page count reported on receipt", default: null }
      - { name: retry_count, type: integer, source: system, default: 0, description: "Number of FAILED -> REQUESTED retries applied" }

  - name: ExpertOpinionCase
    parent: null
    common_fields: true
    fields:
      - { name: member_id, type: string, source: system, description: "FK -> Member.id; patient under review" }
      - { name: navigation_case_id, type: string, source: input, description: "FK -> NavigationCase.id; originating navigation case", default: null }
      - { name: condition_summary, type: string, source: input, description: "Clinical question under expert review" }
      - { name: status, type: enum, source: system, description: "INTAKE | RECORDS_COLLECTION | COMPILING | READY_FOR_REVIEW | IN_REVIEW | CHANGES_REQUESTED | RECOMMENDATION_SUBMITTED | RECORDS_BLOCKED | AUTH_BLOCKED | DELIVERED | WITHDRAWN" }
      - { name: compiler_user_id, type: string, source: system, description: "X-User-ID of the RecordsSpecialist who last compiled the bundle" }
      - { name: reviewer_user_id, type: string, source: system, description: "X-User-ID of the ExpertReviewer holding the review" }
      - { name: recommendation_text, type: string, source: input, description: "Written specialist recommendation", default: null }
      - { name: recommendation_version, type: integer, source: system, default: 0, description: "Increments on every submit-recommendation; supersedes the prior draft" }
      - { name: attached_received_count, type: integer, source: computed, default: 0, description: "Count of OpinionRecordItem whose record_request status == RECEIVED" }

  - name: OpinionRecordItem
    parent: null
    common_fields: true
    fields:
      - { name: opinion_id, type: string, source: system, description: "FK -> ExpertOpinionCase.id; owning opinion case" }
      - { name: record_request_id, type: string, source: input, description: "FK -> RecordRequest.id; attached record request" }
      - { name: attached_by_user_id, type: string, source: system, description: "X-User-ID of attaching RecordsSpecialist" }

  - name: Claim
    parent: null
    common_fields: true
    fields:
      - { name: member_id, type: string, source: input, description: "FK -> Member.id; claimant" }
      - { name: provider_id, type: string, source: input, description: "FK -> Provider.id; rendering provider" }
      - { name: service_date, type: string, source: input, description: "ISO 8601 date of service; drives chronological deductible application" }
      - { name: billed_amount_cents, type: integer, source: input, description: "Total billed charges" }
      - { name: allowed_amount_cents, type: integer, source: input, description: "Plan-allowed amount used for cost share" }
      - { name: lines, type: array, source: input, description: "Array of { line_code: string, billed_cents: integer, schedule_rate: number, error_flag: NONE | DUPLICATE | UPCODING }" }
      - { name: repriced_total_cents, type: integer, source: computed, description: "per calculations.claim_repricing; null until ADJUDICATED" }
      - { name: error_line_count, type: integer, source: computed, default: 0, description: "Count of lines with error_flag != NONE, computed at creation" }
      - { name: deductible_applied_cents, type: integer, source: computed, description: "per calculations.deductible_application; null until ADJUDICATED" }
      - { name: member_responsibility_cents, type: integer, source: computed, description: "deductible + coinsurance at adjudication; null until ADJUDICATED" }
      - { name: status, type: enum, source: system, description: "RECEIVED | ADJUDICATED | VOID" }

  - name: BillingCase
    parent: null
    common_fields: true
    fields:
      - { name: member_id, type: string, source: system, description: "FK -> Member.id; billed member" }
      - { name: claim_id, type: string, source: input, description: "FK -> Claim.id; disputed claim" }
      - { name: status, type: enum, source: system, description: "OPENED | ERROR_IDENTIFIED | NEGOTIATING | SETTLEMENT_PROPOSED | RESOLVED_ACCEPTED | RESOLVED_NO_CHANGE | VOIDED | CLOSED" }
      - { name: provisional_savings_cents, type: integer, source: computed, description: "billed_amount_cents - repriced_total_cents once ERROR_IDENTIFIED; null before" }
      - { name: counter_offer_cents, type: integer, source: input, description: "Provider-facing negotiated amount proposed by the BillingAdvocate", default: null }
      - { name: settled_amount_cents, type: integer, source: system, description: "Equals counter_offer_cents at acceptance; null otherwise" }
      - { name: final_savings_cents, type: integer, source: computed, description: "billed_amount_cents - settled_amount_cents on RESOLVED_ACCEPTED; 0 on RESOLVED_NO_CHANGE; null otherwise" }
      - { name: proposal_count, type: integer, source: system, default: 0, description: "Number of settlement proposals made; cap 3" }

  - name: PlanAuthorization
    parent: null
    common_fields: true
    fields:
      - { name: member_id, type: string, source: system, description: "FK -> Member.id; covered member" }
      - { name: service_code, type: enum, source: input, description: "EXPERT_MEDICAL_OPINION | PROCEDURE | IMAGING" }
      - { name: units, type: integer, source: input, description: "Authorized units (>= 1)" }
      - { name: status, type: enum, source: system, description: "REQUESTED | APPROVED | DENIED | APPEALED | DENIED_FINAL" }
      - { name: denial_reason, type: string, source: input, description: "required on deny", default: null }
      - { name: decided_at, type: string, source: system, description: "ISO 8601 datetime of last plan decision; drives the 30-day appeal window" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Member
    field: eligibility_status
    initial_state: ACTIVE
    terminal_states: []
    transitions:
      - from: ACTIVE
        to: INACTIVE
        trigger: "POST /care/members/{id}/deactivate"
        actor: PlatformAdmin
        preconditions:
          - "eligibility_status == ACTIVE (ERR_INVALID_STATE)"
        side_effects:
          - "increments Member.version by 1"
          - "blocks all new consents, navigation cases, appointments, record requests, expert opinions, billing cases, authorizations for this member (ERR_MEMBER_INELIGIBLE)"
      - from: INACTIVE
        to: ACTIVE
        trigger: "POST /care/members/{id}/reactivate"
        actor: PlatformAdmin
        preconditions:
          - "eligibility_status == INACTIVE (ERR_INVALID_STATE)"
        side_effects:
          - "increments Member.version by 1"

  - entity: CoverageWindow
    field: status
    initial_state: OPEN
    terminal_states: [CLOSED]
    transitions:
      - from: OPEN
        to: CLOSED
        trigger: "POST /care/coverage-windows/{id}/terminate"
        actor: PlatformAdmin
        preconditions:
          - "status == OPEN (ERR_WINDOW_NOT_OPEN)"
          - "terminated_on >= effective_start (ERR_INVALID_REQUEST)"
        side_effects:
          - "effective_end set to terminated_on"
      - from: OPEN
        to: CLOSED
        trigger: "system (automatic when a new CoverageWindow with effective_end == null is created for the same member)"
        actor: system
        preconditions:
          - "new window effective_start > this window effective_start"
        side_effects:
          - "prior OPEN window effective_end set to new effective_start minus 1 day"
          - "increments Member.version by 1 (supersede mutates the member aggregate)"

  - entity: ConsentGrant
    field: status
    initial_state: ACTIVE
    terminal_states: [REVOKED, EXPIRED]
    transitions:
      - from: ACTIVE
        to: REVOKED
        trigger: "POST /care/consents/{id}/revoke"
        actor: Member
        preconditions:
          - "status == ACTIVE (ERR_INVALID_STATE)"
          - "acting member owns the consent (ERR_MEMBER_MISMATCH)"
        side_effects:
          - "revoked_at set to logical clock now"
          - "CASCADE A link 1: if scope == RECORD_RETRIEVAL, every RecordRequest of the member in status REQUESTED -> CANCELLED (per RecordRequest machine)"
      - from: ACTIVE
        to: EXPIRED
        trigger: "system (on any logical clock advance or read: expires_at <= now)"
        actor: system
        preconditions:
          - "expires_at <= current logical clock time (inclusive boundary)"
        side_effects:
          - "CASCADE A link 1 (identical to revoke): RECORD_RETRIEVAL expiry cancels member's REQUESTED RecordRequests"

  - entity: NavigationCase
    field: status
    initial_state: ROUTED
    terminal_states: [CLOSED]
    transitions:
      - from: ROUTED
        to: IN_PROGRESS
        trigger: "POST /care/navigation-cases/{id}/start"
        actor: NurseNavigator
        preconditions:
          - "status == ROUTED (ERR_INVALID_STATE)"
          - "acting role discipline matches routed_discipline (NURSE->NurseNavigator, ADVOCATE->CareAdvocate, PHYSICIAN->PhysicianAdvisor; ERR_DISCIPLINE_MISMATCH)"
        side_effects:
          - "assigned_user_id = X-User-ID"
      - from: IN_PROGRESS
        to: ESCALATED
        trigger: "POST /care/navigation-cases/{id}/escalate"
        actor: NurseNavigator
        preconditions:
          - "status == IN_PROGRESS (ERR_INVALID_STATE)"
        side_effects:
          - "escalation_count += 1"
          - "routed_discipline escalates one level: ADVOCATE->NURSE, NURSE->PHYSICIAN, PHYSICIAN->PHYSICIAN (no-op at top)"
          - "assigned_user_id cleared"
      - from: ESCALATED
        to: IN_PROGRESS
        trigger: "POST /care/navigation-cases/{id}/start"
        actor: NurseNavigator
        preconditions:
          - "status == ESCALATED (ERR_INVALID_STATE)"
          - "acting role discipline matches the (escalated) routed_discipline (ERR_DISCIPLINE_MISMATCH)"
        side_effects:
          - "assigned_user_id = X-User-ID"
      - from: IN_PROGRESS
        to: RESOLVED
        trigger: "POST /care/navigation-cases/{id}/resolve"
        actor: NurseNavigator
        preconditions:
          - "status == IN_PROGRESS (ERR_INVALID_STATE)"
          - "X-User-ID == assigned_user_id (ERR_NOT_ASSIGNED_NAVIGATOR)"
        side_effects: []
      - from: RESOLVED
        to: CLOSED
        trigger: "POST /care/navigation-cases/{id}/close"
        actor: NurseNavigator
        preconditions:
          - "status == RESOLVED (ERR_INVALID_STATE)"
        side_effects: []
      - from: IN_PROGRESS
        to: ESCALATED
        trigger: "system (CASCADE A link 3 / CASCADE B link 2: a linked ExpertOpinionCase entered RECORDS_BLOCKED or AUTH_BLOCKED)"
        actor: system
        preconditions:
          - "case.status == IN_PROGRESS (already-ESCALATED or terminal cases are not mutated)"
        side_effects:
          - "escalation_count += 1; assigned_user_id cleared; routed_discipline escalates one level"

  - entity: Appointment
    field: status
    initial_state: BOOKED
    terminal_states: [COMPLETED, CANCELLED, NO_SHOW]
    transitions:
      - from: BOOKED
        to: BOOKED
        trigger: "POST /care/appointments/{id}/reschedule"
        actor: CareAdvocate
        preconditions:
          - "status == BOOKED (ERR_INVALID_STATE)"
          - "new slot passes overlap and daily-capacity checks (ERR_SLOT_CONFLICT / ERR_PROVIDER_DAY_CAPACITY)"
        side_effects:
          - "slot_start/slot_end replaced; increments Appointment.version by 1"
      - from: BOOKED
        to: CANCELLED
        trigger: "POST /care/appointments/{id}/cancel"
        actor: CareAdvocate
        preconditions:
          - "status == BOOKED (ERR_INVALID_STATE)"
        side_effects:
          - "late_cancel = (logical clock now >= slot_start)"
          - "provider-day BOOKED occupancy decremented by 1 (compensating invariant: book+cancel leaves occupancy unchanged)"
      - from: BOOKED
        to: COMPLETED
        trigger: "POST /care/appointments/{id}/complete"
        actor: NurseNavigator
        preconditions:
          - "status == BOOKED (ERR_INVALID_STATE)"
          - "logical clock now >= slot_end (ERR_APPOINTMENT_NOT_DUE)"
        side_effects: []
      - from: BOOKED
        to: NO_SHOW
        trigger: "POST /care/appointments/{id}/mark-no-show"
        actor: NurseNavigator
        preconditions:
          - "status == BOOKED (ERR_INVALID_STATE)"
          - "logical clock now > slot_end (ERR_APPOINTMENT_NOT_DUE)"
        side_effects: []

  - entity: RecordRequest
    field: status
    initial_state: REQUESTED
    terminal_states: [RECEIVED, CANCELLED]
    transitions:
      - from: REQUESTED
        to: RECEIVED
        trigger: "POST /care/record-requests/{id}/receive"
        actor: RecordsSpecialist
        preconditions:
          - "status == REQUESTED (ERR_INVALID_STATE)"
          - "record_pages >= 1 (ERR_INVALID_REQUEST)"
        side_effects:
          - "recompute attached_received_count on every ExpertOpinionCase that has an OpinionRecordItem for this request"
      - from: REQUESTED
        to: FAILED
        trigger: "POST /care/record-requests/{id}/fail"
        actor: RecordsSpecialist
        preconditions:
          - "status == REQUESTED (ERR_INVALID_STATE)"
        side_effects: []
      - from: FAILED
        to: REQUESTED
        trigger: "POST /care/record-requests/{id}/retry"
        actor: RecordsSpecialist
        preconditions:
          - "status == FAILED (ERR_INVALID_STATE)"
          - "retry_count < 2 (ERR_RETRY_EXHAUSTED)"
          - "member holds ACTIVE RECORD_RETRIEVAL consent (ERR_CONSENT_REQUIRED)"
        side_effects:
          - "retry_count += 1"
      - from: REQUESTED
        to: CANCELLED
        trigger: "system (CASCADE A link 1: member's RECORD_RETRIEVAL consent REVOKED or EXPIRED) or POST /care/record-requests/{id}/cancel"
        actor: system
        preconditions:
          - "status == REQUESTED (RECEIVED/FAILED requests are not cancelled)"
        side_effects:
          - "CASCADE A link 2: for each ExpertOpinionCase of the member in RECORDS_COLLECTION whose attached_received_count < EMO_MIN_RECORDS and which now has zero RecordRequests in REQUESTED: status -> RECORDS_BLOCKED"

  - entity: ExpertOpinionCase
    field: status
    initial_state: INTAKE
    terminal_states: [DELIVERED, WITHDRAWN]
    transitions:
      - from: INTAKE
        to: RECORDS_COLLECTION
        trigger: "system (first successful POST /care/expert-opinions/{id}/attach-records)"
        actor: system
        preconditions: []
        side_effects: []
      - from: INTAKE
        to: AUTH_BLOCKED
        trigger: "system (CASCADE B link 1: member's EXPERT_MEDICAL_OPINION PlanAuthorization REQUESTED->DENIED or APPEALED->DENIED_FINAL while this case awaits authorization)"
        actor: system
        preconditions:
          - "case.status == INTAKE"
        side_effects:
          - "CASCADE B link 2: linked NavigationCase (navigation_case_id) in IN_PROGRESS -> ESCALATED"
      - from: AUTH_BLOCKED
        to: INTAKE
        trigger: "system (member's EXPERT_MEDICAL_OPINION PlanAuthorization -> APPROVED)"
        actor: system
        preconditions:
          - "case.status == AUTH_BLOCKED"
        side_effects: []
      - from: RECORDS_COLLECTION
        to: COMPILING
        trigger: "POST /care/expert-opinions/{id}/compile"
        actor: RecordsSpecialist
        preconditions:
          - "status == RECORDS_COLLECTION or CHANGES_REQUESTED (ERR_INVALID_STATE)"
          - "member holds ACTIVE EMO_REVIEW consent (ERR_CONSENT_REQUIRED)"
        side_effects:
          - "compiler_user_id = X-User-ID"
      - from: CHANGES_REQUESTED
        to: COMPILING
        trigger: "POST /care/expert-opinions/{id}/compile"
        actor: RecordsSpecialist
        preconditions:
          - "same as RECORDS_COLLECTION -> COMPILING"
        side_effects:
          - "compiler_user_id = X-User-ID (revision loop: cyclic)"
      - from: RECORDS_COLLECTION
        to: RECORDS_BLOCKED
        trigger: "system (CASCADE A link 2 via RecordRequest CANCELLED)"
        actor: system
        preconditions:
          - "attached_received_count < EMO_MIN_RECORDS and zero RecordRequests in REQUESTED"
        side_effects:
          - "CASCADE A link 3: linked NavigationCase in IN_PROGRESS -> ESCALATED"
      - from: RECORDS_BLOCKED
        to: RECORDS_COLLECTION
        trigger: "system (a new RecordRequest is created for the member while case is RECORDS_BLOCKED)"
        actor: system
        preconditions: []
        side_effects: []
      - from: COMPILING
        to: READY_FOR_REVIEW
        trigger: "POST /care/expert-opinions/{id}/submit-for-review"
        actor: RecordsSpecialist
        preconditions:
          - "status == COMPILING (ERR_INVALID_STATE)"
          - "X-User-ID == compiler_user_id (ERR_NOT_ASSIGNED_COMPILER)"
          - "attached_received_count >= EMO_MIN_RECORDS (3; ERR_RECORDS_INSUFFICIENT)"
          - "member has a PlanAuthorization with service_code == EXPERT_MEDICAL_OPINION in status APPROVED (ERR_AUTHORIZATION_REQUIRED)"
        side_effects: []
      - from: READY_FOR_REVIEW
        to: IN_REVIEW
        trigger: "POST /care/expert-opinions/{id}/claim-review"
        actor: ExpertReviewer
        preconditions:
          - "status == READY_FOR_REVIEW (ERR_INVALID_STATE)"
          - "X-User-ID != compiler_user_id (segregation of duties: ERR_SEGREGATION_OF_DUTIES)"
        side_effects:
          - "reviewer_user_id = X-User-ID"
      - from: IN_REVIEW
        to: CHANGES_REQUESTED
        trigger: "POST /care/expert-opinions/{id}/request-changes"
        actor: ExpertReviewer
        preconditions:
          - "status == IN_REVIEW (ERR_INVALID_STATE)"
          - "X-User-ID == reviewer_user_id (ERR_NOT_ASSIGNED_REVIEWER)"
        side_effects: []
      - from: IN_REVIEW
        to: RECOMMENDATION_SUBMITTED
        trigger: "POST /care/expert-opinions/{id}/submit-recommendation"
        actor: ExpertReviewer
        preconditions:
          - "status == IN_REVIEW (ERR_INVALID_STATE)"
          - "X-User-ID == reviewer_user_id (ERR_NOT_ASSIGNED_REVIEWER)"
          - "expected_opinion_version == ExpertOpinionCase.version (OCC: ERR_STALE_VERSION)"
        side_effects:
          - "recommendation_text stored; recommendation_version += 1 (supersedes prior draft)"
          - "increments ExpertOpinionCase.version by 1"
      - from: RECOMMENDATION_SUBMITTED
        to: DELIVERED
        trigger: "POST /care/expert-opinions/{id}/deliver"
        actor: Member
        preconditions:
          - "status == RECOMMENDATION_SUBMITTED (ERR_INVALID_STATE)"
          - "acting member is the case member (ERR_MEMBER_MISMATCH)"
        side_effects: []
      - from: "INTAKE | RECORDS_COLLECTION | COMPILING | READY_FOR_REVIEW | IN_REVIEW | CHANGES_REQUESTED | RECOMMENDATION_SUBMITTED | RECORDS_BLOCKED | AUTH_BLOCKED"
        to: WITHDRAWN
        trigger: "POST /care/expert-opinions/{id}/withdraw"
        actor: Member
        preconditions:
          - "status not in {DELIVERED, WITHDRAWN} (ERR_INVALID_STATE)"
          - "acting member is the case member or PlatformAdmin (ERR_MEMBER_MISMATCH)"
        side_effects:
          - "reviewer/compiler assignments released (fields nulled)"

  - entity: Claim
    field: status
    initial_state: RECEIVED
    terminal_states: [VOID]
    transitions:
      - from: RECEIVED
        to: ADJUDICATED
        trigger: "POST /care/claims/{id}/adjudicate"
        actor: PlanAdministrator
        preconditions:
          - "status == RECEIVED (ERR_CLAIM_ALREADY_ADJUDICATED)"
        side_effects:
          - "run calculations.claim_repricing then calculations.deductible_application (order pinned)"
          - "Member.deductible_used_cents += deductible_applied_cents; Member.oop_used_cents += member_responsibility_cents"
          - "increments Member.version by 1"
      - from: ADJUDICATED
        to: VOID
        trigger: "POST /care/claims/{id}/void"
        actor: PlanAdministrator
        preconditions:
          - "status == ADJUDICATED (ERR_INVALID_STATE)"
        side_effects:
          - "Member.deductible_used_cents -= deductible_applied_cents; Member.oop_used_cents -= member_responsibility_cents (compensating invariant: adjudicate+void restores accumulators exactly)"
          - "linked BillingCase in OPENED/ERROR_IDENTIFIED/NEGOTIATING/SETTLEMENT_PROPOSED -> VOIDED; RESOLVED_ACCEPTED/RESOLVED_NO_CHANGE/CLOSED cases unchanged"
          - "increments Member.version by 1"

  - entity: BillingCase
    field: status
    initial_state: OPENED
    terminal_states: [CLOSED, VOIDED]
    transitions:
      - from: OPENED
        to: ERROR_IDENTIFIED
        trigger: "POST /care/billing-cases/{id}/identify-errors"
        actor: BillingAdvocate
        preconditions:
          - "status == OPENED (ERR_INVALID_STATE)"
          - "claim.status == ADJUDICATED (ERR_CLAIM_NOT_ADJUDICATED)"
          - "claim.error_line_count >= 1 (ERR_NO_LINE_ERRORS)"
        side_effects:
          - "provisional_savings_cents = claim.billed_amount_cents - claim.repriced_total_cents"
      - from: ERROR_IDENTIFIED
        to: SETTLEMENT_PROPOSED
        trigger: "POST /care/billing-cases/{id}/propose-settlement"
        actor: BillingAdvocate
        preconditions:
          - "status == ERROR_IDENTIFIED or NEGOTIATING (ERR_INVALID_STATE)"
          - "proposal_count < 3 (ERR_NEGOTIATION_ROUND_EXCEEDED)"
          - "counter_offer_cents < claim.billed_amount_cents (ERR_SETTLEMENT_EXCEEDS_BILLED)"
        side_effects:
          - "proposal_count += 1"
      - from: NEGOTIATING
        to: SETTLEMENT_PROPOSED
        trigger: "POST /care/billing-cases/{id}/propose-settlement"
        actor: BillingAdvocate
        preconditions:
          - "same as ERROR_IDENTIFIED -> SETTLEMENT_PROPOSED (negotiation rounds: cyclic)"
        side_effects:
          - "proposal_count += 1"
      - from: SETTLEMENT_PROPOSED
        to: RESOLVED_ACCEPTED
        trigger: "POST /care/billing-cases/{id}/accept-settlement"
        actor: Member
        preconditions:
          - "status == SETTLEMENT_PROPOSED (ERR_INVALID_STATE)"
          - "acting member owns the case (ERR_MEMBER_MISMATCH)"
        side_effects:
          - "settled_amount_cents = counter_offer_cents"
          - "final_savings_cents = claim.billed_amount_cents - settled_amount_cents"
      - from: SETTLEMENT_PROPOSED
        to: NEGOTIATING
        trigger: "POST /care/billing-cases/{id}/reject-settlement"
        actor: Member
        preconditions:
          - "status == SETTLEMENT_PROPOSED (ERR_INVALID_STATE)"
          - "acting member owns the case (ERR_MEMBER_MISMATCH)"
        side_effects:
          - "counter_offer_cents retained as last rejected offer"
      - from: NEGOTIATING
        to: RESOLVED_NO_CHANGE
        trigger: "POST /care/billing-cases/{id}/abandon"
        actor: BillingAdvocate
        preconditions:
          - "status == NEGOTIATING (ERR_INVALID_STATE)"
        side_effects:
          - "final_savings_cents = 0"
      - from: RESOLVED_ACCEPTED
        to: CLOSED
        trigger: "POST /care/billing-cases/{id}/close"
        actor: BillingAdvocate
        preconditions:
          - "status == RESOLVED_ACCEPTED or RESOLVED_NO_CHANGE (ERR_INVALID_STATE)"
        side_effects: []
      - from: RESOLVED_NO_CHANGE
        to: CLOSED
        trigger: "POST /care/billing-cases/{id}/close"
        actor: BillingAdvocate
        preconditions:
          - "same as RESOLVED_ACCEPTED -> CLOSED"
        side_effects: []
      - from: "OPENED | ERROR_IDENTIFIED | NEGOTIATING | SETTLEMENT_PROPOSED"
        to: VOIDED
        trigger: "system (linked Claim ADJUDICATED -> VOID)"
        actor: system
        preconditions:
          - "linked claim entered VOID"
        side_effects:
          - "provisional/final savings fields nulled"

  - entity: PlanAuthorization
    field: status
    initial_state: REQUESTED
    terminal_states: [APPROVED, DENIED_FINAL]
    transitions:
      - from: REQUESTED
        to: APPROVED
        trigger: "POST /care/authorizations/{id}/approve"
        actor: PlanAdministrator
        preconditions:
          - "status == REQUESTED or APPEALED (ERR_INVALID_STATE)"
        side_effects:
          - "decided_at = logical clock now"
          - "member's ExpertOpinionCase in AUTH_BLOCKED -> INTAKE (when service_code == EXPERT_MEDICAL_OPINION)"
      - from: APPEALED
        to: APPROVED
        trigger: "POST /care/authorizations/{id}/approve"
        actor: PlanAdministrator
        preconditions:
          - "same as REQUESTED -> APPROVED"
        side_effects:
          - "same as REQUESTED -> APPROVED"
      - from: REQUESTED
        to: DENIED
        trigger: "POST /care/authorizations/{id}/deny"
        actor: PlanAdministrator
        preconditions:
          - "status == REQUESTED (ERR_INVALID_STATE)"
        side_effects:
          - "decided_at = logical clock now; denial_reason stored"
          - "CASCADE B link 1 (service_code == EXPERT_MEDICAL_OPINION): member's ExpertOpinionCase in INTAKE -> AUTH_BLOCKED"
      - from: DENIED
        to: APPEALED
        trigger: "POST /care/authorizations/{id}/appeal"
        actor: Member
        preconditions:
          - "status == DENIED (ERR_INVALID_STATE)"
          - "acting member owns the authorization (ERR_MEMBER_MISMATCH)"
          - "logical clock now <= decided_at + 30 days (ERR_APPEAL_WINDOW_CLOSED)"
        side_effects: []
      - from: APPEALED
        to: DENIED_FINAL
        trigger: "POST /care/authorizations/{id}/deny"
        actor: PlanAdministrator
        preconditions:
          - "status == APPEALED (ERR_INVALID_STATE)"
        side_effects:
          - "decided_at = logical clock now"
          - "CASCADE B link 1 fires again for members' INTAKE ExpertOpinionCases"

# =============================================================================
# §1.2.1 Concurrency Rules (true races only; OCC on parent version)
# =============================================================================
concurrency_rules:
  - rule_id: coverage-window-supersede-stale-member
    parent_entity: Member
    write_endpoint: "POST /care/members/{id}/coverage-windows"
    occ_field: expected_member_version
    description: |
      Creating an open-ended CoverageWindow legitimately supersedes the
      member's prior OPEN window (auto-closes it). A creation request carrying
      an expected_member_version below the member's current version is
      rejected: the client's view of the member's coverage is stale because an
      earlier window creation has already advanced the aggregate.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: recommendation-supersede-stale-opinion
    parent_entity: ExpertOpinionCase
    write_endpoint: "POST /care/expert-opinions/{id}/submit-recommendation"
    occ_field: expected_opinion_version
    description: |
      Submitting a recommendation legitimately supersedes the prior draft
      (recommendation_version += 1). A submission carrying an
      expected_opinion_version below the case's current version is rejected:
      the reviewer's view is stale because an earlier submission already
      advanced the case.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: intake_routing
    trigger: "NavigationCase creation"
    algorithm: threshold
    formula: |
      if question_type == CLINICAL:
          routed_discipline = PHYSICIAN if acuity == HIGH
                              else (PHYSICIAN if member.relationship == CHILD else NURSE)
      elif question_type == BENEFIT:
          routed_discipline = ADVOCATE
      else:  # COST
          routed_discipline = NURSE if estimated_cost_cents >= COST_ESCALATION_THRESHOLD_CENTS
                              else ADVOCATE
      Boundary: estimated_cost_cents exactly == 500000 routes to NURSE (>=, not >).
    input_set: "the new NavigationCase plus its Member.relationship"
    constants:
      COST_ESCALATION_THRESHOLD_CENTS: 500000
    precision: "integer cents; no rounding"

  - name: provider_quality_score
    trigger: "QualitySnapshot creation"
    algorithm: weighted_scoring
    formula: |
      raw = W_OUTCOME * outcome_score + W_COST * cost_efficiency_score + W_ACCESS * access_score
      if claims_volume >= QUALITY_VOLUME_THRESHOLD:
          composite = raw
      else:
          composite = (claims_volume / QUALITY_VOLUME_THRESHOLD) * raw
                    + (1 - claims_volume / QUALITY_VOLUME_THRESHOLD) * NETWORK_MEAN_QUALITY
      composite_quality_score = round_half_up(composite, 2)
      Boundary: claims_volume exactly == 30 gets full confidence (>=, not >).
    input_set: "the new QualitySnapshot's three scores and claims_volume"
    constants:
      W_OUTCOME: 0.5
      W_COST: 0.3
      W_ACCESS: 0.2
      QUALITY_VOLUME_THRESHOLD: 30
      NETWORK_MEAN_QUALITY: 70.0
    precision: "2 decimal places, round_half_up"

  - name: provider_match_ranking
    trigger: "GET /care/members/{id}/provider-matches"
    algorithm: weighted_scoring
    formula: |
      Candidate set (eligibility filter): Providers with specialty == requested specialty
      AND at least one QualitySnapshot; each candidate contributes its snapshot with the
      LATEST period_end.
      network_factor = 1.0 if network_status == IN_NETWORK else OON_NETWORK_FACTOR
      match_score = round_half_up(composite_quality_score * network_factor, 2)
      Ranking expression: match_score DESC;
      tie-break 1: latest snapshot period_end DESC;
      tie-break 2: Provider.created_at ASC (never id).
      Fallback: empty candidate set -> ERR_NO_PROVIDER_MATCH (422).
      rank is 1-based position in the final ordering.
    input_set: "all Providers with the requested specialty and their latest QualitySnapshots"
    constants:
      OON_NETWORK_FACTOR: 0.8
    precision: "2 decimal places, round_half_up"

  - name: claim_repricing
    trigger: "Claim adjudication (runs BEFORE deductible_application — order pinned)"
    algorithm: tiered_pricing
    formula: |
      For each line in claim.lines, in array order:
        if error_flag == DUPLICATE:   adjusted_cents = 0
        elif error_flag == UPCODING:  adjusted_cents = round_half_up(billed_cents * schedule_rate, 0)
        else:                          adjusted_cents = billed_cents
      repriced_total_cents = sum of the PER-LINE rounded adjusted_cents.
      ROUNDING ORDER PINNED: round each line to whole cents first, then sum.
      Summing unrounded values then rounding once is FORBIDDEN (produces different cents).
      Example divergence: three lines of billed_cents=777 with schedule_rate=0.666 ->
      per-line 517 x 3 = 1551, whereas sum-then-round yields 1552.
    input_set: "the Claim's lines array"
    constants: {}
    precision: "whole cents per line, round_half_up, then integer sum"

  - name: deductible_application
    trigger: "Claim adjudication (runs AFTER claim_repricing — order pinned)"
    algorithm: chronological
    formula: |
      Claims of a member apply against the deductible in service_date ASC order
      (tie-break: Claim.created_at ASC, never id). On adjudication of THIS claim:
        remaining = max(0, member.deductible_limit_cents - member.deductible_used_cents)
        deductible_applied_cents = min(remaining, allowed_amount_cents)
        coinsurance_cents = round_half_up(COINSURANCE_RATE * (allowed_amount_cents - deductible_applied_cents), 0)
        member_responsibility_cents = deductible_applied_cents + coinsurance_cents
      Boundary: when deductible_used_cents is already exactly == deductible_limit_cents,
      deductible_applied_cents == 0 (saturated means saturated; >= semantics).
      member_responsibility_cents is NOT capped by oop_max_cents here; the cap applies
      only in member_cost_share_estimate (prospective) — adjudicated values are factual.
    input_set: "this Claim + Member accumulators at adjudication time"
    constants:
      COINSURANCE_RATE: 0.2
    precision: "whole cents, round_half_up"

  - name: member_cost_share_estimate
    trigger: "GET /care/members/{id}/cost-share-estimate"
    algorithm: constraint_propagation
    formula: |
      EVALUATION ORDER PINNED (circular-looking, resolved by ordering):
      (1) read PERSISTED accumulators only: remaining_deductible =
          max(0, deductible_limit_cents - deductible_used_cents); the estimate itself
          never mutates accumulators and never feeds back into them.
      (2) if provider.network_status == OUT_OF_NETWORK:
            member_responsibility_cents = round_half_up(OON_COINSURANCE_RATE * allowed_amount_cents, 0)
            (no deductible offset, no oop cap)
      (3) else (IN_NETWORK):
            deductible_portion = min(remaining_deductible, allowed_amount_cents)
            coinsurance_portion = round_half_up(COINSURANCE_RATE * (allowed_amount_cents - deductible_portion), 0)
            uncapped = deductible_portion + coinsurance_portion
            member_responsibility_cents = min(uncapped, max(0, oop_max_cents - oop_used_cents))
            oop_capped = (member_responsibility_cents < uncapped)
    input_set: "Member accumulators + target Provider.network_status + requested allowed_amount_cents"
    constants:
      COINSURANCE_RATE: 0.2
      OON_COINSURANCE_RATE: 0.4
    precision: "whole cents, round_half_up"

  - name: billing_savings_variants
    trigger: "BillingCase identify-errors (provisional) and accept/abandon (final)"
    algorithm: aggregation
    formula: |
      provisional_savings_cents = claim.billed_amount_cents - claim.repriced_total_cents
          (computed at ERROR_IDENTIFIED; the system-priced fair-value view)
      final_savings_cents = claim.billed_amount_cents - settled_amount_cents
          (computed at RESOLVED_ACCEPTED; the negotiated-outcome view)
      On RESOLVED_NO_CHANGE: final_savings_cents = 0.
      The two variants routinely differ for identical claim data whenever the
      negotiated settlement differs from the system repricing.
    input_set: "the linked Claim and the BillingCase settlement fields"
    constants: {}
    precision: "integer cents"
    variants:
      - name: provisional
        when: "status == ERROR_IDENTIFIED / NEGOTIATING / SETTLEMENT_PROPOSED"
        difference: "uses claim.repriced_total_cents (schedule-based reprice)"
      - name: final
        when: "status == RESOLVED_ACCEPTED"
        difference: "uses settled_amount_cents actually accepted by the member"

  - name: steerage_savings_attribution
    trigger: "GET /care/employers/{id}/utilization-report"
    algorithm: aggregation
    formula: |
      Base set: Appointments with status in {BOOKED, COMPLETED} joined to Providers
      with network_status == IN_NETWORK, for members of this employer, booked via a
      navigation case (navigation_case_id IS NOT NULL).
      naive variant:      naive_cents      = count(base set) * employer.avg_in_out_cost_delta_cents
      counterfactual:     counter_cents    = count(base set where redirected_from_out_of_network == true)
                                             * employer.avg_in_out_cost_delta_cents
      The two variants differ whenever any in-network navigation-booked appointment
      was NOT a redirection. Both are reported side by side.
    input_set: "Appointments of the employer's members per status/network filter above"
    constants: {}
    precision: "integer cents"
    variants:
      - name: naive
        when: "always reported"
        difference: "credits every in-network navigation-booked appointment"
      - name: counterfactual
        when: "always reported"
        difference: "credits only appointments with redirected_from_out_of_network == true"

  - name: consent_expiration
    trigger: "logical clock advance (POST /_clock/set_current_utc) and on consent reads"
    algorithm: threshold
    formula: |
      For each ConsentGrant in ACTIVE: if expires_at <= now -> EXPIRED.
      Boundary INCLUSIVE: expires_at exactly == now expires the consent.
    input_set: "all ConsentGrants in ACTIVE"
    constants: {}
    precision: "ISO 8601 datetime comparison, inclusive"

  - name: utilization_aggregation
    trigger: "GET /care/employers/{id}/utilization-report"
    algorithm: aggregation
    formula: |
      members_active = count of the employer's Members with eligibility_status == ACTIVE
      navigation_cases_total = count of NavigationCases of the employer's members (all statuses)
      navigation_cases_closed = count with NavigationCase.status == CLOSED
      emos_delivered = count of ExpertOpinionCases with status == DELIVERED
      billing_savings_provisional_cents = sum of provisional_savings_cents over BillingCases
          in {ERROR_IDENTIFIED, NEGOTIATING, SETTLEMENT_PROPOSED, RESOLVED_ACCEPTED, CLOSED}
          whose claim is not VOID (VOIDED cases excluded)
      billing_savings_final_cents = sum of final_savings_cents over BillingCases in
          {RESOLVED_ACCEPTED, CLOSED} (RESOLVED_NO_CHANGE contributes 0)
      steerage_naive_cents / steerage_counterfactual_cents per steerage_savings_attribution
      total_attributed_savings_cents = billing_savings_final_cents + steerage_counterfactual_cents
    input_set: "all entities of the employer's members with the status filters above"
    constants: {}
    precision: "integer cents"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - { priority: 1, category: auth, check: "X-User-Role and X-User-ID headers present and role is a declared role", error_id: ERR_UNAUTHENTICATED, http_status: 401, applies_to: "all" }
  - { priority: 2, category: auth, check: "Role is permitted on this endpoint per §1.5 roles (ERR_UNAUTHORIZED_ROLE); entity-backed Member role may only touch own resources — path member id == X-User-ID, or the path member's subscriber_id == X-User-ID for dependents (ERR_MEMBER_MISMATCH)", error_id: ERR_UNAUTHORIZED_ROLE, http_status: 403, applies_to: "all" }
  - { priority: 3, category: existence, check: "Request body well-formed: required fields present, types and enum values valid, conditional inputs present (acuity iff CLINICAL, estimated_cost_cents iff COST, subscriber_id iff relationship != SELF, denial_reason on deny)", error_id: ERR_INVALID_REQUEST, http_status: 400, applies_to: "all" }
  - { priority: 4, category: existence, check: "Path and body references resolve, validated left-to-right (employer, member, provider, case, claim, ...)", error_id: ERR_NOT_FOUND, http_status: 404, applies_to: "all resource endpoints" }
  - { priority: 5, category: state, check: "Member eligibility_status == ACTIVE before creating consents, navigation cases, appointments, record requests, expert opinions, billing cases, authorizations", error_id: ERR_MEMBER_INELIGIBLE, http_status: 409, applies_to: "member-scoped creation endpoints" }
  - { priority: 6, category: state, check: "Target entity is in a valid from-state for the requested transition (state machine precondition violations)", error_id: ERR_INVALID_STATE, http_status: 409, applies_to: "all action endpoints" }
  - { priority: 7, category: business_safety, check: "Member holds an ACTIVE ConsentGrant of the required scope: APPOINTMENT_BOOKING for appointment create/reschedule, RECORD_RETRIEVAL for record-request create/retry, EMO_REVIEW for expert-opinion create/compile, BILLING_ADVOCACY for billing-case create", error_id: ERR_CONSENT_REQUIRED, http_status: 409, applies_to: "consent-gated endpoints" }
  - { priority: 8, category: business_safety, check: "Segregation of duties: ExpertReviewer claiming review must not equal compiler_user_id; assigned-user checks (navigator/reviewer/compiler) on assignment-bound actions", error_id: ERR_SEGREGATION_OF_DUTIES, http_status: 403, applies_to: "POST /care/expert-opinions/{id}/claim-review" }
  - { priority: 9, category: business_constraint, check: "At most one ACTIVE ConsentGrant per (member_id, scope)", error_id: ERR_CONSENT_ALREADY_ACTIVE, http_status: 409, applies_to: "POST /care/members/{id}/consents" }
  - { priority: 10, category: business_constraint, check: "CoverageWindow CLOSED-interval overlap: new [effective_start, effective_end] must not share any day with an existing window of the member (contiguity: existing.end + 1 day == new.start is allowed)", error_id: ERR_COVERAGE_OVERLAP, http_status: 409, applies_to: "POST /care/members/{id}/coverage-windows" }
  - { priority: 11, category: business_constraint, check: "Appointment half-open slot overlap on the same provider: new [slot_start, slot_end) conflicts with an existing BOOKED slot iff slot_start < existing.end AND existing.start < slot_end; adjacency (end == start) is allowed", error_id: ERR_SLOT_CONFLICT, http_status: 409, applies_to: "appointment create/reschedule" }
  - { priority: 12, category: business_constraint, check: "Provider daily capacity: count of BOOKED appointments on the provider for the UTC calendar date of slot_start must be < PROVIDER_DAILY_CAPACITY (8) — the 8th booking succeeds, the 9th fails", error_id: ERR_PROVIDER_DAY_CAPACITY, http_status: 422, applies_to: "appointment create/reschedule" }
  - { priority: 13, category: business_constraint, check: "QualitySnapshot uniqueness: one snapshot per (provider_id, period_start)", error_id: ERR_DUPLICATE_SNAPSHOT, http_status: 409, applies_to: "POST /care/providers/{id}/quality-snapshots" }
  - { priority: 14, category: business_constraint, check: "At most one non-terminal PlanAuthorization per (member_id, service_code): an existing REQUESTED or APPEALED authorization blocks a new create", error_id: ERR_DUPLICATE_AUTHORIZATION, http_status: 409, applies_to: "POST /care/members/{id}/authorizations" }
  - { priority: 15, category: business_constraint, check: "Member external_member_ref unique within employer", error_id: ERR_DUPLICATE_MEMBER_REF, http_status: 409, applies_to: "POST /care/employers/{id}/members" }
  - { priority: 16, category: business_referential, check: "attach-records: record request exists, belongs to the opinion's member, status == RECEIVED, and is not already attached to another ExpertOpinionCase not in {DELIVERED, WITHDRAWN}", error_id: ERR_RECORD_NOT_READY, http_status: 409, applies_to: "POST /care/expert-opinions/{id}/attach-records" }
  - { priority: 17, category: business_referential, check: "submit-for-review: attached_received_count >= EMO_MIN_RECORDS (3)", error_id: ERR_RECORDS_INSUFFICIENT, http_status: 422, applies_to: "POST /care/expert-opinions/{id}/submit-for-review" }
  - { priority: 18, category: business_referential, check: "submit-for-review: member holds PlanAuthorization service_code == EXPERT_MEDICAL_OPINION in APPROVED", error_id: ERR_AUTHORIZATION_REQUIRED, http_status: 409, applies_to: "POST /care/expert-opinions/{id}/submit-for-review" }
  - { priority: 19, category: state, check: "Claim must be ADJUDICATED for billing identify-errors", error_id: ERR_CLAIM_NOT_ADJUDICATED, http_status: 409, applies_to: "POST /care/billing-cases/{id}/identify-errors" }
  - { priority: 20, category: business_fiscal, check: "BillingCase requires claim.error_line_count >= 1 to identify errors", error_id: ERR_NO_LINE_ERRORS, http_status: 422, applies_to: "POST /care/billing-cases/{id}/identify-errors" }
  - { priority: 21, category: business_fiscal, check: "counter_offer_cents < claim.billed_amount_cents (a settlement at or above billed saves nothing)", error_id: ERR_SETTLEMENT_EXCEEDS_BILLED, http_status: 422, applies_to: "POST /care/billing-cases/{id}/propose-settlement" }
  - { priority: 22, category: business_fiscal, check: "proposal_count < 3 per BillingCase", error_id: ERR_NEGOTIATION_ROUND_EXCEEDED, http_status: 422, applies_to: "POST /care/billing-cases/{id}/propose-settlement" }
  - { priority: 23, category: business_temporal, check: "complete requires logical clock now >= slot_end; mark-no-show requires now > slot_end", error_id: ERR_APPOINTMENT_NOT_DUE, http_status: 409, applies_to: "appointment complete / mark-no-show" }
  - { priority: 24, category: business_temporal, check: "Appeal window: logical clock now <= decided_at + 30 days", error_id: ERR_APPEAL_WINDOW_CLOSED, http_status: 422, applies_to: "POST /care/authorizations/{id}/appeal" }
  - { priority: 25, category: state, check: "OCC: expected_member_version == Member.version on coverage-window create; expected_opinion_version == ExpertOpinionCase.version on submit-recommendation", error_id: ERR_STALE_VERSION, http_status: 412, applies_to: "OCC-guarded endpoints (evaluated after state checks, before mutation)" }

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # --- logical clock (test-driving) ---
  - { method: POST, path: "/_clock/set_current_utc", description: "Set the logical clock. Server default before any call: 2026-09-01T00:00:00Z (never falls back to wall-clock). Advancing the clock expires consents per calculations.consent_expiration.", roles: [PlatformAdmin], code: 200, input: [to_iso8601], output: { current_utc: string }, side_effects: ["consent expiry sweep"] }

  # --- Employer ---
  - { method: POST, path: "/care/employers", description: "Create an employer account", roles: [PlatformAdmin], code: 201, input: [name, pepm_fee_cents, avg_in_out_cost_delta_cents, emo_benefit_enabled], output: Employer, side_effects: [] }
  - { method: GET, path: "/care/employers/{id}", description: "Get an employer", roles: [PlatformAdmin, EmployerAdmin], code: 200, input: [], output: Employer, side_effects: [] }
  - { method: GET, path: "/care/employers/{id}/members", description: "List members of an employer (FK reverse reachability for Member.employer_id)", roles: [PlatformAdmin, EmployerAdmin], code: 200, input: ["eligibility_status?", "relationship?", "limit?", "offset?"], output: "Member[]", side_effects: [] }
  - { method: GET, path: "/care/employers/{id}/utilization-report", description: "Computed employer report: utilization counts plus naive/counterfactual steerage savings and billing savings attribution", roles: [EmployerAdmin, PlatformAdmin], code: 200, input: [], output: { members_active: integer, navigation_cases_total: integer, navigation_cases_closed: integer, emos_delivered: integer, billing_savings_provisional_cents: integer, billing_savings_final_cents: integer, steerage_naive_cents: integer, steerage_counterfactual_cents: integer, total_attributed_savings_cents: integer }, side_effects: [] }

  # --- Member ---
  - { method: POST, path: "/care/employers/{id}/members", description: "Load a member from the employer eligibility file", roles: [PlatformAdmin], code: 201, input: [full_name, date_of_birth, relationship, external_member_ref, deductible_limit_cents, oop_max_cents, "subscriber_id?"], output: Member, side_effects: ["eligibility_status = ACTIVE, accumulators 0"] }
  - { method: GET, path: "/care/members/{id}", description: "Get a member", roles: [PlatformAdmin, EmployerAdmin, Member, NurseNavigator, CareAdvocate, PhysicianAdvisor, RecordsSpecialist, ExpertReviewer, BillingAdvocate, PlanAdministrator], code: 200, input: [], output: Member, side_effects: [] }
  - { method: GET, path: "/care/members/{id}/dependents", description: "List dependents (FK reverse reachability for Member.subscriber_id)", roles: [PlatformAdmin, EmployerAdmin, Member, NurseNavigator, CareAdvocate], code: 200, input: ["limit?", "offset?"], output: "Member[]", side_effects: [] }
  - { method: POST, path: "/care/members/{id}/deactivate", description: "Deactivate member eligibility", roles: [PlatformAdmin], code: 200, input: [], output: Member, side_effects: ["eligibility_status -> INACTIVE; increments Member.version by 1"] }
  - { method: POST, path: "/care/members/{id}/reactivate", description: "Reactivate member eligibility", roles: [PlatformAdmin], code: 200, input: [], output: Member, side_effects: ["eligibility_status -> ACTIVE; increments Member.version by 1"] }

  # --- CoverageWindow ---
  - { method: POST, path: "/care/members/{id}/coverage-windows", description: "Open a coverage window; an open-ended (effective_end null) window supersedes and auto-closes the member's prior OPEN window", roles: [PlatformAdmin], code: 201, input: [coverage_tier, effective_start, expected_member_version, "effective_end?"], output: CoverageWindow, side_effects: ["overlap check (CLOSED interval semantics)", "open-ended create closes prior OPEN window", "increments Member.version by 1"] }
  - { method: GET, path: "/care/members/{id}/coverage-windows", description: "List member coverage windows", roles: [PlatformAdmin, EmployerAdmin, Member, CareAdvocate], code: 200, input: ["status?", "limit?", "offset?"], output: "CoverageWindow[]", side_effects: [] }
  - { method: POST, path: "/care/coverage-windows/{id}/terminate", description: "Close a coverage window early", roles: [PlatformAdmin], code: 200, input: [terminated_on], output: CoverageWindow, side_effects: ["status -> CLOSED, effective_end = terminated_on"] }

  # --- Provider / QualitySnapshot ---
  - { method: POST, path: "/care/providers", description: "Register a provider", roles: [PlatformAdmin], code: 201, input: [name, specialty, network_status], output: Provider, side_effects: [] }
  - { method: GET, path: "/care/providers/{id}", description: "Get a provider", roles: [PlatformAdmin, EmployerAdmin, Member, NurseNavigator, CareAdvocate, PhysicianAdvisor], code: 200, input: [], output: Provider, side_effects: [] }
  - { method: POST, path: "/care/providers/{id}/quality-snapshots", description: "Publish a claims-derived quality snapshot; composite_quality_score computed per calculations.provider_quality_score", roles: [PlatformAdmin], code: 201, input: [period_start, period_end, outcome_score, cost_efficiency_score, access_score, claims_volume], output: QualitySnapshot, side_effects: ["composite_quality_score computed"] }
  - { method: GET, path: "/care/providers/{id}/quality-snapshots", description: "List a provider's quality snapshots", roles: [PlatformAdmin, NurseNavigator, CareAdvocate, PhysicianAdvisor, Member], code: 200, input: ["limit?", "offset?"], output: "QualitySnapshot[]", side_effects: [] }
  - { method: GET, path: "/care/members/{id}/provider-matches", description: "Ranked provider match list for a specialty per calculations.provider_match_ranking", roles: [Member, NurseNavigator, CareAdvocate, PhysicianAdvisor], code: 200, input: [specialty, "limit?", "offset?"], output: "ProviderMatch[]", side_effects: [] }

  # --- ConsentGrant ---
  - { method: POST, path: "/care/members/{id}/consents", description: "Capture member consent for a scope", roles: [Member], code: 201, input: [scope, expires_at], output: ConsentGrant, side_effects: ["status = ACTIVE; ERR_CONSENT_ALREADY_ACTIVE if one ACTIVE consent exists for (member, scope)"] }
  - { method: GET, path: "/care/members/{id}/consents", description: "List member consents", roles: [Member, PlatformAdmin, NurseNavigator, CareAdvocate, RecordsSpecialist, BillingAdvocate], code: 200, input: ["scope?", "status?", "limit?", "offset?"], output: "ConsentGrant[]", side_effects: [] }
  - { method: POST, path: "/care/consents/{id}/revoke", description: "Revoke a consent (CASCADE A origin)", roles: [Member], code: 200, input: [], output: ConsentGrant, side_effects: ["status -> REVOKED; revoked_at set; RECORD_RETRIEVAL revocation cancels member's REQUESTED RecordRequests and cascades to ExpertOpinionCase RECORDS_BLOCKED and NavigationCase ESCALATED"] }

  # --- NavigationCase ---
  - { method: POST, path: "/care/members/{id}/navigation-cases", description: "Open a navigation intake; routed_discipline computed per calculations.intake_routing", roles: [Member, NurseNavigator, CareAdvocate], code: 201, input: [question_type, "acuity?", "estimated_cost_cents?"], output: NavigationCase, side_effects: ["status = ROUTED; routed_discipline computed"] }
  - { method: GET, path: "/care/navigation-cases/{id}", description: "Get a navigation case", roles: [PlatformAdmin, Member, NurseNavigator, CareAdvocate, PhysicianAdvisor], code: 200, input: [], output: NavigationCase, side_effects: [] }
  - { method: GET, path: "/care/members/{id}/navigation-cases", description: "List member navigation cases", roles: [PlatformAdmin, Member, NurseNavigator, CareAdvocate, PhysicianAdvisor], code: 200, input: ["status?", "limit?", "offset?"], output: "NavigationCase[]", side_effects: [] }
  - { method: POST, path: "/care/navigation-cases/{id}/start", description: "Start work on a routed/escalated case; discipline must match routed_discipline", roles: [NurseNavigator, CareAdvocate, PhysicianAdvisor], code: 200, input: [], output: NavigationCase, side_effects: ["status -> IN_PROGRESS; assigned_user_id = X-User-ID"] }
  - { method: POST, path: "/care/navigation-cases/{id}/escalate", description: "Escalate an in-progress case one discipline level", roles: [NurseNavigator, CareAdvocate, PhysicianAdvisor], code: 200, input: [], output: NavigationCase, side_effects: ["status -> ESCALATED; escalation_count += 1; routed_discipline escalated; assignment cleared"] }
  - { method: POST, path: "/care/navigation-cases/{id}/resolve", description: "Resolve an in-progress case (assigned navigator only)", roles: [NurseNavigator, CareAdvocate, PhysicianAdvisor], code: 200, input: [], output: NavigationCase, side_effects: ["status -> RESOLVED"] }
  - { method: POST, path: "/care/navigation-cases/{id}/close", description: "Close a resolved case", roles: [NurseNavigator, CareAdvocate, PhysicianAdvisor], code: 200, input: [], output: NavigationCase, side_effects: ["status -> CLOSED"] }
  - { method: GET, path: "/care/navigation-cases/{id}/appointments", description: "List appointments steered by this case (FK reverse reachability for Appointment.navigation_case_id)", roles: [PlatformAdmin, Member, NurseNavigator, CareAdvocate, PhysicianAdvisor, EmployerAdmin], code: 200, input: ["limit?", "offset?"], output: "Appointment[]", side_effects: [] }
  - { method: GET, path: "/care/navigation-cases/{id}/expert-opinions", description: "List expert opinions originating from this case (FK reverse reachability for ExpertOpinionCase.navigation_case_id)", roles: [PlatformAdmin, Member, NurseNavigator, PhysicianAdvisor, RecordsSpecialist, ExpertReviewer], code: 200, input: ["limit?", "offset?"], output: "ExpertOpinionCase[]", side_effects: [] }

  # --- Appointment ---
  - { method: POST, path: "/care/members/{id}/appointments", description: "Book an appointment on the member's behalf (consent-gated)", roles: [NurseNavigator, CareAdvocate], code: 201, input: [provider_id, slot_start, slot_end, "navigation_case_id?", "redirected_from_out_of_network?"], output: Appointment, side_effects: ["status = BOOKED; booked_by_user_id = X-User-ID; provider-day occupancy +1"] }
  - { method: GET, path: "/care/appointments/{id}", description: "Get an appointment", roles: [PlatformAdmin, Member, NurseNavigator, CareAdvocate, PhysicianAdvisor], code: 200, input: [], output: Appointment, side_effects: [] }
  - { method: GET, path: "/care/members/{id}/appointments", description: "List member appointments", roles: [PlatformAdmin, Member, NurseNavigator, CareAdvocate], code: 200, input: ["status?", "limit?", "offset?"], output: "Appointment[]", side_effects: [] }
  - { method: GET, path: "/care/providers/{id}/appointments", description: "List provider appointments (FK reverse reachability for Appointment.provider_id)", roles: [PlatformAdmin, NurseNavigator, CareAdvocate], code: 200, input: ["status?", "limit?", "offset?"], output: "Appointment[]", side_effects: [] }
  - { method: POST, path: "/care/appointments/{id}/reschedule", description: "Move a BOOKED appointment to a new slot (stays BOOKED)", roles: [NurseNavigator, CareAdvocate], code: 200, input: [slot_start, slot_end], output: Appointment, side_effects: ["overlap + capacity re-checked; increments Appointment.version by 1"] }
  - { method: POST, path: "/care/appointments/{id}/cancel", description: "Cancel a BOOKED appointment", roles: [NurseNavigator, CareAdvocate, Member], code: 200, input: [], output: Appointment, side_effects: ["status -> CANCELLED; late_cancel computed; provider-day occupancy -1"] }
  - { method: POST, path: "/care/appointments/{id}/complete", description: "Complete a BOOKED appointment once slot_end has passed", roles: [NurseNavigator, CareAdvocate], code: 200, input: [], output: Appointment, side_effects: ["status -> COMPLETED"] }
  - { method: POST, path: "/care/appointments/{id}/mark-no-show", description: "Mark a BOOKED appointment NO_SHOW once slot_end has passed", roles: [NurseNavigator, CareAdvocate], code: 200, input: [], output: Appointment, side_effects: ["status -> NO_SHOW"] }

  # --- RecordRequest ---
  - { method: POST, path: "/care/members/{id}/record-requests", description: "Request medical records from a provider on the member's behalf (consent-gated)", roles: [RecordsSpecialist], code: 201, input: [provider_id], output: RecordRequest, side_effects: ["status = REQUESTED; RECORDS_BLOCKED ExpertOpinionCases of the member -> RECORDS_COLLECTION"] }
  - { method: GET, path: "/care/record-requests/{id}", description: "Get a record request", roles: [PlatformAdmin, RecordsSpecialist, ExpertReviewer, Member], code: 200, input: [], output: RecordRequest, side_effects: [] }
  - { method: GET, path: "/care/record-requests", description: "List record requests (filtered-list FK reverse reachability for RecordRequest.provider_id)", roles: [PlatformAdmin, RecordsSpecialist], code: 200, input: ["provider_id?", "status?", "limit?", "offset?"], output: "RecordRequest[]", side_effects: [] }
  - { method: GET, path: "/care/members/{id}/record-requests", description: "List a member's record requests", roles: [PlatformAdmin, RecordsSpecialist, Member], code: 200, input: ["status?", "limit?", "offset?"], output: "RecordRequest[]", side_effects: [] }
  - { method: POST, path: "/care/record-requests/{id}/receive", description: "Mark records received with a page count", roles: [RecordsSpecialist], code: 200, input: [record_pages], output: RecordRequest, side_effects: ["status -> RECEIVED; recomputes attached_received_count on linked ExpertOpinionCases"] }
  - { method: POST, path: "/care/record-requests/{id}/fail", description: "Mark a record request failed", roles: [RecordsSpecialist], code: 200, input: [], output: RecordRequest, side_effects: ["status -> FAILED"] }
  - { method: POST, path: "/care/record-requests/{id}/retry", description: "Retry a failed record request (max 2 retries)", roles: [RecordsSpecialist], code: 200, input: [], output: RecordRequest, side_effects: ["status -> REQUESTED; retry_count += 1"] }
  - { method: POST, path: "/care/record-requests/{id}/cancel", description: "Cancel a pending record request", roles: [RecordsSpecialist], code: 200, input: [], output: RecordRequest, side_effects: ["status -> CANCELLED; CASCADE A link 2 applies"] }

  # --- ExpertOpinionCase ---
  - { method: POST, path: "/care/members/{id}/expert-opinions", description: "Open an expert medical opinion case (consent-gated; employer benefit must be enabled)", roles: [Member, RecordsSpecialist], code: 201, input: [condition_summary, "navigation_case_id?"], output: ExpertOpinionCase, side_effects: ["status = INTAKE"] }
  - { method: GET, path: "/care/expert-opinions/{id}", description: "Get an expert opinion case", roles: [PlatformAdmin, Member, RecordsSpecialist, ExpertReviewer, PhysicianAdvisor], code: 200, input: [], output: ExpertOpinionCase, side_effects: [] }
  - { method: GET, path: "/care/members/{id}/expert-opinions", description: "List member expert opinion cases", roles: [PlatformAdmin, Member, RecordsSpecialist, ExpertReviewer], code: 200, input: ["status?", "limit?", "offset?"], output: "ExpertOpinionCase[]", side_effects: [] }
  - { method: POST, path: "/care/expert-opinions/{id}/attach-records", description: "Attach a RECEIVED record request to the opinion bundle", roles: [RecordsSpecialist], code: 201, input: [record_request_id], output: OpinionRecordItem, side_effects: ["INTAKE -> RECORDS_COLLECTION on first attach; attached_received_count recomputed"] }
  - { method: GET, path: "/care/expert-opinions/{id}/record-items", description: "List opinion bundle items (FK reverse reachability for OpinionRecordItem.opinion_id)", roles: [PlatformAdmin, RecordsSpecialist, ExpertReviewer, Member], code: 200, input: ["limit?", "offset?"], output: "OpinionRecordItem[]", side_effects: [] }
  - { method: GET, path: "/care/record-requests/{id}/opinion-items", description: "List bundle items referencing a record request (FK reverse reachability for OpinionRecordItem.record_request_id)", roles: [PlatformAdmin, RecordsSpecialist], code: 200, input: ["limit?", "offset?"], output: "OpinionRecordItem[]", side_effects: [] }
  - { method: POST, path: "/care/expert-opinions/{id}/compile", description: "Compile the record bundle (sets compiler; revision loop re-entry)", roles: [RecordsSpecialist], code: 200, input: [], output: ExpertOpinionCase, side_effects: ["status -> COMPILING; compiler_user_id = X-User-ID"] }
  - { method: POST, path: "/care/expert-opinions/{id}/submit-for-review", description: "Submit compiled bundle for specialist review (>=3 received records + approved EMO authorization)", roles: [RecordsSpecialist], code: 200, input: [], output: ExpertOpinionCase, side_effects: ["status -> READY_FOR_REVIEW"] }
  - { method: POST, path: "/care/expert-opinions/{id}/claim-review", description: "Reviewer claims the case (segregation: reviewer != compiler)", roles: [ExpertReviewer], code: 200, input: [], output: ExpertOpinionCase, side_effects: ["status -> IN_REVIEW; reviewer_user_id = X-User-ID"] }
  - { method: POST, path: "/care/expert-opinions/{id}/request-changes", description: "Reviewer sends the bundle back for revision (cyclic)", roles: [ExpertReviewer], code: 200, input: [], output: ExpertOpinionCase, side_effects: ["status -> CHANGES_REQUESTED"] }
  - { method: POST, path: "/care/expert-opinions/{id}/submit-recommendation", description: "Submit the written recommendation (OCC on case version; supersedes prior draft)", roles: [ExpertReviewer], code: 200, input: [recommendation_text, expected_opinion_version], output: ExpertOpinionCase, side_effects: ["status -> RECOMMENDATION_SUBMITTED; recommendation_version += 1; increments ExpertOpinionCase.version by 1"] }
  - { method: POST, path: "/care/expert-opinions/{id}/deliver", description: "Deliver the written recommendation to the member", roles: [Member], code: 200, input: [], output: ExpertOpinionCase, side_effects: ["status -> DELIVERED"] }
  - { method: POST, path: "/care/expert-opinions/{id}/withdraw", description: "Withdraw a non-terminal opinion case", roles: [Member, PlatformAdmin], code: 200, input: [], output: ExpertOpinionCase, side_effects: ["status -> WITHDRAWN; assignments released"] }

  # --- Claim ---
  - { method: POST, path: "/care/claims", description: "Import a claim from the health plan feed", roles: [PlanAdministrator], code: 201, input: [member_id, provider_id, service_date, billed_amount_cents, allowed_amount_cents, lines], output: Claim, side_effects: ["status = RECEIVED; error_line_count computed"] }
  - { method: GET, path: "/care/claims/{id}", description: "Get a claim", roles: [PlatformAdmin, PlanAdministrator, BillingAdvocate, Member], code: 200, input: [], output: Claim, side_effects: [] }
  - { method: GET, path: "/care/claims", description: "List claims (filtered-list FK reverse reachability for Claim.provider_id)", roles: [PlatformAdmin, PlanAdministrator, BillingAdvocate], code: 200, input: ["provider_id?", "status?", "limit?", "offset?"], output: "Claim[]", side_effects: [] }
  - { method: GET, path: "/care/members/{id}/claims", description: "List member claims", roles: [PlatformAdmin, PlanAdministrator, BillingAdvocate, Member], code: 200, input: ["status?", "limit?", "offset?"], output: "Claim[]", side_effects: [] }
  - { method: POST, path: "/care/claims/{id}/adjudicate", description: "Adjudicate a claim (repricing then deductible application, order pinned)", roles: [PlanAdministrator], code: 200, input: [], output: Claim, side_effects: ["status -> ADJUDICATED; repriced_total/deductible/member_responsibility computed; member accumulators updated; increments Member.version by 1"] }
  - { method: POST, path: "/care/claims/{id}/void", description: "Void an adjudicated claim (accumulator compensation; voids open billing cases)", roles: [PlanAdministrator], code: 200, input: [], output: Claim, side_effects: ["status -> VOID; accumulators reversed exactly; non-terminal linked BillingCases -> VOIDED"] }

  # --- BillingCase ---
  - { method: POST, path: "/care/members/{id}/billing-cases", description: "Open a billing advocacy case on a claim (consent-gated)", roles: [BillingAdvocate], code: 201, input: [claim_id], output: BillingCase, side_effects: ["status = OPENED"] }
  - { method: GET, path: "/care/billing-cases/{id}", description: "Get a billing case", roles: [PlatformAdmin, BillingAdvocate, Member], code: 200, input: [], output: BillingCase, side_effects: [] }
  - { method: GET, path: "/care/members/{id}/billing-cases", description: "List member billing cases", roles: [PlatformAdmin, BillingAdvocate, Member], code: 200, input: ["status?", "limit?", "offset?"], output: "BillingCase[]", side_effects: [] }
  - { method: GET, path: "/care/claims/{id}/billing-cases", description: "List billing cases on a claim (FK reverse reachability for BillingCase.claim_id)", roles: [PlatformAdmin, BillingAdvocate], code: 200, input: ["limit?", "offset?"], output: "BillingCase[]", side_effects: [] }
  - { method: POST, path: "/care/billing-cases/{id}/identify-errors", description: "Identify claim errors and compute provisional savings", roles: [BillingAdvocate], code: 200, input: [], output: BillingCase, side_effects: ["status -> ERROR_IDENTIFIED; provisional_savings_cents computed"] }
  - { method: POST, path: "/care/billing-cases/{id}/propose-settlement", description: "Propose a negotiated amount to the provider (max 3 proposals)", roles: [BillingAdvocate], code: 200, input: [counter_offer_cents], output: BillingCase, side_effects: ["status -> SETTLEMENT_PROPOSED; proposal_count += 1"] }
  - { method: POST, path: "/care/billing-cases/{id}/accept-settlement", description: "Member accepts the proposed settlement (final savings)", roles: [Member], code: 200, input: [], output: BillingCase, side_effects: ["status -> RESOLVED_ACCEPTED; settled_amount/final_savings set"] }
  - { method: POST, path: "/care/billing-cases/{id}/reject-settlement", description: "Member rejects the proposal (back to negotiation)", roles: [Member], code: 200, input: [], output: BillingCase, side_effects: ["status -> NEGOTIATING"] }
  - { method: POST, path: "/care/billing-cases/{id}/abandon", description: "Close negotiation with no change", roles: [BillingAdvocate], code: 200, input: [], output: BillingCase, side_effects: ["status -> RESOLVED_NO_CHANGE; final_savings_cents = 0"] }
  - { method: POST, path: "/care/billing-cases/{id}/close", description: "Close a resolved billing case", roles: [BillingAdvocate], code: 200, input: [], output: BillingCase, side_effects: ["status -> CLOSED"] }

  # --- PlanAuthorization ---
  - { method: POST, path: "/care/members/{id}/authorizations", description: "Request a plan authorization", roles: [Member, NurseNavigator], code: 201, input: [service_code, units], output: PlanAuthorization, side_effects: ["status = REQUESTED"] }
  - { method: GET, path: "/care/authorizations/{id}", description: "Get an authorization", roles: [PlatformAdmin, PlanAdministrator, Member, NurseNavigator], code: 200, input: [], output: PlanAuthorization, side_effects: [] }
  - { method: GET, path: "/care/members/{id}/authorizations", description: "List member authorizations", roles: [PlatformAdmin, PlanAdministrator, Member, NurseNavigator], code: 200, input: ["status?", "limit?", "offset?"], output: "PlanAuthorization[]", side_effects: [] }
  - { method: POST, path: "/care/authorizations/{id}/approve", description: "Approve a requested/appealed authorization (unblocks AUTH_BLOCKED opinions)", roles: [PlanAdministrator], code: 200, input: [], output: PlanAuthorization, side_effects: ["status -> APPROVED; decided_at set; member's AUTH_BLOCKED ExpertOpinionCases -> INTAKE"] }
  - { method: POST, path: "/care/authorizations/{id}/deny", description: "Deny a requested/appealed authorization (CASCADE B origin)", roles: [PlanAdministrator], code: 200, input: [denial_reason], output: PlanAuthorization, side_effects: ["status -> DENIED or DENIED_FINAL; decided_at set; member's INTAKE ExpertOpinionCases -> AUTH_BLOCKED -> linked NavigationCase ESCALATED"] }
  - { method: POST, path: "/care/authorizations/{id}/appeal", description: "Member appeals a denial within 30 days", roles: [Member], code: 200, input: [], output: PlanAuthorization, side_effects: ["status -> APPEALED"] }

  # --- computed reads ---
  - { method: GET, path: "/care/members/{id}/cost-share-estimate", description: "Prospective member cost share per calculations.member_cost_share_estimate (never mutates accumulators)", roles: [Member, CareAdvocate, NurseNavigator, PlanAdministrator], code: 200, input: [provider_id, allowed_amount_cents], output: { member_responsibility_cents: integer, deductible_portion_cents: integer, coinsurance_portion_cents: integer, oop_capped: boolean }, side_effects: [] }

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "Missing/invalid X-User-Role or X-User-ID headers" }
  - { id: ERR_UNAUTHORIZED_ROLE, http: 403, condition: "Role not permitted on this endpoint" }
  - { id: ERR_MEMBER_MISMATCH, http: 403, condition: "Entity-backed Member acting on a resource owned by a different member" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Malformed request: missing required field, bad type/enum, or missing conditional input (acuity for CLINICAL, estimated_cost_cents for COST, subscriber_id for non-SELF, denial_reason on deny, record_pages >= 1 on receive)" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Path or referenced resource does not exist (validated left-to-right)" }
  - { id: ERR_MEMBER_INELIGIBLE, http: 409, condition: "Member eligibility_status != ACTIVE for member-scoped creation" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Entity not in a valid from-state for the requested transition (includes ERR-window/appointment/claim state preconditions not covered by a domain code)" }
  - { id: ERR_WINDOW_NOT_OPEN, http: 409, condition: "CoverageWindow terminate attempted on a non-OPEN window" }
  - { id: ERR_CONSENT_REQUIRED, http: 409, condition: "No ACTIVE ConsentGrant of the required scope for the member" }
  - { id: ERR_CONSENT_ALREADY_ACTIVE, http: 409, condition: "An ACTIVE consent already exists for (member, scope)" }
  - { id: ERR_SEGREGATION_OF_DUTIES, http: 403, condition: "ExpertReviewer attempting to review a bundle they compiled (X-User-ID == compiler_user_id)" }
  - { id: ERR_DISCIPLINE_MISMATCH, http: 403, condition: "Navigator discipline does not match the case's routed_discipline on start" }
  - { id: ERR_NOT_ASSIGNED_NAVIGATOR, http: 403, condition: "Resolve attempted by someone other than assigned_user_id" }
  - { id: ERR_NOT_ASSIGNED_REVIEWER, http: 403, condition: "Review action attempted by someone other than reviewer_user_id" }
  - { id: ERR_NOT_ASSIGNED_COMPILER, http: 403, condition: "submit-for-review attempted by someone other than compiler_user_id" }
  - { id: ERR_COVERAGE_OVERLAP, http: 409, condition: "New coverage window shares at least one day with an existing window of the member (closed-interval semantics)" }
  - { id: ERR_SLOT_CONFLICT, http: 409, condition: "Appointment slot overlaps an existing BOOKED slot on the same provider (half-open semantics; adjacency allowed)" }
  - { id: ERR_PROVIDER_DAY_CAPACITY, http: 422, condition: "Provider already has 8 BOOKED appointments on the slot's UTC calendar date" }
  - { id: ERR_NO_PROVIDER_MATCH, http: 422, condition: "Provider match candidate set empty for the requested specialty" }
  - { id: ERR_DUPLICATE_SNAPSHOT, http: 409, condition: "QualitySnapshot already exists for (provider_id, period_start)" }
  - { id: ERR_DUPLICATE_AUTHORIZATION, http: 409, condition: "Non-terminal PlanAuthorization already exists for (member, service_code)" }
  - { id: ERR_DUPLICATE_MEMBER_REF, http: 409, condition: "external_member_ref already loaded for this employer" }
  - { id: ERR_RECORD_NOT_READY, http: 409, condition: "attach-records: request not RECEIVED, wrong member, or already attached to a live opinion" }
  - { id: ERR_RECORDS_INSUFFICIENT, http: 422, condition: "submit-for-review with attached_received_count < 3" }
  - { id: ERR_AUTHORIZATION_REQUIRED, http: 409, condition: "No APPROVED EXPERT_MEDICAL_OPINION authorization for the member" }
  - { id: ERR_CLAIM_ALREADY_ADJUDICATED, http: 409, condition: "Adjudicate attempted on a non-RECEIVED claim" }
  - { id: ERR_CLAIM_NOT_ADJUDICATED, http: 409, condition: "identify-errors attempted while linked claim is not ADJUDICATED" }
  - { id: ERR_NO_LINE_ERRORS, http: 422, condition: "identify-errors on a claim with zero error-flagged lines" }
  - { id: ERR_SETTLEMENT_EXCEEDS_BILLED, http: 422, condition: "counter_offer_cents >= claim.billed_amount_cents" }
  - { id: ERR_NEGOTIATION_ROUND_EXCEEDED, http: 422, condition: "Fourth settlement proposal on the same BillingCase (cap 3)" }
  - { id: ERR_APPOINTMENT_NOT_DUE, http: 409, condition: "complete before slot_end, or mark-no-show at/before slot_end (logical clock)" }
  - { id: ERR_APPEAL_WINDOW_CLOSED, http: 422, condition: "Appeal after decided_at + 30 days (logical clock)" }
  - { id: ERR_RETRY_EXHAUSTED, http: 422, condition: "Third retry of a FAILED record request (retry_count == 2)" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "OCC: expected_*_version does not match the parent entity's current version" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: PlatformAdmin
    description: "Platform operator; loads employers/members, manages providers, snapshots, coverage windows, drives the logical clock"
    identity: opaque
    exclusive_operations:
      - "POST /_clock/set_current_utc"
      - "POST /care/employers"
      - "POST /care/employers/{id}/members"
      - "POST /care/members/{id}/deactivate, POST /care/members/{id}/reactivate"
      - "POST /care/members/{id}/coverage-windows, POST /care/coverage-windows/{id}/terminate"
      - "POST /care/providers, POST /care/providers/{id}/quality-snapshots"
    shared_operations:
      - "GET reads across all resources"
  - name: EmployerAdmin
    description: "Employer benefits administrator; reads member roster and utilization/savings reporting"
    identity: opaque
    exclusive_operations:
      - "GET /care/employers/{id}/utilization-report"
    shared_operations:
      - "GET /care/employers/{id}, GET /care/employers/{id}/members, member/dependent/appointment reads"
  - name: Member
    description: "Covered employee or dependent; grants/revokes consent, opens navigation cases and expert opinions, accepts/rejects settlements, appeals denials, receives delivered recommendations"
    identity: "entity_backed:Member"
    exclusive_operations:
      - "POST /care/members/{id}/consents, POST /care/consents/{id}/revoke"
      - "POST /care/billing-cases/{id}/accept-settlement, POST /care/billing-cases/{id}/reject-settlement"
      - "POST /care/authorizations/{id}/appeal"
      - "POST /care/expert-opinions/{id}/deliver"
    shared_operations:
      - "POST /care/members/{id}/navigation-cases, POST /care/members/{id}/expert-opinions, POST /care/members/{id}/authorizations, POST /care/expert-opinions/{id}/withdraw"
      - "GET own records"
  - name: NurseNavigator
    description: "Registered nurse navigator; handles clinical and escalated navigation, books appointments"
    identity: opaque
    exclusive_operations: []
    shared_operations:
      - "navigation case start/escalate/resolve/close (discipline-gated)"
      - "appointment book/reschedule/cancel/complete/mark-no-show"
      - "POST /care/members/{id}/authorizations"
  - name: CareAdvocate
    description: "Benefit and cost advocate; owns BENEFIT/COST navigation and appointment booking"
    identity: opaque
    exclusive_operations: []
    shared_operations:
      - "navigation case start/escalate/resolve/close (discipline-gated)"
      - "appointment book/reschedule/cancel/complete/mark-no-show"
      - "GET /care/members/{id}/cost-share-estimate"
  - name: PhysicianAdvisor
    description: "Physician advisor; owns HIGH-acuity clinical and child clinical navigation"
    identity: opaque
    exclusive_operations: []
    shared_operations:
      - "navigation case start/escalate/resolve/close (discipline-gated at PHYSICIAN)"
  - name: RecordsSpecialist
    description: "Medical records compiler; retrieves records, builds and compiles EMO bundles, submits for review"
    identity: opaque
    exclusive_operations:
      - "POST /care/members/{id}/record-requests and record-request receive/fail/retry/cancel"
      - "POST /care/expert-opinions/{id}/attach-records, compile, submit-for-review"
    shared_operations:
      - "POST /care/members/{id}/expert-opinions"
  - name: ExpertReviewer
    description: "Specialist physician reviewer; claims reviews, requests changes, writes recommendations. Segregated from the compiler of the same case"
    identity: opaque
    exclusive_operations:
      - "POST /care/expert-opinions/{id}/claim-review, request-changes, submit-recommendation"
    shared_operations:
      - "GET expert opinion and record reads"
  - name: BillingAdvocate
    description: "Billing advocate; opens billing cases, identifies claim errors, negotiates with providers"
    identity: opaque
    exclusive_operations:
      - "POST /care/members/{id}/billing-cases and billing-case identify-errors/propose-settlement/abandon/close"
    shared_operations:
      - "GET claim and billing reads"
  - name: PlanAdministrator
    description: "Health plan integration operator; imports and adjudicates claims, decides authorizations"
    identity: opaque
    exclusive_operations:
      - "POST /care/claims, POST /care/claims/{id}/adjudicate, POST /care/claims/{id}/void"
      - "POST /care/authorizations/{id}/approve, POST /care/authorizations/{id}/deny"
    shared_operations:
      - "GET claim/authorization/member reads"
