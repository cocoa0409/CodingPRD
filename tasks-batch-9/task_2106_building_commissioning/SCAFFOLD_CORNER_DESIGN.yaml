              payload: { project_id: "${p}", metric_key: "HEATING_CAPACITY_MBH", target_value: 10000, tolerance_pct: 5, criticality: "CRITICAL" }
              as: OwnerRepresentative
              as_user_id: "u-owner-1"
              captures: { r1: $.data.id }
            - call: "POST /owner-requirements/${r1}/approve"
              payload: {}
              as: OwnerRepresentative
              as_user_id: "u-owner-1"
            - call: "GET /cx-projects/${p}"
              payload: {}
              as: CxAuthority
              as_user_id: "u-cxa-1"
              captures: { pv1: $.data.version }
            - call: "POST /cx-plans"
              payload: { project_id: "${p}", title: "Window Plan", expected_project_version: "${pv1}" }
              as: CxAuthority
              as_user_id: "u-cxa-1"
              captures: { pl: $.data.id }
            - call: "POST /cx-plans/${pl}/approve"
              payload: {}
              as: OwnerRepresentative
              as_user_id: "u-owner-1"
            - call: "POST /equipment-units"
              payload: { project_id: "${p}", tag: "BLR-WD", system_type: "BOILER", criticality: "STANDARD", contract_value_cents: 1000000, weight_units: 10 }
              as: CxAuthority
              as_user_id: "u-cxa-1"
              captures: { e1: $.data.id }
            - call: "POST /equipment-units/${e1}/install-status"
              payload: { install_status: "INSTALLED" }
              as: Contractor
              as_user_id: "u-contractor-1"
            - call: "POST /deferred-tests"
              payload: { equipment_id: "${e1}", requirement_id: "${r1}", season: "HEATING", window_start: "2026-11-01T00:00:00Z", window_end: "2026-12-01T00:00:00Z" }
              as: CxAuthority
              as_user_id: "u-cxa-1"
              captures: { dt1: $.data.id }
          trigger:
            - call: "POST /deferred-tests"
              payload: { equipment_id: "${e1}", requirement_id: "${r1}", season: "SHOULDER", window_start: "2026-11-15T00:00:00Z", window_end: "2026-11-10T00:00:00Z" }
