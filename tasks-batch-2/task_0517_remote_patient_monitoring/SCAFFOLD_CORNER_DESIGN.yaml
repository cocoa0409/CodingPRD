scaffold_corner_design:

  # =========================================================================
  - section: entities
    instances:
      - name: create_patient_returns_201_with_system_defaults
        claim_type: Creation
        grounds:
          - entities.Patient
          - endpoints
        distinguishing_aspect: "POST /patients with payer_id, mrn, full_name returns 201; enrollment_status defaults to PENDING_CONSENT, monitoring_status to INACTIVE, version to 1, care_plan_id null."
        test_recipe:
          setup: ["A registered payer exists."]
          setup_api_calls:
            - call: "POST /payers"
              payload: { name: "P-EC1", payer_type: "COMMERCIAL", rate_99453_cents: 2000, rate_99454_cents: 4000, rate_99457_cents: 5000 }
              as: BillingSpecialist
              captures: { payer_id: $.data.id }
          trigger:
            - call: "POST /patients"
              payload: { payer_id: "${payer_id}", mrn: "M-EC1-1", full_name: "Edge Create" }
              as: CareCoordinator
              captures: { pid: $.data.id }
          assert:
            - "response status == 201"
            - "Patient.${pid}.enrollment_status == PENDING_CONSENT"
            - "Patient.${pid}.monitoring_status == INACTIVE"
            - "Patient.${pid}.version == 1"
            - "Patient.${pid}.care_plan_id == null"

      - name: get_patient_not_found_returns_404
        claim_type: Not Found
        grounds:
          - entities.Patient
          - errors[ERR_NOT_FOUND]
        distinguishing_aspect: "GET /patients/{id} for a non-existent UUID returns ERR_NOT_FOUND (404)."
        test_recipe:
          setup: ["Empty DB (no patients)."]
          setup_api_calls: []
          trigger:
            - call: "GET /patients/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: CareCoordinator
              captures: { err: $.data.error_id }
          assert:
            - "response status == 404"
            - "data.error_id == ERR_NOT_FOUND"

      - name: create_patient_missing_required_field_returns_422
        claim_type: Required Fields
        grounds:
          - entities.Patient.fields.mrn
          - validations[priority=5]
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: "POST /patients omitting required mrn returns ERR_INVALID_REQUEST (422)."
        test_recipe:
          setup: ["A registered payer exists."]
          setup_api_calls:
            - call: "POST /payers"
              payload: { name: "P-EC2", payer_type: "COMMERCIAL", rate_99453_cents: 2000, rate_99454_cents: 4000, rate_99457_cents: 5000 }
              as: BillingSpecialist
              captures: { payer_id: $.data.id }
          trigger:
            - call: "POST /patients"
              payload: { payer_id: "${payer_id}", full_name: "No MRN" }
              as: CareCoordinator
              captures: { err: $.data.error_id }
          assert:
            - "response status == 422"
            - "data.error_id == ERR_INVALID_REQUEST"

      - name: create_patient_invalid_payer_reference_returns_404
        claim_type: Parent Relationships
        grounds:
          - entities.Patient.fields.payer_id
          - validations[priority=4]
          - errors[ERR_REFERENCE_NOT_FOUND]
        distinguishing_aspect: "POST /patients with a payer_id that does not resolve returns ERR_REFERENCE_NOT_FOUND (404)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /patients"
              payload: { payer_id: "11111111-1111-4111-8111-111111111111", mrn: "M-EC3-1", full_name: "Bad Payer" }
              as: CareCoordinator
              captures: { err: $.data.error_id }
          assert:
            - "response status == 404"
            - "data.error_id == ERR_REFERENCE_NOT_FOUND"

      - name: device_invalid_enum_device_type_returns_422
        claim_type: Type Constraints
        grounds:
          - entities.Device.fields.device_type
          - validations[priority=5]
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: "POST /patients/{id}/devices with device_type outside {BP_CUFF,GLUCOMETER,PULSE_OX,WEIGHT_SCALE} returns ERR_INVALID_REQUEST (422)."
        test_recipe:
          setup: ["A patient exists."]
          setup_api_calls:
            - call: "POST /payers"
              payload: { name: "P-EC4", payer_type: "COMMERCIAL", rate_99453_cents: 2000, rate_99454_cents: 4000, rate_99457_cents: 5000 }
              as: BillingSpecialist
              captures: { payer_id: $.data.id }
            - call: "POST /patients"
              payload: { payer_id: "${payer_id}", mrn: "M-EC4-1", full_name: "Enum Dev" }
              as: CareCoordinator
              captures: { pid: $.data.id }
          trigger:
            - call: "POST /patients/${pid}/devices"
              payload: { device_type: "THERMOMETER", serial_number: "SN-EC4-1" }
              as: CareCoordinator
              captures: { err: $.data.error_id }
          assert:
            - "response status == 422"
            - "data.error_id == ERR_INVALID_REQUEST"

      - name: care_plan_required_minutes_default_applied
        claim_type: Defaults
        grounds:
          - entities.CarePlan.fields.required_care_minutes
        distinguishing_aspect: "POST /patients/{id}/care-plans omitting required_care_minutes applies the default 20."
        test_recipe:
          setup: ["A patient exists."]
          setup_api_calls:
            - call: "POST /payers"
              payload: { name: "P-EC5", payer_type: "COMMERCIAL", rate_99453_cents: 2000, rate_99454_cents: 4000, rate_99457_cents: 5000 }
              as: BillingSpecialist
              captures: { payer_id: $.data.id }
            - call: "POST /patients"
              payload: { payer_id: "${payer_id}", mrn: "M-EC5-1", full_name: "Def Plan" }
              as: CareCoordinator
              captures: { pid: $.data.id }
          trigger:
            - call: "POST /patients/${pid}/care-plans"
              payload: { diagnosis_code: "I10", goal_text: "BP" }
              as: Physician
              captures: { plan_id: $.data.id }
          assert:
            - "response status == 201"
            - "CarePlan.${plan_id}.required_care_minutes == 20"
            - "CarePlan.${plan_id}.status == DRAFT"

      - name: vitals_service_date_computed_from_measured_at
        claim_type: Computed Fields
        grounds:
          - entities.VitalsReading.fields.service_date
          - calculations.breach_evaluation
        distinguishing_aspect: "VitalsReading.service_date is the UTC calendar date of measured_at (2026-06-09 for measured_at 2026-06-09T23:30:00Z), not client-supplied."
        test_recipe:
          setup: ["Patient ENROLLED with ACTIVE BP_CUFF device; clock in 2026-06."]
          setup_api_calls:
            - call: "POST /payers"
              payload: { name: "P-EC6", payer_type: "MEDICARE", rate_99453_cents: 1965, rate_99454_cents: 4774, rate_99457_cents: 4877 }
              as: BillingSpecialist
              captures: { payer_id: $.data.id }
            - call: "POST /patients"
              payload: { payer_id: "${payer_id}", mrn: "M-EC6-1", full_name: "Svc Date" }
              as: CareCoordinator
              captures: { pid: $.data.id }
            - call: "POST /patients/${pid}/consents"
              payload: { consent_type: "RPM", effective_at: "2026-05-01T00:00:00Z" }
              as: CareCoordinator
            - call: "POST /patients/${pid}/care-plans"
              payload: { diagnosis_code: "I10", goal_text: "BP", required_care_minutes: 20 }
              as: Physician
              captures: { plan_id: $.data.id }
            - call: "POST /patients/${pid}/care-plans/${plan_id}/activate"
              payload: {}
              as: Physician
            - call: "POST /patients/${pid}/enroll"
              payload: {}
              as: CareCoordinator
            - call: "POST /patients/${pid}/devices"
              payload: { device_type: "BP_CUFF", serial_number: "SN-EC6-1" }
              as: CareCoordinator
              captures: { dev_id: $.data.id }
            - call: "POST /patients/${pid}/devices/${dev_id}/activate"
              payload: {}
              as: CareCoordinator
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-09T00:00:00Z" }
              as: CareCoordinator
          trigger:
            - call: "POST /patients/${pid}/vitals"
              payload: { device_id: "${dev_id}", reading_value: 118, secondary_value: 78, measured_at: "2026-06-09T23:30:00Z" }
              as: Clinician
              captures: { vr_id: $.data.id }
          assert:
            - "response status == 201"
            - "VitalsReading.${vr_id}.service_date == \"2026-06-09\""
            - "VitalsReading.${vr_id}.breach_flag == false"

      - name: list_patients_paginated_envelope
        claim_type: Listing
        grounds:
          - entities.Patient
          - response_envelope.pagination_fields
        distinguishing_aspect: "GET /patients returns a paginated array envelope with total_count and has_more; default limit 10."
        test_recipe:
          setup: ["Two patients exist under one payer."]
          setup_api_calls:
            - call: "POST /payers"
              payload: { name: "P-EC7", payer_type: "COMMERCIAL", rate_99453_cents: 2000, rate_99454_cents: 4000, rate_99457_cents: 5000 }
              as: BillingSpecialist
              captures: { payer_id: $.data.id }
            - call: "POST /patients"
              payload: { payer_id: "${payer_id}", mrn: "M-EC7-1", full_name: "List A" }
              as: CareCoordinator
            - call: "POST /patients"
              payload: { payer_id: "${payer_id}", mrn: "M-EC7-2", full_name: "List B" }
              as: CareCoordinator
          trigger:
            - call: "GET /patients"
              payload: { payer_id: "${payer_id}" }
              as: CareCoordinator
          assert:
            - "response status == 200"
            - "meta and pagination fields total_count == 2 and has_more == false present"

  # =========================================================================
  - section: state_machines
    instances:
      - name: device_activate_invalid_from_returned_returns_invalid_state
        claim_type: invalid_transition
        grounds:
          - state_machines.Device.ACTIVE_to_RETURNED
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "Activating a RETURNED device has no defined transition; returns ERR_INVALID_STATE (409)."
        test_recipe:
          setup: ["Patient ENROLLED; a device activated then returned (status RETURNED)."]
          setup_api_calls:
            - call: "POST /payers"
              payload: { name: "P-SM1", payer_type: "MEDICARE", rate_99453_cents: 1965, rate_99454_cents: 4774, rate_99457_cents: 4877 }
              as: BillingSpecialist
              captures: { payer_id: $.data.id }
            - call: "POST /patients"
              payload: { payer_id: "${payer_id}", mrn: "M-SM1-1", full_name: "SM One" }
              as: CareCoordinator
              captures: { pid: $.data.id }
            - call: "POST /patients/${pid}/consents"
              payload: { consent_type: "RPM", effective_at: "2026-05-01T00:00:00Z" }
              as: CareCoordinator
            - call: "POST /patients/${pid}/care-plans"
              payload: { diagnosis_code: "I10", goal_text: "BP", required_care_minutes: 20 }
              as: Physician
              captures: { plan_id: $.data.id }
            - call: "POST /patients/${pid}/care-plans/${plan_id}/activate"
              payload: {}
              as: Physician
            - call: "POST /patients/${pid}/enroll"
              payload: {}
              as: CareCoordinator
            - call: "POST /patients/${pid}/devices"
              payload: { device_type: "BP_CUFF", serial_number: "SN-SM1-1" }
              as: CareCoordinator
              captures: { dev_id: $.data.id }
            - call: "POST /patients/${pid}/devices/${dev_id}/activate"
              payload: {}
              as: CareCoordinator
            - call: "POST /patients/${pid}/devices/${dev_id}/return"
              payload: {}
              as: CareCoordinator
          trigger:
            - call: "POST /patients/${pid}/devices/${dev_id}/activate"
              payload: {}
              as: CareCoordinator
              captures: { err: $.data.error_id }
          assert:
            - "response status == 409"
            - "data.error_id == ERR_INVALID_STATE"

      - name: escalate_warning_alert_not_permitted
        claim_type: precondition_violation
        grounds:
          - state_machines.ThresholdAlert.OPEN_to_ESCALATED
          - validations[priority=8]
          - errors[ERR_ESCALATION_NOT_PERMITTED]
        distinguishing_aspect: "Escalating a WARNING-severity alert violates the severity precondition and returns ERR_ESCALATION_NOT_PERMITTED (409)."
        test_recipe:
          setup: ["Patient ENROLLED with ACTIVE BP_CUFF; a WARNING alert (systolic 145) exists in OPEN."]
          setup_api_calls:
            - call: "POST /payers"
              payload: { name: "P-SM2", payer_type: "MEDICARE", rate_99453_cents: 1965, rate_99454_cents: 4774, rate_99457_cents: 4877 }
              as: BillingSpecialist
              captures: { payer_id: $.data.id }
            - call: "POST /patients"
              payload: { payer_id: "${payer_id}", mrn: "M-SM2-1", full_name: "SM Two" }
              as: CareCoordinator
              captures: { pid: $.data.id }
            - call: "POST /patients/${pid}/consents"
              payload: { consent_type: "RPM", effective_at: "2026-05-01T00:00:00Z" }
              as: CareCoordinator
            - call: "POST /patients/${pid}/care-plans"
              payload: { diagnosis_code: "I10", goal_text: "BP", required_care_minutes: 20 }
              as: Physician
              captures: { plan_id: $.data.id }
            - call: "POST /patients/${pid}/care-plans/${plan_id}/activate"
              payload: {}
              as: Physician
            - call: "POST /patients/${pid}/enroll"
              payload: {}
              as: CareCoordinator
            - call: "POST /patients/${pid}/devices"
              payload: { device_type: "BP_CUFF", serial_number: "SN-SM2-1" }
              as: CareCoordinator
              captures: { dev_id: $.data.id }
            - call: "POST /patients/${pid}/devices/${dev_id}/activate"
              payload: {}
              as: CareCoordinator
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-10T00:00:00Z" }
              as: CareCoordinator
            - call: "POST /patients/${pid}/vitals"
              payload: { device_id: "${dev_id}", reading_value: 145, secondary_value: 85, measured_at: "2026-06-10T08:00:00Z" }
              as: Clinician
              captures: { vr_id: $.data.id }
            - call: "GET /alerts"
              payload: {}
              as: Clinician
              captures: { alert_id: "$.data[0].id" }
          trigger:
            - call: "POST /alerts/${alert_id}/escalate"
              payload: {}
              as: Clinician
              captures: { err: $.data.error_id }
          assert:
            - "response status == 409"
            - "data.error_id == ERR_ESCALATION_NOT_PERMITTED"

      - name: terminal_claim_paid_cannot_remit_again
        claim_type: terminal_state_lockdown
        grounds:
          - state_machines.Claim.PARTIALLY_PAID_to_PAID
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "A PAID claim is terminal; a further remit returns ERR_INVALID_STATE (409)."
        test_recipe:
          setup: ["A PAID claim (claimed 6842, fully remitted)."]
          setup_api_calls:
            - call: "POST /payers"
              payload: { name: "P-SM3", payer_type: "MEDICARE", rate_99453_cents: 1965, rate_99454_cents: 4774, rate_99457_cents: 4877, requires_active_consent: false }
              as: BillingSpecialist
              captures: { payer_id: $.data.id }
            - call: "POST /patients"
              payload: { payer_id: "${payer_id}", mrn: "M-SM3-1", full_name: "SM Three" }
              as: CareCoordinator
              captures: { pid: $.data.id }
            - call: "POST /patients/${pid}/consents"
              payload: { consent_type: "BOTH", effective_at: "2026-05-01T00:00:00Z" }
              as: CareCoordinator
            - call: "POST /patients/${pid}/care-plans"
              payload: { diagnosis_code: "I10", goal_text: "BP", required_care_minutes: 20 }
              as: Physician
              captures: { plan_id: $.data.id }
            - call: "POST /patients/${pid}/care-plans/${plan_id}/activate"
              payload: {}
              as: Physician
            - call: "POST /patients/${pid}/enroll"
              payload: {}
              as: CareCoordinator
            - call: "POST /patients/${pid}/billing-periods"
              payload: { period_year: 2026, period_month: 6 }
              as: BillingSpecialist
              captures: { bp_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-02T00:00:00Z" }
              as: BillingSpecialist
            - call: "POST /patients/${pid}/devices"
              payload: { device_type: "BP_CUFF", serial_number: "SN-SM3-1" }
              as: CareCoordinator
              captures: { dev_id: $.data.id }
            - call: "POST /patients/${pid}/devices/${dev_id}/activate"
              payload: {}
              as: CareCoordinator
            - call: "POST /patients/${pid}/care-activities"
              payload: { billing_period_id: "${bp_id}", clinician_user_id: "clin-7", activity_type: "REVIEW", minutes: 20, performed_at: "2026-06-03T10:00:00Z" }
              as: Clinician
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-01T00:00:00Z" }
              as: BillingSpecialist
            - call: "GET /billing-periods/${bp_id}"
              payload: {}
              as: BillingSpecialist
              captures: { bp_v: $.data.version }
            - call: "POST /billing-periods/${bp_id}/finalize"
              payload: { expected_billing_period_version: "${bp_v}" }
              as: BillingSpecialist
            - call: "POST /billing-periods/${bp_id}/claims"
              payload: {}
              as: BillingSpecialist
              captures: { claim_id: $.data.id }
            - call: "POST /claims/${claim_id}/accept"
              payload: {}
              as: PayerAgent
            - call: "POST /claims/${claim_id}/remit"
              payload: { remittance_cents: 6842 }
              as: PayerAgent
          trigger:
            - call: "POST /claims/${claim_id}/remit"
              payload: { remittance_cents: 1 }
              as: PayerAgent
              captures: { err: $.data.error_id }
          assert:
            - "before trigger: Claim.${claim_id}.status == PAID"
            - "response status == 409"
            - "data.error_id == ERR_INVALID_STATE"

      - name: care_plan_initial_state_is_draft
        claim_type: initial_state
        grounds:
          - state_machines.CarePlan.initial_DRAFT
        distinguishing_aspect: "A newly created CarePlan starts in DRAFT before any activation."
        test_recipe:
          setup: ["A patient exists."]
          setup_api_calls:
            - call: "POST /payers"
              payload: { name: "P-SM4", payer_type: "COMMERCIAL", rate_99453_cents: 2000, rate_99454_cents: 4000, rate_99457_cents: 5000 }
              as: BillingSpecialist
              captures: { payer_id: $.data.id }
            - call: "POST /patients"
              payload: { payer_id: "${payer_id}", mrn: "M-SM4-1", full_name: "SM Four" }
              as: CareCoordinator
              captures: { pid: $.data.id }
          trigger:
            - call: "POST /patients/${pid}/care-plans"
              payload: { diagnosis_code: "I10", goal_text: "BP", required_care_minutes: 25 }
              as: Physician
              captures: { plan_id: $.data.id }
          assert:
            - "CarePlan.${plan_id}.status == DRAFT"

      - name: activate_second_care_plan_without_supersede_rejected
        claim_type: guarded_transition
        grounds:
          - state_machines.CarePlan.DRAFT_to_ACTIVE
          - validations[priority=17]
          - errors[ERR_ACTIVE_PLAN_EXISTS]
        distinguishing_aspect: "Activating a second DRAFT plan while one is already ACTIVE, without supersede, returns ERR_ACTIVE_PLAN_EXISTS (409)."
        test_recipe:
          setup: ["A patient with one ACTIVE care plan and a second DRAFT plan."]
          setup_api_calls:
            - call: "POST /payers"
              payload: { name: "P-SM5", payer_type: "MEDICARE", rate_99453_cents: 1965, rate_99454_cents: 4774, rate_99457_cents: 4877 }
              as: BillingSpecialist
              captures: { payer_id: $.data.id }
            - call: "POST /patients"
              payload: { payer_id: "${payer_id}", mrn: "M-SM5-1", full_name: "SM Five" }
              as: CareCoordinator
              captures: { pid: $.data.id }
            - call: "POST /patients/${pid}/care-plans"
              payload: { diagnosis_code: "I10", goal_text: "BP", required_care_minutes: 20 }
              as: Physician
              captures: { plan1: $.data.id }
            - call: "POST /patients/${pid}/care-plans/${plan1}/activate"
              payload: {}
              as: Physician
            - call: "POST /patients/${pid}/care-plans"
              payload: { diagnosis_code: "E11.9", goal_text: "glucose", required_care_minutes: 20 }
              as: Physician
              captures: { plan2: $.data.id }
          trigger:
            - call: "POST /patients/${pid}/care-plans/${plan2}/activate"
              payload: {}
              as: Physician
              captures: { err: $.data.error_id }
          assert:
            - "response status == 409"
            - "data.error_id == ERR_ACTIVE_PLAN_EXISTS"
            - "CarePlan.${plan1}.status == ACTIVE"

      - name: care_plan_supersede_revises_prior_active
        claim_type: side_effect_application
        grounds:
          - state_machines.CarePlan.DRAFT_to_ACTIVE
          - state_machines.CarePlan.ACTIVE_to_REVISED
          - entities.CarePlan.fields.superseded_by_plan_id
        distinguishing_aspect: "Activating a second plan with supersede=true flips the prior ACTIVE plan to REVISED, sets its superseded_by_plan_id, and repoints patient.care_plan_id to the new plan."
        test_recipe:
          setup: ["A patient with one ACTIVE care plan and a second DRAFT plan."]
          setup_api_calls:
            - call: "POST /payers"
              payload: { name: "P-SM6", payer_type: "MEDICARE", rate_99453_cents: 1965, rate_99454_cents: 4774, rate_99457_cents: 4877 }
              as: BillingSpecialist
              captures: { payer_id: $.data.id }
            - call: "POST /patients"
              payload: { payer_id: "${payer_id}", mrn: "M-SM6-1", full_name: "SM Six" }
              as: CareCoordinator
              captures: { pid: $.data.id }
            - call: "POST /patients/${pid}/care-plans"
              payload: { diagnosis_code: "I10", goal_text: "BP", required_care_minutes: 20 }
              as: Physician
              captures: { plan1: $.data.id }
            - call: "POST /patients/${pid}/care-plans/${plan1}/activate"
              payload: {}
              as: Physician
            - call: "POST /patients/${pid}/care-plans"
              payload: { diagnosis_code: "I10", goal_text: "BP tighter", required_care_minutes: 30 }
              as: Physician
              captures: { plan2: $.data.id }
          trigger:
            - call: "POST /patients/${pid}/care-plans/${plan2}/activate"
              payload: { supersede: true }
              as: Physician
          assert:
            - "CarePlan.${plan2}.status == ACTIVE"
            - "CarePlan.${plan1}.status == REVISED and CarePlan.${plan1}.superseded_by_plan_id == ${plan2}"
            - "Patient.${pid}.care_plan_id == ${plan2}"

      - name: suspend_pauses_monitoring_cross_dimension
        claim_type: side_effect_application
        grounds:
          - state_machines.Patient.enrollment_ENROLLED_to_SUSPENDED
          - entities.Patient.fields.monitoring_status
        distinguishing_aspect: "Suspending an ENROLLED+MONITORING patient sets enrollment_status=SUSPENDED and cascades monitoring_status MONITORING->PAUSED on the same row (parallel dimensions)."
        test_recipe:
          setup: ["Patient ENROLLED + MONITORING with one ACTIVE device."]
          setup_api_calls:
            - call: "POST /payers"
              payload: { name: "P-SM7", payer_type: "MEDICARE", rate_99453_cents: 1965, rate_99454_cents: 4774, rate_99457_cents: 4877 }
              as: BillingSpecialist
              captures: { payer_id: $.data.id }
            - call: "POST /patients"
              payload: { payer_id: "${payer_id}", mrn: "M-SM7-1", full_name: "SM Seven" }
              as: CareCoordinator
              captures: { pid: $.data.id }
            - call: "POST /patients/${pid}/consents"
