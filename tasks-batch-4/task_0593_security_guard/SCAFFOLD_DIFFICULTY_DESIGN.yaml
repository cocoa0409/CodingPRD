  # =========================================================================
  # Rule 8 — Resource temporal-overlap conflicts across different interval semantics
  # =========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: guard_rest_buffer_eight_hours_between_shifts
        grounds:
          - validations[priority=15]
          - validations[priority=14]
          - errors[ERR_GUARD_REST_PERIOD_VIOLATION]
          - state_machines.CoverageShift.OPEN_UNFILLED_to_SCHEDULED
        distinguishing_aspect: |
          Interval semantics: BUFFER geometry on the Guard resource — the candidate interval is widened by
          REST_BUFFER_MINUTES=480 on both ends before intersection, so a non-overlapping shift 4h after the
          previous one is rejected with ERR_GUARD_REST_PERIOD_VIOLATION (not DOUBLE_BOOKED), while a shift
          starting exactly 8h after the previous shift's end is accepted.
        test_recipe:
          setup:
            - "Guard Yuri is ACTIVE and LICENSED."
            - "Shift 1 (2026-05-04T08:00Z→16:00Z) at post Gate A is SCHEDULED to Yuri."
            - "Shift 2 (2026-05-04T20:00Z→23:00Z) at post Gate B is OPEN_UNFILLED — it does not overlap shift 1 but leaves only a 4-hour gap."
            - "Shift 3 (2026-05-05T00:00Z→04:00Z) at post Gate C is OPEN_UNFILLED — exactly 8 hours after shift 1 ends."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /clients"
              payload: { name: "Ridge Industrial", margin_floor_pct: 20.0 }
              as: AccountManager
              captures: { client_id: $.data.id }
            - call: "POST /sites"
              payload: { client_id: "${client_id}", name: "Ridge Plant" }
              as: AccountManager
              captures: { site_id: $.data.id }
            - call: "POST /posts"
              payload: { site_id: "${site_id}", name: "Gate A", bill_rate_cents_per_hour: 4500, max_concurrent_guards: 1, required_cert_codes: [], checkpoint_tag_uids: [], tour_compliance_floor_pct: 80.0 }
              as: AccountManager
              captures: { pa_id: $.data.id }
            - call: "POST /posts"
              payload: { site_id: "${site_id}", name: "Gate B", bill_rate_cents_per_hour: 4500, max_concurrent_guards: 1, required_cert_codes: [], checkpoint_tag_uids: [], tour_compliance_floor_pct: 80.0 }
              as: AccountManager
              captures: { pb_id: $.data.id }
            - call: "POST /posts"
              payload: { site_id: "${site_id}", name: "Gate C", bill_rate_cents_per_hour: 4500, max_concurrent_guards: 1, required_cert_codes: [], checkpoint_tag_uids: [], tour_compliance_floor_pct: 80.0 }
              as: AccountManager
              captures: { pc_id: $.data.id }
            - call: "POST /guards"
              payload: { full_name: "Yuri Bell", employee_code: "G-130", pay_rate_cents_per_hour: 2200 }
              as: ComplianceOfficer
              captures: { guard_id: $.data.id }
            - call: "POST /credentials"
              payload: { guard_id: "${guard_id}", kind: "LICENSE", code: "GUARD_CARD", credential_number: "L-130", expires_at: "2027-01-01T00:00:00Z" }
              as: ComplianceOfficer
              captures: { lic_id: $.data.id }
            - call: "POST /credentials/${lic_id}/verify"
              payload: {}
              as: ComplianceOfficer
            - call: "POST /guards/${guard_id}/status"
              payload: { action: "ACTIVATE" }
              as: ComplianceOfficer
            - call: "POST /shifts"
              payload: { post_id: "${pa_id}", scheduled_start_at: "2026-05-04T08:00:00Z", scheduled_end_at: "2026-05-04T16:00:00Z", planned_break_minutes: 0 }
              as: Scheduler
              captures: { s1_id: $.data.id, s1_v: $.data.version }
            - call: "POST /shifts/${s1_id}/assignments"
              payload: { guard_id: "${guard_id}", expected_shift_version: "${s1_v}" }
              as: Scheduler
            - call: "POST /shifts"
              payload: { post_id: "${pb_id}", scheduled_start_at: "2026-05-04T20:00:00Z", scheduled_end_at: "2026-05-04T23:00:00Z", planned_break_minutes: 0 }
              as: Scheduler
              captures: { s2_id: $.data.id, s2_v: $.data.version }
            - call: "POST /shifts"
              payload: { post_id: "${pc_id}", scheduled_start_at: "2026-05-05T00:00:00Z", scheduled_end_at: "2026-05-05T04:00:00Z", planned_break_minutes: 0 }
              as: Scheduler
              captures: { s3_id: $.data.id, s3_v: $.data.version }
          trigger:
            - call: "POST /shifts/${s2_id}/assignments"
              payload: { guard_id: "${guard_id}", expected_shift_version: "${s2_v}" }
              as: Scheduler
            - call: "POST /shifts/${s3_id}/assignments"
              payload: { guard_id: "${guard_id}", expected_shift_version: "${s3_v}" }
              as: Scheduler
          assert:
            - "First trigger call: HTTP status == 409"
            - "First trigger call: data.error_id == 'ERR_GUARD_REST_PERIOD_VIOLATION'"
            - "First trigger call: data.error_id != 'ERR_GUARD_DOUBLE_BOOKED'"
            - "CoverageShift.${s2_id}.status == OPEN_UNFILLED"
            - "Second trigger call: HTTP status == 200"
            - "CoverageShift.${s3_id}.status == SCHEDULED"
            - "CoverageShift.${s3_id}.guard_id == ${guard_id}"
            - "Guard.${guard_id}.committed_hours == 12.0"

      - name: post_aggregate_capacity_with_adjacency_allowed
        grounds:
          - validations[priority=16]
          - errors[ERR_POST_CAPACITY_EXCEEDED]
          - entities.Post.fields.max_concurrent_guards
          - endpoints[POST /shifts]
        distinguishing_aspect: |
          Different interval semantics on a different resource entity (Post, not Guard): AGGREGATE-CAPACITY
          geometry with zero buffer — overlapping shifts are counted against max_concurrent_guards and an
          adjacency at end == start does NOT intersect, so a 16:00→20:00 shift is accepted on a capacity-1 post
          that already holds an 08:00→16:00 shift, while a 12:00→20:00 shift is rejected.
        test_recipe:
          setup:
            - "Post Turnstile at site Nova has max_concurrent_guards == 1."
            - "One shift 2026-05-04T08:00Z→16:00Z already exists on the post (OPEN_UNFILLED, no guard assigned — capacity is a property of the post, not of any guard)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /clients"
              payload: { name: "Nova Transit", margin_floor_pct: 20.0 }
              as: AccountManager
              captures: { client_id: $.data.id }
            - call: "POST /sites"
              payload: { client_id: "${client_id}", name: "Nova Station" }
              as: AccountManager
              captures: { site_id: $.data.id }
            - call: "POST /posts"
              payload: { site_id: "${site_id}", name: "Turnstile", bill_rate_cents_per_hour: 4500, max_concurrent_guards: 1, required_cert_codes: [], checkpoint_tag_uids: [], tour_compliance_floor_pct: 80.0 }
              as: AccountManager
              captures: { post_id: $.data.id }
            - call: "POST /shifts"
              payload: { post_id: "${post_id}", scheduled_start_at: "2026-05-04T08:00:00Z", scheduled_end_at: "2026-05-04T16:00:00Z", planned_break_minutes: 0 }
              as: Scheduler
              captures: { s1_id: $.data.id }
          trigger:
            - call: "POST /shifts"
              payload: { post_id: "${post_id}", scheduled_start_at: "2026-05-04T12:00:00Z", scheduled_end_at: "2026-05-04T20:00:00Z", planned_break_minutes: 0 }
              as: Scheduler
            - call: "POST /shifts"
              payload: { post_id: "${post_id}", scheduled_start_at: "2026-05-04T16:00:00Z", scheduled_end_at: "2026-05-04T20:00:00Z", planned_break_minutes: 0 }
              as: Scheduler
              captures: { s3_id: $.data.id }
          assert:
            - "First trigger call: HTTP status == 409"
            - "First trigger call: data.error_id == 'ERR_POST_CAPACITY_EXCEEDED'"
            - "Second trigger call (adjacent, end == start): HTTP status == 201"
            - "CoverageShift.${s3_id}.status == OPEN_UNFILLED"
            - "CoverageShift.${s3_id}.scheduled_hours == 4.0"
            - "GET /shifts?post_id=${post_id} returns total_count == 2"

  # =========================================================================
  # Rule 9 — Compensating-action invariants across different conserved quantities
  # =========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: invoice_issue_then_void_restores_client_money_ledger
        grounds:
          - calculations.client_balances
          - state_machines.Invoice.DRAFT_to_ISSUED
          - state_machines.Invoice.ISSUED_to_VOID
          - entities.Client.fields.outstanding_balance_cents
          - entities.Client.fields.paid_to_date_cents
        distinguishing_aspect: |
          Conserved quantity #1 — MONEY: Client.outstanding_balance_cents + Client.paid_to_date_cents must equal
          the sum of total_cents over the client's invoices in {ISSUED, DISPUTED, ADJUSTED, PAID}; ISSUE (0 → 37665)
          followed by its compensating VOID returns the pair to exactly (0, 0) with zero drift.
