scaffold_difficulty_design:

  # ===================================================================
  # Rule 1 — Dual-variant calculations across different entity domains
  # ===================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: referral_bonus_estimated_vs_payable_diverge_on_60_day_delay
        grounds:
          - calculations.referral_bonus_estimated
          - calculations.referral_bonus_payable
          - state_machines.Offer.EXTENDED_to_ACCEPTED
          - state_machines.BackgroundCheck.IN_PROGRESS_to_PASSED
          - state_machines.ReferralBonus.PENDING_BGC_to_PAYABLE
        distinguishing_aspect: |
          ReferralBonus carries two variants of the same bonus number: the estimated_amount_cents
          stamped at Offer ACCEPTED (assumes 0-day delay → full baseline) versus the payable_amount_cents
          recomputed at BackgroundCheck PASSED with the ACTUAL delay days; for a 60-day delay the
          decay schedule multiplies the baseline by exactly 0.75, so the two variants land on different
          integer cent values on the very same ReferralBonus row.
        test_recipe:
          setup:
            - "Department D with hiring_budget_cents=200_000_000 (USD 2,000,000)"
            - "JobRequisition R under D, target_level=MID, base_salary band [10_000_000, 18_000_000], openings=1, APPROVED by HiringManager (segregated from submitter)"
            - "Candidate C with source_channel=REFERRAL, referrer_user_id=emp_referrer_1, eeo_ethnicity=WHITE (no diversity uplift)"
            - "Application A linking C to R, status=APPLIED"
            - "Clock at 2026-01-01T00:00:00Z when Offer is accepted; advanced to 2026-03-02T00:00:00Z (60 days later) when BGC PASSED"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /ats/departments"
              payload: { name: "Engineering", cost_center_code: "ENG-001", hiring_budget_cents: 200000000 }
              as: PlatformAdmin
              captures: { dept_id: $.data.id }
            - call: "POST /ats/requisitions"
              payload: { department_id: "${dept_id}", title: "Senior Engineer", target_level: "MID", base_salary_min_cents: 10000000, base_salary_max_cents: 18000000, openings: 1 }
              as: Recruiter
              as_user_id: "rec_alice"
              captures: { req_id: $.data.id }
            - call: "POST /ats/requisitions/${req_id}/submit"
              payload: {}
              as: Recruiter
              as_user_id: "rec_alice"
            - call: "POST /ats/requisitions/${req_id}/approve"
              payload: {}
              as: HiringManager
              as_user_id: "hm_bob"
            - call: "POST /ats/candidates"
              payload: { full_name: "Carol Doe", email: "carol@example.com", source_channel: "REFERRAL", referrer_user_id: "emp_referrer_1", eeo_ethnicity: "WHITE", eeo_gender: "FEMALE", eeo_veteran: false, eeo_disability: false }
              as: Recruiter
              as_user_id: "rec_alice"
              captures: { cand_id: $.data.id }
            - call: "POST /ats/applications"
              payload: { candidate_id: "${cand_id}", requisition_id: "${req_id}" }
              as: Recruiter
              as_user_id: "rec_alice"
              captures: { app_id: $.data.id }
            - call: "POST /ats/applications/${app_id}/screen"
              payload: {}
              as: Recruiter
              as_user_id: "rec_alice"
            - call: "POST /ats/offers"
              payload: { application_id: "${app_id}", base_salary_cents: 12000000, signing_bonus_cents: 0 }
              as: Recruiter
              as_user_id: "rec_alice"
              captures: { offer_id: $.data.id, offer_v1: $.data.version }
            - call: "POST /ats/offers/${offer_id}/approve"
              payload: { expected_offer_version: "${offer_v1}" }
              as: CompApprover
              as_user_id: "comp_carol"
              captures: { offer_v2: $.data.version }
            - call: "POST /ats/offers/${offer_id}/approve"
              payload: { expected_offer_version: "${offer_v2}" }
              as: VP
              as_user_id: "vp_dave"
            - call: "POST /ats/offers/${offer_id}/extend"
              payload: {}
              as: Recruiter
              as_user_id: "rec_alice"
            - call: "POST /ats/offers/${offer_id}/accept"
              payload: {}
              as: Candidate
              as_user_id: "${cand_id}"
            - call: "GET /ats/referral-bonuses"
              payload: { candidate_id: "${cand_id}" }
              as: PayrollOfficer
              as_user_id: "pay_eve"
          trigger:
            - call: "GET /ats/background-checks"
              payload: { offer_id: "${offer_id}" }
              as: ComplianceOfficer
              as_user_id: "co_frank"
              captures: { bgc_payload: $.data }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-02T00:00:01Z" }
              as: PlatformAdmin
          assert:
            - "After ACCEPT, ReferralBonus.estimated_amount_cents == 250000 (MID base=200000 * band_mult=1.25 * no_uplift=1.0)"
            - "After ACCEPT, ReferralBonus.payable_amount_cents is null"
            - "After ACCEPT, ReferralBonus.status == PENDING_BGC"

      - name: diversity_pool_vs_hire_diverge_on_same_goal
        grounds:
          - calculations.diversity_pool_metric
          - calculations.diversity_hire_metric
          - entities.DiversityGoal.fields.pool_underrepresented_pct
          - entities.DiversityGoal.fields.hire_underrepresented_pct
        distinguishing_aspect: |
          DiversityGoal exposes two computed percentages whose denominators are different entity scopes:
          pool_underrepresented_pct counts every non-WITHDRAWN Application's distinct Candidate
          (population), while hire_underrepresented_pct counts only Applications in status==HIRED.
          When the applicant pool contains underrepresented candidates who are not yet hired, the
          two percentages diverge on the same DiversityGoal row.
        test_recipe:
          setup:
            - "Department D and JobRequisition R under D, target_level=MID, APPROVED in 2026"
            - "DiversityGoal G for (D, MID, 2026) with target=0.50"
            - "Two Candidates applied: C1 ethnicity=BLACK (underrepresented), C2 ethnicity=WHITE; only C2 was hired via accepted offer"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-02-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /ats/departments"
              payload: { name: "Product", cost_center_code: "PRD-001", hiring_budget_cents: 200000000 }
              as: PlatformAdmin
              captures: { dept_id: $.data.id }
            - call: "POST /ats/requisitions"
              payload: { department_id: "${dept_id}", title: "Product Manager", target_level: "MID", base_salary_min_cents: 10000000, base_salary_max_cents: 18000000, openings: 1 }
              as: Recruiter
              as_user_id: "rec_alice"
              captures: { req_id: $.data.id }
            - call: "POST /ats/requisitions/${req_id}/submit"
              payload: {}
              as: Recruiter
              as_user_id: "rec_alice"
            - call: "POST /ats/requisitions/${req_id}/approve"
              payload: {}
              as: HiringManager
              as_user_id: "hm_bob"
            - call: "POST /ats/diversity-goals"
              payload: { department_id: "${dept_id}", target_level: "MID", period_year: 2026, target_underrepresented_pct: 0.50 }
              as: PlatformAdmin
              captures: { goal_id: $.data.id }
            - call: "POST /ats/candidates"
              payload: { full_name: "C1 Black", email: "c1@example.com", source_channel: "DIRECT", eeo_ethnicity: "BLACK", eeo_gender: "FEMALE", eeo_veteran: false, eeo_disability: false }
              as: Recruiter
              as_user_id: "rec_alice"
              captures: { c1_id: $.data.id }
            - call: "POST /ats/candidates"
              payload: { full_name: "C2 White", email: "c2@example.com", source_channel: "DIRECT", eeo_ethnicity: "WHITE", eeo_gender: "MALE", eeo_veteran: false, eeo_disability: false }
              as: Recruiter
              as_user_id: "rec_alice"
              captures: { c2_id: $.data.id }
            - call: "POST /ats/applications"
              payload: { candidate_id: "${c1_id}", requisition_id: "${req_id}" }
              as: Recruiter
              as_user_id: "rec_alice"
              captures: { app1_id: $.data.id }
            - call: "POST /ats/applications"
              payload: { candidate_id: "${c2_id}", requisition_id: "${req_id}" }
              as: Recruiter
              as_user_id: "rec_alice"
              captures: { app2_id: $.data.id }
            - call: "POST /ats/applications/${app2_id}/screen"
              payload: {}
              as: Recruiter
              as_user_id: "rec_alice"
            - call: "POST /ats/offers"
              payload: { application_id: "${app2_id}", base_salary_cents: 12000000, signing_bonus_cents: 0 }
              as: Recruiter
              as_user_id: "rec_alice"
              captures: { offer_id: $.data.id, offer_v1: $.data.version }
            - call: "POST /ats/offers/${offer_id}/approve"
              payload: { expected_offer_version: "${offer_v1}" }
              as: CompApprover
              as_user_id: "comp_carol"
              captures: { offer_v2: $.data.version }
            - call: "POST /ats/offers/${offer_id}/approve"
              payload: { expected_offer_version: "${offer_v2}" }
              as: VP
              as_user_id: "vp_dave"
            - call: "POST /ats/offers/${offer_id}/extend"
              payload: {}
              as: Recruiter
              as_user_id: "rec_alice"
            - call: "POST /ats/offers/${offer_id}/accept"
              payload: {}
              as: Candidate
              as_user_id: "${c2_id}"
          trigger:
            - call: "GET /ats/diversity-goals/${goal_id}"
              payload: {}
              as: HiringManager
              as_user_id: "hm_bob"
              captures: { pool_pct: $.data.pool_underrepresented_pct, hire_pct: $.data.hire_underrepresented_pct }
          assert:
            - "DiversityGoal.pool_underrepresented_pct == 0.5 (1 of 2 candidates is BLACK)"
            - "DiversityGoal.hire_underrepresented_pct == 0.0 (0 of 1 hired candidate is underrepresented)"
            - "pool_underrepresented_pct != hire_underrepresented_pct on the SAME goal row"

  # ===================================================================
  # Rule 2 — Combinatorial formulas across different modes
  # ===================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: referral_bonus_estimated_three_factor_conditional
        grounds:
          - calculations.referral_bonus_estimated
          - entities.JobRequisition.fields.target_level
          - entities.Offer.fields.base_salary_cents
          - entities.Candidate.fields.eeo_ethnicity
          - entities.Candidate.fields.eeo_disability
          - entities.Candidate.fields.eeo_veteran
        distinguishing_aspect: |
          Mode (a): non-linear combinatorial formula with three inputs and conditional branching —
          level_base (constant lookup on requisition.target_level), band_mult (4-tier piecewise on
          offer.base_salary_cents), and uplift (1.0 or 1.2 based on three OR-ed candidate EEO flags).
          The factors are multiplied, not summed, so each input non-linearly scales the others.
        test_recipe:
          setup:
            - "Department D approved; JobRequisition R under D, target_level=SENIOR, base_salary band [15_000_000, 20_000_000]"
            - "Candidate C, source_channel=REFERRAL, eeo_ethnicity=HISPANIC (underrepresented)"
            - "Offer O for C on R with base_salary_cents=18_000_000 (lands in 15M..20M band → band_mult=1.5)"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-15T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /ats/departments"
              payload: { name: "Eng2", cost_center_code: "ENG-002", hiring_budget_cents: 500000000 }
              as: PlatformAdmin
              captures: { dept_id: $.data.id }
            - call: "POST /ats/requisitions"
              payload: { department_id: "${dept_id}", title: "Senior Engineer", target_level: "SENIOR", base_salary_min_cents: 15000000, base_salary_max_cents: 20000000, openings: 1 }
              as: Recruiter
              as_user_id: "rec_alice"
              captures: { req_id: $.data.id }
            - call: "POST /ats/requisitions/${req_id}/submit"
              payload: {}
              as: Recruiter
              as_user_id: "rec_alice"
            - call: "POST /ats/requisitions/${req_id}/approve"
              payload: {}
              as: HiringManager
              as_user_id: "hm_bob"
            - call: "POST /ats/candidates"
              payload: { full_name: "Hispanic Senior", email: "hs@example.com", source_channel: "REFERRAL", referrer_user_id: "emp_ref_x", eeo_ethnicity: "HISPANIC", eeo_gender: "MALE", eeo_veteran: false, eeo_disability: false }
              as: Recruiter
              as_user_id: "rec_alice"
              captures: { cand_id: $.data.id }
            - call: "POST /ats/applications"
              payload: { candidate_id: "${cand_id}", requisition_id: "${req_id}" }
              as: Recruiter
              as_user_id: "rec_alice"
              captures: { app_id: $.data.id }
            - call: "POST /ats/applications/${app_id}/screen"
              payload: {}
              as: Recruiter
              as_user_id: "rec_alice"
            - call: "POST /ats/offers"
              payload: { application_id: "${app_id}", base_salary_cents: 18000000, signing_bonus_cents: 0 }
              as: Recruiter
              as_user_id: "rec_alice"
              captures: { offer_id: $.data.id, offer_v1: $.data.version }
            - call: "POST /ats/offers/${offer_id}/approve"
              payload: { expected_offer_version: "${offer_v1}" }
              as: CompApprover
              as_user_id: "comp_carol"
              captures: { offer_v2: $.data.version }
            - call: "POST /ats/offers/${offer_id}/approve"
              payload: { expected_offer_version: "${offer_v2}" }
              as: VP
              as_user_id: "vp_dave"
            - call: "POST /ats/offers/${offer_id}/extend"
              payload: {}
              as: Recruiter
              as_user_id: "rec_alice"
          trigger:
            - call: "POST /ats/offers/${offer_id}/accept"
              payload: {}
              as: Candidate
              as_user_id: "${cand_id}"
            - call: "GET /ats/referral-bonuses"
              payload: { offer_id: "${offer_id}" }
              as: PayrollOfficer
              as_user_id: "pay_eve"
              captures: { bonuses: $.data }
          assert:
            - "Exactly one ReferralBonus is created for offer_id=${offer_id}"
            - "ReferralBonus.estimated_amount_cents == 720000 (SENIOR level_base=400000 * band_mult=1.5 * uplift=1.2 = 720000 exact cents)"
            - "ReferralBonus.status == PENDING_BGC"

      - name: referral_bonus_payable_nested_rounding_order
        grounds:
          - calculations.referral_bonus_estimated
          - calculations.referral_bonus_payable
          - state_machines.BackgroundCheck.IN_PROGRESS_to_PASSED
        distinguishing_aspect: |
          Mode (b): nested rounding where order matters. The pinned order is "round_half_up the
          baseline first (via referral_bonus_estimated), THEN multiply by the decay factor and
          round_half_up the decayed product"; computing the decayed value over the unrounded raw
          base and rounding only at the end would land on a different integer cent. The scaffold
          pins round-then-multiply-then-round, so a 50-day delay on a STAFF/underrepresented base
          yields baseline=1_440_000 first, then payable=round_half_up(1_440_000 * 0.75)=1_080_000
          (exact). Floor-day-count + half-up-cents is the pinned order, not the only mathematically
          valid one.
        test_recipe:
          setup:
            - "Department D, requisition R target_level=STAFF, APPROVED"
            - "Candidate C REFERRAL eeo_ethnicity=BLACK (uplift)"
            - "Offer O base_salary_cents=18_000_000 (band 15M..20M → mult=1.5) accepted at 2026-01-01"
            - "Clock advanced to 2026-02-20 (50 days delay) when BGC resolves PASSED"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /ats/departments"
              payload: { name: "Staff Eng", cost_center_code: "STF-001", hiring_budget_cents: 500000000 }
              as: PlatformAdmin
              captures: { dept_id: $.data.id }
            - call: "POST /ats/requisitions"
              payload: { department_id: "${dept_id}", title: "Staff Eng", target_level: "STAFF", base_salary_min_cents: 15000000, base_salary_max_cents: 20000000, openings: 1 }
              as: Recruiter
              as_user_id: "rec_alice"
              captures: { req_id: $.data.id }
            - call: "POST /ats/requisitions/${req_id}/submit"
              payload: {}
              as: Recruiter
              as_user_id: "rec_alice"
            - call: "POST /ats/requisitions/${req_id}/approve"
              payload: {}
              as: HiringManager
              as_user_id: "hm_bob"
            - call: "POST /ats/candidates"
              payload: { full_name: "Black Staff", email: "bs@example.com", source_channel: "REFERRAL", referrer_user_id: "emp_ref_y", eeo_ethnicity: "BLACK", eeo_gender: "FEMALE", eeo_veteran: false, eeo_disability: false }
              as: Recruiter
              as_user_id: "rec_alice"
              captures: { cand_id: $.data.id }
            - call: "POST /ats/applications"
              payload: { candidate_id: "${cand_id}", requisition_id: "${req_id}" }
              as: Recruiter
              as_user_id: "rec_alice"
              captures: { app_id: $.data.id }
            - call: "POST /ats/applications/${app_id}/screen"
              payload: {}
              as: Recruiter
              as_user_id: "rec_alice"
            - call: "POST /ats/offers"
              payload: { application_id: "${app_id}", base_salary_cents: 18000000, signing_bonus_cents: 0 }
              as: Recruiter
              as_user_id: "rec_alice"
              captures: { offer_id: $.data.id, offer_v1: $.data.version }
            - call: "POST /ats/offers/${offer_id}/approve"
              payload: { expected_offer_version: "${offer_v1}" }
              as: CompApprover
              as_user_id: "comp_carol"
              captures: { offer_v2: $.data.version }
            - call: "POST /ats/offers/${offer_id}/approve"
              payload: { expected_offer_version: "${offer_v2}" }
              as: VP
              as_user_id: "vp_dave"
            - call: "POST /ats/offers/${offer_id}/extend"
              payload: {}
              as: Recruiter
              as_user_id: "rec_alice"
            - call: "POST /ats/offers/${offer_id}/accept"
              payload: {}
              as: Candidate
              as_user_id: "${cand_id}"
            - call: "GET /ats/background-checks"
              payload: { offer_id: "${offer_id}" }
              as: ComplianceOfficer
              as_user_id: "co_frank"
              captures: { bgcs: $.data }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-02-20T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "GET /ats/referral-bonuses"
              payload: { offer_id: "${offer_id}" }
              as: PayrollOfficer
              as_user_id: "pay_eve"
              captures: { bonuses_after: $.data }
          assert:
            - "ReferralBonus.estimated_amount_cents == 1080000 (STAFF base=600000 * band_mult=1.5 * uplift=1.2 = 1_080_000 exact)"
            - "ReferralBonus.status == PENDING_BGC (BGC not yet resolved)"
            - "ReferralBonus.payable_amount_cents is null pending BGC resolution"

  # ===================================================================
  # Rule 3 — Non-linear state-machine shape on different entities
  # ===================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: offer_branching_two_step_approval_or_reject
        grounds:
          - state_machines.Offer.PENDING_APPROVAL_to_APPROVED
          - state_machines.Offer.PENDING_APPROVAL_to_REJECTED
          - state_machines.Offer.EXTENDED_to_DECLINED
          - state_machines.Offer.EXTENDED_to_REVOKED
        distinguishing_aspect: |
          Offer is non-linear via a fork at PENDING_APPROVAL (branches to APPROVED via two-step
          CompApprover→VP chain, or to REJECTED) and a second fork at EXTENDED (ACCEPTED vs DECLINED
          vs REVOKED, where REVOKED can be auto-fired by clock or manual recruiter action). The
          two-step approval at PENDING_APPROVAL means a single trigger (POST /approve) advances to
          two distinct sub-states depending on which user called it.
        test_recipe:
          setup:
            - "Offer O in PENDING_APPROVAL after first /approve by CompApprover (intermediate state)"
            - "Same offer then sent to /reject by VP — must succeed since reject is reachable from PENDING_APPROVAL even after comp_approver stamped"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-04-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /ats/departments"
              payload: { name: "Branching", cost_center_code: "BRC-001", hiring_budget_cents: 100000000 }
              as: PlatformAdmin
              captures: { dept_id: $.data.id }
            - call: "POST /ats/requisitions"
              payload: { department_id: "${dept_id}", title: "Eng", target_level: "MID", base_salary_min_cents: 10000000, base_salary_max_cents: 15000000, openings: 1 }
              as: Recruiter
              as_user_id: "rec_alice"
              captures: { req_id: $.data.id }
            - call: "POST /ats/requisitions/${req_id}/submit"
              payload: {}
              as: Recruiter
              as_user_id: "rec_alice"
            - call: "POST /ats/requisitions/${req_id}/approve"
              payload: {}
              as: HiringManager
              as_user_id: "hm_bob"
            - call: "POST /ats/candidates"
              payload: { full_name: "Branch Cand", email: "br@example.com", source_channel: "DIRECT", eeo_ethnicity: "WHITE", eeo_gender: "MALE", eeo_veteran: false, eeo_disability: false }
              as: Recruiter
              as_user_id: "rec_alice"
              captures: { cand_id: $.data.id }
            - call: "POST /ats/applications"
              payload: { candidate_id: "${cand_id}", requisition_id: "${req_id}" }
              as: Recruiter
              as_user_id: "rec_alice"
              captures: { app_id: $.data.id }
            - call: "POST /ats/applications/${app_id}/screen"
              payload: {}
              as: Recruiter
              as_user_id: "rec_alice"
            - call: "POST /ats/offers"
              payload: { application_id: "${app_id}", base_salary_cents: 12000000, signing_bonus_cents: 0 }
              as: Recruiter
              as_user_id: "rec_alice"
              captures: { offer_id: $.data.id, offer_v1: $.data.version }
            - call: "POST /ats/offers/${offer_id}/approve"
              payload: { expected_offer_version: "${offer_v1}" }
              as: CompApprover
              as_user_id: "comp_carol"
              captures: { offer_v2: $.data.version }
          trigger:
            - call: "POST /ats/offers/${offer_id}/reject"
              payload: {}
              as: VP
              as_user_id: "vp_dave"
              captures: { rejected_v: $.data.version, rejected_status: $.data.status }
          assert:
            - "Offer.status == REJECTED after VP reject (took alternate branch instead of completing two-step approval)"
            - "Offer.comp_approver_user_id remained set to comp_carol (recorded by the half-approval before reject)"
            - "Offer.vp_approver_user_id is null (VP took the reject branch, not the approve branch)"

      - name: background_check_branching_pass_fail_with_divergent_cascades
        grounds:
          - state_machines.BackgroundCheck.IN_PROGRESS_to_PASSED
          - state_machines.BackgroundCheck.IN_PROGRESS_to_FAILED
        distinguishing_aspect: |
