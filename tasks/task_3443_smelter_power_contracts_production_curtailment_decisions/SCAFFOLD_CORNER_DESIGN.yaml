    distinguishing_aspect: Close is a TradingAnalyst exclusive; EnergyManager (a peer desk) is denied even on an existing
      OPEN hedge.
    test_recipe:
      setup:
      - Smelter with one OPEN hedge.
      setup_api_calls:
      - call: POST /smelter-ops/smelters
