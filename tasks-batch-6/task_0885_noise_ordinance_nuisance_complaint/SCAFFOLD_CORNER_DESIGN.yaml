# =============================================================================
# §1.9 Scaffold Corner Design (breadth coverage of non-difficulty claims)
# Walks references/claim-extraction-guide.md against SCAFFOLD.yaml §1.1-§1.7.
# excluded_because stubs point at §1.8 instances (by name) that already cover.
# Logical-clock startup default: 2026-05-01T00:00:00Z.
# =============================================================================
scaffold_corner_design:

  # ---------------------------------------------------------------------------
  - section: entities
    instances:
      - name: property_create_returns_all_fields
        claim_type: Creation
        grounds: [entities.Property, endpoints]
        distinguishing_aspect: "POST /properties with address + zoning_type returns 201 with server-minted id/version and computed chronic_status=NONE, abatement_status=NONE, substantiated_violation_count=0."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "POST /properties", payload: { address: "100 Main St", zoning_type: "RESIDENTIAL" }, as: CodeOfficer, captures: { pid: "$.data.id", ver: "$.data.version" } }
          assert:
            - "HTTP 201; Property.${pid}.chronic_status == NONE"
            - "Property.${pid}.abatement_status == NONE"
            - "Property.${pid}.substantiated_violation_count == 0"
            - "Property.${pid}.version == 1"

      - name: property_get_not_found
        claim_type: Not Found
        grounds: [entities.Property, "errors[ERR_PROPERTY_NOT_FOUND]"]
        distinguishing_aspect: "GET /properties/{unknown-uuid} returns 404 ERR_PROPERTY_NOT_FOUND."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "GET /properties/00000000-0000-4000-8000-000000000000", payload: {}, as: CodeOfficer, captures: { err: "$.data.error_id" } }
          assert:
            - "HTTP 404; data.error_id == ERR_PROPERTY_NOT_FOUND"

      - name: property_missing_required_zoning_returns_validation
        claim_type: Required Fields
        grounds: [entities.Property.fields.zoning_type, "errors[ERR_VALIDATION]"]
        distinguishing_aspect: "POST /properties omitting the required zoning_type returns 400 ERR_VALIDATION."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "POST /properties", payload: { address: "no zoning" }, as: CodeOfficer, captures: { err: "$.data.error_id" } }
          assert:
            - "HTTP 400; data.error_id == ERR_VALIDATION"

      - name: complaint_invalid_enum_noise_type_rejected
        claim_type: Type Constraints
        grounds: [entities.Complaint.fields.noise_type, "errors[ERR_INVALID_ENUM]"]
        distinguishing_aspect: "POST /complaints with noise_type outside the declared set returns 400 ERR_INVALID_ENUM."
        test_recipe:
          setup: ["a property exists"]
          setup_api_calls:
            - { call: "POST /properties", payload: { address: "101 Main St", zoning_type: "RESIDENTIAL" }, as: CodeOfficer, captures: { pid: "$.data.id" } }
          trigger:
            - { call: "POST /complaints", payload: { property_id: "${pid}", reported_at: "2026-06-01T12:00:00Z", noise_type: "JACKHAMMER" }, as: CodeOfficer, captures: { err: "$.data.error_id" } }
          assert:
            - "HTTP 400; data.error_id == ERR_INVALID_ENUM"

      - name: inspection_is_immutable_no_version_field
        claim_type: Immutability
        grounds: [entities.Inspection]
        distinguishing_aspect: "Inspection has common_fields:false — its response carries id and created_at but no version/updated_at, and there is no update endpoint."
        test_recipe:
          setup: ["policy + property + reviewed complaint"]
          setup_api_calls:
            - { call: "POST /noise-policies", payload: { zoning_type: "RESIDENTIAL", day_limit_db: 55, night_limit_db: 45, day_start_hour: 7, night_start_hour: 22 }, as: SystemAdmin }
            - { call: "POST /properties", payload: { address: "102 Main St", zoning_type: "RESIDENTIAL" }, as: CodeOfficer, captures: { pid: "$.data.id" } }
            - { call: "POST /complaints", payload: { property_id: "${pid}", reported_at: "2026-06-01T12:00:00Z", noise_type: "ANIMAL" }, as: CodeOfficer, captures: { cid: "$.data.id" } }
            - { call: "POST /complaints/${cid}/review", payload: {}, as: CodeOfficer }
          trigger:
            - { call: "POST /complaints/${cid}/inspections", payload: { measured_decibel: 70, measured_at: "2026-06-01T12:00:00Z" }, as: CodeOfficer, captures: { iid: "$.data.id" } }
          assert:
            - "HTTP 201; Inspection.${iid} response has id and created_at but no version field"

      - name: policy_duplicate_zoning_rejected
        claim_type: Type Constraints
        grounds: [entities.NoiseLimitPolicy.fields.zoning_type, "errors[ERR_DUPLICATE_POLICY]"]
        distinguishing_aspect: "A second NoiseLimitPolicy for an already-configured zoning_type returns 409 ERR_DUPLICATE_POLICY."
        test_recipe:
          setup: ["a COMMERCIAL policy exists"]
          setup_api_calls:
            - { call: "POST /noise-policies", payload: { zoning_type: "COMMERCIAL", day_limit_db: 65, night_limit_db: 55, day_start_hour: 7, night_start_hour: 22 }, as: SystemAdmin }
          trigger:
            - { call: "POST /noise-policies", payload: { zoning_type: "COMMERCIAL", day_limit_db: 70, night_limit_db: 60, day_start_hour: 7, night_start_hour: 22 }, as: SystemAdmin, captures: { err: "$.data.error_id" } }
          assert:
            - "HTTP 409; data.error_id == ERR_DUPLICATE_POLICY"

  # ---------------------------------------------------------------------------
  - section: state_machines
    instances:
      - name: contest_warning_rejected_not_citation
        claim_type: Invalid Transitions
        grounds: [state_machines.Enforcement.ISSUED_to_CONTESTED, "errors[ERR_ENFORCEMENT_NOT_CITATION]"]
        distinguishing_aspect: "A first-offense WARNING (tier WARNING) cannot be contested — POST /enforcements/{id}/contest returns 409 ERR_ENFORCEMENT_NOT_CITATION."
        test_recipe:
          setup: ["a single substantiation producing a WARNING enforcement"]
          setup_api_calls:
            - { call: "POST /noise-policies", payload: { zoning_type: "RESIDENTIAL", day_limit_db: 55, night_limit_db: 45, day_start_hour: 7, night_start_hour: 22 }, as: SystemAdmin }
            - { call: "POST /properties", payload: { address: "103 Main St", zoning_type: "RESIDENTIAL" }, as: CodeOfficer, captures: { pid: "$.data.id" } }
            - { call: "POST /complaints", payload: { property_id: "${pid}", reported_at: "2026-06-01T12:00:00Z", noise_type: "ANIMAL" }, as: CodeOfficer, captures: { cid: "$.data.id" } }
            - { call: "POST /complaints/${cid}/review", payload: {}, as: CodeOfficer }
            - { call: "POST /complaints/${cid}/inspections", payload: { measured_decibel: 70, measured_at: "2026-06-01T12:00:00Z" }, as: CodeOfficer }
            - { call: "POST /complaints/${cid}/substantiate", payload: {}, as: CodeOfficer, as_user_id: "officer-1", captures: { enf: "$.data.id", tier: "$.data.tier" } }
          trigger:
            - { call: "POST /enforcements/${enf}/contest", payload: {}, as: Resident, captures: { err: "$.data.error_id" } }
          assert:
            - "Enforcement.${enf}.tier == WARNING"
            - "HTTP 409; data.error_id == ERR_ENFORCEMENT_NOT_CITATION"

      - name: decide_already_decided_hearing_not_pending
        claim_type: Idempotency
        grounds: [state_machines.Hearing.PENDING_to_UPHELD, "errors[ERR_HEARING_NOT_PENDING]"]
        distinguishing_aspect: "Deciding a hearing whose outcome is already UPHELD returns 409 ERR_HEARING_NOT_PENDING on the second decide."
        test_recipe:
          setup: ["a level-1 CITATION contested, hearing scheduled and decided UPHELD by a different officer"]
          setup_api_calls:
            - { call: "POST /noise-policies", payload: { zoning_type: "COMMERCIAL", day_limit_db: 65, night_limit_db: 55, day_start_hour: 7, night_start_hour: 22 }, as: SystemAdmin }
            - { call: "POST /properties", payload: { address: "104 Main St", zoning_type: "COMMERCIAL" }, as: CodeOfficer, captures: { pid: "$.data.id" } }
            - { call: "POST /complaints", payload: { property_id: "${pid}", reported_at: "2026-05-10T12:00:00Z", noise_type: "AMPLIFIED_MUSIC" }, as: CodeOfficer, captures: { c1: "$.data.id" } }
            - { call: "POST /complaints/${c1}/review", payload: {}, as: CodeOfficer }
            - { call: "POST /complaints/${c1}/inspections", payload: { measured_decibel: 80, measured_at: "2026-05-10T12:00:00Z" }, as: CodeOfficer }
            - { call: "POST /complaints/${c1}/substantiate", payload: {}, as: CodeOfficer, as_user_id: "officer-1" }
            - { call: "POST /complaints", payload: { property_id: "${pid}", reported_at: "2026-05-11T12:00:00Z", noise_type: "AMPLIFIED_MUSIC" }, as: CodeOfficer, captures: { c2: "$.data.id" } }
            - { call: "POST /complaints/${c2}/review", payload: {}, as: CodeOfficer }
            - { call: "POST /complaints/${c2}/inspections", payload: { measured_decibel: 80, measured_at: "2026-05-11T12:00:00Z" }, as: CodeOfficer }
            - { call: "POST /complaints/${c2}/substantiate", payload: {}, as: CodeOfficer, as_user_id: "officer-1", captures: { enf: "$.data.id" } }
            - { call: "POST /enforcements/${enf}/contest", payload: {}, as: Resident }
            - { call: "POST /enforcements/${enf}/hearings", payload: { scheduled_at: "2026-05-20T10:00:00Z", hearing_officer_id: "hof-9" }, as: HearingOfficer, captures: { hid: "$.data.id" } }
            - { call: "POST /hearings/${hid}/decide", payload: { outcome: "UPHELD" }, as: HearingOfficer, as_user_id: "hof-9" }
          trigger:
            - { call: "POST /hearings/${hid}/decide", payload: { outcome: "DISMISSED" }, as: HearingOfficer, as_user_id: "hof-9", captures: { err: "$.data.error_id" } }
          assert:
            - "HTTP 409; data.error_id == ERR_HEARING_NOT_PENDING"

      - name: variance_issue_from_denied_rejected
        claim_type: Invalid Transitions
        grounds: [state_machines.VariancePermit.UNDER_REVIEW_to_ISSUED, "errors[ERR_VARIANCE_NOT_UNDER_REVIEW]"]
        distinguishing_aspect: "Issuing a variance that has already been DENIED returns 409 ERR_VARIANCE_NOT_UNDER_REVIEW."
        test_recipe:
          setup: ["a denied variance"]
          setup_api_calls:
            - { call: "POST /properties", payload: { address: "105 Main St", zoning_type: "COMMERCIAL" }, as: CodeOfficer, captures: { pid: "$.data.id" } }
            - { call: "POST /variance-permits", payload: { property_id: "${pid}", permit_type: "CONSTRUCTION", requested_start: "2026-06-01T00:00:00Z", requested_end: "2026-06-05T00:00:00Z", permitted_max_db: 90 }, as: PermitClerk, captures: { vid: "$.data.id" } }
            - { call: "POST /variance-permits/${vid}/deny", payload: {}, as: PermitClerk }
          trigger:
            - { call: "POST /variance-permits/${vid}/issue", payload: {}, as: PermitClerk, captures: { err: "$.data.error_id" } }
          assert:
            - "HTTP 409; data.error_id == ERR_VARIANCE_NOT_UNDER_REVIEW"

      - name: escalate_before_deadline_rejected
        claim_type: Precondition Enforcement
        grounds: [state_machines.AbatementOrder.PENDING_to_ESCALATED, "errors[ERR_ABATEMENT_DEADLINE_NOT_REACHED]"]
        distinguishing_aspect: "Escalating a manual AbatementOrder before its compliance_deadline (clock at default 2026-05-01) returns 409 ERR_ABATEMENT_DEADLINE_NOT_REACHED."
        test_recipe:
          setup: ["a property and a manual abatement order with a future compliance_deadline"]
          setup_api_calls:
            - { call: "POST /properties", payload: { address: "106 Main St", zoning_type: "COMMERCIAL" }, as: CodeOfficer, captures: { pid: "$.data.id", pv: "$.data.version" } }
            - { call: "POST /abatement-orders", payload: { property_id: "${pid}", expected_property_version: "${pv}", compliance_deadline: "2026-09-01T00:00:00Z" }, as: CodeOfficer, captures: { aid: "$.data.id" } }
          trigger:
            - { call: "POST /abatement-orders/${aid}/escalate", payload: {}, as: CodeOfficer, captures: { err: "$.data.error_id" } }
          assert:
            - "HTTP 409; data.error_id == ERR_ABATEMENT_DEADLINE_NOT_REACHED"

      - name: referral_close_then_acknowledge_invalid_state
        claim_type: Invalid Transitions
        grounds: [state_machines.CrossAgencyReferral.OPEN_to_ACKNOWLEDGED, "errors[ERR_REFERRAL_INVALID_STATE]"]
        distinguishing_aspect: "Acknowledging an already-CLOSED referral returns 409 ERR_REFERRAL_INVALID_STATE."
        test_recipe:
          setup: ["a complaint and a referral that has been closed"]
          setup_api_calls:
            - { call: "POST /properties", payload: { address: "107 Main St", zoning_type: "RESIDENTIAL" }, as: CodeOfficer, captures: { pid: "$.data.id" } }
            - { call: "POST /complaints", payload: { property_id: "${pid}", reported_at: "2026-06-01T12:00:00Z", noise_type: "OTHER" }, as: CodeOfficer, captures: { cid: "$.data.id" } }
            - { call: "POST /referrals", payload: { complaint_id: "${cid}", agency: "POLICE" }, as: CodeOfficer, captures: { rid: "$.data.id" } }
            - { call: "POST /referrals/${rid}/close", payload: {}, as: CodeOfficer }
          trigger:
            - { call: "POST /referrals/${rid}/acknowledge", payload: {}, as: CodeOfficer, captures: { err: "$.data.error_id" } }
          assert:
            - "HTTP 409; data.error_id == ERR_REFERRAL_INVALID_STATE"

      - name: substantiate_from_received_not_under_review
        claim_type: Invalid Transitions
        grounds: [state_machines.Complaint.UNDER_REVIEW_to_SUBSTANTIATED, "errors[ERR_COMPLAINT_NOT_UNDER_REVIEW]"]
        distinguishing_aspect: "Substantiating a complaint still in RECEIVED (never reviewed), with no covering variance in play, returns 409 ERR_COMPLAINT_NOT_UNDER_REVIEW (pure state, single-failure)."
        test_recipe:
          setup: ["a RECEIVED complaint, no inspection, no variance"]
          setup_api_calls:
            - { call: "POST /properties", payload: { address: "108 Main St", zoning_type: "RESIDENTIAL" }, as: CodeOfficer, captures: { pid: "$.data.id" } }
            - { call: "POST /complaints", payload: { property_id: "${pid}", reported_at: "2026-06-01T12:00:00Z", noise_type: "ANIMAL" }, as: CodeOfficer, captures: { cid: "$.data.id" } }
          trigger:
            - { call: "POST /complaints/${cid}/substantiate", payload: {}, as: CodeOfficer, as_user_id: "officer-1", captures: { err: "$.data.error_id" } }
          assert:
            - "HTTP 409; data.error_id == ERR_COMPLAINT_NOT_UNDER_REVIEW"

  # ---------------------------------------------------------------------------
  - section: calculations
    instances:
      - name: variance_fee_event_formula_correct
        claim_type: Correct Result
        grounds: [calculations.variance_fee, entities.VariancePermit.fields.fee_estimate_cents]
        distinguishing_aspect: "EVENT fee_estimate_cents = EVENT_BASE_FEE_CENTS(10000) + EVENT_PER_ATTENDEE_CENTS(50) * 200 = 20000 at creation."
        test_recipe:
          setup: ["a property"]
          setup_api_calls:
            - { call: "POST /properties", payload: { address: "109 Main St", zoning_type: "COMMERCIAL" }, as: CodeOfficer, captures: { pid: "$.data.id" } }
          trigger:
            - { call: "POST /variance-permits", payload: { property_id: "${pid}", permit_type: "EVENT", requested_start: "2026-06-05T08:00:00Z", requested_end: "2026-06-05T23:00:00Z", permitted_max_db: 90, expected_attendees: 200 }, as: PermitClerk, captures: { vid: "$.data.id", est: "$.data.fee_estimate_cents" } }
          assert:
            - "VariancePermit.${vid}.fee_estimate_cents == 20000"

      - name: night_limit_applied_correct
        claim_type: Constants Applied
        grounds: [calculations.effective_noise_limit, entities.Inspection.fields.effective_limit_db]
        distinguishing_aspect: "A reading measured at 23:00 UTC (>= night_start_hour 22) resolves effective_limit_db to the policy's night_limit_db (45 for RESIDENTIAL), not day_limit_db."
        test_recipe:
          setup: ["RESIDENTIAL policy (day 55 / night 45), property, reviewed complaint"]
          setup_api_calls:
            - { call: "POST /noise-policies", payload: { zoning_type: "RESIDENTIAL", day_limit_db: 55, night_limit_db: 45, day_start_hour: 7, night_start_hour: 22 }, as: SystemAdmin }
            - { call: "POST /properties", payload: { address: "110 Main St", zoning_type: "RESIDENTIAL" }, as: CodeOfficer, captures: { pid: "$.data.id" } }
            - { call: "POST /complaints", payload: { property_id: "${pid}", reported_at: "2026-06-01T23:00:00Z", noise_type: "AMPLIFIED_MUSIC" }, as: CodeOfficer, captures: { cid: "$.data.id" } }
            - { call: "POST /complaints/${cid}/review", payload: {}, as: CodeOfficer }
          trigger:
            - { call: "POST /complaints/${cid}/inspections", payload: { measured_decibel: 50, measured_at: "2026-06-01T23:00:00Z" }, as: CodeOfficer, captures: { lim: "$.data.effective_limit_db", exc: "$.data.exceeds_limit" } }
          assert:
            - "Inspection.effective_limit_db == 45"
            - "Inspection.exceeds_limit == true (50 > 45 night limit)"

      - name: warning_first_offense_zero_fine_correct
        claim_type: Correct Result
        grounds: [calculations.fine_escalation, entities.Enforcement.fields.tier, entities.Enforcement.fields.assessed_fine_cents]
        distinguishing_aspect: "First substantiation (escalation_level 0) yields tier WARNING and assessed_fine_cents 0."
        test_recipe:
          setup: ["policy + property + one reviewed, over-limit complaint"]
          setup_api_calls:
            - { call: "POST /noise-policies", payload: { zoning_type: "INDUSTRIAL", day_limit_db: 75, night_limit_db: 65, day_start_hour: 7, night_start_hour: 22 }, as: SystemAdmin }
            - { call: "POST /properties", payload: { address: "111 Main St", zoning_type: "INDUSTRIAL" }, as: CodeOfficer, captures: { pid: "$.data.id" } }
            - { call: "POST /complaints", payload: { property_id: "${pid}", reported_at: "2026-06-01T12:00:00Z", noise_type: "MACHINERY" }, as: CodeOfficer, captures: { cid: "$.data.id" } }
            - { call: "POST /complaints/${cid}/review", payload: {}, as: CodeOfficer }
            - { call: "POST /complaints/${cid}/inspections", payload: { measured_decibel: 90, measured_at: "2026-06-01T12:00:00Z" }, as: CodeOfficer }
          trigger:
            - { call: "POST /complaints/${cid}/substantiate", payload: {}, as: CodeOfficer, as_user_id: "officer-1", captures: { enf: "$.data.id", tier: "$.data.tier", fine: "$.data.assessed_fine_cents", lvl: "$.data.escalation_level" } }
          assert:
            - "Enforcement.${enf}.escalation_level == 0"
            - "Enforcement.${enf}.tier == WARNING"
            - "Enforcement.${enf}.assessed_fine_cents == 0"

  # ---------------------------------------------------------------------------
  - section: validations
    instances:
      - name: substantiate_no_inspection_on_record
        claim_type: Violation → Error
        grounds: ["validations[priority=10]", "errors[ERR_NO_INSPECTION_ON_RECORD]"]
        distinguishing_aspect: "Substantiating a reviewed complaint with no Inspection recorded returns 422 ERR_NO_INSPECTION_ON_RECORD."
        test_recipe:
          setup: ["a reviewed complaint with no inspection"]
          setup_api_calls:
            - { call: "POST /noise-policies", payload: { zoning_type: "RESIDENTIAL", day_limit_db: 55, night_limit_db: 45, day_start_hour: 7, night_start_hour: 22 }, as: SystemAdmin }
            - { call: "POST /properties", payload: { address: "112 Main St", zoning_type: "RESIDENTIAL" }, as: CodeOfficer, captures: { pid: "$.data.id" } }
            - { call: "POST /complaints", payload: { property_id: "${pid}", reported_at: "2026-06-01T12:00:00Z", noise_type: "ANIMAL" }, as: CodeOfficer, captures: { cid: "$.data.id" } }
            - { call: "POST /complaints/${cid}/review", payload: {}, as: CodeOfficer }
          trigger:
            - { call: "POST /complaints/${cid}/substantiate", payload: {}, as: CodeOfficer, as_user_id: "officer-1", captures: { err: "$.data.error_id" } }
          assert:
            - "HTTP 422; data.error_id == ERR_NO_INSPECTION_ON_RECORD"

      - name: substantiate_noise_within_limit_rejected
        claim_type: Violation → Error
        grounds: ["validations[priority=10]", calculations.inspection_exceeds_limit, "errors[ERR_NOISE_WITHIN_LIMIT]"]
        distinguishing_aspect: "Substantiating when the latest reading is at/below the limit (exceeds_limit false) returns 422 ERR_NOISE_WITHIN_LIMIT."
        test_recipe:
          setup: ["reviewed complaint with an inspection measured below the day limit"]
          setup_api_calls:
            - { call: "POST /noise-policies", payload: { zoning_type: "COMMERCIAL", day_limit_db: 65, night_limit_db: 55, day_start_hour: 7, night_start_hour: 22 }, as: SystemAdmin }
            - { call: "POST /properties", payload: { address: "113 Main St", zoning_type: "COMMERCIAL" }, as: CodeOfficer, captures: { pid: "$.data.id" } }
            - { call: "POST /complaints", payload: { property_id: "${pid}", reported_at: "2026-06-01T12:00:00Z", noise_type: "MACHINERY" }, as: CodeOfficer, captures: { cid: "$.data.id" } }
            - { call: "POST /complaints/${cid}/review", payload: {}, as: CodeOfficer }
            - { call: "POST /complaints/${cid}/inspections", payload: { measured_decibel: 60, measured_at: "2026-06-01T12:00:00Z" }, as: CodeOfficer }
          trigger:
            - { call: "POST /complaints/${cid}/substantiate", payload: {}, as: CodeOfficer, as_user_id: "officer-1", captures: { err: "$.data.error_id" } }
          assert:
            - "HTTP 422; data.error_id == ERR_NOISE_WITHIN_LIMIT"

      - name: payment_exceeds_outstanding_rejected
        claim_type: Violation → Error
        grounds: ["validations[priority=11]", calculations.enforcement_balance, "errors[ERR_PAYMENT_EXCEEDS_OUTSTANDING]"]
        distinguishing_aspect: "A payment of 20000 against a CITATION whose outstanding is 15000 returns 402 ERR_PAYMENT_EXCEEDS_OUTSTANDING."
        test_recipe:
          setup: ["a level-1 CITATION (15000) still ISSUED"]
          setup_api_calls:
            - { call: "POST /noise-policies", payload: { zoning_type: "COMMERCIAL", day_limit_db: 65, night_limit_db: 55, day_start_hour: 7, night_start_hour: 22 }, as: SystemAdmin }
            - { call: "POST /properties", payload: { address: "114 Main St", zoning_type: "COMMERCIAL" }, as: CodeOfficer, captures: { pid: "$.data.id" } }
            - { call: "POST /complaints", payload: { property_id: "${pid}", reported_at: "2026-05-10T12:00:00Z", noise_type: "AMPLIFIED_MUSIC" }, as: CodeOfficer, captures: { c1: "$.data.id" } }
            - { call: "POST /complaints/${c1}/review", payload: {}, as: CodeOfficer }
            - { call: "POST /complaints/${c1}/inspections", payload: { measured_decibel: 80, measured_at: "2026-05-10T12:00:00Z" }, as: CodeOfficer }
            - { call: "POST /complaints/${c1}/substantiate", payload: {}, as: CodeOfficer, as_user_id: "officer-1" }
            - { call: "POST /complaints", payload: { property_id: "${pid}", reported_at: "2026-05-11T12:00:00Z", noise_type: "AMPLIFIED_MUSIC" }, as: CodeOfficer, captures: { c2: "$.data.id" } }
            - { call: "POST /complaints/${c2}/review", payload: {}, as: CodeOfficer }
            - { call: "POST /complaints/${c2}/inspections", payload: { measured_decibel: 80, measured_at: "2026-05-11T12:00:00Z" }, as: CodeOfficer }
            - { call: "POST /complaints/${c2}/substantiate", payload: {}, as: CodeOfficer, as_user_id: "officer-1", captures: { enf: "$.data.id" } }
            - { call: "GET /enforcements/${enf}", payload: {}, as: Resident, captures: { ev: "$.data.version" } }
          trigger:
            - { call: "POST /enforcements/${enf}/payments", payload: { amount_cents: 20000, expected_enforcement_version: "${ev}" }, as: Resident, captures: { err: "$.data.error_id" } }
          assert:
            - "HTTP 402; data.error_id == ERR_PAYMENT_EXCEEDS_OUTSTANDING"

      - name: variance_db_exceeds_cap_rejected
        claim_type: Violation → Error
        grounds: ["validations[priority=10]", "errors[ERR_VARIANCE_DB_EXCEEDS_CAP]"]
        distinguishing_aspect: "Issuing a variance whose permitted_max_db (100) exceeds VARIANCE_ABSOLUTE_MAX_DB (95) returns 422 ERR_VARIANCE_DB_EXCEEDS_CAP."
        test_recipe:
          setup: ["a variance requesting 100 dB under review"]
          setup_api_calls:
            - { call: "POST /properties", payload: { address: "115 Main St", zoning_type: "INDUSTRIAL" }, as: CodeOfficer, captures: { pid: "$.data.id" } }
            - { call: "POST /variance-permits", payload: { property_id: "${pid}", permit_type: "CONSTRUCTION", requested_start: "2026-06-01T00:00:00Z", requested_end: "2026-06-03T00:00:00Z", permitted_max_db: 100 }, as: PermitClerk, captures: { vid: "$.data.id" } }
          trigger:
            - { call: "POST /variance-permits/${vid}/issue", payload: {}, as: PermitClerk, captures: { err: "$.data.error_id" } }
          assert:
            - "HTTP 422; data.error_id == ERR_VARIANCE_DB_EXCEEDS_CAP"

      - name: variance_invalid_window_rejected
        claim_type: Violation → Error
        grounds: ["validations[priority=4]", "errors[ERR_INVALID_WINDOW]"]
        distinguishing_aspect: "Creating a variance with requested_end <= requested_start returns 400 ERR_INVALID_WINDOW."
        test_recipe:
          setup: ["a property"]
          setup_api_calls:
            - { call: "POST /properties", payload: { address: "116 Main St", zoning_type: "COMMERCIAL" }, as: CodeOfficer, captures: { pid: "$.data.id" } }
          trigger:
            - { call: "POST /variance-permits", payload: { property_id: "${pid}", permit_type: "CONSTRUCTION", requested_start: "2026-06-05T00:00:00Z", requested_end: "2026-06-01T00:00:00Z", permitted_max_db: 90 }, as: PermitClerk, captures: { err: "$.data.error_id" } }
          assert:
            - "HTTP 400; data.error_id == ERR_INVALID_WINDOW"

  # ---------------------------------------------------------------------------
  - section: endpoints
    instances:
      - name: complaints_list_pagination
        claim_type: Listing
        grounds: [endpoints, response_envelope.pagination_fields]
        distinguishing_aspect: "GET /complaints?limit=2 over 3 complaints returns 2 rows with total_count=3 and has_more=true."
        test_recipe:
          setup: ["3 complaints on one property"]
          setup_api_calls:
            - { call: "POST /properties", payload: { address: "117 Main St", zoning_type: "RESIDENTIAL" }, as: CodeOfficer, captures: { pid: "$.data.id" } }
            - { call: "POST /complaints", payload: { property_id: "${pid}", reported_at: "2026-06-01T12:00:00Z", noise_type: "OTHER" }, as: CodeOfficer }
            - { call: "POST /complaints", payload: { property_id: "${pid}", reported_at: "2026-06-02T12:00:00Z", noise_type: "OTHER" }, as: CodeOfficer }
            - { call: "POST /complaints", payload: { property_id: "${pid}", reported_at: "2026-06-03T12:00:00Z", noise_type: "OTHER" }, as: CodeOfficer }
          trigger:
            - { call: "GET /complaints", payload: { property_id: "${pid}", limit: 2, offset: 0 }, as: CodeOfficer }
          assert:
            - "data array length == 2; meta/total_count == 3; has_more == true"

      - name: enforcements_filter_by_property_fk
        claim_type: FK integrity
        grounds: [entities.Enforcement.fields.property_id, endpoints]
        distinguishing_aspect: "GET /enforcements?property_id=P returns only enforcements whose property_id == P (reverse-reachability for the Property FK)."
        test_recipe:
          setup: ["a WARNING enforcement on a property"]
          setup_api_calls:
            - { call: "POST /noise-policies", payload: { zoning_type: "RESIDENTIAL", day_limit_db: 55, night_limit_db: 45, day_start_hour: 7, night_start_hour: 22 }, as: SystemAdmin }
            - { call: "POST /properties", payload: { address: "118 Main St", zoning_type: "RESIDENTIAL" }, as: CodeOfficer, captures: { pid: "$.data.id" } }
            - { call: "POST /complaints", payload: { property_id: "${pid}", reported_at: "2026-06-01T12:00:00Z", noise_type: "ANIMAL" }, as: CodeOfficer, captures: { cid: "$.data.id" } }
            - { call: "POST /complaints/${cid}/review", payload: {}, as: CodeOfficer }
            - { call: "POST /complaints/${cid}/inspections", payload: { measured_decibel: 70, measured_at: "2026-06-01T12:00:00Z" }, as: CodeOfficer }
            - { call: "POST /complaints/${cid}/substantiate", payload: {}, as: CodeOfficer, as_user_id: "officer-1", captures: { enf: "$.data.id" } }
          trigger:
            - { call: "GET /enforcements", payload: { property_id: "${pid}" }, as: CodeOfficer, captures: { first: "$.data[0].id" } }
          assert:
            - "data array length == 1; data[0].id == ${enf}; data[0].property_id == ${pid}"

  # ---------------------------------------------------------------------------
  - section: errors
    instances:
      - name: inspection_policy_not_configured
        claim_type: Violation → Error
        grounds: ["validations[priority=7]", "errors[ERR_POLICY_NOT_CONFIGURED]"]
        distinguishing_aspect: "Recording an inspection when no NoiseLimitPolicy exists for the Property's zoning returns 409 ERR_POLICY_NOT_CONFIGURED."
        test_recipe:
          setup: ["a reviewed complaint whose property zoning has no policy configured"]
          setup_api_calls:
            - { call: "POST /properties", payload: { address: "119 Main St", zoning_type: "MIXED" }, as: CodeOfficer, captures: { pid: "$.data.id" } }
            - { call: "POST /complaints", payload: { property_id: "${pid}", reported_at: "2026-06-01T12:00:00Z", noise_type: "OTHER" }, as: CodeOfficer, captures: { cid: "$.data.id" } }
            - { call: "POST /complaints/${cid}/review", payload: {}, as: CodeOfficer }
          trigger:
            - { call: "POST /complaints/${cid}/inspections", payload: { measured_decibel: 70, measured_at: "2026-06-01T12:00:00Z" }, as: CodeOfficer, captures: { err: "$.data.error_id" } }
          assert:
            - "HTTP 409; data.error_id == ERR_POLICY_NOT_CONFIGURED"

  # ---------------------------------------------------------------------------
  - section: rbac
    instances:
      - name: resident_cannot_review_complaint
        claim_type: Unauthorized Denial
        grounds: [roles.Resident, roles.CodeOfficer, "errors[ERR_UNAUTHORIZED]"]
        distinguishing_aspect: "A Resident calling POST /complaints/{id}/review (CodeOfficer-exclusive) is denied 403 ERR_UNAUTHORIZED."
        test_recipe:
          setup: ["a RECEIVED complaint"]
          setup_api_calls:
            - { call: "POST /properties", payload: { address: "120 Main St", zoning_type: "RESIDENTIAL" }, as: CodeOfficer, captures: { pid: "$.data.id" } }
            - { call: "POST /complaints", payload: { property_id: "${pid}", reported_at: "2026-06-01T12:00:00Z", noise_type: "OTHER" }, as: Resident, captures: { cid: "$.data.id" } }
          trigger:
            - { call: "POST /complaints/${cid}/review", payload: {}, as: Resident, captures: { err: "$.data.error_id" } }
          assert:
            - "HTTP 403; data.error_id == ERR_UNAUTHORIZED"

      - name: permitclerk_cannot_create_property
        claim_type: Unauthorized Denial
        grounds: [roles.PermitClerk, roles.CodeOfficer, "errors[ERR_UNAUTHORIZED]"]
        distinguishing_aspect: "A PermitClerk calling POST /properties (CodeOfficer/SystemAdmin only) is denied 403 ERR_UNAUTHORIZED."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "POST /properties", payload: { address: "121 Main St", zoning_type: "COMMERCIAL" }, as: PermitClerk, captures: { err: "$.data.error_id" } }
          assert:
            - "HTTP 403; data.error_id == ERR_UNAUTHORIZED"

  # ---------------------------------------------------------------------------
  - section: cross_cutting
    instances:
      - name: payment_occ_stale_enforcement_version
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[payment-create-stale-enforcement]", "errors[ERR_STALE_VERSION]"]
        distinguishing_aspect: "After a first payment bumps Enforcement.version, a second payment carrying the pre-bump expected_enforcement_version is rejected 412 ERR_STALE_VERSION (two strictly-sequential requests)."
        test_recipe:
          setup: ["a level-1 CITATION (15000) still ISSUED; the client has read version ev"]
          setup_api_calls:
            - { call: "POST /noise-policies", payload: { zoning_type: "COMMERCIAL", day_limit_db: 65, night_limit_db: 55, day_start_hour: 7, night_start_hour: 22 }, as: SystemAdmin }
            - { call: "POST /properties", payload: { address: "122 Main St", zoning_type: "COMMERCIAL" }, as: CodeOfficer, captures: { pid: "$.data.id" } }
            - { call: "POST /complaints", payload: { property_id: "${pid}", reported_at: "2026-05-10T12:00:00Z", noise_type: "AMPLIFIED_MUSIC" }, as: CodeOfficer, captures: { c1: "$.data.id" } }
            - { call: "POST /complaints/${c1}/review", payload: {}, as: CodeOfficer }
            - { call: "POST /complaints/${c1}/inspections", payload: { measured_decibel: 80, measured_at: "2026-05-10T12:00:00Z" }, as: CodeOfficer }
            - { call: "POST /complaints/${c1}/substantiate", payload: {}, as: CodeOfficer, as_user_id: "officer-1" }
            - { call: "POST /complaints", payload: { property_id: "${pid}", reported_at: "2026-05-11T12:00:00Z", noise_type: "AMPLIFIED_MUSIC" }, as: CodeOfficer, captures: { c2: "$.data.id" } }
            - { call: "POST /complaints/${c2}/review", payload: {}, as: CodeOfficer }
            - { call: "POST /complaints/${c2}/inspections", payload: { measured_decibel: 80, measured_at: "2026-05-11T12:00:00Z" }, as: CodeOfficer }
            - { call: "POST /complaints/${c2}/substantiate", payload: {}, as: CodeOfficer, as_user_id: "officer-1", captures: { enf: "$.data.id" } }
            - { call: "GET /enforcements/${enf}", payload: {}, as: Resident, captures: { ev: "$.data.version" } }
            - { call: "POST /enforcements/${enf}/payments", payload: { amount_cents: 1000, expected_enforcement_version: "${ev}" }, as: Resident }
          trigger:
            - { call: "POST /enforcements/${enf}/payments", payload: { amount_cents: 1000, expected_enforcement_version: "${ev}" }, as: Resident, captures: { err: "$.data.error_id" } }
          assert:
            - "HTTP 412; data.error_id == ERR_STALE_VERSION (the ${ev} version is now stale after the first payment)"

      - name: abatement_occ_stale_property_version
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[abatement-create-stale-property]", "errors[ERR_STALE_VERSION]"]
        distinguishing_aspect: "After a first manual AbatementOrder bumps Property.version, a second create carrying the pre-bump expected_property_version is rejected 412 ERR_STALE_VERSION."
        test_recipe:
          setup: ["a property; the client has read version pv"]
          setup_api_calls:
            - { call: "POST /properties", payload: { address: "123 Main St", zoning_type: "COMMERCIAL" }, as: CodeOfficer, captures: { pid: "$.data.id", pv: "$.data.version" } }
            - { call: "POST /abatement-orders", payload: { property_id: "${pid}", expected_property_version: "${pv}" }, as: CodeOfficer }
          trigger:
            - { call: "POST /abatement-orders", payload: { property_id: "${pid}", expected_property_version: "${pv}" }, as: CodeOfficer, captures: { err: "$.data.error_id" } }
          assert:
            - "HTTP 412; data.error_id == ERR_STALE_VERSION (the ${pv} version is stale after the first order set abatement_status)"

  # ---------------------------------------------------------------------------
  - section: consistency_model
    instances:
      - name: substantiate_response_reflects_computed_fine_immediately
        claim_type: immediate
        grounds: [state_machines.Complaint.UNDER_REVIEW_to_SUBSTANTIATED, calculations.fine_escalation]
        excluded_because:
          difficulty_instance: fine_escalation_tiered_nonlinear_mode_a
          rationale: "The immediate visibility of tier/escalation_level/assessed_fine_cents in the substantiate response is already asserted by the named §1.8 instance."

      - name: variance_covers_complaint_error_path
        claim_type: Violation → Error
        grounds: ["errors[ERR_VARIANCE_COVERS_COMPLAINT]"]
        excluded_because:
          difficulty_instance: substantiate_blocked_by_issued_variance
          rationale: "ERR_VARIANCE_COVERS_COMPLAINT is exercised as the failure path of the named §1.8 cross-entity instance."

      - name: segregation_of_duties_error_path
        claim_type: Violation → Error
        grounds: ["errors[ERR_SEGREGATION_OF_DUTIES]"]
        excluded_because:
          difficulty_instance: decide_safety_beats_constraint
          rationale: "ERR_SEGREGATION_OF_DUTIES is exercised (as the winning error) by the named §1.8 priority-conflict instance."
