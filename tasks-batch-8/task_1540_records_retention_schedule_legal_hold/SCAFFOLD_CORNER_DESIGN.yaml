            - call: "POST /ig/jurisdictions"
              payload: { program_id: "${p}", code: "US-FED", name: "Federal" }
              as: PlatformAdmin
              captures: { jur: "$.data.id" }
            - call: "POST /ig/retention-rules"
              payload: { program_id: "${p}", record_class_id: "${cl}", jurisdiction_id: "${jur}", rule_code: "R-120", retention_months: 120, trigger_basis: "EVENT_DATE", effective_from: "2020-01-01T00:00:00Z" }
              as: RecordsManager
              captures: { rule: "$.data.id" }
            - call: "POST /ig/retention-rules/${rule}/activate"
              payload: {}
              as: RecordsManager
            - call: "POST /ig/records"
              payload: { program_id: "${p}", record_class_id: "${cl}", jurisdiction_id: "${jur}", title: "R", source_system: "MAIL", event_date: "2026-01-15T00:00:00Z", size_gb: 1 }
              as: RecordsManager
              captures: { r: "$.data.id" }
            - call: "POST /ig/custodians"
              payload: { program_id: "${p}", email: "c@x.com", full_name: "Cust", department: "Legal" }
              as: RecordsManager
              captures: { c: "$.data.id" }
            - call: "POST /ig/legal-holds"
              payload: { program_id: "${p}", matter_ref: "M-RBAC", title: "Hold", reason: "Case", custodian_ids: ["${c}"], record_ids: ["${r}"] }
              as: LegalCounsel
              captures: { h: "$.data.id" }
            - call: "POST /ig/legal-holds/${h}/issue"
              payload: {}
              as: LegalCounsel
            - call: "GET /ig/hold-custodians?hold_id=${h}"
              payload: {}
              as: LegalCounsel
              captures: { a: "$.data[0].id" }
          trigger:
            - call: "POST /ig/legal-holds"
              payload: { program_id: "${p}", matter_ref: "M-RM", title: "RM Hold", reason: "Attempt", custodian_ids: ["${c}"], record_ids: ["${r}"] }
              as: RecordsManager
              captures: { err1: "$.data.error_id" }
            - call: "POST /ig/retention-rules"
              payload: { program_id: "${p}", record_class_id: "${cl}", jurisdiction_id: "${jur}", rule_code: "R-LC", retention_months: 24, trigger_basis: "EVENT_DATE", effective_from: "2020-01-01T00:00:00Z" }
              as: LegalCounsel
              captures: { err2: "$.data.error_id" }
            - call: "POST /ig/disposition-requests"
              payload: { program_id: "${p}", record_ids: ["${r}"], method: "SECURE_ERASE", justification: "Purge eligible record batch" }
              as: Auditor
              captures: { err3: "$.data.error_id" }
            - call: "POST /ig/hold-custodians/${a}/acknowledge"
              payload: {}
              as: PlatformAdmin
              captures: { err4: "$.data.error_id" }
          assert:
            - "err1 == ERR_FORBIDDEN_ROLE (RecordsManager cannot create holds)"
            - "err2 == ERR_FORBIDDEN_ROLE (LegalCounsel cannot author rules)"
            - "err3 == ERR_FORBIDDEN_ROLE (Auditor cannot create disposition requests)"
            - "err4 == ERR_FORBIDDEN_ROLE (only Custodian may acknowledge)"

  # ===========================================================================
  # From Cross-Cutting Complexity Layers
  # ===========================================================================
  - section: cross_cutting_layers
    instances:
      - name: optimistic_concurrency_layer
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[rule-supersede-stale-head]", "concurrency_rules[hold-release-stale-scope]"]
        excluded_because:
          difficulty_instance: supersede_with_stale_version_rejected
          rationale: "Both OCC rules are exercised as validations-section instances (supersede_with_stale_version_rejected and release_with_stale_version_rejected), which are part of §1.9 already."

      - name: cascading_side_effects_layer
        claim_type: cascading_side_effects
        grounds: [state_machines.HoldScopeItem, state_machines.RetentionConflict]
        excluded_because:
          difficulty_instance: scope_expansion_cascade_record_to_request
          rationale: "N-level cascades asserted end-to-end by §1.8 transitive_cascade instances."

      - name: scheduled_actions_layer
        claim_type: scheduled_actions
        grounds: [calculations.ack_sla_evaluation, state_machines.HoldCustodian]
        excluded_because:
          difficulty_instance: escalation_at_exact_max_reminders
          rationale: "Clock-driven reminder/escalation scheduling and its boundary are asserted there; sweep destruction scheduling is asserted by sweep_auto_delete_skips_held_and_disabled in §1.9 state_machines."

      - name: derived_field_reconciliation_layer
        claim_type: derived_field_reconciliation
        grounds: [calculations.hold_coverage_reconciliation, calculations.obligation_reconciliation, entities.DispositionRequest.fields.stale_item_count]
        excluded_because:
          difficulty_instance: scope_expand_exclude_conserves_record_hold_count
          rationale: "Reconciliation after forward and reverse cascades is asserted by the §1.9 refresh_blocked_while_held_then_succeeds_after_release and the §1.8 invariant instances."

  # ===========================================================================
  # From Consistency Model
  # ===========================================================================
  - section: consistency_model
    instances:
      - name: immediate_consistency_on_read_after_write
        claim_type: immediate
        grounds: [complexity_profile.consistency_model]
        distinguishing_aspect: "Immediate consistency: the creation response and a subsequent GET of the same record agree on every computed field; issuing a hold is visible on the record's posture within the same request's response and the next read."
        test_recipe:
          setup: ["Program; class; jurisdiction; ACTIVE 1-month rule; record R; custodian C"]
          setup_api_calls:
            - call: "POST /ig/programs"
              payload: { name: "P", fiscal_year_end_month: 12, fiscal_year_end_day: 31 }
              as: PlatformAdmin
              captures: { p: "$.data.id" }
            - call: "POST /ig/record-classes"
              payload: { program_id: "${p}", code: "GEN", name: "General", monthly_storage_cost_cents_per_gb: 10 }
              as: PlatformAdmin
              captures: { cl: "$.data.id" }
            - call: "POST /ig/jurisdictions"
              payload: { program_id: "${p}", code: "US-FED", name: "Federal" }
              as: PlatformAdmin
              captures: { jur: "$.data.id" }
            - call: "POST /ig/retention-rules"
              payload: { program_id: "${p}", record_class_id: "${cl}", jurisdiction_id: "${jur}", rule_code: "R-1M", retention_months: 1, trigger_basis: "EVENT_DATE", effective_from: "2020-01-01T00:00:00Z" }
              as: RecordsManager
              captures: { rule: "$.data.id" }
            - call: "POST /ig/retention-rules/${rule}/activate"
              payload: {}
              as: RecordsManager
            - call: "POST /ig/records"
              payload: { program_id: "${p}", record_class_id: "${cl}", jurisdiction_id: "${jur}", title: "R", source_system: "ERP", event_date: "2026-06-01T00:00:00Z", size_gb: 1 }
              as: RecordsManager
              captures: { r: "$.data.id", posture0: "$.data.disposition_posture", cnt0: "$.data.active_hold_count" }
            - call: "POST /ig/custodians"
              payload: { program_id: "${p}", email: "c@x.com", full_name: "Cust", department: "Legal" }
              as: RecordsManager
              captures: { c: "$.data.id" }
            - call: "POST /ig/legal-holds"
              payload: { program_id: "${p}", matter_ref: "M-IMM", title: "Hold", reason: "Case", custodian_ids: ["${c}"], record_ids: ["${r}"] }
              as: LegalCounsel
              captures: { h: "$.data.id" }
          trigger:
            - call: "POST /ig/legal-holds/${h}/issue"
              payload: {}
              as: LegalCounsel
              captures: { scope_ct: "$.data.active_scope_count" }
            - call: "GET /ig/records/${r}"
              payload: {}
              as: RecordsManager
              captures: { posture1: "$.data.disposition_posture", cnt1: "$.data.active_hold_count", susp1: "$.data.auto_delete_suspended" }
          assert:
            - "Create response already carried computed posture0 == ELIGIBLE and cnt0 == 0 (no lag)"
            - "Issue response shows active_scope_count == 1; the very next GET shows posture1 == HELD, cnt1 == 1, susp1 == true — all changes visible in-request and on immediate read"
