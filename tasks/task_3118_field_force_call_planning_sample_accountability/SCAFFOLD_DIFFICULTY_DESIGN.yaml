  # ===========================================================================
  # Rule 3 — non_linear_state_machine (different entities)
  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: sample_transfer_accept_then_reverse_cycle_restores_balances
        grounds:
          - state_machines.SampleTransfer.REQUESTED_to_ACCEPTED
          - state_machines.SampleTransfer.ACCEPTED_to_REVERSED
        distinguishing_aspect: |
          Entity = SampleTransfer: non-linear because ACCEPTED is not terminal
          in effect — REVERSED re-enters the ledger and must undo both
          balances exactly (cycle REQUESTED→ACCEPTED→REVERSED with observable
          state drift check on both reps' balances before/after).
        test_recipe:
          setup:
            - "Clock 2026-09-01T00:00:00Z. Two ACTIVE territories, sender S with 40 units of lot L, receiver V with 0."
            - "Transfer of 10 REQUESTED then ACCEPTED."
