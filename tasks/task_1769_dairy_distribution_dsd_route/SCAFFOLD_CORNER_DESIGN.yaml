# =============================================================================
# §1.9 Scaffold Corner Design — Coverage Index for Non-Difficulty Tests
# Dairy Distribution & DSD Route
# =============================================================================
scaffold_corner_design:
  # ===========================================================================
  - section: entities
    instances:
      - name: distributor_store_product_defaults_applied
        claim_type: defaults
        grounds: ["entities.Distributor.fields.credit_terms_days", "entities.Store.fields.pull_window_days", "entities.Store.fields.crate_balance", "entities.Store.fields.status"]
        distinguishing_aspect: "Creates with only required fields apply documented defaults and zero-initialized computed fields; system stamps id/created_at/version=1."
        test_recipe:
          setup: ["Empty DB; clock default 2026-08-01T00:00:00Z"]
          setup_api_calls:
            - call: "POST /dairy/distributors"
              payload: { name: "Dairy Dist T", license_number: "LIC-T-1" }
              as: TerritoryManager
              captures: { d1: "$.data.id", d_terms: "$.data.credit_terms_days", d_ver: "$.data.version" }
            - call: "POST /dairy/routes"
              payload: { distributor_id: "${d1}", route_code: "R-T", name: "Route T", service_weekdays: ["MON"] }
              as: TerritoryManager
              captures: { r1: "$.data.id", r_basis: "$.data.credit_price_basis", r_status: "$.data.status" }
            - call: "POST /dairy/stores"
              payload: { route_id: "${r1}", store_code: "S-T", name: "Store T" }
              as: DistributorOwner
              as_user_id: "${d1}"
              captures: { s1: "$.data.id", s_pull: "$.data.pull_window_days", s_dep: "$.data.crate_deposit_cents", s_bal: "$.data.crate_balance", s_ar: "$.data.open_ar_cents", s_status: "$.data.status" }
          trigger:
            - call: "POST /dairy/products"
              payload: { sku: "DEF-1", name: "Default Prod", units_per_case: 4, shelf_life_days: 30, regulated: false }
              as: TerritoryManager
              captures: { p_list: "$.data.list_price_cents", p_weight: "$.data.weight_lbs_per_unit", p_margin: "$.data.margin_cents_per_unit", p_status: "$.data.status" }
          assert:
            - "d_terms == 7 and d_ver == 1 (default + initial version)"
            - "r_basis == ORIGINAL and r_status == DRAFT (defaults / initial state)"
            - "s_pull == 4, s_dep == 400, s_bal == 0, s_ar == 0, s_status == ACTIVE"
            - "p_list == 0, p_weight == 8.6, p_margin == 0, p_status == ACTIVE"

      - name: entity_get_not_found_sweep
        claim_type: not_found
        grounds: ["errors[ERR_DISTRIBUTOR_NOT_FOUND]", "errors[ERR_ROUTE_NOT_FOUND]", "errors[ERR_DRIVER_NOT_FOUND]", "errors[ERR_STORE_NOT_FOUND]", "errors[ERR_PRODUCT_NOT_FOUND]", "errors[ERR_PAR_NOT_FOUND]", "errors[ERR_PRICING_PERIOD_NOT_FOUND]", "errors[ERR_ANNOUNCEMENT_NOT_FOUND]", "errors[ERR_TRIP_NOT_FOUND]", "errors[ERR_ORDER_NOT_FOUND]", "errors[ERR_INVOICE_NOT_FOUND]", "errors[ERR_RETURN_NOT_FOUND]", "errors[ERR_CREDIT_MEMO_NOT_FOUND]", "errors[ERR_LISTING_NOT_FOUND]", "errors[ERR_SESSION_NOT_FOUND]"]
        distinguishing_aspect: "Every single-resource GET with a well-formed but absent UUID returns that resource's domain-specific 404 error_id (15 resources swept in one instance)."
        test_recipe:
          setup: ["Empty DB; clock pinned at the default 2026-08-01T00:00:00Z; no resources exist"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: TerritoryManager }
          trigger:
            - { call: "GET /dairy/distributors/11111111-1111-4111-8111-111111111111", as: Any, captures: { e1: "$.data.error_id" } }
            - { call: "GET /dairy/routes/11111111-1111-4111-8111-111111111111", as: Any, captures: { e2: "$.data.error_id" } }
            - { call: "GET /dairy/drivers/11111111-1111-4111-8111-111111111111", as: Any, captures: { e3: "$.data.error_id" } }
            - { call: "GET /dairy/stores/11111111-1111-4111-8111-111111111111", as: Any, captures: { e4: "$.data.error_id" } }
            - { call: "GET /dairy/products/11111111-1111-4111-8111-111111111111", as: Any, captures: { e5: "$.data.error_id" } }
            - { call: "GET /dairy/standing-pars/11111111-1111-4111-8111-111111111111", as: Any, captures: { e6: "$.data.error_id" } }
            - { call: "GET /dairy/pricing-periods/11111111-1111-4111-8111-111111111111", as: Any, captures: { e7: "$.data.error_id" } }
            - { call: "GET /dairy/price-announcements/11111111-1111-4111-8111-111111111111", as: Any, captures: { e8: "$.data.error_id" } }
            - { call: "GET /dairy/trips/11111111-1111-4111-8111-111111111111", as: Any, captures: { e9: "$.data.error_id" } }
            - { call: "GET /dairy/orders/11111111-1111-4111-8111-111111111111", as: Any, captures: { e10: "$.data.error_id" } }
            - { call: "GET /dairy/invoices/11111111-1111-4111-8111-111111111111", as: Any, captures: { e11: "$.data.error_id" } }
            - { call: "GET /dairy/returns/11111111-1111-4111-8111-111111111111", as: Any, captures: { e12: "$.data.error_id" } }
            - { call: "GET /dairy/credit-memos/11111111-1111-4111-8111-111111111111", as: Any, captures: { e13: "$.data.error_id" } }
            - { call: "GET /dairy/route-sale-listings/11111111-1111-4111-8111-111111111111", as: Any, captures: { e14: "$.data.error_id" } }
            - { call: "GET /dairy/merchandising-sessions/11111111-1111-4111-8111-111111111111", as: Any, captures: { e15: "$.data.error_id" } }
          assert:
            - "e1 == ERR_DISTRIBUTOR_NOT_FOUND, e2 == ERR_ROUTE_NOT_FOUND, e3 == ERR_DRIVER_NOT_FOUND, e4 == ERR_STORE_NOT_FOUND, e5 == ERR_PRODUCT_NOT_FOUND"
            - "e6 == ERR_PAR_NOT_FOUND, e7 == ERR_PRICING_PERIOD_NOT_FOUND, e8 == ERR_ANNOUNCEMENT_NOT_FOUND, e9 == ERR_TRIP_NOT_FOUND, e10 == ERR_ORDER_NOT_FOUND"
            - "e11 == ERR_INVOICE_NOT_FOUND, e12 == ERR_RETURN_NOT_FOUND, e13 == ERR_CREDIT_MEMO_NOT_FOUND, e14 == ERR_LISTING_NOT_FOUND, e15 == ERR_SESSION_NOT_FOUND"

      - name: missing_required_fields_rejected
        claim_type: required_fields
        grounds: ["validations[priority=5]", "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "POST /dairy/stores without route_id and POST /dairy/products without sku both fail input-format validation with ERR_INVALID_REQUEST (400)."
        test_recipe:
          setup: ["Distributor + DRAFT route exist"]
          setup_api_calls:
            - call: "POST /dairy/distributors"
              payload: { name: "Dairy Dist U", license_number: "LIC-U-1" }
              as: TerritoryManager
              captures: { d1: "$.data.id" }
            - call: "POST /dairy/routes"
              payload: { distributor_id: "${d1}", route_code: "R-U", name: "Route U", service_weekdays: ["MON"] }
              as: TerritoryManager
              captures: { r1: "$.data.id" }
          trigger:
            - { call: "POST /dairy/stores", payload: { store_code: "S-U", name: "Store U" }, as: DistributorOwner, as_user_id: "${d1}", captures: { err1: "$.data.error_id" } }
            - { call: "POST /dairy/products", payload: { name: "No SKU", units_per_case: 1, shelf_life_days: 10, regulated: false }, as: TerritoryManager, captures: { err2: "$.data.error_id" } }
          assert:
            - "err1 == ERR_INVALID_REQUEST (missing route_id)"
            - "err2 == ERR_INVALID_REQUEST (missing sku)"

      - name: invalid_enum_and_range_rejected
        claim_type: type_constraints
        grounds: ["validations[priority=5]", "entities.Driver.fields.cdl_class", "entities.PriceAnnouncement.fields.kind"]
        distinguishing_aspect: "Out-of-domain enum values (cdl_class C, announcement kind ESTIMATE) and a reversed trip window (return <= depart) are all ERR_INVALID_REQUEST."
        test_recipe:
          setup: ["Distributor D1, route R1, pricing period 2026-08 exist"]
          setup_api_calls:
            - call: "POST /dairy/distributors"
              payload: { name: "Dairy Dist V", license_number: "LIC-V-1" }
              as: TerritoryManager
              captures: { d1: "$.data.id" }
            - call: "POST /dairy/routes"
              payload: { distributor_id: "${d1}", route_code: "R-V", name: "Route V", service_weekdays: ["MON"] }
              as: TerritoryManager
              captures: { r1: "$.data.id" }
            - call: "POST /dairy/pricing-periods"
              payload: { month: "2026-08" }
              as: MarketAdministrator
              captures: { per1: "$.data.id", per1_v: "$.data.version" }
            - call: "POST /dairy/drivers"
              payload: { distributor_id: "${d1}", name: "Val Driver", cdl_class: "A" }
              as: DistributorOwner
              as_user_id: "${d1}"
              captures: { dr1: "$.data.id" }
          trigger:
            - { call: "POST /dairy/drivers", payload: { distributor_id: "${d1}", name: "Bad CDL", cdl_class: "C" }, as: DistributorOwner, as_user_id: "${d1}", captures: { err1: "$.data.error_id" } }
            - { call: "POST /dairy/pricing-periods/${per1}/announcements", payload: { kind: "ESTIMATE", class_i_base_cents_per_cwt: 2000, processor_assessment_cents_per_cwt: 35, hauling_cents_per_cwt: 60, diesel_index_cents: 299, expected_pricing_period_version: "${per1_v}" }, as: MarketAdministrator, captures: { err2: "$.data.error_id" } }
            - { call: "POST /dairy/trips", payload: { route_id: "${r1}", driver_id: "${dr1}", service_date: "2026-08-10", truck_plate: "TK-1", case_capacity: 10, planned_depart_at: "2026-08-10T13:00:00Z", planned_return_at: "2026-08-10T05:00:00Z" }, as: DistributorOwner, as_user_id: "${d1}", captures: { err3: "$.data.error_id" } }
          assert:
            - "err1 == ERR_INVALID_REQUEST (cdl_class C not in {A,B})"
            - "err2 == ERR_INVALID_REQUEST (kind ESTIMATE not in {PROVISIONAL,FINAL})"
            - "err3 == ERR_INVALID_REQUEST (planned_return_at must be > planned_depart_at)"

      - name: computed_field_input_rejected
        claim_type: computed_fields
        grounds: ["entities.Store.fields.crate_balance", "entities.TruckTrip.fields.excursion_minutes"]
        distinguishing_aspect: "Client-supplied values for computed/system fields (crate_balance on store create, excursion_minutes on trip create) are rejected as unknown input with ERR_INVALID_REQUEST rather than silently honored."
        test_recipe:
          setup: ["Distributor D1, route R1, driver DR1 exist"]
          setup_api_calls:
            - call: "POST /dairy/distributors"
              payload: { name: "Dairy Dist W", license_number: "LIC-W-1" }
              as: TerritoryManager
              captures: { d1: "$.data.id" }
            - call: "POST /dairy/routes"
              payload: { distributor_id: "${d1}", route_code: "R-W", name: "Route W", service_weekdays: ["MON"] }
              as: TerritoryManager
              captures: { r1: "$.data.id" }
            - call: "POST /dairy/drivers"
              payload: { distributor_id: "${d1}", name: "Wes Driver", cdl_class: "A" }
              as: DistributorOwner
              as_user_id: "${d1}"
              captures: { dr1: "$.data.id" }
          trigger:
            - { call: "POST /dairy/stores", payload: { route_id: "${r1}", store_code: "S-W", name: "Store W", crate_balance: 99 }, as: DistributorOwner, as_user_id: "${d1}", captures: { err1: "$.data.error_id" } }
            - { call: "POST /dairy/trips", payload: { route_id: "${r1}", driver_id: "${dr1}", service_date: "2026-08-10", truck_plate: "TK-1", case_capacity: 10, planned_depart_at: "2026-08-10T05:00:00Z", planned_return_at: "2026-08-10T13:00:00Z", excursion_minutes: 12.5 }, as: DistributorOwner, as_user_id: "${d1}", captures: { err2: "$.data.error_id" } }
          assert:
            - "err1 == ERR_INVALID_REQUEST (crate_balance is computed, not an accepted input)"
            - "err2 == ERR_INVALID_REQUEST (excursion_minutes is computed, not an accepted input)"

      - name: uniqueness_violations_rejected
        claim_type: type_constraints
        grounds: ["validations[priority=5]", "entities.Route.fields.route_code", "entities.PricingPeriod.fields.month"]
        distinguishing_aspect: "Duplicate route_code and duplicate pricing-period month are uniqueness violations reported as ERR_INVALID_REQUEST (400), distinct from existence or state errors."
        test_recipe:
          setup: ["Distributor D1 with route R-X and period 2026-08 already created"]
          setup_api_calls:
            - call: "POST /dairy/distributors"
              payload: { name: "Dairy Dist X", license_number: "LIC-X-1" }
              as: TerritoryManager
              captures: { d1: "$.data.id" }
            - call: "POST /dairy/routes"
              payload: { distributor_id: "${d1}", route_code: "R-X", name: "Route X", service_weekdays: ["MON"] }
              as: TerritoryManager
            - { call: "POST /dairy/pricing-periods", payload: { month: "2026-08" }, as: MarketAdministrator }
          trigger:
            - { call: "POST /dairy/routes", payload: { distributor_id: "${d1}", route_code: "R-X", name: "Route X Again", service_weekdays: ["TUE"] }, as: TerritoryManager, captures: { err1: "$.data.error_id" } }
            - { call: "POST /dairy/pricing-periods", payload: { month: "2026-08" }, as: MarketAdministrator, captures: { err2: "$.data.error_id" } }
          assert:
            - "err1 == ERR_INVALID_REQUEST (route_code not unique)"
            - "err2 == ERR_INVALID_REQUEST (month not unique)"

      - name: par_upsert_supersedes_prior
        claim_type: side_effect_execution
        grounds: ["entities.StandingPar.fields.status", "concurrency_rules[par-upsert-stale-store]", "endpoints"]
        distinguishing_aspect: "A second upsert for the same (store, product) flips the first par to SUPERSEDED and leaves exactly one ACTIVE par; each upsert bumps Store.version by 1."
        test_recipe:
          setup: ["Distributor D1, ACTIVE route, store S1 (created -> version 1), product P1"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: TerritoryManager }
            - call: "POST /dairy/distributors"
              payload: { name: "Dairy Dist Y", license_number: "LIC-Y-1" }
              as: TerritoryManager
              captures: { d1: "$.data.id" }
            - call: "POST /dairy/routes"
              payload: { distributor_id: "${d1}", route_code: "R-Y", name: "Route Y", service_weekdays: ["MON"] }
              as: TerritoryManager
              captures: { r1: "$.data.id" }
            - call: "POST /dairy/stores"
              payload: { route_id: "${r1}", store_code: "S-Y", name: "Store Y", credit_limit_cents: 100000000 }
              as: DistributorOwner
              as_user_id: "${d1}"
              captures: { s1: "$.data.id", s1_v: "$.data.version" }
            - { call: "POST /dairy/routes/${r1}/activate", payload: {}, as: TerritoryManager }
            - call: "POST /dairy/products"
              payload: { sku: "PAR-1", name: "Par Prod", units_per_case: 1, shelf_life_days: 10, regulated: false, list_price_cents: 100 }
              as: TerritoryManager
              captures: { p1: "$.data.id" }
          trigger:
            - call: "POST /dairy/stores/${s1}/standing-pars"
              payload: { product_id: "${p1}", expected_store_version: "${s1_v}", par_mon: 10 }
              as: DistributorOwner
              as_user_id: "${d1}"
              captures: { par1: "$.data.id" }
            - { call: "GET /dairy/stores/${s1}", as: Any, captures: { s1_v2: "$.data.version" } }
            - call: "POST /dairy/stores/${s1}/standing-pars"
              payload: { product_id: "${p1}", expected_store_version: "${s1_v2}", par_mon: 25 }
              as: DistributorOwner
              as_user_id: "${d1}"
              captures: { par2: "$.data.id" }
            - { call: "GET /dairy/standing-pars/${par1}", as: Any, captures: { par1_status: "$.data.status" } }
            - { call: "GET /dairy/standing-pars/${par2}", as: Any, captures: { par2_status: "$.data.status", par2_mon: "$.data.par_mon" } }
          assert:
            - "par1_status == SUPERSEDED after the second upsert"
            - "par2_status == ACTIVE and par2_mon == 25"
            - "Store.${s1}.version incremented on each upsert (s1_v2 == s1_v + 1)"

      - name: temperature_reading_append_only_order
        claim_type: immutability
        grounds: ["entities.TemperatureReading.fields.trip_id", "endpoints"]
        distinguishing_aspect: "TemperatureReading is an immutable event (common_fields: false, no update endpoint): the list endpoint returns readings in recorded_at ASC and exposes no version field."
        test_recipe:
          setup: ["Distributor, ACTIVE route, store, driver, trip T1 PLANNED on 2026-08-10; clock 2026-08-10T04:30:00Z"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-10T04:30:00Z" }, as: TerritoryManager }
            - call: "POST /dairy/distributors"
              payload: { name: "Dairy Dist Z", license_number: "LIC-Z-1" }
              as: TerritoryManager
              captures: { d1: "$.data.id" }
            - call: "POST /dairy/routes"
              payload: { distributor_id: "${d1}", route_code: "R-Z", name: "Route Z", service_weekdays: ["MON"] }
              as: TerritoryManager
              captures: { r1: "$.data.id" }
            - call: "POST /dairy/stores"
              payload: { route_id: "${r1}", store_code: "S-Z", name: "Store Z", credit_limit_cents: 100000000 }
              as: DistributorOwner
              as_user_id: "${d1}"
              captures: { s1: "$.data.id" }
            - { call: "POST /dairy/routes/${r1}/activate", payload: {}, as: TerritoryManager }
            - call: "POST /dairy/drivers"
              payload: { distributor_id: "${d1}", name: "Zed Driver", cdl_class: "A" }
              as: DistributorOwner
              as_user_id: "${d1}"
              captures: { dr1: "$.data.id" }
            - call: "POST /dairy/trips"
              payload: { route_id: "${r1}", driver_id: "${dr1}", service_date: "2026-08-10", truck_plate: "TK-1", case_capacity: 100, planned_depart_at: "2026-08-10T05:00:00Z", planned_return_at: "2026-08-10T13:00:00Z" }
              as: DistributorOwner
              as_user_id: "${d1}"
              captures: { t1: "$.data.id" }
            - call: "POST /dairy/trips/${t1}/temperature-readings"
              payload: { recorded_at: "2026-08-10T04:30:00Z", temp_tenths_f: 380, zone: "BOX" }
              as: RouteDriver
              as_user_id: "${dr1}"
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-10T04:45:00Z" }, as: TerritoryManager }
            - call: "POST /dairy/trips/${t1}/temperature-readings"
              payload: { recorded_at: "2026-08-10T04:45:00Z", temp_tenths_f: 375, zone: "CAB" }
              as: RouteDriver
              as_user_id: "${dr1}"
          trigger:
            - { call: "GET /dairy/trips/${t1}/temperature-readings", as: Any, captures: { first_temp: "$.data[0].temp_tenths_f", second_temp: "$.data[1].temp_tenths_f" } }
          assert:
            - "first_temp == 380 and second_temp == 375 (list ordered recorded_at ASC)"
            - "Response items carry id and created_at but no version/updated_at (common_fields: false)"

  # ===========================================================================
  - section: state_machines
    instances:
      - name: route_activate_requires_store_and_retire_lockdown
        claim_type: precondition_enforcement
        grounds: ["state_machines.Route.DRAFT_to_ACTIVE", "state_machines.Route.ACTIVE_to_RETIRED", "errors[ERR_ROUTE_NOT_ACTIVE]", "errors[ERR_ROUTE_HAS_OPEN_ORDERS]"]
        distinguishing_aspect: "Activate of a store-less DRAFT route fails; retire with a PLANNED order fails with ERR_ROUTE_HAS_OPEN_ORDERS; after cancelling the order retire succeeds and a later activate hits terminal lockdown."
        test_recipe:
          setup:
            - "Distributor D1; route R1 DRAFT with no stores; product PL; driver DR1"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: TerritoryManager }
            - call: "POST /dairy/distributors"
              payload: { name: "Dairy Dist AA", license_number: "LIC-AA-1" }
              as: TerritoryManager
              captures: { d1: "$.data.id" }
            - call: "POST /dairy/routes"
              payload: { distributor_id: "${d1}", route_code: "R-AA", name: "Route AA", service_weekdays: ["MON"] }
              as: TerritoryManager
              captures: { r1: "$.data.id" }
            - call: "POST /dairy/products"
              payload: { sku: "LK-1", name: "Lock Prod", units_per_case: 1, shelf_life_days: 30, regulated: false, list_price_cents: 250 }
              as: TerritoryManager
              captures: { pl: "$.data.id" }
            - call: "POST /dairy/drivers"
              payload: { distributor_id: "${d1}", name: "Al Driver", cdl_class: "A" }
              as: DistributorOwner
              as_user_id: "${d1}"
              captures: { dr1: "$.data.id" }
          trigger:
            - { call: "POST /dairy/routes/${r1}/activate", payload: {}, as: TerritoryManager, captures: { err1: "$.data.error_id" } }
            - call: "POST /dairy/stores"
              payload: { route_id: "${r1}", store_code: "S-AA", name: "Store AA", credit_limit_cents: 100000000 }
              as: DistributorOwner
              as_user_id: "${d1}"
              captures: { s1: "$.data.id" }
            - { call: "POST /dairy/routes/${r1}/activate", payload: {}, as: TerritoryManager, captures: { r_status: "$.data.status" } }
            - call: "POST /dairy/trips"
              payload: { route_id: "${r1}", driver_id: "${dr1}", service_date: "2026-08-10", truck_plate: "TK-1", case_capacity: 100, planned_depart_at: "2026-08-10T05:00:00Z", planned_return_at: "2026-08-10T13:00:00Z" }
              as: DistributorOwner
              as_user_id: "${d1}"
              captures: { t1: "$.data.id" }
            - call: "POST /dairy/orders"
              payload: { store_id: "${s1}", trip_id: "${t1}", lines: [{ product_id: "${pl}", quantity_units: 1 }], delivery_window_start: "2026-08-10T08:00:00Z", delivery_window_end: "2026-08-10T08:30:00Z" }
              as: DistributorOwner
              as_user_id: "${d1}"
              captures: { o1: "$.data.id" }
            - { call: "POST /dairy/routes/${r1}/retire", payload: {}, as: TerritoryManager, captures: { err2: "$.data.error_id" } }
            - { call: "POST /dairy/orders/${o1}/cancel", payload: {}, as: DistributorOwner, as_user_id: "${d1}" }
            - { call: "POST /dairy/routes/${r1}/retire", payload: {}, as: TerritoryManager, captures: { r_status2: "$.data.status" } }
            - { call: "POST /dairy/routes/${r1}/activate", payload: {}, as: TerritoryManager, captures: { err3: "$.data.error_id" } }
          assert:
            - "err1 == ERR_ROUTE_NOT_ACTIVE (activate requires at least one ACTIVE store)"
            - "r_status == ACTIVE after store onboarded (DRAFT -> ACTIVE valid)"
            - "err2 == ERR_ROUTE_HAS_OPEN_ORDERS (PLANNED order blocks retire)"
            - "r_status2 == RETIRED after order cancelled"
            - "err3 == ERR_ROUTE_NOT_ACTIVE (RETIRED is terminal; activate rejected)"
            - "Store.${s1}.status == INACTIVE after retire cascade"

      - name: store_deactivate_blocked_by_confirmed_and_reactivate_gate
        claim_type: precondition_enforcement
