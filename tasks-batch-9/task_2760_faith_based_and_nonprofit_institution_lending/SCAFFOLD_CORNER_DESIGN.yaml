# ============================================================================
# SCAFFOLD_CORNER_DESIGN.yaml — §1.9 Scaffold Corner Design (breadth probe)
# Faith-Based and Nonprofit Institution Lending (task 2760)
#
# Walked row-by-row against references/claim-extraction-guide.md's nine
# sections. Every instance grounds only in elements declared in SCAFFOLD.yaml
# §1.1–§1.7; every numeric assert was computed by executing the §1.3 formula
# against the literals pinned in the same instance's setup_api_calls.
#
# Reference institution reused by most chains ("Grace Covenant Church"):
#   bylaws cap 500000000c · quorum 0.6667 · 3 community programs
#   giving periods (cents): 2025Q1 A 60000000/8000000/2000000/39999950 hh 500
#                           2025Q2 A 62000000/8000000/2000000/40999950 hh 510
#                           2025Q3 A 60000000/8000000/2000000/40999950 hh 515
#                           2025Q4 A 65000000/8000000/2000000/41800200 hh 520
#   => AUDITED_ONLY giving base 207000000 · net available 432001 dollars
#   sanctuary asset 500000000 / score 2 / appraised 2025-06-01 (age 426 days)
#   => first-lien lending value 225000000 · second-lien 135000000
#   logical clock left at its 2026-08-01T00:00:00Z default unless a chain moves it
#
# Corners already asserted by a §1.8 instance carry an `excluded_because:` stub
# and no `test_recipe`, per SKILL.md §1.9.
# ============================================================================

scaffold_corner_design:
  - section: entities
    instances:
      - name: institution_create_returns_all_fields_with_zeroed_aggregates
        claim_type: creation
        grounds:
          - entities.Institution.fields.legal_name
          - entities.Institution.fields.audited_period_count
          - entities.Institution.fields.unrestricted_giving_base_cents
          - entities.Institution.fields.cumulative_forgiveness_cents
          - endpoints["POST /institutions"]
        distinguishing_aspect: "POST /institutions returns 201 with every input field echoed and all five computed/system aggregates initialized to 0 before any GivingPeriod exists."
        test_recipe:
          setup:
            - "Empty database with the logical clock pinned to its 2026-08-01T00:00:00Z default."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /institutions"
              payload: { legal_name: "Grace Covenant Church", institution_type: "CONGREGATION", denomination_code: "PCA", requires_denominational_approval: false, bylaws_borrowing_cap_cents: 500000000, bylaws_quorum_pct: 0.6667, community_program_count: 3, endowment_market_value_cents: 800000000 }
              as: PlatformAdmin
              captures: { inst: $.data.id, inst_v0: $.data.version }
          assert:
            - "HTTP 201 and response_type == \"object\""
            - "data.legal_name == \"Grace Covenant Church\", data.institution_type == \"CONGREGATION\", data.denomination_code == \"PCA\""
            - "data.bylaws_borrowing_cap_cents == 500000000, data.bylaws_quorum_pct == 0.6667, data.community_program_count == 3, data.endowment_market_value_cents == 800000000"
            - "data.audited_period_count == 0, data.period_count == 0, data.unrestricted_giving_base_cents == 0, data.net_available_for_debt_service_dollars == 0, data.cumulative_forgiveness_cents == 0"
            - "data.id, data.created_at, data.updated_at and data.version are all present; ${inst_v0} is an integer"
            - "meta.api_request_id and meta.api_request_timestamp are present on the envelope"

      - name: institution_optional_fields_take_declared_defaults_when_omitted
        claim_type: defaults
        grounds:
          - entities.Institution.fields.requires_denominational_approval
          - entities.Institution.fields.community_program_count
          - entities.Institution.fields.endowment_market_value_cents
          - endpoints["POST /institutions"]
        distinguishing_aspect: "Omitting the three optional inputs yields requires_denominational_approval false, community_program_count 0 and endowment_market_value_cents 0 — not null and not an error."
        test_recipe:
          setup:
            - "Empty database with the logical clock at its default."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /institutions"
              payload: { legal_name: "Hope Lutheran School", institution_type: "SCHOOL", denomination_code: "ELCA", bylaws_borrowing_cap_cents: 300000000, bylaws_quorum_pct: 0.5000 }
              as: PlatformAdmin
              captures: { inst_min: $.data.id }
          assert:
            - "HTTP 201"
            - "data.requires_denominational_approval == false"
            - "data.community_program_count == 0"
            - "data.endowment_market_value_cents == 0"
            - "A later GET /institutions/${inst_min} returns the same three defaults, proving they were persisted rather than only echoed"

      - name: institution_get_by_id_returns_the_stored_row
        claim_type: retrieval
        grounds:
          - entities.Institution.fields.bylaws_quorum_pct
          - endpoints["GET /institutions/{institution_id}"]
        distinguishing_aspect: "GET /institutions/{id} returns the row created earlier field-for-field, including bylaws_quorum_pct at four decimal places."
        test_recipe:
          setup:
            - "One institution on file."
          setup_api_calls:
            - call: "POST /institutions"
              payload: { legal_name: "Grace Covenant Church", institution_type: "CONGREGATION", denomination_code: "PCA", requires_denominational_approval: false, bylaws_borrowing_cap_cents: 500000000, bylaws_quorum_pct: 0.6667, community_program_count: 3, endowment_market_value_cents: 800000000 }
              as: PlatformAdmin
              captures: { inst: $.data.id }
          trigger:
            - call: "GET /institutions/${inst}"
              payload: {}
              as: CreditAnalyst
          assert:
            - "HTTP 200 and data.id == ${inst}"
            - "data.bylaws_quorum_pct == 0.6667 and data.bylaws_borrowing_cap_cents == 500000000"
            - "data.period_count == 0 — the read performs no mutation"

      - name: institution_list_offset_pagination_reports_total_count_and_has_more
        claim_type: listing
        grounds:
          - endpoints["GET /institutions"]
          - response_envelope.pagination_fields
          - response_envelope.pagination_defaults
        distinguishing_aspect: "With three institutions on file, limit 2 / offset 0 returns exactly two rows newest-first by created_at DESC with total_count 3 and has_more true; offset 2 returns the oldest single row with has_more false."
        test_recipe:
          setup:
            - "Three institutions created in order: Grace Covenant Church, then Hope Lutheran School, then Mercy Ministries."
          setup_api_calls:
            - call: "POST /institutions"
              payload: { legal_name: "Grace Covenant Church", institution_type: "CONGREGATION", denomination_code: "PCA", bylaws_borrowing_cap_cents: 500000000, bylaws_quorum_pct: 0.6667 }
              as: PlatformAdmin
              captures: { inst_a: $.data.id }
            - call: "POST /institutions"
              payload: { legal_name: "Hope Lutheran School", institution_type: "SCHOOL", denomination_code: "ELCA", bylaws_borrowing_cap_cents: 300000000, bylaws_quorum_pct: 0.5000 }
              as: PlatformAdmin
              captures: { inst_b: $.data.id }
            - call: "POST /institutions"
              payload: { legal_name: "Mercy Ministries", institution_type: "NONPROFIT_MINISTRY", denomination_code: "INDEPENDENT", bylaws_borrowing_cap_cents: 100000000, bylaws_quorum_pct: 0.7500 }
              as: PlatformAdmin
              captures: { inst_c: $.data.id }
          trigger:
            - call: "GET /institutions"
              payload: { limit: 2, offset: 0 }
              as: PlatformAdmin
            - call: "GET /institutions"
              payload: { limit: 2, offset: 2 }
              as: PlatformAdmin
            - call: "GET /institutions"
              payload: { institution_type: "SCHOOL" }
              as: PlatformAdmin
          assert:
            - "First response: response_type == \"array\", len(data) == 2, total_count == 3, has_more == true, limit == 2, offset == 0"
            - "First response: data[0].id == ${inst_c} and data[1].id == ${inst_b} (created_at DESC)"
            - "Second response: len(data) == 1, data[0].id == ${inst_a}, total_count == 3, has_more == false"
            - "Third response: len(data) == 1, data[0].id == ${inst_b}, total_count == 1, has_more == false, limit == 10 (the declared default)"

      - name: institution_create_missing_required_bylaws_cap_returns_invalid_request
        claim_type: required_fields
        grounds:
          - entities.Institution.fields.bylaws_borrowing_cap_cents
          - validations[priority=15]
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: "Omitting bylaws_borrowing_cap_cents — an input field with no declared default — is rejected 422 ERR_INVALID_REQUEST and no Institution row is created."
        test_recipe:
          setup:
            - "Empty database."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /institutions"
              payload: { legal_name: "Grace Covenant Church", institution_type: "CONGREGATION", denomination_code: "PCA", bylaws_quorum_pct: 0.6667 }
              as: PlatformAdmin
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 422 with ${err} == \"ERR_INVALID_REQUEST\" and response_type == \"error\""
            - "data.message is a non-empty string"
            - "A subsequent GET /institutions returns total_count == 0 — the rejected create persisted nothing"

      - name: institution_type_outside_declared_enum_returns_invalid_request
        claim_type: type_constraints
        grounds:
          - entities.Institution.fields.institution_type
          - validations[priority=15]
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: "institution_type \"SYNAGOGUE\" is outside the declared set {CONGREGATION, SCHOOL, DENOMINATIONAL_AGENCY, NONPROFIT_MINISTRY} and is rejected 422 ERR_INVALID_REQUEST."
        test_recipe:
          setup:
            - "Empty database."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /institutions"
              payload: { legal_name: "Beth Shalom", institution_type: "SYNAGOGUE", denomination_code: "INDEPENDENT", bylaws_borrowing_cap_cents: 100000000, bylaws_quorum_pct: 0.5000 }
              as: PlatformAdmin
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 422 with ${err} == \"ERR_INVALID_REQUEST\""
            - "A subsequent GET /institutions returns total_count == 0"

      - name: giving_period_computed_unrestricted_and_net_fields_derived_on_create
        claim_type: computed_fields
        grounds:
          - entities.GivingPeriod.fields.unrestricted_contributions_cents
          - entities.GivingPeriod.fields.net_available_for_debt_service_cents
          - entities.Institution.fields.period_count
          - endpoints["POST /giving-periods"]
        distinguishing_aspect: "For total 60000000 / restricted 8000000 / endowment draw 2000000 / opex 39999950 the row computes unrestricted 50000000 and net 10000050, and the parent's period_count and audited_period_count both become 1 while unrestricted_giving_base_cents stays 0 because period_count < 4."
        test_recipe:
          setup:
            - "One institution with no giving periods yet."
          setup_api_calls:
            - call: "POST /institutions"
              payload: { legal_name: "Grace Covenant Church", institution_type: "CONGREGATION", denomination_code: "PCA", bylaws_borrowing_cap_cents: 500000000, bylaws_quorum_pct: 0.6667, community_program_count: 3, endowment_market_value_cents: 800000000 }
              as: PlatformAdmin
              captures: { inst: $.data.id }
          trigger:
            - call: "POST /giving-periods"
              payload: { institution_id: "${inst}", period_label: "2025Q1", period_start: "2025-01-01T00:00:00Z", period_end: "2025-03-31T00:00:00Z", source: "AUDITED", total_contributions_cents: 60000000, restricted_contributions_cents: 8000000, donor_restricted_endowment_draw_cents: 2000000, operating_expense_cents: 39999950, member_household_count: 500 }
              as: CreditAnalyst
              captures: { gp: $.data.id }
            - call: "GET /institutions/${inst}"
              payload: {}
              as: CreditAnalyst
          assert:
            - "First response: HTTP 201, data.unrestricted_contributions_cents == 50000000, data.net_available_for_debt_service_cents == 10000050"
            - "Second response: data.period_count == 1 and data.audited_period_count == 1"
            - "Second response: data.unrestricted_giving_base_cents == 0 and data.net_available_for_debt_service_dollars == 0 — the window needs MIN_GIVING_PERIODS (4) rows"
            - "GET /giving-periods with institution_id == ${inst} returns exactly one row whose id == ${gp}"

      - name: governance_authorization_system_fields_initialize_before_any_transition
        claim_type: system_fields
        grounds:
          - entities.GovernanceAuthorization.fields.status
          - entities.GovernanceAuthorization.fields.revision_round
          - entities.GovernanceAuthorization.fields.board_quorum_pct
          - entities.GovernanceAuthorization.fields.verified_by_user_id
          - endpoints["POST /governance-authorizations"]
        distinguishing_aspect: "A freshly created packet is DRAFT with revision_round 0, and the three verification-time fields (board_quorum_pct, verified_by_user_id, denominational_decision_note) are still null even though board_votes_for/total were supplied at create."
        test_recipe:
          setup:
            - "One institution; no governance packet yet."
          setup_api_calls:
            - call: "POST /institutions"
              payload: { legal_name: "Grace Covenant Church", institution_type: "CONGREGATION", denomination_code: "PCA", bylaws_borrowing_cap_cents: 500000000, bylaws_quorum_pct: 0.6667 }
              as: PlatformAdmin
              captures: { inst: $.data.id }
          trigger:
            - call: "POST /governance-authorizations"
              payload: { institution_id: "${inst}", resolution_date: "2026-06-15T00:00:00Z", bylaws_citation: "Article VII Section 3", board_votes_for: 8, board_votes_total: 12, authorized_amount_cents: 400000000, expires_on: "2027-06-30T00:00:00Z" }
              as: InstitutionRepresentative
              as_user_id: "${inst}"
              captures: { gov: $.data.id }
          assert:
            - "HTTP 201, data.status == \"DRAFT\", data.revision_round == 0"
            - "data.board_quorum_pct is null, data.verified_by_user_id is null, data.denominational_decision_note is null"
            - "data.denominational_body is null because it was omitted and the institution needs no denominational approval"
            - "data.board_votes_for == 8 and data.board_votes_total == 12 are echoed verbatim"

      - name: collateral_asset_appraisal_age_and_lending_value_computed_at_create
        claim_type: computed_fields
        grounds:
          - entities.CollateralAsset.fields.appraisal_age_days
          - entities.CollateralAsset.fields.lending_value_cents
          - entities.CollateralAsset.fields.lien_history
          - calculations.collateral_special_purpose_lending_value
        distinguishing_aspect: "A SANCTUARY appraised 2025-06-01 at 500000000 with alternative_use_score 2 is created with appraisal_age_days 426 against the 2026-08-01 clock and lending_value_cents 225000000 — valued as a would-be first lien while still unassigned."
        test_recipe:
          setup:
            - "One institution; logical clock at its 2026-08-01T00:00:00Z default."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /institutions"
              payload: { legal_name: "Grace Covenant Church", institution_type: "CONGREGATION", denomination_code: "PCA", bylaws_borrowing_cap_cents: 500000000, bylaws_quorum_pct: 0.6667 }
              as: PlatformAdmin
              captures: { inst: $.data.id }
          trigger:
            - call: "POST /collateral-assets"
              payload: { institution_id: "${inst}", asset_type: "SANCTUARY", description_label: "Main sanctuary building", appraised_value_cents: 500000000, appraisal_date: "2025-06-01T00:00:00Z", alternative_use_score: 2 }
              as: CreditAnalyst
              captures: { asset: $.data.id }
          assert:
            - "HTTP 201, data.appraisal_age_days == 426"
            - "data.lending_value_cents == 225000000 (min(0.50, 0.55) -> 250000000, lien factor 1.00, seasoning 0.90 because 426 > 365)"
            - "data.assigned_loan_application_id, data.lien_position, data.lien_effective_from and data.lien_effective_to are all null"
            - "data.lien_history == [] (empty array, not null)"

      - name: pledge_campaign_rollup_buckets_all_zero_at_launch
        claim_type: computed_fields
        grounds:
          - entities.PledgeCampaign.fields.total_pledged_cents
          - entities.PledgeCampaign.fields.attrition_adjusted_value_cents
          - entities.PledgeCampaign.fields.sponsor_projected_value_cents
          - endpoints["POST /pledge-campaigns"]
        distinguishing_aspect: "A campaign with a 120000000 goal and no pledges reports all six rollup buckets and both valuations at 0 with status OPEN — the valuations do not default to the goal."
        test_recipe:
          setup:
            - "One institution."
          setup_api_calls:
            - call: "POST /institutions"
              payload: { legal_name: "Grace Covenant Church", institution_type: "CONGREGATION", denomination_code: "PCA", bylaws_borrowing_cap_cents: 500000000, bylaws_quorum_pct: 0.6667 }
              as: PlatformAdmin
              captures: { inst: $.data.id }
          trigger:
            - call: "POST /pledge-campaigns"
              payload: { institution_id: "${inst}", campaign_name: "Building For Generations", goal_cents: 120000000, pledge_period_months: 36, sponsor_collection_rate_bps: 9500 }
              as: InstitutionRepresentative
              as_user_id: "${inst}"
              captures: { camp: $.data.id }
          assert:
            - "HTTP 201, data.status == \"OPEN\", data.goal_cents == 120000000"
            - "data.total_pledged_cents == 0, data.active_pledged_cents == 0, data.lapsed_pledged_cents == 0, data.fulfilled_pledged_cents == 0, data.collected_to_date_cents == 0"
            - "data.attrition_adjusted_value_cents == 0 and data.sponsor_projected_value_cents == 0"

      - name: draw_request_waterfall_fields_stay_null_until_disbursement
        claim_type: computed_fields
        grounds:
          - entities.DrawRequest.fields.retainage_cents
          - entities.DrawRequest.fields.net_disbursed_cents
          - entities.DrawRequest.fields.completion_pct_at_disbursement
          - entities.Loan.fields.reserved_draw_cents
        distinguishing_aspect: "A SUBMITTED draw has approved_amount_cents and all five waterfall outputs null, and reserved_draw_cents stays 0 because reservation follows APPROVED status, not submission."
        test_recipe:
          setup:
            - "The reference institution with four audited periods, an AUTHORIZED packet, a first-lien sanctuary and an APPROVED application funded into a 225000000 loan."
          setup_api_calls:
            - call: "POST /institutions"
              payload: { legal_name: "Grace Covenant Church", institution_type: "CONGREGATION", denomination_code: "PCA", requires_denominational_approval: false, bylaws_borrowing_cap_cents: 500000000, bylaws_quorum_pct: 0.6667, community_program_count: 3, endowment_market_value_cents: 800000000 }
              as: PlatformAdmin
              captures: { inst: $.data.id }
            - call: "POST /giving-periods"
              payload: { institution_id: "${inst}", period_label: "2025Q1", period_start: "2025-01-01T00:00:00Z", period_end: "2025-03-31T00:00:00Z", source: "AUDITED", total_contributions_cents: 60000000, restricted_contributions_cents: 8000000, donor_restricted_endowment_draw_cents: 2000000, operating_expense_cents: 39999950, member_household_count: 500 }
              as: CreditAnalyst
            - call: "POST /giving-periods"
              payload: { institution_id: "${inst}", period_label: "2025Q2", period_start: "2025-04-01T00:00:00Z", period_end: "2025-06-30T00:00:00Z", source: "AUDITED", total_contributions_cents: 62000000, restricted_contributions_cents: 8000000, donor_restricted_endowment_draw_cents: 2000000, operating_expense_cents: 40999950, member_household_count: 510 }
              as: CreditAnalyst
            - call: "POST /giving-periods"
              payload: { institution_id: "${inst}", period_label: "2025Q3", period_start: "2025-07-01T00:00:00Z", period_end: "2025-09-30T00:00:00Z", source: "AUDITED", total_contributions_cents: 60000000, restricted_contributions_cents: 8000000, donor_restricted_endowment_draw_cents: 2000000, operating_expense_cents: 40999950, member_household_count: 515 }
              as: CreditAnalyst
            - call: "POST /giving-periods"
              payload: { institution_id: "${inst}", period_label: "2025Q4", period_start: "2025-10-01T00:00:00Z", period_end: "2025-12-31T00:00:00Z", source: "AUDITED", total_contributions_cents: 65000000, restricted_contributions_cents: 8000000, donor_restricted_endowment_draw_cents: 2000000, operating_expense_cents: 41800200, member_household_count: 520 }
              as: CreditAnalyst
            - call: "POST /governance-authorizations"
              payload: { institution_id: "${inst}", resolution_date: "2026-06-15T00:00:00Z", bylaws_citation: "Article VII Section 3", board_votes_for: 8, board_votes_total: 12, authorized_amount_cents: 400000000, expires_on: "2027-06-30T00:00:00Z" }
              as: InstitutionRepresentative
              as_user_id: "${inst}"
              captures: { gov: $.data.id }
            - call: "POST /governance-authorizations/${gov}/submit"
              payload: {}
              as: InstitutionRepresentative
              as_user_id: "${inst}"
            - call: "POST /governance-authorizations/${gov}/board-verification"
              payload: { minutes_reference: "MIN-2026-06-15" }
              as: GovernanceOfficer
            - call: "POST /collateral-assets"
              payload: { institution_id: "${inst}", asset_type: "SANCTUARY", description_label: "Main sanctuary building", appraised_value_cents: 500000000, appraisal_date: "2025-06-01T00:00:00Z", alternative_use_score: 2 }
              as: CreditAnalyst
              captures: { asset: $.data.id }
            - call: "POST /loan-applications"
              payload: { institution_id: "${inst}", governance_authorization_id: "${gov}", purpose: "SANCTUARY_CONSTRUCTION", requested_amount_cents: 225000000, term_months: 240, interest_rate_bps: 625 }
              as: CreditAnalyst
              captures: { app: $.data.id }
            - call: "POST /loan-applications/${app}/submit-underwriting"
              payload: { analyst_note: "Four audited periods on file" }
              as: CreditAnalyst
              as_user_id: "analyst-1"
            - call: "POST /collateral-assets/${asset}/assignments"
              payload: { loan_application_id: "${app}", lien_position: 1, lien_effective_from: "2026-08-01T00:00:00Z", lien_effective_to: "2031-08-01T00:00:00Z" }
              as: CreditAnalyst
            - call: "POST /loan-applications/${app}/committee-referral"
              payload: { referral_note: "First lien on sanctuary" }
              as: CreditAnalyst
              as_user_id: "analyst-1"
            - call: "POST /loan-applications/${app}/committee-decision"
              payload: { decision: "APPROVE" }
              as: CreditCommitteeMember
              as_user_id: "committee-1"
            - call: "POST /loans"
              payload: { loan_application_id: "${app}", annual_debt_service_cents: 36000000, interest_reserve_shortfall_cents: 1500000 }
              as: LoanServicer
              captures: { loan: $.data.id }
          trigger:
            - call: "POST /draw-requests"
              payload: { loan_id: "${loan}", project_phase: "FOUNDATION", requested_amount_cents: 112500000, percent_complete: 0.4000 }
              as: LoanServicer
              captures: { draw: $.data.id }
            - call: "GET /loans/${loan}"
              payload: {}
              as: LoanServicer
          assert:
            - "First response: HTTP 201, data.status == \"SUBMITTED\", data.approved_amount_cents is null"
            - "First response: data.retainage_cents, data.interest_reserve_applied_cents, data.inspection_fee_cents, data.net_disbursed_cents and data.completion_pct_at_disbursement are all null"
            - "First response: data.inspector_note is null and data.void_reason is null"
            - "Second response: data.reserved_draw_cents == 0, data.undrawn_commitment_cents == 225000000, data.disbursed_principal_cents == 0, data.servicing_status == \"PENDING_FIRST_DRAW\""

      - name: unknown_ids_across_all_eleven_collections_return_not_found
        claim_type: not_found
        grounds:
          - errors[ERR_INSTITUTION_NOT_FOUND]
          - errors[ERR_GIVING_PERIOD_NOT_FOUND]
          - errors[ERR_GOVERNANCE_AUTHORIZATION_NOT_FOUND]
          - errors[ERR_PLEDGE_CAMPAIGN_NOT_FOUND]
          - errors[ERR_PLEDGE_NOT_FOUND]
          - errors[ERR_COLLATERAL_ASSET_NOT_FOUND]
          - errors[ERR_LOAN_APPLICATION_NOT_FOUND]
          - errors[ERR_LOAN_NOT_FOUND]
          - errors[ERR_DRAW_REQUEST_NOT_FOUND]
