              as: BookingAgent
              as_user_id: "${oc_agent}"
              captures: { oc_s: $.data.id }
            - call: "POST /shows/${oc_s}/date-holds"
              payload: { priority: "P1", booked_by_agent_id: "${oc_agent}" }
              as: BookingAgent
              as_user_id: "${oc_agent}"
              captures: { oc_h: $.data.id }
            - call: "GET /shows/${oc_s}"
              payload: {}
              as: VenueManager
              captures: { oc_v0: $.data.version }
            - call: "POST /shows/${oc_s}/date-holds/${oc_h}/confirm"
              payload: { expected_show_version: "${oc_v0}" }
              as: BookingAgent
              as_user_id: "${oc_agent}"
            - call: "POST /shows/${oc_s}/offers"
              payload: { deal_kind: "FLAT_GUARANTEE", guarantee_cents: 50000, artist_split_pct: 0, versus_threshold_cents: 0, expense_budget_cents: 5000, support_budget_cents: 0, bar_split_pct: 0.10, merch_split_pct: 0.20 }
              as: BookingAgent
              as_user_id: "${oc_agent}"
              captures: { oc_o: $.data.id }
            - call: "GET /shows/${oc_s}"
              payload: {}
              as: VenueManager
              captures: { oc_v_stale: $.data.version }
            # Bump version via a wire create+complete cycle (any show-mutating action)
            - call: "POST /shows/${oc_s}/wire-transfers"
              payload: { purpose: "ARTIST_DEPOSIT", amount_cents: 100, recipient_artist_id: "${oc_a}", support_act_id: "", settlement_id: "" }
              as: Accountant
              captures: { oc_w: $.data.id }
            - call: "POST /shows/${oc_s}/wire-transfers/${oc_w}/complete"
              payload: {}
              as: Accountant
          trigger:
            - call: "POST /shows/${oc_s}/offers/${oc_o}/accept"
              payload: { expected_show_version: "${oc_v_stale}" }
              as: VenueManager
              captures: { oc_err: $.data.error_id }
          assert:
            - "error_id == ERR_STALE_VERSION"
            - "http status == 412"
            - "Offer.${oc_o}.status remains PENDING"

  # ==========================================================================
  # Section: consistency model
  # ==========================================================================
  - section: consistency_model
    instances:
      - name: show_version_increments_on_mutation
        claim_type: immediate_consistency
        grounds:
          - "complexity_profile.consistency_model"
          - "entities.Show"
        distinguishing_aspect: "Every mutation bumps Show.version by exactly 1 and refreshes updated_at."
        test_recipe:
          setup: ["Show created with version=1"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: VenueManager
            - call: "POST /artists"
              payload: { legal_name: "VB", agency: "A", guarantee_floor_cents: 10000, deposit_pct: 0.25 }
              as: VenueManager
              captures: { vb_a: $.data.id }
            - call: "POST /booking-agents"
              payload: { display_name: "BA", agency_name: "A" }
              as: VenueManager
              captures: { vb_agent: $.data.id }
            - call: "POST /shows"
              payload: { artist_id: "${vb_a}", room: "MAIN_ROOM", show_date: "2027-03-15", doors_at_utc: "2027-03-15T19:00:00Z", curfew_at_utc: "2027-03-15T23:00:00Z", total_capacity: 100, on_sale_at_utc: "2026-09-01T10:00:00Z" }
              as: BookingAgent
              as_user_id: "${vb_agent}"
              captures: { vb_s: $.data.id, vb_v_init: $.data.version, vb_u_init: $.data.updated_at }
            - call: "POST /shows/${vb_s}/date-holds"
              payload: { priority: "P1", booked_by_agent_id: "${vb_agent}" }
              as: BookingAgent
              as_user_id: "${vb_agent}"
              captures: { vb_h: $.data.id }
          trigger:
            - call: "GET /shows/${vb_s}"
              payload: {}
              as: VenueManager
              captures: { vb_v_after_hold: $.data.version }
            - call: "POST /shows/${vb_s}/date-holds/${vb_h}/confirm"
              payload: { expected_show_version: "${vb_v_after_hold}" }
              as: BookingAgent
              as_user_id: "${vb_agent}"
            - call: "GET /shows/${vb_s}"
              payload: {}
              as: VenueManager
              captures: { vb_v_after_confirm: $.data.version, vb_u_after_confirm: $.data.updated_at }
          assert:
            - "Show.version on create == 1"
            - "Show.version increments by 1 on hold confirm"
            - "Show.updated_at refreshes on every mutation"
