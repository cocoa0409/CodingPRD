      - name: member_price_rounds_half_up_to_the_nearest_cent
        claim_type: precision
        grounds:
          - calculations.member_tier_price_cents
          - entities.Product.fields.base_list_price_cents
          - entities.Commitment.fields.projected_price_cents
        distinguishing_aspect: |
          gross_cents is 999999 * 0.60 * 0.75 = 449999.55, whose fractional part is above a half cent, so
          round_half_up must produce 450000 and not the truncated 449999. The ceiling
          round_half_up(999999 * 60 / 100) = 599999 and the floor MIN_MEMBER_PRICE_CENTS 150000 both sit
          outside, so the clamp cannot mask a rounding error, and the stored value must be a whole-cent
          integer.
        test_recipe:
          setup:
            - "One vendor and one product whose base_list_price_cents is the deliberately awkward 999999, with a single tier band 1 -> 0 percent."
            - "Member Alpha College has fte_count 4000 (fte_factor 0.60) and carnegie_class BACCALAUREATE (carnegie_factor 0.75) and budget_ceiling_cents 9000000, so the pledge clears the fiscal check."
          setup_api_calls:
            - call: "POST /erm/vendors"
              payload: { name: "Atlas Scholarly", archival_agency_code: "PORTICO", vpat_on_file: true }
              as: ConsortiumAdmin
              as_user_id: "admin-1"
              captures: { vendor_id: $.data.id }
