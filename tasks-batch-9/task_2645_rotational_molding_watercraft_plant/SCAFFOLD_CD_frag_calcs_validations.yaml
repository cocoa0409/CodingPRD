            - "the accepted third cycle draws MLD-CVN-2 — the mould the abort just freed — because MLD-CVN-2 and MLD-CVN-3 are both AVAILABLE at cycles_since_service 0 and free over the span, and mold_code ASC breaks the tie; GET /molds?product_model_id=${pm} shows MLD-CVN-1 and MLD-CVN-2 IN_CYCLE and MLD-CVN-3 AVAILABLE, all three at cycles_since_service 0"

