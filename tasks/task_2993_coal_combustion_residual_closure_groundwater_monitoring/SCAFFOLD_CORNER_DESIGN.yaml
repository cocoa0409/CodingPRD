            - "trigger call 2 returns HTTP 422 with error_id ERR_NO_BACKGROUND_WELL and MonitoringWell.${bg2_id}.well_status is still CERTIFIED"
            - "trigger call 3 returns HTTP 422 with error_id ERR_INSUFFICIENT_DOWNGRADIENT_WELLS and MonitoringWell.${dg1_id}.well_status is still CERTIFIED"
            - "MonitoringProgram.${prog_id}.network_certified is still true and background_well_count is still 1"

      - name: a_shipment_that_fills_the_commitment_bubbles_the_agreement_to_completed
        claim_type: bubble_up
        grounds:
          - state_machines.BeneficialReuseAgreement.ACTIVE_to_COMPLETED
          - calculations.ash_in_place_balance
          - validations.priority_23_ERR_INVALID_AGREEMENT_STATE
        distinguishing_aspect: |
          The parent agreement auto-transitions on the child write only when the running total lands
          exactly on committed_tons: the first 20000-ton shipment leaves it ACTIVE, the second 10000-ton
          shipment closes it to COMPLETED, and a third shipment of any size is then refused with
          ERR_INVALID_AGREEMENT_STATE rather than a tonnage error — which is the observable proof that
          the bubble-up actually fired. Exact equality, not a greater-or-equal test, is what separates
          the first two calls.
        test_recipe:
          setup:
            - "One clean unit with 480000 tons in place and one ACTIVE 30000-ton agreement whose window covers 2026"
            - "The unit version is re-read before each shipment so the OCC gate never fires"
          setup_api_calls:
            - call: "POST /ccr/professionals"
              payload: { full_name: "Owen Park", license_number: "PE-22002", license_state: "NC", discipline: "CIVIL" }
              as: UtilityAdmin
              captures: { pe_civil_id: $.data.id }
            - call: "POST /ccr/units"
