# =============================================================================
# Task 1860: Insurance Producer Licensing & Appointment Management
# Carrier licensing department — license verification & line-of-authority
# mapping, carrier appointment & termination filing by state, CE compliance &
# renewal deadlines, background/regulatory action monitoring, just-in-time
# appointment on first application, agency vs individual license hierarchy,
# commission hold for unlicensed activity, audit & regulatory inquiry response.
# =============================================================================

scenario: |
  1860. Insurance Producer Licensing & Appointment Management (carrier licensing
  department): license verification & line-of-authority mapping, carrier
  appointment & termination filing by state, continuing education compliance &
  renewal deadlines, background/regulatory action monitoring, just-in-time
  appointment triggers on first application, agency vs individual license
  hierarchy, commission hold for unlicensed activity, audit & regulatory
  inquiry response

domain_name: insurance-producer-licensing
api_prefix: /api

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: posture_driven_gating
  complexity_layers:
    - cascading_side_effects
    - derived_field_reconciliation
    - optimistic_concurrency
    - scheduled_actions
  entity_topology: flat
  state_machine_shape: cyclic
  relationship_patterns:
    - one_to_many
    - cross_aggregate
  role_model: segregation_of_duties
  consistency_model: immediate

# =============================================================================
# §1.0 Response Envelope (FIXED — verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table (flat topology — all entities top-level peers)
# =============================================================================
entities:
  - name: Agency
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Agency legal name" }
      - { name: resident_state_code, type: string, source: input, description: "Two-letter home state code" }

  - name: Producer
    parent: null
    common_fields: true
    fields:
      - { name: npn, type: string, source: input, description: "National Producer Number; unique across all producers", constraints: "unique" }
      - { name: full_name, type: string, source: input, description: "Producer full legal name" }
      - { name: resident_state_code, type: string, source: input, description: "Two-letter resident state code" }
      - { name: agency_id, type: string, source: input, default: null, description: "FK -> Agency.id; nullable; current affiliated agency (null = independent producer)" }
      - { name: status, type: enum, source: system, description: "ACTIVE | SUSPENDED", default: "ACTIVE" }
      - { name: ytd_issued_premium_cents, type: integer, source: computed, description: "Sum of premium_cents over this producer's PolicyApplications with status == ISSUED and issued_at within the logical clock's current calendar year; recomputed on issue/rescind", default: 0 }
      - { name: commission_held_cents, type: integer, source: computed, description: "Sum of amount_cents over this producer's CommissionEntries with status == HELD; recomputed on every commission status change", default: 0 }

  - name: License
    parent: null
    common_fields: true
    fields:
      - { name: producer_id, type: string, source: input, default: null, description: "FK -> Producer.id; nullable; exactly one of producer_id / agency_id must be set" }
      - { name: agency_id, type: string, source: input, default: null, description: "FK -> Agency.id; nullable; exactly one of producer_id / agency_id must be set" }
      - { name: state_code, type: string, source: input, description: "Two-letter state code of licensure" }
      - { name: license_class, type: enum, source: input, description: "RESIDENT | NON_RESIDENT" }
      - { name: lines_of_authority, type: array, source: input, description: "Non-empty subset of LIFE | ACCIDENT_HEALTH | PROPERTY | CASUALTY | PERSONAL_LINES" }
      - { name: status, type: enum, source: system, description: "ACTIVE | EXPIRED | SUSPENDED | REVOKED", default: "ACTIVE" }
      - { name: issue_date, type: datetime, source: input, description: "License issue instant (ISO8601 UTC)" }
      - { name: expiration_date, type: datetime, source: input, description: "License expiration instant; must be strictly after issue_date" }
      - { name: ce_period_start, type: datetime, source: computed, description: "Start of current CE compliance period; = issue_date at creation, = prior expiration_date on renew" }
      - { name: ce_period_end, type: datetime, source: computed, description: "End of current CE compliance period; = expiration_date" }
      - { name: ce_required_hours, type: number, source: input, default: 24, description: "Total CE hours required in current period (agency licenses conventionally 0)" }
      - { name: ce_ethics_required_hours, type: number, source: input, default: 3, description: "ETHICS-category hours required within the total" }
      - { name: ce_completed_hours, type: number, source: computed, description: "Hours counted toward renewal per ce_compliance_determination; recomputed on CECredit review", default: 0 }
      - { name: ce_ethics_completed_hours, type: number, source: computed, description: "ETHICS hours counted per ce_compliance_determination", default: 0 }
      - { name: renewed_count, type: integer, source: system, description: "Number of successful renewals", default: 0 }

  - name: CECredit
    parent: null
    common_fields: true
    fields:
      - { name: license_id, type: string, source: input, description: "FK -> License.id; license must be producer-held (producer_id non-null)" }
      - { name: provider_name, type: string, source: input, description: "CE provider name" }
      - { name: course_title, type: string, source: input, description: "Course title" }
      - { name: category, type: enum, source: input, description: "GENERAL | ETHICS" }
      - { name: credit_hours, type: number, source: input, description: "Credit hours; must be > 0, one decimal place max" }
      - { name: completed_on, type: datetime, source: input, description: "Course completion instant" }
      - { name: status, type: enum, source: system, description: "REPORTED | ACCEPTED | REJECTED", default: "REPORTED" }
      - { name: reviewed_by_user_id, type: string, source: system, default: null, description: "X-User-ID of reviewing LicensingCoordinator" }

  - name: Appointment
    parent: null
    common_fields: true
    fields:
      - { name: producer_id, type: string, source: input, default: null, description: "FK -> Producer.id; nullable; exactly one of producer_id / agency_id must be set" }
      - { name: agency_id, type: string, source: input, default: null, description: "FK -> Agency.id; nullable; exactly one of producer_id / agency_id must be set" }
      - { name: state_code, type: string, source: input, description: "State of appointment" }
      - { name: lines_of_authority, type: array, source: input, description: "Requested LOA subset" }
      - { name: origin, type: enum, source: system, description: "STANDARD (created via POST /appointments) | JIT (system-created on first application)", default: "STANDARD" }
      - { name: status, type: enum, source: system, description: "REQUESTED | JIT_PENDING | ACTIVE | TERMINATION_PENDING | TERMINATED | LAPSED", default: "REQUESTED" }
      - { name: effective_date, type: datetime, source: input, default: null, description: "STANDARD appointments: requested effective instant supplied at creation (back-dating permitted to cover prior sales); JIT appointments: system-set to the triggering application's submitted_at" }
      - { name: termination_date, type: datetime, source: system, default: null, description: "Set to logical clock at file-termination time; interval semantics [effective_date, termination_date) half-open" }
      - { name: termination_reason, type: enum, source: system, default: null, description: "VOLUNTARY | FOR_CAUSE | LICENSE_INACTIVE; cleared on rescind" }
      - { name: termination_initiated_at, type: datetime, source: system, default: null, description: "Logical clock at terminate time" }
      - { name: jit_filing_deadline, type: datetime, source: computed, default: null, description: "For JIT appointments: triggering application's submitted_at + JIT_FILING_WINDOW_DAYS (15) days; LAPSED when clock > deadline" }

  - name: PolicyApplication
    parent: null
    common_fields: true
    fields:
      - { name: producer_id, type: string, source: input, description: "FK -> Producer.id; writing producer" }
      - { name: state_code, type: string, source: input, description: "State where risk is written" }
      - { name: line_of_authority, type: enum, source: input, description: "Single LOA: LIFE | ACCIDENT_HEALTH | PROPERTY | CASUALTY | PERSONAL_LINES" }
      - { name: applicant_name, type: string, source: input, description: "Insured applicant name" }
      - { name: premium_cents, type: integer, source: input, description: "Written premium in cents; must be >= MIN_PREMIUM_CENTS (500)" }
      - { name: status, type: enum, source: system, description: "SUBMITTED | APPROVED | DECLINED | ISSUED | RESCINDED", default: "SUBMITTED" }
      - { name: submitted_at, type: datetime, source: system, description: "Logical clock at submission" }
      - { name: decided_at, type: datetime, source: system, default: null, description: "Logical clock at decide" }
      - { name: issued_at, type: datetime, source: system, default: null, description: "Logical clock at issue" }
      - { name: eligibility_snapshot, type: enum, source: computed, description: "ELIGIBLE | LICENSE_GAP | APPOINTMENT_GAP — posture evaluated at submission and re-evaluated at issue (PRODUCER_SUSPENDED never persists here: submission and issue both require producer ACTIVE)" }
      - { name: jit_appointment_id, type: string, source: system, default: null, description: "FK -> Appointment.id; JIT appointment created/linked at submission when licensed but unappointed" }

  - name: CommissionEntry
    parent: null
    common_fields: true
    fields:
      - { name: application_id, type: string, source: system, description: "FK -> PolicyApplication.id; source application" }
      - { name: producer_id, type: string, source: system, description: "FK -> Producer.id; earning producer (copied from application)" }
      - { name: amount_cents, type: integer, source: computed, description: "Commission per commission_amount_cents rule; provisional at submission, recomputed final at issue" }
      - { name: amount_variant, type: enum, source: system, description: "PROVISIONAL | FINAL", default: "PROVISIONAL" }
      - { name: status, type: enum, source: system, description: "HELD | PAYABLE | PAID | FORFEITED" }
      - { name: hold_reason, type: enum, source: system, default: null, description: "APPOINTMENT_PENDING | UNLICENSED_AT_SALE | REGULATORY_HOLD; null unless HELD" }

  - name: RegulatoryAction
    parent: null
    common_fields: true
    fields:
      - { name: producer_id, type: string, source: input, default: null, description: "FK -> Producer.id; nullable; exactly one of producer_id / agency_id must be set" }
      - { name: agency_id, type: string, source: input, default: null, description: "FK -> Agency.id; nullable; exactly one of producer_id / agency_id must be set" }
      - { name: state_code, type: string, source: input, description: "State bringing the action" }
      - { name: action_type, type: enum, source: input, description: "FINE | SUSPENSION | REVOCATION | PROBATION" }
      - { name: fine_amount_cents, type: integer, source: input, default: null, description: "Required iff action_type == FINE; must be > 0" }
      - { name: effective_date, type: datetime, source: input, description: "Action effective instant" }
      - { name: status, type: enum, source: system, description: "REPORTED | CONFIRMED | DISMISSED", default: "REPORTED" }
      - { name: created_by_user_id, type: string, source: system, description: "X-User-ID of creator (maker-checker input)" }
      - { name: decided_by_user_id, type: string, source: system, default: null, description: "X-User-ID of confirmer/dismisser; must differ from created_by_user_id" }
      - { name: fine_allocations, type: array, source: computed, default: [], description: "Per fine_allocation rule: [{ application_id, allocated_cents }] ordered by allocated_cents DESC then application created_at ASC; empty for non-FINE or when no ISSUED applications in state" }

  - name: RegulatoryInquiry
    parent: null
    common_fields: true
    fields:
      - { name: producer_id, type: string, source: input, default: null, description: "FK -> Producer.id; nullable; exactly one of producer_id / agency_id must be set" }
      - { name: agency_id, type: string, source: input, default: null, description: "FK -> Agency.id; nullable; exactly one of producer_id / agency_id must be set" }
      - { name: state_code, type: string, source: input, description: "Inquiring state DOI" }
      - { name: reference_number, type: string, source: input, description: "External inquiry reference; unique", constraints: "unique" }
      - { name: received_at, type: datetime, source: system, description: "Logical clock at creation" }
      - { name: response_due_at, type: datetime, source: computed, description: "received_at + INQUIRY_RESPONSE_DAYS (30) days" }
      - { name: status, type: enum, source: system, description: "OPEN | OVERDUE | RESPONSE_SUBMITTED | CLOSED", default: "OPEN" }
      - { name: response_text, type: string, source: input, default: null, description: "Carrier response narrative" }
      - { name: responded_at, type: datetime, source: system, default: null, description: "Logical clock at response" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: License
    initial_state: ACTIVE
    terminal_states: [REVOKED]
    transitions:
      - from: ACTIVE
        to: EXPIRED
        trigger: "system (POST /_clock/set_current_utc sweep when clock > expiration_date)"
        actor: system
        preconditions: ["clock strictly greater than expiration_date (license remains ACTIVE through the expiration instant itself)"]
        side_effects: ["status := EXPIRED", "increments License.version by 1"]
      - from: ACTIVE
        to: ACTIVE
        trigger: "POST /api/licenses/{licenseId}/renew"
        actor: LicensingCoordinator
        preconditions:
          - "expected_license_version == License.version (else ERR_STALE_VERSION)"
          - "clock within renewal window [expiration_date - 90 days, expiration_date] (else ERR_RENEWAL_WINDOW_CLOSED)"
          - "ce_compliance_determination == COMPLIANT (else ERR_CE_INCOMPLETE)"
        side_effects:
          - "expiration_date := expiration_date + 24 months; ce_period_start := prior ce_period_end; ce_period_end := new expiration_date"
          - "ce_completed_hours := 0; ce_ethics_completed_hours := 0; renewed_count += 1"
          - "increments License.version by 1"
      - from: EXPIRED
        to: ACTIVE
        trigger: "POST /api/licenses/{licenseId}/renew"
        actor: LicensingCoordinator
        preconditions:
          - "expected_license_version == License.version (else ERR_STALE_VERSION)"
          - "clock within grace (expiration_date, expiration_date + 30 days] (else ERR_RENEWAL_WINDOW_CLOSED)"
          - "ce_compliance_determination == COMPLIANT (else ERR_CE_INCOMPLETE)"
        side_effects:
          - "status := ACTIVE; expiration_date := prior expiration_date + 24 months; CE period and counters reset as in ACTIVE renew; renewed_count += 1"
          - "increments License.version by 1"
      - from: ACTIVE
        to: SUSPENDED
        trigger: "system (RegulatoryAction SUSPENSION confirmed for this subject and state)"
        actor: system
        preconditions: ["matching RegulatoryAction transitions REPORTED -> CONFIRMED with action_type == SUSPENSION and state_code == License.state_code"]
        side_effects:
          - "status := SUSPENDED; increments License.version by 1"
          - "cascade: every Appointment of the same subject in this state_code with status == ACTIVE -> TERMINATION_PENDING (termination_reason := LICENSE_INACTIVE, termination_initiated_at := clock); each such appointment mutation increments Appointment.version by 1"
          - "cascade from each such appointment mutation: every CommissionEntry of the same producer with status == PAYABLE -> HELD (hold_reason := REGULATORY_HOLD); each increments CommissionEntry.version by 1; Producer.commission_held_cents recomputed"
      - from: ACTIVE
        to: REVOKED
        trigger: "system (RegulatoryAction REVOCATION confirmed for this subject and state)"
        actor: system
        preconditions: ["matching RegulatoryAction transitions REPORTED -> CONFIRMED with action_type == REVOCATION and state_code == License.state_code"]
        side_effects:
          - "status := REVOKED; increments License.version by 1"
          - "cascade: same Appointment TERMINATION_PENDING chain as SUSPENSION"
          - "cascade from license revocation: every CommissionEntry of the same producer with status == HELD and hold_reason == UNLICENSED_AT_SALE -> FORFEITED; Producer.commission_held_cents recomputed"
      - from: SUSPENDED
        to: REVOKED
        trigger: "system (RegulatoryAction REVOCATION confirmed for this subject and state)"
        actor: system
        preconditions: ["matching RegulatoryAction REVOCATION confirmed"]
        side_effects: ["status := REVOKED; increments License.version by 1; UNLICENSED_AT_SALE holds -> FORFEITED as above"]
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /api/licenses/{licenseId}/reinstate"
        actor: ComplianceOfficer
        preconditions: ["status == SUSPENDED (else ERR_INVALID_STATE)"]
        side_effects: ["status := ACTIVE; increments License.version by 1; appointments previously cascaded to TERMINATION_PENDING are NOT auto-restored (coordinator may rescind-termination individually)"]

  - entity: Appointment
    initial_state: REQUESTED
    terminal_states: [TERMINATED, LAPSED]
    transitions:
      - from: REQUESTED
        to: ACTIVE
        trigger: "POST /api/appointments/{appointmentId}/file"
        actor: LicensingCoordinator
        preconditions:
          - "subject holds a License in state_code with status == ACTIVE whose lines_of_authority cover every requested LOA (else ERR_LICENSE_NOT_ACTIVE)"
        side_effects: ["status := ACTIVE; effective_date unchanged (set at creation); increments Appointment.version by 1"]
      - from: JIT_PENDING
        to: ACTIVE
        trigger: "POST /api/appointments/{appointmentId}/file"
        actor: LicensingCoordinator
        preconditions:
          - "same license-coverage precondition as REQUESTED file"
          - "clock <= jit_filing_deadline (filing on the deadline instant is timely)"
        side_effects: ["status := ACTIVE; increments Appointment.version by 1"]
      - from: JIT_PENDING
        to: LAPSED
        trigger: "system (POST /_clock/set_current_utc sweep when clock > jit_filing_deadline)"
        actor: system
        preconditions: ["clock strictly greater than jit_filing_deadline"]
        side_effects: ["status := LAPSED; increments Appointment.version by 1"]
      - from: ACTIVE
        to: TERMINATION_PENDING
        trigger: "POST /api/appointments/{appointmentId}/terminate"
        actor: LicensingCoordinator
        preconditions: ["termination_reason in {VOLUNTARY, FOR_CAUSE} supplied (missing -> ERR_INVALID_REQUEST)"]
        side_effects: ["status := TERMINATION_PENDING; termination_reason set; termination_initiated_at := clock; increments Appointment.version by 1"]
      - from: TERMINATION_PENDING
        to: ACTIVE
        trigger: "POST /api/appointments/{appointmentId}/rescind-termination"
        actor: LicensingCoordinator
        preconditions: ["subject license in state_code is ACTIVE (else ERR_LICENSE_NOT_ACTIVE)"]
        side_effects: ["status := ACTIVE; termination_reason := null; termination_initiated_at := null; effective_date unchanged; increments Appointment.version by 1"]
      - from: TERMINATION_PENDING
        to: TERMINATED
        trigger: "POST /api/appointments/{appointmentId}/file-termination"
        actor: LicensingCoordinator
        preconditions:
          - "if termination_reason == FOR_CAUSE: clock <= termination_initiated_at + 30 days (else ERR_TERMINATION_FILING_OVERDUE)"
        side_effects: ["status := TERMINATED; termination_date := clock; increments Appointment.version by 1"]
    note: "At most one non-terminal Appointment (REQUESTED | JIT_PENDING | ACTIVE | TERMINATION_PENDING) may exist per (subject, state_code); creation of a second yields ERR_APPOINTMENT_ALREADY_ACTIVE. Creation-time interval check: the requested effective_date must not fall inside any other of this subject's appointment intervals [effective_date, termination_date) in the same state_code (half-open: effective == prior termination_date is allowed); violation yields ERR_APPOINTMENT_INTERVAL_OVERLAP. The same check applies to system JIT creation (effective_date := submitted_at)."

  - entity: PolicyApplication
    initial_state: SUBMITTED
    terminal_states: [DECLINED, RESCINDED]
    transitions:
      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /api/applications/{applicationId}/decide with decision=APPROVE"
        actor: LicensingCoordinator
        preconditions:
          - "producer holds a License in state_code with status == ACTIVE covering line_of_authority (else ERR_LICENSE_NOT_ACTIVE)"
        side_effects: ["status := APPROVED; decided_at := clock; increments PolicyApplication.version by 1"]
      - from: SUBMITTED
        to: DECLINED
        trigger: "POST /api/applications/{applicationId}/decide with decision=DECLINE"
        actor: LicensingCoordinator
        preconditions: []
        side_effects: ["status := DECLINED; decided_at := clock; its CommissionEntry (any non-terminal status) -> FORFEITED; Producer.commission_held_cents recomputed; increments PolicyApplication.version by 1"]
      - from: SUBMITTED
        to: DECLINED
        trigger: "system (Producer ACTIVE -> SUSPENDED cascade)"
        actor: system
        preconditions: ["producer transitions to SUSPENDED while application is SUBMITTED"]
        side_effects: ["status := DECLINED; decided_at := clock; its CommissionEntry (any non-terminal status) -> FORFEITED; Producer.commission_held_cents recomputed; increments PolicyApplication.version by 1"]
      - from: APPROVED
        to: ISSUED
        trigger: "POST /api/applications/{applicationId}/issue"
        actor: LicensingCoordinator
        preconditions:
          - "producer.status == ACTIVE (else ERR_PRODUCER_SUSPENDED)"
          - "producer's own Appointment in state_code with status == ACTIVE covering line_of_authority, OR producer.agency_id non-null and that Agency holds an Appointment in state_code with status == ACTIVE covering line_of_authority (else ERR_APPOINTMENT_NOT_ACTIVE)"
        side_effects:
          - "status := ISSUED; issued_at := clock; eligibility_snapshot re-evaluated"
          - "Producer.ytd_issued_premium_cents recomputed per producer_ytd_issued_premium (application now in input set)"
          - "CommissionEntry recompute: amount_cents := commission_amount_cents FINAL variant (ytd evaluated before adding this application); amount_variant := FINAL"
          - "increments PolicyApplication.version by 1"
      - from: ISSUED
        to: RESCINDED
        trigger: "POST /api/applications/{applicationId}/rescind"
        actor: LicensingCoordinator
        preconditions: []
        side_effects:
          - "status := RESCINDED; increments PolicyApplication.version by 1"
          - "Producer.ytd_issued_premium_cents recomputed (application leaves input set)"
          - "its CommissionEntry (any status) -> FORFEITED; Producer.commission_held_cents recomputed"

  - entity: CommissionEntry
    initial_state: "HELD or PAYABLE (per creation rules on application submission)"
    terminal_states: [PAID, FORFEITED]
    transitions:
      - from: HELD
        to: PAYABLE
        trigger: "POST /api/commission-entries/{commissionEntryId}/release"
        actor: ComplianceOfficer
        preconditions:
          - "hold_reason == UNLICENSED_AT_SALE -> always rejected (ERR_HOLD_NOT_RELEASABLE)"
          - "hold_reason == APPOINTMENT_PENDING: producer's own Appointment or affiliated Agency's Appointment in application's state_code with status == ACTIVE covering application's line_of_authority must exist (else ERR_APPOINTMENT_NOT_ACTIVE)"
          - "hold_reason == REGULATORY_HOLD: the producer's License in the entry's application state_code must have status == ACTIVE (else ERR_REGULATORY_HOLD_ACTIVE)"
        side_effects: ["status := PAYABLE; hold_reason := null; Producer.commission_held_cents recomputed; increments CommissionEntry.version by 1"]
      - from: PAYABLE
        to: PAID
        trigger: "POST /api/commission-entries/{commissionEntryId}/pay"
        actor: FinanceOps
        preconditions: ["status == PAYABLE (else ERR_COMMISSION_NOT_PAYABLE)"]
        side_effects: ["status := PAID; increments CommissionEntry.version by 1"]
      - from: PAYABLE
        to: HELD
        trigger: "system (License SUSPENDED/REVOKED cascade from confirmed RegulatoryAction)"
        actor: system
        preconditions: ["producer's license in the entry's application state transitions ACTIVE -> SUSPENDED or REVOKED"]
        side_effects: ["status := HELD; hold_reason := REGULATORY_HOLD; Producer.commission_held_cents recomputed; increments CommissionEntry.version by 1"]
      - from: HELD
        to: FORFEITED
        trigger: "system (license REVOKED cascade for UNLICENSED_AT_SALE holds; or application DECLINED/RESCINDED)"
        actor: system
        preconditions: []
        side_effects: ["status := FORFEITED; Producer.commission_held_cents recomputed; increments CommissionEntry.version by 1"]

  - entity: RegulatoryAction
    initial_state: REPORTED
    terminal_states: [CONFIRMED, DISMISSED]
    transitions:
      - from: REPORTED
        to: CONFIRMED
        trigger: "POST /api/regulatory-actions/{regulatoryActionId}/confirm"
        actor: ComplianceOfficer
        preconditions:
          - "maker-checker: X-User-ID != created_by_user_id (else ERR_SOD_VIOLATION)"
          - "if action_type == PROBATION: no other RegulatoryAction for the same subject and state_code with action_type == PROBATION, status == CONFIRMED, and effective_date within the prior 365 days of this action's effective_date (gap must be >= 365 days; else ERR_PROBATION_SPACING)"
        side_effects:
          - "status := CONFIRMED; decided_by_user_id := X-User-ID; increments RegulatoryAction.version by 1"
          - "if action_type in {SUSPENSION, REVOCATION}: matching License (same subject, state_code) with status == ACTIVE -> SUSPENDED or REVOKED per License machine (which itself cascades to Appointments and CommissionEntries)"
          - "if action_type == FINE: fine_allocations computed per fine_allocation rule"
      - from: REPORTED
        to: DISMISSED
        trigger: "POST /api/regulatory-actions/{regulatoryActionId}/dismiss"
        actor: ComplianceOfficer
        preconditions: ["maker-checker: X-User-ID != created_by_user_id (else ERR_SOD_VIOLATION)"]
        side_effects: ["status := DISMISSED; decided_by_user_id := X-User-ID; increments RegulatoryAction.version by 1"]

  - entity: RegulatoryInquiry
    initial_state: OPEN
    terminal_states: [CLOSED]
    transitions:
      - from: OPEN
        to: OVERDUE
        trigger: "system (POST /_clock/set_current_utc sweep when clock > response_due_at)"
        actor: system
        preconditions: ["clock strictly greater than response_due_at"]
        side_effects:
          - "status := OVERDUE; increments RegulatoryInquiry.version by 1"
          - "cascade: subject Producer with status == ACTIVE -> SUSPENDED (increments Producer.version by 1)"
          - "cascade from producer suspension: that producer's PolicyApplications with status == SUBMITTED -> DECLINED (decided_at := clock; each increments PolicyApplication.version by 1; each such application's CommissionEntry (non-terminal) -> FORFEITED; Producer.commission_held_cents recomputed)"
      - from: OPEN
        to: RESPONSE_SUBMITTED
        trigger: "POST /api/inquiries/{inquiryId}/response"
        actor: "LicensingCoordinator | ComplianceOfficer"
        preconditions: ["expected_inquiry_version == RegulatoryInquiry.version (else ERR_STALE_VERSION)"]
        side_effects: ["status := RESPONSE_SUBMITTED; response_text set; responded_at := clock; increments RegulatoryInquiry.version by 1"]
      - from: OVERDUE
        to: RESPONSE_SUBMITTED
        trigger: "POST /api/inquiries/{inquiryId}/response"
        actor: "LicensingCoordinator | ComplianceOfficer"
        preconditions: ["expected_inquiry_version == RegulatoryInquiry.version (else ERR_STALE_VERSION)"]
        side_effects: ["status := RESPONSE_SUBMITTED; response_text set; responded_at := clock; increments RegulatoryInquiry.version by 1 (late response does NOT auto-reinstate producer)"]
      - from: RESPONSE_SUBMITTED
        to: CLOSED
        trigger: "POST /api/inquiries/{inquiryId}/close"
        actor: ComplianceOfficer
        preconditions: []
        side_effects: ["status := CLOSED; increments RegulatoryInquiry.version by 1"]

  - entity: Producer
    initial_state: ACTIVE
    terminal_states: []
    transitions:
      - from: ACTIVE
        to: SUSPENDED
        trigger: "system (RegulatoryInquiry OPEN -> OVERDUE cascade)"
        actor: system
        preconditions: ["an inquiry naming this producer transitions to OVERDUE"]
        side_effects: ["status := SUSPENDED; increments Producer.version by 1; cascade to SUBMITTED applications per RegulatoryInquiry machine"]
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /api/producers/{producerId}/reinstate"
        actor: ComplianceOfficer
        preconditions: ["no RegulatoryInquiry naming this producer with status == OVERDUE (else ERR_OVERDUE_INQUIRY_EXISTS)"]
        side_effects: ["status := ACTIVE; increments Producer.version by 1"]

  - entity: CECredit
    initial_state: REPORTED
    terminal_states: [ACCEPTED, REJECTED]
    transitions:
      - from: REPORTED
        to: ACCEPTED
        trigger: "POST /api/ce-credits/{ceCreditId}/review with decision=ACCEPT"
        actor: LicensingCoordinator
        preconditions: []
        side_effects: ["status := ACCEPTED; reviewed_by_user_id := X-User-ID; increments CECredit.version by 1; License ce_completed_hours / ce_ethics_completed_hours recomputed per ce_compliance_determination (increments License.version by 1)"]
      - from: REPORTED
        to: REJECTED
        trigger: "POST /api/ce-credits/{ceCreditId}/review with decision=REJECT"
        actor: LicensingCoordinator
        preconditions: []
        side_effects: ["status := REJECTED; reviewed_by_user_id := X-User-ID; increments CECredit.version by 1; License CE counters recomputed (unchanged by REJECTED credits)"]

# =============================================================================
# §1.2.1 Concurrency Rules (true races only; OCC on parent version)
# =============================================================================
concurrency_rules:
  - rule_id: license-renew-stale-version
    parent_entity: License
    write_endpoint: "POST /api/licenses/{licenseId}/renew"
    occ_field: "expected_license_version"
    description: |
      Renewing a License whose version has advanced since the client last
      observed it is rejected. This captures the case where another write
      (e.g., a CE credit acceptance recomputing ce_completed_hours, or a
      regulatory-action confirmation suspending the license) has legitimately
      advanced License.version and the renewing client's view is stale.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: inquiry-response-stale-version
    parent_entity: RegulatoryInquiry
    write_endpoint: "POST /api/inquiries/{inquiryId}/response"
    occ_field: "expected_inquiry_version"
    description: |
      Submitting a response against a RegulatoryInquiry whose version has
      advanced since the client last observed it is rejected. This captures
      the case where a clock sweep has legitimately moved the inquiry to
      OVERDUE (advancing its version) and the responding client's view is
      stale.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: ce_compliance_determination
    trigger: "CECredit review (ACCEPT/REJECT); evaluated at License renew"
    algorithm: threshold
    formula: |
      Input set: CECredit rows with license_id == License.id, status == ACCEPTED,
        and completed_on within [ce_period_start, ce_period_end] inclusive.
      ethics = sum(credit_hours where category == ETHICS)
      general = sum(credit_hours where category == GENERAL)
      Variant SPILLOVER (license_class == RESIDENT):
        ce_ethics_completed_hours = min(ethics, ce_ethics_required_hours)  [display: reported ethics, capped at requirement]
        ce_completed_hours = min(ethics + general, ce_required_hours)
        COMPLIANT iff (ethics + general) >= ce_required_hours AND ethics >= ce_ethics_required_hours
      Variant STRICT (license_class == NON_RESIDENT):
        ce_ethics_completed_hours = min(ethics, ce_ethics_required_hours)
        ce_completed_hours = min(ethics, ce_ethics_required_hours) + general
        COMPLIANT iff general >= (ce_required_hours - ce_ethics_required_hours) AND ethics >= ce_ethics_required_hours
      Hour comparisons use >= (exact equality passes).
    input_set: "ACCEPTED CECredits of the license whose completed_on falls inside the current CE period (both ends inclusive); REPORTED and REJECTED excluded"
    constants:
      DEFAULT_REQUIRED_HOURS: 24
      DEFAULT_ETHICS_HOURS: 3
    precision: "1 decimal place, round_half_up on input; comparisons exact"
    variants:
      - name: SPILLOVER
        when: "license_class == RESIDENT"
        difference: "All ETHICS hours also count toward the total-hours requirement (total = ethics + general)"
      - name: STRICT
        when: "license_class == NON_RESIDENT"
        difference: "ETHICS hours count only toward the ethics sub-requirement; general hours alone must cover (required - ethics_required)"

  - name: commission_amount_cents
    trigger: "CommissionEntry creation (PROVISIONAL variant, ytd evaluated at submission) and application issue (FINAL variant, ytd evaluated at issue before adding the application)"
    algorithm: tiered_pricing
    formula: |
      base_rate = LOA_BASE_RATE[application.line_of_authority]
      ytd = producer_ytd_issued_premium(producer) at evaluation instant
      volume_mult = 1.00 if ytd <  TIER2_THRESHOLD_CENTS
                    1.10 if TIER2_THRESHOLD_CENTS <= ytd < TIER3_THRESHOLD_CENTS
                    1.25 if ytd >= TIER3_THRESHOLD_CENTS
      uplift = AGENCY_UPLIFT if producer.agency_id non-null AND that Agency holds
               an Appointment in application.state_code with status == ACTIVE
               covering application.line_of_authority; else 1.00
      amount_cents = floor(application.premium_cents * base_rate * volume_mult * uplift)
      Single rounding: floor to whole cents applied once at the end.
    input_set: "the application, its producer, and the producer's YTD issued premium per producer_ytd_issued_premium"
    constants:
      TIER2_THRESHOLD_CENTS: 100000000
      TIER3_THRESHOLD_CENTS: 500000000
      AGENCY_UPLIFT: 1.05
    precision: "integer cents, floor applied once at the end"
    variants:
      - name: PROVISIONAL
        when: "evaluated at application submission (CommissionEntry creation)"
        difference: "volume_mult uses ytd_issued_premium at submission time"
      - name: FINAL
        when: "evaluated at application issue"
        difference: "volume_mult uses ytd_issued_premium at issue time, computed BEFORE the issuing application's premium enters the input set"

  - name: producer_ytd_issued_premium
    trigger: "application issue, application rescind, commission_amount_cents evaluation"
    algorithm: chronological
    formula: |
      Input set: PolicyApplication rows with producer_id == producer.id,
        status == ISSUED, and issued_at within the logical clock's current
        calendar year [Jan 1 00:00:00Z, next Jan 1 00:00:00Z).
      producer.ytd_issued_premium_cents = sum(premium_cents) over the input set.
      Discrete /issue API calls are processed in request order: each issuing
        application observes the ytd accumulated from previously processed ones.
        Any system batch over same-instant issues orders by issued_at ASC then
        PolicyApplication.created_at ASC.
    input_set: "ISSUED applications of the producer in the current calendar year of the logical clock (year window half-open [Jan 1, next Jan 1))"
    constants: {}
    precision: "integer cents"

  - name: fine_allocation
    trigger: "RegulatoryAction FINE confirmed"
    algorithm: waterfall_allocation
    formula: |
      Input set: the subject producer's PolicyApplications with status == ISSUED
        and state_code == RegulatoryAction.state_code, ordered by premium_cents
        DESC then created_at ASC.
      If the input set is empty: fine_allocations := [].
      Else, with P = sum(premium_cents) over the input set:
        for each application a: raw_a = fine_amount_cents * a.premium_cents / P
        allocated_a = floor(raw_a)                       # round per line first
        remainder = fine_amount_cents - sum(allocated_a) # then reconcile
        remainder cents are added one cent at a time to applications in input-set
        order until exhausted.
      fine_allocations = [{ application_id, allocated_cents }] in input-set order.
    input_set: "ISSUED applications of the subject producer in the action's state; ordering premium_cents DESC with created_at ASC tie-break"
    constants: {}
    precision: "integer cents; per-line floor applied BEFORE remainder reconciliation (round-per-line then distribute remainder — pinned order)"

  - name: jit_filing_deadline
    trigger: "system JIT appointment creation at application submission"
    algorithm: threshold
    formula: |
      jit_filing_deadline = application.submitted_at + JIT_FILING_WINDOW_DAYS days
      Filing is timely iff clock <= jit_filing_deadline (equality is timely).
      The clock sweep lapses the appointment iff clock > jit_filing_deadline.
    input_set: "the triggering application's submitted_at"
    constants:
      JIT_FILING_WINDOW_DAYS: 15
    precision: "datetime comparison to the second"

  - name: renewal_window
    trigger: "POST /api/licenses/{licenseId}/renew"
    algorithm: threshold
    formula: |
      window_open  = expiration_date - RENEWAL_WINDOW_DAYS_BEFORE days
      grace_close  = expiration_date + RENEWAL_GRACE_DAYS_AFTER days
      From ACTIVE: renew allowed iff window_open <= clock <= expiration_date
      From EXPIRED: renew allowed iff expiration_date < clock <= grace_close
      Outside: ERR_RENEWAL_WINDOW_CLOSED. Boundaries inclusive as shown.
    input_set: "the license's expiration_date and the logical clock"
    constants:
      RENEWAL_WINDOW_DAYS_BEFORE: 90
      RENEWAL_GRACE_DAYS_AFTER: 30
    precision: "datetime comparison to the second"

  - name: producer_eligibility_posture
    trigger: "GET /api/producers/{producerId}/eligibility; evaluated at application submission (eligibility_snapshot) and re-evaluated at issue"
    algorithm: constraint_propagation
    formula: |
      For (producer, state_code, line_of_authority):
      if producer.status != ACTIVE -> PRODUCER_SUSPENDED
      elif no License of producer in state_code with status == ACTIVE covering
           line_of_authority -> LICENSE_GAP
      elif no Appointment with status == ACTIVE covering line_of_authority in
           state_code held by producer OR by producer.agency_id's Agency
           -> APPOINTMENT_GAP
      else ELIGIBLE (via_agency = true iff only the agency appointment covers)
      Derivation precedence is fixed: PRODUCER_SUSPENDED > LICENSE_GAP > APPOINTMENT_GAP.
    input_set: "producer status, producer's licenses in state, producer's and affiliated agency's appointments in state"
    constants: {}
    precision: "n/a"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers present and role is a declared role"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"
  - priority: 2
    category: auth
    check: "Role is permitted for this endpoint per §1.5 roles"
    error_id: ERR_FORBIDDEN
    http_status: 403
    applies_to: "all"
  - priority: 3
    category: auth
    check: "Maker-checker segregation of duties: X-User-ID must differ from RegulatoryAction.created_by_user_id on confirm/dismiss"
    error_id: ERR_SOD_VIOLATION
    http_status: 403
    applies_to: "POST /api/regulatory-actions/{id}/confirm, POST /api/regulatory-actions/{id}/dismiss"
  - priority: 4
    category: existence
    check: "Path ids and body FK references (producer_id, agency_id, license_id, application_id) exist; validated left-to-right"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all resource endpoints"
  - priority: 5
    category: auth
    check: "Producer-role ownership scope: X-User-ID must equal the producer the resource belongs to (applications: body producer_id == X-User-ID; reads: resource's producer link == X-User-ID)"
    error_id: ERR_FORBIDDEN
    http_status: 403
    applies_to: "all endpoints when X-User-Role == Producer"
  - priority: 6
    category: state
    check: "Domain-specific state errors first: filing a LAPSED JIT appointment yields ERR_JIT_FILING_WINDOW_CLOSED; pay on a non-PAYABLE entry yields ERR_COMMISSION_NOT_PAYABLE"
    error_id: "ERR_JIT_FILING_WINDOW_CLOSED | ERR_COMMISSION_NOT_PAYABLE"
    http_status: 409
    applies_to: "POST /api/appointments/{id}/file, POST /api/commission-entries/{id}/pay"
  - priority: 7
    category: state
    check: "Generic state precondition: target entity is not in a state from which the requested transition exists (per §1.2) and no priority-6 domain error applies — e.g., renew on REVOKED/SUSPENDED, close on OPEN inquiry, review on terminal credit"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all state-transition endpoints"
  - priority: 8
    category: business_safety
    check: "Producer must be ACTIVE at application submission and at issue"
    error_id: ERR_PRODUCER_SUSPENDED
    http_status: 409
    applies_to: "POST /api/applications, POST /api/applications/{id}/issue"
  - priority: 9
    category: business_safety
    check: "License compliance gate: subject holds ACTIVE license in state covering the required LOA(s) — application approve, appointment file, appointment rescind"
    error_id: ERR_LICENSE_NOT_ACTIVE
    http_status: 409
    applies_to: "POST /api/applications/{id}/decide, POST /api/appointments/{id}/file, POST /api/appointments/{id}/rescind-termination"
  - priority: 10
    category: business_safety
    check: "CE compliance gate at renewal: ce_compliance_determination must be COMPLIANT"
    error_id: ERR_CE_INCOMPLETE
    http_status: 409
    applies_to: "POST /api/licenses/{id}/renew"
  - priority: 11
    category: business_safety
    check: "Appointment gate at issue: own or affiliated-agency ACTIVE appointment covering LOA"
    error_id: ERR_APPOINTMENT_NOT_ACTIVE
    http_status: 409
    applies_to: "POST /api/applications/{id}/issue, POST /api/commission-entries/{id}/release (APPOINTMENT_PENDING holds)"
  - priority: 12
    category: business_safety
    check: "Regulatory hold gate: no CONFIRMED SUSPENSION/REVOCATION against producer when releasing REGULATORY_HOLD; UNLICENSED_AT_SALE never releasable"
    error_id: "ERR_REGULATORY_HOLD_ACTIVE | ERR_HOLD_NOT_RELEASABLE"
    http_status: 409
    applies_to: "POST /api/commission-entries/{id}/release"
  - priority: 13
    category: business_constraint
    check: "Exactly one of producer_id / agency_id set on License, Appointment, RegulatoryAction, RegulatoryInquiry"
    error_id: ERR_LICENSE_SUBJECT_CONFLICT
    http_status: 422
    applies_to: "POST /api/licenses, POST /api/appointments, POST /api/regulatory-actions, POST /api/inquiries"
  - priority: 14
    category: business_constraint
    check: "At most one non-terminal License per (subject, state_code); non-terminal = status != REVOKED"
    error_id: ERR_DUPLICATE_LICENSE
    http_status: 409
    applies_to: "POST /api/licenses"
  - priority: 15
    category: business_constraint
    check: "At most one non-terminal Appointment per (subject, state_code); non-terminal = REQUESTED | JIT_PENDING | ACTIVE | TERMINATION_PENDING"
    error_id: ERR_APPOINTMENT_ALREADY_ACTIVE
    http_status: 409
    applies_to: "POST /api/appointments"
  - priority: 16
    category: business_constraint
    check: "CE credits only on producer-held licenses"
    error_id: ERR_CE_NOT_APPLICABLE
    http_status: 409
    applies_to: "POST /api/ce-credits"
  - priority: 17
    category: business_temporal
    check: "Renewal window: ACTIVE leg [expiration-90d, expiration], EXPIRED leg (expiration, expiration+30d]"
    error_id: ERR_RENEWAL_WINDOW_CLOSED
    http_status: 409
    applies_to: "POST /api/licenses/{id}/renew"
  - priority: 18
    category: business_temporal
    check: "Appointment interval overlap at creation: requested effective_date must not fall inside any other of the subject's appointment intervals [effective_date, termination_date) in the same state (half-open; effective == prior termination_date is allowed); also enforced for system JIT creation"
    error_id: ERR_APPOINTMENT_INTERVAL_OVERLAP
    http_status: 409
    applies_to: "POST /api/appointments"
  - priority: 19
    category: business_temporal
    check: "FOR_CAUSE termination must be filed within 30 days of terminate"
    error_id: ERR_TERMINATION_FILING_OVERDUE
    http_status: 409
    applies_to: "POST /api/appointments/{id}/file-termination"
  - priority: 20
    category: business_temporal
    check: "PROBATION spacing: effective_date must be >= 365 days after any other CONFIRMED PROBATION for same subject and state"
    error_id: ERR_PROBATION_SPACING
    http_status: 409
    applies_to: "POST /api/regulatory-actions/{id}/confirm"
  - priority: 21
    category: business_fiscal
    check: "premium_cents >= 500 on application submission"
    error_id: ERR_PREMIUM_BELOW_MINIMUM
    http_status: 422
    applies_to: "POST /api/applications"
  - priority: 22
    category: business_referential
    check: "Producer reinstate requires no OVERDUE inquiries naming the producer"
    error_id: ERR_OVERDUE_INQUIRY_EXISTS
    http_status: 409
    applies_to: "POST /api/producers/{id}/reinstate"

# =============================================================================
# §1.5 API Endpoint Table (flat URLs; all list GETs paginated per §1.0)
# =============================================================================
endpoints:
  # --- Agency ---
  - method: POST
    path: "/api/agencies"
    description: "Create an agency"
    roles: [LicensingCoordinator, CarrierAdmin]
    code: 201
    input: [name, resident_state_code]
    output: Agency
    side_effects: []

  # --- Producer ---
  - method: POST
    path: "/api/producers"
    description: "Create a producer (optionally affiliated to an agency)"
    roles: [LicensingCoordinator]
    code: 201
    input: [npn, full_name, resident_state_code, "agency_id?"]
    output: Producer
    side_effects: ["status=ACTIVE; ytd/held counters 0"]
  - method: GET
    path: "/api/producers/{producerId}"
    description: "Get a producer (Producer role: self only)"
    roles: [LicensingCoordinator, ComplianceOfficer, FinanceOps, CarrierAdmin, Producer]
    code: 200
    input: []
    output: Producer
    side_effects: []
  - method: GET
    path: "/api/producers"
    description: "List producers with filters"
    roles: [LicensingCoordinator, ComplianceOfficer, FinanceOps, CarrierAdmin]
    code: 200
    input: ["agency_id?", "status?", "limit?", "offset?"]
    output: Producer[]
    side_effects: []
  - method: POST
    path: "/api/producers/{producerId}/reinstate"
    description: "Reinstate a SUSPENDED producer (requires no OVERDUE inquiries)"
    roles: [ComplianceOfficer]
    code: 200
    input: []
    output: Producer
    side_effects: ["status SUSPENDED -> ACTIVE; increments Producer.version by 1"]

  # --- License ---
  - method: POST
    path: "/api/licenses"
    description: "Create a producer- or agency-held license"
    roles: [LicensingCoordinator]
    code: 201
    input: ["producer_id?", "agency_id?", state_code, license_class, lines_of_authority, issue_date, expiration_date, "ce_required_hours?", "ce_ethics_required_hours?"]
    output: License
    side_effects: ["status=ACTIVE; ce_period_start=issue_date; ce_period_end=expiration_date; ERR_DUPLICATE_LICENSE if non-terminal license exists for (subject, state_code)"]
  - method: GET
    path: "/api/licenses/{licenseId}"
    description: "Get a license"
    roles: [LicensingCoordinator, ComplianceOfficer, FinanceOps, CarrierAdmin, Producer]
    code: 200
    input: []
    output: License
    side_effects: []
  - method: GET
    path: "/api/licenses"
    description: "List licenses with filters"
    roles: [LicensingCoordinator, ComplianceOfficer, CarrierAdmin]
    code: 200
    input: ["producer_id?", "agency_id?", "state_code?", "status?", "limit?", "offset?"]
    output: License[]
    side_effects: []
  - method: POST
    path: "/api/licenses/{licenseId}/renew"
    description: "Renew a license (OCC-guarded); ACTIVE within window or EXPIRED within grace; requires CE compliance; extends expiration +24 months and resets CE period/counters"
    roles: [LicensingCoordinator]
    code: 200
    input: [expected_license_version]
    output: License
    side_effects: ["License renew transition per §1.2; increments License.version by 1"]
  - method: POST
    path: "/api/licenses/{licenseId}/reinstate"
    description: "Reinstate a SUSPENDED license to ACTIVE (regulatory cure)"
    roles: [ComplianceOfficer]
    code: 200
    input: []
    output: License
    side_effects: ["SUSPENDED -> ACTIVE; increments License.version by 1"]

  # --- CECredit ---
  - method: POST
    path: "/api/ce-credits"
    description: "Report a CE credit against a producer-held license"
    roles: [Producer, LicensingCoordinator]
    code: 201
    input: [license_id, provider_name, course_title, category, credit_hours, completed_on]
    output: CECredit
    side_effects: ["status=REPORTED"]
  - method: GET
    path: "/api/ce-credits/{ceCreditId}"
    description: "Get a CE credit"
    roles: [LicensingCoordinator, ComplianceOfficer, CarrierAdmin, Producer]
    code: 200
    input: []
    output: CECredit
    side_effects: []
  - method: GET
    path: "/api/ce-credits"
    description: "List CE credits with filters"
    roles: [LicensingCoordinator, ComplianceOfficer, CarrierAdmin]
    code: 200
    input: ["license_id?", "status?", "limit?", "offset?"]
    output: CECredit[]
    side_effects: []
  - method: POST
    path: "/api/ce-credits/{ceCreditId}/review"
    description: "Accept or reject a REPORTED CE credit"
    roles: [LicensingCoordinator]
    code: 200
    input: [decision]
    output: CECredit
    side_effects: ["REPORTED -> ACCEPTED | REJECTED; License CE counters recomputed per ce_compliance_determination (increments License.version by 1)"]

  # --- Appointment ---
  - method: POST
    path: "/api/appointments"
    description: "Request a STANDARD appointment for a producer or agency in a state"
    roles: [LicensingCoordinator]
    code: 201
    input: ["producer_id?", "agency_id?", state_code, lines_of_authority, effective_date]
    output: Appointment
    side_effects: ["status=REQUESTED, origin=STANDARD; ERR_APPOINTMENT_ALREADY_ACTIVE if a non-terminal appointment exists for (subject, state_code); ERR_APPOINTMENT_INTERVAL_OVERLAP if effective_date falls inside another of the subject's appointment intervals in the same state"]
  - method: GET
    path: "/api/appointments/{appointmentId}"
    description: "Get an appointment"
    roles: [LicensingCoordinator, ComplianceOfficer, CarrierAdmin, Producer]
    code: 200
    input: []
    output: Appointment
    side_effects: []
  - method: GET
    path: "/api/appointments"
    description: "List appointments with filters"
    roles: [LicensingCoordinator, ComplianceOfficer, CarrierAdmin]
    code: 200
    input: ["producer_id?", "agency_id?", "state_code?", "status?", "limit?", "offset?"]
    output: Appointment[]
    side_effects: []
  - method: POST
    path: "/api/appointments/{appointmentId}/file"
    description: "File a REQUESTED or JIT_PENDING appointment with the state; sets effective_date"
    roles: [LicensingCoordinator]
    code: 200
    input: []
    output: Appointment
    side_effects: ["-> ACTIVE per §1.2; increments Appointment.version by 1"]
  - method: POST
    path: "/api/appointments/{appointmentId}/terminate"
    description: "Initiate termination of an ACTIVE appointment"
    roles: [LicensingCoordinator]
    code: 200
    input: [termination_reason]
    output: Appointment
    side_effects: ["ACTIVE -> TERMINATION_PENDING; increments Appointment.version by 1"]
  - method: POST
    path: "/api/appointments/{appointmentId}/file-termination"
    description: "File a pending termination with the state (FOR_CAUSE within 30 days); sets termination_date"
    roles: [LicensingCoordinator]
    code: 200
    input: []
    output: Appointment
    side_effects: ["TERMINATION_PENDING -> TERMINATED; increments Appointment.version by 1"]
  - method: POST
    path: "/api/appointments/{appointmentId}/rescind-termination"
    description: "Rescind a pending termination (requires subject license ACTIVE)"
    roles: [LicensingCoordinator]
    code: 200
    input: []
    output: Appointment
    side_effects: ["TERMINATION_PENDING -> ACTIVE, termination fields cleared; increments Appointment.version by 1"]

  # --- PolicyApplication ---
  - method: POST
    path: "/api/applications"
    description: "Submit a policy application; evaluates eligibility snapshot, creates JIT appointment when licensed-but-unappointed, creates provisional CommissionEntry"
    roles: [Producer, LicensingCoordinator]
    code: 201
    input: [producer_id, state_code, line_of_authority, applicant_name, premium_cents]
    output: PolicyApplication
    side_effects:
      - "submitted_at := logical clock; eligibility_snapshot per producer_eligibility_posture"
      - "if eligibility_snapshot == APPOINTMENT_GAP (license ACTIVE covering LOA but neither own nor agency appointment covers): create Appointment origin=JIT, status=JIT_PENDING, lines_of_authority=[line_of_authority], effective_date := submitted_at, jit_filing_deadline = submitted_at + 15 days; set application.jit_appointment_id"
      - "create CommissionEntry: amount_cents per commission_amount_cents PROVISIONAL; status PAYABLE if eligibility_snapshot == ELIGIBLE; HELD with hold_reason APPOINTMENT_PENDING if APPOINTMENT_GAP; HELD with UNLICENSED_AT_SALE if LICENSE_GAP"
  - method: GET
    path: "/api/applications/{applicationId}"
    description: "Get an application"
    roles: [LicensingCoordinator, ComplianceOfficer, CarrierAdmin, Producer]
    code: 200
    input: []
    output: PolicyApplication
    side_effects: []
  - method: GET
    path: "/api/applications"
    description: "List applications with filters"
    roles: [LicensingCoordinator, ComplianceOfficer, CarrierAdmin]
    code: 200
    input: ["producer_id?", "status?", "jit_appointment_id?", "limit?", "offset?"]
    output: PolicyApplication[]
    side_effects: []
  - method: POST
    path: "/api/applications/{applicationId}/decide"
    description: "Approve (license gate) or decline a SUBMITTED application"
    roles: [LicensingCoordinator]
    code: 200
    input: [decision]
    output: PolicyApplication
    side_effects: ["SUBMITTED -> APPROVED | DECLINED per §1.2; DECLINE forfeits its CommissionEntry; increments PolicyApplication.version by 1"]
  - method: POST
    path: "/api/applications/{applicationId}/issue"
    description: "Issue an APPROVED application (appointment gate); recomputes YTD and final commission"
    roles: [LicensingCoordinator]
    code: 200
    input: []
    output: PolicyApplication
    side_effects: ["APPROVED -> ISSUED per §1.2; Producer.ytd_issued_premium_cents recomputed; CommissionEntry FINAL recompute; increments PolicyApplication.version by 1"]
  - method: POST
    path: "/api/applications/{applicationId}/rescind"
    description: "Rescind an ISSUED application; YTD reconciliation and commission forfeiture"
    roles: [LicensingCoordinator]
    code: 200
    input: []
    output: PolicyApplication
    side_effects: ["ISSUED -> RESCINDED per §1.2; Producer.ytd_issued_premium_cents recomputed; CommissionEntry -> FORFEITED; increments PolicyApplication.version by 1"]

  # --- CommissionEntry ---
  - method: GET
    path: "/api/commission-entries/{commissionEntryId}"
    description: "Get a commission entry"
    roles: [LicensingCoordinator, ComplianceOfficer, FinanceOps, CarrierAdmin, Producer]
    code: 200
    input: []
    output: CommissionEntry
    side_effects: []
  - method: GET
    path: "/api/commission-entries"
    description: "List commission entries with filters"
    roles: [LicensingCoordinator, ComplianceOfficer, FinanceOps, CarrierAdmin]
    code: 200
    input: ["application_id?", "producer_id?", "status?", "limit?", "offset?"]
    output: CommissionEntry[]
    side_effects: []
  - method: POST
    path: "/api/commission-entries/{commissionEntryId}/release"
    description: "Release a HELD commission to PAYABLE per hold-reason gates"
    roles: [ComplianceOfficer]
    code: 200
    input: []
    output: CommissionEntry
    side_effects: ["HELD -> PAYABLE per §1.2; Producer.commission_held_cents recomputed; increments CommissionEntry.version by 1"]
  - method: POST
    path: "/api/commission-entries/{commissionEntryId}/pay"
    description: "Pay a PAYABLE commission"
    roles: [FinanceOps]
    code: 200
    input: []
    output: CommissionEntry
    side_effects: ["PAYABLE -> PAID; increments CommissionEntry.version by 1"]

  # --- RegulatoryAction ---
  - method: POST
    path: "/api/regulatory-actions"
    description: "Report a regulatory action against a producer or agency"
    roles: [ComplianceOfficer]
    code: 201
    input: ["producer_id?", "agency_id?", state_code, action_type, "fine_amount_cents?", effective_date]
    output: RegulatoryAction
    side_effects: ["status=REPORTED; created_by_user_id := X-User-ID"]
  - method: GET
    path: "/api/regulatory-actions/{regulatoryActionId}"
    description: "Get a regulatory action"
    roles: [LicensingCoordinator, ComplianceOfficer, CarrierAdmin, Producer]
    code: 200
    input: []
    output: RegulatoryAction
    side_effects: []
  - method: GET
    path: "/api/regulatory-actions"
    description: "List regulatory actions with filters"
    roles: [LicensingCoordinator, ComplianceOfficer, CarrierAdmin]
    code: 200
    input: ["producer_id?", "agency_id?", "status?", "limit?", "offset?"]
    output: RegulatoryAction[]
    side_effects: []
  - method: POST
    path: "/api/regulatory-actions/{regulatoryActionId}/confirm"
    description: "Confirm a REPORTED action (maker-checker; probation spacing; triggers license/appointment/commission cascade and fine allocation)"
    roles: [ComplianceOfficer]
    code: 200
    input: []
    output: RegulatoryAction
    side_effects: ["REPORTED -> CONFIRMED per §1.2 with full cascade; increments RegulatoryAction.version by 1"]
  - method: POST
    path: "/api/regulatory-actions/{regulatoryActionId}/dismiss"
    description: "Dismiss a REPORTED action (maker-checker)"
    roles: [ComplianceOfficer]
    code: 200
    input: []
    output: RegulatoryAction
    side_effects: ["REPORTED -> DISMISSED; increments RegulatoryAction.version by 1"]

  # --- RegulatoryInquiry ---
  - method: POST
    path: "/api/inquiries"
    description: "Open a regulatory inquiry against a producer or agency"
    roles: [ComplianceOfficer]
    code: 201
    input: ["producer_id?", "agency_id?", state_code, reference_number]
    output: RegulatoryInquiry
    side_effects: ["status=OPEN; received_at := clock; response_due_at := received_at + 30 days"]
  - method: GET
    path: "/api/inquiries/{inquiryId}"
    description: "Get an inquiry"
    roles: [LicensingCoordinator, ComplianceOfficer, CarrierAdmin, Producer]
    code: 200
    input: []
    output: RegulatoryInquiry
    side_effects: []
  - method: GET
    path: "/api/inquiries"
    description: "List inquiries with filters"
    roles: [LicensingCoordinator, ComplianceOfficer, CarrierAdmin]
    code: 200
    input: ["producer_id?", "agency_id?", "status?", "limit?", "offset?"]
    output: RegulatoryInquiry[]
    side_effects: []
  - method: POST
    path: "/api/inquiries/{inquiryId}/response"
    description: "Submit inquiry response (OCC-guarded; allowed from OPEN and OVERDUE)"
    roles: [LicensingCoordinator, ComplianceOfficer]
    code: 200
    input: [response_text, expected_inquiry_version]
    output: RegulatoryInquiry
    side_effects: ["OPEN|OVERDUE -> RESPONSE_SUBMITTED; increments RegulatoryInquiry.version by 1"]
  - method: POST
    path: "/api/inquiries/{inquiryId}/close"
    description: "Close a RESPONSE_SUBMITTED inquiry"
    roles: [ComplianceOfficer]
    code: 200
    input: []
    output: RegulatoryInquiry
    side_effects: ["RESPONSE_SUBMITTED -> CLOSED; increments RegulatoryInquiry.version by 1"]

  # --- Computed read: eligibility posture ---
  - method: GET
    path: "/api/producers/{producerId}/eligibility"
    description: "Computed eligibility posture of a producer for (state_code, line_of_authority) per producer_eligibility_posture"
    roles: [LicensingCoordinator, ComplianceOfficer, FinanceOps, CarrierAdmin, Producer]
    code: 200
    input: [state_code, line_of_authority]
    output: "{ eligibility_status: enum, license_id: string|null, appointment_id: string|null, via_agency: boolean }"
    side_effects: []

  # --- Test-driving: logical clock ---
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the logical clock. Startup default is exactly 2026-08-01T00:00:00Z and the server MUST NOT fall back to wall-clock time. Setting the clock runs the compliance sweep: ACTIVE licenses with expiration_date < new time -> EXPIRED; JIT_PENDING appointments with jit_filing_deadline < new time -> LAPSED; OPEN inquiries with response_due_at < new time -> OVERDUE (with producer-suspension cascade per §1.2). Sweep uses strict >: an entity whose deadline equals the new time is NOT swept."
    roles: [CarrierAdmin]
    code: 200
    input: [to_iso8601]
    output: "{ current_utc: datetime }"
    side_effects: ["compliance sweep per description; each swept entity's version increments by 1"]

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "Missing/invalid X-User-ID or X-User-Role headers" }
  - { id: ERR_FORBIDDEN, http: 403, condition: "Role not permitted for endpoint; or Producer-role ownership scope violated" }
  - { id: ERR_SOD_VIOLATION, http: 403, condition: "Maker-checker breach: confirmer/dismisser X-User-ID equals RegulatoryAction.created_by_user_id" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Path id or referenced body FK does not exist" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Missing required field, invalid enum value, malformed datetime, credit_hours <= 0, expiration_date <= issue_date, or uniqueness violation on Producer.npn / RegulatoryInquiry.reference_number" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Target entity not in a state from which the requested transition exists (generic state precondition)" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "OCC: expected_<parent>_version does not match the parent entity's current version" }
  - { id: ERR_PRODUCER_SUSPENDED, http: 409, condition: "Application submission by a producer with status != ACTIVE" }
  - { id: ERR_LICENSE_NOT_ACTIVE, http: 409, condition: "Required ACTIVE license covering the needed LOA(s) in the state is missing (approve / appointment file / rescind-termination gates)" }
  - { id: ERR_CE_INCOMPLETE, http: 409, condition: "Renewal attempted while ce_compliance_determination != COMPLIANT" }
  - { id: ERR_CE_NOT_APPLICABLE, http: 409, condition: "CE credit reported against an agency-held license" }
  - { id: ERR_DUPLICATE_LICENSE, http: 409, condition: "A non-terminal license already exists for (subject, state_code)" }
  - { id: ERR_APPOINTMENT_NOT_ACTIVE, http: 409, condition: "Required ACTIVE appointment (own or affiliated agency) covering the LOA is missing (issue / release gates)" }
  - { id: ERR_APPOINTMENT_ALREADY_ACTIVE, http: 409, condition: "A non-terminal appointment already exists for (subject, state_code)" }
  - { id: ERR_APPOINTMENT_INTERVAL_OVERLAP, http: 409, condition: "Filing would place effective instant inside another of the subject's appointment intervals [effective_date, termination_date) in the same state" }
  - { id: ERR_JIT_FILING_WINDOW_CLOSED, http: 409, condition: "Filing attempted on a LAPSED JIT appointment (clock > jit_filing_deadline at sweep)" }
  - { id: ERR_RENEWAL_WINDOW_CLOSED, http: 409, condition: "Renewal outside [expiration-90d, expiration] (ACTIVE) and outside (expiration, expiration+30d] grace (EXPIRED)" }
  - { id: ERR_TERMINATION_FILING_OVERDUE, http: 409, condition: "FOR_CAUSE termination filed more than 30 days after terminate" }
  - { id: ERR_HOLD_NOT_RELEASABLE, http: 409, condition: "Release attempted on a HELD commission with hold_reason == UNLICENSED_AT_SALE" }
  - { id: ERR_REGULATORY_HOLD_ACTIVE, http: 409, condition: "Release attempted on REGULATORY_HOLD while a CONFIRMED SUSPENSION/REVOCATION action exists against the producer" }
  - { id: ERR_COMMISSION_NOT_PAYABLE, http: 409, condition: "Pay attempted on a commission entry whose status != PAYABLE" }
  - { id: ERR_PREMIUM_BELOW_MINIMUM, http: 422, condition: "premium_cents < 500 on application submission" }
  - { id: ERR_PROBATION_SPACING, http: 409, condition: "Confirming a PROBATION action whose effective_date is < 365 days after another CONFIRMED PROBATION for the same subject and state" }
  - { id: ERR_OVERDUE_INQUIRY_EXISTS, http: 409, condition: "Producer reinstate attempted while an inquiry naming the producer is OVERDUE" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: Producer
    description: "Licensed insurance producer acting on their own book; ownership-scoped to resources whose producer link equals X-User-ID"
    identity: "entity_backed:Producer"
    exclusive_operations:
      - "Submit applications for self (POST /api/applications with producer_id == X-User-ID)"
      - "Report CE credits against own licenses (POST /api/ce-credits)"
    shared_operations:
      - "Read own producers/licenses/appointments/applications/commission-entries/regulatory-actions/inquiries records and own eligibility"
  - name: LicensingCoordinator
    description: "Carrier licensing department staff; runs the licensing/appointment/CE/application workflow"
    identity: "opaque"
    exclusive_operations:
      - "Create producers and licenses; renew licenses"
      - "Create/file/terminate/file-termination/rescind appointments"
      - "Review CE credits; decide/issue/rescind applications"
    shared_operations:
      - "Read all licensing records"
      - "Submit applications on behalf of producers (POST /api/applications)"
      - "Submit inquiry responses (POST /api/inquiries/{id}/response)"
      - "Create agencies (shared with CarrierAdmin)"
  - name: ComplianceOfficer
    description: "Carrier compliance; owns regulatory actions, inquiries, commission holds, producer reinstatement; maker-checker applies to action confirm/dismiss"
    identity: "opaque"
    exclusive_operations:
      - "Create/confirm/dismiss regulatory actions (confirm/dismiss require X-User-ID != created_by_user_id)"
      - "Create/close inquiries; release commission holds; reinstate producers and suspended licenses"
    shared_operations:
      - "Read all records"
      - "Submit inquiry responses (shared with LicensingCoordinator)"
  - name: FinanceOps
    description: "Carrier finance; pays commissions"
    identity: "opaque"
    exclusive_operations:
      - "Pay PAYABLE commission entries (POST /api/commission-entries/{id}/pay)"
    shared_operations:
      - "Read all records (commissions focus)"
  - name: CarrierAdmin
    description: "Carrier administrator; operates the logical clock and reads everything; bound by the same maker-checker rule (cannot confirm/dismiss own regulatory actions)"
    identity: "opaque"
    exclusive_operations:
      - "Set logical clock (POST /_clock/set_current_utc)"
    shared_operations:
      - "Read all records; create agencies (shared with LicensingCoordinator)"
