  # ---------------------------------------------------------------------------
  # Rule 3 — non_linear_state_machine (different entities: EnrollmentFile, Requester)
  # ---------------------------------------------------------------------------
  - rule_id: non_linear_state_machine
    instances:
      - name: enrollment_file_certified_amendment_recertified_cycle
        grounds:
          - state_machines.EnrollmentFile.CERTIFIED_to_AMENDMENT_PENDING
          - state_machines.EnrollmentFile.AMENDMENT_PENDING_to_CERTIFIED
          - entities.EnrollmentFile.fields.open_correction_count
        distinguishing_aspect: |
          Cyclic machine on EnrollmentFile: CERTIFIED -> AMENDMENT_PENDING (case
          filed) -> CERTIFIED (case decided, count drains to 0) — the cycle can be
          re-entered, and the open_correction_count ledger gates the return hop.
        test_recipe:
          setup:
            - "Compliant institution; certified Fall 2026 file with one ACCEPTED entry (UNDERGRAD 12.0)"
          setup_api_calls:
            - { call: "POST /institutions", payload: { name: "State University", ope_id: "00123400", users: [ { email: "sub@su.edu", role: "SUBMITTER" }, { email: "cert@su.edu", role: "CERTIFIER" } ] }, as: ClearinghouseOps, captures: { inst_id: "$.data.id", sub_uid: "$.data.users[0].id", cert_uid: "$.data.users[1].id" } }
            - { call: "POST /institutions/${inst_id}/agreements", payload: { effective_from: "2026-01-01", effective_to: "2027-06-30" }, as: ClearinghouseOps }
            - { call: "POST /institutions/${inst_id}/reporting-periods", payload: { term_label: "Fall 2026", term_start: "2026-09-01", term_end: "2026-12-15", submission_opens_at: "2026-11-01", submission_due_at: "2026-12-20" }, as: ClearinghouseOps, captures: { period_id: "$.data.id" } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-11-15T00:00:00Z" }, as: ClearinghouseOps }
            - { call: "GET /institutions/${inst_id}/reporting-periods", payload: {}, as: ClearinghouseOps, captures: { period_v: "$.data[0].version" } }
            - { call: "POST /enrollment-files", payload: { institution_id: "${inst_id}", reporting_period_id: "${period_id}", expected_reporting_period_version: "${period_v}", rows: [ { student_ref: "S1", full_name: "Ada Lovelace", date_of_birth: "2004-05-12", career_level: "UNDERGRAD", credit_hours: 12.0, term_start: "2026-09-01", term_end: "2026-12-15" } ] }, as: RegistrarSubmitter, as_user_id: "${sub_uid}", captures: { file_id: "$.data.id" } }
            - { call: "POST /enrollment-files/${file_id}/certify", payload: {}, as: RegistrarCertifier, as_user_id: "${cert_uid}" }
            - { call: "GET /enrollment-entries", payload: { file_id: "${file_id}" }, as: ClearinghouseOps, captures: { e1: "$.data[0].id" } }
          trigger:
            - { call: "POST /correction-cases", payload: { enrollment_entry_id: "${e1}", corrected_credit_hours: 15.0, reason_code: "REPORTING_ERROR" }, as: RegistrarSubmitter, as_user_id: "${sub_uid}", captures: { case_id: "$.data.id" } }
            - { call: "GET /enrollment-files/${file_id}", payload: {}, as: ClearinghouseOps, captures: { f_mid_status: "$.data.status", f_mid_open: "$.data.open_correction_count" } }
            - { call: "POST /correction-cases/${case_id}/decision", payload: { outcome: "APPROVED" }, as: RegistrarCertifier, as_user_id: "${cert_uid}" }
            - { call: "GET /enrollment-files/${file_id}", payload: {}, as: ClearinghouseOps, captures: { f_end_status: "$.data.status", f_end_open: "$.data.open_correction_count" } }
          assert:
            - "captured f_mid_status == AMENDMENT_PENDING and f_mid_open == 1"
            - "captured f_end_status == CERTIFIED and f_end_open == 0 (cycle completed, not stuck)"

      - name: requester_vetting_suspension_revetting_cycle
        grounds:
          - state_machines.Requester.VETTED_to_SUSPENDED
          - state_machines.Requester.SUSPENDED_to_VETTED
          - validations[priority=5]
        distinguishing_aspect: |
          Cyclic machine on a different entity (Requester): VETTED -> SUSPENDED ->
          VETTED via a second vet action; the eligibility gate re-opens after the
          loop, which a linear pipeline reading cannot express.
        test_recipe:
          setup:
            - "Compliant institution with one student; requester created PENDING_VETTING"
          setup_api_calls:
            - { call: "POST /institutions", payload: { name: "State University", ope_id: "00123400", users: [ { email: "sub@su.edu", role: "SUBMITTER" }, { email: "cert@su.edu", role: "CERTIFIER" } ] }, as: ClearinghouseOps, captures: { inst_id: "$.data.id", sub_uid: "$.data.users[0].id" } }
            - { call: "POST /institutions/${inst_id}/agreements", payload: { effective_from: "2026-01-01", effective_to: "2027-06-30" }, as: ClearinghouseOps }
            - { call: "POST /institutions/${inst_id}/reporting-periods", payload: { term_label: "Fall 2026", term_start: "2026-08-01", term_end: "2026-12-15", submission_opens_at: "2026-08-15", submission_due_at: "2026-12-20" }, as: ClearinghouseOps, captures: { period_id: "$.data.id" } }
            - { call: "GET /institutions/${inst_id}/reporting-periods", payload: {}, as: ClearinghouseOps, captures: { period_v: "$.data[0].version" } }
            - { call: "POST /enrollment-files", payload: { institution_id: "${inst_id}", reporting_period_id: "${period_id}", expected_reporting_period_version: "${period_v}", rows: [ { student_ref: "S1", full_name: "Ada Lovelace", date_of_birth: "2004-05-12", career_level: "UNDERGRAD", credit_hours: 12.0, term_start: "2026-08-01", term_end: "2026-12-15" } ] }, as: RegistrarSubmitter, as_user_id: "${sub_uid}", captures: { file_id: "$.data.id" } }
            - { call: "GET /enrollment-entries", payload: { file_id: "${file_id}" }, as: ClearinghouseOps, captures: { st1: "$.data[0].student_id" } }
            - { call: "POST /requesters", payload: { org_name: "Acme Hiring", requester_kind: "EMPLOYER", initial_credit_cents: 100000 }, as: ClearinghouseOps, captures: { rq_id: "$.data.id" } }
            - { call: "POST /verification-requests", payload: { requester_id: "${rq_id}", student_id: "${st1}", institution_id: "${inst_id}", product_type: "DEGREE", purpose: "EMPLOYMENT" }, as: Requester, as_user_id: "${rq_id}", captures: { err_pre: "$.data.error_id" } }
            - { call: "POST /requesters/${rq_id}/vet", payload: { outcome: "VET" }, as: ClearinghouseOps }
          trigger:
            - { call: "POST /requesters/${rq_id}/suspend", payload: {}, as: ClearinghouseOps, captures: { st_susp: "$.data.status" } }
            - { call: "POST /verification-requests", payload: { requester_id: "${rq_id}", student_id: "${st1}", institution_id: "${inst_id}", product_type: "DEGREE", purpose: "EMPLOYMENT" }, as: Requester, as_user_id: "${rq_id}", captures: { err_susp: "$.data.error_id" } }
            - { call: "POST /requesters/${rq_id}/vet", payload: { outcome: "VET" }, as: ClearinghouseOps, captures: { st_revet: "$.data.status" } }
            - { call: "POST /verification-requests", payload: { requester_id: "${rq_id}", student_id: "${st1}", institution_id: "${inst_id}", product_type: "DEGREE", purpose: "EMPLOYMENT" }, as: Requester, as_user_id: "${rq_id}", captures: { ok_req: "$.data.id", ok_status: "$.data.status" } }
          assert:
            - "captured err_pre == ERR_REQUESTER_NOT_VETTED (PENDING_VETTING cannot buy)"
            - "captured st_susp == SUSPENDED"
            - "captured err_susp == ERR_REQUESTER_NOT_VETTED (SUSPENDED cannot buy)"
            - "captured st_revet == VETTED (cycle closed)"
            - "captured ok_status == QUOTED"

  # ---------------------------------------------------------------------------
  # Rule 4 — transitive_cascade (different triggers: correction decision vs agreement expiry)
  # ---------------------------------------------------------------------------
  - rule_id: transitive_cascade
    instances:
      - name: correction_apply_cascades_to_servicer_feed_and_standing
        grounds:
          - state_machines.CorrectionCase.FILED_to_APPLIED
          - state_machines.EnrollmentEntry.ACCEPTED_to_SUPERSEDED
          - state_machines.ServicerNotification.QUEUED_to_SUPERSEDED
          - state_machines.ServicerNotification.SENT_to_ACKNOWLEDGED
          - entities.StudentRecord.fields.deferment_standing
        distinguishing_aspect: |
          Depth-3 chain triggered by the correction decision: decision APPROVED ->
          (hop 1) old entry SUPERSEDED + replacement ACCEPTED with WITHDRAWN ->
          (hop 2) prior SENT notification SUPERSEDED and new WITHDRAWN_GRACE
          notification generated -> (hop 3) servicer acknowledgement of the new
          notification rewrites StudentRecord.deferment_standing. Each hop is
          caused by the previous mutation, not by the original request.
        test_recipe:
          setup:
            - "Compliant institution; certified file with entry E1 (UNDERGRAD 15.0 credits, no withdrawal, servicer_ref SVC-100); notification N1 (DEFERMENT_ELIGIBLE) generated at certify, dispatched and ACKNOWLEDGED so standing == DEFERMENT_ELIGIBLE"
          setup_api_calls:
            - { call: "POST /institutions", payload: { name: "State University", ope_id: "00123400", users: [ { email: "sub@su.edu", role: "SUBMITTER" }, { email: "cert@su.edu", role: "CERTIFIER" } ] }, as: ClearinghouseOps, captures: { inst_id: "$.data.id", sub_uid: "$.data.users[0].id", cert_uid: "$.data.users[1].id" } }
            - { call: "POST /institutions/${inst_id}/agreements", payload: { effective_from: "2026-01-01", effective_to: "2027-06-30" }, as: ClearinghouseOps }
            - { call: "POST /institutions/${inst_id}/reporting-periods", payload: { term_label: "Fall 2026", term_start: "2026-09-01", term_end: "2026-12-15", submission_opens_at: "2026-11-01", submission_due_at: "2026-12-20" }, as: ClearinghouseOps, captures: { period_id: "$.data.id" } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-11-15T00:00:00Z" }, as: ClearinghouseOps }
            - { call: "GET /institutions/${inst_id}/reporting-periods", payload: {}, as: ClearinghouseOps, captures: { period_v: "$.data[0].version" } }
            - { call: "POST /enrollment-files", payload: { institution_id: "${inst_id}", reporting_period_id: "${period_id}", expected_reporting_period_version: "${period_v}", rows: [ { student_ref: "S1", full_name: "Ada Lovelace", date_of_birth: "2004-05-12", career_level: "UNDERGRAD", credit_hours: 15.0, term_start: "2026-09-01", term_end: "2026-12-15", servicer_ref: "SVC-100" } ] }, as: RegistrarSubmitter, as_user_id: "${sub_uid}", captures: { file_id: "$.data.id" } }
            - { call: "POST /enrollment-files/${file_id}/certify", payload: {}, as: RegistrarCertifier, as_user_id: "${cert_uid}" }
            - { call: "GET /enrollment-entries", payload: { file_id: "${file_id}" }, as: ClearinghouseOps, captures: { e1: "$.data[0].id", st1: "$.data[0].student_id" } }
            - { call: "GET /servicer-notifications", payload: { enrollment_entry_id: "${e1}" }, as: ClearinghouseOps, captures: { n1: "$.data[0].id" } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-11-16T00:00:00Z" }, as: ClearinghouseOps }
            - { call: "POST /servicer-notifications/${n1}/acknowledge", payload: {}, as: Servicer, as_user_id: "SVC-100" }
            - { call: "POST /correction-cases", payload: { enrollment_entry_id: "${e1}", corrected_withdrawal_date: "2026-10-15", reason_code: "LATE_WITHDRAWAL_NOTICE" }, as: RegistrarSubmitter, as_user_id: "${sub_uid}", captures: { case_id: "$.data.id" } }
          trigger:
            - { call: "POST /correction-cases/${case_id}/decision", payload: { outcome: "APPROVED" }, as: RegistrarCertifier, as_user_id: "${cert_uid}" }
            - { call: "GET /enrollment-entries", payload: { file_id: "${file_id}" }, as: ClearinghouseOps, captures: { e1_after: "$.data[0].entry_status", e2_status_code: "$.data[1].status_code", e2_census: "$.data[1].census_status_code", e2_defer: "$.data[1].deferment_status", e2_case: "$.data[1].source_case_id" } }
            - { call: "GET /servicer-notifications", payload: { student_id: "${st1}" }, as: ClearinghouseOps, captures: { n1_after: "$.data[0].status", n2_id: "$.data[1].id", n2_type: "$.data[1].notification_type", n2_grace: "$.data[1].grace_end_date", n2_status: "$.data[1].status" } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-11-17T00:00:00Z" }, as: ClearinghouseOps }
            - { call: "POST /servicer-notifications/${n2_id}/acknowledge", payload: {}, as: Servicer, as_user_id: "SVC-100" }
            - { call: "GET /students/${st1}", payload: {}, as: ClearinghouseOps, captures: { st_standing: "$.data.deferment_standing" } }
            - { call: "GET /enrollment-files/${file_id}", payload: {}, as: ClearinghouseOps, captures: { f_status: "$.data.status", f_rows: "$.data.row_count", f_acc: "$.data.accepted_rows" } }
          assert:
            - "captured e1_after == SUPERSEDED (hop 1)"
            - "captured e2_status_code == WITHDRAWN and e2_census == FULL_TIME (replacement entry, decision date 2026-11-16 >= withdrawal 2026-10-15; census 2026-09-15 predates it)"
            - "captured e2_case == ${case_id}"
            - "captured n1_after == SUPERSEDED (hop 2: SENT notification superseded by the newer determination)"
            - "captured n2_type == WITHDRAWN_GRACE and n2_grace == 2027-04-13T00:00:00Z"
            - "captured n2_status == QUEUED at decision time (dispatched only on the next clock advance)"
            - "captured st_standing == WITHDRAWN_GRACE (hop 3: ack of the new notification rewrote the student's standing)"
            - "captured f_status == CERTIFIED and f_rows == 2 and f_acc == 2"

      - name: agreement_expiry_cascades_suspension_and_request_cancellation
        grounds:
          - state_machines.ParticipationAgreement.ACTIVE_to_EXPIRED
          - state_machines.Institution.ACTIVE_to_SUSPENDED
          - state_machines.VerificationRequest.PAID_to_CANCELLED
          - entities.Requester.fields.credit_balance_cents
        distinguishing_aspect: |
          Depth-3 chain from a different trigger (clock-driven agreement expiry):
          expiry -> (hop 1) institution flips SUSPENDED with reason
          AGREEMENT_LAPSE -> (hop 2) in-flight PAID request CANCELLED -> (hop 3)
