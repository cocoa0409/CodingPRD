          Waivability has two independent guards, both tested at their edge: 41 digs is one past 20 * 2
          and is refused, a record that failed cleanliness (60 particles against 50) is refused whatever
          its defect numbers, and a record sitting exactly on 40 digs == 20 * 2 with cleanliness intact is
          granted — so the multiple is inclusive and the cleanliness condition is a veto.
        test_recipe:
          setup:
            - "A RELEASED design OD-2540-A (aperture 120.0 mm, RMS 0.0400, tolerance budget 0.0800, transmitted-wavefront budget 0.1050, one 0.0375-wave ACTIVE allocation, verdict PASS) and a RELEASED lot GL-2540-1 with total_blank_count 20."
