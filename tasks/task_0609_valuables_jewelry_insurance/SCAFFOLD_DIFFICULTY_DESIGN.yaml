  # =========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      # --- Appraisal validity window (half-open interval): expiry by clock ---
      - name: appraisal_validity_halfopen_window_expiry
        grounds:
          - state_machines.Appraisal.VALID_to_EXPIRED
          - entities.Appraisal.fields.valid_months
          - entities.Appraisal.fields.effective_date_iso
        distinguishing_aspect: |
          An Appraisal effective 2026-01-01 with valid_months 12 is VALID for [2026-01-01, 2027-01-01);
          at exactly 2027-01-01 the clock reaches the half-open upper bound and the appraisal flips EXPIRED.
          The interval semantics are a half-open single-resource validity window on Appraisal.
        test_recipe:
          setup:
            - "A VALID Appraisal effective 2026-01-01 with valid_months 12."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-01T00:00:00Z" }
              as: Underwriter
            - call: "POST /policyholders"
              payload: { email: "ap@x.com", full_name: "Ap H", residence_zip: "10001" }
              as: Underwriter
              captures: { ph_ap: $.data.id }
            - call: "POST /appraisals"
              payload: { policyholder_id: "${ph_ap}", appraised_value_cents: 2000000, effective_date_iso: "2026-01-01T00:00:00Z", valid_months: 12 }
              as: Appraiser
              captures: { ap_id: $.data.id }
          trigger:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2027-01-01T00:00:00Z" }
              as: Underwriter
          assert:
            - "Appraisal.${ap_id}.status == EXPIRED"

