            - call: "GET /labeling/styles/${style_id}"
              payload: {}
              as: ComplianceAdmin
              captures: { s1_sub: $.data.substantiation_state, s1_org: $.data.origin_state }
          trigger:
            - call: "POST /labeling/lab-tests"
