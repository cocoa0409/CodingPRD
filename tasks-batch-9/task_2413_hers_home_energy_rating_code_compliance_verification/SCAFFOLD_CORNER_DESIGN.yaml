      - name: dual_variant_calculation_layer
        claim_type: Dual variant calculation
        grounds:
          - complexity_profile.complexity_layers[dual_variant_calculation]
        excluded_because:
          difficulty_instance: dual_variant_calc / projected_vs_confirmed_hers_index_diverge_on_same_home
          rationale: "Both variants of the index and their delta on the same entity are asserted by the named §1.8 instance."

      - name: cascading_side_effects_layer
        claim_type: Cascading side effects
        grounds:
          - complexity_profile.complexity_layers[cascading_side_effects]
        excluded_because:
          difficulty_instance: transitive_cascade / sample_set_failure_cascade_creates_corrective_actions_and_suspends_builder
          rationale: "The multi-level chain and its ordering sensitivity are asserted end-to-end by the named §1.8 instance."

      - name: rate_threshold_trigger_layer
        claim_type: Rate threshold triggers
        grounds:
          - complexity_profile.complexity_layers[rate_threshold_triggers]
        excluded_because:
          difficulty_instance: transitive_cascade / qa_major_failure_cascade_revokes_package_and_suspends_sampling
          rationale: "The QA-rate switch to the probation rate and the registry hold it raises are asserted inside the named §1.8 instance's cascade, and the boundary itself is covered by the calculations instance probation_quota_rate_blocks_the_next_registry_submission."

  - section: consistency_model
    instances:
      - name: coverage_ledger_is_visible_immediately_after_the_write
        claim_type: Immediate consistency
        grounds:
          - complexity_profile.consistency_model
          - calculations.home_coverage_ledger
          - endpoints[POST /sample-sets/{id}/homes]
        distinguishing_aspect: "No lag anywhere in the chain: the membership response itself already carries sample_set_id and sampling_role MEMBER, and the very next reads show SampleSet.member_count 1 and the subdivision's sampled/unsampled split 1/1 — no second read or delay is needed."
