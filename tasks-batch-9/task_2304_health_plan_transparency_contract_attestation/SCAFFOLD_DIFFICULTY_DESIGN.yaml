          - calculations.compensation_reasonableness_score
          - state_machines.CompensationDisclosure.RECEIVED_to_UNREASONABLE
          - state_machines.CompensationDisclosure.RECEIVED_to_REASONABLE
          - calculations.plan_year_compliance_posture
        distinguishing_aspect: |
          Two CONSULTANT disclosures differ by 250 cents of direct compensation: 875000 scores
          exactly 55.00 (35.00 + 8.33 + 11.67) and must be UNREASONABLE under the inclusive `>=`
          threshold, while 874750 scores 54.99 and must be REASONABLE. Using `>` at the threshold, or
          rounding the price component to 1 decimal, collapses the pair into the same status; only the
          UNREASONABLE one contributes 3 deficiency points.
        test_recipe:
          setup:
            - "Logical clock at 2027-03-02T09:00:00Z."
            - "ACTIVE PlanYear PY2027 with covered_lives 6000, one TPA contract and two CONSULTANT contracts."
            - "Disclosure X (RECEIVED): direct 875000, indirect 0, benchmark 1000000, scope 4, completeness 4."
