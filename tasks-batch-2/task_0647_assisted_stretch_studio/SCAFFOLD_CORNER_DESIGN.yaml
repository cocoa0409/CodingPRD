              payload: { member_id: "${mem}", location_id: "${loc}", pack_credits: 1, base_unit_price_cents: 100, expires_utc: "2027-01-01T00:00:00Z" }
              as: FrontDesk
              captures: { pack: $.data.id }
          trigger:
            - call: "POST /bookings"
              payload: { member_id: "${mem}", location_id: "${loc}", service_id: "${svc}", flexologist_id: "${flex}", table_id: "${tbl}", session_start_utc: "2026-04-25T10:00:00Z", funding_source: "CREDIT_PACK", funding_id: "${pack}" }
              as: FrontDesk
              captures: { bk: $.data.id, after_book: $.data.id }
            - call: "GET /credit-packs/${pack}"
              payload: {}
              as: FrontDesk
              captures: { st_depleted: $.data.status }
