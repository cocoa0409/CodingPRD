              as: BrandChannelManager
              captures: { su_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /price-observations"
              payload: { product_id: "${prod_id}", channel: "MARKETPLACE", marketplace_name: "BigMarket", seller_display_name: "GreyDeals", listing_url: "https://bigmarket.example/greydeals/amp-1", listed_price_cents: 24000, observed_at: "2026-08-05T00:00:00Z", evidence_hash: "0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef" }
