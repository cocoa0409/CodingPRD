  # ---------------------------------------------------------------------------
  - rule_id: compensating_invariant
    instances:
      - name: freeze_cancel_budget_conserved
        grounds:
          - state_machines.StoreKitConfig.DRAFT_to_FROZEN
          - state_machines.StoreKitConfig.FROZEN_to_CANCELLED
          - entities.RolloutProgram.fields.remaining_budget_cents
        distinguishing_aspect: |
          Conserved quantity is MONEY (program.remaining_budget_cents): the
          freeze debit of exactly kit_total_cost_cents (3287) paired with the
          FROZEN-cancel compensating refund leaves remaining_budget_cents
          bit-identical to its pre-freeze value 1000000.
        test_recipe:
          setup:
            - "Program ACTIVE, budget_total_cents 1000000 (remaining_budget_cents 1000000); prototype APPROVED; kit with lines [{PN-500,1,1025},{PN-501,1,2075}] in DRAFT"
          setup_api_calls:
