            - "SettlementStatement.${stmt2}: net_payable_to_jobber_cents == 4950, err == ERR_PAYOUT_BELOW_MINIMUM, status remains APPROVED (4950 < 5000)"

      - name: space_capacity_exact_fit_boundary
        grounds: [calculations.space_capacity_check, "validations[priority=21]", "errors[ERR_SPACE_CAPACITY_EXCEEDED]"]
        distinguishing_aspect: |
          Metric = integer facing count at the space-allocation endpoint (different
          metric and endpoint than ratio/cents): committed == total_facings (10 == 10)
          MUST be accepted (strict > rejects), committed == 11 MUST be rejected.
        test_recipe:
          setup:
            - "ACTIVE agreement on store with total_facings 10; existing SNACKS allocation 6 facings [2026-08-01, 2026-09-01)"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: JobberAdmin }
            - { call: "POST /programs", payload: { name: "CapTest" }, as: JobberAdmin, captures: { prog: "$.data.id" } }
            - { call: "POST /stores", payload: { name: "CapStore", store_code: "CAP", total_facings: 10 }, as: JobberAdmin, captures: { store: "$.data.id" } }
            - { call: "POST /agreements", payload: { program_id: "${prog}", store_id: "${store}", base_margin_pct: 0.25, shrink_retailer_share_pct: 0.5, restock_value_cap_cents: 50000 }, as: JobberAdmin, captures: { agr: "$.data.id" } }
            - { call: "POST /agreements/${agr}/submit", payload: {}, as: JobberAdmin }
            - { call: "POST /agreements/${agr}/accept", payload: {}, as: RetailerManager, as_user_id: "${store}" }
            - { call: "POST /space-allocations", payload: { store_agreement_id: "${agr}", category: "SNACKS", facings: 6, window_start_date: "2026-08-01", window_end_date: "2026-09-01" }, as: JobberAdmin, captures: { w1: "$.data.id" } }
          trigger:
