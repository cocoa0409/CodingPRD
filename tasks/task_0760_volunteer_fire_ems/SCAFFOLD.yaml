# =============================================================================
# Volunteer Fire & EMS Department Management — SCAFFOLD (§1.0–§1.7)
# =============================================================================

scenario: |
  Volunteer Fire & EMS Department Management: member roster & certification/training
  hours, station/apparatus & duty roster, call response & turnout tracking, incident
  report (NFIRS) & run, equipment/PPE & maintenance, fundraising/membership, scheduling
  & points/stipend, recertification

domain_name: volunteer-fire-ems
api_prefix: ""   # flat topology: peer top-level collections (/members, /stations, /certifications, /incidents, /campaigns, ...) with no shared URL prefix

complexity_profile:
  primary_archetype: posture-driven gating
  secondary_archetype: compliance / audit
  complexity_layers:
    - rate / threshold triggers
    - derived field reconciliation
    - cascading side effects
    - optimistic concurrency
    - temporal windowing

  entity_topology: flat
  # Peer top-level resources (Member, Station, FundraisingCampaign, Incident,
  # DutyShift) linked by explicit foreign keys; children reached by filtered
  # lists rather than deep URL nesting.

  state_machine_shape: parallel
  # Certification is cyclic (CURRENT->EXPIRING->EXPIRED->CURRENT); Incident carries
  # two independent dimensions (response_status x report_status); Member cycles
  # ACTIVE<->LOA. Apparatus.posture is a derived/compound field.

  relationship_patterns:
    - one_to_many          # Member->Certification, Apparatus->Equipment, Campaign->Donation
    - many_to_many         # Member<->DutyShift (via DutyAssignment), Member<->Incident (via TurnoutResponse)
    - cross_aggregate      # DutyShift references Apparatus and Station across aggregates

  role_model: hierarchical_override
  # Member < Officer < Chief. Chief owns infrastructure/fundraising/membership;
  # Officer owns certs, roster, scheduling, incidents, points; Member acts on own
  # duty check-ins and reads own summary.

  consistency_model: immediate

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Member
    parent: null
    common_fields: true   # id, created_at, updated_at, version
    fields:
      - { name: full_name, type: string, source: input, description: "Member legal name" }
      - { name: email, type: string, source: input, description: "Unique login/contact email" }
      - { name: role_class, type: enum, source: input, description: "Response role: OFFICER | PARAMEDIC | EMT | FIREFIGHTER | PROBATIONARY", constraints: "one of {OFFICER,PARAMEDIC,EMT,FIREFIGHTER,PROBATIONARY}" }
      - { name: membership_status, type: enum, source: system, default: "PROBATIONARY", description: "PROBATIONARY | ACTIVE | LOA | RETIRED | EXPELLED", constraints: "one of {PROBATIONARY,ACTIVE,LOA,RETIRED,EXPELLED}" }
      - { name: join_date, type: datetime, source: input, description: "Date the member joined (ISO 8601)" }
      - { name: dues_balance_cents, type: integer, source: input, default: 0, description: "Outstanding membership dues in cents; reduced by dues-payments" }
      - { name: dues_paid_through, type: datetime, source: system, required: false, description: "Membership paid-through date; advanced by dues-payments" }
      - { name: response_eligible, type: boolean, source: computed, description: "= (membership_status==ACTIVE) AND no required Certification in {EXPIRED,SUSPENDED,REVOKED}; see §1.3 response_eligibility" }
      - { name: training_hours_ytd, type: number, source: computed, description: "Sum of TrainingRecord.hours in current calendar year" }
      - { name: points_ytd, type: integer, source: computed, description: "Conserved points ledger; see §1.3 member_points_ytd" }
      - { name: stipend_cents, type: integer, source: computed, description: "Final-basis stipend; see §1.3 member_stipend (FINAL variant)" }
      - { name: points_tier, type: enum, source: computed, description: "BRONZE | SILVER | GOLD from points_ytd; see §1.3 stipend_tier", constraints: "one of {BRONZE,SILVER,GOLD}" }

  - name: Certification
    parent: null
    common_fields: true
    fields:
      - { name: member_id, type: string, source: input, description: "FK -> Member.id" }
      - { name: cert_type, type: enum, source: input, description: "FIREFIGHTER_1 | EMT_BASIC | PARAMEDIC | HAZMAT | DRIVER_OPERATOR | CPR", constraints: "one of {FIREFIGHTER_1,EMT_BASIC,PARAMEDIC,HAZMAT,DRIVER_OPERATOR,CPR}" }
      - { name: is_required, type: boolean, source: input, default: true, description: "Whether this cert gates response_eligible" }
      - { name: category, type: enum, source: input, description: "Training category counted toward this cert: FIRE | EMS | HAZMAT | DRIVER | CPR", constraints: "one of {FIRE,EMS,HAZMAT,DRIVER,CPR}" }
      - { name: status, type: enum, source: system, default: "PENDING", description: "PENDING | CURRENT | EXPIRING | EXPIRED | SUSPENDED | REVOKED", constraints: "one of {PENDING,CURRENT,EXPIRING,EXPIRED,SUSPENDED,REVOKED}" }
      - { name: cycle_start_at, type: datetime, source: system, description: "Start of the current cert cycle; set to current clock at CREATE (PENDING) and RESET to current clock on renew; NOT changed by issue" }
      - { name: issued_at, type: datetime, source: system, required: false, description: "Timestamp of most recent issue/renew" }
      - { name: expires_at, type: datetime, source: system, required: false, description: "= issued_at + CERT_VALIDITY_DAYS (365)" }
      - { name: completed_hours_strict, type: number, source: computed, description: "STRICT variant of cert_completed_hours (in-cycle only)" }
      - { name: completed_hours_carryover, type: number, source: computed, description: "CARRYOVER variant (in-cycle + capped 90-day pre-cycle)" }

  - name: TrainingRecord
    parent: null
    common_fields: false   # append-only event: id, created_at only
    fields:
      - { name: member_id, type: string, source: input, description: "FK -> Member.id" }
      - { name: certification_id, type: string, source: input, required: false, description: "FK -> Certification.id; optional link to the cert this training counts toward" }
      - { name: category, type: enum, source: input, description: "FIRE | EMS | HAZMAT | DRIVER | CPR", constraints: "one of {FIRE,EMS,HAZMAT,DRIVER,CPR}" }
      - { name: hours, type: number, source: input, description: "Training hours logged; must be > 0" }
      - { name: training_date, type: datetime, source: input, description: "When the training occurred (ISO 8601)" }
      - { name: description, type: string, source: input, required: false, description: "Free-text description" }

  - name: PointAdjustment
    parent: null
    common_fields: false   # append-only event: id, created_at only
    fields:
      - { name: member_id, type: string, source: input, description: "FK -> Member.id" }
      - { name: points, type: integer, source: input, description: "Signed point delta (may be negative)" }
      - { name: reason, type: string, source: input, description: "Officer justification" }
      - { name: reversed, type: boolean, source: system, default: false, description: "True once this adjustment is reversed; reversed rows drop out of points_ytd" }

  - name: Station
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Station name/number" }
      - { name: address, type: string, source: input, required: false, description: "Physical address" }

  - name: Apparatus
    parent: null
    common_fields: true
    fields:
      - { name: station_id, type: string, source: input, description: "FK -> Station.id" }
      - { name: unit_designation, type: string, source: input, description: "e.g. ENGINE-1, MEDIC-2, LADDER-1" }
      - { name: apparatus_type, type: enum, source: input, description: "ENGINE | LADDER | AMBULANCE | RESCUE | TANKER", constraints: "one of {ENGINE,LADDER,AMBULANCE,RESCUE,TANKER}" }
      - { name: min_crew, type: integer, source: input, description: "Minimum crew required to staff a duty shift on this apparatus; > 0" }
      - { name: posture, type: enum, source: computed, description: "IN_SERVICE | RESERVE | OUT_OF_SERVICE; see §1.3 apparatus_posture", constraints: "one of {IN_SERVICE,RESERVE,OUT_OF_SERVICE}" }

  - name: Equipment
    parent: null
    common_fields: true
    fields:
      - { name: apparatus_id, type: string, source: input, description: "FK -> Apparatus.id" }
      - { name: name, type: string, source: input, description: "Equipment/PPE name" }
      - { name: is_critical, type: boolean, source: input, default: false, description: "Critical items force apparatus OUT_OF_SERVICE when down; non-critical force RESERVE" }
      - { name: status, type: enum, source: system, default: "OPERATIONAL", description: "OPERATIONAL | OUT_OF_SERVICE", constraints: "one of {OPERATIONAL,OUT_OF_SERVICE}" }

  - name: MaintenanceWindow
    parent: null
    common_fields: true
    fields:
      - { name: apparatus_id, type: string, source: input, description: "FK -> Apparatus.id" }
      - { name: start_at, type: datetime, source: input, description: "Window start (ISO 8601); interval is half-open [start_at, end_at)" }
      - { name: end_at, type: datetime, source: input, description: "Window end (ISO 8601); must be > start_at" }
      - { name: reason, type: string, source: input, required: false, description: "Maintenance reason" }
      - { name: status, type: enum, source: system, default: "SCHEDULED", description: "SCHEDULED | IN_PROGRESS | COMPLETED | CANCELLED", constraints: "one of {SCHEDULED,IN_PROGRESS,COMPLETED,CANCELLED}" }

  - name: DutyShift
    parent: null
    common_fields: true
    fields:
      - { name: station_id, type: string, source: input, description: "FK -> Station.id" }
      - { name: apparatus_id, type: string, source: input, description: "FK -> Apparatus.id; must belong to station_id" }
      - { name: start_at, type: datetime, source: input, description: "Shift start (ISO 8601); interval half-open [start_at, end_at)" }
      - { name: end_at, type: datetime, source: input, description: "Shift end (ISO 8601); must be > start_at" }
      - { name: min_crew, type: integer, source: input, description: "Crew floor for this shift; defaults from apparatus.min_crew at create if omitted" }
      - { name: max_crew, type: integer, source: input, description: "Crew ceiling for this shift; > 0 and >= min_crew" }
      - { name: assigned_count, type: integer, source: computed, default: 0, description: "Count of DutyAssignment in {ASSIGNED,CHECKED_IN,VERIFIED} for this shift" }
      - { name: staffing_status, type: enum, source: computed, description: "UNDERSTAFFED | STAFFED | FULL; see §1.3 shift_staffing", constraints: "one of {UNDERSTAFFED,STAFFED,FULL}" }
      - { name: status, type: enum, source: system, default: "DRAFT", description: "DRAFT | PUBLISHED | SUSPENDED | IN_PROGRESS | COMPLETED | CANCELLED", constraints: "one of {DRAFT,PUBLISHED,SUSPENDED,IN_PROGRESS,COMPLETED,CANCELLED}" }

  - name: DutyAssignment
    parent: null
    common_fields: true
    fields:
      - { name: duty_shift_id, type: string, source: input, description: "FK -> DutyShift.id" }
      - { name: member_id, type: string, source: input, description: "FK -> Member.id" }
      - { name: status, type: enum, source: system, default: "ASSIGNED", description: "ASSIGNED | CHECKED_IN | VERIFIED | CANCELLED | NO_SHOW", constraints: "one of {ASSIGNED,CHECKED_IN,VERIFIED,CANCELLED,NO_SHOW}" }
      - { name: checked_in_at, type: datetime, source: system, required: false, description: "Set when member checks in" }
      - { name: duty_points, type: integer, source: computed, default: 0, description: "Points awarded on VERIFIED; see §1.3 duty_points" }

  - name: Incident
    parent: null
    common_fields: true
    fields:
      - { name: station_id, type: string, source: input, description: "FK -> Station.id" }
      - { name: apparatus_id, type: string, source: input, description: "FK -> Apparatus.id; must belong to station_id" }
      - { name: incident_type, type: enum, source: input, description: "STRUCTURE_FIRE | MVA | EMS | ALARM | OTHER", constraints: "one of {STRUCTURE_FIRE,MVA,EMS,ALARM,OTHER}" }
      - { name: alarm_at, type: datetime, source: input, description: "Alarm/dispatch time (ISO 8601)" }
      - { name: enroute_at, type: datetime, source: system, required: false, description: "Set on enroute transition to current clock" }
      - { name: onscene_at, type: datetime, source: system, required: false, description: "Set on arrive transition to current clock" }
      - { name: cleared_at, type: datetime, source: system, required: false, description: "Set on clear transition to current clock" }
      - { name: response_status, type: enum, source: system, default: "DISPATCHED", description: "Response dimension: DISPATCHED | ENROUTE | ONSCENE | CLEARED", constraints: "one of {DISPATCHED,ENROUTE,ONSCENE,CLEARED}" }
      - { name: report_status, type: enum, source: system, default: "NONE", description: "NFIRS report dimension: NONE | DRAFT | LOCKED | AMENDED", constraints: "one of {NONE,DRAFT,LOCKED,AMENDED}" }
      - { name: nfirs_property_use, type: string, source: input, required: false, description: "NFIRS property-use code, set on report draft/amend" }
      - { name: nfirs_actions_taken, type: string, source: input, required: false, description: "NFIRS actions-taken code, set on report draft/amend" }
      - { name: report_revision, type: integer, source: system, default: 0, description: "Increments on each lock/amend" }

  - name: TurnoutResponse
    parent: null
    common_fields: true
    fields:
      - { name: incident_id, type: string, source: input, description: "FK -> Incident.id" }
      - { name: member_id, type: string, source: input, description: "FK -> Member.id" }
      - { name: responded_at, type: datetime, source: system, description: "Current clock at turnout creation" }
      - { name: status, type: enum, source: system, default: "RESPONDED", description: "RESPONDED | RELEASED | VOIDED", constraints: "one of {RESPONDED,RELEASED,VOIDED}" }
      - { name: turnout_points, type: integer, source: computed, default: 0, description: "Awarded on incident clear; see §1.3 turnout_points; reversed on void" }

  - name: FundraisingCampaign
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Campaign name" }
      - { name: goal_cents, type: integer, source: input, description: "Fundraising goal in cents; > 0" }
      - { name: raised_cents, type: integer, source: computed, default: 0, description: "= sum(Donation.amount_cents where status==POSTED); conserved, see §1.3 campaign_raised" }
      - { name: status, type: enum, source: system, default: "DRAFT", description: "DRAFT | ACTIVE | CLOSED", constraints: "one of {DRAFT,ACTIVE,CLOSED}" }

  - name: Donation
    parent: null
    common_fields: true
    fields:
      - { name: campaign_id, type: string, source: input, description: "FK -> FundraisingCampaign.id" }
      - { name: donor_name, type: string, source: input, description: "Donor display name" }
      - { name: amount_cents, type: integer, source: input, description: "Donation amount in cents; > 0" }
      - { name: status, type: enum, source: system, default: "POSTED", description: "POSTED | REFUNDED", constraints: "one of {POSTED,REFUNDED}" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  # --- Certification: CYCLIC (CURRENT->EXPIRING->EXPIRED->CURRENT) ---
  - entity: Certification
    initial_state: PENDING
    terminal_states: [REVOKED]
    transitions:
      - from: PENDING
        to: CURRENT
        trigger: "POST /certifications/{certId}/issue"
        actor: Officer
        preconditions:
          - "completed_hours_strict >= CERT_REQUIRED_HOURS[cert_type] (STRICT variant, ERR_INSUFFICIENT_TRAINING_HOURS)"
        side_effects:
          - "issued_at = current clock; expires_at = issued_at + 365 days (cycle_start_at unchanged — it was set at create)"
          - "recompute Member.response_eligible (§1.3 response_eligibility)"
      - from: CURRENT
        to: EXPIRING
        trigger: "system (POST /certifications/sweep) when current_clock >= expires_at - 30 days AND current_clock < expires_at"
        actor: system
        preconditions: []
        side_effects: ["Member.response_eligible unchanged (EXPIRING is still eligible)"]
      - from: EXPIRING
        to: EXPIRED
        trigger: "system (POST /certifications/sweep) when current_clock >= expires_at"
        actor: system
        preconditions: []
        side_effects:
          - "CASCADE-1 hop A->B: recompute Member.response_eligible -> becomes false if this cert is_required"
          - "CASCADE-1 hop B->C: member's DutyAssignments in {ASSIGNED,CHECKED_IN} on shifts with start_at > current_clock -> CANCELLED"
          - "CASCADE-1 hop C->D: each affected DutyShift.assigned_count recomputed; staffing_status -> UNDERSTAFFED if assigned_count < min_crew"
      - from: CURRENT
        to: EXPIRED
        trigger: "system (POST /certifications/sweep) when current_clock >= expires_at (skipped past EXPIRING window)"
        actor: system
        preconditions: []
        side_effects:
          - "same CASCADE-1 chain A->B->C->D as EXPIRING->EXPIRED"
      - from: EXPIRED
        to: CURRENT
        trigger: "POST /certifications/{certId}/renew"
        actor: Officer
        preconditions:
          - "completed_hours_carryover >= CERT_REQUIRED_HOURS[cert_type] (CARRYOVER variant, ERR_INSUFFICIENT_TRAINING_HOURS)"
        side_effects:
          - "cycle_start_at = current clock; issued_at = current clock; expires_at = issued_at + 365 days"
          - "recompute Member.response_eligible (may flip back to true)"
      - from: EXPIRING
        to: CURRENT
        trigger: "POST /certifications/{certId}/renew (early renewal)"
        actor: Officer
        preconditions:
          - "completed_hours_carryover >= CERT_REQUIRED_HOURS[cert_type] (CARRYOVER variant, ERR_INSUFFICIENT_TRAINING_HOURS)"
        side_effects:
          - "cycle_start_at, issued_at reset to current clock; expires_at = issued_at + 365 days"
      - from: CURRENT
        to: SUSPENDED
        trigger: "POST /certifications/{certId}/suspend"
        actor: Officer
        preconditions: []
        side_effects: ["recompute Member.response_eligible -> false if is_required"]
      - from: EXPIRING
        to: SUSPENDED
        trigger: "POST /certifications/{certId}/suspend"
        actor: Officer
        preconditions: []
        side_effects: ["recompute Member.response_eligible -> false if is_required"]
      - from: SUSPENDED
        to: CURRENT
        trigger: "POST /certifications/{certId}/reinstate"
        actor: Officer
        preconditions: ["current_clock < expires_at (ERR_INVALID_STATE if already past expiry)"]
        side_effects: ["recompute Member.response_eligible"]
      - from: SUSPENDED
        to: REVOKED
        trigger: "POST /certifications/{certId}/revoke"
        actor: Chief
        preconditions: []
        side_effects: ["recompute Member.response_eligible"]

  # --- Member membership: CYCLIC (ACTIVE<->LOA) ---
  - entity: Member
    initial_state: PROBATIONARY
    terminal_states: [RETIRED, EXPELLED]
    transitions:
      - from: PROBATIONARY
        to: ACTIVE
        trigger: "POST /members/{memberId}/activate"
        actor: Chief
        preconditions:
          - "at least one required Certification in status CURRENT (ERR_INVALID_STATE)"
        side_effects: ["recompute response_eligible"]
      - from: ACTIVE
        to: LOA
        trigger: "POST /members/{memberId}/leave"
        actor: Chief
        preconditions: []
        side_effects:
          - "response_eligible -> false"
          - "future DutyAssignments in {ASSIGNED,CHECKED_IN} on shifts with start_at > current_clock -> CANCELLED; affected shifts recompute staffing_status"
      - from: LOA
        to: ACTIVE
        trigger: "POST /members/{memberId}/return"
        actor: Chief
        preconditions: []
        side_effects: ["recompute response_eligible"]
      - from: ACTIVE
        to: RETIRED
        trigger: "POST /members/{memberId}/retire"
        actor: Chief
        preconditions: []
        side_effects: ["response_eligible -> false"]
      - from: LOA
        to: RETIRED
        trigger: "POST /members/{memberId}/retire"
        actor: Chief
        preconditions: []
        side_effects: ["response_eligible -> false"]
      - from: ACTIVE
        to: EXPELLED
        trigger: "POST /members/{memberId}/expel"
        actor: Chief
        preconditions: []
        side_effects: ["response_eligible -> false"]

  # --- Equipment: OPERATIONAL <-> OUT_OF_SERVICE (drives CASCADE-2) ---
  - entity: Equipment
    initial_state: OPERATIONAL
    terminal_states: []
    transitions:
      - from: OPERATIONAL
        to: OUT_OF_SERVICE
        trigger: "POST /equipment/{equipmentId}/out-of-service"
        actor: Chief
        preconditions: []
        side_effects:
          - "CASCADE-2 hop A->B: recompute Apparatus.posture (§1.3 apparatus_posture); critical item -> OUT_OF_SERVICE"
          - "CASCADE-2 hop B->C: Apparatus DutyShifts in status PUBLISHED with start_at > current_clock -> SUSPENDED"
      - from: OUT_OF_SERVICE
        to: OPERATIONAL
        trigger: "POST /equipment/{equipmentId}/return-to-service"
        actor: Chief
        preconditions: []
        side_effects:
          - "recompute Apparatus.posture; if posture recovers to != OUT_OF_SERVICE, SUSPENDED DutyShifts -> PUBLISHED"

  # --- MaintenanceWindow: SCHEDULED->IN_PROGRESS->COMPLETED ---
  - entity: MaintenanceWindow
    initial_state: SCHEDULED
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - from: SCHEDULED
        to: IN_PROGRESS
        trigger: "POST /maintenance-windows/{windowId}/start"
        actor: Chief
        preconditions: []
        side_effects:
          - "recompute Apparatus.posture -> OUT_OF_SERVICE (active maintenance)"
          - "Apparatus DutyShifts PUBLISHED with start_at > current_clock -> SUSPENDED"
      - from: IN_PROGRESS
        to: COMPLETED
        trigger: "POST /maintenance-windows/{windowId}/complete"
        actor: Chief
        preconditions: []
        side_effects:
          - "recompute Apparatus.posture; if recovers, SUSPENDED DutyShifts -> PUBLISHED"
      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /maintenance-windows/{windowId}/cancel"
        actor: Chief
        preconditions: []
        side_effects: []

  # --- DutyShift ---
  - entity: DutyShift
    initial_state: DRAFT
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - from: DRAFT
        to: PUBLISHED
        trigger: "POST /duty-shifts/{shiftId}/publish"
        actor: Officer
        preconditions:
          - "Apparatus.posture in {IN_SERVICE, RESERVE} (CROSS-ENTITY pair DutyShift->Apparatus; ERR_APPARATUS_OUT_OF_SERVICE)"
        side_effects: ["recompute staffing_status"]
      - from: PUBLISHED
        to: SUSPENDED
        trigger: "system (Equipment out-of-service or MaintenanceWindow start makes Apparatus.posture OUT_OF_SERVICE)"
        actor: system
        preconditions: []
        side_effects: []
      - from: SUSPENDED
        to: PUBLISHED
        trigger: "system (Apparatus.posture recovers to != OUT_OF_SERVICE)"
        actor: system
        preconditions: []
        side_effects: ["recompute staffing_status"]
      - from: PUBLISHED
        to: IN_PROGRESS
        trigger: "system (POST /duty-shifts/sweep) when current_clock >= start_at AND current_clock < end_at"
        actor: system
        preconditions: []
        side_effects: []
      - from: IN_PROGRESS
        to: COMPLETED
        trigger: "system (POST /duty-shifts/sweep) when current_clock >= end_at"
        actor: system
        preconditions: []
        side_effects:
          - "DutyAssignments in {CHECKED_IN} -> VERIFIED; duty_points computed (§1.3 duty_points); Member.points_ytd recomputed"
          - "DutyAssignments in {ASSIGNED} (never checked in) -> NO_SHOW"
      - from: PUBLISHED
        to: CANCELLED
        trigger: "POST /duty-shifts/{shiftId}/cancel"
        actor: Officer
        preconditions: []
        side_effects: ["DutyAssignments in {ASSIGNED,CHECKED_IN} -> CANCELLED"]
      - from: DRAFT
        to: CANCELLED
        trigger: "POST /duty-shifts/{shiftId}/cancel"
        actor: Officer
        preconditions: []
        side_effects: []
      - from: SUSPENDED
        to: CANCELLED
        trigger: "POST /duty-shifts/{shiftId}/cancel"
        actor: Officer
        preconditions: []
        side_effects: ["DutyAssignments in {ASSIGNED,CHECKED_IN} -> CANCELLED"]

  # --- DutyAssignment ---
  - entity: DutyAssignment
    initial_state: ASSIGNED
    terminal_states: [VERIFIED, CANCELLED, NO_SHOW]
    transitions:
      - from: ASSIGNED
        to: CHECKED_IN
        trigger: "POST /duty-assignments/{assignmentId}/check-in"
        actor: Member
        preconditions:
          - "acting Member.id == DutyAssignment.member_id (ownership; ERR_FORBIDDEN)"
          - "DutyShift.status in {PUBLISHED, IN_PROGRESS} (ERR_INVALID_STATE)"
        side_effects: ["checked_in_at = current clock"]
      - from: CHECKED_IN
        to: VERIFIED
        trigger: "system (DutyShift IN_PROGRESS->COMPLETED sweep)"
        actor: system
        preconditions: []
        side_effects:
          - "duty_points computed (§1.3 duty_points)"
          - "INVARIANT-1 credit: Member.points_ytd += duty_points"
      - from: ASSIGNED
        to: NO_SHOW
        trigger: "system (DutyShift IN_PROGRESS->COMPLETED sweep, never checked in)"
        actor: system
        preconditions: []
        side_effects: []
      - from: ASSIGNED
        to: CANCELLED
        trigger: "POST /duty-assignments/{assignmentId}/cancel OR CASCADE-1 (cert expiry) OR member LOA/retire/expel OR shift cancel"
        actor: Officer
        preconditions: []
        side_effects: ["DutyShift.assigned_count recomputed; staffing_status recomputed (may become UNDERSTAFFED)"]
      - from: CHECKED_IN
        to: CANCELLED
        trigger: "POST /duty-assignments/{assignmentId}/cancel OR shift cancel"
        actor: Officer
        preconditions: []
        side_effects: ["DutyShift.assigned_count recomputed; staffing_status recomputed"]

  # --- Incident: PARALLEL DIMENSIONS (response_status x report_status) ---
  - entity: Incident
    initial_state: DISPATCHED   # response_status initial; report_status initial = NONE
    terminal_states: []
    transitions:
      # response dimension
      - from: "response:DISPATCHED"
        to: "response:ENROUTE"
        trigger: "POST /incidents/{incidentId}/enroute"
        actor: Officer
        preconditions: ["response_status == DISPATCHED (ERR_INVALID_STATE)"]
        side_effects: ["enroute_at = current clock"]
      - from: "response:ENROUTE"
        to: "response:ONSCENE"
        trigger: "POST /incidents/{incidentId}/arrive"
        actor: Officer
        preconditions: ["response_status == ENROUTE (ERR_INVALID_STATE)"]
        side_effects: ["onscene_at = current clock"]
      - from: "response:ONSCENE"
        to: "response:CLEARED"
        trigger: "POST /incidents/{incidentId}/clear"
        actor: Officer
        preconditions: ["response_status == ONSCENE (ERR_INVALID_STATE)"]
        side_effects:
          - "cleared_at = current clock"
          - "all TurnoutResponse in RESPONDED for this incident -> RELEASED; turnout_points computed (§1.3 turnout_points)"
          - "INVARIANT-1 credit: each released turnout adds turnout_points to Member.points_ytd"
      # report dimension (independent of response dimension, except report requires CLEARED)
      - from: "report:NONE"
        to: "report:DRAFT"
        trigger: "POST /incidents/{incidentId}/report"
        actor: Officer
        preconditions: ["response_status == CLEARED (CROSS-ENTITY-within-entity gate; ERR_INVALID_STATE)"]
        side_effects: ["nfirs_property_use, nfirs_actions_taken saved from body"]
      - from: "report:DRAFT"
        to: "report:LOCKED"
        trigger: "POST /incidents/{incidentId}/report/lock"
        actor: Officer
        preconditions:
          - "nfirs_property_use present AND nfirs_actions_taken present (ERR_NFIRS_INCOMPLETE)"
        side_effects: ["report_revision += 1; increments Incident.version by 1"]
      - from: "report:LOCKED"
        to: "report:AMENDED"
        trigger: "POST /incidents/{incidentId}/report/amend"
        actor: Officer
        preconditions:
          - "expected_incident_version matches current Incident.version (OCC; ERR_STALE_VERSION)"
          - "nfirs_property_use present AND nfirs_actions_taken present (ERR_NFIRS_INCOMPLETE)"
        side_effects: ["report_revision += 1; increments Incident.version by 1; new NFIRS values supersede prior revision"]
      - from: "report:AMENDED"
        to: "report:AMENDED"
        trigger: "POST /incidents/{incidentId}/report/amend (re-amend)"
        actor: Officer
        preconditions:
          - "expected_incident_version matches current Incident.version (OCC; ERR_STALE_VERSION)"
        side_effects: ["report_revision += 1; increments Incident.version by 1"]

  # --- TurnoutResponse ---
  - entity: TurnoutResponse
    initial_state: RESPONDED
    terminal_states: [VOIDED]
    transitions:
      - from: RESPONDED
        to: RELEASED
        trigger: "system (Incident response ONSCENE->CLEARED)"
        actor: system
        preconditions: []
        side_effects: ["turnout_points computed; Member.points_ytd += turnout_points"]
      - from: RELEASED
        to: VOIDED
        trigger: "POST /turnouts/{turnoutId}/void"
        actor: Officer
        preconditions: []
        side_effects:
          - "INVARIANT-1 compensation: Member.points_ytd -= turnout_points; turnout_points reset to 0"
      - from: RESPONDED
        to: VOIDED
        trigger: "POST /turnouts/{turnoutId}/void (before incident cleared)"
        actor: Officer
        preconditions: []
        side_effects: ["no points were awarded yet; points_ytd unchanged"]

  # --- FundraisingCampaign ---
  - entity: FundraisingCampaign
    initial_state: DRAFT
    terminal_states: [CLOSED]
    transitions:
      - from: DRAFT
        to: ACTIVE
        trigger: "POST /campaigns/{campaignId}/open"
        actor: Chief
        preconditions: []
        side_effects: []
      - from: ACTIVE
        to: CLOSED
        trigger: "POST /campaigns/{campaignId}/close"
        actor: Chief
        preconditions: []
        side_effects: []

  # --- Donation ---
  - entity: Donation
    initial_state: POSTED
    terminal_states: [REFUNDED]
    transitions:
      - from: POSTED
        to: REFUNDED
        trigger: "POST /donations/{donationId}/refund"
        actor: Chief
        preconditions: ["FundraisingCampaign.status != CLOSED (ERR_INVALID_STATE)"]
        side_effects:
          - "INVARIANT-2 compensation: FundraisingCampaign.raised_cents -= amount_cents"

# =============================================================================
# §1.2.1 Concurrency Rules (OCC on parent version)
# =============================================================================
concurrency_rules:
  - rule_id: duty-assignment-create-stale-shift
    parent_entity: DutyShift
    write_endpoint: "POST /duty-shifts/{shiftId}/assignments"
    occ_field: "expected_duty_shift_version"
    description: |
      Creating a DutyAssignment against a DutyShift whose version has advanced
      since the client last observed it is rejected. Another writer has already
      added an assignment (which legitimately changed the roster composition and
      the remaining crew slots under §1.3 shift_staffing), so the current
      writer's view of the shift roster is stale.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: report-amend-stale-incident
    parent_entity: Incident
    write_endpoint: "POST /incidents/{incidentId}/report/amend"
    occ_field: "expected_incident_version"
    description: |
      Amending a LOCKED/AMENDED NFIRS report produces a new revision that
      supersedes the prior one. If the Incident version has advanced since the
      client last read it (a prior amend already superseded the revision the
      client was editing), the stale amend is rejected so a client never
      overwrites a revision it never saw.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  # ---- DUAL-VARIANT #1 (Certification domain) ----
  - name: cert_completed_hours
    trigger: "read of a Certification; evaluated on issue/renew preconditions and on GET /certifications/{id}"
    algorithm: aggregation
    formula: |
      # Only TrainingRecords for this cert's member whose category == cert.category count.
      in_cycle = sum(tr.hours
                     for tr in TrainingRecord
                     where tr.member_id == cert.member_id
                       and tr.category == cert.category
                       and tr.training_date >= cert.cycle_start_at
                       and tr.training_date <= current_clock)
      pre_cycle = sum(tr.hours
                      for tr in TrainingRecord
                      where tr.member_id == cert.member_id
                        and tr.category == cert.category
                        and tr.training_date >= (cert.cycle_start_at - 90 days)
                        and tr.training_date <  cert.cycle_start_at)
      completed_hours_strict    = in_cycle
      completed_hours_carryover = in_cycle + min(pre_cycle, CARRYOVER_CAP)
    input_set: "TrainingRecord rows for the member, filtered by matching category; STRICT counts only [cycle_start_at, now]; CARRYOVER adds capped hours from [cycle_start_at-90d, cycle_start_at)."
    constants:
      CARRYOVER_CAP: 8            # hours
      CERT_VALIDITY_DAYS: 365
      EXPIRING_WINDOW_DAYS: 30
      CERT_REQUIRED_HOURS: "{FIREFIGHTER_1:24, EMT_BASIC:20, PARAMEDIC:40, HAZMAT:16, DRIVER_OPERATOR:12, CPR:4}"
    precision: "hours are numbers with 1 decimal; comparisons exact"
    variants:
      - name: STRICT
        when: "PENDING->CURRENT issue precondition"
        difference: "Counts only in-cycle training; no pre-cycle carryover."
      - name: CARRYOVER
        when: "EXPIRED->CURRENT and EXPIRING->CURRENT renew preconditions"
        difference: "Adds min(pre_cycle_hours, 8) from the 90-day window before cycle_start_at."

  # ---- DUAL-VARIANT #2 + COMBINATORIAL mode (c) (Member/stipend domain) ----
  - name: member_stipend
    trigger: "GET /members/{id}/summary; FINAL basis stamped on Member.stipend_cents"
    algorithm: tiered_pricing
    formula: |
      # Evaluation order is PINNED to resolve the circular-looking tier<->waiver dependency:
      # (1) P = points basis (variant-dependent, see variants)
      # (2) tier  = GOLD  if P >= GOLD_MIN
      #             SILVER if P >= SILVER_MIN
      #             BRONZE otherwise
      # (3) gross_stipend_cents = P * RATE_CENTS_PER_POINT[tier]
      # (4) dues_waiver_cents   = member.dues_balance_cents            if tier == GOLD
      #                           floor(member.dues_balance_cents / 2)  if tier == SILVER
      #                           0                                     if tier == BRONZE
      # (5) net_stipend_cents   = max(0, gross_stipend_cents - (member.dues_balance_cents - dues_waiver_cents))
      # tier is computed from P BEFORE the waiver; the waiver never re-upgrades the tier.
    input_set: "points basis P per variant; member.dues_balance_cents."
    constants:
      SILVER_MIN: 10
      GOLD_MIN: 20
      RATE_CENTS_PER_POINT: "{BRONZE:0, SILVER:150, GOLD:250}"
    precision: "integer cents; floor on the SILVER waiver half"
    variants:
      - name: PROVISIONAL
        when: "GET /members/{id}/summary?basis=PROVISIONAL"
        difference: "P counts released turnout points + VERIFIED duty points + scheduled ASSIGNED/CHECKED_IN duty (points-if-verified) + non-reversed PointAdjustment."
      - name: FINAL
        when: "GET /members/{id}/summary?basis=FINAL (default); stamped on Member.stipend_cents"
        difference: "P counts only released turnout points + VERIFIED duty points + non-reversed PointAdjustment; excludes not-yet-verified scheduled duty."

  # ---- COMBINATORIAL mode (a): >=3 inputs, tiered, conditional, nested min ----
  - name: turnout_points
    trigger: "Incident response ONSCENE->CLEARED: computed for every RELEASED TurnoutResponse"
    algorithm: weighted_scoring
    formula: |
      base       = INCIDENT_TYPE_BASE[incident.incident_type]        # tiered selection
      role_mult  = ROLE_MULT[member.role_class]                      # tiered selection
      scene_hours = ceil( (incident.cleared_at - incident.onscene_at) seconds / 3600 )
      scene_component = min(scene_hours, SCENE_CAP) * SCENE_POINTS_PER_HOUR   # nested min cap
      officer_bonus   = OFFICER_IC_BONUS if member.role_class == OFFICER else 0   # conditional branch
      turnout_points  = round_half_up(base * role_mult) + scene_component + officer_bonus
    input_set: "incident.incident_type, member.role_class, incident onscene->cleared duration, member OFFICER flag."
    constants:
      INCIDENT_TYPE_BASE: "{STRUCTURE_FIRE:5, MVA:4, EMS:3, ALARM:2, OTHER:1}"
      ROLE_MULT: "{OFFICER:1.5, PARAMEDIC:1.4, EMT:1.2, FIREFIGHTER:1.0, PROBATIONARY:0.5}"
      SCENE_CAP: 6
      SCENE_POINTS_PER_HOUR: 1
      OFFICER_IC_BONUS: 2
    precision: "round_half_up on base*role_mult to whole points; final points are integers"

  - name: duty_points
    trigger: "DutyShift IN_PROGRESS->COMPLETED: computed for CHECKED_IN->VERIFIED assignments"
    algorithm: aggregation
    formula: |
      shift_hours = (shift.end_at - shift.start_at) seconds / 3600
      duty_points = max( round_half_up(shift_hours * DUTY_POINTS_PER_HOUR), DUTY_MIN_POINTS )
    input_set: "shift duration."
    constants:
      DUTY_POINTS_PER_HOUR: 0.5
      DUTY_MIN_POINTS: 2
    precision: "round_half_up to integer"

  # ---- CONSERVED QUANTITY #1 (points ledger) ----
  - name: member_points_ytd
    trigger: "any turnout release/void, duty verify, or point adjustment"
    algorithm: aggregation
    formula: |
      points_ytd =
          sum(t.turnout_points for TurnoutResponse t
              where t.member_id == member.id and t.status == RELEASED)          # VOIDED excluded
        + sum(a.duty_points for DutyAssignment a
              where a.member_id == member.id and a.status == VERIFIED)
        + sum(p.points for PointAdjustment p
              where p.member_id == member.id and p.reversed == false)
      # INVARIANT: this identity holds after every forward action AND its compensation
      # (turnout void, adjustment reversal) with zero drift.
    input_set: "RELEASED turnouts + VERIFIED assignments + non-reversed adjustments for the member."
    precision: "integer points"

  # ---- CONSERVED QUANTITY #2 (campaign money) ----
  - name: campaign_raised
    trigger: "Donation POSTED create or REFUNDED refund"
    algorithm: aggregation
    formula: |
      raised_cents = sum(d.amount_cents for Donation d
                         where d.campaign_id == campaign.id and d.status == POSTED)
      # INVARIANT: raised_cents == sum of POSTED donations at all times; a refund
      # (POSTED->REFUNDED) subtracts exactly amount_cents, leaving no drift.
    input_set: "POSTED donations for the campaign."
    precision: "integer cents"

  # ---- DERIVED FIELD: member response eligibility ----
  - name: response_eligibility
    trigger: "membership transition, certification issue/renew/suspend/expire/revoke"
    algorithm: threshold
    formula: |
      response_eligible =
          (member.membership_status == ACTIVE)
        AND ( count(Certification c where c.member_id == member.id
                    and c.is_required == true
                    and c.status in {EXPIRED, SUSPENDED, REVOKED}) == 0 )
      # A PROBATIONARY / LOA / RETIRED / EXPELLED member is never eligible.
    input_set: "member.membership_status + the member's required Certifications and their status."
    precision: "boolean"

  # ---- DERIVED FIELD: apparatus posture ----
  - name: apparatus_posture
    trigger: "Equipment status change, MaintenanceWindow start/complete"
    algorithm: threshold
    formula: |
      if (exists MaintenanceWindow w on apparatus with w.status == IN_PROGRESS)
         OR (exists Equipment e on apparatus with e.is_critical == true and e.status == OUT_OF_SERVICE):
          posture = OUT_OF_SERVICE
      elif (exists Equipment e on apparatus with e.is_critical == false and e.status == OUT_OF_SERVICE):
          posture = RESERVE
      else:
          posture = IN_SERVICE
    input_set: "Equipment rows and MaintenanceWindow rows for the apparatus."
    precision: "enum"

  # ---- DERIVED FIELD: shift staffing (empty-set boundary) ----
  - name: shift_staffing
    trigger: "any DutyAssignment create/cancel/verify on the shift"
    algorithm: threshold
    formula: |
      assigned_count = count(DutyAssignment a where a.duty_shift_id == shift.id
                             and a.status in {ASSIGNED, CHECKED_IN, VERIFIED})
      if assigned_count == 0 or assigned_count < shift.min_crew:
          staffing_status = UNDERSTAFFED
      elif assigned_count >= shift.max_crew:
          staffing_status = FULL
      else:
          staffing_status = STAFFED
    input_set: "non-terminal DutyAssignments for the shift."
    precision: "integer count; FULL boundary is assigned_count >= max_crew"

  # ---- DERIVED FIELD: points tier (threshold boundary) ----
  - name: stipend_tier
    trigger: "read of Member.points_tier / summary"
    algorithm: threshold
    formula: |
      if points_ytd >= GOLD_MIN:   points_tier = GOLD      # >= boundary at 20
      elif points_ytd >= SILVER_MIN: points_tier = SILVER  # >= boundary at 10
      else: points_tier = BRONZE
    input_set: "member.points_ytd (FINAL basis)."
    constants:
      SILVER_MIN: 10
      GOLD_MIN: 20
    precision: "boundary is >= (points_ytd of exactly 20 is GOLD, 19 is SILVER)"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority; lowest number wins)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present and X-User-Role is a known role"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"

  - priority: 2
    category: auth
    check: "Acting role is permitted for this operation per §1.7 RBAC; entity-backed ownership where required (e.g. Member check-in of own assignment)"
    error_id: ERR_FORBIDDEN
    http_status: 403
    applies_to: "all"

  - priority: 3
    category: business_constraint
    check: "Field-level validity: required body fields present, enums in range, numbers positive where required, end_at > start_at"
    error_id: ERR_VALIDATION
    http_status: 400
    applies_to: "all create/update endpoints"

  - priority: 4
    category: existence
    check: "Every resource id in the path/body FK exists, validated left-to-right"
    error_id: "ERR_<RESOURCE>_NOT_FOUND"
    http_status: 404
    applies_to: "all endpoints referencing a resource id"

  - priority: 5
    category: state
    check: "Target resource is in a state from which the requested transition is legal"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all state-transition endpoints"

  - priority: 6
    category: business_safety
    check: "For duty-assignment create: Member.response_eligible == true (required certs current, membership ACTIVE)"
    error_id: ERR_MEMBER_NOT_RESPONSE_ELIGIBLE
    http_status: 409
    applies_to: "POST /duty-shifts/{shiftId}/assignments"

  - priority: 7
    category: business_referential
    check: "Referenced apparatus_id belongs to the referenced station_id (duty-shift create, incident create)"
    error_id: ERR_APPARATUS_NOT_AT_STATION
    http_status: 409
    applies_to: "POST /duty-shifts, POST /incidents"

  - priority: 8
    category: business_temporal
    check: "Duty-assignment: member has no other {ASSIGNED,CHECKED_IN} assignment whose shift interval [start,end) overlaps OR is within REST_BUFFER_HOURS(8h) of the new shift (half-open + rest buffer; adjacency rejected). Maintenance-window: no other {SCHEDULED,IN_PROGRESS} window on same apparatus whose [start,end) overlaps (half-open, adjacency allowed, no buffer)."
    error_id: "ERR_SHIFT_OVERLAP | ERR_MAINTENANCE_OVERLAP"
    http_status: 409
    applies_to: "POST /duty-shifts/{shiftId}/assignments, POST /apparatus/{apparatusId}/maintenance-windows"

  - priority: 9
    category: business_constraint
    check: "Capacity/compliance: duty-shift publish requires Apparatus.posture in {IN_SERVICE,RESERVE} (ERR_APPARATUS_OUT_OF_SERVICE); assignment create requires assigned_count < max_crew (ERR_SHIFT_FULL); cert issue/renew requires completed hours >= required (ERR_INSUFFICIENT_TRAINING_HOURS); report lock/amend requires NFIRS fields present (ERR_NFIRS_INCOMPLETE)"
    error_id: "ERR_APPARATUS_OUT_OF_SERVICE | ERR_SHIFT_FULL | ERR_INSUFFICIENT_TRAINING_HOURS | ERR_NFIRS_INCOMPLETE"
    http_status: "409 | 422"
    applies_to: "duty-shift publish, assignment create, cert issue/renew, report lock/amend"

  - priority: 10
    category: business_fiscal
    check: "Duty-assignment create: member.dues_balance_cents <= DUES_OVERDUE_LIMIT (0); members owing back dues cannot be rostered"
    error_id: ERR_DUES_OVERDUE
    http_status: 402
    applies_to: "POST /duty-shifts/{shiftId}/assignments"

  - priority: 11
    category: business_constraint
    check: "OCC: expected_<parent>_version matches current parent version"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /duty-shifts/{shiftId}/assignments, POST /incidents/{incidentId}/report/amend"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # ---- Test-driving: logical clock ----
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the server logical clock to an arbitrary ISO 8601 UTC instant. Startup default is 2026-03-01T00:00:00Z; before any set call the clock reads exactly this default and never falls back to wall-clock time. All expiry/window/overlap rules read this clock."
    roles: [Chief, Officer]
    code: 200
    input: [to_iso8601]
    output: "null"
    side_effects: ["logical clock set to to_iso8601"]

  # ---- Member ----
  - method: POST
    path: "/members"
    description: "Create a member (starts PROBATIONARY)"
    roles: [Chief]
    code: 201
    input: [full_name, email, role_class, join_date, "dues_balance_cents?"]
    output: Member
    side_effects: ["membership_status=PROBATIONARY, response_eligible=false, points_ytd=0, dues_balance_cents defaults 0"]
  - method: GET
    path: "/members/{memberId}"
    description: "Get a member"
    roles: [Chief, Officer, Member]
    code: 200
    input: []
    output: Member
    side_effects: []
  - method: GET
    path: "/members"
    description: "List members (filterable)"
    roles: [Chief, Officer, Member]
    code: 200
    input: ["membership_status?", "limit?", "offset?"]
    output: "Member[]"
    side_effects: []
  - method: GET
    path: "/members/{memberId}/summary"
    description: "Computed member summary; basis=PROVISIONAL|FINAL (default FINAL) selects which points/stipend/tier basis the returned points_ytd, stipend_cents and points_tier reflect (§1.3 member_stipend variants)"
    roles: [Chief, Officer, Member]
    code: 200
    input: ["basis?"]
    output: Member
    side_effects: []
  - method: POST
    path: "/members/{memberId}/activate"
    description: "PROBATIONARY -> ACTIVE"
    roles: [Chief]
    code: 200
    input: []
    output: Member
    side_effects: ["recompute response_eligible"]
  - method: POST
    path: "/members/{memberId}/leave"
    description: "ACTIVE -> LOA"
    roles: [Chief]
    code: 200
    input: []
    output: Member
    side_effects: ["response_eligible=false; cancel future assignments; recompute affected shifts"]
  - method: POST
    path: "/members/{memberId}/return"
    description: "LOA -> ACTIVE"
    roles: [Chief]
    code: 200
    input: []
    output: Member
    side_effects: ["recompute response_eligible"]
  - method: POST
    path: "/members/{memberId}/retire"
    description: "ACTIVE|LOA -> RETIRED"
    roles: [Chief]
    code: 200
    input: []
    output: Member
    side_effects: ["response_eligible=false"]
  - method: POST
    path: "/members/{memberId}/expel"
    description: "ACTIVE -> EXPELLED"
    roles: [Chief]
    code: 200
    input: []
    output: Member
    side_effects: ["response_eligible=false"]
  - method: POST
    path: "/members/{memberId}/dues-payments"
    description: "Record a dues payment; reduces dues_balance_cents and advances dues_paid_through"
    roles: [Chief, Officer]
    code: 200
    input: [amount_cents, "paid_through?"]
    output: Member
    side_effects: ["dues_balance_cents -= amount_cents (floored at 0); dues_paid_through advanced if provided"]

  # ---- Certification ----
  - method: POST
    path: "/members/{memberId}/certifications"
    description: "Create a certification (PENDING)"
    roles: [Chief, Officer]
    code: 201
    input: [cert_type, category, "is_required?"]
    output: Certification
    side_effects: ["status=PENDING; cycle_start_at = current clock"]
  - method: GET
    path: "/certifications/{certId}"
    description: "Get a certification (includes completed_hours_strict, completed_hours_carryover)"
    roles: [Chief, Officer, Member]
    code: 200
    input: []
    output: Certification
    side_effects: []
  - method: GET
    path: "/certifications"
    description: "List certifications; reverse-reachability for Certification.member_id"
    roles: [Chief, Officer, Member]
    code: 200
    input: ["member_id?", "status?", "limit?", "offset?"]
    output: "Certification[]"
    side_effects: []
  - method: POST
    path: "/certifications/{certId}/issue"
    description: "PENDING -> CURRENT (STRICT hours gate)"
    roles: [Officer]
    code: 200
    input: []
    output: Certification
    side_effects: ["set issued_at/expires_at (cycle_start_at set at create); recompute member.response_eligible"]
  - method: POST
    path: "/certifications/{certId}/renew"
    description: "EXPIRED|EXPIRING -> CURRENT (CARRYOVER hours gate)"
    roles: [Officer]
    code: 200
    input: []
    output: Certification
    side_effects: ["reset cycle_start_at/issued_at/expires_at; recompute member.response_eligible"]
  - method: POST
    path: "/certifications/{certId}/suspend"
    description: "CURRENT|EXPIRING -> SUSPENDED"
    roles: [Officer]
    code: 200
    input: []
    output: Certification
    side_effects: ["recompute member.response_eligible"]
  - method: POST
    path: "/certifications/{certId}/reinstate"
    description: "SUSPENDED -> CURRENT"
    roles: [Officer]
    code: 200
    input: []
    output: Certification
    side_effects: ["recompute member.response_eligible"]
  - method: POST
    path: "/certifications/{certId}/revoke"
    description: "SUSPENDED -> REVOKED"
    roles: [Chief]
    code: 200
    input: []
    output: Certification
    side_effects: ["recompute member.response_eligible"]
  - method: POST
    path: "/certifications/sweep"
    description: "Evaluate all certifications against the current clock: CURRENT->EXPIRING (within 30d), CURRENT/EXPIRING->EXPIRED (past expiry). Runs CASCADE-1 for each expiry."
    roles: [Chief, Officer]
    code: 200
    input: []
    output: "Certification[]"
    side_effects: ["transitioned certs recompute member.response_eligible; cascade duty cancellations and shift staffing recompute"]

  # ---- TrainingRecord ----
  - method: POST
    path: "/members/{memberId}/training-records"
    description: "Append a training record; updates member.training_hours_ytd and cert completed_hours"
    roles: [Chief, Officer]
    code: 201
    input: [category, hours, training_date, "certification_id?", "description?"]
    output: TrainingRecord
    side_effects: ["recompute member.training_hours_ytd; affects cert_completed_hours for matching certs"]
  - method: GET
    path: "/training-records/{recordId}"
    description: "Get a training record"
    roles: [Chief, Officer, Member]
    code: 200
    input: []
    output: TrainingRecord
    side_effects: []
  - method: GET
    path: "/training-records"
    description: "List training records; reverse-reachability for TrainingRecord.member_id and TrainingRecord.certification_id"
    roles: [Chief, Officer, Member]
    code: 200
    input: ["member_id?", "certification_id?", "limit?", "offset?"]
    output: "TrainingRecord[]"
    side_effects: []

  # ---- PointAdjustment ----
  - method: POST
    path: "/members/{memberId}/point-adjustments"
    description: "Officer awards/deducts points; contributes to points_ytd"
    roles: [Officer]
    code: 201
    input: [points, reason]
    output: PointAdjustment
    side_effects: ["recompute member.points_ytd, points_tier, stipend_cents"]
  - method: GET
    path: "/point-adjustments/{adjustmentId}"
    description: "Get a point adjustment"
    roles: [Chief, Officer, Member]
    code: 200
    input: []
    output: PointAdjustment
    side_effects: []
  - method: GET
    path: "/point-adjustments"
    description: "List point adjustments; reverse-reachability for PointAdjustment.member_id"
    roles: [Chief, Officer, Member]
    code: 200
    input: ["member_id?", "limit?", "offset?"]
    output: "PointAdjustment[]"
    side_effects: []

  # ---- Station / Apparatus / Equipment ----
  - method: POST
    path: "/stations"
    description: "Create a station"
    roles: [Chief]
    code: 201
    input: [name, "address?"]
    output: Station
    side_effects: []
  - method: GET
    path: "/stations/{stationId}"
    description: "Get a station"
    roles: [Chief, Officer, Member]
    code: 200
    input: []
    output: Station
    side_effects: []
  - method: POST
    path: "/stations/{stationId}/apparatus"
    description: "Create apparatus under a station (posture starts IN_SERVICE)"
    roles: [Chief]
    code: 201
    input: [unit_designation, apparatus_type, min_crew]
    output: Apparatus
    side_effects: ["posture=IN_SERVICE"]
  - method: GET
    path: "/apparatus/{apparatusId}"
    description: "Get apparatus (includes computed posture)"
    roles: [Chief, Officer, Member]
    code: 200
    input: []
    output: Apparatus
    side_effects: []
  - method: GET
    path: "/apparatus"
    description: "List apparatus; reverse-reachability for Apparatus.station_id"
    roles: [Chief, Officer, Member]
    code: 200
    input: ["station_id?", "limit?", "offset?"]
    output: "Apparatus[]"
    side_effects: []
  - method: POST
    path: "/apparatus/{apparatusId}/equipment"
    description: "Add equipment/PPE to apparatus"
    roles: [Chief]
    code: 201
    input: [name, "is_critical?"]
    output: Equipment
    side_effects: ["status=OPERATIONAL; recompute apparatus.posture"]
  - method: GET
    path: "/equipment/{equipmentId}"
    description: "Get equipment"
    roles: [Chief, Officer, Member]
    code: 200
    input: []
    output: Equipment
    side_effects: []
  - method: GET
    path: "/equipment"
    description: "List equipment; reverse-reachability for Equipment.apparatus_id"
    roles: [Chief, Officer, Member]
    code: 200
    input: ["apparatus_id?", "limit?", "offset?"]
    output: "Equipment[]"
    side_effects: []
  - method: POST
    path: "/equipment/{equipmentId}/out-of-service"
    description: "OPERATIONAL -> OUT_OF_SERVICE (CASCADE-2)"
    roles: [Chief]
    code: 200
    input: []
    output: Equipment
    side_effects: ["recompute apparatus.posture; suspend affected published future shifts"]
  - method: POST
    path: "/equipment/{equipmentId}/return-to-service"
    description: "OUT_OF_SERVICE -> OPERATIONAL"
    roles: [Chief]
    code: 200
    input: []
    output: Equipment
    side_effects: ["recompute apparatus.posture; un-suspend shifts if posture recovers"]

  # ---- MaintenanceWindow ----
  - method: POST
    path: "/apparatus/{apparatusId}/maintenance-windows"
    description: "Schedule a maintenance window (half-open [start,end), adjacency allowed, no buffer; overlap on same apparatus rejected)"
    roles: [Chief]
    code: 201
    input: [start_at, end_at, "reason?"]
    output: MaintenanceWindow
    side_effects: ["status=SCHEDULED"]
  - method: GET
    path: "/maintenance-windows/{windowId}"
    description: "Get a maintenance window"
    roles: [Chief, Officer, Member]
    code: 200
    input: []
    output: MaintenanceWindow
    side_effects: []
  - method: GET
    path: "/maintenance-windows"
    description: "List maintenance windows; reverse-reachability for MaintenanceWindow.apparatus_id"
    roles: [Chief, Officer, Member]
    code: 200
    input: ["apparatus_id?", "status?", "limit?", "offset?"]
    output: "MaintenanceWindow[]"
    side_effects: []
  - method: POST
    path: "/maintenance-windows/{windowId}/start"
    description: "SCHEDULED -> IN_PROGRESS"
    roles: [Chief]
    code: 200
    input: []
    output: MaintenanceWindow
    side_effects: ["apparatus.posture -> OUT_OF_SERVICE; suspend affected shifts"]
  - method: POST
    path: "/maintenance-windows/{windowId}/complete"
    description: "IN_PROGRESS -> COMPLETED"
    roles: [Chief]
    code: 200
    input: []
    output: MaintenanceWindow
    side_effects: ["recompute apparatus.posture; un-suspend shifts if posture recovers"]
  - method: POST
    path: "/maintenance-windows/{windowId}/cancel"
    description: "SCHEDULED -> CANCELLED"
    roles: [Chief]
    code: 200
    input: []
    output: MaintenanceWindow
    side_effects: []

  # ---- DutyShift ----
  - method: POST
    path: "/duty-shifts"
    description: "Create a duty shift (DRAFT). apparatus_id must belong to station_id."
    roles: [Officer]
    code: 201
    input: [station_id, apparatus_id, start_at, end_at, max_crew, "min_crew?"]
    output: DutyShift
    side_effects: ["status=DRAFT; min_crew defaults from apparatus.min_crew; staffing_status computed"]
  - method: GET
    path: "/duty-shifts/{shiftId}"
    description: "Get a duty shift"
    roles: [Chief, Officer, Member]
    code: 200
    input: []
    output: DutyShift
    side_effects: []
  - method: GET
    path: "/duty-shifts"
    description: "List duty shifts; reverse-reachability for DutyShift.station_id and DutyShift.apparatus_id"
    roles: [Chief, Officer, Member]
    code: 200
    input: ["station_id?", "apparatus_id?", "status?", "limit?", "offset?"]
    output: "DutyShift[]"
    side_effects: []
  - method: POST
    path: "/duty-shifts/{shiftId}/publish"
    description: "DRAFT -> PUBLISHED (requires apparatus.posture in {IN_SERVICE,RESERVE})"
    roles: [Officer]
    code: 200
    input: []
    output: DutyShift
    side_effects: ["recompute staffing_status"]
  - method: POST
    path: "/duty-shifts/{shiftId}/cancel"
    description: "DRAFT|PUBLISHED|SUSPENDED -> CANCELLED"
    roles: [Officer]
    code: 200
    input: []
    output: DutyShift
    side_effects: ["cancel non-terminal assignments"]
  - method: POST
    path: "/duty-shifts/sweep"
    description: "Advance shift lifecycle vs current clock: PUBLISHED->IN_PROGRESS (started), IN_PROGRESS->COMPLETED (ended). On completion, CHECKED_IN assignments -> VERIFIED (award duty_points), ASSIGNED -> NO_SHOW."
    roles: [Chief, Officer]
    code: 200
    input: []
    output: "DutyShift[]"
    side_effects: ["verify assignments; compute duty_points; recompute member points_ytd"]

  # ---- DutyAssignment ----
  - method: POST
    path: "/duty-shifts/{shiftId}/assignments"
    description: "Assign a member to a shift. OCC on shift version. Enforces eligibility (safety), rest-buffer overlap (temporal), capacity (constraint), dues (fiscal)."
    roles: [Officer]
    code: 201
    input: [member_id, expected_duty_shift_version]
    output: DutyAssignment
    side_effects: ["status=ASSIGNED; DutyShift.assigned_count += 1; recompute staffing_status; increments DutyShift.version by 1"]
  - method: GET
    path: "/duty-assignments/{assignmentId}"
    description: "Get a duty assignment"
    roles: [Chief, Officer, Member]
    code: 200
    input: []
    output: DutyAssignment
    side_effects: []
  - method: GET
    path: "/duty-assignments"
    description: "List duty assignments; reverse-reachability for DutyAssignment.duty_shift_id and DutyAssignment.member_id"
    roles: [Chief, Officer, Member]
    code: 200
    input: ["duty_shift_id?", "member_id?", "status?", "limit?", "offset?"]
    output: "DutyAssignment[]"
    side_effects: []
  - method: POST
    path: "/duty-assignments/{assignmentId}/check-in"
    description: "ASSIGNED -> CHECKED_IN (acting member must own the assignment)"
    roles: [Member, Officer]
    code: 200
    input: []
    output: DutyAssignment
    side_effects: ["checked_in_at set"]
  - method: POST
    path: "/duty-assignments/{assignmentId}/cancel"
    description: "ASSIGNED|CHECKED_IN -> CANCELLED"
    roles: [Officer]
    code: 200
    input: []
    output: DutyAssignment
    side_effects: ["DutyShift.assigned_count recomputed; staffing_status recomputed"]

  # ---- Incident + NFIRS ----
  - method: POST
    path: "/incidents"
    description: "Log an incident/run (DISPATCHED, report NONE). apparatus_id must belong to station_id."
    roles: [Officer]
    code: 201
    input: [station_id, apparatus_id, incident_type, alarm_at]
    output: Incident
    side_effects: ["response_status=DISPATCHED, report_status=NONE, report_revision=0"]
  - method: GET
    path: "/incidents/{incidentId}"
    description: "Get an incident"
    roles: [Chief, Officer, Member]
    code: 200
    input: []
    output: Incident
    side_effects: []
  - method: GET
    path: "/incidents"
    description: "List incidents; reverse-reachability for Incident.station_id and Incident.apparatus_id"
    roles: [Chief, Officer, Member]
    code: 200
    input: ["station_id?", "apparatus_id?", "limit?", "offset?"]
    output: "Incident[]"
    side_effects: []
  - method: POST
    path: "/incidents/{incidentId}/enroute"
    description: "response DISPATCHED -> ENROUTE"
    roles: [Officer]
    code: 200
    input: []
    output: Incident
    side_effects: ["enroute_at = clock"]
  - method: POST
    path: "/incidents/{incidentId}/arrive"
    description: "response ENROUTE -> ONSCENE"
    roles: [Officer]
    code: 200
    input: []
    output: Incident
    side_effects: ["onscene_at = clock"]
  - method: POST
    path: "/incidents/{incidentId}/clear"
    description: "response ONSCENE -> CLEARED; releases turnouts and awards turnout_points"
    roles: [Officer]
    code: 200
    input: []
    output: Incident
    side_effects: ["cleared_at = clock; RESPONDED turnouts -> RELEASED; compute turnout_points; credit member points_ytd"]
  - method: POST
    path: "/incidents/{incidentId}/report"
    description: "report NONE -> DRAFT (requires response CLEARED)"
    roles: [Officer]
    code: 200
    input: ["nfirs_property_use?", "nfirs_actions_taken?"]
    output: Incident
    side_effects: ["save NFIRS fields"]
  - method: POST
    path: "/incidents/{incidentId}/report/lock"
    description: "report DRAFT -> LOCKED (requires NFIRS fields present)"
    roles: [Officer]
    code: 200
    input: []
    output: Incident
    side_effects: ["report_revision += 1; increments Incident.version by 1"]
  - method: POST
    path: "/incidents/{incidentId}/report/amend"
    description: "report LOCKED|AMENDED -> AMENDED; OCC on Incident.version; new revision supersedes prior"
    roles: [Officer]
    code: 200
    input: [expected_incident_version, "nfirs_property_use?", "nfirs_actions_taken?"]
    output: Incident
    side_effects: ["report_revision += 1; increments Incident.version by 1"]

  # ---- TurnoutResponse ----
  - method: POST
    path: "/incidents/{incidentId}/turnouts"
    description: "Record a member turnout on an incident (RESPONDED)"
    roles: [Officer]
    code: 201
    input: [member_id]
    output: TurnoutResponse
    side_effects: ["status=RESPONDED; responded_at = clock"]
  - method: GET
    path: "/turnouts/{turnoutId}"
    description: "Get a turnout response"
    roles: [Chief, Officer, Member]
    code: 200
    input: []
    output: TurnoutResponse
    side_effects: []
  - method: GET
    path: "/turnouts"
    description: "List turnouts; reverse-reachability for TurnoutResponse.incident_id and TurnoutResponse.member_id"
    roles: [Chief, Officer, Member]
    code: 200
    input: ["incident_id?", "member_id?", "status?", "limit?", "offset?"]
    output: "TurnoutResponse[]"
    side_effects: []
  - method: POST
    path: "/turnouts/{turnoutId}/void"
    description: "RESPONDED|RELEASED -> VOIDED; reverses awarded points (INVARIANT-1 compensation)"
    roles: [Officer]
    code: 200
    input: []
    output: TurnoutResponse
    side_effects: ["if RELEASED: member.points_ytd -= turnout_points; turnout_points=0"]

  # ---- Fundraising ----
  - method: POST
    path: "/campaigns"
    description: "Create a fundraising campaign (DRAFT)"
    roles: [Chief]
    code: 201
    input: [name, goal_cents]
    output: FundraisingCampaign
    side_effects: ["status=DRAFT, raised_cents=0"]
  - method: GET
    path: "/campaigns/{campaignId}"
    description: "Get a campaign"
    roles: [Chief, Officer, Member]
    code: 200
    input: []
    output: FundraisingCampaign
    side_effects: []
  - method: GET
    path: "/campaigns"
    description: "List campaigns"
    roles: [Chief, Officer, Member]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: "FundraisingCampaign[]"
    side_effects: []
  - method: POST
    path: "/campaigns/{campaignId}/open"
    description: "DRAFT -> ACTIVE"
    roles: [Chief]
    code: 200
    input: []
    output: FundraisingCampaign
    side_effects: []
  - method: POST
    path: "/campaigns/{campaignId}/close"
    description: "ACTIVE -> CLOSED"
    roles: [Chief]
    code: 200
    input: []
    output: FundraisingCampaign
    side_effects: []
  - method: POST
    path: "/campaigns/{campaignId}/donations"
    description: "Record a donation (POSTED); campaign must be ACTIVE"
    roles: [Chief, Officer]
    code: 201
    input: [donor_name, amount_cents]
    output: Donation
    side_effects: ["status=POSTED; campaign.raised_cents += amount_cents"]
  - method: GET
    path: "/donations/{donationId}"
    description: "Get a donation"
    roles: [Chief, Officer, Member]
    code: 200
    input: []
    output: Donation
    side_effects: []
  - method: GET
    path: "/donations"
    description: "List donations; reverse-reachability for Donation.campaign_id"
    roles: [Chief, Officer, Member]
    code: 200
    input: ["campaign_id?", "status?", "limit?", "offset?"]
    output: "Donation[]"
    side_effects: []
  - method: POST
    path: "/donations/{donationId}/refund"
    description: "POSTED -> REFUNDED; campaign.raised_cents -= amount_cents (INVARIANT-2 compensation); campaign must not be CLOSED"
    roles: [Chief]
    code: 200
    input: []
    output: Donation
    side_effects: ["campaign.raised_cents -= amount_cents"]

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "Missing/invalid X-User-Role or X-User-ID header" }
  - { id: ERR_FORBIDDEN, http: 403, condition: "Acting role not permitted, or entity-backed ownership check failed (e.g. Member checking in another member's assignment)" }
  - { id: ERR_VALIDATION, http: 400, condition: "Malformed body: missing required field, bad enum, non-positive number, or end_at <= start_at" }
  - { id: ERR_MEMBER_NOT_FOUND, http: 404, condition: "member id does not exist" }
  - { id: ERR_CERTIFICATION_NOT_FOUND, http: 404, condition: "certification id does not exist" }
  - { id: ERR_STATION_NOT_FOUND, http: 404, condition: "station id does not exist" }
  - { id: ERR_APPARATUS_NOT_FOUND, http: 404, condition: "apparatus id does not exist" }
  - { id: ERR_EQUIPMENT_NOT_FOUND, http: 404, condition: "equipment id does not exist" }
  - { id: ERR_MAINTENANCE_WINDOW_NOT_FOUND, http: 404, condition: "maintenance window id does not exist" }
  - { id: ERR_DUTY_SHIFT_NOT_FOUND, http: 404, condition: "duty shift id does not exist" }
  - { id: ERR_DUTY_ASSIGNMENT_NOT_FOUND, http: 404, condition: "duty assignment id does not exist" }
  - { id: ERR_INCIDENT_NOT_FOUND, http: 404, condition: "incident id does not exist" }
  - { id: ERR_TURNOUT_NOT_FOUND, http: 404, condition: "turnout id does not exist" }
  - { id: ERR_CAMPAIGN_NOT_FOUND, http: 404, condition: "campaign id does not exist" }
  - { id: ERR_DONATION_NOT_FOUND, http: 404, condition: "donation id does not exist" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Resource not in a state permitting the requested transition (incl. campaign CLOSED on refund, reinstate past expiry)" }
  - { id: ERR_MEMBER_NOT_RESPONSE_ELIGIBLE, http: 409, condition: "Assigning a member who is not response_eligible (required cert lapsed/suspended, or not ACTIVE)" }
  - { id: ERR_APPARATUS_NOT_AT_STATION, http: 409, condition: "Referenced apparatus_id does not belong to the referenced station_id" }
  - { id: ERR_APPARATUS_OUT_OF_SERVICE, http: 409, condition: "Publishing a duty shift whose apparatus.posture == OUT_OF_SERVICE" }
  - { id: ERR_SHIFT_OVERLAP, http: 409, condition: "New assignment collides with member's existing shift within the 8h rest buffer (half-open + buffer; adjacency rejected)" }
  - { id: ERR_MAINTENANCE_OVERLAP, http: 409, condition: "New maintenance window overlaps an existing window on the same apparatus (half-open; adjacency allowed)" }
  - { id: ERR_SHIFT_FULL, http: 409, condition: "Assignment would push assigned_count above max_crew" }
  - { id: ERR_INSUFFICIENT_TRAINING_HOURS, http: 422, condition: "Cert issue (STRICT) or renew (CARRYOVER) with completed hours below CERT_REQUIRED_HOURS" }
  - { id: ERR_NFIRS_INCOMPLETE, http: 422, condition: "Locking/amending a report without nfirs_property_use and nfirs_actions_taken present" }
  - { id: ERR_DUES_OVERDUE, http: 402, condition: "Assigning a member whose dues_balance_cents > 0" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "OCC: expected_<parent>_version does not match current parent version" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: Chief
    description: "Department chief/administrator. Manages membership lifecycle, stations, apparatus, equipment, maintenance, fundraising, and runs sweeps. Superset authority (hierarchical override) but does NOT act as a specific persisted member for ownership checks."
    identity: "opaque"
    exclusive_operations:
      - "POST /members — create member"
      - "POST /members/{id}/activate|leave|return|retire|expel — membership lifecycle"
      - "POST /stations — create station"
      - "POST /stations/{id}/apparatus — create apparatus"
      - "POST /apparatus/{id}/equipment — add equipment"
      - "POST /equipment/{id}/out-of-service|return-to-service"
      - "POST /apparatus/{id}/maintenance-windows and window start|complete|cancel"
      - "POST /certifications/{id}/revoke"
      - "POST /campaigns and campaign open|close; POST /donations/{id}/refund"
    shared_operations:
      - "POST /certifications/sweep, POST /duty-shifts/sweep (with Officer)"
      - "POST /members/{id}/dues-payments, /campaigns/{id}/donations (with Officer)"
      - "all GET reads"
      - "POST /_clock/set_current_utc (with Officer)"
  - name: Officer
    description: "Line/company officer. Owns certification management, training/points logging, scheduling, incidents & NFIRS, turnout tracking. Entity-backed by a Member (an officer is a member); X-User-ID is that member's id."
    identity: "entity_backed:Member"
    exclusive_operations:
      - "POST /certifications/{id}/issue|renew|suspend|reinstate — cert lifecycle"
      - "POST /members/{id}/point-adjustments — award/deduct points"
      - "POST /duty-shifts, publish, cancel; POST /duty-shifts/{id}/assignments; POST /duty-assignments/{id}/cancel"
      - "POST /incidents and enroute|arrive|clear; POST /incidents/{id}/report, report/lock, report/amend"
      - "POST /incidents/{id}/turnouts; POST /turnouts/{id}/void"
    shared_operations:
      - "POST /members/{id}/certifications, /members/{id}/training-records (with Chief)"
      - "POST /certifications/sweep, /duty-shifts/sweep, /_clock/set_current_utc, dues-payments, donations (with Chief)"
      - "all GET reads"
  - name: Member
    description: "Rank-and-file volunteer. Entity-backed by a Member; may check in to their OWN duty assignment and read their own summary/records. X-User-ID must equal the acted-upon resource's member_id for check-in."
    identity: "entity_backed:Member"
    exclusive_operations: []
    shared_operations:
      - "POST /duty-assignments/{id}/check-in — only for own assignment (also allowed to Officer)"
      - "all GET reads (own summary/certs/assignments)"
