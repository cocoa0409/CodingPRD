              as: FieldInspector
              as_user_id: "insp-1"
              captures: { empty_err: $.data.error_id }
            - call: "POST /eqp/inspections"
              payload: { project_id: "${pj_id}", window_start: "2026-08-05T09:00:00Z", window_end: "2026-08-05T09:20:00Z" }
              as: FieldInspector
              as_user_id: "insp-1"
              captures: { short_err: $.data.error_id }
            - call: "POST /eqp/inspections"
              payload: { project_id: "${pj_id}", window_start: "2026-08-05T09:00:00Z", window_end: "2026-08-05T14:00:00Z" }
              as: FieldInspector
              as_user_id: "insp-1"
              captures: { long_err: $.data.error_id }
            - call: "POST /eqp/inspections"
              payload: { project_id: "${pj_id}", window_start: "2026-07-20T09:00:00Z", window_end: "2026-07-20T11:00:00Z" }
              as: FieldInspector
              as_user_id: "insp-1"
              captures: { past_err: $.data.error_id }
            - call: "POST /eqp/inspections"
