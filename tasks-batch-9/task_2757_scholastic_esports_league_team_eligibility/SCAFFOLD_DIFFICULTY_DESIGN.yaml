        mode: c
        grounds:
          - calculations.showcase_scholarship_award
          - calculations.tiebreak_seed_order
          - entities.Student.fields.provisional_award_cents
          - entities.Student.fields.award_tier
          - entities.Student.fields.scholarship_award_cents
