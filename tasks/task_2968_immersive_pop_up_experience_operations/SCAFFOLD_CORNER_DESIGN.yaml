      - name: submitter_deciding_its_own_submission_is_rejected_on_every_hop
        claim_type: segregation_of_duties
        grounds:
          - validations[priority 90]
          - errors.ERR_SOD_APPROVAL_SAME_USER
          - state_machines.CreativeSubmission
          - endpoints[POST /creative-submissions/{submissionId}/decisions]
          - endpoints[POST /creative-submissions/{submissionId}/resubmit]
          - endpoints[POST /creative-submissions]
        distinguishing_aspect: |
          SoD-2 compares USER IDS, not roles, so it only ever bites when one human wears two hats -
          here a person who files submissions with the producer hat (X-User-ID rep-1, X-User-Role
          ExperienceProducer) and is also the licensor's named rep. Three things make it a corner.
          First the bind is PARTIAL: APPROVED and REJECTED are refused but CHANGES_REQUESTED is
          explicitly allowed, because sending your own work back for changes harms nobody. Second the
          bind SURVIVES the resubmit loop: resubmit does not rewrite submitted_by_user_id, so the
          403 comes back on round 1 exactly as on round 0 - an implementation that recomputed the
          submitter from the resubmitting caller would silently unlock the approval. Third the ONLY
          escape is the supersede path: a different producer filing the same (run_id, scope,
          asset_code) creates a row whose submitted_by_user_id is someone else, and that row can be
          approved. Together they mean a run whose sole producer account is the dual-hatted person
          can never reach CLEARED, which is the intended consequence and not a bug to route around.
        test_recipe:
          setup:
            - "One ACTIVE agreement whose licensor_rep_user_id is rep-1, one run, and one submission filed under X-User-ID rep-1 with the ExperienceProducer role."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: VenueOpsManager
              as_user_id: "vom-1"
            - call: "POST /venues"
              payload: { city_code: "NYC", site_name: "Pier 9 Shed", lease_start_date: "2026-08-01", lease_end_date: "2027-01-31", base_monthly_rent_cents: 4500000, buildout_allowance_cents: 1500000, buildout_cap_cents: 3000000, requested_occupancy_load: 180, egress_width_cm: 400, sprinklered: true }
              as: VenueOpsManager
              as_user_id: "vom-1"
              captures: { venue_id: $.data.id }
            - call: "POST /venues/${venue_id}/permit-submissions"
              payload: { package_note: "assembly occupancy package" }
              as: VenueOpsManager
              as_user_id: "vom-1"
            - call: "POST /venues/${venue_id}/permit-decisions"
              payload: { decision: "ISSUED", note: "occupancy 180 granted" }
              as: SafetyOfficer
              as_user_id: "officer-1"
            - call: "POST /venues/${venue_id}/activate-lease"
              payload: {}
              as: VenueOpsManager
              as_user_id: "vom-1"
            - call: "POST /build-kits"
              payload: { kit_code: "KIT-P9B-001", module_count: 20, initial_condition_score: 100.00, localization_language: "en-US" }
              as: VenueOpsManager
              as_user_id: "vom-1"
              captures: { kit_id: $.data.id }
            - call: "POST /license-agreements"
              payload: { licensor_name: "Halcyon Studios", ip_title: "Neon Atrium", licensor_rep_user_id: "rep-1", royalty_rate_bps: 1250, merch_royalty_rate_bps: 750, minimum_guarantee_cents: 192790, approval_scopes: ["CREATIVE_EXECUTION"], territory_city_codes: ["NYC"], term_start_date: "2026-08-01", term_end_date: "2026-12-31" }
              as: LicensingManager
              as_user_id: "lm-1"
              captures: { agreement_id: $.data.id }
            - call: "POST /license-agreements/${agreement_id}/activate"
              payload: {}
              as: LicensingManager
              as_user_id: "lm-1"
              captures: { agr_v: $.data.version }
            - call: "POST /experience-runs"
              payload: { venue_id: "${venue_id}", license_agreement_id: "${agreement_id}", build_kit_id: "${kit_id}", run_name: "Neon Atrium NYC", scheduled_open_date: "2026-08-10", scheduled_close_date: "2026-10-31", base_ticket_price_cents: 35833, timed_slot_minutes: 45, max_group_size: 12 }
              as: ExperienceProducer
              as_user_id: "producer-1"
              captures: { run_id: $.data.id }
            - call: "POST /creative-submissions"
              payload: { license_agreement_id: "${agreement_id}", run_id: "${run_id}", scope: "CREATIVE_EXECUTION", asset_code: "ATRIUM-SCRIPT-01", title: "Atrium beat sheet, filed by the dual-hatted rep", expected_agreement_version: "${agr_v}" }
              as: ExperienceProducer
              as_user_id: "rep-1"
              captures: { sub_own: $.data.id }
          trigger:
            - call: "POST /creative-submissions/${sub_own}/start-review"
              payload: {}
              as: LicensorRep
              as_user_id: "rep-1"
            - call: "POST /creative-submissions/${sub_own}/decisions"
              payload: { decision: "APPROVED", note: "looks fine to me" }
              as: LicensorRep
              as_user_id: "rep-1"
            - call: "POST /creative-submissions/${sub_own}/decisions"
              payload: { decision: "REJECTED", note: "on reflection, no" }
              as: LicensorRep
              as_user_id: "rep-1"
            - call: "POST /creative-submissions/${sub_own}/decisions"
              payload: { decision: "CHANGES_REQUESTED", note: "tighten the third beat" }
              as: LicensorRep
              as_user_id: "rep-1"
            - call: "POST /creative-submissions/${sub_own}/resubmit"
              payload: {}
              as: ExperienceProducer
              as_user_id: "rep-1"
            - call: "POST /creative-submissions/${sub_own}/start-review"
              payload: {}
              as: LicensorRep
              as_user_id: "rep-1"
            - call: "POST /creative-submissions/${sub_own}/decisions"
              payload: { decision: "APPROVED", note: "round two, still me" }
              as: LicensorRep
              as_user_id: "rep-1"
            - call: "GET /license-agreements/${agreement_id}"
              payload: {}
              as: LicensingManager
              as_user_id: "lm-1"
              captures: { agr_v2: $.data.version }
            - call: "POST /creative-submissions"
              payload: { license_agreement_id: "${agreement_id}", run_id: "${run_id}", scope: "CREATIVE_EXECUTION", asset_code: "ATRIUM-SCRIPT-01", title: "Atrium beat sheet, refiled by a different producer", expected_agreement_version: "${agr_v2}" }
              as: ExperienceProducer
              as_user_id: "producer-2"
              captures: { sub_other: $.data.id }
            - call: "POST /creative-submissions/${sub_other}/start-review"
              payload: {}
              as: LicensorRep
              as_user_id: "rep-1"
            - call: "POST /creative-submissions/${sub_other}/decisions"
              payload: { decision: "APPROVED", note: "clean" }
              as: LicensorRep
              as_user_id: "rep-1"
            - call: "GET /creative-submissions/${sub_own}"
              payload: {}
              as: ExperienceProducer
              as_user_id: "producer-1"
            - call: "GET /experience-runs/${run_id}"
              payload: {}
              as: ExperienceProducer
              as_user_id: "producer-1"
          assert:
            - "trigger 1 responds 200 with status IN_REVIEW: rep-1 IS the agreement's named rep, so the P90 rep-identity gate passes and the submitter bind is the only thing left that can stop it"
            - "trigger 2 responds 403 with error_id ERR_SOD_APPROVAL_SAME_USER, decided_at stays null, decided_by_user_id stays null, and status stays IN_REVIEW"
            - "trigger 3 responds 403 with error_id ERR_SOD_APPROVAL_SAME_USER: the bind is symmetric, so the submitter cannot reject its own work either - agreement.open_submission_count is still 1"
            - "trigger 4 responds 200 with status CHANGES_REQUESTED and change_note 'tighten the third beat': CHANGES_REQUESTED is deliberately OUTSIDE the SoD bind, and agreement.approved_submission_count and open_submission_count are both unchanged"
            - "trigger 5 responds 200 with status SUBMITTED, revision_round 1, change_note null, and submitted_by_user_id STILL rep-1"
            - "trigger 6 responds 200 with status IN_REVIEW"
            - "trigger 7 responds 403 with error_id ERR_SOD_APPROVAL_SAME_USER: the bind survived the resubmit loop, because resubmit never rewrites submitted_by_user_id"
            - "trigger 9 responds 201: the new row has submitted_by_user_id producer-2, and the rep-1 row is now SUPERSEDED with superseded_by_submission_id equal to the new row's id"
            - "trigger 11 responds 200 with status APPROVED and decided_by_user_id rep-1: the SAME rep may approve the SAME asset once a different person filed it, which is the only escape from the bind"
            - "trigger 12 shows the rep-1 row still SUPERSEDED with decided_at null: a superseded submission is never retroactively decided"
            - "trigger 13 shows the run's clearance_status is still UNCLEARED: the creative scope is now approved but no CLEARED PERFORMER, AMBASSADOR or TECHNICIAN exists, so approval alone does not clear a run"

      - name: suspension_lift_segregation_of_duties
        claim_type: segregation_of_duties
        excluded_because:
          difficulty_instance: run_parallel_dimensions_and_two_way_suspension_lift_branch
          rationale: |
            SoD-1 (the X-User-ID lifting a suspension must differ from the finalized_by_user_id of the
            inspection that imposed it) is already driven end to end in §1.8: that instance finalizes a
            FAIL inspection as officer-1, has officer-1 attempt the lift and asserts 403
            ERR_SOD_SUSPENSION_LIFT_SAME_USER, then has officer-2 succeed, so a §1.9 copy would only
            re-run the same two calls with the same two user ids.

      - name: extension_grant_segregation_of_duties
        claim_type: segregation_of_duties
        excluded_because:
          difficulty_instance: extension_segregation_of_duties_masks_the_demand_floor
          rationale: |
            SoD-3 (the X-User-ID granting an extension must differ from the run's created_by_user_id)
            is the whole point of that §1.8 instance, which additionally proves the ordering that a
            §1.9 instance could not add to: the 403 ERR_SOD_EXTENSION_SAME_USER fires even when the
            demand floor and the lease budget would BOTH have refused the same request, so the caller
            never learns which limit it was really up against.

  # ===========================================================================
  # 8. CROSS-CUTTING CONCERNS (claim-extraction guide, cross-cutting table)
  #    soft_delete, multi_tenancy, bulk_operations and conditional_feature_flags
  #    have no surface in this API: nothing is ever deleted (the closest thing,
  #    GuestAccount RESTRICTED, is a strike consequence with its own reinstate
  #    transition, not a delete marker), there is no tenant dimension, no endpoint
  #    accepts an array of subjects, and no endpoint's behaviour is switched by a
  #    flag. They are therefore not instantiated.
  # ===========================================================================
  - section: cross_cutting
    source_table: "SCAFFOLD.yaml §1.2.1 concurrency_rules (2 rules) + complexity_profile.layers"
    instances:

      - name: optimistic_concurrency_guards_both_supersede_paths
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules.statement-create-stale-run
          - concurrency_rules.submission-create-stale-agreement
          - validations[priority 50]
          - validations[priority 60]
          - errors.ERR_RUN_VERSION_CONFLICT
          - errors.ERR_AGREEMENT_VERSION_CONFLICT
        distinguishing_aspect: |
          Both OCC guards sit on a PARENT's version while the write creates a CHILD, which is the
          shape most implementations get wrong: they either guard the child (which does not exist yet)
          or they guard nothing because no state precondition blocks a second create. The version that
          goes stale is moreover advanced by the caller's OWN previous write - the first statement
          create bumps run.royalty_statement_count and therefore run.version - so a client that
          re-sends the same expected_run_version it just used successfully is refused, and must re-read
          the parent between supersedes. The guard is also positioned: P50 body-FK resolution runs
          BEFORE it, so a stale version against a run id that does not exist is 404 and not 412, and
          P70/P150 state checks run AFTER it, so the ISSUED-statement rule never masks the conflict.
        test_recipe:
          setup:
            - "One ACTIVE agreement, one run, and one SUBMITTED creative submission filed against the agreement version returned by activation."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: VenueOpsManager
              as_user_id: "vom-1"
            - call: "POST /venues"
              payload: { city_code: "NYC", site_name: "Pier 9 Shed", lease_start_date: "2026-08-01", lease_end_date: "2027-01-31", base_monthly_rent_cents: 4500000, buildout_allowance_cents: 1500000, buildout_cap_cents: 3000000, requested_occupancy_load: 180, egress_width_cm: 400, sprinklered: true }
              as: VenueOpsManager
              as_user_id: "vom-1"
              captures: { venue_id: $.data.id }
            - call: "POST /venues/${venue_id}/permit-submissions"
              payload: { package_note: "assembly occupancy package" }
              as: VenueOpsManager
              as_user_id: "vom-1"
            - call: "POST /venues/${venue_id}/permit-decisions"
              payload: { decision: "ISSUED", note: "occupancy 180 granted" }
              as: SafetyOfficer
              as_user_id: "officer-1"
            - call: "POST /venues/${venue_id}/activate-lease"
              payload: {}
              as: VenueOpsManager
              as_user_id: "vom-1"
            - call: "POST /build-kits"
              payload: { kit_code: "KIT-P9B-001", module_count: 20, initial_condition_score: 100.00, localization_language: "en-US" }
              as: VenueOpsManager
              as_user_id: "vom-1"
              captures: { kit_id: $.data.id }
            - call: "POST /license-agreements"
              payload: { licensor_name: "Halcyon Studios", ip_title: "Neon Atrium", licensor_rep_user_id: "rep-1", royalty_rate_bps: 1250, merch_royalty_rate_bps: 750, minimum_guarantee_cents: 192790, approval_scopes: ["CREATIVE_EXECUTION"], territory_city_codes: ["NYC"], term_start_date: "2026-08-01", term_end_date: "2026-12-31" }
              as: LicensingManager
              as_user_id: "lm-1"
              captures: { agreement_id: $.data.id }
            - call: "POST /license-agreements/${agreement_id}/activate"
              payload: {}
              as: LicensingManager
              as_user_id: "lm-1"
              captures: { agr_v1: $.data.version }
            - call: "POST /experience-runs"
              payload: { venue_id: "${venue_id}", license_agreement_id: "${agreement_id}", build_kit_id: "${kit_id}", run_name: "Neon Atrium NYC", scheduled_open_date: "2026-08-10", scheduled_close_date: "2026-10-31", base_ticket_price_cents: 35833, timed_slot_minutes: 45, max_group_size: 12 }
              as: ExperienceProducer
              as_user_id: "producer-1"
              captures: { run_id: $.data.id }
            - call: "POST /creative-submissions"
              payload: { license_agreement_id: "${agreement_id}", run_id: "${run_id}", scope: "CREATIVE_EXECUTION", asset_code: "ATRIUM-SCRIPT-01", title: "Atrium beat sheet r0", expected_agreement_version: "${agr_v1}" }
              as: ExperienceProducer
              as_user_id: "producer-1"
              captures: { sub_1: $.data.id }
          trigger:
            - call: "GET /experience-runs/${run_id}"
              payload: {}
              as: LicensingManager
              as_user_id: "lm-1"
              captures: { run_v1: $.data.version }
            - call: "POST /royalty-statements"
              payload: { run_id: "${run_id}", period_start_date: "2026-08-01", period_end_date: "2026-08-31", expected_run_version: "${run_v1}" }
              as: LicensingManager
              as_user_id: "lm-1"
              captures: { stmt_1: $.data.id }
            - call: "POST /royalty-statements"
              payload: { run_id: "${run_id}", period_start_date: "2026-08-01", period_end_date: "2026-08-31", expected_run_version: "${run_v1}" }
              as: LicensingManager
              as_user_id: "lm-1"
            - call: "POST /royalty-statements"
              payload: { run_id: "eeeeeeee-0000-4000-8000-00000000dead", period_start_date: "2026-08-01", period_end_date: "2026-08-31", expected_run_version: "${run_v1}" }
              as: LicensingManager
              as_user_id: "lm-1"
            - call: "GET /experience-runs/${run_id}"
              payload: {}
              as: LicensingManager
              as_user_id: "lm-1"
              captures: { run_v2: $.data.version }
            - call: "POST /royalty-statements"
              payload: { run_id: "${run_id}", period_start_date: "2026-08-01", period_end_date: "2026-08-31", expected_run_version: "${run_v2}" }
              as: LicensingManager
              as_user_id: "lm-1"
              captures: { stmt_2: $.data.id }
            - call: "POST /creative-submissions"
              payload: { license_agreement_id: "${agreement_id}", run_id: "${run_id}", scope: "CREATIVE_EXECUTION", asset_code: "ATRIUM-SCRIPT-01", title: "Atrium beat sheet r1 on a stale agreement view", expected_agreement_version: "${agr_v1}" }
              as: ExperienceProducer
              as_user_id: "producer-1"
            - call: "GET /license-agreements/${agreement_id}"
              payload: {}
              as: LicensingManager
              as_user_id: "lm-1"
              captures: { agr_v2: $.data.version }
            - call: "POST /creative-submissions"
              payload: { license_agreement_id: "${agreement_id}", run_id: "${run_id}", scope: "CREATIVE_EXECUTION", asset_code: "ATRIUM-SCRIPT-01", title: "Atrium beat sheet r1 on a fresh agreement view", expected_agreement_version: "${agr_v2}" }
              as: ExperienceProducer
              as_user_id: "producer-1"
              captures: { sub_2: $.data.id }
            - call: "GET /creative-submissions/${sub_1}"
              payload: {}
              as: ExperienceProducer
              as_user_id: "producer-1"
            - call: "GET /royalty-statements/${stmt_1}"
              payload: {}
              as: LicensingManager
              as_user_id: "lm-1"
          assert:
            - "trigger 2 responds 201 with status DRAFT: the run version the client read one call earlier is accepted"
            - "trigger 3 responds 412 with error_id ERR_RUN_VERSION_CONFLICT: the SAME expected_run_version that just worked is now stale, because trigger 2 incremented run.version through royalty_statement_count - the client's own successful write is what invalidated its view"
            - "trigger 3 changed nothing: stmt_1 is still DRAFT with superseded_by_statement_id null, and run.royalty_statement_count is still 1"
            - "trigger 4 responds 404 with error_id ERR_RUN_NOT_FOUND and NOT 412: P50 body-FK resolution outranks the P60 OCC guard, even though the version carried is also stale"
            - "trigger 5 returns run_v2 == run_v1 + 1: exactly one version step per accepted write, and reading does not consume one"
            - "trigger 6 responds 201: re-reading the parent is the whole remedy, and this create legitimately supersedes stmt_1"
            - "trigger 11 shows stmt_1 SUPERSEDED with superseded_by_statement_id equal to stmt_2 and its own version incremented by 1"
            - "trigger 7 responds 412 with error_id ERR_AGREEMENT_VERSION_CONFLICT: the second OCC guard watches a DIFFERENT parent entity, and agr_v1 went stale when the setup's own submission create bumped the agreement's version"
            - "trigger 8 returns agr_v2 == agr_v1 + 1"
            - "trigger 9 responds 201: the fresh agreement version is accepted"
            - "trigger 10 shows sub_1 SUPERSEDED with superseded_by_submission_id equal to sub_2 - proving trigger 7 did NOT supersede it, so a rejected OCC write leaves no trace at all"

      - name: close_and_suspension_cascades
        claim_type: cascading_side_effects
        excluded_because:
          difficulty_instance: close_decision_cascades_into_kit_decay_refurb_and_relocalisation
          rationale: |
            The deepest cascade in the API - one CLOSE hop rewriting the kit's condition score, reuse
            counter, transit status and localization, releasing every staff member and settling the
            order ledger - is already asserted field by field in §1.8, together with the ordering
            between the hops. A §1.9 cascading_side_effects instance would restate it.

      - name: provisional_versus_final_royalty
        claim_type: dual_variant_calculation
        excluded_because:
          difficulty_instance: royalty_provisional_versus_final_on_identical_orders
          rationale: |
            The two-variant calculation (provisional accrual at create versus final accrual with
            truedown and minimum-guarantee proration at finalize) is the subject of a §1.8 instance
            that drives both variants over one period and asserts the divergence to the cent.

      - name: strike_and_demand_thresholds
        claim_type: rate_threshold_triggers
        excluded_because:
          difficulty_instance: demand_index_extension_floor_at_exactly_seventy
          rationale: |
            The rate/threshold layer is instantiated in §1.8 at the boundary value on both sides: that
            instance parks the demand index at exactly EXTENSION_DEMAND_MIN and one hundredth below it,
            and order_creation_blocked_by_the_guests_no_show_restriction covers the other threshold in
            the domain (no-show strikes crossing NO_SHOW_STRIKE_LIMIT into RESTRICTED). Boundary
            behaviour is the only interesting part of a threshold trigger, so there is nothing left for
            a §1.9 instance to add.

  # ===========================================================================
  # 9. CONSISTENCY MODEL (§1.0 complexity_profile.consistency_model == immediate)
  #    There is no eventual-consistency or saga surface anywhere in this API: no
  #    endpoint returns 202, nothing is queued, and every derived field named in
  #    §1.1 is recomputed inside the request that changes its inputs. The single
  #    instance below is therefore the whole claim.
  # ===========================================================================
  - section: consistency_model
    source_table: "SCAFFOLD.yaml §1.0 complexity_profile.consistency_model"
    instances:

      - name: every_write_is_visible_to_the_very_next_read
        claim_type: immediate
        grounds:
          - complexity_profile.consistency_model
          - endpoints[POST /ticket-orders]
          - endpoints[POST /ticket-orders/{orderId}/confirm]
          - endpoints[GET /timed-entry-slots/{slotId}]
          - endpoints[GET /experience-runs/{runId}/demand-index]
          - endpoints[POST /staff-members]
        distinguishing_aspect: |
          Immediate consistency has to be proven where the write and the read touch DIFFERENT rows:
          an order create mutates the slot's capacity ledger, and an order confirm moves seats from
          held to sold on that same slot while the run's demand index is computed from both. The
          claim is that the mutating response ALREADY carries the post-write state and that the next
          read of the neighbouring row is already current - no 202, no retry loop, no read-your-writes
          window. Reading twice must also return the same value, which rules out a derived field that
          is recomputed differently on each read.
        test_recipe:
          setup:
            - "One run at an ACTIVE-lease venue with one released 20-seat STANDARD slot on 2026-08-25 and one ACTIVE VISITOR guest account; clock at 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: VenueOpsManager
              as_user_id: "vom-1"
            - call: "POST /venues"
              payload: { city_code: "NYC", site_name: "Pier 9 Shed", lease_start_date: "2026-08-01", lease_end_date: "2027-01-31", base_monthly_rent_cents: 4500000, buildout_allowance_cents: 1500000, buildout_cap_cents: 3000000, requested_occupancy_load: 180, egress_width_cm: 400, sprinklered: true }
              as: VenueOpsManager
              as_user_id: "vom-1"
              captures: { venue_id: $.data.id }
            - call: "POST /venues/${venue_id}/permit-submissions"
              payload: { package_note: "assembly occupancy package" }
              as: VenueOpsManager
              as_user_id: "vom-1"
            - call: "POST /venues/${venue_id}/permit-decisions"
              payload: { decision: "ISSUED", note: "occupancy 180 granted" }
              as: SafetyOfficer
              as_user_id: "officer-1"
            - call: "POST /venues/${venue_id}/activate-lease"
              payload: {}
              as: VenueOpsManager
              as_user_id: "vom-1"
            - call: "POST /build-kits"
              payload: { kit_code: "KIT-P9B-001", module_count: 20, initial_condition_score: 100.00, localization_language: "en-US" }
              as: VenueOpsManager
              as_user_id: "vom-1"
              captures: { kit_id: $.data.id }
            - call: "POST /license-agreements"
              payload: { licensor_name: "Halcyon Studios", ip_title: "Neon Atrium", licensor_rep_user_id: "rep-1", royalty_rate_bps: 1250, merch_royalty_rate_bps: 750, minimum_guarantee_cents: 192790, approval_scopes: ["CREATIVE_EXECUTION"], territory_city_codes: ["NYC"], term_start_date: "2026-08-01", term_end_date: "2026-12-31" }
              as: LicensingManager
              as_user_id: "lm-1"
              captures: { agreement_id: $.data.id }
            - call: "POST /license-agreements/${agreement_id}/activate"
              payload: {}
              as: LicensingManager
              as_user_id: "lm-1"
            - call: "POST /experience-runs"
              payload: { venue_id: "${venue_id}", license_agreement_id: "${agreement_id}", build_kit_id: "${kit_id}", run_name: "Neon Atrium NYC", scheduled_open_date: "2026-08-10", scheduled_close_date: "2026-10-31", base_ticket_price_cents: 35833, timed_slot_minutes: 45, max_group_size: 12 }
              as: ExperienceProducer
              as_user_id: "producer-1"
              captures: { run_id: $.data.id }
            - call: "POST /themed-rooms"
              payload: { run_id: "${run_id}", room_sequence: 1, name: "Vestibule", room_occupancy_cap: 40, target_dwell_minutes: 15, min_dwell_minutes: 5, sensory_intensity_level: 2, has_quiet_bypass: true, wheelchair_accessible: true }
              as: ExperienceProducer
              as_user_id: "producer-1"
            - call: "POST /timed-entry-slots"
              payload: { run_id: "${run_id}", slot_start_utc: "2026-08-25T14:00:00Z", slot_end_utc: "2026-08-25T14:45:00Z", pricing_tier: "STANDARD", base_capacity: 20, wheelchair_positions: 2 }
              as: ExperienceProducer
              as_user_id: "producer-1"
              captures: { slot_id: $.data.id }
            - call: "POST /timed-entry-slots/${slot_id}/release"
              payload: {}
              as: ExperienceProducer
              as_user_id: "producer-1"
            - call: "POST /guest-accounts"
              payload: { email: "mina@example.com", display_name: "Mina Ortega", loyalty_tier: "VISITOR" }
              as: GuestServicesAgent
              as_user_id: "gsa-1"
              captures: { guest_id: $.data.id }
          trigger:
            - call: "POST /ticket-orders"
              payload: { slot_id: "${slot_id}", guest_account_id: "${guest_id}", order_type: "SINGLE", party_size: 3 }
              as: Guest
              as_user_id: "${guest_id}"
              captures: { order_id: $.data.id }
            - call: "GET /timed-entry-slots/${slot_id}"
              payload: {}
              as: Guest
              as_user_id: "${guest_id}"
            - call: "POST /ticket-orders/${order_id}/confirm"
              payload: {}
              as: GuestServicesAgent
              as_user_id: "gsa-1"
            - call: "GET /ticket-orders/${order_id}"
              payload: {}
              as: GuestServicesAgent
              as_user_id: "gsa-1"
            - call: "GET /timed-entry-slots/${slot_id}"
              payload: {}
              as: ExperienceProducer
              as_user_id: "producer-1"
            - call: "GET /experience-runs/${run_id}/demand-index"
              payload: {}
              as: ExperienceProducer
              as_user_id: "producer-1"
            - call: "GET /experience-runs/${run_id}/demand-index"
              payload: {}
              as: LicensingManager
              as_user_id: "lm-1"
            - call: "POST /staff-members"
              payload: { run_id: "${run_id}", full_name: "Ada Reyes", staff_role: "PERFORMER", certifications: ["SCRIPTED_INTERACTION"] }
              as: ExperienceProducer
              as_user_id: "producer-1"
              captures: { staff_id: $.data.id }
            - call: "GET /staff-members"
              payload: { run_id: "${run_id}" }
              as: SafetyOfficer
              as_user_id: "officer-1"
          assert:
            - "trigger 1 responds 201 and its OWN body already carries the priced result: unit_price_cents 35833 (STANDARD tier 1.0, lead 24 days so the 1.0 band), per_guest_after_loyalty_cents 35833, gross_amount_cents 107499, discount_cents 0 and net_amount_cents 107499 - no second call is needed to learn the price"
            - "trigger 2 responds 200 with held_capacity 3, sold_capacity 0 and available_capacity 17: the NEIGHBOURING row's ledger is already current in the very next read, so the capacity write is not deferred"
            - "trigger 3 responds 200 and its own body carries status CONFIRMED and net_collected_cents 107499"
            - "trigger 4 returns a body field-for-field identical to the trigger 3 response except for nothing at all: a re-read adds no information, which is what read-your-writes means here"
            - "trigger 5 responds 200 with held_capacity 0, sold_capacity 3, available_capacity 17 and status still OPEN: the confirm moved the seats between buckets in the same request, and the slot version has advanced by exactly 2 since release (one per order write)"
            - "trigger 6 returns a demand index that already counts the order confirmed by trigger 3, and the run's stored demand_index field matches the value the endpoint returns"
            - "trigger 7 returns exactly the same value as trigger 6 from a different role: the derived aggregate is a pure function of stored state, not a counter that advances per read"
            - "trigger 9 responds 200 with total_count 1 including the member created by trigger 8, whose readiness_score_preflight and readiness_score_audit are already 0.00 and cert_coverage_pct 0.00 in trigger 8's own response"
