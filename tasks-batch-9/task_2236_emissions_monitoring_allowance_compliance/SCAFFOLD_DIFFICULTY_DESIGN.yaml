            - "QuarterlyReport.${q2_id}.operating_hour_count == 3 and QuarterlyReport.${q2_id}.measured_hour_count == 3 and QuarterlyReport.${q2_id}.substituted_hour_count == 0"
            - "QuarterlyReport.${q2_id}.monitor_data_availability_pct == 100.0"
            - "QuarterlyReport.${q2_id}.status == VALIDATED"

      - name: combinatorial_substitution_tier_uses_pinned_availability_evaluation_order
        grounds:
          - calculations.missing_data_substitution
          - calculations.monitor_data_availability_pct
          - entities.OperatingHour.fields.substitution_method
          - entities.OperatingHour.fields.monitor_data_availability_pct_at_substitution
          - state_machines.MonitoringSystem.CERTIFIED_to_OUT_OF_CONTROL
        distinguishing_aspect: |
          Mode (c) — CIRCULAR DEPENDENCY WITH A PINNED EVALUATION ORDER. The
          substitution tier reads monitor_data_availability_pct while
          availability itself depends on which hours have been substituted;
          the pinned order (availability excludes the target hour and every
          later hour, hours processed hour_begin_utc ASC, each tier frozen
          before the next hour) forces hour 01:00 into T1_90TH_PERCENTILE at
          availability 100.0 and hour 02:00 into T4_MAX_POTENTIAL_CONCENTRATION
          at availability 50.0 — a naive whole-quarter availability would put
          both hours in the same tier.
        test_recipe:
          setup:
            - "logical clock at 2026-04-02T00:00:00Z"
            - "unit U1 with a CERTIFIED, CAL_CURRENT SO2 CEM (span 400)"
            - "a DRAFT 2026 Q2 report with three identical MEASURED CEMS hours at 00:00, 01:00, 02:00 (flow 8000000, co2 12.5, so2 220 ppm, op 1.0)"
            - "the SO2 CEM is then declared OUT_OF_CONTROL effective 2026-04-01T01:00:00Z, flipping hours 01:00 and 02:00 to UNAVAILABLE"
            - "the SO2 CEM is re-CERTIFIED so the substitution endpoint may run"
          setup_api_calls:
            - call: "POST /emissions/_clock/set_current_utc"
              payload: { to_iso8601: "2026-04-02T00:00:00Z" }
              as: RegulatoryReviewer
            - call: "POST /emissions/facilities"
              payload: { name: "Kestrel Generating Station", orispl_code: "7101", state_code: "OH", operator_org: "op_alpha", programs: ["ARP_SO2"], true_up_deadline_utc: "2027-03-01T00:00:00Z" }
              as: RegulatoryReviewer
              captures: { fac_id: $.data.id }
            - call: "POST /emissions/facilities/${fac_id}/units"
              payload: { unit_identifier: "U1", primary_fuel: "COAL", nameplate_capacity_mw: 600, max_rated_heat_input_mmbtu_hr: 6000, control_device: "FGD" }
              as: RegulatoryReviewer
              captures: { unit_id: $.data.id }
            - call: "POST /emissions/units/${unit_id}/monitoring-systems"
              payload: { parameter: "SO2", system_type: "CEM", span_value: 400.0, calibration_error_spec_pct: 2.5 }
              as: QAAnalyst
              captures: { cem_id: $.data.id, cem_v1: $.data.version }
            - call: "POST /emissions/monitoring-systems/${cem_id}/daily-calibrations"
              payload: { expected_monitoring_system_version: "${cem_v1}", calibration_utc: "2026-04-01T00:00:00Z", zero_reference_value: 0.0, zero_measured_value: 0.0, span_reference_value: 360.0, span_measured_value: 368.0 }
              as: QAAnalyst
            - call: "POST /emissions/monitoring-systems/${cem_id}/qa-status"
              payload: { action: "CERTIFY" }
              as: QAAnalyst
            - call: "POST /emissions/units/${unit_id}/quarterly-reports"
              payload: { year: 2026, quarter: 2 }
              as: EmissionsReportPreparer
              as_user_id: "prep_1"
              captures: { q2_id: $.data.id, q2_v1: $.data.version }
            - call: "POST /emissions/units/${unit_id}/operating-hours/bulk"
              payload: { expected_quarterly_report_version: "${q2_v1}", hours: [{ hour_begin_utc: "2026-04-01T00:00:00Z", op_time_fraction: 1.0, heat_input_method: "CEMS_FLOW_CO2", flow_scfh: 8000000.0, co2_conc_pct: 12.5, so2_conc_ppm: 220.0, nox_rate_lb_mmbtu: 0.180 }, { hour_begin_utc: "2026-04-01T01:00:00Z", op_time_fraction: 1.0, heat_input_method: "CEMS_FLOW_CO2", flow_scfh: 8000000.0, co2_conc_pct: 12.5, so2_conc_ppm: 220.0, nox_rate_lb_mmbtu: 0.180 }, { hour_begin_utc: "2026-04-01T02:00:00Z", op_time_fraction: 1.0, heat_input_method: "CEMS_FLOW_CO2", flow_scfh: 8000000.0, co2_conc_pct: 12.5, so2_conc_ppm: 220.0, nox_rate_lb_mmbtu: 0.180 }] }
              as: EmissionsReportPreparer
              as_user_id: "prep_1"
              captures: { h1_id: "$.data[0].id", h2_id: "$.data[1].id", h3_id: "$.data[2].id" }
            - call: "POST /emissions/monitoring-systems/${cem_id}/qa-status"
              payload: { action: "DECLARE_OUT_OF_CONTROL", effective_utc: "2026-04-01T01:00:00Z", reason: "quarterly linearity check aborted" }
              as: QAAnalyst
            - call: "POST /emissions/monitoring-systems/${cem_id}/qa-status"
              payload: { action: "CERTIFY" }
              as: QAAnalyst
          trigger:
            - call: "POST /emissions/units/${unit_id}/missing-data/substitutions"
              payload: { from_hour_utc: "2026-04-01T01:00:00Z", to_hour_utc: "2026-04-01T03:00:00Z" }
              as: EmissionsReportPreparer
              as_user_id: "prep_1"
          assert:
            - "OperatingHour.${h1_id}.data_quality == MEASURED and OperatingHour.${h1_id}.so2_mass_lbs == 292.2"
            - "OperatingHour.${h2_id}.data_quality == SUBSTITUTED"
            - "OperatingHour.${h2_id}.monitor_data_availability_pct_at_substitution == 100.0"
            - "OperatingHour.${h2_id}.substitution_method == T1_90TH_PERCENTILE"
            - "OperatingHour.${h2_id}.substituted_so2_conc_ppm == 220.0"
            - "OperatingHour.${h2_id}.so2_mass_lbs == 292.2"
            - "OperatingHour.${h3_id}.data_quality == SUBSTITUTED"
            - "OperatingHour.${h3_id}.monitor_data_availability_pct_at_substitution == 50.0"
            - "OperatingHour.${h3_id}.substitution_method == T4_MAX_POTENTIAL_CONCENTRATION"
            - "OperatingHour.${h3_id}.substituted_so2_conc_ppm == 400.0"
            - "OperatingHour.${h3_id}.so2_mass_lbs == 531.2"
            - "the two hours land in DIFFERENT tiers even though both were UNAVAILABLE in the same call"
            - "QuarterlyReport.${q2_id}.total_so2_lbs == 1115.6"
            - "QuarterlyReport.${q2_id}.substituted_hour_count == 2 and QuarterlyReport.${q2_id}.measured_hour_count == 1"
            - "QuarterlyReport.${q2_id}.monitor_data_availability_pct == 33.3"
            - "QuarterlyReport.${q2_id}.total_heat_input_mmbtu == 1666.668"

      - name: combinatorial_true_up_obligation_nests_ceiling_over_rounded_ton_sum
        grounds:
          - calculations.allowance_true_up_waterfall
          - calculations.excess_event_penalty_debit
          - calculations.quarterly_report_totals
          - state_machines.AllowanceAccount.OPEN_to_TRUE_UP_LOCKED
          - state_machines.ExcessEmissionEvent.UNDER_REVIEW_to_ENFORCEABLE
          - entities.AllowanceAccount.fields.obligation_tons
        distinguishing_aspect: |
          Mode (a) — FIVE INPUTS COMBINED NON-LINEARLY. obligation_tons folds
          ceil(round_half_up(sum of accepted total_so2_tons, 3)) = ceil(29.880)
          = 30 together with the ceil-based penalty debit of an ENFORCEABLE
          excess event (ceil(1.6327) = 2) and then drains two holdings buckets
          through nested min() calls, so obligation 32 -> surrendered 25 ->
          shortfall 7 -> penalty 14 cannot be reproduced by any linear
          combination of the same five inputs.
        test_recipe:
          setup:
            - "logical clock starts at 2026-04-02T00:00:00Z and is advanced to 2027-03-01T00:00:00Z (== Facility.true_up_deadline_utc) before the true-up"
