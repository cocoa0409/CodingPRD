  - rule_id: compensating_invariant
    instances:

      - name: cold_pack_release_restores_the_sites_committed_load
        grounds:
          - calculations.cold_pack_reserved_units
          - entities.PharmacySite.fields.cold_pack_committed_units
          - validations[priority=5]
          - state_machines.Order.PROCESSING_to_CANCELED
        distinguishing_aspect: "The conserved quantity is cold-pack capacity at a site: committing on ship and releasing on cancel must return the site's committed load to its exact pre-ship value, so a cascade that leaves the site holding phantom units fails the invariant."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. One cold-pack item due on the logical date; the ACTIVE CA site holds cold_pack_capacity_units 300 and no committed load."
