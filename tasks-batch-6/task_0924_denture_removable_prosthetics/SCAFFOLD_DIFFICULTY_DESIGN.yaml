      - name: coverage_benefit_conserved_across_payment_and_claim_reversal
        grounds:
          - conservation_invariants.coverage_benefit_conservation
          - state_machines.Claim.SUBMITTED_PRIMARY_to_PRIMARY_PAID
          - state_machines.Claim.CLOSED_to_REVERSED
          - entities.Coverage.fields.benefit_remaining
        distinguishing_aspect: |
          Conserved quantity: a MONEY benefit pool, a different kind of quantity from the
          visit COUNT. benefit_used_ytd plus benefit_remaining equals the
          annual_maximum_amount 1500.00 before the payment (0.00 + 1500.00), after it
          (600.00 + 900.00) and after the reversal (0.00 + 1500.00).
        test_recipe:
          setup:
            - "Logical clock at 2026-05-01T00:00:00Z."
            - "One patient with exactly one PRIMARY coverage (annual max 1500.00, coinsurance 0.50, effective 2024-01-01) and NO secondary coverage, so the claim auto-closes after the primary leg."
            - "One FLEXIBLE_PARTIAL case with one MANDIBULAR arch past complete-exam (fee_schedule_total 1200.00) and one DRAFT Claim."
          setup_api_calls:
            - call: "POST /prosthetics/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: PlatformAdmin
              as_user_id: "admin-root"
            - call: "POST /prosthetics/patients"
              payload: { full_name: "Viggo Amankwah", date_of_birth: "1957-07-07", phone: "555-0444" }
