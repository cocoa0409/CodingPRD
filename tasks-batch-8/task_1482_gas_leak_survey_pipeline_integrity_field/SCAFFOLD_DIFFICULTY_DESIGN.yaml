  # =============================================================================
  # Rule 8: resource_temporal_overlap — different interval semantics on
  # different resources.
  # =============================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: route_start_outside_scheduled_window_rejected
        grounds:
          - validations[priority=8]
          - entities.SurveyRoute.fields.scheduled_window_start
          - entities.SurveyRoute.fields.scheduled_window_end
        distinguishing_aspect: |
          Resource: SurveyRoute. Interval semantics: HALF-OPEN [window_start,
          window_end). A start attempt at exactly window_end is OUTSIDE (>=
          window_end fails). At exactly window_start it's INSIDE. Adjacency:
          another route's window_end == this route's window_start is allowed
          (they don't overlap due to half-open semantics).
        test_recipe:
          setup:
            - "SurveyRoute R-HO1 window [2026-08-01T00:00:00Z, 2026-08-31T23:59:59Z), status=DISPATCHED"
          setup_api_calls:
