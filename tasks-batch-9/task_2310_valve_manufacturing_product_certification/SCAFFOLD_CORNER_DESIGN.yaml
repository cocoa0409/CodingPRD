            - "Component.${c_id}.status == SCRAPPED"
            - "HeatLot.${l_id}.qty_scrapped_kg == 60.250"
            - "HeatLot.${l_id}.qty_available_kg == 439.750"

      - name: corner_second_qualify_on_qualified_row_rejected
        claim_type: Idempotency
        grounds:
