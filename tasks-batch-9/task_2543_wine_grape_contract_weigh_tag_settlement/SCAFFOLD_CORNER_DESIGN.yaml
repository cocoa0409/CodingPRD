            - call: "POST /grower-relations/sampling-crews"
              payload: { crew_code: "SC-1", region_code: "NAPA-NORTH", max_concurrent_visits: 2 }
              as: HarvestCoordinator
              captures: { crew_id: $.data.id }
            - call: "POST /grower-relations/grape-contracts"
              payload: { grower_id: "${grower_id}", quality_spec_id: "${spec_id}", contract_code: "GC-SOD", contract_basis: "TONNAGE", base_price_per_ton_cents: 450000, over_delivery_policy: "ACCEPT_AT_CONTRACT", term_start_vintage: 2026, term_end_vintage: 2027, committed_tons: 40.000, installment_plan: [{ installment_no: 1, pct_of_settlement: 100.0, due_offset_days: 30, lien_protected: true }] }
              as: GrowerRelationsManager
              captures: { contract_id: $.data.id }
            - call: "POST /grower-relations/contract-block-allocations"
              payload: { contract_id: "${contract_id}", block_id: "${block_id}" }
              as: GrowerRelationsManager
            - call: "POST /grower-relations/grape-contracts/${contract_id}/offer"
              payload: {}
              as: GrowerRelationsManager
            - call: "POST /grower-relations/grape-contracts/${contract_id}/accept"
              payload: {}
              as: Grower
            - call: "POST /grower-relations/sampling-visits"
              payload: { contract_id: "${contract_id}", block_id: "${block_id}", crew_id: "${crew_id}", window_start: "2026-08-20T09:00:00Z", window_end: "2026-08-20T11:00:00Z" }
              as: HarvestCoordinator
              captures: { visit_id: $.data.id }
            - call: "POST /grower-relations/sampling-visits/${visit_id}/record"
              payload: { measured_brix: 24.5, measured_ta_gl: 6.5, measured_ph: 3.40, measured_rot_pct: 1.0 }
              as: HarvestCoordinator
            - call: "POST /grower-relations/pick-calls"
              payload: { contract_id: "${contract_id}", block_id: "${block_id}", target_pick_at: "2026-08-25T14:00:00Z", estimated_tons: 20.000 }
              as: HarvestCoordinator
              captures: { pick_call_id: $.data.id }
            - call: "POST /grower-relations/pick-calls/${pick_call_id}/acknowledge"
              payload: {}
              as: Grower
            - call: "POST /grower-relations/delivery-appointments"
              payload: { pick_call_id: "${pick_call_id}", lane_id: "${lane_id}", window_start: "2026-08-25T14:00:00Z", window_end: "2026-08-25T16:00:00Z", planned_tons: 20.000 }
              as: HarvestCoordinator
              captures: { appointment_id: $.data.id, appt_version: $.data.version }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-25T14:30:00Z" }
              as: GrowerRelationsManager
            - call: "POST /grower-relations/weigh-tags"
              payload: { appointment_id: "${appointment_id}", block_id: "${block_id}", gross_weight_lbs: 57000, expected_appointment_version: "${appt_version}" }
              as: ScaleOperator
              captures: { tag_id: $.data.id }
            - call: "POST /grower-relations/weigh-tags/${tag_id}/tare"
              payload: { tare_weight_lbs: 17000 }
              as: ScaleOperator
              captures: { tag_version: $.data.version }
          trigger:
            - call: "GET /grower-relations/weigh-tags/${tag_id}"
              as: GrowerRelationsManager
            - call: "POST /grower-relations/weigh-tags/${tag_id}/grades"
              payload: { brix: 26.0, ta_gl: 6.5, ph: 3.40, rot_pct: 0.5, mog_pct: 0.2, expected_weigh_tag_version: "${tag_version}" }
              as: QualityLabTech
              captures: { e1: $.data.error_id }
            - call: "POST /grower-relations/weigh-tags/${tag_id}/grades"
              payload: { brix: 23.0, ta_gl: 6.5, ph: 3.40, rot_pct: 1.0, mog_pct: 0.5, expected_weigh_tag_version: "${tag_version}" }
              as: QualityLabTech
            - call: "GET /grower-relations/weigh-tags/${tag_id}"
              as: GrowerRelationsManager
          assert:
            - "The tag reports captured_by_user_id == user-scale-1 and weigh_status NET_FINAL before any grading"
            - "${e1} == ERR_SOD_SAME_USER_GRADING with HTTP 403 when the grading is sent with X-User-ID == user-scale-1, even though the role QualityLabTech is correct and the expected version is current"
            - "The refused call left the tag at grade_count 0, disposition PENDING and version unchanged, so the stale-version guard cannot be blamed for the second attempt"
            - "The second grading, identical except X-User-ID == user-lab-1, returns 201 and drives disposition to ACCEPTED"
            - "Priority 4 sits above the existence and state checks, so an SoD violation on a tag that is still GROSS_CAPTURED also returns 403 rather than ERR_TAG_WEIGH_STATE_INVALID"

      - name: peer_roles_share_the_delivery_appointment_booking_operation
