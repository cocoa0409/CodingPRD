              payload: { sequence_no: 1, premium_class: "SHELL", work_class: "QUIET", hard_cost_usd: 100000.00, restoration_cost_usd: 90000.00 }
              as: LandlordAssetManager
              captures: { ph_id: "$.data.id" }
            - call: "POST /phase-packages/${ph_id}/schedule"
              payload: { window_start: "2026-09-01T00:00:00Z", window_end: "2026-09-05T00:00:00Z" }
              as: LandlordAssetManager
            - call: "POST /phase-packages/${ph_id}/progress"
              payload: { target_status: "IN_PROGRESS" }
              as: LandlordAssetManager
