      setup:
      - ACTIVE program, ARTERIAL district, crew; two UTILITY_OWNED poles attested; route 2026-08-03..2026-08-04 with both, RELEASED
      - wo1 dispatched (route auto RELEASED -> IN_PROGRESS); route manually SUSPENDED
