# =============================================================================
# Task 1998: Relocation Benefit Administration — §1.9 Scaffold Corner Design
# Breadth coverage of §1.1–§1.7 claims not already probed by §1.8.
# Logical clock default (no set_current_utc call): 2026-08-01T00:00:00Z.
# Names are unique across this file AND SCAFFOLD_DIFFICULTY_DESIGN.yaml.
# =============================================================================

scaffold_corner_design:
  # ===========================================================================
  # Section: entities
  # ===========================================================================
  - section: entities
    instances:
      - name: create_employee_applies_defaults
        claim_type: defaults
        grounds: [entities.Employee.fields.employment_status, entities.Employee.fields.termination_date]
        distinguishing_aspect: "A minimal create yields employment_status ACTIVE, termination_date null, version 1, server-minted UUID id."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls:
            - call: "POST /employees"
              payload: { full_name: "Default Dee", job_level: MANAGER, home_ownership: RENTER }
              as: MobilityCoordinator
              captures: { emp_id: $.data.id, emp_status: $.data.employment_status, emp_v: $.data.version }
          trigger:
            - call: "GET /employees/${emp_id}"
              as: MobilityCoordinator
          assert:
            - "${emp_status} == ACTIVE and ${emp_v} == 1"
            - "Employee.${emp_id}.termination_date is null"
            - "Employee.${emp_id}.created_at == 2026-08-01T00:00:00Z (logical clock default)"

      - name: create_case_resolves_policy_and_zeroes_ledger
        claim_type: computed_fields
        grounds: [entities.RelocationCase.fields.policy_id, entities.RelocationCase.fields.total_committed_cents, calculations.policy_resolution]
        distinguishing_aspect: "Case creation auto-resolves policy_id from (employee.job_level, move_scope, employee.home_ownership) and initializes all ledger totals to 0 with status DRAFT."
        test_recipe:
          setup: ["one MANAGER/DOMESTIC/RENTER policy; one MANAGER/RENTER employee"]
          setup_api_calls:
            - call: "POST /policies"
              payload: { job_level: MANAGER, move_scope: DOMESTIC, home_ownership: RENTER, hhg_cap_cents: 500000, temp_housing_cap_cents: 300000, temp_housing_max_nights: 30, travel_cap_cents: 100000, loss_on_sale_cap_cents: 0, misc_cap_cents: 200000, home_sale_eligible: false, repayment_window_months: 24, gross_up_method: FLAT_SUPPLEMENTAL, flat_gross_up_rate: 0.22, marginal_bracket_threshold_cents: 100000, marginal_rate_low: 0.25, marginal_rate_high: 0.4, loss_basis: APPRAISED }
              as: MobilityCoordinator
              captures: { pol_id: $.data.id }
            - call: "POST /employees"
              payload: { full_name: "Comp Cate", job_level: MANAGER, home_ownership: RENTER }
              as: MobilityCoordinator
              captures: { emp_id: $.data.id }
          trigger:
            - call: "POST /relocation-cases"
              payload: { employee_id: "${emp_id}", move_scope: DOMESTIC, origin_city: "Chicago", destination_city: "Denver", expected_move_date: "2026-09-01T00:00:00Z" }
              as: MobilityCoordinator
              captures: { case_id: $.data.id, case_pol: $.data.policy_id, case_status: $.data.status, case_paid: $.data.total_paid_cents }
          assert:
            - "${case_pol} == ${pol_id} (policy_resolution matched the unique triple)"
            - "${case_status} == DRAFT and ${case_paid} == 0"
            - "RelocationCase.${case_id}.total_committed_cents == 0 and total_released_cents == 0 and cumulative_taxable_paid_cents == 0"

      - name: create_case_without_matching_policy_returns_422
        claim_type: creation
        grounds: [calculations.policy_resolution, 'errors[ERR_POLICY_NOT_FOUND]']
        distinguishing_aspect: "No policy for (EXECUTIVE, DOMESTIC, RENTER) exists, so case creation fails with ERR_POLICY_NOT_FOUND (422)."
        test_recipe:
          setup: ["only a MANAGER/DOMESTIC/RENTER policy exists; employee is EXECUTIVE/RENTER"]
          setup_api_calls:
            - call: "POST /policies"
              payload: { job_level: MANAGER, move_scope: DOMESTIC, home_ownership: RENTER, hhg_cap_cents: 500000, temp_housing_cap_cents: 300000, temp_housing_max_nights: 30, travel_cap_cents: 100000, loss_on_sale_cap_cents: 0, misc_cap_cents: 200000, home_sale_eligible: false, repayment_window_months: 24, gross_up_method: FLAT_SUPPLEMENTAL, flat_gross_up_rate: 0.22, marginal_bracket_threshold_cents: 100000, marginal_rate_low: 0.25, marginal_rate_high: 0.4, loss_basis: APPRAISED }
              as: MobilityCoordinator
            - call: "POST /employees"
              payload: { full_name: "NoPol Ned", job_level: EXECUTIVE, home_ownership: RENTER }
              as: MobilityCoordinator
              captures: { emp_id: $.data.id }
          trigger:
            - call: "POST /relocation-cases"
              payload: { employee_id: "${emp_id}", move_scope: DOMESTIC, origin_city: "Chicago", destination_city: "Denver", expected_move_date: "2026-09-01T00:00:00Z" }
              as: MobilityCoordinator
              captures: { err: $.data.error_id }
          assert:
            - "${err} == ERR_POLICY_NOT_FOUND"

      - name: create_booking_missing_case_id_rejected
        claim_type: required_fields
        grounds: ['validations[priority=3]', 'errors[ERR_INVALID_REQUEST]']
        distinguishing_aspect: "Omitting the required case_id field is rejected with ERR_INVALID_REQUEST (400) before any state/business check runs."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /service-bookings"
              payload: { kind: TRAVEL, start_date: "2026-08-15T00:00:00Z", amount_cents: 61000 }
              as: MobilityCoordinator
              captures: { err: $.data.error_id }
          assert:
            - "${err} == ERR_INVALID_REQUEST"

      - name: get_nonexistent_case_returns_404
        claim_type: not_found
        grounds: ['validations[priority=4]', 'errors[ERR_NOT_FOUND]']
        distinguishing_aspect: "GET with a well-formed but absent UUID returns ERR_NOT_FOUND (404)."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "GET /relocation-cases/00000000-0000-0000-0000-000000000000"
              as: MobilityCoordinator
              captures: { err: $.data.error_id }
          assert:
            - "${err} == ERR_NOT_FOUND"

      - name: create_employee_with_invalid_job_level_rejected
        claim_type: type_constraints
        grounds: [entities.Employee.fields.job_level, 'errors[ERR_INVALID_REQUEST]']
        distinguishing_aspect: "job_level outside {ASSOCIATE, MANAGER, DIRECTOR, EXECUTIVE} is rejected with ERR_INVALID_REQUEST."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /employees"
              payload: { full_name: "Bad Enum", job_level: SUPREME, home_ownership: RENTER }
              as: MobilityCoordinator
              captures: { err: $.data.error_id }
          assert:
            - "${err} == ERR_INVALID_REQUEST"

      - name: create_employee_system_fields_input_ignored
        claim_type: system_fields
        grounds: [entities.Employee]
        distinguishing_aspect: "Client-supplied id/version on create are ignored: the response carries a server-minted UUID and version 1."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /employees"
              payload: { full_name: "Sys Sid", job_level: MANAGER, home_ownership: RENTER, id: "11111111-1111-1111-1111-111111111111", version: 99 }
              as: MobilityCoordinator
              captures: { emp_id: $.data.id, emp_v: $.data.version }
          assert:
            - "${emp_id} != 11111111-1111-1111-1111-111111111111"
            - "${emp_v} == 1"

  # ===========================================================================
  # Section: state_machines
  # ===========================================================================
  - section: state_machines
    instances:
      - name: case_initial_state_is_draft
        claim_type: initial_state
        grounds: [state_machines.RelocationCase]
        distinguishing_aspect: "A newly created case reads back with status DRAFT before any lifecycle action."
        test_recipe:
          setup: ["policy + employee exist"]
          setup_api_calls:
            - call: "POST /policies"
              payload: { job_level: MANAGER, move_scope: DOMESTIC, home_ownership: RENTER, hhg_cap_cents: 500000, temp_housing_cap_cents: 300000, temp_housing_max_nights: 30, travel_cap_cents: 100000, loss_on_sale_cap_cents: 0, misc_cap_cents: 200000, home_sale_eligible: false, repayment_window_months: 24, gross_up_method: FLAT_SUPPLEMENTAL, flat_gross_up_rate: 0.22, marginal_bracket_threshold_cents: 100000, marginal_rate_low: 0.25, marginal_rate_high: 0.4, loss_basis: APPRAISED }
              as: MobilityCoordinator
            - call: "POST /employees"
              payload: { full_name: "Init Ina", job_level: MANAGER, home_ownership: RENTER }
              as: MobilityCoordinator
              captures: { emp_id: $.data.id }
            - call: "POST /relocation-cases"
              payload: { employee_id: "${emp_id}", move_scope: DOMESTIC, origin_city: "Chicago", destination_city: "Denver", expected_move_date: "2026-09-01T00:00:00Z" }
              as: MobilityCoordinator
              captures: { case_id: $.data.id }
          trigger:
            - call: "GET /relocation-cases/${case_id}"
              as: MobilityCoordinator
              captures: { st: $.data.status }
          assert:
            - "${st} == DRAFT"

      - name: authorize_in_progress_case_rejected
        claim_type: invalid_transition
        grounds: [state_machines.RelocationCase.transitions, 'errors[ERR_INVALID_STATE]']
        distinguishing_aspect: "authorize is only valid from DRAFT; calling it on an IN_PROGRESS case fails with ERR_INVALID_STATE and leaves status unchanged."
        test_recipe:
          setup: ["case already IN_PROGRESS"]
          setup_api_calls:
            - call: "POST /policies"
              payload: { job_level: MANAGER, move_scope: DOMESTIC, home_ownership: RENTER, hhg_cap_cents: 500000, temp_housing_cap_cents: 300000, temp_housing_max_nights: 30, travel_cap_cents: 100000, loss_on_sale_cap_cents: 0, misc_cap_cents: 200000, home_sale_eligible: false, repayment_window_months: 24, gross_up_method: FLAT_SUPPLEMENTAL, flat_gross_up_rate: 0.22, marginal_bracket_threshold_cents: 100000, marginal_rate_low: 0.25, marginal_rate_high: 0.4, loss_basis: APPRAISED }
              as: MobilityCoordinator
            - call: "POST /employees"
              payload: { full_name: "Inv Ian", job_level: MANAGER, home_ownership: RENTER }
              as: MobilityCoordinator
              captures: { emp_id: $.data.id }
            - call: "POST /relocation-cases"
              payload: { employee_id: "${emp_id}", move_scope: DOMESTIC, origin_city: "Chicago", destination_city: "Denver", expected_move_date: "2026-09-01T00:00:00Z" }
              as: MobilityCoordinator
              captures: { case_id: $.data.id }
            - call: "POST /relocation-cases/${case_id}/authorize"
              payload: {}
              as: MobilityCoordinator
            - call: "POST /relocation-cases/${case_id}/start"
              payload: {}
              as: MobilityCoordinator
          trigger:
            - call: "POST /relocation-cases/${case_id}/authorize"
              payload: {}
              as: MobilityCoordinator
              captures: { err: $.data.error_id }
          assert:
            - "${err} == ERR_INVALID_STATE"
            - "RelocationCase.${case_id}.status == IN_PROGRESS (unchanged)"

      - name: cancel_closed_case_returns_already_terminal
        claim_type: terminal_state_lockdown
        grounds: [state_machines.RelocationCase, 'errors[ERR_ALREADY_TERMINAL]']
        distinguishing_aspect: "From terminal CLOSED no further transition is possible; cancel returns ERR_ALREADY_TERMINAL."
        test_recipe:
          setup: ["case IN_PROGRESS with no children, then closed"]
          setup_api_calls:
            - call: "POST /policies"
              payload: { job_level: MANAGER, move_scope: DOMESTIC, home_ownership: RENTER, hhg_cap_cents: 500000, temp_housing_cap_cents: 300000, temp_housing_max_nights: 30, travel_cap_cents: 100000, loss_on_sale_cap_cents: 0, misc_cap_cents: 200000, home_sale_eligible: false, repayment_window_months: 24, gross_up_method: FLAT_SUPPLEMENTAL, flat_gross_up_rate: 0.22, marginal_bracket_threshold_cents: 100000, marginal_rate_low: 0.25, marginal_rate_high: 0.4, loss_basis: APPRAISED }
              as: MobilityCoordinator
            - call: "POST /employees"
              payload: { full_name: "Term Tess", job_level: MANAGER, home_ownership: RENTER }
              as: MobilityCoordinator
              captures: { emp_id: $.data.id }
            - call: "POST /relocation-cases"
              payload: { employee_id: "${emp_id}", move_scope: DOMESTIC, origin_city: "Chicago", destination_city: "Denver", expected_move_date: "2026-09-01T00:00:00Z" }
              as: MobilityCoordinator
              captures: { case_id: $.data.id }
            - call: "POST /relocation-cases/${case_id}/authorize"
              payload: {}
              as: MobilityCoordinator
            - call: "POST /relocation-cases/${case_id}/start"
              payload: {}
              as: MobilityCoordinator
            - call: "POST /relocation-cases/${case_id}/close"
              payload: {}
              as: MobilityCoordinator
          trigger:
            - call: "POST /relocation-cases/${case_id}/cancel"
              payload: {}
              as: MobilityCoordinator
              captures: { err: $.data.error_id }
          assert:
            - "${err} == ERR_ALREADY_TERMINAL"
            - "RelocationCase.${case_id}.status == CLOSED (unchanged)"

      - name: pay_submitted_claim_rejected
        claim_type: invalid_transition
        grounds: [state_machines.ExpenseClaim, 'errors[ERR_INVALID_STATE]']
        distinguishing_aspect: "pay is only valid from APPROVED; paying a SUBMITTED claim fails with ERR_INVALID_STATE and no gross-up is computed."
        test_recipe:
          setup: ["case IN_PROGRESS; claim SUBMITTED"]
          setup_api_calls:
            - call: "POST /policies"
              payload: { job_level: MANAGER, move_scope: DOMESTIC, home_ownership: RENTER, hhg_cap_cents: 500000, temp_housing_cap_cents: 300000, temp_housing_max_nights: 30, travel_cap_cents: 100000, loss_on_sale_cap_cents: 0, misc_cap_cents: 200000, home_sale_eligible: false, repayment_window_months: 24, gross_up_method: FLAT_SUPPLEMENTAL, flat_gross_up_rate: 0.22, marginal_bracket_threshold_cents: 100000, marginal_rate_low: 0.25, marginal_rate_high: 0.4, loss_basis: APPRAISED }
              as: MobilityCoordinator
            - call: "POST /employees"
              payload: { full_name: "Skip Sky", job_level: MANAGER, home_ownership: RENTER }
              as: MobilityCoordinator
              captures: { emp_id: $.data.id }
            - call: "POST /relocation-cases"
              payload: { employee_id: "${emp_id}", move_scope: DOMESTIC, origin_city: "Chicago", destination_city: "Denver", expected_move_date: "2026-09-01T00:00:00Z" }
              as: MobilityCoordinator
              captures: { case_id: $.data.id }
            - call: "POST /relocation-cases/${case_id}/authorize"
              payload: {}
              as: MobilityCoordinator
            - call: "POST /relocation-cases/${case_id}/start"
              payload: {}
              as: MobilityCoordinator
            - call: "POST /expense-claims"
              payload: { case_id: "${case_id}", category: MEALS, payment_method: REIMBURSEMENT, lines: [{ description: "dinner", amount_cents: 10000 }] }
              as: Employee
              as_user_id: "${emp_id}"
              captures: { claim_id: $.data.id }
          trigger:
            - call: "POST /expense-claims/${claim_id}/pay"
              payload: {}
              as: FinanceSpecialist
              captures: { err: $.data.error_id }
          assert:
            - "${err} == ERR_INVALID_STATE"
            - "ExpenseClaim.${claim_id}.status == SUBMITTED and gross_up_cents == 0 and total_payment_cents == 0"
            - "RelocationCase.${case_id}.total_paid_cents == 0"

      - name: reject_estimate_clears_survey_fields
        claim_type: side_effect_execution
        grounds: [state_machines.MoveAssignment.ESTIMATE_SUBMITTED_to_REQUESTED]
        distinguishing_aspect: "The reject transition not only moves ESTIMATE_SUBMITTED -> REQUESTED but also nulls survey_at and estimated_cents, forcing a fresh survey."
        test_recipe:
          setup: ["case IN_PROGRESS; vendor ACTIVE; assignment ESTIMATE_SUBMITTED with survey_at 2026-08-10T10:00:00Z and estimated_cents 95000"]
          setup_api_calls:
            - call: "POST /policies"
              payload: { job_level: MANAGER, move_scope: DOMESTIC, home_ownership: RENTER, hhg_cap_cents: 500000, temp_housing_cap_cents: 300000, temp_housing_max_nights: 30, travel_cap_cents: 100000, loss_on_sale_cap_cents: 0, misc_cap_cents: 200000, home_sale_eligible: false, repayment_window_months: 24, gross_up_method: FLAT_SUPPLEMENTAL, flat_gross_up_rate: 0.22, marginal_bracket_threshold_cents: 100000, marginal_rate_low: 0.25, marginal_rate_high: 0.4, loss_basis: APPRAISED }
              as: MobilityCoordinator
            - call: "POST /employees"
              payload: { full_name: "Clear Cleo", job_level: MANAGER, home_ownership: RENTER }
              as: MobilityCoordinator
              captures: { emp_id: $.data.id }
            - call: "POST /relocation-cases"
              payload: { employee_id: "${emp_id}", move_scope: DOMESTIC, origin_city: "Chicago", destination_city: "Denver", expected_move_date: "2026-09-01T00:00:00Z" }
              as: MobilityCoordinator
              captures: { case_id: $.data.id }
            - call: "POST /relocation-cases/${case_id}/authorize"
              payload: {}
              as: MobilityCoordinator
            - call: "POST /relocation-cases/${case_id}/start"
              payload: {}
              as: MobilityCoordinator
            - call: "POST /vendors"
              payload: { name: "Clear Carriers", service_regions: ["IL"] }
              as: MobilityCoordinator
              captures: { vendor_id: $.data.id }
            - call: "POST /move-assignments"
              payload: { case_id: "${case_id}", vendor_id: "${vendor_id}" }
              as: MobilityCoordinator
              captures: { ma_id: $.data.id }
            - call: "POST /move-assignments/${ma_id}/schedule-survey"
              payload: { survey_at: "2026-08-10T10:00:00Z" }
              as: MobilityCoordinator
            - call: "POST /move-assignments/${ma_id}/submit-estimate"
              payload: { estimated_cents: 95000 }
              as: Vendor
              as_user_id: "${vendor_id}"
          trigger:
            - call: "POST /move-assignments/${ma_id}/reject-estimate"
              payload: {}
              as: MobilityCoordinator
          assert:
            - "MoveAssignment.${ma_id}.status == REQUESTED"
            - "MoveAssignment.${ma_id}.survey_at is null and estimated_cents is null"
            - "RelocationCase.${case_id}.total_committed_cents == 0 (estimate was never approved, nothing committed)"

      - name: rate_unpaid_assignment_rejected
        claim_type: precondition_enforcement
        grounds: [state_machines.MoveAssignment, 'errors[ERR_INVALID_STATE]']
        distinguishing_aspect: "rate requires status PAID; rating a DELIVERED assignment fails with ERR_INVALID_STATE and vendor aggregates stay unchanged."
        test_recipe:
          setup: ["case IN_PROGRESS; assignment DELIVERED (estimate 80000 approved, delivered, not yet invoiced)"]
          setup_api_calls:
            - call: "POST /policies"
              payload: { job_level: MANAGER, move_scope: DOMESTIC, home_ownership: RENTER, hhg_cap_cents: 500000, temp_housing_cap_cents: 300000, temp_housing_max_nights: 30, travel_cap_cents: 100000, loss_on_sale_cap_cents: 0, misc_cap_cents: 200000, home_sale_eligible: false, repayment_window_months: 24, gross_up_method: FLAT_SUPPLEMENTAL, flat_gross_up_rate: 0.22, marginal_bracket_threshold_cents: 100000, marginal_rate_low: 0.25, marginal_rate_high: 0.4, loss_basis: APPRAISED }
              as: MobilityCoordinator
            - call: "POST /employees"
              payload: { full_name: "Rate Rae", job_level: MANAGER, home_ownership: RENTER }
              as: MobilityCoordinator
              captures: { emp_id: $.data.id }
            - call: "POST /relocation-cases"
              payload: { employee_id: "${emp_id}", move_scope: DOMESTIC, origin_city: "Chicago", destination_city: "Denver", expected_move_date: "2026-09-01T00:00:00Z" }
              as: MobilityCoordinator
              captures: { case_id: $.data.id }
            - call: "POST /relocation-cases/${case_id}/authorize"
              payload: {}
              as: MobilityCoordinator
            - call: "POST /relocation-cases/${case_id}/start"
              payload: {}
              as: MobilityCoordinator
            - call: "POST /vendors"
              payload: { name: "Rate Runners", service_regions: ["IL"] }
              as: MobilityCoordinator
              captures: { vendor_id: $.data.id }
            - call: "POST /move-assignments"
              payload: { case_id: "${case_id}", vendor_id: "${vendor_id}" }
              as: MobilityCoordinator
              captures: { ma_id: $.data.id }
            - call: "POST /move-assignments/${ma_id}/schedule-survey"
              payload: { survey_at: "2026-08-10T10:00:00Z" }
              as: MobilityCoordinator
            - call: "POST /move-assignments/${ma_id}/submit-estimate"
              payload: { estimated_cents: 80000 }
              as: Vendor
              as_user_id: "${vendor_id}"
            - call: "GET /relocation-cases/${case_id}"
              as: MobilityCoordinator
              captures: { case_v: $.data.version }
            - call: "POST /move-assignments/${ma_id}/approve-estimate"
              payload: { expected_case_version: "${case_v}" }
              as: MobilityCoordinator
            - call: "POST /move-assignments/${ma_id}/mark-delivered"
              payload: {}
              as: Vendor
              as_user_id: "${vendor_id}"
          trigger:
            - call: "POST /move-assignments/${ma_id}/rate"
              payload: { rating: 4 }
              as: Employee
              as_user_id: "${emp_id}"
              captures: { err: $.data.error_id }
          assert:
            - "${err} == ERR_INVALID_STATE"
            - "Vendor.${vendor_id}.rating_count == 0 and avg_rating_lifetime is null"

      - name: complete_held_booking_rejected
        claim_type: invalid_transition
        grounds: [state_machines.ServiceBooking, 'errors[ERR_INVALID_STATE]']
        distinguishing_aspect: "complete is only valid from CONFIRMED; completing a HELD booking fails with ERR_INVALID_STATE and no ledger movement."
        test_recipe:
          setup: ["case IN_PROGRESS; TRAVEL booking HELD"]
          setup_api_calls:
            - call: "POST /policies"
              payload: { job_level: MANAGER, move_scope: DOMESTIC, home_ownership: RENTER, hhg_cap_cents: 500000, temp_housing_cap_cents: 300000, temp_housing_max_nights: 30, travel_cap_cents: 100000, loss_on_sale_cap_cents: 0, misc_cap_cents: 200000, home_sale_eligible: false, repayment_window_months: 24, gross_up_method: FLAT_SUPPLEMENTAL, flat_gross_up_rate: 0.22, marginal_bracket_threshold_cents: 100000, marginal_rate_low: 0.25, marginal_rate_high: 0.4, loss_basis: APPRAISED }
              as: MobilityCoordinator
            - call: "POST /employees"
              payload: { full_name: "Held Hank", job_level: MANAGER, home_ownership: RENTER }
              as: MobilityCoordinator
              captures: { emp_id: $.data.id }
            - call: "POST /relocation-cases"
              payload: { employee_id: "${emp_id}", move_scope: DOMESTIC, origin_city: "Chicago", destination_city: "Denver", expected_move_date: "2026-09-01T00:00:00Z" }
              as: MobilityCoordinator
              captures: { case_id: $.data.id }
            - call: "POST /relocation-cases/${case_id}/authorize"
              payload: {}
              as: MobilityCoordinator
            - call: "POST /relocation-cases/${case_id}/start"
              payload: {}
              as: MobilityCoordinator
            - call: "POST /service-bookings"
              payload: { case_id: "${case_id}", kind: TRAVEL, start_date: "2026-08-15T00:00:00Z", amount_cents: 30000 }
              as: Employee
              as_user_id: "${emp_id}"
              captures: { sb_id: $.data.id }
          trigger:
            - call: "POST /service-bookings/${sb_id}/complete"
              payload: {}
              as: MobilityCoordinator
              captures: { err: $.data.error_id }
          assert:
            - "${err} == ERR_INVALID_STATE"
            - "RelocationCase.${case_id}.total_committed_cents == 0 and total_paid_cents == 0"

