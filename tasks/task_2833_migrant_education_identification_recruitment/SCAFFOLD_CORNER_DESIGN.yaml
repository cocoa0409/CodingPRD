      - name: corner_graph_topology_prior_record_link_is_written_only_by_transfer_match
        claim_type: graph
        grounds:
          - complexity_profile.entity_topology
          - entities.Student.fields.prior_record_student_id
          - entities.RecordTransferRequest.fields.matched_prior_student_id
          - state_machines.RecordTransferRequest.INITIATED_to_MATCHED
          - endpoints[POST /mep/transfer-requests/{request_id}/match]
        distinguishing_aspect: "The graph edge Student.prior_record_student_id is system-sourced: it is null on POST /mep/students and is written only when a RecordTransferRequest is matched, linking the incoming student to the holding state's prior record - and the matched student itself is left untouched."
        test_recipe:
          setup:
            - "logical clock at its 2026-08-01T00:00:00Z startup default"
            - "one OPEN AgriculturalArea, one ACTIVE Recruiter"
            - "two ENROLLED Students: the incoming record and the prior record held by another state"
            - "one INITIATED RecordTransferRequest for the incoming student, requesting WA from CA"
          setup_api_calls:
            - call: "POST /mep/areas"
              payload: { name: "Yakima Valley", state_code: "WA", primary_activity: "AGRICULTURE", peak_season_start_date: "2026-06-01", peak_season_end_date: "2026-09-30", recruiter_capacity: 3 }
              as: StateProgramAdmin
              captures: { area_id: $.data.id }
            - call: "POST /mep/recruiters"
              payload: { full_name: "Rosa Aguilar", state_code: "WA", credential_level: "BASIC", status: "ACTIVE" }
              as: StateProgramAdmin
              captures: { rec_a_id: $.data.id }
            - call: "POST /mep/students"
              payload: { full_name: "Mateo Reyes", birth_date: "2010-03-20", current_state_code: "WA", area_id: "${area_id}" }
              as: Recruiter
              as_user_id: "${rec_a_id}"
              captures: { stu_new_id: $.data.id, prior_link_before: $.data.prior_record_student_id }
            - call: "POST /mep/students"
              payload: { full_name: "Mateo R Reyes", birth_date: "2010-03-20", current_state_code: "CA", area_id: "${area_id}" }
              as: Recruiter
              as_user_id: "${rec_a_id}"
              captures: { stu_prior_id: $.data.id }
            - call: "POST /mep/transfer-requests"
              payload: { student_id: "${stu_new_id}", requesting_state_code: "WA", holding_state_code: "CA", exchange_reference: "MSIX-2026-000412", reported_prior_credits: 10.00 }
              as: ExchangeLiaison
              captures: { req_id: $.data.id, req_status: $.data.status }
          trigger:
            - call: "POST /mep/transfer-requests/${req_id}/match"
              payload: { matched_prior_student_id: "${stu_prior_id}" }
              as: ExchangeLiaison
              captures: { match_status: $.data.status, matched_to: $.data.matched_prior_student_id }
          assert:
            - "before the trigger Student.${stu_new_id}.prior_record_student_id is null"
            - "RecordTransferRequest.${req_id}.status == INITIATED before the trigger and MATCHED after it"
            - "RecordTransferRequest.${req_id}.matched_prior_student_id == ${stu_prior_id}"
            - "after the trigger Student.${stu_new_id}.prior_record_student_id == ${stu_prior_id}"
            - "after the trigger Student.${stu_prior_id}.prior_record_student_id is still null - the edge is one-directional"
            - "GET /mep/students filtered by prior_record_student_id ${stu_prior_id} returns exactly 1 row, ${stu_new_id}"

  # =========================================================================
  - section: state_machines
    instances:

      - name: corner_new_rows_start_in_their_declared_initial_state
        claim_type: Initial State
        grounds:
          - state_machines.QualifyingMove
          - state_machines.CertificateOfEligibility
          - state_machines.RecruiterAssignment
          - state_machines.RecordTransferRequest
          - state_machines.Student
        distinguishing_aspect: "A freshly created QualifyingMove is RECORDED, a fresh CertificateOfEligibility is DRAFT, a fresh RecruiterAssignment is PLANNED, a fresh RecordTransferRequest is INITIATED and a fresh Student is NOT_ELIGIBLE / UNSERVED - each exactly the initial_state its machine declares, with no transition applied at creation."
        test_recipe:
          setup:
            - "logical clock at its 2026-08-01T00:00:00Z startup default"
            - "one OPEN AgriculturalArea and one ACTIVE Recruiter, so every create below has valid FKs"
          setup_api_calls:
            - call: "POST /mep/areas"
              payload: { name: "Yakima Valley", state_code: "WA", primary_activity: "AGRICULTURE", peak_season_start_date: "2026-06-01", peak_season_end_date: "2026-09-30", recruiter_capacity: 3 }
              as: StateProgramAdmin
              captures: { area_id: $.data.id, area_v1: $.data.version }
            - call: "POST /mep/recruiters"
              payload: { full_name: "Rosa Aguilar", state_code: "WA", credential_level: "BASIC", status: "ACTIVE" }
              as: StateProgramAdmin
              captures: { rec_a_id: $.data.id }
          trigger:
            - call: "POST /mep/students"
              payload: { full_name: "Mateo Reyes", birth_date: "2010-03-20", current_state_code: "WA", area_id: "${area_id}" }
              as: Recruiter
              as_user_id: "${rec_a_id}"
              captures: { stu_id: $.data.id, elig: $.data.eligibility_status, serv: $.data.service_status }
            - call: "POST /mep/qualifying-moves"
              payload: { student_id: "${stu_id}", from_state_code: "CA", to_state_code: "WA", move_date: "2026-06-15", work_type: "AGRICULTURAL", worker_relationship: "PARENT", purpose: "SEEK_OR_OBTAIN_QUALIFYING_WORK", distance_miles: 820.50 }
              as: Recruiter
              as_user_id: "${rec_a_id}"
              captures: { move_id: $.data.id, move_status: $.data.status }
            - call: "POST /mep/coes"
              payload: { student_id: "${stu_id}", move_id: "${move_id}", residency_date: "2026-07-01", qc_hold_exempt: true }
              as: Recruiter
              as_user_id: "${rec_a_id}"
              captures: { coe_id: $.data.id, coe_status: $.data.status }
            - call: "POST /mep/recruiter-assignments"
              payload: { recruiter_id: "${rec_a_id}", area_id: "${area_id}", coverage_role: "PRIMARY", starts_on: "2026-05-01", ends_on: "2026-10-31", expected_area_version: "${area_v1}" }
              as: StateProgramAdmin
              captures: { asg_id: $.data.id, asg_status: $.data.status }
            - call: "POST /mep/transfer-requests"
              payload: { student_id: "${stu_id}", requesting_state_code: "WA", holding_state_code: "CA", exchange_reference: "MSIX-2026-000900" }
              as: ExchangeLiaison
              captures: { req_id: $.data.id, req_status: $.data.status }
          assert:
