        grounds:
          - errors[ERR_COURT_EVENT_INVALID_STATE]
          - errors[ERR_COURT_EVENT_NOT_ELAPSED]
          - state_machines.CourtEvent
          - endpoints[POST /lab/court-events/{court_event_id}/complete]
        distinguishing_aspect: "Two different refusals guard the same endpoint and must not be conflated: completing a SCHEDULED block is a state error (the confirmation step was skipped), while completing a CONFIRMED block whose end_utc has not yet passed is the distinct not-elapsed error. The boundary is inclusive on the far side - the clock standing exactly at end_utc is NOT strictly before it, so completion succeeds at that instant."
