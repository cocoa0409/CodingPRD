            - "GET /treatment-plans filtered by supersedes_plan_id == ${pl1} returns exactly 1 row"

      - name: cascading_side_effects_are_covered_by_the_four_level_cancellation_chain
        claim_type: cascading_side_effects
        grounds:
          - complexity_profile.complexity_layers[cascading_side_effects]
          - state_machines[Appointment].transitions[CONFIRMED -> CANCELLED]
          - state_machines[TreatmentPlan].transitions[ACTIVE -> SUSPENDED]
        distinguishing_aspect: |
          The deepest chain in this domain runs cancel -> dose waste -> patient waste liability
          -> steering flip -> plan suspension -> sibling appointment cancellation, and its
          interesting property is ordering sensitivity: the charge must be computed from the
          waste that the same call created, and the sibling must be cancelled at zero charge
          even though the trigger cancellation was charged.
        excluded_because:
          difficulty_instance: cancel_wastes_dose_then_steers_patient_then_suspends_plan_then_cancels_sibling
          rationale: |
            That instance walks the full chain end-to-end in one call and asserts every level:
            the WASTED preparation and its waste_cost_cents, the patient's waste_liability_cents
            crossing 50000, steering_status flipping to HOME_INFUSION_REVIEW, the plan moving to
            SUSPENDED and the sibling visit ending CANCELLED with a zero charge and a released
            chair. A corner-level repeat could only assert a subset of the same writes.

      - name: dual_variant_calculation_is_covered_by_the_two_variant_divergence_instances
        claim_type: dual_variant_calculation
        grounds:
          - complexity_profile.complexity_layers[dual_variant_calculation]
          - calculations[chair_utilization_pct].variants
          - calculations[no_show_risk_score].variants
        distinguishing_aspect: |
          Both variant pairs are only meaningful when the same rows are read twice and the two
          answers differ by a computable delta, which requires a fixture where one visit
          overran its template and another never happened at all.
        excluded_because:
          difficulty_instance: chair_utilization_scheduled_vs_actual_variant_divergence
          rationale: |
            That instance pins both SCHEDULED and ACTUAL against one identical day and asserts
            the exact delta, and its sibling instance
            no_show_risk_rolling6_vs_quarter_to_date_variant_divergence does the same for the
            risk score, including the reminder tier that only the ROLLING_6 variant persists.
            The §1.9 calculations section already covers the default-variant selection edge.

      - name: the_selector_ranking_keys_are_applied_in_the_declared_order
        claim_type: selector_policy
        grounds:
          - complexity_profile.complexity_layers[selector_policy]
          - calculations[staggered_start_assignment]
          - entities.Chair.fields.committed_minutes
          - entities.Nurse.fields.assigned_acuity_points
        distinguishing_aspect: |
          The selector's tie-breaks are the part of a policy that implementations silently get
          wrong by falling back on insertion order. This fixture creates the chairs in the
          order A3, A1, A2 so that label ASC and created_at ASC disagree, and hires the nurses
          so that created_at ASC and assigned_acuity_points ASC disagree after the first
          booking. Four bookings then walk the keys in order: an all-tied pool resolved by
          label, a partially committed pool resolved by committed_minutes, a nurse tie resolved
          by created_at, and finally a fresh time band where every chair is tied again on
          committed_minutes so label decides a second time while the nurse key does not tie.
