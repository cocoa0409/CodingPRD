  instances:
  - name: identification_exactly_at_45_day_deadline_inclusive
    grounds:
    - calculations.exchange_file_deadlines
    - entities.ExchangeFile.fields.identification_deadline
    - validations[priority=38]
    - state_machines.ExchangeFile.transitions.OPEN_to_IDENTIFIED
    distinguishing_aspect: 'TEMPORAL millisecond boundary: the 45th day ends at 2026-09-19T23:59:59.999Z and an identification filed at exactly that instant is INSIDE the window, so the filing succeeds and the file becomes IDENTIFIED (one millisecond later it would be rejected).'
