        distinguishing_aspect: "Path existence (priority 3) beats the OCC check (priority 8): an unknown lot id returns ERR_LOT_NOT_FOUND (404), never ERR_STALE_LOT_VERSION."
        test_recipe:
          setup:
            - "A real, unrelated lot exists so the request can carry a genuine server-issued version value; the lot id in the path is a different, non-existent UUID."
          setup_api_calls:
            - call: "POST /stores"
              payload: { name: "SEP-CA", region_code: "CA" }
              as: MerchandisingAdmin
              captures: { store_id: "$.data.id" }
