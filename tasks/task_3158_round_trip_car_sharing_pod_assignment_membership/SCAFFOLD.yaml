      - signal_type?
      - member_id?
      - reservation_id?
      - limit?
      - offset?
    output: CommunitySignal[]
    side_effects: []

  # ---- Test-driving endpoints ----
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the logical clock. The server startup default is exactly 2026-09-01T00:00:00Z; before any call to this endpoint the logical clock reads that default and never falls back to real wall-clock time."
    roles: [PlatformAdmin]
    code: 200
    input:
      - to_iso8601
    output: null
    side_effects: ["every deadline, expiry and window comparison is evaluated against the new value"]
  - method: POST
    path: "/_payments/simulate"
    description: "Test-driving endpoint: settle an out-of-band payment outcome for a membership billing total without a real payment rail."
    roles: [PlatformAdmin]
    code: 200
    input:
      - membership_id
      - outcome
    output: null
    side_effects: ["records the simulated settlement outcome for the membership"]
  - method: POST
    path: "/_citations/issue"
    description: "Test-driving endpoint: mint an authority citation whose signature can later be validated against the recoverable signer address."
    roles: [PlatformAdmin]
    code: 201
    input:
      - recoverable_signer_address
      - signer_address
      - expires_at
    output: null
    side_effects: ["creates a validator-executed citation row addressable by POST /car-share/citations/{id}/validate-signature"]
  - method: POST
    path: "/car-share/citations/{id}/validate-signature"
    description: "Validate an authority citation's signature against the recoverable signer address."
    roles: [PodOperator, PlatformAdmin]
    code: 200
    input:
      - signature
    output: null
    side_effects: ["returns the validation outcome; a mismatched signature is rejected"]

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "X-User-Role or X-User-ID header missing, or X-User-Role is not a declared role"
  - id: ERR_FORBIDDEN
    http: 403
    condition: "the acting role is not permitted for this operation, or an acting Member is not the owner of the target resource"
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 403
    condition: "the acting operator identifier equals the incident's recorded member identifier, so the same identity cannot both raise and split the incident"
  - id: ERR_MEMBER_NOT_FOUND
    http: 404
    condition: "no Member row matches the path id"
  - id: ERR_MEMBERSHIP_NOT_FOUND
    http: 404
    condition: "no Membership row matches the path id"
  - id: ERR_POD_NOT_FOUND
    http: 404
    condition: "no Pod row matches the path id or the supplied pod_id"
  - id: ERR_VEHICLE_NOT_FOUND
    http: 404
    condition: "no Vehicle row matches the path id or the supplied vehicle_id"
  - id: ERR_RESERVATION_NOT_FOUND
    http: 404
    condition: "no Reservation row matches the path id or the supplied reservation_id"
  - id: ERR_INCIDENT_NOT_FOUND
    http: 404
    condition: "no Incident row matches the path id"
  - id: ERR_ACCOUNT_NOT_FOUND
    http: 404
    condition: "no Account row matches the path id or the supplied account_id"
  - id: ERR_MAINTENANCE_ORDER_NOT_FOUND
    http: 404
    condition: "no MaintenanceOrder row matches the path id"
  - id: ERR_ACCESS_EVENT_NOT_FOUND
    http: 404
    condition: "no AccessEvent row matches the path id"
  - id: ERR_FUEL_TRANSACTION_NOT_FOUND
    http: 404
    condition: "no FuelCardTransaction row matches the path id"
  - id: ERR_INCIDENT_REFERENCE_MISMATCH
    http: 422
    condition: "the supplied vehicle_id or member_id disagrees with the reservation's own vehicle_id or member_id"
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "a required input field is missing, a field carries the wrong type, or an enum field carries a value outside its declared set"
  - id: ERR_INVALID_STATE
    http: 409
    condition: "the requested transition is not declared for the target resource's current state"
  - id: ERR_ALREADY_TERMINAL
    http: 409
    condition: "the target resource is already in a terminal state for this operation"
  - id: ERR_STALE_VERSION
    http: 412
    condition: "expected_vehicle_version, expected_pod_version_profile or expected_incident_version does not equal the persisted version of the parent entity named by the corresponding concurrency rule"
  - id: ERR_APPLICATION_NOT_APPROVED
    http: 409
    condition: "the member's application_status is not APPROVED, so booking rights do not exist yet"
  - id: ERR_SCREENING_NOT_CLEAR
    http: 422
    condition: "the member's screen_result is REFERRED or FAILED"
  - id: ERR_MEMBERSHIP_NOT_ACTIVE
    http: 409
    condition: "the member has no Membership row with status ACTIVE"
  - id: ERR_MEMBERSHIP_FROZEN
    http: 409
    condition: "the member's membership status is FROZEN, blocking the booking"
  - id: ERR_VEHICLE_NOT_AVAILABLE
    http: 409
    condition: "the vehicle's use_status is not AVAILABLE, so it is frozen to new reservations"
  - id: ERR_DRIVING_RECORD_PENDING
    http: 409
    condition: "a non-terminal driving-record report already exists for the member"
  - id: ERR_DUPLICATE_PRIMARY_MEMBERSHIP
    http: 409
    condition: "the change would leave a second ACTIVE primary membership for the same member"
  - id: ERR_MEMBER_EMAIL_TAKEN
    http: 409
    condition: "a Member row with the same email already exists"
  - id: ERR_WRONG_RETURN_POD
    http: 422
    condition: "the return request's returned_pod_id does not equal the reservation's pod_id"
  - id: ERR_ODOMETER_REGRESSION
    http: 422
    condition: "the reported odometer is lower than the vehicle's odometer_miles"
  - id: ERR_VEHICLE_DOUBLE_BOOKED
    http: 409
    condition: "the requested half-open interval [start_at, end_at) overlaps an existing non-cancelled reservation for the same vehicle"
  - id: ERR_MAINTENANCE_WINDOW_CONFLICT
    http: 409
    condition: "the requested half-open maintenance interval overlaps an existing maintenance order or a live reservation for the same vehicle"
  - id: ERR_BUNDLE_WINDOW_CONFLICT
    http: 409
    condition: "a relocation bundle's half-open window contains a live reservation or a live maintenance order for one of the source vehicles"
  - id: ERR_POD_CAPACITY_EXCEEDED
    http: 409
    condition: "the destination pod has no free bay, so available_bays is 0"
  - id: ERR_INSUFFICIENT_WALLET_CREDIT
    http: 422
    condition: "the member's wallet_credit_cents is strictly less than the requested waiver amount"
  - id: ERR_WALLET_ADJUSTMENT_INVALID
    http: 422
    condition: "a wallet adjustment amount is zero, or a debit exceeds the member's wallet_credit_cents"
  - id: ERR_REOPEN_WINDOW_CLOSED
    http: 409
    condition: "the current logical clock value is at or past application_decided_at plus 24 hours, so the early-grade revert window has closed"
  - id: ERR_INCIDENT_IN_FUTURE
    http: 422
    condition: "the incident's opening instant is later than the current logical clock value"
  - id: ERR_CITATION_SIGNATURE_INVALID
    http: 422
    condition: "the citation's signature does not match the recoverable signer address"
  - id: ERR_LOSS_EXCEEDS_REPAIR_COST
    http: 422
    condition: "the reportable loss estimate exceeds the incident's repair_cost_cents"
  - id: ERR_ALREADY_RELEASED
    http: 409
    condition: "the wallet residual for this membership close has already been released"

