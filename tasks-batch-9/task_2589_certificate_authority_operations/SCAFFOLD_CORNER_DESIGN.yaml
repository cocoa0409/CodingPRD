          - validations[priority=61]
          - errors[ERR_DUPLICATE_WITNESS]
          - entities.KeyCeremony.fields.witness_user_ids
        distinguishing_aspect: "witness_user_ids is a set keyed on X-User-ID: u_iss_1 witnessing twice returns HTTP 409 ERR_DUPLICATE_WITNESS and witness_count stays 1, while a different user u_iss_2 is accepted and raises it to 2 - so the count tracks distinct users, not call volume."
