            - "the C1 line has trim_days_applied 7, bridge_days_applied 0 and days_supply_filled 21 (28 - 7 overlap days), giving ${c1_total} == 571 (34 x 21 x 0.8 = 571.2)"
            - "${c2_mode} == BRIDGE_TO_START from the body, while Patient.${pt_id}.sync_mode is still TRIM_TO_START — the per-cycle override does not re-pin the patient"
            - "the C2 line uses the post-C1 history (last_dispensed_date 2026-08-15 / 21 days, on hand through 2026-09-05): bridge_days_applied 7, trim_days_applied 0, days_supply_filled 35 and ${c2_total} == 952 (34 x 35 x 0.8)"
            - "C2's allowance_days == min(90, 30 x 3, 28 + 7 + 0) == 35, so the widened fill still passes priority 37"
            - "C1 [2026-08-15, 2026-09-12) and C2 [2026-09-12, 2026-10-10) touch without overlapping, so priority 28 does not fire"

      - name: adherence_projection_ignores_events_outside_the_rolling_window
        claim_type: projection
        grounds:
          - calculations.adherence_score_pct
          - endpoints.POST_/pharmacy/patients/{id}/dose-events
          - entities.AdherenceEvent.fields.occurred_at
        distinguishing_aspect: "The score is a replay over a half-open window, so a late-arriving batch of older events re-derives the score from scratch, and events one second before the window's lower bound are persisted but never counted."
        test_recipe:
          setup:
            - "synchronized patient with one pouchable prescription and two cycles: C0 [2026-07-18, 2026-08-15) and C1 [2026-08-15, 2026-09-12), both left DRAFT"
            - "logical clock advanced to 2026-09-05T00:00:00Z, so the rolling window is [2026-08-08T00:00:00Z, 2026-09-05T00:00:00Z)"
          setup_api_calls:
            - call: "POST /pharmacy/_clock/set_current_utc"
              payload: { current_utc: "2026-07-10T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /pharmacy/insurance-plans"
              payload: { payer_name: "Northwind PBM", bin_number: "610502", generic_copay_cents_per_day: 34, brand_copay_cents_per_day: 74, specialty_copay_cents_per_day: 44, refill_too_soon_threshold_pct: 75, coinsurance_pct: 20 }
              as: PlatformAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /pharmacy/patients"
              payload: { full_name: "Rosa Klein", date_of_birth: "1954-09-09", email: "rosa.klein@example.com", state_code: "WA", insurance_plan_id: "${plan_id}" }
              as: PharmacyOperations
              captures: { pt_id: $.data.id }
            - call: "POST /pharmacy/prescriptions"
              payload: { patient_id: "${pt_id}", prescriber_npi: "1487654321", drug_name: "Metformin ER", ndc: "00093-1049-01", strength: "500mg", form: "TABLET", copay_tier: "GENERIC", dose_times: ["MORNING"], quantity_per_dose: 1, days_supply_written: 30, refills_authorized: 3, written_date: "2026-05-01", expiration_date: "2027-05-01", last_dispensed_date: "2026-06-20", last_dispensed_days_supply: 28 }
              as: Prescriber
              captures: { rx1: $.data.id }
            - call: "POST /pharmacy/patients/${pt_id}/synchronize"
              payload: { anchor_fill_day: 18, sync_mode: "BRIDGE_TO_START" }
              as: PharmacyOperations
            - call: "POST /pharmacy/fill-cycles"
              payload: { patient_id: "${pt_id}", cycle_start_date: "2026-07-18", day_supply_days: 28 }
              as: PharmacyOperations
              captures: { c0: $.data.id }
            - call: "POST /pharmacy/fill-cycles"
              payload: { patient_id: "${pt_id}", cycle_start_date: "2026-08-15", day_supply_days: 28 }
              as: PharmacyOperations
              captures: { c1: $.data.id }
            - call: "POST /pharmacy/_clock/set_current_utc"
              payload: { current_utc: "2026-09-05T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /pharmacy/patients/${pt_id}/dose-events"
              payload: { cycle_id: "${c1}", events: [{ event_type: "POUCH_TAKEN", occurred_at: "2026-08-15T08:00:00Z", dose_slot: "MORNING", pouch_index: 1 }, { event_type: "POUCH_TAKEN", occurred_at: "2026-08-16T08:00:00Z", dose_slot: "MORNING", pouch_index: 2 }, { event_type: "POUCH_TAKEN", occurred_at: "2026-08-17T08:00:00Z", dose_slot: "MORNING", pouch_index: 3 }, { event_type: "POUCH_TAKEN", occurred_at: "2026-08-18T08:00:00Z", dose_slot: "MORNING", pouch_index: 4 }, { event_type: "POUCH_TAKEN", occurred_at: "2026-08-19T08:00:00Z", dose_slot: "MORNING", pouch_index: 5 }, { event_type: "POUCH_TAKEN", occurred_at: "2026-08-20T08:00:00Z", dose_slot: "MORNING", pouch_index: 6 }, { event_type: "POUCH_TAKEN", occurred_at: "2026-08-21T08:00:00Z", dose_slot: "MORNING", pouch_index: 7 }, { event_type: "POUCH_TAKEN", occurred_at: "2026-08-22T08:00:00Z", dose_slot: "MORNING", pouch_index: 8 }, { event_type: "POUCH_MISSED", occurred_at: "2026-08-23T08:00:00Z", dose_slot: "MORNING", pouch_index: 9 }] }
              as: Patient
              as_user_id: "${pt_id}"
              captures: { first_event: "$.data[0].id" }
            - call: "POST /pharmacy/patients/${pt_id}/dose-events"
              payload: { cycle_id: "${c0}", events: [{ event_type: "POUCH_TAKEN", occurred_at: "2026-08-08T00:00:00Z", dose_slot: "MORNING", pouch_index: 22 }, { event_type: "POUCH_MISSED", occurred_at: "2026-08-07T23:59:59Z", dose_slot: "MORNING", pouch_index: 21 }, { event_type: "POUCH_MISSED", occurred_at: "2026-07-20T08:00:00Z", dose_slot: "MORNING", pouch_index: 3 }, { event_type: "POUCH_MISSED", occurred_at: "2026-07-22T08:00:00Z", dose_slot: "MORNING", pouch_index: 5 }] }
              as: Patient
              as_user_id: "${pt_id}"
          assert:
            - "after the first batch Patient.${pt_id}.adherence_score_pct == 88 — floor(100 x 8 / 9) — and autoship_status is still ACTIVE"
            - "after the late second batch the score is re-derived to 90 — floor(100 x 9 / 10) — because only the 2026-08-08T00:00:00Z POUCH_TAKEN joins the window; the score RISES on a batch that contained three misses"
            - "the 2026-08-07T23:59:59Z, 2026-07-20 and 2026-07-22 POUCH_MISSED rows are persisted and returned by GET /pharmacy/adherence-events?cycle_id=${c0} (total_count 4) yet are outside [2026-08-08T00:00:00Z, 2026-09-05T00:00:00Z); counting them would give floor(100 x 9 / 13) == 69 and would have paused auto-ship"
            - "the window's lower bound is INCLUSIVE and its upper bound EXCLUSIVE, so the 2026-08-08T00:00:00Z event counts and an event stamped 2026-09-05T00:00:00Z would not"
            - "every created AdherenceEvent has source PATIENT_REPORTED because X-Role was Patient, and none carries a version field"
            - "autoship_status is ACTIVE throughout: 88 and 90 are both at or above ADHERENCE_PAUSE_THRESHOLD_PCT 80"

      - name: bridge_and_trim_variants_diverge_on_identical_history
        claim_type: variant_divergence
        grounds:
          - calculations.sync_alignment_days
        excluded_because:
          difficulty_instance: dual_variant_calc / sync_bridge_vs_trim_day_supply_on_cycle_line
          rationale: "That §1.8 instance runs both alignment variants over the same prescription history and asserts the day-supply delta line by line."
      - name: provisional_to_final_copay_delta_is_reconciled_as_a_credit
        claim_type: reconciliation
        grounds:
          - calculations.cycle_copay_cents
        excluded_because:
          difficulty_instance: combinatorial_formula / cycle_copay_tier_rate_coinsurance_and_final_rounding
          rationale: "The PINNED_ROUND_THEN_SUM total, the FINAL_SUM_THEN_ROUND total, the retained rounding_delta_cents and the ROUNDING_TRUEUP memo are all asserted there."
      - name: reissue_fee_tiers_are_read_off_the_retained_basis
        claim_type: tiered_pricing
        grounds:
          - calculations.partial_reissue_credit_cents
        excluded_because:
          difficulty_instance: combinatorial_formula / partial_reissue_fee_tier_read_off_retained_basis
          rationale: "That instance walks the fee tier boundaries (>= 5000 waived, >= 2000 reduced, otherwise full) against the post-credit basis."
      - name: reissue_credit_allocates_before_the_fee_is_deducted
        claim_type: waterfall_allocation
        grounds:
          - calculations.partial_reissue_credit_cents
        excluded_because:
          difficulty_instance: compensating_invariant / partial_reissue_conserves_every_billed_cent
          rationale: "The four ordered allocation steps and the cent-for-cent conservation identity are asserted end to end there."
      - name: refill_too_soon_threshold_is_inclusive_at_the_boundary
        claim_type: threshold
        grounds:
          - calculations.refill_pct_used
        excluded_because:
          difficulty_instance: boundary_precision_check / refill_too_soon_threshold_exact_boundary_on_adjudicate
          rationale: "threshold-1, threshold and threshold+1 are all exercised there against the plan's configured percentage."
      - name: rolling_and_cycle_scoped_adherence_scores_disagree
        claim_type: variant_divergence
        grounds:
          - calculations.adherence_score_pct
        excluded_because:
          difficulty_instance: dual_variant_calc / adherence_rolling_window_vs_cycle_scoped_score
          rationale: "Both denominators are computed from one event stream there, with only ROLLING_28_DAY able to pause auto-ship."

  - section: validations
    instances:

      - name: controlled_substance_blocks_any_vacation_override
        claim_type: violation_to_error
        grounds:
          - validations.priority_19
          - errors.ERR_CONTROLLED_SUBSTANCE_NO_OVERRIDE
          - entities.Prescription.fields.is_controlled
          - endpoints.POST_/pharmacy/vacation-exceptions/{id}/decide
        distinguishing_aspect: "The block is keyed on the PATIENT's regimen, not on the request: a controlled prescription anywhere in the ACTIVE set stops even the pharmacist-only approval, and no allowance is consumed."
        test_recipe:
          setup:
            - "logical clock at 2026-08-10T00:00:00Z; plan allows payer overrides and funds 1 per year"
            - "patient with one non-controlled tablet and one ACTIVE controlled tablet"
            - "a SUBMITTED travel request for 2026-08-20..2026-08-27 asking for 5 extra days"
          setup_api_calls:
            - call: "POST /pharmacy/_clock/set_current_utc"
              payload: { current_utc: "2026-08-10T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /pharmacy/insurance-plans"
              payload: { payer_name: "Northwind PBM", bin_number: "610502", generic_copay_cents_per_day: 34, brand_copay_cents_per_day: 74, specialty_copay_cents_per_day: 44, vacation_overrides_per_year: 1, allows_payer_vacation_override: true }
