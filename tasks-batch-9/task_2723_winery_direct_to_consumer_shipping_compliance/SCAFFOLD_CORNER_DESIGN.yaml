      - name: rolling_window_counts_the_exact_lower_edge_and_drops_the_instant_before
        claim_type: input_set_filtering
        grounds:
          - calculations.consumer_rolling_volume_liters
          - calculations.consumer_rolling_volume_liters.constants.ROLLING_12_MONTHS_DAYS
          - calculations.consumer_rolling_volume_liters.constants.ROLLING_30_DAYS_DAYS
          - endpoints.GET_/dtc/consumers/{id}/volume-summary
        distinguishing_aspect: |
          The window filter has three independent axes and each one is exercised by a ledger row that
          must NOT count: an entry one second before clock minus 365 days, an entry for a different state, and
          an entry for a different consumer. The entry sitting exactly on clock minus 365 days
          (2025-08-01T00:00:00Z against a 2026-08-01 clock) MUST count, because the lower edge is inclusive.
          The two states also run different periods — TX is ROLLING_12_MONTHS and NM is ROLLING_30_DAYS — so
          one consumer carries two differently-scoped windows at once.
