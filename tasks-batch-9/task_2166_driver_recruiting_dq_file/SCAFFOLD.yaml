# =============================================================================
# PRD Benchmark Scaffold — Truck Driver Recruiting & Qualification File Mgmt
# Difficulty target: beyond Expert (§0.4) — 14 entities, 58 endpoints,
# 44 error codes, 8 calculations, 11 state machines, 4 OCC races.
# =============================================================================
scenario: |
  desgin task harder than expert level.!!!!2166. Truck Driver Recruiting & Qualification File Management
  (carrier driver recruiting office): applicant screening & previous employer verification, MVR/PSP &
  criminal check, drug & alcohol clearinghouse query and consent, road test & orientation completion,
  DQ file completeness & annual review, medical certificate expiration & CDL downgrade risk, training
  school partnership & tuition reimbursement, turnover & re-hire eligibility

domain_name: driver-recruiting-dq-file

# Flat topology: every business resource is a top-level collection linked by explicit
# foreign keys. api_prefix is therefore the empty string and each endpoint path below
# is already the complete, absolute route (e.g. `/driver-applications/{application_id}`).
api_prefix: ""

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: workflow_orchestration
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - derived_field_reconciliation

  entity_topology: flat
  state_machine_shape: parallel
  # DriverApplication carries two independent state axes (screening_status ×
  # qualification_status) that join at QUALIFIED; DqFile carries (status × review_state);
  # EmploymentVerification / ScreeningCheck / DrugTestOrder / RoadTest / TuitionAgreement
  # are cyclic; DriverApplication and DqFile are additionally compound (derived from children).

  relationship_patterns:
    - one_to_many          # Carrier -> DriverApplicant -> DriverApplication -> checks
    - many_to_many         # OrientationEnrollment joins OrientationSession <-> DriverApplication
    - self_referential     # DriverApplication.prior_application_id, HireRecord.prior_hire_id
    - cross_aggregate      # DriverApplicant.cdl_downgrade_risk reads DqDocument rows across DqFiles

  role_model: segregation_of_duties
  consistency_model: immediate

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:

  - name: Carrier
    parent: null
    common_fields: true
    fields:
      - name: legal_name
        type: string
        source: input
        description: Registered motor-carrier legal name.
      - name: dot_number
        type: string
        source: input
        description: USDOT number; globally unique across Carrier rows.
        constraints: "unique across all Carrier rows; 1-12 characters"
      - name: safety_rating
        type: enum
        source: input
        description: FMCSA safety rating driving the MVR adjudication multiplier and the FROZEN posture.
        default: SATISFACTORY
        constraints: "one of {SATISFACTORY, CONDITIONAL, UNSATISFACTORY}"
      - name: open_requisitions
        type: integer
        source: input
        description: Number of funded driver seats the recruiting office may fill.
        constraints: ">= 0"
      - name: filled_requisitions
        type: integer
        source: computed
        description: "Count of HireRecord rows with carrier_id == this Carrier.id AND status == ACTIVE. Recomputed by calculations.carrier_posture."
        default: 0
      - name: mvr_validity_days
        type: integer
        source: input
        description: Days an MVR ScreeningCheck stays current after issued_on.
        default: 365
        constraints: ">= 1"
      - name: annual_review_interval_days
        type: integer
        source: input
        description: Days between DQ-file annual reviews.
        default: 365
        constraints: ">= 1"
      - name: annual_review_grace_days
        type: integer
        source: input
        description: Grace days after next_review_due_on before a DqFile becomes OVERDUE.
        default: 30
        constraints: ">= 0"
      - name: mvr_point_threshold
        type: integer
        source: input
        description: Adjudication score at or above which an MVR ScreeningCheck is disqualifying (>= comparison).
        default: 7
        constraints: ">= 1"
      - name: rehire_cooldown_days
        type: integer
        source: input
        description: Days after terminated_on during which a voluntarily-separated driver is in COOLDOWN.
        default: 180
        constraints: ">= 0"
      - name: medical_cert_grace_days
        type: integer
        source: input
        description: Days after a medical certificate's expires_on before the CDL is treated as DOWNGRADED.
        default: 15
        constraints: ">= 0"
      - name: deficiency_ratio
        type: number
        source: computed
        description: "Ratio of DEFICIENT DQ files among actively-hired drivers. Recomputed by calculations.carrier_posture."
        default: 0.0
      - name: posture
        type: enum
        source: computed
        description: "Derived gate over all hiring operations. Recomputed by calculations.carrier_posture."
        default: OPEN
        constraints: "one of {OPEN, RESTRICTED, FROZEN}"

  - name: DriverApplicant
    parent: null
    common_fields: true
    fields:
      - name: carrier_id
        type: string
        source: input
        description: "FK -> Carrier.id; the recruiting office that owns this applicant record."
      - name: full_name
        type: string
        source: input
        description: Applicant legal name.
      - name: date_of_birth
        type: string
        source: input
        description: "Date of birth, ISO 8601 calendar date (YYYY-MM-DD)."
      - name: email
        type: string
        source: input
        description: Contact e-mail; unique within a Carrier.
        constraints: "unique per carrier_id"
      - name: cdl_number
        type: string
        source: input
        description: Commercial driver licence number as printed.
      - name: cdl_state
        type: string
        source: input
        description: Two-letter issuing jurisdiction code.
        constraints: "exactly 2 uppercase letters"
      - name: cdl_class
        type: enum
        source: input
        description: Licence class held.
        constraints: "one of {CLASS_A, CLASS_B, CLASS_C}"
      - name: experience_months
        type: integer
        source: input
        description: Months of verified Class-A/B driving experience; feeds the MVR experience credit.
        constraints: ">= 0"
      - name: cdl_downgrade_risk
        type: enum
        source: computed
        description: "Cross-aggregate risk band derived from the governing MEDICAL_CERT DqDocument. Recomputed by calculations.cdl_downgrade_risk."
        default: NO_CERTIFICATE
        constraints: "one of {NO_CERTIFICATE, NONE, WATCH, IMMINENT, EXPIRED_GRACE, DOWNGRADED}"
      - name: governing_medical_cert_expires_on
        type: string
        source: computed
        description: "expires_on of the MEDICAL_CERT DqDocument selected by calculations.cdl_downgrade_risk; null when none exists."
        default: null
      - name: rehire_eligibility
        type: enum
        source: computed
        description: "Recomputed by calculations.rehire_eligibility from this applicant's HireRecord and TuitionAgreement rows."
        default: ELIGIBLE
        constraints: "one of {ELIGIBLE, COOLDOWN, PERMANENTLY_INELIGIBLE}"
      - name: outstanding_clawback_cents
        type: integer
        source: computed
        description: "Sum of TuitionAgreement.clawback_cents over this applicant's agreements with status == TERMINATED_CLAWBACK."
        default: 0

  - name: DriverApplication
    parent: null
    common_fields: true
    fields:
      - name: applicant_id
        type: string
        source: input
        description: "FK -> DriverApplicant.id; the person applying."
      - name: carrier_id
        type: string
        source: system
        description: "FK -> Carrier.id; copied from the applicant at creation."
      - name: prior_application_id
        type: string
        source: input
        description: "FK -> DriverApplication.id; the superseded application this one re-applies against; null for a first application."
        default: null
      - name: position_type
        type: enum
        source: input
        description: Requisition type applied for.
        constraints: "one of {OTR, REGIONAL, LOCAL}"
      - name: screening_status
        type: enum
        source: computed
        description: "State axis A — background/consent pipeline. See state_machines.DriverApplication."
        default: DRAFT
        constraints: "one of {DRAFT, SUBMITTED, SCREENING, INFO_REQUESTED, SCREEN_CLEARED, SCREEN_FAILED}"
      - name: qualification_status
        type: enum
        source: computed
        description: "State axis B — road test / orientation / DQ pipeline. See state_machines.DriverApplication."
        default: NOT_STARTED
        constraints: "one of {NOT_STARTED, IN_PROGRESS, ROAD_TEST_PASSED, ORIENTATION_COMPLETE, QUALIFIED, HIRED, DISQUALIFIED}"
      - name: revision_round
        type: integer
        source: computed
        description: "Number of completed INFO_REQUESTED -> SCREENING cycles; incremented by POST /driver-applications/{application_id}/resubmit-info."
        default: 0
      - name: submitted_at
        type: datetime
        source: system
        description: "Logical-clock instant at which submit succeeded; null while DRAFT."
        default: null
      - name: recruiter_user_id
        type: string
        source: system
        description: "X-User-ID of the Recruiter that called submit; the segregation-of-duties anchor."
        default: null
      - name: verified_coverage_days
        type: integer
        source: computed
        description: "Merged verified employment days inside the 1095-day lookback. Recomputed by calculations.employment_history_coverage (strict_verified variant)."
        default: 0
      - name: gap_days_unexplained
        type: integer
        source: computed
        description: "1095 - verified_coverage_days under the strict_verified variant."
        default: 1095
      - name: disqualifying_reason
        type: string
        source: computed
        description: "Machine reason token recorded when qualification_status becomes DISQUALIFIED; null otherwise."
        default: null

  - name: EmploymentVerification
    parent: null
    common_fields: true
    fields:
      - name: application_id
        type: string
        source: input
        description: "FK -> DriverApplication.id; the application this employment segment belongs to."
      - name: employer_name
        type: string
        source: input
        description: Previous employer legal name.
      - name: is_dot_regulated
        type: boolean
        source: input
        description: True when the previous employer was a DOT-regulated motor carrier (triggers safety-performance history duty).
      - name: employed_from
        type: string
        source: input
        description: "Inclusive start calendar date (YYYY-MM-DD) of the employment segment."
      - name: employed_to
        type: string
        source: input
        description: "Exclusive end calendar date (YYYY-MM-DD) of the employment segment; must be strictly after employed_from."
      - name: status
        type: enum
        source: computed
        description: "See state_machines.EmploymentVerification."
        default: PENDING
        constraints: "one of {PENDING, REQUESTED, NO_RESPONSE, RESPONDED_VERIFIED, RESPONDED_DISPUTED, GOOD_FAITH_DOCUMENTED}"
      - name: request_round
        type: integer
        source: computed
        description: "Number of send-request calls issued so far."
        default: 0
      - name: last_requested_at
        type: datetime
        source: system
        description: "Logical-clock instant of the most recent send-request; null before the first."
        default: null
      - name: safety_performance_history_received
        type: boolean
        source: input
        description: Recorded on record-response; whether the DOT safety-performance history came back.
        default: false
      - name: drug_alcohol_violation_reported
        type: boolean
        source: input
        description: Recorded on record-response; whether the prior employer reported a drug/alcohol violation.
        default: false

  - name: ScreeningCheck
    parent: null
    common_fields: true
    fields:
      - name: application_id
        type: string
        source: input
        description: "FK -> DriverApplication.id; the application being screened."
      - name: check_type
        type: enum
        source: input
        description: Which third-party report this row tracks.
        constraints: "one of {MVR, PSP, CRIMINAL}; at most one non-terminal row per (application_id, check_type)"
      - name: status
        type: enum
        source: computed
        description: "See state_machines.ScreeningCheck."
        default: ORDERED
        constraints: "one of {ORDERED, RECEIVED, PRE_ADVERSE, DISPUTED, ADJUDICATED_PASS, ADVERSE_FINAL}"
      - name: issued_on
        type: string
        source: input
        description: "Calendar date (YYYY-MM-DD) the report was issued by the source; recorded on record-result."
        default: null
      - name: expires_on
        type: string
        source: computed
        description: "issued_on + Carrier.mvr_validity_days for check_type == MVR; null for PSP and CRIMINAL."
        default: null
      - name: violation_points
        type: integer
        source: input
        description: Raw moving-violation points on the report.
        default: 0
      - name: serious_violation_count
        type: integer
        source: input
        description: Count of FMCSA serious violations on the report.
        default: 0
      - name: crash_preventable_count
        type: integer
        source: input
        description: Count of preventable crashes on the report.
        default: 0
      - name: adjudication_score
        type: number
        source: computed
        description: "Recomputed by calculations.mvr_adjudication_score on record-result."
        default: 0.0
      - name: pre_adverse_at
        type: datetime
        source: system
        description: "Logical-clock instant the PRE_ADVERSE notice was issued; opens the 5-day dispute window."
        default: null

  - name: ClearinghouseQuery
    parent: null
    common_fields: true
    fields:
      - name: application_id
        type: string
        source: input
        description: "FK -> DriverApplication.id; the application this query covers."
      - name: query_type
        type: enum
        source: input
        description: LIMITED queries need only general consent; FULL queries need electronic consent recorded in the Clearinghouse.
        constraints: "one of {LIMITED, FULL}"
      - name: status
        type: enum
        source: computed
        description: "See state_machines.ClearinghouseQuery."
        default: CONSENT_PENDING
        constraints: "one of {CONSENT_PENDING, CONSENT_GRANTED, CONSENT_DENIED, RESULT_CLEAR, RESULT_INFO_EXISTS, RESULT_PROHIBITED}"
      - name: consent_granted_at
        type: datetime
        source: system
        description: "Logical-clock instant the applicant granted consent; null otherwise."
        default: null
      - name: consent_expires_on
        type: string
        source: computed
        description: "consent_granted_at date + CONSENT_VALIDITY_DAYS (365); null before consent."
        default: null
      - name: result
        type: enum
        source: input
        description: Result token recorded by the DER on record-result.
        default: PENDING
        constraints: "one of {PENDING, NO_INFO, INFORMATION_EXISTS, PROHIBITED}"
      - name: follow_up_full_query_id
        type: string
        source: computed
        description: "FK -> ClearinghouseQuery.id; set on a LIMITED query when a FULL query is created for the same application after INFORMATION_EXISTS."
        default: null

  - name: DrugTestOrder
    parent: null
    common_fields: true
    fields:
      - name: application_id
        type: string
        source: input
        description: "FK -> DriverApplication.id; the application this specimen belongs to."
      - name: test_type
        type: enum
        source: input
        description: Regulatory reason for the test.
        constraints: "one of {PRE_EMPLOYMENT, RETURN_TO_DUTY}"
      - name: status
        type: enum
        source: computed
        description: "See state_machines.DrugTestOrder."
        default: ORDERED
        constraints: "one of {ORDERED, COLLECTED, LAB_NEGATIVE, LAB_POSITIVE, LAB_DILUTE, MRO_VERIFIED_NEGATIVE, MRO_VERIFIED_POSITIVE}"
      - name: collected_at
        type: datetime
        source: input
        description: "Logical-clock instant of the most recent specimen collection; null before the first collection."
        default: null
      - name: dilute_recollect_count
        type: integer
        source: computed
        description: "Number of LAB_DILUTE -> COLLECTED recollections performed."
        default: 0

  - name: RoadTest
    parent: null
    common_fields: true
    fields:
      - name: application_id
        type: string
        source: input
        description: "FK -> DriverApplication.id; the application being road-tested."
      - name: examiner_user_id
        type: string
        source: input
        description: Opaque X-User-ID of the SafetyDirector examiner who will conduct the test.
      - name: scheduled_at
        type: datetime
        source: input
        description: "ISO 8601 UTC start instant of the examiner slot."
      - name: vehicle_class
        type: enum
        source: input
        description: Vehicle class the test is conducted in.
        constraints: "one of {CLASS_A, CLASS_B, CLASS_C}"
      - name: status
        type: enum
        source: computed
        description: "See state_machines.RoadTest."
        default: SCHEDULED
        constraints: "one of {SCHEDULED, PASSED, FAILED, NO_SHOW}"
      - name: attempt_number
        type: integer
        source: computed
        description: "1 on creation; incremented by each reschedule."
        default: 1
      - name: score_pretrip
        type: integer
        source: input
        description: Pre-trip inspection sub-score 0-100.
        default: null
        constraints: "0 <= value <= 100"
      - name: score_skills
        type: integer
        source: input
        description: Basic control skills sub-score 0-100.
        default: null
        constraints: "0 <= value <= 100"
      - name: score_road
        type: integer
        source: input
        description: On-road driving sub-score 0-100.
        default: null
        constraints: "0 <= value <= 100"
      - name: composite_score
        type: number
        source: computed
        description: "Recomputed by calculations.road_test_composite_score on record-result."
        default: null

  - name: OrientationSession
    parent: null
    common_fields: true
    fields:
      - name: carrier_id
        type: string
        source: input
        description: "FK -> Carrier.id; the recruiting office running the session."
      - name: starts_at
        type: datetime
        source: input
        description: "ISO 8601 UTC inclusive start of the session interval."
      - name: ends_at
        type: datetime
        source: input
        description: "ISO 8601 UTC exclusive end of the session interval; must be strictly after starts_at."
      - name: capacity
        type: integer
        source: input
        description: Maximum number of non-cancelled enrollments the session may hold at once (status IN {RESERVED, ATTENDED, ABSENT}).
        constraints: ">= 1"
      - name: location_code
        type: string
        source: input
        description: Terminal / classroom code.
      - name: enrolled_count
        type: integer
        source: computed
        description: "Count of OrientationEnrollment rows for this session with status IN {RESERVED, ATTENDED, ABSENT}."
        default: 0
      - name: status
        type: enum
        source: computed
        description: "See state_machines.OrientationSession."
        default: PLANNED
        constraints: "one of {PLANNED, OPEN, COMPLETED}"

  - name: OrientationEnrollment
    parent: null
    common_fields: true
    fields:
      - name: session_id
        type: string
        source: input
        description: "FK -> OrientationSession.id; the session seat consumed."
      - name: application_id
        type: string
        source: input
        description: "FK -> DriverApplication.id; the application occupying the seat."
      - name: status
        type: enum
        source: computed
        description: "See state_machines.OrientationEnrollment."
        default: RESERVED
        constraints: "one of {RESERVED, ATTENDED, ABSENT, CANCELLED}"

  - name: DqFile
    parent: null
    common_fields: true
    fields:
      - name: application_id
        type: string
        source: system
        description: "FK -> DriverApplication.id; created 1:1 by POST /driver-applications/{application_id}/submit."
      - name: status
        type: enum
        source: computed
        description: "State axis A — completeness posture. See state_machines.DqFile."
        default: OPEN
        constraints: "one of {OPEN, COMPLETE, DEFICIENT, ARCHIVED}"
      - name: review_state
        type: enum
        source: computed
        description: "State axis B — annual-review clock. Recomputed by calculations.dq_review_schedule."
        default: NOT_DUE
        constraints: "one of {NOT_DUE, DUE, OVERDUE}"
      - name: completeness_pct
        type: number
        source: computed
        description: "pre_hire_provisional variant of calculations.dq_completeness_score, 2 decimals."
        default: 0.0
      - name: deficiency_count
        type: integer
        source: computed
        description: "Count of in-scope DqDocument rows NOT satisfied under the pre_hire_provisional variant."
        default: 10
      - name: total_weight
        type: integer
        source: computed
        description: "Sum of weight over every DqDocument row of this file, in-scope or not; fixed at 33 by the seeded document set."
        default: 33
      - name: opened_on
        type: string
        source: system
        description: "Calendar date (YYYY-MM-DD) the file was created by submit; the review baseline when no review has happened."
      - name: last_annual_review_at
        type: datetime
        source: system
        description: "Logical-clock instant of the most recent successful annual review; null when never reviewed."
        default: null
      - name: next_review_due_on
        type: string
        source: computed
        description: "Recomputed by calculations.dq_review_schedule."
      - name: certified_by_user_id
        type: string
        source: system
        description: "X-User-ID of the ComplianceAuditor who certified the most recent annual review; null when never certified."
        default: null

  - name: DqDocument
    parent: null
    common_fields: true
    fields:
      - name: dq_file_id
        type: string
        source: system
        description: "FK -> DqFile.id; the twelve rows are seeded by submit, one per doc_type."
      - name: doc_type
        type: enum
        source: system
        description: Which regulatory artifact this row tracks.
        constraints: "one of {APPLICATION_FORM, CDL_COPY, MVR_INITIAL, PSP_REPORT, CRIMINAL_CHECK, EMPLOYMENT_VERIFICATION, CLEARINGHOUSE_QUERY, DRUG_TEST_RESULT, ROAD_TEST_CERT, MEDICAL_CERT, MVR_ANNUAL, ANNUAL_REVIEW_CERT}"
      - name: weight
        type: integer
        source: system
        description: "Completeness weight fixed per doc_type: APPLICATION_FORM 3, CDL_COPY 2, MVR_INITIAL 3, PSP_REPORT 2, CRIMINAL_CHECK 1, EMPLOYMENT_VERIFICATION 4, CLEARINGHOUSE_QUERY 3, DRUG_TEST_RESULT 3, ROAD_TEST_CERT 3, MEDICAL_CERT 4, MVR_ANNUAL 3, ANNUAL_REVIEW_CERT 2."
      - name: status
        type: enum
        source: input
        description: Presence state of the artifact in the file.
        default: MISSING
        constraints: "one of {MISSING, PRESENT, EXPIRED, WAIVED}"
      - name: effective_on
        type: string
        source: input
        description: "Calendar date (YYYY-MM-DD) the artifact became effective; null when MISSING."
        default: null
      - name: expires_on
        type: string
        source: input
        description: "Calendar date (YYYY-MM-DD) the artifact expires; null when the artifact never expires."
        default: null
      - name: source_ref
        type: string
        source: input
        description: Free-text pointer to the originating record (e.g. a ScreeningCheck id or a medical examiner registry number).
        default: null

  - name: TuitionAgreement
    parent: null
    common_fields: true
    fields:
      - name: applicant_id
        type: string
        source: input
        description: "FK -> DriverApplicant.id; the driver whose CDL school tuition is reimbursed."
      - name: school_name
        type: string
        source: input
        description: Partner CDL school legal name.
      - name: tuition_total_cents
        type: integer
        source: input
        description: Principal tuition amount, in cents, subject to reimbursement.
        constraints: ">= 1"
      - name: commitment_months
        type: integer
        source: input
        description: Months of service required to fully retire the principal.
        constraints: ">= 1"
      - name: base_monthly_cents
        type: integer
        source: computed
        description: "Step 1 of calculations.tuition_schedule: floor(tuition_total_cents / commitment_months)."
        default: 0
      - name: monthly_reimbursement_cents
        type: integer
        source: computed
        description: "Step 3 of calculations.tuition_schedule: base_monthly_cents plus the retention bonus keyed on base_monthly_cents."
        default: 0
      - name: forgiven_cents
        type: integer
        source: computed
        description: "Floor remainder forgiven at activation: tuition_total_cents - base_monthly_cents * commitment_months."
        default: 0
      - name: months_served
        type: integer
        source: computed
        description: Number of accepted accrue-month calls.
        default: 0
      - name: reimbursed_cents
        type: integer
        source: computed
        description: "months_served * base_monthly_cents — the principal retired so far."
        default: 0
      - name: bonus_paid_cents
        type: integer
        source: computed
        description: "months_served * (monthly_reimbursement_cents - base_monthly_cents) — retention incentive, outside the principal."
        default: 0
      - name: clawback_cents
        type: integer
        source: computed
        description: "Principal moved out of outstanding_cents when the agreement is terminated for cause; zero otherwise."
        default: 0
      - name: outstanding_cents
        type: integer
        source: computed
        description: "tuition_total_cents - forgiven_cents - reimbursed_cents - clawback_cents; the live principal balance."
        default: 0
      - name: status
        type: enum
        source: computed
        description: "See state_machines.TuitionAgreement."
        default: PENDING
        constraints: "one of {PENDING, ACTIVE, FULFILLED, TERMINATED_CLAWBACK}"

  - name: HireRecord
    parent: null
    common_fields: true
    fields:
      - name: application_id
        type: string
        source: input
        description: "FK -> DriverApplication.id; the qualified application being hired."
      - name: applicant_id
        type: string
        source: system
        description: "FK -> DriverApplicant.id; copied from the application."
      - name: carrier_id
        type: string
        source: system
        description: "FK -> Carrier.id; copied from the application."
      - name: prior_hire_id
        type: string
        source: computed
        description: "FK -> HireRecord.id; the most recent TERMINATED HireRecord of the same applicant at the same carrier, or null."
        default: null
      - name: hired_on
        type: string
        source: input
        description: "Calendar date (YYYY-MM-DD) employment begins."
      - name: terminated_on
        type: string
        source: input
        description: "Calendar date (YYYY-MM-DD) employment ends; null while ACTIVE."
        default: null
      - name: termination_type
        type: enum
        source: input
        description: Separation classification recorded on terminate.
        default: NONE
        constraints: "one of {NONE, VOLUNTARY, INVOLUNTARY_PERFORMANCE, INVOLUNTARY_SAFETY, ABANDONMENT}"
      - name: rehire_flag
        type: enum
        source: input
        description: Recruiter-visible re-hire marker recorded on terminate.
        default: ELIGIBLE
        constraints: "one of {ELIGIBLE, NOT_ELIGIBLE, CONDITIONAL}"
      - name: tenure_days
        type: integer
        source: computed
        description: "terminated_on - hired_on in days; 0 while ACTIVE."
        default: 0
      - name: status
        type: enum
        source: computed
        description: "See state_machines.HireRecord."
        default: ACTIVE
        constraints: "one of {ACTIVE, TERMINATED, RESCINDED}"

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:

  # ---------------------------------------------------------------------------
  # PARALLEL DIMENSIONS: screening_status (axis A) and qualification_status
  # (axis B) advance independently on the same DriverApplication row and join
  # only at ORIENTATION_COMPLETE -> QUALIFIED.
  # ---------------------------------------------------------------------------
  - entity: DriverApplication
    state_field: screening_status
    initial_state: DRAFT
    terminal_states: [SCREEN_FAILED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /driver-applications/{application_id}/submit"
        actor: Recruiter
        preconditions:
          - "screening_status == DRAFT"
          - "Carrier.posture IN {OPEN, RESTRICTED}"
          - "DriverApplicant.rehire_eligibility != PERMANENTLY_INELIGIBLE"
        side_effects:
          - "sets submitted_at to the current logical clock instant"
          - "sets recruiter_user_id to the calling X-User-ID"
          - "sets qualification_status to IN_PROGRESS (axis B)"
          - "creates the 1:1 DqFile with status OPEN, review_state NOT_DUE, opened_on = clock date, total_weight 33"
          - "creates twelve DqDocument rows (one per doc_type) all with status MISSING"
          - "sets the APPLICATION_FORM DqDocument to PRESENT with effective_on = clock date"
          - "recomputes DqFile.completeness_pct and DqFile.deficiency_count (calculations.dq_completeness_score, pre_hire_provisional)"
          - "recomputes DqFile.next_review_due_on and review_state (calculations.dq_review_schedule)"
          - "recomputes verified_coverage_days and gap_days_unexplained (calculations.employment_history_coverage, strict_verified)"
        note: "Submit is the only producer of DqFile and DqDocument rows; neither has a create endpoint."
      - from: SUBMITTED
        to: SCREENING
        trigger: "system, on the first successful POST /screening-checks for this application"
        actor: system
        preconditions:
          - "screening_status == SUBMITTED"
        side_effects:
          - "no field changes other than screening_status and updated_at"
      - from: SCREENING
        to: INFO_REQUESTED
        trigger: "POST /driver-applications/{application_id}/request-info"
        actor: SafetyDirector
        preconditions:
          - "screening_status == SCREENING"
        side_effects:
          - "records the reason token in disqualifying_reason as null (unchanged); only screening_status and updated_at change"
      - from: INFO_REQUESTED
        to: SCREENING
        trigger: "POST /driver-applications/{application_id}/resubmit-info"
        actor: Recruiter
        preconditions:
          - "screening_status == INFO_REQUESTED"
          - "revision_round < 3"
        side_effects:
          - "increments revision_round by 1"
        note: "CYCLE. Third resubmission is the last one accepted; revision_round == 3 blocks further request-info/resubmit-info rounds."
      - from: SCREENING
        to: SCREEN_CLEARED
        trigger: "system, re-evaluated after every ScreeningCheck / ClearinghouseQuery / DrugTestOrder terminal transition"
        actor: system
        preconditions:
          - "exactly one ScreeningCheck row exists for each of check_type MVR, PSP and CRIMINAL and all three have status == ADJUDICATED_PASS"
          - "at least one ClearinghouseQuery row for this application has status == RESULT_CLEAR"
          - "at least one DrugTestOrder row with test_type == PRE_EMPLOYMENT has status == MRO_VERIFIED_NEGATIVE"
        side_effects:
          - "re-evaluates the ORIENTATION_COMPLETE -> QUALIFIED join on axis B"
      - from: SCREENING
        to: SCREEN_FAILED
        trigger: "system cascade from ScreeningCheck ADVERSE_FINAL, ClearinghouseQuery CONSENT_DENIED / RESULT_PROHIBITED, or DrugTestOrder MRO_VERIFIED_POSITIVE"
        actor: system
        preconditions:
          - "screening_status IN {SUBMITTED, SCREENING, INFO_REQUESTED}"
        side_effects:
          - "sets qualification_status to DISQUALIFIED with the corresponding disqualifying_reason token (axis B)"
      - from: INFO_REQUESTED
        to: SCREEN_FAILED
        trigger: "POST /driver-applications/{application_id}/disqualify"
        actor: SafetyDirector
        preconditions:
          - "screening_status IN {SUBMITTED, SCREENING, INFO_REQUESTED}"
        side_effects:
          - "sets qualification_status to DISQUALIFIED and disqualifying_reason to the supplied reason token"

  - entity: DriverApplication
    state_field: qualification_status
    initial_state: NOT_STARTED
    terminal_states: [HIRED, DISQUALIFIED]
    transitions:
      - from: NOT_STARTED
        to: IN_PROGRESS
        trigger: "system, side effect of POST /driver-applications/{application_id}/submit"
        actor: system
        preconditions:
          - "qualification_status == NOT_STARTED"
        side_effects:
          - "none beyond the submit side-effect list"
      - from: IN_PROGRESS
        to: ROAD_TEST_PASSED
        trigger: "system, side effect of POST /road-tests/{road_test_id}/record-result with outcome PASSED"
        actor: system
        preconditions:
          - "qualification_status == IN_PROGRESS"
        side_effects:
          - "sets the ROAD_TEST_CERT DqDocument of this application's DqFile to PRESENT with effective_on = clock date"
          - "recomputes DqFile.completeness_pct, deficiency_count and status (calculations.dq_completeness_score, pre_hire_provisional)"
          - "increments DqFile.version by 1"
      - from: ROAD_TEST_PASSED
        to: ORIENTATION_COMPLETE
        trigger: "system, side effect of POST /orientation-sessions/{session_id}/complete when this application's enrollment is in attended_enrollment_ids"
        actor: system
        preconditions:
          - "qualification_status == ROAD_TEST_PASSED"
          - "the application's OrientationEnrollment for that session has status RESERVED"
        side_effects:
          - "re-evaluates the ORIENTATION_COMPLETE -> QUALIFIED join"
      - from: ORIENTATION_COMPLETE
        to: QUALIFIED
        trigger: "system, re-evaluated after orientation completion, after screening_status becomes SCREEN_CLEARED, and after any DqFile.status change"
        actor: system
        preconditions:
          - "qualification_status == ORIENTATION_COMPLETE"
          - "screening_status == SCREEN_CLEARED"
          - "the 1:1 DqFile has status == COMPLETE"
        side_effects:
          - "none beyond qualification_status and updated_at"
        note: "JOIN of axis A and axis B. Whichever of the three conditions is satisfied last performs the transition."
      - from: QUALIFIED
        to: HIRED
        trigger: "system, side effect of POST /hire-records"
        actor: system
        preconditions:
          - "qualification_status == QUALIFIED"
        side_effects:
          - "none beyond qualification_status and updated_at"
      - from: ORIENTATION_COMPLETE
        to: DISQUALIFIED
        trigger: "POST /driver-applications/{application_id}/disqualify, or system cascade from screening_status -> SCREEN_FAILED, or system cascade from DriverApplicant.rehire_eligibility -> PERMANENTLY_INELIGIBLE"
        actor: SafetyDirector
        preconditions:
          - "qualification_status IN {IN_PROGRESS, ROAD_TEST_PASSED, ORIENTATION_COMPLETE, QUALIFIED}"
        side_effects:
          - "sets disqualifying_reason to the reason token"
          - "cancels every OrientationEnrollment of this application whose status == RESERVED (each cancellation decrements OrientationSession.enrolled_count by 1 and increments that session's version by 1)"
          - "sets the 1:1 DqFile.status to ARCHIVED and increments DqFile.version by 1"
          - "recomputes Carrier.filled_requisitions, deficiency_ratio and posture (calculations.carrier_posture)"
      - from: QUALIFIED
        to: DISQUALIFIED
        trigger: "POST /driver-applications/{application_id}/disqualify"
        actor: SafetyDirector
        preconditions:
          - "qualification_status == QUALIFIED"
        side_effects:
          - "identical to the ORIENTATION_COMPLETE -> DISQUALIFIED side-effect list"

  - entity: EmploymentVerification
    initial_state: PENDING
    terminal_states: [RESPONDED_VERIFIED, RESPONDED_DISPUTED, GOOD_FAITH_DOCUMENTED]
    transitions:
      - from: PENDING
        to: REQUESTED
        trigger: "POST /employment-verifications/{verification_id}/send-request"
        actor: Recruiter
        preconditions:
          - "status IN {PENDING, NO_RESPONSE}"
          - "the parent DriverApplication.screening_status != SCREEN_FAILED"
        side_effects:
          - "increments request_round by 1"
          - "sets last_requested_at to the current logical clock instant"
      - from: NO_RESPONSE
        to: REQUESTED
        trigger: "POST /employment-verifications/{verification_id}/send-request"
        actor: Recruiter
        preconditions:
          - "status == NO_RESPONSE"
          - "request_round < 3"
        side_effects:
          - "increments request_round by 1"
          - "sets last_requested_at to the current logical clock instant"
        note: "CYCLE — REQUESTED -> NO_RESPONSE -> REQUESTED repeats until request_round reaches 3."
      - from: REQUESTED
        to: NO_RESPONSE
        trigger: "POST /employment-verifications/{verification_id}/mark-no-response"
        actor: Recruiter
        preconditions:
          - "status == REQUESTED"
          - "current logical clock >= last_requested_at + NO_RESPONSE_WAIT_DAYS (14) days"
          - "request_round < 3"
        side_effects:
          - "none beyond status and updated_at"
      - from: REQUESTED
        to: GOOD_FAITH_DOCUMENTED
        trigger: "POST /employment-verifications/{verification_id}/mark-no-response"
        actor: Recruiter
        preconditions:
          - "status == REQUESTED"
          - "current logical clock >= last_requested_at + NO_RESPONSE_WAIT_DAYS (14) days"
          - "request_round >= 3"
        side_effects:
          - "recomputes the parent DriverApplication.verified_coverage_days and gap_days_unexplained under the strict_verified variant (a GOOD_FAITH_DOCUMENTED segment is NOT counted there)"
        note: "BRANCH — the same trigger from the same state lands in NO_RESPONSE or GOOD_FAITH_DOCUMENTED depending on request_round."
      - from: REQUESTED
        to: RESPONDED_VERIFIED
        trigger: "POST /employment-verifications/{verification_id}/record-response with outcome VERIFIED"
        actor: Recruiter
        preconditions:
          - "status == REQUESTED"
        side_effects:
          - "stores safety_performance_history_received and drug_alcohol_violation_reported"
          - "recomputes the parent DriverApplication.verified_coverage_days and gap_days_unexplained (calculations.employment_history_coverage, strict_verified)"
          - "when the recomputed gap_days_unexplained <= MAX_UNEXPLAINED_GAP_DAYS (30), sets the EMPLOYMENT_VERIFICATION DqDocument of the application's DqFile to PRESENT with effective_on = clock date, recomputes DqFile.completeness_pct / deficiency_count / status, and increments DqFile.version by 1"
      - from: REQUESTED
        to: RESPONDED_DISPUTED
        trigger: "POST /employment-verifications/{verification_id}/record-response with outcome DISPUTED"
        actor: Recruiter
        preconditions:
          - "status == REQUESTED"
        side_effects:
          - "stores safety_performance_history_received and drug_alcohol_violation_reported"
          - "when drug_alcohol_violation_reported == true, cascades DriverApplication.screening_status to SCREEN_FAILED with disqualifying_reason PRIOR_DA_VIOLATION"

  - entity: ScreeningCheck
    initial_state: ORDERED
    terminal_states: [ADJUDICATED_PASS, ADVERSE_FINAL]
    transitions:
      - from: ORDERED
        to: RECEIVED
        trigger: "POST /screening-checks/{screening_check_id}/record-result"
        actor: Recruiter
        preconditions:
          - "status IN {ORDERED, DISPUTED}"
        side_effects:
          - "stores issued_on, violation_points, serious_violation_count, crash_preventable_count"
          - "computes expires_on (issued_on + Carrier.mvr_validity_days) when check_type == MVR, otherwise null"
          - "computes adjudication_score (calculations.mvr_adjudication_score)"
      - from: DISPUTED
        to: RECEIVED
        trigger: "POST /screening-checks/{screening_check_id}/record-result"
        actor: Recruiter
        preconditions:
          - "status == DISPUTED"
        side_effects:
          - "identical to ORDERED -> RECEIVED; the corrected report overwrites the prior figures"
        note: "CYCLE — RECEIVED -> PRE_ADVERSE -> DISPUTED -> RECEIVED is the FCRA re-investigation loop."
      - from: RECEIVED
        to: ADJUDICATED_PASS
        trigger: "POST /screening-checks/{screening_check_id}/adjudicate with decision PASS"
        actor: SafetyDirector
        preconditions:
          - "status == RECEIVED"
          - "check_type != MVR OR adjudication_score < Carrier.mvr_point_threshold"
        side_effects:
          - "sets the DqDocument of the application's DqFile matching this check_type (MVR -> MVR_INITIAL, PSP -> PSP_REPORT, CRIMINAL -> CRIMINAL_CHECK) to PRESENT with effective_on = issued_on and expires_on = this check's expires_on"
          - "recomputes DqFile.completeness_pct, deficiency_count and status; increments DqFile.version by 1"
          - "re-evaluates DriverApplication.screening_status SCREENING -> SCREEN_CLEARED"
      - from: RECEIVED
        to: PRE_ADVERSE
        trigger: "POST /screening-checks/{screening_check_id}/adjudicate with decision PRE_ADVERSE"
        actor: SafetyDirector
        preconditions:
          - "status == RECEIVED"
        side_effects:
          - "sets pre_adverse_at to the current logical clock instant, opening the DISPUTE_WINDOW_DAYS (5) window"
      - from: PRE_ADVERSE
        to: DISPUTED
        trigger: "POST /screening-checks/{screening_check_id}/dispute"
        actor: Applicant
        preconditions:
          - "status == PRE_ADVERSE"
          - "current logical clock < pre_adverse_at + DISPUTE_WINDOW_DAYS (5) days"
        side_effects:
          - "clears pre_adverse_at back to null"
      - from: PRE_ADVERSE
        to: ADVERSE_FINAL
        trigger: "POST /screening-checks/{screening_check_id}/adjudicate with decision ADVERSE_FINAL"
        actor: SafetyDirector
        preconditions:
          - "status == PRE_ADVERSE"
          - "current logical clock >= pre_adverse_at + DISPUTE_WINDOW_DAYS (5) days"
        side_effects:
          - "cascades DriverApplication.screening_status to SCREEN_FAILED with disqualifying_reason ADVERSE_SCREENING, which in turn sets qualification_status to DISQUALIFIED, which in turn ARCHIVEs the DqFile and cancels RESERVED enrollments"
        note: "BRANCH — RECEIVED forks into ADJUDICATED_PASS and PRE_ADVERSE with entirely different side-effect sets."

  - entity: ClearinghouseQuery
    initial_state: CONSENT_PENDING
    terminal_states: [CONSENT_DENIED, RESULT_CLEAR, RESULT_INFO_EXISTS, RESULT_PROHIBITED]
    transitions:
      - from: CONSENT_PENDING
        to: CONSENT_GRANTED
        trigger: "POST /clearinghouse-queries/{clearinghouse_query_id}/consent-decision with decision GRANT"
        actor: Applicant
        preconditions:
          - "status == CONSENT_PENDING"
          - "the acting X-User-ID equals the DriverApplicant.id behind this query's application"
        side_effects:
          - "sets consent_granted_at to the current logical clock instant"
          - "sets consent_expires_on to consent_granted_at date + CONSENT_VALIDITY_DAYS (365)"
      - from: CONSENT_PENDING
        to: CONSENT_DENIED
        trigger: "POST /clearinghouse-queries/{clearinghouse_query_id}/consent-decision with decision DENY"
        actor: Applicant
        preconditions:
          - "status == CONSENT_PENDING"
          - "the acting X-User-ID equals the DriverApplicant.id behind this query's application"
        side_effects:
          - "cascades DriverApplication.screening_status to SCREEN_FAILED with disqualifying_reason CONSENT_REFUSED, which in turn sets qualification_status to DISQUALIFIED, which in turn ARCHIVEs the DqFile"
      - from: CONSENT_GRANTED
        to: RESULT_CLEAR
        trigger: "POST /clearinghouse-queries/{clearinghouse_query_id}/record-result with result NO_INFO"
        actor: DER
        preconditions:
          - "status == CONSENT_GRANTED"
          - "current logical clock date <= consent_expires_on"
        side_effects:
          - "sets the CLEARINGHOUSE_QUERY DqDocument of the application's DqFile to PRESENT with effective_on = clock date"
          - "recomputes DqFile.completeness_pct, deficiency_count and status; increments DqFile.version by 1"
          - "re-evaluates DriverApplication.screening_status SCREENING -> SCREEN_CLEARED"
      - from: CONSENT_GRANTED
        to: RESULT_INFO_EXISTS
        trigger: "POST /clearinghouse-queries/{clearinghouse_query_id}/record-result with result INFORMATION_EXISTS"
        actor: DER
        preconditions:
          - "status == CONSENT_GRANTED"
          - "query_type == LIMITED"
          - "current logical clock date <= consent_expires_on"
        side_effects:
          - "no DqDocument change; the file stays short of the CLEARINGHOUSE_QUERY artifact until a FULL query resolves"
        note: "A LIMITED query that returns INFORMATION_EXISTS obliges the DER to open a FULL query; the FULL query records follow_up_full_query_id back on this row."
      - from: CONSENT_GRANTED
        to: RESULT_PROHIBITED
        trigger: "POST /clearinghouse-queries/{clearinghouse_query_id}/record-result with result PROHIBITED"
        actor: DER
        preconditions:
          - "status == CONSENT_GRANTED"
          - "query_type == FULL"
          - "current logical clock date <= consent_expires_on"
        side_effects:
          - "CASCADE HOP 1 -> DriverApplication.screening_status becomes SCREEN_FAILED with disqualifying_reason CLEARINGHOUSE_PROHIBITED"
          - "CASCADE HOP 2 (caused by hop 1) -> the same DriverApplication.qualification_status becomes DISQUALIFIED"
          - "CASCADE HOP 3 (caused by hop 2) -> the 1:1 DqFile.status becomes ARCHIVED, DqFile.version increments by 1, and every RESERVED OrientationEnrollment of that application becomes CANCELLED"
          - "CASCADE HOP 4 (caused by hop 3) -> Carrier.filled_requisitions, deficiency_ratio and posture are recomputed (calculations.carrier_posture) and Carrier.version increments by 1"

  - entity: DrugTestOrder
    initial_state: ORDERED
    terminal_states: [MRO_VERIFIED_NEGATIVE, MRO_VERIFIED_POSITIVE]
    transitions:
      - from: ORDERED
        to: COLLECTED
        trigger: "POST /drug-test-orders/{drug_test_order_id}/record-collection"
        actor: DER
        preconditions:
          - "status IN {ORDERED, LAB_DILUTE}"
        side_effects:
          - "sets collected_at to the supplied instant"
      - from: LAB_DILUTE
        to: COLLECTED
        trigger: "POST /drug-test-orders/{drug_test_order_id}/record-collection"
        actor: DER
        preconditions:
          - "status == LAB_DILUTE"
          - "dilute_recollect_count < MAX_DILUTE_RECOLLECTIONS (1)"
        side_effects:
          - "increments dilute_recollect_count by 1"
          - "sets collected_at to the supplied instant"
        note: "CYCLE — COLLECTED -> LAB_DILUTE -> COLLECTED is the single permitted recollection loop."
      - from: COLLECTED
        to: LAB_NEGATIVE
        trigger: "POST /drug-test-orders/{drug_test_order_id}/record-lab-result with lab_result NEGATIVE"
        actor: DER
        preconditions:
          - "status == COLLECTED"
        side_effects:
          - "none beyond status and updated_at"
      - from: COLLECTED
        to: LAB_POSITIVE
        trigger: "POST /drug-test-orders/{drug_test_order_id}/record-lab-result with lab_result POSITIVE"
        actor: DER
        preconditions:
          - "status == COLLECTED"
        side_effects:
          - "none beyond status and updated_at; MRO verification is required before any cascade"
      - from: COLLECTED
        to: LAB_DILUTE
        trigger: "POST /drug-test-orders/{drug_test_order_id}/record-lab-result with lab_result DILUTE"
        actor: DER
        preconditions:
          - "status == COLLECTED"
        side_effects:
          - "none beyond status and updated_at"
      - from: LAB_NEGATIVE
        to: MRO_VERIFIED_NEGATIVE
        trigger: "POST /drug-test-orders/{drug_test_order_id}/record-mro-verification with mro_decision VERIFIED_NEGATIVE"
        actor: DER
        preconditions:
          - "status IN {LAB_NEGATIVE, LAB_POSITIVE}"
        side_effects:
          - "sets the DRUG_TEST_RESULT DqDocument of the application's DqFile to PRESENT with effective_on = clock date"
          - "recomputes DqFile.completeness_pct, deficiency_count and status; increments DqFile.version by 1"
          - "re-evaluates DriverApplication.screening_status SCREENING -> SCREEN_CLEARED"
      - from: LAB_POSITIVE
        to: MRO_VERIFIED_NEGATIVE
        trigger: "POST /drug-test-orders/{drug_test_order_id}/record-mro-verification with mro_decision VERIFIED_NEGATIVE"
        actor: DER
        preconditions:
          - "status == LAB_POSITIVE"
        side_effects:
          - "identical to LAB_NEGATIVE -> MRO_VERIFIED_NEGATIVE"
        note: "BRANCH — LAB_POSITIVE forks into MRO_VERIFIED_NEGATIVE (legitimate medical explanation, DQ document becomes PRESENT) and MRO_VERIFIED_POSITIVE (disqualifying cascade)."
      - from: LAB_POSITIVE
        to: MRO_VERIFIED_POSITIVE
        trigger: "POST /drug-test-orders/{drug_test_order_id}/record-mro-verification with mro_decision VERIFIED_POSITIVE"
        actor: DER
        preconditions:
          - "status == LAB_POSITIVE"
        side_effects:
          - "cascades DriverApplication.screening_status to SCREEN_FAILED with disqualifying_reason DRUG_TEST_POSITIVE, which sets qualification_status to DISQUALIFIED, which ARCHIVEs the DqFile and cancels RESERVED enrollments"

  - entity: RoadTest
    initial_state: SCHEDULED
    terminal_states: [PASSED]
    transitions:
      - from: SCHEDULED
        to: PASSED
        trigger: "POST /road-tests/{road_test_id}/record-result with outcome PASSED"
        actor: SafetyDirector
        preconditions:
          - "status == SCHEDULED"
          - "the acting X-User-ID equals examiner_user_id"
          - "examiner_user_id != the parent DriverApplication.recruiter_user_id"
          - "composite_score >= ROAD_TEST_PASS_THRESHOLD (80.0) AND score_road >= ROAD_TEST_ROAD_FLOOR (70)"
          - "a DrugTestOrder of the same application with test_type == PRE_EMPLOYMENT has status == MRO_VERIFIED_NEGATIVE"
        side_effects:
          - "computes composite_score (calculations.road_test_composite_score)"
          - "sets DriverApplication.qualification_status to ROAD_TEST_PASSED"
          - "sets the ROAD_TEST_CERT DqDocument to PRESENT; recomputes DqFile completeness and status; increments DqFile.version by 1"
      - from: SCHEDULED
        to: FAILED
        trigger: "POST /road-tests/{road_test_id}/record-result with outcome FAILED"
        actor: SafetyDirector
        preconditions:
          - "status == SCHEDULED"
          - "the acting X-User-ID equals examiner_user_id"
        side_effects:
          - "computes composite_score (calculations.road_test_composite_score)"
      - from: SCHEDULED
        to: NO_SHOW
        trigger: "POST /road-tests/{road_test_id}/record-result with outcome NO_SHOW"
        actor: SafetyDirector
        preconditions:
          - "status == SCHEDULED"
          - "the acting X-User-ID equals examiner_user_id"
        side_effects:
          - "leaves composite_score null"
      - from: FAILED
        to: SCHEDULED
        trigger: "POST /road-tests/{road_test_id}/reschedule"
        actor: Recruiter
        preconditions:
          - "status IN {FAILED, NO_SHOW}"
          - "attempt_number < MAX_ROAD_TEST_ATTEMPTS (3)"
        side_effects:
          - "increments attempt_number by 1"
          - "replaces scheduled_at and examiner_user_id with the supplied values"
          - "clears score_pretrip, score_skills, score_road and composite_score back to null"
        note: "CYCLE — SCHEDULED -> FAILED -> SCHEDULED, capped at three attempts."
      - from: NO_SHOW
        to: SCHEDULED
        trigger: "POST /road-tests/{road_test_id}/reschedule"
        actor: Recruiter
        preconditions:
          - "status == NO_SHOW"
          - "attempt_number < MAX_ROAD_TEST_ATTEMPTS (3)"
        side_effects:
          - "identical to FAILED -> SCHEDULED"

  - entity: OrientationSession
    initial_state: PLANNED
    terminal_states: [COMPLETED]
    transitions:
      - from: PLANNED
        to: OPEN
        trigger: "POST /orientation-sessions/{session_id}/open"
        actor: Recruiter
        preconditions:
          - "status == PLANNED"
          - "current logical clock < starts_at"
        side_effects:
          - "none beyond status and updated_at; increments version by 1"
      - from: OPEN
        to: COMPLETED
        trigger: "POST /orientation-sessions/{session_id}/complete"
        actor: Recruiter
        preconditions:
          - "status == OPEN"
          - "current logical clock >= ends_at"
          - "every id in attended_enrollment_ids is an OrientationEnrollment of this session with status RESERVED"
        side_effects:
          - "sets each listed enrollment to ATTENDED and every other RESERVED enrollment of the session to ABSENT"
          - "for each ATTENDED enrollment, advances DriverApplication.qualification_status ROAD_TEST_PASSED -> ORIENTATION_COMPLETE and re-evaluates the QUALIFIED join"
          - "increments version by 1"

  - entity: OrientationEnrollment
    initial_state: RESERVED
    terminal_states: [ATTENDED, ABSENT, CANCELLED]
    transitions:
      - from: RESERVED
        to: ATTENDED
        trigger: "system, side effect of POST /orientation-sessions/{session_id}/complete"
        actor: system
        preconditions:
          - "status == RESERVED"
          - "the enrollment id appears in attended_enrollment_ids"
        side_effects:
          - "advances the linked DriverApplication qualification_status"
      - from: RESERVED
        to: ABSENT
        trigger: "system, side effect of POST /orientation-sessions/{session_id}/complete"
        actor: system
        preconditions:
          - "status == RESERVED"
          - "the enrollment id does not appear in attended_enrollment_ids"
        side_effects:
          - "no qualification_status change; enrolled_count is unchanged because ABSENT still occupies the seat"
      - from: RESERVED
        to: CANCELLED
        trigger: "POST /orientation-enrollments/{enrollment_id}/cancel, or system cascade from DriverApplication -> DISQUALIFIED"
        actor: Recruiter
        preconditions:
          - "status == RESERVED"
        side_effects:
          - "decrements OrientationSession.enrolled_count by 1 and increments that session's version by 1"

  - entity: DqFile
    state_field: status
    initial_state: OPEN
    terminal_states: [ARCHIVED]
    transitions:
      - from: OPEN
        to: COMPLETE
        trigger: "system, re-evaluated after every DqDocument mutation and every cascade that touches a DqDocument"
        actor: system
        preconditions:
          - "status IN {OPEN, DEFICIENT}"
          - "completeness_pct == 100.00 under the pre_hire_provisional variant"
        side_effects:
          - "re-evaluates DriverApplication ORIENTATION_COMPLETE -> QUALIFIED"
          - "recomputes Carrier.deficiency_ratio and posture (calculations.carrier_posture)"
      - from: COMPLETE
        to: DEFICIENT
        trigger: "system, re-evaluated after every DqDocument mutation and after every POST /_clock/set_current_utc"
        actor: system
        preconditions:
          - "status == COMPLETE"
          - "completeness_pct < 100.00 under the pre_hire_provisional variant"
        side_effects:
          - "recomputes Carrier.deficiency_ratio and posture (calculations.carrier_posture)"
      - from: DEFICIENT
        to: COMPLETE
        trigger: "system, re-evaluated after every DqDocument mutation"
        actor: system
        preconditions:
          - "status == DEFICIENT"
          - "completeness_pct == 100.00 under the pre_hire_provisional variant"
        side_effects:
          - "recomputes Carrier.deficiency_ratio and posture (calculations.carrier_posture)"
        note: "CYCLE — COMPLETE -> DEFICIENT -> COMPLETE tracks document expiry and remediation."
      - from: COMPLETE
        to: ARCHIVED
        trigger: "system cascade from DriverApplication qualification_status -> DISQUALIFIED"
        actor: system
        preconditions:
          - "status IN {OPEN, COMPLETE, DEFICIENT}"
        side_effects:
          - "recomputes Carrier.deficiency_ratio and posture (calculations.carrier_posture)"

  - entity: DqFile
    state_field: review_state
    initial_state: NOT_DUE
    terminal_states: []
    transitions:
      - from: NOT_DUE
        to: DUE
        trigger: "system, recomputed on every POST /_clock/set_current_utc and on every read or mutation of the file"
        actor: system
        preconditions:
          - "next_review_due_on <= current logical clock date <= next_review_due_on + Carrier.annual_review_grace_days"
        side_effects:
          - "none beyond review_state and updated_at"
      - from: DUE
        to: OVERDUE
        trigger: "system, recomputed on every POST /_clock/set_current_utc and on every read or mutation of the file"
        actor: system
        preconditions:
          - "current logical clock date > next_review_due_on + Carrier.annual_review_grace_days"
        side_effects:
          - "none beyond review_state and updated_at"
      - from: OVERDUE
        to: NOT_DUE
        trigger: "POST /dq-files/{dq_file_id}/annual-review"
        actor: ComplianceAuditor
        preconditions:
          - "review_state IN {DUE, OVERDUE} — enforced at validation priority 55, so a NOT_DUE file yields ERR_REVIEW_NOT_DUE"
          - "status != ARCHIVED — enforced at validation priority 20, so an ARCHIVED file yields ERR_INVALID_STATE"
          - "the acting X-User-ID != the linked DriverApplication.recruiter_user_id"
          - "an MVR ScreeningCheck of the application has status ADJUDICATED_PASS and expires_on >= current logical clock date"
        side_effects:
          - "sets last_annual_review_at to the current logical clock instant and certified_by_user_id to the acting X-User-ID"
          - "sets the MVR_ANNUAL DqDocument to PRESENT with effective_on = clock date and the ANNUAL_REVIEW_CERT DqDocument to PRESENT with effective_on = clock date"
          - "recomputes next_review_due_on = last_annual_review_at date + Carrier.annual_review_interval_days and sets review_state to NOT_DUE"
          - "recomputes completeness_pct and deficiency_count"
      - from: NOT_DUE
        to: DUE
        trigger: "POST /dq-files/{dq_file_id}/revoke-certification"
        actor: ComplianceAuditor
        preconditions:
          - "last_annual_review_at != null — enforced at validation priority 20 as ERR_INVALID_STATE"
          - "status != ARCHIVED — enforced at validation priority 20 as ERR_INVALID_STATE"
        side_effects:
          - "clears last_annual_review_at and certified_by_user_id back to null"
          - "sets the MVR_ANNUAL and ANNUAL_REVIEW_CERT DqDocuments back to MISSING with effective_on null"
          - "recomputes next_review_due_on from opened_on and re-derives review_state"
          - "recomputes completeness_pct and deficiency_count"
        note: "COMPENSATION — revoke-certification reverses every field annual-review wrote; the weight-conservation invariant INV_DQ_WEIGHT must hold before and after."

  - entity: TuitionAgreement
    initial_state: PENDING
    terminal_states: [FULFILLED]
    transitions:
      - from: PENDING
        to: ACTIVE
        trigger: "POST /tuition-agreements/{tuition_agreement_id}/activate"
        actor: SchoolCoordinator
        preconditions:
          - "status == PENDING"
          - "the applicant has at least one HireRecord with status == ACTIVE"
        side_effects:
          - "computes base_monthly_cents, monthly_reimbursement_cents and forgiven_cents (calculations.tuition_schedule)"
          - "sets outstanding_cents to tuition_total_cents - forgiven_cents"
      - from: ACTIVE
        to: FULFILLED
        trigger: "system, side effect of POST /tuition-agreements/{tuition_agreement_id}/accrue-month when months_served reaches commitment_months"
        actor: system
        preconditions:
          - "status == ACTIVE"
          - "months_served == commitment_months"
        side_effects:
          - "leaves outstanding_cents at 0"
      - from: ACTIVE
        to: TERMINATED_CLAWBACK
        trigger: "system cascade from POST /hire-records/{hire_record_id}/terminate"
        actor: system
        preconditions:
          - "status == ACTIVE"
        side_effects:
          - "CASCADE HOP 2 -> moves the whole outstanding_cents balance into clawback_cents and sets outstanding_cents to 0"
          - "CASCADE HOP 3 (caused by hop 2) -> recomputes DriverApplicant.outstanding_clawback_cents and rehire_eligibility (calculations.rehire_eligibility)"
      - from: TERMINATED_CLAWBACK
        to: ACTIVE
        trigger: "POST /tuition-agreements/{tuition_agreement_id}/reverse-clawback"
        actor: SchoolCoordinator
        preconditions:
          - "status == TERMINATED_CLAWBACK"
          - "clawback_cents > 0"
        side_effects:
          - "moves the whole clawback_cents balance back into outstanding_cents and sets clawback_cents to 0"
          - "recomputes DriverApplicant.outstanding_clawback_cents and rehire_eligibility"
        note: "COMPENSATION + CYCLE — INV_TUITION_CENTS must hold identically before termination, after termination and after reversal."

  - entity: HireRecord
    initial_state: ACTIVE
    terminal_states: [TERMINATED, RESCINDED]
    transitions:
      - from: ACTIVE
        to: TERMINATED
        trigger: "POST /hire-records/{hire_record_id}/terminate"
        actor: SafetyDirector
        preconditions:
          - "status == ACTIVE"
          - "terminated_on >= hired_on"
        side_effects:
          - "CASCADE HOP 1 -> sets terminated_on, termination_type, rehire_flag and tenure_days = terminated_on - hired_on"
          - "CASCADE HOP 2 (caused by hop 1) -> every TuitionAgreement of this applicant with status == ACTIVE becomes TERMINATED_CLAWBACK, moving outstanding_cents into clawback_cents"
          - "CASCADE HOP 3 (caused by hop 2) -> DriverApplicant.outstanding_clawback_cents and rehire_eligibility are recomputed; a positive clawback forces PERMANENTLY_INELIGIBLE"
          - "CASCADE HOP 4 (caused by hop 3) -> when rehire_eligibility becomes PERMANENTLY_INELIGIBLE, every DriverApplication of that applicant whose qualification_status is not terminal becomes DISQUALIFIED with disqualifying_reason REHIRE_INELIGIBLE"
          - "recomputes Carrier.filled_requisitions, deficiency_ratio and posture; increments Carrier.version by 1"
      - from: ACTIVE
        to: RESCINDED
        trigger: "POST /hire-records/{hire_record_id}/rescind"
        actor: SafetyDirector
        preconditions:
          - "status == ACTIVE"
          - "no TuitionAgreement of this applicant has status TERMINATED_CLAWBACK"
        side_effects:
          - "returns DriverApplication.qualification_status from HIRED to QUALIFIED"
          - "recomputes Carrier.filled_requisitions, deficiency_ratio and posture; increments Carrier.version by 1"
        note: "COMPENSATION — rescind is the exact inverse of POST /hire-records; INV_REQUISITION_SEATS must read identically before the hire and after the rescind."

# =============================================================================
# §1.2.1 Concurrency Rules — OCC on the parent's `version` only
# =============================================================================
concurrency_rules:
  - rule_id: hire-create-stale-carrier
    parent_entity: Carrier
    write_endpoint: "POST /hire-records"
    occ_field: "expected_carrier_version"
    description: |
      Creating a HireRecord consumes one of the Carrier's funded requisition seats and
      advances Carrier.version. A create that carries a carrier version older than the
      Carrier currently holds is rejected: the client's view of how many seats remain is
      stale, so its seat arithmetic cannot be trusted.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: enrollment-create-stale-session
    parent_entity: OrientationSession
    write_endpoint: "POST /orientation-enrollments"
    occ_field: "expected_session_version"
    description: |
      Creating an OrientationEnrollment consumes one of the session's capacity seats and
      advances OrientationSession.version. A create carrying a session version older than
      the session currently holds is rejected because the client's enrolled_count reading
      predates a seat that has already been taken or released.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: dq-document-update-stale-file
    parent_entity: DqFile
    write_endpoint: "PUT /dq-documents/{document_id}"
    occ_field: "expected_dq_file_version"
    description: |
      Every DqDocument write recomputes the parent DqFile's completeness_pct, deficiency_count
      and status, and advances DqFile.version. A write carrying a file version older than the
      DqFile currently holds is rejected because the completeness picture the client based its
      edit on has already been superseded by a cascade from screening, drug testing or the road test.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: reapply-stale-application
    parent_entity: DriverApplication
    write_endpoint: "POST /driver-applications/{application_id}/reapply"
    occ_field: "expected_application_version"
    description: |
      Re-applying mints a new DriverApplication that supersedes the prior one via
      prior_application_id and advances the prior application's version. A reapply carrying an
      application version older than the prior application currently holds is rejected because a
      superseding application has already been minted against that same predecessor.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:

  - name: mvr_adjudication_score
    trigger: "POST /screening-checks/{screening_check_id}/record-result (both the ORDERED -> RECEIVED and the DISPUTED -> RECEIVED transitions); writes ScreeningCheck.adjudication_score"
    algorithm: weighted_scoring
    formula: |
      raw = (violation_points        * POINT_WEIGHT)
          + (serious_violation_count * SERIOUS_VIOLATION_WEIGHT)
          + (crash_preventable_count * PREVENTABLE_CRASH_WEIGHT)

      IF ScreeningCheck.check_type != "MVR":
          adjudication_score = round_half_up(raw, 2)          # PSP and CRIMINAL take the raw score
      ELSE:
          experience_credit = min(MAX_EXPERIENCE_CREDIT,
                                  floor(DriverApplicant.experience_months / 12) * EXPERIENCE_CREDIT_PER_YEAR)
          net = max(0.0, raw - experience_credit)
          multiplier = SATISFACTORY_MULTIPLIER   if Carrier.safety_rating == "SATISFACTORY"
                       else CONDITIONAL_MULTIPLIER   if Carrier.safety_rating == "CONDITIONAL"
                       else UNSATISFACTORY_MULTIPLIER
          adjudication_score = round_half_up(net * multiplier, 2)
    input_set: |
      Exactly one ScreeningCheck row (the one being recorded). DriverApplicant.experience_months is
      read through ScreeningCheck.application_id -> DriverApplication.applicant_id; Carrier.safety_rating
      is read through DriverApplication.carrier_id. The three count inputs come from the request body.
    constants:
      POINT_WEIGHT: 1.0
      SERIOUS_VIOLATION_WEIGHT: 4.0
      PREVENTABLE_CRASH_WEIGHT: 6.0
      EXPERIENCE_CREDIT_PER_YEAR: 1.5
      MAX_EXPERIENCE_CREDIT: 6.0
      SATISFACTORY_MULTIPLIER: 1.00
      CONDITIONAL_MULTIPLIER: 1.25
      UNSATISFACTORY_MULTIPLIER: 1.50
    precision: "2 decimal places, round_half_up; the experience credit is NOT rounded before the subtraction"
    variants:
      - name: mvr_full_adjudication
        when: "check_type == MVR"
        difference: "Applies the experience credit and the carrier safety-rating multiplier; the result gates ADJUDICATED_PASS against Carrier.mvr_point_threshold."
      - name: report_raw_score
        when: "check_type IN {PSP, CRIMINAL}"
        difference: "Skips both the experience credit and the multiplier; the score is informational only and never blocks ADJUDICATED_PASS."

  - name: road_test_composite_score
    trigger: "POST /road-tests/{road_test_id}/record-result with outcome PASSED or FAILED; writes RoadTest.composite_score"
    algorithm: weighted_scoring
    formula: |
      # PINNED ROUNDING ORDER: round each weighted section to 2 decimals FIRST, then sum the three
      # rounded section values, then round that sum to 1 decimal. Summing the unrounded products and
      # rounding once at the end is NOT the specified order and is a wrong answer even when it agrees.
      w_pretrip = round_half_up(score_pretrip * WEIGHT_PRETRIP, 2)
      w_skills  = round_half_up(score_skills  * WEIGHT_SKILLS,  2)
      w_road    = round_half_up(score_road    * WEIGHT_ROAD,    2)
      composite_score = round_half_up(w_pretrip + w_skills + w_road, 1)
      passes = (composite_score >= ROAD_TEST_PASS_THRESHOLD) AND (score_road >= ROAD_TEST_ROAD_FLOOR)
    input_set: "The three sub-scores supplied on the record-result request for exactly this RoadTest row."
    constants:
      WEIGHT_PRETRIP: 0.25
      WEIGHT_SKILLS: 0.35
      WEIGHT_ROAD: 0.40
      ROAD_TEST_PASS_THRESHOLD: 80.0
      ROAD_TEST_ROAD_FLOOR: 70
      MAX_ROAD_TEST_ATTEMPTS: 3
    precision: "sections to 2 decimals round_half_up; composite to 1 decimal round_half_up"

  - name: dq_completeness_score
    trigger: "recomputed on POST /driver-applications/{application_id}/submit, on PUT /dq-documents/{document_id}, on POST /dq-files/{dq_file_id}/annual-review, on POST /dq-files/{dq_file_id}/revoke-certification, on POST /_clock/set_current_utc, and as a side effect of every screening / clearinghouse / drug-test / road-test transition that writes a DqDocument; also served on demand by GET /dq-files/{dq_file_id}/completeness"
    algorithm: aggregation
    formula: |
      # PINNED ROUNDING ORDER: sum the INTEGER weights of the satisfied in-scope documents first,
      # divide by the integer denominator, multiply by 100, and round HALF_UP to 2 decimals ONCE.
      # Computing each document's own percentage contribution, rounding it, and summing those
      # contributions is NOT the specified order and produces a different number
      # (satisfied 18 of denominator 28 -> 64.29 pinned, 64.27 per-document).
      in_scope        = { DqDocument rows of this DqFile whose doc_type is in VARIANT_SCOPE }
      denominator     = sum(d.weight for d in in_scope)
      satisfied       = { d in in_scope if d.status in VARIANT_SATISFIED_STATUSES
                          AND NOT (d.expires_on != null AND d.expires_on < current_clock_date) }
      satisfied_weight = sum(d.weight for d in satisfied)
      completeness_pct = round_half_up(satisfied_weight / denominator * 100, 2)
      deficiency_count = count(in_scope) - count(satisfied)
    input_set: |
      The twelve DqDocument rows of exactly one DqFile. Document weights are fixed per doc_type
      (APPLICATION_FORM 3, CDL_COPY 2, MVR_INITIAL 3, PSP_REPORT 2, CRIMINAL_CHECK 1,
      EMPLOYMENT_VERIFICATION 4, CLEARINGHOUSE_QUERY 3, DRUG_TEST_RESULT 3, ROAD_TEST_CERT 3,
      MEDICAL_CERT 4, MVR_ANNUAL 3, ANNUAL_REVIEW_CERT 2; total 33).
    constants:
      PRE_HIRE_SCOPE_WEIGHT: 28
      ANNUAL_REVIEW_SCOPE_WEIGHT: 30
    precision: "2 decimal places, round_half_up, applied exactly once to the ratio"
    variants:
      - name: pre_hire_provisional
        when: "the default variant; the one persisted into DqFile.completeness_pct / deficiency_count and the one that drives DqFile.status OPEN/COMPLETE/DEFICIENT"
        difference: |
          VARIANT_SCOPE excludes MVR_ANNUAL and ANNUAL_REVIEW_CERT, so denominator = 28.
          VARIANT_SATISFIED_STATUSES = {PRESENT, WAIVED} — a WAIVED document counts as satisfied.
      - name: annual_review_final
        when: "requested explicitly via GET /dq-files/{dq_file_id}/completeness?variant=annual_review_final; the figure a DOT auditor certifies against"
        difference: |
          VARIANT_SCOPE excludes PSP_REPORT and CRIMINAL_CHECK (pre-employment-only artifacts) and
          includes MVR_ANNUAL and ANNUAL_REVIEW_CERT, so denominator = 30.
          VARIANT_SATISFIED_STATUSES = {PRESENT} only — a WAIVED document does NOT count as satisfied.
          Identical document rows therefore yield different percentages under the two variants.

  - name: employment_history_coverage
    trigger: "recomputed on POST /driver-applications/{application_id}/submit and as a side effect of every EmploymentVerification transition into RESPONDED_VERIFIED or GOOD_FAITH_DOCUMENTED; writes DriverApplication.verified_coverage_days and gap_days_unexplained; also served on demand by GET /driver-applications/{application_id}/employment-coverage"
    algorithm: interval_merge
    formula: |
      window_start = current_clock_date - LOOKBACK_DAYS
      window_end   = current_clock_date                    # half-open [window_start, window_end)
      segments = []
      FOR each EmploymentVerification ev of this application WHERE ev.status IN VARIANT_STATUSES:
          lo = max(ev.employed_from, window_start)
          hi = min(ev.employed_to,   window_end)
          IF hi > lo: segments.append([lo, hi))
      sort segments by lo ASC, then by hi ASC (both are calendar dates; no identifier is consulted)
      merge: two segments merge when the next lo <= the running hi (touching endpoints DO merge,
             a one-day hole does NOT)
      verified_coverage_days = sum(hi - lo in days over the merged segments)
      gap_days_unexplained   = LOOKBACK_DAYS - verified_coverage_days
    input_set: |
      Every EmploymentVerification row whose application_id equals this application and whose status
      is in the variant's status set; rows in PENDING, REQUESTED, NO_RESPONSE or RESPONDED_DISPUTED
      are excluded by both variants.
    constants:
      LOOKBACK_DAYS: 1095
      MAX_UNEXPLAINED_GAP_DAYS: 30
      NO_RESPONSE_WAIT_DAYS: 14
      GOOD_FAITH_ROUNDS: 3
    precision: "whole days; date arithmetic only, no time-of-day component"
    variants:
      - name: strict_verified
        when: "the default variant; the one persisted into DriverApplication.verified_coverage_days and gap_days_unexplained, and the one POST /hire-records enforces"
        difference: "VARIANT_STATUSES = {RESPONDED_VERIFIED} only."
      - name: good_faith_projected
        when: "requested explicitly via GET /driver-applications/{application_id}/employment-coverage?variant=good_faith_projected; the figure a recruiter shows an auditor to prove diligence"
        difference: |
          VARIANT_STATUSES = {RESPONDED_VERIFIED, GOOD_FAITH_DOCUMENTED}. A segment whose employer
          never answered three documented requests is counted as covered, so identical rows yield a
          larger coverage and a smaller gap than strict_verified.

  - name: tuition_schedule
    trigger: "POST /tuition-agreements/{tuition_agreement_id}/activate (PENDING -> ACTIVE); writes base_monthly_cents, monthly_reimbursement_cents, forgiven_cents and the opening outstanding_cents"
    algorithm: tiered_pricing
    formula: |
      # PINNED EVALUATION ORDER. The retention tier is keyed on base_monthly_cents ONLY.
      # It is never re-keyed on monthly_reimbursement_cents even though that value is larger and
      # can land in a higher tier — that would be circular. Steps run 1, 2, 3, 4 in this order.
      step 1: base_monthly_cents = floor(tuition_total_cents / commitment_months)
      step 2: bonus_pct = BONUS_PCT_HIGH if base_monthly_cents >= TIER_HIGH_MIN_CENTS
                          else BONUS_PCT_MID if base_monthly_cents >= TIER_MID_MIN_CENTS
                          else BONUS_PCT_LOW
      step 3: monthly_reimbursement_cents = base_monthly_cents
                                          + round_half_up(base_monthly_cents * bonus_pct, 0)
      step 4: forgiven_cents = tuition_total_cents - (base_monthly_cents * commitment_months)
              outstanding_cents = tuition_total_cents - forgiven_cents
    input_set: "Exactly one TuitionAgreement row; tuition_total_cents and commitment_months as supplied at creation."
    constants:
      TIER_HIGH_MIN_CENTS: 20000
      TIER_MID_MIN_CENTS: 10000
      BONUS_PCT_HIGH: 0.00
      BONUS_PCT_MID: 0.05
      BONUS_PCT_LOW: 0.10
    precision: "integer cents; floor on step 1, round_half_up to whole cents on the step-3 bonus"
    variants:
      - name: base_keyed_tier
        when: "always — this is the only sanctioned evaluation order"
        difference: "For tuition_total_cents 115205 over 12 months: base 9600 -> LOW tier (10%) -> monthly 10560. Keying the tier on the 10560 result instead would land in the MID tier and yield 10080; that value is wrong."

  - name: tuition_settlement_ledger
    trigger: "POST /tuition-agreements/{tuition_agreement_id}/accrue-month, the ACTIVE -> TERMINATED_CLAWBACK cascade from POST /hire-records/{hire_record_id}/terminate, and POST /tuition-agreements/{tuition_agreement_id}/reverse-clawback"
    algorithm: waterfall_allocation
    formula: |
      on accrue-month:
          months_served     += 1
          reimbursed_cents   = months_served * base_monthly_cents
          bonus_paid_cents   = months_served * (monthly_reimbursement_cents - base_monthly_cents)
          outstanding_cents  = tuition_total_cents - forgiven_cents - reimbursed_cents - clawback_cents
      on terminate cascade:
          clawback_cents     = outstanding_cents
          outstanding_cents  = 0
      on reverse-clawback:
          outstanding_cents  = clawback_cents
          clawback_cents     = 0

      INVARIANT INV_TUITION_CENTS (must hold after every one of the three operations):
          tuition_total_cents == reimbursed_cents + clawback_cents + outstanding_cents + forgiven_cents
      bonus_paid_cents sits OUTSIDE this identity — it is carrier retention money, not tuition principal.
    input_set: "Exactly one TuitionAgreement row; months_served counts accepted accrue-month calls only."
    constants:
      MAX_MONTHS_SERVED_PER_CALL: 1
    precision: "integer cents; no rounding occurs here because base_monthly_cents is already an integer"

  - name: carrier_posture
    trigger: "recomputed on POST /hire-records, POST /hire-records/{hire_record_id}/terminate, POST /hire-records/{hire_record_id}/rescind, PATCH /carriers/{carrier_id}, every DqFile.status change, and POST /_clock/set_current_utc; writes Carrier.filled_requisitions, deficiency_ratio and posture"
    algorithm: threshold
    formula: |
      filled_requisitions = count(HireRecord h WHERE h.carrier_id == carrier.id AND h.status == "ACTIVE")
      deficient_files     = count(DqFile f WHERE f.status == "DEFICIENT"
                                  AND EXISTS HireRecord h WHERE h.application_id == f.application_id
                                      AND h.carrier_id == carrier.id AND h.status == "ACTIVE")
      deficiency_ratio    = 0.0 if filled_requisitions == 0
                            else round_half_up(deficient_files / filled_requisitions, 4)

      # PINNED EVALUATION ORDER — first matching branch wins.
      # Seat exhaustion is NOT part of posture; it is validation priority 82
      # (ERR_NO_OPEN_REQUISITION), so the two gates stay independently observable.
      posture = "FROZEN"        if carrier.safety_rating == "UNSATISFACTORY"
                else "RESTRICTED" if deficiency_ratio >= DEFICIENCY_RESTRICT_RATIO
                else "OPEN"
    input_set: |
      All HireRecord rows of this carrier with status ACTIVE (TERMINATED and RESCINDED rows are
      excluded), and the DqFile rows reachable from those hires through application_id.
    constants:
      DEFICIENCY_RESTRICT_RATIO: 0.2500
    precision: "deficiency_ratio to 4 decimals, round_half_up; the RESTRICTED comparison is `>=`, so a ratio of exactly 0.2500 already restricts the carrier"

  - name: cdl_downgrade_risk
    trigger: "recomputed on PUT /dq-documents/{document_id}, on POST /_clock/set_current_utc, and on every read of GET /driver-applicants/{applicant_id}; writes DriverApplicant.cdl_downgrade_risk and governing_medical_cert_expires_on"
    algorithm: decay_function
    formula: |
      candidates = { DqDocument d WHERE d.doc_type == "MEDICAL_CERT"
                     AND d.status IN {PRESENT, EXPIRED}
                     AND d.expires_on != null
                     AND d.dq_file_id -> DqFile.application_id -> DriverApplication.applicant_id == applicant.id
                     AND that DqFile.status != "ARCHIVED" }
      IF candidates is empty:
          cdl_downgrade_risk = "NO_CERTIFICATE"; governing_medical_cert_expires_on = null; STOP
      governing = the candidate with the greatest expires_on;
                  tie-break: the greatest created_at (never the id)
      governing_medical_cert_expires_on = governing.expires_on
      d = (governing.expires_on - current_clock_date) in whole days
      cdl_downgrade_risk =
          "NONE"          if d >  WATCH_WINDOW_DAYS
          "WATCH"         if IMMINENT_WINDOW_DAYS <  d <= WATCH_WINDOW_DAYS
          "IMMINENT"      if 0 <= d <= IMMINENT_WINDOW_DAYS
          "EXPIRED_GRACE" if d < 0 AND (current_clock_date - governing.expires_on) <= Carrier.medical_cert_grace_days
          "DOWNGRADED"    otherwise
    input_set: |
      Every MEDICAL_CERT DqDocument reachable from the applicant through
      DqDocument.dq_file_id -> DqFile.application_id -> DriverApplication.applicant_id, restricted to
      files whose status is not ARCHIVED. The applicant's Carrier supplies medical_cert_grace_days.
    constants:
      WATCH_WINDOW_DAYS: 60
      IMMINENT_WINDOW_DAYS: 15
    precision: "whole days; both window comparisons are inclusive on the upper bound (`<=`)"

  - name: dq_review_schedule
    trigger: "recomputed on POST /driver-applications/{application_id}/submit, on POST /dq-files/{dq_file_id}/annual-review, on POST /dq-files/{dq_file_id}/revoke-certification, and on POST /_clock/set_current_utc; writes DqFile.next_review_due_on and review_state"
    algorithm: threshold
    formula: |
      baseline = date(last_annual_review_at) if last_annual_review_at != null else opened_on
      next_review_due_on = baseline + Carrier.annual_review_interval_days
      grace_end          = next_review_due_on + Carrier.annual_review_grace_days
      review_state = "NOT_DUE" if current_clock_date <  next_review_due_on
                     else "DUE"     if current_clock_date <= grace_end
                     else "OVERDUE"
    input_set: "Exactly one DqFile row plus the Carrier reached through DqFile.application_id -> DriverApplication.carrier_id."
    constants: {}
    precision: "whole days; the DUE band is closed on both ends — a file whose grace_end equals the clock date is still DUE, one day later it is OVERDUE"

  - name: rehire_eligibility
    trigger: "recomputed on POST /hire-records/{hire_record_id}/terminate, POST /hire-records/{hire_record_id}/rescind, the TuitionAgreement TERMINATED_CLAWBACK cascade, POST /tuition-agreements/{tuition_agreement_id}/reverse-clawback, and POST /_clock/set_current_utc; writes DriverApplicant.rehire_eligibility and outstanding_clawback_cents"
    algorithm: constraint_propagation
    formula: |
      outstanding_clawback_cents = sum(t.clawback_cents for t in TuitionAgreement
                                       WHERE t.applicant_id == applicant.id
                                       AND t.status == "TERMINATED_CLAWBACK")

      terminated = [ h for h in HireRecord WHERE h.applicant_id == applicant.id AND h.status == "TERMINATED" ]
      sort terminated by terminated_on DESC, then created_at DESC (never by id); latest = first element

      # PINNED EVALUATION ORDER — first matching branch wins.
      rehire_eligibility =
          "ELIGIBLE"                 if terminated is empty AND outstanding_clawback_cents == 0
          "PERMANENTLY_INELIGIBLE"   if outstanding_clawback_cents > 0
          "PERMANENTLY_INELIGIBLE"   if latest.termination_type IN {INVOLUNTARY_SAFETY, ABANDONMENT}
          "PERMANENTLY_INELIGIBLE"   if latest.rehire_flag == "NOT_ELIGIBLE"
          "COOLDOWN"                 if current_clock_date < latest.terminated_on + Carrier.rehire_cooldown_days
          "ELIGIBLE"                 otherwise
    input_set: |
      All HireRecord rows of this applicant with status TERMINATED (ACTIVE and RESCINDED rows are
      excluded, so a rescinded hire leaves eligibility untouched), plus all TuitionAgreement rows of
      this applicant with status TERMINATED_CLAWBACK.
    constants: {}
    precision: "whole days on the cooldown comparison, which is strict (`<`) — the cooldown expires on the day terminated_on + rehire_cooldown_days is reached"

# =============================================================================
# §1.4 Validation Rules Table (evaluated in ascending priority; first failure wins)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers are both present and non-empty"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all

  - priority: 2
    category: auth
    check: "X-User-Role names one of the six declared roles (Recruiter, DER, SafetyDirector, ComplianceAuditor, SchoolCoordinator, Applicant)"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all

  - priority: 3
    category: auth
    check: "the acting role appears in the endpoint's roles list"
    error_id: ERR_FORBIDDEN_ROLE
    http_status: 403
    applies_to: all

  - priority: 4
    category: auth
    check: "when the acting role is Applicant, X-User-ID equals the DriverApplicant.id reachable from the targeted resource (directly, or through application_id -> DriverApplication.applicant_id)"
    error_id: ERR_NOT_RESOURCE_OWNER
    http_status: 403
    applies_to: "POST /clearinghouse-queries/{clearinghouse_query_id}/consent-decision, POST /screening-checks/{screening_check_id}/dispute"

  - priority: 5
    category: existence
    check: "every id in the request path resolves to an existing row, validated left-to-right"
    error_id: "ERR_CARRIER_NOT_FOUND | ERR_APPLICANT_NOT_FOUND | ERR_APPLICATION_NOT_FOUND | ERR_VERIFICATION_NOT_FOUND | ERR_SCREENING_CHECK_NOT_FOUND | ERR_CLEARINGHOUSE_QUERY_NOT_FOUND | ERR_DRUG_TEST_NOT_FOUND | ERR_ROAD_TEST_NOT_FOUND | ERR_SESSION_NOT_FOUND | ERR_ENROLLMENT_NOT_FOUND | ERR_DQ_FILE_NOT_FOUND | ERR_DQ_DOCUMENT_NOT_FOUND | ERR_TUITION_AGREEMENT_NOT_FOUND | ERR_HIRE_RECORD_NOT_FOUND"
    http_status: 404
    applies_to: "all endpoints with a path id"

  - priority: 6
    category: existence
    check: "every foreign-key id in the request body resolves to an existing row (applicant_id, carrier_id, application_id, session_id, prior_application_id, attended_enrollment_ids members)"
    error_id: "ERR_APPLICANT_NOT_FOUND | ERR_CARRIER_NOT_FOUND | ERR_APPLICATION_NOT_FOUND | ERR_SESSION_NOT_FOUND | ERR_ENROLLMENT_NOT_FOUND"
    http_status: 404
    applies_to: "all endpoints with foreign keys in the body"

  - priority: 7
    category: business_constraint
    check: "every required body field is present, every enum value is a declared member, every integer is within its declared range, and dates parse as YYYY-MM-DD / ISO 8601"
    error_id: ERR_VALIDATION
    http_status: 422
    applies_to: "all endpoints with a request body"

  - priority: 8
    category: business_constraint
    check: "pagination limit is an integer in [1,100] and offset is an integer >= 0"
    error_id: ERR_VALIDATION
    http_status: 422
    applies_to: "all list endpoints"

  - priority: 9
    category: business_constraint
    check: "Carrier.dot_number is unique across carriers; DriverApplicant.email is unique within a carrier_id"
    error_id: ERR_DUPLICATE_DOT_NUMBER
    http_status: 409
    applies_to: "POST /carriers, POST /driver-applicants"

  - priority: 10
    category: state
    check: "the supplied expected_<parent>_version equals the parent's current version (Carrier for POST /hire-records and PATCH /carriers/{carrier_id}; OrientationSession for POST /orientation-enrollments; DqFile for PUT /dq-documents/{document_id}; DriverApplication for POST /driver-applications/{application_id}/reapply)"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /hire-records, PATCH /carriers/{carrier_id}, POST /orientation-enrollments, PUT /dq-documents/{document_id}, POST /driver-applications/{application_id}/reapply"

  - priority: 15
    category: business_constraint
    check: "an applicant may not hold two DriverApplication rows whose qualification_status is non-terminal (not in {HIRED, DISQUALIFIED}) at the same carrier"
    error_id: ERR_DUPLICATE_ACTIVE_APPLICATION
    http_status: 409
    applies_to: "POST /driver-applications, POST /driver-applications/{application_id}/reapply"

  - priority: 20
    category: state
    check: "the target row is in a `from:` state declared for the requested transition in §1.2. On POST /dq-files/{dq_file_id}/annual-review and POST /dq-files/{dq_file_id}/revoke-certification this rule covers ONLY the DqFile.status axis (any status other than ARCHIVED passes); the review_state axis is owned by priority 55 and surfaces as ERR_REVIEW_NOT_DUE, never as ERR_INVALID_STATE"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all action endpoints"

  - priority: 22
    category: state
    check: "the target row is not already in one of its terminal states"
    error_id: ERR_ALREADY_TERMINAL
    http_status: 409
    applies_to: "all action endpoints"

  - priority: 24
    category: state
    check: "the DriverApplication behind the targeted child row has qualification_status != DISQUALIFIED and screening_status != SCREEN_FAILED"
    error_id: ERR_APPLICATION_NOT_QUALIFIED
    http_status: 409
    applies_to: "POST /orientation-enrollments, POST /road-tests, POST /screening-checks, POST /clearinghouse-queries, POST /drug-test-orders, POST /employment-verifications"

  - priority: 25
    category: state
    check: "POST /orientation-enrollments requires the application's qualification_status == ROAD_TEST_PASSED; POST /hire-records requires qualification_status == QUALIFIED"
    error_id: ERR_APPLICATION_NOT_QUALIFIED
    http_status: 409
    applies_to: "POST /orientation-enrollments, POST /hire-records"

  - priority: 30
    category: business_safety
    check: "segregation of duties — the acting X-User-ID must differ from the DriverApplication.recruiter_user_id: a ComplianceAuditor may not certify or revoke the annual review of a file they recruited, and a SafetyDirector may not record the result of a road test whose examiner_user_id equals that recruiter id"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 409
    applies_to: "POST /dq-files/{dq_file_id}/annual-review, POST /dq-files/{dq_file_id}/revoke-certification, POST /road-tests/{road_test_id}/record-result"

  - priority: 32
    category: business_safety
    check: "the acting X-User-ID equals RoadTest.examiner_user_id"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 409
    applies_to: "POST /road-tests/{road_test_id}/record-result"

  - priority: 35
    category: business_safety
    check: "no ClearinghouseQuery of the application is in status RESULT_PROHIBITED, none is in status CONSENT_DENIED, and no LIMITED query is left in status RESULT_INFO_EXISTS with follow_up_full_query_id null (an unresolved hit must be chased with a FULL query before anyone is hired or seated); on POST /road-tests/{road_test_id}/record-result this rule is evaluated ONLY when outcome == PASSED"
    error_id: ERR_CLEARINGHOUSE_PROHIBITED
    http_status: 409
    applies_to: "POST /hire-records, POST /orientation-enrollments, POST /road-tests/{road_test_id}/record-result"

  - priority: 36
    category: business_safety
    check: "a DrugTestOrder of the application with test_type PRE_EMPLOYMENT exists in status MRO_VERIFIED_NEGATIVE; on POST /road-tests/{road_test_id}/record-result this rule is evaluated ONLY when outcome == PASSED, so a FAILED or NO_SHOW result may be recorded before any specimen is collected"
    error_id: ERR_DRUG_TEST_NOT_NEGATIVE
    http_status: 409
    applies_to: "POST /hire-records, POST /road-tests/{road_test_id}/record-result"

  - priority: 38
    category: business_safety
    check: "for check_type == MVR, adjudication_score < Carrier.mvr_point_threshold (a score equal to the threshold is disqualifying)"
    error_id: ERR_MVR_POINTS_EXCEEDED
    http_status: 409
    applies_to: "POST /screening-checks/{screening_check_id}/adjudicate with decision PASS"

  - priority: 40
    category: business_safety
    check: "for POST /hire-records the applicant's cdl_downgrade_risk is neither DOWNGRADED nor NO_CERTIFICATE; for POST /orientation-enrollments it is merely not DOWNGRADED (an applicant with no medical certificate on file may still attend orientation, but may not be hired)"
    error_id: ERR_MEDICAL_CERT_INVALID
    http_status: 409
    applies_to: "POST /hire-records, POST /orientation-enrollments"

  - priority: 12
    category: business_referential
    check: "a ClearinghouseQuery may only record a result when its OWN status is CONSENT_GRANTED; the electronic consent must exist on that very row, not on a sibling LIMITED query. This rule deliberately outranks the generic priority-20 state check so a missing consent is reported specifically rather than as ERR_INVALID_STATE"
    error_id: ERR_CONSENT_NOT_GRANTED
    http_status: 409
    applies_to: "POST /clearinghouse-queries/{clearinghouse_query_id}/record-result"

  - priority: 46
    category: business_referential
    check: "the current logical clock date is on or before ClearinghouseQuery.consent_expires_on"
    error_id: ERR_CONSENT_EXPIRED
    http_status: 409
    applies_to: "POST /clearinghouse-queries/{clearinghouse_query_id}/record-result"

  - priority: 48
    category: business_referential
    check: "the annual review requires an MVR ScreeningCheck of the application in status ADJUDICATED_PASS whose expires_on >= the current logical clock date"
    error_id: ERR_MVR_EXPIRED
    http_status: 409
    applies_to: "POST /dq-files/{dq_file_id}/annual-review"

  - priority: 55
    category: business_temporal
    check: "the DqFile's review_state is DUE or OVERDUE (a NOT_DUE file cannot be reviewed early)"
    error_id: ERR_REVIEW_NOT_DUE
    http_status: 409
    applies_to: "POST /dq-files/{dq_file_id}/annual-review"

  - priority: 58
    category: business_temporal
    check: "EmploymentVerification employed_to is strictly after employed_from; OrientationSession ends_at is strictly after starts_at; HireRecord terminated_on is on or after hired_on"
    error_id: ERR_VALIDATION
    http_status: 422
    applies_to: "POST /employment-verifications, POST /orientation-sessions, POST /hire-records/{hire_record_id}/terminate"

  - priority: 60
    category: business_temporal
    check: "BUFFERED HALF-OPEN OVERLAP on the DriverApplication resource — a new enrollment is rejected when [session.starts_at - 12h, session.ends_at + 12h) intersects [other.starts_at, other.ends_at) of any session the same application already occupies through a RESERVED or ATTENDED enrollment"
    error_id: ERR_ORIENTATION_OVERLAP
    http_status: 409
    applies_to: "POST /orientation-enrollments"

  - priority: 62
    category: business_temporal
    check: "CLOSED TOUCHING OVERLAP on the examiner resource — a new or rescheduled road test is rejected when [scheduled_at, scheduled_at + 180 minutes] intersects the same closed interval of any other RoadTest with status SCHEDULED and the same examiner_user_id; touching endpoints DO collide"
    error_id: ERR_EXAMINER_SLOT_CONFLICT
    http_status: 409
    applies_to: "POST /road-tests, POST /road-tests/{road_test_id}/reschedule"

  - priority: 65
    category: business_constraint
    check: "AGGREGATE CAPACITY on the session resource — OrientationSession.enrolled_count < OrientationSession.capacity"
    error_id: ERR_SESSION_AT_CAPACITY
    http_status: 409
    applies_to: "POST /orientation-enrollments"

  - priority: 68
    category: business_constraint
    check: "RoadTest.attempt_number < MAX_ROAD_TEST_ATTEMPTS (3)"
    error_id: ERR_ROAD_TEST_ATTEMPTS_EXHAUSTED
    http_status: 409
    applies_to: "POST /road-tests/{road_test_id}/reschedule"

  - priority: 70
    category: business_constraint
    check: "the application's DqFile has status COMPLETE"
    error_id: ERR_DQ_FILE_INCOMPLETE
    http_status: 409
    applies_to: "POST /hire-records"

  - priority: 72
    category: business_constraint
    check: "DriverApplication.gap_days_unexplained (strict_verified variant) <= MAX_UNEXPLAINED_GAP_DAYS (30)"
    error_id: ERR_EMPLOYMENT_HISTORY_INCOMPLETE
    http_status: 409
    applies_to: "POST /hire-records"

  - priority: 75
    category: business_constraint
    check: "DriverApplicant.rehire_eligibility == ELIGIBLE"
    error_id: ERR_REHIRE_INELIGIBLE
    http_status: 409
    applies_to: "POST /hire-records, POST /driver-applications, POST /driver-applications/{application_id}/submit"

  - priority: 80
    category: business_fiscal
    check: "Carrier.posture != FROZEN — for POST /hire-records and for POST /driver-applications/{application_id}/submit alike, so only an UNSATISFACTORY safety rating or a deficiency_ratio-driven FROZEN posture blocks here; seat exhaustion is checked separately at priority 82"
    error_id: ERR_CARRIER_POSTURE_BLOCKED
    http_status: 409
    applies_to: "POST /hire-records, POST /driver-applications/{application_id}/submit"

  - priority: 82
    category: business_fiscal
    check: "Carrier.filled_requisitions < Carrier.open_requisitions at the moment the seat is consumed"
    error_id: ERR_NO_OPEN_REQUISITION
    http_status: 409
    applies_to: "POST /hire-records"

  - priority: 19
    category: business_fiscal
    check: "TuitionAgreement.clawback_cents > 0. This rule deliberately outranks the generic priority-20 state check, so reverse-clawback against an ACTIVE agreement that carries no clawback reports ERR_NO_CLAWBACK_TO_REVERSE rather than ERR_INVALID_STATE"
    error_id: ERR_NO_CLAWBACK_TO_REVERSE
    http_status: 409
    applies_to: "POST /tuition-agreements/{tuition_agreement_id}/reverse-clawback"

  - priority: 18
    category: business_fiscal
    check: "TuitionAgreement.months_served < commitment_months. This rule deliberately outranks the generic priority-22 terminal check, so accruing against a FULFILLED agreement reports ERR_COMMITMENT_ALREADY_FULFILLED rather than ERR_ALREADY_TERMINAL"
    error_id: ERR_COMMITMENT_ALREADY_FULFILLED
    http_status: 409
    applies_to: "POST /tuition-agreements/{tuition_agreement_id}/accrue-month"

# =============================================================================
# §1.5 API Endpoint Table  (api_prefix is "", so each path below is absolute)
# =============================================================================
endpoints:

  # ---- logical clock (test-driving namespace) ------------------------------
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Sets the server's logical clock. The clock's startup default is EXACTLY 2026-08-01T00:00:00Z; until this endpoint is called the server MUST report that instant and MUST NOT fall back to real wall-clock time."
    roles: [Recruiter, DER, SafetyDirector, ComplianceAuditor, SchoolCoordinator, Applicant]
    code: 200
    input: [to_iso8601]
    output: "{ current_utc: string }"
    side_effects:
      - "recomputes DqFile.review_state and next_review_due_on for every non-ARCHIVED file (calculations.dq_review_schedule)"
      - "re-evaluates DqFile.status COMPLETE <-> DEFICIENT for expiry-driven changes (calculations.dq_completeness_score)"
      - "recomputes DriverApplicant.cdl_downgrade_risk and governing_medical_cert_expires_on (calculations.cdl_downgrade_risk)"
      - "recomputes DriverApplicant.rehire_eligibility (calculations.rehire_eligibility)"
      - "recomputes Carrier.filled_requisitions, deficiency_ratio and posture (calculations.carrier_posture)"

  - method: GET
    path: "/_clock"
    description: "Reads the current logical clock instant."
    roles: [Recruiter, DER, SafetyDirector, ComplianceAuditor, SchoolCoordinator, Applicant]
    code: 200
    input: []
    output: "{ current_utc: string }"
    side_effects: []

  # ---- Carrier -------------------------------------------------------------
  - method: POST
    path: "/carriers"
    description: "Registers a recruiting office with its policy knobs."
    roles: [SafetyDirector]
    code: 201
    input: [legal_name, dot_number, open_requisitions, "safety_rating?", "mvr_validity_days?", "annual_review_interval_days?", "annual_review_grace_days?", "mvr_point_threshold?", "rehire_cooldown_days?", "medical_cert_grace_days?"]
    output: Carrier
    side_effects: ["computes posture (OPEN unless open_requisitions == 0 or safety_rating == UNSATISFACTORY)"]

  - method: GET
    path: "/carriers/{carrier_id}"
    description: "Reads one carrier with its live posture."
    roles: [Recruiter, DER, SafetyDirector, ComplianceAuditor, SchoolCoordinator, Applicant]
    code: 200
    input: []
    output: Carrier
    side_effects: []

  - method: GET
    path: "/carriers"
    description: "Lists carriers, optionally filtered by posture."
    roles: [Recruiter, DER, SafetyDirector, ComplianceAuditor, SchoolCoordinator, Applicant]
    code: 200
    input: ["posture?", "limit?", "offset?"]
    output: Carrier[]
    side_effects: []

  - method: PATCH
    path: "/carriers/{carrier_id}"
    description: "Adjusts requisition count and/or safety rating under OCC."
    roles: [SafetyDirector]
    code: 200
    input: [expected_carrier_version, "open_requisitions?", "safety_rating?"]
    output: Carrier
    side_effects:
      - "recomputes filled_requisitions, deficiency_ratio and posture (calculations.carrier_posture)"
      - "increments Carrier.version by 1"

  # ---- DriverApplicant -----------------------------------------------------
  - method: POST
    path: "/driver-applicants"
    description: "Creates a driver applicant record under a carrier."
    roles: [Recruiter]
    code: 201
    input: [carrier_id, full_name, date_of_birth, email, cdl_number, cdl_state, cdl_class, experience_months]
    output: DriverApplicant
    side_effects: ["initialises cdl_downgrade_risk to NO_CERTIFICATE and rehire_eligibility to ELIGIBLE"]

  - method: GET
    path: "/driver-applicants/{applicant_id}"
    description: "Reads one applicant with freshly recomputed cdl_downgrade_risk and rehire_eligibility."
    roles: [Recruiter, DER, SafetyDirector, ComplianceAuditor, SchoolCoordinator, Applicant]
    code: 200
    input: []
    output: DriverApplicant
    side_effects:
      - "recomputes cdl_downgrade_risk and governing_medical_cert_expires_on (calculations.cdl_downgrade_risk)"
      - "recomputes rehire_eligibility and outstanding_clawback_cents (calculations.rehire_eligibility)"

  - method: GET
    path: "/driver-applicants"
    description: "Lists applicants; carrier_id is the reverse-reachability filter for DriverApplicant.carrier_id."
    roles: [Recruiter, DER, SafetyDirector, ComplianceAuditor, SchoolCoordinator, Applicant]
    code: 200
    input: ["carrier_id?", "rehire_eligibility?", "cdl_downgrade_risk?", "limit?", "offset?"]
    output: DriverApplicant[]
    side_effects: []

  # ---- DriverApplication ---------------------------------------------------
  - method: POST
    path: "/driver-applications"
    description: "Opens a DRAFT application for an applicant."
    roles: [Recruiter]
    code: 201
    input: [applicant_id, position_type, "prior_application_id?"]
    output: DriverApplication
    side_effects: ["copies carrier_id from the applicant", "sets screening_status DRAFT and qualification_status NOT_STARTED"]

  - method: GET
    path: "/driver-applications/{application_id}"
    description: "Reads one application with both state axes and the strict_verified coverage figures."
    roles: [Recruiter, DER, SafetyDirector, ComplianceAuditor, SchoolCoordinator, Applicant]
    code: 200
    input: []
    output: DriverApplication
    side_effects: []

  - method: GET
    path: "/driver-applications"
    description: "Lists applications; applicant_id, carrier_id and prior_application_id are the reverse-reachability filters for those FKs."
    roles: [Recruiter, DER, SafetyDirector, ComplianceAuditor, SchoolCoordinator, Applicant]
    code: 200
    input: ["applicant_id?", "carrier_id?", "prior_application_id?", "screening_status?", "qualification_status?", "limit?", "offset?"]
    output: DriverApplication[]
    side_effects: []

  - method: POST
    path: "/driver-applications/{application_id}/submit"
    description: "DRAFT -> SUBMITTED; the sole producer of the DqFile and its twelve DqDocument rows."
    roles: [Recruiter]
    code: 200
    input: []
    output: DriverApplication
    side_effects:
      - "sets submitted_at and recruiter_user_id"
      - "sets qualification_status to IN_PROGRESS"
      - "creates the 1:1 DqFile (status OPEN, review_state NOT_DUE, total_weight 33) and twelve MISSING DqDocument rows"
      - "sets the APPLICATION_FORM DqDocument to PRESENT"
      - "recomputes DqFile.completeness_pct and deficiency_count (calculations.dq_completeness_score)"
      - "recomputes next_review_due_on and review_state (calculations.dq_review_schedule)"
      - "recomputes verified_coverage_days and gap_days_unexplained (calculations.employment_history_coverage)"

  - method: POST
    path: "/driver-applications/{application_id}/request-info"
    description: "SCREENING -> INFO_REQUESTED; opens a revision round."
    roles: [SafetyDirector]
    code: 200
    input: [reason]
    output: DriverApplication
    side_effects: []

  - method: POST
    path: "/driver-applications/{application_id}/resubmit-info"
    description: "INFO_REQUESTED -> SCREENING; closes a revision round."
    roles: [Recruiter]
    code: 200
    input: [response_note]
    output: DriverApplication
    side_effects: ["increments revision_round by 1"]

  - method: POST
    path: "/driver-applications/{application_id}/disqualify"
    description: "Terminates both state axes: screening_status SCREEN_FAILED, qualification_status DISQUALIFIED."
    roles: [SafetyDirector]
    code: 200
    input: [reason]
    output: DriverApplication
    side_effects:
      - "sets disqualifying_reason"
      - "cancels every RESERVED OrientationEnrollment of this application, decrementing each session's enrolled_count and incrementing that session's version by 1"
      - "sets the DqFile to ARCHIVED and increments DqFile.version by 1"
      - "recomputes Carrier.filled_requisitions, deficiency_ratio and posture"

  - method: POST
    path: "/driver-applications/{application_id}/reapply"
    description: "Mints a superseding DriverApplication whose prior_application_id points at the path application, under OCC on that prior application's version."
    roles: [Recruiter]
    code: 201
    input: [expected_application_version, position_type]
    output: DriverApplication
    side_effects:
      - "increments the prior DriverApplication.version by 1"
      - "creates a new DRAFT / NOT_STARTED application for the same applicant"

  - method: GET
    path: "/driver-applications/{application_id}/employment-coverage"
    description: "Computed read of calculations.employment_history_coverage; variant defaults to strict_verified."
    roles: [Recruiter, DER, SafetyDirector, ComplianceAuditor, SchoolCoordinator, Applicant]
    code: 200
    input: ["variant?"]
    output: "{ variant: string, verified_coverage_days: integer, gap_days_unexplained: integer, merged_segment_count: integer }"
    side_effects: []

  # ---- EmploymentVerification ---------------------------------------------
  - method: POST
    path: "/employment-verifications"
    description: "Records a previous-employer segment to be verified."
    roles: [Recruiter]
    code: 201
    input: [application_id, employer_name, is_dot_regulated, employed_from, employed_to]
    output: EmploymentVerification
    side_effects: []

  - method: GET
    path: "/employment-verifications/{verification_id}"
    description: "Reads one employment verification."
    roles: [Recruiter, DER, SafetyDirector, ComplianceAuditor, SchoolCoordinator, Applicant]
    code: 200
    input: []
    output: EmploymentVerification
    side_effects: []

  - method: GET
    path: "/employment-verifications"
    description: "Lists employment verifications; application_id is the reverse-reachability filter."
    roles: [Recruiter, DER, SafetyDirector, ComplianceAuditor, SchoolCoordinator, Applicant]
    code: 200
    input: ["application_id?", "status?", "limit?", "offset?"]
    output: EmploymentVerification[]
    side_effects: []

  - method: POST
    path: "/employment-verifications/{verification_id}/send-request"
    description: "PENDING/NO_RESPONSE -> REQUESTED; the cyclic re-request driver."
    roles: [Recruiter]
    code: 200
    input: []
    output: EmploymentVerification
    side_effects: ["increments request_round by 1", "sets last_requested_at to the current logical clock instant"]

  - method: POST
    path: "/employment-verifications/{verification_id}/record-response"
    description: "REQUESTED -> RESPONDED_VERIFIED or RESPONDED_DISPUTED."
    roles: [Recruiter]
    code: 200
    input: [outcome, safety_performance_history_received, drug_alcohol_violation_reported]
    output: EmploymentVerification
    side_effects:
      - "recomputes DriverApplication.verified_coverage_days and gap_days_unexplained"
      - "on VERIFIED with the recomputed gap <= 30, sets the EMPLOYMENT_VERIFICATION DqDocument to PRESENT, recomputes DqFile completeness/status and increments DqFile.version by 1"
      - "on DISPUTED with drug_alcohol_violation_reported true, cascades the application to SCREEN_FAILED / DISQUALIFIED"

  - method: POST
    path: "/employment-verifications/{verification_id}/mark-no-response"
    description: "REQUESTED -> NO_RESPONSE (request_round < 3) or REQUESTED -> GOOD_FAITH_DOCUMENTED (request_round >= 3)."
    roles: [Recruiter]
    code: 200
    input: []
    output: EmploymentVerification
    side_effects: ["on GOOD_FAITH_DOCUMENTED, recomputes the application's strict_verified coverage figures (which do not include this segment)"]

  # ---- ScreeningCheck ------------------------------------------------------
  - method: POST
    path: "/screening-checks"
    description: "Orders an MVR, PSP or CRIMINAL report."
    roles: [Recruiter]
    code: 201
    input: [application_id, check_type]
    output: ScreeningCheck
    side_effects: ["advances DriverApplication.screening_status SUBMITTED -> SCREENING on the first check"]

  - method: GET
    path: "/screening-checks/{screening_check_id}"
    description: "Reads one screening check."
    roles: [Recruiter, DER, SafetyDirector, ComplianceAuditor, SchoolCoordinator, Applicant]
    code: 200
    input: []
    output: ScreeningCheck
    side_effects: []

  - method: GET
    path: "/screening-checks"
    description: "Lists screening checks; application_id is the reverse-reachability filter."
    roles: [Recruiter, DER, SafetyDirector, ComplianceAuditor, SchoolCoordinator, Applicant]
    code: 200
    input: ["application_id?", "check_type?", "status?", "limit?", "offset?"]
    output: ScreeningCheck[]
    side_effects: []

  - method: POST
    path: "/screening-checks/{screening_check_id}/record-result"
    description: "ORDERED/DISPUTED -> RECEIVED; computes expires_on and adjudication_score."
    roles: [Recruiter]
    code: 200
    input: [issued_on, violation_points, serious_violation_count, crash_preventable_count]
    output: ScreeningCheck
    side_effects: ["computes expires_on for MVR", "computes adjudication_score (calculations.mvr_adjudication_score)"]

  - method: POST
    path: "/screening-checks/{screening_check_id}/adjudicate"
    description: "RECEIVED -> ADJUDICATED_PASS or PRE_ADVERSE; PRE_ADVERSE -> ADVERSE_FINAL. decision is one of {PASS, PRE_ADVERSE, ADVERSE_FINAL}."
    roles: [SafetyDirector]
    code: 200
    input: [decision]
    output: ScreeningCheck
    side_effects:
      - "on PASS, sets the matching DqDocument to PRESENT, recomputes DqFile completeness/status, increments DqFile.version by 1 and re-evaluates SCREENING -> SCREEN_CLEARED"
      - "on PRE_ADVERSE, stamps pre_adverse_at"
      - "on ADVERSE_FINAL, cascades the application to SCREEN_FAILED / DISQUALIFIED / DqFile ARCHIVED"

  - method: POST
    path: "/screening-checks/{screening_check_id}/dispute"
    description: "PRE_ADVERSE -> DISPUTED inside the 5-day window; only the applicant themselves may dispute."
    roles: [Applicant]
    code: 200
    input: [dispute_note]
    output: ScreeningCheck
    side_effects: ["clears pre_adverse_at"]

  # ---- ClearinghouseQuery --------------------------------------------------
  - method: POST
    path: "/clearinghouse-queries"
    description: "Opens a LIMITED or FULL Clearinghouse query in CONSENT_PENDING."
    roles: [DER]
    code: 201
    input: [application_id, query_type]
    output: ClearinghouseQuery
    side_effects: ["when query_type == FULL and a LIMITED query of the same application is in RESULT_INFO_EXISTS, sets that row's follow_up_full_query_id to the new query id"]

  - method: GET
    path: "/clearinghouse-queries/{clearinghouse_query_id}"
    description: "Reads one Clearinghouse query."
    roles: [Recruiter, DER, SafetyDirector, ComplianceAuditor, SchoolCoordinator, Applicant]
    code: 200
    input: []
    output: ClearinghouseQuery
    side_effects: []

  - method: GET
    path: "/clearinghouse-queries"
    description: "Lists Clearinghouse queries; application_id and follow_up_full_query_id are the reverse-reachability filters."
    roles: [Recruiter, DER, SafetyDirector, ComplianceAuditor, SchoolCoordinator, Applicant]
    code: 200
    input: ["application_id?", "query_type?", "status?", "follow_up_full_query_id?", "limit?", "offset?"]
    output: ClearinghouseQuery[]
    side_effects: []

  - method: POST
    path: "/clearinghouse-queries/{clearinghouse_query_id}/consent-decision"
    description: "CONSENT_PENDING -> CONSENT_GRANTED or CONSENT_DENIED. decision is one of {GRANT, DENY}."
    roles: [Applicant]
    code: 200
    input: [decision]
    output: ClearinghouseQuery
    side_effects:
      - "on GRANT, stamps consent_granted_at and consent_expires_on (+365 days)"
      - "on DENY, cascades the application to SCREEN_FAILED / DISQUALIFIED / DqFile ARCHIVED"

  - method: POST
    path: "/clearinghouse-queries/{clearinghouse_query_id}/record-result"
    description: "CONSENT_GRANTED -> RESULT_CLEAR / RESULT_INFO_EXISTS / RESULT_PROHIBITED. result is one of {NO_INFO, INFORMATION_EXISTS, PROHIBITED}."
    roles: [DER]
    code: 200
    input: [result]
    output: ClearinghouseQuery
    side_effects:
      - "on NO_INFO, sets the CLEARINGHOUSE_QUERY DqDocument to PRESENT, recomputes DqFile completeness/status, increments DqFile.version by 1 and re-evaluates SCREENING -> SCREEN_CLEARED"
      - "on PROHIBITED, runs the four-hop cascade DriverApplication -> qualification_status -> DqFile -> Carrier"

