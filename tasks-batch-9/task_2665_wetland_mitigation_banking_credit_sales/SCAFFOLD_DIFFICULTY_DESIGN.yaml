            - "Permittee.${permittee_id}.escrow_balance_cents == 10170000"
            - "Permittee.${permittee_id}.deposited_cents == 40000000"
            - "MitigationBank.${bank_id}.credits_sold == 8.00"
            - "MitigationBank.${bank_id}.credits_on_hold == 0.00"
            - "MitigationBank.${bank_id}.credits_available == 6.82"

  - rule_id: combinatorial_formula
    instances:

      - name: work_plan_yield_rounds_per_stratum_before_summation
        grounds:
          - calculations.work_plan_credit_yield
          - entities.WorkPlan.fields.credit_strata
          - entities.WorkPlan.fields.total_planned_credits
          - endpoints.POST_/mitigation/work-plans
        distinguishing_aspect: |
          Combinatorial mode (b) — PINNED ROUNDING ORDER. The three strata are chosen so that
          rounding per stratum (38.06 + 44.06 + 16.65 = 98.77) and rounding the sum
          (round(98.775) = 98.78) differ by exactly 0.01 credit. Any implementation that accumulates
          unrounded products and rounds once at the end is detected. This is a pure ordering trap on
          a single formula; the other two instances of this rule trap input-interaction (mode a) and
          a circular dependency (mode c) respectively.
        test_recipe:
          setup:
            - "Sponsor with a DRAFT bank; no prospectus approval is needed because total_planned_credits is stamped at work-plan creation."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /mitigation/sponsors"
              payload: { legal_name: "Cypress Bend Mitigation LLC", legal_entity_type: "PRIVATE_ENTREPRENEURIAL", performance_bond_cents: 30000000 }
              as: ProgramAdmin
              captures: { sponsor_id: $.data.id }
            - call: "POST /mitigation/banks"
              payload: { sponsor_id: "${sponsor_id}", site_name: "Cypress Bend", site_huc8_code: "03130002", service_area_huc8_codes: ["03130002", "03130003"], hgm_class: "DEPRESSIONAL", annual_stewardship_cost_cents: 4200000 }
              as: Sponsor
              as_user_id: "${sponsor_id}"
              captures: { bank_id: $.data.id }
          trigger:
            - call: "POST /mitigation/work-plans"
