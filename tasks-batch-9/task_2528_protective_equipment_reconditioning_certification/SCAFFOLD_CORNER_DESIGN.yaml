              call: "POST /approved-parts"
              payload: { model_spec_id: "${model_id}", part_number: "PN-SHELL-1", component_code: "SHELL", oem_approved: true, unit_price_cents: 4500, received_qty: 4 }
              as: PlantManager
              captures: { part_id: $.data.id }
            - *k_ship1
            - *k_count1
            - *k_unit1
            - *k_accept1
            - *k_ident18
            - *k_disasm
            - *k_insp_ok
            - *k_bench
            - *k_cal
            - *k_test1
            - *k_impacts_repair
            - *k_determine_repair
            - *k_get_u1_v
            - *k_repair_order
            - &k_part_line
              call: "POST /repair-orders/${ro_id}/part-lines"
