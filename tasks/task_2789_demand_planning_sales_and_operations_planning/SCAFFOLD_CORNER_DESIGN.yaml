      - name: cycle_posture_green_only_when_gap_closed_and_no_constrained_plan
        claim_type: Correct Result
        grounds:
          - calculations.calc_cycle_posture
          - calculations.calc_cycle_financials
          - entities.PlanningCycle.fields.posture
        distinguishing_aspect: |
          The AT_RISK test is a disjunction, so a cycle whose money is comfortably over-covered
          (residual_gap_cents -1_530_000) still reports AT_RISK the instant ONE plan carries a
          binding constraint. Adding a second, capacity-starved plan flips the posture from
          GREEN to AT_RISK while making the residual gap MORE negative — an implementation that
          only looks at the money would report GREEN both times.
        test_recipe:
          setup:
            - "Two families: FAM-BASE with a 14-hour block (1400 units) and FAM-TIGHT with a 2-hour block (200 units), each with one MATURE item at 1000 cents, avg_monthly_demand_units 1000 and 95.0 / 0.20 / 30 (safety_stock_units 330)."
