        distinguishing_aspect: "depends_on_milestone_id referencing a milestone of a DIFFERENT application is rejected ERR_PREREQUISITE_INCOMPLETE at creation — the self-referential edge must stay inside one application."
        test_recipe:
          setup: ["Advisor A; pathway GEN; student; ACTIVE plan; two applications ap1/ap2 (seeded milestones exist on ap1)"]
