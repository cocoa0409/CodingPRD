    roles: [Backer]
    code: 201
    input: [campaign_id, pledge_id, component_sku, quantity]
    output: ReplacementRequest
    side_effects: ["region_code resolved from pledge", "campaign.version += 1"]

  - method: GET
    path: "/replacement-requests/{id}"
    description: "Get one replacement request"
    roles: [CampaignOwner, Backer, FactoryCoordinator, FreightBroker, CustomsAgent, FulfillmentOperator, Distributor, LocalizationPartner, PlatformAdmin]
