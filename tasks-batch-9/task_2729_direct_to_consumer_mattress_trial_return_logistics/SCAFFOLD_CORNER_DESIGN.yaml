          - complexity_profile.entity_topology
        distinguishing_aspect: "The flat topology links two independent aggregates by explicit foreign keys, so one created claim is reachable from the partner side and the order side of the same index, and the row carries commission_cents 0 until it is resolved."
        test_recipe:
