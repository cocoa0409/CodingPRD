            - { call: "POST /v1/container-lots", payload: { container_type: "CAN_330", quantity_received: 100, supplier_lot_code: "SUP-PG-03" }, as: WarehouseLead }
            - { call: "POST /v1/container-lots", payload: { container_type: "CAN_330", quantity_received: 100, supplier_lot_code: "SUP-PG-04" }, as: WarehouseLead }
            - { call: "POST /v1/container-lots", payload: { container_type: "CAN_330", quantity_received: 100, supplier_lot_code: "SUP-PG-05" }, as: WarehouseLead }
            - { call: "POST /v1/container-lots", payload: { container_type: "CAN_330", quantity_received: 100, supplier_lot_code: "SUP-PG-06" }, as: WarehouseLead }
            - { call: "POST /v1/container-lots", payload: { container_type: "CAN_330", quantity_received: 100, supplier_lot_code: "SUP-PG-07" }, as: WarehouseLead }
            - { call: "POST /v1/container-lots", payload: { container_type: "CAN_330", quantity_received: 100, supplier_lot_code: "SUP-PG-08" }, as: WarehouseLead }
            - { call: "POST /v1/container-lots", payload: { container_type: "CAN_330", quantity_received: 100, supplier_lot_code: "SUP-PG-09" }, as: WarehouseLead }
            - { call: "POST /v1/container-lots", payload: { container_type: "CAN_330", quantity_received: 100, supplier_lot_code: "SUP-PG-10" }, as: WarehouseLead }
            - { call: "POST /v1/container-lots", payload: { container_type: "CAN_330", quantity_received: 100, supplier_lot_code: "SUP-PG-11" }, as: WarehouseLead }
          trigger:
            - { call: "GET /v1/container-lots", payload: {}, as: Any, captures: { p1_type: $.response_type, p1_total: $.total_count, p1_more: $.has_more, p1_req: $.meta.api_request_id } }
            - { call: "GET /v1/container-lots?offset=10", payload: {}, as: Any, captures: { p2_total: $.total_count, p2_more: $.has_more, p2_first: "$.data[0].supplier_lot_code" } }
            - { call: "GET /v1/container-lots/00000000-0000-0000-0000-000000000000", payload: {}, as: Any, captures: { e_type: $.response_type, e_id: $.data.error_id } }
          assert:
