            - { call: "POST /sensory-lab/studies", payload: { client_id: "${client_id}", product_name: "Granola", study_type: "REAL_TIME", storage_temp_c: 20, target_shelf_life_days: 60, sensory_fail_threshold: 6.0, min_detectable_difference: 3.0, planned_start_utc: "2026-08-01T00:00:00Z" }, as: SensoryScientist, captures: { study_id: $.data.id } }
            - { call: "POST /sensory-lab/study-arms", payload: { study_id: "${study_id}", packaging_variant: "STANDARD_FILM", is_control: true }, as: SensoryScientist, captures: { arm_c: $.data.id } }
            - { call: "POST /sensory-lab/study-arms", payload: { study_id: "${study_id}", packaging_variant: "HIGH_BARRIER", is_control: false }, as: SensoryScientist, captures: { arm_v: $.data.id } }
            - { call: "POST /sensory-lab/sampling-time-points", payload: { study_id: "${study_id}", day_index: 0 }, as: SensoryScientist, captures: { tp0: $.data.id } }
            - { call: "POST /sensory-lab/sampling-time-points", payload: { study_id: "${study_id}", day_index: 1 }, as: SensoryScientist, captures: { tp1: $.data.id } }
            - { call: "POST /sensory-lab/chambers", payload: { chamber_code: "CH-NS", temp_c: 20, capacity_units: 10 }, as: LabDirector, captures: { chamber_id: $.data.id } }
            - { call: "POST /sensory-lab/studies/${study_id}/submit-design", payload: {}, as: SensoryScientist }
            - { call: "POST /sensory-lab/studies/${study_id}/approve-design", payload: {}, as: LabDirector }
            - { call: "POST /sensory-lab/evaluation-sessions", payload: { study_id: "${study_id}", time_point_id: "${tp0}", arm_id: "${arm_c}", scheduled_start_utc: "2026-08-02T09:00:00Z", scheduled_end_utc: "2026-08-02T10:00:00Z" }, as: PanelCoordinator, captures: { s1: $.data.id } }
            - { call: "POST /sensory-lab/evaluation-sessions", payload: { study_id: "${study_id}", time_point_id: "${tp0}", arm_id: "${arm_v}", scheduled_start_utc: "2026-08-02T10:00:00Z", scheduled_end_utc: "2026-08-02T11:00:00Z" }, as: PanelCoordinator, captures: { s2: $.data.id } }
            - { call: "POST /sensory-lab/evaluation-sessions", payload: { study_id: "${study_id}", time_point_id: "${tp1}", arm_id: "${arm_c}", scheduled_start_utc: "2026-08-02T11:00:00Z", scheduled_end_utc: "2026-08-02T12:00:00Z" }, as: PanelCoordinator, captures: { s3: $.data.id } }
            - { call: "POST /sensory-lab/evaluation-sessions", payload: { study_id: "${study_id}", time_point_id: "${tp1}", arm_id: "${arm_v}", scheduled_start_utc: "2026-08-02T12:00:00Z", scheduled_end_utc: "2026-08-02T13:00:00Z" }, as: PanelCoordinator, captures: { s4: $.data.id } }
            - { call: "POST /sensory-lab/studies/${study_id}/activate", payload: {}, as: SensoryScientist }
            - { call: "POST /sensory-lab/sampling-time-points/${tp0}/pull", payload: { chamber_id: "${chamber_id}", arm_id: "${arm_c}", quantity: 1, unit_purpose: "EVALUATION" }, as: SensoryScientist }
            - { call: "POST /sensory-lab/sampling-time-points/${tp0}/pull", payload: { chamber_id: "${chamber_id}", arm_id: "${arm_v}", quantity: 1, unit_purpose: "EVALUATION" }, as: SensoryScientist }
            - { call: "POST /sensory-lab/panelists", payload: { full_name: "N Show", email: "n1@lab.com", qualified_attributes: ["APPEARANCE", "AROMA", "FLAVOR", "TEXTURE", "OFF_FLAVOR", "OVERALL"] }, as: PanelCoordinator, captures: { p: $.data.id } }
            - { call: "POST /sensory-lab/panelists/${p}/record-screening", payload: { acuity_score: 92 }, as: PanelCoordinator }
            - { call: "POST /sensory-lab/panelists/${p}/record-training", payload: {}, as: PanelCoordinator }
            - { call: "POST /sensory-lab/panelists/${p}/record-training", payload: {}, as: PanelCoordinator }
            - { call: "POST /sensory-lab/panelists/${p}/record-training", payload: {}, as: PanelCoordinator }
            - { call: "POST /sensory-lab/panel-assignments", payload: { session_id: "${s1}", panelist_id: "${p}" }, as: PanelCoordinator, captures: { a1: $.data.id } }
            - { call: "POST /sensory-lab/panel-assignments", payload: { session_id: "${s2}", panelist_id: "${p}" }, as: PanelCoordinator, captures: { a2: $.data.id } }
            - { call: "POST /sensory-lab/panel-assignments", payload: { session_id: "${s3}", panelist_id: "${p}" }, as: PanelCoordinator, captures: { a3: $.data.id } }
            - { call: "POST /sensory-lab/panel-assignments", payload: { session_id: "${s4}", panelist_id: "${p}" }, as: PanelCoordinator, captures: { a4: $.data.id } }
