            - "${w} == 4.0 and ${a_before} == 4.0"
            - "${owner_mid} == ${cm_b} and ${reason_mid} == TRANSFERRED"
            - "${a_mid} == 0.0 and ${b_mid} == 4.0"
            - "${a_mid_status} == OPEN"
            - "${owner_final} == ${cm_a}"
            - "${a_final} == 4.0"
            - "${b_final} == 0.0"
            - "${a_final_status} == OPEN and ${b_final_status} == OPEN"
            - "${a_final} + ${b_final} == 4.0, equal to the value of the same sum before the first transfer"
            - "Enrollment.${enr}.acuity_weight_points == 4.0 (unchanged by either transfer)"
            - "${v3} == ${v2} + 1"

      - name: program_committed_staff_minutes_conserved_across_intervention_void
        grounds:
          - state_machines.Intervention.PLANNED_to_VOIDED
          - entities.Program.fields.committed_staff_minutes
          - entities.Program.fields.delivered_staff_minutes
          - calculations.intervention_cost_cents
        distinguishing_aspect: |
          Conserved quantity two is a different kind entirely - program staff minutes, not caseload
          points: the invariant Program.committed_staff_minutes == sum(Intervention.staff_minutes
          over status PLANNED) must read 45 before the second intervention is planned, 75 while it is
          PLANNED and 45 again after the compensating void, with delivered_staff_minutes flat at 0
          throughout and the voided row's cost_cents left at its frozen 4500.
        test_recipe:
          setup:
            - "Clock at its 2026-08-01T00:00:00Z default; program staff_minute_budget 100000 and hourly_cost_cents 9000."
            - "Enrollment ACTIVE with an ACTIVE care plan carrying one OPEN goal."
            - "One PLANNED intervention of 45 staff minutes already exists under that goal."
          setup_api_calls:
            - call: "POST /care-management/programs"
              payload: { name: "Budget Invariant Program", min_risk_tier: "LOW", stratification_variant: "CONCURRENT", required_credential_levels: ["RN"], staff_minute_budget: 100000, hourly_cost_cents: 9000, cohort_benchmark_pmpm_cents: 100000 }
              as: ProgramAdmin
              captures: { prog: $.data.id, committed0: $.data.committed_staff_minutes }
            - call: "POST /care-management/care-managers"
              payload: { full_name: "Rita Nolan", credential_level: "RN", licensed_state_codes: ["CA"], capacity_points: 20.0 }
              as: ProgramAdmin
              captures: { cm_a: $.data.id }
            - call: "POST /care-management/care-managers"
              payload: { full_name: "Dana Ruiz", credential_level: "RN", licensed_state_codes: ["CA"], capacity_points: 20.0 }
              as: ProgramAdmin
              captures: { cm_rev: $.data.id }
            - call: "POST /care-management/members"
              payload: { external_member_id: "MBR-2401", full_name: "Ira Wells", birth_date: "1967-03-13", state_code: "CA", chronic_condition_count: 0 }
              as: ProgramAdmin
              captures: { m: $.data.id }
            - call: "POST /care-management/members/${m}/stratifications"
              payload: { variant: "CONCURRENT" }
              as: UtilizationAnalyst
            - call: "POST /care-management/enrollments"
              payload: { member_id: "${m}", program_id: "${prog}", care_manager_id: "${cm_a}" }
              as: ProgramAdmin
              captures: { enr: $.data.id }
            - call: "POST /care-management/enrollments/${enr}/activate"
              payload: {}
              as: ProgramAdmin
            - call: "POST /care-management/care-plans"
              payload: { enrollment_id: "${enr}", title: "Budget plan" }
              as: CareManager
              as_user_id: "${cm_a}"
              captures: { plan: $.data.id }
            - call: "POST /care-management/care-plans/${plan}/goals"
              payload: { domain: "CLINICAL", description: "Self-management education", target_date: "2026-12-01" }
              as: CareManager
              as_user_id: "${cm_a}"
              captures: { goal: $.data.id }
            - call: "POST /care-management/care-plans/${plan}/submit"
              payload: {}
              as: CareManager
              as_user_id: "${cm_a}"
            - call: "POST /care-management/care-plans/${plan}/review"
              payload: { decision: "APPROVE" }
              as: ClinicalReviewer
              as_user_id: "${cm_rev}"
            - call: "POST /care-management/goals/${goal}/interventions"
              payload: { modality: "EDUCATION", staff_minutes: 45 }
              as: CareManager
              as_user_id: "${cm_a}"
              captures: { iv_keep: $.data.id, keep_cost: $.data.cost_cents }
            - call: "GET /care-management/programs/${prog}"
              payload: {}
              as: ProgramAdmin
              captures: { committed1: $.data.committed_staff_minutes, delivered1: $.data.delivered_staff_minutes }
          trigger:
            - call: "POST /care-management/goals/${goal}/interventions"
              payload: { modality: "PHONE", staff_minutes: 30 }
              as: CareManager
              as_user_id: "${cm_a}"
              captures: { iv_void: $.data.id, void_cost: $.data.cost_cents }
            - call: "GET /care-management/programs/${prog}"
              payload: {}
              as: ProgramAdmin
              captures: { committed2: $.data.committed_staff_minutes }
            - call: "POST /care-management/interventions/${iv_void}/void"
              payload: { void_reason: "Duplicate outreach entry." }
              as: CareManager
              as_user_id: "${cm_a}"
              captures: { void_status: $.data.status, void_cost_after: $.data.cost_cents }
            - call: "GET /care-management/programs/${prog}"
              payload: {}
              as: ProgramAdmin
              captures: { committed3: $.data.committed_staff_minutes, delivered3: $.data.delivered_staff_minutes }
            - call: "GET /care-management/goals/${goal}"
              payload: {}
              as: ProgramAdmin
              captures: { planned_count: $.data.planned_intervention_count, goal_status: $.data.status }
          assert:
            - "${committed0} == 0"
            - "${keep_cost} == 6750 and ${void_cost} == 4500"
            - "${committed1} == 45 and ${delivered1} == 0"
            - "${committed2} == 75"
            - "${void_status} == VOIDED"
            - "${void_cost_after} == 4500"
            - "${committed3} == 45"
            - "${delivered3} == 0"
            - "${committed3} == ${committed1}, so the create-then-void round trip leaves the conserved quantity unchanged"
            - "${planned_count} == 1"
            - "${goal_status} == OPEN"
            - "Intervention.${iv_keep}.status == PLANNED"
