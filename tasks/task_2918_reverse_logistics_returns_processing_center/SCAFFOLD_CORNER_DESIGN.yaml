          setup:
            - "Client SM10 with restock_grade_floor A so a B-grade line is not restocked, a refurb_eligible SKU at declared_value_cents 20000, and a GENERAL bay with buffer_minutes 0. The line is graded B / DEFECTIVE, which resolves to REFURBISH via D5 (round_half_up(20000 * 0.65) - 6000 == 7000 > 0)."
