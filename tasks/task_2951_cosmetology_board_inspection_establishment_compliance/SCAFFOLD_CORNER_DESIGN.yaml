          setup:
            - "School 'Pipeline Academy' with required_clock_hours 16.0 and accreditation_status ACCREDITED."
            - "Practitioner 'Dov Halevi' has a single 8.0-hour SANITATION school record (8.0 credited, short of 16.0)."
