              captures: { err: "$.data.error_id" }
          assert:
            - "412 ERR_CERTIFICATE_VERSION_CONFLICT: the certificate has been written twice since ${cv0} was read (ISSUED to UNDER_APPEAL, then back to ISSUED)"
            - "GET /grain-inspection/applicants/${app} -> charges_total_cents equals charges_before: a refused filing takes no deposit"
            - "GET /grain-inspection/certificates/${cert} -> version == ${cv0} + 2 and status ISSUED: every write incremented the version by exactly one"
            - "GET /grain-inspection/certificates/${cert}/appeals -> total_count 1 (only the dismissed one)"
            - "Re-reading the certificate and resubmitting the identical body with the current version -> 201 with a new deposit charged"

      - name: stale_appeal_version_is_refused_when_casting_a_vote
