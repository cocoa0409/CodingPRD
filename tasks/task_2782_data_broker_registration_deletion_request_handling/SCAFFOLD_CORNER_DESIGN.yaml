              payload: { broker_id: "${broker_id}", identity_hash: "sha256:occ00002occ00002", state_code: "CA", source_label: "OWNERSHIP_FEED_D", derived_profile_count: 0 }
              as: IntakeAgent
              captures: { consumer_id: $.data.id, consumer_v1: $.data.version }
            - call: "POST /consumers/${consumer_id}/collections"
              payload: { source_label: "OWNERSHIP_FEED_E" }
              as: IntakeAgent
              captures: { consumer_v2: $.data.version }
          trigger:
            - call: "POST /opt-out-signals"
              payload: { broker_id: "${broker_id}", consumer_id: "${consumer_id}", signal_type: "GPC_BROWSER", scope: "SALE", expected_consumer_version: "${consumer_v1}", gpc_header_value: "1" }
              as: Consumer
              as_user_id: "${consumer_id}"
              expect_error: { error_id: ERR_STALE_CONSUMER_VERSION, http_status: 412 }
            - call: "POST /opt-out-signals"
              payload: { broker_id: "${broker_id}", consumer_id: "${consumer_id}", signal_type: "GPC_BROWSER", scope: "SALE", expected_consumer_version: "${consumer_v2}", gpc_header_value: "1" }
              as: Consumer
              as_user_id: "${consumer_id}"
              captures: { signal_id: $.data.id }
          assert:
            - "${consumer_v1} == 1 and ${consumer_v2} == 2"
            - "the stale attempt carries data.error_id == ERR_STALE_CONSUMER_VERSION with HTTP 412"
            - "after the stale attempt, GET /opt-out-signals?consumer_id=${consumer_id} reports total_count == 0 and Consumer.${consumer_id}.opt_out_sale == false"
            - "the fresh attempt returns HTTP 201 with OptOutSignal.${signal_id}.status == HONORED"
            - "Consumer.${consumer_id}.opt_out_sale == true"
            - "Consumer.${consumer_id}.opt_out_sharing == false"
            - "Consumer.${consumer_id}.version == 3"

      - name: deferred_signal_honoring_fires_only_once_the_deadline_is_reached
        claim_type: scheduled_actions
        grounds:
          - endpoints.POST__ops_run_compliance_sweep
          - state_machines.OptOutSignal.transitions.RECEIVED_to_HONORED
          - calculations.temporal_default_derivation.constants.SIGNAL_HONOR_DEADLINE_DAYS
        distinguishing_aspect: >
          A WRITTEN_REQUEST signal is not honored inside its creating request, so it sits RECEIVED
          with honor_deadline_at 2026-10-16. A sweep at 2026-10-15 must honor nothing; the sweep at
          2026-10-16 — the deadline instant itself, which the at-or-before test includes — honors
          exactly one signal and flips only opt_out_sale, matching its SALE scope.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z; one DataBroker and one CA Consumer with both opt-out flags false."
            - "One RECEIVED OptOutSignal of type WRITTEN_REQUEST with scope SALE, created at 2026-09-01T00:00:00Z so honor_deadline_at is 2026-10-16T00:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /brokers"
              payload: { legal_name: "Silverleaf Data Exchange", primary_contact_email: "compliance@silverleaf.example", home_state_code: "CA", operating_state_codes: ["CA"], business_description: "Resells licensed automotive and household ownership attributes to lead generators." }
              as: PlatformAdmin
              captures: { broker_id: $.data.id }
            - call: "POST /consumers"
              payload: { broker_id: "${broker_id}", identity_hash: "sha256:sig00001sig00001", state_code: "CA", source_label: "OWNERSHIP_FEED_D", derived_profile_count: 0 }
              as: IntakeAgent
              captures: { consumer_id: $.data.id, consumer_v1: $.data.version }
            - call: "POST /opt-out-signals"
              payload: { broker_id: "${broker_id}", consumer_id: "${consumer_id}", signal_type: "WRITTEN_REQUEST", scope: "SALE", expected_consumer_version: "${consumer_v1}" }
              as: IntakeAgent
              captures: { signal_id: $.data.id }
          trigger:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-10-15T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /_ops/run-compliance-sweep"
              payload: {}
              as: PlatformAdmin
              captures: { early_honored: $.data.honored_signal_count }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-10-16T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /_ops/run-compliance-sweep"
              payload: {}
              as: PlatformAdmin
              captures: { due_honored: $.data.honored_signal_count, due_swept_at: $.data.swept_at }
          assert:
            - "immediately after creation, OptOutSignal.${signal_id}.status == RECEIVED with honored_at == null and honor_deadline_at == 2026-10-16T00:00:00Z"
            - "${early_honored} == 0"
            - "after the 2026-10-15 sweep, OptOutSignal.${signal_id}.status == RECEIVED and Consumer.${consumer_id}.opt_out_sale == false"
            - "${due_honored} == 1 and ${due_swept_at} == 2026-10-16T00:00:00Z"
            - "OptOutSignal.${signal_id}.status == HONORED"
            - "OptOutSignal.${signal_id}.honored_at == 2026-10-16T00:00:00Z"
            - "Consumer.${consumer_id}.opt_out_sale == true"
            - "Consumer.${consumer_id}.opt_out_sharing == false"
            - "GET /brokers/${broker_id}/audit-events?event_type=OPT_OUT_HONORED reports total_count == 1"

      - name: layer_cascading_side_effects_end_to_end_on_final_ack
        claim_type: cascading_side_effects
        grounds:
          - state_machines.PropagationTask.transitions.DISPATCHED_to_ACKED
          - state_machines.DeletionRequest.transitions.EXECUTING_to_COMPLETED
        excluded_because:
          difficulty_instance: transitive_cascade / final_ack_completes_request_purges_consumer_mints_suppression_supersedes_sibling
          rationale: "The named §1.8 instance already verifies the four-level chain end to end, in order, from a single ack."

      - name: layer_dual_variant_calculation_on_the_filing_fee
        claim_type: dual_variant_calculation
        grounds:
          - calculations.filing_fee_assessment.variants
        excluded_because:
          difficulty_instance: dual_variant_calc / filing_fee_provisional_at_submit_versus_final_at_acceptance
          rationale: "The named §1.8 instance asserts both variants and the settlement delta on the same filing."

  - section: consistency_model
    instances:
      - name: acceptance_effects_are_visible_in_the_same_response
        claim_type: immediate
        grounds:
          - response_envelope
          - state_machines.Registration.transitions.SUBMITTED_to_ACCEPTED
          - calculations.registry_standing_derivation
        distinguishing_aspect: >
          Under the immediate model the accept response body itself must already carry status
          ACCEPTED and the settled charged_fee_cents 23307 — not the provisional 47000 — and the
          very next reads must agree with it, showing fee_paid_cents 23307, fee_credit_cents 476693
          and registry_standing COMPLIANT with no re-read lag.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z; one DataBroker operating in CA with a 500000-cent fee deposit."
            - "One SUBMITTED CA Registration covering 2026-09-01T00:00:00Z to 2027-03-01T00:00:00Z with all four required disclosures at full length, so charged_fee_cents is the provisional 47000."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /brokers"
              payload: { legal_name: "Silverleaf Data Exchange", primary_contact_email: "compliance@silverleaf.example", home_state_code: "CA", operating_state_codes: ["CA"], business_description: "Resells licensed automotive and household ownership attributes to lead generators." }
              as: PlatformAdmin
              captures: { broker_id: $.data.id }
            - call: "POST /brokers/${broker_id}/fee-deposits"
              payload: { amount_cents: 500000 }
              as: BrokerAdmin
              as_user_id: "${broker_id}"
              captures: { broker_v1: $.data.version }
            - call: "POST /registrations"
              payload: { broker_id: "${broker_id}", state_code: "CA", coverage_period_start: "2026-09-01T00:00:00Z", coverage_period_end: "2027-03-01T00:00:00Z", business_description: "California registry filing for the automotive and household attribute resale business.", expected_broker_version: "${broker_v1}" }
              as: BrokerAdmin
              as_user_id: "${broker_id}"
              captures: { reg_id: $.data.id }
            - call: "POST /registrations/${reg_id}/disclosures"
              payload: { category: "SOURCES", content: "Public records, loyalty programme partners and licensed survey panels supply the source data.", covers_sensitive_categories: false }
              as: BrokerAdmin
              as_user_id: "${broker_id}"
            - call: "POST /registrations/${reg_id}/disclosures"
              payload: { category: "RECIPIENTS", content: "Advertising networks, analytics vendors and credit marketing affiliates receive the segments.", covers_sensitive_categories: false }
              as: BrokerAdmin
              as_user_id: "${broker_id}"
            - call: "POST /registrations/${reg_id}/disclosures"
              payload: { category: "RETENTION", content: "Records are retained for thirty-six months after the last verified engagement event.", covers_sensitive_categories: false }
              as: BrokerAdmin
              as_user_id: "${broker_id}"
            - call: "POST /registrations/${reg_id}/disclosures"
              payload: { category: "OPT_OUT_MECHANISM", content: "Consumers opt out through the web portal, the state platform or a recognised GPC signal.", covers_sensitive_categories: false }
              as: BrokerAdmin
              as_user_id: "${broker_id}"
            - call: "POST /registrations/${reg_id}/submit"
              payload: {}
              as: BrokerAdmin
              as_user_id: "${broker_id}"
              captures: { provisional_fee: $.data.charged_fee_cents }
          trigger:
            - call: "POST /registrations/${reg_id}/accept"
              payload: {}
              as: PlatformAdmin
              captures: { accept_status: $.data.status, accept_fee: $.data.charged_fee_cents }
            - call: "GET /brokers/${broker_id}"
              payload: {}
              as: PlatformAdmin
              captures: { read_paid: $.data.fee_paid_cents, read_credit: $.data.fee_credit_cents, read_standing: $.data.registry_standing }
          assert:
            - "${provisional_fee} == 47000"
            - "${accept_status} == ACCEPTED"
            - "${accept_fee} == 23307"
            - "${read_paid} == 23307"
            - "${read_credit} == 476693"
            - "${read_standing} == COMPLIANT"
            - "every response body carries the keys meta, response_type and data at the top level with response_type == success"
            - "GET /brokers/${broker_id}/audit-events?event_type=REGISTRATION_ACCEPTED reports total_count == 1"
            - "GET /brokers/${broker_id}/audit-events?event_type=STANDING_CHANGED reports total_count == 1"
