                mandatory_requirements:
                  - { requirement_code: "REQ-BASE", description: "cured in place liner", materiality: "MATERIAL", is_waivable: false }
              as: ProcurementOfficer
              as_user_id: "U-OFFICER-1"
              captures: { c_s41_id: $.data.id }
