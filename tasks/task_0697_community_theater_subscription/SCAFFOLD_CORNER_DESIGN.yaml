  # ===========================================================================
  # excluded_because stubs — corners already covered by §1.8 difficulty instances
  # ===========================================================================
  - section: state_machines
    instances:
      - name: subscription_activate_prices_seats_stub
        claim_type: Side Effect Execution
        grounds: [state_machines.Subscription.DRAFT_to_ACTIVE]
        excluded_because:
          difficulty_instance: subscription_pricing_new_vs_renewal_variant
          rationale: "Activation pricing side-effect and total_price_cents are asserted by the named §1.8 dual_variant_calc instance."

      - name: performance_cancel_cascade_stub
        claim_type: Cross-entity
        grounds: [state_machines.Performance.ON_SALE_to_CANCELLED]
        excluded_because:
          difficulty_instance: performance_cancel_depth3_cascade
          rationale: "The full cancel cascade (void, refund credit, subscription-seat release) is asserted by the named §1.8 transitive_cascade instance."

  - section: calculations
    instances:
      - name: subscription_renewal_loyalty_discount_stub
        claim_type: Variant Divergence
        grounds: [calculations.subscription_pricing]
        excluded_because:
          difficulty_instance: subscription_pricing_new_vs_renewal_variant
          rationale: "The new-vs-renewal price divergence is the core assertion of the named §1.8 instance."

      - name: subscription_rounding_order_stub
        claim_type: Precision
        grounds: [calculations.subscription_pricing]
        excluded_because:
          difficulty_instance: subscription_pricing_round_per_seat_then_sum_order
          rationale: "Floor-per-seat-then-sum precision is asserted by the named §1.8 combinatorial_formula instance."

  - section: validations
    instances:
      - name: ticket_sold_out_violation_stub
        claim_type: Violation → Error
        grounds: ["errors[ERR_PERFORMANCE_SOLD_OUT]"]
        excluded_because:
          difficulty_instance: performance_soldout_at_zero_available
          rationale: "ERR_PERFORMANCE_SOLD_OUT trigger is the assertion of the named §1.8 boundary_precision_check instance."

      - name: seat_already_taken_violation_stub
        claim_type: Violation → Error
        grounds: ["errors[ERR_SEAT_ALREADY_TAKEN]"]
        excluded_because:
          difficulty_instance: seat_point_occupancy_collision_on_performance
          rationale: "ERR_SEAT_ALREADY_TAKEN trigger is the assertion of the named §1.8 resource_temporal_overlap instance."

  - section: cross_cutting_complexity_layers
    instances:
      - name: occ_stale_season_version_stub
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[subscription-activate-stale-season]", "errors[ERR_STALE_SEASON_VERSION]"]
        excluded_because:
          difficulty_instance: subscription_pricing_new_vs_renewal_variant
          rationale: "The activation OCC path on Season.version is exercised by the named §1.8 instance's activate trigger which carries expected_season_version."
