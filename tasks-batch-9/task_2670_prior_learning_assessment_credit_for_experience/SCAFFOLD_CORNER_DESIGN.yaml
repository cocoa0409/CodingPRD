      - name: cumulative_payments_above_the_balance_rejected_as_exceeds_balance
        claim_type: aggregate_validation
        grounds:
          - validations[priority 41].ERR_PAYMENT_EXCEEDS_BALANCE
          - entities.FeeInvoice.fields.balance_due_cents
          - endpoints[POST /fee-invoices/{invoice_id}/payments]
