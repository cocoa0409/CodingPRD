      - name: shipment_feed_recomputes_ppm_and_walks_posture_back_to_green
        claim_type: action_endpoint
        grounds:
          - endpoints[POST /private-label/items/{item_id}/shipment-feed]
          - calculations.complaint_ppm_trend
          - entities.Supplier.fields.probation_item_count
        distinguishing_aspect: |
          The feed changes only the denominator, and the posture recompute is bidirectional: 8 weighted points over
          50000 units is 160.00 ppm (PROBATION), and restating the trailing units as 200000 drops it to 40.00 ppm
          and walks the posture all the way back to GREEN in one step, decrementing the supplier probation count.
          An implementation that only escalates posture, or that steps down one level at a time to WATCH, fails.
