        grounds:
          - validations[priority=23]
          - errors[ERR_FEE_CAP_EXCEEDED]
        distinguishing_aspect: "The 2,500,000-cent contingent-fee cap is inclusive at the boundary: exactly 2,500,000 succeeds, 2,500,001 fails ERR_FEE_CAP_EXCEEDED."
