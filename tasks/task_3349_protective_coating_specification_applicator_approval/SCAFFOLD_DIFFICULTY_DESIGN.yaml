              payload: { work_order_id: "${wo1_id}", term_years: 5, exposure_cents: 70000 }
              as: ProjectEngineer
              captures: { war1_id: "$.data.id" }
            - call: "POST /coating/projects/${proj_id}/warranties"
              payload: { work_order_id: "${wo2_id}", term_years: 3, exposure_cents: 30000 }
              as: ProjectEngineer
              captures: { war2_id: "$.data.id" }
          trigger:
            - call: "GET /coating/projects/${proj_id}"
              as: PlatformAdmin
            - call: "POST /coating/projects/${proj_id}/warranties/${war1_id}/claim"
              payload: { defect_mode: CRACKING, evidence_notes: "hairline cracking panel 4" }
              as: OwnerRepresentative
            - call: "GET /coating/projects/${proj_id}"
              as: PlatformAdmin
            - call: "GET /coating/warranties/${war1_id}/investigations"
              as: PlatformAdmin
              captures: { inv_id: "$.data[0].id" }
            - call: "POST /coating/warranties/${war1_id}/investigations/${inv_id}/begin-evidence"
              as: TechnicalServiceEngineer
            - call: "POST /coating/warranties/${war1_id}/investigations/${inv_id}/adjudicate"
              payload: { outcome: "NO_DEFECT" }
              as: TechnicalServiceEngineer
            - call: "GET /coating/warranties/${war1_id}"
              as: PlatformAdmin
            - call: "GET /coating/projects/${proj_id}"
              as: PlatformAdmin
            - call: "POST /coating/projects/${proj_id}/warranties/${war2_id}/void"
              payload: { void_reason: "applicator fraud documented in audit" }
              as: TechnicalServiceEngineer
            - call: "GET /coating/warranties/${war2_id}"
              as: PlatformAdmin
            - call: "GET /coating/projects/${proj_id}"
              as: PlatformAdmin
          assert:
            - "Project.${proj_id}.committed_warranty_exposure_cents == 100000 after both issuances (70000 + 30000 lands exactly on the inclusive budget)"
            - "Project.${proj_id}.committed_warranty_exposure_cents == 100000 after the claim (ACTIVE -> CLAIMED releases nothing; CLAIMED still counts)"
            - "Warranty.${war1_id}.status == DENIED after the NO_DEFECT adjudication"
            - "Project.${proj_id}.committed_warranty_exposure_cents == 30000 after denial releases W1's 70000"
            - "Warranty.${war2_id}.status == VOIDED"
            - "Project.${proj_id}.committed_warranty_exposure_cents == 0 after void releases W2's 30000 (net zero over the full lifecycle)"




