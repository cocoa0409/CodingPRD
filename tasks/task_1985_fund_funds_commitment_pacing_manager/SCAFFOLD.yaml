    path: "/fof/vehicles/{vehicleId}"
    description: "Get one vehicle by id (flat form)"
    roles: [CIO, Analyst, InvestmentCommittee, OperationsAnalyst, ComplianceOfficer]
    code: 200
    input: []
    output: FundVehicle
    side_effects: []

  - method: GET
