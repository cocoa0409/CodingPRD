# =============================================================================
# SCAFFOLD.yaml — BSA Suspicious Activity Reporting & Case Management
# =============================================================================

scenario: |
  generate task hard than expert level! 1251. BSA Suspicious Activity Reporting & Case Management (bank BSA/AML department): alert generation from monitoring scenarios & tuning thresholds, case investigation & customer/transaction research, SAR decision, narrative drafting & 30-day filing clock, continuing activity review & 90-day cycle, law enforcement inquiry & 314(b) information sharing, subject account decisioning (retain/exit), quality assurance & backlog management, model tuning documentation

domain_name: bsa-sar-case-management
api_prefix: ""

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: workflow_orchestration
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - scheduled_actions
  entity_topology: flat
  state_machine_shape: cyclic
  relationship_patterns:
    - one_to_many
    - self_referential
    - cross_aggregate
  role_model: segregation_of_duties
  consistency_model: immediate

# =============================================================================
# 1.0 Response Envelope (FIXED)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# 1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Analyst
    parent: null
    common_fields: true
    fields:
      - { name: full_name, type: string, source: input, description: "Analyst display name" }
      - { name: capacity_max_cases, type: integer, source: input, default: 10, description: "Maximum number of open cases an analyst may hold at once" }
      - { name: assigned_open_cases, type: integer, source: computed, default: 0, description: "Count of Cases with assigned_analyst_id == this analyst and status NOT IN {CLOSED}; +1 on assign, -1 on close, moved on reassign" }

  - name: Customer
    parent: null
    common_fields: true
    fields:
      - { name: full_name, type: string, source: input, description: "Customer legal name" }
      - { name: country_code, type: string, source: input, description: "ISO 3166-1 alpha-2 residence country" }
      - { name: country_risk, type: enum, source: input, description: "LOW | HIGH — selects STANDARD vs ENHANCED variant of customer_risk_rating_recompute" }
      - { name: status, type: enum, source: system, default: ACTIVE, description: "ACTIVE | EXITED" }
      - { name: sar_filings_365d, type: integer, source: computed, default: 0, description: "Count of SARReport with status FILED for this customer and filed_at within (now-365d, now]" }
      - { name: open_le_inquiry_count, type: integer, source: computed, default: 0, description: "Count of LawEnforcementInquiry for this customer with status IN {RECEIVED, UNDER_REVIEW, RESPONDED}" }
      - { name: any_account_exited, type: boolean, source: computed, default: false, description: "True iff any Account of this customer has status EXITED" }
      - { name: risk_score_standard, type: integer, source: computed, default: 100, description: "STANDARD variant score per customer_risk_rating_recompute" }
      - { name: risk_score_enhanced, type: integer, source: computed, default: 100, description: "ENHANCED variant score per customer_risk_rating_recompute" }
      - { name: risk_rating, type: enum, source: computed, default: LOW, description: "LOW | MEDIUM | HIGH | PROHIBITED — derived from the applicable variant score" }

  - name: Account
    parent: Customer
    common_fields: true
    fields:
      - { name: customer_id, type: string, source: system, description: "FK -> Customer.id; owning customer (from path)" }
      - { name: account_number, type: string, source: input, description: "Globally unique account number" }
      - { name: status, type: enum, source: system, default: OPEN, description: "OPEN | RESTRICTED | EXITED" }
      - { name: restriction_reason, type: string, source: system, description: "Nullable — RISK_CASCADE | DECISION when restricted" }

  - name: Transaction
    parent: Account
    common_fields: false
    fields:
      - { name: account_id, type: string, source: system, description: "FK -> Account.id; owning account (from path)" }
      - { name: amount_cents, type: integer, source: input, description: "Transaction amount in cents; must be > 0" }
      - { name: txn_type, type: enum, source: input, description: "CASH_DEPOSIT | WIRE_IN | WIRE_OUT | ACH_DEBIT | CHECK_DEPOSIT" }
      - { name: direction, type: enum, source: input, description: "CREDIT | DEBIT" }
      - { name: counterparty_country, type: string, source: input, description: "ISO country of counterparty; used for geo risk fraction" }
      - { name: posted_at, type: datetime, source: input, description: "Posting timestamp (ISO8601 UTC); drives evaluation window membership" }
      - { name: channel, type: enum, source: input, description: "BRANCH | ATM | ONLINE | WIRE_DESK" }

  - name: MonitoringScenario
    parent: null
    common_fields: true
    fields:
      - { name: scenario_code, type: string, source: input, description: "Unique scenario code, e.g. STRUCT-CASH-7D" }
      - { name: name, type: string, source: input, description: "Human name" }
      - { name: applies_to_txn_types, type: array, source: input, description: "Array of Transaction.txn_type values included in evaluation" }
      - { name: direction_filter, type: enum, source: input, description: "CREDIT | DEBIT | BOTH — transaction direction filter" }
      - { name: status, type: enum, source: system, default: DRAFT, description: "DRAFT | ACTIVE | SUSPENDED | RETIRED" }
      - { name: baseline_weight_amount, type: number, source: input, default: 0.5, description: "Baseline (pre-tuning) weight for amount component of alert_risk_score" }
      - { name: baseline_weight_velocity, type: number, source: input, default: 0.3, description: "Baseline weight for velocity component" }
      - { name: baseline_weight_geo, type: number, source: input, default: 0.2, description: "Baseline weight for geography component" }
      - { name: stale_alert_days, type: integer, source: input, default: 30, description: "Alerts in NEW|UNDER_TRIAGE with age strictly greater than this many days are AUTO_CLOSED by the daily sweep" }
      - { name: current_active_threshold_id, type: string, source: computed, description: "Nullable — id of the ScenarioThreshold currently ACTIVE for this scenario (derived, not a navigable FK)" }

  - name: ScenarioThreshold
    parent: MonitoringScenario
    common_fields: true
    fields:
      - { name: scenario_id, type: string, source: system, description: "FK -> MonitoringScenario.id; owning scenario (from path)" }
      - { name: version_number, type: integer, source: system, description: "Per-scenario monotone integer assigned in created_at order, starting at 1" }
      - { name: threshold_amount_cents, type: integer, source: input, description: "Alert fires when window aggregate >= this (inclusive)" }
      - { name: lookback_days, type: integer, source: input, description: "Evaluation window length in days; window is (evaluated_at - lookback_days, evaluated_at]" }
      - { name: min_transaction_count, type: integer, source: input, description: "Alert fires when window transaction count >= this (inclusive)" }
      - { name: weight_amount, type: number, source: input, description: "Tuned weight for amount component" }
      - { name: weight_velocity, type: number, source: input, description: "Tuned weight for velocity component" }
      - { name: weight_geo, type: number, source: input, description: "Tuned weight for geography component" }
      - { name: effective_from, type: datetime, source: input, description: "Window start (half-open, inclusive lower bound)" }
      - { name: effective_to, type: datetime, source: input, description: "Optional window end (exclusive); null = open-ended. Overwritten by system on supersede" }
      - { name: tuning_rationale, type: string, source: input, description: "Model tuning documentation: why parameters changed" }
      - { name: backtest_precision, type: number, source: input, description: "Backtest precision metric (0..1) — tuning documentation" }
      - { name: backtest_recall, type: number, source: input, description: "Backtest recall metric (0..1) — tuning documentation" }
      - { name: status, type: enum, source: system, default: PROPOSED, description: "PROPOSED | APPROVED | ACTIVE | SUPERSEDED" }
      - { name: proposed_by_analyst_id, type: string, source: system, description: "Actor stamp: X-User-ID of proposing BSAAnalyst" }
      - { name: approved_by_analyst_id, type: string, source: system, description: "Nullable actor stamp: BSAManager who approved" }

  - name: Alert
    parent: null
    common_fields: true
    fields:
      - { name: scenario_id, type: string, source: system, description: "FK -> MonitoringScenario.id; generating scenario" }
      - { name: scenario_threshold_id, type: string, source: system, description: "FK -> ScenarioThreshold.id; threshold version pinned at generation — never re-pointed" }
      - { name: account_id, type: string, source: system, description: "FK -> Account.id; evaluated account" }
      - { name: customer_id, type: string, source: system, description: "FK -> Customer.id; denormalized from account at generation" }
      - { name: case_id, type: string, source: system, description: "Nullable FK -> Case.id; set on link-to-case" }
      - { name: window_start, type: datetime, source: system, description: "Exclusive lower bound of evaluated window" }
      - { name: window_end, type: datetime, source: system, description: "Inclusive upper bound of evaluated window (== evaluated_at)" }
      - { name: aggregate_amount_cents, type: integer, source: system, description: "Sum of in-window matching transaction amounts" }
      - { name: txn_count, type: integer, source: system, description: "Count of in-window matching transactions" }
      - { name: risk_score, type: integer, source: system, description: "Score computed with the ACTIVE (tuned) threshold weights per alert_risk_score" }
      - { name: baseline_score, type: integer, source: system, description: "Score computed with scenario baseline weights (shadow variant for tuning comparison)" }
      - { name: status, type: enum, source: system, default: NEW, description: "NEW | UNDER_TRIAGE | DISMISSED | LINKED | AUTO_CLOSED" }
      - { name: triaged_by_analyst_id, type: string, source: system, description: "Nullable actor stamp: analyst who triaged" }
      - { name: dismissal_rationale, type: string, source: system, description: "Nullable — required on dismiss" }
      - { name: dismissed_at, type: datetime, source: system, description: "Nullable — set on dismiss, cleared on reopen" }
      - { name: closure_reason, type: enum, source: system, description: "Nullable — STALE_EXPIRY | CUSTOMER_EXITED when AUTO_CLOSED" }

  - name: Case
    parent: null
    common_fields: true
    fields:
      - { name: customer_id, type: string, source: input, description: "FK -> Customer.id; investigation subject" }
      - { name: source_alert_id, type: string, source: input, description: "Nullable FK -> Alert.id; originating alert" }
      - { name: assigned_analyst_id, type: string, source: system, description: "Nullable FK -> Analyst.id; set on assign" }
      - { name: on_hold_inquiry_id, type: string, source: system, description: "Nullable FK -> LawEnforcementInquiry.id; set while case is ON_HOLD" }
      - { name: status, type: enum, source: system, default: OPEN, description: "OPEN | ASSIGNED | INVESTIGATING | ON_HOLD | SAR_IN_PROGRESS | PENDING_QA | CLOSED" }
      - { name: decision, type: enum, source: system, default: NONE, description: "NONE | SAR_REQUIRED | NO_SAR" }
      - { name: decision_rationale, type: string, source: system, description: "Nullable — recorded at sar-decision" }
      - { name: decided_at, type: datetime, source: system, description: "Nullable — set at sar-decision" }
      - { name: initial_detection_at, type: datetime, source: system, description: "Computed at sar-decision: created_at of the earliest LINKED alert for this case, else case.created_at" }
      - { name: qa_reviewed_by, type: string, source: system, description: "Nullable actor stamp: QAReviewer who last reviewed" }
      - { name: closed_reason, type: enum, source: system, description: "Nullable — NO_SAR_CONFIRMED | SAR_FILED on close" }
      - { name: closed_at, type: datetime, source: system, description: "Nullable — set on close" }

  - name: SARReport
    parent: null
    common_fields: true
    fields:
      - { name: case_id, type: string, source: system, description: "FK -> Case.id; parent case (from path at creation)" }
      - { name: customer_id, type: string, source: system, description: "FK -> Customer.id; subject, denormalized from case" }
      - { name: prior_sar_id, type: string, source: system, description: "Nullable FK -> SARReport.id; self-referential chain link for continuing-activity SARs" }
      - { name: is_continuing, type: boolean, source: computed, description: "prior_sar_id IS NOT NULL" }
      - { name: subject_unidentified, type: boolean, source: input, default: false, description: "True extends initial filing deadline from 30 to 60 days" }
      - { name: narrative, type: string, source: input, description: "SAR narrative text; edited via PUT narrative endpoint" }
      - { name: narrative_length, type: integer, source: computed, default: 0, description: "Character count of narrative" }
      - { name: activity_start_date, type: string, source: input, description: "Suspicious activity window start (date, closed interval lower bound)" }
      - { name: activity_end_date, type: string, source: input, description: "Suspicious activity window end (date, closed interval upper bound, inclusive)" }
      - { name: deadline_at, type: datetime, source: computed, description: "Filing deadline per sar_filing_deadline" }
      - { name: status, type: enum, source: system, default: DRAFT, description: "DRAFT | IN_QA | QA_PASSED | APPROVED | FILED" }
      - { name: drafted_by_analyst_id, type: string, source: system, description: "Actor stamp: analyst who created the draft" }
      - { name: qa_reviewer_id, type: string, source: system, description: "Nullable actor stamp: QAReviewer who passed QA" }
      - { name: approved_by_analyst_id, type: string, source: system, description: "Nullable actor stamp: BSAManager who approved" }
      - { name: filed_at, type: datetime, source: system, description: "Nullable — set on filing" }
      - { name: filing_reference, type: string, source: system, description: "Nullable — assigned on filing: SAR-<filed year>-<zero-padded sequence in created_at order>" }

  - name: ContinuingReview
    parent: null
    common_fields: true
    fields:
      - { name: sar_report_id, type: string, source: system, description: "FK -> SARReport.id; the FILED SAR under continuing-activity review" }
      - { name: cycle_number, type: integer, source: system, description: "1 for the first review of a SAR chain root; increments along the prior_sar_id chain" }
      - { name: due_at, type: datetime, source: system, description: "filed_at of the reviewed SAR + 90 days" }
      - { name: filing_deadline_at, type: datetime, source: system, description: "filed_at of the reviewed SAR + 120 days — deadline for the continuing SAR" }
      - { name: status, type: enum, source: system, default: SCHEDULED, description: "SCHEDULED | IN_PROGRESS | OVERDUE | COMPLETED" }
      - { name: outcome, type: enum, source: system, default: NONE, description: "NONE | FILE_CONTINUING_SAR | CLOSE_MONITORING" }
      - { name: completed_at, type: datetime, source: system, description: "Nullable" }
      - { name: created_continuing_sar_id, type: string, source: system, description: "Nullable FK -> SARReport.id; continuing SAR draft created when outcome == FILE_CONTINUING_SAR" }

  - name: LawEnforcementInquiry
    parent: null
    common_fields: true
    fields:
      - { name: agency_name, type: string, source: input, description: "Requesting agency" }
      - { name: inquiry_reference, type: string, source: input, description: "External reference number" }
      - { name: subject_customer_id, type: string, source: input, description: "FK -> Customer.id; inquiry subject" }
      - { name: case_id, type: string, source: system, description: "Nullable FK -> Case.id; set on link-case" }
      - { name: received_at, type: datetime, source: system, description: "Logical clock time at registration" }
      - { name: status, type: enum, source: system, default: RECEIVED, description: "RECEIVED | UNDER_REVIEW | RESPONDED | CLOSED" }
      - { name: response_summary, type: string, source: system, description: "Nullable — recorded on respond" }
      - { name: responded_at, type: datetime, source: system, description: "Nullable" }

  - name: InfoShareRequest
    parent: null
    common_fields: true
  # 314(b) information sharing record
    fields:
      - { name: direction, type: enum, source: input, description: "OUTBOUND | INBOUND" }
      - { name: counterparty_institution_id, type: string, source: input, description: "External institution identifier" }
      - { name: subject_customer_id, type: string, source: input, description: "FK -> Customer.id; subject of the share" }
      - { name: case_id, type: string, source: input, description: "Nullable FK -> Case.id; related investigation" }
      - { name: certified_at, type: datetime, source: input, description: "314(b) certification timestamp; must be <= now at creation" }
      - { name: certification_expires_at, type: datetime, source: computed, description: "certified_at + 365 days" }
      - { name: purpose_note, type: string, source: input, description: "Purpose of the share" }
      - { name: sent_at, type: datetime, source: system, description: "Nullable — set on send" }
      - { name: response_received_at, type: datetime, source: system, description: "Nullable — set on record-response" }
      - { name: status, type: enum, source: system, default: DRAFT, description: "DRAFT | SENT | RESPONDED | EXPIRED | CANCELLED" }

  - name: AccountDecision
    parent: null
    common_fields: true
    fields:
      - { name: account_id, type: string, source: system, description: "FK -> Account.id; subject account (from path at proposal)" }
      - { name: decision, type: enum, source: input, description: "EXIT | RESTRICT | RETAIN" }
      - { name: rationale, type: string, source: input, description: "Decision rationale" }
      - { name: status, type: enum, source: system, default: PROPOSED, description: "PROPOSED | APPROVED | EXECUTED | REVERSED" }
      - { name: proposed_by_analyst_id, type: string, source: system, description: "Actor stamp: proposer X-User-ID" }
      - { name: approved_by_analyst_id, type: string, source: system, description: "Nullable actor stamp: approver X-User-ID" }
      - { name: executed_at, type: datetime, source: system, description: "Nullable" }

  - name: QAReview
    parent: null
    common_fields: true
    fields:
      - { name: case_id, type: string, source: input, description: "Nullable FK -> Case.id; exactly one of case_id / sar_report_id must be set" }
      - { name: sar_report_id, type: string, source: input, description: "Nullable FK -> SARReport.id; exactly one of case_id / sar_report_id must be set" }
      - { name: period_month, type: string, source: system, description: "YYYY-MM of the logical clock at creation" }
      - { name: reviewer_id, type: string, source: system, description: "Actor stamp: QAReviewer X-User-ID" }
      - { name: outcome, type: enum, source: system, default: PENDING, description: "PENDING | PASS | FAIL" }
      - { name: defect_count, type: integer, source: input, description: "Defects found; required on complete" }
      - { name: notes, type: string, source: input, description: "Nullable review notes" }
      - { name: status, type: enum, source: system, default: SAMPLED, description: "SAMPLED | COMPLETED" }

# =============================================================================
# 1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: MonitoringScenario
    initial_state: DRAFT
    terminal_states: [RETIRED]
    transitions:
      - { from: DRAFT, to: ACTIVE, trigger: "POST /monitoring-scenarios/{id}/activate", actor: BSAManager,
          preconditions: ["At least one ScenarioThreshold of this scenario has status APPROVED (else ERR_NO_ACTIVE_THRESHOLD)"],
          side_effects: ["Increments MonitoringScenario.version by 1"] }
      - { from: ACTIVE, to: SUSPENDED, trigger: "POST /monitoring-scenarios/{id}/suspend", actor: BSAManager,
          preconditions: [],
          side_effects: ["Evaluation blocked while SUSPENDED", "Increments MonitoringScenario.version by 1"] }
      - { from: SUSPENDED, to: ACTIVE, trigger: "POST /monitoring-scenarios/{id}/activate", actor: BSAManager,
          preconditions: ["At least one ScenarioThreshold of this scenario has status APPROVED or ACTIVE"],
          side_effects: ["Increments MonitoringScenario.version by 1"] }
      - { from: ACTIVE, to: RETIRED, trigger: "POST /monitoring-scenarios/{id}/retire", actor: BSAManager,
          preconditions: ["No Alert of this scenario has status IN {NEW, UNDER_TRIAGE} (else ERR_SCENARIO_HAS_OPEN_ALERTS)"],
          side_effects: ["Increments MonitoringScenario.version by 1"] }
      - { from: SUSPENDED, to: RETIRED, trigger: "POST /monitoring-scenarios/{id}/retire", actor: BSAManager,
          preconditions: ["No Alert of this scenario has status IN {NEW, UNDER_TRIAGE}"],
          side_effects: ["Increments MonitoringScenario.version by 1"] }

  - entity: ScenarioThreshold
    initial_state: PROPOSED
    terminal_states: [SUPERSEDED]
    transitions:
      - { from: PROPOSED, to: APPROVED, trigger: "POST /threshold-versions/{id}/approve", actor: BSAManager,
          preconditions: ["approver X-User-ID != proposed_by_analyst_id (segregation of duties, else ERR_SEGREGATION_OF_DUTIES)"],
          side_effects: ["approved_by_analyst_id := caller X-User-ID"] }
      - { from: APPROVED, to: PROPOSED, trigger: "POST /threshold-versions/{id}/return", actor: BSAManager,
          preconditions: [],
          side_effects: ["approved_by_analyst_id := null"] }
      - from: APPROVED
        to: ACTIVE
        trigger: "POST /threshold-versions/{id}/activate"
        actor: BSAManager
        preconditions:
          - "MonitoringScenario.status == ACTIVE (else ERR_SCENARIO_NOT_ACTIVE)"
          - "If a currently ACTIVE version exists, this.effective_from >= current.effective_from (else ERR_THRESHOLD_WINDOW_OVERLAP)"
        side_effects:
          - "Prior ACTIVE version (if any) transitions to SUPERSEDED and its effective_to := this.effective_from (half-open adjacency)"
          - "MonitoringScenario.current_active_threshold_id := this id"
          - "Increments MonitoringScenario.version by 1"
      - { from: ACTIVE, to: SUPERSEDED, trigger: "system (when a newer version is activated)", actor: system,
          preconditions: [],
          side_effects: ["effective_to := successor.effective_from"] }

  - entity: Alert
    initial_state: NEW
    terminal_states: [LINKED, AUTO_CLOSED]
    transitions:
      - { from: NEW, to: UNDER_TRIAGE, trigger: "POST /alerts/{id}/triage", actor: BSAAnalyst,
          preconditions: [],
          side_effects: ["triaged_by_analyst_id := caller X-User-ID"] }
      - { from: UNDER_TRIAGE, to: DISMISSED, trigger: "POST /alerts/{id}/dismiss", actor: BSAAnalyst,
          preconditions: ["payload dismissal_rationale is non-empty (else ERR_INVALID_REQUEST)"],
          side_effects: ["dismissed_at := now", "dismissal_rationale recorded"] }
      - { from: DISMISSED, to: UNDER_TRIAGE, trigger: "POST /alerts/{id}/reopen", actor: BSAAnalyst,
          preconditions: [],
          side_effects: ["dismissed_at := null", "dismissal_rationale := null"] }
      - from: UNDER_TRIAGE
        to: LINKED
        trigger: "POST /alerts/{id}/link-to-case"
        actor: BSAAnalyst
        preconditions:
          - "Target Case.status IN {OPEN, ASSIGNED, INVESTIGATING} (else ERR_INVALID_STATE)"
          - "alert.customer_id == case.customer_id (else ERR_SUBJECT_MISMATCH)"
        side_effects: ["alert.case_id := case id", "Case.updated_at refreshed"]
      - { from: NEW, to: AUTO_CLOSED, trigger: "system (daily-compliance-sweep: now - created_at > scenario.stale_alert_days)", actor: system,
          preconditions: [],
          side_effects: ["closure_reason := STALE_EXPIRY"] }
      - { from: UNDER_TRIAGE, to: AUTO_CLOSED, trigger: "system (daily-compliance-sweep: now - created_at > scenario.stale_alert_days)", actor: system,
          preconditions: [],
          side_effects: ["closure_reason := STALE_EXPIRY"] }
      - { from: NEW, to: AUTO_CLOSED, trigger: "system (customer-exit cascade: subject Customer transitions to EXITED)", actor: system,
          preconditions: [],
          side_effects: ["closure_reason := CUSTOMER_EXITED"] }
      - { from: UNDER_TRIAGE, to: AUTO_CLOSED, trigger: "system (customer-exit cascade)", actor: system,
          preconditions: [],
          side_effects: ["closure_reason := CUSTOMER_EXITED"] }

  - entity: Case
    initial_state: OPEN
    terminal_states: []  # CLOSED is reversible: continuing-activity outcome reopens the case
    transitions:
      - { from: OPEN, to: ASSIGNED, trigger: "POST /cases/{id}/assign", actor: BSAManager,
          preconditions: ["Target Analyst.assigned_open_cases < capacity_max_cases (else ERR_ANALYST_AT_CAPACITY)"],
          side_effects: ["assigned_analyst_id := payload analyst_id", "Analyst.assigned_open_cases += 1", "Increments Case.version by 1"] }
      - { from: ASSIGNED, to: ASSIGNED, trigger: "POST /cases/{id}/assign (reassign to a different analyst)", actor: BSAManager,
          preconditions: ["payload analyst_id != current assigned_analyst_id", "target analyst under capacity"],
          side_effects: ["old Analyst.assigned_open_cases -= 1", "new Analyst.assigned_open_cases += 1", "Increments Case.version by 1"] }
      - { from: INVESTIGATING, to: ASSIGNED, trigger: "POST /cases/{id}/assign (reassign during investigation)", actor: BSAManager,
          preconditions: ["payload analyst_id != current assigned_analyst_id", "target analyst under capacity"],
          side_effects: ["old Analyst.assigned_open_cases -= 1", "new Analyst.assigned_open_cases += 1", "status := ASSIGNED (investigation restarts)", "Increments Case.version by 1"] }
      - { from: ASSIGNED, to: INVESTIGATING, trigger: "POST /cases/{id}/start-investigation", actor: BSAAnalyst,
          preconditions: ["caller X-User-ID == assigned_analyst_id (else ERR_FORBIDDEN_ROLE)"],
          side_effects: ["Increments Case.version by 1"] }
      - { from: INVESTIGATING, to: ON_HOLD, trigger: "system (POST /law-enforcement-inquiries/{id}/link-case links this case)", actor: system,
          preconditions: [],
          side_effects: ["on_hold_inquiry_id := inquiry id"] }
      - { from: ON_HOLD, to: INVESTIGATING, trigger: "system (POST /law-enforcement-inquiries/{id}/close closes the linked inquiry)", actor: system,
          preconditions: [],
          side_effects: ["on_hold_inquiry_id := null"] }
      - { from: INVESTIGATING, to: SAR_IN_PROGRESS, trigger: "POST /cases/{id}/sar-decision with decision=SAR_REQUIRED", actor: BSAAnalyst,
          preconditions: ["caller X-User-ID == assigned_analyst_id", "expected_case_version == Case.version (OCC, else ERR_STALE_VERSION)"],
          side_effects: ["decision := SAR_REQUIRED", "decision_rationale recorded", "decided_at := now", "initial_detection_at := earliest LINKED alert created_at, else case.created_at", "Increments Case.version by 1"] }
      - { from: INVESTIGATING, to: PENDING_QA, trigger: "POST /cases/{id}/sar-decision with decision=NO_SAR", actor: BSAAnalyst,
          preconditions: ["caller X-User-ID == assigned_analyst_id", "expected_case_version == Case.version (OCC)"],
          side_effects: ["decision := NO_SAR", "decision_rationale recorded", "decided_at := now", "initial_detection_at computed as above", "Increments Case.version by 1"] }
      - { from: SAR_IN_PROGRESS, to: PENDING_QA, trigger: "system (POST /sar-reports/{id}/file files the case SAR)", actor: system,
          preconditions: [],
          side_effects: ["Increments Case.version by 1"] }
      - { from: PENDING_QA, to: INVESTIGATING, trigger: "POST /cases/{id}/qa-review with outcome=FAIL", actor: QAReviewer,
          preconditions: ["caller X-User-ID != assigned_analyst_id (segregation of duties)"],
          side_effects: ["qa_reviewed_by := caller", "Increments Case.version by 1"] }
      - from: PENDING_QA
        to: CLOSED
        trigger: "POST /cases/{id}/qa-review with outcome=PASS"
        actor: QAReviewer
        preconditions:
          - "caller X-User-ID != assigned_analyst_id (segregation of duties)"
          - "No LawEnforcementInquiry with case_id == this case has status IN {RECEIVED, UNDER_REVIEW, RESPONDED} (else ERR_LE_INQUIRY_OPEN)"
        side_effects: ["closed_reason := NO_SAR_CONFIRMED if decision==NO_SAR else SAR_FILED", "closed_at := now", "assigned Analyst.assigned_open_cases -= 1", "Increments Case.version by 1"]
      - { from: CLOSED, to: SAR_IN_PROGRESS, trigger: "system (ContinuingReview completed with outcome=FILE_CONTINUING_SAR reopens the investigation)", actor: system,
          preconditions: [],
          side_effects: ["closed_reason := null", "closed_at := null", "decision := SAR_REQUIRED", "Increments Case.version by 1"] }

  - entity: SARReport
    initial_state: DRAFT
    terminal_states: [FILED]
    transitions:
      - { from: DRAFT, to: IN_QA, trigger: "POST /sar-reports/{id}/submit-qa", actor: BSAAnalyst,
          preconditions: ["caller X-User-ID == drafted_by_analyst_id", "narrative_length >= 500 (else ERR_NARRATIVE_INSUFFICIENT)"],
          side_effects: ["Increments SARReport.version by 1"] }
      - { from: IN_QA, to: DRAFT, trigger: "POST /sar-reports/{id}/qa-review with outcome=FAIL", actor: QAReviewer,
          preconditions: ["caller X-User-ID != drafted_by_analyst_id (segregation of duties)"],
          side_effects: ["Increments SARReport.version by 1"] }
      - { from: IN_QA, to: QA_PASSED, trigger: "POST /sar-reports/{id}/qa-review with outcome=PASS", actor: QAReviewer,
          preconditions: ["caller X-User-ID != drafted_by_analyst_id"],
          side_effects: ["qa_reviewer_id := caller", "Increments SARReport.version by 1"] }
      - { from: QA_PASSED, to: APPROVED, trigger: "POST /sar-reports/{id}/approve", actor: BSAManager,
          preconditions: ["caller X-User-ID != drafted_by_analyst_id (segregation of duties)"],
          side_effects: ["approved_by_analyst_id := caller", "Increments SARReport.version by 1"] }
      - from: APPROVED
        to: FILED
        trigger: "POST /sar-reports/{id}/file"
        actor: BSAManager
        preconditions: ["now <= deadline_at (else ERR_FILING_DEADLINE_PASSED)", "activity window [activity_start_date, activity_end_date] does not intersect (closed-interval) any other FILED SARReport window for the same customer (else ERR_ACTIVITY_WINDOW_OVERLAP)"]
        side_effects:
          - "filed_at := now; filing_reference assigned"
          - "Parent Case SAR_IN_PROGRESS -> PENDING_QA"
          - "customer_risk_rating_recompute runs (sar_filings_365d += 1); if risk_rating crosses INTO HIGH or PROHIBITED, every Account of the customer with status OPEN -> RESTRICTED (restriction_reason := RISK_CASCADE)"
          - "ContinuingReview created: SCHEDULED, due_at = filed_at + 90d, filing_deadline_at = filed_at + 120d, cycle_number = (prior chain length) + 1"
          - "Increments SARReport.version by 1"

  - entity: ContinuingReview
    initial_state: SCHEDULED
    terminal_states: [COMPLETED]
    transitions:
      - { from: SCHEDULED, to: IN_PROGRESS, trigger: "POST /continuing-reviews/{id}/start", actor: BSAAnalyst, preconditions: [], side_effects: [] }
      - { from: SCHEDULED, to: OVERDUE, trigger: "system (daily-compliance-sweep: now > due_at)", actor: system, preconditions: [], side_effects: [] }
      - { from: OVERDUE, to: IN_PROGRESS, trigger: "POST /continuing-reviews/{id}/start (late start)", actor: BSAAnalyst, preconditions: [], side_effects: [] }
      - from: IN_PROGRESS
        to: COMPLETED
        trigger: "POST /continuing-reviews/{id}/complete"
        actor: BSAAnalyst
        preconditions: ["Reviewed SARReport.status == FILED (else ERR_INVALID_STATE)"]
        side_effects:
          - "outcome recorded; completed_at := now"
          - "If outcome == FILE_CONTINUING_SAR: new SARReport created (DRAFT, prior_sar_id := reviewed SAR, case_id := same case, customer_id := same customer, activity window := (prior.activity_end_date + 1 day) .. (prior.activity_end_date + 90 days), deadline_at := filing_deadline_at of this review); created_continuing_sar_id set; parent Case CLOSED -> SAR_IN_PROGRESS"
          - "If outcome == CLOSE_MONITORING: no further review is scheduled"

  - entity: LawEnforcementInquiry
    initial_state: RECEIVED
    terminal_states: [CLOSED]
    transitions:
      - { from: RECEIVED, to: UNDER_REVIEW, trigger: "POST /law-enforcement-inquiries/{id}/link-case", actor: ComplianceAdmin,
          preconditions: ["inquiry.subject_customer_id == case.customer_id (else ERR_SUBJECT_MISMATCH)"],
          side_effects: ["case_id set", "If case.status == INVESTIGATING: case -> ON_HOLD with on_hold_inquiry_id := inquiry id", "customer_risk_rating_recompute runs on subject (open_le_inquiry_count unchanged by link; counted since creation)"] }
      - { from: UNDER_REVIEW, to: RESPONDED, trigger: "POST /law-enforcement-inquiries/{id}/respond", actor: BSAManager,
          preconditions: ["payload response_summary non-empty"],
          side_effects: ["response_summary recorded", "responded_at := now"] }
      - { from: RESPONDED, to: CLOSED, trigger: "POST /law-enforcement-inquiries/{id}/close", actor: BSAManager,
          preconditions: [],
          side_effects: ["If linked case.status == ON_HOLD and case.on_hold_inquiry_id == this inquiry: case ON_HOLD -> INVESTIGATING", "customer_risk_rating_recompute runs (open_le_inquiry_count -= 1)"] }

  - entity: InfoShareRequest
    initial_state: DRAFT
    terminal_states: [RESPONDED, EXPIRED, CANCELLED]
    transitions:
      - from: DRAFT
        to: SENT
        trigger: "POST /info-share-requests/{id}/send"
        actor: BSAAnalyst
        preconditions:
          - "If case_id set: no LawEnforcementInquiry with case_id == this case has status IN {RECEIVED, UNDER_REVIEW, RESPONDED} (business_safety, else ERR_LE_INQUIRY_OPEN)"
          - "now <= certification_expires_at (business_temporal, else ERR_CERTIFICATION_EXPIRED)"
          - "No other OUTBOUND InfoShareRequest with same (counterparty_institution_id, subject_customer_id) and status IN {SENT, RESPONDED} and sent_at >= now - 90 days (else ERR_314B_DUPLICATE_WINDOW)"
        side_effects: ["sent_at := now"]
      - { from: SENT, to: RESPONDED, trigger: "POST /info-share-requests/{id}/record-response", actor: BSAAnalyst,
          preconditions: [],
          side_effects: ["response_received_at := now"] }
      - { from: SENT, to: EXPIRED, trigger: "system (daily-compliance-sweep: now > sent_at + 30 days and no response)", actor: system, preconditions: [], side_effects: [] }
      - { from: DRAFT, to: CANCELLED, trigger: "system (customer-exit cascade: subject Customer transitions to EXITED)", actor: system, preconditions: [], side_effects: [] }

  - entity: AccountDecision
    initial_state: PROPOSED
    terminal_states: [EXECUTED, REVERSED]
    transitions:
      - { from: PROPOSED, to: APPROVED, trigger: "POST /account-decisions/{id}/approve", actor: BSAManager,
          preconditions: ["caller X-User-ID != proposed_by_analyst_id (segregation of duties)"],
          side_effects: ["approved_by_analyst_id := caller"] }
      - from: APPROVED
        to: EXECUTED
        trigger: "POST /account-decisions/{id}/execute"
        actor: BSAManager
        preconditions: ["Account.status IN {OPEN, RESTRICTED} (else ERR_ACCOUNT_NOT_OPEN)"]
        side_effects:
          - "executed_at := now"
          - "decision == EXIT: Account -> EXITED; if the customer then has no Account with status IN {OPEN, RESTRICTED}: Customer -> EXITED; that customer-exit mutation AUTO_CLOSEs every Alert of the customer in {NEW, UNDER_TRIAGE} (closure_reason CUSTOMER_EXITED) and CANCELs every InfoShareRequest of the customer in DRAFT"
          - "decision == RESTRICT: Account OPEN -> RESTRICTED (restriction_reason := DECISION)"
          - "decision == RETAIN: Account RESTRICTED -> OPEN (restriction_reason := null); Account OPEN unchanged"
          - "customer_risk_rating_recompute runs"
      - { from: APPROVED, to: REVERSED, trigger: "POST /account-decisions/{id}/reverse", actor: BSAManager,
          preconditions: ["payload rationale non-empty"],
          side_effects: ["Compensation: approval is withdrawn; no account mutation was applied, so nothing is unwound"] }

  - entity: Account
    initial_state: OPEN
    terminal_states: [EXITED]
    transitions:
      - { from: OPEN, to: RESTRICTED, trigger: "system (risk cascade: customer risk_rating crosses INTO HIGH|PROHIBITED, or AccountDecision RESTRICT executed)", actor: system, preconditions: [], side_effects: ["restriction_reason set"] }
      - { from: RESTRICTED, to: OPEN, trigger: "system (AccountDecision RETAIN executed)", actor: system, preconditions: [], side_effects: ["restriction_reason := null"] }
      - { from: OPEN, to: EXITED, trigger: "system (AccountDecision EXIT executed)", actor: system, preconditions: [], side_effects: ["customer_risk_rating_recompute runs (any_account_exited := true)"] }
      - { from: RESTRICTED, to: EXITED, trigger: "system (AccountDecision EXIT executed)", actor: system, preconditions: [], side_effects: ["customer_risk_rating_recompute runs"] }

  - entity: Customer
    initial_state: ACTIVE
    terminal_states: [EXITED]
    transitions:
      - { from: ACTIVE, to: EXITED, trigger: "system (last non-EXITED account transitions to EXITED)", actor: system,
          preconditions: ["No Account of the customer has status IN {OPEN, RESTRICTED}"],
          side_effects: ["Alerts of this customer in {NEW, UNDER_TRIAGE} -> AUTO_CLOSED (CUSTOMER_EXITED)", "InfoShareRequests of this customer in DRAFT -> CANCELLED"] }

  - entity: QAReview
    initial_state: SAMPLED
    terminal_states: [COMPLETED]
    transitions:
      - { from: SAMPLED, to: COMPLETED, trigger: "POST /qa-reviews/{id}/complete", actor: QAReviewer,
          preconditions: ["caller X-User-ID == reviewer_id"],
          side_effects: ["outcome := payload outcome", "defect_count recorded"] }

# =============================================================================
# 1.2.1 Concurrency Rules (true races only; OCC on parent version)
# =============================================================================
concurrency_rules:
  - rule_id: threshold-propose-stale-scenario
    parent_entity: MonitoringScenario
    write_endpoint: "POST /monitoring-scenarios/{id}/threshold-versions"
    occ_field: "expected_scenario_version"
    description: |
      Proposing a new threshold version against a MonitoringScenario whose
      version has advanced since the client last observed it is rejected.
      A fresh proposer's view of the scenario is stale once another writer
      has proposed a version (each successful proposal increments the
      scenario version), so the stale writer must re-read before drafting.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: narrative-update-stale-sar
    parent_entity: SARReport
    write_endpoint: "PUT /sar-reports/{id}/narrative"
    occ_field: "expected_sar_version"
    description: |
      Updating the narrative (or activity window) of a SARReport whose
      version has advanced since the client last observed it is rejected.
      Narrative edits are always legitimate while the SAR is in DRAFT, so a
      second edit with a fresh version would succeed; only the stale writer
      is refused, protecting the drafted narrative from silent overwrite.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# 1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: scenario_trigger_evaluation
    trigger: "POST /monitoring-scenarios/{id}/evaluate"
    algorithm: threshold
    formula: |
      window = (evaluated_at - lookback_days, evaluated_at]   # lower exclusive, upper inclusive
      matching = Transactions t where t.account_id == account_id
                 AND t.txn_type IN scenario.applies_to_txn_types
                 AND (scenario.direction_filter == BOTH OR t.direction == scenario.direction_filter)
                 AND window_start < t.posted_at <= window_end
      aggregate_amount_cents = sum(t.amount_cents for t in matching)
      txn_count = len(matching)
      fires IFF aggregate_amount_cents >= threshold.threshold_amount_cents   # >= inclusive
             AND txn_count >= threshold.min_transaction_count                # >= inclusive
      idempotency: at most one Alert per (scenario_id, account_id, window_end);
      a repeat evaluation of the same triple returns the existing alert with alert_created=false.
    input_set: "Transactions of the target account only; all statuses (Transaction is immutable); window bounds as above"
    constants:
      HIGH_RISK_COUNTRIES: "IR,KP,CU,SY"
    precision: "integer cents; no rounding"
    variants: []

  - name: alert_risk_score
    trigger: "POST /monitoring-scenarios/{id}/evaluate when the trigger fires (Alert is created)"
    algorithm: weighted_scoring
    formula: |
      # PINNED EVALUATION ORDER (nested rounding, mode b): round each component
      # to 4 decimal places FIRST (round_half_up), then sum, then scale by 100,
      # then round_half_up to integer. Summing raw components and rounding once
      # at the end is a DIFFERENT, non-conformant order and yields different scores.
      amount_ratio  = min(1, aggregate_amount_cents / (2 * threshold_amount_cents))
      velocity_ratio = min(1, txn_count / (2 * min_transaction_count))
      geo_fraction  = count(t in matching where t.counterparty_country IN HIGH_RISK_COUNTRIES) / txn_count
      contrib_amount   = round_half_up(w_amount   * amount_ratio,   4)
      contrib_velocity = round_half_up(w_velocity * velocity_ratio, 4)
      contrib_geo      = round_half_up(w_geo      * geo_fraction,   4)
      score = round_half_up(100 * (contrib_amount + contrib_velocity + contrib_geo), 0)
      # alert.risk_score    uses the ACTIVE ScenarioThreshold weights (TUNED variant)
      # alert.baseline_score uses the scenario baseline_* weights (BASELINE variant)
    input_set: "The matching transaction set from scenario_trigger_evaluation for the same window"
    constants:
      HIGH_RISK_COUNTRIES: "IR,KP,CU,SY"
      SCALE: 100
    precision: "decimal arithmetic; components round_half_up to 4 dp; final round_half_up to integer"
    variants:
      - name: TUNED
        when: "Stored on alert.risk_score — weights from the pinned ACTIVE ScenarioThreshold at generation time"
        difference: "Uses threshold version weights (weight_amount/weight_velocity/weight_geo)"
      - name: BASELINE
        when: "Stored on alert.baseline_score — shadow score for tuning comparison"
        difference: "Uses MonitoringScenario.baseline_* weights; identical transaction set and rounding order"

  - name: customer_risk_rating_recompute
    trigger: "Customer create; SARReport -> FILED; LawEnforcementInquiry create; LawEnforcementInquiry -> CLOSED; Account -> EXITED"
    algorithm: aggregation
    formula: |
      base = 100
      score_std = base + 250 * sar_filings_365d + 150 * open_le_inquiry_count + (400 if any_account_exited else 0)
      score_enh = round_half_up(score_std * 1.5, 0)   # ENHANCED multiplier
      # applicable variant: ENHANCED iff customer.country_risk == HIGH, else STANDARD
      applicable = score_enh if country_risk == HIGH else score_std
      risk_rating = PROHIBITED if applicable >= 700
                    else HIGH if applicable >= 400
                    else MEDIUM if applicable >= 200
                    else LOW                                    # thresholds >= inclusive
      # side cascade: whenever risk_rating crosses INTO HIGH or PROHIBITED from a
      # lower band, every Account of the customer with status OPEN -> RESTRICTED
      # (restriction_reason := RISK_CASCADE).
    input_set: "sar_filings_365d: SARReports with status FILED and filed_at in (now-365d, now]; open_le_inquiry_count: inquiries with status IN {RECEIVED, UNDER_REVIEW, RESPONDED}; any_account_exited over all accounts regardless of status"
    constants:
      BASE: 100
      SAR_POINTS: 250
      LE_INQUIRY_POINTS: 150
      EXITED_ACCOUNT_POINTS: 400
      ENHANCED_MULTIPLIER: 1.5
      TIER_PROHIBITED: 700
      TIER_HIGH: 400
      TIER_MEDIUM: 200
    precision: "integer arithmetic; ENHANCED product round_half_up to integer"
    variants:
      - name: STANDARD
        when: "customer.country_risk == LOW; stored on risk_score_standard (always computed)"
        difference: "Unweighted sum"
      - name: ENHANCED
        when: "customer.country_risk == HIGH; stored on risk_score_enhanced (always computed)"
        difference: "Standard sum multiplied by 1.5 — identical facts yield a different score and possibly a different rating"

  - name: sar_filing_deadline
    trigger: "SARReport creation (initial SAR via POST /cases/{id}/sar-reports, continuing SAR via ContinuingReview completion)"
    algorithm: threshold
    formula: |
      # Combinatorial: >= 3 inputs with non-linear conditional interaction.
      if is_continuing:                                   # continuing-activity SAR
          deadline_at = prior_sar.filed_at + 120 days     # 90-day review + 30-day filing
      else:                                               # initial SAR
          base_detection = case.initial_detection_at
          extension = 30 days if subject_unidentified else 0 days
          deadline_at = base_detection + 30 days + extension    # hard ceiling 60 days total
      # filing permitted IFF now <= deadline_at (inclusive); now > deadline_at -> ERR_FILING_DEADLINE_PASSED
      # review cadence (continuing): review due_at = prior_sar.filed_at + 90 days;
      # continuing filing deadline = prior_sar.filed_at + 120 days. The 30-day gap between
      # review due date and filing deadline is the drafting window.
    input_set: "case.initial_detection_at (earliest LINKED alert created_at else case.created_at), subject_unidentified flag, prior_sar.filed_at for continuing SARs"
    constants:
      INITIAL_WINDOW_DAYS: 30
      SUBJECT_UNIDENTIFIED_EXTENSION_DAYS: 30
      CONTINUING_REVIEW_DAYS: 90
      CONTINUING_FILING_DAYS: 120
    precision: "second-precision timestamps; comparisons inclusive of the deadline instant"
    variants: []

  - name: qa_sample_quota
    trigger: "POST /qa-reviews (validates capacity); GET /backlog/summary (reports it)"
    algorithm: aggregation
    formula: |
      # PINNED EVALUATION ORDER (circular-looking dependency, mode c):
      # (1) completed_in_month is counted FIRST and is INDEPENDENT of sampling state:
      #     completions = Cases with closed_at in current calendar month (UTC)
      #                 + SARReports with filed_at in current month
      #                 + Alerts with dismissed_at in current month
      # (2) monthly_quota = clamp(ceil(completed_in_month * SAMPLE_RATE), MIN_SAMPLE, MAX_SAMPLE)
      # (3) sampled_in_month = count of QAReviews with period_month == current month
      # (4) creation permitted IFF sampled_in_month < monthly_quota (else ERR_QA_QUOTA_EXCEEDED)
      # Because step (1) ignores QAReview linkage, creating a sample NEVER shrinks the
      # quota within the same month; an implementation that subtracts sampled items from
      # the pool before computing the quota is non-conformant.
    input_set: "Completed work items in the current UTC calendar month, regardless of whether already sampled"
    constants:
      SAMPLE_RATE: 0.34
      MIN_SAMPLE: 1
      MAX_SAMPLE: 25
    precision: "ceil to integer before clamp"
    variants: []

  - name: backlog_aging_buckets
    trigger: "GET /backlog/summary"
    algorithm: aggregation
    formula: |
      open_cases = Cases with status IN {OPEN, ASSIGNED, INVESTIGATING, ON_HOLD, SAR_IN_PROGRESS, PENDING_QA}
      age_days(c) = floor((now - c.created_at) / 86400)
      buckets (inclusive lower, exclusive upper, final open):
        cases_age_0_15   = count(age_days in [0, 16))    # age 15 lands here
        cases_age_16_30  = count(age_days in [16, 31))   # age 16 lands here
        cases_age_31_60  = count(age_days in [31, 61))
        cases_age_61_plus = count(age_days >= 61)
      overdue_sar_count   = count(SARReport status != FILED AND deadline_at < now)
      stale_alert_count   = count(Alert status IN {NEW, UNDER_TRIAGE} AND now - created_at > scenario.stale_alert_days)
      overdue_review_count = count(ContinuingReview status IN {SCHEDULED, OVERDUE} AND due_at < now)
    input_set: "All entities regardless of assignee; status filters as stated"
    constants:
      BUCKET_EDGES_DAYS: "0,16,31,61"
    precision: "integer day floors; strict-vs-inclusive boundaries as written"
    variants: []

# =============================================================================
# 1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - { priority: 1, category: business_constraint, check: "Request body well-formed: all required fields present, enum values in range, amount_cents > 0, activity_end_date >= activity_start_date, effective window bounds coherent, exactly one of case_id/sar_report_id on QAReview, no duplicate QAReview target while an existing QAReview for the same target has status SAMPLED", error_id: ERR_INVALID_REQUEST, http_status: 400, applies_to: "all" }
  - { priority: 2, category: auth, check: "X-User-Role and X-User-ID headers present and role recognized; for entity_backed roles X-User-ID must reference an existing Analyst", error_id: ERR_UNAUTHENTICATED, http_status: 401, applies_to: "all" }
  - { priority: 3, category: auth, check: "Caller role is listed in the endpoint's roles", error_id: ERR_FORBIDDEN_ROLE, http_status: 403, applies_to: "all" }
  - { priority: 4, category: auth, check: "Segregation of duties: on approve / qa-review / complete endpoints the caller X-User-ID must differ from the actor who performed the prior step (proposer/drafter/assigned analyst)", error_id: ERR_SEGREGATION_OF_DUTIES, http_status: 403, applies_to: "POST /threshold-versions/{id}/approve, POST /sar-reports/{id}/qa-review, POST /sar-reports/{id}/approve, POST /cases/{id}/qa-review, POST /account-decisions/{id}/approve" }
  - { priority: 5, category: existence, check: "Every id in the path and every FK id in the body references an existing resource (validated left-to-right)", error_id: ERR_NOT_FOUND, http_status: 404, applies_to: "all" }
  - { priority: 6, category: state, check: "Target resource state permits the requested transition per §1.2 (includes scenario ACTIVE checks, case/SAR/decision/review state preconditions)", error_id: ERR_INVALID_STATE, http_status: 409, applies_to: "all action endpoints" }
  - { priority: 7, category: state, check: "OCC: expected_<parent>_version in the body equals the parent's current version", error_id: ERR_STALE_VERSION, http_status: 412, applies_to: "POST /monitoring-scenarios/{id}/threshold-versions, PUT /sar-reports/{id}/narrative, POST /cases/{id}/sar-decision" }
  - { priority: 8, category: business_safety, check: "Compliance holds: no closing a case or sending a 314(b) share while a linked LawEnforcementInquiry is open; no opening an account for a PROHIBITED or EXITED customer", error_id: ERR_LE_INQUIRY_OPEN, http_status: 409, applies_to: "POST /cases/{id}/qa-review, POST /info-share-requests/{id}/send" }
  - { priority: 9, category: business_safety, check: "Customer risk gate: customer.risk_rating == PROHIBITED or customer.status == EXITED blocks new account opening", error_id: ERR_CUSTOMER_PROHIBITED, http_status: 409, applies_to: "POST /customers/{id}/accounts" }
  - { priority: 10, category: business_constraint, check: "Threshold version windows: a PROPOSED version's [effective_from, effective_to) must not overlap any other PROPOSED/APPROVED version's window of the same scenario (half-open; adjacency allowed); activation requires new.effective_from >= current ACTIVE.effective_from", error_id: ERR_THRESHOLD_WINDOW_OVERLAP, http_status: 409, applies_to: "POST /monitoring-scenarios/{id}/threshold-versions, POST /threshold-versions/{id}/activate" }
  - { priority: 11, category: business_constraint, check: "SAR activity windows for one customer are closed intervals [start, end] and must not share even a single calendar day with another FILED SAR of the same customer; adjacency (next.start == prior.end + 1 day) is allowed", error_id: ERR_ACTIVITY_WINDOW_OVERLAP, http_status: 409, applies_to: "POST /sar-reports/{id}/file" }
  - { priority: 12, category: business_constraint, check: "314(b) duplicate buffer: an OUTBOUND send conflicts with any prior OUTBOUND share to the same (counterparty_institution_id, subject_customer_id) with sent_at within the trailing closed 90-day buffer", error_id: ERR_314B_DUPLICATE_WINDOW, http_status: 409, applies_to: "POST /info-share-requests/{id}/send" }
  - { priority: 13, category: business_constraint, check: "SAR narrative must be at least 500 characters before QA submission", error_id: ERR_NARRATIVE_INSUFFICIENT, http_status: 422, applies_to: "POST /sar-reports/{id}/submit-qa" }
  - { priority: 14, category: business_constraint, check: "Analyst workload: assigned_open_cases must stay strictly below capacity_max_cases at assign time", error_id: ERR_ANALYST_AT_CAPACITY, http_status: 409, applies_to: "POST /cases/{id}/assign" }
  - { priority: 15, category: business_constraint, check: "Scenario retirement requires zero alerts in {NEW, UNDER_TRIAGE}", error_id: ERR_SCENARIO_HAS_OPEN_ALERTS, http_status: 409, applies_to: "POST /monitoring-scenarios/{id}/retire" }
  - { priority: 16, category: business_constraint, check: "Monthly QA sampling quota (qa_sample_quota) not exceeded; evaluation order pinned in §1.3", error_id: ERR_QA_QUOTA_EXCEEDED, http_status: 422, applies_to: "POST /qa-reviews" }
  - { priority: 17, category: business_temporal, check: "SAR filing clock: now <= deadline_at (inclusive)", error_id: ERR_FILING_DEADLINE_PASSED, http_status: 422, applies_to: "POST /sar-reports/{id}/file" }
  - { priority: 18, category: business_temporal, check: "314(b) certification current: now <= certification_expires_at", error_id: ERR_CERTIFICATION_EXPIRED, http_status: 422, applies_to: "POST /info-share-requests/{id}/send" }
  - { priority: 19, category: business_referential, check: "Subject consistency across links: alert.customer_id == case.customer_id on link-to-case; inquiry.subject_customer_id == case.customer_id on link-case", error_id: ERR_SUBJECT_MISMATCH, http_status: 422, applies_to: "POST /alerts/{id}/link-to-case, POST /law-enforcement-inquiries/{id}/link-case" }
  - { priority: 20, category: state, check: "Evaluation and scenario activation require an ACTIVE/APPROVED threshold respectively (ERR_NO_ACTIVE_THRESHOLD when none); evaluate additionally requires scenario ACTIVE (ERR_SCENARIO_NOT_ACTIVE)", error_id: ERR_NO_ACTIVE_THRESHOLD, http_status: 409, applies_to: "POST /monitoring-scenarios/{id}/evaluate, POST /monitoring-scenarios/{id}/activate" }

  - { priority: 21, category: state, check: "Threshold activation and scenario evaluation require MonitoringScenario.status == ACTIVE", error_id: ERR_SCENARIO_NOT_ACTIVE, http_status: 409, applies_to: "POST /threshold-versions/{id}/activate, POST /monitoring-scenarios/{id}/evaluate" }

# =============================================================================
# 1.5 API Endpoint Table
# =============================================================================
endpoints:
  # ---- test-driving / ops ----
  - { method: POST, path: "/_clock/set_current_utc", description: "Sets the logical clock (bidirectional — tests may move it backward to re-enter a window). Server startup default (before any set) is exactly 2026-05-01T00:00:00Z; the logical clock never falls back to wall-clock time.", roles: [ComplianceAdmin], code: 200, input: [to_iso8601], output: "{ current_utc: string }", side_effects: [] }
  - { method: POST, path: "/ops/jobs/daily-compliance-sweep", description: "Runs the daily compliance job at the current logical time: auto-close stale alerts (age > scenario.stale_alert_days), mark SCHEDULED continuing reviews with due_at < now as OVERDUE, expire SENT 314(b) requests with sent_at + 30d < now.", roles: [ComplianceAdmin], code: 200, input: [], output: "{ alerts_auto_closed: integer, reviews_marked_overdue: integer, shares_expired: integer }", side_effects: ["Alert NEW|UNDER_TRIAGE -> AUTO_CLOSED (STALE_EXPIRY)", "ContinuingReview SCHEDULED -> OVERDUE", "InfoShareRequest SENT -> EXPIRED"] }
  # ---- reference data ----
  - { method: POST, path: "/analysts", description: "Register an analyst (BSA staff member)", roles: [ComplianceAdmin], code: 201, input: [full_name, "capacity_max_cases?"], output: Analyst, side_effects: [] }
  - { method: GET, path: "/analysts/{id}", description: "Fetch analyst incl. assigned_open_cases", roles: [ComplianceAdmin, BSAAnalyst, QAReviewer, BSAManager], code: 200, input: [], output: Analyst, side_effects: [] }
  - { method: POST, path: "/customers", description: "Onboard a customer; risk scores initialized to base 100 / rating LOW", roles: [ComplianceAdmin], code: 201, input: [full_name, country_code, country_risk], output: Customer, side_effects: ["customer_risk_rating_recompute initialized"] }
  - { method: GET, path: "/customers/{id}", description: "Fetch customer incl. computed risk fields", roles: [ComplianceAdmin, BSAAnalyst, QAReviewer, BSAManager], code: 200, input: [], output: Customer, side_effects: [] }
  - { method: POST, path: "/customers/{id}/accounts", description: "Open an account for a customer (blocked for PROHIBITED/EXITED customers)", roles: [ComplianceAdmin], code: 201, input: [account_number], output: Account, side_effects: [] }
  - { method: GET, path: "/customers/{id}/accounts", description: "List accounts of a customer", roles: [ComplianceAdmin, BSAAnalyst, QAReviewer, BSAManager], code: 200, input: ["limit?", "offset?"], output: "Account[]", side_effects: [] }
  - { method: GET, path: "/accounts/{id}", description: "Fetch account", roles: [ComplianceAdmin, BSAAnalyst, QAReviewer, BSAManager], code: 200, input: [], output: Account, side_effects: [] }
  - { method: POST, path: "/accounts/{id}/transactions", description: "Post a transaction (immutable event)", roles: [ComplianceAdmin], code: 201, input: [amount_cents, txn_type, direction, counterparty_country, posted_at, channel], output: Transaction, side_effects: [] }
  - { method: GET, path: "/accounts/{id}/transactions", description: "List transactions of an account (posted_at order)", roles: [ComplianceAdmin, BSAAnalyst, QAReviewer, BSAManager], code: 200, input: ["limit?", "offset?"], output: "Transaction[]", side_effects: [] }
  # ---- monitoring scenarios & threshold versions (model tuning) ----
  - { method: POST, path: "/monitoring-scenarios", description: "Create a monitoring scenario (DRAFT)", roles: [ComplianceAdmin], code: 201, input: [scenario_code, name, applies_to_txn_types, direction_filter, "baseline_weight_amount?", "baseline_weight_velocity?", "baseline_weight_geo?", "stale_alert_days?"], output: MonitoringScenario, side_effects: [] }
  - { method: GET, path: "/monitoring-scenarios/{id}", description: "Fetch scenario incl. current_active_threshold_id", roles: [ComplianceAdmin, BSAAnalyst, QAReviewer, BSAManager], code: 200, input: [], output: MonitoringScenario, side_effects: [] }
  - { method: POST, path: "/monitoring-scenarios/{id}/activate", description: "DRAFT|SUSPENDED -> ACTIVE; requires an APPROVED (or ACTIVE) threshold version", roles: [BSAManager], code: 200, input: [], output: MonitoringScenario, side_effects: ["Increments MonitoringScenario.version by 1"] }
  - { method: POST, path: "/monitoring-scenarios/{id}/suspend", description: "ACTIVE -> SUSPENDED", roles: [BSAManager], code: 200, input: [], output: MonitoringScenario, side_effects: ["Increments MonitoringScenario.version by 1"] }
  - { method: POST, path: "/monitoring-scenarios/{id}/retire", description: "ACTIVE|SUSPENDED -> RETIRED; blocked while non-terminal alerts exist", roles: [BSAManager], code: 200, input: [], output: MonitoringScenario, side_effects: ["Increments MonitoringScenario.version by 1"] }
  - { method: POST, path: "/monitoring-scenarios/{id}/threshold-versions", description: "Propose a new tuned threshold version (PROPOSED) with tuning documentation; OCC on scenario version; window-overlap check vs other PROPOSED/APPROVED versions", roles: [BSAAnalyst], code: 201, input: [expected_scenario_version, threshold_amount_cents, lookback_days, min_transaction_count, weight_amount, weight_velocity, weight_geo, effective_from, "effective_to?", tuning_rationale, backtest_precision, backtest_recall], output: ScenarioThreshold, side_effects: ["Increments MonitoringScenario.version by 1", "proposed_by_analyst_id := caller"] }
  - { method: GET, path: "/monitoring-scenarios/{id}/threshold-versions", description: "List threshold versions of a scenario (version_number order)", roles: [ComplianceAdmin, BSAAnalyst, QAReviewer, BSAManager], code: 200, input: ["limit?", "offset?"], output: "ScenarioThreshold[]", side_effects: [] }
  - { method: POST, path: "/threshold-versions/{id}/approve", description: "PROPOSED -> APPROVED (SoD: approver != proposer)", roles: [BSAManager], code: 200, input: [], output: ScenarioThreshold, side_effects: [] }
  - { method: POST, path: "/threshold-versions/{id}/return", description: "APPROVED -> PROPOSED (rework)", roles: [BSAManager], code: 200, input: [], output: ScenarioThreshold, side_effects: [] }
  - { method: POST, path: "/threshold-versions/{id}/activate", description: "APPROVED -> ACTIVE; supersedes current ACTIVE version (half-open window adjacency)", roles: [BSAManager], code: 200, input: [], output: ScenarioThreshold, side_effects: ["Prior ACTIVE version -> SUPERSEDED with effective_to := this.effective_from", "MonitoringScenario.current_active_threshold_id updated", "Increments MonitoringScenario.version by 1"] }
  - { method: POST, path: "/monitoring-scenarios/{id}/evaluate", description: "Run scenario over one account for the window ending at evaluated_at (default: logical clock now); creates an Alert when the trigger fires; idempotent per (scenario, account, window_end)", roles: [ComplianceAdmin, BSAAnalyst], code: 200, input: [account_id, "evaluated_at?"], output: "{ alert_created: boolean, alert_id: string, aggregate_amount_cents: integer, txn_count: integer }", side_effects: ["scenario_trigger_evaluation", "alert_risk_score (TUNED on risk_score, BASELINE on baseline_score) when alert created"] }
  # ---- alerts ----
  - { method: GET, path: "/alerts", description: "List/filter alerts with pagination", roles: [ComplianceAdmin, BSAAnalyst, QAReviewer, BSAManager], code: 200, input: ["scenario_id?", "scenario_threshold_id?", "account_id?", "customer_id?", "case_id?", "status?", "limit?", "offset?"], output: "Alert[]", side_effects: [] }
  - { method: GET, path: "/alerts/{id}", description: "Fetch alert", roles: [ComplianceAdmin, BSAAnalyst, QAReviewer, BSAManager], code: 200, input: [], output: Alert, side_effects: [] }
  - { method: POST, path: "/alerts/{id}/triage", description: "NEW -> UNDER_TRIAGE", roles: [BSAAnalyst], code: 200, input: [], output: Alert, side_effects: ["triaged_by_analyst_id := caller"] }
  - { method: POST, path: "/alerts/{id}/dismiss", description: "UNDER_TRIAGE -> DISMISSED", roles: [BSAAnalyst], code: 200, input: [dismissal_rationale], output: Alert, side_effects: ["dismissed_at := now"] }
  - { method: POST, path: "/alerts/{id}/reopen", description: "DISMISSED -> UNDER_TRIAGE", roles: [BSAAnalyst], code: 200, input: [], output: Alert, side_effects: ["dismissed_at := null"] }
  - { method: POST, path: "/alerts/{id}/link-to-case", description: "UNDER_TRIAGE -> LINKED; attaches alert to a case of the same customer", roles: [BSAAnalyst], code: 200, input: [case_id], output: Alert, side_effects: ["alert.case_id set"] }
  # ---- cases ----
  - { method: POST, path: "/cases", description: "Open an investigation case for a customer (optionally from an alert)", roles: [BSAAnalyst, BSAManager], code: 201, input: [customer_id, "source_alert_id?"], output: Case, side_effects: [] }
  - { method: GET, path: "/cases", description: "List/filter cases with pagination", roles: [ComplianceAdmin, BSAAnalyst, QAReviewer, BSAManager], code: 200, input: ["customer_id?", "assigned_analyst_id?", "source_alert_id?", "on_hold_inquiry_id?", "status?", "limit?", "offset?"], output: "Case[]", side_effects: [] }
  - { method: GET, path: "/cases/{id}", description: "Fetch case", roles: [ComplianceAdmin, BSAAnalyst, QAReviewer, BSAManager], code: 200, input: [], output: Case, side_effects: [] }
  - { method: POST, path: "/cases/{id}/assign", description: "OPEN -> ASSIGNED, or reassign (ASSIGNED|INVESTIGATING -> ASSIGNED); capacity-checked; adjusts analyst workload counters", roles: [BSAManager], code: 200, input: [analyst_id], output: Case, side_effects: ["Analyst.assigned_open_cases += 1 (new) / -1 (previous on reassign)", "Increments Case.version by 1"] }
  - { method: POST, path: "/cases/{id}/start-investigation", description: "ASSIGNED -> INVESTIGATING (assigned analyst only)", roles: [BSAAnalyst], code: 200, input: [], output: Case, side_effects: ["Increments Case.version by 1"] }
  - { method: POST, path: "/cases/{id}/sar-decision", description: "INVESTIGATING -> SAR_IN_PROGRESS (SAR_REQUIRED) or PENDING_QA (NO_SAR); OCC on case version", roles: [BSAAnalyst], code: 200, input: [decision, decision_rationale, expected_case_version], output: Case, side_effects: ["decision/decided_at/initial_detection_at set", "Increments Case.version by 1"] }
  - { method: POST, path: "/cases/{id}/qa-review", description: "PENDING_QA -> CLOSED (PASS) or INVESTIGATING (FAIL); SoD vs assigned analyst; LE-inquiry gate on PASS", roles: [QAReviewer], code: 200, input: [outcome, "notes?"], output: Case, side_effects: ["On PASS: closed_reason, closed_at set; assigned Analyst.assigned_open_cases -= 1", "Increments Case.version by 1"] }
  # ---- SARs ----
  - { method: POST, path: "/cases/{id}/sar-reports", description: "Create initial SAR draft (case must be SAR_IN_PROGRESS); computes deadline_at per sar_filing_deadline", roles: [BSAAnalyst], code: 201, input: [activity_start_date, activity_end_date, "subject_unidentified?"], output: SARReport, side_effects: ["deadline_at computed", "drafted_by_analyst_id := caller"] }
  - { method: GET, path: "/sar-reports", description: "List/filter SARs with pagination", roles: [ComplianceAdmin, BSAAnalyst, QAReviewer, BSAManager], code: 200, input: ["case_id?", "customer_id?", "prior_sar_id?", "status?", "limit?", "offset?"], output: "SARReport[]", side_effects: [] }
  - { method: GET, path: "/sar-reports/{id}", description: "Fetch SAR", roles: [ComplianceAdmin, BSAAnalyst, QAReviewer, BSAManager], code: 200, input: [], output: SARReport, side_effects: [] }
  - { method: PUT, path: "/sar-reports/{id}/narrative", description: "Edit narrative and/or activity window while DRAFT (drafter only); OCC on SAR version", roles: [BSAAnalyst], code: 200, input: ["narrative?", "activity_start_date?", "activity_end_date?", "subject_unidentified?", expected_sar_version], output: SARReport, side_effects: ["narrative_length recomputed", "Increments SARReport.version by 1"] }
  - { method: POST, path: "/sar-reports/{id}/submit-qa", description: "DRAFT -> IN_QA (narrative >= 500 chars; drafter only)", roles: [BSAAnalyst], code: 200, input: [], output: SARReport, side_effects: ["Increments SARReport.version by 1"] }
  - { method: POST, path: "/sar-reports/{id}/qa-review", description: "IN_QA -> QA_PASSED (PASS) or DRAFT (FAIL); SoD vs drafter", roles: [QAReviewer], code: 200, input: [outcome, "notes?"], output: SARReport, side_effects: ["On PASS: qa_reviewer_id := caller", "Increments SARReport.version by 1"] }
  - { method: POST, path: "/sar-reports/{id}/approve", description: "QA_PASSED -> APPROVED; SoD vs drafter", roles: [BSAManager], code: 200, input: [], output: SARReport, side_effects: ["approved_by_analyst_id := caller", "Increments SARReport.version by 1"] }
  - { method: POST, path: "/sar-reports/{id}/file", description: "APPROVED -> FILED within deadline; fires cascades (case -> PENDING_QA, customer risk recompute + possible account restrictions, ContinuingReview creation)", roles: [BSAManager], code: 200, input: [], output: SARReport, side_effects: ["filed_at, filing_reference set", "Case SAR_IN_PROGRESS -> PENDING_QA", "customer_risk_rating_recompute; risk crossing INTO HIGH|PROHIBITED restricts OPEN accounts", "ContinuingReview created (due +90d, filing deadline +120d)", "Increments SARReport.version by 1"] }
  # ---- continuing reviews ----
  - { method: GET, path: "/sar-reports/{id}/continuing-reviews", description: "List continuing reviews of a SAR", roles: [ComplianceAdmin, BSAAnalyst, QAReviewer, BSAManager], code: 200, input: ["limit?", "offset?"], output: "ContinuingReview[]", side_effects: [] }
  - { method: GET, path: "/continuing-reviews/{id}", description: "Fetch continuing review", roles: [ComplianceAdmin, BSAAnalyst, QAReviewer, BSAManager], code: 200, input: [], output: ContinuingReview, side_effects: [] }
  - { method: POST, path: "/continuing-reviews/{id}/start", description: "SCHEDULED|OVERDUE -> IN_PROGRESS", roles: [BSAAnalyst], code: 200, input: [], output: ContinuingReview, side_effects: [] }
  - { method: POST, path: "/continuing-reviews/{id}/complete", description: "IN_PROGRESS -> COMPLETED; FILE_CONTINUING_SAR creates the continuing SAR draft and reopens the case", roles: [BSAAnalyst], code: 200, input: [outcome], output: ContinuingReview, side_effects: ["On FILE_CONTINUING_SAR: SARReport draft created (prior_sar_id link, deadline = reviewed filed_at + 120d); Case CLOSED -> SAR_IN_PROGRESS"] }
  # ---- law enforcement inquiries ----
  - { method: POST, path: "/law-enforcement-inquiries", description: "Register an LE inquiry; increments subject open_le_inquiry_count and recomputes risk", roles: [ComplianceAdmin], code: 201, input: [agency_name, inquiry_reference, subject_customer_id], output: LawEnforcementInquiry, side_effects: ["customer_risk_rating_recompute (open_le_inquiry_count += 1)"] }
  - { method: GET, path: "/law-enforcement-inquiries", description: "List/filter LE inquiries", roles: [ComplianceAdmin, BSAAnalyst, QAReviewer, BSAManager], code: 200, input: ["subject_customer_id?", "case_id?", "status?", "limit?", "offset?"], output: "LawEnforcementInquiry[]", side_effects: [] }
  - { method: GET, path: "/law-enforcement-inquiries/{id}", description: "Fetch LE inquiry", roles: [ComplianceAdmin, BSAAnalyst, QAReviewer, BSAManager], code: 200, input: [], output: LawEnforcementInquiry, side_effects: [] }
  - { method: POST, path: "/law-enforcement-inquiries/{id}/link-case", description: "RECEIVED -> UNDER_REVIEW; links to a case of the same customer; an INVESTIGATING case is put ON_HOLD", roles: [ComplianceAdmin], code: 200, input: [case_id], output: LawEnforcementInquiry, side_effects: ["Case INVESTIGATING -> ON_HOLD (on_hold_inquiry_id set)"] }
  - { method: POST, path: "/law-enforcement-inquiries/{id}/respond", description: "UNDER_REVIEW -> RESPONDED", roles: [BSAManager], code: 200, input: [response_summary], output: LawEnforcementInquiry, side_effects: ["responded_at := now"] }
  - { method: POST, path: "/law-enforcement-inquiries/{id}/close", description: "RESPONDED -> CLOSED; releases linked case hold; recomputes customer risk", roles: [BSAManager], code: 200, input: [], output: LawEnforcementInquiry, side_effects: ["Linked Case ON_HOLD -> INVESTIGATING", "customer_risk_rating_recompute (open_le_inquiry_count -= 1)"] }
  # ---- 314(b) information sharing ----
  - { method: POST, path: "/info-share-requests", description: "Create a 314(b) share record (DRAFT); certification_expires_at = certified_at + 365d", roles: [BSAAnalyst], code: 201, input: [direction, counterparty_institution_id, subject_customer_id, "case_id?", certified_at, purpose_note], output: InfoShareRequest, side_effects: [] }
  - { method: GET, path: "/info-share-requests", description: "List/filter 314(b) requests", roles: [ComplianceAdmin, BSAAnalyst, QAReviewer, BSAManager], code: 200, input: ["subject_customer_id?", "case_id?", "status?", "limit?", "offset?"], output: "InfoShareRequest[]", side_effects: [] }
  - { method: GET, path: "/info-share-requests/{id}", description: "Fetch 314(b) request", roles: [ComplianceAdmin, BSAAnalyst, QAReviewer, BSAManager], code: 200, input: [], output: InfoShareRequest, side_effects: [] }
  - { method: POST, path: "/info-share-requests/{id}/send", description: "DRAFT -> SENT; gated by LE-inquiry safety hold, certification expiry, and the 90-day duplicate buffer", roles: [BSAAnalyst], code: 200, input: [], output: InfoShareRequest, side_effects: ["sent_at := now"] }
  - { method: POST, path: "/info-share-requests/{id}/record-response", description: "SENT -> RESPONDED", roles: [BSAAnalyst], code: 200, input: ["response_note?"], output: InfoShareRequest, side_effects: ["response_received_at := now"] }
  # ---- subject account decisioning ----
  - { method: POST, path: "/accounts/{id}/exit-decisions", description: "Propose a subject account decision (PROPOSED)", roles: [BSAAnalyst], code: 201, input: [decision, rationale], output: AccountDecision, side_effects: ["proposed_by_analyst_id := caller"] }
  - { method: GET, path: "/accounts/{id}/exit-decisions", description: "List decisions for an account", roles: [ComplianceAdmin, BSAAnalyst, QAReviewer, BSAManager], code: 200, input: ["limit?", "offset?"], output: "AccountDecision[]", side_effects: [] }
  - { method: GET, path: "/account-decisions/{id}", description: "Fetch a decision", roles: [ComplianceAdmin, BSAAnalyst, QAReviewer, BSAManager], code: 200, input: [], output: AccountDecision, side_effects: [] }
  - { method: POST, path: "/account-decisions/{id}/approve", description: "PROPOSED -> APPROVED (SoD: approver != proposer)", roles: [BSAManager], code: 200, input: [], output: AccountDecision, side_effects: ["approved_by_analyst_id := caller"] }
  - { method: POST, path: "/account-decisions/{id}/execute", description: "APPROVED -> EXECUTED; applies account mutation and fires the exit cascade (account -> customer -> alerts/314b)", roles: [BSAManager], code: 200, input: [], output: AccountDecision, side_effects: ["Account status per decision (EXIT/RESTRICT/RETAIN)", "On EXIT with no remaining open accounts: Customer -> EXITED, alerts AUTO_CLOSED (CUSTOMER_EXITED), DRAFT 314(b) requests CANCELLED", "customer_risk_rating_recompute"] }
  - { method: POST, path: "/account-decisions/{id}/reverse", description: "APPROVED -> REVERSED (compensating action; only before execution)", roles: [BSAManager], code: 200, input: [rationale], output: AccountDecision, side_effects: [] }
  # ---- quality assurance & backlog ----
  - { method: POST, path: "/qa-reviews", description: "Sample a completed work item (CLOSED case or FILED SAR) for QA; monthly quota enforced per qa_sample_quota", roles: [QAReviewer], code: 201, input: ["case_id?", "sar_report_id?"], output: QAReview, side_effects: ["period_month stamped from logical clock", "reviewer_id := caller"] }
  - { method: GET, path: "/qa-reviews", description: "List/filter QA reviews", roles: [ComplianceAdmin, BSAAnalyst, QAReviewer, BSAManager], code: 200, input: ["case_id?", "sar_report_id?", "limit?", "offset?"], output: "QAReview[]", side_effects: [] }
  - { method: GET, path: "/qa-reviews/{id}", description: "Fetch QA review", roles: [ComplianceAdmin, BSAAnalyst, QAReviewer, BSAManager], code: 200, input: [], output: QAReview, side_effects: [] }
  - { method: POST, path: "/qa-reviews/{id}/complete", description: "SAMPLED -> COMPLETED (reviewer only)", roles: [QAReviewer], code: 200, input: [outcome, defect_count], output: QAReview, side_effects: [] }
  - { method: GET, path: "/backlog/summary", description: "Computed backlog snapshot per backlog_aging_buckets + qa_sample_quota", roles: [ComplianceAdmin, BSAAnalyst, QAReviewer, BSAManager], code: 200, input: [], output: "{ cases_open: integer, cases_age_0_15: integer, cases_age_16_30: integer, cases_age_31_60: integer, cases_age_61_plus: integer, overdue_sar_count: integer, stale_alert_count: integer, overdue_review_count: integer, qa_samples_this_month: integer, qa_quota_this_month: integer }", side_effects: ["backlog_aging_buckets", "qa_sample_quota"] }

# =============================================================================
# 1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Malformed request: missing required field, unknown enum value, non-positive amount, activity_end_date < activity_start_date, certified_at in the future, both or neither of case_id/sar_report_id on QAReview, duplicate active QAReview sample for the same target" }
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "Missing/unrecognized X-User-Role or X-User-ID, or entity_backed role id does not reference an existing Analyst" }
  - { id: ERR_FORBIDDEN_ROLE, http: 403, condition: "Caller role not permitted on this endpoint; also ownership failures (non-assigned analyst starting investigation, non-drafter editing narrative)" }
  - { id: ERR_SEGREGATION_OF_DUTIES, http: 403, condition: "Caller X-User-ID equals the actor of the prior step on a segregation-gated endpoint (proposer vs approver, drafter vs QA/approver, assignee vs case QA)" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Path or body FK references a non-existent resource" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Current entity state does not permit the requested transition per §1.2" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_<parent>_version does not match the parent's current version (OCC)" }
  - { id: ERR_SCENARIO_NOT_ACTIVE, http: 409, condition: "Operation requires MonitoringScenario.status == ACTIVE (threshold activation, evaluation) but scenario is DRAFT/SUSPENDED/RETIRED" }
  - { id: ERR_NO_ACTIVE_THRESHOLD, http: 409, condition: "Scenario activation requires an APPROVED threshold version; evaluation requires an ACTIVE threshold version" }
  - { id: ERR_ACCOUNT_NOT_OPEN, http: 409, condition: "Account decision execution requires account status IN {OPEN, RESTRICTED}" }
  - { id: ERR_LE_INQUIRY_OPEN, http: 409, condition: "Blocked while a linked LawEnforcementInquiry is open (case QA-close; 314(b) send) — business_safety, outranks temporal failures" }
  - { id: ERR_CUSTOMER_PROHIBITED, http: 409, condition: "Account opening blocked: customer risk_rating == PROHIBITED or status == EXITED" }
  - { id: ERR_THRESHOLD_WINDOW_OVERLAP, http: 409, condition: "Threshold version effective window overlaps another pipeline version (half-open semantics), or activation would backdate before the current ACTIVE version's effective_from" }
  - { id: ERR_ACTIVITY_WINDOW_OVERLAP, http: 409, condition: "SAR activity window (closed interval, date granularity) shares at least one calendar day with another FILED SAR for the same customer" }
  - { id: ERR_314B_DUPLICATE_WINDOW, http: 409, condition: "OUTBOUND share to the same counterparty about the same subject already sent within the trailing closed 90-day buffer" }
  - { id: ERR_NARRATIVE_INSUFFICIENT, http: 422, condition: "SAR narrative shorter than 500 characters at QA submission" }
  - { id: ERR_ANALYST_AT_CAPACITY, http: 409, condition: "Assigning analyst already at capacity_max_cases open assigned cases" }
  - { id: ERR_SCENARIO_HAS_OPEN_ALERTS, http: 409, condition: "Scenario retirement blocked by alerts in NEW or UNDER_TRIAGE" }
  - { id: ERR_QA_QUOTA_EXCEEDED, http: 422, condition: "Monthly QA sample quota (qa_sample_quota) already reached" }
  - { id: ERR_FILING_DEADLINE_PASSED, http: 422, condition: "now > SARReport.deadline_at at filing time" }
  - { id: ERR_CERTIFICATION_EXPIRED, http: 422, condition: "now > InfoShareRequest.certification_expires_at at send time" }
  - { id: ERR_SUBJECT_MISMATCH, http: 422, condition: "Linked records belong to different customers (alert vs case; inquiry vs case)" }

# =============================================================================
# 1.7 RBAC Matrix
# =============================================================================
roles:
  - name: ComplianceAdmin
    description: "BSA operations administrator: reference data, scenario configuration, transaction posting, LE inquiry registration, clock and sweep jobs"
    identity: opaque
    exclusive_operations: ["POST /_clock/set_current_utc", "POST /ops/jobs/daily-compliance-sweep", "POST /analysts", "POST /customers", "POST /customers/{id}/accounts", "POST /accounts/{id}/transactions", "POST /monitoring-scenarios", "POST /law-enforcement-inquiries", "POST /law-enforcement-inquiries/{id}/link-case"]
    shared_operations: ["all GET endpoints", "POST /monitoring-scenarios/{id}/evaluate"]
  - name: BSAAnalyst
    description: "BSA/AML investigator: triages alerts, works cases, drafts SARs, proposes threshold tunings and account decisions, runs continuing reviews, manages 314(b) shares"
    identity: "entity_backed:Analyst"
    exclusive_operations: ["POST /alerts/{id}/triage", "POST /alerts/{id}/dismiss", "POST /alerts/{id}/reopen", "POST /alerts/{id}/link-to-case", "POST /cases/{id}/start-investigation", "POST /cases/{id}/sar-decision", "POST /cases/{id}/sar-reports", "PUT /sar-reports/{id}/narrative", "POST /sar-reports/{id}/submit-qa", "POST /monitoring-scenarios/{id}/threshold-versions", "POST /continuing-reviews/{id}/start", "POST /continuing-reviews/{id}/complete", "POST /info-share-requests", "POST /info-share-requests/{id}/send", "POST /info-share-requests/{id}/record-response", "POST /accounts/{id}/exit-decisions"]
    shared_operations: ["all GET endpoints", "POST /cases", "POST /monitoring-scenarios/{id}/evaluate"]
  - name: QAReviewer
    description: "Independent quality reviewer: case-level and SAR-level QA, monthly QA sampling; must never review own work (segregation of duties)"
    identity: "entity_backed:Analyst"
    exclusive_operations: ["POST /cases/{id}/qa-review", "POST /sar-reports/{id}/qa-review", "POST /qa-reviews", "POST /qa-reviews/{id}/complete"]
    shared_operations: ["all GET endpoints"]
  - name: BSAManager
    description: "BSA officer: approves tunings, SARs and account decisions; files SARs; assigns cases; controls scenario lifecycle; responds to and closes LE inquiries"
    identity: "entity_backed:Analyst"
    exclusive_operations: ["POST /monitoring-scenarios/{id}/activate", "POST /monitoring-scenarios/{id}/suspend", "POST /monitoring-scenarios/{id}/retire", "POST /threshold-versions/{id}/approve", "POST /threshold-versions/{id}/return", "POST /threshold-versions/{id}/activate", "POST /cases/{id}/assign", "POST /sar-reports/{id}/approve", "POST /sar-reports/{id}/file", "POST /law-enforcement-inquiries/{id}/respond", "POST /law-enforcement-inquiries/{id}/close", "POST /account-decisions/{id}/approve", "POST /account-decisions/{id}/execute", "POST /account-decisions/{id}/reverse"]
    shared_operations: ["all GET endpoints", "POST /cases"]
