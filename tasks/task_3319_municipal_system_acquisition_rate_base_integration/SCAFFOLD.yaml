# =============================================================================
# SCAFFOLD: Municipal System Acquisition & Rate Base Integration
# =============================================================================

scenario: |
  Municipal System Acquisition & Rate Base Integration (American Water): acquisition
  target evaluation of municipal water and wastewater systems with condition assessment
  and capital need estimation, valuation approaches permitted by state law including
  fair market value appraisal processes, municipal approval process with council votes,
  public hearings and referendum possibilities, regulatory approval of the acquisition
  and the ratemaking treatment of the purchase price, transition of customers, billing
  records, deposits and service agreements to the acquiring utility, capital improvement
  plan execution to address deferred maintenance with rate impact phasing, employee
  transition and union agreement assumption, rate consolidation across acquired systems
  with single-tariff pricing debates.

domain_name: municipal-acquisition
api_prefix: /acquisitions

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: multi_party_negotiation
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers
  entity_topology: hierarchical
  state_machine_shape: branching
  relationship_patterns:
    - one_to_many
    - cross_aggregate
  role_model: segregation_of_duties
  consistency_model: immediate

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# Table 1: Entity-Relationship Table
# =============================================================================
entities:
  - name: AcquisitionTarget
    parent: null
    common_fields: true
    fields:
      - { name: system_name, type: string, source: input, description: "Name of the municipal water/wastewater system" }
      - { name: municipality_name, type: string, source: input, description: "Owning municipality" }
      - { name: state_code, type: string, source: input, description: "Two-letter US state code governing the acquisition statute" }
      - { name: system_type, type: enum, source: input, description: "WATER | WASTEWATER | COMBINED" }
      - { name: customer_count, type: integer, source: input, description: "Number of service connections; must be > 0" }
      - { name: permitted_valuation_methods, type: array, source: input, description: "Subset of {FMV_INDEPENDENT, REPLACEMENT_COST, ORIGINAL_COST_LESS_DEPRECIATION} permitted by the state's acquisition statute; must be non-empty" }
      - { name: status, type: enum, source: computed, default: "SCREENING", description: "SCREENING | VALUATION | MUNICIPAL_REVIEW | REGULATORY_REVIEW | CLOSING | INTEGRATED | REJECTED" }
      - { name: council_approved, type: boolean, source: computed, default: false, description: "True once the latest COUNCIL_VOTE passed and any REFERENDUM passed" }
      - { name: filing_estimate_cents, type: integer, source: computed, default: 0, description: "Filing-variant capital need estimate of the latest ACCEPTED ConditionAssessment" }
      - { name: selected_value_cents, type: integer, source: computed, description: "Value of the selected ValuationEntry at case finalization; null until finalized" }
      - { name: admitted_rate_base_cents, type: integer, source: computed, description: "Rate base admitted by the commission on APPROVED; null until decided" }
      - { name: disallowed_premium_cents, type: integer, source: computed, description: "purchase_price_cents - admitted_rate_base_cents on APPROVED" }

  - name: ConditionAssessment
    parent: AcquisitionTarget
    common_fields: true
    fields:
      - { name: target_id, type: string, source: system, description: "FK -> AcquisitionTarget.id; owning target" }
      - { name: notes, type: string, source: input, description: "Free-text survey notes", default: "" }
      - { name: created_by_user_id, type: string, source: system, description: "X-User-ID of creator; used for segregation-of-duties on accept" }
      - { name: revision_count, type: integer, source: system, default: 0, description: "Increments each time the assessment is rejected back to DRAFT" }
      - { name: status, type: enum, source: computed, default: "DRAFT", description: "DRAFT | SUBMITTED | ACCEPTED | SUPERSEDED" }
      - { name: planning_estimate_cents, type: integer, source: computed, default: 0, description: "Planning-variant capital need estimate (see capital_need_estimate)" }
      - { name: filing_estimate_cents, type: integer, source: computed, default: 0, description: "Filing-variant capital need estimate (see capital_need_estimate)" }

  - name: CapitalNeedItem
    parent: ConditionAssessment
    common_fields: true
    fields:
      - { name: assessment_id, type: string, source: system, description: "FK -> ConditionAssessment.id; owning assessment" }
      - { name: category, type: enum, source: input, description: "DISTRIBUTION | COLLECTION | TREATMENT | SOURCE | STORAGE | GENERAL" }
      - { name: horizon, type: enum, source: input, description: "IMMEDIATE | SHORT_TERM | LONG_TERM" }
      - { name: description, type: string, source: input, description: "Scope of work" }
      - { name: cost_low_cents, type: integer, source: input, description: "Low bound of cost range; must be >= 0" }
      - { name: cost_high_cents, type: integer, source: input, description: "High bound; must be >= cost_low_cents" }
      - { name: midpoint_estimate_cents, type: integer, source: computed, description: "round_half_up((cost_low_cents + cost_high_cents) / 2) computed per item" }
      - { name: crews_required, type: integer, source: input, description: "Crews needed during the execution window; must be >= 1" }
      - { name: window_start, type: datetime, source: input, description: "Execution window start (set at schedule time)" }
      - { name: window_end, type: datetime, source: input, description: "Execution window end (set at schedule time); must be > window_start" }
      - { name: status, type: enum, source: computed, default: "PLANNED", description: "PLANNED | SCHEDULED | EXECUTED | SPLIT | CANCELLED" }

  - name: ValuationCase
    parent: AcquisitionTarget
    common_fields: true
    fields:
      - { name: target_id, type: string, source: system, description: "FK -> AcquisitionTarget.id; owning target" }
      - { name: status, type: enum, source: computed, default: "OPEN", description: "OPEN | FINALIZED | SUPERSEDED" }
      - { name: selected_entry_id, type: string, source: system, description: "id of the selected ValuationEntry; null until finalized" }
      - { name: selected_value_cents, type: integer, source: computed, description: "Value of the selected entry; null until finalized" }
      - { name: finalized_by_user_id, type: string, source: system, description: "X-User-ID that finalized the case; null until finalized" }

  - name: ValuationEntry
    parent: ValuationCase
    common_fields: true
    fields:
      - { name: case_id, type: string, source: system, description: "FK -> ValuationCase.id; owning case" }
      - { name: method, type: enum, source: input, description: "FMV_INDEPENDENT | REPLACEMENT_COST | ORIGINAL_COST_LESS_DEPRECIATION" }
      - { name: value_cents, type: integer, source: input, description: "Appraised value; must be > 0" }
      - { name: law_citation, type: string, source: input, description: "Statutory citation authorizing the method" }
      - { name: appraiser_user_id, type: string, source: system, description: "X-User-ID of the submitting appraiser" }
      - { name: status, type: enum, source: computed, default: "SUBMITTED", description: "SUBMITTED | SELECTED | NOT_SELECTED" }

  - name: CouncilEvent
    parent: AcquisitionTarget
    common_fields: true
    fields:
      - { name: target_id, type: string, source: system, description: "FK -> AcquisitionTarget.id; owning target" }
      - { name: kind, type: enum, source: input, description: "PUBLIC_HEARING | COUNCIL_VOTE | REFERENDUM" }
      - { name: scheduled_start, type: datetime, source: input, description: "Window start (half-open interval start)" }
      - { name: scheduled_end, type: datetime, source: input, description: "Window end (half-open interval end); must be > scheduled_start" }
      - { name: yes_votes, type: integer, source: input, description: "Yes votes; required when recording COUNCIL_VOTE or REFERENDUM outcome" }
      - { name: no_votes, type: integer, source: input, description: "No votes; required when recording COUNCIL_VOTE or REFERENDUM outcome" }
      - { name: yes_share_pct, type: number, source: computed, description: "round_half_up(yes_votes / (yes_votes + no_votes) * 100, 2 decimal places); null until outcome recorded" }
      - { name: status, type: enum, source: computed, default: "SCHEDULED", description: "SCHEDULED | HELD | PASSED | FAILED" }

  - name: RegulatoryApplication
    parent: AcquisitionTarget
    common_fields: true
    fields:
      - { name: target_id, type: string, source: system, description: "FK -> AcquisitionTarget.id; owning target" }
      - { name: purchase_price_cents, type: integer, source: input, description: "Agreed purchase price; must be > 0" }
      - { name: rate_base_method, type: enum, source: input, description: "AS_PAID | DEPRECIATED_ORIGINAL_COST" }
      - { name: original_cost_less_depreciation_cents, type: integer, source: input, description: "Seller's net book cost; required when rate_base_method is DEPRECIATED_ORIGINAL_COST, otherwise optional" }
      - { name: filing_round, type: integer, source: system, default: 1, description: "Increments on each refile after REMANDED" }
      - { name: status, type: enum, source: computed, default: "PREPARED", description: "PREPARED | FILED | APPROVED | DENIED | REMANDED" }
      - { name: admitted_rate_base_cents, type: integer, source: computed, description: "Computed at APPROVED per rate_base_admission; null otherwise" }
      - { name: disallowed_premium_cents, type: integer, source: computed, description: "purchase_price_cents - admitted_rate_base_cents at APPROVED" }

  - name: CustomerAccount
    parent: AcquisitionTarget
    common_fields: true
    fields:
      - { name: target_id, type: string, source: system, description: "FK -> AcquisitionTarget.id; owning target" }
      - { name: account_ref, type: string, source: input, description: "Legacy account number; unique within the target" }
      - { name: deposit_cents, type: integer, source: input, description: "Customer deposit held by the municipality; must be >= 0" }
      - { name: ar_balance_cents, type: integer, source: input, description: "Legacy accounts-receivable balance owed; must be >= 0" }
      - { name: status, type: enum, source: computed, default: "LEGACY", description: "LEGACY | MIGRATED | CONSOLIDATED | ORPHANED" }
      - { name: deposit_offset_cents, type: integer, source: computed, description: "Portion of deposit applied against AR at migration (see deposit_settlement)" }
      - { name: refund_cents, type: integer, source: computed, description: "Deposit remainder refunded at migration" }
      - { name: new_ar_balance_cents, type: integer, source: computed, description: "AR balance carried into the acquirer's billing system after offset" }

  - name: TransitionItem
    parent: AcquisitionTarget
    common_fields: true
    fields:
      - { name: target_id, type: string, source: system, description: "FK -> AcquisitionTarget.id; owning target" }
      - { name: category, type: enum, source: system, description: "BILLING_RECORDS | DEPOSITS | SERVICE_AGREEMENTS | METER_READS; exactly one item per category is auto-created when the target is created" }
      - { name: status, type: enum, source: computed, default: "PENDING", description: "PENDING | DONE | BLOCKED" }
      - { name: resolution_note, type: string, source: input, description: "Optional note recorded at resolution", default: "" }

  - name: EmployeeTransition
    parent: AcquisitionTarget
    common_fields: true
    fields:
      - { name: target_id, type: string, source: system, description: "FK -> AcquisitionTarget.id; owning target" }
      - { name: employee_ref, type: string, source: input, description: "Municipal employee identifier" }
      - { name: years_of_service, type: integer, source: input, description: "Completed years of service; must be >= 0" }
      - { name: weekly_salary_cents, type: integer, source: input, description: "Weekly salary; must be > 0" }
      - { name: union_covered, type: boolean, source: input, description: "Whether the employee is covered by a collective bargaining agreement" }
      - { name: status, type: enum, source: computed, default: "PENDING", description: "PENDING | ACCEPTED | DECLINED | ASSUMED | WITHDRAWN" }
      - { name: severance_weeks, type: integer, source: computed, description: "Computed at DECLINED per severance_calc; 0 for ACCEPTED/ASSUMED/WITHDRAWN" }
      - { name: severance_cents, type: integer, source: computed, description: "severance_weeks * weekly_salary_cents" }

  - name: TariffCase
    parent: AcquisitionTarget
    common_fields: true
    fields:
      - { name: target_id, type: string, source: system, description: "FK -> AcquisitionTarget.id; owning target" }
      - { name: mode, type: enum, source: input, description: "SINGLE_TARIFF | STAND_ALONE" }
      - { name: representative_old_bill_cents, type: integer, source: input, description: "Representative monthly bill under legacy rates; must be > 0" }
      - { name: consolidated_monthly_bill_cents, type: integer, source: input, description: "Proposed consolidated monthly bill; must be > 0" }
      - { name: phase_in_years, type: integer, source: computed, description: "Years to reach consolidated bill under the annual increase cap (see phase_in_schedule); null until ADOPTED" }
      - { name: status, type: enum, source: computed, default: "DRAFT", description: "DRAFT | ADOPTED" }

# =============================================================================
# Table 2: State Machine Table
# =============================================================================
state_machines:
  - entity: AcquisitionTarget
    initial_state: SCREENING
    terminal_states: [REJECTED, INTEGRATED]
    transitions:
      - from: SCREENING
        to: VALUATION
        trigger: "system (automatic when a ConditionAssessment reaches ACCEPTED)"
        actor: system
        preconditions: []
        side_effects:
          - "Copy the assessment's filing_estimate_cents onto the target"
          - "Increments AcquisitionTarget.version by 1"
      - from: VALUATION
        to: MUNICIPAL_REVIEW
        trigger: "system (automatic when a ValuationCase is FINALIZED)"
        actor: system
        preconditions: []
        side_effects:
          - "Copy case.selected_value_cents onto target.selected_value_cents"
          - "Increments AcquisitionTarget.version by 1"
      - from: MUNICIPAL_REVIEW
        to: REGULATORY_REVIEW
        trigger: "POST /acquisitions/targets/{id}/regulatory-applications (create+file)"
        actor: RegulatoryOfficer
        preconditions:
          - "target.council_approved == true (ERR_APPROVAL_PREREQ)"
        side_effects:
          - "Increments AcquisitionTarget.version by 1"
      - from: REGULATORY_REVIEW
        to: CLOSING
        trigger: "system (automatic when the FILED RegulatoryApplication is APPROVED)"
        actor: system
        preconditions: []
        side_effects:
          - "Copy application.admitted_rate_base_cents and disallowed_premium_cents onto the target"
          - "Increments AcquisitionTarget.version by 1"
      - from: CLOSING
        to: INTEGRATED
        trigger: "POST /acquisitions/targets/{id}/close"
        actor: TransitionManager
        preconditions:
          - "All four TransitionItems for the target are DONE (ERR_TRANSITION_INCOMPLETE)"
          - "No CustomerAccount of the target remains in LEGACY status (ERR_ACCOUNTS_PENDING)"
          - "No EmployeeTransition of the target remains in PENDING status (ERR_EMPLOYEES_PENDING)"
        side_effects:
          - "Increments AcquisitionTarget.version by 1"
      - from: MUNICIPAL_REVIEW
        to: REJECTED
        trigger: "system (automatic when a COUNCIL_VOTE or REFERENDUM outcome is recorded FAILED)"
        actor: system
        preconditions: []
        side_effects:
          - "Cascade hop 2: every OPEN or FINALIZED ValuationCase of the target -> SUPERSEDED; every SUBMITTED or SELECTED ValuationEntry -> NOT_SELECTED"
          - "Cascade hop 2: every PENDING TransitionItem of the target -> BLOCKED"
          - "Cascade hop 3: every PENDING EmployeeTransition of the target -> WITHDRAWN (severance remains 0)"
          - "Increments AcquisitionTarget.version by 1"

  - entity: ConditionAssessment
    initial_state: DRAFT
    terminal_states: [ACCEPTED, SUPERSEDED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /acquisitions/assessments/{id}/submit"
        actor: AcquisitionAnalyst
        preconditions:
          - "Assessment has at least one non-SPLIT CapitalNeedItem (ERR_ASSESSMENT_EMPTY)"
        side_effects:
          - "Recompute planning_estimate_cents and filing_estimate_cents per capital_need_estimate"
      - from: SUBMITTED
        to: ACCEPTED
        trigger: "POST /acquisitions/assessments/{id}/accept"
        actor: EngineeringReviewer
        preconditions:
          - "X-User-ID != assessment.created_by_user_id (ERR_SEGREGATION_OF_DUTY)"
          - "Target is in SCREENING or VALUATION (ERR_INVALID_STATE)"
        side_effects:
          - "If the target has another ACCEPTED assessment, that assessment -> SUPERSEDED"
          - "If the target is in SCREENING, trigger target transition SCREENING -> VALUATION"
      - from: SUBMITTED
        to: DRAFT
        trigger: "POST /acquisitions/assessments/{id}/reject"
        actor: EngineeringReviewer
        preconditions:
          - "X-User-ID != assessment.created_by_user_id (ERR_SEGREGATION_OF_DUTY)"
        side_effects:
          - "revision_count += 1"

  - entity: CapitalNeedItem
    initial_state: PLANNED
    terminal_states: [EXECUTED, SPLIT, CANCELLED]
    transitions:
      - from: PLANNED
        to: SCHEDULED
        trigger: "POST /acquisitions/capital-items/{id}/schedule"
        actor: TransitionManager
        preconditions:
          - "Item's assessment is ACCEPTED (ERR_INVALID_STATE)"
          - "Item's target is in VALUATION or later non-terminal status (ERR_INVALID_STATE)"
          - "window_end > window_start (ERR_INVALID_WINDOW)"
          - "Crew capacity rule: for every instant in [window_start, window_end), sum of crews_required over this item plus all other SCHEDULED items of the same target whose windows contain that instant must be <= MAX_CREWS_PER_TARGET (ERR_CREW_CAPACITY_EXCEEDED)"
        side_effects: []
      - from: SCHEDULED
        to: EXECUTED
        trigger: "POST /acquisitions/capital-items/{id}/execute"
        actor: TransitionManager
        preconditions:
          - "Current logical clock >= window_start (ERR_WINDOW_NOT_OPEN)"
          - "Item's target is in CLOSING or INTEGRATED (ERR_INVALID_STATE)"
        side_effects: []
      - from: PLANNED
        to: SPLIT
        trigger: "POST /acquisitions/capital-items/{id}/split"
        actor: AcquisitionAnalyst
        preconditions:
          - "Item's assessment is in DRAFT (ERR_INVALID_STATE)"
          - "split_low_cents >= 0 and split_low_cents <= cost_low_cents and split_high_cents >= 0 and split_high_cents <= cost_high_cents (ERR_INVALID_SPLIT)"
        side_effects:
          - "Create child CapitalNeedItem A with cost_low_cents=split_low_cents, cost_high_cents=split_high_cents, status=PLANNED"
          - "Create child CapitalNeedItem B with cost_low_cents=cost_low_cents-split_low_cents, cost_high_cents=cost_high_cents-split_high_cents, status=PLANNED"
          - "Children copy category, horizon, description, crews_required from the parent"
          - "Conservation invariant: A.cost_low_cents + B.cost_low_cents == parent cost_low_cents and same for cost_high_cents"
      - from: PLANNED
        to: CANCELLED
        trigger: "POST /acquisitions/capital-items/{id}/cancel"
        actor: AcquisitionAnalyst
        preconditions:
          - "Item's assessment is in DRAFT (ERR_INVALID_STATE)"
        side_effects: []

  - entity: ValuationCase
    initial_state: OPEN
    terminal_states: [FINALIZED, SUPERSEDED]
    transitions:
      - from: OPEN
        to: FINALIZED
        trigger: "POST /acquisitions/valuation-cases/{id}/finalize"
        actor: AcquisitionAnalyst
        preconditions:
          - "X-User-ID must differ from the appraiser_user_id of every SUBMITTED ValuationEntry in the case (ERR_SEGREGATION_OF_DUTY)"
          - "select_entry_id identifies a SUBMITTED ValuationEntry in this case (ERR_INVALID_STATE)"
        side_effects:
          - "Selected entry -> SELECTED; all other SUBMITTED entries -> NOT_SELECTED"
          - "case.selected_entry_id and selected_value_cents set"
          - "Trigger target transition VALUATION -> MUNICIPAL_REVIEW"
      - from: OPEN
        to: SUPERSEDED
        trigger: "system (automatic when target reaches REJECTED, or when a newer ValuationCase is created while this case is OPEN)"
        actor: system
        preconditions: []
        side_effects:
          - "All SUBMITTED entries -> NOT_SELECTED"

  - entity: ValuationEntry
    initial_state: SUBMITTED
    terminal_states: [SELECTED, NOT_SELECTED]
    transitions:
      - from: SUBMITTED
        to: SELECTED
        trigger: "system (when its case is finalized with this entry selected)"
        actor: system
        preconditions: []
        side_effects: []
      - from: SUBMITTED
        to: NOT_SELECTED
        trigger: "system (when its case is finalized with another entry, or the case is superseded)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: CouncilEvent
    initial_state: SCHEDULED
    terminal_states: [HELD, PASSED, FAILED]
    transitions:
      - from: SCHEDULED
        to: HELD
        trigger: "POST /acquisitions/council-events/{id}/record-outcome with kind PUBLIC_HEARING"
        actor: MunicipalClerk
        preconditions:
          - "Event kind is PUBLIC_HEARING (ERR_INVALID_STATE)"
        side_effects: []
      - from: SCHEDULED
        to: PASSED
        trigger: "POST /acquisitions/council-events/{id}/record-outcome"
        actor: MunicipalClerk
        preconditions:
          - "Event kind is COUNCIL_VOTE or REFERENDUM (ERR_INVALID_STATE)"
          - "yes_votes and no_votes provided, sum > 0 (ERR_INVALID_REQUEST)"
          - "yes_share_pct meets the threshold (see vote_outcome)"
          - "COUNCIL_VOTE only: at least one PUBLIC_HEARING of the same target is HELD with scheduled_end + MIN_HEARING_NOTICE_DAYS days <= current logical clock (ERR_HEARING_NOTICE)"
        side_effects:
          - "COUNCIL_VOTE PASSED: if target.referendum_required is not triggered (vote share >= 60 percent passes outright) set target.council_approved = true; REFERENDUM PASSED: set target.council_approved = true"
      - from: SCHEDULED
        to: FAILED
        trigger: "POST /acquisitions/council-events/{id}/record-outcome"
        actor: MunicipalClerk
        preconditions:
          - "Event kind is COUNCIL_VOTE or REFERENDUM (ERR_INVALID_STATE)"
          - "yes_share_pct below the threshold (see vote_outcome)"
        side_effects:
          - "COUNCIL_VOTE FAILED with yes_share_pct >= REFERENDUM_TRIGGER_PCT (50.00): the target remains in MUNICIPAL_REVIEW and a REFERENDUM may be scheduled (no target rejection)"
          - "COUNCIL_VOTE FAILED with yes_share_pct < REFERENDUM_TRIGGER_PCT: trigger target MUNICIPAL_REVIEW -> REJECTED cascade"
          - "REFERENDUM FAILED: trigger target MUNICIPAL_REVIEW -> REJECTED cascade"

  - entity: RegulatoryApplication
    initial_state: PREPARED
    terminal_states: [APPROVED, DENIED]
    transitions:
      - from: PREPARED
        to: FILED
        trigger: "system (creation endpoint creates the application already FILED)"
        actor: system
        preconditions: []
        side_effects:
          - "Trigger target MUNICIPAL_REVIEW -> REGULATORY_REVIEW"
      - from: FILED
        to: APPROVED
        trigger: "POST /acquisitions/regulatory-applications/{id}/decide with outcome=APPROVED"
        actor: Commissioner
        preconditions:
          - "rate_base_admission computed and recorded"
        side_effects:
          - "admitted_rate_base_cents and disallowed_premium_cents set on the application"
          - "Trigger target REGULATORY_REVIEW -> CLOSING"
      - from: FILED
        to: DENIED
        trigger: "POST /acquisitions/regulatory-applications/{id}/decide with outcome=DENIED"
        actor: Commissioner
        preconditions: []
        side_effects:
          - "Trigger target REJECTED cascade (same side effects as council failure)"
      - from: FILED
        to: REMANDED
        trigger: "POST /acquisitions/regulatory-applications/{id}/decide with outcome=REMANDED"
        actor: Commissioner
        preconditions: []
        side_effects: []
      - from: REMANDED
        to: FILED
        trigger: "POST /acquisitions/regulatory-applications/{id}/refile"
        actor: RegulatoryOfficer
        preconditions:
          - "expected_target_version matches the target's current version (ERR_STALE_VERSION)"
        side_effects:
          - "filing_round += 1"
          - "purchase_price_cents and rate_base_method may be replaced by the refile payload"
          - "Increments AcquisitionTarget.version by 1"

  - entity: CustomerAccount
    initial_state: LEGACY
    terminal_states: [CONSOLIDATED, ORPHANED]
    transitions:
      - from: LEGACY
        to: MIGRATED
        trigger: "POST /acquisitions/customer-accounts/{id}/migrate"
        actor: TransitionManager
        preconditions:
          - "Target is in CLOSING (ERR_INVALID_STATE)"
          - "The target's TransitionItem with category=BILLING_RECORDS is DONE (ERR_TRANSITION_PREREQ)"
        side_effects:
          - "Compute deposit_offset_cents, refund_cents, new_ar_balance_cents per deposit_settlement"
      - from: MIGRATED
        to: CONSOLIDATED
        trigger: "POST /acquisitions/customer-accounts/{id}/consolidate"
        actor: TransitionManager
        preconditions:
          - "The target has an ADOPTED TariffCase (ERR_TARIFF_NOT_ADOPTED)"
        side_effects: []
      - from: LEGACY
        to: ORPHANED
        trigger: "POST /acquisitions/customer-accounts/{id}/orphan"
        actor: TransitionManager
        preconditions:
          - "Target is in CLOSING (ERR_INVALID_STATE)"
          - "ar_balance_cents == 0 and deposit_cents == 0 (ERR_ACCOUNT_NOT_SETTLED)"
        side_effects: []

  - entity: TransitionItem
    initial_state: PENDING
    terminal_states: [DONE, BLOCKED]
    transitions:
      - from: PENDING
        to: DONE
        trigger: "POST /acquisitions/transition-items/{id}/resolve"
        actor: TransitionManager
        preconditions:
          - "Target is in CLOSING (ERR_INVALID_STATE)"
          - "category=DEPOSITS additionally requires no CustomerAccount of the target in LEGACY status (ERR_ACCOUNTS_PENDING)"
        side_effects: []
      - from: PENDING
        to: BLOCKED
        trigger: "system (automatic when target reaches REJECTED)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: EmployeeTransition
    initial_state: PENDING
    terminal_states: [ACCEPTED, DECLINED, ASSUMED, WITHDRAWN]
    transitions:
      - from: PENDING
        to: ACCEPTED
        trigger: "POST /acquisitions/employee-transitions/{id}/offer-response with response=ACCEPTED"
        actor: HRDirector
        preconditions:
          - "Target is in VALUATION, MUNICIPAL_REVIEW, REGULATORY_REVIEW, or CLOSING (ERR_INVALID_STATE)"
        side_effects:
          - "severance_weeks = 0, severance_cents = 0"
      - from: PENDING
        to: DECLINED
        trigger: "POST /acquisitions/employee-transitions/{id}/offer-response with response=DECLINED"
        actor: HRDirector
        preconditions:
          - "union_covered == false (ERR_UNION_ASSUMPTION_REQUIRED)"
          - "Target is in VALUATION, MUNICIPAL_REVIEW, REGULATORY_REVIEW, or CLOSING (ERR_INVALID_STATE)"
        side_effects:
          - "Compute severance_weeks and severance_cents per severance_calc"
      - from: PENDING
        to: ASSUMED
        trigger: "POST /acquisitions/employee-transitions/{id}/offer-response with response=ASSUMED"
        actor: HRDirector
        preconditions:
          - "union_covered == true (ERR_INVALID_STATE)"
          - "Target is in VALUATION, MUNICIPAL_REVIEW, REGULATORY_REVIEW, or CLOSING (ERR_INVALID_STATE)"
        side_effects:
          - "severance_weeks = 0, severance_cents = 0 (union agreement assumed in full)"
      - from: PENDING
        to: WITHDRAWN
        trigger: "system (automatic when target reaches REJECTED)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: TariffCase
    initial_state: DRAFT
    terminal_states: [ADOPTED]
    transitions:
      - from: DRAFT
        to: ADOPTED
        trigger: "POST /acquisitions/tariff-cases/{id}/adopt"
        actor: RegulatoryOfficer
        preconditions:
          - "Target is in REGULATORY_REVIEW or CLOSING (ERR_INVALID_STATE)"
          - "No other ADOPTED TariffCase exists for the target (ERR_INVALID_STATE)"
          - "mode=SINGLE_TARIFF requires the target's RegulatoryApplication to be APPROVED (ERR_APPROVAL_PREREQ)"
        side_effects:
          - "Compute phase_in_years per phase_in_schedule and store it"

# =============================================================================
# Concurrency Rules (§1.2.1) — OCC on AcquisitionTarget.version only
# =============================================================================
concurrency_rules:
  - rule_id: valuation-case-create-stale-target
    parent_entity: AcquisitionTarget
    write_endpoint: "POST /acquisitions/targets/{id}/valuation-cases"
    occ_field: "expected_target_version"
    description: |
      Creating a ValuationCase against an AcquisitionTarget whose version has
      advanced since the client last observed it is rejected. A previously
      created OPEN case legitimately supersedes under the one-open-case rule,
      so a stale view of the target must fail with ERR_STALE_VERSION rather
      than silently superseding again.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: regulatory-refile-stale-target
    parent_entity: AcquisitionTarget
    write_endpoint: "POST /acquisitions/regulatory-applications/{id}/refile"
    occ_field: "expected_target_version"
    description: |
      Refiling a REMANDED RegulatoryApplication while carrying a target version
      that no longer matches the target's current version is rejected. Between
      the client's last read and the refile, a council outcome or cascade may
      have advanced the target, invalidating the refile's premise.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# Table 3: Calculation Rules Table
# =============================================================================
calculations:
  - name: capital_need_estimate
    trigger: "ConditionAssessment submit (and recompute on any non-SPLIT item add/cancel/split while DRAFT)"
    algorithm: aggregation
    formula: |
      Items: all CapitalNeedItem of the assessment with status in {PLANNED, SCHEDULED, EXECUTED}
      (SPLIT and CANCELLED items are excluded).
      Per item: midpoint_estimate_cents = round_half_up((cost_low_cents + cost_high_cents) / 2)
      planning_estimate_cents = round_half_up( sum(cost_low_cents over items) * (1 + PLANNING_CONTINGENCY) )
      filing_estimate_cents   = round_half_up( sum(midpoint_estimate_cents over items) * (1 + FILING_CONTINGENCY) )
      NOTE: the filing variant rounds each midpoint PER ITEM first, then sums; summing raw
      (low+high)/2 values and rounding once at the end is forbidden — the pinned order is
      per-line rounding then summation.
    input_set: "CapitalNeedItem rows of the assessment in PLANNED/SCHEDULED/EXECUTED status"
    constants:
      PLANNING_CONTINGENCY: 0.10
      FILING_CONTINGENCY: 0.15
    precision: "integer cents; midpoint division rounds half-up to the cent before summation"
    variants:
      - name: planning_estimate
        when: "internal planning view; sums low bounds with a 10 percent contingency"
        difference: "uses cost_low_cents (not midpoint) and 10 percent contingency"
      - name: filing_estimate
        when: "regulatory filing view; copied onto target.filing_estimate_cents at acceptance"
        difference: "uses per-item rounded midpoints and a 15 percent contingency"

  - name: rate_base_admission
    trigger: "RegulatoryApplication decide with outcome=APPROVED"
    algorithm: threshold
    formula: |
      purchase_price = application.purchase_price_cents
      selected_value = target.selected_value_cents
      premium_cap    = round_half_up(selected_value * PREMIUM_CAP_RATE)
      as_paid_admission = min(purchase_price, selected_value + premium_cap)
      if application.rate_base_method == DEPRECIATED_ORIGINAL_COST:
        base_admission = min(purchase_price, application.original_cost_less_depreciation_cents)
      else:
        base_admission = as_paid_admission
      admitted_rate_base_cents = min(base_admission, filing_estimate_cents_of_target + selected_value + premium_cap)
      disallowed_premium_cents = purchase_price - admitted_rate_base_cents
    input_set: "the FILED application, its target's selected_value_cents and filing_estimate_cents"
    constants:
      PREMIUM_CAP_RATE: 0.10
    precision: "integer cents, round_half_up on the premium cap"
    variants:
      - name: as_paid
        when: "rate_base_method == AS_PAID; commission admits up to fair value plus a 10 percent acquisition premium"
        difference: "cap is selected_value + 10 percent of selected_value"
      - name: depreciated_original_cost
        when: "rate_base_method == DEPRECIATED_ORIGINAL_COST; cap is the seller's net book cost"
        difference: "uses original_cost_less_depreciation_cents instead of the premium-capped fair value"

  - name: vote_outcome
    trigger: "CouncilEvent record-outcome for COUNCIL_VOTE or REFERENDUM"
    algorithm: threshold
    formula: |
      total = yes_votes + no_votes
      yes_share_pct = round_half_up(yes_votes / total * 100, 2 decimal places)
      if kind == COUNCIL_VOTE:
        passed  <=> yes_share_pct >= COUNCIL_PASS_PCT
          # >= : exactly 60.00 passes; 59.99 fails. Supermajority required.
        referendum_available <=> REFERENDUM_TRIGGER_PCT <= yes_share_pct < COUNCIL_PASS_PCT
          # vote FAILED but the margin is close enough that a REFERENDUM may be
          # scheduled; target stays in MUNICIPAL_REVIEW
        hard_fail <=> yes_share_pct < REFERENDUM_TRIGGER_PCT
          # vote FAILED decisively; target -> REJECTED cascade
      if kind == REFERENDUM:
        passed <=> yes_share_pct > REFERENDUM_PASS_PCT
          # > : exactly 50.00 FAILS; 50.01 passes. Strict majority.
    input_set: "the event's yes_votes/no_votes"
    constants:
      COUNCIL_PASS_PCT: 60.00
      REFERENDUM_TRIGGER_PCT: 50.00
      REFERENDUM_PASS_PCT: 50.00
    precision: "2 decimal places, round_half_up on yes_share_pct"

  - name: deposit_settlement
    trigger: "CustomerAccount migrate"
    algorithm: waterfall_allocation
    formula: |
      # Evaluation order is pinned (avoids the circular reading):
      #   1. deposit_offset_cents   = min(deposit_cents, ar_balance_cents)
      #   2. new_ar_balance_cents   = ar_balance_cents - deposit_offset_cents
      #   3. refund_cents           = deposit_cents - deposit_offset_cents
      # Invariant: refund_cents + deposit_offset_cents == deposit_cents
      #            and new_ar_balance_cents + deposit_offset_cents == ar_balance_cents
    input_set: "the CustomerAccount being migrated"
    constants: {}
    precision: "integer cents; no rounding"

  - name: severance_calc
    trigger: "EmployeeTransition offer-response with response=DECLINED"
    algorithm: threshold
    formula: |
      if years_of_service >= 10: severance_weeks = 8
      else if years_of_service >= 5: severance_weeks = 4
      else if years_of_service >= 1: severance_weeks = 2
      else: severance_weeks = 1
      severance_cents = severance_weeks * weekly_salary_cents
      # Boundaries are >= : exactly 5 years -> 4 weeks; exactly 10 -> 8; exactly 0 -> 1.
    input_set: "the EmployeeTransition being declined"
    constants:
      TIER1_YEARS: 10
      TIER2_YEARS: 5
      TIER3_YEARS: 1
    precision: "integer weeks and cents"

  - name: phase_in_schedule
    trigger: "TariffCase adopt"
    algorithm: threshold
    formula: |
      # Annual bill increase is capped at PHASE_IN_CAP_PCT percent of the
      # representative old bill per year, compounded yearly, until the
      # consolidated bill is reached.
      cap_per_year = round_half_up(representative_old_bill_cents * PHASE_IN_CAP_PCT / 100)
      delta = consolidated_monthly_bill_cents - representative_old_bill_cents
      if delta <= 0: phase_in_years = 0
      else: phase_in_years = ceil(delta / cap_per_year)
      # Boundary: delta exactly equal to k * cap_per_year -> phase_in_years == k (not k+1).
    input_set: "the TariffCase being adopted"
    constants:
      PHASE_IN_CAP_PCT: 5
    precision: "integer cents for the cap; integer years"

# =============================================================================
# Table 4: Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role header present and names a declared role; X-User-ID present and non-empty"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all endpoints"
  - priority: 2
    category: auth
    check: "Role is permitted for the endpoint per the RBAC matrix"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: "all endpoints"
  - priority: 3
    category: existence
    check: "All path-template resource ids exist, validated left to right; nested children must belong to the parent in the path"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all endpoints with path parameters"
  - priority: 4
    category: business_safety
    check: "Segregation of duties: the actor accepting/rejecting a ConditionAssessment must not be its creator; the actor finalizing a ValuationCase must not be the appraiser of any SUBMITTED entry in it"
    error_id: ERR_SEGREGATION_OF_DUTY
    http_status: 403
    applies_to: "POST /acquisitions/assessments/{id}/accept, POST /acquisitions/assessments/{id}/reject, POST /acquisitions/valuation-cases/{id}/finalize"
  - priority: 5
    category: state
    check: "Target/child entity is in a state from which the requested transition exists per the state machine table"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all action endpoints"
  - priority: 6
    category: business_temporal
    check: "Window sanity: window_end > window_start / scheduled_end > scheduled_start"
    error_id: ERR_INVALID_WINDOW
    http_status: 422
    applies_to: "POST /acquisitions/capital-items/{id}/schedule, POST /acquisitions/targets/{id}/council-events"
  - priority: 7
    category: business_temporal
    check: "CouncilEvent windows of the same target must not overlap under half-open semantics [start, end): back-to-back events (end == next start) are allowed; every previously created event of the target counts regardless of status"
    error_id: ERR_EVENT_OVERLAP
    http_status: 409
    applies_to: "POST /acquisitions/targets/{id}/council-events"
  - priority: 8
    category: business_temporal
    check: "Hearing notice: a COUNCIL_VOTE may only be recorded PASSED/FAILED when some PUBLIC_HEARING of the same target is HELD and its scheduled_end is at least MIN_HEARING_NOTICE_DAYS (7) days before the current logical clock"
    error_id: ERR_HEARING_NOTICE
    http_status: 409
    applies_to: "POST /acquisitions/council-events/{id}/record-outcome"
  - priority: 9
    category: business_temporal
    check: "Crew capacity: scheduling a CapitalNeedItem must keep concurrent crew demand <= MAX_CREWS_PER_TARGET (3) at every instant of its window"
    error_id: ERR_CREW_CAPACITY_EXCEEDED
    http_status: 409
    applies_to: "POST /acquisitions/capital-items/{id}/schedule"
  - priority: 10
    category: business_referential
    check: "State-law method check: a ValuationEntry's method must be an element of the target's permitted_valuation_methods"
    error_id: ERR_METHOD_NOT_PERMITTED
    http_status: 422
    applies_to: "POST /acquisitions/valuation-cases/{id}/entries"
  - priority: 11
    category: business_referential
    check: "A REFERENDUM CouncilEvent may only be created while the target's latest recorded COUNCIL_VOTE is FAILED with yes_share_pct >= REFERENDUM_TRIGGER_PCT (50.00); a COUNCIL_VOTE may only be recorded after a HELD hearing satisfying the notice rule (priority 8)"
    error_id: ERR_REFERENDUM_NOT_AVAILABLE
    http_status: 409
    applies_to: "POST /acquisitions/targets/{id}/council-events"
  - priority: 12
    category: business_referential
    check: "Prerequisite gates: regulatory application requires council_approved; customer migration requires BILLING_RECORDS transition DONE; DEPOSITS transition resolution requires no LEGACY accounts; close requires all transitions DONE, no LEGACY accounts, no PENDING employees"
    error_id: "ERR_APPROVAL_PREREQ | ERR_TRANSITION_PREREQ | ERR_ACCOUNTS_PENDING | ERR_TRANSITION_INCOMPLETE | ERR_EMPLOYEES_PENDING"
    http_status: 409
    applies_to: "POST /acquisitions/targets/{id}/regulatory-applications, POST /acquisitions/customer-accounts/{id}/migrate, POST /acquisitions/transition-items/{id}/resolve, POST /acquisitions/targets/{id}/close"
  - priority: 13
    category: business_fiscal
    check: "Non-negativity and range checks on money fields: value_cents > 0, purchase_price_cents > 0, cost bounds ordered, deposit/AR >= 0, bill amounts > 0, split amounts within parent bounds"
    error_id: "ERR_INVALID_REQUEST | ERR_INVALID_SPLIT"
    http_status: 422
    applies_to: "create/schedule/split endpoints"
  - priority: 14
    category: business_constraint
    check: "Account-settled gate: orphan requires ar_balance_cents == 0 and deposit_cents == 0"
    error_id: ERR_ACCOUNT_NOT_SETTLED
    http_status: 409
    applies_to: "POST /acquisitions/customer-accounts/{id}/orphan"
  - priority: 15
    category: business_constraint
    check: "Union rule: DECLINED requires union_covered == false; ASSUMED requires union_covered == true"
    error_id: ERR_UNION_ASSUMPTION_REQUIRED
    http_status: 409
    applies_to: "POST /acquisitions/employee-transitions/{id}/offer-response"
  - priority: 16
    category: business_constraint
    check: "Uniqueness: account_ref unique within target; exactly one OPEN ValuationCase per target; exactly one ADOPTED TariffCase per target"
    error_id: ERR_DUPLICATE
    http_status: 409
    applies_to: "POST /acquisitions/targets/{id}/customer-accounts, POST /acquisitions/tariff-cases/{id}/adopt"

# =============================================================================
# Table 5: API Endpoint Table
# =============================================================================
endpoints:
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Advance the server's logical clock. Server startup default is exactly 2026-09-01T00:00:00Z; before any call the clock reads that value and never falls back to wall-clock time."
    roles: [SystemAdmin]
    code: 200
    input: [to_iso8601]
    output: "{ current_utc: string }"
    side_effects: ["logical clock set; subsequent date-sensitive rules evaluate against it"]

  # --- AcquisitionTarget ---
  - method: POST
    path: "/acquisitions/targets"
    description: "Create an acquisition target; auto-creates the four TransitionItems (one per category) in PENDING"
    roles: [AcquisitionAnalyst]
    code: 201
    input: [system_name, municipality_name, state_code, system_type, customer_count, permitted_valuation_methods]
    output: AcquisitionTarget
    side_effects: ["status=SCREENING", "four TransitionItem rows created in this fixed order: BILLING_RECORDS, DEPOSITS, SERVICE_AGREEMENTS, METER_READS (all PENDING)"]
  - method: GET
    path: "/acquisitions/targets/{id}"
    description: "Get a target"
    roles: [AcquisitionAnalyst, EngineeringReviewer, Appraiser, MunicipalClerk, RegulatoryOfficer, Commissioner, TransitionManager, HRDirector, SystemAdmin]
    code: 200
    input: []
    output: AcquisitionTarget
    side_effects: []
  - method: GET
    path: "/acquisitions/targets"
    description: "List targets with pagination"
    roles: [AcquisitionAnalyst, EngineeringReviewer, Appraiser, MunicipalClerk, RegulatoryOfficer, Commissioner, TransitionManager, HRDirector, SystemAdmin]
    code: 200
    input: ["status?", "state_code?", "limit?", "offset?"]
    output: "AcquisitionTarget[]"
    side_effects: []
  - method: POST
    path: "/acquisitions/targets/{id}/close"
    description: "Close the transaction: CLOSING -> INTEGRATED"
    roles: [TransitionManager]
    code: 200
    input: []
    output: AcquisitionTarget
    side_effects: ["status -> INTEGRATED", "Increments AcquisitionTarget.version by 1"]

  # --- ConditionAssessment ---
  - method: POST
    path: "/acquisitions/targets/{id}/assessments"
    description: "Create a condition assessment in DRAFT"
    roles: [AcquisitionAnalyst]
    code: 201
    input: [notes]
    output: ConditionAssessment
    side_effects: ["created_by_user_id = X-User-ID", "revision_count = 0"]
  - method: GET
    path: "/acquisitions/targets/{id}/assessments"
    description: "List assessments of a target"
    roles: [AcquisitionAnalyst, EngineeringReviewer, Appraiser, MunicipalClerk, RegulatoryOfficer, Commissioner, TransitionManager, HRDirector, SystemAdmin]
    code: 200
    input: ["limit?", "offset?"]
    output: "ConditionAssessment[]"
    side_effects: []
  - method: GET
    path: "/acquisitions/assessments/{id}"
    description: "Get an assessment"
    roles: [AcquisitionAnalyst, EngineeringReviewer, Appraiser, MunicipalClerk, RegulatoryOfficer, Commissioner, TransitionManager, HRDirector, SystemAdmin]
    code: 200
    input: []
    output: ConditionAssessment
    side_effects: []
  - method: POST
    path: "/acquisitions/assessments/{id}/submit"
    description: "Submit a DRAFT assessment for engineering review"
    roles: [AcquisitionAnalyst]
    code: 200
    input: []
    output: ConditionAssessment
    side_effects: ["status -> SUBMITTED", "recompute planning/filing estimates"]
  - method: POST
    path: "/acquisitions/assessments/{id}/accept"
    description: "Accept a SUBMITTED assessment (segregation of duties: not the creator)"
    roles: [EngineeringReviewer]
    code: 200
    input: []
    output: ConditionAssessment
    side_effects: ["status -> ACCEPTED", "supersede previously ACCEPTED assessment", "if target in SCREENING: target SCREENING -> VALUATION"]
  - method: POST
    path: "/acquisitions/assessments/{id}/reject"
    description: "Reject a SUBMITTED assessment back to DRAFT (revision loop)"
    roles: [EngineeringReviewer]
    code: 200
    input: []
    output: ConditionAssessment
    side_effects: ["status -> DRAFT", "revision_count += 1"]

  # --- CapitalNeedItem ---
  - method: POST
    path: "/acquisitions/assessments/{id}/capital-items"
    description: "Add a capital need item to a DRAFT assessment"
    roles: [AcquisitionAnalyst]
    code: 201
    input: [category, horizon, description, cost_low_cents, cost_high_cents, crews_required]
    output: CapitalNeedItem
    side_effects: ["midpoint_estimate_cents computed", "recompute assessment estimates"]
  - method: GET
    path: "/acquisitions/assessments/{id}/capital-items"
    description: "List capital items of an assessment"
    roles: [AcquisitionAnalyst, EngineeringReviewer, Appraiser, MunicipalClerk, RegulatoryOfficer, Commissioner, TransitionManager, HRDirector, SystemAdmin]
    code: 200
    input: ["limit?", "offset?"]
    output: "CapitalNeedItem[]"
    side_effects: []
  - method: GET
    path: "/acquisitions/capital-items/{id}"
    description: "Get a capital item"
    roles: [AcquisitionAnalyst, EngineeringReviewer, Appraiser, MunicipalClerk, RegulatoryOfficer, Commissioner, TransitionManager, HRDirector, SystemAdmin]
    code: 200
    input: []
    output: CapitalNeedItem
    side_effects: []
  - method: POST
    path: "/acquisitions/capital-items/{id}/schedule"
    description: "Schedule a PLANNED item into an execution window"
    roles: [TransitionManager]
    code: 200
    input: [window_start, window_end]
    output: CapitalNeedItem
    side_effects: ["status -> SCHEDULED", "crew capacity validated"]
  - method: POST
    path: "/acquisitions/capital-items/{id}/execute"
    description: "Mark a SCHEDULED item executed"
    roles: [TransitionManager]
    code: 200
    input: []
    output: CapitalNeedItem
    side_effects: ["status -> EXECUTED"]
  - method: POST
    path: "/acquisitions/capital-items/{id}/split"
    description: "Split a PLANNED item into two child items conserving total cost bounds"
    roles: [AcquisitionAnalyst]
    code: 200
    input: [split_low_cents, split_high_cents]
    output: CapitalNeedItem
    side_effects: ["status -> SPLIT", "two child items created with conserved cost bounds"]
  - method: POST
    path: "/acquisitions/capital-items/{id}/cancel"
    description: "Cancel a PLANNED item"
    roles: [AcquisitionAnalyst]
    code: 200
    input: []
    output: CapitalNeedItem
    side_effects: ["status -> CANCELLED", "recompute assessment estimates"]

  # --- ValuationCase / ValuationEntry ---
  - method: POST
    path: "/acquisitions/targets/{id}/valuation-cases"
    description: "Open a valuation case for a target in VALUATION status (OCC-guarded; supersedes any prior OPEN case)"
    roles: [AcquisitionAnalyst]
    code: 201
    input: [expected_target_version]
    output: ValuationCase
    side_effects: ["status=OPEN", "any prior OPEN case -> SUPERSEDED with entries -> NOT_SELECTED", "Increments AcquisitionTarget.version by 1"]
  - method: GET
    path: "/acquisitions/targets/{id}/valuation-cases"
    description: "List valuation cases of a target"
    roles: [AcquisitionAnalyst, EngineeringReviewer, Appraiser, MunicipalClerk, RegulatoryOfficer, Commissioner, TransitionManager, HRDirector, SystemAdmin]
    code: 200
    input: ["limit?", "offset?"]
    output: "ValuationCase[]"
    side_effects: []
  - method: GET
    path: "/acquisitions/valuation-cases/{id}"
    description: "Get a valuation case"
    roles: [AcquisitionAnalyst, EngineeringReviewer, Appraiser, MunicipalClerk, RegulatoryOfficer, Commissioner, TransitionManager, HRDirector, SystemAdmin]
    code: 200
    input: []
    output: ValuationCase
    side_effects: []
  - method: POST
    path: "/acquisitions/valuation-cases/{id}/entries"
    description: "Submit an appraisal entry into an OPEN case"
    roles: [Appraiser]
    code: 201
    input: [method, value_cents, law_citation]
    output: ValuationEntry
    side_effects: ["appraiser_user_id = X-User-ID", "status=SUBMITTED"]
  - method: GET
    path: "/acquisitions/valuation-cases/{id}/entries"
    description: "List entries of a case"
    roles: [AcquisitionAnalyst, EngineeringReviewer, Appraiser, MunicipalClerk, RegulatoryOfficer, Commissioner, TransitionManager, HRDirector, SystemAdmin]
    code: 200
    input: ["limit?", "offset?"]
    output: "ValuationEntry[]"
    side_effects: []
  - method: POST
    path: "/acquisitions/valuation-cases/{id}/finalize"
    description: "Select one entry and finalize the case (segregation of duties vs appraisers)"
    roles: [AcquisitionAnalyst]
    code: 200
    input: [select_entry_id]
    output: ValuationCase
    side_effects: ["status -> FINALIZED", "selected entry -> SELECTED, others -> NOT_SELECTED", "target VALUATION -> MUNICIPAL_REVIEW"]

  # --- CouncilEvent ---
  - method: POST
    path: "/acquisitions/targets/{id}/council-events"
    description: "Schedule a public hearing, council vote, or referendum window"
    roles: [MunicipalClerk]
    code: 201
    input: [kind, scheduled_start, scheduled_end]
    output: CouncilEvent
    side_effects: ["status=SCHEDULED", "overlap + referendum-availability validated"]
  - method: GET
    path: "/acquisitions/targets/{id}/council-events"
    description: "List council events of a target"
    roles: [AcquisitionAnalyst, EngineeringReviewer, Appraiser, MunicipalClerk, RegulatoryOfficer, Commissioner, TransitionManager, HRDirector, SystemAdmin]
    code: 200
    input: ["kind?", "limit?", "offset?"]
    output: "CouncilEvent[]"
    side_effects: []
  - method: GET
    path: "/acquisitions/council-events/{id}"
    description: "Get a council event"
    roles: [AcquisitionAnalyst, EngineeringReviewer, Appraiser, MunicipalClerk, RegulatoryOfficer, Commissioner, TransitionManager, HRDirector, SystemAdmin]
    code: 200
    input: []
    output: CouncilEvent
    side_effects: []
  - method: POST
    path: "/acquisitions/council-events/{id}/record-outcome"
    description: "Record the outcome of a hearing (HELD) or vote/referendum (PASSED/FAILED per vote_outcome)"
    roles: [MunicipalClerk]
    code: 200
    input: ["yes_votes?", "no_votes?"]
    output: CouncilEvent
    side_effects: ["status -> HELD | PASSED | FAILED", "on council/referendum failure possibly trigger target REJECTED cascade", "on pass possibly set target.council_approved=true"]

  # --- RegulatoryApplication ---
  - method: POST
    path: "/acquisitions/targets/{id}/regulatory-applications"
    description: "Create and immediately file a regulatory application (requires council_approved)"
    roles: [RegulatoryOfficer]
    code: 201
    input: [purchase_price_cents, rate_base_method, "original_cost_less_depreciation_cents?"]
    output: RegulatoryApplication
    side_effects: ["status=FILED (via PREPARED)", "target MUNICIPAL_REVIEW -> REGULATORY_REVIEW", "Increments AcquisitionTarget.version by 1"]
  - method: GET
    path: "/acquisitions/targets/{id}/regulatory-applications"
    description: "List regulatory applications of a target"
    roles: [AcquisitionAnalyst, EngineeringReviewer, Appraiser, MunicipalClerk, RegulatoryOfficer, Commissioner, TransitionManager, HRDirector, SystemAdmin]
    code: 200
    input: ["limit?", "offset?"]
    output: "RegulatoryApplication[]"
    side_effects: []
  - method: GET
    path: "/acquisitions/regulatory-applications/{id}"
    description: "Get a regulatory application"
    roles: [AcquisitionAnalyst, EngineeringReviewer, Appraiser, MunicipalClerk, RegulatoryOfficer, Commissioner, TransitionManager, HRDirector, SystemAdmin]
    code: 200
    input: []
    output: RegulatoryApplication
    side_effects: []
  - method: POST
    path: "/acquisitions/regulatory-applications/{id}/decide"
    description: "Commission decides a FILED application"
    roles: [Commissioner]
    code: 200
    input: [outcome]
    output: RegulatoryApplication
    side_effects: ["status -> APPROVED | DENIED | REMANDED", "on APPROVED compute rate_base_admission and move target to CLOSING", "on DENIED trigger target REJECTED cascade"]
  - method: POST
    path: "/acquisitions/regulatory-applications/{id}/refile"
    description: "Refile a REMANDED application (OCC-guarded on target version)"
    roles: [RegulatoryOfficer]
    code: 200
    input: [expected_target_version, purchase_price_cents, rate_base_method, "original_cost_less_depreciation_cents?"]
    output: RegulatoryApplication
    side_effects: ["status -> FILED", "filing_round += 1", "Increments AcquisitionTarget.version by 1"]

  # --- CustomerAccount ---
  - method: POST
    path: "/acquisitions/targets/{id}/customer-accounts"
    description: "Register a legacy customer account to be transitioned"
    roles: [TransitionManager]
    code: 201
    input: [account_ref, deposit_cents, ar_balance_cents]
    output: CustomerAccount
    side_effects: ["status=LEGACY"]
  - method: GET
    path: "/acquisitions/targets/{id}/customer-accounts"
    description: "List customer accounts of a target"
    roles: [AcquisitionAnalyst, EngineeringReviewer, Appraiser, MunicipalClerk, RegulatoryOfficer, Commissioner, TransitionManager, HRDirector, SystemAdmin]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: "CustomerAccount[]"
    side_effects: []
  - method: GET
    path: "/acquisitions/customer-accounts/{id}"
    description: "Get a customer account"
    roles: [AcquisitionAnalyst, EngineeringReviewer, Appraiser, MunicipalClerk, RegulatoryOfficer, Commissioner, TransitionManager, HRDirector, SystemAdmin]
    code: 200
    input: []
    output: CustomerAccount
    side_effects: []
  - method: POST
    path: "/acquisitions/customer-accounts/{id}/migrate"
    description: "Migrate a LEGACY account (requires target CLOSING + BILLING_RECORDS transition DONE)"
    roles: [TransitionManager]
    code: 200
    input: []
    output: CustomerAccount
    side_effects: ["status -> MIGRATED", "deposit_settlement computed"]
  - method: POST
    path: "/acquisitions/customer-accounts/{id}/consolidate"
    description: "Consolidate a MIGRATED account onto the tariff (requires ADOPTED TariffCase)"
    roles: [TransitionManager]
    code: 200
    input: []
    output: CustomerAccount
    side_effects: ["status -> CONSOLIDATED"]
  - method: POST
    path: "/acquisitions/customer-accounts/{id}/orphan"
    description: "Orphan a fully settled LEGACY account (zero deposit and zero AR)"
    roles: [TransitionManager]
    code: 200
    input: []
    output: CustomerAccount
    side_effects: ["status -> ORPHANED"]

  # --- TransitionItem ---
  - method: GET
    path: "/acquisitions/targets/{id}/transition-items"
    description: "List transition items of a target"
    roles: [AcquisitionAnalyst, EngineeringReviewer, Appraiser, MunicipalClerk, RegulatoryOfficer, Commissioner, TransitionManager, HRDirector, SystemAdmin]
    code: 200
    input: ["limit?", "offset?"]
    output: "TransitionItem[]"
    side_effects: []
  - method: GET
    path: "/acquisitions/transition-items/{id}"
    description: "Get a transition item"
    roles: [AcquisitionAnalyst, EngineeringReviewer, Appraiser, MunicipalClerk, RegulatoryOfficer, Commissioner, TransitionManager, HRDirector, SystemAdmin]
    code: 200
    input: []
    output: TransitionItem
    side_effects: []
  - method: POST
    path: "/acquisitions/transition-items/{id}/resolve"
    description: "Mark a PENDING transition item DONE (target must be CLOSING; DEPOSITS additionally needs no LEGACY accounts)"
    roles: [TransitionManager]
    code: 200
    input: ["resolution_note?"]
    output: TransitionItem
    side_effects: ["status -> DONE"]

  # --- EmployeeTransition ---
  - method: POST
    path: "/acquisitions/targets/{id}/employee-transitions"
    description: "Register a municipal employee for transition"
    roles: [HRDirector]
    code: 201
    input: [employee_ref, years_of_service, weekly_salary_cents, union_covered]
    output: EmployeeTransition
    side_effects: ["status=PENDING"]
  - method: GET
    path: "/acquisitions/targets/{id}/employee-transitions"
    description: "List employee transitions of a target"
    roles: [AcquisitionAnalyst, EngineeringReviewer, Appraiser, MunicipalClerk, RegulatoryOfficer, Commissioner, TransitionManager, HRDirector, SystemAdmin]
    code: 200
    input: ["limit?", "offset?"]
    output: "EmployeeTransition[]"
    side_effects: []
  - method: GET
    path: "/acquisitions/employee-transitions/{id}"
    description: "Get an employee transition"
    roles: [AcquisitionAnalyst, EngineeringReviewer, Appraiser, MunicipalClerk, RegulatoryOfficer, Commissioner, TransitionManager, HRDirector, SystemAdmin]
    code: 200
    input: []
    output: EmployeeTransition
    side_effects: []
  - method: POST
    path: "/acquisitions/employee-transitions/{id}/offer-response"
    description: "Record offer response: ACCEPTED | DECLINED (non-union only; computes severance) | ASSUMED (union only)"
    roles: [HRDirector]
    code: 200
    input: [response]
    output: EmployeeTransition
    side_effects: ["status -> ACCEPTED | DECLINED | ASSUMED", "severance computed on DECLINED"]

  # --- TariffCase ---
  - method: POST
    path: "/acquisitions/targets/{id}/tariff-cases"
    description: "Create a tariff consolidation case (single-tariff vs stand-alone debate)"
    roles: [RegulatoryOfficer]
    code: 201
    input: [mode, representative_old_bill_cents, consolidated_monthly_bill_cents]
    output: TariffCase
    side_effects: ["status=DRAFT"]
  - method: GET
    path: "/acquisitions/targets/{id}/tariff-cases"
    description: "List tariff cases of a target"
    roles: [AcquisitionAnalyst, EngineeringReviewer, Appraiser, MunicipalClerk, RegulatoryOfficer, Commissioner, TransitionManager, HRDirector, SystemAdmin]
    code: 200
    input: ["limit?", "offset?"]
    output: "TariffCase[]"
    side_effects: []
  - method: GET
    path: "/acquisitions/tariff-cases/{id}"
    description: "Get a tariff case"
    roles: [AcquisitionAnalyst, EngineeringReviewer, Appraiser, MunicipalClerk, RegulatoryOfficer, Commissioner, TransitionManager, HRDirector, SystemAdmin]
    code: 200
    input: []
    output: TariffCase
    side_effects: []
  - method: POST
    path: "/acquisitions/tariff-cases/{id}/adopt"
    description: "Adopt a DRAFT tariff case (SINGLE_TARIFF requires APPROVED regulatory application)"
    roles: [RegulatoryOfficer]
    code: 200
    input: []
    output: TariffCase
    side_effects: ["status -> ADOPTED", "phase_in_years computed per phase_in_schedule"]

# =============================================================================
# Table 6: Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "Missing/blank X-User-Role or X-User-ID headers, or undeclared role" }
  - { id: ERR_UNAUTHORIZED, http: 403, condition: "Role not permitted for the endpoint" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Path resource id does not exist or child does not belong to parent" }
  - { id: ERR_SEGREGATION_OF_DUTY, http: 403, condition: "Actor created the assessment being accepted/rejected, or appraised an entry in the case being finalized" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Entity not in a state permitting the requested transition" }
  - { id: ERR_INVALID_REQUEST, http: 422, condition: "Malformed payload: missing required field, bad enum, non-positive money where positive required, cost_high < cost_low, votes missing for vote outcome" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_target_version does not match the target's current version (OCC)" }
  - { id: ERR_INVALID_WINDOW, http: 422, condition: "window_end/scheduled_end not strictly after start" }
  - { id: ERR_EVENT_OVERLAP, http: 409, condition: "CouncilEvent window overlaps another event of the same target under half-open semantics" }
  - { id: ERR_HEARING_NOTICE, http: 409, condition: "No HELD public hearing with scheduled_end at least 7 days before the logical clock for this target" }
  - { id: ERR_CREW_CAPACITY_EXCEEDED, http: 409, condition: "Concurrent crew demand would exceed MAX_CREWS_PER_TARGET (3) at some instant of the window" }
  - { id: ERR_METHOD_NOT_PERMITTED, http: 422, condition: "Valuation method not in the target's permitted_valuation_methods" }
  - { id: ERR_REFERENDUM_NOT_AVAILABLE, http: 409, condition: "REFERENDUM created without a prior FAILED council vote in the referendum band, or COUNCIL_VOTE created while a REFERENDUM is pending" }
  - { id: ERR_APPROVAL_PREREQ, http: 409, condition: "Council approval missing (regulatory filing) or regulatory approval missing (SINGLE_TARIFF adoption)" }
  - { id: ERR_TRANSITION_PREREQ, http: 409, condition: "BILLING_RECORDS transition item not DONE when migrating accounts" }
  - { id: ERR_ACCOUNTS_PENDING, http: 409, condition: "LEGACY customer accounts remain when resolving DEPOSITS or closing the target" }
  - { id: ERR_TRANSITION_INCOMPLETE, http: 409, condition: "Not all four TransitionItems DONE at close" }
  - { id: ERR_EMPLOYEES_PENDING, http: 409, condition: "PENDING EmployeeTransitions remain at close" }
  - { id: ERR_ACCOUNT_NOT_SETTLED, http: 409, condition: "Orphan requested with non-zero deposit or AR balance" }
  - { id: ERR_UNION_ASSUMPTION_REQUIRED, http: 409, condition: "Union-covered employee cannot DECLINE (must be ASSUMED); or ASSUMED attempted for non-union" }
  - { id: ERR_DUPLICATE, http: 409, condition: "account_ref already exists within target, or second ADOPTED TariffCase" }
  - { id: ERR_ASSESSMENT_EMPTY, http: 409, condition: "Submit attempted on an assessment with no non-SPLIT capital items" }
  - { id: ERR_INVALID_SPLIT, http: 422, condition: "Split amounts negative or exceeding parent bounds" }
  - { id: ERR_WINDOW_NOT_OPEN, http: 409, condition: "Execute attempted before window_start under the logical clock" }
  - { id: ERR_TARIFF_NOT_ADOPTED, http: 409, condition: "Consolidate attempted with no ADOPTED TariffCase for the target" }

# =============================================================================
# Table 7: RBAC Matrix
# =============================================================================
roles:
  - name: AcquisitionAnalyst
    description: "Utility-side deal analyst; creates targets, assessments, capital items, valuation cases; finalizes valuation cases"
    identity: opaque
    exclusive_operations:
      - "POST /acquisitions/targets"
      - "POST /acquisitions/targets/{id}/assessments"
      - "POST /acquisitions/assessments/{id}/submit"
      - "POST /acquisitions/assessments/{id}/capital-items"
      - "POST /acquisitions/capital-items/{id}/split"
      - "POST /acquisitions/capital-items/{id}/cancel"
      - "POST /acquisitions/targets/{id}/valuation-cases"
      - "POST /acquisitions/valuation-cases/{id}/finalize"
    shared_operations:
      - "GET endpoints (all roles)"
  - name: EngineeringReviewer
    description: "Independent engineering reviewer; accepts or rejects assessments (must not be the creator)"
    identity: opaque
    exclusive_operations:
      - "POST /acquisitions/assessments/{id}/accept"
      - "POST /acquisitions/assessments/{id}/reject"
    shared_operations:
      - "GET endpoints (all roles)"
  - name: Appraiser
    description: "Independent appraiser; submits valuation entries"
    identity: opaque
    exclusive_operations:
      - "POST /acquisitions/valuation-cases/{id}/entries"
    shared_operations:
      - "GET endpoints (all roles)"
  - name: MunicipalClerk
    description: "Municipality clerk; schedules council events and records outcomes"
    identity: opaque
    exclusive_operations:
      - "POST /acquisitions/targets/{id}/council-events"
      - "POST /acquisitions/council-events/{id}/record-outcome"
    shared_operations:
      - "GET endpoints (all roles)"
  - name: RegulatoryOfficer
    description: "Utility regulatory affairs; files and refiles commission applications, manages tariff cases"
    identity: opaque
    exclusive_operations:
      - "POST /acquisitions/targets/{id}/regulatory-applications"
      - "POST /acquisitions/regulatory-applications/{id}/refile"
      - "POST /acquisitions/targets/{id}/tariff-cases"
      - "POST /acquisitions/tariff-cases/{id}/adopt"
    shared_operations:
      - "GET endpoints (all roles)"
  - name: Commissioner
    description: "State utility commissioner; decides filed applications"
    identity: opaque
    exclusive_operations:
      - "POST /acquisitions/regulatory-applications/{id}/decide"
    shared_operations:
      - "GET endpoints (all roles)"
  - name: TransitionManager
    description: "Utility transition lead; schedules/executes capital items, migrates accounts, resolves transition items, closes targets"
    identity: opaque
    exclusive_operations:
      - "POST /acquisitions/capital-items/{id}/schedule"
      - "POST /acquisitions/capital-items/{id}/execute"
      - "POST /acquisitions/targets/{id}/customer-accounts"
      - "POST /acquisitions/customer-accounts/{id}/migrate"
      - "POST /acquisitions/customer-accounts/{id}/consolidate"
      - "POST /acquisitions/customer-accounts/{id}/orphan"
      - "POST /acquisitions/transition-items/{id}/resolve"
      - "POST /acquisitions/targets/{id}/close"
    shared_operations:
      - "GET endpoints (all roles)"
  - name: HRDirector
    description: "Utility HR director; manages employee transitions and offer responses"
    identity: opaque
    exclusive_operations:
      - "POST /acquisitions/targets/{id}/employee-transitions"
      - "POST /acquisitions/employee-transitions/{id}/offer-response"
    shared_operations:
      - "GET endpoints (all roles)"
  - name: SystemAdmin
    description: "Operator; controls the logical clock"
    identity: opaque
    exclusive_operations:
      - "POST /_clock/set_current_utc"
    shared_operations:
      - "GET endpoints (all roles)"
