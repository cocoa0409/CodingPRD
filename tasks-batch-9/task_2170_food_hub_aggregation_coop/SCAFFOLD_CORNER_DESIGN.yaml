        as_user_id: ${p1_id}
        captures:
          p1_hac: $.data.id
      - call: POST /producers/${p1_id}/application
        payload: {}
        as: Producer
        as_user_id: ${p1_id}
      - call: POST /producer-documents/${p1_gap}/adjudication
        payload:
          decision: VERIFY
        as: ComplianceOfficer
        as_user_id: co-verify-1
      - call: POST /producer-documents/${p1_ins}/adjudication
