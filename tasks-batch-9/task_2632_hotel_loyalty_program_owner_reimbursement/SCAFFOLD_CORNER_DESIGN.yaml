      - name: missing_or_unknown_identity_headers_are_rejected_before_anything_else
        claim_type: exclusive_operations
        grounds:
          - errors.ERR_UNAUTHENTICATED
          - validations.priority_1_ERR_UNAUTHENTICATED
        distinguishing_aspect: |
          Authentication is priority 1, so it outranks even the 404s: a request for a member that
          does not exist, sent with no headers at all, answers 401 rather than 404. A recognised role
          with no X-User-ID and an X-User-Role that is not one of the five declared roles both fail
          the same way, so the header pair is validated as a unit.
        test_recipe:
          setup:
            - "One member exists so that the identifier in the last call is real."
          setup_api_calls:
            - call: "POST /loyalty/members"
              payload: { email: "au1@example.com", full_name: "Elif Yildiz", enrollment_date: "2026-02-12" }
              as: ProgramAdministrator
              captures: { m_id: $.data.id }
          trigger:
            - call: "GET /loyalty/members/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: unauthenticated
              captures: { e_no_headers: $.data.error_id }
            - call: "POST /loyalty/hotels"
              payload: { name: "Ghost Hotel", brand_code: "GHT", market_tier: "URBAN", program_fee_pct: 0.05, rooms_count: 10, trailing_12m_occupancy_pct: 0.5, trailing_12m_adr_cents: 9000 }
              as: unauthenticated
              captures: { e_unknown_role: $.data.error_id }
            - call: "GET /loyalty/members/${m_id}"
              payload: {}
              as: unauthenticated
              captures: { e_no_user_id: $.data.error_id }
          assert:
            - "call 1 is sent with neither X-User-Role nor X-User-ID and returns ${e_no_headers} == ERR_UNAUTHENTICATED with http 401 - not ERR_MEMBER_NOT_FOUND, because priority 1 precedes priority 12"
            - "call 2 is sent with X-User-Role: SuperAdmin and a plausible X-User-ID, and returns ${e_unknown_role} == ERR_UNAUTHENTICATED with http 401 - an undeclared role is not authenticated rather than merely unauthorized"
            - "call 3 is sent with X-User-Role: ProgramAdministrator but no X-User-ID and returns ${e_no_user_id} == ERR_UNAUTHENTICATED with http 401 - even opaque roles must carry an operator id, because segregation of duties depends on it"
            - "GET /loyalty/hotels returns total_count == 0 - the unauthenticated create wrote nothing"
            - "all three responses carry response_type == error with only error_id and message under data"

  # ===========================================================================
  - section: cross-cutting complexity layers
    instances:
      - name: award_booking_refuses_a_stale_hotel_version_and_accepts_the_refreshed_one
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules.redemption-create-stale-hotel
          - validations.priority_30_ERR_STALE_HOTEL_VERSION
          - endpoints.POST_/loyalty/redemptions
        distinguishing_aspect: |
          This is the §1.2.1 rule for the Hotel row: expected_hotel_version guards award booking
          because the same row carries the award allotment, the blackout day count and the delinquency
          posture. A performance refresh between the agent's read and the booking invalidates the version
          the member was handed, the booking is refused at 412 without touching points or inventory, and re-reading the
          row makes exactly the same booking succeed.
        test_recipe:
          setup:
            - "One ACTIVE property with a STANDARD award pricing row (20000 points per night, allotment 1) and a member funded with 40000 points."
          setup_api_calls:
            - call: "POST /loyalty/hotels"
              payload: { name: "Versionlock Hotel", brand_code: "VLH", market_tier: "URBAN", program_fee_pct: 0.05, rooms_count: 100, trailing_12m_occupancy_pct: 0.82, trailing_12m_adr_cents: 30000 }
              as: ProgramAdministrator
              captures: { h_id: $.data.id, h_v1: $.data.version }
            - call: "POST /loyalty/hotels/${h_id}/rate-plans"
              payload: { rate_code: "BAR", rate_category: "TRANSIENT" }
              as: ProgramAdministrator
              captures: { rp_id: $.data.id }
            - call: "POST /loyalty/hotels/${h_id}/activate"
              payload: {}
              as: ProgramAdministrator
              captures: { h_v2: $.data.version }
            - call: "POST /loyalty/hotels/${h_id}/redemption-pricing"
              payload: { season: "STANDARD", window_start_date: "2026-09-01", window_end_date: "2026-09-30", points_per_night: 20000, cash_copay_cents: 0, min_tier_required: "BASE", award_allotment_per_night: 1 }
              as: ProgramAdministrator
              captures: { pr_id: $.data.id }
            - call: "POST /loyalty/members"
              payload: { email: "vl1@example.com", full_name: "Sanne de Vries", enrollment_date: "2026-02-16" }
              as: ProgramAdministrator
              captures: { m_id: $.data.id }
            - call: "POST /loyalty/point-purchases"
              payload: { member_id: "${m_id}", channel: "DIRECT_PURCHASE", points_quantity: 40000 }
              as: ProgramAdministrator
              captures: { pp_id: $.data.id }
            - call: "POST /loyalty/point-purchases/${pp_id}/settle"
              payload: {}
              as: ProgramAdministrator
          trigger:
            - call: "GET /loyalty/hotels/${h_id}"
              payload: {}
              as: MemberCareAgent
              as_user_id: "care-vl-01"
              captures: { h_read: $.data.version }
            - call: "POST /loyalty/hotels/${h_id}/performance-refresh"
              payload: { trailing_12m_occupancy_pct: 0.91, trailing_12m_adr_cents: 34000 }
              as: HotelOwner
              as_user_id: "${h_id}"
              captures: { h_after_refresh: $.data.version, h_occ: $.data.trailing_12m_occupancy_pct }
            - call: "POST /loyalty/redemptions"
              payload: { member_id: "${m_id}", hotel_id: "${h_id}", checkin_date: "2026-09-10", checkout_date: "2026-09-12", expected_hotel_version: "${h_read}" }
              as: Member
              as_user_id: "${m_id}"
              captures: { e_stale: $.data.error_id }
            - call: "GET /loyalty/hotels/${h_id}"
              payload: {}
              as: MemberCareAgent
              as_user_id: "care-vl-01"
              captures: { h_reread: $.data.version }
            - call: "POST /loyalty/redemptions"
              payload: { member_id: "${m_id}", hotel_id: "${h_id}", checkin_date: "2026-09-10", checkout_date: "2026-09-12", expected_hotel_version: "${h_reread}" }
              as: Member
              as_user_id: "${m_id}"
              captures: { r_id: $.data.id, r_charged: $.data.points_charged, r_allot: $.data.award_allotment_applied }
            - call: "GET /loyalty/hotels/${h_id}"
              payload: {}
              as: ProgramAdministrator
              captures: { h_final: $.data.version }
          assert:
            - "${h_v1} == 1, ${h_v2} == 2 and ${h_read} == 2 - activation is a write and bumps the row"
            - "${h_after_refresh} == 3 and ${h_occ} == 0.91 - the refresh is the write that invalidates the version read a moment earlier"
            - "${e_stale} == ERR_STALE_HOTEL_VERSION with http 412 - the booking carried version 2 while the row was already at 3"
            - "Member.${m_id}.point_balance is still 40000 after the refusal and GET /loyalty/redemptions returns total_count == 0 - a stale write consumes neither points nor allotment"
            - "${h_reread} == 3 and the retry succeeds with ${r_charged} == 40000 and ${r_allot} == 1"
            - "${h_final} > 3 - consuming the last award room is itself a write on the Hotel row, so the version moves again"

      - name: goodwill_adjustment_refuses_a_stale_member_version_after_its_own_first_write
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules.point-adjustment-stale-member
          - validations.priority_31_ERR_STALE_MEMBER_VERSION
          - endpoints.POST_/loyalty/point-adjustments
        distinguishing_aspect: |
          This is the §1.2.1 rule for the Member row, and the interesting part is that the guarded
          endpoint is its own invalidator: a first successful adjustment bumps the member, so replaying
          the very same payload - identical points, identical reason, identical version - is refused at
          412 rather than double-crediting. That is what makes the OCC token, not the payload, the
          thing that stops the duplicate.
        test_recipe:
          setup:
            - "One member with a settled 20000-point purchase, which leaves the fund HEALTHY so goodwill is permitted."
          setup_api_calls:
            - call: "POST /loyalty/members"
              payload: { email: "mv1@example.com", full_name: "Rafael Duarte", enrollment_date: "2026-02-18" }
              as: ProgramAdministrator
              captures: { m_id: $.data.id }
            - call: "POST /loyalty/point-purchases"
              payload: { member_id: "${m_id}", channel: "DIRECT_PURCHASE", points_quantity: 20000 }
              as: ProgramAdministrator
              captures: { pp_id: $.data.id }
            - call: "POST /loyalty/point-purchases/${pp_id}/settle"
              payload: {}
              as: ProgramAdministrator
          trigger:
            - call: "GET /loyalty/members/${m_id}"
              payload: {}
              as: MemberCareAgent
              as_user_id: "care-mv-01"
              captures: { m_v_read: $.data.version, m_bal0: $.data.point_balance }
            - call: "POST /loyalty/point-adjustments"
              payload: { member_id: "${m_id}", points: 500, adjustment_reason: "Goodwill for a long check-in queue.", expected_member_version: "${m_v_read}" }
              as: MemberCareAgent
              as_user_id: "care-mv-01"
              captures: { adj1_id: $.data.id, adj1_points: $.data.points }
            - call: "POST /loyalty/point-adjustments"
              payload: { member_id: "${m_id}", points: 500, adjustment_reason: "Goodwill for a long check-in queue.", expected_member_version: "${m_v_read}" }
              as: MemberCareAgent
              as_user_id: "care-mv-01"
              captures: { e_stale: $.data.error_id }
            - call: "GET /loyalty/members/${m_id}"
              payload: {}
              as: MemberCareAgent
              as_user_id: "care-mv-01"
              captures: { m_v_reread: $.data.version, m_bal1: $.data.point_balance }
            - call: "POST /loyalty/point-adjustments"
              payload: { member_id: "${m_id}", points: -200, adjustment_reason: "Correcting an over-grant.", expected_member_version: "${m_v_reread}" }
              as: ProgramAdministrator
              captures: { adj2_id: $.data.id, adj2_points: $.data.points }
            - call: "GET /loyalty/members/${m_id}"
              payload: {}
              as: ProgramAdministrator
              captures: { m_v_final: $.data.version, m_bal2: $.data.point_balance }
          assert:
            - "${m_bal0} == 20000 and ${adj1_points} == 500 - the first adjustment carried the current version and applied"
            - "${e_stale} == ERR_STALE_MEMBER_VERSION with http 412 - the replay is refused even though every other field is legal"
            - "${m_v_reread} == ${m_v_read} + 1 and ${m_bal1} == 20500 - exactly one grant landed, so the refused replay wrote nothing"
            - "GET /loyalty/point-ledger-entries?member_id=${m_id}&entry_type=GOODWILL has total_count == 1 at this point"
            - "${adj2_points} == -200 and ${m_bal2} == 20300 - a negative adjustment is legal, and it needed the freshly read version"
            - "${m_v_final} == ${m_v_reread} + 1 - every accepted adjustment increments the member's version exactly once"

      - name: fee_ledger_at_exactly_the_threshold_stays_active_and_one_cent_more_does_not
        claim_type: rate_threshold_triggers
        grounds:
          - state_machines.Hotel.ACTIVE_to_FEE_DELINQUENT
          - calculations.program_fee_assessment
          - complexity_profile.complexity_layers.rate_threshold_triggers
        distinguishing_aspect: |
          The delinquency trigger is a strict greater-than on a cumulative balance, so a ledger of
          exactly 250000 cents leaves the property ACTIVE and a single further cent flips it. The
          trigger is evaluated at the end of both posting and adjustment, and it is one-directional:
          adjusting the balance back down to the threshold does not restore ACTIVE, because only a
          paid reimbursement batch can do that.
        test_recipe:
          setup:
            - "One ACTIVE property with program_fee_pct 0.05 and a TRANSIENT rate plan, and one member."
          setup_api_calls:
            - call: "POST /loyalty/hotels"
              payload: { name: "Threshold Grand", brand_code: "THG", market_tier: "URBAN", program_fee_pct: 0.05, rooms_count: 300, trailing_12m_occupancy_pct: 0.85, trailing_12m_adr_cents: 50000 }
              as: ProgramAdministrator
              captures: { h_id: $.data.id }
            - call: "POST /loyalty/hotels/${h_id}/rate-plans"
              payload: { rate_code: "BAR", rate_category: "TRANSIENT" }
              as: ProgramAdministrator
              captures: { rp_id: $.data.id }
            - call: "POST /loyalty/hotels/${h_id}/activate"
              payload: {}
              as: ProgramAdministrator
            - call: "POST /loyalty/members"
              payload: { email: "th1@example.com", full_name: "Camille Roux", enrollment_date: "2026-02-20" }
              as: ProgramAdministrator
              captures: { m_id: $.data.id }
            - call: "POST /loyalty/stays"
              payload: { member_id: "${m_id}", hotel_id: "${h_id}", rate_plan_id: "${rp_id}", checkin_date: "2026-06-01", checkout_date: "2026-06-02", room_revenue_cents: 5000000 }
              as: HotelOwner
              as_user_id: "${h_id}"
              captures: { s1_id: $.data.id }
            - call: "POST /loyalty/stays"
              payload: { member_id: "${m_id}", hotel_id: "${h_id}", rate_plan_id: "${rp_id}", checkin_date: "2026-06-10", checkout_date: "2026-06-11", room_revenue_cents: 20 }
              as: HotelOwner
              as_user_id: "${h_id}"
              captures: { s2_id: $.data.id }
          trigger:
            - call: "POST /loyalty/stays/${s1_id}/post"
              payload: {}
              as: HotelOwner
              as_user_id: "${h_id}"
              captures: { s1_fee: $.data.program_fee_assessed_cents }
            - call: "GET /loyalty/hotels/${h_id}"
              payload: {}
              as: ProgramAdministrator
              captures: { h_ledger_at: $.data.fee_ledger_balance_cents, h_status_at: $.data.status }
            - call: "POST /loyalty/stays/${s2_id}/post"
              payload: {}
              as: HotelOwner
              as_user_id: "${h_id}"
              captures: { s2_fee: $.data.program_fee_assessed_cents }
            - call: "GET /loyalty/hotels/${h_id}"
              payload: {}
              as: ProgramAdministrator
              captures: { h_ledger_over: $.data.fee_ledger_balance_cents, h_status_over: $.data.status }
            - call: "POST /loyalty/stays/${s2_id}/dispute"
              payload: { dispute_reason: "Rate loaded with a stray cent." }
              as: Member
              as_user_id: "${m_id}"
              captures: { s2_status: $.data.status }
            - call: "POST /loyalty/stays/${s2_id}/adjust"
              payload: { room_revenue_cents: 0 }
              as: ProgramAdministrator
              captures: { s2_fee_adj: $.data.program_fee_assessed_cents, s2_status2: $.data.status }
            - call: "GET /loyalty/hotels/${h_id}"
              payload: {}
              as: ProgramAdministrator
              captures: { h_ledger_back: $.data.fee_ledger_balance_cents, h_status_back: $.data.status }
          assert:
            - "${s1_fee} == 250000 - round_half_up(5000000 * 0.05) - and ${h_ledger_at} == 250000 with ${h_status_at} == ACTIVE, because the trigger is a strict >"
            - "${s2_fee} == 1 - round_half_up(20 * 0.05) rounds a half cent up - and ${h_ledger_over} == 250001 with ${h_status_over} == FEE_DELINQUENT"
            - "${s2_status} == DISPUTED and ${s2_status2} == ADJUSTED with ${s2_fee_adj} == 0 - the adjustment path also re-evaluates the trigger"
            - "${h_ledger_back} == 250000 but ${h_status_back} is still FEE_DELINQUENT - falling back to the threshold does not restore the posture; only a paid batch that drives the ledger to zero or below does"
            - "the property can still take stays and reimbursement batches while FEE_DELINQUENT; only PEAK award inventory is withdrawn"
            - "Member.${m_id}.point_balance == 500000 - floor(5000000 * 10 / 100) from the first stay, and the adjusted stay now earns nothing"

      - name: hotel_fee_ledger_reconciles_after_create_adjust_and_void_of_its_sources
        claim_type: derived_field_reconciliation
        grounds:
          - calculations.program_fee_assessment
          - entities.Hotel.fee_ledger_balance_cents
          - complexity_profile.complexity_layers.derived_field_reconciliation
        distinguishing_aspect: |
          The property's ledger is a derived sum over its own stays, and it is re-derived at three
          different life events: after each posting, after a disputed stay is restated at a new
          revenue figure, and after another stay is voided out of the population entirely. Because the
          sum is over already-rounded per-stay figures, the restatement changes 617 into 1235 rather
          than re-rounding a new total.
        test_recipe:
          setup:
            - "One ACTIVE property with program_fee_pct 0.05 and a TRANSIENT rate plan, and one member."
          setup_api_calls:
            - call: "POST /loyalty/hotels"
              payload: { name: "Reconcile House", brand_code: "RCH", market_tier: "SELECT", program_fee_pct: 0.05, rooms_count: 45, trailing_12m_occupancy_pct: 0.66, trailing_12m_adr_cents: 13000 }
              as: ProgramAdministrator
              captures: { h_id: $.data.id }
            - call: "POST /loyalty/hotels/${h_id}/rate-plans"
              payload: { rate_code: "BAR", rate_category: "TRANSIENT" }
              as: ProgramAdministrator
              captures: { rp_id: $.data.id }
            - call: "POST /loyalty/hotels/${h_id}/activate"
              payload: {}
              as: ProgramAdministrator
              captures: { h_v_active: $.data.version }
            - call: "POST /loyalty/members"
              payload: { email: "rc1@example.com", full_name: "Bea Lindqvist", enrollment_date: "2026-02-22" }
              as: ProgramAdministrator
              captures: { m_id: $.data.id }
            - call: "POST /loyalty/stays"
              payload: { member_id: "${m_id}", hotel_id: "${h_id}", rate_plan_id: "${rp_id}", checkin_date: "2026-05-01", checkout_date: "2026-05-03", room_revenue_cents: 12345 }
              as: ProgramAdministrator
              captures: { s1_id: $.data.id }
            - call: "POST /loyalty/stays"
              payload: { member_id: "${m_id}", hotel_id: "${h_id}", rate_plan_id: "${rp_id}", checkin_date: "2026-05-10", checkout_date: "2026-05-13", room_revenue_cents: 20000 }
              as: ProgramAdministrator
              captures: { s2_id: $.data.id }
          trigger:
            - call: "POST /loyalty/stays/${s1_id}/post"
              payload: {}
              as: ProgramAdministrator
              captures: { s1_fee: $.data.program_fee_assessed_cents, s1_base: $.data.base_points_awarded }
            - call: "POST /loyalty/stays/${s2_id}/post"
              payload: {}
              as: ProgramAdministrator
              captures: { s2_fee: $.data.program_fee_assessed_cents, s2_base: $.data.base_points_awarded }
            - call: "GET /loyalty/hotels/${h_id}"
              payload: {}
              as: HotelOwner
              as_user_id: "${h_id}"
              captures: { led_after_post: $.data.fee_ledger_balance_cents, v_after_post: $.data.version }
            - call: "POST /loyalty/stays/${s1_id}/dispute"
              payload: { dispute_reason: "Guest challenged the room rate." }
              as: MemberCareAgent
              as_user_id: "care-rc-01"
              captures: { s1_disputed: $.data.status }
            - call: "GET /loyalty/hotels/${h_id}"
              payload: {}
              as: HotelOwner
              as_user_id: "${h_id}"
              captures: { led_after_dispute: $.data.fee_ledger_balance_cents }
            - call: "POST /loyalty/stays/${s1_id}/adjust"
              payload: { room_revenue_cents: 24690 }
              as: ProgramAdministrator
              captures: { s1_fee2: $.data.program_fee_assessed_cents, s1_base2: $.data.base_points_awarded, s1_adjusted: $.data.status }
            - call: "GET /loyalty/hotels/${h_id}"
              payload: {}
              as: HotelOwner
              as_user_id: "${h_id}"
              captures: { led_after_adjust: $.data.fee_ledger_balance_cents }
            - call: "POST /loyalty/stays/${s2_id}/void"
              payload: { void_reason: "Duplicate folio." }
              as: ProgramAdministrator
              captures: { s2_void: $.data.status }
            - call: "GET /loyalty/hotels/${h_id}"
              payload: {}
              as: HotelOwner
              as_user_id: "${h_id}"
              captures: { led_after_void: $.data.fee_ledger_balance_cents, v_after_void: $.data.version }
          assert:
            - "${s1_fee} == 617 - round_half_up(12345 * 0.05) rounds 617.25 down to 617 - and ${s1_base} == 1234, the floor of 1234.5"
            - "${s2_fee} == 1000 and ${s2_base} == 2000, so ${led_after_post} == 1617 - the sum of the two already-rounded figures"
            - "${s1_disputed} == DISPUTED and ${led_after_dispute} == 1617 - a disputed stay stays in the population, so nothing moves"
            - "${s1_fee2} == 1235 - round_half_up(24690 * 0.05) rounds 1234.5 up - ${s1_base2} == 2469 and ${s1_adjusted} == ADJUSTED"
            - "${led_after_adjust} == 2235 (1235 + 1000) - the restated per-stay figure replaces the old one before the sum, never after"
            - "${s2_void} == VOID and ${led_after_void} == 1235 - the voided stay leaves the population entirely"
            - "Member.${m_id}.point_balance == 2469 and qualifying_nights_ytd == 2 afterwards - the void reversed stay two's 2000 points and 3 nights"
            - "${v_after_void} > ${v_after_post} > ${h_v_active} - every re-derivation of the ledger is a write on the Hotel row"

      - name: stay_void_cascade_layer
        excluded_because:
          difficulty_instance: stay_void_reverses_ledger_then_drops_tier_then_waives_benefit_obligations
          rationale: |
            The cascading_side_effects layer is instantiated three times in §1.8 - the stay void with
            its five ordered hops, the hotel termination that rejects a batch and then voids the rows
            that batch was holding, and the purchase refund that returns cash, partner volume and the
            annual cap together. Those already prove end-to-end ordering and partial-failure handling,
            so §1.9 adds no fourth cascade and instead reuses the void only as a precondition in the
            adjudication and delivery-state instances above.
      - name: reimbursement_dual_variant_layer
        excluded_because:
          difficulty_instance: owner_reimbursement_accrual_estimate_vs_settlement_actual
          rationale: |
            The dual_variant_calculation layer is instantiated twice in §1.8: the reimbursement
            estimate computed from live hotel figures at accrual versus the settlement computed from
            the figures snapshotted at release, and the elite bonus multiplier read at posting versus
            at adjustment. Both prove the delta on switch, which is the whole content of the layer, so
            a corner instance would only re-run one variant with different literals.

  # ===========================================================================
  - section: consistency model
    instances:
      - name: one_posting_is_already_visible_in_every_derived_read_that_follows_it
        claim_type: immediate
        grounds:
          - complexity_profile.consistency_model
          - calculations.point_liability_valuation
          - endpoints.GET_/loyalty/program-fund
        distinguishing_aspect: |
          The declared consistency model is immediate, and this instance pins what that costs the
          implementation: a single stay posting has to land in four different derived reads - the
          member's balance and night count, the property's fee ledger, the program-wide liability and
          solvency figures, and the ledger-entry list - by the time the very next request is served.
          There is no settlement job, no revalue step to publish a pending figure, and no read that is
          allowed to be one write behind. Re-reading the fund without an intervening write returns
          byte-identical figures, so the read is a pure projection rather than a state advance.
        test_recipe:
          setup:
            - "One ACTIVE property with program_fee_pct 0.05 and a TRANSIENT rate plan, one member with a settled 20000-point direct purchase, and one recorded 2-night stay not yet posted."
          setup_api_calls:
            - call: "POST /loyalty/hotels"
              payload: { name: "Immediate Inn", brand_code: "IMI", market_tier: "SELECT", program_fee_pct: 0.05, rooms_count: 60, trailing_12m_occupancy_pct: 0.7, trailing_12m_adr_cents: 15000 }
              as: ProgramAdministrator
              captures: { h_id: $.data.id }
            - call: "POST /loyalty/hotels/${h_id}/rate-plans"
              payload: { rate_code: "BAR", rate_category: "TRANSIENT" }
              as: ProgramAdministrator
              captures: { rp_id: $.data.id }
            - call: "POST /loyalty/hotels/${h_id}/activate"
              payload: {}
              as: ProgramAdministrator
            - call: "POST /loyalty/members"
              payload: { email: "im1@example.com", full_name: "Tomas Neruda", enrollment_date: "2026-02-24" }
              as: ProgramAdministrator
              captures: { m_id: $.data.id }
            - call: "POST /loyalty/point-purchases"
              payload: { member_id: "${m_id}", channel: "DIRECT_PURCHASE", points_quantity: 20000 }
              as: ProgramAdministrator
              captures: { pp_id: $.data.id }
            - call: "POST /loyalty/point-purchases/${pp_id}/settle"
              payload: {}
              as: ProgramAdministrator
              captures: { pp_cash: $.data.cash_due_cents }
            - call: "POST /loyalty/stays"
              payload: { member_id: "${m_id}", hotel_id: "${h_id}", rate_plan_id: "${rp_id}", checkin_date: "2026-04-01", checkout_date: "2026-04-03", room_revenue_cents: 12345 }
              as: HotelOwner
              as_user_id: "${h_id}"
              captures: { s_id: $.data.id, s_state: $.data.status }
          trigger:
            - call: "GET /loyalty/program-fund"
              payload: {}
              as: ProgramAuditor
              captures: { f0_cash: $.data.cash_balance_cents, f0_liab: $.data.point_liability_cents, f0_ratio: $.data.solvency_ratio, f0_status: $.data.status }
            - call: "POST /loyalty/stays/${s_id}/post"
              payload: {}
              as: HotelOwner
              as_user_id: "${h_id}"
              captures: { s_base: $.data.base_points_awarded, s_fee: $.data.program_fee_assessed_cents }
            - call: "GET /loyalty/members/${m_id}"
              payload: {}
              as: Member
              as_user_id: "${m_id}"
              captures: { m_bal: $.data.point_balance, m_nights: $.data.qualifying_nights_ytd, m_tier: $.data.elite_tier }
            - call: "GET /loyalty/hotels/${h_id}"
              payload: {}
              as: HotelOwner
              as_user_id: "${h_id}"
              captures: { h_ledger: $.data.fee_ledger_balance_cents, h_status: $.data.status }
            - call: "GET /loyalty/program-fund"
              payload: {}
              as: ProgramAuditor
              captures: { f1_cash: $.data.cash_balance_cents, f1_liab: $.data.point_liability_cents, f1_ratio: $.data.solvency_ratio, f1_status: $.data.status }
            - call: "GET /loyalty/point-ledger-entries"
              payload: { member_id: "${m_id}" }
              as: Member
              as_user_id: "${m_id}"
              captures: { led_page: $.data }
            - call: "GET /loyalty/program-fund"
              payload: {}
              as: ProgramAdministrator
              captures: { f2_cash: $.data.cash_balance_cents, f2_liab: $.data.point_liability_cents, f2_ratio: $.data.solvency_ratio, f2_status: $.data.status }
          assert:
            - "${s_state} == PENDING_POSTING before the posting and ${pp_cash} == 25000 - 20 thousand points at the 1250-cent direct list price with no volume discount"
            - "${f0_cash} == 25000, ${f0_liab} == 9600 - round_half_up(20000 * 600 / 1000 * 0.8) - ${f0_ratio} == 2.6042 and ${f0_status} == HEALTHY"
            - "${s_base} == 1234 and ${s_fee} == 617 in the posting response itself"
            - "${m_bal} == 21234, ${m_nights} == 2 and ${m_tier} == BASE in the immediately following read - no second request was needed to make the earn visible"
            - "${h_ledger} == 617 and ${h_status} == ACTIVE in the read after that - the property's derived ledger moved on the same request that posted the stay"
            - "${f1_cash} == 25000 (a posting moves no cash), ${f1_liab} == 10192 - round_half_up(21234 * 0.48) - ${f1_ratio} == 2.4529 and ${f1_status} == HEALTHY"
            - "${led_page}.total_count == 2 and the two rows are the purchase credit of 20000 and the stay earn of 1234 - the list projection is current too"
            - "${f2_cash} == ${f1_cash}, ${f2_liab} == ${f1_liab}, ${f2_ratio} == ${f1_ratio} and ${f2_status} == ${f1_status} - reading the fund again with no write in between returns the identical figures"
            - "no POST /loyalty/program-fund/revalue was issued anywhere in this recipe; the revalue endpoint re-derives the same numbers on demand and is never a prerequisite for a read to be correct"
