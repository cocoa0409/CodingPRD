              as_user_id: "mgr-1"
          trigger:
            - call: "GET /inventory-lots?shipment_id=${sid}"
              payload: {}
              as: InventoryAuditor
              as_user_id: "aud-1"
              captures: { lot0: "$.data[0].id" }
          assert:
            - "response_type == array"
            - "total_count == 1"

  # ===========================================================================
  - section: cross_cutting_complexity_layers
    instances:
      - name: occ_stale_product_version_on_receive
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[receive-stale-product]", "errors[ERR_STALE_PRODUCT_VERSION]", endpoints]
        distinguishing_aspect: "Client reads product version, a price-plan create bumps it, then a receive carrying the now-stale version is rejected 412 ERR_STALE_PRODUCT_VERSION."
        test_recipe:
          setup: ["A product (version v1) with a RECEIVING shipment line on it; a price-plan create advances product version to v2 before the receive."]
          setup_api_calls:
            - call: "POST /_clock/advance"
              payload: { to_iso8601: "2026-06-05T00:00:00Z" }
              as: StoreManager
              as_user_id: "mgr-1"
            - call: "POST /departments"
              payload: { code: "GROCERY", name: "Grocery" }
              as: StoreManager
              as_user_id: "mgr-1"
              captures: { dept_id: $.data.id }
            - call: "POST /products"
              payload: { department_id: "${dept_id}", name: "OCC", sku: "SKU-OCC", sell_by_weight: false, unit_price_cents: 100, reorder_point_qty: 0 }
              as: PriceManager
              as_user_id: "pm-1"
              captures: { pid: $.data.id, pv1: $.data.version }
            - call: "POST /shipments"
              payload: { vendor_name: "V", reference_code: "REF-OCC", expected_total_cents: 500 }
              as: ReceivingClerk
              as_user_id: "rc-1"
              captures: { sid: $.data.id }
            - call: "POST /shipments/${sid}/lines"
              payload: { product_id: "${pid}", ordered_qty: 5, accepted_qty: 5, unit_cost_cents: 100 }
              as: ReceivingClerk
              as_user_id: "rc-1"
            - call: "POST /shipments/${sid}/start-receiving"
              payload: {}
              as: ReceivingClerk
              as_user_id: "rc-1"
            - call: "POST /price-plans"
              payload: { product_id: "${pid}", ad_price_cents: 90, effective_start: "2026-06-01T00:00:00Z", effective_end: "2026-06-30T00:00:00Z", expected_product_version: "${pv1}" }
              as: PriceManager
              as_user_id: "pm-1"
          trigger:
            - call: "POST /shipments/${sid}/receive"
              payload: { expected_product_version: "${pv1}", override_variance: true }
              as: StoreManager
              as_user_id: "mgr-1"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 412"
            - "data.error_id == ERR_STALE_PRODUCT_VERSION"

      - name: occ_correct_product_version_on_priceplan_succeeds
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[price-plan-create-stale-product]", entities.PricePlan, endpoints]
        distinguishing_aspect: "A price-plan create carrying the current product version succeeds (201) and increments Product.version by 1."
        test_recipe:
          setup: ["A fresh product (version v1)."]
          setup_api_calls:
            - call: "POST /departments"
              payload: { code: "GROCERY", name: "Grocery" }
              as: StoreManager
              as_user_id: "mgr-1"
              captures: { dept_id: $.data.id }
            - call: "POST /products"
              payload: { department_id: "${dept_id}", name: "OCC2", sku: "SKU-OCC2", sell_by_weight: false, unit_price_cents: 200, reorder_point_qty: 0 }
              as: PriceManager
              as_user_id: "pm-1"
              captures: { pid: $.data.id, pv1: $.data.version }
          trigger:
            - call: "POST /price-plans"
              payload: { product_id: "${pid}", ad_price_cents: 150, effective_start: "2026-07-01T00:00:00Z", effective_end: "2026-07-08T00:00:00Z", expected_product_version: "${pv1}" }
              as: PriceManager
              as_user_id: "pm-1"
              captures: { ppid: $.data.id }
            - call: "GET /products/${pid}"
              payload: {}
              as: PriceManager
              as_user_id: "pm-1"
              captures: { pv2: $.data.version }
          assert:
            - "HTTP 201 for the price-plan create"
            - "PricePlan.${ppid}.status == SCHEDULED"
            - "Product.${pid}.version increased by 1 relative to pv1"

      - name: derived_on_hand_reconciled_after_receive
        claim_type: derived_field_reconciliation
        grounds: [calculations.product_inventory_rollup, entities.Product.fields.on_hand_qty, entities.Product.fields.on_hand_value_cents]
        distinguishing_aspect: "After receiving 10 each-units @ cost 100, Product.on_hand_qty == 10 and on_hand_value_cents == 1000 (denormalized fields reconciled in the same request)."
        test_recipe:
          setup: ["A product; one accepted line of 10 @ cost 100."]
          setup_api_calls:
            - call: "POST /_clock/advance"
              payload: { to_iso8601: "2026-06-05T00:00:00Z" }
              as: StoreManager
              as_user_id: "mgr-1"
            - call: "POST /departments"
              payload: { code: "GROCERY", name: "Grocery" }
              as: StoreManager
              as_user_id: "mgr-1"
              captures: { dept_id: $.data.id }
            - call: "POST /products"
              payload: { department_id: "${dept_id}", name: "Recon", sku: "SKU-REC", sell_by_weight: false, unit_price_cents: 150, reorder_point_qty: 0 }
              as: PriceManager
              as_user_id: "pm-1"
              captures: { pid: $.data.id, pv: $.data.version }
            - call: "POST /shipments"
              payload: { vendor_name: "V", reference_code: "REF-REC", expected_total_cents: 1000 }
              as: ReceivingClerk
              as_user_id: "rc-1"
              captures: { sid: $.data.id }
            - call: "POST /shipments/${sid}/lines"
              payload: { product_id: "${pid}", ordered_qty: 10, accepted_qty: 10, unit_cost_cents: 100 }
              as: ReceivingClerk
              as_user_id: "rc-1"
            - call: "POST /shipments/${sid}/start-receiving"
              payload: {}
              as: ReceivingClerk
              as_user_id: "rc-1"
          trigger:
            - call: "POST /shipments/${sid}/receive"
              payload: { expected_product_version: "${pv}" }
              as: ReceivingClerk
              as_user_id: "rc-1"
            - call: "GET /products/${pid}"
              payload: {}
              as: ReceivingClerk
              as_user_id: "rc-1"
              captures: { ohq: $.data.on_hand_qty }
          assert:
            - "Product.${pid}.on_hand_qty == 10"
            - "Product.${pid}.on_hand_value_cents == 1000"

      - name: short_receive_marks_line_short_and_partial_qty
        claim_type: cascading_side_effects
        grounds: [state_machines.Shipment.RECEIVING_to_RECEIVED, entities.ShipmentLine.fields.status, entities.ShipmentLine.fields.accepted_qty]
        distinguishing_aspect: "A line ordered 10 accepted 6 results, after receive, in line status SHORT and a lot of received_qty 6; product on_hand_qty == 6."
        test_recipe:
          setup: ["Shipment with one line ordered 10, accepted_qty 6, unit_cost 100, expected_total 600."]
          setup_api_calls:
            - call: "POST /_clock/advance"
              payload: { to_iso8601: "2026-06-05T00:00:00Z" }
              as: StoreManager
              as_user_id: "mgr-1"
            - call: "POST /departments"
              payload: { code: "GROCERY", name: "Grocery" }
              as: StoreManager
              as_user_id: "mgr-1"
              captures: { dept_id: $.data.id }
            - call: "POST /products"
              payload: { department_id: "${dept_id}", name: "Short", sku: "SKU-SHRT", sell_by_weight: false, unit_price_cents: 150, reorder_point_qty: 0 }
              as: PriceManager
              as_user_id: "pm-1"
              captures: { pid: $.data.id, pv: $.data.version }
            - call: "POST /shipments"
              payload: { vendor_name: "V", reference_code: "REF-SHRT", expected_total_cents: 600 }
              as: ReceivingClerk
              as_user_id: "rc-1"
              captures: { sid: $.data.id }
            - call: "POST /shipments/${sid}/lines"
              payload: { product_id: "${pid}", ordered_qty: 10, accepted_qty: 6, unit_cost_cents: 100 }
              as: ReceivingClerk
              as_user_id: "rc-1"
              captures: { line_id: $.data.id }
            - call: "POST /shipments/${sid}/start-receiving"
              payload: {}
              as: ReceivingClerk
              as_user_id: "rc-1"
          trigger:
            - call: "POST /shipments/${sid}/receive"
              payload: { expected_product_version: "${pv}" }
              as: ReceivingClerk
              as_user_id: "rc-1"
            - call: "GET /shipment-lines/${line_id}"
              payload: {}
              as: ReceivingClerk
              as_user_id: "rc-1"
              captures: { lst: $.data.status }
          assert:
            - "ShipmentLine.${line_id}.status == SHORT"
            - "Product.${pid}.on_hand_qty == 6"

  # ===========================================================================
  - section: consistency_model
    instances:
      - name: finalize_changes_visible_in_same_response
        claim_type: immediate
