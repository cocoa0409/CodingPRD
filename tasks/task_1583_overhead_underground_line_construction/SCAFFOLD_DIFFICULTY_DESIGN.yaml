# =============================================================================
# Task 1583 — Scaffold Difficulty Design (§1.8 Test Targeting Index)
# 9 rules x 2 instances = 18 instances
# =============================================================================
scaffold_difficulty_design:

  # ------------------------------------------------------------------
  # Rule 1 — dual_variant_calc
  # ------------------------------------------------------------------
  - rule_id: dual_variant_calc
    instances:
      - name: billing_preview_provisional_vs_final
        grounds:
          - calculations.billing_extension
          - entities.BidItem.fields.accepted_quantity
          - state_machines.ProductionEntry.SUBMITTED_to_ACCEPTED
        distinguishing_aspect: |
          Dual-variant logic on the BILLING domain: with identical production
          data (60 ACCEPTED + 50 SUBMITTED units on a bid item priced 50.00,
          est 100, retainage 0.10), variant=final yields subtotal 3000.00 /
          amount_due 2700.00 while variant=provisional yields subtotal 5500.00 /
          amount_due 4950.00, because provisional also counts SUBMITTED entries
          and lands the cumulative total exactly on the 110-unit threshold.
        test_recipe:
          setup:
            - "Contract ACTIVE with bid item est=100, unit_price=50.00, overrun_rate=40.00, retainage 0.10 (default)"
            - "Work package IN_PROGRESS with ACTIVE assignment over 2026-08-03..2026-08-07 (clock at 2026-08-03T12:00:00Z)"
            - "ProductionEntry e1: 60 units, work_date 2026-08-04, ACCEPTED via passed inspection"
            - "ProductionEntry e2: 50 units, work_date 2026-08-05, still SUBMITTED"
          setup_api_calls:
            - call: "POST /contracts"
              payload: { utility_name: "City Power", contract_number: "C-100", effective_start: "2026-08-01T00:00:00Z", effective_end: "2026-12-31T00:00:00Z" }
              as: CONTRACTOR_PM
              captures: { cid: $.data.id }
            - call: "POST /contracts/${cid}/bid-items"
              payload: { item_code: "OH-POLE-35", description: "35ft pole set", unit: "EACH", unit_price: 50.00, estimated_quantity: 100, overrun_rate: 40.00 }
              as: CONTRACTOR_PM
              captures: { bid_id: $.data.id }
            - call: "POST /contracts/${cid}/transition"
              payload: { to: "ACTIVE" }
              as: CONTRACTOR_PM
            - call: "POST /contracts/${cid}/work-packages"
              payload: { name: "Feeder F-12 rebuild", location: "Rte 9 MP 3-5", requires_outage: false }
              as: CONTRACTOR_PM
              captures: { wp_id: $.data.id }
            - call: "POST /work-packages/${wp_id}/transition"
              payload: { to: "MOBILIZED" }
              as: CONTRACTOR_PM
            - call: "POST /crews"
              payload: { crew_code: "CR-1", crew_type: "OVERHEAD", base_rate_per_hour: 60.00 }
              as: CONTRACTOR_PM
              captures: { crew_id: $.data.id }
            - call: "POST /equipment"
              payload: { equipment_code: "EQ-1", kind: "BUCKET_TRUCK", daily_rate: 120.00 }
              as: CONTRACTOR_PM
              captures: { eq_id: $.data.id }
            - call: "POST /work-packages/${wp_id}/assignments"
              payload: { crew_id: "${crew_id}", equipment_id: "${eq_id}", start_date: "2026-08-03", end_date: "2026-08-07" }
              as: FOREMAN
              captures: { asg_id: $.data.id }
            - call: "POST /work-packages/${wp_id}/transition"
              payload: { to: "IN_PROGRESS" }
              as: CONTRACTOR_PM
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T12:00:00Z" }
              as: CONTRACTOR_PM
            - call: "POST /assignments/${asg_id}/transition"
              payload: { to: "ACTIVE" }
              as: FOREMAN
              captures: { asg_v: $.data.version }
            - call: "POST /assignments/${asg_id}/production-entries"
              payload: { bid_item_id: "${bid_id}", work_date: "2026-08-04", quantity_reported: 60, expected_assignment_version: "${asg_v}" }
              as: FOREMAN
              captures: { e1: $.data.id }
            - call: "POST /work-packages/${wp_id}/inspections"
              payload: { production_entry_id: "${e1}", standard_code: "UTIL-OH-12.4" }
              as: UTILITY_INSPECTOR
              captures: { insp1: $.data.id }
            - call: "POST /inspections/${insp1}/submit"
              payload: { result: "PASS" }
              as: UTILITY_INSPECTOR
            - call: "GET /assignments/${asg_id}"
              payload: {}
              as: FOREMAN
              captures: { asg_v2: $.data.version }
            - call: "POST /assignments/${asg_id}/production-entries"
              payload: { bid_item_id: "${bid_id}", work_date: "2026-08-05", quantity_reported: 50, expected_assignment_version: "${asg_v2}" }
              as: FOREMAN
              captures: { e2: $.data.id }
          trigger:
            - call: "GET /work-packages/${wp_id}/billing-preview"
              payload: { period_start: "2026-08-01", period_end: "2026-08-31", variant: "final" }
              as: CONTRACTOR_PM
            - call: "GET /work-packages/${wp_id}/billing-preview"
              payload: { period_start: "2026-08-01", period_end: "2026-08-31", variant: "provisional" }
              as: CONTRACTOR_PM
          assert:
            - "final preview: subtotal == 3000.00 and amount_due == 2700.00 (60 ACCEPTED units x 50.00, retainage 300.00)"
            - "provisional preview: subtotal == 5500.00 and amount_due == 4950.00 (60+50=110 units, exactly at the 110-unit threshold, all in-schedule at 50.00)"
            - "the two variants differ by exactly 2500.00 of subtotal for identical underlying production data"

      - name: standby_convert_vs_pure_callout_premium
        grounds:
          - calculations.storm_premium_pay
          - entities.StormActivation.fields.premium_pay
          - state_machines.StormActivation.ACTIVE_to_ACTIVE
        distinguishing_aspect: |
          Dual-variant logic on the CREW-PAYROLL domain (different subject than
          billing): two crews at base rate 60.00 each work 3 hours during storm
          duty; the standby_convert variant (6 standby hours at 0.5x + 3 worked
          hours at 2.0x) yields premium_pay 540.00, while the pure_callout
          variant (max(3, 4) hours at 2.0x minimum guarantee) yields 480.00.
        test_recipe:
          setup:
            - "Contract ACTIVE (one trivial bid item), crews CR-S and CR-C both at base_rate_per_hour 60.00"
            - "sa1: STANDBY activation for CR-S on 2026-08-05, converted to CALLOUT, closed with hours_standby=6, hours_worked=3"
            - "sa2: CALLOUT activation for CR-C on 2026-08-05, closed with hours_standby=0, hours_worked=3"
          setup_api_calls:
            - call: "POST /contracts"
              payload: { utility_name: "City Power", contract_number: "C-200", effective_start: "2026-08-01T00:00:00Z", effective_end: "2026-12-31T00:00:00Z" }
              as: CONTRACTOR_PM
              captures: { cid: $.data.id }
            - call: "POST /contracts/${cid}/bid-items"
              payload: { item_code: "UG-CONDUCE-4IN", description: "4in conduit", unit: "LF", unit_price: 12.00, estimated_quantity: 500 }
              as: CONTRACTOR_PM
            - call: "POST /contracts/${cid}/transition"
              payload: { to: "ACTIVE" }
              as: CONTRACTOR_PM
            - call: "POST /crews"
              payload: { crew_code: "CR-S", crew_type: "STORM", base_rate_per_hour: 60.00 }
              as: CONTRACTOR_PM
              captures: { crew_s: $.data.id }
            - call: "POST /crews"
              payload: { crew_code: "CR-C", crew_type: "STORM", base_rate_per_hour: 60.00 }
              as: CONTRACTOR_PM
              captures: { crew_c: $.data.id }
            - call: "POST /contracts/${cid}/storm-activations"
              payload: { crew_id: "${crew_s}", kind: "STANDBY", activation_date: "2026-08-05" }
              as: UTILITY_DISPATCHER
              captures: { sa1: $.data.id }
            - call: "POST /storm-activations/${sa1}/convert"
              payload: {}
              as: UTILITY_DISPATCHER
            - call: "POST /storm-activations/${sa1}/close"
              payload: { hours_standby: 6, hours_worked: 3 }
              as: UTILITY_DISPATCHER
              captures: { prem1: $.data.premium_pay }
            - call: "POST /contracts/${cid}/storm-activations"
              payload: { crew_id: "${crew_c}", kind: "CALLOUT", activation_date: "2026-08-05" }
              as: UTILITY_DISPATCHER
              captures: { sa2: $.data.id }
            - call: "POST /storm-activations/${sa2}/close"
              payload: { hours_standby: 0, hours_worked: 3 }
              as: UTILITY_DISPATCHER
              captures: { prem2: $.data.premium_pay }
          trigger: []
          assert:
            - "StormActivation.${sa1}.premium_pay == 540.00 (6 x 0.5 x 60 + 3 x 2.0 x 60 = 180.00 + 360.00)"
            - "StormActivation.${sa2}.premium_pay == 480.00 (max(3, 4) x 2.0 x 60)"
            - "identical 3 worked hours price differently under the two variants (540.00 vs 480.00)"

  # ------------------------------------------------------------------
  # Rule 2 — combinatorial_formula
  # ------------------------------------------------------------------
  - rule_id: combinatorial_formula
    instances:
      - name: overrun_tier_split_pricing
        grounds:
          - calculations.billing_extension
          - calculations.invoice_total_aggregation
          - entities.BidItem.fields.overrun_rate
        distinguishing_aspect: |
          Mode (a): tiered-rate selection with nested min/max over 3+ inputs
          (billable=120, threshold=floor(100 x 1.10)=110, overrun_rate=40.00):
          the invoice line splits into in_schedule_units=110 at 50.00 plus
          overrun_units=10 at 40.00, extension 5900.00, subtotal 5900.00,
          retainage 590.00, amount_due 5310.00.
        test_recipe:
          setup:
            - "Contract ACTIVE: bid item est=100, unit_price=50.00, overrun_rate=40.00, retainage 0.10"
            - "Work package IN_PROGRESS, ACTIVE assignment, one ACCEPTED production entry of 120 units (cap 125 permits 120)"
          setup_api_calls:
            - call: "POST /contracts"
              payload: { utility_name: "City Power", contract_number: "C-300", effective_start: "2026-08-01T00:00:00Z", effective_end: "2026-12-31T00:00:00Z" }
              as: CONTRACTOR_PM
              captures: { cid: $.data.id }
            - call: "POST /contracts/${cid}/bid-items"
              payload: { item_code: "OH-WIRE-1/0", description: "1/0 ACSR", unit: "LF", unit_price: 50.00, estimated_quantity: 100, overrun_rate: 40.00 }
              as: CONTRACTOR_PM
              captures: { bid_id: $.data.id }
            - call: "POST /contracts/${cid}/transition"
              payload: { to: "ACTIVE" }
              as: CONTRACTOR_PM
            - call: "POST /contracts/${cid}/work-packages"
              payload: { name: "Line ext L-9", location: "County Rd 42", requires_outage: false }
              as: CONTRACTOR_PM
              captures: { wp_id: $.data.id }
            - call: "POST /work-packages/${wp_id}/transition"
              payload: { to: "MOBILIZED" }
              as: CONTRACTOR_PM
            - call: "POST /crews"
              payload: { crew_code: "CR-9", crew_type: "OVERHEAD", base_rate_per_hour: 55.00 }
              as: CONTRACTOR_PM
              captures: { crew_id: $.data.id }
            - call: "POST /equipment"
              payload: { equipment_code: "EQ-9", kind: "DIGGER_DERRICK", daily_rate: 200.00 }
              as: CONTRACTOR_PM
              captures: { eq_id: $.data.id }
            - call: "POST /work-packages/${wp_id}/assignments"
              payload: { crew_id: "${crew_id}", equipment_id: "${eq_id}", start_date: "2026-08-03", end_date: "2026-08-07" }
              as: FOREMAN
              captures: { asg_id: $.data.id }
            - call: "POST /work-packages/${wp_id}/transition"
              payload: { to: "IN_PROGRESS" }
              as: CONTRACTOR_PM
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T12:00:00Z" }
              as: CONTRACTOR_PM
            - call: "POST /assignments/${asg_id}/transition"
              payload: { to: "ACTIVE" }
              as: FOREMAN
              captures: { asg_v: $.data.version }
            - call: "POST /assignments/${asg_id}/production-entries"
              payload: { bid_item_id: "${bid_id}", work_date: "2026-08-04", quantity_reported: 120, expected_assignment_version: "${asg_v}" }
              as: FOREMAN
              captures: { e1: $.data.id }
            - call: "POST /work-packages/${wp_id}/inspections"
              payload: { production_entry_id: "${e1}", standard_code: "UTIL-OH-8.1" }
              as: UTILITY_INSPECTOR
              captures: { insp1: $.data.id }
            - call: "POST /inspections/${insp1}/submit"
              payload: { result: "PASS" }
              as: UTILITY_INSPECTOR
            - call: "GET /work-packages/${wp_id}"
              payload: {}
              as: CONTRACTOR_PM
              captures: { wp_v: $.data.version }
          trigger:
            - call: "POST /work-packages/${wp_id}/invoices"
              payload: { period_start: "2026-08-01", period_end: "2026-08-31", expected_work_package_version: "${wp_v}" }
              as: CONTRACTOR_PM
              captures: { inv_id: $.data.id }
            - call: "POST /invoices/${inv_id}/transition"
              payload: { to: "SUBMITTED" }
              as: CONTRACTOR_PM
          assert:
            - "Invoice.${inv_id} line for ${bid_id}: in_schedule_units == 110, overrun_units == 10, overrun_rate_applied == 40.00"
            - "Invoice.${inv_id}.subtotal == 5900.00 (110 x 50.00 + 10 x 40.00)"
            - "Invoice.${inv_id}.retainage_amount == 590.00 and amount_due == 5310.00"
            - "Invoice.${inv_id}.status == SUBMITTED"

      - name: per_line_rounding_then_sum
        grounds:
          - calculations.invoice_total_aggregation
          - calculations.billing_extension
        distinguishing_aspect: |
          Mode (b): nested rounding order — two lines of 3 units at 33.335 each
          produce raw extensions of 100.005; the pinned per-line-then-sum order
          rounds each to 100.01 and sums to subtotal 200.02, whereas
          sum-then-round would give 200.01. Retainage then rounds
          200.02 x 0.10 = 20.002 to 20.00, amount_due 180.02.
        test_recipe:
          setup:
            - "Contract ACTIVE with two bid items (A and B), each unit_price=33.335, est=1000, no overrun_rate"
            - "One ACCEPTED production entry of 3 units against each bid item, same period"
          setup_api_calls:
            - call: "POST /contracts"
              payload: { utility_name: "City Power", contract_number: "C-301", effective_start: "2026-08-01T00:00:00Z", effective_end: "2026-12-31T00:00:00Z" }
              as: CONTRACTOR_PM
              captures: { cid: $.data.id }
            - call: "POST /contracts/${cid}/bid-items"
              payload: { item_code: "UG-BORE-A", description: "Directional bore A", unit: "LF", unit_price: 33.335, estimated_quantity: 1000 }
              as: CONTRACTOR_PM
              captures: { bid_a: $.data.id }
            - call: "POST /contracts/${cid}/bid-items"
              payload: { item_code: "UG-BORE-B", description: "Directional bore B", unit: "LF", unit_price: 33.335, estimated_quantity: 1000 }
              as: CONTRACTOR_PM
              captures: { bid_b: $.data.id }
            - call: "POST /contracts/${cid}/transition"
              payload: { to: "ACTIVE" }
              as: CONTRACTOR_PM
            - call: "POST /contracts/${cid}/work-packages"
              payload: { name: "UG circuit U-3", location: "Downtown grid", requires_outage: false }
              as: CONTRACTOR_PM
              captures: { wp_id: $.data.id }
            - call: "POST /work-packages/${wp_id}/transition"
              payload: { to: "MOBILIZED" }
              as: CONTRACTOR_PM
            - call: "POST /crews"
              payload: { crew_code: "CR-U", crew_type: "UNDERGROUND", base_rate_per_hour: 58.00 }
              as: CONTRACTOR_PM
              captures: { crew_id: $.data.id }
            - call: "POST /equipment"
              payload: { equipment_code: "EQ-T1", kind: "TRENCHER", daily_rate: 180.00 }
              as: CONTRACTOR_PM
              captures: { eq_id: $.data.id }
            - call: "POST /work-packages/${wp_id}/assignments"
              payload: { crew_id: "${crew_id}", equipment_id: "${eq_id}", start_date: "2026-08-03", end_date: "2026-08-07" }
              as: FOREMAN
              captures: { asg_id: $.data.id }
            - call: "POST /work-packages/${wp_id}/transition"
              payload: { to: "IN_PROGRESS" }
              as: CONTRACTOR_PM
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T12:00:00Z" }
              as: CONTRACTOR_PM
            - call: "POST /assignments/${asg_id}/transition"
              payload: { to: "ACTIVE" }
              as: FOREMAN
              captures: { asg_v: $.data.version }
            - call: "POST /assignments/${asg_id}/production-entries"
              payload: { bid_item_id: "${bid_a}", work_date: "2026-08-04", quantity_reported: 3, expected_assignment_version: "${asg_v}" }
              as: FOREMAN
              captures: { ea: $.data.id }
            - call: "POST /work-packages/${wp_id}/inspections"
              payload: { production_entry_id: "${ea}", standard_code: "UTIL-UG-5.2" }
              as: UTILITY_INSPECTOR
              captures: { inspa: $.data.id }
            - call: "POST /inspections/${inspa}/submit"
              payload: { result: "PASS" }
              as: UTILITY_INSPECTOR
            - call: "GET /assignments/${asg_id}"
              payload: {}
              as: FOREMAN
              captures: { asg_v2: $.data.version }
            - call: "POST /assignments/${asg_id}/production-entries"
              payload: { bid_item_id: "${bid_b}", work_date: "2026-08-05", quantity_reported: 3, expected_assignment_version: "${asg_v2}" }
              as: FOREMAN
              captures: { eb: $.data.id }
            - call: "POST /work-packages/${wp_id}/inspections"
              payload: { production_entry_id: "${eb}", standard_code: "UTIL-UG-5.2" }
              as: UTILITY_INSPECTOR
              captures: { inspb: $.data.id }
            - call: "POST /inspections/${inspb}/submit"
              payload: { result: "PASS" }
              as: UTILITY_INSPECTOR
            - call: "GET /work-packages/${wp_id}"
              payload: {}
              as: CONTRACTOR_PM
              captures: { wp_v: $.data.version }
          trigger:
            - call: "POST /work-packages/${wp_id}/invoices"
              payload: { period_start: "2026-08-01", period_end: "2026-08-31", expected_work_package_version: "${wp_v}" }
              as: CONTRACTOR_PM
              captures: { inv_id: $.data.id }
            - call: "POST /invoices/${inv_id}/transition"
              payload: { to: "SUBMITTED" }
              as: CONTRACTOR_PM
          assert:
            - "each line extension_amount == 100.01 (round(3 x 33.335, 2, HALF_UP) = round(100.005) = 100.01)"
            - "Invoice.${inv_id}.subtotal == 200.02 (NOT 200.01 — per-line rounding precedes summation)"
            - "Invoice.${inv_id}.retainage_amount == 20.00 and amount_due == 180.02"

  # ------------------------------------------------------------------
  # Rule 3 — non_linear_state_machine
  # ------------------------------------------------------------------
  - rule_id: non_linear_state_machine
    instances:
      - name: production_entry_rework_cycle
        grounds:
          - state_machines.ProductionEntry.SUBMITTED_to_REWORK_REQUIRED
          - state_machines.ProductionEntry.REWORK_REQUIRED_to_SUBMITTED
          - state_machines.ProductionEntry.SUBMITTED_to_ACCEPTED
        distinguishing_aspect: |
          Cyclic machine on ProductionEntry: SUBMITTED -> REWORK_REQUIRED ->
          SUBMITTED -> ACCEPTED, with rework_count reaching 1 and
          rework_open_count returning to 0 after the loop closes.
        test_recipe:
          setup:
            - "Contract ACTIVE, bid item est=100 price=20.00; work package IN_PROGRESS; ACTIVE assignment over 2026-08-03..2026-08-07"
            - "One production entry e1 of 10 units, work_date 2026-08-04, SUBMITTED"
          setup_api_calls:
            - call: "POST /contracts"
              payload: { utility_name: "City Power", contract_number: "C-400", effective_start: "2026-08-01T00:00:00Z", effective_end: "2026-12-31T00:00:00Z" }
              as: CONTRACTOR_PM
              captures: { cid: $.data.id }
            - call: "POST /contracts/${cid}/bid-items"
              payload: { item_code: "OH-XARM", description: "Crossarm install", unit: "EACH", unit_price: 20.00, estimated_quantity: 100 }
              as: CONTRACTOR_PM
              captures: { bid_id: $.data.id }
            - call: "POST /contracts/${cid}/transition"
              payload: { to: "ACTIVE" }
              as: CONTRACTOR_PM
            - call: "POST /contracts/${cid}/work-packages"
              payload: { name: "Pole top refit", location: "Sub 7 feeder A", requires_outage: false }
              as: CONTRACTOR_PM
              captures: { wp_id: $.data.id }
            - call: "POST /work-packages/${wp_id}/transition"
              payload: { to: "MOBILIZED" }
              as: CONTRACTOR_PM
            - call: "POST /crews"
              payload: { crew_code: "CR-R", crew_type: "OVERHEAD", base_rate_per_hour: 55.00 }
              as: CONTRACTOR_PM
              captures: { crew_id: $.data.id }
            - call: "POST /equipment"
              payload: { equipment_code: "EQ-R", kind: "BUCKET_TRUCK", daily_rate: 120.00 }
              as: CONTRACTOR_PM
              captures: { eq_id: $.data.id }
            - call: "POST /work-packages/${wp_id}/assignments"
              payload: { crew_id: "${crew_id}", equipment_id: "${eq_id}", start_date: "2026-08-03", end_date: "2026-08-07" }
              as: FOREMAN
              captures: { asg_id: $.data.id }
            - call: "POST /work-packages/${wp_id}/transition"
              payload: { to: "IN_PROGRESS" }
              as: CONTRACTOR_PM
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T12:00:00Z" }
              as: CONTRACTOR_PM
            - call: "POST /assignments/${asg_id}/transition"
              payload: { to: "ACTIVE" }
              as: FOREMAN
              captures: { asg_v: $.data.version }
            - call: "POST /assignments/${asg_id}/production-entries"
              payload: { bid_item_id: "${bid_id}", work_date: "2026-08-04", quantity_reported: 10, expected_assignment_version: "${asg_v}" }
              as: FOREMAN
              captures: { e1: $.data.id }
            - call: "POST /work-packages/${wp_id}/inspections"
              payload: { production_entry_id: "${e1}", standard_code: "UTIL-OH-12.4" }
              as: UTILITY_INSPECTOR
              captures: { insp1: $.data.id }
          trigger:
            - call: "POST /inspections/${insp1}/submit"
              payload: { result: "FAIL" }
              as: UTILITY_INSPECTOR
            - call: "POST /production-entries/${e1}/resubmit"
              payload: {}
              as: FOREMAN
              captures: { e1_after: $.data.status }
            - call: "POST /work-packages/${wp_id}/inspections"
              payload: { production_entry_id: "${e1}", standard_code: "UTIL-OH-12.4" }
              as: UTILITY_INSPECTOR
              captures: { insp2: $.data.id }
            - call: "POST /inspections/${insp2}/submit"
              payload: { result: "PASS" }
              as: UTILITY_INSPECTOR
          assert:
            - "after FAIL: ProductionEntry.${e1}.status == REWORK_REQUIRED and WorkPackage.${wp_id}.rework_open_count == 1"
            - "after resubmit: ProductionEntry.${e1}.status == SUBMITTED and rework_count == 1"
            - "after second PASS: ProductionEntry.${e1}.status == ACCEPTED, WorkPackage.${wp_id}.rework_open_count == 0, BidItem.${bid_id}.accepted_quantity == 10"

      - name: invoice_rejection_revision_cycle
        grounds:
          - state_machines.Invoice.SUBMITTED_to_REJECTED
          - state_machines.Invoice.REJECTED_to_DRAFT
          - state_machines.Invoice.DRAFT_to_SUBMITTED
        distinguishing_aspect: |
          Cyclic machine on Invoice (different entity than ProductionEntry):
          DRAFT -> SUBMITTED -> REJECTED -> DRAFT -> SUBMITTED -> APPROVED, with
          billed_quantity released on rejection and re-debited on resubmission.
        test_recipe:
          setup:
            - "Contract ACTIVE, bid item est=100 price=20.00, work package IN_PROGRESS"
            - "One ACCEPTED production entry of 10 units in period 2026-08-01..2026-08-31"
          setup_api_calls:
            - call: "POST /contracts"
              payload: { utility_name: "City Power", contract_number: "C-401", effective_start: "2026-08-01T00:00:00Z", effective_end: "2026-12-31T00:00:00Z" }
              as: CONTRACTOR_PM
              captures: { cid: $.data.id }
            - call: "POST /contracts/${cid}/bid-items"
              payload: { item_code: "OH-POLE-45", description: "45ft pole set", unit: "EACH", unit_price: 20.00, estimated_quantity: 100 }
              as: CONTRACTOR_PM
              captures: { bid_id: $.data.id }
            - call: "POST /contracts/${cid}/transition"
              payload: { to: "ACTIVE" }
              as: CONTRACTOR_PM
            - call: "POST /contracts/${cid}/work-packages"
              payload: { name: "Feeder F-9", location: "Industrial park", requires_outage: false }
              as: CONTRACTOR_PM
              captures: { wp_id: $.data.id }
            - call: "POST /work-packages/${wp_id}/transition"
              payload: { to: "MOBILIZED" }
              as: CONTRACTOR_PM
            - call: "POST /crews"
              payload: { crew_code: "CR-I", crew_type: "OVERHEAD", base_rate_per_hour: 55.00 }
              as: CONTRACTOR_PM
              captures: { crew_id: $.data.id }
            - call: "POST /equipment"
              payload: { equipment_code: "EQ-I", kind: "BUCKET_TRUCK", daily_rate: 120.00 }
              as: CONTRACTOR_PM
              captures: { eq_id: $.data.id }
            - call: "POST /work-packages/${wp_id}/assignments"
              payload: { crew_id: "${crew_id}", equipment_id: "${eq_id}", start_date: "2026-08-03", end_date: "2026-08-07" }
              as: FOREMAN
              captures: { asg_id: $.data.id }
            - call: "POST /work-packages/${wp_id}/transition"
              payload: { to: "IN_PROGRESS" }
              as: CONTRACTOR_PM
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T12:00:00Z" }
              as: CONTRACTOR_PM
            - call: "POST /assignments/${asg_id}/transition"
              payload: { to: "ACTIVE" }
              as: FOREMAN
              captures: { asg_v: $.data.version }
            - call: "POST /assignments/${asg_id}/production-entries"
              payload: { bid_item_id: "${bid_id}", work_date: "2026-08-04", quantity_reported: 10, expected_assignment_version: "${asg_v}" }
              as: FOREMAN
              captures: { e1: $.data.id }
            - call: "POST /work-packages/${wp_id}/inspections"
              payload: { production_entry_id: "${e1}", standard_code: "UTIL-OH-12.4" }
              as: UTILITY_INSPECTOR
              captures: { insp1: $.data.id }
            - call: "POST /inspections/${insp1}/submit"
              payload: { result: "PASS" }
              as: UTILITY_INSPECTOR
            - call: "GET /work-packages/${wp_id}"
              payload: {}
              as: CONTRACTOR_PM
              captures: { wp_v: $.data.version }
            - call: "POST /work-packages/${wp_id}/invoices"
              payload: { period_start: "2026-08-01", period_end: "2026-08-31", expected_work_package_version: "${wp_v}" }
              as: CONTRACTOR_PM
              captures: { inv_id: $.data.id }
          trigger:
            - call: "POST /invoices/${inv_id}/transition"
              payload: { to: "SUBMITTED" }
              as: CONTRACTOR_PM
            - call: "POST /invoices/${inv_id}/transition"
              payload: { to: "REJECTED" }
              as: UTILITY_INSPECTOR
            - call: "POST /invoices/${inv_id}/transition"
              payload: { to: "DRAFT" }
              as: CONTRACTOR_PM
            - call: "POST /invoices/${inv_id}/transition"
              payload: { to: "SUBMITTED" }
              as: CONTRACTOR_PM
            - call: "POST /invoices/${inv_id}/transition"
              payload: { to: "APPROVED" }
              as: UTILITY_INSPECTOR
          assert:
            - "Invoice.${inv_id} walks DRAFT -> SUBMITTED -> REJECTED -> DRAFT -> SUBMITTED -> APPROVED without error"
            - "while REJECTED and after revise-to-DRAFT: BidItem.${bid_id}.billed_quantity == 0"
            - "after final SUBMITTED: BidItem.${bid_id}.billed_quantity == 10 and Invoice.amount_due == 180.00 (10 x 20.00 - 20.00 retainage)"

  # ------------------------------------------------------------------
  # Rule 4 — transitive_cascade
  # ------------------------------------------------------------------
  - rule_id: transitive_cascade
    instances:
      - name: inspection_fail_cascade_to_invoice_hold
        grounds:
          - state_machines.Inspection.SCHEDULED_to_FAILED
          - state_machines.ProductionEntry.SUBMITTED_to_REWORK_REQUIRED
          - entities.Invoice.fields.hold_reason
          - validations[priority=9k]
        distinguishing_aspect: |
          Depth-3 cascade from inspection submit FAIL: Inspection -> FAILED
          (hop 0) mutates ProductionEntry -> REWORK_REQUIRED (hop 1), which
          increments WorkPackage.rework_open_count 0->1 (hop 2), which sets
          hold_reason=OPEN_REWORK on the DRAFT Invoice and blocks its
          submission with ERR_OPEN_REWORK (hop 3).
        test_recipe:
          setup:
            - "Contract ACTIVE, bid item est=50 price=20.00; work package IN_PROGRESS; ACTIVE assignment"
            - "Production entry e1 of 10 units SUBMITTED; SCHEDULED inspection i1 on e1"
            - "DRAFT invoice inv1 exists for period 2026-08-01..2026-08-31 with hold_reason null"
          setup_api_calls:
            - call: "POST /contracts"
              payload: { utility_name: "City Power", contract_number: "C-500", effective_start: "2026-08-01T00:00:00Z", effective_end: "2026-12-31T00:00:00Z" }
              as: CONTRACTOR_PM
              captures: { cid: $.data.id }
            - call: "POST /contracts/${cid}/bid-items"
              payload: { item_code: "OH-FUSE", description: "Fused cutout", unit: "EACH", unit_price: 20.00, estimated_quantity: 50 }
              as: CONTRACTOR_PM
              captures: { bid_id: $.data.id }
            - call: "POST /contracts/${cid}/transition"
              payload: { to: "ACTIVE" }
              as: CONTRACTOR_PM
            - call: "POST /contracts/${cid}/work-packages"
              payload: { name: "Cutout retrofit", location: "Feeder F-3", requires_outage: false }
              as: CONTRACTOR_PM
              captures: { wp_id: $.data.id }
            - call: "POST /work-packages/${wp_id}/transition"
              payload: { to: "MOBILIZED" }
              as: CONTRACTOR_PM
            - call: "POST /crews"
              payload: { crew_code: "CR-F", crew_type: "OVERHEAD", base_rate_per_hour: 55.00 }
              as: CONTRACTOR_PM
              captures: { crew_id: $.data.id }
            - call: "POST /equipment"
              payload: { equipment_code: "EQ-F", kind: "BUCKET_TRUCK", daily_rate: 120.00 }
              as: CONTRACTOR_PM
              captures: { eq_id: $.data.id }
            - call: "POST /work-packages/${wp_id}/assignments"
              payload: { crew_id: "${crew_id}", equipment_id: "${eq_id}", start_date: "2026-08-03", end_date: "2026-08-07" }
              as: FOREMAN
              captures: { asg_id: $.data.id }
            - call: "POST /work-packages/${wp_id}/transition"
              payload: { to: "IN_PROGRESS" }
              as: CONTRACTOR_PM
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T12:00:00Z" }
              as: CONTRACTOR_PM
            - call: "POST /assignments/${asg_id}/transition"
              payload: { to: "ACTIVE" }
              as: FOREMAN
              captures: { asg_v: $.data.version }
            - call: "POST /assignments/${asg_id}/production-entries"
              payload: { bid_item_id: "${bid_id}", work_date: "2026-08-04", quantity_reported: 10, expected_assignment_version: "${asg_v}" }
              as: FOREMAN
              captures: { e1: $.data.id }
            - call: "POST /work-packages/${wp_id}/inspections"
              payload: { production_entry_id: "${e1}", standard_code: "UTIL-OH-12.4" }
              as: UTILITY_INSPECTOR
              captures: { insp1: $.data.id }
            - call: "GET /work-packages/${wp_id}"
              payload: {}
              as: CONTRACTOR_PM
              captures: { wp_v: $.data.version }
            - call: "POST /work-packages/${wp_id}/invoices"
              payload: { period_start: "2026-08-01", period_end: "2026-08-31", expected_work_package_version: "${wp_v}" }
              as: CONTRACTOR_PM
              captures: { inv_id: $.data.id }
          trigger:
            - call: "POST /inspections/${insp1}/submit"
              payload: { result: "FAIL" }
              as: UTILITY_INSPECTOR
            - call: "POST /invoices/${inv_id}/transition"
              payload: { to: "SUBMITTED" }
              as: CONTRACTOR_PM
              captures: { submit_err: $.data.error_id }
          assert:
            - "ProductionEntry.${e1}.status == REWORK_REQUIRED (hop 1)"
            - "WorkPackage.${wp_id}.rework_open_count == 1 (hop 2)"
            - "Invoice.${inv_id}.hold_reason == OPEN_REWORK (hop 3, mutated while still DRAFT)"
            - "submit attempt on the held invoice fails with error_id == ERR_OPEN_REWORK"
            - "Invoice.${inv_id}.status remains DRAFT"

      - name: fatal_incident_cascade_suspends_contract
        grounds:
          - state_machines.Contract.ACTIVE_to_SUSPENDED
          - entities.SafetyEvent.fields.severity
          - state_machines.Assignment.ACTIVE_to_CANCELLED
          - state_machines.OutageRequest.APPROVED_to_CANCELLED
        distinguishing_aspect: |
          Depth-2 cascade from a different trigger (safety event creation, not
          inspection): SafetyEvent(INCIDENT, FATAL) mutates Contract ->
          SUSPENDED (hop 1), whose transition itself cancels every
          PLANNED/ACTIVE Assignment and every REQUESTED/APPROVED/
          CHANGE_REQUESTED OutageRequest of the contract (hop 2).
        test_recipe:
          setup:
            - "Contract ACTIVE with work package IN_PROGRESS"
            - "Assignment a1 ACTIVE (clock 2026-08-03 inside its 2026-08-03..2026-08-07 range)"
            - "OutageRequest o1 APPROVED for circuit CKT-9, window 2026-08-10T08:00:00Z..2026-08-10T12:00:00Z"
          setup_api_calls:
            - call: "POST /contracts"
              payload: { utility_name: "City Power", contract_number: "C-501", effective_start: "2026-08-01T00:00:00Z", effective_end: "2026-12-31T00:00:00Z" }
              as: CONTRACTOR_PM
              captures: { cid: $.data.id }
            - call: "POST /contracts/${cid}/bid-items"
              payload: { item_code: "UG-CABLE-500", description: "500MCM UG cable", unit: "LF", unit_price: 30.00, estimated_quantity: 200 }
              as: CONTRACTOR_PM
            - call: "POST /contracts/${cid}/transition"
              payload: { to: "ACTIVE" }
              as: CONTRACTOR_PM
            - call: "POST /contracts/${cid}/work-packages"
              payload: { name: "UG feeder U-8", location: "Airport Rd", requires_outage: true }
              as: CONTRACTOR_PM
              captures: { wp_id: $.data.id }
            - call: "POST /work-packages/${wp_id}/transition"
              payload: { to: "MOBILIZED" }
              as: CONTRACTOR_PM
            - call: "POST /crews"
              payload: { crew_code: "CR-X", crew_type: "UNDERGROUND", base_rate_per_hour: 58.00 }
              as: CONTRACTOR_PM
              captures: { crew_id: $.data.id }
            - call: "POST /equipment"
              payload: { equipment_code: "EQ-X", kind: "REEL_TRAILER", daily_rate: 90.00 }
              as: CONTRACTOR_PM
              captures: { eq_id: $.data.id }
            - call: "POST /work-packages/${wp_id}/assignments"
              payload: { crew_id: "${crew_id}", equipment_id: "${eq_id}", start_date: "2026-08-03", end_date: "2026-08-07" }
              as: FOREMAN
              captures: { asg_id: $.data.id }
            - call: "POST /work-packages/${wp_id}/transition"
              payload: { to: "IN_PROGRESS" }
              as: CONTRACTOR_PM
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T12:00:00Z" }
              as: CONTRACTOR_PM
            - call: "POST /assignments/${asg_id}/transition"
              payload: { to: "ACTIVE" }
              as: FOREMAN
            - call: "POST /work-packages/${wp_id}/outage-requests"
              payload: { circuit_id: "CKT-9", window_start: "2026-08-10T08:00:00Z", window_end: "2026-08-10T12:00:00Z" }
              as: CONTRACTOR_PM
              captures: { o1: $.data.id }
            - call: "POST /outage-requests/${o1}/decide"
              payload: { decision: "APPROVED" }
              as: UTILITY_DISPATCHER
          trigger:
            - call: "POST /work-packages/${wp_id}/safety-events"
              payload: { kind: "INCIDENT", severity: "FATAL", description: "Contact with energized conductor", crew_id: "${crew_id}" }
              as: SAFETY_OFFICER
              captures: { se_id: $.data.id }
          assert:
            - "SafetyEvent.${se_id}.status == OPEN"
            - "Contract.${cid}.status == SUSPENDED (hop 1)"
            - "Assignment.${asg_id}.status == CANCELLED (hop 2, via contract suspension)"
            - "OutageRequest.${o1}.status == CANCELLED (hop 2, via contract suspension)"

  # ------------------------------------------------------------------
  # Rule 5 — priority_pair_validation_conflict
  # ------------------------------------------------------------------
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: state_error_beats_fiscal_on_invoice_resubmit
        grounds:
          - validations[priority=7]
          - validations[priority=11b]
          - errors[ERR_INVALID_STATE]
          - errors[ERR_NO_BILLABLE_UNITS]
        distinguishing_aspect: |
          Category pair state vs business_fiscal: re-submitting an already
          SUBMITTED invoice violates both the state rule (not DRAFT, priority 7)
          and the fiscal rule (no new billable units, priority 11b); the
          state error ERR_INVALID_STATE must win.
        test_recipe:
          setup:
            - "Contract ACTIVE, bid item est=100 price=20.00, work package IN_PROGRESS"
            - "One ACCEPTED entry of 10 units; invoice inv1 covering 2026-08-01..2026-08-31 already SUBMITTED (billed all 10 units)"
          setup_api_calls:
            - call: "POST /contracts"
              payload: { utility_name: "City Power", contract_number: "C-600", effective_start: "2026-08-01T00:00:00Z", effective_end: "2026-12-31T00:00:00Z" }
              as: CONTRACTOR_PM
              captures: { cid: $.data.id }
            - call: "POST /contracts/${cid}/bid-items"
              payload: { item_code: "OH-POLE-35", description: "35ft pole", unit: "EACH", unit_price: 20.00, estimated_quantity: 100 }
              as: CONTRACTOR_PM
              captures: { bid_id: $.data.id }
            - call: "POST /contracts/${cid}/transition"
              payload: { to: "ACTIVE" }
              as: CONTRACTOR_PM
            - call: "POST /contracts/${cid}/work-packages"
              payload: { name: "Pole repl P-1", location: "Feeder F-1", requires_outage: false }
              as: CONTRACTOR_PM
              captures: { wp_id: $.data.id }
            - call: "POST /work-packages/${wp_id}/transition"
              payload: { to: "MOBILIZED" }
              as: CONTRACTOR_PM
            - call: "POST /crews"
              payload: { crew_code: "CR-P", crew_type: "OVERHEAD", base_rate_per_hour: 55.00 }
              as: CONTRACTOR_PM
              captures: { crew_id: $.data.id }
            - call: "POST /equipment"
              payload: { equipment_code: "EQ-P", kind: "BUCKET_TRUCK", daily_rate: 120.00 }
              as: CONTRACTOR_PM
              captures: { eq_id: $.data.id }
            - call: "POST /work-packages/${wp_id}/assignments"
              payload: { crew_id: "${crew_id}", equipment_id: "${eq_id}", start_date: "2026-08-03", end_date: "2026-08-07" }
              as: FOREMAN
              captures: { asg_id: $.data.id }
            - call: "POST /work-packages/${wp_id}/transition"
              payload: { to: "IN_PROGRESS" }
              as: CONTRACTOR_PM
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T12:00:00Z" }
              as: CONTRACTOR_PM
            - call: "POST /assignments/${asg_id}/transition"
              payload: { to: "ACTIVE" }
              as: FOREMAN
              captures: { asg_v: $.data.version }
            - call: "POST /assignments/${asg_id}/production-entries"
              payload: { bid_item_id: "${bid_id}", work_date: "2026-08-04", quantity_reported: 10, expected_assignment_version: "${asg_v}" }
              as: FOREMAN
              captures: { e1: $.data.id }
            - call: "POST /work-packages/${wp_id}/inspections"
              payload: { production_entry_id: "${e1}", standard_code: "UTIL-OH-12.4" }
              as: UTILITY_INSPECTOR
              captures: { insp1: $.data.id }
            - call: "POST /inspections/${insp1}/submit"
              payload: { result: "PASS" }
              as: UTILITY_INSPECTOR
            - call: "GET /work-packages/${wp_id}"
              payload: {}
              as: CONTRACTOR_PM
              captures: { wp_v: $.data.version }
            - call: "POST /work-packages/${wp_id}/invoices"
              payload: { period_start: "2026-08-01", period_end: "2026-08-31", expected_work_package_version: "${wp_v}" }
              as: CONTRACTOR_PM
              captures: { inv_id: $.data.id }
            - call: "POST /invoices/${inv_id}/transition"
              payload: { to: "SUBMITTED" }
              as: CONTRACTOR_PM
          trigger:
            - call: "POST /invoices/${inv_id}/transition"
              payload: { to: "SUBMITTED" }
              as: CONTRACTOR_PM
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_STATE (state rule, priority 7), NOT ERR_NO_BILLABLE_UNITS (fiscal rule, priority 11b)"
            - "Invoice.${inv_id}.status remains SUBMITTED"

      - name: outage_safety_beats_quantity_cap
        grounds:
          - validations[priority=8]
          - validations[priority=9g]
          - errors[ERR_OUTAGE_REQUIRED]
          - errors[ERR_QUANTITY_CAP_EXCEEDED]
        distinguishing_aspect: |
          Category pair business_safety vs business_constraint: a production
          entry on an outage-required work package with no IN_EFFECT outage AND
          a quantity that would push cumulative reported units over the 125%
          cap violates both; the safety error ERR_OUTAGE_REQUIRED (priority 8)
          must win over ERR_QUANTITY_CAP_EXCEEDED (priority 9g).
        test_recipe:
          setup:
            - "Contract ACTIVE, bid item est=100 (cap 125); work package requires_outage=true, IN_PROGRESS; ACTIVE assignment, clock 2026-08-03T12:00:00Z"
            - "Outage o1 for circuit CKT-1 APPROVED with window 2026-08-03T08:00:00Z..2026-08-03T17:00:00Z (IN_EFFECT at current clock)"
            - "Entry e1 of 100 units on work_date 2026-08-03 created while o1 was IN_EFFECT; o1 then RELEASED, so no IN_EFFECT outage remains"
          setup_api_calls:
            - call: "POST /contracts"
              payload: { utility_name: "City Power", contract_number: "C-601", effective_start: "2026-08-01T00:00:00Z", effective_end: "2026-12-31T00:00:00Z" }
              as: CONTRACTOR_PM
              captures: { cid: $.data.id }
            - call: "POST /contracts/${cid}/bid-items"
              payload: { item_code: "UG-CABLE-750", description: "750MCM cable", unit: "LF", unit_price: 40.00, estimated_quantity: 100 }
              as: CONTRACTOR_PM
              captures: { bid_id: $.data.id }
            - call: "POST /contracts/${cid}/transition"
              payload: { to: "ACTIVE" }
              as: CONTRACTOR_PM
            - call: "POST /contracts/${cid}/work-packages"
              payload: { name: "UG feeder U-11", location: "Harbor line", requires_outage: true }
              as: CONTRACTOR_PM
              captures: { wp_id: $.data.id }
            - call: "POST /work-packages/${wp_id}/transition"
              payload: { to: "MOBILIZED" }
              as: CONTRACTOR_PM
            - call: "POST /crews"
              payload: { crew_code: "CR-Q", crew_type: "UNDERGROUND", base_rate_per_hour: 58.00 }
              as: CONTRACTOR_PM
              captures: { crew_id: $.data.id }
            - call: "POST /equipment"
              payload: { equipment_code: "EQ-Q", kind: "REEL_TRAILER", daily_rate: 90.00 }
              as: CONTRACTOR_PM
              captures: { eq_id: $.data.id }
            - call: "POST /work-packages/${wp_id}/assignments"
              payload: { crew_id: "${crew_id}", equipment_id: "${eq_id}", start_date: "2026-08-03", end_date: "2026-08-07" }
              as: FOREMAN
              captures: { asg_id: $.data.id }
            - call: "POST /work-packages/${wp_id}/transition"
              payload: { to: "IN_PROGRESS" }
              as: CONTRACTOR_PM
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T12:00:00Z" }
              as: CONTRACTOR_PM
            - call: "POST /assignments/${asg_id}/transition"
              payload: { to: "ACTIVE" }
              as: FOREMAN
              captures: { asg_v: $.data.version }
            - call: "POST /work-packages/${wp_id}/outage-requests"
              payload: { circuit_id: "CKT-1", window_start: "2026-08-03T08:00:00Z", window_end: "2026-08-03T17:00:00Z" }
              as: CONTRACTOR_PM
              captures: { o1: $.data.id }
            - call: "POST /outage-requests/${o1}/decide"
              payload: { decision: "APPROVED" }
              as: UTILITY_DISPATCHER
            - call: "POST /assignments/${asg_id}/production-entries"
              payload: { bid_item_id: "${bid_id}", work_date: "2026-08-03", quantity_reported: 100, expected_assignment_version: "${asg_v}" }
              as: FOREMAN
              captures: { e1: $.data.id }
            - call: "POST /outage-requests/${o1}/release"
              payload: {}
              as: UTILITY_DISPATCHER
            - call: "GET /assignments/${asg_id}"
              payload: {}
              as: FOREMAN
              captures: { asg_v2: $.data.version }
          trigger:
            - call: "POST /assignments/${asg_id}/production-entries"
              payload: { bid_item_id: "${bid_id}", work_date: "2026-08-03", quantity_reported: 30, expected_assignment_version: "${asg_v2}" }
              as: FOREMAN
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_OUTAGE_REQUIRED (safety, priority 8), NOT ERR_QUANTITY_CAP_EXCEEDED (constraint, priority 9g), even though 100+30=130 > 125 also violates the cap"
            - "no new ProductionEntry is created"

  # ------------------------------------------------------------------
  # Rule 6 — boundary_precision_check
  # ------------------------------------------------------------------
  - rule_id: boundary_precision_check
    instances:
      - name: material_issue_exact_on_hand_boundary
        grounds:
          - validations[priority=11c]
          - calculations.material_reconciliation
          - entities.StockItem.fields.on_hand
        distinguishing_aspect: |
          Boundary on STOCK QUANTITY via POST /work-packages/{id}/material-issues:
          issuing exactly the available on_hand (25 of 25) is allowed and drives
          on_hand to exactly 0; a follow-up issue of 0.5 is rejected with
          ERR_INSUFFICIENT_STOCK.
        test_recipe:
          setup:
            - "Contract ACTIVE; work package IN_PROGRESS; StockItem 'XFR-50KVA' with on_hand exactly 25 after a receipt of 25"
          setup_api_calls:
            - call: "POST /contracts"
              payload: { utility_name: "City Power", contract_number: "C-700", effective_start: "2026-08-01T00:00:00Z", effective_end: "2026-12-31T00:00:00Z" }
              as: CONTRACTOR_PM
