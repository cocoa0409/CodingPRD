            - "ambient pull succeeds: tp0 PULLED, CH-AMB reserved_units == 1, CH-COLD reserved_units == 0"

      - name: duplicate_time_point_day_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=6]", "errors[ERR_DUPLICATE_TIME_POINT_DAY]"]
        distinguishing_aspect: "Second time point with day_index 0 in the same study fails; day_index 0 in a DIFFERENT study is fine."
        test_recipe:
          setup: ["study A DRAFT with tp day 0; study B DRAFT with no time points"]
          setup_api_calls:
            - { call: "POST /sensory-lab/clients", payload: { name: "Dup Co", contact_email: "dup2@acme.com" }, as: LabDirector, captures: { client_id: $.data.id } }
            - { call: "POST /sensory-lab/studies", payload: { client_id: "${client_id}", product_name: "A", study_type: "REAL_TIME", storage_temp_c: 20, target_shelf_life_days: 30, sensory_fail_threshold: 6.0, min_detectable_difference: 3.0, planned_start_utc: "2026-08-01T00:00:00Z" }, as: SensoryScientist, captures: { study_a: $.data.id } }
            - { call: "POST /sensory-lab/sampling-time-points", payload: { study_id: "${study_a}", day_index: 0 }, as: SensoryScientist }
            - { call: "POST /sensory-lab/studies", payload: { client_id: "${client_id}", product_name: "B", study_type: "REAL_TIME", storage_temp_c: 20, target_shelf_life_days: 30, sensory_fail_threshold: 6.0, min_detectable_difference: 3.0, planned_start_utc: "2026-08-01T00:00:00Z" }, as: SensoryScientist, captures: { study_b: $.data.id } }
          trigger:
            - { call: "POST /sensory-lab/sampling-time-points", payload: { study_id: "${study_a}", day_index: 0 }, as: SensoryScientist, captures: { err: $.data.error_id } }
            - { call: "POST /sensory-lab/sampling-time-points", payload: { study_id: "${study_b}", day_index: 0 }, as: SensoryScientist, captures: { tp_b0: $.data.id } }
          assert:
            - "duplicate day 0 in study A: error_id == ERR_DUPLICATE_TIME_POINT_DAY (http 409)"
            - "day 0 in study B succeeds (uniqueness is per-study)"

      - name: control_arm_and_variant_uniqueness
        claim_type: violation_to_error
        grounds: ["validations[priority=6]", "errors[ERR_CONTROL_ARM_EXISTS]", "errors[ERR_DUPLICATE_ARM_VARIANT]"]
        distinguishing_aspect: "A second is_control arm fails with ERR_CONTROL_ARM_EXISTS; repeating a packaging_variant fails with ERR_DUPLICATE_ARM_VARIANT."
        test_recipe:
          setup: ["study DRAFT with control arm STANDARD_FILM"]
          setup_api_calls:
            - { call: "POST /sensory-lab/clients", payload: { name: "Arm Co", contact_email: "arm@acme.com" }, as: LabDirector, captures: { client_id: $.data.id } }
            - { call: "POST /sensory-lab/studies", payload: { client_id: "${client_id}", product_name: "Chili", study_type: "REAL_TIME", storage_temp_c: 20, target_shelf_life_days: 30, sensory_fail_threshold: 6.0, min_detectable_difference: 3.0, planned_start_utc: "2026-08-01T00:00:00Z" }, as: SensoryScientist, captures: { study_id: $.data.id } }
