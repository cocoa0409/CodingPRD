  - rule_id: non_linear_state_machine
    instances:

      - name: dispute_open_countered_loop_alternates_actor_and_caps_at_three_rounds
        grounds:
          - state_machines.Dispute
          - validations.priority_46_ERR_DISPUTE_ROUNDS_EXHAUSTED
          - validations.priority_52_ERR_DISPUTE_TURN_VIOLATION
          - global_constants.MAX_DISPUTE_ROUNDS
          - entities.Dispute.fields.round_number
          - entities.Dispute.fields.counter_amount_cents
          - calculations.settlement_statement
        distinguishing_aspect: |
          Dispute is a two-node cycle (OPEN -> COUNTERED -> OPEN) where the permitted
          actor is a FUNCTION OF THE STATE, not of the round parity alone: only the
          respondent may counter from OPEN and only the filer may counter from
          COUNTERED. Three counters are accepted (round_number 1, 2, 3) and the fourth
          is refused with ERR_DISPUTE_ROUNDS_EXHAUSTED (409) even though it comes from
          the correct actor, while a counter from the wrong side of the loop is refused
          earlier with ERR_DISPUTE_TURN_VIOLATION (403). Accepting from COUNTERED (not
          from OPEN) settles at the standing counter_amount_cents 3000, not at the
          originally disputed 4700.
        test_recipe:
          setup:
            - "Railroads BN and CX ACTIVE; car type XM; junction JCT-CHI; three CX-owned cars produce BN segments of 8775, 5233 and 4700 gross."
            - "Cycle payer BN / payee CX for 2026-08 computed at 2026-09-01T00:00:00Z (net 18614) and exchanged."
            - "BN (the payer, acting as filer) disputes the 4700 empty-car line for its full amount."
