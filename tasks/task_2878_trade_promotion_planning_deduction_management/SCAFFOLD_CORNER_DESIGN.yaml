      - name: audit_opens_in_scheduled_with_zero_findings
        claim_type: initial_state
        grounds:
          - state_machines.ComplianceAudit.initial_state
          - state_machines.Customer.audit_status.CLEAR_to_AUDIT_IN_PROGRESS
          - entities.ComplianceAudit.fields.findings_count
        distinguishing_aspect: |
          A freshly opened audit is SCHEDULED with findings_count 0,
          recovery_claim_amount 0.00 and issued_at null, and the customer's audit axis
          moves to AUDIT_IN_PROGRESS while its trading axis stays ACTIVE with 0 penalty
          points — opening an audit is not itself a penalty.
        test_recipe:
          setup:
            - "One OPEN program with one customer whose audit_status is CLEAR."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
