# ============================================================================
# §1.9 Scaffold Corner Design — task_2778 Youth Sports Accident Insurance Claims
#
# Breadth probe. Taxonomy is taken verbatim from
# skills/prd-bench-scaffold-generator/references/claim-extraction-guide.md:
# its nine sections are the `section:` values and its per-section table rows are
# the `claim_type:` values. Corners already asserted by a §1.8 instance appear as
# `excluded_because:` stubs naming that instance.
#
# Every money and bps literal below was produced by executing the matching §1.3
# `formula:` against the pinned fixture, never estimated.
# ============================================================================
scaffold_corner_design:

  - section: entities
    instances:

      - name: league_creation_returns_declared_fields_with_sanctioned_default
        claim_type: creation
        grounds:
          - endpoints[POST /leagues]
          - entities.League.fields.sanctioning_status
        distinguishing_aspect: "POST /leagues with all five required inputs returns 201 and echoes every declared field; sanctioning_status defaults to SANCTIONED and version starts at 1. A server that omits the enum default or starts version at 0 fails."
        test_recipe:
          setup: ["Empty database."]
          setup_api_calls: []
          trigger:
            - call: "POST /leagues"
              payload: { name: "Ashfield Youth Sports", league_code: "AYS-100", state_code: "CO", governing_body_code: "USYSA", contact_email: "admin@ays.example" }
              as: ProgramAdministrator
          assert:
            - "HTTP 201 with response_type == object"
            - "data.name == Ashfield Youth Sports, data.league_code == AYS-100, data.state_code == CO, data.governing_body_code == USYSA, data.contact_email == admin@ays.example"
            - "data.sanctioning_status == SANCTIONED (the declared default; no sanctioning_status was supplied)"
            - "data.version == 1 and data.id, data.created_at, data.updated_at are all present and non-null"

      - name: sport_classification_get_by_id_returns_stored_benefit_schedule
        claim_type: retrieval
        grounds:
          - endpoints[GET /sport-classifications/{sport_classification_id}]
          - entities.SportClassification.fields.service_category_caps
        distinguishing_aspect: "GET by id returns the exact row stored by the create call, including the seven-key service_category_caps object; a server that drops or reorders the caps map, or returns only a summary projection, fails."
        test_recipe:
          setup: ["One SportClassification created with a full seven-key benefit schedule."]
          setup_api_calls:
            - call: "POST /sport-classifications"
              payload: { sport_code: "SOCCER_U10", sport_name: "Soccer U10", hazard_class: "CLASS_2_MODERATE", base_rate_per_participant_cents: 1600, deductible_cents: 20000, per_injury_limit_cents: 1000000, cat_attachment_point_cents: 1000000, aggregate_limit_cents: 10000000, cat_lifetime_max_cents: 5000000, minimum_participants: 20, travel_buffer_minutes: 45, service_category_caps: { EMERGENCY_ROOM: 400000, SURGERY: 1500000, DIAGNOSTIC_IMAGING: 250000, PHYSICAL_THERAPY: 18000, DENTAL: 200000, AMBULANCE: 150000, PHYSICIAN_OFFICE: 40000 } }
              as: ProgramAdministrator
              captures: { sport_id: "$.data.id" }
          trigger:
            - call: "GET /sport-classifications/${sport_id}"
              payload: {}
              as: ClaimsExaminer
          assert:
            - "HTTP 200 with data.id == ${sport_id}"
            - "data.sport_code == SOCCER_U10, data.hazard_class == CLASS_2_MODERATE, data.base_rate_per_participant_cents == 1600, data.deductible_cents == 20000, data.travel_buffer_minutes == 45"
            - "data.service_category_caps has exactly the seven keys EMERGENCY_ROOM, SURGERY, DIAGNOSTIC_IMAGING, PHYSICAL_THERAPY, DENTAL, AMBULANCE, PHYSICIAN_OFFICE with values 400000, 1500000, 250000, 18000, 200000, 150000, 40000"

      - name: participant_list_paginates_with_total_count_and_has_more
        claim_type: listing
        grounds:
          - endpoints[GET /participants]
          - response_envelope.pagination_fields
        distinguishing_aspect: "With exactly three participants on the league and limit=2, the first page returns 2 rows with total_count 3 and has_more true, and offset=2 returns 1 row with has_more false. total_count must count the whole filtered set, not the page."
        test_recipe:
          setup: ["One league with exactly three participants and no other league in the database."]
          setup_api_calls:
            - call: "POST /leagues"
              payload: { name: "Brookline Youth Sports", league_code: "BYS-101", state_code: "MA", governing_body_code: "USYSA", contact_email: "admin@bys.example" }
              as: ProgramAdministrator
              captures: { league_id: "$.data.id" }
            - call: "POST /participants"
              payload: { league_id: "${league_id}", first_name: "Anya", last_name: "Petrosyan", date_of_birth: "2014-01-15", guardian_email: "g20@bys.example" }
              as: LeagueAdministrator
              as_user_id: "${league_id}"
            - call: "POST /participants"
              payload: { league_id: "${league_id}", first_name: "Bo", last_name: "Nakamura", date_of_birth: "2014-02-16", guardian_email: "g21@bys.example" }
              as: LeagueAdministrator
              as_user_id: "${league_id}"
            - call: "POST /participants"
              payload: { league_id: "${league_id}", first_name: "Cleo", last_name: "Mbeki", date_of_birth: "2014-03-17", guardian_email: "g22@bys.example" }
              as: LeagueAdministrator
              as_user_id: "${league_id}"
          trigger:
            - call: "GET /participants"
              payload: { league_id: "${league_id}", limit: 2, offset: 0 }
              as: LeagueAdministrator
              as_user_id: "${league_id}"
            - call: "GET /participants"
              payload: { league_id: "${league_id}", limit: 2, offset: 2 }
              as: LeagueAdministrator
              as_user_id: "${league_id}"
          assert:
            - "trigger call 1 returns HTTP 200 with response_type == array, exactly 2 rows in data, total_count == 3 and has_more == true"
            - "trigger call 2 returns HTTP 200 with exactly 1 row in data, total_count == 3 and has_more == false"
            - "the two pages together cover all three participants with no row appearing twice"

      - name: unknown_league_policy_id_returns_league_policy_not_found
        claim_type: not_found
        grounds:
          - validations[priority=5]
          - errors[ERR_LEAGUE_POLICY_NOT_FOUND]
        distinguishing_aspect: "A syntactically valid UUID that matches no row yields 404 ERR_LEAGUE_POLICY_NOT_FOUND, not 400 and not an empty 200; the error code names the missing entity rather than a generic not-found."
        test_recipe:
          setup: ["Empty database - in particular no LeaguePolicy row exists."]
          setup_api_calls: []
          trigger:
            - call: "GET /league-policies/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: ProgramAdministrator
          assert:
            - "HTTP 404 with response_type == error and data.error_id == ERR_LEAGUE_POLICY_NOT_FOUND"

      - name: league_policy_create_without_term_expiration_date_rejected
        claim_type: required_fields
        grounds:
          - validations[priority=4]
          - errors[ERR_INVALID_REQUEST]
          - endpoints[POST /league-policies]
        distinguishing_aspect: "term_expiration_date carries no default, so omitting it must fail the request-shape check with 400 ERR_INVALID_REQUEST before any business rule runs - not silently persist a null term or fall through to the term-date comparison rule at priority 26."
        test_recipe:
          setup: ["One league and one BASEBALL_U12 classification, both valid, so the only defect is the missing field."]
          setup_api_calls:
            - call: "POST /leagues"
              payload: { name: "Cardinal Ridge Baseball", league_code: "CRB-102", state_code: "MO", governing_body_code: "USYSA", contact_email: "admin@crb.example" }
              as: ProgramAdministrator
              captures: { league_id: "$.data.id" }
            - call: "POST /sport-classifications"
              payload: { sport_code: "BASEBALL_U12", sport_name: "Baseball U12", hazard_class: "CLASS_2_MODERATE", base_rate_per_participant_cents: 1850, deductible_cents: 25000, per_injury_limit_cents: 2500000, cat_attachment_point_cents: 2500000, aggregate_limit_cents: 25000000, cat_lifetime_max_cents: 100000000, minimum_participants: 25, travel_buffer_minutes: 60, service_category_caps: { EMERGENCY_ROOM: 500000, SURGERY: 3000000, DIAGNOSTIC_IMAGING: 300000, PHYSICAL_THERAPY: 20000, DENTAL: 350000, AMBULANCE: 200000, PHYSICIAN_OFFICE: 50000 } }
              as: ProgramAdministrator
              captures: { sport_id: "$.data.id" }
          trigger:
            - call: "POST /league-policies"
              payload: { league_id: "${league_id}", sport_classification_id: "${sport_id}", term_effective_date: "2026-03-01", enrolled_participant_count: 404 }
              as: ProgramAdministrator
          assert:
            - "HTTP 400 with data.error_id == ERR_INVALID_REQUEST"
            - "GET /league-policies?league_id=${league_id} returns 0 rows"

      - name: league_policy_create_applies_coverage_basis_and_cat_layer_defaults
        claim_type: defaults
        grounds:
          - entities.LeaguePolicy.fields.coverage_basis_election
          - entities.LeaguePolicy.fields.cat_layer_elected
          - calculations.policy_annual_premium_assembly
        distinguishing_aspect: "Omitting both optional inputs must yield coverage_basis_election EXCESS_ONLY and cat_layer_elected false, which is observable in the premium: cat_layer_charge_cents is 0 and annual_premium_cents is 758378 rather than the 822840 the same 404-participant policy costs with the catastrophic layer elected."
        test_recipe:
          setup: ["One league and one BASEBALL_U12 classification (base rate 1850, hazard CLASS_2_MODERATE)."]
          setup_api_calls:
            - call: "POST /leagues"
              payload: { name: "Deerfield Baseball League", league_code: "DBL-103", state_code: "WI", governing_body_code: "USYSA", contact_email: "admin@dbl.example" }
              as: ProgramAdministrator
              captures: { league_id: "$.data.id" }
            - call: "POST /sport-classifications"
              payload: { sport_code: "BASEBALL_U12", sport_name: "Baseball U12", hazard_class: "CLASS_2_MODERATE", base_rate_per_participant_cents: 1850, deductible_cents: 25000, per_injury_limit_cents: 2500000, cat_attachment_point_cents: 2500000, aggregate_limit_cents: 25000000, cat_lifetime_max_cents: 100000000, minimum_participants: 25, travel_buffer_minutes: 60, service_category_caps: { EMERGENCY_ROOM: 500000, SURGERY: 3000000, DIAGNOSTIC_IMAGING: 300000, PHYSICAL_THERAPY: 20000, DENTAL: 350000, AMBULANCE: 200000, PHYSICIAN_OFFICE: 50000 } }
              as: ProgramAdministrator
              captures: { sport_id: "$.data.id" }
          trigger:
            - call: "POST /league-policies"
              payload: { league_id: "${league_id}", sport_classification_id: "${sport_id}", term_effective_date: "2026-03-01", term_expiration_date: "2027-03-01", enrolled_participant_count: 404 }
              as: ProgramAdministrator
          assert:
            - "HTTP 201 with data.coverage_basis_election == EXCESS_ONLY and data.cat_layer_elected == false"
            - "data.gross_premium_cents == 781833, data.cat_layer_charge_cents == 0, data.premium_subtotal_cents == 781833"
            - "data.volume_credit_bps == 300, data.volume_credit_cents == 23455, data.annual_premium_cents == 758378"
            - "data.status == QUOTED and data.renewal_quote_status == NONE"

      - name: participant_roster_fields_are_computed_from_enrollments
        claim_type: computed_fields
        grounds:
          - entities.Participant.fields.roster_status
          - entities.Participant.fields.enrolled_policy_count
          - endpoints[POST /enrollments]
        distinguishing_aspect: "roster_status and enrolled_policy_count are declared computed, so a freshly created participant reads INACTIVE / 0 even though nothing in the create payload mentions them, and both change to ROSTERED / 1 as a side effect of the enrollment - never from client input, which the endpoint's input list does not even accept."
        test_recipe:
          setup: ["One league, one BASEBALL_U12 classification and one ACTIVE policy; one participant with no enrollment yet."]
          setup_api_calls:
            - call: "POST /leagues"
              payload: { name: "Elmwood Baseball Association", league_code: "EBA-104", state_code: "KS", governing_body_code: "USYSA", contact_email: "admin@eba.example" }
              as: ProgramAdministrator
              captures: { league_id: "$.data.id" }
            - call: "POST /sport-classifications"
              payload: { sport_code: "BASEBALL_U12", sport_name: "Baseball U12", hazard_class: "CLASS_2_MODERATE", base_rate_per_participant_cents: 1850, deductible_cents: 25000, per_injury_limit_cents: 2500000, cat_attachment_point_cents: 2500000, aggregate_limit_cents: 25000000, cat_lifetime_max_cents: 100000000, minimum_participants: 25, travel_buffer_minutes: 60, service_category_caps: { EMERGENCY_ROOM: 500000, SURGERY: 3000000, DIAGNOSTIC_IMAGING: 300000, PHYSICAL_THERAPY: 20000, DENTAL: 350000, AMBULANCE: 200000, PHYSICIAN_OFFICE: 50000 } }
              as: ProgramAdministrator
              captures: { sport_id: "$.data.id" }
            - call: "POST /league-policies"
              payload: { league_id: "${league_id}", sport_classification_id: "${sport_id}", term_effective_date: "2026-03-01", term_expiration_date: "2027-03-01", enrolled_participant_count: 404, coverage_basis_election: "EXCESS_ONLY", cat_layer_elected: true }
              as: ProgramAdministrator
              captures: { pol_id: "$.data.id" }
            - call: "POST /league-policies/${pol_id}/bind"
              payload: {}
              as: ProgramAdministrator
            - call: "POST /league-policies/${pol_id}/activate"
              payload: {}
              as: ProgramAdministrator
            - call: "POST /participants"
              payload: { league_id: "${league_id}", first_name: "Farid", last_name: "Karimov", date_of_birth: "2014-04-18", guardian_email: "g23@eba.example" }
              as: LeagueAdministrator
              as_user_id: "${league_id}"
              captures: { p1_id: "$.data.id" }
          trigger:
            - call: "POST /enrollments"
              payload: { participant_id: "${p1_id}", league_policy_id: "${pol_id}", enrolled_on_date: "2026-03-05" }
              as: LeagueAdministrator
              as_user_id: "${league_id}"
          assert:
            - "before the trigger: GET /participants/${p1_id} shows roster_status == INACTIVE and enrolled_policy_count == 0"
            - "trigger returns HTTP 201 with data.status == ENROLLED, data.coverage_status == COVERED, data.lifetime_cat_benefit_used_cents == 0, data.withdrawn_on_date == null"
            - "after the trigger: GET /participants/${p1_id} shows roster_status == ROSTERED and enrolled_policy_count == 1"

      - name: system_fields_are_server_minted_and_version_increments_on_mutation
        claim_type: system_fields
        grounds:
          - entities.League.fields.sanctioning_status
          - endpoints[POST /leagues/{league_id}/sanctioning-status]
        distinguishing_aspect: "id is a bare UUID with no type prefix, created_at is immutable across a mutation while updated_at is refreshed, and version goes 1 -> 2 on the sanctioning-status write. A server that prefixes ids, mutates created_at, or leaves version at 1 fails."
        test_recipe:
          setup: ["One SANCTIONED league at version 1."]
          setup_api_calls:
            - call: "POST /leagues"
              payload: { name: "Fairmount Athletic League", league_code: "FAL-105", state_code: "OR", governing_body_code: "USYSA", contact_email: "admin@fal.example" }
              as: ProgramAdministrator
              captures: { league_id: "$.data.id", created_at_v1: "$.data.created_at" }
          trigger:
            - call: "POST /leagues/${league_id}/sanctioning-status"
              payload: { sanctioning_status: "PROBATION", reason: "late submission of coach certification records" }
              as: ProgramAdministrator
          assert:
            - "the captured id is a plain 36-character UUID string with no type prefix such as lg_ or league_"
            - "HTTP 200 with data.sanctioning_status == PROBATION and data.version == 2"
            - "data.created_at == ${created_at_v1} (unchanged) while data.updated_at is strictly later than data.created_at"
            - "created_at and updated_at are ISO 8601 UTC timestamps with exactly three fractional-second digits"

      - name: sport_classification_rejects_hazard_class_outside_the_enum
        claim_type: type_constraints
        grounds:
          - validations[priority=4]
          - errors[ERR_INVALID_REQUEST]
          - entities.SportClassification.fields.hazard_class
        distinguishing_aspect: "hazard_class is a four-member enum that drives the premium multiplier, so an out-of-set value must be rejected 400 ERR_INVALID_REQUEST at the request-shape gate rather than defaulted to CLASS_1_LOW or stored verbatim."
        test_recipe:
          setup: ["Empty database."]
          setup_api_calls: []
          trigger:
            - call: "POST /sport-classifications"
              payload: { sport_code: "LACROSSE_U14", sport_name: "Lacrosse U14", hazard_class: "CLASS_5_EXTREME", base_rate_per_participant_cents: 5000, deductible_cents: 30000, per_injury_limit_cents: 2000000, cat_attachment_point_cents: 2000000, aggregate_limit_cents: 20000000, cat_lifetime_max_cents: 5000000, minimum_participants: 18, travel_buffer_minutes: 60, service_category_caps: { EMERGENCY_ROOM: 400000, SURGERY: 2000000, DIAGNOSTIC_IMAGING: 250000, PHYSICAL_THERAPY: 18000, DENTAL: 200000, AMBULANCE: 150000, PHYSICIAN_OFFICE: 40000 } }
              as: ProgramAdministrator
          assert:
            - "HTTP 400 with data.error_id == ERR_INVALID_REQUEST"
            - "GET /sport-classifications returns 0 rows"

      - name: enrollment_rejects_participant_belonging_to_a_different_league
        claim_type: parent_relationships
        grounds:
          - validations[priority=7]
          - errors[ERR_SCOPE_MISMATCH]
          - endpoints[POST /enrollments]
        distinguishing_aspect: "Both foreign keys resolve to live rows, so the priority-6 existence gate passes; the defect is that the Participant's league_id does not match the LeaguePolicy's league_id, which must surface as 422 ERR_SCOPE_MISMATCH rather than a 404. This is the flat/graph-topology cross-reference integrity claim."
        test_recipe:
          setup: ["Two leagues L1 and L2 on the same BASEBALL_U12 classification; L1 holds an ACTIVE policy."]
          setup_api_calls:
            - call: "POST /leagues"
              payload: { name: "Grandview Baseball", league_code: "GVB-106", state_code: "NE", governing_body_code: "USYSA", contact_email: "admin@gvb.example" }
              as: ProgramAdministrator
              captures: { l1_id: "$.data.id" }
            - call: "POST /leagues"
              payload: { name: "Hillcrest Baseball", league_code: "HCB-107", state_code: "NE", governing_body_code: "USYSA", contact_email: "admin@hcb.example" }
              as: ProgramAdministrator
              captures: { l2_id: "$.data.id" }
            - call: "POST /sport-classifications"
              payload: { sport_code: "BASEBALL_U12", sport_name: "Baseball U12", hazard_class: "CLASS_2_MODERATE", base_rate_per_participant_cents: 1850, deductible_cents: 25000, per_injury_limit_cents: 2500000, cat_attachment_point_cents: 2500000, aggregate_limit_cents: 25000000, cat_lifetime_max_cents: 100000000, minimum_participants: 25, travel_buffer_minutes: 60, service_category_caps: { EMERGENCY_ROOM: 500000, SURGERY: 3000000, DIAGNOSTIC_IMAGING: 300000, PHYSICAL_THERAPY: 20000, DENTAL: 350000, AMBULANCE: 200000, PHYSICIAN_OFFICE: 50000 } }
              as: ProgramAdministrator
              captures: { sport_id: "$.data.id" }
            - call: "POST /league-policies"
              payload: { league_id: "${l1_id}", sport_classification_id: "${sport_id}", term_effective_date: "2026-03-01", term_expiration_date: "2027-03-01", enrolled_participant_count: 404, coverage_basis_election: "EXCESS_ONLY", cat_layer_elected: true }
              as: ProgramAdministrator
              captures: { pol1_id: "$.data.id" }
            - call: "POST /league-policies/${pol1_id}/bind"
              payload: {}
              as: ProgramAdministrator
            - call: "POST /league-policies/${pol1_id}/activate"
              payload: {}
              as: ProgramAdministrator
            - call: "POST /participants"
              payload: { league_id: "${l2_id}", first_name: "Gita", last_name: "Ramachandran", date_of_birth: "2014-05-19", guardian_email: "g24@hcb.example" }
              as: LeagueAdministrator
              as_user_id: "${l2_id}"
              captures: { p2_id: "$.data.id" }
          trigger:
            - call: "POST /enrollments"
              payload: { participant_id: "${p2_id}", league_policy_id: "${pol1_id}", enrolled_on_date: "2026-03-05" }
              as: LeagueAdministrator
              as_user_id: "${l1_id}"
          assert:
            - "HTTP 422 with data.error_id == ERR_SCOPE_MISMATCH"
            - "GET /enrollments?league_policy_id=${pol1_id} returns 0 rows"

  - section: state_machines
    instances:

      - name: policy_quoted_to_bound_to_active_happy_path_with_initial_states
        claim_type: valid_transition
        grounds:
          - state_machines.LeaguePolicy.QUOTED_to_BOUND
          - state_machines.LeaguePolicy.BOUND_to_ACTIVE
          - entities.LeaguePolicy.fields.status
        distinguishing_aspect: "A newly created policy starts in the declared initial_state QUOTED; bind moves it to BOUND and activate to ACTIVE, each incrementing version by one, so the terminal read is status ACTIVE at version 3. A server that jumps QUOTED straight to ACTIVE, or that fails to bump version on a pure state action, fails."
        test_recipe:
          setup: ["One league and one BASEBALL_U12 classification (minimum_participants 25); one QUOTED policy with 404 participants."]
          setup_api_calls:
            - call: "POST /leagues"
              payload: { name: "Ironwood Baseball Council", league_code: "IBC-110", state_code: "MT", governing_body_code: "USYSA", contact_email: "admin@ibc.example" }
              as: ProgramAdministrator
              captures: { league_id: "$.data.id" }
            - call: "POST /sport-classifications"
              payload: { sport_code: "BASEBALL_U12", sport_name: "Baseball U12", hazard_class: "CLASS_2_MODERATE", base_rate_per_participant_cents: 1850, deductible_cents: 25000, per_injury_limit_cents: 2500000, cat_attachment_point_cents: 2500000, aggregate_limit_cents: 25000000, cat_lifetime_max_cents: 100000000, minimum_participants: 25, travel_buffer_minutes: 60, service_category_caps: { EMERGENCY_ROOM: 500000, SURGERY: 3000000, DIAGNOSTIC_IMAGING: 300000, PHYSICAL_THERAPY: 20000, DENTAL: 350000, AMBULANCE: 200000, PHYSICIAN_OFFICE: 50000 } }
              as: ProgramAdministrator
              captures: { sport_id: "$.data.id" }
            - call: "POST /league-policies"
              payload: { league_id: "${league_id}", sport_classification_id: "${sport_id}", term_effective_date: "2026-03-01", term_expiration_date: "2027-03-01", enrolled_participant_count: 404, coverage_basis_election: "EXCESS_ONLY", cat_layer_elected: true }
              as: ProgramAdministrator
              captures: { pol_id: "$.data.id" }
          trigger:
            - call: "POST /league-policies/${pol_id}/bind"
              payload: {}
              as: ProgramAdministrator
            - call: "POST /league-policies/${pol_id}/activate"
              payload: {}
              as: ProgramAdministrator
          assert:
            - "before the triggers: LeaguePolicy.${pol_id}.status == QUOTED and version == 1 (the declared initial_state)"
            - "trigger call 1 returns HTTP 200 with data.status == BOUND and data.version == 2"
            - "trigger call 2 returns HTTP 200 with data.status == ACTIVE and data.version == 3"
            - "after both triggers: LeaguePolicy.${pol_id}.annual_premium_cents == 822840 and coverage_posture == OPEN"

      - name: activate_on_a_quoted_policy_that_was_never_bound_rejected
        claim_type: precondition_enforcement
        grounds:
          - validations[priority=8]
          - errors[ERR_INVALID_POLICY_STATE]
          - state_machines.LeaguePolicy.BOUND_to_ACTIVE
        distinguishing_aspect: "activate declares from: BOUND only, so calling it on a QUOTED policy must return 409 ERR_INVALID_POLICY_STATE and leave the row at QUOTED - the transition may not be short-circuited even though the eventual target state is reachable by a legal two-step path."
        test_recipe:
          setup: ["One league, one BASEBALL_U12 classification and one QUOTED policy that has never been bound."]
          setup_api_calls:
            - call: "POST /leagues"
              payload: { name: "Juniper Valley Baseball", league_code: "JVB-111", state_code: "ID", governing_body_code: "USYSA", contact_email: "admin@jvb.example" }
              as: ProgramAdministrator
              captures: { league_id: "$.data.id" }
            - call: "POST /sport-classifications"
              payload: { sport_code: "BASEBALL_U12", sport_name: "Baseball U12", hazard_class: "CLASS_2_MODERATE", base_rate_per_participant_cents: 1850, deductible_cents: 25000, per_injury_limit_cents: 2500000, cat_attachment_point_cents: 2500000, aggregate_limit_cents: 25000000, cat_lifetime_max_cents: 100000000, minimum_participants: 25, travel_buffer_minutes: 60, service_category_caps: { EMERGENCY_ROOM: 500000, SURGERY: 3000000, DIAGNOSTIC_IMAGING: 300000, PHYSICAL_THERAPY: 20000, DENTAL: 350000, AMBULANCE: 200000, PHYSICIAN_OFFICE: 50000 } }
              as: ProgramAdministrator
              captures: { sport_id: "$.data.id" }
            - call: "POST /league-policies"
