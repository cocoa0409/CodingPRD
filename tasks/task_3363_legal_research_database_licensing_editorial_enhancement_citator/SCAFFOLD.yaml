scenario: "Legal Research Database Licensing, Editorial Enhancement & Citator Maintenance (Thomson Reuters Westlaw): primary law collection from courts, legislatures and agencies with rapid ingestion and citation normalization, editorial enhancement through headnote creation, topic classification and synopsis writing by attorney editors, citator maintenance flagging negative treatment with signals derived from citing references and editorial analysis, subscription plans by practice area, jurisdiction and firm size with seat counts and usage overage, transactional versus flat-rate pricing for occasional and government users with cost recovery billing to clients, secondary source licensing including treatises and practice guides with author royalties, search and analytics products with usage monitoring against contract scope, content removal and sealing orders requiring retroactive database changes"
domain_name: legal-research-citator
api_prefix: /legal-research

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: event_sourcing
  complexity_layers:
    - cascading_side_effects
    - dual_variant_calculation
    - optimistic_concurrency
    - rate_threshold_triggers
  entity_topology: flat
  state_machine_shape: parallel
  relationship_patterns:
    - one_to_many
    - many_to_many
    - cross_aggregate
  role_model: segregation_of_duties
  consistency_model: immediate

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# Table 1: Entity-Relationship Table
# =============================================================================
entities:
  - name: PrimaryDocument
    parent: null
    common_fields: true
    fields:
      - {name: source_type, type: enum, source: input, description: "Originating body kind", constraints: "COURT | LEGISLATURE | AGENCY"}
      - {name: jurisdiction_code, type: string, source: input, description: "Jurisdiction code, e.g. US, CA9, NY"}
      - {name: document_type, type: enum, source: input, description: "Primary law kind", constraints: "CASE | STATUTE | REGULATION"}
      - {name: title, type: string, source: input, description: "Document title"}
      - {name: raw_citation_string, type: string, source: input, description: "Citation exactly as received from the source feed"}
      - {name: normalized_citation, type: string, source: computed, description: "Canonical citation produced by citation_normalization at publish; null while RECEIVED; globally unique once set"}
      - {name: decision_date, type: string, source: input, description: "ISO calendar date of decision / enactment / adoption"}
      - {name: ingestion_status, type: enum, source: system, description: "Ingestion dimension state (independent axis 1)", default: RECEIVED, constraints: "RECEIVED | PUBLISHED"}
      - {name: visibility_status, type: enum, source: system, description: "Visibility dimension state (independent axis 2), mutated only by removal-order apply/reverse", default: PUBLIC, constraints: "PUBLIC | SEALED | REMOVED"}
      - {name: citator_score, type: integer, source: computed, description: "Weighted treatment score per citator_signal_derivation; 0 when no qualifying references"}
      - {name: citator_signal, type: enum, source: computed, description: "Signal derived from citator_score, or pinned by editorial override when editorial_override_signal is set", constraints: "GREEN | YELLOW | RED"}
      - {name: editorial_override_signal, type: enum, source: input, description: "Analyst-pinned signal set via citator-override; null means auto derivation", constraints: "GREEN | YELLOW | RED | null"}
      - {name: editorial_override_rationale, type: string, source: input, description: "Free-text rationale recorded with the latest override; null when never overridden"}
      - {name: published_at, type: datetime, source: system, description: "Logical-clock timestamp of the publish transition; null while RECEIVED"}

  - name: CitingReference
    parent: null
    common_fields: true
    fields:
      - {name: citing_document_id, type: string, source: input, description: "FK -> PrimaryDocument.id; the document that contains the citation"}
      - {name: cited_document_id, type: string, source: input, description: "FK -> PrimaryDocument.id; the document being cited"}
      - {name: treatment, type: enum, source: input, description: "Editorial treatment of the cited document", constraints: "OVERRULED | CRITICIZED | QUESTIONED | DISTINGUISHED | FOLLOWED | CITED_NEUTRALLY"}
      - {name: depth, type: enum, source: input, description: "Depth of treatment", constraints: "EXAMINED | DISCUSSED | CITED | MENTIONED"}
      - {name: status, type: enum, source: system, description: "ACTIVE while the citing document is public; flipped to INACTIVE by removal-order cascades and back to ACTIVE by reversal", default: ACTIVE, constraints: "ACTIVE | INACTIVE"}
      - {name: deactivated_by_order_id, type: string, source: system, description: "RemovalOrder.id that flipped this reference to INACTIVE; null while ACTIVE; used by reversal to restore exactly the deactivated set"}

  - name: Headnote
    parent: null
    common_fields: true
    fields:
      - {name: document_id, type: string, source: input, description: "FK -> PrimaryDocument.id; document this headnote enhances"}
      - {name: author_editor_id, type: string, source: system, description: "Opaque X-User-ID of the AttorneyEditor who created the headnote; set from the request header, never from the body"}
      - {name: reviewer_editor_id, type: string, source: system, description: "Opaque X-User-ID of the AttorneyEditor who decided the review; set on decide; null while DRAFT or IN_REVIEW"}
      - {name: topic_code, type: enum, source: input, description: "Topic classification assigned by the author", constraints: "LITIGATION | CORPORATE | TAX | IP | CRIMINAL | FAMILY"}
      - {name: headnote_text, type: string, source: input, description: "Headnote body text"}
      - {name: synopsis_text, type: string, source: input, description: "Synopsis written by the attorney editor"}
      - {name: review_note, type: string, source: system, description: "Reviewer note recorded at decide; null until first decide"}
      - {name: status, type: enum, source: system, description: "Editorial workflow state", default: DRAFT, constraints: "DRAFT | IN_REVIEW | PUBLISHED | RETRACTED"}

  - name: SubscriptionPlan
    parent: null
    common_fields: true
    fields:
      - {name: name, type: string, source: input, description: "Plan display name"}
      - {name: practice_area, type: enum, source: input, description: "Practice-area scope of content", constraints: "LITIGATION | CORPORATE | TAX | IP | CRIMINAL | FAMILY | ALL"}
      - {name: jurisdiction_scope, type: enum, source: input, description: "Jurisdiction coverage", constraints: "FEDERAL | STATE | NATIONAL"}
      - {name: firm_size_tier, type: enum, source: input, description: "Target firm size", constraints: "SOLO | SMALL | MID | LARGE"}
      - {name: billing_model, type: enum, source: input, description: "FLAT_RATE = monthly fee + included quotas + overage; TRANSACTIONAL = pure per-event fees", constraints: "FLAT_RATE | TRANSACTIONAL"}
      - {name: monthly_fee_cents, type: integer, source: input, description: "Flat monthly base fee; required for FLAT_RATE, ignored for TRANSACTIONAL"}
      - {name: included_searches, type: integer, source: input, description: "Included SEARCH events per invoice period; FLAT_RATE only"}
      - {name: included_doc_views, type: integer, source: input, description: "Included DOC_VIEW events per invoice period; FLAT_RATE only"}
      - {name: overage_search_fee_cents, type: integer, source: input, description: "Per-SEARCH overage fee before volume discount; FLAT_RATE only"}
      - {name: overage_doc_view_fee_cents, type: integer, source: input, description: "Per-DOC_VIEW overage fee before volume discount; FLAT_RATE only"}
      - {name: volume_discount_pct, type: number, source: input, description: "Volume discount fraction applied to overage components when the combined overage units reach the threshold; FLAT_RATE only"}
      - {name: discount_threshold_overage_units, type: integer, source: input, description: "Combined overage units at which the volume discount applies (>= comparison)"}
      - {name: per_search_fee_cents, type: integer, source: input, description: "Per-SEARCH fee; TRANSACTIONAL only"}
      - {name: per_doc_view_fee_cents, type: integer, source: input, description: "Per-DOC_VIEW fee; TRANSACTIONAL only"}
      - {name: scope_enforcement, type: enum, source: input, description: "HARD rejects out-of-scope usage events; SOFT records them with in_scope=false", constraints: "HARD | SOFT"}
      - {name: government_only, type: boolean, source: input, description: "When true only SubscriberAccount with account_type GOVERNMENT may subscribe"}
      - {name: cost_recovery_allowed, type: boolean, source: input, description: "When true subscriptions on this plan may bill usage back to client matter codes"}
      - {name: bulk_hourly_limit, type: integer, source: input, description: "Max usage events per user per trailing 60 minutes; default DEFAULT_BULK_HOURLY_LIMIT when omitted", default: 100}
      - {name: bulk_daily_limit, type: integer, source: input, description: "Max usage events per user per UTC day; default DEFAULT_BULK_DAILY_LIMIT when omitted", default: 500}

  - name: SubscriberAccount
    parent: null
    common_fields: true
    fields:
      - {name: org_name, type: string, source: input, description: "Organization name"}
      - {name: account_type, type: enum, source: input, description: "Kind of subscriber organization", constraints: "LAW_FIRM | GOVERNMENT | CORPORATE"}
      - {name: cost_recovery_enabled, type: boolean, source: input, description: "When true every usage event must carry a matter_code and invoices expose cost_recovery_allocation"}

  - name: Subscription
    parent: null
    common_fields: true
    fields:
      - {name: account_id, type: string, source: input, description: "FK -> SubscriberAccount.id; subscribing organization"}
      - {name: plan_id, type: string, source: input, description: "FK -> SubscriptionPlan.id; current plan (mutable via change-plan)"}
      - {name: period_start, type: string, source: input, description: "ISO date; contract period start (inclusive)"}
      - {name: period_end, type: string, source: input, description: "ISO date; contract period end (exclusive); half-open [period_start, period_end)"}
      - {name: seats_total, type: integer, source: input, description: "Purchased seat count; > 0"}
      - {name: seats_used, type: integer, source: computed, description: "Count of SubscriberUser rows with seat_subscription_id == this subscription and seat_status == ACTIVE"}
      - {name: status, type: enum, source: system, description: "Lifecycle state", default: ACTIVE, constraints: "ACTIVE | SUSPENDED | CANCELLED"}
      - {name: suspension_reason, type: enum, source: system, description: "Why the subscription is SUSPENDED; null while ACTIVE", constraints: "MANUAL | INVOICE_OVERDUE | null"}

  - name: SubscriberUser
    parent: null
    common_fields: true
    fields:
      - {name: account_id, type: string, source: system, description: "FK -> SubscriberAccount.id; owning account, copied from the seat-assigning subscription's account"}
      - {name: email, type: string, source: input, description: "User email; unique within the account"}
      - {name: full_name, type: string, source: input, description: "User display name"}
      - {name: seat_status, type: enum, source: system, description: "Whether the user currently holds a seat", default: NONE, constraints: "NONE | ACTIVE"}
      - {name: seat_subscription_id, type: string, source: system, description: "FK -> Subscription.id; subscription the seat belongs to; null when seat_status == NONE"}

  - name: UsageEvent
    parent: null
    common_fields: false
    fields:
      - {name: subscription_id, type: string, source: system, description: "FK -> Subscription.id; derived from the acting user's seat, never from the request body"}
      - {name: user_id, type: string, source: system, description: "FK -> SubscriberUser.id; acting researcher, copied from X-User-ID"}
      - {name: event_type, type: enum, source: input, description: "Metered event kind", constraints: "SEARCH | DOC_VIEW"}
      - {name: practice_area_tag, type: enum, source: input, description: "Practice area of the content touched", constraints: "LITIGATION | CORPORATE | TAX | IP | CRIMINAL | FAMILY"}
      - {name: license_agreement_id, type: string, source: input, description: "FK -> LicenseAgreement.id; set only when a DOC_VIEW hits a licensed secondary work; null otherwise"}
      - {name: matter_code, type: string, source: input, description: "Client matter code for cost recovery; required when the account has cost_recovery_enabled, must be omitted otherwise"}
      - {name: in_scope, type: boolean, source: computed, description: "true when practice_area_tag matches the plan practice_area (or plan practice_area == ALL); false records are kept but flagged"}
      - {name: occurred_at, type: datetime, source: system, description: "Logical-clock timestamp at creation; immutable"}

  - name: Invoice
    parent: null
    common_fields: true
    fields:
      - {name: subscription_id, type: string, source: input, description: "FK -> Subscription.id; billed subscription"}
      - {name: period_start, type: string, source: input, description: "ISO date; billing window start (inclusive)"}
      - {name: period_end, type: string, source: input, description: "ISO date; billing window end (exclusive)"}
      - {name: billing_model, type: string, source: system, description: "Snapshot of the subscription's plan billing_model at generation time"}
      - {name: base_fee_cents, type: integer, source: computed, description: "Flat base fee charged (0 for TRANSACTIONAL)"}
      - {name: search_count, type: integer, source: computed, description: "SEARCH events in window"}
      - {name: doc_view_count, type: integer, source: computed, description: "DOC_VIEW events in window"}
      - {name: overage_search_units, type: integer, source: computed, description: "max(0, search_count - included_searches) for FLAT_RATE; 0 for TRANSACTIONAL"}
      - {name: overage_view_units, type: integer, source: computed, description: "max(0, doc_view_count - included_doc_views) for FLAT_RATE; 0 for TRANSACTIONAL"}
      - {name: overage_fee_cents, type: integer, source: computed, description: "Sum of per-component rounded overage components per invoice_total_calculation; 0 for TRANSACTIONAL"}
      - {name: total_cents, type: integer, source: computed, description: "Invoice total per invoice_total_calculation"}
      - {name: cost_recovery_allocation, type: array, source: computed, description: "Per-matter allocation rows [{matter_code, event_count, amount_cents}] per cost_recovery_allocation; empty array when the account is not cost-recovery enabled"}
      - {name: status, type: enum, source: system, description: "Billing lifecycle state", default: DRAFT, constraints: "DRAFT | ISSUED | OVERDUE | PAID | VOID"}
      - {name: issued_at, type: datetime, source: system, description: "Logical-clock timestamp of issuance; null until ISSUED"}
      - {name: due_at, type: datetime, source: system, description: "issued_at + NET_TERMS_DAYS; null until ISSUED"}

  - name: LicenseAgreement
    parent: null
    common_fields: true
    fields:
      - {name: work_title, type: string, source: input, description: "Title of the licensed treatise / practice guide"}
      - {name: author_name, type: string, source: input, description: "Author (royalty recipient) name"}
      - {name: practice_area, type: enum, source: input, description: "Practice area of the work", constraints: "LITIGATION | CORPORATE | TAX | IP | CRIMINAL | FAMILY"}
      - {name: royalty_basis, type: enum, source: input, description: "Royalty algorithm selector", constraints: "PER_VIEW | REVENUE_SHARE"}
      - {name: per_view_fee_cents, type: integer, source: input, description: "Royalty per DOC_VIEW; required for PER_VIEW, ignored otherwise"}
      - {name: revenue_share_bps, type: integer, source: input, description: "Royalty basis points of the period revenue base; required for REVENUE_SHARE, ignored otherwise"}
      - {name: exclusive, type: boolean, source: input, description: "Exclusive-licensing flag; exclusive windows per practice_area must not overlap (half-open semantics)"}
      - {name: window_start, type: string, source: input, description: "ISO date; license window start (inclusive); half-open [window_start, window_end)"}
      - {name: window_end, type: string, source: input, description: "ISO date; license window end (exclusive)"}
      - {name: status, type: enum, source: system, description: "Agreement lifecycle", default: ACTIVE, constraints: "ACTIVE | TERMINATED"}

  - name: RoyaltyStatement
    parent: null
    common_fields: false
    fields:
      - {name: license_agreement_id, type: string, source: input, description: "FK -> LicenseAgreement.id; agreement being settled"}
      - {name: period_start, type: string, source: input, description: "ISO date; settlement window start (inclusive)"}
      - {name: period_end, type: string, source: input, description: "ISO date; settlement window end (exclusive)"}
      - {name: view_count, type: integer, source: computed, description: "DOC_VIEW UsageEvents carrying this license_agreement_id with occurred_at in the window"}
      - {name: revenue_base_cents, type: integer, source: computed, description: "Sum of total_cents of ISSUED/PAID invoices overlapping the window whose subscription plan practice_area equals the agreement practice_area; 0 for PER_VIEW"}
      - {name: royalty_amount_cents, type: integer, source: computed, description: "Royalty per royalty_amount_calculation; immutable once written"}

  - name: RemovalOrder
    parent: null
    common_fields: true
    fields:
      - {name: document_id, type: string, source: input, description: "FK -> PrimaryDocument.id; target of the sealing/removal order"}
      - {name: scope, type: enum, source: input, description: "SEAL hides content but keeps metadata; REMOVE retroactively withdraws the document", constraints: "SEAL | REMOVE"}
      - {name: effective_from, type: string, source: input, description: "ISO date; order window start (inclusive); CLOSED interval [effective_from, effective_until]"}
      - {name: effective_until, type: string, source: input, description: "ISO date; order window end (inclusive); CLOSED interval"}
      - {name: reason, type: string, source: input, description: "Court-order reference text"}
      - {name: status, type: enum, source: system, description: "Order lifecycle", default: RECEIVED, constraints: "RECEIVED | APPLIED | REVERSED"}

# =============================================================================
# Table 2: State Machine Table
# =============================================================================
state_machines:
  - entity: PrimaryDocument
    initial_state: RECEIVED
    terminal_states: []
    note: |
      Two independent state dimensions live on this entity. Axis 1 (ingestion_status):
      RECEIVED -> PUBLISHED. Axis 2 (visibility_status): PUBLIC -> SEALED | REMOVED,
      SEALED -> PUBLIC, REMOVED -> PUBLIC. The axes evolve independently: a document
      may be sealed while still RECEIVED, then published into (PUBLISHED, SEALED).
      citator_signal / citator_score are derived fields, not a third axis.
    transitions:
      - from: RECEIVED
        to: PUBLISHED
        trigger: "POST /legal-research/documents/{id}/publish"
        actor: ContentIngester
        preconditions:
          - "ingestion_status == RECEIVED (visibility_status may be PUBLIC, SEALED, or REMOVED)"
          - "normalized form of raw_citation_string (per citation_normalization) is globally unique among documents with normalized_citation set"
          - "every entry in the references payload: cited_document_id exists, != document id, and targets a document with ingestion_status == PUBLISHED"
        side_effects:
          - "sets normalized_citation via citation_normalization; sets ingestion_status=PUBLISHED, published_at=logical clock"
          - "creates one CitingReference (status ACTIVE) per references payload entry"
          - "for each newly created reference, recomputes the cited document's citator_score and citator_signal via citator_signal_derivation (this recompute may itself change the cited document's signal field and bump its version)"
          - "increments PrimaryDocument.version by 1"
      - from: PUBLIC
        to: SEALED
        trigger: "POST /legal-research/removal-orders/{id}/transition with target_status=APPLIED and scope=SEAL (system applies to the order's document)"
        actor: system
        preconditions:
          - "the triggering RemovalOrder reaches APPLIED and its document.visibility_status == PUBLIC"
        side_effects:
          - "every CitingReference with citing_document_id == document.id and status == ACTIVE flips to INACTIVE with deactivated_by_order_id = order.id; each flip recomputes the cited document's citator_score/citator_signal (depth-3 chain: order -> document -> reference -> cited document)"
          - "every Headnote of the document with status == PUBLISHED flips to RETRACTED (permanent: reversal does not restore headnotes)"
          - "increments PrimaryDocument.version by 1"
      - from: PUBLIC
        to: REMOVED
        trigger: "POST /legal-research/removal-orders/{id}/transition with target_status=APPLIED and scope=REMOVE"
        actor: system
        preconditions:
          - "the triggering RemovalOrder reaches APPLIED and its document.visibility_status == PUBLIC"
        side_effects:
          - "identical cascade as PUBLIC->SEALED (references INACTIVE, cited-document citator recompute, headnotes RETRACTED)"
          - "subsequent GET /legal-research/documents/{id} returns ERR_DOCUMENT_REMOVED"
          - "increments PrimaryDocument.version by 1"
      - from: SEALED
        to: PUBLIC
        trigger: "POST /legal-research/removal-orders/{id}/transition with target_status=REVERSED"
        actor: system
        preconditions:
          - "the triggering RemovalOrder reaches REVERSED and its document.visibility_status == SEALED"
        side_effects:
          - "every CitingReference with deactivated_by_order_id == order.id flips back to ACTIVE (deactivated_by_order_id := null); each reactivation recomputes the cited document's citator_score/citator_signal, restoring the pre-apply values"
          - "headnotes stay RETRACTED (retraction is not compensated)"
          - "increments PrimaryDocument.version by 1"
      - from: REMOVED
        to: PUBLIC
        trigger: "POST /legal-research/removal-orders/{id}/transition with target_status=REVERSED"
        actor: system
        preconditions:
          - "the triggering RemovalOrder reaches REVERSED and its document.visibility_status == REMOVED"
        side_effects:
          - "identical restoration as SEALED->PUBLIC"
          - "increments PrimaryDocument.version by 1"

  - entity: Headnote
    initial_state: DRAFT
    terminal_states: [RETRACTED]
    transitions:
      - from: DRAFT
        to: IN_REVIEW
        trigger: "POST /legal-research/headnotes/{id}/submit"
        actor: AttorneyEditor
        preconditions:
          - "X-User-ID == headnote.author_editor_id"
          - "headnote.status == DRAFT"
          - "document.ingestion_status == PUBLISHED"
          - "document.visibility_status == PUBLIC"
        side_effects:
          - "increments Headnote.version by 1"
      - from: IN_REVIEW
        to: PUBLISHED
        trigger: "POST /legal-research/headnotes/{id}/decide with decision=APPROVE"
        actor: AttorneyEditor
        preconditions:
          - "headnote.status == IN_REVIEW"
          - "X-User-ID != headnote.author_editor_id (segregation of duties)"
          - "document.ingestion_status == PUBLISHED"
          - "document.visibility_status == PUBLIC"
        side_effects:
          - "sets reviewer_editor_id = X-User-ID and review_note from payload"
          - "increments Headnote.version by 1"
      - from: IN_REVIEW
        to: DRAFT
        trigger: "POST /legal-research/headnotes/{id}/decide with decision=REJECT"
        actor: AttorneyEditor
        preconditions:
          - "headnote.status == IN_REVIEW"
          - "X-User-ID != headnote.author_editor_id"
        side_effects:
          - "sets reviewer_editor_id = X-User-ID and review_note from payload (author may revise and resubmit; the DRAFT->IN_REVIEW->DRAFT loop is unbounded)"
          - "increments Headnote.version by 1"
      - from: PUBLISHED
        to: RETRACTED
        trigger: "system cascade from the document's PUBLIC->SEALED or PUBLIC->REMOVED transition"
        actor: system
        preconditions:
          - "headnote.status == PUBLISHED"
        side_effects:
          - "terminal; no transition out of RETRACTED (removal-order reversal does not restore headnotes)"
          - "increments Headnote.version by 1"

  - entity: Subscription
    initial_state: ACTIVE
    terminal_states: [CANCELLED]
    transitions:
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /legal-research/subscriptions/{id}/status with target_status=SUSPENDED, or system cascade when one of its invoices becomes OVERDUE"
        actor: LicensingManager | system
        preconditions:
          - "status == ACTIVE"
        side_effects:
          - "suspension_reason := MANUAL (manual) or INVOICE_OVERDUE (system cascade)"
          - "seats are NOT released on suspension; usage events are rejected while SUSPENDED"
          - "increments Subscription.version by 1"
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /legal-research/subscriptions/{id}/status with target_status=ACTIVE, or system cascade after an invoice VOID/PAID leaves no ISSUED/OVERDUE invoices"
        actor: LicensingManager | system
        preconditions:
          - "status == SUSPENDED"
          - "manual resume always allowed; system resume only when suspension_reason == INVOICE_OVERDUE and no ISSUED or OVERDUE invoice remains for the subscription"
        side_effects:
          - "suspension_reason := null"
          - "increments Subscription.version by 1"
      - from: ACTIVE
        to: CANCELLED
        trigger: "POST /legal-research/subscriptions/{id}/status with target_status=CANCELLED"
        actor: LicensingManager
        preconditions:
          - "status == ACTIVE"
        side_effects:
          - "every SubscriberUser with seat_subscription_id == subscription.id: seat_status := NONE, seat_subscription_id := null; seats_used := 0"
          - "every DRAFT invoice of the subscription -> VOID"
          - "increments Subscription.version by 1"
      - from: SUSPENDED
        to: CANCELLED
        trigger: "POST /legal-research/subscriptions/{id}/status with target_status=CANCELLED"
        actor: LicensingManager
        preconditions:
          - "status == SUSPENDED"
        side_effects:
          - "identical compensation as ACTIVE->CANCELLED (seats released, DRAFT invoices voided)"
          - "increments Subscription.version by 1"

  - entity: Invoice
    initial_state: DRAFT
    terminal_states: [PAID, VOID]
    note: |
      OVERDUE is materialized lazily: before handling any request that reads or
      writes an invoice (or its subscription), the system first flips every ISSUED
      invoice with due_at < logical clock to OVERDUE and applies the subscription
      suspension cascade. No wall-clock dependency exists; the logical clock alone
      drives this.
    transitions:
      - from: DRAFT
        to: ISSUED
        trigger: "POST /legal-research/invoices/{id}/transition with target_status=ISSUED"
        actor: BillingAdmin
        preconditions:
          - "status == DRAFT"
        side_effects:
          - "issued_at := logical clock; due_at := issued_at + NET_TERMS_DAYS"
          - "the invoice period is now closed: later usage events whose occurred_at falls inside [period_start, period_end) are rejected with ERR_INVOICE_PERIOD_CLOSED"
          - "increments Invoice.version by 1"
      - from: ISSUED
        to: OVERDUE
        trigger: "system lazy materialization when logical clock > due_at and invoice unpaid"
        actor: system
        preconditions:
          - "status == ISSUED and due_at < logical clock"
        side_effects:
          - "subscription -> SUSPENDED with suspension_reason=INVOICE_OVERDUE (if still ACTIVE)"
          - "increments Invoice.version by 1"
      - from: ISSUED
        to: PAID
        trigger: "POST /legal-research/invoices/{id}/transition with target_status=PAID"
        actor: BillingAdmin
        preconditions:
          - "status == ISSUED"
        side_effects:
          - "system evaluates subscription auto-resume (resume when suspension_reason == INVOICE_OVERDUE and no ISSUED/OVERDUE invoice remains)"
          - "increments Invoice.version by 1"
      - from: OVERDUE
        to: PAID
        trigger: "POST /legal-research/invoices/{id}/transition with target_status=PAID"
        actor: BillingAdmin
        preconditions:
          - "status == OVERDUE"
        side_effects:
          - "same auto-resume evaluation as ISSUED->PAID"
          - "increments Invoice.version by 1"
      - from: ISSUED
        to: VOID
        trigger: "POST /legal-research/invoices/{id}/transition with target_status=VOID"
        actor: BillingAdmin
        preconditions:
          - "status == ISSUED"
        side_effects:
          - "the invoice's total_cents stops counting toward outstanding balance and royalty revenue bases"
          - "system evaluates subscription auto-resume (depth-2 chain: VOID -> balance recompute -> subscription ACTIVE)"
          - "increments Invoice.version by 1"
      - from: OVERDUE
        to: VOID
        trigger: "POST /legal-research/invoices/{id}/transition with target_status=VOID"
        actor: BillingAdmin
        preconditions:
          - "status == OVERDUE"
        side_effects:
          - "identical to ISSUED->VOID"
          - "increments Invoice.version by 1"
      - from: DRAFT
        to: VOID
        trigger: "POST /legal-research/invoices/{id}/transition with target_status=VOID, or system cascade from subscription cancellation"
        actor: BillingAdmin | system
        preconditions:
          - "status == DRAFT"
        side_effects:
          - "no balance effect (DRAFT never counted)"
          - "increments Invoice.version by 1"

  - entity: RemovalOrder
    initial_state: RECEIVED
    terminal_states: [REVERSED]
    transitions:
      - from: RECEIVED
        to: APPLIED
        trigger: "POST /legal-research/removal-orders/{id}/transition with target_status=APPLIED"
        actor: ComplianceOfficer
        preconditions:
          - "status == RECEIVED"
          - "logical clock date >= effective_from"
          - "document.visibility_status == PUBLIC"
        side_effects:
          - "applies the document visibility transition (PUBLIC->SEALED or PUBLIC->REMOVED) with its full cascade"
          - "increments RemovalOrder.version by 1"
      - from: APPLIED
        to: REVERSED
        trigger: "POST /legal-research/removal-orders/{id}/transition with target_status=REVERSED"
        actor: ComplianceOfficer
        preconditions:
          - "status == APPLIED"
        side_effects:
          - "applies the document visibility restoration (SEALED->PUBLIC or REMOVED->PUBLIC) with its full cascade"
          - "increments RemovalOrder.version by 1"

  - entity: LicenseAgreement
    initial_state: ACTIVE
    terminal_states: [TERMINATED]
    transitions:
      - from: ACTIVE
        to: TERMINATED
        trigger: "POST /legal-research/license-agreements/{id}/terminate"
        actor: LicensingManager
        preconditions:
          - "status == ACTIVE"
        side_effects:
          - "usage events carrying this license_agreement_id are rejected from now on"
          - "royalty statements for windows ending after termination are rejected"
          - "increments LicenseAgreement.version by 1"

  - entity: CitingReference
    initial_state: ACTIVE
    terminal_states: []
    note: "Rows are created only by the publish cascade; status flips are driven exclusively by removal-order apply/reverse cascades (no direct client endpoint)."
    transitions:
      - from: ACTIVE
        to: INACTIVE
        trigger: "system cascade from the citing document's PUBLIC->SEALED or PUBLIC->REMOVED transition"
        actor: system
        preconditions:
          - "status == ACTIVE and citing document lost PUBLIC visibility"
        side_effects:
          - "deactivated_by_order_id := triggering order id"
          - "cited document citator_score/citator_signal recomputed"
          - "increments CitingReference.version by 1"
      - from: INACTIVE
        to: ACTIVE
        trigger: "system cascade from removal-order reversal"
        actor: system
        preconditions:
          - "deactivated_by_order_id == the reversed order's id"
        side_effects:
          - "deactivated_by_order_id := null"
          - "cited document citator_score/citator_signal recomputed (restores pre-apply values)"
          - "increments CitingReference.version by 1"

# =============================================================================
# Concurrency Rules (OCC only — see SKILL.md §1.2.1)
# =============================================================================
concurrency_rules:
  - rule_id: citator-override-stale-version
    parent_entity: PrimaryDocument
    write_endpoint: "POST /legal-research/documents/{id}/citator-override"
    occ_field: expected_document_version
    description: |
      A citator override legitimately supersedes any earlier override on the same
      document, so no state field rejects a second, stale write. The endpoint
      therefore requires expected_document_version; when the document's version has
      advanced past the client's last observed value (e.g., another override or a
      cascade recompute landed meanwhile), the write is rejected as stale.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: subscription-change-plan-stale-version
    parent_entity: Subscription
    write_endpoint: "PATCH /legal-research/subscriptions/{id}/change-plan"
    occ_field: expected_subscription_version
    description: |
      A plan change legitimately supersedes any earlier plan value, so a second
      plan change carrying a previously observed subscription version sees no
      rejecting state field. The endpoint requires expected_subscription_version
      and rejects the write as stale when the subscription's version has advanced
      (seat operations, suspensions, and earlier plan changes all bump it).
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# Table 3: Calculation Rules Table
# =============================================================================
calculations:
  - name: citation_normalization
    trigger: "POST /legal-research/documents/{id}/publish (before the ingestion transition commits)"
    algorithm: string_normalization
    formula: |
      normalized = raw_citation_string
        -> trim leading/trailing whitespace
        -> uppercase (ASCII)
        -> remove every '.' character
        -> collapse every run of internal whitespace to a single space
      Example: "123 F.3d  456" -> "123 F3D 456"
    input_set: "the publishing document's raw_citation_string"
    constants:
      NORMALIZATION_RULE: "uppercase, strip dots, collapse whitespace"
    precision: "exact string transform; no numeric rounding"
    variants: []

  - name: citator_signal_derivation
    trigger: "after any CitingReference creation (publish cascade), after any reference ACTIVE<->INACTIVE flip (removal cascades), and after any citator override write"
    algorithm: weighted_scoring
    formula: |
      eligible = CitingReference r where r.cited_document_id == document.id
                 AND r.status == ACTIVE
                 AND citing(r).ingestion_status == PUBLISHED
                 AND citing(r).visibility_status == PUBLIC
      score = SUM over eligible r of WEIGHT[r.treatment][r.depth]   (empty set -> score 0)
      AUTO_DERIVED variant (editorial_override_signal IS NULL):
        signal = RED    if score >= SIGNAL_RED_MIN
               = YELLOW if score >= SIGNAL_YELLOW_MIN   (and < SIGNAL_RED_MIN)
               = GREEN  otherwise                       (score may be negative)
      EDITORIAL_OVERRIDE variant (editorial_override_signal IS NOT NULL):
        signal = editorial_override_signal   (score is still computed and stored)
    input_set: "ACTIVE CitingReference rows whose citing document is PUBLISHED and PUBLIC"
    constants:
      WEIGHT_OVERRULED: {EXAMINED: 100, DISCUSSED: 80, CITED: 50, MENTIONED: 20}
      WEIGHT_CRITICIZED: {EXAMINED: 60, DISCUSSED: 45, CITED: 25, MENTIONED: 10}
      WEIGHT_QUESTIONED: {EXAMINED: 50, DISCUSSED: 35, CITED: 20, MENTIONED: 8}
      WEIGHT_DISTINGUISHED: {EXAMINED: 20, DISCUSSED: 15, CITED: 8, MENTIONED: 3}
      WEIGHT_FOLLOWED: {EXAMINED: -30, DISCUSSED: -20, CITED: -10, MENTIONED: -4}
      WEIGHT_CITED_NEUTRALLY: {EXAMINED: 0, DISCUSSED: 0, CITED: 0, MENTIONED: 0}
      SIGNAL_RED_MIN: 80
      SIGNAL_YELLOW_MIN: 40
    precision: "integer arithmetic; exact"
    variants:
      - name: AUTO_DERIVED
        when: "editorial_override_signal IS NULL"
        difference: "signal is thresholded from citator_score"
      - name: EDITORIAL_OVERRIDE
        when: "editorial_override_signal IS NOT NULL"
        difference: "signal equals the override regardless of score; identical reference set yields a different signal than AUTO_DERIVED whenever the override disagrees with the threshold result"

  - name: invoice_total_calculation
    trigger: "POST /legal-research/invoices/generate"
    algorithm: tiered_pricing
    formula: |
      events = UsageEvent e where e.subscription_id == subscription.id
               AND period_start <= e.occurred_at < period_end   (both in_scope true and false count)
      search_count  = count(events, event_type == SEARCH)
      doc_view_count = count(events, event_type == DOC_VIEW)
      plan = subscription's CURRENT plan snapshot at generation time

      FLAT_RATE variant:
        base_fee_cents = plan.monthly_fee_cents
        overage_search_units = max(0, search_count - plan.included_searches)
        overage_view_units   = max(0, doc_view_count - plan.included_doc_views)
        if overage_search_units + overage_view_units >= plan.discount_threshold_overage_units:
          # ROUNDING ORDER IS PINNED: round EACH component first, THEN sum.
          search_component = round_half_up(overage_search_units * plan.overage_search_fee_cents * (1 - plan.volume_discount_pct))
          view_component   = round_half_up(overage_view_units   * plan.overage_doc_view_fee_cents * (1 - plan.volume_discount_pct))
        else:
          search_component = overage_search_units * plan.overage_search_fee_cents
          view_component   = overage_view_units   * plan.overage_doc_view_fee_cents
        overage_fee_cents = search_component + view_component
        total_cents = base_fee_cents + overage_fee_cents
        (Summing the raw components and rounding once would give a different cent
         value; e.g. 3 overage searches @250 + 3 overage views @105 at 15% discount:
         per-component 638 + 268 = 906, sum-then-round = round(1065 * 0.85) = 905.)

      TRANSACTIONAL variant:
        base_fee_cents = 0; overage_*_units = 0; overage_fee_cents = 0
        total_cents = search_count * plan.per_search_fee_cents
                    + doc_view_count * plan.per_doc_view_fee_cents
        (no included quotas, no volume discount, no base fee)
    input_set: "all UsageEvent rows of the subscription whose occurred_at falls in [period_start, period_end)"
    constants:
      ROUNDING: "round_half_up to whole cents, applied per overage component before summation"
      DISCOUNT_COMPARISON: ">= (combined units exactly at the threshold DO discount)"
    precision: "integer cents; round_half_up per component"
    variants:
      - name: FLAT_RATE
        when: "subscription plan billing_model == FLAT_RATE"
        difference: "base fee + included quotas + discounted overage components"
      - name: TRANSACTIONAL
        when: "subscription plan billing_model == TRANSACTIONAL"
        difference: "pure per-event fees on the same event counts; identical usage yields a different total (e.g. 5 searches + 4 views: FLAT example plan -> 5906 cents, TRANSACTIONAL example plan -> 1980 cents)"

  - name: usage_scope_monitoring
    trigger: "POST /legal-research/usage-events (before the event is recorded)"
    algorithm: threshold
    formula: |
      hourly = count of the acting user's UsageEvents with occurred_at in (clock - 60 minutes, clock]
      daily  = count of the acting user's UsageEvents with occurred_at on the clock's UTC calendar date
      reject with ERR_BULK_RATE_EXCEEDED when hourly >= plan.bulk_hourly_limit
                                        OR daily  >= plan.bulk_daily_limit
      (boundary: the event that would make the count EQUAL to the limit is allowed;
       the next one, which would exceed it, is rejected)
      in_scope = (plan.practice_area == ALL) OR (event.practice_area_tag == plan.practice_area)
      when plan.scope_enforcement == HARD and in_scope == false: reject with ERR_USAGE_OUT_OF_SCOPE
      when plan.scope_enforcement == SOFT and in_scope == false: record with in_scope=false
    input_set: "the acting user's prior UsageEvent rows"
    constants:
      DEFAULT_BULK_HOURLY_LIMIT: 100
      DEFAULT_BULK_DAILY_LIMIT: 500
    precision: "exact integer counts; logical clock only"
    variants: []

  - name: cost_recovery_allocation
    trigger: "POST /legal-research/invoices/generate when the subscription's account has cost_recovery_enabled == true"
    algorithm: waterfall_allocation
    formula: |
      matters = distinct matter_code over the invoice's event set (sorted matter_code ASC)
      event_count(m) = events carrying matter_code m
      raw(m) = invoice.total_cents * event_count(m) / total_event_count
      amount(m) = floor(raw(m))                        # first pass: floor every bucket
      remainder = total_cents - SUM(amount)            # leftover cents, 0 <= remainder < |matters|
      distribute remainder one cent at a time to matters ordered by
        (event_count(m) DESC, matter_code ASC)          # pinned tie-break; ids never used
      Worked example (total_cents = 5906, M-A:4 events, M-B:3, M-C:2):
        floors: 2624 / 1968 / 1312 (sum 5904), remainder 2
        -> M-A 2625, M-B 1969, M-C 1312 (sum 5906)
    input_set: "the invoice's UsageEvent set, grouped by matter_code"
    constants:
      REMAINDER_RULE: "floor then one-cent passes by (event_count DESC, matter_code ASC)"
    precision: "integer cents; floor first pass"
    variants: []

  - name: royalty_amount_calculation
    trigger: "POST /legal-research/royalty-statements/generate"
    algorithm: aggregation
    formula: |
      EVALUATION ORDER IS PINNED:
      1. view_count = count of DOC_VIEW UsageEvents with license_agreement_id == agreement.id
                      AND period_start <= occurred_at < period_end
      2. PER_VIEW basis: revenue_base_cents = 0
                         royalty_amount_cents = view_count * agreement.per_view_fee_cents
         REVENUE_SHARE basis: revenue_base_cents = SUM of total_cents over invoices with
                         status in {ISSUED, PAID} whose [invoice.period_start, invoice.period_end)
                         overlaps [period_start, period_end) AND whose subscription's plan
                         practice_area == agreement.practice_area
                         royalty_amount_cents = round_half_up(revenue_base_cents * agreement.revenue_share_bps / 10000)
    input_set: "UsageEvent rows for the agreement; Invoice rows overlapping the settlement window"
    constants:
      ROUNDING: "round_half_up to whole cents (REVENUE_SHARE only)"
      OVERLAP_RULE: "half-open window intersection"
    precision: "integer cents"
    variants:
      - name: PER_VIEW
        when: "agreement.royalty_basis == PER_VIEW"
        difference: "amount keyed only on view_count"
      - name: REVENUE_SHARE
        when: "agreement.royalty_basis == REVENUE_SHARE"
        difference: "amount keyed only on matching-practice-area invoiced revenue; identical view_count yields a different amount (3 views @45c = 135 vs 2.5% of a 5906-cent base = 148)"

# =============================================================================
# Table 4: Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present, non-blank, and X-User-Role is a declared role"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"
  - priority: 2
    category: auth
    check: "acting role is listed in the endpoint's roles"
    error_id: ERR_FORBIDDEN
    http_status: 403
    applies_to: "all"
  - priority: 3
    category: auth
    check: "ownership: FirmAdmin's X-User-ID must equal the account id of the subscription/user it acts on; AttorneyEditor submitting a headnote must be its author"
    error_id: ERR_ACCOUNT_MISMATCH
    http_status: 403
    applies_to: "POST /legal-research/subscriptions/{id}/seats"
  - priority: 4
    category: auth
    check: "headnote submit: X-User-ID == headnote.author_editor_id"
    error_id: ERR_NOT_HEADNOTE_AUTHOR
    http_status: 403
    applies_to: "POST /legal-research/headnotes/{id}/submit"
  - priority: 5
    category: existence
    check: "body shape: required fields present, enum values in domain, dates well-formed, window_start < window_end, effective_from <= effective_until, period_start < period_end, seats_total > 0; email unique within account on seat ASSIGN; license_agreement_id only allowed with event_type DOC_VIEW"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all"
  - priority: 6
    category: existence
    check: "path and body identifiers resolve to existing resources"
    error_id: ERR_DOCUMENT_NOT_FOUND
    http_status: 404
    applies_to: "document-scoped endpoints (also covers cited_document_id entries inside the publish references payload)"
  - priority: 7
    category: existence
    check: "path id resolves"
    error_id: ERR_HEADNOTE_NOT_FOUND
    http_status: 404
    applies_to: "GET /legal-research/headnotes/{id}, POST /legal-research/headnotes/{id}/submit, POST /legal-research/headnotes/{id}/decide"
  - priority: 8
    category: existence
    check: "path id resolves"
    error_id: ERR_SUBSCRIPTION_NOT_FOUND
    http_status: 404
    applies_to: "subscription-scoped endpoints"
  - priority: 9
    category: existence
    check: "path id resolves"
    error_id: ERR_INVOICE_NOT_FOUND
    http_status: 404
    applies_to: "invoice-scoped endpoints"
  - priority: 10
    category: existence
    check: "path id resolves"
    error_id: ERR_USER_NOT_FOUND
    http_status: 404
    applies_to: "GET /legal-research/users/{id}; seat RELEASE body user_id"
  - priority: 11
    category: existence
    check: "path id resolves"
    error_id: ERR_ORDER_NOT_FOUND
    http_status: 404
    applies_to: "removal-order-scoped endpoints"
  - priority: 12
    category: existence
    check: "path id resolves"
    error_id: ERR_AGREEMENT_NOT_FOUND
    http_status: 404
    applies_to: "license-agreement-scoped endpoints"
  - priority: 13
    category: existence
    check: "body plan_id / account_id resolve"
    error_id: ERR_PLAN_NOT_FOUND
    http_status: 404
    applies_to: "POST /legal-research/subscriptions, PATCH /legal-research/subscriptions/{id}/change-plan"
  - priority: 14
    category: existence
    check: "body account_id resolves"
    error_id: ERR_ACCOUNT_NOT_FOUND
    http_status: 404
    applies_to: "POST /legal-research/subscriptions"
  - priority: 15
    category: existence
    check: "path id resolves"
    error_id: ERR_USAGE_EVENT_NOT_FOUND
    http_status: 404
    applies_to: "GET /legal-research/usage-events/{id}"
  - priority: 16
    category: existence
    check: "path id resolves"
    error_id: ERR_STATEMENT_NOT_FOUND
    http_status: 404
    applies_to: "GET /legal-research/royalty-statements/{id}"
  - priority: 17
    category: existence
    check: "GET on a document whose visibility_status == REMOVED is indistinguishable from absence to callers"
    error_id: ERR_DOCUMENT_REMOVED
    http_status: 404
    applies_to: "GET /legal-research/documents/{id}, GET /legal-research/documents/{id}/citing-references"
  - priority: 18
    category: state
    check: "transition's from-state matches current state (publish on PUBLISHED, decide on DRAFT, reverse a RECEIVED order, cancel a CANCELLED subscription, transition a PAID invoice, etc.)"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all state-transition endpoints"
  - priority: 19
    category: state
    check: "headnote submit/decide requires document.ingestion_status == PUBLISHED"
    error_id: ERR_DOCUMENT_NOT_PUBLISHED
    http_status: 409
    applies_to: "POST /legal-research/headnotes/{id}/submit, POST /legal-research/headnotes/{id}/decide"
  - priority: 20
    category: state
    check: "headnote submit/decide requires document.visibility_status == PUBLIC"
    error_id: ERR_DOCUMENT_SEALED
    http_status: 409
    applies_to: "POST /legal-research/headnotes/{id}/submit, POST /legal-research/headnotes/{id}/decide"
  - priority: 21
    category: state
    check: "usage event creation and seat ASSIGN require subscription.status == ACTIVE"
    error_id: ERR_SUBSCRIPTION_NOT_ACTIVE
    http_status: 409
    applies_to: "POST /legal-research/usage-events, POST /legal-research/subscriptions/{id}/seats"
  - priority: 22
    category: state
    check: "usage event carrying license_agreement_id and royalty-statement generation require agreement.status == ACTIVE and the window must intersect the agreement window"
    error_id: ERR_AGREEMENT_NOT_ACTIVE
    http_status: 409
    applies_to: "POST /legal-research/usage-events, POST /legal-research/royalty-statements/generate"
  - priority: 23
    category: state
    check: "usage event whose occurred_at falls inside an ISSUED/OVERDUE/PAID invoice window of the same subscription; invoice generate whose window overlaps a non-VOID invoice of the same subscription"
    error_id: ERR_INVOICE_PERIOD_CLOSED
    http_status: 409
    applies_to: "POST /legal-research/usage-events, POST /legal-research/invoices/generate"
  - priority: 24
    category: state
    check: "seat ASSIGN rejected when the account already holds an ACTIVE-seated user with the same email; usage event rejected when the acting user holds no ACTIVE seat"
    error_id: ERR_SEAT_ALREADY_HELD
    http_status: 409
    applies_to: "POST /legal-research/subscriptions/{id}/seats (ASSIGN)"
  - priority: 25
    category: state
    check: "seat RELEASE requires user.seat_status == ACTIVE on this subscription; usage event requires the acting user to hold an ACTIVE seat"
    error_id: ERR_NO_SEAT_HELD
    http_status: 409
    applies_to: "POST /legal-research/subscriptions/{id}/seats (RELEASE), POST /legal-research/usage-events"
  - priority: 26
    category: business_safety
    check: "segregation of duties: headnote decide requires X-User-ID != author_editor_id"
    error_id: ERR_REVIEWER_IS_AUTHOR
    http_status: 422
    applies_to: "POST /legal-research/headnotes/{id}/decide"
  - priority: 27
    category: business_safety
    check: "usage_scope_monitoring bulk thresholds (hourly >= plan.bulk_hourly_limit or daily >= plan.bulk_daily_limit)"
    error_id: ERR_BULK_RATE_EXCEEDED
    http_status: 422
    applies_to: "POST /legal-research/usage-events"
  - priority: 28
    category: business_safety
    check: "out-of-scope event on a HARD-enforcement plan"
    error_id: ERR_USAGE_OUT_OF_SCOPE
    http_status: 422
    applies_to: "POST /legal-research/usage-events"
  - priority: 29
    category: business_constraint
    check: "normalized citation collides with another document's normalized_citation"
    error_id: ERR_DUPLICATE_CITATION
    http_status: 409
    applies_to: "POST /legal-research/documents/{id}/publish"
  - priority: 30
    category: business_constraint
    check: "publish references entry cites the publishing document itself"
    error_id: ERR_SELF_CITATION
    http_status: 422
    applies_to: "POST /legal-research/documents/{id}/publish"
  - priority: 31
    category: business_constraint
    check: "publish references entry targets a document that is not yet PUBLISHED"
    error_id: ERR_CITATION_TARGET_NOT_PUBLISHED
    http_status: 409
    applies_to: "POST /legal-research/documents/{id}/publish"
  - priority: 32
    category: business_constraint
    check: "exclusive license windows for the same practice_area use HALF-OPEN [window_start, window_end) semantics: interior overlap rejected, adjacency (prior window_end == next window_start) allowed; non-exclusive agreements never conflict"
    error_id: ERR_LICENSE_WINDOW_OVERLAP
    http_status: 409
    applies_to: "POST /legal-research/license-agreements"
  - priority: 33
    category: business_constraint
    check: "removal-order windows on the same document use CLOSED [effective_from, effective_until] semantics among orders with status in {RECEIVED, APPLIED}: adjacency (prior effective_until == next effective_from) COUNTS as overlap and is rejected"
    error_id: ERR_REMOVAL_WINDOW_OVERLAP
    http_status: 409
    applies_to: "POST /legal-research/removal-orders"
  - priority: 34
    category: business_constraint
    check: "new subscription period [period_start, period_end) must not overlap a non-CANCELLED subscription of the same account (half-open: period_start == existing period_end is allowed)"
    error_id: ERR_SUBSCRIPTION_OVERLAP
    http_status: 409
    applies_to: "POST /legal-research/subscriptions"
  - priority: 35
    category: business_constraint
    check: "OCC: expected_document_version / expected_subscription_version must equal the parent's current version"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /legal-research/documents/{id}/citator-override, PATCH /legal-research/subscriptions/{id}/change-plan"
  - priority: 36
    category: business_referential
    check: "matter_code is required when the subscription's account has cost_recovery_enabled == true and must be omitted otherwise"
    error_id: ERR_MATTER_CODE_REQUIRED
    http_status: 422
    applies_to: "POST /legal-research/usage-events"
  - priority: 37
    category: business_referential
    check: "government_only plan requires account_type == GOVERNMENT"
    error_id: ERR_PLAN_ACCOUNT_INCOMPATIBLE
    http_status: 422
    applies_to: "POST /legal-research/subscriptions"
  - priority: 38
    category: business_fiscal
    check: "seat ASSIGN requires seats_used < seats_total (checked after all state and safety gates)"
    error_id: ERR_NO_SEATS_AVAILABLE
    http_status: 409
    applies_to: "POST /legal-research/subscriptions/{id}/seats (ASSIGN)"

# =============================================================================
# Table 5: API Endpoint Table
# =============================================================================
endpoints:
  - method: POST
    path: "/legal-research/_clock/set_current_utc"
    description: "Test-driving logical clock setter. The server's startup default time is exactly 2026-09-01T00:00:00Z: before any set_current_utc call the logical clock reads this default and never falls back to wall-clock time. All time-gated rules (OVERDUE materialization, removal-order effective windows, bulk-rate windows) read only this clock."
    roles: [PlatformAdmin]
    code: 200
    input: [to_iso8601]
    output: {current_utc: string}
    side_effects: ["lazy OVERDUE materialization is evaluated on the next request that touches an invoice or subscription"]

  - method: POST
    path: "/legal-research/documents"
    description: "Ingest a raw primary-law document; created as (RECEIVED, PUBLIC)"
    roles: [ContentIngester]
    code: 201
    input: [source_type, jurisdiction_code, document_type, title, raw_citation_string, decision_date]
    output: PrimaryDocument
    side_effects: []

  - method: GET
    path: "/legal-research/documents"
    description: "List documents with filters; REMOVED documents are excluded unless visibility_status=REMOVED is requested explicitly"
    roles: [PlatformAdmin, ContentIngester, CitatorAnalyst, AttorneyEditor, LicensingManager, FirmAdmin, Researcher, BillingAdmin, ComplianceOfficer]
    code: 200
    input: ["source_type?", "jurisdiction_code?", "ingestion_status?", "visibility_status?", "limit?", "offset?"]
    output: PrimaryDocument[]
    side_effects: []

  - method: GET
    path: "/legal-research/documents/{id}"
    description: "Read one document including derived citator fields; REMOVED documents return ERR_DOCUMENT_REMOVED"
    roles: [PlatformAdmin, ContentIngester, CitatorAnalyst, AttorneyEditor, LicensingManager, FirmAdmin, Researcher, BillingAdmin, ComplianceOfficer]
    code: 200
    input: []
    output: PrimaryDocument
    side_effects: []

  - method: GET
    path: "/legal-research/documents/{id}/citing-references"
    description: "Reverse lookup of citation edges; direction=FROM returns rows where this document cites others, direction=TO returns rows citing this document"
    roles: [PlatformAdmin, ContentIngester, CitatorAnalyst, AttorneyEditor, LicensingManager, FirmAdmin, Researcher, BillingAdmin, ComplianceOfficer]
    code: 200
    input: ["direction?", "status?", "limit?", "offset?"]
    output: CitingReference[]
    side_effects: []

  - method: POST
    path: "/legal-research/documents/{id}/publish"
    description: "Normalize citation, run duplicate/citation-target checks, publish, and fan out CitingReference creation plus citator recompute"
    roles: [ContentIngester]
    code: 200
    input: [references]
    output: PrimaryDocument
    side_effects: ["citation_normalization", "CitingReference creation", "citator_signal_derivation on every cited document", "increments PrimaryDocument.version by 1"]

  - method: POST
    path: "/legal-research/documents/{id}/citator-override"
    description: "Pin an editorial citator signal on the document (supersedes any prior override); OCC-guarded on the document version"
    roles: [CitatorAnalyst]
    code: 200
    input: [override_signal, "rationale?", expected_document_version]
    output: PrimaryDocument
    side_effects: ["sets editorial_override_signal and editorial_override_rationale", "citator_signal := override_signal per citator_signal_derivation EDITORIAL_OVERRIDE variant", "increments PrimaryDocument.version by 1"]

  - method: POST
    path: "/legal-research/documents/{id}/headnotes"
    description: "Attorney editor drafts a headnote (with topic classification and synopsis) on a document; author is taken from X-User-ID"
    roles: [AttorneyEditor]
    code: 201
    input: [topic_code, headnote_text, synopsis_text]
    output: Headnote
    side_effects: []

  - method: GET
    path: "/legal-research/headnotes"
    description: "List headnotes with filters (reverse reachability for Headnote.document_id)"
    roles: [PlatformAdmin, ContentIngester, CitatorAnalyst, AttorneyEditor, LicensingManager, FirmAdmin, Researcher, BillingAdmin, ComplianceOfficer]
    code: 200
    input: ["document_id?", "author_editor_id?", "status?", "limit?", "offset?"]
    output: Headnote[]
    side_effects: []

  - method: GET
    path: "/legal-research/headnotes/{id}"
    description: "Read one headnote"
    roles: [PlatformAdmin, ContentIngester, CitatorAnalyst, AttorneyEditor, LicensingManager, FirmAdmin, Researcher, BillingAdmin, ComplianceOfficer]
    code: 200
    input: []
    output: Headnote
    side_effects: []

  - method: POST
    path: "/legal-research/headnotes/{id}/submit"
    description: "Author submits a DRAFT headnote for review"
    roles: [AttorneyEditor]
    code: 200
    input: []
    output: Headnote
    side_effects: ["increments Headnote.version by 1"]

  - method: POST
    path: "/legal-research/headnotes/{id}/decide"
    description: "Reviewer (must differ from the author) approves (PUBLISHED) or rejects (back to DRAFT) an IN_REVIEW headnote"
    roles: [AttorneyEditor]
    code: 200
    input: [decision, "review_note?"]
    output: Headnote
    side_effects: ["sets reviewer_editor_id and review_note", "increments Headnote.version by 1"]

  - method: POST
    path: "/legal-research/plans"
    description: "Create a subscription plan (practice area, jurisdiction, firm-size tier, billing model, quotas, scope enforcement)"
    roles: [LicensingManager]
    code: 201
    input: [name, practice_area, jurisdiction_scope, firm_size_tier, billing_model, scope_enforcement, government_only, cost_recovery_allowed, "monthly_fee_cents?", "included_searches?", "included_doc_views?", "overage_search_fee_cents?", "overage_doc_view_fee_cents?", "volume_discount_pct?", "discount_threshold_overage_units?", "per_search_fee_cents?", "per_doc_view_fee_cents?", "bulk_hourly_limit?", "bulk_daily_limit?"]
    output: SubscriptionPlan
    side_effects: []

  - method: POST
    path: "/legal-research/accounts"
    description: "Create a subscriber account"
    roles: [LicensingManager]
    code: 201
    input: [org_name, account_type, cost_recovery_enabled]
    output: SubscriberAccount
    side_effects: []

  - method: POST
    path: "/legal-research/subscriptions"
    description: "Open a subscription for an account on a plan; rejects overlapping non-CANCELLED periods for the same account (half-open semantics)"
    roles: [LicensingManager]
    code: 201
    input: [account_id, plan_id, period_start, period_end, seats_total]
    output: Subscription
    side_effects: []

  - method: GET
    path: "/legal-research/subscriptions"
    description: "List subscriptions with filters (reverse reachability for Subscription.account_id / plan_id)"
    roles: [LicensingManager, FirmAdmin, BillingAdmin]
    code: 200
    input: ["account_id?", "plan_id?", "status?", "limit?", "offset?"]
    output: Subscription[]
    side_effects: []

  - method: GET
    path: "/legal-research/subscriptions/{id}"
    description: "Read one subscription including computed seats_used"
    roles: [LicensingManager, FirmAdmin, BillingAdmin]
    code: 200
    input: []
    output: Subscription
    side_effects: []

  - method: PATCH
    path: "/legal-research/subscriptions/{id}/change-plan"
    description: "Change the subscription's plan (supersedes the prior plan for future invoices); OCC-guarded on the subscription version"
    roles: [LicensingManager]
    code: 200
    input: [new_plan_id, expected_subscription_version]
    output: Subscription
    side_effects: ["plan_id := new_plan_id", "increments Subscription.version by 1"]

  - method: POST
    path: "/legal-research/subscriptions/{id}/status"
    description: "Lifecycle transition: SUSPENDED / ACTIVE (resume) / CANCELLED per the Subscription state machine"
    roles: [LicensingManager]
    code: 200
    input: [target_status]
    output: Subscription
    side_effects: ["CANCELLED releases all seats and voids DRAFT invoices", "increments Subscription.version by 1"]

  - method: POST
    path: "/legal-research/subscriptions/{id}/seats"
    description: "FirmAdmin seat management: ASSIGN creates the SubscriberUser and seats them atomically; RELEASE frees the seat"
    roles: [FirmAdmin]
    code: 200
    input: [action, "user_email?", "user_full_name?", "user_id?"]
    output: Subscription
    side_effects: ["ASSIGN creates SubscriberUser(account copied from subscription) with seat_status ACTIVE and increments seats_used", "RELEASE sets seat_status NONE, clears seat_subscription_id, decrements seats_used", "increments Subscription.version by 1"]

  - method: GET
    path: "/legal-research/users"
    description: "List subscriber users (reverse reachability for SubscriberUser.account_id / seat_subscription_id)"
    roles: [LicensingManager, FirmAdmin]
    code: 200
    input: ["account_id?", "seat_subscription_id?", "limit?", "offset?"]
    output: SubscriberUser[]
    side_effects: []

  - method: GET
    path: "/legal-research/users/{id}"
    description: "Read one subscriber user"
    roles: [LicensingManager, FirmAdmin]
    code: 200
    input: []
    output: SubscriberUser
    side_effects: []

  - method: POST
    path: "/legal-research/usage-events"
    description: "Record a metered SEARCH / DOC_VIEW for the acting Researcher (X-User-ID = SubscriberUser id); subscription is derived from the user's ACTIVE seat"
    roles: [Researcher]
    code: 201
    input: [event_type, practice_area_tag, "license_agreement_id?", "matter_code?"]
    output: UsageEvent
    side_effects: ["usage_scope_monitoring (bulk thresholds + scope gate)", "sets occurred_at from logical clock", "sets in_scope"]

  - method: GET
    path: "/legal-research/usage-events"
    description: "List usage events (reverse reachability for UsageEvent.subscription_id / user_id / license_agreement_id)"
    roles: [BillingAdmin, LicensingManager]
    code: 200
    input: ["subscription_id?", "user_id?", "license_agreement_id?", "event_type?", "limit?", "offset?"]
    output: UsageEvent[]
    side_effects: []

  - method: GET
    path: "/legal-research/usage-events/{id}"
    description: "Read one usage event"
    roles: [BillingAdmin, LicensingManager]
    code: 200
    input: []
    output: UsageEvent
    side_effects: []

  - method: POST
    path: "/legal-research/invoices/generate"
    description: "Generate the DRAFT invoice for a subscription and billing window; computes totals per invoice_total_calculation and the cost_recovery_allocation"
    roles: [BillingAdmin]
    code: 201
    input: [subscription_id, period_start, period_end]
    output: Invoice
    side_effects: ["invoice_total_calculation", "cost_recovery_allocation when the account is cost-recovery enabled"]

  - method: GET
    path: "/legal-research/invoices"
    description: "List invoices (reverse reachability for Invoice.subscription_id)"
    roles: [BillingAdmin, LicensingManager, FirmAdmin]
    code: 200
    input: ["subscription_id?", "status?", "limit?", "offset?"]
    output: Invoice[]
    side_effects: ["lazy OVERDUE materialization evaluated before reading"]

  - method: GET
    path: "/legal-research/invoices/{id}"
    description: "Read one invoice including computed totals and cost_recovery_allocation"
    roles: [BillingAdmin, LicensingManager, FirmAdmin]
    code: 200
    input: []
    output: Invoice
    side_effects: ["lazy OVERDUE materialization evaluated before reading"]

  - method: POST
    path: "/legal-research/invoices/{id}/transition"
    description: "Billing lifecycle: ISSUED / PAID / VOID per the Invoice state machine"
    roles: [BillingAdmin]
    code: 200
    input: [target_status]
    output: Invoice
    side_effects: ["ISSUED sets issued_at/due_at and closes the period to late usage", "PAID/VOID evaluate subscription auto-resume", "increments Invoice.version by 1"]

  - method: POST
    path: "/legal-research/license-agreements"
    description: "License a secondary work (treatise / practice guide) with royalty terms and an exclusivity window"
    roles: [LicensingManager]
    code: 201
    input: [work_title, author_name, practice_area, royalty_basis, "per_view_fee_cents?", "revenue_share_bps?", exclusive, window_start, window_end]
    output: LicenseAgreement
    side_effects: ["exclusivity overlap check (half-open)"]

  - method: GET
    path: "/legal-research/license-agreements/{id}"
    description: "Read one license agreement"
    roles: [LicensingManager, BillingAdmin]
    code: 200
    input: []
    output: LicenseAgreement
    side_effects: []

  - method: POST
    path: "/legal-research/license-agreements/{id}/terminate"
    description: "Terminate an ACTIVE agreement"
    roles: [LicensingManager]
    code: 200
    input: []
    output: LicenseAgreement
    side_effects: ["increments LicenseAgreement.version by 1"]

  - method: POST
    path: "/legal-research/royalty-statements/generate"
    description: "Generate the immutable royalty statement for an agreement and settlement window"
    roles: [BillingAdmin]
    code: 201
    input: [license_agreement_id, period_start, period_end]
    output: RoyaltyStatement
    side_effects: ["royalty_amount_calculation"]

  - method: GET
    path: "/legal-research/royalty-statements"
    description: "List royalty statements (reverse reachability for RoyaltyStatement.license_agreement_id)"
    roles: [BillingAdmin, LicensingManager]
    code: 200
    input: ["license_agreement_id?", "limit?", "offset?"]
    output: RoyaltyStatement[]
    side_effects: []

  - method: GET
    path: "/legal-research/royalty-statements/{id}"
    description: "Read one royalty statement"
    roles: [BillingAdmin, LicensingManager]
    code: 200
    input: []
    output: RoyaltyStatement
    side_effects: []

  - method: POST
    path: "/legal-research/removal-orders"
    description: "Docket a court sealing/removal order; closed-interval overlap with existing RECEIVED/APPLIED orders on the same document is rejected"
    roles: [ComplianceOfficer]
    code: 201
    input: [document_id, scope, effective_from, effective_until, "reason?"]
    output: RemovalOrder
    side_effects: []

  - method: GET
    path: "/legal-research/removal-orders"
    description: "List removal orders (reverse reachability for RemovalOrder.document_id)"
    roles: [ComplianceOfficer, PlatformAdmin]
    code: 200
    input: ["document_id?", "status?", "limit?", "offset?"]
    output: RemovalOrder[]
    side_effects: []

  - method: GET
    path: "/legal-research/removal-orders/{id}"
    description: "Read one removal order"
    roles: [ComplianceOfficer, PlatformAdmin]
    code: 200
    input: []
    output: RemovalOrder
    side_effects: []

  - method: POST
    path: "/legal-research/removal-orders/{id}/transition"
    description: "APPLIED executes the retroactive cascade (visibility, reference deactivation, citator recompute, headnote retraction); REVERSED compensates references and signal but not headnotes"
    roles: [ComplianceOfficer]
    code: 200
    input: [target_status]
    output: RemovalOrder
    side_effects: ["document visibility transition with full cascade", "increments RemovalOrder.version by 1"]

# =============================================================================
# Table 6: Error Code Catalog
# =============================================================================
errors:
  - {id: ERR_UNAUTHENTICATED, http: 401, condition: "X-User-Role / X-User-ID missing, blank, or role not declared"}
  - {id: ERR_FORBIDDEN, http: 403, condition: "role not in the endpoint's roles list"}
  - {id: ERR_ACCOUNT_MISMATCH, http: 403, condition: "FirmAdmin's X-User-ID differs from the account that owns the target subscription/user"}
  - {id: ERR_NOT_HEADNOTE_AUTHOR, http: 403, condition: "headnote submit attempted by a user other than the author"}
  - {id: ERR_INVALID_REQUEST, http: 400, condition: "missing required field, invalid enum value, malformed date, inverted window/period, non-positive seats_total, duplicate email within account, or license_agreement_id on a SEARCH event"}
  - {id: ERR_DOCUMENT_NOT_FOUND, http: 404, condition: "document id (path or references payload entry) does not exist"}
  - {id: ERR_HEADNOTE_NOT_FOUND, http: 404, condition: "headnote id does not exist"}
  - {id: ERR_SUBSCRIPTION_NOT_FOUND, http: 404, condition: "subscription id does not exist"}
  - {id: ERR_INVOICE_NOT_FOUND, http: 404, condition: "invoice id does not exist"}
  - {id: ERR_USER_NOT_FOUND, http: 404, condition: "user id does not exist"}
  - {id: ERR_ORDER_NOT_FOUND, http: 404, condition: "removal order id does not exist"}
  - {id: ERR_AGREEMENT_NOT_FOUND, http: 404, condition: "license agreement id does not exist"}
  - {id: ERR_PLAN_NOT_FOUND, http: 404, condition: "plan id (body) does not exist"}
  - {id: ERR_ACCOUNT_NOT_FOUND, http: 404, condition: "account id (body) does not exist"}
  - {id: ERR_USAGE_EVENT_NOT_FOUND, http: 404, condition: "usage event id does not exist"}
  - {id: ERR_STATEMENT_NOT_FOUND, http: 404, condition: "royalty statement id does not exist"}
  - {id: ERR_DOCUMENT_REMOVED, http: 404, condition: "document visibility_status == REMOVED on a single-document read"}
  - {id: ERR_INVALID_STATE, http: 409, condition: "transition attempted from a state that does not list it (including terminal states)"}
  - {id: ERR_DOCUMENT_NOT_PUBLISHED, http: 409, condition: "headnote submit/decide while document ingestion_status != PUBLISHED"}
  - {id: ERR_DOCUMENT_SEALED, http: 409, condition: "headnote submit/decide while document visibility_status != PUBLIC"}
  - {id: ERR_SUBSCRIPTION_NOT_ACTIVE, http: 409, condition: "usage event or seat ASSIGN while subscription is SUSPENDED or CANCELLED"}
  - {id: ERR_AGREEMENT_NOT_ACTIVE, http: 409, condition: "usage event or royalty generation against a TERMINATED agreement, or a settlement window outside the agreement window"}
  - {id: ERR_INVOICE_PERIOD_CLOSED, http: 409, condition: "usage event dated inside a non-DRAFT/non-VOID invoice window, or invoice generation overlapping an existing non-VOID invoice"}
  - {id: ERR_SEAT_ALREADY_HELD, http: 409, condition: "seat ASSIGN for an email that already holds an ACTIVE seat in the account"}
  - {id: ERR_NO_SEAT_HELD, http: 409, condition: "seat RELEASE for a user without an ACTIVE seat on this subscription; usage event by a user with no ACTIVE seat"}
  - {id: ERR_NO_SEATS_AVAILABLE, http: 409, condition: "seat ASSIGN when seats_used == seats_total on the target subscription"}
  - {id: ERR_REVIEWER_IS_AUTHOR, http: 422, condition: "headnote decide where X-User-ID == author_editor_id (segregation of duties)"}
  - {id: ERR_BULK_RATE_EXCEEDED, http: 422, condition: "usage event would push the user past the plan's hourly or daily bulk limit"}
  - {id: ERR_USAGE_OUT_OF_SCOPE, http: 422, condition: "out-of-scope usage event on a HARD-enforcement plan"}
  - {id: ERR_MATTER_CODE_REQUIRED, http: 422, condition: "matter_code missing on a cost-recovery account (or supplied on a non-recovery account)"}
  - {id: ERR_PLAN_ACCOUNT_INCOMPATIBLE, http: 422, condition: "government_only plan subscribed by a non-GOVERNMENT account"}
  - {id: ERR_DUPLICATE_CITATION, http: 409, condition: "normalized citation collides with another published/normalized document"}
  - {id: ERR_SELF_CITATION, http: 422, condition: "publish references payload cites the publishing document itself"}
  - {id: ERR_CITATION_TARGET_NOT_PUBLISHED, http: 409, condition: "publish references payload targets a document whose ingestion_status != PUBLISHED"}
  - {id: ERR_LICENSE_WINDOW_OVERLAP, http: 409, condition: "exclusive license window interior-overlaps another ACTIVE exclusive agreement in the same practice_area (half-open; adjacency allowed)"}
  - {id: ERR_REMOVAL_WINDOW_OVERLAP, http: 409, condition: "removal-order window overlaps (closed-interval; adjacency counts) another RECEIVED/APPLIED order on the same document"}
  - {id: ERR_SUBSCRIPTION_OVERLAP, http: 409, condition: "subscription period overlaps a non-CANCELLED subscription of the same account (half-open)"}
  - {id: ERR_STALE_VERSION, http: 412, condition: "expected_*_version differs from the parent entity's current version (OCC)"}

# =============================================================================
# Table 7: RBAC Permission Matrix
# =============================================================================
roles:
  - name: PlatformAdmin
    description: "Platform operator; drives the logical clock and reads everything operational"
    identity: opaque
    exclusive_operations: ["POST /legal-research/_clock/set_current_utc"]
    shared_operations: ["read documents, headnotes, citing references, removal orders"]
  - name: ContentIngester
    description: "Ingestion pipeline operator for courts/legislatures/agencies feeds"
    identity: opaque
    exclusive_operations: ["POST /legal-research/documents", "POST /legal-research/documents/{id}/publish"]
    shared_operations: ["read documents, headnotes, citing references"]
  - name: CitatorAnalyst
    description: "Editorial analyst who pins citator override signals"
    identity: opaque
    exclusive_operations: ["POST /legal-research/documents/{id}/citator-override"]
    shared_operations: ["read documents, headnotes, citing references"]
  - name: AttorneyEditor
    description: "Attorney editor writing headnotes, topic classifications and synopses; author and reviewer duties are segregated"
    identity: opaque
    exclusive_operations: ["POST /legal-research/documents/{id}/headnotes", "POST /legal-research/headnotes/{id}/submit", "POST /legal-research/headnotes/{id}/decide"]
    shared_operations: ["read documents, headnotes, citing references"]
  - name: LicensingManager
    description: "Manages plans, accounts, subscriptions, and secondary-work license agreements"
    identity: opaque
    exclusive_operations: ["POST /legal-research/plans", "POST /legal-research/accounts", "POST /legal-research/subscriptions", "PATCH /legal-research/subscriptions/{id}/change-plan", "POST /legal-research/subscriptions/{id}/status", "POST /legal-research/license-agreements", "POST /legal-research/license-agreements/{id}/terminate"]
    shared_operations: ["read subscriptions, users, usage events, invoices, royalty statements, license agreements, documents"]
  - name: FirmAdmin
    description: "Subscriber-side administrator; manages seats for its own account only (X-User-ID == SubscriberAccount.id)"
    identity: "entity_backed:SubscriberAccount"
    exclusive_operations: ["POST /legal-research/subscriptions/{id}/seats"]
    shared_operations: ["read subscriptions, users, invoices, documents"]
  - name: Researcher
    description: "Subscribing end user; generates metered usage (X-User-ID == SubscriberUser.id, seat required)"
    identity: "entity_backed:SubscriberUser"
    exclusive_operations: ["POST /legal-research/usage-events"]
    shared_operations: ["read documents, headnotes, citing references"]
  - name: BillingAdmin
    description: "Billing operator; generates and settles invoices and royalty statements"
    identity: opaque
    exclusive_operations: ["POST /legal-research/invoices/generate", "POST /legal-research/invoices/{id}/transition", "POST /legal-research/royalty-statements/generate"]
    shared_operations: ["read subscriptions, usage events, invoices, royalty statements, license agreements, documents"]
  - name: ComplianceOfficer
    description: "Handles court sealing/removal orders and retroactive database changes"
    identity: opaque
    exclusive_operations: ["POST /legal-research/removal-orders", "POST /legal-research/removal-orders/{id}/transition"]
    shared_operations: ["read documents, removal orders"]
