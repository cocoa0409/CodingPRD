            - "SpotOrder.${so_id}.unplaced_spots == 0"
            - "SpotOrder.${so_id}.status == PARTIALLY_CREDITED"
            - "GET /playlists/${pl_id}/reconciliation?basis=PRELIMINARY and GET /playlists/${pl_id}/reconciliation?basis=FINAL both report reconciliation_credit_cents == 555 because unplaced_spots == 0 makes the FINAL top-up zero"

      - name: waterfall_allocation_pinned_five_step_order_caps_shares_at_weight
        grounds:
          - calculations.multiplex_bitrate_allocation
          - calculations.multiplex_capacity_conservation
          - concurrency_rules[multiplex-rebalance-stale-multiplex]
          - entities.Multiplex.fields.available_kbps
          - entities.Channel.fields.allocation_state
        distinguishing_aspect: |
          Mode (c): allocation depends on remainder, which depends on the granted
          floors, which depend on effective_capacity_kbps, which depends on
          derate_factor — an apparent circularity resolved only by the pinned
          steps 1->5. With remainder 19500 exceeding total_weight 7500 every
          step-3 share is clamped by min(floor(remainder*weight/total_weight),
          weight), so each channel receives exactly its requested_bitrate_kbps
          (2500 / 6000 / 9000) and 12000 kbps stays in available_kbps because the
          step-4 sweep finds no under-served channel; a single-pass pro-rata
          split of the whole 29500 pool over requests would instead hand channel
          12.1 4214 kbps and leave available_kbps at 0.
        test_recipe:
          setup:
            - "Transmitter FAC-1 at FULL_POWER (derate_factor 1.00) carrying MUX-A with total_capacity_kbps 30000 and pilot_reserved_kbps 500, so effective_capacity_kbps == max(0, floor(30000 * 1.00) - 500) == 29500."
            - "Three ACTIVE SD_480I channels on MUX-A: 12.1 (priority_rank 1, floor 2000, requested 2500), 12.2 (priority_rank 2, floor 3000, requested 6000), 12.3 (priority_rank 3, floor 5000, requested 9000)."
            - "Step 1 derate 1.00; step 2 grants all three floors (running floor 2000 -> 5000 -> 10000, each <= 29500) leaving remainder 19500; step 3 weights are 500 / 3000 / 4000 with total_weight 7500."
            - "All three channels are DARK with no playlists, so the rebalance produces no downstream item or credit effects."
            - "The logical clock stands at the 2026-08-01T00:00:00Z startup default."
          setup_api_calls:
            - call: "POST /operators"
              payload: { full_name: "Eve Engineer", role_class: "ENGINEER", override_authority: "NONE", certification_expires_utc: "2027-01-01T00:00:00Z" }
              as: StationAdmin
              as_user_id: "admin-1"
              captures: { eng_id: "$.data.id" }
            - call: "POST /transmitters"
              payload: { facility_id: "FAC-1", call_sign: "WXYZ", authorized_erp_kw: 50 }
              as: BroadcastEngineer
              as_user_id: "${eng_id}"
              captures: { tx_id: "$.data.id" }
            - call: "POST /multiplexes"
              payload: { transmitter_id: "${tx_id}", name: "MUX-A", total_capacity_kbps: 30000, pilot_reserved_kbps: 500, live_encoder_units_total: 2 }
              as: BroadcastEngineer
              as_user_id: "${eng_id}"
              captures: { mux_id: "$.data.id", mux_v1: "$.data.version" }
            - call: "POST /channels"
              payload: { multiplex_id: "${mux_id}", expected_multiplex_version: "${mux_v1}", call_sign: "WXYZ-DT1", channel_number: "12.1", service_class: "PRIMARY", resolution_class: "SD_480I", requested_bitrate_kbps: 2500, floor_bitrate_kbps: 2000, priority_rank: 1 }
              as: BroadcastEngineer
              as_user_id: "${eng_id}"
              captures: { ch1_id: "$.data.id" }
            - call: "GET /multiplexes/${mux_id}"
              payload: {}
              as: BroadcastEngineer
              as_user_id: "${eng_id}"
              captures: { mux_v2: "$.data.version" }
            - call: "POST /channels"
              payload: { multiplex_id: "${mux_id}", expected_multiplex_version: "${mux_v2}", call_sign: "WXYZ-DT2", channel_number: "12.2", service_class: "SUBCHANNEL", resolution_class: "SD_480I", requested_bitrate_kbps: 6000, floor_bitrate_kbps: 3000, priority_rank: 2, parent_channel_id: "${ch1_id}" }
              as: BroadcastEngineer
              as_user_id: "${eng_id}"
              captures: { ch2_id: "$.data.id" }
            - call: "GET /multiplexes/${mux_id}"
              payload: {}
              as: BroadcastEngineer
              as_user_id: "${eng_id}"
              captures: { mux_v3: "$.data.version" }
            - call: "POST /channels"
              payload: { multiplex_id: "${mux_id}", expected_multiplex_version: "${mux_v3}", call_sign: "WXYZ-DT3", channel_number: "12.3", service_class: "SUBCHANNEL", resolution_class: "SD_480I", requested_bitrate_kbps: 9000, floor_bitrate_kbps: 5000, priority_rank: 3, parent_channel_id: "${ch1_id}" }
              as: BroadcastEngineer
              as_user_id: "${eng_id}"
              captures: { ch3_id: "$.data.id" }
            - call: "GET /multiplexes/${mux_id}"
              payload: {}
              as: BroadcastEngineer
              as_user_id: "${eng_id}"
              captures: { mux_v4: "$.data.version" }
          trigger:
            - call: "POST /multiplexes/${mux_id}/rebalance"
              payload: { expected_multiplex_version: "${mux_v4}", clear_pins: true }
              as: BroadcastEngineer
              as_user_id: "${eng_id}"
          assert:
            - "HTTP 200 and the response data is a Multiplex"
            - "Multiplex.${mux_id}.effective_capacity_kbps == 29500"
            - "Channel.${ch1_id}.allocated_bitrate_kbps == 2500"
            - "Channel.${ch2_id}.allocated_bitrate_kbps == 6000"
            - "Channel.${ch3_id}.allocated_bitrate_kbps == 9000"
            - "Channel.${ch1_id}.allocated_bitrate_kbps != 4214"
            - "Multiplex.${mux_id}.assigned_kbps == 17500"
            - "Multiplex.${mux_id}.available_kbps == 12000"
            - "Multiplex.${mux_id}.starved_channel_count == 0"
            - "Channel.${ch1_id}.allocation_state == ACTIVE and Channel.${ch2_id}.allocation_state == ACTIVE and Channel.${ch3_id}.allocation_state == ACTIVE"
            - "Multiplex.${mux_id}.available_kbps + Multiplex.${mux_id}.assigned_kbps == 29500 (multiplex_capacity_conservation holds after the rebalance)"
            - "Re-issuing POST /multiplexes/${mux_id}/rebalance with the now-stale expected_multiplex_version ${mux_v4} returns HTTP 412 with error_id ERR_STALE_MULTIPLEX_VERSION and leaves every allocated_bitrate_kbps unchanged"

  # ===========================================================================
  # RULE 3 — Non-linear state machines
  # Instance 1: PARALLEL DIMENSIONS on PlaylistItem (playout_status x
  #             clearance_status advance independently).
  # Instance 2: CYCLE on EmergencyOverride (ACTIVE_CRAWL -> ACTIVE_CUTIN ->
  #             ACTIVE_CRAWL -> RELEASED) with irreversible item side effects.
  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:

      - name: playlist_item_holds_cued_playout_and_blocked_clearance_simultaneously
        grounds:
          - state_machines.PlaylistItem.SCHEDULED_to_CUED
          - state_machines.PlaylistItem.CLEARED_to_BLOCKED
          - entities.PlaylistItem.fields.playout_status
          - entities.PlaylistItem.fields.clearance_status
          - entities.Playlist.fields.blocked_item_count
          - state_machines.Asset.QC_PASSED_to_RETRACTED
        distinguishing_aspect: |
          PlaylistItem carries two orthogonal state dimensions, and this instance
          drives them to independent positions in a single entity row: the
          playout axis reaches CUED while the clearance axis is pushed
          CLEARED -> BLOCKED by the retraction of the underlying Asset, so the
          item is simultaneously CUED and BLOCKED — a coordinate a single-enum
          implementation cannot represent, and one that also proves the retract
          cascade does not reset the playout axis back to SCHEDULED.
        test_recipe:
          setup:
            - "Transmitter FAC-1 FULL_POWER, MUX-A (total 20000, pilot 500), ACTIVE channel 12.1 (SD_480I, floor 2000, requested 6000, priority_rank 1), air_status ON_AIR, posture NORMAL."
            - "Two QC_PASSED assets: A (expected 900 s) and B (expected 900 s), each scored 100 with no defects."
            - "Playlist for 2026-08-01, schedule_start_utc 12:00:00Z, window 1800 s, two contiguous PROGRAM items (seq 1 asset A 900 s at 12:00:00Z, seq 2 asset B 900 s at 12:15:00Z); no COMMERCIAL element and therefore no SpotOrder anywhere in the chain."
            - "The playlist reached ON_AIR, both items were created with clearance_status CLEARED, and seq 2 was cued out of order so its playout_status is CUED while seq 1 is still SCHEDULED."
            - "The logical clock stands at 2026-08-01T12:00:00Z."
          setup_api_calls:
            - call: "POST /operators"
              payload: { full_name: "Eve Engineer", role_class: "ENGINEER", override_authority: "NONE", certification_expires_utc: "2027-01-01T00:00:00Z" }
              as: StationAdmin
              as_user_id: "admin-1"
              captures: { eng_id: "$.data.id" }
            - call: "POST /operators"
              payload: { full_name: "Mac Control", role_class: "MASTER_CONTROL", override_authority: "CRAWL_AND_CUTIN", certification_expires_utc: "2027-01-01T00:00:00Z" }
              as: StationAdmin
              as_user_id: "admin-1"
              captures: { mco_id: "$.data.id" }
            - call: "POST /operators"
              payload: { full_name: "Quinn QC", role_class: "QC", override_authority: "NONE", certification_expires_utc: "2027-01-01T00:00:00Z" }
              as: StationAdmin
              as_user_id: "admin-1"
              captures: { qc_id: "$.data.id" }
            - call: "POST /transmitters"
              payload: { facility_id: "FAC-1", call_sign: "WXYZ", authorized_erp_kw: 50 }
              as: BroadcastEngineer
              as_user_id: "${eng_id}"
              captures: { tx_id: "$.data.id" }
            - call: "POST /multiplexes"
              payload: { transmitter_id: "${tx_id}", name: "MUX-A", total_capacity_kbps: 20000, pilot_reserved_kbps: 500, live_encoder_units_total: 2 }
              as: BroadcastEngineer
              as_user_id: "${eng_id}"
              captures: { mux_id: "$.data.id", mux_v1: "$.data.version" }
            - call: "POST /channels"
              payload: { multiplex_id: "${mux_id}", expected_multiplex_version: "${mux_v1}", call_sign: "WXYZ-DT1", channel_number: "12.1", service_class: "PRIMARY", resolution_class: "SD_480I", requested_bitrate_kbps: 6000, floor_bitrate_kbps: 2000, priority_rank: 1 }
              as: BroadcastEngineer
              as_user_id: "${eng_id}"
              captures: { ch_id: "$.data.id" }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T10:00:00Z" }
              as: StationAdmin
              as_user_id: "admin-1"
            - call: "POST /assets"
              payload: { house_number: "HN-A", title: "Feature A", source: "FILE_DELIVERY", expected_duration_seconds: 900, delivery_deadline_utc: "2026-08-05T00:00:00Z", required_resolution_class: "SD_480I", captions_required: false }
