              payload: { cycle_id: "${cyc}", aircraft_id: "${ac2}", captain_pilot_id: "${p1}", flight_number: "SM5103", origin: "MSP", destination: "STL", scheduled_departure_utc: "2026-09-15T20:00:00Z", scheduled_arrival_utc: "2026-09-15T21:30:00Z", planned_block_hours: 1.500 }
              as: MainlineScheduler
            - call: "POST /cpa/flight-legs"
