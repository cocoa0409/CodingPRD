            - call: "POST /pharmacy/fill-cycles/${c1}/generate-roll"
              payload: {}
              as: PackagingTechnician
              as_user_id: "tech-01"
              captures: { roll1: $.data.id, roll_pouches: $.data.pouch_count }
          assert:
            - "before the prescriber answers: Prescription.${rx1}.status == PENDING_AUTHORIZATION while FillCycle.${c1}.insurance_status == CLEARED and packaging_status == LINES_ADJUDICATED"
            - "call 1 returns 409 ERR_RX_PENDING_AUTHORIZATION and FillCycle.${c1}.packaging_status is still LINES_ADJUDICATED with no PouchRoll row created"
            - "after respond APPROVE: Prescription.${rx1}.status == ACTIVE and FillCycle.${c2}.insurance_status == CLEARED"
            - "call 4 succeeds with the byte-identical request: PouchRoll.${roll1}.pouch_count == 28, segment_start_date 2026-08-15, segment_end_date 2026-09-11, FillCycle.${c1}.packaging_status == ROLL_GENERATED"
            - "the only thing that changed between the two identical calls is Prescription.${rx1}.status"

      - name: issued_credit_can_only_land_on_a_different_later_cycle
        grounds:
          - state_machines.CreditMemo.ISSUED_to_APPLIED
          - entities.CreditMemo.fields.applied_to_cycle_id
          - entities.FillCycle.fields.credit_applied_cents
          - entities.Patient.fields.credit_balance_cents
