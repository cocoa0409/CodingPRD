        distinguishing_aspect: "A closed case assigned with a stale expected_case_version reports the STATE error (priority 7), not the OCC 412 (priority 8) — state preconditions precede version checks."
        test_recipe:
          setup: ["Advice case CLOSED; captured version from the close response; attorney available"]
          setup_api_calls:
            - { call: "POST /venue-rules", payload: { county: "CountyA", case_type: "CONSUMER_DEBT", venue: "MUNICIPAL_COURT", priority_base_weight: 30, extended_eligible: false }, as: ProgramDirector }
            - { call: "POST /staff-members", payload: { full_name: "Intake One", staff_type: "INTAKE_SPECIALIST", admitted_counties: ["CountyA"], practice_areas: ["CONSUMER_DEBT"] }, as: ProgramDirector, captures: { intake_id: "$.data.id" } }
