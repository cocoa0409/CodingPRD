            - "${cr_forgone} == 1313 — round_half_up(8750 * (1 - 0.85)) is round_half_up(1312.5) == 1313 for the single entitlement"
            - "GET /tickets?credential_request_id=${cr_id} has total_count == 1 with ticket_type COMP, face_value_cents 0 and device_binding_status UNBOUND"
            - "Event.${ev_id}.settlement_pool_cents == 0 — a zero-face entitlement adds nothing to the pool"
      - name: dedupe_key_uniqueness_is_scoped_to_one_scan_session
