        as: CaseManager
        as_user_id: cm-1
        captures:
          p3_id: $.data.id
      - call: POST /grants
        payload:
          funder_name: Statewide Reentry Fund
          program_year: 2026
          authorized_cents: 5000000
          allowed_categories:
          - TOOLS
          - UNIFORM
          - TRANSIT_PASS
          - ID_FEE
          - LICENSE_FEE
          - WAGE_SUBSIDY
          per_participant_cap_cents: 60000
          retention_benchmark_pct: 50.0
        as: FunderAnalyst
        as_user_id: analyst-1
        captures:
          g1_id: $.data.id
      - call: GET /grants/${g1_id}
        as: CaseManager
        as_user_id: cm-1
        captures:
          g1_v_a: $.data.version
      trigger:
      - call: POST /support-requests
        payload:
          participant_id: ${p3_id}
