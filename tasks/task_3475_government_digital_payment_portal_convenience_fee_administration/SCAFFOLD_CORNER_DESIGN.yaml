              as: Payer
              as_user_id: "${payer_id}"
              captures: { quote_min: $.data.id }
          assert:
            - "amount 99 returns 422 and err_low == ERR_AMOUNT_OUT_OF_RANGE"
            - "amount 100 (== min, inclusive) returns 201 with quoted_fee_cents == 100 (MIN_FEE floor) — the range check itself passed"

      - name: err_offboard_blocked
        claim_type: violation_to_error
        grounds:
          - errors.ERR_OFFBOARD_BLOCKED
          - state_machines.Agency.ACTIVE_to_OFFBOARDED
        distinguishing_aspect: "An agency with an unsettled (CAPTURED) transaction cannot offboard: 409 ERR_OFFBOARD_BLOCKED; after voiding... voiding a CAPTURED txn is impossible, so settle it first — offboard succeeds once exposure is zero."
        test_recipe:
          setup:
            - "CF agency base chain; CARD transaction captured 2026-09-10; batch 2026-09-11 closed and reconciled clean (confirm exact on 09-12)."
          setup_api_calls:
