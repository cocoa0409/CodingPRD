            - { call: "POST /survey/release-events/${rel}/advance", payload: { action: APPROVE_DISCLOSURE, expected_release_version: "${rv1}" }, as: DisclosureOfficer, as_user_id: "officer-7", captures: { rv2: $.data.version } }
