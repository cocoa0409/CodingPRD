# =============================================================================
# Table 7: RBAC Matrix
# =============================================================================
roles:
  - name: OpsAdmin
    description: "Co-packer operations administrator: plant setup, scheduling, production execution"
    identity: opaque
    exclusive_operations:
      - "POST /copack/customers"
      - "POST /copack/pilot-cells, POST /copack/kettle-lines"
      - "POST/PUT /copack/packaging-components"
      - "POST /copack/scale-up-trials, record-results, cancel"
      - "POST /copack/production-runs, confirm, complete, cancel"
    shared_operations:
      - "Formula create/PUT/reformulate, ingredient-supply create/receive, label create/submit (shared with Customer)"
      - "All GET endpoints"
  - name: Customer
    description: "Brand owner; acts only within its own customer_id ownership chain"
    identity: "entity_backed:CustomerAccount"
    exclusive_operations:
      - "Disposition of holds whose disposition_owner == CUSTOMER (own chain only)"
    shared_operations:
      - "Formula create/PUT/reformulate, ingredient-supply create/receive, label create/submit (shared with OpsAdmin)"
      - "GET endpoints scoped to own resources"
  - name: ProcessAuthority
    description: "External process authority issuing scheduled-process letters"
    identity: opaque
    exclusive_operations:
      - "POST /copack/process-authority-letters"
      - "POST /copack/process-authority-letters/{id}/activate"
    shared_operations:
      - "GET letter endpoints"
  - name: QAReviewer
    description: "Quality assurance reviewer: label review, quality holds, run release"
    identity: opaque
    exclusive_operations:
      - "POST /copack/label-approvals/{id}/review"
      - "POST /copack/quality-holds"
      - "POST /copack/production-runs/{id}/release"
      - "Disposition of holds whose disposition_owner == COPACKER (never a hold the same user created)"
    shared_operations:
      - "All GET endpoints"
