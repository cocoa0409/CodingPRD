            - "response data.error_id == ERR_LAPSE_WINDOW_NOT_MET"

  # =====================================================================
  # RBAC
  # =====================================================================
  - section: rbac
    instances:
      - name: campaign_manager_cannot_record_gift
        claim_type: peer_roles
        grounds: [roles, endpoints, "errors[ERR_UNAUTHORIZED]"]
        distinguishing_aspect: "CampaignManager calling POST /gifts (a GiftAdmin-exclusive op) returns ERR_UNAUTHORIZED (403)."
        test_recipe:
          setup: ["OPEN campaign; donor"]
          setup_api_calls:
            - call: "POST /campaigns"
              payload: { name: "Rb", goal_cents: 1000000, starts_on: "2026-01-01T00:00:00Z", ends_on: "2026-12-31T00:00:00Z" }
              as: CampaignManager
              captures: { camp: $.data.id }
            - call: "POST /campaigns/${camp}/open"
              payload: {}
              as: CampaignManager
            - call: "POST /donors"
              payload: { full_name: "Rb", email: "rb@x.com" }
              as: GiftAdmin
              captures: { dn: $.data.id }
          trigger:
            - call: "POST /gifts"
              payload: { donor_id: "${dn}", campaign_id: "${camp}", amount_cents: 5000 }
              as: CampaignManager
              captures: { err: $.data.error_id }
          assert:
            - "response status == 403"
            - "response data.error_id == ERR_UNAUTHORIZED"

      - name: giftadmin_cannot_acknowledge_gift
        claim_type: peer_roles
        grounds: [roles, endpoints, "errors[ERR_UNAUTHORIZED]"]
        distinguishing_aspect: "GiftAdmin calling POST /gifts/{id}/acknowledge (a DonorRelations-exclusive op) returns ERR_UNAUTHORIZED (403)."
        test_recipe:
          setup: ["OPEN campaign; donor; RECORDED gift"]
          setup_api_calls:
            - call: "POST /campaigns"
              payload: { name: "Rb2", goal_cents: 1000000, starts_on: "2026-01-01T00:00:00Z", ends_on: "2026-12-31T00:00:00Z" }
              as: CampaignManager
              captures: { camp: $.data.id }
            - call: "POST /campaigns/${camp}/open"
              payload: {}
              as: CampaignManager
            - call: "POST /donors"
              payload: { full_name: "Rb2", email: "rb2@x.com" }
              as: GiftAdmin
              captures: { dn: $.data.id }
            - call: "POST /gifts"
              payload: { donor_id: "${dn}", campaign_id: "${camp}", amount_cents: 5000 }
              as: GiftAdmin
              captures: { g: $.data.id }
          trigger:
            - call: "POST /gifts/${g}/acknowledge"
              payload: {}
              as: GiftAdmin
              captures: { err: $.data.error_id }
          assert:
            - "response status == 403"
            - "response data.error_id == ERR_UNAUTHORIZED"

      - name: missing_auth_headers_unauthenticated
        claim_type: peer_roles
        grounds: ["validations[priority=1]", "errors[ERR_UNAUTHENTICATED]"]
        distinguishing_aspect: "A request with no X-User-Role / X-User-ID returns ERR_UNAUTHENTICATED (401) before any authorization check. Modeled here as an Anonymous (header-less) GET."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "GET /donors/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: Anonymous
              captures: { err: $.data.error_id }
          assert:
            - "response status == 401"
            - "response data.error_id == ERR_UNAUTHENTICATED"

  # =====================================================================
  # Cross-Cutting Complexity Layers
  # =====================================================================
  - section: cross_cutting_complexity_layers
    instances:
      - name: occ_pledge_cancel_stale_version_conflict
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[pledge-cancel-stale-version]", endpoints, "errors[ERR_STALE_VERSION]"]
        distinguishing_aspect: "A gift allocation advances Pledge.version; a cancel still carrying the pre-allocation version is rejected with ERR_STALE_VERSION (412)."
        test_recipe:
          setup: ["OPEN campaign; donor; pledge total 10000 / 2 MONTHLY installments; client observes pledge.version at creation; a 5000 gift is acknowledged against the pledge (advancing pledge.version)"]
          setup_api_calls:
            - call: "POST /campaigns"
              payload: { name: "Oc2", goal_cents: 1000000, starts_on: "2026-01-01T00:00:00Z", ends_on: "2026-12-31T00:00:00Z" }
              as: CampaignManager
              captures: { camp: $.data.id }
            - call: "POST /campaigns/${camp}/open"
              payload: {}
              as: CampaignManager
            - call: "POST /donors"
              payload: { full_name: "Oc2", email: "oc2@x.com" }
              as: GiftAdmin
              captures: { dn: $.data.id }
            - call: "POST /pledges"
              payload: { donor_id: "${dn}", campaign_id: "${camp}", total_amount_cents: 10000, installment_count: 2, frequency: "MONTHLY", schedule_basis: "FRONT_LOADED" }
              as: GiftAdmin
              captures: { pl: $.data.id, pver_stale: $.data.version }
            - call: "POST /gifts"
              payload: { donor_id: "${dn}", campaign_id: "${camp}", amount_cents: 5000, pledge_id: "${pl}" }
              as: GiftAdmin
              captures: { g: $.data.id }
            - call: "POST /gifts/${g}/acknowledge"
              payload: {}
              as: DonorRelations
          trigger:
            - call: "POST /pledges/${pl}/cancel"
              payload: { expected_pledge_version: "${pver_stale}" }
              as: GiftAdmin
              captures: { err: $.data.error_id }
          assert:
            - "response status == 412"
            - "response data.error_id == ERR_STALE_VERSION"

      - name: occ_gift_refund_correct_version_succeeds
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[gift-refund-stale-version]", endpoints, "state_machines.Gift.ACKNOWLEDGED_to_REFUNDED"]
        distinguishing_aspect: "A refund carrying the gift's current (post-acknowledge) version succeeds and increments gift.version; the version field advances on every write."
        test_recipe:
          setup: ["OPEN campaign; donor; gift 5000 ACKNOWLEDGED; client captures the post-acknowledge version"]
          setup_api_calls:
            - call: "POST /campaigns"
              payload: { name: "Oc3", goal_cents: 1000000, starts_on: "2026-01-01T00:00:00Z", ends_on: "2026-12-31T00:00:00Z" }
              as: CampaignManager
              captures: { camp: $.data.id }
            - call: "POST /campaigns/${camp}/open"
              payload: {}
              as: CampaignManager
            - call: "POST /donors"
              payload: { full_name: "Oc3", email: "oc3@x.com" }
              as: GiftAdmin
              captures: { dn: $.data.id }
            - call: "POST /gifts"
              payload: { donor_id: "${dn}", campaign_id: "${camp}", amount_cents: 5000 }
              as: GiftAdmin
              captures: { g: $.data.id }
            - call: "POST /gifts/${g}/acknowledge"
              payload: {}
              as: DonorRelations
              captures: { gver: $.data.version }
          trigger:
            - call: "POST /gifts/${g}/refund"
              payload: { expected_gift_version: "${gver}" }
              as: GiftAdmin
              captures: { gver2: $.data.version }
          assert:
            - "Gift.${g}.status == REFUNDED"
            - "the returned version is strictly greater than ${gver}"

      - name: campaign_raised_derived_field_reconciliation_on_refund
        claim_type: derived_field_reconciliation
        grounds: [entities.Campaign.fields.raised_hard_cents, calculations.campaign_raised, state_machines.Gift.ACKNOWLEDGED_to_REFUNDED]
        distinguishing_aspect: "Campaign.raised_hard_cents is correct after acknowledge (5000) and correct after refund of the source gift (0) — derived field stays reconciled with its source gifts."
        test_recipe:
          setup: ["OPEN campaign; donor; gift 5000 ACKNOWLEDGED then refunded"]
          setup_api_calls:
            - call: "POST /campaigns"
              payload: { name: "Df", goal_cents: 1000000, starts_on: "2026-01-01T00:00:00Z", ends_on: "2026-12-31T00:00:00Z" }
              as: CampaignManager
              captures: { camp: $.data.id }
            - call: "POST /campaigns/${camp}/open"
              payload: {}
              as: CampaignManager
            - call: "POST /donors"
              payload: { full_name: "Df", email: "df@x.com" }
              as: GiftAdmin
              captures: { dn: $.data.id }
            - call: "POST /gifts"
              payload: { donor_id: "${dn}", campaign_id: "${camp}", amount_cents: 5000 }
              as: GiftAdmin
              captures: { g: $.data.id }
            - call: "POST /gifts/${g}/acknowledge"
              payload: {}
              as: DonorRelations
              captures: { gver: $.data.version }
          trigger:
            - call: "GET /campaigns/${camp}"
              payload: {}
              as: CampaignManager
              captures: { mid: $.data.raised_hard_cents }
            - call: "POST /gifts/${g}/refund"
              payload: { expected_gift_version: "${gver}" }
              as: GiftAdmin
            - call: "GET /campaigns/${camp}"
              payload: {}
              as: CampaignManager
          assert:
            - "the mid-read Campaign.${camp}.raised_hard_cents == 5000"
            - "the final Campaign.${camp}.raised_hard_cents == 0"

      - name: rate_threshold_match_min_gift_boundary
        claim_type: rate_threshold_triggers
        grounds: [calculations.match_amount, entities.Employer.fields.min_gift_cents, "validations[priority=12]"]
        distinguishing_aspect: "A gift exactly AT min_gift_cents (2500) is eligible (claim created), confirming the inclusive >= boundary that the below-min corner (1000) rejects."
        test_recipe:
          setup: ["OPEN campaign; employer min_gift 2500; donor; gift exactly 2500 ACKNOWLEDGED"]
          setup_api_calls:
            - call: "POST /campaigns"
              payload: { name: "Rt", goal_cents: 1000000, starts_on: "2026-01-01T00:00:00Z", ends_on: "2026-12-31T00:00:00Z" }
              as: CampaignManager
              captures: { camp: $.data.id }
            - call: "POST /campaigns/${camp}/open"
              payload: {}
              as: CampaignManager
            - call: "POST /employers"
              payload: { name: "Rt", match_ratio: 1.0, min_gift_cents: 2500, max_match_cents: 1000000, annual_match_cap_cents: 5000000 }
              as: CampaignManager
              captures: { emp: $.data.id }
            - call: "POST /donors"
              payload: { full_name: "Rt", email: "rt@x.com", employer_id: "${emp}" }
              as: GiftAdmin
              captures: { dn: $.data.id }
            - call: "POST /gifts"
              payload: { donor_id: "${dn}", campaign_id: "${camp}", amount_cents: 2500 }
              as: GiftAdmin
              captures: { g: $.data.id }
            - call: "POST /gifts/${g}/acknowledge"
              payload: {}
              as: DonorRelations
          trigger:
            - call: "POST /match-claims"
              payload: { gift_id: "${g}" }
              as: GiftAdmin
              captures: { mc: $.data.id }
          assert:
            - "response status == 201"
            - "MatchClaim.${mc}.requested_amount_cents == 2500"

  # =====================================================================
  # Consistency Model
  # =====================================================================
  - section: consistency_model
    instances:
      - name: immediate_acknowledge_visible_in_response
        claim_type: immediate
        grounds: [state_machines.Gift.RECORDED_to_ACKNOWLEDGED, entities.Gift.fields.status]
        distinguishing_aspect: "All cascade results (gift status ACKNOWLEDGED, acknowledged_at, deductible_amount_cents) are visible in the acknowledge call's own response — immediate consistency."
        test_recipe:
          setup: ["OPEN campaign; donor; RECORDED gift amount 20000 benefit 5000"]
          setup_api_calls:
            - call: "POST /campaigns"
              payload: { name: "Im2", goal_cents: 1000000, starts_on: "2026-01-01T00:00:00Z", ends_on: "2026-12-31T00:00:00Z" }
              as: CampaignManager
              captures: { camp: $.data.id }
            - call: "POST /campaigns/${camp}/open"
              payload: {}
              as: CampaignManager
            - call: "POST /donors"
              payload: { full_name: "Im2", email: "im2@x.com" }
              as: GiftAdmin
              captures: { dn: $.data.id }
            - call: "POST /gifts"
              payload: { donor_id: "${dn}", campaign_id: "${camp}", amount_cents: 20000, benefit_value_cents: 5000 }
              as: GiftAdmin
              captures: { g: $.data.id }
          trigger:
            - call: "POST /gifts/${g}/acknowledge"
              payload: {}
              as: DonorRelations
          assert:
            - "the acknowledge response Gift.${g}.status == ACKNOWLEDGED"
            - "the acknowledge response Gift.${g}.deductible_amount_cents == 15000"
            - "the acknowledge response Gift.${g}.acknowledged_at is non-null"
