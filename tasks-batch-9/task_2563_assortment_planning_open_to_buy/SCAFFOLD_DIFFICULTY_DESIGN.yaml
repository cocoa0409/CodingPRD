# ---------------------------------------------------------------------------
# 1.8 Scaffold Difficulty Design (Test Targeting Index)
# Task 2563 - Assortment Planning & Open-to-Buy
#
# Every literal in every `assert:` line below was produced by executing the
# relevant `calculations[].formula` from SCAFFOLD.yaml against the `setup:`
# inputs pinned in the same instance (contract item 7). The canonical spine
# used by most instances is:
#   clock            2026-08-01T00:00:00Z
#   Department       Womens Apparel / WAPP / fy2027 / sales 500,000,000 /
#                    margin 5600 / turn 320
#   Category         Dresses / DRSS / role DESTINATION / share 3000
#   StoreCluster     Cold-A / COLD / demo 10500 / tier A / 40 stores /
#                    sales index 11500
#   Vendor           Aurora Mills / AURM / lead 45d / capacity 12000 /
#                    min 200 / cutoff 21d -> AUTHORIZED, max_open_units 40000
#   CategoryPlan     SPRING 2027 / sales 150,000,000 / margin 5500 / turn 320
#                    -> receipt_budget_cents 60,000,000 on approval
#   PlanMonth M1     2027-03 / first_receipt 2027-03-05 / bom 20,000,000 /
#                    sales 30,000,000 / md 2,000,000 / eom 22,000,000
#                    -> reserve 700,000, otb_planned 18,200,000
#   PlanMonth M2     2027-04 / first_receipt 2027-04-02 / bom 22,000,000 /
#                    sales 36,000,000 / md 3,000,000 / eom 24,000,000
#                    -> reserve 770,000, otb_planned 21,970,000
#   OptionPlan OP1   BETTER / breadth 14 / depth 6 / unit cost 2400
#                    -> option_slots_total 14, target_units_per_option 276
#   Size curve OP1   XS 800 / S 2200 / M 3400 / L 2600 / XL 1000
#                    -> allocated 21 / 61 / 94 / 72 / 28
# ---------------------------------------------------------------------------
scaffold_difficulty_design:
  - rule_id: dual_variant_calc
    instances:
      - name: otb_basis_divergence_planned_vs_projected
        grounds:
          - calculations.plan_month_open_to_buy
          - calculations.markdown_reserve
          - entities.PlanMonth.fields.active_basis
          - entities.PlanMonth.fields.otb_planned_cents
          - state_machines.PlanMonth.LOCKED_PLAN_to_IN_SEASON
        distinguishing_aspect: |
          The dual variant here lives on PlanMonth and its subject is MONEY: the same authored
          month yields otb_planned_cents 18,200,000 under PLANNED_BASIS (authored sales, authored
          BOM) and 16,232,500 under PROJECTED_BASIS (sales re-projected from the posted weekly run
          rate, BOM rebuilt from actual receipts net of actual cost of sales) - a divergence of
          exactly 1,967,500 cents on identical stored inputs.
        test_recipe:
          setup:
            - "logical clock at 2026-08-01T00:00:00Z"
            - "the canonical spine: Department WAPP, Category DRSS (DESTINATION), StoreCluster Cold-A, Vendor Aurora Mills AUTHORIZED with an ACTIVE authorization for DRSS"
            - "CategoryPlan SPRING 2027 APPROVED with receipt_budget_cents 60,000,000; PlanMonth M1 and M2 LOCKED_PLAN with otb_planned_cents 18,200,000 and 21,970,000; OptionPlan OP1 SLOTTED"
            - "M1 moved to IN_SEASON with zero ActualsPost rows, so it still persists PLANNED_BASIS"
          setup_api_calls:
            - call: "POST /otb/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: MerchOpsAdmin
            - call: "POST /otb/departments"
              payload: { name: "Womens Apparel", code: "WAPP", fiscal_year: 2027, sales_target_cents: 500000000, margin_target_bps: 5600, turn_target_x100: 320 }
              as: MerchOpsAdmin
              captures: { dept_id: $.data.id }
            - call: "POST /otb/categories"
              payload: { department_id: "${dept_id}", name: "Dresses", code: "DRSS", role: "DESTINATION", sales_share_bps: 3000 }
              as: MerchOpsAdmin
              captures: { cat_id: $.data.id }
            - call: "POST /otb/store-clusters"
              payload: { name: "Cold-A", climate_zone: "COLD", demographic_index_bps: 10500, volume_tier: "A", store_count: 40, sales_index_bps: 11500 }
              as: MerchOpsAdmin
              captures: { cluster_id: $.data.id }
            - call: "POST /otb/vendors"
              payload: { name: "Aurora Mills", code: "AURM", lead_time_days: 45, weekly_unit_capacity: 12000, min_order_units: 200, cancel_cutoff_days: 21 }
              as: MerchOpsAdmin
              captures: { vendor_id: $.data.id }
            - call: "POST /otb/vendors/${vendor_id}/status"
              payload: { status: "AUTHORIZED" }
              as: MerchOpsAdmin
            - call: "POST /otb/vendor-authorizations"
              payload: { vendor_id: "${vendor_id}", category_id: "${cat_id}", max_open_units: 40000 }
              as: MerchOpsAdmin
              captures: { auth_id: $.data.id }
            - call: "POST /otb/category-plans"
              payload: { category_id: "${cat_id}", season_code: "SPRING", fiscal_year: 2027, planned_sales_cents: 150000000, planned_margin_bps: 5500, planned_turn_x100: 320 }
              as: MerchandisePlanner
              as_user_id: "planner-1"
              captures: { plan_id: $.data.id }
            - call: "POST /otb/plan-months"
              payload: { category_plan_id: "${plan_id}", month_index: 1, fiscal_month_label: "2027-03", first_receipt_date: "2027-03-05T00:00:00Z", bom_inventory_cents: 20000000, planned_sales_cents: 30000000, planned_markdown_cents: 2000000, planned_eom_cents: 22000000 }
              as: MerchandisePlanner
              as_user_id: "planner-1"
              captures: { m1_id: $.data.id }
            - call: "POST /otb/plan-months"
              payload: { category_plan_id: "${plan_id}", month_index: 2, fiscal_month_label: "2027-04", first_receipt_date: "2027-04-02T00:00:00Z", bom_inventory_cents: 22000000, planned_sales_cents: 36000000, planned_markdown_cents: 3000000, planned_eom_cents: 24000000 }
              as: MerchandisePlanner
              as_user_id: "planner-1"
              captures: { m2_id: $.data.id }
            - call: "POST /otb/option-plans"
              payload: { category_plan_id: "${plan_id}", store_cluster_id: "${cluster_id}", tier: "BETTER", breadth_target: 14, depth_units_per_option: 6, assumed_unit_cost_cents: 2400 }
              as: MerchandisePlanner
              as_user_id: "planner-1"
              captures: { op1_id: $.data.id }
            - call: "PUT /otb/option-plans/${op1_id}/size-curve"
              payload: { cells: [ { size_label: "XS", size_sort_order: 1, pct_bps: 800 }, { size_label: "S", size_sort_order: 2, pct_bps: 2200 }, { size_label: "M", size_sort_order: 3, pct_bps: 3400 }, { size_label: "L", size_sort_order: 4, pct_bps: 2600 }, { size_label: "XL", size_sort_order: 5, pct_bps: 1000 } ] }
              as: MerchandisePlanner
              as_user_id: "planner-1"
            - call: "POST /otb/category-plans/${plan_id}/submit"
              payload: { submission_note: "spring dresses v1" }
              as: MerchandisePlanner
              as_user_id: "planner-1"
            - call: "POST /otb/category-plans/${plan_id}/approve"
              payload: { approval_note: "approved" }
              as: PlanningDirector
              as_user_id: "director-1"
            - call: "POST /otb/plan-months/${m1_id}/open-season"
              payload: {}
              as: MerchandisePlanner
              as_user_id: "planner-1"
            - call: "GET /otb/plan-months/${m1_id}/otb-ledger"
              payload: { basis: "PLANNED_BASIS" }
              as: MerchandisePlanner
          trigger:
            - call: "POST /otb/actuals-posts"
              payload: { plan_month_id: "${m1_id}", week_index: 1, actual_sales_cents: 7500000, actual_receipts_cents: 6000000, actual_units_received: 2500 }
              as: MerchOpsAdmin
            - call: "GET /otb/plan-months/${m1_id}/otb-ledger"
              payload: { basis: "PLANNED_BASIS" }
              as: MerchandisePlanner
            - call: "GET /otb/plan-months/${m1_id}/otb-ledger"
              payload: { basis: "PROJECTED_BASIS" }
              as: MerchandisePlanner
          assert:
            - "before the trigger, GET /otb/plan-months/${m1_id}/otb-ledger with basis PLANNED_BASIS returns otb_planned_cents == 18200000, provisional_sell_through_bps == 6750, reserve_rate_bps == 350, markdown_reserve_cents == 700000, weeks_posted == 0"
            - "PlanMonth.${m1_id}.active_basis == PROJECTED_BASIS after the actuals post"
            - "PlanMonth.${m1_id}.provisional_sell_through_bps == 5967 and PlanMonth.${m1_id}.reserve_rate_bps == 600 and PlanMonth.${m1_id}.markdown_reserve_cents == 1357500"
            - "PlanMonth.${m1_id}.otb_planned_cents == 16232500 and PlanMonth.${m1_id}.otb_open_cents == 16232500"
            - "GET /otb/plan-months/${m1_id}/otb-ledger with basis PROJECTED_BASIS returns projected_sales_cost_cents == 13500000, projected_bom_cents == 22625000, otb_planned_cents == 16232500, weeks_posted == 1"
            - "GET /otb/plan-months/${m1_id}/otb-ledger with basis PLANNED_BASIS still returns otb_planned_cents == 18200000 after the post, because the on-demand PLANNED_BASIS read never consults ActualsPost"
            - "the two variants differ by exactly 18200000 - 16232500 == 1967500 cents on the same stored PlanMonth row"
            - "CategoryPlan.${plan_id}.variance_status == ON_PLAN and CategoryPlan.${plan_id}.sales_variance_bps == 0"
            - "CategoryPlan.${plan_id}.otb_posture == OPEN and CategoryPlan.${plan_id}.open_ratio_bps == 10000"
            - "PlanMonth.${m2_id}.otb_planned_cents == 21970000 and PlanMonth.${m2_id}.active_basis == PLANNED_BASIS - the basis switch is per-month, not per-plan"

      - name: sell_through_basis_divergence_new_vs_carryover
        grounds:
          - calculations.item_sell_through_forecast
          - entities.AssortmentItem.fields.lifecycle_stage
          - entities.AssortmentItem.fields.sell_through_basis
          - entities.AssortmentItem.fields.sell_through_bps
          - state_machines.AssortmentItem.PROPOSED_to_ADOPTED
        distinguishing_aspect: |
          A different entity domain and a different subject from the PlanMonth money variant: this
          dual variant lives on AssortmentItem and its subject is a RATE in basis points. Two rows
          that are byte-identical except for lifecycle_stage adopt into 6325 bps (NEW_ITEM_BASIS,
          driven by tier benchmark 5500 x cluster sales index 11500) and 7455 bps (CARRYOVER_BASIS,
          driven by prior_season_sell_through 7100 x demographic index 10500); the NEW row proves
          prior_season_sell_through_bps 9000 is discarded rather than blended.
        test_recipe:
          setup:
            - "the canonical spine with CategoryPlan SPRING 2027 APPROVED and OptionPlan OP1 SLOTTED with option_slots_total 14 and target_units_per_option 276"
            - "two PROPOSED AssortmentItem rows on OP1, identical except for lifecycle_stage: DRSS-NEW-01 is NEW and still carries prior_season_sell_through_bps 9000; DRSS-CAR-01 is CARRYOVER with prior_season_sell_through_bps 7100"
            - "no LocalizationOverlay exists, so effective_overlay_multiplier_bps resolves to the neutral 10000 for both"
          setup_api_calls:
            - call: "POST /otb/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: MerchOpsAdmin
            - call: "POST /otb/departments"
              payload: { name: "Womens Apparel", code: "WAPP", fiscal_year: 2027, sales_target_cents: 500000000, margin_target_bps: 5600, turn_target_x100: 320 }
              as: MerchOpsAdmin
              captures: { dept_id: $.data.id }
            - call: "POST /otb/categories"
              payload: { department_id: "${dept_id}", name: "Dresses", code: "DRSS", role: "DESTINATION", sales_share_bps: 3000 }
              as: MerchOpsAdmin
              captures: { cat_id: $.data.id }
            - call: "POST /otb/store-clusters"
              payload: { name: "Cold-A", climate_zone: "COLD", demographic_index_bps: 10500, volume_tier: "A", store_count: 40, sales_index_bps: 11500 }
              as: MerchOpsAdmin
              captures: { cluster_id: $.data.id }
            - call: "POST /otb/vendors"
              payload: { name: "Aurora Mills", code: "AURM", lead_time_days: 45, weekly_unit_capacity: 12000, min_order_units: 200, cancel_cutoff_days: 21 }
              as: MerchOpsAdmin
              captures: { vendor_id: $.data.id }
            - call: "POST /otb/vendors/${vendor_id}/status"
              payload: { status: "AUTHORIZED" }
              as: MerchOpsAdmin
            - call: "POST /otb/vendor-authorizations"
              payload: { vendor_id: "${vendor_id}", category_id: "${cat_id}", max_open_units: 40000 }
              as: MerchOpsAdmin
            - call: "POST /otb/category-plans"
              payload: { category_id: "${cat_id}", season_code: "SPRING", fiscal_year: 2027, planned_sales_cents: 150000000, planned_margin_bps: 5500, planned_turn_x100: 320 }
              as: MerchandisePlanner
              as_user_id: "planner-1"
              captures: { plan_id: $.data.id }
            - call: "POST /otb/plan-months"
              payload: { category_plan_id: "${plan_id}", month_index: 1, fiscal_month_label: "2027-03", first_receipt_date: "2027-03-05T00:00:00Z", bom_inventory_cents: 20000000, planned_sales_cents: 30000000, planned_markdown_cents: 2000000, planned_eom_cents: 22000000 }
              as: MerchandisePlanner
              as_user_id: "planner-1"
              captures: { m1_id: $.data.id }
            - call: "POST /otb/option-plans"
              payload: { category_plan_id: "${plan_id}", store_cluster_id: "${cluster_id}", tier: "BETTER", breadth_target: 14, depth_units_per_option: 6, assumed_unit_cost_cents: 2400 }
              as: MerchandisePlanner
              as_user_id: "planner-1"
              captures: { op1_id: $.data.id }
            - call: "PUT /otb/option-plans/${op1_id}/size-curve"
              payload: { cells: [ { size_label: "XS", size_sort_order: 1, pct_bps: 800 }, { size_label: "S", size_sort_order: 2, pct_bps: 2200 }, { size_label: "M", size_sort_order: 3, pct_bps: 3400 }, { size_label: "L", size_sort_order: 4, pct_bps: 2600 }, { size_label: "XL", size_sort_order: 5, pct_bps: 1000 } ] }
              as: MerchandisePlanner
              as_user_id: "planner-1"
            - call: "POST /otb/category-plans/${plan_id}/submit"
              payload: { submission_note: "spring dresses v1" }
              as: MerchandisePlanner
              as_user_id: "planner-1"
            - call: "POST /otb/category-plans/${plan_id}/approve"
              payload: { approval_note: "approved" }
              as: PlanningDirector
              as_user_id: "director-1"
            - call: "POST /otb/assortment-items"
              payload: { option_plan_id: "${op1_id}", vendor_id: "${vendor_id}", sku_code: "DRSS-NEW-01", color_code: "BLK", lifecycle_stage: "NEW", unit_cost_cents: 2500, retail_price_cents: 6900, prior_season_sell_through_bps: 9000 }
              as: MerchandisePlanner
              as_user_id: "planner-1"
              captures: { item_new_id: $.data.id }
            - call: "POST /otb/assortment-items"
              payload: { option_plan_id: "${op1_id}", vendor_id: "${vendor_id}", sku_code: "DRSS-CAR-01", color_code: "NVY", lifecycle_stage: "CARRYOVER", unit_cost_cents: 2500, retail_price_cents: 6900, prior_season_sell_through_bps: 7100 }
              as: MerchandisePlanner
              as_user_id: "planner-1"
              captures: { item_car_id: $.data.id }
          trigger:
            - call: "POST /otb/assortment-items/${item_new_id}/adopt"
              payload: {}
              as: CategoryBuyer
              as_user_id: "buyer-1"
            - call: "POST /otb/assortment-items/${item_car_id}/adopt"
              payload: {}
              as: CategoryBuyer
              as_user_id: "buyer-1"
          assert:
            - "AssortmentItem.${item_new_id}.sell_through_basis == NEW_ITEM_BASIS and AssortmentItem.${item_new_id}.sell_through_bps == 6325"
            - "AssortmentItem.${item_car_id}.sell_through_basis == CARRYOVER_BASIS and AssortmentItem.${item_car_id}.sell_through_bps == 7455"
            - "AssortmentItem.${item_new_id}.prior_season_sell_through_bps is still 9000 in the stored row yet contributed nothing: 6325 != 9000 and 6325 != 7455"
            - "AssortmentItem.${item_new_id}.effective_overlay_multiplier_bps == 10000 and AssortmentItem.${item_car_id}.effective_overlay_multiplier_bps == 10000"
            - "AssortmentItem.${item_new_id}.planned_units == 276 and AssortmentItem.${item_car_id}.planned_units == 276 - planned_units is basis-independent, only the rate diverges"
            - "AssortmentItem.${item_new_id}.status == ADOPTED and AssortmentItem.${item_car_id}.status == ADOPTED"
            - "OptionPlan.${op1_id}.option_slots_total == 14 and OptionPlan.${op1_id}.option_slots_assigned == 2 and OptionPlan.${op1_id}.option_slots_open == 12"

  - rule_id: combinatorial_formula
    instances:
      - name: receipt_budget_nested_min_max_department_cap
        grounds:
          - calculations.plan_receipt_budget
          - entities.CategoryPlan.fields.receipt_budget_cents
          - entities.Category.fields.role
          - entities.Department.fields.sales_target_cents
          - state_machines.CategoryPlan.SUBMITTED_to_APPROVED
          - validations[priority=38]
        distinguishing_aspect: |
          MODE (a) - four independent inputs (plan sales, plan margin, category role multiplier,
          plan turn) fold through a nested min(dept_cap, max(role_capacity, turn_capacity)) whose
          binding branch flips with the data: on the DESTINATION/turn-320 plan the outer min binds
          and receipt_budget_cents == 60,000,000 even though role capacity offered 67,500,000,
          while on the SEASONAL/turn-150 plan the inner max selects turn capacity and
          receipt_budget_cents == 101,250,000, beating role capacity 84,375,000 and staying under
          dept cap 108,000,000. No rounding-order question and no circularity are involved.
        test_recipe:
          setup:
            - "logical clock at 2026-08-01T00:00:00Z"
            - "Department WAPP with sales_target_cents 500,000,000 and Category DRSS with role DESTINATION"
            - "Department HOME with sales_target_cents 900,000,000 and Category BEDD with role SEASONAL"
            - "CategoryPlan A on DRSS: SPRING 2027, planned_sales 150,000,000, margin 5500, turn 320, one PlanMonth, one OptionPlan with a balanced size curve, SUBMITTED by planner-1"
            - "CategoryPlan B on BEDD: SPRING 2027, planned_sales 150,000,000, margin 5500, turn 150 (below the 200 turn floor, so the floor clamps it), one PlanMonth, one OptionPlan with a balanced size curve, SUBMITTED by planner-1"
          setup_api_calls:
            - call: "POST /otb/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: MerchOpsAdmin
            - call: "POST /otb/departments"
              payload: { name: "Womens Apparel", code: "WAPP", fiscal_year: 2027, sales_target_cents: 500000000, margin_target_bps: 5600, turn_target_x100: 320 }
              as: MerchOpsAdmin
              captures: { dept_a_id: $.data.id }
            - call: "POST /otb/departments"
              payload: { name: "Home Textiles", code: "HOME", fiscal_year: 2027, sales_target_cents: 900000000, margin_target_bps: 5200, turn_target_x100: 150 }
              as: MerchOpsAdmin
              captures: { dept_b_id: $.data.id }
            - call: "POST /otb/categories"
              payload: { department_id: "${dept_a_id}", name: "Dresses", code: "DRSS", role: "DESTINATION", sales_share_bps: 3000 }
              as: MerchOpsAdmin
              captures: { cat_a_id: $.data.id }
            - call: "POST /otb/categories"
              payload: { department_id: "${dept_b_id}", name: "Bedding", code: "BEDD", role: "SEASONAL", sales_share_bps: 4000 }
              as: MerchOpsAdmin
              captures: { cat_b_id: $.data.id }
            - call: "POST /otb/store-clusters"
              payload: { name: "Cold-A", climate_zone: "COLD", demographic_index_bps: 10500, volume_tier: "A", store_count: 40, sales_index_bps: 11500 }
              as: MerchOpsAdmin
              captures: { cluster_id: $.data.id }
            - call: "POST /otb/category-plans"
              payload: { category_id: "${cat_a_id}", season_code: "SPRING", fiscal_year: 2027, planned_sales_cents: 150000000, planned_margin_bps: 5500, planned_turn_x100: 320 }
              as: MerchandisePlanner
              as_user_id: "planner-1"
              captures: { plan_a_id: $.data.id }
            - call: "POST /otb/plan-months"
              payload: { category_plan_id: "${plan_a_id}", month_index: 1, fiscal_month_label: "2027-03", first_receipt_date: "2027-03-05T00:00:00Z", bom_inventory_cents: 20000000, planned_sales_cents: 30000000, planned_markdown_cents: 2000000, planned_eom_cents: 22000000 }
              as: MerchandisePlanner
              as_user_id: "planner-1"
              captures: { m_a1_id: $.data.id }
            - call: "POST /otb/option-plans"
              payload: { category_plan_id: "${plan_a_id}", store_cluster_id: "${cluster_id}", tier: "BETTER", breadth_target: 14, depth_units_per_option: 6, assumed_unit_cost_cents: 2400 }
              as: MerchandisePlanner
              as_user_id: "planner-1"
              captures: { op_a_id: $.data.id }
            - call: "PUT /otb/option-plans/${op_a_id}/size-curve"
              payload: { cells: [ { size_label: "XS", size_sort_order: 1, pct_bps: 800 }, { size_label: "S", size_sort_order: 2, pct_bps: 2200 }, { size_label: "M", size_sort_order: 3, pct_bps: 3400 }, { size_label: "L", size_sort_order: 4, pct_bps: 2600 }, { size_label: "XL", size_sort_order: 5, pct_bps: 1000 } ] }
              as: MerchandisePlanner
              as_user_id: "planner-1"
            - call: "POST /otb/category-plans/${plan_a_id}/submit"
              payload: { submission_note: "plan A" }
              as: MerchandisePlanner
              as_user_id: "planner-1"
            - call: "POST /otb/category-plans"
              payload: { category_id: "${cat_b_id}", season_code: "SPRING", fiscal_year: 2027, planned_sales_cents: 150000000, planned_margin_bps: 5500, planned_turn_x100: 150 }
              as: MerchandisePlanner
              as_user_id: "planner-1"
              captures: { plan_b_id: $.data.id }
            - call: "POST /otb/plan-months"
              payload: { category_plan_id: "${plan_b_id}", month_index: 1, fiscal_month_label: "2027-03", first_receipt_date: "2027-03-05T00:00:00Z", bom_inventory_cents: 30000000, planned_sales_cents: 40000000, planned_markdown_cents: 2500000, planned_eom_cents: 32000000 }
              as: MerchandisePlanner
              as_user_id: "planner-1"
              captures: { m_b1_id: $.data.id }
            - call: "POST /otb/option-plans"
              payload: { category_plan_id: "${plan_b_id}", store_cluster_id: "${cluster_id}", tier: "GOOD", breadth_target: 10, depth_units_per_option: 8, assumed_unit_cost_cents: 1800 }
              as: MerchandisePlanner
              as_user_id: "planner-1"
              captures: { op_b_id: $.data.id }
            - call: "PUT /otb/option-plans/${op_b_id}/size-curve"
              payload: { cells: [ { size_label: "S", size_sort_order: 1, pct_bps: 2500 }, { size_label: "M", size_sort_order: 2, pct_bps: 2500 }, { size_label: "L", size_sort_order: 3, pct_bps: 2500 }, { size_label: "XL", size_sort_order: 4, pct_bps: 2500 } ] }
              as: MerchandisePlanner
              as_user_id: "planner-1"
            - call: "POST /otb/category-plans/${plan_b_id}/submit"
              payload: { submission_note: "plan B" }
              as: MerchandisePlanner
              as_user_id: "planner-1"
          trigger:
            - call: "POST /otb/category-plans/${plan_a_id}/approve"
              payload: { approval_note: "A" }
              as: PlanningDirector
              as_user_id: "director-1"
            - call: "POST /otb/category-plans/${plan_b_id}/approve"
              payload: { approval_note: "B" }
              as: PlanningDirector
              as_user_id: "director-1"
          assert:
            - "CategoryPlan.${plan_a_id}.receipt_budget_cents == 60000000 - cost_of_goods 67500000, role_capacity 67500000, turn_capacity 63281250, dept_cap 60000000, so the outer min() is the binding branch"
            - "CategoryPlan.${plan_b_id}.receipt_budget_cents == 101250000 - cost_of_goods 67500000, role_capacity 84375000, turn_capacity 101250000 (turn floor 200 clamps the authored 150), dept_cap 108000000, so the inner max() picks turn capacity and the outer min() does not bind"
            - "the two budgets differ although both plans carry identical planned_sales_cents 150000000 and planned_margin_bps 5500: 60000000 != 101250000"
            - "CategoryPlan.${plan_b_id}.receipt_budget_cents != 67500000, proving turn_capacity was computed against the 200 floor and not against the authored 150"
            - "PlanMonth.${m_a1_id}.otb_planned_cents == 18200000 and PlanMonth.${m_b1_id}.otb_planned_cents == 24300000"
            - "OptionPlan.${op_a_id}.option_slots_total == 14 and OptionPlan.${op_b_id}.option_slots_total == 10 - budget_share 52396875 over cost_per_option 576000 affords 90 options, so breadth_target 10 binds"
            - "OptionPlan.${op_b_id}.target_units_per_option == 368 and every SizeCurveCell of ${op_b_id} has allocated_units == 92"

      - name: size_curve_per_cell_round_then_sum
        grounds:
          - calculations.cluster_size_allocation
          - entities.SizeCurveCell.fields.raw_units_x10000
          - entities.SizeCurveCell.fields.allocated_units
          - entities.SizeCurveCell.fields.size_sort_order
          - entities.OptionPlan.fields.target_units_per_option
          - state_machines.OptionPlan.OPEN_to_SLOTTED
        distinguishing_aspect: |
          MODE (b) - nested rounding whose ORDER changes the answer. The pinned order is
          round_half_up per size cell first, then sum, then reconcile the delta against the
          separately rounded target: per-cell rounding of the five cells gives 22 + 61 + 94 + 72 + 28
          == 277 while the target rounds to 276, so delta == -1 and XS (lowest fractional part, 800)
          loses one unit and stores allocated_units == 21. The alternative order - sum the raw
          demand and round once - would leave XS at 22 and the set at 277 units, so the stored 21
          falsifies it. This is not a nested min/max question and not a circularity question.
        test_recipe:
          setup:
            - "logical clock at 2026-08-01T00:00:00Z"
            - "the canonical spine through Department WAPP, Category DRSS, StoreCluster Cold-A (40 stores, sales_index_bps 11500)"
            - "CategoryPlan SPRING 2027 in DRAFT with PlanMonth M1 and OptionPlan OP1 (BETTER, breadth 14, depth 6, assumed_unit_cost 2400) still OPEN and carrying no size curve"
          setup_api_calls:
            - call: "POST /otb/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: MerchOpsAdmin
            - call: "POST /otb/departments"
              payload: { name: "Womens Apparel", code: "WAPP", fiscal_year: 2027, sales_target_cents: 500000000, margin_target_bps: 5600, turn_target_x100: 320 }
              as: MerchOpsAdmin
              captures: { dept_id: $.data.id }
            - call: "POST /otb/categories"
              payload: { department_id: "${dept_id}", name: "Dresses", code: "DRSS", role: "DESTINATION", sales_share_bps: 3000 }
              as: MerchOpsAdmin
              captures: { cat_id: $.data.id }
            - call: "POST /otb/store-clusters"
              payload: { name: "Cold-A", climate_zone: "COLD", demographic_index_bps: 10500, volume_tier: "A", store_count: 40, sales_index_bps: 11500 }
              as: MerchOpsAdmin
              captures: { cluster_id: $.data.id }
            - call: "POST /otb/category-plans"
              payload: { category_id: "${cat_id}", season_code: "SPRING", fiscal_year: 2027, planned_sales_cents: 150000000, planned_margin_bps: 5500, planned_turn_x100: 320 }
              as: MerchandisePlanner
              as_user_id: "planner-1"
              captures: { plan_id: $.data.id }
            - call: "POST /otb/plan-months"
              payload: { category_plan_id: "${plan_id}", month_index: 1, fiscal_month_label: "2027-03", first_receipt_date: "2027-03-05T00:00:00Z", bom_inventory_cents: 20000000, planned_sales_cents: 30000000, planned_markdown_cents: 2000000, planned_eom_cents: 22000000 }
              as: MerchandisePlanner
              as_user_id: "planner-1"
              captures: { m1_id: $.data.id }
            - call: "POST /otb/option-plans"
              payload: { category_plan_id: "${plan_id}", store_cluster_id: "${cluster_id}", tier: "BETTER", breadth_target: 14, depth_units_per_option: 6, assumed_unit_cost_cents: 2400 }
              as: MerchandisePlanner
              as_user_id: "planner-1"
              captures: { op1_id: $.data.id }
          trigger:
            - call: "PUT /otb/option-plans/${op1_id}/size-curve"
              payload: { cells: [ { size_label: "XS", size_sort_order: 1, pct_bps: 800 }, { size_label: "S", size_sort_order: 2, pct_bps: 2200 }, { size_label: "M", size_sort_order: 3, pct_bps: 3400 }, { size_label: "L", size_sort_order: 4, pct_bps: 2600 }, { size_label: "XL", size_sort_order: 5, pct_bps: 1000 } ] }
              as: MerchandisePlanner
              as_user_id: "planner-1"
            - call: "POST /otb/category-plans/${plan_id}/submit"
              payload: { submission_note: "curve pinned" }
              as: MerchandisePlanner
              as_user_id: "planner-1"
            - call: "POST /otb/category-plans/${plan_id}/approve"
              payload: { approval_note: "ok" }
              as: PlanningDirector
              as_user_id: "director-1"
          assert:
            - "the five SizeCurveCell rows of ${op1_id} store raw_units_x10000 == 220800 (XS), 607200 (S), 938400 (M), 717600 (L), 276000 (XL)"
            - "the five SizeCurveCell rows of ${op1_id} store allocated_units == 21 (XS), 61 (S), 94 (M), 72 (L), 28 (XL)"
            - "sum of allocated_units over ${op1_id} == 276, which equals round_half_up(6 * 40 * 11500 / 10000) == 276"
            - "XS.allocated_units == 21 although round_half_up(220800 / 10000) == 22 in isolation: the -1 delta was applied to XS because its fractional part 800 is the smallest in the set"
            - "no other cell was adjusted: S.allocated_units == 61 keeps its own per-cell rounding of 607200 (60.72 -> 61)"
            - "sum of allocated_units != 277, which is what per-cell rounding without delta reconciliation would produce"
            - "OptionPlan.${op1_id}.status == SLOTTED and OptionPlan.${op1_id}.target_units_per_option == 276 and OptionPlan.${op1_id}.option_slots_total == 14 after approval"

      - name: markdown_reserve_pinned_single_pass
        grounds:
          - calculations.markdown_reserve
          - calculations.plan_month_open_to_buy
          - entities.PlanMonth.fields.provisional_sell_through_bps
          - entities.PlanMonth.fields.reserve_rate_bps
          - entities.PlanMonth.fields.markdown_reserve_cents
          - state_machines.ReceiptCommitment.PROPOSED_to_COMMITTED
        distinguishing_aspect: |
          MODE (c) - a circular-looking dependency with a pinned evaluation order. markdown_reserve
          feeds otb_planned_cents, otb_planned_cents gates how many receipts may be committed, and
          committed receipts sit in the S1 denominator that selects the reserve rate. The pinned
          order is a single pass per trigger: committing 17,000,000 cents leaves
          provisional_sell_through_bps at 6750, reserve_rate_bps at 350, markdown_reserve_cents at
          700,000 and otb_planned_cents at 18,200,000 untouched, and the committed dollars first
          enter S1 at the next actuals post, exactly once, moving the month to 3686 / 900 /
          3,296,250 / 21,171,250. An iterate-to-fixed-point reading would move the reserve at commit
          time; a never-recompute reading would leave it at 700,000 after the post. Neither is the
          rule. This is not a min/max nesting question and not a rounding-order question.
        test_recipe:
          setup:
            - "the canonical spine with CategoryPlan SPRING 2027 APPROVED, PlanMonth M1 and M2 LOCKED_PLAN (otb_planned 18,200,000 and 21,970,000), OptionPlan OP1 SLOTTED"
