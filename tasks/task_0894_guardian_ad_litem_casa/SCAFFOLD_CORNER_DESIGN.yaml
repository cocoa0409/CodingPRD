# =============================================================================
# 1.9 Scaffold Corner Design (breadth coverage)
# Guardian-ad-Litem & CASA Volunteer Management — Expert
# Walks the claim-extraction guide against SCAFFOLD.yaml §1.1-§1.7. §1.8 depth
# instances are cited as excluded_because stubs where they already cover a corner.
# =============================================================================
scaffold_corner_design:

  # ------------------------------------------------------------------ Entities
  - section: entities
    instances:
      - name: create_volunteer_returns_201_with_defaults
        claim_type: Defaults
        grounds: [entities.Volunteer.fields.max_caseload, entities.Volunteer.fields.status]
        distinguishing_aspect: "POST /volunteers without max_caseload defaults it to 2; status starts PROSPECT, active_case_count 0, background_status NONE."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - { call: "POST /volunteers", payload: { full_name: "Val One", email: "v1@casa.org", home_zip: "94601" }, as: ProgramAdmin, captures: { v1_id: "$.data.id", mc: "$.data.max_caseload", st: "$.data.status", cnt: "$.data.active_case_count" } }
          assert:
            - "HTTP 201; Volunteer.${v1_id}.max_caseload == 2"
            - "status == PROSPECT and active_case_count == 0 and background_status == NONE"

      - name: get_volunteer_not_found_returns_404
        claim_type: Not Found
        grounds: ["errors[ERR_VOLUNTEER_NOT_FOUND]"]
        distinguishing_aspect: "GET /volunteers/{id} for a non-existent UUID returns ERR_VOLUNTEER_NOT_FOUND (404)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - { call: "GET /volunteers/00000000-0000-4000-8000-000000000000", payload: {}, as: ProgramAdmin, captures: { err: "$.data.error_id" } }
          assert: ["response error_id == ERR_VOLUNTEER_NOT_FOUND (HTTP 404)"]

      - name: create_case_missing_required_field_returns_400
        claim_type: Required Fields
        grounds: [entities.Case.fields.supervisor_id, "errors[ERR_VALIDATION]"]
        distinguishing_aspect: "POST /cases without supervisor_id (a required input) returns ERR_VALIDATION (400)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - { call: "POST /cases", payload: { child_initials: "J.D.", child_dob: "2018-04-01", jurisdiction: "CA-ALAMEDA" }, as: ProgramAdmin, captures: { err: "$.data.error_id" } }
          assert: ["response error_id == ERR_VALIDATION (HTTP 400)"]

      - name: create_case_unknown_supervisor_returns_404
        claim_type: Parent Relationships
        grounds: [entities.Case.fields.supervisor_id, "errors[ERR_SUPERVISOR_NOT_FOUND]"]
        distinguishing_aspect: "POST /cases with a supervisor_id that does not resolve returns ERR_SUPERVISOR_NOT_FOUND (404)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - { call: "POST /cases", payload: { child_initials: "J.D.", child_dob: "2018-04-01", jurisdiction: "CA-ALAMEDA", supervisor_id: "00000000-0000-4000-8000-000000000000" }, as: ProgramAdmin, captures: { err: "$.data.error_id" } }
          assert: ["response error_id == ERR_SUPERVISOR_NOT_FOUND (HTTP 404)"]

      - name: invalid_enum_contact_type_returns_400
        claim_type: Type Constraints
        grounds: [entities.Visit.fields.contact_type, "errors[ERR_VALIDATION]"]
        distinguishing_aspect: "POST visit with contact_type not in {IN_PERSON,VIDEO,PHONE,COLLATERAL} returns ERR_VALIDATION (400)."
        test_recipe:
          setup: ["Clock 2026-06-01; S1, V1 sworn+assigned to C1."]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-06-01T00:00:00Z" }, as: ProgramAdmin }
            - { call: "POST /supervisors", payload: { full_name: "Sup One", email: "s1@casa.org" }, as: ProgramAdmin, captures: { s1_id: "$.data.id" } }
            - { call: "POST /volunteers", payload: { full_name: "Val One", email: "v1@casa.org", home_zip: "94601" }, as: ProgramAdmin, captures: { v1_id: "$.data.id" } }
            - { call: "POST /volunteers/${v1_id}/start-screening", payload: {}, as: ProgramAdmin }
            - { call: "POST /volunteers/${v1_id}/background-checks", payload: { check_type: "STATE_AND_FEDERAL" }, as: ProgramAdmin, captures: { bg1_id: "$.data.id" } }
            - { call: "POST /background-checks/${bg1_id}/clear", payload: {}, as: ProgramAdmin }
            - { call: "POST /volunteers/${v1_id}/training-records", payload: { module_name: "CORE", hours: 30, completed_at: "2026-06-01T00:00:00Z" }, as: ProgramAdmin }
            - { call: "POST /volunteers/${v1_id}/swear-in", payload: {}, as: ProgramAdmin }
            - { call: "POST /cases", payload: { child_initials: "J.D.", child_dob: "2018-04-01", jurisdiction: "CA-ALAMEDA", supervisor_id: "${s1_id}" }, as: ProgramAdmin, captures: { c1_id: "$.data.id", c1_v0: "$.data.version" } }
            - { call: "POST /cases/${c1_id}/assignments", payload: { volunteer_id: "${v1_id}", expected_case_version: "${c1_v0}" }, as: Supervisor, as_user_id: "${s1_id}" }
          trigger:
            - { call: "POST /cases/${c1_id}/visits", payload: { contact_type: "SMOKE_SIGNAL", contact_start: "2026-06-05T10:00:00Z", contact_end: "2026-06-05T11:00:00Z" }, as: Volunteer, as_user_id: "${v1_id}", captures: { err: "$.data.error_id" } }
          assert: ["response error_id == ERR_VALIDATION (HTTP 400)"]

      - name: training_record_is_immutable_no_version
        claim_type: Immutability
        grounds: [entities.TrainingRecord]
        distinguishing_aspect: "TrainingRecord is common_fields:false — its create response carries id + created_at only, no version/updated_at, and there is no update endpoint."
        test_recipe:
          setup: ["A registered volunteer V1 (no swear-in needed)."]
          setup_api_calls:
            - { call: "POST /volunteers", payload: { full_name: "Val One", email: "v1@casa.org", home_zip: "94601" }, as: ProgramAdmin, captures: { v1_id: "$.data.id" } }
          trigger:
            - { call: "POST /volunteers/${v1_id}/training-records", payload: { module_name: "CORE", hours: 15, completed_at: "2026-05-10T00:00:00Z" }, as: ProgramAdmin, captures: { tr_id: "$.data.id" } }
          assert:
            - "HTTP 201; response data has id and created_at"
            - "response data has no version field and no updated_at field"

      - name: computed_estimated_reimbursement_correct
        claim_type: Computed Fields
        grounds: [entities.ExpenseClaim.fields.estimated_reimbursement_cents]
        excluded_because:
          difficulty_instance: dual_variant_calc / expense_provisional_vs_final_diverge
          rationale: "estimated_reimbursement_cents == 12000 is asserted directly by the named §1.8 instance."

  # ------------------------------------------------------------- State machines
  - section: state_machines
    instances:
      - name: swear_in_from_prospect_returns_invalid_state
        claim_type: invalid_transition
        grounds: [state_machines.Volunteer.TRAINING_to_ACTIVE, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Swear-in on a PROSPECT (not TRAINING) volunteer returns ERR_INVALID_STATE; status stays PROSPECT."
        test_recipe:
          setup: ["A registered volunteer V1 still in PROSPECT."]
          setup_api_calls:
            - { call: "POST /volunteers", payload: { full_name: "Val One", email: "v1@casa.org", home_zip: "94601" }, as: ProgramAdmin, captures: { v1_id: "$.data.id" } }
          trigger:
            - { call: "POST /volunteers/${v1_id}/swear-in", payload: {}, as: ProgramAdmin, captures: { err: "$.data.error_id" } }
          assert: ["response error_id == ERR_INVALID_STATE (HTTP 409)"]

      - name: double_clear_background_returns_invalid_state
        claim_type: idempotency
        grounds: [state_machines.BackgroundCheck.PENDING_to_CLEARED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Clearing an already-CLEARED background check a second time returns ERR_INVALID_STATE (not PENDING)."
        test_recipe:
          setup: ["V1 in SCREENING with one PENDING background check, then cleared once."]
          setup_api_calls:
            - { call: "POST /volunteers", payload: { full_name: "Val One", email: "v1@casa.org", home_zip: "94601" }, as: ProgramAdmin, captures: { v1_id: "$.data.id" } }
            - { call: "POST /volunteers/${v1_id}/start-screening", payload: {}, as: ProgramAdmin }
            - { call: "POST /volunteers/${v1_id}/background-checks", payload: { check_type: "STATE_ONLY" }, as: ProgramAdmin, captures: { bg1_id: "$.data.id" } }
            - { call: "POST /background-checks/${bg1_id}/clear", payload: {}, as: ProgramAdmin }
          trigger:
            - { call: "POST /background-checks/${bg1_id}/clear", payload: {}, as: ProgramAdmin, captures: { err: "$.data.error_id" } }
          assert: ["response error_id == ERR_INVALID_STATE (HTTP 409)"]

      - name: file_report_from_draft_returns_invalid_state
        claim_type: invalid_transition
        grounds: [state_machines.CourtReport.APPROVED_to_FILED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Filing a DRAFT (not APPROVED) court report returns ERR_INVALID_STATE."
        test_recipe:
          setup: ["Clock 2026-06-01; S1, V1 sworn+assigned to C1; hearing H1 SCHEDULED; DRAFT report R1."]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-06-01T00:00:00Z" }, as: ProgramAdmin }
            - { call: "POST /supervisors", payload: { full_name: "Sup One", email: "s1@casa.org" }, as: ProgramAdmin, captures: { s1_id: "$.data.id" } }
            - { call: "POST /volunteers", payload: { full_name: "Val One", email: "v1@casa.org", home_zip: "94601" }, as: ProgramAdmin, captures: { v1_id: "$.data.id" } }
            - { call: "POST /volunteers/${v1_id}/start-screening", payload: {}, as: ProgramAdmin }
            - { call: "POST /volunteers/${v1_id}/background-checks", payload: { check_type: "STATE_AND_FEDERAL" }, as: ProgramAdmin, captures: { bg1_id: "$.data.id" } }
            - { call: "POST /background-checks/${bg1_id}/clear", payload: {}, as: ProgramAdmin }
            - { call: "POST /volunteers/${v1_id}/training-records", payload: { module_name: "CORE", hours: 30, completed_at: "2026-06-01T00:00:00Z" }, as: ProgramAdmin }
            - { call: "POST /volunteers/${v1_id}/swear-in", payload: {}, as: ProgramAdmin }
            - { call: "POST /cases", payload: { child_initials: "J.D.", child_dob: "2018-04-01", jurisdiction: "CA-ALAMEDA", supervisor_id: "${s1_id}" }, as: ProgramAdmin, captures: { c1_id: "$.data.id", c1_v0: "$.data.version" } }
            - { call: "POST /cases/${c1_id}/assignments", payload: { volunteer_id: "${v1_id}", expected_case_version: "${c1_v0}" }, as: Supervisor, as_user_id: "${s1_id}" }
            - { call: "POST /cases/${c1_id}/hearings", payload: { hearing_type: "STATUS", scheduled_at: "2026-07-20T09:00:00Z" }, as: Supervisor, as_user_id: "${s1_id}", captures: { h1_id: "$.data.id" } }
            - { call: "POST /cases/${c1_id}/court-reports", payload: { hearing_id: "${h1_id}", content_summary: "s", recommendation: "r" }, as: Volunteer, as_user_id: "${v1_id}", captures: { r1_id: "$.data.id" } }
          trigger:
            - { call: "POST /court-reports/${r1_id}/file", payload: {}, as: Supervisor, as_user_id: "${s1_id}", captures: { err: "$.data.error_id" } }
          assert: ["response error_id == ERR_INVALID_STATE (HTTP 409)"]

      - name: hold_cancelled_hearing_returns_invalid_state
        claim_type: terminal_state_lockdown
        grounds: [state_machines.Hearing.SCHEDULED_to_HELD, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Holding a CANCELLED (terminal) hearing returns ERR_INVALID_STATE."
        test_recipe:
          setup: ["Clock 2026-06-01; S1, V1 sworn+assigned to C1; hearing H1 scheduled then CANCELLED."]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-06-01T00:00:00Z" }, as: ProgramAdmin }
            - { call: "POST /supervisors", payload: { full_name: "Sup One", email: "s1@casa.org" }, as: ProgramAdmin, captures: { s1_id: "$.data.id" } }
            - { call: "POST /volunteers", payload: { full_name: "Val One", email: "v1@casa.org", home_zip: "94601" }, as: ProgramAdmin, captures: { v1_id: "$.data.id" } }
            - { call: "POST /volunteers/${v1_id}/start-screening", payload: {}, as: ProgramAdmin }
            - { call: "POST /volunteers/${v1_id}/background-checks", payload: { check_type: "STATE_AND_FEDERAL" }, as: ProgramAdmin, captures: { bg1_id: "$.data.id" } }
            - { call: "POST /background-checks/${bg1_id}/clear", payload: {}, as: ProgramAdmin }
            - { call: "POST /volunteers/${v1_id}/training-records", payload: { module_name: "CORE", hours: 30, completed_at: "2026-06-01T00:00:00Z" }, as: ProgramAdmin }
            - { call: "POST /volunteers/${v1_id}/swear-in", payload: {}, as: ProgramAdmin }
            - { call: "POST /cases", payload: { child_initials: "J.D.", child_dob: "2018-04-01", jurisdiction: "CA-ALAMEDA", supervisor_id: "${s1_id}" }, as: ProgramAdmin, captures: { c1_id: "$.data.id", c1_v0: "$.data.version" } }
            - { call: "POST /cases/${c1_id}/assignments", payload: { volunteer_id: "${v1_id}", expected_case_version: "${c1_v0}" }, as: Supervisor, as_user_id: "${s1_id}" }
            - { call: "POST /cases/${c1_id}/hearings", payload: { hearing_type: "STATUS", scheduled_at: "2026-07-20T09:00:00Z" }, as: Supervisor, as_user_id: "${s1_id}", captures: { h1_id: "$.data.id" } }
            - { call: "POST /hearings/${h1_id}/cancel", payload: {}, as: Supervisor, as_user_id: "${s1_id}" }
          trigger:
            - { call: "POST /hearings/${h1_id}/hold", payload: {}, as: Supervisor, as_user_id: "${s1_id}", captures: { err: "$.data.error_id" } }
          assert: ["response error_id == ERR_INVALID_STATE (HTTP 409)"]

      - name: close_already_closed_case_returns_invalid_state
        claim_type: terminal_state_lockdown
        grounds: [state_machines.Case.ASSIGNED_to_CLOSED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Closing a CLOSED (terminal) case a second time returns ERR_INVALID_STATE."
        test_recipe:
          setup: ["Clock 2026-06-01; S1, V1 sworn+assigned to C1; one LOGGED visit; case CLOSED once."]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-06-01T00:00:00Z" }, as: ProgramAdmin }
            - { call: "POST /supervisors", payload: { full_name: "Sup One", email: "s1@casa.org" }, as: ProgramAdmin, captures: { s1_id: "$.data.id" } }
            - { call: "POST /volunteers", payload: { full_name: "Val One", email: "v1@casa.org", home_zip: "94601" }, as: ProgramAdmin, captures: { v1_id: "$.data.id" } }
            - { call: "POST /volunteers/${v1_id}/start-screening", payload: {}, as: ProgramAdmin }
            - { call: "POST /volunteers/${v1_id}/background-checks", payload: { check_type: "STATE_AND_FEDERAL" }, as: ProgramAdmin, captures: { bg1_id: "$.data.id" } }
            - { call: "POST /background-checks/${bg1_id}/clear", payload: {}, as: ProgramAdmin }
            - { call: "POST /volunteers/${v1_id}/training-records", payload: { module_name: "CORE", hours: 30, completed_at: "2026-06-01T00:00:00Z" }, as: ProgramAdmin }
            - { call: "POST /volunteers/${v1_id}/swear-in", payload: {}, as: ProgramAdmin }
            - { call: "POST /cases", payload: { child_initials: "J.D.", child_dob: "2018-04-01", jurisdiction: "CA-ALAMEDA", supervisor_id: "${s1_id}" }, as: ProgramAdmin, captures: { c1_id: "$.data.id", c1_v0: "$.data.version" } }
            - { call: "POST /cases/${c1_id}/assignments", payload: { volunteer_id: "${v1_id}", expected_case_version: "${c1_v0}" }, as: Supervisor, as_user_id: "${s1_id}" }
            - { call: "POST /cases/${c1_id}/visits", payload: { contact_type: "IN_PERSON", contact_start: "2026-06-05T10:00:00Z", contact_end: "2026-06-05T11:00:00Z", miles: 10 }, as: Volunteer, as_user_id: "${v1_id}" }
            - { call: "POST /cases/${c1_id}/close", payload: { outcome: "REUNIFICATION" }, as: Supervisor, as_user_id: "${s1_id}" }
          trigger:
            - { call: "POST /cases/${c1_id}/close", payload: { outcome: "ADOPTION" }, as: Supervisor, as_user_id: "${s1_id}", captures: { err: "$.data.error_id" } }
          assert: ["response error_id == ERR_INVALID_STATE (HTTP 409)"]

      - name: background_clear_auto_advances_volunteer_to_training
        claim_type: side_effect_execution
        grounds: [state_machines.BackgroundCheck.PENDING_to_CLEARED, state_machines.Volunteer.SCREENING_to_TRAINING]
        distinguishing_aspect: "Clearing the newest background check while the owner is SCREENING auto-transitions the Volunteer SCREENING->TRAINING and sets background_status CLEARED."
        test_recipe:
          setup: ["Clock 2026-06-01; V1 in SCREENING with a PENDING check."]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-06-01T00:00:00Z" }, as: ProgramAdmin }
            - { call: "POST /volunteers", payload: { full_name: "Val One", email: "v1@casa.org", home_zip: "94601" }, as: ProgramAdmin, captures: { v1_id: "$.data.id" } }
            - { call: "POST /volunteers/${v1_id}/start-screening", payload: {}, as: ProgramAdmin }
            - { call: "POST /volunteers/${v1_id}/background-checks", payload: { check_type: "STATE_AND_FEDERAL" }, as: ProgramAdmin, captures: { bg1_id: "$.data.id" } }
          trigger:
            - { call: "POST /background-checks/${bg1_id}/clear", payload: {}, as: ProgramAdmin }
            - { call: "GET /volunteers/${v1_id}", payload: {}, as: ProgramAdmin, captures: { st: "$.data.status", bgs: "$.data.background_status" } }
          assert:
            - "Volunteer.${v1_id}.status == TRAINING"
            - "Volunteer.${v1_id}.background_status == CLEARED"

      - name: report_revision_cycle_covered
        claim_type: cyclic
        grounds: [state_machines.CourtReport.RETURNED_to_DRAFT]
        excluded_because:
          difficulty_instance: non_linear_state_machine / court_report_revision_cycle
          rationale: "The RETURNED->DRAFT loop and revision_count increment are asserted by the named §1.8 instance."

  # --------------------------------------------------------------- Calculations
  - section: calculations
    instances:
      - name: expense_below_tier_estimate_equals_final
        claim_type: correct_result
        grounds: [calculations.expense_reimbursement]
        distinguishing_aspect: "For 50 miles / 3000c other (below TIER1_MILES and below caps) estimated == final == 5500c."
        test_recipe:
          setup: ["Clock 2026-06-01; S1, V1 sworn+assigned to C1 budget 20000."]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-06-01T00:00:00Z" }, as: ProgramAdmin }
            - { call: "POST /supervisors", payload: { full_name: "Sup One", email: "s1@casa.org" }, as: ProgramAdmin, captures: { s1_id: "$.data.id" } }
            - { call: "POST /volunteers", payload: { full_name: "Val One", email: "v1@casa.org", home_zip: "94601" }, as: ProgramAdmin, captures: { v1_id: "$.data.id" } }
            - { call: "POST /volunteers/${v1_id}/start-screening", payload: {}, as: ProgramAdmin }
            - { call: "POST /volunteers/${v1_id}/background-checks", payload: { check_type: "STATE_AND_FEDERAL" }, as: ProgramAdmin, captures: { bg1_id: "$.data.id" } }
            - { call: "POST /background-checks/${bg1_id}/clear", payload: {}, as: ProgramAdmin }
            - { call: "POST /volunteers/${v1_id}/training-records", payload: { module_name: "CORE", hours: 30, completed_at: "2026-06-01T00:00:00Z" }, as: ProgramAdmin }
            - { call: "POST /volunteers/${v1_id}/swear-in", payload: {}, as: ProgramAdmin }
            - { call: "POST /cases", payload: { child_initials: "J.D.", child_dob: "2018-04-01", jurisdiction: "CA-ALAMEDA", supervisor_id: "${s1_id}", reimbursement_budget_cents: 20000 }, as: ProgramAdmin, captures: { c1_id: "$.data.id", c1_v0: "$.data.version" } }
            - { call: "POST /cases/${c1_id}/assignments", payload: { volunteer_id: "${v1_id}", expected_case_version: "${c1_v0}" }, as: Supervisor, as_user_id: "${s1_id}" }
            - { call: "POST /expense-claims", payload: { case_id: "${c1_id}", period_month: "2026-06", total_miles: 50, other_expense_cents: 3000 }, as: Volunteer, as_user_id: "${v1_id}", captures: { ec_id: "$.data.id", est: "$.data.estimated_reimbursement_cents" } }
          trigger:
            - { call: "POST /expense-claims/${ec_id}/approve", payload: {}, as: Supervisor, as_user_id: "${s1_id}", captures: { fin: "$.data.final_reimbursement_cents" } }
          assert:
            - "ExpenseClaim.${ec_id}.estimated_reimbursement_cents == 5500"
            - "ExpenseClaim.${ec_id}.final_reimbursement_cents == 5500"

      - name: expense_monthly_cap_applied_on_final
        claim_type: constants_applied
        grounds: [calculations.expense_reimbursement]
        distinguishing_aspect: "For 400 miles / 6000c other the FINAL amount is clamped to MONTHLY_REIMBURSEMENT_CAP_CENTS = 15000 (raw 15500 mileage + 5000 other = 20500 -> 15000)."
        test_recipe:
          setup: ["Clock 2026-06-01; S1, V1 sworn+assigned to C1 budget 20000."]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-06-01T00:00:00Z" }, as: ProgramAdmin }
            - { call: "POST /supervisors", payload: { full_name: "Sup One", email: "s1@casa.org" }, as: ProgramAdmin, captures: { s1_id: "$.data.id" } }
            - { call: "POST /volunteers", payload: { full_name: "Val One", email: "v1@casa.org", home_zip: "94601" }, as: ProgramAdmin, captures: { v1_id: "$.data.id" } }
            - { call: "POST /volunteers/${v1_id}/start-screening", payload: {}, as: ProgramAdmin }
            - { call: "POST /volunteers/${v1_id}/background-checks", payload: { check_type: "STATE_AND_FEDERAL" }, as: ProgramAdmin, captures: { bg1_id: "$.data.id" } }
            - { call: "POST /background-checks/${bg1_id}/clear", payload: {}, as: ProgramAdmin }
            - { call: "POST /volunteers/${v1_id}/training-records", payload: { module_name: "CORE", hours: 30, completed_at: "2026-06-01T00:00:00Z" }, as: ProgramAdmin }
            - { call: "POST /volunteers/${v1_id}/swear-in", payload: {}, as: ProgramAdmin }
            - { call: "POST /cases", payload: { child_initials: "J.D.", child_dob: "2018-04-01", jurisdiction: "CA-ALAMEDA", supervisor_id: "${s1_id}", reimbursement_budget_cents: 20000 }, as: ProgramAdmin, captures: { c1_id: "$.data.id", c1_v0: "$.data.version" } }
            - { call: "POST /cases/${c1_id}/assignments", payload: { volunteer_id: "${v1_id}", expected_case_version: "${c1_v0}" }, as: Supervisor, as_user_id: "${s1_id}" }
