  # ===========================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: catalyst_activity_exactly_at_minimum_permits_run_approval
        grounds:
          - calculations.catalyst_activity_pct
          - validations[priority=13]
          - errors[ERR_CATALYST_ACTIVITY_TOO_LOW]
          - state_machines.ProductionRun.PLANNED_to_APPROVED
        distinguishing_aspect: |
          The gate is `activity_pct >= 55.00`, so a charge computing to exactly 55.00 (18000 of 40000
          hours) approves while a charge four hours older computing to 54.99 (18004 of 40000) is
          rejected — a one-hundredth-of-a-point step decides the outcome, and the two charges sit on
          sibling trains inside the same request sequence.
        test_recipe:
          setup:
            - "One plant with spot_gas_index_usd_per_mmbtu 4.20 and no hedge lots."
            - "Train RT-1 carrying charge CC-1 with design_life_hours 40000, baseline_operating_hours 18000, poisoning_index 0.00 -> activity_pct exactly 55.00."
            - "Train RT-2 carrying charge CC-2 with design_life_hours 40000, baseline_operating_hours 18004, poisoning_index 0.00 -> activity_pct 54.99."
            - "One PLANNED run on each train, over non-overlapping windows so the priority-19 overlap rule cannot interfere."
          setup_api_calls:
            - call: "POST /nitrogen-ops/plants"
              payload: { name: "Courtright Works", site_code: "CTR-1", permit_limit_tons_30d: 12.00, spot_gas_index_usd_per_mmbtu: 4.20 }
              as: RegulatoryAdmin
              captures: { plant_id: $.data.id }
            - call: "POST /nitrogen-ops/reformer-trains"
              payload: { plant_id: "${plant_id}", train_code: "RT-1", rated_ammonia_tpd: 700 }
              as: ProcessEngineer
              captures: { train1_id: $.data.id }
            - call: "POST /nitrogen-ops/reformer-trains"
              payload: { plant_id: "${plant_id}", train_code: "RT-2", rated_ammonia_tpd: 700 }
              as: ProcessEngineer
              captures: { train2_id: $.data.id }
            - call: "POST /nitrogen-ops/catalyst-charges"
              payload: { train_id: "${train1_id}", charge_code: "CC-1", design_life_hours: 40000, baseline_operating_hours: 18000, poisoning_index: 0.00 }
              as: ProcessEngineer
              captures: { charge1_id: $.data.id }
            - call: "POST /nitrogen-ops/catalyst-charges"
              payload: { train_id: "${train2_id}", charge_code: "CC-2", design_life_hours: 40000, baseline_operating_hours: 18004, poisoning_index: 0.00 }
              as: ProcessEngineer
              captures: { charge2_id: $.data.id }
            - call: "POST /nitrogen-ops/production-runs"
              payload: { train_id: "${train1_id}", run_code: "PR-1", window_start: "2026-09-01T00:00:00Z", window_end: "2026-09-11T00:00:00Z", target_ammonia_tons: 100 }
              as: ProcessEngineer
              as_user_id: "eng-author"
              captures: { run1_id: $.data.id }
            - call: "POST /nitrogen-ops/production-runs"
              payload: { train_id: "${train2_id}", run_code: "PR-2", window_start: "2026-09-01T00:00:00Z", window_end: "2026-09-11T00:00:00Z", target_ammonia_tons: 100 }
              as: ProcessEngineer
              as_user_id: "eng-author"
              captures: { run2_id: $.data.id }
          trigger:
            - call: "POST /nitrogen-ops/production-runs/${run1_id}/approve"
              payload: {}
              as: ProcessEngineer
              as_user_id: "eng-approver"
            - call: "POST /nitrogen-ops/production-runs/${run2_id}/approve"
              payload: {}
              as: ProcessEngineer
              as_user_id: "eng-approver"
          assert:
            - "CatalystCharge.${charge1_id}.activity_pct == 55.00"
            - "CatalystCharge.${charge2_id}.activity_pct == 54.99"
            - "the first trigger call returns HTTP status 200"
            - "ProductionRun.${run1_id}.status == APPROVED"
            - "ProductionRun.${run1_id}.provisional_unit_cost_usd_per_ton == 181.10"
            - "the second trigger call returns HTTP status 409"
            - "the second trigger call returns data.error_id == ERR_CATALYST_ACTIVITY_TOO_LOW"
            - "ProductionRun.${run2_id}.status == PLANNED"
            - "ProductionRun.${run2_id}.provisional_unit_cost_usd_per_ton == null"

      - name: emissions_rolling_exactly_at_permit_limit_is_not_an_exceedance
        grounds:
          - calculations.emissions_rolling_30d
          - calculations.plant_operating_posture
          - entities.EmissionsReading.fields.rolling_30d_tons
          - entities.EmissionsReading.fields.exceedance
          - state_machines.Plant.NORMAL_to_RESTRICTED
        distinguishing_aspect: |
          Exceedance is a STRICT greater-than, so a rolling total of exactly 12.000 tons against a
          permit_limit_tons_30d of 12.00 leaves exceedance false and the posture NORMAL, and it takes
          a further 0.012 tons (rolling 12.012) to flip both — a boundary in the third decimal place,
          not in the enum-valued posture the previous instance probed.
        test_recipe:
          setup:
            - "One plant with permit_limit_tons_30d 12.00 and the logical clock at its startup default 2026-08-01T00:00:00Z."
            - "No emissions readings yet, so the plant starts NORMAL with exceeded_pollutants empty."
            - "A NOX reading of 50.0 lb/hour over 480 hours is exactly 12.000 tons: 50.0 * 480 / 2000."
            - "A second NOX reading of 1.0 lb/hour over 24 hours adds exactly 0.012 tons."
          setup_api_calls:
            - call: "POST /nitrogen-ops/plants"
              payload: { name: "Sterlington Works", site_code: "STL-1", permit_limit_tons_30d: 12.00, spot_gas_index_usd_per_mmbtu: 4.20 }
              as: RegulatoryAdmin
              captures: { plant_id: $.data.id }
          trigger:
            - call: "POST /nitrogen-ops/emissions-readings"
              payload: { plant_id: "${plant_id}", pollutant: "NOX", rate_lb_per_hour: 50.0, interval_hours: 480, reading_at: "2026-08-01T00:00:00Z" }
              as: RegulatoryAdmin
              captures: { reading1_id: $.data.id }
            - call: "POST /nitrogen-ops/emissions-readings"
              payload: { plant_id: "${plant_id}", pollutant: "NOX", rate_lb_per_hour: 1.0, interval_hours: 24, reading_at: "2026-08-01T00:00:00Z" }
              as: RegulatoryAdmin
              captures: { reading2_id: $.data.id }
          assert:
            - "EmissionsReading.${reading1_id}.tons == 12.000"
            - "EmissionsReading.${reading1_id}.rolling_30d_tons == 12.000"
            - "EmissionsReading.${reading1_id}.exceedance == false"
            - "immediately after the first trigger call, Plant.${plant_id}.operating_posture == NORMAL and Plant.${plant_id}.exceeded_pollutants == []"
            - "EmissionsReading.${reading2_id}.tons == 0.012"
            - "EmissionsReading.${reading2_id}.rolling_30d_tons == 12.012"
            - "EmissionsReading.${reading2_id}.exceedance == true"
            - "Plant.${plant_id}.operating_posture == RESTRICTED"
            - "Plant.${plant_id}.exceeded_pollutants == [NOX]"

      - name: seasonal_reserve_appears_exactly_at_december_first
        grounds:
          - calculations.storage_position
          - entities.StorageAsset.fields.seasonal_reserve_tons
          - entities.StorageAsset.fields.available_tons
          - entities.StorageAsset.fields.seasonal_reserve_pct
        distinguishing_aspect: |
          The seasonal set-aside is switched by the calendar MONTH of the logical clock, so at
          2026-11-30T23:59:59Z seasonal_reserve_tons is 0.000 and available_tons is 10000.000, while
          one second later at 2026-12-01T00:00:00Z the same untouched asset reports 3000.000 and
          7000.000 — a one-second boundary on a derived tonnage, with no write to the asset in between.
        test_recipe:
          setup:
            - "One plant and one UREA dome of capacity_tons 20000 with seasonal_reserve_pct 0.15."
            - "An opening balance of 10000 tons on that dome and no shipments, so reserved_tons is 0.000."
          setup_api_calls:
            - call: "POST /nitrogen-ops/plants"
              payload: { name: "Cherokee Works", site_code: "CHK-1", permit_limit_tons_30d: 12.00, spot_gas_index_usd_per_mmbtu: 4.20 }
              as: RegulatoryAdmin
              captures: { plant_id: $.data.id }
            - call: "POST /nitrogen-ops/storage-assets"
              payload: { plant_id: "${plant_id}", asset_code: "UD-1", asset_kind: "DOME", product_code: "UREA", capacity_tons: 20000, security_class: "BASIC", seasonal_reserve_pct: 0.15 }
              as: LogisticsCoordinator
              captures: { dome_id: $.data.id }
            - call: "POST /nitrogen-ops/storage-assets/${dome_id}/opening-balance"
              payload: { opening_balance_tons: 10000 }
              as: LogisticsCoordinator
          trigger:
            - call: "POST /nitrogen-ops/_clock/set_current_utc"
              payload: { to_iso8601: "2026-11-30T23:59:59Z" }
              as: RegulatoryAdmin
            - call: "GET /nitrogen-ops/storage-assets/${dome_id}"
              payload: {}
              as: LogisticsCoordinator
            - call: "POST /nitrogen-ops/_clock/set_current_utc"
              payload: { to_iso8601: "2026-12-01T00:00:00Z" }
              as: RegulatoryAdmin
            - call: "GET /nitrogen-ops/storage-assets/${dome_id}"
              payload: {}
              as: LogisticsCoordinator
          assert:
            - "the first GET returns data.seasonal_reserve_tons == 0.000"
            - "the first GET returns data.available_tons == 10000.000"
            - "the second GET returns data.seasonal_reserve_tons == 3000.000"
            - "the second GET returns data.available_tons == 7000.000"
            - "both GETs return data.on_hand_tons == 10000.000 and data.reserved_tons == 0.000"
            - "StorageAsset.${dome_id}.opening_balance_tons == 10000.000"

  # ===========================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: run_approval_blocked_by_low_activity_charge_on_same_train
        grounds:
          - validations[priority=13]
          - errors[ERR_CATALYST_ACTIVITY_TOO_LOW]
          - state_machines.ProductionRun.PLANNED_to_APPROVED
          - calculations.catalyst_activity_pct
          - entities.CatalystCharge.fields.activity_pct
        distinguishing_aspect: |
          The (ProductionRun, CatalystCharge) pair: whether a run may be APPROVED depends on a field
          of a third entity two FK hops away (ProductionRun.train_id -> ReformerTrain -> its ACTIVE
          CatalystCharge.activity_pct == 25.00), and nothing about the run itself is invalid.
        test_recipe:
          setup:
            - "One plant, one reformer train, and one ACTIVE catalyst charge with design_life_hours 40000 and baseline_operating_hours 30000, so activity_pct is 25.00 — well under the 55.00 floor — while the train itself is still IDLE and therefore passes the priority-14 availability gate."
            - "One PLANNED run on that train over 2026-09-01 -> 2026-09-11."
          setup_api_calls:
            - call: "POST /nitrogen-ops/plants"
              payload: { name: "Billingham Works", site_code: "BLH-1", permit_limit_tons_30d: 12.00, spot_gas_index_usd_per_mmbtu: 4.20 }
              as: RegulatoryAdmin
              captures: { plant_id: $.data.id }
            - call: "POST /nitrogen-ops/reformer-trains"
              payload: { plant_id: "${plant_id}", train_code: "RT-1", rated_ammonia_tpd: 600 }
              as: ProcessEngineer
              captures: { train_id: $.data.id }
            - call: "POST /nitrogen-ops/catalyst-charges"
              payload: { train_id: "${train_id}", charge_code: "CC-1", design_life_hours: 40000, baseline_operating_hours: 30000, poisoning_index: 0.00 }
              as: ProcessEngineer
              captures: { charge_id: $.data.id }
            - call: "POST /nitrogen-ops/production-runs"
              payload: { train_id: "${train_id}", run_code: "PR-1", window_start: "2026-09-01T00:00:00Z", window_end: "2026-09-11T00:00:00Z", target_ammonia_tons: 100 }
              as: ProcessEngineer
              as_user_id: "eng-author"
              captures: { run_id: $.data.id }
          trigger:
            - call: "POST /nitrogen-ops/production-runs/${run_id}/approve"
              payload: {}
              as: ProcessEngineer
              as_user_id: "eng-approver"
          assert:
            - "response HTTP status == 409"
            - "response data.error_id == ERR_CATALYST_ACTIVITY_TOO_LOW"
            - "CatalystCharge.${charge_id}.activity_pct == 25.00"
            - "CatalystCharge.${charge_id}.calendar_activity_pct == 25.00"
            - "CatalystCharge.${charge_id}.status == ACTIVE"
            - "ReformerTrain.${train_id}.status == IDLE"
            - "ProductionRun.${run_id}.status == PLANNED"
            - "ProductionRun.${run_id}.provisional_unit_cost_usd_per_ton == null"

      - name: shipment_booking_blocked_by_frozen_plant_posture
        grounds:
          - validations[priority=10]
          - errors[ERR_PLANT_FROZEN]
          - state_machines.Plant.NORMAL_to_FROZEN
          - state_machines.Shipment.DRAFT_to_BOOKED
          - calculations.plant_operating_posture
        distinguishing_aspect: |
          A different entity pair and a different direction of dependency from the run/catalyst case:
          (Shipment, Plant), where the governing plant is reached through the ORIGIN StorageAsset's
          plant_id, and the blocking field is a derived enum (operating_posture FROZEN after the air
          permit is SUSPENDED) rather than a numeric threshold.
        test_recipe:
          setup:
            - "One plant with two UREA terminals of capacity_tons 20000; the origin holds an opening balance of 10000 tons."
            - "One DRAFT shipment of 1000 tons over 100 RAIL miles between them."
            - "The plant's air permit is then set to SUSPENDED, which derives operating_posture FROZEN."
            - "The origin asset's version is read AFTER the freeze, so the OCC precondition is satisfied and cannot be the reason for the rejection."
          setup_api_calls:
            - call: "POST /nitrogen-ops/plants"
              payload: { name: "Kenai Works", site_code: "KNI-1", permit_limit_tons_30d: 12.00, spot_gas_index_usd_per_mmbtu: 4.20 }
              as: RegulatoryAdmin
              captures: { plant_id: $.data.id }
            - call: "POST /nitrogen-ops/product-lines"
              payload: { plant_id: "${plant_id}", product_code: "UREA", ammonia_tons_per_product_ton: 0.58, conversion_cost_usd_per_ton: 38.00, regulated: false, priority_rank: 1 }
              as: CommercialManager
              captures: { urea_line_id: $.data.id }
            - call: "POST /nitrogen-ops/storage-assets"
              payload: { plant_id: "${plant_id}", asset_code: "UT-ORIG", asset_kind: "TERMINAL", product_code: "UREA", capacity_tons: 20000, security_class: "BASIC", seasonal_reserve_pct: 0.00 }
              as: LogisticsCoordinator
              captures: { origin_id: $.data.id }
            - call: "POST /nitrogen-ops/storage-assets"
              payload: { plant_id: "${plant_id}", asset_code: "UT-DEST", asset_kind: "TERMINAL", product_code: "UREA", capacity_tons: 20000, security_class: "BASIC", seasonal_reserve_pct: 0.00 }
              as: LogisticsCoordinator
              captures: { dest_id: $.data.id }
            - call: "POST /nitrogen-ops/storage-assets/${origin_id}/opening-balance"
              payload: { opening_balance_tons: 10000 }
              as: LogisticsCoordinator
            - call: "POST /nitrogen-ops/shipments"
              payload: { origin_asset_id: "${origin_id}", dest_asset_id: "${dest_id}", shipment_code: "SH-1", mode: "RAIL", tons: 1000, distance_miles: 100, window_start: "2026-08-05T00:00:00Z", window_end: "2026-08-10T00:00:00Z" }
              as: LogisticsCoordinator
              captures: { ship_id: $.data.id }
            - call: "POST /nitrogen-ops/plants/${plant_id}/permit-status"
              payload: { permit_status: "SUSPENDED" }
              as: RegulatoryAdmin
            - call: "GET /nitrogen-ops/storage-assets/${origin_id}"
              payload: {}
              as: LogisticsCoordinator
              captures: { origin_ver: $.data.version }
          trigger:
            - call: "POST /nitrogen-ops/shipments/${ship_id}/book"
              payload: { expected_origin_asset_version: "${origin_ver}" }
              as: LogisticsCoordinator
          assert:
            - "response HTTP status == 409"
            - "response data.error_id == ERR_PLANT_FROZEN"
            - "response data.error_id != ERR_STALE_STORAGE_VERSION"
            - "Plant.${plant_id}.permit_status == SUSPENDED"
            - "Plant.${plant_id}.operating_posture == FROZEN"
            - "Shipment.${ship_id}.status == DRAFT"
            - "Shipment.${ship_id}.base_freight_usd == null"
            - "Shipment.${ship_id}.freight_total_usd == null"
            - "StorageAsset.${origin_id}.reserved_tons == 0.000"

      - name: turnaround_completion_blocked_by_undone_child_task
        grounds:
          - state_machines.Turnaround.IN_PROGRESS_to_COMPLETED
          - state_machines.TurnaroundTask.READY_to_DONE
          - validations[priority=9]
          - errors[ERR_INVALID_STATE]
          - entities.Turnaround.fields.tasks_done_count
          - entities.Turnaround.fields.tasks_total_count
        distinguishing_aspect: |
          A parent-from-children dependency, the inverse of the two instances above: the Turnaround
          cannot leave IN_PROGRESS while tasks_done_count (1) is below tasks_total_count (2), so the
          blocking state lives on child rows of a self-referential task graph and the catalyst
          replacement side effect must not have run.
        test_recipe:
          setup:
            - "One plant, one reformer train, and one ACTIVE zero-hour catalyst charge CC-1."
            - "A CATALYST_CHANGE turnaround over 2026-11-01 -> 2026-11-27 with TK-A of 7 days and TK-B of 14 days depending on TK-A (critical_path_days 21 <= window_days 26), SUBMITTED and ENDORSED and APPROVED."
            - "The clock is advanced to 2026-11-01 and the turnaround is STARTED, making TK-A READY."
            - "TK-A is completed, which makes TK-B READY and leaves tasks_done_count at 1 of 2."
          setup_api_calls:
            - call: "POST /nitrogen-ops/plants"
              payload: { name: "Waggaman Works", site_code: "WGM-1", permit_limit_tons_30d: 12.00, spot_gas_index_usd_per_mmbtu: 4.20 }
              as: RegulatoryAdmin
              captures: { plant_id: $.data.id }
            - call: "POST /nitrogen-ops/reformer-trains"
              payload: { plant_id: "${plant_id}", train_code: "RT-1", rated_ammonia_tpd: 1000 }
              as: ProcessEngineer
              captures: { train_id: $.data.id }
            - call: "POST /nitrogen-ops/catalyst-charges"
              payload: { train_id: "${train_id}", charge_code: "CC-1", design_life_hours: 40000, baseline_operating_hours: 0, poisoning_index: 0.00 }
              as: ProcessEngineer
              captures: { charge_id: $.data.id }
            - call: "POST /nitrogen-ops/turnarounds"
              payload: { plant_id: "${plant_id}", train_id: "${train_id}", turnaround_code: "TA-1", scope: "CATALYST_CHANGE", window_start: "2026-11-01T00:00:00Z", window_end: "2026-11-27T00:00:00Z" }
              as: ProcessEngineer
              as_user_id: "eng-author"
              captures: { ta_id: $.data.id }
            - call: "POST /nitrogen-ops/turnaround-tasks"
              payload: { turnaround_id: "${ta_id}", task_code: "TK-A", duration_days: 7 }
              as: ProcessEngineer
              as_user_id: "eng-author"
              captures: { task_a_id: $.data.id }
            - call: "POST /nitrogen-ops/turnaround-tasks"
              payload: { turnaround_id: "${ta_id}", predecessor_task_id: "${task_a_id}", task_code: "TK-B", duration_days: 14 }
              as: ProcessEngineer
              as_user_id: "eng-author"
              captures: { task_b_id: $.data.id }
            - call: "POST /nitrogen-ops/turnarounds/${ta_id}/submit"
              payload: {}
              as: ProcessEngineer
              as_user_id: "eng-author"
            - call: "POST /nitrogen-ops/turnarounds/${ta_id}/psm-review"
              payload: { decision: "ENDORSED", findings_count: 0 }
              as: SafetyOfficer
              as_user_id: "so-reviewer"
            - call: "POST /nitrogen-ops/turnarounds/${ta_id}/approve"
              payload: {}
              as: SafetyOfficer
              as_user_id: "so-approver"
            - call: "POST /nitrogen-ops/_clock/set_current_utc"
              payload: { to_iso8601: "2026-11-01T00:00:00Z" }
              as: RegulatoryAdmin
            - call: "POST /nitrogen-ops/turnarounds/${ta_id}/start"
              payload: {}
              as: ProcessEngineer
              as_user_id: "eng-author"
            - call: "POST /nitrogen-ops/turnaround-tasks/${task_a_id}/complete"
              payload: {}
              as: ProcessEngineer
              as_user_id: "eng-author"
          trigger:
            - call: "POST /nitrogen-ops/turnarounds/${ta_id}/complete"
              payload: { new_charge_code: "CC-2", new_charge_design_life_hours: 40000 }
              as: ProcessEngineer
              as_user_id: "eng-author"
          assert:
            - "response HTTP status == 409"
            - "response data.error_id == ERR_INVALID_STATE"
            - "Turnaround.${ta_id}.status == IN_PROGRESS"
            - "Turnaround.${ta_id}.tasks_done_count == 1"
            - "Turnaround.${ta_id}.tasks_total_count == 2"
            - "TurnaroundTask.${task_a_id}.status == DONE"
            - "TurnaroundTask.${task_b_id}.status == READY"
            - "CatalystCharge.${charge_id}.status == ACTIVE"
            - "GET /nitrogen-ops/catalyst-charges?train_id=${train_id} returns total_count == 1"
            - "ReformerTrain.${train_id}.status == DOWN_FOR_TURNAROUND"

  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: run_windows_may_touch_but_may_not_overlap_on_one_train
        grounds:
          - validations[priority=19]
          - errors[ERR_RUN_WINDOW_OVERLAP]
          - entities.ProductionRun.fields.window_start
          - entities.ProductionRun.fields.window_end
          - state_machines.ProductionRun.PLANNED_to_APPROVED
        distinguishing_aspect: |
          The shared resource is the ReformerTrain and the interval is HALF-OPEN [window_start,
          window_end), so a run beginning exactly at 2026-09-11T00:00:00Z where the previous one ends
          is accepted while one beginning a day earlier is rejected; adjacency is explicitly not
          overlap for this resource.
        test_recipe:
          setup:
            - "One plant, one reformer train, one ACTIVE zero-hour catalyst charge."
            - "ProductionRun PR-A over 2026-09-01 -> 2026-09-11 exists and is APPROVED."
          setup_api_calls:
            - call: "POST /nitrogen-ops/plants"
              payload: { name: "Coffeyville Works", site_code: "CFV-1", permit_limit_tons_30d: 12.00, spot_gas_index_usd_per_mmbtu: 4.20 }
              as: RegulatoryAdmin
              captures: { plant_id: $.data.id }
            - call: "POST /nitrogen-ops/reformer-trains"
              payload: { plant_id: "${plant_id}", train_code: "RT-1", rated_ammonia_tpd: 1200 }
              as: ProcessEngineer
              captures: { train_id: $.data.id }
            - call: "POST /nitrogen-ops/catalyst-charges"
              payload: { train_id: "${train_id}", charge_code: "CC-1", design_life_hours: 40000, baseline_operating_hours: 0, poisoning_index: 0.00 }
              as: ProcessEngineer
              captures: { charge_id: $.data.id }
            - call: "POST /nitrogen-ops/production-runs"
              payload: { train_id: "${train_id}", run_code: "PR-A", window_start: "2026-09-01T00:00:00Z", window_end: "2026-09-11T00:00:00Z", target_ammonia_tons: 1000 }
              as: ProcessEngineer
              as_user_id: "eng-author"
              captures: { run_a_id: $.data.id }
            - call: "POST /nitrogen-ops/production-runs/${run_a_id}/approve"
              payload: {}
              as: ProcessEngineer
              as_user_id: "eng-approver"
          trigger:
            - call: "POST /nitrogen-ops/production-runs"
              payload: { train_id: "${train_id}", run_code: "PR-B", window_start: "2026-09-11T00:00:00Z", window_end: "2026-09-20T00:00:00Z", target_ammonia_tons: 1000 }
              as: ProcessEngineer
              as_user_id: "eng-author"
              captures: { run_b_id: $.data.id }
            - call: "POST /nitrogen-ops/production-runs"
              payload: { train_id: "${train_id}", run_code: "PR-C", window_start: "2026-09-10T00:00:00Z", window_end: "2026-09-15T00:00:00Z", target_ammonia_tons: 1000 }
              as: ProcessEngineer
              as_user_id: "eng-author"
          assert:
            - "the first trigger call returns HTTP status 201"
            - "ProductionRun.${run_b_id}.status == PLANNED"
            - "ProductionRun.${run_b_id}.window_start == 2026-09-11T00:00:00.000Z"
            - "the second trigger call returns HTTP status 409"
            - "the second trigger call returns data.error_id == ERR_RUN_WINDOW_OVERLAP"
            - "GET /nitrogen-ops/production-runs?train_id=${train_id} returns total_count == 2"

      - name: turnaround_windows_need_fourteen_whole_days_of_separation
        grounds:
          - validations[priority=20]
          - errors[ERR_TURNAROUND_BUFFER_CONFLICT]
          - calculations.turnaround_task_schedule
          - state_machines.Turnaround.SUBMITTED_to_APPROVED
          - entities.Turnaround.fields.window_days
        distinguishing_aspect: |
          A different resource and a different interval algebra from the run-window instance: the
          shared resource is the Plant, the windows are CLOSED [window_start, window_end], and
          non-intersection is not sufficient — a 14-whole-day separation buffer is required, so a
          window opening 13 days after the previous one ends is rejected while one opening exactly 14
          days after is approved. SUBMITTED neighbours are invisible to the check, which is why the
          rejected TA-2 does not block TA-3.
        test_recipe:
          setup:
            - "One plant, one reformer train, one ACTIVE zero-hour catalyst charge."
            - "Turnaround TA-1 over 2026-10-01 -> 2026-10-27 with one 5-day task is APPROVED."
            - "Turnaround TA-2 over 2026-11-09 -> 2026-11-29 with one 5-day task is SUBMITTED and ENDORSED; its window starts 13 whole days after TA-1 ends."
            - "Turnaround TA-3 over 2026-11-10 -> 2026-11-30 with one 5-day task is SUBMITTED and ENDORSED; its window starts exactly 14 whole days after TA-1 ends."
          setup_api_calls:
            - call: "POST /nitrogen-ops/plants"
              payload: { name: "Verdigris South", site_code: "VDS-1", permit_limit_tons_30d: 12.00, spot_gas_index_usd_per_mmbtu: 4.20 }
              as: RegulatoryAdmin
              captures: { plant_id: $.data.id }
            - call: "POST /nitrogen-ops/reformer-trains"
              payload: { plant_id: "${plant_id}", train_code: "RT-1", rated_ammonia_tpd: 1000 }
              as: ProcessEngineer
              captures: { train_id: $.data.id }
            - call: "POST /nitrogen-ops/catalyst-charges"
              payload: { train_id: "${train_id}", charge_code: "CC-1", design_life_hours: 40000, baseline_operating_hours: 0, poisoning_index: 0.00 }
              as: ProcessEngineer
              captures: { charge_id: $.data.id }
            - call: "POST /nitrogen-ops/turnarounds"
              payload: { plant_id: "${plant_id}", train_id: "${train_id}", turnaround_code: "TA-1", scope: "VESSEL_INSPECTION", window_start: "2026-10-01T00:00:00Z", window_end: "2026-10-27T00:00:00Z" }
              as: ProcessEngineer
              as_user_id: "eng-author"
              captures: { ta1_id: $.data.id }
            - call: "POST /nitrogen-ops/turnaround-tasks"
              payload: { turnaround_id: "${ta1_id}", task_code: "TK-1A", duration_days: 5 }
              as: ProcessEngineer
              as_user_id: "eng-author"
              captures: { task_1a_id: $.data.id }
            - call: "POST /nitrogen-ops/turnarounds/${ta1_id}/submit"
              payload: {}
              as: ProcessEngineer
              as_user_id: "eng-author"
            - call: "POST /nitrogen-ops/turnarounds/${ta1_id}/psm-review"
              payload: { decision: "ENDORSED", findings_count: 0 }
              as: SafetyOfficer
              as_user_id: "so-reviewer"
            - call: "POST /nitrogen-ops/turnarounds/${ta1_id}/approve"
              payload: {}
              as: SafetyOfficer
              as_user_id: "so-approver"
            - call: "POST /nitrogen-ops/turnarounds"
              payload: { plant_id: "${plant_id}", train_id: "${train_id}", turnaround_code: "TA-2", scope: "VESSEL_INSPECTION", window_start: "2026-11-09T00:00:00Z", window_end: "2026-11-29T00:00:00Z" }
              as: ProcessEngineer
              as_user_id: "eng-author"
              captures: { ta2_id: $.data.id }
            - call: "POST /nitrogen-ops/turnaround-tasks"
              payload: { turnaround_id: "${ta2_id}", task_code: "TK-2A", duration_days: 5 }
              as: ProcessEngineer
              as_user_id: "eng-author"
              captures: { task_2a_id: $.data.id }
            - call: "POST /nitrogen-ops/turnarounds/${ta2_id}/submit"
              payload: {}
              as: ProcessEngineer
              as_user_id: "eng-author"
            - call: "POST /nitrogen-ops/turnarounds/${ta2_id}/psm-review"
              payload: { decision: "ENDORSED", findings_count: 0 }
              as: SafetyOfficer
              as_user_id: "so-reviewer"
            - call: "POST /nitrogen-ops/turnarounds"
              payload: { plant_id: "${plant_id}", train_id: "${train_id}", turnaround_code: "TA-3", scope: "VESSEL_INSPECTION", window_start: "2026-11-10T00:00:00Z", window_end: "2026-11-30T00:00:00Z" }
              as: ProcessEngineer
              as_user_id: "eng-author"
              captures: { ta3_id: $.data.id }
            - call: "POST /nitrogen-ops/turnaround-tasks"
              payload: { turnaround_id: "${ta3_id}", task_code: "TK-3A", duration_days: 5 }
              as: ProcessEngineer
              as_user_id: "eng-author"
              captures: { task_3a_id: $.data.id }
            - call: "POST /nitrogen-ops/turnarounds/${ta3_id}/submit"
              payload: {}
              as: ProcessEngineer
              as_user_id: "eng-author"
            - call: "POST /nitrogen-ops/turnarounds/${ta3_id}/psm-review"
              payload: { decision: "ENDORSED", findings_count: 0 }
              as: SafetyOfficer
              as_user_id: "so-reviewer"
          trigger:
            - call: "POST /nitrogen-ops/turnarounds/${ta2_id}/approve"
              payload: {}
              as: SafetyOfficer
              as_user_id: "so-approver"
            - call: "POST /nitrogen-ops/turnarounds/${ta3_id}/approve"
              payload: {}
              as: SafetyOfficer
              as_user_id: "so-approver"
          assert:
            - "the first trigger call returns HTTP status 409"
            - "the first trigger call returns data.error_id == ERR_TURNAROUND_BUFFER_CONFLICT"
            - "Turnaround.${ta2_id}.status == SUBMITTED"
            - "Turnaround.${ta2_id}.approved_by_user_id == null"
            - "the second trigger call returns HTTP status 200"
            - "Turnaround.${ta3_id}.status == APPROVED"
            - "Turnaround.${ta3_id}.approved_by_user_id == so-approver"
            - "Turnaround.${ta2_id}.window_days == 20"
            - "Turnaround.${ta3_id}.window_days == 20"
            - "Turnaround.${ta1_id}.status == APPROVED"

      - name: storage_outbound_bookings_overlap_only_within_available_tonnage
        grounds:
          - validations[priority=27]
          - errors[ERR_STORAGE_AVAILABILITY_EXCEEDED]
          - calculations.storage_position
          - state_machines.Shipment.DRAFT_to_BOOKED
          - concurrency_rules[shipment-book-stale-storage]
        distinguishing_aspect: |
          The constrained resource is a tonnage rather than a slot, and the check is an AGGREGATE over
          the peak instant of the half-open windows: two disjoint 6000-ton bookings out of a
          10000-ton tank both succeed (driving reserved_tons to 12000.000 and available_tons to
          -2000.000, which is legal), yet a third 5000-ton booking whose window overlaps only the
          first is rejected because that instant would carry 11000 tons.
        test_recipe:
          setup:
            - "One plant with a non-regulated UREA product line."
            - "Origin terminal UT-ORIG of capacity_tons 20000 with seasonal_reserve_pct 0.00 and an opening balance of 10000 tons; destination terminal UT-DEST of capacity_tons 20000."
            - "The logical clock stays at its startup default 2026-08-01, so seasonal_reserve_tons is 0.000 throughout."
            - "Three DRAFT outbound shipments: S1 6000 tons over 2026-08-05 -> 2026-08-10, S4 6000 tons over 2026-08-15 -> 2026-08-20 (disjoint from S1), S2 5000 tons over 2026-08-06 -> 2026-08-09 (inside S1's window)."
            - "The origin asset's version is re-read before each booking because each booking bumps it."
          setup_api_calls:
            - call: "POST /nitrogen-ops/plants"
              payload: { name: "Catoosa Terminal Works", site_code: "CTS-1", permit_limit_tons_30d: 12.00, spot_gas_index_usd_per_mmbtu: 4.20 }
              as: RegulatoryAdmin
              captures: { plant_id: $.data.id }
            - call: "POST /nitrogen-ops/product-lines"
              payload: { plant_id: "${plant_id}", product_code: "UREA", ammonia_tons_per_product_ton: 0.58, conversion_cost_usd_per_ton: 38.00, regulated: false, priority_rank: 1 }
              as: CommercialManager
              captures: { urea_line_id: $.data.id }
            - call: "POST /nitrogen-ops/storage-assets"
              payload: { plant_id: "${plant_id}", asset_code: "UT-ORIG", asset_kind: "TERMINAL", product_code: "UREA", capacity_tons: 20000, security_class: "BASIC", seasonal_reserve_pct: 0.00 }
              as: LogisticsCoordinator
              captures: { origin_id: $.data.id }
            - call: "POST /nitrogen-ops/storage-assets"
              payload: { plant_id: "${plant_id}", asset_code: "UT-DEST", asset_kind: "TERMINAL", product_code: "UREA", capacity_tons: 20000, security_class: "BASIC", seasonal_reserve_pct: 0.00 }
              as: LogisticsCoordinator
              captures: { dest_id: $.data.id }
            - call: "POST /nitrogen-ops/storage-assets/${origin_id}/opening-balance"
              payload: { opening_balance_tons: 10000 }
              as: LogisticsCoordinator
            - call: "POST /nitrogen-ops/shipments"
              payload: { origin_asset_id: "${origin_id}", dest_asset_id: "${dest_id}", shipment_code: "SH-1", mode: "RAIL", tons: 6000, distance_miles: 100, window_start: "2026-08-05T00:00:00Z", window_end: "2026-08-10T00:00:00Z" }
              as: LogisticsCoordinator
              captures: { s1_id: $.data.id }
            - call: "POST /nitrogen-ops/shipments"
              payload: { origin_asset_id: "${origin_id}", dest_asset_id: "${dest_id}", shipment_code: "SH-4", mode: "RAIL", tons: 6000, distance_miles: 100, window_start: "2026-08-15T00:00:00Z", window_end: "2026-08-20T00:00:00Z" }
              as: LogisticsCoordinator
              captures: { s4_id: $.data.id }
            - call: "POST /nitrogen-ops/shipments"
              payload: { origin_asset_id: "${origin_id}", dest_asset_id: "${dest_id}", shipment_code: "SH-2", mode: "RAIL", tons: 5000, distance_miles: 100, window_start: "2026-08-06T00:00:00Z", window_end: "2026-08-09T00:00:00Z" }
              as: LogisticsCoordinator
              captures: { s2_id: $.data.id }
            - call: "GET /nitrogen-ops/storage-assets/${origin_id}"
              payload: {}
              as: LogisticsCoordinator
              captures: { origin_ver_1: $.data.version }
            - call: "POST /nitrogen-ops/shipments/${s1_id}/book"
              payload: { expected_origin_asset_version: "${origin_ver_1}" }
              as: LogisticsCoordinator
            - call: "GET /nitrogen-ops/storage-assets/${origin_id}"
              payload: {}
              as: LogisticsCoordinator
              captures: { origin_ver_2: $.data.version }
          trigger:
            - call: "POST /nitrogen-ops/shipments/${s4_id}/book"
              payload: { expected_origin_asset_version: "${origin_ver_2}" }
              as: LogisticsCoordinator
            - call: "GET /nitrogen-ops/storage-assets/${origin_id}"
              payload: {}
              as: LogisticsCoordinator
              captures: { origin_ver_3: $.data.version }
            - call: "POST /nitrogen-ops/shipments/${s2_id}/book"
              payload: { expected_origin_asset_version: "${origin_ver_3}" }
              as: LogisticsCoordinator
          assert:
            - "the first trigger call returns HTTP status 200"
            - "Shipment.${s1_id}.status == BOOKED"
            - "Shipment.${s4_id}.status == BOOKED"
            - "StorageAsset.${origin_id}.on_hand_tons == 10000.000"
            - "StorageAsset.${origin_id}.reserved_tons == 12000.000"
            - "StorageAsset.${origin_id}.seasonal_reserve_tons == 0.000"
            - "StorageAsset.${origin_id}.available_tons == -2000.000"
            - "the third trigger call returns HTTP status 409"
            - "the third trigger call returns data.error_id == ERR_STORAGE_AVAILABILITY_EXCEEDED"
            - "Shipment.${s2_id}.status == DRAFT"
            - "Shipment.${s2_id}.base_freight_usd == null"

  # ===========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: ammonia_mass_conserved_across_reserve_and_release
        grounds:
          - state_machines.ProductionOrder.A_UNALLOCATED_to_A_RESERVED
          - state_machines.ProductionOrder.A_RESERVED_to_A_RELEASED
          - entities.ProductionRun.fields.unallocated_ammonia_tons
          - entities.ProductionOrder.fields.allocated_ammonia_tons
          - validations[priority=25]
          - concurrency_rules[order-reserve-stale-run]
        distinguishing_aspect: |
          The invariant `unallocated_ammonia_tons + sum(allocated_ammonia_tons of RESERVED and
          CONSUMED orders) == the pool basis` holds at every step: 5000.000 == 4420.000 + 580.000
          after the reservation and 5000.000 == 5000.000 + 0.000 after the release, so the release
          restores the pool exactly with no drift in the third decimal place.
        test_recipe:
          setup:
            - "One plant, one reformer train with a zero-hour catalyst charge, no hedge lots."
            - "One non-regulated UREA product line with ammonia_tons_per_product_ton 0.58."
            - "One UREA tank of capacity_tons 20000."
            - "ProductionRun PR-1 over 2026-09-01 -> 2026-09-11 with target_ammonia_tons 5000 is APPROVED, so unallocated_ammonia_tons is 5000.000 on the target basis."
            - "One UNALLOCATED production order PO-1 for 1000 tons."
          setup_api_calls:
            - call: "POST /nitrogen-ops/plants"
              payload: { name: "Donaldsonville South", site_code: "DVS-1", permit_limit_tons_30d: 12.00, spot_gas_index_usd_per_mmbtu: 4.20 }
              as: RegulatoryAdmin
              captures: { plant_id: $.data.id }
            - call: "POST /nitrogen-ops/reformer-trains"
              payload: { plant_id: "${plant_id}", train_code: "RT-1", rated_ammonia_tpd: 1200 }
              as: ProcessEngineer
              captures: { train_id: $.data.id }
            - call: "POST /nitrogen-ops/catalyst-charges"
              payload: { train_id: "${train_id}", charge_code: "CC-1", design_life_hours: 40000, baseline_operating_hours: 0, poisoning_index: 0.00 }
              as: ProcessEngineer
              captures: { charge_id: $.data.id }
            - call: "POST /nitrogen-ops/product-lines"
              payload: { plant_id: "${plant_id}", product_code: "UREA", ammonia_tons_per_product_ton: 0.58, conversion_cost_usd_per_ton: 38.00, regulated: false, priority_rank: 1 }
              as: CommercialManager
              captures: { urea_line_id: $.data.id }
            - call: "POST /nitrogen-ops/storage-assets"
              payload: { plant_id: "${plant_id}", asset_code: "UT-1", asset_kind: "TANK", product_code: "UREA", capacity_tons: 20000, security_class: "BASIC", seasonal_reserve_pct: 0.00 }
              as: LogisticsCoordinator
              captures: { tank_id: $.data.id }
            - call: "POST /nitrogen-ops/production-runs"
              payload: { train_id: "${train_id}", run_code: "PR-1", window_start: "2026-09-01T00:00:00Z", window_end: "2026-09-11T00:00:00Z", target_ammonia_tons: 5000 }
              as: ProcessEngineer
              as_user_id: "eng-author"
              captures: { run_id: $.data.id }
            - call: "POST /nitrogen-ops/production-runs/${run_id}/approve"
              payload: {}
              as: ProcessEngineer
              as_user_id: "eng-approver"
            - call: "POST /nitrogen-ops/production-orders"
              payload: { run_id: "${run_id}", product_line_id: "${urea_line_id}", destination_asset_id: "${tank_id}", order_code: "PO-1", requested_tons: 1000 }
              as: CommercialManager
              as_user_id: "cm-author"
              captures: { order_id: $.data.id }
            - call: "GET /nitrogen-ops/production-runs/${run_id}"
              payload: {}
              as: ProcessEngineer
              captures: { run_ver: $.data.version }
          trigger:
            - call: "POST /nitrogen-ops/production-orders/${order_id}/reserve"
              payload: { reserve_tons: 1000, expected_run_version: "${run_ver}" }
              as: CommercialManager
              as_user_id: "cm-author"
            - call: "GET /nitrogen-ops/production-runs/${run_id}"
              payload: {}
              as: ProcessEngineer
            - call: "POST /nitrogen-ops/production-orders/${order_id}/release"
              payload: { release_reason: "CUSTOMER_DEFERRED" }
              as: CommercialManager
              as_user_id: "cm-author"
          assert:
            - "the GET after the reserve returns data.unallocated_ammonia_tons == 4420.000"
            - "immediately after the reserve, ProductionOrder.${order_id}.allocated_ammonia_tons == 580.000 and ProductionOrder.${order_id}.reserved_tons == 1000.000"
            - "4420.000 + 580.000 == 5000.000, the run's target_ammonia_tons pool basis"
            - "ProductionOrder.${order_id}.allocation_status == RELEASED"
            - "ProductionOrder.${order_id}.release_reason == CUSTOMER_DEFERRED"
            - "ProductionOrder.${order_id}.reserved_tons == 0.000"
            - "ProductionOrder.${order_id}.allocated_ammonia_tons == 0.000"
            - "ProductionRun.${run_id}.unallocated_ammonia_tons == 5000.000"
            - "ProductionRun.${run_id}.status == APPROVED"
            - "ProductionOrder.${order_id}.produced_tons == null"

      - name: hedged_gas_volume_conserved_across_complete_and_reopen
        grounds:
          - state_machines.ProductionRun.COMPLETED_to_RUNNING
          - state_machines.GasHedgeLot.CLOSED_to_OPEN
          - calculations.run_ammonia_unit_cost
          - calculations.plant_hedged_blend
          - calculations.catalyst_activity_pct
          - entities.GasHedgeLot.fields.consumed_mmbtu
          - entities.GasHedgeLot.fields.remaining_mmbtu
        distinguishing_aspect: |
          A different conserved quantity in a different unit and across a compensating transition
          rather than a forward one: reopening the settled run restores every drawn lot exactly, so
          sum(remaining_mmbtu) 350000 + consumed_gas_mmbtu 0 == sum(mmbtu_volume) 350000, the two
          CLOSED lots return to OPEN, the blend returns to 2.7143 and the catalyst gets its 240 hours
          back — nothing is left stranded from the destructive FINAL waterfall.
        test_recipe:
          setup:
            - "The exact hedge-book chain of run_unit_cost_provisional_month_match_vs_final_chronological_waterfall, driven all the way through complete: HL-3 and HL-2 are CLOSED at zero remaining, HL-1 holds 185000, consumed_gas_mmbtu is 165000 and final_unit_cost_usd_per_ton is 117.80."
            - "No production order exists on the run, so the reopen precondition forbidding CONSUMED orders is satisfied."
          setup_api_calls:
            - call: "POST /nitrogen-ops/plants"
              payload: { name: "Verdigris Works", site_code: "VDG-1", permit_limit_tons_30d: 12.00, spot_gas_index_usd_per_mmbtu: 4.20 }
              as: RegulatoryAdmin
              captures: { plant_id: $.data.id }
            - call: "POST /nitrogen-ops/reformer-trains"
              payload: { plant_id: "${plant_id}", train_code: "RT-1", rated_ammonia_tpd: 1200 }
              as: ProcessEngineer
              captures: { train_id: $.data.id }
            - call: "POST /nitrogen-ops/catalyst-charges"
              payload: { train_id: "${train_id}", charge_code: "CC-1", design_life_hours: 40000, baseline_operating_hours: 0, poisoning_index: 0.00 }
              as: ProcessEngineer
              captures: { charge_id: $.data.id }
            - call: "POST /nitrogen-ops/gas-hedge-lots"
              payload: { plant_id: "${plant_id}", lot_code: "HL-1", mmbtu_volume: 200000, strike_price_usd_per_mmbtu: 3.10, delivery_month: "2026-09" }
              as: CommercialManager
              captures: { lot1_id: $.data.id }
            - call: "POST /nitrogen-ops/gas-hedge-lots"
              payload: { plant_id: "${plant_id}", lot_code: "HL-2", mmbtu_volume: 50000, strike_price_usd_per_mmbtu: 2.60, delivery_month: "2026-09" }
              as: CommercialManager
              captures: { lot2_id: $.data.id }
            - call: "POST /nitrogen-ops/gas-hedge-lots"
              payload: { plant_id: "${plant_id}", lot_code: "HL-3", mmbtu_volume: 100000, strike_price_usd_per_mmbtu: 2.00, delivery_month: "2026-08" }
              as: CommercialManager
              captures: { lot3_id: $.data.id }
            - call: "POST /nitrogen-ops/production-runs"
              payload: { train_id: "${train_id}", run_code: "PR-1", window_start: "2026-09-01T00:00:00Z", window_end: "2026-09-11T00:00:00Z", target_ammonia_tons: 5000 }
              as: ProcessEngineer
              as_user_id: "eng-author"
              captures: { run_id: $.data.id }
            - call: "POST /nitrogen-ops/production-runs/${run_id}/approve"
              payload: {}
              as: ProcessEngineer
              as_user_id: "eng-approver"
            - call: "POST /nitrogen-ops/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: RegulatoryAdmin
            - call: "POST /nitrogen-ops/production-runs/${run_id}/start"
              payload: {}
              as: ProcessEngineer
              as_user_id: "eng-author"
            - call: "POST /nitrogen-ops/production-runs/${run_id}/complete"
              payload: { actual_ammonia_tons: 5000, actual_operating_hours: 240 }
              as: ProcessEngineer
              as_user_id: "eng-author"
          trigger:
            - call: "POST /nitrogen-ops/production-runs/${run_id}/reopen"
              payload: { reopen_reason: "METER_RESTATEMENT" }
              as: ProcessEngineer
              as_user_id: "eng-author"
          assert:
            - "ProductionRun.${run_id}.status == RUNNING"
            - "ProductionRun.${run_id}.reopen_reason == METER_RESTATEMENT"
            - "ProductionRun.${run_id}.consumed_gas_mmbtu == 0"
            - "ProductionRun.${run_id}.final_unit_cost_usd_per_ton == null"
            - "ProductionRun.${run_id}.actual_ammonia_tons == null"
            - "ProductionRun.${run_id}.actual_operating_hours == null"
            - "GasHedgeLot.${lot1_id}.consumed_mmbtu == 0 and GasHedgeLot.${lot1_id}.remaining_mmbtu == 200000 and GasHedgeLot.${lot1_id}.status == OPEN"
            - "GasHedgeLot.${lot2_id}.consumed_mmbtu == 0 and GasHedgeLot.${lot2_id}.remaining_mmbtu == 50000 and GasHedgeLot.${lot2_id}.status == OPEN"
            - "GasHedgeLot.${lot3_id}.consumed_mmbtu == 0 and GasHedgeLot.${lot3_id}.remaining_mmbtu == 100000 and GasHedgeLot.${lot3_id}.status == OPEN"
            - "200000 + 50000 + 100000 == 350000 and ProductionRun.${run_id}.consumed_gas_mmbtu == 0, so the 350000 MMBtu contracted is fully accounted for"
            - "Plant.${plant_id}.hedged_blend_usd_per_mmbtu == 2.7143"
            - "CatalystCharge.${charge_id}.cumulative_operating_hours == 0"
            - "CatalystCharge.${charge_id}.activity_pct == 100.00"
            - "ReformerTrain.${train_id}.status == RUNNING"
            - "ProductionRun.${run_id}.unallocated_ammonia_tons == 5000.000"
