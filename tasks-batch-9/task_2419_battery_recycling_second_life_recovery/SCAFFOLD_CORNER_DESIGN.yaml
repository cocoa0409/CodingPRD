              captures: { listed_first: "$.data[0].id" }
          assert:
            - "Both POSTs return HTTP 201 and ${q1_id} != ${q2_id}"
            - "${q1_src} == LME (default applied) and ${q2_src} == SHFE (explicit input honored)"
            - "Neither response body nor the list rows expose a `version` or `updated_at` key - MetalIndexPrice declares common_fields: false"
            - "§1.5 declares no PATCH, PUT or DELETE route for /recycling/metal-index-prices/{id}: the quote series is append-only"
            - "GET /recycling/metal-index-prices?metal=NI reports total_count == 2 and ${listed_first} is one of ${q1_id} or ${q2_id}"

