              captures: { p_a_id: $.data.id }
            - call: "POST /participants"
              payload: { full_name: "P B", weight_kg: 70, birthdate: "2000-01-01T00:00:00Z" }
              as: Operator
              captures: { p_b_id: $.data.id }
            - call: "POST /participants"
              payload: { full_name: "P C", weight_kg: 70, birthdate: "2000-01-01T00:00:00Z" }
              as: Operator
              captures: { p_c_id: $.data.id }
            - call: "POST /bookings"
