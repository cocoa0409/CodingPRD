            - call: "POST /ad-policy/certifications"
              payload: { advertiser_id: "${adv_a}", policy_rule_id: "${alc_id}", license_number: "AGCO-NL-CA-01", issuing_country_code: "CA", valid_from: "2026-07-01T00:00:00Z", valid_until: "2026-12-31T00:00:00Z" }
