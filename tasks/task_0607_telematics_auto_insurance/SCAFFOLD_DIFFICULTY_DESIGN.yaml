  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      # ---- Instance 1: TripEvent.occurred_at within half-open trip interval ----
      - name: trip_event_occurred_at_half_open_interval
        grounds:
          - validations[priority=13]
          - entities.TripEvent.fields.occurred_at
          - entities.Trip.fields.ended_at
        distinguishing_aspect: |
          A TripEvent must fall within the HALF-OPEN interval [trip.started_at, trip.ended_at):
          an event whose occurred_at exactly equals ended_at is OUTSIDE (upper bound exclusive)
          and rejected with ERR_EVENT_OUTSIDE_TRIP. The interval semantics are point-in-window
          with an exclusive upper bound, on the Trip resource.
        test_recipe:
          setup:
            - "Clock 2026-06-01T00:00:00Z; OPEN enrollment trip T with started_at 2026-06-01T01:00:00Z, ended_at 2026-06-01T01:30:00Z"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: UnderwritingOps
            - call: "POST /rate-plans"
              payload: { name: "CA UBI", state_code: "CA", base_premium_cents: 200000, per_mile_rate_cents: 0.5, included_miles_per_period: 1000, hard_brake_weight: 2.0, speeding_weight: 1.5, phone_use_weight: 1.0 }
              as: UnderwritingOps
              captures: { rp_id: $.data.id }
            - call: "POST /drivers"
              payload: { email: "d15@x.com", full_name: "D Fifteen", state_code: "CA" }
              as: DriverUser
              captures: { d_id: $.data.id }
            - call: "POST /enrollments"
              payload: { driver_id: "${d_id}", rate_plan_id: "${rp_id}", scoring_days: 30 }
              as: DriverUser
              as_user_id: "${d_id}"
              captures: { e_id: $.data.id }
            - call: "POST /trips"
              payload: { enrollment_id: "${e_id}", started_at: "2026-06-01T01:00:00Z", ended_at: "2026-06-01T01:30:00Z", distance_miles: 10.0 }
              as: DriverUser
              as_user_id: "${d_id}"
              captures: { t_id: $.data.id }
          trigger:
            - call: "POST /trips/${t_id}/events"
              payload: { event_type: "HARD_BRAKE", severity: 2, occurred_at: "2026-06-01T01:30:00Z" }
              as: DriverUser
              as_user_id: "${d_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_EVENT_OUTSIDE_TRIP"
            - "http status == 422"

      # ---- Instance 2: PremiumStatement period window membership (half-open by started_at) ----
      - name: statement_period_window_membership_by_billed_period
        grounds:
          - calculations.mileage_premium
          - entities.PremiumStatement.fields.billed_miles
          - entities.Trip.fields.billed_period_index
        distinguishing_aspect: |
          A statement aggregates ACCEPTED trips whose billed_period_index == the statement's
          period_index; membership uses a DIFFERENT interval treatment than instance 1 — aggregate
          inclusion of trips into a discrete billing period (an index-equality window, not a
          single point-in-trip half-open check), on the PremiumStatement resource. A trip stamped
          with billed_period_index 0 at accept contributes to period 0's billed_miles only.
        test_recipe:
          setup:
            - "Clock 2026-06-01T00:00:00Z; policy P bound; ONE policy trip of 600 miles accepted in period 0"
          setup_api_calls:
