  # ---------------------------------------------------------------- Endpoints
  - section: endpoints
    instances:
      - name: criminal_records_pagination_and_filter
        claim_type: Listing
        grounds: [endpoints, response_envelope.pagination_fields]
        distinguishing_aspect: "GET /criminal-records?petitioner_id=&limit=2 over 3 records returns 2 rows with total_count==3 and has_more==true."
        test_recipe:
          setup: ["One petitioner with 3 criminal records."]
          setup_api_calls:
            - { call: "POST /expungement/petitioners", payload: { full_name: "Pag P", date_of_birth: "1990-01-01T00:00:00Z", annual_income_cents: 9000000, household_size: 1 }, as: Clerk, captures: { p: "$.data.id" } }
            - { call: "POST /expungement/criminal-records", payload: { petitioner_id: "${p}", offense_code: "PC-1", offense_class: "MISDEMEANOR", disposition: "CONVICTED", disposition_date: "2019-06-01T00:00:00Z", sentence_completion_date: "2020-01-01T00:00:00Z" }, as: Clerk }
            - { call: "POST /expungement/criminal-records", payload: { petitioner_id: "${p}", offense_code: "PC-2", offense_class: "INFRACTION", disposition: "ARREST_ONLY", disposition_date: "2020-01-01T00:00:00Z" }, as: Clerk }
            - { call: "POST /expungement/criminal-records", payload: { petitioner_id: "${p}", offense_code: "PC-3", offense_class: "MISDEMEANOR", disposition: "DISMISSED", disposition_date: "2020-01-01T00:00:00Z" }, as: Clerk }
          trigger:
            - { call: "GET /expungement/criminal-records", payload: { petitioner_id: "${p}", limit: 2, offset: 0 }, as: Clerk }
          assert:
            - "response returns exactly 2 CriminalRecord rows; total_count == 3; has_more == true"

      - name: petition_fee_due_zero_when_waiver_granted
        claim_type: Computed read
        grounds: [state_machines.FeeWaiver.REQUESTED_to_GRANTED, entities.Petition.fields.fee_waived, entities.Petition.fields.fee_due_cents]
        distinguishing_aspect: "Granting an INCOME_UNDER_125 waiver sets the petition's fee_waived==true and fee_due_cents==0."
        test_recipe:
          setup: ["Petitioner income 3,000,000 household 3 (waiver-eligible); petition with a REQUESTED eligible waiver."]
          setup_api_calls:
            - { call: "POST /expungement/petitioners", payload: { full_name: "Wav P", date_of_birth: "1990-01-01T00:00:00Z", annual_income_cents: 3000000, household_size: 3, monthly_liquid_assets_cents: 150000 }, as: Clerk, captures: { p: "$.data.id" } }
            - { call: "POST /expungement/criminal-records", payload: { petitioner_id: "${p}", offense_code: "PC-1", offense_class: "MISDEMEANOR", disposition: "CONVICTED", disposition_date: "2019-06-01T00:00:00Z", sentence_completion_date: "2020-01-01T00:00:00Z" }, as: Clerk, captures: { r: "$.data.id" } }
            - { call: "POST /expungement/petitions", payload: { petitioner_id: "${p}", jurisdiction_code: "CA-01", record_ids: ["${r}"] }, as: Clerk, captures: { pet: "$.data.id" } }
            - { call: "POST /expungement/fee-waivers", payload: { petitioner_id: "${p}", petition_id: "${pet}" }, as: Clerk, captures: { fw: "$.data.id" } }
          trigger:
            - { call: "POST /expungement/fee-waivers/${fw}/transition", payload: { to_status: "GRANTED" }, as: Clerk }
            - { call: "GET /expungement/petitions/${pet}", payload: {}, as: Clerk, captures: { fw_flag: "$.data.fee_waived", fd: "$.data.fee_due_cents" } }
          assert:
            - "Petition.${pet}.fee_waived == true"
            - "Petition.${pet}.fee_due_cents == 0"

  # ------------------------------------------------------------------- RBAC
  - section: rbac
    instances:
      - name: agency_cannot_screen_record
        claim_type: Role denial
        grounds: [roles.Agency, roles.Clerk]
        distinguishing_aspect: "An Agency calling POST /criminal-records/{id}/screen (a Clerk-only op) is rejected with ERR_UNAUTHORIZED."
        test_recipe:
          setup: ["A petitioner with one record."]
          setup_api_calls:
            - { call: "POST /expungement/petitioners", payload: { full_name: "Rb P", date_of_birth: "1990-01-01T00:00:00Z", annual_income_cents: 9000000, household_size: 1 }, as: Clerk, captures: { p: "$.data.id" } }
            - { call: "POST /expungement/criminal-records", payload: { petitioner_id: "${p}", offense_code: "PC-1", offense_class: "MISDEMEANOR", disposition: "CONVICTED", disposition_date: "2019-06-01T00:00:00Z", sentence_completion_date: "2020-01-01T00:00:00Z" }, as: Clerk, captures: { r: "$.data.id" } }
          trigger:
            - { call: "POST /expungement/criminal-records/${r}/screen", payload: {}, as: Agency, captures: { err: "$.data.error_id" } }
          assert:
            - "trigger response data.error_id == ERR_UNAUTHORIZED"

      - name: petitioner_cannot_enter_order
        claim_type: Role denial
        grounds: [roles.Petitioner, roles.Judge]
        distinguishing_aspect: "A Petitioner calling POST /hearings/{id}/order (a Judge-only op) is rejected with ERR_UNAUTHORIZED before any state work."
        test_recipe:
          setup: ["A hearing id placeholder (the auth check precedes existence)."]
          setup_api_calls: []
          trigger:
            - { call: "POST /expungement/hearings/00000000-0000-4000-8000-000000000009/order", payload: { disposition: "GRANTED" }, as: Petitioner, as_user_id: "00000000-0000-4000-8000-0000000000aa", captures: { err: "$.data.error_id" } }
          assert:
            - "trigger response data.error_id == ERR_UNAUTHORIZED"

      - name: petitioner_creates_record_for_other_owner_rejected
        claim_type: Ownership
        grounds: ["validations[priority=5]", "errors[ERR_NOT_RESOURCE_OWNER]"]
        distinguishing_aspect: "A Petitioner (X-User-ID = A) posting a criminal record with petitioner_id = B is rejected with ERR_NOT_RESOURCE_OWNER."
        test_recipe:
          setup: ["Petitioners A and B exist."]
          setup_api_calls:
            - { call: "POST /expungement/petitioners", payload: { full_name: "Own A", date_of_birth: "1990-01-01T00:00:00Z", annual_income_cents: 9000000, household_size: 1 }, as: Clerk, captures: { pa: "$.data.id" } }
            - { call: "POST /expungement/petitioners", payload: { full_name: "Own B", date_of_birth: "1990-01-01T00:00:00Z", annual_income_cents: 9000000, household_size: 1 }, as: Clerk, captures: { pb: "$.data.id" } }
          trigger:
            - { call: "POST /expungement/criminal-records", payload: { petitioner_id: "${pb}", offense_code: "PC-1", offense_class: "MISDEMEANOR", disposition: "CONVICTED", disposition_date: "2019-06-01T00:00:00Z", sentence_completion_date: "2020-01-01T00:00:00Z" }, as: Petitioner, as_user_id: "${pa}", captures: { err: "$.data.error_id" } }
          assert:
            - "trigger response data.error_id == ERR_NOT_RESOURCE_OWNER"

      - name: missing_role_header_returns_unauthenticated
        claim_type: Role denial
        grounds: ["validations[priority=1]", "errors[ERR_UNAUTHENTICATED]"]
        distinguishing_aspect: "A request omitting the X-User-Role/X-User-ID headers is rejected with ERR_UNAUTHENTICATED (401)."
        test_recipe:
          setup: ["Empty DB; the trigger is sent WITHOUT authentication headers."]
          setup_api_calls: []
          trigger:
            - { call: "POST /expungement/petitioners", payload: { full_name: "NoAuth", date_of_birth: "1990-01-01T00:00:00Z", annual_income_cents: 8000000, household_size: 1 }, as: Clerk, captures: { err: "$.data.error_id" } }
          assert:
            - "with no X-User-Role/X-User-ID headers, trigger response data.error_id == ERR_UNAUTHENTICATED"

  # --------------------------------------------------- Cross-cutting layers
  - section: cross_cutting_complexity_layers
    instances:
      - name: occ_stale_petition_version_on_reschedule
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[hearing-create-stale-petition]", "errors[ERR_STALE_VERSION]"]
        distinguishing_aspect: "Reschedule A with expected_petition_version v0 succeeds (version -> v0+1); a second reschedule still carrying v0 is rejected with ERR_STALE_VERSION (412)."
        test_recipe:
          setup: ["Fully cleared FILED petition (CA-01), matching courtroom+judge; petition version captured as v0."]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: Clerk }
            - { call: "POST /expungement/courtrooms", payload: { name: "Room O", jurisdiction_code: "CA-01" }, as: Clerk, captures: { cr: "$.data.id" } }
            - { call: "POST /expungement/judges", payload: { name: "Judge O", jurisdiction_code: "CA-01" }, as: Clerk, captures: { jg: "$.data.id" } }
            - { call: "POST /expungement/petitioners", payload: { full_name: "Occ P", date_of_birth: "1990-01-01T00:00:00Z", annual_income_cents: 9000000, household_size: 1 }, as: Clerk, captures: { p: "$.data.id" } }
            - { call: "POST /expungement/criminal-records", payload: { petitioner_id: "${p}", offense_code: "PC-1", offense_class: "MISDEMEANOR", disposition: "CONVICTED", disposition_date: "2019-06-01T00:00:00Z", sentence_completion_date: "2020-01-01T00:00:00Z" }, as: Clerk, captures: { r: "$.data.id" } }
            - { call: "POST /expungement/criminal-records/${r}/screen", payload: {}, as: Clerk }
            - { call: "POST /expungement/petitions", payload: { petitioner_id: "${p}", jurisdiction_code: "CA-01", record_ids: ["${r}"] }, as: Clerk, captures: { pet: "$.data.id" } }
            - { call: "POST /expungement/petitions/${pet}/transition", payload: { to_status: "SCREENED" }, as: Clerk }
            - { call: "POST /expungement/petitions/${pet}/pay-fee", payload: { amount_cents: 12900 }, as: Clerk }
            - { call: "POST /expungement/petitions/${pet}/transition", payload: { to_status: "FILED" }, as: Clerk }
            - { call: "GET /expungement/agency-notifications", payload: { petition_id: "${pet}" }, as: Clerk, captures: { n0: "$.data[0].id", n1: "$.data[1].id", n2: "$.data[2].id" } }
            - { call: "POST /expungement/agency-notifications/${n0}/transition", payload: { to_status: "SERVED" }, as: Clerk }
            - { call: "POST /expungement/agency-notifications/${n1}/transition", payload: { to_status: "SERVED" }, as: Clerk }
            - { call: "POST /expungement/agency-notifications/${n2}/transition", payload: { to_status: "SERVED" }, as: Clerk }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-06-01T00:00:00Z" }, as: Clerk }
            - { call: "POST /expungement/agency-notifications/${n0}/transition", payload: { to_status: "CLEARED" }, as: Clerk }
            - { call: "POST /expungement/agency-notifications/${n1}/transition", payload: { to_status: "CLEARED" }, as: Clerk }
            - { call: "POST /expungement/agency-notifications/${n2}/transition", payload: { to_status: "CLEARED" }, as: Clerk }
            - { call: "GET /expungement/petitions/${pet}", payload: {}, as: Clerk, captures: { v0: "$.data.version" } }
            - { call: "POST /expungement/petitions/${pet}/hearings", payload: { courtroom_id: "${cr}", judge_id: "${jg}", scheduled_start: "2026-06-02T09:00:00Z", scheduled_end: "2026-06-02T10:00:00Z", expected_petition_version: "${v0}" }, as: Clerk }
          trigger:
            - { call: "POST /expungement/petitions/${pet}/hearings", payload: { courtroom_id: "${cr}", judge_id: "${jg}", scheduled_start: "2026-06-03T09:00:00Z", scheduled_end: "2026-06-03T10:00:00Z", expected_petition_version: "${v0}" }, as: Clerk, captures: { err: "$.data.error_id" } }
          assert:
            - "trigger response data.error_id == ERR_STALE_VERSION (v0 is now stale; version already advanced to v0+1)"

      - name: background_vendor_ack_increments_counter
        claim_type: derived_field_reconciliation
