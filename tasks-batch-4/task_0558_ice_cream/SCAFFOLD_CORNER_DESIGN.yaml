              payload: {}
              as: Baker
              captures: { err: $.data.error_id }
          assert: ["response.data.error_id == ERR_WASTE_EVENT_NOT_FOUND"]

      - name: size_option_not_found_on_line_add
        claim_type: Not Found
        grounds: ["errors[ERR_SIZE_OPTION_NOT_FOUND]"]
        distinguishing_aspect: "Adding a line with unknown size_option_id -> 404 ERR_SIZE_OPTION_NOT_FOUND."
        test_recipe:
          setup: ["Vanilla flavor; batch AVAILABLE; OPEN drawer + order"]
          setup_api_calls:
            - call: "POST /flavors"
              payload: { name: "Vanilla", standard_cost_cents_per_ml: 1.80, par_level_ml: 300 }
              as: Manager
              captures: { van: $.data.id }
            - call: "POST /batches"
              payload: { flavor_id: "${van}", initial_volume_ml: 500, unit_cost_cents_per_ml: 1.80, produced_at: "2026-05-01T00:00:00Z", expiry_at: "2026-05-20T00:00:00Z" }
              as: Baker
              captures: { b: $.data.id }
            - call: "POST /batches/${b}/release"
              payload: {}
              as: Baker
            - call: "POST /cash-drawer-sessions"
              payload: { opening_float_cents: 10000 }
              as: ShiftLead
              captures: { dr: $.data.id }
            - call: "POST /orders"
              payload: { drawer_id: "${dr}" }
              as: Scooper
              captures: { ord: $.data.id }
          trigger:
            - call: "POST /orders/${ord}/lines"
              payload: { size_option_id: "00000000-0000-4000-8000-000000000000", flavor_id: "${van}" }
              as: Scooper
              captures: { err: $.data.error_id }
          assert: ["response.data.error_id == ERR_SIZE_OPTION_NOT_FOUND"]

      - name: topping_not_found_on_line_add
        claim_type: Not Found
        grounds: ["errors[ERR_TOPPING_NOT_FOUND]"]
        distinguishing_aspect: "Adding a line whose topping_ids includes an unknown id -> 404 ERR_TOPPING_NOT_FOUND."
        test_recipe:
          setup: ["Vanilla flavor; SINGLE size; batch AVAILABLE; OPEN drawer + order"]
          setup_api_calls:
            - call: "POST /flavors"
              payload: { name: "Vanilla", standard_cost_cents_per_ml: 1.80, par_level_ml: 300 }
              as: Manager
              captures: { van: $.data.id }
            - call: "POST /size-options"
              payload: { code: "SINGLE", scoop_count: 1, base_price_cents: 350 }
              as: Manager
              captures: { sng: $.data.id }
            - call: "POST /batches"
              payload: { flavor_id: "${van}", initial_volume_ml: 500, unit_cost_cents_per_ml: 1.80, produced_at: "2026-05-01T00:00:00Z", expiry_at: "2026-05-20T00:00:00Z" }
              as: Baker
              captures: { b: $.data.id }
            - call: "POST /batches/${b}/release"
              payload: {}
              as: Baker
            - call: "POST /cash-drawer-sessions"
              payload: { opening_float_cents: 10000 }
              as: ShiftLead
              captures: { dr: $.data.id }
            - call: "POST /orders"
              payload: { drawer_id: "${dr}" }
              as: Scooper
              captures: { ord: $.data.id }
          trigger:
            - call: "POST /orders/${ord}/lines"
              payload: { size_option_id: "${sng}", flavor_id: "${van}", topping_ids: ["00000000-0000-4000-8000-000000000000"] }
              as: Scooper
              captures: { err: $.data.error_id }
          assert: ["response.data.error_id == ERR_TOPPING_NOT_FOUND"]

      - name: loyalty_account_not_found_on_order_open
        claim_type: Not Found
        grounds: ["errors[ERR_LOYALTY_ACCOUNT_NOT_FOUND]"]
        distinguishing_aspect: "Opening an order with unknown loyalty_account_id -> 404 ERR_LOYALTY_ACCOUNT_NOT_FOUND."
        test_recipe:
          setup: ["OPEN drawer"]
          setup_api_calls:
            - call: "POST /cash-drawer-sessions"
              payload: { opening_float_cents: 10000 }
              as: ShiftLead
              captures: { dr: $.data.id }
          trigger:
            - call: "POST /orders"
              payload: { drawer_id: "${dr}", loyalty_account_id: "00000000-0000-4000-8000-000000000000" }
              as: Scooper
              captures: { err: $.data.error_id }
          assert: ["response.data.error_id == ERR_LOYALTY_ACCOUNT_NOT_FOUND"]

      - name: order_line_not_found_on_delete
        claim_type: Not Found
        grounds: ["errors[ERR_ORDER_LINE_NOT_FOUND]"]
        distinguishing_aspect: "DELETE /orders/{id}/lines/{unknown} -> 404 ERR_ORDER_LINE_NOT_FOUND."
        test_recipe:
          setup: ["OPEN drawer + OPEN order (no lines)"]
          setup_api_calls:
            - call: "POST /cash-drawer-sessions"
              payload: { opening_float_cents: 10000 }
              as: ShiftLead
              captures: { dr: $.data.id }
            - call: "POST /orders"
              payload: { drawer_id: "${dr}" }
              as: Scooper
              captures: { ord: $.data.id }
          trigger:
            - call: "DELETE /orders/${ord}/lines/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: Scooper
              captures: { err: $.data.error_id }
          assert: ["response.data.error_id == ERR_ORDER_LINE_NOT_FOUND"]

      - name: event_cart_not_found_on_booking
        claim_type: Not Found
        grounds: ["errors[ERR_EVENT_CART_NOT_FOUND]"]
        distinguishing_aspect: "POST /catering-bookings with unknown event_cart_id -> 404 ERR_EVENT_CART_NOT_FOUND."
        test_recipe:
          setup: ["Vanilla flavor + batch AVAILABLE"]
          setup_api_calls:
            - call: "POST /flavors"
              payload: { name: "Vanilla", standard_cost_cents_per_ml: 1.80, par_level_ml: 300 }
              as: Manager
              captures: { van: $.data.id }
            - call: "POST /batches"
              payload: { flavor_id: "${van}", initial_volume_ml: 500, unit_cost_cents_per_ml: 1.80, produced_at: "2026-05-01T00:00:00Z", expiry_at: "2026-05-30T00:00:00Z" }
              as: Baker
              captures: { b: $.data.id }
            - call: "POST /batches/${b}/release"
              payload: {}
              as: Baker
          trigger:
            - call: "POST /catering-bookings"
              payload: { event_cart_id: "00000000-0000-4000-8000-000000000000", event_start_utc: "2026-05-02T10:00:00Z", event_end_utc: "2026-05-02T12:00:00Z", requested_items: [{ flavor_id: "${van}", volume_ml: 100 }] }
              as: Manager
              captures: { err: $.data.error_id }
          assert: ["response.data.error_id == ERR_EVENT_CART_NOT_FOUND"]

      - name: decorating_station_not_found_on_preorder
        claim_type: Not Found
        grounds: ["errors[ERR_DECORATING_STATION_NOT_FOUND]"]
        distinguishing_aspect: "POST /pre-orders with unknown decorating_station_id -> 404 ERR_DECORATING_STATION_NOT_FOUND."
        test_recipe:
          setup: ["Vanilla flavor"]
          setup_api_calls:
