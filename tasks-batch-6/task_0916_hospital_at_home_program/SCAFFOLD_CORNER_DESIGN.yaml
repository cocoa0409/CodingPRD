  - section: calculations
    instances:

      - name: monitoring_lapses_that_touch_or_overlap_merge_into_one_interval
        claim_type: correct_result
        grounds:
          - calculations.monitoring_lapse_daily_minutes
          - entities.DailyComplianceRecord.fields.monitoring_lapse_minutes
        distinguishing_aspect: "Three lapses 09:00-09:30, 09:30-10:00 (zero-gap adjacency) and 09:45-10:15 (overlap) merge into the single interval 09:00-10:15, so monitoring_lapse_minutes is 75, not the naive sum of 105."
        test_recipe:
          setup:
            - "One ACTIVE CMS_WAIVER episode admitted 2026-06-01T08:00:00Z with the 2026-06-01 compliance record still PENDING."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T08:00:00Z" }
              as: ProgramAdmin
            - call: "POST /patients"
              payload: { mrn: "MRN-MG", full_name: "Mel Merge", home_distance_km: 5.0, primary_diagnosis_code: "CHF_EXAC", diet_restriction: "NONE", broadband_verified: true, caregiver_present: true }
              as: AdmittingPhysician
              captures: { pat_mg: $.data.id }
            - call: "POST /referrals"
              payload: { patient_id: "${pat_mg}", origin: "ED", qualifying_condition_code: "CHF_EXAC", acuity: "STANDARD", referring_physician_user_id: "phys-1" }
              as: AdmittingPhysician
              captures: { ref_mg: $.data.id }
            - call: "POST /eligibility-assessments"
              payload: { referral_id: "${ref_mg}", in_person_eval_at: "2026-06-01T06:00:00Z", home_safety_outcome: "PASS", broadband_check: "PASS", caregiver_present_confirmed: true, consent_signed: true, assessor_user_id: "phys-1" }
              as: AdmittingPhysician
            - call: "POST /referrals/${ref_mg}/mark-eligible"
              payload: {}
              as: AdmittingPhysician
            - call: "POST /episodes"
              payload: { patient_id: "${pat_mg}", referral_id: "${ref_mg}", program_track: "CMS_WAIVER" }
              as: AdmittingPhysician
              captures: { ep_mg: $.data.id }
          trigger:
            - call: "POST /monitoring-lapses"
              payload: { episode_id: "${ep_mg}", gap_start_at: "2026-06-01T09:00:00Z", gap_end_at: "2026-06-01T09:30:00Z", cause: "DEVICE_OFFLINE" }
              as: FieldNurse
            - call: "POST /monitoring-lapses"
              payload: { episode_id: "${ep_mg}", gap_start_at: "2026-06-01T09:30:00Z", gap_end_at: "2026-06-01T10:00:00Z", cause: "CONNECTIVITY_LOSS" }
