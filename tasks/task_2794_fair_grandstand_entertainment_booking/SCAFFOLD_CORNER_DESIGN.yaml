            - "After only the HOSPITALITY line is ruled DENIED, complete still returns HTTP 409 with ${err_h3} == ERR_ADVANCE_HAS_OPEN_ITEMS: the seed STAGING line is not exempt from the open-items rule."
            - "Once STAGING is APPROVED the third complete returns HTTP 200 with advance_status 'ADVANCE_COMPLETE' and approved_rider_cost_cents == 0 -- the DENIED 250000 line contributes nothing."
            - "The announce that follows returns HTTP 422 with ${err_h4} == ERR_NO_TICKET_SCALES: with priority 31 satisfied the empty price structure is now the binding objection."
