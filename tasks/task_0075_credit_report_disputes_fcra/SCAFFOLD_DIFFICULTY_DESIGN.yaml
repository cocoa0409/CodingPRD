              payload: { credit_file_id: "${file17}", tradeline_id: "${tl17}", dispute_reason: "NOT_MINE", clock_mode: "CALENDAR", expected_credit_file_version: "${file17_v}" }
              as: Consumer
              as_user_id: "${c17}"
              captures: { d17: $.data.id }
            - call: "POST /disputes/${d17}/open-investigation"
              payload: {}
              as: CreditBureau
            - call: "POST /reverification-requests"
              payload: { dispute_id: "${d17}", furnisher_id: "${f17}" }
              as: CreditBureau
              captures: { rv17: $.data.id }
            - call: "GET /furnishers/${f17}"
              payload: {}
              as: CreditBureau
              captures: { f17_orc_before: $.data.open_reverification_count }
          trigger:
            - call: "POST /disputes/${d17}/reopen"
              payload: {}
              as: Consumer
              as_user_id: "${c17}"
            - call: "GET /furnishers/${f17}"
              payload: {}
              as: CreditBureau
              captures: { f17_orc_after: $.data.open_reverification_count }
          assert:
            - "Before reopen: Furnisher.${f17}.open_reverification_count == 1"
            - "After reopen: Furnisher.${f17}.open_reverification_count == 0"
            - "ReverificationRequest.${rv17}.status == 'CANCELLED'"

      - name: auto_delete_conserves_file_counts
        grounds:
          - state_machines.Dispute.REVERIFYING_to_AUTO_DELETED
          - calculations.open_counts_recompute
          - entities.CreditFile.fields.tradeline_count
          - entities.CreditFile.fields.open_dispute_count
        distinguishing_aspect: |
          Conserved quantity = CreditFile.tradeline_count and open_dispute_count
          consistency. Forward: filing a dispute drives tradeline REPORTING->DISPUTED
          (open_dispute_count +1). Compensating: deadline breach AUTO_DELETEs the
          dispute AND DELETEs the tradeline, so afterwards tradeline_count ==
          count(non-terminal tradelines) and open_dispute_count ==
          count(non-terminal disputes) with no drift; both land at 0. Different
          conserved quantity (file counts) than the furnisher count above.
        test_recipe:
          setup:
            - "A dispute at REVERIFYING (open_dispute_count==1, tradeline_count==1); clock then advanced past deadline."
          setup_api_calls:
            - call: "POST /consumers"
              payload: { email: "c18@x.com", full_name: "C Eighteen", ssn_last4: "0018" }
              as: Anonymous
              captures: { c18: $.data.id }
            - call: "POST /furnishers"
              payload: { name: "Bank M", furnisher_type: "BANK" }
              as: Anonymous
              captures: { f18: $.data.id }
            - call: "POST /credit-files"
              payload: { consumer_id: "${c18}", bureau_code: "EQUIFAX" }
              as: CreditBureau
              captures: { file18: $.data.id, file18_v: $.data.version }
            - call: "POST /_clock/set"
              payload: { to_iso8601: "2026-01-05T00:00:00.000Z" }
              as: CreditBureau
            - call: "POST /tradelines"
              payload: { credit_file_id: "${file18}", furnisher_id: "${f18}", account_type: "REVOLVING", balance_cents: 50000, date_of_first_delinquency: "2021-01-01T00:00:00.000Z", reported_delinquency_date: "2021-01-01T00:00:00.000Z" }
              as: Furnisher
              as_user_id: "${f18}"
              captures: { tl18: $.data.id }
            - call: "POST /disputes"
              payload: { credit_file_id: "${file18}", tradeline_id: "${tl18}", dispute_reason: "NOT_MINE", clock_mode: "CALENDAR", expected_credit_file_version: "${file18_v}" }
              as: Consumer
              as_user_id: "${c18}"
              captures: { d18: $.data.id }
            - call: "POST /disputes/${d18}/open-investigation"
              payload: {}
              as: CreditBureau
            - call: "POST /reverification-requests"
              payload: { dispute_id: "${d18}", furnisher_id: "${f18}" }
              as: CreditBureau
              captures: { rv18: $.data.id }
            - call: "GET /credit-files/${file18}"
              payload: {}
              as: CreditBureau
              captures: { file18_tlc_before: $.data.tradeline_count, file18_odc_before: $.data.open_dispute_count }
          trigger:
            - call: "POST /_clock/advance"
              payload: { to_iso8601: "2026-02-05T00:00:00.000Z" }
              as: CreditBureau
            - call: "GET /credit-files/${file18}"
              payload: {}
              as: CreditBureau
              captures: { file18_tlc_after: $.data.tradeline_count, file18_odc_after: $.data.open_dispute_count }
            - call: "GET /disputes/${d18}"
              payload: {}
              as: CreditBureau
              captures: { d18_status: $.data.status }
            - call: "GET /tradelines/${tl18}"
              payload: {}
              as: CreditBureau
              captures: { tl18_status: $.data.status }
          assert:
            - "Before: CreditFile.${file18}.tradeline_count == 1 and open_dispute_count == 1"
            - "After advance: Dispute.${d18}.status == 'AUTO_DELETED' and Tradeline.${tl18}.status == 'DELETED'"
            - "After advance: CreditFile.${file18}.tradeline_count == 0 and open_dispute_count == 0"
            - "ReverificationRequest.${rv18}.status == 'EXPIRED'"
