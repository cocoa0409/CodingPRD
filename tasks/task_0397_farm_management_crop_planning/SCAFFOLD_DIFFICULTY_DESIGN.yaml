# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# Nine §0.5 rules x >= 2 instances each (>= 18 instances total).
# Every grounds[] ref resolves into SCAFFOLD.yaml §1.1–§1.6.
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: cost_per_acre_provisional_vs_final_diverge
        grounds:
          - calculations.cost_per_acre
          - entities.CropPlan.fields.provisional_cost_per_acre
          - entities.CropPlan.fields.final_cost_per_acre
          - state_machines.CropPlan.HARVESTING_to_CLOSED
        distinguishing_aspect: |
          On entity domain CropPlan, the provisional variant (budgets / planned_acres = 9000/100 = 90.00)
          and the final variant (actuals / harvested_acres = 2000/50 = 40.00) produce DIFFERENT numbers
          from the same plan — distinct from the yield calc which lives on a different metric.
        test_recipe:
          setup:
            - "Parcel 100 acres AVAILABLE; CropPlan budgets input=4000 labor=3000 equipment=2000 planned_acres=100."
            - "Plan driven to GROWING (one planting), one CHEMICAL application confirmed (cost 1000), labor 600, equipment usage 400, then harvested 50 acres and CLOSED."
          setup_api_calls:
            - call: "POST /_clock/set"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: FarmManager
            - call: "POST /parcels"
              payload: { name: "North 100", acreage: 100, soil_type: "LOAM" }
              as: FarmManager
              captures: { parcel_id: $.data.id, parcel_v0: $.data.version }
            - call: "POST /input-products"
              payload: { name: "Hybrid Corn Seed", category: "SEED", unit: "SEED_UNIT", unit_cost: 1.00 }
              as: FarmManager
              captures: { seed_prod_id: $.data.id }
            - call: "POST /input-lots"
              payload: { input_product_id: "${seed_prod_id}", lot_code: "SEEDLOT1", quantity_received: 1000 }
              as: FarmManager
              captures: { seed_lot_id: $.data.id }
            - call: "POST /input-products"
              payload: { name: "Atrazine RU", category: "CHEMICAL", unit: "GAL", unit_cost: 12.50, restricted_use: true, reentry_interval_hours: 48, preharvest_interval_days: 7 }
              as: FarmManager
              captures: { chem_prod_id: $.data.id }
            - call: "POST /applicators"
              payload: { full_name: "Pat Applicator", license_no: "RU-1", certified: true }
              as: FarmManager
              captures: { appl_id: $.data.id }
            - call: "POST /crop-plans"
              payload: { parcel_id: "${parcel_id}", crop: "CORN", season_year: 2026, planned_acres: 100, budget_input_cost: 4000, budget_labor_cost: 3000, budget_equipment_cost: 2000 }
              as: Agronomist
              captures: { plan_id: $.data.id }
            - call: "POST /crop-plans/${plan_id}/approve"
              payload: { expected_parcel_version: "${parcel_v0}" }
              as: FarmManager
            - call: "POST /planting-events"
              payload: { crop_plan_id: "${plan_id}", input_lot_id: "${seed_lot_id}", acres_planted: 100, seed_rate_per_acre: 2 }
              as: Agronomist
            - call: "POST /crop-plans/${plan_id}/begin-growing"
              payload: {}
              as: Agronomist
            - call: "POST /application-records"
              payload: { crop_plan_id: "${plan_id}", input_product_id: "${chem_prod_id}", applicator_user_id: "${appl_id}", rate_per_acre: 2, acres_treated: 40 }
              as: Agronomist
              captures: { app_id: $.data.id }
            - call: "POST /application-records/${app_id}/confirm"
              payload: {}
              as: Applicator
              as_user_id: "${appl_id}"
            - call: "POST /labor-entries"
              payload: { crop_plan_id: "${plan_id}", worker_name: "W1", hours: 30, hourly_rate: 20 }
              as: Agronomist
            - call: "POST /equipment-assets"
              payload: { name: "Combine 1", kind: "COMBINE", hourly_cost: 80 }
              as: FarmManager
              captures: { equip_id: $.data.id }
            - call: "POST /equipment-usages"
              payload: { equipment_asset_id: "${equip_id}", crop_plan_id: "${plan_id}", window_start: "2026-06-18T08:00:00Z", window_end: "2026-06-18T13:00:00Z" }
              as: Agronomist
            - call: "POST /_clock/set"
              payload: { to_iso8601: "2026-06-20T00:00:00Z" }
              as: FarmManager
            - call: "POST /crop-plans/${plan_id}/begin-harvest"
              payload: {}
              as: Agronomist
            - call: "POST /harvest-events"
              payload: { crop_plan_id: "${plan_id}", acres_harvested: 50, gross_quantity: 1000, moisture_pct: 0 }
              as: Agronomist
          trigger:
            - call: "POST /crop-plans/${plan_id}/close"
              payload: {}
              as: FarmManager
              captures: { prov: $.data.provisional_cost_per_acre, fin: $.data.final_cost_per_acre }
          assert:
            - "CropPlan.${plan_id}.provisional_cost_per_acre == 90.00"
            - "CropPlan.${plan_id}.final_cost_per_acre == 40.00"
            - "CropPlan.${plan_id}.provisional_cost_per_acre != CropPlan.${plan_id}.final_cost_per_acre"

      - name: yield_graded_vs_gross_basis_diverge
        grounds:
          - calculations.yield_aggregation
          - entities.CropPlan.fields.total_yield_units
          - entities.HarvestLot.fields.quality_status
        distinguishing_aspect: |
          On entity domain HarvestLot/CropPlan (a DIFFERENT subject than cost_per_acre), the persisted
          graded-only total (500.5 + 300.25 = 800.75) differs from the gross basis that would also count
          the UNGRADED 100 lot (900.75) — divergence driven by quality-status filtering, not by budgets/actuals.
        test_recipe:
          setup:
            - "A CLOSED-ready plan with 3 lots: GRADE_A qty 500.5, GRADE_B qty 300.25, UNGRADED qty 100."
          setup_api_calls:
            - call: "POST /_clock/set"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: FarmManager
            - call: "POST /parcels"
              payload: { name: "Yield Field", acreage: 80, soil_type: "SILT" }
              as: FarmManager
              captures: { pid: $.data.id, pv: $.data.version }
            - call: "POST /input-products"
              payload: { name: "Soy Seed", category: "SEED", unit: "SEED_UNIT", unit_cost: 0.50 }
              as: FarmManager
              captures: { sprod: $.data.id }
            - call: "POST /input-lots"
              payload: { input_product_id: "${sprod}", lot_code: "SL1", quantity_received: 500 }
              as: FarmManager
              captures: { slot: $.data.id }
            - call: "POST /crop-plans"
              payload: { parcel_id: "${pid}", crop: "SOY", season_year: 2026, planned_acres: 60, budget_input_cost: 100, budget_labor_cost: 100, budget_equipment_cost: 100 }
              as: Agronomist
              captures: { pl: $.data.id }
            - call: "POST /crop-plans/${pl}/approve"
              payload: { expected_parcel_version: "${pv}" }
              as: FarmManager
            - call: "POST /planting-events"
              payload: { crop_plan_id: "${pl}", input_lot_id: "${slot}", acres_planted: 60, seed_rate_per_acre: 2 }
              as: Agronomist
            - call: "POST /crop-plans/${pl}/begin-growing"
              payload: {}
              as: Agronomist
            - call: "POST /crop-plans/${pl}/begin-harvest"
              payload: {}
              as: Agronomist
            - call: "POST /harvest-events"
              payload: { crop_plan_id: "${pl}", acres_harvested: 60, gross_quantity: 1000, moisture_pct: 0 }
              as: Agronomist
              captures: { he: $.data.id }
            - call: "POST /harvest-lots"
              payload: { harvest_event_id: "${he}", quantity: 500.5 }
              as: Agronomist
              captures: { lotA: $.data.id }
            - call: "POST /harvest-lots/${lotA}/grade"
              payload: { grade: "GRADE_A" }
              as: Agronomist
            - call: "POST /harvest-lots"
              payload: { harvest_event_id: "${he}", quantity: 300.25 }
              as: Agronomist
              captures: { lotB: $.data.id }
            - call: "POST /harvest-lots/${lotB}/grade"
              payload: { grade: "GRADE_B" }
              as: Agronomist
            - call: "POST /harvest-lots"
              payload: { harvest_event_id: "${he}", quantity: 100 }
              as: Agronomist
              captures: { lotU: $.data.id }
          trigger:
            - call: "POST /crop-plans/${pl}/close"
              payload: {}
              as: FarmManager
              captures: { ty: $.data.total_yield_units }
          assert:
            - "CropPlan.${pl}.total_yield_units == 800.75"
            - "HarvestLot.${lotU}.quality_status == UNGRADED"

  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: final_cost_per_acre_three_input_overhead_allocation
        grounds:
          - calculations.cost_per_acre
          - entities.CropPlan.fields.final_cost_per_acre
          - entities.CropPlan.fields.actual_equipment_cost
        distinguishing_aspect: |
          MODE (a): final_cost_per_acre combines >= 3 inputs (actual_input + actual_labor + allocated equipment overhead)
          over harvested_acres with a conditional allocation factor f — a non-linear interaction, not a flat sum.
        test_recipe:
          setup:
            - "One CLOSED plan: actual_input 1000, actual_labor 600, actual_equipment 400, harvested 50 acres, single plan on parcel for 2026 so f=1 -> (1000+600+400)/50 = 40.00."
          setup_api_calls:
            - call: "POST /_clock/set"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: FarmManager
            - call: "POST /parcels"
              payload: { name: "Combo Field", acreage: 100, soil_type: "LOAM" }
              as: FarmManager
              captures: { pid: $.data.id, pv: $.data.version }
            - call: "POST /input-products"
              payload: { name: "Wheat Seed", category: "SEED", unit: "SEED_UNIT", unit_cost: 0.40 }
              as: FarmManager
              captures: { sprod: $.data.id }
            - call: "POST /input-lots"
              payload: { input_product_id: "${sprod}", lot_code: "WL1", quantity_received: 1000 }
              as: FarmManager
              captures: { slot: $.data.id }
            - call: "POST /input-products"
              payload: { name: "Liquid N", category: "FERTILIZER", unit: "GAL", unit_cost: 12.50 }
              as: FarmManager
              captures: { fprod: $.data.id }
            - call: "POST /applicators"
              payload: { full_name: "Lee", license_no: "RU-2", certified: true }
              as: FarmManager
              captures: { aid: $.data.id }
            - call: "POST /crop-plans"
              payload: { parcel_id: "${pid}", crop: "WHEAT", season_year: 2026, planned_acres: 100, budget_input_cost: 100, budget_labor_cost: 100, budget_equipment_cost: 100 }
              as: Agronomist
              captures: { pl: $.data.id }
            - call: "POST /crop-plans/${pl}/approve"
              payload: { expected_parcel_version: "${pv}" }
              as: FarmManager
            - call: "POST /planting-events"
              payload: { crop_plan_id: "${pl}", input_lot_id: "${slot}", acres_planted: 100, seed_rate_per_acre: 1 }
              as: Agronomist
            - call: "POST /crop-plans/${pl}/begin-growing"
              payload: {}
              as: Agronomist
            - call: "POST /application-records"
              payload: { crop_plan_id: "${pl}", input_product_id: "${fprod}", applicator_user_id: "${aid}", rate_per_acre: 2, acres_treated: 40 }
              as: Agronomist
              captures: { app: $.data.id }
            - call: "POST /application-records/${app}/confirm"
              payload: {}
              as: Applicator
              as_user_id: "${aid}"
            - call: "POST /labor-entries"
              payload: { crop_plan_id: "${pl}", worker_name: "W", hours: 30, hourly_rate: 20 }
              as: Agronomist
            - call: "POST /equipment-assets"
              payload: { name: "Sprayer", kind: "SPRAYER", hourly_cost: 80 }
              as: FarmManager
              captures: { eq: $.data.id }
            - call: "POST /equipment-usages"
              payload: { equipment_asset_id: "${eq}", crop_plan_id: "${pl}", window_start: "2026-06-02T08:00:00Z", window_end: "2026-06-02T13:00:00Z" }
              as: Agronomist
            - call: "POST /crop-plans/${pl}/begin-harvest"
              payload: {}
              as: Agronomist
            - call: "POST /harvest-events"
              payload: { crop_plan_id: "${pl}", acres_harvested: 50, gross_quantity: 500, moisture_pct: 0 }
              as: Agronomist
          trigger:
            - call: "POST /crop-plans/${pl}/close"
              payload: {}
              as: FarmManager
              captures: { fin: $.data.final_cost_per_acre }
          assert:
            - "CropPlan.${pl}.actual_equipment_cost == 400.00"
            - "CropPlan.${pl}.final_cost_per_acre == 40.00"

      - name: net_quantity_round_then_field_round_order_pinned
        grounds:
          - calculations.yield_aggregation
          - entities.HarvestEvent.fields.net_quantity
          - entities.CropPlan.fields.total_yield_units
        distinguishing_aspect: |
          MODE (b): rounding order is pinned — total_yield_units rounds ONCE after summing lot quantities
          (333.333 + 333.334 = 666.667 -> 666.67), NOT per-lot rounding then summing (333.33 + 333.33 = 666.66),
          a different mode than the >=3-input formula instance above.
        test_recipe:
          setup:
            - "Plan to HARVESTING with two GRADE_A lots of 333.333 and 333.334; sum-then-round = 666.67."
          setup_api_calls:
            - call: "POST /_clock/set"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: FarmManager
            - call: "POST /parcels"
              payload: { name: "Round Field", acreage: 50, soil_type: "CLAY" }
              as: FarmManager
              captures: { pid: $.data.id, pv: $.data.version }
            - call: "POST /input-products"
              payload: { name: "Corn S", category: "SEED", unit: "SEED_UNIT", unit_cost: 0.50 }
              as: FarmManager
              captures: { sp: $.data.id }
            - call: "POST /input-lots"
              payload: { input_product_id: "${sp}", lot_code: "L", quantity_received: 200 }
              as: FarmManager
              captures: { sl: $.data.id }
            - call: "POST /crop-plans"
              payload: { parcel_id: "${pid}", crop: "CORN", season_year: 2026, planned_acres: 40, budget_input_cost: 1, budget_labor_cost: 1, budget_equipment_cost: 1 }
              as: Agronomist
              captures: { pl: $.data.id }
            - call: "POST /crop-plans/${pl}/approve"
              payload: { expected_parcel_version: "${pv}" }
              as: FarmManager
            - call: "POST /planting-events"
              payload: { crop_plan_id: "${pl}", input_lot_id: "${sl}", acres_planted: 40, seed_rate_per_acre: 2 }
              as: Agronomist
            - call: "POST /crop-plans/${pl}/begin-growing"
              payload: {}
              as: Agronomist
            - call: "POST /crop-plans/${pl}/begin-harvest"
              payload: {}
              as: Agronomist
            - call: "POST /harvest-events"
              payload: { crop_plan_id: "${pl}", acres_harvested: 40, gross_quantity: 700, moisture_pct: 0 }
              as: Agronomist
              captures: { he: $.data.id }
            - call: "POST /harvest-lots"
              payload: { harvest_event_id: "${he}", quantity: 333.333 }
              as: Agronomist
              captures: { l1: $.data.id }
            - call: "POST /harvest-lots/${l1}/grade"
              payload: { grade: "GRADE_A" }
              as: Agronomist
            - call: "POST /harvest-lots"
              payload: { harvest_event_id: "${he}", quantity: 333.334 }
              as: Agronomist
              captures: { l2: $.data.id }
            - call: "POST /harvest-lots/${l2}/grade"
              payload: { grade: "GRADE_A" }
              as: Agronomist
          trigger:
            - call: "POST /crop-plans/${pl}/close"
              payload: {}
              as: FarmManager
              captures: { ty: $.data.total_yield_units }
          assert:
            - "CropPlan.${pl}.total_yield_units == 666.67"

  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: crop_plan_revision_cycle_increments_count
        grounds:
          - state_machines.CropPlan.APPROVED_to_UNDER_REVISION
          - state_machines.CropPlan.UNDER_REVISION_to_APPROVED
          - entities.CropPlan.fields.revision_count
        distinguishing_aspect: |
          CYCLE on entity CropPlan: APPROVED -> UNDER_REVISION -> APPROVED loops, revision_count
          rising 0 -> 1 -> 2 across two loops; a non-linear shape distinct from the parallel HarvestLot machine.
        test_recipe:
          setup:
            - "An APPROVED, never-planted plan on an AVAILABLE parcel."
          setup_api_calls:
            - call: "POST /parcels"
              payload: { name: "Cycle Field", acreage: 50, soil_type: "LOAM" }
              as: FarmManager
              captures: { pid: $.data.id, pv0: $.data.version }
            - call: "POST /crop-plans"
              payload: { parcel_id: "${pid}", crop: "CORN", season_year: 2026, planned_acres: 40, budget_input_cost: 1, budget_labor_cost: 1, budget_equipment_cost: 1 }
              as: Agronomist
              captures: { pl: $.data.id }
            - call: "POST /crop-plans/${pl}/approve"
              payload: { expected_parcel_version: "${pv0}" }
              as: FarmManager
              captures: { pv1: $.data.version }
            - call: "POST /crop-plans/${pl}/request-revision"
              payload: {}
              as: Agronomist
            - call: "GET /parcels/${pid}"
              payload: {}
              as: FarmManager
              captures: { pv1b: $.data.version }
            - call: "POST /crop-plans/${pl}/approve"
              payload: { expected_parcel_version: "${pv1b}" }
              as: FarmManager
            - call: "POST /crop-plans/${pl}/request-revision"
              payload: {}
              as: Agronomist
          trigger:
            - call: "GET /crop-plans/${pl}"
              payload: {}
              as: FarmManager
              captures: { rc: $.data.revision_count, st: $.data.status }
          assert:
            - "CropPlan.${pl}.revision_count == 2"
            - "CropPlan.${pl}.status == UNDER_REVISION"

      - name: harvest_lot_parallel_quality_and_sale_axes_independent
        grounds:
          - state_machines.HarvestLot.quality_status=UNGRADED_to_quality_status=GRADE_A
          - state_machines.HarvestLot.sale_status=IN_INVENTORY_to_sale_status=PARTIALLY_COMMITTED
          - entities.HarvestLot.fields.quality_status
          - entities.HarvestLot.fields.sale_status
        distinguishing_aspect: |
          PARALLEL state dimensions on entity HarvestLot: quality_status (UNGRADED->GRADE_A) and
          sale_status (IN_INVENTORY->PARTIALLY_COMMITTED) evolve on independent axes — a different
          entity than the CropPlan cycle.
        test_recipe:
          setup:
            - "A graded GRADE_A lot of 1000 units from a CORN plan; OPEN CORN contract for 2000 @ 5; partial commit 400."
          setup_api_calls:
            - call: "POST /_clock/set"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: FarmManager
            - call: "POST /parcels"
              payload: { name: "Sale Field", acreage: 100, soil_type: "LOAM" }
              as: FarmManager
              captures: { pid: $.data.id, pv: $.data.version }
            - call: "POST /input-products"
              payload: { name: "Corn Seed X", category: "SEED", unit: "SEED_UNIT", unit_cost: 0.50 }
              as: FarmManager
              captures: { sp: $.data.id }
            - call: "POST /input-lots"
              payload: { input_product_id: "${sp}", lot_code: "L", quantity_received: 500 }
              as: FarmManager
              captures: { sl: $.data.id }
            - call: "POST /crop-plans"
              payload: { parcel_id: "${pid}", crop: "CORN", season_year: 2026, planned_acres: 100, budget_input_cost: 1, budget_labor_cost: 1, budget_equipment_cost: 1 }
              as: Agronomist
              captures: { pl: $.data.id }
            - call: "POST /crop-plans/${pl}/approve"
              payload: { expected_parcel_version: "${pv}" }
              as: FarmManager
            - call: "POST /planting-events"
              payload: { crop_plan_id: "${pl}", input_lot_id: "${sl}", acres_planted: 100, seed_rate_per_acre: 1 }
              as: Agronomist
            - call: "POST /crop-plans/${pl}/begin-growing"
              payload: {}
              as: Agronomist
            - call: "POST /crop-plans/${pl}/begin-harvest"
              payload: {}
              as: Agronomist
            - call: "POST /harvest-events"
              payload: { crop_plan_id: "${pl}", acres_harvested: 100, gross_quantity: 1000, moisture_pct: 0 }
              as: Agronomist
              captures: { he: $.data.id }
            - call: "POST /harvest-lots"
              payload: { harvest_event_id: "${he}", quantity: 1000 }
              as: Agronomist
              captures: { lot: $.data.id }
            - call: "POST /harvest-lots/${lot}/grade"
              payload: { grade: "GRADE_A" }
              as: Agronomist
            - call: "POST /sale-contracts"
              payload: { crop: "CORN", buyer_name: "Acme", contracted_quantity: 2000, price_per_unit: 5, min_quality: "GRADE_B" }
              as: SalesAgent
              captures: { sc: $.data.id }
          trigger:
            - call: "POST /sale-contracts/${sc}/commit-lot"
              payload: { harvest_lot_id: "${lot}", commit_quantity: 400 }
              as: SalesAgent
              captures: { cq: $.data.committed_quantity }
          assert:
            - "HarvestLot.${lot}.quality_status == GRADE_A"
            - "HarvestLot.${lot}.sale_status == PARTIALLY_COMMITTED"
            - "HarvestLot.${lot}.quantity_committed == 400"
            - "SaleContract.${sc}.committed_quantity == 400"
            - "SaleContract.${sc}.status == PARTIALLY_FILLED"

  # ===========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: confirm_restricted_app_cascade_depth3_parcel_restrict_then_block
        grounds:
          - state_machines.ApplicationRecord.LOGGED_to_CONFIRMED
          - entities.ComplianceRecord.fields.status
          - entities.Parcel.fields.status
          - entities.Parcel.fields.reentry_blocked_until
          - calculations.restricted_use_window
        distinguishing_aspect: |
          Depth-3 cascade from ApplicationRecord confirm: (1) confirm creates ComplianceRecord ACTIVE ->
          (2) that ComplianceRecord sets Parcel.reentry_blocked_until -> (3) the updated Parcel.status RESTRICTED
          blocks the NEXT application confirm with ERR_REENTRY_INTERVAL_ACTIVE — each hop caused by the previous.
        test_recipe:
          setup:
            - "GROWING plan; restricted product REI=48h; clock 2026-06-10T00:00; first app confirmed -> parcel RESTRICTED until 2026-06-12T00:00; a second logged app exists."
          setup_api_calls:
            - call: "POST /_clock/set"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: FarmManager
            - call: "POST /parcels"
              payload: { name: "RU Field", acreage: 100, soil_type: "LOAM" }
              as: FarmManager
              captures: { pid: $.data.id, pv: $.data.version }
            - call: "POST /input-products"
              payload: { name: "Seed", category: "SEED", unit: "SEED_UNIT", unit_cost: 0.5 }
              as: FarmManager
              captures: { sp: $.data.id }
            - call: "POST /input-lots"
              payload: { input_product_id: "${sp}", lot_code: "L", quantity_received: 500 }
              as: FarmManager
              captures: { sl: $.data.id }
            - call: "POST /input-products"
              payload: { name: "RU Chem", category: "CHEMICAL", unit: "GAL", unit_cost: 10, restricted_use: true, reentry_interval_hours: 48, preharvest_interval_days: 7 }
              as: FarmManager
              captures: { chem: $.data.id }
            - call: "POST /applicators"
              payload: { full_name: "Cert A", license_no: "RU-9", certified: true }
              as: FarmManager
