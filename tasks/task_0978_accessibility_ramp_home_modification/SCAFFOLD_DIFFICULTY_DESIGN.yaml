              payload: {}
              as: Assessor
            - call: "POST /cases/${case_id}/assessments/${asmt_id}/complete"
              payload: { mobility_score: 50, hazard_count: 3, recommended_modifications: ["RAMP"] }
              as: Assessor
            - call: "GET /cases/${case_id}"
              as: Any
              captures: { case_v1: $.data.version }
            - call: "POST /cases/${case_id}/quotes"
              payload: { valid_until: "2026-12-31T00:00:00Z", contingency_pct: 0.0, expected_case_version: "${case_v1}" }
              as: ProjectManager
              captures: { quote_id: $.data.id }
            - call: "POST /cases/${case_id}/quotes/${quote_id}/line-items"
              payload: { line_type: "MATERIAL", description: "Panels", quantity: 2, unit: "each", unit_price_cents: 10000, tax_rate_pct: 0.0, sort_order: 1 }
              as: ProjectManager
            - call: "POST /cases/${case_id}/funding-sources"
              payload: { source_type: "MEDICAID_WAIVER", program_name: "Waiver A", requested_cents: 19999, priority_rank: 1 }
              as: FundingCoordinator
              captures: { fs_a_id: $.data.id }
            - call: "POST /cases/${case_id}/funding-sources"
              payload: { source_type: "CHARITY", program_name: "Charity B", requested_cents: 1, priority_rank: 2 }
              as: FundingCoordinator
              captures: { fs_b_id: $.data.id }
          trigger:
            - call: "GET /cases/${case_id}"
              as: Any
              captures: { case_v2: $.data.version }
            - call: "POST /cases/${case_id}/funding-sources/${fs_a_id}/approve"
              payload: { approved_cents: 19999, expected_case_version: "${case_v2}" }
              as: FundingCoordinator
            - call: "GET /cases/${case_id}"
              as: Any
              captures: { posture_below: $.data.funding_posture, case_v3: $.data.version }
            - call: "POST /cases/${case_id}/funding-sources/${fs_b_id}/approve"
              payload: { approved_cents: 1, expected_case_version: "${case_v3}" }
              as: FundingCoordinator
            - call: "GET /cases/${case_id}"
              as: Any
          assert:
            - "After approving 19999: Case.funding_posture == PARTIALLY_FUNDED (19999 < 20000)"
            - "After approving 1 more cent: Case.total_funded_cents == 20000"
            - "Case.funding_posture == FULLY_FUNDED at exact equality (>= boundary, not >)"

      - name: quote_submit_with_zero_line_items_rejected
        grounds:
