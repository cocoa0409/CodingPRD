            - "insulation_compound_id + listing_certification_id: 2 rows [\"THHN-12-CU\", \"XHHW-10-AL\"] in created_at ASC order, total_count == 2 - both SKUs depend on the same compound and the same UL file"
            - "application_rating XHHW_2: 1 row (\"XHHW-10-AL\"), total_count == 1"
            - "jacket_compound_id equal to the INSULATION compound: 0 rows, total_count == 0 - neither SKU has a jacket, and the filter is not confused by the insulation reference"

      - name: order_list_filters_on_both_parallel_status_dimensions
