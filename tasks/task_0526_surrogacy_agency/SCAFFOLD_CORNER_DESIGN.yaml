scaffold_corner_design:

  # =========================================================================
  # Entities
  # =========================================================================
  - section: entities
    instances:
      - name: create_intended_parent_returns_201_with_defaults
        claim_type: Creation
        grounds: ["entities.IntendedParent.fields.intake_status", "entities.IntendedParent.fields.psych_clearance"]
        distinguishing_aspect: "POST /intended-parents with legal_name, state_code, budget_cents returns 201; intake_status defaults DRAFT, psych_clearance defaults PENDING, version 1."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /intended-parents"
              payload: { legal_name: "IP New", state_code: "CA", budget_cents: 5000000 }
              as: CaseManager
              captures: { ip_id: $.data.id }
          assert:
            - "response.status == 201"
            - "IntendedParent.${ip_id}.intake_status == DRAFT"
            - "IntendedParent.${ip_id}.psych_clearance == PENDING"
            - "IntendedParent.${ip_id}.version == 1"

      - name: get_carrier_not_found_returns_404
        claim_type: Not Found
        grounds: ["entities.GestationalCarrier", "errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "GET /carriers/{nonexistent-uuid} returns ERR_NOT_FOUND with http 404."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "GET /carriers/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: CaseManager
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 404"
            - "response.data.error_id == ERR_NOT_FOUND"

      - name: create_intended_parent_missing_required_field_returns_invalid_request
        claim_type: Required Fields
        grounds: ["entities.IntendedParent.fields.budget_cents", "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "POST /intended-parents without budget_cents returns ERR_INVALID_REQUEST (400)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /intended-parents"
              payload: { legal_name: "IP Bad", state_code: "CA" }
              as: CaseManager
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 400"
            - "response.data.error_id == ERR_INVALID_REQUEST"

      - name: system_fields_ignored_on_create_carrier
        claim_type: System Fields
        grounds: ["entities.GestationalCarrier.fields.intake_status"]
        distinguishing_aspect: "id, created_at, version, intake_status are server-minted; carrier create ignores any client-supplied intake_status and starts DRAFT with version 1."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /carriers"
              payload: { legal_name: "Carrier Sys", state_code: "TX", prior_deliveries: 2, base_compensation_cents: 4000000 }
              as: CaseManager
              captures: { car_id: $.data.id }
          assert:
            - "response.status == 201"
            - "GestationalCarrier.${car_id}.intake_status == DRAFT"
            - "GestationalCarrier.${car_id}.version == 1"

      - name: list_intended_parents_paginated_envelope
        claim_type: Listing
        grounds: ["endpoints"]
        distinguishing_aspect: "GET /intended-parents returns array response_type with pagination fields total_count and has_more."
        test_recipe:
          setup: ["Two intended parents exist."]
          setup_api_calls:
            - call: "POST /intended-parents"
              payload: { legal_name: "IP L1", state_code: "CA", budget_cents: 5000000 }
              as: CaseManager
            - call: "POST /intended-parents"
              payload: { legal_name: "IP L2", state_code: "NY", budget_cents: 5000000 }
              as: CaseManager
          trigger:
            - call: "GET /intended-parents?limit=1&offset=0"
              payload: {}
              as: CaseManager
          assert:
            - "response.response_type == array"
            - "response.meta_total_count == 2"
            - "response.has_more == true"
            - "len(response.data) == 1"

  # =========================================================================
  # State Machines
  # =========================================================================
  - section: state_machines
    instances:
      - name: submit_intended_parent_from_screening_invalid_state
        claim_type: Invalid Transitions
        grounds: ["state_machines.IntendedParent.DRAFT_to_SUBMITTED", "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Calling submit on an IP already in SCREENING (not DRAFT) returns ERR_INVALID_STATE (409); no state change."
        test_recipe:
          setup: ["An IP in SCREENING."]
          setup_api_calls:
            - call: "POST /intended-parents"
              payload: { legal_name: "IP IS", state_code: "CA", budget_cents: 5000000 }
              as: CaseManager
              captures: { ip_id: $.data.id }
            - call: "POST /intended-parents/${ip_id}/submit"
              payload: {}
              as: CaseManager
            - call: "POST /intended-parents/${ip_id}/start-screening"
              payload: {}
              as: Screener
          trigger:
            - call: "POST /intended-parents/${ip_id}/submit"
              payload: {}
              as: CaseManager
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_INVALID_STATE"
            - "IntendedParent.${ip_id}.intake_status == SCREENING"

      - name: clear_intended_parent_without_psych_passed_invalid_state
        claim_type: Precondition Enforcement
        grounds: ["state_machines.IntendedParent.SCREENING_to_CLEARED", "validations[priority=4]"]
        distinguishing_aspect: "IP clear from SCREENING requires psych_clearance PASSED; with psych PENDING it is rejected with ERR_INVALID_STATE and remains SCREENING."
        test_recipe:
          setup: ["An IP in SCREENING with psych_clearance PENDING."]
          setup_api_calls:
            - call: "POST /intended-parents"
              payload: { legal_name: "IP NP", state_code: "CA", budget_cents: 5000000 }
              as: CaseManager
              captures: { ip_id: $.data.id }
            - call: "POST /intended-parents/${ip_id}/submit"
              payload: {}
              as: CaseManager
            - call: "POST /intended-parents/${ip_id}/start-screening"
              payload: {}
              as: Screener
          trigger:
            - call: "POST /intended-parents/${ip_id}/clear"
              payload: {}
              as: Screener
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_INVALID_STATE"
            - "IntendedParent.${ip_id}.intake_status == SCREENING"

      - name: reject_from_terminal_rejected_carrier_invalid_state
        claim_type: Terminal State Lockdown
        grounds: ["state_machines.GestationalCarrier.SCREENING_to_REJECTED", "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "A carrier in terminal REJECTED cannot be rejected again; ERR_INVALID_STATE (409)."
        test_recipe:
          setup: ["A carrier in REJECTED."]
          setup_api_calls:
            - call: "POST /carriers"
              payload: { legal_name: "Carrier Rej", state_code: "TX", prior_deliveries: 2, base_compensation_cents: 4000000 }
              as: CaseManager
              captures: { car_id: $.data.id }
            - call: "POST /carriers/${car_id}/submit"
              payload: {}
              as: CaseManager
            - call: "POST /carriers/${car_id}/start-screening"
              payload: {}
              as: Screener
            - call: "POST /carriers/${car_id}/reject"
              payload: {}
              as: Screener
          trigger:
            - call: "POST /carriers/${car_id}/reject"
              payload: {}
              as: Screener
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_INVALID_STATE"

      - name: carrier_sign_before_cooling_off_returns_cooling_off_active
        claim_type: guarded transitions
        grounds: ["state_machines.Contract.IP_SIGNED_to_EXECUTED", "validations[priority=10]", "errors[ERR_COOLING_OFF_ACTIVE]"]
        distinguishing_aspect: "Carrier-sign attempted before ip_signed_at + 3 days (clock at IP-sign default) returns ERR_COOLING_OFF_ACTIVE (422); contract stays IP_SIGNED."
        test_recipe:
          setup: ["A contract IP_SIGNED at clock 2026-05-01; carrier attempts sign at 2026-05-02 (before cooling-off)."]
          setup_api_calls:
            - call: "POST /intended-parents"
              payload: { legal_name: "IP Cool", state_code: "CA", budget_cents: 6000000 }
              as: CaseManager
              captures: { ip_id: $.data.id }
            - call: "POST /intended-parents/${ip_id}/submit"
              payload: {}
              as: CaseManager
            - call: "POST /intended-parents/${ip_id}/start-screening"
              payload: {}
              as: Screener
            - call: "POST /intended-parents/${ip_id}/set-psych"
              payload: { psych_clearance: "PASSED" }
              as: Screener
            - call: "POST /intended-parents/${ip_id}/clear"
              payload: {}
              as: Screener
            - call: "POST /carriers"
              payload: { legal_name: "Carrier Cool", state_code: "TX", prior_deliveries: 2, base_compensation_cents: 4000000 }
              as: CaseManager
              captures: { car_id: $.data.id }
            - call: "POST /carriers/${car_id}/submit"
              payload: {}
              as: CaseManager
            - call: "POST /carriers/${car_id}/start-screening"
              payload: {}
              as: Screener
            - call: "POST /carriers/${car_id}/set-psych"
              payload: { psych_clearance: "PASSED" }
              as: Screener
            - call: "POST /insurance-reviews"
              payload: { carrier_id: "${car_id}", policy_kind: "SURROGACY_FRIENDLY" }
              as: Screener
              captures: { ins_id: $.data.id }
            - call: "POST /insurance-reviews/${ins_id}/approve"
              payload: {}
              as: Screener
            - call: "POST /carriers/${car_id}/clear"
              payload: {}
              as: Screener
            - call: "POST /matches"
              payload: { intended_parent_id: "${ip_id}", carrier_id: "${car_id}", proposed_carrier_comp_cents: 4000000 }
              as: CaseManager
              captures: { match_id: $.data.id, mv: $.data.version }
            - call: "POST /matches/${match_id}/accept"
              payload: { expected_match_version: "${mv}" }
              as: CaseManager
            - call: "POST /matches/${match_id}/psych-clear"
              payload: {}
              as: Screener
            - call: "POST /contracts"
              payload: { match_id: "${match_id}" }
              as: CaseManager
              captures: { con_id: $.data.id }
            - call: "POST /contracts/${con_id}/ip-sign"
              payload: {}
              as: IntendedParentActor
              as_user_id: "${ip_id}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-02T00:00:00Z" }
              as: CaseManager
          trigger:
            - call: "POST /contracts/${con_id}/carrier-sign"
              payload: {}
              as: CarrierActor
              as_user_id: "${car_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 422"
            - "response.data.error_id == ERR_COOLING_OFF_ACTIVE"
            - "Contract.${con_id}.status == IP_SIGNED"

      - name: milestone_heartbeat_before_transfer_order_violation
        claim_type: guarded transitions
        grounds: ["state_machines.Milestone.SCHEDULED_to_ACHIEVED", "validations[priority=11]", "errors[ERR_MILESTONE_ORDER_VIOLATION]"]
        distinguishing_aspect: "Achieving a HEARTBEAT milestone before EMBRYO_TRANSFER is ACHIEVED returns ERR_MILESTONE_ORDER_VIOLATION (422); milestone stays SCHEDULED."
        test_recipe:
          setup: ["A journey with a SCHEDULED HEARTBEAT milestone but no ACHIEVED EMBRYO_TRANSFER."]
