  # ===================================================================
  - rule_id: compensating_invariant
    instances:
      - name: reservation_confirm_cancel_conserves_committed_budget
        grounds:
          - state_machines.Reservation.CONFIRMED_to_CANCELLED
          - state_machines.Reservation.REQUESTED_to_CONFIRMED
          - entities.Department.fields.committed_budget_cents
        distinguishing_aspect: "Conserved quantity Department.committed_budget_cents: confirm places a 6000 hold and cancel releases exactly 6000, so committed_budget_cents returns to its pre-confirm value 0 (net-zero pair)."
        test_recipe:
          setup:
            - "SEDAN policy; dept budget 10000000; one POOL SEDAN vehicle; one 4h reservation."
          setup_api_calls:
            - call: "POST /vehicle-class-policies"
              payload: { vehicle_class: "SEDAN", assignment_fee_cents_per_month: 30000, mileage_tier1_rate_cents: 50, mileage_tier2_rate_cents: 80, mileage_tier_boundary_miles: 1000, fuel_surcharge_multiplier: 1.1, idle_free_minutes: 60, idle_penalty_cents_per_min: 25, replacement_age_years: 10, replacement_mileage: 150000, replacement_maint_ratio: 0.6 }
              as: FleetAdmin
            - call: "POST /departments"
              payload: { name: "Dep9a", cost_center_code: "CC-900", monthly_budget_cents: 10000000 }
              as: FleetAdmin
              captures: { dep_id: $.data.id }
            - call: "POST /vehicles"
              payload: { vin: "VIN-9A", vehicle_class: "SEDAN", acquisition_cost_cents: 2000000, in_service_date: "2024-01-01T00:00:00Z" }
              as: FleetAdmin
              captures: { veh_id: $.data.id }
            - call: "POST /reservations"
              payload: { department_id: "${dep_id}", requested_start: "2026-06-05T09:00:00Z", requested_end: "2026-06-05T13:00:00Z", driver_name: "D", purpose: "x" }
              as: MotorPoolClerk
              captures: { res_id: $.data.id }
            - call: "POST /reservations/${res_id}/confirm"
              payload: {}
              as: MotorPoolClerk
            - call: "GET /departments/${dep_id}"
              payload: {}
              as: FinanceOfficer
              captures: { cb_after_confirm: $.data.committed_budget_cents }
          trigger:
            - call: "POST /reservations/${res_id}/cancel"
              payload: {}
              as: MotorPoolClerk
            - call: "GET /departments/${dep_id}"
              payload: {}
              as: FinanceOfficer
              captures: { cb_after_cancel: $.data.committed_budget_cents }
          assert:
            - "cb_after_confirm == 6000"
            - "Department.${dep_id}.committed_budget_cents == 0"
      - name: subrogation_recovery_dispute_conserves_liability
        grounds:
          - state_machines.AccidentClaim.SUBROGATION_PENDING_to_SUBROGATION_PENDING
          - state_machines.AccidentClaim.SUBROGATION_PENDING_to_UNDER_INVESTIGATION
          - entities.AccidentClaim.fields.recovered_cents
          - entities.AccidentClaim.fields.outstanding_liable_cents
        distinguishing_aspect: "Conserved quantity recovered_cents + outstanding_liable_cents == gross_recoverable (500000): recording a 200000 recovery then disputing (reversing) 200000 leaves the sum unchanged at 500000 (different conserved quantity than department budget)."
        test_recipe:
          setup:
            - "Vehicle; accident at_fault=false damage=1000000 liable 0.5 (gross 500000), in SUBROGATION_PENDING with 200000 recovered (outstanding 300000)."
          setup_api_calls:
            - call: "POST /vehicles"
              payload: { vin: "VIN-9B", vehicle_class: "SEDAN", acquisition_cost_cents: 2000000, in_service_date: "2024-01-01T00:00:00Z" }
              as: FleetAdmin
              captures: { veh_id: $.data.id }
            - call: "POST /accident-claims"
              payload: { vehicle_id: "${veh_id}", reported_at: "2026-03-05T00:00:00Z", at_fault: false, estimated_damage_cents: 1000000, deductible_cents: 0, third_party_liable_pct: 0.5 }
              as: FinanceOfficer
              captures: { ac_id: $.data.id }
            - call: "POST /accident-claims/${ac_id}/investigate"
              payload: {}
              as: FinanceOfficer
            - call: "POST /accident-claims/${ac_id}/subrogate"
              payload: {}
              as: FinanceOfficer
            - call: "POST /accident-claims/${ac_id}/record-recovery"
              payload: { amount_cents: 200000 }
              as: FinanceOfficer
              captures: { rec_after: $.data.recovered_cents, out_after: $.data.outstanding_liable_cents }
          trigger:
            - call: "POST /accident-claims/${ac_id}/dispute"
              payload: { reversal_cents: 200000 }
              as: FinanceOfficer
          assert:
            - "rec_after == 200000"
            - "out_after == 300000"
            - "AccidentClaim.${ac_id}.recovered_cents == 0"
            - "AccidentClaim.${ac_id}.outstanding_liable_cents == 500000"
