      - name: corner_rbac_role_exclusive_writes_cannot_be_invoked_by_other_roles
        claim_type: error_triggerable
        grounds:
          - roles.RegulatorOps.exclusive_operations
          - roles.PooledPlanProvider.exclusive_operations
          - roles.AdoptingEmployer.exclusive_operations
          - roles.ServiceProvider.exclusive_operations
          - roles.IndependentAuditor.exclusive_operations
          - errors.ERR_UNAUTHORIZED
        distinguishing_aspect: "The role model is segregation of duties, so every write is exclusive to exactly one role and the refusal is decided from the declared role alone — before the path id is resolved and before any state guard runs. Every call below therefore returns 403 on a database that contains nothing at all, which is what distinguishes an authorization check from a not-found or invalid-state check."
