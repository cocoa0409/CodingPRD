            - call: "POST /re-underwriting/properties/${prop1}/rent-roll"
              payload: { period_month: "2026-06", occupied_units: 5, total_units: 100, gross_potential_rent_cents: 1000000, collected_rent_cents: 50000, source_doc_ref: "rr" }
              as: Analyst
              as_user_id: "u-analyst-1"
            - call: "POST /re-underwriting/properties/${prop1}/operating-expenses"
              payload: { period_year: 2025, category: "TAXES", amount_cents: 50000000 }
              as: Analyst
              as_user_id: "u-analyst-1"
            - call: "POST /re-underwriting/deals/${deal1}/assumptions"
              payload: { label: "B", market_rent_growth_yr1_bps: 0, market_rent_growth_steady_bps: 0, expense_growth_bps: 0, exit_cap_rate_bps: 800, hold_period_years: 3, capex_per_unit_cents: 100000, lease_up_months: 12 }
              as: Analyst
              as_user_id: "u-analyst-1"
              captures: { assum1: $.data.id }
            - call: "POST /re-underwriting/deals/${deal1}/submit-underwriting"
              payload: {}
              as: Analyst
              as_user_id: "u-analyst-1"
              captures: { deal1_v2: $.data.version }
            - call: "POST /re-underwriting/deals/${deal1}/scenarios"
              payload: { scenario_kind: "STRESS", assumption_id: "${assum1}", occupancy_stress_pct: 5, expected_deal_version: "${deal1_v2}" }
              as: Analyst
