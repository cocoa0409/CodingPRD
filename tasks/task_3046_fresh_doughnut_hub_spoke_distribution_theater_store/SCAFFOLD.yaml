# =============================================================================
# SCAFFOLD: Fresh Doughnut Hub-and-Spoke Distribution & Theater Store Operations
# =============================================================================

scenario: |
  Fresh Doughnut Hub-and-Spoke Distribution & Theater Store Operations (Krispy Kreme): theater store production lines visible to customers with hot-light signaling and batch timing, hub production supplying spoke retail doors, grocery cabinets and partner locations on daily routes, route delivery windows and freshness dating with same-day stale pull and credit, doughnut variety mix planning by door with seasonal and licensed collections, fundraising and bulk-order channel with lead times and pickup coordination, equipment maintenance on continuous fryers and glaze waterfalls, hot-light hour scheduling and demand response, franchise and company door territory allocation

domain_name: doughnut-hub-spoke
api_prefix: /networks

# =============================================================================
# Complexity Profile
# =============================================================================
complexity_profile:
  primary_archetype: quota_allocation
  secondary_archetype: posture_driven_gating
  complexity_layers:
    - cascading_side_effects
    - dual_variant_calculation
    - optimistic_concurrency
    - ops_run_checkpoint
  entity_topology: hybrid
  state_machine_shape: compound
  relationship_patterns:
    - one_to_many
    - many_to_many
    - cross_aggregate
  role_model: approval_chain
  consistency_model: immediate
  target_difficulty: beyond_expert

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Network
    parent: null
    common_fields: true
    fields:
      - { name: network_code, type: string, source: input, description: "Unique network code (globally unique)" }
      - { name: display_name, type: string, source: input, description: "Network display name" }
      - { name: network_posture, type: enum, source: computed, description: "OPEN | DEGRADED | SUSPENDED | CLOSED — derived from hub line states and alert counts" }
      - { name: ops_run_index, type: integer, source: system, description: "Monotonic counter starting at 0, incremented on each ops-run checkpoint", default: 0 }
      - { name: stale_credit_pool_cents, type: integer, source: computed, description: "Running total of uncredited stale-pull liability; never negative" }

  - name: Hub
    parent: Network
    common_fields: true
    fields:
      - { name: network_id, type: string, source: system, description: "FK -> Network.id; owning network" }
      - { name: hub_code, type: string, source: input, description: "Unique hub code within network" }
      - { name: daily_capacity_dozens, type: integer, source: input, description: "Max dozens the hub can produce per calendar day", constraints: "> 0" }
      - { name: committed_dozens_today, type: integer, source: computed, description: "Dozens committed by batches for the current calendar day; recomputed on batch commit/cancel" }
      - { name: territory_region, type: string, source: input, description: "Region key used for door territory allocation" }

  - name: Door
    parent: Network
    common_fields: true
    fields:
      - { name: network_id, type: string, source: system, description: "FK -> Network.id; owning network" }
      - { name: hub_id, type: string, source: input, description: "FK -> Hub.id; supplying hub for SPOKE/GROCERY/PARTNER doors; null for THEATER doors (self-supplied)" }
      - { name: door_kind, type: enum, source: input, description: "THEATER | SPOKE | GROCERY | PARTNER" }
      - { name: ownership, type: enum, source: input, description: "COMPANY | FRANCHISE" }
      - { name: territory_region, type: string, source: input, description: "Door's territory; must equal the supplying hub's territory_region unless ownership == COMPANY" }
      - { name: door_status, type: enum, source: computed, description: "ACTIVE | SUSPENDED | CLOSED — compound: SUSPENDED when supplying hub has no OPERATIONAL line or door has 3+ unacknowledged stale-credit disputes" }
      - { name: credit_balance_cents, type: integer, source: computed, description: "Stale-pull credit owed to door; never negative" }
      - { name: open_dispute_count, type: integer, source: computed, description: "Count of StaleCredit in DISPUTED status for this door" }

  - name: EquipmentLine
    parent: Hub
    common_fields: true
    fields:
      - { name: hub_id, type: string, source: system, description: "FK -> Hub.id; owning hub" }
      - { name: line_kind, type: enum, source: input, description: "CONTINUOUS_FRYER | GLAZE_WATERFALL" }
      - { name: line_status, type: enum, source: computed, description: "OPERATIONAL | DEGRADED | MAINTENANCE | DECOMMISSIONED" }
      - { name: rated_dozens_per_hour, type: integer, source: input, description: "Rated throughput", constraints: "> 0" }
      - { name: effective_dozens_per_hour, type: integer, source: computed, description: "rated when OPERATIONAL, floor(rated*0.6) when DEGRADED, 0 when MAINTENANCE/DECOMMISSIONED" }
      - { name: hours_since_service, type: number, source: computed, description: "Accumulated production hours since last completed maintenance" }
      - { name: service_interval_hours, type: integer, source: input, description: "Hours between mandatory service", constraints: "> 0" }

  - name: Variety
    parent: Network
    common_fields: true
    fields:
      - { name: network_id, type: string, source: system, description: "FK -> Network.id; owning network" }
      - { name: variety_code, type: string, source: input, description: "Unique variety code within network" }
      - { name: collection_kind, type: enum, source: input, description: "CORE | SEASONAL | LICENSED" }
      - { name: active_from, type: datetime, source: input, description: "Start of selling window (inclusive)" }
      - { name: active_until, type: datetime, source: input, description: "End of selling window (exclusive); must be > active_from" }
      - { name: unit_cost_cents, type: integer, source: input, description: "Production cost per doughnut", constraints: ">= 0" }
      - { name: variety_status, type: enum, source: computed, description: "ACTIVE | EXPIRED — EXPIRED once current time >= active_until" }

  - name: MixPlan
    parent: Door
    common_fields: true
    fields:
      - { name: door_id, type: string, source: system, description: "FK -> Door.id; door this plan serves" }
      - { name: effective_date, type: string, source: input, description: "ISO date the plan takes effect" }
      - { name: mix_plan_status, type: enum, source: computed, description: "DRAFT | PUBLISHED | SUPERSEDED | LOCKED" }
      - { name: total_planned_dozens, type: integer, source: computed, description: "Sum of MixPlanLine.planned_dozens; recomputed on line upsert/removal" }
      - { name: license_quota_dozens, type: integer, source: computed, description: "Sum of planned dozens for LICENSED varieties; must not exceed 25% of total_planned_dozens when total > 0" }

  - name: MixPlanLine
    parent: MixPlan
    common_fields: true
    fields:
      - { name: mix_plan_id, type: string, source: system, description: "FK -> MixPlan.id; owning plan" }
      - { name: variety_id, type: string, source: input, description: "FK -> Variety.id; variety in the mix" }
      - { name: planned_dozens, type: integer, source: input, description: "Planned dozens for the day", constraints: ">= 0" }
      - { name: allocated_dozens, type: integer, source: computed, description: "Dozens actually allocated from hub batches; recomputed by mix_allocation calculation" }

  - name: ProductionBatch
    parent: Hub
    common_fields: true
    fields:
      - { name: hub_id, type: string, source: system, description: "FK -> Hub.id; producing hub" }
      - { name: equipment_line_id, type: string, source: input, description: "FK -> EquipmentLine.id; line the batch runs on" }
      - { name: production_date, type: string, source: input, description: "ISO date of production" }
      - { name: planned_dozens, type: integer, source: input, description: "Planned batch size", constraints: "> 0" }
      - { name: produced_dozens, type: integer, source: input, description: "Actual dozens counted at batch completion; null until completion" }
      - { name: batch_status, type: enum, source: computed, description: "SCHEDULED | COMMITTED | RUNNING | COMPLETED | SHORTFALL | CANCELLED" }
      - { name: fresh_until, type: datetime, source: computed, description: "production completion time + FRESHNESS_HOURS; set at COMPLETED" }
      - { name: yield_rate, type: number, source: computed, description: "produced_dozens / planned_dozens at completion; null until then" }

  - name: Route
    parent: Hub
    common_fields: true
    fields:
      - { name: hub_id, type: string, source: system, description: "FK -> Hub.id; origin hub" }
      - { name: route_code, type: string, source: input, description: "Unique route code within hub" }
      - { name: service_date, type: string, source: input, description: "ISO date the route runs" }
      - { name: route_status, type: enum, source: computed, description: "PLANNING | LOCKED | DISPATCHED | COMPLETED | RECONCILED" }
      - { name: vehicle_capacity_dozens, type: integer, source: input, description: "Max dozens the vehicle carries", constraints: "> 0" }
      - { name: loaded_dozens, type: integer, source: computed, description: "Sum of Shipment.dozens_shipped for shipments on this route" }

  - name: RouteStop
    parent: Route
    common_fields: true
    fields:
      - { name: route_id, type: string, source: system, description: "FK -> Route.id; owning route" }
      - { name: door_id, type: string, source: input, description: "FK -> Door.id; door served at this stop" }
      - { name: sequence_no, type: integer, source: input, description: "Stop order within route; unique per route", constraints: ">= 1" }
      - { name: window_start, type: datetime, source: input, description: "Delivery window start (inclusive)" }
      - { name: window_end, type: datetime, source: input, description: "Delivery window end (exclusive); must be > window_start" }
      - { name: stop_status, type: enum, source: computed, description: "PENDING | ARRIVED | DELIVERED | MISSED | CREDITED" }

  - name: Shipment
    parent: RouteStop
    common_fields: true
    fields:
      - { name: route_stop_id, type: string, source: system, description: "FK -> RouteStop.id; stop receiving this shipment" }
      - { name: production_batch_id, type: string, source: input, description: "FK -> ProductionBatch.id; batch goods were drawn from" }
      - { name: dozens_shipped, type: integer, source: input, description: "Dozens shipped", constraints: "> 0" }
      - { name: dozens_delivered, type: integer, source: input, description: "Dozens accepted at stop; null until delivery record" }
      - { name: delivery_status, type: enum, source: computed, description: "STAGED | IN_TRANSIT | DELIVERED | PARTIAL | FAILED — parallel dimension 1" }
      - { name: credit_status, type: enum, source: computed, description: "NONE | PENDING_PULL | CREDITED | DISPUTED — parallel dimension 2 (stale pull/credit)" }
      - { name: freshness_override, type: boolean, source: input, description: "True when receiver accepted goods past fresh_until under documented override", default: false }

  - name: StaleCredit
    parent: Door
    common_fields: true
    fields:
      - { name: door_id, type: string, source: system, description: "FK -> Door.id; door receiving the credit" }
      - { name: shipment_id, type: string, source: input, description: "FK -> Shipment.id; shipment the stale pull was taken from" }
      - { name: pulled_dozens, type: integer, source: input, description: "Dozens pulled as stale same-day", constraints: "> 0" }
      - { name: provisional_credit_cents, type: integer, source: computed, description: "Credit computed at pull time using provisional variant of stale_credit calculation" }
      - { name: final_credit_cents, type: integer, source: computed, description: "Credit recomputed at route reconciliation using final variant; null until reconciled" }
      - { name: credit_state, type: enum, source: computed, description: "PROVISIONAL | FINALIZED | DISPUTED | RESOLVED" }

  - name: FundraiserOrder
    parent: Door
    common_fields: true
    fields:
      - { name: door_id, type: string, source: system, description: "FK -> Door.id; fulfilling theater/spoke door" }
      - { name: organization_name, type: string, source: input, description: "Fundraising organization" }
      - { name: requested_dozens, type: integer, source: input, description: "Total dozens requested", constraints: "> 0" }
      - { name: pickup_at, type: datetime, source: input, description: "Scheduled pickup time; must satisfy lead-time rule at submission" }
      - { name: fundraiser_status, type: enum, source: computed, description: "SUBMITTED | APPROVED | SCHEDULED | READY | FULFILLED | CANCELLED | EXPIRED" }
      - { name: quoted_total_cents, type: integer, source: computed, description: "Quoted price using fundraiser pricing tiers; recomputed on approval if tiers changed" }
      - { name: pickup_code, type: string, source: system, description: "Pickup coordination code issued at READY" }

  - name: HotLightWindow
    parent: Door
    common_fields: true
    fields:
      - { name: door_id, type: string, source: system, description: "FK -> Door.id; theater door (only THEATER doors may have windows)" }
      - { name: lit_start, type: datetime, source: input, description: "Hot-light on time (inclusive)" }
      - { name: lit_end, type: datetime, source: input, description: "Hot-light off time (exclusive); must be > lit_start" }
      - { name: window_status, type: enum, source: computed, description: "SCHEDULED | LIT | EXTENDED | COMPLETED | CANCELLED" }
      - { name: demand_response_extend_minutes, type: integer, source: input, description: "Demand-response extension granted, minutes", default: 0, constraints: "0..90" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: EquipmentLine
    initial_state: OPERATIONAL
    terminal_states: [DECOMMISSIONED]
    transitions:
      - from: OPERATIONAL
        to: MAINTENANCE
        trigger: "POST /networks/{nid}/hubs/{hid}/lines/{lid}/maintenance/start or system (hours_since_service >= service_interval_hours at ops-run checkpoint)"
        actor: HubManager | system
        preconditions:
          - "No ProductionBatch in RUNNING on this line"
        side_effects:
          - "SCHEDULED ProductionBatches on this line for today are moved to CANCELLED"
          - "Each cancelled batch decrements Hub.committed_dozens_today by its planned_dozens (if batch was COMMITTED)"
          - "Recompute Network.network_posture (posture recalculation)"
      - from: OPERATIONAL
        to: DEGRADED
        trigger: "POST /networks/{nid}/hubs/{hid}/lines/{lid}/degrade"
        actor: HubManager
        preconditions:
          - "hours_since_service >= 0.5 * service_interval_hours"
        side_effects:
          - "Recompute EquipmentLine.effective_dozens_per_hour = floor(rated_dozens_per_hour * 0.6)"
      - from: DEGRADED
        to: MAINTENANCE
        trigger: "POST /networks/{nid}/hubs/{hid}/lines/{lid}/maintenance/start"
        actor: HubManager
        preconditions:
          - "No ProductionBatch in RUNNING on this line"
        side_effects:
          - "Same cancel cascade as OPERATIONAL -> MAINTENANCE"
      - from: MAINTENANCE
        to: OPERATIONAL
        trigger: "POST /networks/{nid}/hubs/{hid}/lines/{lid}/maintenance/complete"
        actor: HubManager
        preconditions:
          - "Line currently in MAINTENANCE"
        side_effects:
          - "hours_since_service reset to 0"
          - "effective_dozens_per_hour restored to rated_dozens_per_hour"
          - "Recompute Network.network_posture"
      - from: OPERATIONAL
        to: DECOMMISSIONED
        trigger: "POST /networks/{nid}/hubs/{hid}/lines/{lid}/decommission"
        actor: HubManager
        preconditions:
          - "No ProductionBatch in SCHEDULED, COMMITTED, or RUNNING on this line"
        side_effects:
          - "Recompute Network.network_posture; doors supplied exclusively by this hub flip Door.door_status to SUSPENDED if no other OPERATIONAL line remains on the hub"
      - from: DEGRADED
        to: DECOMMISSIONED
        trigger: "POST /networks/{nid}/hubs/{hid}/lines/{lid}/decommission"
        actor: HubManager
        preconditions:
          - "No ProductionBatch in SCHEDULED, COMMITTED, or RUNNING on this line"
        side_effects:
          - "Same posture and door-suspension cascade as OPERATIONAL -> DECOMMISSIONED"

  - entity: ProductionBatch
    initial_state: SCHEDULED
    terminal_states: [COMPLETED, SHORTFALL, CANCELLED]
    transitions:
      - from: SCHEDULED
        to: COMMITTED
        trigger: "POST /networks/{nid}/hubs/{hid}/batches/{bid}/commit"
        actor: HubManager
        preconditions:
          - "EquipmentLine.line_status IN {OPERATIONAL, DEGRADED}"
          - "Hub.committed_dozens_today + planned_dozens <= Hub.daily_capacity_dozens"
          - "Network.network_posture IN {OPEN, DEGRADED}"
        side_effects:
          - "Hub.committed_dozens_today += planned_dozens"
      - from: COMMITTED
        to: RUNNING
        trigger: "POST /networks/{nid}/hubs/{hid}/batches/{bid}/start"
        actor: HubManager
        preconditions:
          - "EquipmentLine.line_status IN {OPERATIONAL, DEGRADED}"
          - "No other batch RUNNING on the same line"
        side_effects: []
      - from: RUNNING
        to: COMPLETED
        trigger: "POST /networks/{nid}/hubs/{hid}/batches/{bid}/complete"
        actor: HubManager
        preconditions:
          - "produced_dozens provided and produced_dozens >= planned_dozens * MIN_YIELD_RATE"
        side_effects:
          - "Set fresh_until = completion_time + FRESHNESS_HOURS"
          - "yield_rate = produced_dozens / planned_dozens"
          - "EquipmentLine.hours_since_service += planned_dozens / EquipmentLine.effective_dozens_per_hour (elapsed production hours)"
          - "Hub.committed_dozens_today -= planned_dozens"
          - "Run mix_allocation for the production_date across doors of this hub"
      - from: RUNNING
        to: SHORTFALL
        trigger: "POST /networks/{nid}/hubs/{hid}/batches/{bid}/complete with produced_dozens < planned_dozens * MIN_YIELD_RATE"
        actor: HubManager
        preconditions:
          - "produced_dozens provided and produced_dozens < planned_dozens * MIN_YIELD_RATE"
        side_effects:
          - "Hub.committed_dozens_today -= planned_dozens"
          - "Run mix_allocation shortfall redistribution (waterfall) for the production_date"
          - "Recompute Network.network_posture (shortfall may degrade posture)"
      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /networks/{nid}/hubs/{hid}/batches/{bid}/cancel or cascade from EquipmentLine entering MAINTENANCE"
        actor: HubManager | system
        preconditions: []
        side_effects: []
      - from: COMMITTED
        to: CANCELLED
        trigger: "POST /networks/{nid}/hubs/{hid}/batches/{bid}/cancel or cascade from EquipmentLine entering MAINTENANCE"
        actor: HubManager | system
        preconditions: []
        side_effects:
          - "Hub.committed_dozens_today -= planned_dozens"

  - entity: MixPlan
    initial_state: DRAFT
    terminal_states: [SUPERSEDED, LOCKED]
    transitions:
      - from: DRAFT
        to: PUBLISHED
        trigger: "POST /networks/{nid}/doors/{did}/mix-plans/{mpid}/publish"
        actor: DoorManager
        preconditions:
          - "Door.door_status == ACTIVE"
          - "All MixPlanLine.variety_id resolve to Variety.variety_status == ACTIVE for effective_date"
          - "license_quota_dozens <= floor(0.25 * total_planned_dozens) when total_planned_dozens > 0"
          - "OCC: expected_mix_plan_version matches current version"
        side_effects:
          - "Any prior PUBLISHED MixPlan for the same door and effective_date transitions to SUPERSEDED"
      - from: PUBLISHED
        to: SUPERSEDED
        trigger: "cascade from publishing a newer MixPlan for the same door and effective_date"
        actor: system
        preconditions: []
        side_effects:
          - "MixPlanLine.allocated_dozens for this plan reset to 0"
      - from: PUBLISHED
        to: LOCKED
        trigger: "system at route dispatch covering this door and effective_date, or POST .../mix-plans/{mpid}/lock"
        actor: system | DoorManager
        preconditions:
          - "At least one RouteStop for this door on a LOCKED or DISPATCHED route with service_date == effective_date"
        side_effects:
          - "Plan becomes immutable; line upserts rejected"

  - entity: Route
    initial_state: PLANNING
    terminal_states: [RECONCILED]
    transitions:
      - from: PLANNING
        to: LOCKED
        trigger: "POST /networks/{nid}/hubs/{hid}/routes/{rid}/lock"
        actor: RoutePlanner
        preconditions:
          - "At least one RouteStop on the route"
          - "Sum of stop window spans >= 30 minutes total"
          - "No overlapping windows for stops sharing the same door_id on the same route"
        side_effects:
          - "Stops become immutable in PLANNING sense; new stops rejected once LOCKED"
      - from: LOCKED
        to: DISPATCHED
        trigger: "POST /networks/{nid}/hubs/{hid}/routes/{rid}/dispatch"
        actor: RoutePlanner
        preconditions:
          - "loaded_dozens <= vehicle_capacity_dozens"
          - "Every Shipment on the route has delivery_status == STAGED"
          - "Every referenced ProductionBatch is COMPLETED (fresh_until set)"
        side_effects:
          - "Each Shipment on the route: delivery_status STAGED -> IN_TRANSIT"
          - "Each MixPlan for stops' doors with effective_date == route.service_date transitions PUBLISHED -> LOCKED"
      - from: DISPATCHED
        to: COMPLETED
        trigger: "system when every RouteStop is in {DELIVERED, MISSED, CREDITED}"
        actor: system
        preconditions:
          - "All stops terminal"
        side_effects:
          - "Recompute Network.network_posture"
      - from: COMPLETED
        to: RECONCILED
        trigger: "POST /networks/{nid}/hubs/{hid}/routes/{rid}/reconcile"
        actor: RoutePlanner
        preconditions:
          - "Route in COMPLETED"
        side_effects:
          - "For each StaleCredit in PROVISIONAL for shipments on this route: recompute final_credit_cents via final variant and transition PROVISIONAL -> FINALIZED"
          - "Door.credit_balance_cents for each affected door adjusted by (final_credit_cents - provisional_credit_cents) per credit"
          - "Network.stale_credit_pool_cents recomputed as sum of FINALIZED final_credit_cents minus RESOLVED payouts"

  - entity: RouteStop
    initial_state: PENDING
    terminal_states: [DELIVERED, MISSED, CREDITED]
    transitions:
      - from: PENDING
        to: ARRIVED
        trigger: "POST /networks/{nid}/hubs/{hid}/routes/{rid}/stops/{sid}/arrive"
        actor: RouteDriver
        preconditions:
          - "Route.route_status == DISPATCHED"
          - "Current time within [window_start, window_end) or stop marked late-arrival-eligible"
        side_effects: []
      - from: ARRIVED
        to: DELIVERED
        trigger: "POST /networks/{nid}/hubs/{hid}/routes/{rid}/stops/{sid}/deliver"
        actor: RouteDriver
        preconditions:
          - "All shipments for this stop recorded with dozens_delivered"
        side_effects:
          - "Each shipment: delivery_status IN_TRANSIT -> DELIVERED (if dozens_delivered == dozens_shipped) else PARTIAL"
          - "Route.loaded_dozens unchanged; Door freshness stock updated"
      - from: ARRIVED
        to: MISSED
        trigger: "system when current time >= window_end while stop not delivered, or POST .../miss"
        actor: system | RouteDriver
        preconditions: []
        side_effects:
          - "Shipments for this stop: delivery_status -> FAILED; dozens return to hub availability via mix_allocation rerun"
      - from: DELIVERED
        to: CREDITED
        trigger: "cascade when all StaleCredits for the stop's shipments are RESOLVED"
        actor: system
        preconditions:
          - "At least one StaleCredit exists for this stop's shipments"
          - "All such StaleCredits RESOLVED"
        side_effects: []
      - from: PENDING
        to: MISSED
        trigger: "system when current time >= window_end while stop still PENDING"
        actor: system
        preconditions: []
        side_effects:
          - "Shipments for this stop: delivery_status -> FAILED"

  - entity: Shipment
    initial_state: STAGED
    terminal_states: []
    note: "Parallel dimensions: delivery_status and credit_status evolve independently on the same entity."
    transitions:
      - from: STAGED
        to: IN_TRANSIT
        trigger: "cascade from Route dispatch"
        actor: system
        preconditions: []
        side_effects: []
      - from: IN_TRANSIT
        to: DELIVERED
        trigger: "cascade from RouteStop deliver when dozens_delivered == dozens_shipped"
        actor: system
        preconditions: []
        side_effects: []
      - from: IN_TRANSIT
        to: PARTIAL
        trigger: "cascade from RouteStop deliver when dozens_delivered < dozens_shipped"
        actor: system
        preconditions: []
        side_effects:
          - "Undelivered dozens become eligible for stale pull"
      - from: IN_TRANSIT
        to: FAILED
        trigger: "cascade from RouteStop missed"
        actor: system
        preconditions: []
        side_effects:
          - "All dozens_shipped become eligible for stale pull"
      - from: "credit_status: NONE"
        to: "credit_status: PENDING_PULL"
        trigger: "POST /networks/{nid}/doors/{did}/stale-credits (create)"
        actor: DoorManager
        preconditions:
          - "Shipment.delivery_status IN {DELIVERED, PARTIAL, FAILED}"
          - "Current time < shipment batch's production_date + SAME_DAY_PULL_DEADLINE"
        side_effects:
          - "StaleCredit created in PROVISIONAL with provisional_credit_cents from provisional variant"
      - from: "credit_status: PENDING_PULL"
        to: "credit_status: CREDITED"
        trigger: "cascade from Route reconcile when credit FINALIZED without dispute"
        actor: system
        preconditions: []
        side_effects:
          - "Door.credit_balance_cents += final_credit_cents delta"
      - from: "credit_status: PENDING_PULL"
        to: "credit_status: DISPUTED"
        trigger: "POST /networks/{nid}/doors/{did}/stale-credits/{scid}/dispute"
        actor: DoorManager
        preconditions:
          - "StaleCredit.credit_state == PROVISIONAL"
        side_effects:
          - "Door.open_dispute_count += 1; if open_dispute_count >= 3 then Door.door_status -> SUSPENDED (conditional cascade)"

  - entity: StaleCredit
    initial_state: PROVISIONAL
    terminal_states: [FINALIZED, RESOLVED]
    transitions:
      - from: PROVISIONAL
        to: FINALIZED
        trigger: "cascade from Route reconcile"
        actor: system
        preconditions: []
        side_effects:
          - "final_credit_cents computed via final variant; Door.credit_balance_cents adjusted by delta"
      - from: PROVISIONAL
        to: DISPUTED
        trigger: "POST /networks/{nid}/doors/{did}/stale-credits/{scid}/dispute"
        actor: DoorManager
        preconditions:
          - "Current time <= pull time + DISPUTE_WINDOW_HOURS"
        side_effects:
          - "Door.open_dispute_count += 1; conditional door suspension at threshold"
      - from: DISPUTED
        to: RESOLVED
        trigger: "POST /networks/{nid}/doors/{did}/stale-credits/{scid}/resolve"
        actor: NetworkAdmin
        preconditions:
          - "Resolution amount provided"
        side_effects:
          - "final_credit_cents set to resolution amount"
          - "Door.credit_balance_cents adjusted to final"
          - "Door.open_dispute_count -= 1; if door was SUSPENDED only due to disputes and count < 3, door_status returns to ACTIVE"
      - from: FINALIZED
        to: RESOLVED
        trigger: "POST /networks/{nid}/doors/{did}/stale-credits/{scid}/resolve (payout)"
        actor: NetworkAdmin
        preconditions: []
        side_effects:
          - "Network.stale_credit_pool_cents decremented by final_credit_cents"

  - entity: FundraiserOrder
    initial_state: SUBMITTED
    terminal_states: [FULFILLED, CANCELLED, EXPIRED]
    transitions:
      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /networks/{nid}/doors/{did}/fundraiser-orders/{fid}/approve"
        actor: DoorManager
        preconditions:
          - "pickup_at >= submission time + LEAD_TIME_HOURS (lead time enforced at submit, rechecked here)"
          - "Door.door_status == ACTIVE"
          - "requested_dozens <= door's share of hub capacity on pickup date"
        side_effects:
          - "quoted_total_cents computed via fundraiser_pricing"
      - from: APPROVED
        to: SUBMITTED
        trigger: "POST /networks/{nid}/doors/{did}/fundraiser-orders/{fid}/return-for-changes"
        actor: DoorManager
        preconditions: []
        side_effects:
          - "quoted_total_cents cleared to null (recomputed on next approval — cyclic negotiation loop)"
      - from: APPROVED
        to: SCHEDULED
        trigger: "POST /networks/{nid}/doors/{did}/fundraiser-orders/{fid}/schedule"
        actor: DoorManager
        preconditions:
          - "A COMMITTED or COMPLETED ProductionBatch covering requested_dozens exists at the supplying hub for the pickup date"
        side_effects:
          - "Hub.committed_dozens_today for pickup date += requested_dozens if batch not already covering it"
      - from: SCHEDULED
        to: READY
        trigger: "POST /networks/{nid}/doors/{did}/fundraiser-orders/{fid}/ready"
        actor: DoorManager
        preconditions:
          - "Covering batch is COMPLETED with produced_dozens >= requested_dozens"
        side_effects:
          - "pickup_code issued"
      - from: READY
        to: FULFILLED
        trigger: "POST /networks/{nid}/doors/{did}/fundraiser-orders/{fid}/fulfill"
        actor: DoorManager
        preconditions:
          - "pickup_code matches"
          - "Current time <= pickup_at + PICKUP_GRACE_HOURS"
        side_effects: []
      - from: READY
        to: EXPIRED
        trigger: "system when current time > pickup_at + PICKUP_GRACE_HOURS"
        actor: system
        preconditions: []
        side_effects:
          - "Reserved dozens released back to hub availability"
      - from: SUBMITTED
        to: CANCELLED
        trigger: "POST /networks/{nid}/doors/{did}/fundraiser-orders/{fid}/cancel"
        actor: DoorManager
        preconditions: []
        side_effects: []
      - from: APPROVED
        to: CANCELLED
        trigger: "POST /networks/{nid}/doors/{did}/fundraiser-orders/{fid}/cancel"
        actor: DoorManager
        preconditions: []
        side_effects: []

  - entity: HotLightWindow
    initial_state: SCHEDULED
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - from: SCHEDULED
        to: LIT
        trigger: "system when current time >= lit_start, or POST .../hot-light-windows/{wid}/ignite"
        actor: system | DoorManager
        preconditions:
          - "Door.door_kind == THEATER"
          - "At least one ProductionBatch COMPLETED at this door's hub today with fresh_until in the future"
          - "No other HotLightWindow currently LIT or EXTENDED for this door"
        side_effects:
          - "Theater store signals hot availability"
      - from: LIT
        to: EXTENDED
        trigger: "POST /networks/{nid}/doors/{did}/hot-light-windows/{wid}/extend (demand response)"
        actor: DoorManager
        preconditions:
          - "demand_response_extend_minutes in 1..90"
          - "A fresh batch (COMPLETED, fresh_until in future) still exists"
        side_effects:
          - "lit_end += demand_response_extend_minutes"
      - from: LIT
        to: COMPLETED
        trigger: "system when current time >= lit_end"
        actor: system
        preconditions: []
        side_effects: []
      - from: EXTENDED
        to: COMPLETED
        trigger: "system when current time >= lit_end"
        actor: system
        preconditions: []
        side_effects: []
      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /networks/{nid}/doors/{did}/hot-light-windows/{wid}/cancel"
        actor: DoorManager
        preconditions: []
        side_effects: []

  - entity: Door
    initial_state: ACTIVE
    terminal_states: [CLOSED]
    note: "Compound/posture-driven: door_status is derived from hub line states and dispute counts; manual suspend/close also allowed."
    transitions:
      - from: ACTIVE
        to: SUSPENDED
        trigger: "system (supplying hub loses last OPERATIONAL line) or POST /networks/{nid}/doors/{did}/suspend or system (open_dispute_count reaches 3)"
        actor: system | NetworkAdmin
        preconditions: []
        side_effects:
          - "PUBLISHED MixPlans for future effective_dates remain but batch allocation to this door halts"
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /networks/{nid}/doors/{did}/reinstate or system (dispute count drops below 3 and hub has an OPERATIONAL line)"
        actor: NetworkAdmin | system
        preconditions:
          - "Door.open_dispute_count < 3"
          - "Supplying hub has at least one EquipmentLine with line_status IN {OPERATIONAL, DEGRADED}"
        side_effects: []
      - from: ACTIVE
        to: CLOSED
        trigger: "POST /networks/{nid}/doors/{did}/close"
        actor: NetworkAdmin
        preconditions:
          - "No FundraiserOrder in {SUBMITTED, APPROVED, SCHEDULED, READY}"
          - "No RouteStop in {PENDING, ARRIVED} for this door"
          - "No StaleCredit in {PROVISIONAL, DISPUTED}"
        side_effects:
          - "Future MixPlans SUPERSEDED"
      - from: SUSPENDED
        to: CLOSED
        trigger: "POST /networks/{nid}/doors/{did}/close"
        actor: NetworkAdmin
        preconditions:
          - "Same as ACTIVE -> CLOSED"
        side_effects:
          - "Future MixPlans SUPERSEDED"

# =============================================================================
# §1.2.1 Concurrency Rules (OCC only)
# =============================================================================
concurrency_rules:
  - rule_id: mix-plan-publish-stale-version
    parent_entity: MixPlan
    write_endpoint: "POST /networks/{nid}/doors/{did}/mix-plans/{mpid}/publish"
    occ_field: "expected_mix_plan_version"
    description: |
      Publishing a MixPlan whose version has advanced since the client last
      observed it is rejected. This captures the case where another writer has
      just published a new plan for the same door and effective_date (which
      legitimately supersedes the prior PUBLISHED plan under the MixPlan state
      machine) and the current writer's view of the plan is therefore stale.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: batch-commit-stale-hub-version
    parent_entity: Hub
    write_endpoint: "POST /networks/{nid}/hubs/{hid}/batches/{bid}/commit"
    occ_field: "expected_hub_version"
    description: |
      Committing a ProductionBatch against a Hub whose version has advanced
      since the client last observed it is rejected, because the hub's
      committed_dozens_today may have been changed by another batch commit,
      cancel, or completion and the capacity check would run against stale data.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: stale_credit
    trigger: "StaleCredit creation (provisional) and Route reconcile / dispute resolve (final)"
    algorithm: tiered_pricing
    formula: |
      base = pulled_dozens * DOZEN_CREDIT_BASE_CENTS
      if pulled_dozens >= STALE_TIER2_DOZENS: rate = TIER2_RATE
      elif pulled_dozens >= STALE_TIER1_DOZENS: rate = TIER1_RATE
      else: rate = TIER0_RATE
      raw_credit = base * rate
      # Rounding order is PINNED: round per-credit (not per-dozen), half-up, 0 decimals on cents.
      credit_cents = round_half_up(raw_credit, 0)
    input_set: "StaleCredit.pulled_dozens; shipment must be in delivery_status {DELIVERED, PARTIAL, FAILED}; only pulls made before SAME_DAY_PULL_DEADLINE qualify"
    constants:
      DOZEN_CREDIT_BASE_CENTS: 1200
      STALE_TIER1_DOZENS: 6
      STALE_TIER2_DOZENS: 24
      TIER0_RATE: 0.50
      TIER1_RATE: 0.65
      TIER2_RATE: 0.80
      SAME_DAY_PULL_DEADLINE: "23:59 local on production_date"
      DISPUTE_WINDOW_HOURS: 48
    precision: "integer cents, round_half_up applied once per credit (per-credit rounding, pinned)"
    variants:
      - name: provisional
        when: "Computed at StaleCredit creation time"
        difference: "Uses pulled_dozens as reported and current constants; freshness_override on the shipment halves the rate (rate * 0.5) before rounding"
      - name: final
        when: "Computed at Route reconcile or dispute resolution"
        difference: "Ignores freshness_override; applies an additional late-delivery penalty: if the stop was ARRIVED after window_end, multiply credit by LATE_PENALTY_FACTOR before the same single rounding step"
    constants_note: "LATE_PENALTY_FACTOR: 0.9"

  - name: mix_allocation
    trigger: "ProductionBatch completion or shortfall for a production_date, and fundraiser reservation"
    algorithm: waterfall_allocation
    formula: |
      available = sum over COMPLETED batches for hub+date of produced_dozens
                - sum of dozens already allocated to MIX allocations and fundraiser reservations for that date
      # Circular-looking dependency pinned: allocation order is fixed BEFORE any
      # remainder is computed:
      #   1) fundraiser reservations in READY/SCHEDULED, ordered by pickup_at ASC
      #      (tie-break: created_at ASC of the FundraiserOrder — never id)
      #   2) MixPlanLines of PUBLISHED/LOCKED plans, ordered by MixPlan.effective_date ASC,
      #      then Door.created_at ASC, then MixPlanLine.created_at ASC
      # Each bucket takes min(remaining_need, available). Remainders never round up.
      for bucket in ordered_buckets:
          grant = min(bucket.remaining_need, available)
          bucket.allocated += grant
          available -= grant
    input_set: "Batches with batch_status == COMPLETED for hub and production_date; MixPlan in {PUBLISHED, LOCKED} for effective_date == production_date; FundraiserOrder in {SCHEDULED, READY} for pickup date == production_date"
    constants:
      MIN_YIELD_RATE: 0.85
      FRESHNESS_HOURS: 12
    precision: "integer dozens; no rounding (min() only)"

  - name: fundraiser_pricing
    trigger: "FundraiserOrder approval"
    algorithm: tiered_pricing
    formula: |
      # Mode (b): nested rounding — per-line rounding then sum is PINNED.
      # Lines are implied dozen blocks; price per dozen depends on the tier the
      # CUMULATIVE dozen count has reached (marginal tiered pricing):
      tier_price_cents(d) =
          700 if d <= TIER_A_MAX
          650 if d <= TIER_B_MAX
          600 otherwise
      total = 0
      for d in 1..requested_dozens:
          line_cents = round_half_up(tier_price_cents(d) * (1 - organization_discount_pct), 0)
          total += line_cents
      quoted_total_cents = total
    input_set: "FundraiserOrder.requested_dozens; organization_discount_pct (0 default for non-licensed orgs; 0.10 for registered licensed charities)"
    constants:
      TIER_A_MAX: 25
      TIER_B_MAX: 100
    precision: "integer cents; round per-dozen-line then sum (PINNED order)"
    variants:
      - name: charity
        when: "organization flagged as licensed charity at approval time"
        difference: "organization_discount_pct = 0.10 applied per dozen line before rounding"

  - name: hot_light_demand_response
    trigger: "HotLightWindow extend request"
    algorithm: threshold
    formula: |
      # Demand-response extension grant:
      fresh_dozens = sum of produced_dozens - allocated_dozens across COMPLETED batches
                     at the door's hub today with fresh_until > now
      if fresh_dozens >= DEMAND_HIGH_THRESHOLD: max_extend = 90
      elif fresh_dozens >= DEMAND_LOW_THRESHOLD: max_extend = 45
      else: max_extend = 0
      granted = min(requested_extend_minutes, max_extend)
    input_set: "COMPLETED batches for the theater door's hub on today's date with fresh_until in the future"
    constants:
      DEMAND_LOW_THRESHOLD: 30
      DEMAND_HIGH_THRESHOLD: 120
    precision: "integer minutes"

  - name: network_posture
    trigger: "EquipmentLine state change, batch SHORTFALL, dispute threshold crossing, ops-run checkpoint"
    algorithm: constraint_propagation
    formula: |
      if any hub in network has zero lines in {OPERATIONAL, DEGRADED}: posture = SUSPENDED
      elif count of batches in SHORTFALL today >= 2 OR any door SUSPENDED: posture = DEGRADED
      elif network explicitly closed by NetworkAdmin: posture = CLOSED (terminal)
      else: posture = OPEN
      # Evaluation order is PINNED as listed (SUSPENDED check first, CLOSED is
      # sticky and evaluated before OPEN but after SUSPENDED/DEGRADED recompute
      # only when posture != CLOSED).
    input_set: "All hubs, lines, today's batches, and doors of the network"
    precision: "enum"
    variants:
      - name: ops_run_projection
        when: "POST /networks/{nid}/ops-runs (checkpoint)"
        difference: "Recomputes posture from scratch (full recompute) rather than incrementally; also expires SCHEDULED batches whose production_date < current date (auto-CANCELLED), auto-EXPIREs READY fundraiser orders past grace, and advances ops_run_index by 1"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - { priority: 1, category: auth, check: "X-User-Role and X-User-ID headers present and role recognized", error_id: ERR_UNAUTHENTICATED, http_status: 401, applies_to: "all" }
  - { priority: 2, category: auth, check: "Role permitted for this endpoint per §1.5 roles and §1.7", error_id: ERR_UNAUTHORIZED, http_status: 403, applies_to: "all" }
  - { priority: 3, category: existence, check: "Path resources exist, validated left-to-right (network -> hub/door -> child)", error_id: ERR_NOT_FOUND, http_status: 404, applies_to: "all" }
  - { priority: 4, category: state, check: "Target resource in a state that permits the requested transition/action", error_id: ERR_INVALID_STATE, http_status: 409, applies_to: "all state-transition endpoints" }
  - { priority: 5, category: business_safety, check: "Freshness safety: stale pull only before SAME_DAY_PULL_DEADLINE; hot-light requires a fresh batch in window; fundraiser pickup within lead-time and grace bounds", error_id: ERR_FRESHNESS_VIOLATION, http_status: 422, applies_to: "stale-credit create, hot-light ignite/extend, fundraiser submit/fulfill" }
  - { priority: 6, category: business_temporal, check: "Temporal conflicts: route stop windows for the same door on one route must not overlap ([start,end) half-open, adjacency allowed); hot-light windows for a door must not overlap; Variety active window must satisfy active_from < active_until", error_id: ERR_WINDOW_OVERLAP, http_status: 422, applies_to: "route-stop create, hot-light-window create, variety create" }
  - { priority: 7, category: business_constraint, check: "Territory integrity: door.territory_region must equal supplying hub.territory_region unless door.ownership == COMPANY; THEATER doors must have null hub_id; only THEATER doors may have HotLightWindows", error_id: ERR_TERRITORY_VIOLATION, http_status: 422, applies_to: "door create/update, hot-light-window create" }
  - { priority: 8, category: business_constraint, check: "Mix license quota: license_quota_dozens <= floor(0.25 * total_planned_dozens) at publish when total > 0", error_id: ERR_LICENSE_QUOTA_EXCEEDED, http_status: 422, applies_to: "mix-plan publish" }
  - { priority: 9, category: business_fiscal, check: "Capacity: hub.committed_dozens_today + planned_dozens <= daily_capacity_dozens at batch commit; route.loaded_dozens <= vehicle_capacity_dozens at dispatch; stale-credit resolution cannot push Network.stale_credit_pool_cents negative", error_id: ERR_CAPACITY_EXCEEDED, http_status: 422, applies_to: "batch commit, route dispatch, stale-credit resolve" }
  - { priority: 10, category: business_referential, check: "Referenced entities exist and belong to the same network scope (batch -> hub, variety -> network, shipment batch same hub as route)", error_id: ERR_CROSS_SCOPE_REFERENCE, http_status: 422, applies_to: "endpoints taking entity references in body" }
  - { priority: 11, category: state, check: "OCC: expected_<parent>_version matches current parent version where declared", error_id: ERR_STALE_VERSION, http_status: 412, applies_to: "mix-plan publish, batch commit" }

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # --- clock (test-driving, declared per §1.5 priority ladder rung 3) ---
  - method: POST
    path: "/networks/_clock/set_current_utc"
    description: "Set the logical clock. Server startup default is exactly 2026-09-01T00:00:00Z; before any set call the clock reads this default and never falls back to wall-clock time."
    roles: [NetworkAdmin]
    code: 200
    input: [to_iso8601]
    output: { current_utc: string }
    side_effects: ["Trigger time-based system transitions evaluated at the new time (variety expiry, stop auto-miss, fundraiser expiry, hot-light auto-lit/complete)"]

  # --- Network ---
  - method: POST
    path: "/networks"
    description: "Create a network"
    roles: [NetworkAdmin]
    code: 201
    input: [network_code, display_name]
    output: Network
    side_effects: ["network_posture initialized to OPEN", "ops_run_index = 0"]
  - method: GET
    path: "/networks/{id}"
    description: "Get a network"
    roles: [NetworkAdmin, HubManager, RoutePlanner, DoorManager, RouteDriver]
    code: 200
    input: []
    output: Network
    side_effects: []
  - method: GET
    path: "/networks"
    description: "List networks (paginated)"
    roles: [NetworkAdmin]
    code: 200
    input: ["limit?", "offset?"]
    output: Network[]
    side_effects: []
  - method: POST
    path: "/networks/{id}/ops-runs"
    description: "Run ops-run checkpoint: full posture recompute, expire stale batches/orders, advance ops_run_index"
    roles: [NetworkAdmin]
    code: 201
    input: []
    output: { ops_run_index: integer, expired_batch_count: integer, expired_order_count: integer, network_posture: string }
    side_effects: ["network_posture full recompute (ops_run_projection variant)", "SCHEDULED batches with production_date < today -> CANCELLED", "READY fundraiser orders past grace -> EXPIRED", "EquipmentLine with hours_since_service >= service_interval_hours auto-enter MAINTENANCE cascade", "increments Network.version by 1", "ops_run_index += 1"]

  # --- Hub ---
  - method: POST
    path: "/networks/{nid}/hubs"
    description: "Create a hub"
    roles: [NetworkAdmin]
    code: 201
    input: [hub_code, daily_capacity_dozens, territory_region]
    output: Hub
    side_effects: []
  - method: GET
    path: "/networks/{nid}/hubs/{id}"
    description: "Get a hub"
    roles: [NetworkAdmin, HubManager, RoutePlanner]
    code: 200
    input: []
    output: Hub
    side_effects: []
  - method: GET
    path: "/networks/{nid}/hubs"
    description: "List hubs in network"
    roles: [NetworkAdmin, HubManager, RoutePlanner]
    code: 200
    input: ["limit?", "offset?"]
    output: Hub[]
    side_effects: []
  - method: GET
    path: "/networks/hubs"
    description: "Flat filtered list of hubs across networks (FK reverse-reachability for Hub.network_id)"
    roles: [NetworkAdmin]
    code: 200
    input: ["network_id?", "limit?", "offset?"]
    output: Hub[]
    side_effects: []
  - method: GET
    path: "/networks/hubs/{id}"
    description: "Get hub by id (flat)"
    roles: [NetworkAdmin]
    code: 200
    input: []
    output: Hub
    side_effects: []

  # --- EquipmentLine ---
  - method: POST
    path: "/networks/{nid}/hubs/{hid}/lines"
    description: "Create equipment line"
    roles: [HubManager]
    code: 201
    input: [line_kind, rated_dozens_per_hour, service_interval_hours]
    output: EquipmentLine
    side_effects: ["line_status OPERATIONAL", "effective = rated"]
  - method: GET
    path: "/networks/{nid}/hubs/{hid}/lines/{id}"
    description: "Get equipment line"
    roles: [NetworkAdmin, HubManager]
    code: 200
    input: []
    output: EquipmentLine
    side_effects: []
  - method: GET
    path: "/networks/{nid}/hubs/{hid}/lines"
    description: "List lines for hub"
    roles: [NetworkAdmin, HubManager, RoutePlanner]
    code: 200
    input: ["limit?", "offset?"]
    output: EquipmentLine[]
    side_effects: []
  - method: GET
    path: "/networks/lines"
    description: "Flat filtered list of equipment lines across hubs (FK reverse-reachability for EquipmentLine.hub_id)"
    roles: [NetworkAdmin, HubManager]
    code: 200
    input: ["hub_id?", "limit?", "offset?"]
    output: EquipmentLine[]
    side_effects: []
  - method: GET
    path: "/networks/lines/{id}"
    description: "Get equipment line by id (flat)"
    roles: [NetworkAdmin, HubManager]
    code: 200
    input: []
    output: EquipmentLine
    side_effects: []
  - method: POST
    path: "/networks/{nid}/hubs/{hid}/lines/{id}/degrade"
    description: "Mark line DEGRADED"
    roles: [HubManager]
    code: 200
    input: []
    output: EquipmentLine
    side_effects: ["effective_dozens_per_hour = floor(rated * 0.6)", "increments EquipmentLine.version by 1"]
  - method: POST
    path: "/networks/{nid}/hubs/{hid}/lines/{id}/maintenance/start"
    description: "Start maintenance; cascades cancel today's SCHEDULED/COMMITTED batches on this line"
    roles: [HubManager]
    code: 200
    input: []
    output: EquipmentLine
    side_effects: ["batch cancel cascade", "posture recompute", "increments EquipmentLine.version by 1"]
  - method: POST
    path: "/networks/{nid}/hubs/{hid}/lines/{id}/maintenance/complete"
    description: "Complete maintenance"
    roles: [HubManager]
    code: 200
    input: []
    output: EquipmentLine
    side_effects: ["hours_since_service = 0", "line OPERATIONAL", "posture recompute", "increments EquipmentLine.version by 1"]
  - method: POST
    path: "/networks/{nid}/hubs/{hid}/lines/{id}/decommission"
    description: "Decommission line"
    roles: [HubManager]
    code: 200
    input: []
    output: EquipmentLine
    side_effects: ["posture recompute; door suspension cascade if hub left with no OPERATIONAL/DEGRADED line", "increments EquipmentLine.version by 1"]

  # --- Door ---
  - method: POST
    path: "/networks/{nid}/doors"
    description: "Create a door"
    roles: [NetworkAdmin]
    code: 201
    input: [door_kind, ownership, territory_region, "hub_id?"]
    output: Door
    side_effects: ["door_status ACTIVE"]
  - method: GET
    path: "/networks/{nid}/doors/{id}"
    description: "Get a door"
    roles: [NetworkAdmin, HubManager, RoutePlanner, DoorManager]
    code: 200
    input: []
    output: Door
    side_effects: []
  - method: GET
    path: "/networks/{nid}/doors"
    description: "List doors (filterable)"
    roles: [NetworkAdmin, HubManager, RoutePlanner]
    code: 200
    input: ["hub_id?", "door_kind?", "limit?", "offset?"]
    output: Door[]
    side_effects: []
  - method: GET
    path: "/networks/doors"
    description: "Flat filtered list of doors across networks (FK reverse-reachability for Door.network_id and Door.hub_id)"
    roles: [NetworkAdmin]
    code: 200
    input: ["network_id?", "hub_id?", "limit?", "offset?"]
    output: Door[]
    side_effects: []
  - method: GET
    path: "/networks/doors/{id}"
    description: "Get door by id (flat)"
    roles: [NetworkAdmin]
    code: 200
    input: []
