            - call: "POST /health-data/geofence-campaigns"
              payload: { geofence_zone_id: "${zone_id}", processing_purpose_id: "${pur_id}", campaign_name: "Neighbourhood push", target_radius_meters: 200, distance_to_zone_center_meters: 1000, window_start_at: "2026-09-01T00:00:00Z", window_end_at: "2026-09-05T00:00:00Z" }
              as: DataSteward
              captures: { camp_id: $.data.id }
