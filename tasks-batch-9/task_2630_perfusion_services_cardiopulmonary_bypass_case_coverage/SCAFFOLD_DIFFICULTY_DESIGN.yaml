        grounds:
          - state_machines.IncidentReport.SUBMITTED_to_RETURNED_FOR_INFO
          - state_machines.IncidentReport.RETURNED_FOR_INFO_to_SUBMITTED
          - state_machines.IncidentReport.SUBMITTED_to_UNDER_REVIEW
          - entities.IncidentReport.fields.return_count
          - validations[priority=37]
          - errors.ERR_INCIDENT_RETURN_LIMIT
        distinguishing_aspect: |
          The non-linearity lives on IncidentReport: the report loops SUBMITTED -> RETURNED_FOR_INFO
          -> SUBMITTED, and the same review endpoint is both the loop edge and the exit edge
          depending on payload.decision. The loop is bounded by MAX_INCIDENT_RETURNS == 2, so the
          third RETURN_FOR_INFO on a report whose return_count is already 2 is refused with
          ERR_INCIDENT_RETURN_LIMIT (409) while ACCEPT_FOR_REVIEW on the very same report state
          succeeds — a state-dependent branch on one trigger, not a forward-only chain.
