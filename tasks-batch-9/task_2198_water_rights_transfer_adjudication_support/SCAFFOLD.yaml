# =============================================================================
# PRD Benchmark Seed Tables — Water Rights Transfer & Adjudication Support
# §1.0 Response Envelope · §1.1 Entities · §1.2 State Machines ·
# §1.2.1 Concurrency Rules · §1.3 Calculations · §1.4 Validations ·
# §1.5 Endpoints · §1.6 Errors · §1.7 RBAC
#
# Difficulty target: ABOVE Expert (§0.4) — 13 tightly-coupled entities,
# 65 endpoints, 12 calculations (3 dual-variant), 12 state machines over 10
# entities (two cyclic, two pairs of parallel dimensions, one branching
# fork-join, one compound/bubble-up), 3 OCC rules, 49 priority-ordered
# validations, 58 error codes, 5 roles, 4 transitive cascade chains and
# 2 conserved-quantity ledger invariants.
# =============================================================================

scenario: |
  2198. Water Rights Transfer & Adjudication Support (state water resources department): right documentation & priority date research, change-of-use/point-of-diversion application, injury analysis & protest response, historical consumptive-use quantification, transfer approval conditions & mitigation, abandonment/forfeiture risk & beneficial-use record, adjudication claim filing & decree tracking, water banking & lease

domain_name: water-rights-transfer-adjudication

# Flat topology: every business collection is a root-level peer resource
# (/water-rights, /transfer-applications, /protests, /lease-assignments, ...).
# There is no single owning aggregate root, so the API prefix is the root path.
api_prefix: "/"

complexity_profile:
  primary_archetype: multi_party_negotiation
  secondary_archetype: ledger_reconciliation
  complexity_layers:
    - optimistic_concurrency
    - dual_variant_calculation
    - cascading_side_effects
    - rate_threshold_triggers

  entity_topology: graph
  # graph: WaterRight, Claimant, PointOfDiversion, TransferApplication,
  # HcuStudy, WaterBankAccount, LeaseAssignment, DecreeDocket and
  # AdjudicationClaim form a many-to-many reference web rather than a tree —
  # a LeaseAssignment points at three different parents (account, right, POD),
  # a TransferApplication at three (right, study, proposed POD), and an
  # AdjudicationClaim at two (docket, right). Only four entities
  # (BeneficialUseRecord, HcuStudy-as-child, InjuryAnalysis, ApprovalCondition)
  # are addressed as nested sub-resources.

  state_machine_shape: cyclic
  # cyclic (primary): TransferApplication runs revision rounds
  # PROTEST_PERIOD -> UNDER_PROTEST -> REVISION_REQUESTED -> SUBMITTED ->
  # PROTEST_PERIOD, and LeaseAssignment runs ACTIVE -> SUSPENDED -> ACTIVE.
  # Also present: parallel dimensions (AdjudicationClaim.filing_status ×
  # AdjudicationClaim.verification_status; ApprovalCondition.status ×
  # ApprovalCondition.payment_status), branching fork-join (Protest
  # FILED -> {IN_NEGOTIATION, IN_HEARING} -> RESOLVED_STIPULATED with
  # divergent side-effect sets per branch), and compound/bubble-up
  # (DecreeDocket phase derived from its claims' filing_status).

  relationship_patterns:
    - one_to_many        # WaterRight -> BeneficialUseRecord, HcuStudy, PointOfDiversion
    - many_to_many       # WaterRight <-> WaterBankAccount via LeaseAssignment
    - cross_aggregate    # LeaseAssignment spans bank aggregate + right aggregate
    - polymorphic        # ApprovalCondition.source distinguishes DECISION vs HEARING_RESOLUTION provenance

  role_model: segregation_of_duties
  # The opaque operator id that certified an HcuStudy MUST NOT be the operator
  # id that decides the TransferApplication relying on it, and the operator id
  # that resolved a Protest MUST NOT decide the same application. Layered on
  # top of peer-role ownership (Claimant owns rights/applications/leases,
  # WaterRightsAnalyst owns documentation, HearingOfficer owns protests,
  # DecisionAuthority owns dispositions, BasinAdjudicator owns dockets).

  consistency_model: immediate

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:

  - name: Claimant
    parent: null
    common_fields: true
    fields:
      - name: legal_name
        type: string
        source: input
        description: Legal name of the right holder / applicant of record
        constraints: 1..160 chars, non-blank
      - name: contact_email
        type: string
        source: input
        description: Notice address for protest and decision service
        constraints: must contain "@"
      - name: entity_type
        type: enum
        source: input
        description: Claimant class, drives nothing but reporting
        constraints: one of {INDIVIDUAL, IRRIGATION_DISTRICT, MUNICIPALITY, TRIBE}
      - name: standing_status
        type: enum
        source: system
        default: IN_GOOD_STANDING
        description: >-
          Administrative standing before the department. Set at creation to
          IN_GOOD_STANDING; moved by PATCH /claimants/{id}/standing and driven
          back to IN_GOOD_STANDING by the fee-payment cascade when
          outstanding_fee_balance_usd reaches exactly 0.00.
        constraints: one of {IN_GOOD_STANDING, DELINQUENT, BARRED}
      - name: outstanding_fee_balance_usd
        type: number
        source: computed
        default: 0
        description: >-
          Sum of ApprovalCondition.total_fee_usd over every ApprovalCondition
          whose transfer application belongs to a WaterRight of this Claimant
          and whose payment_status == OUTSTANDING. 2 decimal places.
      - name: open_application_count
        type: integer
        source: computed
        default: 0
        description: >-
          Count of TransferApplication rows on this Claimant's rights whose
          status IN {DRAFT, SUBMITTED, PROTEST_PERIOD, UNDER_PROTEST,
          REVISION_REQUESTED, READY_FOR_DECISION}.

  - name: WaterRight
    parent: null
    common_fields: true
    fields:
      - name: claimant_id
        type: string
        source: input
        description: FK -> Claimant.id; the holder of record for this right
      - name: right_number
        type: string
        source: input
        description: Statutory right identifier printed on the certificate
        constraints: unique across all WaterRight rows, 1..40 chars
      - name: priority_date
        type: datetime
        source: input
        description: >-
          Appropriation priority date established by first beneficial use.
          Earlier priority_date = senior right. Used as the primary sort key
          for adjudication priority ranking.
      - name: source_stream_code
        type: string
        source: input
        description: Stream/aquifer source code the right diverts from
        constraints: 1..24 chars
      - name: purpose_of_use
        type: enum
        source: input
        description: Currently authorized purpose of use
        constraints: one of {IRRIGATION, MUNICIPAL, STOCKWATER, INDUSTRIAL, INSTREAM_FLOW}
      - name: place_of_use_acres
        type: number
        source: input
        description: Authorized irrigated acreage of the place of use
        constraints: ">= 0"
      - name: authorized_diversion_af
        type: number
        source: input
        description: Face-value annual diversion limit in acre-feet
        constraints: "> 0"
      - name: authorized_rate_cfs
        type: number
        source: input
        description: Authorized instantaneous diversion rate in cubic feet per second
        constraints: "> 0"
      - name: status
        type: enum
        source: system
        default: UNADJUDICATED
        description: >-
          Lifecycle state. UNADJUDICATED at creation; ACTIVE after
          POST /water-rights/{id}/activate; ENCUMBERED while encumbered_af > 0;
          PARTIALLY_TRANSFERRED once transferred_away_af > 0 and
          transferable_af > 0; SUSPENDED by the condition-violation cascade;
          FORFEITED by POST /water-rights/{id}/declare-forfeiture.
        constraints: one of {UNADJUDICATED, ACTIVE, ENCUMBERED, PARTIALLY_TRANSFERRED, SUSPENDED, FORFEITED}
      - name: certified_hcu_af
        type: number
        source: computed
        default: 0
        description: >-
          transferable_cu_af of the single HcuStudy on this right whose
          status == CERTIFIED (0 when no study is certified). 2 decimal places.
      - name: encumbered_af
        type: number
        source: computed
        default: 0
        description: >-
          Volume held in escrow against pending transfer activity — see
          calculations.right_volume_ledger. 2 decimal places.
      - name: transferred_away_af
        type: number
        source: computed
        default: 0
        description: >-
          Volume permanently severed from this right by approved transfers.
          2 decimal places.
      - name: transferable_af
        type: number
        source: computed
        default: 0
        description: >-
          certified_hcu_af - encumbered_af - transferred_away_af. Never
          negative; a computation that would drive it below 0 is rejected
          before it is applied. 2 decimal places.
      - name: forfeiture_risk_score
        type: number
        source: computed
        default: 0
        description: See calculations.forfeiture_risk_score. 0..100, 2 decimal places.
      - name: forfeiture_risk_band
        type: enum
        source: computed
        default: LOW
        description: >-
          HIGH when forfeiture_risk_score >= 70, ELEVATED when
          40 <= forfeiture_risk_score < 70, otherwise LOW.
        constraints: one of {LOW, ELEVATED, HIGH}
      - name: consecutive_nonuse_years
        type: integer
        source: computed
        default: 0
        description: >-
          Longest run of consecutive non-use years inside the forfeiture
          look-back window — see calculations.forfeiture_risk_score.
      - name: bank_enrolled
        type: boolean
        source: input
        default: false
        description: >-
          True when the right is enrolled in the basin water bank; required
          before any volume may be deposited into a WaterBankAccount.
      - name: pending_review_count
        type: integer
        source: computed
        default: 0
        description: >-
          Count of InjuryAnalysis rows whose status == DRAFT and whose
          transfer application is on this right.

  - name: PointOfDiversion
    parent: WaterRight
    common_fields: true
    fields:
      - name: water_right_id
        type: string
        source: input
        description: FK -> WaterRight.id; the right this diversion works serves
      - name: legal_description
        type: string
        source: input
        description: Quarter-quarter legal description of the headgate location
        constraints: 1..120 chars
      - name: stream_reach_code
        type: string
        source: input
        description: Stream reach the headgate sits on
        constraints: 1..24 chars
      - name: max_rate_cfs
        type: number
        source: input
        description: >-
          Physical capacity of the diversion works in cubic feet per second.
          Caps the aggregate concurrent lease diversion rate at this POD.
        constraints: "> 0"
      - name: stream_miles_from_headwater
        type: number
        source: input
        description: >-
          River miles from the headwater to this headgate. The absolute
          difference between the existing and proposed POD values drives the
          instantaneous-depletion distance factor in the injury analysis.
        constraints: ">= 0"
      - name: status
        type: enum
        source: system
        default: PROPOSED
        description: >-
          PROPOSED at creation; AUTHORIZED by the right-activation cascade or
          by an approved POINT_OF_DIVERSION_CHANGE decision; RETIRED when an
          approved POINT_OF_DIVERSION_CHANGE supersedes it.
        constraints: one of {PROPOSED, AUTHORIZED, RETIRED}

  - name: BeneficialUseRecord
    parent: WaterRight
    common_fields: false
    fields:
      - name: water_right_id
        type: string
        source: input
        description: FK -> WaterRight.id; the right this annual report covers
      - name: use_year
        type: integer
        source: input
        description: Calendar year of the reported beneficial use
        constraints: 1850..2100; unique per (water_right_id, use_year)
      - name: reported_diversion_af
        type: number
        source: input
        description: Acre-feet actually diverted and applied to beneficial use that year
        constraints: ">= 0"
      - name: irrigated_acres
        type: number
        source: input
        description: Acres actually irrigated that year; drives the CIR_BASED study method
        constraints: ">= 0"
      - name: verification_source
        type: enum
        source: input
        description: >-
          Evidentiary basis for the reported figures. Only METER and
          AERIAL_IMAGERY rows are admissible in a historical consumptive-use
          study; AFFIDAVIT and NONE rows count for forfeiture look-back but
          not for quantification.
        constraints: one of {METER, AERIAL_IMAGERY, AFFIDAVIT, NONE}
      - name: reported_by_user_id
        type: string
        source: system
        description: X-User-ID of the analyst who entered the record (append-only audit)

  - name: HcuStudy
    parent: WaterRight
    common_fields: true
    fields:
      - name: water_right_id
        type: string
        source: input
        description: FK -> WaterRight.id; the right being quantified
      - name: method
        type: enum
        source: input
        description: >-
          Quantification method. DIVERSION_BASED derives consumptive use from
          reported diversions times ditch efficiency; CIR_BASED derives it from
          irrigated acres times the crop irrigation requirement. The two
          methods produce different transferable_cu_af for identical records.
        constraints: one of {DIVERSION_BASED, CIR_BASED}
      - name: study_period_start_year
        type: integer
        source: input
        description: First calendar year of the study period (inclusive)
        constraints: 1850..2100
      - name: study_period_end_year
        type: integer
        source: input
        description: Last calendar year of the study period (inclusive)
        constraints: ">= study_period_start_year"
      - name: qualifying_year_count
        type: integer
        source: computed
        default: 0
        description: >-
          Number of admissible BeneficialUseRecord rows inside the study
          period — see calculations.hcu_transferable_volume input_set.
      - name: average_annual_cu_af
        type: number
        source: computed
        default: 0
        description: >-
          Mean per-year consumptive use across the qualifying years, rounded to
          3 decimal places before the cap and haircut are applied.
      - name: short_history_haircut_applied
        type: boolean
        source: computed
        default: false
        description: >-
          True when qualifying_year_count < 3 and the 0.85 short-history
          haircut was therefore applied.
      - name: transferable_cu_af
        type: number
        source: computed
        default: 0
        description: >-
          Final transferable historical consumptive use in acre-feet — see
          calculations.hcu_transferable_volume. 2 decimal places.
      - name: status
        type: enum
        source: system
        default: DRAFT
        description: >-
          DRAFT at creation; CERTIFIED by POST /hcu-studies/{id}/certify;
          SUPERSEDED when a later study on the same right is certified.
        constraints: one of {DRAFT, CERTIFIED, SUPERSEDED}
      - name: certified_by_user_id
        type: string
        source: system
        default: null
        description: >-
          X-User-ID of the analyst who certified the study. Segregation of
          duties: the DecisionAuthority operator deciding an application that
          relies on this study MUST NOT carry this same X-User-ID.
      - name: certified_at
        type: datetime
        source: system
        default: null
        description: Logical-clock instant at which the study was certified

  - name: TransferApplication
    parent: null
    common_fields: true
    fields:
      - name: water_right_id
        type: string
        source: input
        description: FK -> WaterRight.id; the source right whose volume is transferred
      - name: hcu_study_id
        type: string
        source: input
        description: FK -> HcuStudy.id; the quantification the application relies on
      - name: proposed_point_of_diversion_id
        type: string
        source: input
        default: null
        description: >-
          FK -> PointOfDiversion.id; required when application_type IN
          {POINT_OF_DIVERSION_CHANGE, COMBINED}, forbidden otherwise
      - name: application_type
        type: enum
        source: input
        description: Nature of the requested change
        constraints: one of {CHANGE_OF_USE, POINT_OF_DIVERSION_CHANGE, PLACE_OF_USE_CHANGE, COMBINED}
      - name: requested_af
        type: number
        source: input
        description: Acre-feet of historical consumptive use the applicant asks to move
        constraints: "> 0, 2 decimal places"
      - name: proposed_purpose_of_use
        type: enum
        source: input
        default: null
        description: >-
          Requested new purpose; required when application_type IN
          {CHANGE_OF_USE, COMBINED}
        constraints: one of {IRRIGATION, MUNICIPAL, STOCKWATER, INDUSTRIAL, INSTREAM_FLOW}
      - name: proposed_place_of_use_acres
        type: number
        source: input
        default: null
        description: >-
          Requested new irrigated acreage; required when application_type IN
          {PLACE_OF_USE_CHANGE, COMBINED}
        constraints: ">= 0"
      - name: status
        type: enum
        source: system
        default: DRAFT
        description: >-
          Lifecycle state — see state_machines.TransferApplication. The
          revision cycle re-enters SUBMITTED from REVISION_REQUESTED.
        constraints: >-
          one of {DRAFT, SUBMITTED, PROTEST_PERIOD, UNDER_PROTEST,
          REVISION_REQUESTED, READY_FOR_DECISION, APPROVED,
          APPROVED_WITH_CONDITIONS, DENIED, WITHDRAWN}
      - name: revision_round
        type: integer
        source: system
        default: 0
        description: >-
          Number of completed revision cycles. Incremented on resubmit; capped
          at REVISION_ROUND_CAP = 2.
      - name: protest_deadline
        type: datetime
        source: computed
        default: null
        description: >-
          Set on every publish to clock + 30 days when revision_round == 0 and
          clock + 15 days when revision_round >= 1. Cleared to null on
          request-revision.
      - name: unresolved_protest_count
        type: integer
        source: computed
        default: 0
        description: >-
          Count of Protest rows on this application whose status IN
          {FILED, IN_NEGOTIATION, IN_HEARING}.
      - name: escrowed_af
        type: number
        source: computed
        default: 0
        description: >-
          Volume this application currently holds in escrow on the source
          right; equals requested_af while status IN {SUBMITTED,
          PROTEST_PERIOD, UNDER_PROTEST, REVISION_REQUESTED,
          READY_FOR_DECISION} and 0.00 in every other status.
      - name: mitigation_fee_total_usd
        type: number
        source: computed
        default: 0
        description: >-
          Sum of ApprovalCondition.total_fee_usd over this application's
          conditions whose payment_status IN {OUTSTANDING, PAID}.
          2 decimal places.
      - name: decided_by_user_id
        type: string
        source: system
        default: null
        description: X-User-ID of the DecisionAuthority operator who issued the disposition
      - name: decision_note
        type: string
        source: system
        default: null
        description: Free-text rationale recorded with the disposition

  - name: InjuryAnalysis
    parent: TransferApplication
    common_fields: true
    fields:
      - name: transfer_application_id
        type: string
        source: input
        description: FK -> TransferApplication.id; the application under analysis
      - name: method
        type: enum
        source: input
        description: >-
          Depletion model. INSTANTANEOUS_DEPLETION applies a high depletion
          factor attenuated by the POD move distance; SEASONAL_AVERAGE applies
          a flat seasonal factor with no distance attenuation. The two models
          produce different net_injury_af for identical inputs.
        constraints: one of {INSTANTANEOUS_DEPLETION, SEASONAL_AVERAGE}
      - name: pod_move_miles
        type: number
        source: input
        description: >-
          Absolute river-mile separation between the existing and proposed
          points of diversion, as measured by the analyst.
        constraints: ">= 0"
      - name: return_flow_credit_af
        type: number
        source: input
        default: 0
        description: Return-flow credit the analyst allows against gross depletion
        constraints: ">= 0"
      - name: offset_af
        type: number
        source: computed
        default: 0
        description: >-
          Accumulated stipulated offsets: sum of Protest.stipulated_offset_af
          over this application's protests whose status == RESOLVED_STIPULATED
          and whose track == NEGOTIATION.
      - name: gross_depletion_af
        type: number
        source: computed
        default: 0
        description: See calculations.injury_net_analysis. 2 decimal places.
      - name: net_injury_af
        type: number
        source: computed
        default: 0
        description: >-
          max(0, gross_depletion_af - offset_af - return_flow_credit_af),
          2 decimal places. Any value >= 0.01 blocks an unconditional approval.
      - name: status
        type: enum
        source: system
        default: DRAFT
        description: >-
          DRAFT at creation; FINALIZED by the protest-clearance cascade or by
          close-protest-period; VOIDED when a newer analysis is filed on the
          same application.
        constraints: one of {DRAFT, FINALIZED, VOIDED}
      - name: prepared_by_user_id
        type: string
        source: system
        description: X-User-ID of the analyst who prepared the analysis

  - name: Protest
    parent: TransferApplication
    common_fields: true
    fields:
      - name: transfer_application_id
        type: string
        source: input
        description: FK -> TransferApplication.id; the application being protested
      - name: protestant_claimant_id
        type: string
        source: input
        description: >-
          FK -> Claimant.id; the protesting party. MUST differ from the
          applicant claimant of the protested application.
      - name: claimed_injury_af
        type: number
        source: input
        description: Acre-feet of injury the protestant asserts
        constraints: "> 0"
      - name: basis
        type: enum
        source: input
        description: Statutory ground for the protest
        constraints: one of {INJURY_TO_SENIOR_RIGHT, PUBLIC_INTEREST, ENLARGEMENT, NO_BENEFICIAL_USE}
      - name: track
        type: enum
        source: system
        default: null
        description: >-
          Resolution branch chosen by the hearing officer. NEGOTIATION
          resolutions apply a volumetric offset to the injury analysis;
          HEARING resolutions instead impose an ApprovalCondition.
        constraints: one of {NEGOTIATION, HEARING}
      - name: status
        type: enum
        source: system
        default: FILED
        description: See state_machines.Protest (branching fork-join)
        constraints: >-
          one of {FILED, IN_NEGOTIATION, IN_HEARING, RESOLVED_STIPULATED,
          DISMISSED, WITHDRAWN}
      - name: stipulated_offset_af
        type: number
        source: system
        default: 0
        description: >-
          Offset volume the protestant stipulated to on the NEGOTIATION track;
          stays 0 on the HEARING track and on dismissal/withdrawal.
      - name: resolution_note
        type: string
        source: system
        default: null
        description: Free text recorded at resolution
      - name: resolved_by_user_id
        type: string
        source: system
        default: null
        description: >-
          X-User-ID of the hearing officer who resolved the protest.
          Segregation of duties: the DecisionAuthority operator deciding the
          protested application MUST NOT carry this same X-User-ID.

  - name: ApprovalCondition
    parent: TransferApplication
    common_fields: true
    fields:
      - name: transfer_application_id
        type: string
        source: input
        description: FK -> TransferApplication.id; the application the condition rides on
      - name: condition_type
        type: enum
        source: input
        description: >-
          Nature of the condition. MITIGATION_PAYMENT conditions carry a
          computed fee and start with payment_status OUTSTANDING; every other
          type carries payment_status NOT_APPLICABLE.
        constraints: >-
          one of {DRY_YEAR_FORBEARANCE, MEASUREMENT_DEVICE,
          RETURN_FLOW_MAINTENANCE, MITIGATION_PAYMENT}
      - name: required_af
        type: number
        source: input
        default: 0
        description: >-
          Volume the condition obliges the applicant to forbear, replace, or
          mitigate. Drives the mitigation fee for MITIGATION_PAYMENT.
        constraints: ">= 0"
      - name: compliance_due_date
        type: datetime
        source: input
        default: null
        description: Date by which compliance must be demonstrated
      - name: source
        type: enum
        source: system
        description: >-
          DECISION when created by the disposition, HEARING_RESOLUTION when
          created by a HEARING-track protest resolution.
        constraints: one of {DECISION, HEARING_RESOLUTION}
      - name: status
        type: enum
        source: system
        default: IMPOSED
        description: >-
          Compliance dimension. IMPOSED at creation; SATISFIED by
          POST /approval-conditions/{id}/satisfy; VIOLATED by
          POST /approval-conditions/{id}/violate; RELEASED by the
          right-forfeiture cascade. VIOLATED is NOT terminal — the same
          /satisfy call cures it (late compliance), which is the only route
          that makes POST /water-rights/{id}/reinstate admissible under
          validations priority 31.
        constraints: one of {IMPOSED, SATISFIED, VIOLATED, RELEASED}
      - name: payment_status
        type: enum
        source: system
        default: NOT_APPLICABLE
        description: >-
          Fiscal dimension, independent of status. OUTSTANDING at creation for
          MITIGATION_PAYMENT; PAID by POST /approval-conditions/{id}/pay;
          REVERSED by the right-forfeiture cascade; NOT_APPLICABLE for all
          other condition types.
        constraints: one of {NOT_APPLICABLE, OUTSTANDING, PAID, REVERSED}
      - name: base_fee_usd
        type: number
        source: computed
        default: 0
        description: See calculations.mitigation_fee. 2 decimal places.
      - name: surcharge_pct
        type: number
        source: computed
        default: 0
        description: >-
          Administrative surcharge rate selected from the base_fee_usd tier
          (never from total_fee_usd). 3 decimal places.
      - name: admin_surcharge_usd
        type: number
        source: computed
        default: 0
        description: round(base_fee_usd * surcharge_pct, 2)
      - name: total_fee_usd
        type: number
        source: computed
        default: 0
        description: round(base_fee_usd + admin_surcharge_usd, 2)
      - name: imposed_by_user_id
        type: string
        source: system
        description: X-User-ID of the operator whose action created the condition

  - name: WaterBankAccount
    parent: null
    common_fields: true
    fields:
      - name: claimant_id
        type: string
        source: input
        description: FK -> Claimant.id; the account holder
      - name: basin_code
        type: string
        source: input
        description: Basin the bank account operates in
        constraints: 1..24 chars
      - name: deposited_credit_af
        type: number
        source: computed
        default: 0
        description: Lifetime acre-feet deposited into the account. 2 decimal places.
      - name: committed_credit_af
        type: number
        source: computed
        default: 0
        description: >-
          Acre-feet committed to leases whose status IN {RESERVED, SUSPENDED}.
          2 decimal places.
      - name: leased_out_af
        type: number
        source: computed
        default: 0
        description: >-
          Acre-feet actually delivered under leases whose status == ACTIVE.
          2 decimal places.
      - name: available_credit_af
        type: number
        source: computed
        default: 0
        description: >-
          deposited_credit_af - committed_credit_af - leased_out_af. Never
          negative. 2 decimal places.
      - name: suspended_lease_count
        type: integer
        source: computed
        default: 0
        description: Count of this account's leases whose status == SUSPENDED
      - name: posture
        type: enum
        source: computed
        default: OPEN
        description: >-
          Derived gate on lease activation — see calculations.bank_posture.
          FROZEN dominates RESTRICTED, which dominates OPEN.
        constraints: one of {OPEN, RESTRICTED, FROZEN}

  - name: LeaseAssignment
    parent: null
    common_fields: true
    fields:
      - name: water_bank_account_id
        type: string
        source: input
        description: FK -> WaterBankAccount.id; the account funding the lease
      - name: water_right_id
        type: string
        source: input
        description: FK -> WaterRight.id; the right whose water is leased out
      - name: point_of_diversion_id
        type: string
        source: input
        description: FK -> PointOfDiversion.id; the headgate the lessee diverts at
      - name: lessee_name
        type: string
        source: input
        description: Party taking delivery under the lease
        constraints: 1..160 chars
      - name: lease_start_date
        type: datetime
        source: input
        description: First instant of the lease delivery window (inclusive)
      - name: lease_end_date
        type: datetime
        source: input
        description: >-
          Exclusive upper bound of the lease delivery window. The window is
          half-open [lease_start_date, lease_end_date) for point-of-diversion
          rate aggregation and closed-with-buffer for same-right exclusivity.
        constraints: "> lease_start_date"
      - name: requested_af
        type: number
        source: input
        description: Acre-feet of bank credit committed to this lease
        constraints: "> 0, 2 decimal places"
      - name: diversion_rate_cfs
        type: number
        source: input
        description: Instantaneous rate the lessee will divert at the POD
        constraints: "> 0"
      - name: rental_rate_usd_per_af
        type: number
        source: input
        description: Rental price per acre-foot; reporting only
        constraints: ">= 0"
      - name: valuation_method
        type: enum
        source: input
        description: >-
          Settlement basis on early termination. PRO_RATA_DAILY charges elapsed
          days; SEASON_BLOCK charges whole 30-day blocks. The two produce
          different settlement_credit_af for the same cancellation instant.
        constraints: one of {PRO_RATA_DAILY, SEASON_BLOCK}
      - name: status
        type: enum
        source: system
        default: RESERVED
        description: >-
          See state_machines.LeaseAssignment (cyclic:
          ACTIVE -> SUSPENDED -> ACTIVE).
        constraints: one of {RESERVED, ACTIVE, SUSPENDED, COMPLETED, CANCELLED}
      - name: used_af
        type: number
        source: computed
        default: 0
        description: >-
          Acre-feet deemed consumed at termination — see
          calculations.lease_settlement_credit. 2 decimal places.
      - name: settlement_credit_af
        type: number
        source: computed
        default: 0
        description: >-
          requested_af - used_af, returned to available_credit_af on
          cancellation. 2 decimal places.
      - name: suspension_count
        type: integer
        source: system
        default: 0
        description: Number of times this lease has entered SUSPENDED

  - name: DecreeDocket
    parent: null
    common_fields: true
    fields:
      - name: basin_code
        type: string
        source: input
        description: Basin under adjudication
        constraints: 1..24 chars
      - name: docket_number
        type: string
        source: input
        description: Court docket identifier
        constraints: unique across all DecreeDocket rows
      - name: claim_filing_deadline
        type: datetime
        source: input
        description: >-
          Exclusive cut-off for claim filing; a claim filed at exactly this
          instant is late.
      - name: phase
        type: enum
        source: system
        default: OPEN_FOR_CLAIMS
        description: >-
          Adjudication phase advanced by POST /decree-dockets/{id}/advance-phase
          and auto-advanced to DECREE_ENTERED by the bubble-up cascade when
          every claim reaches DECREED.
        constraints: >-
          one of {OPEN_FOR_CLAIMS, EXAMINATION, OBJECTION_PERIOD,
          DECREE_ENTERED, CLOSED}
      - name: claim_count
        type: integer
        source: computed
        default: 0
        description: Count of AdjudicationClaim rows on this docket
      - name: decreed_claim_count
        type: integer
        source: computed
        default: 0
        description: Count of this docket's claims whose filing_status == DECREED
      - name: total_decreed_af
        type: number
        source: computed
        default: 0
        description: >-
          Sum of decreed_af over this docket's claims whose
          filing_status == DECREED. 2 decimal places.

  - name: AdjudicationClaim
    parent: null
    common_fields: true
    fields:
      - name: decree_docket_id
        type: string
        source: input
        description: FK -> DecreeDocket.id; the docket the claim is filed in
      - name: water_right_id
        type: string
        source: input
        description: FK -> WaterRight.id; the right asserted in the claim
      - name: claimed_priority_date
        type: datetime
        source: input
        description: Priority date the claimant asserts (may differ from the right's record)
      - name: claimed_af
        type: number
        source: input
        description: Acre-feet claimed
        constraints: "> 0, 2 decimal places"
      - name: filing_status
        type: enum
        source: system
        default: FILED
        description: >-
          Procedural dimension — evolves independently of verification_status.
          FILED -> EXAMINED -> {OBJECTED ->} DECREED.
        constraints: one of {FILED, EXAMINED, OBJECTED, DECREED}
      - name: verification_status
        type: enum
        source: system
        default: UNVERIFIED
        description: >-
          Evidentiary dimension — evolves independently of filing_status.
          UNVERIFIED -> {FIELD_VERIFIED, DISPUTED}; DISPUTED -> FIELD_VERIFIED.
          FIELD_VERIFIED is a precondition of the decree transition.
        constraints: one of {UNVERIFIED, FIELD_VERIFIED, DISPUTED}
      - name: examiner_recommended_af
        type: number
        source: system
        default: null
        description: Volume the basin examiner recommends. 2 decimal places.
      - name: decreed_af
        type: number
        source: computed
        default: null
        description: >-
          Volume actually decreed — see calculations.decreed_volume.
          2 decimal places.
      - name: objection_count
        type: integer
        source: computed
        default: 0
        description: Number of objections lodged against this claim
      - name: priority_rank
        type: integer
        source: computed
        default: null
        description: >-
          1-based rank of this claim among its docket's claims whose
          filing_status == DECREED, ordered by claimed_priority_date ASC then
          created_at ASC. Null until the claim is decreed.

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:

  - entity: WaterRight
    state_field: status
    initial_state: UNADJUDICATED
    terminal_states: [FORFEITED]
    transitions:
      - from: UNADJUDICATED
        to: ACTIVE
        trigger: "POST /water-rights/{id}/activate"
        actor: WaterRightsAnalyst
        preconditions:
          - "at least one BeneficialUseRecord on this right has verification_source IN {METER, AERIAL_IMAGERY}"
        side_effects:
          - "every PointOfDiversion on this right whose status == PROPOSED becomes AUTHORIZED"
          - "recompute calculations.forfeiture_risk_score -> forfeiture_risk_score, forfeiture_risk_band, consecutive_nonuse_years"
          - "increments WaterRight.version by 1"
      - from: ACTIVE
        to: ENCUMBERED
        trigger: "system — derived by calculations.right_status_derivation after encumbered_af rises above 0.00 (POST /transfer-applications/{id}/submit, POST /water-bank-accounts/{id}/deposits)"
        actor: system
        preconditions:
          - "encumbered_af > 0.00"
          - "transferred_away_af == 0.00"
        side_effects:
          - "recompute transferable_af = certified_hcu_af - encumbered_af - transferred_away_af"
      - from: ENCUMBERED
        to: ACTIVE
        trigger: "system — derived by calculations.right_status_derivation after encumbered_af returns to 0.00 (withdraw, deny, or forfeiture release)"
        actor: system
        preconditions:
          - "encumbered_af == 0.00"
          - "transferred_away_af == 0.00"
        side_effects:
          - "recompute transferable_af"
      - from: ENCUMBERED
        to: PARTIALLY_TRANSFERRED
        trigger: "system — derived by calculations.right_status_derivation after transferred_away_af rises above 0.00 (POST /transfer-applications/{id}/decide with disposition IN {APPROVE, APPROVE_WITH_CONDITIONS})"
        actor: system
        preconditions:
          - "transferred_away_af > 0.00"
        side_effects:
          - "recompute transferable_af"
        note: >-
          PARTIALLY_TRANSFERRED outranks ENCUMBERED in
          calculations.right_status_derivation, so a right with both
          transferred_away_af > 0 and encumbered_af > 0 reads
          PARTIALLY_TRANSFERRED.
      - from: ACTIVE
        to: SUSPENDED
        trigger: "system — link 2 of the condition-violation cascade (POST /approval-conditions/{id}/violate)"
        actor: system
        preconditions:
          - "an ApprovalCondition on a TransferApplication of this right moved IMPOSED -> VIOLATED"
        side_effects:
          - "recompute calculations.forfeiture_risk_score (the SUSPENDED_PENALTY term of 12 now applies)"
          - "cascade link 3: every LeaseAssignment on this right whose status == ACTIVE moves to SUSPENDED"
          - "increments WaterRight.version by 1"
      - from: ENCUMBERED
        to: SUSPENDED
        trigger: "system — link 2 of the condition-violation cascade (POST /approval-conditions/{id}/violate)"
        actor: system
        preconditions:
          - "an ApprovalCondition on a TransferApplication of this right moved IMPOSED -> VIOLATED"
        side_effects:
          - "recompute calculations.forfeiture_risk_score"
          - "cascade link 3: every LeaseAssignment on this right whose status == ACTIVE moves to SUSPENDED"
          - "increments WaterRight.version by 1"
      - from: PARTIALLY_TRANSFERRED
        to: SUSPENDED
        trigger: "system — link 2 of the condition-violation cascade (POST /approval-conditions/{id}/violate)"
        actor: system
        preconditions:
          - "an ApprovalCondition on a TransferApplication of this right moved IMPOSED -> VIOLATED"
        side_effects:
          - "recompute calculations.forfeiture_risk_score"
          - "cascade link 3: every LeaseAssignment on this right whose status == ACTIVE moves to SUSPENDED"
          - "increments WaterRight.version by 1"
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /water-rights/{id}/reinstate"
        actor: WaterRightsAnalyst
        preconditions:
          - "no ApprovalCondition on any TransferApplication of this right has status == VIOLATED"
          - "consecutive_nonuse_years < 5"
        side_effects:
          - "recompute calculations.forfeiture_risk_score (SUSPENDED_PENALTY no longer applies)"
          - "re-derive status via calculations.right_status_derivation (may land on ENCUMBERED or PARTIALLY_TRANSFERRED instead of ACTIVE)"
          - "increments WaterRight.version by 1"
        note: >-
          Closes the WaterRight cycle ACTIVE -> SUSPENDED -> ACTIVE. Leases
          suspended by the cascade are NOT auto-resumed; each needs
          POST /lease-assignments/{id}/resume.
      - from: ACTIVE
        to: FORFEITED
        trigger: "POST /water-rights/{id}/declare-forfeiture"
        actor: WaterRightsAnalyst
        preconditions:
          - "consecutive_nonuse_years >= 5"
        side_effects:
          - "all four ledger buckets — certified_hcu_af, encumbered_af, transferred_away_af and transferable_af — set to 0.00; FORFEITED rights are exempt from the calculations.right_volume_ledger aggregation and satisfy its identity trivially (0.00 == 0.00 + 0.00 + 0.00)"
          - "cascade link 2: every TransferApplication on this right whose status IN {DRAFT, SUBMITTED, PROTEST_PERIOD, UNDER_PROTEST, REVISION_REQUESTED, READY_FOR_DECISION} moves to DENIED and releases its escrow"
          - "cascade link 2: every LeaseAssignment on this right whose status IN {RESERVED, ACTIVE, SUSPENDED} moves to CANCELLED and settles per calculations.lease_settlement_credit"
          - "cascade link 3: every ApprovalCondition of those denied applications whose status == IMPOSED moves to RELEASED, and every one whose payment_status == OUTSTANDING moves to REVERSED, decrementing Claimant.outstanding_fee_balance_usd"
          - "increments WaterRight.version by 1"
      - from: SUSPENDED
        to: FORFEITED
        trigger: "POST /water-rights/{id}/declare-forfeiture"
        actor: WaterRightsAnalyst
        preconditions:
          - "consecutive_nonuse_years >= 5"
        side_effects:
          - "same cascade as the ACTIVE -> FORFEITED transition"
          - "increments WaterRight.version by 1"

  - entity: PointOfDiversion
    state_field: status
    initial_state: PROPOSED
    terminal_states: [RETIRED]
    transitions:
      - from: PROPOSED
        to: AUTHORIZED
        trigger: "system — POST /water-rights/{id}/activate authorizes every PROPOSED POD on the right"
        actor: system
        preconditions:
          - "parent WaterRight moved UNADJUDICATED -> ACTIVE"
        side_effects: ["updated_at refreshed; version incremented by 1"]
      - from: PROPOSED
        to: AUTHORIZED
        trigger: "system — POST /transfer-applications/{id}/decide approves an application whose application_type IN {POINT_OF_DIVERSION_CHANGE, COMBINED}"
        actor: system
        preconditions:
          - "this POD is the application's proposed_point_of_diversion_id"
          - "application status becomes APPROVED or APPROVED_WITH_CONDITIONS"
        side_effects:
          - "every other PointOfDiversion on the same right whose status == AUTHORIZED moves to RETIRED"
          - "version incremented by 1"
      - from: AUTHORIZED
        to: RETIRED
        trigger: "system — superseded by the newly authorized POD of an approved POINT_OF_DIVERSION_CHANGE / COMBINED application"
        actor: system
        preconditions:
          - "a sibling PointOfDiversion on the same right moved PROPOSED -> AUTHORIZED via a transfer decision"
        side_effects:
          - "every LeaseAssignment referencing this POD whose status IN {RESERVED, ACTIVE, SUSPENDED} keeps its status but no new lease may reference a RETIRED POD"
          - "version incremented by 1"

  - entity: HcuStudy
    state_field: status
    initial_state: DRAFT
    terminal_states: [SUPERSEDED]
    transitions:
      - from: DRAFT
        to: CERTIFIED
        trigger: "POST /hcu-studies/{id}/certify"
        actor: WaterRightsAnalyst
        preconditions:
          - "parent WaterRight.status IN {ACTIVE, ENCUMBERED, PARTIALLY_TRANSFERRED, SUSPENDED}"
          - "qualifying_year_count >= 1"
          - "expected_water_right_version equals the current WaterRight.version (concurrency_rules[hcu-certify-stale-right])"
        side_effects:
          - "certified_by_user_id = X-User-ID, certified_at = logical clock"
          - "the previously CERTIFIED HcuStudy on the same right, if any, moves to SUPERSEDED"
          - "WaterRight.certified_hcu_af = this study's transferable_cu_af; transferable_af recomputed"
          - "WaterRight status re-derived via calculations.right_status_derivation"
          - "increments WaterRight.version by 1"
      - from: CERTIFIED
        to: SUPERSEDED
        trigger: "system — a later DRAFT study on the same right is certified"
        actor: system
        preconditions:
          - "another HcuStudy on the same water_right_id moved DRAFT -> CERTIFIED"
        side_effects: ["version incremented by 1"]

  - entity: TransferApplication
    state_field: status
    initial_state: DRAFT
    terminal_states: [APPROVED, APPROVED_WITH_CONDITIONS, DENIED, WITHDRAWN]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /transfer-applications/{id}/submit"
        actor: Claimant
        preconditions:
          - "X-User-ID equals WaterRight.claimant_id of the application's right"
          - "Claimant.standing_status == IN_GOOD_STANDING"
          - "WaterRight.status IN {ACTIVE, ENCUMBERED, PARTIALLY_TRANSFERRED}"
          - "HcuStudy.status == CERTIFIED and HcuStudy.water_right_id == this application's water_right_id"
          - "requested_af <= WaterRight.transferable_af"
          - "expected_water_right_version equals the current WaterRight.version (concurrency_rules[application-submit-stale-right])"
        side_effects:
          - "escrowed_af = requested_af; WaterRight.encumbered_af += requested_af; WaterRight.transferable_af recomputed"
          - "WaterRight status re-derived via calculations.right_status_derivation (ACTIVE -> ENCUMBERED)"
          - "Claimant.open_application_count recomputed"
          - "increments WaterRight.version by 1"
      - from: SUBMITTED
        to: PROTEST_PERIOD
        trigger: "POST /transfer-applications/{id}/publish"
        actor: WaterRightsAnalyst
        preconditions:
          - "an InjuryAnalysis on this application has status == DRAFT"
        side_effects:
          - "protest_deadline = logical clock + 30 days when revision_round == 0, + 15 days when revision_round >= 1"
      - from: PROTEST_PERIOD
        to: UNDER_PROTEST
        trigger: "POST /protests"
        actor: Claimant
        preconditions:
          - "logical clock < protest_deadline"
        side_effects:
          - "unresolved_protest_count recomputed (becomes 1)"
      - from: UNDER_PROTEST
        to: UNDER_PROTEST
        trigger: "POST /protests — an additional protestant files while the window is open"
        actor: Claimant
        preconditions:
          - "logical clock < protest_deadline"
          - "no existing Protest on this application has the same protestant_claimant_id"
        side_effects:
          - "unresolved_protest_count recomputed (incremented)"
      - from: PROTEST_PERIOD
        to: READY_FOR_DECISION
        trigger: "POST /transfer-applications/{id}/close-protest-period"
        actor: WaterRightsAnalyst
        preconditions:
          - "logical clock >= protest_deadline"
          - "unresolved_protest_count == 0"
        side_effects:
          - "the application's DRAFT InjuryAnalysis moves to FINALIZED"
          - "WaterRight.pending_review_count recomputed"
      - from: UNDER_PROTEST
        to: READY_FOR_DECISION
        trigger: "system — link 3 of the protest-clearance cascade: unresolved_protest_count reaches 0"
        actor: system
        preconditions:
          - "unresolved_protest_count == 0 after a protest reached RESOLVED_STIPULATED, DISMISSED or WITHDRAWN"
        side_effects:
          - "cascade link 4: the application's DRAFT InjuryAnalysis moves to FINALIZED, freezing gross_depletion_af / offset_af / net_injury_af"
          - "cascade link 5: WaterRight.pending_review_count decremented"
        note: >-
          Fires regardless of whether protest_deadline has passed — clearing
          every protest is sufficient to close the negotiation phase.
      - from: UNDER_PROTEST
        to: REVISION_REQUESTED
        trigger: "POST /transfer-applications/{id}/request-revision"
        actor: HearingOfficer
        preconditions:
          - "revision_round < 2"
          - "unresolved_protest_count >= 1"
        side_effects:
          - "protest_deadline cleared to null"
          - "every Protest on this application whose status IN {FILED, IN_NEGOTIATION, IN_HEARING} is held in place (unresolved_protest_count unchanged)"
      - from: REVISION_REQUESTED
        to: SUBMITTED
        trigger: "POST /transfer-applications/{id}/resubmit"
        actor: Claimant
        preconditions:
          - "X-User-ID equals WaterRight.claimant_id of the application's right"
          - "revision_round < 2"
          - "new requested_af <= WaterRight.transferable_af + escrowed_af"
          - "expected_water_right_version equals the current WaterRight.version"
        side_effects:
          - "WaterRight.encumbered_af -= old escrowed_af, then += new requested_af; escrowed_af = new requested_af"
          - "revision_round incremented by 1"
          - "the application's DRAFT InjuryAnalysis is recomputed against the new requested_af (gross_depletion_af and net_injury_af refreshed; offset_af retained)"
          - "increments WaterRight.version by 1"
        note: Closes the revision cycle SUBMITTED -> PROTEST_PERIOD -> UNDER_PROTEST -> REVISION_REQUESTED -> SUBMITTED.
      - from: READY_FOR_DECISION
        to: APPROVED
        trigger: "POST /transfer-applications/{id}/decide with disposition == APPROVE"
        actor: DecisionAuthority
        preconditions:
          - "the application's FINALIZED InjuryAnalysis has net_injury_af < 0.01"
          - "X-User-ID differs from HcuStudy.certified_by_user_id of the application's study"
          - "X-User-ID differs from Protest.resolved_by_user_id of every protest on this application"
          - "requested_af <= WaterRight.encumbered_af"
        side_effects:
          - "WaterRight.encumbered_af -= requested_af; WaterRight.transferred_away_af += requested_af; transferable_af recomputed"
          - "WaterRight status re-derived via calculations.right_status_derivation (-> PARTIALLY_TRANSFERRED)"
          - "escrowed_af set to 0.00; decided_by_user_id recorded"
          - "when application_type IN {POINT_OF_DIVERSION_CHANGE, COMBINED}: proposed POD PROPOSED -> AUTHORIZED and the right's other AUTHORIZED PODs -> RETIRED"
          - "Claimant.open_application_count recomputed"
          - "increments WaterRight.version by 1"
        note: >-
          Branch A of the fork. No ApprovalCondition is created and no fee is
          assessed — the divergence from branch B.
      - from: READY_FOR_DECISION
        to: APPROVED_WITH_CONDITIONS
        trigger: "POST /transfer-applications/{id}/decide with disposition == APPROVE_WITH_CONDITIONS"
        actor: DecisionAuthority
        preconditions:
          - "conditions array is non-empty"
          - "sum of required_af over submitted conditions whose condition_type IN {MITIGATION_PAYMENT, DRY_YEAR_FORBEARANCE} >= net_injury_af of the FINALIZED InjuryAnalysis"
          - "X-User-ID differs from HcuStudy.certified_by_user_id of the application's study"
          - "X-User-ID differs from Protest.resolved_by_user_id of every protest on this application"
          - "requested_af <= WaterRight.encumbered_af"
        side_effects:
          - "same volume ledger movement as branch A (encumbered_af -> transferred_away_af)"
          - "one ApprovalCondition row created per submitted condition, source = DECISION, status = IMPOSED"
          - "each MITIGATION_PAYMENT condition gets payment_status = OUTSTANDING and its fee computed per calculations.mitigation_fee"
          - "Claimant.outstanding_fee_balance_usd increased by the sum of the new total_fee_usd values; mitigation_fee_total_usd recomputed"
          - "when application_type IN {POINT_OF_DIVERSION_CHANGE, COMBINED}: proposed POD PROPOSED -> AUTHORIZED and the right's other AUTHORIZED PODs -> RETIRED"
          - "increments WaterRight.version by 1"
        note: >-
          Branch B of the fork. Divergent side-effect set: condition rows,
          fee assessment and claimant balance movement, none of which branch A
          performs.
      - from: READY_FOR_DECISION
        to: DENIED
        trigger: "POST /transfer-applications/{id}/decide with disposition == DENY"
        actor: DecisionAuthority
        preconditions:
          - "X-User-ID differs from HcuStudy.certified_by_user_id of the application's study"
          - "X-User-ID differs from Protest.resolved_by_user_id of every protest on this application"
        side_effects:
          - "WaterRight.encumbered_af -= escrowed_af; escrowed_af = 0.00; transferable_af recomputed"
          - "WaterRight status re-derived via calculations.right_status_derivation"
          - "no ApprovalCondition created; mitigation_fee_total_usd stays 0.00"
          - "increments WaterRight.version by 1"
        note: >-
          Compensating action for submit — restores
          calculations.right_volume_ledger to its pre-submit values exactly.
      - from: DRAFT
        to: WITHDRAWN
        trigger: "POST /transfer-applications/{id}/withdraw"
        actor: Claimant
        preconditions:
          - "X-User-ID equals WaterRight.claimant_id of the application's right"
        side_effects:
          - "Claimant.open_application_count recomputed"
      - from: SUBMITTED
        to: WITHDRAWN
        trigger: "POST /transfer-applications/{id}/withdraw"
        actor: Claimant
        preconditions:
          - "X-User-ID equals WaterRight.claimant_id of the application's right"
        side_effects:
          - "WaterRight.encumbered_af -= escrowed_af; escrowed_af = 0.00; transferable_af recomputed"
          - "WaterRight status re-derived via calculations.right_status_derivation"
          - "increments WaterRight.version by 1"
      - from: PROTEST_PERIOD
        to: WITHDRAWN
        trigger: "POST /transfer-applications/{id}/withdraw"
        actor: Claimant
        preconditions:
          - "X-User-ID equals WaterRight.claimant_id of the application's right"
        side_effects:
          - "WaterRight.encumbered_af -= escrowed_af; escrowed_af = 0.00; transferable_af recomputed"
          - "every Protest on this application whose status IN {FILED, IN_NEGOTIATION, IN_HEARING} moves to DISMISSED"
          - "the application's DRAFT InjuryAnalysis moves to VOIDED; WaterRight.pending_review_count recomputed"
          - "increments WaterRight.version by 1"
      - from: UNDER_PROTEST
        to: WITHDRAWN
        trigger: "POST /transfer-applications/{id}/withdraw"
        actor: Claimant
        preconditions:
          - "X-User-ID equals WaterRight.claimant_id of the application's right"
        side_effects:
          - "same as the PROTEST_PERIOD -> WITHDRAWN transition"
          - "increments WaterRight.version by 1"
      - from: REVISION_REQUESTED
        to: WITHDRAWN
        trigger: "POST /transfer-applications/{id}/withdraw"
        actor: Claimant
        preconditions:
          - "X-User-ID equals WaterRight.claimant_id of the application's right"
        side_effects:
          - "same as the PROTEST_PERIOD -> WITHDRAWN transition"
          - "increments WaterRight.version by 1"
      - from: SUBMITTED
        to: DENIED
        trigger: "system — link 2 of the forfeiture cascade (POST /water-rights/{id}/declare-forfeiture)"
        actor: system
        preconditions:
          - "the application's WaterRight moved to FORFEITED"
        side_effects:
          - "escrowed_af = 0.00 (the right's ledger fields are zeroed by link 1)"
          - "cascade link 3: this application's IMPOSED conditions move to RELEASED and OUTSTANDING payments to REVERSED"
      - from: PROTEST_PERIOD
        to: DENIED
        trigger: "system — link 2 of the forfeiture cascade (POST /water-rights/{id}/declare-forfeiture)"
        actor: system
        preconditions:
          - "the application's WaterRight moved to FORFEITED"
        side_effects:
          - "escrowed_af = 0.00; open protests moved to DISMISSED; DRAFT InjuryAnalysis moved to VOIDED"
          - "cascade link 3: this application's IMPOSED conditions move to RELEASED and OUTSTANDING payments to REVERSED"
      - from: READY_FOR_DECISION
        to: DENIED
        trigger: "system — link 2 of the forfeiture cascade (POST /water-rights/{id}/declare-forfeiture)"
        actor: system
        preconditions:
          - "the application's WaterRight moved to FORFEITED"
        side_effects:
          - "escrowed_af = 0.00"
          - "cascade link 3: this application's IMPOSED conditions move to RELEASED and OUTSTANDING payments to REVERSED"

  - entity: InjuryAnalysis
    state_field: status
    initial_state: DRAFT
    terminal_states: [FINALIZED, VOIDED]
    transitions:
      - from: DRAFT
        to: FINALIZED
        trigger: "system — the parent TransferApplication enters READY_FOR_DECISION (via close-protest-period or via link 3 of the protest-clearance cascade)"
        actor: system
        preconditions:
          - "parent TransferApplication.status becomes READY_FOR_DECISION"
        side_effects:
          - "gross_depletion_af, offset_af and net_injury_af frozen at their current values"
          - "cascade link 5: WaterRight.pending_review_count decremented"
      - from: DRAFT
        to: VOIDED
        trigger: "POST /transfer-applications/{id}/injury-analyses — a newer analysis supersedes this one"
        actor: WaterRightsAnalyst
        preconditions:
          - "a new InjuryAnalysis is created on the same application while this one is DRAFT"
        side_effects:
          - "WaterRight.pending_review_count recomputed (net zero: one DRAFT replaces another)"
      - from: DRAFT
        to: VOIDED
        trigger: "system — the parent TransferApplication reaches WITHDRAWN or is DENIED by the forfeiture cascade"
        actor: system
        preconditions:
          - "parent TransferApplication.status becomes WITHDRAWN or DENIED while this analysis is DRAFT"
        side_effects:
          - "WaterRight.pending_review_count decremented"

  - entity: Protest
    state_field: status
    initial_state: FILED
    terminal_states: [RESOLVED_STIPULATED, DISMISSED, WITHDRAWN]
    transitions:
      - from: FILED
        to: IN_NEGOTIATION
        trigger: "POST /protests/{id}/route with track == NEGOTIATION"
        actor: HearingOfficer
        preconditions:
          - "parent TransferApplication.status == UNDER_PROTEST"
        side_effects: ["track = NEGOTIATION"]
      - from: FILED
        to: IN_HEARING
        trigger: "POST /protests/{id}/route with track == HEARING"
        actor: HearingOfficer
        preconditions:
          - "parent TransferApplication.status == UNDER_PROTEST"
        side_effects: ["track = HEARING"]
      - from: IN_NEGOTIATION
        to: RESOLVED_STIPULATED
        trigger: "POST /protests/{id}/resolve with outcome == STIPULATE"
        actor: HearingOfficer
        preconditions:
          - "stipulated_offset_af is present and > 0"
          - "stipulated_offset_af <= claimed_injury_af"
        side_effects:
          - "cascade link 1: stipulated_offset_af recorded; resolved_by_user_id = X-User-ID"
          - "cascade link 2: the application's DRAFT InjuryAnalysis recomputes offset_af (sum over NEGOTIATION-track stipulations) and net_injury_af"
          - "cascade link 2: TransferApplication.unresolved_protest_count decremented"
          - "cascade link 3: when unresolved_protest_count reaches 0 the application auto-transitions UNDER_PROTEST -> READY_FOR_DECISION"
        note: >-
          NEGOTIATION branch of the fork — volumetric offset, no condition
          created.
      - from: IN_HEARING
        to: RESOLVED_STIPULATED
        trigger: "POST /protests/{id}/resolve with outcome == STIPULATE"
        actor: HearingOfficer
        preconditions:
          - "condition_type is present"
        side_effects:
          - "stipulated_offset_af stays 0.00 — the HEARING branch grants NO volumetric offset"
          - "one ApprovalCondition created on the application with source = HEARING_RESOLUTION, status = IMPOSED, required_af = claimed_injury_af"
          - "when condition_type == MITIGATION_PAYMENT the condition's fee is computed per calculations.mitigation_fee, payment_status = OUTSTANDING, and Claimant.outstanding_fee_balance_usd increases"
          - "TransferApplication.unresolved_protest_count decremented; auto-transition to READY_FOR_DECISION when it reaches 0"
        note: >-
          HEARING branch of the fork — divergent side-effect set: an
          ApprovalCondition (and possibly a fee) instead of an injury offset.
      - from: IN_HEARING
        to: DISMISSED
        trigger: "POST /protests/{id}/resolve with outcome == DISMISS"
        actor: HearingOfficer
        preconditions:
          - "resolution_note is present"
        side_effects:
          - "no offset, no condition; resolved_by_user_id = X-User-ID"
          - "TransferApplication.unresolved_protest_count decremented; auto-transition to READY_FOR_DECISION when it reaches 0"
      - from: FILED
        to: WITHDRAWN
        trigger: "POST /protests/{id}/withdraw"
        actor: Claimant
        preconditions:
          - "X-User-ID equals protestant_claimant_id"
        side_effects:
          - "TransferApplication.unresolved_protest_count decremented; auto-transition to READY_FOR_DECISION when it reaches 0"
      - from: IN_NEGOTIATION
        to: WITHDRAWN
        trigger: "POST /protests/{id}/withdraw"
        actor: Claimant
        preconditions:
          - "X-User-ID equals protestant_claimant_id"
        side_effects:
          - "TransferApplication.unresolved_protest_count decremented; auto-transition to READY_FOR_DECISION when it reaches 0"
      - from: IN_HEARING
        to: WITHDRAWN
        trigger: "POST /protests/{id}/withdraw"
        actor: Claimant
        preconditions:
          - "X-User-ID equals protestant_claimant_id"
        side_effects:
          - "TransferApplication.unresolved_protest_count decremented; auto-transition to READY_FOR_DECISION when it reaches 0"
      - from: FILED
        to: DISMISSED
        trigger: "system — the parent TransferApplication reaches WITHDRAWN or is DENIED by the forfeiture cascade"
        actor: system
        preconditions:
          - "parent TransferApplication leaves the pending set while this protest is unresolved"
        side_effects: ["unresolved_protest_count recomputed"]
      - from: IN_NEGOTIATION
        to: DISMISSED
        trigger: "system — the parent TransferApplication reaches WITHDRAWN or is DENIED by the forfeiture cascade"
        actor: system
        preconditions:
          - "parent TransferApplication leaves the pending set while this protest is unresolved"
        side_effects: ["unresolved_protest_count recomputed"]
      - from: IN_HEARING
        to: DISMISSED
        trigger: "system — the parent TransferApplication reaches WITHDRAWN or is DENIED by the forfeiture cascade"
        actor: system
        preconditions:
          - "parent TransferApplication leaves the pending set while this protest is unresolved"
        side_effects: ["unresolved_protest_count recomputed"]

  - entity: ApprovalCondition
    state_field: status
    initial_state: IMPOSED
    terminal_states: [SATISFIED, RELEASED]
    transitions:
      - from: IMPOSED
        to: SATISFIED
        trigger: "POST /approval-conditions/{id}/satisfy"
        actor: Claimant
        preconditions:
          - "X-User-ID equals WaterRight.claimant_id of the application's right"
          - "payment_status IN {NOT_APPLICABLE, PAID} — an OUTSTANDING fee blocks compliance sign-off"
        side_effects: ["updated_at refreshed; version incremented by 1"]
        note: >-
          Cross-dimension guard: the compliance dimension cannot terminate
          while the fiscal dimension is still OUTSTANDING.
      - from: IMPOSED
        to: VIOLATED
        trigger: "POST /approval-conditions/{id}/violate"
        actor: WaterRightsAnalyst
        preconditions:
          - "logical clock >= compliance_due_date when compliance_due_date is non-null"
        side_effects:
          - "cascade link 1: status = VIOLATED"
          - "cascade link 2: the application's WaterRight moves to SUSPENDED and its forfeiture_risk_score is recomputed"
          - "cascade link 3: every LeaseAssignment on that right whose status == ACTIVE moves to SUSPENDED, moving requested_af from leased_out_af back to committed_credit_af"
          - "cascade link 4: each affected WaterBankAccount increments suspended_lease_count, driving posture to FROZEN"
      - from: VIOLATED
        to: SATISFIED
        trigger: "POST /approval-conditions/{id}/satisfy"
        actor: Claimant
        preconditions:
          - "X-User-ID equals WaterRight.claimant_id of the application's right"
          - "payment_status IN {NOT_APPLICABLE, PAID} — an OUTSTANDING fee blocks compliance sign-off"
        side_effects: ["updated_at refreshed; version incremented by 1"]
        note: >-
          The cure leg. VIOLATED is deliberately NOT terminal: a violation
          recorded by field enforcement can be cured by late compliance, and
          curing every VIOLATED condition on a right is the ONLY way to clear
          validations priority 31 and make POST /water-rights/{id}/reinstate
          reachable at all. Curing does NOT itself lift the suspension — the
          right stays SUSPENDED (calculations.right_status_derivation treats
          SUSPENDED as sticky) and its suspended LeaseAssignment rows stay
          SUSPENDED until POST /lease-assignments/{id}/resume.
      - from: IMPOSED
        to: RELEASED
        trigger: "system — link 3 of the forfeiture cascade (POST /water-rights/{id}/declare-forfeiture)"
        actor: system
        preconditions:
          - "the application was moved to DENIED by the forfeiture cascade"
        side_effects:
          - "when payment_status == OUTSTANDING it moves to REVERSED and Claimant.outstanding_fee_balance_usd decreases by total_fee_usd"

  - entity: ApprovalCondition
    state_field: payment_status
    initial_state: NOT_APPLICABLE
    terminal_states: [PAID, REVERSED]
    transitions:
      - from: NOT_APPLICABLE
        to: OUTSTANDING
        trigger: "system — condition created with condition_type == MITIGATION_PAYMENT (decision branch B or a HEARING-track protest resolution)"
        actor: system
        preconditions:
          - "condition_type == MITIGATION_PAYMENT"
          - "required_af > 0"
        side_effects:
          - "base_fee_usd, surcharge_pct, admin_surcharge_usd, total_fee_usd computed per calculations.mitigation_fee"
          - "Claimant.outstanding_fee_balance_usd increased by total_fee_usd"
      - from: OUTSTANDING
        to: PAID
        trigger: "POST /approval-conditions/{id}/pay"
        actor: Claimant
        preconditions:
          - "X-User-ID equals WaterRight.claimant_id of the application's right"
          - "Claimant.standing_status != BARRED"
        side_effects:
          - "cascade link 1: payment_status = PAID"
          - "cascade link 2: Claimant.outstanding_fee_balance_usd decreased by total_fee_usd"
          - "cascade link 3: when the balance reaches exactly 0.00 and standing_status == DELINQUENT, standing_status returns to IN_GOOD_STANDING"
          - "cascade link 4: every WaterBankAccount of that claimant recomputes posture per calculations.bank_posture"
      - from: OUTSTANDING
        to: REVERSED
        trigger: "system — link 3 of the forfeiture cascade (POST /water-rights/{id}/declare-forfeiture)"
        actor: system
        preconditions:
          - "the condition's status moved IMPOSED -> RELEASED"
        side_effects:
          - "Claimant.outstanding_fee_balance_usd decreased by total_fee_usd"
          - "posture of the claimant's WaterBankAccounts recomputed"
        note: Parallel dimension — the fiscal axis terminates in REVERSED while the compliance axis terminates in RELEASED.

  - entity: LeaseAssignment
    state_field: status
    initial_state: RESERVED
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - from: RESERVED
        to: ACTIVE
        trigger: "POST /lease-assignments/{id}/activate"
        actor: Claimant
        preconditions:
          - "X-User-ID equals WaterBankAccount.claimant_id"
          - "WaterBankAccount.posture == OPEN"
          - "logical clock >= lease_start_date"
          - "logical clock < lease_end_date"
          - "PointOfDiversion.status == AUTHORIZED"
        side_effects:
          - "WaterBankAccount.committed_credit_af -= requested_af; leased_out_af += requested_af; available_credit_af unchanged"
          - "WaterBankAccount.posture recomputed"
      - from: ACTIVE
        to: SUSPENDED
        trigger: "system — link 3 of the condition-violation cascade: the leased right moved to SUSPENDED"
        actor: system
        preconditions:
          - "the lease's WaterRight moved to SUSPENDED"
        side_effects:
          - "suspension_count incremented"
          - "WaterBankAccount.leased_out_af -= requested_af; committed_credit_af += requested_af"
          - "cascade link 4: WaterBankAccount.suspended_lease_count incremented and posture recomputed to FROZEN"
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /lease-assignments/{id}/resume"
        actor: WaterRightsAnalyst
        preconditions:
          - "the lease's WaterRight.status IN {ACTIVE, ENCUMBERED, PARTIALLY_TRANSFERRED}"
          - "logical clock < lease_end_date"
        side_effects:
          - "WaterBankAccount.committed_credit_af -= requested_af; leased_out_af += requested_af"
          - "WaterBankAccount.suspended_lease_count decremented and posture recomputed"
        note: Closes the lease cycle ACTIVE -> SUSPENDED -> ACTIVE.
      - from: ACTIVE
        to: COMPLETED
        trigger: "POST /lease-assignments/{id}/complete"
        actor: WaterRightsAnalyst
        preconditions:
          - "logical clock >= lease_end_date"
        side_effects:
          - "used_af = requested_af; settlement_credit_af = 0.00"
          - "WaterBankAccount.leased_out_af -= requested_af; deposited_credit_af -= requested_af (the water was delivered and leaves the bank)"
          - "WaterBankAccount.posture recomputed"
      - from: RESERVED
        to: CANCELLED
        trigger: "POST /lease-assignments/{id}/cancel"
        actor: Claimant
        preconditions:
          - "X-User-ID equals WaterBankAccount.claimant_id"
        side_effects:
          - "used_af = 0.00; settlement_credit_af = requested_af"
          - "WaterBankAccount.committed_credit_af -= requested_af; available_credit_af += requested_af"
          - "WaterBankAccount.posture recomputed"
        note: >-
          Compensating action for lease creation — restores
          calculations.bank_credit_ledger to its pre-creation values exactly.
      - from: ACTIVE
        to: CANCELLED
        trigger: "POST /lease-assignments/{id}/cancel"
        actor: Claimant
        preconditions:
          - "X-User-ID equals WaterBankAccount.claimant_id"
          - "logical clock < lease_end_date"
        side_effects:
          - "used_af and settlement_credit_af computed per calculations.lease_settlement_credit using the lease's valuation_method"
          - "WaterBankAccount.leased_out_af -= requested_af; available_credit_af += settlement_credit_af; deposited_credit_af -= used_af"
          - "WaterBankAccount.posture recomputed"
      - from: SUSPENDED
        to: CANCELLED
        trigger: "POST /lease-assignments/{id}/cancel"
        actor: Claimant
        preconditions:
          - "X-User-ID equals WaterBankAccount.claimant_id"
        side_effects:
          - "used_af and settlement_credit_af computed per calculations.lease_settlement_credit"
          - "WaterBankAccount.committed_credit_af -= requested_af; available_credit_af += settlement_credit_af; deposited_credit_af -= used_af"
          - "suspended_lease_count decremented; posture recomputed"
      - from: RESERVED
        to: CANCELLED
        trigger: "system — link 2 of the forfeiture cascade (POST /water-rights/{id}/declare-forfeiture)"
        actor: system
        preconditions:
          - "the lease's WaterRight moved to FORFEITED"
        side_effects:
          - "settlement per calculations.lease_settlement_credit; bank ledger restored; posture recomputed"
      - from: ACTIVE
        to: CANCELLED
        trigger: "system — link 2 of the forfeiture cascade (POST /water-rights/{id}/declare-forfeiture)"
        actor: system
        preconditions:
          - "the lease's WaterRight moved to FORFEITED"
        side_effects:
          - "settlement per calculations.lease_settlement_credit; bank ledger restored; posture recomputed"
      - from: SUSPENDED
        to: CANCELLED
        trigger: "system — link 2 of the forfeiture cascade (POST /water-rights/{id}/declare-forfeiture)"
        actor: system
        preconditions:
          - "the lease's WaterRight moved to FORFEITED"
        side_effects:
          - "settlement per calculations.lease_settlement_credit; bank ledger restored; posture recomputed"

  - entity: AdjudicationClaim
    state_field: filing_status
    initial_state: FILED
    terminal_states: [DECREED]
    transitions:
      - from: FILED
        to: EXAMINED
        trigger: "POST /adjudication-claims/{id}/examine"
        actor: BasinAdjudicator
        preconditions:
          - "DecreeDocket.phase == EXAMINATION"
          - "examiner_recommended_af > 0 and <= claimed_af"
        side_effects: ["examiner_recommended_af recorded"]
      - from: EXAMINED
        to: OBJECTED
        trigger: "POST /adjudication-claims/{id}/object"
        actor: Claimant
        preconditions:
          - "DecreeDocket.phase == OBJECTION_PERIOD"
          - "X-User-ID differs from WaterRight.claimant_id of the claim's right"
        side_effects: ["objection_count incremented"]
      - from: OBJECTED
        to: OBJECTED
        trigger: "POST /adjudication-claims/{id}/object — an additional objector"
        actor: Claimant
        preconditions:
          - "DecreeDocket.phase == OBJECTION_PERIOD"
          - "X-User-ID differs from WaterRight.claimant_id of the claim's right"
        side_effects: ["objection_count incremented"]
      - from: EXAMINED
        to: DECREED
        trigger: "POST /adjudication-claims/{id}/decree"
        actor: BasinAdjudicator
        preconditions:
          - "DecreeDocket.phase == OBJECTION_PERIOD"
          - "verification_status == FIELD_VERIFIED (parallel dimension guard)"
        side_effects:
          - "decreed_af computed per calculations.decreed_volume; priority_rank recomputed for every DECREED claim on the docket"
          - "DecreeDocket.decreed_claim_count and total_decreed_af recomputed"
          - "bubble-up: when decreed_claim_count == claim_count the docket auto-advances OBJECTION_PERIOD -> DECREE_ENTERED"
      - from: OBJECTED
        to: DECREED
        trigger: "POST /adjudication-claims/{id}/decree"
        actor: BasinAdjudicator
        preconditions:
          - "DecreeDocket.phase == OBJECTION_PERIOD"
          - "verification_status == FIELD_VERIFIED (parallel dimension guard)"
        side_effects:
          - "decreed_af computed per calculations.decreed_volume (the objection haircut applies because objection_count >= 1)"
          - "priority_rank recomputed; docket counters recomputed; bubble-up to DECREE_ENTERED when all claims are DECREED"

  - entity: AdjudicationClaim
    state_field: verification_status
    initial_state: UNVERIFIED
    terminal_states: []
    transitions:
      - from: UNVERIFIED
        to: FIELD_VERIFIED
        trigger: "POST /adjudication-claims/{id}/verify with verification_outcome == FIELD_VERIFIED"
        actor: WaterRightsAnalyst
        preconditions:
          - "the claim's WaterRight has at least one BeneficialUseRecord with verification_source IN {METER, AERIAL_IMAGERY}"
        side_effects: ["version incremented by 1"]
        note: Evolves independently of filing_status — verification may precede or follow examination.
      - from: UNVERIFIED
        to: DISPUTED
        trigger: "POST /adjudication-claims/{id}/verify with verification_outcome == DISPUTED"
        actor: WaterRightsAnalyst
        preconditions: []
        side_effects: ["version incremented by 1"]
      - from: DISPUTED
        to: FIELD_VERIFIED
        trigger: "POST /adjudication-claims/{id}/verify with verification_outcome == FIELD_VERIFIED"
        actor: WaterRightsAnalyst
        preconditions:
          - "the claim's WaterRight has at least one BeneficialUseRecord with verification_source IN {METER, AERIAL_IMAGERY}"
        side_effects: ["version incremented by 1"]
        note: Cycle on the verification axis — a disputed claim can be re-verified.

  - entity: DecreeDocket
    state_field: phase
    initial_state: OPEN_FOR_CLAIMS
    terminal_states: [CLOSED]
    transitions:
      - from: OPEN_FOR_CLAIMS
        to: EXAMINATION
        trigger: "POST /decree-dockets/{id}/advance-phase with target_phase == EXAMINATION"
        actor: BasinAdjudicator
        preconditions:
          - "logical clock >= claim_filing_deadline"
          - "claim_count >= 1"
        side_effects: ["no new AdjudicationClaim may be filed on this docket"]
      - from: EXAMINATION
        to: OBJECTION_PERIOD
        trigger: "POST /decree-dockets/{id}/advance-phase with target_phase == OBJECTION_PERIOD"
        actor: BasinAdjudicator
        preconditions:
          - "every AdjudicationClaim on this docket has filing_status != FILED (compound gate on children)"
        side_effects: []
      - from: OBJECTION_PERIOD
        to: DECREE_ENTERED
        trigger: "POST /decree-dockets/{id}/advance-phase with target_phase == DECREE_ENTERED, or system bubble-up when decreed_claim_count == claim_count"
        actor: BasinAdjudicator
        preconditions:
          - "every AdjudicationClaim on this docket has filing_status == DECREED"
        side_effects:
          - "total_decreed_af frozen"
      - from: DECREE_ENTERED
        to: CLOSED
        trigger: "POST /decree-dockets/{id}/advance-phase with target_phase == CLOSED"
        actor: BasinAdjudicator
        preconditions: []
        side_effects: ["docket becomes read-only"]

# =============================================================================
# §1.2.1 Concurrency Rules — OCC on the parent entity's `version` only
# =============================================================================
concurrency_rules:
  - rule_id: hcu-certify-stale-right
    parent_entity: WaterRight
    write_endpoint: "POST /hcu-studies/{id}/certify"
    occ_field: "expected_water_right_version"
    description: |
      Certifying an HcuStudy against a WaterRight whose version has advanced
      since the client last observed it is rejected. Certification legitimately
      supersedes whatever study was previously certified and overwrites
      WaterRight.certified_hcu_af, so a second certification is a valid product
      operation rather than an invalid state transition; the stale-version
      check is what stops a client from replacing a certification it never saw.
    error_id: ERR_STALE_RIGHT_VERSION
    http_status: 412

  - rule_id: application-submit-stale-right
    parent_entity: WaterRight
    write_endpoint: "POST /transfer-applications/{id}/submit"
    occ_field: "expected_water_right_version"
    description: |
      Submitting a TransferApplication against a WaterRight whose version has
      advanced since the client last observed it is rejected. Several
      applications may legitimately be pending on one right at once, so a
      second submit is a valid operation on identical state; the stale-version
      check is what stops a client from escrowing volume against a
      transferable_af figure that an earlier escrow has already consumed.
    error_id: ERR_STALE_RIGHT_VERSION
    http_status: 412

  - rule_id: bank-deposit-stale-account
    parent_entity: WaterBankAccount
    write_endpoint: "POST /water-bank-accounts/{id}/deposits"
    occ_field: "expected_water_bank_account_version"
    description: |
      Depositing bank credit into a WaterBankAccount whose version has advanced
      since the client last observed it is rejected. Repeated deposits are a
      legitimate product operation on identical state, so the stale-version
      check is the only thing that stops a client from committing a deposit
      decision made against a credit ledger it never saw.
    error_id: ERR_STALE_ACCOUNT_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:

  - name: hcu_transferable_volume
    trigger: >-
      On POST /water-rights/{id}/hcu-studies (study creation) and re-evaluated
      on POST /hcu-studies/{id}/certify, which copies the result into
      WaterRight.certified_hcu_af.
    algorithm: aggregation
    input_set: >-
      BeneficialUseRecord rows where water_right_id == study.water_right_id AND
      study_period_start_year <= use_year <= study_period_end_year (BOTH bounds
      inclusive) AND verification_source IN {METER, AERIAL_IMAGERY} AND
      reported_diversion_af > 0. Rows with verification_source IN {AFFIDAVIT,
      NONE} and rows with reported_diversion_af == 0 are excluded from
      quantification even though they still count for forfeiture look-back.
      Ordered by use_year ASC (the (water_right_id, use_year) uniqueness
      constraint makes the order total, so no tie-break is required).
    formula: |
      qualifying = input_set as defined above, ordered by use_year ASC
      qualifying_year_count = len(qualifying)
      if qualifying_year_count == 0:
          reject the request with ERR_INSUFFICIENT_USE_HISTORY (422)

      # STEP 1 — per-year consumptive use, each rounded to 3 dp BEFORE any summation.
      for r in qualifying:
          if study.method == DIVERSION_BASED:
              cu[r] = round(r.reported_diversion_af * DITCH_EFFICIENCY, 3)
          else:  # CIR_BASED
              cu[r] = round(r.irrigated_acres * CIR_AF_PER_ACRE, 3)

      # STEP 2 — sum the ALREADY-ROUNDED per-year values, divide, round to 3 dp.
      #          Pinned order: round-per-year-then-average.
      #          (average-then-round-once is the WRONG reading and yields
      #           different cents on the final figure.)
      average_annual_cu_af = round(sum(cu[r] for r in qualifying) / qualifying_year_count, 3)

      # STEP 3 — face-value cap.
      face_cap = round(WaterRight.authorized_diversion_af * FACE_VALUE_CAP_FACTOR, 3)
      capped = min(average_annual_cu_af, face_cap)

      # STEP 4 — short-history haircut. Strict `<`: exactly 3 qualifying years
      #          takes NO haircut, 2 qualifying years does.
      short_history_haircut_applied = (qualifying_year_count < MIN_QUALIFYING_YEARS)
      haircut = SHORT_HISTORY_HAIRCUT if short_history_haircut_applied else 1.0

      # STEP 5 — single final rounding to 2 dp.
      transferable_cu_af = round(capped * haircut, 2)
    constants:
      DITCH_EFFICIENCY: 0.65
      CIR_AF_PER_ACRE: 2.10
      FACE_VALUE_CAP_FACTOR: 0.65
      MIN_QUALIFYING_YEARS: 3
      SHORT_HISTORY_HAIRCUT: 0.85
    precision: >-
      per-year values 3 decimal places; mean 3 decimal places; face cap 3
      decimal places; final transferable_cu_af 2 decimal places;
      round_half_up at every step.
    variants:
      - name: DIVERSION_BASED
        when: "study.method == DIVERSION_BASED"
        difference: >-
          Per-year consumptive use is reported_diversion_af * 0.65 — it reads
          the metered/imaged diversion volume and discounts for ditch losses.
          Ignores irrigated_acres entirely.
      - name: CIR_BASED
        when: "study.method == CIR_BASED"
        difference: >-
          Per-year consumptive use is irrigated_acres * 2.10 — it reads the
          crop irrigation requirement of the acreage actually farmed and
          ignores reported_diversion_af entirely (beyond the > 0 admissibility
          filter). For identical records the two methods return different
          transferable_cu_af, so which one is certified changes how much volume
          the right may ever transfer.

  - name: injury_net_analysis
    trigger: >-
      On POST /transfer-applications/{id}/injury-analyses (creation), on
      POST /transfer-applications/{id}/resubmit (recomputed against the new
      requested_af), and on every NEGOTIATION-track protest resolution that
      changes offset_af. Frozen when the analysis moves DRAFT -> FINALIZED.
    algorithm: threshold
    input_set: >-
      The parent TransferApplication's requested_af, the analysis's own method
      / pod_move_miles / return_flow_credit_af, plus Protest rows on the same
      application whose status == RESOLVED_STIPULATED AND track == NEGOTIATION
      (HEARING-track resolutions contribute no offset).
    formula: |
      requested = TransferApplication.requested_af

      if method == INSTANTANEOUS_DEPLETION:
          distance_factor = max(DISTANCE_FACTOR_FLOOR,
                                round(1 - DISTANCE_DECAY_PER_MILE * pod_move_miles, 4))
          gross_depletion_af = round(requested * DEPLETION_FACTOR_INSTANT * distance_factor, 2)
      else:  # SEASONAL_AVERAGE — flat factor, pod_move_miles is IGNORED
          gross_depletion_af = round(requested * DEPLETION_FACTOR_SEASONAL, 2)

      offset_af = round(sum(p.stipulated_offset_af
                            for p in protests on this application
                            if p.status == RESOLVED_STIPULATED and p.track == NEGOTIATION), 2)

      net_injury_af = round(max(0.00,
                                gross_depletion_af - offset_af - return_flow_credit_af), 2)
    constants:
      DEPLETION_FACTOR_INSTANT: 0.92
      DEPLETION_FACTOR_SEASONAL: 0.78
      DISTANCE_DECAY_PER_MILE: 0.015
      DISTANCE_FACTOR_FLOOR: 0.55
      INJURY_MATERIALITY_AF: 0.01
    precision: >-
      distance_factor 4 decimal places; gross_depletion_af, offset_af and
      net_injury_af 2 decimal places; round_half_up. Three-input non-linear
      interaction: requested_af x depletion factor x max()-floored distance
      decay, then a max()-floored subtraction of two independent credits.
    variants:
      - name: INSTANTANEOUS_DEPLETION
        when: "analysis.method == INSTANTANEOUS_DEPLETION"
        difference: >-
          Uses the 0.92 depletion factor attenuated by a distance decay that is
          floored at 0.55, so moving the diversion far downstream materially
          reduces computed injury.
      - name: SEASONAL_AVERAGE
        when: "analysis.method == SEASONAL_AVERAGE"
        difference: >-
          Uses the flat 0.78 seasonal factor and no distance attenuation at
          all, so it can produce either a higher or a lower net injury than
          INSTANTANEOUS_DEPLETION depending on pod_move_miles — the crossover
          is at pod_move_miles = 15.22 river miles.

  - name: mitigation_fee
    trigger: >-
      When an ApprovalCondition with condition_type == MITIGATION_PAYMENT is
      created — by POST /transfer-applications/{id}/decide with disposition
      APPROVE_WITH_CONDITIONS, or by a HEARING-track
      POST /protests/{id}/resolve with condition_type == MITIGATION_PAYMENT.
    algorithm: tiered_pricing
    input_set: >-
      The single ApprovalCondition row being created; required_af is the only
      volumetric input. No other condition on the application contributes.
    formula: |
      base_fee_usd = round(required_af * BASE_RATE_USD_PER_AF, 2)

      # EVALUATION ORDER IS PINNED. The surcharge tier is selected from
      # base_fee_usd — the PRE-SURCHARGE subtotal — and NEVER from
      # total_fee_usd. The apparent circularity ("the surcharge is a
      # percentage of the fee, and the percentage depends on the fee tier")
      # is resolved in exactly this direction: tier(base_fee_usd) first,
      # surcharge second, total last.
      if base_fee_usd < TIER1_CEILING_USD:
          surcharge_pct = SURCHARGE_TIER1
      elif base_fee_usd < TIER2_CEILING_USD:
          surcharge_pct = SURCHARGE_TIER2
      else:
          surcharge_pct = SURCHARGE_TIER3

      admin_surcharge_usd = round(base_fee_usd * surcharge_pct, 2)
      total_fee_usd = round(base_fee_usd + admin_surcharge_usd, 2)
    constants:
      BASE_RATE_USD_PER_AF: 125.00
      TIER1_CEILING_USD: 5000.00
      TIER2_CEILING_USD: 20000.00
      SURCHARGE_TIER1: 0.040
      SURCHARGE_TIER2: 0.070
      SURCHARGE_TIER3: 0.095
    precision: >-
      base_fee_usd, admin_surcharge_usd and total_fee_usd 2 decimal places,
      round_half_up; surcharge_pct stored at 3 decimal places. Tier boundaries
      are half-open upward: base_fee_usd == 5000.00 lands in TIER2 (0.070),
      base_fee_usd == 20000.00 lands in TIER3 (0.095).

  - name: forfeiture_risk_score
    trigger: >-
      Recomputed on POST /water-rights/{id}/beneficial-use-records, on
      POST /water-rights/{id}/activate, on POST /water-rights/{id}/reinstate,
      on every WaterRight status change into or out of SUSPENDED, and read on
      demand by GET /water-rights/{id}/forfeiture-assessment.
    algorithm: weighted_scoring
    input_set: >-
      BeneficialUseRecord rows on this right whose use_year falls in the closed
      window [current_year - LOOKBACK_YEARS, current_year - 1], where
      current_year is the calendar year of the logical clock in UTC. The
      current calendar year is deliberately EXCLUDED (the reporting year is not
      yet complete). All verification_source values participate here, unlike
      hcu_transferable_volume.
    formula: |
      current_year = calendar year of the logical clock (UTC)
      window_years = [current_year - LOOKBACK_YEARS .. current_year - 1]   # 10 years, both ends inclusive
      records = BeneficialUseRecord rows on this right with use_year in window_years

      # A window year counts as USED when a record exists for it with
      # reported_diversion_af >= DE_MINIMIS_AF; every other window year is a
      # non-use year (including years with no record at all).
      consecutive_nonuse_years = length of the longest run of consecutive years
          in window_years that are all non-use years

      n = count(records)
      unverified_ratio = round(count(r in records
                                     if r.verification_source in {AFFIDAVIT, NONE})
                               / max(1, n), 4)
      mean_reported = round(sum(r.reported_diversion_af for r in records) / max(1, n), 3)
      utilization = min(1.0, round(mean_reported / WaterRight.authorized_diversion_af, 4))

      meter_credit = METER_CREDIT if any(r.verification_source == METER for r in records) else 0
      suspended_penalty = SUSPENDED_PENALTY if WaterRight.status == SUSPENDED else 0

      raw = consecutive_nonuse_years * NONUSE_WEIGHT
          + unverified_ratio * UNVERIFIED_WEIGHT
          + (1 - utilization) * UNDERUSE_WEIGHT
          + suspended_penalty
          - meter_credit

      forfeiture_risk_score = round(min(100, max(0, raw)), 2)
      forfeiture_risk_band = HIGH      if forfeiture_risk_score >= BAND_HIGH_MIN
                             ELEVATED  if forfeiture_risk_score >= BAND_ELEVATED_MIN
                             LOW       otherwise
      forfeiture_eligible = (consecutive_nonuse_years >= STATUTORY_FORFEITURE_YEARS)
    constants:
      LOOKBACK_YEARS: 10
      DE_MINIMIS_AF: 0.50
      NONUSE_WEIGHT: 9
      UNVERIFIED_WEIGHT: 25
      UNDERUSE_WEIGHT: 30
      SUSPENDED_PENALTY: 12
      METER_CREDIT: 10
      STATUTORY_FORFEITURE_YEARS: 5
      BAND_HIGH_MIN: 70
      BAND_ELEVATED_MIN: 40
    precision: >-
      unverified_ratio and utilization 4 decimal places; mean_reported 3
      decimal places; forfeiture_risk_score 2 decimal places clamped to
      [0, 100]; round_half_up. Band thresholds are inclusive at the bottom:
      score == 70.00 is HIGH, score == 40.00 is ELEVATED, score == 39.99 is LOW.
      Statutory forfeiture eligibility is inclusive: exactly 5 consecutive
      non-use years is eligible, 4 is not.

  - name: lease_settlement_credit
    trigger: >-
      On POST /lease-assignments/{id}/cancel (from RESERVED, ACTIVE or
      SUSPENDED), on POST /lease-assignments/{id}/complete, and on link 2 of
      the forfeiture cascade when a lease is force-cancelled.
    algorithm: chronological
    input_set: >-
      The single LeaseAssignment row plus the logical clock. Cancellation from
      RESERVED always yields used_af = 0.00 regardless of valuation_method
      because delivery never began.
    formula: |
      term_days = whole days in the half-open window [lease_start_date, lease_end_date)
      if lease.status == RESERVED at cancellation:
          used_af = 0.00
      else:
          elapsed_days = floor(whole days from lease_start_date to
                               min(logical_clock, lease_end_date));  never negative
          if valuation_method == PRO_RATA_DAILY:
              charged_days = elapsed_days
          else:  # SEASON_BLOCK — any started block is charged in full
              blocks_charged = ceil(elapsed_days / SEASON_BLOCK_DAYS)   # elapsed_days == 0 -> 0 blocks
              charged_days = min(term_days, blocks_charged * SEASON_BLOCK_DAYS)
          used_af = round(round(lease.requested_af * charged_days / term_days, 3), 2)
      settlement_credit_af = round(lease.requested_af - used_af, 2)

      # On POST /lease-assignments/{id}/complete the lease ran its full term:
      # used_af = requested_af and settlement_credit_af = 0.00 by definition.
    constants:
      SEASON_BLOCK_DAYS: 30
    precision: >-
      Two-step rounding is deliberate and pinned: the volume quotient is
      rounded to 3 decimal places first, then that value is rounded to 2
      decimal places; settlement_credit_af is a single 2-decimal subtraction.
      round_half_up throughout. Day counts are whole days, floor, on a
      half-open window.
    variants:
      - name: PRO_RATA_DAILY
        when: "lease.valuation_method == PRO_RATA_DAILY"
        difference: >-
          Charges exactly the elapsed days, so an early cancellation returns
          the unconsumed fraction of requested_af down to the day.
      - name: SEASON_BLOCK
        when: "lease.valuation_method == SEASON_BLOCK"
        difference: >-
          Rounds elapsed days UP to whole 30-day blocks before pro-rating, so
          the same cancellation instant returns strictly less credit than
          PRO_RATA_DAILY whenever elapsed_days is not an exact multiple of 30 —
          the two methods disagree on the acre-feet returned to
          WaterBankAccount.available_credit_af for identical inputs.

  - name: right_volume_ledger
    trigger: >-
      Recomputed after every mutation that touches a WaterRight's volume:
      hcu certification, application submit / resubmit / withdraw / decide,
      bank deposit, lease complete / cancel, and forfeiture declaration.
    algorithm: aggregation
    input_set: >-
      (a) TransferApplication rows on this right, partitioned by status;
      (b) accepted bank deposits sourced from this right;
      (c) LeaseAssignment rows on this right whose status IN
      {COMPLETED, CANCELLED} (their used_af is the volume actually consumed).
    formula: |
      pending_escrow = round(sum(a.requested_af for applications on this right
                                 if a.status in {SUBMITTED, PROTEST_PERIOD, UNDER_PROTEST,
                                                 REVISION_REQUESTED, READY_FOR_DECISION}), 2)
      bank_hold = round(sum(d.deposit_af for accepted deposits sourced from this right)
                        - sum(l.used_af for this right's leases
                              if l.status in {COMPLETED, CANCELLED}), 2)
      encumbered_af = round(pending_escrow + bank_hold, 2)

      transferred_away_af = round(sum(a.requested_af for applications on this right
                                      if a.status in {APPROVED, APPROVED_WITH_CONDITIONS})
                                  + sum(l.used_af for this right's leases
                                        if l.status in {COMPLETED, CANCELLED}), 2)

      transferable_af = round(certified_hcu_af - encumbered_af - transferred_away_af, 2)

      # CONSERVED QUANTITY (invariant, exact at 2 decimal places):
      #   certified_hcu_af == transferable_af + encumbered_af + transferred_away_af
      # Every forward action and its compensating action must leave this
      # identity true: submit/withdraw, submit/deny, deposit/lease-cancel.
    constants:
      LEDGER_PRECISION_DP: 2
    precision: "all four fields 2 decimal places, round_half_up; transferable_af may never be negative"

  - name: bank_credit_ledger
    trigger: >-
      Recomputed after POST /water-bank-accounts/{id}/deposits and after every
      LeaseAssignment status change (create, activate, suspend, resume,
      complete, cancel).
    algorithm: aggregation
    input_set: >-
      Accepted deposits into this account plus every LeaseAssignment row whose
      water_bank_account_id is this account, partitioned by status.
    formula: |
      committed_credit_af = round(sum(l.requested_af for this account's leases
                                      if l.status in {RESERVED, SUSPENDED}), 2)
      leased_out_af       = round(sum(l.requested_af for this account's leases
                                      if l.status == ACTIVE), 2)
      deposited_credit_af = round(sum(d.deposit_af for accepted deposits into this account)
                                  - sum(l.used_af for this account's leases
                                        if l.status in {COMPLETED, CANCELLED}), 2)
      available_credit_af = round(deposited_credit_af - committed_credit_af - leased_out_af, 2)
      suspended_lease_count = count(this account's leases with status == SUSPENDED)

      # CONSERVED QUANTITY (invariant, exact at 2 decimal places):
      #   deposited_credit_af == available_credit_af + committed_credit_af + leased_out_af
      # Lease creation (forward: available -> committed) and lease cancellation
      # from RESERVED (compensating: committed -> available) must leave this
      # identity true AND restore each individual term to its prior value.
    constants:
      LEDGER_PRECISION_DP: 2
    precision: "all four volume fields 2 decimal places, round_half_up; available_credit_af may never be negative"

  - name: bank_posture
    trigger: >-
      Recomputed on every bank_credit_ledger recomputation, on
      PATCH /claimants/{id}/standing, and on link 4 of both the
      condition-violation cascade and the fee-payment cascade.
    algorithm: threshold
    input_set: >-
      The account's own suspended_lease_count and available_credit_af plus the
      standing_status of the Claimant named by the account's claimant_id.
    formula: |
      # PRECEDENCE IS PINNED: FROZEN dominates RESTRICTED, which dominates OPEN.
      if Claimant.standing_status == BARRED or suspended_lease_count >= 1:
          posture = FROZEN
      elif Claimant.standing_status == DELINQUENT or available_credit_af < LOW_CREDIT_FLOOR_AF:
          posture = RESTRICTED
      else:
          posture = OPEN
    constants:
      LOW_CREDIT_FLOOR_AF: 5.00
    precision: >-
      Strict `<` on the credit floor: available_credit_af == 5.00 is NOT
      RESTRICTED, available_credit_af == 4.99 is. suspended_lease_count == 1
      is already FROZEN.

  - name: right_status_derivation
    trigger: >-
      Evaluated after every mutation of a WaterRight's ledger fields or
      lifecycle: activate, reinstate, hcu certify, application submit /
      resubmit / withdraw / decide, bank deposit, lease complete / cancel.
    algorithm: constraint_propagation
    input_set: "The WaterRight's own current status plus its recomputed ledger fields."
    formula: |
      # PRECEDENCE IS PINNED, evaluated top to bottom; the first match wins.
      if current status == FORFEITED:                  status = FORFEITED      # sticky terminal
      elif current status == SUSPENDED:                status = SUSPENDED      # only /reinstate leaves it
      elif the right has never been activated:         status = UNADJUDICATED
      elif transferred_away_af > 0.00:                 status = PARTIALLY_TRANSFERRED
      elif encumbered_af > 0.00:                       status = ENCUMBERED
      else:                                            status = ACTIVE
    constants: {}
    precision: >-
      Strict `> 0.00` on both ledger tests. PARTIALLY_TRANSFERRED outranks
      ENCUMBERED, so a right holding both a completed transfer and a fresh
      escrow reads PARTIALLY_TRANSFERRED, not ENCUMBERED.

  - name: pod_concurrent_rate_load
    trigger: "On POST /lease-assignments, before the lease row is persisted."
    algorithm: interval_merge
    input_set: >-
      LeaseAssignment rows whose point_of_diversion_id equals the candidate's
      and whose status IN {RESERVED, ACTIVE, SUSPENDED}. Rows with status IN
      {COMPLETED, CANCELLED} are excluded.
    formula: |
      W_start = candidate.lease_start_date
      W_end   = candidate.lease_end_date

      # HALF-OPEN interval semantics [start, end): two windows overlap only
      # when they share a positive-length intersection. Touching endpoints
      # (E.lease_end_date == W_start, or W_end == E.lease_start_date) do NOT
      # overlap, so back-to-back leases at one headgate are always allowed.
      overlapping = [E in input_set
                     if E.lease_start_date < W_end and E.lease_end_date > W_start]

      # Conservative aggregate: the candidate's rate plus the rates of EVERY
      # overlapping window, not the per-instant maximum.
      peak_aggregate_rate_cfs = round(candidate.diversion_rate_cfs
                                      + sum(E.diversion_rate_cfs for E in overlapping), 3)

      # Aggregate capacity gate — equality is ALLOWED.
      reject with ERR_POD_CAPACITY_EXCEEDED when
          peak_aggregate_rate_cfs > PointOfDiversion.max_rate_cfs
    constants: {}
    precision: >-
      Rates summed at 3 decimal places, round_half_up. Gate is strict `>`:
      peak_aggregate_rate_cfs exactly equal to max_rate_cfs is accepted.

  - name: right_lease_exclusion_window
    trigger: "On POST /lease-assignments, before the lease row is persisted."
    algorithm: interval_merge
    input_set: >-
      LeaseAssignment rows whose water_right_id equals the candidate's, whose
      point_of_diversion_id DIFFERS from the candidate's, and whose status IN
      {RESERVED, ACTIVE, SUSPENDED}. Rows with status IN {COMPLETED, CANCELLED}
      are excluded, and so are rows at the SAME headgate as the candidate —
      those are governed exclusively by calculations.pod_concurrent_rate_load.
      The two rules therefore partition the space of same-right lease pairs:
      same headgate -> half-open rate aggregation, different headgate -> closed
      buffered exclusivity. A right's water may be delivered at only one
      headgate at a time, and re-plumbing delivery to a different headgate
      requires a fallow gap.
    formula: |
      # CLOSED interval WITH BUFFER semantics — deliberately different geometry
      # from pod_concurrent_rate_load, and applied to a disjoint population
      # (same right, DIFFERENT point of diversion). Each existing lease at
      # another headgate of the same water right projects a fallow exclusion
      # window:
      for E in input_set:
          E_excl_start = E.lease_start_date - FALLOW_BUFFER_DAYS days
          E_excl_end   = E.lease_end_date   + FALLOW_BUFFER_DAYS days
          # CLOSED collision test: touching endpoints DO collide.
          if candidate.lease_start_date <= E_excl_end
             and candidate.lease_end_date >= E_excl_start:
              reject with ERR_LEASE_WINDOW_CONFLICT
      # A water right may therefore carry only ONE delivery point per window,
      # and moving delivery to another headgate needs at least a 7-day fallow
      # gap — whereas the same two windows at ONE point of diversion are
      # perfectly legal, even fully overlapping, if their aggregate rate fits
      # the headgate capacity.
    constants:
      FALLOW_BUFFER_DAYS: 7
    precision: >-
      Whole-day buffer arithmetic in UTC. Closed-interval comparison with `<=`
      / `>=`: a candidate starting exactly FALLOW_BUFFER_DAYS after an existing
      lease's end instant still collides, and a 7-day-and-1-second gap is the
      smallest accepted separation.

  - name: decreed_volume
    trigger: "On POST /adjudication-claims/{id}/decree."
    algorithm: waterfall_allocation
    input_set: >-
      The claim's own claimed_af, examiner_recommended_af and objection_count,
      plus the priority_date of the WaterRight named by water_right_id.
    formula: |
      # EVALUATION ORDER IS PINNED: floor first, then the objection haircut,
      # then the priority-mismatch haircut, then one final 2-dp rounding.
      base = min(claim.claimed_af, claim.examiner_recommended_af)

      if claim.objection_count >= 1:
          base = round(base * OBJECTION_HAIRCUT, 3)

      if abs(claim.claimed_priority_date - WaterRight.priority_date)
             > PRIORITY_TOLERANCE_DAYS days:
          base = round(base * PRIORITY_MISMATCH_HAIRCUT, 3)

      decreed_af = round(base, 2)

      # priority_rank: over the docket's claims with filing_status == DECREED,
      # ordered by claimed_priority_date ASC, tie-broken by created_at ASC
      # (never by id), assigned 1..N.
    constants:
      OBJECTION_HAIRCUT: 0.90
      PRIORITY_MISMATCH_HAIRCUT: 0.90
      PRIORITY_TOLERANCE_DAYS: 366
    precision: >-
      Intermediate haircuts rounded to 3 decimal places, final decreed_af to 2
      decimal places, round_half_up. Tolerance gate is strict `>`: a 366-day
      discrepancy is within tolerance, 367 days is not.

# =============================================================================
# §1.4 Validation Rules Table — evaluated in strict ascending priority order.
# The FIRST violated rule wins and its error_id is returned; no later rule is
# evaluated. Dual-failure scenarios are therefore fully determined.
# =============================================================================
validations:

  - priority: 1
    category: auth
    check: >-
      X-User-Role and X-User-ID headers are both present and non-blank, and
      X-User-Role is one of the five roles declared in §1.7.
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all

  - priority: 2
    category: auth
    check: "The role in X-User-Role appears in the called endpoint's `roles:` list."
    error_id: ERR_ROLE_NOT_PERMITTED
    http_status: 403
    applies_to: all

  - priority: 3
    category: existence
    check: >-
      Every resource named by a path parameter exists, validated left to right:
      /water-rights/{id} before its /beneficial-use-records sub-path, etc. The
      error_id is the one belonging to the leftmost missing resource.
    error_id: ERR_WATER_RIGHT_NOT_FOUND
    http_status: 404
    applies_to: "all endpoints carrying a path parameter"

  - priority: 4
    category: existence
    check: >-
      A nested sub-resource path parameter resolves to a row whose parent FK
      equals the parent path parameter (e.g. an HcuStudy id under a right that
      does not own it is treated as missing).
    error_id: ERR_HCU_STUDY_NOT_FOUND
    http_status: 404
    applies_to: "POST /hcu-studies/{id}/certify, POST /approval-conditions/{id}/*, POST /adjudication-claims/{id}/*"

  - priority: 5
    category: auth
    check: >-
      When X-User-Role == Claimant, X-User-ID equals the owning Claimant id of
      the target resource — WaterRight.claimant_id for right, application and
      condition operations; WaterBankAccount.claimant_id for account and lease
      operations; Protest.protestant_claimant_id for protest filing and
      withdrawal; WaterRight.claimant_id of the claimed right for adjudication
      claim filing. Objections are deliberately outside this rule: an objector
      must NOT own the objected claim (see priority 40).
    error_id: ERR_NOT_RESOURCE_OWNER
    http_status: 403
    applies_to: "every Claimant-authored endpoint"

  - priority: 6
    category: business_constraint
    check: >-
      Request body is well formed: every required field present, every field of
      the declared type, every enum value a declared member, every acre-foot /
      rate / fee amount > 0 or >= 0 as the field constraint states, `limit` in
      [1, 100] and `offset` >= 0 on list endpoints.
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: all

  - priority: 7
    category: existence
    check: >-
      Every foreign key supplied in the request body resolves to an existing
      row (claimant_id, water_right_id, hcu_study_id,
      proposed_point_of_diversion_id, point_of_diversion_id,
      water_bank_account_id, decree_docket_id, transfer_application_id,
      protestant_claimant_id).
    error_id: ERR_CLAIMANT_NOT_FOUND
    http_status: 404
    applies_to: "all POST endpoints carrying body foreign keys"

  - priority: 8
    category: business_referential
    check: >-
      Application scope coherence: proposed_point_of_diversion_id is present
      exactly when application_type IN {POINT_OF_DIVERSION_CHANGE, COMBINED};
      proposed_purpose_of_use is present exactly when application_type IN
      {CHANGE_OF_USE, COMBINED}; proposed_place_of_use_acres is present exactly
      when application_type IN {PLACE_OF_USE_CHANGE, COMBINED}.
    error_id: ERR_APPLICATION_SCOPE_INCOMPLETE
    http_status: 422
    applies_to: "POST /transfer-applications"

  - priority: 9
    category: business_referential
    check: >-
      HcuStudy.water_right_id equals the application's water_right_id, and
      proposed_point_of_diversion_id (when present) belongs to that same right.
    error_id: ERR_STUDY_RIGHT_MISMATCH
    http_status: 422
    applies_to: "POST /transfer-applications"

  - priority: 10
    category: business_referential
    check: >-
      PointOfDiversion.water_right_id equals the lease's water_right_id, and
      WaterBankAccount.claimant_id equals WaterRight.claimant_id.
    error_id: ERR_POD_RIGHT_MISMATCH
    http_status: 422
    applies_to: "POST /lease-assignments"

  - priority: 11
    category: business_constraint
    check: "WaterRight.right_number is unique across all rights."
    error_id: ERR_DUPLICATE_RIGHT_NUMBER
    http_status: 409
    applies_to: "POST /water-rights"

  - priority: 12
    category: business_constraint
    check: "DecreeDocket.docket_number is unique across all dockets."
    error_id: ERR_DUPLICATE_DOCKET_NUMBER
    http_status: 409
    applies_to: "POST /decree-dockets"

  - priority: 13
    category: business_constraint
    check: "(water_right_id, use_year) is unique across BeneficialUseRecord rows."
    error_id: ERR_DUPLICATE_USE_YEAR
    http_status: 409
    applies_to: "POST /water-rights/{id}/beneficial-use-records"

  - priority: 14
    category: business_constraint
    check: >-
      Only one AdjudicationClaim may exist per (decree_docket_id,
      water_right_id) pair.
    error_id: ERR_DUPLICATE_CLAIM
    http_status: 409
    applies_to: "POST /adjudication-claims"

  - priority: 15
    category: state
    check: >-
      The supplied expected_water_right_version equals the current
      WaterRight.version (concurrency_rules[hcu-certify-stale-right],
      concurrency_rules[application-submit-stale-right]).
    error_id: ERR_STALE_RIGHT_VERSION
    http_status: 412
    applies_to: "POST /hcu-studies/{id}/certify, POST /transfer-applications/{id}/submit, POST /transfer-applications/{id}/resubmit"

  - priority: 16
    category: state
    check: >-
      The supplied expected_water_bank_account_version equals the current
      WaterBankAccount.version (concurrency_rules[bank-deposit-stale-account]).
    error_id: ERR_STALE_ACCOUNT_VERSION
    http_status: 412
    applies_to: "POST /water-bank-accounts/{id}/deposits"

  - priority: 17
    category: state
    check: >-
      The target resource's current state is a declared `from:` state for the
      requested transition in §1.2 (including the parallel-dimension machines:
      ApprovalCondition.status, ApprovalCondition.payment_status,
      AdjudicationClaim.filing_status, AdjudicationClaim.verification_status).
      For application submit and resubmit this also covers the relied-upon
      HcuStudy, whose status MUST be CERTIFIED — a DRAFT or SUPERSEDED study
      cannot support a submission.
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "every state-transition endpoint"

  - priority: 18
    category: state
    check: >-
      Cross-entity gate: the WaterRight backing the operation is in an allowed
      status — {ACTIVE, ENCUMBERED, PARTIALLY_TRANSFERRED} for application
      submit/resubmit, bank deposit and lease creation; additionally SUSPENDED
      is allowed for HcuStudy certification; FORFEITED is never allowed.
    error_id: ERR_RIGHT_NOT_TRANSFERABLE
    http_status: 409
    applies_to: "POST /transfer-applications/{id}/submit, POST /transfer-applications/{id}/resubmit, POST /hcu-studies/{id}/certify, POST /water-bank-accounts/{id}/deposits, POST /lease-assignments"

  - priority: 19
    category: state
    check: >-
      Cross-entity gate: DecreeDocket.phase equals the phase the claim
      operation requires — OPEN_FOR_CLAIMS to file, EXAMINATION to examine,
      OBJECTION_PERIOD to object or decree.
    error_id: ERR_DOCKET_PHASE_INVALID
    http_status: 409
    applies_to: "POST /adjudication-claims, POST /adjudication-claims/{id}/examine, POST /adjudication-claims/{id}/object, POST /adjudication-claims/{id}/decree"

  - priority: 20
    category: state
    check: >-
      Parallel-dimension gate: AdjudicationClaim.verification_status ==
      FIELD_VERIFIED before the filing dimension may reach DECREED.
    error_id: ERR_CLAIM_NOT_VERIFIED
    http_status: 409
    applies_to: "POST /adjudication-claims/{id}/decree"

  - priority: 21
    category: state
    check: >-
      Parallel-dimension gate: ApprovalCondition.payment_status IN
      {NOT_APPLICABLE, PAID} before the compliance dimension may reach
      SATISFIED.
    error_id: ERR_CONDITION_FEE_OUTSTANDING
    http_status: 409
    applies_to: "POST /approval-conditions/{id}/satisfy"

  - priority: 22
    category: state
    check: >-
      Cross-entity gate: WaterBankAccount.posture == OPEN before a lease may be
      activated. RESTRICTED and FROZEN both block activation.
    error_id: ERR_ACCOUNT_POSTURE_BLOCKED
    http_status: 409
    applies_to: "POST /lease-assignments/{id}/activate"

  - priority: 23
    category: business_safety
    check: >-
      Segregation of duties: the X-User-ID issuing a disposition differs from
      HcuStudy.certified_by_user_id of the application's study AND from
      Protest.resolved_by_user_id of every protest on the application.
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /transfer-applications/{id}/decide"

  - priority: 24
    category: business_safety
    check: >-
      Claimant.standing_status == IN_GOOD_STANDING for application
      submit/resubmit and lease creation; standing_status != BARRED for fee
      payment and protest filing.
    error_id: ERR_CLAIMANT_NOT_IN_GOOD_STANDING
    http_status: 403
    applies_to: "POST /transfer-applications/{id}/submit, POST /transfer-applications/{id}/resubmit, POST /lease-assignments, POST /approval-conditions/{id}/pay, POST /protests"

  - priority: 25
    category: business_safety
    check: >-
      The application's DRAFT/FINALIZED InjuryAnalysis exists before the
      application may be published or decided; an application with no analysis
      cannot enter the protest period.
    error_id: ERR_INJURY_ANALYSIS_MISSING
    http_status: 422
    applies_to: "POST /transfer-applications/{id}/publish, POST /transfer-applications/{id}/decide"

  - priority: 26
    category: business_safety
    check: >-
      Unconditional approval requires net_injury_af < INJURY_MATERIALITY_AF
      (0.01) on the FINALIZED InjuryAnalysis. A net injury of exactly 0.01
      blocks disposition APPROVE.
    error_id: ERR_UNMITIGATED_INJURY
    http_status: 422
    applies_to: "POST /transfer-applications/{id}/decide with disposition == APPROVE"

  - priority: 27
    category: business_safety
    check: >-
      Conditional approval requires a non-empty conditions array whose summed
      required_af over condition_type IN {MITIGATION_PAYMENT,
      DRY_YEAR_FORBEARANCE} is >= net_injury_af of the FINALIZED
      InjuryAnalysis. Equality is sufficient.
    error_id: ERR_MITIGATION_INSUFFICIENT
    http_status: 422
    applies_to: "POST /transfer-applications/{id}/decide with disposition == APPROVE_WITH_CONDITIONS"

  - priority: 28
    category: business_safety
    check: >-
      An HcuStudy must have at least one admissible BeneficialUseRecord in its
      study period (qualifying_year_count >= 1) — an empty qualifying set is
      rejected rather than quantified as zero.
    error_id: ERR_INSUFFICIENT_USE_HISTORY
    http_status: 422
    applies_to: "POST /water-rights/{id}/hcu-studies"

  - priority: 29
    category: business_safety
    check: >-
      Activation requires at least one BeneficialUseRecord on the right with
      verification_source IN {METER, AERIAL_IMAGERY}; affidavit-only evidence
      cannot perfect a right.
    error_id: ERR_NO_VERIFIED_USE_EVIDENCE
    http_status: 422
    applies_to: "POST /water-rights/{id}/activate, POST /adjudication-claims/{id}/verify with verification_outcome == FIELD_VERIFIED"

  - priority: 30
    category: business_safety
    check: >-
      Forfeiture declaration requires consecutive_nonuse_years >=
      STATUTORY_FORFEITURE_YEARS (5). Exactly 5 is eligible; 4 is not.
    error_id: ERR_FORFEITURE_NOT_ELIGIBLE
    http_status: 422
    applies_to: "POST /water-rights/{id}/declare-forfeiture"

  - priority: 31
    category: business_safety
    check: >-
      Reinstatement requires that no ApprovalCondition on any of the right's
      applications is still VIOLATED, and consecutive_nonuse_years < 5.
    error_id: ERR_VIOLATION_UNRESOLVED
    http_status: 409
    applies_to: "POST /water-rights/{id}/reinstate"

  - priority: 32
    category: business_temporal
    check: >-
      A protest may only be filed while the logical clock is strictly before
      TransferApplication.protest_deadline. Filing at exactly the deadline
      instant is late.
    error_id: ERR_PROTEST_WINDOW_CLOSED
    http_status: 422
    applies_to: "POST /protests"

  - priority: 33
    category: business_temporal
    check: >-
      An AdjudicationClaim may only be filed while the logical clock is
      strictly before DecreeDocket.claim_filing_deadline. Filing at exactly the
      deadline instant is late.
    error_id: ERR_CLAIM_FILING_CLOSED
    http_status: 422
    applies_to: "POST /adjudication-claims"

  - priority: 34
    category: business_temporal
    check: >-
      An action taken too early against a still-open window is rejected:
      close-protest-period requires the logical clock >= protest_deadline;
      advance-phase to EXAMINATION requires the logical clock >=
      claim_filing_deadline; violate requires the logical clock >=
      compliance_due_date whenever compliance_due_date is non-null.
    error_id: ERR_WINDOW_STILL_OPEN
    http_status: 409
    applies_to: "POST /transfer-applications/{id}/close-protest-period, POST /decree-dockets/{id}/advance-phase, POST /approval-conditions/{id}/violate"

  - priority: 35
    category: business_temporal
    check: >-
      Lease activation and lease resumption both require lease_start_date <=
      logical clock < lease_end_date; lease completion requires the logical clock
      >= lease_end_date; lease cancellation from ACTIVE requires the logical
      clock < lease_end_date.
    error_id: ERR_LEASE_WINDOW_TIMING
    http_status: 422
    applies_to: "POST /lease-assignments/{id}/activate, POST /lease-assignments/{id}/resume, POST /lease-assignments/{id}/complete, POST /lease-assignments/{id}/cancel"

  - priority: 36
    category: business_temporal
    check: >-
      lease_end_date is strictly greater than lease_start_date, and
      study_period_end_year >= study_period_start_year.
    error_id: ERR_INVALID_WINDOW
    http_status: 422
    applies_to: "POST /lease-assignments, POST /water-rights/{id}/hcu-studies"

  - priority: 37
    category: business_constraint
    check: >-
      Revision cap: request-revision and resubmit both require
      revision_round < REVISION_ROUND_CAP (2).
    error_id: ERR_REVISION_LIMIT_REACHED
    http_status: 409
    applies_to: "POST /transfer-applications/{id}/request-revision, POST /transfer-applications/{id}/resubmit"

  - priority: 38
    category: business_constraint
    check: >-
      Protest self-filing: protestant_claimant_id differs from the
      WaterRight.claimant_id of the protested application.
    error_id: ERR_SELF_PROTEST_FORBIDDEN
    http_status: 422
    applies_to: "POST /protests"

  - priority: 39
    category: business_constraint
    check: >-
      One protest per protestant per application: no existing Protest on the
      application shares the same protestant_claimant_id, regardless of that
      protest's status.
    error_id: ERR_DUPLICATE_PROTEST
    http_status: 409
    applies_to: "POST /protests"

  - priority: 40
    category: business_constraint
    check: >-
      Objection identity: the objecting X-User-ID differs from the
      WaterRight.claimant_id of the claim's own right (a claimant cannot object
      to their own claim).
    error_id: ERR_SELF_OBJECTION_FORBIDDEN
    http_status: 422
    applies_to: "POST /adjudication-claims/{id}/object"

  - priority: 41
    category: business_constraint
    check: >-
      Same-right, different-headgate lease exclusivity — see
      calculations.right_lease_exclusion_window. CLOSED interval with a 7-day
      fallow buffer on both sides of every non-terminal lease that sits on the
      same water_right_id but a DIFFERENT point_of_diversion_id; touching
      endpoints collide. Leases at the same headgate are exempt from this rule
      and fall to priority 42 instead.
    error_id: ERR_LEASE_WINDOW_CONFLICT
    http_status: 409
    applies_to: "POST /lease-assignments"

  - priority: 42
    category: business_constraint
    check: >-
      Point-of-diversion aggregate capacity — see
      calculations.pod_concurrent_rate_load. HALF-OPEN interval overlap
      (touching endpoints do NOT collide) and the summed diversion_rate_cfs of
      the candidate plus every overlapping non-terminal lease must be <=
      PointOfDiversion.max_rate_cfs; equality is accepted.
    error_id: ERR_POD_CAPACITY_EXCEEDED
    http_status: 409
    applies_to: "POST /lease-assignments"

  - priority: 43
    category: business_constraint
    check: >-
      A lease's PointOfDiversion.status must be AUTHORIZED — PROPOSED and
      RETIRED headgates cannot take new leases.
    error_id: ERR_POD_NOT_AUTHORIZED
    http_status: 409
    applies_to: "POST /lease-assignments"

  - priority: 44
    category: business_constraint
    check: "WaterRight.bank_enrolled == true before any volume may be deposited."
    error_id: ERR_RIGHT_NOT_BANK_ENROLLED
    http_status: 422
    applies_to: "POST /water-bank-accounts/{id}/deposits"

  - priority: 45
    category: business_fiscal
    check: >-
      Transferable-volume budget, evaluated against the ledger as it stands at
      the moment of the call. Equality is accepted in every variant:
      submit requires requested_af <= WaterRight.transferable_af;
      resubmit requires the NEW requested_af <= WaterRight.transferable_af +
      TransferApplication.escrowed_af (the existing escrow is swapped, not
      double-counted);
      bank deposit requires deposit_af <= WaterRight.transferable_af.
    error_id: ERR_TRANSFERABLE_VOLUME_EXCEEDED
    http_status: 422
    applies_to: "POST /transfer-applications/{id}/submit, POST /transfer-applications/{id}/resubmit, POST /water-bank-accounts/{id}/deposits"

  - priority: 46
    category: business_fiscal
    check: >-
      Bank credit budget: LeaseAssignment.requested_af <=
      WaterBankAccount.available_credit_af at creation. Equality is accepted.
    error_id: ERR_INSUFFICIENT_BANK_CREDIT
    http_status: 422
    applies_to: "POST /lease-assignments"

  - priority: 47
    category: business_fiscal
    check: >-
      Examiner recommendation bound: examiner_recommended_af > 0 and <=
      claimed_af.
    error_id: ERR_RECOMMENDATION_EXCEEDS_CLAIM
    http_status: 422
    applies_to: "POST /adjudication-claims/{id}/examine"

  - priority: 48
    category: business_fiscal
    check: >-
      Stipulated offset bound: stipulated_offset_af > 0 and <=
      Protest.claimed_injury_af on the NEGOTIATION track.
    error_id: ERR_OFFSET_EXCEEDS_CLAIM
    http_status: 422
    applies_to: "POST /protests/{id}/resolve"

  - priority: 49
    category: business_referential
    check: >-
      Docket phase advance satisfies the compound child gate for the requested
      target_phase, evaluated over the docket's AdjudicationClaim rows:
      EXAMINATION requires claim_count >= 1; OBJECTION_PERIOD requires every
      claim to have left FILED (filing_status IN {EXAMINED, OBJECTED, DECREED});
      DECREE_ENTERED requires every claim to be DECREED; CLOSED requires phase
      DECREE_ENTERED and imposes no further child gate. A docket with zero claims
      can never leave OPEN_FOR_CLAIMS.
    error_id: ERR_DOCKET_CHILDREN_NOT_READY
    http_status: 422
    applies_to: "POST /decree-dockets/{id}/advance-phase"

# =============================================================================
# §1.5 API Endpoints
# Every path placeholder is literally `{id}` and names the immediately
# preceding collection segment's resource. Every mutating endpoint bumps the
# mutated row's `version` (except append-only BeneficialUseRecord, which has no
# version field).
# =============================================================================
endpoints:

  # ---- logical clock -------------------------------------------------------
  - method: POST
    path: /_clock/set_current_utc
    description: >-
      Sets the service's logical current UTC instant, which is the ONLY time
      source for every temporal validation and calculation in this service.
      Wall-clock time is never read. At service startup the logical clock is
      mandatorily initialised to 2026-08-01T00:00:00Z, so a service that has
      never received this call behaves as if the current instant were
      2026-08-01T00:00:00Z. The clock may be moved forward or backward freely.
    roles: [WaterRightsAnalyst, HearingOfficer, DecisionAuthority, BasinAdjudicator, Claimant]
    code: 200
    input: ["current_utc"]
    output:
      current_utc: "string (the instant now in effect)"
    side_effects:
      - "Replaces the logical clock value. No entity rows are touched and no version is bumped."
    errors: [ERR_UNAUTHENTICATED, ERR_INVALID_REQUEST]

  # ---- claimants -----------------------------------------------------------
  - method: POST
    path: /claimants
    description: "Registers a water-rights claimant (the party of record for rights, applications, protests and bank accounts)."
    roles: [WaterRightsAnalyst, BasinAdjudicator]
    code: 201
    input: ["legal_name", "contact_email", "entity_type"]
    output: Claimant
    side_effects:
      - "Creates a Claimant with standing_status = IN_GOOD_STANDING, outstanding_fee_balance_usd = 0.00 and open_application_count = 0."
    errors: [ERR_UNAUTHENTICATED, ERR_ROLE_NOT_PERMITTED, ERR_INVALID_REQUEST]

  - method: GET
    path: /claimants/{id}
    description: "Returns one claimant with its derived standing and fee balance."
    roles: [WaterRightsAnalyst, HearingOfficer, DecisionAuthority, BasinAdjudicator, Claimant]
    code: 200
    input: []
    output: Claimant
    side_effects: []
    errors: [ERR_UNAUTHENTICATED, ERR_ROLE_NOT_PERMITTED, ERR_CLAIMANT_NOT_FOUND, ERR_NOT_RESOURCE_OWNER]

  - method: PATCH
    path: /claimants/{id}/standing
    description: >-
      Administratively sets claimant standing. BARRED is an administrative
      sanction that blocks protest filing and fee payment; DELINQUENT is
      normally reached automatically when a mitigation fee falls due and is
      cleared automatically by the fee-payment cascade.
    roles: [BasinAdjudicator]
    code: 200
    input: ["standing_status"]
    output: Claimant
    side_effects:
      - "Sets Claimant.standing_status and bumps Claimant.version."
      - "Recomputes calculations.bank_posture for every WaterBankAccount of this claimant."
    errors: [ERR_UNAUTHENTICATED, ERR_ROLE_NOT_PERMITTED, ERR_CLAIMANT_NOT_FOUND, ERR_INVALID_REQUEST]

  # ---- water rights --------------------------------------------------------
  - method: POST
    path: /water-rights
    description: >-
      Documents a water right with its priority date and face-value volume. The
      right starts in UNADJUDICATED with a fully zeroed volume ledger
      (certified_hcu_af = 0.00), so nothing is transferable until an HcuStudy is
      certified.
    roles: [WaterRightsAnalyst, BasinAdjudicator]
    code: 201
    input: ["claimant_id", "right_number", "priority_date", "source_stream_code", "purpose_of_use", "place_of_use_acres", "authorized_diversion_af", "authorized_rate_cfs", "bank_enrolled?"]
    output: WaterRight
    side_effects:
      - "Creates a WaterRight in status UNADJUDICATED with the volume ledger zeroed, satisfying calculations.right_volume_ledger trivially."
      - "Runs calculations.forfeiture_risk_score and stores forfeiture_risk_score / forfeiture_risk_band."
    errors: [ERR_UNAUTHENTICATED, ERR_ROLE_NOT_PERMITTED, ERR_INVALID_REQUEST, ERR_CLAIMANT_NOT_FOUND, ERR_DUPLICATE_RIGHT_NUMBER]

  - method: GET
    path: /water-rights
    description: >-
      Lists water rights, newest first. Ordering is `created_at DESC, id ASC`
      where id is used only as a display-stability tie-break and never as a
      business discriminator.
    roles: [WaterRightsAnalyst, HearingOfficer, DecisionAuthority, BasinAdjudicator, Claimant]
    code: 200
    input: ["claimant_id?", "status?", "forfeiture_risk_band?", "limit?", "offset?"]
    output: WaterRight[]
    side_effects: []
    errors: [ERR_UNAUTHENTICATED, ERR_ROLE_NOT_PERMITTED, ERR_INVALID_REQUEST]

  - method: GET
    path: /water-rights/{id}
    description: "Returns one water right including its full four-bucket volume ledger and forfeiture risk."
    roles: [WaterRightsAnalyst, HearingOfficer, DecisionAuthority, BasinAdjudicator, Claimant]
    code: 200
    input: []
    output: WaterRight
    side_effects: []
    errors: [ERR_UNAUTHENTICATED, ERR_ROLE_NOT_PERMITTED, ERR_WATER_RIGHT_NOT_FOUND, ERR_NOT_RESOURCE_OWNER]

  - method: POST
    path: /water-rights/{id}/activate
    description: >-
      Perfects an UNADJUDICATED right into ACTIVE once verified beneficial-use
      evidence exists. Requires at least one BeneficialUseRecord whose
      verification_source is METER or AERIAL_IMAGERY.
    roles: [WaterRightsAnalyst, BasinAdjudicator]
    code: 200
    input: []
    output: WaterRight
    side_effects:
      - "WaterRight.status UNADJUDICATED -> ACTIVE; bumps WaterRight.version."
      - "Every PointOfDiversion on this right whose status == PROPOSED moves to AUTHORIZED and its version is bumped."
      - "Re-runs calculations.forfeiture_risk_score, refreshing forfeiture_risk_score, forfeiture_risk_band and consecutive_nonuse_years."
    errors: [ERR_UNAUTHENTICATED, ERR_ROLE_NOT_PERMITTED, ERR_WATER_RIGHT_NOT_FOUND, ERR_INVALID_STATE, ERR_NO_VERIFIED_USE_EVIDENCE]

  - method: POST
    path: /water-rights/{id}/reinstate
    description: >-
      Returns a SUSPENDED right to service. Blocked while any ApprovalCondition
      on any of the right's applications is VIOLATED, and blocked when the right
      has already accrued 5 consecutive non-use years. Leases suspended by the
      condition-violation cascade are deliberately NOT auto-resumed — each needs
      its own POST /lease-assignments/{id}/resume.
    roles: [WaterRightsAnalyst, BasinAdjudicator]
    code: 200
    input: ["reinstatement_note"]
    output: WaterRight
    side_effects:
      - "WaterRight.status SUSPENDED -> the status chosen by calculations.right_status_derivation (ACTIVE, ENCUMBERED or PARTIALLY_TRANSFERRED); bumps WaterRight.version."
      - "Re-runs calculations.forfeiture_risk_score (SUSPENDED_PENALTY drops out)."
      - "No LeaseAssignment and no WaterBankAccount row is touched: lease resumption is a separate operator decision."
    errors: [ERR_UNAUTHENTICATED, ERR_ROLE_NOT_PERMITTED, ERR_WATER_RIGHT_NOT_FOUND, ERR_INVALID_REQUEST, ERR_INVALID_STATE, ERR_VIOLATION_UNRESOLVED]

  - method: POST
    path: /water-rights/{id}/declare-forfeiture
    description: >-
      Declares statutory abandonment/forfeiture of a right after 5 or more
      consecutive non-use years, triggering the depth-3 forfeiture cascade.
      FORFEITED is terminal and sticky.
    roles: [WaterRightsAnalyst, BasinAdjudicator]
    code: 200
    input: ["finding_note"]
    output: WaterRight
    side_effects:
      - "WaterRight.status -> FORFEITED and all four ledger buckets (certified_hcu_af, encumbered_af, transferred_away_af, transferable_af) are set to 0.00; a FORFEITED right is exempt from the calculations.right_volume_ledger aggregation and satisfies its identity trivially (0.00 == 0.00 + 0.00 + 0.00); bumps WaterRight.version."
      - "Cascade link 2: every non-terminal TransferApplication on this right moves to DENIED, releasing its escrowed_af (escrowed_af -> 0.00) and decrementing WaterRight.pending_review_count; every non-terminal LeaseAssignment on this right moves to CANCELLED, settling calculations.lease_settlement_credit and returning unused credit to WaterBankAccount.available_credit_af."
      - "Cascade link 3: every IMPOSED ApprovalCondition belonging to those applications moves to RELEASED, and every OUTSTANDING payment_status moves to REVERSED, decreasing Claimant.outstanding_fee_balance_usd by each reversed total_fee_usd; when that balance reaches exactly 0.00 and standing_status == DELINQUENT, standing_status returns to IN_GOOD_STANDING, exactly as it does after a payment."
      - "Every affected WaterBankAccount re-runs calculations.bank_credit_ledger and calculations.bank_posture."
    errors: [ERR_UNAUTHENTICATED, ERR_ROLE_NOT_PERMITTED, ERR_WATER_RIGHT_NOT_FOUND, ERR_INVALID_REQUEST, ERR_INVALID_STATE, ERR_FORFEITURE_NOT_ELIGIBLE]

  - method: GET
    path: /water-rights/{id}/forfeiture-assessment
    description: >-
      Returns the full component breakdown of calculations.forfeiture_risk_score
      for the right as of the logical clock, including the statutory
      forfeiture-eligibility flag.
    roles: [WaterRightsAnalyst, HearingOfficer, DecisionAuthority, BasinAdjudicator, Claimant]
    code: 200
    input: []
    output:
      water_right_id: "string"
      lookback_start_year: "integer"
      lookback_end_year: "integer (the year BEFORE the logical clock's calendar year)"
      nonuse_year_count: "integer"
      consecutive_nonuse_years: "integer"
      unverified_component: "number (unverified_ratio * 25, 2 dp)"
      underuse_component: "number ((1 - utilization) * 30, 2 dp)"
      nonuse_component: "integer (consecutive_nonuse_years * 9)"
      suspended_penalty: "integer (0 or 12)"
      meter_credit: "integer (0 or 10)"
      forfeiture_risk_score: "number (0.00..100.00, 2 dp)"
      forfeiture_risk_band: "string (LOW|ELEVATED|HIGH)"
      forfeiture_eligible: "boolean (consecutive_nonuse_years >= 5)"
    side_effects: []
    errors: [ERR_UNAUTHENTICATED, ERR_ROLE_NOT_PERMITTED, ERR_WATER_RIGHT_NOT_FOUND, ERR_NOT_RESOURCE_OWNER]

  # ---- beneficial-use records (append-only evidence ledger) ---------------
  - method: POST
    path: /water-rights/{id}/beneficial-use-records
    description: >-
      Appends one annual beneficial-use record. Records are immutable evidence:
      there is no PATCH or DELETE, and (water_right_id, use_year) is unique.
      Appending re-derives the right's forfeiture risk.
    roles: [WaterRightsAnalyst, BasinAdjudicator, Claimant]
    code: 201
    input: ["use_year", "reported_diversion_af", "irrigated_acres", "verification_source"]
    output: BeneficialUseRecord
    side_effects:
      - "Creates an immutable BeneficialUseRecord (no version and no updated_at field; common_fields false) with reported_by_user_id set to the calling X-User-ID."
      - "Re-runs calculations.forfeiture_risk_score on the parent WaterRight (refreshing forfeiture_risk_score, forfeiture_risk_band and consecutive_nonuse_years) and bumps WaterRight.version."
    errors: [ERR_UNAUTHENTICATED, ERR_ROLE_NOT_PERMITTED, ERR_WATER_RIGHT_NOT_FOUND, ERR_NOT_RESOURCE_OWNER, ERR_INVALID_REQUEST, ERR_DUPLICATE_USE_YEAR]

  - method: GET
    path: /water-rights/{id}/beneficial-use-records
    description: "Lists the right's beneficial-use records ordered by `use_year ASC, created_at ASC`."
    roles: [WaterRightsAnalyst, HearingOfficer, DecisionAuthority, BasinAdjudicator, Claimant]
    code: 200
    input: ["use_year_from?", "use_year_to?"]
    output: BeneficialUseRecord[]
    side_effects: []
    errors: [ERR_UNAUTHENTICATED, ERR_ROLE_NOT_PERMITTED, ERR_WATER_RIGHT_NOT_FOUND, ERR_NOT_RESOURCE_OWNER, ERR_INVALID_REQUEST]

  # ---- points of diversion ------------------------------------------------
  - method: POST
    path: /water-rights/{id}/points-of-diversion
    description: >-
      Registers a headgate / point of diversion for the right. A new POD always
      starts PROPOSED; it becomes AUTHORIZED either when the right is activated
      (POST /water-rights/{id}/activate authorizes every PROPOSED POD) or as a
      side effect of an approved point-of-diversion-change decision.
    roles: [WaterRightsAnalyst, BasinAdjudicator]
    code: 201
    input: ["legal_description", "stream_reach_code", "max_rate_cfs", "stream_miles_from_headwater"]
    output: PointOfDiversion
    side_effects:
      - "Creates a PointOfDiversion in status PROPOSED. No lease may reference it until it is AUTHORIZED."
    errors: [ERR_UNAUTHENTICATED, ERR_ROLE_NOT_PERMITTED, ERR_WATER_RIGHT_NOT_FOUND, ERR_INVALID_REQUEST]

  - method: GET
    path: /water-rights/{id}/points-of-diversion
    description: "Lists the right's points of diversion ordered by `created_at ASC`."
    roles: [WaterRightsAnalyst, HearingOfficer, DecisionAuthority, BasinAdjudicator, Claimant]
    code: 200
    input: ["status?"]
    output: PointOfDiversion[]
    side_effects: []
    errors: [ERR_UNAUTHENTICATED, ERR_ROLE_NOT_PERMITTED, ERR_WATER_RIGHT_NOT_FOUND, ERR_NOT_RESOURCE_OWNER, ERR_INVALID_REQUEST]

  - method: GET
    path: /points-of-diversion/{id}
    description: >-
      Returns one point of diversion with its authorized max_rate_cfs and its
      status. The rate actually committed against it is the summed
      diversion_rate_cfs of its non-terminal leases and is discoverable through
      GET /lease-assignments?point_of_diversion_id=... (see
      calculations.pod_concurrent_rate_load).
    roles: [WaterRightsAnalyst, HearingOfficer, DecisionAuthority, BasinAdjudicator, Claimant]
    code: 200
    input: []
    output: PointOfDiversion
    side_effects: []
    errors: [ERR_UNAUTHENTICATED, ERR_ROLE_NOT_PERMITTED, ERR_POINT_OF_DIVERSION_NOT_FOUND, ERR_NOT_RESOURCE_OWNER]

  # ---- historical consumptive use -----------------------------------------
  - method: POST
    path: /water-rights/{id}/hcu-studies
    description: >-
      Runs a historical consumptive-use quantification over a study period and
      stores the result as a DRAFT study. The dual-variant
      calculations.hcu_transferable_volume runs synchronously here, so the
      response already carries transferable_cu_af and the haircut flag. A study
      period with zero admissible records is rejected, not quantified as zero.
      Body: `method` is one of DIVERSION_BASED | CIR_BASED;
      `study_period_start_year` and `study_period_end_year` are inclusive
      calendar years with start <= end.
    roles: [WaterRightsAnalyst]
    code: 201
    input: ["method", "study_period_start_year", "study_period_end_year"]
    output: HcuStudy
    side_effects:
      - "Creates an HcuStudy in status DRAFT carrying the fully evaluated calculations.hcu_transferable_volume result."
      - "No WaterRight volume bucket moves — a DRAFT study is advisory only."
    errors: [ERR_UNAUTHENTICATED, ERR_ROLE_NOT_PERMITTED, ERR_WATER_RIGHT_NOT_FOUND, ERR_INVALID_REQUEST, ERR_INVALID_WINDOW, ERR_INSUFFICIENT_USE_HISTORY]

  - method: GET
    path: /water-rights/{id}/hcu-studies
    description: "Lists the right's consumptive-use studies ordered by `created_at ASC`."
    roles: [WaterRightsAnalyst, HearingOfficer, DecisionAuthority, BasinAdjudicator, Claimant]
    code: 200
    input: ["status?"]
    output: HcuStudy[]
    side_effects: []
    errors: [ERR_UNAUTHENTICATED, ERR_ROLE_NOT_PERMITTED, ERR_WATER_RIGHT_NOT_FOUND, ERR_NOT_RESOURCE_OWNER, ERR_INVALID_REQUEST]

  - method: GET
    path: /hcu-studies/{id}
    description: "Returns one consumptive-use study with its certification identity."
    roles: [WaterRightsAnalyst, HearingOfficer, DecisionAuthority, BasinAdjudicator, Claimant]
    code: 200
    input: []
    output: HcuStudy
    side_effects: []
    errors: [ERR_UNAUTHENTICATED, ERR_ROLE_NOT_PERMITTED, ERR_HCU_STUDY_NOT_FOUND, ERR_NOT_RESOURCE_OWNER]

  - method: POST
    path: /hcu-studies/{id}/certify
    description: >-
      Certifies a DRAFT study, writing its transferable_cu_af into the right's
      volume ledger and superseding any previously CERTIFIED study for the same
      right. Guarded by optimistic concurrency control on the parent WaterRight
      (concurrency_rules[hcu-certify-stale-right]) because the certification
      rewrites the ledger the caller read. The certifying X-User-ID is recorded
      and later bars that user from deciding applications built on this study.
    roles: [WaterRightsAnalyst, BasinAdjudicator]
    code: 200
    input: ["expected_water_right_version"]
    output: HcuStudy
    side_effects:
      - "HcuStudy.status DRAFT -> CERTIFIED, certified_by_user_id set to the calling X-User-ID and certified_at set to the logical clock; bumps HcuStudy.version."
      - "Any other CERTIFIED HcuStudy on the same right moves to SUPERSEDED (terminal) and its version is bumped."
      - "WaterRight.certified_hcu_af is set to this study's transferable_cu_af and WaterRight.transferable_af is set to certified_hcu_af - encumbered_af - transferred_away_af, preserving calculations.right_volume_ledger; WaterRight.status is re-derived by calculations.right_status_derivation (UNADJUDICATED rights become ACTIVE); WaterRight.version is bumped."
    errors: [ERR_UNAUTHENTICATED, ERR_ROLE_NOT_PERMITTED, ERR_HCU_STUDY_NOT_FOUND, ERR_INVALID_REQUEST, ERR_STALE_RIGHT_VERSION, ERR_INVALID_STATE, ERR_RIGHT_NOT_TRANSFERABLE]

  # ---- transfer applications ----------------------------------------------
  - method: POST
    path: /transfer-applications
    description: >-
      Drafts a change-of-use / point-of-diversion / place-of-use transfer
      application against a certified consumptive-use study. Scope coherence is
      enforced per application_type: the POD field is required exactly for
      POINT_OF_DIVERSION_CHANGE and COMBINED, the purpose field exactly for
      CHANGE_OF_USE and COMBINED, the acreage field exactly for
      PLACE_OF_USE_CHANGE and COMBINED. All three scope fields are therefore
      declared optional at the transport level and their presence/absence is
      adjudicated by validations priority 8 (ERR_APPLICATION_SCOPE_INCOMPLETE);
      `application_type` is one of CHANGE_OF_USE | POINT_OF_DIVERSION_CHANGE |
      PLACE_OF_USE_CHANGE | COMBINED and `proposed_purpose_of_use` is one of
      IRRIGATION | MUNICIPAL | STOCKWATER | INDUSTRIAL | INSTREAM_FLOW.
    roles: [WaterRightsAnalyst, BasinAdjudicator, Claimant]
    code: 201
    input: ["water_right_id", "hcu_study_id", "application_type", "requested_af", "proposed_point_of_diversion_id?", "proposed_purpose_of_use?", "proposed_place_of_use_acres?"]
    output: TransferApplication
    side_effects:
      - "Creates a TransferApplication in status DRAFT. No volume is escrowed and no ledger bucket moves until submit."
    errors: [ERR_UNAUTHENTICATED, ERR_ROLE_NOT_PERMITTED, ERR_NOT_RESOURCE_OWNER, ERR_INVALID_REQUEST, ERR_WATER_RIGHT_NOT_FOUND, ERR_HCU_STUDY_NOT_FOUND, ERR_POINT_OF_DIVERSION_NOT_FOUND, ERR_APPLICATION_SCOPE_INCOMPLETE, ERR_STUDY_RIGHT_MISMATCH]

  - method: GET
    path: /transfer-applications
    description: "Lists transfer applications ordered by `created_at DESC, id ASC`."
    roles: [WaterRightsAnalyst, HearingOfficer, DecisionAuthority, BasinAdjudicator, Claimant]
    code: 200
    input: ["water_right_id?", "hcu_study_id?", "proposed_point_of_diversion_id?", "status?", "limit?", "offset?"]
    output: TransferApplication[]
    side_effects: []
    errors: [ERR_UNAUTHENTICATED, ERR_ROLE_NOT_PERMITTED, ERR_INVALID_REQUEST]

  - method: GET
    path: /transfer-applications/{id}
    description: "Returns one transfer application including its escrow, protest counters and decision identity."
    roles: [WaterRightsAnalyst, HearingOfficer, DecisionAuthority, BasinAdjudicator, Claimant]
    code: 200
    input: []
    output: TransferApplication
    side_effects: []
    errors: [ERR_UNAUTHENTICATED, ERR_ROLE_NOT_PERMITTED, ERR_TRANSFER_APPLICATION_NOT_FOUND, ERR_NOT_RESOURCE_OWNER]

  - method: POST
    path: /transfer-applications/{id}/submit
    description: >-
      Submits a DRAFT application, escrowing requested_af out of the right's
      transferable bucket into its encumbered bucket. Guarded by optimistic
      concurrency control on the parent WaterRight
      (concurrency_rules[application-submit-stale-right]) because the escrow
      rewrites the ledger the caller read. This is the primary
      priority-ordering surface: a DELINQUENT claimant is rejected
      (business_safety, priority 24) before the transferable-volume budget is
      even consulted (business_fiscal, priority 45).
    roles: [WaterRightsAnalyst, BasinAdjudicator, Claimant]
    code: 200
    input: ["expected_water_right_version"]
    output: TransferApplication
    side_effects:
      - "TransferApplication.status DRAFT -> SUBMITTED and escrowed_af is set to requested_af; bumps TransferApplication.version."
      - "WaterRight.transferable_af decreases by requested_af and WaterRight.encumbered_af increases by the same amount, conserving calculations.right_volume_ledger; WaterRight.status is re-derived by calculations.right_status_derivation (ACTIVE -> ENCUMBERED); WaterRight.version is bumped."
      - "Claimant.open_application_count is recomputed."
    errors: [ERR_UNAUTHENTICATED, ERR_ROLE_NOT_PERMITTED, ERR_TRANSFER_APPLICATION_NOT_FOUND, ERR_NOT_RESOURCE_OWNER, ERR_INVALID_REQUEST, ERR_STALE_RIGHT_VERSION, ERR_INVALID_STATE, ERR_RIGHT_NOT_TRANSFERABLE, ERR_CLAIMANT_NOT_IN_GOOD_STANDING, ERR_TRANSFERABLE_VOLUME_EXCEEDED]

  - method: POST
    path: /transfer-applications/{id}/publish
    description: >-
      Publishes a SUBMITTED application for public protest. The protest window
      is NOT caller-supplied: protest_deadline is stamped at logical clock + 30
      days on the first publication (revision_round == 0) and at logical clock +
      15 days on every republication after a revision (revision_round >= 1), so
      a revised application gets a materially shorter window. Requires an
      InjuryAnalysis to already exist so protestants have something to respond
      to.
    roles: [WaterRightsAnalyst, BasinAdjudicator]
    code: 200
    input: []
    output: TransferApplication
    side_effects:
      - "TransferApplication.status SUBMITTED -> PROTEST_PERIOD and protest_deadline is stamped from the logical clock using the revision_round-dependent window (30 days / 15 days); bumps TransferApplication.version."
    errors: [ERR_UNAUTHENTICATED, ERR_ROLE_NOT_PERMITTED, ERR_TRANSFER_APPLICATION_NOT_FOUND, ERR_INVALID_REQUEST, ERR_INVALID_STATE, ERR_INJURY_ANALYSIS_MISSING]

  - method: POST
    path: /transfer-applications/{id}/close-protest-period
    description: >-
      Closes an unprotested protest window once the logical clock has reached
      protest_deadline, moving PROTEST_PERIOD -> READY_FOR_DECISION and
      finalizing the DRAFT injury analysis. This endpoint is only valid from
      PROTEST_PERIOD: the first protest filing already moves the application to
      UNDER_PROTEST, and a protested application leaves UNDER_PROTEST only when
      its last protest clears (the protest-clearance cascade) or when a revision
      is requested. Calling it on an UNDER_PROTEST application is ERR_INVALID_STATE.
    roles: [WaterRightsAnalyst, HearingOfficer, BasinAdjudicator]
    code: 200
    input: []
    output: TransferApplication
    side_effects:
      - "TransferApplication.status PROTEST_PERIOD -> READY_FOR_DECISION; bumps TransferApplication.version."
      - "The application's DRAFT InjuryAnalysis moves to FINALIZED, freezing gross_depletion_af / offset_af / net_injury_af, and its version is bumped."
      - "WaterRight.pending_review_count is recomputed (it drops by one because a DRAFT analysis left the pending set) and WaterRight.version is bumped."
    errors: [ERR_UNAUTHENTICATED, ERR_ROLE_NOT_PERMITTED, ERR_TRANSFER_APPLICATION_NOT_FOUND, ERR_INVALID_STATE, ERR_WINDOW_STILL_OPEN]

  - method: POST
    path: /transfer-applications/{id}/request-revision
    description: >-
      Sends an UNDER_PROTEST application back to the applicant to be re-scoped,
      opening the revision leg of the cycle
      SUBMITTED -> PROTEST_PERIOD -> UNDER_PROTEST -> REVISION_REQUESTED ->
      SUBMITTED. The escrow is deliberately NOT released here — it is swapped
      atomically on resubmit — and the outstanding protests are held in place, so
      unresolved_protest_count does not move. protest_deadline is cleared so the
      republished application gets a fresh (shorter) window. Requires
      revision_round < REVISION_ROUND_CAP (2) and at least one unresolved protest.
    roles: [HearingOfficer]
    code: 200
    input: ["revision_note"]
    output: TransferApplication
    side_effects:
      - "TransferApplication.status UNDER_PROTEST -> REVISION_REQUESTED and protest_deadline cleared to null; bumps TransferApplication.version."
      - "No WaterRight ledger bucket moves and no WaterRight.version bump: the escrow stays in place across the revision."
      - "Every Protest on this application whose status IN {FILED, IN_NEGOTIATION, IN_HEARING} is held in place; unresolved_protest_count is unchanged."
    errors: [ERR_UNAUTHENTICATED, ERR_ROLE_NOT_PERMITTED, ERR_TRANSFER_APPLICATION_NOT_FOUND, ERR_INVALID_REQUEST, ERR_INVALID_STATE, ERR_REVISION_LIMIT_REACHED]

  - method: POST
    path: /transfer-applications/{id}/resubmit
    description: >-
      Resubmits a REVISION_REQUESTED application with a re-scoped volume. The
      escrow is swapped atomically — the old escrowed_af is released from and the
      new requested_af re-escrowed onto the right in a single step — so the
      budget check is `new requested_af <= transferable_af + escrowed_af`, not
      `<= transferable_af`. Closes the revision cycle back to SUBMITTED and
      increments revision_round. Guarded by optimistic concurrency control on the
      parent WaterRight.
    roles: [WaterRightsAnalyst, BasinAdjudicator, Claimant]
    code: 200
    input: ["requested_af", "expected_water_right_version"]
    output: TransferApplication
    side_effects:
      - "TransferApplication.status REVISION_REQUESTED -> SUBMITTED, requested_af replaced, escrowed_af set to the new requested_af, revision_round incremented by 1; bumps TransferApplication.version."
      - "WaterRight.encumbered_af decreases by the old escrowed_af and then increases by the new requested_af; transferable_af recomputed, conserving calculations.right_volume_ledger; WaterRight.status re-derived; WaterRight.version bumped."
      - "The application's DRAFT InjuryAnalysis is recomputed against the new requested_af (gross_depletion_af and net_injury_af refreshed, offset_af retained) and its version is bumped."
    errors: [ERR_UNAUTHENTICATED, ERR_ROLE_NOT_PERMITTED, ERR_TRANSFER_APPLICATION_NOT_FOUND, ERR_NOT_RESOURCE_OWNER, ERR_INVALID_REQUEST, ERR_STALE_RIGHT_VERSION, ERR_INVALID_STATE, ERR_RIGHT_NOT_TRANSFERABLE, ERR_CLAIMANT_NOT_IN_GOOD_STANDING, ERR_REVISION_LIMIT_REACHED, ERR_TRANSFERABLE_VOLUME_EXCEEDED]

  - method: POST
    path: /transfer-applications/{id}/decide
    description: >-
      Renders the disposition on a READY_FOR_DECISION application. The three
      dispositions have materially different side-effect sets: APPROVE converts
      escrow into a permanent transfer, APPROVE_WITH_CONDITIONS additionally
      creates ApprovalCondition rows and prices mitigation fees, DENY releases
      escrow entirely. Segregation of duties is enforced: the deciding
      X-User-ID may not be the user who certified the consumptive-use study or
      who resolved any protest on the application. Body: `disposition` is one of
      APPROVE | APPROVE_WITH_CONDITIONS | DENY; `decision_note` is non-blank;
      `conditions` is a non-empty array of
      {condition_type, required_af, compliance_due_date} objects, required
      exactly when disposition == APPROVE_WITH_CONDITIONS and rejected for the
      other two dispositions.
    roles: [DecisionAuthority]
    code: 200
    input: ["disposition", "decision_note", "conditions?"]
    output: TransferApplication
    side_effects:
      - "APPROVE (branch A): TransferApplication.status -> APPROVED, escrowed_af -> 0.00; WaterRight.encumbered_af decreases and transferred_away_af increases by the escrowed amount (calculations.right_volume_ledger conserved); WaterRight.status re-derived (-> PARTIALLY_TRANSFERRED); when application_type IN {POINT_OF_DIVERSION_CHANGE, COMBINED} the proposed PointOfDiversion moves PROPOSED -> AUTHORIZED and every other AUTHORIZED POD on the right moves to RETIRED (terminal); Claimant.open_application_count recomputed. NO ApprovalCondition is created and NO fee is assessed — the divergence from branch B."
      - "APPROVE_WITH_CONDITIONS (branch B): the same ledger movement and POD authorization as branch A, plus one ApprovalCondition per `conditions` entry with source = DECISION, status = IMPOSED and imposed_by_user_id = the calling X-User-ID; each MITIGATION_PAYMENT condition is priced by calculations.mitigation_fee (base_fee_usd, surcharge_pct, admin_surcharge_usd, total_fee_usd) and enters payment_status OUTSTANDING, every other condition_type enters payment_status NOT_APPLICABLE; TransferApplication.mitigation_fee_total_usd is set to the sum of the priced total_fee_usd values; Claimant.outstanding_fee_balance_usd increases by the same sum and, when that balance rises above 0.00 while standing_status == IN_GOOD_STANDING, standing_status -> DELINQUENT; every WaterBankAccount of that claimant re-runs calculations.bank_posture (a DELINQUENT holder drives posture to RESTRICTED)."
      - "DENY: TransferApplication.status -> DENIED, escrowed_af -> 0.00; WaterRight.encumbered_af decreases and transferable_af increases by the released escrow, restoring calculations.right_volume_ledger to its exact pre-submit values; WaterRight.status re-derived; Claimant.open_application_count recomputed; no POD status changes and no conditions are created."
      - "All three dispositions set decided_by_user_id to the calling X-User-ID and decision_note to the supplied note, and bump TransferApplication.version, WaterRight.version and the version of every other row they touch. WaterRight.pending_review_count does not move: the analysis was already FINALIZED before the application became decidable."
    errors: [ERR_UNAUTHENTICATED, ERR_ROLE_NOT_PERMITTED, ERR_TRANSFER_APPLICATION_NOT_FOUND, ERR_INVALID_REQUEST, ERR_INVALID_STATE, ERR_SEGREGATION_OF_DUTIES, ERR_INJURY_ANALYSIS_MISSING, ERR_UNMITIGATED_INJURY, ERR_MITIGATION_INSUFFICIENT]

  - method: POST
    path: /transfer-applications/{id}/withdraw
    description: >-
      Withdraws the application at the applicant's request from any
      non-terminal state, releasing escrow back to the transferable bucket.
    roles: [WaterRightsAnalyst, BasinAdjudicator, Claimant]
    code: 200
    input: ["withdrawal_reason"]
    output: TransferApplication
    side_effects:
      - "TransferApplication.status -> WITHDRAWN (terminal), escrowed_af released to 0.00; bumps TransferApplication.version."
      - "WaterRight.encumbered_af decreases and transferable_af increases by the released escrow, conserving calculations.right_volume_ledger; WaterRight.status re-derived; WaterRight.version bumped. (From DRAFT there is no escrow to release and no ledger movement occurs.)"
      - "Every Protest on the application whose status IN {FILED, IN_NEGOTIATION, IN_HEARING} moves to DISMISSED (terminal) and its version is bumped; unresolved_protest_count is recomputed to 0."
      - "The application's DRAFT InjuryAnalysis moves to VOIDED (terminal), its version is bumped, and WaterRight.pending_review_count is recomputed."
      - "Claimant.open_application_count is recomputed."
    errors: [ERR_UNAUTHENTICATED, ERR_ROLE_NOT_PERMITTED, ERR_TRANSFER_APPLICATION_NOT_FOUND, ERR_NOT_RESOURCE_OWNER, ERR_INVALID_REQUEST, ERR_INVALID_STATE]

  # ---- injury analysis -----------------------------------------------------
  - method: POST
    path: /transfer-applications/{id}/injury-analyses
    description: >-
      Runs the dual-variant injury analysis (calculations.injury_net_analysis)
      for the application and stores it as DRAFT. Re-posting voids the existing
      DRAFT analysis, so at most one DRAFT analysis exists per application at any
      time. offset_af is seeded from the already-stipulated NEGOTIATION-track
      protests, so re-running an analysis mid-negotiation does not discard
      offsets already conceded. Body: `method` is one of
      INSTANTANEOUS_DEPLETION | SEASONAL_AVERAGE, `pod_move_miles` is >= 0
      (2 dp) and `return_flow_credit_af` is >= 0 (2 dp), defaulting to 0.00 when
      omitted.
    roles: [WaterRightsAnalyst, HearingOfficer, BasinAdjudicator]
    code: 201
    input: ["method", "pod_move_miles", "return_flow_credit_af?"]
    output: InjuryAnalysis
    side_effects:
      - "Creates an InjuryAnalysis in status DRAFT carrying the fully evaluated calculations.injury_net_analysis result, with prepared_by_user_id set to the calling X-User-ID and offset_af seeded from the summed stipulated_offset_af of this application's RESOLVED_STIPULATED, NEGOTIATION-track protests."
      - "Any existing DRAFT InjuryAnalysis on the application moves to VOIDED (terminal) and its version is bumped."
      - "WaterRight.pending_review_count is recomputed (net zero when one DRAFT replaces another, +1 for the first analysis) and WaterRight.version is bumped."
    errors: [ERR_UNAUTHENTICATED, ERR_ROLE_NOT_PERMITTED, ERR_TRANSFER_APPLICATION_NOT_FOUND, ERR_INVALID_REQUEST, ERR_INVALID_STATE]

  - method: GET
    path: /transfer-applications/{id}/injury-analyses
    description: "Lists the application's injury analyses ordered by `created_at ASC`."
    roles: [WaterRightsAnalyst, HearingOfficer, DecisionAuthority, BasinAdjudicator, Claimant]
    code: 200
    input: ["status?"]
    output: InjuryAnalysis[]
    side_effects: []
    errors: [ERR_UNAUTHENTICATED, ERR_ROLE_NOT_PERMITTED, ERR_TRANSFER_APPLICATION_NOT_FOUND, ERR_NOT_RESOURCE_OWNER, ERR_INVALID_REQUEST]

  - method: GET
    path: /injury-analyses/{id}
    description: "Returns one injury analysis with its gross depletion, offset and net injury components."
    roles: [WaterRightsAnalyst, HearingOfficer, DecisionAuthority, BasinAdjudicator, Claimant]
    code: 200
    input: []
    output: InjuryAnalysis
    side_effects: []
    errors: [ERR_UNAUTHENTICATED, ERR_ROLE_NOT_PERMITTED, ERR_INJURY_ANALYSIS_NOT_FOUND, ERR_NOT_RESOURCE_OWNER]

  # ---- protests ------------------------------------------------------------
  - method: POST
    path: /protests
    description: >-
      Files a protest against a published application. The filing itself drives
      the application PROTEST_PERIOD -> UNDER_PROTEST (and UNDER_PROTEST ->
      UNDER_PROTEST for each additional protestant). This endpoint carries the
      scaffold's temporal-versus-constraint priority pair: a late duplicate
      filing violates both the protest window (business_temporal, priority 32)
      and the one-protest-per-protestant rule (business_constraint, priority 39),
      and the temporal error is the one returned.
    roles: [Claimant]
    code: 201
    input: ["transfer_application_id", "protestant_claimant_id", "claimed_injury_af", "basis"]
    output: Protest
    side_effects:
      - "Creates a Protest in status FILED with track = null and stipulated_offset_af = 0.00."
      - "TransferApplication.status moves PROTEST_PERIOD -> UNDER_PROTEST on the first protest and stays UNDER_PROTEST for later ones; unresolved_protest_count is recomputed; TransferApplication.version is bumped."
    errors: [ERR_UNAUTHENTICATED, ERR_ROLE_NOT_PERMITTED, ERR_NOT_RESOURCE_OWNER, ERR_INVALID_REQUEST, ERR_TRANSFER_APPLICATION_NOT_FOUND, ERR_CLAIMANT_NOT_FOUND, ERR_INVALID_STATE, ERR_CLAIMANT_NOT_IN_GOOD_STANDING, ERR_PROTEST_WINDOW_CLOSED, ERR_SELF_PROTEST_FORBIDDEN, ERR_DUPLICATE_PROTEST]

  - method: GET
    path: /protests
    description: "Lists protests ordered by `created_at ASC` (filing order, never id order)."
    roles: [WaterRightsAnalyst, HearingOfficer, DecisionAuthority, BasinAdjudicator, Claimant]
    code: 200
    input: ["transfer_application_id?", "protestant_claimant_id?", "status?", "track?", "limit?", "offset?"]
    output: Protest[]
    side_effects: []
    errors: [ERR_UNAUTHENTICATED, ERR_ROLE_NOT_PERMITTED, ERR_INVALID_REQUEST]

  - method: GET
    path: /protests/{id}
    description: "Returns one protest with its track, stipulated offset and resolver identity."
    roles: [WaterRightsAnalyst, HearingOfficer, DecisionAuthority, BasinAdjudicator, Claimant]
    code: 200
    input: []
    output: Protest
    side_effects: []
    errors: [ERR_UNAUTHENTICATED, ERR_ROLE_NOT_PERMITTED, ERR_PROTEST_NOT_FOUND, ERR_NOT_RESOURCE_OWNER]

  - method: POST
    path: /protests/{id}/route
    description: >-
      Routes a FILED protest onto one of two resolution tracks. This is the fork
      point: the NEGOTIATION track later yields a volumetric offset against the
      injury analysis, while the HEARING track instead imposes an
      ApprovalCondition on the application — entirely different side-effect sets
      reaching the same RESOLVED_STIPULATED state. Body: `track` is one of
      NEGOTIATION | HEARING.
    roles: [HearingOfficer]
    code: 200
    input: ["track"]
    output: Protest
    side_effects:
      - "Protest.track is set and Protest.status moves FILED -> IN_NEGOTIATION or FILED -> IN_HEARING; bumps Protest.version."
      - "No counter moves: the protest is still unresolved, so unresolved_protest_count is unchanged."
    errors: [ERR_UNAUTHENTICATED, ERR_ROLE_NOT_PERMITTED, ERR_PROTEST_NOT_FOUND, ERR_INVALID_REQUEST, ERR_INVALID_STATE]

  - method: POST
    path: /protests/{id}/resolve
    description: >-
      Resolves a routed protest and triggers the protest-clearance cascade. The
      admissible (track, outcome) combinations are exactly three: NEGOTIATION +
      STIPULATE (requires stipulated_offset_af), HEARING + STIPULATE (requires
      condition_type), HEARING + DISMISS (requires resolution_note). NEGOTIATION
      + DISMISS is not a declared transition and is rejected with
      ERR_INVALID_STATE. The resolving X-User-ID is recorded and thereafter bars
      that user from deciding the protested application. Body: `outcome` is one
      of STIPULATE | DISMISS; `stipulated_offset_af` (>= 0, 2 dp) is required
      exactly for NEGOTIATION + STIPULATE; `condition_type` (one of
      DRY_YEAR_FORBEARANCE | MEASUREMENT_DEVICE | RETURN_FLOW_MAINTENANCE |
      MITIGATION_PAYMENT) is required exactly for HEARING + STIPULATE, and the
      optional `compliance_due_date` is accepted only alongside it and stored
      as-is (null when omitted).
    roles: [HearingOfficer]
    code: 200
    input: ["outcome", "resolution_note", "stipulated_offset_af?", "condition_type?", "compliance_due_date?"]
    output: Protest
    side_effects:
      - "NEGOTIATION + STIPULATE (cascade links 1-2): Protest.status IN_NEGOTIATION -> RESOLVED_STIPULATED, stipulated_offset_af recorded, resolved_by_user_id set to the calling X-User-ID; the application's DRAFT InjuryAnalysis recomputes offset_af as the sum of stipulated_offset_af over RESOLVED_STIPULATED NEGOTIATION-track protests and recomputes net_injury_af per calculations.injury_net_analysis; TransferApplication.unresolved_protest_count is decremented."
      - "HEARING + STIPULATE: Protest.status IN_HEARING -> RESOLVED_STIPULATED, stipulated_offset_af stays 0.00 (the hearing branch grants NO volumetric offset, so net_injury_af does not move); one ApprovalCondition is created on the application with source = HEARING_RESOLUTION, status = IMPOSED and required_af = claimed_injury_af; when condition_type == MITIGATION_PAYMENT it is priced by calculations.mitigation_fee, enters payment_status OUTSTANDING and increases Claimant.outstanding_fee_balance_usd (driving standing_status to DELINQUENT and the claimant's bank postures to RESTRICTED); TransferApplication.unresolved_protest_count is decremented."
      - "HEARING + DISMISS: Protest.status IN_HEARING -> DISMISSED with no offset and no condition; TransferApplication.unresolved_protest_count is decremented."
      - "Cascade links 3-5 (all three outcomes): when unresolved_protest_count reaches exactly 0 the application auto-transitions UNDER_PROTEST -> READY_FOR_DECISION, its DRAFT InjuryAnalysis moves to FINALIZED (freezing gross_depletion_af / offset_af / net_injury_af), WaterRight.pending_review_count is decremented and WaterRight.version is bumped."
      - "Bumps Protest.version, TransferApplication.version and the version of every other row touched."
    errors: [ERR_UNAUTHENTICATED, ERR_ROLE_NOT_PERMITTED, ERR_PROTEST_NOT_FOUND, ERR_INVALID_REQUEST, ERR_INVALID_STATE, ERR_OFFSET_EXCEEDS_CLAIM]

  - method: POST
    path: /protests/{id}/withdraw
    description: >-
      Withdraws a protest at the protestant's own request from FILED,
      IN_NEGOTIATION or IN_HEARING. Clearing the last protest this way triggers
      the same links 3-5 of the protest-clearance cascade as a resolution does.
    roles: [Claimant, BasinAdjudicator]
    code: 200
    input: ["withdrawal_reason"]
    output: Protest
    side_effects:
      - "Protest.status -> WITHDRAWN (terminal) with no offset and no condition; bumps Protest.version."
      - "TransferApplication.unresolved_protest_count is decremented and, when it reaches exactly 0, the application auto-transitions UNDER_PROTEST -> READY_FOR_DECISION, its DRAFT InjuryAnalysis moves to FINALIZED, and WaterRight.pending_review_count is decremented."
    errors: [ERR_UNAUTHENTICATED, ERR_ROLE_NOT_PERMITTED, ERR_PROTEST_NOT_FOUND, ERR_NOT_RESOURCE_OWNER, ERR_INVALID_REQUEST, ERR_INVALID_STATE]

  # ---- approval conditions & mitigation -----------------------------------
  - method: GET
    path: /transfer-applications/{id}/approval-conditions
    description: >-
      Lists the conditions riding on an application, ordered by
      `created_at ASC`. Conditions are never created directly: they are produced
      by an APPROVE_WITH_CONDITIONS disposition (source DECISION) or by a
      HEARING-track protest resolution (source HEARING_RESOLUTION).
    roles: [WaterRightsAnalyst, HearingOfficer, DecisionAuthority, BasinAdjudicator, Claimant]
    code: 200
    input: ["status?", "payment_status?"]
    output: ApprovalCondition[]
    side_effects: []
    errors: [ERR_UNAUTHENTICATED, ERR_ROLE_NOT_PERMITTED, ERR_TRANSFER_APPLICATION_NOT_FOUND, ERR_NOT_RESOURCE_OWNER, ERR_INVALID_REQUEST]

  - method: GET
    path: /approval-conditions/{id}
    description: >-
      Returns one approval condition with both of its independent dimensions —
      the compliance dimension (status) and the fiscal dimension
      (payment_status) — plus the full mitigation-fee breakdown.
    roles: [WaterRightsAnalyst, HearingOfficer, DecisionAuthority, BasinAdjudicator, Claimant]
    code: 200
    input: []
    output: ApprovalCondition
    side_effects: []
    errors: [ERR_UNAUTHENTICATED, ERR_ROLE_NOT_PERMITTED, ERR_APPROVAL_CONDITION_NOT_FOUND, ERR_NOT_RESOURCE_OWNER]

  - method: POST
    path: /approval-conditions/{id}/pay
    description: >-
      Pays a MITIGATION_PAYMENT condition's assessed fee in full (partial
      payment is not modelled), advancing only the fiscal dimension and firing
      the depth-4 fee-payment cascade. The compliance dimension is untouched:
      paying does not satisfy the condition.
    roles: [Claimant, BasinAdjudicator]
    code: 200
    input: []
    output: ApprovalCondition
    side_effects:
      - "Cascade link 1: ApprovalCondition.payment_status OUTSTANDING -> PAID; bumps ApprovalCondition.version. ApprovalCondition.status stays IMPOSED — the two dimensions are independent."
      - "Cascade link 2: Claimant.outstanding_fee_balance_usd decreases by total_fee_usd and Claimant.version is bumped."
      - "Cascade link 3: when the balance reaches exactly 0.00 and standing_status == DELINQUENT, standing_status returns to IN_GOOD_STANDING. A balance of 0.01 leaves the claimant DELINQUENT."
      - "Cascade link 4: every WaterBankAccount of that claimant recomputes posture per calculations.bank_posture (RESTRICTED clears only when the standing is restored and no other RESTRICTED trigger applies) and its version is bumped."
    errors: [ERR_UNAUTHENTICATED, ERR_ROLE_NOT_PERMITTED, ERR_APPROVAL_CONDITION_NOT_FOUND, ERR_NOT_RESOURCE_OWNER, ERR_INVALID_STATE, ERR_CLAIMANT_NOT_IN_GOOD_STANDING]

  - method: POST
    path: /approval-conditions/{id}/satisfy
    description: >-
      Signs off compliance with a condition, advancing only the compliance
      dimension. Cross-dimension guard: an OUTSTANDING fee blocks sign-off, so a
      MITIGATION_PAYMENT condition must be paid first. Accepted from IMPOSED
      (ordinary sign-off) and from VIOLATED (the cure leg — late compliance
      after field enforcement recorded a violation).
    roles: [Claimant, BasinAdjudicator]
    code: 200
    input: ["compliance_evidence"]
    output: ApprovalCondition
    side_effects:
      - "ApprovalCondition.status IMPOSED -> SATISFIED (terminal); bumps ApprovalCondition.version. No other row is touched."
      - "ApprovalCondition.status VIOLATED -> SATISFIED (the cure leg); bumps ApprovalCondition.version. The right's SUSPENDED status and its SUSPENDED leases are NOT lifted here — curing only clears validations priority 31 so that POST /water-rights/{id}/reinstate becomes admissible."
    errors: [ERR_UNAUTHENTICATED, ERR_ROLE_NOT_PERMITTED, ERR_APPROVAL_CONDITION_NOT_FOUND, ERR_NOT_RESOURCE_OWNER, ERR_INVALID_REQUEST, ERR_INVALID_STATE, ERR_CONDITION_FEE_OUTSTANDING]

  - method: POST
    path: /approval-conditions/{id}/violate
    description: >-
      Records non-compliance with a condition once its compliance_due_date has
      passed, firing the depth-4 condition-violation cascade that reaches all
      the way from the condition through the water right and its leases to the
      water bank account's posture.
    roles: [WaterRightsAnalyst]
    code: 200
    input: ["violation_note"]
    output: ApprovalCondition
    side_effects:
      - "Cascade link 1: ApprovalCondition.status IMPOSED -> VIOLATED; bumps ApprovalCondition.version."
      - "Cascade link 2: the application's WaterRight moves to SUSPENDED (from ACTIVE, ENCUMBERED or PARTIALLY_TRANSFERRED), calculations.forfeiture_risk_score is recomputed with SUSPENDED_PENALTY applied, and WaterRight.version is bumped."
      - "Cascade link 3: every LeaseAssignment on that right whose status == ACTIVE moves to SUSPENDED, its suspension_count is incremented, and its WaterBankAccount moves requested_af from leased_out_af back to committed_credit_af (available_credit_af unchanged, so calculations.bank_credit_ledger is conserved)."
      - "Cascade link 4: each affected WaterBankAccount increments suspended_lease_count and recomputes posture per calculations.bank_posture, which lands on FROZEN because FROZEN dominates RESTRICTED and OPEN."
    errors: [ERR_UNAUTHENTICATED, ERR_ROLE_NOT_PERMITTED, ERR_APPROVAL_CONDITION_NOT_FOUND, ERR_INVALID_REQUEST, ERR_INVALID_STATE, ERR_WINDOW_STILL_OPEN]

  # ---- water banking -------------------------------------------------------
  - method: POST
    path: /water-bank-accounts
    description: >-
      Opens a basin water-bank account for a claimant. The account starts with a
      fully zeroed credit ledger and posture OPEN.
    roles: [WaterRightsAnalyst, BasinAdjudicator]
    code: 201
    input: ["claimant_id", "basin_code"]
    output: WaterBankAccount
    side_effects:
      - "Creates a WaterBankAccount with all four credit buckets 0.00, suspended_lease_count 0 and posture OPEN, satisfying calculations.bank_credit_ledger trivially."
    errors: [ERR_UNAUTHENTICATED, ERR_ROLE_NOT_PERMITTED, ERR_INVALID_REQUEST, ERR_CLAIMANT_NOT_FOUND]

  - method: GET
    path: /water-bank-accounts
    description: "Lists water-bank accounts ordered by `created_at ASC`."
    roles: [WaterRightsAnalyst, HearingOfficer, DecisionAuthority, BasinAdjudicator, Claimant]
    code: 200
    input: ["claimant_id?", "basin_code?", "posture?"]
    output: WaterBankAccount[]
    side_effects: []
    errors: [ERR_UNAUTHENTICATED, ERR_ROLE_NOT_PERMITTED, ERR_INVALID_REQUEST]

  - method: GET
    path: /water-bank-accounts/{id}
    description: >-
      Returns one water-bank account with its four-bucket credit ledger and its
      derived posture.
    roles: [WaterRightsAnalyst, HearingOfficer, DecisionAuthority, BasinAdjudicator, Claimant]
    code: 200
    input: []
    output: WaterBankAccount
    side_effects: []
    errors: [ERR_UNAUTHENTICATED, ERR_ROLE_NOT_PERMITTED, ERR_WATER_BANK_ACCOUNT_NOT_FOUND, ERR_NOT_RESOURCE_OWNER]

  - method: POST
    path: /water-bank-accounts/{id}/deposits
    description: >-
      Deposits transferable volume from a bank-enrolled water right into the
      account, moving that volume out of the right's transferable bucket and into
      its encumbered bucket while adding it to the account's deposited and
      available credit. Guarded by optimistic concurrency control on the parent
      WaterBankAccount (concurrency_rules[bank-deposit-stale-account]) because
      the deposit rewrites the credit ledger the caller read. There is no
      standalone deposit entity: the volume is recorded directly on both ledgers,
      and the deposited volume attributable to the source right is what
      calculations.right_volume_ledger calls the bank hold.
    roles: [Claimant, WaterRightsAnalyst, BasinAdjudicator]
    code: 200
    input: ["water_right_id", "deposit_af", "expected_water_bank_account_version"]
    output: WaterBankAccount
    side_effects:
      - "WaterBankAccount.deposited_credit_af and available_credit_af both increase by deposit_af, conserving calculations.bank_credit_ledger; posture is recomputed per calculations.bank_posture (a deposit can lift an account off the low-credit RESTRICTED trigger); bumps WaterBankAccount.version."
      - "WaterRight.transferable_af decreases and WaterRight.encumbered_af increases by deposit_af, conserving calculations.right_volume_ledger; WaterRight.status is re-derived (ACTIVE -> ENCUMBERED); bumps WaterRight.version."
    errors: [ERR_UNAUTHENTICATED, ERR_ROLE_NOT_PERMITTED, ERR_WATER_BANK_ACCOUNT_NOT_FOUND, ERR_NOT_RESOURCE_OWNER, ERR_INVALID_REQUEST, ERR_WATER_RIGHT_NOT_FOUND, ERR_STALE_ACCOUNT_VERSION, ERR_RIGHT_NOT_TRANSFERABLE, ERR_RIGHT_NOT_BANK_ENROLLED, ERR_TRANSFERABLE_VOLUME_EXCEEDED]

  # ---- leases --------------------------------------------------------------
  - method: POST
    path: /lease-assignments
    description: >-
      Reserves bank credit for a lease of water at a specific headgate over a
      specific window. Two DIFFERENT interval geometries are enforced here at
      adjacent priorities, and they are deliberately not the same shape: the
      same-right/different-headgate exclusivity rule (priority 41,
      calculations.right_lease_exclusion_window) treats the window as CLOSED and
      pads it with a 7-day fallow buffer on both sides, so touching windows
      collide; the same-headgate capacity rule (priority 42,
      calculations.pod_concurrent_rate_load) treats it as HALF-OPEN
      [lease_start_date, lease_end_date) and sums rates over the true overlap, so
      touching windows do NOT collide and even fully overlapping windows pass
      while the aggregate rate fits. The two populations are disjoint — a
      candidate is judged by 41 against other headgates of its right and by 42
      against its own headgate — so both geometries are independently reachable. This endpoint also carries the
      constraint-versus-fiscal priority pair: a window collision (priority 41)
      outranks insufficient bank credit (priority 46).
    roles: [Claimant, WaterRightsAnalyst, BasinAdjudicator]
    code: 201
    input: ["water_bank_account_id", "water_right_id", "point_of_diversion_id", "lessee_name", "lease_start_date", "lease_end_date", "requested_af", "diversion_rate_cfs", "rental_rate_usd_per_af", "valuation_method"]
    output: LeaseAssignment
    side_effects:
      - "Creates a LeaseAssignment in status RESERVED."
      - "WaterBankAccount.committed_credit_af increases and available_credit_af decreases by requested_af, conserving calculations.bank_credit_ledger; posture is recomputed per calculations.bank_posture (committing credit can drop available_credit_af below the 5.00 AF floor and force RESTRICTED); bumps WaterBankAccount.version."
    errors: [ERR_UNAUTHENTICATED, ERR_ROLE_NOT_PERMITTED, ERR_NOT_RESOURCE_OWNER, ERR_INVALID_REQUEST, ERR_WATER_BANK_ACCOUNT_NOT_FOUND, ERR_WATER_RIGHT_NOT_FOUND, ERR_POINT_OF_DIVERSION_NOT_FOUND, ERR_POD_RIGHT_MISMATCH, ERR_RIGHT_NOT_TRANSFERABLE, ERR_CLAIMANT_NOT_IN_GOOD_STANDING, ERR_INVALID_WINDOW, ERR_LEASE_WINDOW_CONFLICT, ERR_POD_CAPACITY_EXCEEDED, ERR_POD_NOT_AUTHORIZED, ERR_INSUFFICIENT_BANK_CREDIT]

  - method: GET
    path: /lease-assignments
    description: "Lists leases ordered by `lease_start_date ASC, created_at ASC` — never by id."
    roles: [WaterRightsAnalyst, HearingOfficer, DecisionAuthority, BasinAdjudicator, Claimant]
    code: 200
    input: ["water_bank_account_id?", "water_right_id?", "point_of_diversion_id?", "status?", "limit?", "offset?"]
    output: LeaseAssignment[]
    side_effects: []
    errors: [ERR_UNAUTHENTICATED, ERR_ROLE_NOT_PERMITTED, ERR_INVALID_REQUEST]

  - method: GET
    path: /lease-assignments/{id}
    description: "Returns one lease with its settlement figures and suspension history."
    roles: [WaterRightsAnalyst, HearingOfficer, DecisionAuthority, BasinAdjudicator, Claimant]
    code: 200
    input: []
    output: LeaseAssignment
    side_effects: []
    errors: [ERR_UNAUTHENTICATED, ERR_ROLE_NOT_PERMITTED, ERR_LEASE_ASSIGNMENT_NOT_FOUND, ERR_NOT_RESOURCE_OWNER]

  - method: POST
    path: /lease-assignments/{id}/activate
    description: >-
      Starts delivery on a RESERVED lease once the logical clock is inside the
      delivery window, moving the committed credit into the leased-out bucket.
      Cross-entity gate: the funding account's posture must be OPEN, so a
      RESTRICTED (delinquent holder or thin credit) or FROZEN (suspended lease)
      account cannot start new deliveries.
    roles: [Claimant, WaterRightsAnalyst, BasinAdjudicator]
    code: 200
    input: []
    output: LeaseAssignment
    side_effects:
      - "LeaseAssignment.status RESERVED -> ACTIVE; bumps LeaseAssignment.version."
      - "WaterBankAccount.committed_credit_af decreases and leased_out_af increases by requested_af; available_credit_af is unchanged, so calculations.bank_credit_ledger is conserved; posture recomputed; bumps WaterBankAccount.version."
    errors: [ERR_UNAUTHENTICATED, ERR_ROLE_NOT_PERMITTED, ERR_LEASE_ASSIGNMENT_NOT_FOUND, ERR_NOT_RESOURCE_OWNER, ERR_INVALID_STATE, ERR_ACCOUNT_POSTURE_BLOCKED, ERR_POD_NOT_AUTHORIZED, ERR_LEASE_WINDOW_TIMING]

  - method: POST
    path: /lease-assignments/{id}/resume
    description: >-
      Returns a lease suspended by the condition-violation cascade to ACTIVE,
      closing the lease cycle ACTIVE -> SUSPENDED -> ACTIVE. Requires the leased
      right to be back in service and the delivery window to still be open.
      Resumption is deliberately per-lease: reinstating the right does not
      auto-resume its leases.
    roles: [WaterRightsAnalyst, BasinAdjudicator]
    code: 200
    input: []
    output: LeaseAssignment
    side_effects:
      - "LeaseAssignment.status SUSPENDED -> ACTIVE; bumps LeaseAssignment.version."
      - "WaterBankAccount.committed_credit_af decreases and leased_out_af increases by requested_af (ledger conserved); suspended_lease_count is decremented and posture is recomputed, so FROZEN clears only when the count reaches 0 and no other trigger applies; bumps WaterBankAccount.version."
    errors: [ERR_UNAUTHENTICATED, ERR_ROLE_NOT_PERMITTED, ERR_LEASE_ASSIGNMENT_NOT_FOUND, ERR_INVALID_STATE, ERR_RIGHT_NOT_TRANSFERABLE, ERR_LEASE_WINDOW_TIMING]

  - method: POST
    path: /lease-assignments/{id}/complete
    description: >-
      Closes out a lease that ran to term. The full requested_af is deemed used,
      so it leaves the bank permanently and is booked against the source right as
      transferred-away volume.
    roles: [WaterRightsAnalyst, BasinAdjudicator]
    code: 200
    input: []
    output: LeaseAssignment
    side_effects:
      - "LeaseAssignment.status ACTIVE -> COMPLETED (terminal) with used_af = requested_af and settlement_credit_af = 0.00; bumps LeaseAssignment.version."
      - "WaterBankAccount.leased_out_af and deposited_credit_af both decrease by requested_af, conserving calculations.bank_credit_ledger; posture recomputed; bumps WaterBankAccount.version."
      - "On the source WaterRight the used volume moves from encumbered_af to transferred_away_af, conserving calculations.right_volume_ledger; bumps WaterRight.version."
    errors: [ERR_UNAUTHENTICATED, ERR_ROLE_NOT_PERMITTED, ERR_LEASE_ASSIGNMENT_NOT_FOUND, ERR_INVALID_STATE, ERR_LEASE_WINDOW_TIMING]

  - method: POST
    path: /lease-assignments/{id}/cancel
    description: >-
      Terminates a lease early from RESERVED, ACTIVE or SUSPENDED. From RESERVED
      it is the exact compensating action for creation (the whole requested_af
      returns to available credit). From ACTIVE or SUSPENDED the dual-variant
      calculations.lease_settlement_credit splits requested_af into used_af and
      settlement_credit_af according to the lease's valuation_method, and only
      the settlement portion returns to available credit.
    roles: [Claimant, WaterRightsAnalyst, BasinAdjudicator]
    code: 200
    input: ["cancellation_reason"]
    output: LeaseAssignment
    side_effects:
      - "From RESERVED: used_af = 0.00 and settlement_credit_af = requested_af; WaterBankAccount.committed_credit_af decreases and available_credit_af increases by requested_af, restoring calculations.bank_credit_ledger to its exact pre-creation values."
      - "From ACTIVE: used_af and settlement_credit_af are computed by calculations.lease_settlement_credit from the elapsed portion of the window; WaterBankAccount.leased_out_af decreases by requested_af, available_credit_af increases by settlement_credit_af and deposited_credit_af decreases by used_af (ledger conserved)."
      - "From SUSPENDED: the same settlement computation, but the credit comes out of committed_credit_af instead of leased_out_af, and suspended_lease_count is decremented."
      - "Whenever used_af > 0 the used volume moves from the source WaterRight's encumbered_af to its transferred_away_af, conserving calculations.right_volume_ledger."
      - "posture is recomputed and WaterBankAccount.version, WaterRight.version and LeaseAssignment.version are bumped."
    errors: [ERR_UNAUTHENTICATED, ERR_ROLE_NOT_PERMITTED, ERR_LEASE_ASSIGNMENT_NOT_FOUND, ERR_NOT_RESOURCE_OWNER, ERR_INVALID_REQUEST, ERR_INVALID_STATE, ERR_LEASE_WINDOW_TIMING]

  # ---- adjudication: dockets ----------------------------------------------
  - method: POST
    path: /decree-dockets
    description: >-
      Opens a basin adjudication docket in phase OPEN_FOR_CLAIMS with an
      exclusive claim-filing deadline.
    roles: [BasinAdjudicator]
    code: 201
    input: ["basin_code", "docket_number", "claim_filing_deadline"]
    output: DecreeDocket
    side_effects:
      - "Creates a DecreeDocket in phase OPEN_FOR_CLAIMS with all three counters zeroed."
    errors: [ERR_UNAUTHENTICATED, ERR_ROLE_NOT_PERMITTED, ERR_INVALID_REQUEST, ERR_DUPLICATE_DOCKET_NUMBER]

  - method: GET
    path: /decree-dockets/{id}
    description: "Returns one docket with its phase and its rolled-up claim counters."
    roles: [WaterRightsAnalyst, HearingOfficer, DecisionAuthority, BasinAdjudicator, Claimant]
    code: 200
    input: []
    output: DecreeDocket
    side_effects: []
    errors: [ERR_UNAUTHENTICATED, ERR_ROLE_NOT_PERMITTED, ERR_DECREE_DOCKET_NOT_FOUND]

  - method: POST
    path: /decree-dockets/{id}/advance-phase
    description: >-
      Advances the docket one phase. Every advance is a compound gate over the
      docket's children: EXAMINATION requires the filing deadline to have passed
      and at least one claim; OBJECTION_PERIOD requires every claim to have left
      FILED; DECREE_ENTERED requires every claim to be DECREED (and is also
      reached automatically by the bubble-up when the last claim is decreed);
      CLOSED makes the docket read-only. Body: `target_phase` is one of
      EXAMINATION | OBJECTION_PERIOD | DECREE_ENTERED | CLOSED.
    roles: [BasinAdjudicator]
    code: 200
    input: ["target_phase"]
    output: DecreeDocket
    side_effects:
      - "DecreeDocket.phase advances to target_phase; bumps DecreeDocket.version."
      - "On reaching EXAMINATION no further AdjudicationClaim may be filed on this docket; on reaching DECREE_ENTERED total_decreed_af is frozen; on reaching CLOSED the docket is read-only."
    errors: [ERR_UNAUTHENTICATED, ERR_ROLE_NOT_PERMITTED, ERR_DECREE_DOCKET_NOT_FOUND, ERR_INVALID_REQUEST, ERR_INVALID_STATE, ERR_WINDOW_STILL_OPEN, ERR_DOCKET_CHILDREN_NOT_READY]

  # ---- adjudication: claims -----------------------------------------------
  - method: POST
    path: /adjudication-claims
    description: >-
      Files a claim in an open docket. The claim carries two independent
      dimensions from birth: filing_status (procedural) starts FILED and
      verification_status (evidentiary) starts UNVERIFIED, and they advance
      through separate endpoints in either order.
    roles: [Claimant, WaterRightsAnalyst, BasinAdjudicator]
    code: 201
    input: ["decree_docket_id", "water_right_id", "claimed_priority_date", "claimed_af"]
    output: AdjudicationClaim
    side_effects:
      - "Creates an AdjudicationClaim with filing_status FILED and verification_status UNVERIFIED."
      - "DecreeDocket.claim_count is recomputed and DecreeDocket.version is bumped."
    errors: [ERR_UNAUTHENTICATED, ERR_ROLE_NOT_PERMITTED, ERR_NOT_RESOURCE_OWNER, ERR_INVALID_REQUEST, ERR_DECREE_DOCKET_NOT_FOUND, ERR_WATER_RIGHT_NOT_FOUND, ERR_DOCKET_PHASE_INVALID, ERR_CLAIM_FILING_CLOSED, ERR_DUPLICATE_CLAIM]

  - method: GET
    path: /adjudication-claims
    description: >-
      Lists claims ordered by `claimed_priority_date ASC, created_at ASC` — the
      same seniority ordering used to assign priority_rank, and never id order.
    roles: [WaterRightsAnalyst, HearingOfficer, DecisionAuthority, BasinAdjudicator, Claimant]
    code: 200
    input: ["decree_docket_id?", "water_right_id?", "filing_status?", "verification_status?", "limit?", "offset?"]
    output: AdjudicationClaim[]
    side_effects: []
    errors: [ERR_UNAUTHENTICATED, ERR_ROLE_NOT_PERMITTED, ERR_INVALID_REQUEST]

  - method: GET
    path: /adjudication-claims/{id}
    description: "Returns one claim with both status dimensions, its decreed volume and its seniority rank."
    roles: [WaterRightsAnalyst, HearingOfficer, DecisionAuthority, BasinAdjudicator, Claimant]
    code: 200
    input: []
    output: AdjudicationClaim
    side_effects: []
    errors: [ERR_UNAUTHENTICATED, ERR_ROLE_NOT_PERMITTED, ERR_ADJUDICATION_CLAIM_NOT_FOUND, ERR_NOT_RESOURCE_OWNER]

  - method: POST
    path: /adjudication-claims/{id}/examine
    description: >-
      Records the basin examiner's recommended volume, advancing only the
      procedural dimension FILED -> EXAMINED. Valid only while the docket is in
      EXAMINATION.
    roles: [BasinAdjudicator]
    code: 200
    input: ["examiner_recommended_af", "examination_note"]
    output: AdjudicationClaim
    side_effects:
      - "AdjudicationClaim.filing_status FILED -> EXAMINED and examiner_recommended_af recorded; bumps AdjudicationClaim.version. verification_status is untouched."
    errors: [ERR_UNAUTHENTICATED, ERR_ROLE_NOT_PERMITTED, ERR_ADJUDICATION_CLAIM_NOT_FOUND, ERR_INVALID_REQUEST, ERR_INVALID_STATE, ERR_DOCKET_PHASE_INVALID, ERR_RECOMMENDATION_EXCEEDS_CLAIM]

  - method: POST
    path: /adjudication-claims/{id}/verify
    description: >-
      Advances only the evidentiary dimension, independently of the procedural
      one and in any docket phase. FIELD_VERIFIED requires metered or
      aerial-imagery beneficial-use evidence on the claim's right; DISPUTED needs
      no evidence and can later be re-verified, which is the cycle on this axis.
      Body: `verification_outcome` is one of FIELD_VERIFIED | DISPUTED and
      `field_note` is non-blank.
    roles: [WaterRightsAnalyst, BasinAdjudicator]
    code: 200
    input: ["verification_outcome", "field_note"]
    output: AdjudicationClaim
    side_effects:
      - "AdjudicationClaim.verification_status moves UNVERIFIED -> FIELD_VERIFIED, UNVERIFIED -> DISPUTED or DISPUTED -> FIELD_VERIFIED; bumps AdjudicationClaim.version. filing_status is untouched and no docket counter moves."
    errors: [ERR_UNAUTHENTICATED, ERR_ROLE_NOT_PERMITTED, ERR_ADJUDICATION_CLAIM_NOT_FOUND, ERR_INVALID_REQUEST, ERR_INVALID_STATE, ERR_NO_VERIFIED_USE_EVIDENCE]

  - method: POST
    path: /adjudication-claims/{id}/object
    description: >-
      Lodges an objection against an examined claim during the objection period.
      The first objection moves the procedural dimension EXAMINED -> OBJECTED;
      further objections keep it at OBJECTED and only raise objection_count,
      which drives the objection haircut in calculations.decreed_volume.
      Objecting to one's own claim is forbidden. Body: `objection_basis` and
      `objection_note` are non-blank free text (1..240 chars).
    roles: [Claimant, BasinAdjudicator]
    code: 200
    input: ["objection_basis", "objection_note"]
    output: AdjudicationClaim
    side_effects:
      - "AdjudicationClaim.filing_status EXAMINED -> OBJECTED (or OBJECTED -> OBJECTED for an additional objector) and objection_count is incremented; bumps AdjudicationClaim.version."
    errors: [ERR_UNAUTHENTICATED, ERR_ROLE_NOT_PERMITTED, ERR_ADJUDICATION_CLAIM_NOT_FOUND, ERR_INVALID_REQUEST, ERR_INVALID_STATE, ERR_DOCKET_PHASE_INVALID, ERR_SELF_OBJECTION_FORBIDDEN]

  - method: POST
    path: /adjudication-claims/{id}/decree
    description: >-
      Enters the decree for a claim, computing decreed_af per
      calculations.decreed_volume (examiner recommendation, then the objection
      haircut, then the priority-date-mismatch haircut, in that pinned order) and
      re-ranking the docket's decreed claims by seniority. Gated on the OTHER
      dimension: verification_status must be FIELD_VERIFIED. Decreeing the last
      outstanding claim bubbles the docket up to DECREE_ENTERED.
    roles: [BasinAdjudicator]
    code: 200
    input: ["decree_note"]
    output: AdjudicationClaim
    side_effects:
      - "AdjudicationClaim.filing_status EXAMINED or OBJECTED -> DECREED (terminal) and decreed_af is set per calculations.decreed_volume; bumps AdjudicationClaim.version."
      - "priority_rank is recomputed for EVERY DECREED claim on the docket, ordered by claimed_priority_date ASC then created_at ASC, and each re-ranked claim's version is bumped."
      - "DecreeDocket.decreed_claim_count and total_decreed_af are recomputed and DecreeDocket.version is bumped."
      - "Bubble-up: when decreed_claim_count equals claim_count the docket auto-advances OBJECTION_PERIOD -> DECREE_ENTERED and total_decreed_af is frozen."
    errors: [ERR_UNAUTHENTICATED, ERR_ROLE_NOT_PERMITTED, ERR_ADJUDICATION_CLAIM_NOT_FOUND, ERR_INVALID_REQUEST, ERR_INVALID_STATE, ERR_DOCKET_PHASE_INVALID, ERR_CLAIM_NOT_VERIFIED]

# =============================================================================
# §1.6 Error Code Catalog — 58 codes. Every code is raised by at least one
# §1.5 endpoint and is reachable through the priority ladder in §1.4.
# =============================================================================
errors:

  # ---- authentication / authorization -------------------------------------
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "X-User-ID or X-Role request header is absent, blank, or carries a role outside the §1.7 role set."

  - id: ERR_ROLE_NOT_PERMITTED
    http: 403
    condition: "The caller's role is not listed in the target endpoint's roles."

  - id: ERR_NOT_RESOURCE_OWNER
    http: 403
    condition: "A Claimant-role caller touches a row that does not trace back to its own Claimant id (right, application, protest, condition, bank account, lease or claim of another claimant)."

  - id: ERR_SEGREGATION_OF_DUTIES
    http: 403
    condition: "The X-User-ID issuing a transfer disposition equals HcuStudy.certified_by_user_id of the application's study, or equals Protest.resolved_by_user_id of any protest on that application."

  - id: ERR_CLAIMANT_NOT_IN_GOOD_STANDING
    http: 403
    condition: "The acting claimant's standing_status is DELINQUENT or BARRED and the operation requires good standing (application submit/resubmit, protest filing, lease creation, bank deposit)."

  # ---- request shape -------------------------------------------------------
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "Malformed body: a required field is missing, a field has the wrong type, an enum value is not a declared member, an acre-foot/rate/fee amount breaks its >= 0 or > 0 constraint, or limit/offset are outside [1,100] / < 0."

  # ---- existence -----------------------------------------------------------
  - id: ERR_CLAIMANT_NOT_FOUND
    http: 404
    condition: "No Claimant row matches the supplied path or body claimant_id / protestant_claimant_id."

  - id: ERR_WATER_RIGHT_NOT_FOUND
    http: 404
    condition: "No WaterRight row matches the supplied path or body water_right_id."

  - id: ERR_POINT_OF_DIVERSION_NOT_FOUND
    http: 404
    condition: "No PointOfDiversion row matches the supplied path id, body point_of_diversion_id, or body proposed_point_of_diversion_id."

  - id: ERR_HCU_STUDY_NOT_FOUND
    http: 404
    condition: "No HcuStudy row matches the supplied path or body hcu_study_id, or the study exists but belongs to a different water right than the one named earlier in the path."

  - id: ERR_TRANSFER_APPLICATION_NOT_FOUND
    http: 404
    condition: "No TransferApplication row matches the supplied path id or body transfer_application_id."

  - id: ERR_INJURY_ANALYSIS_NOT_FOUND
    http: 404
    condition: "No InjuryAnalysis row matches the supplied path id."

  - id: ERR_PROTEST_NOT_FOUND
    http: 404
    condition: "No Protest row matches the supplied path id."

  - id: ERR_APPROVAL_CONDITION_NOT_FOUND
    http: 404
    condition: "No ApprovalCondition row matches the supplied path id."

  - id: ERR_WATER_BANK_ACCOUNT_NOT_FOUND
    http: 404
    condition: "No WaterBankAccount row matches the supplied path id or body water_bank_account_id."

  - id: ERR_LEASE_ASSIGNMENT_NOT_FOUND
    http: 404
    condition: "No LeaseAssignment row matches the supplied path id."

  - id: ERR_DECREE_DOCKET_NOT_FOUND
    http: 404
    condition: "No DecreeDocket row matches the supplied path id or body decree_docket_id."

  - id: ERR_ADJUDICATION_CLAIM_NOT_FOUND
    http: 404
    condition: "No AdjudicationClaim row matches the supplied path id."

  # ---- uniqueness ----------------------------------------------------------
  - id: ERR_DUPLICATE_RIGHT_NUMBER
    http: 409
    condition: "Another WaterRight already carries the submitted right_number (case-sensitive, global uniqueness)."

  - id: ERR_DUPLICATE_DOCKET_NUMBER
    http: 409
    condition: "Another DecreeDocket already carries the submitted docket_number."

  - id: ERR_DUPLICATE_USE_YEAR
    http: 409
    condition: "A BeneficialUseRecord already exists for this (water_right_id, use_year) pair; records are append-only and one per year."

  - id: ERR_DUPLICATE_CLAIM
    http: 409
    condition: "An AdjudicationClaim already exists for this (decree_docket_id, water_right_id) pair."

  - id: ERR_DUPLICATE_PROTEST
    http: 409
    condition: "This protestant already has a non-terminal Protest (FILED, IN_NEGOTIATION or IN_HEARING) against this application."

  # ---- optimistic concurrency ---------------------------------------------
  - id: ERR_STALE_RIGHT_VERSION
    http: 412
    condition: "expected_water_right_version does not equal the parent WaterRight's current version (concurrency_rules hcu-certify-stale-right, application-submit-stale-right)."

  - id: ERR_STALE_ACCOUNT_VERSION
    http: 412
    condition: "expected_water_bank_account_version does not equal the parent WaterBankAccount's current version (concurrency_rules bank-deposit-stale-account)."

  # ---- state / posture conflicts ------------------------------------------
  - id: ERR_INVALID_STATE
    http: 409
    condition: "The requested transition is not declared for the row's current state, or a prerequisite row is in the wrong state (e.g. certifying a non-DRAFT study, submitting against a study that is not CERTIFIED, resolving a FILED protest that was never routed, NEGOTIATION + DISMISS, paying a condition whose payment_status is not OUTSTANDING)."

  - id: ERR_RIGHT_NOT_TRANSFERABLE
    http: 409
    condition: "The water right's status is SUSPENDED or FORFEITED, so it cannot back a submission, a bank deposit, a lease creation or a lease resumption."

  - id: ERR_DOCKET_PHASE_INVALID
    http: 409
    condition: "The docket is not in the phase the operation requires (claim filing needs OPEN_FOR_CLAIMS, examine needs EXAMINATION, object needs OBJECTION_PERIOD, decree needs OBJECTION_PERIOD), or the requested target_phase is not the docket's declared successor."

  - id: ERR_CLAIM_NOT_VERIFIED
    http: 409
    condition: "A claim is decreed while its verification_status is UNVERIFIED or DISPUTED; only FIELD_VERIFIED claims may be decreed."

  - id: ERR_CONDITION_FEE_OUTSTANDING
    http: 409
    condition: "Compliance sign-off is attempted on a condition whose payment_status is still OUTSTANDING."

  - id: ERR_ACCOUNT_POSTURE_BLOCKED
    http: 409
    condition: "The water bank account's posture is RESTRICTED or FROZEN and the operation requires an OPEN account (lease creation, lease activation, deposit)."

  - id: ERR_VIOLATION_UNRESOLVED
    http: 409
    condition: "Reinstatement is attempted while at least one ApprovalCondition on the right's applications is still VIOLATED."

  - id: ERR_WINDOW_STILL_OPEN
    http: 409
    condition: "A window-dependent operation runs too early: closing a protest period before protest_deadline, advancing a docket to EXAMINATION before claim_filing_deadline, or recording a violation before the condition's compliance_due_date."

  - id: ERR_REVISION_LIMIT_REACHED
    http: 409
    condition: "Revision is requested when the application's revision_round already equals the cap of 2."

  - id: ERR_LEASE_WINDOW_CONFLICT
    http: 409
    condition: "The requested lease window collides with an existing non-terminal lease on the same water right at a DIFFERENT point of diversion once the 7-day fallow buffer is applied (calculations.right_lease_exclusion_window); same-headgate pairs are judged by aggregate rate instead."

  - id: ERR_POD_CAPACITY_EXCEEDED
    http: 409
    condition: "The requested diversion_rate_cfs plus the rate already committed by overlapping non-terminal leases on the same point of diversion exceeds PointOfDiversion.max_rate_cfs (calculations.pod_concurrent_rate_load, half-open overlap)."

  - id: ERR_POD_NOT_AUTHORIZED
    http: 409
    condition: "The referenced point of diversion is PROPOSED or RETIRED; only an AUTHORIZED point of diversion can carry a lease."

  # ---- business rules ------------------------------------------------------
  - id: ERR_APPLICATION_SCOPE_INCOMPLETE
    http: 422
    condition: "The scope fields do not match application_type: the POD field must be present exactly for POINT_OF_DIVERSION_CHANGE and COMBINED, the purpose field exactly for CHANGE_OF_USE and COMBINED, the acreage field exactly for PLACE_OF_USE_CHANGE and COMBINED."

  - id: ERR_STUDY_RIGHT_MISMATCH
    http: 422
    condition: "The referenced HcuStudy belongs to a different water right than the application's water_right_id."

  - id: ERR_POD_RIGHT_MISMATCH
    http: 422
    condition: "The referenced point of diversion belongs to a different water right than the application's or lease's water_right_id."

  - id: ERR_INJURY_ANALYSIS_MISSING
    http: 422
    condition: "Publication or decision is attempted while the application has no DRAFT or FINALIZED InjuryAnalysis."

  - id: ERR_UNMITIGATED_INJURY
    http: 422
    condition: "Disposition APPROVE is attempted while the FINALIZED analysis still shows net_injury_af > 0.00 (materiality 0.01 AF); a residual injury must be carried by conditions instead."

  - id: ERR_MITIGATION_INSUFFICIENT
    http: 422
    condition: "Disposition APPROVE_WITH_CONDITIONS is attempted with a condition set whose summed required_af is below the FINALIZED analysis's net_injury_af."

  - id: ERR_INSUFFICIENT_USE_HISTORY
    http: 422
    condition: "A consumptive-use study is requested over a period containing zero admissible beneficial-use records; an empty study period is rejected rather than quantified as 0.00 AF."

  - id: ERR_NO_VERIFIED_USE_EVIDENCE
    http: 422
    condition: "Activation or field verification is attempted with no BeneficialUseRecord whose verification_source is METER or AERIAL_IMAGERY."

  - id: ERR_FORFEITURE_NOT_ELIGIBLE
    http: 422
    condition: "Forfeiture is declared while consecutive_nonuse_years is below the statutory threshold of 5."

  - id: ERR_PROTEST_WINDOW_CLOSED
    http: 422
    condition: "A protest is filed when the application is not in PROTEST_PERIOD or when the logical clock is at or past protest_deadline."

  - id: ERR_CLAIM_FILING_CLOSED
    http: 422
    condition: "A claim is filed when the logical clock is at or past the docket's claim_filing_deadline."

  - id: ERR_LEASE_WINDOW_TIMING
    http: 422
    condition: "Lease activation or resumption outside [lease_start_date, lease_end_date), completion before lease_end_date, or cancellation of an ACTIVE lease at or after lease_end_date."

  - id: ERR_INVALID_WINDOW
    http: 422
    condition: "lease_end_date is not strictly after lease_start_date, or study_period_end_year is before study_period_start_year."

  - id: ERR_SELF_PROTEST_FORBIDDEN
    http: 422
    condition: "The protestant_claimant_id equals the claimant that owns the protested application's water right."

  - id: ERR_SELF_OBJECTION_FORBIDDEN
    http: 422
    condition: "The objecting user's claimant owns the water right behind the objected claim."

  - id: ERR_RIGHT_NOT_BANK_ENROLLED
    http: 422
    condition: "A deposit or lease names a water right whose bank_enrolled flag is false."

  - id: ERR_TRANSFERABLE_VOLUME_EXCEEDED
    http: 422
    condition: "The requested volume exceeds the right's available transferable_af (on resubmit the budget is transferable_af + the escrow being swapped out)."

  - id: ERR_INSUFFICIENT_BANK_CREDIT
    http: 422
    condition: "The lease's requested_af exceeds the account's available_credit_af."

  - id: ERR_RECOMMENDATION_EXCEEDS_CLAIM
    http: 422
    condition: "examiner_recommended_af is negative or exceeds AdjudicationClaim.claimed_af."

  - id: ERR_OFFSET_EXCEEDS_CLAIM
    http: 422
    condition: "stipulated_offset_af is not > 0.00 or exceeds Protest.claimed_injury_af on the NEGOTIATION track."

  - id: ERR_DOCKET_CHILDREN_NOT_READY
    http: 422
    condition: "The docket's claims do not satisfy the compound gate for the requested target_phase (no claims for EXAMINATION, a claim still FILED for OBJECTION_PERIOD, a claim not yet DECREED for DECREE_ENTERED)."

# =============================================================================
# §1.7 RBAC Matrix — role model: segregation_of_duties.
# The chain is Claimant (applicant of record) -> WaterRightsAnalyst (technical
# documentation and quantification) -> HearingOfficer (protest adjudication) ->
# DecisionAuthority (disposition) -> BasinAdjudicator (decree docket and
# administrative sanctions). Segregation is enforced twice: structurally, by
# these role lists, and per-user, by validations priority 23, which compares the
# deciding X-User-ID against HcuStudy.certified_by_user_id and
# Protest.resolved_by_user_id.
# =============================================================================
roles:

  - name: Claimant
    description: >-
      The party of record — an individual, irrigation district, municipality or
      tribe that holds water rights, applies for transfers, protests other
      parties' transfers, pays mitigation fees, banks and leases credit, and
      files adjudication claims. Every Claimant call is ownership-scoped by
      validations priority 5 and gated on standing by priority 24.
    identity: "entity_backed:Claimant"
    exclusive_operations:
      - "POST /protests — only the protestant of record may file its own protest; agency staff cannot file one on a claimant's behalf."
    shared_operations:
      - "POST /water-rights/{id}/beneficial-use-records — reporting annual beneficial use (with WaterRightsAnalyst, BasinAdjudicator)."
      - "POST /transfer-applications, /submit, /resubmit, /withdraw — authoring and driving its own transfer applications (with WaterRightsAnalyst, BasinAdjudicator)."
      - "POST /protests/{id}/withdraw — abandoning its own protest (with BasinAdjudicator)."
      - "POST /approval-conditions/{id}/pay and /satisfy — discharging mitigation fees and compliance obligations (with BasinAdjudicator)."
      - "POST /water-bank-accounts/{id}/deposits, POST /lease-assignments, /activate, /cancel — banking and leasing its own credit (with WaterRightsAnalyst, BasinAdjudicator)."
      - "POST /adjudication-claims and /object — filing claims on its own rights and objecting to other claimants' claims (with WaterRightsAnalyst / BasinAdjudicator)."
      - "All ownership-scoped GETs, plus POST /_clock/set_current_utc."

  - name: WaterRightsAnalyst
    description: >-
      Department technical staff. Owns right documentation and priority-date
      research, points of diversion, the beneficial-use evidence ledger,
      historical consumptive-use quantification, injury analysis, field
      verification, condition enforcement and bank/lease administration. Has no
      dispositive power: an analyst can neither adjudicate a protest nor decide
      an application.
    identity: "opaque"
    exclusive_operations:
      - "POST /water-rights/{id}/hcu-studies — only technical staff may run a historical consumptive-use quantification."
      - "POST /approval-conditions/{id}/violate — only field enforcement staff may record non-compliance, which fires the condition-violation cascade."
    shared_operations:
      - "POST /claimants, POST /water-rights, /activate, /reinstate, /declare-forfeiture, POST /water-rights/{id}/points-of-diversion, POST /hcu-studies/{id}/certify (with BasinAdjudicator)."
      - "POST /water-rights/{id}/beneficial-use-records (with Claimant, BasinAdjudicator)."
      - "POST /transfer-applications, /submit, /resubmit, /withdraw, /publish, /close-protest-period, POST /transfer-applications/{id}/injury-analyses (with Claimant / HearingOfficer / BasinAdjudicator)."
      - "POST /water-bank-accounts and all lease operations including /resume and /complete (with Claimant, BasinAdjudicator)."
      - "POST /adjudication-claims, POST /adjudication-claims/{id}/verify (with Claimant / BasinAdjudicator)."
      - "All GETs (unscoped) and POST /_clock/set_current_utc."

  - name: HearingOfficer
    description: >-
      Presides over the protest phase. Routes each protest onto the negotiation
      or hearing track, resolves it, and sends over-protested applications back
      for revision. Never renders the final disposition, and any protest it
      resolves permanently disqualifies that user from deciding the affected
      application.
    identity: "opaque"
    exclusive_operations:
      - "POST /protests/{id}/route — the fork that decides whether a protest yields a volumetric offset or an approval condition."
      - "POST /protests/{id}/resolve — the only way a protest reaches RESOLVED_STIPULATED or DISMISSED by adjudication, and the source of Protest.resolved_by_user_id."
      - "POST /transfer-applications/{id}/request-revision — the only entry into the REVISION_REQUESTED leg of the application cycle."
    shared_operations:
      - "POST /transfer-applications/{id}/close-protest-period (with WaterRightsAnalyst, BasinAdjudicator)."
      - "POST /transfer-applications/{id}/injury-analyses (with WaterRightsAnalyst, BasinAdjudicator)."
      - "All GETs (unscoped) and POST /_clock/set_current_utc."

  - name: DecisionAuthority
    description: >-
      Signs the transfer disposition. Its single mutating operation is the most
      consequential in the service: it converts escrow into a permanent transfer,
      imposes and prices approval conditions, or releases escrow on denial. It is
      structurally barred from every preparatory step, and validations priority
      23 additionally bars the individual user who certified the study or
      resolved a protest on the application.
    identity: "opaque"
    exclusive_operations:
      - "POST /transfer-applications/{id}/decide — the sole disposition endpoint; no other role may approve, condition, or deny a transfer."
    shared_operations:
      - "All GETs (unscoped) and POST /_clock/set_current_utc."

  - name: BasinAdjudicator
    description: >-
      The general-stream-adjudication authority. Owns the decree docket, examiner
      recommendations, decrees and administrative standing sanctions, and acts as
      the department's administrative backstop for documentation, banking and
      leasing. It is NOT a superuser: it cannot adjudicate protests, cannot
      decide transfers, and cannot file a protest.
    identity: "opaque"
    exclusive_operations:
      - "PATCH /claimants/{id}/standing — administrative standing sanctions (BARRED) and manual standing repair."
      - "POST /decree-dockets — opening a basin adjudication docket."
      - "POST /decree-dockets/{id}/advance-phase — moving the docket through its compound child gates."
      - "POST /adjudication-claims/{id}/examine — recording the basin examiner's recommended volume."
      - "POST /adjudication-claims/{id}/decree — entering a decreed volume and re-ranking priorities."
    shared_operations:
      - "Every WaterRight, PointOfDiversion, BeneficialUseRecord and HcuStudy operation (with WaterRightsAnalyst / Claimant), except POST /water-rights/{id}/hcu-studies."
      - "POST /transfer-applications, /submit, /resubmit, /withdraw, /publish, /close-protest-period and POST /transfer-applications/{id}/injury-analyses (with WaterRightsAnalyst / Claimant / HearingOfficer)."
      - "POST /protests/{id}/withdraw, POST /approval-conditions/{id}/pay and /satisfy (with Claimant)."
      - "All WaterBankAccount and LeaseAssignment operations (with Claimant, WaterRightsAnalyst)."
      - "POST /adjudication-claims, /verify, /object (with Claimant, WaterRightsAnalyst)."
      - "All GETs (unscoped) and POST /_clock/set_current_utc."
