              payload: { property_id: "${prop_id}", outlet_code: "GRILL", outlet_name: "Harbor Grill", outlet_type: "FB_OUTLET", requires_shift_settlement: false }
              as: PropertyAdmin
              as_user_id: "u_admin_1"
              captures: { grill_id: "$.data.id" }
            - call: "POST /night-audit/business-dates"
              payload: { property_id: "${prop_id}", business_date: "2026-08-01", out_of_order_room_count: 4 }
              as: NightAuditor
              as_user_id: "u_na_1"
              captures: { bd1_id: "$.data.id" }
            - call: "POST /night-audit/outlet-tickets"
              payload: { outlet_id: "${lounge_id}", business_date_id: "${bd1_id}", ticket_number: "T-RC-1", gross_amount: 128.00, settlement_type: "CASH", opened_at: "2026-08-01T18:00:00.000Z" }
              as: OutletManager
              as_user_id: "${lounge_id}"
              captures: { ticket_id: "$.data.id" }
            - call: "POST /night-audit/outlet-tickets/${ticket_id}/close"
              payload: { transmitted_at: "2026-08-01T20:00:00.000Z" }
              as: OutletManager
              as_user_id: "${lounge_id}"
            - call: "POST /night-audit/settlement-batches"
              payload: { business_date_id: "${bd1_id}", outlet_id: "${lounge_id}", tender_type: "CASH", shift_start_at: "2026-08-01T14:00:00.000Z", shift_end_at: "2026-08-01T22:00:00.000Z", declared_amount: 100.00 }
              as: OutletManager
              as_user_id: "${lounge_id}"
              captures: { batch_id: "$.data.id" }
            - call: "POST /night-audit/business-dates/${bd1_id}/post-room-and-tax"
              payload: {}
              as: NightAuditor
              as_user_id: "u_na_1"
            - call: "POST /night-audit/business-dates/${bd1_id}/seal-charges"
              payload: {}
              as: NightAuditor
              as_user_id: "u_na_1"
            - call: "POST /night-audit/business-dates/${bd1_id}/verify-settlements"
              payload: {}
              as: NightAuditor
              as_user_id: "u_na_1"
          trigger: "POST /night-audit/settlement-batches/${batch_id}/request-recount as NightAuditor (X-User-ID u_na_1), on a batch the verify hop flagged."
          assert:
            - "Before the trigger the batch read system_amount == 160.48 (the closed ticket's total), variance_amount == -60.48 and status == \"VARIANCE_FLAGGED\"; a redeclare at that point failed 409 ERR_BATCH_NOT_AWAITING_RECOUNT."
            - "The trigger returns 200 with status == \"RECOUNT_REQUESTED\" and recount_round == 1; GET /night-audit/business-dates/${bd1_id} reads unresolved_settlement_batch_count == 1 and settlement_variance_total_amount == 0.00, because a batch out for recount contributes no variance."
            - "A second request-recount now fails 409 ERR_BATCH_NOT_FLAGGED and accept-variance fails 409 ERR_BATCH_NOT_FLAGGED too - both actions are pinned to VARIANCE_FLAGGED."
            - "POST /night-audit/settlement-batches/${batch_id}/redeclare with declared_amount 100.00 as OutletManager (X-User-ID ${lounge_id}) returns 200 with status == \"DECLARED\", variance_amount == null and recount_round still 1; an immediate second redeclare fails 409 ERR_BATCH_NOT_AWAITING_RECOUNT."
            - "The same redeclare attempted as OutletManager with X-User-ID ${grill_id} fails 403 ERR_OUTLET_SCOPE_VIOLATION."
            - "Re-running POST /night-audit/business-dates/${bd1_id}/verify-settlements on the SETTLEMENT_REVIEW date returns 200 and re-flags the batch to VARIANCE_FLAGGED with variance_amount -60.48; a second request-recount then returns 200 with recount_round == 2."
            - "After one more redeclare at 100.00 and one more re-verify the batch is VARIANCE_FLAGGED again, and a third request-recount fails 409 ERR_RECOUNT_LIMIT_REACHED because recount_round is no longer below 2 - accept-variance is then the only way out."

  - section: errors
    instances:

      - name: error_triggerable_uniqueness_codes_are_scoped_not_global
        claim_type: error_triggerable
        grounds: ["errors[ERR_DUPLICATE_BUSINESS_DATE]", "errors[ERR_DUPLICATE_OUTLET_CODE]", "errors[ERR_DUPLICATE_TICKET_NUMBER]", "validations[priority=74]"]
        distinguishing_aspect: "All three duplication codes are scoped, not global - the date is unique per property, the outlet code is unique per property, and the ticket number is unique per outlet AND business date - so each code needs both its 409 and the near-miss that must be accepted."
        test_recipe:
          setup: ["Two properties; property A carries outlets LOBBY and GRILL and business dates 2026-08-01 and 2026-08-02; one CASH ticket T-U-1 already exists on LOBBY for 2026-08-01."]
