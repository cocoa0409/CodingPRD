    roles: [SterilizationTechnician]
    code: 200
    input: [temperature_celsius, biological_indicator_passed]
    output: SterilizationCycle
    side_effects: ["status = PASSED or FAILED", "Cascades bound CartridgeLot rows to AVAILABLE or QUARANTINED", "Recomputes StoreLocation.open_incident_count and compliance_posture on failure", "Recomputes affected Piercer.eligibility_score"]

  - method: POST
    path: "/piercing-services/sterilization-cycles/{cycleId}/quarantine"
    description: "Quarantine a passed cycle and its bound lots"
    roles: [ComplianceOfficer]
    code: 200
    input: []
    output: SterilizationCycle
    side_effects: ["status = QUARANTINED", "quarantine_scope_units computed", "Cascades bound CartridgeLot rows to QUARANTINED", "Raises an IncidentReport for already-consumed units"]

  - method: POST
    path: "/piercing-services/sterilization-cycles/{cycleId}/release"
    description: "Release a quarantined cycle back to service"
    roles: [ComplianceOfficer]
    code: 200
    input: []
    output: SterilizationCycle
    side_effects: ["status = RELEASED", "Cascades bound QUARANTINED lots back to AVAILABLE"]

  - method: POST
    path: "/piercing-services/sterilization-cycles/{cycleId}/recall"
    description: "Recall a released cycle"
    roles: [ComplianceOfficer]
    code: 200
    input: []
    output: SterilizationCycle
    side_effects: ["status = QUARANTINED", "Cascades bound CartridgeLot rows to QUARANTINED"]

