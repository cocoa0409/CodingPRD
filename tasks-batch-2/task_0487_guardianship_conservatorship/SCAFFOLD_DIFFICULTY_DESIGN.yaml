# =============================================================================
# Task 0487 — Guardianship & Conservatorship (Expert)
# SCAFFOLD_DIFFICULTY_DESIGN.yaml — §1.8 Test Targeting Index
# Cross-references §1.1–§1.7 of SCAFFOLD.yaml against the nine §0.5 Difficulty
# Rules. Two instances per rule (18 total). Every setup_api_calls chain drives
# empty-DB -> the precondition using only §1.5 endpoints; all formula-derived
# asserts are precomputed literals.
#
# Common abbreviations used across recipes (each instance re-derives its own
# chain; nothing is shared implicitly):
#   - clock default is 2026-01-01T00:00:00Z (no set call needed unless noted)
#   - Judge / Petitioner / CourtExaminer / CourtClerk are opaque roles; Fiduciary
#     is entity_backed, so its as_user_id is the captured fiduciary id.
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      # ---- Instance 1: accounting reconciliation — chronological vs projection
      - name: dvc_accounting_chronological_vs_projection
        grounds:
          - calculations.accounting_reconciliation
          - calculations.projected_disbursed_cents
          - entities.AccountingReport.fields.ledger_disbursed_cents
          - entities.AccountingReport.fields.projected_disbursed_cents
          - state_machines.AccountingReport.DRAFT_to_SUBMITTED
        distinguishing_aspect: |
          On the SAME period the chronological variant ledger_disbursed_cents == 1800000
          (sum of actual DISBURSED expenditures) while the forward-looking variant
          projected_disbursed_cents == 5000000 (sum of APPROVED budget caps); the two
          numbers differ, proving dual-variant logic on the AccountingReport ledger domain.
        test_recipe:
          setup:
            - "CONSERVATORSHIP case ACTIVE, fiduciary PROFESSIONAL qualified, restricted account funded to 5,000,000"
            - "APPROVED 2026 budget caps care=2,000,000 medical=2,000,000 admin=1,000,000 (caps sum 5,000,000)"
            - "Two CARE expenditures DISBURSED in 2026: 800,000 then 1,000,000 (ledger 1,800,000)"
            - "A DRAFT 2026 accounting with reported_disbursed_cents=1,800,000"
          setup_api_calls:
            - call: "POST /gc/protected-persons"
              payload: { full_name: "Pat Ward", date_of_birth: "1948-03-02", annual_income_cents: 2000000, liquid_estate_cents: 8000000 }
              as: CourtClerk
              captures: { person_id: $.data.id }
            - call: "POST /gc/fiduciaries"
              payload: { full_name: "Pro Fid", fiduciary_kind: "PROFESSIONAL" }
              as: CourtClerk
              captures: { fid_id: $.data.id }
            - call: "POST /gc/cases"
              payload: { protected_person_id: "${person_id}", case_type: "CONSERVATORSHIP" }
              as: CourtClerk
              captures: { case_id: $.data.id }
            - call: "POST /gc/petitions"
              payload: { case_id: "${case_id}", nominated_fiduciary_id: "${fid_id}", requested_authority: "ESTATE", alleged_grounds: "diminished capacity" }
              as: Petitioner
              as_user_id: "pet-1"
              captures: { pet_id: $.data.id }
            - call: "POST /gc/petitions/${pet_id}/find-probable-cause"
              payload: {}
              as: Judge
              as_user_id: "judge-1"
            - call: "POST /gc/petitions/${pet_id}/order-evaluation"
              payload: {}
              as: Judge
              as_user_id: "judge-1"
            - call: "POST /gc/evaluations"
              payload: { petition_id: "${pet_id}", finding: "INCAPACITATED", recommended_scope: "ESTATE" }
              as: CourtExaminer
              as_user_id: "exam-1"
              captures: { eval_id: $.data.id }
            - call: "POST /gc/evaluations/${eval_id}/file"
              payload: {}
              as: CourtExaminer
              as_user_id: "exam-1"
            - call: "POST /gc/petitions/${pet_id}/grant"
              payload: {}
              as: Judge
              as_user_id: "judge-1"
            - call: "POST /gc/appointments"
              payload: { case_id: "${case_id}", fiduciary_id: "${fid_id}" }
              as: Judge
              as_user_id: "judge-1"
              captures: { appt_id: $.data.id }
            - call: "GET /gc/bonds?appointment_id=${appt_id}"
              payload: {}
              as: Judge
              as_user_id: "judge-1"
              captures: { bond_id: "$.data[0].id" }
            - call: "POST /gc/bonds/${bond_id}/post"
              payload: { posted_amount_cents: 10000000, surety_name: "Acme Surety" }
              as: Fiduciary
              as_user_id: "${fid_id}"
            - call: "POST /gc/bonds/${bond_id}/approve"
              payload: {}
              as: Judge
              as_user_id: "judge-1"
            - call: "POST /gc/appointments/${appt_id}/qualify"
              payload: {}
              as: Judge
              as_user_id: "judge-1"
            - call: "POST /gc/restricted-accounts"
              payload: { case_id: "${case_id}", institution_name: "First Trust" }
              as: Fiduciary
              as_user_id: "${fid_id}"
              captures: { acct_id: $.data.id }
            - call: "POST /gc/inventories"
              payload: { case_id: "${case_id}", real_property_cents: 0, liquid_assets_cents: 5000000, tangible_property_cents: 0 }
              as: Fiduciary
              as_user_id: "${fid_id}"
              captures: { inv_id: $.data.id }
            - call: "POST /gc/inventories/${inv_id}/file"
              payload: {}
              as: Fiduciary
              as_user_id: "${fid_id}"
            - call: "POST /gc/inventories/${inv_id}/approve"
              payload: {}
              as: Judge
              as_user_id: "judge-1"
            - call: "POST /gc/budgets"
              payload: { case_id: "${case_id}", period_year: 2026, care_cap_cents: 2000000, medical_cap_cents: 2000000, admin_cap_cents: 1000000 }
              as: Fiduciary
              as_user_id: "${fid_id}"
              captures: { budget_id: $.data.id }
            - call: "POST /gc/budgets/${budget_id}/submit"
              payload: {}
              as: Fiduciary
              as_user_id: "${fid_id}"
            - call: "GET /gc/cases/${case_id}"
              payload: {}
              as: Judge
              as_user_id: "judge-1"
              captures: { cv1: $.data.version }
            - call: "POST /gc/budgets/${budget_id}/approve"
              payload: { expected_case_version: "${cv1}" }
              as: Judge
              as_user_id: "judge-1"
            - call: "GET /gc/cases/${case_id}"
              payload: {}
              as: Fiduciary
              as_user_id: "${fid_id}"
              captures: { cv2: $.data.version }
            - call: "POST /gc/expenditures"
              payload: { case_id: "${case_id}", budget_id: "${budget_id}", category: "CARE", amount_cents: 800000, payee_name: "Caregiver A", expected_case_version: "${cv2}" }
              as: Fiduciary
              as_user_id: "${fid_id}"
              captures: { exp_a: $.data.id }
            - call: "POST /gc/expenditures/${exp_a}/disburse"
              payload: {}
              as: Fiduciary
              as_user_id: "${fid_id}"
            - call: "GET /gc/cases/${case_id}"
              payload: {}
              as: Fiduciary
              as_user_id: "${fid_id}"
              captures: { cv3: $.data.version }
            - call: "POST /gc/expenditures"
              payload: { case_id: "${case_id}", budget_id: "${budget_id}", category: "CARE", amount_cents: 1000000, payee_name: "Caregiver B", expected_case_version: "${cv3}" }
              as: Fiduciary
              as_user_id: "${fid_id}"
              captures: { exp_b: $.data.id }
            - call: "POST /gc/expenditures/${exp_b}/disburse"
              payload: {}
              as: Fiduciary
              as_user_id: "${fid_id}"
            - call: "POST /gc/accountings"
              payload: { case_id: "${case_id}", period_year: 2026, opening_balance_cents: 5000000, reported_income_cents: 0, reported_disbursed_cents: 1800000 }
              as: Fiduciary
              as_user_id: "${fid_id}"
              captures: { acct_rep_id: $.data.id }
          trigger:
            - call: "POST /gc/accountings/${acct_rep_id}/submit"
              payload: {}
              as: Fiduciary
              as_user_id: "${fid_id}"
              captures: { ledger: $.data.ledger_disbursed_cents, projected: $.data.projected_disbursed_cents, variance: $.data.variance_cents }
          assert:
            - "AccountingReport.${acct_rep_id}.ledger_disbursed_cents == 1800000"
            - "AccountingReport.${acct_rep_id}.projected_disbursed_cents == 5000000"
            - "AccountingReport.${acct_rep_id}.variance_cents == 0"
            - "ledger_disbursed_cents != projected_disbursed_cents"

      # ---- Instance 2: fiduciary fee — statutory vs public-agency cap
      - name: dvc_fiduciary_fee_statutory_vs_public_agency_cap
        grounds:
          - calculations.fiduciary_fee
          - entities.AccountingReport.fields.fiduciary_fee_cents
          - entities.Fiduciary.fields.fiduciary_kind
          - state_machines.AccountingReport.DRAFT_to_SUBMITTED
        distinguishing_aspect: |
          For identical base (opening 20,000,000 + income 5,000,000) the statutory variant
          yields fiduciary_fee_cents == 1000000 for a PROFESSIONAL fiduciary, but the
          public_agency_capped variant yields fiduciary_fee_cents == 300000 for a PUBLIC_AGENCY
          fiduciary — divergence lives on the Fiduciary fee domain, distinct from instance 1's ledger domain.
        test_recipe:
          setup:
            - "Two independent CONSERVATORSHIP cases, ACTIVE, each with a DRAFT 2026 accounting opening 20,000,000 income 5,000,000"
            - "Case 1 fiduciary kind PROFESSIONAL; Case 2 fiduciary kind PUBLIC_AGENCY"
          setup_api_calls:
            # --- Case 1: PROFESSIONAL ---
            - call: "POST /gc/protected-persons"
              payload: { full_name: "Sub One", date_of_birth: "1950-01-01", annual_income_cents: 0, liquid_estate_cents: 8000000 }
              as: CourtClerk
              captures: { p1: $.data.id }
            - call: "POST /gc/fiduciaries"
              payload: { full_name: "Pro Fid", fiduciary_kind: "PROFESSIONAL" }
              as: CourtClerk
              captures: { f1: $.data.id }
            - call: "POST /gc/cases"
              payload: { protected_person_id: "${p1}", case_type: "CONSERVATORSHIP" }
              as: CourtClerk
              captures: { c1: $.data.id }
            - call: "POST /gc/petitions"
              payload: { case_id: "${c1}", nominated_fiduciary_id: "${f1}", requested_authority: "ESTATE", alleged_grounds: "g" }
              as: Petitioner
              as_user_id: "pet-1"
              captures: { pet1: $.data.id }
            - call: "POST /gc/petitions/${pet1}/find-probable-cause"
              payload: {}
              as: Judge
              as_user_id: "judge-1"
            - call: "POST /gc/petitions/${pet1}/order-evaluation"
              payload: {}
              as: Judge
              as_user_id: "judge-1"
            - call: "POST /gc/evaluations"
              payload: { petition_id: "${pet1}", finding: "INCAPACITATED", recommended_scope: "ESTATE" }
              as: CourtExaminer
              as_user_id: "exam-1"
              captures: { ev1: $.data.id }
            - call: "POST /gc/evaluations/${ev1}/file"
              payload: {}
              as: CourtExaminer
              as_user_id: "exam-1"
            - call: "POST /gc/petitions/${pet1}/grant"
              payload: {}
              as: Judge
              as_user_id: "judge-1"
            - call: "POST /gc/appointments"
              payload: { case_id: "${c1}", fiduciary_id: "${f1}" }
              as: Judge
              as_user_id: "judge-1"
              captures: { a1: $.data.id }
            - call: "GET /gc/bonds?appointment_id=${a1}"
              payload: {}
              as: Judge
              as_user_id: "judge-1"
              captures: { b1: "$.data[0].id" }
            - call: "POST /gc/bonds/${b1}/post"
              payload: { posted_amount_cents: 10000000, surety_name: "Acme" }
              as: Fiduciary
              as_user_id: "${f1}"
            - call: "POST /gc/bonds/${b1}/approve"
              payload: {}
              as: Judge
              as_user_id: "judge-1"
            - call: "POST /gc/appointments/${a1}/qualify"
              payload: {}
              as: Judge
              as_user_id: "judge-1"
            - call: "POST /gc/accountings"
              payload: { case_id: "${c1}", period_year: 2026, opening_balance_cents: 20000000, reported_income_cents: 5000000, reported_disbursed_cents: 0 }
              as: Fiduciary
              as_user_id: "${f1}"
              captures: { ar1: $.data.id }
            # --- Case 2: PUBLIC_AGENCY ---
            - call: "POST /gc/protected-persons"
              payload: { full_name: "Sub Two", date_of_birth: "1951-02-02", annual_income_cents: 0, liquid_estate_cents: 8000000 }
              as: CourtClerk
              captures: { p2: $.data.id }
            - call: "POST /gc/fiduciaries"
              payload: { full_name: "Public Agency", fiduciary_kind: "PUBLIC_AGENCY" }
              as: CourtClerk
              captures: { f2: $.data.id }
            - call: "POST /gc/cases"
              payload: { protected_person_id: "${p2}", case_type: "CONSERVATORSHIP" }
              as: CourtClerk
              captures: { c2: $.data.id }
            - call: "POST /gc/petitions"
              payload: { case_id: "${c2}", nominated_fiduciary_id: "${f2}", requested_authority: "ESTATE", alleged_grounds: "g" }
              as: Petitioner
              as_user_id: "pet-2"
              captures: { pet2: $.data.id }
            - call: "POST /gc/petitions/${pet2}/find-probable-cause"
              payload: {}
              as: Judge
              as_user_id: "judge-1"
            - call: "POST /gc/petitions/${pet2}/order-evaluation"
              payload: {}
              as: Judge
              as_user_id: "judge-1"
            - call: "POST /gc/evaluations"
              payload: { petition_id: "${pet2}", finding: "INCAPACITATED", recommended_scope: "ESTATE" }
              as: CourtExaminer
              as_user_id: "exam-1"
              captures: { ev2: $.data.id }
            - call: "POST /gc/evaluations/${ev2}/file"
              payload: {}
              as: CourtExaminer
              as_user_id: "exam-1"
            - call: "POST /gc/petitions/${pet2}/grant"
              payload: {}
              as: Judge
              as_user_id: "judge-1"
            - call: "POST /gc/appointments"
              payload: { case_id: "${c2}", fiduciary_id: "${f2}" }
              as: Judge
              as_user_id: "judge-1"
              captures: { a2: $.data.id }
            - call: "GET /gc/bonds?appointment_id=${a2}"
              payload: {}
              as: Judge
              as_user_id: "judge-1"
              captures: { b2: "$.data[0].id" }
            - call: "POST /gc/bonds/${b2}/post"
              payload: { posted_amount_cents: 10000000, surety_name: "Acme" }
              as: Fiduciary
              as_user_id: "${f2}"
            - call: "POST /gc/bonds/${b2}/approve"
              payload: {}
              as: Judge
              as_user_id: "judge-1"
            - call: "POST /gc/appointments/${a2}/qualify"
              payload: {}
              as: Judge
              as_user_id: "judge-1"
            - call: "POST /gc/accountings"
              payload: { case_id: "${c2}", period_year: 2026, opening_balance_cents: 20000000, reported_income_cents: 5000000, reported_disbursed_cents: 0 }
              as: Fiduciary
              as_user_id: "${f2}"
              captures: { ar2: $.data.id }
          trigger:
            - call: "POST /gc/accountings/${ar1}/submit"
              payload: {}
              as: Fiduciary
              as_user_id: "${f1}"
              captures: { fee1: $.data.fiduciary_fee_cents }
            - call: "POST /gc/accountings/${ar2}/submit"
              payload: {}
              as: Fiduciary
              as_user_id: "${f2}"
              captures: { fee2: $.data.fiduciary_fee_cents }
          assert:
            - "AccountingReport.${ar1}.fiduciary_fee_cents == 1000000"
            - "AccountingReport.${ar2}.fiduciary_fee_cents == 300000"
            - "fiduciary_fee_cents for PROFESSIONAL != fiduciary_fee_cents for PUBLIC_AGENCY on identical base"

  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      # ---- Instance 1: mode (a) — bond sizing, 3 inputs, nested min/max, tiers
      - name: cf_bond_tiered_nested_minmax
        grounds:
          - calculations.bond_amount_required
          - entities.Bond.fields.required_amount_cents
          - entities.ProtectedPerson.fields.liquid_estate_cents
          - entities.ProtectedPerson.fields.annual_income_cents
          - entities.GuardianshipCase.fields.case_type
        distinguishing_aspect: |
          Mode (a): required_amount_cents combines THREE inputs (liquid_estate_cents 12,000,000,
          annual_income_cents 3,000,000, case_type PLENARY) through nested min/max banding
          (core min cap 10,000,000 at 1.00x, excess 5,000,000 at 1.10x) plus a PLENARY reserve,
          yielding 16,500,000 — non-linear interaction of all three inputs.
        test_recipe:
          setup:
            - "PLENARY case in AWAITING_APPOINTMENT for a person with liquid_estate 12,000,000 and income 3,000,000"
            - "An appointment exists, which auto-created a Bond in REQUIRED"
          setup_api_calls:
            - call: "POST /gc/protected-persons"
              payload: { full_name: "Rich Ward", date_of_birth: "1940-05-05", annual_income_cents: 3000000, liquid_estate_cents: 12000000 }
              as: CourtClerk
              captures: { person_id: $.data.id }
            - call: "POST /gc/fiduciaries"
              payload: { full_name: "Fam Fid", fiduciary_kind: "FAMILY" }
              as: CourtClerk
              captures: { fid_id: $.data.id }
            - call: "POST /gc/cases"
              payload: { protected_person_id: "${person_id}", case_type: "PLENARY" }
              as: CourtClerk
              captures: { case_id: $.data.id }
            - call: "POST /gc/petitions"
              payload: { case_id: "${case_id}", nominated_fiduciary_id: "${fid_id}", requested_authority: "BOTH", alleged_grounds: "g" }
              as: Petitioner
              as_user_id: "pet-1"
              captures: { pet_id: $.data.id }
            - call: "POST /gc/petitions/${pet_id}/find-probable-cause"
              payload: {}
              as: Judge
              as_user_id: "judge-1"
            - call: "POST /gc/petitions/${pet_id}/order-evaluation"
              payload: {}
              as: Judge
              as_user_id: "judge-1"
            - call: "POST /gc/evaluations"
              payload: { petition_id: "${pet_id}", finding: "INCAPACITATED", recommended_scope: "BOTH" }
              as: CourtExaminer
              as_user_id: "exam-1"
              captures: { eval_id: $.data.id }
            - call: "POST /gc/evaluations/${eval_id}/file"
              payload: {}
              as: CourtExaminer
              as_user_id: "exam-1"
            - call: "POST /gc/petitions/${pet_id}/grant"
              payload: {}
              as: Judge
              as_user_id: "judge-1"
            - call: "POST /gc/appointments"
              payload: { case_id: "${case_id}", fiduciary_id: "${fid_id}" }
              as: Judge
              as_user_id: "judge-1"
              captures: { appt_id: $.data.id }
          trigger:
            - call: "GET /gc/bonds?appointment_id=${appt_id}"
              payload: {}
              as: Judge
              as_user_id: "judge-1"
              captures: { req_amt: "$.data[0].required_amount_cents" }
          assert:
            - "Bond.required_amount_cents == 16500000"

      # ---- Instance 2: mode (b) — fiduciary fee rounding order matters
      - name: cf_fiduciary_fee_round_per_band_then_sum
        grounds:
          - calculations.fiduciary_fee
          - entities.AccountingReport.fields.fiduciary_fee_cents
          - state_machines.AccountingReport.DRAFT_to_SUBMITTED
        distinguishing_aspect: |
          Mode (b): for base 20,000,007 the pinned round-per-band-then-sum order gives
          fiduciary_fee_cents == 850001 (250000 + 600000 + 1), whereas the forbidden
          sum-then-round order would give 850000 — the scaffold pins per-band rounding and
          the implementation must reproduce the 1-cent difference.
        test_recipe:
          setup:
            - "CONSERVATORSHIP case ACTIVE with PROFESSIONAL fiduciary; DRAFT 2026 accounting opening 20,000,000 income 7"
          setup_api_calls:
            - call: "POST /gc/protected-persons"
              payload: { full_name: "Edge Ward", date_of_birth: "1942-06-06", annual_income_cents: 0, liquid_estate_cents: 8000000 }
              as: CourtClerk
              captures: { person_id: $.data.id }
            - call: "POST /gc/fiduciaries"
              payload: { full_name: "Pro Fid", fiduciary_kind: "PROFESSIONAL" }
              as: CourtClerk
              captures: { fid_id: $.data.id }
            - call: "POST /gc/cases"
              payload: { protected_person_id: "${person_id}", case_type: "CONSERVATORSHIP" }
              as: CourtClerk
              captures: { case_id: $.data.id }
            - call: "POST /gc/petitions"
              payload: { case_id: "${case_id}", nominated_fiduciary_id: "${fid_id}", requested_authority: "ESTATE", alleged_grounds: "g" }
              as: Petitioner
              as_user_id: "pet-1"
              captures: { pet_id: $.data.id }
            - call: "POST /gc/petitions/${pet_id}/find-probable-cause"
              payload: {}
              as: Judge
              as_user_id: "judge-1"
            - call: "POST /gc/petitions/${pet_id}/order-evaluation"
              payload: {}
              as: Judge
              as_user_id: "judge-1"
            - call: "POST /gc/evaluations"
              payload: { petition_id: "${pet_id}", finding: "INCAPACITATED", recommended_scope: "ESTATE" }
              as: CourtExaminer
              as_user_id: "exam-1"
              captures: { eval_id: $.data.id }
            - call: "POST /gc/evaluations/${eval_id}/file"
              payload: {}
              as: CourtExaminer
              as_user_id: "exam-1"
            - call: "POST /gc/petitions/${pet_id}/grant"
              payload: {}
              as: Judge
              as_user_id: "judge-1"
            - call: "POST /gc/appointments"
              payload: { case_id: "${case_id}", fiduciary_id: "${fid_id}" }
              as: Judge
              as_user_id: "judge-1"
              captures: { appt_id: $.data.id }
            - call: "GET /gc/bonds?appointment_id=${appt_id}"
              payload: {}
              as: Judge
              as_user_id: "judge-1"
              captures: { bond_id: "$.data[0].id" }
            - call: "POST /gc/bonds/${bond_id}/post"
              payload: { posted_amount_cents: 10000000, surety_name: "Acme" }
              as: Fiduciary
              as_user_id: "${fid_id}"
            - call: "POST /gc/bonds/${bond_id}/approve"
              payload: {}
              as: Judge
              as_user_id: "judge-1"
            - call: "POST /gc/appointments/${appt_id}/qualify"
              payload: {}
              as: Judge
              as_user_id: "judge-1"
            - call: "POST /gc/accountings"
              payload: { case_id: "${case_id}", period_year: 2026, opening_balance_cents: 20000000, reported_income_cents: 7, reported_disbursed_cents: 0 }
              as: Fiduciary
              as_user_id: "${fid_id}"
              captures: { acct_rep_id: $.data.id }
          trigger:
            - call: "POST /gc/accountings/${acct_rep_id}/submit"
              payload: {}
              as: Fiduciary
              as_user_id: "${fid_id}"
              captures: { fee: $.data.fiduciary_fee_cents }
          assert:
            - "AccountingReport.${acct_rep_id}.fiduciary_fee_cents == 850001"

  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:
      # ---- Instance 1: Petition branching fork (GRANTED vs DISMISSED)
      - name: nlsm_petition_branch_grant_vs_dismiss
        grounds:
          - state_machines.Petition.READY_FOR_HEARING_to_GRANTED
          - state_machines.Petition.READY_FOR_HEARING_to_DISMISSED
          - entities.GuardianshipCase.fields.status
          - entities.ProtectedPerson.fields.capacity_status
        distinguishing_aspect: |
          From READY_FOR_HEARING the Petition forks: GRANT drives case to AWAITING_APPOINTMENT and
          person to ADJUDICATED_INCAPACITATED, while DISMISS (the other branch) drives case to
          TERMINATED and person.active_case_id to null — divergent side-effect sets per branch on the Petition entity.
