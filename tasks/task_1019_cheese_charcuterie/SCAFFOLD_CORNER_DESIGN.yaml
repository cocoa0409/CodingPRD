            - { call: "POST /api/orders/${o}/lines", payload: { line_type: "PRODUCT", product_id: "${p}", requested_weight_g: 300 }, as: CounterStaff, captures: { ln1: "$.data.id" } }
            - { call: "POST /api/orders/${o}/lines", payload: { line_type: "PRODUCT", product_id: "${p}", requested_weight_g: 300 }, as: CounterStaff, captures: { ln2: "$.data.id" } }
            - { call: "GET /api/lots/${l}", payload: {}, as: CounterStaff, captures: { lv: "$.data.version" } }
            - { call: "POST /api/order-lines/${ln1}/allocate", payload: { lot_id: "${l}", expected_lot_version: "${lv}" }, as: CounterStaff }
