      - name: virtual_sessions_touch_without_teacher_conflict_yet_violate_the_case_gap_rule
        grounds:
          - validations.priority_13.ERR_SESSION_GAP_TOO_SHORT
          - validations.priority_13.ERR_TEACHER_SLOT_CONFLICT
          - entities.EntitlementRule.fields.min_gap_minutes
        distinguishing_aspect: |
          With travel_buffer_minutes 0 the teacher's busy intervals are exactly [start,end), so a session
          starting the instant the previous one ends produces no teacher conflict - yet the same pair
          violates the per-case same-day gap rule, whose closed-interval comparison treats touching
          endpoints as a zero-minute gap. Shifting the start by ten minutes yields a gap of exactly
          min_gap_minutes, which passes and lands the day on exactly max_daily_minutes (180). This is the
          mirror image of the travel-buffer instance: there the buffer created a conflict where the clock
          showed none; here the clock shows contact but the buffer-free teacher rule is silent.
