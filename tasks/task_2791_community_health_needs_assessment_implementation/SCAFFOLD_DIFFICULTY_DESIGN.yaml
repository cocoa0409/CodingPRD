            - "compensation exact: PartnershipAgreement.${agr}.funded_cents == 0 and funding_state == RELEASED — an effect applied by the adoption cascade, undone by the release endpoint"
            - "PartnershipAgreement.${agr}.pledged_cents == 2000000 and signature_state == EXECUTED are untouched by the release"
            - "no drift elsewhere: StrategyObjective status stays ACTIVE, ImplementationStrategy.${strat}.approval_state == APPROVED and execution_state == ON_TRACK, AssessmentCycle.${cyc}.status == ADOPTED with posture OPEN and review_flag_count == 0"

      - name: posting_void_restores_report_totals_identity
        grounds:
          - state_machines.ExpensePosting.POSTED_to_VOID
          - calculations.report_category_totals
          - calculations.report_indirect_and_grand_total
          - validations.priority_7.ERR_SEGREGATION_OF_DUTIES
        distinguishing_aspect: |
          Voiding a posting must rewind six derived report fields to the exact
          integers they held before that posting existed — including the
          overhead tier, which is re-selected from the reduced base rather than
          simply having its previous indirect allocation subtracted. The void
          also has to be performed by a different user than the one who posted,
          and the VOID row must stay excluded from every total afterwards, to
          the point where an all-void report is treated as empty.
        test_recipe:
          setup:
            - "AssessmentCycle in DATA_COLLECTION with posture OPEN, prior_year_cost_to_charge_ratio 0.3200 and total_operating_expense_cents 120000000"
            - "one OPEN CommunityBenefitReport created by user u_officer_1, valuation_basis PROVISIONAL"
            - "posting P1: FINANCIAL_ASSISTANCE with charges_cents 1234567 -> valued_cents 395061"
            - "posting P2: COMMUNITY_HEALTH_IMPROVEMENT with direct_cost_cents 850000 -> valued_cents 850000"
            - "so total_valued_cents 1245061, overhead_rate 0.05, indirect_allocation_cents 62253, grand_total_cents 1307314, benefit_pct_of_expense 1.09"
          setup_api_calls:
            - call: "POST /assessment-cycles"
              payload: { fiscal_year: 2026, service_area_name: "Riverbend County", prior_year_cost_to_charge_ratio: 0.3200, total_operating_expense_cents: 120000000 }
              as: CommunityBenefitOfficer
              captures: { cyc: $.data.id }
            - call: "POST /assessment-cycles/${cyc}/advance"
              payload: { to_status: "DATA_COLLECTION" }
              as: CommunityBenefitOfficer
            - call: "POST /community-benefit-reports"
              payload: { cycle_id: "${cyc}", fiscal_year: 2026 }
              as: CommunityBenefitOfficer
              as_user_id: "u_officer_1"
              captures: { rep: $.data.id, rep_v1: $.data.version }
            - call: "POST /expense-postings"
              payload: { report_id: "${rep}", category: "FINANCIAL_ASSISTANCE", charges_cents: 1234567, direct_cost_cents: 0, expected_report_version: "${rep_v1}" }
              as: CommunityBenefitOfficer
              as_user_id: "u_officer_1"
              captures: { pos1: $.data.id }
            - call: "GET /community-benefit-reports/${rep}"
              payload: {}
              as: CommunityBenefitOfficer
              captures: { rep_v2: $.data.version }
            - call: "POST /expense-postings"
              payload: { report_id: "${rep}", category: "COMMUNITY_HEALTH_IMPROVEMENT", charges_cents: 0, direct_cost_cents: 850000, expected_report_version: "${rep_v2}" }
              as: CommunityBenefitOfficer
              as_user_id: "u_officer_1"
              captures: { pos2: $.data.id }
          trigger:
            - call: "POST /expense-postings/${pos2}/void"
              payload: { reason: "Grant expense reclassified to the operating budget" }
              as: ComplianceOfficer
              as_user_id: "u_compliance_1"
            - call: "POST /expense-postings/${pos2}/void"
              payload: { reason: "Duplicate void attempt" }
              as: ComplianceOfficer
              as_user_id: "u_compliance_1"
            - call: "POST /expense-postings/${pos1}/void"
              payload: { reason: "Self-void attempt by the posting user" }
              as: CommunityBenefitOfficer
              as_user_id: "u_officer_1"
            - call: "POST /expense-postings/${pos1}/void"
              payload: { reason: "Charity care case reopened and rebilled" }
              as: ComplianceOfficer
              as_user_id: "u_compliance_1"
            - call: "POST /community-benefit-reports/${rep}/finalize"
              payload: { audited_cost_to_charge_ratio: 0.2800 }
              as: ComplianceOfficer
              as_user_id: "u_compliance_1"
          assert:
            - "trigger call 1: HTTP 200, ExpensePosting.${pos2}.status == VOID with voided_by_user_id == \"u_compliance_1\""
            - "compensation exact after call 1: CommunityBenefitReport.${rep}.community_health_improvement_cents == 0, financial_assistance_cents == 395061, total_valued_cents == 395061, overhead_rate == 0.05, indirect_allocation_cents == 19753, grand_total_cents == 414814, benefit_pct_of_expense == 0.35 — every figure is exactly what it was before P2 existed, with the tier re-selected from the reduced base rather than the old allocation being subtracted"
            - "trigger call 2: HTTP 409 with error_id ERR_INVALID_STATE — VOID is terminal, so the totals are not credited twice"
            - "trigger call 3: HTTP 403 with error_id ERR_SEGREGATION_OF_DUTIES — u_officer_1 posted P1 and may not void it"
            - "after call 3: ExpensePosting.${pos1}.status == POSTED and total_valued_cents still 395061"
            - "trigger call 4: HTTP 200, total_valued_cents == 0, indirect_allocation_cents == 0, grand_total_cents == 0, benefit_pct_of_expense == 0.00 — the report is back to its just-created figures"
            - "trigger call 5: HTTP 409 with error_id ERR_REPORT_EMPTY — both postings are retained as VOID rows but neither counts as content"
            - "CommunityBenefitReport.${rep}.status == OPEN, valuation_basis == PROVISIONAL and cost_to_charge_ratio == 0.3200 after all five calls"
