              as: AgencyOperations
            - call: "POST /toll/toll-transactions"
              payload: { plate_number: "UNREG4", plate_state: "PA", away_agency_id: "${away_id}", plaza_code: "P1", trip_timestamp: "2026-09-01T09:30:00Z", is_peak: false, idempotency_key: "u4" }
              as: AgencyOperations
            - call: "GET /toll/image-bills"
              payload: { status: "PENDING_LOOKUP" }
              as: PlateLookupAgent
              captures: { b3: "$.data[0].id", b4: "$.data[1].id" }
            - call: "POST /toll/image-bills/${b3}/resolve"
              payload: {}
              as: PlateLookupAgent
            - call: "POST /toll/image-bills/${b4}/resolve"
              payload: {}
              as: PlateLookupAgent
            - call: "GET /toll/violations"
              payload: {}
              as: ViolationsOfficer
              captures: { vt: "$.data[0].id", vs: "$.data[1].id" }
            - call: "POST /toll/violations/${vt}/issue_notice"
              payload: {}
              as: ViolationsOfficer
            - call: "POST /toll/violations/${vs}/issue_notice"
              payload: {}
              as: ViolationsOfficer
            - call: "POST /toll/_clock/advance_day"
              payload: { days: 5 }
              as: SettlementOfficer
            - call: "POST /toll/violations/${vs}/pay"
              payload: {}
              as: ViolationsOfficer
            - call: "POST /toll/_clock/advance_day"
              payload: { days: 5 }
              as: SettlementOfficer
          trigger:
            - call: "POST /toll/violations/${vt}/issue_notice"
              payload: {}
              as: ViolationsOfficer
              captures: { err1: "$.data.error_id" }
            - call: "POST /toll/violations/${vs}/issue_notice"
              payload: {}
              as: ViolationsOfficer
              captures: { err2: "$.data.error_id" }
          assert:
            - "first trigger error_id == ERR_NOTICE_TOO_SOON (only 10 days elapsed, temporal check fires on a NOTICED violation)"
            - "second trigger error_id == ERR_INVALID_STATE_TRANSITION (state priority 4 evaluated before the temporal check on the PAID violation)"

