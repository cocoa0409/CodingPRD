# =============================================================================
# §1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# Task: task_3018_store_veterinary_hospital_integration_pet_care_center
#
# Breadth probe over every testable claim the §1.1–§1.7 surface declares that
# SCAFFOLD_DIFFICULTY_DESIGN.yaml does not already exercise. Corners already
# covered there appear as `excluded_because:` stubs with no test_recipe.
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:

      - name: store_create_mints_derived_fields_and_starts_open
        claim_type: Creation
        grounds:
          - entities.Store
          - endpoints.POST_/stores
        distinguishing_aspect: "A store created with only the five declared inputs comes back 201 with hospital_posture OPEN, every counter at 0, pharmacy_hold_until null and version 1 — none of those are client-supplied."
        test_recipe:
          setup:
            - "Logical clock at its untouched default of 2026-09-01T00:00:00Z. Empty database."
          setup_api_calls: []
          trigger:
            - call: "POST /stores"
              payload: { store_code: "ST-1001", city: "Reno", state_code: "NY", service_bay_count: 3, hospital_capacity: 4 }
              as: PlatformAdmin
              captures: { s1: $.data.id }
          assert:
            - "the response status is 201 and response_type is object"
            - "Store.${s1}.store_code == \"ST-1001\" and state_code == \"NY\" and hospital_capacity == 4"
            - "Store.${s1}.hospital_posture == OPEN and hospital_occupancy == 0"
            - "Store.${s1}.frozen_vaccination_clinics == 0 and restricted_training_slots_pending == 0 and stores_held_total == 0"
            - "Store.${s1}.cross_sell_credit_balance_cents == 0 and incident_risk_index == 0"
            - "Store.${s1}.pharmacy_hold_until is null and version == 1"
            - "meta.api_request_id and meta.api_request_timestamp are present"

      - name: pet_create_ignores_client_supplied_risk_and_expiry
        claim_type: Computed Fields
        grounds:
          - entities.Pet
          - endpoints.POST_/stores/pets
        distinguishing_aspect: "risk_score and rabies_vaccination_expires_at are server-computed: a freshly created pet reads back risk_score 0 and a null expiry, and neither field is accepted as input."
        test_recipe:
          setup:
            - "Logical clock 2026-06-01T00:00:00Z."
            - "Store ST-1002 and member Aldous exist."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /stores"
              payload: { store_code: "ST-1002", city: "Boise", state_code: "TX", service_bay_count: 2, hospital_capacity: 3 }
              as: PlatformAdmin
              captures: { s2: $.data.id }
            - call: "POST /stores/members"
              payload: { full_name: "Aldous Pike", email: "aldous@example.com", state_code: "TX", home_store_id: "${s2}" }
              as: StoreManager
              captures: { m2: $.data.id }
          trigger:
            - call: "POST /stores/pets"
              payload: { member_id: "${m2}", name: "Nutmeg", species: "FELINE", breed: "Maine Coon", weight_kg: 6.2 }
              as: GroomingStaff
              captures: { p2: $.data.id }
          assert:
            - "Pet.${p2}.risk_score == 0 even though the client supplied no such field"
            - "Pet.${p2}.rabies_vaccination_expires_at is null because no certificate exists yet"
            - "Pet.${p2}.status == ACTIVE and version == 1"

      - name: breed_handling_rule_is_immutable_and_has_no_version
        claim_type: Immutability
        grounds:
          - entities.BreedHandlingRule
          - endpoints.POST_/breed-handling-rules
        distinguishing_aspect: "BreedHandlingRule declares common_fields false, so it carries only id and created_at and exposes no version field or mutation surface."
        test_recipe:
          setup:
            - "Logical clock 2026-06-01T00:00:00Z. Store ST-1003 exists."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /stores"
              payload: { store_code: "ST-1003", city: "Provo", state_code: "FL", service_bay_count: 2, hospital_capacity: 3 }
              as: PlatformAdmin
              captures: { s3: $.data.id }
          trigger:
            - call: "POST /breed-handling-rules"
              payload: { breed: "Akita", species: "CANINE", risk_points: 20, handling_tier: "SENSITIVE", allowed_for_grooming: true }
              as: PlatformAdmin
              captures: { r3: $.data.id }
          assert:
            - "the response carries id and created_at but no updated_at and no version field"
            - "BreedHandlingRule.${r3}.allowed_for_grooming == true and risk_points == 20"

      - name: store_not_found_on_a_descendant_path_identifier
        claim_type: Not Found
        grounds:
          - errors[ERR_STORE_NOT_FOUND]
          - validations[priority=3]
          - endpoints.GET_/stores/{storeId}/service-bays/{bayId}
        distinguishing_aspect: "Left-to-right existence validation: a well-formed but unknown storeId is rejected at priority 3 with 404 ERR_STORE_NOT_FOUND before any bay lookup runs."
        test_recipe:
          setup:
            - "Logical clock 2026-06-01T00:00:00Z. No store exists."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "GET /stores/11111111-2222-3333-4444-555555555555/service-bays/99999999-8888-7777-6666-555555555555"
              payload: {}
              as: Any
              captures: { err_code: $.data.error_id }
          assert:
            - "the response is 404 with error_id ERR_STORE_NOT_FOUND"
            - "the error body carries only error_id and message and no partial entity payload"

      - name: service_bay_code_uniqueness_within_a_store
        claim_type: Type Constraints
        grounds:
          - errors[ERR_BAY_CODE_DUPLICATE]
          - validations[priority=21]
          - endpoints.POST_/stores/{storeId}/service-bays
        distinguishing_aspect: "bay_code uniqueness is scoped to the store, not global: two GROOMING bays in one store collide while the same bay_code in a second store is admitted."
        test_recipe:
          setup:
            - "Logical clock 2026-06-01T00:00:00Z. Stores ST-1004 and ST-1005 exist; ST-1004 already has one GROOMING bay."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /stores"
              payload: { store_code: "ST-1004", city: "Tacoma", state_code: "CA", service_bay_count: 2, hospital_capacity: 3 }
              as: PlatformAdmin
              captures: { s4: $.data.id }
            - call: "POST /stores"
              payload: { store_code: "ST-1005", city: "Spokane", state_code: "CA", service_bay_count: 2, hospital_capacity: 3 }
              as: PlatformAdmin
              captures: { s5: $.data.id }
            - call: "POST /stores/${s4}/service-bays"
              payload: { bay_code: "GROOMING" }
              as: StoreManager
              captures: { b4: $.data.id }
          trigger:
            - call: "POST /stores/${s4}/service-bays"
              payload: { bay_code: "GROOMING" }
              as: StoreManager
              captures: { err_code: $.data.error_id }
          assert:
            - "the response is 409 with error_id ERR_BAY_CODE_DUPLICATE"
            - "POST /stores/${s5}/service-bays with the same bay_code GROOMING succeeds with 201, because uniqueness is store-scoped"

  # ===========================================================================
  - section: state_machines
    instances:

      - name: bay_disable_rejected_while_a_booking_is_still_open
        claim_type: Precondition Enforcement
        grounds:
          - state_machines.ServiceBay.ACTIVE_to_DISABLED
          - errors[ERR_BAY_HAS_ACTIVE_BOOKINGS]
        distinguishing_aspect: "The bay cannot be disabled while it holds a booking in a non-terminal state; once that booking is completed the identical disable request succeeds."
        test_recipe:
          setup:
            - "Logical clock 2026-06-01T00:00:00Z."
            - "Store ST-1101 has a VETERINARY bay; member Bram; pet Clove."
            - "A VETERINARY booking on that bay, driven REQUESTED -> BAY_CONFIRMED -> IN_SERVICE."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /stores"
              payload: { store_code: "ST-1101", city: "Dayton", state_code: "TX", service_bay_count: 2, hospital_capacity: 3 }
              as: PlatformAdmin
              captures: { s: $.data.id }
            - call: "POST /stores/members"
              payload: { full_name: "Bram Halloway", email: "bram@example.com", state_code: "TX", home_store_id: "${s}" }
              as: StoreManager
              captures: { m: $.data.id }
            - call: "POST /stores/pets"
              payload: { member_id: "${m}", name: "Clove", species: "FELINE", breed: "Siamese", weight_kg: 3.6 }
              as: GroomingStaff
              captures: { pet: $.data.id, pet_v: $.data.version }
            - call: "POST /stores/${s}/service-bays"
              payload: { bay_code: "VETERINARY" }
              as: StoreManager
              captures: { bay: $.data.id, bay_v: $.data.version }
            - call: "POST /stores/${s}/service-bookings"
              payload: { bay_id: "${bay}", pet_id: "${pet}", service_type: "VETERINARY", starts_at: "2026-06-12T09:00:00Z", ends_at: "2026-06-12T10:00:00Z", expected_pet_version: "${pet_v}" }
              as: GroomingStaff
              captures: { bk: $.data.id, bk_v: $.data.version, bk_pv: $.data.pet_version }
            - call: "POST /stores/${s}/service-bookings/${bk}/confirm-bay"
              payload: { expected_booking_version: "${bk_v}", expected_pet_version: "${bk_pv}" }
              as: StoreManager
              captures: { bk_v2: $.data.version }
            - call: "POST /stores/${s}/service-bookings/${bk}/start-service"
              payload: { expected_booking_version: "${bk_v2}" }
              as: GroomingStaff
          trigger:
            - call: "POST /stores/${s}/service-bays/${bay}/disable"
              payload: { expected_bay_version: "${bay_v}" }
              as: StoreManager
              captures: { err_code: $.data.error_id }
          assert:
            - "the response is 409 with error_id ERR_BAY_HAS_ACTIVE_BOOKINGS"
            - "ServiceBay.${bay}.status is still ACTIVE and version is unchanged"

      - name: second_confirm_bay_after_cancellation_is_an_invalid_from
        claim_type: Invalid Transitions
        grounds:
          - state_machines.ServiceBooking.BAY_CONFIRMED_to_CANCELLED
          - errors[ERR_BOOKING_NOT_SCREENED]
          - errors[ERR_ILLEGAL_STATE_TRANSITION]
        distinguishing_aspect: "A cancelled grooming booking cannot be confirmed again because no transition is declared from CANCELLED, so the trigger is rejected with the invalid-from error rather than re-entering the pipeline."
        test_recipe:
          setup:
            - "Logical clock 2026-06-01T00:00:00Z."
            - "Store ST-1102 has a GROOMING bay; member Cora; pet Drift."
            - "A grooming booking for Drift already screened and bay-confirmed, then cancelled."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /stores"
              payload: { store_code: "ST-1102", city: "Waco", state_code: "TX", service_bay_count: 2, hospital_capacity: 3 }
              as: PlatformAdmin
              captures: { s: $.data.id }
            - call: "POST /stores/members"
              payload: { full_name: "Cora Vint", email: "cora@example.com", state_code: "TX", home_store_id: "${s}" }
              as: StoreManager
              captures: { m: $.data.id }
            - call: "POST /stores/pets"
              payload: { member_id: "${m}", name: "Drift", species: "CANINE", breed: "Whippet", weight_kg: 11.5 }
              as: GroomingStaff
              captures: { pet: $.data.id, pet_v: $.data.version }
            - call: "POST /stores/${s}/service-bays"
              payload: { bay_code: "GROOMING" }
              as: StoreManager
              captures: { bay: $.data.id }
            - call: "POST /stores/${s}/service-bookings"
              payload: { bay_id: "${bay}", pet_id: "${pet}", service_type: "GROOMING", starts_at: "2026-06-13T09:00:00Z", ends_at: "2026-06-13T10:00:00Z", expected_pet_version: "${pet_v}" }
              as: GroomingStaff
              captures: { bk: $.data.id, bk_v: $.data.version, bk_pv: $.data.pet_version }
            - call: "POST /stores/${s}/service-bookings/${bk}/screen"
              payload: { health_condition_points: 0, aggression_acknowledged: true, expected_pet_version: "${pet_v}" }
              as: GroomingStaff
              captures: { bk_v2: $.data.version, bk_pv2: $.data.pet_version }
            - call: "POST /stores/${s}/service-bookings/${bk}/confirm-bay"
              payload: { expected_booking_version: "${bk_v2}", expected_pet_version: "${bk_pv2}" }
              as: StoreManager
              captures: { bk_v3: $.data.version }
            - call: "POST /stores/${s}/service-bookings/${bk}/cancel"
              payload: { expected_booking_version: "${bk_v3}" }
              as: GroomingStaff
          trigger:
            - call: "POST /stores/${s}/service-bookings/${bk}/confirm-bay"
              payload: { expected_booking_version: "${bk_v3}", expected_pet_version: "${bk_pv2}" }
              as: StoreManager
              captures: { err_code: $.data.error_id }
          assert:
            - "the response is 409 with error_id ERR_BOOKING_NOT_SCREENED, because the only route back into BAY_CONFIRMED starts at REQUESTED or SCREENED and CANCELLED has no outbound transition"
            - "ServiceBooking.${bk}.status is still CANCELLED"

      - name: vaccination_visit_terminal_state_locks_reporting
        claim_type: Terminal State Lockdown
        grounds:
          - state_machines.VaccinationVisit.terminal_states
          - state_machines.VaccinationVisit.REGISTERED_to_BLOCKED
          - errors[ERR_VISIT_NOT_REPORTABLE]
        distinguishing_aspect: "BLOCKED is terminal, so a blocked walk-in can never be moved to REPORTED even though the same visit could be reported while it sat in REPORT_REQUIRED."
        test_recipe:
          setup:
            - "Logical clock 2026-09-21T09:00:00Z, a Monday."
            - "Store ST-1103 in CA with hospital_capacity 1; member Eero; pet Fable."
            - "An open clinic, one walk-in visit, and a CA rabies certificate already issued, so the visit sits in REPORT_REQUIRED."
            - "The store is then restricted, which blocks the visit."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-21T09:00:00Z" }
              as: PlatformAdmin
            - call: "POST /stores"
              payload: { store_code: "ST-1103", city: "Anchorage", state_code: "CA", service_bay_count: 2, hospital_capacity: 1 }
              as: PlatformAdmin
              captures: { s: $.data.id, s_v: $.data.version }
            - call: "POST /stores/members"
              payload: { full_name: "Eero Laine", email: "eero@example.com", state_code: "CA", home_store_id: "${s}" }
              as: StoreManager
              captures: { m: $.data.id }
            - call: "POST /stores/pets"
              payload: { member_id: "${m}", name: "Fable", species: "CANINE", breed: "Beagle", weight_kg: 9.8 }
              as: GroomingStaff
              captures: { pet: $.data.id }
            - call: "POST /stores/${s}/vaccination-clinics"
              payload: { clinic_date: "2026-09-21T00:00:00Z", open_time: "2026-09-21T09:00:00Z", close_time: "2026-09-21T17:00:00Z" }
              as: VaccinationStaff
              captures: { cl: $.data.id, cl_v: $.data.version }
            - call: "POST /stores/${s}/vaccination-clinics/${cl}/open-walk-ins"
              payload: { expected_clinic_version: "${cl_v}" }
              as: VaccinationStaff
            - call: "POST /stores/${s}/vaccination-visits"
              payload: { clinic_id: "${cl}", pet_id: "${pet}", vaccine_type: "RABIES" }
              as: VaccinationStaff
              captures: { vs: $.data.id, vs_v: $.data.version }
            - call: "POST /stores/${s}/vaccination-visits/${vs}/issue-certificate"
              payload: { expected_visit_version: "${vs_v}" }
              as: VaccinationStaff
              captures: { vs_v2: $.data.version }
            - call: "POST /stores/${s}/restrict"
              payload: { expected_store_version: "${s_v}" }
              as: PlatformAdmin
          trigger:
            - call: "POST /stores/${s}/vaccination-visits/${vs}/submit-state-report"
              payload: { expected_visit_version: "${vs_v2}" }
              as: ComplianceOfficer
              captures: { err_code: $.data.error_id }
          assert:
            - "the response is 409 with error_id ERR_VISIT_NOT_REPORTABLE"
            - "VaccinationVisit.${vs}.status == BLOCKED and state_report_status == NOT_REQUIRED"

      - name: prescription_authorization_initial_state_and_charge_zero_before_exam
        claim_type: Initial State
        grounds:
          - state_machines.PrescriptionAuthorization.initial_state
          - entities.VeterinaryEncounter.fields.charge_total_cents
        distinguishing_aspect: "A prescription raised against a scheduled encounter starts PENDING_EXAM with price_at_authorization_cents still 0, and the encounter's charge_total_cents stays at 0 until the exam completes."
        test_recipe:
          setup:
            - "Logical clock 2026-06-01T00:00:00Z."
            - "Store ST-1104; member Fern; pet Gus."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /stores"
              payload: { store_code: "ST-1104", city: "Billings", state_code: "NY", service_bay_count: 2, hospital_capacity: 3 }
              as: PlatformAdmin
              captures: { s: $.data.id }
            - call: "POST /stores/members"
              payload: { full_name: "Fern Ashby", email: "fern@example.com", state_code: "NY", home_store_id: "${s}" }
              as: StoreManager
              captures: { m: $.data.id }
            - call: "POST /stores/pets"
              payload: { member_id: "${m}", name: "Gus", species: "CANINE", breed: "Boxer", weight_kg: 29.0 }
              as: GroomingStaff
              captures: { pet: $.data.id }
            - call: "POST /stores/${s}/veterinary-encounters"
              payload: { pet_id: "${pet}", clinician_name: "Dr. Rowan", scheduled_at: "2026-06-15T09:00:00Z" }
              as: VeterinaryStaff
              captures: { enc: $.data.id }
          trigger:
            - call: "POST /stores/${s}/prescription-authorizations"
              payload: { pet_id: "${pet}", encounter_id: "${enc}", item_type: "MEDICATION", item_name: "Metronidazole 250mg", sku: "SKU-MET-250", unit_price_cents: 2200, quantity: 4 }
              as: VeterinaryStaff
              captures: { au: $.data.id }
          assert:
            - "PrescriptionAuthorization.${au}.status == PENDING_EXAM"
            - "PrescriptionAuthorization.${au}.price_at_authorization_cents == 0 and authorized_at is null"
            - "PrescriptionAuthorization.${au}.retail_facing == true and version == 1"
            - "VeterinaryEncounter.${enc}.charge_total_cents == 0"

      - name: package_billing_cycle_idempotent_pause_and_resume_round_trip
        claim_type: Idempotency
        grounds:
          - state_machines.ServicePackage.ACTIVE_to_PAUSED
          - state_machines.ServicePackage.PAUSED_to_ACTIVE
          - errors[ERR_PACKAGE_NOT_PAUSED]
        distinguishing_aspect: "Pause and resume are a declared round trip, but a second pause from PAUSED is rejected because PAUSED has no self-loop, so the pair is not idempotent."
        test_recipe:
          setup:
            - "Logical clock 2026-06-01T00:00:00Z."
            - "Store ST-1105; member Gil; a PLUS package."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /stores"
              payload: { store_code: "ST-1105", city: "Casper", state_code: "FL", service_bay_count: 2, hospital_capacity: 3 }
              as: PlatformAdmin
              captures: { s: $.data.id }
            - call: "POST /stores/members"
              payload: { full_name: "Gil Marchetti", email: "gil@example.com", state_code: "FL", home_store_id: "${s}" }
              as: StoreManager
              captures: { m: $.data.id }
            - call: "POST /stores/${s}/members/${m}/service-packages"
              payload: { tier: "PLUS", member_state_code: "FL", state_sales_tax_rate: 0.07, billing_cycle_count: 1, monthly_fee_cents: 0 }
              as: StoreManager
              captures: { pk: $.data.id, pk_v: $.data.version }
            - call: "POST /stores/${s}/members/${m}/service-packages/${pk}/pause"
              payload: { expected_package_version: "${pk_v}" }
              as: StoreManager
              captures: { pk_v2: $.data.version }
          trigger:
            - call: "POST /stores/${s}/members/${m}/service-packages/${pk}/pause"
              payload: { expected_package_version: "${pk_v2}" }
              as: StoreManager
              captures: { err_code: $.data.error_id }
          assert:
            - "the response is 409 with error_id ERR_PACKAGE_NOT_PAUSED, because the package is already PAUSED and no PAUSED -> PAUSED transition is declared"
            - "POST /stores/${s}/members/${m}/service-packages/${pk}/resume with expected_package_version ${pk_v2} succeeds and returns status ACTIVE"

      - name: bay_freeze_cancels_pending_bookings_and_completes_in_service_ones
        claim_type: Conditional cascade
        grounds:
          - state_machines.ServiceBay.ACTIVE_to_FROZEN
          - state_machines.ServiceBooking.BAY_CONFIRMED_to_CANCELLED
          - state_machines.ServiceBooking.IN_SERVICE_to_COMPLETED
        distinguishing_aspect: "The freeze cascade is conditional on each child's own state: a booking that is only confirmed is cancelled, while one already in service is completed instead, so one parent freeze produces two different child outcomes."
        test_recipe:
          setup:
            - "Logical clock 2026-06-01T00:00:00Z."
            - "Store ST-1106 with hospital_capacity 5 and one GROOMING bay; member Hana; pets Iggy and Juno."
            - "Iggy's booking is bay-confirmed; Juno's booking is in service."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /stores"
              payload: { store_code: "ST-1106", city: "Peoria", state_code: "CA", service_bay_count: 2, hospital_capacity: 5 }
              as: PlatformAdmin
              captures: { s: $.data.id, s_v: $.data.version }
            - call: "POST /stores/members"
              payload: { full_name: "Hana Sato", email: "hana@example.com", state_code: "CA", home_store_id: "${s}" }
              as: StoreManager
              captures: { m: $.data.id }
            - call: "POST /stores/pets"
              payload: { member_id: "${m}", name: "Iggy", species: "CANINE", breed: "Pug", weight_kg: 8.0 }
              as: GroomingStaff
              captures: { p1: $.data.id, p1_v: $.data.version }
            - call: "POST /stores/pets"
              payload: { member_id: "${m}", name: "Juno", species: "CANINE", breed: "Pug", weight_kg: 8.4 }
              as: GroomingStaff
              captures: { p2: $.data.id, p2_v: $.data.version }
            - call: "POST /stores/${s}/service-bays"
              payload: { bay_code: "GROOMING" }
              as: StoreManager
              captures: { bay: $.data.id }
            - call: "POST /stores/${s}/service-bookings"
              payload: { bay_id: "${bay}", pet_id: "${p1}", service_type: "GROOMING", starts_at: "2026-06-16T09:00:00Z", ends_at: "2026-06-16T10:00:00Z", expected_pet_version: "${p1_v}" }
              as: GroomingStaff
