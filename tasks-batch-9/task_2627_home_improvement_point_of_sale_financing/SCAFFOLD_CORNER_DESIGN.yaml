          - calculations[merchant_portfolio_performance]
        excluded_because:
          difficulty_instance: chargeback_waterfall_conserves_the_claim_across_three_buckets
          rationale: "Reconciliation here means the three waterfall buckets must sum back to the claim and the reserve/coverage/principal derived fields must agree afterwards — exactly the invariant that §1.8 instance asserts across all three buckets simultaneously; the breadth instances above only ever exercise the two-bucket and one-bucket splits."

  # ===========================================================================
  # SECTION 9 — CONSISTENCY MODEL (declared model: immediate)
  # ===========================================================================
  - section: consistency_model
    instances:

      - name: settlement_writes_are_visible_to_every_related_read_in_the_same_test
        claim_type: immediate
        grounds:
          - consistency_model[immediate]
          - state_machines.FundingDraw.REQUESTED_to_SETTLED
          - calculations[draw_settlement_economics]
          - calculations[holdback_reserve_target]
          - endpoints[GET /merchants/{id}]
          - endpoints[GET /merchants]
          - endpoints[GET /loan-accounts/{id}]
          - endpoints[GET /projects/{id}]
        distinguishing_aspect: "One settlement fans out across four aggregates, and the model is `immediate`: the very next GET of the merchant, the loan account, the project and the draw list must already carry every derived consequence (reserve 42000, coverage 10000, principal 1050000, settled_funded_cents 1050000, funded_pct_bps 3000) with no sweep, no second write and no re-read loop in between. An implementation that defers any of these to the ops sweep or recomputes them lazily on a later request fails here even though the settlement response itself looked correct."
        test_recipe:
          setup:
            - "Full enrolled-merchant pipeline with a VERIFIED milestone 1 (3000 bps of a 3500000 contract) and a REQUESTED draw of 1050000 at STANDARD_3DAY, not yet settled."
          setup_api_calls:
            - call: "POST /trade-rules"
              payload: { trade_type: "ROOFING", max_ticket_cents: 5000000, holdback_pct_bps: 500, max_precompletion_release_bps: 7000, velocity_cap_cents: 15000000, requires_completion_certificate: true, min_license_months: 6 }
              as: ProgramAdmin
              as_user_id: "pa-1"
            - call: "POST /promotion-plans"
              payload: { code: "DI12-ROOF", promotion_type: "DEFERRED_INTEREST", promo_term_months: 12, deferred_apr_bps: 2699, post_promo_apr_bps: 2699, merchant_discount_bps: 525, min_ticket_cents: 100000, max_ticket_cents: 5000000, disclosure_template_version: "DI-2026.2", allowed_trade_types: ["ROOFING", "GENERAL_REMODEL"] }
              as: ProgramAdmin
              as_user_id: "pa-1"
              captures: { plan_id: "$.data.id" }
            - call: "POST /merchants"
              payload: { legal_name: "Summit Roofing LLC", trade_type: "ROOFING", state_code: "TX", contact_email: "ops@summitroof.example" }
              as: ProgramAdmin
              as_user_id: "pa-1"
              captures: { merch_id: "$.data.id" }
            - call: "POST /merchants/${merch_id}/licenses"
              payload: { trade_type: "ROOFING", license_number: "TX-RCF-88120", state_code: "TX", effective_from: "2026-01-01", expires_on: "2027-06-30" }
              as: Merchant
              as_user_id: "${merch_id}"
              captures: { lic_id: "$.data.id" }
            - call: "POST /merchants/${merch_id}/licenses/${lic_id}/verification"
              payload: { outcome: "VERIFIED", verification_note: "State board record matched" }
              as: ProgramUnderwriter
              as_user_id: "uw-1"
            - call: "POST /merchants/${merch_id}/enrollment-submission"
              payload: { attestation_ref: "ATT-2026-0801" }
              as: Merchant
              as_user_id: "${merch_id}"
            - call: "POST /merchants/${merch_id}/enrollment-decision"
              payload: { decision: "APPROVE", decision_note: "Licence verified" }
              as: ProgramUnderwriter
              as_user_id: "uw-1"
            - call: "POST /merchants/${merch_id}/promotion-enrollments"
              payload: { promotion_plan_id: "${plan_id}", window_start_date: "2026-08-01", window_end_date: "2026-12-31", negotiated_discount_bps: 449 }
              as: ProgramUnderwriter
              as_user_id: "uw-1"
              captures: { enr_id: "$.data.id" }
            - call: "POST /consumers"
              payload: { full_name: "Dana Ruiz", ssn_last4: "4417", annual_income_cents: 9600000, fico_score: 742, state_code: "TX" }
              as: Merchant
              as_user_id: "${merch_id}"
              captures: { cons_id: "$.data.id" }
            - call: "POST /credit-applications"
              payload: { merchant_id: "${merch_id}", consumer_id: "${cons_id}", promotion_plan_id: "${plan_id}", project_amount_cents: 3500000 }
              as: Merchant
              as_user_id: "${merch_id}"
              captures: { app_id: "$.data.id" }
            - call: "POST /credit-applications/${app_id}/disclosure-delivery"
              payload: { disclosure_template_version: "DI-2026.2" }
              as: Merchant
              as_user_id: "${merch_id}"
            - call: "POST /credit-applications/${app_id}/disclosure-acknowledgement"
              payload: { consumer_signature_ref: "SIG-DANA-1" }
              as: Consumer
              as_user_id: "${cons_id}"
            - call: "POST /credit-applications/${app_id}/acceptance"
              payload: {}
              as: Consumer
              as_user_id: "${cons_id}"
            - call: "GET /loan-accounts?application_id=${app_id}"
              as: ServicingAgent
              as_user_id: "sa-1"
              captures: { loan_id: "$.data[0].id" }
            - call: "POST /projects"
              payload: { application_id: "${app_id}", scope_description: "Full roof replacement, 32 squares", contract_amount_cents: 3500000 }
              as: Merchant
              as_user_id: "${merch_id}"
              captures: { proj_id: "$.data.id" }
            - call: "POST /projects/${proj_id}/milestones"
              payload: { sequence_no: 1, name: "Tear-off and deck inspection", release_pct_bps: 3000, requires_consumer_signoff: true }
              as: Merchant
              as_user_id: "${merch_id}"
              captures: { ms1_id: "$.data.id" }
            - call: "POST /projects/${proj_id}/milestones/${ms1_id}/claim"
              payload: { evidence_ref: "PHOTO-TEAROFF-1" }
              as: Merchant
              as_user_id: "${merch_id}"
            - call: "POST /projects/${proj_id}/milestones/${ms1_id}/verification"
              payload: { outcome: "VERIFY" }
              as: Consumer
              as_user_id: "${cons_id}"
            - call: "GET /loan-accounts/${loan_id}"
              as: ServicingAgent
              as_user_id: "sa-1"
              captures: { loan_v1: "$.data.version" }
            - call: "POST /funding-draws"
              payload: { loan_account_id: "${loan_id}", project_milestone_id: "${ms1_id}", requested_amount_cents: 1050000, settlement_speed: "STANDARD_3DAY", expected_loan_account_version: "${loan_v1}" }
              as: Merchant
              as_user_id: "${merch_id}"
              captures: { draw1_id: "$.data.id" }
          trigger:
            - call: "POST /funding-draws/${draw1_id}/settlement"
              payload: { decision: "SETTLE" }
              as: ServicingAgent
              as_user_id: "sa-1"
            - call: "GET /merchants/${merch_id}"
              as: ServicingAgent
              as_user_id: "sa-1"
            - call: "GET /loan-accounts/${loan_id}"
              as: ServicingAgent
              as_user_id: "sa-1"
            - call: "GET /projects/${proj_id}"
              as: Merchant
              as_user_id: "${merch_id}"
            - call: "GET /funding-draws/${draw1_id}"
              as: Merchant
              as_user_id: "${merch_id}"
            - call: "GET /merchants?risk_tier=STANDARD"
              as: ServicingAgent
              as_user_id: "sa-1"
          assert:
            - "TRIGGER 1 (the write's own response): status SETTLED, funded_amount_cents == 1050000, merchant_discount_cents == 47145 == round_half_up(1050000 * 449 / 10000), holdback_withheld_cents == 42000 == min(base 52500, gap 42000 - 0, cap 157500), net_settlement_cents == 960855 == 1050000 - 47145 - 42000"
            - "TRIGGER 2 (immediately, no sweep): holdback_reserve_cents == 42000, holdback_target_cents == 42000 == round_half_up(1050000 * 400 / 10000), reserve_coverage_bps == 10000, status APPROVED"
            - "TRIGGER 3 (immediately): principal_balance_cents == 1050000 and version == ${loan_v1} + 1 — the settlement's parent bump is already durable to the next read"
            - "TRIGGER 4 (immediately): settled_funded_cents == 1050000 and funded_pct_bps == 3000 == round_half_up(1050000 * 10000 / 3500000), max_fundable_now_cents == 1400000 == round_half_up(3500000 * 7000 / 10000) - 1050000"
            - "TRIGGER 5 (immediately): the draw read back is byte-consistent with TRIGGER 1 — SETTLED, 47145 / 42000 / 960855, and settled_on equals the current logical clock date 2026-08-01"
            - "TRIGGER 6 (immediately, the LIST view): total_count == 1 and the single row carries funded_volume_cents == 1050000, holdback_reserve_cents == 42000, holdback_target_cents == 42000, reserve_coverage_bps == 10000, dispute_rate_bps == 0, phantom_risk_score == 0, portfolio_grade A, termination_recommended false — the derived figures are visible through the filtered collection read too, not just the single-resource read"
            - "No read is retried and no expiration sweep is invoked between the write and the reads — every assertion above is satisfied by the first read after the settlement"
