# =============================================================================
# §1.9 Scaffold Corner Design (breadth coverage of non-difficulty claims)
# =============================================================================
scaffold_corner_design:

  - section: entities
    instances:
      - name: create_product_minimal_applies_defaults
        claim_type: Defaults
        grounds: [entities.Product.fields.status, entities.Product.fields.requires_tempering]
        distinguishing_aspect: "POST /products without status/requires_tempering yields status=ACTIVE and requires_tempering=false; server-minted id/version present."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls:
            - { call: "POST /products", payload: { sku: "D-1", name: "Default SKU", product_type: "SINGLE", base_price_cents: 900, shelf_life_days: 30, unit_weight_g: 25 }, as: Admin, captures: { pid: "$.data.id" } }
          trigger:
            - { call: "GET /products/${pid}", payload: {}, as: Admin }
          assert:
            - "Product.${pid}.status == ACTIVE"
            - "Product.${pid}.requires_tempering == false"
            - "Product.${pid}.version == 1"

      - name: create_customer_wallet_defaults_zero
        claim_type: Defaults
        grounds: [entities.Customer.fields.wallet_credit_cents]
        distinguishing_aspect: "A freshly created Customer has wallet_credit_cents=0 (system field, input ignored)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls:
            - { call: "POST /customers", payload: { name: "Zero", email: "z@x.com", account_type: "RETAIL" }, as: Admin, captures: { cid: "$.data.id" } }
          trigger:
            - { call: "GET /customers/${cid}", payload: {}, as: Admin }
          assert:
            - "Customer.${cid}.wallet_credit_cents == 0"

      - name: get_product_not_found
        claim_type: Not Found
        grounds: ["errors[ERR_PRODUCT_NOT_FOUND]"]
        distinguishing_aspect: "GET /products with a non-existent UUID returns ERR_PRODUCT_NOT_FOUND (404)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - { call: "GET /products/00000000-0000-4000-8000-000000000000", payload: {}, as: Admin, captures: { err: "$.data.error_id" } }
          assert:
            - "response error_id == ERR_PRODUCT_NOT_FOUND"
            - "HTTP status == 404"

      - name: bundle_component_reverse_reachable_filtered_list
        claim_type: Listing
        grounds: [entities.BundleComponent.fields.bundle_product_id, entities.BundleComponent.fields.component_product_id]
        distinguishing_aspect: "After attaching a component, GET /bundle-components?bundle_product_id=... returns the BundleComponent[] (FK reverse-reachability, immutable junction has no version)."
        test_recipe:
          setup: ["One BUNDLE product and one SINGLE component product attached via one BundleComponent."]
          setup_api_calls:
            - { call: "POST /products", payload: { sku: "BUN-1", name: "Gift Box", product_type: "BUNDLE", base_price_cents: 3000, shelf_life_days: 30, unit_weight_g: 300 }, as: Admin, captures: { bun_id: "$.data.id" } }
            - { call: "POST /products", payload: { sku: "COMP-1", name: "Praline", product_type: "SINGLE", base_price_cents: 400, shelf_life_days: 30, unit_weight_g: 15 }, as: Admin, captures: { comp_id: "$.data.id" } }
            - { call: "POST /products/${bun_id}/bundle-components", payload: { component_product_id: "${comp_id}", quantity: 6 }, as: Admin, captures: { bc_id: "$.data.id" } }
          trigger:
            - { call: "GET /bundle-components?bundle_product_id=${bun_id}", payload: {}, as: Admin }
          assert:
            - "response array length == 1"
            - "response[0].component_product_id == ${comp_id}"
            - "response[0].quantity == 6"

  - section: state_machines
    instances:
      - name: batch_release_from_raw_when_no_tempering
        claim_type: Valid Transition
        grounds: [state_machines.Batch.RAW_to_RELEASED]
        distinguishing_aspect: "A non-tempering product's batch releases directly RAW->RELEASED and available_units becomes initial_units=80."
        test_recipe:
          setup: ["Non-tempering product; one RAW batch of 80 units."]
          setup_api_calls:
            - { call: "POST /products", payload: { sku: "NT-1", name: "No Temper", product_type: "SINGLE", base_price_cents: 700, shelf_life_days: 60, unit_weight_g: 20 }, as: Admin, captures: { pid: "$.data.id" } }
            - { call: "POST /batches", payload: { product_id: "${pid}", initial_units: 80 }, as: ProductionManager, captures: { bid: "$.data.id" } }
          trigger:
            - { call: "POST /batches/${bid}/release", payload: {}, as: ProductionManager }
          assert:
            - "Batch.${bid}.status == RELEASED"
            - "Batch.${bid}.available_units == 80"

      - name: subscription_pause_then_resume
        claim_type: Valid Transition
        grounds: [state_machines.Subscription.ACTIVE_to_PAUSED, state_machines.Subscription.PAUSED_to_ACTIVE]
        distinguishing_aspect: "A subscription toggles ACTIVE->PAUSED->ACTIVE and ends ACTIVE."
        test_recipe:
          setup: ["RETAIL customer; box product; one ACTIVE subscription."]
          setup_api_calls:
            - { call: "POST /customers", payload: { name: "Sub P", email: "subp@x.com", account_type: "RETAIL" }, as: Admin, captures: { cid: "$.data.id" } }
            - { call: "POST /products", payload: { sku: "BOX-P", name: "Box P", product_type: "SINGLE", base_price_cents: 4000, shelf_life_days: 60, unit_weight_g: 200 }, as: Admin, captures: { box_id: "$.data.id" } }
            - { call: "POST /subscriptions", payload: { customer_id: "${cid}", box_product_id: "${box_id}", cadence_days: 30, next_ship_date: "2026-08-01T00:00:00Z" }, as: Customer, as_user_id: "${cid}", captures: { sid: "$.data.id" } }
            - { call: "POST /subscriptions/${sid}/pause", payload: {}, as: Customer, as_user_id: "${cid}" }
          trigger:
            - { call: "POST /subscriptions/${sid}/resume", payload: {}, as: Customer, as_user_id: "${cid}" }
          assert:
            - "Subscription.${sid}.status == ACTIVE"

      - name: cancel_already_cancelled_order_invalid_state
        claim_type: Invalid Transitions
        grounds: ["errors[ERR_INVALID_STATE]", state_machines.Order.DRAFT_to_CANCELLED]
        distinguishing_aspect: "Cancelling an order already in CANCELLED (terminal) returns ERR_INVALID_STATE; no side effects."
        test_recipe:
          setup: ["RETAIL customer; one DRAFT order already cancelled."]
          setup_api_calls:
            - { call: "POST /customers", payload: { name: "Ret T", email: "rett@x.com", account_type: "RETAIL" }, as: Admin, captures: { cid: "$.data.id" } }
            - { call: "POST /orders", payload: { customer_id: "${cid}", order_type: "RETAIL" }, as: Customer, as_user_id: "${cid}", captures: { oid: "$.data.id" } }
            - { call: "POST /orders/${oid}/cancel", payload: {}, as: Customer, as_user_id: "${cid}" }
          trigger:
            - { call: "POST /orders/${oid}/cancel", payload: {}, as: Customer, as_user_id: "${cid}", captures: { err: "$.data.error_id" } }
          assert:
            - "response error_id == ERR_INVALID_STATE"
            - "HTTP status == 409"

      - name: preorder_fulfill_outside_window_closed
        claim_type: Precondition Enforcement
        grounds: [state_machines.Order.ALLOCATED_to_FULFILLED, "errors[ERR_FULFILLMENT_WINDOW_CLOSED]"]
        distinguishing_aspect: "A PREORDER allocated order fulfilled after fulfillment_window_end (clock 2026-07-10 > window end 2026-07-02) is rejected ERR_FULFILLMENT_WINDOW_CLOSED."
        test_recipe:
          setup: ["RETAIL customer; product with released batch; PREORDER order window 2026-07-01..2026-07-02, qty 1, confirmed and allocated; clock advanced past window."]
          setup_api_calls:
            - { call: "POST /customers", payload: { name: "Pre A", email: "prea@x.com", account_type: "RETAIL" }, as: Admin, captures: { cid: "$.data.id" } }
            - { call: "POST /products", payload: { sku: "PRE-1", name: "Pre SKU", product_type: "SINGLE", base_price_cents: 1000, shelf_life_days: 90, unit_weight_g: 40 }, as: Admin, captures: { pid: "$.data.id" } }
            - { call: "POST /batches", payload: { product_id: "${pid}", initial_units: 10 }, as: ProductionManager, captures: { bid: "$.data.id" } }
            - { call: "POST /batches/${bid}/release", payload: {}, as: ProductionManager }
            - { call: "POST /orders", payload: { customer_id: "${cid}", order_type: "PREORDER", fulfillment_window_start: "2026-07-01T00:00:00Z", fulfillment_window_end: "2026-07-02T00:00:00Z" }, as: Customer, as_user_id: "${cid}", captures: { oid: "$.data.id" } }
            - { call: "POST /orders/${oid}/lines", payload: { product_id: "${pid}", quantity: 1 }, as: Customer, as_user_id: "${cid}" }
            - { call: "POST /orders/${oid}/confirm", payload: {}, as: Customer, as_user_id: "${cid}" }
            - { call: "POST /orders/${oid}/allocate", payload: {}, as: SalesManager }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-07-10T00:00:00Z" }, as: Admin }
          trigger:
            - { call: "POST /orders/${oid}/fulfill", payload: {}, as: ProductionManager, captures: { err: "$.data.error_id" } }
          assert:
            - "response error_id == ERR_FULFILLMENT_WINDOW_CLOSED"
            - "Order.${oid}.status == ALLOCATED"

  - section: calculations
    instances:
      - name: gift_wrap_fee_added_to_total
        claim_type: Constants Applied
        grounds: [calculations.order_total, entities.Order.fields.gift_fee_cents]
        distinguishing_aspect: "A retail gift order (base 1000, qty 1) gets gift_fee_cents=500; total = 1000 + tax 73 + 500 = 1573."
        test_recipe:
          setup: ["RETAIL customer (no loyalty); product base 1000; retail order is_gift=true, one line qty 1."]
          setup_api_calls:
            - { call: "POST /customers", payload: { name: "Gift A", email: "gifta@x.com", account_type: "RETAIL" }, as: Admin, captures: { cid: "$.data.id" } }
            - { call: "POST /products", payload: { sku: "G-1", name: "G SKU", product_type: "SINGLE", base_price_cents: 1000, shelf_life_days: 30, unit_weight_g: 40 }, as: Admin, captures: { pid: "$.data.id" } }
            - { call: "POST /orders", payload: { customer_id: "${cid}", order_type: "RETAIL", is_gift: true }, as: Customer, as_user_id: "${cid}", captures: { oid: "$.data.id" } }
            - { call: "POST /orders/${oid}/lines", payload: { product_id: "${pid}", quantity: 1 }, as: Customer, as_user_id: "${cid}" }
          trigger:
            - { call: "POST /orders/${oid}/confirm", payload: {}, as: Customer, as_user_id: "${cid}" }
          assert:
            - "Order.${oid}.subtotal_cents == 1000"
            - "Order.${oid}.tax_cents == 73"
            - "Order.${oid}.gift_fee_cents == 500"
            - "Order.${oid}.total_cents == 1573"

      - name: wholesale_tier_selection_covered_by_difficulty
        claim_type: Correct Result
        grounds: [calculations.wholesale_tier_discount]
        excluded_because:
          difficulty_instance: combinatorial_formula / wholesale_tier_selection_three_inputs
          rationale: "Tiered wholesale unit-price selection is asserted by the named §1.8 instance."

      - name: order_total_rounding_covered_by_difficulty
        claim_type: Precision
        grounds: [calculations.order_total]
        excluded_because:
          difficulty_instance: combinatorial_formula / order_total_round_per_line_then_sum
          rationale: "Round-per-line-then-sum precision is asserted by the named §1.8 instance."

      - name: custom_amount_variants_covered_by_difficulty
        claim_type: Variant Divergence
        grounds: [calculations.custom_order_amount]
        excluded_because:
          difficulty_instance: dual_variant_calc / custom_order_quote_vs_invoice_diverge
          rationale: "Quote-vs-invoice divergence asserted by the named §1.8 instance."

      - name: subscription_charge_variants_covered_by_difficulty
        claim_type: Variant Divergence
        grounds: [calculations.subscription_period_charge]
        excluded_because:
          difficulty_instance: dual_variant_calc / subscription_estimate_vs_settled_diverge
          rationale: "Estimate-vs-settled divergence asserted by the named §1.8 instance."

  - section: validations
    instances:
      - name: order_line_zero_quantity_rejected
        claim_type: Violation → Error
        grounds: ["validations[priority=15]", "errors[ERR_INVALID_QUANTITY]"]
        distinguishing_aspect: "Adding an order line with quantity=0 returns ERR_INVALID_QUANTITY (422)."
        test_recipe:
          setup: ["RETAIL customer; product; DRAFT order."]
          setup_api_calls:
            - { call: "POST /customers", payload: { name: "Q0", email: "q0@x.com", account_type: "RETAIL" }, as: Admin, captures: { cid: "$.data.id" } }
            - { call: "POST /products", payload: { sku: "Z-1", name: "Z SKU", product_type: "SINGLE", base_price_cents: 500, shelf_life_days: 30, unit_weight_g: 10 }, as: Admin, captures: { pid: "$.data.id" } }
            - { call: "POST /orders", payload: { customer_id: "${cid}", order_type: "RETAIL" }, as: Customer, as_user_id: "${cid}", captures: { oid: "$.data.id" } }
          trigger:
            - { call: "POST /orders/${oid}/lines", payload: { product_id: "${pid}", quantity: 0 }, as: Customer, as_user_id: "${cid}", captures: { err: "$.data.error_id" } }
          assert:
            - "response error_id == ERR_INVALID_QUANTITY"

      - name: duplicate_product_line_rejected
        claim_type: Violation → Error
        grounds: ["validations[priority=17]", "errors[ERR_DUPLICATE_LINE]"]
        distinguishing_aspect: "Adding a second line for a product already on the order returns ERR_DUPLICATE_LINE (409)."
        test_recipe:
          setup: ["RETAIL customer; product; DRAFT order with one line for the product."]
          setup_api_calls:
            - { call: "POST /customers", payload: { name: "Dup", email: "dup@x.com", account_type: "RETAIL" }, as: Admin, captures: { cid: "$.data.id" } }
            - { call: "POST /products", payload: { sku: "DUP-1", name: "Dup SKU", product_type: "SINGLE", base_price_cents: 500, shelf_life_days: 30, unit_weight_g: 10 }, as: Admin, captures: { pid: "$.data.id" } }
            - { call: "POST /orders", payload: { customer_id: "${cid}", order_type: "RETAIL" }, as: Customer, as_user_id: "${cid}", captures: { oid: "$.data.id" } }
            - { call: "POST /orders/${oid}/lines", payload: { product_id: "${pid}", quantity: 1 }, as: Customer, as_user_id: "${cid}" }
          trigger:
            - { call: "POST /orders/${oid}/lines", payload: { product_id: "${pid}", quantity: 2 }, as: Customer, as_user_id: "${cid}", captures: { err: "$.data.error_id" } }
          assert:
            - "response error_id == ERR_DUPLICATE_LINE"

      - name: wholesale_order_type_account_mismatch
        claim_type: Violation → Error
        grounds: ["validations[priority=6]", "errors[ERR_ACCOUNT_TYPE_MISMATCH]"]
        distinguishing_aspect: "A RETAIL customer confirming a WHOLESALE order returns ERR_ACCOUNT_TYPE_MISMATCH (422)."
        test_recipe:
          setup: ["RETAIL customer; product; WHOLESALE order with one line."]
          setup_api_calls:
            - { call: "POST /customers", payload: { name: "Mismatch", email: "mm@x.com", account_type: "RETAIL" }, as: Admin, captures: { cid: "$.data.id" } }
            - { call: "POST /products", payload: { sku: "MM-1", name: "MM SKU", product_type: "SINGLE", base_price_cents: 1000, shelf_life_days: 30, unit_weight_g: 40 }, as: Admin, captures: { pid: "$.data.id" } }
            - { call: "POST /orders", payload: { customer_id: "${cid}", order_type: "WHOLESALE" }, as: Customer, as_user_id: "${cid}", captures: { oid: "$.data.id" } }
            - { call: "POST /orders/${oid}/lines", payload: { product_id: "${pid}", quantity: 60 }, as: Customer, as_user_id: "${cid}" }
          trigger:
            - { call: "POST /orders/${oid}/confirm", payload: {}, as: Customer, as_user_id: "${cid}", captures: { err: "$.data.error_id" } }
          assert:
            - "response error_id == ERR_ACCOUNT_TYPE_MISMATCH"

      - name: bundle_component_self_reference_rejected
        claim_type: Violation → Error
        grounds: ["validations[priority=16]", "errors[ERR_BUNDLE_COMPONENT_INVALID]"]
        distinguishing_aspect: "Attaching a bundle to itself as its own component returns ERR_BUNDLE_COMPONENT_INVALID (422)."
        test_recipe:
          setup: ["One BUNDLE product."]
          setup_api_calls:
            - { call: "POST /products", payload: { sku: "SELF-1", name: "Self Box", product_type: "BUNDLE", base_price_cents: 3000, shelf_life_days: 30, unit_weight_g: 200 }, as: Admin, captures: { bun_id: "$.data.id" } }
          trigger:
            - { call: "POST /products/${bun_id}/bundle-components", payload: { component_product_id: "${bun_id}", quantity: 1 }, as: Admin, captures: { err: "$.data.error_id" } }
          assert:
            - "response error_id == ERR_BUNDLE_COMPONENT_INVALID"

      - name: release_expired_batch_rejected
        claim_type: Violation → Error
        grounds: ["validations[priority=13]", "errors[ERR_BATCH_EXPIRED]"]
        distinguishing_aspect: "Releasing a batch whose lot_expiry has passed (produced 2026-07-01, shelf 1 day, clock 2026-07-03) returns ERR_BATCH_EXPIRED (409)."
        test_recipe:
          setup: ["Non-tempering product shelf_life_days=1; batch produced 2026-07-01; clock advanced to 2026-07-03."]
          setup_api_calls:
            - { call: "POST /products", payload: { sku: "EXP-1", name: "Exp SKU", product_type: "SINGLE", base_price_cents: 500, shelf_life_days: 1, unit_weight_g: 10 }, as: Admin, captures: { pid: "$.data.id" } }
            - { call: "POST /batches", payload: { product_id: "${pid}", initial_units: 20, produced_at: "2026-07-01T00:00:00Z" }, as: ProductionManager, captures: { bid: "$.data.id" } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-07-03T00:00:00Z" }, as: Admin }
          trigger:
            - { call: "POST /batches/${bid}/release", payload: {}, as: ProductionManager, captures: { err: "$.data.error_id" } }
          assert:
            - "response error_id == ERR_BATCH_EXPIRED"

      - name: allergen_conflict_covered_by_difficulty
        claim_type: Priority Ordering
        grounds: ["validations[priority=8]", "validations[priority=14]"]
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / safety_beats_constraint_on_allocate
          rationale: "Safety-vs-constraint priority asserted by the named §1.8 instance."

  - section: endpoints
    instances:
      - name: sweep_expired_transitions_released_to_expired
        claim_type: Action endpoint
        grounds: [state_machines.Batch.RELEASED_to_EXPIRED]
        distinguishing_aspect: "After clock passes lot_expiry, POST /_inventory/sweep-expired moves the RELEASED batch to EXPIRED with available_units=0."
        test_recipe:
          setup: ["Non-tempering product shelf_life_days=2; batch produced 2026-07-01 released; clock advanced to 2026-07-04."]
          setup_api_calls:
            - { call: "POST /products", payload: { sku: "SW-1", name: "Sweep SKU", product_type: "SINGLE", base_price_cents: 500, shelf_life_days: 2, unit_weight_g: 10 }, as: Admin, captures: { pid: "$.data.id" } }
            - { call: "POST /batches", payload: { product_id: "${pid}", initial_units: 30, produced_at: "2026-07-01T00:00:00Z" }, as: ProductionManager, captures: { bid: "$.data.id" } }
            - { call: "POST /batches/${bid}/release", payload: {}, as: ProductionManager }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-07-04T00:00:00Z" }, as: Admin }
          trigger:
            - { call: "POST /_inventory/sweep-expired", payload: {}, as: Admin }
          assert:
            - "Batch.${bid}.status == EXPIRED"
            - "Batch.${bid}.available_units == 0"

  - section: errors
    instances:
      - name: missing_auth_headers_returns_unauthenticated
        claim_type: violation_to_error
        grounds: ["errors[ERR_UNAUTHENTICATED]"]
        distinguishing_aspect: "A request with no/invalid X-User-Role returns ERR_UNAUTHENTICATED (401) before any resource logic."
        test_recipe:
          setup: ["One product exists."]
          setup_api_calls:
            - { call: "POST /products", payload: { sku: "AU-1", name: "Auth SKU", product_type: "SINGLE", base_price_cents: 500, shelf_life_days: 30, unit_weight_g: 10 }, as: Admin, captures: { pid: "$.data.id" } }
          trigger:
            - { call: "GET /products/${pid}", payload: {}, as: Anonymous, captures: { err: "$.data.error_id" } }
          assert:
            - "response error_id == ERR_UNAUTHENTICATED"
            - "HTTP status == 401"

  - section: rbac
    instances:
      - name: customer_cannot_quote_custom_order
        claim_type: exclusive_denied
        grounds: [roles.SalesManager, "errors[ERR_UNAUTHORIZED]"]
        distinguishing_aspect: "A Customer calling POST /custom-orders/{id}/quote (SalesManager-exclusive) is denied ERR_UNAUTHORIZED (403)."
        test_recipe:
          setup: ["CORPORATE customer, product, mold; one DRAFT custom order."]
          setup_api_calls:
            - { call: "POST /customers", payload: { name: "Corp R", email: "corpr@x.com", account_type: "CORPORATE" }, as: Admin, captures: { cid: "$.data.id" } }
            - { call: "POST /products", payload: { sku: "R-1", name: "R SKU", product_type: "SINGLE", base_price_cents: 1500, shelf_life_days: 30, unit_weight_g: 40 }, as: Admin, captures: { pid: "$.data.id" } }
            - { call: "POST /molds", payload: { name: "Round", cavity_count: 4, daily_capacity_units: 200 }, as: ProductionManager, captures: { mid: "$.data.id" } }
            - { call: "POST /custom-orders", payload: { customer_id: "${cid}", product_id: "${pid}", mold_id: "${mid}", units_estimated: 20 }, as: Customer, as_user_id: "${cid}", captures: { co_id: "$.data.id" } }
          trigger:
            - { call: "POST /custom-orders/${co_id}/quote", payload: {}, as: Customer, as_user_id: "${cid}", captures: { err: "$.data.error_id" } }
          assert:
            - "response error_id == ERR_UNAUTHORIZED"
            - "HTTP status == 403"

      - name: customer_cannot_cancel_others_order
        claim_type: peer_roles
        grounds: ["validations[priority=5]", "errors[ERR_OWNERSHIP_FORBIDDEN]"]
        distinguishing_aspect: "Customer B cancelling Customer A's order is denied ERR_OWNERSHIP_FORBIDDEN (403) (X-User-ID != order.customer_id)."
        test_recipe:
          setup: ["Two RETAIL customers A and B; a DRAFT order owned by A."]
          setup_api_calls:
            - { call: "POST /customers", payload: { name: "Owner A", email: "oa@x.com", account_type: "RETAIL" }, as: Admin, captures: { a_id: "$.data.id" } }
            - { call: "POST /customers", payload: { name: "Other B", email: "ob@x.com", account_type: "RETAIL" }, as: Admin, captures: { b_id: "$.data.id" } }
            - { call: "POST /orders", payload: { customer_id: "${a_id}", order_type: "RETAIL" }, as: Customer, as_user_id: "${a_id}", captures: { oid: "$.data.id" } }
          trigger:
            - { call: "POST /orders/${oid}/cancel", payload: {}, as: Customer, as_user_id: "${b_id}", captures: { err: "$.data.error_id" } }
          assert:
            - "response error_id == ERR_OWNERSHIP_FORBIDDEN"
            - "HTTP status == 403"

  - section: cross_cutting
    instances:
      - name: reservation_stale_batch_version_conflict
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[reservation-over-subscribe-stale-batch]", "errors[ERR_STALE_VERSION]"]
        distinguishing_aspect: "Two strictly sequential reservations against a released batch: the first (expected_batch_version = observed) succeeds and bumps Batch.version; the second still carrying the pre-bump version is rejected ERR_STALE_VERSION (412)."
        test_recipe:
          setup: ["Non-tempering product; batch of 100 RELEASED (version observed); a DRAFT order with one line to reserve against."]
          setup_api_calls:
            - { call: "POST /customers", payload: { name: "OCC A", email: "occ@x.com", account_type: "RETAIL" }, as: Admin, captures: { cid: "$.data.id" } }
            - { call: "POST /products", payload: { sku: "OCC-1", name: "OCC SKU", product_type: "SINGLE", base_price_cents: 1000, shelf_life_days: 60, unit_weight_g: 30 }, as: Admin, captures: { pid: "$.data.id" } }
            - { call: "POST /batches", payload: { product_id: "${pid}", initial_units: 100 }, as: ProductionManager, captures: { bid: "$.data.id" } }
            - { call: "POST /batches/${bid}/release", payload: {}, as: ProductionManager, captures: { bver: "$.data.version" } }
            - { call: "POST /orders", payload: { customer_id: "${cid}", order_type: "RETAIL" }, as: Customer, as_user_id: "${cid}", captures: { oid: "$.data.id" } }
            - { call: "POST /orders/${oid}/lines", payload: { product_id: "${pid}", quantity: 40 }, as: Customer, as_user_id: "${cid}", captures: { line_id: "$.data.id" } }
            - { call: "POST /batches/${bid}/reservations", payload: { order_line_id: "${line_id}", units: 10, expected_batch_version: "${bver}" }, as: SalesManager }
          trigger:
            - { call: "POST /batches/${bid}/reservations", payload: { order_line_id: "${line_id}", units: 10, expected_batch_version: "${bver}" }, as: SalesManager, captures: { err: "$.data.error_id" } }
          assert:
            - "response error_id == ERR_STALE_VERSION"
            - "HTTP status == 412"

      - name: quarantine_cascade_covered_by_difficulty
        claim_type: cascading_side_effects
        grounds: [state_machines.Batch.RELEASED_to_QUARANTINED]
        excluded_because:
          difficulty_instance: transitive_cascade / quarantine_voids_reservation_backorders_order
          rationale: "The 3-level quarantine cascade is asserted by the named §1.8 instance."

  - section: consistency_model
    instances:
      - name: order_confirm_totals_visible_same_response
        claim_type: immediate
        grounds: [entities.Order.fields.total_cents]
        distinguishing_aspect: "Confirming an order returns the computed subtotal/tax/total in the same response body (immediate consistency)."
        test_recipe:
          setup: ["RETAIL customer; product base 1000; retail order with one line qty 2."]
          setup_api_calls:
            - { call: "POST /customers", payload: { name: "Imm A", email: "imm@x.com", account_type: "RETAIL" }, as: Admin, captures: { cid: "$.data.id" } }
            - { call: "POST /products", payload: { sku: "IM-1", name: "IM SKU", product_type: "SINGLE", base_price_cents: 1000, shelf_life_days: 30, unit_weight_g: 40 }, as: Admin, captures: { pid: "$.data.id" } }
            - { call: "POST /orders", payload: { customer_id: "${cid}", order_type: "RETAIL" }, as: Customer, as_user_id: "${cid}", captures: { oid: "$.data.id" } }
            - { call: "POST /orders/${oid}/lines", payload: { product_id: "${pid}", quantity: 2 }, as: Customer, as_user_id: "${cid}" }
          trigger:
            - { call: "POST /orders/${oid}/confirm", payload: {}, as: Customer, as_user_id: "${cid}", captures: { total: "$.data.total_cents" } }
          assert:
            - "Order.${oid}.subtotal_cents == 2000"
            - "Order.${oid}.tax_cents == 145"
            - "Order.${oid}.total_cents == 2145"
