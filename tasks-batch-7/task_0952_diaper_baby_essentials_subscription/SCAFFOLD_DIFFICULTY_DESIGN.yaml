            - call: "POST /cycles/${ca}/dispatch"
              payload: { service_level: "STANDARD" }
              as: OpsAdmin
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-08T11:00:00Z" }
              as: OpsAdmin
          trigger:
            - call: "POST /cycles/${cb}/dispatch"
              payload: { service_level: "STANDARD" }
              as: OpsAdmin
              captures: { err: $.data.error_id }
          assert:
            - "${err} == ERR_SHIPMENT_SPACING_VIOLATION"
            - "HTTP status is 409"
            - "Cycle.${cb}.status == CUTOFF_LOCKED"
            - "exactly 1 Shipment row exists with account_id == ${acct_id}"

  # =======================================================================
  # Rule 9 — compensating-action invariants across different conserved quantities
  # =======================================================================
  - rule_id: compensating_invariant
    instances:
      - name: gift_credit_money_conserved_and_never_restored_on_refund
        grounds:
          - conservation_invariants.credit_units_conserved
          - conservation_invariants.cycle_cash_conserved
          - calculations.credit_restoration_on_refund
          - state_machines.Refund.APPROVED_to_SETTLED
        distinguishing_aspect: |
          CONSERVED QUANTITY 1 — credit money in cents. Across the forward action (charge consumes
          1000 of a 1000-cent GIFT credit) and its compensating action (the refund settles for the
          full 1999 cash), the identity issued_cents == consumed_cents + remaining_cents +
          forfeited_cents holds at 1000 == 1000 + 0 + 0, because a GIFT credit has refundable ==
          false and is therefore never restored.
        test_recipe:
          setup:
            - "Registry owner O and purchaser P, both verified and ACTIVE."
            - "A 1000-cent S2 gift SKU stocked at 0 packs (so it can never win allocation) and a 1200-cent S2 allocation SKU stocked at 50."
            - "P buys and pays 1 pack of the gift SKU for 1000 cents; O claims it as CREDIT, producing a 1000-cent non-refundable GIFT credit."
            - "O's first cycle is allocated at 2400 + 599 = 2999 and charged, consuming 1000 of gift credit and capturing 1999 in cash."
            - "A CANCEL refund of 1999 is opened and approved by SupportAgent cs-1."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: OpsAdmin
            - call: "POST /plans"
              payload: { code: "CORE", name: "Core Plan", default_pack_count: 2, promo_discount_pct: 0, allows_hypoallergenic: true }
              as: OpsAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /skus"
              payload: { code: "S2-STD-60", name: "Stage 2 Standard 60", stage: "S2", line: "STANDARD", pack_price_cents: 1200, pack_size_units: 60, allergen_tags: [], stock_packs: 50 }
              as: OpsAdmin
              captures: { sku_std: $.data.id }
            - call: "POST /skus"
              payload: { code: "S2-GIFT", name: "Stage 2 Gift Pack", stage: "S2", line: "STANDARD", pack_price_cents: 1000, pack_size_units: 60, allergen_tags: [], stock_packs: 0 }
              as: OpsAdmin
              captures: { sku_gift: $.data.id }
            - call: "POST /accounts"
              payload: { email: "owner4@example.com", full_name: "Owner Four", payment_method_on_file: true }
              as: Anonymous
              captures: { o_id: $.data.id, o_tok: $.data.verification_token }
            - call: "POST /accounts/${o_id}/verify"
              payload: { verification_token: "${o_tok}" }
              as: Anonymous
            - call: "POST /accounts"
              payload: { email: "purchaser4@example.com", full_name: "Purchaser Four", payment_method_on_file: true }
              as: Anonymous
              captures: { p_id: $.data.id, p_tok: $.data.verification_token }
            - call: "POST /accounts/${p_id}/verify"
              payload: { verification_token: "${p_tok}" }
              as: Anonymous
            - call: "POST /children"
              payload: { account_id: "${o_id}", name: "Rin", birth_date: "2025-11-01", weight_grams: 7000 }
              as: AccountHolder
              as_user_id: "${o_id}"
              captures: { child_id: $.data.id }
            - call: "POST /registries"
              payload: { owner_account_id: "${o_id}", child_id: "${child_id}", title: "Conservation Registry" }
              as: RegistryOwner
              as_user_id: "${o_id}"
              captures: { reg_id: $.data.id }
            - call: "POST /registries/${reg_id}/items"
              payload: { sku_id: "${sku_gift}", requested_quantity: 1 }
              as: RegistryOwner
              as_user_id: "${o_id}"
              captures: { item_id: $.data.id, item_v: $.data.version }
            - call: "POST /registries/${reg_id}/open"
              payload: {}
              as: RegistryOwner
              as_user_id: "${o_id}"
            - call: "POST /gift-orders"
              payload: { registry_item_id: "${item_id}", purchaser_account_id: "${p_id}", quantity: 1, expected_registry_item_version: "${item_v}" }
              as: GiftPurchaser
              as_user_id: "${p_id}"
              captures: { gift_id: $.data.id }
            - call: "POST /gift-orders/${gift_id}/pay"
              payload: {}
              as: GiftPurchaser
              as_user_id: "${p_id}"
            - call: "POST /gift-orders/${gift_id}/claim"
              payload: { claim_mode: "CREDIT" }
              as: RegistryOwner
              as_user_id: "${o_id}"
            - call: "GET /credits"
              payload: { account_id: "${o_id}", credit_type: "GIFT" }
              as: AccountHolder
              as_user_id: "${o_id}"
              captures: { credit_id: "$.data[0].id" }
            - call: "POST /subscriptions"
              payload: { account_id: "${o_id}", plan_id: "${plan_id}", child_id: "${child_id}", consumption_rate_per_day: 6, pack_count: 2 }
              as: AccountHolder
              as_user_id: "${o_id}"
              captures: { sub_id: $.data.id }
            - call: "POST /subscriptions/${sub_id}/activate"
              payload: {}
              as: AccountHolder
              as_user_id: "${o_id}"
            - call: "POST /subscriptions/${sub_id}/cycles"
              payload: {}
              as: OpsAdmin
              captures: { c1: $.data.id }
            - call: "POST /cycles/${c1}/allocate"
              payload: {}
              as: OpsAdmin
            - call: "POST /cycles/${c1}/charge"
              payload: {}
              as: OpsAdmin
            - call: "POST /cycles/${c1}/refund-requests"
              payload: { reason: "CANCEL" }
              as: AccountHolder
              as_user_id: "${o_id}"
              captures: { refund_id: $.data.id }
            - call: "POST /refunds/${refund_id}/approve"
              payload: {}
              as: SupportAgent
              as_user_id: "cs-1"
          trigger:
            - call: "POST /refunds/${refund_id}/settle"
              payload: {}
              as: OpsAdmin
              as_user_id: "ops-1"
              captures: { cash_back: $.data.refunded_cash_cents, restored: $.data.credits_restored_cents }
          assert:
            - "Cycle.${c1}.gift_credit_applied_cents == 1000"
            - "Cycle.${c1}.charged_cash_cents == 1999"
            - "${cash_back} == 1999"
            - "${restored} == 0"
            - "Credit.${credit_id}.issued_cents == 1000"
            - "Credit.${credit_id}.consumed_cents == 1000"
            - "Credit.${credit_id}.remaining_cents == 0"
            - "Credit.${credit_id}.forfeited_cents == 0"
            - "Credit.${credit_id}.status == CONSUMED"
            - "Cycle.${c1}.retained_cash_cents == 0"
            - "Cycle.${c1}.payment_status == REFUNDED"

      - name: points_ledger_conserved_and_balance_goes_negative_after_clawback
        grounds:
          - conservation_invariants.points_ledger_conserved
          - calculations.points_clawback_on_refund
          - calculations.cancel_refund_cents
          - state_machines.Cycle.DELIVERED_to_RETURNED
        distinguishing_aspect: |
          CONSERVED QUANTITY 2 — loyalty points, a different quantity from credit money. The wallet
          holds EARN +500, REDEEM -500 and CLAWBACK -500, so points_balance is exactly -500 and
          equals the sum of the three ledger deltas; the balance is deliberately NOT floored at 0.
        test_recipe:
          setup:
            - "One verified ACTIVE account whose first cycle is priced at 50000 subtotal with 0 shipping, charged for 50000 cash, dispatched and delivered on 2026-06-08T00:00:00Z, earning 500 points."
            - "The account then redeems exactly 500 points, driving the balance to 0."
            - "The delivered cycle is returned on the same instant it was dispatched, opening a RETURN refund of 49400 (50000 minus the 600 restock fee) which SupportAgent cs-1 approves."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: OpsAdmin
            - call: "POST /plans"
              payload: { code: "CORE", name: "Core Plan", default_pack_count: 2, promo_discount_pct: 0, allows_hypoallergenic: true }
              as: OpsAdmin
