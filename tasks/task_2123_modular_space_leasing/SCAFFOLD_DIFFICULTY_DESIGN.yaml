  - rule_id: compensating_invariant
    instances:

      - name: dispatch_then_abort_conserves_the_yard_unit_count
        grounds:
          - state_machines.Unit.unit_reserved_to_intransit
          - state_machines.Unit.unit_intransit_to_reserved_on_abort
          - state_machines.LogisticsJob.job_dispatched_to_cancelled_delivery_abort
          - calculations.branch_fleet_inventory
          - entities.Branch.fields.units_in_yard
        distinguishing_aspect: |
          The conserved quantity is a PHYSICAL COUNT of assets:
          SUM over branches of Branch.units_in_yard MUST equal
          COUNT(Unit WHERE status IN {IN_FLEET, RESERVED, RETURNED, REFURBISHING}).
          Dispatch drops Dallas from 2 to 1; the compensating cancel restores it to exactly 2
          with zero drift, and units_available stays 1 throughout because the aborted unit
          returns to RESERVED, not to IN_FLEET.
