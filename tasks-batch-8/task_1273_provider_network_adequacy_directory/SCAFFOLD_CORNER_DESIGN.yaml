        claim_type: boundary_edge
        grounds: ["validations[priority=7]", "errors[ERR_COMPLAINT_WINDOW_EXPIRED]"]
        distinguishing_aspect: "Filing window is inclusive: observed 2026-05-01 filed 2026-07-30 is exactly 90 days (accepted); observed 2026-04-30 filed 2026-07-30 is 91 days (ERR_COMPLAINT_WINDOW_EXPIRED)."
