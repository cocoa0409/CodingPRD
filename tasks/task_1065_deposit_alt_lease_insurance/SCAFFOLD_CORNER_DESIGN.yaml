scaffold_corner_design:
  - section: entities
    instances:
      - name: landlord_get_not_found
        claim_type: not_found
        grounds: [entities.Landlord]
        distinguishing_aspect: "GET /landlords/{id} with a well-formed but non-existent UUID returns ERR_LANDLORD_NOT_FOUND (404), not a generic 400/500."
        test_recipe:
          setup: ["No landlord with id 00000000-0000-0000-0000-000000000001 exists."]
          setup_api_calls: []
          trigger:
            - call: "GET /landlords/00000000-0000-0000-0000-000000000001"
              payload: {}
              as: ComplianceOfficer
          assert:
            - "response.error_id == ERR_LANDLORD_NOT_FOUND"
            - "response.http_status == 404"

      - name: property_get_not_found
        claim_type: not_found
        grounds: [entities.Property]
        distinguishing_aspect: "GET /properties/{id} with a non-existent id returns ERR_PROPERTY_NOT_FOUND (404)."
        test_recipe:
          setup: ["No property with id 00000000-0000-0000-0000-000000000002 exists."]
          setup_api_calls: []
          trigger:
            - call: "GET /properties/00000000-0000-0000-0000-000000000002"
              payload: {}
              as: ComplianceOfficer
          assert:
            - "response.error_id == ERR_PROPERTY_NOT_FOUND"

      - name: renter_referenced_by_id_not_found_on_enrollment_create
        claim_type: not_found
        grounds: [entities.Renter, entities.RenterEnrollment.fields.renter_id]
        distinguishing_aspect: "POST /renter-enrollments referencing a non-existent renter_id in the body (not a path param) returns ERR_RENTER_NOT_FOUND — existence is validated for body FK fields too, not just path ids."
        test_recipe:
          setup:
            - "A Landlord, an ACTIVE Property (CA), and CA StateComplianceRule exist. A real Renter is registered (used only to authenticate the call)."
          setup_api_calls:
            - call: "POST /landlords"
              payload: { full_name: "Nate NotFound Owner", email: "nate.owner@example.com", phone_number: "555-0300" }
              as: Anonymous
              captures: { landlord_id: "$.data.id" }
            - call: "POST /renters"
              payload: { full_name: "Rae NotFound", email: "rae.notfound@example.com", phone_number: "555-0301" }
              as: Anonymous
              captures: { renter_id: "$.data.id" }
            - call: "POST /properties"
              payload: { landlord_id: "${landlord_id}", address_line1: "19 Aspen St", city: "Fremont", state_code: "CA", monthly_rent_cents: 200000, property_type: "SINGLE_FAMILY" }
              as: Landlord
              as_user_id: "${landlord_id}"
              captures: { property_id: "$.data.id" }
            - call: "POST /state-compliance-rules"
              payload: { state_code: "CA", enrollment_allowed: true, max_monthly_fee_pct_of_rent: 0.10, cooling_off_buffer_days: 30, mandatory_alternative_offering: true }
              as: ComplianceOfficer
            - call: "POST /properties/${property_id}/program-status"
              payload: { action: "ACTIVATE" }
              as: ComplianceOfficer
          trigger:
            - call: "POST /renter-enrollments"
              payload: { property_id: "${property_id}", renter_id: "00000000-0000-0000-0000-000000000003", payment_plan: "MONTHLY", requested_coverage_limit_cents: 300000, self_reported_annual_income_cents: 7200000, credit_proxy_score: 750, prior_eviction_count: 0, lease_start_date: "2026-07-01T00:00:00Z", lease_end_date: "2027-07-01T00:00:00Z" }
              as: Renter
              as_user_id: "${renter_id}"
          assert:
            - "response.error_id == ERR_RENTER_NOT_FOUND"

      - name: renter_enrollment_get_not_found
        claim_type: not_found
        grounds: [entities.RenterEnrollment]
        distinguishing_aspect: "GET /renter-enrollments/{id} with a non-existent id returns ERR_RENTER_ENROLLMENT_NOT_FOUND."
        test_recipe:
          setup: ["No RenterEnrollment with id 00000000-0000-0000-0000-000000000004 exists."]
          setup_api_calls: []
          trigger:
            - call: "GET /renter-enrollments/00000000-0000-0000-0000-000000000004"
              payload: {}
              as: UnderwritingAgent
          assert:
            - "response.error_id == ERR_RENTER_ENROLLMENT_NOT_FOUND"

      - name: policy_get_not_found
        claim_type: not_found
        grounds: [entities.Policy]
        distinguishing_aspect: "GET /policies/{id} with a non-existent id returns ERR_POLICY_NOT_FOUND."
        test_recipe:
          setup: ["No Policy with id 00000000-0000-0000-0000-000000000005 exists."]
          setup_api_calls: []
          trigger:
            - call: "GET /policies/00000000-0000-0000-0000-000000000005"
              payload: {}
              as: UnderwritingAgent
          assert:
            - "response.error_id == ERR_POLICY_NOT_FOUND"

      - name: invoice_pay_not_found
        claim_type: not_found
        grounds: [entities.PremiumInvoice]
        distinguishing_aspect: "POST /invoices/{id}/pay with a non-existent invoice id returns ERR_INVOICE_NOT_FOUND."
        test_recipe:
          setup: ["A real Renter is registered (used only to authenticate the call). No invoice with id 00000000-0000-0000-0000-000000000006 exists."]
          setup_api_calls:
            - call: "POST /renters"
              payload: { full_name: "Ivy InvoiceNotFound", email: "ivy.invoicenf@example.com", phone_number: "555-0302" }
              as: Anonymous
              captures: { renter_id: "$.data.id" }
          trigger:
            - call: "POST /invoices/00000000-0000-0000-0000-000000000006/pay"
              payload: {}
              as: Renter
              as_user_id: "${renter_id}"
          assert:
            - "response.error_id == ERR_INVOICE_NOT_FOUND"

      - name: claim_get_not_found
        claim_type: not_found
        grounds: [entities.Claim]
        distinguishing_aspect: "GET /claims/{id} with a non-existent id returns ERR_CLAIM_NOT_FOUND."
        test_recipe:
          setup: ["No Claim with id 00000000-0000-0000-0000-000000000007 exists."]
          setup_api_calls: []
          trigger:
            - call: "GET /claims/00000000-0000-0000-0000-000000000007"
              payload: {}
              as: ComplianceOfficer
          assert:
            - "response.error_id == ERR_CLAIM_NOT_FOUND"

      - name: payout_transition_not_found
        claim_type: not_found
        grounds: [entities.Payout]
        distinguishing_aspect: "POST /payouts/{id}/transition with a non-existent payout id returns ERR_PAYOUT_NOT_FOUND."
        test_recipe:
          setup: ["No Payout with id 00000000-0000-0000-0000-000000000008 exists."]
          setup_api_calls: []
          trigger:
            - call: "POST /payouts/00000000-0000-0000-0000-000000000008/transition"
              payload: { action: "DISBURSE" }
              as: ClaimsAdjuster
              as_user_id: "adjuster-900"
          assert:
            - "response.error_id == ERR_PAYOUT_NOT_FOUND"

      - name: subrogation_case_get_not_found
        claim_type: not_found
        grounds: [entities.SubrogationCase]
        distinguishing_aspect: "GET /subrogation-cases/{id} with a non-existent id returns ERR_SUBROGATION_CASE_NOT_FOUND."
        test_recipe:
          setup: ["No SubrogationCase with id 00000000-0000-0000-0000-000000000009 exists."]
          setup_api_calls: []
          trigger:
            - call: "GET /subrogation-cases/00000000-0000-0000-0000-000000000009"
              payload: {}
              as: ComplianceOfficer
          assert:
            - "response.error_id == ERR_SUBROGATION_CASE_NOT_FOUND"

      - name: recovery_payment_reverse_not_found
        claim_type: not_found
        grounds: [entities.RecoveryPayment]
        distinguishing_aspect: "POST /recovery-payments/{id}/reverse with a non-existent id returns ERR_RECOVERY_PAYMENT_NOT_FOUND."
        test_recipe:
          setup: ["No RecoveryPayment with id 00000000-0000-0000-0000-00000000000a exists."]
          setup_api_calls: []
          trigger:
            - call: "POST /recovery-payments/00000000-0000-0000-0000-00000000000a/reverse"
              payload: {}
              as: PlatformAdmin
          assert:
            - "response.error_id == ERR_RECOVERY_PAYMENT_NOT_FOUND"

      - name: renter_enrollment_missing_required_field_rejected
        claim_type: required_fields
        grounds: [entities.RenterEnrollment.fields.credit_proxy_score]
        distinguishing_aspect: "POST /renter-enrollments omitting the required credit_proxy_score field returns ERR_VALIDATION (400), not a 500 or a silent default."
        test_recipe:
          setup:
            - "A Landlord, an ACTIVE Property (CA), CA StateComplianceRule, and a Renter exist."
          setup_api_calls:
            - call: "POST /landlords"
              payload: { full_name: "Val Validation Owner", email: "val.owner@example.com", phone_number: "555-0303" }
              as: Anonymous
              captures: { landlord_id: "$.data.id" }
            - call: "POST /renters"
              payload: { full_name: "Vic Validation", email: "vic.validation@example.com", phone_number: "555-0304" }
              as: Anonymous
              captures: { renter_id: "$.data.id" }
            - call: "POST /properties"
              payload: { landlord_id: "${landlord_id}", address_line1: "20 Magnolia St", city: "Concord", state_code: "CA", monthly_rent_cents: 200000, property_type: "SINGLE_FAMILY" }
              as: Landlord
              as_user_id: "${landlord_id}"
              captures: { property_id: "$.data.id" }
            - call: "POST /state-compliance-rules"
              payload: { state_code: "CA", enrollment_allowed: true, max_monthly_fee_pct_of_rent: 0.10, cooling_off_buffer_days: 30, mandatory_alternative_offering: true }
              as: ComplianceOfficer
            - call: "POST /properties/${property_id}/program-status"
              payload: { action: "ACTIVATE" }
              as: ComplianceOfficer
          trigger:
            - call: "POST /renter-enrollments"
              payload: { property_id: "${property_id}", renter_id: "${renter_id}", payment_plan: "MONTHLY", requested_coverage_limit_cents: 300000, self_reported_annual_income_cents: 7200000, prior_eviction_count: 0, lease_start_date: "2026-07-01T00:00:00Z", lease_end_date: "2027-07-01T00:00:00Z" }
              as: Renter
              as_user_id: "${renter_id}"
          assert:
            - "response.error_id == ERR_VALIDATION"

      - name: property_creation_defaults_pending_review_and_zero_claims
        claim_type: defaults
        grounds: [entities.Property.fields.program_status, entities.Property.fields.total_paid_claims_cents]
        distinguishing_aspect: "A newly created Property defaults to program_status=PENDING_REVIEW and total_paid_claims_cents=0 without either being supplied in the request."
        test_recipe:
          setup: ["A Landlord exists."]
          setup_api_calls:
            - call: "POST /landlords"
              payload: { full_name: "Default Dana Owner", email: "dana.owner@example.com", phone_number: "555-0305" }
              as: Anonymous
              captures: { landlord_id: "$.data.id" }
          trigger:
            - call: "POST /properties"
              payload: { landlord_id: "${landlord_id}", address_line1: "21 Juniper St", city: "Vallejo", state_code: "CA", monthly_rent_cents: 150000, property_type: "CONDO" }
              as: Landlord
              as_user_id: "${landlord_id}"
              captures: { property_id: "$.data.id" }
          assert:
            - "Property.${property_id}.program_status == PENDING_REVIEW"
            - "Property.${property_id}.total_paid_claims_cents == 0"

  - section: state_machines
    instances:
      - name: claim_denied_terminal_lockdown
        claim_type: terminal_state_lockdown
        grounds: [state_machines.Claim.UNDER_REVIEW_to_DENIED]
        distinguishing_aspect: "A DENIED Claim (terminal) rejects a further info-transition (REQUEST_INFO) with ERR_INVALID_STATE — no transition is possible out of a terminal state."
        test_recipe:
          setup:
            - "A Landlord, Renter, ACTIVE Property (CA), CA StateComplianceRule, an ACTIVE Policy, and a DENIED Claim exist."
          setup_api_calls:
            - call: "POST /landlords"
              payload: { full_name: "Terri Terminal Owner", email: "terri.owner@example.com", phone_number: "555-0306" }
              as: Anonymous
              captures: { landlord_id: "$.data.id" }
            - call: "POST /renters"
              payload: { full_name: "Tom Terminal", email: "tom.terminal@example.com", phone_number: "555-0307" }
              as: Anonymous
              captures: { renter_id: "$.data.id" }
            - call: "POST /properties"
              payload: { landlord_id: "${landlord_id}", address_line1: "22 Larch St", city: "Hayward", state_code: "CA", monthly_rent_cents: 200000, property_type: "SINGLE_FAMILY" }
              as: Landlord
              as_user_id: "${landlord_id}"
              captures: { property_id: "$.data.id" }
            - call: "POST /state-compliance-rules"
              payload: { state_code: "CA", enrollment_allowed: true, max_monthly_fee_pct_of_rent: 0.10, cooling_off_buffer_days: 30, mandatory_alternative_offering: true }
              as: ComplianceOfficer
            - call: "POST /properties/${property_id}/program-status"
              payload: { action: "ACTIVATE" }
              as: ComplianceOfficer
            - call: "POST /renter-enrollments"
              payload: { property_id: "${property_id}", renter_id: "${renter_id}", payment_plan: "MONTHLY", requested_coverage_limit_cents: 300000, self_reported_annual_income_cents: 7200000, credit_proxy_score: 750, prior_eviction_count: 0, lease_start_date: "2026-07-01T00:00:00Z", lease_end_date: "2027-07-01T00:00:00Z" }
              as: Renter
              as_user_id: "${renter_id}"
              captures: { enrollment_id: "$.data.id" }
            - call: "POST /renter-enrollments/${enrollment_id}/submit-underwriting"
              payload: {}
              as: Renter
              as_user_id: "${renter_id}"
            - call: "GET /renter-enrollments/${enrollment_id}/policy"
              payload: {}
              as: Renter
              as_user_id: "${renter_id}"
              captures: { policy_id: "$.data[0].id" }
            - call: "GET /policies/${policy_id}/invoices"
              payload: {}
              as: Renter
              as_user_id: "${renter_id}"
              captures: { invoice1_id: "$.data[0].id" }
            - call: "POST /invoices/${invoice1_id}/pay"
              payload: {}
              as: Renter
              as_user_id: "${renter_id}"
            - call: "POST /policies/${policy_id}/claims"
              payload: { policy_id: "${policy_id}", claim_type: "PROPERTY_DAMAGE", line_items: [{ description: "Cracked tile", amount_cents: 20000 }] }
              as: Landlord
              as_user_id: "${landlord_id}"
              captures: { claim1_id: "$.data.id" }
            - call: "POST /claims/${claim1_id}/decide"
              payload: { action: "DENY" }
              as: ClaimsAdjuster
              as_user_id: "adjuster-201"
          trigger:
            - call: "POST /claims/${claim1_id}/info-transition"
              payload: { action: "REQUEST_INFO" }
              as: ClaimsAdjuster
              as_user_id: "adjuster-201"
          assert:
            - "response.error_id == ERR_INVALID_STATE"
            - "Claim.${claim1_id}.status == DENIED"

      - name: payout_reversed_terminal_lockdown
        claim_type: terminal_state_lockdown
        grounds: [state_machines.Payout.DISBURSED_to_REVERSED]
        excluded_because:
          difficulty_instance: payout_disburse_reverse_conserves_policy_net_available_coverage
          rationale: "A second transition attempt on the now-REVERSED payout would hit the same ERR_INVALID_STATE precondition already exercised structurally by the reverse call in that instance; REVERSED is declared terminal_states so no further transition is legal."

      - name: policy_cancel_from_awaiting_first_payment_invalid
        claim_type: invalid_transition
        grounds: [state_machines.Policy.ACTIVE_to_CANCELLED, state_machines.Policy.LAPSED_to_CANCELLED]
        distinguishing_aspect: "POST /policies/{id}/cancel on a Policy still AWAITING_FIRST_PAYMENT (not ACTIVE or LAPSED) is rejected with ERR_INVALID_STATE — cancel is only declared from ACTIVE/LAPSED."
        test_recipe:
          setup:
            - "A Landlord, Renter, ACTIVE Property (CA), CA StateComplianceRule, and a Policy still AWAITING_FIRST_PAYMENT (first invoice unpaid) exist."
          setup_api_calls:
            - call: "POST /landlords"
              payload: { full_name: "Ana AwaitingPay Owner", email: "ana.owner@example.com", phone_number: "555-0308" }
              as: Anonymous
              captures: { landlord_id: "$.data.id" }
            - call: "POST /renters"
              payload: { full_name: "Al Awaiting", email: "al.awaiting@example.com", phone_number: "555-0309" }
              as: Anonymous
              captures: { renter_id: "$.data.id" }
            - call: "POST /properties"
              payload: { landlord_id: "${landlord_id}", address_line1: "23 Beech St", city: "Livermore", state_code: "CA", monthly_rent_cents: 200000, property_type: "SINGLE_FAMILY" }
              as: Landlord
              as_user_id: "${landlord_id}"
              captures: { property_id: "$.data.id" }
            - call: "POST /state-compliance-rules"
              payload: { state_code: "CA", enrollment_allowed: true, max_monthly_fee_pct_of_rent: 0.10, cooling_off_buffer_days: 30, mandatory_alternative_offering: true }
              as: ComplianceOfficer
            - call: "POST /properties/${property_id}/program-status"
              payload: { action: "ACTIVATE" }
              as: ComplianceOfficer
            - call: "POST /renter-enrollments"
              payload: { property_id: "${property_id}", renter_id: "${renter_id}", payment_plan: "MONTHLY", requested_coverage_limit_cents: 300000, self_reported_annual_income_cents: 7200000, credit_proxy_score: 750, prior_eviction_count: 0, lease_start_date: "2026-07-01T00:00:00Z", lease_end_date: "2027-07-01T00:00:00Z" }
              as: Renter
              as_user_id: "${renter_id}"
              captures: { enrollment_id: "$.data.id" }
            - call: "POST /renter-enrollments/${enrollment_id}/submit-underwriting"
              payload: {}
              as: Renter
              as_user_id: "${renter_id}"
            - call: "GET /renter-enrollments/${enrollment_id}/policy"
              payload: {}
              as: Renter
              as_user_id: "${renter_id}"
              captures: { policy_id: "$.data[0].id" }
          trigger:
            - call: "POST /policies/${policy_id}/cancel"
              payload: {}
              as: Renter
              as_user_id: "${renter_id}"
          assert:
            - "response.error_id == ERR_INVALID_STATE"
            - "Policy.${policy_id}.status == AWAITING_FIRST_PAYMENT"

      - name: renter_enrollment_decide_from_pending_underwriting_invalid
        claim_type: invalid_transition
        grounds: [state_machines.RenterEnrollment.MANUAL_REVIEW_to_APPROVED]
        distinguishing_aspect: "POST /renter-enrollments/{id}/decide before submit-underwriting has ever run (status still PENDING_UNDERWRITING, never reached MANUAL_REVIEW) is rejected with ERR_INVALID_STATE."
        test_recipe:
          setup:
            - "A Landlord, Renter, ACTIVE Property (CA), CA StateComplianceRule, and a freshly created RenterEnrollment (status=PENDING_UNDERWRITING, submit-underwriting never called) exist."
          setup_api_calls:
            - call: "POST /landlords"
              payload: { full_name: "Pam Pending Owner", email: "pam.owner@example.com", phone_number: "555-0310" }
              as: Anonymous
              captures: { landlord_id: "$.data.id" }
            - call: "POST /renters"
              payload: { full_name: "Pat Pending", email: "pat.pending@example.com", phone_number: "555-0311" }
              as: Anonymous
              captures: { renter_id: "$.data.id" }
            - call: "POST /properties"
              payload: { landlord_id: "${landlord_id}", address_line1: "24 Cottonwood St", city: "Antioch", state_code: "CA", monthly_rent_cents: 200000, property_type: "SINGLE_FAMILY" }
              as: Landlord
              as_user_id: "${landlord_id}"
              captures: { property_id: "$.data.id" }
            - call: "POST /state-compliance-rules"
              payload: { state_code: "CA", enrollment_allowed: true, max_monthly_fee_pct_of_rent: 0.10, cooling_off_buffer_days: 30, mandatory_alternative_offering: true }
              as: ComplianceOfficer
            - call: "POST /properties/${property_id}/program-status"
              payload: { action: "ACTIVATE" }
              as: ComplianceOfficer
            - call: "POST /renter-enrollments"
              payload: { property_id: "${property_id}", renter_id: "${renter_id}", payment_plan: "MONTHLY", requested_coverage_limit_cents: 300000, self_reported_annual_income_cents: 7200000, credit_proxy_score: 750, prior_eviction_count: 0, lease_start_date: "2026-07-01T00:00:00Z", lease_end_date: "2027-07-01T00:00:00Z" }
              as: Renter
              as_user_id: "${renter_id}"
              captures: { enrollment_id: "$.data.id" }
          trigger:
            - call: "POST /renter-enrollments/${enrollment_id}/decide"
              payload: { action: "APPROVE" }
              as: UnderwritingAgent
          assert:
            - "response.error_id == ERR_INVALID_STATE"
            - "RenterEnrollment.${enrollment_id}.status == PENDING_UNDERWRITING"

      - name: subrogation_case_send_demand_twice_invalid
        claim_type: invalid_transition
        grounds: [state_machines.SubrogationCase.OPEN_to_DEMAND_SENT]
        distinguishing_aspect: "A second SEND_DEMAND on a SubrogationCase already in DEMAND_SENT (not OPEN) is rejected with ERR_INVALID_STATE."
        test_recipe:
          setup:
            - "A Landlord, Renter, ACTIVE Property (CA), CA StateComplianceRule, an ACTIVE Policy, a DISBURSED Payout on an UNPAID_RENT Claim, and a SubrogationCase already in DEMAND_SENT exist."
          setup_api_calls:
            - call: "POST /landlords"
              payload: { full_name: "Diane DoubleDemand Owner", email: "diane.owner@example.com", phone_number: "555-0312" }
              as: Anonymous
              captures: { landlord_id: "$.data.id" }
            - call: "POST /renters"
              payload: { full_name: "Don DoubleDemand", email: "don.doubledemand@example.com", phone_number: "555-0313" }
              as: Anonymous
              captures: { renter_id: "$.data.id" }
            - call: "POST /properties"
              payload: { landlord_id: "${landlord_id}", address_line1: "25 Dogwood St", city: "Vacaville", state_code: "CA", monthly_rent_cents: 200000, property_type: "SINGLE_FAMILY" }
              as: Landlord
              as_user_id: "${landlord_id}"
              captures: { property_id: "$.data.id" }
            - call: "POST /state-compliance-rules"
              payload: { state_code: "CA", enrollment_allowed: true, max_monthly_fee_pct_of_rent: 0.10, cooling_off_buffer_days: 30, mandatory_alternative_offering: true }
              as: ComplianceOfficer
            - call: "POST /properties/${property_id}/program-status"
              payload: { action: "ACTIVATE" }
              as: ComplianceOfficer
            - call: "POST /renter-enrollments"
              payload: { property_id: "${property_id}", renter_id: "${renter_id}", payment_plan: "MONTHLY", requested_coverage_limit_cents: 300000, self_reported_annual_income_cents: 7200000, credit_proxy_score: 750, prior_eviction_count: 0, lease_start_date: "2026-07-01T00:00:00Z", lease_end_date: "2027-07-01T00:00:00Z" }
              as: Renter
              as_user_id: "${renter_id}"
              captures: { enrollment_id: "$.data.id" }
            - call: "POST /renter-enrollments/${enrollment_id}/submit-underwriting"
              payload: {}
              as: Renter
              as_user_id: "${renter_id}"
            - call: "GET /renter-enrollments/${enrollment_id}/policy"
              payload: {}
              as: Renter
              as_user_id: "${renter_id}"
              captures: { policy_id: "$.data[0].id" }
            - call: "GET /policies/${policy_id}/invoices"
              payload: {}
              as: Renter
              as_user_id: "${renter_id}"
              captures: { invoice1_id: "$.data[0].id" }
            - call: "POST /invoices/${invoice1_id}/pay"
              payload: {}
              as: Renter
              as_user_id: "${renter_id}"
            - call: "POST /policies/${policy_id}/claims"
              payload: { policy_id: "${policy_id}", claim_type: "UNPAID_RENT", line_items: [{ description: "Unpaid rent - July", amount_cents: 80000 }] }
              as: Landlord
              as_user_id: "${landlord_id}"
              captures: { claim1_id: "$.data.id" }
            - call: "POST /claims/${claim1_id}/decide"
              payload: { action: "APPROVE" }
