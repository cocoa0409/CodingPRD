            - call: "POST /reemployment/cases"
              payload: { member_id: "${mem_id}", employer_id: "${emp_id}", issue_type: "PENSION", description: "Case for late reopen" }
              as: ServiceMember
              as_user_id: "${mem_id}"
              captures: { casec_id: $.data.id }
            - call: "POST /reemployment/cases/${casec_id}/state"
              payload: { to_status: "TRIAGE" }
              as: ProgramCoordinator
              captures: { casec_v: $.data.version }
            - call: "POST /reemployment/cases/${casec_id}/assign"
              payload: { ombudsman_id: "${omb_id}", expected_case_version: "${casec_v}" }
              as: ProgramCoordinator
            - call: "POST /reemployment/mediation-rounds"
              payload: { case_id: "${casec_id}", proposal_text: "Offer C.", addressed_to: "EMPLOYER" }
              as: Ombudsman
              as_user_id: "${omb_id}"
            - call: "POST /reemployment/cases/${casec_id}/state"
              payload: { to_status: "CLOSED_UNRESOLVED" }
              as: Ombudsman
              as_user_id: "${omb_id}"
            - call: "POST /reemployment/_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-31T00:00:00Z" }
