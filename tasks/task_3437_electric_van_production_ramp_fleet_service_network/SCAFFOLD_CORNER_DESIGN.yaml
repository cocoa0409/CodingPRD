            - "err_neither == ERR_VALIDATION (no resource)"
            - "GET /evfleet/service-visits?vehicle_id=${veh1_id} returns 0 rows"

      - name: duplicate_vehicle_result_rejected
        claim_type: Conditional action
        grounds:
          - endpoints.POST_/evfleet/software-campaigns/{id}/vehicle-results
          - "errors[ERR_DUPLICATE_VEHICLE_RESULT]"
