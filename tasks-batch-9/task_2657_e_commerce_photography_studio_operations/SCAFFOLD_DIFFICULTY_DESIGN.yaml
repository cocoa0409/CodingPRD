  # =========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: color_composite_weighting_branches_on_station_type
        grounds:
          - calculations.color_composite_delta_e
          - entities.Station.fields.station_type
          - entities.ShootSession.fields.color_composite_delta_e
          - entities.ShootSession.fields.color_check_state
          - endpoints[POST /studio/shoot-sessions/{session_id}/color-measurement]
        distinguishing_aspect: |
          Mode (a) multi-factor formula: the identical patch array [2.5, 1.0, 1.0] produces
          composite 2.20 (FAIL) on a MODEL station under the 0.30 mean / 0.70 max weighting and
          composite 2.00 (PASS) on a STILL_LIFE station under the 0.50 / 0.50 weighting, against
          the same 2.00 tolerance - the station's type, not the readings, decides the verdict.
        test_recipe:
          setup:
            - "Two stations of different type (MODEL-1 and STILL-1), both calibrated until 2026-12-31, buffer 0, capacity 1440."
            - "Style TOP1001 with one required ON_MODEL/FRONT item on the MODEL session and one required STILL_ANGLE/FLAT item on the STILL_LIFE session; one matched sample IN_STUDIO covers both."
            - "Both sessions run 09:00-11:00 on 2026-08-03, each with its own CONFIRMED photographer booking, both LOCKED then SHOOTING, colour tolerance left at the default 2.00."
          setup_api_calls:
            - call: "POST /studio/_clock/set_current_utc"
              payload: { current_utc: "2026-08-03T08:00:00Z" }
              as: StudioAdmin
            - call: "POST /studio/vendors"
              payload: { name: "Northline Apparel", vendor_code: "NRTH", sample_sla_days: 14 }
              as: StudioAdmin
              captures: { v_id: $.data.id }
            - call: "POST /studio/asset-profiles"
              payload: { category: "APPAREL_TOP", required_angles: ["FRONT", "FLAT"], required_detail_shots: 0, min_on_model_shots: 1, video_required: false, naming_pattern: "{style_number}_{angle_code}_{seq}", required_metadata_keys: ["season"] }
              as: StudioAdmin
              captures: { ap_id: $.data.id }
            - call: "POST /studio/stations"
              payload: { station_code: "MODEL-1", station_type: "MODEL", daily_capacity_minutes: 1440, buffer_minutes: 0, max_concurrent_sessions: 1, calibrated_until: "2026-12-31T00:00:00Z" }
              as: StudioAdmin
              captures: { stm_id: $.data.id }
            - call: "POST /studio/stations"
              payload: { station_code: "STILL-1", station_type: "STILL_LIFE", daily_capacity_minutes: 1440, buffer_minutes: 0, max_concurrent_sessions: 1, calibrated_until: "2026-12-31T00:00:00Z" }
              as: StudioAdmin
              captures: { sts_id: $.data.id }
            - call: "POST /studio/studio-providers"
              payload: { provider_code: "INHOUSE", provider_kind: "IN_HOUSE", station_hour_rate_cents: 18500, retouch_rate_cents_per_asset: 900, sla_hours: 12, quality_score: 92.00, style_quote_cents: 0, capacity_assets_per_day: 40 }
              as: StudioAdmin
              captures: { pr_id: $.data.id }
            - call: "POST /studio/talent-profiles"
              payload: { full_name: "Pia Ren", talent_type: "PHOTOGRAPHER", hourly_rate_cents: 12000, day_rate_cents: 80000, minimum_call_hours: 4, max_daily_minutes: 480 }
              as: StudioAdmin
              captures: { ph1_id: $.data.id }
            - call: "POST /studio/talent-profiles"
              payload: { full_name: "Cal Ndiaye", talent_type: "PHOTOGRAPHER", hourly_rate_cents: 12000, day_rate_cents: 80000, minimum_call_hours: 4, max_daily_minutes: 480 }
              as: StudioAdmin
              captures: { ph2_id: $.data.id }
            - call: "POST /studio/styles"
              payload: { style_number: "TOP1001", category: "APPAREL_TOP", vendor_id: "${v_id}", asset_profile_id: "${ap_id}", priority_tier: "C" }
              as: StudioAdmin
              captures: { sty_id: $.data.id }
            - call: "POST /studio/samples"
              payload: { barcode: "SMP-1001", vendor_id: "${v_id}", declared_style_number: "TOP1001" }
              as: SampleCoordinator
              captures: { smp_id: $.data.id }
            - call: "POST /studio/samples/${smp_id}/receive"
              payload: {}
              as: SampleCoordinator
            - call: "POST /studio/samples/${smp_id}/match"
              payload: { style_id: "${sty_id}" }
              as: SampleCoordinator
            - call: "POST /studio/samples/${smp_id}/custody-move"
              payload: { to_state: "IN_STUDIO" }
              as: SampleCoordinator
            - call: "GET /studio/styles/${sty_id}"
              as: Producer
              captures: { sty_v2: $.data.version }
            - call: "POST /studio/shot-list-items"
              payload: { style_id: "${sty_id}", asset_kind: "ON_MODEL", angle_code: "FRONT", estimated_minutes: 60, expected_style_version: "${sty_v2}", required: true }
              as: Producer
