              as: MatchSpecialist
              captures: { c_id: $.data.id, c_v: $.data.version }
          trigger:
            - call: "POST /children/${c_id}/propose-match"
              payload: { expected_child_version: "${c_v}" }
              as: MatchSpecialist
              captures: { err: $.data.error_id }
          assert:
            - "response_type == error"
            - "data.error_id == ERR_CONSENT_NOT_ON_FILE"

