# =============================================================================
# SCAFFOLD — Patient Grievance & Complaint Resolution (hospital patient relations)
# §1.0–§1.7 only. §1.8 lives in SCAFFOLD_DIFFICULTY_DESIGN.yaml;
# §1.9 lives in SCAFFOLD_CORNER_DESIGN.yaml.
# =============================================================================

scenario: |
  Patient Grievance & Complaint Resolution (hospital patient relations): intake classification (complaint vs grievance) & regulatory timeline, assignment to department & investigation, written response requirement & content standard, escalation to quality/risk when care concern, patient-relations rounding & real-time service recovery, trend analysis by unit/type, regulatory reportable event linkage, closure documentation & satisfaction follow-up

domain_name: patient-grievance-resolution
api_prefix: /api

# =============================================================================
# Complexity Profile (§0.1–§0.4) — deliberately beyond Expert band
# =============================================================================
complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: workflow_orchestration
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers
  entity_topology: flat            # all resources top-level; FK-linked, no URL nesting
  state_machine_shape: cyclic      # case reopen loop + letter revision loop + parallel clock dimension
  relationship_patterns:
    - one_to_many
    - many_to_many                 # CaseAssignment junction (PatientCase x StaffMember)
    - self_referential             # ClassificationDecision.supersedes_decision_id, ResponseLetter.supersedes_letter_id
    - cross_aggregate              # ReportableEvent -> QualityRiskEscalation; gates across aggregates
  role_model: segregation_of_duties
  consistency_model: immediate

# =============================================================================
# §1.0 Response Envelope (FIXED — verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# All datetimes ISO 8601 UTC. All money integer cents. All derived/computed
# fields are re-evaluated on read from stored inputs + events (immediate
# consistency), except TrendSnapshot rows which are materialized by
# POST /api/trend-snapshots/compute.
# =============================================================================
entities:
  - name: HospitalUnit
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Unit display name" }
      - { name: category, type: enum, source: input, description: "INPATIENT | EMERGENCY | OUTPATIENT | SURGICAL | ICU | OTHER" }
      - { name: posture, type: enum, source: system, default: STANDARD, description: "STANDARD | RESTRICTED; RESTRICTED blocks new case intake (set by LATE_FILED cascade or PATCH)" }
      - { name: max_concurrent_roundings, type: integer, source: input, default: 2, description: "Max SCHEDULED/COMPLETED-in-window overlapping rounding sessions allowed on this unit; must be >= 1" }
      - { name: open_case_count, type: integer, source: computed, default: 0, description: "Count of PatientCase on this unit with lifecycle_status NOT IN {CLOSED, WITHDRAWN}" }
      - { name: late_filed_event_count, type: integer, source: computed, default: 0, description: "Count of ReportableEvent on this unit's cases with status = LATE_FILED" }

  - name: StaffMember
    parent: null
    common_fields: true
    fields:
      - { name: full_name, type: string, source: input, description: "Staff display name" }
      - { name: capabilities, type: array, source: input, description: "Non-empty subset of [ADVOCATE, INVESTIGATOR, QRO, DIRECTOR]; gates entity-backed role use" }
      - { name: on_leave, type: boolean, source: input, default: false, description: "True blocks new rounding sessions and new assignments" }
      - { name: max_concurrent_assignments, type: integer, source: input, default: 5, description: "Max ACTIVE CaseAssignment rows; must be >= 1" }
      - { name: open_assignment_count, type: integer, source: computed, default: 0, description: "Count of CaseAssignment with investigator_id = this staff and status = ACTIVE" }
      - { name: recovery_issuance_limit_cents, type: integer, source: input, default: 10000, description: "Per-action self-approve ceiling for PatientAdvocate; above this -> PENDING_APPROVAL" }

  - name: PatientCase
    parent: null
    common_fields: true
    fields:
      - { name: patient_ref, type: string, source: input, description: "Opaque patient reference token (no PHI)" }
      - { name: unit_id, type: string, source: input, description: "FK -> HospitalUnit.id; unit where the concern originated" }
      - { name: received_at, type: datetime, source: input, description: "When the concern was received; must be <= current clock" }
      - { name: channel, type: enum, source: input, description: "PHONE | EMAIL | PORTAL | IN_PERSON | LETTER" }
      - { name: description, type: string, source: input, description: "Free-text concern summary" }
      - { name: grievance_category, type: enum, source: input, description: "BILLING | CARE_QUALITY | STAFF_CONDUCT | ACCESS_DELAY | RIGHTS_ABUSE | COMMUNICATION | OTHER" }
      - { name: alleged_abuse_flag, type: boolean, source: input, default: false, description: "True => expedited 7-calendar-day response window and ALLEGED_ABUSE event eligibility" }
      - { name: vulnerable_patient_flag, type: boolean, source: input, default: false, description: "True adds +15 to priority_score" }
      - { name: severity_tier, type: enum, source: input, default: STANDARD, description: "STANDARD | URGENT | CRITICAL; CRITICAL => expedited window + QRO co-sign" }
      - { name: classification, type: enum, source: system, default: UNCLASSIFIED, description: "UNCLASSIFIED | COMPLAINT | GRIEVANCE; mirrors newest ClassificationDecision.decision" }
      - { name: lifecycle_status, type: enum, source: system, default: INTAKE, description: "INTAKE | CLASSIFIED | ASSIGNED | UNDER_INVESTIGATION | FINDINGS_REVIEW | RESPONSE_DRAFTING | RESPONSE_REVIEW | PENDING_CLOSURE | CLOSED | REOPENED | WITHDRAWN" }
      - { name: regulatory_clock_status, type: enum, source: computed, default: ON_TRACK, description: "ON_TRACK | ACK_BREACH | RESPONSE_BREACH | SUSPENDED; derived per regulatory_clock_status_derivation" }
      - { name: acknowledged_at, type: datetime, source: system, description: "Set by POST .../acknowledge; null until sent" }
      - { name: ack_due_at, type: datetime, source: computed, description: "Grievance: received_at + 7 calendar days; null for COMPLAINT/UNCLASSIFIED" }
      - { name: response_due_calendar_at, type: datetime, source: computed, description: "Binding regulatory due: calendar-day variant per regulatory_due_dates; null until classified; re-anchored on reopen/expedite" }
      - { name: response_due_business_at, type: datetime, source: computed, description: "Internal workplan due: business-day variant (skip Sat/Sun + HolidayObservance); null until classified" }
      - { name: tolling_credit_seconds, type: integer, source: computed, default: 0, description: "Sum of merged ClockSuspension durations (seconds), interval-merged to avoid double counting" }
      - { name: outstanding_recovery_cents, type: integer, source: computed, default: 0, description: "sum(ServiceRecoveryAction.value_cents where status=ISSUED) - sum(value_cents where status=REVOKED) for this case" }
      - { name: priority_score, type: integer, source: computed, default: 0, description: "0..100 per case_priority_score; drives auto-assignment review order" }
      - { name: requires_qro_cosign, type: boolean, source: computed, default: false, description: "True when severity_tier=CRITICAL or any ADJUDICATED_SUBSTANTIATED escalation exists for the case" }
      - { name: current_classification_decision_id, type: string, source: system, description: "FK -> ClassificationDecision.id; newest decision; null while UNCLASSIFIED" }
      - { name: resolution_timeliness, type: enum, source: computed, default: NA, description: "NA | ON_TIME | LATE; evaluated at closure against response_due_calendar_at" }
      - { name: closure_note, type: string, source: system, description: "Closure documentation text; required at closure" }
      - { name: closed_at, type: datetime, source: system, description: "Set on transition to CLOSED; cleared on REOPENED" }
      - { name: reopen_count, type: integer, source: system, default: 0, description: "Increments on each CLOSED -> REOPENED" }

  - name: ClassificationDecision
    parent: null
    common_fields: false
    fields:
      - { name: case_id, type: string, source: system, description: "FK -> PatientCase.id" }
      - { name: decision, type: enum, source: input, description: "COMPLAINT | GRIEVANCE" }
      - { name: rationale_code, type: enum, source: input, description: "INITIAL_INTAKE | PATIENT_REQUEST | ESCALATION_OF_CONCERN | REGULATORY_REVIEW | DIRECTOR_OVERRIDE" }
      - { name: note, type: string, source: input, description: "Optional rationale text", default: null }
      - { name: decided_by_id, type: string, source: system, description: "X-User-ID of decider" }
      - { name: supersedes_decision_id, type: string, source: system, description: "FK -> ClassificationDecision.id; prior current decision for the case; null for first", default: null }

  - name: CaseAssignment
    parent: null
    common_fields: true
    fields:
      - { name: case_id, type: string, source: system, description: "FK -> PatientCase.id" }
      - { name: investigator_id, type: string, source: system, description: "FK -> StaffMember.id (explicit or selector-chosen)" }
      - { name: assignment_role, type: enum, source: input, default: PRIMARY, description: "PRIMARY | SUPPORTING" }
      - { name: status, type: enum, source: system, default: ACTIVE, description: "ACTIVE | RELEASED | COMPLETED" }
      - { name: assigned_by_id, type: string, source: system, description: "X-User-ID of creator (Director) or 'system' when selector-chosen" }
      - { name: released_at, type: datetime, source: system, description: "Set on RELEASED", default: null }

  - name: Investigation
    parent: null
    common_fields: true
    fields:
      - { name: case_id, type: string, source: system, description: "FK -> PatientCase.id; exactly one Investigation per case" }
      - { name: status, type: enum, source: system, default: OPEN, description: "OPEN | FINDINGS_SUBMITTED | FINDINGS_ACCEPTED | REOPENED | CANCELLED" }
      - { name: care_concern_flag, type: boolean, source: input, default: false, description: "Set at submit-findings; true auto-creates CARE_CONCERN escalation on acceptance" }
      - { name: findings_summary, type: string, source: input, description: "Required at submit-findings", default: null }
      - { name: submitted_by_id, type: string, source: system, description: "X-User-ID of findings submitter; SoD anchor", default: null }
      - { name: submitted_at, type: datetime, source: system, default: null, description: "Findings submission time" }
      - { name: note_count, type: integer, source: computed, default: 0, description: "Count of InvestigationNote for this investigation" }
      - { name: interview_note_count, type: integer, source: computed, default: 0, description: "Count of InvestigationNote with note_type = INTERVIEW" }

  - name: InvestigationNote
    parent: null
    common_fields: false
    fields:
      - { name: investigation_id, type: string, source: system, description: "FK -> Investigation.id" }
      - { name: author_id, type: string, source: system, description: "X-User-ID of author" }
      - { name: note_type, type: enum, source: input, description: "INTERVIEW | DOCUMENT_REVIEW | SITE_VISIT | PHONE_CALL" }
      - { name: body, type: string, source: input, description: "Note text" }

  - name: ResponseLetter
    parent: null
    common_fields: true
    fields:
      - { name: case_id, type: string, source: system, description: "FK -> PatientCase.id" }
      - { name: supersedes_letter_id, type: string, source: system, description: "FK -> ResponseLetter.id; prior letter this draft replaces; null otherwise", default: null }
      - { name: status, type: enum, source: system, default: DRAFT, description: "DRAFT | IN_REVIEW | RETURNED | APPROVED | ISSUED | SUPERSEDED | CANCELLED" }
      - { name: sections, type: array, source: input, description: "Subset of [PATIENT_SUMMARY, INVESTIGATION_STEPS, FINDINGS, RESOLUTION, CONTACT_INFO, RISK_DISCLOSURE, QAPI_REFERENCE] included in the letter" }
      - { name: body_summary, type: string, source: input, description: "Letter body summary" }
      - { name: drafted_by_id, type: string, source: system, description: "X-User-ID of drafter" }
      - { name: approved_by_id, type: string, source: system, default: null, description: "X-User-ID of approver" }
      - { name: issued_at, type: datetime, source: system, default: null, description: "Set on issue" }
      - { name: return_reason, type: string, source: system, default: null, description: "Last return rationale" }

  - name: ServiceRecoveryAction
    parent: null
    common_fields: true
    fields:
      - { name: case_id, type: string, source: system, description: "FK -> PatientCase.id" }
      - { name: action_type, type: enum, source: input, description: "MEAL_VOUCHER | PARKING_COMP | BILL_ADJUSTMENT | GOODWILL_GESTURE | EXPEDITED_APPOINTMENT" }
      - { name: value_cents, type: integer, source: input, description: "Value; must be > 0" }
      - { name: justification, type: string, source: input, description: "Why the gesture is warranted" }
      - { name: status, type: enum, source: system, default: ISSUED, description: "ISSUED | PENDING_APPROVAL | REJECTED | REVOKED; PENDING_APPROVAL when value_cents > issuer's recovery_issuance_limit_cents" }
      - { name: issued_by_id, type: string, source: system, description: "FK -> StaffMember.id of issuing advocate" }
      - { name: approved_by_id, type: string, source: system, description: "FK -> StaffMember.id of Director approver; null until approved", default: null }

  - name: QualityRiskEscalation
    parent: null
    common_fields: true
    fields:
      - { name: case_id, type: string, source: system, description: "FK -> PatientCase.id" }
      - { name: escalation_type, type: enum, source: input, description: "CARE_CONCERN | SYSTEMIC" }
      - { name: source, type: enum, source: system, description: "MANUAL | AUTO_CARE_FLAG | AUTO_SYSTEMIC_THRESHOLD" }
      - { name: status, type: enum, source: system, default: FILED, description: "FILED | IN_REVIEW | REVIEWS_COMPLETE | ADJUDICATED_SUBSTANTIATED | ADJUDICATED_UNSUBSTANTIATED" }
      - { name: review_track, type: enum, source: input, description: "COMPLIANCE | SAFETY | BOTH; required at triage", default: null }
      - { name: compliance_review_done, type: boolean, source: system, default: false, description: "Set by complete-review(COMPLIANCE)" }
      - { name: safety_review_done, type: boolean, source: system, default: false, description: "Set by complete-review(SAFETY)" }
      - { name: filed_by_id, type: string, source: system, description: "FK -> StaffMember.id of filer, or 'system' for auto-created" }
      - { name: adjudicated_by_id, type: string, source: system, description: "FK -> StaffMember.id of adjudicator; SoD != filed_by_id", default: null }
      - { name: adjudicated_at, type: datetime, source: system, default: null, description: "Set at adjudication" }
      - { name: outcome_note, type: string, source: input, default: null, description: "Adjudication rationale" }

  - name: ReportableEvent
    parent: null
    common_fields: true
    fields:
      - { name: case_id, type: string, source: system, description: "FK -> PatientCase.id" }
      - { name: escalation_id, type: string, source: input, description: "FK -> QualityRiskEscalation.id; required unless trigger_reason = ALLEGED_ABUSE", default: null }
      - { name: authority_code, type: enum, source: input, description: "STATE_HEALTH_DEPT | CMS_REGIONAL | ACCREDITATION_BODY" }
      - { name: trigger_reason, type: enum, source: input, description: "ALLEGED_ABUSE | SUBSTANTIATED_CARE_CONCERN | SYSTEMIC_ISSUE" }
      - { name: status, type: enum, source: system, default: PENDING_FILING, description: "PENDING_FILING | FILED | LATE_FILED | ACKNOWLEDGED" }
      - { name: filing_deadline_at, type: datetime, source: computed, description: "ALLEGED_ABUSE: created_at + 48h exact; otherwise created_at + 5 business days" }
      - { name: filed_at, type: datetime, source: system, default: null, description: "Set on file" }
      - { name: late_filing, type: boolean, source: computed, default: false, description: "True when filed_at > filing_deadline_at" }

  - name: RoundingSession
    parent: null
    common_fields: true
    fields:
      - { name: unit_id, type: string, source: input, description: "FK -> HospitalUnit.id" }
      - { name: advocate_id, type: string, source: system, description: "FK -> StaffMember.id; equals X-User-ID for PatientAdvocate" }
      - { name: start_at, type: datetime, source: input, description: "Window start (inclusive)" }
      - { name: end_at, type: datetime, source: input, description: "Window end (exclusive); half-open semantics" }
      - { name: status, type: enum, source: system, default: SCHEDULED, description: "SCHEDULED | COMPLETED | CANCELLED" }
      - { name: outcome_note, type: string, source: input, default: null, description: "Recorded at complete" }

  - name: InterviewRoom
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Room name" }
      - { name: location, type: string, source: input, description: "Room location" }
      - { name: active, type: boolean, source: input, default: true, description: "Inactive rooms reject new bookings" }

  - name: InterviewBooking
    parent: null
    common_fields: true
    fields:
      - { name: investigation_id, type: string, source: input, description: "FK -> Investigation.id" }
      - { name: room_id, type: string, source: input, description: "FK -> InterviewRoom.id" }
      - { name: start_at, type: datetime, source: input, description: "Booking start (inclusive)" }
      - { name: end_at, type: datetime, source: input, description: "Booking end (exclusive)" }
      - { name: status, type: enum, source: system, default: BOOKED, description: "BOOKED | CANCELLED" }
      - { name: booked_by_id, type: string, source: system, description: "X-User-ID; must equal the case's ACTIVE PRIMARY investigator" }

  - name: SatisfactionFollowUp
    parent: null
    common_fields: true
    fields:
      - { name: case_id, type: string, source: system, description: "FK -> PatientCase.id" }
      - { name: status, type: enum, source: system, default: PENDING, description: "PENDING | RESPONDED | EXPIRED" }
      - { name: due_at, type: datetime, source: computed, description: "closed_at + 5 business days" }
      - { name: expires_at, type: datetime, source: computed, description: "due_at + 10 business days" }
      - { name: score, type: integer, source: input, description: "1..5; <= 2 triggers reopen cascade", default: null }
      - { name: responded_at, type: datetime, source: system, default: null, description: "Set on respond" }

  - name: ClockSuspension
    parent: null
    common_fields: true
    fields:
      - { name: case_id, type: string, source: system, description: "FK -> PatientCase.id" }
      - { name: reason, type: enum, source: input, description: "AWAITING_PATIENT | AWAITING_FAMILY | AWAITING_RECORDS | LANGUAGE_ACCESS" }
      - { name: status, type: enum, source: system, default: OPEN, description: "OPEN | CLOSED" }
      - { name: started_at, type: datetime, source: system, description: "Server clock at creation" }
      - { name: closed_at, type: datetime, source: system, default: null, description: "Server clock at close" }
      - { name: credited_seconds, type: integer, source: computed, default: 0, description: "closed_at - started_at in seconds once CLOSED; OPEN counts (now - started_at) in tolling_credit" }

  - name: TrendSnapshot
    parent: null
    common_fields: true
    fields:
      - { name: unit_id, type: string, source: system, description: "FK -> HospitalUnit.id" }
      - { name: case_category, type: enum, source: system, description: "Grievance category this cell covers" }
      - { name: period, type: string, source: input, description: "YYYY-MM calendar month of case closed_at" }
      - { name: grievances_closed, type: integer, source: computed, default: 0, description: "GRIEVANCE cases on unit+category closed in period" }
      - { name: complaints_closed, type: integer, source: computed, default: 0, description: "COMPLAINT cases on unit+category closed in period" }
      - { name: breaches, type: integer, source: computed, default: 0, description: "Closed cases in cell with resolution_timeliness = LATE" }
      - { name: headcount_rate_bp, type: integer, source: computed, default: 0, description: "round_half_up(breaches * 10000 / (grievances_closed + complaints_closed)); 0 when denominator 0" }
      - { name: exposure_weighted_rate_bp, type: integer, source: computed, default: 0, description: "round_half_up(sum days_late over LATE cases * 10000 / sum response window days over closed cases); 0 when denominator 0" }
      - { name: systemic_new_count, type: integer, source: computed, default: 0, description: "SYSTEMIC escalations auto-created for this unit+category whose triggering case closed in period" }

  - name: HolidayObservance
    parent: null
    common_fields: false
    fields:
      - { name: observance_date, type: string, source: input, description: "YYYY-MM-DD; unique; skipped by business-day arithmetic" }
      - { name: name, type: string, source: input, description: "Holiday name" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: PatientCase
    initial_state: INTAKE
    terminal_states: [WITHDRAWN]
    transitions:
      - from: INTAKE
        to: CLASSIFIED
        trigger: "POST /api/patient-cases/{id}/classification-decisions (first decision)"
        actor: IntakeCoordinator
        preconditions:
          - "Case in INTAKE (ERR_CASE_INVALID_STATE)"
          - "expected_case_version == case.version (ERR_STALE_VERSION)"
        side_effects:
          - "classification := decision; current_classification_decision_id := new decision id"
          - "ack_due_at / response_due_calendar_at / response_due_business_at computed from received_at per regulatory_due_dates"
          - "If decision = GRIEVANCE: run systemic_issue_threshold sweep; may auto-create SYSTEMIC QualityRiskEscalation on this case (see calculations.systemic_issue_threshold)"
          - "increments PatientCase.version by 1"

      - from: CLASSIFIED
        to: ASSIGNED
        trigger: "POST /api/patient-cases/{id}/assignments"
        actor: PatientRelationsDirector
        preconditions:
          - "Case in CLASSIFIED (ERR_CASE_INVALID_STATE)"
          - "expected_case_version == case.version (ERR_STALE_VERSION)"
          - "Explicit investigator: capability INVESTIGATOR, on_leave = false, open_assignment_count < max_concurrent_assignments (ERR_INVESTIGATOR_AT_CAPACITY); re-assigning an investigator with an ACTIVE assignment on this case -> ERR_DUPLICATE_ACTIVE_ASSIGNMENT"
          - "Omitted investigator: auto_assignment_selector picks one; empty pool -> ERR_NO_ELIGIBLE_INVESTIGATOR"
        side_effects:
          - "CaseAssignment created ACTIVE; StaffMember.open_assignment_count += 1"
          - "If assignment_role = PRIMARY and an ACTIVE PRIMARY assignment already exists on this case: prior assignment -> RELEASED with released_at = now (supersede); that investigator's open_assignment_count -= 1"
          - "increments PatientCase.version by 1"

      - from: ASSIGNED
        to: UNDER_INVESTIGATION
        trigger: "POST /api/patient-cases/{id}/investigations"
        actor: DepartmentInvestigator
        preconditions:
          - "Case in ASSIGNED (ERR_CASE_INVALID_STATE)"
          - "An ACTIVE PRIMARY CaseAssignment exists for the case (ERR_NO_ACTIVE_PRIMARY_ASSIGNMENT)"
        side_effects:
          - "Investigation created with status OPEN"

      - from: ASSIGNED
        to: RESPONSE_DRAFTING
        trigger: "POST /api/patient-cases/{id}/fast-track"
        actor: IntakeCoordinator
        preconditions:
          - "Case in ASSIGNED (ERR_CASE_INVALID_STATE)"
          - "classification = COMPLAINT (ERR_FAST_TRACK_COMPLAINT_ONLY)"
        side_effects: []

      - from: UNDER_INVESTIGATION
        to: FINDINGS_REVIEW
        trigger: "POST /api/investigations/{id}/submit-findings"
        actor: DepartmentInvestigator
        preconditions:
          - "Investigation in OPEN (ERR_INVESTIGATION_INVALID_STATE)"
          - "note_count >= 2 AND interview_note_count >= 1 (ERR_INSUFFICIENT_INVESTIGATION_EVIDENCE)"
        side_effects:
          - "investigation.status -> FINDINGS_SUBMITTED; submitted_by_id := X-User-ID; submitted_at := now"
          - "findings_summary, care_concern_flag stored from payload"

      - from: FINDINGS_REVIEW
        to: UNDER_INVESTIGATION
        trigger: "POST /api/investigations/{id}/return-findings"
        actor: PatientRelationsDirector
        preconditions:
          - "Investigation in FINDINGS_SUBMITTED (ERR_INVESTIGATION_INVALID_STATE)"
        side_effects:
          - "investigation.status -> OPEN; findings_summary/submitted_by_id cleared"

      - from: FINDINGS_REVIEW
        to: RESPONSE_DRAFTING
        trigger: "POST /api/investigations/{id}/accept-findings"
        actor: PatientRelationsDirector
        preconditions:
          - "Investigation in FINDINGS_SUBMITTED (ERR_INVESTIGATION_INVALID_STATE)"
        side_effects:
          - "investigation.status -> FINDINGS_ACCEPTED"
          - "Cascade link 1: if care_concern_flag = true, auto-create QualityRiskEscalation (escalation_type CARE_CONCERN, source AUTO_CARE_FLAG, filed_by_id := investigation.submitted_by_id, status FILED)"

      - from: RESPONSE_DRAFTING
        to: RESPONSE_REVIEW
        trigger: "POST /api/response-letters/{id}/submit-review"
        actor: DepartmentInvestigator
        preconditions:
          - "Letter in DRAFT or RETURNED (ERR_LETTER_INVALID_STATE)"
          - "Letter content standard satisfied for case context (ERR_CONTENT_STANDARD_VIOLATION) — see validations"
        side_effects:
          - "letter.status -> IN_REVIEW"

      - from: RESPONSE_REVIEW
        to: RESPONSE_DRAFTING
        trigger: "POST /api/response-letters/{id}/return"
        actor: PatientRelationsDirector
        preconditions:
          - "Letter in IN_REVIEW (ERR_LETTER_INVALID_STATE)"
        side_effects:
          - "letter.status -> RETURNED; return_reason stored"

      - from: RESPONSE_REVIEW
        to: PENDING_CLOSURE
        trigger: "POST /api/response-letters/{id}/approve"
        actor: PatientRelationsDirector | QualityRiskOfficer
        preconditions:
          - "Letter in IN_REVIEW (ERR_LETTER_INVALID_STATE)"
          - "Case in RESPONSE_REVIEW (ERR_CASE_INVALID_STATE)"
          - "Segregation of duties: X-User-ID != investigation.submitted_by_id (ERR_SEGREGATION_OF_DUTIES)"
          - "Co-sign: if case.requires_qro_cosign then caller role must be QualityRiskOfficer (ERR_QRO_COSIGN_REQUIRED)"
          - "Escalation gate: no QualityRiskEscalation for this case in {FILED, IN_REVIEW, REVIEWS_COMPLETE} (ERR_OPEN_ESCALATION_BLOCKS_APPROVAL)"
        side_effects:
          - "letter.status -> APPROVED; approved_by_id := X-User-ID"

      - from: PENDING_CLOSURE
        to: CLOSED
        trigger: "POST /api/response-letters/{id}/issue"
        actor: IntakeCoordinator
        preconditions:
          - "Letter in APPROVED (ERR_LETTER_INVALID_STATE)"
          - "Case in PENDING_CLOSURE (ERR_CASE_INVALID_STATE)"
        side_effects:
          - "letter.status -> ISSUED; issued_at := now"
          - "case.lifecycle_status -> CLOSED; closed_at := now; closure_note := letter body_summary"
          - "resolution_timeliness := ON_TIME if issued_at <= response_due_calendar_at else LATE (boundary: equality is ON_TIME)"
          - "All ACTIVE CaseAssignment rows for the case -> COMPLETED; each investigator open_assignment_count -= 1"
          - "All OPEN ClockSuspension rows -> CLOSED at now (tolling_credit frozen)"
          - "SatisfactionFollowUp created: due_at = closed_at + 5 business days; expires_at = due_at + 10 business days; status PENDING"
          - "HospitalUnit.open_case_count -= 1"

      - from: RESPONSE_DRAFTING
        to: CLOSED
        trigger: "POST /api/patient-cases/{id}/close (complaint fast-track closure)"
        actor: IntakeCoordinator
        preconditions:
          - "Case in RESPONSE_DRAFTING (ERR_CASE_INVALID_STATE)"
          - "classification = COMPLAINT (ERR_GRIEVANCE_REQUIRES_WRITTEN_RESPONSE)"
          - "closure_note present and >= 20 chars (ERR_INVALID_REQUEST)"
        side_effects:
          - "case.lifecycle_status -> CLOSED; closed_at := now; closure_note stored"
          - "resolution_timeliness := ON_TIME if closed_at <= response_due_calendar_at else LATE"
          - "ACTIVE assignments -> COMPLETED (counts -= 1); OPEN suspensions -> CLOSED"
          - "SatisfactionFollowUp created (same due/expiry rule)"
          - "HospitalUnit.open_case_count -= 1"

      - from: CLOSED
        to: REOPENED
        trigger: "system (SatisfactionFollowUp responded with score <= 2) OR POST /api/patient-cases/{id}/reopen"
        actor: system | PatientRelationsDirector
        preconditions:
          - "Case in CLOSED (ERR_CASE_INVALID_STATE)"
        side_effects:
          - "Cascade link 1: lifecycle_status -> REOPENED; reopen_count += 1; closed_at cleared; resolution_timeliness -> NA; HospitalUnit.open_case_count += 1"
          - "Cascade link 2 (caused by REOPENED): case's Investigation FINDINGS_ACCEPTED -> REOPENED; case's ISSUED ResponseLetter -> SUPERSEDED"
          - "Cascade link 3 (caused by link-2 state changes): response dues re-anchored: response_due_calendar_at := now + 15 calendar days; response_due_business_at := now + 15 business days; requires_qro_cosign recomputed"
          - "increments PatientCase.version by 1"

      - from: REOPENED
        to: UNDER_INVESTIGATION
        trigger: "POST /api/investigations/{id}/resume"
        actor: DepartmentInvestigator
        preconditions:
          - "Investigation in REOPENED (ERR_INVESTIGATION_INVALID_STATE)"
          - "Case in REOPENED (ERR_CASE_INVALID_STATE)"
        side_effects:
          - "investigation.status -> OPEN"
          - "Bubble up: case.lifecycle_status REOPENED -> UNDER_INVESTIGATION"

      - from: INTAKE
        to: WITHDRAWN
        trigger: "POST /api/patient-cases/{id}/withdraw"
        actor: IntakeCoordinator
        preconditions:
          - "Case in any non-terminal, non-CLOSED state (ERR_CASE_INVALID_STATE)"
        side_effects:
          - "ACTIVE assignments -> RELEASED (counts -= 1); Investigation in {OPEN, FINDINGS_SUBMITTED, REOPENED} -> CANCELLED"
          - "Letters in {DRAFT, IN_REVIEW, RETURNED} -> CANCELLED; letter APPROVED stays APPROVED"
          - "OPEN ClockSuspensions -> CLOSED at now; PENDING_APPROVAL recovery actions -> REJECTED"
          - "HospitalUnit.open_case_count -= 1"
      - from: CLASSIFIED
        to: WITHDRAWN
        trigger: "POST /api/patient-cases/{id}/withdraw"
        actor: IntakeCoordinator
        preconditions: ["Case withdrawable (ERR_CASE_INVALID_STATE)"]
        side_effects: ["Same withdraw cascade as INTAKE -> WITHDRAWN"]
      - from: ASSIGNED
        to: WITHDRAWN
        trigger: "POST /api/patient-cases/{id}/withdraw"
        actor: IntakeCoordinator
        preconditions: ["Case withdrawable (ERR_CASE_INVALID_STATE)"]
        side_effects: ["Same withdraw cascade as INTAKE -> WITHDRAWN"]
      - from: UNDER_INVESTIGATION
        to: WITHDRAWN
        trigger: "POST /api/patient-cases/{id}/withdraw"
        actor: IntakeCoordinator
        preconditions: ["Case withdrawable (ERR_CASE_INVALID_STATE)"]
        side_effects: ["Same withdraw cascade as INTAKE -> WITHDRAWN"]
      - from: FINDINGS_REVIEW
        to: WITHDRAWN
        trigger: "POST /api/patient-cases/{id}/withdraw"
        actor: IntakeCoordinator
        preconditions: ["Case withdrawable (ERR_CASE_INVALID_STATE)"]
        side_effects: ["Same withdraw cascade as INTAKE -> WITHDRAWN"]
      - from: RESPONSE_DRAFTING
        to: WITHDRAWN
        trigger: "POST /api/patient-cases/{id}/withdraw"
        actor: IntakeCoordinator
        preconditions: ["Case withdrawable (ERR_CASE_INVALID_STATE)"]
        side_effects: ["Same withdraw cascade as INTAKE -> WITHDRAWN"]
      - from: RESPONSE_REVIEW
        to: WITHDRAWN
        trigger: "POST /api/patient-cases/{id}/withdraw"
        actor: IntakeCoordinator
        preconditions: ["Case withdrawable (ERR_CASE_INVALID_STATE)"]
        side_effects: ["Same withdraw cascade as INTAKE -> WITHDRAWN"]
      - from: PENDING_CLOSURE
        to: WITHDRAWN
        trigger: "POST /api/patient-cases/{id}/withdraw"
        actor: IntakeCoordinator
        preconditions: ["Case withdrawable (ERR_CASE_INVALID_STATE)"]
        side_effects: ["Same withdraw cascade as INTAKE -> WITHDRAWN"]
      - from: REOPENED
        to: WITHDRAWN
        trigger: "POST /api/patient-cases/{id}/withdraw"
        actor: IntakeCoordinator
        preconditions: ["Case withdrawable (ERR_CASE_INVALID_STATE)"]
        side_effects: ["Same withdraw cascade as INTAKE -> WITHDRAWN"]

  - entity: PatientCase
    # Parallel derived dimension — evolves independently of lifecycle_status.
    initial_state: ON_TRACK
    terminal_states: []
    state_field: regulatory_clock_status
    transitions:
      - from: ON_TRACK
        to: ACK_BREACH
        trigger: "system (derived on read / clock advance): now > ack_due_at AND acknowledged_at IS NULL AND classification = GRIEVANCE"
        actor: system
        preconditions: []
        side_effects: []
      - from: ON_TRACK
        to: RESPONSE_BREACH
        trigger: "system (derived): now > response_due_calendar_at AND lifecycle_status NOT IN {CLOSED, WITHDRAWN} AND classification set"
        actor: system
        preconditions: []
        side_effects: []
      - from: ACK_BREACH
        to: RESPONSE_BREACH
        trigger: "system (derived): response deadline passes while ack still unsent or after ack"
        actor: system
        preconditions: []
        side_effects: []
      - from: ON_TRACK
        to: SUSPENDED
        trigger: "system (derived): an OPEN ClockSuspension exists for the case"
        actor: system
        preconditions: []
        side_effects: []
      - from: ACK_BREACH
        to: SUSPENDED
        trigger: "system (derived): suspension opened while in ACK_BREACH"
        actor: system
        preconditions: []
        side_effects: []
      - from: SUSPENDED
        to: ON_TRACK
        trigger: "system (derived on suspension close): dues re-extended by tolling_credit_seconds; if now <= response_due_calendar_at and ack satisfied or not yet due"
        actor: system
        preconditions: []
        side_effects: []
      - from: SUSPENDED
        to: ACK_BREACH
        trigger: "system (derived on suspension close): ack still unsent and now > ack_due_at (ack clock is NOT tolled)"
        actor: system
        preconditions: []
        side_effects: []
      - from: SUSPENDED
        to: RESPONSE_BREACH
        trigger: "system (derived on suspension close): now still > tolled response_due_calendar_at"
        actor: system
        preconditions: []
        side_effects: []
      - from: ACK_BREACH
        to: ON_TRACK
        trigger: "POST /api/patient-cases/{id}/acknowledge (acknowledged_at set; response not yet breached)"
        actor: IntakeCoordinator
        preconditions: ["Case not CLOSED/WITHDRAWN (ERR_CASE_INVALID_STATE)", "acknowledged_at IS NULL (ERR_ALREADY_ACKNOWLEDGED)"]
        side_effects: ["acknowledged_at := now", "increments PatientCase.version by 1"]
      - from: RESPONSE_BREACH
        to: ON_TRACK
        trigger: "system (derived): reclassification, expedite recompute, or tolling credit moves response_due_calendar_at >= now while case unresolved"
        actor: system
        preconditions: []
        side_effects: []
    note: "RESPONSE_BREACH precedence over ACK_BREACH when both hold; SUSPENDED masks both while a suspension is OPEN (ack clock keeps accruing underneath and is re-derived at close)."

  - entity: CaseAssignment
    initial_state: ACTIVE
    terminal_states: [RELEASED, COMPLETED]
    transitions:
      - from: ACTIVE
        to: RELEASED
        trigger: "POST /api/case-assignments/{id}/release OR supersede by new PRIMARY OR case withdraw"
        actor: PatientRelationsDirector | system
        preconditions: ["Assignment ACTIVE (ERR_ASSIGNMENT_INVALID_STATE)"]
        side_effects: ["released_at := now", "StaffMember.open_assignment_count -= 1"]
      - from: ACTIVE
        to: COMPLETED
        trigger: "system (case reaches CLOSED)"
        actor: system
        preconditions: []
        side_effects: ["StaffMember.open_assignment_count -= 1"]

  - entity: Investigation
    initial_state: OPEN
    terminal_states: [FINDINGS_ACCEPTED, CANCELLED]
    transitions:
      - from: OPEN
        to: FINDINGS_SUBMITTED
        trigger: "POST /api/investigations/{id}/submit-findings"
        actor: DepartmentInvestigator
        preconditions: ["OPEN (ERR_INVESTIGATION_INVALID_STATE)", "note_count >= 2 AND interview_note_count >= 1 (ERR_INSUFFICIENT_INVESTIGATION_EVIDENCE)"]
        side_effects: ["submitted_by_id, submitted_at, findings_summary, care_concern_flag set"]
      - from: FINDINGS_SUBMITTED
        to: FINDINGS_ACCEPTED
        trigger: "POST /api/investigations/{id}/accept-findings"
        actor: PatientRelationsDirector
        preconditions: ["FINDINGS_SUBMITTED (ERR_INVESTIGATION_INVALID_STATE)"]
        side_effects: ["case FINDINGS_REVIEW -> RESPONSE_DRAFTING", "if care_concern_flag: auto-create CARE_CONCERN escalation (FILED, source AUTO_CARE_FLAG, filed_by_id := submitted_by_id)"]
      - from: FINDINGS_SUBMITTED
        to: OPEN
        trigger: "POST /api/investigations/{id}/return-findings"
        actor: PatientRelationsDirector
        preconditions: ["FINDINGS_SUBMITTED (ERR_INVESTIGATION_INVALID_STATE)"]
        side_effects: ["case FINDINGS_REVIEW -> UNDER_INVESTIGATION; findings fields cleared"]
      - from: FINDINGS_ACCEPTED
        to: REOPENED
        trigger: "system (case CLOSED -> REOPENED cascade)"
        actor: system
        preconditions: []
        side_effects: []
      - from: REOPENED
        to: OPEN
        trigger: "POST /api/investigations/{id}/resume"
        actor: DepartmentInvestigator
        preconditions: ["REOPENED (ERR_INVESTIGATION_INVALID_STATE)"]
        side_effects: ["case REOPENED -> UNDER_INVESTIGATION"]
      - from: OPEN
        to: CANCELLED
        trigger: "system (case withdraw cascade)"
        actor: system
        preconditions: []
        side_effects: []
      - from: FINDINGS_SUBMITTED
        to: CANCELLED
        trigger: "system (case withdraw cascade)"
        actor: system
        preconditions: []
        side_effects: []
      - from: REOPENED
        to: CANCELLED
        trigger: "system (case withdraw cascade)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: ResponseLetter
    initial_state: DRAFT
    terminal_states: [ISSUED, SUPERSEDED, CANCELLED]
    transitions:
      - from: DRAFT
        to: IN_REVIEW
        trigger: "POST /api/response-letters/{id}/submit-review"
        actor: DepartmentInvestigator
        preconditions: ["DRAFT or RETURNED (ERR_LETTER_INVALID_STATE)", "content standard satisfied (ERR_CONTENT_STANDARD_VIOLATION)"]
        side_effects: ["case RESPONSE_DRAFTING -> RESPONSE_REVIEW"]
      - from: RETURNED
        to: IN_REVIEW
        trigger: "POST /api/response-letters/{id}/submit-review"
        actor: DepartmentInvestigator
        preconditions: ["DRAFT or RETURNED (ERR_LETTER_INVALID_STATE)", "content standard satisfied (ERR_CONTENT_STANDARD_VIOLATION)"]
        side_effects: ["case RESPONSE_DRAFTING -> RESPONSE_REVIEW"]
      - from: IN_REVIEW
        to: RETURNED
        trigger: "POST /api/response-letters/{id}/return"
        actor: PatientRelationsDirector
        preconditions: ["IN_REVIEW (ERR_LETTER_INVALID_STATE)"]
        side_effects: ["case RESPONSE_REVIEW -> RESPONSE_DRAFTING; return_reason stored"]
      - from: IN_REVIEW
        to: APPROVED
        trigger: "POST /api/response-letters/{id}/approve"
        actor: PatientRelationsDirector | QualityRiskOfficer
        preconditions: ["IN_REVIEW (ERR_LETTER_INVALID_STATE)", "SoD vs investigation.submitted_by_id (ERR_SEGREGATION_OF_DUTIES)", "requires_qro_cosign => QualityRiskOfficer (ERR_QRO_COSIGN_REQUIRED)", "no open escalation (ERR_OPEN_ESCALATION_BLOCKS_APPROVAL)"]
        side_effects: ["case RESPONSE_REVIEW -> PENDING_CLOSURE; approved_by_id set"]
      - from: APPROVED
        to: ISSUED
        trigger: "POST /api/response-letters/{id}/issue"
        actor: IntakeCoordinator
        preconditions: ["APPROVED (ERR_LETTER_INVALID_STATE)", "case PENDING_CLOSURE (ERR_CASE_INVALID_STATE)"]
        side_effects: ["issued_at := now; case -> CLOSED (see PatientCase PENDING_CLOSURE -> CLOSED side effects)"]
      - from: ISSUED
        to: SUPERSEDED
        trigger: "system (case reopen cascade)"
        actor: system
        preconditions: []
        side_effects: []
      - from: DRAFT
        to: CANCELLED
        trigger: "system (case withdraw cascade)"
        actor: system
        preconditions: []
        side_effects: []
      - from: IN_REVIEW
        to: CANCELLED
        trigger: "system (case withdraw cascade)"
        actor: system
        preconditions: []
        side_effects: []
      - from: RETURNED
        to: CANCELLED
        trigger: "system (case withdraw cascade)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: ServiceRecoveryAction
    initial_state: ISSUED
    terminal_states: [REJECTED, REVOKED]
    transitions:
      - from: ISSUED
        to: REVOKED
        trigger: "POST /api/recovery-actions/{id}/revoke"
        actor: PatientRelationsDirector
        preconditions: ["ISSUED (ERR_RECOVERY_INVALID_STATE)"]
        side_effects: ["case.outstanding_recovery_cents -= value_cents"]
      - from: PENDING_APPROVAL
        to: ISSUED
        trigger: "POST /api/recovery-actions/{id}/approve"
        actor: PatientRelationsDirector
        preconditions: ["PENDING_APPROVAL (ERR_RECOVERY_INVALID_STATE)", "SoD: X-User-ID != issued_by_id (ERR_SEGREGATION_OF_DUTIES)", "case cumulative cap re-checked at approval: sum(ISSUED) + value <= 50000 (ERR_RECOVERY_CASE_CAP_EXCEEDED)"]
        side_effects: ["approved_by_id := X-User-ID", "case.outstanding_recovery_cents += value_cents"]
      - from: PENDING_APPROVAL
        to: REJECTED
        trigger: "POST /api/recovery-actions/{id}/reject OR system (case withdraw cascade)"
        actor: PatientRelationsDirector | system
        preconditions: ["PENDING_APPROVAL (ERR_RECOVERY_INVALID_STATE)"]
        side_effects: []
    note: "Creation sets initial state ISSUED when value_cents <= issuer recovery_issuance_limit_cents, else PENDING_APPROVAL."

  - entity: QualityRiskEscalation
    initial_state: FILED
    terminal_states: [ADJUDICATED_SUBSTANTIATED, ADJUDICATED_UNSUBSTANTIATED]
    transitions:
      - from: FILED
        to: IN_REVIEW
        trigger: "POST /api/escalations/{id}/triage"
        actor: QualityRiskOfficer
        preconditions: ["FILED (ERR_ESCALATION_INVALID_STATE)"]
        side_effects: ["review_track stored"]
      - from: IN_REVIEW
        to: REVIEWS_COMPLETE
        trigger: "POST /api/escalations/{id}/complete-review (system join when required branches done)"
        actor: QualityRiskOfficer | system
        preconditions: ["IN_REVIEW (ERR_ESCALATION_INVALID_STATE)"]
        side_effects: ["review_branch flag set; when review_track = COMPLIANCE and compliance_review_done, or SAFETY and safety_review_done, or BOTH and both flags -> REVIEWS_COMPLETE"]
      - from: REVIEWS_COMPLETE
        to: ADJUDICATED_SUBSTANTIATED
        trigger: "POST /api/escalations/{id}/adjudicate"
        actor: QualityRiskOfficer
        preconditions: ["REVIEWS_COMPLETE (ERR_ESCALATION_INVALID_STATE)", "SoD: X-User-ID != filed_by_id when filed_by_id != 'system' (ERR_SEGREGATION_OF_DUTIES)"]
        side_effects:
          - "Cascade link 1: adjudicated_by_id := X-User-ID; adjudicated_at := now; case.requires_qro_cosign recomputed (-> true)"
          - "Cascade link 2 (caused by link 1): expedited due recompute: if adjudicated_at + 7 calendar days < case.response_due_calendar_at, set response_due_calendar_at := adjudicated_at + 7d (and response_due_business_at := adjudicated_at + 7 business days when earlier)"
          - "Cascade link 3 (caused by link 2): if recomputed response_due_calendar_at < now and case unresolved -> regulatory_clock_status = RESPONSE_BREACH AND auto-create ReportableEvent (trigger_reason SUBSTANTIATED_CARE_CONCERN, escalation_id := this, status PENDING_FILING, deadline := adjudicated_at + 5 business days)"
      - from: REVIEWS_COMPLETE
        to: ADJUDICATED_UNSUBSTANTIATED
        trigger: "POST /api/escalations/{id}/adjudicate"
        actor: QualityRiskOfficer
        preconditions: ["REVIEWS_COMPLETE (ERR_ESCALATION_INVALID_STATE)", "SoD as above (ERR_SEGREGATION_OF_DUTIES)"]
        side_effects: ["adjudicated_by_id, adjudicated_at set"]

  - entity: ReportableEvent
    initial_state: PENDING_FILING
    terminal_states: [ACKNOWLEDGED]
    transitions:
      - from: PENDING_FILING
        to: FILED
        trigger: "POST /api/reportable-events/{id}/file when now <= filing_deadline_at"
        actor: QualityRiskOfficer
        preconditions: ["PENDING_FILING (ERR_EVENT_INVALID_STATE)"]
        side_effects: ["filed_at := now; late_filing := false"]
      - from: PENDING_FILING
        to: LATE_FILED
        trigger: "POST /api/reportable-events/{id}/file when now > filing_deadline_at"
        actor: QualityRiskOfficer
        preconditions: ["PENDING_FILING (ERR_EVENT_INVALID_STATE)"]
        side_effects:
          - "Cascade link 1: filed_at := now; late_filing := true"
          - "Cascade link 2 (caused by link 1): unit of the case: late_filed_event_count += 1; if posture = STANDARD -> RESTRICTED"
          - "Cascade link 3 (caused by link 2): while RESTRICTED, POST /api/patient-cases on that unit is rejected (ERR_UNIT_IN_RESTRICTED_POSTURE) and PATCH restore is blocked until every LATE_FILED event on the unit is ACKNOWLEDGED (ERR_UNIT_HAS_UNRESOLVED_LATE_EVENTS)"
      - from: FILED
        to: ACKNOWLEDGED
        trigger: "POST /api/reportable-events/{id}/acknowledge"
        actor: ComplianceAuditor
        preconditions: ["FILED or LATE_FILED (ERR_EVENT_INVALID_STATE)"]
        side_effects: []
      - from: LATE_FILED
        to: ACKNOWLEDGED
        trigger: "POST /api/reportable-events/{id}/acknowledge"
        actor: ComplianceAuditor
        preconditions: ["FILED or LATE_FILED (ERR_EVENT_INVALID_STATE)"]
        side_effects: []

  - entity: RoundingSession
    initial_state: SCHEDULED
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - from: SCHEDULED
        to: COMPLETED
        trigger: "POST /api/rounding-sessions/{id}/complete"
        actor: PatientAdvocate
        preconditions: ["SCHEDULED (ERR_ROUNDING_INVALID_STATE)", "caller is the session advocate (ERR_IDENTITY_MISMATCH)"]
        side_effects: []
      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /api/rounding-sessions/{id}/cancel"
        actor: PatientAdvocate
        preconditions: ["SCHEDULED (ERR_ROUNDING_INVALID_STATE)", "caller is the session advocate (ERR_IDENTITY_MISMATCH)"]
        side_effects: []

  - entity: InterviewBooking
    initial_state: BOOKED
    terminal_states: [CANCELLED]
    transitions:
      - from: BOOKED
        to: CANCELLED
        trigger: "POST /api/interview-bookings/{id}/cancel"
        actor: DepartmentInvestigator
        preconditions: ["BOOKED (ERR_BOOKING_INVALID_STATE)", "caller is the booking investigator (ERR_IDENTITY_MISMATCH)"]
        side_effects: []

  - entity: SatisfactionFollowUp
    initial_state: PENDING
    terminal_states: [RESPONDED, EXPIRED]
    transitions:
      - from: PENDING
        to: RESPONDED
        trigger: "POST /api/follow-ups/{id}/respond"
        actor: PatientAdvocate
        preconditions: ["PENDING (ERR_FOLLOWUP_INVALID_STATE)", "now <= expires_at (ERR_FOLLOWUP_INVALID_STATE — expired)", "score in 1..5 (ERR_FOLLOWUP_SCORE_INVALID)"]
        side_effects:
          - "score, responded_at set"
          - "If score <= 2: fire PatientCase CLOSED -> REOPENED cascade (see PatientCase)"
      - from: PENDING
        to: EXPIRED
        trigger: "system (derived: now > expires_at while PENDING; respond attempt past expiry is rejected)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: ClockSuspension
    initial_state: OPEN
    terminal_states: [CLOSED]
    transitions:
      - from: OPEN
        to: CLOSED
        trigger: "POST /api/clock-suspensions/{id}/close OR system (case close/withdraw cascade)"
        actor: IntakeCoordinator | system
        preconditions: ["OPEN (ERR_SUSPENSION_INVALID_STATE)"]
        side_effects:
          - "closed_at := now; credited_seconds := closed_at - started_at"
          - "case.tolling_credit_seconds recomputed via interval-merge; response dues re-extended; regulatory_clock_status re-derived"

  - entity: HospitalUnit
    initial_state: STANDARD
    terminal_states: []
    state_field: posture
    transitions:
      - from: STANDARD
        to: RESTRICTED
        trigger: "system (LATE_FILED cascade) OR PATCH /api/hospital-units/{id} {posture: RESTRICTED}"
        actor: system | PatientRelationsDirector
        preconditions: []
        side_effects: ["New POST /api/patient-cases on this unit rejected (ERR_UNIT_IN_RESTRICTED_POSTURE)"]
      - from: RESTRICTED
        to: STANDARD
        trigger: "PATCH /api/hospital-units/{id} {posture: STANDARD}"
        actor: PatientRelationsDirector
        preconditions: ["No LATE_FILED (unacknowledged) ReportableEvent on this unit's cases (ERR_UNIT_HAS_UNRESOLVED_LATE_EVENTS)"]
        side_effects: []

# =============================================================================
# §1.2.1 Concurrency Rules (OCC on parent version only)
# =============================================================================
concurrency_rules:
  - rule_id: case-reclassification-stale-version
    parent_entity: PatientCase
    write_endpoint: "POST /api/patient-cases/{id}/classification-decisions"
    occ_field: expected_case_version
    description: |
      Recording a ClassificationDecision against a PatientCase whose version has
      advanced since the caller last observed it is rejected. A new decision
      legitimately supersedes the current one under product semantics, so a
      second sequential create observing identical state would otherwise also
      succeed; the stale expected_case_version is the only signal that the
      caller's view (current classification, dues) is out of date.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: case-assignment-stale-version
    parent_entity: PatientCase
    write_endpoint: "POST /api/patient-cases/{id}/assignments"
    occ_field: expected_case_version
    description: |
      Creating a PRIMARY assignment auto-releases any existing ACTIVE PRIMARY
      (supersede semantics), so a second sequential create after another writer
      has just assigned would still be a legitimate product action. The stale
      expected_case_version rejects the caller whose view of the case predates
      the latest assignment.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: regulatory_due_dates
    trigger: "classification decision create (initial + reclassification), case reopen re-anchor, substantiated-escalation expedite recompute, suspension close (tolling re-extend)"
    algorithm: chronological
    formula: |
      Window N depends on classification + severity:
        GRIEVANCE: N = 7 if (severity_tier = CRITICAL or alleged_abuse_flag) else 30
        COMPLAINT: N = 3   (internal target; same fields populated)
        UNCLASSIFIED: all dues null
      ack_due_at (grievance only) = received_at + 7 * 86400s  (always CALENDAR variant)
      CALENDAR variant: base_due = received_at + N * 86400s
      BUSINESS variant: base_due = business_due(date(received_at), N) at time-of-day(received_at), where
        business_due counts N days skipping Saturdays, Sundays, and every HolidayObservance.observance_date,
        starting from the day AFTER date(received_at).
      Binding dues stored on case:
        response_due_calendar_at = CALENDAR base_due + tolling_credit_seconds
        response_due_business_at = BUSINESS base_due + tolling_credit_seconds
      Re-anchor on reopen: base becomes (reopen_time + 15 days) in each variant.
      Expedite on substantiation: if adjudicated_at + 7d (calendar) < response_due_calendar_at,
        response_due_calendar_at := adjudicated_at + 7d (business variant analogous with business days).
    input_set: "PatientCase.received_at, classification, severity_tier, alleged_abuse_flag; HolidayObservance rows (all); ClockSuspension rows for tolling"
    constants:
      ACK_WINDOW_DAYS: 7
      GRIEVANCE_STANDARD_DAYS: 30
      EXPEDITED_DAYS: 7
      COMPLAINT_TARGET_DAYS: 3
      REOPEN_WINDOW_DAYS: 15
    precision: "second precision, no rounding"
    variants:
      - name: calendar
        when: "binding regulatory deadline (response_due_calendar_at, ack_due_at)"
        difference: "raw +N*86400s; ignores weekends/holidays"
      - name: business
        when: "internal workplan target (response_due_business_at)"
        difference: "skips Sat/Sun + HolidayObservance dates; identical received_at yields a strictly later (or equal) due whenever the window contains a non-business day"

  - name: tolling_credit_seconds
    trigger: "suspension create/close, any read of a case with suspensions, due recompute"
    algorithm: interval_merge
    formula: |
      intervals = [(started_at, closed_at OR now) for each ClockSuspension of case]
      sort by started_at ASC; merge overlapping or exactly-adjacent intervals
      (next.started_at <= current.end => merge, end = max(end))
      tolling_credit_seconds = sum(end - start) over merged intervals
    input_set: "all ClockSuspension rows of the case, any status (OPEN uses now as provisional end)"
    constants: {}
    precision: "second precision"

  - name: regulatory_clock_status_derivation
    trigger: "every read of PatientCase, every clock advance, acknowledge, suspension close, reclassification, expedite recompute"
    algorithm: threshold
    formula: |
      Pinned evaluation order (circular-looking dependency resolved top-down):
        (1) recompute tolling_credit_seconds (interval-merge)
        (2) recompute response_due_calendar_at = base + tolling_credit_seconds
        (3) derive status; status NEVER feeds back into (1)-(2) within the same evaluation
      Derivation:
        if lifecycle_status IN {CLOSED, WITHDRAWN} or classification = UNCLASSIFIED -> ON_TRACK
        elif any OPEN ClockSuspension exists -> SUSPENDED
        elif response_due_calendar_at IS NOT NULL and now > response_due_calendar_at -> RESPONSE_BREACH
        elif classification = GRIEVANCE and acknowledged_at IS NULL and now > ack_due_at -> ACK_BREACH
        else ON_TRACK
      (RESPONSE_BREACH outranks ACK_BREACH; SUSPENDED masks both.)
    input_set: "case fields + suspension set + clock"
    constants: {}
    precision: "second precision"

  - name: case_priority_score
    trigger: "every read of PatientCase (derived), assignment selector review ordering"
    algorithm: weighted_scoring
    formula: |
      severity_base = {STANDARD: 20, URGENT: 35, CRITICAL: 50}[severity_tier]
      vulnerability = 15 if vulnerable_patient_flag else 0
      days_remaining = floor((response_due_calendar_at - now) / 86400) when due set, else 999
      urgency = min(40, max(0, (10 - days_remaining) * 4))
      reopen_bonus = 10 * reopen_count
      priority_score = min(100, severity_base + vulnerability + urgency + reopen_bonus)
    input_set: "case severity_tier, vulnerable_patient_flag, response_due_calendar_at, reopen_count, clock"
    constants:
      CAP: 100
      URGENCY_CAP: 40
      URGENCY_SLOPE: 4
      URGENCY_FREE_DAYS: 10
      REOPEN_BONUS: 10
    precision: "integer"

  - name: auto_assignment_selector
    trigger: "POST /api/patient-cases/{id}/assignments with investigator_id omitted"
    algorithm: selector
    formula: |
      eligibility: StaffMember.capabilities contains INVESTIGATOR
                   AND on_leave = false
                   AND open_assignment_count < max_concurrent_assignments
      ranking: open_assignment_count ASC
      tie-break: created_at ASC (earliest registered staff first; id NEVER used)
      fallback: candidate set empty -> request rejected with ERR_NO_ELIGIBLE_INVESTIGATOR (case stays CLASSIFIED)
    input_set: "all StaffMember rows"
    constants: {}
    precision: "n/a"

  - name: unit_breach_rate
    trigger: "POST /api/trend-snapshots/compute materialization"
    algorithm: aggregation
    formula: |
      For cell (unit, category, period):
        closures = cases on unit+category with closed_at in period (closed_at >= period_start AND < period_end)
        grievances_closed / complaints_closed split by classification at closure
        breaches = closures with resolution_timeliness = LATE
      headcount variant:
        headcount_rate_bp = round_half_up(breaches * 10000 / closures); 0 when closures = 0
      exposure-weighted variant:
        days_late(c) = (closed_at - response_due_calendar_at)/86400 for LATE cases (positive)
        window_days(c) = (response_due_calendar_at - received_at)/86400 at closure time
        exposure_weighted_rate_bp = round_half_up(sum(days_late) * 10000 / sum(window_days) over closures);
          0 when sum(window_days) = 0
    input_set: "PatientCase rows closed in period (CLOSED at snapshot time), grouped by unit_id x grievance_category"
    constants:
      BP_BASE: 10000
    precision: "integer basis points, round_half_up"
    variants:
      - name: headcount
        when: "trend cell headline rate"
        difference: "breach COUNT over closure COUNT — ignores how late each breach was"
      - name: exposure_weighted
        when: "regulatory exposure rate reported to compliance"
        difference: "weights by days-late over total window-days — identical closures yield a different rate whenever late-days per breach differ"

  - name: systemic_issue_threshold
    trigger: "ClassificationDecision created with decision = GRIEVANCE (after dues computed)"
    algorithm: threshold
    formula: |
      window_cases = PatientCase rows with unit_id = case.unit_id
                     AND grievance_category = case.grievance_category
                     AND classification = GRIEVANCE (including this one)
                     AND received_at >= (now - 30 * 86400s)
                     AND lifecycle_status != WITHDRAWN
      if count(window_cases) >= 3
         AND no QualityRiskEscalation exists with escalation_type = SYSTEMIC
            on any case of this unit+category with status IN {FILED, IN_REVIEW, REVIEWS_COMPLETE}:
        auto-create QualityRiskEscalation on THIS case
        (escalation_type SYSTEMIC, source AUTO_SYSTEMIC_THRESHOLD, filed_by_id 'system', status FILED)
    input_set: "cases by unit+category in rolling 30-day window; open SYSTEMIC escalations on that unit+category"
    constants:
      SYSTEMIC_COUNT: 3
      ROLLING_WINDOW_DAYS: 30
    precision: "count boundary >= 3 (exactly 3 triggers; 2 does not)"

  - name: recovery_cap_check
    trigger: "POST /api/patient-cases/{id}/recovery-actions and POST /api/recovery-actions/{id}/approve"
    algorithm: threshold
    formula: |
      CASE_CAP = 50000 cents
      At create: projected = sum(value_cents of ISSUED actions on case) + value_cents(new)
                 projected > CASE_CAP -> ERR_RECOVERY_CASE_CAP_EXCEEDED
                 (projected == CASE_CAP is ALLOWED — boundary is strict >)
      Initial state: value_cents <= issuer.recovery_issuance_limit_cents -> ISSUED
                     else -> PENDING_APPROVAL (pending value does NOT consume cap yet)
      At approve: re-check sum(ISSUED) + value <= CASE_CAP (intervening issues may have consumed headroom)
    input_set: "ServiceRecoveryAction rows of case with status = ISSUED"
    constants:
      CASE_CAP_CENTS: 50000
    precision: "integer cents"

  - name: reportable_event_filing_deadline
    trigger: "ReportableEvent creation (manual or auto-cascade)"
    algorithm: chronological
    formula: |
      if trigger_reason = ALLEGED_ABUSE: filing_deadline_at = created_at + 48 * 3600s (exact hours, no calendar skip)
      else: filing_deadline_at = business_due(date(created_at), 5) at time-of-day(created_at)
      late_filing := filed_at > filing_deadline_at (equality is ON TIME -> FILED)
    input_set: "trigger_reason, created_at, HolidayObservance"
    constants:
      ABUSE_HOURS: 48
      STANDARD_BUSINESS_DAYS: 5
    precision: "second precision"

  - name: trend_snapshot_system_rate
    trigger: "POST /api/trend-snapshots/compute (after per-cell rates)"
    algorithm: aggregation
    formula: |
      Pinned rounding order (nested rounding — order matters):
        (1) compute each cell's headcount_rate_bp and ROUND to integer bp first (round_half_up)
        (2) system_rate_bp = round_half_up(mean of the per-cell rounded headcount_rate_bp) over cells with closures > 0
      Computing globally (sum breaches / sum closures) is FORBIDDEN and yields different bp.
    input_set: "cells with (grievances_closed + complaints_closed) > 0 in the computed period"
    constants:
      BP_BASE: 10000
    precision: "integer basis points, round_half_up; per-cell round BEFORE averaging"

  - name: followup_schedule
    trigger: "case closure (letter issue or complaint close)"
    algorithm: chronological
    formula: |
      due_at = business_due(date(closed_at), 5) at time-of-day(closed_at)
      expires_at = business_due(date(due_at), 10) at time-of-day(due_at)
      respond rejected when now > expires_at
    input_set: "closed_at, HolidayObservance"
    constants:
      DUE_BUSINESS_DAYS: 5
      EXPIRY_BUSINESS_DAYS: 10
    precision: "second precision"

  - name: interview_booking_buffer_check
    trigger: "POST /api/interview-bookings"
    algorithm: threshold
    formula: |
      For the same room_id, consider other bookings with status = BOOKED:
        violation if NOT (new.end_at <= other.start_at - 900s OR new.start_at >= other.end_at + 900s)
      i.e. a buffer of at least 900 seconds (15 minutes) is required on BOTH sides;
      adjacency with gap exactly 900s is ALLOWED; gap 899s or any overlap -> ERR_BOOKING_BUFFER_VIOLATION.
    input_set: "InterviewBooking rows for room with status = BOOKED"
    constants:
      BUFFER_SECONDS: 900
    precision: "second precision; buffer comparison is >= 900 (inclusive)"

  - name: rounding_overlap_check
    trigger: "POST /api/rounding-sessions"
    algorithm: threshold
    formula: |
      Advocate pairwise rule (half-open intervals, adjacency allowed):
        for other sessions of advocate with status = SCHEDULED:
          overlap if new.start_at < other.end_at AND other.start_at < new.end_at
          -> ERR_ROUNDING_OVERLAP
      Unit capacity rule (aggregate occupancy):
        concurrent = count of sessions on unit with status = SCHEDULED overlapping [start_at, end_at)
        if concurrent >= unit.max_concurrent_roundings -> ERR_UNIT_ROUNDING_CAPACITY
        (boundary: concurrent == max - 1 allowed; == max rejected)
    input_set: "RoundingSession rows for advocate (pairwise) and for unit (aggregate)"
    constants: {}
    precision: "second precision; half-open [start, end)"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority; first match wins)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers present and role is a declared role"
    error_id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER
    http_status: 400
    applies_to: "all endpoints"
  - priority: 2
    category: auth
    check: "Caller role is in the endpoint's roles list; entity-backed roles additionally require X-User-ID to reference an existing StaffMember whose capabilities contain the mapped capability (ADVOCATE/INVESTIGATOR/QRO/DIRECTOR)"
    error_id: ERR_UNAUTHORIZED_ROLE
    http_status: 403
    applies_to: "all endpoints"
  - priority: 3
    category: existence
    check: "Path parameters resolve left-to-right; body FK references (unit_id, room_id, investigation_id, escalation_id, investigator_id) exist"
    error_id: "ERR_CASE_NOT_FOUND | ERR_UNIT_NOT_FOUND | ERR_STAFF_NOT_FOUND | ERR_CLASSIFICATION_NOT_FOUND | ERR_ASSIGNMENT_NOT_FOUND | ERR_INVESTIGATION_NOT_FOUND | ERR_NOTE_NOT_FOUND | ERR_LETTER_NOT_FOUND | ERR_RECOVERY_NOT_FOUND | ERR_ESCALATION_NOT_FOUND | ERR_EVENT_NOT_FOUND | ERR_ROUNDING_NOT_FOUND | ERR_ROOM_NOT_FOUND | ERR_BOOKING_NOT_FOUND | ERR_FOLLOWUP_NOT_FOUND | ERR_SUSPENSION_NOT_FOUND | ERR_SNAPSHOT_NOT_FOUND | ERR_HOLIDAY_NOT_FOUND"
    http_status: 404
    applies_to: "all endpoints with path/body references"
  - priority: 3.5
    category: state
    check: "OCC: expected_case_version (when required by endpoint) equals current PatientCase.version — evaluated BEFORE any business rule"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /api/patient-cases/{id}/classification-decisions, POST /api/patient-cases/{id}/assignments"
  - priority: 3.7
    category: auth
    check: "Identity match: RoundingSession complete/cancel caller == session.advocate_id; InterviewBooking create/cancel caller == case's ACTIVE PRIMARY investigator; ServiceRecoveryAction create caller is an ADVOCATE-capable StaffMember"
    error_id: ERR_IDENTITY_MISMATCH
    http_status: 403
    applies_to: "rounding complete/cancel, interview-booking create/cancel, recovery create"
  - priority: 4
    category: state
    check: "PatientCase lifecycle precondition for the operation (e.g. assign requires CLASSIFIED, investigate requires ASSIGNED, close/withdraw/reopen windows per state machine)"
    error_id: ERR_CASE_INVALID_STATE
    http_status: 409
    applies_to: "all case-scoped mutations"
  - priority: 4.1
    category: state
    check: "Child entity state precondition (investigation/letter/recovery/escalation/event/rounding/booking/follow-up/suspension/assignment in required state)"
    error_id: "ERR_INVESTIGATION_INVALID_STATE | ERR_LETTER_INVALID_STATE | ERR_RECOVERY_INVALID_STATE | ERR_ESCALATION_INVALID_STATE | ERR_EVENT_INVALID_STATE | ERR_ROUNDING_INVALID_STATE | ERR_BOOKING_INVALID_STATE | ERR_FOLLOWUP_INVALID_STATE | ERR_SUSPENSION_INVALID_STATE | ERR_ASSIGNMENT_INVALID_STATE"
    http_status: 409
    applies_to: "child action endpoints"
  - priority: 5
    category: business_safety
    check: "Segregation of duties: letter approver != investigation.submitted_by_id; escalation adjudicator != filed_by_id (unless 'system'); recovery approver != issued_by_id"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "letter approve, escalation adjudicate, recovery approve"
  - priority: 5.1
    category: business_safety
    check: "Content standard: letter.sections must include [PATIENT_SUMMARY, INVESTIGATION_STEPS, FINDINGS, RESOLUTION, CONTACT_INFO]; when case.requires_qro_cosign OR any open/substantiated CARE_CONCERN escalation exists, also [RISK_DISCLOSURE, QAPI_REFERENCE]"
    error_id: ERR_CONTENT_STANDARD_VIOLATION
    http_status: 422
    applies_to: "POST /api/response-letters/{id}/submit-review"
  - priority: 5.2
    category: business_safety
    check: "Grievances may not use complaint fast-track closure; a written ResponseLetter must be issued"
    error_id: ERR_GRIEVANCE_REQUIRES_WRITTEN_RESPONSE
    http_status: 409
    applies_to: "POST /api/patient-cases/{id}/close; POST /api/patient-cases/{id}/fast-track (ERR_FAST_TRACK_COMPLAINT_ONLY)"
  - priority: 5.3
    category: business_safety
    check: "Staff availability: advocate on_leave = true may not create rounding sessions; investigator on_leave may not be assigned"
    error_id: ERR_ADVOCATE_ON_LEAVE
    http_status: 403
    applies_to: "POST /api/rounding-sessions, POST /api/patient-cases/{id}/assignments"
  - priority: 5.4
    category: business_safety
    check: "Escalation gate: letter approval blocked while any escalation for the case is in {FILED, IN_REVIEW, REVIEWS_COMPLETE}"
    error_id: ERR_OPEN_ESCALATION_BLOCKS_APPROVAL
    http_status: 409
    applies_to: "POST /api/response-letters/{id}/approve"
  - priority: 6
    category: business_referential
    check: "Cross-aggregate integrity: escalation_id on event create must belong to the path case and be ADJUDICATED_SUBSTANTIATED; unit intake posture must be STANDARD; ALLEGED_ABUSE events require case.alleged_abuse_flag; interview room must have active = true; letter must belong to path case; suspension/follow-up/letter must reference the correct case"
    error_id: "ERR_CROSS_REFERENCE_MISMATCH | ERR_UNIT_IN_RESTRICTED_POSTURE | ERR_EVENT_TRIGGER_NOT_SUPPORTED | ERR_ROOM_INACTIVE"
    http_status: 409
    applies_to: "case-scoped child creates"
  - priority: 7
    category: business_constraint
    check: "Uniqueness/occupancy: one Investigation per case; one non-terminal letter per case; one OPEN suspension per case; no duplicate ACTIVE assignment for same investigator+case; rounding pairwise overlap; unit rounding capacity; interview booking 900s buffer; snapshot (unit, category, period) uniqueness without force_recompute; holiday date uniqueness; acknowledge idempotence"
    error_id: "ERR_ACTIVE_LETTER_EXISTS | ERR_DUPLICATE_OPEN_SUSPENSION | ERR_DUPLICATE_ACTIVE_ASSIGNMENT | ERR_ROUNDING_OVERLAP | ERR_UNIT_ROUNDING_CAPACITY | ERR_BOOKING_BUFFER_VIOLATION | ERR_SNAPSHOT_EXISTS | ERR_DUPLICATE_HOLIDAY | ERR_ALREADY_ACKNOWLEDGED | ERR_NO_ELIGIBLE_INVESTIGATOR | ERR_INVESTIGATOR_AT_CAPACITY | ERR_INSUFFICIENT_INVESTIGATION_EVIDENCE"
    http_status: 409
    applies_to: "create/action endpoints as applicable"
  - priority: 8
    category: business_temporal
    check: "Window sanity: received_at <= now; rounding/booking start_at < end_at and start_at >= now; suspension not closable twice (state); snapshot period format YYYY-MM and <= current month"
    error_id: "ERR_RECEIVED_AT_IN_FUTURE | ERR_ROUNDING_WINDOW_INVALID | ERR_BOOKING_WINDOW_INVALID | ERR_INVALID_REQUEST"
    http_status: 422
    applies_to: "endpoints taking timestamps"
  - priority: 9
    category: business_fiscal
    check: "Recovery fiscal cap: projected cumulative ISSUED value must be <= 50000 cents (strict > rejects; equality allowed)"
    error_id: ERR_RECOVERY_CASE_CAP_EXCEEDED
    http_status: 402
    applies_to: "POST /api/patient-cases/{id}/recovery-actions, POST /api/recovery-actions/{id}/approve"
  - priority: 10
    category: business_constraint
    check: "Schema: required fields present, enum values valid, integer ranges (value_cents > 0, score 1..5, closure_note >= 20 chars, max_concurrent_roundings >= 1, max_concurrent_assignments >= 1)"
    error_id: "ERR_INVALID_REQUEST | ERR_INVALID_ENUM | ERR_FOLLOWUP_SCORE_INVALID"
    http_status: 400
    applies_to: "all endpoints"
    note: "Schema validation (priority 10) is evaluated LAST here: domain-specific rejections above take precedence over generic shape errors whenever both were detectable without the malformed field. Missing required fields, however, are reported at 400 before existence checks on dependent FKs they would carry."

# =============================================================================
# §1.5 API Endpoint Table
# All reads (GET) are open to every declared role. All times ISO 8601 UTC.
# =============================================================================
endpoints:
  # --- Logical clock (test-driving; startup default 2026-08-01T00:00:00Z) ---
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the server's logical clock. Startup default (before any call) is exactly 2026-08-01T00:00:00Z and MUST NOT fall back to wall-clock. All deadlines, breaches, and derived statuses read this clock."
    roles: [SystemAdmin]
    code: 200
    input: [to_iso8601]
    output: "{ now_iso8601: string }"
    side_effects: ["Derived clock statuses re-evaluate on next read"]

  # --- HospitalUnit ---
  - method: POST
    path: "/api/hospital-units"
    description: "Create a hospital unit"
    roles: [SystemAdmin]
    code: 201
    input: [name, category, "max_concurrent_roundings?"]
    output: HospitalUnit
    side_effects: []
  - method: GET
    path: "/api/hospital-units"
    description: "List units"
    roles: [SystemAdmin, IntakeCoordinator, PatientAdvocate, DepartmentInvestigator, QualityRiskOfficer, PatientRelationsDirector, ComplianceAuditor]
    code: 200
    input: ["limit?", "offset?", "posture?", "category?"]
    output: "HospitalUnit[]"
    side_effects: []
  - method: GET
    path: "/api/hospital-units/{id}"
    description: "Get a unit"
    roles: [SystemAdmin, IntakeCoordinator, PatientAdvocate, DepartmentInvestigator, QualityRiskOfficer, PatientRelationsDirector, ComplianceAuditor]
    code: 200
    input: []
    output: HospitalUnit
    side_effects: []
  - method: PATCH
    path: "/api/hospital-units/{id}"
    description: "Update unit posture/capacity; RESTRICTED -> STANDARD blocked while unacknowledged LATE_FILED events exist (ERR_UNIT_HAS_UNRESOLVED_LATE_EVENTS)"
    roles: [PatientRelationsDirector, SystemAdmin]
    code: 200
    input: ["posture?", "max_concurrent_roundings?"]
    output: HospitalUnit
    side_effects: ["posture transition per HospitalUnit state machine"]

  # --- StaffMember ---
  - method: POST
    path: "/api/staff-members"
    description: "Register a staff member"
    roles: [SystemAdmin]
    code: 201
    input: [full_name, capabilities, "max_concurrent_assignments?", "recovery_issuance_limit_cents?"]
    output: StaffMember
    side_effects: []
  - method: GET
    path: "/api/staff-members"
    description: "List staff"
    roles: [SystemAdmin, IntakeCoordinator, PatientAdvocate, DepartmentInvestigator, QualityRiskOfficer, PatientRelationsDirector, ComplianceAuditor]
    code: 200
    input: ["limit?", "offset?", "on_leave?"]
    output: "StaffMember[]"
    side_effects: []
  - method: GET
    path: "/api/staff-members/{id}"
    description: "Get a staff member"
    roles: [SystemAdmin, IntakeCoordinator, PatientAdvocate, DepartmentInvestigator, QualityRiskOfficer, PatientRelationsDirector, ComplianceAuditor]
    code: 200
    input: []
    output: StaffMember
    side_effects: []
  - method: PATCH
    path: "/api/staff-members/{id}"
    description: "Update on_leave / capacity / issuance limit"
    roles: [SystemAdmin, PatientRelationsDirector]
    code: 200
    input: ["on_leave?", "max_concurrent_assignments?", "recovery_issuance_limit_cents?"]
    output: StaffMember
    side_effects: []

  # --- HolidayObservance ---
  - method: POST
    path: "/api/holiday-observances"
    description: "Register a holiday (business-day skip); duplicate observance_date -> ERR_DUPLICATE_HOLIDAY"
    roles: [SystemAdmin]
    code: 201
    input: [observance_date, name]
    output: HolidayObservance
    side_effects: []
  - method: GET
    path: "/api/holiday-observances"
    description: "List holidays"
    roles: [SystemAdmin, IntakeCoordinator, PatientAdvocate, DepartmentInvestigator, QualityRiskOfficer, PatientRelationsDirector, ComplianceAuditor]
    code: 200
    input: ["limit?", "offset?"]
    output: "HolidayObservance[]"
    side_effects: []
  - method: DELETE
    path: "/api/holiday-observances/{id}"
    description: "Remove a holiday; business-day dues recompute on next read"
    roles: [SystemAdmin]
    code: 204
    input: []
    output: null
    side_effects: ["Business-day variant dues recompute (derived-on-read)"]

  # --- PatientCase ---
  - method: POST
    path: "/api/patient-cases"
    description: "Intake a new patient concern"
    roles: [IntakeCoordinator]
    code: 201
    input: [patient_ref, unit_id, received_at, channel, description, grievance_category, "alleged_abuse_flag?", "vulnerable_patient_flag?", "severity_tier?"]
    output: PatientCase
    side_effects: ["lifecycle_status INTAKE; classification UNCLASSIFIED; unit.open_case_count += 1; rejected when unit RESTRICTED (ERR_UNIT_IN_RESTRICTED_POSTURE)"]
  - method: GET
    path: "/api/patient-cases"
    description: "List cases with filters"
    roles: [SystemAdmin, IntakeCoordinator, PatientAdvocate, DepartmentInvestigator, QualityRiskOfficer, PatientRelationsDirector, ComplianceAuditor]
    code: 200
    input: ["limit?", "offset?", "unit_id?", "lifecycle_status?", "classification?", "grievance_category?", "current_classification_decision_id?"]
    output: "PatientCase[]"
    side_effects: []
  - method: GET
    path: "/api/patient-cases/{id}"
    description: "Get a case"
    roles: [SystemAdmin, IntakeCoordinator, PatientAdvocate, DepartmentInvestigator, QualityRiskOfficer, PatientRelationsDirector, ComplianceAuditor]
    code: 200
    input: []
    output: PatientCase
    side_effects: []
  - method: GET
    path: "/api/patient-cases/{id}/timeline"
    description: "Computed regulatory timeline read"
    roles: [SystemAdmin, IntakeCoordinator, PatientAdvocate, DepartmentInvestigator, QualityRiskOfficer, PatientRelationsDirector, ComplianceAuditor]
    code: 200
    input: []
    output: "{ ack_due_at: string, response_due_calendar_at: string, response_due_business_at: string, tolling_credit_seconds: integer, regulatory_clock_status: string, priority_score: integer, days_remaining: integer }"
    side_effects: []
  - method: POST
    path: "/api/patient-cases/{id}/acknowledge"
    description: "Record grievance acknowledgment sent"
    roles: [IntakeCoordinator]
    code: 200
    input: []
    output: PatientCase
    side_effects: ["acknowledged_at := now; increments PatientCase.version by 1"]
  - method: POST
    path: "/api/patient-cases/{id}/withdraw"
    description: "Withdraw a case (patient withdrew the concern)"
    roles: [IntakeCoordinator]
    code: 200
    input: ["withdraw_reason?"]
    output: PatientCase
    side_effects: ["Withdraw cascade per state machine; increments PatientCase.version by 1"]
  - method: POST
    path: "/api/patient-cases/{id}/reopen"
    description: "Manually reopen a CLOSED case"
    roles: [PatientRelationsDirector]
    code: 200
    input: ["reopen_reason?"]
    output: PatientCase
    side_effects: ["Reopen cascade per state machine; increments PatientCase.version by 1"]
  - method: POST
    path: "/api/patient-cases/{id}/fast-track"
    description: "Move an ASSIGNED complaint directly to RESPONSE_DRAFTING"
    roles: [IntakeCoordinator]
    code: 200
    input: []
    output: PatientCase
    side_effects: ["lifecycle_status ASSIGNED -> RESPONSE_DRAFTING; increments PatientCase.version by 1"]
  - method: POST
    path: "/api/patient-cases/{id}/close"
    description: "Complaint fast-track closure with closure documentation"
    roles: [IntakeCoordinator]
    code: 200
    input: [closure_note]
    output: PatientCase
    side_effects: ["Closure side effects per state machine; increments PatientCase.version by 1"]

  # --- ClassificationDecision ---
  - method: POST
    path: "/api/patient-cases/{id}/classification-decisions"
    description: "Record initial classification or reclassify (supersedes current). OCC-guarded. GRIEVANCE->COMPLAINT only while case in INTAKE/CLASSIFIED."
    roles: [IntakeCoordinator]
    code: 201
    input: [decision, rationale_code, "note?", expected_case_version]
    output: ClassificationDecision
    side_effects: ["case.classification/current_classification_decision_id updated; dues recomputed from received_at; systemic threshold sweep on GRIEVANCE; increments PatientCase.version by 1"]
  - method: GET
    path: "/api/classification-decisions"
    description: "List classification decisions"
    roles: [SystemAdmin, IntakeCoordinator, PatientAdvocate, DepartmentInvestigator, QualityRiskOfficer, PatientRelationsDirector, ComplianceAuditor]
    code: 200
    input: ["limit?", "offset?", "case_id?", "supersedes_decision_id?"]
    output: "ClassificationDecision[]"
    side_effects: []
  - method: GET
    path: "/api/classification-decisions/{id}"
    description: "Get a classification decision"
    roles: [SystemAdmin, IntakeCoordinator, PatientAdvocate, DepartmentInvestigator, QualityRiskOfficer, PatientRelationsDirector, ComplianceAuditor]
    code: 200
    input: []
    output: ClassificationDecision
    side_effects: []

  # --- CaseAssignment ---
  - method: POST
    path: "/api/patient-cases/{id}/assignments"
    description: "Assign investigator (explicit or selector). New PRIMARY supersedes existing ACTIVE PRIMARY. OCC-guarded."
    roles: [PatientRelationsDirector]
    code: 201
    input: ["investigator_id?", "assignment_role?", expected_case_version]
    output: CaseAssignment
    side_effects: ["CaseAssignment ACTIVE; case CLASSIFIED -> ASSIGNED when first assignment; supersede release per state machine; increments PatientCase.version by 1"]
  - method: GET
    path: "/api/case-assignments"
    description: "List assignments"
    roles: [SystemAdmin, IntakeCoordinator, PatientAdvocate, DepartmentInvestigator, QualityRiskOfficer, PatientRelationsDirector, ComplianceAuditor]
    code: 200
    input: ["limit?", "offset?", "case_id?", "investigator_id?", "status?"]
    output: "CaseAssignment[]"
    side_effects: []
  - method: GET
    path: "/api/case-assignments/{id}"
    description: "Get an assignment"
    roles: [SystemAdmin, IntakeCoordinator, PatientAdvocate, DepartmentInvestigator, QualityRiskOfficer, PatientRelationsDirector, ComplianceAuditor]
    code: 200
    input: []
    output: CaseAssignment
    side_effects: []
  - method: POST
    path: "/api/case-assignments/{id}/release"
    description: "Release an ACTIVE assignment"
    roles: [PatientRelationsDirector]
    code: 200
    input: ["release_reason?"]
    output: CaseAssignment
    side_effects: ["status ACTIVE -> RELEASED; investigator open_assignment_count -= 1"]

  # --- Investigation ---
  - method: POST
    path: "/api/patient-cases/{id}/investigations"
    description: "Open the case's single investigation"
    roles: [DepartmentInvestigator]
    code: 201
    input: []
    output: Investigation
    side_effects: ["case ASSIGNED -> UNDER_INVESTIGATION"]
  - method: GET
    path: "/api/investigations"
    description: "List investigations"
    roles: [SystemAdmin, IntakeCoordinator, PatientAdvocate, DepartmentInvestigator, QualityRiskOfficer, PatientRelationsDirector, ComplianceAuditor]
    code: 200
    input: ["limit?", "offset?", "case_id?", "status?"]
    output: "Investigation[]"
    side_effects: []
  - method: GET
    path: "/api/investigations/{id}"
    description: "Get an investigation"
    roles: [SystemAdmin, IntakeCoordinator, PatientAdvocate, DepartmentInvestigator, QualityRiskOfficer, PatientRelationsDirector, ComplianceAuditor]
    code: 200
    input: []
    output: Investigation
    side_effects: []
  - method: POST
    path: "/api/investigations/{id}/notes"
    description: "Append an investigation note"
    roles: [DepartmentInvestigator]
    code: 201
    input: [note_type, body]
    output: InvestigationNote
    side_effects: ["investigation note_count/interview_note_count recompute"]
  - method: POST
    path: "/api/investigations/{id}/submit-findings"
    description: "Submit findings (requires >= 2 notes, >= 1 INTERVIEW)"
    roles: [DepartmentInvestigator]
    code: 200
    input: [care_concern_flag, findings_summary]
    output: Investigation
    side_effects: ["OPEN -> FINDINGS_SUBMITTED; case UNDER_INVESTIGATION -> FINDINGS_REVIEW"]
  - method: POST
    path: "/api/investigations/{id}/accept-findings"
    description: "Accept findings; care concern auto-creates CARE_CONCERN escalation"
    roles: [PatientRelationsDirector]
    code: 200
    input: []
    output: Investigation
    side_effects: ["FINDINGS_SUBMITTED -> FINDINGS_ACCEPTED; case -> RESPONSE_DRAFTING; optional escalation auto-create"]
  - method: POST
    path: "/api/investigations/{id}/return-findings"
    description: "Return findings for revision (cycle back to OPEN)"
    roles: [PatientRelationsDirector]
    code: 200
    input: [return_reason]
    output: Investigation
    side_effects: ["FINDINGS_SUBMITTED -> OPEN; case FINDINGS_REVIEW -> UNDER_INVESTIGATION"]
  - method: POST
    path: "/api/investigations/{id}/resume"
    description: "Resume a REOPENED investigation"
    roles: [DepartmentInvestigator]
    code: 200
    input: []
    output: Investigation
    side_effects: ["REOPENED -> OPEN; case REOPENED -> UNDER_INVESTIGATION"]

  # --- InvestigationNote ---
  - method: GET
