          assert:
            - "MonthlyReportPackage.${pkg6b}.agop_cents == 22712525 and the monthly owner priority is round_half_up(12000000 / 12) == 1000000"
            - "MonthlyReportPackage.${pkg6b}.incentive_fee_provisional_cents == 2171253, the half-up result of the exact tie 2171252.50"
            - "MonthlyReportPackage.${pkg6b}.incentive_fee_provisional_cents != 2171252"
            - "true-up response final_incentive_fee_cents == 1356879, whose tier-2 slice is the half-up result of the exact tie 856878.75 == 856879"
            - "FeeAccrual.${tu6b}.amount_cents == -814374"
            - "MonthlyReportPackage.${pkg6b}.base_fee_cents == 1787500 — no line-level tie arises at 0.0325 on these three lines"

