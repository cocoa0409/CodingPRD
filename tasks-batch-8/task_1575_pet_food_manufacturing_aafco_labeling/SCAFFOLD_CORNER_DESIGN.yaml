              as: TrialCoordinator
              captures: { p_id: $.data.id, p_status: $.data.status, p_enrolled: $.data.enrolled_count }
            - call: "POST /petfood/feeding-trial-protocols/${p_id}/open-enrollment"
              payload: {}
              as: TrialCoordinator
          trigger:
            - call: "POST /petfood/feeding-trial-protocols/${p_id}/enroll"
              payload: { enrolled_delta: 3 }
              as: TrialCoordinator
              captures: { e1: $.data.enrolled_count }
            - call: "POST /petfood/feeding-trial-protocols/${p_id}/enroll"
              payload: { enrolled_delta: 5 }
              as: TrialCoordinator
              captures: { e2: $.data.enrolled_count }
          assert:
