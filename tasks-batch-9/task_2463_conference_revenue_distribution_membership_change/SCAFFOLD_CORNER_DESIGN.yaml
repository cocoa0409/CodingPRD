            - "GET /membership-actions/${ma_id}/ballots returns total_count 1"

      - name: corner_entry_fee_outstanding_then_overpayment_rejected
        claim_type: Violation → Error
        grounds:
          - validations[priority 68]
          - validations[priority 69]
          - errors.ERR_ENTRY_FEE_OUTSTANDING
