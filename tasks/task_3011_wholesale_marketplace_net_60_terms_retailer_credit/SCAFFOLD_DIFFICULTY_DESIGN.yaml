              as: Brand
              as_user_id: "${b_id}"
              captures: { g2_id: $.data.id }
            - call: "GET /wholesale/brands/${b_id}"
              payload: {}
              as: Brand
              as_user_id: "${b_id}"
              captures: { b_v3: $.data.version }
            - call: "POST /wholesale/exclusivity-grants"
              payload: { brand_id: "${b_id}", retailer_id: "${r_id}", center_lat: 54.0, center_lng: -119.0, starts_at: "2027-07-31T23:59:59Z", ends_at: "2028-06-01T00:00:00Z", expected_brand_version: "${b_v3}" }
              as: Brand
