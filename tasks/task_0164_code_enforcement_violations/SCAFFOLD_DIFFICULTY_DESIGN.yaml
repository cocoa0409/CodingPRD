  # =========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: abatement_complete_cascade_depth3
        grounds:
          - state_machines.AbatementOrder.IN_PROGRESS_to_COMPLETED
          - entities.Fine.fields.assessed_cents
          - entities.Case.fields.outstanding_balance_cents
          - entities.Case.fields.posture
        distinguishing_aspect: |
          Depth-3 cascade triggered by abatement completion: (A) AbatementOrder IN_PROGRESS->COMPLETED
          CREATES an ABATEMENT_COST Fine; (B) that new Fine's existence forces Case.outstanding_balance_cents
          to be recomputed upward; (C) the changed balance/order-status forces case_posture to be
          re-derived. Each link is caused by the previous one, not by the original /complete call directly.
        test_recipe:
          setup:
            - "MAJOR notice ISSUED (citation 20000 OPEN). Clock at deadline (notice still ISSUED, balance 20000)."
            - "BOARD_UP abatement ORDERED->IN_PROGRESS, then completed with actual_cost 30000."
          setup_api_calls:
            - call: "POST /_clock/set"
              payload: { to_iso8601: "2026-01-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /fee-schedules"
              payload: { violation_class: "MAJOR", base_fine_cents: 20000, daily_accrual_cents: 500, max_total_cents: 100000, cure_days: 14 }
              as: PlatformAdmin
            - call: "POST /owners"
              payload: { full_name: "Abe Abate", mailing_email: "abe@x.com" }
              as: PlatformAdmin
              captures: { owner_id: $.data.id }
            - call: "POST /properties"
              payload: { owner_id: "${owner_id}", parcel_number: "APN-6001", street_address: "60 Main St", occupancy: "VACANT" }
              as: CodeOfficer
              captures: { prop_id: $.data.id }
            - call: "POST /cases"
              payload: { property_id: "${prop_id}" }
              as: CodeOfficer
              captures: { case_id: $.data.id }
            - call: "POST /inspections"
              payload: { case_id: "${case_id}", kind: "INITIAL" }
              as: CodeOfficer
              captures: { insp_id: $.data.id }
            - call: "POST /inspections/${insp_id}/submit"
              payload: { outcome: "VIOLATION_FOUND" }
              as: CodeOfficer
            - call: "POST /notices"
              payload: { case_id: "${case_id}", source_inspection_id: "${insp_id}", violation_class: "MAJOR" }
              as: CodeOfficer
              captures: { notice_id: $.data.id }
            - call: "POST /abatement-orders"
              payload: { case_id: "${case_id}", action_kind: "BOARD_UP", estimated_cost_cents: 30000 }
              as: CodeOfficer
              captures: { ao_id: $.data.id }
            - call: "POST /abatement-orders/${ao_id}/start"
              payload: {}
              as: CodeOfficer
          trigger:
            - call: "POST /abatement-orders/${ao_id}/complete"
              payload: { actual_cost_cents: 30000 }
              as: CodeOfficer
            - call: "GET /cases/${case_id}"
              payload: {}
              as: FinanceClerk
              captures: { bal: $.data.outstanding_balance_cents, posture: $.data.posture }
            - call: "GET /notices/${notice_id}/fines"
              payload: {}
              as: FinanceClerk
          assert:
            - "AbatementOrder.${ao_id}.status == COMPLETED"
            - "An ABATEMENT_COST Fine with assessed_cents == 30000 exists on the notice (link B)"
            - "Case.${case_id}.outstanding_balance_cents == 50000 (20000 citation + 30000 abatement) (link C)"
            - "Case.${case_id}.posture == ACTIVE (order no longer ORDERED/IN_PROGRESS; notice ISSUED) (link D)"

      - name: notice_issue_cascade_depth2_posture_active
        grounds:
          - state_machines.ViolationNotice.DRAFT_to_ISSUED
          - entities.Fine.fields.assessed_cents
          - entities.Case.fields.posture
        distinguishing_aspect: |
          Depth-2 cascade triggered by notice issuance (a DIFFERENT trigger than abatement
          completion): (A) DRAFT->ISSUED CREATES a CITATION Fine; (B) the new Fine forces
          Case.outstanding_balance and case_posture recompute, flipping INTAKE->ACTIVE. The
          posture flip is caused by the fine-creation link, not declared directly on the call.
        test_recipe:
          setup:
            - "Fresh Case in INTAKE (only an INITIAL VIOLATION_FOUND inspection so far)."
            - "MAJOR notice issued -> CITATION Fine 20000 created -> posture INTAKE->ACTIVE."
          setup_api_calls:
            - call: "POST /_clock/set"
              payload: { to_iso8601: "2026-01-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /fee-schedules"
              payload: { violation_class: "MAJOR", base_fine_cents: 20000, daily_accrual_cents: 500, max_total_cents: 100000, cure_days: 14 }
              as: PlatformAdmin
            - call: "POST /owners"
              payload: { full_name: "Ivy Issue", mailing_email: "ivy@x.com" }
              as: PlatformAdmin
              captures: { owner_id: $.data.id }
            - call: "POST /properties"
              payload: { owner_id: "${owner_id}", parcel_number: "APN-6101", street_address: "61 Main St", occupancy: "OCCUPIED" }
              as: CodeOfficer
              captures: { prop_id: $.data.id }
            - call: "POST /cases"
              payload: { property_id: "${prop_id}" }
              as: CodeOfficer
              captures: { case_id: $.data.id }
            - call: "POST /inspections"
              payload: { case_id: "${case_id}", kind: "INITIAL" }
              as: CodeOfficer
              captures: { insp_id: $.data.id }
            - call: "POST /inspections/${insp_id}/submit"
              payload: { outcome: "VIOLATION_FOUND" }
              as: CodeOfficer
            - call: "GET /cases/${case_id}"
              payload: {}
              as: CodeOfficer
              captures: { posture_before: $.data.posture }
          trigger:
            - call: "POST /notices"
              payload: { case_id: "${case_id}", source_inspection_id: "${insp_id}", violation_class: "MAJOR" }
              as: CodeOfficer
              captures: { notice_id: $.data.id }
            - call: "GET /cases/${case_id}"
              payload: {}
              as: CodeOfficer
              captures: { posture_after: $.data.posture, bal_after: $.data.outstanding_balance_cents }
          assert:
            - "Before issuance: Case.${case_id}.posture == INTAKE"
            - "A CITATION Fine with assessed_cents == 20000 exists on ${notice_id} (link A)"
            - "Case.${case_id}.outstanding_balance_cents == 20000 and posture == ACTIVE (link B)"

  # =========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: state_vs_fiscal_release_foreclosed_lien_unpaid
        grounds:
          - validations[priority=6]
          - validations[priority=17]
          - errors[ERR_INVALID_STATE]
          - errors[ERR_BALANCE_OUTSTANDING]
        distinguishing_aspect: |
          A single POST /liens/{id}/release violates BOTH state (the lien is FORECLOSED, so RELEASED
          is not a valid transition -> ERR_INVALID_STATE, priority 6) AND business_fiscal
          (payments_applied 0 < total -> ERR_BALANCE_OUTSTANDING, priority 17). Pair = state (6) vs
          business_fiscal (17); priority 6 wins -> ERR_INVALID_STATE. (Different category pair than
          the existence-vs-safety instance.)
        test_recipe:
          setup:
            - "MAJOR notice OVERDUE; lien RECORDED (total 26250) with NO payment posted."
            - "Clock advanced 90 days past recording -> lien FORECLOSED. Then release is attempted."
          setup_api_calls:
            - call: "POST /_clock/set"
              payload: { to_iso8601: "2026-01-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /fee-schedules"
              payload: { violation_class: "MAJOR", base_fine_cents: 20000, daily_accrual_cents: 500, max_total_cents: 100000, cure_days: 14 }
              as: PlatformAdmin
            - call: "POST /owners"
              payload: { full_name: "Fred Foreclose", mailing_email: "fred@x.com" }
              as: PlatformAdmin
              captures: { owner_id: $.data.id }
            - call: "POST /properties"
              payload: { owner_id: "${owner_id}", parcel_number: "APN-7001", street_address: "70 Main St", occupancy: "OCCUPIED" }
              as: CodeOfficer
              captures: { prop_id: $.data.id }
            - call: "POST /cases"
              payload: { property_id: "${prop_id}" }
              as: CodeOfficer
              captures: { case_id: $.data.id }
            - call: "POST /inspections"
              payload: { case_id: "${case_id}", kind: "INITIAL" }
              as: CodeOfficer
              captures: { insp_id: $.data.id }
            - call: "POST /inspections/${insp_id}/submit"
              payload: { outcome: "VIOLATION_FOUND" }
              as: CodeOfficer
            - call: "POST /notices"
              payload: { case_id: "${case_id}", source_inspection_id: "${insp_id}", violation_class: "MAJOR" }
              as: CodeOfficer
              captures: { notice_id: $.data.id }
            - call: "POST /_clock/set"
              payload: { to_iso8601: "2026-01-25T00:00:00Z" }
              as: PlatformAdmin
            - call: "GET /cases/${case_id}"
              payload: {}
              as: FinanceClerk
              captures: { case_v: $.data.version }
            - call: "POST /liens"
              payload: { case_id: "${case_id}", expected_case_version: "${case_v}" }
              as: FinanceClerk
              captures: { lien_id: $.data.id }
            - call: "POST /_clock/set"
              payload: { to_iso8601: "2026-04-26T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /liens/${lien_id}/foreclose"
              payload: {}
              as: FinanceClerk
              captures: { lien_status: $.data.status }
          trigger:
            - call: "POST /liens/${lien_id}/release"
              payload: {}
              as: FinanceClerk
              captures: { err: $.data.error_id }
          assert:
            - "Lien.${lien_id}.status == FORECLOSED before the release attempt"
            - "Release rejected with HTTP 409"
            - "error_id == ERR_INVALID_STATE (state priority 6 wins over business_fiscal ERR_BALANCE_OUTSTANDING priority 17)"

      - name: safety_vs_reference_demolition_bad_property
        grounds:
          - validations[priority=5]
          - validations[priority=9]
          - errors[ERR_REFERENCE_NOT_FOUND]
          - errors[ERR_DEMOLITION_NOT_PERMITTED]
        distinguishing_aspect: |
          A POST /abatement-orders for DEMOLITION with a non-existent case_id violates BOTH
          existence/reference (priority 5, ERR_REFERENCE_NOT_FOUND) and business_safety
          (priority 9, ERR_DEMOLITION_NOT_PERMITTED). Pair = existence-reference (5) vs
          business_safety (9); the lower-priority existence check fires first -> ERR_REFERENCE_NOT_FOUND.
          (Different category pair than state-vs-fiscal.)
        test_recipe:
          setup:
            - "No setup beyond auth context; the case_id in the body is a fabricated non-existent UUID."
          setup_api_calls:
            - call: "POST /_clock/set"
              payload: { to_iso8601: "2026-01-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /abatement-orders"
              payload: { case_id: "00000000-0000-4000-8000-000000000000", action_kind: "DEMOLITION", estimated_cost_cents: 100000 }
              as: CodeOfficer
              captures: { err: $.data.error_id }
          assert:
            - "Rejected with HTTP 422"
            - "error_id == ERR_REFERENCE_NOT_FOUND (existence priority 5 wins over safety priority 9 ERR_DEMOLITION_NOT_PERMITTED)"

