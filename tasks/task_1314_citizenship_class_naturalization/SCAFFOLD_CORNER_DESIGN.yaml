  # ===================================================================
  # Section: validations
  # ===================================================================
  - section: validations
    instances:
      - name: request_missing_headers_returns_unauthenticated
        claim_type: violation_to_error
        grounds: ["validations[priority=2]", "errors[ERR_UNAUTHENTICATED]"]
        distinguishing_aspect: "A call with no X-User-Role/X-User-ID headers fails 401 ERR_UNAUTHENTICATED even on a read endpoint."
        test_recipe:
          setup: ["program exists"]
          setup_api_calls:
            - { call: "POST /naturalization/programs", payload: { name: "Main" }, as: ProgramAdmin }
          trigger:
            - call: "GET /naturalization/programs/current"
              payload: {}
              as: AnonymousNoHeaders
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_UNAUTHENTICATED, http 401"

      - name: existence_checked_before_ownership
        claim_type: priority_ordering
        grounds: ["validations[priority=4]", "validations[priority=5]"]
        distinguishing_aspect: "An Applicant asking for a non-existent applicant id that is also not their own gets 404 ERR_NOT_FOUND (existence p4) rather than 403 (ownership p5)."
        test_recipe:
          setup: ["program; one real applicant"]
          setup_api_calls:
            - { call: "POST /naturalization/programs", payload: { name: "Main" }, as: ProgramAdmin }
            - call: "POST /naturalization/applicants"
              payload: { full_name: "Self", email: "self@x.com", date_of_birth: "1990-01-01" }
              as: IntakeCoordinator
              captures: { self_id: $.data.id }
          trigger:
            - call: "GET /naturalization/applicants/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2"
              payload: {}
              as: Applicant
              as_user_id: "${self_id}"
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_NOT_FOUND, http 404 (existence precedes ownership)"

      - name: decide_approved_with_denied_verified_tier_rejected
        claim_type: violation_to_error
        grounds: ["errors[ERR_TIER_INELIGIBLE]", "state_machines.FeeWaiverRequest.SUBMITTED_to_APPROVED"]
        distinguishing_aspect: "decision=APPROVED with documented income above the PARTIAL cap computes verified tier DENIED -> ERR_TIER_INELIGIBLE; the request stays SUBMITTED."
        test_recipe:
          setup: ["SUBMITTED waiver, household 1"]
          setup_api_calls:
            - { call: "POST /naturalization/programs", payload: { name: "Main" }, as: ProgramAdmin }
            - call: "POST /naturalization/applicants"
              payload: { full_name: "High Income", email: "hi@x.com", date_of_birth: "1990-01-01" }
              as: IntakeCoordinator
              captures: { app_id: $.data.id, app_v: $.data.version }
            - call: "POST /naturalization/applicants/${app_id}/screenings"
              payload: { expected_applicant_version: "${app_v}", marital_to_citizen: false, lpr_months: 80, continuous_residence_months: 61, physical_presence_days: 1000, age_years: 36, english_level: 2, civics_practice_pct: 50, has_legal_flag: false }
              as: IntakeCoordinator
            - call: "POST /naturalization/applicants/${app_id}/fee-waiver-requests"
              payload: { household_size: 1, self_reported_income_cents: 1000000, self_reported_benefit: false }
              as: IntakeCoordinator
              captures: { fwr_id: $.data.id }
            - { call: "POST /naturalization/fee-waiver-requests/${fwr_id}/submit", payload: { attached_document_count: 2 }, as: IntakeCoordinator }
          trigger:
            - call: "POST /naturalization/fee-waiver-requests/${fwr_id}/decide"
              payload: { decision: APPROVED, documented_income_cents: 5000000, documented_benefit: false }
              as: ProgramAdmin
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_TIER_INELIGIBLE (5000000*100 > 1565000*200)"
            - "FeeWaiverRequest.${fwr_id}.status remains SUBMITTED"

      - name: fee_waiver_submit_docs_below_required
        claim_type: violation_to_error
        grounds: ["errors[ERR_FEE_WAIVER_DOCS_INSUFFICIENT]", "entities.FeeWaiverRequest.fields.required_document_count"]
        distinguishing_aspect: "Household 3 without benefit requires household_size+1 = 4 documents; submitting with 3 fails with ERR_FEE_WAIVER_DOCS_INSUFFICIENT and stays DRAFT."
        test_recipe:
          setup: ["DRAFT waiver, household 3, no benefit"]
          setup_api_calls:
            - { call: "POST /naturalization/programs", payload: { name: "Main" }, as: ProgramAdmin }
