              captures: { tx_b1_v3: $.data.version }
            - call: "POST /fixtures"
              payload: { project_id: "${proj_b1}", model_code: "F1", category: "PATH", wattage_w: 1, purchase_price_cents: 1000 }
              as: LightingDesigner
              captures: { f4: $.data.id }
          trigger:
            - call: "POST /fixtures/${f4}/assign-zone"
              payload: { zone_id: "${zone_b1}", expected_transformer_version: "${tx_b1_v3}" }
              as: LightingDesigner
              captures: { err: $.data.error_id }
          assert:
            - "after the three 80W assignments Transformer.${tx_b1}.committed_load_va == 240 (== usable, allowed)"
            - "trigger response error_id == ERR_TRANSFORMER_CAPACITY_EXCEEDED"
            - "Transformer.${tx_b1}.committed_load_va == 240 (unchanged by rejected assignment)"

      - name: schedule_program_buffer_gap_exactly_five_minutes
        grounds:
