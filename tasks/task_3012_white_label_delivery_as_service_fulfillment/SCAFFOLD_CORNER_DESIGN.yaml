      - name: undeliverable_disposition_return_to_store_terminal
        claim_type: Valid Transition
        grounds:
          - state_machines.DeliveryOrder.UNDELIVERABLE_to_RETURN_IN_PROGRESS
          - state_machines.Disposition.PENDING_to_COMPLETED
        distinguishing_aspect: "The undeliverable branch: report-undeliverable settles billing (merchant still pays the 500 invoice), disposition RETURN_TO_STORE creates a PENDING Disposition with return_fee_cents 300 and debits it, and courier completion lands the order at RETURNED_TO_STORE with the disposition COMPLETED."
        test_recipe:
          setup:
            - "Base chain through order IN_TRANSIT; clock 01:00."
          setup_api_calls:
            - *c_clock
            - *c_merchant
            - *c_activate
            - *c_store
            - *c_policy
            - *c_mgetv
            - *c_pact
            - *c_courier
            - *c_quote1
            - *c_order1
            - *c_accept
            - *c_ready
            - *c_batch
            - *c_dispatch
            - *c_pickup
            - *c_transit
            - *c_clock1
          trigger:
            - call: "POST /delivery-orders/${o1}/report-undeliverable"
              payload: { reason_code: "CUSTOMER_UNAVAILABLE" }
              as: Courier
              as_user_id: "${c_id}"
            - call: "POST /delivery-orders/${o1}/disposition"
              payload: { resolution: "RETURN_TO_STORE" }
              as: Merchant
              as_user_id: "${m_id}"
              captures: { d_id: $.data.id }
            - call: "POST /dispositions/${d_id}/complete"
              payload: { outcome: "RETURNED" }
              as: Courier
              as_user_id: "${c_id}"
            - call: "GET /delivery-orders/${o1}"
              payload: {}
              as: Merchant
              as_user_id: "${m_id}"
            - call: "GET /merchants/${m_id}"
              payload: {}
              as: PlatformAdmin
          assert:
            - "after report-undeliverable: fulfillment UNDELIVERABLE, billing SETTLED, merchant balance 99500"
            - "Disposition.${d_id}.return_fee_cents == 300 and status PENDING before completion"
            - "disposition decision debited return fee: merchant balance 99200 before completion"
            - "after complete: DeliveryOrder.${o1}.fulfillment_status == RETURNED_TO_STORE and Disposition.${d_id}.status == COMPLETED"
            - "DeliveryBatch.${b_id}.status == COMPLETED"

      - name: undeliverable_disposition_dispose_terminal
        claim_type: Valid Transition
        grounds:
          - state_machines.DeliveryOrder.UNDELIVERABLE_to_DISPOSAL_PENDING
        distinguishing_aspect: "The alternative disposition branch: DISPOSE creates the Disposition with return_fee_cents 0 (no debit), and completion lands the order at DISPOSED — the divergent side-effect set of the fork."
        test_recipe:
          setup:
            - "Base chain through order IN_TRANSIT; clock 01:00."
          setup_api_calls:
            - *c_clock
            - *c_merchant
            - *c_activate
            - *c_store
            - *c_policy
            - *c_mgetv
            - *c_pact
            - *c_courier
