        claim_type: Reconciliation
        grounds:
          - calculations.family_engagement_match_credit
          - state_machines.Contribution.PLEDGED_to_RECEIVED
        distinguishing_aspect: "The match credit is a RECEIVED-only quantity, so fulfilment is the variant switch: the same 12345-cent gift moves out of pledged_support_cents into recognized_support_cents and only then earns round_half_up(1234.5) = 1235 cents of family engagement credit - the delta must appear on all three program ledgers in one call."
        test_recipe:
          setup:
            - "One program with one CASH_PLEDGE contribution of 12345 cents designated FAMILY_ENGAGEMENT"
            - "Before the trigger: contribution status PLEDGED, match_credit_cents 0, program pledged_support_cents 12345, recognized_support_cents 0, family_engagement_credit_cents 0"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramManager
            - call: "POST /programs"
              payload: { name: "Riverbend Special Olympics", region_code: "OH" }
              as: ProgramManager
              captures: { prog: $.data.id }
            - call: "POST /programs/${prog}/contributions"
              payload: { donor_name: "Foster Family", contribution_type: "CASH_PLEDGE", designation: "FAMILY_ENGAGEMENT", stated_value_cents: 12345 }
              as: ProgramManager
              captures: { c1: $.data.id }
            - call: "GET /programs/${prog}"
              payload: {}
              as: ProgramManager
          trigger:
            - call: "POST /contributions/${c1}/fulfill"
              payload: { received_on: "2026-08-15" }
              as: ProgramManager
          assert:
            - "HTTP 200 and Contribution.${c1}.status == RECEIVED with received_on == 2026-08-15"
            - "Contribution.${c1}.recognized_value_cents == 12345 (unchanged by fulfilment) and match_credit_cents == 1235"
            - "Program.${prog}.pledged_support_cents == 0 and recognized_support_cents == 12345"
            - "Program.${prog}.family_engagement_credit_cents == 1235 - round_half_up(1234.5) rounds up, not to 1234"
            - "the setup GET taken before the trigger showed pledged_support_cents == 12345, recognized_support_cents == 0 and family_engagement_credit_cents == 0"

