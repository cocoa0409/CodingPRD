# =============================================================================
# §1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# Auto Repossession & Collateral Liquidation. Breadth probe over §1.1–§1.7;
# anything already exercised by a §1.8 instance appears as an excluded_because stub.
# =============================================================================
scaffold_corner_design:
  - section: entities
    instances:
      - name: borrower_missing_required_email_returns_invalid_request
        claim_type: required_fields
        grounds: [entities.Borrower.fields.email]
        distinguishing_aspect: "email has source input and no default; omitting it is a 400, not a 201 with null."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - { call: "POST /borrowers", payload: { full_name: "No Email", state_code: "CA" }, as: RecoveryManager, captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_INVALID_REQUEST and http status 400"
      - name: loan_optional_defaults_applied
        claim_type: defaults
        grounds: [entities.LoanAccount.fields.missed_installments, entities.LoanAccount.fields.accrued_interest_cents, entities.LoanAccount.fields.late_fees_cents]
        distinguishing_aspect: "The three arrears fields default to 0 when omitted; paid_to_date_cents is 0 and status CURRENT at creation."
        test_recipe:
          setup: ["one borrower"]
          setup_api_calls:
            - { call: "POST /borrowers", payload: { full_name: "Def", state_code: "CA", email: "def@x.com" }, as: RecoveryManager, captures: { b_id: $.data.id } }
          trigger:
            - { call: "POST /loan-accounts", payload: { borrower_id: "${b_id}", vin: "VIN00000000000041", governing_state_code: "CA", principal_balance_cents: 800000, apr_bps: 1100, monthly_payment_cents: 25000 }, as: RecoveryManager, captures: { mi: $.data.missed_installments, ai: $.data.accrued_interest_cents, lf: $.data.late_fees_cents, pd: $.data.paid_to_date_cents, st: $.data.status } }
          assert:
            - "mi == 0 and ai == 0 and lf == 0 and pd == 0"
            - "st == CURRENT"
            - "total_outstanding_cents == 800000"
      - name: loan_computed_field_input_rejected
        claim_type: computed_fields
        grounds: [entities.LoanAccount.fields.paid_to_date_cents]
        distinguishing_aspect: "paid_to_date_cents is source computed; a client-supplied value is an unknown field and the whole request is rejected 400 (not silently ignored)."
        test_recipe:
          setup: ["one borrower"]
          setup_api_calls:
            - { call: "POST /borrowers", payload: { full_name: "CF", state_code: "CA", email: "cf@x.com" }, as: RecoveryManager, captures: { b_id: $.data.id } }
          trigger:
            - { call: "POST /loan-accounts", payload: { borrower_id: "${b_id}", vin: "VIN00000000000042", governing_state_code: "CA", principal_balance_cents: 800000, apr_bps: 1100, monthly_payment_cents: 25000, paid_to_date_cents: 5 }, as: RecoveryManager, captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_INVALID_REQUEST"
      - name: get_case_returns_not_found_with_error_envelope
        claim_type: not_found
        grounds: ["errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "A well-formed but unknown UUID yields 404 ERR_NOT_FOUND in the fixed error envelope: data.error_id present, response_type == error, meta.api_request_id present."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - { call: "GET /recovery-cases/11111111-2222-4333-8444-555555555555", payload: {}, as: RecoveryManager, captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_NOT_FOUND and http status 404"
            - "envelope: response_type == 'error'; meta.api_request_id non-empty; data.message non-empty"
      - name: report_secured_invalid_enum_rejected
        claim_type: type_constraints
        grounds: [entities.RecoveryCase.fields.condition_grade]
        distinguishing_aspect: "condition_grade outside {EXCELLENT, GOOD, FAIR, POOR} is a 400 before any state or business check."
        test_recipe:
          setup: ["case REPO_ACTIVE with an ACCEPTED assignment at 2026-05-16"]
          setup_api_calls:
            - { call: "POST /borrowers", payload: { full_name: "EN", state_code: "CA", email: "en@x.com" }, as: RecoveryManager, captures: { b_id: $.data.id } }
            - { call: "POST /loan-accounts", payload: { borrower_id: "${b_id}", vin: "VIN00000000000043", governing_state_code: "CA", principal_balance_cents: 500000, apr_bps: 900, monthly_payment_cents: 20000, missed_installments: 2, accrued_interest_cents: 8000, late_fees_cents: 3000 }, as: RecoveryManager, captures: { l_id: $.data.id } }
            - { call: "POST /recovery-cases", payload: { loan_account_id: "${l_id}", default_reason: "delinquent" }, as: RecoveryManager, as_user_id: "rm_1", captures: { c_id: $.data.id, c_v: $.data.version } }
            - { call: "POST /recovery-cases/${c_id}/cure-notices", payload: { expected_recovery_case_version: "${c_v}" }, as: RecoveryManager }
            - { call: "POST /repo-agents", payload: { name: "Agent E", license_number: "LIC-E", licensed_state_codes: ["CA"], max_active_assignments: 5 }, as: RecoveryManager, captures: { ag: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-16T00:00:00Z" }, as: RecoveryManager }
            - { call: "POST /recovery-cases/${c_id}/repo-assignments", payload: { agent_id: "${ag}", field_window_start: "2026-05-16T00:00:00Z", field_window_end: "2026-05-18T00:00:00Z" }, as: RecoveryManager, captures: { asg: $.data.id } }
            - { call: "POST /repo-assignments/${asg}/accept", payload: {}, as: RepoAgent, as_user_id: "${ag}" }
          trigger:
            - { call: "POST /repo-assignments/${asg}/report-secured", payload: { odometer: 10000, condition_grade: "SUPERB", trade_in_value_cents: 600000, auction_guide_low_cents: 450000 }, as: RepoAgent, as_user_id: "${ag}", captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_INVALID_REQUEST and http status 400"
            - "RepoAssignment.${asg}.status == ACCEPTED (unchanged)"
      - name: ledger_entries_are_immutable
        claim_type: immutability
        grounds: [entities.RecoveryLedgerEntry]
        distinguishing_aspect: "RecoveryLedgerEntry has common_fields false: the create response carries id and created_at but no version/updated_at, and §1.5 declares no update/delete endpoint for it."
        test_recipe:
          setup: ["one case OPENED"]
          setup_api_calls:
            - { call: "POST /borrowers", payload: { full_name: "IM", state_code: "CA", email: "im@x.com" }, as: RecoveryManager, captures: { b_id: $.data.id } }
            - { call: "POST /loan-accounts", payload: { borrower_id: "${b_id}", vin: "VIN00000000000044", governing_state_code: "CA", principal_balance_cents: 500000, apr_bps: 900, monthly_payment_cents: 20000, missed_installments: 2, accrued_interest_cents: 8000, late_fees_cents: 3000 }, as: RecoveryManager, captures: { l_id: $.data.id } }
            - { call: "POST /recovery-cases", payload: { loan_account_id: "${l_id}", default_reason: "delinquent" }, as: RecoveryManager, as_user_id: "rm_1", captures: { c_id: $.data.id } }
          trigger:
            - { call: "POST /recovery-cases/${c_id}/ledger-entries", payload: { kind: "COST_KEY", amount_cents: 7500, memo: "key cut" }, as: RecoveryManager, captures: { le_id: $.data.id } }
          assert:
            - "response data contains id and created_at and does NOT contain version or updated_at"
            - "GET /recovery-cases/${c_id}/ledger-entries returns exactly 1 entry with kind COST_KEY, amount_cents 7500"
      - name: ledger_manual_payment_kind_rejected
        claim_type: type_constraints
        grounds: [entities.RecoveryLedgerEntry.fields.kind]
        distinguishing_aspect: "Manual ledger posts accept only COST_* / ADJUSTMENT; kind PAYMENT via the manual endpoint is a 400 (system-only kinds are written by transitions)."
        test_recipe:
          setup: ["one case OPENED"]
          setup_api_calls:
            - { call: "POST /borrowers", payload: { full_name: "LK", state_code: "CA", email: "lk@x.com" }, as: RecoveryManager, captures: { b_id: $.data.id } }
            - { call: "POST /loan-accounts", payload: { borrower_id: "${b_id}", vin: "VIN00000000000045", governing_state_code: "CA", principal_balance_cents: 500000, apr_bps: 900, monthly_payment_cents: 20000, missed_installments: 2, accrued_interest_cents: 8000, late_fees_cents: 3000 }, as: RecoveryManager, captures: { l_id: $.data.id } }
            - { call: "POST /recovery-cases", payload: { loan_account_id: "${l_id}", default_reason: "delinquent" }, as: RecoveryManager, as_user_id: "rm_1", captures: { c_id: $.data.id } }
          trigger:
            - { call: "POST /recovery-cases/${c_id}/ledger-entries", payload: { kind: "PAYMENT", amount_cents: 100 }, as: RecoveryManager, captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_INVALID_REQUEST"

  - section: state_machines
    instances:
      - name: case_starts_opened
        claim_type: initial_state
        grounds: [state_machines.RecoveryCase]
        distinguishing_aspect: "A new RecoveryCase is OPENED and its loan flips CURRENT -> IN_DEFAULT in the same request."
        test_recipe:
          setup: ["one borrower with one loan"]
          setup_api_calls:
            - { call: "POST /borrowers", payload: { full_name: "IS", state_code: "CA", email: "is@x.com" }, as: RecoveryManager, captures: { b_id: $.data.id } }
            - { call: "POST /loan-accounts", payload: { borrower_id: "${b_id}", vin: "VIN00000000000046", governing_state_code: "CA", principal_balance_cents: 500000, apr_bps: 900, monthly_payment_cents: 20000, missed_installments: 2, accrued_interest_cents: 8000, late_fees_cents: 3000 }, as: RecoveryManager, captures: { l_id: $.data.id } }
          trigger:
            - { call: "POST /recovery-cases", payload: { loan_account_id: "${l_id}", default_reason: "delinquent" }, as: RecoveryManager, as_user_id: "rm_1", captures: { st: $.data.status, ob: $.data.opened_by_user_id } }
          assert:
            - "st == OPENED"
            - "ob == 'rm_1'  (system-stamped from X-User-ID)"
            - "GET /loan-accounts/${l_id} shows status IN_DEFAULT"
      - name: closed_case_rejects_all_transitions
        claim_type: terminal_state_lockdown
        grounds: [state_machines.RecoveryCase]
        distinguishing_aspect: "From terminal CLOSED every further transition is rejected: a cure payment attempt returns ERR_INVALID_CASE_STATE and writes nothing."
        test_recipe:
          setup: ["case cured in-window at 2026-05-02 and then closed"]
          setup_api_calls:
            - { call: "POST /borrowers", payload: { full_name: "TL", state_code: "CA", email: "tl@x.com" }, as: RecoveryManager, captures: { b_id: $.data.id } }
            - { call: "POST /loan-accounts", payload: { borrower_id: "${b_id}", vin: "VIN00000000000047", governing_state_code: "CA", principal_balance_cents: 500000, apr_bps: 900, monthly_payment_cents: 20000, missed_installments: 2, accrued_interest_cents: 8000, late_fees_cents: 3000 }, as: RecoveryManager, captures: { l_id: $.data.id } }
            - { call: "POST /recovery-cases", payload: { loan_account_id: "${l_id}", default_reason: "delinquent" }, as: RecoveryManager, as_user_id: "rm_1", captures: { c_id: $.data.id, c_v: $.data.version } }
            - { call: "POST /recovery-cases/${c_id}/cure-notices", payload: { expected_recovery_case_version: "${c_v}" }, as: RecoveryManager }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-02T00:00:00Z" }, as: RecoveryManager }
            - { call: "POST /recovery-cases/${c_id}/cure-payments", payload: { amount_cents: 51000 }, as: Borrower, as_user_id: "${b_id}" }
            - { call: "POST /recovery-cases/${c_id}/close", payload: {}, as: RecoveryManager }
          trigger:
            - { call: "POST /recovery-cases/${c_id}/cure-payments", payload: { amount_cents: 51000 }, as: Borrower, as_user_id: "${b_id}", captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_INVALID_CASE_STATE"
            - "cure amount here is 2 x 20000 + 3000 + 0 costs = 43,000c; the 51,000c overpay was accepted earlier (>= rule), case CLOSED after close"
            - "GET /recovery-cases/${c_id}/ledger-entries still shows exactly 1 PAYMENT entry"
      - name: assignment_rejected_before_cure_expiry
        claim_type: invalid_transition
        grounds: [state_machines.RecoveryCase.CURE_EXPIRED_to_REPO_ACTIVE]
        distinguishing_aspect: "Creating a repo assignment while the case is CURE_PENDING (cure window still open) is an invalid case state — the skip of the statutory wait is exactly what the machine forbids."
        test_recipe:
          setup: ["case CURE_PENDING at default clock 2026-05-01 (deadline 05-15)"]
          setup_api_calls:
            - { call: "POST /borrowers", payload: { full_name: "IV", state_code: "CA", email: "iv@x.com" }, as: RecoveryManager, captures: { b_id: $.data.id } }
            - { call: "POST /loan-accounts", payload: { borrower_id: "${b_id}", vin: "VIN00000000000048", governing_state_code: "CA", principal_balance_cents: 500000, apr_bps: 900, monthly_payment_cents: 20000, missed_installments: 2, accrued_interest_cents: 8000, late_fees_cents: 3000 }, as: RecoveryManager, captures: { l_id: $.data.id } }
            - { call: "POST /recovery-cases", payload: { loan_account_id: "${l_id}", default_reason: "delinquent" }, as: RecoveryManager, as_user_id: "rm_1", captures: { c_id: $.data.id, c_v: $.data.version } }
            - { call: "POST /recovery-cases/${c_id}/cure-notices", payload: { expected_recovery_case_version: "${c_v}" }, as: RecoveryManager }
            - { call: "POST /repo-agents", payload: { name: "Agent N", license_number: "LIC-N", licensed_state_codes: ["CA"], max_active_assignments: 5 }, as: RecoveryManager, captures: { ag: $.data.id } }
          trigger:
            - { call: "POST /recovery-cases/${c_id}/repo-assignments", payload: { agent_id: "${ag}", field_window_start: "2026-05-02T00:00:00Z", field_window_end: "2026-05-03T00:00:00Z" }, as: RecoveryManager, captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_INVALID_CASE_STATE"
            - "GET /recovery-cases/${c_id}/repo-assignments returns an empty array"
      - name: second_quote_supersedes_first_without_extending_deadline
        claim_type: side_effect_execution
        grounds: [state_machines.RedemptionQuote.ISSUED_to_SUPERSEDED, state_machines.RecoveryCase.REDEMPTION_OPEN_to_REDEMPTION_OPEN]
        distinguishing_aspect: "Re-quoting supersedes the ISSUED quote (superseded_by_id set) and recomputes the amount (REINSTATEMENT 186,500c vs REDEMPTION 2,127,950c) while redemption_deadline stays pinned at first-quote + 10 days."
        test_recipe:
          setup: ["case REDEMPTION_OPEN: REDEMPTION quote issued at 2026-05-16 (valid_until 2026-05-26)"]
          setup_api_calls:
            - { call: "POST /borrowers", payload: { full_name: "SQ", state_code: "CA", email: "sq@x.com" }, as: RecoveryManager, captures: { b_id: $.data.id } }
            - { call: "POST /loan-accounts", payload: { borrower_id: "${b_id}", vin: "VIN00000000000049", governing_state_code: "CA", principal_balance_cents: 2000000, apr_bps: 1200, monthly_payment_cents: 45000, missed_installments: 3, accrued_interest_cents: 60000, late_fees_cents: 12000 }, as: RecoveryManager, captures: { l_id: $.data.id } }
            - { call: "POST /recovery-cases", payload: { loan_account_id: "${l_id}", default_reason: "delinquent" }, as: RecoveryManager, as_user_id: "rm_1", captures: { c_id: $.data.id, c_v: $.data.version } }
            - { call: "POST /recovery-cases/${c_id}/ledger-entries", payload: { kind: "COST_REPO_FEE", amount_cents: 35000 }, as: RecoveryManager }
            - { call: "POST /recovery-cases/${c_id}/ledger-entries", payload: { kind: "COST_STORAGE", amount_cents: 4500 }, as: RecoveryManager }
            - { call: "POST /recovery-cases/${c_id}/cure-notices", payload: { expected_recovery_case_version: "${c_v}" }, as: RecoveryManager }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-16T00:00:00Z" }, as: RecoveryManager }
            - { call: "POST /repo-agents", payload: { name: "Agent M", license_number: "LIC-M", licensed_state_codes: ["CA"], max_active_assignments: 5 }, as: RecoveryManager, captures: { ag: $.data.id } }
            - { call: "POST /recovery-cases/${c_id}/repo-assignments", payload: { agent_id: "${ag}", field_window_start: "2026-05-16T00:00:00Z", field_window_end: "2026-05-18T00:00:00Z" }, as: RecoveryManager, captures: { asg: $.data.id } }
            - { call: "POST /repo-assignments/${asg}/accept", payload: {}, as: RepoAgent, as_user_id: "${ag}" }
            - { call: "POST /repo-assignments/${asg}/report-secured", payload: { odometer: 65000, condition_grade: "GOOD", trade_in_value_cents: 1500000, auction_guide_low_cents: 900000 }, as: RepoAgent, as_user_id: "${ag}" }
            - { call: "GET /recovery-cases/${c_id}", payload: {}, as: RecoveryManager, captures: { c_v2: $.data.version } }
            - { call: "POST /recovery-cases/${c_id}/redemption-quotes", payload: { quote_type: "REDEMPTION", expected_recovery_case_version: "${c_v2}" }, as: RecoveryManager, captures: { q1: $.data.id } }
          trigger:
            - { call: "GET /recovery-cases/${c_id}", payload: {}, as: RecoveryManager, captures: { c_v3: $.data.version } }
            - { call: "POST /recovery-cases/${c_id}/redemption-quotes", payload: { quote_type: "REINSTATEMENT", expected_recovery_case_version: "${c_v3}" }, as: RecoveryManager, captures: { q2: $.data.id, q2_amt: $.data.quoted_amount_cents, q2_diem: $.data.per_diem_cents, q2_valid: $.data.valid_until } }
            - { call: "GET /recovery-cases/${c_id}/redemption-quotes", payload: {}, as: RecoveryManager, captures: { q1_st: "$.data[0].status", q1_sup: "$.data[0].superseded_by_id" } }
          assert:
            - "q2_amt == 186500 and q2_diem == 0   (REINSTATEMENT: arrears + costs only)"
            - "q1_st == SUPERSEDED and q1_sup == ${q2}"
            - "q2_valid == '2026-05-26T00:00:00Z'  (deadline pinned by the first quote, not extended)"
            - "RecoveryCase.${c_id}.status == REDEMPTION_OPEN"
      - name: unaccepted_assignment_expires_by_clock
        claim_type: valid_transition
        grounds: [state_machines.RepoAssignment.ASSIGNED_to_EXPIRED, calculations.agent_performance_score]
        distinguishing_aspect: "An assignment left ASSIGNED past created_at + 2 days is auto-EXPIRED by the clock advance and the agent's rolling score drops to 90 (-10) without suspension."
        test_recipe:
          setup: ["case CURE_EXPIRED; assignment created ASSIGNED at 2026-05-16 and never accepted"]
          setup_api_calls:
            - { call: "POST /borrowers", payload: { full_name: "UA", state_code: "CA", email: "ua@x.com" }, as: RecoveryManager, captures: { b_id: $.data.id } }
            - { call: "POST /loan-accounts", payload: { borrower_id: "${b_id}", vin: "VIN00000000000050", governing_state_code: "CA", principal_balance_cents: 500000, apr_bps: 900, monthly_payment_cents: 20000, missed_installments: 2, accrued_interest_cents: 8000, late_fees_cents: 3000 }, as: RecoveryManager, captures: { l_id: $.data.id } }
            - { call: "POST /recovery-cases", payload: { loan_account_id: "${l_id}", default_reason: "delinquent" }, as: RecoveryManager, as_user_id: "rm_1", captures: { c_id: $.data.id, c_v: $.data.version } }
            - { call: "POST /recovery-cases/${c_id}/cure-notices", payload: { expected_recovery_case_version: "${c_v}" }, as: RecoveryManager }
            - { call: "POST /repo-agents", payload: { name: "Agent O", license_number: "LIC-O", licensed_state_codes: ["CA"], max_active_assignments: 5 }, as: RecoveryManager, captures: { ag: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-16T00:00:00Z" }, as: RecoveryManager }
            - { call: "POST /recovery-cases/${c_id}/repo-assignments", payload: { agent_id: "${ag}", field_window_start: "2026-05-16T00:00:00Z", field_window_end: "2026-05-18T00:00:00Z" }, as: RecoveryManager, captures: { asg: $.data.id } }
          trigger:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-19T00:00:00Z" }, as: RecoveryManager }
            - { call: "GET /repo-agents/${ag}/repo-assignments", payload: {}, as: RecoveryManager, captures: { a_st: "$.data[0].status" } }
            - { call: "GET /repo-agents/${ag}", payload: {}, as: RecoveryManager, captures: { roll: $.data.performance_score_rolling, ag_st: $.data.status } }
          assert:
            - "a_st == EXPIRED  (now 05-19 > created 05-16 + 2 days)"
            - "roll == 90 and ag_st == ACTIVE  (90 >= 40 threshold)"
      - name: property_claim_then_return_happy_path
        claim_type: valid_transition
        grounds: [state_machines.PersonalPropertyItem.INVENTORIED_to_CLAIMED, state_machines.PersonalPropertyItem.CLAIMED_to_RETURNED]
        distinguishing_aspect: "Full inventory-to-return flow: item INVENTORIED -> CLAIMED (borrower) -> RETURNED (securing agent); case.property_item_count stays 1 and the item is terminal."
        test_recipe:
          setup: ["case COLLATERAL_SECURED at 2026-05-16; one item inventoried by the securing agent"]
          setup_api_calls:
            - { call: "POST /borrowers", payload: { full_name: "PR", state_code: "CA", email: "pr@x.com" }, as: RecoveryManager, captures: { b_id: $.data.id } }
            - { call: "POST /loan-accounts", payload: { borrower_id: "${b_id}", vin: "VIN00000000000051", governing_state_code: "CA", principal_balance_cents: 500000, apr_bps: 900, monthly_payment_cents: 20000, missed_installments: 2, accrued_interest_cents: 8000, late_fees_cents: 3000 }, as: RecoveryManager, captures: { l_id: $.data.id } }
            - { call: "POST /recovery-cases", payload: { loan_account_id: "${l_id}", default_reason: "delinquent" }, as: RecoveryManager, as_user_id: "rm_1", captures: { c_id: $.data.id, c_v: $.data.version } }
            - { call: "POST /recovery-cases/${c_id}/cure-notices", payload: { expected_recovery_case_version: "${c_v}" }, as: RecoveryManager }
            - { call: "POST /repo-agents", payload: { name: "Agent R", license_number: "LIC-R", licensed_state_codes: ["CA"], max_active_assignments: 5 }, as: RecoveryManager, captures: { ag: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-16T00:00:00Z" }, as: RecoveryManager }
            - { call: "POST /recovery-cases/${c_id}/repo-assignments", payload: { agent_id: "${ag}", field_window_start: "2026-05-16T00:00:00Z", field_window_end: "2026-05-18T00:00:00Z" }, as: RecoveryManager, captures: { asg: $.data.id } }
            - { call: "POST /repo-assignments/${asg}/accept", payload: {}, as: RepoAgent, as_user_id: "${ag}" }
            - { call: "POST /repo-assignments/${asg}/report-secured", payload: { odometer: 40000, condition_grade: "FAIR", trade_in_value_cents: 600000, auction_guide_low_cents: 450000 }, as: RepoAgent, as_user_id: "${ag}" }
            - { call: "POST /recovery-cases/${c_id}/personal-property-items", payload: { description: "child seat" }, as: RepoAgent, as_user_id: "${ag}", captures: { it: $.data.id } }
          trigger:
            - { call: "POST /personal-property-items/${it}/claim", payload: {}, as: Borrower, as_user_id: "${b_id}", captures: { st1: $.data.status } }
            - { call: "POST /personal-property-items/${it}/mark-returned", payload: {}, as: RepoAgent, as_user_id: "${ag}", captures: { st2: $.data.status } }
          assert:
            - "st1 == CLAIMED and st2 == RETURNED"
            - "RecoveryCase.${c_id}.property_item_count == 1"
      - name: complaint_dismissed_restores_prior_state
        claim_type: side_effect_execution
