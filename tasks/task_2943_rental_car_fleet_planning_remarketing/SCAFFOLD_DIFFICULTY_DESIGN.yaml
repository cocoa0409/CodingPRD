            - "GET /fleet/redistribution-orders?vehicle_id=${veh_a} finally reports total_count 3 with statuses CANCELLED, DRAFT, DRAFT"

      - name: prep_bay_buffered_closed_interval_adjacency_forbidden
        grounds:
          - validations[priority 17 ERR_PREP_BAY_CONFLICT]
          - entities.InFleetingTask.fields.bay_code
          - entities.InFleetingTask.fields.window_start
          - endpoints[POST /fleet/vehicles/{vehicle_id}/in-fleeting-tasks]
        distinguishing_aspect: |
          The contended resource here is a SHARED market bay rather than a single vehicle,
          and the comparison is the opposite of the transfer-window one on both axes: the
          interval is CLOSED and it is first expanded by a 60-minute changeover buffer on
          each side, so touching buffered endpoints DO conflict. A prep starting at 12:00
          against an 08:00-10:00 incumbent is refused because the buffered intervals meet
          exactly at 11:00, and the same request one minute later is accepted.
