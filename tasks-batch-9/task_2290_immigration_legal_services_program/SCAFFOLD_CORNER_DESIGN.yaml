# =============================================================================
# §1.9 Scaffold Corner Design — task_2290_immigration_legal_services_program
# Breadth probe over SCAFFOLD.yaml §1.1–§1.7. Sections and claim_type values are
# taken verbatim from references/claim-extraction-guide.md; no category is
# invented. Every instance is fully worked: concrete setup_api_calls chain from
# empty DB, concrete trigger, literal-pinned asserts.
#
# Reusable chain shape (inlined per instance, never abbreviated):
#   clock -> capacity cycle -> representatives -> client -> intake -> screen ->
#   decide(ACCEPT) -> GET /case-matters?intake_id -> case-assignment -> ACTIVATE
# Logical clock baseline: the server default is 2026-08-01T00:00:00Z; chains
# that need a different instant set it explicitly with POST /_clock/set_current_utc.
# Standing numeric facts used by the asserts below (all pre-computed):
#   household_size 3 + income 2000000 -> guideline 2572000 -> fpl 77.76
#   household_size 1 + income 3016000 -> guideline 1508000 -> fpl 200.00 (eligible)
#   household_size 1 + income 3016151 -> fpl 200.01 (above ceiling)
#   U_VISA -> forum USCIS; BOND_HEARING/ASYLUM_DEFENSIVE -> EOIR_IMMIGRATION_COURT
#   ACCREDITATION_TERM_DAYS 1095: effective 2026-08-03 -> expiry 2029-08-02
#
# NAMED SETUP MACROS. Where a setup_api_calls entry reads `call: "TEMPLATE A"`
# or `call: "ACCEPT_INTAKE(...)"` it stands for exactly the literal call list
# spelled out here; nothing else is elided anywhere in this file.
#
# TEMPLATE A — one STAFFED U_VISA matter, reachable from an empty database
# (12 calls; captures cycle_id, atty_a_id, atty_b_id, screener_id, client_id,
#  intake_id, matter_id, matter_v1, lead_id):
#   1  POST /_clock/set_current_utc { to_iso8601: "2026-08-03T09:00:00.000Z" }            as ProgramDirector
#   2  POST /capacity-cycles { cycle_label: "FY26-H2", period_start_date: "2026-07-01",
#        period_end_date: "2026-12-31", total_case_slots: 10, reserved_detained_slots: 2 } as ProgramDirector
#        -> captures cycle_id: "$.data.id"
#   3  POST /representatives { full_name: "Ada Ortiz", rep_type: "STAFF_ATTORNEY",
#        languages: ["en","es"], max_case_load: 25, max_supervisees: 10,
#        weekly_capacity_hours: 40, bar_number: "BAR-1001" }                              as ProgramDirector
#        -> captures atty_a_id: "$.data.id"
#   4  POST /representatives { full_name: "Ben Cole", ... bar_number: "BAR-2002" }         as ProgramDirector
#        -> captures atty_b_id: "$.data.id"
#   5  POST /representatives { full_name: "Sara Ruiz", ... bar_number: "BAR-3003" }        as ProgramDirector
#        -> captures screener_id: "$.data.id"
#   6  POST /clients { full_name: "Rosa Mena", preferred_language_code: "es",
#        country_of_birth_code: "GT", date_of_birth: "1990-04-11", household_size: 3,
#        annual_household_income_cents: 2000000 }         as IntakeScreener (X-User-ID ${screener_id})
#        -> captures client_id: "$.data.id"
#   7  POST /intake-screenings { client_id: "${client_id}", cycle_id: "${cycle_id}",
#        case_type: "U_VISA", detained: false }           as IntakeScreener (X-User-ID ${screener_id})
#        -> captures intake_id: "$.data.id"
#   8  POST /intake-screenings/${intake_id}/screen {}     as IntakeScreener (X-User-ID ${screener_id})
#   9  POST /intake-screenings/${intake_id}/decide { decision: "ACCEPT",
#        decision_reason_code: "ACCEPTED_ON_MERIT" }  as SupervisingAttorney (X-User-ID ${atty_b_id})
#  10  GET  /case-matters?intake_id=${intake_id}                                          as ProgramDirector
#        -> captures matter_id: "$.data[0].id", matter_v1: "$.data[0].version"
#  11  POST /case-assignments { matter_id: "${matter_id}", representative_id: "${atty_a_id}",
#        role_on_case: "LEAD", expected_matter_version: "${matter_v1}" }
#                                                    as SupervisingAttorney (X-User-ID ${atty_b_id})
#        -> captures lead_id: "$.data.id"
#  12  POST /case-assignments/${lead_id}/transition { action: "ACTIVATE" }
#                                                    as SupervisingAttorney (X-User-ID ${atty_b_id})
#   Resulting state: CaseMatter.representation_status == "STAFFED",
#   filing_status == "PRE_FILING", Representative(atty_a).active_case_load == 1.
#
# ACCEPT_INTAKE(client=<id>, case_type=<T>, detained=<bool>) — four calls that
# turn an existing client into an accepted matter at the current clock:
#   a  POST /intake-screenings { client_id: <id>, cycle_id: "${cycle_id}",
#       case_type: <T>, detained: <bool> }             as IntakeScreener (X-User-ID ${screener_id})
#       -> captures the new intake id
#   b  POST /intake-screenings/{intake}/screen {}      as IntakeScreener (X-User-ID ${screener_id})
#   c  POST /intake-screenings/{intake}/decide { decision: "ACCEPT",
#       decision_reason_code: "ACCEPTED_ON_MERIT" } as SupervisingAttorney (X-User-ID ${atty_b_id})
#   d  GET  /case-matters?intake_id={intake}                                              as ProgramDirector
#       -> captures the matter id from "$.data[0].id"
#
# TEMPLATE B — TEMPLATE A plus a CERTIFIED Spanish declaration (11 further calls;
# adds captures cocounsel_id, decl_id, sess_id):
#   13  GET  /case-matters/${matter_id}                                                   as ProgramDirector
#         -> captures matter_v2: "$.data.version"
#   14  POST /case-assignments { matter_id: "${matter_id}", representative_id: "${atty_b_id}",
#         role_on_case: "CO_COUNSEL", expected_matter_version: "${matter_v2}" }
#                                                    as SupervisingAttorney (X-User-ID ${atty_b_id})
#         -> captures cocounsel_id: "$.data.id"
#   15  POST /case-assignments/${cocounsel_id}/transition { action: "ACTIVATE" }
#                                                    as SupervisingAttorney (X-User-ID ${atty_b_id})
#   16  POST /declarations { matter_id: "${matter_id}", preparer_assignment_id: "${lead_id}",
#         language_code: "es", word_count: 950 }     as CaseRepresentative (X-User-ID ${atty_a_id})
#         -> captures decl_id: "$.data.id"
#   17  POST /interpretation-sessions { matter_id: "${matter_id}", language_code: "es",
#         interpreter_source: "CONTRACT", purpose: "DECLARATION_READBACK",
#         scheduled_start_utc: "2026-08-03T09:00:00.000Z",
#         scheduled_end_utc: "2026-08-03T10:00:00.000Z" }
#                                                    as SupervisingAttorney (X-User-ID ${atty_b_id})
#         -> captures sess_id: "$.data.id"
#   18  POST /interpretation-sessions/${sess_id}/transition { action: "COMPLETE",
#         actual_minutes: 45 }                       as SupervisingAttorney (X-User-ID ${atty_b_id})
#         (billable_cents 7125 = 9500 * 0.75, language 'es' is COMMON so no surcharge)
#   19  POST /declarations/${decl_id}/transition { action: "SUBMIT_FOR_REVIEW" }
#                                                    as CaseRepresentative (X-User-ID ${atty_a_id})
#   20  POST /declarations/${decl_id}/transition { action: "CERTIFY",
#         reviewer_assignment_id: "${cocounsel_id}" } as SupervisingAttorney (X-User-ID ${atty_b_id})
#   Resulting state: representation_status "STAFFED", filing_status "PRE_FILING",
#   Declaration.${decl_id}.status "CERTIFIED", readback_completed true,
#   CaseMatter.interpretation_cost_cents 7125.
# =============================================================================

scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:

      - name: client_create_returns_201_with_every_declared_field
        claim_type: Creation
        grounds:
          - endpoints[POST /clients]
          - entities.Client.fields.full_name
          - entities.Client.fields.household_size
          - response_envelope.success
        distinguishing_aspect: "POST /clients with every required input field returns 201 and echoes full_name, preferred_language_code, country_of_birth_code, date_of_birth, household_size and annual_household_income_cents verbatim inside data."
        test_recipe:
          setup:
            - "Empty database; logical clock pinned to 2026-08-03T09:00:00.000Z so date_of_birth 1990-04-11 is strictly before the clock date."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T09:00:00.000Z" }
              as: ProgramDirector
          trigger:
            - call: "POST /clients"
              payload: { full_name: "Rosa Mena", preferred_language_code: "es", country_of_birth_code: "GT", date_of_birth: "1990-04-11", household_size: 3, annual_household_income_cents: 2000000, a_number: "A123456789", confidentiality_consent_scope: "FUNDER_IDENTIFIED" }
              as: ProgramDirector
              captures: { client_id: "$.data.id" }
          assert:
            - "HTTP status == 201"
            - "Client.${client_id}.full_name == 'Rosa Mena'"
            - "Client.${client_id}.preferred_language_code == 'es'"
            - "Client.${client_id}.country_of_birth_code == 'GT'"
            - "Client.${client_id}.date_of_birth == '1990-04-11'"
            - "Client.${client_id}.household_size == 3"
            - "Client.${client_id}.annual_household_income_cents == 2000000"
            - "Client.${client_id}.a_number == 'A123456789'"
            - "response meta.api_request_id is present and response_type == 'object'"

      - name: client_get_by_id_returns_stored_row_unchanged
        claim_type: Retrieval
        grounds:
          - endpoints[GET /clients/{client_id}]
          - entities.Client.fields.fpl_percent
        distinguishing_aspect: "GET /clients/{client_id} returns the same fpl_percent (77.76) and household_size (3) that POST /clients persisted, with no recomputation drift."
        test_recipe:
          setup:
            - "One Client with household_size 3 and annual_household_income_cents 2000000 exists."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T09:00:00.000Z" }
              as: ProgramDirector
            - call: "POST /clients"
              payload: { full_name: "Rosa Mena", preferred_language_code: "es", country_of_birth_code: "GT", date_of_birth: "1990-04-11", household_size: 3, annual_household_income_cents: 2000000 }
              as: ProgramDirector
              captures: { client_id: "$.data.id" }
          trigger:
            - call: "GET /clients/${client_id}"
              payload: {}
              as: ProgramDirector
          assert:
            - "HTTP status == 200"
            - "Client.${client_id}.fpl_percent == 77.76"
            - "Client.${client_id}.household_size == 3"
            - "Client.${client_id}.open_matter_count == 0"

      - name: clients_list_returns_pagination_meta_with_limit_and_offset
        claim_type: Listing
        grounds:
          - endpoints[GET /clients]
          - response_envelope.pagination_fields
          - response_envelope.pagination_defaults
        distinguishing_aspect: "GET /clients?limit=2&offset=1 over three clients returns exactly 2 rows with meta.total_count == 3 and meta.has_more == false, proving offset and total_count are computed over the unpaged set."
        test_recipe:
          setup:
            - "Exactly three Client rows exist, created in the order Rosa, Luis, Ana."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T09:00:00.000Z" }
              as: ProgramDirector
            - call: "POST /clients"
              payload: { full_name: "Rosa Mena", preferred_language_code: "es", country_of_birth_code: "GT", date_of_birth: "1990-04-11", household_size: 3, annual_household_income_cents: 2000000 }
              as: ProgramDirector
            - call: "POST /clients"
              payload: { full_name: "Luis Paz", preferred_language_code: "en", country_of_birth_code: "HN", date_of_birth: "1985-02-02", household_size: 1, annual_household_income_cents: 1000000 }
              as: ProgramDirector
            - call: "POST /clients"
              payload: { full_name: "Ana Diaz", preferred_language_code: "ht", country_of_birth_code: "HT", date_of_birth: "1995-06-06", household_size: 2, annual_household_income_cents: 500000 }
              as: ProgramDirector
          trigger:
            - call: "GET /clients"
              payload: { limit: 2, offset: 1 }
              as: ProgramDirector
          assert:
            - "HTTP status == 200 and response_type == 'array'"
            - "len(data) == 2"
            - "meta.total_count == 3"
            - "meta.has_more == false"
            - "meta.limit == 2 and meta.offset == 1"

      - name: clients_list_filter_by_preferred_language_narrows_set
        claim_type: Listing
        grounds:
          - endpoints[GET /clients]
          - entities.Client.fields.preferred_language_code
        distinguishing_aspect: "GET /clients?preferred_language_code=ht returns only the single 'ht' client and meta.total_count == 1, so total_count reflects the filtered set rather than the whole table."
        test_recipe:
          setup:
            - "Three Client rows exist with preferred_language_code es, en and ht respectively."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T09:00:00.000Z" }
              as: ProgramDirector
            - call: "POST /clients"
              payload: { full_name: "Rosa Mena", preferred_language_code: "es", country_of_birth_code: "GT", date_of_birth: "1990-04-11", household_size: 3, annual_household_income_cents: 2000000 }
              as: ProgramDirector
            - call: "POST /clients"
              payload: { full_name: "Luis Paz", preferred_language_code: "en", country_of_birth_code: "HN", date_of_birth: "1985-02-02", household_size: 1, annual_household_income_cents: 1000000 }
              as: ProgramDirector
            - call: "POST /clients"
              payload: { full_name: "Ana Diaz", preferred_language_code: "ht", country_of_birth_code: "HT", date_of_birth: "1995-06-06", household_size: 2, annual_household_income_cents: 500000 }
              as: ProgramDirector
              captures: { ana_id: "$.data.id" }
          trigger:
            - call: "GET /clients"
              payload: { preferred_language_code: "ht" }
              as: ProgramDirector
          assert:
            - "HTTP status == 200"
            - "len(data) == 1 and data[0].id == '${ana_id}'"
            - "meta.total_count == 1 and meta.has_more == false"

      - name: client_get_with_unknown_uuid_returns_client_not_found
        claim_type: Not Found
        grounds:
          - validations[priority=7]
          - errors[ERR_CLIENT_NOT_FOUND]
          - endpoints[GET /clients/{client_id}]
        distinguishing_aspect: "GET /clients/{unknown uuid} returns ERR_CLIENT_NOT_FOUND with HTTP 404, not the generic ERR_NOT_FOUND, because priority 7 names this endpoint explicitly."
        test_recipe:
          setup:
            - "One unrelated Client exists so the table is non-empty; the requested uuid belongs to no row."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T09:00:00.000Z" }
              as: ProgramDirector
            - call: "POST /clients"
              payload: { full_name: "Rosa Mena", preferred_language_code: "es", country_of_birth_code: "GT", date_of_birth: "1990-04-11", household_size: 3, annual_household_income_cents: 2000000 }
              as: ProgramDirector
          trigger:
            - call: "GET /clients/00000000-0000-4000-8000-000000000999"
              payload: {}
              as: ProgramDirector
          assert:
            - "HTTP status == 404"
            - "data.error_id == 'ERR_CLIENT_NOT_FOUND'"
            - "response_type == 'error'"

      - name: client_create_without_household_size_returns_validation
        claim_type: Required Fields
        grounds:
          - validations[priority=13]
          - errors[ERR_VALIDATION]
          - entities.Client.fields.household_size
        distinguishing_aspect: "household_size has source: input with no default, so omitting it returns ERR_VALIDATION / 422 and no Client row is created."
        test_recipe:
          setup:
            - "Empty Client table."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T09:00:00.000Z" }
              as: ProgramDirector
          trigger:
            - call: "POST /clients"
              payload: { full_name: "Rosa Mena", preferred_language_code: "es", country_of_birth_code: "GT", date_of_birth: "1990-04-11", annual_household_income_cents: 2000000 }
              as: ProgramDirector
          assert:
            - "HTTP status == 422"
            - "data.error_id == 'ERR_VALIDATION'"
            - "GET /clients afterwards returns meta.total_count == 0"

      - name: client_create_omitting_consent_scope_defaults_to_program_only
        claim_type: Defaults
        grounds:
          - entities.Client.fields.confidentiality_consent_scope
          - endpoints[POST /clients]
        distinguishing_aspect: "Omitting the optional confidentiality_consent_scope yields the declared default PROGRAM_ONLY, which is strictly below the FUNDER_AGGREGATE level a DEIDENTIFIED_CASE_LEVEL report requires."
        test_recipe:
          setup:
            - "Empty Client table."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T09:00:00.000Z" }
              as: ProgramDirector
          trigger:
            - call: "POST /clients"
              payload: { full_name: "Rosa Mena", preferred_language_code: "es", country_of_birth_code: "GT", date_of_birth: "1990-04-11", household_size: 3, annual_household_income_cents: 2000000 }
              as: ProgramDirector
              captures: { client_id: "$.data.id" }
          assert:
            - "HTTP status == 201"
            - "Client.${client_id}.confidentiality_consent_scope == 'PROGRAM_ONLY'"
            - "Client.${client_id}.a_number == null"

      - name: client_interpreter_required_is_computed_and_ignores_supplied_value
        claim_type: Computed Fields
        grounds:
          - entities.Client.fields.interpreter_required
          - endpoints[POST /clients]
        distinguishing_aspect: "interpreter_required has source: computed as (preferred_language_code != 'en'), so a request that supplies interpreter_required: false alongside preferred_language_code 'ht' still persists true."
        test_recipe:
          setup:
            - "Empty Client table."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T09:00:00.000Z" }
              as: ProgramDirector
          trigger:
            - call: "POST /clients"
              payload: { full_name: "Ana Diaz", preferred_language_code: "ht", country_of_birth_code: "HT", date_of_birth: "1995-06-06", household_size: 2, annual_household_income_cents: 500000, interpreter_required: false }
              as: ProgramDirector
              captures: { client_id: "$.data.id" }
          assert:
            - "HTTP status == 201"
            - "Client.${client_id}.interpreter_required == true"

      - name: client_english_speaker_computes_interpreter_required_false
        claim_type: Computed Fields
        grounds:
          - entities.Client.fields.interpreter_required
          - validations[priority=29]
        distinguishing_aspect: "preferred_language_code 'en' computes interpreter_required == false, which is the exact flag that switches off the ERR_READBACK_NOT_COMPLETED gate on declaration certification."
        test_recipe:
          setup:
            - "Empty Client table."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T09:00:00.000Z" }
              as: ProgramDirector
          trigger:
            - call: "POST /clients"
              payload: { full_name: "Luis Paz", preferred_language_code: "en", country_of_birth_code: "HN", date_of_birth: "1985-02-02", household_size: 1, annual_household_income_cents: 1000000 }
              as: ProgramDirector
              captures: { client_id: "$.data.id" }
          assert:
            - "HTTP status == 201"
            - "Client.${client_id}.interpreter_required == false"

      - name: client_system_fields_are_server_minted
        claim_type: System Fields
        grounds:
          - entities.Client.common_fields
          - endpoints[POST /clients]
        distinguishing_aspect: "id, created_at, updated_at and version come from common_fields and are minted by the server: version is exactly 1 on the freshly created Client and id is a server-generated uuid, not any client-supplied value."
        test_recipe:
          setup:
            - "Empty Client table."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T09:00:00.000Z" }
              as: ProgramDirector
          trigger:
            - call: "POST /clients"
              payload: { full_name: "Rosa Mena", preferred_language_code: "es", country_of_birth_code: "GT", date_of_birth: "1990-04-11", household_size: 3, annual_household_income_cents: 2000000 }
              as: ProgramDirector
              captures: { client_id: "$.data.id", client_v: "$.data.version" }
          assert:
            - "HTTP status == 201"
            - "Client.${client_id}.version == 1"
            - "Client.${client_id}.id is a uuid and created_at is a non-null ISO 8601 instant"

      - name: intake_create_with_out_of_enum_case_type_returns_validation
        claim_type: Type Constraints
        grounds:
          - validations[priority=13]
          - errors[ERR_VALIDATION]
          - entities.IntakeScreening.fields.case_type
        distinguishing_aspect: "case_type 'ASYLUM_SOMETHING' is outside the declared ten-member enum, so priority 13 returns ERR_VALIDATION / 422 even though client_id and cycle_id both resolve."
        test_recipe:
          setup:
            - "One Client and one ProgramCapacityCycle exist and both ids in the request resolve."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T09:00:00.000Z" }
              as: ProgramDirector
            - call: "POST /capacity-cycles"
              payload: { cycle_label: "FY26-H2", period_start_date: "2026-07-01", period_end_date: "2026-12-31", total_case_slots: 10, reserved_detained_slots: 2 }
              as: ProgramDirector
              captures: { cycle_id: "$.data.id" }
            - call: "POST /clients"
              payload: { full_name: "Rosa Mena", preferred_language_code: "es", country_of_birth_code: "GT", date_of_birth: "1990-04-11", household_size: 3, annual_household_income_cents: 2000000 }
              as: ProgramDirector
              captures: { client_id: "$.data.id" }
          trigger:
            - call: "POST /intake-screenings"
              payload: { client_id: "${client_id}", cycle_id: "${cycle_id}", case_type: "ASYLUM_SOMETHING", detained: false }
              as: ProgramDirector
          assert:
            - "HTTP status == 422"
            - "data.error_id == 'ERR_VALIDATION'"
            - "GET /intake-screenings afterwards returns meta.total_count == 0"

      - name: capacity_cycle_reserved_greater_than_total_returns_validation
        claim_type: Type Constraints
        grounds:
          - entities.ProgramCapacityCycle.fields.reserved_detained_slots
          - endpoints[POST /capacity-cycles]
          - errors[ERR_VALIDATION]
        distinguishing_aspect: "reserved_detained_slots 11 against total_case_slots 10 violates the declared '<= total_case_slots' bound and returns ERR_VALIDATION / 422, while reserved == total is explicitly legal."
        test_recipe:
          setup:
            - "Empty ProgramCapacityCycle table."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T09:00:00.000Z" }
              as: ProgramDirector
          trigger:
            - call: "POST /capacity-cycles"
              payload: { cycle_label: "FY26-BAD", period_start_date: "2026-07-01", period_end_date: "2026-12-31", total_case_slots: 10, reserved_detained_slots: 11 }
              as: ProgramDirector
          assert:
            - "HTTP status == 422"
            - "data.error_id == 'ERR_VALIDATION'"
            - "GET /capacity-cycles afterwards returns meta.total_count == 0"

      - name: capacity_cycle_reserved_equal_to_total_is_legal_and_zeroes_general_pool
        claim_type: Type Constraints
        grounds:
          - endpoints[POST /capacity-cycles]
          - calculations.capacity_slot_waterfall
        distinguishing_aspect: "reserved_detained_slots == total_case_slots (3 of 3) is accepted at 201 and leaves general_pool_free permanently 0, which is the boundary the '<=' bound admits and the '>' bound rejects."
        test_recipe:
          setup:
            - "Empty ProgramCapacityCycle table."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T09:00:00.000Z" }
              as: ProgramDirector
