            - call: "POST /advisors"
              payload: { full_name: "Ben Cho", email: "ben@apfm.test", region_code: "TX-AUS", is_va_certified: true, caseload_capacity: 3 }
              as: PlatformAdmin
              captures: { a2_id: $.data.id }
            - call: "POST /families"
              payload: { primary_contact_name: "Dana Kim", email: "dana@apfm.test", phone: "512-555-0100", relationship_to_senior: "ADULT_CHILD", state_code: "TX", senior_first_name: "Ruth", senior_age: 82 }
              as: PlatformAdmin
              captures: { f1_id: $.data.id }
            - call: "POST /inquiries"
              payload: { family_id: "${f1_id}", origin: "WEB", region_code: "TX-AUS", requested_care_level: "ASSISTED_LIVING", target_move_in_date: "2026-06-20", declared_budget_monthly_cents: 520000 }
              as: PlatformAdmin
              captures: { q1_id: $.data.id }
            - call: "POST /inquiries/${q1_id}/assign"
              payload: { advisor_id: "${a1_id}" }
              as: PlatformAdmin
          trigger:
            - call: "POST /inquiries/${q1_id}/reassign"
              payload: { to_advisor_id: "${a2_id}" }
              as: PlatformAdmin
          assert:
            - "Advisor.${a1_id}.active_caseload_count == 0"
            - "Advisor.${a2_id}.active_caseload_count == 1"
            - "Advisor.${a1_id}.active_caseload_count + Advisor.${a2_id}.active_caseload_count == 1"
            - "Advisor.${a1_id}.headcount_load_index == 0.0 and Advisor.${a1_id}.weighted_load_index == 0.0"
            - "Advisor.${a2_id}.headcount_load_index == 0.3333 and Advisor.${a2_id}.weighted_load_index == 0.2353"
            - "Inquiry.${q1_id}.assigned_advisor_id == ${a2_id} and Inquiry.${q1_id}.status == ASSIGNED"
            - "GET /caseload-assignments with status=ACTIVE returns total_count == 1"
            - "GET /caseload-assignments with inquiry_id=${q1_id} returns exactly 2 rows: one REASSIGNED with release_reason REASSIGNED for ${a1_id}, one ACTIVE for ${a2_id}"
