          trigger:
            - { call: "POST /trend-signals", as: QualityLead, as_user_id: "${ql1}", payload: { scope_level: PLANT, plant_id: "${pl1}", window_start: "2026-08-01T00:00:00Z", window_end: "2026-08-01T00:00:00Z" }, captures: { e1: "$.data.error_id" } }
            - { call: "POST /trend-signals", as: QualityLead, as_user_id: "${ql1}", payload: { scope_level: PLANT, plant_id: "${pl1}", window_start: "2026-08-02T00:00:00Z", window_end: "2026-08-01T00:00:00Z" }, captures: { e2: "$.data.error_id" } }
            - { call: "POST /trend-signals", as: QualityLead, as_user_id: "${ql1}", payload: { scope_level: PLANT, plant_id: "${pl1}", window_start: "2026-08-03T00:00:00Z", window_end: "2026-08-03T00:00:00.001Z" }, captures: { e3: "$.data.error_id" } }
            - { call: "POST /trend-signals", as: QualityLead, as_user_id: "${ql1}", payload: { scope_level: PLANT, plant_id: "${pl1}", window_start: "2026-08-01T00:00:00Z", window_end: "2026-08-01T00:00:00.001Z" }, captures: { sig: "$.data.id", mc: "$.data.membership_count" } }
