# =============================================================================
# 1.6 Error Code Catalog (24 codes)
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "X-User-Role or X-User-ID header missing or invalid" }
  - { id: ERR_FORBIDDEN, http: 403, condition: "Role not permitted for this endpoint" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Referenced resource does not exist" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Required field missing or malformed" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Resource not in valid source state for the transition" }
  - { id: ERR_STALE_MEMBER_VERSION, http: 412, condition: "OCC mismatch on Member.version during withdraw" }
  - { id: ERR_STALE_FISCAL_YEAR_VERSION, http: 412, condition: "OCC mismatch on FiscalYear.version during finalize_close" }
  - { id: ERR_STALE_CERTIFICATE_VERSION, http: 412, condition: "OCC mismatch on any certificate during disburse" }
  - { id: ERR_COMPLIANCE_GATE, http: 422, condition: "Compliance rule failed (estate window not elapsed, member deceased, certificate frozen)" }
  - { id: ERR_TEMPORAL_WINDOW, http: 422, condition: "Operation outside its permitted time window (year closed, voting not open, appointment in past)" }
  - { id: ERR_REFERENTIAL, http: 422, condition: "Cross-entity referential integrity violation" }
  - { id: ERR_CONSTRAINT_VIOLATION, http: 409, condition: "Aggregate constraint violated (cycle overlap, appointment conflict, delegate cap)" }
  - { id: ERR_FISCAL, http: 422, condition: "Fiscal rule failed (amount > outstanding, certificate not yet redeemable, pool over-allocation)" }
  - { id: ERR_FISCAL_BOUNDARY, http: 422, condition: "Numeric input out of permitted range (gross_bushels <= 0, dockage_pct > 0.30, etc.)" }
  - { id: ERR_DELIVERY_ALREADY_SETTLED, http: 409, condition: "Delivery already in SETTLED status; second settle attempt rejected" }
  - { id: ERR_CYCLE_OVERLAP, http: 409, condition: "Another OPEN RevolvementCycle for the same equity_class overlaps the requested window" }
  - { id: ERR_CYCLE_BUDGET_EXCEEDED, http: 422, condition: "CYCLE_REDEMPTION would push cycle.redeemed_cents over budget_cap_cents" }
  - { id: ERR_APPOINTMENT_CONFLICT, http: 409, condition: "Office appointment slot overlaps an existing UNDER_REVIEW or APPROVED request" }
  - { id: ERR_ESTATE_WINDOW_NOT_ELAPSED, http: 422, condition: "Estate claim filed fewer than claim_window_days ago; board cannot yet decide" }
  - { id: ERR_CERTIFICATE_FROZEN, http: 422, condition: "Certificate in FROZEN status cannot be redeemed" }
  - { id: ERR_CERTIFICATE_NOT_REDEEMABLE, http: 422, condition: "clock.now < certificate.redeemable_at" }
  - { id: ERR_DELEGATE_CAP_REACHED, http: 409, condition: "District already seats max_delegates ACTIVE delegates" }
  - { id: ERR_QUORUM_NOT_MET, http: 422, condition: "votes_for + votes_against < quorum_required; resolution cannot be tallied" }
  - { id: ERR_CERTIFICATE_OWNERSHIP, http: 422, condition: "Listed certificate_id not owned by requesting member" }

# =============================================================================
# 1.7 RBAC Matrix
# =============================================================================
roles:
  - name: CoopAdmin
    description: "System administrator; bootstraps districts and clock"
    identity: opaque
    exclusive_operations:
      - "POST /coop/_clock/set_current_utc"
      - "POST /coop/delegate_districts"
    shared_operations:
      - "GET /coop/delegate_districts/{id}"
      - "GET /coop/delegate_districts/{id}/delegates"

  - name: CoopRegistrar
    description: "Member registry officer; handles lifecycle and estates"
    identity: opaque
    exclusive_operations:
