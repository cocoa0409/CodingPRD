            - "Trigger call 3 returns 409 ERR_ROOM_NOT_ACCEPTING_SEATS: the version supplied in the payload is the current one read in trigger call 2, so the OCC gate passes and the state gate is the only thing left to refuse the offer"
            - "Trigger call 4 returns 409 ERR_SEAT_NOT_OFFERED and trigger call 5 returns 409 ERR_SEAT_NOT_CONFIRMED - one terminal seat, two distinct codes"
            - "Trigger call 6 returns 409 ERR_EPISODE_ALREADY_LOCKED and Episode.${ep1}.locked_at is unchanged"
            - "Episode.${ep1}.script_readiness == LOCKED, Season.${se}.ready_script_count == 1, coverage_gap == 0 and coverage_posture == COVERED"

      - name: accepting_or_approving_twice_is_refused_on_the_second_attempt
        claim_type: idempotency
        grounds:
