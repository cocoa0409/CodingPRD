        distinguishing_aspect: "A POST /projects/{unknown}/deposit carrying an amount that would also violate priority 34 returns ERR_PROJECT_NOT_FOUND (404), not ERR_DEPOSIT_AMOUNT_MISMATCH — path resolution at priority 6 runs first."
        test_recipe:
