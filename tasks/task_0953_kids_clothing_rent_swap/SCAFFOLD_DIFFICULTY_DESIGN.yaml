  # =======================================================================
  # RULE 5 — validation priority conflicts across different error-category pairs
  # =======================================================================
  - rule_id: priority_pair_validation_conflict
    instances:

      - name: cycle_not_open_wins_over_swap_entitlement_exhausted
        grounds:
          - validations[priority=23]
          - validations[priority=45]
          - validations[priority=33]
          - errors[ERR_CYCLE_NOT_OPEN]
          - errors[ERR_SWAP_ENTITLEMENT_EXHAUSTED]
        distinguishing_aspect: |
          Error-category pair = `state` (rung 23, G7_STATE) versus `business_constraint`
          (rung 45, G9_ENTITLEMENT). The plan grants ZERO swaps per cycle and the cycle has
          already left OPEN, so both rungs are violated by one request; the ladder returns
          ERR_CYCLE_NOT_OPEN because G7 precedes G9.
        test_recipe:
          setup:
            - "A CORE plan with 1 box slot and swaps_per_cycle 0, so the swap entitlement is exhausted from the outset."
            - "One ACTIVE member sized 5 with one allocated box item, so the swap request's referenced ids resolve and are owned."
            - "A DRAFT swap request created while the cycle was OPEN and the clock was inside the swap window."
            - "The clock has advanced past swap_by_at and the cycle has been moved to SWAP_CLOSED."
          setup_api_calls:
            - call: "POST /kidswear/plans"
              payload: { tier: "CORE", slots_per_box: 1, swaps_per_cycle: 0, monthly_fee_cents: 5000, discount_pct: 0 }
              as: PlatformAdmin
              captures: { plan_p1: $.data.id }
            - call: "POST /kidswear/members"
              payload: { plan_id: "${plan_p1}", email: "prio1@kidswear.test", display_name: "Prio One", child_size_code: "5", auto_apply_credit: false }
              as: PlatformAdmin
              captures: { m_p1: $.data.id }
            - call: "POST /kidswear/members/${m_p1}/activate"
              payload: {}
              as: PlatformAdmin
            - call: "POST /kidswear/garment-styles"
              payload: { sku: "SKU-P1-5", name: "Prio Tee", brand_tier: "STANDARD", retail_price_cents: 3000, size_code: "5", season: "SS", category: "TOP", demand_band: "MEDIUM" }
              as: MerchandisePlanner
              captures: { st_p1: $.data.id }
            - call: "POST /kidswear/garment-units"
              payload: { style_id: "${st_p1}", acquired_at: "2026-01-01T00:00:00Z", current_grade: "A", cycles_completed: 0 }
              as: MerchandisePlanner
              captures: { u_p1: $.data.id }
            - call: "POST /kidswear/cycles"
              payload: { member_id: "${m_p1}", start_at: "2026-05-01T00:00:00Z" }
              as: PlatformAdmin
              captures: { cyc_p1: $.data.id }
            - call: "POST /kidswear/cycles/${cyc_p1}/open"
              payload: {}
              as: PlatformAdmin
            - call: "POST /kidswear/boxes"
              payload: { cycle_id: "${cyc_p1}" }
              as: WarehouseOperator
              captures: { box_p1: $.data.id }
            - call: "POST /kidswear/boxes/${box_p1}/allocate"
              payload: { unit_id: "${u_p1}" }
              as: WarehouseOperator
              captures: { bi_p1: $.data.id }
            - call: "GET /kidswear/cycles/${cyc_p1}"
              payload: {}
              as: Member
              as_user_id: "${m_p1}"
              captures: { v_cyc_p1: $.data.version }
            - call: "POST /kidswear/cycles/${cyc_p1}/swap-requests"
              payload: { return_box_item_ids: ["${bi_p1}"], requested_style_ids: ["${st_p1}"], expected_cycle_version: "${v_cyc_p1}" }
              as: Member
              as_user_id: "${m_p1}"
              captures: { sr_p1: $.data.id }
            - call: "POST /kidswear/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-22T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /kidswear/cycles/${cyc_p1}/close-swap-window"
              payload: {}
              as: PlatformAdmin
          trigger:
            - call: "POST /kidswear/swap-requests/${sr_p1}/submit"
              payload: {}
              as: Member
              as_user_id: "${m_p1}"
              captures: { err_p1: $.data.error_id }
          assert:
            - "the trigger returns HTTP 409"
            - "the captured err_p1 equals ERR_CYCLE_NOT_OPEN"
            - "the captured err_p1 does NOT equal ERR_SWAP_ENTITLEMENT_EXHAUSTED"
            - "SwapRequest.${sr_p1}.status == DRAFT"
            - "Cycle.${cyc_p1}.swaps_used == 0"

      - name: member_delinquent_wins_over_swap_window_closed
        grounds:
          - validations[priority=16]
          - validations[priority=33]
          - errors[ERR_MEMBER_DELINQUENT]
          - errors[ERR_SWAP_WINDOW_CLOSED]
          - calculations.delinquency_evaluation
        distinguishing_aspect: |
          Error-category pair = `business_fiscal` (rung 16, G4_STANDING) versus
          `business_temporal` (rung 33, G8_WINDOW) — a different pair from the state /
          business_constraint conflict above. The member is DELINQUENT and the clock is past
          swap_by_at; the ladder returns ERR_MEMBER_DELINQUENT because G4 precedes G8.
        test_recipe:
          setup:
            - "A CORE plan with 1 box slot and 2 swaps per cycle; one ACTIVE member sized 5 with one allocated box item."
            - "A 20000-cent operator charge has pushed Member.outstanding_balance_cents to 25000, above the 15000 threshold, so the member is DELINQUENT and the cycle is HELD."
            - "The clock has advanced to 2026-05-22, past the cycle's swap_by_at of 2026-05-21."
            - "The cycle version is re-read AFTER the delinquency cascade so the OCC input is fresh and G6 cannot fire."
          setup_api_calls:
            - call: "POST /kidswear/plans"
              payload: { tier: "CORE", slots_per_box: 1, swaps_per_cycle: 2, monthly_fee_cents: 5000, discount_pct: 0 }
              as: PlatformAdmin
              captures: { plan_p2: $.data.id }
            - call: "POST /kidswear/members"
              payload: { plan_id: "${plan_p2}", email: "prio2@kidswear.test", display_name: "Prio Two", child_size_code: "5", auto_apply_credit: false }
              as: PlatformAdmin
              captures: { m_p2: $.data.id }
            - call: "POST /kidswear/members/${m_p2}/activate"
              payload: {}
              as: PlatformAdmin
            - call: "POST /kidswear/garment-styles"
              payload: { sku: "SKU-P2-5", name: "Prio Two Tee", brand_tier: "STANDARD", retail_price_cents: 3000, size_code: "5", season: "SS", category: "TOP", demand_band: "MEDIUM" }
              as: MerchandisePlanner
              captures: { st_p2: $.data.id }
            - call: "POST /kidswear/garment-units"
              payload: { style_id: "${st_p2}", acquired_at: "2026-01-01T00:00:00Z", current_grade: "A", cycles_completed: 0 }
              as: MerchandisePlanner
              captures: { u_p2: $.data.id }
            - call: "POST /kidswear/cycles"
              payload: { member_id: "${m_p2}", start_at: "2026-05-01T00:00:00Z" }
              as: PlatformAdmin
              captures: { cyc_p2: $.data.id }
            - call: "POST /kidswear/cycles/${cyc_p2}/open"
              payload: {}
              as: PlatformAdmin
            - call: "POST /kidswear/boxes"
              payload: { cycle_id: "${cyc_p2}" }
              as: WarehouseOperator
              captures: { box_p2: $.data.id }
            - call: "POST /kidswear/boxes/${box_p2}/allocate"
              payload: { unit_id: "${u_p2}" }
              as: WarehouseOperator
              captures: { bi_p2: $.data.id }
            - call: "POST /kidswear/members/${m_p2}/charge-adjustments"
              payload: { charge_type: "DAMAGE_FEE", amount_cents: 20000 }
              as: BillingAgent
              captures: { chg_p2: $.data.id }
            - call: "POST /kidswear/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-22T00:00:00Z" }
              as: PlatformAdmin
            - call: "GET /kidswear/cycles/${cyc_p2}"
              payload: {}
              as: BillingAgent
              captures: { v_cyc_p2: $.data.version }
          trigger:
            - call: "POST /kidswear/cycles/${cyc_p2}/swap-requests"
              payload: { return_box_item_ids: ["${bi_p2}"], requested_style_ids: ["${st_p2}"], expected_cycle_version: "${v_cyc_p2}" }
              as: Member
              as_user_id: "${m_p2}"
              captures: { err_p2: $.data.error_id }
          assert:
            - "the trigger returns HTTP 409"
            - "the captured err_p2 equals ERR_MEMBER_DELINQUENT"
            - "the captured err_p2 does NOT equal ERR_SWAP_WINDOW_CLOSED"
            - "Member.${m_p2}.status == DELINQUENT"
            - "Member.${m_p2}.outstanding_balance_cents == 25000"
            - "Cycle.${cyc_p2}.status == HELD"

  # =======================================================================
  # RULE 6 — boundary-precision checks on different metrics/endpoints
  # =======================================================================
  - rule_id: boundary_precision_check
    instances:

      - name: swap_submitted_exactly_at_swap_by_at_is_accepted
        grounds:
          - calculations.cycle_boundary_inclusivity
          - validations[priority=33]
          - entities.Cycle.fields.swap_by_at
        distinguishing_aspect: |
          METRIC = the swap-window instant on POST /kidswear/swap-requests/{id}/submit, whose
          comparator is ON OR BEFORE. A submission at exactly 2026-05-21T00:00:00Z — the
          cycle's swap_by_at to the millisecond — SUCCEEDS; the strict reading would reject it.
        test_recipe:
          setup:
            - "A CORE plan with 1 box slot and 1 swap per cycle; one ACTIVE member sized 5 with one allocated box item."
            - "A DRAFT swap request created at 2026-05-01."
            - "The logical clock is set to exactly the cycle's swap_by_at, 2026-05-21T00:00:00Z."
          setup_api_calls:
            - call: "POST /kidswear/plans"
              payload: { tier: "CORE", slots_per_box: 1, swaps_per_cycle: 1, monthly_fee_cents: 5000, discount_pct: 0 }
              as: PlatformAdmin
              captures: { plan_b1: $.data.id }
