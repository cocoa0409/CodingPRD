  - rule_id: resource_temporal_overlap
    instances:
      - name: station_capacity_conflict_with_changeover_buffer
        grounds:
          - validations[priority=45]
          - calculations.station_occupation_window
          - entities.AssemblyStation.fields.changeover_buffer_minutes
          - entities.StationLog.fields.occupation_to
          - errors[ERR_STATION_CAPACITY_CONFLICT]
        distinguishing_aspect: |
          The contended resource is a physical station with parallel_capacity 1, and its occupation windows are
          CLOSED intervals extended by a 30-minute changeover buffer: a log finishing at 09:00 owns the station
          through 09:30 inclusive, so a second unit starting at 09:15 is refused and even a 09:30 start would still
          touch the closed edge, while 09:31 is legal. Two different technicians are used so the double-booking
          rule cannot mask the station rule.
        test_recipe:
          setup:
            - "Certified OPL-60-A; AssemblyStation DRUM-01 with parallel_capacity 1 and changeover_buffer_minutes 30"
            - "Technicians T-100 and T-101, each holding DRUM_FAB"
            - "BuildOrders SN-0001 and SN-0002 both in ON_FLOOR"
