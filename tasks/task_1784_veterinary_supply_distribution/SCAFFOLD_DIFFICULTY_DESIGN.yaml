  - name: temperature_inclusive_range_boundary
    grounds:
    - calculations.temperature_excursion_check
    - state_machines.Shipment.IN_TRANSIT_to_QUARANTINED
    distinguishing_aspect: "Metric: degrees Celsius on POST /vet/shipments/{id}/temperature-readings\n\u2014 a third metric and endpoint. The [2.0, 8.0] range is INCLUSIVE:\n2.0 and 8.0 keep the shipment\
      \ IN_TRANSIT; 8.1 quarantines it.\n"
    test_recipe:
      setup:
      - ACTIVE clinic C; VACCINE product (GEN, 5000c, requires_cold_chain computed true) lot expiry 2027-06-30; order qty 2 APPROVED; cold-chain-certified shipment dispatched (IN_TRANSIT)
