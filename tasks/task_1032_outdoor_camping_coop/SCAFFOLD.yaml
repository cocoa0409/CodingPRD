    code: 201
    input: [member_id, permit_allocation_id, entry_date, expected_allocation_version]
    output: PermitPass
    side_effects: ["increments PermitAllocation.version by 1", "issued_count+=1", "snapshot price_cents", "Member.store_credit_cents -= price_cents"]

  - method: GET
    path: "/coop/permit-passes/{id}"
    description: "Get a permit pass by id"
    roles: [Member, StoreStaff]
    code: 200
    input: []
    output: PermitPass
    side_effects: []

  - method: GET
    path: "/coop/permit-passes"
    description: "List permit passes; filter by member_id and/or permit_allocation_id (FK reverse-reachability)"
    roles: [Member, StoreStaff]
    code: 200
    input: ["member_id?", "permit_allocation_id?", "status?", "limit?", "offset?"]
    output: PermitPass[]
    side_effects: []

  # ------------------------------- Test-driving clock
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the server logical clock. Startup default is 2026-07-01T00:00:00Z; before any call the clock reads exactly this default (never real wall-clock). Drives rental late fees, member schedule checks, permit seasons, and pass expiry deterministically."
    roles: [StoreStaff, Public]
    code: 200
    input: [to_iso8601]
    output: null
    side_effects: ["logical clock set to to_iso8601", "PermitPass whose entry_date+1day < clock -> EXPIRED"]

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "Missing/unrecognized X-User-Role or X-User-ID on a protected endpoint" }
  - { id: ERR_UNAUTHORIZED, http: 403, condition: "Role not permitted for the operation, or entity_backed Member acting on a resource it does not own" }
  - { id: ERR_VALIDATION, http: 400, condition: "Malformed body, missing required field, bad enum, or non-positive where a positive is required" }
  - { id: ERR_MEMBER_NOT_FOUND, http: 404, condition: "Referenced member id does not exist" }
  - { id: ERR_GEAR_SKU_NOT_FOUND, http: 404, condition: "Referenced gear_sku_id does not exist" }
  - { id: ERR_GEAR_UNIT_NOT_FOUND, http: 404, condition: "Referenced gear_unit_id does not exist" }
  - { id: ERR_RENTAL_NOT_FOUND, http: 404, condition: "Referenced rental agreement id does not exist" }
  - { id: ERR_SALES_ORDER_NOT_FOUND, http: 404, condition: "Referenced sales order id does not exist" }
  - { id: ERR_TRADE_IN_NOT_FOUND, http: 404, condition: "Referenced trade-in id does not exist" }
  - { id: ERR_CLASS_TRIP_NOT_FOUND, http: 404, condition: "Referenced class/trip id does not exist" }
  - { id: ERR_BOOKING_NOT_FOUND, http: 404, condition: "Referenced booking id does not exist" }
  - { id: ERR_PERMIT_ALLOCATION_NOT_FOUND, http: 404, condition: "Referenced permit_allocation_id does not exist" }
  - { id: ERR_PERMIT_PASS_NOT_FOUND, http: 404, condition: "Referenced permit pass id does not exist" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Requested transition not allowed from the resource's current state" }
  - { id: ERR_MEMBERSHIP_INACTIVE, http: 403, condition: "Member.membership_status == LAPSED for a rental pickup/quote, booking, or permit issue" }
  - { id: ERR_UNIT_NOT_READY, http: 409, condition: "Rental pickup attempted while its GearUnit is RENTED_OUT (currently out on another rental)" }
  - { id: ERR_UNIT_UNAVAILABLE, http: 409, condition: "Requested rental window overlaps an existing non-terminal rental on the unit incl. SERVICE_BUFFER_HOURS (half-open interval arithmetic)" }
  - { id: ERR_UNIT_NOT_RENTABLE, http: 422, condition: "Rental requested against a unit whose parent GearSku.rentable == false" }
  - { id: ERR_TRIP_NOT_SCHEDULED, http: 409, condition: "Booking or check-in against a ClassTrip not in SCHEDULED" }
  - { id: ERR_MEMBER_SCHEDULE_CONFLICT, http: 409, condition: "Booking overlaps another non-terminal booking of the same member (closed-interval trip windows)" }
  - { id: ERR_OUTSIDE_SEASON, http: 422, condition: "Permit entry_date outside [season_start, season_end]" }
  - { id: ERR_QUOTA_EXHAUSTED, http: 409, condition: "Permit issue attempted when PermitAllocation.available_quota == 0" }
  - { id: ERR_INSUFFICIENT_STORE_CREDIT, http: 402, condition: "Member store credit below the required amount (order pay-with-credit, booking, permit)" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_<parent>_version does not match the parent's current version (OCC)" }
  - { id: ERR_INVALID_OFFER_RESPONSE, http: 409, condition: "Trade-in respond with an action invalid for the current status, or COUNTER without counter_cents" }
  - { id: ERR_ORDER_NOT_PAID, http: 409, condition: "Order return attempted while payment_status != PAID or fulfillment_status != FULFILLED" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: Member
    description: "A co-op member acting on their own rentals, orders, bookings, trade-ins, and permits."
    identity: "entity_backed:Member"
    exclusive_operations:
      - "POST /coop/trade-ins (submit own trade-in)"
      - "POST /coop/trade-ins/{id}/respond (accept/counter/reject own offer)"
    shared_operations:
      - "POST /coop/rental-agreements (with StoreStaff)"
      - "POST /coop/rental-agreements/{id}/cancel (with StoreStaff)"
      - "POST /coop/sales-orders, .../pay, .../return (with StoreStaff)"
      - "POST /coop/bookings, .../cancel (with StoreStaff)"
      - "POST /coop/permit-passes (with StoreStaff)"
      - "GET reads on own resources (with StoreStaff)"

  - name: StoreStaff
    description: "Store operator running the counter, catalog, appraisals, fulfillment, trips, and permit pools."
    identity: opaque
    exclusive_operations:
      - "POST /coop/members/{id}/store-credit"
      - "POST /coop/gear-skus, POST /coop/gear-units"
      - "POST /coop/rental-agreements/{id}/pickup, .../return"
      - "POST /coop/sales-orders/{id}/fulfill"
      - "POST /coop/trade-ins/{id}/appraise, .../sell"
      - "POST /coop/class-trips, .../cancel, .../complete"
      - "POST /coop/bookings/{id}/check-in"
      - "POST /coop/permit-allocations"
    shared_operations:
      - "POST /coop/rental-agreements, .../cancel (with Member)"
      - "POST /coop/sales-orders, .../pay, .../return (with Member)"
      - "POST /coop/bookings, .../cancel (with Member)"
      - "POST /coop/permit-passes (with Member)"
      - "all GET reads"

  - name: Public
    description: "Unauthenticated/prospective user; may register a membership and set the test clock."
    identity: opaque
    exclusive_operations:
      - "POST /coop/members (register)"
    shared_operations:
      - "POST /_clock/set_current_utc (test-driving)"
