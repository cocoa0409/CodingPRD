# =============================================================================
# SCAFFOLD — Standards Development Consensus Process (SDO)
# §1.0–§1.7. Difficulty design lives in SCAFFOLD_DIFFICULTY_DESIGN.yaml (§1.8);
# corner design lives in SCAFFOLD_CORNER_DESIGN.yaml (§1.9).
# =============================================================================

scenario: |
  Generate task harder than expert level!

  2567. Standards Development Consensus Process (standards developing organization): work item
  proposal, scope approval and technical committee formation with balanced interest categories,
  draft development with subcommittee ballots, comment resolution and negative vote adjudication,
  consensus body voting thresholds with mandatory consideration of all negatives before
  advancement, public review periods with comment disposition documentation, appeals process for
  procedural violations, intellectual property policy including patent disclosure and licensing
  commitments, standard publication, periodic review and withdrawal or reaffirmation cycles,
  interpretation requests and errata issuance

domain_name: standards-development-consensus
api_prefix: /sdo

complexity_profile:
  primary_archetype: multi_party_negotiation
  secondary_archetype: compliance_audit
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers

  entity_topology: flat
  # Twelve peer entities linked by explicit foreign keys. No entity is nested inside another in
  # any URL path except the two composition creates (`/committees/{id}/memberships`,
  # `/work-items/{id}/drafts`); every read and every action addresses its own flat collection.

  state_machine_shape: cyclic
  # Draft cycles DRAFTING -> SUBCOMMITTEE_BALLOT -> COMMENT_RESOLUTION -> DRAFTING and
  # CONSENSUS_BALLOT -> COMMENT_RESOLUTION; WorkItem cycles PUBLISHED -> UNDER_PERIODIC_REVIEW ->
  # REAFFIRMED -> UNDER_PERIODIC_REVIEW and CONSENSUS_APPROVED -> IN_DEVELOPMENT on appeal.
  # WorkItem and Vote additionally carry two independent state dimensions each.

  relationship_patterns:
    - one_to_many          # WorkItem -> Draft, Ballot -> Vote, PublicReview -> Comment
    - many_to_many         # CommitteeMembership junctions Participant <-> TechnicalCommittee
    - self_referential     # Draft.prior_draft_id -> Draft.id, Ballot.predecessor_ballot_id -> Ballot.id
    - polymorphic          # Comment.source_type selects between Comment.ballot_id and Comment.public_review_id
    - cross_aggregate      # Ballot.committee_id crosses from the draft aggregate into the committee aggregate

  role_model: segregation_of_duties
  # The chair who adjudicates a negative must not be the voter who cast it; the chair who approves
  # a comment disposition must not have commented in that public review; appeals are decided only
  # by an opaque AppealsBoard operator that can never hold a committee seat.

  consistency_model: immediate

  difficulty_level: expert_plus
  # 12 entities / 51 endpoints / 59 error codes / 12 calculations (3 with divergent variants) /
  # 12 state machine blocks over 10 entities (Vote and WorkItem each carry two independent state
  # dimensions; Draft and Comment are cyclic; Appeal, PublicReview and MaintenanceItem branch).

# =============================================================================
# §1.0 Response Envelope (FIXED — verbatim)
# =============================================================================

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================

entities:

  - name: Participant
    parent: null
    common_fields: true
    fields:
      - name: full_name
        type: string
        source: input
        description: "Natural person acting in the standards process."
        constraints: "1..120 chars, non-blank"
      - name: organization
        type: string
        source: input
        description: "Employer or represented body, free text."
        constraints: "1..160 chars, non-blank"
      - name: interest_category
        type: enum
        source: input
        description: "Interest category used for committee balance arithmetic."
        constraints: "PRODUCER | USER | GENERAL_INTEREST | REGULATORY | ACADEMIC"
      - name: employer_affiliation_code
        type: string
        source: input
        default: null
        description: "Affiliation group code; two participants sharing a non-null code may not hold ACTIVE voting seats on the same committee."
        constraints: "null or 1..32 chars"

  - name: TechnicalCommittee
    parent: null
    common_fields: true
    fields:
      - name: designation
        type: string
        source: input
        description: "Committee designation such as TC-14."
        constraints: "1..32 chars, non-blank"
      - name: scope_text
        type: string
        source: input
        description: "Committee scope statement."
        constraints: "1..600 chars, non-blank"
      - name: chair_participant_id
        type: string
        source: input
        description: "FK -> Participant.id; presiding chair. Must hold an ACTIVE voting CommitteeMembership on this committee before activation."
      - name: max_concurrent_ballots
        type: integer
        source: input
        default: 2
        description: "Maximum number of OPEN ballots whose [opens_at, closes_at) windows may intersect on this committee."
        constraints: ">= 1"
      - name: status
        type: enum
        source: system
        default: FORMING
        description: "Committee lifecycle state."
        constraints: "FORMING | ACTIVE | SUSPENDED"
      - name: balance_status
        type: enum
        source: computed
        default: UNBALANCED
        description: "Balance verdict under the voting_basis variant of committee_balance_evaluation."
        constraints: "UNBALANCED | PROVISIONAL | BALANCED"
      - name: roster_balance_status
        type: enum
        source: computed
        default: UNBALANCED
        description: "Balance verdict under the roster_basis variant of committee_balance_evaluation; consulted only by appeal adjudication."
        constraints: "UNBALANCED | PROVISIONAL | BALANCED"
      - name: active_member_count
        type: integer
        source: computed
        default: 0
        description: "COUNT(CommitteeMembership WHERE committee_id = this AND status = 'ACTIVE' AND voting_rights = true)."
      - name: roster_member_count
        type: integer
        source: computed
        default: 0
        description: "COUNT(CommitteeMembership WHERE committee_id = this AND status IN {ACTIVE, SUSPENDED} AND voting_rights = true)."
      - name: dominance_pct
        type: number
        source: computed
        default: 0.0
        description: "Largest interest-category share over ACTIVE voting members, 1 decimal, round_half_up."
      - name: roster_dominance_pct
        type: number
        source: computed
        default: 0.0
        description: "Largest interest-category share over the {ACTIVE, SUSPENDED} voting roster, 1 decimal, round_half_up."
      - name: distinct_category_count
        type: integer
        source: computed
        default: 0
        description: "Number of distinct interest_category values among ACTIVE voting members."
      - name: category_counts
        type: object
        source: computed
        default: {}
        description: "Map interest_category -> count over ACTIVE voting members; keys with count 0 are omitted."
      - name: open_ballot_count
        type: integer
        source: computed
        default: 0
        description: "COUNT(Ballot WHERE committee_id = this AND status = 'OPEN')."

  - name: CommitteeMembership
    parent: null
    common_fields: true
    fields:
      - name: committee_id
        type: string
        source: input
        description: "FK -> TechnicalCommittee.id; supplied by the path segment of the appointment endpoint."
      - name: participant_id
        type: string
        source: input
        description: "FK -> Participant.id; the appointed participant."
      - name: interest_category
        type: enum
        source: system
        description: "Snapshot of Participant.interest_category at appointment; balance arithmetic reads this snapshot, never the live participant row."
        constraints: "PRODUCER | USER | GENERAL_INTEREST | REGULATORY | ACADEMIC"
      - name: employer_affiliation_code
        type: string
        source: system
        default: null
        description: "Snapshot of Participant.employer_affiliation_code at appointment."
      - name: voting_rights
        type: boolean
        source: input
        default: true
        description: "false seats are observers: excluded from every ballot's eligible set and from both balance variants."
      - name: status
        type: enum
        source: system
        default: ACTIVE
        description: "Seat lifecycle state."
        constraints: "ACTIVE | SUSPENDED | WITHDRAWN"
      - name: appointed_at
        type: datetime
        source: system
        description: "Logical clock value at appointment."
      - name: missed_ballot_streak
        type: integer
        source: computed
        default: 0
        description: "Consecutive EVALUATED ballots on which this seat was eligible and returned no vote; reset to 0 by any CAST vote."

  - name: WorkItem
    parent: null
    common_fields: true
    fields:
      - name: title
        type: string
        source: input
        description: "Proposed standard title."
        constraints: "1..200 chars, non-blank"
      - name: scope_text
        type: string
        source: input
        description: "Proposed scope statement."
        constraints: "1..1200 chars, non-blank"
      - name: work_item_type
        type: enum
        source: input
        description: "Nature of the proposed work."
        constraints: "NEW_STANDARD | REVISION | AMENDMENT"
      - name: proposer_participant_id
        type: string
        source: input
        description: "FK -> Participant.id; the proposing participant."
      - name: target_completion_date
        type: string
        source: input
        description: "Target completion calendar date."
        constraints: "ISO 8601 calendar date YYYY-MM-DD"
      - name: sponsoring_committee_id
        type: string
        source: system
        default: null
        description: "FK -> TechnicalCommittee.id; assigned at scope approval, null before."
      - name: designation
        type: string
        source: system
        default: null
        description: "Standard designation assigned at scope approval."
      - name: progress_status
        type: enum
        source: system
        default: PROPOSED
        description: "Development dimension of the work item state; evolves independently of ip_status."
        constraints: "PROPOSED | SCOPE_APPROVED | SCOPE_REJECTED | IN_DEVELOPMENT | CONSENSUS_APPROVED | PUBLISHED | UNDER_PERIODIC_REVIEW | REAFFIRMED | WITHDRAWN | SUSPENDED"
      - name: ip_status
        type: enum
        source: system
        default: IP_PENDING
        description: "Intellectual-property dimension of the work item state; evolves independently of progress_status."
        constraints: "IP_PENDING | IP_DISCLOSED | IP_BLOCKED | IP_CLEARED"
      - name: consensus_gate
        type: enum
        source: computed
        default: OPEN
        description: "Derived procedural gate; BLOCKED suspends advancement of this work item. See calculations.consensus_gate_evaluation."
        constraints: "OPEN | BLOCKED"
      - name: unresolved_negative_count
        type: integer
        source: computed
        default: 0
        description: "COUNT(Vote v JOIN Ballot b ON v.ballot_id = b.id WHERE b.draft_id IN drafts(this) AND v.adjudication_status = 'PENDING')."
      - name: scope_approved_at
        type: datetime
        source: system
        default: null
        description: "Logical clock value when scope was approved."
      - name: edition
        type: string
        source: system
        default: null
        description: "Edition label recorded at publication."
      - name: published_at
        type: datetime
        source: system
        default: null
        description: "Logical clock value at publication."
      - name: periodic_review_due_date
        type: string
        source: system
        default: null
        description: "Calendar date the next periodic review is due; published_at date + PERIODIC_REVIEW_YEARS, reset on reaffirmation."
        constraints: "ISO 8601 calendar date YYYY-MM-DD or null"
      - name: last_periodic_action_at
        type: datetime
        source: system
        default: null
        description: "Logical clock value of the most recent periodic-review action."
      - name: errata_count
        type: integer
        source: computed
        default: 0
        description: "COUNT(MaintenanceItem WHERE work_item_id = this AND status = 'ERRATUM_ISSUED')."
      - name: interpretation_count
        type: integer
        source: computed
        default: 0
        description: "COUNT(MaintenanceItem WHERE work_item_id = this AND status = 'INTERPRETATION_ISSUED')."

  - name: Draft
    parent: null
    common_fields: true
    fields:
      - name: work_item_id
        type: string
        source: input
        description: "FK -> WorkItem.id; supplied by the path segment of the draft-creation endpoint."
      - name: prior_draft_id
        type: string
        source: input
        default: null
        description: "FK -> Draft.id; the revision this draft supersedes, null for revision 1."
      - name: revision_number
        type: integer
        source: system
        default: 1
        description: "1 when prior_draft_id is null, otherwise prior.revision_number + 1."
      - name: total_clause_count
        type: integer
        source: input
        description: "Total clauses in this revision."
        constraints: ">= 1"
      - name: changed_clause_count
        type: integer
        source: input
        default: 0
        description: "Clauses changed relative to prior_draft_id."
        constraints: ">= 0 and <= total_clause_count"
      - name: substantive_change_ratio
        type: number
        source: computed
        default: 0.0
        description: "changed_clause_count / total_clause_count, round_half_up to 4 decimals."
      - name: status
        type: enum
        source: system
        default: DRAFTING
        description: "Draft lifecycle state; cycles back to DRAFTING after persuasive negatives or an upheld appeal."
        constraints: "DRAFTING | SUBCOMMITTEE_BALLOT | COMMENT_RESOLUTION | PUBLIC_REVIEW_READY | PUBLIC_REVIEW | PUBLIC_REVIEW_CLOSED | CONSENSUS_BALLOT | APPROVED | ABANDONED"
      - name: unresolved_negative_count
        type: integer
        source: computed
        default: 0
        description: "COUNT(Vote WHERE ballot_id IN ballots(this) AND adjudication_status = 'PENDING')."
      - name: carryover_unresolved_negative_count
        type: integer
        source: system
        default: 0
        description: >-
          Negatives CAST on a VACATED ballot, inherited when an upheld appeal returns this draft to
          development. Any value > 0 raises the next ballot's required_approval_pct by
          ESCALATION_PCT (capped at CEILING_PCT). Reset to 0 only when a successor draft is created
          without a carryover.
      - name: recirculation_required
        type: boolean
        source: system
        default: false
        description: "Set true when a negative on this draft was adjudicated PERSUASIVE; cleared when a successor revision is created."
      - name: ballot_round_count
        type: integer
        source: computed
        default: 0
        description: "COUNT(Ballot WHERE draft_id = this)."
      - name: summary
        type: string
        source: input
        default: null
        description: "Editor summary of the revision."

  - name: Ballot
    parent: null
    common_fields: true
    fields:
      - name: draft_id
        type: string
        source: input
        description: "FK -> Draft.id; the revision being balloted."
      - name: committee_id
        type: string
        source: system
        description: "FK -> TechnicalCommittee.id; copied from WorkItem.sponsoring_committee_id of the draft's work item at creation."
      - name: predecessor_ballot_id
        type: string
        source: input
        default: null
        description: "FK -> Ballot.id; the ballot this one re-runs, null for a first-round ballot."
      - name: ballot_kind
        type: enum
        source: input
        description: "Kind requested by the chair."
        constraints: "SUBCOMMITTEE | CONSENSUS_BODY | RECIRCULATION | REAFFIRMATION"
      - name: effective_ballot_kind
        type: enum
        source: computed
        description: "Kind actually applied after substantive_change_recirculation step 2; every threshold reads this field, never ballot_kind."
        constraints: "SUBCOMMITTEE | CONSENSUS_BODY | RECIRCULATION | REAFFIRMATION"
      - name: status
        type: enum
        source: system
        default: OPEN
        description: "Ballot lifecycle state."
        constraints: "OPEN | CLOSED | EVALUATED | VACATED"
      - name: opens_at
        type: datetime
        source: input
        description: "Inclusive start of the voting window."
      - name: closes_at
        type: datetime
        source: input
        description: "Exclusive end of the voting window."
      - name: eligible_voter_count
        type: integer
        source: system
        description: "Size of the eligible voter set frozen at creation by substantive_change_recirculation step 3."
      - name: affirmative_count
        type: integer
        source: computed
        default: 0
        description: "COUNT(Vote WHERE ballot_id = this AND status = 'CAST' AND position = 'AFFIRMATIVE')."
      - name: negative_count
        type: integer
        source: computed
        default: 0
        description: "COUNT(Vote WHERE ballot_id = this AND status = 'CAST' AND position = 'NEGATIVE')."
      - name: abstain_count
        type: integer
        source: computed
        default: 0
        description: "COUNT(Vote WHERE ballot_id = this AND status = 'CAST' AND position = 'ABSTAIN')."
      - name: returned_count
        type: integer
        source: computed
        default: 0
        description: "affirmative_count + negative_count + abstain_count."
      - name: not_returned_count
        type: integer
        source: computed
        description: "eligible_voter_count - returned_count."
      - name: return_rate_pct
        type: number
        source: computed
        default: 0.0
        description: "returned_count / eligible_voter_count * 100, round_half_up to 1 decimal."
      - name: provisional_approval_pct
        type: number
        source: computed
        default: null
        description: "Approval percentage frozen at close from votes as cast (ballot_consensus_evaluation variant provisional_at_close); null while OPEN."
      - name: final_approval_pct
        type: number
        source: computed
        default: null
        description: "Approval percentage after every negative on this ballot has left adjudication_status PENDING (variant final_after_adjudication); null until then."
      - name: required_return_rate_pct
        type: number
        source: computed
        description: "Quorum threshold selected by effective_ballot_kind."
      - name: required_approval_pct
        type: number
        source: computed
        description: "Approval threshold selected by effective_ballot_kind plus carryover escalation, capped at CEILING_PCT."
      - name: consensus_result
        type: enum
        source: computed
        default: PENDING
        description: "Verdict written at close and refreshed when the last PENDING negative is adjudicated."
        constraints: "PENDING | APPROVED | APPROVED_PENDING_NEGATIVES | FAILED_THRESHOLD | FAILED_QUORUM"
      - name: pending_negative_count
        type: integer
        source: computed
        default: 0
        description: "COUNT(Vote WHERE ballot_id = this AND adjudication_status = 'PENDING')."
      - name: hold_reason
        type: enum
        source: system
        default: NONE
        description: "Procedural hold placed on the ballot by a cascade; a held ballot cannot be closed."
        constraints: "NONE | COMMITTEE_UNBALANCED | APPEAL_PENDING"
      - name: closed_at
        type: datetime
        source: system
        default: null
        description: "Logical clock value at close."

  - name: Vote
    parent: null
    common_fields: true
    fields:
      - name: ballot_id
        type: string
        source: input
        description: "FK -> Ballot.id; supplied by the path segment of the vote-casting endpoint."
      - name: membership_id
        type: string
        source: input
        description: "FK -> CommitteeMembership.id; the seat casting the vote."
      - name: position
        type: enum
        source: input
        description: "Ballot position; mutable while the ballot is OPEN and rewritten to AFFIRMATIVE when a negative is adjudicated PERSUASIVE."
        constraints: "AFFIRMATIVE | NEGATIVE | ABSTAIN"
      - name: status
        type: enum
        source: system
        default: CAST
        description: "Return dimension of the vote state; WITHDRAWN votes leave every tally and return the seat to not_returned."
        constraints: "CAST | WITHDRAWN"
      - name: adjudication_status
        type: enum
        source: system
        default: NOT_APPLICABLE
        description: "Negative-adjudication dimension of the vote state; evolves independently of status."
        constraints: "NOT_APPLICABLE | PENDING | PERSUASIVE | NON_PERSUASIVE | WITHDRAWN_BY_VOTER"
      - name: adjudicated_by_participant_id
        type: string
        source: system
        default: null
        description: "FK -> Participant.id; the acting participant recorded on adjudication."
      - name: adjudication_rationale
        type: string
        source: system
        default: null
        description: "Rationale text supplied with the adjudication."
      - name: cast_at
        type: datetime
        source: system
        description: "Logical clock value when the vote was first cast."
      - name: position_change_count
        type: integer
        source: computed
        default: 0
        description: "Number of accepted PATCH position rewrites while the ballot was OPEN."

  - name: Comment
    parent: null
    common_fields: true
    fields:
      - name: draft_id
        type: string
        source: input
        description: "FK -> Draft.id; the revision commented on."
      - name: ballot_id
        type: string
        source: input
        default: null
        description: "FK -> Ballot.id; set by the server only on the comment auto-created from a NEGATIVE vote (source_type = BALLOT_NEGATIVE), null otherwise."
      - name: public_review_id
        type: string
        source: input
        default: null
        description: "FK -> PublicReview.id; set when source_type = PUBLIC_REVIEW, null otherwise."
      - name: source_vote_id
        type: string
        source: system
        default: null
        description: "FK -> Vote.id; set only on the comment auto-created from a NEGATIVE vote."
      - name: submitter_participant_id
        type: string
        source: input
        description: "FK -> Participant.id; the commenter."
      - name: source_type
        type: enum
        source: input
        description: >-
          Origin of the comment. Clients may submit PUBLIC_REVIEW (requires public_review_id) or
          COMMITTEE (requires draft_id); BALLOT_NEGATIVE is reserved for the server-created comment
          behind a NEGATIVE vote and is rejected as client input with ERR_INVALID_REQUEST.
        constraints: "BALLOT_NEGATIVE | PUBLIC_REVIEW | COMMITTEE"
      - name: comment_type
        type: enum
        source: input
        description: "Comment class; GENERAL and TECHNICAL are substantive, EDITORIAL is not."
        constraints: "GENERAL | TECHNICAL | EDITORIAL"
      - name: clause_reference
        type: string
        source: input
        description: "Clause the comment addresses."
        constraints: "1..40 chars, non-blank"
      - name: comment_text
        type: string
        source: input
        description: "Comment body."
        constraints: "1..2000 chars, non-blank"
      - name: status
        type: enum
        source: system
        default: OPEN
        description: "Disposition state of the comment."
        constraints: "OPEN | ACCEPTED | ACCEPTED_WITH_MODIFICATION | REJECTED"
      - name: is_substantive
        type: boolean
        source: computed
        description: "comment_type IN {GENERAL, TECHNICAL}."
      - name: disposition_rationale
        type: string
        source: system
        default: null
        description: "Rationale recorded with the latest disposition."

  - name: PublicReview
    parent: null
    common_fields: true
    fields:
      - name: draft_id
        type: string
        source: input
        description: "FK -> Draft.id; the revision offered for public review."
      - name: start_date
        type: string
        source: input
        description: "Inclusive first day of the review period."
        constraints: "ISO 8601 calendar date YYYY-MM-DD"
      - name: end_date
        type: string
        source: input
        description: "Inclusive last day of the review period."
        constraints: "ISO 8601 calendar date YYYY-MM-DD, >= start_date"
      - name: duration_days
        type: integer
        source: computed
        description: "(end_date - start_date).days + 1 — inclusive day count on both endpoints."
      - name: status
        type: enum
        source: system
        description: "Review lifecycle state; OPEN at creation when start_date <= current_utc date, otherwise SCHEDULED."
        constraints: "SCHEDULED | OPEN | CLOSED | DISPOSITION_DRAFTED | DISPOSITION_APPROVED | CANCELLED"
      - name: announced_at
        type: datetime
        source: system
        description: "Logical clock value when the review was announced."
      - name: closed_at
        type: datetime
        source: system
        default: null
        description: "Logical clock value at close."
      - name: comment_count
        type: integer
        source: computed
        default: 0
        description: "COUNT(Comment WHERE public_review_id = this)."
      - name: disposed_count
        type: integer
        source: computed
        default: 0
        description: "COUNT(Comment WHERE public_review_id = this AND status IN {ACCEPTED, ACCEPTED_WITH_MODIFICATION, REJECTED})."
      - name: unresolved_comment_count
        type: integer
        source: computed
        default: 0
        description: "comment_count - disposed_count."
      - name: disposition_completeness_pct
        type: number
        source: computed
        default: 100.0
        description: "100.0 when comment_count = 0, else disposed_count / comment_count * 100 round_half_up to 1 decimal."
      - name: disposition_approved_by_participant_id
        type: string
        source: system
        default: null
        description: "FK -> Participant.id; the chair who signed the comment disposition."
      - name: disposition_approved_at
        type: datetime
        source: system
        default: null
        description: "Logical clock value when the disposition was approved."

  - name: PatentDisclosure
    parent: null
    common_fields: true
    fields:
      - name: work_item_id
        type: string
        source: input
        description: "FK -> WorkItem.id; the work item the patent reads on."
      - name: disclosing_participant_id
        type: string
        source: input
        description: "FK -> Participant.id; the disclosing party."
      - name: patent_number
        type: string
        source: input
        description: "Patent or application number."
        constraints: "1..40 chars, non-blank"
      - name: essentiality
        type: enum
        source: input
        description: "Claimed essentiality of the patent to the standard."
        constraints: "ESSENTIAL | POTENTIALLY_ESSENTIAL | NON_ESSENTIAL"
      - name: status
        type: enum
        source: system
        default: DISCLOSED_NO_COMMITMENT
        description: "Licensing-commitment state of the disclosure."
        constraints: "DISCLOSED_NO_COMMITMENT | RAND_COMMITTED | RAND_ZERO_COMMITTED | REFUSED | WITHDRAWN"
      - name: commitment_letter_ref
        type: string
        source: system
        default: null
        description: "Reference of the filed licensing letter."
      - name: disclosed_at
        type: datetime
        source: system
        description: "Logical clock value at disclosure."
      - name: committed_at
        type: datetime
        source: system
        default: null
        description: "Logical clock value when a commitment was recorded."
      - name: blocks_publication
        type: boolean
        source: computed
        description: "essentiality IN {ESSENTIAL, POTENTIALLY_ESSENTIAL} AND status IN {DISCLOSED_NO_COMMITMENT, REFUSED}."

  - name: Appeal
    parent: null
    common_fields: true
    fields:
      - name: work_item_id
        type: string
        source: input
        description: "FK -> WorkItem.id; the work item whose procedure is challenged."
      - name: appellant_participant_id
        type: string
        source: input
        description: "FK -> Participant.id; the appellant."
      - name: cited_ballot_id
        type: string
        source: input
        default: null
        description: "FK -> Ballot.id; the ballot whose procedure is challenged, null when the appeal cites no ballot."
      - name: grounds
        type: enum
        source: input
        description: "Procedural ground asserted."
        constraints: "BALANCE_VIOLATION | NEGATIVE_NOT_CONSIDERED | PUBLIC_REVIEW_DEFECT | IP_DISCLOSURE_DEFECT | VOTING_PROCEDURE_DEFECT"
      - name: statement
        type: string
        source: input
        description: "Appellant statement."
        constraints: "1..2000 chars, non-blank"
      - name: status
        type: enum
        source: system
        default: FILED
        description: "Appeal lifecycle state."
        constraints: "FILED | ACCEPTED_FOR_REVIEW | UPHELD | DENIED"
      - name: remedy
        type: enum
        source: system
        default: NONE
        description: "Remedy ordered when the appeal is upheld."
        constraints: "NONE | VACATE_BALLOT | REMAND_TO_COMMITTEE | SUSPEND_STANDARD"
      - name: filed_at
        type: datetime
        source: system
        description: "Logical clock value at filing."
      - name: filing_deadline_at
        type: datetime
        source: computed
        description: "cited_ballot.closed_at + APPEAL_WINDOW_DAYS when a ballot is cited, else work_item.published_at + APPEAL_WINDOW_DAYS."
      - name: decided_at
        type: datetime
        source: system
        default: null
        description: "Logical clock value when the appeal was upheld or denied."
      - name: decision_rationale
        type: string
        source: system
        default: null
        description: "Rationale recorded by the appeals board."

  - name: MaintenanceItem
    parent: null
    common_fields: true
    fields:
      - name: work_item_id
        type: string
        source: input
        description: "FK -> WorkItem.id; the published standard the request concerns."
      - name: requester_participant_id
        type: string
        source: input
        description: "FK -> Participant.id; the requester."
      - name: item_kind
        type: enum
        source: input
        description: "Kind of maintenance request."
        constraints: "INTERPRETATION_REQUEST | ERRATUM_REPORT"
      - name: question_text
        type: string
        source: input
        description: "The question or defect report."
        constraints: "1..2000 chars, non-blank"
      - name: clause_reference
        type: string
        source: input
        default: null
        description: "Clause the request concerns."
      - name: status
        type: enum
        source: system
        default: RECEIVED
        description: "Maintenance lifecycle state; the three resolved states carry different side-effect sets."
        constraints: "RECEIVED | INTERPRETATION_ISSUED | ERRATUM_ISSUED | DECLINED"
      - name: response_text
        type: string
        source: system
        default: null
        description: "Committee response recorded at resolution."
      - name: erratum_clause_reference
        type: string
        source: system
        default: null
        description: "Clause corrected by the erratum; set only when status = ERRATUM_ISSUED."
      - name: received_at
        type: datetime
        source: system
        description: "Logical clock value when the request was received."
      - name: resolved_at
        type: datetime
        source: system
        default: null
        description: "Logical clock value at resolution."

# =============================================================================
# §1.2 State Machine Table
# =============================================================================

state_machines:

  - entity: TechnicalCommittee
    state_field: status
    initial_state: FORMING
    terminal_states: []
    shape: cyclic
    transitions:
      - from: FORMING
        to: ACTIVE
        trigger: "POST /sdo/committees/{committeeId}/activate"
        actor: StandardsStaff
        preconditions:
          - "committee.status == FORMING"
          - "chair_participant_id has a CommitteeMembership on this committee with status == ACTIVE AND voting_rights == true (else ERR_CHAIR_NOT_MEMBER)"
          - "committee_balance_evaluation voting_basis verdict == BALANCED (else ERR_COMMITTEE_NOT_BALANCED)"
        side_effects:
          - "recompute committee_balance_evaluation (both variants) and persist balance_status, roster_balance_status, dominance_pct, roster_dominance_pct, distinct_category_count, category_counts, active_member_count, roster_member_count"
          - "increments TechnicalCommittee.version by 1"
      - from: ACTIVE
        to: SUSPENDED
        trigger: "system — cascade hop 2 of any CommitteeMembership status change that drops balance_status below BALANCED"
        actor: system
        preconditions:
          - "committee.status == ACTIVE"
          - "recomputed balance_status != BALANCED"
        side_effects:
          - "cascade hop 3: every WorkItem with sponsoring_committee_id == this committee and progress_status IN {IN_DEVELOPMENT, CONSENSUS_APPROVED} recomputes consensus_gate to BLOCKED"
          - "cascade hop 4: because those work items are now gated, every Ballot with committee_id == this committee and status == OPEN sets hold_reason = COMMITTEE_UNBALANCED"
          - "increments TechnicalCommittee.version by 1"
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /sdo/committees/{committeeId}/activate"
        actor: StandardsStaff
        preconditions:
          - "committee.status == SUSPENDED"
          - "chair_participant_id holds an ACTIVE voting membership (else ERR_CHAIR_NOT_MEMBER)"
          - "recomputed balance_status == BALANCED (else ERR_COMMITTEE_NOT_BALANCED)"
        side_effects:
          - "every Ballot with committee_id == this committee and hold_reason == COMMITTEE_UNBALANCED resets hold_reason = NONE"
          - "every WorkItem sponsored by this committee recomputes consensus_gate"
          - "increments TechnicalCommittee.version by 1"
        note: "Re-activation is the loop edge that makes this machine cyclic; a committee may be suspended and re-activated any number of times."

  - entity: CommitteeMembership
    state_field: status
    initial_state: ACTIVE
    terminal_states: [WITHDRAWN]
    shape: branching_with_revert
    transitions:
      - from: ACTIVE
        to: SUSPENDED
        trigger: "PATCH /sdo/memberships/{membershipId} with status = SUSPENDED"
        actor: StandardsStaff
        preconditions:
          - "membership.status == ACTIVE"
        side_effects:
          - "cascade hop 1->2: committee recomputes committee_balance_evaluation on both variants; a drop below BALANCED drives TechnicalCommittee.ACTIVE_to_SUSPENDED"
          - "increments CommitteeMembership.version by 1 and TechnicalCommittee.version by 1"
      - from: ACTIVE
        to: SUSPENDED
        trigger: "system — missed_ballot_streak reaches MISSED_BALLOT_SUSPENSION_STREAK at Ballot.CLOSED_to_EVALUATED"
        actor: system
        preconditions:
          - "membership was in the closing ballot's eligible set and cast no vote with status == CAST"
          - "recomputed missed_ballot_streak >= MISSED_BALLOT_SUSPENSION_STREAK"
        side_effects:
          - "committee recomputes both balance variants; a drop below BALANCED drives TechnicalCommittee.ACTIVE_to_SUSPENDED"
          - "increments CommitteeMembership.version by 1"
        note: "The suspension is computed from the closing ballot's raw tallies and NEVER alters that ballot's eligible_voter_count — see calculations.ballot_consensus_evaluation evaluation-order note."
      - from: SUSPENDED
        to: ACTIVE
        trigger: "PATCH /sdo/memberships/{membershipId} with status = ACTIVE"
        actor: StandardsStaff
        preconditions:
          - "membership.status == SUSPENDED"
        side_effects:
          - "missed_ballot_streak reset to 0"
          - "committee recomputes both balance variants"
          - "increments CommitteeMembership.version by 1 and TechnicalCommittee.version by 1"
      - from: ACTIVE
        to: WITHDRAWN
        trigger: "PATCH /sdo/memberships/{membershipId} with status = WITHDRAWN"
        actor: StandardsStaff
        preconditions:
          - "membership.status == ACTIVE"
        side_effects:
          - "cascade hop 1: committee.active_member_count decremented and category_counts rebuilt"
          - "cascade hop 2: committee recomputes balance_status; on a drop below BALANCED the committee takes TechnicalCommittee.ACTIVE_to_SUSPENDED"
          - "votes already CAST by this seat on OPEN ballots remain CAST and keep counting (a withdrawal never rewrites a cast ballot)"
          - "increments CommitteeMembership.version by 1 and TechnicalCommittee.version by 1"
      - from: SUSPENDED
        to: WITHDRAWN
        trigger: "PATCH /sdo/memberships/{membershipId} with status = WITHDRAWN"
        actor: StandardsStaff
        preconditions:
          - "membership.status == SUSPENDED"
        side_effects:
          - "committee recomputes both balance variants (roster_member_count drops as well)"
          - "increments CommitteeMembership.version by 1 and TechnicalCommittee.version by 1"

  - entity: WorkItem
    state_field: progress_status
    initial_state: PROPOSED
    terminal_states: [SCOPE_REJECTED, WITHDRAWN]
    shape: cyclic
    note: "Dimension 1 of 2 on WorkItem. Evolves independently of ip_status; publication is the single point where the two dimensions are read together."
    transitions:
      - from: PROPOSED
        to: SCOPE_APPROVED
        trigger: "POST /sdo/work-items/{workItemId}/approve-scope with decision = APPROVE"
        actor: StandardsStaff
        preconditions:
          - "work_item.progress_status == PROPOSED"
          - "sponsoring_committee_id supplied and that committee.status == ACTIVE (else ERR_COMMITTEE_NOT_ACTIVE)"
        side_effects:
          - "sponsoring_committee_id, designation, scope_approved_at = current_utc persisted"
          - "recompute consensus_gate"
          - "increments WorkItem.version by 1"
      - from: PROPOSED
        to: SCOPE_REJECTED
        trigger: "POST /sdo/work-items/{workItemId}/approve-scope with decision = REJECT"
        actor: StandardsStaff
        preconditions:
          - "work_item.progress_status == PROPOSED"
        side_effects:
          - "sponsoring_committee_id stays null; designation stays null"
          - "increments WorkItem.version by 1"
      - from: SCOPE_APPROVED
        to: IN_DEVELOPMENT
        trigger: "system — first Draft created by POST /sdo/work-items/{workItemId}/drafts"
        actor: system
        preconditions:
          - "work_item.progress_status == SCOPE_APPROVED"
        side_effects:
          - "recompute consensus_gate"
          - "increments WorkItem.version by 1"
      - from: IN_DEVELOPMENT
        to: CONSENSUS_APPROVED
        trigger: "system — Draft.CONSENSUS_BALLOT_to_APPROVED or Draft.COMMENT_RESOLUTION_to_APPROVED, i.e. cascade hop 4 of POST /sdo/ballots/{ballotId}/close or of the POST /sdo/votes/{voteId}/adjudicate that clears the last PENDING negative on a CONSENSUS_BODY / RECIRCULATION ballot"
        actor: system
        preconditions:
          - "ballot.consensus_result == APPROVED and ballot.pending_negative_count == 0 (mandatory consideration of all negatives)"
          - "the draft's latest PublicReview.status == DISPOSITION_APPROVED"
          - "work_item.consensus_gate == OPEN"
        side_effects:
          - "draft takes Draft.CONSENSUS_BALLOT_to_APPROVED"
          - "progress_status is written to CONSENSUS_APPROVED FIRST, then patent_clearance_evaluation re-runs and sees call_for_patents_closed == true, taking IP_PENDING_to_IP_CLEARED or IP_DISCLOSED_to_IP_CLEARED unless a blocking disclosure holds ip_status at IP_BLOCKED"
          - "increments WorkItem.version by 1"
      - from: CONSENSUS_APPROVED
        to: IN_DEVELOPMENT
        trigger: "system — cascade hop 4 of Appeal.ACCEPTED_FOR_REVIEW_to_UPHELD with remedy VACATE_BALLOT or REMAND_TO_COMMITTEE"
        actor: system
        preconditions:
          - "work_item.progress_status == CONSENSUS_APPROVED"
        side_effects:
          - "recompute consensus_gate"
          - "increments WorkItem.version by 1"
        note: "Loop edge: an upheld appeal returns an approved work item to development, so the consensus cycle can run again."
      - from: CONSENSUS_APPROVED
        to: PUBLISHED
        trigger: "POST /sdo/work-items/{workItemId}/publish"
        actor: StandardsStaff
        preconditions:
          - "work_item.progress_status == CONSENSUS_APPROVED"
          - "work_item.consensus_gate == OPEN (else ERR_CONSENSUS_GATE_BLOCKED)"
          - "work_item.ip_status == IP_CLEARED (else ERR_IP_NOT_CLEARED)"
          - "the latest PublicReview on the APPROVED draft has status == DISPOSITION_APPROVED (else ERR_PUBLIC_REVIEW_NOT_APPROVED)"
        side_effects:
          - "edition persisted; published_at = current_utc"
          - "periodic_review_due_date = date(published_at) + PERIODIC_REVIEW_YEARS years"
          - "increments WorkItem.version by 1"
      - from: PUBLISHED
        to: UNDER_PERIODIC_REVIEW
        trigger: "POST /sdo/work-items/{workItemId}/periodic-review with action = OPEN_REVIEW"
        actor: StandardsStaff
        preconditions:
          - "work_item.progress_status IN {PUBLISHED, REAFFIRMED}"
          - "current_utc >= periodic_review_due_date 00:00:00Z minus REVIEW_LEAD_DAYS (else ERR_PERIODIC_REVIEW_NOT_DUE)"
        side_effects:
          - "last_periodic_action_at = current_utc"
          - "increments WorkItem.version by 1"
      - from: REAFFIRMED
        to: UNDER_PERIODIC_REVIEW
        trigger: "POST /sdo/work-items/{workItemId}/periodic-review with action = OPEN_REVIEW"
        actor: StandardsStaff
        preconditions:
          - "work_item.progress_status == REAFFIRMED"
          - "current_utc >= periodic_review_due_date 00:00:00Z minus REVIEW_LEAD_DAYS"
        side_effects:
          - "last_periodic_action_at = current_utc"
          - "increments WorkItem.version by 1"
        note: "Loop edge: reaffirmation restarts the five-year review cycle indefinitely."
      - from: UNDER_PERIODIC_REVIEW
        to: REAFFIRMED
        trigger: "POST /sdo/work-items/{workItemId}/periodic-review with action = REAFFIRM"
        actor: StandardsStaff
        preconditions:
          - "work_item.progress_status == UNDER_PERIODIC_REVIEW"
          - "the work item's latest Draft (the one with the highest revision_number) carries at least one Ballot with effective_ballot_kind == REAFFIRMATION, status == EVALUATED and consensus_result == APPROVED (else ERR_REAFFIRMATION_BALLOT_REQUIRED). No reaffirmation ballot id is passed in: the check is a lookup over the work item's own ballots, and a ballot left at APPROVED_PENDING_NEGATIVES does not satisfy it."
          - "current_utc <= periodic_review_due_date 00:00:00Z plus REAFFIRMATION_GRACE_DAYS (else ERR_REAFFIRMATION_WINDOW_EXPIRED)"
        side_effects:
          - "periodic_review_due_date = date(current_utc) + PERIODIC_REVIEW_YEARS years"
          - "last_periodic_action_at = current_utc"
          - "increments WorkItem.version by 1"
      - from: UNDER_PERIODIC_REVIEW
        to: WITHDRAWN
        trigger: "POST /sdo/work-items/{workItemId}/periodic-review with action = WITHDRAW"
        actor: StandardsStaff
        preconditions:
          - "work_item.progress_status == UNDER_PERIODIC_REVIEW"
        side_effects:
          - "periodic_review_due_date set to null; last_periodic_action_at = current_utc"
          - "every MaintenanceItem on this work item with status == RECEIVED stays RECEIVED but resolution is refused afterwards by ERR_INVALID_WORK_ITEM_STATE"
          - "increments WorkItem.version by 1"
      - from: PUBLISHED
        to: SUSPENDED
        trigger: "system — Appeal.ACCEPTED_FOR_REVIEW_to_UPHELD with remedy SUSPEND_STANDARD"
        actor: system
        preconditions:
          - "work_item.progress_status IN {PUBLISHED, REAFFIRMED}"
        side_effects:
          - "recompute consensus_gate"
          - "increments WorkItem.version by 1"
      - from: SUSPENDED
        to: WITHDRAWN
        trigger: "POST /sdo/work-items/{workItemId}/periodic-review with action = WITHDRAW"
        actor: StandardsStaff
        preconditions:
          - "work_item.progress_status == SUSPENDED"
        side_effects:
          - "periodic_review_due_date set to null; last_periodic_action_at = current_utc"
          - "increments WorkItem.version by 1"

  - entity: WorkItem
    state_field: ip_status
    initial_state: IP_PENDING
    terminal_states: []
    shape: parallel_dimension
    note: "Dimension 2 of 2 on WorkItem. Driven only by PatentDisclosure events and by consensus-ballot evaluation; a work item can sit in IP_BLOCKED while progress_status advances all the way to CONSENSUS_APPROVED."
    transitions:
      - from: IP_PENDING
        to: IP_DISCLOSED
        trigger: "POST /sdo/patent-disclosures — first disclosure whose blocks_publication is false"
        actor: "CommitteeMember | Proposer | StandardsStaff"
        preconditions:
          - "no existing PatentDisclosure on this work item has blocks_publication == true"
        side_effects:
          - "increments WorkItem.version by 1"
      - from: IP_PENDING
        to: IP_BLOCKED
        trigger: "POST /sdo/patent-disclosures — disclosure with essentiality IN {ESSENTIAL, POTENTIALLY_ESSENTIAL} and no commitment yet"
        actor: "CommitteeMember | Proposer | StandardsStaff"
        preconditions:
          - "the new disclosure's blocks_publication == true"
        side_effects:
          - "increments WorkItem.version by 1"
      - from: IP_DISCLOSED
        to: IP_BLOCKED
        trigger: "POST /sdo/patent-disclosures or POST /sdo/patent-disclosures/{patentDisclosureId}/commitment with commitment = REFUSED"
        actor: "CommitteeMember | Proposer | StandardsStaff"
        preconditions:
          - "patent_clearance_evaluation finds at least one disclosure with blocks_publication == true"
        side_effects:
          - "increments WorkItem.version by 1"
      - from: IP_BLOCKED
        to: IP_DISCLOSED
        trigger: "POST /sdo/patent-disclosures/{patentDisclosureId}/commitment with commitment IN {RAND, RAND_ZERO, WITHDRAW}"
        actor: "CommitteeMember | StandardsStaff"
        preconditions:
          - "after the commitment, no disclosure on this work item has blocks_publication == true"
          - "progress_status NOT IN {CONSENSUS_APPROVED, PUBLISHED, UNDER_PERIODIC_REVIEW, REAFFIRMED} — the call for patents is still open; once it has closed the IP_BLOCKED_to_IP_CLEARED edge is taken instead"
        side_effects:
          - "increments WorkItem.version by 1"
      - from: IP_BLOCKED
        to: IP_CLEARED
        trigger: "POST /sdo/patent-disclosures/{patentDisclosureId}/commitment with commitment IN {RAND, RAND_ZERO, WITHDRAW} on a work item whose call for patents has already closed"
        actor: "CommitteeMember | StandardsStaff"
        preconditions:
          - "after the commitment, no disclosure on this work item has blocks_publication == true"
          - "progress_status IN {CONSENSUS_APPROVED, PUBLISHED, UNDER_PERIODIC_REVIEW, REAFFIRMED}"
        side_effects:
          - "increments WorkItem.version by 1"
        note: "The unblocking of a late essential patent on an already consensus-approved standard clears IP outright rather than dropping back to IP_DISCLOSED, which is what lets publication resume."
      - from: IP_CLEARED
        to: IP_PENDING
        trigger: "system — patent_clearance_evaluation re-runs after an upheld appeal returned the work item to IN_DEVELOPMENT"
        actor: system
        preconditions:
          - "COUNT(PatentDisclosure WHERE work_item_id = this) == 0"
          - "progress_status NOT IN {CONSENSUS_APPROVED, PUBLISHED, UNDER_PERIODIC_REVIEW, REAFFIRMED}"
        side_effects:
          - "increments WorkItem.version by 1"
        note: "Reopening development reopens the call for patents: clearance is not a one-way latch when the consensus that produced it has been vacated."
      - from: IP_PENDING
        to: IP_CLEARED
        trigger: "system — Draft.CONSENSUS_BALLOT_to_APPROVED or Draft.COMMENT_RESOLUTION_to_APPROVED on a CONSENSUS_BODY / RECIRCULATION ballot with consensus_result APPROVED and zero disclosures on the work item"
        actor: system
        preconditions:
          - "COUNT(PatentDisclosure WHERE work_item_id = this) == 0"
        side_effects:
          - "increments WorkItem.version by 1"
        note: "The call for patents closes with the consensus ballot; an empty disclosure set clears IP."
      - from: IP_DISCLOSED
        to: IP_CLEARED
        trigger: "system — Draft.CONSENSUS_BALLOT_to_APPROVED or Draft.COMMENT_RESOLUTION_to_APPROVED on a CONSENSUS_BODY / RECIRCULATION ballot with consensus_result APPROVED"
        actor: system
        preconditions:
          - "every PatentDisclosure on this work item has blocks_publication == false"
        side_effects:
          - "increments WorkItem.version by 1"
      - from: IP_CLEARED
        to: IP_BLOCKED
        trigger: "POST /sdo/patent-disclosures — a late blocking disclosure after consensus approval"
        actor: "CommitteeMember | Proposer | StandardsStaff"
        preconditions:
          - "the new disclosure's blocks_publication == true"
        side_effects:
          - "increments WorkItem.version by 1"
        note: "This edge is what makes IP a real gate: publication of an already consensus-approved work item is refused with ERR_IP_NOT_CLEARED."

  - entity: Draft
    state_field: status
    initial_state: DRAFTING
    terminal_states: [ABANDONED]
    shape: cyclic
    transitions:
      - from: DRAFTING
        to: SUBCOMMITTEE_BALLOT
        trigger: "POST /sdo/ballots with ballot_kind SUBCOMMITTEE (or RECIRCULATION forced by substantive_change_recirculation)"
        actor: CommitteeChair
        preconditions:
          - "draft.status == DRAFTING"
          - "the work item's sponsoring committee.status == ACTIVE and balance_status == BALANCED"
        side_effects:
          - "Ballot created OPEN with eligible_voter_count frozen"
          - "increments Draft.version by 1"
      - from: SUBCOMMITTEE_BALLOT
        to: COMMENT_RESOLUTION
        trigger: "system — cascade hop 3 of POST /sdo/ballots/{ballotId}/close when the evaluated ballot leaves at least one Vote with adjudication_status PENDING"
        actor: system
        preconditions:
          - "draft.status == SUBCOMMITTEE_BALLOT"
          - "recomputed draft.unresolved_negative_count >= 1"
        side_effects:
          - "cascade hop 4: the parent WorkItem recomputes consensus_gate to BLOCKED and unresolved_negative_count to the draft's pending negatives"
          - "increments Draft.version by 1"
      - from: SUBCOMMITTEE_BALLOT
        to: PUBLIC_REVIEW_READY
        trigger: "system — POST /sdo/ballots/{ballotId}/close when consensus_result == APPROVED and pending_negative_count == 0"
        actor: system
        preconditions:
          - "draft.status == SUBCOMMITTEE_BALLOT"
          - "ballot.consensus_result == APPROVED"
        side_effects:
          - "increments Draft.version by 1"
      - from: SUBCOMMITTEE_BALLOT
        to: DRAFTING
        trigger: "system — POST /sdo/ballots/{ballotId}/close when consensus_result IN {FAILED_QUORUM, FAILED_THRESHOLD}"
        actor: system
        preconditions:
          - "draft.status == SUBCOMMITTEE_BALLOT"
          - "recomputed draft.unresolved_negative_count == 0 — when the failed ballot still left a PENDING negative the SUBCOMMITTEE_BALLOT_to_COMMENT_RESOLUTION edge wins and this edge is not taken"
        side_effects:
          - "increments Draft.version by 1"
        note: >-
          A failed ballot returns the draft to development without any negative adjudication step.
          Edge precedence at close: if the evaluated ballot leaves any PENDING negative the draft goes
          to COMMENT_RESOLUTION regardless of consensus_result; only a failed ballot with zero PENDING
          negatives lands here.
      - from: COMMENT_RESOLUTION
        to: DRAFTING
        trigger: "system — POST /sdo/votes/{voteId}/adjudicate that clears the last PENDING negative when at least one negative on the draft was adjudicated PERSUASIVE"
        actor: system
        preconditions:
          - "draft.status == COMMENT_RESOLUTION"
          - "draft.unresolved_negative_count == 0 after this adjudication"
          - "at least one Vote on the draft's ballots has adjudication_status == PERSUASIVE, OR the draft's most recently EVALUATED ballot has consensus_result IN {FAILED_QUORUM, FAILED_THRESHOLD}"
        side_effects:
          - "draft.recirculation_required = true when this edge was taken because of a PERSUASIVE adjudication; left unchanged when it was taken because the ballot failed its threshold or quorum"
          - "parent WorkItem recomputes consensus_gate (back to OPEN once no draft sits in COMMENT_RESOLUTION)"
          - "increments Draft.version by 1"
        note: "Loop edge: a persuasive negative forces a substantive revision, so the draft re-enters development."
      - from: COMMENT_RESOLUTION
        to: PUBLIC_REVIEW_READY
        trigger: "system — POST /sdo/votes/{voteId}/adjudicate that clears the last PENDING negative with no PERSUASIVE outcome on the draft"
        actor: system
        preconditions:
          - "draft.status == COMMENT_RESOLUTION"
          - "draft.unresolved_negative_count == 0 after this adjudication"
          - "no Vote on the draft's ballots has adjudication_status == PERSUASIVE"
          - "the refreshed consensus_result of the draft's most recently EVALUATED ballot is APPROVED or APPROVED_PENDING_NEGATIVES (a ballot that failed quorum or threshold routes the draft to DRAFTING instead)"
          - "no PublicReview on this draft has status == DISPOSITION_APPROVED — the draft has not yet been through public review, so the next step is to announce one"
        side_effects:
          - "the ballot's final_approval_pct and consensus_result are refreshed by ballot_consensus_evaluation variant final_after_adjudication"
          - "parent WorkItem recomputes consensus_gate"
          - "increments Draft.version by 1"
      - from: COMMENT_RESOLUTION
        to: APPROVED
        trigger: "system — POST /sdo/votes/{voteId}/adjudicate that clears the last PENDING negative left by a consensus ballot on a draft whose public review is already disposed"
        actor: system
        preconditions:
          - "draft.status == COMMENT_RESOLUTION"
          - "draft.unresolved_negative_count == 0 after this adjudication"
          - "no Vote on the draft's ballots has adjudication_status == PERSUASIVE"
          - "the latest PublicReview on this draft has status == DISPOSITION_APPROVED"
          - "the refreshed consensus_result of the draft's most recently EVALUATED ballot is APPROVED"
        side_effects:
          - "the ballot's final_approval_pct and consensus_result are refreshed by ballot_consensus_evaluation variant final_after_adjudication"
          - "cascade hop 4: parent WorkItem takes WorkItem.IN_DEVELOPMENT_to_CONSENSUS_APPROVED and recomputes consensus_gate"
          - "increments Draft.version by 1"
        note: >-
          This is the edge that makes "mandatory consideration of all negatives before advancement"
          observable on the consensus body: the draft cannot reach APPROVED at close while a negative
          is PENDING, only afterwards, and only if the refreshed tally still clears the threshold.
      - from: PUBLIC_REVIEW_READY
        to: PUBLIC_REVIEW
        trigger: "POST /sdo/public-reviews"
        actor: StandardsStaff
        preconditions:
          - "draft.status == PUBLIC_REVIEW_READY"
        side_effects:
          - "PublicReview created OPEN or SCHEDULED"
          - "increments Draft.version by 1"
      - from: PUBLIC_REVIEW
        to: PUBLIC_REVIEW
        trigger: "POST /sdo/public-reviews — a re-announcement that supersedes a SCHEDULED review on the same draft"
        actor: StandardsStaff
        preconditions:
          - "draft.status == PUBLIC_REVIEW"
          - "every existing PublicReview on this draft has status IN {SCHEDULED, CANCELLED}"
          - "expected_draft_version == draft.version (else ERR_STALE_DRAFT_VERSION)"
        side_effects:
          - "the superseded SCHEDULED review takes PublicReview.SCHEDULED_to_CANCELLED"
          - "increments Draft.version by 1"
        note: "Self-loop: the draft stays in PUBLIC_REVIEW while the announcement is replaced. This is the transition the OCC rule public-review-supersede-stale-draft guards."
      - from: PUBLIC_REVIEW
        to: PUBLIC_REVIEW_CLOSED
        trigger: "system — POST /sdo/public-reviews/{publicReviewId}/close"
        actor: system
        preconditions:
          - "draft.status == PUBLIC_REVIEW"
        side_effects:
          - "increments Draft.version by 1"
      - from: PUBLIC_REVIEW_CLOSED
        to: CONSENSUS_BALLOT
        trigger: "POST /sdo/ballots with ballot_kind CONSENSUS_BODY"
        actor: CommitteeChair
        preconditions:
          - "draft.status == PUBLIC_REVIEW_CLOSED"
          - "the latest PublicReview on this draft has status == DISPOSITION_APPROVED (else ERR_PUBLIC_REVIEW_NOT_APPROVED)"
          - "sponsoring committee.status == ACTIVE and balance_status == BALANCED"
        side_effects:
          - "Ballot created OPEN with eligible_voter_count frozen"
          - "increments Draft.version by 1"
      - from: CONSENSUS_BALLOT
        to: COMMENT_RESOLUTION
        trigger: "system — POST /sdo/ballots/{ballotId}/close leaving at least one PENDING negative"
        actor: system
        preconditions:
          - "draft.status == CONSENSUS_BALLOT"
          - "recomputed draft.unresolved_negative_count >= 1"
        side_effects:
          - "parent WorkItem recomputes consensus_gate to BLOCKED"
          - "increments Draft.version by 1"
        note: "Loop edge back into comment resolution: negatives on a consensus ballot must be considered before advancement."
      - from: CONSENSUS_BALLOT
        to: APPROVED
        trigger: "system — POST /sdo/ballots/{ballotId}/close with consensus_result APPROVED and pending_negative_count == 0"
        actor: system
        preconditions:
          - "draft.status == CONSENSUS_BALLOT"
          - "the latest PublicReview on this draft has status == DISPOSITION_APPROVED"
        side_effects:
          - "parent WorkItem takes WorkItem.IN_DEVELOPMENT_to_CONSENSUS_APPROVED"
          - "increments Draft.version by 1"
      - from: CONSENSUS_BALLOT
        to: PUBLIC_REVIEW_CLOSED
        trigger: "system — POST /sdo/ballots/{ballotId}/close with consensus_result IN {FAILED_QUORUM, FAILED_THRESHOLD}"
        actor: system
        preconditions:
          - "draft.status == CONSENSUS_BALLOT"
        side_effects:
          - "increments Draft.version by 1"
        note: >-
          A failed consensus ballot leaves the draft eligible for another consensus ballot without a
          second public review. Edge precedence at close is the same as on the subcommittee side: any
          PENDING negative routes the draft to COMMENT_RESOLUTION first.
      - from: APPROVED
        to: APPROVED
        trigger: "POST /sdo/ballots with ballot_kind REAFFIRMATION"
        actor: CommitteeChair
        preconditions:
          - "draft.status == APPROVED"
          - "the parent WorkItem.progress_status == UNDER_PERIODIC_REVIEW (else ERR_INVALID_WORK_ITEM_STATE)"
          - "the work item's sponsoring committee.status == ACTIVE and balance_status == BALANCED"
        side_effects:
          - "Ballot created OPEN with effective_ballot_kind REAFFIRMATION and eligible_voter_count frozen"
          - "increments Draft.version by 1"
        note: >-
          Self-loop: a reaffirmation ballot re-confirms the already published text, so the draft is
          balloted a second time without leaving APPROVED and without a successor revision. This is
          the only edge that lets a work item reach REAFFIRMED, and it is why validations[priority=70]
          admits APPROVED for ballot creation when the effective kind is REAFFIRMATION.
      - from: APPROVED
        to: DRAFTING
        trigger: "system — cascade hop 3 of Appeal.ACCEPTED_FOR_REVIEW_to_UPHELD with remedy VACATE_BALLOT or REMAND_TO_COMMITTEE"
        actor: system
        preconditions:
          - "draft.status == APPROVED"
        side_effects:
          - "draft.carryover_unresolved_negative_count = the vacated ballot's negative_count (every negative CAST on it, whether or not it was later adjudicated)"
          - "cascade hop 4: parent WorkItem takes WorkItem.CONSENSUS_APPROVED_to_IN_DEVELOPMENT"
          - "increments Draft.version by 1"
        note: "Loop edge from a near-terminal state; the carryover raises the next ballot's required approval by ESCALATION_PCT."
      - from: DRAFTING
        to: ABANDONED
        trigger: "system — POST /sdo/work-items/{workItemId}/drafts with prior_draft_id = this draft"
        actor: system
        preconditions:
          - "draft.status IN {DRAFTING, COMMENT_RESOLUTION}"
        side_effects:
          - "successor draft created with revision_number = this.revision_number + 1"
          - "this draft's recirculation_required cleared to false"
          - "increments Draft.version by 1"
      - from: PUBLIC_REVIEW_CLOSED
        to: ABANDONED
        trigger: "system — POST /sdo/work-items/{workItemId}/drafts with prior_draft_id = this draft"
        actor: system
        preconditions:
          - "draft.status == PUBLIC_REVIEW_CLOSED"
          - "no Vote on this draft's ballots has adjudication_status == PENDING (else ERR_NEGATIVES_NOT_CONSIDERED)"
        side_effects:
          - "successor draft created with revision_number = this.revision_number + 1"
          - "every PublicReview already recorded on this draft keeps its status and stays an occupant of review_window_buffer_check for the whole work item"
          - "increments Draft.version by 1"
        note: "A draft may be revised after its public review has closed; the closed review still occupies the work item's review calendar."
      - from: COMMENT_RESOLUTION
        to: ABANDONED
        trigger: "system — POST /sdo/work-items/{workItemId}/drafts with prior_draft_id = this draft"
        actor: system
        preconditions:
          - "draft.status == COMMENT_RESOLUTION"
          - "draft.unresolved_negative_count == 0 (a draft with PENDING negatives cannot be superseded — ERR_NEGATIVES_NOT_CONSIDERED)"
        side_effects:
          - "successor draft created; carryover_unresolved_negative_count copied to the successor"
          - "increments Draft.version by 1"

  - entity: Ballot
    state_field: status
    initial_state: OPEN
    terminal_states: [EVALUATED, VACATED]
    shape: linear_with_vacate_branch
    transitions:
      - from: OPEN
        to: CLOSED
        trigger: "POST /sdo/ballots/{ballotId}/close"
        actor: "CommitteeChair | StandardsStaff"
        preconditions:
          - "ballot.status == OPEN (else ERR_BALLOT_NOT_OPEN)"
          - "ballot.hold_reason == NONE (else ERR_COMMITTEE_NOT_BALANCED)"
          - "current_utc >= ballot.closes_at OR returned_count == eligible_voter_count (else ERR_BALLOT_NOT_ENDED)"
        side_effects:
          - "cascade hop 1: tallies frozen; closed_at = current_utc"
          - "immediately followed by the system transition CLOSED_to_EVALUATED in the same request"
          - "increments Ballot.version by 1"
      - from: CLOSED
        to: EVALUATED
        trigger: "system — same request as OPEN_to_CLOSED"
        actor: system
        preconditions:
          - "ballot.status == CLOSED"
        side_effects:
          - "ballot_consensus_evaluation variant provisional_at_close writes return_rate_pct, provisional_approval_pct, required_return_rate_pct, required_approval_pct, consensus_result"
          - "cascade hop 2: every Vote on this ballot with position NEGATIVE and status CAST moves adjudication_status NOT_APPLICABLE -> PENDING"
          - "cascade hop 3: because those votes are now PENDING, the Draft recomputes unresolved_negative_count and takes SUBCOMMITTEE_BALLOT_to_COMMENT_RESOLUTION or CONSENSUS_BALLOT_to_COMMENT_RESOLUTION; on a REAFFIRMATION ballot the draft is in APPROVED, no such edge is declared, so hop 3 only recomputes unresolved_negative_count and the draft stays APPROVED"
          - "each eligible CommitteeMembership that returned no CAST vote has missed_ballot_streak incremented and is suspended at MISSED_BALLOT_SUSPENSION_STREAK"
          - "when consensus_result == APPROVED with zero pending negatives, the Draft advances instead (PUBLIC_REVIEW_READY or APPROVED) and the WorkItem ip_status is recomputed"
          - "increments Ballot.version by 1"
      - from: EVALUATED
        to: VACATED
        trigger: "system — cascade hop 2 of Appeal.ACCEPTED_FOR_REVIEW_to_UPHELD with remedy VACATE_BALLOT"
        actor: system
        preconditions:
          - "ballot.status == EVALUATED"
          - "appeal.cited_ballot_id == ballot.id"
        side_effects:
          - "tallies and percentages are preserved as the historical record; consensus_result is left untouched"
          - "cascade hop 3: the Draft takes APPROVED_to_DRAFTING (or CONSENSUS_BALLOT_to_PUBLIC_REVIEW_CLOSED when still balloting) and inherits carryover_unresolved_negative_count = this ballot's negative_count"
          - "increments Ballot.version by 1"
      - from: OPEN
        to: VACATED
        trigger: "system — cascade hop 2 of Appeal.ACCEPTED_FOR_REVIEW_to_UPHELD with remedy VACATE_BALLOT on a still-open ballot"
        actor: system
        preconditions:
          - "ballot.status == OPEN"
        side_effects:
          - "no tallies are frozen; provisional_approval_pct stays null"
          - "increments Ballot.version by 1"

  - entity: Vote
    state_field: status
    initial_state: CAST
    terminal_states: [WITHDRAWN]
    shape: parallel_dimension
    note: "Dimension 1 of 2 on Vote. The return dimension; only ever changed by the voter while the ballot is OPEN."
    transitions:
      - from: CAST
        to: CAST
        trigger: "PATCH /sdo/votes/{voteId} with a different position"
        actor: "CommitteeMember | CommitteeChair"
        preconditions:
          - "ballot.status == OPEN and opens_at <= current_utc < closes_at (else ERR_BALLOT_NOT_IN_VOTING_WINDOW)"
          - "X-User-ID == the participant of vote.membership_id (else ERR_NOT_VOTE_OWNER)"
          - "new position == NEGATIVE requires a comment already linked or comment_text supplied (else ERR_NEGATIVE_REQUIRES_COMMENT)"
        side_effects:
          - "position rewritten; position_change_count incremented"
          - "ballot tallies recomputed; voter-slot invariant preserved"
          - "increments Vote.version by 1 and Ballot.version by 1"
        note: "Self-loop: a voter may change position any number of times while the ballot is open."
      - from: CAST
        to: WITHDRAWN
        trigger: "PATCH /sdo/votes/{voteId} with status = WITHDRAWN"
        actor: "CommitteeMember | CommitteeChair"
        preconditions:
          - "ballot.status == OPEN and opens_at <= current_utc < closes_at"
          - "X-User-ID == the participant of vote.membership_id"
        side_effects:
          - "the vote leaves every tally; the seat returns to not_returned_count (compensating action for vote_slot_conservation)"
          - "the linked BALLOT_NEGATIVE Comment stays on file in status OPEN as the historical record; it carries public_review_id null and therefore never enters any PublicReview disposition ledger"
          - "increments Vote.version by 1 and Ballot.version by 1"

  - entity: Vote
    state_field: adjudication_status
    initial_state: NOT_APPLICABLE
    terminal_states: [PERSUASIVE, NON_PERSUASIVE, WITHDRAWN_BY_VOTER]
    shape: branching
    note: "Dimension 2 of 2 on Vote. Driven by ballot evaluation and by adjudication; independent of the return dimension."
    transitions:
      - from: NOT_APPLICABLE
        to: PENDING
        trigger: "system — cascade hop 2 of Ballot.CLOSED_to_EVALUATED"
        actor: system
        preconditions:
          - "vote.position == NEGATIVE and vote.status == CAST"
        side_effects:
          - "cascade hop 3: draft.unresolved_negative_count recomputed, driving the draft into COMMENT_RESOLUTION"
          - "increments Vote.version by 1"
      - from: PENDING
        to: PERSUASIVE
        trigger: "POST /sdo/votes/{voteId}/adjudicate with resolution = PERSUASIVE"
        actor: CommitteeChair
        preconditions:
          - "vote.adjudication_status == PENDING (else ERR_VOTE_NOT_ADJUDICABLE)"
          - "X-User-ID == the sponsoring committee's chair_participant_id (else ERR_NOT_COMMITTEE_CHAIR)"
          - "X-User-ID != the participant of vote.membership_id (else ERR_SELF_ADJUDICATION)"
        side_effects:
          - "vote.position rewritten NEGATIVE -> AFFIRMATIVE; ballot tallies and final_approval_pct recomputed by variant final_after_adjudication"
          - "the linked Comment (source_vote_id) status set to ACCEPTED"
          - "when this clears the last PENDING negative, the Draft takes COMMENT_RESOLUTION_to_DRAFTING and recirculation_required = true"
          - "increments Vote.version by 1 and Ballot.version by 1"
      - from: PENDING
        to: NON_PERSUASIVE
        trigger: "POST /sdo/votes/{voteId}/adjudicate with resolution = NON_PERSUASIVE"
        actor: CommitteeChair
        preconditions:
          - "vote.adjudication_status == PENDING"
          - "X-User-ID == the sponsoring committee's chair_participant_id"
          - "X-User-ID != the participant of vote.membership_id"
        side_effects:
          - "vote.position stays NEGATIVE; final_approval_pct equals provisional_approval_pct for this path"
          - "the linked Comment status set to REJECTED"
          - "when this clears the last PENDING negative the Draft leaves COMMENT_RESOLUTION: to PUBLIC_REVIEW_READY when the ballot cleared its threshold and no public review is disposed yet, to APPROVED when the disposed public review is already on file, and to DRAFTING when the ballot had failed quorum or threshold; the ballot's consensus_result is refreshed from PENDING negatives to APPROVED only when the refreshed tally still clears required_approval_pct"
          - "increments Vote.version by 1 and Ballot.version by 1"
      - from: PENDING
        to: WITHDRAWN_BY_VOTER
        trigger: "POST /sdo/votes/{voteId}/adjudicate with resolution = WITHDRAWN_BY_VOTER"
        actor: CommitteeMember
        preconditions:
          - "vote.adjudication_status == PENDING"
          - "X-User-ID == the participant of vote.membership_id (else ERR_NOT_VOTE_OWNER)"
        side_effects:
          - "vote.position rewritten NEGATIVE -> ABSTAIN and the negative leaves the approval base"
          - "final_approval_pct recomputed by variant final_after_adjudication"
          - "when this clears the last PENDING negative, the Draft advances with no PERSUASIVE outcome"
          - "increments Vote.version by 1 and Ballot.version by 1"
        note: "Only the voter may withdraw their own negative; the chair may not (ERR_UNAUTHORIZED / ERR_NOT_VOTE_OWNER)."

  - entity: Comment
    state_field: status
    initial_state: OPEN
    terminal_states: []
    shape: cyclic
    transitions:
      - from: OPEN
        to: ACCEPTED
        trigger: "POST /sdo/comments/{commentId}/disposition with disposition = ACCEPTED"
        actor: CommitteeChair
        preconditions:
          - "comment.status == OPEN (else ERR_INVALID_COMMENT_STATE)"
          - "disposition_rationale is a non-empty string (else ERR_INVALID_REQUEST)"
          - "X-User-ID == the sponsoring committee's chair_participant_id (else ERR_NOT_COMMITTEE_CHAIR)"
        side_effects:
          - "when source_type == PUBLIC_REVIEW the parent PublicReview recomputes disposed_count, unresolved_comment_count and disposition_completeness_pct"
          - "when the recomputed unresolved_comment_count reaches 0 the PublicReview bubbles up CLOSED -> DISPOSITION_DRAFTED"
          - "increments Comment.version by 1 and PublicReview.version by 1"
      - from: OPEN
        to: ACCEPTED_WITH_MODIFICATION
        trigger: "POST /sdo/comments/{commentId}/disposition with disposition = ACCEPTED_WITH_MODIFICATION"
        actor: CommitteeChair
        preconditions:
          - "comment.status == OPEN"
          - "disposition_rationale is a non-empty string"
        side_effects:
          - "same PublicReview recount and bubble-up as ACCEPTED"
          - "increments Comment.version by 1"
      - from: OPEN
        to: REJECTED
        trigger: "POST /sdo/comments/{commentId}/disposition with disposition = REJECTED"
        actor: CommitteeChair
        preconditions:
          - "comment.status == OPEN"
          - "disposition_rationale is a non-empty string — a rejected comment must carry a written reason"
        side_effects:
          - "same PublicReview recount and bubble-up as ACCEPTED"
          - "increments Comment.version by 1"
      - from: ACCEPTED
        to: OPEN
        trigger: "POST /sdo/comments/{commentId}/disposition with disposition = REOPENED"
        actor: CommitteeChair
        preconditions:
          - "comment.status IN {ACCEPTED, ACCEPTED_WITH_MODIFICATION, REJECTED}"
          - "the parent PublicReview.status != DISPOSITION_APPROVED (else ERR_INVALID_PUBLIC_REVIEW_STATE)"
        side_effects:
          - "disposition_rationale cleared to null"
          - "PublicReview disposed_count decremented, unresolved_comment_count incremented, disposition_completeness_pct recomputed"
          - "the PublicReview reverses DISPOSITION_DRAFTED -> CLOSED when it had already bubbled up (compensation)"
          - "increments Comment.version by 1 and PublicReview.version by 1"
        note: "Loop edge: reopening a disposed comment must fully reverse the earlier bubble-up with no counter drift."
      - from: REJECTED
        to: OPEN
        trigger: "POST /sdo/comments/{commentId}/disposition with disposition = REOPENED"
        actor: CommitteeChair
        preconditions:
          - "comment.status == REJECTED"
          - "the parent PublicReview.status != DISPOSITION_APPROVED"
        side_effects:
          - "identical compensation to ACCEPTED_to_OPEN"
          - "increments Comment.version by 1 and PublicReview.version by 1"

  - entity: PublicReview
    state_field: status
    initial_state: SCHEDULED
    terminal_states: [DISPOSITION_APPROVED, CANCELLED]
    shape: branching
    transitions:
      - from: SCHEDULED
        to: OPEN
        trigger: "POST /_clock/set_current_utc advancing the clock to a value >= start_date (or POST /sdo/public-reviews when start_date <= current_utc at creation)"
        actor: system
        preconditions:
          - "public_review.status == SCHEDULED"
          - "current_utc >= public_review.start_date"
        side_effects:
          - "the review id is returned in promoted_public_review_ids"
          - "increments PublicReview.version by 1"
      - from: SCHEDULED
        to: CANCELLED
        trigger: "system — POST /sdo/public-reviews announcing a replacement review on the same draft"
        actor: system
        preconditions:
          - "public_review.status == SCHEDULED"
        side_effects:
          - "the superseded review keeps its comment_count as the historical record"
          - "the parent Draft takes the PUBLIC_REVIEW self-loop and Draft.version increments"
          - "increments PublicReview.version by 1"
      - from: OPEN
        to: CLOSED
        trigger: "POST /sdo/public-reviews/{publicReviewId}/close"
        actor: StandardsStaff
        preconditions:
          - "public_review.status == OPEN (else ERR_INVALID_PUBLIC_REVIEW_STATE)"
          - "current_utc > public_review.end_date (else ERR_REVIEW_NOT_ENDED) — the closed inclusive window must be fully elapsed"
        side_effects:
          - "closed_at = current_utc; comment_count frozen"
          - "public_review_disposition_completeness recomputes disposed_count, unresolved_comment_count and disposition_completeness_pct"
          - "the parent Draft takes PUBLIC_REVIEW_to_PUBLIC_REVIEW_CLOSED"
          - "increments PublicReview.version by 1 and Draft.version by 1"
      - from: CLOSED
        to: DISPOSITION_DRAFTED
        trigger: "system — bubble-up when the last OPEN comment on the review is disposed"
        actor: system
        preconditions:
          - "public_review.status == CLOSED"
          - "public_review.unresolved_comment_count == 0 and comment_count >= 1"
        side_effects:
          - "disposition_completeness_pct = 100.0"
          - "increments PublicReview.version by 1"
      - from: CLOSED
        to: DISPOSITION_APPROVED
        trigger: "system — POST /sdo/public-reviews/{publicReviewId}/close on a review that received no comments"
        actor: system
        preconditions:
          - "public_review.status == CLOSED"
          - "public_review.comment_count == 0"
        side_effects:
          - "disposition_completeness_pct = 100.0 by the zero-comment branch of public_review_disposition_completeness"
          - "disposition_approved_by_participant_id stays null and disposition_approved_at = current_utc"
          - "increments PublicReview.version by 1"
        note: "Zero-comment fast path: the review reaches a terminal disposition inside the same close request, skipping DISPOSITION_DRAFTED."
      - from: DISPOSITION_DRAFTED
        to: DISPOSITION_APPROVED
        trigger: "POST /sdo/public-reviews/{publicReviewId}/approve-disposition"
        actor: StandardsStaff
        preconditions:
          - "public_review.status == DISPOSITION_DRAFTED (else ERR_INVALID_PUBLIC_REVIEW_STATE)"
          - "public_review.disposition_completeness_pct == 100.0 (else ERR_DISPOSITION_INCOMPLETE)"
          - "X-User-ID != the sponsoring committee's chair_participant_id (else ERR_DISPOSITION_APPROVER_CONFLICT) — the chair who wrote the dispositions may not approve them"
        side_effects:
          - "disposition_approved_by_participant_id = X-User-ID; disposition_approved_at = current_utc"
          - "the parent Draft becomes eligible for a CONSENSUS_BODY ballot"
          - "increments PublicReview.version by 1"

  - entity: Appeal
    state_field: status
    initial_state: FILED
    terminal_states: [UPHELD, DENIED]
    shape: branching
    transitions:
      - from: FILED
        to: ACCEPTED_FOR_REVIEW
        trigger: "POST /sdo/appeals/{appealId}/decide with decision = ACCEPT_FOR_REVIEW"
        actor: AppealsBoard
        preconditions:
          - "appeal.status == FILED (else ERR_INVALID_APPEAL_STATE)"
        side_effects:
          - "the parent WorkItem keeps consensus_gate BLOCKED (an appeal in FILED or ACCEPTED_FOR_REVIEW blocks advancement)"
          - "when appeal.cited_ballot_id is set and that ballot is OPEN, ballot.hold_reason becomes APPEAL_PENDING"
          - "increments Appeal.version by 1"
      - from: ACCEPTED_FOR_REVIEW
        to: UPHELD
        trigger: "POST /sdo/appeals/{appealId}/decide with decision = UPHOLD and a remedy"
        actor: AppealsBoard
        preconditions:
          - "appeal.status == ACCEPTED_FOR_REVIEW"
          - "decision_rationale is a non-empty string"
          - "remedy IN {VACATE_BALLOT, REMAND_TO_COMMITTEE, SUSPEND_STANDARD} — remedy NONE is rejected with ERR_INVALID_REQUEST"
        side_effects:
          - "cascade hop 1: appeal.status = UPHELD, remedy recorded, decided_at = current_utc"
          - "cascade hop 2: with remedy VACATE_BALLOT the cited Ballot takes EVALUATED_to_VACATED (or OPEN_to_VACATED)"
          - "cascade hop 3: because the ballot was vacated, the Draft takes APPROVED_to_DRAFTING and inherits carryover_unresolved_negative_count = the vacated ballot's negative_count"
          - "cascade hop 4: because the draft returned to development, the WorkItem takes CONSENSUS_APPROVED_to_IN_DEVELOPMENT and consensus_gate is recomputed"
          - "with remedy REMAND_TO_COMMITTEE the ballot is left intact and only hops 3 and 4 run"
          - "with remedy SUSPEND_STANDARD a PUBLISHED WorkItem takes PUBLISHED_to_SUSPENDED instead"
          - "increments Appeal.version, Ballot.version, Draft.version and WorkItem.version by 1 each"
      - from: ACCEPTED_FOR_REVIEW
        to: DENIED
        trigger: "POST /sdo/appeals/{appealId}/decide with decision = DENY"
        actor: AppealsBoard
        preconditions:
          - "appeal.status == ACCEPTED_FOR_REVIEW"
          - "decision_rationale is a non-empty string"
        side_effects:
          - "remedy stays NONE; the cited Ballot, Draft and WorkItem progress_status are all left untouched"
          - "any ballot hold_reason APPEAL_PENDING is released back to NONE"
          - "the parent WorkItem recomputes consensus_gate — it returns to OPEN when no other appeal or comment-resolution draft blocks it"
          - "increments Appeal.version by 1 and WorkItem.version by 1"
        note: "Divergent branch: DENIED touches only the gate, while UPHELD runs a four-hop cascade."
      - from: FILED
        to: DENIED
        trigger: "POST /sdo/appeals/{appealId}/decide with decision = DENY on an appeal never accepted for review"
        actor: AppealsBoard
        preconditions:
          - "appeal.status == FILED"
          - "decision_rationale is a non-empty string"
        side_effects:
          - "identical to ACCEPTED_FOR_REVIEW_to_DENIED"
          - "increments Appeal.version by 1 and WorkItem.version by 1"
        note: "A procedurally deficient appeal may be denied without a substantive review."

  - entity: MaintenanceItem
    state_field: status
    initial_state: RECEIVED
    terminal_states: [INTERPRETATION_ISSUED, ERRATUM_ISSUED, DECLINED]
    shape: branching
    transitions:
      - from: RECEIVED
        to: INTERPRETATION_ISSUED
        trigger: "POST /sdo/maintenance-items/{maintenanceItemId}/resolve with action = ISSUE_INTERPRETATION"
        actor: CommitteeChair
        preconditions:
          - "maintenance_item.status == RECEIVED (else ERR_INVALID_MAINTENANCE_STATE)"
          - "maintenance_item.item_kind == INTERPRETATION_REQUEST (else ERR_MAINTENANCE_ACTION_MISMATCH)"
          - "response_text is a non-empty string"
        side_effects:
          - "resolved_at = current_utc"
          - "the parent WorkItem.interpretation_count is incremented; edition and published_at are unchanged"
          - "increments MaintenanceItem.version by 1 and WorkItem.version by 1"
      - from: RECEIVED
        to: ERRATUM_ISSUED
        trigger: "POST /sdo/maintenance-items/{maintenanceItemId}/resolve with action = ISSUE_ERRATUM"
        actor: StandardsStaff
        preconditions:
          - "maintenance_item.status == RECEIVED"
          - "maintenance_item.item_kind == ERRATUM_REPORT (else ERR_MAINTENANCE_ACTION_MISMATCH)"
          - "response_text and erratum_clause_reference are non-empty strings"
          - "the parent WorkItem.progress_status IN {PUBLISHED, REAFFIRMED, UNDER_PERIODIC_REVIEW} (else ERR_STANDARD_NOT_PUBLISHED)"
        side_effects:
          - "the parent WorkItem.errata_count is incremented and interpretation_count is unchanged"
          - "the parent WorkItem.edition is unchanged — an erratum never advances the edition"
          - "increments MaintenanceItem.version by 1 and WorkItem.version by 1"
        note: "Divergent branch: erratum and interpretation increment different counters on the same parent."
      - from: RECEIVED
        to: DECLINED
        trigger: "POST /sdo/maintenance-items/{maintenanceItemId}/resolve with action = DECLINE"
        actor: "CommitteeChair | StandardsStaff"
        preconditions:
          - "maintenance_item.status == RECEIVED"
          - "response_text is a non-empty string"
        side_effects:
          - "neither errata_count nor interpretation_count changes"
          - "increments MaintenanceItem.version by 1"

concurrency_rules:
  - rule_id: public-review-supersede-stale-draft
    parent_entity: Draft
    write_endpoint: "POST /sdo/public-reviews"
    occ_field: expected_draft_version
    error_id: ERR_STALE_DRAFT_VERSION
    status_code: 412
    description: >-
      Announcing a public review for a draft supersedes any still-SCHEDULED announcement on that
      same draft: the earlier review is CANCELLED and Draft.version is incremented. A second
      announcement therefore must present the Draft.version it observed. When
      expected_draft_version does not equal the draft's stored version the request is rejected with
      ERR_STALE_DRAFT_VERSION (412) and no PublicReview row is created, so a stale announcement can
      never cancel a review the caller never saw.
    version_bump_note: >-
      Draft.version is incremented by every write that reaches the draft, including announcement,
      close, ballot creation, ballot evaluation and appeal cascades — so a caller must re-read
      GET /sdo/drafts/{draftId} to obtain a usable expected_draft_version.
  - rule_id: patent-disclosure-stale-work-item
    parent_entity: WorkItem
    write_endpoint: "POST /sdo/patent-disclosures"
    occ_field: expected_work_item_version
    error_id: ERR_STALE_WORK_ITEM_VERSION
    status_code: 412
    description: >-
      Recording a patent disclosure re-evaluates patent_clearance_evaluation and may move the work
      item's ip_status to IP_BLOCKED, which also flips consensus_gate. Because the outcome depends
      on the disclosures already on file, the caller must present the WorkItem.version it read. A
      mismatch is rejected with ERR_STALE_WORK_ITEM_VERSION (412), leaving no PatentDisclosure row
      and no change to ip_status.
    version_bump_note: >-
      WorkItem.version is incremented by scope approval, draft creation, ballot cascades,
      disclosure recording, commitment recording, publication, periodic review actions and
      maintenance resolutions.

calculations:
  - name: committee_balance_evaluation
    trigger: >-
      Recomputed on POST /sdo/committees/{committeeId}/memberships, on
      PATCH /sdo/memberships/{membershipId}, on POST /sdo/committees/{committeeId}/activate, and
      whenever a membership is system-suspended by the non-return cascade of
      POST /sdo/ballots/{ballotId}/close. Writes TechnicalCommittee.balance_status,
      roster_balance_status, active_member_count, roster_member_count, dominance_pct,
      roster_dominance_pct, distinct_category_count and category_counts.
    algorithm: threshold
    formula: |
      # Non-linear: three inputs (member count, distinct interest categories, dominance share)
      # interact through conditional branches to pick one of three balance labels.
      member_set = the memberships selected by the active variant (see variants below)
      n = count(member_set)
      category_counts = map from interest_category -> count of memberships in member_set
                        holding that category (the snapshot value stored on
                        CommitteeMembership.interest_category, never the Participant's
                        current interest_category)
      distinct_category_count = count of keys in category_counts with a value >= 1
      largest_category_count = max(category_counts.values()) when n >= 1 else 0
      dominance_pct = 0.0 if n == 0 else round_half_up(100 * largest_category_count / n, 1)

      if n >= MIN_ACTIVE_MEMBERS
         and distinct_category_count >= MIN_DISTINCT_CATEGORIES
         and dominance_pct <= DOMINANCE_LIMIT_PCT:
          label = BALANCED
      elif n >= MIN_ACTIVE_MEMBERS
         and distinct_category_count >= PROVISIONAL_MIN_DISTINCT_CATEGORIES
         and dominance_pct <= PROVISIONAL_DOMINANCE_LIMIT_PCT:
          label = PROVISIONAL
      else:
          label = UNBALANCED

      # Comparisons use <= : a committee sitting exactly at DOMINANCE_LIMIT_PCT is BALANCED.
      # dominance_pct is rounded to 1 decimal BEFORE the comparison, so 2 of 3 memberships in
      # one category gives 66.7 (not 66.66...), which is > 50.0 and <= 66.7.
    input_set: >-
      CommitteeMembership rows whose committee_id is this committee. The variant selects which
      statuses are included. Participants themselves are never counted — only memberships, so a
      participant appointed to two committees contributes independently to each.
    constants:
      MIN_ACTIVE_MEMBERS: 3
      MIN_DISTINCT_CATEGORIES: 3
      DOMINANCE_LIMIT_PCT: 50.0
      PROVISIONAL_MIN_DISTINCT_CATEGORIES: 2
      PROVISIONAL_DOMINANCE_LIMIT_PCT: 66.7
    precision: "dominance_pct and roster_dominance_pct: 1 decimal place, round_half_up; rounded before every comparison"
    variants:
      - name: voting_basis
        when: >-
          Written to balance_status / active_member_count / dominance_pct / distinct_category_count.
          This is the label consulted by ERR_COMMITTEE_NOT_BALANCED when a ballot is opened and by
          POST /sdo/committees/{committeeId}/activate.
        difference: >-
          member_set = memberships with status == ACTIVE AND voting_rights == true. Suspended and
          withdrawn seats, and ACTIVE seats with voting_rights == false, are excluded entirely.
      - name: roster_basis
        when: >-
          Written to roster_balance_status / roster_member_count / roster_dominance_pct. This is the
          label an appeal with grounds BALANCE_VIOLATION is adjudicated against, because the
          appellant's complaint is about who was appointed, not about who happened to be able to vote.
        difference: >-
          member_set = memberships with status IN {ACTIVE, SUSPENDED} regardless of voting_rights;
          only WITHDRAWN seats are excluded. Identical data therefore yields a different label
          whenever suspended seats skew the category mix — e.g. 3 ACTIVE seats in 3 distinct
          categories plus 2 SUSPENDED PRODUCER seats gives voting_basis dominance 33.3 with label
          BALANCED, and roster_basis dominance 60.0 with distinct_category_count 3 and label
          PROVISIONAL — because 60.0 > DOMINANCE_LIMIT_PCT (so not BALANCED) but
          60.0 <= PROVISIONAL_DOMINANCE_LIMIT_PCT.

  - name: ballot_consensus_evaluation
    trigger: >-
      Runs inside POST /sdo/ballots/{ballotId}/close (variant provisional_at_close) and again inside
      every POST /sdo/votes/{voteId}/adjudicate on a vote belonging to this ballot (variant
      final_after_adjudication). Writes affirmative_count, negative_count, abstain_count,
      returned_count, not_returned_count, return_rate_pct, provisional_approval_pct,
      final_approval_pct, required_return_rate_pct, required_approval_pct, pending_negative_count
      and consensus_result.
    algorithm: threshold
    formula: |
      # STEP 1 — tally. Only Vote rows with status == CAST are counted; a WITHDRAWN vote
      # contributes to nothing and its seat returns to not_returned_count.
      affirmative_count  = count(votes where status == CAST and position == AFFIRMATIVE)
      negative_count     = count(votes where status == CAST and position == NEGATIVE)
      abstain_count      = count(votes where status == CAST and position == ABSTAIN)
      returned_count     = affirmative_count + negative_count + abstain_count
      not_returned_count = eligible_voter_count - returned_count

      # STEP 2 — percentages. MANDATORY ORDER: each percentage is rounded to 1 decimal place
      # with round_half_up FIRST and only the rounded value is ever compared to a threshold.
      # Comparing the unrounded quotient instead changes verdicts: 2/3 = 66.666...% is below a
      # 66.7 threshold unrounded but exactly equal to it once rounded, and equality passes.
      return_rate_pct = 0.0 if eligible_voter_count == 0
                        else round_half_up(100 * returned_count / eligible_voter_count, 1)
      approval_base   = affirmative_count + negative_count       # abstains are excluded
      approval_pct    = 0.0 if approval_base == 0
                        else round_half_up(100 * affirmative_count / approval_base, 1)

      # STEP 3 — thresholds, selected by effective_ballot_kind (see substantive_change_recirculation
      # for how effective_ballot_kind can differ from the submitted ballot_kind).
      required_return_rate_pct   = RETURN_PCT_BY_KIND[effective_ballot_kind]
      base_required_approval_pct = APPROVAL_PCT_BY_KIND[effective_ballot_kind]
      if draft.carryover_unresolved_negative_count > 0:
          required_approval_pct = min(base_required_approval_pct + ESCALATION_PCT, CEILING_PCT)
      else:
          required_approval_pct = base_required_approval_pct

      # STEP 4 — verdict. First matching branch wins; the order is normative.
      pending_negative_count = count(votes where status == CAST and position == NEGATIVE
                                     and adjudication_status IN {NOT_APPLICABLE, PENDING})
      if return_rate_pct < required_return_rate_pct:      consensus_result = FAILED_QUORUM
      elif approval_pct < required_approval_pct:          consensus_result = FAILED_THRESHOLD
      elif pending_negative_count > 0:                    consensus_result = APPROVED_PENDING_NEGATIVES
      else:                                               consensus_result = APPROVED

      # A quorum failure masks a threshold failure: a ballot that misses both reports
      # FAILED_QUORUM only.
    input_set: >-
      Vote rows whose ballot_id is this ballot and whose status == CAST. eligible_voter_count is
      frozen at ballot creation from the sponsoring committee's voting-eligible memberships and is
      never re-derived afterwards — memberships suspended by the non-return cascade of this very
      close do NOT shrink the denominator of the ballot being closed.
    constants:
      RETURN_PCT_BY_KIND: "{ SUBCOMMITTEE: 50.0, CONSENSUS_BODY: 66.7, RECIRCULATION: 66.7, REAFFIRMATION: 66.7 }"
      APPROVAL_PCT_BY_KIND: "{ SUBCOMMITTEE: 50.1, CONSENSUS_BODY: 66.7, RECIRCULATION: 75.0, REAFFIRMATION: 66.7 }"
      ESCALATION_PCT: 5.0
      CEILING_PCT: 90.0
      MISSED_BALLOT_SUSPENSION_STREAK: 2
    precision: "1 decimal place, round_half_up, applied before any threshold comparison"
    variants:
      - name: provisional_at_close
        when: "Inside POST /sdo/ballots/{ballotId}/close, i.e. Ballot.CLOSED_to_EVALUATED."
        difference: >-
          Positions are read exactly as cast; every CAST negative counts toward
          pending_negative_count, so an otherwise-passing ballot lands on
          APPROVED_PENDING_NEGATIVES. The result is written to provisional_approval_pct and
          final_approval_pct is left null.
      - name: final_after_adjudication
        when: "Inside POST /sdo/votes/{voteId}/adjudicate, i.e. after each negative is dispositioned."
        difference: >-
          Adjudication rewrites the underlying position before the tally (PERSUASIVE makes it
          AFFIRMATIVE, WITHDRAWN_BY_VOTER makes it ABSTAIN, NON_PERSUASIVE leaves NEGATIVE), so the
          same cast votes produce a different number. The result is written to final_approval_pct
          and provisional_approval_pct is preserved untouched as the historical record. Example: a
          3-seat CONSENSUS_BODY ballot with 2 AFFIRMATIVE and 1 NEGATIVE gives
          provisional_approval_pct 66.7 with consensus_result APPROVED_PENDING_NEGATIVES; after that
          negative is ruled PERSUASIVE the same ballot gives final_approval_pct 100.0 with
          consensus_result APPROVED, while ruling it NON_PERSUASIVE gives final_approval_pct 66.7.

  - name: substantive_change_recirculation
    trigger: >-
      Runs inside POST /sdo/ballots when the target draft has a prior_draft_id, and inside
      POST /sdo/work-items/{workItemId}/drafts to write substantive_change_ratio. Writes
      Draft.substantive_change_ratio and Ballot.effective_ballot_kind and
      Ballot.eligible_voter_count.
    algorithm: threshold
    formula: |
      # This calculation looks circular and the evaluation order below is normative: the ballot's
      # eligible voter set depends on effective_ballot_kind, effective_ballot_kind depends on the
      # change ratio, and the change ratio is a property of the draft the ballot is being opened
      # on. Evaluating the eligible set before the kind (or the kind before the ratio) produces a
      # different eligible_voter_count and therefore a different quorum verdict later.
      #
      # ORDER 1 — ratio (a pure property of the draft; computed at draft creation)
      substantive_change_ratio = 0.0000 if total_clause_count == 0
        else round_half_up(changed_clause_count / total_clause_count, 4)
      #
      # ORDER 2 — effective ballot kind
      if draft.prior_draft_id is null:
          effective_ballot_kind = submitted ballot_kind
      elif substantive_change_ratio >= SUBSTANTIVE_RATIO_THRESHOLD:
          effective_ballot_kind = RECIRCULATION          # forced, overriding the submitted kind
      elif draft.recirculation_required == true:
          effective_ballot_kind = RECIRCULATION          # forced by a PERSUASIVE negative
      else:
          effective_ballot_kind = predecessor_ballot.effective_ballot_kind
      #
      # ORDER 3 — eligible voter set
      if effective_ballot_kind != RECIRCULATION:
          eligible_set = memberships with status == ACTIVE and voting_rights == true
      else:
          eligible_set = { memberships that hold a CAST vote on predecessor_ballot }
                       UNION
                         { memberships with status == ACTIVE and voting_rights == true
                           and appointed_at > predecessor_ballot.closes_at }
          # A member who let the previous ballot lapse is not re-polled on the recirculation; a
          # member appointed after the previous ballot closed had no chance to vote and is added.
      eligible_voter_count = count(eligible_set)
      #
      # ORDER 4 — thresholds are then read by ballot_consensus_evaluation from
      # effective_ballot_kind, so RECIRCULATION raises the approval bar to 75.0 while leaving the
      # return-rate bar at 66.7.
    input_set: >-
      The target Draft, its prior_draft_id chain, the predecessor Ballot (the most recently
      EVALUATED or VACATED ballot on the predecessor draft, chosen by created_at descending), and
      the sponsoring committee's memberships.
    constants:
      SUBSTANTIVE_RATIO_THRESHOLD: 0.1000
    precision: "substantive_change_ratio: 4 decimal places, round_half_up; compared with >="
    variants:
      - name: forced_recirculation
        when: "substantive_change_ratio >= SUBSTANTIVE_RATIO_THRESHOLD on a revised draft"
        difference: >-
          effective_ballot_kind is rewritten to RECIRCULATION even when the caller submitted
          SUBCOMMITTEE or CONSENSUS_BODY, the eligible set narrows to prior returners plus
          newly-appointed seats, and required_approval_pct becomes 75.0. With 40 total clauses,
          4 changed clauses gives exactly 0.1000 and forces recirculation; 3 changed clauses gives
          0.0750 and inherits the predecessor's kind.
      - name: inherited_kind
        when: "substantive_change_ratio < SUBSTANTIVE_RATIO_THRESHOLD and recirculation_required == false"
        difference: >-
          The submitted ballot_kind is discarded in favour of the predecessor ballot's
          effective_ballot_kind, so an editorial revision is re-balloted under exactly the rules
          that applied to the draft it replaces and the full active voting roster is polled.

  - name: public_review_disposition_completeness
    trigger: >-
      Recomputed on POST /sdo/comments (when source_type == PUBLIC_REVIEW), on
      POST /sdo/comments/{commentId}/disposition (both the disposing and the REOPENED direction),
      and on POST /sdo/public-reviews/{publicReviewId}/close. Writes PublicReview.comment_count,
      disposed_count, unresolved_comment_count and disposition_completeness_pct.
    algorithm: aggregation
    formula: |
      comment_count            = count(comments where public_review_id == this review)
      disposed_count           = count(those comments where status IN
                                       {ACCEPTED, ACCEPTED_WITH_MODIFICATION, REJECTED})
      unresolved_comment_count = comment_count - disposed_count
      disposition_completeness_pct = 100.0 if comment_count == 0
        else round_half_up(100 * disposed_count / comment_count, 1)
      # Empty-collection edge: a review that drew no comments is 100.0 percent disposed by
      # definition, NOT 0.0 and NOT null. This is what lets a zero-comment review reach
      # DISPOSITION_APPROVED inside its own close request with no approver recorded.
      # A REOPENED comment decrements disposed_count and increments unresolved_comment_count, so
      # comment_disposition_conservation holds after both directions.
    input_set: >-
      Comment rows whose public_review_id is this review, in every status. Comments attached only
      to a ballot (source_type == BALLOT_NEGATIVE, public_review_id null) never enter this count.
    constants:
      FULL_DISPOSITION_PCT: 100.0
    precision: "disposition_completeness_pct: 1 decimal place, round_half_up"

  - name: patent_clearance_evaluation
    trigger: >-
      Runs on POST /sdo/patent-disclosures, on
      POST /sdo/patent-disclosures/{patentDisclosureId}/commitment, at the consensus-approval moment
      inside POST /sdo/ballots/{ballotId}/close and POST /sdo/votes/{voteId}/adjudicate (the two
      requests that can fire Draft.CONSENSUS_BALLOT_to_APPROVED or
      Draft.COMMENT_RESOLUTION_to_APPROVED), and again as a precondition inside
      POST /sdo/work-items/{workItemId}/publish. Writes WorkItem.ip_status and
      PatentDisclosure.blocks_publication.
    algorithm: aggregation
    formula: |
      blocking(d) = d.essentiality IN {ESSENTIAL, POTENTIALLY_ESSENTIAL}
                    and d.status IN {DISCLOSED_NO_COMMITMENT, REFUSED}
      # A WITHDRAWN disclosure never blocks. A NOT_ESSENTIAL disclosure never blocks regardless of
      # its licensing status. RAND_COMMITTED and RAND_ZERO_COMMITTED lift the block on an
      # essential patent, but lifting the block is not by itself clearance.
      disclosures = PatentDisclosure rows where work_item_id == this work item

      # The call for patents closes with consensus approval. Before that instant an empty
      # disclosure set is merely IP_PENDING; after it, an empty (or wholly non-blocking) set is
      # IP_CLEARED. This latch is what makes publication reachable at all, and it is read from the
      # progress dimension so the two WorkItem dimensions stay independently observable.
      call_for_patents_closed = work_item.progress_status IN
          {CONSENSUS_APPROVED, PUBLISHED, UNDER_PERIODIC_REVIEW, REAFFIRMED}

      if any(blocking(d) for d in disclosures):         ip_status = IP_BLOCKED
      elif call_for_patents_closed:                     ip_status = IP_CLEARED
      elif count(disclosures) == 0:                     ip_status = IP_PENDING
      else:                                             ip_status = IP_DISCLOSED
      # A live blocking patent always wins, even after consensus approval: that is the
      # IP_CLEARED_to_IP_BLOCKED edge. Conversely an upheld appeal that returns the work item to
      # IN_DEVELOPMENT reopens the call, so a later recomputation on a work item with no
      # disclosures takes IP_CLEARED_to_IP_PENDING.
      # Each disclosure also stores blocks_publication = blocking(itself), so the reason for a
      # blocked work item is attributable to a specific patent.
    input_set: "All PatentDisclosure rows on the work item, in every status."
    constants:
      BLOCKING_ESSENTIALITY: "[ESSENTIAL, POTENTIALLY_ESSENTIAL]"
      BLOCKING_COMMITMENT_STATUS: "[DISCLOSED_NO_COMMITMENT, REFUSED]"
    precision: "not applicable — categorical result"

  - name: consensus_gate_evaluation
    trigger: >-
      Recomputed at the end of every request that touches a Draft, a Ballot, an Appeal or the
      sponsoring TechnicalCommittee of a work item: POST /sdo/ballots,
      POST /sdo/ballots/{ballotId}/close, POST /sdo/votes/{voteId}/adjudicate,
      POST /sdo/appeals, POST /sdo/appeals/{appealId}/decide,
      PATCH /sdo/memberships/{membershipId} and POST /sdo/committees/{committeeId}/activate.
      Writes WorkItem.consensus_gate and WorkItem.unresolved_negative_count.
    algorithm: constraint_propagation
    formula: |
      # The gate is a fixed point over three independent blockers on other entities. It is
      # recomputed from scratch on every touch rather than incrementally toggled, so that clearing
      # one blocker while another still holds leaves the gate BLOCKED.
      unresolved_negative_count = sum over drafts of this work item of
          count(votes on that draft's ballots where status == CAST and position == NEGATIVE
                and adjudication_status == PENDING)

      appeal_blocked    = any Appeal on this work item with status IN {FILED, ACCEPTED_FOR_REVIEW}
      draft_blocked     = any Draft on this work item with status == COMMENT_RESOLUTION
      committee_blocked = the sponsoring TechnicalCommittee.status != ACTIVE
                          or the sponsoring TechnicalCommittee.balance_status != BALANCED

      consensus_gate = BLOCKED if (appeal_blocked or draft_blocked or committee_blocked) else OPEN
      # consensus_gate == BLOCKED is what POST /sdo/work-items/{workItemId}/publish and
      # POST /sdo/work-items/{workItemId}/periodic-review reject with ERR_CONSENSUS_GATE_BLOCKED,
      # and it is the field that makes "all negatives must be considered before advancement"
      # observable: a draft holding even one PENDING negative sits in COMMENT_RESOLUTION, which
      # keeps the gate BLOCKED no matter how favourable the ballot arithmetic was.
    input_set: >-
      All Draft rows, all Appeal rows on this work item, all Vote rows reachable through those
      drafts' ballots, and the single sponsoring TechnicalCommittee.
    constants:
      APPEAL_BLOCKING_STATUSES: "[FILED, ACCEPTED_FOR_REVIEW]"
    precision: "not applicable — categorical result"

  - name: periodic_review_schedule
    trigger: >-
      periodic_review_due_date is written by POST /sdo/work-items/{workItemId}/publish and rewritten
      by every POST /sdo/work-items/{workItemId}/periodic-review whose action is REAFFIRM. The
      window bounds are evaluated as preconditions of that same endpoint.
    algorithm: chronological
    formula: |
      # On publication (or reaffirmation) the next review date is anchored on the calendar date of
      # the anchoring event, not on the request's timestamp-of-convenience.
      anchor_date = date_part(published_at) on publication
                  = date_part(last_periodic_action_at) on reaffirmation
      periodic_review_due_date = anchor_date advanced by PERIODIC_REVIEW_YEARS calendar years
                                 (same month and day; 02-29 anchors fall back to 02-28)

      window_opens_at = periodic_review_due_date - REVIEW_LEAD_DAYS days
      grace_ends_at   = periodic_review_due_date + REAFFIRMATION_GRACE_DAYS days

      # A periodic-review action is in-window when
      #   window_opens_at <= date_part(current_utc) <= grace_ends_at
      # Before window_opens_at  -> ERR_PERIODIC_REVIEW_NOT_DUE  (both actions)
      # After grace_ends_at     -> ERR_REAFFIRMATION_WINDOW_EXPIRED for action REAFFIRM only;
      #                            action WITHDRAW stays available forever, because an overdue
      #                            standard must always be withdrawable.
      # Worked example: published_at 2026-09-15 gives periodic_review_due_date 2031-09-15,
      # window_opens_at 2031-03-19 and grace_ends_at 2031-12-14.
    input_set: "The single WorkItem, plus the logical clock value."
    constants:
      PERIODIC_REVIEW_YEARS: 5
      REVIEW_LEAD_DAYS: 180
      REAFFIRMATION_GRACE_DAYS: 90
    precision: "whole calendar days; both bounds inclusive"

  - name: appeal_timeliness
    trigger: >-
      Runs inside POST /sdo/appeals. Writes Appeal.filing_deadline_at and decides
      ERR_APPEAL_UNTIMELY.
    algorithm: chronological
    formula: |
      if cited_ballot_id is not null:
          anchor_at = cited_ballot.closed_at
          # an OPEN or VACATED ballot has closed_at == null -> ERR_APPEAL_ANCHOR_MISSING
      else:
          anchor_at = work_item.published_at
          # an unpublished work item with no cited ballot -> ERR_APPEAL_ANCHOR_MISSING
      filing_deadline_at = anchor_at + APPEAL_WINDOW_DAYS days
      timely = current_utc <= filing_deadline_at        # inclusive: the deadline instant is timely
      # Worked example: a ballot closed at 2026-09-15T00:00:00Z yields filing_deadline_at
      # 2026-10-15T00:00:00Z. A filing at exactly 2026-10-15T00:00:00Z is timely; a filing at
      # 2026-10-15T00:00:01Z is ERR_APPEAL_UNTIMELY.
    input_set: "The cited Ballot when supplied, otherwise the WorkItem, plus the logical clock value."
    constants:
      APPEAL_WINDOW_DAYS: 30
    precision: "whole days on an inclusive upper bound (<=)"

  - name: ballot_window_capacity_check
    trigger: "Runs inside POST /sdo/ballots before the Ballot row is created."
    algorithm: interval_merge
    formula: |
      # Interval semantics A: HALF-OPEN [opens_at, closes_at) with AGGREGATE capacity.
      # Adjacency is explicitly allowed — a ballot opening at exactly the instant another closes
      # does not overlap it — and overlap alone is not fatal: the committee may run up to
      # max_concurrent_ballots overlapping ballots at once.
      overlaps(a, b) = a.opens_at < b.closes_at and b.opens_at < a.closes_at
      occupants = Ballot rows where committee_id == this committee
                  and status IN {OPEN, CLOSED}            # EVALUATED and VACATED ballots are freed
                  and overlaps(row, candidate)
      if count(occupants) >= committee.max_concurrent_ballots:
          reject with ERR_BALLOT_CAPACITY_EXCEEDED
      committee.open_ballot_count = count(Ballot rows on this committee with status IN {OPEN, CLOSED})

      # Also checked here, before capacity:
      #   (closes_at - opens_at) in whole days >= MIN_BALLOT_DAYS[effective_ballot_kind]
      #   else ERR_BALLOT_WINDOW_TOO_SHORT. Inclusive: exactly MIN_BALLOT_DAYS passes.
      #   2026-08-01T00:00:00Z -> 2026-08-15T00:00:00Z is 14 days and passes a SUBCOMMITTEE ballot;
      #   2026-08-14T00:00:00Z is 13 days and fails.
    input_set: >-
      Ballot rows on the same TechnicalCommittee with status IN {OPEN, CLOSED}. Ballots on other
      committees never contend, even when they target the same draft's work item.
    constants:
      MIN_BALLOT_DAYS: "{ SUBCOMMITTEE: 14, RECIRCULATION: 14, CONSENSUS_BODY: 30, REAFFIRMATION: 30 }"
    precision: "whole days; window length compared with >=; overlap compared with strict <"

  - name: review_window_buffer_check
    trigger: "Runs inside POST /sdo/public-reviews before the PublicReview row is created."
    algorithm: interval_merge
    formula: |
      # Interval semantics B: CLOSED INCLUSIVE [start_date, end_date] with a SYMMETRIC BUFFER and
      # capacity of exactly one. Contrast with ballot_window_capacity_check: here adjacency is
      # forbidden, the buffer widens each occupied interval by REVIEW_BUFFER_DAYS on both sides,
      # and a single collision is fatal because a work item may never have two live public review
      # periods.
      duration_days = (end_date - start_date) in whole days + 1        # inclusive count
      if duration_days < MIN_REVIEW_DAYS: reject with ERR_REVIEW_PERIOD_TOO_SHORT
      # 2026-08-01 -> 2026-09-14 is 45 days inclusive and passes;
      # 2026-08-01 -> 2026-09-13 is 44 days and fails.

      occupants = PublicReview rows reachable from the same WorkItem (through any of its drafts)
                  with status IN {OPEN, CLOSED, DISPOSITION_DRAFTED, DISPOSITION_APPROVED}
      conflicts(existing, candidate) =
          candidate.start_date <= existing.end_date   + REVIEW_BUFFER_DAYS
          and existing.start_date <= candidate.end_date + REVIEW_BUFFER_DAYS
      if any(conflicts(e, candidate) for e in occupants):
          reject with ERR_REVIEW_WINDOW_BUFFER_CONFLICT
      # Worked example: an existing review ending 2026-09-14 pushes the buffered edge to
      # 2026-09-29, so a candidate starting 2026-09-29 conflicts and one starting 2026-09-30 does
      # not. SCHEDULED reviews are NOT occupants — they are superseded (CANCELLED) instead, which
      # is exactly the write the OCC rule public-review-supersede-stale-draft guards.
    input_set: >-
      PublicReview rows reachable from the candidate draft's WorkItem through every draft revision,
      with status IN {OPEN, CLOSED, DISPOSITION_DRAFTED, DISPOSITION_APPROVED}.
    constants:
      MIN_REVIEW_DAYS: 45
      REVIEW_BUFFER_DAYS: 15
    precision: "whole calendar days; duration compared with >= on an inclusive day count; buffer compared with <="

  - name: vote_slot_conservation
    trigger: >-
      An invariant re-established at the end of POST /sdo/ballots/{ballotId}/votes,
      PATCH /sdo/votes/{voteId} (position change and withdrawal) and
      POST /sdo/votes/{voteId}/adjudicate.
    algorithm: aggregation
    formula: |
      # Conserved quantity 1 — VOTER SEATS. For every Ballot, at every observable instant:
      #   affirmative_count + negative_count + abstain_count == returned_count
      #   returned_count + not_returned_count == eligible_voter_count
      # eligible_voter_count itself is frozen at creation and is never rewritten by any later
      # request, including membership suspensions and withdrawals.
      # Forward action  : POST /sdo/ballots/{ballotId}/votes moves one seat from not_returned_count
      #                   into exactly one position bucket.
      # Compensation    : PATCH /sdo/votes/{voteId} with status = WITHDRAWN moves that seat back to
      #                   not_returned_count and removes it from its bucket.
      # After a cast followed by its withdrawal the four counters must equal their pre-cast values
      # exactly; a position change (the CAST self-loop) must move the seat between buckets without
      # ever changing returned_count.
      # Adjudication rewrites positions and therefore moves seats BETWEEN buckets, but must never
      # change returned_count or eligible_voter_count.
    input_set: "All Vote rows on the ballot, plus the ballot's frozen eligible_voter_count."
    constants:
      SEAT_CONSERVATION: "affirmative_count + negative_count + abstain_count + not_returned_count == eligible_voter_count"
    precision: "exact integer equality"

  - name: comment_disposition_conservation
    trigger: >-
      An invariant re-established at the end of POST /sdo/comments and
      POST /sdo/comments/{commentId}/disposition in both directions.
    algorithm: aggregation
    formula: |
      # Conserved quantity 2 — COMMENT DISPOSITION LEDGER. For every PublicReview, at every
      # observable instant:
      #   disposed_count + unresolved_comment_count == comment_count
      #   comment_count == count(Comment rows with public_review_id == review.id)
      # Forward action : POST /sdo/comments/{commentId}/disposition with ACCEPTED,
      #                  ACCEPTED_WITH_MODIFICATION or REJECTED increments disposed_count and
      #                  decrements unresolved_comment_count, and may bubble the review up
      #                  CLOSED -> DISPOSITION_DRAFTED.
      # Compensation   : the same endpoint with REOPENED decrements disposed_count, increments
      #                  unresolved_comment_count, clears disposition_rationale, and reverses the
      #                  bubble-up DISPOSITION_DRAFTED -> CLOSED.
      # After a disposition followed by a REOPENED, all three counters, the review status and
      # disposition_completeness_pct must equal their pre-disposition values exactly. comment_count
      # is never touched by either direction — it only moves when a Comment row is created.
    input_set: "All Comment rows whose public_review_id is this review, in every status."
    constants:
      LEDGER_CONSERVATION: "disposed_count + unresolved_comment_count == comment_count"
    precision: "exact integer equality"

validations:
  - priority: 10
    category: auth
    check: >-
      Both X-User-Role and X-User-ID headers are present and non-empty on every request. Checked
      before anything else, including path existence, so an unauthenticated request for a
      non-existent id still returns 401.
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all
  - priority: 20
    category: auth
    check: >-
      X-User-Role is one of the six roles declared in the RBAC matrix AND that role appears in the
      target endpoint's roles list. Role membership is decided from the header alone, before any
      resource is loaded.
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: all
  - priority: 30
    category: existence
    check: >-
      Every path-templated id resolves to a stored row, validated left-to-right in the order the
      segments appear in the path. POST /sdo/committees/{committeeId}/memberships with an unknown
      committeeId returns ERR_COMMITTEE_NOT_FOUND before any body field is inspected.
    error_id: "ERR_PARTICIPANT_NOT_FOUND | ERR_COMMITTEE_NOT_FOUND | ERR_MEMBERSHIP_NOT_FOUND | ERR_WORK_ITEM_NOT_FOUND | ERR_DRAFT_NOT_FOUND | ERR_BALLOT_NOT_FOUND | ERR_VOTE_NOT_FOUND | ERR_COMMENT_NOT_FOUND | ERR_PUBLIC_REVIEW_NOT_FOUND | ERR_PATENT_DISCLOSURE_NOT_FOUND | ERR_APPEAL_NOT_FOUND | ERR_MAINTENANCE_ITEM_NOT_FOUND"
    http_status: 404
    applies_to: "all endpoints with a path-templated id"
  - priority: 40
    category: request_shape
    check: >-
      Required input fields are present; enum-typed fields carry a declared member; integer fields
      are non-negative integers; date fields parse as ISO-8601 dates and datetime fields as
      ISO-8601 UTC instants; text fields required to be non-empty are non-empty after trimming;
      limit is an integer in 1..100 and offset is an integer >= 0; unknown body fields are rejected.
      Fields declared source computed or system in §1.1 are rejected when supplied.
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all endpoints with a request body or query parameters"
  - priority: 50
    category: business_referential
    check: >-
      Every foreign-key id supplied in the request body resolves to a stored row, validated in the
      order the fields are declared in §1.1 for the target entity. POST /sdo/ballots with an unknown
      draft_id returns ERR_DRAFT_NOT_FOUND; POST /sdo/work-items/{workItemId}/approve-scope with an
      unknown sponsoring_committee_id returns ERR_COMMITTEE_NOT_FOUND.
    error_id: "ERR_PARTICIPANT_NOT_FOUND | ERR_COMMITTEE_NOT_FOUND | ERR_DRAFT_NOT_FOUND | ERR_BALLOT_NOT_FOUND | ERR_PUBLIC_REVIEW_NOT_FOUND | ERR_VOTE_NOT_FOUND | ERR_WORK_ITEM_NOT_FOUND"
    http_status: 404
    applies_to: "all endpoints whose input includes a foreign-key id"
  - priority: 60
    category: auth
    check: >-
      For chair-restricted operations, X-User-ID equals the chair_participant_id of the
      TechnicalCommittee that sponsors the target work item (for adjudication and comment
      disposition) or of the target committee itself (for opening a ballot). A CommitteeChair acting
      on another committee's resources is rejected here, after role admission but before any state
      check.
    error_id: ERR_NOT_COMMITTEE_CHAIR
    http_status: 403
    applies_to: "POST /sdo/ballots, POST /sdo/votes/{voteId}/adjudicate, POST /sdo/comments/{commentId}/disposition, POST /sdo/maintenance-items/{maintenanceItemId}/resolve"
  - priority: 62
    category: auth
    check: >-
      For vote-owner operations, X-User-ID equals the participant_id of the CommitteeMembership
      referenced by the target Vote. Applies to changing or withdrawing a vote and to the
      WITHDRAWN_BY_VOTER adjudication resolution, which only the negative voter may choose.
    error_id: ERR_NOT_VOTE_OWNER
    http_status: 403
    applies_to: "PATCH /sdo/votes/{voteId}, POST /sdo/votes/{voteId}/adjudicate with resolution WITHDRAWN_BY_VOTER"
  - priority: 64
    category: auth
    check: >-
      For entity_backed roles (Proposer, CommitteeMember, CommitteeChair, PublicCommenter) X-User-ID
      resolves to a stored Participant, and any submitter-identity field in the body
      (proposer_participant_id, submitter_participant_id, disclosing_participant_id,
      appellant_participant_id, requester_participant_id) equals X-User-ID. A caller may not file
      anything in another participant's name.
    error_id: ERR_ACTOR_IDENTITY_MISMATCH
    http_status: 403
    applies_to: "POST /sdo/work-items, POST /sdo/comments, POST /sdo/patent-disclosures, POST /sdo/appeals, POST /sdo/maintenance-items, POST /sdo/ballots/{ballotId}/votes"
  - priority: 70
    category: state
    check: >-
      The target Draft is in a status from which the requested operation is declared in §1.2:
      DRAFTING or PUBLIC_REVIEW_CLOSED for opening a ballot, plus APPROVED when ballot_kind is
      REAFFIRMATION; PUBLIC_REVIEW_READY (or PUBLIC_REVIEW
      when every existing review on it is SCHEDULED or CANCELLED) for announcing a public review;
      DRAFTING, COMMENT_RESOLUTION or PUBLIC_REVIEW_CLOSED for being superseded by a successor
      revision; and never ABANDONED for anything.
    error_id: ERR_INVALID_DRAFT_STATE
    http_status: 409
    applies_to: "POST /sdo/ballots, POST /sdo/public-reviews, POST /sdo/work-items/{workItemId}/drafts"
  - priority: 71
    category: state
    check: >-
      The target WorkItem's progress_status permits the operation: PROPOSED for scope approval,
      IN_DEVELOPMENT for draft creation, CONSENSUS_APPROVED for publication,
      PUBLISHED/UNDER_PERIODIC_REVIEW/REAFFIRMED for periodic-review actions REAFFIRM and
      OPEN_REVIEW, and PUBLISHED/UNDER_PERIODIC_REVIEW/REAFFIRMED/SUSPENDED for action WITHDRAW.
    error_id: ERR_INVALID_WORK_ITEM_STATE
    http_status: 409
    applies_to: "POST /sdo/work-items/{workItemId}/approve-scope, POST /sdo/work-items/{workItemId}/drafts, POST /sdo/work-items/{workItemId}/publish, POST /sdo/work-items/{workItemId}/periodic-review"
  - priority: 72
    category: state
    check: "The target Ballot has status == OPEN."
    error_id: ERR_BALLOT_NOT_OPEN
    http_status: 409
    applies_to: "POST /sdo/ballots/{ballotId}/votes, PATCH /sdo/votes/{voteId}, POST /sdo/ballots/{ballotId}/close"
  - priority: 73
    category: state
    check: >-
      The target PublicReview status permits the operation: OPEN for close, DISPOSITION_DRAFTED for
      approve-disposition, and a status other than DISPOSITION_APPROVED for reopening one of its
      comments.
    error_id: ERR_INVALID_PUBLIC_REVIEW_STATE
    http_status: 409
    applies_to: "POST /sdo/public-reviews/{publicReviewId}/close, POST /sdo/public-reviews/{publicReviewId}/approve-disposition, POST /sdo/comments/{commentId}/disposition"
  - priority: 74
    category: state
    check: >-
      The target Comment is OPEN for a disposing action, or in {ACCEPTED, ACCEPTED_WITH_MODIFICATION,
      REJECTED} for disposition REOPENED.
    error_id: ERR_INVALID_COMMENT_STATE
    http_status: 409
    applies_to: "POST /sdo/comments/{commentId}/disposition"
  - priority: 75
    category: state
    check: "The target Appeal has status FILED or ACCEPTED_FOR_REVIEW; UPHELD and DENIED are terminal."
    error_id: ERR_INVALID_APPEAL_STATE
    http_status: 409
    applies_to: "POST /sdo/appeals/{appealId}/decide"
  - priority: 76
    category: state
    check: "The target MaintenanceItem has status == RECEIVED."
    error_id: ERR_INVALID_MAINTENANCE_STATE
    http_status: 409
    applies_to: "POST /sdo/maintenance-items/{maintenanceItemId}/resolve"
  - priority: 77
    category: state
    check: "The target Vote has adjudication_status == PENDING and status == CAST."
    error_id: ERR_VOTE_NOT_ADJUDICABLE
    http_status: 409
    applies_to: "POST /sdo/votes/{voteId}/adjudicate"
  - priority: 78
    category: state
    check: >-
      The relevant TechnicalCommittee has status == ACTIVE. A committee in FORMING or SUSPENDED may
      not open ballots, and a work item may not be published while its sponsoring committee is
      SUSPENDED.
    error_id: ERR_COMMITTEE_NOT_ACTIVE
    http_status: 409
    applies_to: "POST /sdo/ballots, POST /sdo/work-items/{workItemId}/publish"
  - priority: 79
    category: state
    check: >-
      For maintenance resolutions of kind ERRATUM_REPORT the parent WorkItem.progress_status is in
      {PUBLISHED, REAFFIRMED, UNDER_PERIODIC_REVIEW} — an erratum cannot be issued against an
      unpublished standard.
    error_id: ERR_STANDARD_NOT_PUBLISHED
    http_status: 409
    applies_to: "POST /sdo/maintenance-items/{maintenanceItemId}/resolve"
  - priority: 80
    category: state
    check: >-
      expected_draft_version equals the stored Draft.version, per concurrency rule
      public-review-supersede-stale-draft. Evaluated after every state check so a caller with a
      stale version on a draft in the wrong status learns about the status first.
    error_id: ERR_STALE_DRAFT_VERSION
    http_status: 412
    applies_to: "POST /sdo/public-reviews"
  - priority: 81
    category: state
    check: >-
      expected_work_item_version equals the stored WorkItem.version, per concurrency rule
      patent-disclosure-stale-work-item.
    error_id: ERR_STALE_WORK_ITEM_VERSION
    http_status: 412
    applies_to: "POST /sdo/patent-disclosures"
  - priority: 82
    category: state
    check: >-
      The target TechnicalCommittee is in a status from which activation is declared in §1.2, i.e.
      FORMING or SUSPENDED. Activating a committee that is already ACTIVE is not idempotent; it is
      rejected. Evaluated before the chair and balance checks so that a second activation of an
      already ACTIVE committee reports the status rather than re-running the balance verdict.
    error_id: ERR_INVALID_COMMITTEE_STATE
    http_status: 409
    applies_to: "POST /sdo/committees/{committeeId}/activate"
  - priority: 90
    category: business_safety
    check: >-
      No Vote on the target draft's ballots has adjudication_status == PENDING. This is the
      "mandatory consideration of all negatives before advancement" guard: it blocks superseding a
      draft that still holds unconsidered negatives and blocks publishing a work item whose latest
      draft does.
    error_id: ERR_NEGATIVES_NOT_CONSIDERED
    http_status: 409
    applies_to: "POST /sdo/work-items/{workItemId}/drafts, POST /sdo/work-items/{workItemId}/publish"
  - priority: 91
    category: business_safety
    check: "The WorkItem.consensus_gate is OPEN, as recomputed by consensus_gate_evaluation."
    error_id: ERR_CONSENSUS_GATE_BLOCKED
    http_status: 409
    applies_to: "POST /sdo/work-items/{workItemId}/publish, POST /sdo/work-items/{workItemId}/periodic-review"
  - priority: 92
    category: business_safety
    check: >-
      The WorkItem.ip_status is IP_CLEARED after patent_clearance_evaluation is re-run inside the
      request. IP_BLOCKED (a declared-essential patent with no licensing commitment) stops
      publication, and so do IP_PENDING and IP_DISCLOSED, which mean the clearance latch has not
      been set by a consensus approval.
    error_id: ERR_IP_NOT_CLEARED
    http_status: 409
    applies_to: "POST /sdo/work-items/{workItemId}/publish"
  - priority: 93
    category: business_safety
    check: >-
      The most recently created PublicReview on the target draft has status == DISPOSITION_APPROVED
      before a CONSENSUS_BODY ballot may open on that draft, and again before the work item is
      published: publication may never outrun the disposition of the public review comments.
    error_id: ERR_PUBLIC_REVIEW_NOT_APPROVED
    http_status: 409
    applies_to: "POST /sdo/ballots, POST /sdo/work-items/{workItemId}/publish"
  - priority: 94
    category: business_safety
    check: "The target PublicReview.disposition_completeness_pct == 100.0."
    error_id: ERR_DISPOSITION_INCOMPLETE
    http_status: 409
    applies_to: "POST /sdo/public-reviews/{publicReviewId}/approve-disposition"
  - priority: 95
    category: business_safety
    check: >-
      X-User-ID differs from the participant_id of the CommitteeMembership behind the target Vote. A
      chair who cast a negative may not rule on their own negative.
    error_id: ERR_SELF_ADJUDICATION
    http_status: 403
    applies_to: "POST /sdo/votes/{voteId}/adjudicate with resolution PERSUASIVE or NON_PERSUASIVE"
  - priority: 96
    category: business_safety
    check: >-
      X-User-ID differs from the chair_participant_id of the committee sponsoring the reviewed
      draft's work item. Segregation of duties: whoever wrote the comment dispositions may not
      approve them.
    error_id: ERR_DISPOSITION_APPROVER_CONFLICT
    http_status: 403
    applies_to: "POST /sdo/public-reviews/{publicReviewId}/approve-disposition"
  - priority: 97
    category: business_safety
    check: >-
      The appellant is an interested party: X-User-ID is either the work item's
      proposer_participant_id, or the participant_id of a CommitteeMembership on the sponsoring
      committee with status IN {ACTIVE, SUSPENDED}, or the submitter_participant_id of at least one
      Comment on one of the work item's drafts. Evaluated BEFORE appeal timeliness.
    error_id: ERR_APPELLANT_NOT_INTERESTED_PARTY
    http_status: 403
    applies_to: "POST /sdo/appeals"
  - priority: 98
    category: business_safety
    check: >-
      A vote cast or changed to position NEGATIVE supplies comment_text as a non-empty string; the
      server records the linked Comment with source_type == BALLOT_NEGATIVE and
      source_vote_id == the vote. An unexplained negative is not admissible.
    error_id: ERR_NEGATIVE_REQUIRES_COMMENT
    http_status: 400
    applies_to: "POST /sdo/ballots/{ballotId}/votes, PATCH /sdo/votes/{voteId}"
  - priority: 100
    category: business_constraint
    check: >-
      The relevant TechnicalCommittee.balance_status == BALANCED, per
      committee_balance_evaluation variant voting_basis. Evaluated after the draft-status and
      committee-status checks, so a ballot request that is wrong on both status and balance reports
      the status error.
    error_id: ERR_COMMITTEE_NOT_BALANCED
    http_status: 409
    applies_to: "POST /sdo/ballots, POST /sdo/committees/{committeeId}/activate"
  - priority: 101
    category: business_constraint
    check: >-
      The committee's chair_participant_id holds a CommitteeMembership on that committee with
      status == ACTIVE. Checked when the committee is activated.
    error_id: ERR_CHAIR_NOT_MEMBER
    http_status: 409
    applies_to: "POST /sdo/committees/{committeeId}/activate"
  - priority: 102
    category: business_constraint
    check: >-
      No CommitteeMembership with status IN {ACTIVE, SUSPENDED} already exists for this
      (committee_id, participant_id) pair. A WITHDRAWN seat may be re-appointed.
    error_id: ERR_DUPLICATE_MEMBERSHIP
    http_status: 409
    applies_to: "POST /sdo/committees/{committeeId}/memberships"
  - priority: 103
    category: business_constraint
    check: >-
      No other CommitteeMembership on this committee with status IN {ACTIVE, SUSPENDED} carries the
      same employer_affiliation_code. One employer gets one seat, which is what stops a single
      organization from packing an interest category.
    error_id: ERR_AFFILIATION_ALREADY_REPRESENTED
    http_status: 409
    applies_to: "POST /sdo/committees/{committeeId}/memberships"
  - priority: 104
    category: business_constraint
    check: >-
      No Vote with status == CAST already exists on this ballot for the acting participant's
      membership. A WITHDRAWN vote may be replaced by a new cast.
    error_id: ERR_DUPLICATE_VOTE
    http_status: 409
    applies_to: "POST /sdo/ballots/{ballotId}/votes"
  - priority: 105
    category: business_constraint
    check: >-
      The acting participant holds a CommitteeMembership on the ballot's committee with
      status == ACTIVE and voting_rights == true, and — when
      ballot.effective_ballot_kind == RECIRCULATION — that membership is in the recirculation
      eligible set defined by substantive_change_recirculation.
    error_id: ERR_VOTER_NOT_ELIGIBLE
    http_status: 409
    applies_to: "POST /sdo/ballots/{ballotId}/votes"
  - priority: 106
    category: business_constraint
    check: >-
      The count of Ballot rows on the committee with status IN {OPEN, CLOSED} whose half-open
      window overlaps the candidate window is < committee.max_concurrent_ballots, per
      ballot_window_capacity_check.
    error_id: ERR_BALLOT_CAPACITY_EXCEEDED
    http_status: 409
    applies_to: "POST /sdo/ballots"
  - priority: 107
    category: business_constraint
    check: >-
      The requested resolve action matches the MaintenanceItem.item_kind:
      ISSUE_INTERPRETATION requires INTERPRETATION_REQUEST and ISSUE_ERRATUM requires
      ERRATUM_REPORT. DECLINE is valid for both kinds.
    error_id: ERR_MAINTENANCE_ACTION_MISMATCH
    http_status: 409
    applies_to: "POST /sdo/maintenance-items/{maintenanceItemId}/resolve"
  - priority: 108
    category: business_constraint
    check: >-
      A periodic-review action of REAFFIRM requires a Ballot on the work item's latest Draft with
      effective_ballot_kind == REAFFIRMATION, status == EVALUATED and
      consensus_result == APPROVED. A reaffirmation may not be declared by staff fiat.
    error_id: ERR_REAFFIRMATION_BALLOT_REQUIRED
    http_status: 409
    applies_to: "POST /sdo/work-items/{workItemId}/periodic-review"
  - priority: 110
    category: business_temporal
    check: >-
      (closes_at - opens_at) in whole days >= MIN_BALLOT_DAYS[effective_ballot_kind], and
      opens_at < closes_at. Inclusive at the boundary: exactly MIN_BALLOT_DAYS passes.
    error_id: ERR_BALLOT_WINDOW_TOO_SHORT
    http_status: 409
    applies_to: "POST /sdo/ballots"
  - priority: 111
    category: business_temporal
    check: >-
      current_utc >= ballot.closes_at, OR returned_count == eligible_voter_count (every seat has
      returned, so the ballot may close early).
    error_id: ERR_BALLOT_NOT_ENDED
    http_status: 409
    applies_to: "POST /sdo/ballots/{ballotId}/close"
  - priority: 112
    category: business_temporal
    check: >-
      opens_at <= current_utc < closes_at — the half-open voting window. A vote at exactly
      closes_at is rejected.
    error_id: ERR_BALLOT_NOT_IN_VOTING_WINDOW
    http_status: 409
    applies_to: "POST /sdo/ballots/{ballotId}/votes, PATCH /sdo/votes/{voteId}"
  - priority: 113
    category: business_temporal
    check: >-
      (end_date - start_date) in whole days + 1 >= MIN_REVIEW_DAYS, using the closed inclusive day
      count from review_window_buffer_check, and start_date <= end_date.
    error_id: ERR_REVIEW_PERIOD_TOO_SHORT
    http_status: 409
    applies_to: "POST /sdo/public-reviews"
  - priority: 114
    category: business_temporal
    check: "current_utc is strictly after the end of the review's last day, i.e. current_utc > end_date."
    error_id: ERR_REVIEW_NOT_ENDED
    http_status: 409
    applies_to: "POST /sdo/public-reviews/{publicReviewId}/close"
  - priority: 115
    category: business_temporal
    check: >-
      No PublicReview on the same WorkItem with status IN {OPEN, CLOSED, DISPOSITION_DRAFTED,
      DISPOSITION_APPROVED} collides with the candidate window once both are widened by
      REVIEW_BUFFER_DAYS, per review_window_buffer_check.
    error_id: ERR_REVIEW_WINDOW_BUFFER_CONFLICT
    http_status: 409
    applies_to: "POST /sdo/public-reviews"
  - priority: 116
    category: business_referential
    check: >-
      The appeal has a usable timing anchor: a cited_ballot_id whose ballot has a non-null closed_at,
      or (when cited_ballot_id is omitted) a WorkItem with a non-null published_at.
    error_id: ERR_APPEAL_ANCHOR_MISSING
    http_status: 409
    applies_to: "POST /sdo/appeals"
  - priority: 117
    category: business_temporal
    check: >-
      current_utc <= anchor_at + APPEAL_WINDOW_DAYS days, per appeal_timeliness. Inclusive: a filing
      at exactly the deadline instant is timely.
    error_id: ERR_APPEAL_UNTIMELY
    http_status: 409
    applies_to: "POST /sdo/appeals"
  - priority: 118
    category: business_temporal
    check: >-
      date_part(current_utc) >= periodic_review_due_date - REVIEW_LEAD_DAYS days, per
      periodic_review_schedule. Applies to both REAFFIRM and WITHDRAW actions.
    error_id: ERR_PERIODIC_REVIEW_NOT_DUE
    http_status: 409
    applies_to: "POST /sdo/work-items/{workItemId}/periodic-review"
  - priority: 119
    category: business_temporal
    check: >-
      For action REAFFIRM only, date_part(current_utc) <= periodic_review_due_date +
      REAFFIRMATION_GRACE_DAYS days. Action WITHDRAW is never time-barred on the upper side.
    error_id: ERR_REAFFIRMATION_WINDOW_EXPIRED
    http_status: 409
    applies_to: "POST /sdo/work-items/{workItemId}/periodic-review"

priority_conflict_notes:
  - conflict_id: ballot-open-state-beats-capacity-constraint
    endpoint: "POST /sdo/ballots"
    lower_priority_number_wins: true
    rules: "validations[priority=70] (category state, ERR_INVALID_DRAFT_STATE) vs validations[priority=106] (category business_constraint, ERR_BALLOT_CAPACITY_EXCEEDED)"
    expectation: >-
      On a committee whose max_concurrent_ballots is 1 and which already holds one OPEN ballot, a
      second POST /sdo/ballots aimed at that same already-balloting draft with an overlapping window
      violates both rows: the draft is in SUBCOMMITTEE_BALLOT rather than DRAFTING, and the overlap
      occupancy has reached capacity. The response is ERR_INVALID_DRAFT_STATE (409) — the state
      check at priority 70 wins over the constraint check at priority 106 — and no Ballot row is
      created.
  - conflict_id: appeal-safety-beats-temporal
    endpoint: "POST /sdo/appeals"
    lower_priority_number_wins: true
    rules: "validations[priority=97] (category business_safety, ERR_APPELLANT_NOT_INTERESTED_PARTY) vs validations[priority=117] (category business_temporal, ERR_APPEAL_UNTIMELY)"
    expectation: >-
      A filing by a participant who holds no membership, authored no comment and did not propose the
      work item, submitted after the 30-day window has elapsed, violates both rows. The response is
      ERR_APPELLANT_NOT_INTERESTED_PARTY (403) — standing is decided before timeliness — and no
      Appeal row is created.


endpoints:
  # ---------------------------------------------------------------- Participants
  - method: POST
    path: "/sdo/participants"
    description: >-
      Register a participant in the standards developing organization. interest_category and
      employer_affiliation_code are the values snapshotted onto every future CommitteeMembership.
    roles: [StandardsStaff]
    code: 201
    input: [full_name, organization, interest_category, employer_affiliation_code]
    output: Participant
    side_effects: []
  - method: GET
    path: "/sdo/participants"
    description: "List participants, filterable by interest category, organization and employer affiliation."
    roles: [Proposer, CommitteeMember, CommitteeChair, PublicCommenter, StandardsStaff, AppealsBoard]
    code: 200
    input: ["interest_category?", "organization?", "employer_affiliation_code?", "limit?", "offset?"]
    output: Participant[]
    side_effects: []
  - method: GET
    path: "/sdo/participants/{participantId}"
    description: "Fetch one participant."
    roles: [Proposer, CommitteeMember, CommitteeChair, PublicCommenter, StandardsStaff, AppealsBoard]
    code: 200
    input: []
    output: Participant
    side_effects: []
  # ---------------------------------------------------------- Technical committees
  - method: POST
    path: "/sdo/committees"
    description: >-
      Create a technical committee in status FORMING. max_concurrent_ballots defaults to 2 and caps
      overlapping ballot windows on this committee.
    roles: [StandardsStaff]
    code: 201
    input: [designation, scope_text, chair_participant_id, "max_concurrent_ballots?"]
    output: TechnicalCommittee
    side_effects:
      - "committee_balance_evaluation runs on an empty roster, writing balance_status UNBALANCED, roster_balance_status UNBALANCED and dominance_pct 0.0"
  - method: GET
    path: "/sdo/committees"
    description: "List technical committees, filterable by chair, status and balance status."
    roles: [Proposer, CommitteeMember, CommitteeChair, PublicCommenter, StandardsStaff, AppealsBoard]
    code: 200
    input: ["chair_participant_id?", "status?", "balance_status?", "limit?", "offset?"]
    output: TechnicalCommittee[]
    side_effects: []
  - method: GET
    path: "/sdo/committees/{committeeId}"
    description: "Fetch one technical committee including its derived balance fields and category_counts."
    roles: [Proposer, CommitteeMember, CommitteeChair, PublicCommenter, StandardsStaff, AppealsBoard]
    code: 200
    input: []
    output: TechnicalCommittee
    side_effects: []
  - method: POST
    path: "/sdo/committees/{committeeId}/activate"
    description: >-
      Move a committee FORMING -> ACTIVE, or SUSPENDED -> ACTIVE. Rejected with
      ERR_INVALID_COMMITTEE_STATE when the committee is already ACTIVE, with ERR_CHAIR_NOT_MEMBER
      when the chair holds no ACTIVE membership and with ERR_COMMITTEE_NOT_BALANCED when
      balance_status is not BALANCED.
    roles: [StandardsStaff]
    code: 200
    input: []
    output: TechnicalCommittee
    side_effects:
      - "committee_balance_evaluation re-runs (both variants) before the balance check"
      - "consensus_gate_evaluation re-runs for every WorkItem sponsored by this committee"
      - "increments TechnicalCommittee.version by 1"
  - method: POST
    path: "/sdo/committees/{committeeId}/memberships"
    description: >-
      Appoint a participant to the committee. interest_category and employer_affiliation_code are
      snapshotted from the Participant at appointment time and never track later participant edits.
      voting_rights defaults to true.
    roles: [StandardsStaff]
    code: 201
    input: [participant_id, "voting_rights?"]
    output: CommitteeMembership
    side_effects:
      - "committee_balance_evaluation recomputes both variants on the parent committee"
      - "increments TechnicalCommittee.version by 1"
  - method: GET
    path: "/sdo/memberships"
    description: "List committee memberships, filterable by committee, participant and status."
    roles: [Proposer, CommitteeMember, CommitteeChair, PublicCommenter, StandardsStaff, AppealsBoard]
    code: 200
    input: ["committee_id?", "participant_id?", "status?", "limit?", "offset?"]
    output: CommitteeMembership[]
    side_effects: []
  - method: GET
    path: "/sdo/memberships/{membershipId}"
    description: "Fetch one committee membership including its snapshotted interest_category and missed_ballot_streak."
    roles: [Proposer, CommitteeMember, CommitteeChair, PublicCommenter, StandardsStaff, AppealsBoard]
    code: 200
    input: []
    output: CommitteeMembership
    side_effects: []
  - method: PATCH
    path: "/sdo/memberships/{membershipId}"
    description: >-
      Suspend, restore, withdraw or re-enfranchise a seat. status accepts ACTIVE, SUSPENDED or
      WITHDRAWN; a WITHDRAWN seat is terminal and cannot be restored.
    roles: [StandardsStaff]
    code: 200
    input: ["status?", "voting_rights?"]
    output: CommitteeMembership
    side_effects:
      - "committee_balance_evaluation recomputes both variants on the parent committee"
      - "consensus_gate_evaluation re-runs for every WorkItem sponsored by this committee"
      - "already-created Ballot rows keep their frozen eligible_voter_count"
      - "increments CommitteeMembership.version and TechnicalCommittee.version by 1"
  # ------------------------------------------------------------------- Work items
  - method: POST
    path: "/sdo/work-items"
    description: >-
      Submit a new work item proposal in progress_status PROPOSED and ip_status IP_PENDING.
      proposer_participant_id must equal X-User-ID.
    roles: [Proposer, CommitteeMember, CommitteeChair]
    code: 201
    input: [title, scope_text, work_item_type, proposer_participant_id, target_completion_date]
    output: WorkItem
    side_effects: []
  - method: GET
    path: "/sdo/work-items"
    description: "List work items, filterable by proposer, sponsoring committee, progress status, IP status and consensus gate."
    roles: [Proposer, CommitteeMember, CommitteeChair, PublicCommenter, StandardsStaff, AppealsBoard]
    code: 200
    input: ["proposer_participant_id?", "sponsoring_committee_id?", "progress_status?", "ip_status?", "consensus_gate?", "limit?", "offset?"]
    output: WorkItem[]
    side_effects: []
  - method: GET
    path: "/sdo/work-items/{workItemId}"
    description: "Fetch one work item including consensus_gate, unresolved_negative_count and the periodic-review schedule."
    roles: [Proposer, CommitteeMember, CommitteeChair, PublicCommenter, StandardsStaff, AppealsBoard]
    code: 200
    input: []
    output: WorkItem
    side_effects: []
  - method: POST
    path: "/sdo/work-items/{workItemId}/approve-scope"
    description: >-
      Decide a scope proposal. decision APPROVE requires sponsoring_committee_id and designation and
      moves the work item PROPOSED -> SCOPE_APPROVED -> IN_DEVELOPMENT in one request; decision
      REJECT moves it to SCOPE_REJECTED and requires rationale.
    roles: [StandardsStaff]
    code: 200
    input: [decision, "sponsoring_committee_id?", "designation?", "rationale?"]
    output: WorkItem
    side_effects:
      - "scope_approved_at = current_utc and edition = 1 on APPROVE"
      - "consensus_gate_evaluation runs, so a work item sponsored by a non-ACTIVE committee starts BLOCKED"
      - "increments WorkItem.version by 1"
  - method: POST
    path: "/sdo/work-items/{workItemId}/drafts"
    description: >-
      Create a draft revision in status DRAFTING. Omit prior_draft_id for revision_number 1; supply
      it to supersede an earlier draft in DRAFTING, COMMENT_RESOLUTION or PUBLIC_REVIEW_CLOSED,
      which sets that draft to ABANDONED and carries its carryover_unresolved_negative_count
      forward. changed_clause_count defaults to 0.
    roles: [CommitteeChair, StandardsStaff]
    code: 201
    input: [total_clause_count, "changed_clause_count?", "prior_draft_id?", "summary?"]
    output: Draft
    side_effects:
      - "substantive_change_recirculation writes substantive_change_ratio"
      - "the predecessor draft, when supplied, takes Draft.DRAFTING_to_ABANDONED, Draft.COMMENT_RESOLUTION_to_ABANDONED or Draft.PUBLIC_REVIEW_CLOSED_to_ABANDONED"
      - "increments WorkItem.version by 1"
  - method: POST
    path: "/sdo/work-items/{workItemId}/publish"
    description: >-
      Publish the approved standard. Requires progress_status CONSENSUS_APPROVED, consensus_gate
      OPEN, ip_status IP_CLEARED and zero PENDING negatives on the latest draft.
    roles: [StandardsStaff]
    code: 200
    input: []
    output: WorkItem
    side_effects:
      - "published_at = current_utc; progress_status CONSENSUS_APPROVED -> PUBLISHED"
      - "periodic_review_schedule writes periodic_review_due_date"
      - "patent_clearance_evaluation re-runs as a precondition"
      - "increments WorkItem.version by 1"
  - method: POST
    path: "/sdo/work-items/{workItemId}/periodic-review"
    description: >-
      Record a periodic review outcome. action OPEN_REVIEW moves PUBLISHED -> UNDER_PERIODIC_REVIEW;
      action REAFFIRM requires an EVALUATED REAFFIRMATION ballot with consensus_result APPROVED and
      re-anchors periodic_review_due_date; action WITHDRAW moves the standard to WITHDRAWN.
    roles: [StandardsStaff]
    code: 200
    input: [action, "rationale?"]
    output: WorkItem
    side_effects:
      - "last_periodic_action_at = current_utc"
      - "periodic_review_schedule rewrites periodic_review_due_date on REAFFIRM"
      - "increments WorkItem.version by 1"
  # ---------------------------------------------------------------------- Drafts
  - method: GET
    path: "/sdo/drafts"
    description: "List drafts, filterable by work item, predecessor draft and status."
    roles: [Proposer, CommitteeMember, CommitteeChair, PublicCommenter, StandardsStaff, AppealsBoard]
    code: 200
    input: ["work_item_id?", "prior_draft_id?", "status?", "limit?", "offset?"]
    output: Draft[]
    side_effects: []
  - method: GET
    path: "/sdo/drafts/{draftId}"
    description: >-
      Fetch one draft including version (the value a caller passes as expected_draft_version),
      substantive_change_ratio, unresolved_negative_count, carryover_unresolved_negative_count and
      recirculation_required.
    roles: [Proposer, CommitteeMember, CommitteeChair, PublicCommenter, StandardsStaff, AppealsBoard]
    code: 200
    input: []
    output: Draft
    side_effects: []
  # --------------------------------------------------------------------- Ballots
  - method: POST
    path: "/sdo/ballots"
    description: >-
      Open a ballot on a draft. ballot_kind is the submitted intent (SUBCOMMITTEE, CONSENSUS_BODY,
      RECIRCULATION or REAFFIRMATION); substantive_change_recirculation may rewrite it into
      effective_ballot_kind. opens_at/closes_at describe a half-open window and must span at least
      MIN_BALLOT_DAYS for the effective kind.
    roles: [CommitteeChair]
    code: 201
    input: [draft_id, committee_id, ballot_kind, opens_at, closes_at, "predecessor_ballot_id?"]
    output: Ballot
    side_effects:
      - "substantive_change_recirculation writes effective_ballot_kind and freezes eligible_voter_count"
      - "ballot_window_capacity_check enforces MIN_BALLOT_DAYS and max_concurrent_ballots and writes committee.open_ballot_count"
      - "ballot_consensus_evaluation seeds required_return_rate_pct and required_approval_pct at creation"
      - "the parent Draft takes DRAFTING_to_SUBCOMMITTEE_BALLOT, PUBLIC_REVIEW_CLOSED_to_CONSENSUS_BALLOT or, for a REAFFIRMATION ballot, the APPROVED_to_APPROVED self-loop"
      - "consensus_gate_evaluation re-runs on the parent WorkItem"
      - "increments Draft.version, TechnicalCommittee.version and WorkItem.version by 1"
  - method: GET
    path: "/sdo/ballots"
    description: "List ballots, filterable by draft, committee, predecessor ballot and status."
    roles: [Proposer, CommitteeMember, CommitteeChair, PublicCommenter, StandardsStaff, AppealsBoard]
    code: 200
    input: ["draft_id?", "committee_id?", "predecessor_ballot_id?", "status?", "consensus_result?", "limit?", "offset?"]
    output: Ballot[]
    side_effects: []
  - method: GET
    path: "/sdo/ballots/{ballotId}"
    description: >-
      Fetch one ballot including every tally, return_rate_pct, provisional_approval_pct,
      final_approval_pct, required_return_rate_pct, required_approval_pct, pending_negative_count,
      hold_reason and consensus_result.
    roles: [Proposer, CommitteeMember, CommitteeChair, PublicCommenter, StandardsStaff, AppealsBoard]
    code: 200
    input: []
    output: Ballot
    side_effects: []
  - method: POST
    path: "/sdo/ballots/{ballotId}/close"
    description: >-
      Close and evaluate a ballot. Permitted once current_utc has reached closes_at, or earlier when
      every eligible seat has returned. Runs the full close cascade in one request.
    roles: [CommitteeChair, StandardsStaff]
    code: 200
    input: []
    output: Ballot
    side_effects:
      - "cascade hop 1: Ballot OPEN -> CLOSED -> EVALUATED with ballot_consensus_evaluation variant provisional_at_close"
      - "cascade hop 2: every CAST NEGATIVE Vote moves adjudication_status NOT_APPLICABLE -> PENDING"
      - "cascade hop 3: the parent Draft moves into COMMENT_RESOLUTION (or advances when there are no negatives)"
      - "cascade hop 4: the parent WorkItem recomputes consensus_gate and unresolved_negative_count"
      - "every eligible membership that returned nothing has missed_ballot_streak incremented and is suspended at MISSED_BALLOT_SUSPENSION_STREAK"
      - "increments Ballot.version, Vote.version, Draft.version, WorkItem.version and CommitteeMembership.version by 1"
  # ----------------------------------------------------------------------- Votes
  - method: POST
    path: "/sdo/ballots/{ballotId}/votes"
    description: >-
      Cast a vote. position is AFFIRMATIVE, NEGATIVE or ABSTAIN; a NEGATIVE position requires
      comment_text, which the server stores as a linked Comment with source_type BALLOT_NEGATIVE.
      membership_id must belong to X-User-ID.
    roles: [CommitteeMember, CommitteeChair]
    code: 201
    input: [membership_id, position, "comment_text?", "clause_reference?"]
    output: Vote
    side_effects:
      - "ballot tallies recomputed; vote_slot_conservation re-established"
      - "a Comment row is created for a NEGATIVE position with source_vote_id and ballot_id set"
      - "increments Ballot.version by 1"
  - method: GET
    path: "/sdo/votes"
    description: "List votes, filterable by ballot, membership, adjudicator, position and adjudication status."
    roles: [Proposer, CommitteeMember, CommitteeChair, PublicCommenter, StandardsStaff, AppealsBoard]
    code: 200
    input: ["ballot_id?", "membership_id?", "adjudicated_by_participant_id?", "position?", "status?", "adjudication_status?", "limit?", "offset?"]
    output: Vote[]
    side_effects: []
  - method: GET
    path: "/sdo/votes/{voteId}"
    description: "Fetch one vote including position, status, adjudication_status and position_change_count."
    roles: [Proposer, CommitteeMember, CommitteeChair, PublicCommenter, StandardsStaff, AppealsBoard]
    code: 200
    input: []
    output: Vote
    side_effects: []
  - method: PATCH
    path: "/sdo/votes/{voteId}"
    description: >-
      Change or withdraw one's own vote while the ballot is inside its half-open voting window.
      Supply position to change it (the CAST self-loop) or status WITHDRAWN to retract it.
    roles: [CommitteeMember, CommitteeChair]
    code: 200
    input: ["position?", "status?", "comment_text?"]
    output: Vote
    side_effects:
      - "position_change_count incremented on a position change"
      - "ballot tallies recomputed; vote_slot_conservation re-established after a withdrawal"
      - "increments Vote.version and Ballot.version by 1"
  - method: POST
    path: "/sdo/votes/{voteId}/adjudicate"
    description: >-
      Dispose of a pending negative. resolution PERSUASIVE or NON_PERSUASIVE is the chair's call;
      resolution WITHDRAWN_BY_VOTER may only be submitted by the voter who cast it.
    roles: [CommitteeChair, CommitteeMember]
    code: 200
    input: [resolution, adjudication_rationale]
    output: Vote
    side_effects:
      - "adjudicated_by_participant_id = X-User-ID; the underlying position may be rewritten"
      - "ballot_consensus_evaluation variant final_after_adjudication rewrites final_approval_pct, pending_negative_count and consensus_result"
      - "the linked Comment (source_vote_id) is set to ACCEPTED or REJECTED"
      - "when the last PENDING negative clears, the parent Draft leaves COMMENT_RESOLUTION and consensus_gate_evaluation re-runs"
      - "increments Vote.version, Ballot.version, Comment.version, Draft.version and WorkItem.version by 1"
  # --------------------------------------------------------------- Public reviews
  - method: POST
    path: "/sdo/public-reviews"
    description: >-
      Announce a public review period on a draft. start_date/end_date describe a closed inclusive
      window of at least MIN_REVIEW_DAYS. expected_draft_version is mandatory: it is the
      Draft.version the caller last read, and a mismatch is ERR_STALE_DRAFT_VERSION (412).
    roles: [StandardsStaff]
    code: 201
    input: [draft_id, start_date, end_date, expected_draft_version]
    output: PublicReview
    side_effects:
      - "review_window_buffer_check enforces MIN_REVIEW_DAYS and the REVIEW_BUFFER_DAYS collision rule"
      - "any still-SCHEDULED PublicReview on the same draft takes SCHEDULED_to_CANCELLED"
      - "the review is created OPEN when start_date <= current_utc, otherwise SCHEDULED"
      - "the parent Draft takes PUBLIC_REVIEW_READY_to_PUBLIC_REVIEW or the PUBLIC_REVIEW self-loop"
      - "increments Draft.version by 1"
  - method: GET
    path: "/sdo/public-reviews"
    description: "List public reviews, filterable by draft, disposition approver and status."
    roles: [Proposer, CommitteeMember, CommitteeChair, PublicCommenter, StandardsStaff, AppealsBoard]
    code: 200
    input: ["draft_id?", "disposition_approved_by_participant_id?", "status?", "limit?", "offset?"]
    output: PublicReview[]
    side_effects: []
  - method: GET
    path: "/sdo/public-reviews/{publicReviewId}"
    description: >-
      Fetch one public review including comment_count, disposed_count, unresolved_comment_count and
      disposition_completeness_pct.
    roles: [Proposer, CommitteeMember, CommitteeChair, PublicCommenter, StandardsStaff, AppealsBoard]
    code: 200
    input: []
    output: PublicReview
    side_effects: []
  - method: POST
    path: "/sdo/public-reviews/{publicReviewId}/close"
    description: >-
      Close a public review once current_utc is strictly past end_date. A review that drew no
      comments reaches DISPOSITION_APPROVED inside this same request.
    roles: [StandardsStaff]
    code: 200
    input: []
    output: PublicReview
    side_effects:
      - "closed_at = current_utc; comment_count frozen"
      - "public_review_disposition_completeness recomputes the disposition counters"
      - "the zero-comment branch takes CLOSED_to_DISPOSITION_APPROVED immediately"
      - "the parent Draft takes PUBLIC_REVIEW_to_PUBLIC_REVIEW_CLOSED"
      - "increments PublicReview.version and Draft.version by 1"
  - method: POST
    path: "/sdo/public-reviews/{publicReviewId}/approve-disposition"
    description: >-
      Approve the comment disposition record for a closed review. Requires
      disposition_completeness_pct 100.0 and an approver who is not the sponsoring committee's chair:
      a CommitteeChair whose X-User-ID equals that chair is rejected with
      ERR_DISPOSITION_APPROVER_CONFLICT.
    roles: [StandardsStaff, CommitteeChair]
    code: 200
    input: []
    output: PublicReview
    side_effects:
      - "disposition_approved_by_participant_id = X-User-ID when the caller is a CommitteeChair, and null for the opaque StandardsStaff role; disposition_approved_at = current_utc either way"
      - "the draft becomes eligible for a CONSENSUS_BODY ballot"
      - "increments PublicReview.version by 1"
  # -------------------------------------------------------------------- Comments
  - method: POST
    path: "/sdo/comments"
    description: >-
      Submit a comment. source_type PUBLIC_REVIEW requires public_review_id and a review in status
      OPEN; source_type COMMITTEE requires draft_id. Comments with source_type BALLOT_NEGATIVE are
      only ever created by the server from a NEGATIVE vote and cannot be posted here.
      submitter_participant_id must equal X-User-ID.
    roles: [PublicCommenter, CommitteeMember, CommitteeChair, Proposer]
    code: 201
    input: [source_type, comment_type, comment_text, submitter_participant_id, "draft_id?", "public_review_id?", "clause_reference?", "is_substantive?"]
    output: Comment
    side_effects:
      - "public_review_disposition_completeness recomputes comment_count, unresolved_comment_count and disposition_completeness_pct on the parent review"
      - "increments PublicReview.version by 1 when public_review_id is supplied"
  - method: GET
    path: "/sdo/comments"
    description: "List comments, filterable by draft, ballot, public review, source vote, submitter and status."
    roles: [Proposer, CommitteeMember, CommitteeChair, PublicCommenter, StandardsStaff, AppealsBoard]
    code: 200
    input: ["draft_id?", "ballot_id?", "public_review_id?", "source_vote_id?", "submitter_participant_id?", "source_type?", "status?", "limit?", "offset?"]
    output: Comment[]
    side_effects: []
  - method: GET
    path: "/sdo/comments/{commentId}"
    description: "Fetch one comment including its disposition status and disposition_rationale."
    roles: [Proposer, CommitteeMember, CommitteeChair, PublicCommenter, StandardsStaff, AppealsBoard]
    code: 200
    input: []
    output: Comment
    side_effects: []
  - method: POST
    path: "/sdo/comments/{commentId}/disposition"
    description: >-
      Record a comment disposition. disposition accepts ACCEPTED, ACCEPTED_WITH_MODIFICATION,
      REJECTED (each requiring disposition_rationale) or REOPENED, which reverses an earlier
      disposition and its bubble-up.
    roles: [CommitteeChair]
    code: 200
    input: [disposition, "disposition_rationale?"]
    output: Comment
    side_effects:
      - "public_review_disposition_completeness recomputes the parent review's counters"
      - "the parent review bubbles CLOSED -> DISPOSITION_DRAFTED at zero unresolved comments and reverses on REOPENED"
      - "comment_disposition_conservation re-established in both directions"
      - "increments Comment.version and PublicReview.version by 1"
  # ---------------------------------------------------------- Patent disclosures
  - method: POST
    path: "/sdo/patent-disclosures"
    description: >-
      Record a patent disclosure against a work item. essentiality accepts ESSENTIAL,
      POTENTIALLY_ESSENTIAL or NOT_ESSENTIAL and the row starts in status DISCLOSED_NO_COMMITMENT.
      expected_work_item_version is mandatory: it is the WorkItem.version the caller last read, and
      a mismatch is ERR_STALE_WORK_ITEM_VERSION (412). disclosing_participant_id must equal X-User-ID.
    roles: [CommitteeMember, CommitteeChair, PublicCommenter, Proposer]
    code: 201
    input: [work_item_id, disclosing_participant_id, patent_number, essentiality, expected_work_item_version]
    output: PatentDisclosure
    side_effects:
      - "patent_clearance_evaluation rewrites WorkItem.ip_status and this row's blocks_publication"
      - "a late blocking disclosure can take WorkItem ip_status IP_CLEARED -> IP_BLOCKED"
      - "increments WorkItem.version by 1"
  - method: GET
    path: "/sdo/patent-disclosures"
    description: "List patent disclosures, filterable by work item, discloser, essentiality and commitment status."
    roles: [Proposer, CommitteeMember, CommitteeChair, PublicCommenter, StandardsStaff, AppealsBoard]
    code: 200
    input: ["work_item_id?", "disclosing_participant_id?", "essentiality?", "status?", "limit?", "offset?"]
    output: PatentDisclosure[]
    side_effects: []
  - method: GET
    path: "/sdo/patent-disclosures/{patentDisclosureId}"
    description: "Fetch one patent disclosure including blocks_publication."
    roles: [Proposer, CommitteeMember, CommitteeChair, PublicCommenter, StandardsStaff, AppealsBoard]
    code: 200
    input: []
    output: PatentDisclosure
    side_effects: []
  - method: POST
    path: "/sdo/patent-disclosures/{patentDisclosureId}/commitment"
    description: >-
      Record the licensing commitment for a disclosure. commitment accepts RAND, RAND_ZERO, REFUSE or
      WITHDRAW, mapping to status RAND_COMMITTED, RAND_ZERO_COMMITTED, REFUSED or WITHDRAWN.
      commitment_letter_ref is required for RAND and RAND_ZERO.
    roles: [CommitteeMember, CommitteeChair, PublicCommenter, Proposer]
    code: 200
    input: [commitment, "commitment_letter_ref?"]
    output: PatentDisclosure
    side_effects:
      - "committed_at = current_utc for RAND and RAND_ZERO"
      - "patent_clearance_evaluation rewrites WorkItem.ip_status and blocks_publication"
      - "increments PatentDisclosure.version and WorkItem.version by 1"
  # --------------------------------------------------------------------- Appeals
  - method: POST
    path: "/sdo/appeals"
    description: >-
      File an appeal alleging a procedural violation. grounds accepts BALANCE_VIOLATION,
      NEGATIVE_NOT_CONSIDERED, PUBLIC_REVIEW_DEFECT, IP_DISCLOSURE_DEFECT or
      VOTING_PROCEDURE_DEFECT. Supply cited_ballot_id to anchor the 30-day window on that ballot's
      closed_at; omit it to anchor on the standard's published_at. appellant_participant_id must
      equal X-User-ID and must be an interested party.
    roles: [Proposer, CommitteeMember, CommitteeChair, PublicCommenter]
    code: 201
    input: [work_item_id, appellant_participant_id, grounds, statement, "cited_ballot_id?"]
    output: Appeal
    side_effects:
      - "appeal_timeliness writes filing_deadline_at and enforces ERR_APPEAL_UNTIMELY"
      - "filed_at = current_utc; status FILED"
      - "consensus_gate_evaluation sets WorkItem.consensus_gate to BLOCKED"
      - "increments WorkItem.version by 1"
  - method: GET
    path: "/sdo/appeals"
    description: "List appeals, filterable by work item, appellant, cited ballot and status."
    roles: [Proposer, CommitteeMember, CommitteeChair, PublicCommenter, StandardsStaff, AppealsBoard]
    code: 200
    input: ["work_item_id?", "appellant_participant_id?", "cited_ballot_id?", "grounds?", "status?", "limit?", "offset?"]
    output: Appeal[]
    side_effects: []
  - method: GET
    path: "/sdo/appeals/{appealId}"
    description: "Fetch one appeal including filing_deadline_at, remedy and decision_rationale."
    roles: [Proposer, CommitteeMember, CommitteeChair, PublicCommenter, StandardsStaff, AppealsBoard]
    code: 200
    input: []
    output: Appeal
    side_effects: []
  - method: POST
    path: "/sdo/appeals/{appealId}/decide"
    description: >-
      Decide an appeal. decision accepts ACCEPT_FOR_REVIEW, UPHOLD or DENY. UPHOLD requires a remedy
      of VACATE_BALLOT, REMAND_TO_COMMITTEE or SUSPEND_STANDARD and runs the four-hop remedy cascade;
      DENY leaves the ballot, draft and work item progress untouched.
    roles: [AppealsBoard]
    code: 200
    input: [decision, decision_rationale, "remedy?"]
    output: Appeal
    side_effects:
      - "cascade hop 1: Appeal status and remedy recorded; decided_at = current_utc on UPHOLD or DENY"
      - "cascade hop 2: with remedy VACATE_BALLOT the cited Ballot takes EVALUATED_to_VACATED or OPEN_to_VACATED"
      - "cascade hop 3: because that ballot was vacated, the Draft takes APPROVED_to_DRAFTING and inherits carryover_unresolved_negative_count = the vacated ballot's negative_count"
      - "cascade hop 4: because the draft returned to development, the WorkItem takes CONSENSUS_APPROVED_to_IN_DEVELOPMENT and consensus_gate_evaluation re-runs"
      - "with remedy SUSPEND_STANDARD a PUBLISHED WorkItem takes PUBLISHED_to_SUSPENDED instead"
      - "any ballot hold_reason APPEAL_PENDING is released on DENY"
      - "increments Appeal.version, Ballot.version, Draft.version and WorkItem.version by 1"
  # ----------------------------------------------------------- Maintenance items
  - method: POST
    path: "/sdo/maintenance-items"
    description: >-
      Submit an interpretation request or an erratum report against a work item. item_kind accepts
      INTERPRETATION_REQUEST or ERRATUM_REPORT. requester_participant_id must equal X-User-ID.
    roles: [PublicCommenter, CommitteeMember, CommitteeChair, Proposer]
    code: 201
    input: [work_item_id, requester_participant_id, item_kind, question_text, "clause_reference?"]
    output: MaintenanceItem
    side_effects:
      - "received_at = current_utc; status RECEIVED"
  - method: GET
    path: "/sdo/maintenance-items"
    description: "List maintenance items, filterable by work item, requester, kind and status."
    roles: [Proposer, CommitteeMember, CommitteeChair, PublicCommenter, StandardsStaff, AppealsBoard]
    code: 200
    input: ["work_item_id?", "requester_participant_id?", "item_kind?", "status?", "limit?", "offset?"]
    output: MaintenanceItem[]
    side_effects: []
  - method: GET
    path: "/sdo/maintenance-items/{maintenanceItemId}"
    description: "Fetch one maintenance item including response_text and erratum_clause_reference."
    roles: [Proposer, CommitteeMember, CommitteeChair, PublicCommenter, StandardsStaff, AppealsBoard]
    code: 200
    input: []
    output: MaintenanceItem
    side_effects: []
  - method: POST
    path: "/sdo/maintenance-items/{maintenanceItemId}/resolve"
    description: >-
      Resolve a maintenance item. action accepts ISSUE_INTERPRETATION (INTERPRETATION_REQUEST only,
      CommitteeChair), ISSUE_ERRATUM (ERRATUM_REPORT only, StandardsStaff, requires
      erratum_clause_reference) or DECLINE (either kind, either role).
    roles: [CommitteeChair, StandardsStaff]
    code: 200
    input: [action, response_text, "erratum_clause_reference?"]
    output: MaintenanceItem
    side_effects:
      - "resolved_at = current_utc"
      - "WorkItem.interpretation_count incremented on ISSUE_INTERPRETATION; WorkItem.errata_count incremented on ISSUE_ERRATUM; neither on DECLINE"
      - "WorkItem.edition and published_at are never changed by a maintenance resolution"
      - "increments MaintenanceItem.version and WorkItem.version by 1"
  # ------------------------------------------------------ Test-driving endpoints
  - method: POST
    path: "/_clock/set_current_utc"
    description: >-
      Set the server's logical clock to any ISO-8601 UTC instant. The logical clock's startup
      default is exactly 2026-08-01T00:00:00Z: before any call to this endpoint the server reads
      that instant and MUST NOT fall back to real wall-clock time. Every deadline, window and
      expiry rule in this scaffold is evaluated against this logical clock. Setting the clock also
      promotes every SCHEDULED PublicReview whose start_date has been reached to OPEN, returning
      their ids. Declared under the /_ namespace because no business operation can move time.
    roles: [StandardsStaff]
    code: 200
    input: [to_iso8601]
    output: "{ current_utc: string, promoted_public_review_ids: string[] }"
    side_effects:
      - "PublicReview rows take SCHEDULED_to_OPEN when current_utc >= start_date"
      - "increments PublicReview.version by 1 for each promoted review"
      - "no other entity is mutated; ballots and reviews are never auto-closed by the clock"

errors:
  # ------------------------------------------------------------------ auth (10-20)
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "X-User-Role or X-User-ID header missing or empty on any endpoint."
  - id: ERR_UNAUTHORIZED
    http: 403
    condition: "X-User-Role is not a declared role, or the role is not listed on the target endpoint."
  # -------------------------------------------------------------- existence (30-50)
  - id: ERR_PARTICIPANT_NOT_FOUND
    http: 404
    condition: "A participantId path segment, or a participant-typed body FK, references no stored Participant."
  - id: ERR_COMMITTEE_NOT_FOUND
    http: 404
    condition: "A committeeId path segment, or committee_id / sponsoring_committee_id in a body, references no stored TechnicalCommittee."
  - id: ERR_MEMBERSHIP_NOT_FOUND
    http: 404
    condition: "A membershipId path segment, or membership_id in a body, references no stored CommitteeMembership."
  - id: ERR_WORK_ITEM_NOT_FOUND
    http: 404
    condition: "A workItemId path segment, or work_item_id in a body, references no stored WorkItem."
  - id: ERR_DRAFT_NOT_FOUND
    http: 404
    condition: "A draftId path segment, or draft_id / prior_draft_id in a body, references no stored Draft."
  - id: ERR_BALLOT_NOT_FOUND
    http: 404
    condition: "A ballotId path segment, or predecessor_ballot_id / cited_ballot_id in a body, references no stored Ballot."
  - id: ERR_VOTE_NOT_FOUND
    http: 404
    condition: "A voteId path segment references no stored Vote."
  - id: ERR_COMMENT_NOT_FOUND
    http: 404
    condition: "A commentId path segment references no stored Comment."
  - id: ERR_PUBLIC_REVIEW_NOT_FOUND
    http: 404
    condition: "A publicReviewId path segment, or public_review_id in a body, references no stored PublicReview."
  - id: ERR_PATENT_DISCLOSURE_NOT_FOUND
    http: 404
    condition: "A patentDisclosureId path segment references no stored PatentDisclosure."
  - id: ERR_APPEAL_NOT_FOUND
    http: 404
    condition: "An appealId path segment references no stored Appeal."
  - id: ERR_MAINTENANCE_ITEM_NOT_FOUND
    http: 404
    condition: "A maintenanceItemId path segment references no stored MaintenanceItem."
  # ------------------------------------------------------------ request shape (40)
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: >-
      A required input field is absent, an enum field carries an undeclared member, a numeric field
      is out of range, a date or datetime field does not parse, limit is outside 1..100, offset is
      negative, an unknown body field is present, a computed or system field is supplied, or an
      UPHOLD decision omits remedy.
  # ------------------------------------------------------------- identity (60-64)
  - id: ERR_NOT_COMMITTEE_CHAIR
    http: 403
    condition: "X-User-ID is not the chair_participant_id of the committee that governs the target resource."
  - id: ERR_NOT_VOTE_OWNER
    http: 403
    condition: "X-User-ID is not the participant behind the target Vote's membership, on a vote-owner-only operation."
  - id: ERR_ACTOR_IDENTITY_MISMATCH
    http: 403
    condition: >-
      An entity_backed caller's X-User-ID does not resolve to a stored Participant, or a submitter
      identity field in the body (proposer_participant_id, submitter_participant_id,
      disclosing_participant_id, appellant_participant_id, requester_participant_id) or the
      membership behind membership_id belongs to a different participant.
  # ------------------------------------------------------------------ state (70-79)
  - id: ERR_INVALID_DRAFT_STATE
    http: 409
    condition: "The target Draft's status does not permit the requested operation."
  - id: ERR_INVALID_WORK_ITEM_STATE
    http: 409
    condition: "The target WorkItem's progress_status does not permit the requested operation."
  - id: ERR_BALLOT_NOT_OPEN
    http: 409
    condition: "The target Ballot is not in status OPEN."
  - id: ERR_INVALID_PUBLIC_REVIEW_STATE
    http: 409
    condition: "The target PublicReview's status does not permit the requested operation, including reopening a comment on a DISPOSITION_APPROVED review."
  - id: ERR_INVALID_COMMENT_STATE
    http: 409
    condition: "The target Comment is not OPEN for a disposing action, or is OPEN for a REOPENED action."
  - id: ERR_INVALID_APPEAL_STATE
    http: 409
    condition: "The target Appeal is already UPHELD or DENIED, or ACCEPT_FOR_REVIEW is requested on an appeal not in FILED."
  - id: ERR_INVALID_MAINTENANCE_STATE
    http: 409
    condition: "The target MaintenanceItem is not in status RECEIVED."
  - id: ERR_VOTE_NOT_ADJUDICABLE
    http: 409
    condition: "The target Vote's adjudication_status is not PENDING, or its status is WITHDRAWN."
  - id: ERR_COMMITTEE_NOT_ACTIVE
    http: 409
    condition: "The governing TechnicalCommittee's status is FORMING or SUSPENDED where ACTIVE is required."
  - id: ERR_STANDARD_NOT_PUBLISHED
    http: 409
    condition: "An erratum is being issued against a WorkItem whose progress_status is not PUBLISHED, REAFFIRMED or UNDER_PERIODIC_REVIEW."
  # ------------------------------------------------------------- concurrency (80-81)
  - id: ERR_STALE_DRAFT_VERSION
    http: 412
    condition: "expected_draft_version does not equal the stored Draft.version on POST /sdo/public-reviews."
  - id: ERR_STALE_WORK_ITEM_VERSION
    http: 412
    condition: "expected_work_item_version does not equal the stored WorkItem.version on POST /sdo/patent-disclosures."
  # ------------------------------------------------------------------ safety (90-98)
  - id: ERR_NEGATIVES_NOT_CONSIDERED
    http: 409
    condition: "A draft is being superseded, or a work item published, while at least one Vote on its ballots has adjudication_status PENDING."
  - id: ERR_CONSENSUS_GATE_BLOCKED
    http: 409
    condition: "WorkItem.consensus_gate is BLOCKED — an appeal is live, a draft sits in COMMENT_RESOLUTION, or the sponsoring committee is not ACTIVE and BALANCED."
  - id: ERR_IP_NOT_CLEARED
    http: 409
    condition: "WorkItem.ip_status is not IP_CLEARED at publication — IP_BLOCKED because an essential or potentially-essential patent has no licensing commitment, or still IP_PENDING / IP_DISCLOSED because no consensus approval has closed the call for patents."
  - id: ERR_PUBLIC_REVIEW_NOT_APPROVED
    http: 409
    condition: "A CONSENSUS_BODY ballot is requested while the draft's most recent PublicReview is not DISPOSITION_APPROVED."
  - id: ERR_DISPOSITION_INCOMPLETE
    http: 409
    condition: "approve-disposition is requested while PublicReview.disposition_completeness_pct is below 100.0."
  - id: ERR_SELF_ADJUDICATION
    http: 403
    condition: "The chair adjudicating a negative is the same participant who cast it."
  - id: ERR_DISPOSITION_APPROVER_CONFLICT
    http: 403
    condition: "The approver of a comment disposition record is the chair of the committee that authored those dispositions."
  - id: ERR_APPELLANT_NOT_INTERESTED_PARTY
    http: 403
    condition: >-
      The appellant is neither the work item's proposer, nor the holder of an ACTIVE or SUSPENDED
      membership on the sponsoring committee, nor the submitter of any comment on the work item's
      drafts.
  - id: ERR_NEGATIVE_REQUIRES_COMMENT
    http: 400
    condition: "A vote is cast or changed to NEGATIVE without comment_text and with no existing linked comment."
  # -------------------------------------------------------------- constraint (100-108)
  - id: ERR_COMMITTEE_NOT_BALANCED
    http: 409
    condition: "The committee's balance_status is not BALANCED under committee_balance_evaluation variant voting_basis."
  - id: ERR_CHAIR_NOT_MEMBER
    http: 409
    condition: "Activation is requested while the committee's chair_participant_id holds no ACTIVE membership on that committee."
  - id: ERR_INVALID_COMMITTEE_STATE
    http: 409
    condition: "Activation is requested on a committee whose status is already ACTIVE."
  - id: ERR_DUPLICATE_MEMBERSHIP
    http: 409
    condition: "The participant already holds a membership with status ACTIVE or SUSPENDED on this committee."
  - id: ERR_AFFILIATION_ALREADY_REPRESENTED
    http: 409
    condition: "Another ACTIVE or SUSPENDED membership on this committee already carries the same employer_affiliation_code."
  - id: ERR_DUPLICATE_VOTE
    http: 409
    condition: "The acting membership already holds a Vote with status CAST on this ballot."
  - id: ERR_VOTER_NOT_ELIGIBLE
    http: 409
    condition: >-
      The acting membership is not ACTIVE with voting_rights true on the ballot's committee, or is
      outside the recirculation eligible set of a RECIRCULATION ballot.
  - id: ERR_BALLOT_CAPACITY_EXCEEDED
    http: 409
    condition: "The candidate ballot window overlaps max_concurrent_ballots or more OPEN/CLOSED ballots on the same committee."
  - id: ERR_MAINTENANCE_ACTION_MISMATCH
    http: 409
    condition: "ISSUE_INTERPRETATION is requested on an ERRATUM_REPORT, or ISSUE_ERRATUM on an INTERPRETATION_REQUEST."
  - id: ERR_REAFFIRMATION_BALLOT_REQUIRED
    http: 409
    condition: "action REAFFIRM is requested with no EVALUATED REAFFIRMATION ballot whose consensus_result is APPROVED on the latest draft."
  # ---------------------------------------------------------------- temporal (110-119)
  - id: ERR_BALLOT_WINDOW_TOO_SHORT
    http: 409
    condition: "closes_at - opens_at is fewer whole days than MIN_BALLOT_DAYS for the effective ballot kind, or closes_at is not after opens_at."
  - id: ERR_BALLOT_NOT_ENDED
    http: 409
    condition: "Close is requested before closes_at while at least one eligible seat has not returned."
  - id: ERR_BALLOT_NOT_IN_VOTING_WINDOW
    http: 409
    condition: "A vote is cast or changed outside the half-open window [opens_at, closes_at)."
  - id: ERR_REVIEW_PERIOD_TOO_SHORT
    http: 409
    condition: "The inclusive day count from start_date to end_date is below MIN_REVIEW_DAYS, or end_date precedes start_date."
  - id: ERR_REVIEW_NOT_ENDED
    http: 409
    condition: "Close is requested while current_utc is not strictly after the review's end_date."
  - id: ERR_REVIEW_WINDOW_BUFFER_CONFLICT
    http: 409
    condition: "The candidate review window collides with an existing OPEN, CLOSED, DISPOSITION_DRAFTED or DISPOSITION_APPROVED review on the same work item once both are widened by REVIEW_BUFFER_DAYS."
  - id: ERR_APPEAL_ANCHOR_MISSING
    http: 409
    condition: "The cited ballot has no closed_at, or no ballot was cited and the work item has no published_at."
  - id: ERR_APPEAL_UNTIMELY
    http: 409
    condition: "current_utc is later than anchor_at + APPEAL_WINDOW_DAYS."
  - id: ERR_PERIODIC_REVIEW_NOT_DUE
    http: 409
    condition: "A periodic-review action is requested before periodic_review_due_date - REVIEW_LEAD_DAYS."
  - id: ERR_REAFFIRMATION_WINDOW_EXPIRED
    http: 409
    condition: "action REAFFIRM is requested after periodic_review_due_date + REAFFIRMATION_GRACE_DAYS."

roles:
  - name: Proposer
    description: >-
      A participant who submits work item proposals, comments on drafts, discloses patents, files
      appeals and requests interpretations. Every participant may act in this role for the items
      they own.
    identity: "entity_backed:Participant"
    exclusive_operations: []
    shared_operations:
      - "POST /sdo/work-items"
      - "POST /sdo/comments"
      - "POST /sdo/patent-disclosures"
      - "POST /sdo/patent-disclosures/{patentDisclosureId}/commitment"
      - "POST /sdo/appeals"
      - "POST /sdo/maintenance-items"
      - "all GET endpoints under /sdo"
  - name: CommitteeMember
    description: >-
      A participant holding a CommitteeMembership. Casts, changes and withdraws votes, and may
      withdraw their own pending negative during adjudication.
    identity: "entity_backed:Participant"
    exclusive_operations:
      - "POST /sdo/ballots/{ballotId}/votes"
      - "PATCH /sdo/votes/{voteId}"
      - "POST /sdo/votes/{voteId}/adjudicate with resolution WITHDRAWN_BY_VOTER"
    shared_operations:
      - "POST /sdo/work-items"
      - "POST /sdo/comments"
      - "POST /sdo/patent-disclosures"
      - "POST /sdo/patent-disclosures/{patentDisclosureId}/commitment"
      - "POST /sdo/appeals"
      - "POST /sdo/maintenance-items"
      - "all GET endpoints under /sdo"
  - name: CommitteeChair
    description: >-
      The participant recorded as a committee's chair_participant_id. Opens ballots, closes them,
      adjudicates negatives, dispositions comments, drafts revisions and issues interpretations.
      Because the chair is also a member, the chair may vote — which is exactly why
      ERR_SELF_ADJUDICATION and ERR_DISPOSITION_APPROVER_CONFLICT exist.
    identity: "entity_backed:Participant"
    exclusive_operations:
      - "POST /sdo/ballots"
      - "POST /sdo/comments/{commentId}/disposition"
      - "POST /sdo/votes/{voteId}/adjudicate with resolution PERSUASIVE or NON_PERSUASIVE"
    shared_operations:
      - "POST /sdo/work-items/{workItemId}/drafts"
      - "POST /sdo/ballots/{ballotId}/close"
      - "POST /sdo/ballots/{ballotId}/votes"
      - "PATCH /sdo/votes/{voteId}"
      - "POST /sdo/public-reviews/{publicReviewId}/approve-disposition"
      - "POST /sdo/maintenance-items/{maintenanceItemId}/resolve"
      - "POST /sdo/work-items"
      - "POST /sdo/comments"
      - "POST /sdo/patent-disclosures"
      - "POST /sdo/patent-disclosures/{patentDisclosureId}/commitment"
      - "POST /sdo/appeals"
      - "POST /sdo/maintenance-items"
      - "all GET endpoints under /sdo"
  - name: PublicCommenter
    description: >-
      A participant with no committee seat who takes part through the public review period, patent
      disclosure, appeals and maintenance requests.
    identity: "entity_backed:Participant"
    exclusive_operations: []
    shared_operations:
      - "POST /sdo/comments"
      - "POST /sdo/patent-disclosures"
      - "POST /sdo/patent-disclosures/{patentDisclosureId}/commitment"
      - "POST /sdo/appeals"
      - "POST /sdo/maintenance-items"
      - "all GET endpoints under /sdo"
  - name: StandardsStaff
    description: >-
      The organization's secretariat. Registers participants, forms and activates committees,
      appoints and suspends seats, approves scopes, announces and closes public reviews, approves
      disposition records, publishes standards, runs periodic review, issues errata and drives the
      logical clock. An operational role, not a participant.
    identity: opaque
    exclusive_operations:
      - "POST /sdo/participants"
      - "POST /sdo/committees"
      - "POST /sdo/committees/{committeeId}/memberships"
      - "PATCH /sdo/memberships/{membershipId}"
      - "POST /sdo/committees/{committeeId}/activate"
      - "POST /sdo/work-items/{workItemId}/approve-scope"
      - "POST /sdo/public-reviews"
      - "POST /sdo/public-reviews/{publicReviewId}/close"
      - "POST /sdo/work-items/{workItemId}/publish"
      - "POST /sdo/work-items/{workItemId}/periodic-review"
      - "POST /_clock/set_current_utc"
    shared_operations:
      - "POST /sdo/work-items/{workItemId}/drafts"
      - "POST /sdo/ballots/{ballotId}/close"
      - "POST /sdo/public-reviews/{publicReviewId}/approve-disposition"
      - "POST /sdo/maintenance-items/{maintenanceItemId}/resolve"
      - "all GET endpoints under /sdo"
  - name: AppealsBoard
    description: >-
      The independent panel that decides appeals of procedural violations. It is deliberately barred
      from every other mutation so that a body which can vacate a ballot can never have participated
      in it.
    identity: opaque
    exclusive_operations:
      - "POST /sdo/appeals/{appealId}/decide"
    shared_operations:
      - "all GET endpoints under /sdo"
