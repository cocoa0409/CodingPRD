# ---------------------------------------------------------------------------
# §1.9 Scaffold Corner Design - breadth probe over SCAFFOLD.yaml's §1.1-§1.7
# surface. Walked row-by-row against references/claim-extraction-guide.md.
# Corners already asserted by SCAFFOLD_DIFFICULTY_DESIGN.yaml are emitted as
# `excluded_because:` stubs citing the covering §1.8 instance by name.
# ---------------------------------------------------------------------------
scaffold_corner_design:

  # =========================================================================
  - section: entities
    instances:

      - name: agency_creation_returns_computed_effective_cap_and_zero_usage
        claim_type: creation
        grounds:
          - "entities.Agency.fields.effective_submission_cap"
          - "entities.Agency.fields.submissions_used_count"
          - "calculations.agency_submission_quota"
          - "endpoints[POST /agencies]"
        distinguishing_aspect: "A STANDARD-tier agency created with annual_submission_cap 5 comes back with effective_submission_cap == 5 and submissions_used_count == 0 - both computed, neither accepted as input."
        test_recipe:
          setup:
            - "empty database; the logical clock is pinned to 2026-08-01T00:00:00Z"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /agencies"
              payload: { name: "Halcyon Talent Partners", agency_code: "HAL", relationship_tier: "STANDARD", packaging_allowed: true, annual_submission_cap: 5 }
              as: PlatformAdmin
          assert:
            - "HTTP 201 and the envelope carries meta.api_request_id, meta.api_request_timestamp and response_type == \"object\""
            - "Agency.name == \"Halcyon Talent Partners\" and Agency.agency_code == \"HAL\""
            - "Agency.relationship_tier == \"STANDARD\" and Agency.packaging_allowed == true"
            - "Agency.annual_submission_cap == 5 and Agency.effective_submission_cap == 5"
            - "Agency.submissions_used_count == 0"
            - "Agency.id is a UUID with no type prefix, Agency.version == 1, created_at and updated_at are present"

      - name: slate_retrieval_returns_a_zeroed_ledger_and_open_posture
        claim_type: retrieval
        grounds:
          - "entities.Slate.fields.available_dev_cents"
          - "entities.Slate.fields.available_episode_count"
          - "entities.Slate.fields.posture"
          - "calculations.slate_dev_budget_ledger"
          - "calculations.slate_episode_inventory"
          - "endpoints[GET /slates/{id}]"
        distinguishing_aspect: "A freshly created slate with no deals, holds, pilots or negotiations reports every derived ledger field at 0, available_dev_cents equal to total_dev_budget_cents (400000000), available_episode_count == episode_capacity (20) and posture OPEN."
        test_recipe:
          setup:
            - "one STREAMING slate for season 2027 exists with total_dev_budget_cents 400000000 and episode_capacity 20; nothing else exists"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /slates"
              payload: { platform: "STREAMING", season_year: 2027, total_dev_budget_cents: 400000000, pattern_budget_per_episode_cents: 32000000, license_fee_cap_per_episode_cents: 30000000, max_deficit_per_episode_cents: 7000000, episode_capacity: 20, default_episode_count: 10, max_backend_points_bps: 2000, max_concurrent_pilot_shoots: 2 }
              as: PlatformAdmin
              captures: { slate_id: $.data.id }
          trigger:
            - call: "GET /slates/${slate_id}"
              payload: {}
              as: FinanceController
          assert:
            - "HTTP 200 and response_type == \"object\""
            - "Slate.committed_dev_cents == 0, Slate.reserved_holding_cents == 0, Slate.writeoff_dev_cents == 0, Slate.recouped_dev_cents == 0"
            - "Slate.available_dev_cents == 400000000"
            - "Slate.committed_episode_count == 0, Slate.reserved_episode_count == 0, Slate.available_episode_count == 20"
            - "Slate.posture == \"OPEN\""
            - "Slate.version == 1"

      - name: writer_listing_filters_by_agency_and_honours_limit_and_offset
        claim_type: listing
        grounds:
          - "endpoints[GET /writers]"
          - "entities.Writer.fields.agency_id"
          - "response_envelope.pagination_fields"
        distinguishing_aspect: "With two writers on Halcyon and one on Meridian, GET /writers?agency_id=<halcyon> returns exactly the two Halcyon writers and meta.total_count == 2; adding limit=1 returns one row with has_more == true."
        test_recipe:
          setup:
            - "two agencies (HAL, MER) exist; Ada Reyes and Bo Nakamura belong to HAL, Cyd Okonkwo belongs to MER"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /agencies"
              payload: { name: "Halcyon Talent Partners", agency_code: "HAL", relationship_tier: "STANDARD", packaging_allowed: true, annual_submission_cap: 5 }
              as: PlatformAdmin
              captures: { ag_id: $.data.id }
            - call: "POST /agencies"
              payload: { name: "Meridian Artists", agency_code: "MER", relationship_tier: "STANDARD", packaging_allowed: false, annual_submission_cap: 3 }
              as: PlatformAdmin
              captures: { ag2_id: $.data.id }
            - call: "POST /writers"
              payload: { full_name: "Ada Reyes", agency_id: "${ag_id}", guild_minimum_tier: "HIGH", quote_per_step_cents: 5000000 }
              as: AgencyRep
              as_user_id: "${ag_id}"
              captures: { wr_id: $.data.id }
            - call: "POST /writers"
              payload: { full_name: "Bo Nakamura", agency_id: "${ag_id}", guild_minimum_tier: "LOW", quote_per_step_cents: 5000000 }
              as: AgencyRep
              as_user_id: "${ag_id}"
              captures: { wr2_id: $.data.id }
            - call: "POST /writers"
              payload: { full_name: "Cyd Okonkwo", agency_id: "${ag2_id}", guild_minimum_tier: "HIGH", quote_per_step_cents: 4000000 }
              as: AgencyRep
              as_user_id: "${ag2_id}"
              captures: { wr3_id: $.data.id }
          trigger:
            - call: "GET /writers"
              payload: { agency_id: "${ag_id}", limit: 10, offset: 0 }
              as: PlatformAdmin
            - call: "GET /writers"
              payload: { agency_id: "${ag_id}", limit: 1, offset: 0 }
              as: PlatformAdmin
          assert:
            - "the first call returns HTTP 200, response_type == \"array\", exactly 2 Writer objects, and meta.total_count == 2 with has_more == false"
            - "every returned Writer has agency_id == ${ag_id}; ${wr3_id} (Cyd Okonkwo) is absent from the payload"
            - "the second call returns exactly 1 Writer object with meta.total_count == 2, meta.limit == 1, meta.offset == 0 and has_more == true"

      - name: script_deal_retrieval_with_an_unknown_id_returns_not_found
        claim_type: not_found
        grounds:
          - "endpoints[GET /script-deals/{id}]"
          - "validations[priority=7]"
          - "errors[ERR_SCRIPT_DEAL_NOT_FOUND]"
        distinguishing_aspect: "A syntactically valid UUID that names no ScriptDeal row returns ERR_SCRIPT_DEAL_NOT_FOUND with HTTP 404, not an empty 200 body."
        test_recipe:
          setup:
            - "the clock is pinned; no ScriptDeal rows exist"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "GET /script-deals/2f6d1a90-77c4-4b0e-9a31-5c8e0b6f42d1"
              payload: {}
              as: BusinessAffairs
          assert:
            - "HTTP 404, response_type == \"error\", data.error_id == \"ERR_SCRIPT_DEAL_NOT_FOUND\""

      - name: script_deal_create_missing_required_guaranteed_step_count_rejected
        claim_type: required_fields
        grounds:
          - "endpoints[POST /script-deals]"
          - "validations[priority=9]"
          - "errors[ERR_INVALID_REQUEST]"
        distinguishing_aspect: "guaranteed_step_count has source: input with no default, so omitting it from an otherwise valid POST /script-deals body returns ERR_INVALID_REQUEST (400) and no ScriptDeal row is created."
        test_recipe:
          setup:
            - "project \"Fault Lines\" is in ACTIVE_DEVELOPMENT on the STREAMING slate and writer Ada Reyes exists; no ScriptDeal rows exist"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /agencies"
              payload: { name: "Halcyon Talent Partners", agency_code: "HAL", relationship_tier: "STANDARD", packaging_allowed: true, annual_submission_cap: 5 }
              as: PlatformAdmin
              captures: { ag_id: $.data.id }
            - call: "POST /slates"
              payload: { platform: "STREAMING", season_year: 2027, total_dev_budget_cents: 400000000, pattern_budget_per_episode_cents: 32000000, license_fee_cap_per_episode_cents: 30000000, max_deficit_per_episode_cents: 7000000, episode_capacity: 20, default_episode_count: 10, max_backend_points_bps: 2000, max_concurrent_pilot_shoots: 2 }
              as: PlatformAdmin
              captures: { slate_id: $.data.id }
            - call: "POST /writers"
              payload: { full_name: "Ada Reyes", agency_id: "${ag_id}", guild_minimum_tier: "HIGH", quote_per_step_cents: 5000000 }
              as: AgencyRep
              as_user_id: "${ag_id}"
              captures: { wr_id: $.data.id }
            - call: "POST /pitches"
              payload: { agency_id: "${ag_id}", slate_id: "${slate_id}", title: "Fault Lines", logline: "A seismologist predicts the quake nobody wants to hear about.", packaging_elements: [], underlying_ip_key: "IP-FAULT-LINES" }
              as: AgencyRep
              as_user_id: "${ag_id}"
              captures: { pitch_id: $.data.id }
            - call: "POST /pitches/${pitch_id}/rights-checks"
              payload: { underlying_ip_key: "IP-FAULT-LINES", chain_of_title_status: "CLEAN", holdback_start_date: "2026-01-01", holdback_end_date: "2026-03-01" }
              as: BusinessAffairs
            - call: "POST /pitches/${pitch_id}/coverage"
              payload: { coverage_score: 82.5, recommendation: "ADVANCE" }
              as: DevelopmentExec
            - call: "POST /pitches/${pitch_id}/advance"
              payload: {}
              as: DevelopmentExec
              captures: { proj_id: $.data.id }
          trigger:
            - call: "POST /script-deals"
              payload: { project_id: "${proj_id}", writer_id: "${wr_id}", option_period_days: 60, steps: [{ step_type: "STORY", fee_cents: 3000000 }] }
              as: BusinessAffairs
          assert:
            - "HTTP 400, response_type == \"error\", data.error_id == \"ERR_INVALID_REQUEST\""
            - "GET /script-deals?project_id=${proj_id} returns 0 rows and meta.total_count == 0"
            - "GET /slates/${slate_id} still reports committed_dev_cents == 0 and available_dev_cents == 400000000"

      - name: pitch_creation_stamps_submitted_status_and_zero_coverage_round
        claim_type: defaults
        grounds:
          - "entities.Pitch.fields.status"
          - "entities.Pitch.fields.coverage_round"
          - "entities.Pitch.fields.coverage_score"
          - "entities.Pitch.fields.recommendation"
          - "state_machines.Pitch.initial_state"
        distinguishing_aspect: "Every source: system field of Pitch takes its declared default at creation - status SUBMITTED, coverage_round 0, coverage_score null, recommendation null - even though the client supplied none of them."
        test_recipe:
          setup:
            - "agency HAL and the STREAMING slate exist; no pitches exist"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /agencies"
              payload: { name: "Halcyon Talent Partners", agency_code: "HAL", relationship_tier: "STANDARD", packaging_allowed: true, annual_submission_cap: 5 }
              as: PlatformAdmin
              captures: { ag_id: $.data.id }
            - call: "POST /slates"
              payload: { platform: "STREAMING", season_year: 2027, total_dev_budget_cents: 400000000, pattern_budget_per_episode_cents: 32000000, license_fee_cap_per_episode_cents: 30000000, max_deficit_per_episode_cents: 7000000, episode_capacity: 20, default_episode_count: 10, max_backend_points_bps: 2000, max_concurrent_pilot_shoots: 2 }
              as: PlatformAdmin
              captures: { slate_id: $.data.id }
          trigger:
            - call: "POST /pitches"
              payload: { agency_id: "${ag_id}", slate_id: "${slate_id}", title: "Fault Lines", logline: "A seismologist predicts the quake nobody wants to hear about.", packaging_elements: [], underlying_ip_key: "IP-FAULT-LINES" }
              as: AgencyRep
              as_user_id: "${ag_id}"
          assert:
            - "HTTP 201 and Pitch.status == \"SUBMITTED\" (the declared initial_state)"
            - "Pitch.coverage_round == 0, Pitch.coverage_score == null, Pitch.recommendation == null"
            - "Pitch.packaging_elements == [] and Pitch.underlying_ip_key == \"IP-FAULT-LINES\""
            - "Pitch.version == 1"

      - name: holding_deal_creation_stamps_active_status_and_null_termination_reason
        claim_type: system_fields
        grounds:
          - "entities.HoldingDeal.fields.status"
          - "entities.HoldingDeal.fields.termination_reason"
          - "entities.HoldingDeal.fields.term_state"
          - "state_machines.HoldingDeal.initial_state"
        distinguishing_aspect: "status and termination_reason are source: system on HoldingDeal, so a create that supplies only writer_id, slate_id, annual_cost_cents and the two term dates comes back ACTIVE with termination_reason null and term_state IN_TERM for a term containing the clock date."
        test_recipe:
          setup:
            - "the clock reads 2026-08-01T00:00:00Z; writer Ada Reyes and the STREAMING slate exist; no holding deals exist"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /agencies"
              payload: { name: "Halcyon Talent Partners", agency_code: "HAL", relationship_tier: "STANDARD", packaging_allowed: true, annual_submission_cap: 5 }
              as: PlatformAdmin
              captures: { ag_id: $.data.id }
            - call: "POST /slates"
              payload: { platform: "STREAMING", season_year: 2027, total_dev_budget_cents: 400000000, pattern_budget_per_episode_cents: 32000000, license_fee_cap_per_episode_cents: 30000000, max_deficit_per_episode_cents: 7000000, episode_capacity: 20, default_episode_count: 10, max_backend_points_bps: 2000, max_concurrent_pilot_shoots: 2 }
              as: PlatformAdmin
              captures: { slate_id: $.data.id }
            - call: "POST /writers"
              payload: { full_name: "Ada Reyes", agency_id: "${ag_id}", guild_minimum_tier: "HIGH", quote_per_step_cents: 5000000 }
              as: AgencyRep
              as_user_id: "${ag_id}"
              captures: { wr_id: $.data.id }
          trigger:
            - call: "POST /holding-deals"
              payload: { writer_id: "${wr_id}", slate_id: "${slate_id}", annual_cost_cents: 2000000, term_start_date: "2026-07-01", term_end_date: "2027-07-01" }
              as: BusinessAffairs
          assert:
            - "HTTP 201, HoldingDeal.status == \"ACTIVE\", HoldingDeal.termination_reason == null, HoldingDeal.term_state == \"IN_TERM\""
            - "HoldingDeal.annual_cost_cents == 2000000 and HoldingDeal.version == 1"
            - "GET /slates/${slate_id} reports reserved_holding_cents == 2000000 and available_dev_cents == 398000000"
            - "GET /writers/${wr_id} reports exclusivity_status == \"HOLDING_DEAL\""

      - name: pilot_order_budget_variance_bps_is_computed_against_the_pattern_budget
        claim_type: computed_fields
        grounds:
          - "entities.PilotOrder.fields.budget_variance_bps"
          - "calculations.project_cumulative_dev_cost"
          - "calculations.slate_dev_budget_ledger"
          - "endpoints[POST /pilot-orders]"
        distinguishing_aspect: "A pilot budget of 33000000 against a pattern budget of 32000000 yields budget_variance_bps == 312 (floor of 312.5), and the same call raises project.cumulative_dev_cost_cents to 37375000 and slate.committed_dev_cents to 37375000."
        test_recipe:
          setup:
            - "project \"Fault Lines\" is SCRIPT_COMPLETE: its one guaranteed STORY step (effective_fee_cents 4375000 after the HIGH guild floor) is ACCEPTED, so cumulative_dev_cost_cents == 4375000 and the slate reports committed_dev_cents 4375000 / available_dev_cents 395625000"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /agencies"
              payload: { name: "Halcyon Talent Partners", agency_code: "HAL", relationship_tier: "STANDARD", packaging_allowed: true, annual_submission_cap: 5 }
              as: PlatformAdmin
              captures: { ag_id: $.data.id }
            - call: "POST /slates"
              payload: { platform: "STREAMING", season_year: 2027, total_dev_budget_cents: 400000000, pattern_budget_per_episode_cents: 32000000, license_fee_cap_per_episode_cents: 30000000, max_deficit_per_episode_cents: 7000000, episode_capacity: 20, default_episode_count: 10, max_backend_points_bps: 2000, max_concurrent_pilot_shoots: 2 }
              as: PlatformAdmin
              captures: { slate_id: $.data.id }
            - call: "POST /writers"
              payload: { full_name: "Ada Reyes", agency_id: "${ag_id}", guild_minimum_tier: "HIGH", quote_per_step_cents: 5000000 }
              as: AgencyRep
              as_user_id: "${ag_id}"
              captures: { wr_id: $.data.id }
            - call: "POST /pitches"
              payload: { agency_id: "${ag_id}", slate_id: "${slate_id}", title: "Fault Lines", logline: "A seismologist predicts the quake nobody wants to hear about.", packaging_elements: [], underlying_ip_key: "IP-FAULT-LINES" }
              as: AgencyRep
              as_user_id: "${ag_id}"
              captures: { pitch_id: $.data.id }
            - call: "POST /pitches/${pitch_id}/rights-checks"
              payload: { underlying_ip_key: "IP-FAULT-LINES", chain_of_title_status: "CLEAN", holdback_start_date: "2026-01-01", holdback_end_date: "2026-03-01" }
              as: BusinessAffairs
            - call: "POST /pitches/${pitch_id}/coverage"
              payload: { coverage_score: 82.5, recommendation: "ADVANCE" }
              as: DevelopmentExec
            - call: "POST /pitches/${pitch_id}/advance"
              payload: {}
              as: DevelopmentExec
              captures: { proj_id: $.data.id }
            - call: "POST /script-deals"
              payload: { project_id: "${proj_id}", writer_id: "${wr_id}", guaranteed_step_count: 1, option_period_days: 60, steps: [{ step_type: "STORY", fee_cents: 3000000 }] }
              as: BusinessAffairs
              captures: { deal_id: $.data.id }
            - call: "GET /script-deals/${deal_id}/steps"
              payload: {}
              as: BusinessAffairs
              captures: { step1_id: "$.data[0].id" }
            - call: "POST /script-deals/${deal_id}/steps/${step1_id}/exercise"
              payload: {}
              as: BusinessAffairs
            - call: "POST /script-deals/${deal_id}/steps/${step1_id}/deliver"
              payload: {}
              as: BusinessAffairs
            - call: "POST /script-deals/${deal_id}/steps/${step1_id}/review"
              payload: { outcome: "ACCEPT" }
              as: DevelopmentExec
          trigger:
            - call: "POST /pilot-orders"
              payload: { project_id: "${proj_id}", budget_cents: 33000000, shoot_start_date: "2026-09-10", shoot_end_date: "2026-09-25", casting_deadline_date: "2026-09-05", location_deadline_date: "2026-09-08" }
              as: DevelopmentExec
              captures: { pilot_id: $.data.id }
          assert:
            - "HTTP 201, PilotOrder.budget_variance_bps == 312"
            - "PilotOrder.production_status == \"ORDERED\", casting_status == \"PENDING\", location_status == \"PENDING\", collapsed_reason == null"
            - "GET /development-projects/${proj_id} reports dev_status == \"PILOT_ORDERED\" and cumulative_dev_cost_cents == 37375000"
            - "GET /slates/${slate_id} reports committed_dev_cents == 37375000 and available_dev_cents == 362625000"

      - name: rights_check_with_an_unknown_chain_of_title_enum_returns_invalid_request
        claim_type: type_constraints
        grounds:
          - "entities.RightsCheck.fields.chain_of_title_status"
          - "validations[priority=9]"
          - "errors[ERR_INVALID_REQUEST]"
        distinguishing_aspect: "chain_of_title_status is constrained to {CLEAN, DISPUTED, UNKNOWN}; the value \"MESSY\" is rejected with ERR_INVALID_REQUEST (400) before any RightsCheck row is written."
        test_recipe:
          setup:
            - "pitch \"Fault Lines\" is SUBMITTED with no rights checks filed"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /agencies"
              payload: { name: "Halcyon Talent Partners", agency_code: "HAL", relationship_tier: "STANDARD", packaging_allowed: true, annual_submission_cap: 5 }
              as: PlatformAdmin
              captures: { ag_id: $.data.id }
            - call: "POST /slates"
              payload: { platform: "STREAMING", season_year: 2027, total_dev_budget_cents: 400000000, pattern_budget_per_episode_cents: 32000000, license_fee_cap_per_episode_cents: 30000000, max_deficit_per_episode_cents: 7000000, episode_capacity: 20, default_episode_count: 10, max_backend_points_bps: 2000, max_concurrent_pilot_shoots: 2 }
              as: PlatformAdmin
              captures: { slate_id: $.data.id }
            - call: "POST /pitches"
              payload: { agency_id: "${ag_id}", slate_id: "${slate_id}", title: "Fault Lines", logline: "A seismologist predicts the quake nobody wants to hear about.", packaging_elements: [], underlying_ip_key: "IP-FAULT-LINES" }
              as: AgencyRep
              as_user_id: "${ag_id}"
              captures: { pitch_id: $.data.id }
          trigger:
            - call: "POST /pitches/${pitch_id}/rights-checks"
              payload: { underlying_ip_key: "IP-FAULT-LINES", chain_of_title_status: "MESSY", holdback_start_date: "2026-01-01", holdback_end_date: "2026-03-01" }
              as: BusinessAffairs
          assert:
            - "HTTP 400, response_type == \"error\", data.error_id == \"ERR_INVALID_REQUEST\""
            - "GET /pitches/${pitch_id}/rights-checks returns 0 rows and meta.total_count == 0"

      - name: rights_check_is_immutable_carrying_no_version_and_no_update_endpoint
        claim_type: immutability
        grounds:
          - "entities.RightsCheck.common_fields"
          - "entities.RightsCheck.fields.quiet_period_end_date"
          - "entities.RightsCheck.fields.result"
          - "endpoints[GET /pitches/{id}/rights-checks]"
        distinguishing_aspect: "RightsCheck declares common_fields: false, so its rows expose id and created_at but no version and no updated_at, and §1.5 declares no PUT/PATCH/DELETE for the resource - the only way to revise a clearance is to file a newer one."
        test_recipe:
          setup:
            - "pitch \"Fault Lines\" carries exactly one CLEAN rights check with holdback 2026-01-01..2026-03-01"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /agencies"
              payload: { name: "Halcyon Talent Partners", agency_code: "HAL", relationship_tier: "STANDARD", packaging_allowed: true, annual_submission_cap: 5 }
              as: PlatformAdmin
              captures: { ag_id: $.data.id }
            - call: "POST /slates"
              payload: { platform: "STREAMING", season_year: 2027, total_dev_budget_cents: 400000000, pattern_budget_per_episode_cents: 32000000, license_fee_cap_per_episode_cents: 30000000, max_deficit_per_episode_cents: 7000000, episode_capacity: 20, default_episode_count: 10, max_backend_points_bps: 2000, max_concurrent_pilot_shoots: 2 }
              as: PlatformAdmin
              captures: { slate_id: $.data.id }
            - call: "POST /pitches"
              payload: { agency_id: "${ag_id}", slate_id: "${slate_id}", title: "Fault Lines", logline: "A seismologist predicts the quake nobody wants to hear about.", packaging_elements: [], underlying_ip_key: "IP-FAULT-LINES" }
              as: AgencyRep
              as_user_id: "${ag_id}"
