# =============================================================================
# task_0794 — §1.9 Scaffold Corner Design (breadth coverage)
# Walks the claim-extraction guide against §1.1–§1.7. §1.8 depth instances that
# already cover a corner are emitted as excluded_because stubs.
# Shared canonical figures identical to SCAFFOLD_DIFFICULTY_DESIGN.yaml.
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:
      - name: create_facility_missing_name_returns_422
        claim_type: Required Fields
        grounds: [entities.Facility.fields.name, "errors[ERR_VALIDATION]"]
        distinguishing_aspect: "POST /facilities without the required `name` field returns ERR_VALIDATION (422); no Facility is created."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - { call: "POST /facilities", payload: { state_code: "TX", sales_tax_rate_bps: 825, facility_fee_bps: 1000 }, as: PlatformAdmin, captures: { err: "$.data.error_id" } }
          assert: ["HTTP 422 with data.error_id == ERR_VALIDATION"]

      - name: get_unit_not_found_returns_404
        claim_type: Not Found
        grounds: [entities.StorageUnit, "errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "GET /units/{unknown-uuid} returns ERR_NOT_FOUND (404)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - { call: "GET /units/00000000-0000-0000-0000-000000000000", as: PlatformAdmin, captures: { err: "$.data.error_id" } }
          assert: ["HTTP 404 with data.error_id == ERR_NOT_FOUND"]

      - name: buyer_deposit_fields_default_zero
        claim_type: Defaults
        grounds: [entities.Buyer.fields.deposit_available_cents, entities.Buyer.fields.deposit_held_cents, entities.Buyer.fields.status]
        distinguishing_aspect: "A newly registered Buyer has status REGISTERED and deposit_available_cents/deposit_held_cents/deposit_forfeited_cents all 0."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - { call: "POST /buyers", payload: { full_name: "B1", email: "b1@x.com" }, as: PlatformAdmin, captures: { buyer: "$.data.id" } }
          assert:
            - "HTTP 201; Buyer.${buyer}.status == REGISTERED"
            - "Buyer.${buyer}.deposit_available_cents == 0 AND deposit_held_cents == 0 AND deposit_forfeited_cents == 0"

      - name: notice_creation_sets_sent_at_and_cure_deadline
        claim_type: Computed Fields
        grounds: [entities.LienNotice.fields.notice_sent_at, entities.LienNotice.fields.cure_deadline, entities.LienNotice.fields.status]
        distinguishing_aspect: "Creating a lien notice at the clock default 2026-03-01T00:00:00Z sets notice_sent_at to that instant and cure_deadline to 2026-03-15T00:00:00Z (notice_sent_at + 14d), status SENT."
        test_recipe:
          setup: ["A RENTED unit; clock left at the startup default 2026-03-01T00:00:00Z."]
          setup_api_calls:
            - { call: "POST /facilities", payload: { name: "F1", state_code: "TX", sales_tax_rate_bps: 825, facility_fee_bps: 1000 }, as: PlatformAdmin, captures: { fac: "$.data.id" } }
            - { call: "POST /tenants", payload: { facility_id: "${fac}", full_name: "T1", email: "t1@x.com" }, as: PlatformAdmin, captures: { ten: "$.data.id" } }
            - { call: "POST /units", payload: { facility_id: "${fac}", tenant_id: "${ten}", unit_number: "A1", monthly_rent_cents: 30000 }, as: PlatformAdmin, captures: { unit: "$.data.id" } }
          trigger:
            - { call: "POST /units/${unit}/lien-notices", payload: { past_due_balance_cents: 60000 }, as: FacilityOperator, as_user_id: "${fac}", captures: { notice: "$.data.id" } }
          assert:
            - "LienNotice.${notice}.status == SENT"
            - "LienNotice.${notice}.notice_sent_at == 2026-03-01T00:00:00Z"
            - "LienNotice.${notice}.cure_deadline == 2026-03-15T00:00:00Z"
            - "StorageUnit.${unit}.status == LIEN_NOTICED AND lien_amount_provisional_cents == 89000"

  # ===========================================================================
  - section: state_machines
    instances:
      - name: mature_already_cured_notice_returns_invalid_state
        claim_type: Invalid Transitions
        grounds: [state_machines.LienNotice.SENT_to_CURED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Maturing a LienNotice that is already CURED (tenant cured within the window) returns ERR_INVALID_STATE; no state changes."
        test_recipe:
          setup: ["A unit whose lien notice was cured (notice CURED, unit RENTED)."]
          setup_api_calls:
            - { call: "POST /facilities", payload: { name: "F1", state_code: "TX", sales_tax_rate_bps: 825, facility_fee_bps: 1000 }, as: PlatformAdmin, captures: { fac: "$.data.id" } }
            - { call: "POST /tenants", payload: { facility_id: "${fac}", full_name: "T1", email: "t1@x.com" }, as: PlatformAdmin, captures: { ten: "$.data.id" } }
            - { call: "POST /units", payload: { facility_id: "${fac}", tenant_id: "${ten}", unit_number: "A1", monthly_rent_cents: 30000 }, as: PlatformAdmin, captures: { unit: "$.data.id" } }
            - { call: "POST /units/${unit}/lien-notices", payload: { past_due_balance_cents: 60000 }, as: FacilityOperator, as_user_id: "${fac}", captures: { notice: "$.data.id" } }
            - { call: "POST /units/${unit}/cure", payload: {}, as: Tenant, as_user_id: "${ten}" }
          trigger:
            - { call: "POST /lien-notices/${notice}/mature", payload: {}, as: FacilityOperator, as_user_id: "${fac}", captures: { err: "$.data.error_id" } }
          assert: ["HTTP 409 with data.error_id == ERR_INVALID_STATE"]

      - name: cure_after_mature_returns_invalid_state
        claim_type: Terminal State Lockdown
        grounds: [state_machines.StorageUnit.LIEN_NOTICED_to_LIEN_MATURED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Curing a unit whose lien already MATURED (unit LIEN_MATURED, not LIEN_NOTICED) returns ERR_INVALID_STATE."
        test_recipe:
          setup: ["A matured unit (unit LIEN_MATURED)."]
          setup_api_calls:
            - { call: "POST /facilities", payload: { name: "F1", state_code: "TX", sales_tax_rate_bps: 825, facility_fee_bps: 1000 }, as: PlatformAdmin, captures: { fac: "$.data.id" } }
            - { call: "POST /tenants", payload: { facility_id: "${fac}", full_name: "T1", email: "t1@x.com" }, as: PlatformAdmin, captures: { ten: "$.data.id" } }
            - { call: "POST /units", payload: { facility_id: "${fac}", tenant_id: "${ten}", unit_number: "A1", monthly_rent_cents: 30000 }, as: PlatformAdmin, captures: { unit: "$.data.id" } }
            - { call: "POST /units/${unit}/lien-notices", payload: { past_due_balance_cents: 60000 }, as: FacilityOperator, as_user_id: "${fac}", captures: { notice: "$.data.id" } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-03-20T00:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /lien-notices/${notice}/mature", payload: {}, as: FacilityOperator, as_user_id: "${fac}" }
          trigger:
            - { call: "POST /units/${unit}/cure", payload: {}, as: Tenant, as_user_id: "${ten}", captures: { err: "$.data.error_id" } }
          assert: ["HTTP 409 with data.error_id == ERR_INVALID_STATE"]

      - name: open_already_live_auction_returns_invalid_state
        claim_type: Idempotency
        grounds: [state_machines.Auction.SCHEDULED_to_LIVE, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Opening an auction that is already LIVE returns ERR_INVALID_STATE (open is not idempotent)."
        test_recipe:
          setup: ["A LIVE auction."]
          setup_api_calls:
            - { call: "POST /facilities", payload: { name: "F1", state_code: "TX", sales_tax_rate_bps: 825, facility_fee_bps: 1000 }, as: PlatformAdmin, captures: { fac: "$.data.id" } }
            - { call: "POST /tenants", payload: { facility_id: "${fac}", full_name: "T1", email: "t1@x.com" }, as: PlatformAdmin, captures: { ten: "$.data.id" } }
            - { call: "POST /units", payload: { facility_id: "${fac}", tenant_id: "${ten}", unit_number: "A1", monthly_rent_cents: 30000 }, as: PlatformAdmin, captures: { unit: "$.data.id" } }
            - { call: "POST /units/${unit}/lien-notices", payload: { past_due_balance_cents: 60000 }, as: FacilityOperator, as_user_id: "${fac}", captures: { notice: "$.data.id" } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-03-20T00:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /lien-notices/${notice}/mature", payload: {}, as: FacilityOperator, as_user_id: "${fac}" }
            - { call: "POST /auctions", payload: { unit_id: "${unit}", mode: "ONLINE", start_at: "2026-03-21T00:00:00Z", end_at: "2026-03-22T00:00:00Z", reserve_cents: 50000, min_increment_cents: 5000 }, as: FacilityOperator, as_user_id: "${fac}", captures: { auc: "$.data.id" } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-03-21T01:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /auctions/${auc}/open", payload: {}, as: FacilityOperator, as_user_id: "${fac}" }
          trigger:
            - { call: "POST /auctions/${auc}/open", payload: {}, as: FacilityOperator, as_user_id: "${fac}", captures: { err: "$.data.error_id" } }
          assert: ["HTTP 409 with data.error_id == ERR_INVALID_STATE"]

      - name: retract_high_bid_resets_auction_high_bid
        claim_type: Valid Transition
        grounds: [state_machines.Bid.ACTIVE_to_RETRACTED, calculations.high_bid_selection, entities.Auction.fields.high_bid_cents]
        distinguishing_aspect: "Retracting the sole ACTIVE (high) bid sets Bid.status RETRACTED and re-selects the auction high bid to empty (high_bid_cents 0, min_next_bid_cents back to reserve)."
        test_recipe:
          setup: ["A LIVE auction with one ACTIVE bid of 60000 by a funded buyer."]
          setup_api_calls:
            - { call: "POST /facilities", payload: { name: "F1", state_code: "TX", sales_tax_rate_bps: 825, facility_fee_bps: 1000 }, as: PlatformAdmin, captures: { fac: "$.data.id" } }
            - { call: "POST /tenants", payload: { facility_id: "${fac}", full_name: "T1", email: "t1@x.com" }, as: PlatformAdmin, captures: { ten: "$.data.id" } }
            - { call: "POST /units", payload: { facility_id: "${fac}", tenant_id: "${ten}", unit_number: "A1", monthly_rent_cents: 30000 }, as: PlatformAdmin, captures: { unit: "$.data.id" } }
            - { call: "POST /units/${unit}/lien-notices", payload: { past_due_balance_cents: 60000 }, as: FacilityOperator, as_user_id: "${fac}", captures: { notice: "$.data.id" } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-03-20T00:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /lien-notices/${notice}/mature", payload: {}, as: FacilityOperator, as_user_id: "${fac}" }
            - { call: "POST /auctions", payload: { unit_id: "${unit}", mode: "ONLINE", start_at: "2026-03-21T00:00:00Z", end_at: "2026-03-22T00:00:00Z", reserve_cents: 50000, min_increment_cents: 5000 }, as: FacilityOperator, as_user_id: "${fac}", captures: { auc: "$.data.id" } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-03-21T01:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /auctions/${auc}/open", payload: {}, as: FacilityOperator, as_user_id: "${fac}", captures: { auc_v: "$.data.version" } }
            - { call: "POST /buyers", payload: { full_name: "B1", email: "b1@x.com" }, as: PlatformAdmin, captures: { buyer: "$.data.id" } }
            - { call: "POST /buyers/${buyer}/fund-deposit", payload: { amount_cents: 100000 }, as: Buyer, as_user_id: "${buyer}" }
            - { call: "POST /auctions/${auc}/bids", payload: { buyer_id: "${buyer}", amount_cents: 60000, expected_auction_version: "${auc_v}" }, as: Buyer, as_user_id: "${buyer}", captures: { bid: "$.data.id" } }
          trigger:
            - { call: "POST /bids/${bid}/retract", payload: {}, as: Buyer, as_user_id: "${buyer}" }
          assert:
            - "Bid.${bid}.status == RETRACTED"
            - "Auction.${auc}.high_bid_cents == 0 AND Auction.${auc}.min_next_bid_cents == 50000"

  # ===========================================================================
  - section: validations
    instances:
      - name: missing_role_header_returns_401
        claim_type: Violation to Error
        grounds: ["validations[priority=1]", "errors[ERR_UNAUTHENTICATED]"]
        distinguishing_aspect: "A request with no X-User-Role header returns ERR_UNAUTHENTICATED (401) before any other check. (The unit-test omits the X-User-Role header on this call.)"
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - { call: "POST /facilities", payload: { name: "F1", state_code: "TX", sales_tax_rate_bps: 825, facility_fee_bps: 1000 }, as: PlatformAdmin, captures: { err: "$.data.error_id" } }
          assert: ["With the X-User-Role header omitted: HTTP 401 with data.error_id == ERR_UNAUTHENTICATED"]

      - name: tenant_schedule_auction_forbidden
        claim_type: Violation to Error
        grounds: ["validations[priority=2]", "errors[ERR_FORBIDDEN]", roles.Tenant]
        distinguishing_aspect: "A Tenant calling POST /auctions (a FacilityOperator-exclusive op) returns ERR_FORBIDDEN (403)."
        test_recipe:
          setup: ["A matured unit."]
          setup_api_calls:
            - { call: "POST /facilities", payload: { name: "F1", state_code: "TX", sales_tax_rate_bps: 825, facility_fee_bps: 1000 }, as: PlatformAdmin, captures: { fac: "$.data.id" } }
            - { call: "POST /tenants", payload: { facility_id: "${fac}", full_name: "T1", email: "t1@x.com" }, as: PlatformAdmin, captures: { ten: "$.data.id" } }
            - { call: "POST /units", payload: { facility_id: "${fac}", tenant_id: "${ten}", unit_number: "A1", monthly_rent_cents: 30000 }, as: PlatformAdmin, captures: { unit: "$.data.id" } }
            - { call: "POST /units/${unit}/lien-notices", payload: { past_due_balance_cents: 60000 }, as: FacilityOperator, as_user_id: "${fac}", captures: { notice: "$.data.id" } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-03-20T00:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /lien-notices/${notice}/mature", payload: {}, as: FacilityOperator, as_user_id: "${fac}" }
          trigger:
            - { call: "POST /auctions", payload: { unit_id: "${unit}", mode: "ONLINE", start_at: "2026-03-21T00:00:00Z", end_at: "2026-03-22T00:00:00Z", reserve_cents: 50000, min_increment_cents: 5000 }, as: Tenant, as_user_id: "${ten}", captures: { err: "$.data.error_id" } }
          assert: ["HTTP 403 with data.error_id == ERR_FORBIDDEN"]

      - name: buyer_fund_other_buyer_deposit_forbidden
        claim_type: Violation to Error
        grounds: ["validations[priority=2]", "errors[ERR_FORBIDDEN]", roles.Buyer]
        distinguishing_aspect: "A Buyer funding a different buyer's deposit (X-User-ID != path buyer_id) returns ERR_FORBIDDEN (403) — entity_backed ownership check."
        test_recipe:
          setup: ["Two registered buyers."]
          setup_api_calls:
            - { call: "POST /buyers", payload: { full_name: "B1", email: "b1@x.com" }, as: PlatformAdmin, captures: { buyer1: "$.data.id" } }
            - { call: "POST /buyers", payload: { full_name: "B2", email: "b2@x.com" }, as: PlatformAdmin, captures: { buyer2: "$.data.id" } }
          trigger:
            - { call: "POST /buyers/${buyer2}/fund-deposit", payload: { amount_cents: 50000 }, as: Buyer, as_user_id: "${buyer1}", captures: { err: "$.data.error_id" } }
          assert: ["HTTP 403 with data.error_id == ERR_FORBIDDEN"]

      - name: list_units_pagination_limit_zero_returns_422
        claim_type: Violation to Error
        grounds: ["validations[priority=4]", "errors[ERR_PAGINATION_INVALID]"]
        distinguishing_aspect: "GET /units?limit=0 returns ERR_PAGINATION_INVALID (422) because limit is below the min of 1."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - { call: "GET /units?limit=0", as: PlatformAdmin, captures: { err: "$.data.error_id" } }
          assert: ["HTTP 422 with data.error_id == ERR_PAGINATION_INVALID"]

      - name: bid_on_scheduled_auction_returns_not_live
        claim_type: Violation to Error
        grounds: ["validations[priority=7]", "errors[ERR_AUCTION_NOT_LIVE]"]
        distinguishing_aspect: "Bidding on a SCHEDULED (never opened) auction returns ERR_AUCTION_NOT_LIVE (409) — the pure state check with a valid amount."
        test_recipe:
          setup: ["A SCHEDULED auction (not opened); a funded buyer. auction.version captured from creation."]
          setup_api_calls:
            - { call: "POST /facilities", payload: { name: "F1", state_code: "TX", sales_tax_rate_bps: 825, facility_fee_bps: 1000 }, as: PlatformAdmin, captures: { fac: "$.data.id" } }
            - { call: "POST /tenants", payload: { facility_id: "${fac}", full_name: "T1", email: "t1@x.com" }, as: PlatformAdmin, captures: { ten: "$.data.id" } }
            - { call: "POST /units", payload: { facility_id: "${fac}", tenant_id: "${ten}", unit_number: "A1", monthly_rent_cents: 30000 }, as: PlatformAdmin, captures: { unit: "$.data.id" } }
            - { call: "POST /units/${unit}/lien-notices", payload: { past_due_balance_cents: 60000 }, as: FacilityOperator, as_user_id: "${fac}", captures: { notice: "$.data.id" } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-03-20T00:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /lien-notices/${notice}/mature", payload: {}, as: FacilityOperator, as_user_id: "${fac}" }
            - { call: "POST /auctions", payload: { unit_id: "${unit}", mode: "ONLINE", start_at: "2026-03-21T00:00:00Z", end_at: "2026-03-22T00:00:00Z", reserve_cents: 50000, min_increment_cents: 5000 }, as: FacilityOperator, as_user_id: "${fac}", captures: { auc: "$.data.id", auc_v: "$.data.version" } }
            - { call: "POST /buyers", payload: { full_name: "B1", email: "b1@x.com" }, as: PlatformAdmin, captures: { buyer: "$.data.id" } }
            - { call: "POST /buyers/${buyer}/fund-deposit", payload: { amount_cents: 100000 }, as: Buyer, as_user_id: "${buyer}" }
          trigger:
            - { call: "POST /auctions/${auc}/bids", payload: { buyer_id: "${buyer}", amount_cents: 60000, expected_auction_version: "${auc_v}" }, as: Buyer, as_user_id: "${buyer}", captures: { err: "$.data.error_id" } }
          assert: ["HTTP 409 with data.error_id == ERR_AUCTION_NOT_LIVE"]

      - name: bid_below_reserve_returns_too_low
        claim_type: Violation to Error
        grounds: ["validations[priority=22]", "errors[ERR_BID_TOO_LOW]"]
        distinguishing_aspect: "On a LIVE auction with no bids, a funded buyer bidding 49999 (< reserve 50000) returns ERR_BID_TOO_LOW (409) — pure fiscal failure, no state conflict."
        test_recipe:
          setup: ["A LIVE auction (reserve 50000, no bids); a funded buyer."]
          setup_api_calls:
            - { call: "POST /facilities", payload: { name: "F1", state_code: "TX", sales_tax_rate_bps: 825, facility_fee_bps: 1000 }, as: PlatformAdmin, captures: { fac: "$.data.id" } }
            - { call: "POST /tenants", payload: { facility_id: "${fac}", full_name: "T1", email: "t1@x.com" }, as: PlatformAdmin, captures: { ten: "$.data.id" } }
            - { call: "POST /units", payload: { facility_id: "${fac}", tenant_id: "${ten}", unit_number: "A1", monthly_rent_cents: 30000 }, as: PlatformAdmin, captures: { unit: "$.data.id" } }
            - { call: "POST /units/${unit}/lien-notices", payload: { past_due_balance_cents: 60000 }, as: FacilityOperator, as_user_id: "${fac}", captures: { notice: "$.data.id" } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-03-20T00:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /lien-notices/${notice}/mature", payload: {}, as: FacilityOperator, as_user_id: "${fac}" }
            - { call: "POST /auctions", payload: { unit_id: "${unit}", mode: "ONLINE", start_at: "2026-03-21T00:00:00Z", end_at: "2026-03-22T00:00:00Z", reserve_cents: 50000, min_increment_cents: 5000 }, as: FacilityOperator, as_user_id: "${fac}", captures: { auc: "$.data.id" } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-03-21T01:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /auctions/${auc}/open", payload: {}, as: FacilityOperator, as_user_id: "${fac}", captures: { auc_v: "$.data.version" } }
            - { call: "POST /buyers", payload: { full_name: "B1", email: "b1@x.com" }, as: PlatformAdmin, captures: { buyer: "$.data.id" } }
            - { call: "POST /buyers/${buyer}/fund-deposit", payload: { amount_cents: 100000 }, as: Buyer, as_user_id: "${buyer}" }
          trigger:
            - { call: "POST /auctions/${auc}/bids", payload: { buyer_id: "${buyer}", amount_cents: 49999, expected_auction_version: "${auc_v}" }, as: Buyer, as_user_id: "${buyer}", captures: { err: "$.data.error_id" } }
          assert: ["HTTP 409 with data.error_id == ERR_BID_TOO_LOW"]

      - name: bid_insufficient_deposit_returns_402
        claim_type: Violation to Error
        grounds: ["validations[priority=21]", "errors[ERR_INSUFFICIENT_DEPOSIT]"]
        distinguishing_aspect: "A buyer with deposit_available_cents 10000 (< 20000) bidding on a LIVE auction returns ERR_INSUFFICIENT_DEPOSIT (402), evaluated before the too-low fiscal check."
        test_recipe:
          setup: ["A LIVE auction; a buyer funded only 10000."]
          setup_api_calls:
            - { call: "POST /facilities", payload: { name: "F1", state_code: "TX", sales_tax_rate_bps: 825, facility_fee_bps: 1000 }, as: PlatformAdmin, captures: { fac: "$.data.id" } }
            - { call: "POST /tenants", payload: { facility_id: "${fac}", full_name: "T1", email: "t1@x.com" }, as: PlatformAdmin, captures: { ten: "$.data.id" } }
            - { call: "POST /units", payload: { facility_id: "${fac}", tenant_id: "${ten}", unit_number: "A1", monthly_rent_cents: 30000 }, as: PlatformAdmin, captures: { unit: "$.data.id" } }
            - { call: "POST /units/${unit}/lien-notices", payload: { past_due_balance_cents: 60000 }, as: FacilityOperator, as_user_id: "${fac}", captures: { notice: "$.data.id" } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-03-20T00:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /lien-notices/${notice}/mature", payload: {}, as: FacilityOperator, as_user_id: "${fac}" }
            - { call: "POST /auctions", payload: { unit_id: "${unit}", mode: "ONLINE", start_at: "2026-03-21T00:00:00Z", end_at: "2026-03-22T00:00:00Z", reserve_cents: 50000, min_increment_cents: 5000 }, as: FacilityOperator, as_user_id: "${fac}", captures: { auc: "$.data.id" } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-03-21T01:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /auctions/${auc}/open", payload: {}, as: FacilityOperator, as_user_id: "${fac}", captures: { auc_v: "$.data.version" } }
            - { call: "POST /buyers", payload: { full_name: "B1", email: "b1@x.com" }, as: PlatformAdmin, captures: { buyer: "$.data.id" } }
            - { call: "POST /buyers/${buyer}/fund-deposit", payload: { amount_cents: 10000 }, as: Buyer, as_user_id: "${buyer}" }
          trigger:
