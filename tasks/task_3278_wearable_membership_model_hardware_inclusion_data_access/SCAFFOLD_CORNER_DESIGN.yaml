        distinguishing_aspect: "Enrolling after the window end fails ERR_ENROLLMENT_WINDOW_CLOSED; double enrollment in an open study fails ERR_ALREADY_ENROLLED."
        test_recipe:
          setup: ["study A window 2026-09-01..2026-09-02 (clock now 2026-09-03: closed); study B window 2026-09-01..2026-09-30 (open); member with ACTIVE term enrolled in B already"]
          setup_api_calls:
            - call: "POST /members"
              payload: { email: "e6@x.com", full_name: "E Six" }
              as: Anonymous
              captures: { me6: $.data.id }
            - call: "POST /members/${me6}/terms"
              payload: { plan_name: "P", monthly_fee_cents: 3000, commitment_months: 12, hardware_tier: "BAND_STD", upgrade_eligibility_months: 6, pause_days_per_term: 30, cancel_fee_policy: "REMAINING_MONTHS", early_cancel_fee_floor_cents: 5000 }
              as: Member
              as_user_id: "${me6}"
            - call: "POST /research-studies"
              payload: { code: "SA", title: "Study A", min_paid_months: 0, enrollment_window_start_on: "2026-09-01", enrollment_window_end_on: "2026-09-02" }
              as: PlatformAdmin
              captures: { sta: $.data.id }
            - call: "POST /research-studies"
              payload: { code: "SB", title: "Study B", min_paid_months: 0, enrollment_window_start_on: "2026-09-01", enrollment_window_end_on: "2026-09-30" }
              as: PlatformAdmin
              captures: { stb: $.data.id }
            - call: "POST /research-studies/${stb}/enroll"
              payload: { member_id: "${me6}" }
              as: Member
              as_user_id: "${me6}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-03T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /research-studies/${sta}/enroll"
              payload: { member_id: "${me6}" }
              as: Member
              as_user_id: "${me6}"
              captures: { win_err: "$.data.error_id" }
            - call: "POST /research-studies/${stb}/enroll"
              payload: { member_id: "${me6}" }
              as: Member
              as_user_id: "${me6}"
              captures: { dup_err2: "$.data.error_id" }
          assert:
            - "win_err == ERR_ENROLLMENT_WINDOW_CLOSED"
            - "dup_err2 == ERR_ALREADY_ENROLLED"

  # ------------------------------------------------------------- RBAC
  - section: rbac
    instances:
      - name: member_cannot_access_dashboard_or_decide
        claim_type: role_denial
        grounds:
          - "roles"
        distinguishing_aspect: "Member role calling Coach-only dashboard or Support-only decide is rejected ERR_FORBIDDEN_ROLE 403 before any existence check."
        test_recipe:
          setup: ["member exists; team exists (created by coach-6)"]
          setup_api_calls:
            - call: "POST /members"
              payload: { email: "r1@x.com", full_name: "R One" }
              as: Anonymous
              captures: { mr1: $.data.id }
            - call: "POST /teams"
              payload: { name: "TR1", team_type: "SPORTS", coach_user_id: "coach-6" }
              as: Coach
              as_user_id: "coach-6"
              captures: { teamr1: $.data.id }
          trigger:
            - call: "GET /teams/${teamr1}/dashboard"
              payload: {}
              as: Member
              as_user_id: "${mr1}"
              captures: { rb_err: "$.data.error_id" }
          assert:
            - "rb_err == ERR_FORBIDDEN_ROLE with http 403"

      - name: coach_ownership_and_member_ownership
        claim_type: ownership_denial
        grounds:
          - "validations[priority=3]"
          - "errors[ERR_NOT_RESOURCE_OWNER]"
        distinguishing_aspect: "A coach who does not own the team cannot add memberships (coach_user_id mismatch -> ERR_NOT_RESOURCE_OWNER); a member acting on another member's resources gets ERR_NOT_RESOURCE_OWNER."
        test_recipe:
          setup: ["two members M1, M2; team owned by coach-6"]
          setup_api_calls:
            - call: "POST /members"
              payload: { email: "r2@x.com", full_name: "R Two" }
              as: Anonymous
              captures: { mr2: $.data.id }
            - call: "POST /members"
              payload: { email: "r3@x.com", full_name: "R Three" }
              as: Anonymous
              captures: { mr3: $.data.id }
            - call: "POST /teams"
              payload: { name: "TR2", team_type: "SPORTS", coach_user_id: "coach-6" }
              as: Coach
              as_user_id: "coach-6"
              captures: { teamr2: $.data.id }
          trigger:
            - call: "POST /teams/${teamr2}/memberships"
              payload: { member_id: "${mr2}" }
              as: Coach
              as_user_id: "coach-other"
              captures: { own_err1: "$.data.error_id" }
            - call: "POST /members/${mr2}/merch-orders"
              payload: { lines: [ { sku: "B1", category: "BAND_ACCESSORY", unit_price_cents: 100, qty: 1 } ] }
              as: Member
              as_user_id: "${mr3}"
              captures: { own_err2: "$.data.error_id" }
          assert:
            - "own_err1 == ERR_NOT_RESOURCE_OWNER (coach-other does not own team)"
            - "own_err2 == ERR_NOT_RESOURCE_OWNER (member ${mr3} acting on ${mr2}'s orders)"

      - name: anonymous_only_registers
        claim_type: role_denial
        grounds:
          - "roles"
        distinguishing_aspect: "Anonymous calling any endpoint other than POST /members is rejected; missing headers yield ERR_MISSING_OR_INVALID_CONTEXT_HEADER."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "GET /devices"
              payload: {}
              as: Anonymous
              captures: { anon_err: "$.data.error_id" }
          assert:
            - "anon_err == ERR_FORBIDDEN_ROLE (role valid but not allowed on this endpoint)"

  # ------------------------------------------------------------- cross-cutting layers
  - section: cross_cutting
    instances:
      - name: version_increments_on_mutation
        claim_type: optimistic_concurrency
        grounds:
          - "entities.Member"
          - "concurrency_rules[consent-grant-supersede-stale-version]"
        distinguishing_aspect: "Member.version starts at 1 and increments on wallet-affecting mutations (merch placement, merch cancel)."
        test_recipe:
          setup: ["member with ACTIVE BAND_STD term, wallet funded 90000 (fee 30000, pause budget 90, pause+resume)"]
          setup_api_calls:
            - call: "POST /members"
              payload: { email: "x1@x.com", full_name: "X One" }
              as: Anonymous
              captures: { mx1: $.data.id, mx1_v0: "$.data.version" }
            - call: "POST /members/${mx1}/terms"
              payload: { plan_name: "P", monthly_fee_cents: 30000, commitment_months: 12, hardware_tier: "BAND_STD", upgrade_eligibility_months: 6, pause_days_per_term: 90, cancel_fee_policy: "REMAINING_MONTHS", early_cancel_fee_floor_cents: 5000 }
              as: Member
              as_user_id: "${mx1}"
              captures: { tx1: $.data.id }
            - call: "POST /terms/${tx1}/pause"
              payload: { start_on: "2026-09-01", days: 90 }
              as: Member
              as_user_id: "${mx1}"
            - call: "POST /terms/${tx1}/resume"
              payload: {}
              as: Member
              as_user_id: "${mx1}"
          trigger:
            - call: "POST /members/${mx1}/merch-orders"
              payload: { lines: [ { sku: "B1", category: "BAND_ACCESSORY", unit_price_cents: 100, qty: 1 } ] }
              as: Member
              as_user_id: "${mx1}"
              captures: { ox1: "$.data.id" }
            - call: "POST /merch-orders/${ox1}/cancel"
              payload: {}
              as: Member
              as_user_id: "${mx1}"
            - call: "GET /members/${mx1}"
              payload: {}
              as: Member
              as_user_id: "${mx1}"
              captures: { mx1_v_final: "$.data.version" }
          assert:
            - "mx1_v0 == 1"
            - "mx1_v_final == 1 + 1 (resume credit) + 1 (placement) + 1 (cancel) == 4"

      - name: cascading_merch_cancel_after_suspend_still_allowed
        claim_type: cascading_side_effects
        grounds:
          - "state_machines.Member.ACTIVE_to_SUSPENDED"
          - "state_machines.MerchOrder.PAID_to_CANCELLED"
        distinguishing_aspect: "A SUSPENDED member cannot place new orders but CAN still cancel an existing PAID order (cancel is a compensating action, not value-extending); wallet refund lands."
        test_recipe:
          setup: ["member with ACTIVE BAND_STD term (fee 30000, budget 90); wallet funded 90000; order placed (total 100); then payment FAILED -> member SUSPENDED"]
          setup_api_calls:
            - call: "POST /members"
              payload: { email: "x2@x.com", full_name: "X Two" }
              as: Anonymous
              captures: { mx2: $.data.id }
            - call: "POST /members/${mx2}/terms"
              payload: { plan_name: "P", monthly_fee_cents: 30000, commitment_months: 12, hardware_tier: "BAND_STD", upgrade_eligibility_months: 6, pause_days_per_term: 90, cancel_fee_policy: "REMAINING_MONTHS", early_cancel_fee_floor_cents: 5000 }
              as: Member
              as_user_id: "${mx2}"
              captures: { tx2: $.data.id }
            - call: "POST /terms/${tx2}/pause"
              payload: { start_on: "2026-09-01", days: 90 }
              as: Member
              as_user_id: "${mx2}"
            - call: "POST /terms/${tx2}/resume"
              payload: {}
              as: Member
              as_user_id: "${mx2}"
            - call: "POST /members/${mx2}/merch-orders"
              payload: { lines: [ { sku: "B1", category: "BAND_ACCESSORY", unit_price_cents: 100, qty: 1 } ] }
              as: Member
              as_user_id: "${mx2}"
              captures: { ox2: "$.data.id" }
            - call: "POST /terms/${tx2}/record-payment"
              payload: { outcome: "FAILED" }
              as: Support
          trigger:
            - call: "POST /merch-orders/${ox2}/cancel"
              payload: {}
              as: Member
              as_user_id: "${mx2}"
              captures: { ox2_status: "$.data.order_status" }
          assert:
            - "ox2_status == CANCELLED even though member is SUSPENDED"
            - "Member wallet back to 90000 (refund landed while suspended)"

  # ------------------------------------------------------------- consistency
  - section: consistency_model
    instances:
      - name: immediate_visibility_of_writes
        claim_type: immediate_consistency
        grounds:
          - "complexity_profile.consistency_model"
        distinguishing_aspect: "All mutations are visible in the same response and in immediately-following reads (no eventual lag)."
        test_recipe:
          setup: ["member created"]
          setup_api_calls:
            - call: "POST /members"
              payload: { email: "x3@x.com", full_name: "X Three" }
              as: Anonymous
              captures: { mx3: $.data.id }
          trigger:
            - call: "POST /members/${mx3}/terms"
              payload: { plan_name: "P", monthly_fee_cents: 3000, commitment_months: 12, hardware_tier: "BAND_STD", upgrade_eligibility_months: 6, pause_days_per_term: 30, cancel_fee_policy: "REMAINING_MONTHS", early_cancel_fee_floor_cents: 5000 }
              as: Member
              as_user_id: "${mx3}"
              captures: { tx3_status: "$.data.term_status", tx3_end: "$.data.commitment_end_on" }
            - call: "GET /members/${mx3}/terms"
              payload: {}
              as: Member
              as_user_id: "${mx3}"
          assert:
            - "tx3_status == ACTIVE and tx3_end == 2027-09-01 in the creation response itself"
            - "Immediate GET /members/${mx3}/terms lists exactly 1 term with the same commitment_end_on"

