      - name: energy_compliance_vacuous_truth_and_single_interrupt_fails
        claim_type: correct_result
        grounds:
          - calculations.energy_compliance
          - entities.MillTestReport.fields.energy_certified
          - validations[priority=10]
        distinguishing_aspect: "Zero recorded intervals with zero interrupted intervals would be vacuously clean, but CERTIFIED grades require at least one interval: the MTR issue is rejected ERR_MTR_NOT_ISSUABLE with no intervals, and rejected again when exactly one interval is INTERRUPTED (count == 0 is the exact boundary)."
        test_recipe:
          setup: ["Default logical clock. Mill, contract, lot, CERTIFIED grade (requires_energy_certified true). Heat H1 fully processed (CAST) with NO energy intervals. Heat H2 CAST with one NORMAL interval then one INTERRUPTED interval."]
          setup_api_calls:
