            - call: "POST /entry-permits"
              payload: { vessel_id: "${vat}", ticket_id: "${tat}", entrant_technician_id: "${tta}", window_start: "2026-08-10T08:00:00Z", window_end: "2026-08-10T10:00:00Z" }
