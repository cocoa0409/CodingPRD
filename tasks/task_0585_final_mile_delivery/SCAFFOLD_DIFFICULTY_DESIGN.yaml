scaffold_difficulty_design:
  # =========================================================================
  # Rule 1 — Dual-variant calculations across different entity domains
  # =========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: order_quote_vs_final_diverges
        grounds:
          - calculations.order_fee_quote
          - calculations.order_fee_final
          - entities.DeliveryOrder.fields.quoted_fee_cents
          - entities.DeliveryOrder.fields.final_fee_cents
        distinguishing_aspect: |
          On the DeliveryOrder domain: quoted_fee_cents (ordered WHITE_GLOVE + flat haul-away,
          computed at create) == 27325, while final_fee_cents (actual ROOM_OF_CHOICE placement,
          actual per-ticket disposal, computed at DELIVERED) == 17500 — same order, two
          algorithms, 27325 != 17500.
        test_recipe:
          setup:
            - "One WHITE_GLOVE order (weight 200, stair 6, assembly_required, haul_away_required, declared 250000) created, windowed, routed, dock-booked and dispatched to OUT_FOR_DELIVERY on a WG+assembly certified CA team."
          setup_api_calls:
            - call: "POST /depots"
              payload: { name: "Depot A", region_code: "CA" }
              as: PlatformAdmin
              captures: { depot_id: $.data.id }
            - call: "POST /docks"
              payload: { depot_id: "${depot_id}", dock_code: "D1" }
              as: PlatformAdmin
              captures: { dock_id: $.data.id }
            - call: "POST /delivery-teams"
              payload: { depot_id: "${depot_id}", team_name: "T1", lead_name: "Lee", member2_name: "Max", region_code: "CA", max_daily_stops: 10, max_daily_weight_lbs: 500, max_daily_volume_cuft: 1000, white_glove_certified: true, assembly_certified: true }
              as: PlatformAdmin
              captures: { team_id: $.data.id }
            - call: "POST /customers"
              payload: { full_name: "Cara", address_line: "1 St", region_code: "CA", geo_lat: 34.0, geo_lng: -118.0 }
              as: PlatformAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /delivery-orders"
              payload: { customer_id: "${cust_id}", item_description: "Sofa", weight_lbs: 200, volume_cuft: 30, declared_value_cents: 250000, service_level: "WHITE_GLOVE", assembly_required: true, haul_away_required: true, stair_flights: 6 }
              as: DispatchPlanner
              captures: { order_id: $.data.id, o_v: $.data.version, quoted: $.data.quoted_fee_cents }
            - call: "POST /delivery-orders/${order_id}/windows"
              payload: { team_id: "${team_id}", service_date: "2026-06-01", window_start_min: 480, window_end_min: 600, expected_order_version: "${o_v}" }
              as: DispatchPlanner
              captures: { window_id: $.data.id }
            - call: "POST /routes"
              payload: { depot_id: "${depot_id}", team_id: "${team_id}", service_date: "2026-06-01" }
              as: DispatchPlanner
              captures: { route_id: $.data.id }
            - call: "POST /routes/${route_id}/stops"
              payload: { order_id: "${order_id}", window_id: "${window_id}" }
              as: DispatchPlanner
              captures: { stop_id: $.data.id }
            - call: "POST /routes/${route_id}/dock-appointments"
              payload: { dock_id: "${dock_id}", appt_date: "2026-06-01", appt_start_min: 360, appt_end_min: 420 }
              as: DockCoordinator
              captures: { appt_id: $.data.id }
            - call: "POST /routes/${route_id}/dispatch"
              payload: {}
              as: DispatchPlanner
          trigger:
            - call: "POST /delivery-orders/${order_id}/attempts"
              payload: { outcome: "DELIVERED", placement: "ROOM_OF_CHOICE", signature_captured: true, photo_count: 2, assembly_completed: false, debris_weight_lbs: 120 }
              as: DeliveryLead
              as_user_id: "${team_id}"
          assert:
            - "DeliveryOrder.${order_id}.quoted_fee_cents == 27325"
            - "DeliveryOrder.${order_id}.final_fee_cents == 17500"
            - "DeliveryOrder.${order_id}.status == DELIVERED"

      - name: team_estimated_vs_settled_liability
        grounds:
          - calculations.team_liability
          - entities.DeliveryTeam.fields.estimated_liability_points
          - entities.DeliveryTeam.fields.settled_liability_points
        distinguishing_aspect: |
          On the DeliveryTeam domain: estimated_liability_points (forward exposure from one open
          WHITE_GLOVE window, declared 250000 -> ceil(250000/100000)=3) == 3 while
          settled_liability_points (one realized MINOR damage penalty=20) == 20 — same team,
          two algorithms, 3 != 20.
        test_recipe:
          setup:
            - "Team T has one open WHITE_GLOVE window (order A, declared 250000, RESERVED) contributing 3 estimated points, and a separate THRESHOLD order B that is dispatched and then DAMAGED (MINOR) contributing 20 settled points."
          setup_api_calls:
            - call: "POST /depots"
              payload: { name: "Depot A", region_code: "CA" }
              as: PlatformAdmin
              captures: { depot_id: $.data.id }
            - call: "POST /docks"
              payload: { depot_id: "${depot_id}", dock_code: "D1" }
              as: PlatformAdmin
              captures: { dock_id: $.data.id }
            - call: "POST /delivery-teams"
              payload: { depot_id: "${depot_id}", team_name: "T1", lead_name: "Lee", member2_name: "Max", region_code: "CA", max_daily_stops: 10, max_daily_weight_lbs: 500, max_daily_volume_cuft: 1000, white_glove_certified: true, assembly_certified: false }
              as: PlatformAdmin
              captures: { team_id: $.data.id }
            - call: "POST /customers"
              payload: { full_name: "Cara", address_line: "1 St", region_code: "CA", geo_lat: 34.0, geo_lng: -118.0 }
              as: PlatformAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /delivery-orders"
              payload: { customer_id: "${cust_id}", item_description: "Wardrobe", weight_lbs: 50, volume_cuft: 10, declared_value_cents: 250000, service_level: "WHITE_GLOVE" }
              as: DispatchPlanner
              captures: { a_id: $.data.id, a_v: $.data.version }
            - call: "POST /delivery-orders/${a_id}/windows"
              payload: { team_id: "${team_id}", service_date: "2026-06-01", window_start_min: 480, window_end_min: 600, expected_order_version: "${a_v}" }
              as: DispatchPlanner
              captures: { wa_id: $.data.id }
            - call: "POST /delivery-orders"
              payload: { customer_id: "${cust_id}", item_description: "Table", weight_lbs: 50, volume_cuft: 10, declared_value_cents: 10000, service_level: "THRESHOLD" }
              as: DispatchPlanner
              captures: { b_id: $.data.id, b_v: $.data.version }
            - call: "POST /delivery-orders/${b_id}/windows"
              payload: { team_id: "${team_id}", service_date: "2026-06-01", window_start_min: 660, window_end_min: 780, expected_order_version: "${b_v}" }
              as: DispatchPlanner
              captures: { wb_id: $.data.id }
            - call: "POST /routes"
              payload: { depot_id: "${depot_id}", team_id: "${team_id}", service_date: "2026-06-01" }
              as: DispatchPlanner
              captures: { route_id: $.data.id }
            - call: "POST /routes/${route_id}/stops"
              payload: { order_id: "${b_id}", window_id: "${wb_id}" }
              as: DispatchPlanner
              captures: { sb_id: $.data.id }
            - call: "POST /routes/${route_id}/dock-appointments"
              payload: { dock_id: "${dock_id}", appt_date: "2026-06-01", appt_start_min: 360, appt_end_min: 420 }
              as: DockCoordinator
              captures: { appt_id: $.data.id }
            - call: "POST /routes/${route_id}/dispatch"
              payload: {}
              as: DispatchPlanner
          trigger:
            - call: "POST /delivery-orders/${b_id}/attempts"
              payload: { outcome: "DAMAGED", damage_severity: "MINOR", refusal_reason: "corner chipped" }
              as: DeliveryLead
              as_user_id: "${team_id}"
          assert:
            - "DeliveryTeam.${team_id}.estimated_liability_points == 3"
            - "DeliveryTeam.${team_id}.settled_liability_points == 20"

  # =========================================================================
  # Rule 2 — Combinatorial formulas across different modes
  # =========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: quote_nonlinear_wg_multiplier_mode_a
        grounds:
          - calculations.order_fee_quote
          - entities.DeliveryOrder.fields.quoted_fee_cents
        distinguishing_aspect: |
          Mode (a): quoted_fee_cents combines >=3 inputs with non-linear interaction — tiered
          weight-surcharge selection (200 lbs -> 3500), min(stair_flights,5) cap (6 -> 5 flights),
          and the WHITE_GLOVE 1.15 multiplier applied to (base+weight)=15500 BEFORE flat
          surcharges — yielding round(15500*1.15)=17825 then +4000+2500+3000 = 27325.
        test_recipe:
          setup:
            - "A single WHITE_GLOVE order with weight 200, stair 6, assembly_required, haul_away_required just created (quote computed on create)."
          setup_api_calls:
            - call: "POST /depots"
              payload: { name: "Depot A", region_code: "CA" }
              as: PlatformAdmin
              captures: { depot_id: $.data.id }
            - call: "POST /customers"
              payload: { full_name: "Cara", address_line: "1 St", region_code: "CA", geo_lat: 34.0, geo_lng: -118.0 }
              as: PlatformAdmin
              captures: { cust_id: $.data.id }
          trigger:
            - call: "POST /delivery-orders"
              payload: { customer_id: "${cust_id}", item_description: "Sofa", weight_lbs: 200, volume_cuft: 30, declared_value_cents: 250000, service_level: "WHITE_GLOVE", assembly_required: true, haul_away_required: true, stair_flights: 6 }
              as: DispatchPlanner
              captures: { order_id: $.data.id }
          assert:
            - "DeliveryOrder.${order_id}.quoted_fee_cents == 27325"

      - name: route_settlement_per_stop_rounding_mode_b
        grounds:
          - calculations.route_settlement
          - entities.Route.fields.route_settlement_cents
        distinguishing_aspect: |
          Mode (b): route_settlement_cents rounds the 0.375 team payout PER COMPLETED STOP then
          sums (round(17825*0.375)=6684 twice -> 13368), which differs from summing final fees
          then rounding (round((17825+17825)*0.375)=round(13368.75)=13369). Pinned order:
          round-per-stop-then-sum.
        test_recipe:
          setup:
            - "Two WHITE_GLOVE orders (weight 200, no stair/assembly/haul) each delivered on the same route as WHITE_GLOVE first attempt -> final_fee 17825 each; both stops COMPLETED; route DISPATCHED, ready to close."
          setup_api_calls:
            - call: "POST /depots"
              payload: { name: "Depot A", region_code: "CA" }
              as: PlatformAdmin
              captures: { depot_id: $.data.id }
            - call: "POST /docks"
              payload: { depot_id: "${depot_id}", dock_code: "D1" }
              as: PlatformAdmin
              captures: { dock_id: $.data.id }
            - call: "POST /delivery-teams"
              payload: { depot_id: "${depot_id}", team_name: "T1", lead_name: "Lee", member2_name: "Max", region_code: "CA", max_daily_stops: 10, max_daily_weight_lbs: 500, max_daily_volume_cuft: 1000, white_glove_certified: true, assembly_certified: true }
              as: PlatformAdmin
              captures: { team_id: $.data.id }
            - call: "POST /customers"
              payload: { full_name: "Cara", address_line: "1 St", region_code: "CA", geo_lat: 34.0, geo_lng: -118.0 }
              as: PlatformAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /delivery-orders"
              payload: { customer_id: "${cust_id}", item_description: "Sofa 1", weight_lbs: 200, volume_cuft: 30, declared_value_cents: 100000, service_level: "WHITE_GLOVE" }
              as: DispatchPlanner
              captures: { o1_id: $.data.id, o1_v: $.data.version }
            - call: "POST /delivery-orders/${o1_id}/windows"
              payload: { team_id: "${team_id}", service_date: "2026-06-01", window_start_min: 480, window_end_min: 600, expected_order_version: "${o1_v}" }
              as: DispatchPlanner
              captures: { w1_id: $.data.id }
            - call: "POST /delivery-orders"
              payload: { customer_id: "${cust_id}", item_description: "Sofa 2", weight_lbs: 200, volume_cuft: 30, declared_value_cents: 100000, service_level: "WHITE_GLOVE" }
              as: DispatchPlanner
              captures: { o2_id: $.data.id, o2_v: $.data.version }
            - call: "POST /delivery-orders/${o2_id}/windows"
              payload: { team_id: "${team_id}", service_date: "2026-06-01", window_start_min: 660, window_end_min: 780, expected_order_version: "${o2_v}" }
              as: DispatchPlanner
              captures: { w2_id: $.data.id }
            - call: "POST /routes"
              payload: { depot_id: "${depot_id}", team_id: "${team_id}", service_date: "2026-06-01" }
              as: DispatchPlanner
              captures: { route_id: $.data.id }
            - call: "POST /routes/${route_id}/stops"
              payload: { order_id: "${o1_id}", window_id: "${w1_id}" }
              as: DispatchPlanner
              captures: { s1_id: $.data.id }
            - call: "POST /routes/${route_id}/stops"
              payload: { order_id: "${o2_id}", window_id: "${w2_id}" }
              as: DispatchPlanner
              captures: { s2_id: $.data.id }
            - call: "POST /routes/${route_id}/dock-appointments"
              payload: { dock_id: "${dock_id}", appt_date: "2026-06-01", appt_start_min: 360, appt_end_min: 420 }
              as: DockCoordinator
              captures: { appt_id: $.data.id }
            - call: "POST /routes/${route_id}/dispatch"
              payload: {}
              as: DispatchPlanner
            - call: "POST /delivery-orders/${o1_id}/attempts"
              payload: { outcome: "DELIVERED", placement: "WHITE_GLOVE", signature_captured: true, photo_count: 2 }
              as: DeliveryLead
              as_user_id: "${team_id}"
            - call: "POST /delivery-orders/${o2_id}/attempts"
              payload: { outcome: "DELIVERED", placement: "WHITE_GLOVE", signature_captured: true, photo_count: 2 }
              as: DeliveryLead
              as_user_id: "${team_id}"
          trigger:
            - call: "POST /routes/${route_id}/close"
              payload: {}
              as: DispatchPlanner
          assert:
            - "Route.${route_id}.route_settlement_cents == 13368"
            - "Route.${route_id}.status == CLOSED"

  # =========================================================================
  # Rule 3 — Non-linear state-machine shape on different entities
  # =========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: order_reattempt_cycle
        grounds:
          - state_machines.DeliveryOrder.OUT_FOR_DELIVERY_to_REFUSED_RETRY
          - state_machines.DeliveryOrder.REFUSED_RETRY_to_SCHEDULED
          - entities.DeliveryOrder.fields.reattempt_count
        distinguishing_aspect: |
          DeliveryOrder is cyclic: a REFUSED attempt drives OUT_FOR_DELIVERY->REFUSED_RETRY, then a
          fresh window drives REFUSED_RETRY->SCHEDULED, re-entering the routing loop — order ends
          in SCHEDULED (a non-terminal state) with reattempt_count==1, not stuck terminal.
        test_recipe:
          setup:
            - "A THRESHOLD order dispatched to OUT_FOR_DELIVERY, then REFUSED once (reattempt_count 1, status REFUSED_RETRY, prior window RELEASED)."
          setup_api_calls:
            - call: "POST /depots"
              payload: { name: "Depot A", region_code: "CA" }
              as: PlatformAdmin
              captures: { depot_id: $.data.id }
            - call: "POST /docks"
              payload: { depot_id: "${depot_id}", dock_code: "D1" }
              as: PlatformAdmin
              captures: { dock_id: $.data.id }
            - call: "POST /delivery-teams"
              payload: { depot_id: "${depot_id}", team_name: "T1", lead_name: "Lee", member2_name: "Max", region_code: "CA", max_daily_stops: 10, max_daily_weight_lbs: 500, max_daily_volume_cuft: 1000 }
              as: PlatformAdmin
              captures: { team_id: $.data.id }
            - call: "POST /customers"
              payload: { full_name: "Cara", address_line: "1 St", region_code: "CA", geo_lat: 34.0, geo_lng: -118.0 }
              as: PlatformAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /delivery-orders"
              payload: { customer_id: "${cust_id}", item_description: "Table", weight_lbs: 100, volume_cuft: 20, declared_value_cents: 10000, service_level: "THRESHOLD" }
              as: DispatchPlanner
              captures: { order_id: $.data.id, o_v: $.data.version }
            - call: "POST /delivery-orders/${order_id}/windows"
              payload: { team_id: "${team_id}", service_date: "2026-06-01", window_start_min: 480, window_end_min: 600, expected_order_version: "${o_v}" }
              as: DispatchPlanner
              captures: { w1_id: $.data.id }
            - call: "POST /routes"
              payload: { depot_id: "${depot_id}", team_id: "${team_id}", service_date: "2026-06-01" }
              as: DispatchPlanner
              captures: { route_id: $.data.id }
            - call: "POST /routes/${route_id}/stops"
              payload: { order_id: "${order_id}", window_id: "${w1_id}" }
              as: DispatchPlanner
              captures: { s1_id: $.data.id }
            - call: "POST /routes/${route_id}/dock-appointments"
              payload: { dock_id: "${dock_id}", appt_date: "2026-06-01", appt_start_min: 360, appt_end_min: 420 }
              as: DockCoordinator
              captures: { appt_id: $.data.id }
            - call: "POST /routes/${route_id}/dispatch"
              payload: {}
              as: DispatchPlanner
            - call: "POST /delivery-orders/${order_id}/attempts"
              payload: { outcome: "REFUSED", refusal_reason: "customer changed mind" }
              as: DeliveryLead
              as_user_id: "${team_id}"
            - call: "GET /delivery-orders/${order_id}"
              payload: {}
              as: DispatchPlanner
              captures: { o_v2: $.data.version }
          trigger:
            - call: "POST /delivery-orders/${order_id}/windows"
              payload: { team_id: "${team_id}", service_date: "2026-06-02", window_start_min: 480, window_end_min: 600, expected_order_version: "${o_v2}" }
              as: DispatchPlanner
              captures: { w2_id: $.data.id }
          assert:
            - "DeliveryOrder.${order_id}.status == SCHEDULED"
            - "DeliveryOrder.${order_id}.reattempt_count == 1"

      - name: routestop_fork_completed_vs_skipped
        grounds:
          - state_machines.RouteStop.PLANNED_to_COMPLETED
          - state_machines.RouteStop.PLANNED_to_SKIPPED
          - entities.Route.fields.committed_weight_lbs
        distinguishing_aspect: |
          RouteStop forks non-linearly from PLANNED: a DELIVERED attempt drives one stop
          PLANNED->COMPLETED (weight retained) while a REFUSED attempt drives a sibling stop
          PLANNED->SKIPPED (weight released) — divergent side-effect sets leave
          route.committed_weight_lbs == 100 (only the COMPLETED stop's 100 lbs remain).
        test_recipe:
          setup:
            - "One route with two PLANNED stops (order1 weight 100, order2 weight 150; committed_weight 250) dispatched to OUT_FOR_DELIVERY."
          setup_api_calls:
            - call: "POST /depots"
              payload: { name: "Depot A", region_code: "CA" }
              as: PlatformAdmin
              captures: { depot_id: $.data.id }
            - call: "POST /docks"
              payload: { depot_id: "${depot_id}", dock_code: "D1" }
              as: PlatformAdmin
              captures: { dock_id: $.data.id }
            - call: "POST /delivery-teams"
              payload: { depot_id: "${depot_id}", team_name: "T1", lead_name: "Lee", member2_name: "Max", region_code: "CA", max_daily_stops: 10, max_daily_weight_lbs: 500, max_daily_volume_cuft: 1000 }
              as: PlatformAdmin
              captures: { team_id: $.data.id }
            - call: "POST /customers"
              payload: { full_name: "Cara", address_line: "1 St", region_code: "CA", geo_lat: 34.0, geo_lng: -118.0 }
              as: PlatformAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /delivery-orders"
              payload: { customer_id: "${cust_id}", item_description: "Chair", weight_lbs: 100, volume_cuft: 20, declared_value_cents: 10000, service_level: "THRESHOLD" }
              as: DispatchPlanner
              captures: { o1_id: $.data.id, o1_v: $.data.version }
            - call: "POST /delivery-orders/${o1_id}/windows"
              payload: { team_id: "${team_id}", service_date: "2026-06-01", window_start_min: 480, window_end_min: 600, expected_order_version: "${o1_v}" }
              as: DispatchPlanner
              captures: { w1_id: $.data.id }
            - call: "POST /delivery-orders"
              payload: { customer_id: "${cust_id}", item_description: "Desk", weight_lbs: 150, volume_cuft: 25, declared_value_cents: 10000, service_level: "THRESHOLD" }
              as: DispatchPlanner
              captures: { o2_id: $.data.id, o2_v: $.data.version }
            - call: "POST /delivery-orders/${o2_id}/windows"
              payload: { team_id: "${team_id}", service_date: "2026-06-01", window_start_min: 660, window_end_min: 780, expected_order_version: "${o2_v}" }
              as: DispatchPlanner
              captures: { w2_id: $.data.id }
            - call: "POST /routes"
              payload: { depot_id: "${depot_id}", team_id: "${team_id}", service_date: "2026-06-01" }
              as: DispatchPlanner
              captures: { route_id: $.data.id }
            - call: "POST /routes/${route_id}/stops"
              payload: { order_id: "${o1_id}", window_id: "${w1_id}" }
              as: DispatchPlanner
              captures: { s1_id: $.data.id }
            - call: "POST /routes/${route_id}/stops"
              payload: { order_id: "${o2_id}", window_id: "${w2_id}" }
              as: DispatchPlanner
              captures: { s2_id: $.data.id }
            - call: "POST /routes/${route_id}/dock-appointments"
              payload: { dock_id: "${dock_id}", appt_date: "2026-06-01", appt_start_min: 360, appt_end_min: 420 }
              as: DockCoordinator
              captures: { appt_id: $.data.id }
            - call: "POST /routes/${route_id}/dispatch"
              payload: {}
              as: DispatchPlanner
          trigger:
            - call: "POST /delivery-orders/${o1_id}/attempts"
              payload: { outcome: "DELIVERED", placement: "THRESHOLD", signature_captured: true, photo_count: 1 }
              as: DeliveryLead
              as_user_id: "${team_id}"
            - call: "POST /delivery-orders/${o2_id}/attempts"
              payload: { outcome: "REFUSED", refusal_reason: "not home" }
              as: DeliveryLead
              as_user_id: "${team_id}"
          assert:
            - "RouteStop.${s1_id}.status == COMPLETED"
            - "RouteStop.${s2_id}.status == SKIPPED"
            - "Route.${route_id}.committed_weight_lbs == 100"
            - "Route.${route_id}.committed_stops == 1"

  # =========================================================================
  # Rule 4 — Transitive cascade chains from different triggers
  # =========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: refusal_depth3_cascade
        grounds:
          - state_machines.DeliveryOrder.OUT_FOR_DELIVERY_to_REFUSED_RETRY
          - state_machines.RouteStop.PLANNED_to_SKIPPED
          - calculations.route_load_reconciliation
          - entities.Route.fields.committed_weight_lbs
        distinguishing_aspect: |
          A REFUSED attempt triggers a depth-3 chain: attempt -> order (status REFUSED_RETRY,
          reattempt_count 0->1) -> RouteStop (PLANNED->SKIPPED, caused by the order leaving
          OUT_FOR_DELIVERY) -> Route.committed_weight_lbs recompute (150->0, caused by the stop
          becoming SKIPPED). Each hop is caused by the previous, not by the attempt.
        test_recipe:
          setup:
            - "A single THRESHOLD order weight 150 routed on a dispatched route (committed_weight 150), status OUT_FOR_DELIVERY."
          setup_api_calls:
            - call: "POST /depots"
              payload: { name: "Depot A", region_code: "CA" }
              as: PlatformAdmin
              captures: { depot_id: $.data.id }
            - call: "POST /docks"
              payload: { depot_id: "${depot_id}", dock_code: "D1" }
              as: PlatformAdmin
              captures: { dock_id: $.data.id }
            - call: "POST /delivery-teams"
              payload: { depot_id: "${depot_id}", team_name: "T1", lead_name: "Lee", member2_name: "Max", region_code: "CA", max_daily_stops: 10, max_daily_weight_lbs: 500, max_daily_volume_cuft: 1000 }
              as: PlatformAdmin
              captures: { team_id: $.data.id }
            - call: "POST /customers"
              payload: { full_name: "Cara", address_line: "1 St", region_code: "CA", geo_lat: 34.0, geo_lng: -118.0 }
              as: PlatformAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /delivery-orders"
              payload: { customer_id: "${cust_id}", item_description: "Cabinet", weight_lbs: 150, volume_cuft: 25, declared_value_cents: 10000, service_level: "THRESHOLD" }
              as: DispatchPlanner
              captures: { order_id: $.data.id, o_v: $.data.version }
            - call: "POST /delivery-orders/${order_id}/windows"
              payload: { team_id: "${team_id}", service_date: "2026-06-01", window_start_min: 480, window_end_min: 600, expected_order_version: "${o_v}" }
              as: DispatchPlanner
              captures: { w1_id: $.data.id }
            - call: "POST /routes"
              payload: { depot_id: "${depot_id}", team_id: "${team_id}", service_date: "2026-06-01" }
              as: DispatchPlanner
              captures: { route_id: $.data.id }
            - call: "POST /routes/${route_id}/stops"
              payload: { order_id: "${order_id}", window_id: "${w1_id}" }
              as: DispatchPlanner
              captures: { s1_id: $.data.id }
            - call: "POST /routes/${route_id}/dock-appointments"
              payload: { dock_id: "${dock_id}", appt_date: "2026-06-01", appt_start_min: 360, appt_end_min: 420 }
              as: DockCoordinator
              captures: { appt_id: $.data.id }
            - call: "POST /routes/${route_id}/dispatch"
              payload: {}
              as: DispatchPlanner
          trigger:
            - call: "POST /delivery-orders/${order_id}/attempts"
              payload: { outcome: "REFUSED", refusal_reason: "damaged box" }
              as: DeliveryLead
              as_user_id: "${team_id}"
          assert:
            - "DeliveryOrder.${order_id}.status == REFUSED_RETRY"
            - "DeliveryOrder.${order_id}.reattempt_count == 1"
            - "RouteStop.${s1_id}.status == SKIPPED"
            - "Route.${route_id}.committed_weight_lbs == 0"
            - "Route.${route_id}.committed_stops == 0"

      - name: dock_close_depth2_cascade
        grounds:
          - state_machines.Dock.OPEN_to_CLOSED
          - state_machines.DockAppointment.BOOKED_to_RELEASED
          - entities.Route.fields.dock_ready
          - entities.Route.fields.dock_appointment_id
        distinguishing_aspect: |
          Closing a Dock triggers a depth-2 chain from a DIFFERENT trigger than refusal: dock ->
          appointment (BOOKED->RELEASED) -> route (dock_appointment_id->null, dock_ready true->false,
          caused by the appointment release). The route flip is caused by the release, not the
          dock-close call.
        test_recipe:
          setup:
            - "A route with one BOOKED dock appointment (route.dock_ready true, dock_appointment_id set); dock is OPEN."
          setup_api_calls:
            - call: "POST /depots"
              payload: { name: "Depot A", region_code: "CA" }
              as: PlatformAdmin
              captures: { depot_id: $.data.id }
            - call: "POST /docks"
              payload: { depot_id: "${depot_id}", dock_code: "D1" }
              as: PlatformAdmin
              captures: { dock_id: $.data.id }
            - call: "POST /delivery-teams"
              payload: { depot_id: "${depot_id}", team_name: "T1", lead_name: "Lee", member2_name: "Max", region_code: "CA", max_daily_stops: 10, max_daily_weight_lbs: 500, max_daily_volume_cuft: 1000 }
              as: PlatformAdmin
              captures: { team_id: $.data.id }
            - call: "POST /routes"
              payload: { depot_id: "${depot_id}", team_id: "${team_id}", service_date: "2026-06-01" }
              as: DispatchPlanner
              captures: { route_id: $.data.id }
            - call: "POST /routes/${route_id}/dock-appointments"
              payload: { dock_id: "${dock_id}", appt_date: "2026-06-01", appt_start_min: 360, appt_end_min: 420 }
              as: DockCoordinator
              captures: { appt_id: $.data.id }
          trigger:
            - call: "POST /docks/${dock_id}/close"
              payload: {}
              as: DockCoordinator
          assert:
            - "DockAppointment.${appt_id}.status == RELEASED"
            - "Route.${route_id}.dock_ready == false"
            - "Route.${route_id}.dock_appointment_id == null"

  # =========================================================================
  # Rule 5 — Validation priority conflicts across different error-category pairs
  # =========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: state_beats_fiscal_on_add_stop
        grounds:
          - validations[priority=7]
          - validations[priority=12]
          - errors[ERR_INVALID_STATE]
          - errors[ERR_ROUTE_WEIGHT_EXCEEDED]
        distinguishing_aspect: |
          Adding a stop that violates BOTH state (route DISPATCHED, priority 7) and business_fiscal
          capacity (400+200 > 500, priority 12) returns the state error ERR_INVALID_STATE (409),
          not ERR_ROUTE_WEIGHT_EXCEEDED — pair state x business_fiscal.
        test_recipe:
          setup:
            - "Route DISPATCHED carrying order1 (weight 400); a second SCHEDULED order2 (weight 200) whose window matches the route team/date but whose addition would exceed the 500 weight cap."
          setup_api_calls:
            - call: "POST /depots"
              payload: { name: "Depot A", region_code: "CA" }
              as: PlatformAdmin
              captures: { depot_id: $.data.id }
            - call: "POST /docks"
              payload: { depot_id: "${depot_id}", dock_code: "D1" }
              as: PlatformAdmin
              captures: { dock_id: $.data.id }
            - call: "POST /delivery-teams"
              payload: { depot_id: "${depot_id}", team_name: "T1", lead_name: "Lee", member2_name: "Max", region_code: "CA", max_daily_stops: 10, max_daily_weight_lbs: 500, max_daily_volume_cuft: 1000 }
