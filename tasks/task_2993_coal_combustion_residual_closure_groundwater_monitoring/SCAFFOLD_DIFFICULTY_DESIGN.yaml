            - "DisposalUnit.${unit_id}.closure_state == CLOSURE_PLANNED"

  - rule_id: resource_temporal_overlap
    instances:
      - name: sampling_interval_window_is_half_open_at_exactly_ninety_days
        grounds:
          - validations.priority_40_ERR_SAMPLE_INTERVAL_TOO_SHORT
          - entities.SamplingEvent.fields.sampled_on
          - calculations.sampling_schedule
          - errors.ERR_SAMPLE_INTERVAL_TOO_SHORT
        distinguishing_aspect: |
          The forbidden region for a new event is the temporal window that opens on the latest VALIDATED
          event's sampled_on and closes one day short of ninety days later. Day 89 after 2026-06-15
          (2026-09-12) overlaps that window and is refused; day 90 (2026-09-13) is the first date that
          does not, and it is accepted. The two calls differ by a single day and by nothing else, so an
          off-by-one in either direction of the interval comparison is caught.
        test_recipe:
          setup:
            - "One clean unit with a certified network of four background and three downgradient wells"
            - "One VALIDATED DETECTION event sampled_on 2026-06-15, which becomes the program's latest VALIDATED event"
            - "Logical clock advanced to 2026-09-20 so that both candidate dates are in the past and the future-date rule cannot fire"
          setup_api_calls:
            - call: "POST /ccr/professionals"
              payload: { full_name: "Mia Chen", license_number: "HG-33003", license_state: "NC", discipline: "HYDROGEOLOGY" }
              as: UtilityAdmin
              captures: { hg_id: $.data.id }
