            - "Response status == 403 and data.error_id == ERR_FORBIDDEN"

      - name: storeoperator_cannot_create_store
        claim_type: peer_roles
        grounds: ["roles", "validations[priority=2]", "errors[ERR_FORBIDDEN]"]
        distinguishing_aspect: "StoreOperator calling POST /stores (a PlatformAdmin-exclusive op) -> 403 ERR_FORBIDDEN."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - { call: "POST /stores", payload: { name: "X", timezone: "America/Los_Angeles", slot_capacity: 5, prep_minutes: 0 }, as: StoreOperator, captures: { err: $.data.error_id } }
          assert:
            - "Response status == 403 and data.error_id == ERR_FORBIDDEN"

      - name: missing_auth_headers_returns_unauthenticated
        claim_type: peer_roles
        grounds: ["roles", "validations[priority=1]", "errors[ERR_UNAUTHENTICATED]"]
        distinguishing_aspect: "A request to a protected endpoint with no X-User-Role/X-User-ID -> 401 ERR_UNAUTHENTICATED."
        test_recipe:
          setup: ["A member exists."]
          setup_api_calls:
            - { call: "POST /members", payload: { email: "ua@x.com", full_name: "UA", birth_month_day: "03-14" }, as: Anonymous, captures: { mid: $.data.id } }
          trigger:
            - { call: "GET /members/${mid}", payload: {}, as: NoAuth, captures: { err: $.data.error_id } }
          assert:
            - "Response status == 401 and data.error_id == ERR_UNAUTHENTICATED"

  # ---------------------------------------------------------------------------
  - section: errors
    instances:
      - name: duplicate_card_creation_not_possible
        claim_type: violation_to_error
        grounds: ["errors[ERR_DUPLICATE_CARD]", "entities.StoredValueCard.fields.member_id"]
        distinguishing_aspect: "Cards are auto-created and there is no public create-card endpoint; ERR_DUPLICATE_CARD guards any internal second-card attempt. Covered indirectly: a member always has exactly one card (asserted via the register_auto_creates_card corner)."
        excluded_because:
          difficulty_instance: dual_variant_calc / order_total_no_reward_vs_capped_reward
          rationale: "ERR_DUPLICATE_CARD is a defensive guard with no public producing endpoint; single-card invariant is asserted by the register_auto_creates_card entity corner above, and the §1.8 flows all assume the one auto-created card."

      - name: slot_overlap_error_triggerable
        claim_type: violation_to_error
        grounds: ["errors[ERR_SLOT_OVERLAP]"]
        excluded_because:
          difficulty_instance: resource_temporal_overlap / pickup_slot_create_halfopen_overlap_rejected
          rationale: "ERR_SLOT_OVERLAP is exercised directly by the named §1.8 instance."

  # ---------------------------------------------------------------------------
  - section: cross_cutting_complexity_layers
    instances:
      - name: occ_card_stale_version_on_pay
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[pay-stale-card-version]", "entities.StoredValueCard.fields.version", "errors[ERR_STALE_VERSION]"]
        distinguishing_aspect: "Client observes card version v, performs a manual reload (bumping to v+1), then pays carrying expected_card_version = stale v -> 412 ERR_STALE_VERSION."
        test_recipe:
          setup: ["Clock set; latte 615c; member card funded; client holds a stale card version captured before a second reload."]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-06-01T00:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /stores", payload: { name: "S", timezone: "America/Los_Angeles", slot_capacity: 5, prep_minutes: 0 }, as: PlatformAdmin, captures: { store_id: $.data.id } }
            - { call: "POST /stores/${store_id}/menu-items", payload: { name: "Latte", base_price_cents: 615, category: "BEVERAGE" }, as: PlatformAdmin, captures: { latte_id: $.data.id } }
            - { call: "POST /stores/${store_id}/pickup-slots", payload: { window_start: "2026-06-01T17:00:00Z", window_end: "2026-06-01T17:15:00Z" }, as: PlatformAdmin, captures: { slot_id: $.data.id } }
            - { call: "POST /members", payload: { email: "occ@x.com", full_name: "OCC", birth_month_day: "03-14" }, as: Anonymous, captures: { mid: $.data.id } }
            - { call: "POST /members/${mid}/card/reload", payload: { amount_cents: 5000 }, as: Member, as_user_id: "${mid}", captures: { stale_v: $.data.version } }
            - { call: "POST /members/${mid}/card/reload", payload: { amount_cents: 1000 }, as: Member, as_user_id: "${mid}" }
            - { call: "POST /members/${mid}/orders", payload: { store_id: "${store_id}", pickup_slot_id: "${slot_id}" }, as: Member, as_user_id: "${mid}", captures: { oid: $.data.id } }
            - { call: "POST /members/${mid}/orders/${oid}/lines", payload: { menu_item_id: "${latte_id}", quantity: 1 }, as: Member, as_user_id: "${mid}" }
          trigger:
            - { call: "POST /members/${mid}/orders/${oid}/pay", payload: { pay_method: "STORED_VALUE", expected_card_version: "${stale_v}" }, as: Member, as_user_id: "${mid}", captures: { err: $.data.error_id } }
          assert:
            - "Response status == 412 and data.error_id == ERR_STALE_VERSION"
            - "Order.${oid}.payment_status == UNPAID"

      - name: occ_slot_stale_version_on_place
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[reserve-slot-stale-version]", "entities.PickupSlot.fields.version", "errors[ERR_STALE_VERSION]"]
        distinguishing_aspect: "Client observes slot version v; another member places into the same slot (bumping to v+1); the first place carrying stale v -> 412 ERR_STALE_VERSION."
        test_recipe:
          setup: ["Clock set; slot_capacity 5; two members each with a paid order on the same slot; first client holds a stale slot version."]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-06-01T00:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /stores", payload: { name: "S", timezone: "America/Los_Angeles", slot_capacity: 5, prep_minutes: 0 }, as: PlatformAdmin, captures: { store_id: $.data.id } }
            - { call: "POST /stores/${store_id}/menu-items", payload: { name: "Latte", base_price_cents: 615, category: "BEVERAGE" }, as: PlatformAdmin, captures: { latte_id: $.data.id } }
            - { call: "POST /stores/${store_id}/pickup-slots", payload: { window_start: "2026-06-01T17:00:00Z", window_end: "2026-06-01T17:15:00Z" }, as: PlatformAdmin, captures: { slot_id: $.data.id, slot_v0: $.data.version } }
            - { call: "POST /members", payload: { email: "o1@x.com", full_name: "O1", birth_month_day: "03-14" }, as: Anonymous, captures: { m1: $.data.id } }
            - { call: "POST /members/${m1}/orders", payload: { store_id: "${store_id}", pickup_slot_id: "${slot_id}" }, as: Member, as_user_id: "${m1}", captures: { o1: $.data.id } }
            - { call: "POST /members/${m1}/orders/${o1}/lines", payload: { menu_item_id: "${latte_id}", quantity: 1 }, as: Member, as_user_id: "${m1}" }
            - { call: "POST /members/${m1}/orders/${o1}/pay", payload: { pay_method: "EXTERNAL_CARD" }, as: Member, as_user_id: "${m1}" }
            - { call: "POST /members", payload: { email: "o2@x.com", full_name: "O2", birth_month_day: "03-14" }, as: Anonymous, captures: { m2: $.data.id } }
            - { call: "POST /members/${m2}/orders", payload: { store_id: "${store_id}", pickup_slot_id: "${slot_id}" }, as: Member, as_user_id: "${m2}", captures: { o2: $.data.id } }
            - { call: "POST /members/${m2}/orders/${o2}/lines", payload: { menu_item_id: "${latte_id}", quantity: 1 }, as: Member, as_user_id: "${m2}" }
            - { call: "POST /members/${m2}/orders/${o2}/pay", payload: { pay_method: "EXTERNAL_CARD" }, as: Member, as_user_id: "${m2}" }
            - { call: "POST /members/${m2}/orders/${o2}/place", payload: { expected_slot_version: "${slot_v0}" }, as: Member, as_user_id: "${m2}" }
          trigger:
            - { call: "POST /members/${m1}/orders/${o1}/place", payload: { expected_slot_version: "${slot_v0}" }, as: Member, as_user_id: "${m1}", captures: { err: $.data.error_id } }
          assert:
            - "Response status == 412 and data.error_id == ERR_STALE_VERSION"
            - "Order.${o1}.fulfillment_status == CART"

      - name: derived_card_balance_after_spend
        claim_type: derived_field_reconciliation
        grounds: ["calculations.card_balance", "entities.StoredValueCard.fields.balance_cents"]
        distinguishing_aspect: "Card funded 5000, STORED_VALUE pay of total 669 -> balance reconciles to 4331 immediately after pay (no auto-reload, balance above threshold)."
        test_recipe:
          setup: ["Clock set; member card funded 5000 (above default threshold 1000, auto-reload off); latte 615c order."]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-06-01T00:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /stores", payload: { name: "S", timezone: "America/Los_Angeles", slot_capacity: 5, prep_minutes: 0 }, as: PlatformAdmin, captures: { store_id: $.data.id } }
            - { call: "POST /stores/${store_id}/menu-items", payload: { name: "Latte", base_price_cents: 615, category: "BEVERAGE" }, as: PlatformAdmin, captures: { latte_id: $.data.id } }
            - { call: "POST /stores/${store_id}/pickup-slots", payload: { window_start: "2026-06-01T17:00:00Z", window_end: "2026-06-01T17:15:00Z" }, as: PlatformAdmin, captures: { slot_id: $.data.id } }
            - { call: "POST /members", payload: { email: "ds@x.com", full_name: "DS", birth_month_day: "03-14" }, as: Anonymous, captures: { mid: $.data.id } }
            - { call: "POST /members/${mid}/card/reload", payload: { amount_cents: 5000 }, as: Member, as_user_id: "${mid}", captures: { card_v: $.data.version } }
            - { call: "POST /members/${mid}/orders", payload: { store_id: "${store_id}", pickup_slot_id: "${slot_id}" }, as: Member, as_user_id: "${mid}", captures: { oid: $.data.id } }
            - { call: "POST /members/${mid}/orders/${oid}/lines", payload: { menu_item_id: "${latte_id}", quantity: 1 }, as: Member, as_user_id: "${mid}" }
          trigger:
            - { call: "POST /members/${mid}/orders/${oid}/pay", payload: { pay_method: "STORED_VALUE", expected_card_version: "${card_v}" }, as: Member, as_user_id: "${mid}" }
            - { call: "GET /members/${mid}/card", payload: {}, as: Member, as_user_id: "${mid}", captures: { bal: "$.data[0].balance_cents" } }
          assert:
            - "StoredValueCard.balance_cents == 4331"

  # ---------------------------------------------------------------------------
  - section: consistency_model
    instances:
      - name: pay_reflects_totals_in_same_response
        claim_type: immediate
        grounds: ["calculations.order_total", "entities.Order.fields.total_cents"]
        distinguishing_aspect: "POST pay's own response carries finalized subtotal_cents/tax_cents/total_cents/stars_earned (immediate consistency)."
        test_recipe:
          setup: ["Clock set; latte 615c order ready to pay (EXTERNAL_CARD)."]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-06-01T00:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /stores", payload: { name: "S", timezone: "America/Los_Angeles", slot_capacity: 5, prep_minutes: 0 }, as: PlatformAdmin, captures: { store_id: $.data.id } }
            - { call: "POST /stores/${store_id}/menu-items", payload: { name: "Latte", base_price_cents: 615, category: "BEVERAGE" }, as: PlatformAdmin, captures: { latte_id: $.data.id } }
            - { call: "POST /stores/${store_id}/pickup-slots", payload: { window_start: "2026-06-01T17:00:00Z", window_end: "2026-06-01T17:15:00Z" }, as: PlatformAdmin, captures: { slot_id: $.data.id } }
            - { call: "POST /members", payload: { email: "im@x.com", full_name: "IM", birth_month_day: "03-14" }, as: Anonymous, captures: { mid: $.data.id } }
            - { call: "POST /members/${mid}/orders", payload: { store_id: "${store_id}", pickup_slot_id: "${slot_id}" }, as: Member, as_user_id: "${mid}", captures: { oid: $.data.id } }
            - { call: "POST /members/${mid}/orders/${oid}/lines", payload: { menu_item_id: "${latte_id}", quantity: 1 }, as: Member, as_user_id: "${mid}" }
          trigger:
            - { call: "POST /members/${mid}/orders/${oid}/pay", payload: { pay_method: "EXTERNAL_CARD" }, as: Member, as_user_id: "${mid}", captures: { tc: $.data.total_cents, sc: $.data.subtotal_cents, se: $.data.stars_earned } }
          assert:
            - "pay response data.subtotal_cents == 615 and data.tax_cents == 54 and data.total_cents == 669 and data.stars_earned == 6"
