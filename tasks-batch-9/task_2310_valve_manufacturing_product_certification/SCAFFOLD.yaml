# =============================================================================
# Scaffold seed tables — task_2310 Valve Manufacturing & Product Certification
# §1.0–§1.7 (difficulty design → SCAFFOLD_DIFFICULTY_DESIGN.yaml,
#            corner design  → SCAFFOLD_CORNER_DESIGN.yaml)
# =============================================================================

scenario: |
  2310. Valve Manufacturing & Product Certification (industrial valve manufacturer): product line design
  across gate, ball, butterfly and control valves with pressure class and material specifications, casting
  and forging procurement with foundry qualification and material traceability, machining, assembly and
  testing with shell, seat and functional testing per standards, industry certification and monogram program
  compliance with quality system audits, actuation packaging with pneumatic, hydraulic and electric actuators
  sized to torque requirements, special service qualification for fire-safe, cryogenic and fugitive emission
  applications, engineered-to-order valves with datasheet review and documentation packages, aftermarket
  parts, repair kits and field service support

domain_name: valve-manufacturing-certification
api_prefix: /valve-mfg

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: graph_constraint
  complexity_layers:
    - dual_variant_calculation
    - cascading_side_effects
    - version_pinning_on_approval
    - optimistic_concurrency
  entity_topology: graph
  # Material traceability is a DAG (Foundry -> HeatLot -> Component -> ValveUnit), FoundryQualification is a
  # scoping junction (foundry x process x material_grade x max_pressure_class), ValveModel is self-referential
  # via supersedes_model_id, and ValveUnit joins four independent aggregates (model, component, license, order).
  state_machine_shape: parallel
  # ValveUnit carries three independent dimensions (build_status x cert_status x service_status);
  # MonogramLicense carries two (license_status x audit_state) plus a derived compliance_posture that gates
  # child operations; EngineeredOrder is cyclic (UNDER_REVIEW -> CLARIFICATION_REQUESTED -> UNDER_REVIEW and
  # IN_PRODUCTION -> HELD -> IN_PRODUCTION); FoundryQualification is cyclic (QUALIFIED -> EXPIRED -> PENDING);
  # MonogramLicense audit closeout is branching with divergent side-effect sets (GRANT | CONDITIONAL | DENY).
  relationship_patterns:
    - one_to_many
    - many_to_many
    - self_referential
    - cross_aggregate
  role_model: segregation_of_duties
  # The QualityManager who certifies a ValveUnit must not be any TestTechnician user who recorded that unit's
  # tests; the MonogramAuditor who leads a license audit must not be the auditor who waives its findings.
  consistency_model: immediate

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: ValveModel
    parent: null
    common_fields: true
    fields:
      - { name: model_code, type: string, source: input, description: "Catalog code of the product line entry", constraints: "unique across ValveModel rows whose status IN {DRAFT, IN_REVIEW, RELEASED}" }
      - { name: valve_type, type: enum, source: input, description: "GATE | BALL | BUTTERFLY | CONTROL", constraints: "GATE and CONTROL are MULTI_TURN; BALL and BUTTERFLY are QUARTER_TURN" }
      - { name: pressure_class, type: integer, source: input, description: "ASME pressure class of the design", constraints: "one of {150, 300, 600, 900, 1500, 2500}" }
      - { name: body_material_grade, type: enum, source: input, description: "WCB | CF8M | LCC | A105 | F316" }
      - { name: bore_size_mm, type: integer, source: input, description: "Nominal bore in millimetres", constraints: "> 0" }
      - { name: seat_type, type: enum, source: input, description: "SOFT | METAL — drives the seat torque factor" }
      - { name: base_break_torque_nm, type: number, source: input, description: "Catalog break torque at zero differential, Nm", constraints: "> 0" }
      - { name: required_special_services, type: array, source: input, default: "[]", description: "Subset of {FIRE_SAFE, CRYOGENIC, FUGITIVE_EMISSION} the design claims" }
      - { name: repair_kit_stock_qty, type: integer, source: input, default: 0, description: "Aftermarket repair-kit units on hand for this model", constraints: ">= 0" }
      - { name: supersedes_model_id, type: string, source: input, description: "FK -> ValveModel.id; the RELEASED model this design replaces; null for a new line", default: "null" }
      - { name: spec_revision, type: integer, source: system, default: 1, description: "Design revision; +1 each time a review rejection sends the model back to DRAFT" }
      - { name: qualified_special_services, type: array, source: computed, description: "Special services with an unexpired PASS type-test TestRecord on any ValveUnit of this model (calc: model_qualified_special_services)" }
      - { name: status, type: enum, source: system, description: "DRAFT | IN_REVIEW | RELEASED | SUPERSEDED | WITHDRAWN" }
      - { name: authored_by_user_id, type: string, source: system, description: "X-User-ID of the ProductEngineer that created the row" }
      - { name: released_at, type: datetime, source: system, description: "Logical-clock instant of the RELEASE decision; null until released", default: "null" }

  - name: Foundry
    parent: null
    common_fields: true
    fields:
      - { name: foundry_code, type: string, source: input, description: "Supplier code", constraints: "globally unique" }
      - { name: name, type: string, source: input, description: "Legal name of the foundry" }
      - { name: country_code, type: string, source: input, description: "ISO 3166-1 alpha-2 country of the works" }
      - { name: total_lot_count, type: integer, source: computed, description: "Count of HeatLot rows with this foundry_id in any status" }
      - { name: rejected_lot_count, type: integer, source: computed, description: "Count of HeatLot rows with this foundry_id whose status IN {QUARANTINED, REJECTED}" }
      - { name: revoked_qualification_count, type: integer, source: computed, description: "Count of FoundryQualification rows with this foundry_id whose status == REVOKED" }
      - { name: quality_index, type: number, source: computed, description: "Foundry quality index, 2dp (calc: foundry_quality_index)" }
      - { name: status, type: enum, source: computed, description: "ACTIVE | PROBATION | SUSPENDED — threshold bands over quality_index" }

  - name: FoundryQualification
    parent: null
    common_fields: true
    fields:
      - { name: foundry_id, type: string, source: input, description: "FK -> Foundry.id; the qualified works" }
      - { name: process, type: enum, source: input, description: "CASTING | FORGING" }
      - { name: material_grade, type: enum, source: input, description: "WCB | CF8M | LCC | A105 | F316 — grade the works is qualified for" }
      - { name: max_pressure_class, type: integer, source: input, description: "Highest ASME class this qualification covers", constraints: "one of {150, 300, 600, 900, 1500, 2500}" }
      - { name: valid_from, type: datetime, source: input, description: "First instant of the qualification window (inclusive)" }
      - { name: valid_until, type: datetime, source: input, description: "Last instant of the qualification window (inclusive)" }
      - { name: status, type: enum, source: system, description: "PENDING | QUALIFIED | EXPIRED | REVOKED" }
      - { name: qualified_by_user_id, type: string, source: system, description: "X-User-ID of the QualityManager who granted QUALIFIED; null while PENDING", default: "null" }
      - { name: requalification_count, type: integer, source: system, default: 0, description: "+1 on every EXPIRED -> PENDING requalification loop" }

  - name: HeatLot
    parent: null
    common_fields: true
    fields:
      - { name: foundry_id, type: string, source: input, description: "FK -> Foundry.id; works that poured or forged the lot" }
      - { name: heat_number, type: string, source: input, description: "Mill heat identifier", constraints: "unique per foundry_id" }
      - { name: material_grade, type: enum, source: input, description: "WCB | CF8M | LCC | A105 | F316" }
      - { name: process, type: enum, source: input, description: "CASTING | FORGING" }
      - { name: qty_received_kg, type: number, source: input, description: "Mass received, 3dp", constraints: "> 0" }
      - { name: mtr_document_ref, type: string, source: input, description: "Material test report (MTR) document reference" }
      - { name: carbon_equivalent_pct, type: number, source: input, description: "Carbon equivalent from the MTR, 3dp" }
      - { name: impact_energy_j, type: number, source: input, description: "Charpy impact energy from the MTR, joules, 1dp" }
      - { name: qty_committed_kg, type: number, source: computed, description: "Sum of Component.net_weight_kg for this lot with status IN {CREATED, ISSUED_TO_MACHINING, CONSUMED, HOLD}" }
      - { name: qty_scrapped_kg, type: number, source: computed, description: "Sum of Component.net_weight_kg for this lot with status == SCRAPPED" }
      - { name: qty_available_kg, type: number, source: computed, description: "= qty_received_kg - qty_committed_kg - qty_scrapped_kg (calc: heat_lot_mass_balance)" }
      - { name: status, type: enum, source: system, description: "RECEIVED | VERIFIED | RELEASED | QUARANTINED | REJECTED" }
      - { name: verified_by_user_id, type: string, source: system, description: "X-User-ID of the QualityManager that verified the MTR; null before VERIFY", default: "null" }
      - { name: quarantine_reason, type: string, source: system, description: "Reason recorded on the QUARANTINE disposition; null otherwise", default: "null" }

  - name: Component
    parent: null
    common_fields: true
    fields:
      - { name: heat_lot_id, type: string, source: input, description: "FK -> HeatLot.id; traceability parent of this casting/forging" }
      - { name: target_model_id, type: string, source: input, description: "FK -> ValveModel.id; model the rough part is cut for" }
      - { name: component_type, type: enum, source: input, description: "BODY | BONNET | BALL | DISC | STEM | SEAT_RING" }
      - { name: net_weight_kg, type: number, source: input, description: "Mass drawn from the heat lot, 3dp", constraints: "> 0" }
      - { name: status, type: enum, source: system, description: "CREATED | ISSUED_TO_MACHINING | CONSUMED | HOLD | SCRAPPED | VOIDED" }
      - { name: pre_hold_status, type: enum, source: system, description: "Status captured when a lot quarantine forced HOLD; restored when the lot is re-released", default: "null" }

  - name: ValveUnit
    parent: null
    common_fields: true
    fields:
      - { name: model_id, type: string, source: input, description: "FK -> ValveModel.id; design being built" }
      - { name: body_component_id, type: string, source: input, description: "FK -> Component.id; traceable body casting/forging consumed by this unit" }
      - { name: monogram_license_id, type: string, source: input, description: "FK -> MonogramLicense.id; license the unit is marked under" }
      - { name: engineered_order_id, type: string, source: input, description: "FK -> EngineeredOrder.id; ETO order this unit is built against; null for stock units", default: "null" }
      - { name: serial_number, type: string, source: input, description: "Nameplate serial", constraints: "globally unique" }
      - { name: special_services, type: array, source: input, default: "[]", description: "Subset of {FIRE_SAFE, CRYOGENIC, FUGITIVE_EMISSION} this unit is offered for" }
      - { name: build_status, type: enum, source: system, description: "BLANK | MACHINED | ASSEMBLED | PACKAGED | SHIPPED | REWORK — dimension A" }
      - { name: cert_status, type: enum, source: system, description: "UNCERTIFIED | TESTS_IN_PROGRESS | TESTS_PASSED | TESTS_FAILED | CERTIFIED | DECERTIFIED — dimension B" }
      - { name: service_status, type: enum, source: system, description: "NONE | OPEN | PARTS_RESERVED | IN_SERVICE | SERVICED — dimension C (aftermarket/field service)" }
      - { name: reserved_kit_qty, type: integer, source: system, default: 0, description: "Repair-kit units currently held off ValveModel.repair_kit_stock_qty for this unit" }
      - { name: service_engineer_user_id, type: string, source: system, description: "Opaque X-User-ID recorded on the open service job; null when service_status IN {NONE, SERVICED}", default: "null" }
      - { name: provisional_emission_leak_class, type: enum, source: computed, description: "AA | A | B | C | FAIL from the PEAK_READING variant of calc fugitive_emission_leak_class; null until the first FUGITIVE_EMISSION TestRecord", default: "null" }
      - { name: final_emission_leak_class, type: enum, source: computed, description: "AA | A | B | C | FAIL from the TIME_WEIGHTED variant of calc fugitive_emission_leak_class; frozen at CERTIFY", default: "null" }
      - { name: certified_by_user_id, type: string, source: system, description: "X-User-ID of the certifying QualityManager; null unless cert_status == CERTIFIED", default: "null" }
      - { name: certified_at, type: datetime, source: system, description: "Logical-clock instant of certification; null unless certified", default: "null" }
      - { name: decertification_reason, type: string, source: system, description: "Cause of the last DECERTIFIED transition (MANUAL | LOT_QUARANTINE | LICENSE_SUSPENDED | LICENSE_DENIED | SPECIAL_SERVICE_REVOKED)", default: "null" }

  - name: TestRecord
    parent: ValveUnit
    common_fields: false
    fields:
      - { name: valve_unit_id, type: string, source: system, description: "FK -> ValveUnit.id; unit under test (taken from the path, not the body)" }
      - { name: test_type, type: enum, source: input, description: "SHELL | SEAT | FUNCTIONAL | FIRE_SAFE | CRYOGENIC | FUGITIVE_EMISSION" }
      - { name: test_bench_code, type: string, source: input, description: "Bench/bay the test occupied — the temporal resource" }
      - { name: started_at, type: datetime, source: input, description: "Bench occupancy start (inclusive)" }
      - { name: ended_at, type: datetime, source: input, description: "Bench occupancy end (exclusive)", constraints: "> started_at" }
      - { name: test_pressure_bar, type: number, source: input, description: "Applied test pressure, 1dp" }
      - { name: hold_seconds, type: integer, source: input, description: "Pressure hold duration in seconds", constraints: ">= 0" }
      - { name: leak_rate_ppm, type: number, source: input, description: "Measured fugitive-emission leak rate, ppmv; required for test_type == FUGITIVE_EMISSION", default: "null" }
      - { name: leak_drops, type: integer, source: input, description: "Observed seat leakage in drops; required for test_type == SEAT", default: "null" }
      - { name: result, type: enum, source: input, description: "PASS | FAIL as judged by the technician" }
      - { name: standard_ref, type: string, source: input, default: "API-598", description: "Standard the test was run to" }
      - { name: performed_by_user_id, type: string, source: system, description: "X-User-ID of the TestTechnician that recorded the row (segregation-of-duties input)" }
      - { name: required_pressure_bar, type: number, source: computed, description: "Minimum pressure the standard demands for this test_type and the model pressure_class (calc: required_test_envelope)" }
      - { name: required_hold_seconds, type: integer, source: computed, description: "Minimum hold the standard demands for the model bore_size_mm (calc: required_test_envelope)" }

  - name: ActuatorPackage
    parent: null
    common_fields: true
    fields:
      - { name: valve_unit_id, type: string, source: input, description: "FK -> ValveUnit.id; unit being actuated" }
      - { name: actuator_type, type: enum, source: input, description: "PNEUMATIC | HYDRAULIC | ELECTRIC" }
      - { name: supply_pressure_bar, type: number, source: input, description: "Available supply pressure (0 for ELECTRIC), 1dp" }
      - { name: output_torque_nm, type: number, source: input, description: "Rated output torque of the selected actuator, 1dp", constraints: "> 0" }
      - { name: sizing_basis, type: enum, source: input, description: "CATALOG | DATASHEET — selects the variant of calc required_actuator_torque_nm" }
      - { name: required_torque_nm, type: number, source: computed, description: "Break torque after pressure, service and seat factors, 1dp (calc: required_actuator_torque_nm)" }
      - { name: safety_margin_pct, type: number, source: computed, description: "Margin tier selected from required_torque_nm, 2dp fraction (0.30 | 0.25 | 0.20)" }
      - { name: sized_torque_nm, type: number, source: computed, description: "= round_half_up(required_torque_nm * (1 + safety_margin_pct), 1)" }
      - { name: sizing_status, type: enum, source: system, description: "PROPOSED | APPROVED | REJECTED | SUPERSEDED" }
      - { name: approved_by_user_id, type: string, source: system, description: "X-User-ID of the approving QualityManager; null unless APPROVED", default: "null" }

  - name: MonogramLicense
    parent: null
    common_fields: true
    fields:
      - { name: license_code, type: string, source: input, description: "Monogram program license number", constraints: "globally unique" }
      - { name: facility_code, type: string, source: input, description: "Manufacturing facility the license is issued to" }
      - { name: scope_valve_types, type: array, source: input, description: "Subset of {GATE, BALL, BUTTERFLY, CONTROL} inside the license scope" }
      - { name: lead_auditor_user_id, type: string, source: input, description: "Opaque X-User-ID of the MonogramAuditor leading the audit (segregation-of-duties input)" }
      - { name: audit_window_start, type: datetime, source: input, description: "First instant of the scheduled quality-system audit window (inclusive)" }
      - { name: audit_window_end, type: datetime, source: input, description: "Last instant of the scheduled audit window (inclusive)", constraints: ">= audit_window_start" }
      - { name: license_status, type: enum, source: system, description: "APPLIED | GRANTED | CONDITIONAL | DENIED | SUSPENDED | REVOKED — dimension A" }
      - { name: audit_state, type: enum, source: system, description: "SCHEDULED | IN_PROGRESS | CLOSED — dimension B" }
      - { name: compliance_posture, type: enum, source: computed, description: "COMPLIANT | CONDITIONAL | FROZEN — gates ValveUnit certification (calc: license_compliance_posture)" }
      - { name: total_major_raised, type: integer, source: system, default: 0, description: "Lifetime count of MAJOR findings raised against this license" }
      - { name: total_minor_raised, type: integer, source: system, default: 0, description: "Lifetime count of MINOR findings raised against this license" }
      - { name: open_major_finding_count, type: integer, source: computed, default: 0, description: "MAJOR findings neither closed nor waived" }
      - { name: open_minor_finding_count, type: integer, source: computed, default: 0, description: "MINOR findings not yet closed" }
      - { name: closed_major_finding_count, type: integer, source: computed, default: 0, description: "MAJOR findings closed with corrective action" }
      - { name: waived_major_finding_count, type: integer, source: computed, default: 0, description: "MAJOR findings waived by a non-lead auditor" }
      - { name: last_audit_closed_at, type: datetime, source: system, description: "Logical-clock instant of the last CLOSE_AUDIT; null before the first closeout", default: "null" }
      - { name: granted_at, type: datetime, source: system, description: "Instant of the last GRANT or GRANT_CONDITIONAL; null while APPLIED", default: "null" }
      - { name: conditional_expires_at, type: datetime, source: system, description: "granted_at + 180 days when license_status == CONDITIONAL; null otherwise", default: "null" }

  - name: EngineeredOrder
    parent: null
    common_fields: true
    fields:
      - { name: order_code, type: string, source: input, description: "Customer order reference", constraints: "globally unique" }
      - { name: model_id, type: string, source: input, description: "FK -> ValveModel.id; base design the datasheet modifies" }
      - { name: ordered_qty, type: integer, source: input, description: "Number of valves ordered", constraints: "> 0" }
      - { name: unit_price_cents, type: integer, source: input, description: "Agreed price per valve in cents", constraints: "> 0" }
      - { name: requested_special_services, type: array, source: input, default: "[]", description: "Subset of {FIRE_SAFE, CRYOGENIC, FUGITIVE_EMISSION} requested by the datasheet" }
      - { name: expedite_requested, type: boolean, source: input, default: false, description: "Whether the customer bought the expedite lane" }
      - { name: customer_credit_limit_cents, type: integer, source: input, description: "Credit ceiling the release-to-production check is measured against", constraints: ">= 0" }
      - { name: datasheet_break_torque_nm, type: number, source: input, description: "Customer/vendor stated break torque on the datasheet; null until a datasheet revision supplies it", default: "null" }
      - { name: datasheet_torque_source, type: enum, source: input, description: "CUSTOMER_STATED | VENDOR_MEASURED — drives the datasheet uncertainty factor", default: "null" }
      - { name: datasheet_revision_no, type: integer, source: system, default: 1, description: "+1 on every accepted datasheet revision" }
      - { name: clarification_round_count, type: integer, source: system, default: 0, description: "+1 on every REQUEST_CLARIFICATION decision (review-loop counter)" }
      - { name: status, type: enum, source: system, description: "DRAFT | UNDER_REVIEW | CLARIFICATION_REQUESTED | APPROVED | IN_PRODUCTION | HELD | CLOSED | REJECTED | CANCELLED" }
      - { name: pinned_model_id, type: string, source: system, description: "FK -> ValveModel.id; model row frozen at APPROVE; null before approval", default: "null" }
      - { name: pinned_model_spec_revision, type: integer, source: system, description: "ValveModel.spec_revision captured at APPROVE; null before approval", default: "null" }
      - { name: spec_stale, type: boolean, source: computed, default: false, description: "true when pinned_model_spec_revision != ValveModel.spec_revision or the pinned model status IN {SUPERSEDED, WITHDRAWN}" }
      - { name: gross_quoted_cents, type: integer, source: computed, description: "Quoted total frozen at APPROVE (calc: eto_order_price_cents); null before approval", default: "null" }
      - { name: net_billable_cents, type: integer, source: computed, description: "Amount still billable to the customer; equals gross_quoted_cents until a cancellation retains part of it", default: "null" }
      - { name: credit_issued_cents, type: integer, source: computed, default: 0, description: "Credit note raised on cancellation; conserves gross_quoted_cents == net_billable_cents + credit_issued_cents" }
      - { name: documents, type: array, source: system, default: "[]", description: "Appended documentation entries, each { doc_category, doc_ref, added_at }" }
      - { name: doc_package_status, type: enum, source: system, description: "ASSEMBLING | COMPLETE | ISSUED | VOIDED" }
      - { name: documentation_completeness_pct, type: number, source: computed, description: "Weighted completeness of the documentation package, 2dp (calc: documentation_completeness_pct)" }
      - { name: certified_unit_count, type: integer, source: computed, description: "Count of ValveUnit rows with this engineered_order_id and cert_status == CERTIFIED" }
      - { name: held_reason, type: string, source: system, description: "Why the order sits in HELD (UNIT_DECERTIFIED | DOC_PACKAGE_VOIDED); null otherwise", default: "null" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: ValveModel
    initial_state: DRAFT
    terminal_states: [SUPERSEDED, WITHDRAWN]
    transitions:
      - from: DRAFT
        to: IN_REVIEW
        trigger: "POST /valve-mfg/valve-models/{id}/actions with action = SUBMIT_REVIEW"
        actor: ProductEngineer
        preconditions:
          - "status == DRAFT"
          - "base_break_torque_nm > 0 and bore_size_mm > 0"
          - "no other ValveModel with the same model_code has status IN {DRAFT, IN_REVIEW, RELEASED} (ERR_DUPLICATE_CODE)"
        side_effects: ["updated_at refreshed; version += 1"]

      - from: IN_REVIEW
        to: DRAFT
        trigger: "POST /valve-mfg/valve-models/{id}/actions with action = REJECT"
        actor: QualityManager
        preconditions: ["status == IN_REVIEW"]
        side_effects:
          - "spec_revision += 1"
          - "every EngineeredOrder whose pinned_model_id == this model recomputes spec_stale (becomes true)"
        note: "Revision loop: rejection bumps spec_revision so any order that pinned the old revision becomes stale."

      - from: IN_REVIEW
        to: RELEASED
        trigger: "POST /valve-mfg/valve-models/{id}/actions with action = RELEASE"
        actor: QualityManager
        preconditions:
          - "status == IN_REVIEW"
          - "required_special_services is a subset of qualified_special_services (ERR_SPECIAL_SERVICE_NOT_QUALIFIED)"
        side_effects:
          - "released_at = current logical clock"
          - "if supersedes_model_id is not null and that model status == RELEASED: that model status -> SUPERSEDED (cascade link 1)"
          - "each EngineeredOrder whose pinned_model_id == the superseded model recomputes spec_stale = true (cascade link 2)"

      - from: RELEASED
        to: SUPERSEDED
        trigger: "system (a successor ValveModel whose supersedes_model_id == this id reaches RELEASED)"
        actor: system
        preconditions: ["status == RELEASED"]
        side_effects: ["ValveUnit creation against this model is refused afterwards (ERR_MODEL_NOT_RELEASED)"]

      - from: RELEASED
        to: WITHDRAWN
        trigger: "POST /valve-mfg/valve-models/{id}/actions with action = WITHDRAW"
        actor: QualityManager
        preconditions:
          - "status == RELEASED"
          - "no ValveUnit of this model has cert_status IN {TESTS_IN_PROGRESS, TESTS_PASSED} (ERR_STATE_INVALID)"
        side_effects: ["each EngineeredOrder whose pinned_model_id == this model recomputes spec_stale = true"]

  - entity: FoundryQualification
    initial_state: PENDING
    terminal_states: [REVOKED]
    transitions:
      - from: PENDING
        to: QUALIFIED
        trigger: "POST /valve-mfg/foundry-qualifications/{id}/actions with action = QUALIFY"
        actor: QualityManager
        preconditions:
          - "status == PENDING"
          - "current_utc <= valid_until (ERR_STATE_INVALID)"
          - "no other FoundryQualification with the same foundry_id, process and material_grade and status IN {PENDING, QUALIFIED} has a [valid_from, valid_until] closed interval intersecting this one (ERR_QUALIFICATION_WINDOW_OVERLAP)"
        side_effects: ["qualified_by_user_id = X-User-ID", "Foundry.quality_index and Foundry.status recomputed"]

      - from: QUALIFIED
        to: EXPIRED
        trigger: "system (lazy evaluation on every read or use once current_utc > valid_until)"
        actor: system
        preconditions: ["status == QUALIFIED", "current_utc > valid_until"]
        side_effects: ["Component creation quoting this qualification is refused (ERR_FOUNDRY_NOT_QUALIFIED)"]

      - from: EXPIRED
        to: PENDING
        trigger: "POST /valve-mfg/foundry-qualifications/{id}/actions with action = REQUALIFY (carries a new valid_from/valid_until)"
        actor: ProcurementSpecialist
        preconditions:
          - "status == EXPIRED"
          - "the supplied valid_from > the previous valid_until (ERR_QUALIFICATION_WINDOW_OVERLAP)"
        side_effects: ["requalification_count += 1", "valid_from/valid_until replaced", "qualified_by_user_id reset to null"]
        note: "Requalification loop — EXPIRED rows re-enter PENDING instead of spawning a new row."

      - from: QUALIFIED
        to: REVOKED
        trigger: "POST /valve-mfg/foundry-qualifications/{id}/actions with action = REVOKE"
        actor: QualityManager
        preconditions: ["status == QUALIFIED"]
        side_effects:
          - "Foundry.revoked_qualification_count += 1"
          - "Foundry.quality_index recomputed; Foundry.status re-banded (may become PROBATION or SUSPENDED)"

  - entity: HeatLot
    initial_state: RECEIVED
    terminal_states: [REJECTED]
    transitions:
      - from: RECEIVED
        to: VERIFIED
        trigger: "POST /valve-mfg/heat-lots/{id}/dispositions with action = VERIFY"
        actor: QualityManager
        preconditions:
          - "status == RECEIVED"
          - "carbon_equivalent_pct <= MAX_CARBON_EQUIVALENT_PCT[material_grade] (ERR_MTR_CHEMISTRY_OUT_OF_SPEC)"
          - "impact_energy_j >= MIN_IMPACT_ENERGY_J[material_grade] (ERR_MTR_CHEMISTRY_OUT_OF_SPEC)"
        side_effects: ["verified_by_user_id = X-User-ID"]

      - from: RECEIVED
        to: REJECTED
        trigger: "POST /valve-mfg/heat-lots/{id}/dispositions with action = REJECT"
        actor: QualityManager
        preconditions: ["status == RECEIVED"]
        side_effects: ["Foundry.rejected_lot_count += 1; Foundry.quality_index and Foundry.status recomputed"]

      - from: VERIFIED
        to: RELEASED
        trigger: "POST /valve-mfg/heat-lots/{id}/dispositions with action = RELEASE"
        actor: QualityManager
        preconditions: ["status == VERIFIED"]
        side_effects: ["lot becomes eligible as a Component traceability parent"]

      - from: RELEASED
        to: QUARANTINED
        trigger: "POST /valve-mfg/heat-lots/{id}/dispositions with action = QUARANTINE"
        actor: QualityManager
        preconditions: ["status IN {VERIFIED, RELEASED}"]
        side_effects:
          - "quarantine_reason recorded; Foundry.rejected_lot_count += 1; Foundry.quality_index and Foundry.status recomputed"
          - "cascade link 1: every Component of this lot with status IN {CREATED, ISSUED_TO_MACHINING, CONSUMED} records pre_hold_status and moves to HOLD"
          - "cascade link 2 (caused by link 1): every ValveUnit whose body_component_id is one of those HOLD components and whose cert_status IN {TESTS_PASSED, CERTIFIED} moves to DECERTIFIED with decertification_reason = LOT_QUARANTINE, and build_status PACKAGED -> REWORK"
          - "cascade link 3 (caused by link 2): for each decertified unit with an engineered_order_id, that EngineeredOrder with doc_package_status == ISSUED moves to VOIDED with held_reason = DOC_PACKAGE_VOIDED"
          - "cascade link 4 (caused by link 3 / link 2): that EngineeredOrder with status == IN_PRODUCTION moves to HELD, and with status == CLOSED reopens to IN_PRODUCTION; held_reason = UNIT_DECERTIFIED"

      - from: QUARANTINED
        to: RELEASED
        trigger: "POST /valve-mfg/heat-lots/{id}/dispositions with action = RELEASE"
        actor: QualityManager
        preconditions: ["status == QUARANTINED"]
        side_effects:
          - "every Component of this lot with status == HOLD returns to its pre_hold_status; pre_hold_status cleared"
          - "Foundry.rejected_lot_count -= 1; Foundry.quality_index and Foundry.status recomputed"
        note: "Compensation is partial by design: units decertified by the quarantine stay DECERTIFIED and must be re-tested."

      - from: QUARANTINED
        to: REJECTED
        trigger: "POST /valve-mfg/heat-lots/{id}/dispositions with action = REJECT"
        actor: QualityManager
        preconditions: ["status == QUARANTINED"]
        side_effects: ["every Component of this lot with status == HOLD moves to SCRAPPED; qty_scrapped_kg and qty_available_kg recomputed"]

  - entity: Component
    initial_state: CREATED
    terminal_states: [SCRAPPED, VOIDED]
    transitions:
      - from: CREATED
        to: ISSUED_TO_MACHINING
        trigger: "POST /valve-mfg/components/{id}/dispositions with action = ISSUE_TO_MACHINING"
        actor: ProcurementSpecialist
        preconditions: ["status == CREATED", "HeatLot.status == RELEASED (ERR_HEAT_LOT_NOT_RELEASED)"]
        side_effects: []

      - from: ISSUED_TO_MACHINING
        to: CONSUMED
        trigger: "system (a ValveUnit is created with body_component_id == this component)"
        actor: system
        preconditions: ["status IN {CREATED, ISSUED_TO_MACHINING}"]
        side_effects: ["component is no longer selectable for another unit (ERR_COMPONENT_NOT_AVAILABLE)"]
        note: "CREATED -> CONSUMED directly is also permitted; machining issue is optional bookkeeping."

      - from: CONSUMED
        to: HOLD
        trigger: "system (parent HeatLot moves to QUARANTINED)"
        actor: system
        preconditions: ["status IN {CREATED, ISSUED_TO_MACHINING, CONSUMED}"]
        side_effects: ["pre_hold_status = the status held before HOLD"]

      - from: HOLD
        to: CONSUMED
        trigger: "system (parent HeatLot returns from QUARANTINED to RELEASED)"
        actor: system
        preconditions: ["status == HOLD"]
        side_effects: ["status restored to pre_hold_status; pre_hold_status cleared"]

      - from: CREATED
        to: SCRAPPED
        trigger: "POST /valve-mfg/components/{id}/dispositions with action = SCRAP"
        actor: ProcurementSpecialist
        preconditions: ["status IN {CREATED, ISSUED_TO_MACHINING, HOLD}"]
        side_effects: ["HeatLot.qty_committed_kg -= net_weight_kg; HeatLot.qty_scrapped_kg += net_weight_kg; qty_available_kg unchanged"]
        note: "Scrap keeps the mass consumed — it moves from committed to scrapped, so available does not recover."

      - from: CREATED
        to: VOIDED
        trigger: "POST /valve-mfg/components/{id}/dispositions with action = VOID"
        actor: ProcurementSpecialist
        preconditions:
          - "status IN {CREATED, ISSUED_TO_MACHINING}"
          - "no ValveUnit references this component as body_component_id (ERR_COMPONENT_NOT_AVAILABLE)"
        side_effects: ["HeatLot.qty_committed_kg -= net_weight_kg; qty_available_kg += net_weight_kg (mass returned to the lot)"]
        note: "Compensating action for a mis-issued component: the mass-balance invariant qty_received_kg == qty_available_kg + qty_committed_kg + qty_scrapped_kg holds before and after."

  - entity: ValveUnit
    initial_state: "build_status = BLANK, cert_status = UNCERTIFIED, service_status = NONE"
    terminal_states: [SHIPPED]
    transitions:
      - from: "build_status = BLANK"
        to: "build_status = MACHINED"
        trigger: "POST /valve-mfg/valve-units/{id}/build-actions with action = ADVANCE, to_build_status = MACHINED"
        actor: TestTechnician
        preconditions: ["build_status == BLANK", "Component.status IN {CONSUMED, ISSUED_TO_MACHINING} and Component.status != HOLD (ERR_STATE_INVALID)"]
        side_effects: []

      - from: "build_status = MACHINED"
        to: "build_status = ASSEMBLED"
        trigger: "POST /valve-mfg/valve-units/{id}/build-actions with action = ADVANCE, to_build_status = ASSEMBLED"
        actor: TestTechnician
        preconditions: ["build_status == MACHINED (ERR_BUILD_SEQUENCE_INVALID for any non-adjacent target)"]
        side_effects: []

      - from: "build_status = ASSEMBLED"
        to: "build_status = PACKAGED"
        trigger: "POST /valve-mfg/valve-units/{id}/build-actions with action = ADVANCE, to_build_status = PACKAGED"
        actor: TestTechnician
        preconditions:
          - "build_status == ASSEMBLED"
          - "cert_status == CERTIFIED (ERR_UNIT_NOT_CERTIFIED) — the only point where dimension A depends on dimension B"
          - "if an ActuatorPackage exists for this unit, exactly one has sizing_status == APPROVED (ERR_ACTUATOR_NOT_APPROVED)"
        side_effects: []

      - from: "build_status = PACKAGED"
        to: "build_status = SHIPPED"
        trigger: "POST /valve-mfg/valve-units/{id}/build-actions with action = ADVANCE, to_build_status = SHIPPED"
        actor: TestTechnician
        preconditions: ["build_status == PACKAGED", "cert_status == CERTIFIED"]
        side_effects: ["build dimension is terminal; only service_status may change afterwards"]

      - from: "build_status = PACKAGED"
        to: "build_status = REWORK"
        trigger: "system (cert_status moves to DECERTIFIED, or service_status moves to IN_SERVICE)"
        actor: system
        preconditions: ["build_status IN {ASSEMBLED, PACKAGED}"]
        side_effects: []

      - from: "build_status = REWORK"
        to: "build_status = ASSEMBLED"
        trigger: "POST /valve-mfg/valve-units/{id}/build-actions with action = REWORK_COMPLETE"
        actor: TestTechnician
        preconditions: ["build_status == REWORK", "service_status IN {NONE, SERVICED}"]
        side_effects: []
        note: "Rework loop — a decertified unit re-enters ASSEMBLED and must be re-tested."

      - from: "cert_status = UNCERTIFIED"
        to: "cert_status = TESTS_IN_PROGRESS"
        trigger: "system (first TestRecord created via POST /valve-mfg/valve-units/{id}/test-records)"
        actor: system
        preconditions: ["cert_status IN {UNCERTIFIED, TESTS_FAILED, DECERTIFIED}", "build_status IN {ASSEMBLED, PACKAGED}"]
        side_effects: ["provisional_emission_leak_class recomputed when test_type == FUGITIVE_EMISSION (PEAK_READING variant)"]

      - from: "cert_status = TESTS_IN_PROGRESS"
        to: "cert_status = TESTS_PASSED"
        trigger: "system (a TestRecord completes the required test set for this unit and every required record has result == PASS)"
        actor: system
        preconditions: ["cert_status == TESTS_IN_PROGRESS", "required test set (calc: required_test_set) fully covered by PASS records"]
        side_effects: []

      - from: "cert_status = TESTS_IN_PROGRESS"
        to: "cert_status = TESTS_FAILED"
        trigger: "system (a TestRecord with result == FAIL is created)"
        actor: system
        preconditions: ["cert_status == TESTS_IN_PROGRESS"]
        side_effects: ["certification is refused while TESTS_FAILED (ERR_REQUIRED_TESTS_INCOMPLETE)"]

      - from: "cert_status = TESTS_FAILED"
        to: "cert_status = TESTS_IN_PROGRESS"
        trigger: "system (a further TestRecord is created for the same test_type)"
        actor: system
        preconditions: ["cert_status == TESTS_FAILED"]
        side_effects: []
        note: "Retest loop — the latest record per test_type decides coverage."

      - from: "cert_status = TESTS_PASSED"
        to: "cert_status = CERTIFIED"
        trigger: "POST /valve-mfg/valve-units/{id}/cert-actions with action = CERTIFY"
        actor: QualityManager
        preconditions:
          - "cert_status == TESTS_PASSED (ERR_UNIT_NOT_TEST_PASSED)"
          - "ValveModel.status == RELEASED (ERR_MODEL_NOT_RELEASED)"
          - "MonogramLicense.compliance_posture IN {COMPLIANT, CONDITIONAL} (ERR_LICENSE_POSTURE_BLOCKED)"
          - "if MonogramLicense.compliance_posture == CONDITIONAL then special_services == [] (ERR_LICENSE_POSTURE_BLOCKED)"
          - "ValveModel.valve_type IN MonogramLicense.scope_valve_types (ERR_LICENSE_SCOPE_MISMATCH)"
          - "special_services is a subset of ValveModel.qualified_special_services (ERR_SPECIAL_SERVICE_NOT_QUALIFIED)"
          - "X-User-ID differs from every TestRecord.performed_by_user_id of this unit (ERR_SOD_TEST_WITNESS_CONFLICT)"
          - "if FUGITIVE_EMISSION IN special_services then final_emission_leak_class IN {AA, A, B} (ERR_EMISSION_CLASS_FAIL)"
        side_effects:
          - "certified_by_user_id = X-User-ID; certified_at = current logical clock"
          - "final_emission_leak_class frozen from the TIME_WEIGHTED variant of calc fugitive_emission_leak_class"
          - "EngineeredOrder.certified_unit_count recomputed; EngineeredOrder.documentation_completeness_pct recomputed"

      - from: "cert_status = CERTIFIED"
        to: "cert_status = DECERTIFIED"
        trigger: "POST /valve-mfg/valve-units/{id}/cert-actions with action = DECERTIFY, or system cascade (lot quarantine, license SUSPENDED/DENIED)"
        actor: QualityManager
        preconditions: ["cert_status == CERTIFIED"]
        side_effects:
          - "decertification_reason recorded (MANUAL | LOT_QUARANTINE | LICENSE_SUSPENDED | LICENSE_DENIED | SPECIAL_SERVICE_REVOKED)"
          - "certified_by_user_id and certified_at cleared"
          - "build_status ASSEMBLED or PACKAGED -> REWORK"
          - "the unit's EngineeredOrder (if any) with doc_package_status == ISSUED -> VOIDED, held_reason = DOC_PACKAGE_VOIDED"
          - "the unit's EngineeredOrder with status == IN_PRODUCTION -> HELD, or status == CLOSED -> IN_PRODUCTION (reopen); held_reason = UNIT_DECERTIFIED"
          - "EngineeredOrder.certified_unit_count and documentation_completeness_pct recomputed"

      - from: "service_status = NONE"
        to: "service_status = OPEN"
        trigger: "POST /valve-mfg/valve-units/{id}/service-actions with action = OPEN"
        actor: FieldServiceCoordinator
        preconditions: ["service_status IN {NONE, SERVICED}", "build_status IN {PACKAGED, SHIPPED, REWORK} (ERR_STATE_INVALID)"]
        side_effects: ["service_engineer_user_id = engineer_user_id from the request"]

      - from: "service_status = OPEN"
        to: "service_status = PARTS_RESERVED"
        trigger: "POST /valve-mfg/valve-units/{id}/service-actions with action = RESERVE_KIT"
        actor: FieldServiceCoordinator
        preconditions:
          - "service_status == OPEN"
          - "kit_qty >= 1 and kit_qty <= ValveModel.repair_kit_stock_qty (ERR_REPAIR_KIT_OUT_OF_STOCK)"
        side_effects: ["ValveModel.repair_kit_stock_qty -= kit_qty; reserved_kit_qty = kit_qty"]

      - from: "service_status = PARTS_RESERVED"
        to: "service_status = IN_SERVICE"
        trigger: "POST /valve-mfg/valve-units/{id}/service-actions with action = START"
        actor: FieldServiceCoordinator
        preconditions: ["service_status == PARTS_RESERVED"]
        side_effects:
          - "build_status ASSEMBLED or PACKAGED -> REWORK"
          - "cert_status CERTIFIED -> DECERTIFIED with decertification_reason = MANUAL, running the full decertification tail"

      - from: "service_status = IN_SERVICE"
        to: "service_status = SERVICED"
        trigger: "POST /valve-mfg/valve-units/{id}/service-actions with action = COMPLETE"
        actor: FieldServiceCoordinator
        preconditions: ["service_status == IN_SERVICE"]
        side_effects: ["reserved_kit_qty consumed (kit stock NOT returned); reserved_kit_qty = 0; service_engineer_user_id cleared"]

      - from: "service_status = PARTS_RESERVED"
        to: "service_status = NONE"
        trigger: "POST /valve-mfg/valve-units/{id}/service-actions with action = ABORT"
        actor: FieldServiceCoordinator
        preconditions: ["service_status IN {OPEN, PARTS_RESERVED, IN_SERVICE}"]
        side_effects:
          - "ValveModel.repair_kit_stock_qty += reserved_kit_qty (kit stock restored); reserved_kit_qty = 0"
          - "service_engineer_user_id cleared"
        note: "Compensating action: repair-kit stock conservation holds across RESERVE_KIT then ABORT."

  - entity: ActuatorPackage
    initial_state: PROPOSED
    terminal_states: [REJECTED, SUPERSEDED]
    transitions:
      - from: PROPOSED
        to: APPROVED
        trigger: "POST /valve-mfg/actuator-packages/{id}/decision with decision = APPROVE"
        actor: QualityManager
        preconditions:
          - "sizing_status == PROPOSED"
          - "output_torque_nm >= sized_torque_nm (ERR_ACTUATOR_TORQUE_INSUFFICIENT)"
          - "actuator_type != ELECTRIC implies supply_pressure_bar > 0 (ERR_INVALID_REQUEST)"
        side_effects: ["approved_by_user_id = X-User-ID", "ValveUnit becomes eligible for build_status PACKAGED"]

      - from: PROPOSED
        to: REJECTED
        trigger: "POST /valve-mfg/actuator-packages/{id}/decision with decision = REJECT"
        actor: QualityManager
        preconditions: ["sizing_status == PROPOSED"]
        side_effects: []

      - from: APPROVED
        to: SUPERSEDED
        trigger: "system (a new ActuatorPackage is created for the same valve_unit_id)"
        actor: system
        preconditions: ["sizing_status IN {PROPOSED, APPROVED}"]
        side_effects: ["ValveUnit.version += 1 as part of the creating request"]
        note: "CREATE-with-supersede — the OCC race guarded by concurrency rule actuator-package-create-stale-unit."

  - entity: MonogramLicense
    initial_state: "license_status = APPLIED, audit_state = SCHEDULED"
    terminal_states: [DENIED, REVOKED]
    transitions:
      - from: "audit_state = SCHEDULED"
        to: "audit_state = IN_PROGRESS"
        trigger: "POST /valve-mfg/monogram-licenses/{id}/actions with action = START_AUDIT"
        actor: MonogramAuditor
        preconditions: ["audit_state == SCHEDULED", "current_utc >= audit_window_start (ERR_STATE_INVALID)"]
        side_effects: []

      - from: "audit_state = IN_PROGRESS"
        to: "audit_state = CLOSED"
        trigger: "POST /valve-mfg/monogram-licenses/{id}/actions with action = CLOSE_AUDIT"
        actor: MonogramAuditor
        preconditions: ["audit_state == IN_PROGRESS"]
        side_effects: ["last_audit_closed_at = current logical clock"]

      - from: "audit_state = CLOSED"
        to: "audit_state = SCHEDULED"
        trigger: "POST /valve-mfg/monogram-licenses/{id}/actions with action = SCHEDULE_AUDIT (carries the next audit_window_start/end)"
        actor: MonogramAuditor
        preconditions:
          - "audit_state == CLOSED"
          - "audit_window_start >= last_audit_closed_at + AUDIT_COOLING_OFF_DAYS (ERR_AUDIT_COOLING_OFF_ACTIVE)"
        side_effects: ["audit_window_start/end replaced"]
        note: "Audit re-scheduling loop with a cooling-off buffer measured from the previous closeout."

      - from: "license_status = APPLIED"
        to: "license_status = GRANTED"
        trigger: "POST /valve-mfg/monogram-licenses/{id}/actions with action = GRANT"
        actor: MonogramAuditor
        preconditions:
          - "license_status IN {APPLIED, CONDITIONAL}"
          - "audit_state == CLOSED (ERR_STATE_INVALID)"
          - "open_major_finding_count == 0 (ERR_OPEN_MAJOR_FINDINGS)"
          - "open_minor_finding_count <= 4 (ERR_MINOR_FINDING_THRESHOLD)"
        side_effects: ["granted_at = current logical clock; conditional_expires_at = null", "compliance_posture recomputed to COMPLIANT"]

      - from: "license_status = APPLIED"
        to: "license_status = CONDITIONAL"
        trigger: "POST /valve-mfg/monogram-licenses/{id}/actions with action = GRANT_CONDITIONAL"
        actor: MonogramAuditor
        preconditions:
          - "license_status == APPLIED"
          - "audit_state == CLOSED (ERR_STATE_INVALID)"
          - "open_major_finding_count == 0 (ERR_OPEN_MAJOR_FINDINGS)"
          - "open_minor_finding_count >= 5 (ERR_MINOR_FINDING_THRESHOLD)"
        side_effects:
          - "granted_at = current logical clock; conditional_expires_at = granted_at + CONDITIONAL_VALIDITY_DAYS"
          - "compliance_posture recomputed to CONDITIONAL — certification of units carrying any special service is refused"
        note: "Branch two of the audit closeout; divergent side-effect set from GRANT (adds an expiry) and from DENY (no decertification)."

      - from: "license_status = APPLIED"
        to: "license_status = DENIED"
        trigger: "POST /valve-mfg/monogram-licenses/{id}/actions with action = DENY"
        actor: MonogramAuditor
        preconditions:
          - "license_status == APPLIED"
          - "audit_state == CLOSED (ERR_STATE_INVALID)"
          - "open_major_finding_count >= 1"
        side_effects:
          - "compliance_posture = FROZEN"
          - "every ValveUnit with this monogram_license_id and cert_status == CERTIFIED -> DECERTIFIED with decertification_reason = LICENSE_DENIED, running the full decertification tail"
        note: "Branch three of the audit closeout; only this branch decertifies existing units."

      - from: "license_status = GRANTED"
        to: "license_status = SUSPENDED"
        trigger: "POST /valve-mfg/monogram-licenses/{id}/actions with action = SUSPEND, or system cascade (open_major_finding_count reaches MAJOR_FINDING_FREEZE_THRESHOLD)"
        actor: MonogramAuditor
        preconditions: ["license_status IN {GRANTED, CONDITIONAL}"]
        side_effects:
          - "compliance_posture = FROZEN (cascade link 1)"
          - "cascade link 2 (caused by link 1): every ValveUnit with this monogram_license_id and cert_status == CERTIFIED -> DECERTIFIED with decertification_reason = LICENSE_SUSPENDED"
          - "cascade link 3 (caused by link 2): each such unit's EngineeredOrder with status == IN_PRODUCTION -> HELD (held_reason = UNIT_DECERTIFIED) and with doc_package_status == ISSUED -> VOIDED"

      - from: "license_status = SUSPENDED"
        to: "license_status = GRANTED"
        trigger: "POST /valve-mfg/monogram-licenses/{id}/actions with action = REINSTATE"
        actor: MonogramAuditor
        preconditions:
          - "license_status == SUSPENDED"
          - "open_major_finding_count == 0 (ERR_OPEN_MAJOR_FINDINGS)"
        side_effects:
          - "compliance_posture recomputed (COMPLIANT when open_minor_finding_count <= 4)"
          - "every EngineeredOrder in HELD whose held_reason == UNIT_DECERTIFIED and which has no remaining DECERTIFIED unit returns to IN_PRODUCTION"
        note: "Reinstatement loop; decertified units are NOT auto-recertified — they must be re-tested."

      - from: "license_status = CONDITIONAL"
        to: "license_status = REVOKED"
        trigger: "system (current_utc > conditional_expires_at and open_major_finding_count >= 1)"
        actor: system
        preconditions: ["license_status == CONDITIONAL"]
        side_effects: ["compliance_posture = FROZEN", "every CERTIFIED unit under the license -> DECERTIFIED with decertification_reason = LICENSE_DENIED"]

  - entity: EngineeredOrder
    initial_state: "status = DRAFT, doc_package_status = ASSEMBLING"
    terminal_states: [REJECTED, CANCELLED]
    transitions:
      - from: "status = DRAFT"
        to: "status = UNDER_REVIEW"
        trigger: "POST /valve-mfg/engineered-orders/{id}/review-actions with action = SUBMIT_REVIEW"
        actor: ProductEngineer
        preconditions:
          - "status == DRAFT"
          - "datasheet_break_torque_nm is not null (ERR_STATE_INVALID)"
          - "requested_special_services is a subset of ValveModel.required_special_services (ERR_SPECIAL_SERVICE_NOT_QUALIFIED)"
        side_effects: []

      - from: "status = UNDER_REVIEW"
        to: "status = CLARIFICATION_REQUESTED"
        trigger: "POST /valve-mfg/engineered-orders/{id}/review-actions with action = REQUEST_CLARIFICATION"
        actor: QualityManager
        preconditions:
          - "status == UNDER_REVIEW"
          - "clarification_round_count < MAX_CLARIFICATION_ROUNDS (ERR_CLARIFICATION_ROUNDS_EXHAUSTED)"
        side_effects: ["clarification_round_count += 1"]

      - from: "status = CLARIFICATION_REQUESTED"
        to: "status = UNDER_REVIEW"
        trigger: "POST /valve-mfg/engineered-orders/{id}/datasheet-revisions"
        actor: ProductEngineer
        preconditions:
          - "status == CLARIFICATION_REQUESTED"
          - "expected_engineered_order_version matches the current version (ERR_STALE_ORDER_VERSION)"
        side_effects: ["datasheet_revision_no += 1; datasheet fields replaced; version += 1"]
        note: "Review loop — UNDER_REVIEW -> CLARIFICATION_REQUESTED -> UNDER_REVIEW, bounded by MAX_CLARIFICATION_ROUNDS."

      - from: "status = UNDER_REVIEW"
        to: "status = APPROVED"
        trigger: "POST /valve-mfg/engineered-orders/{id}/review-actions with action = APPROVE"
        actor: QualityManager
        preconditions:
          - "status == UNDER_REVIEW"
          - "ValveModel.status == RELEASED (ERR_MODEL_NOT_RELEASED)"
          - "requested_special_services is a subset of ValveModel.qualified_special_services (ERR_SPECIAL_SERVICE_NOT_QUALIFIED)"
        side_effects:
          - "pinned_model_id = model_id; pinned_model_spec_revision = ValveModel.spec_revision (version pinning)"
          - "gross_quoted_cents computed by calc eto_order_price_cents; net_billable_cents = gross_quoted_cents; credit_issued_cents = 0"

      - from: "status = UNDER_REVIEW"
        to: "status = REJECTED"
        trigger: "POST /valve-mfg/engineered-orders/{id}/review-actions with action = REJECT"
        actor: QualityManager
        preconditions: ["status IN {UNDER_REVIEW, CLARIFICATION_REQUESTED}"]
        side_effects: []

      - from: "status = APPROVED"
        to: "status = IN_PRODUCTION"
        trigger: "POST /valve-mfg/engineered-orders/{id}/lifecycle-actions with action = RELEASE_TO_PRODUCTION"
        actor: ProductEngineer
        preconditions:
          - "status == APPROVED"
          - "spec_stale == false (ERR_PINNED_SPEC_STALE)"
          - "gross_quoted_cents <= customer_credit_limit_cents (ERR_CREDIT_LIMIT_EXCEEDED)"
        side_effects: []

      - from: "status = IN_PRODUCTION"
        to: "status = HELD"
        trigger: "system (a ValveUnit of this order is DECERTIFIED, or its issued documentation package is VOIDED)"
        actor: system
        preconditions: ["status == IN_PRODUCTION"]
        side_effects: ["held_reason = UNIT_DECERTIFIED or DOC_PACKAGE_VOIDED"]

      - from: "status = HELD"
        to: "status = IN_PRODUCTION"
        trigger: "POST /valve-mfg/engineered-orders/{id}/lifecycle-actions with action = RESUME"
        actor: ProductEngineer
        preconditions:
          - "status == HELD"
          - "no ValveUnit of this order has cert_status == DECERTIFIED (ERR_STATE_INVALID)"
          - "MonogramLicense.compliance_posture != FROZEN for every unit of this order (ERR_LICENSE_POSTURE_BLOCKED)"
        side_effects: ["held_reason cleared"]
        note: "Hold loop — IN_PRODUCTION -> HELD -> IN_PRODUCTION."

      - from: "status = IN_PRODUCTION"
        to: "status = CLOSED"
        trigger: "POST /valve-mfg/engineered-orders/{id}/lifecycle-actions with action = CLOSE"
        actor: QualityManager
        preconditions:
          - "status == IN_PRODUCTION"
          - "certified_unit_count >= ordered_qty (ERR_ORDER_UNITS_INCOMPLETE)"
          - "doc_package_status == ISSUED (ERR_DOC_PACKAGE_INCOMPLETE)"
        side_effects: []

      - from: "status = CLOSED"
        to: "status = IN_PRODUCTION"
        trigger: "system (a certified unit of this order is DECERTIFIED)"
        actor: system
        preconditions: ["status == CLOSED"]
        side_effects: ["held_reason = UNIT_DECERTIFIED"]
        note: "Closed is not sacred — a decertification reopens the order."

      - from: "status = APPROVED"
        to: "status = CANCELLED"
        trigger: "POST /valve-mfg/engineered-orders/{id}/lifecycle-actions with action = CANCEL"
        actor: ProductEngineer
        preconditions: ["status IN {APPROVED, IN_PRODUCTION, HELD}"]
        side_effects:
          - "net_billable_cents = round_half_up(gross_quoted_cents * CANCELLATION_RETENTION_RATE[status at cancel], 0)"
          - "credit_issued_cents = gross_quoted_cents - net_billable_cents"
          - "doc_package_status ISSUED -> VOIDED"
        note: "Compensating action: gross_quoted_cents == net_billable_cents + credit_issued_cents holds before and after."

      - from: "doc_package_status = ASSEMBLING"
        to: "doc_package_status = COMPLETE"
        trigger: "system (POST /valve-mfg/engineered-orders/{id}/documents raises documentation_completeness_pct to 100.00)"
        actor: system
        preconditions: ["doc_package_status == ASSEMBLING", "documentation_completeness_pct == 100.00"]
        side_effects: []

      - from: "doc_package_status = COMPLETE"
        to: "doc_package_status = ISSUED"
        trigger: "POST /valve-mfg/engineered-orders/{id}/lifecycle-actions with action = ISSUE_DOC_PACKAGE"
        actor: QualityManager
        preconditions:
          - "doc_package_status == COMPLETE (ERR_DOC_PACKAGE_INCOMPLETE)"
          - "status IN {IN_PRODUCTION, HELD}"
          - "certified_unit_count >= ordered_qty (ERR_ORDER_UNITS_INCOMPLETE)"
        side_effects: []

      - from: "doc_package_status = ISSUED"
        to: "doc_package_status = VOIDED"
        trigger: "system (a certified unit of this order is DECERTIFIED, or the order is CANCELLED)"
        actor: system
        preconditions: ["doc_package_status == ISSUED"]
        side_effects: ["held_reason = DOC_PACKAGE_VOIDED"]

      - from: "doc_package_status = VOIDED"
        to: "doc_package_status = ASSEMBLING"
        trigger: "POST /valve-mfg/engineered-orders/{id}/documents (a further document entry is appended after a void)"
        actor: QualityManager
        preconditions: ["doc_package_status == VOIDED"]
        side_effects: ["documentation_completeness_pct recomputed"]

# =============================================================================
# §1.2.1 Concurrency Rules (OCC on the parent's version — the only sanctioned mechanism)
# =============================================================================
concurrency_rules:
  - rule_id: actuator-package-create-stale-unit
    parent_entity: ValveUnit
    write_endpoint: "POST /valve-mfg/actuator-packages"
    occ_field: "expected_valve_unit_version"
    description: |
      Creating an ActuatorPackage against a ValveUnit whose version has advanced since the client last read it
      is rejected. A new package legitimately supersedes any earlier PROPOSED/APPROVED package for the same
      unit, so the second create cannot be refused on state grounds; the stale-version check is what stops a
      writer from re-sizing on an out-of-date view of the unit (e.g. after a cascade decertified it).
    error_id: ERR_STALE_VALVE_UNIT_VERSION
    http_status: 412

  - rule_id: datasheet-revision-stale-order
    parent_entity: EngineeredOrder
    write_endpoint: "POST /valve-mfg/engineered-orders/{id}/datasheet-revisions"
    occ_field: "expected_engineered_order_version"
    description: |
      Appending a datasheet revision to an EngineeredOrder whose version has advanced since the client last
      read it is rejected. Revisions legitimately supersede the previous datasheet, so a second revision is
      not blocked by state; the stale-version check stops a revision that was authored against a superseded
      datasheet_revision_no from silently overwriting the newer one.
    error_id: ERR_STALE_ORDER_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules
# =============================================================================
calculations:
  - name: required_actuator_torque_nm
    algorithm_type: threshold
    output_fields: [ActuatorPackage.required_torque_nm, ActuatorPackage.safety_margin_pct, ActuatorPackage.sized_torque_nm]
    inputs:
      - "ValveModel.base_break_torque_nm, ValveModel.valve_type, ValveModel.pressure_class, ValveModel.seat_type (via ValveUnit.model_id)"
      - "ValveUnit.special_services"
      - "ActuatorPackage.sizing_basis, EngineeredOrder.datasheet_break_torque_nm, EngineeredOrder.datasheet_torque_source (DATASHEET variant only)"
    constants:
      TURN_PRESSURE_DIVISOR: { QUARTER_TURN: 10000, MULTI_TURN: 20000 }
      TURN_CLASS_BY_VALVE_TYPE: { BALL: QUARTER_TURN, BUTTERFLY: QUARTER_TURN, GATE: MULTI_TURN, CONTROL: MULTI_TURN }
      SERVICE_FACTOR: { FIRE_SAFE: 1.25, CRYOGENIC: 1.40, FUGITIVE_EMISSION: 1.15, NONE: 1.00 }
      SEAT_FACTOR: { SOFT: 1.00, METAL: 1.30 }
      DATASHEET_UNCERTAINTY_FACTOR: 1.10
      MARGIN_TIER: "required_torque_nm < 500 -> 0.30; 500 <= required_torque_nm <= 2000 -> 0.25; required_torque_nm > 2000 -> 0.20"
    formula: |
      turn_class      = TURN_CLASS_BY_VALVE_TYPE[model.valve_type]
      pressure_factor = 1 + (model.pressure_class / TURN_PRESSURE_DIVISOR[turn_class])
      service_factor  = max over s in unit.special_services of SERVICE_FACTOR[s]   (1.00 when the list is empty)
      seat_factor     = SEAT_FACTOR[model.seat_type]
      base            = the variant-selected break torque (see variants)
      required_torque_nm = round_half_up(base * pressure_factor * service_factor * seat_factor, 1)
      safety_margin_pct  = MARGIN_TIER keyed on the ALREADY-ROUNDED required_torque_nm
      sized_torque_nm    = round_half_up(required_torque_nm * (1 + safety_margin_pct), 1)
    precision: "required_torque_nm and sized_torque_nm to 1 decimal place, ROUND_HALF_UP; safety_margin_pct stored as a 2dp fraction"
    variants:
      - variant: CATALOG
        selected_when: "ActuatorPackage.sizing_basis == CATALOG"
        formula: "base = ValveModel.base_break_torque_nm; no uncertainty factor is applied"
      - variant: DATASHEET
        selected_when: "ActuatorPackage.sizing_basis == DATASHEET (the unit belongs to an EngineeredOrder carrying a customer datasheet)"
        formula: |
          base = EngineeredOrder.datasheet_break_torque_nm
                 * (DATASHEET_UNCERTAINTY_FACTOR when EngineeredOrder.datasheet_torque_source == CUSTOMER_STATED, else 1.00)
    worked_example: |
      Model: BALL (QUARTER_TURN), pressure_class 300, seat_type METAL, base_break_torque_nm 420.0; unit.special_services = [].
      CATALOG   : pf = 1 + 300/10000 = 1.03; svc = 1.00; seat = 1.30
                  required = round_half_up(420.0 * 1.03 * 1.00 * 1.30, 1) = round_half_up(562.38, 1) = 562.4
                  562.4 is in [500, 2000] -> margin 0.25 -> sized = round_half_up(562.4 * 1.25, 1) = 703.0
      DATASHEET : datasheet_break_torque_nm 420.0, datasheet_torque_source CUSTOMER_STATED
                  base = 420.0 * 1.10 = 462.0
                  required = round_half_up(462.0 * 1.03 * 1.00 * 1.30, 1) = round_half_up(618.618, 1) = 618.6
                  618.6 is in [500, 2000] -> margin 0.25 -> sized = round_half_up(618.6 * 1.25, 1) = 773.3
      Same unit, same model: the two variants differ by 56.2 Nm required and 70.3 Nm sized.
    note: |
      The margin tier is keyed on the ROUNDED required_torque_nm, not on the unrounded product. A model whose
      unrounded required torque is 499.96 rounds to 500.0 and therefore takes the 0.25 tier, not the 0.30 tier.

  - name: fugitive_emission_leak_class
    algorithm_type: threshold
    output_fields: [ValveUnit.provisional_emission_leak_class, ValveUnit.final_emission_leak_class]
    inputs: ["TestRecord rows of the unit with test_type == FUGITIVE_EMISSION: leak_rate_ppm, hold_seconds, result"]
    constants:
      LEAK_CLASS_BAND: "ppm <= 50 -> AA; 50 < ppm <= 100 -> A; 100 < ppm <= 500 -> B; 500 < ppm <= 1000 -> C; ppm > 1000 -> FAIL"
    formula: |
      Input set: every TestRecord of the unit with test_type == FUGITIVE_EMISSION, in created_at order.
      The variant produces a ppm figure; LEAK_CLASS_BAND maps that figure to a class.
      When the input set is empty, both fields stay null (no class is asserted).
    precision: "the TIME_WEIGHTED ppm figure is rounded to 2 decimal places, ROUND_HALF_UP, before banding"
    variants:
      - variant: PEAK_READING
        selected_when: "recomputed on every FUGITIVE_EMISSION TestRecord creation; written to provisional_emission_leak_class"
        formula: "ppm = max(leak_rate_ppm) over the input set"
      - variant: TIME_WEIGHTED
        selected_when: "computed once at POST /valve-mfg/valve-units/{id}/cert-actions action = CERTIFY; frozen into final_emission_leak_class"
        formula: "ppm = round_half_up(sum(leak_rate_ppm * hold_seconds) / sum(hold_seconds), 2)"
    worked_example: |
      Two FUGITIVE_EMISSION records on one unit: r1 leak_rate_ppm 40, hold_seconds 300; r2 leak_rate_ppm 140, hold_seconds 100.
      PEAK_READING : ppm = max(40, 140) = 140 -> 100 < 140 <= 500 -> provisional class B
      TIME_WEIGHTED: ppm = round_half_up((40*300 + 140*100) / (300 + 100), 2)
                         = round_half_up(26000 / 400, 2) = round_half_up(65.0, 2) = 65.00 -> 50 < 65 <= 100 -> final class A
      The provisional class is worse than the final class: the short high reading dominates the peak but is
      diluted by the long low reading once weighted by hold time.

  - name: documentation_completeness_pct
    algorithm_type: weighted_scoring
    output_fields: [EngineeredOrder.documentation_completeness_pct]
    inputs:
      - "EngineeredOrder.documents (each entry carries a doc_type)"
      - "EngineeredOrder.ordered_qty"
      - "whether any ValveUnit of the order has an ActuatorPackage with sizing_status == APPROVED"
    constants:
      DOC_WEIGHT: { MATERIAL_TEST_REPORT: 0.25, TEST_CERTIFICATE: 0.25, DIMENSIONAL_REPORT: 0.15, NDE_REPORT: 0.15, ACTUATOR_DATASHEET: 0.10, DECLARATION_OF_CONFORMITY: 0.10 }
      REQUIRED_COUNT: |
        MATERIAL_TEST_REPORT      -> ordered_qty (one MTR per unit)
        TEST_CERTIFICATE          -> ordered_qty (one certificate per unit)
        DIMENSIONAL_REPORT        -> 1
        NDE_REPORT                -> 1
        ACTUATOR_DATASHEET        -> 1 when any unit of the order has an APPROVED ActuatorPackage, else 0
        DECLARATION_OF_CONFORMITY -> 1
    formula: |
      For each doc_type d in DOC_WEIGHT:
        present_d  = count of documents entries with doc_type == d
        required_d = REQUIRED_COUNT[d]
        fraction_d = 1.00                                                   when required_d == 0
                   = round_half_up(min(present_d, required_d) / required_d, 2)   otherwise
      weighted_sum = sum over d of (DOC_WEIGHT[d] * fraction_d)
      documentation_completeness_pct = round_half_up(100 * weighted_sum, 2)
    precision: |
      Two-stage rounding, and the ORDER IS PINNED: each per-category fraction is rounded to 2 decimal places
      FIRST, then the weighted sum is taken, then the percentage is rounded to 2 decimal places. Summing the
      unrounded fractions and rounding only at the end gives a different answer.
    worked_example: |
      Order with ordered_qty 7, no APPROVED ActuatorPackage, documents = [MATERIAL_TEST_REPORT x1,
      DIMENSIONAL_REPORT x1, NDE_REPORT x1].
        MATERIAL_TEST_REPORT      : 1/7 -> round_half_up(0.142857, 2) = 0.14  * 0.25 = 0.0350
        TEST_CERTIFICATE          : 0/7 -> 0.00                              * 0.25 = 0.0000
        DIMENSIONAL_REPORT        : 1/1 -> 1.00                              * 0.15 = 0.1500
        NDE_REPORT                : 1/1 -> 1.00                              * 0.15 = 0.1500
        ACTUATOR_DATASHEET        : required 0 -> 1.00                       * 0.10 = 0.1000
        DECLARATION_OF_CONFORMITY : 0/1 -> 0.00                              * 0.10 = 0.0000
        weighted_sum = 0.4350 -> documentation_completeness_pct = round_half_up(43.50, 2) = 43.50
      Rounding-order contrast: with the unrounded 1/7 = 0.1428571..., the weighted sum would be 0.43571428...
      and the percentage 43.57. The pinned order yields 43.50, not 43.57.

  - name: eto_order_price_cents
    algorithm_type: waterfall_allocation
    output_fields: [EngineeredOrder.gross_quoted_cents, EngineeredOrder.net_billable_cents, EngineeredOrder.credit_issued_cents]
    inputs: [EngineeredOrder.unit_price_cents, EngineeredOrder.ordered_qty, EngineeredOrder.requested_special_services, EngineeredOrder.expedite_requested, "the order status at the moment of CANCEL"]
    constants:
      SPECIAL_SERVICE_SURCHARGE_RATE: { FIRE_SAFE: 0.06, CRYOGENIC: 0.12, FUGITIVE_EMISSION: 0.04 }
      VOLUME_DISCOUNT_TIER: "pre_discount_cents >= 6000000 -> 0.06; 2000000 <= pre_discount_cents < 6000000 -> 0.03; pre_discount_cents < 2000000 -> 0.00"
      EXPEDITE_FEE_RATE: 0.08
      CANCELLATION_RETENTION_RATE: { APPROVED: 0.10, IN_PRODUCTION: 0.35, HELD: 0.35 }
    formula: |
      step 1  subtotal_cents     = unit_price_cents * ordered_qty
      step 2  surcharge_rate     = sum of SPECIAL_SERVICE_SURCHARGE_RATE[s] over s in requested_special_services (additive)
              surcharge_cents    = round_half_up(subtotal_cents * surcharge_rate, 0)
      step 3  pre_discount_cents = subtotal_cents + surcharge_cents
      step 4  discount_pct       = VOLUME_DISCOUNT_TIER keyed on pre_discount_cents
      step 5  discount_cents     = round_half_up(pre_discount_cents * discount_pct, 0)
      step 6  expedite_fee_cents = round_half_up((pre_discount_cents - discount_cents) * EXPEDITE_FEE_RATE, 0)
                                   when expedite_requested is true, else 0
      step 7  gross_quoted_cents = pre_discount_cents - discount_cents + expedite_fee_cents
      On CANCEL from status S:
              net_billable_cents = round_half_up(gross_quoted_cents * CANCELLATION_RETENTION_RATE[S], 0)
              credit_issued_cents = gross_quoted_cents - net_billable_cents
    precision: "integer cents throughout; every intermediate money figure is rounded to 0 decimal places, ROUND_HALF_UP, before the next step consumes it"
    worked_example: |
      ordered_qty 4, unit_price_cents 1250000, requested_special_services [FIRE_SAFE, CRYOGENIC], expedite_requested true.
        step 1 subtotal      = 1250000 * 4 = 5000000
        step 2 rate          = 0.06 + 0.12 = 0.18; surcharge = round_half_up(5000000 * 0.18, 0) = 900000
        step 3 pre_discount  = 5900000
        step 4 discount_pct  = 0.03  (5900000 is in [2000000, 6000000) — keyed on pre_discount, NOT on the grand total)
        step 5 discount      = round_half_up(5900000 * 0.03, 0) = 177000
        step 6 expedite      = round_half_up((5900000 - 177000) * 0.08, 0) = round_half_up(457840.0, 0) = 457840
        step 7 gross         = 5900000 - 177000 + 457840 = 6180840
      CANCEL while IN_PRODUCTION: net_billable = round_half_up(6180840 * 0.35, 0) = 2163294;
        credit_issued = 6180840 - 2163294 = 4017546; 2163294 + 4017546 == 6180840.
      CANCEL while APPROVED:      net_billable = round_half_up(6180840 * 0.10, 0) = 618084;
        credit_issued = 6180840 - 618084 = 5562756; 618084 + 5562756 == 6180840.
    note: |
      The evaluation order is load-bearing. The discount tier is keyed on pre_discount_cents (6180840 would
      have crossed the 0.06 tier) and the expedite fee is charged on the post-discount base, so applying the
      expedite fee before the discount, or tiering on the grand total, both give a different gross.

  - name: foundry_quality_index
    algorithm_type: threshold
    output_fields: [Foundry.quality_index, Foundry.status]
    inputs: [Foundry.total_lot_count, Foundry.rejected_lot_count, Foundry.revoked_qualification_count]
    constants:
      REJECT_RATE_PENALTY: 40
      REVOCATION_PENALTY: 8
      STATUS_BAND: "quality_index >= 80 -> ACTIVE; 60 <= quality_index < 80 -> PROBATION; quality_index < 60 -> SUSPENDED"
    formula: |
      reject_rate   = 0                                          when total_lot_count == 0
                    = rejected_lot_count / total_lot_count       otherwise
      quality_index = round_half_up(100 - REJECT_RATE_PENALTY * reject_rate - REVOCATION_PENALTY * revoked_qualification_count, 2)
      quality_index is then clamped into [0.00, 100.00]
      status = STATUS_BAND[quality_index]
    precision: "2 decimal places, ROUND_HALF_UP; clamped after rounding"
    worked_example: |
      Empty set: a freshly created Foundry has total_lot_count 0 -> reject_rate 0 (NOT a division by zero, and
      NOT a 0 score) -> quality_index = 100.00 -> status ACTIVE.
      2 lots, 1 quarantined, 0 revocations: reject_rate 0.5 -> 100 - 20 - 0 = 80.00 -> status ACTIVE
      (80.00 sits exactly on the ACTIVE/PROBATION boundary and belongs to ACTIVE).
      5 lots, 3 rejected, 0 revocations : reject_rate 0.6 -> 100 - 24 = 76.00 -> status PROBATION.
      5 lots, 1 rejected, 3 revocations : 100 - 8 - 24 = 68.00 -> status PROBATION.

  - name: heat_lot_mass_balance
    algorithm_type: aggregation
    output_fields: [HeatLot.qty_committed_kg, HeatLot.qty_scrapped_kg, HeatLot.qty_available_kg]
    inputs: ["Component rows with this heat_lot_id: net_weight_kg, status"]
    constants: {}
    formula: |
      qty_committed_kg = sum of net_weight_kg over Components with status IN {CREATED, ISSUED_TO_MACHINING, CONSUMED, HOLD}
      qty_scrapped_kg  = sum of net_weight_kg over Components with status == SCRAPPED
      qty_available_kg = qty_received_kg - qty_committed_kg - qty_scrapped_kg
      VOIDED components contribute to neither sum — their mass returns to qty_available_kg.
      Invariant: qty_received_kg == qty_available_kg + qty_committed_kg + qty_scrapped_kg, always.
    precision: "3 decimal places, ROUND_HALF_UP"
    worked_example: |
      qty_received_kg 500.000. Create components of 120.500 and 60.250:
        committed 180.750, scrapped 0.000, available 319.250 (sums to 500.000).
      SCRAP the 60.250 component: committed 120.500, scrapped 60.250, available 319.250 (still 500.000) —
        scrap does not give the mass back.
      VOID the 120.500 component: committed 0.000, scrapped 60.250, available 439.750 (still 500.000) —
        void is the compensating disposition and does give the mass back.

  - name: required_test_envelope
    algorithm_type: tiered_pricing
    output_fields: [TestRecord.required_pressure_bar, TestRecord.required_hold_seconds]
    inputs: [ValveModel.pressure_class, ValveModel.bore_size_mm, TestRecord.test_type]
    constants:
      PRESSURE_CLASS_RATED_BAR: { 150: 19.6, 300: 51.1, 600: 102.1, 900: 153.2, 1500: 255.3, 2500: 425.5 }
      SHELL_TEST_MULTIPLIER: 1.5
      SEAT_TEST_MULTIPLIER: 1.1
      HOLD_SECONDS_BY_BORE: "bore_size_mm <= 50 -> 15; 50 < bore_size_mm <= 150 -> 60; 150 < bore_size_mm <= 300 -> 120; bore_size_mm > 300 -> 300"
    formula: |
      rated = PRESSURE_CLASS_RATED_BAR[model.pressure_class]
      required_pressure_bar = round_half_up(rated * SHELL_TEST_MULTIPLIER, 1)   when test_type == SHELL
                            = round_half_up(rated * SEAT_TEST_MULTIPLIER, 1)    when test_type == SEAT
                            = round_half_up(rated * SEAT_TEST_MULTIPLIER, 1)    when test_type IN {FIRE_SAFE, CRYOGENIC}
                            = 0.0                                              when test_type IN {FUNCTIONAL, FUGITIVE_EMISSION}
      required_hold_seconds = HOLD_SECONDS_BY_BORE[model.bore_size_mm]
      A TestRecord is refused when test_pressure_bar < required_pressure_bar (ERR_TEST_PRESSURE_BELOW_STANDARD)
      or when hold_seconds < required_hold_seconds (ERR_TEST_HOLD_TIME_SHORT).
    precision: "1 decimal place, ROUND_HALF_UP; hold seconds are integers"
    worked_example: |
      Shell pressures by class: 150 -> round_half_up(29.40,1) = 29.4; 300 -> round_half_up(76.65,1) = 76.7;
        600 -> 153.2; 900 -> round_half_up(229.80,1) = 229.8; 1500 -> round_half_up(382.95,1) = 383.0;
        2500 -> round_half_up(638.25,1) = 638.3.
      Seat pressures by class: 150 -> round_half_up(21.56,1) = 21.6; 300 -> round_half_up(56.21,1) = 56.2;
        600 -> round_half_up(112.31,1) = 112.3; 900 -> round_half_up(168.52,1) = 168.5;
        1500 -> round_half_up(280.83,1) = 280.8; 2500 -> round_half_up(468.05,1) = 468.1.
      Hold seconds: bore 50 -> 15; bore 51 -> 60; bore 150 -> 60 (the upper edge of its band, not 120);
        bore 151 -> 120; bore 300 -> 120; bore 301 -> 300.

  - name: required_test_set
    algorithm_type: constraint_propagation
    output_fields: [ValveUnit.cert_status]
    inputs: [ValveModel.valve_type, ValveUnit.special_services, "ActuatorPackage rows of the unit (sizing_status)", "TestRecord rows of the unit (test_type, result, created_at)"]
    constants:
      SPECIAL_SERVICE_TEST_TYPE: { FIRE_SAFE: FIRE_SAFE, CRYOGENIC: CRYOGENIC, FUGITIVE_EMISSION: FUGITIVE_EMISSION }
    formula: |
      required = {SHELL, SEAT}
      required += {FUNCTIONAL} when model.valve_type == CONTROL
                             or the unit has an ActuatorPackage with sizing_status == APPROVED
      required += {SPECIAL_SERVICE_TEST_TYPE[s] for each s in unit.special_services}
      For each required test_type, the DECIDING record is the one with the greatest created_at.
      cert_status -> TESTS_PASSED only when every required test_type has a deciding record with result == PASS.
      cert_status -> TESTS_FAILED as soon as any deciding record has result == FAIL.
    precision: "not applicable — set membership"
    worked_example: |
      BALL valve, special_services [FUGITIVE_EMISSION], no ActuatorPackage: required = {SHELL, SEAT, FUGITIVE_EMISSION} (3 records).
      The same unit once an ActuatorPackage is APPROVED: required = {SHELL, SEAT, FUNCTIONAL, FUGITIVE_EMISSION} (4 records) —
        approving an actuator retroactively widens the required set, so a unit already at TESTS_PASSED falls
        back to TESTS_IN_PROGRESS.
      CONTROL valve, special_services []: required = {SHELL, SEAT, FUNCTIONAL} even with no actuator.
      A unit whose SEAT record FAILed and was then re-run with PASS is TESTS_PASSED: the later record decides.
    note: "The required set is conditional on configuration, so coverage must be recomputed, never cached."

  - name: model_qualified_special_services
    algorithm_type: chronological
    output_fields: [ValveModel.qualified_special_services]
    inputs: ["TestRecord rows of every ValveUnit of this model: test_type, result, ended_at", "the current logical clock"]
    constants:
      TYPE_TEST_VALIDITY_DAYS: 1825
    formula: |
      For each s in {FIRE_SAFE, CRYOGENIC, FUGITIVE_EMISSION}:
        candidates = TestRecords with test_type == s, result == PASS, on any ValveUnit of this model
        s is qualified when some candidate satisfies
            ended_at + TYPE_TEST_VALIDITY_DAYS >= current_utc
      qualified_special_services = the sorted list of qualified services (FIRE_SAFE, CRYOGENIC, FUGITIVE_EMISSION order)
      An empty candidate set yields [] — never null.
    precision: "day-granularity comparison against the logical clock"
    worked_example: |
      A prototype unit of the model (built while the model was IN_REVIEW) has a PASS FIRE_SAFE record with
      ended_at 2026-07-20T00:00:00Z. With the clock at 2026-08-01T00:00:00Z the type test is 12 days old, well
      inside 1825 days, so qualified_special_services == ["FIRE_SAFE"] and RELEASE is permitted for a model
      whose required_special_services == ["FIRE_SAFE"]. A model claiming ["FIRE_SAFE", "CRYOGENIC"] with only
      the FIRE_SAFE type test is refused with ERR_SPECIAL_SERVICE_NOT_QUALIFIED.
    note: |
      This is why ValveUnit creation only requires model.status IN {IN_REVIEW, RELEASED}: type-test units must
      exist before the model can be released, while certification still requires a RELEASED model.

  - name: license_compliance_posture
    algorithm_type: threshold
    output_fields: [MonogramLicense.compliance_posture, MonogramLicense.open_major_finding_count, MonogramLicense.open_minor_finding_count]
    inputs: [MonogramLicense.total_major_raised, MonogramLicense.closed_major_finding_count, MonogramLicense.waived_major_finding_count, MonogramLicense.total_minor_raised, MonogramLicense.license_status]
    constants:
      MAJOR_FINDING_FREEZE_THRESHOLD: 2
      MINOR_FINDING_CONDITIONAL_THRESHOLD: 5
      CONDITIONAL_VALIDITY_DAYS: 180
      AUDIT_COOLING_OFF_DAYS: 30
      MAX_CARBON_EQUIVALENT_PCT: { WCB: 0.45, LCC: 0.43, A105: 0.48, CF8M: 0.40, F316: 0.40 }
      MIN_IMPACT_ENERGY_J: { WCB: 20, LCC: 27, A105: 20, CF8M: 34, F316: 34 }
      MAX_CLARIFICATION_ROUNDS: 3
    formula: |
      open_major_finding_count = total_major_raised - closed_major_finding_count - waived_major_finding_count
      open_minor_finding_count = total_minor_raised - (minor findings closed)
      compliance_posture = FROZEN       when open_major_finding_count >= MAJOR_FINDING_FREEZE_THRESHOLD
                                        or license_status IN {SUSPENDED, DENIED, REVOKED}
                         = CONDITIONAL  when open_major_finding_count == 1
                                        or open_minor_finding_count >= MINOR_FINDING_CONDITIONAL_THRESHOLD
                                        or license_status == CONDITIONAL
                         = COMPLIANT    otherwise
      Counter identity: total_major_raised == open_major_finding_count + closed_major_finding_count + waived_major_finding_count.
    precision: "integer counters"
    worked_example: |
      A GRANTED license with total_major_raised 0 and total_minor_raised 4 is COMPLIANT.
      RAISE one MAJOR finding: open_major 1 -> CONDITIONAL (certification of special-service units is refused,
        plain units still certify). RAISE a second MAJOR: open_major 2 -> FROZEN, license_status -> SUSPENDED,
        and every CERTIFIED unit under the license is DECERTIFIED.
      WAIVE one of the two MAJOR findings: waived 1, open_major 1 -> CONDITIONAL; the identity 2 == 1 + 0 + 1
        holds, and the units decertified by the freeze are NOT restored.
      A license with total_minor_raised 5 and no majors is CONDITIONAL, so GRANT is refused and only
        GRANT_CONDITIONAL is available; at 4 minors GRANT succeeds.
    note: "MAX_CARBON_EQUIVALENT_PCT, MIN_IMPACT_ENERGY_J, MAX_CLARIFICATION_ROUNDS, AUDIT_COOLING_OFF_DAYS and CONDITIONAL_VALIDITY_DAYS are declared here as the single constants home for the compliance domain; they are referenced from §1.2 and §1.4."

# =============================================================================
# §1.4 Validation Rules — evaluated in ascending priority; the FIRST violated rule
#      determines the response. Priority numbers are sparse so later rules can be
#      inserted without renumbering.
# =============================================================================
validations:
  - { priority: 1,  category: auth, rule: "X-User-ID and X-User-Role headers are both present and non-empty on every endpoint", error_id: ERR_UNAUTHENTICATED, http_status: 401, applies_to: "all endpoints" }
  - { priority: 2,  category: auth, rule: "X-User-Role is one of the seven declared roles and is permitted on the endpoint per §1.7", error_id: ERR_ROLE_NOT_PERMITTED, http_status: 403, applies_to: "all endpoints" }
  - { priority: 3,  category: auth, rule: "on a multi-action endpoint, X-User-Role is permitted for the specific action/decision value in the body (e.g. only QualityManager may VERIFY a heat lot even though ProcurementSpecialist may reach the dispositions endpoint)", error_id: ERR_ROLE_NOT_PERMITTED, http_status: 403, applies_to: "POST /valve-mfg/valve-models/{id}/actions, POST /valve-mfg/heat-lots/{id}/dispositions, POST /valve-mfg/components/{id}/dispositions, POST /valve-mfg/valve-units/{id}/cert-actions, POST /valve-mfg/monogram-licenses/{id}/actions, POST /valve-mfg/monogram-licenses/{id}/finding-entries, POST /valve-mfg/engineered-orders/{id}/review-actions, POST /valve-mfg/engineered-orders/{id}/lifecycle-actions, POST /valve-mfg/foundry-qualifications/{id}/actions" }
  - { priority: 4,  category: auth, rule: "a SupplierRep may only read or write HeatLot rows whose foundry_id equals the SupplierRep's own X-User-ID (identity: entity_backed on Foundry)", error_id: ERR_FOUNDRY_SCOPE_VIOLATION, http_status: 403, applies_to: "POST /valve-mfg/heat-lots, GET /valve-mfg/heat-lots, GET /valve-mfg/heat-lots/{id}" }

  - { priority: 10, category: request_shape, rule: "every field with source: input and no default is present; types match; enum values are members of the declared set; arrays contain no duplicates and no unknown members", error_id: ERR_INVALID_REQUEST, http_status: 400, applies_to: "all write endpoints" }
  - { priority: 11, category: request_shape, rule: "limit is an integer in [1, 100] and offset is an integer >= 0", error_id: ERR_INVALID_PAGINATION, http_status: 400, applies_to: "all list endpoints" }
  - { priority: 12, category: request_shape, rule: "numeric domains hold: pressure_class IN {150,300,600,900,1500,2500}; bore_size_mm > 0; base_break_torque_nm > 0; ordered_qty >= 1; unit_price_cents >= 0; qty_received_kg > 0; net_weight_kg > 0; leak_rate_ppm >= 0; hold_seconds >= 1; kit_qty >= 1", error_id: ERR_INVALID_REQUEST, http_status: 400, applies_to: "all write endpoints carrying the field" }
  - { priority: 13, category: request_shape, rule: "interval endpoints are ordered strictly: valid_from < valid_until, audit_window_start < audit_window_end, started_at < ended_at", error_id: ERR_INVALID_REQUEST, http_status: 400, applies_to: "POST /valve-mfg/foundry-qualifications, POST /valve-mfg/foundry-qualifications/{id}/actions, POST /valve-mfg/monogram-licenses, POST /valve-mfg/monogram-licenses/{id}/actions, POST /valve-mfg/valve-units/{id}/test-records" }

  - { priority: 20, category: existence, rule: "the ValveModel referenced by the path or by model_id / pinned_model_id / supersedes_model_id / target_model_id exists", error_id: ERR_MODEL_NOT_FOUND, http_status: 404, applies_to: "GET+POST /valve-mfg/valve-models/{id}..., POST /valve-mfg/valve-units, POST /valve-mfg/components, POST /valve-mfg/engineered-orders" }
  - { priority: 21, category: existence, rule: "the Foundry referenced by the path or by foundry_id exists", error_id: ERR_FOUNDRY_NOT_FOUND, http_status: 404, applies_to: "GET /valve-mfg/foundries/{id}, POST /valve-mfg/foundry-qualifications, POST /valve-mfg/heat-lots" }
  - { priority: 22, category: existence, rule: "the FoundryQualification referenced by the path exists", error_id: ERR_QUALIFICATION_NOT_FOUND, http_status: 404, applies_to: "GET /valve-mfg/foundry-qualifications/{id}, POST /valve-mfg/foundry-qualifications/{id}/actions" }
  - { priority: 23, category: existence, rule: "the HeatLot referenced by the path or by heat_lot_id exists", error_id: ERR_HEAT_LOT_NOT_FOUND, http_status: 404, applies_to: "GET /valve-mfg/heat-lots/{id}, POST /valve-mfg/heat-lots/{id}/dispositions, POST /valve-mfg/components" }
  - { priority: 24, category: existence, rule: "the Component referenced by the path or by body_component_id exists", error_id: ERR_COMPONENT_NOT_FOUND, http_status: 404, applies_to: "GET /valve-mfg/components/{id}, POST /valve-mfg/components/{id}/dispositions, POST /valve-mfg/valve-units" }
  - { priority: 25, category: existence, rule: "the ValveUnit referenced by the path or by valve_unit_id exists", error_id: ERR_UNIT_NOT_FOUND, http_status: 404, applies_to: "GET /valve-mfg/valve-units/{id}, all /valve-mfg/valve-units/{id}/* endpoints, POST /valve-mfg/actuator-packages" }
  - { priority: 26, category: existence, rule: "the ActuatorPackage referenced by the path exists", error_id: ERR_ACTUATOR_NOT_FOUND, http_status: 404, applies_to: "GET /valve-mfg/actuator-packages/{id}, POST /valve-mfg/actuator-packages/{id}/decision" }
  - { priority: 27, category: existence, rule: "the MonogramLicense referenced by the path or by monogram_license_id exists", error_id: ERR_LICENSE_NOT_FOUND, http_status: 404, applies_to: "GET /valve-mfg/monogram-licenses/{id}, POST /valve-mfg/monogram-licenses/{id}/actions, POST /valve-mfg/monogram-licenses/{id}/finding-entries, POST /valve-mfg/valve-units" }
  - { priority: 28, category: existence, rule: "the EngineeredOrder referenced by the path or by engineered_order_id exists", error_id: ERR_ORDER_NOT_FOUND, http_status: 404, applies_to: "GET /valve-mfg/engineered-orders/{id}, all /valve-mfg/engineered-orders/{id}/* endpoints, POST /valve-mfg/valve-units" }

  - { priority: 30, category: state, rule: "the requested action is listed as a transition out of the entity's current state in §1.2; this also covers terminal-state lockdown (SUPERSEDED/WITHDRAWN models, REJECTED lots, SCRAPPED/VOIDED components, SHIPPED build dimension, REVOKED qualifications, DENIED/REVOKED licenses, REJECTED/CANCELLED orders) and every dependent-state precondition without a more specific code (audit_state not CLOSED, order not DRAFT, service_status wrong, component on HOLD, order still holding a DECERTIFIED unit, datasheet_break_torque_nm absent at SUBMIT_REVIEW)", error_id: ERR_STATE_INVALID, http_status: 409, applies_to: "all action endpoints" }
  - { priority: 31, category: state, rule: "CERTIFY is refused when the unit's cert_status is already CERTIFIED (a repeated CERTIFY is an error, not a no-op)", error_id: ERR_UNIT_ALREADY_CERTIFIED, http_status: 409, applies_to: "POST /valve-mfg/valve-units/{id}/cert-actions" }
  - { priority: 32, category: state, rule: "CERTIFY requires cert_status == TESTS_PASSED (UNCERTIFIED, TESTS_IN_PROGRESS, TESTS_FAILED and DECERTIFIED are all refused here)", error_id: ERR_UNIT_NOT_TEST_PASSED, http_status: 409, applies_to: "POST /valve-mfg/valve-units/{id}/cert-actions" }
  - { priority: 33, category: state, rule: "advancing build_status to PACKAGED or SHIPPED requires cert_status == CERTIFIED (the one point where the build dimension depends on the certification dimension)", error_id: ERR_UNIT_NOT_CERTIFIED, http_status: 409, applies_to: "POST /valve-mfg/valve-units/{id}/build-actions" }

  - { priority: 34, category: concurrency, rule: "expected_valve_unit_version equals the referenced ValveUnit's current version", error_id: ERR_STALE_VALVE_UNIT_VERSION, http_status: 412, applies_to: "POST /valve-mfg/actuator-packages" }
  - { priority: 35, category: concurrency, rule: "expected_engineered_order_version equals the referenced EngineeredOrder's current version", error_id: ERR_STALE_ORDER_VERSION, http_status: 412, applies_to: "POST /valve-mfg/engineered-orders/{id}/datasheet-revisions" }

  - { priority: 40, category: business_referential, rule: "creating a Component requires the parent HeatLot.status == RELEASED (RECEIVED, VERIFIED, QUARANTINED and REJECTED are all refused); ISSUE_TO_MACHINING carries the same requirement", error_id: ERR_HEAT_LOT_NOT_RELEASED, http_status: 409, applies_to: "POST /valve-mfg/components, POST /valve-mfg/components/{id}/dispositions" }
  - { priority: 41, category: business_referential, rule: "creating a Component requires a FoundryQualification for the lot's foundry with status == QUALIFIED, matching process and material_grade, max_pressure_class >= target ValveModel.pressure_class, and the current logical clock inside [valid_from, valid_until]", error_id: ERR_FOUNDRY_NOT_QUALIFIED, http_status: 409, applies_to: "POST /valve-mfg/components" }
  - { priority: 42, category: business_referential, rule: "creating a ValveUnit requires the body Component to have status IN {CREATED, ISSUED_TO_MACHINING}, to be unreferenced by any other ValveUnit, to be of component_type BODY, and to have target_model_id equal to the unit's model_id; VOID likewise requires the component to be unreferenced", error_id: ERR_COMPONENT_NOT_AVAILABLE, http_status: 409, applies_to: "POST /valve-mfg/valve-units, POST /valve-mfg/components/{id}/dispositions" }
  - { priority: 43, category: business_referential, rule: "creating a ValveUnit requires ValveModel.status IN {IN_REVIEW, RELEASED}; CERTIFY and order APPROVE require ValveModel.status == RELEASED", error_id: ERR_MODEL_NOT_RELEASED, http_status: 409, applies_to: "POST /valve-mfg/valve-units, POST /valve-mfg/valve-units/{id}/cert-actions, POST /valve-mfg/engineered-orders/{id}/review-actions" }
  - { priority: 44, category: business_referential, rule: "CERTIFY requires the unit's MonogramLicense compliance_posture != FROZEN; when the posture is CONDITIONAL the unit's special_services must be empty; order RESUME requires no unit of the order to sit under a FROZEN license", error_id: ERR_LICENSE_POSTURE_BLOCKED, http_status: 409, applies_to: "POST /valve-mfg/valve-units/{id}/cert-actions, POST /valve-mfg/engineered-orders/{id}/lifecycle-actions" }
  - { priority: 45, category: business_referential, rule: "CERTIFY requires the ValveModel.valve_type to be a member of MonogramLicense.scope_valve_types", error_id: ERR_LICENSE_SCOPE_MISMATCH, http_status: 422, applies_to: "POST /valve-mfg/valve-units/{id}/cert-actions" }

  - { priority: 50, category: business_safety, rule: "special services must be backed by valid type tests: model RELEASE requires required_special_services subset of qualified_special_services; unit CERTIFY requires the unit's special_services subset of the model's qualified_special_services; order APPROVE requires requested_special_services subset of the model's qualified_special_services", error_id: ERR_SPECIAL_SERVICE_NOT_QUALIFIED, http_status: 422, applies_to: "POST /valve-mfg/valve-models/{id}/actions, POST /valve-mfg/valve-units/{id}/cert-actions, POST /valve-mfg/engineered-orders/{id}/review-actions" }
  - { priority: 51, category: business_safety, rule: "CERTIFY requires the required_test_set to be fully covered by deciding PASS records (this is the diagnosis when coverage is missing rather than merely un-started)", error_id: ERR_REQUIRED_TESTS_INCOMPLETE, http_status: 409, applies_to: "POST /valve-mfg/valve-units/{id}/cert-actions" }
  - { priority: 52, category: business_safety, rule: "segregation of duties: the certifying QualityManager's X-User-ID must not appear as performed_by_user_id on any TestRecord of the unit", error_id: ERR_SOD_TEST_WITNESS_CONFLICT, http_status: 403, applies_to: "POST /valve-mfg/valve-units/{id}/cert-actions" }
  - { priority: 53, category: business_safety, rule: "segregation of duties: the X-User-ID waiving a finding must not equal MonogramLicense.lead_auditor_user_id", error_id: ERR_SOD_AUDIT_WAIVER_CONFLICT, http_status: 403, applies_to: "POST /valve-mfg/monogram-licenses/{id}/finding-entries" }
  - { priority: 54, category: business_safety, rule: "VERIFY requires carbon_equivalent_pct <= MAX_CARBON_EQUIVALENT_PCT[material_grade] and impact_energy_j >= MIN_IMPACT_ENERGY_J[material_grade]", error_id: ERR_MTR_CHEMISTRY_OUT_OF_SPEC, http_status: 422, applies_to: "POST /valve-mfg/heat-lots/{id}/dispositions" }
  - { priority: 55, category: business_safety, rule: "a TestRecord requires test_pressure_bar >= required_pressure_bar (calc: required_test_envelope) for SHELL, SEAT, FIRE_SAFE and CRYOGENIC tests", error_id: ERR_TEST_PRESSURE_BELOW_STANDARD, http_status: 422, applies_to: "POST /valve-mfg/valve-units/{id}/test-records" }
  - { priority: 56, category: business_safety, rule: "a TestRecord requires hold_seconds >= required_hold_seconds (calc: required_test_envelope, banded on ValveModel.bore_size_mm)", error_id: ERR_TEST_HOLD_TIME_SHORT, http_status: 422, applies_to: "POST /valve-mfg/valve-units/{id}/test-records" }
  - { priority: 57, category: business_safety, rule: "when FUGITIVE_EMISSION is in the unit's special_services, CERTIFY requires the TIME_WEIGHTED final_emission_leak_class to be IN {AA, A, B} (class C and FAIL are refused)", error_id: ERR_EMISSION_CLASS_FAIL, http_status: 422, applies_to: "POST /valve-mfg/valve-units/{id}/cert-actions" }
  - { priority: 58, category: business_safety, rule: "advancing build_status to PACKAGED requires that, if any ActuatorPackage exists for the unit, exactly one has sizing_status == APPROVED", error_id: ERR_ACTUATOR_NOT_APPROVED, http_status: 409, applies_to: "POST /valve-mfg/valve-units/{id}/build-actions" }
  - { priority: 59, category: business_safety, rule: "APPROVE on an actuator package requires output_torque_nm >= sized_torque_nm (calc: required_actuator_torque_nm, variant-selected)", error_id: ERR_ACTUATOR_TORQUE_INSUFFICIENT, http_status: 422, applies_to: "POST /valve-mfg/actuator-packages/{id}/decision" }

  - { priority: 60, category: business_temporal, rule: "a test bench is exclusive over the HALF-OPEN interval [started_at, ended_at): a new TestRecord on the same test_bench_code is refused when its interval overlaps an existing record's interval; intervals that merely touch (new.started_at == existing.ended_at) are accepted", error_id: ERR_TEST_BENCH_OCCUPIED, http_status: 409, applies_to: "POST /valve-mfg/valve-units/{id}/test-records" }
  - { priority: 61, category: business_temporal, rule: "FoundryQualification validity is a CLOSED interval [valid_from, valid_until]: two qualifications for the same foundry_id + process + material_grade may not overlap, and touching endpoints (new.valid_from == existing.valid_until) DO collide", error_id: ERR_QUALIFICATION_WINDOW_OVERLAP, http_status: 409, applies_to: "POST /valve-mfg/foundry-qualifications, POST /valve-mfg/foundry-qualifications/{id}/actions" }
  - { priority: 62, category: business_temporal, rule: "SCHEDULE_AUDIT requires audit_window_start >= last_audit_closed_at + AUDIT_COOLING_OFF_DAYS (30 days); the boundary instant itself is accepted", error_id: ERR_AUDIT_COOLING_OFF_ACTIVE, http_status: 409, applies_to: "POST /valve-mfg/monogram-licenses/{id}/actions" }

  - { priority: 70, category: business_constraint, rule: "codes are unique in their scope: model_code across ValveModel rows with status IN {DRAFT, IN_REVIEW, RELEASED}; foundry_code globally; heat_number per foundry_id; serial_number globally; order_code globally; license_code globally", error_id: ERR_DUPLICATE_CODE, http_status: 409, applies_to: "POST /valve-mfg/valve-models, POST /valve-mfg/foundries, POST /valve-mfg/heat-lots, POST /valve-mfg/valve-units, POST /valve-mfg/engineered-orders, POST /valve-mfg/monogram-licenses" }
  - { priority: 71, category: business_constraint, rule: "ADVANCE only moves build_status to the adjacent forward state (BLANK->MACHINED->ASSEMBLED->PACKAGED->SHIPPED); any skip or backward target is refused", error_id: ERR_BUILD_SEQUENCE_INVALID, http_status: 422, applies_to: "POST /valve-mfg/valve-units/{id}/build-actions" }
  - { priority: 72, category: business_constraint, rule: "REQUEST_CLARIFICATION requires clarification_round_count < MAX_CLARIFICATION_ROUNDS (3); the fourth request is refused and the order must be approved or rejected", error_id: ERR_CLARIFICATION_ROUNDS_EXHAUSTED, http_status: 409, applies_to: "POST /valve-mfg/engineered-orders/{id}/review-actions" }
  - { priority: 73, category: business_constraint, rule: "GRANT, GRANT_CONDITIONAL and REINSTATE require open_major_finding_count == 0; DENY requires open_major_finding_count >= 1", error_id: ERR_OPEN_MAJOR_FINDINGS, http_status: 409, applies_to: "POST /valve-mfg/monogram-licenses/{id}/actions" }
  - { priority: 74, category: business_constraint, rule: "GRANT requires open_minor_finding_count <= 4 and GRANT_CONDITIONAL requires open_minor_finding_count >= 5 — the two closeout branches partition the minor-finding count at 5", error_id: ERR_MINOR_FINDING_THRESHOLD, http_status: 409, applies_to: "POST /valve-mfg/monogram-licenses/{id}/actions" }
  - { priority: 75, category: business_constraint, rule: "RELEASE_TO_PRODUCTION requires spec_stale == false, i.e. pinned_model_spec_revision still equals the pinned model's spec_revision and that model is still RELEASED", error_id: ERR_PINNED_SPEC_STALE, http_status: 409, applies_to: "POST /valve-mfg/engineered-orders/{id}/lifecycle-actions" }
  - { priority: 76, category: business_constraint, rule: "ISSUE_DOC_PACKAGE requires doc_package_status == COMPLETE (documentation_completeness_pct == 100.00); CLOSE requires doc_package_status == ISSUED", error_id: ERR_DOC_PACKAGE_INCOMPLETE, http_status: 409, applies_to: "POST /valve-mfg/engineered-orders/{id}/lifecycle-actions" }
  - { priority: 77, category: business_constraint, rule: "ISSUE_DOC_PACKAGE and CLOSE require certified_unit_count >= ordered_qty", error_id: ERR_ORDER_UNITS_INCOMPLETE, http_status: 409, applies_to: "POST /valve-mfg/engineered-orders/{id}/lifecycle-actions" }

  - { priority: 80, category: business_fiscal, rule: "creating a Component requires net_weight_kg <= HeatLot.qty_available_kg (mass conservation: a lot cannot over-commit)", error_id: ERR_LOT_INSUFFICIENT_MASS, http_status: 422, applies_to: "POST /valve-mfg/components" }
  - { priority: 81, category: business_fiscal, rule: "RESERVE_KIT requires kit_qty <= ValveModel.repair_kit_stock_qty", error_id: ERR_REPAIR_KIT_OUT_OF_STOCK, http_status: 409, applies_to: "POST /valve-mfg/valve-units/{id}/service-actions" }
  - { priority: 82, category: business_fiscal, rule: "RELEASE_TO_PRODUCTION requires gross_quoted_cents <= customer_credit_limit_cents", error_id: ERR_CREDIT_LIMIT_EXCEEDED, http_status: 402, applies_to: "POST /valve-mfg/engineered-orders/{id}/lifecycle-actions" }

validation_priority_notes: |
  Two priority pairs are deliberately reachable together and are the ones a naive implementation gets wrong:
    * p32 (state, ERR_UNIT_NOT_TEST_PASSED, 409) vs p52 (business_safety, ERR_SOD_TEST_WITNESS_CONFLICT, 403):
      a QualityManager who also recorded the unit's tests, certifying a unit whose SEAT test FAILed, must see
      the 409 state error, not the 403 duty error.
    * p40 (business_referential, ERR_HEAT_LOT_NOT_RELEASED, 409) vs p80 (business_fiscal,
      ERR_LOT_INSUFFICIENT_MASS, 422): a component drawn from an over-committed lot that is still merely
      VERIFIED must report the referential error, not the mass error.

# =============================================================================
# §1.5 API Endpoint Table — every path parameter is named {id}
# =============================================================================
endpoints:
  # --- ValveModel ---
  - method: POST
    path: "/valve-mfg/valve-models"
    description: "Create a product-line entry (design record)"
    roles: [ProductEngineer]
    code: 201
    input: [model_code, valve_type, pressure_class, body_material_grade, bore_size_mm, seat_type, base_break_torque_nm, "required_special_services?", "repair_kit_stock_qty?", "supersedes_model_id?"]
    output: ValveModel
    side_effects: ["status=DRAFT, spec_revision=1, qualified_special_services=[], authored_by_user_id=X-User-ID, released_at=null, version=1"]

  - method: GET
    path: "/valve-mfg/valve-models"
    description: "List product-line entries"
    roles: [Any]
    code: 200
    input: ["status?", "valve_type?", "supersedes_model_id?", "limit?", "offset?"]
    output: ValveModel[]
    side_effects: []

  - method: GET
    path: "/valve-mfg/valve-models/{id}"
    description: "Get one product-line entry with recomputed qualified_special_services"
    roles: [Any]
    code: 200
    input: []
    output: ValveModel
    side_effects: []

  - method: POST
    path: "/valve-mfg/valve-models/{id}/actions"
    description: "Design lifecycle action: SUBMIT_REVIEW | RELEASE | REJECT | WITHDRAW"
    roles: [ProductEngineer, QualityManager]
    code: 200
    input: [action]
    output: ValveModel
    side_effects:
      - "SUBMIT_REVIEW: status DRAFT -> IN_REVIEW"
      - "REJECT: status IN_REVIEW -> DRAFT, spec_revision += 1, every order pinned to this model becomes spec_stale"
      - "RELEASE: status IN_REVIEW -> RELEASED, released_at set, any superseded model -> SUPERSEDED and its pinned orders become spec_stale"
      - "WITHDRAW: status RELEASED -> WITHDRAWN, pinned orders become spec_stale"
      - "version += 1"

  # --- Foundry ---
