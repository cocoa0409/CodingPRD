  # ---- Test-driving clock ----
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Test-driving endpoint: set the server's deterministic current UTC clock used for staged_at and cold-chain evaluation"
    roles: [PlatformAdmin]
    code: 200
    input: [to_iso8601]
    output: null
    side_effects: ["server current_utc set to the given timestamp"]

# =============================================================================
# 1.6 Error Code Catalog
# =============================================================================
errors:
  # --- request / auth ---
  - { id: ERR_VALIDATION, http: 400, condition: "Malformed body, missing required field, or invalid enum/type" }
  - { id: ERR_MISSING_USER_CONTEXT, http: 401, condition: "X-User-ID or X-User-Role header missing or malformed" }
  - { id: ERR_FORBIDDEN_ROLE, http: 403, condition: "Authenticated role not permitted for the operation, or entity_backed user does not own the resource" }

  # --- existence ---
  - { id: ERR_STORE_NOT_FOUND, http: 404, condition: "Store id does not exist" }
  - { id: ERR_CUSTOMER_NOT_FOUND, http: 404, condition: "Customer id does not exist" }
  - { id: ERR_PRODUCT_NOT_FOUND, http: 404, condition: "Product id does not exist" }
  - { id: ERR_SLOT_NOT_FOUND, http: 404, condition: "FulfillmentSlot id does not exist" }
  - { id: ERR_PICKER_NOT_FOUND, http: 404, condition: "Picker id does not exist" }
  - { id: ERR_ORDER_NOT_FOUND, http: 404, condition: "Order id does not exist" }
  - { id: ERR_LINE_NOT_FOUND, http: 404, condition: "OrderLine id does not exist" }
  - { id: ERR_SUBSTITUTION_NOT_FOUND, http: 404, condition: "Substitution id does not exist" }

  # --- referential / cross-store ---
  - { id: ERR_CROSS_STORE_REFERENCE, http: 409, condition: "Referenced slot/product/picker belongs to a different store than the order's store_id" }
  - { id: ERR_PRODUCT_DISCONTINUED, http: 409, condition: "Referenced product is DISCONTINUED and cannot be ordered or substituted in" }
  - { id: ERR_CUSTOMER_SUSPENDED, http: 409, condition: "Ordering customer is SUSPENDED" }
  - { id: ERR_STORE_CLOSED, http: 409, condition: "Store is CLOSED; new orders refused" }

  # --- order / line / substitution / slot state ---
  - { id: ERR_INVALID_ORDER_STATE, http: 409, condition: "Order not in a valid fulfillment/payment state for this transition" }
  - { id: ERR_ORDER_NOT_PICKING, http: 409, condition: "Operation requires Order.fulfillment_status == PICKING" }
  - { id: ERR_ORDER_NOT_STAGED, http: 409, condition: "Operation requires Order.fulfillment_status == STAGED" }
  - { id: ERR_ORDER_ALREADY_HANDED_OFF, http: 409, condition: "Order already HANDED_OFF; cannot cancel or re-transition" }
  - { id: ERR_LINE_NOT_PENDING, http: 409, condition: "OrderLine not in PENDING state for pick/substitute/pre-capture out-of-stock" }
  - { id: ERR_LINE_NOT_PICKED, http: 409, condition: "Post-capture out-of-stock requires OrderLine in PICKED state on a STAGED captured order" }
  - { id: ERR_SUBSTITUTION_NOT_PROPOSED, http: 409, condition: "Substitution not in PROPOSED state" }
  - { id: ERR_SLOT_CLOSED, http: 409, condition: "Slot is CLOSED; placement refused" }

  # --- capacity / concurrency / overlap / constraints ---
  - { id: ERR_SLOT_VERSION_STALE, http: 412, condition: "expected_slot_version does not match current FulfillmentSlot.version (OCC)" }
  - { id: ERR_SLOT_FULL, http: 409, condition: "Slot booked_count == capacity at placement time" }
  - { id: ERR_SLOT_WINDOW_OVERLAP, http: 409, condition: "New slot window overlaps an existing slot of same store and slot_type (half-open [start,end))" }
  - { id: ERR_PICKER_WINDOW_CONFLICT, http: 409, condition: "Claimed pick window overlaps an existing claimed window of this picker within the cooldown buffer (closed-interval + buffer)" }
  - { id: ERR_LINES_NOT_RESOLVED, http: 409, condition: "Stage attempted while at least one line is still PENDING" }
  - { id: ERR_NOTHING_TO_STAGE, http: 409, condition: "Stage attempted but no line is PICKED or SUBSTITUTED" }
  - { id: ERR_INVALID_PICK_QUANTITY, http: 400, condition: "Pick missing or non-positive picked_qty (UNIT) / actual_weight_kg (WEIGHT)" }

  # --- safety / temporal / fiscal ---
  - { id: ERR_AGE_VERIFICATION_REQUIRED, http: 403, condition: "Handoff of an age-restricted order without a PASS AgeCheck" }
  - { id: ERR_AGE_VERIFICATION_FAILED, http: 403, condition: "Handoff blocked because the order's AgeCheck outcome is FAIL" }
  - { id: ERR_COLD_CHAIN_EXPIRED, http: 409, condition: "Handoff after staged_at + store.cold_chain_hold_minutes for a cold-chain order" }
  - { id: ERR_PAYMENT_NOT_CAPTURED, http: 409, condition: "Handoff attempted while payment_status != CAPTURED" }
  - { id: ERR_EBT_NOT_ACCEPTED, http: 409, condition: "Store ebt_enabled == false but order has final_ebt_eligible_cents > 0 at capture" }
  - { id: ERR_SUBSTITUTION_NOT_ALLOWED, http: 409, condition: "Substitution accept on a line whose substitution_policy is NO_SUBSTITUTION" }
  - { id: ERR_SUBSTITUTION_PRICE_EXCEEDED, http: 409, condition: "SAME_PRICE_OR_LESS line but substitute_line_cents > estimated_line_cents" }

# =============================================================================
# 1.7 RBAC Matrix
# =============================================================================
roles:
  - name: PlatformAdmin
    description: "Platform operator; provisions stores, customers, catalog, pickers, slots; sets the test clock"
    identity: "opaque"
    exclusive_operations:
      - "POST /v1/stores — create store"
      - "POST /v1/stores/{id}/close — close store"
      - "POST /v1/customers — create customer"
      - "POST /_clock/set_current_utc — set test clock"
    shared_operations:
      - "POST /v1/pickers, /v1/products, /v1/slots, /v1/products/{id}/discontinue, /v1/slots/{id}/close (shared with StoreOps)"
      - "GET on all resources"

  - name: StoreOps
    description: "Store back-office operator; manages catalog/slots/pickers, captures payment, performs age checks, hands off, may place/cancel"
    identity: "opaque"
    exclusive_operations:
      - "POST /v1/orders/{id}/capture — capture payment"
      - "POST /v1/orders/{id}/handoff — hand off order"
      - "POST /v1/age-checks — record age verification"
    shared_operations:
      - "POST /v1/pickers, /v1/products, /v1/slots, /v1/products/{id}/discontinue, /v1/slots/{id}/close (shared with PlatformAdmin)"
      - "POST /v1/orders — place order (shared with Customer)"
      - "POST /v1/order-lines — add line (shared with Customer)"
      - "POST /v1/orders/{id}/cancel — cancel order (shared with Customer)"
      - "GET on all resources"

  - name: Customer
    description: "Ordering customer; places own orders, edits cart, cancels own orders, decides substitutions on own orders"
    identity: "entity_backed:Customer"
    exclusive_operations: []
    shared_operations:
      - "POST /v1/orders — place order (X-User-ID must equal customer_id; shared with StoreOps)"
      - "POST /v1/order-lines — add line to own order (shared with StoreOps)"
      - "POST /v1/orders/{id}/cancel — cancel own order (shared with StoreOps)"
      - "POST /v1/substitutions/{id}/accept, /reject — decide substitution (shared with Picker)"
      - "GET on stores, customers, products, slots, own orders, lines, substitutions, payments, refunds, age-checks"

  - name: Picker
    description: "In-store picker; claims orders, picks/marks-out-of-stock lines, proposes and decides substitutions, stages orders"
    identity: "entity_backed:Picker"
    exclusive_operations:
      - "POST /v1/orders/{id}/claim — claim order (X-User-ID must equal a Picker.id of the order's store)"
      - "POST /v1/orders/{id}/stage — stage order"
      - "POST /v1/order-lines/{id}/pick — pick line"
      - "POST /v1/order-lines/{id}/out-of-stock — mark line out of stock"
      - "POST /v1/substitutions — propose substitution"
    shared_operations:
      - "POST /v1/substitutions/{id}/accept, /reject — decide substitution (shared with Customer)"
      - "GET on stores, products, pickers, orders, lines, substitutions"
