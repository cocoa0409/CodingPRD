          - state_machines.Inspection.IN_PROGRESS_to_RECONDITIONING_REQUIRED
          - validations[priority=16]
        distinguishing_aspect: |
          Three reconditioning items each cost 1001 cents at a 0.60 share, the one arrangement where
          rounding order is observable: round_half_up(600.6) == 601 per item summed to 1803, whereas
          summing first and rounding once gives round_half_up(1801.8) == 1802. The instance also pins
          the segregation-of-duties closer (a second technician), so the 1803 cannot be reached by the
          inspecting technician alone.
