              payload: { name: "Weld County", code: "WELDCO", jurisdiction_type: "COUNTY", postal_city: "GREELEY" }
              as: SystemAdmin
              as_user_id: "sysadmin-1"
              captures: { j2_id: $.data.id }
            - call: "POST /gis/coverage-cells"
              payload: { cell_code: "C001", jurisdiction_id: "${j1_id}" }
              as: GisAnalyst
              as_user_id: "analyst-1"
              captures: { cell1_id: $.data.id }
            - call: "POST /gis/coverage-cells"
              payload: { cell_code: "C900", jurisdiction_id: "${j2_id}" }
              as: GisAnalyst
              as_user_id: "analyst-1"
              captures: { cell2_id: $.data.id }
            - call: "POST /gis/agencies"
              payload: { name: "Larimer County Sheriff", agency_type: "LAW", jurisdiction_id: "${j1_id}" }
              as: SystemAdmin
              as_user_id: "sysadmin-1"
              captures: { ag_id: $.data.id }
            - call: "POST /gis/emergency-service-boundaries"
              payload: { agency_id: "${ag_id}", effective_start: "2026-08-01T00:00:00Z" }
              as: AgencyLiaison
              as_user_id: "${ag_id}"
              captures: { b_id: $.data.id, b_ver: $.data.version }
          trigger:
            - call: "POST /gis/emergency-service-boundaries/${b_id}/cell-assignments"
              payload: { cell_id: "${cell2_id}", effective_start: "2026-08-01T00:00:00Z", expected_boundary_version: "${b_ver}" }
              as: AgencyLiaison
              as_user_id: "${ag_id}"
              captures: { err_id: $.data.error_id }
            - call: "POST /gis/emergency-service-boundaries/${b_id}/cell-assignments"
              payload: { cell_id: "${cell1_id}", effective_start: "2026-08-01T00:00:00Z", expected_boundary_version: "${b_ver}" }
              as: AgencyLiaison
              as_user_id: "${ag_id}"
              captures: { asg_id: $.data.id }
          assert:
            - "the foreign-jurisdiction assignment returns status_code 422 with ${err_id} == \"ERR_BOUNDARY_WINDOW_INVALID\""
            - "the response is NOT 404 — CoverageCell.${cell2_id} exists"
            - "the same-jurisdiction assignment returns status_code 201 with BoundaryCellAssignment.${asg_id}.cell_id == \"${cell1_id}\""
            - "BoundaryCellAssignment.${asg_id}.effective_end == null   # open-ended, inherited from the boundary"
            - "EmergencyServiceBoundary.${b_id}.version == 2   # only the accepted write bumped it"
            - "Jurisdiction.${j2_id}.cell_count == 1 and Jurisdiction.${j1_id}.cell_count == 1"

      - name: report_scope_field_pair_must_match_the_declared_scope_rejected
        claim_type: violation_to_error
        grounds:
          - validations[priority=6]
          - errors.ERR_INVALID_REQUEST
          - endpoints["POST /gis/qc-validation-reports"]
        distinguishing_aspect: "The mutually-exclusive scope pair is a schema-level 400 ERR_INVALID_REQUEST, not a 422: scope ROAD with jurisdiction_id, scope JURISDICTION with road_centerline_id, and scope ROAD with neither id are all refused before any scan runs."
        test_recipe:
