            - { call: "POST /safety/hazards/${h_id}/assess", payload: { severity: 3, probability: 2 }, as: SafetyManager, as_user_id: "${a_id}" }
            - { call: "POST /safety/hazards/${h_id}/controls", payload: { description: "Enclosure", implementer_id: "${a_id}", due_date: "2026-06-20T00:00:00Z" }, as: SafetyManager, as_user_id: "${a_id}", captures: { c_id: $.data.id } }
            - { call: "POST /safety/controls/${c_id}/implement", payload: {}, as: Supervisor, as_user_id: "${a_id}" }
