  # ===========================================================================
  - section: errors
    instances:

      - name: pull_create_body_fks_checked_in_input_order
        claim_type: violation_to_error
        grounds:
          - validations[priority=4]
          - errors.ERR_RESEARCHER_NOT_FOUND
          - errors.ERR_COLLECTION_NOT_FOUND
        distinguishing_aspect: "On POST /records/pull-requests the body FKs are checked in declared input order — researcher_id before collection_id — so two unknown ids produce ERR_RESEARCHER_NOT_FOUND, and an unknown collection alone produces ERR_COLLECTION_NOT_FOUND."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. ACTIVE researcher Ada (no collections needed for the first probe); PUBLIC DESCRIBED C2 for the second."
          setup_api_calls:
            - *k_clock
            - *k_ag_doj
            - *k_sch_s2_create
            - *k_sch_s2_submit
            - *k_sch_s2_appraise
            - *k_sch_s2_decide
            - *k_tr_t2_create
            - *k_tr_t2_meta
            - *k_tr_t2_accession
            - *k_col_c2_begin
            - *k_col_c2_describe
            - *k_res_ada
            - *k_res_ada_act
          trigger:
            - call: "POST /records/pull-requests"
              payload: { researcher_id: "00000000-0000-4000-8000-0000000000aa", collection_id: "00000000-0000-4000-8000-0000000000bb", unit_start: 1, unit_end: 5, visit_date: "2026-09-10T00:00:00Z" }
              as: Researcher
              as_user_id: "00000000-0000-4000-8000-0000000000aa"
              captures: { err_nf1: $.data.error_id }
            - call: "POST /records/pull-requests"
              payload: { researcher_id: "${res_ada}", collection_id: "00000000-0000-4000-8000-0000000000bb", unit_start: 1, unit_end: 5, visit_date: "2026-09-10T00:00:00Z" }
              as: Researcher
              as_user_id: "${res_ada}"
              captures: { err_nf2: $.data.error_id }
          assert:
            - "err_nf1 == ERR_RESEARCHER_NOT_FOUND (404) — researcher_id is checked before collection_id"
            - "err_nf2 == ERR_COLLECTION_NOT_FOUND (404)"

      - name: review_and_referral_unknown_ids_return_entity_404s
        claim_type: violation_to_error
        grounds:
          - errors.ERR_REVIEW_NOT_FOUND
          - errors.ERR_REFERRAL_NOT_FOUND
        distinguishing_aspect: "The review and referral namespaces have their own 404s: GET on an unknown review id yields ERR_REVIEW_NOT_FOUND and on an unknown referral id ERR_REFERRAL_NOT_FOUND, never a shared generic code."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Empty database."
          setup_api_calls:
            - *k_clock
          trigger:
            - call: "GET /records/declass-reviews/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: DeclassReviewer
              as_user_id: "rev-1"
              captures: { err_nf3: $.data.error_id }
            - call: "GET /records/equity-referrals/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: DeclassReviewer
              as_user_id: "rev-1"
              captures: { err_nf4: $.data.error_id }
          assert:
            - "err_nf3 == ERR_REVIEW_NOT_FOUND (404)"
            - "err_nf4 == ERR_REFERRAL_NOT_FOUND (404)"

      - name: restriction_gate_covered_by_difficulty
        claim_type: violation_to_error
        grounds:
          - errors.ERR_COLLECTION_RESTRICTED
        excluded_because:
          difficulty_instance: cross_entity_state_dependency / pull_create_gated_by_collection_state
          rationale: "The posture gate is asserted on pull creation by the named difficulty instance, and against the fiscal gate by restriction_safety_beats_quota_fiscal."

      - name: referrals_outstanding_covered_by_difficulty
        claim_type: violation_to_error
        grounds:
          - errors.ERR_REFERRALS_OUTSTANDING
        excluded_because:
          difficulty_instance: cross_entity_state_dependency / review_complete_gated_by_referral_states
          rationale: "The completion gate on non-overdue SENT referrals is asserted by the named difficulty instance."

      - name: unit_conflict_and_capacity_covered_by_difficulty
        claim_type: violation_to_error
        grounds:
          - errors.ERR_UNIT_RESERVATION_CONFLICT
          - errors.ERR_READING_ROOM_CAPACITY
        excluded_because:
          difficulty_instance: resource_temporal_overlap / unit_range_pairwise_exclusion
          rationale: "Pairwise unit-range exclusion and aggregate seat capacity are asserted (both polarities) by the two resource_temporal_overlap difficulty instances."

      - name: daily_quota_and_age_gate_covered_by_difficulty
        claim_type: violation_to_error
        grounds:
          - errors.ERR_DAILY_PAGE_LIMIT_EXCEEDED
          - errors.ERR_SYSTEMATIC_REVIEW_PREMATURE
        excluded_because:
          difficulty_instance: boundary_precision_check / daily_page_quota_limit
          rationale: "Both boundary errors are asserted at exact threshold values by the two boundary_precision_check difficulty instances."

  # ===========================================================================
  - section: rbac
    instances:

      - name: researcher_cannot_accession_or_activate
        claim_type: RBAC denial
        grounds:
          - roles.Researcher.exclusive_operations
          - roles.ProcessingArchivist.exclusive_operations
          - roles.ResearchRoomStaff.exclusive_operations
          - errors.ERR_FORBIDDEN_ROLE
        distinguishing_aspect: "The Researcher role is confined to its own request surface: accession (ProcessingArchivist) and card activation (ResearchRoomStaff) both return 403 ERR_FORBIDDEN_ROLE to a researcher, regardless of which ids are supplied."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. VALIDATED transfer T2 under APPROVED S2; researcher Ada PENDING (self-registered, not yet activated)."
          setup_api_calls:
            - *k_clock
            - *k_ag_doj
            - *k_sch_s2_create
            - *k_sch_s2_submit
            - *k_sch_s2_appraise
            - *k_sch_s2_decide
            - *k_tr_t2_create
            - *k_tr_t2_meta
            - *k_res_ada
          trigger:
            - call: "POST /records/transfers/${tr_t2}/accession"
              payload: { receipt_note: "researcher attempting accession" }
              as: Researcher
              as_user_id: "${res_ada}"
              captures: { err_r1: $.data.error_id }
            - call: "POST /records/researchers/${res_ada}/activate"
              payload: {}
              as: Researcher
              as_user_id: "${res_ada}"
              captures: { err_r2: $.data.error_id }
          assert:
            - "err_r1 == ERR_FORBIDDEN_ROLE (403) — Researcher is not in the accession roles"
            - "err_r2 == ERR_FORBIDDEN_ROLE (403) — researchers cannot activate their own card"
            - "Transfer.${tr_t2}.status is still VALIDATED and ResearcherRegistration.${res_ada}.status is still PENDING"

      - name: foia_officer_cannot_decide_appeal
        claim_type: RBAC denial
        grounds:
          - roles.FoiaOfficer.exclusive_operations
          - roles.FoiaAppealsOfficer.exclusive_operations
          - errors.ERR_FORBIDDEN_ROLE
        distinguishing_aspect: "Role-level segregation precedes identity-level segregation: a FoiaOfficer (any user id) calling decide-appeal is 403 ERR_FORBIDDEN_ROLE because the role is not listed for the endpoint — distinct from the same-user ERR_SEGREGATION_OF_DUTIES check."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Classified C1; Ada's FOIA request DENIED by foia-1 and APPEALED."
          setup_api_calls:
            - *k_clock
            - *k_ag_doj
            - *k_sch_s1_create
            - *k_sch_s1_submit
            - *k_sch_s1_appraise
            - *k_sch_s1_decide
            - *k_tr_t1_create
            - *k_tr_t1_meta
            - *k_tr_t1_accession
            - *k_res_ada
            - *k_res_ada_act
            - call: "POST /records/foia-requests"
              payload: { researcher_id: "${res_ada}", collection_id: "${col_c1}", description_of_records: "role probe" }
              as: Researcher
              as_user_id: "${res_ada}"
              captures: { foia_rb: $.data.id }
            - call: "POST /records/foia-requests/${foia_rb}/adjudicate"
              payload: { decision: "DENY", claimed_exemptions: ["B1"] }
              as: FoiaOfficer
              as_user_id: "foia-1"
            - call: "POST /records/foia-requests/${foia_rb}/appeal"
              payload: { appeal_reason: "role boundary" }
              as: Researcher
              as_user_id: "${res_ada}"
          trigger:
            - call: "POST /records/foia-requests/${foia_rb}/decide-appeal"
              payload: { appeal_decision: "GRANT" }
              as: FoiaOfficer
              as_user_id: "foia-2"
              captures: { err_rb: $.data.error_id }
          assert:
            - "the response status is 403 and err_rb == ERR_FORBIDDEN_ROLE (FoiaOfficer role is not allowed on decide-appeal at all)"
            - "err_rb != ERR_SEGREGATION_OF_DUTIES (that check applies only once the FoiaAppealsOfficer role is correct)"
            - "FoiaRequest.${foia_rb}.status remains APPEALED"

      - name: anonymous_cannot_read_collections
        claim_type: RBAC denial
        grounds:
          - roles.Anonymous
          - errors.ERR_FORBIDDEN_ROLE
        distinguishing_aspect: "Anonymous is limited to researcher self-registration: even a plain GET on a collection is 403 ERR_FORBIDDEN_ROLE."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. PUBLIC collection C2 exists."
          setup_api_calls:
            - *k_clock
            - *k_ag_doj
            - *k_sch_s2_create
            - *k_sch_s2_submit
            - *k_sch_s2_appraise
            - *k_sch_s2_decide
            - *k_tr_t2_create
            - *k_tr_t2_meta
            - *k_tr_t2_accession
          trigger:
            - call: "GET /records/collections/${col_c2}"
              payload: {}
              as: Anonymous
              captures: { err_anon: $.data.error_id }
          assert:
            - "the response status is 403 and err_anon == ERR_FORBIDDEN_ROLE"

  # ===========================================================================
  - section: cross_cutting_layers
    instances:

      - name: occ_stale_collection_version_on_review_create
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[mdr-create-stale-collection]
          - errors.ERR_STALE_COLLECTION_VERSION
          - validations[priority=6b]
        distinguishing_aspect: "OCC on Collection.version: after a first review create bumped the version, a second create carrying the stale observed version is rejected 412 ERR_STALE_COLLECTION_VERSION — and because OCC (priority 6b) precedes the open-review uniqueness gate (priority 10), the stale error wins over ERR_REVIEW_ALREADY_OPEN."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Classified C1; Ada ACTIVE. Ada reads collection version V, then her first MDR create succeeds (bumping the collection version)."
          setup_api_calls:
            - *k_clock
            - *k_ag_doj
            - *k_sch_s1_create
            - *k_sch_s1_submit
            - *k_sch_s1_appraise
            - *k_sch_s1_decide
            - *k_tr_t1_create
            - *k_tr_t1_meta
            - *k_tr_t1_accession
            - *k_res_ada
            - *k_res_ada_act
            - call: "GET /records/collections/${col_c1}"
              payload: {}
              as: ProcessingArchivist
              as_user_id: "arch-pro-1"
              captures: { col_v_stale: $.data.version }
            - call: "POST /records/declass-reviews"
              payload: { collection_id: "${col_c1}", review_type: "MANDATORY", requester_researcher_id: "${res_ada}", justification: "first", expected_collection_version: "${col_v_stale}" }
              as: Researcher
              as_user_id: "${res_ada}"
              captures: { rev_occ: $.data.id }
          trigger:
            - call: "POST /records/declass-reviews"
              payload: { collection_id: "${col_c1}", review_type: "MANDATORY", requester_researcher_id: "${res_ada}", justification: "stale retry", expected_collection_version: "${col_v_stale}" }
              as: Researcher
              as_user_id: "${res_ada}"
              captures: { err_occ: $.data.error_id }
          assert:
            - "the first create returned 201 (${rev_occ} exists) and advanced Collection.${col_c1}.version past col_v_stale"
            - "the stale retry returns 412 and err_occ == ERR_STALE_COLLECTION_VERSION"
            - "err_occ != ERR_REVIEW_ALREADY_OPEN (OCC fires before the uniqueness gate)"
            - "GET /records/declass-reviews?collection_id=${col_c1} returns exactly 1 row"

      - name: late_return_suspension_cascade
        claim_type: cascading_side_effects
        grounds:
          - state_machines.PullRequest.PULLED_to_RETURNED
          - state_machines.ResearcherRegistration.ACTIVE_to_SUSPENDED
          - state_machines.PullRequest.REQUESTED_to_CANCELLED
          - state_machines.ReproductionRequest.QUOTED_to_CANCELLED
          - calculations.pull_due_back
        distinguishing_aspect: "A late return (returned_at strictly after due_back_at) suspends the researcher, and the suspension itself cancels their REQUESTED pulls and QUOTED reproductions; an on-the-due-timestamp return (strict >, boundary) triggers none of it."
        test_recipe:
          setup:
            - "Logical clock starts 2026-09-01T00:00:00Z. PUBLIC DESCRIBED C2. Dan: pull PULLED for visit 2026-09-01 (due_back_at 2026-09-02T00:00:00Z). Cid: pull PULLED for visit 2026-09-01 (same due), a second pull REQUESTED for 2026-09-05, and a QUOTED 10-page reproduction."
          setup_api_calls:
            - *k_clock
            - *k_ag_doj
            - *k_sch_s2_create
            - *k_sch_s2_submit
            - *k_sch_s2_appraise
            - *k_sch_s2_decide
            - *k_tr_t2_create
            - *k_tr_t2_meta
            - *k_tr_t2_accession
            - *k_col_c2_begin
            - *k_col_c2_describe
            - &k_res_dan
              call: "POST /records/researchers"
              payload: { full_name: "Dan Roots", email: "dan@example.org", affiliation: "GENEALOGIST", id_document: "PP-4004" }
              as: Anonymous
              captures: { res_dan: $.data.id }
            - &k_res_dan_act
              call: "POST /records/researchers/${res_dan}/activate"
              payload: {}
              as: ResearchRoomStaff
              as_user_id: "staff-1"
            - &k_res_cid
              call: "POST /records/researchers"
              payload: { full_name: "Cid Dealer", email: "cid@example.org", affiliation: "COMMERCIAL", id_document: "PP-3003" }
              as: Anonymous
              captures: { res_cid: $.data.id }
            - &k_res_cid_act
              call: "POST /records/researchers/${res_cid}/activate"
              payload: {}
              as: ResearchRoomStaff
              as_user_id: "staff-1"
            - call: "POST /records/pull-requests"
              payload: { researcher_id: "${res_dan}", collection_id: "${col_c2}", unit_start: 1, unit_end: 5, visit_date: "2026-09-01T00:00:00Z" }
              as: Researcher
              as_user_id: "${res_dan}"
              captures: { pull_dan: $.data.id }
            - call: "POST /records/pull-requests/${pull_dan}/fulfill"
              payload: {}
              as: ResearchRoomStaff
              as_user_id: "staff-1"
            - call: "POST /records/pull-requests"
              payload: { researcher_id: "${res_cid}", collection_id: "${col_c2}", unit_start: 6, unit_end: 10, visit_date: "2026-09-01T00:00:00Z" }
              as: Researcher
              as_user_id: "${res_cid}"
              captures: { pull_cid1: $.data.id }
            - call: "POST /records/pull-requests/${pull_cid1}/fulfill"
              payload: {}
              as: ResearchRoomStaff
              as_user_id: "staff-1"
            - call: "POST /records/pull-requests"
              payload: { researcher_id: "${res_cid}", collection_id: "${col_c2}", unit_start: 11, unit_end: 15, visit_date: "2026-09-05T00:00:00Z" }
              as: Researcher
              as_user_id: "${res_cid}"
              captures: { pull_cid2: $.data.id }
            - call: "POST /records/reproduction-requests"
              payload: { researcher_id: "${res_cid}", collection_id: "${col_c2}", page_count: 10, format: "DIGITAL_SCAN" }
              as: Researcher
              as_user_id: "${res_cid}"
              captures: { rr_cid: $.data.id }
          trigger:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-02T00:00:00Z" }
              as: PlatformAdmin
              as_user_id: "admin-1"
            - call: "POST /records/pull-requests/${pull_dan}/return"
              payload: {}
              as: ResearchRoomStaff
              as_user_id: "staff-1"
              captures: { dan_late: $.data.late_return }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-03T00:00:00Z" }
              as: PlatformAdmin
              as_user_id: "admin-1"
            - call: "POST /records/pull-requests/${pull_cid1}/return"
              payload: {}
              as: ResearchRoomStaff
              as_user_id: "staff-1"
              captures: { cid_late: $.data.late_return }
            - call: "POST /records/pull-requests"
              payload: { researcher_id: "${res_cid}", collection_id: "${col_c2}", unit_start: 16, unit_end: 20, visit_date: "2026-09-05T00:00:00Z" }
              as: Researcher
              as_user_id: "${res_cid}"
              captures: { err_cid_new: $.data.error_id }
          assert:
            - "dan_late == false (returned at exactly due_back_at — the boundary is strict) and ResearcherRegistration.${res_dan}.status == ACTIVE"
            - "cid_late == true and PullRequest.${pull_cid1}.status == RETURNED"
            - "ResearcherRegistration.${res_cid}.status == SUSPENDED and suspension_reason == LATE_RETURN"
            - "PullRequest.${pull_cid2}.status == CANCELLED (sibling pending pull cancelled by the suspension, not by the return itself)"
            - "ReproductionRequest.${rr_cid}.status == CANCELLED (QUOTED work cancelled, freeing its committed pages)"
            - "err_cid_new == ERR_RESEARCHER_NOT_ACTIVE (a suspended researcher cannot file new pulls)"

      - name: priority_recompute_on_demand_mutation
        claim_type: derived_field_reconciliation
        grounds:
          - calculations.digitization_priority
          - entities.Collection.fields.repro_pages_fulfilled
          - entities.Collection.fields.digitization_priority
        distinguishing_aspect: "While QUEUED, a demand-counter mutation recomputes the stored priority: fulfilling a 120-page reproduction raises repro_pages_fulfilled to 120 and the priority from 50 (age-only) to 52 (50 + floor(120/50))."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. PUBLIC DESCRIBED C2, cutoff 2001-03-15 (age 25), QUEUED for digitization with zero demand. ACTIVE JOURNALIST Bob."
          setup_api_calls:
            - *k_clock
            - *k_ag_doj
            - *k_sch_s2_create
            - *k_sch_s2_submit
            - *k_sch_s2_appraise
            - *k_sch_s2_decide
            - *k_tr_t2_create
            - *k_tr_t2_meta
            - *k_tr_t2_accession
            - *k_col_c2_begin
            - *k_col_c2_describe
            - *k_res_bob
            - *k_res_bob_act
            - call: "POST /records/collections/${col_c2}/enqueue-digitization"
              payload: {}
              as: ProcessingArchivist
              as_user_id: "arch-pro-1"
              captures: { prio_enq: $.data.digitization_priority }
            - call: "POST /records/reproduction-requests"
              payload: { researcher_id: "${res_bob}", collection_id: "${col_c2}", page_count: 120, format: "DIGITAL_SCAN" }
              as: Researcher
              as_user_id: "${res_bob}"
              captures: { rr_120b: $.data.id }
            - call: "POST /records/reproduction-requests/${rr_120b}/pay"
              payload: { payment_reference: "card-txn-120" }
              as: Researcher
              as_user_id: "${res_bob}"
          trigger:
            - call: "POST /records/reproduction-requests/${rr_120b}/fulfill"
              payload: {}
              as: ResearchRoomStaff
              as_user_id: "staff-1"
            - call: "GET /records/collections/${col_c2}"
              payload: {}
              as: ProcessingArchivist
              as_user_id: "arch-pro-1"
              captures: { prio_after: $.data.digitization_priority, pages_after: $.data.repro_pages_fulfilled }
          assert:
            - "prio_enq == 50 (2*min(25,50) age points, zero demand, no bonus)"
            - "after fulfill: pages_after == 120 and prio_after == 52 (50 + floor(min(120,500)/50))"
            - "ReproductionRequest.${rr_120b}.status == FULFILLED"

      - name: posture_flip_cascades_covered_by_difficulty
        claim_type: cascading_side_effects
        grounds:
          - calculations.restriction_posture
          - state_machines.FoiaRequest.RECEIVED_to_CLOSED
        excluded_because:
          difficulty_instance: transitive_cascade / presidential_release_posture_foia_cascade
          rationale: "Both originating triggers of the depth-3 posture-flip cascade (restriction release and declass completion) are asserted end-to-end by the two transitive_cascade difficulty instances."

      - name: compensating_invariants_covered_by_difficulty
        claim_type: compensating_invariant
        grounds:
          - calculations.daily_committed_pages
          - calculations.active_pull_count
        excluded_because:
          difficulty_instance: compensating_invariant / daily_committed_pages_conserved
          rationale: "Both conserved quantities (daily committed pages, active pull count) are asserted through their forward/compensating pairs by the two compensating_invariant difficulty instances."

      - name: priority_variants_covered_by_difficulty
        claim_type: dual_variant_calculation
        grounds:
          - calculations.digitization_priority
        excluded_because:
          difficulty_instance: dual_variant_calc / digitization_priority_weighting_divergence
          rationale: "The DEMAND_WEIGHTED vs AGE_WEIGHTED divergence is asserted by the named difficulty instance."

  # ===========================================================================
  - section: consistency_model
    instances:

      - name: immediate_visibility_after_accession
        claim_type: immediate
        grounds:
          - complexity_profile.consistency_model
          - endpoints.POST_/records/transfers/{id}/accession
        distinguishing_aspect: "Consistency is immediate: the collection created by the accession cascade is readable in the very next GET — by id and through the transfer_id filtered list — with every copied field already final."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. VALIDATED transfer T1 under APPROVED S1."
          setup_api_calls:
            - *k_clock
            - *k_ag_doj
            - *k_sch_s1_create
            - *k_sch_s1_submit
            - *k_sch_s1_appraise
            - *k_sch_s1_decide
            - *k_tr_t1_create
            - *k_tr_t1_meta
          trigger:
            - *k_tr_t1_accession
            - call: "GET /records/collections/${col_c1}"
              payload: {}
              as: ProcessingArchivist
              as_user_id: "arch-pro-1"
              captures: { got_col: $.data.processing_status }
          assert:
            - "the accession response itself carries collection_id ${col_c1} (cascade visible in the same response)"
            - "the immediate GET returns 200 with processing_status UNPROCESSED, units_total 50, classification_level SECRET"
            - "GET /records/collections?transfer_id=${tr_t1} returns exactly 1 row in the same clock instant"

  # ===========================================================================
  - section: state_machines
    instances:
      - name: foia_remand_cycle_covered_by_difficulty
        claim_type: Valid Transition
        grounds:
          - state_machines.FoiaRequest.APPEALED_to_IN_REVIEW
        excluded_because:
          difficulty_instance: non_linear_state_machine / foia_appeal_remand_cycle
          rationale: "The DENIED -> APPEALED -> IN_REVIEW remand loop and remand_count are asserted by the named difficulty instance."
      - name: schedule_resubmit_cycle_covered_by_difficulty
        claim_type: Valid Transition
        grounds:
          - state_machines.RecordsSchedule.RETURNED_to_SUBMITTED
        excluded_because:
          difficulty_instance: non_linear_state_machine / schedule_return_resubmit_cycle
          rationale: "The APPRAISED -> RETURNED -> SUBMITTED revision loop with field clearing is asserted by the named difficulty instance."

  # ===========================================================================
  - section: validations
    instances:

      - name: missing_auth_headers_return_400
        claim_type: Violation → Error
        grounds:
          - validations[priority=1]
          - errors.ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER
        distinguishing_aspect: "Authentication precedes everything: a request without X-User-ID/X-User-Role headers is 400 ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER even on a harmless GET, before any role or existence check."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. One agency registered."
          setup_api_calls:
            - *k_clock
            - *k_ag_doj
          trigger:
            - call: "GET /records/agencies/${ag_doj}"
              payload: {}
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { err_auth: $.data.error_id }
          assert:
            - "when the trigger is sent WITHOUT the X-User-ID and X-User-Role headers, the response status is 400 and err_auth == ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER"
            - "the same GET with valid headers returns 200"

      - name: presidential_guard_rails
        claim_type: Violation → Error
        grounds:
          - errors.ERR_NOT_PRESIDENTIAL_RECORDS
          - errors.ERR_REPRESENTATIVE_REQUIRED
          - errors.ERR_RESTRICTION_NOT_NOTIFIED
        distinguishing_aspect: "The presidential workflow's guard rails fire in order: restrictions attach only to PRESIDENTIAL-domain collections (ERR_NOT_PRESIDENTIAL_RECORDS on a FEDERAL one), notify requires a designated representative (ERR_REPRESENTATIVE_REQUIRED), and release before notification is ERR_RESTRICTION_NOT_NOTIFIED."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. FEDERAL collection C2 and PRESIDENTIAL collection C3, both accessioned; a P6 restriction IMPOSED on C3 with no representative yet."
          setup_api_calls:
            - *k_clock
            - *k_ag_doj
            - *k_sch_s2_create
            - *k_sch_s2_submit
            - *k_sch_s2_appraise
            - *k_sch_s2_decide
            - *k_tr_t2_create
            - *k_tr_t2_meta
            - *k_tr_t2_accession
            - *k_sch_s3_create
            - *k_sch_s3_submit
            - *k_sch_s3_appraise
            - *k_sch_s3_decide
            - *k_tr_t3_create
            - *k_tr_t3_meta
            - *k_tr_t3_accession
            - call: "POST /records/presidential-restrictions"
              payload: { collection_id: "${col_c3}", category: "P6_PERSONAL_PRIVACY" }
              as: ChiefArchivist
              as_user_id: "arch-chief-1"
              captures: { restr_p6: $.data.id }
          trigger:
            - call: "POST /records/presidential-restrictions"
              payload: { collection_id: "${col_c2}", category: "P3_STATUTORY" }
              as: ChiefArchivist
              as_user_id: "arch-chief-1"
              captures: { err_np: $.data.error_id }
            - call: "POST /records/presidential-restrictions/${restr_p6}/notify"
              payload: {}
              as: ChiefArchivist
              as_user_id: "arch-chief-1"
              captures: { err_rep: $.data.error_id }
            - call: "POST /records/presidential-restrictions/${restr_p6}/release"
              payload: {}
              as: ChiefArchivist
              as_user_id: "arch-chief-1"
              captures: { err_rel: $.data.error_id }
          assert:
            - "err_np == ERR_NOT_PRESIDENTIAL_RECORDS (409) — C2 is FEDERAL-domain"
            - "err_rep == ERR_REPRESENTATIVE_REQUIRED (409) — notify before designate"
            - "err_rel == ERR_RESTRICTION_NOT_NOTIFIED (409) — release from IMPOSED"
            - "PresidentialRestriction.${restr_p6}.status remains IMPOSED and GET /records/presidential-restrictions?collection_id=${col_c2} returns 0 rows"

  # ===========================================================================
  - section: state_machines
    instances:

      - name: second_order_state_guards
        claim_type: Precondition Enforcement
        grounds:
          - errors.ERR_PULL_NOT_FULFILLABLE
          - errors.ERR_REPRO_NOT_CANCELLABLE
          - errors.ERR_DIGITIZATION_NOT_QUEUED
          - errors.ERR_DIGITIZATION_NOT_READY
        distinguishing_aspect: "Second-order state guards: fulfill is only valid from REQUESTED (a second fulfill fails), cancel only from QUOTED (cancelling a PAID request fails), complete-digitization only from QUEUED, and publish-digital requires DIGITIZED (a QUEUED collection is not enough)."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. PUBLIC DESCRIBED C2; ACTIVE Bob; one pull PULLED; one reproduction PAID; C2 not yet enqueued."
          setup_api_calls:
            - *k_clock
            - *k_ag_doj
            - *k_sch_s2_create
            - *k_sch_s2_submit
            - *k_sch_s2_appraise
            - *k_sch_s2_decide
            - *k_tr_t2_create
            - *k_tr_t2_meta
            - *k_tr_t2_accession
            - *k_col_c2_begin
            - *k_col_c2_describe
            - *k_res_bob
            - *k_res_bob_act
            - call: "POST /records/pull-requests"
              payload: { researcher_id: "${res_bob}", collection_id: "${col_c2}", unit_start: 1, unit_end: 5, visit_date: "2026-09-10T00:00:00Z" }
              as: Researcher
              as_user_id: "${res_bob}"
              captures: { pull_sg: $.data.id }
            - call: "POST /records/pull-requests/${pull_sg}/fulfill"
              payload: {}
              as: ResearchRoomStaff
              as_user_id: "staff-1"
            - call: "POST /records/reproduction-requests"
              payload: { researcher_id: "${res_bob}", collection_id: "${col_c2}", page_count: 10, format: "PHOTOPRINT" }
              as: Researcher
              as_user_id: "${res_bob}"
              captures: { rr_sg: $.data.id }
            - call: "POST /records/reproduction-requests/${rr_sg}/pay"
              payload: { payment_reference: "card-txn-sg" }
              as: Researcher
              as_user_id: "${res_bob}"
          trigger:
            - call: "POST /records/pull-requests/${pull_sg}/fulfill"
              payload: {}
              as: ResearchRoomStaff
              as_user_id: "staff-1"
              captures: { err_ff: $.data.error_id }
            - call: "POST /records/reproduction-requests/${rr_sg}/cancel"
              payload: {}
              as: Researcher
              as_user_id: "${res_bob}"
              captures: { err_cc: $.data.error_id }
            - call: "POST /records/collections/${col_c2}/complete-digitization"
              payload: {}
              as: ProcessingArchivist
              as_user_id: "arch-pro-1"
              captures: { err_dd: $.data.error_id }
            - call: "POST /records/collections/${col_c2}/enqueue-digitization"
              payload: {}
              as: ProcessingArchivist
              as_user_id: "arch-pro-1"
            - call: "POST /records/collections/${col_c2}/publish-digital"
              payload: {}
              as: ChiefArchivist
              as_user_id: "arch-chief-1"
              captures: { err_pp: $.data.error_id }
          assert:
            - "err_ff == ERR_PULL_NOT_FULFILLABLE (fulfill from PULLED)"
            - "err_cc == ERR_REPRO_NOT_CANCELLABLE (cancel from PAID)"
            - "err_dd == ERR_DIGITIZATION_NOT_QUEUED (complete-digitization from NOT_REQUESTED)"
            - "err_pp == ERR_DIGITIZATION_NOT_READY (publish-digital while QUEUED but not DIGITIZED)"
            - "Collection.${col_c2}.processing_status remains DESCRIBED and digitization_status == QUEUED"

  # ===========================================================================
  - section: errors
    instances:

      - name: remaining_entity_404s
        claim_type: violation_to_error
        grounds:
          - errors.ERR_PULL_REQUEST_NOT_FOUND
          - errors.ERR_REPRODUCTION_NOT_FOUND
          - errors.ERR_RESTRICTION_NOT_FOUND
          - errors.ERR_FOIA_NOT_FOUND
          - errors.ERR_SCHEDULE_NOT_FOUND
        distinguishing_aspect: "Every entity namespace has its own 404: pull requests, reproduction requests, presidential restrictions, FOIA requests and schedules each return their entity-specific error id on an unknown UUID."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Empty database."
          setup_api_calls:
            - *k_clock
          trigger:
            - call: "GET /records/pull-requests/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: ResearchRoomStaff
              as_user_id: "staff-1"
              captures: { e1: $.data.error_id }
            - call: "GET /records/reproduction-requests/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: ResearchRoomStaff
              as_user_id: "staff-1"
              captures: { e2: $.data.error_id }
            - call: "GET /records/presidential-restrictions/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: ChiefArchivist
              as_user_id: "arch-chief-1"
              captures: { e3: $.data.error_id }
            - call: "GET /records/foia-requests/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: FoiaOfficer
              as_user_id: "foia-1"
              captures: { e4: $.data.error_id }
            - call: "GET /records/schedules/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: RecordsOfficer
              as_user_id: "00000000-0000-4000-8000-0000000000aa"
              captures: { e5: $.data.error_id }
          assert:
            - "e1 == ERR_PULL_REQUEST_NOT_FOUND and e2 == ERR_REPRODUCTION_NOT_FOUND"
            - "e3 == ERR_RESTRICTION_NOT_FOUND and e4 == ERR_FOIA_NOT_FOUND"
            - "e5 == ERR_SCHEDULE_NOT_FOUND"
            - "all five responses are 404"
