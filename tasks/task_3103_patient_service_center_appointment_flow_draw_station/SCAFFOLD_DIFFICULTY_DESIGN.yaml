              as: IntakeCoordinator
              captures: { o1: $.data.id }
            - call: "POST /psc/patients"
              payload: { full_name: "Dee Park", birth_date: "1991-02-08T00:00:00Z", mrn: "MRN-3103-S2" }
              as: IntakeCoordinator
              captures: { p2: $.data.id }
