  - rule_id: boundary_precision_check
    instances:
      - name: leak_test_drop_equals_allowance_passes
        grounds:
          - calculations.leak_test_acceptance
          - entities.PurgeLeakTest.fields.max_allowed_drop_psi
        distinguishing_aspect: |
          Numeric-threshold boundary: allowance = round_half_up(0.300 × 60 / 60, 3) = 0.300;
          observed drop EXACTLY 0.300 PASSES (rule is `>`, not `>=`), while the sibling cycle
          instance proves 0.301 FAILS. Metric: pressure drop (psi, 3-decimal).
        test_recipe:
          setup:
            - "application METER_WORK; MeterSet INSTALLED (full chain: loads→submit→confirm→extension 100ft/no-crossing zero-CIAC→approve→accept→crew confirm→schedule→complete→meter create/size/order/install)"
