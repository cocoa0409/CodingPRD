              call: "POST /rv-marketplace/bookings/${booking_id}/settlement/reverse"
              payload: { reversal_reason: "duplicate payout run detected by finance" }
              as: PlatformAdmin
          assert:
            - "response 200"
            - "the GET at setup step 'c_get_booking' (immediately after /start) returned data.trip_status == 'IN_TRIP' and data.settlement_status == 'HELD' — /start left the settlement dimension untouched"
            - "after /return the pair was ('RETURNED', 'RECONCILING'); after /settle it was ('CLOSED', 'SETTLED')"
            - "data.trip_status == 'CLOSED'"
            - "data.settlement_status == 'RECONCILING'"
            - "data.final_total_cents == 151876"
            - "data.balance_due_cents == 5813"

      - name: damage_claim_review_cycle_is_bounded_at_two_info_rounds
        grounds: >-
          §1.2 DamageClaim UNDER_REVIEW -> INFO_REQUESTED (precondition
          info_rounds_used < MAX_INFO_ROUNDS) and INFO_REQUESTED -> UNDER_REVIEW
          (side effect info_rounds_used += 1 and Booking.info_round_count += 1),
          with MAX_INFO_ROUNDS = 2 from §1.4 priority 32.
        distinguishing_aspect: >-
          Unlike the parallel-dimension instance, where the difficulty is that
          two states coexist, here the SAME state is re-entered and the machine
          must remember how many times. UNDER_REVIEW is visited three times and
          INFO_REQUESTED twice; the third request-info is rejected with
          ERR_INFO_ROUND_LIMIT_REACHED even though the claim sits in a legal
          from-state. An implementation that counts request-info calls rather
          than completed loops rejects the second request instead of the third,
          and one that stores no counter loops forever.
        test_recipe:
          setup: >-
            Canonical marketplace through RETURNED, then an owner damage claim on
            the EXTERIOR_REAR zone (which has a damage_flagged POST_TRIP photo and
            an unflagged PRE_TRIP photo, so the frozen verdict is NEW_DAMAGE), the
            adjuster opens it, and two full INFO_REQUESTED -> UNDER_REVIEW loops
            are completed.
          setup_api_calls:
            - *c_clock
            - *c_owner
            - *c_renter
            - *c_season_peak
            - *c_season_shoulder
            - *c_season_off
            - *c_plan_std
            - *c_policy_mod
            - *c_qual_dr
