              as: QAManager
              as_user_id: "qa-1"
          trigger:
            - call: "POST /cosmfg/batches/${bt}/release"
              as: QAManager
              as_user_id: "qa-2"
              captures: { e: $.data.error_id }
          assert:
            - "Release is rejected with error_id ERR_STUDY_FAILED_BLOCKS_RELEASE because StabilityStudy.${st} is COMPLETED_FAIL"

  # ===================================================================
  # Rule 8 — resource_temporal_overlap (3 instances, different interval semantics)
  # ===================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: line_window_half_open_adjacency
        grounds:
          - validations[priority=20]
          - errors[ERR_LINE_OCCUPIED]
          - calculations.changeover_minutes
        distinguishing_aspect: |
          Half-open interval semantics on FillingLine: a run starting exactly at the
          previous run's scheduled_end (10:00 == 10:00) does NOT intersect and is
          accepted (same formula => 0 changeover), while a one-minute-earlier start
          (09:59) intersects and is rejected with ERR_LINE_OCCUPIED.
        test_recipe:
          setup:
            - "ACTIVE formula; CONFIRMED order with PLANNED batches B1 and B2; line L with run1 occupying 2026-05-10T08:00Z-10:00Z"
          setup_api_calls:
            - call: "POST /cosmfg/customers"
              payload: { name: "Acme Beauty", tier: "STANDARD", minimum_run_units: 1000, credit_limit_cents: 100000000 }
              as: PlantDirector
              captures: { cust: $.data.id }
            - call: "POST /cosmfg/components"
              payload: { name: "Water", kind: "RAW_MATERIAL", supply_mode: "MANUFACTURER_SUPPLIED", standard_cost_per_kg_cents: 1000 }
              as: ProductionPlanner
              captures: { ca: $.data.id }
            - call: "POST /cosmfg/formulas"
              payload: { customer_id: "${cust}", name: "F", ownership: "CUSTOMER_OWNED", confidentiality: "STANDARD", product_class: "SKIN", allergen_flag: false, bulk_mass_per_unit_kg: 0.05, viscosity_target_cps: 4000, viscosity_tolerance_pct: 10, ph_target: 5.5, ph_tolerance: 0.5, ingredients: [{ inci_name: "AQUA", component_id: "${ca}", percentage: 100 }], required_components: [] }
              as: FormulationChemist
              captures: { fm: $.data.id }
            - call: "POST /cosmfg/formulas/${fm}/submit"
              as: FormulationChemist
            - call: "POST /cosmfg/formulas/${fm}/reviews"
              payload: { review_scope: "INCI_LIST" }
              as: FormulationChemist
              captures: { rv: $.data.id }
            - call: "POST /cosmfg/reviews/${rv}/claim"
              as: RegulatoryAffairs
            - call: "POST /cosmfg/reviews/${rv}/approve"
              as: RegulatoryAffairs
            - call: "POST /cosmfg/formulas/${fm}/activate"
              as: FormulationChemist
            - call: "POST /cosmfg/production-orders"
              payload: { formula_id: "${fm}", requested_units: 2000 }
              as: CustomerRep
              as_user_id: "${cust}"
              captures: { ord: $.data.id }
            - call: "POST /cosmfg/production-orders/${ord}/confirm"
              as: CustomerRep
              as_user_id: "${cust}"
            - call: "POST /cosmfg/production-orders/${ord}/batches"
              payload: { batch_size_kg: 50 }
              as: ProductionPlanner
              captures: { b1: $.data.id }
            - call: "POST /cosmfg/production-orders/${ord}/batches"
              payload: { batch_size_kg: 50 }
              as: ProductionPlanner
              captures: { b2: $.data.id }
            - call: "POST /cosmfg/filling-lines"
              payload: { line_code: "L1" }
              as: ProductionPlanner
              captures: { ln: $.data.id }
            - call: "POST /cosmfg/production-orders/${ord}/filling-runs"
              payload: { line_id: "${ln}", batch_id: "${b1}", scheduled_start: "2026-05-10T08:00:00Z", scheduled_end: "2026-05-10T10:00:00Z", planned_units: 1000 }
              as: ProductionPlanner
              captures: { rn1: $.data.id }
          trigger:
            - call: "POST /cosmfg/production-orders/${ord}/filling-runs"
              payload: { line_id: "${ln}", batch_id: "${b2}", scheduled_start: "2026-05-10T09:59:00Z", scheduled_end: "2026-05-10T11:00:00Z", planned_units: 1000 }
              as: ProductionPlanner
              captures: { e: $.data.error_id }
            - call: "POST /cosmfg/production-orders/${ord}/filling-runs"
              payload: { line_id: "${ln}", batch_id: "${b2}", scheduled_start: "2026-05-10T10:00:00Z", scheduled_end: "2026-05-10T11:00:00Z", planned_units: 1000 }
              as: ProductionPlanner
              captures: { rn2: $.data.id, rn2_req: $.data.changeover_minutes_required }
          assert:
            - "09:59 start rejected with error_id ERR_LINE_OCCUPIED (intersects [08:00, 10:00))"
            - "10:00 start accepted (half-open adjacency); FillingRun.${rn2}.changeover_minutes_required == 0 (same formula)"

      - name: chamber_aggregate_capacity
        grounds:
          - validations[priority=22]
          - errors[ERR_CHAMBER_CAPACITY_EXCEEDED]
          - entities.StabilityChamber.fields.active_study_count
        distinguishing_aspect: |
          Aggregate-capacity semantics on StabilityChamber (distinct from the line's
          exclusive half-open windows): overlapping studies are allowed while
          active_study_count < capacity_studies; the third concurrent study into a
          capacity-2 chamber is rejected until one study completes and frees a slot.
        test_recipe:
          setup:
            - "ACTIVE formula; chamber CH1 with capacity_studies 2; two IN_PROGRESS PRESERVATIVE_EFFICACY studies already occupy it"
          setup_api_calls:
