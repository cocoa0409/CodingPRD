              as: LibraryAdmin
              as_user_id: "${lib_id}"
            - call: "POST /lending/acquisition-orders/${orderc_id}/fulfill"
              payload: { invoiced_cost_cents: 170 }
              as: LibraryAdmin
              as_user_id: "${lib_id}"
          trigger:
            - call: "POST /lending/loans"
              payload: { patron_id: "${pat0_id}", title_id: "${titlec_id}" }
              as: Patron
              as_user_id: "${pat0_id}"
              captures: { loanc_id: $.data.id }
            - call: "POST /lending/loans"
              payload: { patron_id: "${pat1_id}", title_id: "${titlec_id}" }
              as: Patron
              as_user_id: "${pat1_id}"
              captures: { err: $.data.error_id }
          assert:
            - "the first checkout succeeds: Loan.${loanc_id}.circ_price_charged_cents == 170 (round_half_up(199 * 0.85))"
            - "License.balance_cents == 0 and License.status == ACTIVE (depletion does not flip the license mid-request)"
            - "the second checkout fails 422 with error_id == ERR_LICENSE_BALANCE_DEPLETED (0 < 170 — strictly-insufficient boundary)"
            - "BudgetFund.${fund_id}.cpc_accrued_cents == 170 after both attempts"

  # ===========================================================================
  - rule_id: cross_entity_state_dependency
    instances:

      - name: renew_blocked_by_other_patrons_hold
        grounds:
          - state_machines.Loan.ACTIVE_to_ACTIVE
          - errors.ERR_RENEWAL_BLOCKED_BY_HOLDS
        distinguishing_aspect: |
          Loan -> Hold pair: loan renewal legality depends on the Hold
          aggregate — with P1's PLACED hold on the title, P0's renewal fails
          with ERR_RENEWAL_BLOCKED_BY_HOLDS; after P1 cancels the hold, the
          identical renewal succeeds and adds exactly renewal_period_days.
        test_recipe:
          setup:
            - "Clock 2026-09-01T00:00:00Z. Library L (loan 21d, renewal 21d, max_renewals 2); title T; OCOU license copies 1; P0 has the ACTIVE loan (due 2026-09-22)."
            - "P1 places a hold on T (queue exists)."
          setup_api_calls:
            - *d_clock
            - *d_cons
            - *d_lib
            - *d_fund
            - *d_p0
            - *d_p1
            - *d_title
            - *d_order
            - *d_propose
            - *d_approve
            - *d_fulfill
            - *d_checkout0
            - call: "POST /lending/holds"
              payload: { patron_id: "${pat1_id}", title_id: "${title_id}" }
              as: Patron
              as_user_id: "${pat1_id}"
              captures: { h1_id: $.data.id }
            - call: "GET /lending/loans"
              payload: { patron_id: "${pat0_id}", status: "ACTIVE" }
              as: LibraryAdmin
              as_user_id: "${lib_id}"
              captures: { loan0_id: "$.data[0].id", loan0_due: "$.data[0].due_at" }
          trigger:
            - call: "POST /lending/loans/${loan0_id}/renew"
              payload: {}
              as: Patron
              as_user_id: "${pat0_id}"
              captures: { err: $.data.error_id }
            - call: "POST /lending/holds/${h1_id}/cancel"
              payload: {}
              as: Patron
              as_user_id: "${pat1_id}"
            - call: "POST /lending/loans/${loan0_id}/renew"
              payload: {}
              as: Patron
              as_user_id: "${pat0_id}"
          assert:
            - "the first renew fails 409 with error_id == ERR_RENEWAL_BLOCKED_BY_HOLDS"
            - "the second renew succeeds: Loan.${loan0_id}.renewals_used == 1"
            - "Loan.${loan0_id}.due_at advanced from 2026-09-22T00:00:00Z to 2026-10-13T00:00:00Z (additive from due date, +21 days)"

      - name: approve_blocked_by_closed_fund
        grounds:
          - state_machines.AcquisitionOrder.PROPOSED_to_APPROVED
          - state_machines.BudgetFund.OPEN_to_CLOSED
          - errors.ERR_FUND_CLOSED
        distinguishing_aspect: |
          AcquisitionOrder -> BudgetFund pair (different entity pair from
          Loan -> Hold): a PROPOSED order cannot be approved once its fund is
          CLOSED — ERR_FUND_CLOSED at 409 and the order stays PROPOSED.
        test_recipe:
          setup:
            - "Clock 2026-09-01T00:00:00Z. Library L, fund F, title T (price_ocou_cents 5000)."
            - "Order created (DRAFT), proposed (PROPOSED); no APPROVED orders on F, so F is then closed."
          setup_api_calls:
            - *d_clock
            - *d_cons
            - *d_lib
            - *d_fund
            - *d_title
            - *d_order
            - *d_propose
            - call: "POST /lending/budget-funds/${fund_id}/close"
              payload: {}
              as: LibraryAdmin
              as_user_id: "${lib_id}"
          trigger:
            - call: "POST /lending/acquisition-orders/${order_id}/approve"
              payload: {}
              as: LibraryAdmin
              as_user_id: "${lib_id}"
              captures: { err: $.data.error_id }
          assert:
            - "the response status is 409 and error_id == ERR_FUND_CLOSED"
            - "AcquisitionOrder.${order_id}.status == PROPOSED (unchanged)"
            - "BudgetFund.${fund_id}.committed_cents == 0"

  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:

      - name: ocou_copy_occupancy_until_due_boundary
        grounds:
          - calculations.license_copy_availability
          - state_machines.Loan.ACTIVE_to_EXPIRED
          - errors.ERR_NO_LICENSE_AVAILABLE
        distinguishing_aspect: |
          Half-open occupancy semantics on the License resource: a single OCOU
          copy occupied by a loan due 2026-09-22 rejects a second checkout one
          second before the due instant, while the epoch run AT the exact due
          instant (due_at <= now) frees the copy for an immediate re-checkout.
        test_recipe:
          setup:
            - "Clock 2026-09-01T00:00:00Z. Library L (loan 21d); title T; OCOU license copies 1; P0 checks out (due_at 2026-09-22T00:00:00Z)."
          setup_api_calls:
            - *d_clock
            - *d_cons
            - *d_lib
            - *d_fund
            - *d_p0
            - *d_p1
            - *d_title
            - *d_order
            - *d_propose
            - *d_approve
            - *d_fulfill
            - *d_checkout0
            - call: "GET /lending/loans"
              payload: { patron_id: "${pat0_id}", status: "ACTIVE" }
              as: LibraryAdmin
              as_user_id: "${lib_id}"
              captures: { loan0_id: "$.data[0].id" }
            - call: "POST /lending/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-21T23:59:59Z" }
              as: ConsortiumAdmin
          trigger:
            - call: "POST /lending/loans"
              payload: { patron_id: "${pat1_id}", title_id: "${title_id}" }
              as: Patron
              as_user_id: "${pat1_id}"
              captures: { err: $.data.error_id }
            - call: "POST /lending/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-22T00:00:00Z" }
              as: ConsortiumAdmin
            - call: "POST /lending/_ops/run_epoch"
              payload: {}
              as: ConsortiumAdmin
            - call: "POST /lending/loans"
              payload: { patron_id: "${pat1_id}", title_id: "${title_id}" }
              as: Patron
              as_user_id: "${pat1_id}"
              captures: { loan1_id: $.data.id }
          assert:
            - "the checkout one second before due_at fails 409 with error_id == ERR_NO_LICENSE_AVAILABLE (copy occupied)"
            - "Loan.${loan0_id}.status == EXPIRED after the epoch at the exact due instant (pinned rule: due_at <= now)"
            - "the checkout at the due instant succeeds: Loan.${loan1_id}.status == ACTIVE with checkout_at == 2026-09-22T00:00:00Z"

      - name: fund_period_half_open_overlap_vs_adjacency
        grounds:
          - entities.BudgetFund.fields.period_end
          - errors.ERR_FUND_PERIOD_OVERLAP
          - endpoints.POST_/lending/libraries/{id}/budget-funds
        distinguishing_aspect: |
          Half-open disjointness on the BudgetFund resource (different entity
          and different interval semantics from copy occupancy): a fund
          starting 2027-01-01 exactly at the existing fund's exclusive end is
          ADJACENT and accepted, while a fund starting one second earlier
          intersects and is rejected.
        test_recipe:
          setup:
            - "Clock 2026-09-01T00:00:00Z. Library L with fund F covering [2026-01-01, 2027-01-01)."
          setup_api_calls:
            - *d_clock
            - *d_cons
            - *d_lib
            - *d_fund
          trigger:
            - call: "POST /lending/libraries/${lib_id}/budget-funds"
              payload: { fiscal_year: 2027, period_start: "2026-12-31T23:59:59Z", period_end: "2028-01-01T00:00:00Z", budget_cents: 500000 }
              as: LibraryAdmin
              as_user_id: "${lib_id}"
              captures: { err: $.data.error_id }
            - call: "POST /lending/libraries/${lib_id}/budget-funds"
              payload: { fiscal_year: 2027, period_start: "2027-01-01T00:00:00Z", period_end: "2028-01-01T00:00:00Z", budget_cents: 500000 }
              as: LibraryAdmin
              as_user_id: "${lib_id}"
              captures: { fund27_id: $.data.id }
          assert:
            - "the overlapping fund fails 409 with error_id == ERR_FUND_PERIOD_OVERLAP"
            - "the adjacent fund (start == existing exclusive end) succeeds 201: BudgetFund.${fund27_id}.status == OPEN"
            - "adjacent fund version == 1"

  # ===========================================================================
  - rule_id: compensating_invariant
    instances:

      - name: approve_then_cancel_restores_available_committed
        grounds:
          - state_machines.AcquisitionOrder.PROPOSED_to_APPROVED
          - state_machines.AcquisitionOrder.APPROVED_to_CANCELLED
          - calculations.fund_availability
        distinguishing_aspect: |
          Conserved quantity: fund available_committed_cents. Approve commits
          +5000 (995000 available); the compensating cancel releases exactly
          5000 back (1000000) — the forward/compensating pair leaves the
          ledger invariant with zero drift.
        test_recipe:
          setup:
            - "Clock 2026-09-01T00:00:00Z. Library L, fund F (budget 1000000), title T (price_ocou_cents 5000)."
            - "Order created and proposed."
          setup_api_calls:
            - *d_clock
            - *d_cons
            - *d_lib
            - *d_fund
            - *d_title
            - *d_order
            - *d_propose
          trigger:
            - call: "POST /lending/acquisition-orders/${order_id}/approve"
              payload: {}
              as: LibraryAdmin
              as_user_id: "${lib_id}"
            - call: "GET /lending/budget-funds/${fund_id}"
              payload: {}
              as: LibraryAdmin
              as_user_id: "${lib_id}"
            - call: "POST /lending/acquisition-orders/${order_id}/cancel"
              payload: {}
              as: LibraryAdmin
              as_user_id: "${lib_id}"
            - call: "GET /lending/budget-funds/${fund_id}"
              payload: {}
              as: LibraryAdmin
              as_user_id: "${lib_id}"
          assert:
            - "after approve: committed_cents == 5000 and available_committed_cents == 995000"
            - "after cancel: committed_cents == 0 and available_committed_cents == 1000000 (invariant restored)"
            - "spent_cents == 0 throughout (cancel never touches the actuals ledger)"
            - "AcquisitionOrder.${order_id}.status == CANCELLED"

      - name: circ_checkout_then_grace_return_restores_circs
        grounds:
          - state_machines.Loan.ACTIVE_to_RETURNED
          - entities.License.fields.circs_consumed
        distinguishing_aspect: |
          Conserved quantity: METERED_CIRC circulation stock (different
          quantity from fund cents). A checkout consumes circ 26->25; a return
          within the 2-hour grace window restores it to 26 —
          circs_consumed + remaining == circs_total across the round trip;
          a return 3 hours later does NOT restore (contrast case).
        test_recipe:
          setup:
            - "Clock 2026-09-01T00:00:00Z. Library L; fund; title T (metered_circ_count 26); patrons P0, P1."
            - "METERED_CIRC license fulfilled (invoiced 3000), circs_total 26."
          setup_api_calls:
            - *d_clock
            - *d_cons
            - *d_lib
            - *d_fund
            - *d_p0
            - *d_p1
            - *d_title
            - call: "POST /lending/acquisition-orders"
              payload: { library_id: "${lib_id}", budget_fund_id: "${fund_id}", title_id: "${title_id}", model: "METERED_CIRC", expected_budget_fund_version: "${fund_v}" }
              as: LibraryAdmin
              as_user_id: "${lib_id}"
              captures: { ordermc_id: $.data.id }
            - call: "POST /lending/acquisition-orders/${ordermc_id}/propose"
              payload: {}
              as: LibraryAdmin
              as_user_id: "${lib_id}"
            - call: "POST /lending/acquisition-orders/${ordermc_id}/approve"
              payload: {}
              as: LibraryAdmin
              as_user_id: "${lib_id}"
            - call: "POST /lending/acquisition-orders/${ordermc_id}/fulfill"
              payload: { invoiced_cost_cents: 3000 }
              as: LibraryAdmin
              as_user_id: "${lib_id}"
            - call: "GET /lending/licenses"
              payload: { title_id: "${title_id}" }
              as: LibraryAdmin
              as_user_id: "${lib_id}"
              captures: { licmc_id: "$.data[0].id" }
          trigger:
            - call: "POST /lending/loans"
              payload: { patron_id: "${pat0_id}", title_id: "${title_id}" }
              as: Patron
              as_user_id: "${pat0_id}"
              captures: { loanm0_id: $.data.id }
            - call: "POST /lending/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T01:00:00Z" }
              as: ConsortiumAdmin
            - call: "POST /lending/loans/${loanm0_id}/return"
              payload: {}
              as: Patron
              as_user_id: "${pat0_id}"
            - call: "POST /lending/loans"
              payload: { patron_id: "${pat1_id}", title_id: "${title_id}" }
              as: Patron
              as_user_id: "${pat1_id}"
              captures: { loanm1_id: $.data.id }
            - call: "POST /lending/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T04:00:01Z" }
              as: ConsortiumAdmin
            - call: "POST /lending/loans/${loanm1_id}/return"
              payload: {}
              as: Patron
              as_user_id: "${pat1_id}"
            - call: "GET /lending/licenses/${licmc_id}"
              payload: {}
              as: LibraryAdmin
              as_user_id: "${lib_id}"
          assert:
            - "after the grace return (1 hour after checkout): circs_consumed == 0 — the conserved stock is fully restored"
            - "after the second checkout + late return (3h 1s later): circs_consumed == 1 — outside the grace window the circ stays consumed"
            - "invariant holds at every read: circs_consumed + (circs_total - circs_consumed) == 26"
            - "License.${licmc_id}.status == ACTIVE (26 > 1)"

