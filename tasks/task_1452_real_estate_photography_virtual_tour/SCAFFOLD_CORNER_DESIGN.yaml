  # ===========================================================================
  # Section 4 — validations
  # ===========================================================================
  - section: validations
    instances:
      - name: priority_state_over_temporal_already_covered
        claim_type: priority_ordering
        grounds:
          - validations[priority=4]
          - validations[priority=5]
        excluded_because:
          difficulty_instance: state_vs_business_temporal_on_reschedule
          rationale: "Dual-failure priority probe (state vs business_temporal) is the named §1.8 instance."

      - name: priority_safety_over_constraint_already_covered
        claim_type: priority_ordering
        grounds:
          - validations[priority=6]
          - validations[priority=7]
        excluded_because:
          difficulty_instance: business_safety_vs_business_constraint_on_assign
          rationale: "Dual-failure priority probe (business_safety vs business_constraint) is the named §1.8 instance."

      - name: auth_header_missing_rejected_before_everything
        claim_type: violation_to_error
        grounds:
          - validations[priority=1]
          - errors[ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER]
        distinguishing_aspect: "A request with no X-User-ID/X-User-Role headers is rejected with ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER even when the path id also does not exist (auth precedes existence)."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "GET /shoot-bookings/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2"
              payload: {}
              as: ""
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER (400), NOT ERR_NOT_FOUND"

      - name: role_checked_before_existence
        claim_type: priority_ordering
        grounds:
          - validations[priority=2]
          - validations[priority=3]
          - errors[ERR_UNAUTHORIZED_ROLE]
        distinguishing_aspect: "A Photographer calling an OpsAdmin-only endpoint on a NON-EXISTENT id gets ERR_UNAUTHORIZED_ROLE (403), not 404 — authorization outranks existence."
        test_recipe:
          setup: ["Market + photographer exist"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: OpsAdmin
            - call: "POST /markets"
              payload: { market_code: "DEN", display_name: "Denver", pricing_multiplier_bps: 10000, standard_turnaround_hours: 48 }
              as: OpsAdmin
              captures: { mkt: $.data.id }
            - call: "POST /photographers"
              payload: { market_id: "${mkt}", full_name: "Pat Photo", email: "pat@x.com", equipment_packages: ["STANDARD"] }
              as: OpsAdmin
              captures: { photog: $.data.id }
          trigger:
            - call: "PATCH /markets/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2"
              payload: { status: "SUSPENDED" }
              as: Photographer
              as_user_id: "${photog}"
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_UNAUTHORIZED_ROLE (403), NOT ERR_NOT_FOUND"

      - name: submit_inside_24h_slot_rejected
        claim_type: violation_to_error
        grounds:
          - validations[priority=5]
          - errors[ERR_SLOT_TOO_SOON]
        distinguishing_aspect: "Submitting a booking whose scheduled_start_utc is < now+24h fails with ERR_SLOT_TOO_SOON; exactly now+24h succeeds (>= boundary)."
        test_recipe:
          setup: ["Market DEN; agent A; two bookings: one at now+23h (2026-08-02T23:00:00Z from now 2026-08-01T00:00:00Z... use explicit: now=2026-08-01T12:00:00Z, booking B1 start 2026-08-02T11:00:00Z (23h ahead, too soon), B2 start 2026-08-02T12:00:00Z (exactly 24h ahead, allowed)"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T12:00:00Z" }
              as: OpsAdmin
            - call: "POST /markets"
