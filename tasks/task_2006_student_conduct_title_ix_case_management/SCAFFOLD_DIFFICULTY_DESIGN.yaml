            - { call: "POST /api/hearings/${hr_id}/convene", as: DecisionMaker, as_user_id: "${dm_id}" }
          trigger:
            - call: "POST /api/hearings/${hr_id}/cross-exam-questions"
              payload: { asked_by_advisor_id: "${advc_id}", target_side: "RESPONDENT", question_text: "Q one" }
              as: Advisor
              as_user_id: "${advc_id}"
              captures: { q1_id: $.data.id, q1_seq: $.data.sequence }
            - { call: "POST /api/hearings/${hr_id}/adjourn", payload: { adjourn_reason: "lunch recess" }, as: DecisionMaker, as_user_id: "${dm_id}" }
            - { call: "POST /api/hearings/${hr_id}/reconvene", as: DecisionMaker, as_user_id: "${dm_id}" }
            - call: "POST /api/hearings/${hr_id}/cross-exam-questions"
              payload: { asked_by_advisor_id: "${advr_id}", target_side: "COMPLAINANT", question_text: "Q two" }
              as: Advisor
              as_user_id: "${advr_id}"
              captures: { q2_id: $.data.id, q2_seq: $.data.sequence }
            - { call: "POST /api/hearings/${hr_id}/adjourn", payload: { adjourn_reason: "party ill" }, as: DecisionMaker, as_user_id: "${dm_id}" }
            - { call: "POST /api/hearings/${hr_id}/reconvene", as: DecisionMaker, as_user_id: "${dm_id}" }
          assert:
            - "two full ADJOURNED -> IN_SESSION laps completed; Hearing.${hr_id}.status == IN_SESSION"
            - "Hearing.${hr_id}.adjourn_reason is null after the second reconvene (cleared per lap)"
            - "CrossExamQuestion.${q1_id}.sequence == 1 and .${q2_id}.sequence == 2 - sequence accumulates across the cycle, never resets"

      - name: informal_resolution_withdrawal_cycle_then_resolve
        grounds:
          - state_machines.Case.INVESTIGATION_to_INFORMAL_RESOLUTION_IN_PROGRESS
          - state_machines.Case.INFORMAL_RESOLUTION_IN_PROGRESS_to_INVESTIGATION
          - state_machines.InformalResolution.PROPOSED_to_IN_PROGRESS
        distinguishing_aspect: |
          Third cyclic machine on a third entity: the case loops INVESTIGATION ->
          INFORMAL_RESOLUTION_IN_PROGRESS -> INVESTIGATION on withdrawal, then a SECOND InformalResolution
          entity reaches IN_PROGRESS via two-party consent fan-in and resolves the case to
          RESOLVED_INFORMAL - the cycle is re-enterable, not one-shot.
        test_recipe:
          setup:
            - "Case [SEXUAL_HARASSMENT] in INVESTIGATION with signed formal complaint; both parties STUDENTs (informal resolution permitted)"
          setup_api_calls:
            - { call: "POST /api/party-profiles", payload: { full_name: "Comp One", university_id: "U-C-1", role_type: "STUDENT", email: "c1@example.edu" }, as: CaseAdministrator, captures: { comp_id: $.data.id } }
            - { call: "POST /api/party-profiles", payload: { full_name: "Resp One", university_id: "U-R-1", role_type: "STUDENT", email: "r1@example.edu" }, as: CaseAdministrator, captures: { resp_id: $.data.id } }
            - { call: "POST /api/party-profiles", payload: { full_name: "Coord One", university_id: "U-CO-1", role_type: "STAFF", email: "co1@example.edu" }, as: CaseAdministrator, captures: { coord_id: $.data.id } }
            - { call: "POST /api/party-profiles", payload: { full_name: "Fac One", university_id: "U-FAC-1", role_type: "STAFF", email: "fac1@example.edu" }, as: CaseAdministrator, captures: { fac_id: $.data.id } }
            - call: "POST /api/cases"
              payload: { complainant_id: "${comp_id}", respondent_id: "${resp_id}", coordinator_id: "${coord_id}", categories: ["SEXUAL_HARASSMENT"], occurred_at: "2026-07-15T22:00:00Z", occurred_in_program_activity: true, occurred_in_united_states: true, received_via: "ONLINE_FORM" }
              as: TitleIXCoordinator
              as_user_id: "${coord_id}"
              captures: { case_id: $.data.id }
            - { call: "POST /api/cases/${case_id}/begin-jurisdiction-review", as: TitleIXCoordinator, as_user_id: "${coord_id}" }
            - { call: "POST /api/cases/${case_id}/confirm-jurisdiction", as: TitleIXCoordinator, as_user_id: "${coord_id}" }
            - { call: "POST /api/cases/${case_id}/file-formal-complaint", as: Party, as_user_id: "${comp_id}" }
            - call: "POST /api/cases/${case_id}/informal-resolutions"
              payload: { facilitator_id: "${fac_id}" }
              as: TitleIXCoordinator
              as_user_id: "${coord_id}"
              captures: { ir1_id: $.data.id }
            - { call: "POST /api/informal-resolutions/${ir1_id}/withdraw", as: Party, as_user_id: "${resp_id}" }
            - call: "POST /api/cases/${case_id}/informal-resolutions"
              payload: { facilitator_id: "${fac_id}" }
              as: TitleIXCoordinator
              as_user_id: "${coord_id}"
              captures: { ir2_id: $.data.id }
            - { call: "POST /api/informal-resolutions/${ir2_id}/consent", payload: { party_side: "COMPLAINANT", consent: true }, as: Party, as_user_id: "${comp_id}" }
          trigger:
            - { call: "POST /api/informal-resolutions/${ir2_id}/consent", payload: { party_side: "RESPONDENT", consent: true }, as: Party, as_user_id: "${resp_id}", captures: { ir2_status: $.data.status } }
            - { call: "POST /api/informal-resolutions/${ir2_id}/resolve", payload: { agreed_terms: "Mutual no-contact + counseling" }, as: TitleIXCoordinator, as_user_id: "${coord_id}" }
          assert:
            - "InformalResolution.${ir1_id}.status == WITHDRAWN with withdrawn_by_side == RESPONDENT, and Case returned to INVESTIGATION after the first loop"
            - "InformalResolution.${ir2_id} reaches IN_PROGRESS only after the SECOND consent (fan-in; single consent left it PROPOSED)"
            - "after resolve: InformalResolution.${ir2_id}.status == RESOLVED and Case.${case_id}.status == RESOLVED_INFORMAL with closed_at set"

  # ==========================================================================
  # Rule 4 - transitive_cascade (2 instances, different triggers, depth >= 3 and >= 2)
  # ==========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: appeal_remand_packet_supersede_item_rereview_cascade
        grounds:
          - state_machines.Appeal.UNDER_REVIEW_to_REMANDED
          - state_machines.Case.REMANDED_to_INVESTIGATION
          - state_machines.EvidencePacket.FINALIZED_to_SUPERSEDED
          - state_machines.EvidenceItem.ACCEPTED_to_UNDER_REVIEW
        distinguishing_aspect: |
          Depth-3 cascade from the appeal-decide trigger: decide(REMANDED) mutates Case -> REMANDED;
          the resume transition that REMANDED enables mutates the FINALIZED EvidencePacket -> SUPERSEDED;
          the packet supersession itself mutates each pinned ACCEPTED EvidenceItem -> UNDER_REVIEW.
          Each hop is caused by the previous link, not by the original appeal call.
        test_recipe:
          setup:
            - "Case [SEXUAL_ASSAULT] with ISSUED determination (SUSPENSION 120d, score 50 TIER_3), one ACCEPTED pinned evidence item; NEW_EVIDENCE appeal decided REMANDED/INVESTIGATION"
          setup_api_calls:
            - { call: "POST /api/party-profiles", payload: { full_name: "Comp One", university_id: "U-C-1", role_type: "STUDENT", email: "c1@example.edu" }, as: CaseAdministrator, captures: { comp_id: $.data.id } }
            - { call: "POST /api/party-profiles", payload: { full_name: "Resp One", university_id: "U-R-1", role_type: "STUDENT", email: "r1@example.edu" }, as: CaseAdministrator, captures: { resp_id: $.data.id } }
            - { call: "POST /api/party-profiles", payload: { full_name: "Coord One", university_id: "U-CO-1", role_type: "STAFF", email: "co1@example.edu" }, as: CaseAdministrator, captures: { coord_id: $.data.id } }
            - { call: "POST /api/party-profiles", payload: { full_name: "Inv One", university_id: "U-INV-1", role_type: "STAFF", email: "inv1@example.edu" }, as: CaseAdministrator, captures: { inv_id: $.data.id } }
            - { call: "POST /api/party-profiles", payload: { full_name: "DM One", university_id: "U-DM-1", role_type: "FACULTY", email: "dm1@example.edu" }, as: CaseAdministrator, captures: { dm_id: $.data.id } }
            - { call: "POST /api/party-profiles", payload: { full_name: "AO One", university_id: "U-AO-1", role_type: "STAFF", email: "ao1@example.edu" }, as: CaseAdministrator, captures: { ao_id: $.data.id } }
            - { call: "POST /api/party-profiles", payload: { full_name: "Adv C", university_id: "U-ADVC-1", role_type: "EXTERNAL", email: "advc@example.edu", advisor_eligible: true }, as: CaseAdministrator, captures: { advc_id: $.data.id } }
            - { call: "POST /api/party-profiles", payload: { full_name: "Adv R", university_id: "U-ADVR-1", role_type: "EXTERNAL", email: "advr@example.edu", advisor_eligible: true }, as: CaseAdministrator, captures: { advr_id: $.data.id } }
            - call: "POST /api/cases"
              payload: { complainant_id: "${comp_id}", respondent_id: "${resp_id}", coordinator_id: "${coord_id}", categories: ["SEXUAL_ASSAULT"], occurred_at: "2026-07-15T22:00:00Z", occurred_in_program_activity: true, occurred_in_united_states: true, received_via: "ONLINE_FORM" }
              as: TitleIXCoordinator
              as_user_id: "${coord_id}"
              captures: { case_id: $.data.id }
            - { call: "POST /api/cases/${case_id}/begin-jurisdiction-review", as: TitleIXCoordinator, as_user_id: "${coord_id}" }
            - { call: "POST /api/cases/${case_id}/confirm-jurisdiction", as: TitleIXCoordinator, as_user_id: "${coord_id}" }
            - { call: "POST /api/cases/${case_id}/file-formal-complaint", as: Party, as_user_id: "${comp_id}" }
            - call: "POST /api/cases/${case_id}/investigator-assignments"
