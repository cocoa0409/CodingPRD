              as: Scheduler
              captures: { roster_id: $.data.id }
            - call: "POST /anesthesia-ops/rosters/${roster_id}/publish"
              payload: {}
              as: Scheduler
            - call: "POST /anesthesia-ops/cases"
              payload: { roster_id: "${roster_id}", procedure_code: "P100", physical_status: "P1", scheduled_start_minute: 540, scheduled_end_minute: 660 }
              as: Scheduler
              captures: { k1_id: $.data.id, k1_ver: $.data.version }
            - call: "POST /anesthesia-ops/cases"
              payload: { roster_id: "${roster_id}", procedure_code: "P100", physical_status: "P1", scheduled_start_minute: 540, scheduled_end_minute: 660 }
              as: Scheduler
              captures: { k2_id: $.data.id, k2_ver: $.data.version }
            - call: "POST /anesthesia-ops/cases"
              payload: { roster_id: "${roster_id}", procedure_code: "P100", physical_status: "P1", scheduled_start_minute: 540, scheduled_end_minute: 660 }
              as: Scheduler
              captures: { k3_id: $.data.id, k3_ver: $.data.version }
            - call: "POST /anesthesia-ops/cases"
              payload: { roster_id: "${roster_id}", procedure_code: "P100", physical_status: "P1", scheduled_start_minute: 540, scheduled_end_minute: 660 }
              as: Scheduler
              captures: { k4_id: $.data.id, k4_ver: $.data.version }
            - call: "POST /anesthesia-ops/cases"
              payload: { roster_id: "${roster_id}", procedure_code: "P100", physical_status: "P1", scheduled_start_minute: 540, scheduled_end_minute: 660 }
              as: Scheduler
              captures: { k5_id: $.data.id, k5_ver: $.data.version }
          trigger:
            - call: "POST /anesthesia-ops/cases/${k1_id}/assignments"
              payload: { provider_id: "${d_id}", assignment_role: "CASE_DIRECTING", expected_case_version: "${k1_ver}" }
              as: Scheduler
            - call: "POST /anesthesia-ops/cases/${k2_id}/assignments"
              payload: { provider_id: "${d_id}", assignment_role: "CASE_DIRECTING", expected_case_version: "${k2_ver}" }
              as: Scheduler
            - call: "POST /anesthesia-ops/cases/${k3_id}/assignments"
              payload: { provider_id: "${d_id}", assignment_role: "CASE_DIRECTING", expected_case_version: "${k3_ver}" }
              as: Scheduler
            - call: "POST /anesthesia-ops/cases/${k4_id}/assignments"
