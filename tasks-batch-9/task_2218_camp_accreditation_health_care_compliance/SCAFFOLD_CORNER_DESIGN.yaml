      - name: controlled_ledger_conserves_units_and_rejects_overdraw_role_and_signature_violations
        claim_type: Correct Result
        grounds:
          - calculations.controlled_substance_ledger
          - validations[priority 36]
          - validations[priority 37]
          - validations[priority 38]
          - errors[ERR_MED_ROLE_NOT_PERMITTED]
          - errors[ERR_CONTROLLED_SECOND_SIGNATURE_REQUIRED]
          - errors[ERR_CONTROLLED_STOCK_INSUFFICIENT]
        distinguishing_aspect: "controlled_on_hand_units is intake minus RECORDED consumption, so the three rejected calls must leave it untouched at 13; the role, signature and stock rules also fire in their declared priority order when one request violates several at once."
        test_recipe:
          setup:
            - "one DAY camp staffed RN_ONSITE with 20 controlled units taken into stock"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
