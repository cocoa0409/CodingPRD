              as: ProgramAdministrator
            - call: "POST /amnesty/programs/${prog_id}/open"
              payload: {}
              as: ProgramAdministrator
            - call: "POST /amnesty/taxpayers"
              payload: { legal_name: "Kilnbrook Ceramics LLC", taxpayer_type: "BUSINESS", tin_last4: "9934" }
              as: ProgramAdministrator
              captures: { tp_id: $.data.id }
            - call: "POST /amnesty/agreements"
              payload: { program_id: "${prog_id}", taxpayer_id: "${tp_id}", tax_types: ["SALES_USE"], lookback_start_date: "2023-09-01", lookback_end_date: "2026-06-30" }
              as: DisclosureOfficer
              as_user_id: "officer-alpha"
              captures: { agr_id: $.data.id }
            - call: "POST /amnesty/agreements/${agr_id}/execute"
              payload: {}
              as: DisclosureOfficer
              as_user_id: "officer-beta"
            - call: "POST /amnesty/agreements/${agr_id}/returns"
              payload: { tax_type: "SALES_USE", period_start_date: "2025-01-01", period_end_date: "2025-03-31", original_due_date: "2025-10-27", reported_tax_cents: 1000000 }
              as: Taxpayer
              as_user_id: "${tp_id}"
              captures: { ret_q1_id: $.data.id }
            - call: "POST /amnesty/returns/${ret_q1_id}/file"
              payload: {}
              as: Taxpayer
              as_user_id: "${tp_id}"
            - call: "POST /amnesty/agreements/${agr_id}/returns"
              payload: { tax_type: "SALES_USE", period_start_date: "2025-04-01", period_end_date: "2025-06-30", original_due_date: "2025-10-27", reported_tax_cents: 500000 }
              as: Taxpayer
              as_user_id: "${tp_id}"
              captures: { ret_q2_id: $.data.id }
          trigger:
            - call: "GET /amnesty/agreements/${agr_id}"
              payload: {}
              as: ComplianceAuditor
            - call: "POST /amnesty/returns/${ret_q2_id}/file"
              payload: {}
              as: Taxpayer
              as_user_id: "${tp_id}"
            - call: "GET /amnesty/agreements/${agr_id}"
              payload: {}
              as: ComplianceAuditor
          assert:
            - "the first trigger reports gross_liability_cents == 1350000, waived_amount_cents == 300000 and total_due_cents == 1050000"
            - "before the second trigger DisclosureReturn.${ret_q2_id}.status == \"DRAFT\" with accrual_end_date == null, days_late == 0, gross_penalty_cents == 0, gross_interest_cents == 0 and balance_due_cents == 0"
            - "the third trigger reports gross_liability_cents == 2025000"
            - "the third trigger reports haircut_pct == 0.00 and effective_penalty_waiver_pct == 1.00"
            - "the third trigger reports waived_amount_cents == 450000 and total_due_cents == 1575000"
            - "DisclosureReturn.${ret_q2_id}.gross_penalty_cents == 125000"
            - "DisclosureReturn.${ret_q2_id}.gross_interest_cents == 50000"
            - "DisclosureReturn.${ret_q2_id}.waived_interest_cents == 25000"
            - "DisclosureReturn.${ret_q2_id}.balance_due_cents == 525000"
            - "DisclosureReturn.${ret_q1_id}.balance_due_cents == 1050000 (unchanged: the aggregate stayed below the first haircut threshold)"

      - name: waterfall_fills_earliest_installments_before_later_ones
        claim_type: waterfall_allocation
        grounds:
          - calculations.payment_waterfall_allocation
          - entities.Payment.fields.allocations
          - entities.Installment.fields.paid_cents
        distinguishing_aspect: |
          A 200000-cent remittance against 85909-cent installments fills installments 1
          and 2 completely and leaves the 28182-cent tail on installment 3 as paid_cents,
          NOT in unapplied credit: unapplied_delta_cents is 0 because an open installment
          still had room. Spreading the payment evenly, or parking the tail as credit,
          both fail.
        test_recipe:
          setup:
            - "Clock at 2026-09-15T00:00:00Z; OPEN program with installment_max_count 12 and one SALES_USE term"
            - "Taxpayer Fallow Lane holds an EXECUTED agreement with one FILED return and total_due_cents 1050000"
            - "A 105000-cent down payment was remitted and an 11-installment plan is ACTIVE, so installments 1..10 are 85909 cents and installment 11 is 85910 cents"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-15T00:00:00Z" }
              as: ProgramAdministrator
            - call: "POST /amnesty/programs"
              payload: { name: "FY27 Amnesty", window_open_at: "2026-09-01T00:00:00Z", window_close_at: "2026-12-01T00:00:00Z", lookback_months: 36, base_penalty_waiver_pct: 1.00, base_interest_waiver_pct: 0.50, post_program_penalty_multiplier: 2.00, revenue_forecast_cents: 100000000, installment_max_count: 12 }
              as: ProgramAdministrator
              captures: { prog_id: $.data.id }
            - call: "POST /amnesty/programs/${prog_id}/tax-type-terms"
              payload: { tax_type: "SALES_USE", eligible_period_start: "2020-01-01", eligible_period_end: "2026-07-01", min_liability_cents: 50000 }
              as: ProgramAdministrator
            - call: "POST /amnesty/programs/${prog_id}/open"
              payload: {}
              as: ProgramAdministrator
            - call: "POST /amnesty/taxpayers"
              payload: { legal_name: "Fallow Lane Provisions LLC", taxpayer_type: "BUSINESS", tin_last4: "3081" }
              as: ProgramAdministrator
              captures: { tp_id: $.data.id }
            - call: "POST /amnesty/agreements"
              payload: { program_id: "${prog_id}", taxpayer_id: "${tp_id}", tax_types: ["SALES_USE"], lookback_start_date: "2023-09-01", lookback_end_date: "2026-06-30" }
              as: DisclosureOfficer
              as_user_id: "officer-alpha"
              captures: { agr_id: $.data.id }
            - call: "POST /amnesty/agreements/${agr_id}/execute"
              payload: {}
              as: DisclosureOfficer
              as_user_id: "officer-beta"
            - call: "POST /amnesty/agreements/${agr_id}/returns"
              payload: { tax_type: "SALES_USE", period_start_date: "2025-01-01", period_end_date: "2025-03-31", original_due_date: "2025-10-27", reported_tax_cents: 1000000 }
              as: Taxpayer
              as_user_id: "${tp_id}"
              captures: { ret_id: $.data.id }
            - call: "POST /amnesty/returns/${ret_id}/file"
              payload: {}
              as: Taxpayer
              as_user_id: "${tp_id}"
            - call: "POST /amnesty/payments"
              payload: { agreement_id: "${agr_id}", amount_cents: 105000, payment_reference: "DOWN-1" }
              as: Taxpayer
              as_user_id: "${tp_id}"
            - call: "GET /amnesty/agreements/${agr_id}"
              payload: {}
              as: Taxpayer
              as_user_id: "${tp_id}"
              captures: { agr_v: $.data.version }
            - call: "POST /amnesty/payment-plans"
              payload: { agreement_id: "${agr_id}", expected_agreement_version: "${agr_v}", plan_type: "INSTALLMENT", installment_count: 11, down_payment_cents: 105000 }
              as: Taxpayer
              as_user_id: "${tp_id}"
              captures: { plan_id: $.data.id }
