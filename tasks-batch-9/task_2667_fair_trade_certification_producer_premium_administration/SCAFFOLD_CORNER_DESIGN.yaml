          - validations.priority_5
        distinguishing_aspect: "A node whose holder_id names no CertificateHolder is refused with 404 ERR_HOLDER_NOT_FOUND, and the same payload against a real holder succeeds, so the refusal is the parent check and nothing else."
        test_recipe:
          setup:
            - "logical clock at 2026-08-01T00:00:00Z"
            - "one CERTIFIED PRODUCER_ORG holder exists; the id 00000000-0000-4000-8000-000000000002 belongs to no holder"
          setup_api_calls:
            - call: "POST /fairtrade/_clock/set_current_utc"
