      - name: occ_stale_lounge_version_on_hold
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[hold-create-stale-lounge]", "errors[ERR_STALE_VERSION]"]
        distinguishing_aspect: "A second hold carrying the lounge version observed before a first hold advanced it is rejected ERR_STALE_VERSION (412)."
        test_recipe:
          setup: ["Lounge L read at version v0. One hold succeeds (advances L.version). A second hold still carrying v0 is rejected."]
          setup_api_calls:
            - call: "POST /membership-plans"
              payload: { tier: "PRESTIGE", included_visits_per_year: 10, included_guest_visits_per_year: 5, overage_charge_cents: 5000, guest_charge_cents: 2500, min_card_status: "BASIC", annual_fee_cents: 0 }
              as: NetworkAdmin
              captures: { plan_id: $.data.id }
