      - name: every_status_family_uses_the_same_error_envelope
        claim_type: error_envelope
        grounds:
          - "errors.ERR_INVALID_REQUEST"
          - "errors.ERR_ROBOT_NOT_FOUND"
          - "errors.ERR_INVALID_STATE_TRANSITION"
          - "errors.ERR_ORDINANCE_SPEED_EXCEEDED"
          - "response_envelope.error"
        distinguishing_aspect: >-
          The four status families that this API uses for rule failures - 400 for malformed input, 404 for
          unknown ids, 409 for state conflicts and 422 for satisfied-syntax business violations - are
          distinguishable only by status and error_id: the envelope, the response_type and the data keys are
          identical in all four, so an implementation that folds a business violation into 400 or that
          returns a 200 with an error body is falsified.
        test_recipe:
          setup:
            - "logical clock at 2026-08-03T09:00:00.000Z"
            - "ServiceZone Z1 is PERMITTED with segments S1, S2, S3, S5 APPROVED and Merchant M1 ACTIVE"
            - "ordinance_max_speed_cm_s is 160 and the zone permit is already active"
