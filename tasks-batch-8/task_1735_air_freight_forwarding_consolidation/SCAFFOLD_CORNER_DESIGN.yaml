      - name: customs_entry_rework_cycle_and_handoff_gate
        claim_type: guarded_transition
        grounds: ["state_machines.CustomsEntry.PREPARING_to_HANDED_OFF", "state_machines.CustomsEntry.REJECTED_to_PREPARING", "errors[ERR_HWB_NOT_CLEARED]"]
        distinguishing_aspect: "CustomsEntry is cyclic (FILED -> REJECTED -> PREPARING rework loop) and the PREPARING -> HANDED_OFF hop is guarded by the house waybill being past screening (ERR_HWB_NOT_CLEARED while the waybill is in SCREENING)."
        test_recipe:
          setup: ["Shipper ACME KNOWN; HWB-CU submitted (SCREENING, record PENDING); customs entry CE-1 created on the waybill"]
          setup_api_calls:
            - { call: "POST /air-freight/shippers", payload: { name: "Acme Exports", account_code: "ACME" }, as: ForwarderOps, captures: { sh1: "$.data.id" } }
            - { call: "POST /air-freight/shippers/${sh1}/verify-known-shipper", as: ComplianceOfficer }
            - { call: "POST /air-freight/house-waybills", payload: { shipper_id: "${sh1}", hwb_number: "HWB-CU", origin_code: "SFO", destination_code: "NRT", pieces: 3, gross_weight_kg: 25.0, declared_volume_m3: 0.12, dg_flag: false }, as: ForwarderOps, captures: { hw1: "$.data.id" } }
            - { call: "POST /air-freight/house-waybills/${hw1}/submit", as: ForwarderOps, as_user_id: "ops-1" }
            - { call: "GET /air-freight/house-waybills/${hw1}/screening-records", as: ForwarderOps, captures: { sr1: "$.data[0].id" } }
            - { call: "POST /air-freight/house-waybills/${hw1}/customs-entries", payload: { entry_type: "CONSUMPTION" }, as: ForwarderOps, captures: { ce1: "$.data.id" } }
          trigger:
            - { call: "POST /air-freight/customs-entries/${ce1}/transition", payload: { target_status: "HANDED_OFF" }, as: ForwarderOps, captures: { gate_err: "$.data.error_id" } }
            - { call: "POST /air-freight/screening-records/${sr1}/resolve", payload: { outcome: "CLEARED" }, as: ComplianceOfficer, as_user_id: "comp-1" }
            - { call: "POST /air-freight/customs-entries/${ce1}/transition", payload: { target_status: "HANDED_OFF" }, as: ForwarderOps }
            - { call: "POST /air-freight/customs-entries/${ce1}/transition", payload: { target_status: "FILED", broker_reference: "BRK-001" }, as: CustomsBroker }
            - { call: "POST /air-freight/customs-entries/${ce1}/transition", payload: { target_status: "REJECTED", rejection_reason: "HTS misclassification" }, as: CustomsBroker, captures: { st_rej: "$.data.status" } }
            - { call: "POST /air-freight/customs-entries/${ce1}/transition", payload: { target_status: "PREPARING" }, as: ForwarderOps, captures: { st_rw: "$.data.status" } }
            - { call: "POST /air-freight/customs-entries/${ce1}/transition", payload: { target_status: "HANDED_OFF" }, as: ForwarderOps }
            - { call: "POST /air-freight/customs-entries/${ce1}/transition", payload: { target_status: "FILED", broker_reference: "BRK-002" }, as: CustomsBroker }
            - { call: "POST /air-freight/customs-entries/${ce1}/transition", payload: { target_status: "RELEASED" }, as: CustomsBroker, captures: { st_fin: "$.data.status" } }
          assert:
            - "handoff while waybill in SCREENING: captured ${gate_err} == ERR_HWB_NOT_CLEARED (cross-entity guard)"
            - "after clearance the full cycle runs: HANDED_OFF -> FILED -> REJECTED (${st_rej}) -> PREPARING (${st_rw}) -> HANDED_OFF -> FILED -> RELEASED (${st_fin})"

