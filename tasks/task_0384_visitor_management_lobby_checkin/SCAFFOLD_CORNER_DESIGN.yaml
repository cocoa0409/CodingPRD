              as: SecurityOfficer
            - call: "POST /visits"
              payload: { site_id: "${site_id}", host_id: "${host_id}", floor_id: "${floor_id}", visitor_full_name: "Rev Visitor", visitor_company: "Acme Corp", scheduled_start: "2026-06-16T09:00:00Z", scheduled_end: "2026-06-16T11:00:00Z", id_scanned: true }
              as: LobbyAttendant
              captures: { visit_id: $.data.id }
            - call: "POST /visits/${visit_id}/screen"
              payload: {}
              as: LobbyAttendant
              captures: { visit_v0: $.data.version }
