scaffold_difficulty_design:

  # =========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: pro_rata_vs_tiered_award_diverge_on_payment
        grounds:
          - calculations.distribution_allocation
          - entities.Payment.fields.gross_amount_cents
          - entities.Settlement.fields.distribution_method
          - state_machines.DistributionBatch.DRAFT_to_COMPUTED
        distinguishing_aspect: |
          On the Payment/Claim award domain, the same three VALIDATED claims yield
          different per-claim gross_amount_cents under PRO_RATA (largest-remainder
          weighted by recognized_loss_cents -> 33332/33332/33336) than they would
          under TIERED (flat tier amounts), proving the two variants diverge on the
          Payment award metric.
        test_recipe:
          setup:
            - "A PRO_RATA settlement net_distributable_cents=100000 (gross 100000, fee 0, admin 0), DISTRIBUTING."
            - "Three PARTICIPATING members each with one VALIDATED claim, recognized_loss 10000/10000/10001, created A,B,C; all tin_on_file=true."
            - "One DRAFT DistributionBatch."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-01T00:00:00Z" }
              as: SettlementAdmin
            - call: "POST /settlements"
              payload: { case_caption: "In re Pro Rata", gross_fund_cents: 100000, attorney_fee_cents: 0, admin_cost_cents: 0, distribution_method: "PRO_RATA", claim_filing_deadline: "2026-02-01T00:00:00Z", objection_deadline: "2026-01-20T00:00:00Z", cy_pres_floor_cents: 0 }
              as: SettlementAdmin
              captures: { s_id: $.data.id }
            - call: "POST /settlements/${s_id}/open-notice"
              payload: {}
              as: SettlementAdmin
            - call: "POST /settlements/${s_id}/class-members"
              payload: { full_name: "A", email: "a@x.com", claimant_tier: "TIER_B", tin_on_file: true }
              as: ClaimsAdministrator
              captures: { ma_id: $.data.id }
            - call: "POST /settlements/${s_id}/class-members"
              payload: { full_name: "B", email: "b@x.com", claimant_tier: "TIER_B", tin_on_file: true }
              as: ClaimsAdministrator
              captures: { mb_id: $.data.id }
            - call: "POST /settlements/${s_id}/class-members"
              payload: { full_name: "C", email: "c@x.com", claimant_tier: "TIER_B", tin_on_file: true }
              as: ClaimsAdministrator
              captures: { mc_id: $.data.id }
            - call: "POST /settlements/${s_id}/open-claims"
              payload: {}
              as: SettlementAdmin
            - call: "POST /claims"
              payload: { settlement_id: "${s_id}", class_member_id: "${ma_id}", claimed_loss_cents: 10000 }
              as: ClaimsAdministrator
              captures: { ca_id: $.data.id }
            - call: "POST /claims"
              payload: { settlement_id: "${s_id}", class_member_id: "${mb_id}", claimed_loss_cents: 10000 }
              as: ClaimsAdministrator
              captures: { cb_id: $.data.id }
            - call: "POST /claims"
              payload: { settlement_id: "${s_id}", class_member_id: "${mc_id}", claimed_loss_cents: 10001 }
              as: ClaimsAdministrator
              captures: { cc_id: $.data.id }
            - call: "POST /claims/${ca_id}/validate"
              payload: { recognized_loss_cents: 10000 }
              as: ClaimsReviewer
            - call: "POST /claims/${cb_id}/validate"
              payload: { recognized_loss_cents: 10000 }
              as: ClaimsReviewer
            - call: "POST /claims/${cc_id}/validate"
              payload: { recognized_loss_cents: 10001 }
              as: ClaimsReviewer
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-02-01T00:00:00Z" }
              as: SettlementAdmin
            - call: "POST /settlements/${s_id}/close-claims"
              payload: {}
              as: SettlementAdmin
            - call: "POST /settlements/${s_id}/begin-distribution"
              payload: {}
              as: FundController
            - call: "POST /distribution-batches"
              payload: { settlement_id: "${s_id}", sequence_no: 1 }
              as: FundController
              captures: { batch_id: $.data.id }
          trigger:
            - call: "POST /distribution-batches/${batch_id}/compute"
              payload: {}
              as: FundController
          assert:
            - "GET /payments?claim_id=${ca_id} returns one Payment with gross_amount_cents == 33332"
            - "GET /payments?claim_id=${cb_id} returns one Payment with gross_amount_cents == 33332"
            - "GET /payments?claim_id=${cc_id} returns one Payment with gross_amount_cents == 33336"
            - "DistributionBatch.${batch_id}.planned_total_cents == 100000"

      - name: residual_sweep_vs_standing_diverge_on_settlement
        grounds:
          - calculations.cy_pres_sweep
          - calculations.fund_reconciliation_balance
          - entities.Settlement.fields.residual_cents
          - state_machines.Settlement.DISTRIBUTING_to_RECONCILED
        distinguishing_aspect: |
          On the Settlement fund domain (a different entity from the Payment award
          domain of the other instance), the same post-distribution residual of
          10000 cents is treated two valid ways: when residual < cy_pres_floor_cents
          it is swept to cy pres and Settlement.residual_cents becomes 0; when
          residual >= floor it stands and residual_cents stays 10000.
        test_recipe:
          setup:
            - "A TIERED settlement net_distributable_cents=560000 (gross 760000, fee 100000, admin 100000), cy_pres_floor_cents=20000, DISTRIBUTING."
            - "Two APPROVED cy pres recipients R1 6000bps, R2 4000bps (created R1,R2)."
            - "Three VALIDATED claims X(TIER_A),Y(TIER_B),Z(TIER_B) producing tiered grosses 250000/150000/150000, residual 10000 after a POSTED batch."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-01T00:00:00Z" }
              as: SettlementAdmin
            - call: "POST /settlements"
              payload: { case_caption: "In re Tiered Sweep", gross_fund_cents: 760000, attorney_fee_cents: 100000, admin_cost_cents: 100000, distribution_method: "TIERED", tier_a_amount_cents: 250000, tier_b_amount_cents: 150000, claim_filing_deadline: "2026-02-01T00:00:00Z", objection_deadline: "2026-01-20T00:00:00Z", cy_pres_floor_cents: 20000 }
              as: SettlementAdmin
              captures: { s_id: $.data.id }
            - call: "POST /settlements/${s_id}/cy-pres-designations"
              payload: { recipient_name: "R1", share_bps: 6000 }
              as: SettlementAdmin
              captures: { r1_id: $.data.id }
            - call: "POST /settlements/${s_id}/cy-pres-designations"
              payload: { recipient_name: "R2", share_bps: 4000 }
              as: SettlementAdmin
              captures: { r2_id: $.data.id }
            - call: "POST /cy-pres-designations/${r1_id}/approve"
              payload: {}
              as: Court
            - call: "POST /cy-pres-designations/${r2_id}/approve"
              payload: {}
              as: Court
            - call: "POST /settlements/${s_id}/open-notice"
              payload: {}
              as: SettlementAdmin
            - call: "POST /settlements/${s_id}/class-members"
              payload: { full_name: "X", email: "x@x.com", claimant_tier: "TIER_A", tin_on_file: true }
              as: ClaimsAdministrator
              captures: { mx_id: $.data.id }
            - call: "POST /settlements/${s_id}/class-members"
              payload: { full_name: "Y", email: "y@x.com", claimant_tier: "TIER_B", tin_on_file: true }
              as: ClaimsAdministrator
              captures: { my_id: $.data.id }
            - call: "POST /settlements/${s_id}/class-members"
              payload: { full_name: "Z", email: "z@x.com", claimant_tier: "TIER_B", tin_on_file: true }
              as: ClaimsAdministrator
              captures: { mz_id: $.data.id }
            - call: "POST /settlements/${s_id}/open-claims"
              payload: {}
              as: SettlementAdmin
            - call: "POST /claims"
              payload: { settlement_id: "${s_id}", class_member_id: "${mx_id}", claimed_loss_cents: 999999 }
              as: ClaimsAdministrator
              captures: { cx_id: $.data.id }
            - call: "POST /claims"
              payload: { settlement_id: "${s_id}", class_member_id: "${my_id}", claimed_loss_cents: 999999 }
              as: ClaimsAdministrator
              captures: { cy_id: $.data.id }
            - call: "POST /claims"
              payload: { settlement_id: "${s_id}", class_member_id: "${mz_id}", claimed_loss_cents: 999999 }
              as: ClaimsAdministrator
              captures: { cz_id: $.data.id }
            - call: "POST /claims/${cx_id}/validate"
              payload: { recognized_loss_cents: 999999 }
              as: ClaimsReviewer
            - call: "POST /claims/${cy_id}/validate"
              payload: { recognized_loss_cents: 999999 }
              as: ClaimsReviewer
            - call: "POST /claims/${cz_id}/validate"
              payload: { recognized_loss_cents: 999999 }
              as: ClaimsReviewer
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-02-01T00:00:00Z" }
              as: SettlementAdmin
            - call: "POST /settlements/${s_id}/close-claims"
              payload: {}
              as: SettlementAdmin
            - call: "POST /settlements/${s_id}/begin-distribution"
              payload: {}
              as: FundController
            - call: "POST /distribution-batches"
              payload: { settlement_id: "${s_id}", sequence_no: 1 }
              as: FundController
              captures: { batch_id: $.data.id }
            - call: "POST /distribution-batches/${batch_id}/compute"
              payload: {}
              as: FundController
            - call: "GET /settlements/${s_id}"
              payload: {}
              as: FundController
              captures: { s_ver_preposting: $.data.version }
            - call: "POST /distribution-batches/${batch_id}/post"
              payload: { expected_settlement_version: "${s_ver_preposting}" }
              as: FundController
          trigger:
            - call: "GET /settlements/${s_id}"
              payload: {}
              as: FundController
              captures: { s_ver: $.data.version }
            - call: "POST /settlements/${s_id}/reconcile"
              payload: { expected_settlement_version: "${s_ver}" }
              as: FundController
          assert:
            - "Settlement.${s_id}.residual_cents == 0 (10000 < floor 20000 so it is swept)"
            - "GET /settlements/${s_id}/cy-pres-designations: R1 funded_cents == 6000, R2 funded_cents == 4000, both status FUNDED"
            - "Settlement.${s_id}.status == RECONCILED"

  # =========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: pro_rata_largest_remainder_three_inputs_mode_a
        grounds:
          - calculations.distribution_allocation
          - entities.Claim.fields.recognized_loss_cents
          - entities.Payment.fields.gross_amount_cents
        distinguishing_aspect: |
          Mode (a): the pro-rata award is a >=3-input non-linear formula — three
          claims' recognized_loss weights interact through a shared denominator
          plus a conditional largest-remainder branch (floor then leftover by
          fractional-part DESC, created_at-ASC tie-break), so the single leftover
          cent lands on the highest-fraction claim C (33336) not split evenly.
        test_recipe:
          setup:
            - "Reuse the PRO_RATA net=100000 settlement with claims A,B,C recognized 10000/10000/10001, batch computed."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-01T00:00:00Z" }
              as: SettlementAdmin
            - call: "POST /settlements"
              payload: { case_caption: "In re LR", gross_fund_cents: 100000, attorney_fee_cents: 0, admin_cost_cents: 0, distribution_method: "PRO_RATA", claim_filing_deadline: "2026-02-01T00:00:00Z", objection_deadline: "2026-01-20T00:00:00Z", cy_pres_floor_cents: 0 }
              as: SettlementAdmin
              captures: { s_id: $.data.id }
            - call: "POST /settlements/${s_id}/open-notice"
              payload: {}
              as: SettlementAdmin
            - call: "POST /settlements/${s_id}/class-members"
              payload: { full_name: "A", email: "a@x.com", tin_on_file: true }
              as: ClaimsAdministrator
              captures: { ma_id: $.data.id }
            - call: "POST /settlements/${s_id}/class-members"
              payload: { full_name: "B", email: "b@x.com", tin_on_file: true }
              as: ClaimsAdministrator
              captures: { mb_id: $.data.id }
            - call: "POST /settlements/${s_id}/class-members"
              payload: { full_name: "C", email: "c@x.com", tin_on_file: true }
              as: ClaimsAdministrator
              captures: { mc_id: $.data.id }
            - call: "POST /settlements/${s_id}/open-claims"
              payload: {}
              as: SettlementAdmin
            - call: "POST /claims"
              payload: { settlement_id: "${s_id}", class_member_id: "${ma_id}", claimed_loss_cents: 10000 }
              as: ClaimsAdministrator
              captures: { ca_id: $.data.id }
            - call: "POST /claims"
              payload: { settlement_id: "${s_id}", class_member_id: "${mb_id}", claimed_loss_cents: 10000 }
              as: ClaimsAdministrator
              captures: { cb_id: $.data.id }
            - call: "POST /claims"
              payload: { settlement_id: "${s_id}", class_member_id: "${mc_id}", claimed_loss_cents: 10001 }
              as: ClaimsAdministrator
              captures: { cc_id: $.data.id }
            - call: "POST /claims/${ca_id}/validate"
              payload: { recognized_loss_cents: 10000 }
              as: ClaimsReviewer
            - call: "POST /claims/${cb_id}/validate"
              payload: { recognized_loss_cents: 10000 }
              as: ClaimsReviewer
            - call: "POST /claims/${cc_id}/validate"
              payload: { recognized_loss_cents: 10001 }
              as: ClaimsReviewer
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-02-01T00:00:00Z" }
              as: SettlementAdmin
            - call: "POST /settlements/${s_id}/close-claims"
              payload: {}
              as: SettlementAdmin
            - call: "POST /settlements/${s_id}/begin-distribution"
              payload: {}
              as: FundController
            - call: "POST /distribution-batches"
              payload: { settlement_id: "${s_id}", sequence_no: 1 }
              as: FundController
              captures: { batch_id: $.data.id }
          trigger:
            - call: "POST /distribution-batches/${batch_id}/compute"
              payload: {}
              as: FundController
          assert:
            - "GET /payments?claim_id=${cc_id} returns gross_amount_cents == 33336 (single leftover cent to highest fraction)"
            - "GET /payments?claim_id=${ca_id} returns gross_amount_cents == 33332"
            - "sum of all three payments' gross_amount_cents == 100000 (exact tiling)"

      - name: per_claim_withholding_round_then_net_mode_b
        grounds:
          - calculations.distribution_allocation
          - entities.Payment.fields.withholding_cents
          - entities.Payment.fields.amount_cents
        distinguishing_aspect: |
          Mode (b): backup withholding pins the rounding ORDER as floor-per-claim
          then net (withholding = floor(gross*2400/10000) computed on each claim's
          gross BEFORE the fund debit, not on the batch aggregate). For a single
          no-TIN claim with gross 80000 this yields withholding 19200 and net
          amount 60800; an aggregate-then-round reading would differ.
        test_recipe:
          setup:
            - "PRO_RATA settlement net=80000, single VALIDATED claim recognized 80000, claimant tin_on_file=false."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-01T00:00:00Z" }
              as: SettlementAdmin
            - call: "POST /settlements"
              payload: { case_caption: "In re Withhold", gross_fund_cents: 80000, attorney_fee_cents: 0, admin_cost_cents: 0, distribution_method: "PRO_RATA", claim_filing_deadline: "2026-02-01T00:00:00Z", objection_deadline: "2026-01-20T00:00:00Z", cy_pres_floor_cents: 0 }
              as: SettlementAdmin
              captures: { s_id: $.data.id }
            - call: "POST /settlements/${s_id}/open-notice"
              payload: {}
              as: SettlementAdmin
            - call: "POST /settlements/${s_id}/class-members"
              payload: { full_name: "NoTIN", email: "n@x.com", tin_on_file: false }
              as: ClaimsAdministrator
              captures: { m_id: $.data.id }
            - call: "POST /settlements/${s_id}/open-claims"
              payload: {}
              as: SettlementAdmin
            - call: "POST /claims"
              payload: { settlement_id: "${s_id}", class_member_id: "${m_id}", claimed_loss_cents: 80000 }
              as: ClaimsAdministrator
              captures: { c_id: $.data.id }
            - call: "POST /claims/${c_id}/validate"
              payload: { recognized_loss_cents: 80000 }
              as: ClaimsReviewer
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-02-01T00:00:00Z" }
              as: SettlementAdmin
            - call: "POST /settlements/${s_id}/close-claims"
              payload: {}
              as: SettlementAdmin
            - call: "POST /settlements/${s_id}/begin-distribution"
              payload: {}
              as: FundController
            - call: "POST /distribution-batches"
              payload: { settlement_id: "${s_id}", sequence_no: 1 }
              as: FundController
              captures: { batch_id: $.data.id }
          trigger:
            - call: "POST /distribution-batches/${batch_id}/compute"
              payload: {}
              as: FundController
          assert:
            - "GET /payments?claim_id=${c_id} returns gross_amount_cents == 80000"
            - "GET /payments?claim_id=${c_id} returns withholding_cents == 19200"
            - "GET /payments?claim_id=${c_id} returns amount_cents == 60800"

  # =========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: claim_cured_deficient_cured_revision_loop
        grounds:
          - state_machines.Claim.CURED_to_DEFICIENT
          - state_machines.Claim.DEFICIENT_to_CURED
          - state_machines.Claim.CURED_to_VALIDATED
        distinguishing_aspect: |
          The Claim machine is cyclic: a claim can travel SUBMITTED->DEFICIENT->
          CURED->DEFICIENT->CURED->VALIDATED, re-entering CURED twice. The second
          DEFICIENT is raised from CURED (not SUBMITTED) and fires no member
          transition, a distinct side-effect set from the first deficiency.
        test_recipe:
          setup:
            - "CLAIMS_OPEN settlement, one member with a SUBMITTED claim, clock 2026-01-05."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-05T00:00:00Z" }
              as: SettlementAdmin
            - call: "POST /settlements"
              payload: { case_caption: "In re Loop", gross_fund_cents: 100000, attorney_fee_cents: 0, admin_cost_cents: 0, distribution_method: "PRO_RATA", claim_filing_deadline: "2026-03-01T00:00:00Z", objection_deadline: "2026-02-01T00:00:00Z", cy_pres_floor_cents: 0 }
              as: SettlementAdmin
              captures: { s_id: $.data.id }
            - call: "POST /settlements/${s_id}/open-notice"
              payload: {}
              as: SettlementAdmin
            - call: "POST /settlements/${s_id}/class-members"
              payload: { full_name: "M", email: "m@x.com", tin_on_file: true }
              as: ClaimsAdministrator
              captures: { m_id: $.data.id }
            - call: "POST /settlements/${s_id}/open-claims"
              payload: {}
              as: SettlementAdmin
            - call: "POST /claims"
              payload: { settlement_id: "${s_id}", class_member_id: "${m_id}", claimed_loss_cents: 5000 }
              as: ClaimsAdministrator
              captures: { c_id: $.data.id }
            - call: "POST /claims/${c_id}/deficiencies"
              payload: { reason_code: "MISSING_PROOF", cure_deadline: "2026-02-15T00:00:00Z" }
              as: ClaimsReviewer
            - call: "POST /claims/${c_id}/cure"
              payload: {}
              as: Claimant
              as_user_id: "${m_id}"
            - call: "POST /claims/${c_id}/deficiencies"
              payload: { reason_code: "SIGNATURE_MISSING", cure_deadline: "2026-02-20T00:00:00Z" }
              as: ClaimsReviewer
          trigger:
            - call: "POST /claims/${c_id}/cure"
              payload: {}
              as: Claimant
              as_user_id: "${m_id}"
            - call: "POST /claims/${c_id}/validate"
              payload: { recognized_loss_cents: 5000 }
              as: ClaimsReviewer
          assert:
            - "Claim.${c_id}.status == VALIDATED"
            - "Claim.${c_id}.open_deficiency_count == 0"
            - "GET /claims/${c_id}/deficiencies returns two Deficiency rows both status CURED"

      - name: batch_computed_forks_post_vs_void
        grounds:
          - state_machines.DistributionBatch.COMPUTED_to_POSTED
          - state_machines.DistributionBatch.COMPUTED_to_VOID
          - state_machines.Payment.PLANNED_to_CANCELLED
        distinguishing_aspect: |
          The DistributionBatch machine branches at COMPUTED into POSTED (commits
          payments, debits the ledger, pays claims) versus VOID (cancels planned
          payments, no ledger impact) — divergent side-effect sets on a different
          entity than the Claim loop. This instance drives the VOID arm.
        test_recipe:
          setup:
            - "DISTRIBUTING PRO_RATA settlement net=50000, one VALIDATED claim, a COMPUTED batch with one PLANNED payment."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-01T00:00:00Z" }
              as: SettlementAdmin
            - call: "POST /settlements"
              payload: { case_caption: "In re Void", gross_fund_cents: 50000, attorney_fee_cents: 0, admin_cost_cents: 0, distribution_method: "PRO_RATA", claim_filing_deadline: "2026-02-01T00:00:00Z", objection_deadline: "2026-01-20T00:00:00Z", cy_pres_floor_cents: 0 }
              as: SettlementAdmin
              captures: { s_id: $.data.id }
            - call: "POST /settlements/${s_id}/open-notice"
              payload: {}
              as: SettlementAdmin
            - call: "POST /settlements/${s_id}/class-members"
              payload: { full_name: "M", email: "m@x.com", tin_on_file: true }
              as: ClaimsAdministrator
              captures: { m_id: $.data.id }
            - call: "POST /settlements/${s_id}/open-claims"
              payload: {}
              as: SettlementAdmin
            - call: "POST /claims"
              payload: { settlement_id: "${s_id}", class_member_id: "${m_id}", claimed_loss_cents: 50000 }
              as: ClaimsAdministrator
              captures: { c_id: $.data.id }
            - call: "POST /claims/${c_id}/validate"
              payload: { recognized_loss_cents: 50000 }
              as: ClaimsReviewer
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-02-01T00:00:00Z" }
              as: SettlementAdmin
            - call: "POST /settlements/${s_id}/close-claims"
              payload: {}
              as: SettlementAdmin
            - call: "POST /settlements/${s_id}/begin-distribution"
              payload: {}
              as: FundController
            - call: "POST /distribution-batches"
              payload: { settlement_id: "${s_id}", sequence_no: 1 }
              as: FundController
              captures: { batch_id: $.data.id }
            - call: "POST /distribution-batches/${batch_id}/compute"
              payload: {}
              as: FundController
          trigger:
            - call: "POST /distribution-batches/${batch_id}/void"
              payload: {}
              as: FundController
          assert:
            - "DistributionBatch.${batch_id}.status == VOID"
            - "GET /distribution-batches/${batch_id}/payments returns one Payment with status CANCELLED"
            - "Claim.${c_id}.status == VALIDATED (unchanged; no ledger debit fired)"
            - "Settlement.${s_id}.allocated_cents == 0"

  # =========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: close_claims_expire_deficiency_reject_claim_demote_member_depth3
        grounds:
          - state_machines.Settlement.CLAIMS_OPEN_to_CLAIMS_CLOSED
          - state_machines.Deficiency.OPEN_to_EXPIRED
          - state_machines.Claim.DEFICIENT_to_REJECTED
          - state_machines.ClassMember.PARTICIPATING_to_NOTIFIED
        distinguishing_aspect: |
          Depth-3 cascade from a SINGLE trigger (close-claims): close-claims
          expires an overdue OPEN Deficiency -> the expiry rejects its DEFICIENT
          Claim -> the rejection (the member's only non-REJECTED claim) demotes the
          ClassMember PARTICIPATING->NOTIFIED. Each hop is caused by the prior hop,
          not by close-claims directly.
        test_recipe:
          setup:
            - "CLAIMS_OPEN settlement, member with one DEFICIENT claim whose deficiency cure_deadline is already past, clock advanced past both cure and filing deadlines."
          setup_api_calls:
