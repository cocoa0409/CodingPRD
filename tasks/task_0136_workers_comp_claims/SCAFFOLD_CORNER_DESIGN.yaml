        distinguishing_aspect: "A second wage statement carrying the pre-first-write claim version is rejected ERR_STALE_CLAIM_VERSION (412); the first write advanced Claim.version."
        test_recipe:
          setup: ["A claim at version v0; one wage statement already filed (advancing the claim to v0+1)."]
          setup_api_calls:
            - call: "POST /employers"
              payload: { legal_name: "Occ Co", state_code: "CA" }
              as: PlatformAdmin
              captures: { emp_id: $.data.id }
