              as: TourManager
              captures: { cancelled_stop_id: "$.data.id" }
            - call: "POST /tour-stops/${cancelled_stop_id}/cancel"
              payload: { cancel_reason: "route change" }
              as: CorpsDirector
            - call: "POST /tour-stops/${show_stop_id}/confirm"
              payload: {}
              as: TourManager
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2027-06-22T09:00:00Z" }
              as: BusinessManager
            - call: "POST /tour-stops/${show_stop_id}/complete"
              payload: {}
              as: TourManager
            - call: "POST /show-settlements"
              payload: { tour_stop_id: "${show_stop_id}", appearance_fee_cents: 100000, prize_pool_cents: 500000, projected_placement: 3 }
              as: BusinessManager
              as_user_id: "bm-anna"
              captures: { settlement_id: "$.data.id" }
          trigger:
            - call: "POST /show-settlements/${settlement_id}/finalize"
              payload: { final_placement: 2, remittance_lines: [] }
              as: BusinessManager
              as_user_id: "bm-brett"
            - call: "GET /seasons/${season_id}"
              as: BusinessManager
              captures: { status_before_sweep: "$.data.ledger_status" }
            - call: "POST /seasons/${season_id}/run-billing-cycle"
              payload: {}
              as: BusinessManager
              as_user_id: "bm-anna"
          assert:
            - "the finalize returns 200: ShowSettlement.${settlement_id}.status == FINALIZED, final_prize_cents == 110000, final_gross_cents == 210000, final_circuit_fee_cents == 8400, final_net_cents == 201600"
            - "provisional figures are untouched by the finalize: provisional_prize_cents == 80000, provisional_gross_cents == 180000, provisional_circuit_fee_cents == 7200, provisional_net_cents == 172800, so variance_cents == 28800"
            - "TourStop.${show_stop_id}.settlement_state == SETTLED (bubbled up by the finalize) and Season.${season_id}.tour_revenue_cents == 201600"
            - "${status_before_sweep} == OPEN — finalizing does NOT reconcile the season"
            - "after the sweep Season.${season_id}.ledger_status == RECONCILED and billing_epoch == 1"

      - name: approving_a_staff_assignment_requires_a_cleared_screening
        claim_type: precondition_enforcement
        grounds:
          - state_machines.StaffAssignment.ACCEPTED_to_APPROVED.preconditions
          - validations.priority_36_ERR_SCREENING_NOT_CLEARED
          - entities.Volunteer.fields.assignment_count
        distinguishing_aspect: "The approval step is guarded by the OTHER entity's screening dimension: a volunteer still PENDING must be refused with ERR_SCREENING_NOT_CLEARED, the assignment must stay ACCEPTED, and assignment_count must stay 0 — then the same call succeeds once the screener clears the volunteer."
        test_recipe:
          setup:
            - "An unscreened COOK volunteer has accepted a shift on a PLANNED stop. The clock is at its 2026-08-01 default so a screening decided_on of 2026-08-01 is not future-dated."
          setup_api_calls:
            - call: "POST /seasons"
              payload: { name: "2027 Tour", year: 2027, tuition_base_cents: 399900, spring_training_start_date: "2027-05-10", spring_training_end_date: "2027-06-05", tour_departure_date: "2027-06-12" }
