    instances:
      - name: seat_capacity_exact_fill_vs_overflow
        grounds:
          - validations[priority=21]
          - entities.Departure.fields.seats_taken
          - entities.Departure.fields.seat_capacity
          - errors[ERR_SEAT_CAPACITY_EXCEEDED]
        distinguishing_aspect: |
          On a 12-seat van with seats_taken=6, a party_size=6 reserve fills to exactly 12 and succeeds
          (6+6 == 12, boundary equal), while a subsequent party_size=1 reserve (12+1 > 12) is rejected with
          ERR_SEAT_CAPACITY_EXCEEDED — the >= vs > boundary on the seat-pool metric, reached via reserve.
        test_recipe:
          setup:
