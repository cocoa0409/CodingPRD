      - name: reserve_exhausts_to_exactly_zero_and_one_cent_cure_boundary
        grounds:
          - calculations.interest_accrual_and_reserve_sweep
          - calculations.payment_waterfall
          - entities.Loan.fields.interest_reserve_balance_cents
          - entities.Loan.fields.accrued_interest_unpaid_cents
          - state_machines.Loan.payment_status.CURRENT_to_DELINQUENT
          - state_machines.Loan.payment_status.DELINQUENT_to_CURRENT
        distinguishing_aspect: |
          Three exact boundaries in one chain: the second accrual's 4,456 of interest is
          clamped by min() to the 4,123 that remains, taking the reserve to EXACTLY 0 (not
          negative) and creating exactly 333 of unpaid interest; 4,456 also proves the
          previous sweep capitalised into principal (4,201 on the pre-sweep principal);
          and a 332-cent payment leaves 1 cent unpaid so the loan stays DELINQUENT, while
          the next single cent cures it to CURRENT.
