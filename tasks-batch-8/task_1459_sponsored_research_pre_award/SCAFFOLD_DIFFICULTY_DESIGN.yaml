            - { call: "POST /pre-award/fa-rate-agreements", payload: { rate_type: "ON_CAMPUS_RESEARCH", rate_pct: 54.00, effective_start_on: "2026-01-01", effective_end_on: "2029-01-01" }, as: OSPDirector }
            - call: "POST /pre-award/proposals"
              payload: { opportunity_id: "${opp_id}", pi_id: "${pi_id}", title: "D1", activity_code: "RESEARCH_ON_CAMPUS", project_start_on: "2026-09-01", project_end_on: "2027-08-31", pi_effort_pct: 20.00, fa_base_type: "TDC" }
              as: PI
              as_user_id: "${pi_id}"
              captures: { prop_1: $.data.id }
            - { call: "POST /pre-award/proposals/${prop_1}/budget-lines", payload: { category: "PERSONNEL", description: "s", fiscal_year: 2027, amount_cents: 10000000, is_cost_share: false }, as: PreAwardAnalyst }
            - { call: "GET /pre-award/proposals/${prop_1}", payload: {}, as: OSPDirector, captures: { pv1: $.data.version } }
            - { call: "POST /pre-award/proposals/${prop_1}/budget-finalizations", payload: { expected_proposal_version: "${pv1}" }, as: PreAwardAnalyst }
            - { call: "POST /pre-award/proposals/${prop_1}/route", payload: {}, as: PreAwardAnalyst, as_user_id: "analyst-1" }
            - { call: "POST /pre-award/proposals/${prop_1}/approve-institutional", payload: {}, as: OSPDirector, as_user_id: "director-1" }
            - call: "POST /pre-award/proposals"
              payload: { opportunity_id: "${opp_id}", pi_id: "${pi_id}", title: "D2", activity_code: "RESEARCH_ON_CAMPUS", project_start_on: "2027-09-01", project_end_on: "2028-08-31", pi_effort_pct: 20.00, fa_base_type: "TDC" }
              as: PI
              as_user_id: "${pi_id}"
              captures: { prop_2: $.data.id }
            - { call: "POST /pre-award/proposals/${prop_2}/budget-lines", payload: { category: "PERSONNEL", description: "s", fiscal_year: 2028, amount_cents: 10000000, is_cost_share: false }, as: PreAwardAnalyst }
            - { call: "GET /pre-award/proposals/${prop_2}", payload: {}, as: OSPDirector, captures: { pv2: $.data.version } }
            - { call: "POST /pre-award/proposals/${prop_2}/budget-finalizations", payload: { expected_proposal_version: "${pv2}" }, as: PreAwardAnalyst }
            - { call: "POST /pre-award/proposals/${prop_2}/route", payload: {}, as: PreAwardAnalyst, as_user_id: "analyst-1" }
