            - "AccountApprover order submit: error_id == ERR_UNAUTHORIZED (captured ${err_2})"

      - name: rbac_missing_auth_headers_unauthenticated
        claim_type: role_exclusive_denial
        grounds:
          - validations[priority=1]
          - errors[ERR_UNAUTHENTICATED]
        distinguishing_aspect: "A request without a valid role header fails priority-1 authentication with 401 ERR_UNAUTHENTICATED before any role check (modeled as the Anonymous role, which no endpoint admits)."
        test_recipe:
          setup: ["catalog empty"]
          setup_api_calls: []
          trigger:
            - call: "GET /packaging-distribution/products"
              payload: {}
              as: Anonymous
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_UNAUTHENTICATED (captured ${err}) with HTTP 401"

  # ==================================================================
  # Section: cross_cutting_layers
  # ==================================================================
  - section: cross_cutting_layers
    instances:
      - name: occ_inventory_adjust_stale_version_rejected
        claim_type: occ_stale_version
        grounds:
          - concurrency_rules[inventory-adjust-stale-version]
          - errors[ERR_STALE_VERSION]
        distinguishing_aspect: "POST /inventory/{id}/adjust with expected_inventory_version one behind the current version (bumped by an intervening receive) -> 412 ERR_STALE_VERSION; re-reading and adjusting with the fresh version succeeds."
        test_recipe:
          setup: ["warehouse ATL; product; inventory on_hand 10 at version 1"]
          setup_api_calls:
            - call: "POST /packaging-distribution/warehouses"
              payload: { code: "ATL", name: "Atlanta DC", zone: 2, ship_cutoff_time: "15:00", timezone: "America/New_York" }
              as: PlatformAdmin
              captures: { wh_atl: $.data.id }
            - call: "POST /packaging-distribution/products"
              payload: { sku: "AA-1", name: "AA", category: "TAPE", base_price_cents: 100, uom: "EACH", case_qty: 1, pallet_qty: 10, weight_lbs_per_unit: 1, density_pcf: 20 }
              as: CatalogManager
              captures: { prod: $.data.id }
            - call: "POST /packaging-distribution/inventory"
              payload: { product_id: "${prod}", warehouse_id: "${wh_atl}", on_hand_qty: 10 }
              as: WarehouseOps
              captures: { inv: $.data.id, inv_v: $.data.version }
            - call: "POST /packaging-distribution/inventory/${inv}/receive"
              payload: { qty: 5 }
              as: WarehouseOps
          trigger:
            - call: "POST /packaging-distribution/inventory/${inv}/adjust"
              payload: { expected_inventory_version: "${inv_v}", delta_qty: 3, reason: "cycle count" }
              as: WarehouseOps
              captures: { err: $.data.error_id }
            - call: "GET /packaging-distribution/inventory/${inv}"
              payload: {}
              as: WarehouseOps
              captures: { inv_v2: $.data.version, onhand2: $.data.on_hand_qty }
            - call: "POST /packaging-distribution/inventory/${inv}/adjust"
              payload: { expected_inventory_version: "${inv_v2}", delta_qty: 3, reason: "cycle count" }
              as: WarehouseOps
              captures: { onhand3: $.data.on_hand_qty, inv_v3: $.data.version }
          assert:
            - "stale adjust (version ${inv_v} after receive bumped it): error_id == ERR_STALE_VERSION (captured ${err}), HTTP 412"
            - "on_hand stayed 15 after the rejected adjust (captured ${onhand2})"
            - "fresh adjust succeeds: on_hand_qty == 18, version == 3 (captured ${onhand3}, ${inv_v3})"

      - name: occ_product_update_stale_version_rejected
        claim_type: occ_stale_version
        grounds:
          - concurrency_rules[product-update-stale-version]
          - errors[ERR_STALE_VERSION]
        distinguishing_aspect: "PUT /products/{id} with expected_product_version stale by one (a prior PUT bumped it) -> 412 ERR_STALE_VERSION; the losing update's base_price_cents is not applied."
        test_recipe:
          setup: ["product base 1000 at version 1"]
          setup_api_calls:
            - call: "POST /packaging-distribution/products"
              payload: { sku: "AB-1", name: "AB", category: "TAPE", base_price_cents: 1000, uom: "EACH", case_qty: 1, pallet_qty: 10, weight_lbs_per_unit: 1, density_pcf: 20 }
              as: CatalogManager
              captures: { prod: $.data.id, prod_v: $.data.version }
            - call: "PUT /packaging-distribution/products/${prod}"
              payload: { expected_product_version: "${prod_v}", base_price_cents: 1100 }
              as: CatalogManager
              captures: { prod_v2: $.data.version }
          trigger:
            - call: "PUT /packaging-distribution/products/${prod}"
              payload: { expected_product_version: "${prod_v}", base_price_cents: 1200 }
              as: CatalogManager
              captures: { err: $.data.error_id }
            - call: "GET /packaging-distribution/products/${prod}"
              payload: {}
              as: CatalogManager
              captures: { price_end: $.data.base_price_cents, v_end: $.data.version }
          assert:
            - "stale PUT (version ${prod_v} after first PUT bumped to ${prod_v2}): error_id == ERR_STALE_VERSION (captured ${err})"
            - "base_price_cents remains 1100 and version 2 (captured ${price_end}, ${v_end}) — the losing write left no trace"

      - name: consistency_immediate_all_changes_visible_in_response
        claim_type: immediate_visibility
        grounds:
          - complexity_profile.consistency_model
          - state_machines.Order.STOCK_RESERVED_to_SHIPPED
        distinguishing_aspect: "Immediate consistency: the ship RESPONSE itself carries status SHIPPED, final freight 148800, and grand_total 248800 — no re-read is needed to observe the mutation (captured straight from the POST body)."
        test_recipe:
          setup: ["warehouse ATL; account; product class 70 weight 10 inventory 500; order ship_zone 5 qty 100 submitted"]
          setup_api_calls:
            - call: "POST /packaging-distribution/warehouses"
              payload: { code: "ATL", name: "Atlanta DC", zone: 2, ship_cutoff_time: "15:00", timezone: "America/New_York" }
              as: PlatformAdmin
              captures: { wh_atl: $.data.id }
            - call: "POST /packaging-distribution/accounts"
              payload: { company_name: "Acme Corp", account_type: "CORPORATE", credit_limit_cents: 100000000, default_warehouse_code: "ATL" }
              as: PlatformAdmin
              captures: { acct: $.data.id }
            - call: "POST /packaging-distribution/products"
              payload: { sku: "AC-1", name: "AC", category: "BOXES", base_price_cents: 1000, uom: "EACH", case_qty: 1, pallet_qty: 500, weight_lbs_per_unit: 10, density_pcf: 20 }
              as: CatalogManager
              captures: { prod: $.data.id }
            - call: "POST /packaging-distribution/inventory"
              payload: { product_id: "${prod}", warehouse_id: "${wh_atl}", on_hand_qty: 500 }
              as: WarehouseOps
            - call: "POST /packaging-distribution/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T10:00:00Z" }
              as: PlatformAdmin
            - call: "POST /packaging-distribution/orders"
              payload: { account_id: "${acct}", ship_zone: 5 }
              as: Buyer
              as_user_id: "${acct}"
              captures: { ord: $.data.id }
            - call: "POST /packaging-distribution/orders/${ord}/lines"
              payload: { product_id: "${prod}", qty: 100 }
              as: Buyer
              as_user_id: "${acct}"
            - call: "POST /packaging-distribution/orders/${ord}/submit"
              payload: {}
              as: Buyer
              as_user_id: "${acct}"
          trigger:
            - call: "POST /packaging-distribution/orders/${ord}/ship"
              payload: {}
              as: WarehouseOps
              captures: { st: $.data.status, freight: $.data.freight_estimate_cents, grand: $.data.grand_total_cents }
          assert:
            - "ship response body itself: status == SHIPPED, freight_estimate_cents == 148800, grand_total_cents == 248800 (captured ${st}, ${freight}, ${grand})"

  # ==================================================================
  # Section: consistency_model — folded into cross_cutting_layers above
  # (immediate model claim lives in
  #  consistency_immediate_all_changes_visible_in_response)
  # ==================================================================
