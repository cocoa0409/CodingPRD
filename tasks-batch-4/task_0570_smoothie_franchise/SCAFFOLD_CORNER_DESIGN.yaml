            - "http_status == 403"

  # ---------------------------------------------------------------------------
  - section: cross_cutting
    instances:
      - name: store_config_stale_version_returns_412
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[store-config-stale-version]", endpoints, "errors[ERR_STALE_VERSION]"]
        distinguishing_aspect: "A PATCH /stores/{id} carrying an expected_store_version the store has already advanced past (a prior PATCH bumped it) returns ERR_STALE_VERSION (412)."
        test_recipe:
          setup: ["A store just created (version 1)."]
          setup_api_calls:
            - { call: "POST /franchisees", payload: { legal_name: "FR", contact_email: "fr@x.com", base_royalty_rate: 0.06, marketing_fee_rate: 0.02 }, as: PlatformAdmin, captures: { fr_id: $.data.id } }
            - { call: "POST /franchisees/${fr_id}/stores", payload: { name: "S1", catering_capacity: 10 }, as: PlatformAdmin, captures: { store_id: $.data.id, store_v0: $.data.version } }
            - { call: "PATCH /stores/${store_id}", payload: { expected_store_version: "${store_v0}", status: "OPEN" }, as: PlatformAdmin }
          trigger:
            - { call: "PATCH /stores/${store_id}", payload: { expected_store_version: "${store_v0}", catering_capacity: 20 }, as: PlatformAdmin, captures: { err: $.data.error_id } }
          assert:
            - "response.error_id == ERR_STALE_VERSION"
            - "http_status == 412"

      - name: subscription_change_plan_stale_version_returns_412
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[subscription-plan-change-stale-version]", endpoints, "errors[ERR_STALE_VERSION]"]
        distinguishing_aspect: "A POST /subscriptions/{id}/change-plan carrying an expected_subscription_version already superseded by a prior change returns ERR_STALE_VERSION (412)."
        test_recipe:
          setup: ["A customer with an ACTIVE subscription (version 1)."]
          setup_api_calls:
            - { call: "POST /customers", payload: { email: "cp@x.com", full_name: "See Pea" }, as: Anonymous, captures: { cust_id: $.data.id } }
            - { call: "POST /customers/${cust_id}/subscriptions", payload: { tier: "BASIC", monthly_fee_cents: 999, included_smoothie_credits: 4 }, as: Customer, as_user_id: "${cust_id}", captures: { sub_id: $.data.id, sub_v0: $.data.version } }
            - { call: "POST /subscriptions/${sub_id}/change-plan", payload: { expected_subscription_version: "${sub_v0}", tier: "PREMIUM", monthly_fee_cents: 1999, included_smoothie_credits: 8 }, as: Customer, as_user_id: "${cust_id}" }
          trigger:
            - { call: "POST /subscriptions/${sub_id}/change-plan", payload: { expected_subscription_version: "${sub_v0}", tier: "BASIC", monthly_fee_cents: 999, included_smoothie_credits: 4 }, as: Customer, as_user_id: "${cust_id}", captures: { err: $.data.error_id } }
          assert:
            - "response.error_id == ERR_STALE_VERSION"
            - "http_status == 412"

