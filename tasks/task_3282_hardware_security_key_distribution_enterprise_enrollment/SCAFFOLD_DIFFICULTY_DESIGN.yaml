      - call: POST /v1/organizations/${org6}/purchase-orders/${po6}/approve
        payload:
          expected_purchase_order_version: ${po6_v}
        as: SecurityAdmin
        as_user_id: seca1
      - call: POST /v1/organizations/${org6}/purchase-orders/${po6}/ship
        payload: {}
        as: LogisticsCoordinator
        as_user_id: logc1
      - call: POST /v1/organizations/${org6}/purchase-orders/${po6}/receive
