            - "One unit A-101, 2 bedrooms, TOWNHOME, JUNIOR_ENLISTED - no offer run has been made, so the application below is still PENDING."
            - "One E5 sponsor with three full-time-custody dependents (spouse 1992-03-04, boys 2018-04-10 and 2022-03-15), so bedroom_eligibility is 2."
            - "One PENDING WaitlistApplication (pcs_orders_date 2026-08-25, expected_arrival_date 2026-09-01), decline_count 0, captured as ${app1_id}."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-25T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /installations"
              payload: { name: "Fort Cavazos Family Housing", branch: "ARMY", mha_code: "TX-FTC", bill_of_rights_version: "2026.1" }
              as: PlatformAdmin
              captures: { inst_id: "$.data.id" }
            - call: "POST /bah-rates"
              payload: { installation_id: "${inst_id}", pay_grade: "E5", with_dependents: true, effective_year: 2026, monthly_rate_cents: 245000, utility_allowance_cents: 19500 }
              as: PlatformAdmin
            - call: "POST /housing-units"
              payload: { installation_id: "${inst_id}", unit_code: "A-101", bedroom_count: 2, unit_type: "TOWNHOME", designated_rank_category: "JUNIOR_ENLISTED", historic_flag: false }
              as: PlatformAdmin
              captures: { u1_id: "$.data.id" }
            - call: "POST /service-members"
              payload: { dodid: "1000000001", last_name: "Reyes", first_name: "Ana", branch: "ARMY", pay_grade: "E5" }
              as: PlatformAdmin
              captures: { sm1_id: "$.data.id" }
            - call: "POST /dependents"
              payload: { service_member_id: "${sm1_id}", relationship: "SPOUSE", date_of_birth: "1992-03-04", gender: "FEMALE", is_full_time_custody: true }
              as: PlatformAdmin
            - call: "POST /dependents"
              payload: { service_member_id: "${sm1_id}", relationship: "CHILD", date_of_birth: "2018-04-10", gender: "MALE", is_full_time_custody: true }
              as: PlatformAdmin
            - call: "POST /dependents"
              payload: { service_member_id: "${sm1_id}", relationship: "CHILD", date_of_birth: "2022-03-15", gender: "MALE", is_full_time_custody: true }
              as: PlatformAdmin
            - call: "POST /waitlist-applications"
              payload: { installation_id: "${inst_id}", service_member_id: "${sm1_id}", pcs_orders_date: "2026-08-25", expected_arrival_date: "2026-09-01", accessibility_required: false }
              as: ServiceMember
              as_user_id: "${sm1_id}"
              captures: { app1_id: "$.data.id" }
          trigger:
            - call: "GET /waitlist-applications/${app1_id}"
              payload: {}
              as: InstallationHousingOffice
              captures: { a_ver: "$.data.version", a_ecd: "$.data.effective_control_date", a_beds: "$.data.bedroom_eligibility" }
            - call: "POST /waitlist-applications/${app1_id}/recertify"
              payload: { expected_application_version: "${a_ver} - 1" }
              as: InstallationHousingOffice
              captures: { e_stale2: "$.data.error_id" }
            - call: "POST /waitlist-applications/${app1_id}/recertify"
              payload: { expected_application_version: "${a_ver}" }
              as: InstallationHousingOffice
              captures: { b_ver: "$.data.version", b_ecd: "$.data.effective_control_date", b_beds: "$.data.bedroom_eligibility", b_dep: "$.data.dependent_count_at_application", b_status: "$.data.status" }
            - call: "POST /waitlist-applications/${app1_id}/recertify"
              payload: { expected_application_version: "${a_ver}" }
              as: PlatformAdmin
              captures: { e_replay2: "$.data.error_id" }
            - call: "POST /waitlist-applications/${app1_id}/recertify"
              payload: { expected_application_version: "${b_ver}" }
              as: PlatformAdmin
              captures: { c_ver: "$.data.version", c_ecd: "$.data.effective_control_date" }
          assert:
            - "${e_stale2} == ERR_STALE_APPLICATION_VERSION with HTTP 412 - the recertification carrying a one-behind token is refused."
            - "${b_ver} == ${a_ver} + 1 and ${c_ver} == ${a_ver} + 2 - each accepted recertification advances WaitlistApplication.version by exactly one, and the two accepted calls came from DIFFERENT roles (InstallationHousingOffice then PlatformAdmin), so the token is a property of the row and not of the caller."
