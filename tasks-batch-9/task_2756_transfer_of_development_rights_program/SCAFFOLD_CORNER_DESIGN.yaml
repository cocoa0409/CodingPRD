      - name: certificate_unit_guards_separate_the_split_and_retire_ceilings
        claim_type: violation_to_error
        grounds:
          - validations.priority_38_ERR_SPLIT_EXCEEDS_AVAILABLE_UNITS
          - validations.priority_39_ERR_INSUFFICIENT_CERTIFICATE_UNITS
          - endpoints.POST_tdr_certificates_id_split
          - endpoints.POST_tdr_certificates_id_retire
        distinguishing_aspect: "The two unit ceilings differ by one unit and by strictness: a split must leave at least one unit on the parent (units < available, so 22 of 22 is refused at priority 38) while a retirement may take everything (units <= available, so 22 of 22 succeeds but 25 is refused at priority 39). Both refusals leave Certificate.version untouched, which the final split proves by reusing the same expected_certificate_version."
        test_recipe:
          setup:
            - "logical clock at 2026-08-10T00:00:00Z; one LANDOWNER party"
            - "ACTIVE SA-EAST; parcel APN-001 (100.00 / 22.00 / PRIME / 2) severed for 22 units and certified"
            - "the 22-unit certificate is HELD by the landowner with units_encumbered 0, so 22 units are available"
          setup_api_calls:
            - call: "POST /tdr/_clock/set_current_utc"
              payload: { current_utc: "2026-08-10T00:00:00Z" }
              as: ProgramAdministrator
            - call: "POST /tdr/parties"
              payload: { kind: "LANDOWNER", legal_name: "Ridge Farm LLC", contact_email: "ridge@example.org", neighborhood_code: "NB-EAST" }
              as: ProgramAdministrator
              captures: { own_id: $.data.id }
            - call: "POST /tdr/sending-areas"
              payload: { code: "SA-EAST", name: "East Ridge", neighborhood_code: "NB-EAST", allocation_formula_version: "V1_NET_ACRE", base_rate_units_per_acre: 0.25, gross_discount_factor: 0.80, equity_tier: "UNDERSERVED", sending_cap_units: 200 }
              as: ProgramAdministrator
              captures: { sa_id: $.data.id }
            - call: "POST /tdr/sending-areas/${sa_id}/activate"
              payload: {}
              as: ProgramAdministrator
            - call: "POST /tdr/sending-parcels"
              payload: { owner_party_id: "${own_id}", sending_area_id: "${sa_id}", apn: "APN-001", gross_acres: 100.00, constrained_acres: 22.00, soil_class: "PRIME", existing_dwelling_units: 2 }
              as: ProgramAdministrator
              captures: { parcel_id: $.data.id }
            - call: "POST /tdr/severance-applications"
              payload: { sending_parcel_id: "${parcel_id}", applicant_party_id: "${own_id}", requested_units: 22 }
              as: Landowner
              as_user_id: "${own_id}"
              captures: { app_id: $.data.id }
            - call: "POST /tdr/severance-applications/${app_id}/screen"
              payload: {}
              as: SeveranceReviewer
              as_user_id: "rev-1"
            - call: "POST /tdr/severance-applications/${app_id}/review-decision"
              payload: { decision: "APPROVE" }
              as: SeveranceReviewer
              as_user_id: "rev-1"
            - call: "POST /tdr/severance-applications/${app_id}/certify"
              payload: {}
              as: ProgramAdministrator
              as_user_id: "admin-1"
              captures: { cert_id: $.data.id }
            - call: "GET /tdr/certificates/${cert_id}"
              payload: {}
              as: Landowner
              as_user_id: "${own_id}"
              captures: { cert_v: $.data.version }
          trigger:
            - call: "POST /tdr/certificates/${cert_id}/split"
              payload: { units: 22, expected_certificate_version: "${cert_v}" }
              as: Landowner
              as_user_id: "${own_id}"
            - call: "POST /tdr/certificates/${cert_id}/retire"
              payload: { units: 25, reason: "over-large retirement attempt" }
              as: Landowner
              as_user_id: "${own_id}"
            - call: "POST /tdr/certificates/${cert_id}/split"
              payload: { units: 21, expected_certificate_version: "${cert_v}" }
              as: Landowner
              as_user_id: "${own_id}"
              captures: { child_id: $.data.id }
          assert:
            - "the 22-unit split returns 422 ERR_SPLIT_EXCEEDS_AVAILABLE_UNITS — the parent must keep at least one unit"
            - "the 25-unit retirement returns 422 ERR_INSUFFICIENT_CERTIFICATE_UNITS (25 > 22 - 0)"
            - "after both refusals Certificate.${cert_id}.version is still ${cert_v}, split_count == 0, units_split_out == 0, units_retired == 0, and no child certificate exists"
            - "the 21-unit split returns 201, proving the version was never bumped by the two failures"
            - "Certificate.${cert_id}.units_split_out == 21, units_remaining == 1, split_count == 1, and lifecycle_status == ISSUED"
            - "Certificate.${child_id}.units_face == 21, units_remaining == 21, generation == 2, and parent_certificate_id == ${cert_id}"

