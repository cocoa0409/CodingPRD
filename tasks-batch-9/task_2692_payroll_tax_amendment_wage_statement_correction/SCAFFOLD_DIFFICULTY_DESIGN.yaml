              as: PlatformAdmin
              captures: { fed_id: "$.data.id" }
            - call: "POST /employees"
              payload: { employer_id: "${emp_id}", full_name: "Dana Reed", national_id_last4: "4821", mailing_state_code: "NY" }
              as: PayrollAnalyst
              captures: { e1_id: "$.data.id" }
            - call: "POST /payroll-register-lines"
              payload: { employer_id: "${emp_id}", employee_id: "${e1_id}", agency_id: "${fed_id}", tax_year: 2025, quarter: 1, taxable_wage_cents: 1000000, withheld_cents: 150000, work_jurisdiction_code: "US" }
              as: PayrollAnalyst
            - call: "POST /filed-returns"
              payload: { employer_id: "${emp_id}", agency_id: "${fed_id}", tax_year: 2025, quarter: 1, form_code: "941X", filed_at: "2025-04-30T00:00:00Z", reported_taxable_wage_cents: 1000000, reported_withheld_cents: 100000 }
              as: TaxPreparer
            - call: "POST /correction-cases"
              payload: { employer_id: "${emp_id}", agency_id: "${fed_id}", tax_year: 2025, quarter: 1 }
              as: PayrollAnalyst
              captures: { case_id: "$.data.id" }
            - call: "POST /correction-cases/${case_id}/reconcile"
              payload: {}
              as: PayrollAnalyst
            - call: "GET /discrepancies"
              payload: { correction_case_id: "${case_id}", category: "WITHHOLDING" }
              as: PayrollAnalyst
              captures: { d_wh_id: "$.data[0].id" }
            - call: "POST /discrepancies/${d_wh_id}/categorize"
              payload: { category: "WITHHOLDING", root_cause_code: "RATE_TABLE_STALE" }
              as: PayrollAnalyst
            - call: "GET /correction-cases/${case_id}"
              payload: {}
              as: TaxPreparer
              captures: { case_ver1: "$.data.version" }
            - call: "POST /amended-returns"
              payload: { correction_case_id: "${case_id}", form_code: "941X", accrual_through_date: "2026-04-30", expected_correction_case_version: "${case_ver1}" }
              as: TaxPreparer
              captures: { ar1_id: "$.data.id" }
          trigger:
            - call: "GET /correction-cases/${case_id}"
              payload: {}
              as: TaxPreparer
              captures: { case_ver2: "$.data.version" }
            - call: "POST /amended-returns"
              payload: { correction_case_id: "${case_id}", form_code: "941X", accrual_through_date: "2026-04-30", expected_correction_case_version: "${case_ver2}" }
              as: TaxPreparer
            - call: "POST /amended-returns"
              payload: { correction_case_id: "${case_id}", form_code: "941X-SCHB", accrual_through_date: "2026-04-30", expected_correction_case_version: "${case_ver2}" }
              as: TaxPreparer
              captures: { ar2_id: "$.data.id" }
            - call: "POST /amended-returns/${ar1_id}/void"
              payload: { void_reason: "Superseded by a re-scoped draft." }
