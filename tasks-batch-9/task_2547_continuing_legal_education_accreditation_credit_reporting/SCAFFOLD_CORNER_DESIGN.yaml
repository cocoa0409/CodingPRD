        distinguishing_aspect: "The standing check on an application walks two hops — application -> course -> sponsoring provider — and it is the provider clause that binds, because the course clause of priority 62 cannot apply to the endpoint whose purpose is to get a PENDING_APPROVAL course approved; the same provider's application is accepted while PROBATIONARY and refused after SUSPEND, with the course row itself untouched by the suspension (only APPROVED courses cascade)."
