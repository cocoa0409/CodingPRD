# =============================================================================
# Task 1031 — Running & Fit Specialty Store
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# 9 Difficulty Rules × 2 instances = 18 instances
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: order_total_provisional_vs_final
        grounds:
          - calculations.order_pricing
          - entities.Order.fields.provisional_total_cents
          - entities.Order.fields.final_total_cents
          - state_machines.Order.AUTHORIZED_to_PAID
        distinguishing_aspect: |
          For identical line data the Order's provisional_total_cents (computed at creation with
          redeemed_points forced to 0) diverges from final_total_cents (computed at capture with the
          5000-point redemption applied) — a dual-variant calc on the Order domain.
        test_recipe:
          setup:
            - "Member with 5000 loyalty points; one SHOE product at 12000 cents; one order of one unit; redemption applied while UNPAID; payment authorized."
          setup_api_calls:
            - call: "POST /members"
              payload: { email: "r1a@x.com", full_name: "R1A", state_code: "CA" }
              as: StoreManager
              captures: { m: $.data.id }
            - call: "POST /members/${m}/loyalty-adjustments"
              payload: { points_delta: 5000, reason: "seed points" }
              as: StoreManager
            - call: "POST /products"
              payload: { sku: "R1A-SHOE", name: "Trainer", category: "SHOE", unit_price_cents: 12000, initial_stock: 3 }
              as: StoreManager
              captures: { pid: $.data.id }
            - call: "POST /orders"
              payload: { member_id: "${m}", lines: [ { product_id: "${pid}", quantity: 1 } ] }
              as: StoreManager
              captures: { oid: $.data.id }
            - call: "POST /orders/${oid}/apply-redemption"
              payload: { points_to_redeem: 5000 }
              as: StoreManager
            - call: "POST /orders/${oid}/authorize-payment"
              payload: {}
              as: StoreManager
          trigger:
            - call: "POST /orders/${oid}/capture-payment"
              payload: {}
              as: StoreManager
          assert:
            - "Order.${oid}.provisional_total_cents == 12000"
            - "Order.${oid}.final_total_cents == 7000"

      - name: loyalty_points_estimated_vs_settled_net_of_return
        grounds:
          - calculations.loyalty_points_earned
          - entities.Order.fields.estimated_points_earned
          - entities.Member.fields.loyalty_points_balance
          - state_machines.Order.FULFILLED_to_RETURNED
        distinguishing_aspect: |
          Order.estimated_points_earned (all lines, at creation) equals 1500, but the net points settled
          onto the Member after one line is returned equals 500 — a dual-variant calc on the Member domain,
          distinct from the Order-domain price variant.
        test_recipe:
          setup:
            - "Member; SHOE 10000 and NUTRITION 5000; order of both; fully paid, reserved and fulfilled (settles 1500 pts); a return opened and inspected on the SHOE line."
          setup_api_calls:
            - call: "POST /members"
              payload: { email: "r1b@x.com", full_name: "R1B", state_code: "CA" }
              as: StoreManager
              captures: { m: $.data.id }
            - call: "POST /products"
              payload: { sku: "R1B-SHOE", name: "Racer", category: "SHOE", unit_price_cents: 10000, initial_stock: 3 }
              as: StoreManager
              captures: { pa: $.data.id }
            - call: "POST /products"
              payload: { sku: "R1B-GEL", name: "Gel", category: "NUTRITION", unit_price_cents: 5000, initial_stock: 3 }
              as: StoreManager
              captures: { pb: $.data.id }
            - call: "POST /orders"
              payload: { member_id: "${m}", lines: [ { product_id: "${pa}", quantity: 1 }, { product_id: "${pb}", quantity: 1 } ] }
              as: StoreManager
              captures: { oid: $.data.id }
            - call: "POST /orders/${oid}/authorize-payment"
              payload: {}
              as: StoreManager
            - call: "POST /orders/${oid}/capture-payment"
              payload: {}
              as: StoreManager
            - call: "POST /orders/${oid}/reserve"
              payload: {}
              as: StoreManager
            - call: "POST /orders/${oid}/fulfill"
              payload: {}
              as: StoreManager
            - call: "GET /order-lines"
              payload: { order_id: "${oid}", product_id: "${pa}" }
              as: StoreManager
              captures: { line_a: "$.data[0].id" }
            - call: "POST /returns"
              payload: { order_line_id: "${line_a}", reason: "wear test failed" }
              as: StoreManager
              captures: { rid: $.data.id }
            - call: "POST /returns/${rid}/start-inspection"
              payload: {}
              as: StoreManager
          trigger:
            - call: "POST /returns/${rid}/approve"
              payload: {}
              as: StoreManager
          assert:
            - "Order.${oid}.estimated_points_earned == 1500"
            - "Member.${m}.loyalty_points_balance == 500"

  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: discount_stack_cap_and_total_ceiling_mode_a
        grounds:
          - calculations.effective_discount
          - entities.Subscription.fields.discount_pct
          - entities.Order.fields.discount_pct_applied
          - entities.Order.fields.discount_cents
        distinguishing_aspect: |
          Mode (a): three inputs (ELITE subscription 0.15, STANDARD loyalty 0.00, promo SPRING15 0.15) combine
          via base=0.15 -> min(0.15, MAX_STACK 0.12)=0.12 -> min(0.12+0.15, MAX_TOTAL 0.20)=0.20, gated on
          subtotal>=5000; both nested min operations bite, yielding discount_pct_applied 0.20 and discount_cents 2000.
        test_recipe:
          setup:
            - "Member with an ACTIVE ELITE subscription and STANDARD loyalty; one product at 10000 cents."
          setup_api_calls:
            - call: "POST /members"
              payload: { email: "r2a@x.com", full_name: "R2A", state_code: "CA" }
              as: StoreManager
              captures: { m: $.data.id }
            - call: "POST /subscriptions"
              payload: { member_id: "${m}", plan: "ELITE" }
              as: StoreManager
            - call: "POST /products"
              payload: { sku: "R2A-P", name: "Gear", category: "GEAR", unit_price_cents: 10000, initial_stock: 3 }
              as: StoreManager
              captures: { pid: $.data.id }
          trigger:
            - call: "POST /orders"
              payload: { member_id: "${m}", lines: [ { product_id: "${pid}", quantity: 1 } ], promo_code: "SPRING15" }
              as: StoreManager
              captures: { oid: $.data.id }
          assert:
            - "Order.${oid}.discount_pct_applied == 0.20"
            - "Order.${oid}.discount_cents == 2000"
            - "Order.${oid}.provisional_total_cents == 8000"

      - name: loyalty_points_round_per_line_then_sum_mode_b
        grounds:
          - calculations.loyalty_points_earned
          - entities.OrderLine.fields.line_points_earned
          - entities.Order.fields.estimated_points_earned
        distinguishing_aspect: |
          Mode (b): pinned rounding order round-per-line-then-sum. Two lines each 1005 cents at STANDARD
          multiplier yield round_half_up(100.5)=101 per line, summing to 202; sum-then-round would give
          round_half_up(201.0)=201. The scaffold pins 202.
        test_recipe:
          setup:
            - "Member at STANDARD tier; two distinct products each priced 1005 cents."
          setup_api_calls:
            - call: "POST /members"
              payload: { email: "r2b@x.com", full_name: "R2B", state_code: "CA" }
              as: StoreManager
              captures: { m: $.data.id }
            - call: "POST /products"
              payload: { sku: "R2B-A", name: "SockA", category: "APPAREL", unit_price_cents: 1005, initial_stock: 3 }
              as: StoreManager
              captures: { pa: $.data.id }
            - call: "POST /products"
              payload: { sku: "R2B-B", name: "SockB", category: "APPAREL", unit_price_cents: 1005, initial_stock: 3 }
              as: StoreManager
              captures: { pb: $.data.id }
          trigger:
            - call: "POST /orders"
              payload: { member_id: "${m}", lines: [ { product_id: "${pa}", quantity: 1 }, { product_id: "${pb}", quantity: 1 } ] }
              as: StoreManager
              captures: { oid: $.data.id }
          assert:
            - "Order.${oid}.estimated_points_earned == 202"

  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: order_parallel_payment_and_fulfillment_dimensions
        grounds:
          - state_machines.Order.AUTHORIZED_to_PAID
          - state_machines.Order.PENDING_to_RESERVED
          - entities.Order.fields.payment_status
          - entities.Order.fields.fulfillment_status
        distinguishing_aspect: |
          Parallel state: capturing payment drives payment_status UNPAID->AUTHORIZED->PAID while
          fulfillment_status stays PENDING; a subsequent reserve advances fulfillment_status to RESERVED
          without changing payment_status — two independent axes on one Order row.
        test_recipe:
          setup:
            - "Member; product at 8000 cents, stock available; one order authorized then captured (payment PAID, fulfillment still PENDING)."
          setup_api_calls:
            - call: "POST /members"
              payload: { email: "r3a@x.com", full_name: "R3A", state_code: "CA" }
              as: StoreManager
              captures: { m: $.data.id }
            - call: "POST /products"
              payload: { sku: "R3A-P", name: "Belt", category: "GEAR", unit_price_cents: 8000, initial_stock: 3 }
              as: StoreManager
              captures: { pid: $.data.id }
            - call: "POST /orders"
              payload: { member_id: "${m}", lines: [ { product_id: "${pid}", quantity: 1 } ] }
              as: StoreManager
              captures: { oid: $.data.id }
            - call: "POST /orders/${oid}/authorize-payment"
              payload: {}
              as: StoreManager
            - call: "POST /orders/${oid}/capture-payment"
              payload: {}
              as: StoreManager
          trigger:
            - call: "POST /orders/${oid}/reserve"
              payload: {}
              as: StoreManager
          assert:
            - "Order.${oid}.payment_status == PAID"
            - "Order.${oid}.fulfillment_status == RESERVED"

      - name: wear_return_reject_resubmit_cycle
        grounds:
          - state_machines.WearReturn.REJECTED_to_REQUESTED
          - state_machines.WearReturn.UNDER_INSPECTION_to_REJECTED
          - state_machines.WearReturn.UNDER_INSPECTION_to_APPROVED
        distinguishing_aspect: |
          Revert/cycle: the return goes REQUESTED->UNDER_INSPECTION->REJECTED->REQUESTED (resubmit)
          ->UNDER_INSPECTION->APPROVED — the REJECTED->REQUESTED back-edge is impossible in a linear pipeline.
        test_recipe:
          setup:
            - "Member; SHOE product; order fully paid, reserved and fulfilled; a return opened, inspected, rejected, and resubmitted, then re-inspected."
          setup_api_calls:
            - call: "POST /members"
              payload: { email: "r3b@x.com", full_name: "R3B", state_code: "CA" }
              as: StoreManager
              captures: { m: $.data.id }
            - call: "POST /products"
              payload: { sku: "R3B-SHOE", name: "Tempo", category: "SHOE", unit_price_cents: 10000, initial_stock: 3 }
              as: StoreManager
              captures: { pid: $.data.id }
            - call: "POST /orders"
              payload: { member_id: "${m}", lines: [ { product_id: "${pid}", quantity: 1 } ] }
              as: StoreManager
              captures: { oid: $.data.id }
            - call: "POST /orders/${oid}/authorize-payment"
              payload: {}
              as: StoreManager
            - call: "POST /orders/${oid}/capture-payment"
              payload: {}
              as: StoreManager
            - call: "POST /orders/${oid}/reserve"
              payload: {}
              as: StoreManager
            - call: "POST /orders/${oid}/fulfill"
              payload: {}
              as: StoreManager
            - call: "GET /order-lines"
              payload: { order_id: "${oid}" }
              as: StoreManager
              captures: { line0: "$.data[0].id" }
            - call: "POST /returns"
              payload: { order_line_id: "${line0}", reason: "size issue" }
              as: StoreManager
              captures: { rid: $.data.id }
            - call: "POST /returns/${rid}/start-inspection"
              payload: {}
              as: StoreManager
            - call: "POST /returns/${rid}/reject"
              payload: { reason: "insufficient evidence" }
              as: StoreManager
            - call: "POST /returns/${rid}/resubmit"
              payload: {}
              as: StoreManager
            - call: "POST /returns/${rid}/start-inspection"
              payload: {}
              as: StoreManager
          trigger:
            - call: "POST /returns/${rid}/approve"
              payload: {}
              as: StoreManager
          assert:
            - "WearReturn.${rid}.status == APPROVED"

  # ===========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: return_approval_cascade_order_member_tier
        grounds:
          - state_machines.WearReturn.UNDER_INSPECTION_to_APPROVED
          - state_machines.Order.FULFILLED_to_RETURNED
          - entities.Member.fields.loyalty_points_balance
          - entities.Member.fields.tier_qualifying_spend_cents
        distinguishing_aspect: |
          Depth-4 chain from return approval: (1) WearReturn->APPROVED (2) linked Order fulfillment->RETURNED &
          payment->REFUNDED (3) Member loyalty earn reversal -1000 (4) Member.tier_qualifying_spend_cents -10000
          with tier recompute — each hop caused by the previous, not by the original action.
        test_recipe:
          setup:
            - "Member; SHOE 10000; order fully paid+reserved+fulfilled (settles 1000 pts, tier spend 10000); return opened and under inspection."
          setup_api_calls:
            - call: "POST /members"
              payload: { email: "r4a@x.com", full_name: "R4A", state_code: "CA" }
              as: StoreManager
              captures: { m: $.data.id }
            - call: "POST /products"
              payload: { sku: "R4A-SHOE", name: "Glide", category: "SHOE", unit_price_cents: 10000, initial_stock: 3 }
              as: StoreManager
              captures: { pid: $.data.id }
            - call: "POST /orders"
              payload: { member_id: "${m}", lines: [ { product_id: "${pid}", quantity: 1 } ] }
              as: StoreManager
              captures: { oid: $.data.id }
            - call: "POST /orders/${oid}/authorize-payment"
              payload: {}
              as: StoreManager
            - call: "POST /orders/${oid}/capture-payment"
              payload: {}
              as: StoreManager
            - call: "POST /orders/${oid}/reserve"
              payload: {}
              as: StoreManager
            - call: "POST /orders/${oid}/fulfill"
              payload: {}
              as: StoreManager
            - call: "GET /order-lines"
              payload: { order_id: "${oid}" }
              as: StoreManager
              captures: { line0: "$.data[0].id" }
            - call: "POST /returns"
              payload: { order_line_id: "${line0}", reason: "defect" }
              as: StoreManager
              captures: { rid: $.data.id }
            - call: "POST /returns/${rid}/start-inspection"
              payload: {}
              as: StoreManager
          trigger:
            - call: "POST /returns/${rid}/approve"
              payload: {}
              as: StoreManager
          assert:
            - "WearReturn.${rid}.status == APPROVED"
            - "Order.${oid}.fulfillment_status == RETURNED"
            - "Order.${oid}.payment_status == REFUNDED"
            - "Member.${m}.loyalty_points_balance == 0"
            - "Member.${m}.tier_qualifying_spend_cents == 0"

      - name: booking_cancel_waitlist_promotion_cascade
        grounds:
          - state_machines.TrainingBooking.BOOKED_to_CANCELLED
          - state_machines.TrainingBooking.WAITLISTED_to_BOOKED
          - entities.TrainingSession.fields.booked_count
        distinguishing_aspect: |
          Depth-3 chain from a booking cancel: (1) booking b1->CANCELLED (2) session slot frees
          (booked_count-1) (3) the earliest WAITLISTED booking b2 is promoted WAITLISTED->BOOKED — a
          different trigger and propagation pattern from the return-approval cascade.
        test_recipe:
          setup:
            - "Two members each with an ACTIVE subscription; a capacity-1 training session; member1 BOOKED, member2 WAITLISTED."
          setup_api_calls:
            - call: "POST /members"
              payload: { email: "r4b1@x.com", full_name: "R4B1", state_code: "CA" }
              as: StoreManager
              captures: { m1: $.data.id }
            - call: "POST /members"
              payload: { email: "r4b2@x.com", full_name: "R4B2", state_code: "CA" }
              as: StoreManager
              captures: { m2: $.data.id }
            - call: "POST /subscriptions"
              payload: { member_id: "${m1}", plan: "BASIC" }
              as: StoreManager
            - call: "POST /subscriptions"
              payload: { member_id: "${m2}", plan: "BASIC" }
              as: StoreManager
            - call: "POST /training-sessions"
              payload: { title: "Dawn 5k", start_time: "2026-08-10T13:00:00Z", end_time: "2026-08-10T14:00:00Z", capacity: 1 }
              as: StoreManager
              captures: { sid: $.data.id }
            - call: "POST /training-bookings"
              payload: { session_id: "${sid}", member_id: "${m1}" }
              as: StoreManager
              captures: { b1: $.data.id }
            - call: "POST /training-bookings"
              payload: { session_id: "${sid}", member_id: "${m2}" }
              as: StoreManager
              captures: { b2: $.data.id }
          trigger:
            - call: "POST /training-bookings/${b1}/cancel"
              payload: {}
              as: StoreManager
          assert:
            - "TrainingBooking.${b1}.status == CANCELLED"
            - "TrainingBooking.${b2}.status == BOOKED"
            - "TrainingSession.${sid}.booked_count == 1"

  # ===========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: paid_order_redeem_state_beats_fiscal
        grounds:
          - validations[priority=6]
          - validations[priority=10]
          - errors[ERR_ORDER_NOT_MODIFIABLE]
          - errors[ERR_INSUFFICIENT_POINTS]
        distinguishing_aspect: |
          Category pair {state, business_fiscal}: apply-redemption on a PAID order by a member with 0 points
          fails both the state check (priority 6, ERR_ORDER_NOT_MODIFIABLE) and the fiscal check
          (priority 10, ERR_INSUFFICIENT_POINTS); the lower priority number wins -> ERR_ORDER_NOT_MODIFIABLE.
        test_recipe:
          setup:
            - "Member with 0 points; product; order authorized and captured (payment PAID)."
          setup_api_calls:
            - call: "POST /members"
              payload: { email: "r5a@x.com", full_name: "R5A", state_code: "CA" }
              as: StoreManager
              captures: { m: $.data.id }
            - call: "POST /products"
              payload: { sku: "R5A-P", name: "Cap", category: "APPAREL", unit_price_cents: 12000, initial_stock: 3 }
              as: StoreManager
              captures: { pid: $.data.id }
            - call: "POST /orders"
              payload: { member_id: "${m}", lines: [ { product_id: "${pid}", quantity: 1 } ] }
              as: StoreManager
              captures: { oid: $.data.id }
            - call: "POST /orders/${oid}/authorize-payment"
              payload: {}
              as: StoreManager
            - call: "POST /orders/${oid}/capture-payment"
              payload: {}
              as: StoreManager
          trigger:
            - call: "POST /orders/${oid}/apply-redemption"
              payload: { points_to_redeem: 100 }
              as: StoreManager
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_ORDER_NOT_MODIFIABLE"
            - "response.status == 409"

      - name: booking_temporal_beats_referential
        grounds:
          - validations[priority=7]
          - validations[priority=8]
          - errors[ERR_SCHEDULE_CONFLICT]
          - errors[ERR_SUBSCRIPTION_REQUIRED]
        distinguishing_aspect: |
          Category pair {business_temporal, business_referential}: booking a session that overlaps the member's
          existing booking while their subscription is no longer ACTIVE fails both the temporal check
          (priority 7, ERR_SCHEDULE_CONFLICT) and the referential check (priority 8, ERR_SUBSCRIPTION_REQUIRED);
          temporal wins -> ERR_SCHEDULE_CONFLICT. A different category pair from the state/fiscal conflict.
        test_recipe:
          setup:
            - "Member booked into session X (10:00-11:00) while subscription ACTIVE, then subscription cancelled; overlapping session Y (10:30-11:30) exists."
          setup_api_calls:
            - call: "POST /members"
              payload: { email: "r5b@x.com", full_name: "R5B", state_code: "CA" }
              as: StoreManager
              captures: { m: $.data.id }
            - call: "POST /subscriptions"
              payload: { member_id: "${m}", plan: "BASIC" }
              as: StoreManager
              captures: { sub: $.data.id }
            - call: "POST /training-sessions"
              payload: { title: "X run", start_time: "2026-08-05T10:00:00Z", end_time: "2026-08-05T11:00:00Z", capacity: 5 }
              as: StoreManager
              captures: { sidx: $.data.id }
            - call: "POST /training-bookings"
              payload: { session_id: "${sidx}", member_id: "${m}" }
              as: StoreManager
              captures: { bx: $.data.id }
            - call: "POST /subscriptions/${sub}/cancel"
              payload: {}
              as: StoreManager
            - call: "POST /training-sessions"
              payload: { title: "Y run", start_time: "2026-08-05T10:30:00Z", end_time: "2026-08-05T11:30:00Z", capacity: 5 }
              as: StoreManager
              captures: { sidy: $.data.id }
          trigger:
            - call: "POST /training-bookings"
              payload: { session_id: "${sidy}", member_id: "${m}" }
              as: StoreManager
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_SCHEDULE_CONFLICT"
            - "response.status == 409"

  # ===========================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: shoe_mileage_ge_threshold_retirement
        grounds:
          - calculations.shoe_mileage_retirement
          - state_machines.RunningShoe.ACTIVE_to_RETIREMENT_DUE
          - entities.RunningShoe.fields.total_mileage_miles
        distinguishing_aspect: |
          Numeric threshold with inclusive boundary (>=): a shoe with retirement_threshold_miles 300, after
          logging exactly 300 miles, flips ACTIVE->RETIREMENT_DUE. Reached through POST /running-shoes/{id}/log-mileage.
        test_recipe:
          setup:
            - "Member; SHOE product with mileage_life_miles 300; order fulfilled so one RunningShoe (threshold 300) exists."
          setup_api_calls:
            - call: "POST /members"
              payload: { email: "r6a@x.com", full_name: "R6A", state_code: "CA" }
              as: StoreManager
              captures: { m: $.data.id }
            - call: "POST /products"
              payload: { sku: "R6A-SHOE", name: "Lite", category: "SHOE", unit_price_cents: 10000, mileage_life_miles: 300, initial_stock: 3 }
              as: StoreManager
              captures: { pid: $.data.id }
            - call: "POST /orders"
              payload: { member_id: "${m}", lines: [ { product_id: "${pid}", quantity: 1 } ] }
              as: StoreManager
              captures: { oid: $.data.id }
            - call: "POST /orders/${oid}/authorize-payment"
              payload: {}
              as: StoreManager
            - call: "POST /orders/${oid}/capture-payment"
              payload: {}
              as: StoreManager
            - call: "POST /orders/${oid}/reserve"
              payload: {}
              as: StoreManager
            - call: "POST /orders/${oid}/fulfill"
              payload: {}
              as: StoreManager
            - call: "GET /running-shoes"
              payload: { source_order_id: "${oid}" }
              as: StoreManager
              captures: { shoe: "$.data[0].id" }
          trigger:
            - call: "POST /running-shoes/${shoe}/log-mileage"
              payload: { miles: 300 }
              as: StoreManager
          assert:
            - "RunningShoe.${shoe}.total_mileage_miles == 300"
            - "RunningShoe.${shoe}.status == RETIREMENT_DUE"

      - name: empty_order_zero_lines_rejected
        grounds:
          - errors[ERR_EMPTY_ORDER]
          - validations[priority=5]
          - entities.OrderLine.fields.order_id
        distinguishing_aspect: |
          Empty-collection boundary (zero lines) on a different endpoint (POST /orders): an order with an
          empty lines array is rejected with ERR_EMPTY_ORDER (422), distinct metric from the mileage threshold.
        test_recipe:
          setup:
            - "One member; no products needed."
          setup_api_calls:
            - call: "POST /members"
              payload: { email: "r6b@x.com", full_name: "R6B", state_code: "CA" }
              as: StoreManager
              captures: { m: $.data.id }
          trigger:
            - call: "POST /orders"
              payload: { member_id: "${m}", lines: [] }
              as: StoreManager
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_EMPTY_ORDER"
            - "response.status == 422"

  # ===========================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: booking_requires_active_subscription
        grounds:
          - validations[priority=8]
          - errors[ERR_SUBSCRIPTION_REQUIRED]
          - entities.Subscription.fields.status
          - state_machines.TrainingBooking.BOOKED_to_CANCELLED
        distinguishing_aspect: |
          Pair TrainingBooking -> Subscription: creating a TrainingBooking is rejected with
          ERR_SUBSCRIPTION_REQUIRED when the member has no ACTIVE Subscription; the booking's validity depends
          on a different entity's state.
        test_recipe:
          setup:
            - "Member with no subscription; a future training session."
          setup_api_calls:
            - call: "POST /members"
              payload: { email: "r7a@x.com", full_name: "R7A", state_code: "CA" }
              as: StoreManager
              captures: { m: $.data.id }
            - call: "POST /training-sessions"
              payload: { title: "No-sub run", start_time: "2026-08-11T13:00:00Z", end_time: "2026-08-11T14:00:00Z", capacity: 5 }
              as: StoreManager
              captures: { sid: $.data.id }
          trigger:
            - call: "POST /training-bookings"
              payload: { session_id: "${sid}", member_id: "${m}" }
              as: StoreManager
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_SUBSCRIPTION_REQUIRED"
            - "response.status == 409"

      - name: return_requires_fulfilled_order
        grounds:
          - validations[priority=8]
          - errors[ERR_ORDER_NOT_FULFILLED]
          - entities.Order.fields.fulfillment_status
        distinguishing_aspect: |
          Pair WearReturn -> Order: opening a WearReturn against a line whose order is only RESERVED (not
          FULFILLED) is rejected with ERR_ORDER_NOT_FULFILLED — a different entity pair from booking/subscription.
        test_recipe:
          setup:
            - "Member; SHOE product; order paid and reserved but NOT fulfilled."
          setup_api_calls:
            - call: "POST /members"
              payload: { email: "r7b@x.com", full_name: "R7B", state_code: "CA" }
              as: StoreManager
              captures: { m: $.data.id }
            - call: "POST /products"
              payload: { sku: "R7B-SHOE", name: "Fly", category: "SHOE", unit_price_cents: 10000, initial_stock: 3 }
              as: StoreManager
              captures: { pid: $.data.id }
            - call: "POST /orders"
              payload: { member_id: "${m}", lines: [ { product_id: "${pid}", quantity: 1 } ] }
              as: StoreManager
              captures: { oid: $.data.id }
            - call: "POST /orders/${oid}/authorize-payment"
              payload: {}
              as: StoreManager
            - call: "POST /orders/${oid}/capture-payment"
              payload: {}
              as: StoreManager
            - call: "POST /orders/${oid}/reserve"
              payload: {}
              as: StoreManager
            - call: "GET /order-lines"
              payload: { order_id: "${oid}" }
              as: StoreManager
              captures: { line0: "$.data[0].id" }
          trigger:
            - call: "POST /returns"
              payload: { order_line_id: "${line0}", reason: "changed mind" }
              as: StoreManager
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_ORDER_NOT_FULFILLED"
            - "response.status == 409"

  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: fitter_buffer_overlap_rejected
        grounds:
          - errors[ERR_FITTER_UNAVAILABLE]
          - validations[priority=7]
          - entities.FitmentSession.fields.scheduled_start
          - entities.FitmentSession.fields.fitter_id
        distinguishing_aspect: |
          Resource = Fitter, interval semantics = closed-with-buffer: a second fitment on the same fitter
          starting 10 minutes after the first ends is inside SERVICE_BUFFER_MINUTES (15) and is rejected with
          ERR_FITTER_UNAVAILABLE. Distinct members prevent member-overlap from firing.
        test_recipe:
          setup:
            - "One fitter; member A has a fitment 10:00-11:00; member B attempts 11:10-12:00 on the same fitter."
          setup_api_calls:
            - call: "POST /members"
              payload: { email: "r8a1@x.com", full_name: "R8A1", state_code: "CA" }
              as: StoreManager
              captures: { ma: $.data.id }
            - call: "POST /members"
              payload: { email: "r8a2@x.com", full_name: "R8A2", state_code: "CA" }
              as: StoreManager
              captures: { mb: $.data.id }
            - call: "POST /fitters"
              payload: { full_name: "Fitter Fay" }
              as: StoreManager
              captures: { fid: $.data.id }
            - call: "POST /fitment-sessions"
              payload: { member_id: "${ma}", fitter_id: "${fid}", scheduled_start: "2026-08-01T10:00:00Z", scheduled_end: "2026-08-01T11:00:00Z" }
              as: StoreManager
              captures: { fs1: $.data.id }
          trigger:
            - call: "POST /fitment-sessions"
              payload: { member_id: "${mb}", fitter_id: "${fid}", scheduled_start: "2026-08-01T11:10:00Z", scheduled_end: "2026-08-01T12:00:00Z" }
              as: StoreManager
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_FITTER_UNAVAILABLE"
            - "response.status == 409"

      - name: member_halfopen_training_overlap_rejected
        grounds:
          - errors[ERR_SCHEDULE_CONFLICT]
          - validations[priority=7]
          - entities.TrainingSession.fields.start_time
          - entities.TrainingBooking.fields.member_id
        distinguishing_aspect: |
          Resource = Member, interval semantics = half-open [start,end): a member already BOOKED into
          10:00-11:00 is rejected (ERR_SCHEDULE_CONFLICT) when booking overlapping 10:30-11:30; adjacency
          (end==start) would be allowed — different resource and different interval arithmetic from the fitter buffer.
        test_recipe:
          setup:
            - "Member with ACTIVE subscription BOOKED into session X 10:00-11:00; overlapping session Y 10:30-11:30 exists."
          setup_api_calls:
            - call: "POST /members"
              payload: { email: "r8b@x.com", full_name: "R8B", state_code: "CA" }
              as: StoreManager
              captures: { m: $.data.id }
            - call: "POST /subscriptions"
              payload: { member_id: "${m}", plan: "PLUS" }
              as: StoreManager
            - call: "POST /training-sessions"
              payload: { title: "X", start_time: "2026-08-02T10:00:00Z", end_time: "2026-08-02T11:00:00Z", capacity: 5 }
              as: StoreManager
              captures: { sidx: $.data.id }
            - call: "POST /training-bookings"
              payload: { session_id: "${sidx}", member_id: "${m}" }
              as: StoreManager
              captures: { bx: $.data.id }
            - call: "POST /training-sessions"
              payload: { title: "Y", start_time: "2026-08-02T10:30:00Z", end_time: "2026-08-02T11:30:00Z", capacity: 5 }
              as: StoreManager
              captures: { sidy: $.data.id }
          trigger:
            - call: "POST /training-bookings"
              payload: { session_id: "${sidy}", member_id: "${m}" }
              as: StoreManager
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_SCHEDULE_CONFLICT"
            - "response.status == 409"

  # ===========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: loyalty_points_redeem_then_cancel_conserved
        grounds:
          - entities.Member.fields.loyalty_points_balance
          - state_machines.Order.PENDING_to_CANCELLED
        distinguishing_aspect: |
          Conserved quantity = Member.loyalty_points_balance. Forward apply-redemption(-5000) paired with the
          compensating order cancel(+5000) leaves loyalty_points_balance at its pre-redemption value 5000.
          Invariant: balance_after_cancel == balance_before_redemption.
        test_recipe:
          setup:
            - "Member granted 5000 points; product 12000; one UNPAID order; redemption of 5000 applied (cap 50% of 12000 = 6000, multiple of 100)."
          setup_api_calls:
            - call: "POST /members"
              payload: { email: "r9a@x.com", full_name: "R9A", state_code: "CA" }
              as: StoreManager
              captures: { m: $.data.id }
            - call: "POST /members/${m}/loyalty-adjustments"
              payload: { points_delta: 5000, reason: "seed" }
              as: StoreManager
            - call: "POST /products"
              payload: { sku: "R9A-P", name: "Vest", category: "GEAR", unit_price_cents: 12000, initial_stock: 3 }
              as: StoreManager
              captures: { pid: $.data.id }
            - call: "POST /orders"
              payload: { member_id: "${m}", lines: [ { product_id: "${pid}", quantity: 1 } ] }
              as: StoreManager
              captures: { oid: $.data.id }
            - call: "POST /orders/${oid}/apply-redemption"
              payload: { points_to_redeem: 5000 }
              as: StoreManager
          trigger:
            - call: "POST /orders/${oid}/cancel"
              payload: {}
              as: StoreManager
          assert:
            - "Member.${m}.loyalty_points_balance == 5000"

      - name: inventory_available_reserve_then_release_conserved
        grounds:
          - calculations.inventory_available
          - entities.Product.fields.available_units
          - entities.Product.fields.stock_reserved
          - state_machines.Order.RESERVED_to_CANCELLED
        distinguishing_aspect: |
          Conserved quantity = Product.available_units (= stock_on_hand - stock_reserved), a different
          conserved quantity from loyalty points. Forward reserve(-3 available) paired with the compensating
          cancel/release(+3 available) leaves available_units at 10 and stock_reserved at 0.
        test_recipe:
          setup:
            - "Product with 10 units on hand; member; an order for 3 units reserved."
          setup_api_calls:
            - call: "POST /members"
              payload: { email: "r9b@x.com", full_name: "R9B", state_code: "CA" }
              as: StoreManager
              captures: { m: $.data.id }
            - call: "POST /products"
              payload: { sku: "R9B-P", name: "Bottle", category: "GEAR", unit_price_cents: 5000, initial_stock: 10 }
              as: StoreManager
              captures: { pid: $.data.id }
            - call: "POST /orders"
              payload: { member_id: "${m}", lines: [ { product_id: "${pid}", quantity: 3 } ] }
              as: StoreManager
              captures: { oid: $.data.id }
            - call: "POST /orders/${oid}/reserve"
              payload: {}
              as: StoreManager
          trigger:
            - call: "POST /orders/${oid}/cancel"
              payload: {}
              as: StoreManager
          assert:
            - "Product.${pid}.available_units == 10"
            - "Product.${pid}.stock_reserved == 0"
