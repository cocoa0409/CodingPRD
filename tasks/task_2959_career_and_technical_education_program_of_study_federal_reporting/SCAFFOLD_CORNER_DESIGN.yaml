              as: CteDirector
              as_user_id: "u_dir_1"
              captures: { crs_drf_id: $.data.id }
            - call: "POST /cte/programs-of-study/${pos_id}/educators"
              payload: { full_name: "Omar Vale", certification_route: "INDUSTRY_EXPERIENCE", claimed_industry_hours: 4200, credential_expires_on: "2029-06-30" }
