      - name: delinquency_estimate_lookback_excludes_prior_estimates_mode_c
        grounds:
          - calculations.delinquency_estimate
          - calculations.percentage_rent_charge
          - entities.SalesReport.fields.source
          - entities.Lease.fields.delinquency_strikes
          - state_machines.SalesReport.PENDING_to_ESTIMATED
          - concurrency_rules[estimate-bill-stale-lease-year]
        distinguishing_aspect: |
          Mode (c): the estimate feeds the very cumulative that the next estimate's charge is
          computed from, so evaluation order must be pinned - the lookback window is built from
          pre-posting state and drops every LANDLORD_ESTIMATE row, making the November estimate
          33,000,000 (from the single tenant-reported 30,000,000) rather than the 36,300,000 a
