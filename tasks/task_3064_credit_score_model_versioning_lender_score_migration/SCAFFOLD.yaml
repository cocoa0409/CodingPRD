    side_effects: []

  - method: POST
    path: "/reason-codes/{reasonCodeId}/archive"
    description: "Archive a leaf reason code; cascades C10 and records the invariant-B snapshot"
    roles: [ReasonCodeAdministrator]
    code: 200
    input: []
    output: ReasonCode
    side_effects:
      - "status → ARCHIVED; archived_consumed_entitlement_snapshot captured"
      - "hop 1 of C10: bound reference sets → RECONCILED"
      - "hop 2 of C10: their postings → decision UNDECIDED"
      - "hop 3 of C10: Consumer.model_undecided_count recomputed"
      - "hop 4 of C10: consumers at 3 or more undecided postings have those postings → DECLINE"
      - "hop 5 of C10: decision_reason_code_id set to the lowest-composite-code ACTIVE PRIMARY code on the effective variant"
      - "hop 1 of C11: those postings re-derive effective_score and odds_at_posted_score"

  - method: POST
    path: "/reason-codes/{reasonCodeId}/restore"
    description: "Reverse an archive and re-consume the invariant-B snapshot"
    roles: [ReasonCodeAdministrator]
    code: 200
    input: []
    output: ReasonCode
    side_effects:
      - "status → ACTIVE; weight_received_pct re-derived from archived descendants below the bubble-up floor"
      - "hop 2 of C11: fee-ledger reversals appended for every license whose cumulative_score_count differs from its snapshot share"

