              as: CommissionClerk
              as_user_id: "clerk-1"
          assert:
            - "the hearing whose notice_published_at is 9 days before scheduled_start returns HTTP 422 with error_id == \"ERR_NOTICE_PERIOD_TOO_SHORT\""
            - "the identical hearing with notice_published_at exactly HEARING_NOTICE_DAYS (10) days earlier is created with HTTP 201 and status \"SCHEDULED\" - the comparison is notice_published_at <= scheduled_start - 10 days, inclusive at the boundary"
            - "opening it while the clock is still 2026-08-01 returns HTTP 409 with error_id == \"ERR_HEARING_NOT_YET_STARTED\""
            - "with the clock set to exactly scheduled_start the open succeeds: status == \"OPEN\" and opened_at == \"2026-10-05T18:00:00.000Z\""
            - "a second open returns HTTP 409 with error_id == \"ERR_HEARING_NOT_SCHEDULED\" - open is not idempotent and the id names the state it required"
            - "RECOMMEND on the OPEN commission hearing returns HTTP 409 with error_id == \"ERR_ENVIRONMENTAL_REVIEW_NOT_CERTIFIED\": the plan is STATE_CERTIFIED and the posture is CLEAR, but the EIR that was good enough for state submission (CIRCULATED) is not good enough for a recommendation"
            - "selecting the preferred alternative (Alternative A, net 40.00) and certifying the review then makes the SAME RECOMMEND succeed: the hearing closes as status \"RECOMMENDED\" with outcome \"RECOMMEND\" and the plan advances to \"COMMISSION_RECOMMENDED\""
            - "a further CONTINUE on that hearing returns HTTP 409 with error_id == \"ERR_HEARING_NOT_OPEN\" - RECOMMENDED is terminal"
            - "both COUNCIL hearings are now schedulable (the plan is COMMISSION_RECOMMENDED) and both can be opened once the clock reaches their scheduled_start; the certified review satisfies the COUNCIL-only open gate"
            - "DENY on the first council hearing closes it as status \"DENIED\" with outcome \"DENY\" and demotes the plan: status \"DRAFTING\", state_review_status \"NOT_SUBMITTED\", the five APPROVED elements become REVISION_REQUESTED with revision_round 1, the CLEARED consistency link returns to OPEN, and compliance_posture becomes \"CONSISTENCY_HOLD\""
            - "the second council hearing is untouched by the demotion because it is OPEN, not SCHEDULED - only SCHEDULED hearings are BLOCKED"
            - "ADOPT on that still-OPEN council hearing returns HTTP 409 with error_id == \"ERR_PLAN_NOT_RECOMMENDED\" - the plan-state check at priority 50 wins over the posture check at priority 61, even though the posture is also not CLEAR"
            - "the refused ADOPT leaves the hearing at status \"OPEN\" with outcome == null, the plan at \"DRAFTING\" with adopted_at == null, and every element still in REVISION_REQUESTED"
            - "the COUNCIL-filtered hearing list returns total_count == 2, one DENIED and one OPEN"

  - section: rbac
    instances:
      - name: every_role_can_perform_its_own_signature_operation
        claim_type: exclusive_operations
        grounds:
          - roles.PlanningStaff.exclusive_operations
          - roles.PlanningDirector.exclusive_operations
          - roles.EnvironmentalConsultant.exclusive_operations
          - roles.CommissionClerk.exclusive_operations
          - roles.StateReviewer.exclusive_operations
          - roles.shared_operations
        distinguishing_aspect: |
          Five roles with disjoint exclusive lists means the authorization table has five positive
          directions, and a negative-only RBAC test suite can be passed by an implementation that
          rejects everything. This instance walks the positive direction once per role, choosing for
          each the cheapest exclusive operation that role owns. The CommissionClerk is the
          interesting case: every one of its seven exclusive operations needs a plan that reached
          STATE_CERTIFIED, so its authority is proven here the indirect way - the clerk's
          POST /planning/hearings on a DRAFTING plan is refused with a 409 business error
          (ERR_PLAN_NOT_CERTIFIED), which can only happen if the role gate at priority 20 was
          already satisfied. The same call as PlanningStaff must be a 403 instead, and the contrast
          between the two responses is the actual assertion. The instance then pins the two shared
          surfaces that every role holds: all five roles read the same plan, and all five may set
          the logical clock - the only write in the API with a five-role list.
        test_recipe:
          setup:
            - "One DRAFTING plan created by the PlanningDirector - itself the director's signature exclusive operation."
          setup_api_calls:
            - call: "POST /planning/plan-updates"
              payload: { title: "Horizon 2045 General Plan", jurisdiction_code: "CA-0451", base_year: 2025, horizon_year: 2045 }
              as: PlanningDirector
              as_user_id: "director-1"
              captures: { pu: $.data.id, pu_st: $.data.status }
          trigger:
            - call: "POST /planning/inventory-datasets"
              payload: { plan_update_id: "${pu}", inventory_type: "DEMOGRAPHIC", vintage_year: 2025, record_count: 1200 }
              as: PlanningStaff
              as_user_id: "staff-1"
              captures: { inv: $.data.id }
            - call: "POST /planning/environmental-reviews"
              payload: { plan_update_id: "${pu}", document_type: "ND", title: "Horizon 2045 Negative Declaration" }
              as: EnvironmentalConsultant
              as_user_id: "consultant-1"
              captures: { rev: $.data.id }
            - call: "POST /planning/housing-allocations"
              payload: { plan_update_id: "${pu}", income_tier: "VERY_LOW", assigned_units: 900, cycle_deadline: "2031-06-30T00:00:00Z" }
              as: StateReviewer
              as_user_id: "state-1"
              captures: { alloc: $.data.id }
            - call: "POST /planning/hearings"
              payload: { plan_update_id: "${pu}", body_type: "COMMISSION", scheduled_start: "2026-10-05T18:00:00Z", scheduled_end: "2026-10-05T21:00:00Z", notice_published_at: "2026-09-25T18:00:00Z" }
              as: CommissionClerk
              as_user_id: "clerk-1"
              captures: { e_clerk: $.data.error_id }
            - call: "POST /planning/hearings"
              payload: { plan_update_id: "${pu}", body_type: "COMMISSION", scheduled_start: "2026-10-05T18:00:00Z", scheduled_end: "2026-10-05T21:00:00Z", notice_published_at: "2026-09-25T18:00:00Z" }
              as: PlanningStaff
              as_user_id: "staff-1"
              captures: { e_staff: $.data.error_id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-02T00:00:00Z" }
              as: PlanningStaff
              as_user_id: "staff-1"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T00:00:00Z" }
              as: PlanningDirector
              as_user_id: "director-1"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-04T00:00:00Z" }
              as: EnvironmentalConsultant
              as_user_id: "consultant-1"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-05T00:00:00Z" }
              as: CommissionClerk
              as_user_id: "clerk-1"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-06T00:00:00Z" }
              as: StateReviewer
              as_user_id: "state-1"
              captures: { clock5: $.data.current_utc }
            - call: "GET /planning/plan-updates/${pu}"
              as: PlanningStaff
              as_user_id: "staff-1"
            - call: "GET /planning/plan-updates/${pu}"
              as: PlanningDirector
              as_user_id: "director-1"
            - call: "GET /planning/plan-updates/${pu}"
              as: EnvironmentalConsultant
              as_user_id: "consultant-1"
            - call: "GET /planning/plan-updates/${pu}"
              as: CommissionClerk
              as_user_id: "clerk-1"
            - call: "GET /planning/plan-updates/${pu}"
              as: StateReviewer
              as_user_id: "state-1"
          assert:
            - "the PlanningDirector's plan create returned HTTP 201 with status \"DRAFTING\""
            - "the PlanningStaff inventory create, the EnvironmentalConsultant review create and the StateReviewer housing-allocation create each return HTTP 201 - three exclusive lists, three successes"
            - "the CommissionClerk's hearing create returns HTTP 409 with error_id == \"ERR_PLAN_NOT_CERTIFIED\": a BUSINESS error, which proves the clerk passed the role gate"
            - "the byte-identical hearing create as PlanningStaff returns HTTP 403 with error_id == \"ERR_ROLE_NOT_PERMITTED\" - the role gate at priority 20 runs before the plan-state check at priority 50, so the two callers get different failures for the same body"
            - "all five roles may set the logical clock: the last call returns HTTP 200 with current_utc == \"2026-08-06T00:00:00.000Z\", so the StateReviewer - which owns only two exclusive writes - still holds this shared one"
            - "all five roles receive HTTP 200 from the same GET, with identical bodies"
            - "no read and no refused write changed the plan's version"

      - name: cross_role_and_unauthenticated_refusals
        claim_type: forbidden_operations
        grounds:
          - roles.PlanningStaff.exclusive_operations
          - roles.PlanningDirector.exclusive_operations
          - roles.EnvironmentalConsultant.exclusive_operations
          - roles.CommissionClerk.exclusive_operations
          - roles.StateReviewer.exclusive_operations
          - errors[ERR_ROLE_NOT_PERMITTED]
          - errors[ERR_UNAUTHENTICATED]
          - validations.priority_10_authentication
          - validations.priority_20_role
        distinguishing_aspect: |
          The peer-role structure here is unusually strict: nobody outranks anybody. In particular
          the PlanningDirector - the department head - may NOT create an inventory, draft an element
          or run an engagement activity, which is exactly the assumption a "seniority" implementation
          gets wrong by letting the director do everything staff can do. This instance fires one
          forbidden write per role in a ring so each role is both a victim and an offender, then adds
          the two orderings that matter. First, priority 10 outranks priority 20: an unauthenticated
          call to an endpoint the caller would not be allowed to use anyway must return 401
          ERR_UNAUTHENTICATED, never 403 - the server cannot know the role it should reject. Second,
          priority 20 outranks priority 60: PlanningStaff certifying the inventory it authored gets
          403 ERR_ROLE_NOT_PERMITTED, NOT ERR_SEGREGATION_OF_DUTIES, even though both refusals are
          403 - the two ids are distinguishable only if the checks run in the declared order.
        test_recipe:
          setup:
            - "One plan, one DRAFT inventory authored by staff-1 and one DRAFT element authored by staff-1."
          setup_api_calls:
            - call: "POST /planning/plan-updates"
              payload: { title: "Horizon 2045 General Plan", jurisdiction_code: "CA-0451", base_year: 2025, horizon_year: 2045 }
              as: PlanningDirector
              as_user_id: "director-1"
              captures: { pu: $.data.id }
            - call: "POST /planning/inventory-datasets"
              payload: { plan_update_id: "${pu}", inventory_type: "DEMOGRAPHIC", vintage_year: 2025, record_count: 1200 }
              as: PlanningStaff
              as_user_id: "staff-1"
              captures: { inv: $.data.id }
            - call: "POST /planning/plan-elements"
              payload: { plan_update_id: "${pu}", element_type: "PARKS", title: "Parks Element", draft_body: "Open space standards.", policy_count: 3 }
              as: PlanningStaff
              as_user_id: "staff-1"
              captures: { el: $.data.id }
          trigger:
            - call: "POST /planning/plan-updates"
              payload: { title: "A plan staff may not open", jurisdiction_code: "CA-0453", base_year: 2025, horizon_year: 2045 }
              as: PlanningStaff
              as_user_id: "staff-1"
              captures: { e1: $.data.error_id }
            - call: "POST /planning/inventory-datasets"
              payload: { plan_update_id: "${pu}", inventory_type: "HOUSING", vintage_year: 2025, record_count: 900 }
              as: PlanningDirector
              as_user_id: "director-1"
              captures: { e2: $.data.error_id }
            - call: "POST /planning/plan-elements"
              payload: { plan_update_id: "${pu}", element_type: "TRANSPORTATION", title: "Mobility Element", draft_body: "Not the consultant's job.", policy_count: 3 }
              as: EnvironmentalConsultant
              as_user_id: "consultant-1"
              captures: { e3: $.data.error_id }
            - call: "POST /planning/housing-allocations"
              payload: { plan_update_id: "${pu}", income_tier: "LOW", assigned_units: 700, cycle_deadline: "2031-06-30T00:00:00Z" }
              as: CommissionClerk
              as_user_id: "clerk-1"
              captures: { e4: $.data.error_id }
            - call: "POST /planning/environmental-reviews"
              payload: { plan_update_id: "${pu}", document_type: "ND", title: "Not the state's document" }
              as: StateReviewer
              as_user_id: "state-1"
              captures: { e5: $.data.error_id }
            - call: "PATCH /planning/plan-elements/${el}"
              payload: { policy_count: 9 }
              as: CommissionClerk
              as_user_id: "clerk-1"
              captures: { e6: $.data.error_id }
            - call: "POST /planning/inventory-datasets/${inv}/certify"
              as: PlanningStaff
              as_user_id: "staff-1"
              captures: { e7: $.data.error_id }
            - call: "POST /planning/plan-updates"
              payload: { title: "An anonymous plan", jurisdiction_code: "CA-0454", base_year: 2025, horizon_year: 2045 }
              as: none
              captures: { e8: $.data.error_id }
            - call: "GET /planning/plan-updates/${pu}"
              as: none
              captures: { e9: $.data.error_id }
            - call: "GET /planning/plan-updates"
              as: PlanningDirector
              as_user_id: "director-1"
            - call: "GET /planning/inventory-datasets/${inv}"
              as: PlanningStaff
              as_user_id: "staff-1"
            - call: "GET /planning/plan-elements/${el}"
              as: PlanningStaff
              as_user_id: "staff-1"
          assert:
            - "PlanningStaff creating a plan, PlanningDirector creating an inventory, EnvironmentalConsultant creating an element, CommissionClerk creating a housing allocation and StateReviewer creating an environmental review each return HTTP 403 with error_id == \"ERR_ROLE_NOT_PERMITTED\""
            - "the director's refusal is the load-bearing one: exclusive lists are disjoint peers, so the department head genuinely cannot author staff work"
            - "the CommissionClerk's PATCH on the element also returns 403 ERR_ROLE_NOT_PERMITTED - the only shared write besides the clock is limited to PlanningStaff and PlanningDirector"
            - "PlanningStaff certifying the inventory it authored returns HTTP 403 with error_id == \"ERR_ROLE_NOT_PERMITTED\", NOT \"ERR_SEGREGATION_OF_DUTIES\": priority 20 precedes priority 60, and both refusals are 403 so only the id distinguishes them"
            - "the unauthenticated POST returns HTTP 401 with error_id == \"ERR_UNAUTHENTICATED\" - not 403, even though PlanningStaff would also have been forbidden had a role been supplied"
            - "the unauthenticated GET on an existing plan returns HTTP 401 as well: reads are open to all five roles but not to no role at all"
            - "the plan list still returns total_count == 1, the inventory is still status \"DRAFT\" with certified_by_user_id == null, and the element still has policy_count == 3 - eight refusals, zero writes"

      - name: approvals_require_a_second_pair_of_eyes
        claim_type: segregation_of_duties
        grounds:
          - validations.priority_60_segregation_of_duties
          - errors[ERR_SEGREGATION_OF_DUTIES]
          - roles.PlanningDirector
        distinguishing_aspect: |
          The role model is declared as segregation_of_duties, and because role identity is opaque
          the check cannot lean on the role name: it compares X-User-ID against the id recorded on
          the row by the PREVIOUS step (InventoryDataset.authored_by_user_id,
          PlanElement.authored_by_user_id, Amendment.proposed_by_user_id). That makes the failing
          case a caller that presents a legitimate approving role AND the authoring user id - a
          combination an implementation that only compares roles can never detect, and one that a
          test using different user ids per role can never produce. This instance therefore replays
          the same approval twice with only the X-User-ID changed: identical role, identical body,
          identical target, one refusal and one success. It also pins that the refusal is stateless -
          the element stays IN_REVIEW and can still be approved by anyone else afterwards, so a
          rejected approval does not consume the review.
        test_recipe:
          setup:
            - "One plan; one inventory authored by the user id \"shared-user\"; one element also authored by \"shared-user\" and submitted for review."
          setup_api_calls:
            - call: "POST /planning/plan-updates"
              payload: { title: "Horizon 2045 General Plan", jurisdiction_code: "CA-0451", base_year: 2025, horizon_year: 2045 }
              as: PlanningDirector
              as_user_id: "director-1"
              captures: { pu: $.data.id }
            - call: "POST /planning/inventory-datasets"
              payload: { plan_update_id: "${pu}", inventory_type: "DEMOGRAPHIC", vintage_year: 2025, record_count: 1200 }
              as: PlanningStaff
              as_user_id: "shared-user"
              captures: { inv: $.data.id, inv_author: $.data.authored_by_user_id }
            - call: "POST /planning/plan-elements"
              payload: { plan_update_id: "${pu}", element_type: "PARKS", title: "Parks Element", draft_body: "Open space standards.", policy_count: 3 }
              as: PlanningStaff
              as_user_id: "shared-user"
              captures: { el: $.data.id, el_author: $.data.authored_by_user_id }
            - call: "POST /planning/plan-elements/${el}/submit-review"
              as: PlanningStaff
              as_user_id: "shared-user"
              captures: { el_st: $.data.status }
          trigger:
            - call: "POST /planning/plan-elements/${el}/review-decision"
              payload: { decision: "APPROVE", review_note: "Approving my own draft." }
              as: PlanningDirector
              as_user_id: "shared-user"
              captures: { e_sod_el: $.data.error_id }
            - call: "GET /planning/plan-elements/${el}"
              as: PlanningStaff
              as_user_id: "staff-1"
            - call: "POST /planning/plan-elements/${el}/review-decision"
              payload: { decision: "APPROVE", review_note: "Reviewed independently." }
              as: PlanningDirector
              as_user_id: "director-1"
              captures: { el_ok: $.data.status, el_reviewer: $.data.reviewed_by_user_id }
            - call: "POST /planning/inventory-datasets/${inv}/certify"
              as: PlanningDirector
              as_user_id: "shared-user"
              captures: { e_sod_inv: $.data.error_id }
            - call: "POST /planning/inventory-datasets/${inv}/certify"
              as: PlanningDirector
              as_user_id: "director-1"
              captures: { inv_ok: $.data.status, inv_certifier: $.data.certified_by_user_id }
            - call: "GET /planning/plan-updates/${pu}"
              as: PlanningDirector
              as_user_id: "director-1"
          assert:
            - "the review-decision presented as PlanningDirector but with X-User-ID equal to the element's authored_by_user_id returns HTTP 403 with error_id == \"ERR_SEGREGATION_OF_DUTIES\""
            - "the element is still status \"IN_REVIEW\" after the refusal with reviewed_by_user_id == null - a rejected approval consumes nothing"
            - "the identical call from a different X-User-ID under the same role succeeds: status == \"APPROVED\" and reviewed_by_user_id == \"director-1\""
            - "the inventory certify shows the same pattern on a different entity: X-User-ID \"shared-user\" is refused with ERR_SEGREGATION_OF_DUTIES, and \"director-1\" then certifies it to status \"CERTIFIED\" with certified_by_user_id == \"director-1\""
            - "the two refusals are 403 like a role failure but carry a DIFFERENT error_id, and they occur with a role that IS permitted - so role and identity are two independent gates"
            - "the plan reports required_elements_complete_count == 1 after the successful approval, proving the accepted call ran its full side-effect set while the refused one ran none"

  - section: complexity_layers
    instances:
      - name: inventory_version_pin_on_scenario_creation
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[scenario-create-stale-inventory]
          - errors[ERR_STALE_INVENTORY_VERSION]
          - state_machines.GrowthScenario.null_to_DRAFT.side_effects
          - entities.InventoryDataset.referencing_scenario_count
          - validations.priority_50_state
          - validations.priority_55_occ
        distinguishing_aspect: |
          This OCC rule is unusual in that the write does not modify the row it pins: creating a
          GrowthScenario reads acreage off a CERTIFIED LAND_USE inventory and yet bumps that
          inventory's version as a side effect, because referencing_scenario_count changed. So every
          successful scenario creation invalidates the version token that the analyst is holding -
          the second scenario against the same dataset must use a token one higher than the first,
          even though nothing about the acreage changed. An implementation that only bumps version on
          "real" edits will happily accept the same token twice and silently let two scenarios be
          computed against readings taken at different times.
          The instance walks that ladder: correct token, bump, replay of the SAME token, refreshed
          token. It also pins that 412 is a check, not a mood: the refused write must leave
          referencing_scenario_count and version untouched, so a stale attempt cannot itself advance
          the token. Finally it pins the 50-before-55 ordering with a call that violates both - a
          certified DEMOGRAPHIC dataset passed as land_use_inventory_id together with a stale token
          must return the 409 type mismatch, not the 412, because a version check against the wrong
          entity is meaningless.
        test_recipe:
          setup:
            - "One DRAFTING plan with horizon_year 2045, one CERTIFIED LAND_USE inventory (vacant 400, underutilized 250, constrained 100, density 18) and one CERTIFIED DEMOGRAPHIC inventory."
          setup_api_calls:
            - call: "POST /planning/plan-updates"
              payload: { title: "Horizon 2045 General Plan", jurisdiction_code: "CA-0451", base_year: 2025, horizon_year: 2045 }
              as: PlanningDirector
              as_user_id: "director-1"
              captures: { pu: $.data.id }
            - call: "POST /planning/inventory-datasets"
              payload: { plan_update_id: "${pu}", inventory_type: "LAND_USE", vintage_year: 2025, vacant_acres: 400, underutilized_acres: 250, infrastructure_constrained_acres: 100, allowed_density_units_per_acre: 18 }
              as: PlanningStaff
              as_user_id: "staff-1"
              captures: { i_lu: $.data.id }
            - call: "POST /planning/inventory-datasets"
              payload: { plan_update_id: "${pu}", inventory_type: "DEMOGRAPHIC", vintage_year: 2025, record_count: 1200 }
              as: PlanningStaff
              as_user_id: "staff-1"
              captures: { i_dem: $.data.id }
            - call: "POST /planning/inventory-datasets/${i_lu}/certify"
              as: PlanningDirector
              as_user_id: "director-1"
              captures: { v1: $.data.version, rc0: $.data.referencing_scenario_count }
            - call: "POST /planning/inventory-datasets/${i_dem}/certify"
              as: PlanningDirector
              as_user_id: "director-1"
              captures: { dv1: $.data.version }
          trigger:
            - call: "POST /planning/growth-scenarios"
              payload: { plan_update_id: "${pu}", land_use_inventory_id: "${i_lu}", expected_inventory_version: "${v1}", label: "Trend 2045", method: "TREND", horizon_year: 2045, base_households: 20000, annual_household_growth_rate: 0.012, job_growth_total: 15000, demolition_replacement_units: 500 }
              as: PlanningStaff
              as_user_id: "staff-1"
              captures: { sc1: $.data.id, sc1_cap: $.data.land_capacity_units }
            - call: "GET /planning/inventory-datasets/${i_lu}"
              as: PlanningStaff
              as_user_id: "staff-1"
              captures: { v2: $.data.version, rc1: $.data.referencing_scenario_count }
            - call: "POST /planning/growth-scenarios"
              payload: { plan_update_id: "${pu}", land_use_inventory_id: "${i_lu}", expected_inventory_version: "${v1}", label: "Trend 2045 replay on a stale token", method: "TREND", horizon_year: 2045, base_households: 20000, annual_household_growth_rate: 0.012, job_growth_total: 15000, demolition_replacement_units: 500 }
              as: PlanningStaff
              as_user_id: "staff-1"
              captures: { e_stale: $.data.error_id }
            - call: "GET /planning/inventory-datasets/${i_lu}"
              as: PlanningStaff
              as_user_id: "staff-1"
              captures: { v2b: $.data.version, rc1b: $.data.referencing_scenario_count }
            - call: "POST /planning/growth-scenarios"
              payload: { plan_update_id: "${pu}", land_use_inventory_id: "${i_lu}", expected_inventory_version: "${v2}", label: "Policy 2045", method: "POLICY", horizon_year: 2045, base_households: 20000, annual_household_growth_rate: 0.012, job_growth_total: 15000, demolition_replacement_units: 500 }
              as: PlanningStaff
              as_user_id: "staff-1"
              captures: { sc2: $.data.id, sc2_cap: $.data.land_capacity_units }
            - call: "GET /planning/inventory-datasets/${i_lu}"
              as: PlanningStaff
              as_user_id: "staff-1"
              captures: { v3: $.data.version, rc2: $.data.referencing_scenario_count }
            - call: "POST /planning/growth-scenarios"
              payload: { plan_update_id: "${pu}", land_use_inventory_id: "${i_dem}", expected_inventory_version: "${v1}", label: "Pinned to the wrong dataset", method: "TREND", horizon_year: 2045, base_households: 20000, annual_household_growth_rate: 0.012, job_growth_total: 15000, demolition_replacement_units: 500 }
              as: PlanningStaff
              as_user_id: "staff-1"
              captures: { e_type: $.data.error_id }
            - call: "GET /planning/growth-scenarios"
              as: PlanningStaff
              as_user_id: "staff-1"
          assert:
            - "the first scenario create with expected_inventory_version == ${v1} returns HTTP 201 with land_capacity_units == 11700"
            - "the inventory's version is now exactly ${v1} + 1 and referencing_scenario_count == 1 - a read-only reference still advances the token"
            - "replaying the identical body with the now-stale ${v1} returns HTTP 412 with error_id == \"ERR_STALE_INVENTORY_VERSION\""
            - "after the 412 the inventory's version is still ${v2} and referencing_scenario_count is still 1: the rejected write neither advanced the token nor counted as a reference"
            - "the same create with the refreshed ${v2} returns HTTP 201 - many scenarios may legitimately pin one dataset, which is exactly why a state precondition could not have expressed this rule"
            - "the second scenario uses method POLICY on identical acreage and returns land_capacity_units == 7115, so the two accepted writes differ in output while sharing one dataset"
            - "the inventory's version is now ${v2} + 1 with referencing_scenario_count == 2"
            - "passing the CERTIFIED DEMOGRAPHIC dataset as land_use_inventory_id together with the stale ${v1} returns HTTP 409 with error_id == \"ERR_INVENTORY_TYPE_MISMATCH\" - priority 50 outranks priority 55, and a version compared against the wrong entity must never be reported as the failure"
            - "the scenario list holds total_count == 2 - exactly the two accepted creates"

      - name: element_version_pin_across_docketed_amendments
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[amendment-create-stale-element]
          - errors[ERR_STALE_ELEMENT_VERSION]
          - errors[ERR_CROSS_PLAN_AMENDMENT]
          - errors[ERR_AMENDMENT_NOT_PROPOSED]
          - errors[ERR_AMENDMENT_NOT_ADOPTED]
          - errors[ERR_UNRESOLVED_AMENDMENTS]
          - errors[ERR_POLICY_COUNT_NEGATIVE]
          - state_machines.Amendment
          - invariants.policy_count_conservation
          - validations.priority_74_outcome_legality
        distinguishing_aspect: |
          The element OCC token is the hardest one in the API to hold, because the act of docketing an
          amendment bumps the version of the element it targets without changing a single field the
          clerk cares about. That makes the natural workflow - move two amendments on the same element
          during one hearing - a guaranteed 412 on the second unless the clerk re-reads in between.
          The instance drives that ladder and then uses the same open hearing to sweep the amendment
          register's remaining refusals, all of which need an OPEN hearing on a STATE_CERTIFIED plan
          and would otherwise ship untested.
          Three of them are subtle. ERR_CROSS_PLAN_AMENDMENT is only isolable if the foreign element
          is APPROVED and its token is CORRECT: priority 55 sits above priority 70, so an amendment
          pointing at another plan's DRAFT element with a guessed version would report the state or
          version failure and never the ownership failure. ERR_AMENDMENT_NOT_ADOPTED is fired on a
          WITHDRAWN amendment, not a PROPOSED one, so the two "wrong status" ids are pinned against
          the same row from opposite directions. And ERR_UNRESOLVED_AMENDMENTS makes an outcome
          impossible while the register is open: the clerk cannot close a hearing by ignoring the
          motions moved at it, which is checked at priority 74 - after the hearing state, so it is
          the ONLY violation at that point.
          The closing arc is the compensation: adopting an amendment moves policy_count 6 -> 8, and
          rescinding it must land back on exactly 6 with the element's status restored from
          prior_element_status, satisfying policy_count_conservation. A rescinded amendment is not
          PROPOSED, so the RECOMMEND that follows is legal even though three amendments exist.
        test_recipe:
          setup:
            - "Plan A driven to STATE_CERTIFIED with a CERTIFIED EIR: four certified inventories, an adopted TREND scenario, five APPROVED elements each with policy_count 6, four allocations leaving shortfall 0, a reconciled TRANSPORTATION -> LAND_USE link, and a completed workshop giving equity_share_pct 40.0."
            - "A COMMISSION hearing on plan A, noticed exactly HEARING_NOTICE_DAYS ahead, opened after the clock reaches its scheduled_start."
            - "Plan B is a second DRAFTING plan holding one APPROVED PARKS element, used only as the foreign amendment target."
            - "The clock ends setup at 2026-10-05T18:00:00Z."
          setup_api_calls:
            - call: "POST /planning/plan-updates"
              payload: { title: "Horizon 2045 General Plan", jurisdiction_code: "CA-0451", base_year: 2025, horizon_year: 2045 }
              as: PlanningDirector
              as_user_id: "director-1"
              captures: { pu: $.data.id }
