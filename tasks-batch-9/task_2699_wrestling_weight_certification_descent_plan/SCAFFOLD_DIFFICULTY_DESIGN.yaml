  - rule_id: boundary_precision_check
    instances:
      - name: weigh_in_effective_limit_inclusive_boundary
        boundary_metric: "recorded_weight_lbs vs effective_limit_lbs at 1-decimal precision (inclusive upper bound)"
        endpoint: "POST /events/{id}/weigh-ins"
        grounds:
          - calculations.weigh_in_allowance_and_result
          - entities.WeighIn.fields.effective_limit_lbs
          - entities.WeighIn.fields.result
          - entities.Season.constants.max_consecutive_day_allowance_lbs
        distinguishing_aspect: |
          Metric is a weight-versus-limit comparison at exactly 1 decimal place, on the weigh-in
          endpoint. The limit itself moves between the two probes because the consecutive-day
          allowance grows: day 0 limit is 150 + 4.0 = 154.0 and a recorded 154.0 sits EXACTLY on the
          inclusive bound (PASS_WITH_ALLOWANCE), while day 1 limit is 150 + 5.0 = 155.0 and a
          recorded 155.1 is one tenth of a pound over (FAIL). An implementation that uses a strict
          `<` or that rounds 155.1 to 155 passes the wrong verdict.
        test_recipe:
          setup:
            - "One OPEN Season with max_consecutive_day_allowance_lbs 2.0 and GrowthAllowance rows 2026-12-01 => 1.0 and 2026-12-12 => 3.0, so G == 4.0 for any event dated on or after 2026-12-12."
            - "Alex Mercer CERTIFIED on a certified WEEKLY_STEP plan; minimum_certified_weight_lbs 147.6, min_weight_class_lbs 150, and lowest_eligible_class_at_date('2026-12-12') == 150."
            - "One event 'Region Duals' dated 2026-12-12 with competition_days 2, weigh_in_days 2, consecutive_day_allowance_lbs 1.0, moved to WEIGH_IN_OPEN, holding Alex's ENTERED entry at weight_class_lbs 150."
