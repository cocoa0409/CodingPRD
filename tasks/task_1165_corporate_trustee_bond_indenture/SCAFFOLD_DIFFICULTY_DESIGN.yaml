            - { call: "POST /positions", payload: { tranche_id: "${t1}", noteholder_account_id: "${nha}", original_principal_cents: 400000000 }, as: PlatformAdmin }
            - { call: "POST /noteholder-accounts", payload: { holder_ref: "H-R", legal_name: "Holder R", contact_email: "r@x.com" }, as: PlatformAdmin, captures: { nhr: $.data.id } }
            - { call: "POST /positions", payload: { tranche_id: "${t1}", noteholder_account_id: "${nhr}", original_principal_cents: 600000000 }, as: PlatformAdmin }
            - { call: "POST /default-cases", payload: { indenture_id: "${ind}", default_type: "PAYMENT", cure_deadline: "2026-12-31T00:00:00Z" }, as: TrustOfficer, as_user_id: "officer-1", captures: { dc: $.data.id } }
            - { call: "POST /default-cases/${dc}/confirm", payload: {}, as: TrustManager, as_user_id: "manager-1" }
            - { call: "GET /default-cases/${dc}", payload: {}, as: TrustOfficer, captures: { dc_v: $.data.version } }
            - { call: "POST /directions", payload: { default_case_id: "${dc}", instruction_type: "ACCELERATE", expires_at: "2026-12-31T00:00:00Z", expected_default_case_version: "${dc_v}" }, as: TrustOfficer, captures: { dir: $.data.id } }
            - { call: "POST /directions/${dir}/endorsements", payload: { noteholder_account_id: "${nha}" }, as: Noteholder, as_user_id: "${nha}", captures: { end_a: $.data.id } }
            - { call: "GET /directions/${dir}", payload: {}, as: TrustOfficer, captures: { sup_mid: $.data.supporting_principal_cents, st_mid: $.data.status } }
          trigger:
            - { call: "POST /direction-endorsements/${end_a}/withdraw", payload: {}, as: Noteholder, as_user_id: "${nha}" }
            - { call: "GET /directions/${dir}", payload: {}, as: TrustOfficer }
          assert:
            - "captured sup_mid == 400000000 and st_mid == EFFECTIVE (400000000*4 >= 1000000000)"
            - "after withdrawal: supporting_principal_cents == 0 — exactly the pre-endorsement value (conserved)"
            - "NoteholderDirection.${dir}.status == CIRCULATING (threshold lost)"
            - "DirectionEndorsement.${end_a}.status == WITHDRAWN; eligible_principal_cents == 1000000000 (unchanged)"

      - name: interest_execute_settle_reverse_cash_conservation
