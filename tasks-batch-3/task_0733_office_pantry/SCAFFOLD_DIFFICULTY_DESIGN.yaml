              as_user_id: "${loc_id}"
            - call: "POST /clients/${client_id}/subscriptions"
              payload: { plan_id: "${plan_id}", expected_client_version: "${client_v}" }
              as: ClientAdmin
              as_user_id: "${client_id}"
              captures: { sub_id: "$.data.id" }
            - call: "POST /subscriptions/${sub_id}/activate"
              payload: {}
              as: PlatformAdmin
            - call: "GET /subscriptions/${sub_id}/rotation-cycles"
              payload: {}
              as: PlatformAdmin
              captures: { rc0_id: "$.data[0].id" }
            - call: "POST /rotation-cycles/${rc0_id}/deliveries"
              payload: { location_id: "${loc_id}", scheduled_at: "2026-06-01T12:00:00Z" }
              as: PlatformAdmin
              captures: { delv1_id: "$.data.id" }
          trigger:
            - call: "POST /rotation-cycles/${rc0_id}/deliveries"
              payload: { location_id: "${loc_id}", scheduled_at: "2026-06-02T12:00:00Z" }
              as: PlatformAdmin
              captures: { delv2_id: "$.data.id", status2: "$.data.status" }
          assert:
            - "status2 == 'SCHEDULED'"

  # =========================================================================
  # Rule 7 - cross_entity_state_dependency (different entity pairs)
  # (i)  Delivery.dispatch precondition on Subscription.status
  # (ii) RotationCycle.close precondition on Delivery status set
  # =========================================================================
  - rule_id: cross_entity_state_dependency
    instances:

      - name: delivery_dispatch_after_pause_cascade_precondition_pair
        grounds:
          - state_machines.Delivery.SCHEDULED_to_EN_ROUTE
          - state_machines.Subscription.ACTIVE_to_PAUSED
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: |
          The dispatch transition Delivery.SCHEDULED_to_EN_ROUTE has TWO
          cross-entity preconditions -- delivery.status==SCHEDULED AND
          subscription.status==ACTIVE. After pause cascades, BOTH are violated.
          The observable error is ERR_INVALID_STATE (delivery-state category)
          because priority 12 wins over priority 13, but the presence of BOTH
          preconditions is the Rule 7 evidence. Entity pair: Delivery -> Subscription.
        test_recipe:
          setup:
            - "ACTIVE Subscription + SCHEDULED Delivery. Then pause the subscription (cascade cancels the delivery). Now both Delivery.status != SCHEDULED and Subscription.status != ACTIVE."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /plans"
