# =============================================================================
# §1.8 Scaffold Difficulty Design — Test Targeting Index
# Piano Manufacturing Apprenticeship & Concert Instrument Bank
# =============================================================================
scaffold_difficulty_design:
  - rule_id: dual_variant_calc
    instances:
      - name: wip_provisional_vs_actual_diverge_on_same_logs
        grounds:
          - calculations.wip_valuation
          - entities.BuildOrder.fields.wip_value_cents
        distinguishing_aspect: |
          Build-order domain variant: identical stage logs yield ACTUAL 5335000 vs
          PROVISIONAL 13755000 because PROVISIONAL adds planned labor for the three
          untaken forward transitions — the two variants are read from one endpoint.
        test_recipe:
          setup:
            - "MODEL_B build order in SEASONING with logs 100h RIM_BENDING + 30h SEASONING_CHECK; batch allocated"
          setup_api_calls:
            - { call: "POST /piano-works/wood-batches", payload: { species: MAPLE, moisture_content_pct: 12.5 }, as: WorkshopManager, captures: { wb1: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2027-04-29T00:00:00Z" }, as: WorkshopManager }
            - { call: "POST /piano-works/wood-batches/${wb1}/moisture-readings", payload: { moisture_content_pct: 8.0 }, as: WorkshopManager }
            - { call: "POST /piano-works/craftsmen", payload: { name: "Rim Master", specialty: RIM_BENDING }, as: WorkshopManager, captures: { cr_rim: $.data.id } }
            - { call: "POST /piano-works/craftsmen", payload: { name: "Sea Master", specialty: SEASONING_CHECK }, as: WorkshopManager, captures: { cr_sea: $.data.id } }
            - { call: "POST /piano-works/build-orders", payload: { model: MODEL_B, wood_batch_id: "${wb1}" }, as: WorkshopManager, captures: { b_id: $.data.id, bv1: $.data.version } }
            - { call: "POST /piano-works/build-orders/${b_id}/advance", payload: { to_stage: RIM_BENT, hours_applied: 100, expected_build_order_version: "${bv1}" }, as: MasterCraftsman, as_user_id: "${cr_rim}", captures: { bv2: $.data.version } }
            - { call: "POST /piano-works/build-orders/${b_id}/advance", payload: { to_stage: SEASONING, hours_applied: 30, expected_build_order_version: "${bv2}" }, as: MasterCraftsman, as_user_id: "${cr_sea}", captures: { bv3: $.data.version } }
          trigger:
            - { call: "GET /piano-works/build-orders/${b_id}/valuation", as: WorkshopManager }
          assert:
            - "response actual_wip_cents == 5335000"
            - "response provisional_wip_cents == 13755000"
            - "response delta_cents == 8420000"
            - "GET /piano-works/build-orders/${b_id} shows wip_value_cents == 5335000 and version == ${bv3}"

      - name: artist_standing_realized_vs_forward_diverge
        grounds:
          - calculations.performance_standing
          - entities.Artist.fields.standing_forward
        distinguishing_aspect: |
          Artist domain variant: with 2 logged performances and one ON_TOUR loan of
          21 days, REALIZED reads 2 while FORWARD_LOOKING reads 5 — same data, two
          variant fields on the Artist resource, distinct from the BuildOrder WIP pair.
        test_recipe:
          setup:
            - "BANK instrument from a completed MODEL_B build; STANDARD artist (quota 3) with 2 logged performances and one ON_TOUR loan spanning 21 days"
          setup_api_calls:
            - { call: "POST /piano-works/wood-batches", payload: { species: SPRUCE, moisture_content_pct: 11.0 }, as: WorkshopManager, captures: { wb1: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2027-04-29T00:00:00Z" }, as: WorkshopManager }
            - { call: "POST /piano-works/wood-batches/${wb1}/moisture-readings", payload: { moisture_content_pct: 7.9 }, as: WorkshopManager }
            - { call: "POST /piano-works/craftsmen", payload: { name: "Rim Master", specialty: RIM_BENDING }, as: WorkshopManager, captures: { cr_rim: $.data.id } }
            - { call: "POST /piano-works/craftsmen", payload: { name: "Sea Master", specialty: SEASONING_CHECK }, as: WorkshopManager, captures: { cr_sea: $.data.id } }
            - { call: "POST /piano-works/craftsmen", payload: { name: "Act Master", specialty: ACTION_REGULATION }, as: WorkshopManager, captures: { cr_act: $.data.id } }
            - { call: "POST /piano-works/craftsmen", payload: { name: "Voi Master", specialty: VOICING }, as: WorkshopManager, captures: { cr_voi: $.data.id } }
            - { call: "POST /piano-works/build-orders", payload: { model: MODEL_B, wood_batch_id: "${wb1}" }, as: WorkshopManager, captures: { b_id: $.data.id, bv: $.data.version } }
            - { call: "POST /piano-works/build-orders/${b_id}/advance", payload: { to_stage: RIM_BENT, hours_applied: 120, expected_build_order_version: "${bv}" }, as: MasterCraftsman, as_user_id: "${cr_rim}", captures: { bv: $.data.version } }
            - { call: "POST /piano-works/build-orders/${b_id}/advance", payload: { to_stage: SEASONING, hours_applied: 40, expected_build_order_version: "${bv}" }, as: MasterCraftsman, as_user_id: "${cr_sea}", captures: { bv: $.data.version } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2028-04-28T00:00:00Z" }, as: WorkshopManager }
            - { call: "POST /piano-works/build-orders/${b_id}/advance", payload: { to_stage: ACTION_REGULATION, hours_applied: 40, expected_build_order_version: "${bv}" }, as: MasterCraftsman, as_user_id: "${cr_sea}", captures: { bv: $.data.version } }
            - { call: "POST /piano-works/build-orders/${b_id}/advance", payload: { to_stage: VOICING, hours_applied: 200, expected_build_order_version: "${bv}" }, as: MasterCraftsman, as_user_id: "${cr_act}", captures: { bv: $.data.version } }
            - { call: "POST /piano-works/build-orders/${b_id}/advance", payload: { to_stage: COMPLETED, hours_applied: 160, expected_build_order_version: "${bv}" }, as: MasterCraftsman, as_user_id: "${cr_voi}" }
            - { call: "GET /piano-works/instruments", payload: { build_order_id: "${b_id}" }, as: WorkshopManager, captures: { i_id: "$.data[0].id" } }
            - { call: "POST /piano-works/instruments/${i_id}/bank-intake", payload: {}, as: ArtistLiaison }
            - { call: "POST /piano-works/artists", payload: { name: "Art A", tier: STANDARD, performance_quota: 3 }, as: ArtistLiaison, captures: { art_id: $.data.id } }
            - { call: "POST /piano-works/artists/${art_id}/performances", payload: { venue: "Hall 1", performed_at: "2028-04-28T00:00:00Z" }, as: ArtistLiaison }
            - { call: "POST /piano-works/artists/${art_id}/performances", payload: { venue: "Hall 2", performed_at: "2028-04-28T00:00:00Z" }, as: ArtistLiaison }
            - { call: "POST /piano-works/concert-loans", payload: { desired_model: MODEL_B, tour_start: "2028-06-01T00:00:00Z", tour_end: "2028-06-22T00:00:00Z" }, as: Artist, as_user_id: "${art_id}", captures: { ln_id: $.data.id } }
            - { call: "POST /piano-works/concert-loans/${ln_id}/confirm", payload: { instrument_id: "${i_id}", technician_id: "${cr_voi}" }, as: ArtistLiaison }
          trigger:
            - { call: "GET /piano-works/artists/${art_id}", as: ArtistLiaison }
          assert:
            - "standing_realized == 2"
            - "standing_forward == 5"
            - "performances_logged == 2 and status == ACTIVE"

  - rule_id: combinatorial_formula
    instances:
      - name: loan_fee_tier_factor_nested_clamp_mode_a
        grounds:
          - calculations.loan_fee_estimate
          - entities.ConcertLoan.fields.fee_cents
        distinguishing_aspect: |
          Mode (a): fee = clamp(MIN, MAX, weekly_rate[model] * ceil(days/7) * tier_factor)
          — four inputs with nested min/max and tier selection. PRIVILEGED 7-day MODEL_O
          raw fee 51200 clamps UP to 55000; STANDARD 21-day MODEL_O stays 192000.
        test_recipe:
          setup:
            - "MODEL_O instrument in BANK; artist PRIVILEGED with loan1 2029-07-01..2029-07-08 confirmed and returned grade A; artist STANDARD with REQUESTED loan2 2029-09-01..2029-09-22"
          setup_api_calls:
            - { call: "POST /piano-works/wood-batches", payload: { species: MAPLE, moisture_content_pct: 10.5 }, as: WorkshopManager, captures: { wb1: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2027-04-29T00:00:00Z" }, as: WorkshopManager }
            - { call: "POST /piano-works/wood-batches/${wb1}/moisture-readings", payload: { moisture_content_pct: 8.0 }, as: WorkshopManager }
            - { call: "POST /piano-works/craftsmen", payload: { name: "Rim Master", specialty: RIM_BENDING }, as: WorkshopManager, captures: { cr_rim: $.data.id } }
            - { call: "POST /piano-works/craftsmen", payload: { name: "Sea Master", specialty: SEASONING_CHECK }, as: WorkshopManager, captures: { cr_sea: $.data.id } }
            - { call: "POST /piano-works/craftsmen", payload: { name: "Act Master", specialty: ACTION_REGULATION }, as: WorkshopManager, captures: { cr_act: $.data.id } }
            - { call: "POST /piano-works/craftsmen", payload: { name: "Voi Master", specialty: VOICING }, as: WorkshopManager, captures: { cr_voi: $.data.id } }
            - { call: "POST /piano-works/build-orders", payload: { model: MODEL_O, wood_batch_id: "${wb1}" }, as: WorkshopManager, captures: { b_id: $.data.id, bv: $.data.version } }
            - { call: "POST /piano-works/build-orders/${b_id}/advance", payload: { to_stage: RIM_BENT, hours_applied: 120, expected_build_order_version: "${bv}" }, as: MasterCraftsman, as_user_id: "${cr_rim}", captures: { bv: $.data.version } }
            - { call: "POST /piano-works/build-orders/${b_id}/advance", payload: { to_stage: SEASONING, hours_applied: 40, expected_build_order_version: "${bv}" }, as: MasterCraftsman, as_user_id: "${cr_sea}", captures: { bv: $.data.version } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2028-04-28T00:00:00Z" }, as: WorkshopManager }
            - { call: "POST /piano-works/build-orders/${b_id}/advance", payload: { to_stage: ACTION_REGULATION, hours_applied: 40, expected_build_order_version: "${bv}" }, as: MasterCraftsman, as_user_id: "${cr_sea}", captures: { bv: $.data.version } }
            - { call: "POST /piano-works/build-orders/${b_id}/advance", payload: { to_stage: VOICING, hours_applied: 200, expected_build_order_version: "${bv}" }, as: MasterCraftsman, as_user_id: "${cr_act}", captures: { bv: $.data.version } }
            - { call: "POST /piano-works/build-orders/${b_id}/advance", payload: { to_stage: COMPLETED, hours_applied: 160, expected_build_order_version: "${bv}" }, as: MasterCraftsman, as_user_id: "${cr_voi}" }
            - { call: "GET /piano-works/instruments", payload: { build_order_id: "${b_id}" }, as: WorkshopManager, captures: { i_id: "$.data[0].id" } }
            - { call: "POST /piano-works/instruments/${i_id}/bank-intake", payload: {}, as: ArtistLiaison }
            - { call: "POST /piano-works/artists", payload: { name: "Priv Artist", tier: PRIVILEGED, performance_quota: 2 }, as: ArtistLiaison, captures: { art_p: $.data.id } }
            - { call: "POST /piano-works/artists", payload: { name: "Std Artist", tier: STANDARD, performance_quota: 2 }, as: ArtistLiaison, captures: { art_s: $.data.id } }
            - { call: "POST /piano-works/concert-loans", payload: { desired_model: MODEL_O, tour_start: "2029-07-01T00:00:00Z", tour_end: "2029-07-08T00:00:00Z" }, as: Artist, as_user_id: "${art_p}", captures: { ln1: $.data.id } }
            - { call: "POST /piano-works/concert-loans/${ln1}/confirm", payload: { instrument_id: "${i_id}", technician_id: "${cr_voi}" }, as: ArtistLiaison, captures: { fee1: $.data.fee_cents } }
            - { call: "POST /piano-works/concert-loans/${ln1}/return", payload: { condition_grade_observed: A }, as: ArtistLiaison }
            - { call: "POST /piano-works/concert-loans", payload: { desired_model: MODEL_O, tour_start: "2029-09-01T00:00:00Z", tour_end: "2029-09-22T00:00:00Z" }, as: Artist, as_user_id: "${art_s}", captures: { ln2: $.data.id } }
          trigger:
            - { call: "POST /piano-works/concert-loans/${ln2}/confirm", payload: { instrument_id: "${i_id}", technician_id: "${cr_voi}" }, as: ArtistLiaison, captures: { fee2: $.data.fee_cents } }
          assert:
            - "loan1 fee_cents == 55000 (raw 64000 * 1 * 0.8 = 51200 clamped up to MIN_FEE_CENTS)"
            - "loan2 fee_cents == 192000 (64000 * 3 * 1.0; no clamp binds)"
            - "loan1 captured fee ${fee1} == 55000 and loan2 captured fee ${fee2} == 192000"

      - name: effective_hours_per_entry_rounding_mode_b
        grounds:
          - calculations.effective_training_hours
          - entities.SkillEndorsement.fields.effective_hours
        distinguishing_aspect: |
          Mode (b): rounding order pinned per-entry-then-sum. Two 7h mismatched-supervision
          entries credit 4+4=8 (round_half_up(3.5) each); the rejected sum-then-round order
          would credit round(7.0)=7, leaving effective_hours at 599 and status IN_TRAINING.
        test_recipe:
          setup:
            - "Apprentice with RIM_BENDING endorsement IN_TRAINING; two 7h entries supervised by a VOICING craftsman (mismatched) then one 592h entry supervised by a RIM_BENDING craftsman (matched)"
          setup_api_calls:
            - { call: "POST /piano-works/craftsmen", payload: { name: "Rim Master", specialty: RIM_BENDING }, as: WorkshopManager, captures: { cr_rim: $.data.id } }
            - { call: "POST /piano-works/craftsmen", payload: { name: "Voi Master", specialty: VOICING }, as: WorkshopManager, captures: { cr_voi: $.data.id } }
            - { call: "POST /piano-works/apprentices", payload: { name: "Apr One" }, as: WorkshopManager, captures: { apr: $.data.id } }
            - { call: "POST /piano-works/skill-endorsements", payload: { apprentice_id: "${apr}", operation_type: RIM_BENDING }, as: WorkshopManager, captures: { en: $.data.id } }
            - { call: "POST /piano-works/skill-endorsements/${en}/log-hours", payload: { hours: 7, supervising_craftsman_id: "${cr_voi}" }, as: Apprentice, as_user_id: "${apr}" }
            - { call: "POST /piano-works/skill-endorsements/${en}/log-hours", payload: { hours: 7, supervising_craftsman_id: "${cr_voi}" }, as: Apprentice, as_user_id: "${apr}" }
          trigger:
            - { call: "POST /piano-works/skill-endorsements/${en}/log-hours", payload: { hours: 592, supervising_craftsman_id: "${cr_rim}" }, as: Apprentice, as_user_id: "${apr}" }
          assert:
            - "SkillEndorsement.${en}.effective_hours == 600 (per-entry rounding: 4 + 4 + 592)"
            - "SkillEndorsement.${en}.logged_hours == 606"
            - "SkillEndorsement.${en}.status == PENDING_ASSESSMENT (sum-then-round would leave 599 and IN_TRAINING)"

  - rule_id: non_linear_state_machine
    instances:
      - name: build_seasoning_rework_cycle
        grounds:
          - state_machines.BuildOrder.SEASONING_to_RIM_BENT
          - state_machines.WoodBatch.ALLOCATED_to_REJECTED
        distinguishing_aspect: |
          BuildOrder machine is cyclic: SEASONING -> RIM_BENT (system rework on batch
          rejection) -> SEASONING again with a replacement batch; the loop reuses the
          forward transition, distinguishing it from a pure linear pipeline.
        test_recipe:
          setup:
            - "MODEL_B build in SEASONING on batch wb1 (version 3); second batch wb2 CONDITIONED and unallocated"
          setup_api_calls:
            - { call: "POST /piano-works/wood-batches", payload: { species: MAPLE, moisture_content_pct: 12.0 }, as: WorkshopManager, captures: { wb1: $.data.id } }
            - { call: "POST /piano-works/wood-batches", payload: { species: SPRUCE, moisture_content_pct: 11.5 }, as: WorkshopManager, captures: { wb2: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2027-04-29T00:00:00Z" }, as: WorkshopManager }
            - { call: "POST /piano-works/wood-batches/${wb1}/moisture-readings", payload: { moisture_content_pct: 8.0 }, as: WorkshopManager }
            - { call: "POST /piano-works/wood-batches/${wb2}/moisture-readings", payload: { moisture_content_pct: 7.5 }, as: WorkshopManager }
            - { call: "POST /piano-works/craftsmen", payload: { name: "Rim Master", specialty: RIM_BENDING }, as: WorkshopManager, captures: { cr_rim: $.data.id } }
            - { call: "POST /piano-works/craftsmen", payload: { name: "Sea Master", specialty: SEASONING_CHECK }, as: WorkshopManager, captures: { cr_sea: $.data.id } }
            - { call: "POST /piano-works/build-orders", payload: { model: MODEL_B, wood_batch_id: "${wb1}" }, as: WorkshopManager, captures: { b_id: $.data.id, bv: $.data.version } }
            - { call: "POST /piano-works/build-orders/${b_id}/advance", payload: { to_stage: RIM_BENT, hours_applied: 100, expected_build_order_version: "${bv}" }, as: MasterCraftsman, as_user_id: "${cr_rim}", captures: { bv: $.data.version } }
            - { call: "POST /piano-works/build-orders/${b_id}/advance", payload: { to_stage: SEASONING, hours_applied: 30, expected_build_order_version: "${bv}" }, as: MasterCraftsman, as_user_id: "${cr_sea}", captures: { bv: $.data.version } }
          trigger:
            - { call: "POST /piano-works/wood-batches/${wb1}/reject", payload: {}, as: WorkshopManager }
            - { call: "GET /piano-works/build-orders/${b_id}", as: WorkshopManager, captures: { bv4: $.data.version } }
            - { call: "POST /piano-works/build-orders/${b_id}/advance", payload: { to_stage: SEASONING, hours_applied: 35, expected_build_order_version: "${bv4}", wood_batch_id: "${wb2}" }, as: MasterCraftsman, as_user_id: "${cr_sea}" }
          assert:
            - "after reject: WoodBatch.${wb1}.status == REJECTED"
            - "after reject: BuildOrder.${b_id}.status == RIM_BENT, wood_batch_id == null, seasoning_started_at == null, version == 4"
            - "after re-advance: BuildOrder.${b_id}.status == SEASONING, wood_batch_id == ${wb2}, version == 5"
            - "after re-advance: WoodBatch.${wb2}.status == ALLOCATED"

      - name: endorsement_revoke_reopen_cycle
        grounds:
          - state_machines.SkillEndorsement.ENDORSED_to_REVOKED
          - state_machines.SkillEndorsement.REVOKED_to_ENDORSED
        distinguishing_aspect: |
          SkillEndorsement machine is cyclic on a different entity: ENDORSED -> REVOKED
          -> ENDORSED reinstatement preserves hours, unlike the BuildOrder rework loop.
        test_recipe:
          setup:
            - "Apprentice endorsement RIM_BENDING with 600 matched hours, assessed ENDORSE by a non-supervisor craftsman"
          setup_api_calls:
            - { call: "POST /piano-works/craftsmen", payload: { name: "Rim Master", specialty: RIM_BENDING }, as: WorkshopManager, captures: { cr_rim: $.data.id } }
            - { call: "POST /piano-works/craftsmen", payload: { name: "Act Master", specialty: ACTION_REGULATION }, as: WorkshopManager, captures: { cr_act: $.data.id } }
            - { call: "POST /piano-works/apprentices", payload: { name: "Apr Two" }, as: WorkshopManager, captures: { apr: $.data.id } }
            - { call: "POST /piano-works/skill-endorsements", payload: { apprentice_id: "${apr}", operation_type: RIM_BENDING }, as: WorkshopManager, captures: { en: $.data.id } }
            - { call: "POST /piano-works/skill-endorsements/${en}/log-hours", payload: { hours: 600, supervising_craftsman_id: "${cr_rim}" }, as: Apprentice, as_user_id: "${apr}" }
            - { call: "POST /piano-works/skill-endorsements/${en}/assess", payload: { outcome: ENDORSE }, as: MasterCraftsman, as_user_id: "${cr_act}" }
          trigger:
            - { call: "POST /piano-works/skill-endorsements/${en}/review", payload: { action: REVOKE }, as: WorkshopManager, captures: { st1: $.data.status } }
            - { call: "POST /piano-works/skill-endorsements/${en}/review", payload: { action: REOPEN }, as: WorkshopManager, captures: { st2: $.data.status } }
          assert:
            - "after REVOKE: status == REVOKED"
            - "after REOPEN: status == ENDORSED"
            - "effective_hours == 600 after the full cycle (hours retained through revocation)"
            - "endorsed_by_craftsman_id == ${cr_act} after REOPEN"

  - rule_id: transitive_cascade
    instances:
      - name: loan_return_grade_d_restoration_cascade
        grounds:
          - state_machines.ConcertLoan.ON_TOUR_to_RETURNED
          - state_machines.Instrument.ON_LOAN_to_RESTORATION
        distinguishing_aspect: |
          Depth-3 chain from the return trigger: (1) return writes condition_grade D on
          the instrument; (2) the grade drop itself forces Instrument ON_LOAN ->
          RESTORATION; (3) entering RESTORATION auto-creates a LOAN_RETURN
          RestorationCase. Each link is caused by the previous mutation, not by the
          return call directly.
        test_recipe:
          setup:
            - "BANK instrument (completed MODEL_B build) on an ON_TOUR loan for an ACTIVE artist"
          setup_api_calls:
            - { call: "POST /piano-works/wood-batches", payload: { species: SPRUCE, moisture_content_pct: 10.0 }, as: WorkshopManager, captures: { wb1: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2027-04-29T00:00:00Z" }, as: WorkshopManager }
            - { call: "POST /piano-works/wood-batches/${wb1}/moisture-readings", payload: { moisture_content_pct: 8.0 }, as: WorkshopManager }
            - { call: "POST /piano-works/craftsmen", payload: { name: "Rim Master", specialty: RIM_BENDING }, as: WorkshopManager, captures: { cr_rim: $.data.id } }
            - { call: "POST /piano-works/craftsmen", payload: { name: "Sea Master", specialty: SEASONING_CHECK }, as: WorkshopManager, captures: { cr_sea: $.data.id } }
            - { call: "POST /piano-works/craftsmen", payload: { name: "Act Master", specialty: ACTION_REGULATION }, as: WorkshopManager, captures: { cr_act: $.data.id } }
            - { call: "POST /piano-works/craftsmen", payload: { name: "Voi Master", specialty: VOICING }, as: WorkshopManager, captures: { cr_voi: $.data.id } }
            - { call: "POST /piano-works/build-orders", payload: { model: MODEL_B, wood_batch_id: "${wb1}" }, as: WorkshopManager, captures: { b_id: $.data.id, bv: $.data.version } }
            - { call: "POST /piano-works/build-orders/${b_id}/advance", payload: { to_stage: RIM_BENT, hours_applied: 120, expected_build_order_version: "${bv}" }, as: MasterCraftsman, as_user_id: "${cr_rim}", captures: { bv: $.data.version } }
            - { call: "POST /piano-works/build-orders/${b_id}/advance", payload: { to_stage: SEASONING, hours_applied: 40, expected_build_order_version: "${bv}" }, as: MasterCraftsman, as_user_id: "${cr_sea}", captures: { bv: $.data.version } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2028-04-28T00:00:00Z" }, as: WorkshopManager }
            - { call: "POST /piano-works/build-orders/${b_id}/advance", payload: { to_stage: ACTION_REGULATION, hours_applied: 40, expected_build_order_version: "${bv}" }, as: MasterCraftsman, as_user_id: "${cr_sea}", captures: { bv: $.data.version } }
            - { call: "POST /piano-works/build-orders/${b_id}/advance", payload: { to_stage: VOICING, hours_applied: 200, expected_build_order_version: "${bv}" }, as: MasterCraftsman, as_user_id: "${cr_act}", captures: { bv: $.data.version } }
            - { call: "POST /piano-works/build-orders/${b_id}/advance", payload: { to_stage: COMPLETED, hours_applied: 160, expected_build_order_version: "${bv}" }, as: MasterCraftsman, as_user_id: "${cr_voi}" }
            - { call: "GET /piano-works/instruments", payload: { build_order_id: "${b_id}" }, as: WorkshopManager, captures: { i_id: "$.data[0].id" } }
            - { call: "POST /piano-works/instruments/${i_id}/bank-intake", payload: {}, as: ArtistLiaison }
            - { call: "POST /piano-works/artists", payload: { name: "Art A", tier: STANDARD, performance_quota: 2 }, as: ArtistLiaison, captures: { art_id: $.data.id } }
            - { call: "POST /piano-works/concert-loans", payload: { desired_model: MODEL_B, tour_start: "2028-06-01T00:00:00Z", tour_end: "2028-06-22T00:00:00Z" }, as: Artist, as_user_id: "${art_id}", captures: { ln: $.data.id } }
            - { call: "POST /piano-works/concert-loans/${ln}/confirm", payload: { instrument_id: "${i_id}", technician_id: "${cr_voi}" }, as: ArtistLiaison }
          trigger:
            - { call: "POST /piano-works/concert-loans/${ln}/return", payload: { condition_grade_observed: D }, as: ArtistLiaison }
            - { call: "GET /piano-works/restorations", payload: { instrument_id: "${i_id}" }, as: WorkshopManager, captures: { rc_origin: "$.data[0].origin", rc_status: "$.data[0].status" } }
          assert:
            - "ConcertLoan.${ln}.status == RETURNED"
            - "Instrument.${i_id}.condition_grade == D"
            - "Instrument.${i_id}.status == RESTORATION"
            - "exactly one RestorationCase for instrument ${i_id}: origin == LOAN_RETURN, status == QUOTED, authentic_parts_value_cents == 0, total_parts_value_cents == 0"

      - name: wood_reject_rework_wip_cascade
        grounds:
          - state_machines.WoodBatch.ALLOCATED_to_REJECTED
          - state_machines.BuildOrder.SEASONING_to_RIM_BENT
          - calculations.wip_valuation
        distinguishing_aspect: |
          Depth-2 chain from a different trigger (batch reject): (1) rejecting the
          ALLOCATED batch reverts the SEASONING build to RIM_BENT and clears its batch
          link; (2) that mutation recomputes wip_value_cents, dropping the 3600000
          material cost while retaining logged labor 1735000.
        test_recipe:
          setup:
            - "MODEL_B build in SEASONING (version 3) with 100h RIM_BENDING + 30h SEASONING_CHECK logged on batch wb1"
          setup_api_calls:
            - { call: "POST /piano-works/wood-batches", payload: { species: MAPLE, moisture_content_pct: 12.5 }, as: WorkshopManager, captures: { wb1: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2027-04-29T00:00:00Z" }, as: WorkshopManager }
            - { call: "POST /piano-works/wood-batches/${wb1}/moisture-readings", payload: { moisture_content_pct: 8.0 }, as: WorkshopManager }
            - { call: "POST /piano-works/craftsmen", payload: { name: "Rim Master", specialty: RIM_BENDING }, as: WorkshopManager, captures: { cr_rim: $.data.id } }
            - { call: "POST /piano-works/craftsmen", payload: { name: "Sea Master", specialty: SEASONING_CHECK }, as: WorkshopManager, captures: { cr_sea: $.data.id } }
            - { call: "POST /piano-works/build-orders", payload: { model: MODEL_B, wood_batch_id: "${wb1}" }, as: WorkshopManager, captures: { b_id: $.data.id, bv: $.data.version } }
            - { call: "POST /piano-works/build-orders/${b_id}/advance", payload: { to_stage: RIM_BENT, hours_applied: 100, expected_build_order_version: "${bv}" }, as: MasterCraftsman, as_user_id: "${cr_rim}", captures: { bv: $.data.version } }
            - { call: "POST /piano-works/build-orders/${b_id}/advance", payload: { to_stage: SEASONING, hours_applied: 30, expected_build_order_version: "${bv}" }, as: MasterCraftsman, as_user_id: "${cr_sea}", captures: { bv: $.data.version } }
          trigger:
            - { call: "POST /piano-works/wood-batches/${wb1}/reject", payload: {}, as: WorkshopManager }
            - { call: "GET /piano-works/build-orders/${b_id}/valuation", as: WorkshopManager, captures: { act: $.data.actual_wip_cents, prov: $.data.provisional_wip_cents } }
          assert:
            - "WoodBatch.${wb1}.status == REJECTED"
            - "BuildOrder.${b_id}.status == RIM_BENT and wood_batch_id == null and version == 4"
            - "actual_wip_cents == 1735000 (labor retained, material dropped)"
            - "provisional_wip_cents == 14135000 (labor + 3600000 replacement material + 8800000 planned remaining)"

