              as: ScheduleCoordinator
              captures: { case_id: $.data.id }
            - call: "POST /resources"
              payload: { full_name: "Rep JJ", kind: "REPORTER", certifications: ["RPR"], hourly_appearance_cents: 15000 }
              as: ScheduleCoordinator
              captures: { rep_id: $.data.id }
            - call: "POST /resources"
