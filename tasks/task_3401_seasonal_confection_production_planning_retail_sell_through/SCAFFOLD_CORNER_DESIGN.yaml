            - call: "GET /confection/retailer-accounts/00000000-0000-4000-8000-000000000009"
              payload: {}
              as: PlatformAdmin
              captures: { e_ret: $.data.error_id }
          assert:
            - "all nine responses are 404 with response_type error"
            - "e_claim == ERR_CLAIM_NOT_FOUND and e_commit == ERR_COMMITMENT_NOT_FOUND and e_contract == ERR_CONTRACT_NOT_FOUND"
            - "e_disp == ERR_DISPOSITION_NOT_FOUND and e_lot == ERR_LOT_NOT_FOUND and e_rep == ERR_REPORT_NOT_FOUND"
            - "e_run == ERR_RUN_NOT_FOUND and e_wh == ERR_WAREHOUSE_NOT_FOUND and e_ret == ERR_RETAILER_NOT_FOUND"

