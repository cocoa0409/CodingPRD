              as: MpiAdmin
              captures: { rs_base_id: $.data.id }
            - call: "POST /mpi/downstream-systems"
              payload: { system_code: "XB-SYS", name: "Warehouse", propagation_mode: "BATCH", ack_required: true, max_concurrent_dispatch: 1 }
              as: MpiAdmin
              captures: { sys_xb_id: $.data.id }
            - call: "POST /mpi/patient-records"
              payload: { site_id: "${site_xb_id}", mrn: "XB-1000", last_name: "Iwuchukwu", first_name: "Ngozi", dob: "1974-04-14", sex: "F", ssn_last4: "9595", postal_code: "21201", phone: "4105550101", clinical_element_count: 2 }
              as: IdentityAnalyst
              captures: { rec_xb1_id: $.data.id }
            - call: "POST /mpi/patient-records"
              payload: { site_id: "${site_xb_id}", mrn: "XB-2000", last_name: "Iwuchukwu", first_name: "Ngozi", dob: "1974-04-14", sex: "F", ssn_last4: "9595", postal_code: "21201", phone: "4105550101", clinical_element_count: 30 }
              as: IdentityAnalyst
              captures: { rec_xb2_id: $.data.id }
            - call: "POST /mpi/patient-records"
              payload: { site_id: "${site_xb_id}", mrn: "XB-3000", last_name: "Sandoval", first_name: "Ramiro", dob: "1958-10-10", sex: "M", ssn_last4: "0606", postal_code: "21202", phone: "4105550202", clinical_element_count: 6 }
              as: IdentityAnalyst
              captures: { rec_xb3_id: $.data.id, rec_xb3_v1: $.data.version }
            - call: "POST /mpi/candidate-pairs"
              payload: { record_a_id: "${rec_xb1_id}", record_b_id: "${rec_xb2_id}", rule_set_id: "${rs_base_id}", score_variant: "STRICT" }
              as: IdentityAnalyst
              as_user_id: "analyst-1"
              captures: { pair_xb_id: $.data.id }
            - call: "POST /mpi/merge-operations"
              payload: { pair_id: "${pair_xb_id}", survivor_record_id: "${rec_xb1_id}", subsumed_record_id: "${rec_xb2_id}", rationale: "Same patient." }
              as: IdentityStewardApprover
              as_user_id: "steward-1"
              captures: { merge_xb_id: $.data.id }
            - call: "GET /mpi/contamination-remediations?merge_operation_id=${merge_xb_id}"
              payload: {}
              as: PrivacyOfficer
              as_user_id: "officer-1"
              captures: { rem_xb_id: "$.data[0].id" }
            - call: "POST /mpi/contamination-remediations/${rem_xb_id}/quarantine"
