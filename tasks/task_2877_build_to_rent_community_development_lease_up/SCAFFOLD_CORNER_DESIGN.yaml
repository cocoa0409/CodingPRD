        grounds:
          - validations.priority_69_clock_rewind
          - endpoints.POST__clock_set_current_utc
          - errors.ERR_CLOCK_REWIND
        distinguishing_aspect: |
          The clock is strictly monotonic, so re-submitting the current instant is refused as firmly as an
          earlier one — "strictly after" excludes equality. Every refused write leaves the stored clock
          untouched, so a subsequent legal advance starts from the value that was already there.
        test_recipe:
          setup:
            - "A fresh system with the logical clock at its default 2026-08-01T00:00:00Z, advanced once to 2026-08-05T00:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-05T00:00:00Z" }
              as: DeveloperPrincipal
              as_user_id: "u_dev_1"
          trigger:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-04T00:00:00Z" }
              as: DeveloperPrincipal
              as_user_id: "u_dev_1"
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-05T00:00:00Z" }
              as: DeveloperPrincipal
              as_user_id: "u_dev_1"
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-05T00:00:01Z" }
              as: PropertyManager
              as_user_id: "u_pm_1"
          assert:
            - "The 2026-08-04 request returns HTTP 409 with data.error_id == ERR_CLOCK_REWIND"
            - "The repeat of 2026-08-05T00:00:00Z also returns HTTP 409 with data.error_id == ERR_CLOCK_REWIND — equality is not forward motion"
            - "The one-second advance returns HTTP 200 with the stored clock at 2026-08-05T00:00:01Z, and any operator role may move it"

      - name: priority_ordering_between_the_authorisation_and_state_bands
        claim_type: priority_ordering
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict
          rationale: |
            The three §1.8 priority_pair_validation_conflict instances already pin the ordering across the
            widest bands of Table 4 — auth (10/20/25) over existence (30/32), existence over schema (35),
            and OCC (38) over state (40) — each by constructing a single request that violates both rules
            at once and asserting the higher-priority error_id. The remaining orderings inside the state
            and business bands are covered here by dedicated instances
            (leasing_against_a_community_still_in_construction_is_rejected for 40 over 50,
            lease_creation_while_the_posture_is_frozen_is_rejected for 45 over 50, and
            releasing_or_certificating_a_homesite_that_left_planned_is_rejected for 40 over 55), so a
            further generic priority-ordering instance would only restate them.

  - section: errors
    instances:
      - name: requests_missing_auth_headers_return_unauthenticated
        claim_type: error_triggerable
        grounds:
          - validations.priority_10_unauthenticated
          - errors.ERR_UNAUTHENTICATED
        distinguishing_aspect: |
          Priority 10 sits above existence, so an unauthenticated read of a non-existent lease is a 401,
          never a 404 — the server must not disclose whether the id exists. Three shapes trigger it: an
          empty X-User-Role, a role that is not in the catalog at all, and a Household call whose
          X-User-ID is empty even though the role itself is valid.
        test_recipe:
          setup:
            - "No domain state is required; the checks run before any lookup."
          setup_api_calls: []
          trigger:
            - call: "GET /communities"
              payload: {}
              as: ""
              as_user_id: "u_dev_1"
            - call: "GET /communities"
              payload: {}
              as: "OperationsIntern"
              as_user_id: "u_dev_1"
            - call: "GET /leases/00000000-0000-4000-8000-000000000101"
              payload: {}
              as: Household
              as_user_id: ""
          assert:
            - "The empty-role request returns HTTP 401 with data.error_id == ERR_UNAUTHENTICATED"
            - "The unknown-role request returns HTTP 401 with data.error_id == ERR_UNAUTHENTICATED, not 403 — the role never enters the RBAC table"
            - "The Household request with an empty X-User-ID returns HTTP 401 with data.error_id == ERR_UNAUTHENTICATED, not ERR_LEASE_NOT_FOUND, because priority 10 precedes priority 30"
            - "All three responses carry the standard envelope with success == false and no data payload beyond the error"

