          trigger:
            - { call: "POST /api/claims", payload: { enrollment_id: "${enr_id}", claim_type: "REIMBURSEMENT", service_date: "2026-05-02T10:00:00Z", receipt_ref: "R-X", line_items: [ { description: "gym", unit_amount_cents: 1000, quantity: 1, tax_pct: 0.0 } ] }, as: Member, as_user_id: "${m_id}", captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_MEMBER_NOT_ELIGIBLE"

  - rule_id: resource_temporal_overlap
    instances:
      - name: visit_half_open_overlap
        grounds:
          - validations[priority=7]
          - errors[ERR_VISIT_TIME_OVERLAP]
        distinguishing_aspect: |
          HALF-OPEN interval semantics on the member-time resource: an adjacent visit
          (check_in == prior check_out) is allowed, a strictly intersecting one is rejected.
        test_recipe:
          setup: ["Standard fixture; visit 09:00-10:00 already RECORDED"]
          setup_api_calls:
            - { call: "POST /api/employers", payload: { name: "ACME", funding_model: "PREFUNDED" }, as: BenefitsAdmin, captures: { emp_id: $.data.id } }
            - { call: "POST /api/benefit-plans", payload: { employer_id: "${emp_id}", name: "2026 Standard", benefit_year: 2026, period_start: "2026-01-01T00:00:00Z", period_end: "2026-12-31T23:59:59Z" }, as: BenefitsAdmin, captures: { plan_id: $.data.id, plan_v: $.data.version } }
            - { call: "PUT /api/benefit-plans/${plan_id}/tiers", payload: { tiers: [ { tier_code: "INDIVIDUAL", annual_allowance_cents: 30000, quarterly_cap_cents: 10000, per_claim_cap_cents: 5000, visit_frequency_cap: 8, dependent_cap_pct: 0.25, in_network_pct: 1.0, preferred_pct: 0.8, out_of_network_pct: 0.5 } ], expected_plan_version: "${plan_v}" }, as: BenefitsAdmin }
            - { call: "POST /api/benefit-plans/${plan_id}/activate", payload: {}, as: BenefitsAdmin }
            - { call: "POST /api/providers", payload: { name: "GymIn", modality: "GYM", network_tier: "IN_NETWORK", contract_start: "2026-01-01T00:00:00Z", contract_end: "2026-12-31T23:59:59Z", visit_rate_cents: 1500 }, as: BenefitsAdmin, captures: { prov_id: $.data.id } }
            - { call: "POST /api/providers/${prov_id}/activate", payload: {}, as: BenefitsAdmin }
            - { call: "POST /api/members", payload: { employer_id: "${emp_id}", plan_id: "${plan_id}", external_ref: "E1", full_name: "Mem One", tier_code: "INDIVIDUAL", hire_date: "2026-03-01T00:00:00Z" }, as: BenefitsAdmin, captures: { m_id: $.data.id } }
            - { call: "POST /api/enrollments", payload: { member_id: "${m_id}", plan_id: "${plan_id}" }, as: BenefitsAdmin, captures: { enr_id: $.data.id } }
            - { call: "POST /api/visits", payload: { enrollment_id: "${enr_id}", member_id: "${m_id}", check_in_at: "2026-05-02T09:00:00Z", check_out_at: "2026-05-02T10:00:00Z", verification_method: "GEO_FENCE" }, as: ProviderOperator, as_user_id: "${prov_id}", captures: { v1: $.data.id } }
          trigger:
            - { call: "POST /api/visits", payload: { enrollment_id: "${enr_id}", member_id: "${m_id}", check_in_at: "2026-05-02T10:00:00Z", check_out_at: "2026-05-02T11:00:00Z", verification_method: "GEO_FENCE" }, as: ProviderOperator, as_user_id: "${prov_id}", captures: { v2: $.data.id } }
            - { call: "POST /api/visits", payload: { enrollment_id: "${enr_id}", member_id: "${m_id}", check_in_at: "2026-05-02T09:30:00Z", check_out_at: "2026-05-02T10:30:00Z", verification_method: "GEO_FENCE" }, as: ProviderOperator, as_user_id: "${prov_id}", captures: { err: $.data.error_id } }
          assert:
            - "Visit.${v2} created (201) — adjacency allowed under half-open [check_in, check_out)"
            - "Third create error_id == ERR_VISIT_TIME_OVERLAP — 09:30-10:30 intersects both existing intervals"

      - name: enrollment_closed_interval_overlap
        grounds:
          - validations[priority=7]
          - errors[ERR_ENROLLMENT_PERIOD_OVERLAP]
        distinguishing_aspect: |
          CLOSED interval semantics on the member-enrollment resource: plans whose periods share
          even one calendar date collide (2026-06-30 belongs to both), while back-to-back periods
          (ends 06-30, starts 07-01) are allowed — a different geometric treatment than the
          half-open visit rule, on a different resource.
        test_recipe:
          setup:
            - "Employer; three ACTIVE plans: A 2026-01-01..2026-06-30, B 2026-07-01..2026-12-31, C 2026-06-30..2026-12-31; ELIGIBLE member enrolled into A"
          setup_api_calls:
            - { call: "POST /api/employers", payload: { name: "ACME", funding_model: "PREFUNDED" }, as: BenefitsAdmin, captures: { emp_id: $.data.id } }
            - { call: "POST /api/benefit-plans", payload: { employer_id: "${emp_id}", name: "H1", benefit_year: 2026, period_start: "2026-01-01T00:00:00Z", period_end: "2026-06-30T23:59:59Z" }, as: BenefitsAdmin, captures: { planA: $.data.id, planA_v: $.data.version } }
            - { call: "PUT /api/benefit-plans/${planA}/tiers", payload: { tiers: [ { tier_code: "INDIVIDUAL", annual_allowance_cents: 30000, quarterly_cap_cents: 10000, per_claim_cap_cents: 5000, visit_frequency_cap: 8, dependent_cap_pct: 0.25, in_network_pct: 1.0, preferred_pct: 0.8, out_of_network_pct: 0.5 } ], expected_plan_version: "${planA_v}" }, as: BenefitsAdmin }
            - { call: "POST /api/benefit-plans/${planA}/activate", payload: {}, as: BenefitsAdmin }
            - { call: "POST /api/benefit-plans", payload: { employer_id: "${emp_id}", name: "H2", benefit_year: 2026, period_start: "2026-07-01T00:00:00Z", period_end: "2026-12-31T23:59:59Z" }, as: BenefitsAdmin, captures: { planB: $.data.id, planB_v: $.data.version } }
            - { call: "PUT /api/benefit-plans/${planB}/tiers", payload: { tiers: [ { tier_code: "INDIVIDUAL", annual_allowance_cents: 30000, quarterly_cap_cents: 10000, per_claim_cap_cents: 5000, visit_frequency_cap: 8, dependent_cap_pct: 0.25, in_network_pct: 1.0, preferred_pct: 0.8, out_of_network_pct: 0.5 } ], expected_plan_version: "${planB_v}" }, as: BenefitsAdmin }
            - { call: "POST /api/benefit-plans/${planB}/activate", payload: {}, as: BenefitsAdmin }
            - { call: "POST /api/benefit-plans", payload: { employer_id: "${emp_id}", name: "Overlap", benefit_year: 2026, period_start: "2026-06-30T00:00:00Z", period_end: "2026-12-31T23:59:59Z" }, as: BenefitsAdmin, captures: { planC: $.data.id, planC_v: $.data.version } }
            - { call: "PUT /api/benefit-plans/${planC}/tiers", payload: { tiers: [ { tier_code: "INDIVIDUAL", annual_allowance_cents: 30000, quarterly_cap_cents: 10000, per_claim_cap_cents: 5000, visit_frequency_cap: 8, dependent_cap_pct: 0.25, in_network_pct: 1.0, preferred_pct: 0.8, out_of_network_pct: 0.5 } ], expected_plan_version: "${planC_v}" }, as: BenefitsAdmin }
            - { call: "POST /api/benefit-plans/${planC}/activate", payload: {}, as: BenefitsAdmin }
            - { call: "POST /api/members", payload: { employer_id: "${emp_id}", plan_id: "${planA}", external_ref: "E1", full_name: "Mem One", tier_code: "INDIVIDUAL", hire_date: "2026-03-01T00:00:00Z" }, as: BenefitsAdmin, captures: { m_id: $.data.id } }
            - { call: "POST /api/enrollments", payload: { member_id: "${m_id}", plan_id: "${planA}" }, as: BenefitsAdmin, captures: { enrA: $.data.id } }
          trigger:
            - { call: "POST /api/enrollments", payload: { member_id: "${m_id}", plan_id: "${planB}" }, as: BenefitsAdmin, captures: { enrB: $.data.id } }
            - { call: "POST /api/enrollments", payload: { member_id: "${m_id}", plan_id: "${planC}" }, as: BenefitsAdmin, captures: { err: $.data.error_id } }
          assert:
            - "Enrollment.${enrB} created (201) — 2026-07-01 start is strictly after 2026-06-30 end"
            - "Plan C enrollment error_id == ERR_ENROLLMENT_PERIOD_OVERLAP — closed intervals share 2026-06-30"

  - rule_id: compensating_invariant
    instances:
      - name: funding_conservation_across_pay_and_clawback
        grounds:
          - calculations.calc_funding_reconciliation
          - state_machines.Claim.UNPAID_to_PAID
          - state_machines.Claim.PAID_to_CLAWED_BACK
        distinguishing_aspect: |
          Conserved quantity = employer FUNDING cents: after approve (hold), pay (debit), and
          reverse (clawback credit), available + reserved + disbursed == funded (100000) at
          every step; the clawback leaves zero drift.
        test_recipe:
          setup: ["Standard fixture; funding account 100000; claim 4000 SUBMITTED"]
          setup_api_calls:
            - { call: "POST /api/employers", payload: { name: "ACME", funding_model: "PREFUNDED" }, as: BenefitsAdmin, captures: { emp_id: $.data.id } }
            - { call: "POST /api/benefit-plans", payload: { employer_id: "${emp_id}", name: "2026 Standard", benefit_year: 2026, period_start: "2026-01-01T00:00:00Z", period_end: "2026-12-31T23:59:59Z" }, as: BenefitsAdmin, captures: { plan_id: $.data.id, plan_v: $.data.version } }
            - { call: "PUT /api/benefit-plans/${plan_id}/tiers", payload: { tiers: [ { tier_code: "INDIVIDUAL", annual_allowance_cents: 30000, quarterly_cap_cents: 10000, per_claim_cap_cents: 5000, visit_frequency_cap: 8, dependent_cap_pct: 0.25, in_network_pct: 1.0, preferred_pct: 0.8, out_of_network_pct: 0.5 } ], expected_plan_version: "${plan_v}" }, as: BenefitsAdmin }
            - { call: "POST /api/benefit-plans/${plan_id}/activate", payload: {}, as: BenefitsAdmin }
            - { call: "POST /api/funding-accounts", payload: { employer_id: "${emp_id}", benefit_year: 2026, initial_deposit_cents: 100000 }, as: BenefitsAdmin, captures: { fund_id: $.data.id } }
            - { call: "POST /api/providers", payload: { name: "GymIn", modality: "GYM", network_tier: "IN_NETWORK", contract_start: "2026-01-01T00:00:00Z", contract_end: "2026-12-31T23:59:59Z", visit_rate_cents: 1500 }, as: BenefitsAdmin, captures: { prov_id: $.data.id } }
            - { call: "POST /api/providers/${prov_id}/activate", payload: {}, as: BenefitsAdmin }
            - { call: "POST /api/members", payload: { employer_id: "${emp_id}", plan_id: "${plan_id}", external_ref: "E1", full_name: "Mem One", tier_code: "INDIVIDUAL", hire_date: "2026-03-01T00:00:00Z" }, as: BenefitsAdmin, captures: { m_id: $.data.id } }
            - { call: "POST /api/enrollments", payload: { member_id: "${m_id}", plan_id: "${plan_id}" }, as: BenefitsAdmin, captures: { enr_id: $.data.id } }
            - { call: "POST /api/claims", payload: { enrollment_id: "${enr_id}", claim_type: "REIMBURSEMENT", service_date: "2026-05-02T10:00:00Z", receipt_ref: "R-INV", line_items: [ { description: "gym", unit_amount_cents: 4000, quantity: 1, tax_pct: 0.0 } ] }, as: Member, as_user_id: "${m_id}", captures: { c_id: $.data.id } }
            - { call: "POST /api/claims/${c_id}/start-review", payload: {}, as: ClaimsReviewer }
          trigger:
            - { call: "POST /api/claims/${c_id}/approve", payload: {}, as: ClaimsReviewer }
            - { call: "GET /api/funding-accounts/${fund_id}", payload: {}, as: BenefitsAdmin, captures: { f_avail1: $.data.available_cents, f_res1: $.data.reserved_cents, f_disb1: $.data.disbursed_cents } }
            - { call: "POST /api/claims/${c_id}/pay", payload: {}, as: BenefitsAdmin }
            - { call: "GET /api/funding-accounts/${fund_id}", payload: {}, as: BenefitsAdmin, captures: { f_avail2: $.data.available_cents, f_res2: $.data.reserved_cents, f_disb2: $.data.disbursed_cents } }
            - { call: "POST /api/claims/${c_id}/reverse", payload: { reason: "clawback" }, as: BenefitsAdmin }
            - { call: "GET /api/funding-accounts/${fund_id}", payload: {}, as: BenefitsAdmin, captures: { f_avail3: $.data.available_cents, f_res3: $.data.reserved_cents, f_disb3: $.data.disbursed_cents } }
          assert:
            - "after approve: available 96000 + reserved 4000 + disbursed 0 == funded 100000"
            - "after pay: available 96000 + reserved 0 + disbursed 4000 == 100000"
            - "after reverse (clawback): available 100000 + reserved 0 + disbursed 0 == 100000 (zero drift)"
            - "Claim.${c_id}.payment_status == CLAWED_BACK"

      - name: enrollment_allowance_conservation
        grounds:
          - calculations.calc_allowance_ledger
          - state_machines.Claim.PAID_to_CLAWED_BACK
        distinguishing_aspect: |
          Conserved quantity = member ALLOWANCE cents (different quantity than the funding-pool
          invariant): used + reserved + remaining == annual_allowance (30000) after create,
          approve, pay, and clawback; the compensating reverse restores remaining to 30000.
        test_recipe:
          setup: ["Standard fixture; claim 3000 SUBMITTED (reserved 3000)"]
          setup_api_calls:
            - { call: "POST /api/employers", payload: { name: "ACME", funding_model: "PREFUNDED" }, as: BenefitsAdmin, captures: { emp_id: $.data.id } }
            - { call: "POST /api/benefit-plans", payload: { employer_id: "${emp_id}", name: "2026 Standard", benefit_year: 2026, period_start: "2026-01-01T00:00:00Z", period_end: "2026-12-31T23:59:59Z" }, as: BenefitsAdmin, captures: { plan_id: $.data.id, plan_v: $.data.version } }
            - { call: "PUT /api/benefit-plans/${plan_id}/tiers", payload: { tiers: [ { tier_code: "INDIVIDUAL", annual_allowance_cents: 30000, quarterly_cap_cents: 10000, per_claim_cap_cents: 5000, visit_frequency_cap: 8, dependent_cap_pct: 0.25, in_network_pct: 1.0, preferred_pct: 0.8, out_of_network_pct: 0.5 } ], expected_plan_version: "${plan_v}" }, as: BenefitsAdmin }
            - { call: "POST /api/benefit-plans/${plan_id}/activate", payload: {}, as: BenefitsAdmin }
            - { call: "POST /api/funding-accounts", payload: { employer_id: "${emp_id}", benefit_year: 2026, initial_deposit_cents: 100000 }, as: BenefitsAdmin }
            - { call: "POST /api/providers", payload: { name: "GymIn", modality: "GYM", network_tier: "IN_NETWORK", contract_start: "2026-01-01T00:00:00Z", contract_end: "2026-12-31T23:59:59Z", visit_rate_cents: 1500 }, as: BenefitsAdmin, captures: { prov_id: $.data.id } }
            - { call: "POST /api/providers/${prov_id}/activate", payload: {}, as: BenefitsAdmin }
            - { call: "POST /api/members", payload: { employer_id: "${emp_id}", plan_id: "${plan_id}", external_ref: "E1", full_name: "Mem One", tier_code: "INDIVIDUAL", hire_date: "2026-03-01T00:00:00Z" }, as: BenefitsAdmin, captures: { m_id: $.data.id } }
            - { call: "POST /api/enrollments", payload: { member_id: "${m_id}", plan_id: "${plan_id}" }, as: BenefitsAdmin, captures: { enr_id: $.data.id } }
            - { call: "POST /api/claims", payload: { enrollment_id: "${enr_id}", claim_type: "REIMBURSEMENT", service_date: "2026-05-02T10:00:00Z", receipt_ref: "R-AL", line_items: [ { description: "gym", unit_amount_cents: 3000, quantity: 1, tax_pct: 0.0 } ] }, as: Member, as_user_id: "${m_id}", captures: { c_id: $.data.id } }
            - { call: "POST /api/claims/${c_id}/start-review", payload: {}, as: ClaimsReviewer }
          trigger:
            - { call: "GET /api/enrollments/${enr_id}/allowance", payload: {}, as: BenefitsAdmin, captures: { a_used0: $.data.used_cents, a_res0: $.data.reserved_cents, a_rem0: $.data.remaining_cents } }
            - { call: "POST /api/claims/${c_id}/approve", payload: {}, as: ClaimsReviewer }
            - { call: "POST /api/claims/${c_id}/pay", payload: {}, as: BenefitsAdmin }
            - { call: "GET /api/enrollments/${enr_id}/allowance", payload: {}, as: BenefitsAdmin, captures: { a_used1: $.data.used_cents, a_res1: $.data.reserved_cents, a_rem1: $.data.remaining_cents } }
            - { call: "POST /api/claims/${c_id}/reverse", payload: { reason: "clawback" }, as: BenefitsAdmin }
            - { call: "GET /api/enrollments/${enr_id}/allowance", payload: {}, as: BenefitsAdmin, captures: { a_used2: $.data.used_cents, a_res2: $.data.reserved_cents, a_rem2: $.data.remaining_cents } }
          assert:
            - "after create: used 0 + reserved 3000 + remaining 27000 == 30000"
            - "after pay: used 3000 + reserved 0 + remaining 27000 == 30000"
            - "after clawback: used 0 + reserved 0 + remaining 30000 == 30000 (zero drift)"
