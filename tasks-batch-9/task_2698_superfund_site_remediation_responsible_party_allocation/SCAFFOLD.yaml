scenario: |
  Generate task harder than expert level!

  2698. Superfund Site Remediation & Responsible Party Allocation (contaminated site remediation
  project): site listing, remedial investigation and feasibility study with contaminant delineation
  and risk assessment, potentially responsible party identification through site history, ownership
  and waste-in records, allocation negotiation among parties with volumetric, toxicity and
  ownership-period factors, consent decree or administrative order negotiation with scope, oversight
  cost and stipulated penalties, remedy selection with record of decision documentation and community
  involvement, remedial design and construction with contractor procurement and performance
  oversight, operation and maintenance with long-term monitoring and five-year review requirements,
  cost recovery, contribution actions and de minimis settlement offers

domain_name: "superfund-remediation-allocation"
api_prefix: ""           # flat peer collections at root: /sites, /prps, /allocation-rounds, ...

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

complexity_profile:
  primary_archetype: multi_party_negotiation
  secondary_archetype: ledger_reconciliation
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - derived_field_reconciliation
    - selector_policy

  entity_topology: graph
  # PRPs and Sites are joined through two independent association families (OwnershipPeriod,
  # WasteInRecord); AllocationShare is a junction between AllocationRound and PRP; CostRecoveryAction
  # is self-referential across PRPs (claimant_prp_id -> respondent_prp_id) for contribution actions.

  state_machine_shape: cyclic
  # AllocationRound: BALLOTING -> DRAFTING -> BALLOTING (renegotiation rounds).
  # RemedialInvestigation: UNDER_REVIEW -> REVISION_REQUESTED -> DRAFT -> UNDER_REVIEW.
  # Site: OM_PHASE -> REMEDY_REEVALUATION -> ROD_SIGNED -> CONSTRUCTION -> OM_PHASE.
  # ConsentDecree carries two independent dimensions (legal_status x compliance_status).

  relationship_patterns:
    - many_to_many          # PRP <-> Site via OwnershipPeriod and WasteInRecord
    - one_to_many           # Site -> RemedialInvestigation -> ContaminantSample / RemedyAlternative
    - self_referential      # CostRecoveryAction.claimant_prp_id -> PotentiallyResponsibleParty (same entity as respondent)
    - cross_aggregate       # AllocationShare disposition mutated by CostRecoveryAction acceptance
    - polymorphic           # CostRecoveryAction.action_type selects which validation family applies

  role_model: segregation_of_duties
  # The RemedialProjectManager who authored an RI/FS cannot review it; the user who approved the
  # RI/FS cannot sign the Record of Decision; the AllocationFacilitator who adopted a round cannot
  # issue or void settlements (that is SettlementCounsel's exclusive surface).

  consistency_model: immediate

  difficulty_level: expert_plus
  # 14 entities / 67 endpoints / 49 error codes / 14 calculations (2 with divergent variants) /
  # 41 ordered validation rules / 12 state machines across 10 entities (5 cyclic, ConsentDecree
  # carrying two independent dimensions, Site.cost_posture and AllocationShare.disposition derived).

# ---------------------------------------------------------------------------
# 1.1 Entity-Relationship Table
# ---------------------------------------------------------------------------
entities:
  - name: Site
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: Site name as published on the National Priorities List docket.
      - name: epa_region
        type: integer
        source: input
        description: EPA region administering the site.
        constraints: "integer 1..10"
      - name: hrs_score
        type: number
        source: input
        description: Hazard Ranking System score used for NPL listing eligibility.
        constraints: "0.00..100.00, exactly 2 decimals"
      - name: listing_status
        type: enum
        source: system
        description: Site lifecycle state.
        default: PROPOSED
        constraints: "PROPOSED | LISTED | RI_FS_UNDERWAY | ROD_SIGNED | CONSTRUCTION | OM_PHASE | REMEDY_REEVALUATION | DELETED_FROM_NPL"
      - name: listing_reference
        type: string
        source: system
        description: Federal Register docket reference stamped when the site is listed; null while PROPOSED.
      - name: cost_posture
        type: enum
        source: computed
        description: Derived gate over all cost-bearing child operations; recomputed by calculations.cost_posture_derivation.
        default: OPEN
        constraints: "OPEN | RESTRICTED | FROZEN"
      - name: oversight_direct_cents
        type: integer
        source: computed
        description: Running sum of every incurred_cents posted through POST /sites/{id}/oversight-costs.
        default: 0
      - name: oversight_indirect_rate_bp
        type: integer
        source: computed
        description: Indirect-cost tier rate in basis points selected from oversight_direct_cents by calculations.oversight_cost_reimbursement.
        default: 0
      - name: oversight_indirect_cents
        type: integer
        source: computed
        description: Indirect cost recomputed in full (never incrementally) on every oversight posting.
        default: 0
      - name: oversight_billed_cents
        type: integer
        source: computed
        description: oversight_direct_cents + oversight_indirect_cents.
        default: 0
      - name: oversight_cap_utilization_pct
        type: number
        source: computed
        description: oversight_billed_cents as a percentage of the governing decree's oversight_cost_cap_cents; null when the site has no governing decree.
      - name: total_response_cost_cents
        type: integer
        source: computed
        description: oversight_billed_cents plus the awarded_amount_cents of every RemediationContract of this site whose status is in {AWARDED, CONSTRUCTION_COMPLETE, CLOSED}.
        default: 0
      - name: recovered_cost_cents
        type: integer
        source: computed
        description: Sum of received_cents over this site's CostRecoveryAction rows whose status == COLLECTED.
        default: 0
      - name: orphan_write_off_cents
        type: integer
        source: computed
        description: total_response_cost_cents times the adopted round's orphan_share_pct, per calculations.cost_recovery_ledger.
        default: 0
      - name: unrecovered_cost_cents
        type: integer
        source: computed
        description: total_response_cost_cents - recovered_cost_cents - orphan_write_off_cents; may be negative, never floored.
        default: 0
      - name: adopted_round_id
        type: string
        source: computed
        description: Mirror of the id of this site's AllocationRound whose status == ADOPTED (at most one); null when none. Not a foreign key declaration - the owning FK is AllocationRound.site_id.
      - name: verified_waste_volume_tons
        type: number
        source: computed
        description: Sum of verified_volume_tons over this site's WasteInRecord rows whose status == VERIFIED.
        default: 0
      - name: construction_complete_at
        type: datetime
        source: system
        description: Completion timestamp stamped by POST /remediation-contracts/{id}/construction-completion.
      - name: five_year_review_due_at
        type: datetime
        source: computed
        description: construction_complete_at plus 1826 days at 00:00:00.000Z, then the previous value of this field plus 1826 days at each recorded five-year review (chained off the due date, never off last_five_year_review_at).
      - name: last_five_year_review_at
        type: datetime
        source: system
        description: review_date of the most recent five-year review.
      - name: last_protectiveness_determination
        type: enum
        source: system
        description: Determination recorded by the most recent five-year review.
        constraints: "PROTECTIVE | PROTECTIVE_SHORT_TERM | NOT_PROTECTIVE"

  - name: PotentiallyResponsibleParty
    parent: Site
    common_fields: true
    fields:
      - name: site_id
        type: string
        source: input
        description: "FK -> Site.id; the site this party is named for."
      - name: legal_name
        type: string
        source: input
        description: Registered legal name of the party.
      - name: party_type
        type: enum
        source: input
        description: CERCLA liability category established by site history research.
        constraints: "OWNER_OPERATOR | GENERATOR | TRANSPORTER | ARRANGER"
      - name: viability_score
        type: integer
        source: input
        description: Financial-viability score from the ability-to-pay screen.
        constraints: "0..100"
      - name: status
        type: enum
        source: system
        description: Negotiation posture of the party.
        default: IDENTIFIED
        constraints: "IDENTIFIED | NOTIFIED | PARTICIPATING | RECALCITRANT | DE_MINIMIS_SETTLED | SETTLED | ORPHAN"
      - name: notice_reference
        type: string
        source: system
        description: General-notice-letter reference stamped by POST /prps/{id}/notice.
      - name: submitted_volume_tons
        type: number
        source: computed
        description: Sum of effective_volume_tons over this party's WasteInRecord rows whose status is in {SUBMITTED, VERIFIED}.
        default: 0
      - name: verified_volume_tons
        type: number
        source: computed
        description: Sum of verified_volume_tons over this party's WasteInRecord rows whose status == VERIFIED.
        default: 0
      - name: max_toxicity_class
        type: enum
        source: computed
        description: Most hazardous toxicity_class across this party's WasteInRecord rows whose status == VERIFIED, ordered I > II > III > IV; null when the party has no VERIFIED record.
        constraints: "I | II | III | IV"
      - name: volumetric_share_pct
        type: number
        source: computed
        description: verified_volume_tons divided by Site.verified_waste_volume_tons times 100, round_half_up to 2 decimals; 0.00 when the site total is 0.
        default: 0
      - name: ownership_days_total
        type: integer
        source: computed
        description: Sum of ownership_days over this party's OwnershipPeriod rows for the same site.
        default: 0
      - name: de_minimis_eligible
        type: boolean
        source: computed
        description: Output of calculations.de_minimis_eligibility; recomputed on every waste-in verification.
        default: false
      - name: contribution_protection
        type: boolean
        source: system
        description: Set true when a DE_MINIMIS_SETTLEMENT against this party reaches ACCEPTED; reset to false when that action is VOIDED.
        default: false

  - name: OwnershipPeriod
    parent: Site
    common_fields: false
    fields:
      - name: site_id
        type: string
        source: input
        description: "FK -> Site.id; the site whose title history this period belongs to."
      - name: prp_id
        type: string
        source: input
        description: "FK -> PotentiallyResponsibleParty.id; the party holding title during the period."
      - name: start_date
        type: string
        source: input
        description: Inclusive start of the ownership interval (ISO date, YYYY-MM-DD).
      - name: end_date
        type: string
        source: input
        description: Exclusive end of the ownership interval (ISO date); null means still held, treated as 9999-12-31 for overlap arithmetic.
      - name: acquisition_type
        type: enum
        source: input
        description: How title was acquired, recorded from the chain-of-title search.
        constraints: "PURCHASE | MERGER | FORECLOSURE | LEASE"
      - name: ownership_days
        type: integer
        source: computed
        description: (end_date - start_date) in whole days on the half-open interval; a period whose end_date equals start_date yields 0. Null end_date uses 9999-12-31.

  - name: WasteInRecord
    parent: Site
    common_fields: true
    fields:
      - name: site_id
        type: string
        source: input
        description: "FK -> Site.id; the site the waste was sent to."
      - name: prp_id
        type: string
        source: input
        description: "FK -> PotentiallyResponsibleParty.id; the party the waste-in record is attributed to."
      - name: volume_tons
        type: number
        source: input
        description: Volume claimed by the waste-in submission.
        constraints: "> 0, at most 2 decimals"
      - name: toxicity_class
        type: enum
        source: input
        description: Toxicity class of the waste stream; drives the toxicity multiplier in allocation.
        constraints: "I | II | III | IV"
      - name: evidence_grade
        type: enum
        source: input
        description: Documentary strength of the record (manifests, ledgers, testimony).
        constraints: "A | B | C"
      - name: disposal_year
        type: integer
        source: input
        description: Calendar year the disposal occurred.
        constraints: "1940..2026"
      - name: transporter_name
        type: string
        source: input
        description: Hauler named on the manifest, when known.
      - name: status
        type: enum
        source: system
        description: Verification state of the record.
        default: SUBMITTED
        constraints: "SUBMITTED | VERIFIED | REJECTED"
      - name: verified_volume_tons
        type: number
        source: system
        description: Volume accepted at verification; null until the record is VERIFIED.
      - name: effective_volume_tons
        type: number
        source: computed
        description: verified_volume_tons when status == VERIFIED, volume_tons when status == SUBMITTED, 0 when status == REJECTED.
        default: 0
      - name: verified_by_user_id
        type: string
        source: system
        description: X-User-ID of the RemedialProjectManager who verified or rejected the record.

  - name: RemedialInvestigation
    parent: Site
    common_fields: true
    fields:
      - name: site_id
        type: string
        source: input
        description: "FK -> Site.id; the site under investigation."
      - name: scope_summary
        type: string
        source: input
        description: RI/FS scope narrative including contaminant delineation extent.
      - name: exposure_medium
        type: enum
        source: input
        description: Medium the risk assessment is driven from; only samples of this medium enter the risk calculation.
        constraints: "SOIL | GROUNDWATER | AIR | SEDIMENT"
      - name: status
        type: enum
        source: system
        description: RI/FS review state.
        default: DRAFT
        constraints: "DRAFT | UNDER_REVIEW | REVISION_REQUESTED | APPROVED"
      - name: authored_by_user_id
        type: string
        source: system
        description: X-User-ID of the RemedialProjectManager who created the RI/FS.
      - name: approved_by_user_id
        type: string
        source: system
        description: X-User-ID of the reviewer who approved the RI/FS; null until APPROVED.
      - name: revision_round_count
        type: integer
        source: system
        description: Number of times this RI/FS has entered REVISION_REQUESTED.
        default: 0
      - name: valid_sample_count
        type: integer
        source: computed
        description: Count of this RI's ContaminantSample rows whose medium == exposure_medium and qa_status == VALID.
        default: 0
      - name: central_tendency_epc_ug_per_l
        type: number
        source: computed
        description: Central-tendency exposure point concentration; see calculations.risk_assessment variant central_tendency.
      - name: rme_epc_ug_per_l
        type: number
        source: computed
        description: Reasonable-maximum-exposure point concentration; see calculations.risk_assessment variant reasonable_maximum_exposure.
      - name: central_tendency_risk
        type: number
        source: computed
        description: Excess lifetime cancer risk from the central-tendency EPC, 7 decimals.
      - name: rme_risk
        type: number
        source: computed
        description: Excess lifetime cancer risk from the RME EPC, 7 decimals.
      - name: hazard_index
        type: number
        source: computed
        description: rme_epc_ug_per_l divided by REFERENCE_CONCENTRATION_UG_PER_L, 2 decimals.
      - name: action_level_exceeded
        type: boolean
        source: computed
        description: True when rme_risk >= ACTION_LEVEL_RISK (1.0e-4); drives the remedy_score weighting branch and the protectiveness validation.
        default: false

  - name: ContaminantSample
    parent: RemedialInvestigation
    common_fields: false
    fields:
      - name: remedial_investigation_id
        type: string
        source: input
        description: "FK -> RemedialInvestigation.id; the investigation this analytical result belongs to."
      - name: medium
        type: enum
        source: input
        description: Environmental medium sampled.
        constraints: "SOIL | GROUNDWATER | AIR | SEDIMENT"
      - name: contaminant
        type: string
        source: input
        description: Analyte name (e.g. trichloroethene).
      - name: concentration_ug_per_l
        type: number
        source: input
        description: Reported concentration in micrograms per litre.
        constraints: ">= 0, at most 3 decimals"
      - name: qa_status
        type: enum
        source: input
        description: Data-validation flag from the analytical laboratory.
        constraints: "VALID | ESTIMATED | REJECTED"
      - name: collected_at
        type: datetime
        source: input
        description: Field collection timestamp (ISO 8601 UTC).
      - name: lab_reference
        type: string
        source: input
        description: Laboratory data package reference.

  - name: RemedyAlternative
    parent: RemedialInvestigation
    common_fields: true
    fields:
      - name: remedial_investigation_id
        type: string
        source: input
        description: "FK -> RemedialInvestigation.id; the feasibility study this alternative was screened in."
      - name: selected_by_rod_id
        type: string
        source: system
        description: "FK -> RecordOfDecision.id; null until a Record of Decision signature selects this alternative."
      - name: label
        type: string
        source: input
        description: Short alternative name (e.g. Pump and Treat).
      - name: capital_cost_cents
        type: integer
        source: input
        description: Up-front construction cost in cents.
        constraints: ">= 0"
      - name: annual_om_cost_cents
        type: integer
        source: input
        description: Annual operation and maintenance cost in cents.
        constraints: ">= 0"
      - name: om_years
        type: integer
        source: input
        description: Number of O&M years included in the present-value analysis.
        constraints: "1..100"
      - name: discount_rate_bp
        type: integer
        source: input
        description: Real discount rate in basis points.
        constraints: "0..2000"
      - name: effectiveness_score
        type: integer
        source: input
        description: Long-term effectiveness and permanence score.
        constraints: "0..100"
      - name: implementability_score
        type: integer
        source: input
        description: Implementability score.
        constraints: "0..100"
      - name: npv_cents
        type: integer
        source: computed
        description: Present value from calculations.remedy_npv (per-year rounding then summation).
        default: 0
      - name: cost_score
        type: number
        source: computed
        description: Normalised cost score derived from npv_cents, 2 decimals.
        default: 0
      - name: remedy_score
        type: number
        source: computed
        description: Weighted composite from calculations.remedy_score; the weighting branch depends on the parent RI's action_level_exceeded.
        default: 0

  - name: RecordOfDecision
    parent: Site
    common_fields: true
    fields:
      - name: site_id
        type: string
        source: input
        description: "FK -> Site.id; the site this decision document covers."
      - name: remedial_investigation_id
        type: string
        source: input
        description: "FK -> RemedialInvestigation.id; the APPROVED RI/FS this decision rests on."
      - name: proposed_plan_summary
        type: string
        source: input
        description: Proposed-plan narrative published for community review.
      - name: comment_period_days
        type: integer
        source: input
        description: Length of the public comment period in days.
        constraints: "30..90"
      - name: status
        type: enum
        source: system
        description: Decision-document state.
        default: DRAFT
        constraints: "DRAFT | PUBLIC_COMMENT | SIGNED | AMENDMENT_REQUIRED | WITHDRAWN"
      - name: comment_period_start
        type: datetime
        source: system
        description: Logical-clock instant when POST /records-of-decision/{id}/comment-period was accepted.
      - name: comment_period_end
        type: datetime
        source: system
        description: comment_period_start plus comment_period_days days; the comment window is the closed interval [start, end].
      - name: public_comments_count
        type: integer
        source: system
        description: Number of accepted public comments.
        default: 0
      - name: responsiveness_summary
        type: string
        source: system
        description: Responsiveness-summary text captured at signature.
      - name: selected_alternative_id
        type: string
        source: computed
        description: Mirror of the id of the RemedyAlternative whose selected_by_rod_id equals this document's id; null until signature. Not a foreign key declaration - the owning FK is RemedyAlternative.selected_by_rod_id.
      - name: signed_by_user_id
        type: string
        source: system
        description: X-User-ID of the RemedialProjectManager who signed the decision.
      - name: signed_at
        type: datetime
        source: system
        description: Logical-clock instant of signature.

  - name: AllocationRound
    parent: Site
    common_fields: true
    fields:
      - name: site_id
        type: string
        source: input
        description: "FK -> Site.id; the site whose response costs are being allocated."
      - name: round_number
        type: integer
        source: system
        description: 1 for the site's first round, then previous maximum plus 1 (counting SUPERSEDED and FAILED rounds).
        default: 1
      - name: weight_volume_bp
        type: integer
        source: input
        description: Weight of the volumetric factor in basis points.
        constraints: "0..10000"
      - name: weight_toxicity_bp
        type: integer
        source: input
        description: Weight of the toxicity factor in basis points.
        constraints: "0..10000"
      - name: weight_ownership_bp
        type: integer
        source: input
        description: Weight of the ownership-period factor in basis points.
        constraints: "0..10000"
      - name: status
        type: enum
        source: system
        description: Negotiation state of the round.
        default: DRAFTING
        constraints: "DRAFTING | BALLOTING | ADOPTED | FAILED | SUPERSEDED"
      - name: facilitator_user_id
        type: string
        source: system
        description: X-User-ID of the AllocationFacilitator who created the round.
      - name: allocated_share_total_pct
        type: number
        source: computed
        description: Sum of final_pct over this round's AllocationShare rows whose disposition == ALLOCATED; 0.00 before adoption.
        default: 0
      - name: orphan_share_pct
        type: number
        source: computed
        description: Sum of pre_settlement_final_pct over this round's shares whose disposition == ORPHANED.
        default: 0
      - name: settled_share_pct
        type: number
        source: computed
        description: Sum of pre_settlement_final_pct over this round's shares whose disposition == SETTLED.
        default: 0
      - name: accept_share_pct
        type: number
        source: computed
        description: Sum of provisional_pct over this round's shares whose ballot == ACCEPT.
        default: 0
      - name: share_count
        type: integer
        source: computed
        description: Number of AllocationShare rows in this round.
        default: 0
      - name: balloted_count
        type: integer
        source: computed
        description: Number of this round's shares whose ballot is not null.
        default: 0
      - name: adopted_at
        type: datetime
        source: system
        description: Logical-clock instant the round reached ADOPTED.
      - name: revision_note
        type: string
        source: system
        description: Note recorded by the most recent reopening.

  - name: AllocationShare
    parent: AllocationRound
    common_fields: true
    fields:
      - name: allocation_round_id
        type: string
        source: input
        description: "FK -> AllocationRound.id; the round this share belongs to."
      - name: prp_id
        type: string
        source: input
        description: "FK -> PotentiallyResponsibleParty.id; the party this share is computed for."
      - name: provisional_pct
        type: number
        source: computed
        description: Provisional allocation percentage from calculations.allocation_share_computation variant provisional; frozen once the round leaves DRAFTING.
        default: 0
      - name: final_pct
        type: number
        source: computed
        description: Final allocation percentage from variant final, stamped at adoption; 0.00 once the disposition becomes ORPHANED or SETTLED.
      - name: pre_settlement_final_pct
        type: number
        source: system
        description: final_pct captured immediately before the disposition moved to ORPHANED or SETTLED; used to restore the share exactly on void.
      - name: disposition
        type: enum
        source: system
        description: Whether this share is still carried by the party.
        default: PENDING
        constraints: "PENDING | ALLOCATED | ORPHANED | SETTLED"
      - name: ballot
        type: enum
        source: system
        description: Ballot cast for this share; null until cast.
        constraints: "ACCEPT | REJECT | ABSTAIN"
      - name: ballot_rationale
        type: string
        source: system
        description: Free-text rationale supplied with the ballot.
      - name: ballot_cast_at
        type: datetime
        source: system
        description: Logical-clock instant the ballot was recorded.

  - name: ConsentDecree
    parent: Site
    common_fields: true
    fields:
      - name: site_id
        type: string
        source: input
        description: "FK -> Site.id; the site the instrument covers."
      - name: scope_type
        type: enum
        source: input
        description: Instrument family; RIFS_AOC is an administrative order on consent for investigation work, RD_RA_CONSENT_DECREE is a judicial decree for design and construction.
        constraints: "RIFS_AOC | RD_RA_CONSENT_DECREE"
      - name: scope_summary
        type: string
        source: input
        description: Work scope the settling parties commit to.
      - name: party_prp_ids
        type: array
        source: input
        description: Signatory PRP ids; every element MUST be the id of a PotentiallyResponsibleParty whose site_id equals this decree's site_id. Reverse lookup is GET /prps/{id}/consent-decrees. Not a single-valued foreign key.
        constraints: "1..20 elements, no duplicates"
      - name: oversight_cost_cap_cents
        type: integer
        source: input
        description: Ceiling on reimbursable oversight cost for this instrument.
        constraints: "> 0"
      - name: stipulated_penalty_per_day_cents
        type: integer
        source: input
        description: Daily stipulated penalty for the first 30 days of a violation.
        constraints: "> 0"
      - name: performance_deadline
        type: string
        source: input
        description: Contractual completion date for the committed work (ISO date).
      - name: legal_status
        type: enum
        source: system
        description: First state dimension - procedural posture of the instrument.
        default: NEGOTIATING
        constraints: "NEGOTIATING | LODGED | ENTERED | TERMINATED"
      - name: compliance_status
        type: enum
        source: system
        description: Second, independent state dimension - performance posture of the settling parties.
        default: COMPLIANT
        constraints: "COMPLIANT | IN_VIOLATION | PENALTY_ACCRUING"
      - name: violation_type
        type: string
        source: system
        description: Nature of the current noncompliance; null while COMPLIANT.
      - name: first_noncompliance_date
        type: string
        source: system
        description: First day of the current violation (ISO date); null while COMPLIANT.
      - name: days_in_violation
        type: integer
        source: computed
        description: Inclusive day count from first_noncompliance_date to the cure effective_date, stamped at cure.
        default: 0
      - name: penalty_cap_cents
        type: integer
        source: computed
        description: PENALTY_CAP_BP of oversight_cost_cap_cents, per calculations.stipulated_penalty_accrual.
        default: 0
      - name: accrued_penalty_cents
        type: integer
        source: computed
        description: Penalty assessed at the most recent cure.
        default: 0
      - name: court_docket_number
        type: string
        source: system
        description: Docket number stamped at entry; null until ENTERED.
      - name: entered_at
        type: datetime
        source: system
        description: Logical-clock instant of entry.
      - name: lodged_at
        type: datetime
        source: system
        description: Logical-clock instant the decree was lodged with the court; null until LODGED.
      - name: public_comment_close_at
        type: datetime
        source: computed
        description: lodged_at plus DECREE_COMMENT_DAYS (30) days; entry is refused before this instant. Null until LODGED.
      - name: paid_penalty_cents
        type: integer
        source: system
        description: Cumulative stipulated penalty paid through CURE compliance events.
        default: 0
      - name: penalty_capped
        type: boolean
        source: computed
        description: True when the gross accrual computed by calculations.stipulated_penalty_accrual exceeded penalty_cap_cents and was clamped to the cap.
        default: false
      - name: last_assessment_at
        type: string
        source: system
        description: effective_at (ISO date) of the most recent PENALTY_ASSESSMENT compliance event; null when no assessment has been recorded for the open violation.
      - name: open_violation_count
        type: integer
        source: computed
        description: Number of violations recorded and not yet cured; 0 while compliance_status == COMPLIANT.
        default: 0
      - name: terminated_at
        type: datetime
        source: system
        description: Logical-clock instant the decree terminated; null until TERMINATED.

  - name: RemediationContract
    parent: Site
    common_fields: true
    fields:
      - name: site_id
        type: string
        source: input
        description: "FK -> Site.id; the site the construction contract serves."
      - name: record_of_decision_id
        type: string
        source: input
        description: "FK -> RecordOfDecision.id; the decision document whose selected remedy this contract builds."
      - name: solicitation_reference
        type: string
        source: input
        description: Procurement solicitation number.
      - name: engineer_estimate_cents
        type: integer
        source: input
        description: Independent government estimate used to test bid reasonableness.
        constraints: "> 0"
      - name: status
        type: enum
        source: system
        description: Procurement and construction state.
        default: SOLICITATION
        constraints: "SOLICITATION | AWARDED | CONSTRUCTION_COMPLETE | CLOSED"
      - name: contractor_name
        type: string
        source: system
        description: Awarded contractor; null while in SOLICITATION.
      - name: awarded_amount_cents
        type: integer
        source: system
        description: Awarded contract value; null while in SOLICITATION.
      - name: max_concurrent_windows
        type: integer
        source: system
        description: Crew capacity - how many buffered work windows may overlap on this contract.
        default: 2
        constraints: "1..5"
      - name: awarded_at
        type: datetime
        source: system
        description: Logical-clock instant of award.
      - name: completion_date
        type: string
        source: system
        description: Construction completion date (ISO date) recorded at construction completion.
      - name: punch_list_items
        type: integer
        source: system
        description: Outstanding punch-list item count recorded at construction completion.
        default: 0
      - name: work_window_count
        type: integer
        source: computed
        description: Number of WorkWindow rows on this contract.
        default: 0

  - name: WorkWindow
    parent: RemediationContract
    common_fields: false
    fields:
      - name: remediation_contract_id
        type: string
        source: input
        description: "FK -> RemediationContract.id; the contract whose crew occupies the window."
      - name: activity_type
        type: enum
        source: input
        description: Field activity the window is reserved for.
        constraints: "CONSTRUCTION | LONG_TERM_MONITORING | MAINTENANCE_SHUTDOWN"
      - name: start_at
        type: datetime
        source: input
        description: Inclusive start of the occupation interval (ISO 8601 UTC).
      - name: end_at
        type: datetime
        source: input
        description: Inclusive end of the occupation interval; must be strictly after start_at.
      - name: crew_size
        type: integer
        source: input
        description: Number of field personnel mobilised.
        constraints: "1..200"
      - name: description
        type: string
        source: input
        description: Scope note for the window.
      - name: buffered_start_at
        type: datetime
        source: computed
        description: start_at minus MOBILIZATION_BUFFER_HOURS.
      - name: buffered_end_at
        type: datetime
        source: computed
        description: end_at plus MOBILIZATION_BUFFER_HOURS.

  - name: CostRecoveryAction
    parent: Site
    common_fields: true
    fields:
      - name: site_id
        type: string
        source: input
        description: "FK -> Site.id; the site whose response costs are being recovered."
      - name: respondent_prp_id
        type: string
        source: input
        description: "FK -> PotentiallyResponsibleParty.id; the party the demand or offer is served on."
      - name: claimant_prp_id
        type: string
        source: input
        description: "FK -> PotentiallyResponsibleParty.id; the settling party bringing a contribution action; null for government demands and de minimis offers."
      - name: action_type
        type: enum
        source: input
        description: Which recovery instrument this row is.
        constraints: "DE_MINIMIS_SETTLEMENT | COST_RECOVERY_DEMAND | CONTRIBUTION_CLAIM"
      - name: demanded_cents
        type: integer
        source: input
        description: Amount demanded or offered.
        constraints: "> 0"
      - name: premium_floor_cents
        type: integer
        source: computed
        description: Minimum acceptable de minimis payment from calculations.de_minimis_premium_floor; null for non de minimis action types.
      - name: respondent_share_pct_at_offer
        type: number
        source: computed
        description: The respondent's final_pct in the site's ADOPTED round at the moment the action was created.
      - name: status
        type: enum
        source: system
        description: Recovery-action state.
        default: OFFERED
        constraints: "OFFERED | ACCEPTED | REJECTED | COLLECTED | VOIDED | SUPERSEDED"
      - name: received_cents
        type: integer
        source: system
        description: Cash actually received. 0 at creation, accumulates every partial receipt, equals demanded_cents once the action is COLLECTED, and is reset to 0 by a voiding.
      - name: received_at
        type: datetime
        source: system
        description: Receipt timestamp recorded at collection.
      - name: void_reason
        type: string
        source: system
        description: Reason recorded when the action is voided.

# ---------------------------------------------------------------------------
# 1.2 State Machine Table
# ---------------------------------------------------------------------------
state_machines:
  - entity: Site
    dimension: listing_status
    initial_state: PROPOSED
    terminal_states: [DELETED_FROM_NPL]
    shape: cyclic
    transitions:
      - from: PROPOSED
        to: LISTED
        trigger: "POST /sites/{id}/list-on-npl"
        actor: RemedialProjectManager
        preconditions:
          - "site.listing_status == PROPOSED"
          - "site.hrs_score >= HRS_LISTING_THRESHOLD (28.50); exactly 28.50 qualifies"
        side_effects:
          - "site.listing_reference = payload.listing_reference"
          - "site.version incremented by 1"
      - from: LISTED
        to: RI_FS_UNDERWAY
        trigger: "system: first POST /sites/{id}/remedial-investigations accepted for this site"
        actor: system
        preconditions:
          - "site.listing_status == LISTED"
        side_effects:
          - "site.version incremented by 1"
        note: "Automatic; a second RI created while already RI_FS_UNDERWAY leaves listing_status unchanged."
      - from: RI_FS_UNDERWAY
        to: ROD_SIGNED
        trigger: "system: POST /records-of-decision/{id}/signature accepted for a ROD of this site"
        actor: system
        preconditions:
          - "site.listing_status IN {RI_FS_UNDERWAY, REMEDY_REEVALUATION}"
        side_effects:
          - "site.version incremented by 1"
      - from: REMEDY_REEVALUATION
        to: ROD_SIGNED
        trigger: "system: POST /records-of-decision/{id}/signature accepted for an amended ROD of this site"
        actor: system
        preconditions:
          - "site.listing_status == REMEDY_REEVALUATION"
        side_effects:
          - "site.version incremented by 1"
          - "every RecordOfDecision of this site whose status == AMENDMENT_REQUIRED moves to WITHDRAWN (conditional cascade: only AMENDMENT_REQUIRED documents, never SIGNED ones)"
          - "site.cost_posture recomputed by calculations.cost_posture_derivation (the AMENDMENT_REQUIRED trigger for RESTRICTED disappears)"
        note: "Closes the reevaluation cycle OM_PHASE -> REMEDY_REEVALUATION -> ROD_SIGNED -> CONSTRUCTION -> OM_PHASE."
      - from: ROD_SIGNED
        to: CONSTRUCTION
        trigger: "system: POST /remediation-contracts/{id}/award accepted for a contract of this site"
        actor: system
        preconditions:
          - "site.listing_status == ROD_SIGNED"
        side_effects:
          - "site.total_response_cost_cents recomputed (the awarded amount enters the response-cost basis)"
          - "site.unrecovered_cost_cents and site.orphan_write_off_cents recomputed by calculations.cost_recovery_ledger"
          - "site.version incremented by 1"
      - from: CONSTRUCTION
        to: OM_PHASE
        trigger: "system: POST /remediation-contracts/{id}/construction-completion accepted"
        actor: system
        preconditions:
          - "site.listing_status == CONSTRUCTION"
        side_effects:
          - "site.construction_complete_at = completion_date at 00:00:00.000Z"
          - "site.five_year_review_due_at = construction_complete_at + FIVE_YEAR_REVIEW_INTERVAL_DAYS (1826)"
          - "site.version incremented by 1"
      - from: OM_PHASE
        to: REMEDY_REEVALUATION
        trigger: "POST /sites/{id}/five-year-review with protectiveness_determination == NOT_PROTECTIVE"
        actor: RemedialProjectManager
        preconditions:
          - "site.listing_status == OM_PHASE"
          - "current logical clock >= site.five_year_review_due_at (exact equality qualifies)"
        side_effects:
          - "CASCADE HOP 1: site.listing_status = REMEDY_REEVALUATION; site.last_five_year_review_at = review_date; site.five_year_review_due_at = the PREVIOUS five_year_review_due_at + 1826 days (calculations.five_year_review_schedule chains off the due date, never off the review date)"
          - "CASCADE HOP 2 (caused by hop 1): because the site entered REMEDY_REEVALUATION, the site's RecordOfDecision whose status == SIGNED moves to AMENDMENT_REQUIRED"
          - "CASCADE HOP 3 (caused by hop 2): because that ROD is now AMENDMENT_REQUIRED, calculations.cost_posture_derivation re-evaluates and site.cost_posture becomes RESTRICTED"
          - "site.version incremented by 1"
      - from: OM_PHASE
        to: OM_PHASE
        trigger: "POST /sites/{id}/five-year-review with protectiveness_determination IN {PROTECTIVE, PROTECTIVE_SHORT_TERM} and deletion_recommended == false"
        actor: RemedialProjectManager
        preconditions:
          - "site.listing_status == OM_PHASE"
          - "current logical clock >= site.five_year_review_due_at"
        side_effects:
          - "site.last_five_year_review_at = review_date; site.five_year_review_due_at = the PREVIOUS five_year_review_due_at + 1826 days (never review_date + 1826)"
          - "site.cost_posture recomputed (unchanged unless another trigger applies)"
          - "site.version incremented by 1"
      - from: OM_PHASE
        to: DELETED_FROM_NPL
        trigger: "POST /sites/{id}/five-year-review with protectiveness_determination == PROTECTIVE and deletion_recommended == true"
        actor: RemedialProjectManager
        preconditions:
          - "site.listing_status == OM_PHASE"
          - "current logical clock >= site.five_year_review_due_at"
          - "site.unrecovered_cost_cents <= 0"
        side_effects:
          - "site.last_five_year_review_at = review_date"
          - "site.version incremented by 1"
        note: "Terminal: every write endpoint scoped under a DELETED_FROM_NPL site is rejected with ERR_SITE_PHASE_INVALID."

  - entity: Site
    dimension: cost_posture
    initial_state: OPEN
    terminal_states: []
    shape: compound
    transitions:
      - from: "OPEN | RESTRICTED"
        to: FROZEN
        trigger: "system: recomputation of calculations.cost_posture_derivation after any ConsentDecree compliance event, oversight posting, ROD status change, or listing_status change"
        actor: system
        preconditions:
          - "at least one ConsentDecree of this site has compliance_status == PENALTY_ACCRUING"
        side_effects:
          - "site.cost_posture = FROZEN; POST /sites/{id}/oversight-costs, POST /sites/{id}/allocation-rounds, POST /sites/{id}/cost-recovery-actions and POST /remediation-contracts/{id}/work-windows are all rejected with ERR_SITE_COST_FROZEN while FROZEN"
      - from: "OPEN | FROZEN"
        to: RESTRICTED
        trigger: "system: recomputation of calculations.cost_posture_derivation"
        actor: system
        preconditions:
          - "no ConsentDecree of this site has compliance_status == PENALTY_ACCRUING"
          - "site.oversight_cap_utilization_pct >= COST_RESTRICTION_UTILIZATION_PCT (90.00) OR a ConsentDecree of this site has compliance_status == IN_VIOLATION OR a RecordOfDecision of this site has status == AMENDMENT_REQUIRED OR site.listing_status == REMEDY_REEVALUATION"
        side_effects:
          - "site.cost_posture = RESTRICTED; POST /sites/{id}/allocation-rounds, POST /remediation-contracts/{id}/award and POST /remediation-contracts/{id}/work-windows are rejected with ERR_SITE_COST_RESTRICTED, while oversight postings and cost-recovery actions remain allowed"
      - from: "RESTRICTED | FROZEN"
        to: OPEN
        trigger: "system: recomputation of calculations.cost_posture_derivation"
        actor: system
        preconditions:
          - "none of the FROZEN or RESTRICTED conditions hold"
        side_effects:
          - "site.cost_posture = OPEN"

  - entity: PotentiallyResponsibleParty
    initial_state: IDENTIFIED
    terminal_states: [ORPHAN]
    shape: cyclic
    note: "SETTLED and DE_MINIMIS_SETTLED are quiescent but not terminal: voiding the settlement or demand that produced them returns the party to PARTICIPATING (compensating transitions below). ORPHAN is the only truly terminal state."
    transitions:
      - from: IDENTIFIED
        to: NOTIFIED
        trigger: "POST /prps/{id}/notice"
        actor: RemedialProjectManager
        preconditions:
          - "prp.status == IDENTIFIED"
          - "site.listing_status NOT IN {PROPOSED, DELETED_FROM_NPL}"
        side_effects:
          - "prp.notice_reference = payload.notice_reference"
          - "prp.version incremented by 1"
      - from: NOTIFIED
        to: PARTICIPATING
        trigger: "POST /prps/{id}/response with election == PARTICIPATE"
        actor: PRPRepresentative
        preconditions:
          - "prp.status == NOTIFIED"
          - "X-User-ID == prp.id"
        side_effects:
          - "prp.version incremented by 1"
      - from: NOTIFIED
        to: RECALCITRANT
        trigger: "POST /prps/{id}/response with election == DECLINE"
        actor: PRPRepresentative
        preconditions:
          - "prp.status == NOTIFIED"
          - "X-User-ID == prp.id"
        side_effects:
          - "prp.version incremented by 1"
      - from: RECALCITRANT
        to: PARTICIPATING
        trigger: "POST /prps/{id}/response with election == PARTICIPATE"
        actor: PRPRepresentative
        preconditions:
          - "prp.status == RECALCITRANT"
          - "X-User-ID == prp.id"
        side_effects:
          - "prp.version incremented by 1"
        note: "Re-election loop RECALCITRANT -> PARTICIPATING -> (decline again) RECALCITRANT is permitted while no round is ADOPTED."
      - from: PARTICIPATING
        to: RECALCITRANT
        trigger: "POST /prps/{id}/response with election == DECLINE"
        actor: PRPRepresentative
        preconditions:
          - "prp.status == PARTICIPATING"
          - "X-User-ID == prp.id"
          - "the party is not a signatory of any ConsentDecree of this site whose legal_status IN {LODGED, ENTERED}"
        side_effects:
          - "prp.version incremented by 1"
      - from: "NOTIFIED | PARTICIPATING | RECALCITRANT"
        to: ORPHAN
        trigger: "POST /prps/{id}/defunct"
        actor: RemedialProjectManager
        preconditions:
          - "prp.status IN {NOTIFIED, PARTICIPATING, RECALCITRANT}"
        side_effects:
          - "prp.status = ORPHAN; prp.version incremented by 1"
          - "for the site's AllocationRound whose status == ADOPTED, this party's AllocationShare records pre_settlement_final_pct = final_pct, sets final_pct = 0.00 and disposition = ORPHANED; round.orphan_share_pct and round.allocated_share_total_pct are recomputed"
          - "for the site's AllocationRound whose status IN {DRAFTING, BALLOTING}, this party's AllocationShare.ballot is stamped ABSTAIN (conditional cascade: only rounds not yet ADOPTED get the auto-abstain) and round.balloted_count / accept_share_pct are recomputed"
          - "site.orphan_write_off_cents and site.unrecovered_cost_cents recomputed by calculations.cost_recovery_ledger"
      - from: PARTICIPATING
        to: DE_MINIMIS_SETTLED
        trigger: "system: POST /cost-recovery-actions/{id}/response with decision == ACCEPT on a DE_MINIMIS_SETTLEMENT naming this party as respondent"
        actor: system
        preconditions:
          - "prp.status == PARTICIPATING"
          - "prp.de_minimis_eligible == true"
        side_effects:
          - "prp.contribution_protection = true; prp.version incremented by 1"
          - "see the CostRecoveryAction OFFERED -> ACCEPTED transition for the rest of the cascade"
      - from: DE_MINIMIS_SETTLED
        to: PARTICIPATING
        trigger: "system: POST /cost-recovery-actions/{id}/voiding on the accepted or collected DE_MINIMIS_SETTLEMENT of this party"
        actor: system
        preconditions:
          - "prp.status == DE_MINIMIS_SETTLED"
        side_effects:
          - "prp.contribution_protection = false; prp.version incremented by 1"
          - "the party's AllocationShare is restored: final_pct = pre_settlement_final_pct, disposition = ALLOCATED, pre_settlement_final_pct = null"
      - from: "PARTICIPATING | RECALCITRANT"
        to: SETTLED
        trigger: "system: POST /cost-recovery-actions/{id}/collection on a COST_RECOVERY_DEMAND naming this party as respondent, when action.received_cents reaches action.demanded_cents"
        actor: system
        preconditions:
          - "prp.status IN {PARTICIPATING, RECALCITRANT}"
        side_effects:
          - "prp.contribution_protection = true; prp.version incremented by 1"
        note: "A SETTLED party can no longer ballot or receive new demands."
      - from: SETTLED
        to: PARTICIPATING
        trigger: "system: POST /cost-recovery-actions/{id}/voiding on that COLLECTED COST_RECOVERY_DEMAND"
        actor: system
        preconditions:
          - "prp.status == SETTLED"
        side_effects:
          - "prp.contribution_protection = false; prp.version incremented by 1"
          - "the party's AllocationShare is untouched: a demand settlement never zeroed final_pct, so nothing has to be restored"

  - entity: WasteInRecord
    initial_state: SUBMITTED
    terminal_states: [VERIFIED, REJECTED]
    shape: branching
    transitions:
      - from: SUBMITTED
        to: VERIFIED
        trigger: "POST /waste-in-records/{id}/verification with decision == VERIFIED"
        actor: RemedialProjectManager
        preconditions:
          - "record.status == SUBMITTED"
          - "payload.verified_volume_tons is present and > 0 and <= record.volume_tons"
        side_effects:
          - "CASCADE HOP 1: record.status = VERIFIED, record.verified_volume_tons = payload.verified_volume_tons, record.effective_volume_tons = payload.verified_volume_tons, record.verified_by_user_id = X-User-ID, record.version incremented by 1"
          - "CASCADE HOP 2 (caused by hop 1): because the record's effective volume changed, the owning PRP's verified_volume_tons, submitted_volume_tons, max_toxicity_class and volumetric_share_pct are recomputed, then prp.de_minimis_eligible is recomputed by calculations.de_minimis_eligibility; site.verified_waste_volume_tons is recomputed and EVERY PRP of the site has volumetric_share_pct and de_minimis_eligible recomputed because the denominator moved"
          - "CASCADE HOP 3 (caused by hop 2): because party volumes changed, every AllocationShare of the site's AllocationRound whose status == DRAFTING has provisional_pct recomputed by calculations.allocation_share_computation variant provisional; rounds in BALLOTING, ADOPTED, FAILED or SUPERSEDED are left untouched (provisional_pct is frozen once the round leaves DRAFTING)"
      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /waste-in-records/{id}/verification with decision == REJECTED"
        actor: RemedialProjectManager
        preconditions:
          - "record.status == SUBMITTED"
          - "payload.verified_volume_tons is absent"
        side_effects:
          - "record.status = REJECTED, record.effective_volume_tons = 0, record.verified_by_user_id = X-User-ID, record.version incremented by 1"
          - "the same hop-2 and hop-3 recomputations described for the VERIFIED transition run, with this record contributing 0"

  - entity: RemedialInvestigation
    initial_state: DRAFT
    terminal_states: [APPROVED]
    shape: cyclic
    transitions:
      - from: DRAFT
        to: UNDER_REVIEW
        trigger: "POST /remedial-investigations/{id}/submission"
        actor: RemedialProjectManager
        preconditions:
          - "ri.status IN {DRAFT, REVISION_REQUESTED}"
          - "ri.valid_sample_count >= 1 (at least one ContaminantSample of this RI has medium == ri.exposure_medium and qa_status == VALID)"
        side_effects:
          - "calculations.risk_assessment runs and stamps central_tendency_epc_ug_per_l, rme_epc_ug_per_l, central_tendency_risk, rme_risk, hazard_index and action_level_exceeded"
          - "every RemedyAlternative of this RI has remedy_score recomputed by calculations.remedy_score because the weighting branch depends on ri.action_level_exceeded"
          - "ri.version incremented by 1"
      - from: REVISION_REQUESTED
        to: UNDER_REVIEW
        trigger: "POST /remedial-investigations/{id}/submission"
        actor: RemedialProjectManager
        preconditions:
          - "ri.status == REVISION_REQUESTED"
          - "ri.valid_sample_count >= 1"
        side_effects:
          - "same recomputation set as DRAFT -> UNDER_REVIEW (samples added during the revision change the EPCs)"
          - "ri.version incremented by 1"
        note: "Closes the revision cycle UNDER_REVIEW -> REVISION_REQUESTED -> UNDER_REVIEW."
      - from: UNDER_REVIEW
        to: REVISION_REQUESTED
        trigger: "POST /remedial-investigations/{id}/review with decision == REQUEST_REVISION"
        actor: RemedialProjectManager
        preconditions:
          - "ri.status == UNDER_REVIEW"
          - "X-User-ID != ri.authored_by_user_id (segregation of duties)"
        side_effects:
          - "ri.revision_round_count incremented by 1; ri.version incremented by 1"
      - from: UNDER_REVIEW
        to: APPROVED
        trigger: "POST /remedial-investigations/{id}/review with decision == APPROVE"
        actor: RemedialProjectManager
        preconditions:
          - "ri.status == UNDER_REVIEW"
          - "X-User-ID != ri.authored_by_user_id (segregation of duties)"
        side_effects:
          - "ri.approved_by_user_id = X-User-ID; ri.version incremented by 1"
        note: "Terminal for the RI; the approver's user id is what the ROD signature check later excludes."

  - entity: RecordOfDecision
    initial_state: DRAFT
    terminal_states: [SIGNED, WITHDRAWN]
    shape: branching
    transitions:
      - from: DRAFT
        to: PUBLIC_COMMENT
        trigger: "POST /records-of-decision/{id}/comment-period"
        actor: RemedialProjectManager
        preconditions:
          - "rod.status == DRAFT"
          - "the referenced RemedialInvestigation.status == APPROVED"
        side_effects:
          - "rod.comment_period_start = current logical clock; rod.comment_period_end = comment_period_start + rod.comment_period_days days"
          - "rod.version incremented by 1"
      - from: PUBLIC_COMMENT
        to: SIGNED
        trigger: "POST /records-of-decision/{id}/signature"
        actor: RemedialProjectManager
        preconditions:
          - "rod.status == PUBLIC_COMMENT"
          - "current logical clock > rod.comment_period_end"
          - "rod.public_comments_count >= 1"
          - "X-User-ID != referenced RemedialInvestigation.approved_by_user_id (segregation of duties)"
          - "the selected RemedyAlternative belongs to the same RemedialInvestigation as this ROD"
          - "when ri.action_level_exceeded == true the selected alternative's effectiveness_score >= PROTECTIVE_EFFECTIVENESS_MIN (60)"
        side_effects:
          - "the selected alternative's selected_by_rod_id = rod.id and rod.selected_alternative_id mirrors it (see calculations.remedy_selector for how the alternative is chosen when alternative_id is omitted)"
          - "rod.status = SIGNED, rod.signed_by_user_id = X-User-ID, rod.signed_at = clock, rod.responsiveness_summary = payload.responsiveness_summary; rod.version incremented by 1"
          - "site.listing_status advances RI_FS_UNDERWAY -> ROD_SIGNED (or REMEDY_REEVALUATION -> ROD_SIGNED for an amended decision)"
      - from: SIGNED
        to: AMENDMENT_REQUIRED
        trigger: "system: POST /sites/{id}/five-year-review with protectiveness_determination == NOT_PROTECTIVE"
        actor: system
        preconditions:
          - "rod.status == SIGNED"
        side_effects:
          - "rod.version incremented by 1"
          - "site.cost_posture recomputed and becomes RESTRICTED (hop 3 of the five-year-review cascade)"
      - from: AMENDMENT_REQUIRED
        to: WITHDRAWN
        trigger: "system: signature of a later ROD for the same site while listing_status == REMEDY_REEVALUATION"
        actor: system
        preconditions:
          - "rod.status == AMENDMENT_REQUIRED"
        side_effects:
          - "rod.version incremented by 1"
          - "site.cost_posture recomputed (the AMENDMENT_REQUIRED restriction trigger is gone)"

  - entity: AllocationRound
    initial_state: DRAFTING
    terminal_states: [ADOPTED, SUPERSEDED]
    shape: cyclic
    transitions:
      - from: DRAFTING
        to: BALLOTING
        trigger: "POST /allocation-rounds/{id}/balloting"
        actor: AllocationFacilitator
        preconditions:
          - "round.status == DRAFTING"
          - "round.share_count >= 2"
        side_effects:
          - "provisional_pct on every share of this round is frozen (later waste-in verifications no longer recompute it)"
          - "round.version incremented by 1"
      - from: BALLOTING
        to: DRAFTING
        trigger: "POST /allocation-rounds/{id}/reopening"
        actor: AllocationFacilitator
        preconditions:
          - "round.status IN {BALLOTING, FAILED}"
        side_effects:
          - "every share of this round has ballot, ballot_rationale and ballot_cast_at cleared to null; round.balloted_count = 0; round.accept_share_pct = 0.00"
          - "provisional_pct on every share is recomputed by calculations.allocation_share_computation variant provisional against current data, and shares are created for PRPs that entered the candidate set since the round was created"
          - "round.revision_note = payload.revision_note; round.version incremented by 1"
        note: "The negotiation cycle: BALLOTING -> DRAFTING -> BALLOTING as many times as the facilitator needs."
      - from: FAILED
        to: DRAFTING
        trigger: "POST /allocation-rounds/{id}/reopening"
        actor: AllocationFacilitator
        preconditions:
          - "round.status == FAILED"
        side_effects:
          - "same clearing and recomputation as the BALLOTING -> DRAFTING transition"
      - from: BALLOTING
        to: ADOPTED
        trigger: "system: the ballot that makes round.balloted_count == round.share_count, when round.accept_share_pct >= ADOPTION_THRESHOLD_PCT"
        actor: system
        preconditions:
          - "round.status == BALLOTING"
          - "round.balloted_count == round.share_count"
          - "round.accept_share_pct >= ADOPTION_THRESHOLD_PCT (66.67); exact equality adopts"
        side_effects:
          - "calculations.allocation_share_computation variant final runs: every share of a liable party gets final_pct and disposition = ALLOCATED"
          - "shares whose PRP.status == ORPHAN get pre_settlement_final_pct = final_pct, final_pct = 0.00, disposition = ORPHANED; shares whose PRP.status == DE_MINIMIS_SETTLED get the same treatment with disposition = SETTLED"
          - "round.allocated_share_total_pct, round.orphan_share_pct and round.settled_share_pct are stamped so that allocated + orphan + settled == 100.00 exactly"
          - "round.adopted_at = clock; site.adopted_round_id = round.id; site.orphan_write_off_cents and site.unrecovered_cost_cents recomputed"
          - "round.version incremented by 1"
      - from: BALLOTING
        to: FAILED
        trigger: "system: the ballot that makes round.balloted_count == round.share_count, when round.accept_share_pct < ADOPTION_THRESHOLD_PCT"
        actor: system
        preconditions:
          - "round.status == BALLOTING"
          - "round.balloted_count == round.share_count"
          - "round.accept_share_pct < 66.67"
        side_effects:
          - "no final_pct is stamped; every share keeps disposition == PENDING"
          - "round.version incremented by 1"
      - from: "DRAFTING | BALLOTING | FAILED"
        to: SUPERSEDED
        trigger: "system: POST /sites/{id}/allocation-rounds accepted for the same site"
        actor: system
        preconditions:
          - "round.status IN {DRAFTING, BALLOTING, FAILED}"
        side_effects:
          - "round.version incremented by 1"
        note: "A newly created round legitimately supersedes the site's open round; this is why the create endpoint is guarded by OCC on Site.version (see concurrency_rules.allocation-round-create-stale-site)."

  - entity: AllocationShare
    dimension: disposition
    initial_state: PENDING
    terminal_states: []
    shape: compound
    transitions:
      - from: PENDING
        to: ALLOCATED
        trigger: "system: adoption of the owning AllocationRound"
        actor: system
        preconditions:
          - "round.status transitions BALLOTING -> ADOPTED"
          - "the share's PRP.status IN {PARTICIPATING, RECALCITRANT}"
        side_effects:
          - "share.final_pct stamped from calculations.allocation_share_computation variant final; share.version incremented by 1"
      - from: ALLOCATED
        to: ORPHANED
        trigger: "system: POST /prps/{id}/defunct for this share's party"
        actor: system
        preconditions:
          - "share.disposition == ALLOCATED"
          - "the owning round.status == ADOPTED"
        side_effects:
          - "share.pre_settlement_final_pct = share.final_pct; share.final_pct = 0.00; round.orphan_share_pct increased by that amount; round.allocated_share_total_pct decreased by the same amount; share.version incremented by 1"
      - from: ALLOCATED
        to: SETTLED
        trigger: "system: POST /cost-recovery-actions/{id}/response with decision == ACCEPT on a DE_MINIMIS_SETTLEMENT for this share's party"
        actor: system
        preconditions:
          - "share.disposition == ALLOCATED"
          - "the owning round.status == ADOPTED"
        side_effects:
          - "share.pre_settlement_final_pct = share.final_pct; share.final_pct = 0.00; round.settled_share_pct increased by that amount; round.allocated_share_total_pct decreased by the same amount; share.version incremented by 1"
      - from: SETTLED
        to: ALLOCATED
        trigger: "system: POST /cost-recovery-actions/{id}/voiding on that DE_MINIMIS_SETTLEMENT"
        actor: system
        preconditions:
          - "share.disposition == SETTLED"
          - "share.pre_settlement_final_pct is not null"
        side_effects:
          - "share.final_pct = share.pre_settlement_final_pct; share.pre_settlement_final_pct = null; round.settled_share_pct decreased by that amount; round.allocated_share_total_pct increased by the same amount; share.version incremented by 1"
        note: "Compensating action: allocated + orphan + settled returns to exactly 100.00 with no drift."

  - entity: ConsentDecree
    dimension: legal_status
    initial_state: NEGOTIATING
    terminal_states: [TERMINATED]
    shape: linear
    transitions:
      - from: NEGOTIATING
        to: LODGED
        trigger: "POST /consent-decrees/{id}/lodging"
        actor: SettlementCounsel
        preconditions:
          - "decree.legal_status == NEGOTIATING"
          - "the site has an ADOPTED AllocationRound (site.adopted_round_id is not null)"
          - "every PRP named as a signatory has status == PARTICIPATING"
        side_effects:
          - "decree.lodged_at = current logical clock; decree.public_comment_close_at = lodged_at + DECREE_COMMENT_DAYS (30) days"
          - "decree.version incremented by 1"
      - from: LODGED
        to: ENTERED
        trigger: "POST /consent-decrees/{id}/entry"
        actor: SettlementCounsel
        preconditions:
          - "decree.legal_status == LODGED"
          - "current logical clock >= decree.public_comment_close_at"
        side_effects:
          - "decree.entered_at = clock; decree.compliance_status = COMPLIANT; decree.first_noncompliance_date = null; decree.penalty_cap_cents = round_half_up(decree.oversight_cost_cap_cents * PENALTY_CAP_BP / 10000)"
          - "site.cost_posture and site.oversight_cap_utilization_pct are recomputed against decree.oversight_cost_cap_cents (an unentered decree keeps the site RESTRICTED for oversight billing)"
          - "decree.version incremented by 1"
      - from: ENTERED
        to: TERMINATED
        trigger: "system: POST /remediation-contracts/{id}/construction-completion when the site has no unpaid stipulated penalties and every work window is closed"
        actor: system
        preconditions:
          - "decree.legal_status == ENTERED"
          - "decree.compliance_status == COMPLIANT"
          - "decree.accrued_penalty_cents == decree.paid_penalty_cents"
        side_effects:
          - "decree.terminated_at = clock; decree.version incremented by 1"

  - entity: ConsentDecree
    dimension: compliance_status
    initial_state: COMPLIANT
    terminal_states: []
    shape: cyclic
    transitions:
      - from: COMPLIANT
        to: IN_VIOLATION
        trigger: "POST /consent-decrees/{id}/compliance-events with event_type == VIOLATION"
        actor: SettlementCounsel
        preconditions:
          - "decree.legal_status == ENTERED"
          - "decree.compliance_status == COMPLIANT"
        side_effects:
          - "decree.compliance_status = IN_VIOLATION; decree.first_noncompliance_date = payload.effective_at; decree.open_violation_count incremented by 1; decree.violation_type = payload.violation_type"
          - "site.cost_posture recomputed -> RESTRICTED (an open violation restricts new contract awards but not oversight billing)"
          - "decree.version incremented by 1"
      - from: IN_VIOLATION
        to: PENALTY_ACCRUING
        trigger: "system: POST /consent-decrees/{id}/compliance-events with event_type == PENALTY_ASSESSMENT"
        actor: SettlementCounsel
        preconditions:
          - "decree.compliance_status == IN_VIOLATION"
          - "payload.effective_at >= decree.first_noncompliance_date"
        side_effects:
          - "calculations.stipulated_penalty_accrual runs over [first_noncompliance_date, payload.effective_at] inclusive and sets decree.days_in_violation, decree.accrued_penalty_cents and decree.penalty_capped; decree.last_assessment_at = payload.effective_at"
          - "decree.compliance_status = PENALTY_ACCRUING; decree.version incremented by 1"
      - from: PENALTY_ACCRUING
        to: PENALTY_ACCRUING
        trigger: "system: a further PENALTY_ASSESSMENT event on the same open violation"
        actor: SettlementCounsel
        preconditions:
          - "decree.compliance_status == PENALTY_ACCRUING"
          - "payload.effective_at > decree.last_assessment_at"
        side_effects:
          - "days_in_violation and accrued_penalty_cents are recomputed from first_noncompliance_date to the new effective_at (never incrementally, so the 30-day rate step is never applied twice); decree.last_assessment_at = payload.effective_at"
          - "decree.version incremented by 1"
        note: "Self-loop: repeated assessment must be idempotent in aggregate, not additive."
      - from: "IN_VIOLATION | PENALTY_ACCRUING"
        to: COMPLIANT
        trigger: "POST /consent-decrees/{id}/compliance-events with event_type == CURE"
        actor: SettlementCounsel
        preconditions:
          - "decree.compliance_status IN {IN_VIOLATION, PENALTY_ACCRUING}"
          - "payload.paid_penalty_cents == decree.accrued_penalty_cents - decree.paid_penalty_cents (the outstanding balance must be paid in full)"
        side_effects:
          - "decree.paid_penalty_cents = decree.accrued_penalty_cents; decree.compliance_status = COMPLIANT; decree.first_noncompliance_date = null; decree.last_assessment_at = null; decree.days_in_violation = 0; decree.open_violation_count decremented by 1"
          - "site.recovered_cost_cents increased by payload.paid_penalty_cents is NOT performed: stipulated penalties are punitive and never reduce unrecovered response cost (see calculations.cost_recovery_ledger)"
          - "site.cost_posture recomputed; decree.version incremented by 1"
        note: "Closes the compliance cycle COMPLIANT -> IN_VIOLATION -> PENALTY_ACCRUING -> COMPLIANT. This dimension moves independently of legal_status, which stays ENTERED throughout."

  - entity: RemediationContract
    initial_state: SOLICITATION
    terminal_states: [CLOSED]
    shape: linear
    transitions:
      - from: SOLICITATION
        to: AWARDED
        trigger: "POST /remediation-contracts/{id}/award"
        actor: RemedialProjectManager
        preconditions:
          - "contract.status == SOLICITATION"
          - "the referenced RecordOfDecision.status == SIGNED"
          - "site.cost_posture != FROZEN and site.cost_posture != RESTRICTED"
          - "payload.awarded_amount_cents <= contract.engineer_estimate_cents * (1 + BID_TOLERANCE_BP / 10000)"
        side_effects:
          - "contract.awarded_amount_cents = payload.awarded_amount_cents; contract.contractor_name = payload.contractor_name; contract.max_concurrent_windows = payload.max_concurrent_windows; contract.awarded_at = clock"
          - "site.total_response_cost_cents increased by awarded_amount_cents; site.unrecovered_cost_cents recomputed; site.listing_status advances ROD_SIGNED -> CONSTRUCTION"
          - "contract.version incremented by 1"
      - from: AWARDED
        to: CONSTRUCTION_COMPLETE
        trigger: "POST /remediation-contracts/{id}/construction-completion"
        actor: RemedialProjectManager
        preconditions:
          - "contract.status == AWARDED"
          - "contract.work_window_count >= 1"
        side_effects:
          - "contract.completion_date = the date part of the logical clock; contract.punch_list_items = payload.punch_list_items; site.listing_status advances CONSTRUCTION -> OM_PHASE; site.construction_complete_at = the date part of the logical clock at 00:00:00.000Z; site.five_year_review_due_at = site.construction_complete_at + FIVE_YEAR_REVIEW_DAYS (1826) days, also at 00:00:00.000Z (calculations.five_year_review_schedule)"
          - "if the site has an ENTERED decree with no outstanding penalty balance it TERMINATES (see ConsentDecree.legal_status)"
          - "contract.version incremented by 1"
      - from: CONSTRUCTION_COMPLETE
        to: CLOSED
        trigger: "system: POST /sites/{id}/five-year-review with protectiveness_determination == PROTECTIVE"
        actor: system
        preconditions:
          - "contract.status == CONSTRUCTION_COMPLETE"
        side_effects:
          - "contract.status = CLOSED with no further field changes (completion_date is already stamped); contract.version incremented by 1"

  - entity: CostRecoveryAction
    initial_state: OFFERED
    terminal_states: [REJECTED, VOIDED, SUPERSEDED]
    shape: branching
    transitions:
      - from: OFFERED
        to: ACCEPTED
        trigger: "POST /cost-recovery-actions/{id}/response with decision == ACCEPT"
        actor: PRPRepresentative
        preconditions:
          - "action.status == OFFERED"
          - "X-User-ID resolves to action.respondent_prp_id (actor identity)"
          - "when action.action_type == DE_MINIMIS_SETTLEMENT the respondent's de_minimis_eligible == true and action.demanded_cents >= action.premium_floor_cents (calculations.de_minimis_premium_floor)"
        side_effects:
          - "action.status = ACCEPTED; action.received_cents stays 0 until money arrives"
          - "for DE_MINIMIS_SETTLEMENT: respondent PRP.status -> DE_MINIMIS_SETTLED, contribution_protection = true, and the party's AllocationShare disposition -> SETTLED (share.final_pct reallocated to round.settled_share_pct)"
          - "action.version incremented by 1"
      - from: OFFERED
        to: REJECTED
        trigger: "POST /cost-recovery-actions/{id}/response with decision == REJECT"
        actor: PRPRepresentative
        preconditions:
          - "action.status == OFFERED"
          - "X-User-ID resolves to action.respondent_prp_id"
        side_effects:
          - "action.status = REJECTED; action.version incremented by 1"
          - "for COST_RECOVERY_DEMAND the respondent PRP.status -> RECALCITRANT"
      - from: ACCEPTED
        to: COLLECTED
        trigger: "POST /cost-recovery-actions/{id}/collection"
        actor: SettlementCounsel
        preconditions:
          - "action.status == ACCEPTED"
          - "payload.received_cents <= action.demanded_cents - action.received_cents (overpayment is refused, not clamped)"
        side_effects:
          - "action.received_cents increased by payload.received_cents; action.received_at = clock; when action.received_cents == action.demanded_cents action.status = COLLECTED, otherwise the action stays ACCEPTED (partial receipt)"
          - "site.recovered_cost_cents increased by payload.received_cents; site.unrecovered_cost_cents recomputed so that recovered + orphan_write_off + unrecovered == total_response_cost_cents"
          - "for a fully collected COST_RECOVERY_DEMAND the respondent PRP.status -> SETTLED with contribution_protection = true"
          - "action.version incremented by 1"
      - from: "ACCEPTED | COLLECTED"
        to: VOIDED
        trigger: "POST /cost-recovery-actions/{id}/voiding"
        actor: SettlementCounsel
        preconditions:
          - "action.status IN {ACCEPTED, COLLECTED}"
          - "payload.void_reason is supplied"
        side_effects:
          - "COMPENSATION: site.recovered_cost_cents decreased by action.received_cents; action.received_cents = 0; site.unrecovered_cost_cents recomputed and the ledger identity holds again with no drift"
          - "for DE_MINIMIS_SETTLEMENT: respondent PRP.status DE_MINIMIS_SETTLED -> PARTICIPATING, contribution_protection = false, de_minimis_eligible recomputed, and the party's AllocationShare disposition SETTLED -> ALLOCATED with final_pct restored from pre_settlement_final_pct"
          - "for a COLLECTED COST_RECOVERY_DEMAND: respondent PRP.status SETTLED -> PARTICIPATING and contribution_protection = false"
          - "action.void_reason = payload.void_reason; action.version incremented by 1"
      - from: OFFERED
        to: SUPERSEDED
        trigger: "system: POST /sites/{id}/cost-recovery-actions accepted for the same respondent and the same action_type"
        actor: system
        preconditions:
          - "action.status == OFFERED"
        side_effects:
          - "action.version incremented by 1"
        note: "A revised offer legitimately supersedes the open one; guarded by OCC on the respondent PRP's version (see concurrency_rules.cost-recovery-action-create-stale-prp)."

# ---------------------------------------------------------------------------
# 1.2.1 Concurrency Rules (OCC on the parent's version; no other mechanism)
# ---------------------------------------------------------------------------
concurrency_rules:
  - rule_id: allocation-round-create-stale-site
    parent_entity: Site
    write_endpoint: "POST /sites/{id}/allocation-rounds"
    occ_field: "expected_site_version"
    description: |
      Creating an AllocationRound against a Site whose version has advanced since
      the client last read it is rejected with 412. A newly created round
      legitimately supersedes the site's open round (DRAFTING, BALLOTING or FAILED
      -> SUPERSEDED), so a second create carrying a stale expected_site_version is
      not stopped by any state precondition - it would silently discard a round
      the client never saw. The stale-version check makes that rejection
      deterministic: the facilitator must re-read the site, observe the round that
      now exists, and decide whether to reopen it or supersede it on purpose.
    error_id: ERR_STALE_SITE_VERSION
    http_status: 412

  - rule_id: cost-recovery-action-create-stale-prp
    parent_entity: PotentiallyResponsibleParty
    write_endpoint: "POST /sites/{id}/cost-recovery-actions"
    occ_field: "expected_prp_version"
    description: |
      Creating a CostRecoveryAction against a respondent PRP whose version has
      advanced since the client last read it is rejected with 412. A revised offer
      of the same action_type legitimately supersedes the respondent's OFFERED
      action (OFFERED -> SUPERSEDED), and the respondent's premium floor and
      volumetric share are re-derived from the party record at offer time, so a
      create built on a stale view of the party would mint an offer priced against
      figures that have since moved. The expected_prp_version check forces the
      author to re-read the respondent first.
    error_id: ERR_STALE_PRP_VERSION
    http_status: 412

# ---------------------------------------------------------------------------
# 1.3 Calculation Rules
# ---------------------------------------------------------------------------
calculations:
  - name: allocation_share_computation
    trigger: "Provisional variant: on POST /sites/{id}/allocation-rounds, on POST /allocation-rounds/{id}/reopening, and on any waste-in verification or ownership-period create while the round is DRAFTING. Final variant: exactly once, when the round transitions BALLOTING -> ADOPTED."
    algorithm: weighted_scoring
    formula: |
      wv = round.weight_volume_bp ; wt = round.weight_toxicity_bp ; wo = round.weight_ownership_bp
      (validated to sum to exactly 10000 at round creation - ERR_WEIGHTS_NOT_NORMALIZED otherwise)

      candidate parties C = the PRPs captured as AllocationShare rows of this round, i.e. exactly the
        site's PotentiallyResponsibleParty rows whose status != IDENTIFIED at the instant the round is
        created or reopened - status IN {NOTIFIED, PARTICIPATING, RECALCITRANT, ORPHAN, SETTLED,
        DE_MINIMIS_SETTLED} - enumerated in PotentiallyResponsibleParty.created_at ASC order (never id).
        A party still IDENTIFIED (never noticed) is not allocable and receives no share; a party noticed
        after round creation only enters through POST /allocation-rounds/{id}/reopening.

      per party p in C:
        vol(p)  = sum over p's waste-in records in the variant's record set of the variant's volume field
        tox(p)  = sum over the same records of (that record's volume field * TOXICITY_MULTIPLIER[record.toxicity_class])
        own(p)  = p.ownership_days_total          # sum of OwnershipPeriod.ownership_days for this site

      TV = sum vol(p) ; TT = sum tox(p) ; TO = sum own(p)

      active = the weights among (wv with TV>0), (wt with TT>0), (wo with TO>0)
      if active is empty (TV == 0 and TT == 0 and TO == 0): reject the adoption with ERR_NO_ALLOCATION_BASIS
      denom = sum(active)                        # renormalisation: the surviving weights are rescaled by denom,
                                                 # the zero-denominator factor is NOT redistributed pro rata
      raw(p) = (wv/denom)*(vol(p)/TV) if TV>0 else 0
             + (wt/denom)*(tox(p)/TT) if TT>0 else 0
             + (wo/denom)*(own(p)/TO) if TO>0 else 0

      pct(p) = round_half_up(raw(p) * 100, 2)     # per party, BEFORE any summation
      remainder = 100.00 - sum(pct(p) over C)
      remainder is added to the single party with the largest vol(p);
        tie -> largest own(p) ; still tied -> earliest PotentiallyResponsibleParty.created_at (never id)

      provisional variant writes pct(p) to share.provisional_pct
      final variant writes pct(p) to share.final_pct, then zeroes ORPHAN and DE_MINIMIS_SETTLED
        parties into round.orphan_share_pct / round.settled_share_pct (see AllocationShare state machine)
    input_set: |
      Provisional: every WasteInRecord of the site whose status is in {SUBMITTED, VERIFIED}, valued at
      effective_volume_tons (i.e. an unverified submission counts at its claimed volume_tons).
      Final: only WasteInRecord rows whose status == VERIFIED, valued at verified_volume_tons; REJECTED
      and still-SUBMITTED records contribute 0 to both vol() and tox().
      Ownership factor is identical in both variants (OwnershipPeriod rows are immutable once created).
    constants:
      TOXICITY_MULTIPLIER: { I: 8, II: 4, III: 2, IV: 1 }
      WEIGHT_SUM_BP: 10000
    precision: "shares 2 decimals round_half_up per party, then the remainder assignment; the round's allocated + orphan + settled totals must equal exactly 100.00"
    variants:
      - name: provisional
        when: "while the round is DRAFTING, and frozen at the DRAFTING -> BALLOTING transition; this is the figure parties ballot on and the weight behind round.accept_share_pct"
        difference: "counts unverified submissions at their claimed volume_tons, so a party whose claim is later cut keeps its full weight"
      - name: final
        when: "at BALLOTING -> ADOPTED only"
        difference: "counts only verified volumes, so a rejected or reduced waste-in shifts share onto the remaining parties; identical fixture data yields different percentages from the provisional variant"

  - name: risk_assessment
    trigger: "on POST /remedial-investigations/{id}/submission (DRAFT|REVISION_REQUESTED -> UNDER_REVIEW)"
    algorithm: threshold
    formula: |
      samples S = ContaminantSample rows of this RI whose medium == ri.exposure_medium
      central_set = { s in S : s.qa_status == VALID }
      rme_set     = { s in S : s.qa_status in {VALID, ESTIMATED} }
      (qa_status == REJECTED samples are excluded from both sets, and a sample of another medium is
       excluded even when VALID)

      if central_set is empty: reject with ERR_NO_VALID_SAMPLES (the RI cannot leave DRAFT)

      central_tendency_epc_ug_per_l = round_half_up(mean(concentration over central_set), 3)
      rme_epc_ug_per_l              = max(concentration over rme_set)

      central_tendency_risk = round_half_up(central_tendency_epc_ug_per_l * UNIT_RISK_PER_UG_PER_L, 7)
      rme_risk              = round_half_up(rme_epc_ug_per_l * UNIT_RISK_PER_UG_PER_L, 7)
      hazard_index          = round_half_up(rme_epc_ug_per_l / REFERENCE_CONCENTRATION_UG_PER_L, 2)

      action_level_exceeded = (rme_risk >= ACTION_LEVEL_RISK) OR (hazard_index >= HAZARD_INDEX_LIMIT)
      # inclusive at the boundary: rme_risk exactly 0.0001000 exceeds
    input_set: "ContaminantSample rows of this RemedialInvestigation only; medium-filtered to ri.exposure_medium; REJECTED QA samples never counted"
    constants:
      UNIT_RISK_PER_UG_PER_L: 0.000005
      REFERENCE_CONCENTRATION_UG_PER_L: 5.0
      ACTION_LEVEL_RISK: 0.0001
      HAZARD_INDEX_LIMIT: 1.00
    precision: "EPC 3 decimals round_half_up, risk 7 decimals round_half_up, hazard_index 2 decimals round_half_up"
    variants:
      - name: central_tendency
        when: "reported as central_tendency_epc_ug_per_l / central_tendency_risk"
        difference: "arithmetic mean over VALID samples only"
      - name: reasonable_maximum_exposure
        when: "reported as rme_epc_ug_per_l / rme_risk, and it is this variant that drives action_level_exceeded and therefore the remedy weighting branch"
        difference: "maximum over VALID plus ESTIMATED samples; the same sample set therefore yields a strictly larger figure whenever an ESTIMATED sample is the site maximum"

  - name: remedy_npv
    trigger: "on POST /remedial-investigations/{id}/remedy-alternatives (create), and never recomputed afterwards (the cost inputs are immutable)"
    algorithm: aggregation
    formula: |
      r = discount_rate_bp / 10000
      npv_cents = capital_cost_cents
                + SUM over y = 1..om_years of round_half_up(annual_om_cost_cents / (1 + r)^y, 0)

      MANDATORY ORDER OF OPERATIONS: each annual term is discounted and rounded to whole cents
      BEFORE it enters the sum. Summing the undiscounted-then-discounted stream and rounding once at
      the end is a DIFFERENT and WRONG answer (for capital 1250000000, annual 45000000, 30 years,
      700 bp the correct npv_cents is 1808406854 while sum-then-round yields 1808406853).
    input_set: "the single RemedyAlternative being created"
    constants:
      BASIS_POINTS_DENOMINATOR: 10000
    precision: "whole cents, round_half_up, applied once per year term"

  - name: remedy_score
    trigger: "on RemedyAlternative create, and re-run for every alternative of the RI whenever the RI is submitted (because action_level_exceeded may flip)"
    algorithm: weighted_scoring
    formula: |
      cost_score = round_half_up(min(100, max(0, 100 - npv_cents / NPV_COST_SCORE_DIVISOR)), 2)

      if ri.action_level_exceeded == true:
          remedy_score = round_half_up(0.65*effectiveness_score + 0.20*implementability_score + 0.15*cost_score, 2)
      else:
          remedy_score = round_half_up(0.45*effectiveness_score + 0.35*implementability_score + 0.20*cost_score, 2)

      The two branches are not a rescaling of one another: they can rank the same pair of
      alternatives in opposite orders (see calculations.remedy_selector).
    input_set: "one RemedyAlternative plus the action_level_exceeded flag of its parent RemedialInvestigation"
    constants:
      NPV_COST_SCORE_DIVISOR: 50000000
      WEIGHTS_EXCEEDED: { effectiveness: 0.65, implementability: 0.20, cost: 0.15 }
      WEIGHTS_NORMAL: { effectiveness: 0.45, implementability: 0.35, cost: 0.20 }
    precision: "cost_score and remedy_score 2 decimals round_half_up"

  - name: remedy_selector
    trigger: "on POST /records-of-decision/{id}/signature when the request omits alternative_id"
    algorithm: chronological
    formula: |
      pool = RemedyAlternative rows of rod.remedial_investigation_id
      if ri.action_level_exceeded == true:
          pool = { a in pool : a.effectiveness_score >= PROTECTIVE_EFFECTIVENESS_MIN }
      if pool is empty: reject with ERR_NO_ELIGIBLE_REMEDY

      winner = the member of pool with the greatest remedy_score
               tie -> lowest npv_cents
               still tied -> earliest RemedyAlternative.created_at (never id)
    input_set: "RemedyAlternative rows of the ROD's RemedialInvestigation; alternatives belonging to another RI are invisible here and are rejected with ERR_ALTERNATIVE_NOT_FOR_SITE when named explicitly"
    constants:
      PROTECTIVE_EFFECTIVENESS_MIN: 60
    precision: "comparison on the stored 2-decimal remedy_score values, not on unrounded intermediates"

  - name: oversight_cost_reimbursement
    trigger: "on POST /sites/{id}/oversight-costs (every posting)"
    algorithm: tiered_pricing
    formula: |
      oversight_direct_cents = SUM of incurred_cents over every accepted posting for this site
                               (recomputed from the postings, never incremented in place)

      rate_bp = INDIRECT_RATE_TIER1_BP if oversight_direct_cents <= TIER1_CEILING_CENTS
                INDIRECT_RATE_TIER2_BP if oversight_direct_cents <= TIER2_CEILING_CENTS
                INDIRECT_RATE_TIER3_BP otherwise

      THE TIER IS KEYED ON THE PRE-FEE DIRECT SUBTOTAL, NOT ON THE BILLED TOTAL.
      Keying it on oversight_billed_cents is wrong and observable: at direct 4600000 the correct
      rate is 1550 bp giving indirect 713000 and billed 5313000, whereas keying the tier on the
      resulting total (5313000 > 5000000 -> 1275 bp) yields 5186500.

      oversight_indirect_cents = round_half_up(oversight_direct_cents * rate_bp / 10000, 0)
      oversight_billed_cents   = oversight_direct_cents + oversight_indirect_cents

      The indirect component is recomputed IN FULL on every posting: when a posting moves the
      subtotal across a tier ceiling, the whole accumulated subtotal is re-rated at the new rate
      (there is no marginal/blended tier arithmetic here).

      if the site has a governing ConsentDecree with legal_status == ENTERED and
         oversight_billed_cents would exceed decree.oversight_cost_cap_cents:
             reject the posting with ERR_OVERSIGHT_CAP_EXCEEDED and leave every field unchanged
      oversight_cap_utilization_pct = round_half_up(oversight_billed_cents * 100 / decree.oversight_cost_cap_cents, 2)
    input_set: "every oversight posting recorded for the site; the governing decree is the site's ConsentDecree whose legal_status == ENTERED (at most one)"
    constants:
      TIER1_CEILING_CENTS: 5000000
      TIER2_CEILING_CENTS: 25000000
      INDIRECT_RATE_TIER1_BP: 1550
      INDIRECT_RATE_TIER2_BP: 1275
      INDIRECT_RATE_TIER3_BP: 1050
    precision: "whole cents round_half_up; utilization 2 decimals round_half_up; tier ceilings are inclusive (a subtotal of exactly 5000000 is still tier 1)"

  - name: stipulated_penalty_accrual
    trigger: "on POST /consent-decrees/{id}/compliance-events with event_type == PENALTY_ASSESSMENT"
    algorithm: threshold
    formula: |
      days_in_violation = (payload.effective_at::date - decree.first_noncompliance_date::date) + 1
                          # INCLUSIVE of both endpoints: 2027-03-01 through 2027-03-30 is 30 days

      flat_days      = min(days_in_violation, PENALTY_STEP_DAYS)
      escalated_days = max(0, days_in_violation - PENALTY_STEP_DAYS)
      escalated_rate = round_half_up(decree.stipulated_penalty_per_day_cents * PENALTY_ESCALATION_BP / 10000, 0)

      gross = flat_days * decree.stipulated_penalty_per_day_cents + escalated_days * escalated_rate
      penalty_cap_cents = round_half_up(decree.oversight_cost_cap_cents * PENALTY_CAP_BP / 10000, 0)

      accrued_penalty_cents = min(gross, penalty_cap_cents)
      penalty_capped        = gross > penalty_cap_cents

      Repeat assessments on the same open violation RECOMPUTE from first_noncompliance_date; they never
      add to the previous accrual, so the 30-day step is never applied twice.
    input_set: "the single ConsentDecree and its open violation window; cured violations reset the window (first_noncompliance_date = null, days_in_violation = 0)"
    constants:
      PENALTY_STEP_DAYS: 30
      PENALTY_ESCALATION_BP: 15000
      PENALTY_CAP_BP: 1000
    precision: "whole cents round_half_up; day counts are whole days on the date part of the logical clock"

  - name: de_minimis_eligibility
    trigger: "recomputed on every waste-in verification or rejection for the site, and read at POST /cost-recovery-actions/{id}/response for a DE_MINIMIS_SETTLEMENT"
    algorithm: threshold
    formula: |
      de_minimis_eligible =
            prp.volumetric_share_pct <= DE_MINIMIS_SHARE_CEILING_PCT      # 1.00, inclusive
        AND prp.max_toxicity_class in DE_MINIMIS_TOXICITY_CLASSES          # {III, IV}
        AND prp.verified_volume_tons <= DE_MINIMIS_VOLUME_CEILING_TONS     # 110.00, inclusive
        AND prp.max_toxicity_class is not null                            # a party with no VERIFIED record is not eligible

      volumetric_share_pct = round_half_up(prp.verified_volume_tons * 100 / site.verified_waste_volume_tons, 2)
                             (0.00 when the site total is 0)

      All three conditions are evaluated on the ROUNDED share: a party at 1.004% rounds to 1.00 and
      IS eligible, a party at 1.005% rounds to 1.01 and is NOT.
    input_set: "one PotentiallyResponsibleParty against its site's verified totals"
    constants:
      DE_MINIMIS_SHARE_CEILING_PCT: 1.00
      DE_MINIMIS_TOXICITY_CLASSES: [III, IV]
      DE_MINIMIS_VOLUME_CEILING_TONS: 110.00
    precision: "share 2 decimals round_half_up; comparisons inclusive at every ceiling"

  - name: de_minimis_premium_floor
    trigger: "on POST /sites/{id}/cost-recovery-actions when action_type == DE_MINIMIS_SETTLEMENT (stamped into premium_floor_cents and frozen there)"
    algorithm: aggregation
    formula: |
      respondent_share_pct_at_offer = the respondent's AllocationShare.final_pct in the site's
                                      ADOPTED round        # frozen at offer time, 2 decimals
                                      # NOTE: this is the ALLOCATED exposure, not the raw
                                      # volumetric_share_pct that drives de_minimis_eligibility;
                                      # the two are different numbers for the same party
      premium_floor_cents = round_half_up(site.total_response_cost_cents
                                          * respondent_share_pct_at_offer / 100
                                          * DE_MINIMIS_PREMIUM_MULTIPLIER, 0)

      The offer is refused at creation when demanded_cents < premium_floor_cents
      (ERR_DE_MINIMIS_PREMIUM_INSUFFICIENT) - the premium buys contribution protection and must
      exceed the party's own allocated exposure.
      premium_floor_cents is NOT re-derived later: a site whose total response cost grows after the
      offer was made does not retroactively invalidate the offer.
    input_set: "the respondent party and the site's total_response_cost_cents at the instant the offer is created"
    constants:
      DE_MINIMIS_PREMIUM_MULTIPLIER: 2.0
    precision: "whole cents round_half_up"

  - name: cost_posture_derivation
    trigger: "after every ConsentDecree compliance event, decree entry, oversight posting, ROD status change and Site listing_status change"
    algorithm: constraint_propagation
    formula: |
      if any ConsentDecree of the site has compliance_status == PENALTY_ACCRUING:
          cost_posture = FROZEN
      elif site.oversight_cap_utilization_pct >= COST_RESTRICTION_UTILIZATION_PCT
           OR any ConsentDecree of the site has compliance_status == IN_VIOLATION
           OR any RecordOfDecision of the site has status == AMENDMENT_REQUIRED
           OR site.listing_status == REMEDY_REEVALUATION:
          cost_posture = RESTRICTED
      else:
          cost_posture = OPEN

      FROZEN strictly dominates RESTRICTED: a site that is both penalty-accruing and over 90%
      utilization reports FROZEN, and the request that hits it is rejected with ERR_SITE_COST_FROZEN,
      never ERR_SITE_COST_RESTRICTED.
    input_set: "all ConsentDecree and RecordOfDecision rows of the site plus the site's own oversight figures"
    constants:
      COST_RESTRICTION_UTILIZATION_PCT: 90.00
    precision: "utilization compared at 2 decimals; exactly 90.00 restricts"

  - name: cost_recovery_ledger
    trigger: "on every contract award, oversight posting, collection, void and allocation adoption"
    algorithm: aggregation
    formula: |
      total_response_cost_cents = oversight_billed_cents
                                + SUM of awarded_amount_cents over RemediationContract rows of the
                                  site whose status in {AWARDED, CONSTRUCTION_COMPLETE, CLOSED}

      recovered_cost_cents      = SUM of received_cents over CostRecoveryAction rows of the site
                                  whose status == COLLECTED
                                  (a VOIDED action contributes 0 - its received_cents is zeroed)

      orphan_write_off_cents    = round_half_up(total_response_cost_cents
                                                * adopted_round.orphan_share_pct / 100, 0)
                                  (0 when the site has no ADOPTED round)

      unrecovered_cost_cents    = total_response_cost_cents
                                - recovered_cost_cents
                                - orphan_write_off_cents

      COMPENSATING INVARIANT (must hold after EVERY write, including voids and share restorations):
          recovered_cost_cents + orphan_write_off_cents + unrecovered_cost_cents
              == total_response_cost_cents
      and on the share side:
          round.allocated_share_total_pct + round.orphan_share_pct + round.settled_share_pct == 100.00
    input_set: "contracts in {AWARDED, CONSTRUCTION_COMPLETE, CLOSED}, COLLECTED cost-recovery actions, the site's ADOPTED round"
    constants: {}
    precision: "whole cents round_half_up; percentages 2 decimals; both identities are exact, never approximate"

  - name: five_year_review_schedule
    trigger: "on POST /remediation-contracts/{id}/construction-completion and on every POST /sites/{id}/five-year-review"
    algorithm: chronological
    formula: |
      at construction completion: site.five_year_review_due_at = clock + FIVE_YEAR_REVIEW_DAYS days
      at each review:             site.five_year_review_due_at = site.five_year_review_due_at + FIVE_YEAR_REVIEW_DAYS days
                                  site.last_five_year_review_at = clock

      The next due date is chained off the PREVIOUS DUE DATE, not off the review date, so an early or
      late review does not shift the statutory cycle. A review submitted before
      five_year_review_due_at is rejected with ERR_FIVE_YEAR_REVIEW_NOT_DUE (the due instant itself
      is allowed: clock >= due passes).
    input_set: "the site's construction_complete_at and five_year_review_due_at"
    constants:
      FIVE_YEAR_REVIEW_DAYS: 1826
    precision: "whole days on the logical clock; 2029-05-15 + 1826 days = 2034-05-15"

  - name: ownership_period_days
    trigger: "on POST /sites/{id}/ownership-periods (create)"
    algorithm: interval_merge
    formula: |
      ownership_days = end_date - start_date            # HALF-OPEN [start_date, end_date):
                                                        # 1962-03-01 .. 1978-06-01 is 5936 days
      Overlap rule for the SAME site (any pair of parties, not just the same party):
          two periods conflict when start_date < other.end_date AND other.start_date < end_date
          Touching endpoints do NOT conflict: a period ending 1978-06-01 and one starting 1978-06-01
          are adjacent, not overlapping, and both are accepted.
      A conflicting create is rejected with ERR_OWNERSHIP_PERIOD_OVERLAP; the site's chain of title
      is a partition of time, so overlapping ownership is a data error rather than a shared period.
    input_set: "every OwnershipPeriod row already recorded for the same site"
    constants: {}
    precision: "whole days; dates are ISO calendar dates with no time component"

  - name: work_window_capacity
    trigger: "on POST /remediation-contracts/{id}/work-windows (create)"
    algorithm: interval_merge
    formula: |
      buffered_start_at = start_at - MOBILIZATION_BUFFER_HOURS hours
      buffered_end_at   = end_at   + MOBILIZATION_BUFFER_HOURS hours

      concurrent(w) = number of existing WorkWindow rows of the SAME contract whose
                      [buffered_start_at, buffered_end_at) intersects w's own buffered interval
                      (half-open: a window whose buffered_end_at equals another's buffered_start_at
                       does not intersect)

      if concurrent(w) + 1 > contract.max_concurrent_windows:
          reject with ERR_WORK_WINDOW_CAPACITY_EXCEEDED

      The buffer is what makes this non-obvious: two windows 6 hours apart do not overlap on their
      raw intervals but DO overlap once each is padded by 4 hours on both sides.
    input_set: "WorkWindow rows of the same RemediationContract; windows of other contracts never interact"
    constants:
      MOBILIZATION_BUFFER_HOURS: 4
    precision: "timestamps to the second; comparisons on the buffered interval, half-open"

# ---------------------------------------------------------------------------
# 1.4 Validation Rules (evaluated strictly in priority order; the FIRST failing
#     rule determines the response, so a request violating several rules reports the
#     lowest-numbered one)
# ---------------------------------------------------------------------------
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers are both present and X-User-Role is one of the six declared roles"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"

  - priority: 2
    category: auth
    check: "the acting role appears in the endpoint's roles list"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: "all"

  - priority: 3
    category: business_constraint
    check: "request body/query shape: required fields present, types correct, enum values in range, integers within declared bounds, monetary fields are integer cents (never decimal strings), decimals within their declared scale, arrays non-empty and duplicate-free"
    error_id: ERR_INVALID_REQUEST
    http_status: 422
    applies_to: "all writes and all list endpoints with query parameters"

  - priority: 4
    category: existence
    check: "every path id resolves, validated left to right: the site before the round, the round before the share, the contract before the work window"
    error_id: "ERR_SITE_NOT_FOUND | ERR_PRP_NOT_FOUND | ERR_WASTE_IN_RECORD_NOT_FOUND | ERR_REMEDIAL_INVESTIGATION_NOT_FOUND | ERR_RECORD_OF_DECISION_NOT_FOUND | ERR_ALLOCATION_ROUND_NOT_FOUND | ERR_CONSENT_DECREE_NOT_FOUND | ERR_REMEDIATION_CONTRACT_NOT_FOUND | ERR_COST_RECOVERY_ACTION_NOT_FOUND"
    http_status: 404
    applies_to: "all endpoints with path parameters"

  - priority: 5
    category: existence
    check: "every id referenced in the request body resolves: prp_id, remedial_investigation_id, record_of_decision_id, alternative_id, respondent_prp_id, claimant_prp_id, party_prp_ids[]"
    error_id: "ERR_PRP_NOT_FOUND | ERR_REMEDIAL_INVESTIGATION_NOT_FOUND | ERR_RECORD_OF_DECISION_NOT_FOUND | ERR_REMEDY_ALTERNATIVE_NOT_FOUND"
    http_status: 404
    applies_to: "POST /sites/{id}/ownership-periods, POST /sites/{id}/waste-in-records, POST /sites/{id}/records-of-decision, POST /records-of-decision/{id}/signature, POST /sites/{id}/consent-decrees, POST /sites/{id}/remediation-contracts, POST /sites/{id}/cost-recovery-actions"

  - priority: 6
    category: auth
    check: "actor identity: a PRPRepresentative's X-User-ID equals the PotentiallyResponsibleParty.id it is acting for (the ballot's party, the responding respondent, the party whose response is being recorded); a Contractor's X-User-ID equals the RemediationContract.id it is acting on"
    error_id: ERR_ACTOR_IDENTITY_MISMATCH
    http_status: 403
    applies_to: "POST /prps/{id}/response, POST /allocation-rounds/{id}/ballots, POST /cost-recovery-actions/{id}/response, POST /remediation-contracts/{id}/work-windows"

  - priority: 7
    category: state
    check: "optimistic concurrency: expected_site_version equals Site.version / expected_prp_version equals PotentiallyResponsibleParty.version"
    error_id: "ERR_STALE_SITE_VERSION | ERR_STALE_PRP_VERSION"
    http_status: 412
    applies_to: "POST /sites/{id}/allocation-rounds, POST /sites/{id}/cost-recovery-actions"

  - priority: 8
    category: state
    check: "the site's derived cost_posture is not FROZEN"
    error_id: ERR_SITE_COST_FROZEN
    http_status: 409
    applies_to: "POST /sites/{id}/oversight-costs, POST /sites/{id}/allocation-rounds, POST /sites/{id}/cost-recovery-actions, POST /remediation-contracts/{id}/work-windows"

  - priority: 9
    category: state
    check: "the site's derived cost_posture is not RESTRICTED"
    error_id: ERR_SITE_COST_RESTRICTED
    http_status: 409
    applies_to: "POST /sites/{id}/allocation-rounds, POST /remediation-contracts/{id}/award, POST /remediation-contracts/{id}/work-windows"

  - priority: 10
    category: state
    check: "the target entity is in a state from which the requested transition is declared in §1.2 (includes idempotent re-triggers: a second verification of a VERIFIED record, a second signature of a SIGNED ROD, entry of an already ENTERED decree, a collection against an OFFERED action)"
    error_id: ERR_INVALID_STATE_TRANSITION
    http_status: 409
    applies_to: "all transition endpoints"

  - priority: 11
    category: state
    check: "the site's listing_status permits the operation: waste-in records, ownership periods and remedial investigations require LISTED or later; allocation rounds require RI_FS_UNDERWAY or later; five-year review requires OM_PHASE"
    error_id: ERR_SITE_PHASE_INVALID
    http_status: 409
    applies_to: "POST /sites/{id}/waste-in-records, POST /sites/{id}/ownership-periods, POST /sites/{id}/remedial-investigations, POST /sites/{id}/allocation-rounds, POST /sites/{id}/five-year-review"

  - priority: 12
    category: state
    check: "the referenced RemedialInvestigation.status == APPROVED before a comment period opens on a ROD that cites it"
    error_id: ERR_RIFS_NOT_APPROVED
    http_status: 409
    applies_to: "POST /records-of-decision/{id}/comment-period"

  - priority: 13
    category: state
    check: "the referenced RecordOfDecision.status == SIGNED before a remediation contract is created or awarded against it"
    error_id: ERR_ROD_NOT_SIGNED
    http_status: 409
    applies_to: "POST /sites/{id}/remediation-contracts, POST /remediation-contracts/{id}/award"

  - priority: 14
    category: state
    check: "the site has an AllocationRound with status == ADOPTED (site.adopted_round_id is not null) before a decree is lodged or any cost-recovery action is created"
    error_id: ERR_NO_ADOPTED_ALLOCATION
    http_status: 409
    applies_to: "POST /consent-decrees/{id}/lodging, POST /sites/{id}/cost-recovery-actions"

  - priority: 15
    category: state
    check: "the decree's legal_status == ENTERED before any compliance event is recorded against it"
    error_id: ERR_DECREE_NOT_ENTERED
    http_status: 409
    applies_to: "POST /consent-decrees/{id}/compliance-events"

  - priority: 16
    category: business_safety
    check: "segregation of duties on the RI/FS: X-User-ID differs from remedial_investigation.authored_by_user_id"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 409
    applies_to: "POST /remedial-investigations/{id}/review"

  - priority: 17
    category: business_safety
    check: "segregation of duties on the decision document: X-User-ID differs from the cited remedial_investigation.approved_by_user_id"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 409
    applies_to: "POST /records-of-decision/{id}/signature"

  - priority: 18
    category: business_safety
    check: "site.hrs_score >= HRS_LISTING_THRESHOLD (28.50, inclusive) before the site may be listed on the NPL"
    error_id: ERR_HRS_SCORE_BELOW_THRESHOLD
    http_status: 409
    applies_to: "POST /sites/{id}/list-on-npl"

  - priority: 19
    category: business_safety
    check: "the RI has at least one ContaminantSample whose medium == exposure_medium and qa_status == VALID before it may be submitted for review"
    error_id: ERR_NO_VALID_SAMPLES
    http_status: 409
    applies_to: "POST /remedial-investigations/{id}/submission"

  - priority: 20
    category: business_safety
    check: "community involvement is complete before signature: rod.public_comments_count >= 1"
    error_id: ERR_COMMUNITY_INVOLVEMENT_INCOMPLETE
    http_status: 409
    applies_to: "POST /records-of-decision/{id}/signature"

  - priority: 21
    category: business_safety
    check: "when the cited RI has action_level_exceeded == true, the selected alternative's effectiveness_score >= PROTECTIVE_EFFECTIVENESS_MIN (60)"
    error_id: ERR_REMEDY_NOT_PROTECTIVE
    http_status: 409
    applies_to: "POST /records-of-decision/{id}/signature (explicit alternative_id only; the auto-selector filters the pool instead)"

  - priority: 22
    category: business_referential
    check: "the alternative named by alternative_id belongs to the RemedialInvestigation cited by this ROD"
    error_id: ERR_ALTERNATIVE_NOT_FOR_SITE
    http_status: 409
    applies_to: "POST /records-of-decision/{id}/signature"

  - priority: 23
    category: business_referential
    check: "every party named in party_prp_ids has status == PARTICIPATING at lodging, and the party casting a ballot has status in {PARTICIPATING, RECALCITRANT}"
    error_id: ERR_PARTY_NOT_PARTICIPATING
    http_status: 409
    applies_to: "POST /consent-decrees/{id}/lodging, POST /allocation-rounds/{id}/ballots"

  - priority: 24
    category: business_referential
    check: "the respondent PRP holds an AllocationShare of the site's ADOPTED round whose disposition == ALLOCATED (a party that was never allocated, or was already orphaned or settled, cannot be pursued)"
    error_id: ERR_RESPONDENT_NOT_ALLOCATED
    http_status: 409
    applies_to: "POST /sites/{id}/cost-recovery-actions"

  - priority: 25
    category: business_temporal
    check: "the ROD's public comment period has closed: current logical clock > rod.comment_period_end"
    error_id: ERR_COMMENT_PERIOD_OPEN
    http_status: 409
    applies_to: "POST /records-of-decision/{id}/signature"

  - priority: 26
    category: business_temporal
    check: "the ROD's public comment period is still open: current logical clock <= rod.comment_period_end"
    error_id: ERR_COMMENT_PERIOD_CLOSED
    http_status: 409
    applies_to: "POST /records-of-decision/{id}/public-comments"

  - priority: 27
    category: business_temporal
    check: "the decree's 30-day lodging comment period has elapsed: current logical clock >= decree.public_comment_close_at"
    error_id: ERR_DECREE_COMMENT_PERIOD_OPEN
    http_status: 409
    applies_to: "POST /consent-decrees/{id}/entry"

  - priority: 28
    category: business_temporal
    check: "current logical clock >= site.five_year_review_due_at (the due instant itself qualifies)"
    error_id: ERR_FIVE_YEAR_REVIEW_NOT_DUE
    http_status: 409
    applies_to: "POST /sites/{id}/five-year-review"

  - priority: 29
    category: business_temporal
    check: "the new ownership period does not overlap any existing period of the same site (touching endpoints are allowed)"
    error_id: ERR_OWNERSHIP_PERIOD_OVERLAP
    http_status: 409
    applies_to: "POST /sites/{id}/ownership-periods"

  - priority: 30
    category: business_constraint
    check: "the new work window's buffered interval does not push the contract over max_concurrent_windows"
    error_id: ERR_WORK_WINDOW_CAPACITY_EXCEEDED
    http_status: 409
    applies_to: "POST /remediation-contracts/{id}/work-windows"

  - priority: 31
    category: business_constraint
    check: "weight_volume_bp + weight_toxicity_bp + weight_ownership_bp == 10000 exactly"
    error_id: ERR_WEIGHTS_NOT_NORMALIZED
    http_status: 422
    applies_to: "POST /sites/{id}/allocation-rounds"

  - priority: 32
    category: business_constraint
    check: "at least one allocation factor has a non-zero total across the round's candidate parties"
    error_id: ERR_NO_ALLOCATION_BASIS
    http_status: 409
    applies_to: "POST /sites/{id}/allocation-rounds, POST /allocation-rounds/{id}/balloting"

  - priority: 33
    category: business_constraint
    check: "the acting party's share of this round has ballot == null"
    error_id: ERR_BALLOT_ALREADY_CAST
    http_status: 409
    applies_to: "POST /allocation-rounds/{id}/ballots"

  - priority: 34
    category: business_constraint
    check: "the auto-selector pool is non-empty (at least one alternative of the cited RI survives the protectiveness filter)"
    error_id: ERR_NO_ELIGIBLE_REMEDY
    http_status: 409
    applies_to: "POST /records-of-decision/{id}/signature with alternative_id omitted"

  - priority: 35
    category: business_constraint
    check: "verified_volume_tons <= the record's claimed volume_tons, and is present only when decision == VERIFIED"
    error_id: ERR_VERIFIED_VOLUME_EXCEEDS_CLAIM
    http_status: 422
    applies_to: "POST /waste-in-records/{id}/verification"

  - priority: 36
    category: business_constraint
    check: "the respondent's de_minimis_eligible == true when action_type == DE_MINIMIS_SETTLEMENT"
    error_id: ERR_NOT_DE_MINIMIS_ELIGIBLE
    http_status: 409
    applies_to: "POST /sites/{id}/cost-recovery-actions"

  - priority: 37
    category: business_fiscal
    check: "demanded_cents >= the premium floor from calculations.de_minimis_premium_floor for a DE_MINIMIS_SETTLEMENT"
    error_id: ERR_DE_MINIMIS_PREMIUM_INSUFFICIENT
    http_status: 422
    applies_to: "POST /sites/{id}/cost-recovery-actions"

  - priority: 38
    category: business_fiscal
    check: "awarded_amount_cents <= engineer_estimate_cents * (1 + BID_TOLERANCE_BP/10000), BID_TOLERANCE_BP = 1500 (exactly at the tolerance passes)"
    error_id: ERR_BID_EXCEEDS_ESTIMATE
    http_status: 422
    applies_to: "POST /remediation-contracts/{id}/award"

  - priority: 39
    category: business_fiscal
    check: "the resulting oversight_billed_cents does not exceed the governing entered decree's oversight_cost_cap_cents"
    error_id: ERR_OVERSIGHT_CAP_EXCEEDED
    http_status: 409
    applies_to: "POST /sites/{id}/oversight-costs"

  - priority: 40
    category: business_fiscal
    check: "received_cents <= action.demanded_cents - action.received_cents (no overpayment, no clamping)"
    error_id: ERR_OVERPAYMENT_NOT_ALLOWED
    http_status: 422
    applies_to: "POST /cost-recovery-actions/{id}/collection"

  - priority: 41
    category: business_fiscal
    check: "a CURE compliance event pays exactly the outstanding balance: paid_penalty_cents == decree.accrued_penalty_cents - decree.paid_penalty_cents"
    error_id: ERR_PENALTY_BALANCE_MISMATCH
    http_status: 422
    applies_to: "POST /consent-decrees/{id}/compliance-events with event_type == CURE"

# ---------------------------------------------------------------------------
# 1.5 API Endpoint Table
#   * every path parameter is written {id}
#   * every FK declared in 1.1 has a reverse-reachability GET (sub-resource form,
#     except CostRecoveryAction's three FKs which collapse into the filtered list)
# ---------------------------------------------------------------------------
endpoints:
  # ---- reads: Site ---------------------------------------------------------
  - method: GET
    path: "/sites"
    description: "Paginated list of sites, newest first by created_at DESC then name ASC."
    roles: [RemedialProjectManager, AllocationFacilitator, SettlementCounsel, PRPRepresentative, Contractor, CommunityMember]
    code: 200
    input: ["limit?", "offset?", "listing_status?", "epa_region?", "cost_posture?"]
    output: Site[]
    side_effects: []

  - method: GET
    path: "/sites/{id}"
    description: "One site with every derived cost and posture field."
    roles: [RemedialProjectManager, AllocationFacilitator, SettlementCounsel, PRPRepresentative, Contractor, CommunityMember]
    code: 200
    input: []
    output: Site
    side_effects: []

  - method: GET
    path: "/sites/{id}/cost-ledger"
    description: "Computed read: the four-way cost reconciliation of the site (total, recovered, orphan write-off, unrecovered) plus the adopted round's share split, so the conservation identity can be checked in one call."
    roles: [RemedialProjectManager, AllocationFacilitator, SettlementCounsel, PRPRepresentative, Contractor, CommunityMember]
    code: 200
    input: []
    output: { total_response_cost_cents: integer, recovered_cost_cents: integer, orphan_write_off_cents: integer, unrecovered_cost_cents: integer, oversight_direct_cents: integer, oversight_indirect_rate_bp: integer, oversight_indirect_cents: integer, oversight_billed_cents: integer, oversight_cap_utilization_pct: number, allocated_share_total_pct: number, orphan_share_pct: number, settled_share_pct: number, ledger_balanced: boolean }
    side_effects: []

  - method: GET
    path: "/sites/{id}/prps"
    description: "Reverse reachability for PotentiallyResponsibleParty.site_id: every party named for this site, ordered created_at ASC (the same enumeration order the allocation calculation uses)."
    roles: [RemedialProjectManager, AllocationFacilitator, SettlementCounsel, PRPRepresentative, Contractor, CommunityMember]
    code: 200
    input: ["limit?", "offset?", "status?"]
    output: PotentiallyResponsibleParty[]
    side_effects: []

  - method: GET
    path: "/sites/{id}/ownership-periods"
    description: "Reverse reachability for OwnershipPeriod.site_id: the site's chain of title, ordered start_date ASC."
    roles: [RemedialProjectManager, AllocationFacilitator, SettlementCounsel, PRPRepresentative, Contractor, CommunityMember]
    code: 200
    input: ["limit?", "offset?"]
    output: OwnershipPeriod[]
    side_effects: []

  - method: GET
    path: "/sites/{id}/waste-in-records"
    description: "Reverse reachability for WasteInRecord.site_id: every waste-in submission for this site."
    roles: [RemedialProjectManager, AllocationFacilitator, SettlementCounsel, PRPRepresentative, Contractor, CommunityMember]
    code: 200
    input: ["limit?", "offset?", "status?"]
    output: WasteInRecord[]
    side_effects: []

  - method: GET
    path: "/sites/{id}/remedial-investigations"
    description: "Reverse reachability for RemedialInvestigation.site_id."
    roles: [RemedialProjectManager, AllocationFacilitator, SettlementCounsel, PRPRepresentative, Contractor, CommunityMember]
    code: 200
    input: ["limit?", "offset?", "status?"]
    output: RemedialInvestigation[]
    side_effects: []

  - method: GET
    path: "/sites/{id}/records-of-decision"
    description: "Reverse reachability for RecordOfDecision.site_id, ordered created_at ASC."
    roles: [RemedialProjectManager, AllocationFacilitator, SettlementCounsel, PRPRepresentative, Contractor, CommunityMember]
    code: 200
    input: ["limit?", "offset?", "status?"]
    output: RecordOfDecision[]
    side_effects: []

  - method: GET
    path: "/sites/{id}/allocation-rounds"
    description: "Reverse reachability for AllocationRound.site_id, ordered round_number ASC; SUPERSEDED rounds are included."
    roles: [RemedialProjectManager, AllocationFacilitator, SettlementCounsel, PRPRepresentative, Contractor, CommunityMember]
    code: 200
    input: ["limit?", "offset?", "status?"]
    output: AllocationRound[]
    side_effects: []

  - method: GET
    path: "/sites/{id}/consent-decrees"
    description: "Reverse reachability for ConsentDecree.site_id."
    roles: [RemedialProjectManager, AllocationFacilitator, SettlementCounsel, PRPRepresentative, Contractor, CommunityMember]
    code: 200
    input: ["limit?", "offset?", "legal_status?"]
    output: ConsentDecree[]
    side_effects: []

  - method: GET
    path: "/sites/{id}/remediation-contracts"
    description: "Reverse reachability for RemediationContract.site_id."
    roles: [RemedialProjectManager, AllocationFacilitator, SettlementCounsel, PRPRepresentative, Contractor, CommunityMember]
    code: 200
    input: ["limit?", "offset?", "status?"]
    output: RemediationContract[]
    side_effects: []

  # ---- reads: PRP ----------------------------------------------------------
  - method: GET
    path: "/prps/{id}"
    description: "One potentially responsible party with its derived volumes, share and de minimis eligibility."
    roles: [RemedialProjectManager, AllocationFacilitator, SettlementCounsel, PRPRepresentative, Contractor, CommunityMember]
    code: 200
    input: []
    output: PotentiallyResponsibleParty
    side_effects: []

  - method: GET
    path: "/prps/{id}/ownership-periods"
    description: "Reverse reachability for OwnershipPeriod.prp_id: the periods during which this party held title."
    roles: [RemedialProjectManager, AllocationFacilitator, SettlementCounsel, PRPRepresentative, Contractor, CommunityMember]
    code: 200
    input: ["limit?", "offset?"]
    output: OwnershipPeriod[]
    side_effects: []

  - method: GET
    path: "/prps/{id}/waste-in-records"
    description: "Reverse reachability for WasteInRecord.prp_id: the waste attributed to this party."
    roles: [RemedialProjectManager, AllocationFacilitator, SettlementCounsel, PRPRepresentative, Contractor, CommunityMember]
    code: 200
    input: ["limit?", "offset?", "status?"]
    output: WasteInRecord[]
    side_effects: []

  - method: GET
    path: "/prps/{id}/allocation-shares"
    description: "Reverse reachability for AllocationShare.prp_id: this party's share in every round of its site, including the cascade-created shares that no create response ever returned."
    roles: [RemedialProjectManager, AllocationFacilitator, SettlementCounsel, PRPRepresentative, Contractor, CommunityMember]
    code: 200
    input: ["limit?", "offset?", "disposition?"]
    output: AllocationShare[]
    side_effects: []

  # ---- reads: waste-in, RI, samples, alternatives -------------------------
  - method: GET
    path: "/waste-in-records/{id}"
    description: "One waste-in record with its verification outcome and effective volume."
    roles: [RemedialProjectManager, AllocationFacilitator, SettlementCounsel, PRPRepresentative, Contractor, CommunityMember]
    code: 200
    input: []
    output: WasteInRecord
    side_effects: []

  - method: GET
    path: "/remedial-investigations/{id}"
    description: "One RI/FS with both risk variants and the action_level_exceeded flag."
    roles: [RemedialProjectManager, AllocationFacilitator, SettlementCounsel, PRPRepresentative, Contractor, CommunityMember]
    code: 200
    input: []
    output: RemedialInvestigation
    side_effects: []

  - method: GET
    path: "/remedial-investigations/{id}/samples"
    description: "Reverse reachability for ContaminantSample.remedial_investigation_id, ordered collected_at ASC."
    roles: [RemedialProjectManager, AllocationFacilitator, SettlementCounsel, PRPRepresentative, Contractor, CommunityMember]
    code: 200
    input: ["limit?", "offset?", "qa_status?", "medium?"]
    output: ContaminantSample[]
    side_effects: []

  - method: GET
    path: "/remedial-investigations/{id}/remedy-alternatives"
    description: "Reverse reachability for RemedyAlternative.remedial_investigation_id, ordered created_at ASC, with npv_cents / cost_score / remedy_score as currently scored."
    roles: [RemedialProjectManager, AllocationFacilitator, SettlementCounsel, PRPRepresentative, Contractor, CommunityMember]
    code: 200
    input: ["limit?", "offset?"]
    output: RemedyAlternative[]
    side_effects: []

  - method: GET
    path: "/remedial-investigations/{id}/records-of-decision"
    description: "Reverse reachability for RecordOfDecision.remedial_investigation_id: the decision documents resting on this RI/FS."
    roles: [RemedialProjectManager, AllocationFacilitator, SettlementCounsel, PRPRepresentative, Contractor, CommunityMember]
    code: 200
    input: ["limit?", "offset?"]
    output: RecordOfDecision[]
    side_effects: []

  # ---- reads: ROD, rounds, decrees, contracts, actions --------------------
  - method: GET
    path: "/records-of-decision/{id}"
    description: "One Record of Decision with its comment window, responsiveness summary and selected alternative mirror."
    roles: [RemedialProjectManager, AllocationFacilitator, SettlementCounsel, PRPRepresentative, Contractor, CommunityMember]
    code: 200
    input: []
    output: RecordOfDecision
    side_effects: []

  - method: GET
    path: "/records-of-decision/{id}/selected-remedy"
    description: "Reverse reachability for RemedyAlternative.selected_by_rod_id: a 0-or-1 element array holding the alternative this decision selected."
    roles: [RemedialProjectManager, AllocationFacilitator, SettlementCounsel, PRPRepresentative, Contractor, CommunityMember]
    code: 200
    input: []
    output: RemedyAlternative[]
    side_effects: []

  - method: GET
    path: "/records-of-decision/{id}/remediation-contracts"
    description: "Reverse reachability for RemediationContract.record_of_decision_id."
    roles: [RemedialProjectManager, AllocationFacilitator, SettlementCounsel, PRPRepresentative, Contractor, CommunityMember]
    code: 200
    input: ["limit?", "offset?"]
    output: RemediationContract[]
    side_effects: []

  - method: GET
    path: "/allocation-rounds/{id}"
    description: "One allocation round with share_count, balloted_count, accept_share_pct and the three share totals."
    roles: [RemedialProjectManager, AllocationFacilitator, SettlementCounsel, PRPRepresentative, Contractor, CommunityMember]
    code: 200
    input: []
    output: AllocationRound
    side_effects: []

  - method: GET
    path: "/allocation-rounds/{id}/shares"
    description: "Reverse reachability for AllocationShare.allocation_round_id: every share of the round with provisional_pct, final_pct, pre_settlement_final_pct, disposition and ballot; ordered PotentiallyResponsibleParty.created_at ASC."
    roles: [RemedialProjectManager, AllocationFacilitator, SettlementCounsel, PRPRepresentative, Contractor, CommunityMember]
    code: 200
    input: ["limit?", "offset?", "disposition?"]
    output: AllocationShare[]
    side_effects: []

  - method: GET
    path: "/consent-decrees/{id}"
    description: "One decree with both status dimensions, the penalty cap, accrued and paid penalty figures."
    roles: [RemedialProjectManager, AllocationFacilitator, SettlementCounsel, PRPRepresentative, Contractor, CommunityMember]
    code: 200
    input: []
    output: ConsentDecree
    side_effects: []

  - method: GET
    path: "/remediation-contracts/{id}"
    description: "One contract with its award, completion and window-capacity fields."
    roles: [RemedialProjectManager, AllocationFacilitator, SettlementCounsel, PRPRepresentative, Contractor, CommunityMember]
    code: 200
    input: []
    output: RemediationContract
    side_effects: []

  - method: GET
    path: "/remediation-contracts/{id}/work-windows"
    description: "Reverse reachability for WorkWindow.remediation_contract_id, ordered start_at ASC, with the buffered interval each window actually occupies."
    roles: [RemedialProjectManager, AllocationFacilitator, SettlementCounsel, PRPRepresentative, Contractor, CommunityMember]
    code: 200
    input: ["limit?", "offset?", "activity_type?"]
    output: WorkWindow[]
    side_effects: []

  - method: GET
    path: "/cost-recovery-actions"
    description: "Filtered list collapsing all three CostRecoveryAction foreign keys (site_id, respondent_prp_id, claimant_prp_id) into one reverse-reachability channel; ordered created_at ASC."
    roles: [RemedialProjectManager, AllocationFacilitator, SettlementCounsel, PRPRepresentative, Contractor, CommunityMember]
    code: 200
    input: ["limit?", "offset?", "site_id?", "respondent_prp_id?", "claimant_prp_id?", "action_type?", "status?"]
    output: CostRecoveryAction[]
    side_effects: []

  - method: GET
    path: "/cost-recovery-actions/{id}"
    description: "One cost-recovery, contribution or de minimis action with its premium floor and receipts."
    roles: [RemedialProjectManager, AllocationFacilitator, SettlementCounsel, PRPRepresentative, Contractor, CommunityMember]
    code: 200
    input: []
    output: CostRecoveryAction
    side_effects: []

  # ---- writes: site listing and parties -----------------------------------
  - method: POST
    path: "/sites"
    description: "Propose a site. Starts PROPOSED with cost_posture OPEN and every derived cost field at 0."
    roles: [RemedialProjectManager]
    code: 201
    input: [name, epa_region, hrs_score]
    output: Site
    side_effects: ["listing_status = PROPOSED", "cost_posture = OPEN", "version = 1"]

  - method: POST
    path: "/sites/{id}/list-on-npl"
    description: "List the site on the National Priorities List."
    roles: [RemedialProjectManager]
    code: 200
    input: [listing_reference]
    output: Site
    side_effects: ["PROPOSED -> LISTED", "stamps listing_reference", "increments Site.version by 1"]

  - method: POST
    path: "/sites/{id}/prps"
    description: "Name a potentially responsible party for the site from site-history research."
    roles: [RemedialProjectManager]
    code: 201
    input: [legal_name, party_type, viability_score]
    output: PotentiallyResponsibleParty
    side_effects: ["party starts IDENTIFIED with every derived volume at 0 and de_minimis_eligible false"]

  - method: POST
    path: "/prps/{id}/notice"
    description: "Issue the general notice letter to a named party."
    roles: [RemedialProjectManager]
    code: 200
    input: [notice_reference]
    output: PotentiallyResponsibleParty
    side_effects: ["IDENTIFIED -> NOTIFIED", "stamps notice_reference", "increments PotentiallyResponsibleParty.version by 1"]

  - method: POST
    path: "/prps/{id}/response"
    description: "The party elects to participate in the negotiation or declines. X-User-ID must equal the party id."
    roles: [PRPRepresentative]
    code: 200
    input: [election, "response_note?"]
    output: PotentiallyResponsibleParty
    side_effects: ["NOTIFIED|RECALCITRANT -> PARTICIPATING on PARTICIPATE", "NOTIFIED|PARTICIPATING -> RECALCITRANT on DECLINE", "increments PotentiallyResponsibleParty.version by 1"]

  - method: POST
    path: "/prps/{id}/defunct"
    description: "Record that a party is defunct or insolvent, making its share an orphan share."
    roles: [RemedialProjectManager]
    code: 200
    input: [defunct_reason]
    output: PotentiallyResponsibleParty
    side_effects: ["-> ORPHAN", "cascade: the party's ALLOCATED share in an ADOPTED round becomes ORPHANED with final_pct 0 and its percentage moves to round.orphan_share_pct", "cascade: site.orphan_write_off_cents and unrecovered_cost_cents recomputed", "cascade: the party's share in a DRAFTING or BALLOTING round is auto-ABSTAINed", "increments PotentiallyResponsibleParty.version by 1"]

  # ---- writes: title history and waste-in ---------------------------------
  - method: POST
    path: "/sites/{id}/ownership-periods"
    description: "Record one link in the site's chain of title. Immutable once created."
    roles: [RemedialProjectManager]
    code: 201
    input: [prp_id, start_date, end_date, acquisition_type]
    output: OwnershipPeriod
    side_effects: ["computes ownership_days on the half-open interval", "recomputes the party's ownership_days_total", "recomputes provisional_pct on the site's DRAFTING round"]

  - method: POST
    path: "/sites/{id}/waste-in-records"
    description: "Submit a waste-in record attributing a volume and toxicity class to a party."
    roles: [RemedialProjectManager]
    code: 201
    input: [prp_id, volume_tons, toxicity_class, evidence_grade, disposal_year, "transporter_name?"]
    output: WasteInRecord
    side_effects: ["record starts SUBMITTED with effective_volume_tons = volume_tons", "recomputes the party's submitted_volume_tons", "recomputes provisional_pct on the site's DRAFTING round"]

  - method: POST
    path: "/waste-in-records/{id}/verification"
    description: "Verify or reject a waste-in record; verification may accept less volume than was claimed."
    roles: [RemedialProjectManager]
    code: 200
    input: [decision, "verified_volume_tons?", "verification_note?"]
    output: WasteInRecord
    side_effects: ["SUBMITTED -> VERIFIED or REJECTED", "3-hop cascade: record effective volume -> party volumes / max_toxicity_class / volumetric_share_pct / de_minimis_eligible and site.verified_waste_volume_tons -> provisional_pct of the site's DRAFTING round only", "increments WasteInRecord.version by 1"]

  # ---- writes: RI/FS ------------------------------------------------------
  - method: POST
    path: "/sites/{id}/remedial-investigations"
    description: "Open a remedial investigation / feasibility study for one exposure medium. Stamps authored_by_user_id from X-User-ID."
    roles: [RemedialProjectManager]
    code: 201
    input: [scope_summary, exposure_medium]
    output: RemedialInvestigation
    side_effects: ["RI starts DRAFT with authored_by_user_id = X-User-ID", "the first accepted RI moves the site LISTED -> RI_FS_UNDERWAY"]

  - method: POST
    path: "/remedial-investigations/{id}/samples"
    description: "Attach one analytical result to the investigation. Immutable once created."
    roles: [RemedialProjectManager]
    code: 201
    input: [medium, contaminant, concentration_ug_per_l, qa_status, collected_at, lab_reference]
    output: ContaminantSample
    side_effects: ["recomputes ri.valid_sample_count"]

  - method: POST
    path: "/remedial-investigations/{id}/submission"
    description: "Submit the RI/FS for review, freezing the risk assessment at the current sample set."
    roles: [RemedialProjectManager]
    code: 200
    input: []
    output: RemedialInvestigation
    side_effects: ["DRAFT|REVISION_REQUESTED -> UNDER_REVIEW", "runs calculations.risk_assessment (both variants) and sets action_level_exceeded", "re-scores every RemedyAlternative of the RI through calculations.remedy_score", "increments RemedialInvestigation.version by 1"]

  - method: POST
    path: "/remedial-investigations/{id}/review"
    description: "Approve the RI/FS or send it back for revision. The author may not review their own work."
    roles: [RemedialProjectManager]
    code: 200
    input: [decision, "review_note?"]
    output: RemedialInvestigation
    side_effects: ["UNDER_REVIEW -> APPROVED (stamps approved_by_user_id) or -> REVISION_REQUESTED (increments revision_round_count)", "increments RemedialInvestigation.version by 1"]

  - method: POST
    path: "/remedial-investigations/{id}/remedy-alternatives"
    description: "Add a remedial alternative to the feasibility study; its NPV and score are computed on creation."
    roles: [RemedialProjectManager]
    code: 201
    input: [label, capital_cost_cents, annual_om_cost_cents, om_years, discount_rate_bp, effectiveness_score, implementability_score]
    output: RemedyAlternative
    side_effects: ["computes npv_cents by calculations.remedy_npv, then cost_score and remedy_score by calculations.remedy_score against the RI's current action_level_exceeded flag"]

  # ---- writes: record of decision -----------------------------------------
  - method: POST
    path: "/sites/{id}/records-of-decision"
    description: "Draft a Record of Decision citing an approved RI/FS."
    roles: [RemedialProjectManager]
    code: 201
    input: [remedial_investigation_id, proposed_plan_summary, comment_period_days]
    output: RecordOfDecision
    side_effects: ["ROD starts DRAFT with public_comments_count 0"]

  - method: POST
    path: "/records-of-decision/{id}/comment-period"
    description: "Open the public comment period on the proposed plan; requires the cited RI/FS to be APPROVED."
    roles: [RemedialProjectManager]
    code: 200
    input: []
    output: RecordOfDecision
    side_effects: ["DRAFT -> PUBLIC_COMMENT", "comment_period_start = logical clock, comment_period_end = start + comment_period_days days", "increments RecordOfDecision.version by 1"]

  - method: POST
    path: "/records-of-decision/{id}/public-comments"
    description: "File a public comment during the open comment period."
    roles: [CommunityMember, PRPRepresentative]
    code: 200
    input: [commenter_name, comment_text]
    output: RecordOfDecision
    side_effects: ["increments public_comments_count by 1", "increments RecordOfDecision.version by 1"]

  - method: POST
    path: "/records-of-decision/{id}/signature"
    description: "Sign the Record of Decision. When alternative_id is omitted the remedy is chosen by calculations.remedy_selector; the signer may not be the user who approved the cited RI/FS."
    roles: [RemedialProjectManager]
    code: 200
    input: [responsiveness_summary, "alternative_id?"]
    output: RecordOfDecision
    side_effects: ["PUBLIC_COMMENT -> SIGNED", "sets the winning RemedyAlternative.selected_by_rod_id and mirrors it into rod.selected_alternative_id", "advances the site RI_FS_UNDERWAY|REMEDY_REEVALUATION -> ROD_SIGNED and withdraws any AMENDMENT_REQUIRED predecessor ROD", "increments RecordOfDecision.version by 1"]

  # ---- writes: allocation negotiation -------------------------------------
  - method: POST
    path: "/sites/{id}/allocation-rounds"
    description: "Open an allocation round over the site's noticed parties with the Gore-factor weights for this round. Guarded by OCC on the site: expected_site_version must equal the site's current version."
    roles: [AllocationFacilitator]
    code: 201
    input: [weight_volume_bp, weight_toxicity_bp, weight_ownership_bp, expected_site_version]
    output: AllocationRound
    side_effects: ["increments Site.version by 1", "supersedes the site's DRAFTING, BALLOTING or FAILED round", "creates one AllocationShare per candidate party (every PRP of the site whose status != IDENTIFIED, created_at ASC) with provisional_pct from calculations.allocation_share_computation variant provisional", "round starts DRAFTING with round_number = previous max + 1 and facilitator_user_id = X-User-ID"]

  - method: POST
    path: "/allocation-rounds/{id}/balloting"
    description: "Move the round to balloting, freezing provisional_pct as the voting weights."
    roles: [AllocationFacilitator]
    code: 200
    input: []
    output: AllocationRound
    side_effects: ["DRAFTING -> BALLOTING", "provisional_pct stops tracking later waste-in verifications", "increments AllocationRound.version by 1"]

  - method: POST
    path: "/allocation-rounds/{id}/ballots"
    description: "The party casts its ballot on the provisional allocation. X-User-ID must equal the balloting party's id."
    roles: [PRPRepresentative]
    code: 200
    input: [ballot, "ballot_rationale?"]
    output: AllocationShare
    side_effects: ["stamps ballot, ballot_rationale, ballot_cast_at on the acting party's share", "recomputes round.balloted_count and round.accept_share_pct", "when balloted_count reaches share_count the round resolves BALLOTING -> ADOPTED (running calculations.allocation_share_computation variant final, stamping final_pct, orphan_share_pct, settled_share_pct and site.adopted_round_id) or -> FAILED", "increments AllocationShare.version by 1"]

  - method: POST
    path: "/allocation-rounds/{id}/reopening"
    description: "Reopen a balloting or failed round for renegotiation, clearing every ballot and re-deriving provisional shares."
    roles: [AllocationFacilitator]
    code: 200
    input: [revision_note]
    output: AllocationRound
    side_effects: ["BALLOTING|FAILED -> DRAFTING", "clears every ballot and resets balloted_count and accept_share_pct", "recomputes provisional_pct and adds shares for parties noticed since the round opened", "increments AllocationRound.version by 1"]

  # ---- writes: consent decree / AOC ---------------------------------------
  - method: POST
    path: "/sites/{id}/consent-decrees"
    description: "Draft a consent decree or administrative order on consent naming its signatory parties, oversight cost cap and stipulated penalty rate."
    roles: [SettlementCounsel]
    code: 201
    input: [scope_type, scope_summary, party_prp_ids, oversight_cost_cap_cents, stipulated_penalty_per_day_cents, performance_deadline]
    output: ConsentDecree
    side_effects: ["decree starts legal_status NEGOTIATING and compliance_status COMPLIANT", "computes penalty_cap_cents from the oversight cap"]

  - method: POST
    path: "/consent-decrees/{id}/lodging"
    description: "Lodge the decree with the court, opening the 30-day public comment window. Requires an adopted allocation and participating signatories."
    roles: [SettlementCounsel]
    code: 200
    input: []
    output: ConsentDecree
    side_effects: ["NEGOTIATING -> LODGED", "lodged_at = logical clock, public_comment_close_at = lodged_at + 30 days", "increments ConsentDecree.version by 1"]

  - method: POST
    path: "/consent-decrees/{id}/entry"
    description: "Enter the decree after its lodging comment window has elapsed; the entered decree becomes the site's governing oversight cap."
    roles: [SettlementCounsel]
    code: 200
    input: [court_docket_number]
    output: ConsentDecree
    side_effects: ["LODGED -> ENTERED", "stamps court_docket_number and entered_at", "recomputes site.oversight_cap_utilization_pct and site.cost_posture", "increments ConsentDecree.version by 1"]

  - method: POST
    path: "/consent-decrees/{id}/compliance-events"
    description: "Record a VIOLATION, a PENALTY_ASSESSMENT or a CURE against an entered decree; assessment recomputes the whole accrual from the first noncompliance date."
    roles: [SettlementCounsel]
    code: 200
    input: [event_type, effective_at, "violation_type?", "paid_penalty_cents?"]
    output: ConsentDecree
    side_effects: ["compliance_status COMPLIANT -> IN_VIOLATION -> PENALTY_ACCRUING -> COMPLIANT", "PENALTY_ASSESSMENT runs calculations.stipulated_penalty_accrual and sets days_in_violation, accrued_penalty_cents, penalty_capped", "CURE pays the outstanding balance and clears the violation window", "recomputes site.cost_posture (PENALTY_ACCRUING freezes the site)", "increments ConsentDecree.version by 1"]

  # ---- writes: oversight cost, procurement, construction ------------------
  - method: POST
    path: "/sites/{id}/oversight-costs"
    description: "Post incurred EPA oversight cost; the indirect component is re-rated in full from the new direct subtotal."
    roles: [RemedialProjectManager]
    code: 200
    input: [incurred_cents, cost_category, incurred_on]
    output: Site
    side_effects: ["runs calculations.oversight_cost_reimbursement over every posting", "updates oversight_direct_cents, oversight_indirect_rate_bp, oversight_indirect_cents, oversight_billed_cents, oversight_cap_utilization_pct", "recomputes total_response_cost_cents and the whole cost ledger", "recomputes site.cost_posture", "increments Site.version by 1"]

  - method: POST
    path: "/sites/{id}/remediation-contracts"
    description: "Open a solicitation for the remedy selected by a signed Record of Decision."
    roles: [RemedialProjectManager]
    code: 201
    input: [record_of_decision_id, solicitation_reference, engineer_estimate_cents]
    output: RemediationContract
    side_effects: ["contract starts SOLICITATION with work_window_count 0"]

  - method: POST
    path: "/remediation-contracts/{id}/award"
    description: "Award the contract to a bidder within the bid tolerance over the engineer's estimate."
    roles: [RemedialProjectManager]
    code: 200
    input: [contractor_name, awarded_amount_cents, max_concurrent_windows]
    output: RemediationContract
    side_effects: ["SOLICITATION -> AWARDED", "adds awarded_amount_cents to site.total_response_cost_cents and recomputes the cost ledger", "advances the site ROD_SIGNED -> CONSTRUCTION", "increments RemediationContract.version by 1"]

  - method: POST
    path: "/remediation-contracts/{id}/work-windows"
    description: "Schedule a construction, monitoring or maintenance window. X-User-ID must equal the contract id. Immutable once created."
    roles: [Contractor]
    code: 201
    input: [activity_type, start_at, end_at, crew_size, "description?"]
    output: WorkWindow
    side_effects: ["computes the mobilization-buffered interval", "enforces contract.max_concurrent_windows over buffered intervals", "increments contract.work_window_count"]

  - method: POST
    path: "/remediation-contracts/{id}/construction-completion"
    description: "Certify construction complete, starting the operation and maintenance phase and the five-year review clock."
    roles: [RemedialProjectManager]
    code: 200
    input: [punch_list_items]
    output: RemediationContract
    side_effects: ["AWARDED -> CONSTRUCTION_COMPLETE", "advances the site CONSTRUCTION -> OM_PHASE and sets five_year_review_due_at = clock + 1826 days", "terminates a fully performed entered decree", "increments RemediationContract.version by 1"]

  - method: POST
    path: "/sites/{id}/five-year-review"
    description: "Record a statutory five-year review of remedy protectiveness. NOT_PROTECTIVE reopens remedy selection; PROTECTIVE with deletion_recommended deletes the site from the NPL."
    roles: [RemedialProjectManager]
    code: 200
    input: [protectiveness_determination, deletion_recommended, review_summary]
    output: Site
    side_effects: ["OM_PHASE -> REMEDY_REEVALUATION | OM_PHASE | DELETED_FROM_NPL", "3-hop cascade on NOT_PROTECTIVE: site listing_status -> REMEDY_REEVALUATION, the SIGNED ROD -> AMENDMENT_REQUIRED, site.cost_posture -> RESTRICTED", "chains five_year_review_due_at forward by 1826 days from the previous due date", "stamps last_five_year_review_at and last_protectiveness_determination", "closes the CONSTRUCTION_COMPLETE contract on a PROTECTIVE determination", "increments Site.version by 1"]

  # ---- writes: cost recovery, contribution, de minimis --------------------
  - method: POST
    path: "/sites/{id}/cost-recovery-actions"
    description: "Issue a cost recovery demand, a contribution claim or a de minimis settlement offer against an allocated party. Guarded by OCC on the respondent: expected_prp_version must equal the respondent's current version."
    roles: [SettlementCounsel]
    code: 201
    input: [respondent_prp_id, action_type, demanded_cents, expected_prp_version, "claimant_prp_id?"]
    output: CostRecoveryAction
    side_effects: ["increments PotentiallyResponsibleParty.version by 1", "supersedes the respondent's OFFERED action of the same action_type", "freezes respondent_share_pct_at_offer and, for a de minimis offer, premium_floor_cents from calculations.de_minimis_premium_floor", "action starts OFFERED with received_cents 0"]

  - method: POST
    path: "/cost-recovery-actions/{id}/response"
    description: "The respondent accepts or rejects the demand or offer. X-User-ID must equal the respondent party id."
    roles: [PRPRepresentative]
    code: 200
    input: [decision, "response_note?"]
    output: CostRecoveryAction
    side_effects: ["OFFERED -> ACCEPTED or REJECTED", "accepting a de minimis offer moves the party to DE_MINIMIS_SETTLED with contribution protection and zeroes its share into round.settled_share_pct", "rejecting a demand moves the party to RECALCITRANT", "increments CostRecoveryAction.version by 1"]

  - method: POST
    path: "/cost-recovery-actions/{id}/collection"
    description: "Record money received against an accepted action; partial receipts are allowed, overpayment is refused."
    roles: [SettlementCounsel]
    code: 200
    input: [received_cents, "receipt_reference?"]
    output: CostRecoveryAction
    side_effects: ["ACCEPTED -> COLLECTED once received_cents reaches demanded_cents", "adds the receipt to site.recovered_cost_cents and recomputes unrecovered_cost_cents", "a fully collected demand moves the respondent to SETTLED", "increments CostRecoveryAction.version by 1"]

  - method: POST
    path: "/cost-recovery-actions/{id}/voiding"
    description: "Void an accepted or collected action, reversing every ledger and share side effect it caused."
    roles: [SettlementCounsel]
    code: 200
    input: [void_reason]
    output: CostRecoveryAction
    side_effects: ["ACCEPTED|COLLECTED -> VOIDED", "compensation: site.recovered_cost_cents reduced by the receipts, received_cents zeroed, ledger identity restored", "restores a de minimis party to PARTICIPATING and its share to ALLOCATED with final_pct from pre_settlement_final_pct", "restores a settled demand respondent to PARTICIPATING", "increments CostRecoveryAction.version by 1"]

  # ---- test-driving endpoint ---------------------------------------------
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the server's logical clock to any instant. The clock's startup default is exactly 2026-08-01T00:00:00Z and it never falls back to wall-clock time, so every comment window, penalty accrual and five-year review deadline is deterministic."
    roles: [RemedialProjectManager, AllocationFacilitator, SettlementCounsel, PRPRepresentative, Contractor, CommunityMember]
    code: 200
    input: [current_utc]
    output: { current_utc: datetime }
    side_effects: ["subsequent requests read this instant as the logical clock", "no entity is mutated and no version is incremented"]

# ---------------------------------------------------------------------------
# 1.6 Error Code Catalog
# ---------------------------------------------------------------------------
errors:
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "X-User-ID or X-User-Role header missing, empty, or the role is not one of the six declared roles."
  - id: ERR_UNAUTHORIZED
    http: 403
    condition: "The acting role is not listed on the endpoint (e.g. an AllocationFacilitator lodging a decree, or a PRPRepresentative verifying a waste-in record)."
  - id: ERR_ACTOR_IDENTITY_MISMATCH
    http: 403
    condition: "An entity-backed role acts for someone else: a PRPRepresentative whose X-User-ID is not the party responding, balloting or being pursued, or a Contractor whose X-User-ID is not the contract being scheduled."
  - id: ERR_INVALID_REQUEST
    http: 422
    condition: "Malformed request: missing required field, wrong type, enum value out of range, non-integer cents, decimal scale exceeded, empty or duplicate-bearing party_prp_ids, pagination outside 1..100."

  - id: ERR_SITE_NOT_FOUND
    http: 404
    condition: "No Site with the given id."
  - id: ERR_PRP_NOT_FOUND
    http: 404
    condition: "No PotentiallyResponsibleParty with the given id, in a path or in prp_id / respondent_prp_id / claimant_prp_id / party_prp_ids."
  - id: ERR_WASTE_IN_RECORD_NOT_FOUND
    http: 404
    condition: "No WasteInRecord with the given id."
  - id: ERR_REMEDIAL_INVESTIGATION_NOT_FOUND
    http: 404
    condition: "No RemedialInvestigation with the given id, in a path or in remedial_investigation_id."
  - id: ERR_RECORD_OF_DECISION_NOT_FOUND
    http: 404
    condition: "No RecordOfDecision with the given id, in a path or in record_of_decision_id."
  - id: ERR_REMEDY_ALTERNATIVE_NOT_FOUND
    http: 404
    condition: "alternative_id names no RemedyAlternative at all."
  - id: ERR_ALLOCATION_ROUND_NOT_FOUND
    http: 404
    condition: "No AllocationRound with the given id."
  - id: ERR_CONSENT_DECREE_NOT_FOUND
    http: 404
    condition: "No ConsentDecree with the given id."
  - id: ERR_REMEDIATION_CONTRACT_NOT_FOUND
    http: 404
    condition: "No RemediationContract with the given id."
  - id: ERR_COST_RECOVERY_ACTION_NOT_FOUND
    http: 404
    condition: "No CostRecoveryAction with the given id."

  - id: ERR_STALE_SITE_VERSION
    http: 412
    condition: "expected_site_version does not equal the site's current version at POST /sites/{id}/allocation-rounds."
  - id: ERR_STALE_PRP_VERSION
    http: 412
    condition: "expected_prp_version does not equal the respondent party's current version at POST /sites/{id}/cost-recovery-actions."

  - id: ERR_SITE_COST_FROZEN
    http: 409
    condition: "The site's derived cost_posture is FROZEN (a decree of the site is PENALTY_ACCRUING) and a cost-bearing operation was attempted."
  - id: ERR_SITE_COST_RESTRICTED
    http: 409
    condition: "The site's derived cost_posture is RESTRICTED (oversight utilization at or above 90.00%, an open decree violation, a ROD awaiting amendment, or the site under remedy reevaluation) and a restricted operation was attempted."
  - id: ERR_INVALID_STATE_TRANSITION
    http: 409
    condition: "The requested transition is not declared from the entity's current state, including every repeat of an already-applied transition."
  - id: ERR_SITE_PHASE_INVALID
    http: 409
    condition: "The site's listing_status does not permit the operation (waste-in before listing, allocation before the RI/FS is under way, five-year review outside the O&M phase)."
  - id: ERR_RIFS_NOT_APPROVED
    http: 409
    condition: "A comment period was opened on a ROD whose cited RemedialInvestigation is not APPROVED."
  - id: ERR_ROD_NOT_SIGNED
    http: 409
    condition: "A remediation contract was created or awarded against a RecordOfDecision that is not SIGNED."
  - id: ERR_NO_ADOPTED_ALLOCATION
    http: 409
    condition: "A decree lodging or a cost-recovery action was attempted before the site has an ADOPTED allocation round."
  - id: ERR_DECREE_NOT_ENTERED
    http: 409
    condition: "A compliance event was recorded against a decree whose legal_status is not ENTERED."

  - id: ERR_SEGREGATION_OF_DUTIES
    http: 409
    condition: "The RI/FS author tried to review their own investigation, or the user who approved the RI/FS tried to sign the Record of Decision resting on it."
  - id: ERR_HRS_SCORE_BELOW_THRESHOLD
    http: 409
    condition: "NPL listing attempted with hrs_score below 28.50."
  - id: ERR_NO_VALID_SAMPLES
    http: 409
    condition: "RI/FS submission attempted with no ContaminantSample of the RI's exposure_medium whose qa_status is VALID."
  - id: ERR_COMMUNITY_INVOLVEMENT_INCOMPLETE
    http: 409
    condition: "ROD signature attempted with public_comments_count == 0."
  - id: ERR_REMEDY_NOT_PROTECTIVE
    http: 409
    condition: "An explicitly named alternative with effectiveness_score below 60 was selected for a site whose RI/FS has action_level_exceeded == true."
  - id: ERR_ALTERNATIVE_NOT_FOR_SITE
    http: 409
    condition: "alternative_id names a RemedyAlternative belonging to a different RemedialInvestigation than the one this ROD cites."
  - id: ERR_PARTY_NOT_PARTICIPATING
    http: 409
    condition: "A decree signatory is not PARTICIPATING at lodging, or a ballot was cast by a party that is not PARTICIPATING or RECALCITRANT."
  - id: ERR_RESPONDENT_NOT_ALLOCATED
    http: 409
    condition: "The respondent holds no ALLOCATED share in the site's adopted round (never allocated, already orphaned, or already settled)."
  - id: ERR_COMMENT_PERIOD_OPEN
    http: 409
    condition: "ROD signature attempted while the logical clock is at or before comment_period_end."
  - id: ERR_COMMENT_PERIOD_CLOSED
    http: 409
    condition: "A public comment was filed after comment_period_end, or on a ROD that is not in PUBLIC_COMMENT."
  - id: ERR_DECREE_COMMENT_PERIOD_OPEN
    http: 409
    condition: "Decree entry attempted before public_comment_close_at (lodged_at + 30 days)."
  - id: ERR_FIVE_YEAR_REVIEW_NOT_DUE
    http: 409
    condition: "A five-year review was submitted before site.five_year_review_due_at."
  - id: ERR_OWNERSHIP_PERIOD_OVERLAP
    http: 409
    condition: "The new ownership period overlaps an existing period of the same site on the half-open interval (touching endpoints are allowed)."
  - id: ERR_WORK_WINDOW_CAPACITY_EXCEEDED
    http: 409
    condition: "The new work window's mobilization-buffered interval would put more than max_concurrent_windows windows of the same contract in play at once."
  - id: ERR_WEIGHTS_NOT_NORMALIZED
    http: 422
    condition: "weight_volume_bp + weight_toxicity_bp + weight_ownership_bp does not equal exactly 10000."
  - id: ERR_NO_ALLOCATION_BASIS
    http: 409
    condition: "Every allocation factor totals zero across the round's candidate parties, so no share can be derived."
  - id: ERR_BALLOT_ALREADY_CAST
    http: 409
    condition: "The acting party has already balloted on this round and the round has not been reopened."
  - id: ERR_NO_ELIGIBLE_REMEDY
    http: 409
    condition: "The auto-selector pool is empty: every alternative of the cited RI/FS fails the protectiveness filter, or the RI/FS has no alternatives at all."
  - id: ERR_VERIFIED_VOLUME_EXCEEDS_CLAIM
    http: 422
    condition: "verified_volume_tons exceeds the record's claimed volume_tons, is not positive, or was supplied alongside decision == REJECTED."
  - id: ERR_NOT_DE_MINIMIS_ELIGIBLE
    http: 409
    condition: "A DE_MINIMIS_SETTLEMENT was offered to a party whose de_minimis_eligible is false (share above 1.00%, toxicity class I or II, verified volume above 110.00 tons, or no verified record at all)."
  - id: ERR_DE_MINIMIS_PREMIUM_INSUFFICIENT
    http: 422
    condition: "demanded_cents is below the premium floor (share of total response cost times the 2.0 premium multiplier)."
  - id: ERR_BID_EXCEEDS_ESTIMATE
    http: 422
    condition: "awarded_amount_cents exceeds the engineer's estimate by more than the 1500 bp bid tolerance."
  - id: ERR_OVERSIGHT_CAP_EXCEEDED
    http: 409
    condition: "The posting would push oversight_billed_cents past the governing entered decree's oversight_cost_cap_cents."
  - id: ERR_OVERPAYMENT_NOT_ALLOWED
    http: 422
    condition: "received_cents exceeds the action's outstanding balance (demanded_cents minus received_cents)."
  - id: ERR_PENALTY_BALANCE_MISMATCH
    http: 422
    condition: "A CURE event's paid_penalty_cents does not equal the decree's outstanding penalty balance exactly."

# ---------------------------------------------------------------------------
# 1.7 RBAC Matrix (segregation of duties)
# ---------------------------------------------------------------------------
roles:
  - name: RemedialProjectManager
    description: "EPA remedial project manager: site listing, PRP identification, waste-in verification, RI/FS authorship and review, decision documents, oversight cost posting, procurement, construction certification and five-year reviews. Two distinct RPM user ids are required by the segregation-of-duties rules (an author cannot review, an approver cannot sign)."
    identity: "opaque"
    exclusive_operations:
      - "POST /sites"
      - "POST /sites/{id}/list-on-npl"
      - "POST /sites/{id}/prps"
      - "POST /prps/{id}/notice"
      - "POST /prps/{id}/defunct"
      - "POST /sites/{id}/ownership-periods"
      - "POST /sites/{id}/waste-in-records"
      - "POST /waste-in-records/{id}/verification"
      - "POST /sites/{id}/remedial-investigations"
      - "POST /remedial-investigations/{id}/samples"
      - "POST /remedial-investigations/{id}/submission"
      - "POST /remedial-investigations/{id}/review"
      - "POST /remedial-investigations/{id}/remedy-alternatives"
      - "POST /sites/{id}/records-of-decision"
      - "POST /records-of-decision/{id}/comment-period"
      - "POST /records-of-decision/{id}/signature"
      - "POST /sites/{id}/oversight-costs"
      - "POST /sites/{id}/remediation-contracts"
      - "POST /remediation-contracts/{id}/award"
      - "POST /remediation-contracts/{id}/construction-completion"
      - "POST /sites/{id}/five-year-review"
    shared_operations:
      - "every GET endpoint"
      - "POST /_clock/set_current_utc"

  - name: AllocationFacilitator
    description: "Neutral allocation facilitator who runs the negotiation: opens rounds with the Gore-factor weights, moves them to balloting and reopens them for renegotiation. Cannot verify waste-in records (that is the RPM's evidentiary role) and cannot settle (that is SettlementCounsel's)."
    identity: "opaque"
    exclusive_operations:
      - "POST /sites/{id}/allocation-rounds"
      - "POST /allocation-rounds/{id}/balloting"
      - "POST /allocation-rounds/{id}/reopening"
    shared_operations:
      - "every GET endpoint"
      - "POST /_clock/set_current_utc"

  - name: SettlementCounsel
    description: "Government settlement counsel: negotiates, lodges and enters consent decrees and administrative orders, records compliance events and penalties, and issues, collects and voids cost recovery, contribution and de minimis settlement actions. Cannot run the allocation rounds whose outcome its demands rest on."
    identity: "opaque"
    exclusive_operations:
      - "POST /sites/{id}/consent-decrees"
      - "POST /consent-decrees/{id}/lodging"
      - "POST /consent-decrees/{id}/entry"
      - "POST /consent-decrees/{id}/compliance-events"
      - "POST /sites/{id}/cost-recovery-actions"
      - "POST /cost-recovery-actions/{id}/collection"
      - "POST /cost-recovery-actions/{id}/voiding"
    shared_operations:
      - "every GET endpoint"
      - "POST /_clock/set_current_utc"

  - name: PRPRepresentative
    description: "Counsel for one potentially responsible party. X-User-ID is the PotentiallyResponsibleParty.id it represents, and every write is checked against that identity."
    identity: "entity_backed:PotentiallyResponsibleParty"
    exclusive_operations:
      - "POST /prps/{id}/response"
      - "POST /allocation-rounds/{id}/ballots"
      - "POST /cost-recovery-actions/{id}/response"
    shared_operations:
      - "every GET endpoint"
      - "POST /records-of-decision/{id}/public-comments"
      - "POST /_clock/set_current_utc"

  - name: Contractor
    description: "Remediation contractor scheduling field work. X-User-ID is the RemediationContract.id it was awarded, so a contractor can only schedule windows on its own contract."
    identity: "entity_backed:RemediationContract"
    exclusive_operations:
      - "POST /remediation-contracts/{id}/work-windows"
    shared_operations:
      - "every GET endpoint"
      - "POST /_clock/set_current_utc"

  - name: CommunityMember
    description: "Member of the affected community participating in the remedy decision through the public comment record."
    identity: "opaque"
    exclusive_operations: []
    shared_operations:
      - "every GET endpoint"
      - "POST /records-of-decision/{id}/public-comments"
      - "POST /_clock/set_current_utc"
