  - section: rbac
    instances:
      - name: recall_operations_manager_performs_its_exclusive_fleet_and_parts_operations
        claim_type: exclusive_operations_allowed
        grounds:
          - rbac.RecallOperationsManager
          - endpoints.POST_vehicles
          - endpoints.POST_parts_allocations
        distinguishing_aspect: |
          Fleet records, population runs, dealer onboarding and parts allocation all belong to the
          operations desk alone: the same sequence succeeds for RecallOperationsManager, while a
          SafetyEngineer -- who may create the remedy part itself -- is refused when trying to allocate
          it, so the boundary sits between defining a remedy and distributing it.
        test_recipe:
          setup:
            - "Campaign 26V-337 is FILED and owns part P-88337 with 100 units."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T09:00:00Z" }
              as: SafetyEngineer
              as_user_id: "u-eng-1"
            - call: "POST /recall-campaigns"
              payload: { campaign_number: "26V-337", defect_type: "SAFETY_DEFECT", defect_description: "Inflator may rupture" }
