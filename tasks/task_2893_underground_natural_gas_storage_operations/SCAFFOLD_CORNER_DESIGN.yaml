      - name: read_endpoints_outside_a_roles_shared_list_are_rejected_while_its_own_reads_pass
        claim_type: other_role_rejected
        grounds:
          - roles.IntegrityEngineer.shared_operations
          - roles.Shipper.shared_operations
          - validations.priority_2_ERR_UNAUTHORIZED
          - errors.ERR_UNAUTHORIZED
        distinguishing_aspect: |
          The read surface is NOT uniform, which is the single easiest thing to get wrong: the
          IntegrityEngineer — an internal operator — is locked out of the entire commercial read surface
          (shippers, contracts, ledger, nominations, tickets), while the Shipper — an external customer —
          is locked out of the entire operational read surface (integrity tests, remediation programs,
          compressor units and their runs, emergency events, regulatory reports) and the clock, yet BOTH
          may read wells and the storage field. An implementation that grants every GET to every
          authenticated role passes nothing here.
        test_recipe:
          setup:
            - "Field F_MINI with one well MINI-1 and one compressor unit U-1; shipper NORTHLINE with one DRAFT contract CN-1 and one DRAFT report on the field, so every listed resource actually exists (the contract's lifecycle state is irrelevant here — every refusal is a role refusal)."
          setup_api_calls:
            - call: "POST /storage-fields"
              payload: { name: "Cavern Mini", field_code: "F-MINI", total_capacity_dth: 1000000, cushion_gas_dth: 500000, base_pressure_psig: 800, pressure_span_psig: 1400, max_pressure_psig: 3000, season: "INJECTION", opening_working_gas_dth: 250000, deliverability_method: "CURVE_INTERPOLATED", deliverability_curve: [{ inventory_pct: 0, withdrawal_dth_per_day: 0, injection_dth_per_day: 300000 }, { inventory_pct: 100, withdrawal_dth_per_day: 300000, injection_dth_per_day: 0 }] }
              as: FieldOperator
              captures: { f1: $.data.id }
            - call: "POST /wells"
              payload: { storage_field_id: "${f1}", well_name: "MINI-1", well_type: "INJECTION_WITHDRAWAL", rated_rate_dth_per_day: 600000, last_mit_passed_at: "2026-06-01T00:00:00Z" }
              as: FieldOperator
              captures: { w1: $.data.id }
            - call: "POST /compressor-units"
              payload: { storage_field_id: "${f1}", unit_code: "U-1", rated_horsepower: 6000, derate_factor: 0.00 }
              as: FieldOperator
              captures: { u1: $.data.id }
            - call: "POST /shippers"
              payload: { legal_name: "Northline Gas Marketing", duns_number: "123456789", penalty_threshold_usd: 500000.00 }
              as: SchedulingCoordinator
              captures: { s1: $.data.id }
            - call: "POST /storage-contracts"
              payload: { shipper_id: "${s1}", storage_field_id: "${f1}", contract_code: "CN-1", service_class: "FIRM", max_storage_quantity_dth: 1000000, max_daily_injection_dth: 100000, max_daily_withdrawal_dth: 100000, term_start_date: "2026-08-01", term_end_date: "2026-12-31", commodity_rate_usd_per_dth: 0.0450, index_price_usd_per_dth: 3.4500, cash_out_method: "MONTHLY_AGGREGATE" }
              as: SchedulingCoordinator
              captures: { c1: $.data.id }
            - call: "POST /regulatory-reports"
              payload: { storage_field_id: "${f1}", report_type: "INVENTORY_VERIFICATION", period_start_date: "2026-08-01", period_end_date: "2026-08-31", measured_inventory_dth: 250000 }
              as: ComplianceOfficer
              as_user_id: "officer-a"
              captures: { rp1: $.data.id }
          trigger:
            - call: "GET /shippers/${s1}"
              payload: {}
              as: IntegrityEngineer
              as_user_id: "eng-a"
              captures: { e1: $.data.error_id }
            - call: "GET /storage-contracts"
              payload: { limit: 100 }
              as: IntegrityEngineer
              as_user_id: "eng-a"
              captures: { e2: $.data.error_id }
            - call: "GET /storage-contracts/${c1}/imbalance-ledger-entries"
              payload: { limit: 100 }
              as: IntegrityEngineer
              as_user_id: "eng-a"
              captures: { e3: $.data.error_id }
            - call: "GET /nominations"
              payload: { limit: 100 }
              as: IntegrityEngineer
              as_user_id: "eng-a"
              captures: { e4: $.data.error_id }
            - call: "GET /gas-movement-tickets"
              payload: { limit: 100 }
              as: IntegrityEngineer
              as_user_id: "eng-a"
              captures: { e5: $.data.error_id }
            - call: "GET /mechanical-integrity-tests"
              payload: { limit: 100 }
              as: Shipper
              as_user_id: "${s1}"
              captures: { e6: $.data.error_id }
            - call: "GET /remediation-programs"
              payload: { limit: 100 }
              as: Shipper
              as_user_id: "${s1}"
              captures: { e7: $.data.error_id }
            - call: "GET /compressor-units/${u1}/runs"
              payload: { limit: 100 }
              as: Shipper
              as_user_id: "${s1}"
