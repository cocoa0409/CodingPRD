  # From Cross-Cutting Complexity Layers
  # ===========================================================================
  - section: complexity_layers
    instances:
      - name: corner_version_increments_on_every_mutation
        claim_type: derived_field_reconciliation
        grounds: ["entities.PanelCell.fields.version", "concurrency_rules[cell-target-adjust-stale]"]
        distinguishing_aspect: "Cell version walks 1 (create) -> 2 (target adjust) -> 3 (enroll cascade bumps the cell), proving every mutation — including cascaded ones — advances version."
        test_recipe:
          setup: ["Cell target 5 created (version 1)"]
          setup_api_calls:
            - { call: "POST /feedback-panel/panel-cells", payload: { age_band: "AGE_18_29", district: "D1", tenure_bucket: "RENTER", target_size: 5 }, as: PanelManager, captures: { c1_id: $.data.id, cv1: $.data.version } }
            - { call: "POST /feedback-panel/panelists", payload: { external_ref: "p1@x", full_name: "P One", age_band: "AGE_18_29", district: "D1", tenure_bucket: "RENTER", preferred_locale: "en" }, as: PanelManager, captures: { p1_id: $.data.id } }
          trigger:
            - { call: "POST /feedback-panel/panel-cells/${c1_id}/targets", payload: { target_size: 6, expected_cell_version: "${cv1}" }, as: PanelManager, captures: { cv2: $.data.version } }
            - { call: "POST /feedback-panel/panelists/${p1_id}/enroll", payload: {}, as: PanelManager }
            - { call: "GET /feedback-panel/panel-cells/${c1_id}", payload: {}, as: PanelManager, captures: { cv3: $.data.version, ac: $.data.active_count } }
          assert:
            - "cv1 == 1"
            - "cv2 == 2"
            - "cv3 == 3"
            - "ac == 1"

