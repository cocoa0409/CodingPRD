            - call: "POST /cash-ops/till-sessions/${session_a_id}/blind-count"
              payload: { counted_lines: [{ denomination_cents: 2000, quantity: 8 }, { denomination_cents: 1000, quantity: 1 }] }
              as: CashOfficeClerk
              as_user_id: "U-CLERK-3"
            - call: "POST /cash-ops/till-sessions/${session_a_id}/reconcile"
              payload: {}
              as: CashOfficeClerk
              as_user_id: "U-CLERK-3"
            - call: "POST /cash-ops/till-sessions"
              payload: { sales_journal_id: "${journal_id}", cashier_id: "${cashier_id}", safe_id: "${safe_id}", register_number: 2, shift_start_at: "2026-08-03T13:00:00Z", shift_end_at: "2026-08-03T17:00:00Z", starting_bank_cents: 20000 }
              as: StoreManager
              captures: { session_b_id: $.data.id }
            - call: "POST /cash-ops/till-sessions/${session_b_id}/drops"
              payload: { txn_type: "CLOSING_DROP", declared_amount_cents: 150000 }
              as: Cashier
              as_user_id: "${cashier_id}"
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-03T17:00:00Z" }
              as: TreasuryAnalyst
            - call: "POST /cash-ops/till-sessions/${session_b_id}/close"
              payload: { pos_cash_sales_cents: 150000, pos_card_sales_cents: 60000, pos_paid_out_cents: 0 }
              as: Cashier
              as_user_id: "${cashier_id}"
            - call: "POST /cash-ops/till-sessions/${session_b_id}/blind-count"
              payload: { counted_lines: [{ denomination_cents: 2000, quantity: 6 }, { denomination_cents: 1000, quantity: 1 }, { denomination_cents: 1, quantity: 1 }] }
              as: CashOfficeClerk
              as_user_id: "U-CLERK-3"
          trigger:
            - call: "POST /cash-ops/till-sessions/${session_b_id}/reconcile"
              payload: {}
              as: CashOfficeClerk
              as_user_id: "U-CLERK-3"
          assert:
            - "TillSession.${session_b_id}.counted_cash_cents == 13001"
            - "TillSession.${session_b_id}.expected_cash_cents == 20000"
            - "TillSession.${session_b_id}.variance_cents == -6999"
            - "Cashier.${cashier_id}.rolling_absolute_variance_cents == 9999"
            - "Cashier.${cashier_id}.rolling_net_variance_cents == -9999"
            - "Cashier.${cashier_id}.till_eligibility == ELIGIBLE"
            - "GET /cash-ops/variance-cases?sales_journal_id=${journal_id}&case_type=ROLLING_PATTERN returns 0 cases"
            - "GET /cash-ops/variance-cases?sales_journal_id=${journal_id}&case_type=SESSION_VARIANCE returns exactly 2 cases with total_variance_cents 3000 and 6999"
            - "Cashier.${cashier_id}.open_case_count == 2"
            - "SalesJournal.${journal_id}.register_cash_tieout_cents == -9999"

      - name: card_settlement_tier_floor_and_round_half_up_boundaries
        grounds:
          - calculations.card_settlement_reconciliation
          - calculations.card_settlement_reconciliation.constants.TIER_2_FLOOR_CENTS
          - entities.CardSettlement.fields.expected_fee_cents
          - entities.CardSettlement.fields.settlement_variance_cents
          - endpoints["POST /cash-ops/card-settlements"]
        distinguishing_aspect: |
          Two independent boundaries in one instance: (a) the tier floor is inclusive at the lower
          edge, so monthly_volume_cents 5000000 charges 0.0220 (fee 8040) while 4999999 charges
          0.0250 (fee 8940) on identical gross sales; (b) 412750 x 0.0195 = 8048.625 must
          round_half_up to 8049, so expected_funded_cents is 401485 — truncation would give 8048 and
          401486. This is a rate-selection and half-cent rounding boundary, not an accumulated sum.
        test_recipe:
          setup:
            - "Store S-1012 registered"
            - "Three sales journals exist for 2026-08-03, 2026-08-04 and 2026-08-05, all in status OPEN with no settlements"
            - "Logical clock is 2026-08-06T09:00:00Z"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-06T09:00:00Z" }
              as: TreasuryAnalyst
            - call: "POST /cash-ops/stores"
              payload: { store_code: "S-1012", name: "Store 1012", region_code: "NORTH" }
