# SCAFFOLD_CORNER_DESIGN.yaml - §1.9 breadth probe for
# task_2592_industrial_battery_manufacturing.
#
# Walked row-by-row against references/claim-extraction-guide.md's nine
# sections. Every corner already asserted by a §1.8 instance is emitted as an
# `excluded_because:` stub naming that instance. Every other corner carries a
# full, empty-DB-executable `test_recipe`.
#
# Shared fixture vocabulary (re-derived from empty DB inside every instance -
# no cross-instance state is assumed):
#   clock                2026-09-01T00:00:00Z unless the instance advances it
#   plant  PLT-RIV       "Riverside Battery Works", both chemistries licensed,
#                        permit ACTIVE, monthly_lead_emission_permit_g 100000.00,
#                        peak/offpeak tariffs 25.00 / 15.00 cents per kWh,
#                        lead_initial_inventory_kg 10000.000
#   workers              Ada Engineer / Ben Engineer (ENGINEER),
#                        Cara Supervisor / Pat Paster (PRODUCTION),
#                        Dana Quality / Eli Quality (QUALITY),
#                        Sam Safety (SAFETY); all hired 2020-01-01T00:00:00Z
#   design CD-LEAD-465   LEAD_ACID / TUBULAR / 12 cells x 2.00 V = 24.0 V pack,
#                        465.0 Ah, 1500 rated cycles, 60 warranty months,
#                        900.0 kg pack, 300.000 kg lead, charge factor 1.50,
#                        list price 500000 cents
#   bay BAY-1            rated_power_kw 20.00, cooldown_minutes 45
#   chamber TC-1         power_cap_kw 10.00

scaffold_corner_design:

  # =====================================================================
  # SECTION 1 - ENTITIES (guide Table 1 + `flat` topology row)
  # =====================================================================
  - section: entities
    instances:

      - name: plant_creation_initialises_every_ledger_and_derives_open_posture
        claim_type: Creation
        grounds:
          - entities.Plant
          - endpoints[POST /plants].side_effects
          - calculations.plant_compliance_posture
        distinguishing_aspect: "A freshly registered plant answers 201 with lead_inventory_kg seeded from lead_initial_inventory_kg (10000.000), every other ledger at zero, emission_utilization_ratio 0.0000 and compliance_posture OPEN - the posture is derived at creation, not defaulted blindly."
        test_recipe:
          setup:
            - "Empty database; logical clock pinned to 2026-09-01T00:00:00Z."
          setup_api_calls:
            - call: POST /_clock/set_current_utc
              as: PlantAdmin
              payload: { current_utc: "2026-09-01T00:00:00Z" }
          trigger:
            - call: POST /plants
              as: PlantAdmin
              payload: { name: "Riverside Battery Works", site_code: "PLT-RIV", licensed_chemistries: [LEAD_ACID, LITHIUM_LFP], permit_status: ACTIVE, monthly_lead_emission_permit_g: 100000.00, peak_tariff_cents_per_kwh: 25.00, offpeak_tariff_cents_per_kwh: 15.00, lead_initial_inventory_kg: 10000.000 }
              captures: { plant_id: "$.data.id" }
          assert:
            - "HTTP 201; envelope carries meta.api_request_id, meta.api_request_timestamp and response_type == \"object\"."
            - "data.id is a server-minted id and data.version == 1."
            - "Plant.lead_inventory_kg == 10000.000 and Plant.lead_initial_inventory_kg == 10000.000."
            - "Plant.lead_in_field_kg == 0.000, Plant.lead_recycled_kg == 0.000, Plant.lead_mass_variance_kg == 0.000, Plant.core_lead_variance_kg == 0.000."
            - "Plant.emission_reserved_g == 0.00, Plant.emission_consumed_g == 0.00, Plant.emission_utilization_ratio == 0.0000."
            - "Plant.core_deposit_liability_cents == 0, Plant.formation_energy_charge_cents == 0, Plant.open_medical_removal_count == 0."
            - "Plant.compliance_posture == \"OPEN\" and Plant.permit_status == \"ACTIVE\"."

      - name: cell_design_draft_defaults_and_derived_pack_voltage
        claim_type: Defaults
        grounds:
          - entities.CellDesign.fields.nominal_pack_voltage_v
          - entities.CellDesign.fields.formation_charge_factor
          - entities.CellDesign.fields.retest_tightening_enabled
          - endpoints[POST /cell-designs].side_effects
        distinguishing_aspect: "Omitting formation_charge_factor and retest_tightening_enabled yields the declared defaults 1.15 and true, while nominal_pack_voltage_v is DERIVED as 12 * 2.00 = 24.0 and approval_state/revision/approved_revision open at DRAFT / 1 / null."
        test_recipe:
          setup:
            - "Plant PLT-RIV plus Ada Engineer (ENGINEER) exist; no design yet."
          setup_api_calls:
            - call: POST /_clock/set_current_utc
              as: PlantAdmin
              payload: { current_utc: "2026-09-01T00:00:00Z" }
            - call: POST /plants
              as: PlantAdmin
              payload: { name: "Riverside Battery Works", site_code: "PLT-RIV", licensed_chemistries: [LEAD_ACID, LITHIUM_LFP], permit_status: ACTIVE, monthly_lead_emission_permit_g: 100000.00, peak_tariff_cents_per_kwh: 25.00, offpeak_tariff_cents_per_kwh: 15.00, lead_initial_inventory_kg: 10000.000 }
              captures: { plant_id: "$.data.id" }
            - call: POST /workers
              as: PlantAdmin
              payload: { plant_id: "${plant_id}", full_name: "Ada Engineer", job_class: ENGINEER, hire_date: "2020-01-01T00:00:00Z" }
              captures: { eng_a_id: "$.data.id" }
          trigger:
            - call: POST /cell-designs
              as: DesignEngineer
              as_user_id: "${eng_a_id}"
              payload: { code: "CD-LEAD-465", chemistry: LEAD_ACID, plate_type: TUBULAR, cells_per_battery: 12, cell_nominal_voltage_v: 2.00, nominal_capacity_ah: 465.0, rated_cycles: 1500, warranty_months: 60, pack_weight_kg: 900.0, lead_content_kg: 300.000, list_price_cents: 500000 }
              captures: { design_id: "$.data.id" }
          assert:
            - "HTTP 201; CellDesign.formation_charge_factor == 1.15 (declared default applied)."
            - "CellDesign.retest_tightening_enabled == true (declared default applied)."
            - "CellDesign.nominal_pack_voltage_v == 24.0 (12 * 2.00, 1 decimal place)."
            - "CellDesign.approval_state == \"DRAFT\", CellDesign.revision == 1, CellDesign.approved_revision == null."
            - "CellDesign.submitted_by_worker_id == null and CellDesign.approved_by_worker_id == null."

      - name: production_lot_pins_the_approved_revision_and_copies_chemistry
        claim_type: Parent Relationships
        grounds:
          - entities.ProductionLot.fields.design_revision_pinned
          - entities.ProductionLot.fields.chemistry
          - endpoints[POST /production-lots].side_effects
          - state_machines.CellDesign.approval_state
        distinguishing_aspect: "A design edited once before approval carries revision 2 and approved_revision 2, so the lot opened against it pins design_revision_pinned == 2 and copies chemistry LEAD_ACID from the parent design rather than accepting either from the request body."
        test_recipe:
          setup:
            - "Design CD-LEAD-465 drafted by Ada, PATCHed once in DRAFT (revision 2), submitted by Ada and approved by Ben."
          setup_api_calls:
            - call: POST /_clock/set_current_utc
              as: PlantAdmin
              payload: { current_utc: "2026-09-01T00:00:00Z" }
            - call: POST /plants
              as: PlantAdmin
              payload: { name: "Riverside Battery Works", site_code: "PLT-RIV", licensed_chemistries: [LEAD_ACID, LITHIUM_LFP], permit_status: ACTIVE, monthly_lead_emission_permit_g: 100000.00, peak_tariff_cents_per_kwh: 25.00, offpeak_tariff_cents_per_kwh: 15.00, lead_initial_inventory_kg: 10000.000 }
              captures: { plant_id: "$.data.id" }
            - call: POST /workers
              as: PlantAdmin
              payload: { plant_id: "${plant_id}", full_name: "Ada Engineer", job_class: ENGINEER, hire_date: "2020-01-01T00:00:00Z" }
              captures: { eng_a_id: "$.data.id" }
            - call: POST /workers
              as: PlantAdmin
              payload: { plant_id: "${plant_id}", full_name: "Ben Engineer", job_class: ENGINEER, hire_date: "2020-01-01T00:00:00Z" }
              captures: { eng_b_id: "$.data.id" }
            - call: POST /workers
              as: PlantAdmin
              payload: { plant_id: "${plant_id}", full_name: "Cara Supervisor", job_class: PRODUCTION, hire_date: "2020-01-01T00:00:00Z" }
              captures: { sup_a_id: "$.data.id" }
            - call: POST /cell-designs
              as: DesignEngineer
              as_user_id: "${eng_a_id}"
              payload: { code: "CD-LEAD-465", chemistry: LEAD_ACID, plate_type: TUBULAR, cells_per_battery: 12, cell_nominal_voltage_v: 2.00, nominal_capacity_ah: 465.0, rated_cycles: 1500, warranty_months: 60, pack_weight_kg: 900.0, lead_content_kg: 300.000, formation_charge_factor: 1.50, list_price_cents: 500000 }
              captures: { design_id: "$.data.id" }
            - call: PATCH /cell-designs/${design_id}
              as: DesignEngineer
              as_user_id: "${eng_a_id}"
              payload: { nominal_capacity_ah: 465.0, rated_cycles: 1500 }
              captures: { design_rev: "$.data.revision" }
            - call: POST /cell-designs/${design_id}/review-actions
              as: DesignEngineer
              as_user_id: "${eng_a_id}"
              payload: { action: SUBMIT }
            - call: POST /cell-designs/${design_id}/review-actions
              as: DesignEngineer
              as_user_id: "${eng_b_id}"
              payload: { action: APPROVE }
              captures: { approved_rev: "$.data.approved_revision" }
          trigger:
            - call: POST /production-lots
              as: ProductionSupervisor
              as_user_id: "${sup_a_id}"
              payload: { plant_id: "${plant_id}", cell_design_id: "${design_id}", lot_code: "LOT-A", quantity: 9 }
              captures: { lot_id: "$.data.id" }
          assert:
            - "The PATCH answered CellDesign.revision == 2 with approval_state still \"DRAFT\"."
            - "The APPROVE answered CellDesign.approval_state == \"APPROVED\", approved_revision == 2, approved_by_worker_id == ${eng_b_id}."
            - "HTTP 201 on the lot; ProductionLot.design_revision_pinned == 2."
            - "ProductionLot.chemistry == \"LEAD_ACID\" (copied from the design, not supplied in the payload)."
            - "ProductionLot.process_state == \"PLANNED\", env_hold_status == \"CLEAR\", retest_count == 0, sampling_plan_revision == 0."
            - "ProductionLot.sample_size == null and ProductionLot.acceptance_number == null - no plan exists until one is drawn."
            - "ProductionLot.lot_capacity_yield_pct == null and every counter (completed_test_count, failed_test_count, passed_cycle_life_count, failed_formation_count) == 0."

      - name: worker_listing_paginates_with_total_count_and_has_more
        claim_type: Listing
        grounds:
          - endpoints[GET /workers]
          - response_envelope.pagination_fields
          - response_envelope.pagination_defaults
        distinguishing_aspect: "Three workers at one plant read back through limit=2/offset=0 as exactly 2 rows with total_count 3 and has_more true, and through offset=2 as 1 row with has_more false - total_count counts the filtered set, not the page."
        test_recipe:
          setup:
            - "Plant PLT-RIV with exactly three workers: Ada (ENGINEER), Cara (PRODUCTION), Sam (SAFETY)."
          setup_api_calls:
            - call: POST /_clock/set_current_utc
              as: PlantAdmin
              payload: { current_utc: "2026-09-01T00:00:00Z" }
            - call: POST /plants
              as: PlantAdmin
              payload: { name: "Riverside Battery Works", site_code: "PLT-RIV", licensed_chemistries: [LEAD_ACID, LITHIUM_LFP], permit_status: ACTIVE, monthly_lead_emission_permit_g: 100000.00, peak_tariff_cents_per_kwh: 25.00, offpeak_tariff_cents_per_kwh: 15.00, lead_initial_inventory_kg: 10000.000 }
              captures: { plant_id: "$.data.id" }
            - call: POST /workers
              as: PlantAdmin
              payload: { plant_id: "${plant_id}", full_name: "Ada Engineer", job_class: ENGINEER, hire_date: "2020-01-01T00:00:00Z" }
              captures: { eng_a_id: "$.data.id" }
            - call: POST /workers
              as: PlantAdmin
              payload: { plant_id: "${plant_id}", full_name: "Cara Supervisor", job_class: PRODUCTION, hire_date: "2020-01-01T00:00:00Z" }
              captures: { sup_a_id: "$.data.id" }
            - call: POST /workers
              as: PlantAdmin
              payload: { plant_id: "${plant_id}", full_name: "Sam Safety", job_class: SAFETY, hire_date: "2020-01-01T00:00:00Z" }
              captures: { safe_a_id: "$.data.id" }
          trigger:
            - call: GET /workers
              as: PlantAdmin
              payload: { plant_id: "${plant_id}", limit: 2, offset: 0 }
            - call: GET /workers
              as: PlantAdmin
              payload: { plant_id: "${plant_id}", limit: 2, offset: 2 }
            - call: GET /workers
              as: PlantAdmin
              payload: { plant_id: "${plant_id}", job_class: SAFETY }
          assert:
            - "First read: HTTP 200, response_type == \"array\", exactly 2 rows, total_count == 3, limit == 2, offset == 0, has_more == true."
            - "Second read: exactly 1 row, total_count == 3, offset == 2, has_more == false."
            - "Third read: exactly 1 row (Sam Safety), total_count == 1, limit == 10 (declared default), has_more == false."
            - "Every returned Worker carries removal_status == \"ACTIVE\", removal_count == 0, exposure_index == 0.00 and exposure_index_variant == \"NONE\"."

      - name: battery_unit_get_with_unknown_id_returns_not_found
        claim_type: Not Found
        grounds:
          - errors[ERR_BATTERY_UNIT_NOT_FOUND]
          - validations[priority 7]
        distinguishing_aspect: "A syntactically valid but unknown BatteryUnit id on GET /battery-units/{id} answers 404 ERR_BATTERY_UNIT_NOT_FOUND from the priority-7 path-existence rung, not 200 with an empty body."
        test_recipe:
          setup:
            - "Empty database apart from the logical clock; no BatteryUnit has ever been created."
          setup_api_calls:
            - call: POST /_clock/set_current_utc
              as: PlantAdmin
              payload: { current_utc: "2026-09-01T00:00:00Z" }
          trigger:
            - call: GET /battery-units/00000000-0000-4000-8000-000000000000
              as: PlantAdmin
              captures: { err_id: "$.data.error_id" }
          assert:
            - "HTTP 404; response_type == \"error\"; data.error_id == \"ERR_BATTERY_UNIT_NOT_FOUND\"."
            - "No BatteryUnit row is created as a side effect of the failed read."

      - name: cell_design_missing_required_rated_cycles_is_rejected
        claim_type: Required Fields
        grounds:
          - endpoints[POST /cell-designs].input
          - validations[priority 3]
          - errors[ERR_VALIDATION]
        distinguishing_aspect: "rated_cycles carries no default and is required, so a body that omits it answers 422 ERR_VALIDATION at the priority-3 schema rung before any chemistry/plate coherence work happens."
        test_recipe:
          setup:
            - "Plant PLT-RIV and Ada Engineer exist; no design yet."
          setup_api_calls:
            - call: POST /_clock/set_current_utc
              as: PlantAdmin
              payload: { current_utc: "2026-09-01T00:00:00Z" }
            - call: POST /plants
              as: PlantAdmin
              payload: { name: "Riverside Battery Works", site_code: "PLT-RIV", licensed_chemistries: [LEAD_ACID, LITHIUM_LFP], permit_status: ACTIVE, monthly_lead_emission_permit_g: 100000.00, peak_tariff_cents_per_kwh: 25.00, offpeak_tariff_cents_per_kwh: 15.00, lead_initial_inventory_kg: 10000.000 }
              captures: { plant_id: "$.data.id" }
            - call: POST /workers
              as: PlantAdmin
              payload: { plant_id: "${plant_id}", full_name: "Ada Engineer", job_class: ENGINEER, hire_date: "2020-01-01T00:00:00Z" }
              captures: { eng_a_id: "$.data.id" }
          trigger:
            - call: POST /cell-designs
              as: DesignEngineer
              as_user_id: "${eng_a_id}"
              payload: { code: "CD-LEAD-465", chemistry: LEAD_ACID, plate_type: TUBULAR, cells_per_battery: 12, cell_nominal_voltage_v: 2.00, nominal_capacity_ah: 465.0, warranty_months: 60, pack_weight_kg: 900.0, lead_content_kg: 300.000, list_price_cents: 500000 }
              captures: { err_id: "$.data.error_id" }
          assert:
            - "HTTP 422; data.error_id == \"ERR_VALIDATION\"."
            - "No CellDesign row exists afterwards: GET /cell-designs answers total_count == 0."

      - name: cell_design_invalid_chemistry_enum_is_rejected
        claim_type: Type Constraints
        grounds:
          - entities.CellDesign.fields.chemistry.constraints
          - validations[priority 3]
          - errors[ERR_VALIDATION]
        distinguishing_aspect: "chemistry accepts only LEAD_ACID or LITHIUM_LFP, so \"NICKEL_IRON\" answers 422 ERR_VALIDATION at priority 3 - it never reaches the priority-3 plate-coherence rule ERR_PLATE_TYPE_INCOMPATIBLE because the enum member itself is unknown."
        test_recipe:
          setup:
            - "Plant PLT-RIV and Ada Engineer exist."
          setup_api_calls:
            - call: POST /_clock/set_current_utc
              as: PlantAdmin
              payload: { current_utc: "2026-09-01T00:00:00Z" }
            - call: POST /plants
              as: PlantAdmin
              payload: { name: "Riverside Battery Works", site_code: "PLT-RIV", licensed_chemistries: [LEAD_ACID, LITHIUM_LFP], permit_status: ACTIVE, monthly_lead_emission_permit_g: 100000.00, peak_tariff_cents_per_kwh: 25.00, offpeak_tariff_cents_per_kwh: 15.00, lead_initial_inventory_kg: 10000.000 }
              captures: { plant_id: "$.data.id" }
            - call: POST /workers
              as: PlantAdmin
              payload: { plant_id: "${plant_id}", full_name: "Ada Engineer", job_class: ENGINEER, hire_date: "2020-01-01T00:00:00Z" }
              captures: { eng_a_id: "$.data.id" }
          trigger:
            - call: POST /cell-designs
              as: DesignEngineer
              as_user_id: "${eng_a_id}"
              payload: { code: "CD-NICKEL-1", chemistry: NICKEL_IRON, plate_type: TUBULAR, cells_per_battery: 12, cell_nominal_voltage_v: 2.00, nominal_capacity_ah: 465.0, rated_cycles: 1500, warranty_months: 60, pack_weight_kg: 900.0, lead_content_kg: 300.000, list_price_cents: 500000 }
              captures: { err_id: "$.data.error_id" }
          assert:
            - "HTTP 422; data.error_id == \"ERR_VALIDATION\" (not ERR_PLATE_TYPE_INCOMPATIBLE)."
            - "No CellDesign row is persisted."

      - name: lot_creation_with_unknown_cell_design_id_returns_not_found
        claim_type: Parent Relationships
        grounds:
          - validations[priority 8]
          - errors[ERR_CELL_DESIGN_NOT_FOUND]
          - complexity_profile.entity_topology
        distinguishing_aspect: "The flat topology validates body foreign keys: an unknown cell_design_id on POST /production-lots answers 404 ERR_CELL_DESIGN_NOT_FOUND at priority 8, ahead of the priority-14 ERR_DESIGN_NOT_APPROVED rule that would fire for a real but unapproved design."
        test_recipe:
          setup:
            - "Plant PLT-RIV and Cara Supervisor exist; no CellDesign has ever been created."
          setup_api_calls:
            - call: POST /_clock/set_current_utc
              as: PlantAdmin
              payload: { current_utc: "2026-09-01T00:00:00Z" }
            - call: POST /plants
              as: PlantAdmin
              payload: { name: "Riverside Battery Works", site_code: "PLT-RIV", licensed_chemistries: [LEAD_ACID, LITHIUM_LFP], permit_status: ACTIVE, monthly_lead_emission_permit_g: 100000.00, peak_tariff_cents_per_kwh: 25.00, offpeak_tariff_cents_per_kwh: 15.00, lead_initial_inventory_kg: 10000.000 }
              captures: { plant_id: "$.data.id" }
            - call: POST /workers
              as: PlantAdmin
              payload: { plant_id: "${plant_id}", full_name: "Cara Supervisor", job_class: PRODUCTION, hire_date: "2020-01-01T00:00:00Z" }
              captures: { sup_a_id: "$.data.id" }
          trigger:
            - call: POST /production-lots
              as: ProductionSupervisor
              as_user_id: "${sup_a_id}"
              payload: { plant_id: "${plant_id}", cell_design_id: "00000000-0000-4000-8000-0000000000aa", lot_code: "LOT-A", quantity: 9 }
              captures: { err_id: "$.data.error_id" }
          assert:
            - "HTTP 404; data.error_id == \"ERR_CELL_DESIGN_NOT_FOUND\"."
            - "GET /production-lots answers total_count == 0."

      - name: exposure_sample_stamps_its_own_derived_index_and_variant
        claim_type: Computed Fields
        grounds:
          - entities.ExposureSample.fields.resulting_worker_index
          - entities.ExposureSample.fields.resulting_variant
          - entities.ExposureSample.fields.triggered_removal
          - calculations.worker_exposure_index
        distinguishing_aspect: "A single 480-minute AIR sample at 20.00 ug/m3 stamps resulting_worker_index 40.00 with resulting_variant AIR_TWA_90D and triggered_removal false (40.00 < the removal threshold 100.00), and the same figures land on the worker row - the client supplies neither."
        test_recipe:
          setup:
            - "Plant PLT-RIV, Sam Safety (SAFETY) as the recorder and Pat Paster (PRODUCTION) as the sampled worker; clock 2026-09-01T00:00:00Z; no prior samples."
          setup_api_calls:
            - call: POST /_clock/set_current_utc
              as: PlantAdmin
              payload: { current_utc: "2026-09-01T00:00:00Z" }
            - call: POST /plants
              as: PlantAdmin
              payload: { name: "Riverside Battery Works", site_code: "PLT-RIV", licensed_chemistries: [LEAD_ACID, LITHIUM_LFP], permit_status: ACTIVE, monthly_lead_emission_permit_g: 100000.00, peak_tariff_cents_per_kwh: 25.00, offpeak_tariff_cents_per_kwh: 15.00, lead_initial_inventory_kg: 10000.000 }
              captures: { plant_id: "$.data.id" }
            - call: POST /workers
              as: PlantAdmin
              payload: { plant_id: "${plant_id}", full_name: "Sam Safety", job_class: SAFETY, hire_date: "2020-01-01T00:00:00Z" }
              captures: { safe_a_id: "$.data.id" }
            - call: POST /workers
              as: PlantAdmin
              payload: { plant_id: "${plant_id}", full_name: "Pat Paster", job_class: PRODUCTION, hire_date: "2020-01-01T00:00:00Z" }
              captures: { pat_id: "$.data.id" }
          trigger:
            - call: POST /workers/${pat_id}/exposure-samples
              as: SafetyOfficer
              as_user_id: "${safe_a_id}"
              payload: { sample_type: AIR, sampled_at: "2026-09-01T00:00:00Z", air_lead_ug_per_m3: 20.00, sample_duration_minutes: 480 }
              captures: { sample_id: "$.data.id" }
          assert:
            - "HTTP 201; ExposureSample.resulting_worker_index == 40.00 (twa 20.000 / PEL 50 * 100)."
            - "ExposureSample.resulting_variant == \"AIR_TWA_90D\" and ExposureSample.triggered_removal == false."
            - "GET /workers/${pat_id} answers exposure_index == 40.00, exposure_index_variant == \"AIR_TWA_90D\", removal_status == \"ACTIVE\", removal_count == 0, last_sample_at == \"2026-09-01T00:00:00Z\"."
            - "Plant.open_medical_removal_count == 0 and Plant.compliance_posture == \"OPEN\"."

      - name: battery_unit_shipment_computes_declared_lead_and_core_status
        claim_type: Computed Fields
        grounds:
          - entities.BatteryUnit.fields.declared_lead_kg
          - entities.BatteryUnit.fields.core_status
          - endpoints[POST /battery-units].side_effects
        excluded_because:
          difficulty_instance: compensating_invariant / invariant_l1_lead_mass_balance_closes_through_shipment_and_core_return
          rationale: "That instance ships two LEAD_ACID units and asserts declared_lead_kg == 300.000, core_status == DEPOSIT_HELD and the 600.000 kg move from lead_inventory_kg into lead_in_field_kg field-by-field."

  # =====================================================================
  # SECTION 2 - STATE MACHINES (guide Table 2 + cyclic / parallel /
  # compound / branching shape rows + §1.7 cascade patterns)
  # =====================================================================
  - section: state_machines
    instances:

      - name: design_submit_moves_draft_to_under_review_and_records_the_submitter
        claim_type: Valid Transition
        grounds:
          - state_machines.CellDesign.approval_state
          - endpoints[POST /cell-designs/{id}/review-actions].side_effects
        distinguishing_aspect: "SUBMIT on a DRAFT design answers 200 with approval_state UNDER_REVIEW and submitted_by_worker_id set to the acting worker, while revision and approved_revision are untouched (1 and null)."
        test_recipe:
          setup:
            - "Design CD-LEAD-465 in DRAFT, drafted by Ada Engineer."
          setup_api_calls:
            - call: POST /_clock/set_current_utc
              as: PlantAdmin
