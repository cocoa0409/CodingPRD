            - call: "POST /notary/documents"
              payload: { request_id: "${req_id}", title: "Aff", doc_type: "AFFIDAVIT", signing_fee_cents: 1000 }
              as: CoordinatorOps
            - call: "POST /notary/requests/${req_id}/quote"
              payload: {}
              as: CoordinatorOps
              captures: { req_v_q: $.data.version }
            - call: "POST /notary/requests/${req_id}/assign"
              payload: { notary_id: "${not_id}", expected_request_version: "${req_v_q}" }
              as: CoordinatorOps
            - call: "POST /notary/ron-sessions"
              payload: { request_id: "${req_id}", scheduled_start: "2026-03-02T10:00:00Z", scheduled_end: "2026-03-02T11:00:00Z" }
              as: Notary
              as_user_id: "${not_id}"
              captures: { sess_id: $.data.id }
          trigger:
