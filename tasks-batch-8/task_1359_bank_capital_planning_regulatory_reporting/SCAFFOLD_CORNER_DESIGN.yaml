              as: CapitalAnalyst
              captures: { sc: $.data.id }
            - call: "POST /banks/${b}/stress-scenarios/${sc}/activate"
              as: CapitalAnalyst
              captures: { loss: $.data.projected_pre_tax_loss_cents }
          assert:
            - "projected_pre_tax_loss_cents == 2090000000  # only P2's 100e9 CORPORATE counts (P1 is CLOSED); CORPORATE base = 200 + 300*30/1000 = 209 bps; 100e9 * 209/10000 = 2.09e9"

