              captures: { survey_id: $.data.id }
            - call: "POST /surveys/${survey_id}/items"
              payload: { label: "box", quantity: 40, cubic_feet_each: 3 }
              as: Estimator
          trigger:
            - call: "POST /estimates"
              payload: { move_job_id: "${job_id}", survey_id: "${survey_id}", binding_type: "BINDING", valuation_coverage: "RELEASED", expected_move_job_version: "${job_v0}" }
              as: Estimator
              captures: { est_id: $.data.id }
            - call: "GET /move-jobs/${job_id}"
              payload: {}
              as: Estimator
              captures: { job_v1: $.data.version }
          assert:
            - "response.status == 201"
            - "MoveJob.${job_id}.version == 2"

      - name: occ_stale_version_on_sit_waive_excluded
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[sit-waive-stale-job]"]
        excluded_because:
          difficulty_instance: compensating_invariant / sit_waive_conserves_gross_charges
          rationale: "The waive endpoint and its OCC field are exercised by the named §1.8 compensating-invariant instance (positive-version path); the stale-version branch is its negative twin."

  # ===========================================================================
  - section: consistency_model
    instances:
      - name: ledger_fields_visible_immediately_after_accept
        claim_type: immediate
        grounds: [entities.MoveJob.fields.gross_charges_cents, state_machines.MoveJob.QUOTING_to_BOOKED]
        distinguishing_aspect: "Immediately after POST /estimates/{id}/accept, the same response shows job_status BOOKED and gross_charges_cents == accepted estimate total (70200 for the LOCAL example)."
        test_recipe:
          setup: ["A LOCAL job with a DRAFT estimate (estimate_total 70200)."]
          setup_api_calls:
            - call: "POST /customers"
              payload: { email: "e_im@x.com", full_name: "Im", origin_state_code: "CA", phone: "555-5100" }
              as: PlatformAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /move-jobs"
              payload: { customer_id: "${cust_id}", service_type: "LOCAL", origin_zip: "90001", destination_zip: "90002", distance_miles: 0, requested_move_date: "2026-07-01T09:00:00Z" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { job_id: $.data.id, job_v: $.data.version }
            - call: "POST /surveys"
              payload: { move_job_id: "${job_id}", survey_method: "IN_HOME" }
              as: Estimator
              captures: { survey_id: $.data.id }
            - call: "POST /surveys/${survey_id}/items"
              payload: { label: "sofa", quantity: 2, cubic_feet_each: 35 }
              as: Estimator
            - call: "POST /surveys/${survey_id}/items"
              payload: { label: "bed", quantity: 3, cubic_feet_each: 60 }
              as: Estimator
            - call: "POST /surveys/${survey_id}/items"
              payload: { label: "box", quantity: 40, cubic_feet_each: 3 }
              as: Estimator
            - call: "POST /packing-orders"
              payload: { move_job_id: "${job_id}", crate_count: 0, packing_lines: [ { material_code: "dish_pack", quantity: 2, unit_price_cents: 1850 } ] }
              as: Estimator
            - call: "POST /estimates"
              payload: { move_job_id: "${job_id}", survey_id: "${survey_id}", binding_type: "NON_BINDING", valuation_coverage: "RELEASED", expected_move_job_version: "${job_v}" }
              as: Estimator
              as_user_id: "est-im"
              captures: { est_id: $.data.id }
          trigger:
            - call: "POST /estimates/${est_id}/accept"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
          assert:
            - "MoveJob.${job_id}.job_status == BOOKED"
            - "MoveJob.${job_id}.gross_charges_cents == 70200"
