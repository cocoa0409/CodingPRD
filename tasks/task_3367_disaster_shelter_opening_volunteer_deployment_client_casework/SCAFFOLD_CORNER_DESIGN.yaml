  - section: errors
    instances:
      - name: unauthenticated_request_returns_missing_auth_header
        claim_type: violation_to_error
        grounds:
          - "errors[ERR_MISSING_AUTH_HEADER]"
          - "validations[priority=1]"
        distinguishing_aspect: "A request with no X-User-Role header is rejected at priority 1 with 401 rather than reaching any business logic."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls:
            - call: "POST /api/v1/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: NationalHQAdmin
          trigger:
            - call: "GET /api/v1/regions/00000000-0000-4000-8000-000000000000"
              payload: {}
              captures: { err: $.data.error_id }
          assert:
            - "the response is 401 with error_id == ERR_MISSING_AUTH_HEADER, not 404"

      - name: duplicate_incident_code_rejected
        claim_type: violation_to_error
        grounds:
          - "errors[ERR_DUPLICATE_INCIDENT_CODE]"
          - "validations[priority=7]"
        distinguishing_aspect: "Declaring a second operation with the same incident_code is rejected while a different code is accepted, so the uniqueness constraint is on incident_code alone."
        test_recipe:
          setup: ["region GL and one existing operation DR-9101"]
          setup_api_calls:
            - call: "POST /api/v1/regions"
              payload: { code: "GL", name: "Great Lakes", state_codes: ["MI", "OH"], coordinator_user_id: "rc_gl", volunteer_pool_target: 40, authorized_agency_codes: ["SALVATION_ARMY"] }
              as: NationalHQAdmin
              captures: { reg_gl: $.data.id }
            - call: "POST /api/v1/disaster-relief-operations"
              payload: { incident_code: "DR-9101", incident_type: "FLOOD", declared_at: "2026-09-02T00:00:00Z", region_id: "${reg_gl}" }
              as: RegionalCoordinator
              captures: { op_id: $.data.id }
          trigger:
            - call: "POST /api/v1/disaster-relief-operations"
              payload: { incident_code: "DR-9101", incident_type: "WILDFIRE", declared_at: "2026-09-05T00:00:00Z", region_id: "${reg_gl}" }
              as: RegionalCoordinator
              captures: { err: $.data.error_id }
            - call: "POST /api/v1/disaster-relief-operations"
              payload: { incident_code: "DR-9102", incident_type: "WILDFIRE", declared_at: "2026-09-05T00:00:00Z", region_id: "${reg_gl}" }
              as: RegionalCoordinator
              captures: { op2_status: $.data.phase }
          assert:
            - "the repeated DR-9101 declaration returns 409 with error_id ERR_DUPLICATE_INCIDENT_CODE"
            - "the DR-9102 declaration succeeds in phase MOBILIZATION"

      - name: duplicate_fund_code_rejected
        claim_type: violation_to_error
        grounds:
          - "errors[ERR_DUPLICATE_FUND_CODE]"
          - "validations[priority=7]"
        distinguishing_aspect: "Creating a second pool with the same fund_code is rejected, so donor receipts cannot be split across two pools that share a code."
        test_recipe:
          setup: ["region GL and one fund pool DR-9101-GEN"]
          setup_api_calls:
            - call: "POST /api/v1/regions"
              payload: { code: "GL", name: "Great Lakes", state_codes: ["MI", "OH"], coordinator_user_id: "rc_gl", volunteer_pool_target: 40, authorized_agency_codes: ["SALVATION_ARMY"] }
              as: NationalHQAdmin
              captures: { reg_gl: $.data.id }
            - call: "POST /api/v1/fund-pools"
              payload: { fund_code: "DR-9101-GEN", restriction_type: "UNRESTRICTED", region_id: "${reg_gl}", total_received_cents: 100000 }
              as: FinanceOfficer
              captures: { pool_id: $.data.id }
          trigger:
            - call: "POST /api/v1/fund-pools"
              payload: { fund_code: "DR-9101-GEN", restriction_type: "UNRESTRICTED", region_id: "${reg_gl}", total_received_cents: 50000 }
              as: FinanceOfficer
              captures: { err: $.data.error_id }
          assert:
            - "the response is 409 with error_id == ERR_DUPLICATE_FUND_CODE"

      - name: shelter_creation_region_mismatch_rejected
        claim_type: violation_to_error
        grounds:
          - "errors[ERR_REGION_MISMATCH]"
          - "validations[priority=8]"
        distinguishing_aspect: "A shelter operation may not be activated for a site whose region differs from the operation's region, so the referential gate crosses ShelterSite and DisasterReliefOperation."
        test_recipe:
          setup: ["region GL and region NW, an APPROVED site in GL, an operation DR-9101 in NW"]
          setup_api_calls:
            - call: "POST /api/v1/regions"
              payload: { code: "GL", name: "Great Lakes", state_codes: ["MI", "OH"], coordinator_user_id: "rc_gl", volunteer_pool_target: 40, authorized_agency_codes: ["SALVATION_ARMY"] }
              as: NationalHQAdmin
              captures: { reg_gl: $.data.id }
            - call: "POST /api/v1/regions"
              payload: { code: "NW", name: "Northwest", state_codes: ["WA", "OR"], coordinator_user_id: "rc_nw", volunteer_pool_target: 25, authorized_agency_codes: ["FEMA"] }
              as: NationalHQAdmin
