              as: DepartmentManager
              as_user_id: "${dept_a}"
              captures: { dept_a_v: $.data.version }
          trigger:
            - call: "POST /bakery/ingredient-orders"
              payload: { department_id: "${dept_a}", expected_department_version: "${dept_a_v}", lines: [{ ingredient_id: "${sugar_b}", required_units: 90 }] }
              as: DepartmentManager
              as_user_id: "${dept_a}"
              captures: { e_foreign_ingredient: $.data.error_id }
            - call: "POST /bakery/ingredient-orders"
              payload: { department_id: "${dept_a}", expected_department_version: "${dept_a_v}", lines: [{ ingredient_id: "${flour_a}", required_units: 90 }] }
              as: DepartmentManager
              as_user_id: "${dept_a}"
