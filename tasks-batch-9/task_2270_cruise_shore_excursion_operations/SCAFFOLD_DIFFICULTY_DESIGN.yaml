          - endpoints[POST /shore-excursions/port-calls/{portCallId}/delays]
          - calculations.departure_timing_risk
          - state_machines.ExcursionDeparture.SELLING_to_CLOSED
          - state_machines.Booking.fulfillment_status.BOOKED_to_CANCELLED_BY_LINE
          - state_machines.Booking.financial_status.AUTHORIZED_to_VOIDED
          - entities.RefundLedgerEntry.fields.entry_kind
          - entities.PortCall.fields.effective_arrival_utc
        distinguishing_aspect: |
          Depth-3 chain triggered by a port delay rather than by an audit: the 75-minute delay pushes
          timing_risk_band_actual to RED (hop 1) -> the SELLING departure is force-CLOSED (hop 2) ->
          its never-charged BOOKED booking is CANCELLED_BY_LINE / VOIDED with a zero-amount AUTH_VOID
