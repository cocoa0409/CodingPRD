            - call: "POST /casting/talents"
              payload: { full_name: "IT3", date_of_birth: "1990-01-01T00:00:00Z", union_status: "NON_UNION" }
              as: CastingDirector
              captures: { tal_id: $.data.id }
            - call: "POST /casting/breakdowns/${br_id}/submissions"
              payload: { talent_id: "${tal_id}", expected_breakdown_version: "${br_v}" }
              as: CastingAssociate
              captures: { sub_id: $.data.id }
            - call: "POST /casting/submissions/${sub_id}/start-review"
              payload: {}
              as: CastingAssociate
            - call: "POST /casting/submissions/${sub_id}/shortlist"
              payload: {}
              as: CastingAssociate
            - call: "POST /casting/breakdowns/${br_id}/sessions"
              payload: { session_start: "2026-08-04T09:00:00Z", session_end: "2026-08-04T12:00:00Z", capacity: 4, location: "S1" }
              as: CastingAssociate
              captures: { sess_id: $.data.id }
            - call: "POST /casting/sessions/${sess_id}/appointments"
              payload: { submission_id: "${sub_id}", slot_start: "2026-08-04T09:00:00Z", slot_end: "2026-08-04T09:30:00Z" }
              as: CastingAssociate
              captures: { appt_id: $.data.id }
            - call: "GET /casting/sessions/${sess_id}"
              payload: {}
              as: CastingAssociate
              captures: { booked_before: $.data.booked_count }
            # forward: confirm
            - call: "POST /casting/appointments/${appt_id}/confirm"
              payload: {}
              as: CastingAssociate
            - call: "GET /casting/sessions/${sess_id}"
              payload: {}
              as: CastingAssociate
              captures: { booked_after_confirm: $.data.booked_count }
          trigger:
            # compensating: cancel the confirmed appointment
            - call: "POST /casting/appointments/${appt_id}/cancel"
              payload: {}
              as: CastingAssociate
            - call: "GET /casting/sessions/${sess_id}"
              payload: {}
              as: CastingAssociate
              captures: { booked_after_cancel: $.data.booked_count }
          assert:
            - "booked_before == 0"
            - "booked_after_confirm == 1 (forward confirm +1)"
            - "booked_after_cancel == 0 (compensating cancel returns gauge to booked_before; invariant: booked_count conserved)"
