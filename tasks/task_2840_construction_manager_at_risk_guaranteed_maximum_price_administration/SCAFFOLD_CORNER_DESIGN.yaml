      - name: allowance_unit_rate_holds_four_decimals_while_money_holds_two
        claim_type: precision
        grounds:
          - calculations.allowance_unit_conservation
          - global_constants.RATIO_PRECISION
          - global_constants.MONEY_PRECISION
        distinguishing_aspect: |
          An allowance of 100000.00 over 3 units divides to a non-terminating rate. The stored
          rate must be 33333.3333 - four decimals, ROUND_HALF_UP - and the money booked from it
          must be re-rounded to two decimals, so consuming all three units books exactly
          100000.00 with variance 0.00. Carrying the rate at two decimals (33333.33) books
          99999.99 and leaves a phantom one-cent variance.
        test_recipe:
          setup:
            - "empty database"
            - "logical clock at 2026-08-01T00:00:00Z"
          setup_api_calls:
            - call: "POST /projects"
