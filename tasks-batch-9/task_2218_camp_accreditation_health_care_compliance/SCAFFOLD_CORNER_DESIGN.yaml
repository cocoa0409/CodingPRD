              as_user_id: "officer-1"
          assert:
            - "the 2025 report was LATE at submission (clock 2026-08-01 is past the 2026-03-01 due date) and then ACCEPTED"
            - "trigger call: 201 with IncidentDisclosure.${disc_late_id}.status == LATE_DISCLOSED, severity_weight == 12, state_notification_required == true, disclosed_at == 2026-08-01T00:00:00Z"
            - "AnnualReport.${report_2025_id}.status == REOPENED with reopen_count == 1 and disclosed_incident_count == 1"
            - "IncidentDisclosure.${disc_injury_id}.status == REPORTED with severity_weight == 8 and state_notification_required == false"
            - "IncidentDisclosure.${disc_med_id}.severity_weight == 4 and state_notification_required == false"
            - "IncidentDisclosure.${disc_2023_id}.severity_weight == 25 yet contributes nothing - occurred_at year 2023 is below the 2024 window floor"
            - "risk-index read: incident_component == 30.00 (8.00 + 4.00 + 18.00), program_component == 0, staffing_gap_penalty == 0, license_penalty == 0, compliance_component == 0, population_multiplier == 1.0"
            - "risk_index == 40.00 with risk_index_variant == PRE_VISIT - no cycle exists, so the compliance component is zero by the pre_visit rule"

