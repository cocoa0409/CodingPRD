            - call: "POST /backup-provider/retention-change-requests/${rcr_c_id}/apply"
              payload: {}
              as: RetentionOfficer
              captures: { applied_state: $.data.state }
            - call: "GET /backup-provider/backup-groups/${grp_p_id}"
              payload: {}
              as: RetentionOfficer
              captures: { grp_ret_after: $.data.group_retention_days }
          assert:
            - "cooling_off_until_utc == 2026-09-08T00:00:00Z (7 days after the 2026-09-01 submission)"
            - "the apply at 2026-09-07T23:59:59Z returns 422 and its error_id == ERR_COOLING_OFF_ACTIVE"
            - "${grp_ret_before} == 45 (the group is unchanged by the refused apply)"
            - "the apply at 2026-09-08T00:00:00Z succeeds and ${applied_state} == APPLIED"
            - "${grp_ret_after} == 120"

