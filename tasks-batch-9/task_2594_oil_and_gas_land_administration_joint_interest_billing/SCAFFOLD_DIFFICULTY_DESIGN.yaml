            - "Costs CAPITAL 1000005 and OPERATING 100003 in June 2026, and statement JIB-2026-06 issued by user u-jib-1 for 1153008 cents"
            - "OB files a BILLING_DISPUTE for 100000 cents and the operator answers it, so it sits in OPERATOR_RESPONDED; OA separately files an AUDIT_EXCEPTION for 50000 cents that stays OPEN"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-07-10T00:00:00Z" }
