      - name: mission_blocked_to_en_route_closes_the_cycle
        claim_type: cyclic
        grounds:
          - "state_machines.DeliveryMission.BLOCKED_to_EN_ROUTE"
          - "state_machines.DeliveryMission.EN_ROUTE_to_BLOCKED"
        excluded_because:
          difficulty_instance: mission_reroute_cycle_returns_to_en_route
          rationale: "that instance already walks EN_ROUTE -> BLOCKED -> EN_ROUTE twice and asserts the path-dependent accumulators, which is the whole cyclic claim for this machine."
      - name: robot_duty_and_health_dimensions_are_independent
        claim_type: parallel
        grounds:
          - "state_machines.Robot"
          - "entities.Robot.fields.duty_state"
          - "entities.Robot.fields.health_state"
        excluded_because:
          difficulty_instance: robot_parallel_dimensions_move_independently
          rationale: "that instance drives one dimension while pinning the other and asserts the one crossing rule between them, so a corner test would be a copy of it."
      - name: hard_closure_activation_blocks_the_segment_and_its_dependents
        claim_type: cascade_down
        grounds:
          - "state_machines.SidewalkSegment.APPROVED_to_BLOCKED"
          - "state_machines.RoutePlan.ACTIVE_to_SUPERSEDED"
          - "state_machines.DeliveryMission.EN_ROUTE_to_BLOCKED"
        excluded_because:
          difficulty_instance: hard_closure_activation_cascades_five_levels
          rationale: "the five-link cascade instance asserts every level of this chain plus the ADVISORY counter-case, which subsumes any single-level side-effect check."
      - name: telemetry_tamper_quarantine_reaches_the_incident_ledger
        claim_type: conditional_cascade
        grounds:
          - "state_machines.Robot.NOMINAL_to_QUARANTINED"
          - "state_machines.Robot.ON_MISSION_to_MAINTENANCE"
          - "calculations.exception_reason_mapping"
        excluded_because:
          difficulty_instance: tamper_telemetry_quarantine_cascades_four_levels
          rationale: "that instance already contrasts the tamper branch with the non-tamper branch of ABORT_REASON_MAP and asserts the filed IncidentReport and the zone counter."
      - name: incident_insurer_leg_is_required_before_close
        claim_type: precondition_enforcement
        grounds:
          - "state_machines.IncidentReport.SUBMITTED_MUNICIPAL_to_INSURER_NOTIFIED"
          - "state_machines.IncidentReport.SUBMITTED_MUNICIPAL_to_CLOSED"
          - "entities.IncidentReport.fields.insurer_notification_required"
        excluded_because:
          difficulty_instance: incident_branch_join_requires_insurer_leg
          rationale: "that instance drives both branches of the incident diamond and asserts the CLOSE guard on insurer_notification_required, which is exactly this claim."
      - name: mandatory_takeover_cannot_be_released_from_requested
        claim_type: guarded_transitions
        grounds:
          - "state_machines.InterventionEvent.REQUESTED_to_RELEASED"
          - "calculations.takeover_mandatory"
          - "errors.ERR_TAKEOVER_REQUIRED"
        excluded_because:
          difficulty_instance: takeover_threshold_inclusive_at_35_exclusive_at_36
          rationale: "that instance already contrasts a mandatory and a non-mandatory event at the threshold boundary and asserts the ERR_TAKEOVER_REQUIRED refusal of the RELEASE."
