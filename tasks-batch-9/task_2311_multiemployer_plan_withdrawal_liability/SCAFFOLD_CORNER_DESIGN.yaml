  - section: endpoints
    instances:

      - name: patching_an_employers_covered_work_status_bumps_the_optimistic_concurrency_token
        claim_type: Standard CRUD
        grounds:
          - "endpoints[PATCH /employers/{employer_id}]"
          - "entities.Employer.fields.covered_work_status"
          - "concurrency_rules.contribution-record-stale-employer"
        distinguishing_aspect: |
          PATCH is the only endpoint that mutates an Employer directly, and its version bump
          is what invalidates an in-flight contribution filing. The probe also pins the
          partial-update semantics: omitted keys must be left alone rather than reset to
          their declared defaults, which matters because cba_count defaults to 1 and a
          reset would silently make a three-agreement employer look like a
          single-agreement one.
        test_recipe:
          setup:
            - "One employer registered with covered_work_status PERFORMING, cba_count 3 and no directly attributed figures."
          setup_api_calls:
            - call: "POST /plans"
              payload: { name: "Ironworkers District Pension Fund", industry: "GENERAL", allocation_method: "MODIFIED_PRESUMPTIVE", de_minimis_variant: "STATUTORY", interest_rate_bps: 700, mass_withdrawal_declared: false }
              as: FundAdministrator
              as_user_id: "fa-001"
              captures: { plan_id: "$.data.id" }
            - call: "POST /controlled-groups"
              payload: { name: "Meridian Holdings Group", common_control_basis: "PARENT_SUBSIDIARY" }
              as: FundAdministrator
              as_user_id: "fa-001"
              captures: { cg_id: "$.data.id" }
            - call: "POST /employers"
              payload: { plan_id: "${plan_id}", controlled_group_id: "${cg_id}", legal_name: "Meridian Steel Erectors LLC", ein: "410000101", obligation_start_year: 2021, covered_work_status: "PERFORMING", cba_count: 3 }
              as: FundAdministrator
              as_user_id: "fa-001"
              captures: { emp_id: "$.data.id", emp_v1: "$.data.version" }
          trigger:
            - call: "PATCH /employers/${emp_id}"
              payload: { covered_work_status: "CEASED" }
              as: FundAdministrator
              as_user_id: "fa-001"
              captures: { emp_v2: "$.data.version" }
            - call: "PATCH /employers/${emp_id}"
              payload: { directly_attributed_vested_benefits_cents: 500000000 }
              as: FundAdministrator
              as_user_id: "fa-001"
              captures: { emp_v3: "$.data.version" }
          assert:
            - "First patch: HTTP 200 with data.covered_work_status == \"CEASED\", emp_v2 == 2, and data.cba_count still 3 with data.directly_attributed_vested_benefits_cents still 0."
            - "Second patch: HTTP 200 with emp_v3 == 3, data.directly_attributed_vested_benefits_cents == 500000000 and data.covered_work_status still \"CEASED\"."
            - "Neither patch changes data.status (\"CONTRIBUTING\"), data.outstanding_liability_cents (0) or data.obligation_start_year (2021)."
            - "A contribution record filed with expected_employer_version ${emp_v1} now returns HTTP 412 with data.error_id == \"ERR_STALE_EMPLOYER_VERSION\"."

      - name: a_collection_sweep_reports_per_category_counts_and_skips_paid_installments
        claim_type: Bulk action
        grounds:
          - "endpoints[POST /collection-sweeps]"
          - "response_envelope.data"
          - "calculations.collection_status_projection"
        distinguishing_aspect: |
          The sweep is the only bulk endpoint and its six counters are the only observable
          proof of what it touched. The second sweep is the interesting one: installment 1
          is long past its delinquent_on instant but has been PAID, so it must not be
          counted as newly delinquent, while the assessment does finalize because the
          review deadline lapsed with review_status NONE. A server that ages installments
          by date alone reports installments_marked_delinquent 1 here.
        test_recipe:
          setup:
            - "The small fixture: a net assessment of 5000000 with an annual payment of 100000000, issued at 2026-08-01, producing four installments of 1250000 due 2026-09-30, 2026-12-30, 2027-03-30 and 2027-06-30, with review_deadline_at 2026-10-30."
