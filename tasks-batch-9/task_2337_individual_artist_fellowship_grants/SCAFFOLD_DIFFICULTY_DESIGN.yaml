      - name: residency_duration_at_the_exact_month_anniversary_boundary
        grounds:
          - calculations.residency_months_at_deadline
          - validations[error_id=ERR_ELIGIBILITY_CRITERIA_NOT_MET]
          - validations[error_id=ERR_INELIGIBILITY_REASON_UNSUPPORTED]
        distinguishing_aspect: |
          Two artists whose residency_start_date differs by a single day straddle
          residency_min_months = 24 against the 2026-10-15 deadline: 2024-10-15 reaches its
          day-of-month anniversary and counts 24 months (eligible), while 2024-10-16 has not
          and counts 23 (ineligible). The month count is calendar arithmetic with an
          anniversary rule, not a 30-day division, so a day-difference implementation yields 24
          for both.
        test_recipe:
          setup:
            - "CycleMain OPEN; two artists submit LITERARY_ARTS applications before the deadline"
            - "artB residency_start_date 2024-10-15 (anniversary reached); artC residency_start_date 2024-10-16 (one day short)"
