      - name: assessor_suspension_recuses_team_then_returns_application_to_submitted
        depth: 3
        grounds:
          - state_machines.Assessor.qualification_status.QUALIFIED_to_SUSPENDED
          - state_machines.TeamAssignment.CONFIRMED_to_RECUSED
          - state_machines.AccreditationApplication.TEAM_ASSIGNED_to_SUBMITTED
        distinguishing_aspect: |
          A different trigger (the SchemeManager suspending an assessor) driving a different chain of
          entities: (1) the Assessor moves QUALIFIED -> SUSPENDED; (2) because that assessor was
          suspended, the CONFIRMED TeamAssignment moves to RECUSED with recusal_reason 'assessor
          suspended'; (3) because that recusal removed the application's last CONFIRMED
          LEAD_ASSESSOR, the AccreditationApplication moves TEAM_ASSIGNED -> SUBMITTED. The
          organization must stay UNDER_ASSESSMENT, proving hop 3 does not itself cascade further.
        test_recipe:
          setup:
            - "Clock 2026-08-10; one PUBLISHED scheme."
            - "One INTERNAL assessor with a GRANTED LEAD_ASSESSOR qualification who has been screened, so qualification_status is QUALIFIED."
            - "One organization with an INITIAL cycle whose sole TeamAssignment is that assessor as LEAD_ASSESSOR and is CONFIRMED, so the application is TEAM_ASSIGNED and the organization is UNDER_ASSESSMENT."
            - "No AssessmentPlan has been approved, so the application is still TEAM_ASSIGNED rather than PLANNED."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-10T00:00:00Z" }
              as: SchemeManager
            - call: "POST /accreditation/schemes"
              payload: { program_code: "ISO17025-SUS", name: "Calibration laboratories", standard_ref: "ISO_IEC_17025", complexity_multiplier: 1.0725, witness_min_count: 2, qualification_points_required: 60.0, surveillance_interval_days: 365, reassessment_interval_days: 1460, critical_nc_close_days: 30, major_nc_close_days: 60, minor_nc_close_days: 90, unannounced_authority: true, remote_assessment_allowed: true }
              as: SchemeManager
              captures: { scheme_id: $.data.id }
            - call: "POST /accreditation/schemes/${scheme_id}/status"
              payload: { to_status: "UNDER_REVIEW" }
              as: SchemeManager
            - call: "POST /accreditation/schemes/${scheme_id}/status"
              payload: { to_status: "PUBLISHED" }
              as: SchemeManager
            - call: "POST /accreditation/assessors"
              payload: { full_name: "Lena Ahlgren", email: "lena.ahlgren@ab.test", employment_type: "INTERNAL", annual_witness_capacity_days: 20 }
              as: AssessmentManager
              captures: { lead_id: $.data.id }
            - call: "POST /accreditation/assessors/${lead_id}/qualifications"
              payload: { scheme_id: "${scheme_id}", role_type: "LEAD_ASSESSOR", years_experience: 8, declared_witness_days: 6, declared_training_modules: 3, last_witness_on: "2026-05-10" }
              as: AssessmentManager
              captures: { lead_q_id: $.data.id }
            - call: "POST /accreditation/qualifications/${lead_q_id}/verify-evidence"
              payload: { verified_years_experience: 8, verified_witness_days: 5, verified_training_modules: 2 }
              as: SchemeManager
            - call: "POST /accreditation/assessors/${lead_id}/screen"
              payload: {}
              as: SchemeManager
            - call: "POST /accreditation/organizations"
              payload: { legal_name: "Acme Calibration GmbH", country_code: "DE", contact_email: "qa@acme.test" }
              as: AssessmentManager
              captures: { org_id: $.data.id }
            - call: "POST /accreditation/applications"
              payload: { organization_id: "${org_id}", scheme_id: "${scheme_id}", cycle_type: "INITIAL", requested_scope_lines: ["Mass 1kg-20kg", "Temperature -20C-200C", "Pressure 0-10MPa"], notice_days: 30 }
              as: AssessmentManager
              captures: { app_id: $.data.id }
            - call: "POST /accreditation/applications/${app_id}/team-assignments"
              payload: { assessor_id: "${lead_id}", role_type: "LEAD_ASSESSOR" }
