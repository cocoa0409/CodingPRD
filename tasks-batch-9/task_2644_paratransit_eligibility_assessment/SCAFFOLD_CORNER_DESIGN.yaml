              captures: { void_id: "$.data[0].id" }
          assert:
            - "${pts0} == 4 and no proceeding exists before the trigger (4 points is below the 6-point auto-proposal threshold)"
            - "${v1} == ${v0} + 1 and ${pts1} == 4 with ${sched1} == 3 — the COMPLETED event changed the denominator but not the points, and still bumped the version"
            - "the proposal carrying ${v0} returns HTTP 412 with data.error_id == \"ERR_STALE_APPLICANT_VERSION\""
            - "the proposal carrying ${v1} returns HTTP 201 with ${proc_1_origin} == \"MANUAL\" and ${proc_1_points} == 4"
            - "${consumed_err} == \"ERR_STALE_APPLICANT_VERSION\" — the successful proposal consumed that version (${v2} == ${v1} + 1)"
            - "the second proposal returns HTTP 201 with ${proc_2_status} == \"PROPOSED\", and the VOID filter returns total_count == 1 with ${void_id} == ${proc_1}"
            - "GET /applicants/${rider_id}/suspension-proceedings returns total_count == 2 overall — the two 412s created nothing"

