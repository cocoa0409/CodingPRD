              captures: { sp3_id: $.data.id }
          trigger:
            - call: "POST /site-utility/trench-safety-plans/${sp1_id}/submit"
              payload: {}
              as: Foreman
              captures: { err1: $.data.error_id }
            - call: "POST /site-utility/trench-safety-plans/${sp2_id}/submit"
              payload: {}
              as: Foreman
              captures: { err2: $.data.error_id }
            - call: "POST /site-utility/trench-safety-plans/${sp3_id}/submit"
              payload: {}
