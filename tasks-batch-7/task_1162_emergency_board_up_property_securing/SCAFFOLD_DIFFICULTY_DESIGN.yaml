            - "Subcontractor[${sc}].reliability_score_strict == 0.5 (2/(2+1+1))"
            - "Job[${jd}].work_status == INTAKE (re-offer pool empty after sc excluded)"

  # ---------------------------------------------------------------------------
  # Rule 2 — combinatorial_formula (three different modes)
  # ---------------------------------------------------------------------------
  - rule_id: combinatorial_formula
    instances:
      - name: board_material_quantity_branching
        grounds:
          - calculations.scope_planned_quantity
          - entities.ScopeItem.fields.planned_qty
        distinguishing_aspect: |
          Mode (a): >=3 inputs with non-linear interaction — opening_count, width_in,
          height_in, door_count and the parent property's wind_zone feed ceil division plus
          two conditional branches (+1 framing sheet per door, x2 in HIGH wind), yielding
          exactly 6 sheets where any single-branch omission gives a different integer.
        test_recipe:
          setup:
            - "Market SEA; property pr in wind_zone HIGH; job j P3 still in INTAKE (scope addable before dispatch)"
          setup_api_calls:
            - call: "POST /markets"
              payload: { name: "Seattle", code: "SEA", sla_minutes_p1: 120, sla_minutes_p2: 480, sla_minutes_p3: 1440, permit_required: true, notification_required: true, notification_deadline_hours: 24, late_notification_fee_cents: 15000, board_rate_per_sheet_cents: 4500, tarp_rate_per_sqft_cents: 85, fence_rate_per_linear_ft_cents: 1200, patrol_visit_fee_cents: 7499, temp_power_daily_rate_cents: 18000, temp_lighting_daily_rate_cents: 9000, generator_pool_units: 2, removal_flat_fee_cents: 25000 }
              as: PlatformAdmin
              captures: { m1: $.data.id }
            - call: "POST /customers"
              payload: { full_name: "Otto Owner", email: "otto@x.com", kind: "OWNER" }
              as: PlatformAdmin
              captures: { cu: $.data.id }
            - call: "POST /properties"
              payload: { customer_id: "${cu}", market_id: "${m1}", address_line: "9 Gale Rd", wind_zone: "HIGH" }
              as: PlatformAdmin
              captures: { pr: $.data.id }
            - call: "POST /jobs"
              payload: { property_id: "${pr}", incident_type: "STORM", priority: "P3" }
              as: Dispatcher
              captures: { j: $.data.id, jv1: $.data.version }
          trigger:
            - call: "POST /jobs/${j}/scope-items"
              payload: { kind: "BOARD", opening_count: 3, width_in: 72, height_in: 36, door_count: 1, expected_job_version: "${jv1}" }
              as: Dispatcher
              captures: { si: $.data.id, qty: $.data.planned_qty }
          assert:
            - "ScopeItem[${si}].planned_qty == 6 (ceil(3*72*36/144/32)=2 base, +1 door framing = 3, HIGH wind x2 = 6)"
            - "ScopeItem[${si}].unit == SHEETS"
            - "ScopeItem[${si}].status == PLANNED"

      - name: patrol_fee_per_visit_rounding_order
        grounds:
          - calculations.patrol_fee_total
          - entities.PatrolVisit.fields.fee_cents
        distinguishing_aspect: |
          Mode (b): nested rounding where the order matters — fee rounds per visit
          (round_half_up(7499 * 1.25) = 9374) and the invoice sums rounded visits
          (3 x 9374 = 28122); the sum-then-round order yields 28121, so the pinned order
          is falsifiable by a single cent.
        test_recipe:
          setup:
