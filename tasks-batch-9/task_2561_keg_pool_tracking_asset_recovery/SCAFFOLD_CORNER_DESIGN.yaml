            - call: "POST /float-agreements"
              payload: { brewer_id: "${b1_id}", pool_id: "${p1_id}", float_size_kegs: 1, per_fill_rate_cents: 2200 }
              as: PoolOperator
              as_user_id: "op-1"
              captures: { fa1_id: "$.data.id" }
            - call: "POST /float-agreements/${fa1_id}/activate"
              payload: { effective_date: "2026-08-01" }
              as: PoolOperator
              as_user_id: "op-1"
              captures: { fa1_v: "$.data.version" }
            - call: "POST /issuance-orders"
              payload: { agreement_id: "${fa1_id}", requested_keg_count: 1 }
              as: PoolOperator
              as_user_id: "op-1"
              captures: { o1_id: "$.data.id" }
            - call: "POST /pools/${p1_id}/kegs"
              payload: { asset_tag: "Q-0001", initial_custody_state: "QUARANTINED" }
