    output: ProficiencyTest
    side_effects: ["status ASSIGNED -> SUBMITTED, submitted_at_utc stamped", "late_submission set to true when submitted_at_utc > due_utc", "requires X-User-ID == analyst_id", "increments ProficiencyTest.version by 1"]
  - method: POST
    path: "/lab/proficiency-tests/{proficiency_test_id}/score"
    description: "Quality records the grader's score; the graded result drives the whole qualification cascade"
    roles: [QualityManager]
    code: 200
    input: [score_pct]
    output: ProficiencyTest
    side_effects: ["status SUBMITTED -> SCORED (terminal), scored_at_utc stamped, result computed per calculations.proficiency_test_grading", "PASS resets consecutive_pt_failures to 0 and may return a PROBATION analyst to QUALIFIED", "INCONCLUSIVE opens a PT_INCONCLUSIVE Nonconformance of severity MINOR and leaves consecutive_pt_failures unchanged", "FAIL increments consecutive_pt_failures, opens a PT_FAILURE Nonconformance of severity MAJOR, and drives QUALIFIED -> PROBATION, PROBATION -> SUSPENDED at PT_SUSPENSION_THRESHOLD or SUSPENDED -> DECERTIFIED on a further failure, releasing assignments and requeueing their requests", "increments ProficiencyTest.version by 1"]
  - method: POST
    path: "/lab/nonconformances"
    description: "Open a quality finding from an internal QA review or an accreditation audit"
    roles: [QualityManager]
    code: 201
    input: [source, severity, description, "examination_request_id?", "analyst_id?"]
    output: Nonconformance
    side_effects: ["status OPEN, opened_at_utc stamped, due_utc set to opened_at_utc + CAPA_SLA_DAYS[severity], capa_rejection_count 0", "a severity of MAJOR or CRITICAL carrying an analyst_id moves that analyst QUALIFIED -> PROBATION and runs PROBATION_RELEASE"]
  - method: POST
    path: "/lab/nonconformances/{nonconformance_id}/root-cause"
    description: "Submit the root-cause classification and corrective-action plan for an open finding"
    roles: [CaseManager]
    code: 200
    input: [root_cause_category, corrective_action_plan]
    output: Nonconformance
    side_effects: ["status OPEN -> ROOT_CAUSE_SUBMITTED, root_cause_category and corrective_action_plan stored", "due_utc is unchanged", "increments Nonconformance.version by 1"]
  - method: POST
    path: "/lab/nonconformances/{nonconformance_id}/capa-decision"
    description: "Approve the corrective-action plan or reject it back to the owner; repeated rejection escalates severity"
    roles: [QualityManager]
    code: 200
    input: [decision, rationale]
    output: Nonconformance
    side_effects: ["decision APPROVE: status ROOT_CAUSE_SUBMITTED -> CAPA_APPROVED", "decision REJECT: status ROOT_CAUSE_SUBMITTED -> OPEN, capa_rejection_count incremented, root_cause_category and corrective_action_plan cleared", "at CAPA_ESCALATION_THRESHOLD rejections the severity escalates one tier and due_utc is recomputed from the original opened_at_utc per calculations.capa_due_and_escalation", "increments Nonconformance.version by 1"]
  - method: POST
    path: "/lab/nonconformances/{nonconformance_id}/verify-close"
    description: "Verify effectiveness and close an approved corrective action"
    roles: [QualityManager]
    code: 200
    input: ["closure_note?"]
    output: Nonconformance
    side_effects: ["status CAPA_APPROVED -> CLOSED (terminal), closed_at_utc stamped and overdue recomputed to false", "an implicated PROBATION analyst returns to QUALIFIED once no other finding attributed to them is OPEN, ROOT_CAUSE_SUBMITTED or CAPA_APPROVED", "increments Nonconformance.version by 1"]

