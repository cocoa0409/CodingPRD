              as: MembershipDesk
            - call: "POST /wcd/complaints"
              payload: { member_id: "${m2}", item_id: "${item_id}", category: "SAFETY" }
              as: MembershipDesk
            - call: "POST /wcd/appointments"
              payload: { depot_id: "${depot_id}", vendor_id: "${vendor_id}", delivery_date: "2026-09-02", start_time: "09:00", end_time: "09:30", pallet_count: 2 }
              as: VendorRep
