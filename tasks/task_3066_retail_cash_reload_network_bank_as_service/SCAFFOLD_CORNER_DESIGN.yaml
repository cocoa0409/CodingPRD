            - "AmlAlert.${alert_id}.alert_status is still UNDER_REVIEW and is the blocker"
            - "the account field the request targets is unchanged, proving the guard is a cross-entity check"

      - name: auth_precedes_existence_on_protected_write
        claim_type: Priority Ordering
        grounds:
          - validations[priority=1]
          - validations[priority=3]
          - errors[ERR_UNAUTHENTICATED]
        distinguishing_aspect: "A request that is both unauthenticated and addressed to a non-existent program returns ERR_UNAUTHENTICATED (401) rather than ERR_ENTITY_NOT_FOUND (404), pinning auth above existence."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Empty database."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "GET /v1/programs/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: NotARole
              captures: { err: $.data.error_id }
          assert:
            - "the response status is 401 and error_id == ERR_UNAUTHENTICATED"
            - "the 404 that the unknown id would produce never surfaces, because authentication is checked first"
            - "response_type is error and the body carries error_id and message only"

