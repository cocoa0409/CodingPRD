        grounds:
          - state_machines.SubsidyPeriod.OPEN_to_CLOSED
          - state_machines.BusinessLine.LAUNCHED_to_SUSPENDED
          - state_machines.WorkShift.SCHEDULED_to_CANCELLED
          - state_machines.ShiftAssignment.ASSIGNED_to_RELEASED
          - calculations.subsidy_draw
        distinguishing_aspect: |
          Depth-5 cascade triggered by POST /subsidy-periods/{id}/close: hop 1 writes subsidy_draw_cents
          2285, which alone causes hop 2 (cumulative_subsidy_cents 2285), which alone causes hop 3
          (LAUNCHED -> SUSPENDED because 2285 > subsidy_cap_cents 2000), which alone causes hop 4
          (future WorkShift -> CANCELLED), which alone causes hop 5 (ShiftAssignment -> RELEASED with
          released_reason SHIFT_CANCELLED and the participant's week hours recomputed to 0.000).
        test_recipe:
          setup:
            - "Launched line with subsidy_cap_cents 2000 (deliberately tiny) and OPEN period 2026-09-01..2026-09-30, supervisor_hours 40.0."
