      - name: hardware_fulfilment_is_blocked_by_an_overdue_insulation_tester
        claim_type: conditional_validation
        grounds:
          - validations[priority=44]
          - entities.ServiceCenter.fields.insulation_tester_cal_due_at
          - errors[ERR_INSULATION_TESTER_OVERDUE]
        distinguishing_aspect: |
          The tooling gate is a strict inequality against the logical clock: a center whose
          calibration fell due on 2026-07-01 cannot execute a MODULE_REPLACEMENT at the 2026-08-01
          clock even though it is ACTIVE, L3, has a valid technician and a free bay. The claim stays
          APPROVED_MODULE with no bay window recorded and the modules stay FAULTED.
        test_recipe:
          setup:
            - "One program, one center whose insulation_tester_cal_due_at is 2026-07-01T00:00:00Z, one technician, one vehicle with a pack and three valid snapshots."
            - "The claim is adjudicated APPROVED_MODULE."
