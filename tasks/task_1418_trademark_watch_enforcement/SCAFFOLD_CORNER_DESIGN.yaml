# =============================================================================
# §1.9 Scaffold Corner Design — Trademark Watch & Enforcement
# Breadth probe: every testable claim of §1.1–§1.7 not already covered by §1.8.
# =============================================================================

scaffold_corner_design:
  # ---------------------------------------------------------------------------
  # Section: entities
  # ---------------------------------------------------------------------------
  - section: entities
    instances:
      - name: create_client_applies_computed_defaults
        claim_type: creation
        grounds: [entities.Client]
        distinguishing_aspect: "A minimal client create returns 201 with all computed fields initialized and a bare-UUID id."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /brand/clients"
              payload: { name: "Acme Brands", industry: "consumer goods", enforcement_budget_cents: 500000 }
              as: PlatformAdmin
              captures: { client_id: $.data.id }
          assert:
            - "Client.${client_id}.budget_spent_cents == 0"
            - "Client.${client_id}.budget_remaining_cents == 500000"
            - "Client.${client_id}.exposure_index == 0 and watch_posture == STANDARD"
            - "Client.${client_id}.version == 1 and id is a UUID with no type prefix"
            - "Response envelope: meta.api_request_id present, response_type == 'object'"

      - name: create_client_missing_required_field_returns_validation
        claim_type: required_fields
        grounds: [entities.Client, "errors[ERR_VALIDATION]"]
        distinguishing_aspect: "Omitting required enforcement_budget_cents is rejected with ERR_VALIDATION (400)."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /brand/clients"
              payload: { name: "No Budget Co", industry: "toys" }
              as: PlatformAdmin
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_VALIDATION and http status == 400"

      - name: get_record_not_found_returns_404
        claim_type: not_found
        grounds: [entities.TrademarkRecord, "errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "GET on a well-formed but nonexistent record id returns ERR_NOT_FOUND (404)."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "GET /brand/trademark-records/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2"
              as: Paralegal
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_NOT_FOUND and http status == 404"

      - name: create_record_with_computed_status_input_rejected
        claim_type: computed_fields
        grounds: [entities.TrademarkRecord, "errors[ERR_VALIDATION]"]
        distinguishing_aspect: "Passing the system/computed field status in the create body is rejected as an unknown field (ERR_VALIDATION); the server initializes status to APPLICATION_PENDING."
        test_recipe:
          setup: ["Client exists"]
          setup_api_calls:
            - call: "POST /brand/clients"
              payload: { name: "Acme Brands", industry: "consumer goods", enforcement_budget_cents: 500000 }
              as: PlatformAdmin
              captures: { client_id: $.data.id }
          trigger:
            - call: "POST /brand/trademark-records"
              payload: { client_id: "${client_id}", mark_text: "ACME", mark_type: WORD, jurisdiction: "US", nice_classes: [9], application_number: "US-909", status: REGISTERED }
              as: Paralegal
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_VALIDATION (status is not an accepted input field)"

      - name: alert_list_pagination_defaults_and_envelope
        claim_type: listing
        grounds: [entities.WatchAlert, response_envelope]
        distinguishing_aspect: "With 12 alerts, the default page returns exactly 10 items with total_count 12 and has_more true; offset 10 returns 2 items with has_more false."
        test_recipe:
          setup: ["Client, PUBLISHED record, 12 alerts created"]
          setup_api_calls:
            - call: "POST /brand/clients"
              payload: { name: "Acme Brands", industry: "consumer goods", enforcement_budget_cents: 500000 }
              as: PlatformAdmin
              captures: { client_id: $.data.id }
            - call: "POST /brand/trademark-records"
              payload: { client_id: "${client_id}", mark_text: "ACME", mark_type: WORD, jurisdiction: "US", nice_classes: [9], application_number: "US-909" }
              as: Paralegal
              captures: { rec_id: $.data.id }
            - call: "POST /brand/trademark-records/${rec_id}/publish"
              payload: { publication_date: "2026-08-03T00:00:00Z" }
              as: Paralegal
            - call: "POST /brand/watch-alerts"
              payload: { trademark_record_id: "${rec_id}", source: WATCH_SERVICE, conflicting_mark_text: "M01", conflicting_owner: "O1", conflicting_classes: [9], similarity_mark: 10, similarity_goods: 10, similarity_channels: 10 }
              as: WatchService
            - call: "POST /brand/watch-alerts"
              payload: { trademark_record_id: "${rec_id}", source: WATCH_SERVICE, conflicting_mark_text: "M02", conflicting_owner: "O2", conflicting_classes: [9], similarity_mark: 10, similarity_goods: 10, similarity_channels: 10 }
              as: WatchService
            - call: "POST /brand/watch-alerts"
              payload: { trademark_record_id: "${rec_id}", source: WATCH_SERVICE, conflicting_mark_text: "M03", conflicting_owner: "O3", conflicting_classes: [9], similarity_mark: 10, similarity_goods: 10, similarity_channels: 10 }
              as: WatchService
            - call: "POST /brand/watch-alerts"
              payload: { trademark_record_id: "${rec_id}", source: WATCH_SERVICE, conflicting_mark_text: "M04", conflicting_owner: "O4", conflicting_classes: [9], similarity_mark: 10, similarity_goods: 10, similarity_channels: 10 }
              as: WatchService
            - call: "POST /brand/watch-alerts"
              payload: { trademark_record_id: "${rec_id}", source: WATCH_SERVICE, conflicting_mark_text: "M05", conflicting_owner: "O5", conflicting_classes: [9], similarity_mark: 10, similarity_goods: 10, similarity_channels: 10 }
              as: WatchService
            - call: "POST /brand/watch-alerts"
              payload: { trademark_record_id: "${rec_id}", source: WATCH_SERVICE, conflicting_mark_text: "M06", conflicting_owner: "O6", conflicting_classes: [9], similarity_mark: 10, similarity_goods: 10, similarity_channels: 10 }
              as: WatchService
            - call: "POST /brand/watch-alerts"
              payload: { trademark_record_id: "${rec_id}", source: WATCH_SERVICE, conflicting_mark_text: "M07", conflicting_owner: "O7", conflicting_classes: [9], similarity_mark: 10, similarity_goods: 10, similarity_channels: 10 }
              as: WatchService
            - call: "POST /brand/watch-alerts"
              payload: { trademark_record_id: "${rec_id}", source: WATCH_SERVICE, conflicting_mark_text: "M08", conflicting_owner: "O8", conflicting_classes: [9], similarity_mark: 10, similarity_goods: 10, similarity_channels: 10 }
              as: WatchService
            - call: "POST /brand/watch-alerts"
              payload: { trademark_record_id: "${rec_id}", source: WATCH_SERVICE, conflicting_mark_text: "M09", conflicting_owner: "O9", conflicting_classes: [9], similarity_mark: 10, similarity_goods: 10, similarity_channels: 10 }
              as: WatchService
            - call: "POST /brand/watch-alerts"
              payload: { trademark_record_id: "${rec_id}", source: WATCH_SERVICE, conflicting_mark_text: "M10", conflicting_owner: "O10", conflicting_classes: [9], similarity_mark: 10, similarity_goods: 10, similarity_channels: 10 }
              as: WatchService
            - call: "POST /brand/watch-alerts"
              payload: { trademark_record_id: "${rec_id}", source: WATCH_SERVICE, conflicting_mark_text: "M11", conflicting_owner: "O11", conflicting_classes: [9], similarity_mark: 10, similarity_goods: 10, similarity_channels: 10 }
              as: WatchService
            - call: "POST /brand/watch-alerts"
              payload: { trademark_record_id: "${rec_id}", source: WATCH_SERVICE, conflicting_mark_text: "M12", conflicting_owner: "O12", conflicting_classes: [9], similarity_mark: 10, similarity_goods: 10, similarity_channels: 10 }
              as: WatchService
          trigger:
            - call: "GET /brand/watch-alerts"
              as: Paralegal
            - call: "GET /brand/watch-alerts"
              payload: { offset: 10 }
              as: Paralegal
          assert:
            - "First page: data length == 10, total_count == 12, has_more == true (default limit 10)"
            - "Second page (offset 10): data length == 2, total_count == 12, has_more == false"
            - "Both responses carry response_type == 'array' and meta.api_request_id"

      - name: evidence_item_creation_defaults
        claim_type: defaults
        grounds: [entities.UseEvidenceItem]
        distinguishing_aspect: "A created evidence item starts COLLECTED with verified_by_user_id null and version 1."
        test_recipe:
          setup: ["Client and record exist"]
          setup_api_calls:
            - call: "POST /brand/clients"
              payload: { name: "Acme Brands", industry: "consumer goods", enforcement_budget_cents: 500000 }
              as: PlatformAdmin
              captures: { client_id: $.data.id }
            - call: "POST /brand/trademark-records"
              payload: { client_id: "${client_id}", mark_text: "ACME", mark_type: WORD, jurisdiction: "US", nice_classes: [9], application_number: "US-909" }
              as: Paralegal
              captures: { rec_id: $.data.id }
          trigger:
            - call: "POST /brand/trademark-records/${rec_id}/evidence-items"
              payload: { nice_class: 9, specimen_type: LABEL, specimen_date: "2026-06-01T00:00:00Z" }
              as: Paralegal
              as_user_id: para_1
              captures: { ev_id: $.data.id }
          assert:
            - "UseEvidenceItem.${ev_id}.status == COLLECTED"
            - "UseEvidenceItem.${ev_id}.verified_by_user_id == null and collected_by_user_id == 'para_1'"
            - "UseEvidenceItem.${ev_id}.version == 1"

      - name: clearance_search_computed_fields_on_create
        claim_type: computed_fields
        grounds: [entities.ClearanceSearch]
        distinguishing_aspect: "Creating a search with one HIGH conflict hit computes unresolved_hit_count 1, risk_rating HIGH, status OPEN."
        test_recipe:
          setup: ["Client exists"]
          setup_api_calls:
            - call: "POST /brand/clients"
              payload: { name: "Acme Brands", industry: "consumer goods", enforcement_budget_cents: 500000 }
              as: PlatformAdmin
              captures: { client_id: $.data.id }
          trigger:
            - call: "POST /brand/clearance-searches"
              payload: { client_id: "${client_id}", proposed_mark: "ACMEPRO", proposed_classes: [9], conflict_hits: [{ conflicting_mark: "ACME", severity: HIGH }] }
              as: ClientContact
              as_user_id: "${client_id}"
              captures: { cs_id: $.data.id }
          assert:
            - "ClearanceSearch.${cs_id}.status == OPEN"
            - "ClearanceSearch.${cs_id}.unresolved_hit_count == 1"
            - "ClearanceSearch.${cs_id}.risk_rating == HIGH"
            - "ClearanceSearch.${cs_id}.conflict_hits[0].disposition == OPEN"

      - name: trademark_record_list_filters_isolate_client_and_status
        claim_type: listing
        grounds: [entities.TrademarkRecord]
        distinguishing_aspect: "client_id and status filters compose: ?client_id=A returns only A's records and ?status=PUBLISHED only published ones."
        test_recipe:
          setup: ["Two clients each with one record; client A's record is PUBLISHED, client B's is APPLICATION_PENDING"]
          setup_api_calls:
            - call: "POST /brand/clients"
              payload: { name: "Alpha", industry: "tech", enforcement_budget_cents: 500000 }
              as: PlatformAdmin
              captures: { client_a: $.data.id }
            - call: "POST /brand/clients"
              payload: { name: "Beta", industry: "food", enforcement_budget_cents: 500000 }
              as: PlatformAdmin
              captures: { client_b: $.data.id }
            - call: "POST /brand/trademark-records"
              payload: { client_id: "${client_a}", mark_text: "ALPHA", mark_type: WORD, jurisdiction: "US", nice_classes: [9], application_number: "US-A1" }
              as: Paralegal
              captures: { rec_a: $.data.id }
            - call: "POST /brand/trademark-records/${rec_a}/publish"
              payload: { publication_date: "2026-08-03T00:00:00Z" }
              as: Paralegal
            - call: "POST /brand/trademark-records"
              payload: { client_id: "${client_b}", mark_text: "BETA", mark_type: WORD, jurisdiction: "US", nice_classes: [30], application_number: "US-B1" }
              as: Paralegal
              captures: { rec_b: $.data.id }
          trigger:
            - call: "GET /brand/trademark-records"
              payload: { client_id: "${client_a}" }
              as: Paralegal
            - call: "GET /brand/trademark-records"
              payload: { status: PUBLISHED }
              as: Paralegal
          assert:
            - "client_id filter: total_count == 1 and the only element id == ${rec_a}"
            - "status filter: total_count == 1 and the only element id == ${rec_a} (B's record stays APPLICATION_PENDING)"

  # ---------------------------------------------------------------------------
  # Section: state_machines
  # ---------------------------------------------------------------------------
  - section: state_machines
    instances:
      - name: register_from_under_challenge_returns_invalid_state
        claim_type: invalid_transition
        grounds: [state_machines.TrademarkRecord, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "A record flipped to UNDER_CHALLENGE by an OPPOSITION escalation cannot register; register is declared only from PUBLISHED."
        test_recipe:
          setup: ["Client; record PUBLISHED 2026-07-31; alert assessed to 80.00 and escalated OPPOSITION (record now UNDER_CHALLENGE)"]
          setup_api_calls:
            - call: "POST /brand/clients"
              payload: { name: "Acme Brands", industry: "consumer goods", enforcement_budget_cents: 500000 }
              as: PlatformAdmin
              captures: { client_id: $.data.id }
            - call: "POST /brand/trademark-records"
              payload: { client_id: "${client_id}", mark_text: "ACME", mark_type: WORD, jurisdiction: "US", nice_classes: [9], application_number: "US-909" }
              as: Paralegal
              captures: { rec_id: $.data.id }
            - call: "POST /brand/trademark-records/${rec_id}/publish"
              payload: { publication_date: "2026-07-31T00:00:00Z" }
              as: Paralegal
            - call: "POST /brand/watch-alerts"
              payload: { trademark_record_id: "${rec_id}", source: WATCH_SERVICE, conflicting_mark_text: "AKME", conflicting_owner: "Rival Co", conflicting_classes: [9], similarity_mark: 80, similarity_goods: 70, similarity_channels: 60 }
              as: WatchService
              captures: { alert_id: $.data.id }
            - call: "POST /brand/watch-alerts/${alert_id}/triage"
              as: Paralegal
              captures: { av: $.data.version }
            - call: "POST /brand/watch-alerts/${alert_id}/assess"
              payload: { weight_mark: 0.6, weight_goods: 0.3, weight_channels: 0.1, fame_adjustment: 5, rationale: "strong", expected_watch_alert_version: "${av}" }
              as: AssociateAttorney
              as_user_id: assoc_1
            - call: "POST /brand/watch-alerts/${alert_id}/escalate"
              payload: { matter_type: OPPOSITION }
              as: AssociateAttorney
              as_user_id: assoc_1
              captures: { matter_id: $.data.id }
          trigger:
            - call: "POST /brand/trademark-records/${rec_id}/register"
              payload: { registration_date: "2026-08-10T00:00:00Z" }
              as: Paralegal
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_STATE (record is UNDER_CHALLENGE, not PUBLISHED)"
            - "TrademarkRecord.${rec_id}.status still == UNDER_CHALLENGE"

      - name: resolve_favorable_restores_published_then_register_succeeds
        claim_type: side_effect_execution
        grounds: [state_machines.EnforcementMatter.ACTIVE_to_RESOLVED, state_machines.TrademarkRecord.UNDER_CHALLENGE_to_PUBLISHED]
        distinguishing_aspect: "Resolving an OPPOSITION matter FAVORABLE cascades the record UNDER_CHALLENGE -> PUBLISHED, after which register succeeds and maintenance windows are computed."
        test_recipe:
          setup: ["Same as register_from_under_challenge: opposition matter ACTIVE, record UNDER_CHALLENGE"]
          setup_api_calls:
            - call: "POST /brand/clients"
              payload: { name: "Acme Brands", industry: "consumer goods", enforcement_budget_cents: 500000 }
              as: PlatformAdmin
              captures: { client_id: $.data.id }
            - call: "POST /brand/trademark-records"
              payload: { client_id: "${client_id}", mark_text: "ACME", mark_type: WORD, jurisdiction: "US", nice_classes: [9], application_number: "US-909" }
              as: Paralegal
              captures: { rec_id: $.data.id }
            - call: "POST /brand/trademark-records/${rec_id}/publish"
              payload: { publication_date: "2026-07-31T00:00:00Z" }
              as: Paralegal
            - call: "POST /brand/watch-alerts"
              payload: { trademark_record_id: "${rec_id}", source: WATCH_SERVICE, conflicting_mark_text: "AKME", conflicting_owner: "Rival Co", conflicting_classes: [9], similarity_mark: 80, similarity_goods: 70, similarity_channels: 60 }
              as: WatchService
              captures: { alert_id: $.data.id }
            - call: "POST /brand/watch-alerts/${alert_id}/triage"
              as: Paralegal
              captures: { av: $.data.version }
            - call: "POST /brand/watch-alerts/${alert_id}/assess"
              payload: { weight_mark: 0.6, weight_goods: 0.3, weight_channels: 0.1, fame_adjustment: 5, rationale: "strong", expected_watch_alert_version: "${av}" }
              as: AssociateAttorney
              as_user_id: assoc_1
            - call: "POST /brand/watch-alerts/${alert_id}/escalate"
              payload: { matter_type: OPPOSITION }
              as: AssociateAttorney
              as_user_id: assoc_1
              captures: { matter_id: $.data.id }
          trigger:
            - call: "POST /brand/enforcement-matters/${matter_id}/resolve"
              payload: { outcome: FAVORABLE }
              as: PartnerAttorney
              as_user_id: partner_1
            - call: "POST /brand/trademark-records/${rec_id}/register"
              payload: { registration_date: "2026-08-10T00:00:00Z" }
              as: Paralegal
          assert:
            - "EnforcementMatter.${matter_id}.status == RESOLVED and resolution_outcome == FAVORABLE"
            - "TrademarkRecord.${rec_id}.status == PUBLISHED after the favorable resolve (cascade), then REGISTERED after register"
            - "TrademarkRecord.${rec_id}.maintenance_window_open == 2031-08-10T00:00:00Z and maintenance_window_close == 2032-08-10T00:00:00Z and maintenance_grace_close == 2033-02-10T00:00:00Z"

      - name: deadline_verify_twice_returns_invalid_state
        claim_type: invalid_transition
        grounds: [state_machines.Deadline.DOCKETED_to_PENDING, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Verifying an already-PENDING deadline is rejected with ERR_INVALID_STATE (no PENDING -> PENDING verify transition)."
        test_recipe:
          setup: ["Client, PUBLISHED record, INFRINGEMENT matter, one DOCKETED deadline verified to PENDING"]
          setup_api_calls:
            - call: "POST /brand/clients"
              payload: { name: "Acme Brands", industry: "consumer goods", enforcement_budget_cents: 500000 }
              as: PlatformAdmin
              captures: { client_id: $.data.id }
            - call: "POST /brand/trademark-records"
              payload: { client_id: "${client_id}", mark_text: "ACME", mark_type: WORD, jurisdiction: "US", nice_classes: [9], application_number: "US-909" }
              as: Paralegal
              captures: { rec_id: $.data.id }
            - call: "POST /brand/trademark-records/${rec_id}/publish"
              payload: { publication_date: "2026-08-03T00:00:00Z" }
              as: Paralegal
            - call: "POST /brand/watch-alerts"
              payload: { trademark_record_id: "${rec_id}", source: WATCH_SERVICE, conflicting_mark_text: "AKME", conflicting_owner: "Rival Co", conflicting_classes: [9], similarity_mark: 80, similarity_goods: 70, similarity_channels: 60 }
              as: WatchService
              captures: { alert_id: $.data.id }
            - call: "POST /brand/watch-alerts/${alert_id}/triage"
              as: Paralegal
              captures: { av: $.data.version }
            - call: "POST /brand/watch-alerts/${alert_id}/assess"
              payload: { weight_mark: 0.6, weight_goods: 0.3, weight_channels: 0.1, fame_adjustment: 5, rationale: "strong", expected_watch_alert_version: "${av}" }
              as: AssociateAttorney
              as_user_id: assoc_1
            - call: "POST /brand/watch-alerts/${alert_id}/escalate"
              payload: { matter_type: INFRINGEMENT }
              as: AssociateAttorney
              as_user_id: assoc_1
              captures: { matter_id: $.data.id }
            - call: "POST /brand/enforcement-matters/${matter_id}/deadlines"
              payload: { deadline_type: RESPONSE_DUE, statutory_basis: "37 CFR 2.196", basis_date: "2026-08-07T09:00:00Z", offset_days: 5 }
              as: Paralegal
              as_user_id: para_1
              captures: { dl_id: $.data.id }
            - call: "POST /brand/deadlines/${dl_id}/verify"
              as: AssociateAttorney
              as_user_id: assoc_2
          trigger:
            - call: "POST /brand/deadlines/${dl_id}/verify"
              as: AssociateAttorney
              as_user_id: assoc_2
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_STATE and Deadline.${dl_id}.status still == PENDING"

      - name: deadline_auto_missed_jeopardy_cascade
        claim_type: side_effect_execution
        grounds: [state_machines.Deadline.PENDING_to_MISSED, entities.EnforcementMatter.fields.posture, entities.WatchAlert.fields.escalation_level]
        distinguishing_aspect: "Advancing the clock past a PENDING deadline's due auto-flips it MISSED and fires the full cascade: matter posture JEOPARDY, sibling deadline requires_partner_review true, alert escalation_level URGENT, exposure recomputed with the 1.5 multiplier (INFRINGEMENT 20 -> 30)."
        test_recipe:
          setup: ["Client, PUBLISHED record, ESCALATED INFRINGEMENT matter with two PENDING deadlines: d1 due 2026-08-14T09:00:00Z (offset 5), d2 due 2026-08-21T09:00:00Z (offset 10)"]
          setup_api_calls:
            - call: "POST /brand/clients"
              payload: { name: "Acme Brands", industry: "consumer goods", enforcement_budget_cents: 500000 }
              as: PlatformAdmin
              captures: { client_id: $.data.id }
            - call: "POST /brand/trademark-records"
              payload: { client_id: "${client_id}", mark_text: "ACME", mark_type: WORD, jurisdiction: "US", nice_classes: [9], application_number: "US-909" }
              as: Paralegal
              captures: { rec_id: $.data.id }
            - call: "POST /brand/trademark-records/${rec_id}/publish"
              payload: { publication_date: "2026-08-03T00:00:00Z" }
              as: Paralegal
            - call: "POST /brand/watch-alerts"
              payload: { trademark_record_id: "${rec_id}", source: WATCH_SERVICE, conflicting_mark_text: "AKME", conflicting_owner: "Rival Co", conflicting_classes: [9], similarity_mark: 80, similarity_goods: 70, similarity_channels: 60 }
              as: WatchService
              captures: { alert_id: $.data.id }
            - call: "POST /brand/watch-alerts/${alert_id}/triage"
              as: Paralegal
              captures: { av: $.data.version }
            - call: "POST /brand/watch-alerts/${alert_id}/assess"
              payload: { weight_mark: 0.6, weight_goods: 0.3, weight_channels: 0.1, fame_adjustment: 5, rationale: "strong", expected_watch_alert_version: "${av}" }
              as: AssociateAttorney
              as_user_id: assoc_1
            - call: "POST /brand/watch-alerts/${alert_id}/escalate"
              payload: { matter_type: INFRINGEMENT }
              as: AssociateAttorney
              as_user_id: assoc_1
              captures: { matter_id: $.data.id }
            - call: "POST /brand/enforcement-matters/${matter_id}/deadlines"
              payload: { deadline_type: RESPONSE_DUE, statutory_basis: "37 CFR 2.196", basis_date: "2026-08-07T09:00:00Z", offset_days: 5 }
              as: Paralegal
              as_user_id: para_1
              captures: { d1: $.data.id }
            - call: "POST /brand/enforcement-matters/${matter_id}/deadlines"
              payload: { deadline_type: RESPONSE_DUE, statutory_basis: "37 CFR 2.196", basis_date: "2026-08-07T09:00:00Z", offset_days: 10 }
              as: Paralegal
              as_user_id: para_1
              captures: { d2: $.data.id }
            - call: "POST /brand/deadlines/${d1}/verify"
              as: AssociateAttorney
              as_user_id: assoc_2
            - call: "POST /brand/deadlines/${d2}/verify"
              as: AssociateAttorney
              as_user_id: assoc_2
          trigger:
            - call: "POST /brand/_clock/set_current_utc"
