scaffold_corner_design:

  # ===========================================================================
  # §1.1 Entities — creation, retrieval, required fields, defaults, computed,
  #                 system fields, type constraints, immutability, FK integrity
  # ===========================================================================
  - section: entities
    instances:
      - name: create_license_board_returns_201_with_fields
        claim_type: Creation
        grounds:
          - entities.LicenseBoard
          - endpoints
        distinguishing_aspect: "POST /license-boards with all required fields -> 201 and data echoes name/jurisdiction_code/credit_unit/total_required_hours plus system id/version=1."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-01T00:00:00Z" }
              as: BoardAdmin
          trigger:
            - call: "POST /license-boards"
              payload: { name: "CA Board", jurisdiction_code: "CA", credit_unit: "CLE", cycle_length_months: 24, total_required_hours: 30.0 }
              as: BoardAdmin
              captures: { board_id: $.data.id, ver: $.data.version }
          assert:
            - "HTTP status == 201"
            - "data.jurisdiction_code == 'CA'; data.credit_unit == 'CLE'; data.total_required_hours == 30.0"
            - "data.version == 1; data.id is a server-minted UUID"

      - name: board_default_carryover_cap_applied_when_omitted
        claim_type: Defaults
        grounds:
          - entities.LicenseBoard.fields.carryover_cap_hours
          - entities.LicenseBoard.fields.audit_cooldown_days
          - entities.LicenseBoard.fields.reminder_lead_days
        distinguishing_aspect: "Omitting carryover_cap_hours/audit_cooldown_days/reminder_lead_days applies defaults 10.0/365/60."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-01T00:00:00Z" }
              as: BoardAdmin
          trigger:
            - call: "POST /license-boards"
              payload: { name: "CA Board", jurisdiction_code: "CA", credit_unit: "CLE", cycle_length_months: 24, total_required_hours: 30.0 }
              as: BoardAdmin
              captures: { cap: $.data.carryover_cap_hours, cd: $.data.audit_cooldown_days, rl: $.data.reminder_lead_days }
          assert:
            - "data.carryover_cap_hours == 10.0; data.audit_cooldown_days == 365; data.reminder_lead_days == 60"

      - name: get_board_not_found_returns_404
        claim_type: Not Found
        grounds:
          - entities.LicenseBoard
          - errors[ERR_NOT_FOUND]
        distinguishing_aspect: "GET /license-boards/{random-uuid} -> ERR_NOT_FOUND 404."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-01T00:00:00Z" }
              as: BoardAdmin
          trigger:
            - call: "GET /license-boards/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: BoardAdmin
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_NOT_FOUND; HTTP status == 404"

      - name: create_course_missing_required_field_returns_invalid_request
        claim_type: Required Fields
        grounds:
          - entities.Course.fields.credit_hours
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: "POST /courses without credit_hours -> ERR_INVALID_REQUEST 400."
        test_recipe:
          setup: ["Board CA, Provider P accredited."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-01T00:00:00Z" }
              as: BoardAdmin
            - call: "POST /license-boards"
              payload: { name: "CA Board", jurisdiction_code: "CA", credit_unit: "CLE", cycle_length_months: 24, total_required_hours: 30.0 }
              as: BoardAdmin
              captures: { board_id: $.data.id }
            - call: "POST /providers"
              payload: { name: "Provider P", board_id: "${board_id}" }
              as: BoardAdmin
              captures: { provider_id: $.data.id }
            - call: "POST /providers/${provider_id}/accredit"
              payload: { accredited_until: "2030-01-01T00:00:00Z" }
              as: BoardAdmin
          trigger:
            - call: "POST /courses"
              payload: { provider_id: "${provider_id}", title: "E", category: "ETHICS" }
              as: BoardAdmin
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_INVALID_REQUEST; HTTP status == 400"

      - name: create_course_non_positive_credit_hours_returns_invalid_request
        claim_type: Type Constraints
        grounds:
          - entities.Course.fields.credit_hours
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: "credit_hours must be > 0; a 0.0 value -> ERR_INVALID_REQUEST 400."
        test_recipe:
          setup: ["Board CA, Provider P accredited."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-01T00:00:00Z" }
              as: BoardAdmin
            - call: "POST /license-boards"
              payload: { name: "CA Board", jurisdiction_code: "CA", credit_unit: "CLE", cycle_length_months: 24, total_required_hours: 30.0 }
              as: BoardAdmin
              captures: { board_id: $.data.id }
            - call: "POST /providers"
              payload: { name: "Provider P", board_id: "${board_id}" }
              as: BoardAdmin
              captures: { provider_id: $.data.id }
            - call: "POST /providers/${provider_id}/accredit"
              payload: { accredited_until: "2030-01-01T00:00:00Z" }
              as: BoardAdmin
          trigger:
            - call: "POST /courses"
              payload: { provider_id: "${provider_id}", title: "E0", category: "ETHICS", credit_hours: 0.0 }
              as: BoardAdmin
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_INVALID_REQUEST; HTTP status == 400"

      - name: requirement_min_hours_sum_exceeds_board_total_returns_range
        claim_type: Type Constraints
        grounds:
          - entities.CreditRequirement.fields.min_hours
          - errors[ERR_VALIDATION_RANGE]
        distinguishing_aspect: "Adding requirements whose non-GENERAL min_hours sum exceeds board.total_required_hours -> ERR_VALIDATION_RANGE 422."
        test_recipe:
          setup: ["Board with total_required_hours 5.0; ETHICS min 4.0 already added."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-01T00:00:00Z" }
              as: BoardAdmin
            - call: "POST /license-boards"
              payload: { name: "Small Board", jurisdiction_code: "TX", credit_unit: "CME", cycle_length_months: 24, total_required_hours: 5.0 }
              as: BoardAdmin
              captures: { board_id: $.data.id }
            - call: "POST /license-boards/${board_id}/requirements"
              payload: { category: "ETHICS", min_hours: 4.0 }
              as: BoardAdmin
          trigger:
            - call: "POST /license-boards/${board_id}/requirements"
              payload: { category: "SUBSTANCE", min_hours: 3.0 }
              as: BoardAdmin
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_VALIDATION_RANGE; HTTP status == 422 (4.0 + 3.0 > 5.0)"

      - name: certificate_is_immutable_no_version_field
        claim_type: Immutability
        grounds:
          - entities.Certificate
        distinguishing_aspect: "Certificate has common_fields:false — it carries id/created_at only, no version field, and there is no update/delete endpoint for it."
        test_recipe:
          setup: ["A renewed cycle with an issued Certificate (reuse the renew chain)."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-01T00:00:00Z" }
              as: BoardAdmin
            - call: "POST /license-boards"
              payload: { name: "CA Board", jurisdiction_code: "CA", credit_unit: "CLE", cycle_length_months: 24, total_required_hours: 30.0, carryover_cap_hours: 10.0 }
              as: BoardAdmin
              captures: { board_id: $.data.id }
            - call: "POST /license-boards/${board_id}/requirements"
              payload: { category: "ETHICS", min_hours: 4.0 }
              as: BoardAdmin
            - call: "POST /license-boards/${board_id}/requirements"
              payload: { category: "SUBSTANCE", min_hours: 2.0 }
              as: BoardAdmin
            - call: "POST /providers"
              payload: { name: "Provider P", board_id: "${board_id}" }
              as: BoardAdmin
              captures: { provider_id: $.data.id }
            - call: "POST /providers/${provider_id}/accredit"
              payload: { accredited_until: "2030-01-01T00:00:00Z" }
              as: BoardAdmin
            - call: "POST /courses"
              payload: { provider_id: "${provider_id}", title: "E4", category: "ETHICS", credit_hours: 4.0 }
              as: BoardAdmin
              captures: { course_e_id: $.data.id }
            - call: "POST /courses"
              payload: { provider_id: "${provider_id}", title: "S2", category: "SUBSTANCE", credit_hours: 2.0 }
              as: BoardAdmin
              captures: { course_s_id: $.data.id }
            - call: "POST /courses"
              payload: { provider_id: "${provider_id}", title: "G24", category: "GENERAL", credit_hours: 24.0 }
              as: BoardAdmin
              captures: { course_g_id: $.data.id }
            - call: "POST /licensees"
              payload: { full_name: "L Cert", home_board_id: "${board_id}", license_number: "L-100" }
              as: BoardAdmin
              captures: { lic_id: $.data.id }
            - call: "POST /renewal-cycles"
              payload: { licensee_id: "${lic_id}", board_id: "${board_id}", cycle_start: "2026-01-01T00:00:00Z" }
              as: BoardAdmin
              captures: { cycle_id: $.data.id }
            - call: "POST /completions"
              payload: { licensee_id: "${lic_id}", course_id: "${course_e_id}", cycle_id: "${cycle_id}", completed_at: "2026-02-01T00:00:00Z" }
              as: Licensee
              as_user_id: "${lic_id}"
              captures: { comp_e_id: $.data.id }
            - call: "POST /completions/${comp_e_id}/verify"
              payload: {}
              as: BoardAdmin
            - call: "POST /completions"
              payload: { licensee_id: "${lic_id}", course_id: "${course_s_id}", cycle_id: "${cycle_id}", completed_at: "2026-02-01T00:00:00Z" }
              as: Licensee
              as_user_id: "${lic_id}"
              captures: { comp_s_id: $.data.id }
            - call: "POST /completions/${comp_s_id}/verify"
              payload: {}
              as: BoardAdmin
            - call: "POST /completions"
              payload: { licensee_id: "${lic_id}", course_id: "${course_g_id}", cycle_id: "${cycle_id}", completed_at: "2026-02-01T00:00:00Z" }
              as: Licensee
              as_user_id: "${lic_id}"
              captures: { comp_g_id: $.data.id }
            - call: "POST /completions/${comp_g_id}/verify"
              payload: {}
              as: BoardAdmin
            - call: "GET /renewal-cycles/${cycle_id}"
              payload: {}
              as: Licensee
              as_user_id: "${lic_id}"
              captures: { cyc_v: $.data.version }
            - call: "POST /renewal-cycles/${cycle_id}/renew"
              payload: { expected_renewal_cycle_version: "${cyc_v}" }
              as: Licensee
              as_user_id: "${lic_id}"
          trigger:
            - call: "GET /renewal-cycles/${cycle_id}/certificate"
              payload: {}
              as: Licensee
              as_user_id: "${lic_id}"
          assert:
            - "data is a length-1 array; data[0] has serial_number and total_hours_certified == 30.0 and no version field"

      - name: completion_awarded_hours_snapshotted_not_client_supplied
        claim_type: System Fields
        grounds:
          - entities.Completion.fields.awarded_hours
          - entities.Completion.fields.category
        distinguishing_aspect: "awarded_hours and category are system-snapshotted from the Course at submission; the client cannot set them (input ignored / not accepted)."
        test_recipe:
          setup: ["Board CA, Provider P accredited, GENERAL course G=24.0h, Licensee L with OPEN cycle."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-01T00:00:00Z" }
              as: BoardAdmin
            - call: "POST /license-boards"
              payload: { name: "CA Board", jurisdiction_code: "CA", credit_unit: "CLE", cycle_length_months: 24, total_required_hours: 30.0 }
              as: BoardAdmin
              captures: { board_id: $.data.id }
            - call: "POST /providers"
              payload: { name: "Provider P", board_id: "${board_id}" }
              as: BoardAdmin
              captures: { provider_id: $.data.id }
            - call: "POST /providers/${provider_id}/accredit"
              payload: { accredited_until: "2030-01-01T00:00:00Z" }
              as: BoardAdmin
            - call: "POST /courses"
              payload: { provider_id: "${provider_id}", title: "G24", category: "GENERAL", credit_hours: 24.0 }
              as: BoardAdmin
              captures: { course_g_id: $.data.id }
            - call: "POST /licensees"
              payload: { full_name: "L Snap", home_board_id: "${board_id}", license_number: "L-101" }
              as: BoardAdmin
              captures: { lic_id: $.data.id }
            - call: "POST /renewal-cycles"
              payload: { licensee_id: "${lic_id}", board_id: "${board_id}", cycle_start: "2026-01-01T00:00:00Z" }
              as: BoardAdmin
              captures: { cycle_id: $.data.id }
          trigger:
            - call: "POST /completions"
              payload: { licensee_id: "${lic_id}", course_id: "${course_g_id}", cycle_id: "${cycle_id}", completed_at: "2026-02-01T00:00:00Z" }
              as: Licensee
              as_user_id: "${lic_id}"
              captures: { aw: $.data.awarded_hours, cat: $.data.category }
          assert:
            - "data.awarded_hours == 24.0 (from Course); data.category == 'GENERAL'; data.status == 'PENDING_VERIFICATION'"

      - name: completion_with_nonexistent_course_returns_not_found
        claim_type: Parent Relationships
        grounds:
          - entities.Completion.fields.course_id
          - errors[ERR_NOT_FOUND]
        distinguishing_aspect: "FK integrity: POST /completions referencing a non-existent course_id -> ERR_NOT_FOUND 404."
        test_recipe:
          setup: ["Board CA, Licensee L with OPEN cycle; no such course."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-01T00:00:00Z" }
              as: BoardAdmin
            - call: "POST /license-boards"
              payload: { name: "CA Board", jurisdiction_code: "CA", credit_unit: "CLE", cycle_length_months: 24, total_required_hours: 30.0 }
              as: BoardAdmin
              captures: { board_id: $.data.id }
            - call: "POST /licensees"
              payload: { full_name: "L NoCourse", home_board_id: "${board_id}", license_number: "L-102" }
              as: BoardAdmin
              captures: { lic_id: $.data.id }
            - call: "POST /renewal-cycles"
              payload: { licensee_id: "${lic_id}", board_id: "${board_id}", cycle_start: "2026-01-01T00:00:00Z" }
              as: BoardAdmin
              captures: { cycle_id: $.data.id }
          trigger:
            - call: "POST /completions"
              payload: { licensee_id: "${lic_id}", course_id: "00000000-0000-4000-8000-000000000000", cycle_id: "${cycle_id}", completed_at: "2026-02-01T00:00:00Z" }
              as: Licensee
              as_user_id: "${lic_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_NOT_FOUND; HTTP status == 404"

      - name: list_completions_filtered_by_licensee_paginated
        claim_type: Listing
        grounds:
          - entities.Completion.fields.licensee_id
          - endpoints
        distinguishing_aspect: "GET /completions?licensee_id=... returns a paginated array with total_count and has_more (reverse-reachability + pagination)."
        test_recipe:
          setup: ["Board CA, Provider P accredited, GENERAL course; Licensee L has 1 completion."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-01T00:00:00Z" }
              as: BoardAdmin
            - call: "POST /license-boards"
              payload: { name: "CA Board", jurisdiction_code: "CA", credit_unit: "CLE", cycle_length_months: 24, total_required_hours: 30.0 }
              as: BoardAdmin
              captures: { board_id: $.data.id }
            - call: "POST /providers"
              payload: { name: "Provider P", board_id: "${board_id}" }
              as: BoardAdmin
              captures: { provider_id: $.data.id }
            - call: "POST /providers/${provider_id}/accredit"
              payload: { accredited_until: "2030-01-01T00:00:00Z" }
              as: BoardAdmin
            - call: "POST /courses"
              payload: { provider_id: "${provider_id}", title: "G24", category: "GENERAL", credit_hours: 24.0 }
              as: BoardAdmin
              captures: { course_g_id: $.data.id }
            - call: "POST /licensees"
              payload: { full_name: "L List", home_board_id: "${board_id}", license_number: "L-103" }
              as: BoardAdmin
              captures: { lic_id: $.data.id }
            - call: "POST /renewal-cycles"
              payload: { licensee_id: "${lic_id}", board_id: "${board_id}", cycle_start: "2026-01-01T00:00:00Z" }
              as: BoardAdmin
              captures: { cycle_id: $.data.id }
            - call: "POST /completions"
              payload: { licensee_id: "${lic_id}", course_id: "${course_g_id}", cycle_id: "${cycle_id}", completed_at: "2026-02-01T00:00:00Z" }
              as: Licensee
              as_user_id: "${lic_id}"
          trigger:
            - call: "GET /completions"
              payload: { licensee_id: "${lic_id}", limit: 10, offset: 0 }
              as: BoardAdmin
          assert:
            - "data is an array of length 1; total_count == 1; has_more == false"

  # ===========================================================================
  # §1.2 State Machines — invalid transitions, terminal lockdown, initial,
  #                       idempotency, side effects, cross-entity guards
  # ===========================================================================
  - section: state_machines
    instances:
      - name: accredit_already_accredited_provider_returns_invalid_state
        claim_type: invalid_transition
        grounds:
          - state_machines.Provider.APPLIED_to_ACCREDITED
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "Accrediting a provider already in ACCREDITED -> ERR_INVALID_STATE 409 (no APPLIED->ACCREDITED from ACCREDITED)."
        test_recipe:
          setup: ["Board CA, Provider P accredited once."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-01T00:00:00Z" }
              as: BoardAdmin
            - call: "POST /license-boards"
              payload: { name: "CA Board", jurisdiction_code: "CA", credit_unit: "CLE", cycle_length_months: 24, total_required_hours: 30.0 }
              as: BoardAdmin
              captures: { board_id: $.data.id }
            - call: "POST /providers"
              payload: { name: "Provider P", board_id: "${board_id}" }
              as: BoardAdmin
              captures: { provider_id: $.data.id }
            - call: "POST /providers/${provider_id}/accredit"
              payload: { accredited_until: "2030-01-01T00:00:00Z" }
              as: BoardAdmin
          trigger:
            - call: "POST /providers/${provider_id}/accredit"
              payload: { accredited_until: "2031-01-01T00:00:00Z" }
              as: BoardAdmin
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_INVALID_STATE; HTTP status == 409"

      - name: revoke_from_revoked_terminal_returns_invalid_state
        claim_type: terminal_lockdown
        grounds:
          - state_machines.Provider.ACCREDITED_to_REVOKED
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "REVOKED is terminal; a second revoke -> ERR_INVALID_STATE 409."
        test_recipe:
          setup: ["Board CA, Provider P accredited then revoked."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-01T00:00:00Z" }
              as: BoardAdmin
            - call: "POST /license-boards"
              payload: { name: "CA Board", jurisdiction_code: "CA", credit_unit: "CLE", cycle_length_months: 24, total_required_hours: 30.0 }
              as: BoardAdmin
              captures: { board_id: $.data.id }
            - call: "POST /providers"
              payload: { name: "Provider P", board_id: "${board_id}" }
              as: BoardAdmin
              captures: { provider_id: $.data.id }
            - call: "POST /providers/${provider_id}/accredit"
              payload: { accredited_until: "2030-01-01T00:00:00Z" }
              as: BoardAdmin
            - call: "POST /providers/${provider_id}/revoke"
              payload: {}
              as: BoardAdmin
          trigger:
            - call: "POST /providers/${provider_id}/revoke"
              payload: {}
              as: BoardAdmin
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_INVALID_STATE; HTTP status == 409"

      - name: new_provider_starts_in_applied
        claim_type: initial_state
        grounds:
          - entities.Provider.fields.status
          - state_machines.Provider
        distinguishing_aspect: "A freshly created provider has status == APPLIED."
        test_recipe:
          setup: ["Board CA."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-01T00:00:00Z" }
              as: BoardAdmin
            - call: "POST /license-boards"
              payload: { name: "CA Board", jurisdiction_code: "CA", credit_unit: "CLE", cycle_length_months: 24, total_required_hours: 30.0 }
              as: BoardAdmin
              captures: { board_id: $.data.id }
          trigger:
            - call: "POST /providers"
              payload: { name: "Provider P", board_id: "${board_id}" }
              as: BoardAdmin
              captures: { st: $.data.status }
          assert:
            - "data.status == 'APPLIED'"

      - name: provider_suspend_reinstate_loop_returns_to_accredited
        claim_type: valid_transition
        grounds:
          - state_machines.Provider.ACCREDITED_to_SUSPENDED
          - state_machines.Provider.SUSPENDED_to_ACCREDITED
        distinguishing_aspect: "ACCREDITED -> SUSPENDED -> ACCREDITED reinstatement loop returns the provider to ACCREDITED."
        test_recipe:
          setup: ["Board CA, Provider P accredited then suspended."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-01T00:00:00Z" }
              as: BoardAdmin
            - call: "POST /license-boards"
              payload: { name: "CA Board", jurisdiction_code: "CA", credit_unit: "CLE", cycle_length_months: 24, total_required_hours: 30.0 }
              as: BoardAdmin
              captures: { board_id: $.data.id }
            - call: "POST /providers"
              payload: { name: "Provider P", board_id: "${board_id}" }
              as: BoardAdmin
              captures: { provider_id: $.data.id }
            - call: "POST /providers/${provider_id}/accredit"
              payload: { accredited_until: "2030-01-01T00:00:00Z" }
              as: BoardAdmin
            - call: "POST /providers/${provider_id}/suspend"
              payload: {}
              as: BoardAdmin
          trigger:
            - call: "POST /providers/${provider_id}/reinstate"
              payload: {}
              as: BoardAdmin
              captures: { st: $.data.status }
          assert:
            - "data.status == 'ACCREDITED'"

      - name: reciprocity_deny_then_approve_returns_invalid_state
        claim_type: invalid_transition
        grounds:
          - state_machines.ReciprocityGrant.REQUESTED_to_DENIED
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "DENIED is terminal; approving a DENIED grant -> ERR_INVALID_STATE 409."
        test_recipe:
          setup: ["Board CA, Licensee L with OPEN cycle, a REQUESTED reciprocity grant that gets denied."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-01T00:00:00Z" }
              as: BoardAdmin
            - call: "POST /license-boards"
              payload: { name: "CA Board", jurisdiction_code: "CA", credit_unit: "CLE", cycle_length_months: 24, total_required_hours: 30.0 }
              as: BoardAdmin
              captures: { board_id: $.data.id }
