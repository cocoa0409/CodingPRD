          - entities.PatientConsent.fields.expires_at
        excluded_because:
          difficulty_instance: resource_temporal_overlap / patient_consent_validity_window_overlap_closed_grant
          rationale: "The named §1.8 instance triggers this error for both the same-scope and covering-scope cases and asserts the live window is untouched."

      - name: stale_version_error_already_asserted_by_difficulty_instance
        claim_type: violation_to_error
        grounds:
          - errors[ERR_STALE_VERSION]
          - concurrency_rules[prescription-route-stale-version]
        excluded_because:
          difficulty_instance: compensating_invariant / attempt_report_correction_preserves_chargeable_transaction_count
          rationale: "The named §1.8 instance threads version captures through three route calls and a fourth after the first is released, so the OCC precondition-failed path for this rule is exercised inside it. The participant-side ERR_PARTICIPANT_STALE_VERSION remains uncovered here only because its parent version also advances on certification-test recording, which the certification branch instance already drives."

  - section: cross_cutting_layers
    instances:

      - name: cascading_side_effects_layer_already_asserted_by_difficulty_instance
        claim_type: cascading_side_effects
        grounds:
          - complexity_profile.complexity_layers
          - state_machines.DirectoryEndpoint.transitions.ACTIVE_to_DISABLED
        excluded_because:
          difficulty_instance: transitive_cascade / endpoint_disable_cascade_reaches_prescription_undeliverable
          rationale: "The cascading_side_effects layer's N-level chain claim is the transitive_cascade rule's subject and the named §1.8 instance asserts it end to end."

      - name: rate_threshold_trigger_layer_already_asserted_by_difficulty_instance
        claim_type: rate_threshold_triggers
        grounds:
          - complexity_profile.complexity_layers
          - calculations.transaction_fee_settlement
        excluded_because:
          difficulty_instance: boundary_precision_check / monthly_chargeable_ceiling_boundary_at_seven_thousand_five_hundred
          rationale: "The rate_threshold_triggers layer's boundary-precision claim on the fee schedule is the named §1.8 instance's whole subject."

      - name: consent_window_elapse_blocks_aggregation_after_clock_advance
        claim_type: scheduled_actions
        grounds:
          - endpoints.POST_/_test/advance_clock
          - entities.PatientConsent.fields.expires_at
          - errors[ERR_CONSENT_EXPIRED]
          - state_machines.MedicationHistoryBatch.transitions.PENDING_to_AGGREGATING
        distinguishing_aspect: "Advancing the logical clock past a consent's computed expires_at turns the same aggregate call that succeeded inside the window into a 422 ERR_CONSENT_REQUIRED, so the half-open upper bound is enforced against the logical clock rather than wall-clock time."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. One CERTIFIED pharmacy with a MED_HISTORY endpoint, one patient holding an ACTIVE MEDICATION_HISTORY-scope consent of 30 days so its window is [2026-09-01T00:00:00Z, 2026-10-01T00:00:00Z), one live history record, and an open batch."
          setup_api_calls:
            - *clock
            - *pharmacy
            - call: "POST /network/participants/${ph_id}/endpoints"
              payload: { service_set: "MED_HISTORY", endpoint_role: "RECEIVER", service_level: "ELIGIBLE_A", sla_response_minutes: 60, message_standard: "NCPDP_SCRIPT_2022011", effective_from: "2026-01-01T00:00:00Z", effective_to: "2027-01-01T00:00:00Z" }
              as: ParticipantAdmin
              as_user_id: "${ph_id}"
            - *ph_cert_start
            - *ph_test_conn
            - *ph_test_newrx
            - *ph_certify
            - *patient_a
            - call: "POST /network/patients/${pa_id}/consents"
              payload: { scope: "MEDICATION_HISTORY", duration_days: 30 }
              as: PatientService
              captures: { cns_id: $.data.id, cns_expires: $.data.expires_at }
            - call: "POST /network/patients/${pa_id}/history-records"
              payload: { source_type: "PHARMACY_FILL", source_participant_id: "${ph_id}", drug_ndc: "00093314905", fill_date: "2026-06-01T00:00:00Z", days_supply: 30, quantity: 60 }
              as: Pharmacy
              as_user_id: "${ph_id}"
              captures: { rec_id: $.data.id }
          trigger:
            - call: "POST /_test/advance_clock"
              payload: { minutes: 43200 }
              as: NetworkOperator
              captures: { now_after: $.data.current_utc }
            - call: "POST /network/medication-history/batches"
              payload: { patient_id: "${pa_id}", trigger_reason: "SCHEDULED_REFRESH" }
              as: Prescriber
              as_user_id: "${ph_id}"
              captures: { batch_id: $.data.id }
            - call: "POST /network/medication-history/batches/${batch_id}/aggregate"
              payload: {}
              as: HubOperator
              captures: { err_id: $.data.error_id }
          assert:
            - "PatientConsent.${cns_id}.expires_at == ${cns_expires} and the advanced clock now reads 2026-10-01T00:00:00Z, exactly the exclusive upper bound"
            - "the aggregate returns 422 with error_id == ERR_CONSENT_REQUIRED because the window's upper bound is exclusive and no ACTIVE consent covers the advanced instant"
            - "MedicationHistoryBatch.${batch_id}.status is still PENDING"
            - "NetworkParticipant.${ph_id}.delivery_reachability is unaffected by the clock advance, because the endpoint's own [2026-01-01, 2027-01-01) interval still contains the advanced instant"
            - "MedicationHistoryRecord.${rec_id}.is_superseded is still false and its aggregation_batch_id is null"

  - section: consistency_model
    instances:

      - name: reversal_is_visible_in_its_own_response_and_on_the_next_read
        claim_type: immediate
        grounds:
          - complexity_profile.consistency_model
          - endpoints.POST_/network/transaction-fees/{id}/reverse
          - entities.TransactionFeeEntry.fields.reversal_entry_id
          - entities.TransactionFeeEntry.fields.period_net_total_cents
        distinguishing_aspect: "The write model is immediate, so the reverse response itself already carries status REVERSED and the compensating row's id, and a separate GET of the source entry in the next call reports the same derived period_net_total_cents with no reconciliation lag."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Northside Family Clinic holds two POSTED 2026-09 NEW_RX/SENT entries of 3600 and 10800 cents."
          setup_api_calls:
            - *clock
            - *clinic
            - call: "POST /network/transaction-fees"
              payload: { participant_id: "${cl_id}", month_key: "2026-09", transaction_type: "NEW_RX", direction: "SENT", transaction_count: 500 }
              as: NetworkOperator
              captures: { e_small_id: $.data.id }
            - call: "POST /network/transaction-fees"
              payload: { participant_id: "${cl_id}", month_key: "2026-09", transaction_type: "NEW_RX", direction: "SENT", transaction_count: 2000 }
              as: NetworkOperator
              captures: { e_big_id: $.data.id }
          trigger:
            - call: "POST /network/transaction-fees/${e_big_id}/reverse"
              payload: { expected_participant_version: "${cl_v}" }
              as: NetworkOperator
              captures: { resp_status: $.data.status, resp_reversal: $.data.reversal_entry_id }
            - call: "GET /network/transaction-fees/${e_small_id}"
              payload: {}
              as: NetworkOperator
              captures: { read_net: $.data.period_net_total_cents, read_e_small_reversal: $.data.reversal_entry_id }
            - call: "GET /network/transaction-fees/${e_big_id}"
              payload: {}
              as: NetworkOperator
              captures: { read_status: $.data.status, read_reversal: $.data.reversal_entry_id }
          assert:
            - "the reverse response already carries status == REVERSED, so the transition is visible in the same round trip that caused it"
            - "the reverse response's reversal_entry_id equals the compensating row's id ${resp_reversal}, and the later read of the same entry reports the identical value ${read_reversal}"
            - "the read of the sibling entry reports period_net_total_cents == 3600 and its own reversal_entry_id is null ${read_e_small_reversal}"
            - "no field on either entry reports a pending or reconciling state — the derived period_net_total_cents is recomputed on read rather than maintained asynchronously"
