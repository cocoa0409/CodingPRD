scenario: |
  Degree Audit & Graduation Certification (university registrar degree audit): program requirement encoding & catalog-year rules, substitution/waiver approval & audit exception, what-if analysis for major change, graduation application & final term audit, in-progress course contingency & conditional clearance, honors calculation & Latin honors thresholds, diploma production & name/date accuracy, post-graduation correction & re-issue

domain_name: degree-audit-graduation
api_prefix: /

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: graph_constraint
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - derived_field_reconciliation
  entity_topology: flat
  state_machine_shape: cyclic
  relationship_patterns: [one_to_many, many_to_many, self_referential, cross_aggregate]
  role_model: approval_chain
  consistency_model: immediate
  difficulty_band: expert

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# 1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Program
    parent: null
    common_fields: true
    fields:
      - { name: program_code, type: string, source: input, description: "Program code shared across catalog-year versions (e.g. BS-CS)" }
      - { name: name, type: string, source: input, description: "Display name of the program" }
      - { name: degree_type, type: enum, source: input, description: "ASSOCIATE | BACHELOR | MASTER" }
      - { name: min_total_credits, type: number, source: input, description: "Minimum total earned credits required for the degree" }
      - { name: min_gpa, type: number, source: input, description: "Minimum institutional GPA required for the degree" }
      - { name: catalog_year_start, type: integer, source: input, description: "First catalog year (inclusive) of this version; half-open range start" }
      - { name: catalog_year_end, type: integer, source: input, description: "Catalog year range end, EXCLUSIVE (half-open [start, end)); must be > catalog_year_start" }
      - { name: status, type: enum, source: system, description: "ACTIVE | RETIRED; initial ACTIVE", default: ACTIVE }

  - name: RequirementGroup
    parent: Program
    common_fields: true
    fields:
      - { name: program_id, type: string, source: system, description: "FK -> Program.id; owning program version" }
      - { name: group_code, type: string, source: input, description: "Group code unique within the program (e.g. CORE, ELEC)" }
      - { name: required_credits, type: number, source: input, description: "Credits that must be allocated to this group" }
      - { name: min_grade, type: enum, source: input, description: "A | B | C | D; minimum letter grade for an enrollment to count toward this group" }
      - { name: eligible_course_codes, type: array, source: input, description: "Array of course_code strings eligible for this group" }

  - name: HonorsPolicy
    parent: Program
    common_fields: true
    fields:
      - { name: program_id, type: string, source: system, description: "FK -> Program.id; owning program version" }
      - { name: honors_gpa_basis, type: enum, source: input, description: "INSTITUTIONAL | CUMULATIVE; which GPA the Latin-honors thresholds compare against" }
      - { name: cum_threshold, type: number, source: input, description: "GPA >= this earns CUM_LAUDE" }
      - { name: magna_threshold, type: number, source: input, description: "GPA >= this earns MAGNA_CUM_LAUDE" }
      - { name: summa_threshold, type: number, source: input, description: "GPA >= this earns SUMMA_CUM_LAUDE" }
      - { name: effective_first_year, type: integer, source: input, description: "First catalog year (inclusive) the policy covers; CLOSED interval start" }
      - { name: effective_last_year, type: integer, source: input, description: "Last catalog year (inclusive) the policy covers; CLOSED interval end, >= effective_first_year" }
      - { name: residency_min_credits, type: integer, source: input, description: "Minimum institutional earned credits required to be eligible for any Latin honors", default: 30 }

  - name: Course
    parent: null
    common_fields: true
    fields:
      - { name: course_code, type: string, source: input, description: "Unique course code (e.g. CS101)" }
      - { name: title, type: string, source: input, description: "Course title" }
      - { name: credits, type: number, source: input, description: "Credit hours carried by the course" }

  - name: Student
    parent: null
    common_fields: true
    fields:
      - { name: student_number, type: string, source: input, description: "Unique student number" }
      - { name: legal_name, type: string, source: input, description: "Legal name; default diploma name source" }
      - { name: financial_hold, type: boolean, source: input, description: "Financial hold flag; blocks graduation application submit and begin-review", default: false }
      - { name: status, type: enum, source: system, description: "ACTIVE | GRADUATED; GRADUATED set on first degree conferral", default: ACTIVE }
      - { name: total_earned_credits, type: number, source: computed, description: "Sum of credits_earned over all COMPLETED enrollments (institutional + transfer)" }
      - { name: institutional_earned_credits, type: number, source: computed, description: "Sum of credits_earned over COMPLETED enrollments with is_transfer=false" }
      - { name: institutional_gpa, type: number, source: computed, description: "Credit-weighted GPA over non-transfer GPA-bearing enrollments; 3 decimals round_half_up; 0.000 when denominator is 0" }
      - { name: cumulative_gpa, type: number, source: computed, description: "Credit-weighted GPA over ALL GPA-bearing enrollments including transfer; 3 decimals round_half_up; 0.000 when denominator is 0" }

  - name: Enrollment
    parent: Student
    common_fields: true
    fields:
      - { name: student_id, type: string, source: system, description: "FK -> Student.id; owning student (from path)" }
      - { name: course_id, type: string, source: input, description: "FK -> Course.id; enrolled course" }
      - { name: term, type: string, source: input, description: "Academic term code (e.g. 2025-FA)" }
      - { name: is_transfer, type: boolean, source: input, description: "True for transfer credit recorded from another institution", default: false }
      - { name: grade, type: enum, source: system, description: "A | B | C | D | F | W; null while IN_PROGRESS; set via post-grade, grade-changes, or grade at creation", default: null }
      - { name: status, type: enum, source: system, description: "IN_PROGRESS | COMPLETED | WITHDRAWN; initial IN_PROGRESS, or COMPLETED when grade supplied at creation", default: IN_PROGRESS }
      - { name: credits_attempted, type: number, source: computed, description: "Course.credits snapshot at creation" }
      - { name: credits_earned, type: number, source: computed, description: "course.credits when status=COMPLETED and grade in {A,B,C,D}; 0 otherwise" }
      - { name: grade_points, type: number, source: computed, description: "credits_attempted * grade value for grade in {A,B,C,D,F}; W is excluded from GPA entirely (grade_points 0 and credits_attempted excluded from GPA denominator)" }

  - name: StudentProgram
    parent: Student
    common_fields: true
    fields:
      - { name: student_id, type: string, source: system, description: "FK -> Student.id; owning student (from path)" }
      - { name: program_id, type: string, source: input, description: "FK -> Program.id; declared program version" }
      - { name: catalog_year, type: integer, source: input, description: "Catalog year governing this declaration; must satisfy program.catalog_year_start <= catalog_year < catalog_year_end" }
      - { name: status, type: enum, source: system, description: "ACTIVE | WITHDRAWN | COMPLETED; COMPLETED set on degree conferral", default: ACTIVE }
      - { name: latest_audit_satisfied, type: boolean, source: computed, description: "True iff a CURRENT FINAL DegreeAudit exists for this student-program and its overall_satisfied is true", default: false }

  - name: DegreeAudit
    parent: StudentProgram
    common_fields: true
    fields:
      - { name: student_program_id, type: string, source: system, description: "FK -> StudentProgram.id; audited student-program (from path)" }
      - { name: audit_kind, type: enum, source: input, description: "STANDARD | WHAT_IF | CONDITIONAL | FINAL" }
      - { name: target_program_id, type: string, source: input, description: "FK -> Program.id; required iff audit_kind=WHAT_IF (program evaluated as-if for a major change); otherwise equals the student-program's program_id", default: null }
      - { name: catalog_year_used, type: integer, source: computed, description: "Catalog year the audit ran under (the student-program's catalog_year)" }
      - { name: status, type: enum, source: system, description: "CURRENT | SUPERSEDED; a newer same-kind audit supersedes prior CURRENT ones", default: CURRENT }
      - { name: total_credits_applied, type: number, source: computed, description: "Credits counted toward the degree per degree_audit_progress rule" }
      - { name: in_progress_credits_counted, type: number, source: computed, description: "Projected IN_PROGRESS credits included (CONDITIONAL only; else 0)" }
      - { name: outstanding_credits, type: number, source: computed, description: "max(0, target program.min_total_credits - total_credits_applied)" }
      - { name: gpa_at_audit, type: number, source: computed, description: "Student.institutional_gpa snapshot at audit time" }
      - { name: overall_satisfied, type: boolean, source: computed, description: "All groups satisfied AND total_credits_applied >= min_total_credits AND gpa_at_audit >= min_gpa" }
      - { name: groups_result, type: array, source: computed, description: "Per-group objects: {requirement_group_id, group_code, credits_applied, effective_required_credits, satisfied}" }

  - name: SubstitutionWaiver
    parent: StudentProgram
    common_fields: true
    fields:
      - { name: student_program_id, type: string, source: system, description: "FK -> StudentProgram.id; audit-exception target student-program (from path)" }
      - { name: requirement_group_id, type: string, source: input, description: "FK -> RequirementGroup.id; group the exception applies to" }
      - { name: kind, type: enum, source: input, description: "SUBSTITUTION (map a specific enrollment into the group) | WAIVER (reduce group required credits)" }
      - { name: enrollment_id, type: string, source: input, description: "FK -> Enrollment.id; required iff kind=SUBSTITUTION; null for WAIVER", default: null }
      - { name: credit_waiver_amount, type: number, source: input, description: "Required iff kind=WAIVER; credits subtracted from group required_credits", default: null }
      - { name: reason, type: string, source: input, description: "Free-text justification", default: null }
      - { name: requested_by_role, type: enum, source: system, description: "STUDENT | ADVISOR; copied from X-User-Role at creation" }
      - { name: requested_by_user_id, type: string, source: system, description: "Copied from X-User-ID at creation; basis for self-approval segregation-of-duties check" }
      - { name: status, type: enum, source: system, description: "SUBMITTED | ADVISOR_APPROVED | APPROVED | DENIED | REVOKED", default: SUBMITTED }
      - { name: decision_reason, type: string, source: system, description: "Reason recorded at deny/revoke", default: null }

  - name: GraduationApplication
    parent: StudentProgram
    common_fields: true
    fields:
      - { name: student_program_id, type: string, source: system, description: "FK -> StudentProgram.id; degree sought (from path)" }
      - { name: expected_term, type: string, source: input, description: "Term of expected graduation (e.g. 2026-SP)" }
      - { name: expected_conferral_date, type: string, source: input, description: "ISO date (YYYY-MM-DD) of expected conferral; filing deadline is 30 days before it" }
      - { name: diploma_name, type: string, source: input, description: "Name to print on diploma; defaults to Student.legal_name at conferral", default: null }
      - { name: status, type: enum, source: system, description: "DRAFT | SUBMITTED | UNDER_REVIEW | CLEARED | CONDITIONALLY_CLEARED | DENIED | DEGREE_CONFERRED", default: DRAFT }
      - { name: decision_reason, type: string, source: system, description: "Reason recorded at decide/auto-resolution; CONTINGENCY_FAILED for automatic denial", default: null }
      - { name: honors_designation, type: enum, source: system, description: "NONE | CUM_LAUDE | MAGNA_CUM_LAUDE | SUMMA_CUM_LAUDE; computed at conferral", default: null }
      - { name: conferred_at, type: datetime, source: system, description: "Logical-clock timestamp of conferral; null until conferred", default: null }

  - name: Diploma
    parent: GraduationApplication
    common_fields: true
    fields:
      - { name: application_id, type: string, source: system, description: "FK -> GraduationApplication.id; owning conferred application" }
      - { name: printed_name, type: string, source: computed, description: "Name printed on the diploma; snapshot of application.diploma_name (or legal_name default) at creation, or corrected value at reissue" }
      - { name: conferral_date, type: string, source: computed, description: "Conferral date printed on the diploma; application.expected_conferral_date at creation, or corrected value at reissue" }
      - { name: honors_designation, type: enum, source: computed, description: "NONE | CUM_LAUDE | MAGNA_CUM_LAUDE | SUMMA_CUM_LAUDE; copied from application at conferral, RECOMPUTED from current GPAs at reissue" }
      - { name: status, type: enum, source: system, description: "PENDING | ISSUED | REVOKED", default: PENDING }
      - { name: reissue_of_diploma_id, type: string, source: system, description: "FK -> Diploma.id; the revoked diploma this one supersedes; null for the original", default: null }
      - { name: revocation_reason, type: string, source: system, description: "Reason recorded at revoke", default: null }

# =============================================================================
# 1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Program
    initial_state: ACTIVE
    terminal_states: [RETIRED]
    transitions:
      - from: ACTIVE
        to: RETIRED
        trigger: "POST /programs/{id}/retire"
        actor: RegistrarStaff
        preconditions:
          - "Program must be ACTIVE (ERR_PROGRAM_INVALID_STATE)"
        side_effects:
          - "Existing StudentProgram declarations remain auditable; only new declarations are blocked (ERR_PROGRAM_RETIRED)"

  - entity: Enrollment
    initial_state: IN_PROGRESS
    terminal_states: []
    transitions:
      - from: IN_PROGRESS
        to: COMPLETED
        trigger: "POST /enrollments/{id}/post-grade with grade in {A,B,C,D,F}; also initial state when grade supplied at creation"
        actor: RegistrarStaff
        preconditions:
          - "Enrollment must be IN_PROGRESS (ERR_ENROLLMENT_INVALID_STATE)"
          - "grade must be one of A,B,C,D,F,W (ERR_INVALID_REQUEST)"
        side_effects:
          - "Compute credits_earned and grade_points per grade_point_and_credit_award"
          - "Recompute owning Student.total_earned_credits, institutional_earned_credits, institutional_gpa, cumulative_gpa (gpa_calculation)"
          - "Recompute CURRENT DegreeAudits (kinds STANDARD, CONDITIONAL, FINAL; WHAT_IF snapshots are never recomputed) for each ACTIVE StudentProgram of the student (degree_audit_progress / requirement_group_satisfaction)"
          - "That audit recompute flips StudentProgram.latest_audit_satisfied to the CURRENT FINAL audit's overall_satisfied (and increments StudentProgram.version when the flag changes)"
          - "If the recomputed FINAL audit leaves zero IN_PROGRESS enrollments for the student and a GraduationApplication of that student-program is CONDITIONALLY_CLEARED: application auto-transitions to CLEARED when overall_satisfied is true, else to DENIED with decision_reason=CONTINGENCY_FAILED"
      - from: IN_PROGRESS
        to: WITHDRAWN
        trigger: "POST /enrollments/{id}/post-grade with grade=W"
        actor: RegistrarStaff
        preconditions:
          - "Enrollment must be IN_PROGRESS (ERR_ENROLLMENT_INVALID_STATE)"
        side_effects:
          - "Same recompute chain as post-grade completion (credits_earned 0; W excluded from GPA); conditional-clearance auto-resolution runs identically (a withdrawal makes the FINAL audit unsatisfied when its credits were required)"
      - from: COMPLETED
        to: COMPLETED
        trigger: "POST /enrollments/{id}/grade-changes with new_grade in {A,B,C,D,F}"
        actor: RegistrarStaff
        preconditions:
          - "Enrollment must be COMPLETED or WITHDRAWN (ERR_ENROLLMENT_INVALID_STATE)"
        side_effects:
          - "Recompute credits_earned/grade_points, then the full Student -> DegreeAudit -> StudentProgram -> GraduationApplication chain exactly as post-grade"
      - from: COMPLETED
        to: WITHDRAWN
        trigger: "POST /enrollments/{id}/grade-changes with new_grade=W (retroactive withdrawal)"
        actor: RegistrarStaff
        preconditions:
          - "Enrollment must be COMPLETED or WITHDRAWN (ERR_ENROLLMENT_INVALID_STATE)"
        side_effects:
          - "Same recompute chain; previously earned credits removed from all derived fields"
      - from: WITHDRAWN
        to: COMPLETED
        trigger: "POST /enrollments/{id}/grade-changes with new_grade in {A,B,C,D,F} (withdrawal reversal)"
        actor: RegistrarStaff
        preconditions:
          - "Enrollment must be COMPLETED or WITHDRAWN (ERR_ENROLLMENT_INVALID_STATE)"
        side_effects:
          - "Same recompute chain; credits restored"

  - entity: StudentProgram
    initial_state: ACTIVE
    terminal_states: [WITHDRAWN, COMPLETED]
    transitions:
      - from: ACTIVE
        to: WITHDRAWN
        trigger: "POST /student-programs/{id}/withdraw"
        actor: RegistrarStaff | Student (owner)
        preconditions:
          - "StudentProgram must be ACTIVE (ERR_STUDENT_PROGRAM_NOT_ACTIVE)"
        side_effects: []
      - from: ACTIVE
        to: COMPLETED
        trigger: "system (during POST /applications/{id}/confer)"
        actor: system
        preconditions: []
        side_effects:
          - "Set when the linked GraduationApplication reaches DEGREE_CONFERRED"

  - entity: DegreeAudit
    initial_state: CURRENT
    terminal_states: [SUPERSEDED]
    transitions:
      - from: CURRENT
        to: SUPERSEDED
        trigger: "system (a newer audit of the same kind is created for the same StudentProgram; for WHAT_IF, same kind AND same target_program_id)"
        actor: system
        preconditions: []
        side_effects:
          - "Only CURRENT audits are recomputed by enrollment/waiver mutations"

  - entity: SubstitutionWaiver
    initial_state: SUBMITTED
    terminal_states: [REVOKED]
    transitions:
      - from: SUBMITTED
        to: ADVISOR_APPROVED
        trigger: "POST /substitution-waivers/{id}/advisor-decision with decision=APPROVE"
        actor: Advisor
        preconditions:
          - "Waiver must be SUBMITTED (ERR_WAIVER_INVALID_STATE)"
          - "Segregation of duties: requested_by_role=ADVISOR implies X-User-ID != requested_by_user_id (ERR_SELF_APPROVAL_FORBIDDEN)"
          - "If kind=SUBSTITUTION: enrollment must be COMPLETED (ERR_ENROLLMENT_NOT_COMPLETED)"
        side_effects: []
      - from: SUBMITTED
        to: DENIED
        trigger: "POST /substitution-waivers/{id}/advisor-decision with decision=DENY"
        actor: Advisor
        preconditions:
          - "Waiver must be SUBMITTED (ERR_WAIVER_INVALID_STATE)"
          - "Same segregation-of-duties check (ERR_SELF_APPROVAL_FORBIDDEN)"
        side_effects:
          - "decision_reason recorded"
      - from: ADVISOR_APPROVED
        to: APPROVED
        trigger: "POST /substitution-waivers/{id}/registrar-decision with decision=APPROVE"
        actor: RegistrarStaff
        preconditions:
          - "Waiver must be ADVISOR_APPROVED (ERR_WAIVER_INVALID_STATE)"
          - "If kind=SUBSTITUTION: enrollment must be COMPLETED (ERR_ENROLLMENT_NOT_COMPLETED)"
        side_effects:
          - "Recompute CURRENT DegreeAudits (STANDARD, CONDITIONAL, FINAL) for the student-program with the exception applied (requirement_group_satisfaction / degree_audit_progress)"
          - "That recompute flips StudentProgram.latest_audit_satisfied to the CURRENT FINAL audit's overall_satisfied (increments StudentProgram.version when the flag changes)"
      - from: ADVISOR_APPROVED
        to: DENIED
        trigger: "POST /substitution-waivers/{id}/registrar-decision with decision=DENY"
        actor: RegistrarStaff
        preconditions:
          - "Waiver must be ADVISOR_APPROVED (ERR_WAIVER_INVALID_STATE)"
        side_effects:
          - "decision_reason recorded"
      - from: DENIED
        to: SUBMITTED
        trigger: "POST /substitution-waivers/{id}/resubmit (optionally changing enrollment_id / credit_waiver_amount / reason)"
        actor: Advisor | Student
        preconditions:
          - "Waiver must be DENIED (ERR_WAIVER_INVALID_STATE)"
        side_effects:
          - "requested_by_role / requested_by_user_id remain the ORIGINAL requester's (segregation-of-duties anchor is preserved across resubmission)"
      - from: APPROVED
        to: REVOKED
        trigger: "POST /substitution-waivers/{id}/revoke"
        actor: RegistrarStaff
        preconditions:
          - "Waiver must be APPROVED (ERR_WAIVER_INVALID_STATE)"
        side_effects:
          - "Recompute CURRENT DegreeAudits with the exception removed (compensates the APPROVED side effects exactly; audit group credits and outstanding_credits return to their pre-approval values)"
          - "StudentProgram.latest_audit_satisfied refreshed from the CURRENT FINAL audit"

  - entity: GraduationApplication
    initial_state: DRAFT
    terminal_states: [DENIED, DEGREE_CONFERRED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /applications/{id}/submit"
        actor: Student (owner)
        preconditions:
          - "Application must be DRAFT (ERR_APPLICATION_INVALID_STATE)"
          - "No other application for the same student-program in {DRAFT, SUBMITTED, UNDER_REVIEW, CLEARED, CONDITIONALLY_CLEARED} (ERR_ACTIVE_APPLICATION_EXISTS)"
          - "Logical clock must be <= expected_conferral_date - 30 days (ERR_FILING_DEADLINE_PASSED)"
          - "Student.financial_hold must be false (ERR_FINANCIAL_HOLD)"
        side_effects: []
      - from: SUBMITTED
        to: UNDER_REVIEW
        trigger: "POST /applications/{id}/begin-review"
        actor: RegistrarStaff
        preconditions:
          - "Application must be SUBMITTED (ERR_APPLICATION_INVALID_STATE)"
          - "A CURRENT FINAL DegreeAudit must exist for the student-program (ERR_FINAL_AUDIT_REQUIRED)"
          - "Student.financial_hold must be false (ERR_FINANCIAL_HOLD)"
        side_effects: []
      - from: UNDER_REVIEW
        to: CLEARED
        trigger: "POST /applications/{id}/decide with decision=CLEARED"
        actor: RegistrarStaff
        preconditions:
          - "Application must be UNDER_REVIEW (ERR_APPLICATION_INVALID_STATE)"
          - "CURRENT FINAL audit overall_satisfied must be true (ERR_AUDIT_NOT_SATISFIED)"
        side_effects: []
      - from: UNDER_REVIEW
        to: CONDITIONALLY_CLEARED
        trigger: "POST /applications/{id}/decide with decision=CONDITIONALLY_CLEARED"
        actor: RegistrarStaff
        preconditions:
          - "Application must be UNDER_REVIEW (ERR_APPLICATION_INVALID_STATE)"
          - "Student has at least one IN_PROGRESS enrollment (ERR_NO_IN_PROGRESS_ENROLLMENTS)"
        side_effects: []
      - from: UNDER_REVIEW
        to: DENIED
        trigger: "POST /applications/{id}/decide with decision=DENIED"
        actor: RegistrarStaff
        preconditions:
          - "Application must be UNDER_REVIEW (ERR_APPLICATION_INVALID_STATE)"
        side_effects:
          - "decision_reason recorded"
      - from: CONDITIONALLY_CLEARED
        to: CLEARED
        trigger: "system (the student's IN_PROGRESS enrollment count reaches zero as a result of an enrollment mutation AND the recomputed CURRENT FINAL audit overall_satisfied is true)"
        actor: system
        preconditions: []
        side_effects:
          - "Fires as the terminal hop of the post-grade / grade-changes cascade"
      - from: CONDITIONALLY_CLEARED
        to: DENIED
        trigger: "system (the student's IN_PROGRESS enrollment count reaches zero as a result of an enrollment mutation AND the recomputed CURRENT FINAL audit overall_satisfied is false)"
        actor: system
        preconditions: []
        side_effects:
          - "decision_reason set to CONTINGENCY_FAILED"
      - from: CLEARED
        to: DEGREE_CONFERRED
        trigger: "POST /applications/{id}/confer"
        actor: RegistrarStaff
        preconditions:
          - "Application must be CLEARED (ERR_APPLICATION_INVALID_STATE)"
          - "An HonorsPolicy for the student-program's program covering its catalog_year in [effective_first_year, effective_last_year] inclusive must exist (ERR_HONORS_POLICY_MISSING)"
        side_effects:
          - "honors_designation computed per honors_designation rule (basis GPA from policy, residency gate); conferred_at set from logical clock"
          - "StudentProgram ACTIVE -> COMPLETED"
          - "Student.status -> GRADUATED"
          - "Diploma created with status PENDING, printed_name = application.diploma_name or Student.legal_name when null, conferral_date = application.expected_conferral_date, honors_designation = computed designation, reissue_of_diploma_id = null"

  - entity: Diploma
    initial_state: PENDING
    terminal_states: [REVOKED]
    transitions:
      - from: PENDING
        to: ISSUED
        trigger: "POST /diplomas/{id}/issue"
        actor: RegistrarStaff
        preconditions:
          - "Diploma must be PENDING (ERR_DIPLOMA_INVALID_STATE)"
        side_effects: []
      - from: PENDING
        to: REVOKED
        trigger: "POST /diplomas/{id}/revoke"
        actor: RegistrarStaff
        preconditions:
          - "Diploma must be PENDING or ISSUED (ERR_DIPLOMA_INVALID_STATE)"
        side_effects:
          - "revocation_reason recorded"
      - from: ISSUED
        to: REVOKED
        trigger: "POST /diplomas/{id}/revoke"
        actor: RegistrarStaff
        preconditions:
          - "Diploma must be PENDING or ISSUED (ERR_DIPLOMA_INVALID_STATE)"
        side_effects:
          - "revocation_reason recorded"

# =============================================================================
# 1.2.1 Concurrency Rules (OCC)
# =============================================================================
concurrency_rules:
  - rule_id: audit-create-stale-student-program
    parent_entity: StudentProgram
    write_endpoint: "POST /student-programs/{id}/audits"
    occ_field: expected_student_program_version
    description: |
      Creating a DegreeAudit against a StudentProgram whose version has advanced
      since the client last observed it is rejected. Audit creation legitimately
      supersedes the prior CURRENT audit of the same kind, so a client holding a
      stale view of the student-program (e.g. another writer has since created an
      audit, or a waiver cascade flipped latest_audit_satisfied and bumped the
      version) must re-read before running a new audit.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# 1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: grade_point_and_credit_award
    trigger: "enrollment creation with grade, post-grade, grade-changes"
    algorithm: aggregation
    formula: |
      grade_value: A=4.00, B=3.00, C=2.00, D=1.00, F=0.00; W has no value.
      credits_attempted = course.credits (snapshot at enrollment creation).
      credits_earned = course.credits when status=COMPLETED and grade in {A,B,C,D}, else 0.
      grade_points = credits_attempted * grade_value for grade in {A,B,C,D,F}.
      W: credits_earned=0, grade_points=0, and the enrollment is EXCLUDED from GPA denominators.
    constants:
      GRADE_A: 4.00
      GRADE_B: 3.00
      GRADE_C: 2.00
      GRADE_D: 1.00
      GRADE_F: 0.00
    precision: "grade points exact to 2 decimals (credits * grade value); no per-enrollment rounding"

  - name: gpa_calculation
    trigger: "any enrollment mutation on the student (create with grade, post-grade, grade-changes)"
    algorithm: aggregation
    formula: |
      GPA-bearing enrollments: status=COMPLETED and grade in {A,B,C,D,F} (W excluded entirely).
      ROUNDING ORDER IS PINNED (nested-rounding trap): per-enrollment grade_points are exact
      (credits_attempted * grade value, 2-decimal exact); GPA = sum(grade_points) / sum(credits_attempted)
      computed over the full input set and rounded ONCE at the end to 3 decimals, round_half_up.
      The alternative order (round each term GPA to 3 decimals, then average terms) is WRONG and
      produces different values (e.g. 1cr A + 2cr B in T1 and 1cr A in T2: pinned 14/5 = 2.800,
      per-term-average (3.333+4.000)/2 = 3.667).
      Denominator 0 (no GPA-bearing enrollments) -> GPA = 0.000.
    input_set: "Student's enrollments; institutional variant excludes is_transfer=true, cumulative includes them"
    precision: "3 decimal places, round_half_up, single final rounding"
    variants:
      - name: institutional
        when: "Student.institutional_gpa, audit gpa_at_audit, and honors basis INSTITUTIONAL"
        difference: "input set excludes enrollments with is_transfer=true"
      - name: cumulative
        when: "Student.cumulative_gpa and honors basis CUMULATIVE"
        difference: "input set includes transfer enrollments; identical data yields a different GPA whenever transfer grades differ from institutional average"

  - name: requirement_group_satisfaction
    trigger: "degree audit run; recompute of CURRENT audits after enrollment mutation or waiver approve/revoke"
    algorithm: waterfall_allocation
    formula: |
      For each RequirementGroup of the target program:
        effective_required = max(0, required_credits - sum(credit_waiver_amount over APPROVED WAIVER waivers for the group))
      Eligibility of an enrollment for a group:
        status=COMPLETED AND grade in {A,B,C,D} AND grade_value(grade) >= grade_value(group.min_grade)
        AND (course.course_code in group.eligible_course_codes OR an APPROVED SUBSTITUTION waiver maps this enrollment_id to this group).
        For CONDITIONAL audits only, IN_PROGRESS enrollments are ALSO eligible and projected at full
        course.credits with the min_grade filter bypassed (assumed passed).
      A single enrollment may be allocated to AT MOST ONE group. Allocation is a deterministic waterfall:
        process eligible enrollments in created_at ASC order (tie-break: course.course_code ASC, then term ASC);
        allocate each to the eligible group with the LARGEST remaining deficit
        (effective_required - credits already allocated); tie-break: group_code ASC;
        if no eligible group has remaining deficit > 0, the enrollment counts only toward total_credits_applied.
      group.satisfied = allocated_credits >= effective_required.
      credits_applied reported per group = allocated credits.
    constants:
      GRADE_VALUE: {A: 4, B: 3, C: 2, D: 1}
    precision: "credits are exact numbers; comparisons are >= on exact values"
    input_set: "enrollments of the student-program's student; APPROVED (not REVOKED) waivers of the student-program"

  - name: degree_audit_progress
    trigger: "POST /student-programs/{id}/audits; recompute of CURRENT audits after enrollment mutation or waiver approve/revoke"
    algorithm: aggregation
    formula: |
      target program = student-program's program, except WHAT_IF uses target_program_id (major-change analysis).
      total_credits_applied = sum(credits_earned) over COMPLETED enrollments (institutional + transfer).
      CONDITIONAL variant additionally projects IN_PROGRESS enrollments at full course.credits:
        total_credits_applied += sum(course.credits over IN_PROGRESS enrollments)
        and in_progress_credits_counted = that projected sum (0 for all other kinds).
      outstanding_credits = max(0, target.min_total_credits - total_credits_applied).
      gpa_at_audit = Student.institutional_gpa at audit time (completed courses only, even for CONDITIONAL).
      overall_satisfied = (every group of target program satisfied per requirement_group_satisfaction)
                          AND total_credits_applied >= target.min_total_credits
                          AND gpa_at_audit >= target.min_gpa.
      A program with zero requirement groups has its group conjunct vacuously true.
      After a FINAL audit is created or recomputed: StudentProgram.latest_audit_satisfied = overall_satisfied
      (and StudentProgram.version increments when the flag changes). WHAT_IF audits never touch the flag.
    input_set: "enrollments of the student; groups/policies of the target program at the student-program's catalog_year"
    precision: "credit comparisons exact; GPA already rounded per gpa_calculation"
    variants:
      - name: completed_only
        when: "STANDARD, WHAT_IF, FINAL audits"
        difference: "IN_PROGRESS enrollments contribute nothing; identical data can yield overall_satisfied=false where the projected variant yields true"
      - name: include_in_progress
        when: "CONDITIONAL audits (conditional clearance projection)"
        difference: "IN_PROGRESS enrollments counted at full credits toward groups and totals; in_progress_credits_counted reports the projected amount"

  - name: honors_designation
    trigger: "POST /applications/{id}/confer; recomputed at POST /applications/{id}/diplomas/reissue"
    algorithm: threshold
    formula: |
      policy = HonorsPolicy of the student-program's program whose [effective_first_year, effective_last_year]
      CLOSED interval contains the student-program's catalog_year (confer fails with ERR_HONORS_POLICY_MISSING if none).
      Eligibility gate: Student.institutional_earned_credits >= policy.residency_min_credits, else NONE.
      basis_gpa = institutional_gpa when policy.honors_gpa_basis=INSTITUTIONAL, else cumulative_gpa.
      designation = SUMMA_CUM_LAUDE when basis_gpa >= policy.summa_threshold
                    else MAGNA_CUM_LAUDE when basis_gpa >= policy.magna_threshold
                    else CUM_LAUDE when basis_gpa >= policy.cum_threshold
                    else NONE.
      Boundary is >= exactly: a basis_gpa equal to a threshold earns that tier.
    input_set: "Student GPAs and institutional_earned_credits at conferral/reissue time; the covering HonorsPolicy"
    constants:
      FILING_LEAD_DAYS: 30
    precision: "threshold comparison against the 3-decimal rounded GPA; >= inclusive"
    variants:
      - name: institutional_basis
        when: "policy.honors_gpa_basis=INSTITUTIONAL"
        difference: "transfer work excluded; same student data can earn SUMMA_CUM_LAUDE here and NONE under the cumulative basis"
      - name: cumulative_basis
        when: "policy.honors_gpa_basis=CUMULATIVE"
        difference: "transfer grade points and credits included in basis_gpa"

# =============================================================================
# 1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers present and non-empty"
    error_id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER
    http_status: 400
    applies_to: "all"
  - priority: 2
    category: auth
    check: "Role permitted for the endpoint per §1.5 roles; audit_kind FINAL/CONDITIONAL restricted to RegistrarStaff; Student role may only act on resources whose owning Student.id == X-User-ID"
    error_id: ERR_FORBIDDEN
    http_status: 403
    applies_to: "all"
  - priority: 3
    category: existence
    check: "Path resource ids exist, validated left-to-right"
    error_id: "ERR_{RESOURCE}_NOT_FOUND"
    http_status: 404
    applies_to: "all"
  - priority: 4
    category: existence
    check: "Body-referenced ids exist (program_id, course_id, requirement_group_id, enrollment_id, target_program_id)"
    error_id: "ERR_{RESOURCE}_NOT_FOUND"
    http_status: 404
    applies_to: "endpoints with body FKs"
  - priority: 5
    category: state
    check: "Target resource in a valid from-state for the requested transition"
    error_id: "ERR_{RESOURCE}_INVALID_STATE / ERR_STUDENT_PROGRAM_NOT_ACTIVE"
    http_status: 409
    applies_to: "all action endpoints"
  - priority: 6
    category: state
    check: "OCC: expected_student_program_version matches StudentProgram.version"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /student-programs/{id}/audits"
  - priority: 7
    category: business_safety
    check: "Segregation of duties: advisor-decision forbidden when requested_by_role=ADVISOR and X-User-ID == requested_by_user_id"
    error_id: ERR_SELF_APPROVAL_FORBIDDEN
    http_status: 403
    applies_to: "POST /substitution-waivers/{id}/advisor-decision"
  - priority: 8
    category: business_constraint
    check: "Uniqueness and interval-overlap: student_number unique; course_code unique; per program_code catalog ranges half-open non-overlapping; per program honors-policy year ranges closed non-overlapping; at most one non-terminal GraduationApplication per student-program; no duplicate (student, course, term) enrollment with status IN_PROGRESS or COMPLETED"
    error_id: "ERR_UNIQUE_CONSTRAINT_VIOLATION | ERR_CATALOG_RANGE_OVERLAP | ERR_POLICY_RANGE_OVERLAP | ERR_ACTIVE_APPLICATION_EXISTS | ERR_DUPLICATE_ENROLLMENT"
    http_status: 409
    applies_to: "create endpoints and application submit"
  - priority: 9
    category: business_temporal
    check: "Filing window: logical clock <= expected_conferral_date - 30 days"
    error_id: ERR_FILING_DEADLINE_PASSED
    http_status: 422
    applies_to: "POST /applications/{id}/submit"
  - priority: 10
    category: business_referential
    check: "Referenced-entity state: program ACTIVE for declarations/what-if targets; catalog_year within range; enrollment COMPLETED for substitution decisions; CURRENT FINAL audit exists for begin-review and satisfied for CLEARED decision; >=1 IN_PROGRESS enrollment for CONDITIONALLY_CLEARED; covering HonorsPolicy exists at confer"
    error_id: "ERR_PROGRAM_RETIRED | ERR_CATALOG_YEAR_OUT_OF_RANGE | ERR_ENROLLMENT_NOT_COMPLETED | ERR_FINAL_AUDIT_REQUIRED | ERR_AUDIT_NOT_SATISFIED | ERR_NO_IN_PROGRESS_ENROLLMENTS | ERR_HONORS_POLICY_MISSING"
    http_status: 422
    applies_to: "per-check endpoints"
  - priority: 11
    category: business_fiscal
    check: "Student.financial_hold must be false"
    error_id: ERR_FINANCIAL_HOLD
    http_status: 402
    applies_to: "POST /applications/{id}/submit, POST /applications/{id}/begin-review"

# =============================================================================
# 1.5 API Endpoint Table
# =============================================================================
endpoints:
  - { method: POST, path: "/_clock/set_current_utc", description: "Set the logical clock (test-driving). Server default before any call is exactly 2026-08-01T00:00:00Z and never falls back to wall-clock.", roles: [SystemAdmin], code: 200, input: [to_iso8601], output: "{ current_utc: string }", side_effects: [] }
  - { method: POST, path: "/programs", description: "Create a program catalog-year version; half-open [catalog_year_start, catalog_year_end) must not overlap another version with the same program_code (adjacency allowed)", roles: [RegistrarStaff], code: 201, input: [program_code, name, degree_type, min_total_credits, min_gpa, catalog_year_start, catalog_year_end], output: Program, side_effects: [] }
  - { method: GET, path: "/programs/{id}", description: "Get one program", roles: [RegistrarStaff, Advisor, Student], code: 200, input: [], output: Program, side_effects: [] }
  - { method: POST, path: "/programs/{id}/retire", description: "ACTIVE -> RETIRED; blocks new declarations only", roles: [RegistrarStaff], code: 200, input: [], output: Program, side_effects: ["Program status -> RETIRED"] }
  - { method: POST, path: "/programs/{id}/requirement-groups", description: "Create a requirement group under the program", roles: [RegistrarStaff], code: 201, input: [group_code, required_credits, min_grade, eligible_course_codes], output: RequirementGroup, side_effects: [] }
  - { method: GET, path: "/programs/{id}/requirement-groups", description: "List requirement groups of a program", roles: [RegistrarStaff, Advisor, Student], code: 200, input: ["limit?", "offset?"], output: "RequirementGroup[]", side_effects: [] }
  - { method: POST, path: "/programs/{id}/honors-policies", description: "Create an honors policy; closed inclusive [effective_first_year, effective_last_year] must not overlap another policy of the same program (a shared boundary year IS an overlap)", roles: [RegistrarStaff], code: 201, input: [honors_gpa_basis, cum_threshold, magna_threshold, summa_threshold, effective_first_year, effective_last_year, "residency_min_credits?"], output: HonorsPolicy, side_effects: [] }
  - { method: GET, path: "/programs/{id}/honors-policies", description: "List honors policies of a program", roles: [RegistrarStaff, Advisor, Student], code: 200, input: ["limit?", "offset?"], output: "HonorsPolicy[]", side_effects: [] }
  - { method: GET, path: "/programs/{id}/student-programs", description: "List declarations of this program (FK reverse lookup)", roles: [RegistrarStaff, Advisor], code: 200, input: ["limit?", "offset?"], output: "StudentProgram[]", side_effects: [] }
  - { method: GET, path: "/programs/{id}/audits", description: "List degree audits whose target program is this program (FK reverse for DegreeAudit.target_program_id; includes WHAT_IF analyses pointing at this program)", roles: [RegistrarStaff, Advisor], code: 200, input: ["limit?", "offset?"], output: "DegreeAudit[]", side_effects: [] }
  - { method: POST, path: "/courses", description: "Create a course (course_code unique)", roles: [RegistrarStaff], code: 201, input: [course_code, title, credits], output: Course, side_effects: [] }
  - { method: POST, path: "/students", description: "Create a student (student_number unique)", roles: [RegistrarStaff], code: 201, input: [student_number, legal_name, "financial_hold?"], output: Student, side_effects: [] }
  - { method: GET, path: "/students/{id}", description: "Get one student with computed credits/GPAs", roles: [RegistrarStaff, Advisor, Student], code: 200, input: [], output: Student, side_effects: [] }
  - { method: POST, path: "/students/{id}/enrollments", description: "Create an enrollment; when grade supplied it starts COMPLETED (transfer/retro recording), else IN_PROGRESS; rejects duplicate (student, course, term) with an IN_PROGRESS or COMPLETED sibling", roles: [RegistrarStaff], code: 201, input: [course_id, term, "is_transfer?", "grade?"], output: Enrollment, side_effects: ["when grade supplied: grade_point_and_credit_award + full Student/DegreeAudit/StudentProgram recompute chain"] }
  - { method: GET, path: "/enrollments", description: "Filtered enrollment list (FK reverse for student_id and course_id)", roles: [RegistrarStaff, Advisor, Student], code: 200, input: ["student_id?", "course_id?", "status?", "term?", "limit?", "offset?"], output: "Enrollment[]", side_effects: [] }
  - { method: GET, path: "/enrollments/{id}", description: "Get one enrollment", roles: [RegistrarStaff, Advisor, Student], code: 200, input: [], output: Enrollment, side_effects: [] }
  - { method: POST, path: "/enrollments/{id}/post-grade", description: "IN_PROGRESS -> COMPLETED (grade A-F) or WITHDRAWN (grade W)", roles: [RegistrarStaff], code: 200, input: [grade], output: Enrollment, side_effects: ["grade_point_and_credit_award", "gpa_calculation on Student", "recompute CURRENT audits of ACTIVE student-programs", "StudentProgram.latest_audit_satisfied refresh", "CONDITIONALLY_CLEARED application auto-resolution when last IN_PROGRESS enrollment resolves"] }
  - { method: POST, path: "/enrollments/{id}/grade-changes", description: "Grade correction on COMPLETED/WITHDRAWN enrollment (incl. retro-withdrawal via new_grade=W and withdrawal reversal)", roles: [RegistrarStaff], code: 200, input: [new_grade, reason], output: Enrollment, side_effects: ["same recompute chain as post-grade"] }
  - { method: POST, path: "/students/{id}/programs", description: "Declare a major: create StudentProgram; program must be ACTIVE and catalog_year in [catalog_year_start, catalog_year_end)", roles: [RegistrarStaff, Student], code: 201, input: [program_id, catalog_year], output: StudentProgram, side_effects: [] }
  - { method: GET, path: "/student-programs", description: "Filtered student-program list (FK reverse for student_id and program_id)", roles: [RegistrarStaff, Advisor, Student], code: 200, input: ["student_id?", "program_id?", "status?", "limit?", "offset?"], output: "StudentProgram[]", side_effects: [] }
  - { method: GET, path: "/student-programs/{id}", description: "Get one student-program", roles: [RegistrarStaff, Advisor, Student], code: 200, input: [], output: StudentProgram, side_effects: [] }
  - { method: POST, path: "/student-programs/{id}/withdraw", description: "ACTIVE -> WITHDRAWN", roles: [RegistrarStaff, Student], code: 200, input: [], output: StudentProgram, side_effects: [] }
  - { method: POST, path: "/student-programs/{id}/audits", description: "Run a degree audit (STANDARD/WHAT_IF/CONDITIONAL/FINAL; WHAT_IF requires target_program_id; FINAL/CONDITIONAL RegistrarStaff-only); supersedes prior CURRENT same-kind audit", roles: [RegistrarStaff, Advisor, Student], code: 201, input: [audit_kind, expected_student_program_version, "target_program_id?"], output: DegreeAudit, side_effects: ["degree_audit_progress + requirement_group_satisfaction computation", "prior CURRENT same-kind audit -> SUPERSEDED", "increments StudentProgram.version by 1", "FINAL kind refreshes StudentProgram.latest_audit_satisfied"] }
  - { method: GET, path: "/student-programs/{id}/audits", description: "List audits of a student-program (FK reverse)", roles: [RegistrarStaff, Advisor, Student], code: 200, input: ["audit_kind?", "status?", "target_program_id?", "limit?", "offset?"], output: "DegreeAudit[]", side_effects: [] }
  - { method: POST, path: "/student-programs/{id}/waivers", description: "Request a substitution/waiver audit exception; records requester role/id", roles: [Advisor, Student], code: 201, input: [requirement_group_id, kind, "enrollment_id?", "credit_waiver_amount?", "reason?"], output: SubstitutionWaiver, side_effects: [] }
  - { method: GET, path: "/substitution-waivers", description: "Filtered waiver list (FK reverse for student_program_id, requirement_group_id, enrollment_id)", roles: [RegistrarStaff, Advisor], code: 200, input: ["student_program_id?", "requirement_group_id?", "enrollment_id?", "status?", "requested_by_user_id?", "limit?", "offset?"], output: "SubstitutionWaiver[]", side_effects: [] }
  - { method: GET, path: "/substitution-waivers/{id}", description: "Get one waiver", roles: [RegistrarStaff, Advisor, Student], code: 200, input: [], output: SubstitutionWaiver, side_effects: [] }
  - { method: POST, path: "/substitution-waivers/{id}/advisor-decision", description: "Advisor step of approval chain: SUBMITTED -> ADVISOR_APPROVED | DENIED; segregation of duties enforced", roles: [Advisor], code: 200, input: [decision, "decision_reason?"], output: SubstitutionWaiver, side_effects: [] }
  - { method: POST, path: "/substitution-waivers/{id}/registrar-decision", description: "Registrar step: ADVISOR_APPROVED -> APPROVED | DENIED", roles: [RegistrarStaff], code: 200, input: [decision, "decision_reason?"], output: SubstitutionWaiver, side_effects: ["on APPROVE: recompute CURRENT audits with exception applied; StudentProgram.latest_audit_satisfied refresh"] }
  - { method: POST, path: "/substitution-waivers/{id}/resubmit", description: "DENIED -> SUBMITTED with optional field changes; original requester identity preserved", roles: [Advisor, Student], code: 200, input: ["enrollment_id?", "credit_waiver_amount?", "reason?"], output: SubstitutionWaiver, side_effects: [] }
  - { method: POST, path: "/substitution-waivers/{id}/revoke", description: "APPROVED -> REVOKED; compensates approval side effects", roles: [RegistrarStaff], code: 200, input: [reason], output: SubstitutionWaiver, side_effects: ["recompute CURRENT audits with exception removed", "StudentProgram.latest_audit_satisfied refresh"] }
  - { method: POST, path: "/student-programs/{id}/applications", description: "Create a graduation application (DRAFT)", roles: [Student], code: 201, input: [expected_term, expected_conferral_date, "diploma_name?"], output: GraduationApplication, side_effects: [] }
  - { method: GET, path: "/student-programs/{id}/applications", description: "List applications of a student-program (FK reverse)", roles: [RegistrarStaff, Advisor, Student], code: 200, input: ["status?", "limit?", "offset?"], output: "GraduationApplication[]", side_effects: [] }
  - { method: GET, path: "/applications/{id}", description: "Get one application", roles: [RegistrarStaff, Advisor, Student], code: 200, input: [], output: GraduationApplication, side_effects: [] }
  - { method: POST, path: "/applications/{id}/submit", description: "DRAFT -> SUBMITTED; checks active-application uniqueness, filing deadline, financial hold", roles: [Student], code: 200, input: [], output: GraduationApplication, side_effects: [] }
  - { method: POST, path: "/applications/{id}/begin-review", description: "SUBMITTED -> UNDER_REVIEW; requires CURRENT FINAL audit and no financial hold", roles: [RegistrarStaff], code: 200, input: [], output: GraduationApplication, side_effects: [] }
  - { method: POST, path: "/applications/{id}/decide", description: "UNDER_REVIEW -> CLEARED | CONDITIONALLY_CLEARED | DENIED", roles: [RegistrarStaff], code: 200, input: [decision, "decision_reason?"], output: GraduationApplication, side_effects: [] }
  - { method: POST, path: "/applications/{id}/confer", description: "CLEARED -> DEGREE_CONFERRED; computes honors, completes student-program, graduates student, creates PENDING diploma", roles: [RegistrarStaff], code: 200, input: [], output: GraduationApplication, side_effects: ["honors_designation computed", "StudentProgram -> COMPLETED", "Student -> GRADUATED", "Diploma created PENDING"] }
  - { method: GET, path: "/diplomas", description: "Filtered diploma list (FK reverse for application_id and reissue_of_diploma_id)", roles: [RegistrarStaff, Advisor, Student], code: 200, input: ["application_id?", "status?", "reissue_of_diploma_id?", "limit?", "offset?"], output: "Diploma[]", side_effects: [] }
  - { method: GET, path: "/diplomas/{id}", description: "Get one diploma", roles: [RegistrarStaff, Advisor, Student], code: 200, input: [], output: Diploma, side_effects: [] }
  - { method: POST, path: "/diplomas/{id}/issue", description: "PENDING -> ISSUED", roles: [RegistrarStaff], code: 200, input: [], output: Diploma, side_effects: [] }
  - { method: POST, path: "/diplomas/{id}/revoke", description: "PENDING|ISSUED -> REVOKED (correction path)", roles: [RegistrarStaff], code: 200, input: [reason], output: Diploma, side_effects: [] }
  - { method: POST, path: "/applications/{id}/diplomas/reissue", description: "Create corrected diploma for a DEGREE_CONFERRED application whose latest diploma (most recent by created_at) is REVOKED; honors recomputed from current GPAs", roles: [RegistrarStaff], code: 201, input: ["printed_name?", "conferral_date?", reason], output: Diploma, side_effects: ["new Diploma PENDING with reissue_of_diploma_id = prior latest diploma id", "honors_designation recomputed per honors_designation rule"] }

# =============================================================================
# 1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER, http: 400, condition: "X-User-ID or X-User-Role header missing/empty" }
  - { id: ERR_FORBIDDEN, http: 403, condition: "Role not permitted, or Student acting on another student's resource, or non-RegistrarStaff requesting FINAL/CONDITIONAL audit" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Missing required field, malformed value, invalid enum member, or WHAT_IF audit without target_program_id / WAIVER without credit_waiver_amount / SUBSTITUTION without enrollment_id" }
  - { id: ERR_PROGRAM_NOT_FOUND, http: 404, condition: "Program id (path or body) does not exist" }
  - { id: ERR_REQUIREMENT_GROUP_NOT_FOUND, http: 404, condition: "RequirementGroup id does not exist" }
  - { id: ERR_COURSE_NOT_FOUND, http: 404, condition: "Course id does not exist" }
  - { id: ERR_STUDENT_NOT_FOUND, http: 404, condition: "Student id does not exist" }
  - { id: ERR_ENROLLMENT_NOT_FOUND, http: 404, condition: "Enrollment id does not exist" }
  - { id: ERR_STUDENT_PROGRAM_NOT_FOUND, http: 404, condition: "StudentProgram id does not exist" }
  - { id: ERR_WAIVER_NOT_FOUND, http: 404, condition: "SubstitutionWaiver id does not exist" }
  - { id: ERR_APPLICATION_NOT_FOUND, http: 404, condition: "GraduationApplication id does not exist" }
  - { id: ERR_DIPLOMA_NOT_FOUND, http: 404, condition: "Diploma id does not exist" }
  - { id: ERR_PROGRAM_INVALID_STATE, http: 409, condition: "retire on a non-ACTIVE program" }
  - { id: ERR_PROGRAM_RETIRED, http: 409, condition: "declaration or what-if target references a RETIRED program" }
  - { id: ERR_ENROLLMENT_INVALID_STATE, http: 409, condition: "post-grade on non-IN_PROGRESS enrollment, or grade-changes on enrollment not COMPLETED/WITHDRAWN" }
  - { id: ERR_STUDENT_PROGRAM_NOT_ACTIVE, http: 409, condition: "audit/waiver/application/withdraw on a WITHDRAWN or COMPLETED student-program" }
  - { id: ERR_WAIVER_INVALID_STATE, http: 409, condition: "waiver transition attempted from a state that does not allow it" }
  - { id: ERR_APPLICATION_INVALID_STATE, http: 409, condition: "application transition attempted from a state that does not allow it" }
  - { id: ERR_DIPLOMA_INVALID_STATE, http: 409, condition: "issue/revoke from a non-allowed diploma state, or reissue when latest diploma is not REVOKED or application not DEGREE_CONFERRED" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_student_program_version does not match StudentProgram.version (OCC)" }
  - { id: ERR_SELF_APPROVAL_FORBIDDEN, http: 403, condition: "advisor-decision by the same advisor user who requested the waiver" }
  - { id: ERR_UNIQUE_CONSTRAINT_VIOLATION, http: 409, condition: "student_number or course_code already exists" }
  - { id: ERR_CATALOG_RANGE_OVERLAP, http: 409, condition: "half-open catalog-year range overlaps another version of the same program_code (adjacency end==start is allowed)" }
  - { id: ERR_POLICY_RANGE_OVERLAP, http: 409, condition: "closed inclusive effective-year range overlaps another honors policy of the same program (shared boundary year IS an overlap)" }
  - { id: ERR_ACTIVE_APPLICATION_EXISTS, http: 409, condition: "a non-terminal application already exists for the student-program" }
  - { id: ERR_DUPLICATE_ENROLLMENT, http: 409, condition: "an enrollment for (student, course, term) already exists with status IN_PROGRESS or COMPLETED" }
  - { id: ERR_FILING_DEADLINE_PASSED, http: 422, condition: "logical clock is past expected_conferral_date minus 30 days at submit" }
  - { id: ERR_CATALOG_YEAR_OUT_OF_RANGE, http: 422, condition: "catalog_year outside program's [catalog_year_start, catalog_year_end); also what-if target range mismatch" }
  - { id: ERR_ENROLLMENT_NOT_COMPLETED, http: 422, condition: "substitution decision requires the referenced enrollment to be COMPLETED" }
  - { id: ERR_FINAL_AUDIT_REQUIRED, http: 409, condition: "begin-review requires a CURRENT FINAL audit for the student-program" }
  - { id: ERR_AUDIT_NOT_SATISFIED, http: 409, condition: "decide CLEARED requires CURRENT FINAL audit overall_satisfied = true" }
  - { id: ERR_NO_IN_PROGRESS_ENROLLMENTS, http: 409, condition: "decide CONDITIONALLY_CLEARED requires at least one IN_PROGRESS enrollment" }
  - { id: ERR_HONORS_POLICY_MISSING, http: 422, condition: "no honors policy of the program covers the student-program's catalog year at confer" }
  - { id: ERR_FINANCIAL_HOLD, http: 402, condition: "student has a financial hold at submit or begin-review" }
  - { id: ERR_INVALID_PAGINATION_PARAMETERS, http: 400, condition: "limit out of [1,100] or offset negative" }

# =============================================================================
# 1.7 RBAC Matrix
# =============================================================================
roles:
  - name: Student
    description: "Enrolled student acting on their own records; X-User-ID must equal the owning Student.id"
    identity: "entity_backed:Student"
    exclusive_operations:
      - "POST /student-programs/{id}/applications — create own graduation application"
      - "POST /applications/{id}/submit — submit own application"
    shared_operations:
      - "POST /students/{id}/programs — declare own major (shared with RegistrarStaff)"
      - "POST /student-programs/{id}/withdraw — withdraw own declaration (shared with RegistrarStaff)"
      - "POST /student-programs/{id}/audits — STANDARD/WHAT_IF only (shared with Advisor; FINAL/CONDITIONAL RegistrarStaff-only)"
      - "POST /student-programs/{id}/waivers — request exception on own declaration (shared with Advisor)"
      - "POST /substitution-waivers/{id}/resubmit — resubmit (shared with Advisor)"
      - "GET read endpoints scoped to own records"
  - name: Advisor
    description: "Faculty advisor; opaque operator id used for segregation-of-duties comparison against requested_by_user_id"
    identity: "opaque"
    exclusive_operations:
      - "POST /substitution-waivers/{id}/advisor-decision — first step of the waiver approval chain"
    shared_operations:
      - "POST /student-programs/{id}/waivers — request exceptions on behalf of students (shared with Student)"
      - "POST /substitution-waivers/{id}/resubmit (shared with Student)"
      - "POST /student-programs/{id}/audits — STANDARD/WHAT_IF only (shared with Student)"
      - "GET read endpoints"
  - name: RegistrarStaff
    description: "Registrar operator; owns configuration, grading, final waiver approval, certification decisions, conferral, and diploma production"
    identity: "opaque"
    exclusive_operations:
      - "POST /programs, /programs/{id}/retire, requirement-groups, honors-policies, /courses, /students"
      - "POST /students/{id}/enrollments, /enrollments/{id}/post-grade, /enrollments/{id}/grade-changes"
      - "POST /substitution-waivers/{id}/registrar-decision, /substitution-waivers/{id}/revoke"
      - "POST /applications/{id}/begin-review, /decide, /confer"
      - "POST /diplomas/{id}/issue, /revoke, /applications/{id}/diplomas/reissue"
      - "FINAL and CONDITIONAL audit kinds on POST /student-programs/{id}/audits"
    shared_operations:
      - "POST /students/{id}/programs, /student-programs/{id}/withdraw (shared with Student)"
      - "GET read endpoints"
  - name: SystemAdmin
    description: "Test-driving operator for the logical clock"
    identity: "opaque"
    exclusive_operations:
      - "POST /_clock/set_current_utc"
    shared_operations: []
