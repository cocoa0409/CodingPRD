scaffold_corner_design:
  - section: entities
    instances:
      - name: create_scheme_applies_all_declared_defaults
        claim_type: defaults
        grounds:
          - endpoints.POST /accreditation/schemes
          - entities.AccreditationScheme.fields.status
          - entities.AccreditationScheme.fields.rule_revision
          - entities.AccreditationScheme.fields.complexity_multiplier
          - entities.AccreditationScheme.fields.witness_min_count
          - entities.AccreditationScheme.fields.qualification_points_required
          - entities.AccreditationScheme.fields.surveillance_interval_days
          - entities.AccreditationScheme.fields.reassessment_interval_days
          - entities.AccreditationScheme.fields.critical_nc_close_days
          - entities.AccreditationScheme.fields.major_nc_close_days
          - entities.AccreditationScheme.fields.minor_nc_close_days
          - entities.AccreditationScheme.fields.unannounced_authority
          - entities.AccreditationScheme.fields.remote_assessment_allowed
          - response_envelope.success
        distinguishing_aspect: |
          Every optional input of POST /accreditation/schemes is omitted, so all twelve declared
          defaults must appear in the 201 body verbatim - status DRAFT, rule_revision 1,
          complexity_multiplier 1.0, witness_min_count 1, qualification_points_required 60.0,
          365/1460 cycle intervals, 30/60/90 close days, unannounced_authority false and
          remote_assessment_allowed true - and published_at must still be null.
        test_recipe:
          setup:
            - "Empty database; the logical clock is moved to 2026-08-10T00:00:00Z so created_at is deterministic."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-10T00:00:00Z" }
              as: SchemeManager
          trigger:
            - call: "POST /accreditation/schemes"
              payload: { program_code: "ISO17020-INSP", name: "Inspection bodies", standard_ref: "ISO_IEC_17020" }
              as: SchemeManager
              captures: { scheme_id: $.data.id }
          assert:
            - "HTTP 201 and the body carries meta.api_request_id, meta.api_request_timestamp and response_type == \"object\""
            - "AccreditationScheme.${scheme_id}.status == DRAFT"
            - "AccreditationScheme.${scheme_id}.rule_revision == 1"
            - "AccreditationScheme.${scheme_id}.complexity_multiplier == 1.0"
            - "AccreditationScheme.${scheme_id}.witness_min_count == 1"
            - "AccreditationScheme.${scheme_id}.qualification_points_required == 60.0"
            - "AccreditationScheme.${scheme_id}.surveillance_interval_days == 365"
            - "AccreditationScheme.${scheme_id}.reassessment_interval_days == 1460"
            - "AccreditationScheme.${scheme_id}.critical_nc_close_days == 30"
            - "AccreditationScheme.${scheme_id}.major_nc_close_days == 60"
            - "AccreditationScheme.${scheme_id}.minor_nc_close_days == 90"
            - "AccreditationScheme.${scheme_id}.unannounced_authority == false"
            - "AccreditationScheme.${scheme_id}.remote_assessment_allowed == true"
            - "AccreditationScheme.${scheme_id}.published_at is null"
            - "AccreditationScheme.${scheme_id}.revision_note is null"
            - "AccreditationScheme.${scheme_id}.version == 1"

      - name: create_scheme_without_standard_ref_rejected
        claim_type: required_fields
        grounds:
          - endpoints.POST /accreditation/schemes
          - entities.AccreditationScheme.fields.standard_ref
          - validations[priority=3].ERR_INVALID_REQUEST
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: |
          standard_ref is a non-optional input with no default, so omitting it must produce
          ERR_INVALID_REQUEST (400) at priority 3 and persist nothing - a follow-up list of
          schemes must still report total_count 0.
        test_recipe:
          setup:
            - "Empty database; clock at 2026-08-10T00:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-10T00:00:00Z" }
              as: SchemeManager
          trigger:
            - call: "POST /accreditation/schemes"
              payload: { program_code: "ISO17020-INSP", name: "Inspection bodies" }
              as: SchemeManager
          assert:
            - "HTTP 400 with data.error_id == \"ERR_INVALID_REQUEST\" and response_type == \"error\""
            - "GET /accreditation/schemes as SchemeManager returns total_count == 0"

      - name: get_scheme_by_id_returns_the_stored_scheme
        claim_type: retrieval
        grounds:
          - endpoints.GET /accreditation/schemes/{scheme_id}
          - endpoints.POST /accreditation/schemes
          - entities.AccreditationScheme.fields.program_code
        distinguishing_aspect: |
          The single-resource GET must echo exactly the non-default values supplied at creation -
          program_code ISO17025-CAL, witness_min_count 2, qualification_points_required 72.5,
          complexity_multiplier 1.0725 - and the same id that POST minted.
        test_recipe:
          setup:
            - "Clock 2026-08-10; one DRAFT scheme created with explicit non-default rule parameters."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-10T00:00:00Z" }
              as: SchemeManager
            - call: "POST /accreditation/schemes"
              payload: { program_code: "ISO17025-CAL", name: "Calibration laboratories", standard_ref: "ISO_IEC_17025", complexity_multiplier: 1.0725, witness_min_count: 2, qualification_points_required: 72.5 }
              as: SchemeManager
              captures: { scheme_id: $.data.id }
          trigger:
            - call: "GET /accreditation/schemes/${scheme_id}"
              payload: {}
              as: AssessmentManager
          assert:
            - "HTTP 200 and data.id == ${scheme_id}"
            - "AccreditationScheme.${scheme_id}.program_code == \"ISO17025-CAL\""
            - "AccreditationScheme.${scheme_id}.standard_ref == \"ISO_IEC_17025\""
            - "AccreditationScheme.${scheme_id}.complexity_multiplier == 1.0725"
            - "AccreditationScheme.${scheme_id}.witness_min_count == 2"
            - "AccreditationScheme.${scheme_id}.qualification_points_required == 72.5"
            - "AccreditationScheme.${scheme_id}.status == DRAFT"

      - name: get_scheme_with_unknown_uuid_not_found
        claim_type: not_found
        grounds:
          - endpoints.GET /accreditation/schemes/{scheme_id}
          - errors[ERR_SCHEME_NOT_FOUND]
        distinguishing_aspect: |
          A syntactically valid but unknown scheme id must return ERR_SCHEME_NOT_FOUND (404),
          not ERR_INVALID_REQUEST and not an empty 200 body.
        test_recipe:
          setup:
            - "Empty database; clock at 2026-08-10T00:00:00Z; no scheme has ever been created."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-10T00:00:00Z" }
              as: SchemeManager
          trigger:
            - call: "GET /accreditation/schemes/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: SchemeManager
          assert:
            - "HTTP 404 with data.error_id == \"ERR_SCHEME_NOT_FOUND\" and response_type == \"error\""

      - name: list_schemes_applies_pagination_defaults_and_status_filter
        claim_type: listing
        grounds:
          - endpoints.GET /accreditation/schemes
          - response_envelope.pagination_fields
          - response_envelope.pagination_defaults
        distinguishing_aspect: |
          With three schemes stored and no pagination arguments the list must apply limit 10 and
          offset 0, report total_count 3 and has_more false; the status filter must narrow the
          same list to the single PUBLISHED scheme (total_count 1).
        test_recipe:
          setup:
            - "Clock 2026-08-10; three schemes created, one of which is driven DRAFT -> UNDER_REVIEW -> PUBLISHED."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-10T00:00:00Z" }
              as: SchemeManager
            - call: "POST /accreditation/schemes"
              payload: { program_code: "ISO17025-CAL", name: "Calibration laboratories", standard_ref: "ISO_IEC_17025" }
              as: SchemeManager
              captures: { scheme_a: $.data.id }
            - call: "POST /accreditation/schemes"
              payload: { program_code: "ISO17020-INSP", name: "Inspection bodies", standard_ref: "ISO_IEC_17020" }
              as: SchemeManager
              captures: { scheme_b: $.data.id }
            - call: "POST /accreditation/schemes"
              payload: { program_code: "ISO17065-PROD", name: "Product certification bodies", standard_ref: "ISO_IEC_17065" }
              as: SchemeManager
              captures: { scheme_c: $.data.id }
            - call: "POST /accreditation/schemes/${scheme_a}/status"
              payload: { to_status: "UNDER_REVIEW" }
              as: SchemeManager
            - call: "POST /accreditation/schemes/${scheme_a}/status"
              payload: { to_status: "PUBLISHED" }
              as: SchemeManager
          trigger:
            - call: "GET /accreditation/schemes"
              payload: {}
              as: ComplaintOfficer
          assert:
            - "HTTP 200 with response_type == \"array\", limit == 10, offset == 0, total_count == 3 and has_more == false"
            - "the data array holds exactly the three ids ${scheme_a}, ${scheme_b} and ${scheme_c}"
            - "GET /accreditation/schemes with status=PUBLISHED returns total_count == 1 and the single id ${scheme_a}"
            - "GET /accreditation/schemes with status=DRAFT returns total_count == 2"

      - name: new_assessor_lifecycle_fields_are_system_initialized
        claim_type: system_fields
        grounds:
          - endpoints.POST /accreditation/assessors
          - entities.Assessor.fields.qualification_status
          - entities.Assessor.fields.impartiality_status
          - entities.Assessor.fields.committed_witness_days
          - entities.Assessor.fields.available_witness_days
          - entities.Assessor.fields.granted_qualification_count
          - state_machines.Assessor.qualification_status.initial_state
          - state_machines.Assessor.impartiality_status.initial_state
        distinguishing_aspect: |
          POST /accreditation/assessors accepts only four inputs, so both lifecycle dimensions and
          the whole witness-day ledger must be server-initialized: qualification_status APPLICANT,
          impartiality_status UNDECLARED, committed_witness_days 0, available_witness_days equal to
          the supplied annual_witness_capacity_days (12), granted_qualification_count 0 and
          last_screened_on null.
        test_recipe:
          setup:
            - "Clock 2026-08-10; no assessor exists yet."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-10T00:00:00Z" }
              as: SchemeManager
          trigger:
            - call: "POST /accreditation/assessors"
              payload: { full_name: "Lena Ahlgren", email: "lena.ahlgren@ab.test", employment_type: "INTERNAL", annual_witness_capacity_days: 12 }
              as: AssessmentManager
              captures: { assessor_id: $.data.id }
          assert:
            - "HTTP 201 and Assessor.${assessor_id}.qualification_status == APPLICANT"
            - "Assessor.${assessor_id}.impartiality_status == UNDECLARED"
            - "Assessor.${assessor_id}.committed_witness_days == 0"
            - "Assessor.${assessor_id}.available_witness_days == 12"
            - "Assessor.${assessor_id}.annual_witness_capacity_days == 12"
            - "Assessor.${assessor_id}.granted_qualification_count == 0"
            - "Assessor.${assessor_id}.last_screened_on is null"
            - "Assessor.${assessor_id}.suspension_reason is null"
            - "Assessor.${assessor_id}.version == 1"

      - name: impartiality_declaration_is_append_only_and_carries_no_version
        claim_type: immutability
        grounds:
          - entities.ImpartialityDeclaration.common_fields
          - endpoints.POST /accreditation/assessors/{assessor_id}/impartiality-declarations
          - endpoints.GET /accreditation/impartiality-declarations
          - entities.ImpartialityDeclaration.fields.severity_class
          - entities.ImpartialityDeclaration.fields.cooling_off_months
          - entities.ImpartialityDeclaration.fields.declared_by_role
        distinguishing_aspect: |
          ImpartialityDeclaration declares common_fields false, so its 201 body must carry no
          version field and §1.5 offers no update or delete endpoint; closing an ongoing
          relationship is only possible by APPENDING a newer declaration for the same
          (assessor, organization) pair, after which the list for that pair holds 2 rows and the
          older row's ended_on is still null.
        test_recipe:
          setup:
            - "Clock 2026-08-10; one assessor and one applicant organization exist; no declaration has been filed for the pair."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-10T00:00:00Z" }
              as: SchemeManager
            - call: "POST /accreditation/assessors"
              payload: { full_name: "Lena Ahlgren", email: "lena.ahlgren@ab.test", employment_type: "INTERNAL", annual_witness_capacity_days: 20 }
              as: AssessmentManager
              captures: { assessor_id: $.data.id }
            - call: "POST /accreditation/organizations"
              payload: { legal_name: "Northlight Testing AB", country_code: "SE", contact_email: "qa@northlight.test" }
              as: AssessmentManager
              captures: { org_id: $.data.id }
          trigger:
            - call: "POST /accreditation/assessors/${assessor_id}/impartiality-declarations"
              payload: { organization_id: "${org_id}", relationship_type: "EMPLOYMENT", started_on: "2023-01-01", detail: "salaried quality manager, still in post" }
              as: AssessmentManager
              captures: { decl_1: $.data.id }
          assert:
            - "HTTP 201 and the response body for ImpartialityDeclaration.${decl_1} exposes no version field"
            - "ImpartialityDeclaration.${decl_1}.severity_class == STRUCTURAL"
            - "ImpartialityDeclaration.${decl_1}.cooling_off_months == 24"
            - "ImpartialityDeclaration.${decl_1}.declared_by_role == \"AssessmentManager\""
            - "ImpartialityDeclaration.${decl_1}.ended_on is null"
            - "Assessor.${assessor_id}.impartiality_status == RESTRICTED"
            - "§1.5 declares no PATCH, PUT or DELETE endpoint for /accreditation/impartiality-declarations/{declaration_id}"
            - "after appending a second declaration for the same pair with relationship_type EMPLOYMENT, started_on 2023-01-01 and ended_on 2024-06-30, GET /accreditation/impartiality-declarations?assessor_id=${assessor_id}&organization_id=${org_id} returns total_count == 2"
            - "ImpartialityDeclaration.${decl_1}.ended_on is still null after the append"

      - name: create_qualification_under_unknown_assessor_not_found
        claim_type: parent_relationships
        grounds:
          - endpoints.POST /accreditation/assessors/{assessor_id}/qualifications
          - entities.AssessorQualification.parent
          - errors[ERR_ASSESSOR_NOT_FOUND]
        distinguishing_aspect: |
          The nested route's parent segment is resolved before the body: an unknown assessor_id
          must return ERR_ASSESSOR_NOT_FOUND (404) even though the scheme_id in the body is a
          valid PUBLISHED scheme, and no AssessorQualification row may be created.
        test_recipe:
          setup:
            - "Clock 2026-08-10; one PUBLISHED scheme exists; no assessor has ever been created."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-10T00:00:00Z" }
              as: SchemeManager
            - call: "POST /accreditation/schemes"
              payload: { program_code: "ISO17025-CAL", name: "Calibration laboratories", standard_ref: "ISO_IEC_17025" }
              as: SchemeManager
              captures: { scheme_id: $.data.id }
            - call: "POST /accreditation/schemes/${scheme_id}/status"
              payload: { to_status: "UNDER_REVIEW" }
              as: SchemeManager
            - call: "POST /accreditation/schemes/${scheme_id}/status"
              payload: { to_status: "PUBLISHED" }
              as: SchemeManager
          trigger:
            - call: "POST /accreditation/assessors/00000000-0000-4000-8000-000000000001/qualifications"
              payload: { scheme_id: "${scheme_id}", role_type: "LEAD_ASSESSOR", years_experience: 8, declared_witness_days: 6, declared_training_modules: 3, last_witness_on: "2026-05-10" }
              as: AssessmentManager
          assert:
            - "HTTP 404 with data.error_id == \"ERR_ASSESSOR_NOT_FOUND\""
            - "GET /accreditation/qualifications?scheme_id=${scheme_id} returns total_count == 0"

      - name: create_application_with_unknown_scheme_reference_not_found
        claim_type: parent_relationships
        grounds:
          - endpoints.POST /accreditation/applications
          - entities.AccreditationApplication.fields.scheme_id
          - errors[ERR_SCHEME_NOT_FOUND]
          - complexity_profile.entity_topology
        distinguishing_aspect: |
          A foreign key carried in the request BODY is validated for existence just like a path
          parent: a real organization_id combined with an unknown scheme_id must return
          ERR_SCHEME_NOT_FOUND (404), and the organization must stay in APPLIED with no cycle.
        test_recipe:
          setup:
            - "Clock 2026-08-10; one applicant organization exists; no scheme has ever been created."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-10T00:00:00Z" }
              as: SchemeManager
            - call: "POST /accreditation/organizations"
              payload: { legal_name: "Northlight Testing AB", country_code: "SE", contact_email: "qa@northlight.test" }
              as: AssessmentManager
              captures: { org_id: $.data.id }
          trigger:
            - call: "POST /accreditation/applications"
              payload: { organization_id: "${org_id}", scheme_id: "00000000-0000-4000-8000-000000000002", cycle_type: "INITIAL", requested_scope_lines: ["mass calibration 1 mg - 20 kg"], notice_days: 30 }
              as: AssessmentManager
          assert:
            - "HTTP 404 with data.error_id == \"ERR_SCHEME_NOT_FOUND\""
            - "ApplicantOrganization.${org_id}.status == APPLIED"
            - "GET /accreditation/applications?organization_id=${org_id} returns total_count == 0"

      - name: team_assignment_junction_links_one_assessor_to_two_cycles
        claim_type: parent_relationships
        grounds:
          - complexity_profile.entity_topology
          - entities.TeamAssignment.fields.application_id
          - entities.TeamAssignment.fields.assessor_id
          - endpoints.GET /accreditation/team-assignments
          - state_machines.TeamAssignment.PROPOSED_to_CONFIRMED
        distinguishing_aspect: |
          The graph topology is carried by the TeamAssignment junction: one assessor must be able
          to hold CONFIRMED assignments on two different organizations' cycles at once, so
          GET /accreditation/team-assignments?assessor_id=... returns total_count 2 while the same
          list filtered by each application_id returns total_count 1.
        test_recipe:
          setup:
            - "Clock 2026-08-10; one PUBLISHED scheme; one GRANTED, QUALIFIED and SCREENED LEAD_ASSESSOR (verified 6 years, 4 witness days, 1 training module)."
            - "Two distinct applicant organizations each with their own INITIAL cycle on that scheme."
            - "The assessor is PROPOSED on both cycles and already CONFIRMED on the first."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-10T00:00:00Z" }
              as: SchemeManager
            - call: "POST /accreditation/schemes"
              payload: { program_code: "ISO17025-CAL", name: "Calibration laboratories", standard_ref: "ISO_IEC_17025", witness_min_count: 2, qualification_points_required: 60.0 }
              as: SchemeManager
              captures: { scheme_id: $.data.id }
            - call: "POST /accreditation/schemes/${scheme_id}/status"
              payload: { to_status: "UNDER_REVIEW" }
              as: SchemeManager
            - call: "POST /accreditation/schemes/${scheme_id}/status"
              payload: { to_status: "PUBLISHED" }
              as: SchemeManager
            - call: "POST /accreditation/assessors"
              payload: { full_name: "Bruno Katz", email: "bruno.katz@ab.test", employment_type: "CONTRACT", annual_witness_capacity_days: 20 }
              as: AssessmentManager
              captures: { lead_id: $.data.id }
            - call: "POST /accreditation/assessors/${lead_id}/qualifications"
              payload: { scheme_id: "${scheme_id}", role_type: "LEAD_ASSESSOR", years_experience: 6, declared_witness_days: 4, declared_training_modules: 1, last_witness_on: "2026-05-10" }
              as: AssessmentManager
              captures: { lead_q_id: $.data.id }
            - call: "POST /accreditation/qualifications/${lead_q_id}/verify-evidence"
              payload: { verified_years_experience: 6, verified_witness_days: 4, verified_training_modules: 1 }
              as: SchemeManager
            - call: "POST /accreditation/assessors/${lead_id}/screen"
              payload: {}
              as: SchemeManager
            - call: "POST /accreditation/organizations"
              payload: { legal_name: "Northlight Testing AB", country_code: "SE", contact_email: "qa@northlight.test" }
              as: AssessmentManager
              captures: { org_1: $.data.id }
            - call: "POST /accreditation/organizations"
              payload: { legal_name: "Meridian Calibration Oy", country_code: "FI", contact_email: "qa@meridian.test" }
              as: AssessmentManager
              captures: { org_2: $.data.id }
            - call: "POST /accreditation/applications"
              payload: { organization_id: "${org_1}", scheme_id: "${scheme_id}", cycle_type: "INITIAL", requested_scope_lines: ["mass calibration 1 mg - 20 kg"], notice_days: 30 }
              as: AssessmentManager
              captures: { app_1: $.data.id }
            - call: "POST /accreditation/applications"
              payload: { organization_id: "${org_2}", scheme_id: "${scheme_id}", cycle_type: "INITIAL", requested_scope_lines: ["temperature calibration -40 C - 250 C"], notice_days: 30 }
              as: AssessmentManager
              captures: { app_2: $.data.id }
            - call: "POST /accreditation/applications/${app_1}/team-assignments"
              payload: { assessor_id: "${lead_id}", role_type: "LEAD_ASSESSOR" }
              as: AssessmentManager
              captures: { ta_1: $.data.id }
            - call: "POST /accreditation/team-assignments/${ta_1}/confirm"
              payload: {}
              as: AssessmentManager
            - call: "POST /accreditation/applications/${app_2}/team-assignments"
              payload: { assessor_id: "${lead_id}", role_type: "LEAD_ASSESSOR" }
              as: AssessmentManager
              captures: { ta_2: $.data.id }
          trigger:
            - call: "POST /accreditation/team-assignments/${ta_2}/confirm"
              payload: {}
              as: AssessmentManager
          assert:
            - "HTTP 200 and TeamAssignment.${ta_2}.status == CONFIRMED"
            - "TeamAssignment.${ta_1}.status == CONFIRMED"
            - "GET /accreditation/team-assignments?assessor_id=${lead_id} returns total_count == 2"
            - "GET /accreditation/team-assignments?application_id=${app_1} returns total_count == 1"
            - "GET /accreditation/team-assignments?application_id=${app_2} returns total_count == 1"
            - "AccreditationApplication.${app_1}.status == TEAM_ASSIGNED"
            - "AccreditationApplication.${app_2}.status == TEAM_ASSIGNED"
            - "ApplicantOrganization.${org_1}.status == UNDER_ASSESSMENT"
            - "ApplicantOrganization.${org_2}.status == UNDER_ASSESSMENT"

      - name: scheme_status_with_undeclared_enum_member_rejected
        claim_type: type_constraints
        grounds:
          - endpoints.POST /accreditation/schemes/{scheme_id}/status
          - entities.AccreditationScheme.fields.status
          - validations[priority=3].ERR_INVALID_REQUEST
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: |
          to_status is an enum input, so a value outside {DRAFT, UNDER_REVIEW, PUBLISHED,
          WITHDRAWN} must fail the priority-3 shape gate with ERR_INVALID_REQUEST (400) and NOT
          the priority-8 ERR_INVALID_STATE_TRANSITION - shape precedes state.
        test_recipe:
          setup:
            - "Clock 2026-08-10; one DRAFT scheme exists."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-10T00:00:00Z" }
              as: SchemeManager
            - call: "POST /accreditation/schemes"
              payload: { program_code: "ISO17025-CAL", name: "Calibration laboratories", standard_ref: "ISO_IEC_17025" }
              as: SchemeManager
              captures: { scheme_id: $.data.id }
          trigger:
            - call: "POST /accreditation/schemes/${scheme_id}/status"
              payload: { to_status: "ARCHIVED" }
              as: SchemeManager
          assert:
            - "HTTP 400 with data.error_id == \"ERR_INVALID_REQUEST\""
            - "AccreditationScheme.${scheme_id}.status is still DRAFT"
            - "AccreditationScheme.${scheme_id}.version is still 1"

      - name: qualification_declared_points_is_computed_at_creation
        claim_type: computed_fields
        grounds:
          - entities.AssessorQualification.fields.declared_points
          - calculations.assessor_competence_points
        excluded_because:
          difficulty_instance: dual_variant_calc / competence_points_declared_provisional_vs_verified_final_diverge
          rationale: "That §1.8 instance already pins declared_points == 92.00 from the DECLARED_PROVISIONAL variant at qualification creation and shows the client cannot supply it, since POST /accreditation/assessors/{assessor_id}/qualifications declares no declared_points input."

  - section: state_machines
    instances:
      - name: newly_created_scheme_starts_in_the_declared_initial_state
        claim_type: initial_state
        grounds:
          - state_machines.AccreditationScheme.initial_state
          - endpoints.POST /accreditation/schemes
        distinguishing_aspect: |
          A scheme is born in DRAFT with published_at null and rule_revision 1, so it is invisible
          to cycle creation: POST /accreditation/applications against it must fail with
          ERR_SCHEME_NOT_PUBLISHED until the DRAFT -> UNDER_REVIEW -> PUBLISHED path has run.
        test_recipe:
          setup:
            - "Clock 2026-08-10; one applicant organization exists; the scheme is created but never transitioned."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-10T00:00:00Z" }
              as: SchemeManager
            - call: "POST /accreditation/organizations"
              payload: { legal_name: "Northlight Testing AB", country_code: "SE", contact_email: "qa@northlight.test" }
              as: AssessmentManager
              captures: { org_id: $.data.id }
          trigger:
            - call: "POST /accreditation/schemes"
              payload: { program_code: "ISO17025-CAL", name: "Calibration laboratories", standard_ref: "ISO_IEC_17025" }
              as: SchemeManager
              captures: { scheme_id: $.data.id }
          assert:
            - "AccreditationScheme.${scheme_id}.status == DRAFT"
            - "AccreditationScheme.${scheme_id}.published_at is null"
            - "AccreditationScheme.${scheme_id}.rule_revision == 1"
            - "POST /accreditation/applications with organization_id ${org_id}, scheme_id ${scheme_id}, cycle_type INITIAL, requested_scope_lines [\"mass calibration 1 mg - 20 kg\"] and notice_days 30 as AssessmentManager returns HTTP 422 with data.error_id == \"ERR_SCHEME_NOT_PUBLISHED\""

      - name: withdrawn_scheme_rejects_every_further_status_change
        claim_type: terminal_state_lockdown
        grounds:
          - state_machines.AccreditationScheme.terminal_states
          - state_machines.AccreditationScheme.PUBLISHED_to_WITHDRAWN
          - validations[priority=8].ERR_INVALID_STATE_TRANSITION
          - errors[ERR_INVALID_STATE_TRANSITION]
        distinguishing_aspect: |
          WITHDRAWN is the scheme's only terminal state and no transition leaves it, so re-opening
          a withdrawn scheme for revision must return ERR_INVALID_STATE_TRANSITION (409) and leave
          both status and version untouched.
        test_recipe:
          setup:
            - "Clock 2026-08-10; one scheme driven DRAFT -> UNDER_REVIEW -> PUBLISHED -> WITHDRAWN, so its version is 4."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-10T00:00:00Z" }
              as: SchemeManager
            - call: "POST /accreditation/schemes"
              payload: { program_code: "ISO17025-CAL", name: "Calibration laboratories", standard_ref: "ISO_IEC_17025" }
              as: SchemeManager
              captures: { scheme_id: $.data.id }
            - call: "POST /accreditation/schemes/${scheme_id}/status"
              payload: { to_status: "UNDER_REVIEW" }
              as: SchemeManager
            - call: "POST /accreditation/schemes/${scheme_id}/status"
              payload: { to_status: "PUBLISHED" }
              as: SchemeManager
            - call: "POST /accreditation/schemes/${scheme_id}/status"
              payload: { to_status: "WITHDRAWN" }
              as: SchemeManager
          trigger:
            - call: "POST /accreditation/schemes/${scheme_id}/status"
              payload: { to_status: "UNDER_REVIEW" }
              as: SchemeManager
          assert:
            - "HTTP 409 with data.error_id == \"ERR_INVALID_STATE_TRANSITION\""
            - "AccreditationScheme.${scheme_id}.status is still WITHDRAWN"
            - "AccreditationScheme.${scheme_id}.version is still 4"
            - "a second attempt with to_status DRAFT also returns HTTP 409 ERR_INVALID_STATE_TRANSITION"

