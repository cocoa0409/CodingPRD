              payload: { program_name: "PV1", base_currency: "USD", total_nav_budget: 50000000, strategy_cap_pct: 0.30, manager_cap_pct: 0.25, max_vintage_band_years: 4, liquidity_buffer_min: 1000000, overdue_grace_days: 10, secondary_premium_cap_pct: 0.05, secondary_discount_cap_pct: 0.10 }
              as: CIO
              captures: { prog: $.data.id }
            - call: "POST /fof/programs/${prog}/ledger-entries"
              payload: { entry_kind: "CONTRIBUTION", amount: 5000000 }
              as: OperationsAnalyst
              as_user_id: "${ops}"
            - call: "POST /fof/programs/${prog}/open"
              payload: {}
              as: CIO
            - call: "POST /fof/programs/${prog}/suspend"
              payload: {}
              as: CIO
          trigger:
            - call: "POST /fof/programs/${prog}/ledger-entries"
