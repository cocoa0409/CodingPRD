            - call: POST /prize-awards/${awA_id}/approve
              as: FinanceOfficer
              as_user_id: "fin-approve-1"
            - call: POST /race-editions/${ed_id}/settle-purse
              as: FinanceOfficer
              captures: { err5: "$.data.error_id" }
            - call: POST /prize-awards/${awA_id}/pay
              payload: { payment_reference: "TRSY-SG-1" }
              as: FinanceOfficer
              as_user_id: "fin-approve-1"
              captures: { err6: "$.data.error_id" }
            - call: POST /prize-awards/${awA_id}/pay
              payload: { payment_reference: "TRSY-SG-1" }
              as: FinanceOfficer
              as_user_id: "fin-pay-2"
            - call: POST /race-editions/${ed_id}/settle-purse
              as: FinanceOfficer
          assert:
            - "trigger call 1 returns HTTP 409 with error_id == ERR_RESULTS_NOT_ALL_ADJUDICATED — both results are PROVISIONAL, so there is not even one CERTIFIED result"
            - "trigger call 3 returns HTTP 409 with error_id == ERR_RESULTS_NOT_ALL_ADJUDICATED — one CERTIFIED result is not enough while the sibling is still PROVISIONAL"
            - "trigger call 5 returns HTTP 200 with status == RESULTS_CERTIFIED once every result is adjudicated"
            - "trigger call 6 returns HTTP 409 with error_id == ERR_AWARDS_NOT_ALL_SETTLED — settle-purse before compute-awards has zero awards but the edition also has an un-run award computation, so the award gate fires rather than a success"
            - "trigger call 7 returns purse_allocated_cents == 1000000 and purse_unallocated_cents == 7000000 with exactly one COMPUTED award"
            - "trigger call 8 returns HTTP 409 with error_id == ERR_AWARDS_NOT_ALL_SETTLED — the single award is COMPUTED"
            - "trigger call 10 returns status == APPROVED with approved_by_user_id == \"fin-approve-1\""
            - "trigger call 11 returns HTTP 409 with error_id == ERR_AWARDS_NOT_ALL_SETTLED — APPROVED is still not a settled status"
            - "trigger call 12 returns HTTP 403 with error_id == ERR_SEGREGATION_OF_DUTIES — the approver may not also pay"
            - "trigger call 13 returns status == PAID with paid_by_user_id == \"fin-pay-2\", paid_at == \"2026-11-01T09:00:00.000Z\" and payment_reference == \"TRSY-SG-1\""
            - "trigger call 14 returns HTTP 200 with status == PURSE_SETTLED, purse_allocated_cents == 1000000 and purse_unallocated_cents == 7000000"

      - name: corner_endpoint_computed_read_of_edition_ledger
        claim_type: computed_read
        grounds:
          - endpoints[GET /race-editions/{id}]
        excluded_because:
          difficulty_instance: compensating_invariant / compensating_purse_ledger_invariant_across_disqualification_and_recompute
          rationale: "That §1.8 instance reads the edition ledger three times and asserts the derived purse figures against the award set each time."

      - name: corner_endpoint_cross_reference_link_result_to_invitation
        claim_type: cross_reference_link
        grounds:
          - endpoints[POST /race-results]
        excluded_because:
          difficulty_instance: cross_entity_state_dependency / cross_entity_race_result_rejected_for_withdrawn_invitation
          rationale: "That §1.8 instance requires both edition and invitation to exist, match and be ACCEPTED before the link is created."

  # ===========================================================================
  # From Table 6 (Errors) — catalog triggerability sweep
  # ===========================================================================
  - section: errors
    instances:
      - name: corner_error_unauthenticated_and_unknown_id_sweep_returns_401_and_404
        claim_type: violation_to_error
        grounds:
          - errors.ERR_UNAUTHENTICATED
          - errors.ERR_INVITATION_NOT_FOUND
          - errors.ERR_DOPING_TEST_NOT_FOUND
          - errors.ERR_RACE_RESULT_NOT_FOUND
          - errors.ERR_PRIZE_AWARD_NOT_FOUND
        distinguishing_aspect: >-
          Authentication is checked before anything else (priority 1) and existence before any
          business rule (priority 5), so a request with no X-User-Role gets 401 even when its target
          id is also bogus, and each of the four remaining catalog 404s is reachable through its own
          read endpoint with a syntactically valid but unknown UUID.
        test_recipe:
          setup:
            - "An empty store apart from one athlete, so the 404s are genuine misses rather than empty-database artefacts."
            - "UNKNOWN_UUID is the syntactically valid, never-issued id 00000000-0000-4000-8000-000000000000."
          setup_api_calls:
            - call: POST /_clock/set_current_utc
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ElitesDirector
            - call: POST /athletes
              payload: { full_name: "Sweep Sam", country_code: USA, gender: MALE, birth_date: "1997-03-03" }
              as: ElitesDirector
              captures: { ath_id: "$.data.id" }
          trigger:
            - call: GET /athletes/${ath_id}
              as: NO_ROLE_HEADER_SENT
              captures: { err1: "$.data.error_id" }
            - call: GET /athletes/${ath_id}
              as: RaceAnnouncer
              captures: { err2: "$.data.error_id" }
            - call: GET /invitations/00000000-0000-4000-8000-000000000000
              as: ElitesDirector
              captures: { err3: "$.data.error_id" }
            - call: GET /doping-tests/00000000-0000-4000-8000-000000000000
              as: AntiDopingLiaison
              captures: { err4: "$.data.error_id" }
            - call: GET /race-results/00000000-0000-4000-8000-000000000000
              as: TechnicalOfficial
              captures: { err5: "$.data.error_id" }
            - call: GET /prize-awards/00000000-0000-4000-8000-000000000000
              as: FinanceOfficer
              captures: { err6: "$.data.error_id" }
            - call: GET /invitations/00000000-0000-4000-8000-000000000000
              as: NO_ROLE_HEADER_SENT
              captures: { err7: "$.data.error_id" }
          assert:
            - "trigger call 1 (no X-User-Role header) returns HTTP 401 with error_id == ERR_UNAUTHENTICATED"
            - "trigger call 2 (X-User-Role: RaceAnnouncer, not one of the six declared roles) returns HTTP 401 with error_id == ERR_UNAUTHENTICATED — an unrecognised role is unauthenticated, not merely unauthorised"
            - "trigger call 3 returns HTTP 404 with error_id == ERR_INVITATION_NOT_FOUND"
            - "trigger call 4 returns HTTP 404 with error_id == ERR_DOPING_TEST_NOT_FOUND"
            - "trigger call 5 returns HTTP 404 with error_id == ERR_RACE_RESULT_NOT_FOUND"
            - "trigger call 6 returns HTTP 404 with error_id == ERR_PRIZE_AWARD_NOT_FOUND"
            - "trigger call 7 returns HTTP 401 with error_id == ERR_UNAUTHENTICATED — authentication outranks existence, so the unknown invitation id is never even looked up"
            - "every error response follows the §1.0 envelope: ok == false with error_id, message and no data payload leakage"

      - name: corner_error_invalid_doping_test_state_and_invalid_award_state
        claim_type: violation_to_error
        grounds:
          - errors.ERR_INVALID_DOPING_TEST_STATE
          - errors.ERR_INVALID_AWARD_STATE
          - state_machines.DopingTest
          - state_machines.PrizeAward
        distinguishing_aspect: >-
          Both of these 409s are pure re-entry guards on two unrelated state machines: a sample can be
          collected only from SCHEDULED and adjudicated only from COLLECTED, and an award can be
          approved only from COMPUTED and paid only from APPROVED — so every second attempt at each of
          the four transitions is refused with its own state error while the stored row is untouched.
        test_recipe:
          setup:
            - "Edition with total_purse_cents 8,000,000, one OVERALL MALE place-1 line of 1,000,000 and a course record of 7000 so no record claim is raised."
            - "One ACCEPTED, bibbed ELITE MALE athlete with an IN_COMPETITION doping test SCHEDULED for race day; the field is locked and the clock is on race day."
          setup_api_calls:
            - call: POST /_clock/set_current_utc
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ElitesDirector
            - call: POST /race-editions
              payload: { name: "State Guard Marathon", city: "Metro City", race_date: "2026-11-01", appearance_budget_cents: 9000000, total_purse_cents: 8000000, bonus_pool_cap_cents: 0, course_record_male_seconds: 7000 }
              as: ElitesDirector
              captures: { ed_id: "$.data.id" }
            - call: POST /division-standards
              payload: { race_edition_id: "${ed_id}", division: ELITE, gender: MALE, max_qualifying_seconds: 8100, bib_range_start: 11, bib_range_end: 20 }
              as: ElitesDirector
            - call: POST /purse-lines
              payload: { race_edition_id: "${ed_id}", category: OVERALL, gender: MALE, place: 1, amount_cents: 1000000 }
              as: ElitesDirector
            - call: POST /race-editions/${ed_id}/open-field
              as: ElitesDirector
            - call: POST /rep-agents
              payload: { agency_name: "State Guard Reps", license_code: "AGT-SGD-1" }
              as: ElitesDirector
              captures: { agt_id: "$.data.id" }
            - call: POST /athletes
              payload: { full_name: "Guard Gus", country_code: USA, gender: MALE, birth_date: "1997-04-04", whereabouts_filed: true }
              as: ElitesDirector
              captures: { ath_id: "$.data.id" }
            - call: POST /performance-records
              payload: { athlete_id: "${ath_id}", race_name: "Qual SGD", performance_date: "2026-03-01", performance_seconds: 7900, division: ELITE, sanctioning_ref: "SB-SGD-1", chip_timed: true }
              as: AthleteAgent
              as_user_id: "${agt_id}"
              captures: { pr_id: "$.data.id" }
            - call: POST /performance-records/${pr_id}/verification
              payload: { decision: VERIFIED, official_seconds: 7900 }
              as: TechnicalOfficial
            - call: POST /invitations
              payload: { race_edition_id: "${ed_id}", athlete_id: "${ath_id}", agent_id: "${agt_id}", qualifying_performance_id: "${pr_id}", division: ELITE }
              as: ElitesDirector
              captures: { inv_id: "$.data.id" }
            - call: POST /invitations/${inv_id}/offer
              payload: { appearance_fee_cents: 400000, air_class: ECONOMY, hotel_nights: 2, ground_transport: false }
              as: ElitesDirector
            - call: POST /invitations/${inv_id}/respond
              payload: { decision: ACCEPT }
              as: AthleteAgent
              as_user_id: "${agt_id}"
            - call: POST /invitations/${inv_id}/assign-bib
              as: ElitesDirector
            - call: POST /doping-tests
              payload: { athlete_id: "${ath_id}", race_edition_id: "${ed_id}", test_type: IN_COMPETITION, window_start_at: "2026-11-01T09:00:00Z", window_end_at: "2026-11-01T18:00:00Z", sample_code: "S-SGD-1" }
              as: AntiDopingLiaison
              captures: { test_id: "$.data.id" }
            - call: POST /race-editions/${ed_id}/lock-field
              as: ElitesDirector
            - call: POST /_clock/set_current_utc
              payload: { to_iso8601: "2026-11-01T10:00:00Z" }
              as: TechnicalOfficial
            - call: POST /race-editions/${ed_id}/mark-raced
              as: TechnicalOfficial
          trigger:
            - call: POST /doping-tests/${test_id}/adjudicate
              payload: { outcome: CLEARED }
              as: SanctioningBody
              captures: { err1: "$.data.error_id" }
            - call: POST /doping-tests/${test_id}/collect
              payload: { collected_sample_ref: "COC-SGD-1" }
              as: AntiDopingLiaison
            - call: POST /doping-tests/${test_id}/collect
              payload: { collected_sample_ref: "COC-SGD-2" }
              as: AntiDopingLiaison
              captures: { err2: "$.data.error_id" }
            - call: POST /doping-tests/${test_id}/adjudicate
              payload: { outcome: CLEARED, outcome_notes: "clean" }
              as: SanctioningBody
            - call: POST /doping-tests/${test_id}/adjudicate
              payload: { outcome: ADVERSE, outcome_notes: "second thoughts" }
              as: SanctioningBody
              captures: { err3: "$.data.error_id" }
            - call: POST /race-results
              payload: { race_edition_id: "${ed_id}", invitation_id: "${inv_id}", gun_seconds: 7400, net_seconds: 7398 }
