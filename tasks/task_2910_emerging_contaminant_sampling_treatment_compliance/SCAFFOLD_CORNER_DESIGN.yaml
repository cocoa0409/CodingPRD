              as: TreatmentEngineer
              captures: { ix_id: "$.data.id" }
            - call: "POST /pilot-tests/${gac_id}/start"
              payload: {}
              as: TreatmentEngineer
            - call: "POST /pilot-tests/${gac_id}/complete"
              payload: { influent_ng_per_l: 50.00, effluent_ng_per_l: 1.85, bed_volumes_treated: 25000.00, spent_media_kg: 800.00 }
              as: TreatmentEngineer
            - call: "POST /pilot-tests/${ix_id}/start"
              payload: {}
              as: TreatmentEngineer
            - call: "POST /pilot-tests/${ix_id}/complete"
              payload: { influent_ng_per_l: 50.00, effluent_ng_per_l: 4.00, bed_volumes_treated: 18000.00, spent_media_kg: 300.00 }
              as: TreatmentEngineer
            - call: "POST /treatment-evaluations/${eval_id}/decision"
              payload: { action: "SELECT", decision_note: "GAC scores highest above the removal floor" }
              as: TreatmentEngineer
            - call: "GET /capital-projects?treatment_evaluation_id=${eval_id}"
              payload: {}
              as: FinanceOfficer
              captures: { proj_id: "$.data[0].id" }
            - call: "POST /cost-recovery-claims"
              payload: { entry_point_id: "${ep_id}", capital_project_id: "${proj_id}", responsible_party_name: "Ridgeline Coatings", investigation_basis: "UPSTREAM_DISCHARGER", allocation_pct: 50.00, investigation_cost_cents: 2000000 }
              as: ComplianceOfficer
              as_user_id: "officer-1"
              captures: { claim_id: "$.data.id" }
          trigger:
            - call: "POST /cost-recovery-claims/${claim_id}/resolve"
              payload: { action: "SETTLE", recovered_cents: 100000000, resolution_note: "Settling before filing" }
              as: FinanceOfficer
              captures: { e_before_filing: "$.data.error_id" }
            - call: "POST /cost-recovery-claims/${claim_id}/file"
              payload: { claimed_cents: 300000000 }
