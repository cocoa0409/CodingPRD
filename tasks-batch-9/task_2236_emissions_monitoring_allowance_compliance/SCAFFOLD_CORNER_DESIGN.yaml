  - section: state_machines
    instances:

      - name: sm_every_machine_starts_in_its_declared_initial_state
        claim_type: initial_state
        grounds:
          - state_machines.MonitoringSystem.initial_states
          - state_machines.RataTest
          - state_machines.FuelSample
          - state_machines.QuarterlyReport
          - state_machines.ControlOutageWindow
          - state_machines.AllowanceAccount
          - state_machines.AllowanceTransaction
          - state_machines.Unit
        distinguishing_aspect: "Eight freshly created rows sit in exactly the declared initial state — including the MonitoringSystem's two-dimensional (RECERTIFICATION_PENDING, CAL_EXPIRED) start — and no create call accepts a status input."
        test_recipe:
          setup:
            - "logical clock at 2026-08-01T00:00:00Z"
