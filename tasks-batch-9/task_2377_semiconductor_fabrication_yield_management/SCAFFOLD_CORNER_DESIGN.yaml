            - "${err} == ERR_STALE_LOT_VERSION"
            - "Lot.${lot1}.wafer_count == 25"
            - "Lot.${lot1}.version == ${lot_v1}"
            - "GET /fab/lots?parent_lot_id=${lot1} returns meta.total_count == 0"

      - name: the_fourth_consecutive_one_sigma_point_trips_the_western_electric_run_rule
        claim_type: rate_threshold_triggers
        grounds:
          - calculations.spc_violation_classification
          - entities.SpcChart.fields.consecutive_same_side_count
          - entities.Excursion.fields.source_type
        distinguishing_aspect: "The run rule is a counting trigger independent of the classification ladder: four successive 103.00 readings are each classified IN_CONTROL (3.00 off target is one and a half sigma, short of both the 2-sigma WARN band and the 106.00 control limit), yet the fourth pushes consecutive_same_side_count to 4, sets run_rule_triggered true and opens an SPC Excursion with severity_score 21.00 LOW and no out-of-spec penalty."
        test_recipe:
          setup:
            - "Flow FLOW-A (LOGIC_N5) RELEASED with one metrology-required step seq 10 LITHO 2.0h and SpcChart CD on it (target 100.00, sigma 2.00, usl 110.00, lsl 90.00, ucl 106.00, lcl 94.00)."
            - "CH_L1 QUALIFIED on LITHO-1; operator OP-001 GOWNED and LITHO-certified; PLAN-A COMMITTED; LOT-001 (3 wafers) RELEASED and tracked in at seq 10."
            - "Three 103.00 measurements are already filed against the run, leaving the chart MONITORING with consecutive_same_side_count 3, last_side ABOVE and violation_count 0."
