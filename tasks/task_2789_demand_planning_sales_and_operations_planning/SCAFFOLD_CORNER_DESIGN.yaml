              as: SopAdmin
              captures: { item_a: $.data.id }
            - call: "POST /sop/items"
              payload: { sku: "SKU-B", family_id: "${fam_b}", unit_price_cents: 1000, unit_cost_cents: 400, on_hand_units: 0, material_supply_cap_units: 100000, avg_monthly_demand_units: 1000, lifecycle_state: "MATURE" }
              as: SopAdmin
              captures: { item_b: $.data.id }
            - call: "POST /sop/customers"
              payload: { customer_code: "CUST-BASE", name: "Base Grocery", channel: "GROCERY", priority_rank: 3 }
              as: SopAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /sop/planning-cycles"
              payload: { cycle_code: "CY-BIAS", horizon_start_month: "2026-09", horizon_end_month: "2026-09", financial_commitment_cents: 0, supply_review_policy: "NET_INVENTORY_FIRST" }
              as: SopAdmin
              captures: { cycle_id: $.data.id }
            - call: "POST /sop/demand-forecasts"
              payload: { cycle_id: "${cycle_id}", item_id: "${item_a}", customer_id: "${cust_id}", month: "2026-09", level_units: 950, trend_units_per_month: 0, seasonal_index: 1.0, causal_uplift_pct: 0 }
              as: DemandPlanner
              as_user_id: "planner-a"
            - call: "POST /sop/demand-forecasts"
              payload: { cycle_id: "${cycle_id}", item_id: "${item_b}", customer_id: "${cust_id}", month: "2026-09", level_units: 951, trend_units_per_month: 0, seasonal_index: 1.0, causal_uplift_pct: 0 }
              as: DemandPlanner
              as_user_id: "planner-b"
            - call: "POST /sop/planning-cycles/${cycle_id}/transitions"
              payload: { target_status: "SUPPLY_REVIEW" }
              as: SopAdmin
            - call: "POST /sop/planning-cycles/${cycle_id}/transitions"
              payload: { target_status: "SCENARIO_REVIEW" }
              as: SopAdmin
            - call: "POST /sop/planning-cycles/${cycle_id}/transitions"
              payload: { target_status: "EXECUTIVE_REVIEW" }
              as: SopAdmin
            - call: "POST /sop/planning-cycles/${cycle_id}/transitions"
              payload: { target_status: "PUBLISHED" }
