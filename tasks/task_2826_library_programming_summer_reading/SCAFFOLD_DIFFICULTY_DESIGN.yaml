          Parallel shape rather than a cycle: one Program carries two independent status dimensions.
          Creating a contract for a minors-serving program moves compliance_status
          UNVERIFIED -> PENDING_SCREENING while operational_status stays DRAFT; the schedule call then
          moves operational_status DRAFT -> SCHEDULED while compliance_status stays PENDING_SCREENING;
