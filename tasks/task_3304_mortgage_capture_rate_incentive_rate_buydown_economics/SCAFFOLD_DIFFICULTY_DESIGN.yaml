            - "HomeSaleContract.${ct1}.contract_status == PENDING"
            - "IncentiveAllocation.${al1}.allocation_status == PENDING and IncentiveAllocation.${al2}.allocation_status == PENDING"
            - "Buyer.${b1}.total_incentive_received_cents == 6000000"
            - "HomeSite.${hs1}.home_site_status == UNDER_CONTRACT"

      - name: void_then_relock_conserves_commitment_unit_pool
        grounds:
          - state_machines.RateLock.ACTIVE_to_VOIDED
          - state_machines.RateLock.EXPIRED_to_ACTIVE
          - state_machines.ForwardCommitment.EXHAUSTED_to_OPEN
          - entities.ForwardCommitment.fields.units_available
          - entities.ForwardCommitment.fields.units_drawn
          - entities.ForwardCommitment.fields.units_released
          - calculations.forward_commitment_draw_down
        distinguishing_aspect: |
          The conserved quantity is a unit-count pool rather than cents: consuming a unit then
          releasing it through a void returns units_available to exactly its original value,
          witnessable as committed_units - units_drawn + units_released == committed_units.
        test_recipe:
          setup:
            - "commitment fc1 with three units; three contracts each holding one active lock against it"
          setup_api_calls:
            - call: "POST /housing/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /housing/communities"
              payload: { name: "C1", state_code: "TX", incentive_policy_code: "STANDARD", price_reduction_cap_cents: 3000000, closing_cost_cap_cents: 2000000, rate_buydown_cap_cents: 6000000 }
              as: PlatformAdmin
              captures: { cm1: $.data.id }
            - call: "POST /housing/buyers"
              payload: { full_name: "Ada", email: "ada@x.com", state_code: "TX" }
              as: SalesCounselor
              captures: { b1: $.data.id }
            - call: "POST /housing/communities/${cm1}/home-sites"
              payload: { lot_number: "L1", address: "1 Elm", base_price_cents: 50000000, construction_stage: "FINISH", estimated_completion_iso: "2026-10-01T00:00:00Z", advertised_rate_bps: 499, advertised_rate_expires_iso: "2027-01-01T00:00:00Z" }
              as: SalesCounselor
              captures: { hs1: $.data.id }
            - call: "POST /housing/communities/${cm1}/home-sites"
              payload: { lot_number: "L2", address: "2 Elm", base_price_cents: 50000000, construction_stage: "FINISH", estimated_completion_iso: "2026-10-01T00:00:00Z", advertised_rate_bps: 499, advertised_rate_expires_iso: "2027-01-01T00:00:00Z" }
              as: SalesCounselor
              captures: { hs2: $.data.id }
            - call: "POST /housing/communities/${cm1}/home-sites"
              payload: { lot_number: "L3", address: "3 Elm", base_price_cents: 50000000, construction_stage: "FINISH", estimated_completion_iso: "2026-10-01T00:00:00Z", advertised_rate_bps: 499, advertised_rate_expires_iso: "2027-01-01T00:00:00Z" }
              as: SalesCounselor
              captures: { hs3: $.data.id }
            - call: "POST /housing/communities/${cm1}/forward-commitments"
              payload: { commitment_code: "FC1", investor_name: "Fannie", committed_rate_bps: 499, committed_units: 3, commitment_start_iso: "2026-09-01T00:00:00Z", commitment_end_iso: "2030-01-01T00:00:00Z" }
              as: MortgageBanker
              captures: { fc1: $.data.id }
            - call: "POST /housing/home-sites/${hs1}/contracts"
              payload: { buyer_id: "${b1}", purchase_price_cents: 50000000, earnest_money_cents: 2000000 }
              as: SalesCounselor
              captures: { ct1: $.data.id }
            - call: "POST /housing/contracts/${ct1}/loan-applications"
              payload: { lender_entity_code: "AFFILIATED_LENDER", application_number: "APP-1", qualifying_income_cents: 2000000, monthly_debt_cents: 100000 }
              as: MortgageBanker
              captures: { la1: $.data.id }
            - call: "POST /housing/loan-applications/${la1}/qualify"
              payload: {}
              as: MortgageBanker
              captures: { la1_v: $.data.version }
            - call: "POST /housing/loan-applications/${la1}/rate-locks"
              payload: { commitment_id: "${fc1}", lock_rate_bps: 499, lock_days: 180, expected_application_version: "${la1_v}" }
              as: MortgageBanker
              captures: { lk1: $.data.id }
            - call: "POST /housing/contracts/${ct1}/lock"
              payload: {}
              as: MortgageBanker
            - call: "POST /housing/contracts/${ct1}/approve"
              payload: {}
              as: ComplianceOfficer
            - call: "POST /housing/contracts/${ct1}/close"
              payload: {}
              as: ClosingOfficer
          trigger:
            - call: "GET /housing/forward-commitments/${fc1}"
              payload: {}
              as: MortgageBanker
              captures: { avail_after_close: $.data.units_available, drawn_after_close: $.data.units_drawn }
            - call: "POST /housing/contracts/${ct1}/cancel"
              payload: { cancellation_reason: "RATE_SHOCK" }
              as: SalesCounselor
            - call: "GET /housing/forward-commitments/${fc1}"
              payload: {}
              as: MortgageBanker
              captures: { avail_after_void: $.data.units_available }
            - call: "POST /housing/rate-locks/${lk1}/relock"
              payload: {}
              as: MortgageBanker
              captures: { relock_state: $.data.lock_status }
            - call: "GET /housing/forward-commitments/${fc1}"
              payload: {}
              as: MortgageBanker
              captures: { avail_final: $.data.units_available }
          assert:
            - "ForwardCommitment.${fc1}.units_drawn == 1 after the close consumed the single unit"
            - "ForwardCommitment.${fc1}.units_available == 2 after the close, i.e. 3 - 1 + 0"
            - "ForwardCommitment.${fc1}.units_released == 1 after the contract cancel voided the consumed lock"
            - "ForwardCommitment.${fc1}.units_available == 3 after the void, exactly restoring committed_units * 1 == 3"
            - "ForwardCommitment.${fc1}.units_drawn - ForwardCommitment.${fc1}.units_released == 0, so the conserved quantity committed_units - units_drawn + units_released equals committed_units"
            - "RateLock.${lk1}.relock_count == 1 after the relock"