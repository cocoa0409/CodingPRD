scenario: |
  Provider Data Management & Roster Ingestion (health plan provider data office): roster intake in multiple formats & normalization, provider identity resolution (NPI/TIN/location), demographic/specialty/attribute maintenance, effective/term dating & retro changes, downstream distribution to claims/directory/network, attestation & outreach for stale data, duplicate & conflicting-source resolution, data quality scoring

domain_name: provider-data-management
api_prefix: /pdm

complexity_profile:
  primary_archetype: event_sourcing
  secondary_archetype: compliance_audit
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - scheduled_actions
    - derived_field_reconciliation
    - soft_delete
    - pagination_with_filtering
  entity_topology: flat
  state_machine_shape: branching
  relationship_patterns:
    - one_to_many
    - self_referential
    - cross_aggregate
  role_model: segregation_of_duties
  consistency_model: immediate

# =============================================================================
# 1.0 Response Envelope (FIXED — verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# 1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: RosterSource
    parent: null
    common_fields: true
    fields:
      - { name: source_code, type: string, source: input, description: "Unique short code identifying the upstream feed (e.g. 'CAQH_WEEKLY')" }
      - { name: display_name, type: string, source: input, description: "Human-readable source name" }
      - { name: format, type: enum, source: input, description: "CSV | XLSX | JSON | FHIR | FIXED_WIDTH" }
      - { name: precedence_rank, type: integer, source: input, description: "Conflict-adjudication precedence: lower integer wins; must be unique across all non-RETIRED sources" }
      - { name: freshness_sla_days, type: integer, source: input, description: "Days after which a provider attribute sourced only from this feed is considered stale; must be >= 1" }
      - { name: status, type: enum, source: system, description: "ACTIVE | SUSPENDED | RETIRED" }
      - { name: default_attestation_campaign_id, type: string, source: input, required: false, description: "FK -> AttestationCampaign.id; campaign into which stale providers sourced here are enrolled by default" }

  - name: RosterFile
    parent: null
    common_fields: true
    fields:
      - { name: roster_source_id, type: string, source: input, description: "FK -> RosterSource.id; the feed that delivered this file" }
      - { name: external_file_ref, type: string, source: input, description: "Upstream file name/reference; unique per roster_source_id" }
      - { name: declared_row_count, type: integer, source: input, description: "Row count declared by the sender in the manifest; must be >= 0" }
      - { name: received_at, type: datetime, source: system, description: "Server timestamp when the file was registered" }
      - { name: status, type: enum, source: system, description: "RECEIVED | PARSED | NORMALIZED | VALIDATED | COMMITTED | REJECTED | SUPERSEDED" }
      - { name: parsed_row_count, type: integer, source: computed, description: "Number of RosterRow records materialized during parsing" }
      - { name: rejected_row_count, type: integer, source: computed, description: "Number of RosterRow records in REJECTED state" }
      - { name: committed_row_count, type: integer, source: computed, description: "Number of RosterRow records whose identity resolution ended MATCHED or NEW_PROVIDER" }
      - { name: checksum, type: string, source: input, description: "SHA-256 hex of raw payload; uniqueness enforced per roster_source_id" }

  - name: RosterRow
    parent: RosterFile
    common_fields: true
    fields:
      - { name: roster_file_id, type: string, source: system, description: "FK -> RosterFile.id; owning file" }
      - { name: row_index, type: integer, source: system, description: "0-based position inside the file; unique per roster_file_id" }
      - { name: raw_payload, type: string, source: system, description: "Original row text verbatim (pre-normalization)" }
      - { name: normalized_payload, type: object, source: computed, description: "Canonical JSON after format-specific normalization (npi, tin, location fields coerced)" }
      - { name: npi, type: string, source: computed, description: "Normalized 10-digit NPI extracted from the row; empty string when unparseable" }
      - { name: tin, type: string, source: computed, description: "Normalized 9-digit TIN extracted from the row; empty string when unparseable" }
      - { name: location_key, type: string, source: computed, description: "Normalized address hash (street1+city+state+zip) used as the third identity leg" }
      - { name: status, type: enum, source: system, description: "PENDING | MATCHED | NEW_PROVIDER | CONFLICT | REJECTED" }
      - { name: reject_reason, type: enum, source: system, required: false, description: "MALFORMED_NPI | MALFORMED_TIN | MISSING_LOCATION | DUPLICATE_IN_FILE | SOURCE_RETIRED; set iff status=REJECTED" }
      - { name: resolved_provider_id, type: string, source: system, required: false, description: "FK -> Provider.id; set when status becomes MATCHED" }
      - { name: effective_date, type: string, source: computed, description: "ISO date the row's attribute payload claims to take effect; may be in the past (retro) or future" }

  - name: Provider
    parent: null
    common_fields: true
    fields:
      - { name: npi, type: string, source: input, description: "Canonical 10-digit NPI; unique across all non-MERGED providers" }
      - { name: tin, type: string, source: input, description: "Canonical 9-digit TIN; not unique (shared across locations)" }
      - { name: location_key, type: string, source: input, description: "Canonical normalized address hash; the triple (npi, tin, location_key) is unique" }
      - { name: lifecycle_status, type: enum, source: system, description: "ACTIVE | SUSPENDED | MERGED | TERMINATED" }
      - { name: merged_into_provider_id, type: string, source: system, required: false, description: "FK -> Provider.id; survivor when lifecycle_status=MERGED (self-referential)" }
      - { name: current_quality_score, type: integer, source: computed, description: "Latest committed DataQualityScore.total_score; 0 when never scored" }
      - { name: staleness_flag, type: boolean, source: computed, description: "True iff any non-terminated attribute group's max effective_date across committed rows is older than its source's freshness_sla_days" }
      - { name: last_roster_file_id, type: string, source: system, required: false, description: "FK -> RosterFile.id; most recent committed file that touched this provider" }

  - name: ProviderAttribute
    parent: Provider
    common_fields: true
    fields:
      - { name: provider_id, type: string, source: system, description: "FK -> Provider.id; owning provider" }
      - { name: attribute_group, type: enum, source: input, description: "DEMOGRAPHIC | SPECIALTY | PRACTICE_ADDRESS | CONTACT | LICENSE" }
      - { name: attribute_key, type: string, source: input, description: "Sub-key inside the group (e.g. 'phone', 'primary_taxonomy')" }
      - { name: attribute_value, type: string, source: input, description: "Canonical value" }
      - { name: effective_date, type: string, source: input, description: "ISO date the value takes effect (inclusive)" }
      - { name: term_date, type: string, source: input, required: false, description: "ISO date the value stops applying (exclusive); null means open-ended; must be > effective_date when present" }
      - { name: roster_source_id, type: string, source: system, description: "FK -> RosterSource.id; the feed that asserted this value" }
      - { name: roster_row_id, type: string, source: system, description: "FK -> RosterRow.id; the row that asserted this value (provenance)" }
      - { name: supersedes_attribute_id, type: string, source: system, required: false, description: "FK -> ProviderAttribute.id; the same-group interval this row split/truncated on retro insert" }
      - { name: status, type: enum, source: system, description: "PENDING | ACTIVE | RETRO_PENDING | SUPERSEDED | VOIDED" }

  - name: ProviderAlias
    parent: Provider
    common_fields: true
    fields:
      - { name: provider_id, type: string, source: system, description: "FK -> Provider.id; canonical provider this alias resolves to" }
      - { name: alias_npi, type: string, source: input, description: "Observed NPI variant (typo, legacy id)" }
      - { name: alias_tin, type: string, source: input, description: "Observed TIN variant" }
      - { name: alias_location_key, type: string, source: input, description: "Observed address variant" }
      - { name: match_confidence, type: integer, source: computed, description: "0-100 confidence assigned by identity resolution at link time" }
      - { name: link_kind, type: enum, source: system, description: "AUTO_EXACT | AUTO_FUZZY | MANUAL" }
      - { name: status, type: enum, source: system, description: "ACTIVE | UNLINKED" }

  - name: AttributeConflict
    parent: Provider
    common_fields: true
    fields:
      - { name: provider_id, type: string, source: system, description: "FK -> Provider.id; provider whose attributes disagree" }
      - { name: attribute_group, type: enum, source: system, description: "Group where the conflict was detected" }
      - { name: attribute_key, type: string, source: system, description: "Key where the conflict was detected" }
      - { name: incumbent_attribute_id, type: string, source: system, description: "FK -> ProviderAttribute.id; currently-effective value holder" }
      - { name: challenger_attribute_id, type: string, source: system, description: "FK -> ProviderAttribute.id; incoming value holder" }
      - { name: incumbent_source_id, type: string, source: system, description: "FK -> RosterSource.id; source of incumbent" }
      - { name: challenger_source_id, type: string, source: system, description: "FK -> RosterSource.id; source of challenger" }
      - { name: resolution, type: enum, source: system, description: "PENDING | KEEP_INCUMBENT | ACCEPT_CHALLENGER | MERGE_VALUES" }
      - { name: resolution_reason, type: string, source: input, required: false, description: "Adjudicator free-text rationale; required when resolution != PENDING" }
      - { name: resolved_value, type: string, source: input, required: false, description: "Merged value; required iff resolution=MERGE_VALUES" }
      - { name: status, type: enum, source: system, description: "OPEN | RESOLVED | ESCALATED" }

  - name: DistributionTarget
    parent: null
    common_fields: true
    fields:
      - { name: target_code, type: enum, source: input, description: "CLAIMS | DIRECTORY | NETWORK" }
      - { name: endpoint_uri, type: string, source: input, description: "Downstream delivery URI" }
      - { name: required_quality_floor, type: integer, source: input, description: "Minimum provider quality score for inclusion in snapshots to this target; 0-100" }
      - { name: status, type: enum, source: system, description: "ACTIVE | DISABLED" }

  - name: DistributionBatch
    parent: DistributionTarget
    common_fields: true
    fields:
      - { name: distribution_target_id, type: string, source: system, description: "FK -> DistributionTarget.id; target channel" }
      - { name: snapshot_cutoff_at, type: datetime, source: system, description: "Logical clock value when the snapshot content was frozen" }
      - { name: provider_count, type: integer, source: computed, description: "Providers included in the snapshot payload" }
      - { name: status, type: enum, source: system, description: "BUILDING | PUBLISHED | ACKED | FAILED | SUPERSEDED" }
      - { name: failure_reason, type: string, source: input, required: false, description: "Recorded when status transitions to FAILED" }
      - { name: retry_of_batch_id, type: string, source: input, required: false, description: "FK -> DistributionBatch.id; set when this batch is a manual retry of a FAILED batch" }

  - name: DistributionItem
    parent: DistributionBatch
    common_fields: false
    fields:
      - { name: distribution_batch_id, type: string, source: system, description: "FK -> DistributionBatch.id; owning batch" }
      - { name: provider_id, type: string, source: system, description: "FK -> Provider.id; provider included" }
      - { name: change_kind, type: enum, source: system, description: "ADD | UPDATE | TERM | QUALITY_DROP_EXCLUDED" }
      - { name: payload_hash, type: string, source: system, description: "Hash of the provider payload slice sent" }

  - name: AttestationCampaign
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Campaign label" }
      - { name: window_days, type: integer, source: input, description: "SLA window in days; a request not responded within window_days of sent_at EXPIRES; must be >= 1" }
      - { name: status, type: enum, source: system, description: "DRAFT | OPEN | CLOSED" }

  - name: AttestationRequest
    parent: AttestationCampaign
    common_fields: true
    fields:
      - { name: attestation_campaign_id, type: string, source: system, description: "FK -> AttestationCampaign.id; owning campaign" }
      - { name: provider_id, type: string, source: system, description: "FK -> Provider.id; provider asked to attest" }
      - { name: sent_at, type: datetime, source: system, description: "Logical clock when outreach was dispatched" }
      - { name: due_at, type: datetime, source: computed, description: "sent_at + campaign.window_days (exclusive deadline at due_at 00:00 UTC comparison is against logical clock)" }
      - { name: responded_at, type: datetime, source: system, required: false, description: "Logical clock when provider responded" }
      - { name: attestation_outcome, type: enum, source: input, required: false, description: "CONFIRMED | CORRECTED; set on respond" }
      - { name: corrected_payload, type: object, source: input, required: false, description: "Attribute corrections submitted with CORRECTED outcome" }
      - { name: status, type: enum, source: system, description: "DRAFT | SENT | RESPONDED | EXPIRED | ESCALATED | WITHDRAWN" }

  - name: DataQualityScore
    parent: Provider
    common_fields: false
    fields:
      - { name: provider_id, type: string, source: system, description: "FK -> Provider.id; scored provider" }
      - { name: computed_at, type: datetime, source: system, description: "Logical clock when the score was computed" }
      - { name: completeness_component, type: integer, source: computed, description: "0-40 points from field completeness" }
      - { name: freshness_component, type: integer, source: computed, description: "0-30 points from attribute freshness vs source SLA" }
      - { name: conflict_component, type: integer, source: computed, description: "0-20 points from absence of open conflicts" }
      - { name: attestation_component, type: integer, source: computed, description: "0-10 points from attestation history" }
      - { name: total_score, type: integer, source: computed, description: "Sum of the four components; 0-100" }
      - { name: roster_file_id, type: string, source: system, required: false, description: "FK -> RosterFile.id; file whose commit triggered this score, if any" }

  - name: ProviderMergeRecord
    parent: Provider
    common_fields: false
    fields:
      - { name: survivor_provider_id, type: string, source: system, description: "FK -> Provider.id; provider kept (self-referential parent anchor is the survivor)" }
      - { name: merged_provider_id, type: string, source: system, description: "FK -> Provider.id; duplicate provider folded in" }
      - { name: decided_by_user_id, type: string, source: system, description: "Opaque adjudicator user id who executed the merge" }
      - { name: decided_at, type: datetime, source: system, description: "Logical clock when merge executed" }
      - { name: rationale, type: string, source: input, description: "Free-text adjudication rationale" }

# =============================================================================
# 1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: RosterSource
    initial_state: ACTIVE
    terminal_states: [RETIRED]
    transitions:
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /pdm/roster-sources/{id}/suspend"
        actor: DataSteward
        preconditions:
          - "No RosterFile for this source in status RECEIVED, PARSED, NORMALIZED, or VALIDATED (ERR_SOURCE_HAS_INFLIGHT_FILE)"
        side_effects:
          - "increments RosterSource.version by 1"
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /pdm/roster-sources/{id}/resume"
        actor: DataSteward
        preconditions: []
        side_effects:
          - "increments RosterSource.version by 1"
      - from: ACTIVE
        to: RETIRED
        trigger: "POST /pdm/roster-sources/{id}/retire"
        actor: DataSteward
        preconditions:
          - "No RosterFile for this source in status RECEIVED, PARSED, NORMALIZED, or VALIDATED (ERR_SOURCE_HAS_INFLIGHT_FILE)"
          - "precedence_rank of remaining non-RETIRED sources remains unique (always true; retirement only removes a rank)"
        side_effects:
          - "increments RosterSource.version by 1"
          - "all subsequent RosterRow arrivals naming this source reject with reject_reason=SOURCE_RETIRED"

  - entity: RosterFile
    initial_state: RECEIVED
    terminal_states: [COMMITTED, REJECTED, SUPERSEDED]
    transitions:
      - from: RECEIVED
        to: PARSED
        trigger: "POST /pdm/roster-files/{id}/parse"
        actor: IntakeOperator
        preconditions:
          - "RosterSource.status == ACTIVE (ERR_SOURCE_NOT_ACTIVE)"
        side_effects:
          - "materializes declared_row_count RosterRow records with status=PENDING and row_index 0..N-1"
          - "parsed_row_count set to number of materialized rows"
          - "if materialized count != declared_row_count the file immediately transitions to REJECTED instead (ERR_ROW_COUNT_MISMATCH on parse call)"
      - from: PARSED
        to: NORMALIZED
        trigger: "POST /pdm/roster-files/{id}/normalize"
        actor: IntakeOperator
        preconditions: []
        side_effects:
          - "per row, format-specific normalization produces normalized_payload, npi, tin, location_key, effective_date"
          - "rows with unparseable npi transition to REJECTED with reject_reason=MALFORMED_NPI"
          - "rows with unparseable tin transition to REJECTED with reject_reason=MALFORMED_TIN"
          - "rows with empty location_key transition to REJECTED with reject_reason=MISSING_LOCATION"
          - "rows sharing the same (npi, tin, location_key) triple within the same file keep the lowest row_index PENDING; the rest transition to REJECTED with reject_reason=DUPLICATE_IN_FILE"
          - "rejected_row_count recomputed"
      - from: NORMALIZED
        to: VALIDATED
        trigger: "POST /pdm/roster-files/{id}/validate"
        actor: IntakeOperator
        preconditions: []
        side_effects:
          - "identity resolution runs per non-REJECTED row: exact triple match -> MATCHED; no match -> NEW_PROVIDER; partial match with ambiguity -> CONFLICT and an AttributeConflict skeleton is NOT created here (conflicts arise only on attribute write)"
          - "MATCHED rows set resolved_provider_id"
      - from: VALIDATED
        to: COMMITTED
        trigger: "POST /pdm/roster-files/{id}/commit"
        actor: IntakeOperator
        preconditions:
          - "expected_roster_file_version matches RosterFile.version (ERR_STALE_VERSION)"
          - "No row remains in PENDING (all non-REJECTED rows must be MATCHED, NEW_PROVIDER, or CONFLICT-resolved via alias/merge decisions; CONFLICT rows block commit) (ERR_UNRESOLVED_ROW_CONFLICTS)"
        side_effects:
          - "for NEW_PROVIDER rows: create Provider (lifecycle_status=ACTIVE) and initial ProviderAttribute set with status=ACTIVE or RETRO_PENDING per effective_date vs logical clock"
          - "for MATCHED rows: upsert ProviderAttribute values; retro-effective inserts transition affected existing intervals to SUPERSEDED and create AttributeConflict records when incumbent source differs (see attribute_effective_dating calculation)"
          - "Provider.last_roster_file_id updated for every touched provider; Provider.version incremented per touched provider"
          - "data_quality_scoring runs per touched provider, creating DataQualityScore and refreshing Provider.current_quality_score and Provider.staleness_flag"
          - "committed_row_count and rejected_row_count finalized"
      - from: RECEIVED
        to: REJECTED
        trigger: "POST /pdm/roster-files/{id}/reject"
        actor: IntakeOperator
        preconditions: []
        side_effects: []
      - from: PARSED
        to: REJECTED
        trigger: "POST /pdm/roster-files/{id}/reject"
        actor: IntakeOperator
        preconditions: []
        side_effects:
          - "all PENDING RosterRow records transition to REJECTED with reject_reason preserved or set to MALFORMED_NPI if unset"
      - from: NORMALIZED
        to: REJECTED
        trigger: "POST /pdm/roster-files/{id}/reject"
        actor: IntakeOperator
        preconditions: []
        side_effects:
          - "remaining non-terminal RosterRow records transition to REJECTED"
      - from: VALIDATED
        to: REJECTED
        trigger: "POST /pdm/roster-files/{id}/reject"
        actor: IntakeOperator
        preconditions: []
        side_effects:
          - "no Provider writes are rolled back because none have occurred yet"
      - from: COMMITTED
        to: SUPERSEDED
        trigger: "POST /pdm/roster-files/{id}/supersede"
        actor: DataSteward
        preconditions:
          - "a replacement RosterFile for the same roster_source_id exists in VALIDATED or COMMITTED state (ERR_NO_REPLACEMENT_FILE)"
        side_effects:
          - "does NOT mutate providers; supersession is a bookkeeping marker only"

  - entity: RosterRow
    initial_state: PENDING
    terminal_states: [MATCHED, NEW_PROVIDER, REJECTED]
    transitions:
      - from: PENDING
        to: MATCHED
        trigger: "system (identity resolution during RosterFile validate, or POST /pdm/roster-rows/{id}/link for manual link)"
        actor: "system | DataSteward"
        preconditions:
          - "manual link: target Provider.lifecycle_status == ACTIVE (ERR_PROVIDER_NOT_LINKABLE)"
        side_effects:
          - "resolved_provider_id set"
          - "manual link creates ProviderAlias with link_kind=MANUAL"
      - from: PENDING
        to: NEW_PROVIDER
        trigger: "system (identity resolution during RosterFile validate)"
        actor: system
        preconditions: []
        side_effects: []
      - from: PENDING
        to: CONFLICT
        trigger: "system (identity resolution ambiguity: exactly-one-triple rule violated with 2+ candidate providers)"
        actor: system
        preconditions: []
        side_effects:
          - "blocks owning RosterFile commit until resolved"
      - from: CONFLICT
        to: MATCHED
        trigger: "POST /pdm/roster-rows/{id}/link"
        actor: DataSteward
        preconditions:
          - "target Provider.lifecycle_status == ACTIVE (ERR_PROVIDER_NOT_LINKABLE)"
        side_effects:
          - "resolved_provider_id set; ProviderAlias created with link_kind=MANUAL"
      - from: CONFLICT
        to: NEW_PROVIDER
        trigger: "POST /pdm/roster-rows/{id}/spawn-new"
        actor: DataSteward
        preconditions: []
        side_effects: []
      - from: PENDING
        to: REJECTED
        trigger: "system (normalization failures) or POST /pdm/roster-rows/{id}/reject"
        actor: "system | IntakeOperator"
        preconditions: []
        side_effects:
          - "reject_reason set"

  - entity: Provider
    initial_state: ACTIVE
    terminal_states: [MERGED, TERMINATED]
    transitions:
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /pdm/providers/{id}/suspend"
        actor: DataSteward
        preconditions: []
        side_effects:
          - "excluded from future DistributionBatch snapshots"
          - "open AttestationRequest records for this provider in SENT status transition to WITHDRAWN"
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /pdm/providers/{id}/reinstate"
        actor: DataSteward
        preconditions:
          - "current_quality_score >= the lowest required_quality_floor across ACTIVE DistributionTargets (ERR_QUALITY_FLOOR_NOT_MET)"
        side_effects: []
      - from: ACTIVE
        to: MERGED
        trigger: "POST /pdm/provider-merges"
        actor: DataSteward
        preconditions:
          - "survivor Provider.lifecycle_status == ACTIVE"
          - "merged provider != survivor provider (ERR_MERGE_SELF)"
          - "merged Provider.lifecycle_status == ACTIVE (ERR_PROVIDER_NOT_LINKABLE)"
          - "expected_provider_version matches merged Provider.version (ERR_STALE_VERSION)"
        side_effects:
          - "ProviderMergeRecord created"
          - "merged provider's ProviderAttribute records re-point provider_id to survivor; same-group overlapping intervals trigger attribute_effective_dating re-resolution"
          - "merged provider's ProviderAlias records re-point to survivor"
          - "merged provider's open AttributeConflict records transfer to survivor"
          - "merged provider's AttestationRequest records in DRAFT/SENT transition to WITHDRAWN"
          - "data_quality_scoring runs for survivor"
          - "merged provider lifecycle_status=MERGED, merged_into_provider_id=survivor"
      - from: ACTIVE
        to: TERMINATED
        trigger: "POST /pdm/providers/{id}/terminate"
        actor: DataSteward
        preconditions:
          - "no AttestationRequest in SENT status for this provider (ERR_OPEN_ATTESTATION_EXISTS)"
        side_effects:
          - "all open-ended ProviderAttribute intervals (term_date null) get term_date = logical clock date"
          - "open AttributeConflict records transition to RESOLVED with resolution=KEEP_INCUMBENT, resolution_reason='provider terminated'"
          - "next DistributionBatch snapshot includes a TERM DistributionItem"

  - entity: ProviderAttribute
    initial_state: PENDING
    terminal_states: [SUPERSEDED, VOIDED]
    transitions:
      - from: PENDING
        to: ACTIVE
        trigger: "system (RosterFile commit when effective_date <= logical clock date)"
        actor: system
        preconditions: []
        side_effects:
          - "attribute_effective_dating truncates/splits overlapping same-group intervals"
      - from: PENDING
        to: RETRO_PENDING
        trigger: "system (RosterFile commit when effective_date < earliest existing interval's effective_date for the same group)"
        actor: system
        preconditions: []
        side_effects:
          - "requires DataSteward adjudication before becoming ACTIVE"
      - from: RETRO_PENDING
        to: ACTIVE
        trigger: "POST /pdm/provider-attributes/{id}/approve-retro"
        actor: DataSteward
        preconditions:
          - "expected_provider_version matches Provider.version (ERR_STALE_VERSION)"
        side_effects:
          - "attribute_effective_dating re-runs for the group; intervals may split; Provider.version increments"
      - from: RETRO_PENDING
        to: VOIDED
        trigger: "POST /pdm/provider-attributes/{id}/void"
        actor: DataSteward
        preconditions: []
        side_effects:
          - "no interval rewrite occurs"
      - from: ACTIVE
        to: SUPERSEDED
        trigger: "system (retro insert or merge re-resolution splits/truncates this interval)"
        actor: system
        preconditions: []
        side_effects:
          - "attribute_effective_dating records supersedes_attribute_id on the replacing interval"

  - entity: AttributeConflict
    initial_state: OPEN
    terminal_states: [RESOLVED]
    transitions:
      - from: OPEN
        to: RESOLVED
        trigger: "POST /pdm/attribute-conflicts/{id}/resolve"
        actor: DataSteward
        preconditions:
          - "resolution in {KEEP_INCUMBENT, ACCEPT_CHALLENGER, MERGE_VALUES}"
          - "resolution=MERGE_VALUES requires resolved_value present (ERR_MERGE_VALUE_REQUIRED)"
        side_effects:
          - "KEEP_INCUMBENT: challenger attribute -> VOIDED"
          - "ACCEPT_CHALLENGER: incumbent -> SUPERSEDED, challenger stays/becomes ACTIVE"
          - "MERGE_VALUES: both SUPERSEDED, new ProviderAttribute created with resolved_value and effective_date = logical clock date"
          - "data_quality_scoring re-runs for the provider (conflict_component may recover)"
      - from: OPEN
        to: ESCALATED
        trigger: "POST /pdm/attribute-conflicts/{id}/escalate"
        actor: DataSteward
        preconditions:
          - "the two sources' precedence_rank differ by exactly 0 tie cannot be escalated (ERR_PRECEDENCE_TIE_NOT_ESCALATABLE)"
        side_effects: []
      - from: ESCALATED
        to: RESOLVED
        trigger: "POST /pdm/attribute-conflicts/{id}/resolve"
        actor: DataSteward
        preconditions:
          - "same as OPEN->RESOLVED"
        side_effects:
          - "same as OPEN->RESOLVED"

  - entity: DistributionBatch
    initial_state: BUILDING
    terminal_states: [ACKED, SUPERSEDED]
    transitions:
      - from: BUILDING
        to: PUBLISHED
        trigger: "POST /pdm/distribution-batches/{id}/publish"
        actor: DistributionOperator
        preconditions:
          - "DistributionTarget.status == ACTIVE (ERR_TARGET_DISABLED)"
          - "no other batch for the same target in BUILDING or PUBLISHED (ERR_BATCH_INFLIGHT)"
        side_effects:
          - "DistributionItem set frozen at snapshot_cutoff_at"
      - from: PUBLISHED
        to: ACKED
        trigger: "POST /pdm/distribution-batches/{id}/ack"
        actor: DistributionOperator
        preconditions: []
        side_effects: []
      - from: PUBLISHED
        to: FAILED
        trigger: "POST /pdm/distribution-batches/{id}/fail"
        actor: DistributionOperator
        preconditions:
          - "failure_reason present"
        side_effects: []
      - from: FAILED
        to: SUPERSEDED
        trigger: "POST /pdm/distribution-batches (retry_of_batch_id = this batch)"
        actor: DistributionOperator
        preconditions: []
        side_effects:
          - "new batch created in BUILDING carrying retry_of_batch_id"
      - from: BUILDING
        to: SUPERSEDED
        trigger: "POST /pdm/distribution-batches/{id}/discard"
        actor: DistributionOperator
        preconditions: []
        side_effects: []

  - entity: AttestationCampaign
    initial_state: DRAFT
    terminal_states: [CLOSED]
    transitions:
      - from: DRAFT
        to: OPEN
        trigger: "POST /pdm/attestation-campaigns/{id}/open"
        actor: DataSteward
        preconditions: []
        side_effects: []
      - from: OPEN
        to: CLOSED
        trigger: "POST /pdm/attestation-campaigns/{id}/close"
        actor: DataSteward
        preconditions:
          - "no AttestationRequest in SENT or ESCALATED status (ERR_CAMPAIGN_HAS_OPEN_REQUESTS)"
        side_effects:
          - "requests still in DRAFT transition to WITHDRAWN"

  - entity: AttestationRequest
    initial_state: DRAFT
    terminal_states: [RESPONDED, EXPIRED, WITHDRAWN]
    transitions:
      - from: DRAFT
        to: SENT
        trigger: "POST /pdm/attestation-requests/{id}/send"
        actor: DataSteward
        preconditions:
          - "campaign status == OPEN (ERR_CAMPAIGN_NOT_OPEN)"
          - "provider lifecycle_status == ACTIVE (ERR_PROVIDER_NOT_LINKABLE)"
          - "no other AttestationRequest for the same provider in SENT or ESCALATED (ERR_ATTESTATION_ALREADY_INFLIGHT)"
        side_effects:
          - "sent_at = logical clock; due_at computed per campaign window"
      - from: SENT
        to: RESPONDED
        trigger: "POST /pdm/attestation-requests/{id}/respond"
        actor: "ProviderContact"
        preconditions:
          - "logical clock < due_at (ERR_ATTESTATION_WINDOW_CLOSED)"
          - "attestation_outcome present; corrected_payload required iff outcome=CORRECTED (ERR_CORRECTION_PAYLOAD_REQUIRED)"
        side_effects:
          - "responded_at = logical clock"
          - "CORRECTED: corrected_payload fields upserted as ProviderAttribute rows with roster_source_id pointing at the special ATTESTATION pseudo-source semantics (roster_source_id of the campaign's default source when configured, else attribute written with the incumbent's source) and effective_date = logical clock date"
          - "data_quality_scoring re-runs (attestation_component improves)"
      - from: SENT
        to: EXPIRED
        trigger: "POST /pdm/attestation-requests/sweep (system batch: any SENT request with logical clock >= due_at)"
        actor: system
        preconditions: []
        side_effects:
          - "provider staleness_flag recomputed; data_quality_scoring re-runs (attestation_component drops)"
      - from: EXPIRED
        to: ESCALATED
        trigger: "POST /pdm/attestation-requests/{id}/escalate"
        actor: DataSteward
        preconditions:
          - "logical clock < due_at + window_days (escalation must occur within one additional window after expiry) (ERR_ESCALATION_WINDOW_CLOSED)"
        side_effects:
          - "provider.lifecycle_status transitions to SUSPENDED if escalation is the second consecutive expiry for this provider (see attestation_escalation calculation)"
      - from: DRAFT
        to: WITHDRAWN
        trigger: "POST /pdm/attestation-requests/{id}/withdraw"
        actor: DataSteward
        preconditions: []
        side_effects: []
      - from: SENT
        to: WITHDRAWN
        trigger: "system (provider suspended/merged/terminated, or campaign closed)"
        actor: system
        preconditions: []
        side_effects: []

# =============================================================================
# 1.2.1 Concurrency Rules (OCC only)
# =============================================================================
concurrency_rules:
  - rule_id: roster-file-commit-stale-version
    parent_entity: RosterFile
    write_endpoint: "POST /pdm/roster-files/{id}/commit"
    occ_field: "expected_roster_file_version"
    description: |
      Committing a RosterFile whose version has advanced since the client last
      observed it is rejected; a prior commit attempt or supersede advanced the
      version, so the caller's view of the file's row-resolution state is stale.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: provider-merge-stale-version
    parent_entity: Provider
    write_endpoint: "POST /pdm/provider-merges"
    occ_field: "expected_provider_version"
    description: |
      Merging a Provider whose version has advanced since the client last
      observed it is rejected; an intervening commit, retro approval, or merge
      legitimately changed the provider's attribute set and the merge decision
      was made against a stale snapshot.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: retro-approve-stale-provider-version
    parent_entity: Provider
    write_endpoint: "POST /pdm/provider-attributes/{id}/approve-retro"
    occ_field: "expected_provider_version"
    description: |
      Approving a retro-effective ProviderAttribute while carrying a Provider
      version older than the current one is rejected; the interval timeline the
      approver reviewed no longer matches the stored timeline.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# 1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: identity_resolution
    trigger: "RosterFile validate transition"
    algorithm: weighted_scoring
    formula: |
      For each non-REJECTED RosterRow:
        candidates = Provider where lifecycle_status IN {ACTIVE, SUSPENDED}
          AND (npi == row.npi OR tin == row.tin OR location_key == row.location_key)
        For each candidate compute match_score:
          leg_npi       = 50 if candidate.npi == row.npi else 0
          leg_tin       = 30 if candidate.tin == row.tin else 0
          leg_location  = 20 if candidate.location_key == row.location_key else 0
          match_score   = leg_npi + leg_tin + leg_location
        Decision:
          - any candidate with match_score == 100 and exactly one such candidate -> row MATCHED
          - zero candidates with match_score >= 70 -> row NEW_PROVIDER
          - exactly one candidate with match_score in [70, 99] -> row MATCHED (ProviderAlias AUTO_FUZZY created at commit)
          - 2+ candidates with match_score >= 70, or one candidate at 100 plus others >= 70 -> row CONFLICT
        ProviderAlias.match_confidence stored at commit equals the match_score of the winning candidate.
      Tie-break among equal top scores: candidate with the earliest Provider.created_at wins; if still tied the row becomes CONFLICT.
    input_set: "RosterRow records of the file in status PENDING at validate time; Provider records with lifecycle_status ACTIVE or SUSPENDED"
    constants:
      W_NPI: 50
      W_TIN: 30
      W_LOCATION: 20
      MATCH_THRESHOLD: 70
      EXACT_SCORE: 100
    precision: "integer arithmetic, no rounding"
    variants:
      - name: strict_exact_only
        when: "RosterSource.format == FHIR"
        difference: "FHIR feeds require match_score == 100 to MATCH; scores in [70,99] resolve to CONFLICT instead of MATCHED, and no AUTO_FUZZY alias is created"

  - name: attribute_effective_dating
    trigger: "RosterFile commit, retro approve, conflict resolve, provider merge, attestation correction"
    algorithm: interval_merge
    formula: |
      Intervals are half-open [effective_date, term_date); term_date null means +infinity.
      For the affected (provider_id, attribute_group, attribute_key) triple:
        1. Collect the incoming interval I_new and all existing intervals I_k with status in {ACTIVE}.
        2. If I_new.effective_date is earlier than every existing effective_date AND I_new would change the
           historically-first value, I_new enters RETRO_PENDING (adjudication required) instead of applying.
        3. Otherwise apply I_new:
           a. Any I_k with effective_date >= I_new.effective_date and (I_k.term_date is null or I_k.term_date <= I_new.term_date or I_new.term_date is null)
              -> I_k SUPERSEDED; its replacing interval records supersedes_attribute_id = I_k.id.
           b. Any I_k with effective_date < I_new.effective_date and (I_k.term_date is null or I_k.term_date > I_new.effective_date)
              -> truncate: I_k.term_date = I_new.effective_date (I_k stays ACTIVE with shortened span).
           c. If after truncation any I_k has term_date <= effective_date, I_k -> SUPERSEDED (zero-length intervals never persist).
        4. Adjacent-touch rule: when I_new.effective_date == I_k.term_date exactly, intervals are ADJACENT, not
           overlapping — no supersede, no conflict; both remain ACTIVE.
        5. Same-value different-source overlap does NOT split; instead an AttributeConflict is created
           (incumbent = interval from higher-precedence source i.e. lower precedence_rank wins ties by
           earliest created_at) and the challenger interval stays PENDING until adjudication.
    input_set: "ProviderAttribute with status ACTIVE or PENDING for the affected triple"
    constants: {}
    precision: "ISO date granularity (day), no time component"
    variants:
      - name: retro_with_split
        when: "incoming effective_date is in the past relative to logical clock AND lands strictly inside an existing interval"
        difference: "the existing interval splits into two ACTIVE intervals ([old_start, new_start) and [new_end, old_end)) around the new one instead of simple truncation; the split right-half copies the old value with effective_date = I_new.term_date (or, when I_new.term_date is null, no split-right is created and the old interval truncates only)"

  - name: conflicting_source_precedence
    trigger: "attribute_effective_dating step 5, and AttributeConflict auto-resolution sweep on commit"
    algorithm: constraint_propagation
    formula: |
      When two overlapping same-(group,key) intervals from DIFFERENT roster sources assert different values:
        conflict_pair = (incumbent, challenger)
        if incumbent_source.precedence_rank < challenger_source.precedence_rank:
          incumbent wins automatically -> challenger VOIDED, no AttributeConflict created
        elif challenger_source.precedence_rank < incumbent_source.precedence_rank:
          challenger auto-wins -> incumbent SUPERSEDED, challenger ACTIVE
        else (equal precedence_rank):
          AttributeConflict created with status OPEN; resolution requires DataSteward adjudication
      Tie-break inside equal rank: the interval whose source has the earliest RosterSource.created_at wins;
      if sources identical, the interval with earliest ProviderAttribute.created_at wins.
    input_set: "overlapping ACTIVE/PENDING ProviderAttribute pairs per (provider, group, key) with distinct roster_source_id"
    constants: {}
    precision: "integer rank comparison"
    variants: []

  - name: data_quality_scoring
    trigger: "RosterFile commit, conflict resolve, attestation respond, attestation expire sweep, provider merge"
    algorithm: weighted_scoring
    formula: |
      total_score = completeness_component + freshness_component + conflict_component + attestation_component

      completeness_component (0-40):
        required_keys = { DEMOGRAPHIC: [name, dob, gender],
                          SPECIALTY: [primary_taxonomy],
                          PRACTICE_ADDRESS: [street1, city, state, zip],
                          CONTACT: [phone],
                          LICENSE: [license_number, license_state] }
        present = count of required_keys whose (group,key) has an ACTIVE non-terminated attribute
        completeness_component = round_half_up(40 * present / 10)   # 10 total required keys

      freshness_component (0-30):
        For each attribute_group g in the 5 groups, staleness_g = 1 if the max effective_date of ACTIVE
        attributes in g is older than (logical clock date - freshness_sla_days of the attribute's source);
        groups with no ACTIVE attributes count stale (staleness_g = 1).
        fresh_groups = 5 - sum(staleness_g)
        freshness_component = 6 * fresh_groups

      conflict_component (0-20):
        open_conflicts = count of AttributeConflict with status in {OPEN, ESCALATED} for the provider
        conflict_component = max(0, 20 - 5 * open_conflicts)

      attestation_component (0-10):
        consecutive_unattested = count of consecutive AttestationRequest in {EXPIRED, ESCALATED} for this
        provider scanning backward by sent_at DESC, stopping at the first RESPONDED or WITHDRAWN;
        attestation_component = max(0, 10 - 5 * consecutive_unattested)

      Provider.current_quality_score is set to total_score; the DataQualityScore row is append-only.
    input_set: "ProviderAttribute ACTIVE for the provider; AttributeConflict OPEN/ESCALATED; AttestationRequest for the provider"
    constants:
      MAX_COMPLETENESS: 40
      MAX_FRESHNESS: 30
      MAX_CONFLICT: 20
      MAX_ATTESTATION: 10
      POINTS_PER_FRESH_GROUP: 6
      POINTS_PER_OPEN_CONFLICT: 5
      POINTS_PER_UNATTESTED: 5
      REQUIRED_KEY_COUNT: 10
    precision: "integer; completeness uses round_half_up at the final multiplication only (no intermediate rounding)"
    variants:
      - name: directory_strict_scoring
        when: "computing eligibility for a DistributionTarget whose target_code == DIRECTORY"
        difference: "open_conflicts counts ESCALATED conflicts double (10 points each) instead of 5; the eligibility check for DIRECTORY therefore uses a different score than the stored provider score"

  - name: attestation_escalation
    trigger: "AttestationRequest SENT->EXPIRED sweep and EXPIRED->ESCALATED"
    algorithm: threshold
    formula: |
      consecutive_expiries(provider) = number of consecutive AttestationRequest reaching EXPIRED
        scanning backward by sent_at DESC, stopping at first RESPONDED or WITHDRAWN.
      On EXPIRED->ESCALATED:
        if consecutive_expiries(provider) >= 2 -> provider.lifecycle_status transitions ACTIVE -> SUSPENDED
        (threshold is >= 2: exactly the second consecutive expiry suspends)
      Escalation deadline: escalate allowed only while logical clock < due_at + campaign.window_days.
    input_set: "AttestationRequest for the provider ordered by sent_at DESC"
    constants:
      SUSPEND_THRESHOLD: 2
    precision: "integer count; boundary is inclusive (>= 2)"
    variants: []

  - name: distribution_snapshot_selection
    trigger: "DistributionBatch BUILDING -> PUBLISHED publish call"
    algorithm: forward_looking
    formula: |
      Eligible providers at snapshot_cutoff_at:
        lifecycle_status == ACTIVE
        AND score_for_target >= DistributionTarget.required_quality_floor
          where score_for_target = Provider.current_quality_score for CLAIMS and NETWORK,
          and the directory_strict_scoring variant of data_quality_scoring for DIRECTORY.
      Change classification per provider vs the target's most recent ACKED batch (baseline):
        not in baseline           -> ADD
        in baseline, payload hash changed -> UPDATE
        in baseline, provider now TERMINATED or MERGED -> TERM
        in baseline, score dropped below floor -> QUALITY_DROP_EXCLUDED
      Ordering inside the snapshot: change_kind rank ADD < UPDATE < TERM < QUALITY_DROP_EXCLUDED,
        then Provider.npi ASC, then Provider.created_at ASC (never id).
      provider_count = number of DistributionItem rows materialized.
    input_set: "Provider lifecycle_status ACTIVE at cutoff; latest ACKED DistributionBatch per target as baseline"
    constants: {}
    precision: "integer comparisons"
    variants: []

# =============================================================================
# 1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role header present and one of the declared roles"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"
  - priority: 2
    category: auth
    check: "Role permitted for the endpoint per RBAC matrix"
    error_id: ERR_FORBIDDEN
    http_status: 403
    applies_to: "all"
  - priority: 3
    category: existence
    check: "Path ids exist and belong to the referenced parent chain (validated left-to-right)"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all"
  - priority: 4
    category: state
    check: "Target resource in a state from which the requested transition exists"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all state-transition endpoints"
  - priority: 5
    category: business_safety
    check: "Segregation of duties: the same opaque user id that registered a RosterFile cannot commit it (X-User-ID compared between POST /roster-files and POST /roster-files/{id}/commit)"
    error_id: ERR_SOD_SAME_USER
    http_status: 403
    applies_to: "POST /pdm/roster-files/{id}/commit"
  - priority: 6
    category: business_safety
    check: "Segregation of duties: the adjudicator resolving an AttributeConflict cannot be the operator who committed the file that created the challenger attribute"
    error_id: ERR_SOD_ADJUDICATOR
    http_status: 403
    applies_to: "POST /pdm/attribute-conflicts/{id}/resolve"
  - priority: 7
    category: business_constraint
    check: "OCC: expected_*_version matches current parent version"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /pdm/roster-files/{id}/commit, POST /pdm/provider-merges, POST /pdm/provider-attributes/{id}/approve-retro"
  - priority: 8
    category: business_constraint
    check: "RosterSource.status == ACTIVE when registering a new RosterFile for it"
    error_id: ERR_SOURCE_NOT_ACTIVE
    http_status: 409
    applies_to: "POST /pdm/roster-files"
  - priority: 9
    category: business_constraint
    check: "RosterSource.status == ACTIVE when parsing a file"
    error_id: ERR_SOURCE_NOT_ACTIVE
    http_status: 409
    applies_to: "POST /pdm/roster-files/{id}/parse"
  - priority: 10
    category: business_referential
    check: "RosterSource.precedence_rank unique among non-RETIRED sources"
    error_id: ERR_PRECEDENCE_RANK_CONFLICT
    http_status: 409
    applies_to: "POST /pdm/roster-sources, PATCH /pdm/roster-sources/{id}"
  - priority: 11
    category: business_referential
    check: "(external_file_ref, roster_source_id) unique and checksum unique per source"
    error_id: ERR_DUPLICATE_FILE
    http_status: 409
    applies_to: "POST /pdm/roster-files"
  - priority: 12
    category: business_constraint
    check: "declared_row_count must equal materialized row count at parse"
    error_id: ERR_ROW_COUNT_MISMATCH
    http_status: 422
    applies_to: "POST /pdm/roster-files/{id}/parse"
  - priority: 13
    category: business_constraint
    check: "No CONFLICT RosterRow remains when committing a file"
    error_id: ERR_UNRESOLVED_ROW_CONFLICTS
    http_status: 409
    applies_to: "POST /pdm/roster-files/{id}/commit"
  - priority: 14
    category: business_temporal
    check: "ProviderAttribute.term_date > effective_date when present"
    error_id: ERR_INVALID_DATE_RANGE
    http_status: 422
    applies_to: "POST /pdm/providers/{id}/attributes, PATCH /pdm/provider-attributes/{id}"
  - priority: 15
    category: business_temporal
    check: "Attestation respond occurs strictly before due_at; escalate strictly before due_at + window_days"
    error_id: ERR_ATTESTATION_WINDOW_CLOSED
    http_status: 409
    applies_to: "POST /pdm/attestation-requests/{id}/respond"
  - priority: 16
    category: business_temporal
    check: "Escalation after expiry must occur within one additional window"
    error_id: ERR_ESCALATION_WINDOW_CLOSED
    http_status: 409
    applies_to: "POST /pdm/attestation-requests/{id}/escalate"
  - priority: 17
    category: business_constraint
    check: "Provider lifecycle ACTIVE for link, merge-survivor, attestation send"
    error_id: ERR_PROVIDER_NOT_LINKABLE
    http_status: 409
    applies_to: "POST /pdm/roster-rows/{id}/link, POST /pdm/provider-merges, POST /pdm/attestation-requests/{id}/send"
  - priority: 18
    category: business_constraint
    check: "Merge survivor and merged provider are distinct"
    error_id: ERR_MERGE_SELF
    http_status: 422
    applies_to: "POST /pdm/provider-merges"
  - priority: 19
    category: business_fiscal
    check: "Provider reinstate requires current_quality_score >= min required_quality_floor across ACTIVE targets"
    error_id: ERR_QUALITY_FLOOR_NOT_MET
    http_status: 409
    applies_to: "POST /pdm/providers/{id}/reinstate"
  - priority: 20
    category: business_constraint
    check: "Distribution publish requires target ACTIVE and no inflight batch for the target"
    error_id: ERR_BATCH_INFLIGHT
    http_status: 409
    applies_to: "POST /pdm/distribution-batches/{id}/publish"
  - priority: 21
    category: business_constraint
    check: "Distribution publish requires target ACTIVE"
    error_id: ERR_TARGET_DISABLED
    http_status: 409
    applies_to: "POST /pdm/distribution-batches/{id}/publish"
  - priority: 22
    category: business_constraint
    check: "Attestation send requires campaign OPEN, no inflight request for provider"
    error_id: ERR_ATTESTATION_ALREADY_INFLIGHT
    http_status: 409
    applies_to: "POST /pdm/attestation-requests/{id}/send"
  - priority: 23
    category: business_constraint
    check: "Campaign must be OPEN to send requests"
    error_id: ERR_CAMPAIGN_NOT_OPEN
    http_status: 409
    applies_to: "POST /pdm/attestation-requests/{id}/send"
  - priority: 24
    category: business_constraint
    check: "Campaign close blocked while SENT or ESCALATED requests exist"
    error_id: ERR_CAMPAIGN_HAS_OPEN_REQUESTS
    http_status: 409
    applies_to: "POST /pdm/attestation-campaigns/{id}/close"
  - priority: 25
    category: business_constraint
    check: "Provider terminate blocked while a SENT attestation exists"
    error_id: ERR_OPEN_ATTESTATION_EXISTS
    http_status: 409
    applies_to: "POST /pdm/providers/{id}/terminate"
  - priority: 26
    category: business_constraint
    check: "AttributeConflict MERGE_VALUES resolution requires resolved_value"
    error_id: ERR_MERGE_VALUE_REQUIRED
    http_status: 422
    applies_to: "POST /pdm/attribute-conflicts/{id}/resolve"
  - priority: 27
    category: business_constraint
    check: "Escalating a conflict whose sources have equal precedence_rank is not allowed"
    error_id: ERR_PRECEDENCE_TIE_NOT_ESCALATABLE
    http_status: 409
    applies_to: "POST /pdm/attribute-conflicts/{id}/escalate"
  - priority: 28
    category: business_constraint
    check: "Superseding a committed file requires a replacement file in VALIDATED or COMMITTED for the same source"
    error_id: ERR_NO_REPLACEMENT_FILE
    http_status: 409
    applies_to: "POST /pdm/roster-files/{id}/supersede"
  - priority: 29
    category: business_constraint
    check: "RosterSource suspend/retire blocked while files inflight"
    error_id: ERR_SOURCE_HAS_INFLIGHT_FILE
    http_status: 409
    applies_to: "POST /pdm/roster-sources/{id}/suspend, POST /pdm/roster-sources/{id}/retire"
  - priority: 30
    category: business_constraint
    check: "Attestation CORRECTED outcome requires corrected_payload"
    error_id: ERR_CORRECTION_PAYLOAD_REQUIRED
    http_status: 422
    applies_to: "POST /pdm/attestation-requests/{id}/respond"
  - priority: 31
    category: business_constraint
    check: "Provider reinstate only from SUSPENDED; link targets must be ACTIVE (covered by ERR_PROVIDER_NOT_LINKABLE); terminate requires ACTIVE"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "provider lifecycle endpoints"
  - priority: 32
    category: business_constraint
    check: "Malformed request body / missing required fields / invalid enum values"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all"

# =============================================================================
# 1.5 API Endpoint Table
# =============================================================================
endpoints:
  # --- logical clock (test-driving) ---
  - method: POST
    path: "/pdm/_clock/set_current_utc"
    description: "Set the server logical clock. Startup default is 2026-08-01T00:00:00Z; the clock NEVER falls back to wall-clock time. All effective-date, staleness, and SLA arithmetic reads this clock."
    roles: [DataSteward]
    code: 200
    input: [to_iso8601]
    output: { current_utc: string }
    side_effects: []

  # --- RosterSource ---
  - method: POST
    path: "/pdm/roster-sources"
    description: "Register an upstream roster feed"
    roles: [DataSteward]
    code: 201
    input: [source_code, display_name, format, precedence_rank, freshness_sla_days, "default_attestation_campaign_id?"]
    output: RosterSource
    side_effects: ["status=ACTIVE"]

  - method: GET
    path: "/pdm/roster-sources"
    description: "List roster sources with pagination and optional filters"
    roles: [DataSteward, IntakeOperator, DistributionOperator, ProviderContact]
    code: 200
    input: ["status?", "format?", "default_attestation_campaign_id?", "limit?", "offset?"]
    output: RosterSource[]
    side_effects: []

  - method: GET
    path: "/pdm/roster-sources/{id}"
    description: "Get one roster source"
    roles: [DataSteward, IntakeOperator, DistributionOperator]
    code: 200
    input: []
    output: RosterSource
    side_effects: []

  - method: PATCH
    path: "/pdm/roster-sources/{id}"
    description: "Update mutable roster source fields (precedence_rank, freshness_sla_days, display_name, default_attestation_campaign_id)"
    roles: [DataSteward]
    code: 200
    input: ["precedence_rank?", "freshness_sla_days?", "display_name?", "default_attestation_campaign_id?"]
    output: RosterSource
    side_effects: ["increments RosterSource.version by 1"]

  - method: POST
    path: "/pdm/roster-sources/{id}/suspend"
    description: "Suspend a source (blocked with inflight files)"
    roles: [DataSteward]
    code: 200
    input: []
    output: RosterSource
    side_effects: ["status ACTIVE->SUSPENDED; increments version"]

  - method: POST
    path: "/pdm/roster-sources/{id}/resume"
    description: "Resume a suspended source"
    roles: [DataSteward]
    code: 200
    input: []
    output: RosterSource
    side_effects: ["status SUSPENDED->ACTIVE; increments version"]

  - method: POST
    path: "/pdm/roster-sources/{id}/retire"
    description: "Retire a source"
    roles: [DataSteward]
    code: 200
    input: []
    output: RosterSource
    side_effects: ["status ->RETIRED; increments version"]

  # --- RosterFile ---
  - method: POST
    path: "/pdm/roster-files"
    description: "Register an inbound roster file (creator's opaque user id recorded for SoD)"
    roles: [IntakeOperator]
    code: 201
    input: [roster_source_id, external_file_ref, declared_row_count, checksum]
    output: RosterFile
    side_effects: ["status=RECEIVED, received_at=logical clock"]

  - method: GET
    path: "/pdm/roster-files"
    description: "List roster files"
    roles: [DataSteward, IntakeOperator]
    code: 200
    input: ["roster_source_id?", "status?", "limit?", "offset?"]
    output: RosterFile[]
    side_effects: []

  - method: GET
    path: "/pdm/roster-files/{id}"
    description: "Get one roster file"
    roles: [DataSteward, IntakeOperator]
    code: 200
    input: []
    output: RosterFile
    side_effects: []

  - method: POST
    path: "/pdm/roster-files/{id}/parse"
    description: "Parse file into RosterRow records"
    roles: [IntakeOperator]
    code: 200
    input: []
    output: RosterFile
    side_effects: ["status RECEIVED->PARSED; materializes rows"]

  - method: POST
    path: "/pdm/roster-files/{id}/normalize"
    description: "Normalize parsed rows; malformed rows reject with reasons"
    roles: [IntakeOperator]
    code: 200
    input: []
    output: RosterFile
    side_effects: ["status PARSED->NORMALIZED; row-level rejections"]

  - method: POST
    path: "/pdm/roster-files/{id}/validate"
    description: "Run identity resolution over normalized rows"
    roles: [IntakeOperator]
    code: 200
    input: []
    output: RosterFile
    side_effects: ["status NORMALIZED->VALIDATED; rows to MATCHED/NEW_PROVIDER/CONFLICT"]

  - method: POST
    path: "/pdm/roster-files/{id}/commit"
    description: "Commit a validated file; OCC-guarded; SoD-checked against the registering operator"
    roles: [IntakeOperator]
    code: 200
    input: [expected_roster_file_version]
    output: RosterFile
    side_effects: ["status VALIDATED->COMMITTED; providers created/updated; quality scores recomputed; increments RosterFile.version by 1"]

  - method: POST
    path: "/pdm/roster-files/{id}/reject"
    description: "Reject a file pre-commit"
    roles: [IntakeOperator]
    code: 200
    input: []
    output: RosterFile
    side_effects: ["status ->REJECTED"]

  - method: POST
    path: "/pdm/roster-files/{id}/supersede"
    description: "Mark a committed file superseded by a replacement"
    roles: [DataSteward]
    code: 200
    input: []
    output: RosterFile
    side_effects: ["status COMMITTED->SUPERSEDED; increments version"]

  # --- RosterRow ---
  - method: GET
    path: "/pdm/roster-files/{id}/roster-rows"
    description: "List rows of a file"
    roles: [DataSteward, IntakeOperator]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: RosterRow[]
    side_effects: []

  - method: GET
    path: "/pdm/roster-rows/{id}"
    description: "Get one roster row"
    roles: [DataSteward, IntakeOperator]
    code: 200
    input: []
    output: RosterRow
    side_effects: []

  - method: GET
    path: "/pdm/roster-rows"
    description: "List roster rows across files with optional filters"
    roles: [DataSteward, IntakeOperator]
    code: 200
    input: ["roster_file_id?", "resolved_provider_id?", "status?", "limit?", "offset?"]
    output: RosterRow[]
    side_effects: []

  - method: POST
    path: "/pdm/roster-rows/{id}/link"
    description: "Manually link a PENDING or CONFLICT row to an ACTIVE provider"
    roles: [DataSteward]
    code: 200
    input: [provider_id]
    output: RosterRow
    side_effects: ["row -> MATCHED; ProviderAlias link_kind=MANUAL created"]

  - method: POST
    path: "/pdm/roster-rows/{id}/spawn-new"
    description: "Resolve a CONFLICT row by declaring it a new provider"
    roles: [DataSteward]
    code: 200
    input: []
    output: RosterRow
    side_effects: ["row CONFLICT->NEW_PROVIDER"]

  - method: POST
    path: "/pdm/roster-rows/{id}/reject"
    description: "Manually reject a PENDING row"
    roles: [IntakeOperator]
    code: 200
    input: [reject_reason]
    output: RosterRow
    side_effects: ["row PENDING->REJECTED"]

  # --- Provider ---
  - method: POST
    path: "/pdm/providers"
    description: "Manually create a provider (e.g. seed before first roster)"
    roles: [DataSteward]
    code: 201
    input: [npi, tin, location_key]
    output: Provider
    side_effects: ["lifecycle_status=ACTIVE; initial data_quality_scoring run"]

  - method: GET
    path: "/pdm/providers"
    description: "List providers with filters and pagination"
    roles: [DataSteward, IntakeOperator, DistributionOperator, ProviderContact]
    code: 200
    input: ["lifecycle_status?", "npi?", "tin?", "staleness_flag?", "min_quality_score?", "merged_into_provider_id?", "last_roster_file_id?", "limit?", "offset?"]
    output: Provider[]
    side_effects: []

  - method: GET
    path: "/pdm/providers/{id}"
    description: "Get one provider"
    roles: [DataSteward, IntakeOperator, DistributionOperator, ProviderContact]
    code: 200
    input: []
    output: Provider
    side_effects: []

  - method: POST
    path: "/pdm/providers/{id}/suspend"
    description: "Suspend a provider"
    roles: [DataSteward]
    code: 200
    input: []
    output: Provider
    side_effects: ["ACTIVE->SUSPENDED; SENT attestation requests withdraw; increments version"]

  - method: POST
    path: "/pdm/providers/{id}/reinstate"
    description: "Reinstate a suspended provider (quality floor gate)"
    roles: [DataSteward]
    code: 200
    input: []
    output: Provider
    side_effects: ["SUSPENDED->ACTIVE; increments version"]

  - method: POST
    path: "/pdm/providers/{id}/terminate"
    description: "Terminate a provider; open-ended attributes term-dated"
    roles: [DataSteward]
    code: 200
    input: []
    output: Provider
    side_effects: ["ACTIVE->TERMINATED; increments version; open conflicts resolve KEEP_INCUMBENT"]

  # --- ProviderAttribute ---
  - method: POST
    path: "/pdm/providers/{id}/attributes"
    description: "Manually add an effective-dated attribute to a provider"
    roles: [DataSteward]
    code: 201
    input: [attribute_group, attribute_key, attribute_value, effective_date, "term_date?"]
    output: ProviderAttribute
    side_effects: ["attribute_effective_dating applies; status PENDING->ACTIVE or RETRO_PENDING; increments Provider.version"]

  - method: GET
    path: "/pdm/providers/{id}/attributes"
    description: "List attributes of a provider"
    roles: [DataSteward, IntakeOperator, DistributionOperator]
    code: 200
    input: ["attribute_group?", "status?", "as_of_date?", "limit?", "offset?"]
    output: ProviderAttribute[]
    side_effects: []

  - method: GET
    path: "/pdm/provider-attributes/{id}"
    description: "Get one attribute"
    roles: [DataSteward, IntakeOperator]
    code: 200
    input: []
    output: ProviderAttribute
    side_effects: []

  - method: GET
    path: "/pdm/provider-attributes"
    description: "List attributes across providers with optional provenance filters"
    roles: [DataSteward, IntakeOperator]
    code: 200
    input: ["provider_id?", "roster_source_id?", "roster_row_id?", "supersedes_attribute_id?", "status?", "limit?", "offset?"]
    output: ProviderAttribute[]
    side_effects: []

  - method: PATCH
    path: "/pdm/provider-attributes/{id}"
    description: "Correct an attribute value or term date (re-runs interval logic)"
    roles: [DataSteward]
    code: 200
    input: ["attribute_value?", "term_date?"]
    output: ProviderAttribute
    side_effects: ["attribute_effective_dating re-runs for the group; increments Provider.version"]

  - method: POST
    path: "/pdm/provider-attributes/{id}/approve-retro"
    description: "Approve a RETRO_PENDING attribute; OCC on provider"
    roles: [DataSteward]
    code: 200
    input: [expected_provider_version]
    output: ProviderAttribute
    side_effects: ["RETRO_PENDING->ACTIVE; interval rewrite; increments Provider.version by 1"]

  - method: POST
    path: "/pdm/provider-attributes/{id}/void"
    description: "Void a RETRO_PENDING attribute"
    roles: [DataSteward]
    code: 200
    input: []
    output: ProviderAttribute
    side_effects: ["RETRO_PENDING->VOIDED"]

  # --- ProviderAlias ---
  - method: GET
    path: "/pdm/providers/{id}/aliases"
    description: "List aliases of a provider"
    roles: [DataSteward, IntakeOperator]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: ProviderAlias[]
    side_effects: []

  - method: POST
    path: "/pdm/provider-aliases/{id}/unlink"
    description: "Unlink an alias (it will no longer resolve to the provider)"
    roles: [DataSteward]
    code: 200
    input: []
    output: ProviderAlias
    side_effects: ["status ACTIVE->UNLINKED"]

  # --- AttributeConflict ---
  - method: GET
    path: "/pdm/attribute-conflicts"
    description: "List conflicts with filters"
    roles: [DataSteward]
    code: 200
    input: ["provider_id?", "status?", "incumbent_attribute_id?", "challenger_attribute_id?", "incumbent_source_id?", "challenger_source_id?", "limit?", "offset?"]
    output: AttributeConflict[]
    side_effects: []

  - method: GET
    path: "/pdm/attribute-conflicts/{id}"
    description: "Get one conflict"
    roles: [DataSteward]
    code: 200
    input: []
    output: AttributeConflict
    side_effects: []

  - method: POST
    path: "/pdm/attribute-conflicts/{id}/resolve"
    description: "Resolve a conflict (KEEP_INCUMBENT | ACCEPT_CHALLENGER | MERGE_VALUES); SoD-checked"
    roles: [DataSteward]
    code: 200
    input: [resolution, "resolution_reason?", "resolved_value?"]
    output: AttributeConflict
    side_effects: ["per-resolution attribute transitions; data_quality_scoring re-run"]

  - method: POST
    path: "/pdm/attribute-conflicts/{id}/escalate"
    description: "Escalate a conflict (blocked on precedence ties)"
    roles: [DataSteward]
    code: 200
    input: []
    output: AttributeConflict
    side_effects: ["OPEN->ESCALATED"]

  # --- DistributionTarget ---
  - method: POST
    path: "/pdm/distribution-targets"
    description: "Register a downstream target (CLAIMS | DIRECTORY | NETWORK)"
    roles: [DistributionOperator]
    code: 201
    input: [target_code, endpoint_uri, required_quality_floor]
    output: DistributionTarget
    side_effects: ["status=ACTIVE"]

  - method: GET
    path: "/pdm/distribution-targets"
    description: "List targets"
    roles: [DataSteward, DistributionOperator]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: DistributionTarget[]
    side_effects: []

  - method: POST
    path: "/pdm/distribution-targets/{id}/disable"
    description: "Disable a target"
    roles: [DistributionOperator]
    code: 200
    input: []
    output: DistributionTarget
    side_effects: ["status ACTIVE->DISABLED"]

  # --- DistributionBatch ---
  - method: POST
    path: "/pdm/distribution-batches"
    description: "Create a batch for a target (optionally a retry of a FAILED batch)"
    roles: [DistributionOperator]
    code: 201
    input: [distribution_target_id, "retry_of_batch_id?"]
    output: DistributionBatch
    side_effects: ["status=BUILDING; snapshot_cutoff_at=logical clock; retried-from batch -> SUPERSEDED"]

  - method: GET
    path: "/pdm/distribution-batches"
    description: "List batches"
    roles: [DataSteward, DistributionOperator]
    code: 200
    input: ["distribution_target_id?", "status?", "retry_of_batch_id?", "limit?", "offset?"]
    output: DistributionBatch[]
    side_effects: []

  - method: GET
    path: "/pdm/distribution-batches/{id}"
    description: "Get one batch"
    roles: [DataSteward, DistributionOperator]
    code: 200
    input: []
    output: DistributionBatch
    side_effects: []

  - method: GET
    path: "/pdm/distribution-batches/{id}/items"
    description: "List items of a batch"
    roles: [DataSteward, DistributionOperator]
    code: 200
    input: ["change_kind?", "limit?", "offset?"]
    output: DistributionItem[]
    side_effects: []

  - method: GET
    path: "/pdm/providers/{id}/distribution-items"
    description: "List distribution items across batches that reference a provider"
    roles: [DataSteward, DistributionOperator]
    code: 200
    input: ["change_kind?", "limit?", "offset?"]
    output: DistributionItem[]
    side_effects: []

  - method: POST
    path: "/pdm/distribution-batches/{id}/publish"
    description: "Publish a BUILDING batch; freezes the item set"
    roles: [DistributionOperator]
    code: 200
    input: []
    output: DistributionBatch
    side_effects: ["BUILDING->PUBLISHED; items materialized per distribution_snapshot_selection; provider_count set"]

  - method: POST
    path: "/pdm/distribution-batches/{id}/ack"
    description: "Mark a published batch acknowledged by the downstream"
    roles: [DistributionOperator]
    code: 200
    input: []
    output: DistributionBatch
    side_effects: ["PUBLISHED->ACKED"]

  - method: POST
    path: "/pdm/distribution-batches/{id}/fail"
    description: "Mark a published batch failed"
    roles: [DistributionOperator]
    code: 200
    input: [failure_reason]
    output: DistributionBatch
    side_effects: ["PUBLISHED->FAILED"]

  - method: POST
    path: "/pdm/distribution-batches/{id}/discard"
    description: "Discard a BUILDING batch"
    roles: [DistributionOperator]
    code: 200
    input: []
    output: DistributionBatch
    side_effects: ["BUILDING->SUPERSEDED"]

  # --- AttestationCampaign ---
  - method: POST
    path: "/pdm/attestation-campaigns"
    description: "Create a campaign"
    roles: [DataSteward]
    code: 201
    input: [name, window_days]
    output: AttestationCampaign
    side_effects: ["status=DRAFT"]

  - method: GET
    path: "/pdm/attestation-campaigns"
    description: "List campaigns"
    roles: [DataSteward, ProviderContact]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: AttestationCampaign[]
    side_effects: []

  - method: GET
    path: "/pdm/attestation-campaigns/{id}"
    description: "Get one campaign"
    roles: [DataSteward, ProviderContact]
    code: 200
    input: []
    output: AttestationCampaign
    side_effects: []

  - method: POST
    path: "/pdm/attestation-campaigns/{id}/open"
    description: "Open a campaign"
    roles: [DataSteward]
    code: 200
    input: []
    output: AttestationCampaign
    side_effects: ["DRAFT->OPEN"]

  - method: POST
    path: "/pdm/attestation-campaigns/{id}/close"
    description: "Close a campaign (blocked with open requests)"
    roles: [DataSteward]
    code: 200
    input: []
    output: AttestationCampaign
    side_effects: ["OPEN->CLOSED; DRAFT requests withdraw"]

  # --- AttestationRequest ---
  - method: POST
    path: "/pdm/attestation-campaigns/{id}/attestation-requests"
    description: "Create a DRAFT attestation request for a provider inside a campaign"
    roles: [DataSteward]
    code: 201
    input: [provider_id]
    output: AttestationRequest
    side_effects: ["status=DRAFT"]

  - method: GET
    path: "/pdm/attestation-campaigns/{id}/attestation-requests"
    description: "List requests in a campaign"
    roles: [DataSteward, ProviderContact]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: AttestationRequest[]
    side_effects: []

  - method: GET
    path: "/pdm/attestation-requests"
    description: "List requests across campaigns"
    roles: [DataSteward, ProviderContact]
    code: 200
    input: ["provider_id?", "status?", "attestation_campaign_id?", "limit?", "offset?"]
    output: AttestationRequest[]
    side_effects: []

  - method: GET
    path: "/pdm/attestation-requests/{id}"
    description: "Get one attestation request"
    roles: [DataSteward, ProviderContact]
    code: 200
    input: []
    output: AttestationRequest
    side_effects: []

  - method: GET
    path: "/pdm/providers/{id}/attestation-requests"
    description: "List attestation requests for a provider"
    roles: [DataSteward, ProviderContact]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: AttestationRequest[]
    side_effects: []

  - method: POST
    path: "/pdm/attestation-requests/{id}/send"
    description: "Dispatch a DRAFT request; starts the SLA window"
    roles: [DataSteward]
    code: 200
    input: []
    output: AttestationRequest
    side_effects: ["DRAFT->SENT; sent_at/due_at set"]

  - method: POST
    path: "/pdm/attestation-requests/{id}/respond"
    description: "Provider contact responds CONFIRMED or CORRECTED"
    roles: [ProviderContact]
    code: 200
    input: [attestation_outcome, "corrected_payload?"]
    output: AttestationRequest
    side_effects: ["SENT->RESPONDED; corrections upsert attributes; quality re-scored"]

  - method: POST
    path: "/pdm/attestation-requests/{id}/escalate"
    description: "Escalate an EXPIRED request within the escalation window"
    roles: [DataSteward]
    code: 200
    input: []
    output: AttestationRequest
    side_effects: ["EXPIRED->ESCALATED; possible provider auto-suspend"]

  - method: POST
    path: "/pdm/attestation-requests/{id}/withdraw"
    description: "Withdraw a DRAFT request"
    roles: [DataSteward]
    code: 200
    input: []
    output: AttestationRequest
    side_effects: ["DRAFT->WITHDRAWN"]

  - method: POST
    path: "/pdm/attestation-requests/sweep"
    description: "System sweep: all SENT requests with logical clock >= due_at transition to EXPIRED"
    roles: [DataSteward]
    code: 200
    input: []
    output: { expired_count: integer, expired_request_ids: "string[]" }
    side_effects: ["SENT->EXPIRED per request; staleness recompute; quality re-score"]

  # --- DataQualityScore ---
  - method: GET
    path: "/pdm/providers/{id}/quality-scores"
    description: "List score history for a provider"
    roles: [DataSteward, IntakeOperator, DistributionOperator]
    code: 200
    input: ["limit?", "offset?"]
    output: DataQualityScore[]
    side_effects: []

  - method: POST
    path: "/pdm/providers/{id}/quality-scores/recompute"
    description: "Force recompute of a provider's quality score"
    roles: [DataSteward]
    code: 200
    input: []
    output: DataQualityScore
    side_effects: ["new DataQualityScore appended; Provider.current_quality_score and staleness_flag refreshed"]

  - method: GET
    path: "/pdm/quality-scores"
    description: "List quality score rows across providers"
    roles: [DataSteward, IntakeOperator, DistributionOperator]
    code: 200
    input: ["provider_id?", "roster_file_id?", "limit?", "offset?"]
    output: DataQualityScore[]
    side_effects: []

  - method: GET
    path: "/pdm/quality-scores/{id}"
    description: "Get one quality score row"
    roles: [DataSteward, IntakeOperator, DistributionOperator]
    code: 200
    input: []
    output: DataQualityScore
    side_effects: []

  # --- ProviderMerge ---
  - method: POST
    path: "/pdm/provider-merges"
    description: "Merge a duplicate provider into a survivor; OCC on merged provider"
    roles: [DataSteward]
    code: 201
    input: [survivor_provider_id, merged_provider_id, rationale, expected_provider_version]
    output: ProviderMergeRecord
    side_effects: ["merged provider -> MERGED; attributes/aliases/conflicts re-pointed; survivor re-scored; increments merged Provider.version by 1"]

  - method: GET
    path: "/pdm/provider-merges"
    description: "List merge records"
    roles: [DataSteward]
    code: 200
    input: ["survivor_provider_id?", "merged_provider_id?", "limit?", "offset?"]
    output: ProviderMergeRecord[]
    side_effects: []

  - method: GET
    path: "/pdm/provider-merges/{id}"
    description: "Get one merge record"
    roles: [DataSteward]
    code: 200
    input: []
    output: ProviderMergeRecord
    side_effects: []

  - method: GET
    path: "/pdm/providers/{id}/merge-records"
    description: "List merge records where this provider is survivor or merged party"
    roles: [DataSteward]
    code: 200
    input: ["limit?", "offset?"]
    output: ProviderMergeRecord[]
    side_effects: []

# =============================================================================
# 1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Malformed body, missing required field, or invalid enum value" }
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "X-User-Role header missing or unknown" }
  - { id: ERR_FORBIDDEN, http: 403, condition: "Role not permitted for the endpoint" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Path id does not exist or is outside the parent chain" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Resource not in a state that permits the requested transition" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_*_version does not match the current parent version (OCC)" }
  - { id: ERR_SOD_SAME_USER, http: 403, condition: "Commit attempted by the same opaque user who registered the file" }
  - { id: ERR_SOD_ADJUDICATOR, http: 403, condition: "Conflict resolution attempted by the operator who committed the challenger file" }
  - { id: ERR_SOURCE_NOT_ACTIVE, http: 409, condition: "RosterSource is SUSPENDED or RETIRED" }
  - { id: ERR_PRECEDENCE_RANK_CONFLICT, http: 409, condition: "precedence_rank duplicates another non-RETIRED source" }
  - { id: ERR_DUPLICATE_FILE, http: 409, condition: "external_file_ref or checksum already registered for this source" }
  - { id: ERR_ROW_COUNT_MISMATCH, http: 422, condition: "declared_row_count differs from materialized rows at parse" }
  - { id: ERR_UNRESOLVED_ROW_CONFLICTS, http: 409, condition: "Commit blocked: one or more rows still in CONFLICT" }
  - { id: ERR_INVALID_DATE_RANGE, http: 422, condition: "term_date <= effective_date" }
  - { id: ERR_PROVIDER_NOT_LINKABLE, http: 409, condition: "Target provider not ACTIVE for link/merge/send" }
  - { id: ERR_MERGE_SELF, http: 422, condition: "survivor_provider_id equals merged_provider_id" }
  - { id: ERR_QUALITY_FLOOR_NOT_MET, http: 409, condition: "Reinstate blocked: quality score below the minimum ACTIVE target floor" }
  - { id: ERR_BATCH_INFLIGHT, http: 409, condition: "Another batch for the same target is BUILDING or PUBLISHED" }
  - { id: ERR_TARGET_DISABLED, http: 409, condition: "DistributionTarget is DISABLED" }
  - { id: ERR_ATTESTATION_ALREADY_INFLIGHT, http: 409, condition: "Provider already has a SENT or ESCALATED attestation request" }
  - { id: ERR_CAMPAIGN_NOT_OPEN, http: 409, condition: "Campaign not OPEN when sending a request" }
  - { id: ERR_CAMPAIGN_HAS_OPEN_REQUESTS, http: 409, condition: "Campaign close blocked by SENT/ESCALATED requests" }
  - { id: ERR_OPEN_ATTESTATION_EXISTS, http: 409, condition: "Terminate blocked by a SENT attestation request" }
  - { id: ERR_MERGE_VALUE_REQUIRED, http: 422, condition: "resolution=MERGE_VALUES without resolved_value" }
  - { id: ERR_PRECEDENCE_TIE_NOT_ESCALATABLE, http: 409, condition: "Escalation of an equal-rank conflict is not permitted" }
  - { id: ERR_NO_REPLACEMENT_FILE, http: 409, condition: "Supersede requires a replacement file in VALIDATED or COMMITTED for the source" }
  - { id: ERR_SOURCE_HAS_INFLIGHT_FILE, http: 409, condition: "Suspend/retire blocked by files in RECEIVED/PARSED/NORMALIZED/VALIDATED" }
  - { id: ERR_ATTESTATION_WINDOW_CLOSED, http: 409, condition: "Respond attempted at or after due_at" }
  - { id: ERR_ESCALATION_WINDOW_CLOSED, http: 409, condition: "Escalate attempted at or after due_at + window_days" }
  - { id: ERR_CORRECTION_PAYLOAD_REQUIRED, http: 422, condition: "attestation_outcome=CORRECTED without corrected_payload" }

# =============================================================================
# 1.7 RBAC Matrix
# =============================================================================
roles:
  - name: IntakeOperator
    description: "Roster intake operator: registers files, drives parse/normalize/validate/commit, rejects files/rows"
    identity: opaque
    exclusive_operations:
      - "POST /pdm/roster-files"
      - "POST /pdm/roster-files/{id}/parse"
      - "POST /pdm/roster-files/{id}/normalize"
      - "POST /pdm/roster-files/{id}/validate"
      - "POST /pdm/roster-files/{id}/commit"
      - "POST /pdm/roster-files/{id}/reject"
      - "POST /pdm/roster-rows/{id}/reject"
    shared_operations:
      - "GET /pdm/roster-sources, /pdm/roster-files, /pdm/roster-rows, /pdm/providers, /pdm/provider-attributes, /pdm/providers/{id}/quality-scores"

  - name: DataSteward
    description: "Provider data steward: source config, identity adjudication, merges, attribute retro approvals, conflict resolution, attestation campaigns, quality recompute"
    identity: opaque
    exclusive_operations:
      - "POST/PATCH /pdm/roster-sources and suspend/resume/retire"
      - "POST /pdm/roster-files/{id}/supersede"
      - "POST /pdm/roster-rows/{id}/link and /spawn-new"
      - "POST /pdm/providers lifecycle endpoints and manual create"
      - "POST /pdm/providers/{id}/attributes, PATCH /pdm/provider-attributes/{id}, approve-retro, void"
      - "POST /pdm/attribute-conflicts/{id}/resolve and /escalate"
      - "POST /pdm/provider-aliases/{id}/unlink"
      - "AttestationCampaign and AttestationRequest management incl. sweep"
      - "POST /pdm/provider-merges"
      - "POST /pdm/providers/{id}/quality-scores/recompute"
      - "POST /pdm/_clock/set_current_utc"
    shared_operations:
      - "GET endpoints across all resources"

  - name: DistributionOperator
    description: "Downstream distribution operator: manages targets, builds/publishes/acks/fails batches"
    identity: opaque
    exclusive_operations:
      - "POST /pdm/distribution-targets and /disable"
      - "POST /pdm/distribution-batches and publish/ack/fail/discard"
    shared_operations:
      - "GET /pdm/providers, /pdm/roster-sources, /pdm/distribution-batches, /pdm/distribution-targets, /pdm/providers/{id}/quality-scores"

  - name: ProviderContact
    description: "External provider representative responding to attestation outreach"
    identity: opaque
    exclusive_operations:
      - "POST /pdm/attestation-requests/{id}/respond"
    shared_operations:
      - "GET /pdm/providers, /pdm/attestation-campaigns, /pdm/attestation-requests, /pdm/roster-sources"
