              as: Dealer
              as_user_id: ${d_id}
            - call: "POST /kcma/orders"
              as: Dealer
              as_user_id: ${d_id}
              captures: { o2_id: $.data.id }
            - call: "POST /kcma/orders/${o2_id}/lines"
              payload: { line_type: "BOX", finish_id: "${fs_id}", width_in: 24, height_in: 30, depth_in: 12, qty: 1, unit_list_price_cents: 50000 }
              as: Dealer
              as_user_id: ${d_id}
            - call: "POST /kcma/orders/${o2_id}/submit"
              as: Dealer
              as_user_id: ${d_id}
            - call: "POST /kcma/delivery-routes"
              payload: { route_code: "RT-S", route_date: "2026-05-06", capacity_cu_ft: 100.0 }
