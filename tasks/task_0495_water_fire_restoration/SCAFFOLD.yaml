# =============================================================================
# Water & Fire Restoration / Disaster Cleanup — benchmark seed tables (v1)
# Servpro-style: FNOL intake & dispatch, water category/class & moisture mapping,
# equipment placement & drying log, Xactimate scope & insurance estimate, daily
# monitoring & psychrometrics, mold/antimicrobial, contents pack-out & inventory,
# completion & warranty.
#
# Topology: FLAT — every entity is a top-level collection under /restoration with
# foreign-key references; reverse-reachability is via filtered-list GETs.
# =============================================================================

scenario: |
  495. Water & Fire Restoration / Disaster Cleanup (Servpro style): loss intake
  (FNOL) & dispatch, water category/class & moisture mapping, equipment (air
  mover/dehumidifier) placement & drying log, Xactimate scope & insurance
  estimate, daily monitoring & psychrometrics, mold/antimicrobial, contents
  pack-out & inventory, completion & warranty

domain_name: water-fire-restoration
api_prefix: /restoration

# =============================================================================
# Response Envelope (FIXED — verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# Complexity Profile
# =============================================================================
complexity_profile:
  primary_archetype: workflow_orchestration
  secondary_archetype: ledger_reconciliation
  complexity_layers:
    - dual_variant_calculation       # estimated scope cost vs final billed; instantaneous vs trailing drying progress
    - cascading_side_effects         # job cancel cascades to placements, units, chambers, contents
    - rate_threshold_triggers        # drying-goal moisture threshold, GPP differential, mold containment sqft
    - derived_field_reconciliation   # job drying_status & chamber dry flag recomputed from readings/placements
    - optimistic_concurrency         # OCC on LossJob.version for estimate supersede

  entity_topology: flat
  state_machine_shape: branching     # branch+revert on LossJob and DryingChamber; compound bubble-up
  relationship_patterns:
    - one_to_many        # LossJob -> DryingChamber, MoistureReading, ContentsItem, EquipmentPlacement, ScopeEstimate
    - many_to_many       # EquipmentUnit <-> DryingChamber via EquipmentPlacement
    - cross_aggregate    # LossJob -> InsuranceClaim; EquipmentPlacement -> EquipmentUnit (shared pool)

  role_model: peer_roles             # Dispatcher, Technician, Estimator, Adjuster, plus opaque PlatformAdmin
  consistency_model: immediate

# =============================================================================
# Table 1: Entity-Relationship Table
# =============================================================================
entities:
  - name: InsuranceClaim
    parent: null
    common_fields: true
    fields:
      - { name: carrier_name, type: string, source: input, description: "Insurance carrier name" }
      - { name: policy_number, type: string, source: input, description: "Policy number" }
      - { name: adjuster_user_id, type: string, source: input, description: "Opaque X-User-ID of the Adjuster who owns this claim; stored, never required to equal any entity id" }
      - { name: peril, type: enum, source: input, description: "WATER | FIRE | MOLD — cause of loss", constraints: "one of WATER, FIRE, MOLD" }
      - { name: coverage_limit_cents, type: integer, source: input, description: "Total coverage limit for the claim in cents" }
      - { name: deductible_cents, type: integer, source: input, description: "Policy deductible in cents", default: 0 }
      - { name: depreciation_pct, type: number, source: input, description: "Recoverable depreciation percentage applied per estimate line item (0-100)", default: 0 }
      - { name: tax_pct, type: number, source: input, description: "Sales tax percentage applied to summed ACV (0-100)", default: 0 }
      - { name: status, type: enum, source: system, description: "OPEN | SETTLED — OPEN on creation; SETTLED when an estimate is approved", default: "OPEN", constraints: "one of OPEN, SETTLED" }
      - { name: settled_estimate_id, type: string, source: system, description: "FK -> ScopeEstimate.id; set when the claim settles, else null", default: null }

  - name: LossJob
    parent: null
    common_fields: true
    fields:
      - { name: claim_id, type: string, source: input, description: "FK -> InsuranceClaim.id; the claim funding this loss" }
      - { name: property_address, type: string, source: input, description: "Loss site address" }
      - { name: loss_type, type: enum, source: input, description: "WATER | FIRE | SMOKE", constraints: "one of WATER, FIRE, SMOKE" }
      - { name: water_category, type: integer, source: input, description: "IICRC water category 1 (clean), 2 (gray), 3 (black). Required when loss_type==WATER; null otherwise", default: null, constraints: "1, 2, or 3" }
      - { name: water_class, type: integer, source: input, description: "IICRC evaporation class 1-4. Required when loss_type==WATER; null otherwise", default: null, constraints: "1, 2, 3, or 4" }
      - { name: assigned_technician_id, type: string, source: system, description: "FK -> Technician.id; set on dispatch, else null", default: null }
      - { name: antimicrobial_required, type: boolean, source: computed, description: "TRUE when water_category==3 OR loss_type in {FIRE,SMOKE}; computed at intake", default: false }
      - { name: monitoring_day, type: integer, source: system, description: "Current monitoring-day epoch index; starts 0, +1 per advance-day", default: 0 }
      - { name: drying_status, type: enum, source: computed, description: "NOT_STARTED | DRYING | DRY_STANDARD_MET — derived from chamber dry flags", default: "NOT_STARTED", constraints: "one of NOT_STARTED, DRYING, DRY_STANDARD_MET" }
      - { name: status, type: enum, source: system, description: "FNOL → DISPATCHED → MITIGATION → MONITORING → COMPLETED / CANCELLED — lifecycle", default: "FNOL", constraints: "one of FNOL, DISPATCHED, MITIGATION, MONITORING, COMPLETED, CANCELLED" }
      - { name: completed_at, type: datetime, source: computed, description: "Clock timestamp the job reached COMPLETED, else null", default: null }
      - { name: warranty_expires_on, type: datetime, source: computed, description: "completed_at + WARRANTY_DAYS; set when the job reaches COMPLETED, else null", default: null }
      - { name: version, type: integer, source: system, description: "Optimistic concurrency version; starts at 1, +1 on every mutation" }

  - name: Technician
    parent: null
    common_fields: false
    fields:
      - { name: full_name, type: string, source: input, description: "Technician name" }
      - { name: certification, type: enum, source: input, description: "WRT (water) | ASD (structural drying) | AMRT (mold)", constraints: "one of WRT, ASD, AMRT" }
      - { name: active, type: boolean, source: input, description: "Whether the technician is available for dispatch", default: true }

  - name: DryingChamber
    parent: null
    common_fields: true
    fields:
      - { name: job_id, type: string, source: input, description: "FK -> LossJob.id; owning job" }
      - { name: room_label, type: string, source: input, description: "Room/area label, unique per job among non-DECOMMISSIONED chambers" }
      - { name: floor_area_sqft, type: integer, source: input, description: "Affected floor area in square feet" }
      - { name: wet_wall_linear_ft, type: integer, source: input, description: "Linear feet of wet wall surface", default: 0 }
      - { name: dehu_ppd_rating, type: integer, source: input, description: "AHAM pints-per-day rating of the dehumidifier model assigned to this chamber" }
      - { name: dry_standard_pct, type: number, source: input, description: "Target moisture content percentage from the unaffected reference material" }
      - { name: latest_moisture_content_pct, type: number, source: computed, description: "moisture_content_pct of the most recent (created_at DESC) MoistureReading; null until first reading", default: null }
      - { name: is_dry, type: boolean, source: computed, description: "TRUE when latest_moisture_content_pct <= dry_standard_pct + DRY_TOLERANCE_PCT; recomputed on each reading", default: false }
      - { name: air_movers_required, type: integer, source: computed, description: "Required air mover count from the sizing formula; computed at creation" }
      - { name: dehumidifiers_required, type: integer, source: computed, description: "Required dehumidifier count from the sizing formula; computed at creation" }
      - { name: status, type: enum, source: system, description: "OPEN → DRIED → DECOMMISSIONED — chamber lifecycle", default: "OPEN", constraints: "one of OPEN, DRIED, DECOMMISSIONED" }
      - { name: version, type: integer, source: system, description: "Optimistic concurrency version; starts at 1, +1 on every mutation" }

  - name: EquipmentUnit
    parent: null
    common_fields: true
    fields:
      - { name: asset_tag, type: string, source: input, description: "Unique asset tag for the physical device" }
      - { name: kind, type: enum, source: input, description: "AIR_MOVER | DEHUMIDIFIER", constraints: "one of AIR_MOVER, DEHUMIDIFIER" }
      - { name: status, type: enum, source: system, description: "AVAILABLE | DEPLOYED — current pool state", default: "AVAILABLE", constraints: "one of AVAILABLE, DEPLOYED" }
      - { name: active_placement_id, type: string, source: system, description: "FK -> EquipmentPlacement.id; the placement currently holding this unit, else null", default: null }
      - { name: version, type: integer, source: system, description: "Optimistic concurrency version; starts at 1, +1 on every mutation" }

  - name: EquipmentPlacement
    parent: null
    common_fields: true
    fields:
      - { name: job_id, type: string, source: input, description: "FK -> LossJob.id; owning job" }
      - { name: chamber_id, type: string, source: input, description: "FK -> DryingChamber.id; chamber the unit is placed in" }
      - { name: equipment_unit_id, type: string, source: input, description: "FK -> EquipmentUnit.id; the physical device deployed" }
      - { name: kind, type: enum, source: computed, description: "AIR_MOVER | DEHUMIDIFIER — copied from the unit at placement", constraints: "one of AIR_MOVER, DEHUMIDIFIER" }
      - { name: placed_on_day, type: integer, source: computed, description: "LossJob.monitoring_day at placement; 0-based" }
      - { name: removed_on_day, type: integer, source: computed, description: "LossJob.monitoring_day when removed; null while active", default: null }
      - { name: billable_days, type: integer, source: computed, description: "max(1, removed_on_day - placed_on_day); 0 while active", default: 0 }
      - { name: status, type: enum, source: system, description: "ACTIVE → REMOVED — placement lifecycle", default: "ACTIVE", constraints: "one of ACTIVE, REMOVED" }
      - { name: version, type: integer, source: system, description: "Optimistic concurrency version; starts at 1, +1 on every mutation" }

  - name: MoistureReading
    parent: null
    common_fields: false
    fields:
      - { name: job_id, type: string, source: system, description: "FK -> LossJob.id; owning job (denormalized for job-wide listing)" }
      - { name: chamber_id, type: string, source: input, description: "FK -> DryingChamber.id; chamber the reading belongs to" }
      - { name: monitoring_day, type: integer, source: computed, description: "LossJob.monitoring_day when the reading was logged" }
      - { name: temp_f, type: number, source: input, description: "Dry-bulb temperature inside the chamber in °F" }
      - { name: relative_humidity_pct, type: number, source: input, description: "Relative humidity inside the chamber (0-100)" }
      - { name: moisture_content_pct, type: number, source: input, description: "Material moisture content percentage of the affected material" }
      - { name: gpp, type: number, source: computed, description: "Grains-per-pound humidity ratio computed from temp_f and relative_humidity_pct" }

  - name: ScopeEstimate
    parent: null
    common_fields: true
    fields:
      - { name: job_id, type: string, source: input, description: "FK -> LossJob.id; owning job" }
      - { name: estimated_drying_days, type: integer, source: input, description: "Estimator's projected drying duration used for the equipment estimate" }
      - { name: line_items, type: array, source: input, description: "Array of { qty:int, unit_price_cents:int } Xactimate scope lines" }
      - { name: scope_lines_total_cents, type: integer, source: computed, description: "Sum of qty*unit_price_cents over line_items" }
      - { name: equipment_estimate_cents, type: integer, source: computed, description: "Forward-looking equipment cost over all non-DECOMMISSIONED chambers for estimated_drying_days" }
      - { name: estimate_total_cents, type: integer, source: computed, description: "scope_lines_total_cents + equipment_estimate_cents" }
      - { name: acv_total_cents, type: integer, source: computed, description: "Insurance ACV (per-line depreciation then summed) plus tax, from the claim's depreciation_pct and tax_pct" }
      - { name: status, type: enum, source: system, description: "DRAFT → APPROVED / SUPERSEDED — estimate lifecycle", default: "DRAFT", constraints: "one of DRAFT, APPROVED, SUPERSEDED" }
      - { name: version, type: integer, source: system, description: "Optimistic concurrency version; starts at 1, +1 on every mutation" }

  - name: ContentsItem
    parent: null
    common_fields: true
    fields:
      - { name: job_id, type: string, source: input, description: "FK -> LossJob.id; owning job" }
      - { name: description, type: string, source: input, description: "Item description" }
      - { name: declared_value_cents, type: integer, source: input, description: "Owner-declared replacement value in cents" }
      - { name: allocated_value_cents, type: integer, source: computed, description: "Waterfall-allocated covered value after a pack-out valuation run; 0 until run", default: 0 }
      - { name: status, type: enum, source: system, description: "PACKED_OUT → STORED → RETURNED — contents chain of custody", default: "PACKED_OUT", constraints: "one of PACKED_OUT, STORED, RETURNED" }
      - { name: version, type: integer, source: system, description: "Optimistic concurrency version; starts at 1, +1 on every mutation" }

# =============================================================================
# Table 2: State Machine Table
# =============================================================================
state_machines:
  - entity: LossJob
    initial_state: FNOL
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - from: FNOL
        to: DISPATCHED
        trigger: "POST /restoration/jobs/{jobId}/dispatch"
        actor: Dispatcher
        preconditions:
          - "Referenced Technician exists and active == true (ERR_TECHNICIAN_UNAVAILABLE)"
          - "If loss_type == WATER, technician.certification in {WRT, ASD} (ERR_CERTIFICATION_MISMATCH)"
          - "If loss_type in {FIRE, SMOKE} OR antimicrobial_required == true, technician.certification in {AMRT, ASD} (ERR_CERTIFICATION_MISMATCH)"
        side_effects:
          - "assigned_technician_id = body.technician_id"
          - "status -> DISPATCHED"

      - from: DISPATCHED
        to: MITIGATION
        trigger: "POST /restoration/jobs/{jobId}/start-mitigation"
        actor: Technician
        preconditions:
          - "At least one non-DECOMMISSIONED DryingChamber exists on the job (ERR_NO_CHAMBERS)"
        side_effects:
          - "status -> MITIGATION"

      - from: MITIGATION
        to: MONITORING
        trigger: "POST /restoration/jobs/{jobId}/begin-monitoring"
        actor: Technician
        preconditions:
          - "Every OPEN DryingChamber has ACTIVE EquipmentPlacements totaling >= its air_movers_required AIR_MOVER units AND >= its dehumidifiers_required DEHUMIDIFIER units (ERR_EQUIPMENT_UNDERSIZED)"
        side_effects:
          - "status -> MONITORING"

      - from: MONITORING
        to: COMPLETED
        trigger: "POST /restoration/jobs/{jobId}/complete"
        actor: Technician
        preconditions:
          - "drying_status == DRY_STANDARD_MET, i.e. every non-DECOMMISSIONED chamber has status == DRIED (ERR_DRY_STANDARD_NOT_MET)"
          - "No EquipmentPlacement on the job is still ACTIVE (ERR_EQUIPMENT_STILL_DEPLOYED)"
          - "An APPROVED ScopeEstimate exists for the job (ERR_NO_APPROVED_ESTIMATE)"
        side_effects:
          - "status -> COMPLETED"
          - "completed_at = clock now; warranty_expires_on = completed_at + WARRANTY_DAYS"
          - "Every STORED ContentsItem on the job -> RETURNED"

      - from: FNOL
        to: CANCELLED
        trigger: "POST /restoration/jobs/{jobId}/cancel"
        actor: Dispatcher
        preconditions: []
        side_effects:
          - "status -> CANCELLED"

      - from: DISPATCHED
        to: CANCELLED
        trigger: "POST /restoration/jobs/{jobId}/cancel"
        actor: Dispatcher
        preconditions: []
        side_effects:
          - "status -> CANCELLED"
          - "assigned_technician_id -> null (technician released)"

      - from: MITIGATION
        to: CANCELLED
        trigger: "POST /restoration/jobs/{jobId}/cancel"
        actor: Dispatcher
        preconditions: []
        side_effects:
          - "status -> CANCELLED. CASCADE: hop1 each ACTIVE EquipmentPlacement on the job -> REMOVED; hop2 each placement removed in hop1 sets its EquipmentUnit.status -> AVAILABLE and active_placement_id -> null; hop3 each OPEN DryingChamber -> DECOMMISSIONED"
          - "Each PACKED_OUT or STORED ContentsItem -> RETURNED"

      - from: MONITORING
        to: CANCELLED
        trigger: "POST /restoration/jobs/{jobId}/cancel"
        actor: Dispatcher
        preconditions: []
        side_effects:
          - "status -> CANCELLED. CASCADE: hop1 each ACTIVE EquipmentPlacement on the job -> REMOVED; hop2 each placement removed in hop1 sets its EquipmentUnit.status -> AVAILABLE and active_placement_id -> null; hop3 each OPEN DryingChamber -> DECOMMISSIONED"
          - "Each PACKED_OUT or STORED ContentsItem -> RETURNED"

      - from: MONITORING
        to: MITIGATION
        trigger: "POST /restoration/jobs/{jobId}/reopen-mitigation"
        actor: Technician
        preconditions:
          - "At least one non-DECOMMISSIONED DryingChamber has is_dry == false (ERR_NOTHING_TO_REOPEN)"
        side_effects:
          - "status -> MITIGATION (revert: lets the crew add chambers / placements before resuming monitoring)"
        note: "Branch-with-revert loop MONITORING -> MITIGATION -> MONITORING for additional drying capacity."

  - entity: DryingChamber
    initial_state: OPEN
    terminal_states: [DECOMMISSIONED]
    transitions:
      - from: OPEN
        to: DRIED
        trigger: "system (automatic when a MoistureReading sets is_dry == true)"
        actor: system
        preconditions:
          - "is_dry == true after the reading (latest_moisture_content_pct <= dry_standard_pct + DRY_TOLERANCE_PCT)"
        side_effects:
          - "status -> DRIED (bubble-up: triggers LossJob.drying_status recompute; if every non-DECOMMISSIONED chamber is DRIED, job.drying_status -> DRY_STANDARD_MET)"

      - from: DRIED
        to: OPEN
        trigger: "system (automatic when a new MoistureReading sets is_dry == false)"
        actor: system
        preconditions:
          - "is_dry == false after the new reading"
        side_effects:
          - "status -> OPEN (revert: a re-wetting reading reopens a dried chamber); LossJob.drying_status recomputed (DRY_STANDARD_MET -> DRYING)"
        note: "Cyclic OPEN<->DRIED on the same chamber driven by readings."

      - from: OPEN
        to: DECOMMISSIONED
        trigger: "POST /restoration/chambers/{chamberId}/decommission"
        actor: Technician
        preconditions:
          - "No ACTIVE EquipmentPlacement references this chamber (ERR_CHAMBER_HAS_EQUIPMENT)"
        side_effects:
          - "status -> DECOMMISSIONED; excluded from drying_status and room_label uniqueness; LossJob.drying_status recomputed"

      - from: DRIED
        to: DECOMMISSIONED
        trigger: "POST /restoration/chambers/{chamberId}/decommission"
        actor: Technician
        preconditions:
          - "No ACTIVE EquipmentPlacement references this chamber (ERR_CHAMBER_HAS_EQUIPMENT)"
        side_effects:
          - "status -> DECOMMISSIONED"

  - entity: EquipmentPlacement
    initial_state: ACTIVE
    terminal_states: [REMOVED]
    transitions:
      - from: ACTIVE
        to: REMOVED
        trigger: "POST /restoration/placements/{placementId}/remove"
        actor: Technician
        preconditions: []
        side_effects:
          - "removed_on_day = job.monitoring_day; billable_days = max(1, removed_on_day - placed_on_day)"
          - "EquipmentUnit.status -> AVAILABLE; EquipmentUnit.active_placement_id -> null (cross-entity)"

  - entity: ScopeEstimate
    initial_state: DRAFT
    terminal_states: [APPROVED, SUPERSEDED]
    transitions:
      - from: DRAFT
        to: APPROVED
        trigger: "POST /restoration/estimates/{estimateId}/approve"
        actor: Adjuster
        preconditions:
          - "Parent claim.status == OPEN (ERR_CLAIM_ALREADY_SETTLED)"
          - "estimate_total_cents <= claim.coverage_limit_cents (ERR_OVER_COVERAGE_LIMIT)"
          - "No other APPROVED estimate exists on the job (ERR_ESTIMATE_ALREADY_APPROVED)"
        side_effects:
          - "status -> APPROVED (cross-aggregate: claim.status -> SETTLED; claim.settled_estimate_id = this estimate id)"

      - from: DRAFT
        to: SUPERSEDED
        trigger: "system (automatic when a new DRAFT estimate is created on the job via POST /restoration/estimates)"
        actor: system
        preconditions: []
        side_effects:
          - "Prior DRAFT estimate on the job -> SUPERSEDED when a new DRAFT is created (the create is OCC-guarded on LossJob.version)"

  - entity: ContentsItem
    initial_state: PACKED_OUT
    terminal_states: [RETURNED]
    transitions:
      - from: PACKED_OUT
        to: STORED
        trigger: "POST /restoration/contents/{itemId}/store"
        actor: Technician
        preconditions: []
        side_effects:
          - "status -> STORED"

      - from: STORED
        to: RETURNED
        trigger: "POST /restoration/contents/{itemId}/return"
        actor: Technician
        preconditions: []
        side_effects:
          - "status -> RETURNED"

      - from: PACKED_OUT
        to: RETURNED
        trigger: "POST /restoration/contents/{itemId}/return"
        actor: Technician
        preconditions: []
        side_effects:
          - "status -> RETURNED (direct return without intermediate storage)"

# =============================================================================
# Concurrency Rules (§1.2.1) — true races only, OCC on parent version
# =============================================================================
concurrency_rules:
  - rule_id: estimate-create-stale-job
    parent_entity: LossJob
    write_endpoint: "POST /restoration/estimates"
    occ_field: "expected_job_version"
    description: |
      Creating a new DRAFT ScopeEstimate against a LossJob whose version has
      advanced since the client last observed it is rejected. A new DRAFT
      estimate legitimately supersedes the prior DRAFT; if another writer has
      already created a newer estimate (bumping the job version), the current
      writer's view of the job — and of which estimate is the live DRAFT — is
      stale, so the create is rejected on the stale version.
    error_id: ERR_STALE_JOB_VERSION
    http_status: 412

# =============================================================================
# Table 3: Calculation Rules Table
# =============================================================================
calculations:
  - name: psychrometric_gpp
    trigger: "POST /restoration/chambers/{chamberId}/readings (each MoistureReading)"
    algorithm: weighted_scoring
    formula: |
      # Grains-per-pound humidity ratio from dry-bulb temp (°F) and RH (%).
      Tc  = (temp_f - 32) * 5 / 9
      es  = 6.112 * exp(17.62 * Tc / (243.12 + Tc))     # saturation vapor pressure, hPa (Magnus)
      e   = es * (relative_humidity_pct / 100)          # actual vapor pressure, hPa
      W   = 0.62198 * e / (P_ATM_HPA - e)               # humidity ratio, lb water / lb dry air
      gpp = round_half_up(W * GRAINS_PER_LB, 0)         # whole grains
    input_set: "A single MoistureReading's temp_f and relative_humidity_pct; independent of other readings."
    constants:
      P_ATM_HPA: 1013.25
      GRAINS_PER_LB: 7000
    precision: "whole grains, round_half_up"

  - name: chamber_dry_determination
    trigger: "POST /restoration/chambers/{chamberId}/readings (recompute chamber.is_dry after writing the reading)"
    algorithm: threshold
    formula: |
      latest_moisture_content_pct = moisture_content_pct of the newest reading on the chamber (created_at DESC; readings are append-only so created_at strictly increases)
      is_dry = (latest_moisture_content_pct <= dry_standard_pct + DRY_TOLERANCE_PCT)
    input_set: "The single most recent MoistureReading on the chamber by created_at DESC."
    constants:
      DRY_TOLERANCE_PCT: 4
    precision: "comparison only; <= boundary is inclusive — a value exactly at dry_standard_pct + 4 is DRY"

  - name: chamber_equipment_sizing
    trigger: "POST /restoration/chambers (computed once at chamber creation)"
    algorithm: tiered_pricing
    formula: |
      AM_DIVISOR   = { 1:100, 2:70, 3:60, 4:50 }     # sqft per air mover, keyed by sizing class
      CLASS_FACTOR = { 1:0.5, 2:1.0, 3:1.5, 4:2.0 }  # ppd water load per sqft, keyed by sizing class
      klass = (job.water_class if job.loss_type == WATER else 2)   # FIRE/SMOKE jobs size at class 2
      air_movers_required    = max(1, ceil(floor_area_sqft / AM_DIVISOR[klass])) + ceil(wet_wall_linear_ft / WALL_PER_AM)
      water_load_ppd         = round_half_up(floor_area_sqft * CLASS_FACTOR[klass], 2)
      dehumidifiers_required = ceil(water_load_ppd / dehu_ppd_rating)
    input_set: "A single chamber's floor_area_sqft, wet_wall_linear_ft, dehu_ppd_rating, and the parent job's loss_type/water_class."
    constants:
      WALL_PER_AM: 16
    precision: "counts are integers via ceil; water_load_ppd is 2 dp round_half_up before the dehu ceil"

  - name: estimate_cost
    trigger: "POST /restoration/estimates (computed at estimate creation)"
    algorithm: forward_looking
    formula: |
      scope_lines_total_cents  = sum(line.qty * line.unit_price_cents for line in line_items)
      equipment_estimate_cents = estimated_drying_days *
                                 sum over all non-DECOMMISSIONED chambers of the job of
                                   (chamber.air_movers_required * AM_DAY_RATE_CENTS
                                    + chamber.dehumidifiers_required * DEHU_DAY_RATE_CENTS)
      estimate_total_cents     = scope_lines_total_cents + equipment_estimate_cents
    input_set: "Estimator's line_items + estimated_drying_days, plus the REQUIRED (not actual) equipment counts of every non-DECOMMISSIONED chamber."
    constants:
      AM_DAY_RATE_CENTS: 2500
      DEHU_DAY_RATE_CENTS: 8000
    precision: "integer cents"
    variants:
      - name: estimated_projected
        when: "ScopeEstimate.estimate_total_cents at estimate creation"
        difference: "Uses estimated_drying_days and per-chamber REQUIRED equipment counts — a projection."
      - name: final_billed
        when: "GET /restoration/jobs/{jobId}/billing computed from realized EquipmentPlacement records"
        difference: "Replaces equipment_estimate_cents with final_equipment_cents = sum over every EquipmentPlacement of (AM/DEHU day rate) * placement.billable_days, using ACTUAL placements and ACTUAL billable_days. scope_lines_total_cents is identical; totals diverge whenever realized billable days != estimated_drying_days * required-count."

  - name: final_billing
    trigger: "GET /restoration/jobs/{jobId}/billing"
    algorithm: chronological
    formula: |
      final_equipment_cents = sum over every EquipmentPlacement on the job (ACTIVE or REMOVED, created_at ASC) of:
          rate = (AM_DAY_RATE_CENTS if placement.kind == AIR_MOVER else DEHU_DAY_RATE_CENTS)
          days = placement.billable_days           # max(1, removed_on_day - placed_on_day); 0 if still ACTIVE
          rate * days
      final_total_cents      = scope_lines_total_cents(of the APPROVED estimate) + final_equipment_cents
      billing_variance_cents = final_total_cents - approved_estimate.estimate_total_cents
    input_set: "Every EquipmentPlacement on the job plus the APPROVED ScopeEstimate's scope_lines_total_cents."
    constants:
      AM_DAY_RATE_CENTS: 2500
      DEHU_DAY_RATE_CENTS: 8000
    precision: "integer cents"

  - name: drying_progress_pct
    trigger: "GET /restoration/jobs/{jobId}/drying-progress"
    algorithm: aggregation
    formula: |
      reference_gpp = gpp of the newest reading (created_at DESC) on the chamber whose room_label == 'UNAFFECTED-REF'
      For a target chamber:
        initial_gpp_diff = (gpp of the FIRST reading on the chamber, created_at ASC) - reference_gpp
        current_gpp_diff = (chamber_gpp per variant) - reference_gpp
        progress_pct     = round_half_up((initial_gpp_diff - current_gpp_diff) / initial_gpp_diff * 100, 2)
    input_set: "MoistureReadings on the target chamber and on the UNAFFECTED-REF chamber of the same job."
    constants: {}
    precision: "2 dp, round_half_up"
    variants:
      - name: instantaneous
        when: "default; ?mode=INSTANT or omitted"
        difference: "chamber_gpp = gpp of the single newest reading (created_at DESC)."
      - name: trailing
        when: "?mode=TRAILING"
        difference: "chamber_gpp = round_half_up(mean of the two newest readings' gpp, 0); diverges from instantaneous whenever the two newest readings differ."

  - name: insurance_acv
    trigger: "POST /restoration/estimates (computed at estimate creation from line_items + claim depreciation/tax)"
    algorithm: aggregation
    formula: |
      # PER-LINE depreciation rounding, THEN sum, THEN tax on the summed ACV.
      # Evaluation order is PINNED: round depreciation per line; never sum-then-round.
      acv_sum_cents = 0
      for line in line_items:                                  # in array order as supplied
        rcv  = line.qty * line.unit_price_cents
        dep  = round_half_up(rcv * claim.depreciation_pct / 100, 0)   # whole cents, PER LINE
        acv_sum_cents += (rcv - dep)
      tax_cents       = round_half_up(acv_sum_cents * claim.tax_pct / 100, 0)
      acv_total_cents = acv_sum_cents + tax_cents
    input_set: "line_items of the estimate + parent claim.depreciation_pct + claim.tax_pct."
    constants: {}
    precision: "integer cents; per-line depreciation rounding pinned BEFORE summation"

  - name: contents_valuation_waterfall
    trigger: "POST /restoration/jobs/{jobId}/contents/value"
    algorithm: waterfall_allocation
    formula: |
      claim_limit_cents = max(0, claim.coverage_limit_cents - claim.deductible_cents)
      remaining = claim_limit_cents
      for item in ContentsItems of the job with status in {PACKED_OUT, STORED}, ordered created_at ASC:
        alloc = min(remaining, item.declared_value_cents)
        item.allocated_value_cents = alloc
        remaining -= alloc
      # Conserved invariant:
      #   sum(allocated_value_cents over included items)
      #     == min(claim_limit_cents, sum(declared_value_cents over included items))
    input_set: "ContentsItems with status in {PACKED_OUT, STORED} ordered created_at ASC; claim limit minus deductible."
    constants: {}
    precision: "integer cents; allocation order is created_at ASC, never id"

# =============================================================================
# Table 4: Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all

  - priority: 2
    category: auth
    check: "Role permitted for this operation per the RBAC matrix"
    error_id: ERR_FORBIDDEN_ROLE
    http_status: 403
    applies_to: all

  - priority: 3
    category: existence
    check: "Path-referenced resources exist (job, chamber, estimate, placement, contents item)"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: all

  - priority: 4
    category: existence
    check: "Body-referenced foreign keys exist (claim_id, job_id, chamber_id, equipment_unit_id, technician_id)"
    error_id: ERR_REFERENCE_NOT_FOUND
    http_status: 404
    applies_to: "create / dispatch / placement endpoints"

  - priority: 5
    category: business_constraint
    check: "Required-field presence and enum/range validity (water_category in 1..3, water_class in 1..4, both required when loss_type==WATER, RH 0..100, line item qty/unit_price_cents present)"
    error_id: ERR_INVALID_REQUEST
    http_status: 422
    applies_to: all

  - priority: 6
    category: state
    check: "Target resource in a valid state for the requested transition"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all state-transition endpoints"

  - priority: 7
    category: business_safety
    check: "Technician referenced for dispatch is active"
    error_id: ERR_TECHNICIAN_UNAVAILABLE
    http_status: 409
    applies_to: "POST /restoration/jobs/{jobId}/dispatch"

  - priority: 8
    category: business_safety
    check: "Dispatched technician's certification matches the loss / antimicrobial profile"
    error_id: ERR_CERTIFICATION_MISMATCH
    http_status: 409
    applies_to: "POST /restoration/jobs/{jobId}/dispatch"

  - priority: 9
    category: business_referential
    check: "EquipmentUnit being placed is AVAILABLE, and the chamber belongs to the same job as the placement's job_id"
    error_id: ERR_EQUIPMENT_NOT_AVAILABLE
    http_status: 409
    applies_to: "POST /restoration/placements"

  - priority: 10
    category: business_constraint
    check: "room_label unique among the job's non-DECOMMISSIONED chambers"
    error_id: ERR_DUPLICATE_ROOM_LABEL
    http_status: 409
    applies_to: "POST /restoration/chambers"

  - priority: 11
    category: business_temporal
    check: "begin-monitoring requires every OPEN chamber's ACTIVE placements to meet its required air mover / dehumidifier counts"
    error_id: ERR_EQUIPMENT_UNDERSIZED
    http_status: 409
    applies_to: "POST /restoration/jobs/{jobId}/begin-monitoring"

  - priority: 12
    category: business_fiscal
    check: "estimate_total_cents must not exceed claim.coverage_limit_cents at approval"
    error_id: ERR_OVER_COVERAGE_LIMIT
    http_status: 409
    applies_to: "POST /restoration/estimates/{estimateId}/approve"

  - priority: 13
    category: state
    check: "OCC: expected_job_version must equal the current LossJob.version on estimate create"
    error_id: ERR_STALE_JOB_VERSION
    http_status: 412
    applies_to: "POST /restoration/estimates"

# =============================================================================
# Table 5: API Endpoint Table  (FLAT topology under /restoration)
# =============================================================================
endpoints:
  # ---- Test-driving clock ----
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the server logical clock. Startup default is 2026-01-01T00:00:00Z; before any call the clock reads exactly this default and never falls back to wall-clock time."
    roles: [PlatformAdmin]
    code: 200
    input: [to_iso8601]
    output: "{ current_utc: datetime }"
    side_effects: ["logical clock set to to_iso8601"]

  # ---- Technician (pool) ----
  - method: POST
    path: "/restoration/technicians"
    description: "Register a technician"
    roles: [PlatformAdmin, Dispatcher]
    code: 201
    input: ["full_name", "certification", "active?"]
    output: Technician
    side_effects: ["pool entry created"]

  - method: GET
    path: "/restoration/technicians/{technicianId}"
    description: "Get a technician"
    roles: [PlatformAdmin, Dispatcher, Technician]
    code: 200
    input: []
    output: Technician
    side_effects: []

  - method: GET
    path: "/restoration/technicians"
    description: "List technicians"
    roles: [PlatformAdmin, Dispatcher, Technician]
    code: 200
    input: ["certification?", "active?", "limit?", "offset?"]
    output: Technician[]
    side_effects: []

  # ---- EquipmentUnit (pool) ----
  - method: POST
    path: "/restoration/equipment-units"
    description: "Register an equipment unit into the pool"
    roles: [PlatformAdmin, Dispatcher]
    code: 201
    input: [asset_tag, kind]
    output: EquipmentUnit
    side_effects: ["status=AVAILABLE, active_placement_id=null"]

  - method: GET
    path: "/restoration/equipment-units/{unitId}"
    description: "Get an equipment unit"
    roles: [PlatformAdmin, Dispatcher, Technician]
    code: 200
    input: []
    output: EquipmentUnit
    side_effects: []

  - method: GET
    path: "/restoration/equipment-units"
    description: "List equipment units; filter by status, kind, or active_placement_id (reverse-reachability for EquipmentUnit.active_placement_id -> EquipmentPlacement)"
    roles: [PlatformAdmin, Dispatcher, Technician]
    code: 200
    input: ["status?", "active_placement_id?", "kind?", "limit?", "offset?"]
    output: EquipmentUnit[]
    side_effects: []

  # ---- InsuranceClaim ----
  - method: POST
    path: "/restoration/claims"
    description: "Open an insurance claim"
    roles: [Adjuster, PlatformAdmin]
    code: 201
    input: ["carrier_name", "policy_number", "peril", "coverage_limit_cents", "deductible_cents?", "depreciation_pct?", "tax_pct?"]
    output: InsuranceClaim
    side_effects: ["status=OPEN; adjuster_user_id = X-User-ID of the acting Adjuster"]

  - method: GET
    path: "/restoration/claims/{claimId}"
    description: "Get a claim"
    roles: [Adjuster, PlatformAdmin, Dispatcher]
    code: 200
    input: []
    output: InsuranceClaim
    side_effects: []

  - method: GET
    path: "/restoration/claims"
    description: "List claims; filter by status or settled_estimate_id (reverse-reachability for InsuranceClaim.settled_estimate_id -> ScopeEstimate)"
    roles: [Adjuster, PlatformAdmin, Dispatcher]
    code: 200
    input: ["status?", "settled_estimate_id?", "limit?", "offset?"]
    output: InsuranceClaim[]
    side_effects: []

  # ---- LossJob (FNOL intake & dispatch) ----
  - method: POST
    path: "/restoration/jobs"
    description: "Create a loss job (FNOL intake)"
    roles: [Dispatcher, PlatformAdmin]
    code: 201
    input: ["claim_id", "property_address", "loss_type", "water_category?", "water_class?"]
    output: LossJob
    side_effects:
      - "status=FNOL, monitoring_day=0, drying_status=NOT_STARTED, version=1"
      - "antimicrobial_required = (water_category==3 OR loss_type in {FIRE,SMOKE})"

  - method: GET
    path: "/restoration/jobs/{jobId}"
    description: "Get a loss job"
    roles: [Dispatcher, PlatformAdmin, Technician, Adjuster]
    code: 200
    input: []
    output: LossJob
    side_effects: []

  - method: GET
    path: "/restoration/jobs"
    description: "List loss jobs; filter by claim_id, status, assigned_technician_id (reverse-reachability for LossJob.claim_id and LossJob.assigned_technician_id)"
    roles: [Dispatcher, PlatformAdmin, Technician, Adjuster]
    code: 200
    input: ["claim_id?", "status?", "assigned_technician_id?", "limit?", "offset?"]
    output: LossJob[]
    side_effects: []

  - method: POST
    path: "/restoration/jobs/{jobId}/dispatch"
    description: "Dispatch a technician to the job"
    roles: [Dispatcher]
    code: 200
    input: [technician_id]
    output: LossJob
    side_effects: ["assigned_technician_id set; status FNOL->DISPATCHED; version += 1"]

  - method: POST
    path: "/restoration/jobs/{jobId}/start-mitigation"
    description: "Begin mitigation (requires >=1 non-DECOMMISSIONED chamber)"
    roles: [Technician]
    code: 200
    input: []
    output: LossJob
    side_effects: ["status DISPATCHED->MITIGATION; version += 1"]

  - method: POST
    path: "/restoration/jobs/{jobId}/begin-monitoring"
    description: "Begin daily monitoring (requires equipment sizing satisfied per OPEN chamber)"
    roles: [Technician]
    code: 200
    input: []
    output: LossJob
    side_effects: ["status MITIGATION->MONITORING; version += 1"]

  - method: POST
    path: "/restoration/jobs/{jobId}/reopen-mitigation"
    description: "Revert MONITORING back to MITIGATION to add drying capacity"
    roles: [Technician]
    code: 200
    input: []
    output: LossJob
    side_effects: ["status MONITORING->MITIGATION; version += 1"]

  - method: POST
    path: "/restoration/jobs/{jobId}/advance-day"
    description: "Advance the monitoring-day epoch by 1"
    roles: [Technician]
    code: 200
    input: []
    output: LossJob
    side_effects: ["monitoring_day += 1; version += 1"]

  - method: POST
    path: "/restoration/jobs/{jobId}/complete"
    description: "Complete the job and start the warranty clock"
    roles: [Technician]
    code: 200
    input: []
    output: LossJob
    side_effects:
      - "status MONITORING->COMPLETED; version += 1"
      - "completed_at = clock now; warranty_expires_on = completed_at + WARRANTY_DAYS"
      - "STORED ContentsItems -> RETURNED"

  - method: POST
    path: "/restoration/jobs/{jobId}/cancel"
    description: "Cancel the job; cascades release equipment, decommission chambers, return contents"
    roles: [Dispatcher]
    code: 200
    input: []
    output: LossJob
    side_effects:
      - "status -> CANCELLED; version += 1"
      - "ACTIVE placements -> REMOVED; their units -> AVAILABLE; OPEN chambers -> DECOMMISSIONED; PACKED_OUT/STORED contents -> RETURNED"

  - method: GET
    path: "/restoration/jobs/{jobId}/drying-progress"
    description: "Computed drying-progress percentage per chamber (mode INSTANT default, or TRAILING)"
    roles: [Technician, Dispatcher, Adjuster, PlatformAdmin]
    code: 200
    input: ["mode?"]
    output: "{ per_chamber: array, job_reference_gpp: number }"
    side_effects: []

  - method: GET
    path: "/restoration/jobs/{jobId}/billing"
    description: "Computed final billing from realized placements vs the approved estimate"
    roles: [Adjuster, Dispatcher, PlatformAdmin]
    code: 200
    input: []
    output: "{ scope_lines_total_cents: integer, final_equipment_cents: integer, final_total_cents: integer, billing_variance_cents: integer }"
    side_effects: []

  - method: POST
    path: "/restoration/jobs/{jobId}/contents/value"
    description: "Run contents waterfall valuation across the job's pack-out inventory"
    roles: [Adjuster, Technician]
    code: 200
    input: []
    output: "{ allocated_total_cents: integer, claim_limit_cents: integer, items: array }"
    side_effects: ["each non-RETURNED ContentsItem.allocated_value_cents set per waterfall"]

  # ---- DryingChamber (moisture mapping) ----
  - method: POST
    path: "/restoration/chambers"
    description: "Create a drying chamber (moisture mapping); equipment sizing computed"
    roles: [Technician]
    code: 201
    input: ["job_id", "room_label", "floor_area_sqft", "wet_wall_linear_ft?", "dehu_ppd_rating", "dry_standard_pct"]
    output: DryingChamber
    side_effects:
      - "air_movers_required, dehumidifiers_required computed"
      - "status=OPEN, is_dry=false, latest_moisture_content_pct=null"

  - method: GET
    path: "/restoration/chambers/{chamberId}"
    description: "Get a chamber"
    roles: [Technician, Dispatcher, Adjuster, PlatformAdmin]
    code: 200
    input: []
    output: DryingChamber
    side_effects: []

  - method: GET
    path: "/restoration/chambers"
    description: "List chambers; filter by job_id or status (reverse-reachability for DryingChamber.job_id -> LossJob)"
    roles: [Technician, Dispatcher, Adjuster, PlatformAdmin]
    code: 200
    input: ["job_id?", "status?", "limit?", "offset?"]
    output: DryingChamber[]
    side_effects: []

  - method: POST
    path: "/restoration/chambers/{chamberId}/decommission"
    description: "Decommission a chamber"
    roles: [Technician]
    code: 200
    input: []
    output: DryingChamber
    side_effects: ["status -> DECOMMISSIONED"]

  - method: POST
    path: "/restoration/chambers/{chamberId}/readings"
    description: "Log a daily psychrometric / moisture reading; computes gpp, recomputes the chamber dry flag and the job drying_status"
    roles: [Technician]
    code: 201
    input: ["temp_f", "relative_humidity_pct", "moisture_content_pct"]
    output: MoistureReading
    side_effects:
      - "gpp computed; monitoring_day stamped; job_id and chamber_id stamped from the path"
      - "chamber.latest_moisture_content_pct updated; chamber.is_dry recomputed"
      - "chamber may auto-transition OPEN<->DRIED; job.drying_status recomputed"

  # ---- MoistureReading (drying log) ----
  - method: GET
    path: "/restoration/readings/{readingId}"
    description: "Get a moisture reading"
    roles: [Technician, Dispatcher, Adjuster, PlatformAdmin]
    code: 200
    input: []
    output: MoistureReading
    side_effects: []

  - method: GET
    path: "/restoration/readings"
    description: "List readings; filter by chamber_id or job_id (reverse-reachability for MoistureReading.chamber_id and MoistureReading.job_id)"
    roles: [Technician, Dispatcher, Adjuster, PlatformAdmin]
    code: 200
    input: ["chamber_id?", "job_id?", "limit?", "offset?"]
    output: MoistureReading[]
    side_effects: []

  # ---- EquipmentPlacement (placement & drying log) ----
  - method: POST
    path: "/restoration/placements"
    description: "Place an available equipment unit into a chamber"
    roles: [Technician]
    code: 201
    input: ["job_id", "chamber_id", "equipment_unit_id"]
    output: EquipmentPlacement
    side_effects:
      - "kind copied from the unit; placed_on_day=job.monitoring_day; status=ACTIVE"
      - "EquipmentUnit.status -> DEPLOYED; EquipmentUnit.active_placement_id = placement id"

  - method: GET
    path: "/restoration/placements/{placementId}"
    description: "Get a placement"
    roles: [Technician, Dispatcher, Adjuster, PlatformAdmin]
    code: 200
    input: []
    output: EquipmentPlacement
    side_effects: []

  - method: GET
    path: "/restoration/placements"
    description: "List placements; filter by job_id, chamber_id, equipment_unit_id, status (reverse-reachability for EquipmentPlacement.job_id, .chamber_id, .equipment_unit_id)"
    roles: [Technician, Dispatcher, Adjuster, PlatformAdmin]
    code: 200
    input: ["job_id?", "chamber_id?", "equipment_unit_id?", "status?", "limit?", "offset?"]
    output: EquipmentPlacement[]
    side_effects: []

  - method: POST
    path: "/restoration/placements/{placementId}/remove"
    description: "Remove (pull) a deployed unit; computes billable_days and returns the unit to the pool"
    roles: [Technician]
    code: 200
    input: []
    output: EquipmentPlacement
    side_effects:
      - "removed_on_day=job.monitoring_day; billable_days=max(1, removed_on_day-placed_on_day); status=REMOVED"
      - "EquipmentUnit.status -> AVAILABLE; EquipmentUnit.active_placement_id -> null"

  # ---- ScopeEstimate (Xactimate scope & insurance estimate) ----
  - method: POST
    path: "/restoration/estimates"
    description: "Create a Xactimate scope estimate; supersedes the prior DRAFT; OCC on job.version"
    roles: [Estimator]
    code: 201
    input: ["job_id", "estimated_drying_days", "line_items", "expected_job_version"]
    output: ScopeEstimate
    side_effects:
      - "scope_lines_total_cents, equipment_estimate_cents, estimate_total_cents, acv_total_cents computed"
      - "prior DRAFT estimate on the job -> SUPERSEDED; status=DRAFT"
      - "increments LossJob.version by 1"

  - method: GET
    path: "/restoration/estimates/{estimateId}"
    description: "Get an estimate"
    roles: [Estimator, Adjuster, Dispatcher, PlatformAdmin]
    code: 200
    input: []
    output: ScopeEstimate
    side_effects: []

  - method: GET
    path: "/restoration/estimates"
    description: "List estimates; filter by job_id or status (reverse-reachability for ScopeEstimate.job_id -> LossJob)"
    roles: [Estimator, Adjuster, Dispatcher, PlatformAdmin]
    code: 200
    input: ["job_id?", "status?", "limit?", "offset?"]
    output: ScopeEstimate[]
    side_effects: []

  - method: POST
    path: "/restoration/estimates/{estimateId}/approve"
    description: "Adjuster approves an estimate; settles the claim"
    roles: [Adjuster]
    code: 200
    input: []
    output: ScopeEstimate
    side_effects:
      - "status DRAFT->APPROVED; claim.status->SETTLED; claim.settled_estimate_id set"

  # ---- ContentsItem (pack-out & inventory) ----
  - method: POST
    path: "/restoration/contents"
    description: "Pack out a contents item into inventory"
    roles: [Technician]
    code: 201
    input: ["job_id", "description", "declared_value_cents"]
    output: ContentsItem
    side_effects: ["status=PACKED_OUT, allocated_value_cents=0"]

  - method: GET
    path: "/restoration/contents/{itemId}"
    description: "Get a contents item"
    roles: [Technician, Dispatcher, Adjuster, PlatformAdmin]
    code: 200
    input: []
    output: ContentsItem
    side_effects: []

  - method: GET
    path: "/restoration/contents"
    description: "List contents; filter by job_id or status (reverse-reachability for ContentsItem.job_id -> LossJob)"
    roles: [Technician, Dispatcher, Adjuster, PlatformAdmin]
    code: 200
    input: ["job_id?", "status?", "limit?", "offset?"]
    output: ContentsItem[]
    side_effects: []

  - method: POST
    path: "/restoration/contents/{itemId}/store"
    description: "Move a packed-out item into storage"
    roles: [Technician]
    code: 200
    input: []
    output: ContentsItem
    side_effects: ["status PACKED_OUT->STORED"]

  - method: POST
    path: "/restoration/contents/{itemId}/return"
    description: "Return a contents item to the owner"
    roles: [Technician]
    code: 200
    input: []
    output: ContentsItem
    side_effects: ["status -> RETURNED"]

# =============================================================================
# Table 6: Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "Missing X-User-Role or X-User-ID header" }
  - { id: ERR_FORBIDDEN_ROLE, http: 403, condition: "Role not permitted for the operation" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Path-referenced resource does not exist" }
  - { id: ERR_REFERENCE_NOT_FOUND, http: 404, condition: "Body foreign key (claim_id/job_id/chamber_id/equipment_unit_id/technician_id) does not exist" }
  - { id: ERR_INVALID_REQUEST, http: 422, condition: "Missing required field, bad enum, out-of-range value, or water_category/water_class missing for a WATER loss" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Resource not in a valid state for the requested transition" }
  - { id: ERR_TECHNICIAN_UNAVAILABLE, http: 409, condition: "Technician referenced for dispatch is inactive" }
  - { id: ERR_CERTIFICATION_MISMATCH, http: 409, condition: "Dispatched technician certification does not match the loss / antimicrobial profile" }
  - { id: ERR_NO_CHAMBERS, http: 409, condition: "start-mitigation attempted with zero non-DECOMMISSIONED chambers on the job" }
  - { id: ERR_EQUIPMENT_NOT_AVAILABLE, http: 409, condition: "Equipment unit not AVAILABLE, or chamber not on the placement's job, at placement" }
  - { id: ERR_DUPLICATE_ROOM_LABEL, http: 409, condition: "room_label already used by a non-DECOMMISSIONED chamber on the job" }
  - { id: ERR_EQUIPMENT_UNDERSIZED, http: 409, condition: "begin-monitoring while an OPEN chamber lacks its required air mover / dehumidifier counts" }
  - { id: ERR_CHAMBER_HAS_EQUIPMENT, http: 409, condition: "decommission a chamber that still has an ACTIVE placement" }
  - { id: ERR_DRY_STANDARD_NOT_MET, http: 409, condition: "complete a job whose non-DECOMMISSIONED chambers are not all DRIED" }
  - { id: ERR_EQUIPMENT_STILL_DEPLOYED, http: 409, condition: "complete a job with an ACTIVE placement still present" }
  - { id: ERR_NO_APPROVED_ESTIMATE, http: 409, condition: "complete a job with no APPROVED ScopeEstimate" }
  - { id: ERR_NOTHING_TO_REOPEN, http: 409, condition: "reopen-mitigation when every non-DECOMMISSIONED chamber is already dry" }
  - { id: ERR_OVER_COVERAGE_LIMIT, http: 409, condition: "approve an estimate whose estimate_total_cents exceeds claim.coverage_limit_cents" }
  - { id: ERR_ESTIMATE_ALREADY_APPROVED, http: 409, condition: "approve an estimate while another APPROVED estimate exists on the job" }
  - { id: ERR_CLAIM_ALREADY_SETTLED, http: 409, condition: "approve an estimate whose claim.status is already SETTLED" }
  - { id: ERR_STALE_JOB_VERSION, http: 412, condition: "expected_job_version does not match the current LossJob.version on estimate create" }

# =============================================================================
# Table 7: RBAC Matrix
# =============================================================================
roles:
  - name: PlatformAdmin
    description: "Operational superuser; registers pool resources, opens claims/jobs, sets the logical clock, reads everything."
    identity: opaque
    exclusive_operations:
      - "POST /_clock/set_current_utc — set logical clock"
    shared_operations:
      - "POST /restoration/technicians, POST /restoration/equipment-units — register pool resources"
      - "POST /restoration/claims — open a claim"
      - "POST /restoration/jobs — FNOL intake"
      - "GET on all resources"

  - name: Dispatcher
    description: "Owns loss-job intake, dispatch, and cancellation."
    identity: opaque
    exclusive_operations:
      - "POST /restoration/jobs/{jobId}/dispatch — assign technician"
      - "POST /restoration/jobs/{jobId}/cancel — cancel job"
    shared_operations:
      - "POST /restoration/jobs — FNOL intake (shared with PlatformAdmin)"
      - "POST /restoration/technicians, POST /restoration/equipment-units — register pool resources"
      - "GET on jobs, chambers, placements, estimates, contents, claims, drying-progress, billing"

  - name: Technician
    description: "Field operator; owns mitigation, chambers, equipment placement/removal, readings, contents handling, completion."
    identity: entity_backed:Technician
    exclusive_operations:
      - "POST /restoration/jobs/{jobId}/start-mitigation, /begin-monitoring, /reopen-mitigation, /advance-day, /complete"
      - "POST /restoration/chambers, /restoration/chambers/{id}/decommission, /restoration/chambers/{id}/readings"
      - "POST /restoration/placements, /restoration/placements/{id}/remove"
      - "POST /restoration/contents, /restoration/contents/{id}/store, /restoration/contents/{id}/return"
    shared_operations:
      - "POST /restoration/jobs/{jobId}/contents/value — contents valuation (shared with Adjuster)"
      - "GET on jobs, chambers, placements, readings, contents, drying-progress"

  - name: Estimator
    description: "Owns Xactimate scope estimate authoring."
    identity: opaque
    exclusive_operations:
      - "POST /restoration/estimates — create / supersede a scope estimate"
    shared_operations:
      - "GET on estimates"

  - name: Adjuster
    description: "Insurance adjuster; opens claims, approves estimates, runs contents valuation."
    identity: opaque
    exclusive_operations:
      - "POST /restoration/estimates/{estimateId}/approve — approve estimate / settle claim"
    shared_operations:
      - "POST /restoration/claims — open a claim (shared with PlatformAdmin)"
      - "POST /restoration/jobs/{jobId}/contents/value — contents valuation (shared with Technician)"
      - "GET on claims, estimates, jobs, billing, drying-progress, chambers, placements, contents"
