            - "Cross-school zero gap at 900: HTTP status == 409 and data.error_id == ERR_COVERAGE_OVERLAP"
            - "Cross-school 20-minute gap at 920: HTTP status == 201 and CoverageAssignment.${cov3_id}.duration_minutes == 120"
            - "Nurse.${rn_id}.committed_weekly_minutes == 540"
            - "Nurse.${rn_id}.uncommitted_weekly_minutes == 1860"
            - "Nurse.${rn_id}.assigned_school_count == 2"
            - "GET /health-office/coverage-assignments?nurse_id=${rn_id} returns total_count == 3"

      - name: school_cot_capacity_closed_interval_aggregate_tolerates_two
        grounds:
          - validations[priority=34]
          - errors[ERR_OFFICE_CAPACITY_EXCEEDED]
          - entities.School.fields.cot_capacity
          - entities.School.fields.occupied_cot_count
          - entities.HealthVisit.fields.arrival_at
          - entities.HealthVisit.fields.closed_at
        distinguishing_aspect: |
          Interval semantics = AGGREGATE CAPACITY over CLOSED intervals
          [arrival_at, closed_at] on the resource entity SCHOOL, with no buffer:
          overlap is tolerated up to cot_capacity (two simultaneous occupancies are
          legal) and only the third arrival is refused, which is the opposite
          geometry to the nurse rule's pairwise half-open prohibition.
        test_recipe:
          setup:
            - "School NEW15 with cot_capacity 2, one RN on an ACTIVE Monday block and three ENROLLED students, so delivered_students_per_nurse_fte is 13.13, coverage_posture is LIMITED and the priority-18 safety row passes."
            - "Clock at 2026-08-03T09:00:00Z; two OPEN encounters (students 1 and 2) already occupy both cots, so School.occupied_cot_count is 2."
