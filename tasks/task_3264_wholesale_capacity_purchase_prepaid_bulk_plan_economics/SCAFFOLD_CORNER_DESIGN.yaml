            - "a second submit-port on the other activation with the same losing_carrier and account_number_last4 produces ERR_MSISDN_ALREADY_IN_FLIGHT and status 409"
            - "the two port requests are individually valid and it is their aggregate that collides"
            - "the second activation's port_status remains NONE after the refusal"
            - "cancelling the first port frees the carrier and account pair so the second submit then succeeds"

