scenario: "855. Public Pool & Spa Health Permit: facility permit & classification, water-chemistry & inspection, closure/reopen (fecal/chemical) protocol, lifeguard/attendant & signage, VGB drain-safety compliance, complaint & recreational-water-illness report, plan review, seasonal permit"
domain_name: "public-pool-spa-health-permit"
api_prefix: "/"
difficulty_level: "Expert"

complexity_profile:
  primary_archetype: "compliance_audit"
  secondary_archetype: "posture_driven_gating"
  complexity_layers:
    - "optimistic_concurrency"
    - "cascading_side_effects"
    - "dual_variant_calculation"
    - "rate_threshold_triggers"

  entity_topology: "flat"
  # Peer entities linked by explicit foreign keys. URL paths are flat collections
  # (`/permits/{id}`, `/closure-orders/{id}`, `/complaints/{id}`); the only nested
  # segments are read/append sub-resources of Facility and Inspection.

  state_machine_shape: "cyclic"
  # Permit ISSUED->SUSPENDED->ISSUED, ClosureOrder OPEN->REOPEN_REQUESTED->OPEN and
  # Violation OPEN->CORRECTED->OPEN are true cycles; Inspection carries two
  # independent parallel axes (workflow_status x enforcement_status); PlanReview
  # branches UNDER_REVIEW -> {APPROVED, DISAPPROVED, CORRECTIONS_REQUIRED} with
  # divergent side-effect sets.

  relationship_patterns:
    - "one_to_many"
    - "self_referential"     # PlanReview.supersedes_plan_review_id, Inspection.prior_inspection_id
    - "cross_aggregate"      # ClosureOrder.triggering_reading_id, Complaint.linked_inspection_id
    - "polymorphic"          # ComplianceArtifact carries SIGNAGE or DRAIN_CERTIFICATION payload fields

  role_model: "segregation_of_duties"
  # The operator id that ordered a closure may not decide its reopen; the operator id
  # that decided a plan review may not issue the permit that relies on it.

  consistency_model: "immediate"

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

conventions:
  authentication: |
    Every request carries `X-User-Role` (one of the five roles declared in the RBAC
    matrix) and `X-User-ID`. `X-User-ID` is required and must be non-empty for every
    role except `Anonymous`, for which it is ignored when present and not required
    when absent. A missing/blank `X-User-Role`, an unrecognised role string, or a
    missing `X-User-ID` on a non-Anonymous role is ERR_UNAUTHENTICATED (401).
  logical_clock: |
    The server keeps a logical UTC clock. Its startup default is exactly
    2026-05-01T00:00:00Z and it never falls back to wall-clock time. Every
    server-stamped datetime (created_at, updated_at, ordered_at, issued_at,
    posted_at, reported_at, started_at, submitted_at, finalized_at, corrected_at,
    verified_at, decided_at, reopen_requested_at, reopen_decided_at) is rendered
    from the logical clock through one shared renderer.
  timestamp_format: |
    All datetime values the API emits are ISO 8601 UTC with exactly three
    fractional-second digits and a trailing `Z`, e.g. `2026-05-01T00:00:00.000Z`.
    Client-supplied datetime inputs are echoed back in that same rendered form.
    All date-only values (`*_date`, `*_on`) are `YYYY-MM-DD` strings.
  list_envelope: |
    For `response_type: "array"` responses, `data` is the array of resources and
    `meta` additionally carries `limit`, `offset`, `total_count` and `has_more`.
    `total_count` counts rows matching the filters before limit/offset are applied;
    `has_more` is `offset + len(data) < total_count`.
  list_ordering: |
    Every list endpoint returns rows sorted by `created_at` ascending, tie-broken by
    `created_at` ascending only (rows created by one request are ordered by the order
    in which the request created them). `id` never participates in ordering.
  money: "All monetary amounts are integer cents. No floats are stored for money."
  rounding: "round_half_up is the only rounding mode used anywhere in this scaffold."

domain_constants:
  DEFAULT_CLOCK_UTC: "2026-05-01T00:00:00Z"

  # --- water chemistry -------------------------------------------------------
  FREE_CHLORINE_MIN_PPM_POOL: 1.0
  FREE_CHLORINE_MIN_PPM_SPA: 2.0
  FREE_CHLORINE_MAX_PPM: 10.0
  FREE_CHLORINE_IMMINENT_PPM_POOL: 0.5
  FREE_CHLORINE_IMMINENT_PPM_SPA: 1.0
  COMBINED_CHLORAMINE_MAX_PPM: 0.4
  PH_MIN: 7.0
  PH_MAX: 7.8
  PH_IMMINENT_LOW: 6.5
  PH_IMMINENT_HIGH: 8.2
  CYANURIC_ACID_MAX_PPM: 90
  WATER_TEMP_MAX_F_SPA: 104.0
  WATER_TEMP_MAX_F_POOL: 95.0

  # --- classification / bather load -----------------------------------------
  BATHER_LOAD_SQFT_PER_BATHER_POOL: 20
  BATHER_LOAD_SQFT_PER_BATHER_SPA: 10
  LIFEGUARD_REQUIRED_BATHER_LOAD_THRESHOLD: 50

  # --- permit fees -----------------------------------------------------------
  PERMIT_BASE_FEE_CENTS: { CLASS_A_COMPETITION: 45000, CLASS_B_PUBLIC: 30000, CLASS_C_SEMI_PUBLIC: 18000, SPA: 12000 }
  VOLUME_SURCHARGE_FREE_GALLONS: 25000
  VOLUME_SURCHARGE_CENTS_PER_10K_GALLONS: 2500
  FEATURE_SURCHARGE_CENTS: { SLIDE: 5000, DIVING_BOARD: 7500, WAVE_GENERATOR: 12000, SPA_JETS: 4000, SPLASH_PAD: 3000 }
  SEASONAL_TERM_DENOMINATOR_DAYS: 365
  LATE_APPLICATION_PENALTY_PCT: 0.25
  ANNUAL_PERMIT_TERM_DAYS: 365
  SEASONAL_PERMIT_MAX_TERM_DAYS: 183
  PERMIT_RENEWAL_WINDOW_DAYS: 60
  PERMIT_REFUND_WINDOW_DAYS: 30
  PLAN_REVIEW_FEE_CENTS: 25000
  REINSPECTION_FEE_CENTS: 15000

  # --- inspection scoring ----------------------------------------------------
  INSPECTION_SCORE_MAX: 100
  SEVERITY_POINTS: { IMMINENT_HEALTH_HAZARD: 25, CRITICAL: 10, NONCRITICAL: 3 }
  CORRECTED_ON_SITE_CREDIT_FACTOR: 0.5
  CRITICAL_DEMERIT_CAP: 40
  NONCRITICAL_DEMERIT_CAP: 20
  SCORE_PASS_THRESHOLD: 85
  SCORE_FAIL_THRESHOLD: 70
  REINSPECTION_DUE_DAYS: 10
  INSPECTION_BUFFER_MINUTES: 60

  # --- closure / reopen protocol --------------------------------------------
  REMEDIATION_MINUTES_TABLE:
    FECAL_FORMED: 30
    FECAL_DIARRHEAL: 765
    VOMIT: 30
    BLOOD: 30
    CHEMICAL: 60
    WATER_CHEMISTRY: 30
    EQUIPMENT: 60
    RWI_OUTBREAK: 1440
    PERMIT_ACTION: 0
  CT_TARGET_PPM_MINUTES: 15300
  CT_PH_THRESHOLD: 7.5
  CT_PH_HIGH_MULTIPLIER: 1.5
  MIN_REMEDIATION_MINUTES: 30
  REOPEN_READING_MAX_AGE_MINUTES: 60

  # --- VGB drain safety ------------------------------------------------------
  VGB_ENFORCEMENT_START_DATE: "2026-06-01"
  VGB_COVER_LIFESPAN_DAYS: 1825
  VGB_SINGLE_DRAIN_MIN_COUNT: 2

  # --- signage ---------------------------------------------------------------
  SIGNAGE_VALID_DAYS: 365
  REQUIRED_SIGNAGE_TYPES_POOL: ["DEPTH_MARKERS", "EMERGENCY_PHONE", "DIARRHEA_NOTICE"]
  REQUIRED_SIGNAGE_TYPES_SPA: ["SPA_TEMP_WARNING", "EMERGENCY_PHONE", "DIARRHEA_NOTICE"]
  SIGNAGE_TYPE_WHEN_NO_LIFEGUARD: "NO_LIFEGUARD_WARNING"

  # --- staffing --------------------------------------------------------------
  MAX_SHIFT_MINUTES: 720

  # --- complaints / recreational water illness -------------------------------
  RWI_CLUSTER_WINDOW_DAYS: 14
  RWI_CASE_POINTS: 12
  RWI_CASE_POINTS_CAP: 60
  RWI_PATHOGEN_WEIGHTS: { CRYPTOSPORIDIUM: 30, GIARDIA: 20, LEGIONELLA: 35, PSEUDOMONAS: 15, NOROVIRUS: 25, ECOLI: 25, UNKNOWN: 5 }
  RWI_PATHOGEN_WEIGHT_WHEN_NULL: 0
  RWI_RECENCY_BONUS: 10
  RWI_RECENCY_WINDOW_DAYS: 7
  RWI_SCORE_MAX: 100
  RWI_ESCALATION_THRESHOLD: 60

  # --- plan review -----------------------------------------------------------
  PLAN_REVIEW_MAX_REVISION_ROUNDS: 3

entities:

  - name: Operator
    parent: null
    common_fields: true
    fields:
      - name: legal_name
        type: string
        source: input
        description: "Legal name of the permit-holding operator organisation."
        constraints: "non-empty, length 1..200"
      - name: contact_email
        type: string
        source: input
        description: "Contact email for permit correspondence."
        constraints: "non-empty, must contain '@'"
      - name: phone
        type: string
        source: input
        description: "Optional contact phone."
        default: null
      - name: fee_balance_cents
        type: integer
        source: computed
        description: "Outstanding balance owed to the health authority; equals SUM(FeeLedgerEntry.amount_cents) over every FeeLedgerEntry whose operator_id equals this Operator.id (charges positive, payments and refunds negative). Recomputed on every ledger posting."
        default: 0

  - name: Facility
    parent: null
    common_fields: true
    fields:
      - name: operator_id
        type: string
        source: input
        description: "FK -> Operator.id; the operator that holds the permit for this aquatic venue."
      - name: name
        type: string
        source: input
        description: "Facility display name."
        constraints: "non-empty, length 1..200"
      - name: facility_class
        type: enum
        source: input
        description: "Health-code classification of the venue."
        constraints: "one of CLASS_A_COMPETITION, CLASS_B_PUBLIC, CLASS_C_SEMI_PUBLIC, SPA"
      - name: water_type
        type: enum
        source: computed
        description: "SPA when facility_class == SPA, otherwise POOL. Selects the water-chemistry limit set and the bather-load divisor."
        constraints: "one of POOL, SPA"
      - name: surface_area_sqft
        type: number
        source: input
        description: "Water surface area in square feet."
        constraints: "> 0"
      - name: water_volume_gallons
        type: integer
        source: input
        description: "Water volume in US gallons; drives the permit volume surcharge."
        constraints: ">= 0"
      - name: max_depth_feet
        type: number
        source: input
        description: "Maximum water depth in feet."
        constraints: "> 0"
      - name: features
        type: array
        source: input
        description: "Installed recreational features; each element adds a permit surcharge."
        default: []
        constraints: "elements are a subset of SLIDE, DIVING_BOARD, WAVE_GENERATOR, SPA_JETS, SPLASH_PAD; no duplicates"
      - name: drain_count
        type: integer
        source: input
        description: "Number of submerged suction outlets (main drains) in the venue."
        constraints: ">= 1"
      - name: is_seasonal
        type: boolean
        source: input
        description: "True when the venue operates only inside a declared season window."
        default: false
      - name: season_start_date
        type: string
        source: input
        description: "First day of the operating season, YYYY-MM-DD. Required when is_seasonal is true, must be null when is_seasonal is false."
        default: null
      - name: season_end_date
        type: string
        source: input
        description: "Last day of the operating season, YYYY-MM-DD, inclusive. Required when is_seasonal is true, must be null when is_seasonal is false, and must be >= season_start_date."
        default: null
      - name: requires_plan_review
        type: boolean
        source: input
        description: "True when the venue's construction or alteration obliges an APPROVED PlanReview before a permit may be issued."
        default: false
      - name: max_bather_load
        type: integer
        source: computed
        description: "floor(surface_area_sqft / BATHER_LOAD_SQFT_PER_BATHER_POOL) when water_type is POOL, floor(surface_area_sqft / BATHER_LOAD_SQFT_PER_BATHER_SPA) when SPA."
      - name: lifeguard_required
        type: boolean
        source: computed
        description: "True when facility_class is in {CLASS_A_COMPETITION, CLASS_B_PUBLIC} AND max_bather_load >= LIFEGUARD_REQUIRED_BATHER_LOAD_THRESHOLD."
      - name: required_signage_types
        type: array
        source: computed
        description: "REQUIRED_SIGNAGE_TYPES_SPA when water_type is SPA, otherwise REQUIRED_SIGNAGE_TYPES_POOL, plus NO_LIFEGUARD_WARNING appended when lifeguard_required is false. Order is the constant's declared order with NO_LIFEGUARD_WARNING last."
      - name: vgb_compliance_status
        type: enum
        source: computed
        description: "Virginia Graeme Baker drain-safety posture derived from this facility's ComplianceArtifact rows of artifact_type DRAIN_CERTIFICATION and from drain_count. See calculations.vgb_compliance_evaluation."
        constraints: "one of COMPLIANT, EXPIRED, NONCOMPLIANT"
      - name: open_demerit_points
        type: integer
        source: computed
        description: "SUM(Violation.points_assessed) over every Violation whose parent Inspection has workflow_status == FINALIZED, whose parent Inspection.facility_id equals this Facility.id, and whose own status == OPEN."
        default: 0
      - name: operating_posture
        type: enum
        source: computed
        description: "Derived gate over child state; see calculations.facility_operating_posture. CLOSED outranks RESTRICTED outranks OPEN."
        constraints: "one of OPEN, RESTRICTED, CLOSED"
      - name: posture_reason
        type: enum
        source: computed
        description: "First matching clause of calculations.facility_operating_posture, in the clause order declared there."
        constraints: "one of CLOSURE_ORDER_OPEN, PERMIT_MISSING, PERMIT_NOT_ACTIVE, OUT_OF_SEASON, VGB_NONCOMPLIANT, CRITICAL_VIOLATION_OPEN, SIGNAGE_INCOMPLETE, LIFEGUARD_COVERAGE_MISSING, NONE"
      - name: active_permit_id
        type: string
        source: computed
        description: "Id of the governing Permit for this facility (the Permit row with facility_id == this id and status == ISSUED, choosing the greatest term_start_date and tie-breaking on greatest created_at), or null when no such row exists. Not a declared foreign key; it is a derived pointer refreshed on every permit transition."
        default: null

  - name: PlanReview
    parent: null
    common_fields: true
    fields:
      - name: facility_id
        type: string
        source: input
        description: "FK -> Facility.id; the venue whose construction or alteration drawings are under review."
      - name: supersedes_plan_review_id
        type: string
        source: input
        description: "FK -> PlanReview.id; the review this submission replaces. Null on an initial submission; set by POST /plan-reviews/{id}/revisions to the id in the path."
        default: null
      - name: project_type
        type: enum
        source: input
        description: "Nature of the work being reviewed."
        constraints: "one of NEW_CONSTRUCTION, ALTERATION, EQUIPMENT_REPLACEMENT"
      - name: drawing_reference
        type: string
        source: input
        description: "Free-text drawing set reference supplied by the operator."
        default: null
      - name: revision_round
        type: integer
        source: computed
        description: "0 on an initial submission; superseded_review.revision_round + 1 on a revision."
        default: 0
      - name: status
        type: enum
        source: system
        description: "Lifecycle state; see state_machines.PlanReview."
        constraints: "one of SUBMITTED, UNDER_REVIEW, CORRECTIONS_REQUIRED, APPROVED, DISAPPROVED, SUPERSEDED"
      - name: submitted_on
        type: string
        source: system
        description: "Logical-clock date (YYYY-MM-DD) at which the review row was created."
      - name: reviewer_user_id
        type: string
        source: system
        description: "X-User-ID of the PlanReviewer that performed START_REVIEW; null before that."
        default: null
      - name: decided_at
        type: datetime
        source: system
        description: "Logical-clock instant of the APPROVE or DISAPPROVE transition; null otherwise."
        default: null
      - name: decided_by_user_id
        type: string
        source: system
        description: "X-User-ID of the PlanReviewer that performed APPROVE or DISAPPROVE; null otherwise. Consumed by the permit-issuance segregation-of-duties check."
        default: null
      - name: correction_notes
        type: string
        source: input
        description: "Notes supplied with the REQUEST_CORRECTIONS transition; null otherwise."
        default: null

  - name: Permit
    parent: null
    common_fields: true
    fields:
      - name: facility_id
        type: string
        source: input
        description: "FK -> Facility.id; the venue this permit authorises."
      - name: plan_review_id
        type: string
        source: input
        description: "FK -> PlanReview.id; the plan review this application relies on. Required when the facility has requires_plan_review == true, optional otherwise."
        default: null
      - name: permit_type
        type: enum
        source: input
        description: "ANNUAL for a full-term permit, SEASONAL for a permit limited to the facility's declared season window."
        constraints: "one of ANNUAL, SEASONAL"
      - name: term_start_date
        type: string
        source: input
        description: "First day of the permit term, YYYY-MM-DD."
      - name: term_end_date
        type: string
        source: computed
        description: "For ANNUAL: term_start_date + (ANNUAL_PERMIT_TERM_DAYS - 1) days. For SEASONAL: the facility's season_end_date at application time."
      - name: term_days
        type: integer
        source: computed
        description: "Inclusive day count of the term: (term_end_date - term_start_date).days + 1."
      - name: applied_on
        type: string
        source: system
        description: "Logical-clock date (YYYY-MM-DD) at which the application row was created."
      - name: is_late_application
        type: boolean
        source: computed
        description: "True when applied_on > term_start_date, evaluated at row creation and frozen thereafter."
      - name: assessed_fee_cents
        type: integer
        source: computed
        description: "Total permit fee assessed at the ISSUE transition; 0 before issuance. See calculations.permit_fee_assessment."
        default: 0
      - name: fee_variant
        type: enum
        source: computed
        description: "FULL_TERM when permit_type is ANNUAL, SEASONAL_PRORATED when permit_type is SEASONAL. Null before issuance."
        constraints: "one of FULL_TERM, SEASONAL_PRORATED, null"
      - name: classification_at_issue
        type: enum
        source: system
        description: "Snapshot of Facility.facility_class taken at the ISSUE transition; null before issuance. Pins the fee tier against later reclassification."
        default: null
      - name: status
        type: enum
        source: system
        description: "Lifecycle state; see state_machines.Permit."
        constraints: "one of DRAFT, SUBMITTED, UNDER_REVIEW, ISSUED, DENIED, SUSPENDED, REVOKED, EXPIRED"
      - name: issued_at
        type: datetime
        source: system
        description: "Logical-clock instant of the ISSUE transition; null before issuance and preserved across SUSPEND/REINSTATE."
        default: null
      - name: issued_by_user_id
        type: string
        source: system
        description: "X-User-ID of the HealthAuthorityAdmin that performed ISSUE; null before issuance."
        default: null
      - name: suspension_reason
        type: enum
        source: system
        description: "Why the permit is suspended; cleared to null on REINSTATE."
        default: null
        constraints: "one of IMMINENT_HEALTH_HAZARD, ADMINISTRATIVE, null"
      - name: refunded
        type: boolean
        source: computed
        description: "True once a REFUND FeeLedgerEntry has been posted against this permit."
        default: false

  - name: Inspection
    parent: null
    common_fields: true
    fields:
      - name: facility_id
        type: string
        source: input
        description: "FK -> Facility.id; the venue being inspected."
      - name: prior_inspection_id
        type: string
        source: input
        description: "FK -> Inspection.id; for inspection_type REINSPECTION, the FINALIZED inspection whose violations are being re-checked. Null for every other inspection_type."
        default: null
      - name: inspection_type
        type: enum
        source: input
        description: "Purpose of the visit."
        constraints: "one of ROUTINE, REINSPECTION, COMPLAINT, PREOPERATIONAL"
      - name: inspector_user_id
        type: string
        source: system
        description: "X-User-ID of the Inspector that created the row. Immutable."
      - name: scheduled_start_at
        type: datetime
        source: input
        description: "Planned start instant of the site visit."
      - name: scheduled_end_at
        type: datetime
        source: input
        description: "Planned end instant of the site visit; must be strictly after scheduled_start_at."
      - name: workflow_status
        type: enum
        source: system
        description: "First parallel state axis; see state_machines.Inspection (workflow axis)."
        constraints: "one of SCHEDULED, IN_PROGRESS, SUBMITTED, FINALIZED, VOIDED"
      - name: enforcement_status
        type: enum
        source: system
        description: "Second parallel state axis, independent of workflow_status; see state_machines.Inspection (enforcement axis)."
        default: "NONE"
        constraints: "one of NONE, NOTICE_ISSUED, ESCALATED, CLEARED"
      - name: started_at
        type: datetime
        source: system
        description: "Logical-clock instant of the START transition; null before it."
        default: null
      - name: submitted_at
        type: datetime
        source: system
        description: "Logical-clock instant of the SUBMIT transition; null before it."
        default: null
      - name: finalized_at
        type: datetime
        source: system
        description: "Logical-clock instant of the FINALIZE transition; null before it."
        default: null
      - name: critical_demerits
        type: integer
        source: computed
        description: "Capped critical demerit subtotal at FINALIZE; null before it. See calculations.inspection_score_and_result."
        default: null
      - name: noncritical_demerits
        type: integer
        source: computed
        description: "Capped noncritical demerit subtotal at FINALIZE; null before it."
        default: null
      - name: score
        type: integer
        source: computed
        description: "Sanitary score in 0..100 computed at FINALIZE; null before it."
        default: null
      - name: result
        type: enum
        source: computed
        description: "Outcome grade computed at FINALIZE; null before it."
        default: null
        constraints: "one of PASS, CONDITIONAL, FAIL, null"
      - name: reinspection_due_on
        type: string
        source: computed
        description: "date(finalized_at) + REINSPECTION_DUE_DAYS when result is CONDITIONAL or FAIL; null when result is PASS or before FINALIZE."
        default: null
      - name: voided_at
        type: datetime
        source: system
        description: "Logical-clock instant of the VOID transition; null otherwise."
        default: null

  - name: Violation
    parent: Inspection
    common_fields: true
    fields:
      - name: inspection_id
        type: string
        source: input
        description: "FK -> Inspection.id; the inspection that recorded this finding."
      - name: code
        type: string
        source: input
        description: "Health-code item reference, e.g. 'WQ-101'."
        constraints: "non-empty, length 1..32"
      - name: severity
        type: enum
        source: input
        description: "Severity band; drives SEVERITY_POINTS and the demerit bucket."
        constraints: "one of IMMINENT_HEALTH_HAZARD, CRITICAL, NONCRITICAL"
      - name: description
        type: string
        source: input
        description: "Narrative of the observed condition."
        constraints: "non-empty"
      - name: corrected_on_site
        type: boolean
        source: input
        description: "True when the inspector observed the condition corrected before leaving."
        default: false
      - name: points_assessed
        type: integer
        source: computed
        description: "round_half_up(SEVERITY_POINTS[severity] * CORRECTED_ON_SITE_CREDIT_FACTOR) when corrected_on_site is true AND severity != IMMINENT_HEALTH_HAZARD, otherwise SEVERITY_POINTS[severity]. Computed at row creation and frozen."
      - name: status
        type: enum
        source: system
        description: "Correction lifecycle; see state_machines.Violation."
        constraints: "one of OPEN, CORRECTED, VERIFIED, VOIDED"
      - name: corrected_at
        type: datetime
        source: system
        description: "Logical-clock instant of the most recent OPEN -> CORRECTED transition; null before the first one."
        default: null
      - name: verified_at
        type: datetime
        source: system
        description: "Logical-clock instant of the CORRECTED -> VERIFIED transition; null otherwise."
        default: null
      - name: rejection_count
        type: integer
        source: computed
        description: "Number of times a verification returned outcome REJECTED, moving the row CORRECTED -> OPEN."
        default: 0

  - name: WaterChemistryReading
    parent: Facility
    common_fields: false
    fields:
      - name: facility_id
        type: string
        source: input
        description: "FK -> Facility.id; the venue sampled."
      - name: sampled_at
        type: datetime
        source: input
        description: "Instant the sample was drawn; must not be after the logical clock."
      - name: source
        type: enum
        source: input
        description: "Who produced the reading and for what purpose."
        constraints: "one of OPERATOR_LOG, INSPECTOR_FIELD, REOPEN_VERIFICATION"
      - name: free_chlorine_ppm
        type: number
        source: input
        description: "Free available chlorine in parts per million."
        constraints: ">= 0"
      - name: combined_chloramine_ppm
        type: number
        source: input
        description: "Combined chlorine (chloramine) in parts per million."
        constraints: ">= 0"
      - name: ph
        type: number
        source: input
        description: "Measured pH."
        constraints: "between 0 and 14"
      - name: cyanuric_acid_ppm
        type: number
        source: input
        description: "Stabiliser concentration in parts per million."
        default: 0
        constraints: ">= 0"
      - name: water_temp_f
        type: number
        source: input
        description: "Water temperature in degrees Fahrenheit."
        constraints: ">= 0"
      - name: compliance_status
        type: enum
        source: computed
        description: "Classification of the reading against the water_type limit set; see calculations.water_reading_classification."
        constraints: "one of IN_RANGE, OUT_OF_RANGE, IMMINENT_HAZARD"
      - name: out_of_range_parameters
        type: array
        source: computed
        description: "Codes for each limit breached, emitted in the fixed order FREE_CHLORINE_LOW, FREE_CHLORINE_HIGH, COMBINED_CHLORAMINE_HIGH, PH_LOW, PH_HIGH, CYANURIC_ACID_HIGH, TEMP_HIGH. Empty array when compliance_status is IN_RANGE."
      - name: triggered_closure_order_id
        type: string
        source: computed
        description: "Id of the ClosureOrder auto-created by this reading when compliance_status is IMMINENT_HAZARD, else null. Not a declared foreign key; the reverse link ClosureOrder.triggering_reading_id is the authoritative one."
        default: null

  - name: ClosureOrder
    parent: null
    common_fields: true
    fields:
      - name: facility_id
        type: string
        source: input
        description: "FK -> Facility.id; the venue ordered closed."
      - name: triggering_reading_id
        type: string
        source: system
        description: "FK -> WaterChemistryReading.id; set only when the order was auto-created by an IMMINENT_HAZARD reading. Null for manually ordered closures."
        default: null
      - name: closure_reason
        type: enum
        source: input
        description: "Contamination or compliance event that forced the closure; selects the fixed remediation duration."
        constraints: "one of FECAL_FORMED, FECAL_DIARRHEAL, VOMIT, BLOOD, CHEMICAL, WATER_CHEMISTRY, EQUIPMENT, RWI_OUTBREAK, PERMIT_ACTION"
      - name: note
        type: string
        source: input
        description: "Free-text note recorded with the order."
        default: null
      - name: ordered_by_user_id
        type: string
        source: system
        description: "X-User-ID of the actor that created the order, or the string 'system' when the order was auto-created by a water reading cascade."
      - name: ordered_by_role
        type: enum
        source: system
        description: "Role of the actor that created the order."
        constraints: "one of Inspector, HealthAuthorityAdmin, Operator, system"
      - name: ordered_at
        type: datetime
        source: system
        description: "Logical-clock instant at which the order was created."
      - name: status
        type: enum
        source: system
        description: "Closure lifecycle; see state_machines.ClosureOrder."
        constraints: "one of OPEN, REOPEN_REQUESTED, CLEARED, VOIDED"
      - name: remediation_variant
        type: enum
        source: computed
        description: "FIXED_TABLE at creation; recomputed to CT_COMPUTED by a reopen request that supplies both treatment fields for an eligible reason. See calculations.reopen_remediation_window."
        constraints: "one of FIXED_TABLE, CT_COMPUTED"
      - name: required_remediation_minutes
        type: integer
        source: computed
        description: "Minutes of remediation the venue must observe before a reopen may be approved. See calculations.reopen_remediation_window."
      - name: earliest_reopen_at
        type: datetime
        source: computed
        description: "ordered_at + required_remediation_minutes minutes."
      - name: treatment_free_chlorine_ppm
        type: number
        source: input
        description: "Hyperchlorination level held during remediation, supplied on the reopen request; null when not supplied."
        default: null
      - name: treatment_ph
        type: number
        source: input
        description: "pH held during remediation, supplied on the reopen request; null when not supplied."
        default: null
      - name: verification_reading_id
        type: string
        source: input
        description: "Id of the WaterChemistryReading submitted with the most recent reopen request. Not a declared foreign key; it is overwritten on each new request."
        default: null
      - name: reopen_requested_at
        type: datetime
        source: system
        description: "Logical-clock instant of the most recent reopen request; null before the first one."
        default: null
      - name: reopen_decided_at
        type: datetime
        source: system
        description: "Logical-clock instant of the most recent reopen decision; null before the first one."
        default: null
      - name: reopen_decided_by_user_id
        type: string
        source: system
        description: "X-User-ID of the actor that decided the most recent reopen request; null before the first decision."
        default: null
      - name: reopen_denial_reason
        type: enum
        source: system
        description: "Reason recorded on the most recent DENY decision; cleared to null when a later decision approves."
        default: null
        constraints: "one of REMEDIATION_INCOMPLETE, WATER_NOT_IN_RANGE, VIOLATIONS_OPEN, null"
      - name: denial_count
        type: integer
        source: computed
        description: "Number of REOPEN_REQUESTED -> OPEN denial cycles this order has been through."
        default: 0
      - name: cleared_at
        type: datetime
        source: system
        description: "Logical-clock instant at which the order reached CLEARED; null otherwise."
        default: null

  - name: StaffAssignment
    parent: null
    common_fields: true
    fields:
      - name: facility_id
        type: string
        source: input
        description: "FK -> Facility.id; the venue the shift covers."
      - name: staff_ref
        type: string
        source: input
        description: "Certification/licence number identifying the individual. Two assignments carrying the same staff_ref denote the same person for overlap detection."
        constraints: "non-empty, length 1..64"
      - name: staff_name
        type: string
        source: input
        description: "Display name of the assigned individual."
        constraints: "non-empty"
      - name: role_type
        type: enum
        source: input
        description: "Duty performed on the shift."
        constraints: "one of LIFEGUARD, ATTENDANT"
      - name: certification_expires_on
        type: string
        source: input
        description: "Last day (YYYY-MM-DD, inclusive) on which the individual's certification is valid."
      - name: shift_start_at
        type: datetime
        source: input
        description: "Shift start instant, inclusive."
      - name: shift_end_at
        type: datetime
        source: input
        description: "Shift end instant, exclusive; must be strictly after shift_start_at."
      - name: status
        type: enum
        source: system
        description: "Assignment lifecycle; see state_machines.StaffAssignment."
        constraints: "one of SCHEDULED, CANCELLED"
      - name: cancel_reason
        type: enum
        source: system
        description: "Why the shift was cancelled; null while SCHEDULED."
        default: null
        constraints: "one of OPERATOR_REQUEST, FACILITY_CLOSED, null"
      - name: cancelled_at
        type: datetime
        source: system
        description: "Logical-clock instant of cancellation; null while SCHEDULED."
        default: null

  - name: ComplianceArtifact
    parent: Facility
    common_fields: true
    fields:
      - name: facility_id
        type: string
        source: input
        description: "FK -> Facility.id; the venue the artifact documents."
      - name: artifact_type
        type: enum
        source: input
        description: "SIGNAGE for a posted sign, DRAIN_CERTIFICATION for a VGB suction-outlet certification."
        constraints: "one of SIGNAGE, DRAIN_CERTIFICATION"
      - name: signage_type
        type: enum
        source: input
        description: "Which sign was posted. Required when artifact_type is SIGNAGE, must be absent or null when artifact_type is DRAIN_CERTIFICATION."
        default: null
        constraints: "one of DEPTH_MARKERS, EMERGENCY_PHONE, DIARRHEA_NOTICE, NO_LIFEGUARD_WARNING, SPA_TEMP_WARNING, null"
      - name: drain_cover_model
        type: string
        source: input
        description: "Manufacturer model of the certified drain cover. Required when artifact_type is DRAIN_CERTIFICATION, must be absent or null when artifact_type is SIGNAGE."
        default: null
      - name: sva_system_type
        type: enum
        source: input
        description: "Secondary suction-entrapment-avoidance system installed. Required when artifact_type is DRAIN_CERTIFICATION, must be absent or null when artifact_type is SIGNAGE."
        default: null
        constraints: "one of SVRS, GRAVITY_DRAIN_SYSTEM, UNBLOCKABLE_DRAIN, MULTIPLE_MAIN_DRAINS, NONE, null"
      - name: effective_on
        type: string
        source: input
        description: "Date (YYYY-MM-DD) the sign was posted or the certification was issued; must not be after the logical-clock date."
      - name: expires_on
        type: string
        source: computed
        description: "effective_on + SIGNAGE_VALID_DAYS days for SIGNAGE; effective_on + VGB_COVER_LIFESPAN_DAYS days for DRAIN_CERTIFICATION. Inclusive last valid day."
      - name: status
        type: enum
        source: computed
        description: "SUPERSEDED once a later artifact of the same (facility_id, artifact_type, signage_type) key is created; otherwise EXPIRED when the logical-clock date is after expires_on; otherwise ACTIVE."
        constraints: "one of ACTIVE, EXPIRED, SUPERSEDED"

  - name: Complaint
    parent: null
    common_fields: true
    fields:
      - name: facility_id
        type: string
        source: input
        description: "FK -> Facility.id; the venue complained about."
      - name: linked_inspection_id
        type: string
        source: input
        description: "FK -> Inspection.id; the COMPLAINT inspection opened to investigate. Null until the TRIAGE transition supplies it."
        default: null
      - name: complaint_type
        type: enum
        source: input
        description: "Nature of the report."
        constraints: "one of RWI_ILLNESS, INJURY, WATER_QUALITY, SANITATION, SAFETY_EQUIPMENT"
      - name: reporter_contact
        type: string
        source: input
        description: "Optional contact string supplied by the reporter."
        default: null
      - name: narrative
        type: string
        source: input
        description: "Reporter's description of the problem."
        constraints: "non-empty"
      - name: symptom_onset_date
        type: string
        source: input
        description: "Date (YYYY-MM-DD) symptoms began. Required when complaint_type is RWI_ILLNESS, must be absent or null otherwise, and must not be after the logical-clock date."
        default: null
      - name: illness_case_count
        type: integer
        source: input
        description: "Number of ill persons reported. Must be >= 1 when complaint_type is RWI_ILLNESS; must be 0 or absent otherwise."
        default: 0
      - name: pathogen_suspected
        type: enum
        source: input
        description: "Suspected organism; only meaningful for RWI_ILLNESS."
        default: null
        constraints: "one of CRYPTOSPORIDIUM, GIARDIA, LEGIONELLA, PSEUDOMONAS, NOROVIRUS, ECOLI, UNKNOWN, null"
      - name: reported_at
        type: datetime
        source: system
        description: "Logical-clock instant the complaint row was created."
      - name: risk_variant
        type: enum
        source: computed
        description: "SINGLE_REPORT or CLUSTER_AGGREGATE; see calculations.rwi_risk_score. Null for complaint_type other than RWI_ILLNESS."
        default: null
        constraints: "one of SINGLE_REPORT, CLUSTER_AGGREGATE, null"
      - name: cluster_case_count
        type: integer
        source: computed
        description: "Total illness cases counted by the selected variant (this complaint alone under SINGLE_REPORT; the whole cluster under CLUSTER_AGGREGATE). 0 for non-RWI complaints."
        default: 0
      - name: risk_score
        type: integer
        source: computed
        description: "Recreational-water-illness risk score in 0..RWI_SCORE_MAX computed at row creation; 0 for complaint_type other than RWI_ILLNESS."
        default: 0
      - name: escalated
        type: boolean
        source: computed
        description: "True when risk_score >= RWI_ESCALATION_THRESHOLD at row creation."
        default: false
      - name: status
        type: enum
        source: system
        description: "Investigation lifecycle; see state_machines.Complaint."
        constraints: "one of RECEIVED, TRIAGED, INVESTIGATING, SUBSTANTIATED, UNSUBSTANTIATED, CLOSED"
      - name: finding
        type: string
        source: input
        description: "Investigator's conclusion recorded with SUBSTANTIATE or UNSUBSTANTIATE; null before."
        default: null

  - name: FeeLedgerEntry
    parent: null
    common_fields: false
    fields:
      - name: operator_id
        type: string
        source: input
        description: "FK -> Operator.id; the operator whose balance this entry moves."
      - name: permit_id
        type: string
        source: input
        description: "FK -> Permit.id; the permit the charge or refund belongs to. Null for PLAN_REVIEW_FEE, REINSPECTION_FEE and PAYMENT entries."
        default: null
      - name: entry_type
        type: enum
        source: system
        description: "Kind of posting. Charges are positive, credits negative."
        constraints: "one of PERMIT_FEE, LATE_PENALTY, PLAN_REVIEW_FEE, REINSPECTION_FEE, PAYMENT, REFUND"
      - name: amount_cents
        type: integer
        source: computed
        description: "Signed amount in cents: positive for PERMIT_FEE, LATE_PENALTY, PLAN_REVIEW_FEE and REINSPECTION_FEE; negative for PAYMENT and REFUND."
      - name: posted_at
        type: datetime
        source: system
        description: "Logical-clock instant of the posting."
      - name: reference_note
        type: string
        source: input
        description: "Free-text reference recorded with the posting."
        default: null

state_machines:

  - entity: PlanReview
    initial_state: SUBMITTED
    terminal_states: [APPROVED, DISAPPROVED, SUPERSEDED]
    shape: "branching — UNDER_REVIEW forks to APPROVED, DISAPPROVED or CORRECTIONS_REQUIRED with divergent side-effect sets; the CORRECTIONS_REQUIRED branch rejoins the pipeline through a superseding revision row."
    transitions:
      - from: null
        to: SUBMITTED
        trigger: "POST /plan-reviews"
        actor: Operator
        preconditions:
          - "facility exists and facility.operator_id == X-User-ID"
        side_effects:
          - "revision_round set to 0; supersedes_plan_review_id set to null"
          - "submitted_on set to the logical-clock date"
          - "posts a FeeLedgerEntry(entry_type=PLAN_REVIEW_FEE, permit_id=null, amount_cents=+PLAN_REVIEW_FEE_CENTS)"
          - "recomputes Operator.fee_balance_cents"
      - from: CORRECTIONS_REQUIRED
        to: SUPERSEDED
        trigger: "POST /plan-reviews/{id}/revisions"
        actor: Operator
        preconditions:
          - "the review in the path has status == CORRECTIONS_REQUIRED"
          - "expected_plan_review_version equals the review's current version"
          - "review.revision_round + 1 <= PLAN_REVIEW_MAX_REVISION_ROUNDS"
        side_effects:
          - "the review in the path moves to SUPERSEDED and its version increments by 1"
          - "a new PlanReview row is created in SUBMITTED with supersedes_plan_review_id = path id, revision_round = path review's revision_round + 1, same facility_id and project_type"
          - "posts a FeeLedgerEntry(entry_type=PLAN_REVIEW_FEE, permit_id=null, amount_cents=+PLAN_REVIEW_FEE_CENTS) for the new row"
          - "recomputes Operator.fee_balance_cents"
      - from: SUBMITTED
        to: UNDER_REVIEW
        trigger: "POST /plan-reviews/{id}/transition action=START_REVIEW"
        actor: PlanReviewer
        preconditions: ["status == SUBMITTED"]
        side_effects: ["reviewer_user_id set to X-User-ID"]
      - from: UNDER_REVIEW
        to: CORRECTIONS_REQUIRED
        trigger: "POST /plan-reviews/{id}/transition action=REQUEST_CORRECTIONS"
        actor: PlanReviewer
        preconditions:
          - "status == UNDER_REVIEW"
          - "revision_round < PLAN_REVIEW_MAX_REVISION_ROUNDS"
        side_effects: ["correction_notes stored from the request body"]
        note: "When revision_round == PLAN_REVIEW_MAX_REVISION_ROUNDS the request is rejected with ERR_PLAN_REVIEW_ROUNDS_EXHAUSTED; the reviewer must APPROVE or DISAPPROVE."
      - from: UNDER_REVIEW
        to: APPROVED
        trigger: "POST /plan-reviews/{id}/transition action=APPROVE"
        actor: PlanReviewer
        preconditions: ["status == UNDER_REVIEW"]
        side_effects:
          - "decided_at set to the logical clock; decided_by_user_id set to X-User-ID"
          - "correction_notes cleared to null"
      - from: UNDER_REVIEW
        to: DISAPPROVED
        trigger: "POST /plan-reviews/{id}/transition action=DISAPPROVE"
        actor: PlanReviewer
        preconditions: ["status == UNDER_REVIEW"]
        side_effects:
          - "decided_at set to the logical clock; decided_by_user_id set to X-User-ID"
          - "every Permit row with plan_review_id == this review and status in {DRAFT, SUBMITTED, UNDER_REVIEW} moves to DENIED"

  - entity: Permit
    initial_state: DRAFT
    terminal_states: [DENIED, REVOKED, EXPIRED]
    shape: "cyclic — ISSUED -> SUSPENDED -> ISSUED may repeat any number of times."
    transitions:
      - from: null
        to: DRAFT
        trigger: "POST /permits"
        actor: Operator
        preconditions:
          - "facility exists and facility.operator_id == X-User-ID"
          - "when facility.requires_plan_review is true, plan_review_id is supplied and that review's facility_id == facility.id"
          - "no other Permit for this facility with status in {SUBMITTED, UNDER_REVIEW, ISSUED} has a term intersecting [term_start_date, term_end_date] (closed interval on both ends)"
          - "term_start_date <= logical-clock date + PERMIT_RENEWAL_WINDOW_DAYS days"
          - "for permit_type SEASONAL, facility.is_seasonal is true and the season length in days is <= SEASONAL_PERMIT_MAX_TERM_DAYS"
        side_effects:
          - "applied_on set to the logical-clock date; term_end_date, term_days and is_late_application computed and frozen"
          - "assessed_fee_cents stays 0 and fee_variant stays null until ISSUE"
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /permits/{id}/transition action=SUBMIT"
        actor: Operator
        preconditions: ["status == DRAFT", "facility.operator_id == X-User-ID"]
        side_effects: []
      - from: SUBMITTED
        to: UNDER_REVIEW
        trigger: "POST /permits/{id}/transition action=START_REVIEW"
        actor: HealthAuthorityAdmin
        preconditions: ["status == SUBMITTED"]
        side_effects: []
      - from: UNDER_REVIEW
        to: ISSUED
        trigger: "POST /permits/{id}/transition action=ISSUE"
        actor: HealthAuthorityAdmin
        preconditions:
          - "status == UNDER_REVIEW"
          - "X-User-ID != plan_review.decided_by_user_id when plan_review_id is not null (segregation of duties)"
          - "when the logical-clock date is >= VGB_ENFORCEMENT_START_DATE, facility.vgb_compliance_status == COMPLIANT"
          - "the facility has no Violation with status == OPEN and severity in {CRITICAL, IMMINENT_HEALTH_HAZARD} attached to a FINALIZED Inspection"
          - "when facility.requires_plan_review is true, plan_review.status == APPROVED"
          - "operator.fee_balance_cents == 0"
        side_effects:
          - "assessed_fee_cents and fee_variant computed by calculations.permit_fee_assessment; classification_at_issue snapshots facility.facility_class"
          - "issued_at set to the logical clock; issued_by_user_id set to X-User-ID"
          - "posts a FeeLedgerEntry(entry_type=PERMIT_FEE, permit_id=this permit, amount_cents=+subtotal_cents)"
          - "when is_late_application is true, additionally posts a FeeLedgerEntry(entry_type=LATE_PENALTY, permit_id=this permit, amount_cents=+penalty_cents)"
          - "recomputes Operator.fee_balance_cents"
          - "recomputes Facility.operating_posture, Facility.posture_reason and Facility.active_permit_id (bumps Facility.version)"
      - from: UNDER_REVIEW
        to: DENIED
        trigger: "POST /permits/{id}/transition action=DENY"
        actor: HealthAuthorityAdmin
        preconditions: ["status == UNDER_REVIEW"]
        side_effects: ["reason stored on suspension_reason is NOT used; the denial reason is recorded in the response message only"]
      - from: ISSUED
        to: SUSPENDED
        trigger: "POST /permits/{id}/transition action=SUSPEND, or the enforcement cascade of an inspection notice"
        actor: HealthAuthorityAdmin
        preconditions: ["status == ISSUED"]
        side_effects:
          - "suspension_reason set to ADMINISTRATIVE for the explicit action, or IMMINENT_HEALTH_HAZARD when driven by the enforcement cascade"
          - "recomputes Facility.operating_posture (PERMIT_NOT_ACTIVE -> CLOSED), Facility.posture_reason and Facility.active_permit_id (bumps Facility.version)"
      - from: SUSPENDED
        to: ISSUED
        trigger: "POST /permits/{id}/transition action=REINSTATE"
        actor: HealthAuthorityAdmin
        preconditions:
          - "status == SUSPENDED"
          - "the facility has no ClosureOrder with status in {OPEN, REOPEN_REQUESTED}"
          - "the facility has no Violation with status == OPEN and severity == IMMINENT_HEALTH_HAZARD attached to a FINALIZED Inspection"
        side_effects:
          - "suspension_reason cleared to null"
          - "recomputes Facility.operating_posture, Facility.posture_reason and Facility.active_permit_id (bumps Facility.version)"
        note: "This edge closes the ISSUED -> SUSPENDED -> ISSUED cycle."
      - from: ISSUED
        to: REVOKED
        trigger: "POST /permits/{id}/transition action=REVOKE"
        actor: HealthAuthorityAdmin
        preconditions:
          - "status in {ISSUED, SUSPENDED}"
          - "when refund_eligible is true: refunded is false AND the logical-clock date is on or before term_start_date + PERMIT_REFUND_WINDOW_DAYS days"
        side_effects:
          - "when refund_eligible is true, posts a FeeLedgerEntry(entry_type=REFUND, permit_id=this permit, amount_cents = -(sum of amount_cents over this permit's PERMIT_FEE and LATE_PENALTY entries)) and sets refunded to true"
          - "recomputes Operator.fee_balance_cents"
          - "recomputes Facility.operating_posture, Facility.posture_reason and Facility.active_permit_id (bumps Facility.version)"
      - from: SUSPENDED
        to: REVOKED
        trigger: "POST /permits/{id}/transition action=REVOKE"
        actor: HealthAuthorityAdmin
        preconditions:
          - "status in {ISSUED, SUSPENDED}"
          - "when refund_eligible is true: refunded is false AND the logical-clock date is on or before term_start_date + PERMIT_REFUND_WINDOW_DAYS days"
        side_effects:
          - "identical to the ISSUED -> REVOKED edge"
      - from: ISSUED
        to: EXPIRED
        trigger: "POST /permits/{id}/transition action=EXPIRE"
        actor: HealthAuthorityAdmin
        preconditions: ["status in {ISSUED, SUSPENDED}", "logical-clock date > term_end_date"]
        side_effects:
          - "recomputes Facility.operating_posture, Facility.posture_reason and Facility.active_permit_id (bumps Facility.version)"
      - from: SUSPENDED
        to: EXPIRED
        trigger: "POST /permits/{id}/transition action=EXPIRE"
        actor: HealthAuthorityAdmin
        preconditions: ["status in {ISSUED, SUSPENDED}", "logical-clock date > term_end_date"]
        side_effects: ["identical to the ISSUED -> EXPIRED edge"]

  - entity: Inspection
    axis: workflow_status
    initial_state: SCHEDULED
    terminal_states: [VOIDED]
    shape: "parallel — this axis evolves independently of the enforcement_status axis declared below on the same row."
    transitions:
      - from: null
        to: SCHEDULED
        trigger: "POST /inspections"
        actor: Inspector
        preconditions:
          - "facility exists"
          - "scheduled_end_at > scheduled_start_at"
          - "no other Inspection for this facility with workflow_status in {SCHEDULED, IN_PROGRESS, SUBMITTED, FINALIZED} occupies the buffered closed window (see validations, ERR_INSPECTION_WINDOW_CONFLICT)"
          - "for inspection_type REINSPECTION, prior_inspection_id is supplied, that inspection's facility_id matches, and its workflow_status == FINALIZED"
          - "for inspection_type ROUTINE at a seasonal facility, date(scheduled_start_at) is inside [season_start_date, season_end_date]"
        side_effects:
          - "inspector_user_id set to X-User-ID; enforcement_status initialised to NONE"
      - from: SCHEDULED
        to: IN_PROGRESS
        trigger: "POST /inspections/{id}/transition action=START"
        actor: Inspector
        preconditions: ["workflow_status == SCHEDULED", "X-User-ID == inspector_user_id"]
        side_effects: ["started_at set to the logical clock"]
      - from: IN_PROGRESS
        to: SUBMITTED
        trigger: "POST /inspections/{id}/transition action=SUBMIT"
        actor: Inspector
        preconditions: ["workflow_status == IN_PROGRESS", "X-User-ID == inspector_user_id"]
        side_effects: ["submitted_at set to the logical clock; no further Violation rows may be added"]
      - from: SUBMITTED
        to: FINALIZED
        trigger: "POST /inspections/{id}/transition action=FINALIZE"
        actor: HealthAuthorityAdmin
        preconditions: ["workflow_status == SUBMITTED"]
        side_effects:
          - "finalized_at set to the logical clock"
          - "critical_demerits, noncritical_demerits, score and result computed by calculations.inspection_score_and_result"
          - "reinspection_due_on set to date(finalized_at) + REINSPECTION_DUE_DAYS when result is CONDITIONAL or FAIL, else null"
          - "CASCADE hop 1: Facility.open_demerit_points recomputed, which now includes every OPEN Violation of this inspection (bumps Facility.version)"
          - "CASCADE hop 2: when result == FAIL, enforcement_status moves NONE -> NOTICE_ISSUED automatically and a FeeLedgerEntry(entry_type=REINSPECTION_FEE, permit_id=null, amount_cents=+REINSPECTION_FEE_CENTS) is posted, refreshing Operator.fee_balance_cents"
          - "CASCADE hop 3: the automatic NOTICE_ISSUED, when this inspection has at least one Violation with severity == IMMINENT_HEALTH_HAZARD and status == OPEN, moves the facility's ISSUED Permit to SUSPENDED with suspension_reason = IMMINENT_HEALTH_HAZARD"
          - "CASCADE hop 4: that permit suspension recomputes Facility.operating_posture to CLOSED with posture_reason = PERMIT_NOT_ACTIVE (bumps Facility.version again)"
      - from: SCHEDULED
        to: VOIDED
        trigger: "POST /inspections/{id}/transition action=VOID"
        actor: HealthAuthorityAdmin
        preconditions: ["workflow_status != VOIDED"]
        side_effects: ["voided_at set to the logical clock; every child Violation moves to VOIDED"]
      - from: IN_PROGRESS
        to: VOIDED
        trigger: "POST /inspections/{id}/transition action=VOID"
        actor: HealthAuthorityAdmin
        preconditions: ["workflow_status != VOIDED"]
        side_effects: ["identical to the SCHEDULED -> VOIDED edge"]
      - from: SUBMITTED
        to: VOIDED
        trigger: "POST /inspections/{id}/transition action=VOID"
        actor: HealthAuthorityAdmin
        preconditions: ["workflow_status != VOIDED"]
        side_effects: ["identical to the SCHEDULED -> VOIDED edge"]
      - from: FINALIZED
        to: VOIDED
        trigger: "POST /inspections/{id}/transition action=VOID"
        actor: HealthAuthorityAdmin
        preconditions: ["workflow_status != VOIDED"]
        side_effects:
          - "voided_at set to the logical clock; every child Violation moves to VOIDED"
          - "score, result, critical_demerits, noncritical_demerits and reinspection_due_on are left as computed (the record of what was scored) but the inspection no longer contributes demerits"
          - "COMPENSATION: Facility.open_demerit_points recomputed; because the inspection is no longer FINALIZED its violations drop out of the sum, restoring the exact pre-FINALIZE value (bumps Facility.version)"
          - "enforcement_status moves to CLEARED when it was NOTICE_ISSUED or ESCALATED"

  - entity: Inspection
    axis: enforcement_status
    initial_state: NONE
    terminal_states: [CLEARED]
    shape: "parallel — independent of the workflow_status axis on the same row; every edge here is guarded on workflow_status == FINALIZED."
    transitions:
      - from: NONE
        to: NOTICE_ISSUED
        trigger: "POST /inspections/{id}/enforcement action=ISSUE_NOTICE, or automatically as hop 2 of the FINALIZE cascade when result == FAIL"
        actor: HealthAuthorityAdmin
        preconditions:
          - "workflow_status == FINALIZED"
          - "enforcement_status == NONE"
          - "result in {CONDITIONAL, FAIL}"
        side_effects:
          - "when the inspection carries a Violation with severity == IMMINENT_HEALTH_HAZARD and status == OPEN, the facility's Permit with status == ISSUED moves to SUSPENDED with suspension_reason = IMMINENT_HEALTH_HAZARD, which in turn recomputes Facility.operating_posture and Facility.posture_reason (bumps Facility.version)"
      - from: NOTICE_ISSUED
        to: ESCALATED
        trigger: "POST /inspections/{id}/enforcement action=ESCALATE"
        actor: HealthAuthorityAdmin
        preconditions:
          - "workflow_status == FINALIZED"
          - "enforcement_status == NOTICE_ISSUED"
          - "the facility has at least one Violation with status == OPEN attached to this inspection"
        side_effects:
          - "a ClosureOrder(closure_reason=PERMIT_ACTION, ordered_by_role=HealthAuthorityAdmin) is created in OPEN for the facility"
          - "Facility.operating_posture recomputed to CLOSED with posture_reason = CLOSURE_ORDER_OPEN (bumps Facility.version)"
      - from: NOTICE_ISSUED
        to: CLEARED
        trigger: "POST /inspections/{id}/enforcement action=CLEAR"
        actor: HealthAuthorityAdmin
        preconditions:
          - "workflow_status == FINALIZED"
          - "enforcement_status in {NOTICE_ISSUED, ESCALATED}"
          - "no Violation of this inspection has status == OPEN"
        side_effects: []
      - from: ESCALATED
        to: CLEARED
        trigger: "POST /inspections/{id}/enforcement action=CLEAR"
        actor: HealthAuthorityAdmin
        preconditions:
          - "workflow_status == FINALIZED"
          - "enforcement_status in {NOTICE_ISSUED, ESCALATED}"
          - "no Violation of this inspection has status == OPEN"
        side_effects: []

  - entity: Violation
    initial_state: OPEN
    terminal_states: [VERIFIED, VOIDED]
    shape: "cyclic — OPEN -> CORRECTED -> OPEN repeats whenever a verification is REJECTED."
    transitions:
      - from: null
        to: OPEN
        trigger: "POST /inspections/{id}/violations"
        actor: Inspector
        preconditions:
          - "parent inspection workflow_status == IN_PROGRESS"
          - "X-User-ID == inspection.inspector_user_id"
        side_effects: ["points_assessed computed and frozen"]
      - from: OPEN
        to: CORRECTED
        trigger: "POST /violations/{id}/correct"
        actor: Operator
        preconditions:
          - "status == OPEN"
          - "the parent inspection's workflow_status == FINALIZED"
          - "the parent inspection's facility.operator_id == X-User-ID"
        side_effects:
          - "corrected_at set to the logical clock"
          - "Facility.open_demerit_points recomputed; this row's points_assessed leaves the sum because status is no longer OPEN (bumps Facility.version)"
      - from: CORRECTED
        to: VERIFIED
        trigger: "POST /violations/{id}/verify outcome=VERIFIED"
        actor: Inspector
        preconditions: ["status == CORRECTED"]
        side_effects:
          - "verified_at set to the logical clock"
          - "Facility.open_demerit_points is unchanged (the row was already outside the OPEN sum)"
      - from: CORRECTED
        to: OPEN
        trigger: "POST /violations/{id}/verify outcome=REJECTED"
        actor: Inspector
        preconditions: ["status == CORRECTED"]
        side_effects:
          - "rejection_count incremented by 1; corrected_at left at its previous value"
          - "COMPENSATION: Facility.open_demerit_points recomputed; this row's points_assessed re-enters the sum, restoring the exact value it had before the CORRECT transition (bumps Facility.version)"
      - from: OPEN
        to: VOIDED
        trigger: "POST /inspections/{id}/transition action=VOID (cascade)"
        actor: HealthAuthorityAdmin
        preconditions: ["parent inspection is being voided"]
        side_effects: ["row leaves every demerit sum"]
      - from: CORRECTED
        to: VOIDED
        trigger: "POST /inspections/{id}/transition action=VOID (cascade)"
        actor: HealthAuthorityAdmin
        preconditions: ["parent inspection is being voided"]
        side_effects: ["row leaves every demerit sum"]

  - entity: ClosureOrder
    initial_state: OPEN
    terminal_states: [CLEARED, VOIDED]
    shape: "cyclic — OPEN -> REOPEN_REQUESTED -> OPEN repeats on every denied reopen."
    transitions:
      - from: null
        to: OPEN
        trigger: "POST /closure-orders, or automatically from an IMMINENT_HAZARD water reading, or as a side effect of an enforcement ESCALATE"
        actor: Inspector
        preconditions:
          - "facility exists"
          - "expected_facility_version equals facility.version (manual creations only)"
        side_effects:
          - "ordered_at set to the logical clock; remediation_variant set to FIXED_TABLE"
          - "required_remediation_minutes set to REMEDIATION_MINUTES_TABLE[closure_reason]; earliest_reopen_at set to ordered_at + that many minutes"
          - "CASCADE hop: Facility.operating_posture recomputed to CLOSED with posture_reason = CLOSURE_ORDER_OPEN; Facility.version increments by 1 on every manual creation regardless of whether the posture value changed"
          - "CASCADE hop: because the facility posture is now CLOSED, every StaffAssignment for the facility with status == SCHEDULED and shift_start_at < earliest_reopen_at and shift_end_at > ordered_at moves to CANCELLED with cancel_reason = FACILITY_CLOSED"
      - from: OPEN
        to: REOPEN_REQUESTED
        trigger: "POST /closure-orders/{id}/reopen-request"
        actor: Operator
        preconditions:
          - "status == OPEN"
          - "facility.operator_id == X-User-ID"
          - "the verification reading exists, belongs to this facility, and (logical clock - reading.sampled_at) <= REOPEN_READING_MAX_AGE_MINUTES minutes with sampled_at not in the future"
        side_effects:
          - "reopen_requested_at set to the logical clock; verification_reading_id stored"
          - "treatment_free_chlorine_ppm and treatment_ph stored when supplied"
          - "required_remediation_minutes, remediation_variant and earliest_reopen_at recomputed by calculations.reopen_remediation_window"
      - from: REOPEN_REQUESTED
        to: CLEARED
        trigger: "POST /closure-orders/{id}/reopen-decision decision=APPROVE"
        actor: Inspector
        preconditions:
          - "status == REOPEN_REQUESTED"
          - "X-User-ID != ordered_by_user_id (segregation of duties)"
          - "the stored verification reading's compliance_status == IN_RANGE"
          - "logical clock >= earliest_reopen_at"
          - "the facility has no Violation with status == OPEN and severity == IMMINENT_HEALTH_HAZARD attached to a FINALIZED Inspection"
        side_effects:
          - "cleared_at, reopen_decided_at set to the logical clock; reopen_decided_by_user_id set to X-User-ID; reopen_denial_reason cleared to null"
          - "Facility.operating_posture recomputed (bumps Facility.version)"
      - from: REOPEN_REQUESTED
        to: OPEN
        trigger: "POST /closure-orders/{id}/reopen-decision decision=DENY"
        actor: Inspector
        preconditions:
          - "status == REOPEN_REQUESTED"
          - "X-User-ID != ordered_by_user_id (segregation of duties)"
        side_effects:
          - "denial_count incremented by 1; reopen_denial_reason stored from the request body; reopen_decided_at and reopen_decided_by_user_id set"
          - "required_remediation_minutes, remediation_variant and earliest_reopen_at are left exactly as the reopen request computed them"
        note: "Closes the OPEN -> REOPEN_REQUESTED -> OPEN cycle; the operator may request again with a fresh verification reading."
      - from: OPEN
        to: VOIDED
        trigger: "POST /closure-orders/{id}/reopen-decision decision=VOID"
        actor: HealthAuthorityAdmin
        preconditions: ["status == OPEN", "actor role is HealthAuthorityAdmin"]
        side_effects:
          - "reopen_decided_at and reopen_decided_by_user_id set; the order stops gating the facility"
          - "Facility.operating_posture recomputed (bumps Facility.version)"
        note: "Administrative rescission of an order issued in error. The segregation-of-duties check does not apply to VOID."

  - entity: Complaint
    initial_state: RECEIVED
    terminal_states: [CLOSED]
    shape: "branching — INVESTIGATING forks to SUBSTANTIATED or UNSUBSTANTIATED, both rejoining at CLOSED."
    transitions:
      - from: null
        to: RECEIVED
        trigger: "POST /complaints"
        actor: Anonymous
        preconditions: ["facility exists"]
        side_effects:
          - "reported_at set to the logical clock"
          - "risk_variant, cluster_case_count, risk_score and escalated computed by calculations.rwi_risk_score"
          - "when escalated is true, a ClosureOrder(closure_reason=RWI_OUTBREAK, ordered_by_user_id='system', ordered_by_role=system) is created in OPEN for the facility, which recomputes Facility.operating_posture to CLOSED (bumps Facility.version)"
      - from: RECEIVED
        to: TRIAGED
        trigger: "POST /complaints/{id}/transition action=TRIAGE"
        actor: Inspector
        preconditions: ["status == RECEIVED"]
        side_effects: ["linked_inspection_id stored when supplied; the referenced inspection must have inspection_type == COMPLAINT and the same facility_id"]
      - from: TRIAGED
        to: INVESTIGATING
        trigger: "POST /complaints/{id}/transition action=START_INVESTIGATION"
        actor: Inspector
        preconditions: ["status == TRIAGED", "linked_inspection_id is not null"]
        side_effects: []
      - from: INVESTIGATING
        to: SUBSTANTIATED
        trigger: "POST /complaints/{id}/transition action=SUBSTANTIATE"
        actor: Inspector
        preconditions: ["status == INVESTIGATING", "the linked inspection's workflow_status == FINALIZED"]
        side_effects: ["finding stored from the request body"]
      - from: INVESTIGATING
        to: UNSUBSTANTIATED
        trigger: "POST /complaints/{id}/transition action=UNSUBSTANTIATE"
        actor: Inspector
        preconditions: ["status == INVESTIGATING", "the linked inspection's workflow_status == FINALIZED"]
        side_effects: ["finding stored from the request body"]
      - from: SUBSTANTIATED
        to: CLOSED
        trigger: "POST /complaints/{id}/transition action=CLOSE"
        actor: HealthAuthorityAdmin
        preconditions: ["status in {SUBSTANTIATED, UNSUBSTANTIATED}"]
        side_effects: []
      - from: UNSUBSTANTIATED
        to: CLOSED
        trigger: "POST /complaints/{id}/transition action=CLOSE"
        actor: HealthAuthorityAdmin
        preconditions: ["status in {SUBSTANTIATED, UNSUBSTANTIATED}"]
        side_effects: []

  - entity: StaffAssignment
    initial_state: SCHEDULED
    terminal_states: [CANCELLED]
    shape: "linear with an external cascade entry point."
    transitions:
      - from: null
        to: SCHEDULED
        trigger: "POST /staff-assignments"
        actor: Operator
        preconditions:
          - "facility exists and facility.operator_id == X-User-ID"
          - "facility.operating_posture != CLOSED"
          - "shift_end_at > shift_start_at and (shift_end_at - shift_start_at) <= MAX_SHIFT_MINUTES minutes"
          - "certification_expires_on >= date(shift_start_at)"
          - "no other StaffAssignment with the same staff_ref and status == SCHEDULED overlaps the half-open interval [shift_start_at, shift_end_at)"
        side_effects: ["Facility.operating_posture recomputed (bumps Facility.version)"]
      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /staff-assignments/{id}/cancel"
        actor: Operator
        preconditions: ["status == SCHEDULED", "facility.operator_id == X-User-ID"]
        side_effects:
          - "cancel_reason set to OPERATOR_REQUEST; cancelled_at set to the logical clock"
          - "Facility.operating_posture recomputed (bumps Facility.version)"
      - from: SCHEDULED
        to: CANCELLED
        trigger: "ClosureOrder creation cascade (facility posture became CLOSED)"
        actor: system
        preconditions: ["status == SCHEDULED", "shift_start_at < closure.earliest_reopen_at and shift_end_at > closure.ordered_at"]
        side_effects: ["cancel_reason set to FACILITY_CLOSED; cancelled_at set to the logical clock"]

concurrency_rules:
  - rule_id: closure-create-stale-facility
    parent_entity: Facility
    write_endpoint: "POST /closure-orders"
    occ_field: "expected_facility_version"
    description: |
      Ordering a closure against a Facility whose version has advanced since the
      client last read it is rejected. A closure order legitimately stacks on top
      of the facility's current compliance picture — a second order for a
      different reason is a valid product operation and would otherwise succeed —
      so the system pins the writer's view of the facility with an optimistic
      version check instead of a state precondition.
    error_id: ERR_STALE_FACILITY_VERSION
    http_status: 412

  - rule_id: plan-revision-stale-review
    parent_entity: PlanReview
    write_endpoint: "POST /plan-reviews/{id}/revisions"
    occ_field: "expected_plan_review_version"
    description: |
      Filing a revision against a PlanReview whose version has advanced since the
      client last read it is rejected. Filing a revision that supersedes the prior
      review is a legitimate repeatable operation while the review sits in
      CORRECTIONS_REQUIRED, so the stale-view case is resolved by an optimistic
      version check on the superseded review rather than by its status alone.
    error_id: ERR_STALE_PLAN_REVIEW_VERSION
    http_status: 412

calculations:

  - name: facility_classification_derivation
    trigger: "On POST /facilities and on every PATCH /facilities/{id}; also re-evaluated whenever operating_posture is recomputed."
    algorithm: threshold
    formula: |
      water_type = "SPA" if facility_class == "SPA" else "POOL"
      divisor = BATHER_LOAD_SQFT_PER_BATHER_SPA if water_type == "SPA"
                else BATHER_LOAD_SQFT_PER_BATHER_POOL
      max_bather_load = floor(surface_area_sqft / divisor)
      lifeguard_required = (facility_class in {"CLASS_A_COMPETITION", "CLASS_B_PUBLIC"}
                            and max_bather_load >= LIFEGUARD_REQUIRED_BATHER_LOAD_THRESHOLD)
      required_signage_types =
          (REQUIRED_SIGNAGE_TYPES_SPA if water_type == "SPA" else REQUIRED_SIGNAGE_TYPES_POOL)
          + (["NO_LIFEGUARD_WARNING"] if lifeguard_required is False else [])
    input_set: "Only the facility row's own input fields; no cross-entity data."
    constants:
      BATHER_LOAD_SQFT_PER_BATHER_POOL: 20
      BATHER_LOAD_SQFT_PER_BATHER_SPA: 10
      LIFEGUARD_REQUIRED_BATHER_LOAD_THRESHOLD: 50
      REQUIRED_SIGNAGE_TYPES_POOL: ["DEPTH_MARKERS", "EMERGENCY_PHONE", "DIARRHEA_NOTICE"]
      REQUIRED_SIGNAGE_TYPES_SPA: ["SPA_TEMP_WARNING", "EMERGENCY_PHONE", "DIARRHEA_NOTICE"]
    precision: "max_bather_load is an integer produced by floor(); no other rounding."

  - name: permit_fee_assessment
    trigger: "Runs exactly once, on the Permit UNDER_REVIEW -> ISSUED transition (POST /permits/{id}/transition action=ISSUE). Writes Permit.assessed_fee_cents and Permit.fee_variant."
    algorithm: tiered_pricing
    formula: |
      # --- evaluation order is pinned; do not reorder ---
      # step 1: tier base off the facility class as it stands at issuance
      base_cents = PERMIT_BASE_FEE_CENTS[facility.facility_class]

      # step 2: volume surcharge on the gallons ABOVE the free allowance
      billable_gallons = max(0, facility.water_volume_gallons - VOLUME_SURCHARGE_FREE_GALLONS)
      volume_units     = ceil(billable_gallons / 10000)
      volume_cents     = volume_units * VOLUME_SURCHARGE_CENTS_PER_10K_GALLONS

      # step 3: feature surcharges; never prorated
      feature_cents = sum(FEATURE_SURCHARGE_CENTS[f] for f in facility.features)

      # step 4: proration, per component, rounded per component, THEN summed
      if permit.permit_type == "ANNUAL":
          fee_variant   = "FULL_TERM"
          subtotal_cents = base_cents + volume_cents + feature_cents
      else:  # SEASONAL
          fee_variant   = "SEASONAL_PRORATED"
          factor         = permit.term_days / SEASONAL_TERM_DENOMINATOR_DAYS
          subtotal_cents = ( round_half_up(base_cents   * factor)
                           + round_half_up(volume_cents * factor)
                           + feature_cents )
          # PINNED: round each prorated component to whole cents BEFORE summing.
          # round_half_up(base+volume, factor) applied to the SUM is WRONG and can
          # differ by one cent (e.g. base 30000 + volume 10000 over a 92-day season
          # gives 7562 + 2521 = 10083 per-component, but 10082 sum-then-round).

      # step 5: late penalty applies to the post-proration subtotal
      penalty_cents = round_half_up(subtotal_cents * LATE_APPLICATION_PENALTY_PCT) \
                      if permit.is_late_application else 0

      assessed_fee_cents = subtotal_cents + penalty_cents
    input_set: |
      facility_class, water_volume_gallons and features are read from the Facility row
      at the instant of issuance (and snapshotted into Permit.classification_at_issue);
      term_days and is_late_application were frozen at application time.
    constants:
      PERMIT_BASE_FEE_CENTS: { CLASS_A_COMPETITION: 45000, CLASS_B_PUBLIC: 30000, CLASS_C_SEMI_PUBLIC: 18000, SPA: 12000 }
      VOLUME_SURCHARGE_FREE_GALLONS: 25000
      VOLUME_SURCHARGE_CENTS_PER_10K_GALLONS: 2500
      FEATURE_SURCHARGE_CENTS: { SLIDE: 5000, DIVING_BOARD: 7500, WAVE_GENERATOR: 12000, SPA_JETS: 4000, SPLASH_PAD: 3000 }
      SEASONAL_TERM_DENOMINATOR_DAYS: 365
      LATE_APPLICATION_PENALTY_PCT: 0.25
    precision: "Whole cents, round_half_up, applied per component as pinned in step 4 and once more to the penalty in step 5."
    variants:
      - name: FULL_TERM
        when: "permit_type == ANNUAL"
        difference: "No proration factor; base and volume surcharge are charged in full for the 365-day term."
      - name: SEASONAL_PRORATED
        when: "permit_type == SEASONAL"
        difference: "Base and volume surcharge are multiplied by term_days/365 and rounded individually; feature surcharges stay at full price. The same facility therefore yields a different assessed_fee_cents under the two variants."

  - name: inspection_score_and_result
    trigger: "Runs exactly once, on the Inspection workflow_status SUBMITTED -> FINALIZED transition. Writes critical_demerits, noncritical_demerits, score and result."
    algorithm: weighted_scoring
    formula: |
      # per-violation points were frozen at Violation creation:
      #   points_assessed = round_half_up(SEVERITY_POINTS[severity] * CORRECTED_ON_SITE_CREDIT_FACTOR)
      #                     when corrected_on_site and severity != IMMINENT_HEALTH_HAZARD
      #                     else SEVERITY_POINTS[severity]
      rows = [v for v in violations_of(inspection) if v.status != "VOIDED"]

      raw_critical    = sum(v.points_assessed for v in rows
                            if v.severity in {"IMMINENT_HEALTH_HAZARD", "CRITICAL"})
      raw_noncritical = sum(v.points_assessed for v in rows if v.severity == "NONCRITICAL")

      critical_demerits    = min(raw_critical,    CRITICAL_DEMERIT_CAP)
      noncritical_demerits = min(raw_noncritical, NONCRITICAL_DEMERIT_CAP)

      score = max(0, INSPECTION_SCORE_MAX - critical_demerits - noncritical_demerits)

      has_imminent   = any(v.severity == "IMMINENT_HEALTH_HAZARD" for v in rows)
      has_uncorrected_critical = any(v.severity == "CRITICAL" and v.corrected_on_site is False
                                     for v in rows)

      if has_imminent or score < SCORE_FAIL_THRESHOLD:
          result = "FAIL"
      elif score < SCORE_PASS_THRESHOLD or has_uncorrected_critical:
          result = "CONDITIONAL"
      else:
          result = "PASS"
    input_set: "Every Violation whose inspection_id is this inspection and whose status is not VOIDED, in whatever correction state it currently holds."
    constants:
      SEVERITY_POINTS: { IMMINENT_HEALTH_HAZARD: 25, CRITICAL: 10, NONCRITICAL: 3 }
      CORRECTED_ON_SITE_CREDIT_FACTOR: 0.5
      CRITICAL_DEMERIT_CAP: 40
      NONCRITICAL_DEMERIT_CAP: 20
      INSPECTION_SCORE_MAX: 100
      SCORE_PASS_THRESHOLD: 85
      SCORE_FAIL_THRESHOLD: 70
    precision: "All integers. The only rounding is the per-violation round_half_up of the corrected-on-site credit (CRITICAL 10 -> 5, NONCRITICAL 3 -> 2)."

  - name: reopen_remediation_window
    trigger: "Written at ClosureOrder creation (FIXED_TABLE branch) and rewritten on POST /closure-orders/{id}/reopen-request. Writes remediation_variant, required_remediation_minutes and earliest_reopen_at."
    algorithm: threshold
    formula: |
      ct_eligible = closure_reason in {"FECAL_DIARRHEAL", "RWI_OUTBREAK"}
      supplied    = (treatment_free_chlorine_ppm is not null
                     and treatment_free_chlorine_ppm > 0
                     and treatment_ph is not null)

      if ct_eligible and supplied:
          remediation_variant = "CT_COMPUTED"
          ct_target = CT_TARGET_PPM_MINUTES * (CT_PH_HIGH_MULTIPLIER
                                               if treatment_ph > CT_PH_THRESHOLD else 1)
          required_remediation_minutes = max(MIN_REMEDIATION_MINUTES,
                                             ceil(ct_target / treatment_free_chlorine_ppm))
      else:
          remediation_variant = "FIXED_TABLE"
          required_remediation_minutes = REMEDIATION_MINUTES_TABLE[closure_reason]

      earliest_reopen_at = ordered_at + required_remediation_minutes minutes
      # PINNED: always measured from ordered_at, never from reopen_requested_at.
    input_set: "The closure order's own closure_reason and ordered_at, plus the two treatment fields supplied on the reopen request (null before any request)."
    constants:
      REMEDIATION_MINUTES_TABLE:
        FECAL_FORMED: 30
        FECAL_DIARRHEAL: 765
        VOMIT: 30
        BLOOD: 30
        CHEMICAL: 60
        WATER_CHEMISTRY: 30
        EQUIPMENT: 60
        RWI_OUTBREAK: 1440
        PERMIT_ACTION: 0
      CT_TARGET_PPM_MINUTES: 15300
      CT_PH_THRESHOLD: 7.5
      CT_PH_HIGH_MULTIPLIER: 1.5
      MIN_REMEDIATION_MINUTES: 30
    precision: "Whole minutes; ceil() on the CT quotient."
    variants:
      - name: FIXED_TABLE
        when: "The order was just created, or the reopen request supplied no treatment data, or the reason is not CT-eligible."
        difference: "Duration is the published table value for the closure reason — 765 minutes for FECAL_DIARRHEAL regardless of how the water was actually treated."
      - name: CT_COMPUTED
        when: "closure_reason is FECAL_DIARRHEAL or RWI_OUTBREAK AND the reopen request supplied both treatment_free_chlorine_ppm > 0 and treatment_ph."
        difference: "Duration is the contact-time quotient ceil(15300 / ppm), multiplied by 1.5 first when pH exceeds 7.5. A diarrheal closure hyperchlorinated to 40 ppm at pH 7.2 needs 383 minutes instead of the table's 765 — the same closure order yields a different earliest_reopen_at, and therefore a different reopen verdict at the same clock."

  - name: rwi_risk_score
    trigger: "Runs exactly once, at Complaint creation (POST /complaints). Writes risk_variant, cluster_case_count, risk_score and escalated."
    algorithm: aggregation
    formula: |
      if complaint_type != "RWI_ILLNESS":
          risk_variant = null; cluster_case_count = 0; risk_score = 0; escalated = False
      else:
          peers = [c for c in Complaint
                   if c.facility_id == this.facility_id
                   and c.id != this.id
                   and c.complaint_type == "RWI_ILLNESS"
                   and c.status not in {"UNSUBSTANTIATED", "CLOSED"}
                   and (this.reported_at - RWI_CLUSTER_WINDOW_DAYS days)
                       <= c.reported_at <= this.reported_at]     # both ends inclusive

          if len(peers) == 0:
              risk_variant       = "SINGLE_REPORT"
              cluster_case_count = this.illness_case_count
              pathogen_pool      = [this.pathogen_suspected]
          else:
              risk_variant       = "CLUSTER_AGGREGATE"
              cluster_case_count = this.illness_case_count + sum(p.illness_case_count for p in peers)
              pathogen_pool      = [this.pathogen_suspected] + [p.pathogen_suspected for p in peers]

          case_component     = min(RWI_CASE_POINTS_CAP, cluster_case_count * RWI_CASE_POINTS)
          pathogen_component = max(RWI_PATHOGEN_WEIGHTS[p] if p is not null
                                   else RWI_PATHOGEN_WEIGHT_WHEN_NULL
                                   for p in pathogen_pool)
          onset_gap_days     = (date(this.reported_at) - this.symptom_onset_date).days
          recency_component  = RWI_RECENCY_BONUS if onset_gap_days <= RWI_RECENCY_WINDOW_DAYS else 0

          risk_score = min(RWI_SCORE_MAX,
                           case_component + pathogen_component + recency_component)
          escalated  = risk_score >= RWI_ESCALATION_THRESHOLD
    input_set: "This complaint plus every other RWI_ILLNESS complaint on the same facility whose status is not UNSUBSTANTIATED or CLOSED and whose reported_at falls in the inclusive 14-day window ending at this complaint's reported_at."
    constants:
      RWI_CLUSTER_WINDOW_DAYS: 14
      RWI_CASE_POINTS: 12
      RWI_CASE_POINTS_CAP: 60
      RWI_PATHOGEN_WEIGHTS: { CRYPTOSPORIDIUM: 30, GIARDIA: 20, LEGIONELLA: 35, PSEUDOMONAS: 15, NOROVIRUS: 25, ECOLI: 25, UNKNOWN: 5 }
      RWI_PATHOGEN_WEIGHT_WHEN_NULL: 0
      RWI_RECENCY_BONUS: 10
      RWI_RECENCY_WINDOW_DAYS: 7
      RWI_SCORE_MAX: 100
      RWI_ESCALATION_THRESHOLD: 60
    precision: "All integers; no rounding."
    variants:
      - name: SINGLE_REPORT
        when: "No qualifying peer complaint exists in the 14-day window."
        difference: "case_component is derived from this complaint's illness_case_count alone and the pathogen weight is this complaint's own suspected organism."
      - name: CLUSTER_AGGREGATE
        when: "At least one qualifying peer complaint exists in the 14-day window."
        difference: "Case counts are summed across the cluster before the 60-point cap and the pathogen weight is the maximum across the cluster, so an identical complaint body scores higher (e.g. 44 alone versus 83 inside a cluster) and can cross the escalation threshold that the single-report reading would not."

  - name: water_reading_classification
    trigger: "Runs at POST /facilities/{id}/water-readings, before the row is persisted. Writes compliance_status and out_of_range_parameters."
    algorithm: threshold
    formula: |
      is_spa       = facility.water_type == "SPA"
      cl_min       = FREE_CHLORINE_MIN_PPM_SPA if is_spa else FREE_CHLORINE_MIN_PPM_POOL
      cl_imminent  = FREE_CHLORINE_IMMINENT_PPM_SPA if is_spa else FREE_CHLORINE_IMMINENT_PPM_POOL
      temp_max     = WATER_TEMP_MAX_F_SPA if is_spa else WATER_TEMP_MAX_F_POOL

      breaches = []                                  # emitted in this fixed order
      if free_chlorine_ppm       <  cl_min:                      breaches += ["FREE_CHLORINE_LOW"]
      if free_chlorine_ppm       >  FREE_CHLORINE_MAX_PPM:       breaches += ["FREE_CHLORINE_HIGH"]
      if combined_chloramine_ppm >  COMBINED_CHLORAMINE_MAX_PPM: breaches += ["COMBINED_CHLORAMINE_HIGH"]
      if ph                      <  PH_MIN:                      breaches += ["PH_LOW"]
      if ph                      >  PH_MAX:                      breaches += ["PH_HIGH"]
      if cyanuric_acid_ppm       >  CYANURIC_ACID_MAX_PPM:       breaches += ["CYANURIC_ACID_HIGH"]
      if water_temp_f            >  temp_max:                    breaches += ["TEMP_HIGH"]

      imminent = (free_chlorine_ppm < cl_imminent
                  or ph < PH_IMMINENT_LOW
                  or ph > PH_IMMINENT_HIGH)

      compliance_status = "IMMINENT_HAZARD" if imminent \
                          else ("OUT_OF_RANGE" if len(breaches) > 0 else "IN_RANGE")
      out_of_range_parameters = breaches
      # PINNED comparisons: a value exactly equal to a minimum is compliant
      # (free_chlorine_ppm == 1.0 on a POOL is IN_RANGE), a value exactly equal to a
      # maximum is compliant (ph == 7.8 is IN_RANGE), and a value exactly equal to an
      # imminent floor is NOT imminent (free_chlorine_ppm == 0.5 on a POOL is
      # OUT_OF_RANGE with FREE_CHLORINE_LOW, not IMMINENT_HAZARD).
    input_set: "The submitted reading only, evaluated against the limit set selected by the parent facility's water_type."
    constants:
      FREE_CHLORINE_MIN_PPM_POOL: 1.0
      FREE_CHLORINE_MIN_PPM_SPA: 2.0
      FREE_CHLORINE_MAX_PPM: 10.0
      FREE_CHLORINE_IMMINENT_PPM_POOL: 0.5
      FREE_CHLORINE_IMMINENT_PPM_SPA: 1.0
      COMBINED_CHLORAMINE_MAX_PPM: 0.4
      PH_MIN: 7.0
      PH_MAX: 7.8
      PH_IMMINENT_LOW: 6.5
      PH_IMMINENT_HIGH: 8.2
      CYANURIC_ACID_MAX_PPM: 90
      WATER_TEMP_MAX_F_SPA: 104.0
      WATER_TEMP_MAX_F_POOL: 95.0
    precision: "Comparisons on the submitted decimal values; no rounding is applied before comparing."

  - name: vgb_compliance_evaluation
    trigger: "Recomputed on POST /facilities/{id}/compliance-artifacts, on PATCH /facilities/{id}, on POST /_clock/set_current_utc, and whenever facility_operating_posture runs. Writes Facility.vgb_compliance_status."
    algorithm: threshold
    formula: |
      certs = [a for a in ComplianceArtifact
               if a.facility_id == facility.id and a.artifact_type == "DRAIN_CERTIFICATION"]
      if len(certs) == 0:
          vgb_compliance_status = "NONCOMPLIANT"
      else:
          governing = the element of certs with the greatest effective_on,
                      tie-broken by the greatest created_at
          if clock_date > governing.expires_on:
              vgb_compliance_status = "EXPIRED"
          elif facility.drain_count < VGB_SINGLE_DRAIN_MIN_COUNT \
               and governing.sva_system_type == "NONE":
              vgb_compliance_status = "NONCOMPLIANT"
          else:
              vgb_compliance_status = "COMPLIANT"
    input_set: "Every DRAIN_CERTIFICATION ComplianceArtifact of the facility regardless of status, plus the facility's drain_count and the logical-clock date."
    constants:
      VGB_SINGLE_DRAIN_MIN_COUNT: 2
      VGB_COVER_LIFESPAN_DAYS: 1825
      VGB_ENFORCEMENT_START_DATE: "2026-06-01"
    precision: "Date comparisons on YYYY-MM-DD strings; expires_on is the last compliant day (inclusive)."

  - name: facility_operating_posture
    trigger: "Recomputed after every mutation that can affect it: permit transitions, closure order creation/decision, water readings, inspection FINALIZE/VOID, violation correct/verify, staff assignment create/cancel, compliance artifact posting, PATCH /facilities/{id} and POST /_clock/set_current_utc. Writes Facility.operating_posture and Facility.posture_reason."
    algorithm: constraint_propagation
    formula: |
      # First matching clause wins; clause order IS the precedence.
      # Clauses 1-4 yield CLOSED, clauses 5-8 yield RESTRICTED, clause 9 yields OPEN.
      1. exists ClosureOrder c: c.facility_id == f.id and c.status in {"OPEN","REOPEN_REQUESTED"}
             -> ("CLOSED", "CLOSURE_ORDER_OPEN")
      2. count(Permit p: p.facility_id == f.id) == 0
             -> ("CLOSED", "PERMIT_MISSING")
      3. not exists Permit p: p.facility_id == f.id and p.status == "ISSUED"
             -> ("CLOSED", "PERMIT_NOT_ACTIVE")
      4. f.is_seasonal and not (f.season_start_date <= clock_date <= f.season_end_date)
             -> ("CLOSED", "OUT_OF_SEASON")
      5. clock_date >= VGB_ENFORCEMENT_START_DATE and f.vgb_compliance_status != "COMPLIANT"
             -> ("RESTRICTED", "VGB_NONCOMPLIANT")
      6. exists Violation v: v.status == "OPEN"
                             and v.severity in {"CRITICAL","IMMINENT_HEALTH_HAZARD"}
                             and inspection_of(v).workflow_status == "FINALIZED"
                             and inspection_of(v).facility_id == f.id
             -> ("RESTRICTED", "CRITICAL_VIOLATION_OPEN")
      7. exists s in f.required_signage_types such that there is no ComplianceArtifact a
             with a.facility_id == f.id and a.artifact_type == "SIGNAGE"
             and a.signage_type == s and a.status == "ACTIVE"
             -> ("RESTRICTED", "SIGNAGE_INCOMPLETE")
      8. f.lifeguard_required and not exists StaffAssignment sa:
             sa.facility_id == f.id and sa.status == "SCHEDULED"
             and sa.role_type == "LIFEGUARD"
             and sa.shift_start_at <= clock_utc < sa.shift_end_at      # half-open
             -> ("RESTRICTED", "LIFEGUARD_COVERAGE_MISSING")
      9. otherwise -> ("OPEN", "NONE")
    input_set: "All ClosureOrder, Permit, Violation (through their FINALIZED inspections), ComplianceArtifact and StaffAssignment rows of the facility, plus the logical clock."
    constants:
      VGB_ENFORCEMENT_START_DATE: "2026-06-01"
    precision: "Enum output; clause order is normative and no clause may be short-circuited out of order."

  - name: operator_fee_balance
    trigger: "Recomputed after every FeeLedgerEntry posting (plan review submission, permit issuance, reinspection fee, operator payment, permit refund). Writes Operator.fee_balance_cents."
    algorithm: aggregation
    formula: |
      Operator.fee_balance_cents == SUM(e.amount_cents
                                        for e in FeeLedgerEntry
                                        if e.operator_id == operator.id)
      # Signs: PERMIT_FEE, LATE_PENALTY, PLAN_REVIEW_FEE and REINSPECTION_FEE post
      # positive amounts; PAYMENT and REFUND post negative amounts. No entry is ever
      # deleted or mutated after posting.
    input_set: "Every FeeLedgerEntry row of the operator, with no status or time filter — the ledger is append-only, so the whole history is always in scope."
    constants:
      PLAN_REVIEW_FEE_CENTS: 25000
      REINSPECTION_FEE_CENTS: 15000
    precision: "Integer cents."
    invariant: |
      CONSERVED QUANTITY (money): for every operator, at every observable instant,
      Operator.fee_balance_cents == SUM(FeeLedgerEntry.amount_cents WHERE operator_id
      == operator.id). Issuing a permit (forward action) posts +subtotal and, when
      late, +penalty; revoking that permit with refund_eligible = true (compensating
      action) posts a single REFUND of exactly -(PERMIT_FEE + LATE_PENALTY for that
      permit_id), so the balance returns to the pre-issuance value with zero drift.

  - name: facility_open_demerit_points
    trigger: "Recomputed on Inspection FINALIZE, on Inspection VOID, on Violation OPEN -> CORRECTED, and on Violation CORRECTED -> OPEN (verification rejected). Writes Facility.open_demerit_points."
    algorithm: aggregation
    formula: |
      Facility.open_demerit_points == SUM(v.points_assessed
                                          for v in Violation
                                          if inspection_of(v).facility_id == facility.id
                                          and inspection_of(v).workflow_status == "FINALIZED"
                                          and v.status == "OPEN")
    input_set: "Only violations whose parent inspection is currently FINALIZED (not SCHEDULED, IN_PROGRESS, SUBMITTED or VOIDED) and whose own status is exactly OPEN."
    constants:
      SEVERITY_POINTS: { IMMINENT_HEALTH_HAZARD: 25, CRITICAL: 10, NONCRITICAL: 3 }
    precision: "Integer points."
    invariant: |
      CONSERVED QUANTITY (compliance demerit points): correcting a violation
      (forward action, OPEN -> CORRECTED) removes exactly points_assessed from
      Facility.open_demerit_points, and a rejected verification (compensating
      action, CORRECTED -> OPEN) puts exactly the same points_assessed back, so the
      facility's total returns bit-for-bit to its pre-correction value. Likewise
      FINALIZE adds the inspection's whole OPEN-violation sum and VOID of that same
      inspection removes exactly that sum.

validations:

  # ---- 1. authentication -----------------------------------------------------
  - priority: 1
    category: auth
    check: "X-User-Role header present and equal to one of Anonymous, Operator, Inspector, PlanReviewer, HealthAuthorityAdmin; X-User-ID present and non-empty for every role other than Anonymous."
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"

  # ---- 2. authorization ------------------------------------------------------
  - priority: 2
    category: auth
    check: "The acting role appears in the endpoint's declared roles list in the API endpoint table."
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: "all"

  # ---- 3. path existence (left to right) -------------------------------------
  - priority: 3
    category: existence
    check: "Each {id} segment of the request path resolves to a stored row, checked left to right; the first unresolved segment decides the error."
    error_id: "ERR_OPERATOR_NOT_FOUND | ERR_FACILITY_NOT_FOUND | ERR_PERMIT_NOT_FOUND | ERR_PLAN_REVIEW_NOT_FOUND | ERR_INSPECTION_NOT_FOUND | ERR_VIOLATION_NOT_FOUND | ERR_CLOSURE_ORDER_NOT_FOUND | ERR_COMPLAINT_NOT_FOUND | ERR_STAFF_ASSIGNMENT_NOT_FOUND | ERR_LEDGER_ENTRY_NOT_FOUND"
    http_status: 404
    applies_to: "every endpoint with a path parameter"

  # ---- 4. request payload ----------------------------------------------------
  - priority: 4
    category: business_constraint
    check: "Required body fields present; declared types honoured; enum values inside the declared set; numeric fields inside their declared bounds; limit in [1,100] and offset >= 0; unknown action/decision/outcome values rejected. Also covers the conditional field rules: is_seasonal true requires both season dates and is_seasonal false forbids them; complaint_type RWI_ILLNESS requires symptom_onset_date and illness_case_count >= 1 while any other complaint_type forbids both; POST /operators/{id}/payments requires amount_cents >= 1."
    error_id: ERR_VALIDATION
    http_status: 400
    applies_to: "all"

  - priority: 5
    category: business_constraint
    check: "ComplianceArtifact type-conditional fields: artifact_type SIGNAGE requires signage_type and forbids drain_cover_model and sva_system_type; artifact_type DRAIN_CERTIFICATION requires both drain_cover_model and sva_system_type and forbids signage_type."
    error_id: ERR_ARTIFACT_FIELDS_MISMATCH
    http_status: 422
    applies_to: "POST /facilities/{id}/compliance-artifacts"

  # ---- 6. body foreign-key existence -----------------------------------------
  - priority: 6
    category: existence
    check: "Foreign keys supplied in the request body resolve to stored rows, checked in the order facility_id, plan_review_id, prior_inspection_id, linked_inspection_id, verification_reading_id."
    error_id: "ERR_FACILITY_NOT_FOUND | ERR_PLAN_REVIEW_NOT_FOUND | ERR_INSPECTION_NOT_FOUND | ERR_READING_NOT_FOUND"
    http_status: 404
    applies_to: "POST /facilities, POST /plan-reviews, POST /permits, POST /inspections, POST /closure-orders, POST /complaints, POST /complaints/{id}/transition, POST /staff-assignments, POST /closure-orders/{id}/reopen-request"

  # ---- 7. cross-parent consistency -------------------------------------------
  - priority: 7
    category: business_referential
    check: "The referenced plan review belongs to the same facility as the permit application."
    error_id: ERR_PLAN_REVIEW_FACILITY_MISMATCH
    http_status: 409
    applies_to: "POST /permits"

  - priority: 8
    category: business_referential
    check: "The referenced prior inspection belongs to the same facility as the new REINSPECTION and its workflow_status is FINALIZED; the referenced linked inspection belongs to the same facility as the complaint and has inspection_type == COMPLAINT."
    error_id: ERR_PRIOR_INSPECTION_MISMATCH
    http_status: 409
    applies_to: "POST /inspections, POST /complaints/{id}/transition"

  - priority: 9
    category: business_referential
    check: "The verification reading supplied on a reopen request belongs to the closure order's facility."
    error_id: ERR_READING_FACILITY_MISMATCH
    http_status: 409
    applies_to: "POST /closure-orders/{id}/reopen-request"

  # ---- 10. ownership ---------------------------------------------------------
  - priority: 10
    category: auth
    check: "When the acting role is Operator, X-User-ID equals the operator_id that owns the target resource: operator_id on POST /facilities and on the operator path segment, facility.operator_id for facility-scoped writes, and the facility owner behind a permit, plan review, closure order, staff assignment or violation."
    error_id: ERR_NOT_RESOURCE_OWNER
    http_status: 403
    applies_to: "POST /facilities, PATCH /facilities/{id}, POST /operators/{id}/payments, POST /plan-reviews, POST /plan-reviews/{id}/revisions, POST /permits, POST /permits/{id}/transition, POST /facilities/{id}/water-readings, POST /facilities/{id}/compliance-artifacts, POST /staff-assignments, POST /staff-assignments/{id}/cancel, POST /violations/{id}/correct, POST /closure-orders, POST /closure-orders/{id}/reopen-request"

  # ---- 11. optimistic concurrency --------------------------------------------
  - priority: 11
    category: state
    check: "expected_facility_version equals the target Facility's current version."
    error_id: ERR_STALE_FACILITY_VERSION
    http_status: 412
    applies_to: "POST /closure-orders"

  - priority: 12
    category: state
    check: "expected_plan_review_version equals the superseded PlanReview's current version."
    error_id: ERR_STALE_PLAN_REVIEW_VERSION
    http_status: 412
    applies_to: "POST /plan-reviews/{id}/revisions"

  # ---- 13. state preconditions -----------------------------------------------
  - priority: 13
    category: state
    check: "The permit is in a state from which the requested action is declared in the Permit state machine (including the EXPIRE guard clock_date > term_end_date)."
    error_id: ERR_INVALID_PERMIT_STATE
    http_status: 409
    applies_to: "POST /permits/{id}/transition"

  - priority: 14
    category: state
    check: "The plan review is in a state from which the requested action is declared in the PlanReview state machine; revisions require status == CORRECTIONS_REQUIRED."
    error_id: ERR_INVALID_PLAN_REVIEW_STATE
    http_status: 409
    applies_to: "POST /plan-reviews/{id}/transition, POST /plan-reviews/{id}/revisions"

  - priority: 15
    category: state
    check: "The inspection's workflow_status permits the requested workflow action, the acting inspector is the one that created the inspection for START and SUBMIT, and violations may only be appended while workflow_status == IN_PROGRESS."
    error_id: ERR_INVALID_INSPECTION_STATE
    http_status: 409
    applies_to: "POST /inspections/{id}/transition, POST /inspections/{id}/violations"

  - priority: 16
    category: state
    check: "The enforcement action is declared for the current enforcement_status AND the inspection's workflow_status is FINALIZED AND result is in {CONDITIONAL, FAIL} for ISSUE_NOTICE AND no OPEN violation remains for CLEAR."
    error_id: ERR_INVALID_ENFORCEMENT_STATE
    http_status: 409
    applies_to: "POST /inspections/{id}/enforcement"

  - priority: 17
    category: state
    check: "The closure order is in a state from which the requested action is declared: reopen requests need OPEN, APPROVE/DENY need REOPEN_REQUESTED, VOID needs OPEN."
    error_id: ERR_INVALID_CLOSURE_STATE
    http_status: 409
    applies_to: "POST /closure-orders/{id}/reopen-request, POST /closure-orders/{id}/reopen-decision"

  - priority: 18
    category: state
    check: "Violation correction requires status == OPEN and a FINALIZED parent inspection; verification requires status == CORRECTED."
    error_id: ERR_INVALID_VIOLATION_STATE
    http_status: 409
    applies_to: "POST /violations/{id}/correct, POST /violations/{id}/verify"

  - priority: 19
    category: state
    check: "The complaint is in a state from which the requested action is declared in the Complaint state machine, and START_INVESTIGATION requires a non-null linked_inspection_id."
    error_id: ERR_INVALID_COMPLAINT_STATE
    http_status: 409
    applies_to: "POST /complaints/{id}/transition"

  - priority: 20
    category: state
    check: "The staff assignment is still SCHEDULED."
    error_id: ERR_ASSIGNMENT_ALREADY_CANCELLED
    http_status: 409
    applies_to: "POST /staff-assignments/{id}/cancel"

  # ---- 21. segregation of duties ---------------------------------------------
  - priority: 21
    category: auth
    check: "Four-eyes rule: the X-User-ID deciding a reopen must differ from ClosureOrder.ordered_by_user_id (APPROVE and DENY only, not VOID); the X-User-ID issuing a permit must differ from the PlanReview.decided_by_user_id of the plan review the permit relies on."
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /closure-orders/{id}/reopen-decision, POST /permits/{id}/transition action=ISSUE"

  # ---- 22. business safety / compliance --------------------------------------
  - priority: 22
    category: business_safety
    check: "On or after VGB_ENFORCEMENT_START_DATE (2026-06-01), the facility's vgb_compliance_status must be COMPLIANT before a permit may be issued."
    error_id: ERR_VGB_NONCOMPLIANT
    http_status: 409
    applies_to: "POST /permits/{id}/transition action=ISSUE"

  - priority: 23
    category: business_safety
    check: "The facility has no Violation with status == OPEN and severity in {CRITICAL, IMMINENT_HEALTH_HAZARD} attached to a FINALIZED inspection (permit issuance), and none with severity == IMMINENT_HEALTH_HAZARD (permit reinstatement and reopen approval)."
    error_id: ERR_OPEN_CRITICAL_VIOLATIONS
    http_status: 409
    applies_to: "POST /permits/{id}/transition action=ISSUE, action=REINSTATE; POST /closure-orders/{id}/reopen-decision decision=APPROVE"

  - priority: 24
    category: business_safety
    check: "Facility.operating_posture is not CLOSED."
    error_id: ERR_FACILITY_CLOSED
    http_status: 409
    applies_to: "POST /staff-assignments"

  - priority: 25
    category: business_safety
    check: "The verification reading stored on the closure order has compliance_status != IMMINENT_HAZARD."
    error_id: ERR_IMMINENT_HEALTH_HAZARD
    http_status: 409
    applies_to: "POST /closure-orders/{id}/reopen-decision decision=APPROVE"

  - priority: 26
    category: business_safety
    check: "The verification reading stored on the closure order has compliance_status == IN_RANGE."
    error_id: ERR_WATER_NOT_IN_RANGE
    http_status: 409
    applies_to: "POST /closure-orders/{id}/reopen-decision decision=APPROVE"

  - priority: 27
    category: business_safety
    check: "The logical clock has reached ClosureOrder.earliest_reopen_at (clock >= earliest_reopen_at)."
    error_id: ERR_REMEDIATION_INCOMPLETE
    http_status: 409
    applies_to: "POST /closure-orders/{id}/reopen-decision decision=APPROVE"

  - priority: 28
    category: business_safety
    check: "The verification reading was sampled no more than REOPEN_READING_MAX_AGE_MINUTES (60) minutes before the logical clock and not in the future."
    error_id: ERR_VERIFICATION_READING_STALE
    http_status: 409
    applies_to: "POST /closure-orders/{id}/reopen-request"

  # ---- 29. business temporal --------------------------------------------------
  - priority: 29
    category: business_temporal
    check: "Buffered closed-interval conflict: no other Inspection of the same facility with workflow_status in {SCHEDULED, IN_PROGRESS, SUBMITTED, FINALIZED} satisfies new_start <= other_end + INSPECTION_BUFFER_MINUTES AND new_end >= other_start - INSPECTION_BUFFER_MINUTES. Both comparisons are inclusive, so a visit that begins exactly 60 minutes after another ends still conflicts."
    error_id: ERR_INSPECTION_WINDOW_CONFLICT
    http_status: 409
    applies_to: "POST /inspections"

  - priority: 30
    category: business_temporal
    check: "For a ROUTINE inspection at a facility with is_seasonal == true, date(scheduled_start_at) lies inside [season_start_date, season_end_date] inclusive."
    error_id: ERR_OUT_OF_SEASON
    http_status: 409
    applies_to: "POST /inspections"

  - priority: 31
    category: business_temporal
    check: "shift_end_at > shift_start_at and the shift length is at most MAX_SHIFT_MINUTES (720) minutes."
    error_id: ERR_SHIFT_TOO_LONG
    http_status: 422
    applies_to: "POST /staff-assignments"

  - priority: 32
    category: business_temporal
    check: "certification_expires_on >= date(shift_start_at)."
    error_id: ERR_CERTIFICATION_EXPIRED
    http_status: 409
    applies_to: "POST /staff-assignments"

  - priority: 33
    category: business_temporal
    check: "Unbuffered half-open conflict: no other StaffAssignment with the same staff_ref and status == SCHEDULED satisfies new_start < other_end AND other_start < new_end. Touching shifts (new_start == other_end) do not conflict."
    error_id: ERR_STAFF_SHIFT_OVERLAP
    http_status: 409
    applies_to: "POST /staff-assignments"

  - priority: 34
    category: business_temporal
    check: "For permit_type SEASONAL the facility is seasonal and (season_end_date - season_start_date).days + 1 <= SEASONAL_PERMIT_MAX_TERM_DAYS (183)."
    error_id: ERR_SEASON_TERM_TOO_LONG
    http_status: 422
    applies_to: "POST /permits"

  - priority: 35
    category: business_temporal
    check: "No other Permit of the same facility with status in {SUBMITTED, UNDER_REVIEW, ISSUED} has [term_start_date, term_end_date] intersecting the new application's term; both interval ends are inclusive, so terms that merely touch on one day conflict."
    error_id: ERR_PERMIT_TERM_OVERLAP
    http_status: 409
    applies_to: "POST /permits"

  - priority: 36
    category: business_temporal
    check: "term_start_date <= logical-clock date + PERMIT_RENEWAL_WINDOW_DAYS (60) days — an application may not be filed more than 60 days ahead of its term."
    error_id: ERR_RENEWAL_WINDOW_NOT_OPEN
    http_status: 409
    applies_to: "POST /permits"

  # ---- 37. business referential ------------------------------------------------
  - priority: 37
    category: business_referential
    check: "When facility.requires_plan_review is true, the permit's plan_review_id is non-null and that review's status is APPROVED."
    error_id: ERR_PLAN_REVIEW_NOT_APPROVED
    http_status: 409
    applies_to: "POST /permits (plan_review_id required), POST /permits/{id}/transition action=ISSUE (status must be APPROVED)"

  - priority: 38
    category: business_constraint
    check: "A revision may not push revision_round above PLAN_REVIEW_MAX_REVISION_ROUNDS (3), and REQUEST_CORRECTIONS may not be issued on a review already at round 3."
    error_id: ERR_PLAN_REVIEW_ROUNDS_EXHAUSTED
    http_status: 409
    applies_to: "POST /plan-reviews/{id}/revisions, POST /plan-reviews/{id}/transition action=REQUEST_CORRECTIONS"

  - priority: 39
    category: business_constraint
    check: "inspection_type REINSPECTION requires a non-null prior_inspection_id; every other inspection_type requires prior_inspection_id to be null."
    error_id: ERR_INSPECTION_TYPE_REQUIRES_PRIOR
    http_status: 422
    applies_to: "POST /inspections"

  # ---- 40. business fiscal -----------------------------------------------------
  - priority: 40
    category: business_fiscal
    check: "The operator's fee_balance_cents is exactly 0 at the moment of issuance."
    error_id: ERR_OUTSTANDING_FEES
    http_status: 402
    applies_to: "POST /permits/{id}/transition action=ISSUE"

  - priority: 41
    category: business_fiscal
    check: "refund_eligible=true is honoured only while the permit has not already been refunded AND the logical-clock date is on or before term_start_date + PERMIT_REFUND_WINDOW_DAYS (30) days."
    error_id: ERR_REFUND_NOT_ELIGIBLE
    http_status: 409
    applies_to: "POST /permits/{id}/transition action=REVOKE with refund_eligible=true"

endpoints:

  # ---- test-driving clock ----------------------------------------------------
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the server's logical UTC clock. Before the first call the clock reads exactly 2026-05-01T00:00:00Z (the startup default) and never falls back to wall-clock time. Every server-stamped datetime and every date/deadline comparison in the system reads this clock."
    roles: [HealthAuthorityAdmin]
    code: 200
    input: ["to_iso8601"]
    output: "{ current_utc: string }"
    side_effects:
      - "recomputes ComplianceArtifact.status, Facility.vgb_compliance_status, Facility.operating_posture and Facility.posture_reason for every facility on the next read"

  # ---- operators & ledger ----------------------------------------------------
  - method: POST
    path: "/operators"
    description: "Register a permit-holding operator. The returned id is the value the Operator role must send as X-User-ID."
    roles: [Anonymous]
    code: 201
    input: ["legal_name", "contact_email", "phone?"]
    output: Operator
    side_effects: ["fee_balance_cents initialised to 0"]

  - method: GET
    path: "/operators/{id}"
    description: "Read one operator, including the live fee_balance_cents aggregate."
    roles: [Operator, Inspector, HealthAuthorityAdmin]
    code: 200
    input: []
    output: Operator
    side_effects: []

  - method: POST
    path: "/operators/{id}/payments"
    description: "Record a payment from the operator against outstanding health-authority fees."
    roles: [Operator]
    code: 201
    input: ["amount_cents", "reference_note?"]
    output: FeeLedgerEntry
    side_effects:
      - "posts a FeeLedgerEntry with entry_type=PAYMENT, permit_id=null and amount_cents = -amount_cents"
      - "recomputes Operator.fee_balance_cents"

  - method: GET
    path: "/fee-ledger-entries/{id}"
    description: "Read one ledger posting."
    roles: [Operator, HealthAuthorityAdmin]
    code: 200
    input: []
    output: FeeLedgerEntry
    side_effects: []

  - method: GET
    path: "/fee-ledger-entries"
    description: "List ledger postings, newest last, filtered by operator, permit or entry type."
    roles: [Operator, HealthAuthorityAdmin]
    code: 200
    input: ["operator_id?", "permit_id?", "entry_type?", "limit?", "offset?"]
    output: FeeLedgerEntry[]
    side_effects: []

  # ---- facilities -------------------------------------------------------------
  - method: POST
    path: "/facilities"
    description: "Register an aquatic venue and derive its classification-driven fields."
    roles: [Operator]
    code: 201
    input: ["operator_id", "name", "facility_class", "surface_area_sqft", "water_volume_gallons", "max_depth_feet", "drain_count", "features?", "is_seasonal?", "season_start_date?", "season_end_date?", "requires_plan_review?"]
    output: Facility
    side_effects:
      - "computes water_type, max_bather_load, lifeguard_required and required_signage_types"
      - "computes vgb_compliance_status (NONCOMPLIANT with no certification on file)"
      - "computes operating_posture (CLOSED / PERMIT_MISSING for a brand-new venue)"

  - method: GET
    path: "/facilities/{id}"
    description: "Read one facility with every derived field refreshed against the current clock."
    roles: [Operator, Inspector, PlanReviewer, HealthAuthorityAdmin]
    code: 200
    input: []
    output: Facility
    side_effects: []

  - method: GET
    path: "/facilities"
    description: "List facilities, optionally filtered by owning operator, class or current posture."
    roles: [Operator, Inspector, HealthAuthorityAdmin]
    code: 200
    input: ["operator_id?", "facility_class?", "operating_posture?", "limit?", "offset?"]
    output: Facility[]
    side_effects: []

  - method: PATCH
    path: "/facilities/{id}"
    description: "Amend venue attributes; every derived field is recomputed from the new values."
    roles: [Operator]
    code: 200
    input: ["name?", "facility_class?", "surface_area_sqft?", "water_volume_gallons?", "max_depth_feet?", "drain_count?", "features?", "is_seasonal?", "season_start_date?", "season_end_date?", "requires_plan_review?"]
    output: Facility
    side_effects:
      - "recomputes water_type, max_bather_load, lifeguard_required, required_signage_types, vgb_compliance_status, operating_posture and posture_reason"
      - "increments Facility.version by 1"
      - "already-issued permits keep their classification_at_issue snapshot and their assessed_fee_cents"

  # ---- plan review -------------------------------------------------------------
  - method: POST
    path: "/plan-reviews"
    description: "Submit a construction or alteration plan set for review."
    roles: [Operator]
    code: 201
    input: ["facility_id", "project_type", "drawing_reference?"]
    output: PlanReview
    side_effects:
      - "creates the review in SUBMITTED with revision_round 0"
      - "posts a PLAN_REVIEW_FEE ledger entry of +25000 cents and refreshes Operator.fee_balance_cents"

  - method: POST
    path: "/plan-reviews/{id}/revisions"
    description: "File a corrected plan set that supersedes the review named in the path. Guarded by optimistic concurrency on that review's version."
    roles: [Operator]
    code: 201
    input: ["expected_plan_review_version", "drawing_reference?"]
    output: PlanReview
    side_effects:
      - "the superseded review moves to SUPERSEDED and its version increments by 1"
      - "creates a new PlanReview in SUBMITTED with supersedes_plan_review_id set to the path id and revision_round = prior + 1"
      - "posts a PLAN_REVIEW_FEE ledger entry of +25000 cents and refreshes Operator.fee_balance_cents"

  - method: GET
    path: "/plan-reviews/{id}"
    description: "Read one plan review."
    roles: [Operator, PlanReviewer, HealthAuthorityAdmin]
    code: 200
    input: []
    output: PlanReview
    side_effects: []

  - method: GET
    path: "/plan-reviews"
    description: "List plan reviews, optionally filtered by facility, by the review they supersede, or by status."
    roles: [Operator, PlanReviewer, HealthAuthorityAdmin]
    code: 200
    input: ["facility_id?", "supersedes_plan_review_id?", "status?", "limit?", "offset?"]
    output: PlanReview[]
    side_effects: []

  - method: POST
    path: "/plan-reviews/{id}/transition"
    description: "Advance a plan review: START_REVIEW, REQUEST_CORRECTIONS, APPROVE or DISAPPROVE."
    roles: [PlanReviewer]
    code: 200
    input: ["action", "correction_notes?"]
    output: PlanReview
    side_effects:
      - "START_REVIEW records reviewer_user_id"
      - "APPROVE and DISAPPROVE record decided_at and decided_by_user_id"
      - "DISAPPROVE moves every dependent Permit in {DRAFT, SUBMITTED, UNDER_REVIEW} to DENIED"

  # ---- permits -----------------------------------------------------------------
  - method: POST
    path: "/permits"
    description: "File a permit application (annual or seasonal) for a facility."
    roles: [Operator]
    code: 201
    input: ["facility_id", "permit_type", "term_start_date", "plan_review_id?"]
    output: Permit
    side_effects:
      - "computes term_end_date, term_days and is_late_application and freezes them"
      - "creates the permit in DRAFT with assessed_fee_cents 0 and fee_variant null"

  - method: GET
    path: "/permits/{id}"
    description: "Read one permit."
    roles: [Operator, Inspector, HealthAuthorityAdmin]
    code: 200
    input: []
    output: Permit
    side_effects: []

  - method: GET
    path: "/permits"
    description: "List permits, optionally filtered by facility, by the plan review they rely on, by status or by type."
    roles: [Operator, Inspector, HealthAuthorityAdmin]
    code: 200
    input: ["facility_id?", "plan_review_id?", "status?", "permit_type?", "limit?", "offset?"]
    output: Permit[]
    side_effects: []

  - method: POST
    path: "/permits/{id}/transition"
    description: "Drive the permit lifecycle: SUBMIT (Operator), START_REVIEW, ISSUE, DENY, SUSPEND, REINSTATE, REVOKE, EXPIRE (HealthAuthorityAdmin)."
    roles: [Operator, HealthAuthorityAdmin]
    code: 200
    input: ["action", "reason?", "refund_eligible?"]
    output: Permit
    side_effects:
      - "ISSUE assesses the fee, snapshots classification_at_issue, posts PERMIT_FEE (and LATE_PENALTY when late), refreshes Operator.fee_balance_cents and recomputes the facility posture"
      - "SUSPEND, REINSTATE, REVOKE and EXPIRE each recompute Facility.operating_posture, Facility.posture_reason and Facility.active_permit_id and increment Facility.version by 1"
      - "REVOKE with refund_eligible=true posts a REFUND entry equal to the negated sum of this permit's PERMIT_FEE and LATE_PENALTY entries and sets refunded to true"

  # ---- inspections ---------------------------------------------------------------
  - method: POST
    path: "/inspections"
    description: "Schedule a site visit. The buffered closed-window conflict rule applies against the facility's other inspections."
    roles: [Inspector]
    code: 201
    input: ["facility_id", "inspection_type", "scheduled_start_at", "scheduled_end_at", "prior_inspection_id?"]
    output: Inspection
    side_effects: ["inspector_user_id set from X-User-ID; workflow_status SCHEDULED; enforcement_status NONE"]

  - method: GET
    path: "/inspections/{id}"
    description: "Read one inspection with both state axes and the scoring fields."
    roles: [Operator, Inspector, HealthAuthorityAdmin]
    code: 200
    input: []
    output: Inspection
    side_effects: []

  - method: GET
    path: "/inspections"
    description: "List inspections, optionally filtered by facility, by the inspection they re-check, by type or by either state axis."
    roles: [Operator, Inspector, HealthAuthorityAdmin]
    code: 200
    input: ["facility_id?", "prior_inspection_id?", "inspection_type?", "workflow_status?", "enforcement_status?", "limit?", "offset?"]
    output: Inspection[]
    side_effects: []

  - method: POST
    path: "/inspections/{id}/transition"
    description: "Move the workflow axis: START, SUBMIT (Inspector); FINALIZE, VOID (HealthAuthorityAdmin)."
    roles: [Inspector, HealthAuthorityAdmin]
    code: 200
    input: ["action"]
    output: Inspection
    side_effects:
      - "FINALIZE scores the inspection, adds its OPEN violation points to Facility.open_demerit_points, and when result == FAIL auto-issues the enforcement notice and posts a REINSPECTION_FEE of +15000 cents"
      - "the auto-issued notice suspends the facility's ISSUED permit when an OPEN IMMINENT_HEALTH_HAZARD violation is present, which drives the facility posture to CLOSED"
      - "VOID voids every child violation and removes exactly the demerit points FINALIZE added"

  - method: POST
    path: "/inspections/{id}/enforcement"
    description: "Move the enforcement axis independently of the workflow axis: ISSUE_NOTICE, ESCALATE or CLEAR."
    roles: [HealthAuthorityAdmin]
    code: 200
    input: ["action", "note?"]
    output: Inspection
    side_effects:
      - "ISSUE_NOTICE suspends the facility's ISSUED permit when an OPEN IMMINENT_HEALTH_HAZARD violation is present"
      - "ESCALATE opens a PERMIT_ACTION ClosureOrder for the facility and drives the posture to CLOSED"

  - method: POST
    path: "/inspections/{id}/violations"
    description: "Append a finding to an in-progress inspection; the demerit points are frozen at creation."
    roles: [Inspector]
    code: 201
    input: ["code", "severity", "description", "corrected_on_site?"]
    output: Violation
    side_effects: ["points_assessed computed from SEVERITY_POINTS and the corrected-on-site credit"]

  - method: GET
    path: "/inspections/{id}/violations"
    description: "List the findings recorded on one inspection."
    roles: [Operator, Inspector, HealthAuthorityAdmin]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: Violation[]
    side_effects: []

  - method: POST
    path: "/violations/{id}/correct"
    description: "Operator asserts a finding has been corrected; the points leave the facility's open demerit total."
    roles: [Operator]
    code: 200
    input: ["correction_note?"]
    output: Violation
    side_effects: ["Facility.open_demerit_points recomputed; Facility.version incremented by 1"]

  - method: POST
    path: "/violations/{id}/verify"
    description: "Inspector verifies a corrected finding. outcome=VERIFIED closes it; outcome=REJECTED sends it back to OPEN and restores its points."
    roles: [Inspector]
    code: 200
    input: ["outcome"]
    output: Violation
    side_effects: ["REJECTED increments rejection_count and restores points_assessed to Facility.open_demerit_points; Facility.version incremented by 1"]

  # ---- water chemistry -------------------------------------------------------------
  - method: POST
    path: "/facilities/{id}/water-readings"
    description: "Log a water-chemistry reading. A reading classified IMMINENT_HAZARD automatically opens a WATER_CHEMISTRY closure order unless the facility already has an OPEN or REOPEN_REQUESTED order."
    roles: [Operator, Inspector]
    code: 201
    input: ["sampled_at", "source", "free_chlorine_ppm", "combined_chloramine_ppm", "ph", "water_temp_f", "cyanuric_acid_ppm?"]
    output: WaterChemistryReading
    side_effects:
      - "computes compliance_status and out_of_range_parameters"
      - "IMMINENT_HAZARD creates a ClosureOrder(closure_reason=WATER_CHEMISTRY, triggering_reading_id=this reading, ordered_by_user_id='system') and sets triggered_closure_order_id"
      - "that closure drives Facility.operating_posture to CLOSED and cancels the SCHEDULED staff assignments that fall inside the closure window"

  - method: GET
    path: "/facilities/{id}/water-readings"
    description: "List a facility's readings in sampling order."
    roles: [Operator, Inspector, HealthAuthorityAdmin]
    code: 200
    input: ["compliance_status?", "limit?", "offset?"]
    output: WaterChemistryReading[]
    side_effects: []

  # ---- closure / reopen ----------------------------------------------------------
  - method: POST
    path: "/closure-orders"
    description: "Order a venue closed. Guarded by optimistic concurrency on the facility's version."
    roles: [Inspector, HealthAuthorityAdmin, Operator]
    code: 201
    input: ["facility_id", "closure_reason", "expected_facility_version", "note?"]
    output: ClosureOrder
    side_effects:
      - "sets ordered_at, remediation_variant=FIXED_TABLE, required_remediation_minutes from the table and earliest_reopen_at"
      - "recomputes Facility.operating_posture to CLOSED and increments Facility.version by 1"
      - "cancels every SCHEDULED StaffAssignment of the facility whose shift overlaps the closure window, with cancel_reason=FACILITY_CLOSED"

  - method: GET
    path: "/closure-orders/{id}"
    description: "Read one closure order including the currently effective remediation window."
    roles: [Operator, Inspector, HealthAuthorityAdmin]
    code: 200
    input: []
    output: ClosureOrder
    side_effects: []

  - method: GET
    path: "/closure-orders"
    description: "List closure orders, optionally filtered by facility, by the reading that triggered them, or by status."
    roles: [Operator, Inspector, HealthAuthorityAdmin]
    code: 200
    input: ["facility_id?", "triggering_reading_id?", "status?", "limit?", "offset?"]
    output: ClosureOrder[]
    side_effects: []

  - method: POST
    path: "/closure-orders/{id}/reopen-request"
    description: "Operator requests reopening, attaching a fresh verification reading and optionally the hyperchlorination treatment held during remediation."
    roles: [Operator]
    code: 200
    input: ["verification_reading_id", "treatment_free_chlorine_ppm?", "treatment_ph?"]
    output: ClosureOrder
    side_effects:
      - "status OPEN -> REOPEN_REQUESTED; reopen_requested_at and verification_reading_id stored"
      - "recomputes remediation_variant, required_remediation_minutes and earliest_reopen_at (CT_COMPUTED when both treatment fields are supplied for a CT-eligible reason)"
      - "recomputes Facility.operating_posture (still CLOSED) and increments Facility.version by 1"

  - method: POST
    path: "/closure-orders/{id}/reopen-decision"
    description: "Inspector or admin approves or denies a reopen request, or an admin voids an order issued in error. decision is APPROVE, DENY or VOID."
    roles: [Inspector, HealthAuthorityAdmin]
    code: 200
    input: ["decision", "denial_reason?"]
    output: ClosureOrder
    side_effects:
      - "APPROVE moves the order to CLEARED, stamps cleared_at and recomputes the facility posture"
      - "DENY returns the order to OPEN, increments denial_count and stores reopen_denial_reason"
      - "VOID moves an OPEN order to VOIDED and recomputes the facility posture"
      - "every decision increments Facility.version by 1"

  # ---- staffing ------------------------------------------------------------------
  - method: POST
    path: "/staff-assignments"
    description: "Schedule a lifeguard or attendant shift at a venue."
    roles: [Operator]
    code: 201
    input: ["facility_id", "staff_ref", "staff_name", "role_type", "certification_expires_on", "shift_start_at", "shift_end_at"]
    output: StaffAssignment
    side_effects: ["recomputes Facility.operating_posture and increments Facility.version by 1"]

  - method: GET
    path: "/facilities/{id}/staff-assignments"
    description: "List the shifts scheduled at one venue."
    roles: [Operator, Inspector, HealthAuthorityAdmin]
    code: 200
    input: ["status?", "role_type?", "limit?", "offset?"]
    output: StaffAssignment[]
    side_effects: []

  - method: POST
    path: "/staff-assignments/{id}/cancel"
    description: "Cancel a scheduled shift at the operator's request."
    roles: [Operator]
    code: 200
    input: []
    output: StaffAssignment
    side_effects: ["cancel_reason=OPERATOR_REQUEST; recomputes Facility.operating_posture and increments Facility.version by 1"]

  # ---- signage & VGB drain certification -------------------------------------------
  - method: POST
    path: "/facilities/{id}/compliance-artifacts"
    description: "Post a required sign or file a VGB drain-safety certification. A new artifact supersedes the previous one carrying the same (artifact_type, signage_type) key."
    roles: [Operator]
    code: 201
    input: ["artifact_type", "effective_on", "signage_type?", "drain_cover_model?", "sva_system_type?"]
    output: ComplianceArtifact
    side_effects:
      - "computes expires_on and status"
      - "marks the previous artifact with the same key SUPERSEDED"
      - "recomputes Facility.vgb_compliance_status, Facility.operating_posture and Facility.posture_reason and increments Facility.version by 1"

  - method: GET
    path: "/facilities/{id}/compliance-artifacts"
    description: "List a venue's signage postings and drain certifications."
    roles: [Operator, Inspector, HealthAuthorityAdmin]
    code: 200
    input: ["artifact_type?", "status?", "limit?", "offset?"]
    output: ComplianceArtifact[]
    side_effects: []

  # ---- complaints & recreational water illness ---------------------------------------
  - method: POST
    path: "/complaints"
    description: "File a public complaint or recreational-water-illness report. RWI reports are risk-scored at creation and auto-escalate at or above 60 points."
    roles: [Anonymous, Operator, Inspector]
    code: 201
    input: ["facility_id", "complaint_type", "narrative", "reporter_contact?", "symptom_onset_date?", "illness_case_count?", "pathogen_suspected?"]
    output: Complaint
    side_effects:
      - "computes risk_variant, cluster_case_count, risk_score and escalated"
      - "escalated == true opens an RWI_OUTBREAK ClosureOrder for the facility and drives its posture to CLOSED"

  - method: GET
    path: "/complaints/{id}"
    description: "Read one complaint with its risk scoring."
    roles: [Operator, Inspector, HealthAuthorityAdmin]
    code: 200
    input: []
    output: Complaint
    side_effects: []

  - method: GET
    path: "/complaints"
    description: "List complaints, optionally filtered by facility, by the inspection investigating them, by type or by status."
    roles: [Operator, Inspector, HealthAuthorityAdmin]
    code: 200
    input: ["facility_id?", "linked_inspection_id?", "complaint_type?", "status?", "limit?", "offset?"]
    output: Complaint[]
    side_effects: []

  - method: POST
    path: "/complaints/{id}/transition"
    description: "Advance a complaint: TRIAGE, START_INVESTIGATION, SUBSTANTIATE, UNSUBSTANTIATE (Inspector) or CLOSE (HealthAuthorityAdmin)."
    roles: [Inspector, HealthAuthorityAdmin]
    code: 200
    input: ["action", "linked_inspection_id?", "finding?"]
    output: Complaint
    side_effects: ["TRIAGE stores linked_inspection_id; SUBSTANTIATE and UNSUBSTANTIATE store finding"]

errors:

  # --- authentication / authorization ---
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "X-User-Role missing, blank or not a declared role, or X-User-ID missing on a non-Anonymous role."
  - id: ERR_UNAUTHORIZED
    http: 403
    condition: "The acting role is not listed for the endpoint (e.g. an Operator calling POST /inspections, a PlanReviewer calling POST /permits/{id}/transition)."
  - id: ERR_NOT_RESOURCE_OWNER
    http: 403
    condition: "An Operator acts on a facility, permit, plan review, closure order, violation or staff assignment that belongs to a different operator_id."
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 403
    condition: "The user deciding a reopen ordered that closure, or the user issuing a permit decided the plan review it relies on."

  # --- existence ---
  - id: ERR_OPERATOR_NOT_FOUND
    http: 404
    condition: "The operator id in the path does not resolve."
  - id: ERR_FACILITY_NOT_FOUND
    http: 404
    condition: "The facility id in the path or body does not resolve."
  - id: ERR_PERMIT_NOT_FOUND
    http: 404
    condition: "The permit id in the path does not resolve."
  - id: ERR_PLAN_REVIEW_NOT_FOUND
    http: 404
    condition: "The plan review id in the path or in plan_review_id does not resolve."
  - id: ERR_INSPECTION_NOT_FOUND
    http: 404
    condition: "The inspection id in the path, in prior_inspection_id or in linked_inspection_id does not resolve."
  - id: ERR_VIOLATION_NOT_FOUND
    http: 404
    condition: "The violation id in the path does not resolve."
  - id: ERR_CLOSURE_ORDER_NOT_FOUND
    http: 404
    condition: "The closure order id in the path does not resolve."
  - id: ERR_COMPLAINT_NOT_FOUND
    http: 404
    condition: "The complaint id in the path does not resolve."
  - id: ERR_STAFF_ASSIGNMENT_NOT_FOUND
    http: 404
    condition: "The staff assignment id in the path does not resolve."
  - id: ERR_READING_NOT_FOUND
    http: 404
    condition: "verification_reading_id does not resolve to a stored water-chemistry reading."
  - id: ERR_LEDGER_ENTRY_NOT_FOUND
    http: 404
    condition: "The ledger entry id in the path does not resolve."

  # --- payload ---
  - id: ERR_VALIDATION
    http: 400
    condition: "Missing required body field, wrong type, unknown enum member, out-of-bound number, limit outside [1,100], offset < 0, unknown action/decision/outcome, seasonal date fields inconsistent with is_seasonal, RWI complaint missing symptom_onset_date or illness_case_count >= 1, payment amount_cents < 1."
  - id: ERR_ARTIFACT_FIELDS_MISMATCH
    http: 422
    condition: "A compliance artifact carries fields belonging to the other artifact_type, or omits the ones its own artifact_type requires."

  # --- referential consistency ---
  - id: ERR_PLAN_REVIEW_FACILITY_MISMATCH
    http: 409
    condition: "plan_review_id points at a review filed for a different facility than the permit application."
  - id: ERR_PRIOR_INSPECTION_MISMATCH
    http: 409
    condition: "prior_inspection_id points at an inspection of another facility or one that is not FINALIZED; or linked_inspection_id points at an inspection of another facility or with inspection_type != COMPLAINT."
  - id: ERR_READING_FACILITY_MISMATCH
    http: 409
    condition: "The verification reading supplied on a reopen request belongs to a different facility than the closure order."

  # --- optimistic concurrency ---
  - id: ERR_STALE_FACILITY_VERSION
    http: 412
    condition: "expected_facility_version does not equal the facility's current version."
  - id: ERR_STALE_PLAN_REVIEW_VERSION
    http: 412
    condition: "expected_plan_review_version does not equal the superseded plan review's current version."

  # --- state ---
  - id: ERR_INVALID_PERMIT_STATE
    http: 409
    condition: "The requested permit action is not declared from the permit's current status, or EXPIRE was requested before the term ended."
  - id: ERR_INVALID_PLAN_REVIEW_STATE
    http: 409
    condition: "The requested plan review action is not declared from its current status, or a revision was filed against a review not in CORRECTIONS_REQUIRED."
  - id: ERR_INVALID_INSPECTION_STATE
    http: 409
    condition: "The requested workflow action is not declared from the inspection's workflow_status, a violation was appended outside IN_PROGRESS, or a non-owning inspector attempted START or SUBMIT."
  - id: ERR_INVALID_ENFORCEMENT_STATE
    http: 409
    condition: "The enforcement action is not declared from the current enforcement_status, the workflow axis is not FINALIZED, the result is PASS on ISSUE_NOTICE, or an OPEN violation still blocks CLEAR."
  - id: ERR_INVALID_CLOSURE_STATE
    http: 409
    condition: "The closure order is not in the status the requested reopen action or VOID requires."
  - id: ERR_INVALID_VIOLATION_STATE
    http: 409
    condition: "Correction attempted on a violation that is not OPEN or whose inspection is not FINALIZED, or verification attempted on a violation that is not CORRECTED."
  - id: ERR_INVALID_COMPLAINT_STATE
    http: 409
    condition: "The requested complaint action is not declared from its current status, or START_INVESTIGATION was requested with no linked inspection."
  - id: ERR_ASSIGNMENT_ALREADY_CANCELLED
    http: 409
    condition: "Cancel was requested on a staff assignment already in CANCELLED."

  # --- safety / compliance ---
  - id: ERR_VGB_NONCOMPLIANT
    http: 409
    condition: "Permit issuance attempted on or after 2026-06-01 while the facility's vgb_compliance_status is NONCOMPLIANT or EXPIRED."
  - id: ERR_OPEN_CRITICAL_VIOLATIONS
    http: 409
    condition: "Permit issuance, permit reinstatement or reopen approval attempted while the facility still carries qualifying OPEN violations."
  - id: ERR_FACILITY_CLOSED
    http: 409
    condition: "A staff shift was scheduled at a facility whose operating_posture is CLOSED."
  - id: ERR_IMMINENT_HEALTH_HAZARD
    http: 409
    condition: "Reopen approval attempted while the stored verification reading is classified IMMINENT_HAZARD."
  - id: ERR_WATER_NOT_IN_RANGE
    http: 409
    condition: "Reopen approval attempted while the stored verification reading is classified OUT_OF_RANGE."
  - id: ERR_REMEDIATION_INCOMPLETE
    http: 409
    condition: "Reopen approval attempted before the logical clock reaches earliest_reopen_at."
  - id: ERR_VERIFICATION_READING_STALE
    http: 409
    condition: "The verification reading was sampled more than 60 minutes before the logical clock, or after it."

  # --- temporal ---
  - id: ERR_INSPECTION_WINDOW_CONFLICT
    http: 409
    condition: "The requested visit window collides with another non-voided inspection of the same facility once the 60-minute buffer is applied on both sides."
  - id: ERR_OUT_OF_SEASON
    http: 409
    condition: "A ROUTINE inspection was scheduled at a seasonal facility for a date outside its declared season window."
  - id: ERR_SHIFT_TOO_LONG
    http: 422
    condition: "shift_end_at is not after shift_start_at, or the shift exceeds 720 minutes."
  - id: ERR_CERTIFICATION_EXPIRED
    http: 409
    condition: "The assigned individual's certification_expires_on falls before the shift's start date."
  - id: ERR_STAFF_SHIFT_OVERLAP
    http: 409
    condition: "The same staff_ref already holds a SCHEDULED shift whose half-open interval overlaps the requested one."
  - id: ERR_SEASON_TERM_TOO_LONG
    http: 422
    condition: "A SEASONAL permit was requested for a non-seasonal facility or for a season longer than 183 days."
  - id: ERR_PERMIT_TERM_OVERLAP
    http: 409
    condition: "Another SUBMITTED, UNDER_REVIEW or ISSUED permit of the same facility already covers part of the requested term."
  - id: ERR_RENEWAL_WINDOW_NOT_OPEN
    http: 409
    condition: "The application's term starts more than 60 days after the logical-clock date."

  # --- referential business rules ---
  - id: ERR_PLAN_REVIEW_NOT_APPROVED
    http: 409
    condition: "A facility that requires plan review has no plan_review_id on the application, or the referenced review is not APPROVED at issuance."
  - id: ERR_PLAN_REVIEW_ROUNDS_EXHAUSTED
    http: 409
    condition: "A revision or a REQUEST_CORRECTIONS would push the review past 3 revision rounds."
  - id: ERR_INSPECTION_TYPE_REQUIRES_PRIOR
    http: 422
    condition: "A REINSPECTION was scheduled with no prior_inspection_id, or a non-REINSPECTION supplied one."

  # --- fiscal ---
  - id: ERR_OUTSTANDING_FEES
    http: 402
    condition: "Permit issuance attempted while the operator's fee_balance_cents is not 0."
  - id: ERR_REFUND_NOT_ELIGIBLE
    http: 409
    condition: "A refund was requested more than 30 days after the permit term started, or for a permit that has already been refunded."

roles:
  - name: Anonymous
    description: "Unauthenticated member of the public. Registers operator accounts and files complaints or recreational-water-illness reports."
    identity: "opaque"
    exclusive_operations: []
    shared_operations:
      - "POST /operators"
      - "POST /complaints"

  - name: Operator
    description: "The permit holder. Owns facilities, files plan reviews and permit applications, logs water chemistry, posts signage and drain certifications, schedules staff, corrects violations, requests reopening and pays fees."
    identity: "entity_backed:Operator"
    exclusive_operations:
      - "POST /facilities"
      - "PATCH /facilities/{id}"
      - "POST /operators/{id}/payments"
      - "POST /plan-reviews"
      - "POST /plan-reviews/{id}/revisions"
      - "POST /permits"
      - "POST /violations/{id}/correct"
      - "POST /staff-assignments"
      - "POST /staff-assignments/{id}/cancel"
      - "POST /facilities/{id}/compliance-artifacts"
      - "POST /closure-orders/{id}/reopen-request"
    shared_operations:
      - "POST /permits/{id}/transition (SUBMIT only)"
      - "POST /facilities/{id}/water-readings"
      - "POST /closure-orders"
      - "POST /complaints"
      - "every GET on resources of facilities it owns"

  - name: Inspector
    description: "Field health inspector. Schedules and conducts inspections, records violations, verifies corrections, orders closures, decides reopen requests and triages complaints. X-User-ID is the inspector's operator identifier and is compared against ClosureOrder.ordered_by_user_id for the four-eyes rule."
    identity: "opaque"
    exclusive_operations:
      - "POST /inspections"
      - "POST /inspections/{id}/violations"
      - "POST /violations/{id}/verify"
      - "POST /complaints/{id}/transition (TRIAGE, START_INVESTIGATION, SUBSTANTIATE, UNSUBSTANTIATE)"
    shared_operations:
      - "POST /inspections/{id}/transition (START, SUBMIT)"
      - "POST /facilities/{id}/water-readings"
      - "POST /closure-orders"
      - "POST /closure-orders/{id}/reopen-decision (APPROVE, DENY)"
      - "POST /complaints"
      - "every GET"

  - name: PlanReviewer
    description: "Plan-review engineer. The only role that may advance a plan review. Cannot touch permits, inspections or closures; when the same person also holds an admin identifier, the four-eyes rule blocks them from issuing the permit that relies on their own approval."
    identity: "opaque"
    exclusive_operations:
      - "POST /plan-reviews/{id}/transition"
    shared_operations:
      - "GET /plan-reviews, GET /plan-reviews/{id}, GET /facilities/{id}"

  - name: HealthAuthorityAdmin
    description: "Health authority officer. Reviews and issues permits, finalizes and voids inspections, drives the enforcement axis, voids closure orders, closes complaints and controls the logical clock."
    identity: "opaque"
    exclusive_operations:
      - "POST /_clock/set_current_utc"
      - "POST /inspections/{id}/enforcement"
      - "POST /permits/{id}/transition (START_REVIEW, ISSUE, DENY, SUSPEND, REINSTATE, REVOKE, EXPIRE)"
      - "POST /inspections/{id}/transition (FINALIZE, VOID)"
      - "POST /complaints/{id}/transition (CLOSE)"
      - "POST /closure-orders/{id}/reopen-decision (VOID)"
    shared_operations:
      - "POST /closure-orders"
      - "POST /closure-orders/{id}/reopen-decision (APPROVE, DENY)"
      - "every GET"
