      - name: auth_ladder_unauthenticated_then_unauthorized_outrank_the_schema_check
        claim_type: priority_ordering
        grounds:
          - validations[priority=10]
          - validations[priority=15]
          - validations[priority=18]
          - errors[ERR_UNAUTHENTICATED]
          - errors[ERR_UNAUTHORIZED]
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: |
          One malformed enrollment body (service_type omitted) is sent three times with
          descending auth defects, so the ladder 10 -> 15 -> 18 is read off a SINGLE payload:
          an empty X-User-ID yields ERR_UNAUTHENTICATED (401), a role that is not permitted
          on the endpoint yields ERR_UNAUTHORIZED (403), and only the fully authorised call
          is allowed to see the schema failure ERR_INVALID_REQUEST (422).
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z; one ACTIVE carrier, one clean address, one VERIFIED_ELIGIBLE subscriber with a confirmed check."
