scenario: "Anatomic Pathology Laboratory & Specimen Workflow (hospital pathology lab): specimen accessioning & patient/site identification, gross description & block/slide generation, stain & special-study ordering with reflex rules, case assignment to pathologist & subspecialty sign-out, amended report & discrepancy tracking, turnaround by case complexity, tissue retention & slide/block release, second-opinion consultation"
domain_name: "anatomic-pathology-lab"
api_prefix: "/pathology"

complexity_profile:
  primary_archetype: workflow_orchestration
  secondary_archetype: compliance_audit
  complexity_layers: [cascading_side_effects, optimistic_concurrency, rate_threshold_triggers, scheduled_actions]
  entity_topology: hybrid
  state_machine_shape: cyclic
  relationship_patterns: [one_to_many, self_referential, cross_aggregate]
  role_model: segregation_of_duties
  consistency_model: immediate

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# Table 1: Entity-Relationship Table
# =============================================================================
entities:
  - name: Patient
    parent: null
    common_fields: true
    fields:
      - { name: mrn, type: string, source: input, description: "Medical record number; unique across all patients", constraints: "unique; non-empty" }
      - { name: full_name, type: string, source: input, description: "Patient legal full name" }
      - { name: date_of_birth, type: string, source: input, description: "Date of birth, YYYY-MM-DD; used with mrn as the two-identifier safety check at accession" }

  - name: Pathologist
    parent: null
    common_fields: true
    fields:
      - { name: full_name, type: string, source: input, description: "Pathologist full name" }
      - { name: subspecialties, type: array, source: input, description: "Non-empty array of subspecialty enum values the pathologist is credentialed for", constraints: "members of {DERMATOPATH, GI, BREAST, HEME, GU, GYN, NEURO, GENERAL}; non-empty" }
      - { name: active, type: boolean, source: input, description: "Whether the pathologist accepts new assignments", default: true }
      - { name: workload_score, type: number, source: computed, description: "Recomputed on read: sum of COMPLEXITY_WEIGHT over assigned cases in {OPEN, WORKUP, PENDING_SIGNOUT, AMENDING} plus CONSULT_WEIGHT per consultation where this pathologist is consultant and status == ACCEPTED (see calculation pathologist_workload_score)" }
      - { name: discrepancy_rate_simple, type: number, source: computed, description: "Resolved discrepancies attributed to this pathologist in trailing 365 days divided by signed FINAL-class reports in the same window; 0.0 when denominator is 0; 4 decimals round_half_up" }
      - { name: discrepancy_rate_weighted, type: number, source: computed, description: "Severity-weighted variant of discrepancy_rate_simple using SEVERITY_WEIGHT {LEVEL_1:1, LEVEL_2:3, LEVEL_3:5}; same window and denominator; 0.0 when denominator is 0" }
      - { name: last_assigned_at, type: datetime, source: system, description: "Timestamp of the most recent successful assign/reassign that named this pathologist; null when never assigned; selector tie-break input" }

  - name: CoverageWindow
    parent: Pathologist
    common_fields: true
    fields:
      - { name: pathologist_id, type: string, source: input, description: "FK -> Pathologist.id; owner of this schedule window" }
      - { name: window_type, type: enum, source: input, description: "CONSULT_SERVICE (bookable consult duty) or UNAVAILABLE (cannot accept consults or assignments)", constraints: "{CONSULT_SERVICE, UNAVAILABLE}" }
      - { name: start_at, type: datetime, source: input, description: "Window start; must be strictly before end_at" }
      - { name: end_at, type: datetime, source: input, description: "Window end; must be strictly after start_at" }
      - { name: status, type: enum, source: system, description: "ACTIVE on creation; CANCELLED after cancel", default: ACTIVE, constraints: "{ACTIVE, CANCELLED}" }

  - name: Case
    parent: null
    common_fields: true
    fields:
      - { name: patient_id, type: string, source: input, description: "FK -> Patient.id; patient this case belongs to" }
      - { name: subspecialty, type: enum, source: input, description: "Case subspecialty driving assignment eligibility", constraints: "{DERMATOPATH, GI, BREAST, HEME, GU, GYN, NEURO, GENERAL}" }
      - { name: tat_mode, type: enum, source: input, description: "Turnaround deadline variant selector", default: CALENDAR, constraints: "{CALENDAR, BUSINESS_HOURS}" }
      - { name: status, type: enum, source: system, description: "Case lifecycle", default: OPEN, constraints: "{OPEN, WORKUP, PENDING_SIGNOUT, FINAL, AMENDING, CANCELLED}" }
      - { name: complexity_class, type: enum, source: computed, description: "Tiered from complexity_score per calculation case_complexity_classification; SIMPLE at creation", default: SIMPLE, constraints: "{SIMPLE, MODERATE, COMPLEX, HIGH_COMPLEXITY}" }
      - { name: complexity_score, type: number, source: computed, description: "max specimen base weight + 1.0*blocks + 0.5*slides + 2.0*stain orders per calculation case_complexity_classification" }
      - { name: assigned_pathologist_id, type: string, source: system, description: "FK -> Pathologist.id; null until first successful assign; set by explicit id or server selector" }
      - { name: tat_base_time, type: datetime, source: computed, description: "Earliest received_datetime over specimens with status != REJECTED; falls back to case created_at when no such specimen exists" }
      - { name: turnaround_deadline, type: datetime, source: computed, description: "tat_base_time plus TAT_HOURS[complexity_class] under the variant selected by tat_mode (calculation turnaround_deadline)" }
      - { name: finalized_at, type: datetime, source: system, description: "Timestamp of the first transition into FINAL; null until then; never rewritten by amendments" }
      - { name: tat_breached, type: boolean, source: computed, description: "true iff (finalized_at when FINAL/AMENDING else current logical clock) is strictly greater than turnaround_deadline" }
      - { name: breach_minutes, type: integer, source: computed, description: "Whole minutes by which the reference time exceeds turnaround_deadline; 0 when not breached" }
      - { name: current_signed_report_id, type: string, source: computed, description: "id of the unique Report of this case with status SIGNED; null before first sign-out" }
      - { name: amender_pathologist_id, type: string, source: system, description: "FK -> Pathologist.id; the pathologist who opened the current amendment; null unless status == AMENDING" }
      - { name: open_critical_discrepancy_count, type: integer, source: computed, description: "Count of Discrepancy rows for this case with severity LEVEL_3 and status in {OPEN, ACKNOWLEDGED}" }

  - name: Specimen
    parent: Case
    common_fields: true
    fields:
      - { name: case_id, type: string, source: input, description: "FK -> Case.id; owning case (via nested creation path)" }
      - { name: accession_number, type: string, source: system, description: "Server-minted accession number SP<YY>-<6-digit per-year sequence>, e.g. SP26-000001; input values ignored" }
      - { name: specimen_type, type: enum, source: input, description: "Specimen category; drives base complexity weight and retention days", constraints: "{BIOPSY, EXCISION, RESECTION, CYTOLOGY}" }
      - { name: anatomical_site, type: string, source: input, description: "Anatomical site description, free text" }
      - { name: collection_datetime, type: datetime, source: input, description: "When the specimen was collected from the patient" }
      - { name: received_datetime, type: datetime, source: input, description: "When the lab received the specimen; must be >= collection_datetime" }
      - { name: container_count, type: integer, source: input, description: "Number of containers received", constraints: ">= 1" }
      - { name: fixative_type, type: enum, source: input, description: "Fixative used", default: FORMALIN, constraints: "{FORMALIN, SALINE, FROZEN, NONE}" }
      - { name: cold_ischemia_minutes, type: integer, source: computed, description: "Whole minutes from collection_datetime to received_datetime, truncated; gates cold-sensitive stains" }
      - { name: status, type: enum, source: system, description: "Specimen lifecycle", default: ACCESSIONED, constraints: "{ACCESSIONED, GROSSING, PROCESSING, COMPLETE, REJECTED}" }
      - { name: gross_description, type: string, source: system, description: "Recorded by the gross endpoint; null until grossed" }
      - { name: retention_until, type: datetime, source: computed, description: "finalized_at of the parent case plus RETENTION_DAYS[specimen_type]; set when the specimen reaches COMPLETE; null before" }
      - { name: wet_tissue_disposed_at, type: datetime, source: system, description: "Set by dispose-wet-tissue; null while wet tissue is retained" }
      - { name: reject_reason, type: string, source: system, description: "Reason recorded when REJECTED; null otherwise" }

  - name: Block
    parent: Specimen
    common_fields: true
    fields:
      - { name: specimen_id, type: string, source: input, description: "FK -> Specimen.id; parent specimen (via nested creation path)" }
      - { name: block_label, type: string, source: input, description: "Block label; unique within the specimen", constraints: "unique per specimen_id" }
      - { name: status, type: enum, source: system, description: "Block lifecycle", default: CREATED, constraints: "{CREATED, EMBEDDED, DEPLETED}" }
      - { name: tissue_remaining_pct, type: number, source: computed, description: "100.0 minus the sum of per-event rounded consumption_pct of all slide section/recut events; 1 decimal round_half_up per event (calculation block_tissue_accounting)", default: 100.0 }
      - { name: on_loan, type: boolean, source: computed, description: "true iff a ReleaseRequest references this block with status in {SHIPPED, OVERDUE}", default: false }

  - name: Slide
    parent: Block
    common_fields: true
    fields:
      - { name: block_id, type: string, source: input, description: "FK -> Block.id; parent block (via nested creation path)" }
      - { name: slide_label, type: string, source: input, description: "Slide label; unique within the block", constraints: "unique per block_id" }
      - { name: stain_type, type: enum, source: input, description: "Slide stain; H_E for routine sections", default: H_E, constraints: "{H_E}" }
      - { name: status, type: enum, source: system, description: "Slide lifecycle", default: ORDERED, constraints: "{ORDERED, SECTIONED, STAINED, QC_PASSED, QC_FAILED, CANCELLED}" }
      - { name: consumption_pct, type: number, source: system, description: "Tissue percentage consumed by the latest section/recut event, rounded to 1 decimal round_half_up at event time; 0.0 until first sectioned" }
      - { name: qc_failure_reason, type: string, source: system, description: "Reason recorded on the most recent QC fail; null when never failed" }

  - name: StainOrder
    parent: Case
    common_fields: true
    fields:
      - { name: case_id, type: string, source: input, description: "FK -> Case.id; owning case (via nested creation path)" }
      - { name: block_id, type: string, source: input, description: "FK -> Block.id; block the stain runs on; must belong to a specimen of the same case" }
      - { name: stain_type, type: enum, source: input, description: "Special stain or study ordered", constraints: "{HER2_IHC, PD_L1, KI67, PAX5, CD20, MUCIN, GRAM, GMS}" }
      - { name: ordered_by_pathologist_id, type: string, source: system, description: "FK -> Pathologist.id; set from the authenticated caller; null for system-created reflex orders" }
      - { name: reflex_rule_id, type: string, source: system, description: "FK -> ReflexRule.id; set when this order was auto-created by a reflex rule; null for manual orders" }
      - { name: parent_stain_order_id, type: string, source: system, description: "FK -> StainOrder.id; the resulted order that triggered this reflex order; null for manual orders" }
      - { name: status, type: enum, source: system, description: "Stain order lifecycle", default: ORDERED, constraints: "{ORDERED, IN_PROGRESS, RESULTED, CANCELLED}" }
      - { name: result_value, type: enum, source: system, description: "Result entered by the result endpoint; null until RESULTED", constraints: "{POSITIVE, NEGATIVE, EQUIVOCAL}" }
      - { name: resulted_at, type: datetime, source: system, description: "Timestamp of the RESULTED transition; null until then" }

  - name: ReflexRule
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Human-readable rule name" }
      - { name: trigger_stain_type, type: enum, source: input, description: "Stain type whose result arms the rule", constraints: "{HER2_IHC, PD_L1, KI67, PAX5, CD20, MUCIN, GRAM, GMS}" }
      - { name: trigger_result, type: enum, source: input, description: "Result value that fires the rule", constraints: "{POSITIVE, NEGATIVE, EQUIVOCAL}" }
      - { name: followup_stain_type, type: enum, source: input, description: "Stain type auto-ordered when the rule fires; must differ from trigger_stain_type", constraints: "{HER2_IHC, PD_L1, KI67, PAX5, CD20, MUCIN, GRAM, GMS}" }
      - { name: priority, type: integer, source: input, description: "Firing order when multiple rules match one result; lower fires first; ties broken by rule created_at ASC" }
      - { name: active, type: boolean, source: input, description: "Only active rules fire", default: true }

  - name: Report
    parent: Case
    common_fields: true
    fields:
      - { name: case_id, type: string, source: system, description: "FK -> Case.id; owning case (via nested action endpoints)" }
      - { name: report_class, type: enum, source: system, description: "FINAL for the first signed report of a case; AMENDED for reports created by the amend flow", constraints: "{FINAL, AMENDED}" }
      - { name: version_number, type: integer, source: system, description: "1 for the first report of the case; increments by 1 per subsequent report" }
      - { name: supersedes_report_id, type: string, source: system, description: "FK -> Report.id; the SIGNED report this amended draft replaces; null for the first FINAL report" }
      - { name: status, type: enum, source: system, description: "Report lifecycle; exactly one SIGNED report per case with status FINAL", constraints: "{DRAFT, SIGNED, SUPERSEDED, CANCELLED}" }
      - { name: diagnosis_text, type: string, source: input, description: "Diagnostic text supplied at sign-out or amend" }
      - { name: amendment_reason, type: string, source: input, description: "Reason supplied at amend; null for the first FINAL report" }
      - { name: signed_by_pathologist_id, type: string, source: system, description: "FK -> Pathologist.id; signer; set when the report enters SIGNED" }
      - { name: signed_at, type: datetime, source: system, description: "Timestamp of the SIGNED transition; null while DRAFT" }

  - name: Consultation
    parent: Case
    common_fields: true
    fields:
      - { name: case_id, type: string, source: input, description: "FK -> Case.id; case under review (via nested creation path)" }
      - { name: requesting_pathologist_id, type: string, source: system, description: "FK -> Pathologist.id; set from the authenticated caller at creation" }
      - { name: consultant_pathologist_id, type: string, source: input, description: "FK -> Pathologist.id; consultant; must differ from requester and from the case assigned pathologist; subspecialty must match" }
      - { name: subspecialty, type: enum, source: input, description: "Subspecialty expertise requested", constraints: "{DERMATOPATH, GI, BREAST, HEME, GU, GYN, NEURO, GENERAL}" }
      - { name: question_text, type: string, source: input, description: "Clinical question for the consultant" }
      - { name: due_at, type: datetime, source: input, description: "Response deadline; must be strictly in the future at creation and at reroute" }
      - { name: status, type: enum, source: system, description: "Consultation lifecycle", default: REQUESTED, constraints: "{REQUESTED, ACCEPTED, DECLINED, ANSWERED, INCORPORATED, EXPIRED, CANCELLED}" }
      - { name: opinion_text, type: string, source: system, description: "Consultant opinion; set at answer" }
      - { name: concordance, type: enum, source: system, description: "Agreement grade; non-CONCORDANT answers auto-create a Discrepancy", constraints: "{CONCORDANT, MINOR_DISCORDANT, MAJOR_DISCORDANT}" }
      - { name: answered_at, type: datetime, source: system, description: "Timestamp of the ANSWERED transition; null until then" }
      - { name: decline_reason, type: string, source: system, description: "Reason recorded at decline; null otherwise" }
      - { name: reroute_count, type: integer, source: computed, description: "Number of successful reroute transitions on this consultation", default: 0 }

  - name: Discrepancy
    parent: Case
    common_fields: true
    fields:
      - { name: case_id, type: string, source: input, description: "FK -> Case.id; owning case (via nested creation path)" }
      - { name: consultation_id, type: string, source: system, description: "FK -> Consultation.id; set when auto-created by a non-CONCORDANT consultation answer; null for manual entries" }
      - { name: report_id, type: string, source: input, description: "FK -> Report.id; the signed report the discrepancy applies to; optional at manual creation; system-set to the case current signed report for consultation-created rows (null when the case has no signed report)" }
      - { name: source, type: enum, source: system, description: "CONSULTATION when auto-created; INTERNAL_QA for manual entries", constraints: "{CONSULTATION, INTERNAL_QA}" }
      - { name: severity, type: enum, source: input, description: "LEVEL_1 minor, LEVEL_2 major, LEVEL_3 critical; auto-created rows map MINOR_DISCORDANT to LEVEL_1 and MAJOR_DISCORDANT to LEVEL_2", constraints: "{LEVEL_1, LEVEL_2, LEVEL_3}" }
      - { name: description, type: string, source: input, description: "Free-text discrepancy description" }
      - { name: status, type: enum, source: system, description: "Discrepancy lifecycle", default: OPEN, constraints: "{OPEN, ACKNOWLEDGED, RESOLVED}" }
      - { name: attributed_pathologist_id, type: string, source: system, description: "FK -> Pathologist.id; signer of report_id when set, else the case assigned pathologist at creation; denominator/numerator attribution for discrepancy rates" }
      - { name: resolved_at, type: datetime, source: system, description: "Timestamp of the RESOLVED transition; null until then" }
      - { name: resolved_with_amendment, type: boolean, source: system, description: "Value supplied at resolve; mandatory true for LEVEL_2 and LEVEL_3", default: false }

  - name: ReleaseRequest
    parent: null
    common_fields: true
    fields:
      - { name: material_type, type: enum, source: input, description: "BLOCK releases block_id; SLIDE releases slide_id; exactly one of the two id fields must be present", constraints: "{BLOCK, SLIDE}" }
      - { name: block_id, type: string, source: input, description: "FK -> Block.id; required when material_type == BLOCK, forbidden otherwise" }
      - { name: slide_id, type: string, source: input, description: "FK -> Slide.id; required when material_type == SLIDE, forbidden otherwise" }
      - { name: requesting_institution, type: string, source: input, description: "External institution requesting the material" }
      - { name: reason, type: string, source: input, description: "Purpose of the release" }
      - { name: requested_out_at, type: datetime, source: input, description: "Planned loan start; must be strictly before due_back_at" }
      - { name: due_back_at, type: datetime, source: input, description: "Loan return deadline; past this the request becomes OVERDUE" }
      - { name: status, type: enum, source: system, description: "Release lifecycle", default: REQUESTED, constraints: "{REQUESTED, APPROVED, DENIED, SHIPPED, OVERDUE, RETURNED}" }
      - { name: shipped_at, type: datetime, source: system, description: "Set at ship; null until then" }
      - { name: returned_at, type: datetime, source: system, description: "Set at return; null until then" }
      - { name: returned_late, type: boolean, source: computed, description: "true iff returned_at is strictly greater than due_back_at", default: false }
      - { name: deny_reason, type: string, source: system, description: "Reason recorded at deny; null otherwise" }

# =============================================================================
# Table 2: State Machine Table
# =============================================================================
state_machines:
  - entity: Specimen
    initial_state: ACCESSIONED
    terminal_states: [COMPLETE, REJECTED]
    transitions:
      - from: ACCESSIONED
        to: GROSSING
        trigger: "POST /pathology/specimens/{id}/gross"
        actor: PathologyAssistant
        preconditions: ["specimen.status == ACCESSIONED", "parent case.status in {OPEN, WORKUP}"]
        side_effects:
          - "gross_description recorded from payload"
          - "parent Case: OPEN -> WORKUP when this is the case's first grossed specimen (bubble up)"
          - "increments Specimen.version by 1"
      - from: ACCESSIONED
        to: REJECTED
        trigger: "POST /pathology/specimens/{id}/reject"
        actor: Histotech
        preconditions: ["specimen.status == ACCESSIONED", "no Block rows exist for this specimen"]
        side_effects:
          - "reject_reason recorded"
          - "parent Case: when every specimen of the case is REJECTED and case.status == OPEN, case auto-transitions to CANCELLED (conditional bubble up)"
          - "parent Case: tat_base_time and turnaround_deadline recomputed excluding this specimen (calculation turnaround_deadline)"
          - "parent Case: complexity_score recomputed excluding this specimen (calculation case_complexity_classification)"
          - "increments Specimen.version by 1"
      - from: GROSSING
        to: PROCESSING
        trigger: "POST /pathology/specimens/{id}/blocks (first block creation)"
        actor: PathologyAssistant | Histotech
        preconditions: ["specimen.status == GROSSING", "parent case.status == WORKUP"]
        side_effects:
          - "Block created with status CREATED, tissue_remaining_pct 100.0"
          - "parent Case: complexity_score recomputed (calculation case_complexity_classification)"
          - "increments Specimen.version by 1"
      - from: PROCESSING
        to: COMPLETE
        trigger: "system: parent Case transitions to FINAL (sign-out or amend/sign)"
        actor: system
        preconditions: ["parent case.status becomes FINAL"]
        side_effects:
          - "retention_until = case.finalized_at + RETENTION_DAYS[specimen_type]"
          - "increments Specimen.version by 1"
      - from: GROSSING
        to: COMPLETE
        trigger: "system: parent Case transitions to FINAL while specimen still GROSSING"
        actor: system
        preconditions: ["parent case.status becomes FINAL"]
        side_effects:
          - "retention_until = case.finalized_at + RETENTION_DAYS[specimen_type]"
          - "increments Specimen.version by 1"
    note: "dispose-wet-tissue is not a status transition; it stamps wet_tissue_disposed_at on a COMPLETE specimen once now >= retention_until"

  - entity: Case
    initial_state: OPEN
    terminal_states: [CANCELLED]
    transitions:
      - from: OPEN
        to: WORKUP
        trigger: "system: first specimen of the case reaches GROSSING"
        actor: system
        preconditions: ["case.status == OPEN"]
        side_effects: ["increments Case.version by 1"]
      - from: OPEN
        to: CANCELLED
        trigger: "POST /pathology/cases/{id}/cancel OR system: all specimens REJECTED"
        actor: LabAdmin | system
        preconditions: ["case.status == OPEN"]
        side_effects:
          - "all StainOrder rows of the case in {ORDERED, IN_PROGRESS} become CANCELLED (conditional cascade, only non-terminal children)"
          - "all Consultation rows of the case in {REQUESTED, ACCEPTED, ANSWERED} become CANCELLED"
          - "assigned pathologist workload_score recomputed (calculation pathologist_workload_score)"
          - "increments Case.version by 1"
      - from: WORKUP
        to: CANCELLED
        trigger: "POST /pathology/cases/{id}/cancel"
        actor: LabAdmin
        preconditions: ["case.status == WORKUP"]
        side_effects:
          - "all Slide rows of the case in {ORDERED, SECTIONED, STAINED, QC_FAILED} become CANCELLED (conditional cascade)"
          - "all StainOrder rows of the case in {ORDERED, IN_PROGRESS} become CANCELLED"
          - "all Consultation rows of the case in {REQUESTED, ACCEPTED, ANSWERED} become CANCELLED"
          - "assigned pathologist workload_score recomputed"
          - "increments Case.version by 1"
      - from: WORKUP
        to: PENDING_SIGNOUT
        trigger: "POST /pathology/cases/{id}/submit-for-signout"
        actor: Pathologist
        preconditions:
          - "caller pathologist id == case.assigned_pathologist_id"
          - "case.status == WORKUP"
          - "at least one Slide of the case has status QC_PASSED (non-empty readiness set)"
          - "every Slide of the case with status != CANCELLED has status QC_PASSED"
          - "every StainOrder of the case has status in {RESULTED, CANCELLED}"
        side_effects: ["increments Case.version by 1"]
      - from: PENDING_SIGNOUT
        to: WORKUP
        trigger: "system: a Slide of the case enters QC_FAILED, or a new StainOrder is created for the case"
        actor: system
        preconditions: ["case.status == PENDING_SIGNOUT"]
        side_effects: ["increments Case.version by 1"]
      - from: PENDING_SIGNOUT
        to: FINAL
        trigger: "POST /pathology/cases/{id}/sign-out"
        actor: Pathologist
        preconditions:
          - "caller pathologist id == case.assigned_pathologist_id"
          - "case.status == PENDING_SIGNOUT"
          - "case.open_critical_discrepancy_count == 0 (no LEVEL_3 discrepancy with status OPEN or ACKNOWLEDGED)"
          - "no Consultation of the case has status ACCEPTED"
        side_effects:
          - "Report created: report_class FINAL, status SIGNED, version_number 1, diagnosis_text from payload, signed_by_pathologist_id = caller, signed_at = now"
          - "case.finalized_at = now (never rewritten later); current_signed_report_id set to the new report"
          - "tat_breached and breach_minutes computed (calculation tat_breach_evaluation)"
          - "every Specimen of the case in {GROSSING, PROCESSING} becomes COMPLETE with retention_until set (cascade down, hop 1)"
          - "every StainOrder of the case in {ORDERED, IN_PROGRESS} becomes CANCELLED (conditional cascade)"
          - "assigned pathologist workload_score recomputed (case leaves the open set)"
          - "increments Case.version by 1"
      - from: FINAL
        to: AMENDING
        trigger: "POST /pathology/cases/{id}/amend"
        actor: Pathologist
        preconditions:
          - "case.status == FINAL"
          - "when any Discrepancy of the case with severity in {LEVEL_2, LEVEL_3} (any status) has report_id == case.current_signed_report_id, the caller pathologist id must differ from the current signed report's signed_by_pathologist_id (segregation of duties)"
        side_effects:
          - "Report created: report_class AMENDED, status DRAFT, version_number = prior report version_number + 1, supersedes_report_id = case.current_signed_report_id, diagnosis_text and amendment_reason from payload"
          - "case.amender_pathologist_id = caller"
          - "increments Case.version by 1"
      - from: AMENDING
        to: FINAL
        trigger: "POST /pathology/cases/{id}/amend/sign"
        actor: Pathologist
        preconditions: ["case.status == AMENDING", "caller pathologist id == case.amender_pathologist_id"]
        side_effects:
          - "the DRAFT amended Report becomes SIGNED with signed_by_pathologist_id = caller, signed_at = now"
          - "the previously SIGNED report (supersedes_report_id) becomes SUPERSEDED (compensation pairing: exactly one SIGNED report survives)"
          - "case.current_signed_report_id updated to the amended report; amender_pathologist_id cleared"
          - "increments Case.version by 1"
      - from: AMENDING
        to: FINAL
        trigger: "POST /pathology/cases/{id}/amend/cancel"
        actor: Pathologist
        preconditions: ["case.status == AMENDING", "caller pathologist id == case.amender_pathologist_id"]
        side_effects:
          - "the DRAFT amended Report becomes CANCELLED"
          - "the previously SIGNED report remains SIGNED and case.current_signed_report_id is unchanged (full compensation; no drift in the one-SIGNED-report invariant)"
          - "case.amender_pathologist_id cleared"
          - "increments Case.version by 1"

  - entity: Block
    initial_state: CREATED
    terminal_states: [DEPLETED]
    transitions:
      - from: CREATED
        to: EMBEDDED
        trigger: "POST /pathology/blocks/{id}/embed"
        actor: Histotech
        preconditions: ["block.status == CREATED", "parent specimen.status in {GROSSING, PROCESSING}", "owning case.status not in {CANCELLED, FINAL}"]
        side_effects: ["increments Block.version by 1"]
      - from: EMBEDDED
        to: DEPLETED
        trigger: "system: a slide section or recut event leaves tissue_remaining_pct strictly below MIN_RECUTABLE_PCT"
        actor: system
        preconditions: ["tissue_remaining_pct < 5.0 after applying the rounded consumption"]
        side_effects:
          - "owning Case: complexity_score is NOT recomputed (DEPLETED blocks still count); no case mutation"
          - "increments Block.version by 1"

  - entity: Slide
    initial_state: ORDERED
    terminal_states: [QC_PASSED, CANCELLED]
    transitions:
      - from: ORDERED
        to: SECTIONED
        trigger: "POST /pathology/slides/{id}/section"
        actor: Histotech
        preconditions: ["slide.status == ORDERED", "parent block.status == EMBEDDED", "0 < payload.consumption_pct <= block.tissue_remaining_pct", "owning case.status not in {CANCELLED, FINAL}"]
        side_effects:
          - "slide.consumption_pct = round_half_up(payload.consumption_pct, 1 decimal)"
          - "parent Block: tissue_remaining_pct decreased by the rounded consumption (calculation block_tissue_accounting, hop 1); when the result is < 5.0 the block becomes DEPLETED (hop 2)"
          - "increments Slide.version by 1"
      - from: SECTIONED
        to: STAINED
        trigger: "POST /pathology/slides/{id}/stain-complete"
        actor: Histotech
        preconditions: ["slide.status == SECTIONED", "owning case.status not in {CANCELLED, FINAL}"]
        side_effects: ["increments Slide.version by 1"]
      - from: STAINED
        to: QC_PASSED
        trigger: "POST /pathology/slides/{id}/qc-review with result PASS"
        actor: Histotech
        preconditions: ["slide.status == STAINED", "owning case.status not in {CANCELLED, FINAL}"]
        side_effects: ["increments Slide.version by 1"]
      - from: STAINED
        to: QC_FAILED
        trigger: "POST /pathology/slides/{id}/qc-review with result FAIL"
        actor: Histotech
        preconditions: ["slide.status == STAINED", "owning case.status not in {CANCELLED, FINAL}"]
        side_effects:
          - "qc_failure_reason recorded from payload.reason"
          - "owning Case: PENDING_SIGNOUT -> WORKUP pull-back when the case is PENDING_SIGNOUT (cross-entity cascade)"
          - "increments Slide.version by 1"
      - from: QC_FAILED
        to: SECTIONED
        trigger: "POST /pathology/slides/{id}/recut"
        actor: Histotech
        preconditions: ["slide.status == QC_FAILED", "parent block.status == EMBEDDED", "0 < payload.consumption_pct <= block.tissue_remaining_pct", "owning case.status not in {CANCELLED, FINAL}"]
        side_effects:
          - "slide.consumption_pct replaced by round_half_up(payload.consumption_pct, 1 decimal)"
          - "parent Block: tissue_remaining_pct decreased by the rounded consumption (hop 1); when the result is < 5.0 the block becomes DEPLETED (hop 2)"
          - "increments Slide.version by 1"
      - from: ORDERED
        to: CANCELLED
        trigger: "system: owning case cancelled"
        actor: system
        preconditions: ["owning case.status becomes CANCELLED"]
        side_effects: ["increments Slide.version by 1"]
      - from: SECTIONED
        to: CANCELLED
        trigger: "system: owning case cancelled"
        actor: system
        preconditions: ["owning case.status becomes CANCELLED"]
        side_effects: ["increments Slide.version by 1"]
      - from: STAINED
        to: CANCELLED
        trigger: "system: owning case cancelled"
        actor: system
        preconditions: ["owning case.status becomes CANCELLED"]
        side_effects: ["increments Slide.version by 1"]
      - from: QC_FAILED
        to: CANCELLED
        trigger: "system: owning case cancelled"
        actor: system
        preconditions: ["owning case.status becomes CANCELLED"]
        side_effects: ["increments Slide.version by 1"]

  - entity: StainOrder
    initial_state: ORDERED
    terminal_states: [RESULTED, CANCELLED]
    transitions:
      - from: ORDERED
        to: IN_PROGRESS
        trigger: "POST /pathology/stain-orders/{id}/start"
        actor: Histotech
        preconditions: ["stain_order.status == ORDERED", "owning case.status not in {CANCELLED, FINAL}"]
        side_effects: ["increments StainOrder.version by 1"]
      - from: IN_PROGRESS
        to: RESULTED
        trigger: "POST /pathology/stain-orders/{id}/result"
        actor: Histotech
        preconditions: ["stain_order.status == IN_PROGRESS", "owning case.status not in {CANCELLED, FINAL}"]
        side_effects:
          - "result_value and resulted_at recorded"
          - "reflex evaluation (calculation reflex_evaluation, hop 1): each matching ACTIVE rule creates a child StainOrder (status ORDERED, reflex_rule_id and parent_stain_order_id set) unless already fired for this case or the ancestry chain depth reached MAX_REFLEX_CHAIN_DEPTH"
          - "each created child order increments the owning Case stain count, so complexity_score is recomputed (hop 2) and complexity_class may upgrade; on class change turnaround_deadline is recomputed (hop 3) and tat_breached re-evaluated (hop 4)"
          - "increments StainOrder.version by 1"
      - from: ORDERED
        to: CANCELLED
        trigger: "POST /pathology/stain-orders/{id}/cancel OR system on case cancel/sign-out"
        actor: Pathologist | system
        preconditions: ["stain_order.status in {ORDERED, IN_PROGRESS} for manual cancel; owning case becomes CANCELLED or FINAL for system cancel"]
        side_effects:
          - "owning Case: complexity_score recomputed excluding CANCELLED orders; on complexity_class change turnaround_deadline recomputed and tat_breached re-evaluated"
          - "increments StainOrder.version by 1"
      - from: IN_PROGRESS
        to: CANCELLED
        trigger: "POST /pathology/stain-orders/{id}/cancel OR system on case cancel/sign-out"
        actor: Pathologist | system
        preconditions: ["stain_order.status == IN_PROGRESS for manual cancel; owning case becomes CANCELLED or FINAL for system cancel"]
        side_effects:
          - "owning Case: complexity_score recomputed excluding CANCELLED orders; on complexity_class change turnaround_deadline recomputed and tat_breached re-evaluated"
          - "increments StainOrder.version by 1"

  - entity: Report
    initial_state: DRAFT
    terminal_states: [SUPERSEDED, CANCELLED]
    transitions:
      - from: DRAFT
        to: SIGNED
        trigger: "POST /pathology/cases/{id}/amend/sign (amended reports)"
        actor: Pathologist
        preconditions: ["report.status == DRAFT", "owning case.status == AMENDING", "caller == case.amender_pathologist_id"]
        side_effects: ["report.signed_by_pathologist_id and signed_at stamped", "the report named by supersedes_report_id becomes SUPERSEDED", "increments Report.version by 1"]
      - from: DRAFT
        to: CANCELLED
        trigger: "POST /pathology/cases/{id}/amend/cancel"
        actor: Pathologist
        preconditions: ["report.status == DRAFT", "owning case.status == AMENDING", "caller == case.amender_pathologist_id"]
        side_effects: ["increments Report.version by 1"]
      - from: SIGNED
        to: SUPERSEDED
        trigger: "system: the amended report that names this report in supersedes_report_id becomes SIGNED"
        actor: system
        preconditions: ["superseding report enters SIGNED"]
        side_effects: ["increments Report.version by 1"]
    note: "the first FINAL report is created directly in SIGNED status by the sign-out transition; DRAFT is only entered via the amend flow"

  - entity: Consultation
    initial_state: REQUESTED
    terminal_states: [INCORPORATED, CANCELLED]
    transitions:
      - from: REQUESTED
        to: ACCEPTED
        trigger: "POST /pathology/consultations/{id}/accept"
        actor: Pathologist
        preconditions:
          - "consultation.status == REQUESTED"
          - "caller pathologist id == consultation.consultant_pathologist_id"
          - "current logical clock is strictly before due_at (system sweep has not expired it)"
          - "no ACTIVE CoverageWindow of type UNAVAILABLE for the consultant contains the current logical clock under CLOSED-interval containment (start_at <= now <= end_at)"
        side_effects: ["consultant workload_score recomputed (ACCEPTED consults add CONSULT_WEIGHT)", "increments Consultation.version by 1"]
      - from: REQUESTED
        to: DECLINED
        trigger: "POST /pathology/consultations/{id}/decline"
        actor: Pathologist
        preconditions: ["consultation.status == REQUESTED", "caller pathologist id == consultation.consultant_pathologist_id"]
        side_effects: ["decline_reason recorded", "increments Consultation.version by 1"]
      - from: REQUESTED
        to: EXPIRED
        trigger: "system sweep executed by POST /pathology/_clock/set_current_utc when due_at < new clock value"
        actor: system
        preconditions: ["consultation.status == REQUESTED", "due_at < now (strictly; due_at == now is not expired)"]
        side_effects: ["increments Consultation.version by 1"]
      - from: ACCEPTED
        to: ANSWERED
        trigger: "POST /pathology/consultations/{id}/answer"
        actor: Pathologist
        preconditions: ["consultation.status == ACCEPTED", "caller pathologist id == consultation.consultant_pathologist_id"]
        side_effects:
          - "opinion_text, concordance, answered_at recorded"
          - "when concordance == MINOR_DISCORDANT, a Discrepancy is auto-created (severity LEVEL_1, source CONSULTATION, consultation_id set, report_id = case.current_signed_report_id); when MAJOR_DISCORDANT, severity LEVEL_2 (cross-entity cascade)"
          - "consultant workload_score recomputed (consult leaves the ACCEPTED set)"
          - "increments Consultation.version by 1"
      - from: ANSWERED
        to: INCORPORATED
        trigger: "POST /pathology/consultations/{id}/incorporate"
        actor: Pathologist
        preconditions: ["consultation.status == ANSWERED", "caller pathologist id == consultation.requesting_pathologist_id"]
        side_effects: ["increments Consultation.version by 1"]
      - from: DECLINED
        to: REQUESTED
        trigger: "POST /pathology/consultations/{id}/reroute"
        actor: Pathologist
        preconditions: ["consultation.status in {DECLINED, EXPIRED}", "caller pathologist id == consultation.requesting_pathologist_id", "new consultant passes the same creation-time checks (not requester, not case assignee, subspecialty match)", "new due_at strictly in the future"]
        side_effects: ["consultant_pathologist_id and due_at replaced", "reroute_count incremented by 1", "increments Consultation.version by 1"]
      - from: EXPIRED
        to: REQUESTED
        trigger: "POST /pathology/consultations/{id}/reroute"
        actor: Pathologist
        preconditions: ["consultation.status in {DECLINED, EXPIRED}", "caller pathologist id == consultation.requesting_pathologist_id", "new consultant passes creation-time checks", "new due_at strictly in the future"]
        side_effects: ["consultant_pathologist_id and due_at replaced", "reroute_count incremented by 1", "increments Consultation.version by 1"]
      - from: REQUESTED
        to: CANCELLED
        trigger: "system: owning case cancelled"
        actor: system
        preconditions: ["owning case.status becomes CANCELLED"]
        side_effects: ["increments Consultation.version by 1"]
      - from: ACCEPTED
        to: CANCELLED
        trigger: "system: owning case cancelled"
        actor: system
        preconditions: ["owning case.status becomes CANCELLED"]
        side_effects: ["consultant workload_score recomputed", "increments Consultation.version by 1"]
      - from: ANSWERED
        to: CANCELLED
        trigger: "system: owning case cancelled"
        actor: system
        preconditions: ["owning case.status becomes CANCELLED"]
        side_effects: ["increments Consultation.version by 1"]

  - entity: Discrepancy
    initial_state: OPEN
    terminal_states: [RESOLVED]
    transitions:
      - from: OPEN
        to: ACKNOWLEDGED
        trigger: "POST /pathology/discrepancies/{id}/acknowledge"
        actor: Pathologist
        preconditions: ["discrepancy.status == OPEN", "caller pathologist id == owning case.assigned_pathologist_id"]
        side_effects: ["owning Case open_critical_discrepancy_count unchanged by acknowledge (ACKNOWLEDGED LEVEL_3 still blocks sign-out)", "increments Discrepancy.version by 1"]
      - from: OPEN
        to: RESOLVED
        trigger: "POST /pathology/discrepancies/{id}/resolve (LEVEL_1 only)"
        actor: Pathologist | LabAdmin
        preconditions: ["discrepancy.status == OPEN", "discrepancy.severity == LEVEL_1"]
        side_effects: ["resolved_at stamped; resolved_with_amendment recorded (false permitted)", "attributed pathologist rates recomputed on next read (calculation discrepancy_rate)", "increments Discrepancy.version by 1"]
      - from: ACKNOWLEDGED
        to: RESOLVED
        trigger: "POST /pathology/discrepancies/{id}/resolve (any severity)"
        actor: Pathologist | LabAdmin
        preconditions:
          - "discrepancy.status == ACKNOWLEDGED"
          - "for severity in {LEVEL_2, LEVEL_3}: payload.resolved_with_amendment == true AND the owning case has a Report with report_class AMENDED, status SIGNED, and signed_at strictly after discrepancy.created_at"
        side_effects: ["resolved_at stamped; resolved_with_amendment recorded", "attributed pathologist rates recomputed on next read", "increments Discrepancy.version by 1"]

  - entity: ReleaseRequest
    initial_state: REQUESTED
    terminal_states: [DENIED, RETURNED]
    transitions:
      - from: REQUESTED
        to: APPROVED
        trigger: "POST /pathology/release-requests/{id}/approve"
        actor: LabAdmin
        preconditions:
          - "release_request.status == REQUESTED"
          - "safety: the material is not the case's last diagnostic material (a SLIDE that is the only QC_PASSED slide of its case, or a BLOCK that is the only EMBEDDED non-DEPLETED block of its case)"
          - "temporal: no other ReleaseRequest for the same material with status in {REQUESTED, APPROVED, SHIPPED, OVERDUE} whose CLOSED interval [requested_out_at, due_back_at] intersects this request's interval; touching endpoints count as conflict (a DENIED or RETURNED request frees its interval)"
        side_effects: ["increments ReleaseRequest.version by 1"]
      - from: REQUESTED
        to: DENIED
        trigger: "POST /pathology/release-requests/{id}/deny"
        actor: LabAdmin
        preconditions: ["release_request.status == REQUESTED"]
        side_effects: ["deny_reason recorded", "increments ReleaseRequest.version by 1"]
      - from: APPROVED
        to: SHIPPED
        trigger: "POST /pathology/release-requests/{id}/ship"
        actor: Histotech
        preconditions: ["release_request.status == APPROVED"]
        side_effects: ["shipped_at = now", "referenced Block/Slide on_loan recomputed to true", "increments ReleaseRequest.version by 1"]
      - from: SHIPPED
        to: OVERDUE
        trigger: "system sweep executed by POST /pathology/_clock/set_current_utc when due_back_at < new clock value"
        actor: system
        preconditions: ["release_request.status == SHIPPED", "due_back_at < now (strictly; equality is not overdue)"]
        side_effects: ["increments ReleaseRequest.version by 1"]
      - from: SHIPPED
        to: RETURNED
        trigger: "POST /pathology/release-requests/{id}/return"
        actor: Histotech
        preconditions: ["release_request.status in {SHIPPED, OVERDUE}"]
        side_effects: ["returned_at = now; returned_late computed (now strictly greater than due_back_at)", "referenced Block/Slide on_loan recomputed to false (compensation: material availability restored)", "increments ReleaseRequest.version by 1"]
      - from: OVERDUE
        to: RETURNED
        trigger: "POST /pathology/release-requests/{id}/return"
        actor: Histotech
        preconditions: ["release_request.status in {SHIPPED, OVERDUE}"]
        side_effects: ["returned_at = now; returned_late = true", "referenced Block/Slide on_loan recomputed to false", "increments ReleaseRequest.version by 1"]

  - entity: CoverageWindow
    initial_state: ACTIVE
    terminal_states: [CANCELLED]
    transitions:
      - from: ACTIVE
        to: CANCELLED
        trigger: "POST /pathology/coverage-windows/{id}/cancel"
        actor: LabAdmin
        preconditions: ["coverage_window.status == ACTIVE"]
        side_effects: ["increments CoverageWindow.version by 1"]

# =============================================================================
# Concurrency Rules (OCC on parent version only; see skill 1.2.1)
# =============================================================================
concurrency_rules:
  - rule_id: case-reassign-stale-version
    parent_entity: Case
    write_endpoint: "POST /pathology/cases/{id}/reassign"
    occ_field: "expected_case_version"
    description: |
      Reassigning a Case whose version has advanced since the client last read it
      is rejected. The new assignment legitimately supersedes the current one under
      the product spec, so a client holding a stale Case.version would silently
      overwrite an assignment it never observed; the stale expected_case_version
      is rejected with 412 instead.
    error_id: ERR_STALE_CASE_VERSION
    http_status: 412
  - rule_id: reflex-rule-update-stale-version
    parent_entity: ReflexRule
    write_endpoint: "PUT /pathology/reflex-rules/{id}"
    occ_field: "expected_reflex_rule_version"
    description: |
      Updating a ReflexRule whose version has advanced since the client last read
      it is rejected. Edits legitimately overwrite the stored rule definition, so a
      client holding a stale ReflexRule.version would clobber a definition it never
      observed; the stale expected_reflex_rule_version is rejected with 412 instead.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# Table 3: Calculation Rules Table
# =============================================================================
calculations:
  - name: cold_ischemia_minutes
    trigger: "specimen accession (POST /pathology/cases/{id}/specimens)"
    algorithm: chronological
    formula: |
      cold_ischemia_minutes = floor((received_datetime - collection_datetime) in whole minutes)
      Both timestamps are second-precision; truncate toward zero.
    input_set: "the single Specimen being created"
    constants: {}
    precision: "integer minutes, truncate toward zero"

  - name: turnaround_deadline
    trigger: "case creation; specimen accession or rejection (tat_base_time changes); complexity_class change"
    algorithm: forward_looking
    formula: |
      base = tat_base_time = min(received_datetime over Specimen of the case with status != REJECTED)
             or case.created_at when no non-REJECTED specimen exists.
      hours = TAT_HOURS[complexity_class]
      CALENDAR variant:       deadline = base + hours (clock hours)
      BUSINESS_HOURS variant: advance base into the business window first
        (before 08:00 -> same day 08:00; at/after 17:00 or Sat/Sun -> next business day 08:00),
        then consume `hours` of business time, Mon-Fri 08:00-17:00 UTC only (9 h/day).
    input_set: "the Case, its specimens with status != REJECTED, and its current complexity_class"
    constants:
      TAT_SIMPLE_HOURS: 48
      TAT_MODERATE_HOURS: 72
      TAT_COMPLEX_HOURS: 120
      TAT_HIGH_COMPLEXITY_HOURS: 168
      BUSINESS_DAY_START: "08:00"
      BUSINESS_DAY_END: "17:00"
      BUSINESS_DAYS: "Mon-Fri (UTC)"
    precision: "second-precision datetime; no rounding"
    variants:
      - name: CALENDAR
        when: "case.tat_mode == CALENDAR (the default)"
        difference: "plain clock hours; weekends and nights count"
      - name: BUSINESS_HOURS
        when: "case.tat_mode == BUSINESS_HOURS"
        difference: "only Mon-Fri 08:00-17:00 UTC count; identical inputs yield a later deadline than CALENDAR whenever any weekend/off-hours time intervenes"

  - name: case_complexity_classification
    trigger: "block created; slide created or cancelled; stain order created or cancelled (including reflex-created orders)"
    algorithm: threshold
    formula: |
      base = max(SPECIMEN_BASE_WEIGHT[specimen_type] over specimens of the case with status != REJECTED)
             or 0 when no non-REJECTED specimen exists.
      blocks = count of Block rows whose specimen belongs to the case (any block status, including DEPLETED).
      slides = count of Slide rows whose block belongs to the case with slide.status != CANCELLED.
      stains = count of StainOrder rows of the case with status in {ORDERED, IN_PROGRESS, RESULTED}.
      score = base + 1.0*blocks + 0.5*slides + 2.0*stains
      complexity_class = SIMPLE           when score < 4.0
                         MODERATE         when 4.0 <= score < 10.0
                         COMPLEX          when 10.0 <= score < 20.0
                         HIGH_COMPLEXITY  when score >= 20.0
      On any change of complexity_class, recompute turnaround_deadline and re-evaluate tat_breached.
    input_set: "one Case with its specimens (status != REJECTED), blocks, non-CANCELLED slides, and non-CANCELLED stain orders"
    constants:
      SPECIMEN_BASE_WEIGHT_BIOPSY: 1
      SPECIMEN_BASE_WEIGHT_EXCISION: 2
      SPECIMEN_BASE_WEIGHT_RESECTION: 3
      SPECIMEN_BASE_WEIGHT_CYTOLOGY: 0
      BLOCK_WEIGHT: 1.0
      SLIDE_WEIGHT: 0.5
      STAIN_WEIGHT: 2.0
      TIER_SIMPLE_MAX_EXCLUSIVE: 4.0
      TIER_MODERATE_MAX_EXCLUSIVE: 10.0
      TIER_COMPLEX_MAX_EXCLUSIVE: 20.0
    precision: "score carried at 1 decimal; tier boundaries are inclusive lower / exclusive upper"

  - name: pathologist_workload_score
    trigger: "case assign/reassign; case transitions out of {OPEN, WORKUP, PENDING_SIGNOUT, AMENDING} (FINAL via sign-out, CANCELLED); consultation transitions into or out of ACCEPTED (accept, answer, reroute source, cancel)"
    algorithm: weighted_scoring
    formula: |
      case_load = sum(COMPLEXITY_WEIGHT[c.complexity_class] over Case c
                      where c.assigned_pathologist_id == pathologist.id
                      and c.status in {OPEN, WORKUP, PENDING_SIGNOUT, AMENDING})
      consult_load = CONSULT_WEIGHT * count(Consultation q
                      where q.consultant_pathologist_id == pathologist.id and q.status == ACCEPTED)
      workload_score = case_load + consult_load
    input_set: "one Pathologist with their non-terminal assigned cases and ACCEPTED consultations"
    constants:
      COMPLEXITY_WEIGHT_SIMPLE: 1
      COMPLEXITY_WEIGHT_MODERATE: 2
      COMPLEXITY_WEIGHT_COMPLEX: 3
      COMPLEXITY_WEIGHT_HIGH_COMPLEXITY: 5
      CONSULT_WEIGHT: 2
    precision: "1 decimal; weights are integers so no rounding occurs"

  - name: block_tissue_accounting
    trigger: "slide section (ORDERED -> SECTIONED) and slide recut (QC_FAILED -> SECTIONED)"
    algorithm: aggregation
    formula: |
      At each consumption event: rounded = round_half_up(payload.consumption_pct, 1 decimal).
      block.tissue_remaining_pct = round_half_up(100.0 - sum(rounded over every section/recut event
        ever applied to this block, including events on slides later CANCELLED), 1 decimal).
      Rounding order is pinned: round EACH EVENT first, then sum. Summing raw values and rounding
      once is a different (forbidden) algorithm: events 3.33 + 3.33 + 3.34 give 90.1 under the
      pinned order but 90.0 under sum-then-round.
      When tissue_remaining_pct < MIN_RECUTABLE_PCT the block transitions EMBEDDED -> DEPLETED.
      A consumption event that would push tissue_remaining_pct below 0.0 is rejected outright
      (ERR_INSUFFICIENT_TISSUE) and no mutation is applied.
    input_set: "one Block and the full ordered history of its slide section/recut events"
    constants:
      MIN_RECUTABLE_PCT: 5.0
      EVENT_ROUND_DECIMALS: 1
    precision: "1 decimal place, round_half_up, applied per event before summation"

  - name: discrepancy_rate
    trigger: "computed on read of Pathologist; underlying data changes on discrepancy resolve and on report sign"
    algorithm: aggregation
    formula: |
      window = [now - 365 days, now], both bounds inclusive, using the logical clock.
      denominator = count of Report rows with report_class == FINAL, signed_by_pathologist_id == pathologist.id,
                    and signed_at inside window (any report status; a superseded FINAL report still counts).
      numerator_set = Discrepancy rows with attributed_pathologist_id == pathologist.id,
                      status == RESOLVED, resolved_at inside window.
      simple   = count(numerator_set) / denominator
      weighted = sum(SEVERITY_WEIGHT[severity] over numerator_set) / denominator
      When denominator == 0 both rates are exactly 0.0.
    input_set: "one Pathologist, their signed FINAL-class reports and resolved attributed discrepancies inside the trailing 365-day inclusive window"
    constants:
      SEVERITY_WEIGHT_LEVEL_1: 1
      SEVERITY_WEIGHT_LEVEL_2: 3
      SEVERITY_WEIGHT_LEVEL_3: 5
      WINDOW_DAYS: 365
    precision: "4 decimal places, round_half_up"
    variants:
      - name: simple
        when: "field discrepancy_rate_simple"
        difference: "unweighted count ratio; a LEVEL_1 and a LEVEL_3 contribute identically"
      - name: severity_weighted
        when: "field discrepancy_rate_weighted"
        difference: "weights LEVEL_2 x3 and LEVEL_3 x5, so identical data yields a strictly larger rate whenever any LEVEL_2+ discrepancy exists"

  - name: tat_breach_evaluation
    trigger: "sign-out (finalization); complexity_class change (deadline moves); logical-clock set (open cases re-evaluated on read)"
    algorithm: threshold
    formula: |
      reference_time = case.finalized_at when case.status in {FINAL, AMENDING} else current logical clock
      tat_breached = (reference_time > turnaround_deadline)   # strictly greater; equality is NOT a breach
      breach_minutes = max(0, floor((reference_time - turnaround_deadline) in whole minutes))
    input_set: "one Case with its turnaround_deadline and finalized_at"
    constants: {}
    precision: "integer minutes, truncate toward zero"

  - name: reflex_evaluation
    trigger: "a StainOrder transitions IN_PROGRESS -> RESULTED"
    algorithm: constraint_propagation
    formula: |
      candidates = ACTIVE ReflexRule rows where trigger_stain_type == resulted order's stain_type
                   and trigger_result == resulted order's result_value.
      Fire order: priority ASC, ties broken by rule created_at ASC (never by id).
      For each candidate, in fire order:
        skip when any StainOrder of the same case already has reflex_rule_id == rule.id (fires at most once per case per rule);
        skip when the resulted order's ancestry depth via parent_stain_order_id >= MAX_REFLEX_CHAIN_DEPTH
          (manual root is depth 0, so reflex children exist at depths 1..3 and a depth-3 order spawns nothing);
        otherwise create a child StainOrder (status ORDERED, stain_type = rule.followup_stain_type,
          block_id = resulted order's block_id, reflex_rule_id = rule.id, parent_stain_order_id = resulted order's id,
          ordered_by_pathologist_id = null).
      Each created child then drives the case complexity cascade (see case_complexity_classification).
      Child orders are validated like manual ones EXCEPT the cold-ischemia gate, which is not re-applied
      to reflex orders.
    input_set: "the resulted StainOrder, all ACTIVE ReflexRule rows, and the case's existing StainOrder rows"
    constants:
      MAX_REFLEX_CHAIN_DEPTH: 3
    precision: "not numeric"

# =============================================================================
# Table 4: Validation Rules Table (ordered by priority; lower number wins when
# a single request violates several rules)
# =============================================================================
validations:
  - { priority: 1, category: auth, check: "X-User-Role and X-User-ID headers present; role is a declared role", error_id: ERR_UNAUTHENTICATED, http_status: 401, applies_to: "all" }
  - { priority: 2, category: auth, check: "caller role is in the endpoint's role list; for Pathologist-owned actions (submit-for-signout, sign-out, acknowledge) X-User-ID equals the case assigned_pathologist_id; for consultation accept/decline/answer it equals consultant_pathologist_id; for incorporate/reroute it equals requesting_pathologist_id; for amend/sign and amend/cancel it equals amender_pathologist_id", error_id: ERR_FORBIDDEN, http_status: 403, applies_to: "all" }
  - { priority: 3, category: business_constraint, check: "request shape: all required fields present; enum members valid; numeric ranges respected (container_count >= 1, consumption_pct > 0); for coverage windows and release requests end/start ordering holds (end_at strictly after start_at; due_back_at strictly after requested_out_at); reflex rule followup_stain_type differs from trigger_stain_type; release request carries exactly the id field matching material_type", error_id: ERR_INVALID_REQUEST, http_status: 400, applies_to: "all write endpoints" }
  - { priority: 4, category: existence, check: "path-template ids resolve left to right, then body-referenced ids (patient_id, block_id, slide_id, consultant_pathologist_id, explicit pathologist_id, report_id)", error_id: ERR_NOT_FOUND, http_status: 404, applies_to: "all" }
  - { priority: 5, category: state, check: "owning case not in {CANCELLED, FINAL} for child mutations under it (specimen gross/reject, block create/embed, slide create/section/stain-complete/qc-review/recut, stain start/result)", error_id: ERR_CASE_TERMINAL, http_status: 409, applies_to: "child-mutation endpoints under a case" }
  - { priority: 6, category: state, check: "specimen gross and reject require specimen.status == ACCESSIONED", error_id: ERR_SPECIMEN_NOT_ACCESSIONED, http_status: 409, applies_to: "POST /pathology/specimens/{id}/gross, POST /pathology/specimens/{id}/reject" }
  - { priority: 7, category: state, check: "block creation requires specimen.status in {GROSSING, PROCESSING}", error_id: ERR_GROSS_NOT_RECORDED, http_status: 409, applies_to: "POST /pathology/specimens/{id}/blocks" }
  - { priority: 8, category: state, check: "embed requires block.status == CREATED", error_id: ERR_BLOCK_NOT_CREATED, http_status: 409, applies_to: "POST /pathology/blocks/{id}/embed" }
  - { priority: 9, category: state, check: "slide creation and section/recut target a block with status == EMBEDDED; DEPLETED is reported by the dedicated code at priority 10", error_id: ERR_BLOCK_NOT_EMBEDDED, http_status: 409, applies_to: "POST /pathology/blocks/{id}/slides, POST /pathology/slides/{id}/section, POST /pathology/slides/{id}/recut" }
  - { priority: 10, category: state, check: "block.status == DEPLETED blocks any new slide order, section, or recut on it", error_id: ERR_BLOCK_DEPLETED, http_status: 409, applies_to: "POST /pathology/blocks/{id}/slides, POST /pathology/slides/{id}/section, POST /pathology/slides/{id}/recut" }
  - { priority: 11, category: state, check: "section requires slide.status == ORDERED; stain-complete requires SECTIONED; qc-review requires STAINED; recut requires QC_FAILED", error_id: ERR_SLIDE_WRONG_STATE, http_status: 409, applies_to: "POST /pathology/slides/{id}/section, /stain-complete, /qc-review, /recut" }
  - { priority: 12, category: state, check: "assign requires case.status in {OPEN, WORKUP}", error_id: ERR_CASE_NOT_ASSIGNABLE, http_status: 409, applies_to: "POST /pathology/cases/{id}/assign" }
  - { priority: 13, category: state, check: "reassign requires case.status in {WORKUP, PENDING_SIGNOUT}", error_id: ERR_CASE_NOT_REASSIGNABLE, http_status: 409, applies_to: "POST /pathology/cases/{id}/reassign" }
  - { priority: 14, category: state, check: "cancel requires case.status in {OPEN, WORKUP}", error_id: ERR_CASE_NOT_CANCELLABLE, http_status: 409, applies_to: "POST /pathology/cases/{id}/cancel" }
  - { priority: 15, category: state, check: "submit-for-signout requires case.status == WORKUP", error_id: ERR_CASE_NOT_IN_WORKUP, http_status: 409, applies_to: "POST /pathology/cases/{id}/submit-for-signout" }
  - { priority: 16, category: state, check: "sign-out requires case.status == PENDING_SIGNOUT", error_id: ERR_CASE_NOT_PENDING_SIGNOUT, http_status: 409, applies_to: "POST /pathology/cases/{id}/sign-out" }
  - { priority: 17, category: state, check: "amend requires case.status == FINAL; release-request creation requires the material's case status == FINAL", error_id: ERR_CASE_NOT_FINAL, http_status: 409, applies_to: "POST /pathology/cases/{id}/amend, POST /pathology/release-requests" }
  - { priority: 18, category: state, check: "amend/sign and amend/cancel require case.status == AMENDING", error_id: ERR_CASE_NOT_AMENDING, http_status: 409, applies_to: "POST /pathology/cases/{id}/amend/sign, POST /pathology/cases/{id}/amend/cancel" }
  - { priority: 19, category: state, check: "stain-order creation requires case.status in {WORKUP, PENDING_SIGNOUT, AMENDING}", error_id: ERR_CASE_NOT_ORDERABLE, http_status: 409, applies_to: "POST /pathology/cases/{id}/stain-orders" }
  - { priority: 20, category: state, check: "stain start requires ORDERED; result requires IN_PROGRESS; manual cancel requires ORDERED or IN_PROGRESS", error_id: ERR_STAIN_WRONG_STATE, http_status: 409, applies_to: "POST /pathology/stain-orders/{id}/start, /result, /cancel" }
  - { priority: 21, category: state, check: "consultation creation requires case.status in {WORKUP, PENDING_SIGNOUT, FINAL, AMENDING}", error_id: ERR_CASE_NOT_CONSULTABLE, http_status: 409, applies_to: "POST /pathology/cases/{id}/consultations" }
  - { priority: 22, category: state, check: "accept and decline require consultation.status == REQUESTED; answer requires ACCEPTED; incorporate requires ANSWERED; reroute requires DECLINED or EXPIRED", error_id: ERR_CONSULTATION_WRONG_STATE, http_status: 409, applies_to: "POST /pathology/consultations/{id}/accept, /decline, /answer, /incorporate, /reroute" }
  - { priority: 23, category: state, check: "discrepancy acknowledge requires status == OPEN; resolve requires OPEN (LEVEL_1 only) or ACKNOWLEDGED (any severity)", error_id: ERR_DISCREPANCY_WRONG_STATE, http_status: 409, applies_to: "POST /pathology/discrepancies/{id}/acknowledge, /resolve" }
  - { priority: 24, category: state, check: "release approve/deny require status == REQUESTED; ship requires APPROVED; return requires SHIPPED or OVERDUE", error_id: ERR_RELEASE_WRONG_STATE, http_status: 409, applies_to: "POST /pathology/release-requests/{id}/approve, /deny, /ship, /return" }
  - { priority: 25, category: state, check: "release-request material itself must be releasable: BLOCK requires status == EMBEDDED; SLIDE requires status == QC_PASSED", error_id: ERR_MATERIAL_NOT_RELEASABLE, http_status: 409, applies_to: "POST /pathology/release-requests" }
  - { priority: 26, category: state, check: "wet-tissue disposal requires specimen.status == COMPLETE and wet_tissue_disposed_at null", error_id: ERR_SPECIMEN_NOT_COMPLETE, http_status: 409, applies_to: "POST /pathology/specimens/{id}/dispose-wet-tissue" }
  - { priority: 27, category: state, check: "coverage-window cancel requires status == ACTIVE", error_id: ERR_COVERAGE_WINDOW_NOT_ACTIVE, http_status: 409, applies_to: "POST /pathology/coverage-windows/{id}/cancel" }
  - { priority: 28, category: state, check: "OCC: expected_case_version equals the case's current version (reassign); expected_reflex_rule_version equals the rule's current version (PUT reflex-rules)", error_id: ERR_STALE_CASE_VERSION, http_status: 412, applies_to: "POST /pathology/cases/{id}/reassign" }
  - { priority: 29, category: state, check: "OCC: expected_reflex_rule_version equals the rule's current version", error_id: ERR_STALE_VERSION, http_status: 412, applies_to: "PUT /pathology/reflex-rules/{id}" }
  - { priority: 30, category: business_safety, check: "accession two-identifier rule: payload patient_mrn AND patient_dob must exactly match the parent case's Patient.mrn and Patient.date_of_birth", error_id: ERR_PATIENT_IDENTIFIER_MISMATCH, http_status: 422, applies_to: "POST /pathology/cases/{id}/specimens" }
  - { priority: 31, category: business_safety, check: "cold-sensitive stains HER2_IHC (limit 60 min) and PD_L1 (limit 90 min) require the target block's specimen cold_ischemia_minutes <= the stain's limit; not applied to reflex-created orders", error_id: ERR_COLD_ISCHEMIA_EXCEEDED, http_status: 422, applies_to: "POST /pathology/cases/{id}/stain-orders" }
  - { priority: 32, category: business_safety, check: "sign-out requires open_critical_discrepancy_count == 0", error_id: ERR_UNRESOLVED_CRITICAL_DISCREPANCY, http_status: 422, applies_to: "POST /pathology/cases/{id}/sign-out" }
  - { priority: 33, category: business_safety, check: "sign-out requires that no consultation of the case has status ACCEPTED", error_id: ERR_ACCEPTED_CONSULTATION_OPEN, http_status: 409, applies_to: "POST /pathology/cases/{id}/sign-out" }
  - { priority: 34, category: business_safety, check: "consultation consultant must differ from the requester (ERR_SELF_CONSULTATION) and from the case assigned pathologist (ERR_CONSULTANT_IS_ASSIGNED); same checks re-applied on reroute", error_id: ERR_SELF_CONSULTATION, http_status: 422, applies_to: "POST /pathology/cases/{id}/consultations, POST /pathology/consultations/{id}/reroute" }
  - { priority: 35, category: business_safety, check: "consultation consultant equals the case assigned pathologist", error_id: ERR_CONSULTANT_IS_ASSIGNED, http_status: 422, applies_to: "POST /pathology/cases/{id}/consultations, POST /pathology/consultations/{id}/reroute" }
  - { priority: 36, category: business_safety, check: "segregation of duties on amend: when any discrepancy of severity LEVEL_2 or LEVEL_3 (any status) references case.current_signed_report_id, the caller must differ from that report's signed_by_pathologist_id", error_id: ERR_SOD_AMENDMENT_FORBIDDEN, http_status: 422, applies_to: "POST /pathology/cases/{id}/amend" }
  - { priority: 37, category: business_safety, check: "release approve refuses the case's last diagnostic material: a SLIDE that is the only QC_PASSED slide of its case, or a BLOCK that is the only EMBEDDED non-DEPLETED block of its case", error_id: ERR_LAST_DIAGNOSTIC_MATERIAL, http_status: 422, applies_to: "POST /pathology/release-requests/{id}/approve" }
  - { priority: 38, category: business_constraint, check: "patient mrn unique", error_id: ERR_DUPLICATE_MRN, http_status: 409, applies_to: "POST /pathology/patients" }
  - { priority: 39, category: business_constraint, check: "block_label unique within its specimen", error_id: ERR_DUPLICATE_BLOCK_LABEL, http_status: 409, applies_to: "POST /pathology/specimens/{id}/blocks" }
  - { priority: 40, category: business_constraint, check: "slide_label unique within its block", error_id: ERR_DUPLICATE_SLIDE_LABEL, http_status: 409, applies_to: "POST /pathology/blocks/{id}/slides" }
  - { priority: 41, category: business_constraint, check: "no two ReflexRule rows with active == true may share (trigger_stain_type, trigger_result, followup_stain_type)", error_id: ERR_DUPLICATE_REFLEX_RULE, http_status: 409, applies_to: "POST /pathology/reflex-rules, PUT /pathology/reflex-rules/{id}" }
  - { priority: 42, category: business_constraint, check: "submit-for-signout aggregate gate: at least one slide of the case has status QC_PASSED; checked after the per-slide readiness gate at priority 43 (they cannot fire together: a non-empty not-ready set hits 43, an empty set hits 42)", error_id: ERR_EMPTY_SLIDE_SET, http_status: 422, applies_to: "POST /pathology/cases/{id}/submit-for-signout" }
  - { priority: 43, category: state, check: "submit-for-signout child readiness: every non-CANCELLED slide of the case has status QC_PASSED and every stain order has status in {RESULTED, CANCELLED}", error_id: ERR_SLIDES_NOT_READY, http_status: 409, applies_to: "POST /pathology/cases/{id}/submit-for-signout" }
  - { priority: 44, category: business_constraint, check: "explicit assignment target must be eligible: active == true, subspecialties contains case.subspecialty, and no ACTIVE UNAVAILABLE coverage window contains now (closed containment); when pathologist_id is omitted the server selector runs over the same eligibility set ordered by workload_score ASC, then last_assigned_at ASC with nulls first, then pathologist created_at ASC", error_id: ERR_PATHOLOGIST_INELIGIBLE, http_status: 422, applies_to: "POST /pathology/cases/{id}/assign, POST /pathology/cases/{id}/reassign" }
  - { priority: 45, category: business_constraint, check: "selector candidate pool is empty (no eligible pathologist at all)", error_id: ERR_NO_ELIGIBLE_PATHOLOGIST, http_status: 422, applies_to: "POST /pathology/cases/{id}/assign, POST /pathology/cases/{id}/reassign" }
  - { priority: 46, category: business_constraint, check: "consultation subspecialty must be a member of the consultant's subspecialties", error_id: ERR_SUBSPECIALTY_MISMATCH, http_status: 422, applies_to: "POST /pathology/cases/{id}/consultations, POST /pathology/consultations/{id}/reroute" }
  - { priority: 47, category: business_referential, check: "stain-order block_id must reference a Block whose specimen's case_id equals the path case id", error_id: ERR_BLOCK_NOT_IN_CASE, http_status: 422, applies_to: "POST /pathology/cases/{id}/stain-orders" }
  - { priority: 48, category: business_referential, check: "specimen reject is refused when any Block rows exist for the specimen", error_id: ERR_BLOCKS_EXIST, http_status: 409, applies_to: "POST /pathology/specimens/{id}/reject" }
  - { priority: 49, category: business_referential, check: "resolving a LEVEL_2 or LEVEL_3 discrepancy requires payload.resolved_with_amendment == true and an AMENDED SIGNED report on the case with signed_at strictly after the discrepancy created_at", error_id: ERR_AMENDMENT_REQUIRED, http_status: 422, applies_to: "POST /pathology/discrepancies/{id}/resolve" }
  - { priority: 50, category: business_temporal, check: "accession requires received_datetime >= collection_datetime", error_id: ERR_COLLECTION_AFTER_RECEIVED, http_status: 422, applies_to: "POST /pathology/cases/{id}/specimens" }
  - { priority: 51, category: business_temporal, check: "consultation due_at must be strictly in the future at creation and at reroute", error_id: ERR_DUE_AT_NOT_FUTURE, http_status: 422, applies_to: "POST /pathology/cases/{id}/consultations, POST /pathology/consultations/{id}/reroute" }
  - { priority: 52, category: business_temporal, check: "consultation accept is refused when the current logical clock falls inside any ACTIVE UNAVAILABLE coverage window of the consultant under CLOSED containment (start_at <= now <= end_at)", error_id: ERR_CONSULTANT_UNAVAILABLE, http_status: 422, applies_to: "POST /pathology/consultations/{id}/accept" }
  - { priority: 53, category: business_temporal, check: "a new ACTIVE CONSULT_SERVICE window must not overlap any other ACTIVE CONSULT_SERVICE window of the same pathologist under HALF-OPEN semantics [start_at, end_at): touching endpoints (end == start) are allowed", error_id: ERR_COVERAGE_WINDOW_OVERLAP, http_status: 409, applies_to: "POST /pathology/pathologists/{id}/coverage-windows" }
  - { priority: 54, category: business_temporal, check: "a new ACTIVE UNAVAILABLE window must keep a buffer of at least 60 minutes from every ACTIVE CONSULT_SERVICE window of the same pathologist: gap between the intervals must be >= 60 minutes", error_id: ERR_UNAVAILABILITY_BUFFER_VIOLATION, http_status: 409, applies_to: "POST /pathology/pathologists/{id}/coverage-windows" }
  - { priority: 55, category: business_temporal, check: "release approve refuses when another ReleaseRequest for the same material with status in {REQUESTED, APPROVED, SHIPPED, OVERDUE} has a CLOSED interval [requested_out_at, due_back_at] intersecting the new one; touching endpoints count as conflict", error_id: ERR_LOAN_INTERVAL_CONFLICT, http_status: 409, applies_to: "POST /pathology/release-requests/{id}/approve" }
  - { priority: 56, category: business_temporal, check: "wet-tissue disposal requires current logical clock >= retention_until (inclusive; equality is eligible)", error_id: ERR_RETENTION_NOT_ELAPSED, http_status: 422, applies_to: "POST /pathology/specimens/{id}/dispose-wet-tissue" }
  - { priority: 57, category: business_fiscal, check: "consumption event must satisfy payload.consumption_pct <= block.tissue_remaining_pct (a consumption that would drive the balance below 0.0 is rejected; the resource budget check is last)", error_id: ERR_INSUFFICIENT_TISSUE, http_status: 422, applies_to: "POST /pathology/slides/{id}/section, POST /pathology/slides/{id}/recut" }

# =============================================================================
# Table 5: API Endpoint Table
# =============================================================================
endpoints:
  # --- Patients ---
  - { method: POST, path: "/pathology/patients", description: "Register a patient", roles: [LabAdmin], code: 201, input: [mrn, full_name, date_of_birth], output: Patient, side_effects: [] }
  - { method: GET, path: "/pathology/patients/{id}", description: "Fetch one patient", roles: [LabAdmin, Histotech, PathologyAssistant, Pathologist], code: 200, input: [], output: Patient, side_effects: [] }

  # --- Pathologists & coverage windows ---
  - { method: POST, path: "/pathology/pathologists", description: "Register a pathologist", roles: [LabAdmin], code: 201, input: [full_name, subspecialties, "active?"], output: Pathologist, side_effects: [] }
  - { method: GET, path: "/pathology/pathologists/{id}", description: "Fetch one pathologist including computed workload_score and discrepancy rates", roles: [LabAdmin, Histotech, PathologyAssistant, Pathologist], code: 200, input: [], output: Pathologist, side_effects: ["workload_score and both discrepancy rates recomputed on read"] }
  - { method: POST, path: "/pathology/pathologists/{id}/coverage-windows", description: "Create a coverage window (CONSULT_SERVICE or UNAVAILABLE) for a pathologist; half-open overlap rule for CONSULT_SERVICE, 60-minute buffer rule for UNAVAILABLE", roles: [LabAdmin], code: 201, input: [window_type, start_at, end_at], output: CoverageWindow, side_effects: [] }
  - { method: GET, path: "/pathology/pathologists/{id}/coverage-windows", description: "List coverage windows of a pathologist", roles: [LabAdmin, Histotech, PathologyAssistant, Pathologist], code: 200, input: ["status?", "limit?", "offset?"], output: "CoverageWindow[]", side_effects: [] }
  - { method: POST, path: "/pathology/coverage-windows/{id}/cancel", description: "Cancel an ACTIVE coverage window", roles: [LabAdmin], code: 200, input: [], output: CoverageWindow, side_effects: ["CoverageWindow ACTIVE -> CANCELLED"] }

  # --- Cases ---
  - { method: POST, path: "/pathology/cases", description: "Open a pathology case for a patient", roles: [LabAdmin, Histotech], code: 201, input: [patient_id, subspecialty, "tat_mode?"], output: Case, side_effects: ["turnaround_deadline initialized from created_at under SIMPLE class (calculation turnaround_deadline)"] }
  - { method: GET, path: "/pathology/cases/{id}", description: "Fetch one case with all computed fields", roles: [LabAdmin, Histotech, PathologyAssistant, Pathologist], code: 200, input: [], output: Case, side_effects: ["tat_breached re-evaluated against the logical clock on read for non-finalized cases"] }
  - { method: GET, path: "/pathology/cases", description: "List cases with filters and pagination", roles: [LabAdmin, Histotech, PathologyAssistant, Pathologist], code: 200, input: ["patient_id?", "assigned_pathologist_id?", "amender_pathologist_id?", "status?", "tat_breached?", "limit?", "offset?"], output: "Case[]", side_effects: [] }
  - { method: POST, path: "/pathology/cases/{id}/assign", description: "Assign a pathologist explicitly (pathologist_id) or via the deterministic server selector (omitted): eligibility = active, subspecialty match, no ACTIVE UNAVAILABLE window containing now; ranking = workload_score ASC, tie-break last_assigned_at ASC nulls first then pathologist created_at ASC; empty pool yields ERR_NO_ELIGIBLE_PATHOLOGIST", roles: [LabAdmin], code: 200, input: ["pathologist_id?"], output: Case, side_effects: ["assigned_pathologist_id set", "assignee last_assigned_at stamped", "workload recomputed for old and new assignee", "increments Case.version by 1"] }
  - { method: POST, path: "/pathology/cases/{id}/reassign", description: "Reassign to another pathologist under OCC; supersedes the current assignment", roles: [LabAdmin], code: 200, input: [pathologist_id, expected_case_version], output: Case, side_effects: ["assigned_pathologist_id swapped", "new assignee last_assigned_at stamped", "workload recomputed for both pathologists", "increments Case.version by 1"] }
  - { method: POST, path: "/pathology/cases/{id}/submit-for-signout", description: "Assigned pathologist submits a worked-up case; gated on slide/stain readiness", roles: [Pathologist], code: 200, input: [], output: Case, side_effects: ["Case WORKUP -> PENDING_SIGNOUT", "increments Case.version by 1"] }
  - { method: POST, path: "/pathology/cases/{id}/sign-out", description: "Assigned pathologist signs the case out; creates the SIGNED FINAL report", roles: [Pathologist], code: 200, input: [diagnosis_text], output: Case, side_effects: ["Case PENDING_SIGNOUT -> FINAL", "Report FINAL/SIGNED created", "finalized_at and current_signed_report_id set", "tat_breached and breach_minutes computed", "specimens GROSSING/PROCESSING -> COMPLETE with retention_until set", "open stain orders CANCELLED", "workload recomputed", "increments Case.version by 1"] }
  - { method: POST, path: "/pathology/cases/{id}/amend", description: "Open an amendment on a FINAL case; creates the DRAFT AMENDED report; SoD gate applies", roles: [Pathologist], code: 201, input: [diagnosis_text, amendment_reason], output: Report, side_effects: ["Case FINAL -> AMENDING", "DRAFT AMENDED Report created with supersedes_report_id = current signed report", "amender_pathologist_id set", "increments Case.version by 1"] }
  - { method: POST, path: "/pathology/cases/{id}/amend/sign", description: "Amender signs the amended report; supersedes the prior signed report", roles: [Pathologist], code: 200, input: [], output: Report, side_effects: ["Case AMENDING -> FINAL", "DRAFT report -> SIGNED", "prior SIGNED report -> SUPERSEDED", "current_signed_report_id updated", "increments Case.version by 1"] }
  - { method: POST, path: "/pathology/cases/{id}/amend/cancel", description: "Amender abandons the amendment; prior signed report untouched", roles: [Pathologist], code: 200, input: [], output: Case, side_effects: ["Case AMENDING -> FINAL", "DRAFT report -> CANCELLED", "current_signed_report_id unchanged", "increments Case.version by 1"] }
  - { method: POST, path: "/pathology/cases/{id}/cancel", description: "Cancel an OPEN or WORKUP case; cascades to non-terminal children", roles: [LabAdmin], code: 200, input: [reason], output: Case, side_effects: ["Case -> CANCELLED", "non-terminal slides/stain orders/consultations CANCELLED", "workload recomputed", "increments Case.version by 1"] }

  # --- Specimens ---
  - { method: POST, path: "/pathology/cases/{id}/specimens", description: "Accession a specimen under a case; two-identifier patient check; mints accession_number; computes cold_ischemia_minutes", roles: [Histotech], code: 201, input: [patient_mrn, patient_dob, specimen_type, anatomical_site, collection_datetime, received_datetime, container_count, "fixative_type?"], output: Specimen, side_effects: ["accession_number minted", "cold_ischemia_minutes computed", "case tat_base_time/turnaround_deadline recomputed when this specimen lowers the earliest received_datetime", "case complexity_score recomputed", "increments Case.version by 1"] }
  - { method: GET, path: "/pathology/specimens/{id}", description: "Fetch one specimen", roles: [LabAdmin, Histotech, PathologyAssistant, Pathologist], code: 200, input: [], output: Specimen, side_effects: [] }
  - { method: GET, path: "/pathology/specimens", description: "List specimens with filters and pagination", roles: [LabAdmin, Histotech, PathologyAssistant, Pathologist], code: 200, input: ["case_id?", "status?", "limit?", "offset?"], output: "Specimen[]", side_effects: [] }
  - { method: POST, path: "/pathology/specimens/{id}/reject", description: "Reject an accessioned specimen that has no blocks", roles: [Histotech], code: 200, input: [reason], output: Specimen, side_effects: ["Specimen ACCESSIONED -> REJECTED", "case auto-CANCELLED when all its specimens are REJECTED and it is OPEN", "case tat_base_time/deadline and complexity recomputed"] }
  - { method: POST, path: "/pathology/specimens/{id}/gross", description: "Record the gross description; first gross on the case moves it OPEN -> WORKUP", roles: [PathologyAssistant], code: 200, input: [gross_description], output: Specimen, side_effects: ["Specimen ACCESSIONED -> GROSSING", "parent Case OPEN -> WORKUP on first gross", "increments Specimen.version by 1"] }
  - { method: POST, path: "/pathology/specimens/{id}/dispose-wet-tissue", description: "Dispose of wet tissue once the retention period has fully elapsed (now >= retention_until)", roles: [Histotech], code: 200, input: [], output: Specimen, side_effects: ["wet_tissue_disposed_at stamped", "increments Specimen.version by 1"] }

  # --- Blocks ---
  - { method: POST, path: "/pathology/specimens/{id}/blocks", description: "Create a paraffin block for a grossed specimen; first block moves the specimen GROSSING -> PROCESSING", roles: [PathologyAssistant, Histotech], code: 201, input: [block_label], output: Block, side_effects: ["Block created CREATED with tissue_remaining_pct 100.0", "specimen GROSSING -> PROCESSING on first block", "case complexity_score recomputed"] }
  - { method: GET, path: "/pathology/blocks/{id}", description: "Fetch one block", roles: [LabAdmin, Histotech, PathologyAssistant, Pathologist], code: 200, input: [], output: Block, side_effects: [] }
  - { method: GET, path: "/pathology/blocks", description: "List blocks with filters and pagination", roles: [LabAdmin, Histotech, PathologyAssistant, Pathologist], code: 200, input: ["specimen_id?", "status?", "limit?", "offset?"], output: "Block[]", side_effects: [] }
  - { method: POST, path: "/pathology/blocks/{id}/embed", description: "Embed a CREATED block", roles: [Histotech], code: 200, input: [], output: Block, side_effects: ["Block CREATED -> EMBEDDED", "increments Block.version by 1"] }

  # --- Slides ---
  - { method: POST, path: "/pathology/blocks/{id}/slides", description: "Order a slide (routine H&E) from an EMBEDDED block", roles: [Histotech], code: 201, input: [slide_label, "stain_type?"], output: Slide, side_effects: ["Slide created ORDERED", "case complexity_score recomputed"] }
  - { method: GET, path: "/pathology/slides/{id}", description: "Fetch one slide", roles: [LabAdmin, Histotech, PathologyAssistant, Pathologist], code: 200, input: [], output: Slide, side_effects: [] }
  - { method: GET, path: "/pathology/slides", description: "List slides with filters and pagination", roles: [LabAdmin, Histotech, PathologyAssistant, Pathologist], code: 200, input: ["block_id?", "status?", "limit?", "offset?"], output: "Slide[]", side_effects: [] }
  - { method: POST, path: "/pathology/slides/{id}/section", description: "Section an ORDERED slide; consumes block tissue with per-event rounding", roles: [Histotech], code: 200, input: [consumption_pct], output: Slide, side_effects: ["Slide ORDERED -> SECTIONED", "block tissue_remaining_pct debited (per-event round_half_up 1 decimal)", "block EMBEDDED -> DEPLETED when remaining < 5.0", "increments Slide.version by 1"] }
  - { method: POST, path: "/pathology/slides/{id}/stain-complete", description: "Mark a SECTIONED slide as STAINED", roles: [Histotech], code: 200, input: [], output: Slide, side_effects: ["Slide SECTIONED -> STAINED", "increments Slide.version by 1"] }
  - { method: POST, path: "/pathology/slides/{id}/qc-review", description: "QC review of a STAINED slide; FAIL records reason and pulls a PENDING_SIGNOUT case back to WORKUP", roles: [Histotech], code: 200, input: [result, "reason?"], output: Slide, side_effects: ["Slide STAINED -> QC_PASSED (result PASS) or QC_FAILED (result FAIL)", "on FAIL: owning case PENDING_SIGNOUT -> WORKUP", "increments Slide.version by 1"] }
  - { method: POST, path: "/pathology/slides/{id}/recut", description: "Recut a QC_FAILED slide; consumes additional block tissue (recut cycle)", roles: [Histotech], code: 200, input: [consumption_pct], output: Slide, side_effects: ["Slide QC_FAILED -> SECTIONED", "block tissue_remaining_pct debited with per-event rounding", "block EMBEDDED -> DEPLETED when remaining < 5.0", "increments Slide.version by 1"] }

  # --- Stain orders & reflex rules ---
  - { method: POST, path: "/pathology/cases/{id}/stain-orders", description: "Pathologist orders a special stain on a block of the case; cold-ischemia gate for HER2_IHC/PD_L1; ordering while PENDING_SIGNOUT pulls the case back to WORKUP", roles: [Pathologist], code: 201, input: [block_id, stain_type], output: StainOrder, side_effects: ["StainOrder created ORDERED", "case PENDING_SIGNOUT -> WORKUP pull-back when applicable", "case complexity_score recomputed; on class change deadline recomputed and tat_breached re-evaluated", "increments Case.version by 1"] }
  - { method: GET, path: "/pathology/stain-orders/{id}", description: "Fetch one stain order", roles: [LabAdmin, Histotech, PathologyAssistant, Pathologist], code: 200, input: [], output: StainOrder, side_effects: [] }
  - { method: GET, path: "/pathology/stain-orders", description: "List stain orders with filters and pagination", roles: [LabAdmin, Histotech, PathologyAssistant, Pathologist], code: 200, input: ["case_id?", "block_id?", "reflex_rule_id?", "parent_stain_order_id?", "ordered_by_pathologist_id?", "status?", "limit?", "offset?"], output: "StainOrder[]", side_effects: [] }
  - { method: POST, path: "/pathology/stain-orders/{id}/start", description: "Begin processing an ORDERED stain", roles: [Histotech], code: 200, input: [], output: StainOrder, side_effects: ["StainOrder ORDERED -> IN_PROGRESS", "increments StainOrder.version by 1"] }
  - { method: POST, path: "/pathology/stain-orders/{id}/result", description: "Enter the result; fires reflex evaluation which may auto-create child orders and cascade into case complexity/deadline", roles: [Histotech], code: 200, input: [result_value], output: StainOrder, side_effects: ["StainOrder IN_PROGRESS -> RESULTED", "reflex_evaluation runs (child orders per matching ACTIVE rules, dedupe per case+rule, chain-depth guard)", "case complexity/deadline/breach cascade per created child", "increments StainOrder.version by 1"] }
  - { method: POST, path: "/pathology/stain-orders/{id}/cancel", description: "Pathologist cancels an open stain order", roles: [Pathologist], code: 200, input: [], output: StainOrder, side_effects: ["StainOrder -> CANCELLED", "case complexity_score recomputed; on class change deadline recomputed and tat_breached re-evaluated", "increments StainOrder.version by 1"] }
  - { method: POST, path: "/pathology/reflex-rules", description: "Create a reflex rule", roles: [LabAdmin], code: 201, input: [name, trigger_stain_type, trigger_result, followup_stain_type, priority], output: ReflexRule, side_effects: [] }
  - { method: GET, path: "/pathology/reflex-rules/{id}", description: "Fetch one reflex rule", roles: [LabAdmin, Histotech, PathologyAssistant, Pathologist], code: 200, input: [], output: ReflexRule, side_effects: [] }
  - { method: GET, path: "/pathology/reflex-rules", description: "List reflex rules", roles: [LabAdmin, Histotech, PathologyAssistant, Pathologist], code: 200, input: ["active?", "limit?", "offset?"], output: "ReflexRule[]", side_effects: [] }
  - { method: PUT, path: "/pathology/reflex-rules/{id}", description: "Update a reflex rule under OCC (expected_reflex_rule_version)", roles: [LabAdmin], code: 200, input: [expected_reflex_rule_version, "name?", "trigger_stain_type?", "trigger_result?", "followup_stain_type?", "priority?", "active?"], output: ReflexRule, side_effects: ["increments ReflexRule.version by 1"] }
  - { method: POST, path: "/pathology/reflex-rules/{id}/deactivate", description: "Deactivate a reflex rule (active = false); deactivated rules never fire", roles: [LabAdmin], code: 200, input: [], output: ReflexRule, side_effects: ["active set false", "increments ReflexRule.version by 1"] }

  # --- Reports (read-only; created by sign-out / amend flows) ---
  - { method: GET, path: "/pathology/reports/{id}", description: "Fetch one report", roles: [LabAdmin, Histotech, PathologyAssistant, Pathologist], code: 200, input: [], output: Report, side_effects: [] }
  - { method: GET, path: "/pathology/reports", description: "List reports with filters and pagination", roles: [LabAdmin, Histotech, PathologyAssistant, Pathologist], code: 200, input: ["case_id?", "supersedes_report_id?", "signed_by_pathologist_id?", "status?", "limit?", "offset?"], output: "Report[]", side_effects: [] }

  # --- Consultations (second opinion) ---
  - { method: POST, path: "/pathology/cases/{id}/consultations", description: "Request a second-opinion consultation; consultant must differ from requester and case assignee and hold the requested subspecialty", roles: [Pathologist], code: 201, input: [consultant_pathologist_id, subspecialty, question_text, due_at], output: Consultation, side_effects: ["Consultation created REQUESTED", "requesting_pathologist_id set from caller"] }
  - { method: GET, path: "/pathology/consultations/{id}", description: "Fetch one consultation", roles: [LabAdmin, Histotech, PathologyAssistant, Pathologist], code: 200, input: [], output: Consultation, side_effects: [] }
  - { method: GET, path: "/pathology/consultations", description: "List consultations with filters and pagination", roles: [LabAdmin, Histotech, PathologyAssistant, Pathologist], code: 200, input: ["case_id?", "consultant_pathologist_id?", "requesting_pathologist_id?", "status?", "limit?", "offset?"], output: "Consultation[]", side_effects: [] }
  - { method: POST, path: "/pathology/consultations/{id}/accept", description: "Consultant accepts; refused while the consultant is inside an ACTIVE UNAVAILABLE window", roles: [Pathologist], code: 200, input: [], output: Consultation, side_effects: ["Consultation REQUESTED -> ACCEPTED", "consultant workload_score recomputed", "increments Consultation.version by 1"] }
  - { method: POST, path: "/pathology/consultations/{id}/decline", description: "Consultant declines", roles: [Pathologist], code: 200, input: ["reason?"], output: Consultation, side_effects: ["Consultation REQUESTED -> DECLINED", "decline_reason recorded", "increments Consultation.version by 1"] }
  - { method: POST, path: "/pathology/consultations/{id}/answer", description: "Consultant answers with opinion and concordance; non-CONCORDANT auto-creates a Discrepancy", roles: [Pathologist], code: 200, input: [opinion_text, concordance], output: Consultation, side_effects: ["Consultation ACCEPTED -> ANSWERED", "Discrepancy auto-created for MINOR_DISCORDANT (LEVEL_1) or MAJOR_DISCORDANT (LEVEL_2)", "consultant workload_score recomputed", "increments Consultation.version by 1"] }
  - { method: POST, path: "/pathology/consultations/{id}/incorporate", description: "Requester incorporates the answered opinion", roles: [Pathologist], code: 200, input: [], output: Consultation, side_effects: ["Consultation ANSWERED -> INCORPORATED", "increments Consultation.version by 1"] }
  - { method: POST, path: "/pathology/consultations/{id}/reroute", description: "Requester reroutes a DECLINED or EXPIRED consultation to a new consultant with a new due_at (cycle back to REQUESTED)", roles: [Pathologist], code: 200, input: [consultant_pathologist_id, due_at], output: Consultation, side_effects: ["Consultation DECLINED/EXPIRED -> REQUESTED", "consultant and due_at replaced", "reroute_count + 1", "increments Consultation.version by 1"] }

  # --- Discrepancies ---
  - { method: POST, path: "/pathology/cases/{id}/discrepancies", description: "Manually record a QA discrepancy on a case", roles: [Pathologist, LabAdmin], code: 201, input: [severity, description, "report_id?"], output: Discrepancy, side_effects: ["Discrepancy created OPEN with source INTERNAL_QA", "attributed_pathologist_id resolved (linked report signer, else case assignee)", "case open_critical_discrepancy_count recomputed for LEVEL_3", "increments Case.version by 1"] }
  - { method: GET, path: "/pathology/discrepancies/{id}", description: "Fetch one discrepancy", roles: [LabAdmin, Histotech, PathologyAssistant, Pathologist], code: 200, input: [], output: Discrepancy, side_effects: [] }
  - { method: GET, path: "/pathology/discrepancies", description: "List discrepancies with filters and pagination", roles: [LabAdmin, Histotech, PathologyAssistant, Pathologist], code: 200, input: ["case_id?", "consultation_id?", "report_id?", "attributed_pathologist_id?", "status?", "severity?", "limit?", "offset?"], output: "Discrepancy[]", side_effects: [] }
  - { method: POST, path: "/pathology/discrepancies/{id}/acknowledge", description: "Assigned pathologist acknowledges an OPEN discrepancy", roles: [Pathologist], code: 200, input: [], output: Discrepancy, side_effects: ["Discrepancy OPEN -> ACKNOWLEDGED", "increments Discrepancy.version by 1"] }
  - { method: POST, path: "/pathology/discrepancies/{id}/resolve", description: "Resolve a discrepancy; LEVEL_2/LEVEL_3 require a prior signed amendment and resolved_with_amendment true; LEVEL_1 may resolve directly from OPEN", roles: [Pathologist, LabAdmin], code: 200, input: ["resolved_with_amendment?"], output: Discrepancy, side_effects: ["Discrepancy -> RESOLVED", "resolved_at stamped", "attributed pathologist rates recomputed on next read", "increments Discrepancy.version by 1"] }

  # --- Release requests (slide/block loans) ---
  - { method: POST, path: "/pathology/release-requests", description: "Request release of a block or slide; the material's case must be FINAL and the material itself releasable", roles: [LabAdmin, Pathologist], code: 201, input: [material_type, "block_id?", "slide_id?", requesting_institution, reason, requested_out_at, due_back_at], output: ReleaseRequest, side_effects: ["ReleaseRequest created REQUESTED"] }
  - { method: GET, path: "/pathology/release-requests/{id}", description: "Fetch one release request", roles: [LabAdmin, Histotech, PathologyAssistant, Pathologist], code: 200, input: [], output: ReleaseRequest, side_effects: [] }
  - { method: GET, path: "/pathology/release-requests", description: "List release requests with filters and pagination", roles: [LabAdmin, Histotech, PathologyAssistant, Pathologist], code: 200, input: ["block_id?", "slide_id?", "status?", "limit?", "offset?"], output: "ReleaseRequest[]", side_effects: [] }
  - { method: POST, path: "/pathology/release-requests/{id}/approve", description: "Approve a release; safety (last diagnostic material) outranks temporal (loan interval conflict)", roles: [LabAdmin], code: 200, input: [], output: ReleaseRequest, side_effects: ["ReleaseRequest REQUESTED -> APPROVED", "increments ReleaseRequest.version by 1"] }
  - { method: POST, path: "/pathology/release-requests/{id}/deny", description: "Deny a release request", roles: [LabAdmin], code: 200, input: [reason], output: ReleaseRequest, side_effects: ["ReleaseRequest REQUESTED -> DENIED", "increments ReleaseRequest.version by 1"] }
  - { method: POST, path: "/pathology/release-requests/{id}/ship", description: "Ship an approved release; material goes on loan", roles: [Histotech], code: 200, input: [], output: ReleaseRequest, side_effects: ["ReleaseRequest APPROVED -> SHIPPED", "shipped_at stamped", "material on_loan recomputed true", "increments ReleaseRequest.version by 1"] }
  - { method: POST, path: "/pathology/release-requests/{id}/return", description: "Receive loaned material back; restores material availability", roles: [Histotech], code: 200, input: [], output: ReleaseRequest, side_effects: ["ReleaseRequest SHIPPED/OVERDUE -> RETURNED", "returned_at stamped; returned_late computed", "material on_loan recomputed false", "increments ReleaseRequest.version by 1"] }

  # --- Test-driving clock ---
  - { method: POST, path: "/pathology/_clock/set_current_utc", description: "Set the server's logical clock (test-driving endpoint). Startup default is exactly 2026-08-01T00:00:00Z and the clock never falls back to wall time. Setting the clock runs the system sweep: REQUESTED consultations with due_at strictly before the new time become EXPIRED; SHIPPED release requests with due_back_at strictly before the new time become OVERDUE.", roles: [LabAdmin], code: 200, input: [to_iso8601], output: { current_utc: string }, side_effects: ["consultation expiry sweep", "release overdue sweep"] }

# =============================================================================
# Table 6: Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "missing or invalid X-User-Role / X-User-ID headers" }
  - { id: ERR_FORBIDDEN, http: 403, condition: "role not permitted for the endpoint, or entity-backed ownership mismatch (not the assigned pathologist / consultant / requester / amender)" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "missing required field, invalid enum member, out-of-range number, end<=start window, release id/material_type mismatch, reflex rule with identical trigger and followup stain" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "path or body referenced id does not exist" }
  - { id: ERR_CASE_TERMINAL, http: 409, condition: "child mutation attempted under a CANCELLED or FINAL case" }
  - { id: ERR_SPECIMEN_NOT_ACCESSIONED, http: 409, condition: "gross or reject attempted on a specimen not in ACCESSIONED" }
  - { id: ERR_GROSS_NOT_RECORDED, http: 409, condition: "block creation attempted on a specimen not in GROSSING or PROCESSING" }
  - { id: ERR_BLOCK_NOT_CREATED, http: 409, condition: "embed attempted on a block not in CREATED" }
  - { id: ERR_BLOCK_NOT_EMBEDDED, http: 409, condition: "slide order, section, or recut attempted on a CREATED (not yet EMBEDDED) block" }
  - { id: ERR_BLOCK_DEPLETED, http: 409, condition: "slide order, section, or recut attempted on a DEPLETED block" }
  - { id: ERR_SLIDE_WRONG_STATE, http: 409, condition: "slide lifecycle action attempted from a state that does not allow it" }
  - { id: ERR_CASE_NOT_ASSIGNABLE, http: 409, condition: "assign attempted on a case not in OPEN or WORKUP" }
  - { id: ERR_CASE_NOT_REASSIGNABLE, http: 409, condition: "reassign attempted on a case not in WORKUP or PENDING_SIGNOUT" }
  - { id: ERR_CASE_NOT_CANCELLABLE, http: 409, condition: "cancel attempted on a case not in OPEN or WORKUP" }
  - { id: ERR_CASE_NOT_IN_WORKUP, http: 409, condition: "submit-for-signout attempted on a case not in WORKUP" }
  - { id: ERR_CASE_NOT_PENDING_SIGNOUT, http: 409, condition: "sign-out attempted on a case not in PENDING_SIGNOUT" }
  - { id: ERR_CASE_NOT_FINAL, http: 409, condition: "amend attempted on a non-FINAL case, or release requested for material whose case is not FINAL" }
  - { id: ERR_CASE_NOT_AMENDING, http: 409, condition: "amend/sign or amend/cancel attempted on a case not in AMENDING" }
  - { id: ERR_CASE_NOT_ORDERABLE, http: 409, condition: "stain order attempted on a case not in WORKUP, PENDING_SIGNOUT, or AMENDING" }
  - { id: ERR_CASE_NOT_CONSULTABLE, http: 409, condition: "consultation requested on a case in OPEN or CANCELLED" }
  - { id: ERR_STAIN_WRONG_STATE, http: 409, condition: "stain start/result/cancel attempted from a state that does not allow it" }
  - { id: ERR_CONSULTATION_WRONG_STATE, http: 409, condition: "consultation action attempted from a state that does not allow it" }
  - { id: ERR_DISCREPANCY_WRONG_STATE, http: 409, condition: "acknowledge or resolve attempted from a state that does not allow it (including OPEN resolve of LEVEL_2/LEVEL_3)" }
  - { id: ERR_RELEASE_WRONG_STATE, http: 409, condition: "release action attempted from a state that does not allow it" }
  - { id: ERR_MATERIAL_NOT_RELEASABLE, http: 409, condition: "release requested for a block not EMBEDDED or a slide not QC_PASSED" }
  - { id: ERR_SPECIMEN_NOT_COMPLETE, http: 409, condition: "wet-tissue disposal attempted on a specimen not in COMPLETE (or already disposed)" }
  - { id: ERR_COVERAGE_WINDOW_NOT_ACTIVE, http: 409, condition: "cancel attempted on a non-ACTIVE coverage window" }
  - { id: ERR_STALE_CASE_VERSION, http: 412, condition: "reassign carried an expected_case_version different from the case's current version" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "reflex-rule update carried an expected_reflex_rule_version different from the rule's current version" }
  - { id: ERR_PATIENT_IDENTIFIER_MISMATCH, http: 422, condition: "accession patient_mrn/patient_dob do not match the case patient" }
  - { id: ERR_COLD_ISCHEMIA_EXCEEDED, http: 422, condition: "cold-sensitive stain ordered on a specimen whose cold_ischemia_minutes exceeds the stain limit" }
  - { id: ERR_UNRESOLVED_CRITICAL_DISCREPANCY, http: 422, condition: "sign-out attempted while a LEVEL_3 discrepancy is OPEN or ACKNOWLEDGED" }
  - { id: ERR_ACCEPTED_CONSULTATION_OPEN, http: 409, condition: "sign-out attempted while a consultation is ACCEPTED but not answered" }
  - { id: ERR_SELF_CONSULTATION, http: 422, condition: "consultant equals the requesting pathologist" }
  - { id: ERR_CONSULTANT_IS_ASSIGNED, http: 422, condition: "consultant equals the case assigned pathologist" }
  - { id: ERR_SOD_AMENDMENT_FORBIDDEN, http: 422, condition: "amendment of a report with a linked LEVEL_2/LEVEL_3 discrepancy attempted by the original signer" }
  - { id: ERR_LAST_DIAGNOSTIC_MATERIAL, http: 422, condition: "release approval would strip the case of its last QC_PASSED slide or last EMBEDDED non-DEPLETED block" }
  - { id: ERR_DUPLICATE_MRN, http: 409, condition: "patient mrn already registered" }
  - { id: ERR_DUPLICATE_BLOCK_LABEL, http: 409, condition: "block_label already used within the specimen" }
  - { id: ERR_DUPLICATE_SLIDE_LABEL, http: 409, condition: "slide_label already used within the block" }
  - { id: ERR_DUPLICATE_REFLEX_RULE, http: 409, condition: "an ACTIVE reflex rule with the same (trigger_stain_type, trigger_result, followup_stain_type) already exists" }
  - { id: ERR_EMPTY_SLIDE_SET, http: 422, condition: "submit-for-signout attempted with zero QC_PASSED slides" }
  - { id: ERR_SLIDES_NOT_READY, http: 409, condition: "submit-for-signout attempted while a non-CANCELLED slide is not QC_PASSED or a stain order is still open" }
  - { id: ERR_PATHOLOGIST_INELIGIBLE, http: 422, condition: "explicit assignment target fails eligibility (inactive, subspecialty mismatch, or inside an ACTIVE UNAVAILABLE window)" }
  - { id: ERR_NO_ELIGIBLE_PATHOLOGIST, http: 422, condition: "server selector found an empty eligibility pool" }
  - { id: ERR_SUBSPECIALTY_MISMATCH, http: 422, condition: "consultant does not hold the requested consultation subspecialty" }
  - { id: ERR_BLOCK_NOT_IN_CASE, http: 422, condition: "stain order references a block that does not belong to the case" }
  - { id: ERR_BLOCKS_EXIST, http: 409, condition: "reject attempted on a specimen that already has blocks" }
  - { id: ERR_AMENDMENT_REQUIRED, http: 422, condition: "LEVEL_2/LEVEL_3 resolve without a subsequent signed amendment or without resolved_with_amendment true" }
  - { id: ERR_COLLECTION_AFTER_RECEIVED, http: 422, condition: "received_datetime precedes collection_datetime" }
  - { id: ERR_DUE_AT_NOT_FUTURE, http: 422, condition: "consultation due_at not strictly in the future" }
  - { id: ERR_CONSULTANT_UNAVAILABLE, http: 422, condition: "accept attempted while the consultant is inside an ACTIVE UNAVAILABLE window" }
  - { id: ERR_COVERAGE_WINDOW_OVERLAP, http: 409, condition: "CONSULT_SERVICE window overlaps another ACTIVE CONSULT_SERVICE window (half-open; touching allowed)" }
  - { id: ERR_UNAVAILABILITY_BUFFER_VIOLATION, http: 409, condition: "UNAVAILABLE window leaves less than 60 minutes gap to an ACTIVE CONSULT_SERVICE window" }
  - { id: ERR_LOAN_INTERVAL_CONFLICT, http: 409, condition: "another release for the same material in status REQUESTED, APPROVED, SHIPPED, or OVERDUE overlaps the requested closed interval (touching counts)" }
  - { id: ERR_RETENTION_NOT_ELAPSED, http: 422, condition: "wet-tissue disposal attempted before retention_until" }
  - { id: ERR_INSUFFICIENT_TISSUE, http: 422, condition: "consumption exceeds the block's remaining tissue percentage" }

# =============================================================================
# Table 7: RBAC Matrix
# =============================================================================
roles:
  - name: LabAdmin
    description: "Laboratory administrator; owns configuration (patients, pathologists, coverage windows, reflex rules), assignment, release approval, and the logical clock"
    identity: opaque
    exclusive_operations: ["POST /pathology/patients", "POST /pathology/pathologists", "POST /pathology/pathologists/{id}/coverage-windows", "POST /pathology/coverage-windows/{id}/cancel", "POST /pathology/cases/{id}/assign", "POST /pathology/cases/{id}/reassign", "POST /pathology/cases/{id}/cancel", "POST /pathology/reflex-rules", "PUT /pathology/reflex-rules/{id}", "POST /pathology/reflex-rules/{id}/deactivate", "POST /pathology/release-requests/{id}/approve", "POST /pathology/release-requests/{id}/deny", "POST /pathology/_clock/set_current_utc"]
    shared_operations: ["all GET endpoints", "POST /pathology/cases", "POST /pathology/cases/{id}/discrepancies", "POST /pathology/discrepancies/{id}/resolve", "POST /pathology/release-requests"]
  - name: Histotech
    description: "Histology technologist; accessions specimens, runs blocks/slides/stains, ships and returns loaned material"
    identity: opaque
    exclusive_operations: ["POST /pathology/cases/{id}/specimens", "POST /pathology/specimens/{id}/reject", "POST /pathology/specimens/{id}/dispose-wet-tissue", "POST /pathology/blocks/{id}/embed", "POST /pathology/blocks/{id}/slides", "POST /pathology/slides/{id}/section", "POST /pathology/slides/{id}/stain-complete", "POST /pathology/slides/{id}/qc-review", "POST /pathology/slides/{id}/recut", "POST /pathology/stain-orders/{id}/start", "POST /pathology/stain-orders/{id}/result", "POST /pathology/release-requests/{id}/ship", "POST /pathology/release-requests/{id}/return"]
    shared_operations: ["all GET endpoints", "POST /pathology/cases", "POST /pathology/specimens/{id}/blocks"]
  - name: PathologyAssistant
    description: "Pathologists' assistant; performs grossing and block creation"
    identity: opaque
    exclusive_operations: ["POST /pathology/specimens/{id}/gross"]
    shared_operations: ["all GET endpoints", "POST /pathology/specimens/{id}/blocks"]
