          difficulty_instance: priority_pair_validation_conflict / segregation_of_duties_outranks_goodwill_state_gate
          rationale: "The named §1.8 instance has the requester decide an already-decided authorization and asserts ERR_SEGREGATION_OF_DUTIES."
      - name: appeal_window_closed_violation_to_error
        claim_type: violation_to_error
        grounds:
          - validations[priority 55].ERR_APPEAL_WINDOW_CLOSED
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / appeal_window_closure_outranks_finding_membership_check
          rationale: "The same §1.8 instance drives the clock one day past appeal_deadline and asserts the 409, so a separate window test would duplicate it."
      - name: statutory_ceiling_violation_to_error
        claim_type: violation_to_error
        grounds:
          - validations[priority 80].ERR_LABOR_RATE_ABOVE_STATUTORY_CEILING
        excluded_because:
          difficulty_instance: boundary_precision_check / statutory_ceiling_inclusive_boundary_17600_versus_17601
          rationale: "The named §1.8 instance submits 17600 and 17601 against the same ceiling and asserts the accept/reject pair."
      - name: vehicle_repair_overlap_temporal_validation
        claim_type: temporal_validation
        grounds:
          - validations[priority 62].ERR_OVERLAPPING_REPAIR_CLAIM
        excluded_because:
          difficulty_instance: resource_temporal_overlap / vehicle_repair_overlap_closed_buffer_thirty_versus_thirty_one_days
          rationale: "The named §1.8 instance tests the closed 30-day buffer on both sides and the resubmission exemption, covering this rule's whole surface."
      - name: audit_period_overlap_temporal_validation
        claim_type: temporal_validation
        grounds:
          - validations[priority 64].ERR_AUDIT_PERIOD_OVERLAP
        excluded_because:
          difficulty_instance: resource_temporal_overlap / audit_period_overlap_half_open_no_buffer_touching_endpoints
          rationale: "The named §1.8 instance asserts the half-open no-buffer semantics including the touching-endpoints accept."
      - name: goodwill_request_above_manager_limit_aggregate_validation
        claim_type: aggregate_validation
        grounds:
          - validations[priority 85].ERR_GOODWILL_LIMIT_EXCEEDED
        excluded_because:
          difficulty_instance: boundary_precision_check / goodwill_manager_limit_inclusive_boundary_48000_versus_48001
          rationale: "The named §1.8 instance requests exactly 48000 and 48001 against manager_limit_cents, covering the request-time tier ceiling."
      - name: audit_hold_freezes_payment_cross_entity_validation
        claim_type: cross_entity_validation
        grounds:
          - validations[priority 47].ERR_DEALER_UNDER_AUDIT_HOLD
        excluded_because:
          difficulty_instance: cross_entity_state_dependency / claim_payment_blocked_by_dealer_audit_hold_from_a_third_entity
          rationale: "The named §1.8 instance blocks payment through a third entity's state and asserts the hold is lifted on audit close."
      - name: pending_appeal_blocks_audit_close_cross_entity_validation
        claim_type: cross_entity_validation
        grounds:
          - validations[priority 50].ERR_APPEAL_PENDING
        excluded_because:
          difficulty_instance: cross_entity_state_dependency / audit_close_blocked_by_pending_appeal_of_a_child_entity
          rationale: "The named §1.8 instance closes the audit only after the child appeal is decided and asserts the 409 before that."

  - section: endpoints
    instances:
      - name: reference_data_standard_crud_create_then_read
        claim_type: standard_crud
        grounds:
          - endpoints[POST /warranty/labor-operations]
          - endpoints[GET /warranty/labor-operations/{id}]
          - endpoints[POST /warranty/parts]
          - endpoints[GET /warranty/parts/{id}]
          - endpoints[GET /warranty/dealers]
        distinguishing_aspect: |
          The reference-data entities are create-and-read only: there is no PUT, PATCH or DELETE anywhere in
          §1.5, so the create response is the sole writer and every later read must return exactly what it
          returned - including the optional causal_failure_group that only some operations carry.
        test_recipe:
          setup:
            - "A CA state law profile and dealer D1 exist."
            - "Operation A1234-56 requires a causal part in group BRAKE_FRONT; operation NP-100 requires none and has no causal_failure_group."
            - "Part BRK-PAD-9931 costs 24799 with return_required true and retention_days 30."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-05-01T00:00:00Z" }
              as: WarrantyAdmin
              as_user_id: "wa-user-1"
            - call: "POST /warranty/state-law-profiles"
              payload: { state_code: "CA", markup_cap_pct: 0.30, labor_rate_method: "RETAIL_SAMPLE", min_sample_repair_orders: 5, max_labor_rate_cents: 19500, deemed_approved_days: 30, appeal_window_days: 30 }
              as: WarrantyAdmin
              as_user_id: "wa-user-1"
              captures: { slp_ca_id: $.data.id }
            - call: "POST /warranty/dealers"
              payload: { dealer_code: "D1", name: "Dealer One", state_law_profile_id: "${slp_ca_id}", vehicles_in_operation: 100, initial_labor_rate_cents: 13750, initial_parts_markup_pct: 0.40 }
              as: WarrantyAdmin
              as_user_id: "wa-user-1"
              captures: { d1_id: $.data.id }
            - call: "POST /warranty/labor-operations"
              payload: { op_code: "A1234-56", description: "Front brake pad replacement", standard_time_hours: 1.5, max_time_hours: 2.5, category: "BASIC", requires_causal_part: true, causal_failure_group: "BRAKE_FRONT", overlap_group: "BRAKE_FRONT" }
              as: WarrantyAdmin
              as_user_id: "wa-user-1"
              captures: { lo_brake_id: $.data.id }
            - call: "POST /warranty/labor-operations"
              payload: { op_code: "NP-100", description: "Software reflash, no parts", standard_time_hours: 0.5, max_time_hours: 1.0, category: "BASIC", requires_causal_part: false, overlap_group: "REFLASH" }
              as: WarrantyAdmin
              as_user_id: "wa-user-1"
              captures: { lo_np_id: $.data.id }
            - call: "POST /warranty/parts"
              payload: { part_number: "BRK-PAD-9931", description: "Front brake pad set", dealer_net_cents: 24799, failure_group: "BRAKE_FRONT", return_required: true, retention_days: 30 }
              as: WarrantyAdmin
              as_user_id: "wa-user-1"
              captures: { part_brake_id: $.data.id }
          trigger:
            - call: "GET /warranty/labor-operations/${lo_brake_id}"
              as: ClaimAdjudicator
              as_user_id: "adj-user-1"
            - call: "GET /warranty/labor-operations/${lo_np_id}"
              as: ClaimAdjudicator
              as_user_id: "adj-user-1"
            - call: "GET /warranty/parts/${part_brake_id}"
              as: ClaimAdjudicator
              as_user_id: "adj-user-1"
            - call: "GET /warranty/dealers?state_law_profile_id=${slp_ca_id}&status=ACTIVE&limit=10&offset=0"
              as: WarrantyAdmin
              as_user_id: "wa-user-1"
          assert:
            - "first call: HTTP 200 with standard_time_hours 1.5, max_time_hours 2.5, requires_causal_part true, causal_failure_group BRAKE_FRONT, overlap_group BRAKE_FRONT"
            - "second call: HTTP 200 with requires_causal_part false and causal_failure_group null"
            - "third call: HTTP 200 with dealer_net_cents 24799, return_required true, retention_days 30"
            - "fourth call: total_count == 1 and has_more == false; the row carries current_labor_rate_cents 13750 and current_parts_markup_pct 0.40"
            - "every read returns the id the create returned; no update or delete endpoint exists for these entities"
      - name: labor_rate_request_action_endpoint_chain_and_preconditions
        claim_type: action_endpoint
        grounds:
          - endpoints[POST /warranty/labor-rate-requests/{id}/review]
          - endpoints[POST /warranty/labor-rate-requests/{id}/decision]
          - state_machines.LaborRateRequest
          - entities.Dealer.fields.approved_labor_rate_cents
        distinguishing_aspect: |
          The two action endpoints form an ordered pair: decision is refused while the request is SUBMITTED and
          accepted once review has moved it to UNDER_REVIEW, and only the approval writes the dealer's rate,
          markup and effective date - the request itself never touches the dealer.
        test_recipe:
          setup:
            - "WORLD-BRAKE without a claim; D1's version is captured for expected_dealer_version."
            - "A rate request for 17600 and 0.30 with a 6-order sample and median 17600 exists in SUBMITTED, at exactly the 17600 statutory ceiling."
            - "The submitter is D1's own admin, so mgr-user-1 is a different user and segregation of duties passes."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-05-01T00:00:00Z" }
              as: WarrantyAdmin
              as_user_id: "wa-user-1"
            - call: "POST /warranty/state-law-profiles"
              payload: { state_code: "CA", markup_cap_pct: 0.30, labor_rate_method: "RETAIL_SAMPLE", min_sample_repair_orders: 5, max_labor_rate_cents: 19500, deemed_approved_days: 30, appeal_window_days: 30 }
              as: WarrantyAdmin
              as_user_id: "wa-user-1"
              captures: { slp_ca_id: $.data.id }
            - call: "POST /warranty/dealers"
              payload: { dealer_code: "D1", name: "Dealer One", state_law_profile_id: "${slp_ca_id}", vehicles_in_operation: 100, initial_labor_rate_cents: 13750, initial_parts_markup_pct: 0.40 }
              as: WarrantyAdmin
              as_user_id: "wa-user-1"
              captures: { d1_id: $.data.id, d1_version: $.data.version }
            - call: "POST /warranty/vehicles"
              payload: { vin: "VIN00000000000001", model_year: 2024, warranty_start_date: "2024-01-15", in_service_odometer: 0, basic_months: 36, basic_miles: 36000, powertrain_months: 60, powertrain_miles: 60000 }
              as: WarrantyAdmin
              as_user_id: "wa-user-1"
              captures: { veh1_id: $.data.id }
            - call: "POST /warranty/labor-operations"
              payload: { op_code: "A1234-56", description: "Front brake pad replacement", standard_time_hours: 1.5, max_time_hours: 2.5, category: "BASIC", requires_causal_part: true, causal_failure_group: "BRAKE_FRONT", overlap_group: "BRAKE_FRONT" }
              as: WarrantyAdmin
              as_user_id: "wa-user-1"
              captures: { lo_brake_id: $.data.id }
            - call: "POST /warranty/parts"
              payload: { part_number: "BRK-PAD-9931", description: "Front brake pad set", dealer_net_cents: 24799, failure_group: "BRAKE_FRONT", return_required: true, retention_days: 30 }
              as: WarrantyAdmin
              as_user_id: "wa-user-1"
              captures: { part_brake_id: $.data.id }
            - call: "POST /warranty/labor-rate-requests"
              payload: { dealer_id: "${d1_id}", requested_labor_rate_cents: 17600, requested_parts_markup_pct: 0.30, sample_repair_order_count: 6, sample_median_rate_cents: 17600, effective_date: "2026-06-01", expected_dealer_version: "${d1_version}" }
              as: DealerWarrantyAdmin
              as_user_id: "${d1_id}"
              captures: { lrr_id: $.data.id }
          trigger:
            - call: "POST /warranty/labor-rate-requests/${lrr_id}/decision"
              payload: { action: "APPROVE", approved_labor_rate_cents: 17600, approved_parts_markup_pct: 0.30 }
              as: AdjudicationManager
              as_user_id: "mgr-user-1"
            - call: "POST /warranty/labor-rate-requests/${lrr_id}/review"
              payload: { action: "START_REVIEW" }
              as: WarrantyAdmin
              as_user_id: "wa-user-1"
            - call: "POST /warranty/labor-rate-requests/${lrr_id}/decision"
              payload: { action: "APPROVE", approved_labor_rate_cents: 17600, approved_parts_markup_pct: 0.30 }
              as: AdjudicationManager
              as_user_id: "mgr-user-1"
            - call: "GET /warranty/dealers/${d1_id}"
              as: WarrantyAdmin
              as_user_id: "wa-user-1"
          assert:
            - "first call: HTTP 409 with error_id ERR_LABOR_RATE_REQUEST_INVALID_STATE"
            - "second call: HTTP 200, LaborRateRequest.status == UNDER_REVIEW and reviewed_at is set"
            - "third call: HTTP 200, status == APPROVED with approved_labor_rate_cents 17600, approved_parts_markup_pct 0.30, decided_by_user_id mgr-user-1 and deemed_approved false"
            - "fourth call: Dealer.current_labor_rate_cents == 17600, current_parts_markup_pct == 0.30, labor_rate_effective_date == 2026-06-01"
            - "fourth call: Dealer.version advanced by exactly one write (the approval), not by the request or the review"
      - name: non_return_sweep_bulk_action_skips_ineligible_rows
        claim_type: bulk_action
        grounds:
          - endpoints[POST /warranty/parts-returns/non-return-sweep]
          - state_machines.PartsReturnRequest.transitions.REQUESTED_to_NOT_RETURNED
          - state_machines.Dealer.transitions.ACTIVE_to_PROBATION
        distinguishing_aspect: |
          Three due-dated rows enter the sweep and exactly one is processed: the RECEIVED row fails the status
          precondition and the SUBMITTED claim's row fails the claim-state precondition. The sweep SKIPS them
          rather than rolling back, and the single debit still drives the dealer to PROBATION and cascades a
          posture hold onto the very claim whose row it just skipped.
        test_recipe:
          setup:
            - "WORLD-BRAKE plus vehicles VEH2 and VEH3, all three claims on operation A1234-56 with part BRK-PAD-9931."
            - "CL1 (RO-1001) is APPROVED and PAID with approved_total_cents 117342; its return is REQUESTED and due 2026-05-31."
            - "CL_B (RO-7002) is APPROVED UNPAID and its return was RECEIVED on 2026-05-10."
            - "CL_C (RO-7003) is still SUBMITTED and its return is REQUESTED and equally overdue."
            - "The clock is at 2026-06-01T00:00:00Z, past every due_date."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-05-01T00:00:00Z" }
              as: WarrantyAdmin
              as_user_id: "wa-user-1"
            - call: "POST /warranty/state-law-profiles"
              payload: { state_code: "CA", markup_cap_pct: 0.30, labor_rate_method: "RETAIL_SAMPLE", min_sample_repair_orders: 5, max_labor_rate_cents: 19500, deemed_approved_days: 30, appeal_window_days: 30 }
              as: WarrantyAdmin
              as_user_id: "wa-user-1"
              captures: { slp_ca_id: $.data.id }
            - call: "POST /warranty/dealers"
              payload: { dealer_code: "D1", name: "Dealer One", state_law_profile_id: "${slp_ca_id}", vehicles_in_operation: 100, initial_labor_rate_cents: 13750, initial_parts_markup_pct: 0.40 }
              as: WarrantyAdmin
              as_user_id: "wa-user-1"
              captures: { d1_id: $.data.id }
            - call: "POST /warranty/vehicles"
              payload: { vin: "VIN00000000000001", model_year: 2024, warranty_start_date: "2024-01-15", in_service_odometer: 0, basic_months: 36, basic_miles: 36000, powertrain_months: 60, powertrain_miles: 60000 }
              as: WarrantyAdmin
              as_user_id: "wa-user-1"
              captures: { veh1_id: $.data.id }
            - call: "POST /warranty/labor-operations"
              payload: { op_code: "A1234-56", description: "Front brake pad replacement", standard_time_hours: 1.5, max_time_hours: 2.5, category: "BASIC", requires_causal_part: true, causal_failure_group: "BRAKE_FRONT", overlap_group: "BRAKE_FRONT" }
              as: WarrantyAdmin
              as_user_id: "wa-user-1"
              captures: { lo_brake_id: $.data.id }
            - call: "POST /warranty/parts"
              payload: { part_number: "BRK-PAD-9931", description: "Front brake pad set", dealer_net_cents: 24799, failure_group: "BRAKE_FRONT", return_required: true, retention_days: 30 }
              as: WarrantyAdmin
              as_user_id: "wa-user-1"
              captures: { part_brake_id: $.data.id }
            - call: "POST /warranty/claims"
              payload: { dealer_id: "${d1_id}", vehicle_id: "${veh1_id}", labor_operation_id: "${lo_brake_id}", causal_part_id: "${part_brake_id}", repair_order_number: "RO-1001", repair_date: "2026-04-10", odometer_at_repair: 20000, claimed_labor_hours: 1.5, claimed_parts_qty: 3, complaint_text: "Customer reports brake squeal at low speed.", cause_text: "Front brake pads worn beyond specification.", correction_text: "Replaced front brake pads and verified normal braking." }
              as: DealerWarrantyAdmin
