        excluded_because:
          difficulty_instance: bind_state_conflict_outranks_authority_limit
          rationale: "The §1.8 priority_pair_validation_conflict instance already violates the priority-9 state rule and the priority-15 authority rule in the same request and pins ERR_POLICY_NOT_RATED as the winner."

      - name: corner_priority_pair_compliance_versus_wc_covered_by_difficulty
        claim_type: priority_ordering
