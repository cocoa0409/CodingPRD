      - name: capa_close_blocked_by_open_source_ncr
        claim_type: cross_entity_validation
        grounds: [state_machines.CAPA.EFFECTIVENESS_CHECK_to_CLOSED, "errors[ERR_SOURCE_NOT_CLOSED]"]
        distinguishing_aspect: "A CAPA sourced from an NCR cannot close while that NCR is merely DISPOSITIONED: verify-effectiveness fails 409 ERR_SOURCE_NOT_CLOSED; after the NCR closes, verification succeeds."
        test_recipe:
          setup: ["supplier SUP-CN; part PN-CN; NCR-CN DISPOSITIONED (not closed); DMR DEV-CN APPROVED; CAPA CAPA-CN (source_type NCR -> NCR-CN) in EFFECTIVENESS_CHECK"]
