              captures: { safe_id: $.data.id }
            - call: "POST /cash-ops/cashiers"
              payload: { store_id: "${store_id}", employee_code: "E-100", display_name: "Cashier 100" }
              as: StoreManager
              as_user_id: "U-MGR-1"
              captures: { cashier_id: $.data.id }
            - call: "POST /cash-ops/sales-journals"
              payload: { store_id: "${store_id}", business_date: "2026-08-03" }
              as: CashOfficeClerk
              as_user_id: "U-CLERK-1"
              captures: { journal_id: $.data.id }
            - call: "POST /cash-ops/till-sessions"
              payload: { sales_journal_id: "${journal_id}", cashier_id: "${cashier_id}", safe_id: "${safe_id}", register_number: 1, shift_start_at: "2026-08-03T09:00:00Z", shift_end_at: "2026-08-03T17:00:00Z", starting_bank_cents: 20000 }
              as: StoreManager
              as_user_id: "U-MGR-1"
              captures: { session_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-03T17:00:00Z" }
              as: TreasuryAnalyst
            - call: "POST /cash-ops/till-sessions/${session_id}/close"
              payload: { pos_cash_sales_cents: 100000, pos_card_sales_cents: 0, pos_paid_out_cents: 0 }
              as: StoreManager
              as_user_id: "U-MGR-1"
            - call: "POST /cash-ops/till-sessions/${session_id}/blind-count"
              payload: { counted_lines: [{ denomination_cents: 2000, quantity: 30 }] }
              as: CashOfficeClerk
              as_user_id: "U-CLERK-3"
          trigger:
            - call: "POST /cash-ops/till-sessions/${session_id}/reconcile"
              payload: {}
              as: CashOfficeClerk
              as_user_id: "U-CLERK-1"
              captures: { variance: $.data.variance_cents, basis: $.data.variance_basis }
            - call: "GET /cash-ops/cashiers/${cashier_id}"
              payload: {}
              as: StoreManager
              as_user_id: "U-MGR-1"
              captures: { rolling: $.data.rolling_absolute_variance_cents }
            - call: "GET /cash-ops/sales-journals/${journal_id}"
              payload: {}
              as: StoreManager
              as_user_id: "U-MGR-1"
              captures: { journal_unexplained: $.data.net_unexplained_cents }
          assert:
            - "the reconcile response already reports status == \"RECONCILED\", expected_cash_cents == 120000, ${variance} == -60000 and ${basis} == \"DECLARED_DROPS\""
            - "the immediately following cashier read reports ${rolling} == 60000, reconciled_session_count == 1, coaching_state == \"COACHING_DUE\" and open_case_count == 1"
            - "the immediately following journal read reports ${journal_unexplained} == 60000 with open_case_count == 1 and reconciled_session_count == 1"
            - "GET /cash-ops/variance-cases?sales_journal_id=${journal_id} already returns the SESSION_VARIANCE case with suspected_theft == true (60000 >= 50000) and unexplained_cents == 60000"
            - "no value changes on a second identical round of reads — the first response was already final"
