      - name: completion_read_keeps_unreachable_notices_in_both_denominators
        claim_type: computed_read
        grounds:
          - endpoints[GET /mfg/recall-campaigns/{id}/completion]
          - endpoints[POST /mfg/recall-notices/{id}/mark-unreachable]
          - calculations.recall_completion_rate
          - state_machines.RecallNotice.NOTIFIED_to_UNREACHABLE
          - validations[priority 8]
          - validations[priority 32]
          - errors[ERR_INVALID_NOTICE_STATE]
          - errors[ERR_COMPLETION_BELOW_THRESHOLD]
        distinguishing_aspect: >
          An UNREACHABLE notice is terminal but stays in BOTH denominators, so a campaign can never be closed by
          writing off the owners it cannot reach: with 2 of 4 remedied and 1 unreachable the rate is 50.00, not the
          66.67 an implementation gets by dropping the unreachable notice, and remedying the last reachable owner
