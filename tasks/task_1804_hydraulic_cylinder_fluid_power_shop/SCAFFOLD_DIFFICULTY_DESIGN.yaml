            - { call: "POST /fluid-power/quotes/${quote_id}/send", payload: {}, as: ServiceAdvisor }
          trigger:
            - { call: "POST /fluid-power/quotes/${quote_id}/approve", payload: {}, as: Customer, as_user_id: "${cust_id}" }
            - { call: "GET /fluid-power/stock-reservations?work_order_id=${wo_id}", payload: {}, as: ServiceAdvisor, captures: { res_id: "$.data[0].id", res_item: "$.data[0].inventory_item_id" } }
            - { call: "GET /fluid-power/inventory-items/${rod_item_id}", payload: {}, as: ServiceAdvisor, captures: { item_len: "$.data.length_mm", item_status: "$.data.status" } }
          assert:
