            - { call: "POST /api/seasons/${season_id}/transition", payload: { to_state: "PLANTING" }, as: GardenAdmin }
            - { call: "POST /api/beds/${bed_id}/transition", payload: { to_state: "RESERVED" }, as: GardenAdmin }
            - { call: "POST /api/crop-plans/${plan_id}/transition", payload: { to_state: "PLANTED" }, as: GardenAdmin }
            - { call: "POST /api/beds/${bed_id}/transition", payload: { to_state: "PLANTED" }, as: GardenAdmin }
            - { call: "POST /api/seasons/${season_id}/transition", payload: { to_state: "GROWING" }, as: GardenAdmin }
            - { call: "POST /api/seasons/${season_id}/transition", payload: { to_state: "HARVESTING" }, as: GardenAdmin }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-09-15T12:00:00Z" }, as: GardenAdmin }
          trigger:
            - { call: "POST /api/beds/${bed_id}/transition", payload: { to_state: "POST_HARVEST" }, as: GardenAdmin, captures: { err_guard: $.data.error_id } }
            - { call: "POST /api/crop-plans/${plan_id}/transition", payload: { to_state: "COMPLETE" }, as: GardenAdmin }
            - { call: "POST /api/beds/${bed_id}/transition", payload: { to_state: "POST_HARVEST" }, as: GardenAdmin, captures: { bed_ph: $.data.status } }
            - { call: "POST /api/beds/${bed_id}/transition", payload: { to_state: "FALLOW" }, as: GardenAdmin, captures: { err_rest1: $.data.error_id } }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-09-28T12:00:00Z" }, as: GardenAdmin }
            - { call: "POST /api/beds/${bed_id}/transition", payload: { to_state: "FALLOW" }, as: GardenAdmin, captures: { err_rest2: $.data.error_id } }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-09-30T12:00:00Z" }, as: GardenAdmin }
