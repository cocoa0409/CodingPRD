# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index) — task 2946
# Nine §0.5 rule_ids × 2 instances = 18 instances.
# Every `grounds:` ref resolves into SCAFFOLD.yaml §1.1–§1.6; every
# `setup_api_calls` chain drives empty-DB → precondition using only §1.5
# endpoints; every formula-derived assert is a pre-computed literal.
# =============================================================================
scaffold_difficulty_design:
  - rule_id: dual_variant_calc
    instances:
      - name: visit_quote_insured_estimate_vs_self_pay_transparent
        grounds:
          - calculations.visit_price_quote
          - calculations.self_pay_discount
          - state_machines.Visit.UNBILLED_to_COVERAGE_VERIFIED
          - state_machines.Visit.UNBILLED_to_SELF_PAY_QUOTED
          - entities.Visit.fields.quoted_price_cents
        distinguishing_aspect: |
          Money domain on Visit: the same SORE_THROAT protocol (base_price_cents 9900) quotes
          3425 under INSURED_ESTIMATE and 9900 under SELF_PAY_TRANSPARENT, because the insured
          variant reads copay_cents/coinsurance_pct while the self-pay variant reads only the
          pre-discount subtotal tier — a 6475-cent divergence on identical protocol data.
        test_recipe:
          setup:
            - "CA StateRule exists (min_independent_practice_age_months 24, chart_review_sample_pct 40, review_deadline_hours 72, controlled_rx_allowed false, max_supervised_clinicians_per_physician 3)."
            - "SORE_THROAT protocol offered in CA with base_price_cents 9900, acuity_tier 2, requires_cosign true."
            - "One CA clinic, OPEN with one ACTIVE clinician; logical clock at the 2026-08-01T00:00:00Z startup default."
            - "Two adult patients: one with payer_name Aetna, one with no payer_name; each has a visit open in SCREENING/UNBILLED."
          setup_api_calls:
            - call: "POST /state-rules"
              payload: { state_code: "CA", chart_review_sample_pct: 40, review_deadline_hours: 72, collaborating_physician_required: true, min_independent_practice_age_months: 24, controlled_rx_allowed: false, max_supervised_clinicians_per_physician: 3 }
              as: ClinicAdmin
            - call: "POST /protocols"
              payload: { complaint_code: "SORE_THROAT", min_age_months: 12, max_age_months: 1200, base_price_cents: 9900, acuity_tier: 2, red_flag_codes: ["STRIDOR", "DROOLING"], max_temp_c: 39.5, max_heart_rate_bpm: 120, min_spo2_pct: 92, requires_cosign: true, allowed_state_codes: ["CA"] }
              as: ClinicAdmin
              captures: { proto_throat_id: $.data.id }
            - call: "POST /clinics"
              payload: { name: "CA Store 1", state_code: "CA", min_clinicians_required: 1, appointment_slots_per_hour: 2, walk_in_queue_capacity: 5 }
              as: ClinicAdmin
              captures: { clinic_ca_id: $.data.id }
            - call: "POST /physicians"
              payload: { full_name: "Dr Alba", licensed_state_codes: ["CA"], max_supervised_clinicians: 3 }
              as: ClinicAdmin
              captures: { phys_a_id: $.data.id }
            - call: "POST /clinicians"
              payload: { full_name: "NP One", credential: "NP", license_state_code: "CA", home_clinic_id: "${clinic_ca_id}", supervising_physician_id: "${phys_a_id}", float_eligible: false }
              as: ClinicAdmin
              captures: { clin_one_id: $.data.id }
            - call: "POST /staffing-assignments"
              payload: { clinic_id: "${clinic_ca_id}", clinician_id: "${clin_one_id}", role_kind: "PRIMARY", starts_at: "2026-08-01T00:00:00Z", ends_at: "2026-08-01T23:00:00Z", pinned_supervising_physician_id: "${phys_a_id}" }
              as: ClinicAdmin
              captures: { asg_one_id: $.data.id }
            - call: "POST /patients"
              payload: { full_name: "Ada Insured", date_of_birth: "1990-05-10", payer_name: "Aetna", member_id: "M-1001", pcp_name: "Dr Pace", pcp_direct_address: "pace@direct.example", pcp_accepts_electronic_summary: true, pcp_consent_on_file: true }
              as: FrontDeskAgent
              captures: { pat_ins_id: $.data.id }
            - call: "POST /patients"
              payload: { full_name: "Ben Cash", date_of_birth: "1988-03-02", pcp_consent_on_file: false }
              as: FrontDeskAgent
              captures: { pat_cash_id: $.data.id }
            - call: "POST /queue-entries"
              payload: { clinic_id: "${clinic_ca_id}", patient_id: "${pat_ins_id}", kind: "WALK_IN", complaint_code: "SORE_THROAT" }
              as: FrontDeskAgent
              captures: { qe_ins_id: $.data.id }
            - call: "POST /clinics/${clinic_ca_id}/call-next"
              payload: {}
              as: Clinician
              as_user_id: "${clin_one_id}"
            - call: "POST /visits"
              payload: { queue_entry_id: "${qe_ins_id}" }
              as: Clinician
              as_user_id: "${clin_one_id}"
              captures: { visit_ins_id: $.data.id }
            - call: "POST /queue-entries"
              payload: { clinic_id: "${clinic_ca_id}", patient_id: "${pat_cash_id}", kind: "WALK_IN", complaint_code: "SORE_THROAT" }
              as: FrontDeskAgent
              captures: { qe_cash_id: $.data.id }
            - call: "POST /clinics/${clinic_ca_id}/call-next"
              payload: {}
              as: Clinician
              as_user_id: "${clin_one_id}"
            - call: "POST /visits"
              payload: { queue_entry_id: "${qe_cash_id}" }
              as: Clinician
              as_user_id: "${clin_one_id}"
              captures: { visit_cash_id: $.data.id }
          trigger:
            - call: "POST /visits/${visit_ins_id}/eligibility-check"
              payload: { coverage_status: "ACTIVE", copay_cents: 2500, coinsurance_pct: 12.5 }
              as: FrontDeskAgent
              captures: { ins_quote: $.data.quoted_price_cents }
            - call: "POST /visits/${visit_cash_id}/eligibility-check"
              payload: { coverage_status: "INACTIVE" }
              as: FrontDeskAgent
              captures: { cash_quote: $.data.quoted_price_cents }
          assert:
            - "Visit.${visit_ins_id}.quoted_price_cents == 3425"
            - "Visit.${visit_ins_id}.billing_status == COVERAGE_VERIFIED"
            - "Visit.${visit_ins_id}.self_pay == false"
            - "Visit.${visit_cash_id}.quoted_price_cents == 9900"
            - "Visit.${visit_cash_id}.billing_status == SELF_PAY_QUOTED"
            - "Visit.${visit_cash_id}.self_pay == true"
            - "Visit.${visit_cash_id}.copay_cents == null and Visit.${visit_cash_id}.coinsurance_pct == null"

      - name: wait_time_posted_projection_vs_realized_actual
        grounds:
          - calculations.wait_time_estimate
          - calculations.call_next_selection
          - entities.Clinic.fields.posted_wait_minutes
          - entities.Clinic.fields.last_realized_wait_minutes
          - entities.QueueEntry.fields.realized_wait_minutes
        distinguishing_aspect: |
          Queue-throughput domain on Clinic (not money, not Visit): with waiting_count 3,
          on_duty_clinician_count 2 and one appointment inside the next 60 minutes the
          POSTED_PROJECTION variant publishes 50 minutes, while the REALIZED_ACTUAL variant
          measures 25 minutes for the entry actually called — the projection never reads
          called_at and the realized value never reads staffing or appointments.
        test_recipe:
          setup:
            - "CA StateRule and the SORE_THROAT protocol exist as in the first instance."
            - "One CA clinic with min_clinicians_required 1, appointment_slots_per_hour 2, walk_in_queue_capacity 5."
            - "Two clinicians hold ACTIVE assignments, so on_duty_clinician_count == 2 and open_status == OPEN."
            - "Logical clock at 2026-08-01T08:00:00Z; one APPOINTMENT is booked for 08:30 and three walk-ins are WAITING."
          setup_api_calls:
            - call: "POST /state-rules"
              payload: { state_code: "CA", chart_review_sample_pct: 40, review_deadline_hours: 72, collaborating_physician_required: true, min_independent_practice_age_months: 24, controlled_rx_allowed: false, max_supervised_clinicians_per_physician: 3 }
              as: ClinicAdmin
            - call: "POST /protocols"
              payload: { complaint_code: "SORE_THROAT", min_age_months: 12, max_age_months: 1200, base_price_cents: 9900, acuity_tier: 2, red_flag_codes: ["STRIDOR"], max_temp_c: 39.5, max_heart_rate_bpm: 120, min_spo2_pct: 92, requires_cosign: true, allowed_state_codes: ["CA"] }
              as: ClinicAdmin
            - call: "POST /clinics"
              payload: { name: "CA Store 2", state_code: "CA", min_clinicians_required: 1, appointment_slots_per_hour: 2, walk_in_queue_capacity: 5 }
              as: ClinicAdmin
              captures: { clinic_w_id: $.data.id }
            - call: "POST /physicians"
              payload: { full_name: "Dr Bell", licensed_state_codes: ["CA"], max_supervised_clinicians: 3 }
              as: ClinicAdmin
              captures: { phys_b_id: $.data.id }
            - call: "POST /clinicians"
              payload: { full_name: "NP Alpha", credential: "NP", license_state_code: "CA", home_clinic_id: "${clinic_w_id}", supervising_physician_id: "${phys_b_id}" }
              as: ClinicAdmin
              captures: { clin_a_id: $.data.id }
            - call: "POST /clinicians"
              payload: { full_name: "PA Beta", credential: "PA", license_state_code: "CA", home_clinic_id: "${clinic_w_id}", supervising_physician_id: "${phys_b_id}" }
              as: ClinicAdmin
              captures: { clin_b_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T08:00:00Z" }
              as: ClinicAdmin
            - call: "POST /staffing-assignments"
              payload: { clinic_id: "${clinic_w_id}", clinician_id: "${clin_a_id}", role_kind: "PRIMARY", starts_at: "2026-08-01T08:00:00Z", ends_at: "2026-08-01T18:00:00Z", pinned_supervising_physician_id: "${phys_b_id}" }
              as: ClinicAdmin
            - call: "POST /staffing-assignments"
              payload: { clinic_id: "${clinic_w_id}", clinician_id: "${clin_b_id}", role_kind: "PRIMARY", starts_at: "2026-08-01T08:00:00Z", ends_at: "2026-08-01T18:00:00Z", pinned_supervising_physician_id: "${phys_b_id}" }
              as: ClinicAdmin
            - call: "POST /patients"
              payload: { full_name: "Appt Patient", date_of_birth: "1975-01-01" }
              as: FrontDeskAgent
              captures: { pat_appt_id: $.data.id }
            - call: "POST /patients"
              payload: { full_name: "Walk One", date_of_birth: "1980-01-01" }
              as: FrontDeskAgent
              captures: { pat_w1_id: $.data.id }
            - call: "POST /patients"
              payload: { full_name: "Walk Two", date_of_birth: "1981-01-01" }
              as: FrontDeskAgent
              captures: { pat_w2_id: $.data.id }
            - call: "POST /patients"
              payload: { full_name: "Walk Three", date_of_birth: "1982-01-01" }
              as: FrontDeskAgent
              captures: { pat_w3_id: $.data.id }
            - call: "POST /queue-entries"
              payload: { clinic_id: "${clinic_w_id}", patient_id: "${pat_appt_id}", kind: "APPOINTMENT", complaint_code: "SORE_THROAT", scheduled_at: "2026-08-01T08:30:00Z" }
              as: FrontDeskAgent
            - call: "POST /queue-entries"
              payload: { clinic_id: "${clinic_w_id}", patient_id: "${pat_w1_id}", kind: "WALK_IN", complaint_code: "SORE_THROAT" }
              as: FrontDeskAgent
              captures: { qe_w1_id: $.data.id }
            - call: "POST /queue-entries"
              payload: { clinic_id: "${clinic_w_id}", patient_id: "${pat_w2_id}", kind: "WALK_IN", complaint_code: "SORE_THROAT" }
              as: FrontDeskAgent
            - call: "POST /queue-entries"
              payload: { clinic_id: "${clinic_w_id}", patient_id: "${pat_w3_id}", kind: "WALK_IN", complaint_code: "SORE_THROAT" }
              as: FrontDeskAgent
            - call: "GET /clinics/${clinic_w_id}"
              payload: {}
              as: ClinicAdmin
              captures: { posted_before: $.data.posted_wait_minutes }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T08:25:00Z" }
              as: ClinicAdmin
          trigger:
            - call: "POST /clinics/${clinic_w_id}/call-next"
              payload: {}
              as: Clinician
              as_user_id: "${clin_a_id}"
              captures: { called_id: $.data.id, called_wait: $.data.realized_wait_minutes }
          assert:
            - "${posted_before} == 50   # POSTED_PROJECTION: min(120, ceil(3/2)*20 + 10*1)"
            - "${called_id} == ${qe_w1_id}   # tie on priority_score 225 broken by arrived_at ASC then created_at ASC"
            - "QueueEntry.${qe_w1_id}.realized_wait_minutes == 25   # REALIZED_ACTUAL: floor((08:25 - 08:00)/60s)"
            - "QueueEntry.${qe_w1_id}.status == CALLED"
            - "Clinic.${clinic_w_id}.last_realized_wait_minutes == 25"
            - "Clinic.${clinic_w_id}.waiting_count == 2"
            - "Clinic.${clinic_w_id}.posted_wait_minutes == 30   # min(120, ceil(2/2)*20 + 10*1) — diverges from the realized 25"

  - rule_id: combinatorial_formula
    instances:
      - name: checkout_rounds_each_line_then_sums_not_sum_then_round
        grounds:
          - calculations.visit_price_final
          - entities.Visit.fields.patient_responsibility_cents
          - entities.Visit.fields.payer_responsibility_cents
          - state_machines.Visit.COVERAGE_VERIFIED_to_INVOICED
        distinguishing_aspect: |
          Mode (b) — nested rounding whose ORDER is observable: base 9900 + RAPID_STREP_TEST 3500
          + URINALYSIS 2800 at coinsurance_pct 12.5 with copay 2500 gives per-line shares
          [1238, 438, 350] and patient_responsibility_cents 4526, whereas the forbidden
          sum-then-round order yields 4525; the scaffold pins round-per-line-then-sum.
        test_recipe:
          setup:
            - "CA StateRule and SORE_THROAT protocol (base 9900, requires_cosign true) exist."
            - "An insured visit is TREATED with a COSIGNED assessment and billing_status COVERAGE_VERIFIED (copay_cents 2500, coinsurance_pct 12.5)."
          setup_api_calls:
            - call: "POST /state-rules"
              payload: { state_code: "CA", chart_review_sample_pct: 40, review_deadline_hours: 72, collaborating_physician_required: true, min_independent_practice_age_months: 24, controlled_rx_allowed: false, max_supervised_clinicians_per_physician: 3 }
              as: ClinicAdmin
            - call: "POST /protocols"
              payload: { complaint_code: "SORE_THROAT", min_age_months: 12, max_age_months: 1200, base_price_cents: 9900, acuity_tier: 2, red_flag_codes: ["STRIDOR"], max_temp_c: 39.5, max_heart_rate_bpm: 120, min_spo2_pct: 92, requires_cosign: true, allowed_state_codes: ["CA"] }
              as: ClinicAdmin
            - call: "POST /clinics"
              payload: { name: "CA Store 3", state_code: "CA", min_clinicians_required: 1, appointment_slots_per_hour: 2, walk_in_queue_capacity: 5 }
              as: ClinicAdmin
              captures: { clinic_p_id: $.data.id }
            - call: "POST /physicians"
              payload: { full_name: "Dr Cove", licensed_state_codes: ["CA"], max_supervised_clinicians: 3 }
              as: ClinicAdmin
              captures: { phys_c_id: $.data.id }
            - call: "POST /clinicians"
              payload: { full_name: "NP Pine", credential: "NP", license_state_code: "CA", home_clinic_id: "${clinic_p_id}", supervising_physician_id: "${phys_c_id}" }
              as: ClinicAdmin
              captures: { clin_p_id: $.data.id }
            - call: "POST /staffing-assignments"
              payload: { clinic_id: "${clinic_p_id}", clinician_id: "${clin_p_id}", role_kind: "PRIMARY", starts_at: "2026-08-01T00:00:00Z", ends_at: "2026-08-01T23:00:00Z", pinned_supervising_physician_id: "${phys_c_id}" }
              as: ClinicAdmin
            - call: "POST /patients"
              payload: { full_name: "Cora Covered", date_of_birth: "1979-11-11", payer_name: "BlueCo", member_id: "M-2002", pcp_consent_on_file: false }
              as: FrontDeskAgent
              captures: { pat_cov_id: $.data.id }
            - call: "POST /queue-entries"
              payload: { clinic_id: "${clinic_p_id}", patient_id: "${pat_cov_id}", kind: "WALK_IN", complaint_code: "SORE_THROAT" }
              as: FrontDeskAgent
              captures: { qe_cov_id: $.data.id }
            - call: "POST /clinics/${clinic_p_id}/call-next"
              payload: {}
              as: Clinician
              as_user_id: "${clin_p_id}"
            - call: "POST /visits"
              payload: { queue_entry_id: "${qe_cov_id}" }
              as: Clinician
              as_user_id: "${clin_p_id}"
              captures: { visit_cov_id: $.data.id }
            - call: "POST /assessments"
              payload: { visit_id: "${visit_cov_id}", temp_c: 37.2, heart_rate_bpm: 84, spo2_pct: 98, red_flag_codes: [] }
              as: Clinician
              as_user_id: "${clin_p_id}"
              captures: { assess_cov_id: $.data.id }
            - call: "POST /assessments/${assess_cov_id}/submit"
              payload: {}
              as: Clinician
              as_user_id: "${clin_p_id}"
            - call: "POST /assessments/${assess_cov_id}/cosign"
              payload: {}
              as: CollaboratingPhysician
              as_user_id: "${phys_c_id}"
            - call: "POST /visits/${visit_cov_id}/eligibility-check"
              payload: { coverage_status: "ACTIVE", copay_cents: 2500, coinsurance_pct: 12.5 }
              as: FrontDeskAgent
          trigger:
            - call: "POST /visits/${visit_cov_id}/checkout"
              payload: { services_rendered: ["RAPID_STREP_TEST", "URINALYSIS"] }
              as: Clinician
              as_user_id: "${clin_p_id}"
          assert:
            - "Visit.${visit_cov_id}.final_price_cents == 16200"
            - "Visit.${visit_cov_id}.patient_responsibility_cents == 4526"
            - "Visit.${visit_cov_id}.patient_responsibility_cents != 4525   # sum-then-round is the forbidden order"
            - "Visit.${visit_cov_id}.payer_responsibility_cents == 11674"
            - "Visit.${visit_cov_id}.patient_responsibility_cents + Visit.${visit_cov_id}.payer_responsibility_cents == 16200"
            - "Visit.${visit_cov_id}.clinical_status == CLOSED and Visit.${visit_cov_id}.billing_status == INVOICED"
            - "Patient.${pat_cov_id}.outstanding_balance_cents == 4526"

      - name: self_pay_tier_keyed_on_pre_discount_subtotal
        grounds:
          - calculations.self_pay_discount
          - calculations.visit_price_final
          - state_machines.Visit.SELF_PAY_ACCEPTED_to_INVOICED
          - entities.Visit.fields.final_price_cents
        distinguishing_aspect: |
          Mode (c) — a circular-looking dependency with a pinned evaluation order: the discount
          tier is selected from the PRE-discount subtotal 22700 (tier 15%, discount 3405, total
          19295); reading the tier off the post-discount total 19295 would select 10% and yield
          20430, so the two orders are distinguishable by a single literal.
        test_recipe:
          setup:
            - "CA StateRule exists; a UTI protocol offered in CA with base_price_cents 12000, requires_cosign false."
            - "A self-pay visit (no payer_name) is TREATED and has billing_status SELF_PAY_ACCEPTED against the 10800 quote."
          setup_api_calls:
            - call: "POST /state-rules"
              payload: { state_code: "CA", chart_review_sample_pct: 40, review_deadline_hours: 72, collaborating_physician_required: true, min_independent_practice_age_months: 24, controlled_rx_allowed: false, max_supervised_clinicians_per_physician: 3 }
              as: ClinicAdmin
            - call: "POST /protocols"
              payload: { complaint_code: "UTI", min_age_months: 24, max_age_months: 1200, base_price_cents: 12000, acuity_tier: 2, red_flag_codes: ["FLANK_PAIN"], max_temp_c: 39.5, max_heart_rate_bpm: 120, min_spo2_pct: 92, requires_cosign: false, allowed_state_codes: ["CA"] }
              as: ClinicAdmin
            - call: "POST /clinics"
              payload: { name: "CA Store 4", state_code: "CA", min_clinicians_required: 1, appointment_slots_per_hour: 2, walk_in_queue_capacity: 5 }
              as: ClinicAdmin
              captures: { clinic_s_id: $.data.id }
            - call: "POST /physicians"
              payload: { full_name: "Dr Dune", licensed_state_codes: ["CA"], max_supervised_clinicians: 3 }
              as: ClinicAdmin
              captures: { phys_d_id: $.data.id }
            - call: "POST /clinicians"
              payload: { full_name: "PA Sage", credential: "PA", license_state_code: "CA", home_clinic_id: "${clinic_s_id}", supervising_physician_id: "${phys_d_id}" }
              as: ClinicAdmin
              captures: { clin_s_id: $.data.id }
            - call: "POST /staffing-assignments"
              payload: { clinic_id: "${clinic_s_id}", clinician_id: "${clin_s_id}", role_kind: "PRIMARY", starts_at: "2026-08-01T00:00:00Z", ends_at: "2026-08-01T23:00:00Z", pinned_supervising_physician_id: "${phys_d_id}" }
              as: ClinicAdmin
            - call: "POST /patients"
              payload: { full_name: "Sam Selfpay", date_of_birth: "1985-06-06", pcp_consent_on_file: false }
              as: FrontDeskAgent
              captures: { pat_sp_id: $.data.id }
            - call: "POST /queue-entries"
              payload: { clinic_id: "${clinic_s_id}", patient_id: "${pat_sp_id}", kind: "WALK_IN", complaint_code: "UTI" }
              as: FrontDeskAgent
              captures: { qe_sp_id: $.data.id }
            - call: "POST /clinics/${clinic_s_id}/call-next"
              payload: {}
              as: Clinician
              as_user_id: "${clin_s_id}"
            - call: "POST /visits"
              payload: { queue_entry_id: "${qe_sp_id}" }
              as: Clinician
              as_user_id: "${clin_s_id}"
              captures: { visit_sp_id: $.data.id }
            - call: "POST /assessments"
              payload: { visit_id: "${visit_sp_id}", temp_c: 37.1, heart_rate_bpm: 78, spo2_pct: 99, red_flag_codes: [] }
              as: Clinician
              as_user_id: "${clin_s_id}"
              captures: { assess_sp_id: $.data.id }
            - call: "POST /assessments/${assess_sp_id}/submit"
              payload: {}
              as: Clinician
              as_user_id: "${clin_s_id}"
            - call: "POST /visits/${visit_sp_id}/eligibility-check"
              payload: { coverage_status: "INACTIVE" }
              as: FrontDeskAgent
              captures: { sp_quote: $.data.quoted_price_cents }
            - call: "POST /visits/${visit_sp_id}/accept-self-pay"
              payload: { acknowledged_price_cents: 10800 }
              as: Patient
              as_user_id: "${pat_sp_id}"
          trigger:
            - call: "POST /visits/${visit_sp_id}/checkout"
              payload: { services_rendered: ["INJECTION_ADMIN", "EKG"] }
              as: Clinician
              as_user_id: "${clin_s_id}"
          assert:
            - "${sp_quote} == 10800   # quote-time subtotal 12000 → tier 10% → 12000 - 1200"
            - "Visit.${visit_sp_id}.final_price_cents == 19295   # subtotal 22700 → tier 15% → discount 3405"
            - "Visit.${visit_sp_id}.final_price_cents != 20430   # tier keyed on the post-discount total is the forbidden order"
            - "Visit.${visit_sp_id}.patient_responsibility_cents == 19295"
            - "Visit.${visit_sp_id}.payer_responsibility_cents == 0"
            - "Visit.${visit_sp_id}.billing_status == INVOICED"
            - "Patient.${pat_sp_id}.outstanding_balance_cents == 19295"

  - rule_id: non_linear_state_machine
    instances:
      - name: visit_billing_and_clinical_dimensions_advance_independently
        grounds:
          - state_machines.Visit.UNBILLED_to_COVERAGE_VERIFIED
          - state_machines.Visit.SCREENING_to_IN_ASSESSMENT
          - entities.Visit.fields.clinical_status
          - entities.Visit.fields.billing_status
        distinguishing_aspect: |
