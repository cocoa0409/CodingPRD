              payload: { season_pass_id: "${pass_b}", source_tier_id: "${bronze}", target_tier_id: "${gold}", credit_mode: "PAID_TO_DATE" }
              as: PassOfficeClerk
              captures: { ord_b: "$.data.id" }
          trigger:
            - call: "POST /upgrade-orders"
              payload: { season_pass_id: "${pass_g}", source_tier_id: "${gold}", target_tier_id: "${bronze}", credit_mode: "PAID_TO_DATE" }
              as: PassOfficeClerk
              captures: { e84a: "$.data.error_id" }
            - call: "POST /upgrade-orders"
              payload: { season_pass_id: "${pass_g}", source_tier_id: "${bronze}", target_tier_id: "${gold}", credit_mode: "PAID_TO_DATE" }
              as: PassOfficeClerk
              captures: { e84b: "$.data.error_id" }
            - call: "POST /upgrade-orders/${ord_b}/apply"
              payload: { payment_amount_cents: 6000 }
              as: PassOfficeClerk
              captures: { e103: "$.data.error_id" }
            - call: "POST /upgrade-orders/${ord_b}/apply"
              payload: { payment_amount_cents: 7000 }
              as: PassOfficeClerk
          assert:
            - "first trigger: HTTP 422 with data.error_id == 'ERR_NOT_AN_UPGRADE' (BRONZE 12000 <= GOLD 30000 is a downgrade)"
            - "second trigger: HTTP 422 with data.error_id == 'ERR_NOT_AN_UPGRADE' (source_tier_id is not pass G's current tier)"
            - "third trigger: HTTP 422 with data.error_id == 'ERR_UPGRADE_PAYMENT_INSUFFICIENT' (6000 omits the 1000 admin fee) and GET /upgrade-orders/${ord_b} → data.status == 'QUOTED'"
            - "fourth trigger: HTTP 200 with data.status == 'APPLIED' and GET /season-passes/${pass_b} → data.tier_id == '${gold}' and data.paid_to_date_cents == 19000"
            - "GET /upgrade-orders?season_pass_id=${pass_g} → data.total_count == 0"

      - name: day_level_capacity_is_exhausted_before_the_window_rule_applies
        claim_type: error_triggerable
        grounds:
          - validations[priority=100]
          - errors[ERR_PARK_DAY_CAPACITY_FULL]
          - calculations.park_day_capacity_posture
        distinguishing_aspect: "A tiny day (capacity 10, forecast 9) yields exactly one reservation slot, so the second booking is refused by the day-level rule at priority 100 even though its [15:00, 16:00) window overlaps nothing — proving 100 is checked before the window rule at 101."
        test_recipe:
          setup:
            - "Program in SEASON_ACTIVE with PUBLISHED BRONZE and a park day 2026-09-01 with capacity_total 10 and forecast_attendance 9 → 0.9000 PEAK, reservation_slot_capacity 1, window_slot_capacity 1."
            - "Two holders, each with a processed ACTIVE BRONZE pass; holder A already holds the only slot on [09:00, 10:00)."
          setup_api_calls:
            - call: "POST /pass-programs"
