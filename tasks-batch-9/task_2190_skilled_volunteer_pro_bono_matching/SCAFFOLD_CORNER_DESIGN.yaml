      - name: error_invalid_scope_state_beats_weight_total_on_approved_revision
        claim_type: error_triggerable
        grounds: ["errors[ERR_INVALID_SCOPE_STATE]", "validations[priority=21]", "validations[priority=47]", "endpoints[POST /scope-definitions/{id}/deliverables]"]
        distinguishing_aspect: "Adding a 50.00-weight deliverable to an already-APPROVED revision would break the 100.00 total as well, but the priority-21 DRAFT-only rule fires first: 409 ERR_INVALID_SCOPE_STATE, and deliverable_count stays 1 with the total still exactly 100.00."
        test_recipe:
          setup: ["A SCOPED request whose revision is APPROVED with one 100.00-weight deliverable."]
