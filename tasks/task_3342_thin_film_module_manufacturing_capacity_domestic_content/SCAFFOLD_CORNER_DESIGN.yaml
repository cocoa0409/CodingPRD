        distinguishing_aspect: "Zero-shipment baseline: shipped_volume_mw 0.0 -> required_collected_mw == 0.0000 and fulfillment_pct == 1.0 by definition, so OPEN -> SETTLED is allowed directly with no collections."
        test_recipe:
          setup: ["Customer C exists; RecyclingObligation with shipped_volume_mw 0.0"]
          setup_api_calls:
            - call: "POST /v1/customers"
              payload: { legal_name: "Acme Solar Dev", credit_tier: "TIER_A", tax_credit_flag: false }
              as: ContractsOfficer
              captures: { cust_id: $.data.id }
            - call: "POST /v1/recycling-obligations"
              payload: { customer_id: "${cust_id}", period_year: 2026, shipped_volume_mw: 0.0 }
              as: RecyclingCoordinator
              captures: { obl_id: $.data.id }
          trigger:
            - call: "POST /v1/recycling-obligations/${obl_id}/settle"
              payload: {}
              as: RecyclingCoordinator
          assert:
            - "RecyclingObligation.${obl_id}.required_collected_mw == 0.0"
            - "RecyclingObligation.${obl_id}.fulfillment_pct == 1.0"
            - "RecyclingObligation.${obl_id}.status == SETTLED"

