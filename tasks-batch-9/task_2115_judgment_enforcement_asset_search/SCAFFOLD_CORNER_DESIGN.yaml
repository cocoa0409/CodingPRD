          - entities.SettlementOffer.fields.round_number
        distinguishing_aspect: "After four alternating offers (round_number 1..4) a fifth counter would be round_number 5 and returns ERR_NEGOTIATION_ROUNDS_EXHAUSTED (409); the round-4 offer stays OPEN rather than moving to COUNTERED."
        test_recipe:
          setup:
