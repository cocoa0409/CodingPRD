# =============================================================================
# Scaffold: International Remittance (Wise / Western Union style) — Expert band
# =============================================================================
# §1.0–§1.7 only. SCAFFOLD_DIFFICULTY_DESIGN.yaml (§1.8) and
# SCAFFOLD_CORNER_DESIGN.yaml (§1.9) live in sibling files.
# =============================================================================

scenario: |
  International Remittance (Wise/Western Union style): payout method
  (bank/cash pickup/wallet), FX quote & rate-lock margin, corridor send limits,
  recipient KYC, sanctions/compliance hold, fee + exchange-rate disclosure,
  delivery tracking, refund/cancellation

domain_name: international-remittance
api_prefix: ""

# Step 0 — Complexity Profile -------------------------------------------------
complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: workflow_orchestration
  complexity_layers:
    - dual_variant_calculation        # provisional vs final refund; aggressive vs strict sanctions scoring
    - cascading_side_effects          # transfer create -> quote consume -> corridor reserve -> ledger debit
    - rate_threshold_triggers         # corridor rolling-window + per-KYC-tier send limits
    - optimistic_concurrency          # OCC on Quote.version for transfer create against a stale locked rate

  entity_topology: flat
  # Peer entities under top-level collections, linked by FK fields in bodies.
  # No nested resource URLs; every child discoverable via filtered-list GET.

  state_machine_shape: parallel
  # Transfer carries TWO independent state axes: compliance_status × delivery_status.
  # ComplianceCase is cyclic (REQUEST_INFO loop); Recipient KYC is branching-with-revert.

  relationship_patterns:
    - one_to_many        # Sender -> Recipient, Sender -> Transfer, Transfer -> PayoutAttempt/LedgerEntry
    - cross_aggregate    # Transfer references Quote, Corridor, Sender, Recipient across aggregates
    - polymorphic        # SanctionsHit.subject_kind references Sender OR Recipient

  role_model: segregation_of_duties
  # The agent who books/funds a transfer cannot be the compliance officer who
  # clears its sanctions hold. Distinct roles own distinct steps.

  consistency_model: immediate
  # All derived fields (corridor reservations, ledger balances, transfer
  # aggregate status) reconcile inside the triggering request.

# =============================================================================
# §1.0 Response Envelope (FIXED — EMIT VERBATIM)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Corridor
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Human label, e.g. 'US -> PH'" }
      - { name: send_country, type: string, source: input, description: "ISO-3166 alpha-2 origin country, e.g. 'US'" }
      - { name: receive_country, type: string, source: input, description: "ISO-3166 alpha-2 destination country, e.g. 'PH'" }
      - { name: send_currency, type: string, source: input, description: "ISO-4217 send currency, e.g. 'USD'" }
      - { name: receive_currency, type: string, source: input, description: "ISO-4217 receive currency, e.g. 'PHP'" }
      - { name: enabled_payout_methods, type: array, source: input, description: "Subset of {BANK, CASH_PICKUP, WALLET} this corridor supports" }
      - { name: fx_margin_bps, type: integer, source: input, description: "Provider FX margin in basis points applied against mid-market rate; 1 bps = 0.0001" }
      - { name: fee_flat_minor, type: integer, source: input, description: "Flat fee component in send-currency minor units (cents)" }
      - { name: fee_pct_bps, type: integer, source: input, description: "Percentage fee in basis points of send principal" }
      - { name: fee_tier_threshold_minor, type: integer, source: input, description: "Send principal at/above which the discounted fee_pct_tier2_bps applies (inclusive)" }
      - { name: fee_pct_tier2_bps, type: integer, source: input, description: "Discounted percentage-fee bps for principal at/above fee_tier_threshold_minor" }
      - { name: per_transfer_max_minor, type: integer, source: input, description: "Maximum single-transfer send principal in minor units" }
      - { name: rolling_window_hours, type: integer, source: input, default: 24, description: "Length of the rolling cumulative-send window in hours" }
      - { name: rolling_window_cap_minor, type: integer, source: input, description: "Max cumulative funded send principal per sender within rolling_window_hours" }
      - { name: rate_lock_ttl_seconds, type: integer, source: input, default: 1800, description: "Quote rate-lock validity duration from lock time" }
      - { name: reserved_minor, type: integer, source: computed, default: 0, description: "Sum of send principal across FUNDED transfers on this corridor not yet DELIVERED/REFUNDED; restored on refund" }
      - { name: status, type: enum, source: system, default: "ACTIVE", description: "ACTIVE | SUSPENDED — SUSPENDED blocks new quotes and transfers" }

  - name: FxRate
    parent: null
    common_fields: false
    fields:
      - { name: corridor_id, type: string, source: input, description: "FK -> Corridor.id; the corridor this mid-market snapshot prices" }
      - { name: mid_rate_micro, type: integer, source: input, description: "Mid-market rate receive-per-send, scaled by 1e6 (e.g. 56.25 PHP/USD = 56250000)" }
      - { name: effective_at, type: datetime, source: input, description: "ISO-8601 UTC instant from which this snapshot is the prevailing rate" }

  - name: Sender
    parent: null
    common_fields: true
    fields:
      - { name: full_name, type: string, source: input, description: "Legal full name, screened against sanctions list" }
      - { name: country, type: string, source: input, description: "ISO-3166 alpha-2 residence country" }
      - { name: date_of_birth, type: string, source: input, description: "YYYY-MM-DD; used as a sanctions secondary identifier" }
      - { name: kyc_tier, type: enum, source: system, default: "TIER0", description: "TIER0 | TIER1 | TIER2 — set by verify_kyc; gates per-transfer ceilings" }
      - { name: status, type: enum, source: system, default: "ACTIVE", description: "ACTIVE | BLOCKED — BLOCKED by a confirmed sanctions match" }

  - name: Recipient
    parent: null
    common_fields: true
    fields:
      - { name: sender_id, type: string, source: input, description: "FK -> Sender.id; the sender who owns this beneficiary record" }
      - { name: full_name, type: string, source: input, description: "Legal full name of beneficiary, screened against sanctions list" }
      - { name: country, type: string, source: input, description: "ISO-3166 alpha-2 country where funds are received" }
      - { name: payout_method, type: enum, source: input, description: "BANK | CASH_PICKUP | WALLET" }
      - { name: payout_account_ref, type: string, source: input, description: "Account number / wallet handle / pickup partner code per payout_method" }
      - { name: kyc_status, type: enum, source: system, default: "UNVERIFIED", description: "UNVERIFIED | PENDING_REVIEW | VERIFIED | REJECTED — gates transfer creation" }
      - { name: kyc_doc_ref, type: string, source: system, default: null, description: "Reference to the most recently submitted KYC document" }
      - { name: kyc_review_count, type: integer, source: computed, default: 0, description: "Number of times this recipient re-entered PENDING_REVIEW after a REJECTED outcome" }

  - name: Quote
    parent: null
    common_fields: true
    fields:
      - { name: corridor_id, type: string, source: input, description: "FK -> Corridor.id; corridor being priced" }
      - { name: sender_id, type: string, source: input, description: "FK -> Sender.id; sender requesting the quote (rate-lock holder)" }
      - { name: send_principal_minor, type: integer, source: input, description: "Send-currency principal the sender wants delivered net of fee, in minor units" }
      - { name: payout_method, type: enum, source: input, description: "BANK | CASH_PICKUP | WALLET — must be in corridor.enabled_payout_methods" }
      - { name: mid_rate_micro, type: integer, source: computed, description: "Mid-market rate (1e6 scale) snapshotted from the prevailing FxRate at lock time" }
      - { name: locked_rate_micro, type: integer, source: computed, description: "Customer-facing rate = mid_rate_micro * (10000 - corridor.fx_margin_bps) / 10000, floor-rounded" }
      - { name: fee_minor, type: integer, source: computed, description: "Total disclosed send-side fee in minor units (see calculations.quote_fee)" }
      - { name: recipient_amount_minor, type: integer, source: computed, description: "Disclosed amount delivered in receive-currency minor units (see calculations.recipient_amount)" }
      - { name: total_pay_minor, type: integer, source: computed, description: "Total the sender pays = send_principal_minor + fee_minor" }
      - { name: locked_at, type: datetime, source: system, default: null, description: "Instant the rate-lock began; null until LOCKED" }
      - { name: expires_at, type: datetime, source: system, default: null, description: "locked_at + corridor.rate_lock_ttl_seconds; null until LOCKED" }
      - { name: status, type: enum, source: system, default: "DRAFT", description: "DRAFT | LOCKED | CONSUMED | EXPIRED — see state machine" }

  - name: Transfer
    parent: null
    common_fields: true
    fields:
      - { name: quote_id, type: string, source: input, description: "FK -> Quote.id; the LOCKED quote this transfer consumes" }
      - { name: corridor_id, type: string, source: system, description: "FK -> Corridor.id; copied from the quote" }
      - { name: sender_id, type: string, source: system, description: "FK -> Sender.id; copied from the quote" }
      - { name: recipient_id, type: string, source: input, description: "FK -> Recipient.id; VERIFIED beneficiary funds are delivered to" }
      - { name: send_principal_minor, type: integer, source: system, description: "Send principal frozen from the quote at creation" }
      - { name: fee_minor, type: integer, source: system, description: "Fee frozen from the quote at creation" }
      - { name: recipient_amount_minor, type: integer, source: system, description: "Disclosed delivery amount frozen from the quote at creation" }
      - { name: locked_rate_micro, type: integer, source: system, description: "Locked FX rate frozen from the quote at creation" }
      - { name: funding_status, type: enum, source: system, default: "UNFUNDED", description: "UNFUNDED | FUNDED — FUNDED once the sender's pay-in is recorded" }
      - { name: compliance_status, type: enum, source: system, default: "SCREENING", description: "Axis 1: SCREENING | CLEARED | HELD | REJECTED — independent of delivery axis" }
      - { name: delivery_status, type: enum, source: system, default: "PENDING", description: "Axis 2: PENDING | IN_TRANSIT | DELIVERED | FAILED | REFUNDED — independent of compliance axis" }
      - { name: sanctions_score, type: integer, source: computed, description: "Best sanctions match score over sender+recipient at screening time (0–100)" }
      - { name: refundable_minor, type: integer, source: computed, description: "Amount that would be returned to the sender if cancelled now (see calculations.refund_amount)" }

  - name: ComplianceCase
    parent: null
    common_fields: true
    fields:
      - { name: transfer_id, type: string, source: input, description: "FK -> Transfer.id; the held transfer under review" }
      - { name: sanctions_hit_id, type: string, source: system, default: null, description: "Denormalized id of the top-scoring SanctionsHit that opened this case (back-pointer; resolve the hit set via GET /sanctions-hits?transfer_id=...). Not a reverse-indexed FK." }
      - { name: opened_reason, type: enum, source: system, description: "SANCTIONS_SCORE | MANUAL — why the case opened" }
      - { name: assigned_officer_id, type: string, source: input, description: "Opaque ComplianceOfficer user id handling the case" }
      - { name: info_request_count, type: integer, source: computed, default: 0, description: "Times the case looped through AWAITING_INFO" }
      - { name: status, type: enum, source: system, default: "OPEN", description: "OPEN | AWAITING_INFO | ESCALATED | CLEARED | REJECTED — see state machine" }

  - name: SanctionsListEntry
    parent: null
    common_fields: false
    fields:
      - { name: listed_name, type: string, source: input, description: "Sanctioned full name to screen against" }
      - { name: listed_country, type: string, source: input, description: "ISO-3166 alpha-2 country associated with the listing" }
      - { name: program, type: string, source: input, description: "Sanctions program code, e.g. 'OFAC-SDN'" }
      - { name: weight_name_bps, type: integer, source: input, default: 7000, description: "Weight (bps of 10000) the name-token component contributes to the match score" }
      - { name: weight_country_bps, type: integer, source: input, default: 3000, description: "Weight (bps of 10000) the country-match component contributes to the match score" }

  - name: SanctionsHit
    parent: null
    common_fields: false
    fields:
      - { name: transfer_id, type: string, source: input, description: "FK -> Transfer.id; transfer whose screening produced this hit" }
      - { name: list_entry_id, type: string, source: input, description: "FK -> SanctionsListEntry.id; matched list entry" }
      - { name: subject_kind, type: enum, source: input, description: "SENDER | RECIPIENT — which party of the transfer matched" }
      - { name: subject_id, type: string, source: input, description: "Sender.id or Recipient.id per subject_kind (polymorphic reference)" }
      - { name: score, type: integer, source: computed, description: "Weighted match score 0–100 (see calculations.sanctions_score)" }

  - name: PayoutAttempt
    parent: null
    common_fields: true
    fields:
      - { name: transfer_id, type: string, source: input, description: "FK -> Transfer.id; transfer being paid out" }
      - { name: payout_method, type: enum, source: system, description: "BANK | CASH_PICKUP | WALLET — copied from recipient at attempt time" }
      - { name: attempt_index, type: integer, source: computed, description: "1-based ordinal among this transfer's attempts, ordered by created_at ascending" }
      - { name: outcome, type: enum, source: system, default: "PENDING", description: "PENDING | SUCCEEDED | FAILED — set by report_outcome" }
      - { name: failure_reason, type: enum, source: input, default: null, description: "INVALID_ACCOUNT | PICKUP_EXPIRED | WALLET_REJECTED | null when SUCCEEDED" }

  - name: Refund
    parent: null
    common_fields: true
    fields:
      - { name: transfer_id, type: string, source: input, description: "FK -> Transfer.id; transfer being refunded/cancelled" }
      - { name: reason, type: enum, source: input, description: "SENDER_CANCEL | COMPLIANCE_REJECT | DELIVERY_FAILED" }
      - { name: principal_refunded_minor, type: integer, source: computed, description: "Send principal returned to the sender" }
      - { name: fee_refunded_minor, type: integer, source: computed, description: "Fee component returned (full or retained per refund_amount variant)" }
      - { name: total_refunded_minor, type: integer, source: computed, description: "principal_refunded_minor + fee_refunded_minor" }
      - { name: status, type: enum, source: system, default: "ISSUED", description: "ISSUED — terminal; refunds are created already settled" }

  - name: LedgerEntry
    parent: null
    common_fields: false
    fields:
      - { name: transfer_id, type: string, source: input, description: "FK -> Transfer.id; transfer this funds movement belongs to" }
      - { name: entry_type, type: enum, source: system, description: "SENDER_DEBIT | RECIPIENT_CREDIT | FEE_REVENUE | REFUND_CREDIT | FEE_REVERSAL" }
      - { name: amount_minor, type: integer, source: system, description: "Signed amount in send-currency minor units; debits negative, credits positive (see calculations.ledger_invariant)" }
      - { name: memo, type: string, source: system, default: null, description: "Human-readable description of the movement" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  # ---- Quote: rate-lock lifecycle with TTL expiry ----
  - entity: Quote
    initial_state: DRAFT
    terminal_states: [CONSUMED, EXPIRED]
    transitions:
      - from: DRAFT
        to: LOCKED
        trigger: "POST /quotes/{quoteId}/lock"
        actor: RemittanceAgent
        preconditions:
          - "Corridor.status == ACTIVE (ERR_CORRIDOR_SUSPENDED)"
          - "No other Quote for the same (sender_id, corridor_id) is in status LOCKED with expires_at in the future (ERR_RATE_LOCK_OVERLAP)"
        side_effects:
          - "locked_at = current UTC clock; expires_at = locked_at + corridor.rate_lock_ttl_seconds"
          - "Snapshot mid_rate_micro from prevailing FxRate; compute locked_rate_micro, fee_minor, recipient_amount_minor, total_pay_minor"
          - "increments Quote.version by 1"

      - from: LOCKED
        to: CONSUMED
        trigger: "POST /transfers (the quote is consumed when a Transfer is created from it)"
        actor: RemittanceAgent
        preconditions:
          - "expires_at strictly after current UTC clock (ERR_QUOTE_EXPIRED)"
        side_effects:
          - "increments Quote.version by 1"
        note: "Cross-entity cascade entry point: see Transfer create."

      - from: LOCKED
        to: EXPIRED
        trigger: "POST /_clock/advance (system auto-expiry when current UTC clock reaches expires_at)"
        actor: system
        preconditions:
          - "current UTC clock >= expires_at"
        side_effects: []
        note: "Auto-transition evaluated whenever the clock advances; a LOCKED quote whose window has elapsed is EXPIRED before any further read."

  # ---- Recipient KYC: branching with revert + revision cycle ----
  - entity: Recipient
    initial_state: UNVERIFIED
    terminal_states: []
    transitions:
      - from: UNVERIFIED
        to: PENDING_REVIEW
        trigger: "POST /recipients/{recipientId}/submit-kyc"
        actor: RemittanceAgent
        preconditions:
          - "kyc_doc_ref provided in body (ERR_KYC_DOC_REQUIRED)"
        side_effects:
          - "kyc_doc_ref = body.kyc_doc_ref"
          - "increments Recipient.version by 1"

      - from: REJECTED
        to: PENDING_REVIEW
        trigger: "POST /recipients/{recipientId}/submit-kyc"
        actor: RemittanceAgent
        preconditions:
          - "kyc_doc_ref provided in body (ERR_KYC_DOC_REQUIRED)"
        side_effects:
          - "kyc_doc_ref = body.kyc_doc_ref"
          - "kyc_review_count += 1"
          - "increments Recipient.version by 1"
        note: "Revision loop: a rejected beneficiary may resubmit; kyc_review_count tracks the cycle count."

      - from: PENDING_REVIEW
        to: VERIFIED
        trigger: "POST /recipients/{recipientId}/decide-kyc with decision=APPROVE"
        actor: ComplianceOfficer
        preconditions: []
        side_effects:
          - "increments Recipient.version by 1"

      - from: PENDING_REVIEW
        to: REJECTED
        trigger: "POST /recipients/{recipientId}/decide-kyc with decision=REJECT"
        actor: ComplianceOfficer
        preconditions: []
        side_effects:
          - "increments Recipient.version by 1"

  # ---- Transfer: PARALLEL state axes (compliance_status × delivery_status) ----
  - entity: Transfer
    initial_state: "compliance_status=SCREENING, delivery_status=PENDING, funding_status=UNFUNDED"
    terminal_states: ["delivery_status=DELIVERED", "delivery_status=REFUNDED"]
    transitions:
      # --- funding axis ---
      - from: "funding_status=UNFUNDED"
        to: "funding_status=FUNDED"
        trigger: "POST /transfers/{transferId}/fund"
        actor: RemittanceAgent
        preconditions:
          - "Transfer.compliance_status != REJECTED (ERR_INVALID_STATE)"
          - "send_principal_minor <= corridor.per_transfer_max_minor (ERR_PER_TRANSFER_LIMIT)"
          - "corridor rolling-window cumulative funded send for this sender + this send_principal_minor <= corridor.rolling_window_cap_minor (ERR_ROLLING_WINDOW_LIMIT)"
          - "send_principal_minor <= kyc_tier ceiling for sender.kyc_tier (ERR_KYC_TIER_LIMIT)"
        side_effects:
          - "funding_status = FUNDED"
          - "corridor.reserved_minor += send_principal_minor"
          - "Create LedgerEntry SENDER_DEBIT amount_minor = -(send_principal_minor + fee_minor); FEE_REVENUE amount_minor = +fee_minor"
          - "increments Transfer.version by 1"

      # --- compliance axis ---
      - from: "compliance_status=SCREENING"
        to: "compliance_status=CLEARED"
        trigger: "POST /transfers/{transferId}/screen (auto-clear path)"
        actor: RemittanceAgent
        preconditions:
          - "sanctions_score < SANCTIONS_CLEAR_THRESHOLD (no case opened)"
        side_effects:
          - "compliance_status = CLEARED"
          - "increments Transfer.version by 1"

      - from: "compliance_status=SCREENING"
        to: "compliance_status=HELD"
        trigger: "POST /transfers/{transferId}/screen (auto-hold path)"
        actor: RemittanceAgent
        preconditions:
          - "sanctions_score >= SANCTIONS_CLEAR_THRESHOLD"
        side_effects:
          - "compliance_status = HELD"
          - "Create SanctionsHit rows for every (subject, list_entry) whose pairwise score >= SANCTIONS_CLEAR_THRESHOLD"
          - "Open a ComplianceCase (opened_reason=SANCTIONS_SCORE, sanctions_hit_id = top-scoring hit)"
          - "increments Transfer.version by 1"

      - from: "compliance_status=HELD"
        to: "compliance_status=CLEARED"
        trigger: "POST /compliance-cases/{caseId}/decide with decision=CLEAR (cross-entity: case CLEARED bubbles to transfer)"
        actor: ComplianceOfficer
        preconditions:
          - "ComplianceCase.status == OPEN or ESCALATED (ERR_INVALID_STATE)"
        side_effects:
          - "ComplianceCase.status = CLEARED"
          - "Transfer.compliance_status = CLEARED"
          - "increments Transfer.version by 1"

      - from: "compliance_status=HELD"
        to: "compliance_status=REJECTED"
        trigger: "POST /compliance-cases/{caseId}/decide with decision=REJECT (cross-entity: case REJECTED bubbles to transfer)"
        actor: ComplianceOfficer
        preconditions:
          - "ComplianceCase.status == OPEN or ESCALATED (ERR_INVALID_STATE)"
        side_effects:
          - "ComplianceCase.status = REJECTED"
          - "Transfer.compliance_status = REJECTED"
          - "If funding_status==FUNDED and delivery_status==PENDING: trigger compensating refund chain (reason=COMPLIANCE_REJECT) -> delivery_status=REFUNDED"
          - "increments Transfer.version by 1"

      # --- delivery axis ---
      - from: "delivery_status=PENDING"
        to: "delivery_status=IN_TRANSIT"
        trigger: "POST /transfers/{transferId}/dispatch"
        actor: PayoutOperator
        preconditions:
          - "funding_status == FUNDED (ERR_TRANSFER_NOT_FUNDED)"
          - "compliance_status == CLEARED (ERR_COMPLIANCE_HOLD)"
          - "recipient.kyc_status == VERIFIED (ERR_RECIPIENT_NOT_VERIFIED)"
        side_effects:
          - "Create PayoutAttempt (outcome=PENDING, attempt_index = count of prior attempts + 1)"
          - "delivery_status = IN_TRANSIT"
          - "increments Transfer.version by 1"

      - from: "delivery_status=IN_TRANSIT"
        to: "delivery_status=DELIVERED"
        trigger: "POST /payout-attempts/{attemptId}/report-outcome with outcome=SUCCEEDED (cross-entity bubble-up)"
        actor: PayoutOperator
        preconditions:
          - "PayoutAttempt.outcome == PENDING (ERR_INVALID_STATE)"
        side_effects:
          - "PayoutAttempt.outcome = SUCCEEDED"
          - "delivery_status = DELIVERED"
          - "corridor.reserved_minor -= send_principal_minor"
          - "Create LedgerEntry RECIPIENT_CREDIT amount_minor = +send_principal_minor"
          - "increments Transfer.version by 1"

      - from: "delivery_status=IN_TRANSIT"
        to: "delivery_status=FAILED"
        trigger: "POST /payout-attempts/{attemptId}/report-outcome with outcome=FAILED (cross-entity bubble-up)"
        actor: PayoutOperator
        preconditions:
          - "PayoutAttempt.outcome == PENDING (ERR_INVALID_STATE)"
        side_effects:
          - "PayoutAttempt.outcome = FAILED; failure_reason recorded"
          - "delivery_status = FAILED"
          - "increments Transfer.version by 1"

      - from: "delivery_status=FAILED"
        to: "delivery_status=IN_TRANSIT"
        trigger: "POST /transfers/{transferId}/dispatch (retry after a failed attempt)"
        actor: PayoutOperator
        preconditions:
          - "count of FAILED PayoutAttempts < MAX_PAYOUT_ATTEMPTS (ERR_MAX_ATTEMPTS_REACHED)"
        side_effects:
          - "Create PayoutAttempt (outcome=PENDING, attempt_index = count of prior attempts + 1)"
          - "delivery_status = IN_TRANSIT"
          - "increments Transfer.version by 1"

      - from: "delivery_status=PENDING"
        to: "delivery_status=REFUNDED"
        trigger: "POST /refunds (reason=SENDER_CANCEL — pre-dispatch sender cancellation)"
        actor: RemittanceAgent
        preconditions:
          - "delivery_status == PENDING (ERR_INVALID_STATE)"
        side_effects:
          - "Compute refundable_minor via refund_amount (SENDER_CANCEL variant)"
          - "If funding_status==FUNDED: corridor.reserved_minor -= send_principal_minor; create REFUND_CREDIT + FEE_REVERSAL LedgerEntries"
          - "delivery_status = REFUNDED"
          - "increments Transfer.version by 1"

      - from: "delivery_status=FAILED"
        to: "delivery_status=REFUNDED"
        trigger: "POST /refunds (reason=DELIVERY_FAILED — refund after exhausted payout attempts)"
        actor: PayoutOperator
        preconditions:
          - "delivery_status == FAILED (ERR_INVALID_STATE)"
          - "count of FAILED PayoutAttempts >= MAX_PAYOUT_ATTEMPTS (ERR_ATTEMPTS_NOT_EXHAUSTED)"
        side_effects:
          - "Compute refundable_minor via refund_amount (DELIVERY_FAILED variant)"
          - "corridor.reserved_minor -= send_principal_minor; create REFUND_CREDIT + FEE_REVERSAL LedgerEntries"
          - "delivery_status = REFUNDED"
          - "increments Transfer.version by 1"

  # ---- ComplianceCase: cyclic (AWAITING_INFO loop) + escalation branch ----
  - entity: ComplianceCase
    initial_state: OPEN
    terminal_states: [CLEARED, REJECTED]
    transitions:
      - from: OPEN
        to: AWAITING_INFO
        trigger: "POST /compliance-cases/{caseId}/request-info"
        actor: ComplianceOfficer
        preconditions: []
        side_effects:
          - "info_request_count += 1"
          - "increments ComplianceCase.version by 1"

      - from: AWAITING_INFO
        to: OPEN
        trigger: "POST /compliance-cases/{caseId}/provide-info"
        actor: RemittanceAgent
        preconditions: []
        side_effects:
          - "increments ComplianceCase.version by 1"
        note: "Cycle: OPEN -> AWAITING_INFO -> OPEN, repeatable; info_request_count records loop count."

      - from: OPEN
        to: ESCALATED
        trigger: "POST /compliance-cases/{caseId}/escalate"
        actor: ComplianceOfficer
        preconditions:
          - "transfer.sanctions_score >= SANCTIONS_ESCALATE_THRESHOLD (ERR_ESCALATION_NOT_WARRANTED)"
        side_effects:
          - "increments ComplianceCase.version by 1"

      - from: OPEN
        to: CLEARED
        trigger: "POST /compliance-cases/{caseId}/decide with decision=CLEAR"
        actor: ComplianceOfficer
        preconditions:
          - "expected_case_version matches ComplianceCase.version (ERR_STALE_VERSION)"
        side_effects:
          - "Transfer.compliance_status = CLEARED (cross-entity bubble)"
          - "increments ComplianceCase.version by 1"

      - from: ESCALATED
        to: CLEARED
        trigger: "POST /compliance-cases/{caseId}/decide with decision=CLEAR"
        actor: ComplianceOfficer
        preconditions:
          - "expected_case_version matches ComplianceCase.version (ERR_STALE_VERSION)"
        side_effects:
          - "Transfer.compliance_status = CLEARED (cross-entity bubble)"
          - "increments ComplianceCase.version by 1"

      - from: OPEN
        to: REJECTED
        trigger: "POST /compliance-cases/{caseId}/decide with decision=REJECT"
        actor: ComplianceOfficer
        preconditions:
          - "expected_case_version matches ComplianceCase.version (ERR_STALE_VERSION)"
        side_effects:
          - "Transfer.compliance_status = REJECTED (cross-entity bubble; triggers compensating refund chain if FUNDED)"
          - "increments ComplianceCase.version by 1"

      - from: ESCALATED
        to: REJECTED
        trigger: "POST /compliance-cases/{caseId}/decide with decision=REJECT"
        actor: ComplianceOfficer
        preconditions:
          - "expected_case_version matches ComplianceCase.version (ERR_STALE_VERSION)"
        side_effects:
          - "Transfer.compliance_status = REJECTED (cross-entity bubble; triggers compensating refund chain if FUNDED)"
          - "increments ComplianceCase.version by 1"

# ---- §1.2.1 Concurrency Rules ----
concurrency_rules:
  - rule_id: case-decide-stale-version
    parent_entity: ComplianceCase
    write_endpoint: "POST /compliance-cases/{caseId}/decide"
    occ_field: "expected_case_version"
    description: |
      Deciding a ComplianceCase (CLEAR or REJECT) against a case whose version
      has advanced since the officer last observed it is rejected. This captures
      the case where a request-info / provide-info loop legitimately advanced the
      case (bumping its version) after the officer loaded the case detail, so the
      decision is acting on a stale view that may no longer reflect the gathered
      information. Resolved as a stale-version precondition, not a timing window.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: transfer-create-stale-quote
    parent_entity: Quote
    write_endpoint: "POST /transfers"
    occ_field: "expected_quote_version"
    description: |
      Creating a Transfer against a Quote whose version has advanced since the
      agent last observed it is rejected. This is the CREATE-with-supersede case:
      a re-lock on the same quote (or another consume attempt) legitimately
      advances Quote.version, so an agent whose view of the quote is stale must
      re-read before consuming. Resolved as a stale-version precondition on the
      parent Quote, not a timing window.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: quote_fee
    trigger: "Quote lock (DRAFT -> LOCKED)"
    algorithm: tiered_pricing
    formula: |
      # Combinatorial: tiered percentage selection + flat + explicit rounding order.
      # ROUNDING ORDER IS PINNED: compute each component, floor each to whole minor
      # units INDEPENDENTLY, THEN sum. (round-per-component then sum, NOT sum-then-round.)
      if send_principal_minor >= corridor.fee_tier_threshold_minor:
        pct_bps = corridor.fee_pct_tier2_bps
      else:
        pct_bps = corridor.fee_pct_bps
      pct_component_minor = floor(send_principal_minor * pct_bps / 10000)
      flat_component_minor = corridor.fee_flat_minor
      fee_minor = pct_component_minor + flat_component_minor
    input_set: "Single Quote being locked; corridor config snapshotted at lock time."
    constants: {}
    precision: "integer minor units, floor per component then sum"

  - name: recipient_amount
    trigger: "Quote lock (DRAFT -> LOCKED)"
    algorithm: forward_looking
    formula: |
      # Combinatorial mode (b): multi-step rounding where order matters.
      # ROUNDING ORDER IS PINNED: apply the margin to the mid-rate FIRST and floor
      # to whole micro-units, THEN multiply by principal and floor to whole receive
      # minor units. (margin-first-then-convert, NOT convert-then-margin.)
      locked_rate_micro = floor(mid_rate_micro * (10000 - corridor.fx_margin_bps) / 10000)
      recipient_amount_minor = floor(send_principal_minor * locked_rate_micro / 1000000)
      total_pay_minor = send_principal_minor + fee_minor
    input_set: "Single Quote; prevailing FxRate.mid_rate_micro = latest FxRate for corridor with effective_at <= clock, tie-break effective_at DESC then created order."
    constants:
      SCALE_MICRO: 1000000
    precision: "integer micro-units for rate (floor), integer minor units for amount (floor)"

  - name: sanctions_score
    trigger: "Transfer screen (compliance_status SCREENING -> CLEARED|HELD)"
    algorithm: weighted_scoring
    formula: |
      # Risk scoring on the Sender/Recipient domain (distinct from quote pricing
      # on the Quote domain). Weighted name+country match against each list entry.
      # For each (subject in {sender, recipient}) x (list_entry):
      name_tokens_subject = lowercased whitespace-split tokens of subject.full_name
      name_tokens_listed  = lowercased whitespace-split tokens of list_entry.listed_name
      name_overlap = count(name_tokens_subject INTERSECT name_tokens_listed)
      name_ratio = name_overlap / max(1, count(name_tokens_listed))
      name_pts   = round_half_up(name_ratio * list_entry.weight_name_bps / 100)   # 0..weight_name_bps/100
      country_pts = (list_entry.weight_country_bps / 100) if subject.country == list_entry.listed_country else 0
      pairwise_score = name_pts + country_pts                                       # 0..100
      transfer.sanctions_score = max over all (subject, list_entry) pairwise_score; 0 if no list entries
    input_set: "All SanctionsListEntry rows; the transfer's sender and recipient. Tie on max score broken by SanctionsListEntry.created_at ASC (the earliest-listed entry is the opening hit)."
    constants:
      SANCTIONS_CLEAR_THRESHOLD: 60     # score >= 60 -> HELD; < 60 -> auto CLEARED
      SANCTIONS_ESCALATE_THRESHOLD: 85  # case escalation requires score >= 85
    precision: "integer points; name component rounded half-up at the points step"
    variants:
      - name: strict_screening
        when: "subject.country is on a high-risk country list (subject.country in HIGH_RISK_COUNTRIES)"
        difference: "name_ratio uses substring-containment (any listed token is a prefix of a subject token counts as overlap), which scores >= the token-equality base variant for the same inputs, so a transfer HELD under strict may be CLEARED under base."
      - name: base_screening
        when: "subject.country not in HIGH_RISK_COUNTRIES"
        difference: "name_ratio uses exact token equality; same inputs can yield a strictly lower score than strict_screening."

  - name: corridor_limit_check
    trigger: "Transfer fund (funding_status UNFUNDED -> FUNDED)"
    algorithm: aggregation
    formula: |
      # Threshold/aggregation with PINNED boundary semantics (all <= are INCLUSIVE;
      # the limit value itself is allowed, limit+1 is rejected).
      window_start = current_clock - corridor.rolling_window_hours hours
      prior_funded_minor = sum(t.send_principal_minor
                               for t in Transfers
                               where t.corridor_id == corridor.id
                                 and t.sender_id == sender.id
                                 and t.funding_status == FUNDED
                                 and t.id != this_transfer.id
                                 and (the FUNDED ledger SENDER_DEBIT created_at) > window_start)
      projected = prior_funded_minor + this_transfer.send_principal_minor
      PASS requires ALL of:
        this_transfer.send_principal_minor <= corridor.per_transfer_max_minor
        this_transfer.send_principal_minor <= kyc_ceiling(sender.kyc_tier)
        projected <= corridor.rolling_window_cap_minor
    input_set: "FUNDED transfers for (corridor, sender) whose funding ledger entry created_at is strictly after window_start (exclusive lower bound)."
    constants:
      KYC_CEILING_TIER0_MINOR: 50000     # $500.00
      KYC_CEILING_TIER1_MINOR: 300000    # $3,000.00
      KYC_CEILING_TIER2_MINOR: 1500000   # $15,000.00
    precision: "integer minor units; all threshold comparisons inclusive (<=)"

  - name: refund_amount
    trigger: "Refund creation OR compensating refund chain on compliance REJECT"
    algorithm: chronological
    formula: |
      # Dual-variant on the Refund/Transfer domain (distinct from pricing & risk).
      # principal is ALWAYS fully refunded once FUNDED. The FEE treatment diverges:
      principal_refunded_minor = transfer.send_principal_minor if transfer.funding_status == FUNDED else 0
      # fee variant selection:
      if reason == SENDER_CANCEL:
        # sender's own choice to back out: provider retains fee unless cancelled
        # within the grace window measured from the FUNDED ledger SENDER_DEBIT.
        funded_at = created_at of the SENDER_DEBIT LedgerEntry for this transfer
        if funding_status != FUNDED: fee_refunded_minor = 0   # never charged
        elif (current_clock - funded_at) <= REFUND_GRACE_SECONDS: fee_refunded_minor = transfer.fee_minor
        else: fee_refunded_minor = 0    # fee retained
      elif reason in {COMPLIANCE_REJECT, DELIVERY_FAILED}:
        # fault is not the sender's: fee always fully reversed if it was charged.
        fee_refunded_minor = transfer.fee_minor if funding_status == FUNDED else 0
      total_refunded_minor = principal_refunded_minor + fee_refunded_minor
    input_set: "Single transfer; its SENDER_DEBIT ledger entry for funded_at; the refund reason."
    constants:
      REFUND_GRACE_SECONDS: 3600    # 1 hour grace for fee-inclusive sender cancellation
      MAX_PAYOUT_ATTEMPTS: 2        # delivery is abandoned (DELIVERY_FAILED refund eligible) after this many FAILED PayoutAttempts
    precision: "integer minor units"
    variants:
      - name: provisional_sender_cancel
        when: "reason == SENDER_CANCEL"
        difference: "fee is refunded only inside REFUND_GRACE_SECONDS of funding; outside the window the fee is retained — same transfer can yield two different total_refunded_minor depending on the cancel time."
      - name: final_fault_refund
        when: "reason in {COMPLIANCE_REJECT, DELIVERY_FAILED}"
        difference: "fee is always fully reversed regardless of timing — divergent from the sender-cancel variant on identical funded inputs."

  - name: ledger_invariant
    trigger: "Every funding / delivery / refund side-effect that writes LedgerEntry rows"
    algorithm: aggregation
    formula: |
      # Conserved-quantity invariant pinned as an explicit formula over LedgerEntry.
      # Funds conservation per transfer: signed entries net to ZERO once a transfer
      # reaches a terminal delivery state via the compensating path.
      net(transfer) = sum(LedgerEntry.amount_minor where transfer_id == transfer.id)
      INVARIANT A (refunded transfer): after a REFUNDED transition the chain wrote
        SENDER_DEBIT(-(P+F)) + FEE_REVENUE(+F) + REFUND_CREDIT(+P) + FEE_REVERSAL(+fee_refunded)
        and net(transfer) == fee_minor - fee_refunded_minor   # provider keeps only the retained fee
      INVARIANT B (delivered transfer): SENDER_DEBIT(-(P+F)) + FEE_REVENUE(+F) + RECIPIENT_CREDIT(+P)
        and net(transfer) == 0   # all sender funds delivered, fee is revenue, books balance to 0
    input_set: "All LedgerEntry rows for the transfer."
    constants: {}
    precision: "integer minor units; exact equality"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers present and well-formed"
    error_id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER
    http_status: 400
    applies_to: all

  - priority: 2
    category: auth
    check: "Caller role is permitted for this endpoint per §1.7"
    error_id: ERR_FORBIDDEN_FOR_ROLE
    http_status: 403
    applies_to: all

  - priority: 3
    category: existence
    check: "Every path id and FK referenced in body exists; validated left-to-right"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: all resource endpoints

  - priority: 4
    category: business_constraint
    check: "Request body well-formed: required fields present, enums valid, amounts > 0"
    error_id: ERR_INVALID_REQUEST
    http_status: 422
    applies_to: all write endpoints

  - priority: 5
    category: state
    check: "OCC: expected_case_version on compliance-case decide matches current ComplianceCase.version"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /compliance-cases/{caseId}/decide"

  - priority: 6
    category: state
    check: "Target resource is in a state from which the requested transition is allowed"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: all state-transition endpoints

  - priority: 7
    category: business_safety
    check: "Corridor must be ACTIVE to lock a quote or fund/dispatch a transfer"
    error_id: ERR_CORRIDOR_SUSPENDED
    http_status: 409
    applies_to: "POST /quotes/{quoteId}/lock"

  - priority: 8
    category: business_safety
    check: "A blocked sender (confirmed sanctions match) cannot create quotes or transfers"
    error_id: ERR_SENDER_BLOCKED
    http_status: 409
    applies_to: "POST /quotes, POST /transfers"

  - priority: 9
    category: business_referential
    check: "Quote payout_method must be in corridor.enabled_payout_methods"
    error_id: ERR_PAYOUT_METHOD_NOT_SUPPORTED
    http_status: 409
    applies_to: "POST /quotes"

  - priority: 10
    category: business_safety
    check: "Recipient must be VERIFIED before dispatch; compliance_status must be CLEARED"
    error_id: ERR_RECIPIENT_NOT_VERIFIED
    http_status: 409
    applies_to: "POST /transfers/{transferId}/dispatch"

  - priority: 11
    category: business_safety
    check: "Transfer under a compliance HELD cannot be dispatched"
    error_id: ERR_COMPLIANCE_HOLD
    http_status: 409
    applies_to: "POST /transfers/{transferId}/dispatch"

  - priority: 12
    category: business_temporal
    check: "A LOCKED quote may only be consumed before expires_at; an overlapping active lock for the same sender+corridor is rejected"
    error_id: ERR_QUOTE_EXPIRED
    http_status: 409
    applies_to: "POST /transfers, POST /quotes/{quoteId}/lock"

  - priority: 13
    category: business_constraint
    check: "Per-transfer principal must not exceed corridor.per_transfer_max_minor"
    error_id: ERR_PER_TRANSFER_LIMIT
    http_status: 409
    applies_to: "POST /transfers/{transferId}/fund"

  - priority: 14
    category: business_constraint
    check: "Per-transfer principal must not exceed the sender's KYC-tier ceiling"
    error_id: ERR_KYC_TIER_LIMIT
    http_status: 409
    applies_to: "POST /transfers/{transferId}/fund"

  - priority: 15
    category: business_fiscal
    check: "Projected rolling-window cumulative funded send must not exceed corridor.rolling_window_cap_minor"
    error_id: ERR_ROLLING_WINDOW_LIMIT
    http_status: 409
    applies_to: "POST /transfers/{transferId}/fund"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # ---- Corridor ----
  - method: POST
    path: "/corridors"
    description: "Create a remittance corridor (config)"
    roles: [PlatformAdmin]
    code: 201
    input: [name, send_country, receive_country, send_currency, receive_currency, enabled_payout_methods, fx_margin_bps, fee_flat_minor, fee_pct_bps, fee_tier_threshold_minor, fee_pct_tier2_bps, per_transfer_max_minor, "rolling_window_hours?", rolling_window_cap_minor, "rate_lock_ttl_seconds?"]
    output: Corridor
    side_effects: ["status=ACTIVE, reserved_minor=0"]

  - method: GET
    path: "/corridors/{corridorId}"
    description: "Get a corridor"
    roles: [PlatformAdmin, RemittanceAgent, ComplianceOfficer, PayoutOperator]
    code: 200
    input: []
    output: Corridor
    side_effects: []

  - method: GET
    path: "/corridors"
    description: "List corridors"
    roles: [PlatformAdmin, RemittanceAgent, ComplianceOfficer, PayoutOperator]
    code: 200
    input: ["send_country?", "receive_country?", "status?"]
    output: "Corridor[]"
    side_effects: []

  - method: POST
    path: "/corridors/{corridorId}/suspend"
    description: "Suspend a corridor (blocks new quotes/transfers)"
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: Corridor
    side_effects: ["status → SUSPENDED"]

  # ---- FxRate ----
  - method: POST
    path: "/fx-rates"
    description: "Publish a mid-market rate snapshot for a corridor"
    roles: [PlatformAdmin]
    code: 201
    input: [corridor_id, mid_rate_micro, effective_at]
    output: FxRate
    side_effects: ["becomes prevailing rate for corridor once effective_at <= clock"]

  - method: GET
    path: "/fx-rates/{fxRateId}"
    description: "Get an FX rate snapshot"
    roles: [PlatformAdmin, RemittanceAgent]
    code: 200
    input: []
    output: FxRate
    side_effects: []

  - method: GET
    path: "/fx-rates"
    description: "List FX rate snapshots, filterable by corridor"
    roles: [PlatformAdmin, RemittanceAgent]
    code: 200
    input: ["corridor_id?"]
    output: "FxRate[]"
    side_effects: []

  # ---- Sender ----
  - method: POST
    path: "/senders"
    description: "Register a sender"
    roles: [RemittanceAgent]
    code: 201
    input: [full_name, country, date_of_birth]
    output: Sender
    side_effects: ["kyc_tier=TIER0, status=ACTIVE"]

  - method: GET
    path: "/senders/{senderId}"
    description: "Get a sender"
    roles: [RemittanceAgent, ComplianceOfficer]
    code: 200
    input: []
    output: Sender
    side_effects: []

  - method: GET
    path: "/senders"
    description: "List senders"
    roles: [RemittanceAgent, ComplianceOfficer]
    code: 200
    input: ["country?", "status?"]
    output: "Sender[]"
    side_effects: []

  - method: POST
    path: "/senders/{senderId}/verify-kyc"
    description: "Set a sender's KYC tier after identity verification"
    roles: [ComplianceOfficer]
    code: 200
    input: [kyc_tier]
    output: Sender
    side_effects: ["kyc_tier updated; gates per-transfer ceiling"]

  # ---- Recipient ----
  - method: POST
    path: "/recipients"
    description: "Create a beneficiary for a sender"
    roles: [RemittanceAgent]
    code: 201
    input: [sender_id, full_name, country, payout_method, payout_account_ref]
    output: Recipient
    side_effects: ["kyc_status=UNVERIFIED, kyc_review_count=0"]

  - method: GET
    path: "/recipients/{recipientId}"
    description: "Get a beneficiary"
    roles: [RemittanceAgent, ComplianceOfficer, PayoutOperator]
    code: 200
    input: []
    output: Recipient
    side_effects: []

  - method: GET
    path: "/recipients"
    description: "List beneficiaries, filterable by owning sender"
    roles: [RemittanceAgent, ComplianceOfficer, PayoutOperator]
    code: 200
    input: ["sender_id?", "kyc_status?"]
    output: "Recipient[]"
    side_effects: []

  - method: POST
    path: "/recipients/{recipientId}/submit-kyc"
    description: "Submit beneficiary KYC documents for review"
    roles: [RemittanceAgent]
    code: 200
    input: [kyc_doc_ref]
    output: Recipient
    side_effects: ["kyc_status → PENDING_REVIEW; kyc_review_count += 1 if from REJECTED"]

  - method: POST
    path: "/recipients/{recipientId}/decide-kyc"
    description: "Approve or reject beneficiary KYC"
    roles: [ComplianceOfficer]
    code: 200
    input: [decision]
    output: Recipient
    side_effects: ["kyc_status → VERIFIED or REJECTED"]

  # ---- Quote ----
  - method: POST
    path: "/quotes"
    description: "Create a draft quote (fee + rate disclosure, not yet locked)"
    roles: [RemittanceAgent]
    code: 201
    input: [corridor_id, sender_id, send_principal_minor, payout_method]
    output: Quote
    side_effects: ["status=DRAFT; computed disclosure fields populated provisionally"]

  - method: GET
    path: "/quotes/{quoteId}"
    description: "Get a quote with full fee + exchange-rate disclosure"
    roles: [RemittanceAgent, ComplianceOfficer]
    code: 200
    input: []
    output: Quote
    side_effects: []

  - method: GET
    path: "/quotes"
    description: "List quotes, filterable by sender or corridor"
    roles: [RemittanceAgent, ComplianceOfficer]
    code: 200
    input: ["sender_id?", "corridor_id?", "status?"]
    output: "Quote[]"
    side_effects: []

  - method: POST
    path: "/quotes/{quoteId}/lock"
    description: "Lock the rate (DRAFT → LOCKED), freezing fee + exchange rate for the TTL"
    roles: [RemittanceAgent]
    code: 200
    input: []
    output: Quote
    side_effects:
      - "status → LOCKED; locked_at, expires_at set"
      - "Snapshot mid_rate_micro; compute locked_rate_micro, fee_minor, recipient_amount_minor, total_pay_minor"
      - "increments Quote.version by 1"

  # ---- Transfer ----
  - method: POST
    path: "/transfers"
    description: "Create a transfer by consuming a LOCKED quote"
    roles: [RemittanceAgent]
    code: 201
    input: [quote_id, recipient_id, expected_quote_version]
    output: Transfer
    side_effects:
      - "Quote LOCKED → CONSUMED (increments Quote.version by 1)"
      - "Copy corridor_id, sender_id, send_principal_minor, fee_minor, recipient_amount_minor, locked_rate_micro from quote"
      - "compliance_status=SCREENING, delivery_status=PENDING, funding_status=UNFUNDED"

  - method: GET
    path: "/transfers/{transferId}"
    description: "Get a transfer with both status axes and disclosure"
    roles: [RemittanceAgent, ComplianceOfficer, PayoutOperator]
    code: 200
    input: []
    output: Transfer
    side_effects: []

  - method: GET
    path: "/transfers"
    description: "List transfers, filterable by quote/sender/recipient/corridor and status axes"
    roles: [RemittanceAgent, ComplianceOfficer, PayoutOperator]
    code: 200
    input: ["quote_id?", "sender_id?", "recipient_id?", "corridor_id?", "compliance_status?", "delivery_status?"]
    output: "Transfer[]"
    side_effects: []

  - method: POST
    path: "/transfers/{transferId}/fund"
    description: "Record the sender pay-in (UNFUNDED → FUNDED); enforces all send limits"
    roles: [RemittanceAgent]
    code: 200
    input: []
    output: Transfer
    side_effects:
      - "funding_status → FUNDED; corridor.reserved_minor += send_principal_minor"
      - "Create SENDER_DEBIT and FEE_REVENUE LedgerEntries"
      - "increments Transfer.version by 1"

  - method: POST
    path: "/transfers/{transferId}/screen"
    description: "Run sanctions screening (compliance_status SCREENING → CLEARED|HELD)"
    roles: [ComplianceOfficer]
    code: 200
    input: []
    output: Transfer
    side_effects:
      - "Compute sanctions_score; CLEARED if < threshold else HELD"
      - "On HELD: create SanctionsHit rows + open ComplianceCase"
      - "increments Transfer.version by 1"

  - method: POST
    path: "/transfers/{transferId}/dispatch"
    description: "Dispatch payout (delivery PENDING|FAILED → IN_TRANSIT); creates a PayoutAttempt"
    roles: [PayoutOperator]
    code: 200
    input: []
    output: Transfer
    side_effects:
      - "Create PayoutAttempt (PENDING)"
      - "delivery_status → IN_TRANSIT"
      - "increments Transfer.version by 1"

  # ---- ComplianceCase ----
  - method: GET
    path: "/compliance-cases/{caseId}"
    description: "Get a compliance case"
    roles: [ComplianceOfficer, RemittanceAgent]
    code: 200
    input: []
    output: ComplianceCase
    side_effects: []

  - method: GET
    path: "/compliance-cases"
    description: "List compliance cases, filterable by transfer"
    roles: [ComplianceOfficer, RemittanceAgent]
    code: 200
    input: ["transfer_id?", "status?"]
    output: "ComplianceCase[]"
    side_effects: []

  - method: POST
    path: "/compliance-cases/{caseId}/request-info"
    description: "Officer requests more info (OPEN → AWAITING_INFO)"
    roles: [ComplianceOfficer]
    code: 200
    input: []
    output: ComplianceCase
    side_effects: ["status → AWAITING_INFO; info_request_count += 1; increments ComplianceCase.version by 1"]

  - method: POST
    path: "/compliance-cases/{caseId}/provide-info"
    description: "Agent supplies requested info (AWAITING_INFO → OPEN)"
    roles: [RemittanceAgent]
    code: 200
    input: ["note?"]
    output: ComplianceCase
    side_effects: ["status → OPEN; increments ComplianceCase.version by 1"]

  - method: POST
    path: "/compliance-cases/{caseId}/escalate"
    description: "Escalate a high-score case (OPEN → ESCALATED)"
    roles: [ComplianceOfficer]
    code: 200
    input: []
    output: ComplianceCase
    side_effects: ["status → ESCALATED; increments ComplianceCase.version by 1"]

  - method: POST
    path: "/compliance-cases/{caseId}/decide"
    description: "Clear or reject a case; bubbles to Transfer.compliance_status (OCC-guarded)"
    roles: [ComplianceOfficer]
    code: 200
    input: [decision, expected_case_version]
    output: ComplianceCase
    side_effects:
      - "status → CLEARED or REJECTED"
      - "Transfer.compliance_status → CLEARED or REJECTED (cross-entity bubble)"
      - "On REJECT of a FUNDED+PENDING transfer: compensating refund chain → delivery_status=REFUNDED"
      - "increments ComplianceCase.version by 1"

  # ---- SanctionsListEntry ----
  - method: POST
    path: "/sanctions-list"
    description: "Add a sanctions list entry (config)"
    roles: [PlatformAdmin]
    code: 201
    input: [listed_name, listed_country, program, "weight_name_bps?", "weight_country_bps?"]
    output: SanctionsListEntry
    side_effects: []

  - method: GET
    path: "/sanctions-list/{listEntryId}"
    description: "Get a sanctions list entry"
    roles: [PlatformAdmin, ComplianceOfficer]
    code: 200
    input: []
    output: SanctionsListEntry
    side_effects: []

  - method: GET
    path: "/sanctions-list"
    description: "List sanctions list entries"
    roles: [PlatformAdmin, ComplianceOfficer]
    code: 200
    input: ["program?", "listed_country?"]
    output: "SanctionsListEntry[]"
    side_effects: []

  # ---- SanctionsHit (read-only discovery of screening output) ----
  - method: GET
    path: "/sanctions-hits/{hitId}"
    description: "Get a sanctions hit produced by screening"
    roles: [ComplianceOfficer]
    code: 200
    input: []
    output: SanctionsHit
    side_effects: []

  - method: GET
    path: "/sanctions-hits"
    description: "List sanctions hits, filterable by transfer or list entry"
    roles: [ComplianceOfficer]
    code: 200
    input: ["transfer_id?", "list_entry_id?"]
    output: "SanctionsHit[]"
    side_effects: []

  # ---- PayoutAttempt ----
  - method: GET
    path: "/payout-attempts/{attemptId}"
    description: "Get a payout attempt"
    roles: [PayoutOperator, RemittanceAgent]
    code: 200
    input: []
    output: PayoutAttempt
    side_effects: []

  - method: GET
    path: "/payout-attempts"
    description: "List payout attempts, filterable by transfer (delivery tracking)"
    roles: [PayoutOperator, RemittanceAgent, ComplianceOfficer]
    code: 200
    input: ["transfer_id?", "outcome?"]
    output: "PayoutAttempt[]"
    side_effects: []

  - method: POST
    path: "/payout-attempts/{attemptId}/report-outcome"
    description: "Report a payout result; bubbles to Transfer.delivery_status"
    roles: [PayoutOperator]
    code: 200
    input: [outcome, "failure_reason?"]
    output: PayoutAttempt
    side_effects:
      - "outcome → SUCCEEDED|FAILED"
      - "On SUCCEEDED: delivery_status=DELIVERED; corridor.reserved_minor -= send_principal_minor; RECIPIENT_CREDIT ledger entry"
      - "On FAILED: delivery_status=FAILED"
      - "increments Transfer.version by 1"

  # ---- Refund ----
  - method: POST
    path: "/refunds"
    description: "Issue a refund / cancellation against a transfer"
    roles: [RemittanceAgent, PayoutOperator]
    code: 201
    input: [transfer_id, reason]
    output: Refund
    side_effects:
      - "Compute principal_refunded_minor, fee_refunded_minor, total_refunded_minor via refund_amount"
      - "transfer.delivery_status → REFUNDED; corridor.reserved_minor restored if was funded"
      - "Create REFUND_CREDIT + FEE_REVERSAL LedgerEntries"
      - "increments Transfer.version by 1"

  - method: GET
    path: "/refunds/{refundId}"
    description: "Get a refund"
    roles: [RemittanceAgent, PayoutOperator, ComplianceOfficer]
    code: 200
    input: []
    output: Refund
    side_effects: []

  - method: GET
    path: "/refunds"
    description: "List refunds, filterable by transfer"
    roles: [RemittanceAgent, PayoutOperator, ComplianceOfficer]
    code: 200
    input: ["transfer_id?", "reason?"]
    output: "Refund[]"
    side_effects: []

  # ---- LedgerEntry (read-only audit / conservation) ----
  - method: GET
    path: "/ledger-entries/{ledgerEntryId}"
    description: "Get a ledger entry"
    roles: [PlatformAdmin, ComplianceOfficer]
    code: 200
    input: []
    output: LedgerEntry
    side_effects: []

  - method: GET
    path: "/ledger-entries"
    description: "List ledger entries, filterable by transfer (conservation audit)"
    roles: [PlatformAdmin, ComplianceOfficer, RemittanceAgent]
    code: 200
    input: ["transfer_id?", "entry_type?"]
    output: "LedgerEntry[]"
    side_effects: []

  # ---- Test-driving clock ----
  - method: POST
    path: "/_clock/set"
    description: "Set the system UTC clock to an absolute instant (test-driving)"
    roles: [PlatformAdmin]
    code: 200
    input: [to_iso8601]
    output: "null"
    side_effects: ["clock = to_iso8601; re-evaluate LOCKED quote auto-expiry"]

  - method: POST
    path: "/_clock/advance"
    description: "Advance the system UTC clock by N seconds (test-driving)"
    roles: [PlatformAdmin]
    code: 200
    input: [seconds]
    output: "null"
    side_effects: ["clock += seconds; LOCKED quotes whose expires_at <= clock auto-transition to EXPIRED"]

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER, http: 400, condition: "X-User-ID or X-User-Role header missing or malformed" }
  - { id: ERR_FORBIDDEN_FOR_ROLE, http: 403, condition: "Caller role not permitted for this endpoint" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Referenced path id or FK does not exist" }
  - { id: ERR_INVALID_REQUEST, http: 422, condition: "Malformed body: missing required field, invalid enum, non-positive amount" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_case_version does not match current ComplianceCase.version" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Resource not in a state from which the requested transition is allowed" }
  - { id: ERR_CORRIDOR_SUSPENDED, http: 409, condition: "Corridor is SUSPENDED; cannot lock quote or fund/dispatch" }
  - { id: ERR_SENDER_BLOCKED, http: 409, condition: "Sender.status == BLOCKED from a confirmed sanctions match" }
  - { id: ERR_PAYOUT_METHOD_NOT_SUPPORTED, http: 409, condition: "Requested payout_method not in corridor.enabled_payout_methods" }
  - { id: ERR_RATE_LOCK_OVERLAP, http: 409, condition: "An active (LOCKED, unexpired) quote already exists for this sender+corridor" }
  - { id: ERR_QUOTE_EXPIRED, http: 409, condition: "Quote rate-lock expires_at has elapsed; cannot consume" }
  - { id: ERR_RECIPIENT_NOT_VERIFIED, http: 409, condition: "Recipient.kyc_status != VERIFIED at dispatch" }
  - { id: ERR_KYC_DOC_REQUIRED, http: 422, condition: "submit-kyc called without kyc_doc_ref" }
  - { id: ERR_COMPLIANCE_HOLD, http: 409, condition: "Transfer.compliance_status != CLEARED at dispatch" }
  - { id: ERR_TRANSFER_NOT_FUNDED, http: 409, condition: "Dispatch attempted before funding_status == FUNDED" }
  - { id: ERR_PER_TRANSFER_LIMIT, http: 409, condition: "send_principal_minor exceeds corridor.per_transfer_max_minor" }
  - { id: ERR_KYC_TIER_LIMIT, http: 409, condition: "send_principal_minor exceeds the sender's KYC-tier ceiling" }
  - { id: ERR_ROLLING_WINDOW_LIMIT, http: 409, condition: "Projected rolling-window cumulative funded send exceeds corridor.rolling_window_cap_minor" }
  - { id: ERR_ESCALATION_NOT_WARRANTED, http: 409, condition: "Escalation attempted with sanctions_score below SANCTIONS_ESCALATE_THRESHOLD" }
  - { id: ERR_MAX_ATTEMPTS_REACHED, http: 409, condition: "Retry dispatch after MAX_PAYOUT_ATTEMPTS failed attempts" }
  - { id: ERR_ATTEMPTS_NOT_EXHAUSTED, http: 409, condition: "DELIVERY_FAILED refund attempted before MAX_PAYOUT_ATTEMPTS failed attempts" }
  - { id: ERR_REFUND_NOT_ALLOWED, http: 409, condition: "Refund reason not valid for the transfer's current delivery_status" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: PlatformAdmin
    description: "Configures corridors, FX rates, and the sanctions list; sets/advances the test clock. Operational, not party to any transfer."
    identity: opaque
    exclusive_operations:
      - "POST /corridors — create corridor"
      - "POST /corridors/{id}/suspend — suspend corridor"
      - "POST /fx-rates — publish FX rate"
      - "POST /sanctions-list — add sanctions entry"
      - "POST /_clock/set — set clock"
      - "POST /_clock/advance — advance clock"
    shared_operations:
      - "GET on corridors, fx-rates, sanctions-list, sanctions-hits, ledger-entries"

  - name: RemittanceAgent
    description: "Front-office operator: registers senders/recipients, quotes, books transfers, funds them, supplies info, and issues sender cancellations. Cannot screen or clear compliance (segregation of duties)."
    identity: opaque
    exclusive_operations:
      - "POST /senders — register sender"
      - "POST /recipients — create recipient"
      - "POST /recipients/{id}/submit-kyc — submit beneficiary KYC"
      - "POST /quotes — create quote"
      - "POST /quotes/{id}/lock — lock rate"
      - "POST /transfers — create transfer"
      - "POST /transfers/{id}/fund — fund transfer"
      - "POST /compliance-cases/{id}/provide-info — provide requested info"
    shared_operations:
      - "POST /refunds — issue refund (shared with PayoutOperator)"
      - "GET reads across senders, recipients, quotes, transfers, compliance-cases, payout-attempts, refunds, ledger-entries"

  - name: ComplianceOfficer
    description: "Compliance reviewer: verifies sender KYC, decides recipient KYC, screens transfers, and works/decides compliance cases. Cannot fund or dispatch (segregation of duties — the booking agent funds, the officer clears)."
    identity: opaque
    exclusive_operations:
      - "POST /senders/{id}/verify-kyc — set sender KYC tier"
      - "POST /recipients/{id}/decide-kyc — approve/reject beneficiary KYC"
      - "POST /transfers/{id}/screen — run sanctions screening"
      - "POST /compliance-cases/{id}/request-info — request info"
      - "POST /compliance-cases/{id}/escalate — escalate case"
      - "POST /compliance-cases/{id}/decide — clear/reject case"
    shared_operations:
      - "GET reads across all resources including sanctions-hits and ledger-entries"

  - name: PayoutOperator
    description: "Back-office payout: dispatches cleared+funded transfers, reports payout outcomes, and issues delivery-failed refunds. Cannot quote, fund, or run compliance (segregation of duties)."
    identity: opaque
    exclusive_operations:
      - "POST /transfers/{id}/dispatch — dispatch payout"
      - "POST /payout-attempts/{id}/report-outcome — report payout result"
    shared_operations:
      - "POST /refunds — issue refund (shared with RemittanceAgent)"
      - "GET reads across corridors, recipients, transfers, payout-attempts, refunds"
