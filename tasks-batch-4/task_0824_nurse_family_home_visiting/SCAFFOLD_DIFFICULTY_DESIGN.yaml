        distinguishing_aspect: "Depth-4 chain: mark-missed -> dosage drops to 50.00 -> Enrollment.dosage_alert true -> Assignment.review_required true -> Nurse.pending_supervision_count=1; each hop caused strictly by the prior mutation."
        test_recipe:
          setup:
