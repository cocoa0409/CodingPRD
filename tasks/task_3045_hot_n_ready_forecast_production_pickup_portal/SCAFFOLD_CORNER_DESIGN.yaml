              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_RUNS_IN_PROGRESS"
            - "Daypart.${dp_id}.status == ACTIVE (unchanged)"

      - name: open_without_dayparts_rejected
        claim_type: precondition_enforcement
        grounds:
          - state_machines.StoreDay.PLANNING_to_OPEN
          - errors[ERR_NO_DAYPARTS_DEFINED]
        distinguishing_aspect: "Opening a store day with zero dayparts returns ERR_NO_DAYPARTS_DEFINED; status stays PLANNING."
        test_recipe:
          setup:
            - "StoreDay 2026-10-09 created with no dayparts"
          setup_api_calls:
