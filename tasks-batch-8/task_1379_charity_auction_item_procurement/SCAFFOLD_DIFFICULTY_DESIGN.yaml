            - { call: "GET /dispositions", payload: { item_id: "${it}" }, as: GalaAdmin, captures: { disp: "$.data[0].id" } }
          trigger:
            - { call: "POST /dispositions/${disp}/decide", payload: { decision: "RETURN_TO_DONOR" }, as: GalaAdmin, captures: { st1: "$.data.status" } }
            - { call: "POST /dispositions/${disp}/donor-response", payload: { accept: false }, as: Donor, as_user_id: "${dn}", captures: { st2: "$.data.status", dec2: "$.data.decision" } }
            - { call: "POST /dispositions/${disp}/decide", payload: { decision: "DISCARD" }, as: GalaAdmin, captures: { st3: "$.data.status" } }
            - { call: "POST /dispositions/${disp}/donor-response", payload: { accept: true }, as: Donor, as_user_id: "${dn}", captures: { st4: "$.data.status" } }
            - { call: "GET /items/${it}", payload: {}, as: GalaAdmin, captures: { it_st: "$.data.status" } }
            - { call: "GET /acknowledgments", payload: { item_id: "${it}" }, as: FinanceOfficer, captures: { ack_st: "$.data[0].status" } }
            - { call: "GET /bundles/${bd}", payload: {}, as: GalaAdmin, captures: { bd_st: "$.data.status" } }
          assert:
            - "after decide RETURN_TO_DONOR: status == DONOR_NOTIFIED"
            - "after donor decline: status == PROPOSED and decision == null (cycle reset)"
            - "after decide DISCARD: status == DONOR_NOTIFIED"
            - "after donor accept: status == EXECUTED"
            - "Item.${it}.status == DISCARDED"
            - "acknowledgment for item ${it} remains PENDING (DISCARD keeps the gift ack issuable)"
            - "Bundle.${bd}.status == DISPOSITIONED (bubble-up: all member item dispositions EXECUTED)"

  # ---------------------------------------------------------------------------
  - rule_id: transitive_cascade
    instances:
      - name: close_bidding_cascade_depth_four
        grounds:
          - state_machines.GalaEvent.BIDDING_OPEN_to_BIDDING_CLOSED
          - state_machines.Certificate.PENDING_ISSUE
        distinguishing_aspect: |
          Depth-4 chain from a single advance trigger: event closes -> bundle
          PUBLISHED->SOLD -> winning Bid ACTIVE->WINNER -> Invoice created ->
          Certificate created PENDING_ISSUE (each hop caused by the previous one,
          not by the advance directly); the parallel unsold branch (bundle UNSOLD
          -> items UNSOLD -> Disposition PROPOSED) fires only on the sibling bundle.
        test_recipe:
          setup:
            - "Event BIDDING_OPEN with two PUBLISHED bundles: bdWin (EXPERIENCE item, FMV 40000, one bid 50000) and bdNone (PHYSICAL item, FMV 30000, no bids)"
