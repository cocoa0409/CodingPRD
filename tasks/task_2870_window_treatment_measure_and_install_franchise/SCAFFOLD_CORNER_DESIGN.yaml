            - call: "GET /blinds/consultations/${c2}"
              as: Designer
              as_user_id: "${d1}"
              captures: { c2_v2: $.data.version }
          assert:
            - "measuring and configuring moved the parent: the captured ${c1_v1} is strictly greater than ${c1_v0}, and ${c1_configured} == 1"
            - "the captured ${e_stale} == ERR_STALE_CONSULTATION_VERSION (412) when the version captured at creation is replayed after those two child writes"
            - "the refusal did not advance the counter: the captured ${c1_v2} == ${c1_v1} exactly - a client that reads, fails and retries with the value it just read must be able to succeed"
            - "and it does: the retry with ${c1_v1} creates ${q1} with ${q1_sub} == 4960"
            - "a successful write does advance it: the captured ${c1_v3} is strictly greater than ${c1_v1}"
            - "the counter is per row: the captured ${c2_v1} == ${c2_v0} and ${c2_v2} == ${c2_v0} - nothing that happened to C1, successful or refused, touched C2"
            - "version is a system field: it appears on every read of both consultations and is never accepted as an input on POST /blinds/consultations"

      - name: every_derived_counter_is_recounted_rather_than_incremented
        claim_type: derived_field_reconciliation
        grounds:
