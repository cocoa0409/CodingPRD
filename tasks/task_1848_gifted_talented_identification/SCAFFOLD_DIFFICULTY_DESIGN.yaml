        grounds:
          - calculations.cut_score_determination
        distinguishing_aspect: |
          Numeric threshold boundary on the finalize endpoint: composite exactly equal to
          cut_score (95 == 95) must identify (>= semantics), reachable via
          POST /gifted/cases/{id}/finalize-scoring. Percentiles 95/95/95 with weights
          0.40/0.30/0.20 renormalized (no PORTFOLIO) give per-line 42.22 + 31.67 + 21.11 = 95.00
          -> composite 95.
        test_recipe:
          setup:
            - "clock 2026-08-20; site; grade-3 student; cycle P_BAND published, SCORING"
            - "case with ABILITY 95, ACHIEVEMENT 95, RATING_SCALE 95 (no PORTFOLIO)"
