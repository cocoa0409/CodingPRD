              as_user_id: "u-sponsor-1"
              captures: { err: $.data.error_id }
          assert:
            - "error_id == \"ERR_INVALID_STATE_TRANSITION\" (state priority 4 beats fiscal priority 9 even though 9000 > 1000 balance)"
            - "CorrectiveAction.${ca}.status == \"VERIFIED\""
            - "Participant.${p1}.account_balance_cents == 1000"

