              payload: { van_code: "VAN-7", part_sku: "PUMP_ASSY_12", on_van_units: 5 }
              as: NetworkAdmin
              captures: { vp: $.data.id }
          trigger:
            - call: "GET /fountain-network/van-part-stocks/${vp}"
              as: ServiceTechnician
          assert:
            - "HTTP status == 200"
            - "response body data.van_code == \"VAN-7\""
            - "response body data.part_sku == \"PUMP_ASSY_12\""
            - "response body data.on_van_units == 5"
            - "response body data.initial_units == 5"
            - "response body data.reserved_units == 0"
            - "response body data.consumed_units == 0"
            - "response body data.restocked_units == 0"
            - "response body data.version == 1"

