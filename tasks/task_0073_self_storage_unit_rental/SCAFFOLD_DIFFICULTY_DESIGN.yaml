# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# Self-Storage Unit Rental — Expert band. 9 rules x 2 instances = 18 instances.
# =============================================================================
scaffold_difficulty_design:

  # ---------------------------------------------------------------------------
  - rule_id: dual_variant_calc
    instances:
      - name: dual_lease_balance_denormalized_vs_ledger_replay
        grounds:
          - calculations.lease_balance
          - entities.Lease.fields.balance_cents
          - entities.LedgerEntry.fields.amount_cents
          - endpoints["GET /leases/{lease_id}/ledger-balance"]
        distinguishing_aspect: |
          Entity domain = Lease cost accounting. After a CHARGE (12000) and a partial PAYMENT (5000),
          the denormalized Lease.balance_cents (7000) MUST equal the ledger_replay_balance recomputed
          by summing signed LedgerEntry.amount_cents in created_at ASC order (12000 - 5000 = 7000).
        test_recipe:
          setup:
            - "Climate facility; one climate unit @ 10000/mo, 0.20 premium, no insurance."
            - "Lease activated 2026-04-01 (full-month first invoice = 12000); tenant pays 5000."
          setup_api_calls:
            - call: "POST /facilities"
              payload: { name: "F1", state_code: "TX", climate_premium_pct: 0.20, lien_default_days: 90, late_fee_grace_days: 5, late_fee_cents: 2000 }
              as: FacilityManager
              captures: { fac_id: $.data.id }
            - call: "POST /units"
              payload: { facility_id: "${fac_id}", unit_number: "A-1", size_class: "SIZE_10X10", monthly_rate_cents: 10000, climate_controlled: true }
              as: FacilityManager
              captures: { unit_id: $.data.id }
            - call: "POST /tenants"
              payload: { email: "t1@x.com", full_name: "T One", state_code: "TX" }
              as: FacilityManager
              captures: { ten_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-04-01T00:00:00Z" }
              as: FacilityManager
            - call: "POST /leases"
              payload: { unit_id: "${unit_id}", tenant_id: "${ten_id}", start_date: "2026-04-01T00:00:00Z", billing_day: 1, insurance_required: false }
              as: FacilityManager
              captures: { lease_id: $.data.id }
            - call: "POST /leases/${lease_id}/activate"
              payload: {}
              as: FacilityManager
            - call: "POST /payments"
              payload: { lease_id: "${lease_id}", amount_cents: 5000 }
              as: Tenant
              as_user_id: "${ten_id}"
          trigger:
            - call: "GET /leases/${lease_id}/ledger-balance"
              payload: {}
              as: FacilityManager
              captures: { replay_bal: $.data.balance_cents }
            - call: "GET /leases/${lease_id}"
              payload: {}
              as: FacilityManager
              captures: { denorm_bal: $.data.balance_cents }
          assert:
            - "Lease.${lease_id}.balance_cents == 7000 (denormalized read)"
            - "ledger-balance replay == 7000 (sum 12000 CHARGE - 5000 PAYMENT)"
            - "replay_bal == denorm_bal == 7000"

      - name: dual_redemption_lien_snapshot_vs_accruing_today
        grounds:
          - calculations.redemption_amount
          - entities.AuctionProceeding.fields.redemption_amount_cents
          - state_machines.AuctionProceeding.NOTICE_SENT_to_LIEN_FILED
          - endpoints["GET /auction-proceedings/{auction_id}"]
        distinguishing_aspect: |
          Entity domain = AuctionProceeding statutory lien math (NOT lease cost accounting). The
          lien_date_snapshot frozen at file-lien (29000 = 14000 outstanding + 15000 admin) differs
          from accruing_today (43000) after a second post-lien overdue invoice (+14000) is assessed.
        test_recipe:
          setup:
            - "Climate lease delinquent past 90 days; auction opened and lien filed at outstanding 14000 (one overdue 12000 + 2000 late)."
            - "Clock advanced; a second monthly invoice generated and driven overdue (+14000), so accruing today = 28000 outstanding + 15000 admin."
          setup_api_calls:
            - call: "POST /facilities"
              payload: { name: "F2", state_code: "TX", climate_premium_pct: 0.20, lien_default_days: 90, late_fee_grace_days: 5, late_fee_cents: 2000 }
              as: FacilityManager
              captures: { fac_id: $.data.id }
            - call: "POST /units"
              payload: { facility_id: "${fac_id}", unit_number: "A-2", size_class: "SIZE_10X10", monthly_rate_cents: 10000, climate_controlled: true }
              as: FacilityManager
              captures: { unit_id: $.data.id }
            - call: "POST /tenants"
              payload: { email: "t2@x.com", full_name: "T Two", state_code: "TX" }
              as: FacilityManager
              captures: { ten_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-04-01T00:00:00Z" }
              as: FacilityManager
            - call: "POST /leases"
              payload: { unit_id: "${unit_id}", tenant_id: "${ten_id}", start_date: "2026-04-01T00:00:00Z", billing_day: 1, insurance_required: false }
              as: FacilityManager
              captures: { lease_id: $.data.id }
            - call: "POST /leases/${lease_id}/activate"
              payload: {}
              as: FacilityManager
              captures: { lease_v: $.data.version }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-02T00:00:00Z" }
              as: FacilityManager
            - call: "POST /facilities/${fac_id}/billing-cycles"
              payload: {}
              as: FacilityManager
            - call: "POST /auction-proceedings"
              payload: { lease_id: "${lease_id}", expected_lease_version: "${lease_v}" }
              as: LienAdministrator
              captures: { auction_id: $.data.id, lease_v2: $.data.version }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-16T00:00:00Z" }
              as: FacilityManager
            - call: "POST /auction-proceedings/${auction_id}/file-lien"
              payload: {}
              as: LienAdministrator
              captures: { snap: $.data.redemption_amount_cents }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T00:00:00Z" }
              as: FacilityManager
            - call: "POST /facilities/${fac_id}/billing-cycles"
              payload: {}
              as: FacilityManager
          trigger:
            - call: "GET /auction-proceedings/${auction_id}"
              payload: {}
              as: LienAdministrator
              captures: { live_redemption: $.data.redemption_amount_cents }
          assert:
            - "lien_date_snapshot (captured snap at file-lien) == 29000"
            - "AuctionProceeding.${auction_id}.redemption_amount_cents (accruing_today GET) == 43000"
            - "live_redemption (43000) > snap (29000)"

  # ---------------------------------------------------------------------------
  - rule_id: combinatorial_formula
    instances:
      - name: combinatorial_monthly_charge_rounding_order_mode_b
        grounds:
          - calculations.monthly_charge_components
          - entities.Invoice.fields.climate_amount_cents
          - entities.Invoice.fields.total_amount_cents
          - endpoints["POST /facilities/{facility_id}/billing-cycles"]
        distinguishing_aspect: |
          Mode (b) pinned rounding order: round each component to whole cents THEN sum. base=10033,
          premium 0.155 -> climate=round_half_up(10033*0.155)=1555; insurance=1500; total=10033+1555+1500=13088.
          Summing fractionals first (10033 + 1555.115 + 1500 = 13088.115 -> 13088) coincides here, but the
          PINNED rule is per-component rounding; the scaffold fixes that order explicitly.
        test_recipe:
          setup:
            - "Facility with climate_premium_pct=0.155; climate unit base 10033; lease has STANDARD insurance (1500/mo)."
            - "Activate on 2026-05-01 (full month). The first invoice exercises per-component rounding."
          setup_api_calls:
            - call: "POST /facilities"
              payload: { name: "F3", state_code: "TX", climate_premium_pct: 0.155, lien_default_days: 90, late_fee_grace_days: 5, late_fee_cents: 2000 }
              as: FacilityManager
              captures: { fac_id: $.data.id }
            - call: "POST /units"
              payload: { facility_id: "${fac_id}", unit_number: "A-3", size_class: "SIZE_10X20", monthly_rate_cents: 10033, climate_controlled: true }
              as: FacilityManager
              captures: { unit_id: $.data.id }
            - call: "POST /tenants"
              payload: { email: "t3@x.com", full_name: "T Three", state_code: "TX" }
              as: FacilityManager
              captures: { ten_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: FacilityManager
            - call: "POST /leases"
              payload: { unit_id: "${unit_id}", tenant_id: "${ten_id}", start_date: "2026-05-01T00:00:00Z", billing_day: 1, insurance_required: true }
              as: FacilityManager
              captures: { lease_id: $.data.id }
            - call: "POST /insurance-policies"
              payload: { lease_id: "${lease_id}", coverage_tier: "STANDARD", coverage_start: "2026-05-01T00:00:00Z" }
              as: FacilityManager
          trigger:
            - call: "POST /leases/${lease_id}/activate"
              payload: {}
              as: FacilityManager
            - call: "GET /invoices?lease_id=${lease_id}"
              payload: {}
              as: FacilityManager
              captures: { inv0_total: "$.data[0].total_amount_cents", inv0_climate: "$.data[0].climate_amount_cents" }
          assert:
            - "Invoice[0].climate_amount_cents == 1555 (round_half_up(10033 * 0.155))"
            - "Invoice[0].insurance_amount_cents == 1500"
            - "Invoice[0].total_amount_cents == 13088 (10033 + 1555 + 1500, summed after per-component rounding)"

      - name: combinatorial_prorated_first_charge_conditional_mode_a
        grounds:
          - calculations.prorated_first_charge
          - calculations.monthly_charge_components
          - entities.Invoice.fields.base_amount_cents
          - endpoints["POST /leases/{lease_id}/activate"]
        distinguishing_aspect: |
          Mode (a): >=3 inputs (day-of-month, days_in_month, full monthly total with conditional climate
          branch) and a single end rounding. Climate lease, no insurance: monthly_total=12000; start
          2026-04-21 (April 30d, day 21 -> 10 occupied days) -> round_half_up(12000*10/30)=4000.
        test_recipe:
          setup:
            - "Climate facility 0.20 premium; climate unit base 10000; lease no insurance; activate 2026-04-21."
          setup_api_calls:
            - call: "POST /facilities"
              payload: { name: "F4", state_code: "TX", climate_premium_pct: 0.20, lien_default_days: 90, late_fee_grace_days: 5, late_fee_cents: 2000 }
              as: FacilityManager
              captures: { fac_id: $.data.id }
            - call: "POST /units"
              payload: { facility_id: "${fac_id}", unit_number: "A-4", size_class: "SIZE_10X10", monthly_rate_cents: 10000, climate_controlled: true }
              as: FacilityManager
              captures: { unit_id: $.data.id }
            - call: "POST /tenants"
              payload: { email: "t4@x.com", full_name: "T Four", state_code: "TX" }
              as: FacilityManager
              captures: { ten_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-04-21T00:00:00Z" }
              as: FacilityManager
            - call: "POST /leases"
              payload: { unit_id: "${unit_id}", tenant_id: "${ten_id}", start_date: "2026-04-21T00:00:00Z", billing_day: 1, insurance_required: false }
              as: FacilityManager
              captures: { lease_id: $.data.id }
          trigger:
            - call: "POST /leases/${lease_id}/activate"
              payload: {}
              as: FacilityManager
              captures: { bal: $.data.balance_cents }
            - call: "GET /invoices?lease_id=${lease_id}"
              payload: {}
              as: FacilityManager
              captures: { inv0_base: "$.data[0].base_amount_cents" }
          assert:
            - "Invoice[0].total_amount_cents == 4000 (round_half_up(12000 * 10/30))"
            - "Lease.${lease_id}.balance_cents == 4000 after activation"

  # ---------------------------------------------------------------------------
  - rule_id: non_linear_state_machine
    instances:
      - name: nonlinear_lease_delinquency_cure_cycle
        grounds:
          - state_machines.Lease.ACTIVE_to_DELINQUENT
          - state_machines.Lease.DELINQUENT_to_ACTIVE
          - endpoints["POST /facilities/{facility_id}/billing-cycles"]
          - endpoints["POST /payments"]
        distinguishing_aspect: |
          Cyclic shape on entity Lease: ACTIVE -> DELINQUENT (billing-cycle past grace) -> ACTIVE
          (full payment cures). The same lease returns to a prior state, which a linear pipeline cannot.
        test_recipe:
          setup:
            - "Climate lease, no insurance, activated 2026-04-01 (invoice 12000). Clock advanced past grace and a billing-cycle run flips it DELINQUENT with a 2000 late fee (balance 14000)."
          setup_api_calls:
            - call: "POST /facilities"
              payload: { name: "F5", state_code: "TX", climate_premium_pct: 0.20, lien_default_days: 90, late_fee_grace_days: 5, late_fee_cents: 2000 }
              as: FacilityManager
              captures: { fac_id: $.data.id }
            - call: "POST /units"
              payload: { facility_id: "${fac_id}", unit_number: "A-5", size_class: "SIZE_10X10", monthly_rate_cents: 10000, climate_controlled: true }
              as: FacilityManager
              captures: { unit_id: $.data.id }
            - call: "POST /tenants"
              payload: { email: "t5@x.com", full_name: "T Five", state_code: "TX" }
              as: FacilityManager
              captures: { ten_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-04-01T00:00:00Z" }
              as: FacilityManager
            - call: "POST /leases"
              payload: { unit_id: "${unit_id}", tenant_id: "${ten_id}", start_date: "2026-04-01T00:00:00Z", billing_day: 1, insurance_required: false }
              as: FacilityManager
              captures: { lease_id: $.data.id }
            - call: "POST /leases/${lease_id}/activate"
              payload: {}
              as: FacilityManager
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-04-20T00:00:00Z" }
              as: FacilityManager
            - call: "POST /facilities/${fac_id}/billing-cycles"
              payload: {}
              as: FacilityManager
          trigger:
            - call: "POST /payments"
              payload: { lease_id: "${lease_id}", amount_cents: 14000 }
              as: Tenant
              as_user_id: "${ten_id}"
            - call: "GET /leases/${lease_id}"
              payload: {}
              as: FacilityManager
              captures: { st: $.data.status, bal: $.data.balance_cents }
          assert:
            - "Before payment Lease.status == DELINQUENT with balance_cents == 14000"
            - "After full payment Lease.${lease_id}.status == ACTIVE (cured back to prior state)"
            - "Lease.${lease_id}.balance_cents == 0 and days_past_due == 0"

      - name: nonlinear_auction_fork_join_scheduled_branches
        grounds:
          - state_machines.AuctionProceeding.SCHEDULED_to_SOLD
          - state_machines.AuctionProceeding.NOTICE_SENT_to_REDEEMED
          - state_machines.AuctionProceeding.NOTICE_SENT_to_CANCELLED
          - endpoints["POST /auction-proceedings/{auction_id}/complete-sale"]
        distinguishing_aspect: |
          Branching fork-join on entity AuctionProceeding (different entity from the Lease cycle): from
          the SCHEDULED/open states the proceeding diverges to SOLD vs REDEEMED vs CANCELLED, each with
          a distinct side-effect set (SOLD frees the unit + cancels insurance; REDEEMED restores lease).
        test_recipe:
          setup:
            - "Delinquent climate lease past 90 days; auction opened, lien filed, sale scheduled; ready to complete-sale."
          setup_api_calls:
            - call: "POST /facilities"
              payload: { name: "F6", state_code: "TX", climate_premium_pct: 0.20, lien_default_days: 90, late_fee_grace_days: 5, late_fee_cents: 2000 }
              as: FacilityManager
              captures: { fac_id: $.data.id }
            - call: "POST /units"
              payload: { facility_id: "${fac_id}", unit_number: "A-6", size_class: "SIZE_10X10", monthly_rate_cents: 10000, climate_controlled: true }
              as: FacilityManager
              captures: { unit_id: $.data.id }
            - call: "POST /tenants"
              payload: { email: "t6@x.com", full_name: "T Six", state_code: "TX" }
              as: FacilityManager
              captures: { ten_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-04-01T00:00:00Z" }
              as: FacilityManager
            - call: "POST /leases"
              payload: { unit_id: "${unit_id}", tenant_id: "${ten_id}", start_date: "2026-04-01T00:00:00Z", billing_day: 1, insurance_required: false }
              as: FacilityManager
              captures: { lease_id: $.data.id }
            - call: "POST /leases/${lease_id}/activate"
              payload: {}
              as: FacilityManager
              captures: { lease_v: $.data.version }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-02T00:00:00Z" }
              as: FacilityManager
            - call: "POST /facilities/${fac_id}/billing-cycles"
              payload: {}
              as: FacilityManager
            - call: "POST /auction-proceedings"
              payload: { lease_id: "${lease_id}", expected_lease_version: "${lease_v}" }
              as: LienAdministrator
              captures: { auction_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-16T00:00:00Z" }
              as: FacilityManager
            - call: "POST /auction-proceedings/${auction_id}/file-lien"
              payload: {}
              as: LienAdministrator
            - call: "POST /auction-proceedings/${auction_id}/schedule"
              payload: { scheduled_sale_date: "2026-08-01T00:00:00Z" }
              as: LienAdministrator
          trigger:
            - call: "POST /auction-proceedings/${auction_id}/complete-sale"
              payload: { sale_proceeds_cents: 60000 }
              as: LienAdministrator
              captures: { ast: $.data.status }
            - call: "GET /leases/${lease_id}"
              payload: {}
              as: FacilityManager
              captures: { lst: $.data.status }
            - call: "GET /units/${unit_id}"
              payload: {}
              as: FacilityManager
              captures: { ust: $.data.status }
          assert:
            - "AuctionProceeding.${auction_id}.status == SOLD (chose the SOLD branch)"
            - "Lease.${lease_id}.status == AUCTIONED"
            - "Unit.${unit_id}.status == AVAILABLE (SOLD-branch side effect; REDEEMED branch would NOT free the unit)"

  # ---------------------------------------------------------------------------
  - rule_id: transitive_cascade
    instances:
      - name: cascade_auction_sold_to_lease_to_unit_to_insurance_depth3
        grounds:
          - state_machines.AuctionProceeding.SCHEDULED_to_SOLD
          - state_machines.Lease.AUCTION_SCHEDULED_to_AUCTIONED
          - state_machines.Unit.OCCUPIED_to_AVAILABLE
          - state_machines.InsurancePolicy.ACTIVE_to_CANCELLED
        distinguishing_aspect: |
          Depth >=3 originating at complete-sale: AuctionProceeding->SOLD mutates Lease->AUCTIONED, which
          itself frees Unit->AVAILABLE (recompute occupied_unit_count), which/and cancels the lease's ACTIVE
          InsurancePolicy. Each hop is caused by the prior hop, not directly by complete-sale.
        test_recipe:
          setup:
            - "Delinquent climate lease (insurance_required, STANDARD policy ACTIVE) past 90 days; auction filed + scheduled; occupied_unit_count==1."
          setup_api_calls:
            - call: "POST /facilities"
              payload: { name: "F7", state_code: "TX", climate_premium_pct: 0.20, lien_default_days: 90, late_fee_grace_days: 5, late_fee_cents: 2000 }
              as: FacilityManager
              captures: { fac_id: $.data.id }
            - call: "POST /units"
              payload: { facility_id: "${fac_id}", unit_number: "A-7", size_class: "SIZE_10X10", monthly_rate_cents: 10000, climate_controlled: true }
              as: FacilityManager
              captures: { unit_id: $.data.id }
            - call: "POST /tenants"
              payload: { email: "t7@x.com", full_name: "T Seven", state_code: "TX" }
              as: FacilityManager
              captures: { ten_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-04-01T00:00:00Z" }
              as: FacilityManager
            - call: "POST /leases"
              payload: { unit_id: "${unit_id}", tenant_id: "${ten_id}", start_date: "2026-04-01T00:00:00Z", billing_day: 1, insurance_required: true }
              as: FacilityManager
              captures: { lease_id: $.data.id }
            - call: "POST /insurance-policies"
              payload: { lease_id: "${lease_id}", coverage_tier: "STANDARD", coverage_start: "2026-04-01T00:00:00Z" }
              as: FacilityManager
              captures: { policy_id: $.data.id }
            - call: "POST /leases/${lease_id}/activate"
              payload: {}
              as: FacilityManager
              captures: { lease_v: $.data.version }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-02T00:00:00Z" }
              as: FacilityManager
            - call: "POST /facilities/${fac_id}/billing-cycles"
              payload: {}
              as: FacilityManager
            - call: "POST /auction-proceedings"
              payload: { lease_id: "${lease_id}", expected_lease_version: "${lease_v}" }
              as: LienAdministrator
              captures: { auction_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-16T00:00:00Z" }
              as: FacilityManager
            - call: "POST /auction-proceedings/${auction_id}/file-lien"
              payload: {}
              as: LienAdministrator
            - call: "POST /auction-proceedings/${auction_id}/schedule"
              payload: { scheduled_sale_date: "2026-08-01T00:00:00Z" }
              as: LienAdministrator
          trigger:
            - call: "POST /auction-proceedings/${auction_id}/complete-sale"
              payload: { sale_proceeds_cents: 60000 }
              as: LienAdministrator
            - call: "GET /insurance-policies/${policy_id}"
              payload: {}
              as: FacilityManager
              captures: { pst: $.data.status }
            - call: "GET /facilities/${fac_id}"
              payload: {}
              as: FacilityManager
              captures: { occ: $.data.occupied_unit_count }
          assert:
            - "Lease.${lease_id}.status == AUCTIONED (hop 1)"
            - "Unit.${unit_id}.status == AVAILABLE and Facility.${fac_id}.occupied_unit_count == 0 (hop 2)"
            - "InsurancePolicy.${policy_id}.status == CANCELLED (hop 3)"

      - name: cascade_payment_cure_to_invoice_to_lease_to_auction_depth3
        grounds:
          - state_machines.Invoice.OVERDUE_to_PAID
          - state_machines.Lease.DELINQUENT_to_ACTIVE
          - state_machines.AuctionProceeding.NOTICE_SENT_to_CANCELLED
          - endpoints["POST /payments"]
        distinguishing_aspect: |
          Different trigger (POST /payments) than the auction-sold cascade. Payment marks the OVERDUE
          Invoice PAID, which drives Lease back to ACTIVE (balance 0), which itself cancels the open
          NOTICE_SENT AuctionProceeding. Each hop caused by the previous.
        test_recipe:
          setup:
            - "Climate lease past 90 days; auction opened (NOTICE_SENT, lease LIEN). Outstanding 14000 (12000 + 2000 late)."
          setup_api_calls:
            - call: "POST /facilities"
              payload: { name: "F8", state_code: "TX", climate_premium_pct: 0.20, lien_default_days: 90, late_fee_grace_days: 5, late_fee_cents: 2000 }
              as: FacilityManager
              captures: { fac_id: $.data.id }
            - call: "POST /units"
              payload: { facility_id: "${fac_id}", unit_number: "A-8", size_class: "SIZE_10X10", monthly_rate_cents: 10000, climate_controlled: true }
              as: FacilityManager
              captures: { unit_id: $.data.id }
            - call: "POST /tenants"
              payload: { email: "t8@x.com", full_name: "T Eight", state_code: "TX" }
              as: FacilityManager
              captures: { ten_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-04-01T00:00:00Z" }
              as: FacilityManager
