      - name: retained_layer_is_credited_only_up_to_the_collateral_actually_held
        claim_type: constants_applied
        grounds:
          - calculations.claim_net_payable.constants.SELF_FUNDED_RETENTION_CREDIT_RULE
          - entities.TransferredPolicy.fields.collateral_held_cents
        distinguishing_aspect: "attachment_point_cents is min(large_deductible + SIR, collateral_held), so two identical 2000000 losses diverge: the fully collateralised policy absorbs the whole 500000 retention and pays 1490000, while the under-collateralised policy is credited only the 200000 actually posted and pays 1790000."
        test_recipe:
          setup:
            - "PERSONAL_AUTO CoverageProfile with per_claim_cap 3000000, aggregate cap 5000000 and the default 10000 statutory deductible."
            - "Insolvency in TRIGGERED with two cancelled policies: PA-A with large_deductible 500000 and collateral_held 500000, PA-B with large_deductible 500000 and collateral_held 200000."
          setup_api_calls:
            - call: "POST /coverage-profiles"
              payload: { line_of_business: "PERSONAL_AUTO", per_claim_cap_cents: 3000000, per_policy_aggregate_cap_cents: 5000000, unearned_premium_cap_cents: 1000000, refund_priority_class: 2 }
              as: AssociationAdmin
            - call: "POST /insolvencies"
              payload: { insurer_name: "Great Lakes Mutual Casualty", naic_code: "10001", domiciliary_state_code: "MI", liquidation_order_date: "2026-03-01" }
              as: AssociationAdmin
