            - "trigger 18 returns HTTP 409 with data.error_id == ERR_OPEN_CLAIMS_ON_POLICY because open_claim_count is 1, and the policy is still ACTIVE with coverage_posture OPEN"

      - name: payment_that_would_drive_paid_loss_past_the_aggregate_limit_is_rejected
        claim_type: error_triggerable
        grounds:
          - errors.ERR_AGGREGATE_LIMIT_EXCEEDED
          - errors.ERR_POLICY_UNDER_CLAIMS_REVIEW
          - calculations.policy_loss_experience
        distinguishing_aspect: "A deliberately thin classification (aggregate limit 500000, per-injury limit 400000, annual premium 36000) lets two paid claims reach the aggregate ceiling. The discriminating pair is the second claim's payment attempts: 400000 and 100001 are refused because they would drive paid_loss ABOVE 500000, while 100000 lands exactly ON the limit and is accepted. The instance also proves CLAIMS_REVIEW is enrollment-only: it blocks a new enrollment with ERR_POLICY_UNDER_CLAIMS_REVIEW while repricing, adjudicating and paying continue unimpeded."
        test_recipe:
          setup:
            - "One league and one TRACK_U10 classification: CLASS_1_LOW (no hazard loading), base rate 1200, deductible 10000, per_injury_limit 400000, cat_attachment_point 400000, aggregate_limit 500000, cat_lifetime_max 500000, minimum_participants 10, travel buffer 30."
            - "One ACTIVE policy for 30 participants with the catastrophic layer NOT elected and FULL_EXCESS_PERMITTED: gross premium 30 x 1200 = 36000, no catastrophic charge, no volume credit, annual_premium_cents 36000."
            - "Athletes A and B are enrolled BEFORE any claim exists; athlete C is created but deliberately left unenrolled for the CLAIMS_REVIEW probe."
            - "One SANCTIONED practice on 2026-07-11 covers both injuries, each filed MINOR so the case reserve is only min(50000, per_injury_limit 400000) = 50000 while the allowed amount stays large."
            - "Each athlete's bill is SURGERY in-network 620000 billed / 600000 scheduled: negotiated 600000, MINOR severity leaves the 600000 category cap unadjusted, allowed 600000. On the full-excess basis the deductible is 10000 x 2 = 20000, so benefit_before_limit is 580000 and the base layer pays min(580000, 400000) = 400000 with no catastrophic layer elected."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-05T00:00:00Z" }
              as: ProgramAdministrator
