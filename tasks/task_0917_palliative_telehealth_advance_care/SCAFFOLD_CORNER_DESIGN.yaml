              payload: { mrn: "MRN-2028", full_name: "Cleo Bergman", date_of_birth: "1950-01-01", jurisdiction_code: "JUR_TWO_WITNESS", attending_clinician_user_id: "u_attending_1", opioid_status: "OPIOID_TOLERANT" }
