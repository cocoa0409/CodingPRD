    exclusive_operations: []
    shared_operations:
      - "POST /owners, POST /vehicles, POST /real-id-applications, POST /fee-assessments/{id}/pay"
      - "All GET endpoints scoped to readable resources"

  - name: DmvAdmin
    description: "DMV operator with override authority over registration lifecycle and fiscal voids."
    identity: opaque
    exclusive_operations:
      - "POST /registrations/{id}/suspend"
      - "POST /registrations/{id}/reinstate"
      - "POST /registrations/{id}/expire"
      - "POST /fee-assessments/{id}/void"
    shared_operations:
      - "POST /owners, POST /vehicles, POST /vin-verifications, POST /title-applications, POST /liens, POST /registrations, POST /fee-assessments"
      - "POST /emissions-inspections, POST /salvage-inspections"
      - "POST /liens/{id}/release, POST /fee-assessments/{id}/pay"
      - "All GET endpoints"
