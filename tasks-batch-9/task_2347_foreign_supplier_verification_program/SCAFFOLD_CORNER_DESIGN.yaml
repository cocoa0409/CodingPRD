            - call: "POST /fsvp/qualified-individuals"
              payload: { importer_id: "${imp}", full_name: "Ada Ruiz", email: "ada@northbrook.example", qualification_summary: "PCQI and FSVP training plus eight years of supplier audit experience", training_completed_at: "2025-06-01T00:00:00Z" }
              as: ComplianceOfficer
              captures: { qi_a: $.data.id }
            - call: "POST /fsvp/qualified-individuals/${qi_a}/designation"
              payload: { action: "DESIGNATE" }
              as: ComplianceOfficer
            - call: "POST /fsvp/qualified-individuals"
              payload: { importer_id: "${imp}", full_name: "Ben Osei", email: "ben@northbrook.example", qualification_summary: "Preventive controls qualified individual with laboratory oversight background", training_completed_at: "2025-07-01T00:00:00Z" }
              as: ComplianceOfficer
              captures: { qi_b: $.data.id }
            - call: "POST /fsvp/qualified-individuals/${qi_b}/designation"
              payload: { action: "DESIGNATE" }
              as: ComplianceOfficer
            - call: "POST /fsvp/foreign-suppliers"
              payload: { importer_id: "${imp}", name: "Rio Verde SA", country_code: "PE", facility_registration_number: "FRN-PE-77001", regulatory_compliance_status: "NO_ADVERSE_FINDINGS" }
              as: ComplianceOfficer
              captures: { sup: $.data.id }
            - call: "POST /fsvp/foreign-suppliers/${sup}/evaluation"
              payload: { decision: "APPROVE", performance_basis_note: "No adverse FDA findings and two acceptable prior audits on file" }
              as: QualifiedIndividual
              as_user_id: "${qi_a}"
            - call: "POST /fsvp/foods"
              payload: { importer_id: "${imp}", food_name: "Frozen mango chunks", fda_product_code: "20-MAN-01", is_raw_agricultural_commodity: false, intended_consumer_group: "GENERAL", ready_to_eat: true }
              as: ComplianceOfficer
              captures: { food1: $.data.id }
            - call: "POST /fsvp/supplier-food-pairs"
              payload: { importer_id: "${imp}", supplier_id: "${sup}", food_id: "${food1}", designated_qi_id: "${qi_a}" }
              as: ComplianceOfficer
              captures: { pair1: $.data.id, pair1_v: $.data.version }
            - call: "POST /fsvp/hazard-analyses"
              payload: { pair_id: "${pair1}", expected_pair_version: "${pair1_v}", methodology_note: "Codex hazard identification for frozen ready-to-eat fruit" }
              as: QualifiedIndividual
              as_user_id: "${qi_a}"
              captures: { ha1: $.data.id }
            - call: "POST /fsvp/hazard-analyses/${ha1}/hazards"
              payload: { hazard_type: "BIOLOGICAL", hazard_name: "Listeria monocytogenes", severity: 4, probability: 3, control_owner: "FOREIGN_SUPPLIER" }
              as: QualifiedIndividual
              as_user_id: "${qi_a}"
            - call: "POST /fsvp/hazard-analyses/${ha1}/approval"
              payload: { approval_note: "Hazard analysis complete for this supplier and food combination" }
              as: QualifiedIndividual
              as_user_id: "${qi_a}"
            - call: "POST /fsvp/verification-activities"
              payload: { pair_id: "${pair1}", activity_type: "SAMPLING_AND_TESTING", frequency_per_year: 3, justification_text: "Three sampling events per year covering the pathogen profile of this frozen ready to eat fruit", window_start: "2026-10-01T00:00:00Z", window_end: "2026-10-15T00:00:00Z", assigned_qi_id: "${qi_b}" }
              as: QualifiedIndividual
              as_user_id: "${qi_a}"
              captures: { act1: $.data.id }
            - call: "POST /fsvp/verification-activities/${act1}/review"
              payload: { decision: "APPROVE", reviewer_note: "Sampling plan matches the pathogen profile of the food" }
              as: QualifiedIndividual
              as_user_id: "${qi_b}"
          trigger:
            - call: "POST /fsvp/supplier-food-pairs/${pair1}/verification-approval"
              payload: { approval_note: "Approving on behalf of the qualified individual" }
              as: ComplianceOfficer
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 403 with ERR_ROLE_NOT_PERMITTED"
            - "SupplierFoodPair.${pair1}.verification_status == HAZARD_ANALYZED"
            - "SupplierFoodPair.${pair1}.version == 3"
            - "the same call as QualifiedIndividual ${qi_a} returns 200 with VERIFICATION_APPROVED"

      - name: qualified_individual_cannot_decide_a_corrective_action_even_for_a_missing_action
        claim_type: cannot_perform_other_roles_exclusive_operations
        grounds:
          - roles.ComplianceOfficer.exclusive_operations
          - errors.ERR_ROLE_NOT_PERMITTED
          - validations[priority=2]
          - validations[priority=12]
        distinguishing_aspect: "The corrective-action id does not exist, yet the response is 403 and not 404: rung 2 fires before the corrective-action lookup at rung 12, so a forbidden caller learns nothing about which action ids exist."
        test_recipe:
          setup:
            - "Importer, ACTIVE QI Ada and a supplier exist; no CorrectiveAction row has ever been created."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /fsvp/importers"
              payload: { legal_name: "Northbrook Foods Import LLC", dnb_number: "123456789", unique_facility_identifier: "UFI-NB-0001" }
              as: ComplianceOfficer
              captures: { imp: $.data.id }
            - call: "POST /fsvp/qualified-individuals"
              payload: { importer_id: "${imp}", full_name: "Ada Ruiz", email: "ada@northbrook.example", qualification_summary: "PCQI and FSVP training plus eight years of supplier audit experience", training_completed_at: "2025-06-01T00:00:00Z" }
              as: ComplianceOfficer
              captures: { qi_a: $.data.id }
            - call: "POST /fsvp/qualified-individuals/${qi_a}/designation"
              payload: { action: "DESIGNATE" }
              as: ComplianceOfficer
            - call: "POST /fsvp/foreign-suppliers"
              payload: { importer_id: "${imp}", name: "Rio Verde SA", country_code: "PE", facility_registration_number: "FRN-PE-77001", regulatory_compliance_status: "NO_ADVERSE_FINDINGS" }
              as: ComplianceOfficer
              captures: { sup: $.data.id }
            - call: "GET /fsvp/foreign-suppliers/${sup}"
              payload: {}
              as: ComplianceOfficer
              captures: { sup_v: $.data.version }
          trigger:
            - call: "POST /fsvp/corrective-actions/00000000-0000-4000-8000-0000000000ff/decision"
              payload: { decision: "IMPORT_SUSPENSION", rationale: "Attempting to suspend imports without compliance-office authority", expected_supplier_version: "${sup_v}" }
              as: QualifiedIndividual
              as_user_id: "${qi_a}"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 403 with ERR_ROLE_NOT_PERMITTED (NOT 404 ERR_CORRECTIVE_ACTION_NOT_FOUND)"
            - "ForeignSupplier.${sup}.status == UNEVALUATED"
            - "ForeignSupplier.${sup}.version is unchanged"

      - name: qualified_individual_cannot_read_an_entry_submission
        claim_type: cannot_perform_other_roles_exclusive_operations
        grounds:
          - roles.QualifiedIndividual.shared_operations
          - roles.EntryFiler.shared_operations
          - errors.ERR_ROLE_NOT_PERMITTED
        distinguishing_aspect: "The QualifiedIndividual may read every other resource in the programme, so this is a peer-role read partition rather than a blanket read restriction: entry-line reads belong to ComplianceOfficer, EntryFiler and FdaInspector only, and the 403 again precedes the entry-submission lookup at rung 13."
        test_recipe:
          setup:
            - "Importer and ACTIVE QI Ada exist; no entry line has ever been filed."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /fsvp/importers"
              payload: { legal_name: "Northbrook Foods Import LLC", dnb_number: "123456789", unique_facility_identifier: "UFI-NB-0001" }
              as: ComplianceOfficer
              captures: { imp: $.data.id }
            - call: "POST /fsvp/qualified-individuals"
              payload: { importer_id: "${imp}", full_name: "Ada Ruiz", email: "ada@northbrook.example", qualification_summary: "PCQI and FSVP training plus eight years of supplier audit experience", training_completed_at: "2025-06-01T00:00:00Z" }
              as: ComplianceOfficer
              captures: { qi_a: $.data.id }
            - call: "POST /fsvp/qualified-individuals/${qi_a}/designation"
              payload: { action: "DESIGNATE" }
              as: ComplianceOfficer
          trigger:
            - call: "GET /fsvp/entry-submissions/00000000-0000-4000-8000-0000000000ff"
              payload: {}
              as: QualifiedIndividual
              as_user_id: "${qi_a}"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 403 with ERR_ROLE_NOT_PERMITTED"
            - "GET /fsvp/importers/${imp} as the same QualifiedIndividual returns 200, proving the restriction is per-resource and not per-role-wide"

      - name: fda_inspector_reads_the_records_package_shared_with_the_compliance_officer
        claim_type: can_perform_all_exclusive_and_shared_operations
        grounds:
          - roles.FdaInspector.shared_operations
          - endpoints["GET /fsvp/importers/{id}/records-package"]
          - calculations.record_retention_and_availability
        distinguishing_aspect: "FdaInspector holds no exclusive operation at all, yet the records-availability package — the statutory 'available for inspection' surface — must answer for that role, and it answers identically for the ComplianceOfficer."
        test_recipe:
          setup:
            - "Importer with one ACTIVE designated QI and no pairs or records yet."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /fsvp/importers"
              payload: { legal_name: "Northbrook Foods Import LLC", dnb_number: "123456789", unique_facility_identifier: "UFI-NB-0001" }
              as: ComplianceOfficer
              captures: { imp: $.data.id }
            - call: "POST /fsvp/qualified-individuals"
              payload: { importer_id: "${imp}", full_name: "Ada Ruiz", email: "ada@northbrook.example", qualification_summary: "PCQI and FSVP training plus eight years of supplier audit experience", training_completed_at: "2025-06-01T00:00:00Z" }
              as: ComplianceOfficer
              captures: { qi_a: $.data.id }
            - call: "POST /fsvp/qualified-individuals/${qi_a}/designation"
              payload: { action: "DESIGNATE" }
              as: ComplianceOfficer
          trigger:
            - call: "GET /fsvp/importers/${imp}/records-package"
              payload: {}
              as: FdaInspector
              captures: { pkg_status: $.data.program_status }
          assert:
            - "HTTP 200"
            - "program_status == COMPLIANT"
            - "retained_record_count == 0 and available_record_count == 0 and expired_record_count == 0 and rescinded_record_count == 0"
            - "the identical call as ComplianceOfficer returns the same body"

      - name: fda_inspector_cannot_patch_the_supplier_compliance_status
        claim_type: cannot_perform_other_roles_exclusive_operations
        grounds:
          - roles.FdaInspector.exclusive_operations
          - roles.ComplianceOfficer.exclusive_operations
          - errors.ERR_ROLE_NOT_PERMITTED
        distinguishing_aspect: "The regulator is strictly read-only: recording an FDA import alert against a supplier is the importer's own compliance-office duty, so even the write that mirrors regulator information is refused to the regulator."
        test_recipe:
          setup:
            - "Importer and supplier exist with regulatory_compliance_status NO_ADVERSE_FINDINGS."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /fsvp/importers"
              payload: { legal_name: "Northbrook Foods Import LLC", dnb_number: "123456789", unique_facility_identifier: "UFI-NB-0001" }
              as: ComplianceOfficer
              captures: { imp: $.data.id }
            - call: "POST /fsvp/foreign-suppliers"
              payload: { importer_id: "${imp}", name: "Rio Verde SA", country_code: "PE", facility_registration_number: "FRN-PE-77001", regulatory_compliance_status: "NO_ADVERSE_FINDINGS" }
              as: ComplianceOfficer
              captures: { sup: $.data.id }
          trigger:
            - call: "PATCH /fsvp/foreign-suppliers/${sup}/compliance-status"
              payload: { regulatory_compliance_status: "IMPORT_ALERT", source_reference: "FDA import alert 99-05 published 2026-08-28" }
              as: FdaInspector
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 403 with ERR_ROLE_NOT_PERMITTED"
            - "ForeignSupplier.${sup}.regulatory_compliance_status == NO_ADVERSE_FINDINGS"
            - "ForeignSupplier.${sup}.version is unchanged"
            - "GET /fsvp/foreign-suppliers/${sup} as FdaInspector returns 200"

      - name: activity_proposer_reviewing_their_own_activity_returns_segregation_of_duties
        claim_type: segregation_of_duties
        grounds:
          - roles.QualifiedIndividual.notes
          - errors.ERR_SEGREGATION_OF_DUTIES
          - validations[priority=43]
        distinguishing_aspect: "Both parties share ONE role, so no role check can separate them: the split is enforced on X-User-ID against activity.proposed_by_qi_id, and the activity is still PROPOSED so the revisability rung at 23 passes."
        test_recipe:
          setup:
            - "Shared fixture up to activity A1 PROPOSED by Ada and assigned to Ben; Ada then tries to review her own proposal."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /fsvp/importers"
              payload: { legal_name: "Northbrook Foods Import LLC", dnb_number: "123456789", unique_facility_identifier: "UFI-NB-0001" }
              as: ComplianceOfficer
