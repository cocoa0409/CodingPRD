              as: Supervisor
              as_user_id: "sup-1"
            - call: "POST /chw/resource-orgs"
              payload: { name: "Northside Pantry", org_type: "FOOD", service_zips: ["60614"], contact_email: "ops@northside.example" }
              as: ProgramAdmin
              captures: { org_a: $.data.id }
            - call: "POST /chw/resource-orgs"
              payload: { name: "Southside Pantry", org_type: "FOOD", service_zips: ["60614"], contact_email: "ops@southside.example" }
              as: ProgramAdmin
              captures: { org_b: $.data.id }
            - call: "POST /chw/offerings"
