            - "trigger[0] response data.status == ACCEPTED"
            - "GET /api/listings/${lst_id}: status == UNDER_CONTRACT"
            - "trigger[1] response data.status == REJECTED"
            - "GET /api/transactions?listing_id=${lst_id}: exactly 1 Transaction, status == OPENED, loi_id == ${loi_a}, agreed_price_usd == 2000000.00"
