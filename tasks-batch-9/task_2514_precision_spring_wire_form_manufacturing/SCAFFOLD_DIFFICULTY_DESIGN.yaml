            - "hop 2: SpringDesign.${d1_id}.release_status == PRODUCTION_RELEASED"
            - "hop 3: ToolingAsset.${tool_id}.amortization_status == AMORTIZING, amortization_basis_pieces == 500000, amort_per_piece_cents == 10"
            - "hop 3: ToolingAsset.${tool_id}.unamortized_cents == 4800000 and recovered_cents == 0 (promotion arms the ledger, it does not post to it)"
            - "hop 4: CustomerProgram.${prog_id}.quote_frozen == true and delivery_posture == ON_TRACK"
            - "GET /customer-programs/${prog_id}/tooling-amortization with piece_count 25000 returns forecast_basis_recovery_cents 250000 and actual_basis_recovery_cents 360000"
            - "CustomerProgram.${prog_id}.quoted_unit_price_cents == 24 and quoted_tooling_amort_per_piece_cents == 4 (the frozen quote is NOT retro-fitted to the tool's new per-piece 10)"

