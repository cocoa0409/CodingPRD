          rationale: "Both ladders, the per-year rates and the signed divergence are asserted with literals there."
      - name: corner_offer_ladder_rounding_order_is_pinned
        claim_type: tiered_pricing
        grounds: [calculations.offer_projected_total_fee]
        excluded_because:
          difficulty_instance: combinatorial_formula / offer_ladder_rounding_order_round_each_year_then_multiply
          rationale: "The round-each-year-then-multiply order and the partial final contract year are pinned by that instance."
      - name: corner_basis_variant_selection_and_reconciliation
        claim_type: Variant Selection
        grounds: [calculations.subscriber_basis_determination]
        excluded_because:
          difficulty_instance: dual_variant_calc / subscriber_basis_as_reported_versus_audited_variant_divergence
          rationale: "AS_REPORTED at issuance, AUDITED at true-up and the reconciliation delta are all asserted there."
      - name: corner_split_tier_keys_on_pre_credit_rate
