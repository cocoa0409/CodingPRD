              payload: { finding: "UPHELD", resolution_note: "Severe shortfall confirmed", credit_basis: "PRORATA_DAYS" }
              as: ComplaintAnalyst
              as_user_id: "an-1"

            - call: "POST /complaints"
              payload: { account_id: "${acct_id}", disputed_label_version_id: "${lv1_id}", allegation_type: "SPEED_SHORTFALL", service_observed_date: "2026-09-02T12:00:00Z", affected_days: 15, narrative: "Moderate speed allegation", measured_download_mbps: 180 }
              as: ComplaintAnalyst
              captures: { cmp2_id: $.data.id }
            - call: "POST /complaints/${cmp2_id}/triage"
              payload: { priority_note: "Moderate speed allegation" }
              as: ComplaintAnalyst
            - call: "POST /complaints/${cmp2_id}/investigate"
              payload: {}
              as: ComplaintAnalyst

            - call: "POST /complaints/${cmp2_id}/resolve"
              payload: { finding: "UPHELD", resolution_note: "Moderate shortfall confirmed", credit_basis: "PRORATA_DAYS" }
              as: ComplaintAnalyst
              as_user_id: "an-1"
            - call: "GET /complaints/${cmp1_id}/remediation-credits"
              payload: {}
              as: ComplianceOfficer
              captures: { credit1_id: "$.data[0].id" }
            - call: "GET /complaints/${cmp2_id}/remediation-credits"
              payload: {}
              as: ComplianceOfficer
              captures: { credit2_id: "$.data[0].id" }
          trigger:
            - call: "POST /remediation-credits/${credit1_id}/void"
              payload: { void_reason: "Credit applied twice by the billing feed" }
              as: ComplianceOfficer
              as_user_id: "co-3"
            - call: "POST /remediation-credits/${credit2_id}/void"
              payload: { void_reason: "Second credit reversed for the same reason" }
              as: ComplianceOfficer
              as_user_id: "co-3"
            - call: "POST /remediation-credits/${credit1_id}/void"   # already compensated -> expect ERR_CREDIT_ALREADY_VOIDED (409)
              payload: { void_reason: "Duplicate reversal attempt" }
              as: ComplianceOfficer
              as_user_id: "co-3"
          assert:
            - "before the trigger: SubscriberAccount.${acct_id}.credit_balance_cents == 1442, remediation_count == 2, audit_flag == true"
            - "after voiding credit 1: RemediationCredit.${credit1_id}.status == VOIDED, voided_at == 2026-09-01T00:00:00Z, voided_by_user_id == 'co-3', void_reason == 'Credit applied twice by the billing feed'"
            - "after voiding credit 1: SubscriberAccount.${acct_id}.credit_balance_cents == 500 and remediation_count == 1 — exactly the sum and count over the remaining ISSUED row"
            - "after voiding credit 1: SubscriberAccount.${acct_id}.audit_flag == false, recomputed rather than latched"
            - "after voiding credit 1: Complaint.${cmp1_id}.remediation_credit_cents == 0 while state stays UPHELD and resolution stays UPHELD"
            - "after voiding credit 2: SubscriberAccount.${acct_id}.credit_balance_cents == 0 and remediation_count == 0 — identical to the values at account creation, so the compensation left no drift"
            - "NOT reversed by design: ServicePlan.${plan_id}.upheld_complaint_count == 2 and label_posture == OPEN, and both complaints remain UPHELD"
            - "the repeated void returns ERR_CREDIT_ALREADY_VOIDED (409) and credit_balance_cents stays 0, so the compensation is not applied twice"

      - name: invalidate_run_restores_evidence_sample_total_invariant
        grounds:
          - state_machines.TestRun.INCLUDED_to_INVALIDATED
          - entities.ServicePlan.fields.evidence_sample_total
          - endpoints.POST_test_runs
          - calculations.plan_label_posture
        distinguishing_aspect: |
          A different conserved quantity on a different aggregate: the evidence counter
          ServicePlan.evidence_sample_total, which must always equal the sum of sample_count over
          INCLUDED runs of the plan. Here the compensation is *lossless* — invalidating the added run
          returns the counter to 6 and, because 6 still clears min_samples_required 4, no attestation is
          revoked and no label or posture side effect fires, so the undo is provably local.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z (the scaffold default 2026-08-01T00:00:00Z is repositioned first)."
            - "ServicePlan FIBER300 (advertised 300/140, intro 4999 for 6 months, post-promotional 7999, ETF 12000 PRORATED_MONTHLY, required_locales [en-US])."
            - "Five FeeLineItems: EQUIP_RENTAL 1500 ALWAYS, NETWORK_ACCESS 700 POST_PROMO_ONLY, REG_RECOVERY 3.25% ALWAYS, STATE_USF 2.11% ALWAYS, INSTALL 9900 ONE_TIME."
            - "PUBLISHED MethodologyDocument MTH-2026-A (peak [19,23), min_samples_required 4, max_run_duration_days 7) and MeasurementProbe PRB-1 (max_concurrent_windows 2)."
            - "One INCLUDED TestRun A with 6 samples, 4 of them peak-hour; ServicePlan.evidence_sample_total == 6."
            - "One CERTIFIED PEAK_HOUR_MEDIAN PerformanceAttestation: typical 240.00 / 115.00 / 42 ms, margins 0.8000 / 0.8214."
            - "One PUBLISHED, SUBSTANTIATED LabelVersion (version_seq 1, effective_from 2026-09-01, effective_until null, WCAG_AA, VERIFIED en-US translation, net intro 3766, net post-promotional 7628); ServicePlan.label_posture == OPEN."

          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: ComplianceOfficer

            - call: "POST /service-plans"
              payload: { plan_code: "FIBER300", display_name: "Fiber 300", technology: "FIBER", advertised_download_mbps: 300, advertised_upload_mbps: 140, monthly_price_cents: 7999, early_termination_fee_cents: 12000, required_locales: ["en-US"], intro_price_cents: 4999, intro_term_months: 6, data_allowance_gb: 1200, overage_rate_cents_per_gb: 1000, etf_proration_policy: "PRORATED_MONTHLY", discount_program_eligible: true }
              as: ComplianceOfficer
              as_user_id: "co-1"
              captures: { plan_id: $.data.id }

            - call: "POST /service-plans/${plan_id}/fee-line-items"
              payload: { fee_code: "EQUIP_RENTAL", description: "Equipment rental", label_category: "MONTHLY_RECURRING", basis: "FIXED", amount_cents: 1500, applies_during: "ALWAYS" }
              as: ComplianceOfficer
            - call: "POST /service-plans/${plan_id}/fee-line-items"
              payload: { fee_code: "NETWORK_ACCESS", description: "Network access surcharge", label_category: "MONTHLY_RECURRING", basis: "FIXED", amount_cents: 700, applies_during: "POST_PROMO_ONLY" }
              as: ComplianceOfficer
            - call: "POST /service-plans/${plan_id}/fee-line-items"
              payload: { fee_code: "REG_RECOVERY", description: "Regulatory cost recovery", label_category: "MONTHLY_RECURRING", basis: "PCT_OF_MONTHLY_CHARGE", rate_pct: 0.0325, applies_during: "ALWAYS", is_regulatory_recovery: true }
              as: ComplianceOfficer
            - call: "POST /service-plans/${plan_id}/fee-line-items"
              payload: { fee_code: "STATE_USF", description: "State universal service fund", label_category: "GOVERNMENT_TAX", basis: "PCT_OF_MONTHLY_CHARGE", rate_pct: 0.0211, applies_during: "ALWAYS" }
              as: ComplianceOfficer
            - call: "POST /service-plans/${plan_id}/fee-line-items"
              payload: { fee_code: "INSTALL", description: "Professional installation", label_category: "ONE_TIME", basis: "FIXED", amount_cents: 9900, applies_during: "ALWAYS" }
              as: ComplianceOfficer

            - call: "POST /methodology-documents"
              payload: { doc_code: "MTH-2026-A", version_label: "v1.0", methodology_url: "https://isp.example/methodology/v1.0", peak_hours_start_utc_hour: 19, peak_hours_end_utc_hour: 23, min_samples_required: 4, max_run_duration_days: 7 }
              as: NetworkEngineer
              captures: { doc_id: $.data.id }
            - call: "POST /methodology-documents/${doc_id}/publish"
              payload: {}
              as: ComplianceOfficer

            - call: "POST /measurement-probes"
              payload: { probe_code: "PRB-1", market_code: "US-TX-AUS", panel_size: 75, max_concurrent_windows: 2 }
              as: NetworkEngineer
              captures: { probe_id: $.data.id }

            - call: "POST /test-runs"
              payload: { probe_id: "${probe_id}", plan_id: "${plan_id}", methodology_doc_id: "${doc_id}", window_start: "2026-08-03T00:00:00Z", window_end: "2026-08-09T23:00:00Z", samples: [ {observed_at: "2026-08-03T19:10:00Z", download_mbps: 210, upload_mbps: 100, latency_ms: 42}, {observed_at: "2026-08-04T21:30:00Z", download_mbps: 238, upload_mbps: 112, latency_ms: 24}, {observed_at: "2026-08-05T20:40:00Z", download_mbps: 242, upload_mbps: 118, latency_ms: 22}, {observed_at: "2026-08-08T19:45:00Z", download_mbps: 290, upload_mbps: 130, latency_ms: 18}, {observed_at: "2026-08-05T14:30:00Z", download_mbps: 295, upload_mbps: 145, latency_ms: 14}, {observed_at: "2026-08-06T02:40:00Z", download_mbps: 306, upload_mbps: 155, latency_ms: 55} ] }
              as: NetworkEngineer
              captures: { run_a_id: $.data.id }

            - call: "GET /service-plans/${plan_id}"
              payload: {}
              as: NetworkEngineer
              captures: { plan_v1: $.data.version }
            - call: "POST /performance-attestations"
              payload: { plan_id: "${plan_id}", methodology_doc_id: "${doc_id}", metric_variant: "PEAK_HOUR_MEDIAN", expected_plan_version: "${plan_v1}" }
              as: NetworkEngineer
              captures: { att_id: $.data.id }

            - call: "POST /performance-attestations/${att_id}/certify"
              payload: {}
              as: ComplianceOfficer

            - call: "GET /service-plans/${plan_id}"
              payload: {}
              as: ComplianceOfficer
              captures: { plan_v2: $.data.version }
            - call: "POST /label-versions"
              payload: { plan_id: "${plan_id}", effective_from: "2026-09-01T00:00:00Z", accessibility_conformance: "WCAG_AA", expected_plan_version: "${plan_v2}" }
              as: ComplianceOfficer
              as_user_id: "co-1"
              captures: { lv1_id: $.data.id }
            - call: "POST /label-versions/${lv1_id}/translations"
              payload: { locale: "en-US", translated_summary: "Fiber 300 broadband consumer label", machine_translated: false }
              as: LocalizationSpecialist
              as_user_id: "loc-1"
              captures: { tr_en_id: $.data.id }
            - call: "POST /label-versions/${lv1_id}/translations/${tr_en_id}/verify"
              payload: {}
              as: LocalizationSpecialist
              as_user_id: "loc-2"

            - call: "POST /label-versions/${lv1_id}/publish"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "co-2"

          trigger:
            - call: "POST /test-runs"
              payload: { probe_id: "${probe_id}", plan_id: "${plan_id}", methodology_doc_id: "${doc_id}", window_start: "2026-08-11T00:00:00Z", window_end: "2026-08-12T00:00:00Z", samples: [ {observed_at: "2026-08-11T19:30:00Z", download_mbps: 244, upload_mbps: 116, latency_ms: 26}, {observed_at: "2026-08-11T21:15:00Z", download_mbps: 236, upload_mbps: 114, latency_ms: 28} ]}
              as: NetworkEngineer
              captures: { run_b_id: $.data.id }
            - call: "POST /test-runs/${run_b_id}/invalidate"
              payload: { reason: "Panel misconfiguration on the supplementary window" }
              as: NetworkEngineer
          assert:
            - "before the trigger: ServicePlan.${plan_id}.evidence_sample_total == 6"
            - "after the run B insertion: TestRun.${run_b_id}.sample_count == 2 and ServicePlan.${plan_id}.evidence_sample_total == 8"
            - "after the invalidation: TestRun.${run_b_id}.status == INVALIDATED and ServicePlan.${plan_id}.evidence_sample_total == 6, identical to its value before run B existed"
            - "the invariant holds exactly: 6 == sum of sample_count over TestRun rows of the plan with status == INCLUDED (only run A)"
            - "no collateral cascade: PerformanceAttestation.${att_id}.status == CERTIFIED and revoked_reason == null, because methodology_snapshot.min_samples_required 4 <= 6"
            - "no collateral cascade: LabelVersion.${lv1_id}.substantiation_status == SUBSTANTIATED, publication_state == PUBLISHED, attestation_id == ${att_id}"
            - "no collateral cascade: ServicePlan.${plan_id}.label_posture == OPEN"
            - "the pinned attestation keeps pooled_sample_count == 4 throughout: run B never entered an existing attestation's pool, so nothing had to be recomputed to restore it"

