      - name: occ_settlement_finalize_stale_rejected
        claim_type: stale_version_occ
        grounds: ["concurrency_rules[settlement-finalize-stale-version]", "errors[ERR_STALE_VERSION]"]
        distinguishing_aspect: "After a finalize/dispute/revise loop advanced the statement to version 4, finalizing with the version captured at generate (1) is rejected 412 — all other gates (state PROVISIONAL, period closed, no open audits) pass."
        test_recipe:
          setup: ["ACTIVE agreement; 10 scans @200; statement generated (v1), finalized (v2), disputed (v3), revised back to PROVISIONAL (v4); clock past period end"]
          setup_api_calls:
