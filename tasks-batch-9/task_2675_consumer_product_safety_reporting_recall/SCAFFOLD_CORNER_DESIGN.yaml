      - name: modal_hazard_tie_break_resolves_to_the_earliest_created_incident
        claim_type: Correct Result
        grounds:
          - calculations.hazard_pattern_risk_index.formula
          - calculations.hazard_pattern_risk_index.constants
        distinguishing_aspect: |
          A deliberate 2-2 tie between LACERATION and BURN, arranged so that the
          codes' first appearances INTERLEAVE (LACERATION, BURN, LACERATION, BURN in
          created_at order). The tie-break is the earliest created_at, so LACERATION
          wins; a dict-iteration or alphabetical fallback picks BURN. The tie also
          drops concentration_ratio to exactly 0.5000, below MIN_CONCENTRATION 0.6,
          so the same fixture proves a merely-large cluster is not confirmable.
        test_recipe:
          setup:
            - "logical clock at 2026-03-01T00:00:00Z"
            - "one ProductModel with units_distributed 100 and four classified verified FIRST_AID incidents alternating LACERATION and BURN in creation order"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /product-safety/product-models"
              payload: { model_code: "TOAST-TIE", brand: "Hearthline", category: "KITCHEN_APPLIANCE", units_distributed: 100, units_registered: 50 }
              as: ProgramAdmin
              captures: { pm_id: $.data.id, pm_v1: $.data.version }
            - call: "POST /product-safety/incidents"
              payload: { product_model_id: "${pm_id}", report_channel: "CONSUMER_HOTLINE", incident_date: "2026-01-05T00:00:00Z", narrative: "Cut on the housing seam." }
              as: IntakeSpecialist
              captures: { t1_id: $.data.id }
            - call: "POST /product-safety/incidents/${t1_id}/classify"
              payload: { injury_class: "FIRST_AID", hazard_code: "LACERATION", injury_verified: true }
              as: IntakeSpecialist
            - call: "POST /product-safety/incidents"
              payload: { product_model_id: "${pm_id}", report_channel: "CONSUMER_HOTLINE", incident_date: "2026-01-06T00:00:00Z", narrative: "Minor burn on the lever." }
              as: IntakeSpecialist
              captures: { t2_id: $.data.id }
            - call: "POST /product-safety/incidents/${t2_id}/classify"
              payload: { injury_class: "FIRST_AID", hazard_code: "BURN", injury_verified: true }
              as: IntakeSpecialist
            - call: "POST /product-safety/incidents"
              payload: { product_model_id: "${pm_id}", report_channel: "CONSUMER_HOTLINE", incident_date: "2026-01-07T00:00:00Z", narrative: "Second seam cut." }
              as: IntakeSpecialist
              captures: { t3_id: $.data.id }
            - call: "POST /product-safety/incidents/${t3_id}/classify"
              payload: { injury_class: "FIRST_AID", hazard_code: "LACERATION", injury_verified: true }
              as: IntakeSpecialist
            - call: "POST /product-safety/incidents"
              payload: { product_model_id: "${pm_id}", report_channel: "CONSUMER_HOTLINE", incident_date: "2026-01-08T00:00:00Z", narrative: "Second lever burn." }
              as: IntakeSpecialist
              captures: { t4_id: $.data.id }
            - call: "POST /product-safety/incidents/${t4_id}/classify"
              payload: { injury_class: "FIRST_AID", hazard_code: "BURN", injury_verified: true }
              as: IntakeSpecialist
          trigger:
            - call: "POST /product-safety/hazard-patterns"
              payload: { product_model_id: "${pm_id}", window_start: "2026-01-01T00:00:00Z", window_end: "2026-02-28T00:00:00Z", analysis_basis: "PRELIMINARY", expected_product_model_version: "${pm_v1}" }
              as: ComplianceOfficer
              captures: { hp_id: $.data.id }
            - call: "POST /product-safety/hazard-patterns/${hp_id}/adjudicate"
              payload: { decision: "CONFIRMED" }
              as: ComplianceOfficer
          assert:
            - "HazardPattern.${hp_id}.incident_count == 4 and severity_sum == 12.00"
            - "HazardPattern.${hp_id}.dominant_hazard_code == LACERATION, NOT BURN — the 2-2 tie breaks on the earliest created_at, which is ${t1_id}"
            - "HazardPattern.${hp_id}.concentration_ratio == 0.5000"
            - "HazardPattern.${hp_id}.risk_index == 12.00 (density 12.00 x (0.5 + 0.5000))"
            - "HazardPattern.${hp_id}.pattern_confirmed == false: MIN_INCIDENT_COUNT and MIN_RISK_INDEX are both satisfied, only MIN_CONCENTRATION 0.6 fails"
            - "the adjudicate call therefore returns 422 ERR_PATTERN_NOT_CONFIRMABLE and the pattern stays ANALYZED"

      - name: consent_agreement_tier_edges_pinned_at_all_four_boundaries
        claim_type: Constants Applied
        grounds:
          - calculations.consent_agreement_total.constants
          - calculations.consent_agreement_total.precision
          - endpoints["POST /product-safety/civil-penalty-cases/{id}/offers"]
        distinguishing_aspect: |
          Both tier edges are probed from both sides on ONE case by walking the
          standing offer through 4999999 / 5000000 / 12000000 / 12000001 and reading
          the preview after each: TIER_1 -> TIER_2 at the FLOOR (inclusive lower
          bound) and TIER_2 -> TIER_3 above the CEILING (inclusive upper bound).
          Off-by-one comparisons (`<=` for the floor or `<` for the ceiling) each
          break exactly one of the four readings. The first offer also pins the
          single rounding point: 4999999 x 0.10 = 499999.9 -> 500000.
        test_recipe:
          setup:
            - "logical clock at 2026-03-01T00:00:00Z; a model with three verified MEDICAL_TREATMENT hotline incidents (severity_sum 24.00, risk_index 36.00, confirmable) so the worst escalated injury is MEDICAL_TREATMENT and severity_mult is BASE_SEVERITY_MULT 1.00"
            - "the section report is submitted at exactly report_due_at, so days_late == 0 and lateness_mult == 1.00"
            - "violation_count 13 therefore gives assessed_penalty_cents == 13000000, comfortably under STATUTORY_CAP_CENTS and above TIER_2_CEILING_CENTS"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /product-safety/product-models"
              payload: { model_code: "TOAST-TIER", brand: "Hearthline", category: "KITCHEN_APPLIANCE", units_distributed: 100, units_registered: 60 }
              as: ProgramAdmin
              captures: { pm_id: $.data.id, pm_v1: $.data.version }
            - call: "POST /product-safety/incidents"
              payload: { product_model_id: "${pm_id}", report_channel: "CONSUMER_HOTLINE", incident_date: "2026-01-12T00:00:00Z", narrative: "Clinic-treated burn." }
              as: IntakeSpecialist
              captures: { i1_id: $.data.id }
            - call: "POST /product-safety/incidents/${i1_id}/classify"
              payload: { injury_class: "MEDICAL_TREATMENT", hazard_code: "BURN", injury_verified: true }
              as: IntakeSpecialist
            - call: "POST /product-safety/incidents"
              payload: { product_model_id: "${pm_id}", report_channel: "CONSUMER_HOTLINE", incident_date: "2026-01-20T00:00:00Z", narrative: "Second clinic-treated burn." }
              as: IntakeSpecialist
              captures: { i2_id: $.data.id }
            - call: "POST /product-safety/incidents/${i2_id}/classify"
              payload: { injury_class: "MEDICAL_TREATMENT", hazard_code: "BURN", injury_verified: true }
              as: IntakeSpecialist
            - call: "POST /product-safety/incidents"
              payload: { product_model_id: "${pm_id}", report_channel: "CONSUMER_HOTLINE", incident_date: "2026-02-02T00:00:00Z", narrative: "Third clinic-treated burn." }
              as: IntakeSpecialist
              captures: { i3_id: $.data.id }
            - call: "POST /product-safety/incidents/${i3_id}/classify"
              payload: { injury_class: "MEDICAL_TREATMENT", hazard_code: "BURN", injury_verified: true }
              as: IntakeSpecialist
            - call: "POST /product-safety/hazard-patterns"
              payload: { product_model_id: "${pm_id}", window_start: "2026-01-01T00:00:00Z", window_end: "2026-02-28T00:00:00Z", analysis_basis: "PRELIMINARY", expected_product_model_version: "${pm_v1}" }
              as: ComplianceOfficer
              captures: { hp_id: $.data.id, hp_risk: $.data.risk_index }
            - call: "POST /product-safety/hazard-patterns/${hp_id}/adjudicate"
              payload: { decision: "CONFIRMED" }
