            - call: "POST /water-service/properties"
              payload: { account_id: "${acct_id}", address_line: "46 Minutes", jurisdiction_code: "JUR_ALPHA", distance_miles: 10.0, household_size: 3 }
              as: PlatformAdmin
              captures: { prop_id: $.data.id }
            - call: "POST /water-service/well-profiles"
              payload: { property_id: "${prop_id}", jurisdiction_code: "JUR_ALPHA", well_type: "DRILLED", depth_feet: 200.0 }
              as: PlatformAdmin
              captures: { well_a: $.data.id }
            - call: "POST /water-service/well-profiles"
              payload: { property_id: "${prop_id}", jurisdiction_code: "JUR_ALPHA", well_type: "DRILLED", depth_feet: 200.0 }
              as: PlatformAdmin
              captures: { well_b: $.data.id }
            - call: "POST /water-service/technicians"
              payload: { full_name: "Minutes Tech", tier: "MASTER", home_jurisdiction_code: "JUR_ALPHA", status: "AVAILABLE" }
              as: PlatformAdmin
              captures: { tech_id: $.data.id }
            - call: "POST /water-service/emergency-tickets"
