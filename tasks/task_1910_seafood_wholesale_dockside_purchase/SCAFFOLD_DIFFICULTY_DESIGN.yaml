            - { call: "POST /market-quotes", payload: { species_id: "${sp1_id}", grade: "GRADE_B", quote_date: "2026-08-01", price_per_kg_cents: 950 }, as: OperationsManager, captures: { q1b_id: $.data.id } }
            - { call: "POST /market-quotes/${q1b_id}/publish", payload: { expected_species_version: "${sp1_v2}" }, as: OperationsManager }
