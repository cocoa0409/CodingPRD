              as: ReliabilityEngineer
              captures: { z449: $.data.iso_zone }
            - call: "POST /shop/vibration-readings"
              payload: { customer_asset_id: "${asset_id}", reading_at: "2026-08-02T06:10:00Z", overall_velocity_mm_s: 2.80, bpfo_amplitude_g: 0.20, bpfi_amplitude_g: 0.20, baseline_amplitude_g: 0.20 }
