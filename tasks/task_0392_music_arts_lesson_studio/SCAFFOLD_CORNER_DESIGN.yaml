            - "data.error_id == ERR_INSUFFICIENT_FUNDS"

  # ===========================================================================
  - section: rbac
    instances:
      - name: parentguardian_cannot_create_instructor
        claim_type: exclusive_operation_denied
        grounds: [roles, endpoints]
        distinguishing_aspect: "ParentGuardian calling POST instructors (StudioAdmin exclusive) -> ERR_INSUFFICIENT_PERMISSIONS (403)."
        test_recipe:
          setup: ["Studio + a family (acting parent)"]
          setup_api_calls:
            - call: "POST /studios"
              payload: { name: "S" }
              as: StudioAdmin
              captures: { sid: $.data.id }
            - call: "POST /studios/${sid}/families"
              payload: { household_name: "Uu" }
              as: StudioAdmin
              captures: { fid: $.data.id }
          trigger:
            - call: "POST /studios/${sid}/instructors"
              payload: { full_name: "P", instruments: ["PIANO"], weekly_availability: [{ weekday: 0, start_min: 0, end_min: 1440 }], hourly_rate_cents: 6000 }
              as: ParentGuardian
              as_user_id: "${fid}"
              captures: { err: $.data.error_id }
          assert:
            - "response status == 403"
            - "data.error_id == ERR_INSUFFICIENT_PERMISSIONS"

      - name: instructor_cannot_finalize_invoice
