      - name: save_play_activate_from_succeeded_returns_invalid_state_transition
        claim_type: invalid_transitions
        grounds:
          - state_machines.SavePlay.ACTIVE_to_SUCCEEDED
          - validations[priority=12]
          - errors.ERR_INVALID_STATE_TRANSITION
        distinguishing_aspect: "SUCCEEDED is terminal for SavePlay, so a second ACTIVATE from SUCCEEDED returns ERR_INVALID_STATE_TRANSITION (409) and open_save_play_count stays 0."
        test_recipe:
          setup:
            - "One ACTIVE HIGH_TOUCH Csm with capacity_units_total 40."
            - "One ENTERPRISE Account with no signals, so health_tier is RED and ACTIVATE is permitted."
