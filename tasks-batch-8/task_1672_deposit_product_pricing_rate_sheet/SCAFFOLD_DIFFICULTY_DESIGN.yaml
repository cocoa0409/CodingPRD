      - name: migration_cascade_bubble_up
        grounds:
          - state_machines.MigrationBatch.PLANNED_to_COMPLETED
          - state_machines.DepositAccount.GRANDFATHERED_to_SHEET
        distinguishing_aspect: |
          Depth-2 chain from a different trigger (POST /migration-batches/{id}/execution EXECUTE):
          execution migrates each GRANDFATHERED account to the target sheet (link 1, with adverse
          notices); the last migration drains the source sheet, which auto-transitions SUPERSEDED ->
          RETIRED (link 2, bubble-up) — a different propagation pattern than activation.
        test_recipe:
          setup:
            - "P-CDM (CD, term 12, WHOLE_BALANCE, cap 900): S-OLD EFFECTIVE in US-WEST with tiers [0,500000)@300, [500000,5000000)@375, [5000000,unbounded)@430, effective 2026-08-15"
