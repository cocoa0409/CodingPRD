  - rule_id: non_linear_state_machine
    instances:
      - name: service_call_closed_reopened_closed_cycle
        grounds:
          - state_machines.ServiceCall.CLOSED_to_REOPENED
          - state_machines.ServiceCall.REOPENED_to_CLOSED
          - state_machines.RepeatFailureCase.UNDER_REVIEW_to_CONFIRMED_COMEBACK
