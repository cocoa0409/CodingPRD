scenario: |
  Government hotline work order system: call registration with caller information, call-content
  recording (audio + structured fields), category and sub-category tagging, urgency and difficulty
  rating, anonymous-call handling, and duplicate-call detection; intelligent classification and
  dispatch with rule-based and AI-assisted classification, responsible-department mapping,
  multi-department joint-handling identification, geographic-jurisdiction routing,
  dispatch-acceptance and rejection workflow, and reassignment handling; multi-department
  co-handling with lead-department designation, supporting-department coordination,
  opinion-aggregation rules, inter-department escalation, and disagreement-resolution workflow;
  processing time-limit monitoring with statutory and committed time-limit by category,
  time-limit pause for clarification-period, warning thresholds and escalation, overtime
  accountability, and time-limit performance reporting; satisfaction follow-up with follow-up
  call dispatch, multi-channel survey (call/SMS/IM), satisfaction scoring, dissatisfaction
  reopening workflow, and follow-up record archiving; supervision and reminder with
  supervision-task generation for high-priority cases, periodic reminder for pending cases,
  escalation to supervisor on inaction, supervision-record archiving, and accountability
  handling; statistics and assessment with multi-dimension statistics
  (department/category/period/satisfaction), department-level performance assessment,
  individual-handler assessment, public-disclosure reporting, and trend analysis; event-driven
  synchronization with IM, government-affairs, and inter-department data-sharing platforms;
  audit logging for dispatch and processing actions.

domain_name: govt-hotline
api_prefix: /work-orders

complexity_profile:
  primary_archetype: workflow_orchestration
  secondary_archetype: multi_party_negotiation
  complexity_layers:
    - cascading_side_effects
    - dual_variant_calculation
    - scheduled_deferred_actions
    - rate_threshold_triggers
  entity_topology: hybrid
  state_machine_shape: branching
  relationship_patterns:
    - one_to_many
    - many_to_many
    - cross_aggregate
  role_model: peer_roles
  consistency_model: immediate

# =============================================================================
# §1.0 Response Envelope (FIXED — emitted verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Department
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: Department display name.
        constraints: "Non-empty, length 1..120."
      - name: code
        type: string
        source: input
        description: Stable kebab-case department code, unique.
        constraints: "Matches ^[a-z][a-z0-9-]{1,39}$; unique across departments."
      - name: jurisdiction_codes
        type: array
        source: input
        description: List of jurisdiction (district) codes this department serves.
        constraints: "Each element matches ^J[0-9]{4}$; may be empty for citywide departments; deduplicated."
      - name: category_codes
        type: array
        source: input
        description: Category codes this department is mapped as responsible for.
        constraints: "Each element matches an existing CategoryRule.category_code; deduplicated."
      - name: status
        type: enum
        source: input
        description: Whether the department can be assigned work.
        default: ACTIVE
        constraints: "Enum {ACTIVE, SUSPENDED}."
      - name: pending_work_count
        type: integer
        source: computed
        description: Denormalized count of WorkOrders currently assigned to this department in any non-terminal processing state.
        default: 0
        constraints: ">= 0; maintained by transitions on WorkOrder and DepartmentAssignment."

  - name: Handler
    parent: null
    common_fields: true
    fields:
      - name: full_name
        type: string
        source: input
        description: Handler display name.
        constraints: "Non-empty, length 1..80."
      - name: department_id
        type: string
        source: input
        description: Department this handler belongs to.
        constraints: "Must reference an existing Department with status=ACTIVE at creation time."
      - name: status
        type: enum
        source: input
        description: Whether the handler can pick up new work.
        default: ACTIVE
        constraints: "Enum {ACTIVE, ON_LEAVE, DISABLED}."
      - name: open_assignment_count
        type: integer
        source: computed
        description: Number of DepartmentAssignment rows where this handler is assigned and not in a terminal stage state.
        default: 0
        constraints: ">= 0."

  - name: CategoryRule
    parent: null
    common_fields: true
    fields:
      - name: category_code
        type: string
        source: input
        description: Top-level category code (e.g., ROAD, NOISE).
        constraints: "Matches ^[A-Z][A-Z0-9_]{1,29}$."
      - name: sub_category_code
        type: string
        source: input
        description: Sub-category code, scoped under category_code; (category_code, sub_category_code) is unique.
        constraints: "Matches ^[A-Z][A-Z0-9_]{1,29}$."
      - name: lead_department_code
        type: string
        source: input
        description: Default lead department code mapped for this (category, sub-category).
        constraints: "Must reference an existing Department.code with status=ACTIVE at creation time."
      - name: supporting_department_codes
        type: array
        source: input
        description: Default supporting department codes for joint handling under this category.
        constraints: "Each element references an existing Department.code; must not include lead_department_code; deduplicated."
      - name: statutory_time_limit_hours
        type: integer
        source: input
        description: Statutory time-limit for cases under this category, in business hours.
        constraints: "Integer in [1, 1440]; must be >= committed_time_limit_hours."
      - name: committed_time_limit_hours
        type: integer
        source: input
        description: Committed (SLA) time-limit, in business hours; tighter than statutory.
        constraints: "Integer in [1, 1440]; must be <= statutory_time_limit_hours."
      - name: difficulty_base
        type: integer
        source: input
        description: Baseline difficulty score contributed by this category.
        default: 1
        constraints: "Integer in [1, 5]."

  - name: WorkOrder
    parent: null
    common_fields: true
    fields:
      - name: caller_name
        type: string
        source: input
        description: Reported caller name; required unless anonymous=true.
        constraints: "Length 1..80 when present; MUST be omitted/null when anonymous=true."
      - name: caller_phone
        type: string
        source: input
        description: Reported caller phone; required unless anonymous=true.
        constraints: "Matches ^[0-9+\\-]{6,20}$ when present; MUST be omitted/null when anonymous=true."
      - name: anonymous
        type: boolean
        source: input
        description: Whether the caller chose to remain anonymous.
        default: false
      - name: jurisdiction_code
        type: string
        source: input
        description: Reported geographic jurisdiction code.
        constraints: "Matches ^J[0-9]{4}$."
      - name: category_code
        type: string
        source: input
        description: Top-level category tag.
        constraints: "Must reference an existing (category_code, sub_category_code) pair in CategoryRule together with sub_category_code."
      - name: sub_category_code
        type: string
        source: input
        description: Sub-category tag.
        constraints: "Must form an existing pair with category_code in CategoryRule."
      - name: content_text
        type: string
        source: input
        description: Structured textual summary of the call content.
        constraints: "Length 1..4000."
      - name: audio_url
        type: string
        source: input
        description: Storage URL for the recorded call audio; optional for system-initiated entries.
        constraints: "Length 0..500; either http(s) URL or empty string."
      - name: urgency
        type: enum
        source: input
        description: Caller-reported urgency.
        default: NORMAL
        constraints: "Enum {LOW, NORMAL, HIGH, CRITICAL}."
      - name: difficulty_score
        type: integer
        source: computed
        description: Composite difficulty score (see calculations.work_order_difficulty_score).
        constraints: "Integer in [1, 10]; recomputed on registration and on category change."
      - name: classification_mode
        type: enum
        source: computed
        description: Whether classification was resolved by rule or AI.
        default: PENDING
        constraints: "Enum {PENDING, RULE_BASED, AI_ASSISTED}."
      - name: lead_department_id
        type: string
        source: computed
        description: Department.id designated as lead; null until DISPATCHED.
        constraints: "Resolved from CategoryRule.lead_department_code at classification."
      - name: supporting_department_ids
        type: array
        source: computed
        description: Department.id values participating as supporting departments; empty for single-department cases.
        default: []
      - name: joint_handling
        type: boolean
        source: computed
        description: True when supporting_department_ids is non-empty.
        default: false
      - name: status
        type: enum
        source: computed
        description: WorkOrder lifecycle state.
        default: REGISTERED
        constraints: "Enum {REGISTERED, CLASSIFIED, DISPATCHED, IN_PROGRESS, RESOLVED, FOLLOWED_UP, CLOSED, REOPENED, REJECTED}."
      - name: duplicate_of_id
        type: string
        source: computed
        description: WorkOrder.id this case was merged into when duplicate-call detection triggered; null otherwise.
        default: null
      - name: statutory_deadline_at
        type: datetime
        source: computed
        description: Absolute statutory deadline; computed at CLASSIFIED.
      - name: committed_deadline_at
        type: datetime
        source: computed
        description: Absolute committed deadline; computed at CLASSIFIED.
      - name: pause_accumulated_seconds
        type: integer
        source: computed
        description: Accumulated paused seconds across all clarification periods.
        default: 0
        constraints: ">= 0."
      - name: pause_started_at
        type: datetime
        source: computed
        description: When the current clarification pause began; null when not paused.
        default: null
      - name: warning_state
        type: enum
        source: computed
        description: Latest time-limit warning state.
        default: NONE
        constraints: "Enum {NONE, YELLOW, RED, BREACHED}."
      - name: resolution_summary
        type: string
        source: input
        description: Final resolution narrative written by the lead department.
        constraints: "Length 1..4000; required to leave IN_PROGRESS for RESOLVED."
      - name: registered_at
        type: datetime
        source: system
        description: Server-stamped registration time; equals created_at.
      - name: closed_at
        type: datetime
        source: computed
        description: When the case reached CLOSED; null otherwise.
        default: null
      - name: priority_flag
        type: boolean
        source: computed
        description: True iff urgency >= HIGH OR difficulty_score >= 7 at the moment of evaluation.
        default: false

  - name: DepartmentAssignment
    parent: WorkOrder
    common_fields: true
    fields:
      - name: work_order_id
        type: string
        source: input
        description: Parent WorkOrder.
        constraints: "Must reference an existing WorkOrder."
      - name: department_id
        type: string
        source: input
        description: Department assigned this slice of work.
        constraints: "Must reference an existing Department with status=ACTIVE."
      - name: role
        type: enum
        source: input
        description: Whether this department leads or supports.
        constraints: "Enum {LEAD, SUPPORTING}."
      - name: handler_id
        type: string
        source: computed
        description: Handler within the department who accepted the assignment; null before acceptance.
        default: null
      - name: stage_status
        type: enum
        source: computed
        description: Assignment lifecycle.
        default: DISPATCHED
        constraints: "Enum {DISPATCHED, ACCEPTED, REJECTED, REASSIGNED, OPINION_SUBMITTED, ESCALATED}."
      - name: rejection_reason
        type: string
        source: input
        description: Required when stage_status transitions to REJECTED.
        default: null
        constraints: "Length 1..500 when present."
      - name: opinion_text
        type: string
        source: input
        description: Opinion submitted by this department for aggregation.
        default: null
        constraints: "Length 1..2000 when present."
      - name: opinion_decision
        type: enum
        source: input
        description: This department's resolution decision contribution.
        default: null
        constraints: "Enum {AGREE, DISAGREE, ABSTAIN} when present."
      - name: dispatched_at
        type: datetime
        source: system
        description: When this assignment was created.
      - name: accepted_at
        type: datetime
        source: computed
        description: When stage_status reached ACCEPTED.
        default: null
      - name: opinion_submitted_at
        type: datetime
        source: computed
        description: When opinion was submitted.
        default: null

  - name: ClarificationPause
    parent: WorkOrder
    common_fields: false
    fields:
      - name: work_order_id
        type: string
        source: input
        description: Parent WorkOrder.
        constraints: "Must reference an existing WorkOrder."
      - name: reason
        type: string
        source: input
        description: Why the clock is being paused.
        constraints: "Length 1..500."
      - name: paused_at
        type: datetime
        source: system
        description: Pause start timestamp.
      - name: resumed_at
        type: datetime
        source: computed
        description: Resume timestamp; null while pause is active.
        default: null
      - name: duration_seconds
        type: integer
        source: computed
        description: resumed_at - paused_at in whole seconds; null while pause is active.
        default: null
        constraints: ">= 0 once resolved."

  - name: SatisfactionSurvey
    parent: WorkOrder
    common_fields: true
    fields:
      - name: work_order_id
        type: string
        source: input
        description: Parent WorkOrder.
        constraints: "Must reference an existing WorkOrder with status=RESOLVED at survey dispatch."
      - name: channel
        type: enum
        source: input
        description: Channel used to contact the caller.
        constraints: "Enum {CALL, SMS, IM}; CALL/SMS forbidden when WorkOrder.anonymous=true."
      - name: status
        type: enum
        source: computed
        description: Survey lifecycle.
        default: DISPATCHED
        constraints: "Enum {DISPATCHED, RESPONDED, EXPIRED}."
      - name: score
        type: integer
        source: input
        description: Caller score 1..5 (1 = very dissatisfied, 5 = very satisfied).
        default: null
        constraints: "Integer in [1, 5]; required to move to RESPONDED."
      - name: comment
        type: string
        source: input
        description: Optional free-text comment.
        default: null
        constraints: "Length 0..2000."
      - name: dispatched_at
        type: datetime
        source: system
        description: When the survey was dispatched.
      - name: responded_at
        type: datetime
        source: computed
        description: When the survey reached RESPONDED.
        default: null

  - name: SupervisionTask
    parent: WorkOrder
    common_fields: true
    fields:
      - name: work_order_id
        type: string
        source: input
        description: WorkOrder under supervision.
        constraints: "Must reference an existing WorkOrder."
      - name: reason
        type: enum
        source: computed
        description: Why the task was created.
        constraints: "Enum {HIGH_PRIORITY_AUTO, INACTIVITY_REMINDER, DEADLINE_WARNING, MANUAL}."
      - name: status
        type: enum
        source: computed
        description: Task lifecycle.
        default: OPEN
        constraints: "Enum {OPEN, ACKNOWLEDGED, ESCALATED, CLOSED}."
      - name: escalation_level
        type: integer
        source: computed
        description: How many times this supervision task has been escalated.
        default: 0
        constraints: "Integer in [0, 3]."
      - name: last_reminder_at
        type: datetime
        source: computed
        description: Timestamp of the most recent reminder dispatched for this task.
        default: null

  - name: AuditLog
    parent: null
    common_fields: false
    fields:
      - name: work_order_id
        type: string
        source: system
        description: Subject WorkOrder, if applicable.
        default: null
      - name: action
        type: string
        source: system
        description: Action label (e.g., DISPATCH, ACCEPT, REJECT, REASSIGN, ESCALATE, RESOLVE, CLOSE, REOPEN, SURVEY_RESPOND).
        constraints: "Enum {REGISTER, CLASSIFY, DISPATCH, ACCEPT, REJECT, REASSIGN, OPINION_SUBMIT, ESCALATE, PAUSE, RESUME, RESOLVE, SURVEY_DISPATCH, SURVEY_RESPOND, REOPEN, CLOSE, SUPERVISION_CREATE, SUPERVISION_ACK, EVENT_SYNC}."
      - name: actor_role
        type: string
        source: system
        description: Role that performed the action.
      - name: actor_id
        type: string
        source: system
        description: ID from X-User-ID header (entity-backed or opaque).
      - name: payload
        type: object
        source: system
        description: Structured snapshot of inputs and resulting state diff.
      - name: occurred_at
        type: datetime
        source: system
        description: Server timestamp when the action was committed.

  - name: SyncEvent
    parent: null
    common_fields: false
    fields:
      - name: work_order_id
        type: string
        source: system
        description: WorkOrder this event concerns.
      - name: event_type
        type: string
        source: system
        description: Event name (DISPATCHED, RESOLVED, CLOSED, REOPENED, ESCALATED).
        constraints: "Enum {DISPATCHED, RESOLVED, CLOSED, REOPENED, ESCALATED}."
      - name: target_platform
        type: enum
        source: system
        description: Downstream platform to receive the event.
        constraints: "Enum {IM, GOVT_AFFAIRS, INTER_DEPT}."
      - name: payload
        type: object
        source: system
        description: Snapshot of fields the target platform cares about.
      - name: delivery_status
        type: enum
        source: computed
        description: Synchronization delivery state.
        default: PENDING
        constraints: "Enum {PENDING, DELIVERED, FAILED}."
      - name: emitted_at
        type: datetime
        source: system
        description: When the event was emitted.

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: WorkOrder
    initial_state: REGISTERED
    terminal_states: [CLOSED, REJECTED]
    transitions:
      - from: REGISTERED
        to: REGISTERED
        trigger: "POST /work-orders (duplicate detected within DUPLICATE_DETECTION_WINDOW_SECONDS=600 with same caller_phone and category_code)"
        actor: HotlineOperator
        preconditions:
          - "Existing non-terminal WorkOrder W' with same caller_phone (or hashed equivalent when anonymous=false) AND same category_code AND registered_at within last 600 seconds."
        side_effects:
          - "New WorkOrder is created in state REGISTERED with duplicate_of_id = W'.id and content_text appended to W'.content_text via system note."
          - "AuditLog REGISTER row written for the new WorkOrder including duplicate_of_id."
          - "calculations.work_order_difficulty_score evaluated for the new WorkOrder."
        note: "Duplicate calls are persisted (for audit) but immediately linked; they do not start an independent processing flow. They remain in REGISTERED and cannot be classified independently."

      - from: REGISTERED
        to: CLASSIFIED
        trigger: "POST /work-orders/{id}/classify"
        actor: ClassifierBot
        preconditions:
          - "WorkOrder.duplicate_of_id IS NULL."
          - "(category_code, sub_category_code) resolves to an existing CategoryRule."
          - "WorkOrder.lead_department_id is null."
        side_effects:
          - "classification_mode := RULE_BASED if input.mode='RULE_BASED' and an exact CategoryRule match exists; otherwise AI_ASSISTED."
          - "lead_department_id := Department.id of CategoryRule.lead_department_code, RESOLVED-OR-OVERRIDDEN by jurisdiction_code: if no Department with that lead code lists WorkOrder.jurisdiction_code AND has a citywide peer, the citywide department is used; if the mapped lead does not serve the jurisdiction and no citywide fallback exists, ERR_JURISDICTION_NO_DEPARTMENT."
          - "supporting_department_ids := Department.id of each CategoryRule.supporting_department_codes."
          - "joint_handling := (len(supporting_department_ids) > 0)."
          - "statutory_deadline_at := registered_at + statutory_time_limit_hours business-hours (BUSINESS_HOURS_PER_DAY=8, BUSINESS_DAYS=Mon..Fri)."
          - "committed_deadline_at := registered_at + committed_time_limit_hours business-hours."
          - "calculations.work_order_difficulty_score recomputed; priority_flag recomputed."
          - "AuditLog CLASSIFY row written."

      - from: CLASSIFIED
        to: DISPATCHED
        trigger: "POST /work-orders/{id}/dispatch"
        actor: Dispatcher
        preconditions:
          - "WorkOrder.lead_department_id IS NOT NULL."
          - "Department with id=lead_department_id has status=ACTIVE."
          - "Every supporting Department referenced has status=ACTIVE."
        side_effects:
          - "Create DepartmentAssignment(role=LEAD, department_id=lead_department_id, stage_status=DISPATCHED)."
          - "Create DepartmentAssignment(role=SUPPORTING, …) for every supporting department; stage_status=DISPATCHED."
          - "Department.pending_work_count += 1 for lead and every supporting department."
          - "Emit SyncEvent(event_type=DISPATCHED) to each of {IM, GOVT_AFFAIRS, INTER_DEPT}."
          - "If priority_flag=true, create SupervisionTask(reason=HIGH_PRIORITY_AUTO, status=OPEN, escalation_level=0)."
          - "AuditLog DISPATCH row written."

      - from: DISPATCHED
        to: IN_PROGRESS
        trigger: "POST /work-orders/{id}/assignments/{assignment_id}/accept (lead assignment)"
        actor: DepartmentHandler
        preconditions:
          - "Target DepartmentAssignment.role=LEAD AND stage_status=DISPATCHED."
          - "Acting Handler.department_id == DepartmentAssignment.department_id AND Handler.status=ACTIVE."
        side_effects:
          - "DepartmentAssignment.stage_status := ACCEPTED, handler_id := acting handler, accepted_at := now()."
          - "Handler.open_assignment_count += 1."
          - "WorkOrder.status := IN_PROGRESS."
          - "AuditLog ACCEPT row written."
        note: "Supporting assignments may move DISPATCHED→ACCEPTED independently without changing WorkOrder.status."

      - from: IN_PROGRESS
        to: IN_PROGRESS
        trigger: "POST /work-orders/{id}/pause"
        actor: DepartmentHandler
        preconditions:
          - "WorkOrder.pause_started_at IS NULL (not already paused)."
          - "Acting handler is the LEAD assignment's handler_id."
        side_effects:
          - "Create ClarificationPause(work_order_id, reason, paused_at=now())."
          - "WorkOrder.pause_started_at := now()."
          - "AuditLog PAUSE row written."

      - from: IN_PROGRESS
        to: IN_PROGRESS
        trigger: "POST /work-orders/{id}/resume"
        actor: DepartmentHandler
        preconditions:
          - "WorkOrder.pause_started_at IS NOT NULL."
          - "Acting handler is the LEAD assignment's handler_id."
        side_effects:
          - "Latest ClarificationPause for this WorkOrder: resumed_at := now(), duration_seconds := (resumed_at - paused_at)."
          - "WorkOrder.pause_accumulated_seconds += duration_seconds (invariant: this equals SUM(ClarificationPause.duration_seconds WHERE work_order_id) — see calculations.pause_invariant)."
          - "statutory_deadline_at += duration_seconds; committed_deadline_at += duration_seconds."
          - "WorkOrder.pause_started_at := NULL."
          - "AuditLog RESUME row written."

      - from: IN_PROGRESS
        to: RESOLVED
        trigger: "POST /work-orders/{id}/resolve"
        actor: DepartmentHandler
        preconditions:
          - "Acting handler is the LEAD assignment's handler_id."
          - "WorkOrder.pause_started_at IS NULL (must resume before resolving)."
          - "resolution_summary length in [1, 4000]."
          - "When joint_handling=true: every SUPPORTING assignment has stage_status=OPINION_SUBMITTED AND opinion_decision IS NOT NULL."
          - "Aggregated decision per calculations.opinion_aggregation_decision != DISAGREE_BLOCKING (else ERR_DISAGREEMENT_UNRESOLVED)."
        side_effects:
          - "WorkOrder.status := RESOLVED, resolution_summary written, warning_state recomputed via calculations.warning_state."
          - "For lead and every supporting Department: pending_work_count -= 1."
          - "For lead Handler: open_assignment_count -= 1."
          - "Auto-dispatch SatisfactionSurvey: channel=CALL when anonymous=false AND caller_phone present; otherwise channel=IM when an IM contact handle is on file via input; otherwise no survey is created (RESOLVED still reached; calculations.satisfaction_index treats missing surveys as see calculation)."
          - "Emit SyncEvent(event_type=RESOLVED) to {IM, GOVT_AFFAIRS, INTER_DEPT}."
          - "AuditLog RESOLVE row written."

      - from: RESOLVED
        to: FOLLOWED_UP
        trigger: "POST /surveys/{id}/respond"
        actor: SurveyAgent
        preconditions:
          - "SatisfactionSurvey.status=DISPATCHED."
          - "score in [1, 5]."
        side_effects:
          - "SatisfactionSurvey.status := RESPONDED, score set, responded_at := now()."
          - "WorkOrder.status := FOLLOWED_UP."
          - "AuditLog SURVEY_RESPOND row written."

      - from: FOLLOWED_UP
        to: REOPENED
        trigger: "POST /work-orders/{id}/reopen"
        actor: HotlineOperator
        preconditions:
          - "Latest SatisfactionSurvey.status=RESPONDED AND score <= 2 (dissatisfaction threshold)."
          - "Reopen requested within REOPEN_WINDOW_HOURS=72 of SatisfactionSurvey.responded_at."
        side_effects:
          - "WorkOrder.status := REOPENED."
          - "Existing LEAD DepartmentAssignment.stage_status := DISPATCHED, handler_id := null, accepted_at := null (re-dispatch to the same lead department)."
          - "Department.pending_work_count of the lead department += 1."
          - "Emit SyncEvent(event_type=REOPENED) to {IM, GOVT_AFFAIRS, INTER_DEPT}."
          - "AuditLog REOPEN row written."

      - from: REOPENED
        to: IN_PROGRESS
        trigger: "POST /work-orders/{id}/assignments/{assignment_id}/accept"
        actor: DepartmentHandler
        preconditions:
          - "Target DepartmentAssignment.role=LEAD AND stage_status=DISPATCHED."
        side_effects:
          - "Same as DISPATCHED→IN_PROGRESS accept side-effects."
          - "AuditLog ACCEPT row written."

      - from: FOLLOWED_UP
        to: CLOSED
        trigger: "POST /work-orders/{id}/close"
        actor: Dispatcher
        preconditions:
          - "Latest SatisfactionSurvey is RESPONDED with score >= 3, OR latest SatisfactionSurvey is EXPIRED, OR no SatisfactionSurvey was created (RESOLVED reached without survey)."
          - "No open SupervisionTask with status IN {OPEN, ESCALATED}."
        side_effects:
          - "WorkOrder.status := CLOSED, closed_at := now()."
          - "Emit SyncEvent(event_type=CLOSED) to {IM, GOVT_AFFAIRS, INTER_DEPT}."
          - "AuditLog CLOSE row written."

      - from: RESOLVED
        to: CLOSED
        trigger: "POST /work-orders/{id}/close (no survey path)"
        actor: Dispatcher
        preconditions:
          - "No SatisfactionSurvey exists for this WorkOrder (because resolve could not pick a channel)."
          - "No open SupervisionTask with status IN {OPEN, ESCALATED}."
        side_effects:
          - "WorkOrder.status := CLOSED, closed_at := now()."
          - "Emit SyncEvent(event_type=CLOSED) to {IM, GOVT_AFFAIRS, INTER_DEPT}."
          - "AuditLog CLOSE row written."

      - from: CLASSIFIED
        to: REJECTED
        trigger: "POST /work-orders/{id}/reject"
        actor: Dispatcher
        preconditions:
          - "WorkOrder.lead_department_id IS NULL OR no department matches the jurisdiction."
          - "rejection_reason provided (length 1..500)."
        side_effects:
          - "WorkOrder.status := REJECTED."
          - "AuditLog REJECT row written."

  - entity: DepartmentAssignment
    initial_state: DISPATCHED
    terminal_states: [REJECTED, OPINION_SUBMITTED, ESCALATED]
    transitions:
      - from: DISPATCHED
        to: ACCEPTED
        trigger: "POST /work-orders/{id}/assignments/{assignment_id}/accept"
        actor: DepartmentHandler
        preconditions:
          - "stage_status=DISPATCHED."
          - "Acting Handler.department_id == DepartmentAssignment.department_id."
          - "Handler.status=ACTIVE."
        side_effects:
          - "stage_status := ACCEPTED, handler_id := acting handler, accepted_at := now()."
          - "Handler.open_assignment_count += 1."
          - "If role=LEAD and WorkOrder.status IN {DISPATCHED, REOPENED}: WorkOrder.status := IN_PROGRESS (see WorkOrder state machine)."

      - from: DISPATCHED
        to: REJECTED
        trigger: "POST /work-orders/{id}/assignments/{assignment_id}/reject"
        actor: DepartmentHandler
        preconditions:
          - "stage_status=DISPATCHED."
          - "rejection_reason provided (length 1..500)."
        side_effects:
          - "stage_status := REJECTED, rejection_reason recorded."
          - "Department.pending_work_count -= 1 for this department."
          - "If role=LEAD: WorkOrder requires reassignment — see DepartmentAssignment.DISPATCHED→REASSIGNED via /reassign."
          - "AuditLog REJECT row written."

      - from: DISPATCHED
        to: REASSIGNED
        trigger: "POST /work-orders/{id}/assignments/{assignment_id}/reassign"
        actor: Dispatcher
        preconditions:
          - "stage_status=DISPATCHED OR (stage_status=REJECTED AND role=LEAD)."
          - "Input target_department_id references a Department with status=ACTIVE."
          - "If role=LEAD: target department serves WorkOrder.jurisdiction_code OR is citywide for that category."
        side_effects:
          - "Original DepartmentAssignment.stage_status := REASSIGNED."
          - "Department.pending_work_count -= 1 for the original department (only if it was not already decremented by REJECTED)."
          - "Create new DepartmentAssignment(role=same, department_id=target, stage_status=DISPATCHED, dispatched_at=now())."
          - "Department.pending_work_count += 1 for the new department."
          - "If role=LEAD: WorkOrder.lead_department_id := target_department_id."
          - "AuditLog REASSIGN row written."

      - from: ACCEPTED
        to: OPINION_SUBMITTED
        trigger: "POST /work-orders/{id}/assignments/{assignment_id}/opinion"
        actor: DepartmentHandler
        preconditions:
          - "role=SUPPORTING."
          - "stage_status=ACCEPTED."
          - "opinion_text length in [1, 2000], opinion_decision in {AGREE, DISAGREE, ABSTAIN}."
        side_effects:
          - "stage_status := OPINION_SUBMITTED, opinion_submitted_at := now()."
          - "Department.pending_work_count -= 1."
          - "Handler.open_assignment_count -= 1."
          - "calculations.opinion_aggregation_decision recomputed on the parent WorkOrder."
          - "AuditLog OPINION_SUBMIT row written."

      - from: ACCEPTED
        to: ESCALATED
        trigger: "POST /work-orders/{id}/assignments/{assignment_id}/escalate"
        actor: DepartmentHandler
        preconditions:
          - "stage_status=ACCEPTED."
          - "Either (a) calculations.opinion_aggregation_decision = DISAGREE_BLOCKING for parent WorkOrder, OR (b) acting handler signals deadlock with another department on the same WorkOrder."
        side_effects:
          - "stage_status := ESCALATED."
          - "Existing parent SupervisionTask (if any) with status=OPEN: escalation_level += 1; otherwise create SupervisionTask(reason=MANUAL, status=ESCALATED, escalation_level=1)."
          - "Emit SyncEvent(event_type=ESCALATED) to {IM, GOVT_AFFAIRS, INTER_DEPT}."
          - "AuditLog ESCALATE row written."

  - entity: SatisfactionSurvey
    initial_state: DISPATCHED
    terminal_states: [RESPONDED, EXPIRED]
    transitions:
      - from: DISPATCHED
        to: RESPONDED
        trigger: "POST /surveys/{id}/respond"
        actor: SurveyAgent
        preconditions:
          - "status=DISPATCHED."
          - "score in [1, 5]."
          - "now() <= dispatched_at + SURVEY_EXPIRY_HOURS=48 business hours."
        side_effects:
          - "status := RESPONDED, score and comment written, responded_at := now()."
          - "Parent WorkOrder.status := FOLLOWED_UP."
          - "AuditLog SURVEY_RESPOND row written."

      - from: DISPATCHED
        to: EXPIRED
        trigger: "POST /_sweep/run (clock past dispatched_at + SURVEY_EXPIRY_HOURS=48 business hours)"
        actor: system
        preconditions:
          - "status=DISPATCHED."
          - "now() > dispatched_at + 48 business hours."
        side_effects:
          - "status := EXPIRED."

  - entity: SupervisionTask
    initial_state: OPEN
    terminal_states: [CLOSED]
    transitions:
      - from: OPEN
        to: ACKNOWLEDGED
        trigger: "POST /supervision/{id}/ack"
        actor: Supervisor
        preconditions:
          - "status=OPEN."
        side_effects:
          - "status := ACKNOWLEDGED, last_reminder_at := now()."

      - from: OPEN
        to: ESCALATED
        trigger: "POST /_sweep/run (inactivity beyond REMINDER_INTERVAL_HOURS=24 with no AuditLog ACCEPT/RESOLVE/OPINION_SUBMIT activity)"
        actor: system
        preconditions:
          - "status=OPEN."
          - "now() - max(created_at, last_reminder_at, latest WorkOrder activity timestamp) >= 24 business hours."
          - "escalation_level < 3."
        side_effects:
          - "status := ESCALATED, escalation_level += 1, last_reminder_at := now()."

      - from: ACKNOWLEDGED
        to: ESCALATED
        trigger: "POST /_sweep/run (still no progress 24 business hours after acknowledgement)"
        actor: system
        preconditions:
          - "status=ACKNOWLEDGED."
          - "now() - last_reminder_at >= 24 business hours."
          - "escalation_level < 3."
        side_effects:
          - "status := ESCALATED, escalation_level += 1, last_reminder_at := now()."

      - from: ESCALATED
        to: CLOSED
        trigger: "POST /supervision/{id}/close"
        actor: Supervisor
        preconditions:
          - "status IN {OPEN, ACKNOWLEDGED, ESCALATED}."
          - "Parent WorkOrder.status IN {RESOLVED, FOLLOWED_UP, CLOSED}."
        side_effects:
          - "status := CLOSED."

      - from: OPEN
        to: CLOSED
        trigger: "POST /supervision/{id}/close (parent already resolved)"
        actor: Supervisor
        preconditions:
          - "status=OPEN."
          - "Parent WorkOrder.status IN {RESOLVED, FOLLOWED_UP, CLOSED}."
        side_effects:
          - "status := CLOSED."

      - from: ACKNOWLEDGED
        to: CLOSED
        trigger: "POST /supervision/{id}/close (parent already resolved)"
        actor: Supervisor
        preconditions:
          - "status=ACKNOWLEDGED."
          - "Parent WorkOrder.status IN {RESOLVED, FOLLOWED_UP, CLOSED}."
        side_effects:
          - "status := CLOSED."

# =============================================================================
# §1.2.1 Concurrency Rules
# =============================================================================
concurrency_rules:
  - scenario: "Two handlers within the same department race to accept the same DepartmentAssignment."
    guarantee: "At most one handler accepts; the second receives ERR_ASSIGNMENT_NOT_PENDING."
    error_id: ERR_ASSIGNMENT_NOT_PENDING
    http_status: 409
    serialization: "First-writer-wins on DepartmentAssignment.stage_status moving from DISPATCHED."

  - scenario: "Dispatcher reassigns a LEAD assignment while a handler in the original department is concurrently accepting it."
    guarantee: "Exactly one operation wins; loser is rejected."
    error_id: ERR_ASSIGNMENT_NOT_PENDING
    http_status: 409
    serialization: "First-writer-wins on DepartmentAssignment.stage_status."

  - scenario: "Two clarification pauses are started simultaneously on the same WorkOrder."
    guarantee: "Only one ClarificationPause is open at a time; the second start request is rejected."
    error_id: ERR_ALREADY_PAUSED
    http_status: 409
    serialization: "First-writer-wins on WorkOrder.pause_started_at transitioning from NULL."

  - scenario: "Reopen and close are issued simultaneously on the same FOLLOWED_UP WorkOrder."
    guarantee: "Exactly one operation wins."
    error_id: ERR_INVALID_STATE
    http_status: 409
    serialization: "First-writer-wins on WorkOrder.status."

  - scenario: "Two operators register calls with the same caller_phone and category_code within the duplicate-detection window."
    guarantee: "Both rows persist; the second is forcibly linked as duplicate_of_id of the first."
    error_id: ERR_DUPLICATE_LINKED
    http_status: 409
    serialization: "First-writer-wins on WorkOrder.id; second row is created in REGISTERED with duplicate_of_id set and returns 409 with the linked WorkOrder id in the error message."

  - scenario: "Two SatisfactionSurvey responses arrive concurrently for the same survey."
    guarantee: "At most one RESPONDED transition wins."
    error_id: ERR_SURVEY_NOT_PENDING
    http_status: 409
    serialization: "First-writer-wins on SatisfactionSurvey.status."

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: work_order_difficulty_score
    trigger: "WorkOrder.REGISTERED creation and WorkOrder.REGISTERED→CLASSIFIED transition."
    algorithm: weighted_scoring
    formula: |
      # Inputs:
      #   urgency: enum, mapped urgency_weight = {LOW:0, NORMAL:1, HIGH:3, CRITICAL:5}
      #   category_difficulty = CategoryRule.difficulty_base for the matched (category, sub-category) (default 1 if unmatched)
      #   joint_factor = 2 if joint_handling=true else 0 (evaluated AFTER classification side-effects set joint_handling)
      # Step 1: raw = urgency_weight + category_difficulty + joint_factor
      # Step 2: clamped = clamp(raw, 1, 10)
      # Step 3: round_half_up to nearest integer (raw is already integer-valued; rounding is a no-op but the step is pinned for symmetry)
      difficulty_score = max(1, min(10, urgency_weight + category_difficulty + joint_factor))
    input_set: "Current WorkOrder row only; joint_factor read from WorkOrder.joint_handling AFTER classification side-effects."
    constants:
      URGENCY_WEIGHT_LOW: 0
      URGENCY_WEIGHT_NORMAL: 1
      URGENCY_WEIGHT_HIGH: 3
      URGENCY_WEIGHT_CRITICAL: 5
      JOINT_FACTOR: 2
      MIN_DIFFICULTY: 1
      MAX_DIFFICULTY: 10
    precision: "Integer (round_half_up at step 3)."
    variants:
      - name: registration_variant
        when: "Evaluated at WorkOrder creation, BEFORE classification, so joint_handling defaults to false → joint_factor = 0."
        difference: "Score reflects pre-classification difficulty only; supporting departments are unknown so the joint component is zero."
      - name: post_classification_variant
        when: "Evaluated immediately after CLASSIFIED transition with joint_handling now reflecting CategoryRule.supporting_department_codes."
        difference: "Score increases by JOINT_FACTOR=2 for any case where CategoryRule has ≥1 supporting departments; can produce a strictly larger difficulty_score for identical caller-reported inputs."

  - name: time_limit_deadline
    trigger: "WorkOrder.REGISTERED→CLASSIFIED transition, and on every IN_PROGRESS→IN_PROGRESS resume."
    algorithm: tiered_pricing
    formula: |
      # Business hours definition:
      #   BUSINESS_DAYS = {Mon..Fri}, BUSINESS_HOURS_PER_DAY = 8 (09:00..17:00 UTC, no overnight)
      # add_business_hours(base, H) walks H hours forward, skipping non-business intervals.
      # Step 1: At CLASSIFIED:
      #   statutory_deadline_at := add_business_hours(registered_at, CategoryRule.statutory_time_limit_hours)
      #   committed_deadline_at := add_business_hours(registered_at, CategoryRule.committed_time_limit_hours)
      # Step 2: On every RESUME with pause duration D (seconds):
      #   statutory_deadline_at := statutory_deadline_at + D
      #   committed_deadline_at := committed_deadline_at + D
      # Rounding order: business-hours addition is done FIRST in step 1 (no fractional hours admitted —
      # statutory_time_limit_hours is integer). Pause durations in step 2 are added as raw seconds, NOT
      # converted to business hours, by design — clarification pauses extend wall-clock deadlines.
    input_set: "WorkOrder.registered_at, matched CategoryRule, SUM(ClarificationPause.duration_seconds) on this WorkOrder."
    constants:
      BUSINESS_DAYS: "Mon..Fri"
      BUSINESS_HOURS_PER_DAY: 8
      BUSINESS_DAY_START_UTC: "09:00"
      BUSINESS_DAY_END_UTC: "17:00"
    precision: "Whole seconds, no rounding."
    variants:
      - name: statutory_variant
        when: "Reporting on overall legal compliance (used in performance dashboards)."
        difference: "Uses statutory_time_limit_hours; breach is the regulatory violation threshold."
      - name: committed_variant
        when: "Reporting on the department's internal SLA promise."
        difference: "Uses committed_time_limit_hours (tighter); breach occurs sooner than statutory_variant for identical inputs and can flip a case from NONE→YELLOW or YELLOW→RED at different moments."

  - name: warning_state
    trigger: "Read on GET /work-orders/{id}, and recomputed by /_sweep/run for monitoring."
    algorithm: threshold
    formula: |
      # Let remaining = committed_deadline_at - now() (seconds).
      # Let total = committed_deadline_at - registered_at (seconds, AFTER pause shifts).
      # Let pct = remaining / total when total > 0 else 0.
      # warning_state:
      #   if now() > statutory_deadline_at: BREACHED
      #   else if pct <= 0: RED            (committed deadline already passed but not yet statutory)
      #   else if pct <= 0.25 (i.e., 25% or less of committed window remains): YELLOW
      #   else: NONE
      # Boundary semantics: '<=' on the percentage thresholds. A WorkOrder with pct = exactly 0.25 is YELLOW,
      # not NONE. A WorkOrder with now() exactly equal to committed_deadline_at has pct = 0 → RED, not BREACHED
      # (BREACHED requires strict '>' past statutory_deadline_at).
    input_set: "Single WorkOrder row, plus server clock (or test clock)."
    constants:
      YELLOW_THRESHOLD_FRACTION: 0.25
      RED_THRESHOLD_FRACTION: 0.0
    precision: "Whole seconds."

  - name: opinion_aggregation_decision
    trigger: "Recomputed on DepartmentAssignment.ACCEPTED→OPINION_SUBMITTED."
    algorithm: aggregation
    formula: |
      # Inputs: all DepartmentAssignment rows on parent WorkOrder with role=SUPPORTING and stage_status=OPINION_SUBMITTED.
      # Let N = count of such rows. Let A = count with opinion_decision=AGREE, D = count with DISAGREE, X = count with ABSTAIN.
      # If WorkOrder.joint_handling=false: AGREE  (trivially — no supporting departments).
      # Else if N < count(all SUPPORTING assignments on this WorkOrder): PENDING.
      # Else (all in):
      #   if D == 0: AGREE
      #   else if D >= ceil(N/2): DISAGREE_BLOCKING       # majority dissent → escalation required
      #   else: DISAGREE_OUTVOTED                          # minority dissent; lead may proceed
      # Tie-break: when N is even and D == N/2 exactly, ceil(N/2) = N/2, so D >= ceil(N/2) holds → DISAGREE_BLOCKING wins ties.
    input_set: "Rows with WorkOrder.id = parent.id, role=SUPPORTING."
    constants:
      AGREE_LABEL: AGREE
      DISAGREE_BLOCKING_LABEL: DISAGREE_BLOCKING
      DISAGREE_OUTVOTED_LABEL: DISAGREE_OUTVOTED
      PENDING_LABEL: PENDING
    precision: "Discrete labels."

  - name: satisfaction_index
    trigger: "GET /stats/satisfaction (aggregate query) and GET /work-orders/{id}/stats."
    algorithm: aggregation
    formula: |
      # Universe: WorkOrders where status IN {FOLLOWED_UP, CLOSED, REOPENED} AND closed_at IS NULL OR within the queried period
      # (period filter optional; if omitted, all-time).
      # For each WorkOrder W, pick the LATEST SatisfactionSurvey by dispatched_at (tie-break: higher id).
      # If that survey.status = RESPONDED: contribute survey.score.
      # If that survey.status = EXPIRED OR no survey exists: contribute 3 (neutral baseline).
      # satisfaction_index = round_half_up( SUM(contributions) / count(WorkOrders in universe), 2 ).
      # Rounding order: divide first (full float precision), THEN round to 2 decimals. NOT round-per-row-then-divide.
    input_set: "WorkOrders matching the filter; their latest SatisfactionSurvey."
    constants:
      NEUTRAL_SCORE_FOR_NO_RESPONSE: 3
      ROUND_DECIMALS: 2
      ROUND_MODE: round_half_up
    precision: "2 decimal places, round_half_up."
    variants:
      - name: department_variant
        when: "Aggregated by lead_department_id (GET /stats/satisfaction?group_by=department)."
        difference: "Universe filtered to WorkOrders whose lead_department_id matches the grouping key."
      - name: handler_variant
        when: "Aggregated by lead handler_id (GET /stats/satisfaction?group_by=handler)."
        difference: "Universe filtered to WorkOrders whose LEAD DepartmentAssignment.handler_id matches; can yield different scores from department_variant on the same data because a handler may carry only a slice of their department's WorkOrders."

  - name: pause_invariant
    trigger: "Asserted (read) on GET /work-orders/{id}; maintained by PAUSE and RESUME side-effects."
    algorithm: aggregation
    formula: |
      # Invariant (must always hold for any WorkOrder W not currently paused):
      #   W.pause_accumulated_seconds == SUM(ClarificationPause.duration_seconds WHERE work_order_id = W.id AND resumed_at IS NOT NULL)
      # If W.pause_started_at IS NOT NULL (currently paused), the same equality holds excluding the open pause.
      # Compensating-action statement:
      #   For every PAUSE action with timestamp tp paired with its RESUME at tr,
      #   the global quantity Q = SUM_over_all_WorkOrders(pause_accumulated_seconds) - SUM_over_all_ClarificationPause(duration_seconds WHERE resumed_at IS NOT NULL)
      #   MUST equal 0 at every moment when no pause is open.
    input_set: "ClarificationPause rows for the WorkOrder."
    constants:
      INVARIANT_TOLERANCE_SECONDS: 0
    precision: "Whole seconds, zero tolerance."

  - name: department_pending_invariant
    trigger: "Asserted by GET /departments/{id}; maintained by DISPATCH, ACCEPT (no change), REJECT, REASSIGN, OPINION_SUBMIT, RESOLVE side-effects."
    algorithm: aggregation
    formula: |
      # Invariant:
      #   Department.pending_work_count == COUNT(DepartmentAssignment rows WHERE
      #     department_id = Department.id AND stage_status IN {DISPATCHED, ACCEPTED})
      # Compensating-action statement:
      #   For every DISPATCH action that increments pending_work_count, there exists a paired action
      #   (REJECT, REASSIGN-source, OPINION_SUBMIT, or RESOLVE for the LEAD) that decrements it by exactly 1.
      #   Q = SUM_over_all_Departments(pending_work_count) - COUNT(DepartmentAssignment WHERE stage_status IN {DISPATCHED, ACCEPTED})
      #   MUST equal 0 at every moment.
    input_set: "All DepartmentAssignment rows."
    constants:
      INVARIANT_TOLERANCE: 0
    precision: "Integer, zero tolerance."

  - name: stats_breach_rate
    trigger: "GET /stats/breach-rate."
    algorithm: threshold
    formula: |
      # Inputs:
      #   universe = WorkOrders in [period_start, period_end) with status IN {RESOLVED, FOLLOWED_UP, CLOSED, REOPENED}
      #   filter optional group_by (department, category).
      # For each W:
      #   committed_breach = 1 if W.committed_deadline_at < W.actual_resolved_at else 0
      #   statutory_breach = 1 if W.statutory_deadline_at < W.actual_resolved_at else 0
      # where W.actual_resolved_at = latest AuditLog.occurred_at where action='RESOLVE' for this W.
      # statutory_breach_rate = round_half_up( SUM(statutory_breach) / count(universe), 4 ) * 100
      # committed_breach_rate = round_half_up( SUM(committed_breach) / count(universe), 4 ) * 100
      # Rounding order: divide → multiply by 100 → round at 2 decimals (i.e., 4-decimal fraction then *100). Reversing
      # (round percentage first, then average) produces a different number; the scaffold pins the divide-first order.
    input_set: "AuditLog rows + WorkOrder rows."
    constants:
      ROUND_DECIMALS: 2
    precision: "Percentage with 2 decimal places."
    variants:
      - name: statutory_breach_variant
        when: "Public-disclosure report (legal compliance)."
        difference: "Uses statutory_deadline_at; lower numbers because statutory limits are looser than committed."
      - name: committed_breach_variant
        when: "Internal performance assessment."
        difference: "Uses committed_deadline_at; for identical input data, statutory_breach_rate <= committed_breach_rate always."

# =============================================================================
# §1.4 Validation Rules Table (Ordered by Priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role header is present and is one of the declared roles."
    error_id: ERR_AUTH_MISSING
    http_status: 401
    applies_to: all

  - priority: 2
    category: auth
    check: "X-User-ID header is present (for any role)."
    error_id: ERR_AUTH_MISSING
    http_status: 401
    applies_to: all

  - priority: 3
    category: auth
    check: "Role is permitted for this endpoint per §1.7 RBAC matrix."
    error_id: ERR_FORBIDDEN
    http_status: 403
    applies_to: all

  - priority: 4
    category: existence
    check: "Path-referenced WorkOrder/{id} exists."
    error_id: ERR_WORK_ORDER_NOT_FOUND
    http_status: 404
    applies_to: "endpoints with /work-orders/{id}"

  - priority: 5
    category: existence
    check: "Path-referenced DepartmentAssignment/{assignment_id} exists and belongs to the WorkOrder in the path."
    error_id: ERR_ASSIGNMENT_NOT_FOUND
    http_status: 404
    applies_to: "endpoints with /assignments/{assignment_id}"

  - priority: 6
    category: existence
    check: "Path-referenced Department/{id}, Handler/{id}, SatisfactionSurvey/{id}, SupervisionTask/{id}, or CategoryRule exists."
    error_id: ERR_RESOURCE_NOT_FOUND
    http_status: 404
    applies_to: "endpoints with the corresponding path segment"

  - priority: 7
    category: existence
    check: "Body-referenced foreign keys resolve: department_id, handler_id, target_department_id, category/sub_category pair."
    error_id: ERR_REFERENCE_NOT_FOUND
    http_status: 422
    applies_to: "all POST/PATCH endpoints with foreign-key inputs"

  - priority: 8
    category: state
    check: "WorkOrder is in a state permitting the requested transition (e.g., classify requires REGISTERED, resolve requires IN_PROGRESS)."
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all state-changing /work-orders/{id}/* endpoints"

  - priority: 9
    category: state
    check: "DepartmentAssignment is in a state permitting the requested transition (e.g., accept requires DISPATCHED)."
    error_id: ERR_ASSIGNMENT_NOT_PENDING
    http_status: 409
    applies_to: "endpoints under /work-orders/{id}/assignments/{assignment_id}/*"

  - priority: 10
    category: state
    check: "Resume requires WorkOrder.pause_started_at != NULL; Pause requires it to be NULL."
    error_id: ERR_NOT_PAUSED
    http_status: 409
    applies_to: "POST /work-orders/{id}/resume"

  - priority: 11
    category: state
    check: "Pause requires WorkOrder.pause_started_at IS NULL; otherwise ERR_ALREADY_PAUSED."
    error_id: ERR_ALREADY_PAUSED
    http_status: 409
    applies_to: "POST /work-orders/{id}/pause"

  - priority: 12
    category: business_safety
    check: "Anonymous=true REQUIRES caller_name and caller_phone to be omitted/null; conversely caller_phone is required when anonymous=false."
    error_id: ERR_ANONYMOUS_PII_LEAK
    http_status: 422
    applies_to: "POST /work-orders, PATCH /work-orders/{id}"

  - priority: 13
    category: business_safety
    check: "SatisfactionSurvey channel CALL or SMS forbidden when parent WorkOrder.anonymous=true."
    error_id: ERR_SURVEY_CHANNEL_FORBIDDEN
    http_status: 422
    applies_to: "POST /work-orders/{id}/surveys (manual dispatch) and auto-dispatch at resolve time"

  - priority: 14
    category: business_referential
    check: "On classify: a department mapped for the (category, sub-category) must serve the WorkOrder.jurisdiction_code (or a citywide peer must exist)."
    error_id: ERR_JURISDICTION_NO_DEPARTMENT
    http_status: 422
    applies_to: "POST /work-orders/{id}/classify"

  - priority: 15
    category: business_referential
    check: "On reassign for LEAD: target Department.jurisdiction_codes contains WorkOrder.jurisdiction_code, OR target Department.jurisdiction_codes is empty (citywide)."
    error_id: ERR_JURISDICTION_MISMATCH
    http_status: 422
    applies_to: "POST /work-orders/{id}/assignments/{assignment_id}/reassign"

  - priority: 16
    category: business_constraint
    check: "On resolve when joint_handling=true: every SUPPORTING DepartmentAssignment must be in OPINION_SUBMITTED."
    error_id: ERR_OPINIONS_INCOMPLETE
    http_status: 422
    applies_to: "POST /work-orders/{id}/resolve"

  - priority: 17
    category: business_constraint
    check: "On resolve: opinion_aggregation_decision must not be DISAGREE_BLOCKING."
    error_id: ERR_DISAGREEMENT_UNRESOLVED
    http_status: 422
    applies_to: "POST /work-orders/{id}/resolve"

  - priority: 18
    category: business_constraint
    check: "On close: there must be no SupervisionTask with status IN {OPEN, ESCALATED} for this WorkOrder."
    error_id: ERR_SUPERVISION_OPEN
    http_status: 422
    applies_to: "POST /work-orders/{id}/close"

  - priority: 19
    category: business_temporal
    check: "Reopen requested only when latest survey.score <= 2 AND within REOPEN_WINDOW_HOURS=72 business hours of survey.responded_at."
    error_id: ERR_REOPEN_WINDOW_EXPIRED
    http_status: 422
    applies_to: "POST /work-orders/{id}/reopen"

  - priority: 20
    category: business_temporal
    check: "SatisfactionSurvey response within SURVEY_EXPIRY_HOURS=48 business hours of dispatched_at."
    error_id: ERR_SURVEY_EXPIRED
    http_status: 422
    applies_to: "POST /surveys/{id}/respond"

  - priority: 21
    category: business_constraint
    check: "category_code and sub_category_code together MUST resolve to an existing CategoryRule."
    error_id: ERR_CATEGORY_UNKNOWN
    http_status: 422
    applies_to: "POST /work-orders, PATCH /work-orders/{id}"

  - priority: 22
    category: business_constraint
    check: "OCC: when version supplied in body and != current resource.version, reject."
    error_id: ERR_VERSION_CONFLICT
    http_status: 409
    applies_to: "all PATCH endpoints"

  - priority: 23
    category: business_constraint
    check: "Field shape and enum validation (urgency, channel, etc.); range checks; required-field presence."
    error_id: ERR_VALIDATION
    http_status: 422
    applies_to: "all POST/PATCH endpoints"

  - priority: 24
    category: business_constraint
    check: "Duplicate-call detection: if a WorkOrder with same caller_phone (or anonymous + same content_text hash) AND same category_code was registered within 600 seconds, the new row is linked as duplicate_of_id and the response is 409 with ERR_DUPLICATE_LINKED carrying the linked WorkOrder id."
    error_id: ERR_DUPLICATE_LINKED
    http_status: 409
    applies_to: "POST /work-orders"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # ---- Department ----
  - method: POST
    path: "/departments"
    description: "Register a department."
    roles: [PlatformAdmin]
    code: 201
    input: ["name", "code", "jurisdiction_codes", "category_codes", "status?"]
    output: Department
    side_effects: []

  - method: GET
    path: "/departments"
    description: "List departments (paginated, filterable by status, jurisdiction_code)."
    roles: [PlatformAdmin, Dispatcher, Supervisor]
    code: 200
    input: ["limit?", "offset?", "status?", "jurisdiction_code?"]
    output: Department[]
    side_effects: []

  - method: GET
    path: "/departments/{id}"
    description: "Retrieve a department (includes pending_work_count)."
    roles: [PlatformAdmin, Dispatcher, Supervisor, DepartmentHandler]
    code: 200
    input: []
    output: Department
    side_effects: []

  - method: PATCH
    path: "/departments/{id}"
    description: "Update department metadata or status."
    roles: [PlatformAdmin]
    code: 200
    input: ["name?", "jurisdiction_codes?", "category_codes?", "status?", "version?"]
    output: Department
    side_effects: []

  # ---- Handler ----
  - method: POST
    path: "/handlers"
    description: "Register a handler within a department."
    roles: [PlatformAdmin]
    code: 201
    input: ["full_name", "department_id", "status?"]
    output: Handler
    side_effects: []

  - method: GET
    path: "/handlers/{id}"
    description: "Retrieve a handler."
    roles: [PlatformAdmin, Dispatcher, Supervisor, DepartmentHandler]
    code: 200
    input: []
    output: Handler
    side_effects: []

  - method: PATCH
    path: "/handlers/{id}"
    description: "Update handler status."
    roles: [PlatformAdmin]
    code: 200
    input: ["status?", "version?"]
    output: Handler
    side_effects: []

  # ---- CategoryRule ----
  - method: POST
    path: "/category-rules"
    description: "Define a (category, sub-category) routing rule."
    roles: [PlatformAdmin]
    code: 201
    input: ["category_code", "sub_category_code", "lead_department_code", "supporting_department_codes?", "statutory_time_limit_hours", "committed_time_limit_hours", "difficulty_base?"]
    output: CategoryRule
    side_effects: []

  - method: GET
    path: "/category-rules"
    description: "List category rules."
    roles: [PlatformAdmin, Dispatcher, HotlineOperator]
    code: 200
    input: ["limit?", "offset?", "category_code?"]
    output: CategoryRule[]
    side_effects: []

  # ---- WorkOrder lifecycle ----
  - method: POST
    path: "/work-orders"
    description: "Register a call. Triggers duplicate-call detection."
    roles: [HotlineOperator]
    code: 201
    input: ["caller_name?", "caller_phone?", "anonymous?", "jurisdiction_code", "category_code", "sub_category_code", "content_text", "audio_url?", "urgency?"]
    output: WorkOrder
    side_effects:
      - "AuditLog REGISTER row written."
      - "calculations.work_order_difficulty_score evaluated (registration_variant)."
      - "Duplicate-call detection: if matched, response is 409 ERR_DUPLICATE_LINKED but the row is still persisted (duplicate_of_id set)."

  - method: GET
    path: "/work-orders"
    description: "List work orders (paginated, filterable by status, lead_department_id, jurisdiction_code, category_code, period_start, period_end)."
    roles: [PlatformAdmin, Dispatcher, Supervisor, DepartmentHandler]
    code: 200
    input: ["limit?", "offset?", "status?", "lead_department_id?", "jurisdiction_code?", "category_code?", "period_start?", "period_end?"]
    output: WorkOrder[]
    side_effects: []

  - method: GET
    path: "/work-orders/{id}"
    description: "Retrieve a work order (includes warning_state recomputed at read time, duplicate_of_id, deadlines)."
    roles: [PlatformAdmin, Dispatcher, Supervisor, DepartmentHandler, HotlineOperator]
    code: 200
    input: []
    output: WorkOrder
    side_effects: ["calculations.warning_state recomputed at read time."]

  - method: PATCH
    path: "/work-orders/{id}"
    description: "Update a REGISTERED work order's content_text, category, sub-category, urgency, or audio_url."
    roles: [HotlineOperator]
    code: 200
    input: ["content_text?", "category_code?", "sub_category_code?", "urgency?", "audio_url?", "version?"]
    output: WorkOrder
    side_effects: ["calculations.work_order_difficulty_score recomputed if category/sub-category/urgency changed."]

  - method: POST
    path: "/work-orders/{id}/classify"
    description: "Classify (rule-based or AI-assisted) and prepare for dispatch."
    roles: [Dispatcher]
    code: 200
    input: [mode]
    output: WorkOrder
    side_effects:
      - "WorkOrder.status REGISTERED → CLASSIFIED."
      - "calculations.time_limit_deadline computed."
      - "calculations.work_order_difficulty_score recomputed (post_classification_variant)."
      - "AuditLog CLASSIFY row written."

  - method: POST
    path: "/work-orders/{id}/dispatch"
    description: "Dispatch the work order to lead + supporting departments."
    roles: [Dispatcher]
    code: 200
    input: []
    output: WorkOrder
    side_effects:
      - "WorkOrder.status CLASSIFIED → DISPATCHED."
      - "DepartmentAssignment rows created (LEAD + each SUPPORTING)."
      - "Department.pending_work_count += 1 for each."
      - "SyncEvent(DISPATCHED) emitted to IM, GOVT_AFFAIRS, INTER_DEPT."
      - "If priority_flag: SupervisionTask(HIGH_PRIORITY_AUTO) created."

  - method: POST
    path: "/work-orders/{id}/reject"
    description: "Reject classification when jurisdiction or category cannot be served."
    roles: [Dispatcher]
    code: 200
    input: [rejection_reason]
    output: WorkOrder
    side_effects: ["WorkOrder.status CLASSIFIED → REJECTED."]

  - method: POST
    path: "/work-orders/{id}/pause"
    description: "Pause the time-limit clock for a clarification period."
    roles: [DepartmentHandler]
    code: 200
    input: [reason]
    output: WorkOrder
    side_effects: ["ClarificationPause row created; pause_started_at := now()."]

  - method: POST
    path: "/work-orders/{id}/resume"
    description: "Resume the time-limit clock."
    roles: [DepartmentHandler]
    code: 200
    input: []
    output: WorkOrder
    side_effects:
      - "Latest ClarificationPause closed."
      - "WorkOrder.pause_accumulated_seconds += duration_seconds."
      - "statutory_deadline_at and committed_deadline_at shifted by duration_seconds."

  - method: POST
    path: "/work-orders/{id}/resolve"
    description: "Lead department submits resolution; aggregates supporting opinions; auto-dispatches survey."
    roles: [DepartmentHandler]
    code: 200
    input: [resolution_summary]
    output: WorkOrder
    side_effects:
      - "WorkOrder.status IN_PROGRESS → RESOLVED."
      - "Department.pending_work_count decremented for lead and every supporting that has not yet decremented."
      - "Handler.open_assignment_count decremented for lead handler."
      - "Auto-dispatch SatisfactionSurvey when caller is contactable."
      - "SyncEvent(RESOLVED) emitted."

  - method: POST
    path: "/work-orders/{id}/reopen"
    description: "Reopen a FOLLOWED_UP work order when the latest survey score <= 2."
    roles: [HotlineOperator]
    code: 200
    input: []
    output: WorkOrder
    side_effects:
      - "WorkOrder.status FOLLOWED_UP → REOPENED."
      - "LEAD DepartmentAssignment re-dispatched."
      - "SyncEvent(REOPENED) emitted."

  - method: POST
    path: "/work-orders/{id}/close"
    description: "Close a work order (FOLLOWED_UP or RESOLVED-no-survey path)."
    roles: [Dispatcher]
    code: 200
    input: []
    output: WorkOrder
    side_effects:
      - "WorkOrder.status → CLOSED; closed_at := now()."
      - "SyncEvent(CLOSED) emitted."

  # ---- DepartmentAssignment ----
  - method: GET
    path: "/work-orders/{id}/assignments"
    description: "List assignments under a work order."
    roles: [PlatformAdmin, Dispatcher, Supervisor, DepartmentHandler]
    code: 200
    input: []
    output: DepartmentAssignment[]
    side_effects: []

  - method: POST
    path: "/work-orders/{id}/assignments/{assignment_id}/accept"
    description: "Handler accepts an assignment (lead acceptance also flips WorkOrder to IN_PROGRESS)."
    roles: [DepartmentHandler]
    code: 200
    input: []
    output: DepartmentAssignment
    side_effects:
      - "DepartmentAssignment.stage_status DISPATCHED → ACCEPTED."
      - "Handler.open_assignment_count += 1."
      - "If role=LEAD: WorkOrder.status → IN_PROGRESS."

  - method: POST
    path: "/work-orders/{id}/assignments/{assignment_id}/reject"
    description: "Handler rejects an assignment back to the dispatcher."
    roles: [DepartmentHandler]
    code: 200
    input: [rejection_reason]
    output: DepartmentAssignment
    side_effects:
      - "DepartmentAssignment.stage_status DISPATCHED → REJECTED."
      - "Department.pending_work_count -= 1."

  - method: POST
    path: "/work-orders/{id}/assignments/{assignment_id}/reassign"
    description: "Dispatcher reassigns an assignment to a different department."
    roles: [Dispatcher]
    code: 200
    input: [target_department_id]
    output: DepartmentAssignment
    side_effects:
      - "Original assignment.stage_status → REASSIGNED."
      - "Source Department.pending_work_count -= 1 (if not already decremented)."
      - "New DepartmentAssignment created (DISPATCHED)."
      - "Target Department.pending_work_count += 1."
      - "If role=LEAD: WorkOrder.lead_department_id := target."

  - method: POST
    path: "/work-orders/{id}/assignments/{assignment_id}/opinion"
    description: "Supporting department submits its opinion."
    roles: [DepartmentHandler]
    code: 200
    input: [opinion_text, opinion_decision]
    output: DepartmentAssignment
    side_effects:
      - "DepartmentAssignment.stage_status ACCEPTED → OPINION_SUBMITTED."
      - "Department.pending_work_count -= 1; Handler.open_assignment_count -= 1."
      - "calculations.opinion_aggregation_decision recomputed."

  - method: POST
    path: "/work-orders/{id}/assignments/{assignment_id}/escalate"
    description: "Escalate an assignment for deadlock or disagreement resolution."
    roles: [DepartmentHandler]
    code: 200
    input: []
    output: DepartmentAssignment
    side_effects:
      - "DepartmentAssignment.stage_status ACCEPTED → ESCALATED."
      - "SupervisionTask created or escalation_level incremented."
      - "SyncEvent(ESCALATED) emitted."

  # ---- SatisfactionSurvey ----
  - method: GET
    path: "/work-orders/{id}/surveys"
    description: "List satisfaction surveys for a work order."
    roles: [PlatformAdmin, Dispatcher, Supervisor, HotlineOperator]
    code: 200
    input: []
    output: SatisfactionSurvey[]
    side_effects: []

  - method: POST
    path: "/work-orders/{id}/surveys"
    description: "Manually dispatch a new survey on a RESOLVED or FOLLOWED_UP work order through a chosen channel."
    roles: [HotlineOperator]
    code: 201
    input: [channel]
    output: SatisfactionSurvey
    side_effects: ["SatisfactionSurvey created in DISPATCHED state."]

  - method: POST
    path: "/surveys/{id}/respond"
    description: "Survey agent records the caller's response."
    roles: [SurveyAgent]
    code: 200
    input: ["score", "comment?"]
    output: SatisfactionSurvey
    side_effects:
      - "SatisfactionSurvey.status DISPATCHED → RESPONDED."
      - "Parent WorkOrder.status RESOLVED → FOLLOWED_UP."

  # ---- Supervision ----
  - method: GET
    path: "/supervision"
    description: "List supervision tasks (paginated, filterable by status, reason)."
    roles: [PlatformAdmin, Supervisor, Dispatcher]
    code: 200
    input: ["limit?", "offset?", "status?", "reason?"]
    output: SupervisionTask[]
    side_effects: []

  - method: POST
    path: "/supervision/{id}/ack"
    description: "Supervisor acknowledges a supervision task."
    roles: [Supervisor]
    code: 200
    input: []
    output: SupervisionTask
    side_effects: ["SupervisionTask.status OPEN → ACKNOWLEDGED."]

  - method: POST
    path: "/supervision/{id}/close"
    description: "Close a supervision task once the underlying work order is RESOLVED or beyond."
    roles: [Supervisor]
    code: 200
    input: []
    output: SupervisionTask
    side_effects: ["SupervisionTask.status → CLOSED."]

  # ---- Stats ----
  - method: GET
    path: "/stats/satisfaction"
    description: "Aggregate satisfaction index, optionally grouped by department or handler."
    roles: [PlatformAdmin, Supervisor]
    code: 200
    input: ["group_by?", "period_start?", "period_end?", "department_id?", "handler_id?"]
    output: object
    side_effects: ["calculations.satisfaction_index evaluated."]

  - method: GET
    path: "/stats/breach-rate"
    description: "Statutory and committed breach rates over a period, optionally grouped by department or category."
    roles: [PlatformAdmin, Supervisor]
    code: 200
    input: ["group_by?", "period_start?", "period_end?", "department_id?", "category_code?"]
    output: object
    side_effects: ["calculations.stats_breach_rate evaluated."]

  - method: GET
    path: "/stats/trend"
    description: "Public-disclosure trend report: counts of REGISTERED, RESOLVED, CLOSED, REOPENED per period bucket."
    roles: [PlatformAdmin, Supervisor]
    code: 200
    input: [period_start, period_end, bucket]
    output: object
    side_effects: []

  # ---- Audit & Sync ----
  - method: GET
    path: "/audit-logs"
    description: "List audit log rows for compliance review."
    roles: [PlatformAdmin, Supervisor]
    code: 200
    input: ["limit?", "offset?", "work_order_id?", "action?"]
    output: AuditLog[]
    side_effects: []

  - method: GET
    path: "/sync-events"
    description: "List synchronization events sent to downstream platforms."
    roles: [PlatformAdmin, Supervisor]
    code: 200
    input: ["limit?", "offset?", "work_order_id?", "event_type?", "target_platform?", "delivery_status?"]
    output: SyncEvent[]
    side_effects: []

  # ---- Test harness ----
  - method: POST
    path: "/_clock/advance"
    description: "Test-only: advance the server clock by N seconds (for time-gated tests)."
    roles: [PlatformAdmin]
    code: 200
    input: [seconds]
    output: object
    side_effects: ["Server time used by /_sweep/run and warning_state advances."]

  - method: POST
    path: "/_sweep/run"
    description: "Test-only: run the periodic sweep (survey expiry, supervision inactivity escalation, warning_state recompute)."
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: object
    side_effects:
      - "SatisfactionSurvey rows past expiry move DISPATCHED → EXPIRED."
      - "SupervisionTask rows past REMINDER_INTERVAL_HOURS escalate."
      - "WorkOrder.warning_state recomputed."

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - id: ERR_AUTH_MISSING
    http: 401
    condition: "X-User-Role or X-User-ID header missing."
  - id: ERR_FORBIDDEN
    http: 403
    condition: "Role not permitted for the requested endpoint."
  - id: ERR_WORK_ORDER_NOT_FOUND
    http: 404
    condition: "WorkOrder id in path does not exist."
  - id: ERR_ASSIGNMENT_NOT_FOUND
    http: 404
    condition: "DepartmentAssignment id in path does not exist or does not belong to the WorkOrder in the path."
  - id: ERR_RESOURCE_NOT_FOUND
    http: 404
    condition: "Department, Handler, SatisfactionSurvey, SupervisionTask, or CategoryRule id does not exist."
  - id: ERR_REFERENCE_NOT_FOUND
    http: 422
    condition: "Body foreign-key reference (department_id, handler_id, target_department_id, category pair) does not resolve."
  - id: ERR_INVALID_STATE
    http: 409
    condition: "WorkOrder is not in a state permitting the requested transition."
  - id: ERR_ASSIGNMENT_NOT_PENDING
    http: 409
    condition: "DepartmentAssignment is not in the state required for the requested action (e.g., accept on a non-DISPATCHED assignment)."
  - id: ERR_ALREADY_PAUSED
    http: 409
    condition: "Pause requested while WorkOrder.pause_started_at is already set."
  - id: ERR_NOT_PAUSED
    http: 409
    condition: "Resume requested while WorkOrder.pause_started_at is NULL."
  - id: ERR_ANONYMOUS_PII_LEAK
    http: 422
    condition: "anonymous=true while caller_name/caller_phone are provided, or anonymous=false while caller_phone is missing."
  - id: ERR_SURVEY_CHANNEL_FORBIDDEN
    http: 422
    condition: "SatisfactionSurvey channel CALL or SMS attempted on an anonymous WorkOrder."
  - id: ERR_JURISDICTION_NO_DEPARTMENT
    http: 422
    condition: "No department mapped for (category, sub-category) serves WorkOrder.jurisdiction_code and no citywide fallback exists."
  - id: ERR_JURISDICTION_MISMATCH
    http: 422
    condition: "Reassign target department does not serve the WorkOrder.jurisdiction_code (and is not citywide)."
  - id: ERR_OPINIONS_INCOMPLETE
    http: 422
    condition: "Resolve attempted on a joint-handling WorkOrder before every supporting department submitted its opinion."
  - id: ERR_DISAGREEMENT_UNRESOLVED
    http: 422
    condition: "Resolve attempted while aggregated opinion is DISAGREE_BLOCKING."
  - id: ERR_SUPERVISION_OPEN
    http: 422
    condition: "Close attempted while at least one SupervisionTask on this WorkOrder is OPEN or ESCALATED."
  - id: ERR_REOPEN_WINDOW_EXPIRED
    http: 422
    condition: "Reopen requested outside the 72 business-hour window or with score > 2."
  - id: ERR_SURVEY_EXPIRED
    http: 422
    condition: "Survey response submitted past SURVEY_EXPIRY_HOURS=48 business hours."
  - id: ERR_SURVEY_NOT_PENDING
    http: 409
    condition: "Survey response attempted on a survey not in DISPATCHED state."
  - id: ERR_CATEGORY_UNKNOWN
    http: 422
    condition: "(category_code, sub_category_code) pair does not resolve to a CategoryRule."
  - id: ERR_VERSION_CONFLICT
    http: 409
    condition: "OCC: supplied version does not match current resource.version."
  - id: ERR_VALIDATION
    http: 422
    condition: "Field shape, enum, or range validation failed."
  - id: ERR_DUPLICATE_LINKED
    http: 409
    condition: "Registration matched the duplicate-call detection window; new row was persisted as duplicate_of_id of the original."

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: PlatformAdmin
    description: "Platform operator. Manages departments, handlers, category rules, and reads all data."
    identity: opaque
    exclusive_operations:
      - "POST /departments"
      - "PATCH /departments/{id}"
      - "POST /handlers"
      - "PATCH /handlers/{id}"
      - "POST /category-rules"
      - "POST /_clock/advance"
      - "POST /_sweep/run"
    shared_operations:
      - "GET /departments"
      - "GET /departments/{id}"
      - "GET /handlers/{id}"
      - "GET /category-rules"
      - "GET /work-orders"
      - "GET /work-orders/{id}"
      - "GET /work-orders/{id}/assignments"
      - "GET /work-orders/{id}/surveys"
      - "GET /supervision"
      - "GET /stats/satisfaction"
      - "GET /stats/breach-rate"
      - "GET /stats/trend"
      - "GET /audit-logs"
      - "GET /sync-events"

  - name: HotlineOperator
    description: "Front-line operator who registers calls and can manually trigger satisfaction surveys."
    identity: opaque
    exclusive_operations:
      - "POST /work-orders"
      - "PATCH /work-orders/{id}"
      - "POST /work-orders/{id}/reopen"
      - "POST /work-orders/{id}/surveys"
    shared_operations:
      - "GET /work-orders/{id}"
      - "GET /work-orders/{id}/surveys"
      - "GET /category-rules"

  - name: Dispatcher
    description: "Routes classified work orders to departments and reassigns when needed."
    identity: opaque
    exclusive_operations:
      - "POST /work-orders/{id}/classify"
      - "POST /work-orders/{id}/dispatch"
      - "POST /work-orders/{id}/reject"
      - "POST /work-orders/{id}/close"
      - "POST /work-orders/{id}/assignments/{assignment_id}/reassign"
    shared_operations:
      - "GET /departments"
      - "GET /departments/{id}"
      - "GET /handlers/{id}"
      - "GET /category-rules"
      - "GET /work-orders"
      - "GET /work-orders/{id}"
      - "GET /work-orders/{id}/assignments"
      - "GET /supervision"

  - name: DepartmentHandler
    description: "A handler within a department who accepts/rejects/escalates assignments and resolves cases."
    identity: entity_backed:Handler
    exclusive_operations:
      - "POST /work-orders/{id}/assignments/{assignment_id}/accept"
      - "POST /work-orders/{id}/assignments/{assignment_id}/reject"
      - "POST /work-orders/{id}/assignments/{assignment_id}/opinion"
      - "POST /work-orders/{id}/assignments/{assignment_id}/escalate"
      - "POST /work-orders/{id}/pause"
      - "POST /work-orders/{id}/resume"
      - "POST /work-orders/{id}/resolve"
    shared_operations:
      - "GET /work-orders/{id}"
      - "GET /work-orders/{id}/assignments"
      - "GET /departments/{id}"
      - "GET /handlers/{id}"

  - name: Supervisor
    description: "Reads cross-department statistics, acknowledges/escalates supervision tasks, and reviews audit/sync events."
    identity: opaque
    exclusive_operations:
      - "POST /supervision/{id}/ack"
      - "POST /supervision/{id}/close"
    shared_operations:
      - "GET /work-orders"
      - "GET /work-orders/{id}"
      - "GET /work-orders/{id}/assignments"
      - "GET /work-orders/{id}/surveys"
      - "GET /departments"
      - "GET /supervision"
      - "GET /stats/satisfaction"
      - "GET /stats/breach-rate"
      - "GET /stats/trend"
      - "GET /audit-logs"
      - "GET /sync-events"

  - name: SurveyAgent
    description: "Records caller responses to satisfaction surveys."
    identity: opaque
    exclusive_operations:
      - "POST /surveys/{id}/respond"
    shared_operations: []
