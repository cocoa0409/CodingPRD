scenario: "Municipal Broadband & Digital-Equity Program: service area & serviceability, subscriber & tier/subsidy, install & CPE, low-income enrollment & device distribution, outage & SLA credit, take-rate & mapping, grant (BEAD) compliance, billing"
domain_name: municipal-broadband-digital-equity
api_prefix: "/"

complexity_profile:
  primary_archetype: pricing_engine
  secondary_archetype: compliance_audit
  complexity_layers: [dual_variant_calculation, optimistic_concurrency, cascading_side_effects, rate_threshold_triggers]
  entity_topology: flat
  state_machine_shape: branching
  # non-linear machines realized across different entities:
  #   Subscription  -> parallel (service_status x billing_status)
  #   Enrollment    -> cyclic (ACTIVE <-> RECERT_DUE)
  #   InstallOrder  -> cyclic (SCHEDULED self-loop via reschedule)
  #   GrantClaim    -> branching fork/join (SUBMITTED -> {APPROVED, REJECTED})
  relationship_patterns: [one_to_many, cross_aggregate, polymorphic]
  role_model: segregation_of_duties
  consistency_model: immediate

# =============================================================================
# 1.0 Response Envelope (FIXED)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# 1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Grant
    parent: null
    common_fields: true
    fields:
      - { name: funding_source, type: enum, source: input, description: "BEAD | ARPA | LOCAL" }
      - { name: program_name, type: string, source: input, description: "Grant program label" }
      - { name: award_amount_cents, type: integer, source: input, description: "Total award ceiling in cents" }
      - { name: match_required_pct, type: number, source: input, description: "Local match percentage required (informational)" }
      - { name: take_rate_milestone_pct, type: number, source: input, description: "Verified take-rate percentage that unlocks MILESTONE_MET (>= comparison)" }
      - { name: take_rate_floor_pct, type: number, source: input, default: 0, description: "Minimum verified take-rate below which clawback applies at close" }
      - { name: committed_balance_cents, type: integer, source: computed, default: 0, description: "Funds committed to APPROVED claims not yet disbursed" }
      - { name: disbursed_balance_cents, type: integer, source: computed, default: 0, description: "Funds disbursed on APPROVED claims" }
      - { name: available_balance_cents, type: integer, source: computed, description: "= award_amount_cents - committed_balance_cents - disbursed_balance_cents" }
      - { name: status, type: enum, source: computed, default: ACTIVE, description: "ACTIVE | MILESTONE_MET | CLOSED" }

  - name: ServiceArea
    parent: null
    common_fields: true
    fields:
      - { name: grant_id, type: string, source: input, description: "FK -> Grant.id; funding source for this build area" }
      - { name: name, type: string, source: input, description: "Human name for the area" }
      - { name: census_block_group, type: string, source: input, description: "FCC census block group identifier" }
      - { name: homes_passed, type: integer, source: input, description: "Serviceable premises passed by fiber in this area (take-rate denominator)" }
      - { name: fiber_ready, type: boolean, source: input, default: false, description: "True once fiber plant is lit; required to advance to SERVICEABLE" }
      - { name: reported_take_rate_pct, type: number, source: computed, description: "Projected take-rate: subscriptions with service_status IN {PENDING_INSTALL, ACTIVE} / homes_passed * 100" }
      - { name: verified_take_rate_pct, type: number, source: computed, description: "Verified take-rate: subscriptions with service_status == ACTIVE / homes_passed * 100" }
      - { name: status, type: enum, source: computed, default: PLANNED, description: "PLANNED | CONSTRUCTION | SERVICEABLE | SUSPENDED" }

  - name: ServicePlan
    parent: null
    common_fields: true
    fields:
      - { name: tier, type: enum, source: input, description: "BASIC | STANDARD | PREMIUM" }
      - { name: name, type: string, source: input, description: "Plan display name" }
      - { name: download_mbps, type: integer, source: input, description: "Download speed" }
      - { name: upload_mbps, type: integer, source: input, description: "Upload speed" }
      - { name: monthly_price_cents, type: integer, source: input, description: "List monthly price in cents" }
      - { name: sla_uptime_pct, type: number, source: input, description: "Contracted monthly uptime percentage (e.g. 99.5)" }

  - name: SubsidyProgram
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Subsidy program label (e.g. Digital Equity Credit)" }
      - { name: monthly_discount_cents, type: integer, source: input, description: "Monthly bill discount applied to an active enrollee's invoice" }
      - { name: device_benefit_cents, type: integer, source: input, description: "One-time device benefit value for distribution" }
      - { name: eligibility_fpl_pct, type: number, source: input, description: "Federal-Poverty-Level ceiling; enrollment eligible when fpl_pct <= this value" }

  - name: Subscriber
    parent: null
    common_fields: true
    fields:
      - { name: service_area_id, type: string, source: input, description: "FK -> ServiceArea.id; premises area" }
      - { name: full_name, type: string, source: input, description: "Account holder name" }
      - { name: email, type: string, source: input, description: "Contact email" }
      - { name: service_address, type: string, source: input, description: "Premises address" }
      - { name: household_size, type: integer, source: input, description: "Persons in household (FPL denominator selector)" }
      - { name: status, type: enum, source: computed, default: ACTIVE, description: "ACTIVE (the only value; retained for lifecycle symmetry)" }

  - name: Subscription
    parent: null
    common_fields: true
    fields:
      - { name: subscriber_id, type: string, source: input, description: "FK -> Subscriber.id" }
      - { name: plan_id, type: string, source: input, description: "FK -> ServicePlan.id" }
      - { name: service_area_id, type: string, source: input, description: "FK -> ServiceArea.id; must equal subscriber's area and be SERVICEABLE" }
      - { name: monthly_price_cents, type: integer, source: computed, description: "Snapshot of ServicePlan.monthly_price_cents at creation" }
      - { name: service_status, type: enum, source: computed, default: PENDING_INSTALL, description: "Service axis: PENDING_INSTALL | ACTIVE | SUSPENDED | CANCELLED" }
      - { name: billing_status, type: enum, source: computed, default: CURRENT, description: "Billing axis (independent of service axis): CURRENT | PAST_DUE" }

  - name: Enrollment
    parent: null
    common_fields: true
    fields:
      - { name: subscriber_id, type: string, source: input, description: "FK -> Subscriber.id" }
      - { name: subsidy_program_id, type: string, source: input, description: "FK -> SubsidyProgram.id" }
      - { name: household_size, type: integer, source: input, description: "Household size claimed on application" }
      - { name: annual_income_cents, type: integer, source: input, description: "Annual household income in cents" }
      - { name: fpl_pct, type: number, source: computed, description: "annual_income_cents / FPL_BASE_CENTS[household_size] * 100, 2dp round_half_up" }
      - { name: certification_expires_at, type: datetime, source: computed, description: "Set on move to ACTIVE = clock + CERT_PERIOD_DAYS; null until then" }
      - { name: status, type: enum, source: computed, default: SUBMITTED, description: "SUBMITTED | ACTIVE | DENIED | RECERT_DUE | TERMINATED" }

  - name: Technician
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Field technician name" }
      - { name: region, type: string, source: input, description: "Coverage region" }
      - { name: job_duration_minutes, type: integer, source: input, default: 120, description: "Fixed appointment length used to compute install end time" }
      - { name: status, type: enum, source: computed, default: AVAILABLE, description: "AVAILABLE | INACTIVE" }

  - name: InstallOrder
    parent: null
    common_fields: true
    fields:
      - { name: subscription_id, type: string, source: input, description: "FK -> Subscription.id" }
      - { name: technician_id, type: string, source: input, description: "FK -> Technician.id" }
      - { name: scheduled_start_at, type: datetime, source: input, description: "Appointment start (ISO 8601)" }
      - { name: scheduled_end_at, type: datetime, source: computed, description: "= scheduled_start_at + technician.job_duration_minutes" }
      - { name: reschedule_count, type: integer, source: computed, default: 0, description: "Incremented each reschedule" }
      - { name: status, type: enum, source: computed, default: SCHEDULED, description: "SCHEDULED | COMPLETED | CANCELLED" }

  - name: Device
    parent: null
    common_fields: true
    fields:
      - { name: device_class, type: enum, source: input, description: "CPE_MODEM | TABLET | LAPTOP | HOTSPOT" }
      - { name: model, type: string, source: input, description: "Device model" }
      - { name: serial_number, type: string, source: input, description: "Unique serial" }
      - { name: value_cents, type: integer, source: input, description: "Book value in cents" }
      - { name: subscription_id, type: string, source: computed, description: "FK -> Subscription.id; set when a CPE_MODEM is assigned to a subscription; null otherwise" }
      - { name: enrollment_id, type: string, source: computed, description: "FK -> Enrollment.id; set when a distribution device is assigned to a low-income enrollment; null otherwise" }
      - { name: status, type: enum, source: computed, default: IN_STOCK, description: "IN_STOCK | ASSIGNED | DEPLOYED | RETURNED" }

  - name: OutageEvent
    parent: null
    common_fields: true
    fields:
      - { name: service_area_id, type: string, source: input, description: "FK -> ServiceArea.id" }
      - { name: started_at, type: datetime, source: input, description: "Outage start (ISO 8601)" }
      - { name: ended_at, type: datetime, source: computed, description: "Restoration time; null while OPEN, set on resolve" }
      - { name: severity, type: enum, source: input, description: "PARTIAL | FULL" }
      - { name: estimated_credit_total_cents, type: integer, source: computed, description: "Provisional SLA credit variant summed over affected ACTIVE subscriptions, computed at report time from downtime = clock_now - started_at" }
      - { name: final_credit_total_cents, type: integer, source: computed, description: "Final SLA credit variant summed at resolve from downtime = ended_at - started_at; null while OPEN" }
      - { name: affected_subscription_count, type: integer, source: computed, description: "Count of ACTIVE subscriptions in the area at report time" }
      - { name: status, type: enum, source: computed, default: OPEN, description: "OPEN | RESOLVED" }

  - name: SlaCredit
    parent: null
    common_fields: true
    fields:
      - { name: subscription_id, type: string, source: system, description: "FK -> Subscription.id; owning subscription" }
      - { name: outage_id, type: string, source: system, description: "FK -> OutageEvent.id; source outage" }
      - { name: downtime_minutes, type: integer, source: computed, description: "Final downtime = ended_at - started_at in whole minutes" }
      - { name: credit_cents, type: integer, source: computed, description: "round_half_up(subscription.monthly_price_cents * downtime_minutes / MINUTES_IN_BILLING_PERIOD)" }
      - { name: applied_invoice_id, type: string, source: computed, description: "Invoice id this credit was applied to; null until APPLIED (not a discovery FK)" }
      - { name: status, type: enum, source: computed, default: PENDING, description: "PENDING | APPLIED | REVERSED" }

  - name: Invoice
    parent: null
    common_fields: true
    fields:
      - { name: subscription_id, type: string, source: input, description: "FK -> Subscription.id" }
      - { name: period_start, type: datetime, source: input, description: "Billing period start (inclusive)" }
      - { name: period_end, type: datetime, source: input, description: "Billing period end (exclusive); must be > period_start" }
      - { name: base_amount_cents, type: integer, source: computed, description: "Snapshot of subscription.monthly_price_cents" }
      - { name: subsidy_discount_cents, type: integer, source: computed, description: "min(active subsidy monthly_discount_cents, base_amount_cents); 0 if no ACTIVE enrollment" }
      - { name: sla_credit_cents, type: integer, source: computed, default: 0, description: "Applied SLA credit, capped so total_due_cents never below 0" }
      - { name: total_due_cents, type: integer, source: computed, description: "= base_amount_cents - subsidy_discount_cents - sla_credit_cents (evaluation order pinned; see calc invoice_amount)" }
      - { name: amount_paid_cents, type: integer, source: computed, default: 0, description: "Cumulative payments recorded" }
      - { name: status, type: enum, source: computed, default: ISSUED, description: "ISSUED | PAID | VOID" }

  - name: GrantClaim
    parent: null
    common_fields: true
    fields:
      - { name: grant_id, type: string, source: input, description: "FK -> Grant.id" }
      - { name: claim_period_start, type: datetime, source: input, description: "Reimbursement period start" }
      - { name: claim_period_end, type: datetime, source: input, description: "Reimbursement period end (> start)" }
      - { name: service_area_ids, type: array, source: input, description: "ServiceArea ids covered by the claim; all must be SERVICEABLE to submit" }
      - { name: reported_take_rate_pct, type: number, source: computed, description: "Aggregate verified take-rate across covered areas at submit time" }
      - { name: subsidized_subscriber_count, type: integer, source: computed, description: "Count of ACTIVE subscriptions with an ACTIVE enrollment in covered areas" }
      - { name: amount_claimed_cents, type: integer, source: computed, description: "Sum of per-subscriber reimbursement (round each, then sum); see calc grant_claim_reimbursement" }
      - { name: submitted_by, type: string, source: computed, description: "X-User-ID of the ComplianceAnalyst who submitted; used for segregation-of-duties on approve" }
      - { name: status, type: enum, source: computed, default: DRAFT, description: "DRAFT | SUBMITTED | APPROVED | REJECTED" }

# =============================================================================
# 1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Grant
    initial_state: ACTIVE
    terminal_states: [CLOSED]
    transitions:
      - from: ACTIVE
        to: MILESTONE_MET
        trigger: "system: on GrantClaim approve when covered-area verified take-rate >= grant.take_rate_milestone_pct"
        actor: system
        preconditions: ["verified take-rate >= take_rate_milestone_pct (>= boundary)"]
        side_effects: ["Grant.status = MILESTONE_MET"]
      - from: ACTIVE
        to: CLOSED
        trigger: "system: administrative close (no more claims)"
        actor: system
        preconditions: []
        side_effects: []
      - from: MILESTONE_MET
        to: CLOSED
        trigger: "system: administrative close"
        actor: system
        preconditions: []
        side_effects: []

  - entity: ServiceArea
    initial_state: PLANNED
    terminal_states: []
    transitions:
      - from: PLANNED
        to: CONSTRUCTION
        trigger: "POST /service-areas/{id}/advance"
        actor: ProgramAdmin
        preconditions: []
        side_effects: []
      - from: CONSTRUCTION
        to: SERVICEABLE
        trigger: "POST /service-areas/{id}/advance"
        actor: ProgramAdmin
        preconditions: ["fiber_ready == true"]
        side_effects: []
      - from: SERVICEABLE
        to: SUSPENDED
        trigger: "POST /service-areas/{id}/suspend"
        actor: ProgramAdmin
        preconditions: []
        side_effects:
          - "CASCADE L1: every Subscription in this area with service_status IN {PENDING_INSTALL, ACTIVE} -> SUSPENDED"
          - "CASCADE L2: for each such Subscription, every InstallOrder with status == SCHEDULED -> CANCELLED"
          - "CASCADE L3: for each cancelled InstallOrder, its ASSIGNED CPE_MODEM Device -> IN_STOCK (unassigned)"
      - from: SUSPENDED
        to: SERVICEABLE
        trigger: "POST /service-areas/{id}/reinstate"
        actor: ProgramAdmin
        preconditions: []
        side_effects: ["Subscriptions are NOT auto-reactivated; each must be handled individually"]

  - entity: Subscription
    initial_state: PENDING_INSTALL
    terminal_states: [CANCELLED]
    transitions:
      - from: PENDING_INSTALL
        to: ACTIVE
        trigger: "POST /subscriptions/{id}/activate"
        actor: CustomerCare
        preconditions:
          - "cross-entity: an InstallOrder for this subscription has status == COMPLETED"
          - "subscription.service_area is SERVICEABLE"
        side_effects: ["Subscription counts toward verified take-rate of its area"]
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /subscriptions/{id}/suspend OR cascade from ServiceArea suspend"
        actor: CustomerCare
        preconditions: []
        side_effects: []
      - from: PENDING_INSTALL
        to: SUSPENDED
        trigger: "cascade from ServiceArea suspend"
        actor: system
        preconditions: []
        side_effects: []
      - from: PENDING_INSTALL
        to: CANCELLED
        trigger: "POST /subscriptions/{id}/cancel"
        actor: CustomerCare
        preconditions: []
        side_effects: ["Any SCHEDULED InstallOrder -> CANCELLED (compensating device unassign)", "Any ISSUED Invoice -> VOID; applied SlaCredit -> REVERSED"]
      - from: ACTIVE
        to: CANCELLED
        trigger: "POST /subscriptions/{id}/cancel"
        actor: CustomerCare
        preconditions: []
        side_effects: ["Any ISSUED Invoice -> VOID; applied SlaCredit -> REVERSED"]
      - from: SUSPENDED
        to: CANCELLED
        trigger: "POST /subscriptions/{id}/cancel"
        actor: CustomerCare
        preconditions: []
        side_effects: []
    note: "Parallel billing axis on the same row: billing_status CURRENT<->PAST_DUE evolves independently of the service axis. CURRENT->PAST_DUE (system) when a new invoice is generated while a prior ISSUED invoice has period_end < clock and amount_paid_cents < total_due_cents; PAST_DUE->CURRENT (system) when a payment clears all outstanding invoices."

  - entity: Enrollment
    initial_state: SUBMITTED
    terminal_states: [DENIED, TERMINATED]
    transitions:
      - from: SUBMITTED
        to: ACTIVE
        trigger: "POST /enrollments/{id}/verify (eligible)"
        actor: EligibilityWorker
        preconditions:
          - "fpl_pct <= subsidy_program.eligibility_fpl_pct (<= boundary)"
          - "no other ACTIVE enrollment exists for this subscriber"
        side_effects: ["certification_expires_at = clock + CERT_PERIOD_DAYS", "subscriber's subsequent invoices receive subsidy_discount"]
      - from: SUBMITTED
        to: DENIED
        trigger: "POST /enrollments/{id}/verify (ineligible)"
        actor: EligibilityWorker
        preconditions: ["fpl_pct > subsidy_program.eligibility_fpl_pct"]
        side_effects: []
      - from: ACTIVE
        to: RECERT_DUE
        trigger: "system: clock >= certification_expires_at (evaluated lazily on any read of the enrollment or on a recertify attempt)"
        actor: system
        preconditions: []
        side_effects: []
        note: "RECERT_DUE is entered lazily: once the logical clock reaches certification_expires_at, reads and recertify observe the enrollment as RECERT_DUE without a separate API call."
      - from: RECERT_DUE
        to: ACTIVE
        trigger: "POST /enrollments/{id}/recertify (still eligible)"
        actor: EligibilityWorker
        preconditions: ["recomputed fpl_pct <= subsidy_program.eligibility_fpl_pct"]
        side_effects: ["certification_expires_at = clock + CERT_PERIOD_DAYS (cyclic loop back to ACTIVE)"]
      - from: RECERT_DUE
        to: TERMINATED
        trigger: "POST /enrollments/{id}/terminate OR recertify ineligible"
        actor: EligibilityWorker
        preconditions: []
        side_effects: ["CASCADE: subscriber loses subsidy_discount on future invoices", "any DEPLOYED distribution Device tied to this enrollment -> RETURNED"]
      - from: ACTIVE
        to: TERMINATED
        trigger: "POST /enrollments/{id}/terminate"
        actor: EligibilityWorker
        preconditions: []
        side_effects: ["CASCADE: subscriber loses subsidy_discount on future invoices", "any DEPLOYED distribution Device tied to this enrollment -> RETURNED"]

  - entity: InstallOrder
    initial_state: SCHEDULED
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - from: SCHEDULED
        to: SCHEDULED
        trigger: "POST /install-orders/{id}/reschedule"
        actor: Dispatcher
        preconditions:
          - "new scheduled window does not overlap another SCHEDULED InstallOrder for the same technician (half-open [start,end), adjacency allowed)"
        side_effects: ["scheduled_start_at/scheduled_end_at updated", "reschedule_count += 1 (self-loop cycle)"]
      - from: SCHEDULED
        to: COMPLETED
        trigger: "POST /install-orders/{id}/complete"
        actor: FieldTech
        preconditions:
          - "acting FieldTech X-User-ID == technician_id"
          - "subscription.service_status == PENDING_INSTALL"
        side_effects: ["if device_id supplied: that ASSIGNED CPE_MODEM -> DEPLOYED", "enables subscription activate"]
      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /install-orders/{id}/cancel OR cascade from ServiceArea suspend"
        actor: Dispatcher
        preconditions: []
        side_effects: ["COMPENSATING: any ASSIGNED CPE_MODEM Device for this subscription -> IN_STOCK"]

  - entity: Device
    initial_state: IN_STOCK
    terminal_states: []
    transitions:
      - from: IN_STOCK
        to: ASSIGNED
        trigger: "POST /devices/{id}/assign"
        actor: Dispatcher
        preconditions: ["exactly one of subscription_id / enrollment_id supplied", "device currently IN_STOCK"]
        side_effects: ["subscription_id or enrollment_id set"]
      - from: ASSIGNED
        to: DEPLOYED
        trigger: "POST /install-orders/{id}/complete (CPE) or system on distribution delivery"
        actor: FieldTech
        preconditions: []
        side_effects: []
      - from: ASSIGNED
        to: IN_STOCK
        trigger: "POST /devices/{id}/return OR compensating cascade from InstallOrder cancel"
        actor: Dispatcher
        preconditions: []
        side_effects: ["subscription_id / enrollment_id cleared (COMPENSATING: inventory count conserved)"]
      - from: DEPLOYED
        to: RETURNED
        trigger: "POST /devices/{id}/return OR cascade from Enrollment terminate"
        actor: Dispatcher
        preconditions: []
        side_effects: []

  - entity: OutageEvent
    initial_state: OPEN
    terminal_states: [RESOLVED]
    transitions:
      - from: OPEN
        to: RESOLVED
        trigger: "POST /outages/{id}/resolve"
        actor: NocOperator
        preconditions: ["ended_at supplied and > started_at"]
        side_effects:
          - "CASCADE L1: for each ACTIVE Subscription in the area, create a SlaCredit (final variant) in PENDING"
          - "CASCADE L2: each new SlaCredit is APPLIED to the subscription's latest ISSUED Invoice -> Invoice.sla_credit_cents and total_due_cents recomputed"
          - "CASCADE L3: if a recomputed Invoice.total_due_cents <= amount_paid_cents, Invoice.status -> PAID; subscription billing_status -> CURRENT if all invoices settled"

  - entity: Invoice
    initial_state: ISSUED
    terminal_states: [PAID, VOID]
    transitions:
      - from: ISSUED
        to: PAID
        trigger: "POST /invoices/{id}/payments (cumulative paid >= total_due) OR SLA credit zeroes balance"
        actor: Billing
        preconditions: []
        side_effects: ["subscription billing_status -> CURRENT if all outstanding invoices settled"]
      - from: ISSUED
        to: VOID
        trigger: "cascade from Subscription cancel"
        actor: system
        preconditions: []
        side_effects: ["applied SlaCredit -> REVERSED"]

  - entity: Technician
    initial_state: AVAILABLE
    terminal_states: []
    transitions:
      - from: AVAILABLE
        to: INACTIVE
        trigger: "POST /technicians/{id}/deactivate"
        actor: ProgramAdmin
        preconditions: []
        side_effects: ["technician can no longer be assigned to new InstallOrders"]

  - entity: GrantClaim
    initial_state: DRAFT
    terminal_states: [APPROVED, REJECTED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /grant-claims/{id}/submit"
        actor: ComplianceAnalyst
        preconditions:
          - "cross-entity: every ServiceArea in service_area_ids has status == SERVICEABLE"
          - "fiscal: amount_claimed_cents (recomputed) <= grant.available_balance_cents"
        side_effects:
          - "submitted_by = acting X-User-ID"
          - "COMMIT: grant.committed_balance_cents += amount_claimed_cents; grant.available_balance_cents recomputed (award = available + committed + disbursed preserved)"
          - "increments Grant.version by 1"
      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /grant-claims/{id}/approve"
        actor: ComplianceOfficer
        preconditions:
          - "SoD: acting X-User-ID != submitted_by"
        side_effects:
          - "FORK-A / DISBURSE: grant.committed_balance_cents -= amount_claimed_cents; grant.disbursed_balance_cents += amount_claimed_cents; grant.available_balance_cents unchanged (money conserved)"
          - "if aggregate verified take-rate >= grant.take_rate_milestone_pct: grant.status -> MILESTONE_MET"
      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /grant-claims/{id}/reject"
        actor: ComplianceOfficer
        preconditions: ["SoD: acting X-User-ID != submitted_by"]
        side_effects:
          - "FORK-B / RELEASE (COMPENSATING): grant.committed_balance_cents -= amount_claimed_cents; grant.available_balance_cents restored (award = available + committed + disbursed preserved)"

# =============================================================================
# 1.2.1 Concurrency Rules (OCC only)
# =============================================================================
concurrency_rules:
  - rule_id: invoice-payment-stale-version
    parent_entity: Invoice
    write_endpoint: "POST /invoices/{id}/payments"
    occ_field: "expected_invoice_version"
    description: |
      Recording a payment against an Invoice whose version has advanced since
      the client last observed it is rejected. Partial payments legitimately
      supersede the running amount_paid_cents, so a payment carrying a stale
      expected_invoice_version reflects a view taken before another payment
      advanced the invoice; it is rejected on the stale-version check.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: grant-claim-create-stale-grant
    parent_entity: Grant
    write_endpoint: "POST /grants/{id}/claims"
    occ_field: "expected_grant_version"
    description: |
      Creating a GrantClaim against a Grant whose version has advanced since the
      client last observed it is rejected. Each claim serializes against the
      grant's balances, so a create carrying a stale expected_grant_version
      reflects a view taken before another claim advanced the grant; it is
      rejected on the stale-version check.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# 1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: invoice_amount
    trigger: "POST /subscriptions/{id}/invoices (invoice generation)"
    algorithm: threshold
    formula: |
      base = subscription.monthly_price_cents
      # conditional branch on enrollment state
      if subscriber has an ACTIVE Enrollment:
          discount = min(active_subsidy.monthly_discount_cents, base)
      else:
          discount = 0
      net_after_subsidy = base - discount
      # SLA credits already APPLIED for this period, capped so invoice never negative
      credit = min(sum(SlaCredit.credit_cents where applied_invoice_id == this invoice), net_after_subsidy)
      total_due_cents = net_after_subsidy - credit
      # evaluation order is pinned: subsidy first, then SLA credit on the post-subsidy net
    input_set: "Subscription (price snapshot), subscriber's ACTIVE Enrollment (0 or 1), SlaCredit rows APPLIED to this invoice"
    constants: {}
    precision: "integer cents; no rounding (all inputs are whole cents)"
    variants: []

  - name: sla_credit_amount
    trigger: "OutageEvent report (provisional) and OutageEvent resolve (final)"
    algorithm: threshold
    formula: |
      credit_cents = round_half_up(subscription.monthly_price_cents * downtime_minutes / MINUTES_IN_BILLING_PERIOD)
    input_set: "affected ACTIVE subscriptions in the outage's service area"
    constants:
      MINUTES_IN_BILLING_PERIOD: 43200
      OUTAGE_MERGE_BUFFER_MINUTES: 60
    precision: "integer cents, round_half_up"
    variants:
      - name: provisional
        when: "computed at outage report time while status == OPEN"
        difference: "downtime_minutes = (clock_now - started_at); summed into OutageEvent.estimated_credit_total_cents"
      - name: final
        when: "computed at resolve time"
        difference: "downtime_minutes = (ended_at - started_at); materialized as SlaCredit.credit_cents and summed into OutageEvent.final_credit_total_cents"

  - name: service_area_take_rate
    trigger: "read of ServiceArea; GrantClaim submit"
    algorithm: aggregation
    formula: |
      reported_take_rate_pct = round_half_up(
          count(Subscription where service_area_id == area.id and service_status IN {PENDING_INSTALL, ACTIVE})
          / area.homes_passed * 100 , 2)
      verified_take_rate_pct = round_half_up(
          count(Subscription where service_area_id == area.id and service_status == ACTIVE)
          / area.homes_passed * 100 , 2)
    input_set: "Subscriptions in the area, filtered by service_status as shown"
    constants: {}
    precision: "2 decimal places, round_half_up"
    variants:
      - name: reported
        when: "grant/mapping projection and area.reported_take_rate_pct"
        difference: "numerator includes PENDING_INSTALL and ACTIVE"
      - name: verified
        when: "milestone / claim decisions and area.verified_take_rate_pct"
        difference: "numerator includes ACTIVE only"

  - name: grant_claim_reimbursement
    trigger: "POST /grants/{id}/claims (create) and GrantClaim submit"
    algorithm: aggregation
    formula: |
      per_subscriber_cents = round_half_up(active_subsidy.monthly_discount_cents * FEDERAL_SHARE_PCT / 100)
      # ROUNDING ORDER PINNED: round each subscriber's share to whole cents, THEN sum.
      amount_claimed_cents = sum over each qualifying subscriber of per_subscriber_cents
      # (summing raw shares then rounding once would differ; that order is NOT used)
    input_set: "ACTIVE subscriptions with an ACTIVE Enrollment in covered SERVICEABLE areas"
    constants:
      FEDERAL_SHARE_PCT: 33.34
    precision: "integer cents; round each per-subscriber share half_up, then sum"
    variants: []

  - name: enrollment_fpl_pct
    trigger: "POST /enrollments/{id}/verify and recertify"
    algorithm: threshold
    formula: |
      fpl_pct = round_half_up(annual_income_cents / FPL_BASE_CENTS[household_size] * 100, 2)
      eligible = (fpl_pct <= subsidy_program.eligibility_fpl_pct)   # <= boundary, inclusive
    input_set: "single Enrollment"
    constants:
      FPL_BASE_CENTS: { 1: 1506000, 2: 2034000, 3: 2562000, 4: 3090000, 5: 3618000 }
      CERT_PERIOD_DAYS: 365
    precision: "2 decimal places, round_half_up"
    variants: []

  - name: grant_milestone_check
    trigger: "GrantClaim approve"
    algorithm: threshold
    formula: |
      aggregate_verified = round_half_up(
          sum(active_subscription_count over covered areas) / sum(homes_passed over covered areas) * 100 , 2)
      milestone_met = (aggregate_verified >= grant.take_rate_milestone_pct)   # >= boundary
    input_set: "covered ServiceAreas and their ACTIVE subscriptions"
    constants: {}
    precision: "2 decimal places, round_half_up"
    variants: []

# =============================================================================
# 1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - { priority: 1, category: auth, check: "X-User-Role and X-User-ID headers present and valid", error_id: ERR_UNAUTHENTICATED, http_status: 401, applies_to: "all" }
  - { priority: 2, category: auth, check: "acting role authorized for this operation per RBAC", error_id: ERR_UNAUTHORIZED, http_status: 403, applies_to: "all" }
  - { priority: 3, category: existence, check: "path ids and FK body ids resolve to existing resources, left-to-right", error_id: ERR_*_NOT_FOUND, http_status: 404, applies_to: "all" }
  - { priority: 4, category: state, check: "target resource is in a state permitting this transition", error_id: ERR_INVALID_STATE, http_status: 409, applies_to: "all transition endpoints" }
  - { priority: 5, category: state, check: "OCC expected_<parent>_version matches current parent.version", error_id: ERR_STALE_VERSION, http_status: 412, applies_to: "POST /invoices/{id}/payments, POST /grants/{id}/claims" }
  - { priority: 6, category: business_referential, check: "subscription create / claim submit require covered ServiceArea(s) status == SERVICEABLE", error_id: ERR_AREA_NOT_SERVICEABLE, http_status: 409, applies_to: "POST /subscriptions, POST /grant-claims/{id}/submit" }
  - { priority: 6, category: business_referential, check: "install create requires technician.status == AVAILABLE", error_id: ERR_TECHNICIAN_INACTIVE, http_status: 409, applies_to: "POST /install-orders" }
  - { priority: 6, category: business_referential, check: "subscription activate requires a COMPLETED InstallOrder for it", error_id: ERR_INSTALL_NOT_COMPLETED, http_status: 409, applies_to: "POST /subscriptions/{id}/activate" }
  - { priority: 7, category: business_safety, check: "GrantClaim approve/reject actor X-User-ID != submitted_by (segregation of duties)", error_id: ERR_SEGREGATION_OF_DUTIES, http_status: 403, applies_to: "POST /grant-claims/{id}/approve, POST /grant-claims/{id}/reject" }
  - { priority: 8, category: business_temporal, check: "install window must not overlap another SCHEDULED install for the same technician (half-open, adjacency allowed)", error_id: ERR_TECHNICIAN_DOUBLE_BOOKED, http_status: 409, applies_to: "POST /install-orders, POST /install-orders/{id}/reschedule" }
  - { priority: 8, category: business_temporal, check: "new outage must not fall within OUTAGE_MERGE_BUFFER_MINUTES of an existing OPEN outage on the same area (closed interval + buffer)", error_id: ERR_OUTAGE_OVERLAP, http_status: 409, applies_to: "POST /outages" }
  - { priority: 8, category: business_temporal, check: "billing/claim/outage period_end must be > period_start (or ended_at > started_at)", error_id: ERR_PERIOD_INVALID, http_status: 422, applies_to: "POST /subscriptions/{id}/invoices, POST /grants/{id}/claims" }
  - { priority: 8, category: business_temporal, check: "outage resolve requires ended_at supplied and > started_at", error_id: ERR_OUTAGE_NOT_ENDED, http_status: 422, applies_to: "POST /outages/{id}/resolve" }
  - { priority: 9, category: business_constraint, check: "device assign requires device.status == IN_STOCK and exactly one target id", error_id: ERR_DEVICE_NOT_AVAILABLE, http_status: 409, applies_to: "POST /devices/{id}/assign" }
  - { priority: 9, category: business_constraint, check: "enrollment verify requires no other ACTIVE enrollment for the subscriber", error_id: ERR_DUPLICATE_ACTIVE_ENROLLMENT, http_status: 409, applies_to: "POST /enrollments/{id}/verify" }
  - { priority: 9, category: business_constraint, check: "payment requires invoice.status == ISSUED", error_id: ERR_INVOICE_NOT_PAYABLE, http_status: 409, applies_to: "POST /invoices/{id}/payments" }
  - { priority: 10, category: business_fiscal, check: "GrantClaim submit commits funds and requires amount_claimed_cents <= grant.available_balance_cents", error_id: ERR_INSUFFICIENT_GRANT_FUNDS, http_status: 409, applies_to: "POST /grant-claims/{id}/submit" }

# =============================================================================
# 1.5 API Endpoint Table
# =============================================================================
endpoints:
  # ---- Grant ----
  - { method: POST, path: "/grants", description: "Create grant", roles: [ProgramAdmin], code: 201, input: [funding_source, program_name, award_amount_cents, match_required_pct, take_rate_milestone_pct, "take_rate_floor_pct?"], output: Grant, side_effects: ["available_balance_cents = award_amount_cents"] }
  - { method: GET, path: "/grants/{id}", description: "Get grant", roles: &all_roles [ProgramAdmin, ComplianceAnalyst, ComplianceOfficer, CustomerCare, EligibilityWorker, Dispatcher, FieldTech, NocOperator, Billing], code: 200, input: [], output: Grant }
  - { method: POST, path: "/grants/{id}/claims", description: "Create a grant claim (OCC on grant)", roles: [ComplianceAnalyst], code: 201, input: [claim_period_start, claim_period_end, service_area_ids, expected_grant_version], output: GrantClaim, side_effects: ["computes amount_claimed_cents (calc grant_claim_reimbursement)", "increments Grant.version by 1"] }
  - { method: GET, path: "/grants/{id}/claims", description: "List claims for a grant (reverse GrantClaim.grant_id)", roles: *all_roles, code: 200, input: ["limit?", "offset?"], output: "GrantClaim[]" }

  # ---- ServiceArea ----
  - { method: POST, path: "/service-areas", description: "Create service area", roles: [ProgramAdmin], code: 201, input: [grant_id, name, census_block_group, homes_passed, "fiber_ready?"], output: ServiceArea }
  - { method: GET, path: "/service-areas/{id}", description: "Get service area (with take-rate)", roles: *all_roles, code: 200, input: [], output: ServiceArea }
  - { method: GET, path: "/service-areas", description: "List service areas (reverse ServiceArea.grant_id)", roles: *all_roles, code: 200, input: ["grant_id?", "limit?", "offset?"], output: "ServiceArea[]" }
  - { method: POST, path: "/service-areas/{id}/advance", description: "Advance PLANNED->CONSTRUCTION->SERVICEABLE", roles: [ProgramAdmin], code: 200, input: [], output: ServiceArea }
  - { method: POST, path: "/service-areas/{id}/suspend", description: "Suspend area (cascade)", roles: [ProgramAdmin], code: 200, input: ["reason?"], output: ServiceArea, side_effects: ["cascade suspend subscriptions -> cancel installs -> unassign devices"] }
  - { method: POST, path: "/service-areas/{id}/reinstate", description: "Reinstate SUSPENDED->SERVICEABLE", roles: [ProgramAdmin], code: 200, input: [], output: ServiceArea }

  # ---- ServicePlan ----
  - { method: POST, path: "/service-plans", description: "Create plan", roles: [ProgramAdmin], code: 201, input: [tier, name, download_mbps, upload_mbps, monthly_price_cents, sla_uptime_pct], output: ServicePlan }
  - { method: GET, path: "/service-plans/{id}", description: "Get plan", roles: *all_roles, code: 200, input: [], output: ServicePlan }

  # ---- SubsidyProgram ----
  - { method: POST, path: "/subsidy-programs", description: "Create subsidy program", roles: [ProgramAdmin], code: 201, input: [name, monthly_discount_cents, device_benefit_cents, eligibility_fpl_pct], output: SubsidyProgram }
  - { method: GET, path: "/subsidy-programs/{id}", description: "Get subsidy program", roles: *all_roles, code: 200, input: [], output: SubsidyProgram }

  # ---- Subscriber ----
  - { method: POST, path: "/subscribers", description: "Create subscriber", roles: [CustomerCare], code: 201, input: [service_area_id, full_name, email, service_address, household_size], output: Subscriber }
  - { method: GET, path: "/subscribers/{id}", description: "Get subscriber", roles: *all_roles, code: 200, input: [], output: Subscriber }
  - { method: GET, path: "/subscribers", description: "List subscribers (reverse Subscriber.service_area_id)", roles: *all_roles, code: 200, input: ["service_area_id?", "limit?", "offset?"], output: "Subscriber[]" }

  # ---- Subscription ----
  - { method: POST, path: "/subscriptions", description: "Create subscription", roles: [CustomerCare], code: 201, input: [subscriber_id, plan_id, service_area_id], output: Subscription, side_effects: ["monthly_price_cents snapshot from plan"] }
  - { method: GET, path: "/subscriptions/{id}", description: "Get subscription", roles: *all_roles, code: 200, input: [], output: Subscription }
  - { method: GET, path: "/subscriptions", description: "List subscriptions (reverse subscriber_id/plan_id/service_area_id)", roles: *all_roles, code: 200, input: ["subscriber_id?", "plan_id?", "service_area_id?", "limit?", "offset?"], output: "Subscription[]" }
  - { method: POST, path: "/subscriptions/{id}/activate", description: "Activate (requires COMPLETED install)", roles: [CustomerCare], code: 200, input: [], output: Subscription }
  - { method: POST, path: "/subscriptions/{id}/suspend", description: "Suspend subscription", roles: [CustomerCare], code: 200, input: [], output: Subscription }
  - { method: POST, path: "/subscriptions/{id}/cancel", description: "Cancel (cascade void invoices, cancel installs)", roles: [CustomerCare], code: 200, input: [], output: Subscription }
  - { method: POST, path: "/subscriptions/{id}/invoices", description: "Generate an invoice for a period", roles: [Billing], code: 201, input: [period_start, period_end], output: Invoice, side_effects: ["computes base/subsidy/total (calc invoice_amount)", "may flip billing_status CURRENT->PAST_DUE"] }
  - { method: GET, path: "/subscriptions/{id}/invoices", description: "List invoices for a subscription (reverse Invoice.subscription_id)", roles: *all_roles, code: 200, input: ["limit?", "offset?"], output: "Invoice[]" }

  # ---- Invoice ----
  - { method: GET, path: "/invoices/{id}", description: "Get invoice", roles: *all_roles, code: 200, input: [], output: Invoice }
  - { method: POST, path: "/invoices/{id}/payments", description: "Record a payment (OCC on invoice)", roles: [Billing], code: 200, input: [amount_cents, expected_invoice_version], output: Invoice, side_effects: ["amount_paid_cents += amount_cents", "if paid >= total_due -> Invoice PAID", "increments Invoice.version by 1"] }

  # ---- Enrollment ----
  - { method: POST, path: "/enrollments", description: "Create low-income enrollment application", roles: [EligibilityWorker], code: 201, input: [subscriber_id, subsidy_program_id, household_size, annual_income_cents], output: Enrollment, side_effects: ["computes fpl_pct"] }
  - { method: GET, path: "/enrollments/{id}", description: "Get enrollment", roles: *all_roles, code: 200, input: [], output: Enrollment }
  - { method: GET, path: "/enrollments", description: "List enrollments (reverse subscriber_id/subsidy_program_id)", roles: *all_roles, code: 200, input: ["subscriber_id?", "subsidy_program_id?", "limit?", "offset?"], output: "Enrollment[]" }
  - { method: POST, path: "/enrollments/{id}/verify", description: "Verify eligibility (SUBMITTED->ACTIVE|DENIED)", roles: [EligibilityWorker], code: 200, input: [], output: Enrollment }
  - { method: POST, path: "/enrollments/{id}/recertify", description: "Recertify (RECERT_DUE->ACTIVE|TERMINATED)", roles: [EligibilityWorker], code: 200, input: ["annual_income_cents?"], output: Enrollment }
  - { method: POST, path: "/enrollments/{id}/terminate", description: "Terminate enrollment (cascade)", roles: [EligibilityWorker], code: 200, input: ["reason?"], output: Enrollment }

  # ---- Technician ----
  - { method: POST, path: "/technicians", description: "Create technician", roles: [ProgramAdmin], code: 201, input: [name, region, "job_duration_minutes?"], output: Technician }
  - { method: GET, path: "/technicians/{id}", description: "Get technician", roles: *all_roles, code: 200, input: [], output: Technician }
  - { method: POST, path: "/technicians/{id}/deactivate", description: "Deactivate technician AVAILABLE->INACTIVE", roles: [ProgramAdmin], code: 200, input: [], output: Technician }

  # ---- InstallOrder ----
  - { method: POST, path: "/install-orders", description: "Schedule an install (overlap-checked)", roles: [Dispatcher], code: 201, input: [subscription_id, technician_id, scheduled_start_at], output: InstallOrder, side_effects: ["scheduled_end_at = start + job_duration_minutes"] }
  - { method: GET, path: "/install-orders/{id}", description: "Get install order", roles: *all_roles, code: 200, input: [], output: InstallOrder }
  - { method: GET, path: "/install-orders", description: "List install orders (reverse subscription_id/technician_id)", roles: *all_roles, code: 200, input: ["subscription_id?", "technician_id?", "limit?", "offset?"], output: "InstallOrder[]" }
  - { method: POST, path: "/install-orders/{id}/reschedule", description: "Reschedule (cyclic self-loop, overlap-checked)", roles: [Dispatcher], code: 200, input: [scheduled_start_at], output: InstallOrder, side_effects: ["reschedule_count += 1"] }
  - { method: POST, path: "/install-orders/{id}/complete", description: "Complete install", roles: [FieldTech], code: 200, input: ["device_id?"], output: InstallOrder, side_effects: ["if device_id: Device -> DEPLOYED"] }
  - { method: POST, path: "/install-orders/{id}/cancel", description: "Cancel install (compensating device unassign)", roles: [Dispatcher], code: 200, input: [], output: InstallOrder }

  # ---- Device ----
  - { method: POST, path: "/devices", description: "Create device inventory item", roles: [Dispatcher], code: 201, input: [device_class, model, serial_number, value_cents], output: Device }
  - { method: GET, path: "/devices/{id}", description: "Get device", roles: *all_roles, code: 200, input: [], output: Device }
  - { method: GET, path: "/devices", description: "List devices (reverse subscription_id/enrollment_id)", roles: *all_roles, code: 200, input: ["subscription_id?", "enrollment_id?", "status?", "limit?", "offset?"], output: "Device[]" }
  - { method: POST, path: "/devices/{id}/assign", description: "Assign device to a subscription (CPE) or enrollment (distribution)", roles: [Dispatcher], code: 200, input: ["subscription_id?", "enrollment_id?"], output: Device }
  - { method: POST, path: "/devices/{id}/return", description: "Return/restock device (compensating)", roles: [Dispatcher], code: 200, input: [], output: Device }

  # ---- OutageEvent ----
  - { method: POST, path: "/outages", description: "Report an outage (overlap/buffer-checked)", roles: [NocOperator], code: 201, input: [service_area_id, started_at, severity], output: OutageEvent, side_effects: ["computes estimated_credit_total_cents (provisional variant)", "affected_subscription_count snapshot"] }
  - { method: GET, path: "/outages/{id}", description: "Get outage", roles: *all_roles, code: 200, input: [], output: OutageEvent }
  - { method: GET, path: "/outages", description: "List outages (reverse OutageEvent.service_area_id)", roles: *all_roles, code: 200, input: ["service_area_id?", "limit?", "offset?"], output: "OutageEvent[]" }
  - { method: POST, path: "/outages/{id}/resolve", description: "Resolve outage (cascade SLA credits -> invoices)", roles: [NocOperator], code: 200, input: [ended_at], output: OutageEvent, side_effects: ["create SlaCredit per affected sub -> apply to invoices -> recompute totals/status"] }

  # ---- SlaCredit (cascade-created; discovery-only) ----
  - { method: GET, path: "/sla-credits/{id}", description: "Get SLA credit", roles: *all_roles, code: 200, input: [], output: SlaCredit }
  - { method: GET, path: "/sla-credits", description: "List SLA credits (reverse subscription_id/outage_id)", roles: *all_roles, code: 200, input: ["subscription_id?", "outage_id?", "limit?", "offset?"], output: "SlaCredit[]" }

  # ---- GrantClaim actions ----
  - { method: GET, path: "/grant-claims/{id}", description: "Get grant claim", roles: *all_roles, code: 200, input: [], output: GrantClaim }
  - { method: POST, path: "/grant-claims/{id}/submit", description: "Submit claim (records submitted_by)", roles: [ComplianceAnalyst], code: 200, input: [], output: GrantClaim }
  - { method: POST, path: "/grant-claims/{id}/approve", description: "Approve claim (SoD, funds check)", roles: [ComplianceOfficer], code: 200, input: [], output: GrantClaim, side_effects: ["commit+disburse funds; maybe MILESTONE_MET"] }
  - { method: POST, path: "/grant-claims/{id}/reject", description: "Reject claim (SoD; funds unchanged)", roles: [ComplianceOfficer], code: 200, input: ["reason?"], output: GrantClaim }

  # ---- Test-driving clock ----
  - { method: POST, path: "/_clock/set_current_utc", description: "Set the server logical clock. Startup default is 2026-05-01T00:00:00Z; before any set call the clock reads exactly this default and never falls back to wall-clock.", roles: *all_roles, code: 200, input: [to_iso8601], output: null }

# =============================================================================
# 1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "Missing/invalid X-User-Role or X-User-ID" }
  - { id: ERR_UNAUTHORIZED, http: 403, condition: "Role not permitted for the operation" }
  - { id: ERR_VALIDATION, http: 400, condition: "Missing required field, bad type, or invalid enum value" }
  - { id: ERR_GRANT_NOT_FOUND, http: 404, condition: "Grant id does not exist" }
  - { id: ERR_SERVICE_AREA_NOT_FOUND, http: 404, condition: "ServiceArea id does not exist" }
  - { id: ERR_SERVICE_PLAN_NOT_FOUND, http: 404, condition: "ServicePlan id does not exist" }
  - { id: ERR_SUBSIDY_PROGRAM_NOT_FOUND, http: 404, condition: "SubsidyProgram id does not exist" }
  - { id: ERR_SUBSCRIBER_NOT_FOUND, http: 404, condition: "Subscriber id does not exist" }
  - { id: ERR_SUBSCRIPTION_NOT_FOUND, http: 404, condition: "Subscription id does not exist" }
  - { id: ERR_ENROLLMENT_NOT_FOUND, http: 404, condition: "Enrollment id does not exist" }
  - { id: ERR_TECHNICIAN_NOT_FOUND, http: 404, condition: "Technician id does not exist" }
  - { id: ERR_INSTALL_ORDER_NOT_FOUND, http: 404, condition: "InstallOrder id does not exist" }
  - { id: ERR_DEVICE_NOT_FOUND, http: 404, condition: "Device id does not exist" }
  - { id: ERR_OUTAGE_NOT_FOUND, http: 404, condition: "OutageEvent id does not exist" }
  - { id: ERR_INVOICE_NOT_FOUND, http: 404, condition: "Invoice id does not exist" }
  - { id: ERR_GRANT_CLAIM_NOT_FOUND, http: 404, condition: "GrantClaim id does not exist" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Transition not allowed from the resource's current state" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "OCC expected_<parent>_version does not match current parent.version" }
  - { id: ERR_AREA_NOT_SERVICEABLE, http: 409, condition: "Referenced ServiceArea not in SERVICEABLE state for subscription create / claim submit" }
  - { id: ERR_TECHNICIAN_INACTIVE, http: 409, condition: "Referenced technician not AVAILABLE at install create" }
  - { id: ERR_INSTALL_NOT_COMPLETED, http: 409, condition: "Subscription activate without a COMPLETED InstallOrder" }
  - { id: ERR_SEGREGATION_OF_DUTIES, http: 403, condition: "GrantClaim approver/rejecter X-User-ID equals submitted_by" }
  - { id: ERR_TECHNICIAN_DOUBLE_BOOKED, http: 409, condition: "Install window overlaps another SCHEDULED install for the same technician" }
  - { id: ERR_OUTAGE_OVERLAP, http: 409, condition: "New outage within OUTAGE_MERGE_BUFFER_MINUTES of an existing OPEN outage on the same area" }
  - { id: ERR_PERIOD_INVALID, http: 422, condition: "period_end <= period_start (or ended_at <= started_at)" }
  - { id: ERR_OUTAGE_NOT_ENDED, http: 422, condition: "Outage resolve without a valid ended_at" }
  - { id: ERR_DEVICE_NOT_AVAILABLE, http: 409, condition: "Device assign when not IN_STOCK, or not exactly one target id supplied" }
  - { id: ERR_DUPLICATE_ACTIVE_ENROLLMENT, http: 409, condition: "Subscriber already has an ACTIVE enrollment at verify" }
  - { id: ERR_INVOICE_NOT_PAYABLE, http: 409, condition: "Payment against an invoice not in ISSUED state" }
  - { id: ERR_INSUFFICIENT_GRANT_FUNDS, http: 409, condition: "Claim amount_claimed_cents exceeds grant.available_balance_cents at approve" }

# =============================================================================
# 1.7 RBAC Matrix
# =============================================================================
roles:
  - name: ProgramAdmin
    description: "Configures the program: grants, service areas & serviceability, plans, subsidy programs, technicians."
    identity: opaque
    exclusive_operations:
      - "POST /grants"
      - "POST /service-areas"
      - "POST /service-areas/{id}/advance"
      - "POST /service-areas/{id}/suspend"
      - "POST /service-areas/{id}/reinstate"
      - "POST /service-plans"
      - "POST /subsidy-programs"
      - "POST /technicians"
    shared_operations: ["all GET reads"]
  - name: ComplianceAnalyst
    description: "Prepares and submits BEAD grant claims (cannot approve them)."
    identity: opaque
    exclusive_operations:
      - "POST /grants/{id}/claims"
      - "POST /grant-claims/{id}/submit"
    shared_operations: ["all GET reads"]
  - name: ComplianceOfficer
    description: "Approves or rejects grant claims; cannot be the same person who submitted (SoD)."
    identity: opaque
    exclusive_operations:
      - "POST /grant-claims/{id}/approve"
      - "POST /grant-claims/{id}/reject"
    shared_operations: ["all GET reads"]
  - name: CustomerCare
    description: "Manages subscribers and subscription lifecycle."
    identity: opaque
    exclusive_operations:
      - "POST /subscribers"
      - "POST /subscriptions"
      - "POST /subscriptions/{id}/activate"
      - "POST /subscriptions/{id}/suspend"
      - "POST /subscriptions/{id}/cancel"
    shared_operations: ["all GET reads"]
  - name: EligibilityWorker
    description: "Runs low-income enrollment intake, verification, recertification and termination."
    identity: opaque
    exclusive_operations:
      - "POST /enrollments"
      - "POST /enrollments/{id}/verify"
      - "POST /enrollments/{id}/recertify"
      - "POST /enrollments/{id}/terminate"
    shared_operations: ["all GET reads"]
  - name: Dispatcher
    description: "Schedules installs and manages device inventory."
    identity: opaque
    exclusive_operations:
      - "POST /install-orders"
      - "POST /install-orders/{id}/reschedule"
      - "POST /install-orders/{id}/cancel"
      - "POST /devices"
      - "POST /devices/{id}/assign"
      - "POST /devices/{id}/return"
    shared_operations: ["all GET reads"]
  - name: FieldTech
    description: "Field technician who completes their own assigned installs; X-User-ID is a Technician id."
    identity: "entity_backed:Technician"
    exclusive_operations:
      - "POST /install-orders/{id}/complete"
    shared_operations: ["all GET reads"]
  - name: NocOperator
    description: "Network operations: reports and resolves outages."
    identity: opaque
    exclusive_operations:
      - "POST /outages"
      - "POST /outages/{id}/resolve"
    shared_operations: ["all GET reads"]
  - name: Billing
    description: "Generates invoices and records payments."
    identity: opaque
    exclusive_operations:
      - "POST /subscriptions/{id}/invoices"
      - "POST /invoices/{id}/payments"
    shared_operations: ["all GET reads"]
