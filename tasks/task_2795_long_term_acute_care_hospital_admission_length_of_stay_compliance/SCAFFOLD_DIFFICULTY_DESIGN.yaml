      - name: referral_share_at_exactly_25_and_50_percent_with_the_min_admission_guard
        grounds:
          - calculations.referral_source_share
          - entities.ReferringHospital.fields.monitoring_state
          - entities.ReferringHospital.fields.share_pct
        distinguishing_aspect: |
          Three boundaries interact in one denominator sweep: the MIN_ADMISSIONS_FOR_MONITORING guard
          (at 3 admissions everyone is COMPLIANT even at a 66.67% share; at 4 the rule engages), the
          STRICTLY-greater breach test (exactly 25.00 is NOT a breach - it is WARNING), and the
          WARNING_MARGIN band (25.00 > 25.00 - 5.00). Moving the denominator from 3 to 4 with one
          admission re-labels all three hospitals at once.
        test_recipe:
          setup:
            - "OPEN period FY2027, ACTIVE criteria set CS-2026A, DRG 207 loaded, clock at the default 2026-08-01T00:00:00Z."
            - "Three non-colocated ACUTE_CARE referring hospitals (threshold_pct 25.00 each): Metro, Suburban, Riverside."
            - "Four distinct patients, each PMV-track. Riverside refers two of them, Metro one, Suburban one."
            - "The first THREE admissions land before the trigger, leaving Riverside at 66.67% with the denominator below MIN_ADMISSIONS_FOR_MONITORING."
