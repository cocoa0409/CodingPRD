        distinguishing_aspect: "Category pair business_safety vs business_fiscal, and both rules return the SAME http_status 422, so the only observable difference is error_id - a status-code shortcut cannot pass. The second call proves the fiscal rule was genuinely violated the whole time by fixing only handset_handling and watching ERR_RETENTION_CEILING_EXCEEDED surface from the same retention_days value."
