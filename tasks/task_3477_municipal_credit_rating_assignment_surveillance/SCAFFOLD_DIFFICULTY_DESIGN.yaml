# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# Task: task_3477_municipal_credit_rating_assignment_surveillance
# 9 rules x >=2 instances = 19 instances. Every chain replays from empty-DB
# using only SCAFFOLD.yaml §1.5 endpoints. Shared call atoms are anchored at
# first use (&c_default, &mk_issuer, ...); aliases (*) replay them verbatim.
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:

      - name: scorecard_weak_link_cap_divergence
        grounds:
          - calculations.weighted_scorecard
          - entities.AnalyticalScorecard.fields.capped
          - entities.AnalyticalScorecard.fields.indicative_notch
        distinguishing_aspect: "Same six factor scores (5,5,5,5,5,1) under ENTERPRISE criteria produce indicative_notch BB (weak-link cap fires on min score 1) while under GENERAL_OBLIGATION criteria they produce AA uncapped — two variants of the same calculation on the AnalyticalScorecard domain diverge."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z (server default). Two issuers; ACTIVE GO criteria (weights 0.20/0.20/0.20/0.15/0.10/0.15) and ACTIVE ENTERPRISE criteria (weights 0.10/0.25/0.20/0.10/0.15/0.20) for US-CA."
            - "GO engagement driven to ANALYSIS (fee 4500000, 4 GO documents); ENTERPRISE engagement driven to ANALYSIS (fee 5800000, 3 ENTERPRISE documents)."
          setup_api_calls:
            - &c_default
              call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - &mk_issuer
              call: "POST /muni/issuers"
              payload: { legal_name: "City of Example", state_code: "CA", issuer_type: "GENERAL_GOVERNMENT", fiscal_year_end: "06-30", population: 500000 }
              as: PlatformAdmin
              captures: { iss: $.data.id }
            - &mk_issuer_2
              call: "POST /muni/issuers"
              payload: { legal_name: "Example Water Authority", state_code: "CA", issuer_type: "ENTERPRISE_PROVIDER", fiscal_year_end: "06-30", population: 210000 }
              as: PlatformAdmin
              captures: { iss2: $.data.id }
            - &mk_cv_go
              call: "POST /muni/criteria-versions"
              payload: { jurisdiction_code: "US-CA", credit_type: "GENERAL_OBLIGATION", version_label: "GO-2026.1", w_economy: 0.20, w_management: 0.20, w_budgetary_performance: 0.20, w_flexibility: 0.15, w_liquidity: 0.10, w_debt_profile: 0.15 }
              as: SurveillanceOfficer
              captures: { cv_go: $.data.id }
            - &act_cv_go
              call: "POST /muni/criteria-versions/${cv_go}/activate"
              payload: {}
              as: SurveillanceOfficer
            - &mk_cv_ent
              call: "POST /muni/criteria-versions"
              payload: { jurisdiction_code: "US-CA", credit_type: "ENTERPRISE", version_label: "ENT-2026.1", w_economy: 0.10, w_management: 0.25, w_budgetary_performance: 0.20, w_flexibility: 0.10, w_liquidity: 0.15, w_debt_profile: 0.20 }
              as: SurveillanceOfficer
              captures: { cv_ent: $.data.id }
            - &act_cv_ent
              call: "POST /muni/criteria-versions/${cv_ent}/activate"
              payload: {}
              as: SurveillanceOfficer
            - &mk_eng_go
              call: "POST /muni/engagements"
              payload: { issuer_id: "${iss}", solicitation: "SOLICITED", credit_type: "GENERAL_OBLIGATION", jurisdiction_code: "US-CA" }
              as: Issuer
              as_user_id: "${iss}"
              captures: { eng_go: $.data.id }
            - &accept_go
              call: "POST /muni/engagements/${eng_go}/accept-terms"
              payload: { fee_payment_cents: 4500000, apply_credit_cents: 0 }
              as: Issuer
              as_user_id: "${iss}"
            - &doc_audit
              call: "POST /muni/engagements/${eng_go}/documents"
              payload: { document_code: "AUDIT_FY" }
              as: Issuer
              as_user_id: "${iss}"
            - &doc_budget
              call: "POST /muni/engagements/${eng_go}/documents"
              payload: { document_code: "ADOPTED_BUDGET" }
              as: Issuer
              as_user_id: "${iss}"
            - &doc_tax
              call: "POST /muni/engagements/${eng_go}/documents"
              payload: { document_code: "TAX_BASE_REPORT" }
              as: Issuer
              as_user_id: "${iss}"
            - &doc_debt
              call: "POST /muni/engagements/${eng_go}/documents"
              payload: { document_code: "DEBT_STATEMENT" }
              as: Issuer
              as_user_id: "${iss}"
              captures: { eng_go_v: $.data.version }
            - &mk_eng_ent
              call: "POST /muni/engagements"
              payload: { issuer_id: "${iss2}", solicitation: "SOLICITED", credit_type: "ENTERPRISE", jurisdiction_code: "US-CA" }
              as: Issuer
              as_user_id: "${iss2}"
              captures: { eng_ent: $.data.id }
            - &accept_ent
              call: "POST /muni/engagements/${eng_ent}/accept-terms"
              payload: { fee_payment_cents: 5800000, apply_credit_cents: 0 }
              as: Issuer
              as_user_id: "${iss2}"
            - call: "POST /muni/engagements/${eng_ent}/documents"
              payload: { document_code: "AUDIT_FY" }
              as: Issuer
              as_user_id: "${iss2}"
            - call: "POST /muni/engagements/${eng_ent}/documents"
              payload: { document_code: "MANAGEMENT_DISCUSSION" }
              as: Issuer
              as_user_id: "${iss2}"
            - call: "POST /muni/engagements/${eng_ent}/documents"
              payload: { document_code: "CAPITAL_PLAN" }
              as: Issuer
              as_user_id: "${iss2}"
              captures: { eng_ent_v: $.data.version }
          trigger:
            - call: "POST /muni/engagements/${eng_go}/scorecard"
              payload: { score_economy: 5, score_management: 5, score_budgetary_performance: 5, score_flexibility: 5, score_liquidity: 5, score_debt_profile: 1, expected_engagement_version: "${eng_go_v}" }
              as: LeadAnalyst
              as_user_id: "analyst-1"
              captures: { sc_go_anchor: $.data.anchor_notch, sc_go_ind: $.data.indicative_notch, sc_go_ws: $.data.weighted_score, sc_go_cap: $.data.capped }
            - call: "POST /muni/engagements/${eng_ent}/scorecard"
              payload: { score_economy: 5, score_management: 5, score_budgetary_performance: 5, score_flexibility: 5, score_liquidity: 5, score_debt_profile: 1, expected_engagement_version: "${eng_ent_v}" }
              as: LeadAnalyst
              as_user_id: "analyst-2"
              captures: { sc_ent_ind: $.data.indicative_notch, sc_ent_ws: $.data.weighted_score, sc_ent_cap: $.data.capped }
          assert:
            - "GO scorecard: weighted_score == 4.40, anchor_notch == AA, capped == false, indicative_notch == AA"
            - "ENTERPRISE scorecard: weighted_score == 4.20, anchor_notch == AA, capped == true, indicative_notch == BB"
            - "same six input scores, different variants selected by credit_type: GO indicative AA != ENTERPRISE indicative BB"

      - name: bond_sale_provisional_vs_final_spread
        grounds:
          - calculations.borrowing_cost_at_sale
          - entities.BondSale.fields.pricing_mode
        distinguishing_aspect: "On the BondSale domain, identical par/maturity price at effective_yield 390 bps (PROVISIONAL off the indicative A notch) versus 450 bps (FINAL off the published BBB notch) — total_interest_cents 19500000 vs 22500000 for identical sale inputs; a different entity domain than the scorecard variant instance."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z. GO engagement driven to a PUBLISHED rating: indicative A (scores 4,4,3,4,4,2 -> 3.5000), committee votes BBB/BBB/A -> median BBB (1-notch deviation, allowed), published at 2026-09-08T00:00:00Z."
          setup_api_calls:
            - *c_default
            - *mk_issuer
            - *mk_cv_go
            - *act_cv_go
            - *mk_eng_go
            - *accept_go
            - *doc_audit
            - *doc_budget
            - *doc_tax
            - *doc_debt
            - &score_a
              call: "POST /muni/engagements/${eng_go}/scorecard"
              payload: { score_economy: 4, score_management: 4, score_budgetary_performance: 3, score_flexibility: 4, score_liquidity: 4, score_debt_profile: 2, expected_engagement_version: "${eng_go_v}" }
              as: LeadAnalyst
              as_user_id: "analyst-1"
            - &sched_std
              call: "POST /muni/engagements/${eng_go}/committee-sessions"
              payload: { start_at: "2026-09-02T10:00:00Z", end_at: "2026-09-02T12:00:00Z", voter_ids: ["voter-1", "voter-2", "voter-3", "voter-4", "voter-5"] }
              as: CommitteeChair
              as_user_id: "chair-1"
              captures: { sess: $.data.id }
            - &c_open
              call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-02T10:30:00Z" }
              as: PlatformAdmin
            - &open_std
              call: "POST /muni/committee-sessions/${sess}/open"
              payload: {}
              as: CommitteeChair
              as_user_id: "chair-1"
            - call: "POST /muni/committee-sessions/${sess}/votes"
              payload: { voter_id: "voter-1", notch_vote: "BBB" }
              as: CommitteeMember
              as_user_id: "voter-1"
            - call: "POST /muni/committee-sessions/${sess}/votes"
              payload: { voter_id: "voter-2", notch_vote: "BBB" }
              as: CommitteeMember
              as_user_id: "voter-2"
            - call: "POST /muni/committee-sessions/${sess}/votes"
              payload: { voter_id: "voter-3", notch_vote: "A" }
              as: CommitteeMember
              as_user_id: "voter-3"
            - &close_std
              call: "POST /muni/committee-sessions/${sess}/close"
              payload: {}
              as: CommitteeChair
              as_user_id: "chair-1"
            - &get_rating
              call: "GET /muni/ratings"
              payload: { engagement_id: "${eng_go}" }
              as: LeadAnalyst
              as_user_id: "analyst-1"
              captures: { rating_id: "$.data[0].id", rating_v: "$.data[0].version" }
            - &c_publish
              call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-08T00:00:00Z" }
              as: PlatformAdmin
            - &publish_std
              call: "POST /muni/ratings/${rating_id}/publish"
              payload: { outlook: "STABLE", rationale: "Stable credit profile" }
              as: LeadAnalyst
              as_user_id: "analyst-1"
          trigger:
            - call: "POST /muni/bond-sales"
              payload: { issuer_id: "${iss}", rating_id: "${rating_id}", par_amount_cents: 100000000, maturity_years: 5, sale_date: "2026-09-15T00:00:00Z", pricing_mode: "PROVISIONAL" }
              as: Issuer
              as_user_id: "${iss}"
              captures: { prov_yield: $.data.effective_yield_bps, prov_annual: $.data.annual_interest_cents, prov_total: $.data.total_interest_cents }
            - call: "POST /muni/bond-sales"
              payload: { issuer_id: "${iss}", rating_id: "${rating_id}", par_amount_cents: 100000000, maturity_years: 5, sale_date: "2026-09-15T00:00:00Z", pricing_mode: "FINAL" }
              as: Issuer
              as_user_id: "${iss}"
              captures: { fin_yield: $.data.effective_yield_bps, fin_total: $.data.total_interest_cents }
          assert:
            - "PROVISIONAL: effective_yield_bps == 390, annual_interest_cents == 3900000, total_interest_cents == 19500000 (indicative notch A)"
            - "FINAL: effective_yield_bps == 450, annual_interest_cents == 4500000, total_interest_cents == 22500000 (published notch BBB)"
            - "identical sale inputs diverge by 3000000 cents across the two variants; Rating.notch == BBB while scorecard indicative_notch == A"

  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:

      - name: committee_median_even_split_conservatism
        grounds:
          - calculations.committee_outcome_tally
          - state_machines.CommitteeSession.IN_SESSION_to_COMPLETED
        distinguishing_aspect: "Mode (a) combinatorial tally: one recusal leaves an even 4-vote pool [AAA, A, BBB, BB]; the even-count median rule picks the WORSE of the two middle notches (BBB, not A), and the result survives the 1-notch deviation guard against indicative A — a >=3-input non-linear tally on the CommitteeSession domain."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z. GO engagement at COMMITTEE_READY with indicative A (scores 4,4,3,4,4,2 -> 3.5000); session window 2026-09-02T10:00-12:00Z opened at 10:30."
          setup_api_calls:
            - *c_default
            - *mk_issuer
            - *mk_cv_go
            - *act_cv_go
            - *mk_eng_go
            - *accept_go
            - *doc_audit
            - *doc_budget
            - *doc_tax
            - *doc_debt
            - *score_a
            - *sched_std
            - *c_open
            - *open_std
          trigger:
            - call: "POST /muni/committee-sessions/${sess}/votes"
              payload: { voter_id: "voter-1", recusal_reason: "prior advisory engagement with issuer" }
              as: CommitteeMember
              as_user_id: "voter-1"
            - call: "POST /muni/committee-sessions/${sess}/votes"
              payload: { voter_id: "voter-2", notch_vote: "AAA" }
              as: CommitteeMember
              as_user_id: "voter-2"
            - call: "POST /muni/committee-sessions/${sess}/votes"
              payload: { voter_id: "voter-3", notch_vote: "A" }
              as: CommitteeMember
              as_user_id: "voter-3"
            - call: "POST /muni/committee-sessions/${sess}/votes"
              payload: { voter_id: "voter-4", notch_vote: "BBB" }
              as: CommitteeMember
              as_user_id: "voter-4"
            - call: "POST /muni/committee-sessions/${sess}/votes"
              payload: { voter_id: "voter-5", notch_vote: "BB" }
              as: CommitteeMember
              as_user_id: "voter-5"
            - call: "POST /muni/committee-sessions/${sess}/close"
              payload: {}
              as: CommitteeChair
              as_user_id: "chair-1"
              captures: { sess_status: $.data.status, sess_outcome: $.data.outcome_notch }
          assert:
            - "sorted vote indices [0,2,3,4] (AAA,A,BBB,BB); even count 4 picks index 4//2 == 2 -> notch index 3 == BBB (worse of A/BBB middle pair)"
            - "session status == COMPLETED, outcome_notch == BBB, adjourn_reason is null"
            - "created Rating.notch == BBB (1-notch deviation from indicative A is within NOTCH_DEVIATION_MAX 1)"
            - "session eligible_voter_count == 4 after the single recusal"

      - name: borrowing_cost_per_year_rounding_pinned
        grounds:
          - calculations.borrowing_cost_at_sale
          - entities.BondSale.fields.annual_interest_cents
          - entities.BondSale.fields.total_interest_cents
        distinguishing_aspect: "Mode (b) nested rounding: par 1000000008 cents at 625 bps gives exact annual interest 62500000.5 cents; the pinned order rounds each year first (62500001) then multiplies by 3 years -> 187500003, while the forbidden sum-then-round order gives 187500002 — a 1-cent observable divergence."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z. GO engagement with scores (3,3,3,3,3,2) -> weighted 2.8500 -> indicative BB; committee votes BB/BB/BB; rating PUBLISHED at 2026-09-08T00:00:00Z with notch BB."
          setup_api_calls:
            - *c_default
            - *mk_issuer
            - *mk_cv_go
            - *act_cv_go
            - *mk_eng_go
            - *accept_go
            - *doc_audit
            - *doc_budget
            - *doc_tax
            - *doc_debt
            - call: "POST /muni/engagements/${eng_go}/scorecard"
              payload: { score_economy: 3, score_management: 3, score_budgetary_performance: 3, score_flexibility: 3, score_liquidity: 3, score_debt_profile: 2, expected_engagement_version: "${eng_go_v}" }
              as: LeadAnalyst
              as_user_id: "analyst-1"
            - *sched_std
            - *c_open
            - *open_std
            - call: "POST /muni/committee-sessions/${sess}/votes"
              payload: { voter_id: "voter-1", notch_vote: "BB" }
              as: CommitteeMember
              as_user_id: "voter-1"
            - call: "POST /muni/committee-sessions/${sess}/votes"
              payload: { voter_id: "voter-2", notch_vote: "BB" }
              as: CommitteeMember
              as_user_id: "voter-2"
            - call: "POST /muni/committee-sessions/${sess}/votes"
              payload: { voter_id: "voter-3", notch_vote: "BB" }
              as: CommitteeMember
              as_user_id: "voter-3"
            - *close_std
            - *get_rating
            - *c_publish
            - *publish_std
          trigger:
            - call: "POST /muni/bond-sales"
              payload: { issuer_id: "${iss}", rating_id: "${rating_id}", par_amount_cents: 1000000008, maturity_years: 3, sale_date: "2026-09-15T00:00:00Z", pricing_mode: "FINAL" }
              as: Issuer
              as_user_id: "${iss}"
              captures: { trap_yield: $.data.effective_yield_bps, trap_annual: $.data.annual_interest_cents, trap_total: $.data.total_interest_cents }
          assert:
            - "effective_yield_bps == 625 (300 benchmark + 325 BB spread)"
            - "annual_interest_cents == 62500001 (round_half_up(62500000.5) per year, applied FIRST)"
            - "total_interest_cents == 187500003 == 3 * 62500001, and != 187500002 which the forbidden sum-then-round order would produce"

      - name: nondisclosure_sweep_evaluation_order_pinned
        grounds:
          - calculations.nondisclosure_sweep
          - state_machines.DisclosureObligation.transitions
          - state_machines.Rating.PUBLISHED_to_WITHDRAWN
        distinguishing_aspect: "Mode (c) circular-looking dependency resolved by pinned order: one clock jump from 2026-09-08 to 2028-03-27 walks the obligation PENDING->OVERDUE->DELINQUENT->DEFAULTED, withdraws the rating NON_DISCLOSURE, and then EXCLUDES the withdrawn rating from posture recomputation — observable because the withdrawn rating's surveillance_posture stays DELINQUENT rather than being recomputed."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z. GO rating PUBLISHED at 2026-09-08T00:00:00Z (indicative A, votes A/A/BBB -> outcome A). Obligation period 1: fiscal_year_end 2027-06-30T00:00:00Z, due_at 2028-01-26T00:00:00Z."
          setup_api_calls:
            - *c_default
            - *mk_issuer
            - *mk_cv_go
            - *act_cv_go
            - *mk_eng_go
            - *accept_go
            - *doc_audit
            - *doc_budget
            - *doc_tax
            - *doc_debt
            - *score_a
            - *sched_std
            - *c_open
            - *open_std
            - &votes_aab
              call: "POST /muni/committee-sessions/${sess}/votes"
              payload: { voter_id: "voter-1", notch_vote: "A" }
              as: CommitteeMember
              as_user_id: "voter-1"
            - &vote_a2
              call: "POST /muni/committee-sessions/${sess}/votes"
              payload: { voter_id: "voter-2", notch_vote: "A" }
              as: CommitteeMember
              as_user_id: "voter-2"
            - &vote_bbb3
              call: "POST /muni/committee-sessions/${sess}/votes"
              payload: { voter_id: "voter-3", notch_vote: "BBB" }
              as: CommitteeMember
              as_user_id: "voter-3"
            - *close_std
            - *get_rating
            - *c_publish
            - *publish_std
            - &get_obls
              call: "GET /muni/ratings/${rating_id}/disclosure-obligations"
              payload: {}
              as: SurveillanceOfficer
              captures: { ob1: "$.data[0].id" }
          trigger:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2028-03-27T00:00:00Z" }
              as: PlatformAdmin
            - call: "GET /muni/disclosure-obligations/${ob1}"
              payload: {}
              as: SurveillanceOfficer
              captures: { ob1_status: $.data.status }
            - call: "GET /muni/ratings/${rating_id}"
              payload: {}
              as: SurveillanceOfficer
              captures: { r_status: $.data.status, r_posture: $.data.surveillance_posture, r_reason: $.data.withdraw_reason }
            - call: "GET /muni/issuers/${iss}"
              payload: {}
              as: SurveillanceOfficer
              captures: { iss_flag: $.data.delinquent_flag }
          assert:
            - "DisclosureObligation.${ob1}.status == DEFAULTED (single jump walked all three thresholds: 2028-03-27 > due 2028-01-26, > +30d 2028-02-25, > +60d 2028-03-26)"
            - "Rating.${rating_id}.status == WITHDRAWN and withdraw_reason == NON_DISCLOSURE and withdrawn_at == 2028-03-27T00:00:00Z"
            - "Rating.${rating_id}.surveillance_posture == DELINQUENT (frozen: step 3 of the pinned sweep order excludes ratings withdrawn in step 2; a recomputed posture would read CURRENT since no PENDING/OVERDUE/DELINQUENT obligation remains)"
            - "Issuer.${iss}.delinquent_flag == true"
            - "IssuerNotification log for ${iss} contains event_type OBLIGATION_DELINQUENT and event_type RATING_WITHDRAWN, in that order"

  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:

      - name: engagement_appeal_re_deliberation_cycle
        grounds:
          - state_machines.RatingEngagement.RATING_ASSIGNED_to_COMMITTEE_READY
          - state_machines.Rating.ASSIGNED_to_REMANDED
          - state_machines.Appeal.FILED_to_UPHELD
        distinguishing_aspect: "Cyclic machine on RatingEngagement: an upheld appeal before publication loops RATING_ASSIGNED -> COMMITTEE_READY -> RATING_ASSIGNED with a fresh committee session, while the first Rating dies in REMANDED — a true cycle on the engagement entity."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z. GO engagement at RATING_ASSIGNED (indicative A, votes A/A/BBB -> outcome A, assigned_at 2026-09-02T10:30:00Z). No appeal yet; rating not published."
          setup_api_calls:
            - *c_default
            - *mk_issuer
            - *mk_cv_go
            - *act_cv_go
            - *mk_eng_go
            - *accept_go
            - *doc_audit
            - *doc_budget
            - *doc_tax
            - *doc_debt
            - *score_a
            - *sched_std
            - *c_open
            - *open_std
            - *votes_aab
            - *vote_a2
            - *vote_bbb3
            - *close_std
            - *get_rating
          trigger:
            - call: "POST /muni/ratings/${rating_id}/appeals"
              payload: { new_information_codes: ["PENSION_VALUATION"] }
              as: Issuer
              as_user_id: "${iss}"
              captures: { appeal_id: $.data.id }
            - call: "POST /muni/appeals/${appeal_id}/decide"
              payload: { decision: "UPHELD", rationale: "Pension valuation is material new information" }
              as: CommitteeChair
              as_user_id: "chair-1"
            - call: "POST /muni/engagements/${eng_go}/committee-sessions"
              payload: { start_at: "2026-09-03T12:00:00Z", end_at: "2026-09-03T14:00:00Z", voter_ids: ["voter-1", "voter-2", "voter-3", "voter-4", "voter-5"] }
              as: CommitteeChair
              as_user_id: "chair-1"
              captures: { sess2: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-03T12:30:00Z" }
              as: PlatformAdmin
            - call: "POST /muni/committee-sessions/${sess2}/open"
              payload: {}
              as: CommitteeChair
              as_user_id: "chair-1"
            - call: "POST /muni/committee-sessions/${sess2}/votes"
              payload: { voter_id: "voter-1", notch_vote: "BBB" }
              as: CommitteeMember
              as_user_id: "voter-1"
            - call: "POST /muni/committee-sessions/${sess2}/votes"
              payload: { voter_id: "voter-2", notch_vote: "BBB" }
              as: CommitteeMember
              as_user_id: "voter-2"
            - call: "POST /muni/committee-sessions/${sess2}/votes"
              payload: { voter_id: "voter-3", notch_vote: "BBB" }
              as: CommitteeMember
              as_user_id: "voter-3"
            - call: "POST /muni/committee-sessions/${sess2}/close"
