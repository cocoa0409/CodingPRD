    side_effects: ["derives connected; lifecycle_status starts at PRE_RELEASE"]
  - method: GET
    path: /equipment-models
    roles: [ProductEngineer, ComplianceOfficer, OrderPlanner, FacilityManager, ServicePartnerTech, ServiceOpsAdmin]
    input: ["category?", "lifecycle_status?", "supersedes_model_id?", "limit?", "offset?"]
    output: EquipmentModel[]
    success_status: 200
    side_effects: []
  - method: GET
    path: /equipment-models/{id}
    roles: [ProductEngineer, ComplianceOfficer, OrderPlanner, FacilityManager, ServicePartnerTech, ServiceOpsAdmin]
    input: []
    output: EquipmentModel
    success_status: 200
    side_effects: []

  # ---- ModelRevision --------------------------------------------------------
  - method: POST
    path: /model-revisions
    roles: [ProductEngineer]
    input: ["equipment_model_id", "revision_code", "target_cycle_count", "firmware_baseline_version?", "expected_equipment_model_version"]
    output: ModelRevision
    success_status: 201
    side_effects: ["OCC on EquipmentModel.version (§1.2.1 revision-create-against-stale-model); increments EquipmentModel.version by 1; derives min_required_cycles from the model's duty_class"]
  - method: GET
    path: /model-revisions
    roles: [ProductEngineer, ComplianceOfficer, OrderPlanner, FacilityManager, ServicePartnerTech, ServiceOpsAdmin]
    input: ["equipment_model_id?", "status?", "limit?", "offset?"]
    output: ModelRevision[]
    success_status: 200
    side_effects: []
  - method: GET
    path: /model-revisions/{id}
    roles: [ProductEngineer, ComplianceOfficer, OrderPlanner, FacilityManager, ServicePartnerTech, ServiceOpsAdmin]
    input: []
    output: ModelRevision
    success_status: 200
    side_effects: []
  - method: POST
    path: /model-revisions/{id}/submit-for-testing
    roles: [ProductEngineer]
    input: []
    output: ModelRevision
    success_status: 200
    side_effects: ["DRAFT -> IN_TESTING"]
  - method: POST
    path: /model-revisions/{id}/rework
    roles: [ProductEngineer]
    input: [rework_note]
    output: ModelRevision
    success_status: 200
    side_effects: ["IN_TESTING or TEST_FAILED -> DRAFT; increments rework_count; supersedes every COMPLETED run so both cycle variants reset to 0"]
  - method: POST
    path: /model-revisions/{id}/qualify
    roles: [ProductEngineer]
    input: []
    output: ModelRevision
    success_status: 200
    side_effects: ["IN_TESTING -> QUALIFIED; stamps qualified_at"]
  - method: POST
    path: /model-revisions/{id}/release
    roles: [ComplianceOfficer]
    input: []
    output: ModelRevision
    success_status: 200
    side_effects: ["QUALIFIED -> RELEASED; bumps the model's released_revision_count and lifecycle_status; supersedes the predecessor model's RELEASED revisions"]
  - method: POST
    path: /model-revisions/{id}/sunset
    roles: [ComplianceOfficer]
    input: [sunset_reason]
    output: ModelRevision
    success_status: 200
    side_effects: ["RELEASED -> SUNSET_ANNOUNCED; sets firmware_support_until; cascades to assets, PM programs and visits"]
  - method: POST
    path: /model-revisions/{id}/mark-obsolete
    roles: [ComplianceOfficer]
    input: []
    output: ModelRevision
    success_status: 200
    side_effects: ["SUNSET_ANNOUNCED -> OBSOLETE once the support commitment has lapsed"]
  - method: GET
    path: /model-revisions/{id}/qualification-report
    roles: [ProductEngineer, ComplianceOfficer, ServiceOpsAdmin]
    input: []
    output: "{ verified_cycle_count: integer, projected_cycle_count: integer, min_required_cycles: integer, completed_run_count: integer, running_run_count: integer, qualifies: boolean }"
    success_status: 200
    side_effects: ["read-only projection of calculations.revision_cycle_qualification, both variants side by side"]

  # ---- Durability testing ---------------------------------------------------
  - method: POST
    path: /test-rigs
    roles: [ProductEngineer, ServiceOpsAdmin]
    input: [name, parallel_station_count, supported_duty_classes]
    output: DurabilityTestRig
    success_status: 201
    side_effects: []
  - method: GET
    path: /test-rigs/{id}
    roles: [ProductEngineer, ComplianceOfficer, ServiceOpsAdmin]
    input: []
    output: DurabilityTestRig
    success_status: 200
    side_effects: []
  - method: POST
    path: /test-runs
    roles: [ProductEngineer]
    input: [model_revision_id, test_rig_id, window_start, window_end, target_cycles]
    output: DurabilityTestRun
    success_status: 201
    side_effects: ["reserves a rig station under the INCLUSIVE overlap geometry of validations[priority=33]; increments rig.occupied_station_count"]
  - method: GET
    path: /test-runs
    roles: [ProductEngineer, ComplianceOfficer, ServiceOpsAdmin]
    input: ["model_revision_id?", "test_rig_id?", "status?", "limit?", "offset?"]
    output: DurabilityTestRun[]
    success_status: 200
    side_effects: []
  - method: GET
    path: /test-runs/{id}
    roles: [ProductEngineer, ComplianceOfficer, ServiceOpsAdmin]
    input: []
    output: DurabilityTestRun
    success_status: 200
    side_effects: []
  - method: POST
    path: /test-runs/{id}/start
    roles: [ProductEngineer]
    input: []
    output: DurabilityTestRun
    success_status: 200
    side_effects: ["RESERVED -> RUNNING; the revision's projected_cycle_count picks up the extrapolated contribution"]
  - method: POST
    path: /test-runs/{id}/complete
    roles: [ProductEngineer]
    input: ["outcome", "achieved_cycles?", "failure_cycle_count?"]
    output: DurabilityTestRun
    success_status: 200
    side_effects: ["RUNNING -> COMPLETED; recomputes both cycle variants; may drive the revision IN_TESTING -> TEST_FAILED"]
  - method: POST
    path: /test-runs/{id}/abort
    roles: [ProductEngineer]
    input: [abort_reason]
    output: DurabilityTestRun
    success_status: 200
    side_effects: ["RESERVED or RUNNING -> ABORTED; frees the rig station"]

  # ---- Firmware -------------------------------------------------------------
  - method: POST
    path: /firmware-releases
    roles: [ProductEngineer]
    input: ["version_string", "console_platform", "mandatory_security?"]
    output: FirmwareRelease
    success_status: 201
    side_effects: []
  - method: GET
    path: /firmware-releases/{id}
    roles: [ProductEngineer, ComplianceOfficer, ServiceOpsAdmin, ServicePartnerTech]
    input: []
    output: FirmwareRelease
    success_status: 200
    side_effects: []
  - method: POST
    path: /firmware-releases/{id}/withdraw
    roles: [ComplianceOfficer]
    input: [withdraw_reason]
    output: FirmwareRelease
    success_status: 200
    side_effects: ["six-level cascade: release -> certifications -> assets -> PM programs -> visits -> partner rollups"]
  - method: POST
    path: /firmware-certifications
    roles: [ProductEngineer, ComplianceOfficer]
    input: [firmware_release_id, model_revision_id, test_report_ref]
    output: FirmwareCertification
    success_status: 201
    side_effects: ["stamps submitted_by_user_id from X-User-ID for the later segregation-of-duties check"]
  - method: GET
    path: /firmware-certifications
    roles: [ProductEngineer, ComplianceOfficer, ServiceOpsAdmin]
    input: ["firmware_release_id?", "model_revision_id?", "cert_status?", "limit?", "offset?"]
    output: FirmwareCertification[]
    success_status: 200
    side_effects: []
  - method: GET
    path: /firmware-certifications/{id}
    roles: [ProductEngineer, ComplianceOfficer, ServiceOpsAdmin]
    input: []
    output: FirmwareCertification
    success_status: 200
    side_effects: []
  - method: POST
    path: /firmware-certifications/{id}/certify
    roles: [ComplianceOfficer]
    input: []
    output: FirmwareCertification
    success_status: 200
    side_effects: ["SUBMITTED -> CERTIFIED; increments the release's certified_revision_count"]
  - method: POST
    path: /firmware-certifications/{id}/reject
    roles: [ComplianceOfficer]
    input: [rejection_note]
    output: FirmwareCertification
    success_status: 200
    side_effects: ["SUBMITTED -> REJECTED"]

  # ---- Facilities -----------------------------------------------------------
  - method: POST
    path: /facilities
    roles: [OrderPlanner, ServiceOpsAdmin]
    input: ["account_name", "freight_zone", "credit_limit_cents", "install_blackout_weekdays?"]
    output: Facility
    success_status: 201
    side_effects: []
  - method: GET
    path: /facilities/{id}
    roles: [OrderPlanner, ComplianceOfficer, ServiceOpsAdmin, FacilityManager, ServicePartnerTech]
    input: []
    output: Facility
    success_status: 200
    side_effects: []
  - method: POST
    path: /facilities/{id}/suspend
    roles: [OrderPlanner, ServiceOpsAdmin]
    input: [suspend_reason]
    output: Facility
    success_status: 200
    side_effects: ["ACTIVE -> SUSPENDED; blocks new orders, lines, quotes, confirmations, activations and resales"]

  # ---- Orders ---------------------------------------------------------------
  - method: POST
    path: /orders
    roles: [OrderPlanner, FacilityManager]
    input: [facility_id, requested_install_window_start, requested_install_window_end]
    output: Order
    success_status: 201
    side_effects: ["all three status dimensions start at CONFIGURING / PENDING / UNQUOTED"]
  - method: GET
    path: /orders
    roles: [OrderPlanner, FacilityManager, ServiceOpsAdmin]
    input: ["facility_id?", "config_status?", "fulfillment_status?", "billing_status?", "limit?", "offset?"]
    output: Order[]
    success_status: 200
    side_effects: []
  - method: GET
    path: /orders/{id}
    roles: [OrderPlanner, FacilityManager, ServiceOpsAdmin]
    input: []
    output: Order
    success_status: 200
    side_effects: []
  - method: POST
    path: /orders/{id}/lines
    roles: [OrderPlanner, FacilityManager]
    input: [model_revision_id, quantity, finish_codes, layout_zone_label]
    output: OrderLine
    success_status: 201
    side_effects: ["prices the line (calculations.order_line_extended_price); recomputes the order's line_subtotal_cents and chargeable_weight_kg; invalidates any existing quote (billing QUOTED -> UNQUOTED)"]
  - method: GET
    path: /order-lines
    roles: [OrderPlanner, FacilityManager, ServiceOpsAdmin]
    input: ["order_id?", "model_revision_id?", "status?", "limit?", "offset?"]
    output: OrderLine[]
    success_status: 200
    side_effects: []
  - method: GET
    path: /order-lines/{id}
    roles: [OrderPlanner, FacilityManager, ServiceOpsAdmin]
    input: []
    output: OrderLine
    success_status: 200
    side_effects: []
  - method: POST
    path: /order-lines/{id}/void
    roles: [OrderPlanner, FacilityManager]
    input: []
    output: OrderLine
    success_status: 200
    side_effects: ["ACTIVE -> VOIDED; recomputes the order's subtotal and weight; invalidates any existing quote"]
  - method: POST
    path: /orders/{id}/quote
    roles: [OrderPlanner]
    input: [expected_order_version]
    output: Order
    success_status: 200
    side_effects: ["OCC on Order.version (§1.2.1 order-requote-against-stale-order); increments Order.version by 1; writes the PROVISIONAL price variant"]
  - method: POST
    path: /orders/{id}/confirm
    roles: [OrderPlanner, FacilityManager]
    input: []
    output: Order
    success_status: 200
    side_effects: ["config CONFIGURING -> CONFIRMED and fulfillment PENDING -> IN_PRODUCTION; recomputes the facility's open_order_exposure_cents"]
  - method: POST
    path: /orders/{id}/production/complete
    roles: [OrderPlanner]
    input: []
    output: Order
    success_status: 200
    side_effects: ["fulfillment IN_PRODUCTION -> STAGED; mints serialized assets with deterministic serial numbers"]
  - method: GET
    path: /orders/{id}/price-breakdown
    roles: [OrderPlanner, FacilityManager, ServiceOpsAdmin]
    input: []
    output: "{ line_subtotal_cents: integer, install_amount_cents: integer, discount_base_cents: integer, volume_discount_cents: integer, discounted_base_cents: integer, chargeable_weight_kg: number, freight_cents: integer, punch_list_credit_cents: integer, quoted_total_cents: integer, final_total_cents: integer, tradein_credit_applied_cents: integer, amount_due_cents: integer, price_variant_applied: string }"
    success_status: 200
    side_effects: ["read-only, step-by-step projection of calculations.order_total_assembly"]
  - method: POST
    path: /orders/{id}/apply-tradein-credit
    roles: [OrderPlanner]
    input: [amount_cents, expected_facility_version]
    output: Order
    success_status: 200
    side_effects: ["OCC on Facility.version (§1.2.1 tradein-credit-apply-against-stale-facility); increments Facility.version by 1; moves credit from the facility ledger onto the order and recomputes amount_due_cents"]
  - method: POST
    path: /orders/{id}/settle
    roles: [OrderPlanner]
    input: [payment_reference]
    output: Order
    success_status: 200
    side_effects: ["billing INVOICED -> SETTLED; releases the facility's credit exposure"]

  # ---- Service network ------------------------------------------------------
  - method: POST
    path: /service-partners
    roles: [ServiceOpsAdmin]
    input: [name, region, certified_categories, certified_technician_count, certified_hours_capacity, training_current_until]
    output: ServicePartner
