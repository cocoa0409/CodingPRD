              captures: { comment_id: "$.data.id" }
          assert:
            - "HTTP 201, PublicComment.relief_plan_id == ${plan_id}, commenter_type == \"BUSINESS\", position == \"SUPPORT_SPLIT\", submitted_at == \"2026-08-11T00:00:00Z\""
            - "GET /numbering/relief-plans/${plan_id} still reads support_overlay_weight == 0.00, support_split_weight == 0.00 and comment_count == 0 - the tally only runs at close"
            - "GET /numbering/relief-plans/${plan_id}/comments returns total_count == 1"

      - name: carrier_representative_cannot_send_approve_on_a_review
        claim_type: Priority conflict
        grounds: ["validations[priority=7]", "validations[priority=2]", "errors[ERR_ACTION_ROLE_MISMATCH]"]
        distinguishing_aspect: "CarrierRepresentative IS on the roles list for the reviews endpoint (it may send WITHDRAW), so the priority-2 role check passes and the priority-7 action check is what rejects action=APPROVE with ERR_ACTION_ROLE_MISMATCH (403) - a coarser role gate would have returned ERR_ROLE_NOT_PERMITTED."
        test_recipe:
          setup: ["Carrier A is licensed and VERIFIED with home_state_code OH and has one PENDING_REVIEW INITIAL request against COLUMBUS, which has no blocks loaded."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
