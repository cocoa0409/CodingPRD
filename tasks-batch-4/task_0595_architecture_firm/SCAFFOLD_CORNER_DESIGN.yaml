      - name: unknown_staff_member_id_in_body_returns_staff_not_found
        claim_type: violation_to_error
        grounds:
          - errors[ERR_STAFF_NOT_FOUND]
          - validations[priority=5]
          - endpoints[POST /expenses]
        distinguishing_aspect: "A body FK that does not resolve is caught at priority 5: POST /expenses with an unknown staff_member_id returns 404 ERR_STAFF_NOT_FOUND even though the project_id is valid."
        test_recipe:
          setup: ["One project exists."]
          setup_api_calls:
            - call: "POST /staff"
              payload: { full_name: "Pat Manager", title: "PROJECT_MANAGER", billing_rate_cents_per_hour: 25000, cost_rate_cents_per_hour: 12000 }
              as: PrincipalArchitect
              as_user_id: "principal-alice"
              captures: { pm_id: $.data.id }
            - call: "POST /projects"
              payload: { project_number: "FKX-001", name: "FK Fort", client_rep_user_id: "client-1", project_manager_staff_id: "${pm_id}", labor_budget_cents: 500000 }
              as: PrincipalArchitect
              as_user_id: "principal-alice"
              captures: { proj: $.data.id }
          trigger:
            - call: "POST /expenses"
              payload: { project_id: "${proj}", staff_member_id: "00000000-0000-4000-8000-0000000000bb", category: "TRAVEL", amount_cents: 5000 }
              as: ProjectManager
              as_user_id: "${pm_id}"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 404"
            - "response data.error_id == ERR_STAFF_NOT_FOUND"
            - "GET /expenses?project_id=${proj} returns 0 rows"

      - name: missing_required_field_on_create_project_returns_invalid_request
        claim_type: violation_to_error
        grounds:
          - errors[ERR_INVALID_REQUEST]
          - validations[priority=4]
          - endpoints[POST /projects]
        distinguishing_aspect: "Omitting labor_budget_cents (a required input with no default) on POST /projects returns 400 ERR_INVALID_REQUEST and creates no row."
        test_recipe:
          setup: ["One staff member exists."]
          setup_api_calls:
            - call: "POST /staff"
              payload: { full_name: "Pat Manager", title: "PROJECT_MANAGER", billing_rate_cents_per_hour: 25000, cost_rate_cents_per_hour: 12000 }
              as: PrincipalArchitect
              as_user_id: "principal-alice"
              captures: { pm_id: $.data.id }
          trigger:
            - call: "POST /projects"
              payload: { project_number: "REQ-001", name: "Missing Budget", client_rep_user_id: "client-1", project_manager_staff_id: "${pm_id}" }
              as: PrincipalArchitect
              as_user_id: "principal-alice"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 400"
            - "response data.error_id == ERR_INVALID_REQUEST"
            - "GET /projects?project_manager_staff_id=${pm_id} returns 0 rows"

      - name: invalid_enum_member_on_create_phase_returns_invalid_request
        claim_type: violation_to_error
        grounds:
          - errors[ERR_INVALID_REQUEST]
          - entities.Phase.fields.phase_code
        distinguishing_aspect: "phase_code accepts only SD, DD, CD and CA; the value \"SDX\" returns 400 ERR_INVALID_REQUEST."
        test_recipe:
          setup: ["One project exists."]
          setup_api_calls:
            - call: "POST /staff"
              payload: { full_name: "Pat Manager", title: "PROJECT_MANAGER", billing_rate_cents_per_hour: 25000, cost_rate_cents_per_hour: 12000 }
              as: PrincipalArchitect
              as_user_id: "principal-alice"
              captures: { pm_id: $.data.id }
            - call: "POST /projects"
              payload: { project_number: "ENM-001", name: "Enum Estate", client_rep_user_id: "client-1", project_manager_staff_id: "${pm_id}", labor_budget_cents: 500000 }
              as: PrincipalArchitect
              as_user_id: "principal-alice"
              captures: { proj: $.data.id }
          trigger:
            - call: "POST /phases"
              payload: { project_id: "${proj}", phase_code: "SDX", weight_bp: 2500, milestone_name: "Bogus", milestone_due_at: "2026-08-01T00:00:00Z" }
              as: ProjectManager
              as_user_id: "${pm_id}"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 400"
            - "response data.error_id == ERR_INVALID_REQUEST"
            - "GET /projects/${proj}/phases returns 0 rows"

      - name: missing_auth_headers_returns_unauthenticated
        claim_type: violation_to_error
        grounds:
          - errors[ERR_UNAUTHENTICATED]
          - validations[priority=1]
        distinguishing_aspect: "A request with no X-User-Role / X-User-ID headers returns 401 ERR_UNAUTHENTICATED, ahead of every other check including existence."
        test_recipe:
          setup: ["Empty database."]
          setup_api_calls: []
          trigger:
            - call: "GET /projects/00000000-0000-4000-8000-000000000000"
              as: PrincipalArchitect
              captures: { err: $.data.error_id }
          assert:
            - "the request is sent with NO X-User-Role and NO X-User-ID header"
            - "HTTP status == 401"
            - "response data.error_id == ERR_UNAUTHENTICATED (not ERR_PROJECT_NOT_FOUND)"

  # =========================================================================
  - section: rbac
    instances:

      - name: staff_architect_cannot_create_a_project_returns_unauthorized
        claim_type: Role Denial
        grounds:
          - roles.StaffArchitect
          - endpoints[POST /projects]
          - errors[ERR_UNAUTHORIZED]
        distinguishing_aspect: "POST /projects lists only PrincipalArchitect; a StaffArchitect calling it gets 403 ERR_UNAUTHORIZED even with a valid X-User-ID."
        test_recipe:
          setup: ["One architect on staff."]
          setup_api_calls:
            - call: "POST /staff"
              payload: { full_name: "Avery Architect", title: "ARCHITECT", billing_rate_cents_per_hour: 12000, cost_rate_cents_per_hour: 5000 }
              as: PrincipalArchitect
              as_user_id: "principal-alice"
              captures: { arch_id: $.data.id }
          trigger:
            - call: "POST /projects"
              payload: { project_number: "RBA-001", name: "Not Allowed", client_rep_user_id: "client-1", project_manager_staff_id: "${arch_id}", labor_budget_cents: 500000 }
              as: StaffArchitect
              as_user_id: "${arch_id}"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 403"
            - "response data.error_id == ERR_UNAUTHORIZED"

      - name: project_manager_cannot_write_to_a_project_they_do_not_manage
        claim_type: peer_roles
        grounds:
          - roles.ProjectManager
          - validations[priority=6]
          - errors[ERR_NOT_PROJECT_MANAGER]
          - entities.Project.fields.project_manager_staff_id
        distinguishing_aspect: "Ownership scoping compares X-User-ID with Project.project_manager_staff_id: a second ProjectManager creating a phase on someone else's project gets 403 ERR_NOT_PROJECT_MANAGER."
        test_recipe:
          setup:
            - "Two staff members with title PROJECT_MANAGER; the project names only the first as project_manager_staff_id."
          setup_api_calls:
            - call: "POST /staff"
              payload: { full_name: "Pat Manager", title: "PROJECT_MANAGER", billing_rate_cents_per_hour: 25000, cost_rate_cents_per_hour: 12000 }
              as: PrincipalArchitect
              as_user_id: "principal-alice"
              captures: { pm1: $.data.id }
            - call: "POST /staff"
              payload: { full_name: "Robin Rival", title: "PROJECT_MANAGER", billing_rate_cents_per_hour: 25000, cost_rate_cents_per_hour: 12000 }
              as: PrincipalArchitect
              as_user_id: "principal-alice"
              captures: { pm2: $.data.id }
            - call: "POST /projects"
              payload: { project_number: "OWN-001", name: "Owned by PM1", client_rep_user_id: "client-1", project_manager_staff_id: "${pm1}", labor_budget_cents: 500000 }
              as: PrincipalArchitect
              as_user_id: "principal-alice"
              captures: { proj: $.data.id }
          trigger:
            - call: "POST /phases"
              payload: { project_id: "${proj}", phase_code: "SD", weight_bp: 2500, milestone_name: "SD", milestone_due_at: "2026-08-01T00:00:00Z" }
              as: ProjectManager
              as_user_id: "${pm2}"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 403"
            - "response data.error_id == ERR_NOT_PROJECT_MANAGER"
            - "GET /projects/${proj}/phases returns 0 rows"

      - name: staff_architect_cannot_log_time_for_another_staff_member
        claim_type: peer_roles
        grounds:
          - roles.StaffArchitect
          - validations[priority=6]
          - errors[ERR_NOT_OWNER]
        distinguishing_aspect: "A StaffArchitect may only create TimeEntries whose staff_member_id equals their own X-User-ID; using a colleague's id gives 403 ERR_NOT_OWNER (whereas the ProjectManager of the project may do it)."
        test_recipe:
          setup:
            - "A project with an SD phase and two architects."
          setup_api_calls:
            - call: "POST /staff"
              payload: { full_name: "Pat Manager", title: "PROJECT_MANAGER", billing_rate_cents_per_hour: 25000, cost_rate_cents_per_hour: 12000 }
              as: PrincipalArchitect
              as_user_id: "principal-alice"
              captures: { pm_id: $.data.id }
            - call: "POST /staff"
              payload: { full_name: "Avery Architect", title: "ARCHITECT", billing_rate_cents_per_hour: 12000, cost_rate_cents_per_hour: 5000 }
              as: PrincipalArchitect
              as_user_id: "principal-alice"
              captures: { a1: $.data.id }
            - call: "POST /staff"
              payload: { full_name: "Blair Builder", title: "DESIGNER", billing_rate_cents_per_hour: 9000, cost_rate_cents_per_hour: 4000 }
              as: PrincipalArchitect
              as_user_id: "principal-alice"
              captures: { a2: $.data.id }
            - call: "POST /projects"
              payload: { project_number: "OWN-002", name: "Own Time Only", client_rep_user_id: "client-1", project_manager_staff_id: "${pm_id}", labor_budget_cents: 10000000 }
              as: PrincipalArchitect
              as_user_id: "principal-alice"
              captures: { proj: $.data.id }
            - call: "POST /phases"
              payload: { project_id: "${proj}", phase_code: "SD", weight_bp: 2500, milestone_name: "SD", milestone_due_at: "2026-08-01T00:00:00Z" }
              as: ProjectManager
              as_user_id: "${pm_id}"
              captures: { sd: $.data.id }
          trigger:
            - call: "POST /time-entries"
              payload: { phase_id: "${sd}", staff_member_id: "${a2}", start_utc: "2026-05-04T09:00:00Z", end_utc: "2026-05-04T17:00:00Z" }
              as: StaffArchitect
              as_user_id: "${a1}"
              captures: { err: $.data.error_id }
            - call: "POST /time-entries"
              payload: { phase_id: "${sd}", staff_member_id: "${a1}", start_utc: "2026-05-04T09:00:00Z", end_utc: "2026-05-04T17:00:00Z" }
              as: StaffArchitect
              as_user_id: "${a1}"
              captures: { te_ok: $.data.id }
          assert:
            - "the cross-staff create returns HTTP 403 with data.error_id == ERR_NOT_OWNER"
            - "the self create returns HTTP 201 with TimeEntry.${te_ok}.staff_member_id == ${a1} and status == DRAFT"

      - name: wrong_client_rep_cannot_decide_a_change_order
        claim_type: peer_roles
        grounds:
          - roles.ClientRep
          - validations[priority=6]
          - errors[ERR_NOT_OWNER]
          - entities.Project.fields.client_rep_user_id
        distinguishing_aspect: "ClientRep is opaque and scoped by Project.client_rep_user_id: a ClientRep whose X-User-ID is \"client-9\" cannot approve a change order on a project owned by \"client-1\" (403 ERR_NOT_OWNER), while \"client-1\" can."
        test_recipe:
          setup:
            - "An executed contract whose Project.client_rep_user_id is \"client-1\", with one SUBMITTED ADDITIONAL_SERVICE change order."
          setup_api_calls:
            - call: "POST /staff"
              payload: { full_name: "Pat Manager", title: "PROJECT_MANAGER", billing_rate_cents_per_hour: 25000, cost_rate_cents_per_hour: 12000 }
              as: PrincipalArchitect
              as_user_id: "principal-alice"
              captures: { pm_id: $.data.id }
            - call: "POST /projects"
              payload: { project_number: "CLI-001", name: "Client Scope", client_rep_user_id: "client-1", project_manager_staff_id: "${pm_id}", labor_budget_cents: 500000 }
              as: PrincipalArchitect
              as_user_id: "principal-alice"
              captures: { proj: $.data.id }
            - call: "POST /contracts"
              payload: { project_id: "${proj}", fee_basis: "PERCENT_OF_CONSTRUCTION", review_clock_basis: "CALENDAR_DAYS", construction_cost_estimate_cents: 100000000, fee_rate_bp: 1000 }
              as: PrincipalArchitect
              as_user_id: "principal-alice"
              captures: { ct: $.data.id }
            - call: "POST /phases"
              payload: { project_id: "${proj}", phase_code: "SD", weight_bp: 2500, milestone_name: "SD", milestone_due_at: "2026-08-01T00:00:00Z" }
              as: ProjectManager
              as_user_id: "${pm_id}"
            - call: "POST /phases"
              payload: { project_id: "${proj}", phase_code: "DD", weight_bp: 2500, milestone_name: "DD", milestone_due_at: "2026-09-01T00:00:00Z" }
              as: ProjectManager
              as_user_id: "${pm_id}"
            - call: "POST /phases"
              payload: { project_id: "${proj}", phase_code: "CD", weight_bp: 2500, milestone_name: "CD", milestone_due_at: "2026-10-01T00:00:00Z" }
              as: ProjectManager
              as_user_id: "${pm_id}"
            - call: "POST /phases"
              payload: { project_id: "${proj}", phase_code: "CA", weight_bp: 2500, milestone_name: "CA", milestone_due_at: "2026-12-01T00:00:00Z" }
              as: ProjectManager
              as_user_id: "${pm_id}"
            - call: "POST /contracts/${ct}/state"
              payload: { to_status: "EXECUTED" }
              as: PrincipalArchitect
              as_user_id: "principal-alice"
            - call: "POST /change-orders"
              payload: { contract_id: "${ct}", title: "Extra survey", co_type: "ADDITIONAL_SERVICE", fee_delta_cents: 1000000 }
              as: ProjectManager
              as_user_id: "${pm_id}"
              captures: { co: $.data.id }
            - call: "POST /change-orders/${co}/state"
              payload: { to_status: "SUBMITTED" }
              as: ProjectManager
              as_user_id: "${pm_id}"
          trigger:
            - call: "POST /change-orders/${co}/state"
              payload: { to_status: "CLIENT_APPROVED" }
              as: ClientRep
              as_user_id: "client-9"
              captures: { err: $.data.error_id }
            - call: "POST /change-orders/${co}/state"
              payload: { to_status: "CLIENT_APPROVED" }
              as: ClientRep
              as_user_id: "client-1"
          assert:
            - "the client-9 decision returns HTTP 403 with data.error_id == ERR_NOT_OWNER and ChangeOrder.${co}.status stays SUBMITTED"
            - "the client-1 decision returns HTTP 200 with ChangeOrder.${co}.status == CLIENT_APPROVED"
            - "Contract.${ct}.total_fee_cents == 10000000 (approval alone changes no fee)"

      - name: project_manager_cannot_approve_their_own_time_entry
        claim_type: Segregation of duties
        grounds:
          - validations[priority=7]
          - errors[ERR_SEGREGATION_OF_DUTIES]
          - state_machines.TimeEntry.SUBMITTED_to_APPROVED
        distinguishing_aspect: "The approver's X-User-ID must differ from TimeEntry.staff_member_id: the ProjectManager approving their OWN entry gets 403 ERR_SEGREGATION_OF_DUTIES, and only the opaque PrincipalArchitect can approve it."
        test_recipe:
          setup:
            - "A project whose PM has logged and submitted a 4.0-hour entry against themselves (cost_rate 12000 -> cost 48000)."
          setup_api_calls:
            - call: "POST /staff"
              payload: { full_name: "Pat Manager", title: "PROJECT_MANAGER", billing_rate_cents_per_hour: 25000, cost_rate_cents_per_hour: 12000 }
              as: PrincipalArchitect
              as_user_id: "principal-alice"
              captures: { pm_id: $.data.id }
            - call: "POST /projects"
              payload: { project_number: "SOD-001", name: "Duties Divided", client_rep_user_id: "client-1", project_manager_staff_id: "${pm_id}", labor_budget_cents: 10000000 }
              as: PrincipalArchitect
              as_user_id: "principal-alice"
              captures: { proj: $.data.id }
            - call: "POST /phases"
              payload: { project_id: "${proj}", phase_code: "SD", weight_bp: 2500, milestone_name: "SD", milestone_due_at: "2026-08-01T00:00:00Z" }
              as: ProjectManager
              as_user_id: "${pm_id}"
              captures: { sd: $.data.id }
            - call: "POST /time-entries"
              payload: { phase_id: "${sd}", staff_member_id: "${pm_id}", start_utc: "2026-05-04T09:00:00Z", end_utc: "2026-05-04T13:00:00Z" }
              as: ProjectManager
              as_user_id: "${pm_id}"
              captures: { te: $.data.id }
            - call: "POST /time-entries/${te}/state"
              payload: { to_status: "SUBMITTED" }
              as: ProjectManager
              as_user_id: "${pm_id}"
          trigger:
            - call: "POST /time-entries/${te}/state"
              payload: { to_status: "APPROVED" }
              as: ProjectManager
              as_user_id: "${pm_id}"
              captures: { err: $.data.error_id }
            - call: "POST /time-entries/${te}/state"
              payload: { to_status: "APPROVED" }
              as: PrincipalArchitect
              as_user_id: "principal-alice"
          assert:
            - "the self-approval returns HTTP 403 with data.error_id == ERR_SEGREGATION_OF_DUTIES and TimeEntry.${te}.status stays SUBMITTED"
            - "the principal's approval returns HTTP 200 with TimeEntry.${te}.status == APPROVED and approved_by_user_id == \"principal-alice\""
            - "TimeEntry.${te}.hours == 4.0 and TimeEntry.${te}.cost_cents == 48000"
            - "Project.${proj}.approved_hours == 4.0 and Project.${proj}.labor_cost_cents == 48000"

      - name: change_order_submitter_cannot_execute_it
        claim_type: Segregation of duties
        grounds:
          - validations[priority=7]
          - errors[ERR_SEGREGATION_OF_DUTIES]
          - state_machines.ChangeOrder.CLIENT_APPROVED_to_EXECUTED
          - entities.ChangeOrder.fields.submitted_by_user_id
        distinguishing_aspect: "The executor's X-User-ID must differ from ChangeOrder.submitted_by_user_id: \"principal-alice\", who submitted the order, is refused with 403 ERR_SEGREGATION_OF_DUTIES, while \"principal-bob\" executes it successfully."
        test_recipe:
          setup:
