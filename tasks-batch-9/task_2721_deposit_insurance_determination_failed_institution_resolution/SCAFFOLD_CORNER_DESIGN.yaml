          - validations[priority=68]
        excluded_because:
          difficulty_instance: bid_deadline_temporal_error_outranks_bidder_qualification
          rationale: "§1.8 already submits one bid that violates both the priority-64 deadline rule and the priority-68 qualification rule and asserts ERR_BID_WINDOW_CLOSED, then rewinds the scenario so only the qualification rule is broken and asserts ERR_BIDDER_NOT_QUALIFIED."

  - section: endpoints
    coverage_note: |
      Table 5 rows exercised here: the two heaviest list endpoints (filter composition plus
      limit/offset pagination), the many-to-many junction read from both sides, the two action
      endpoints whose side effects are not asserted anywhere else (bid withdraw freeing its
      data-room interval, branch reschedule counting loops), and the computed read
      GET /institutions/{id}/insurance-summary. Action endpoints that only drive a state
      machine are already covered by the state_machines and validations sections above.
    instances:
      - name: institution_listing_composes_filters_with_limit_and_offset_pagination
        claim_type: standard_crud
        grounds:
          - endpoints[GET /institutions]
          - response_envelope.pagination_fields
          - response_envelope.pagination_defaults
        distinguishing_aspect: "status and charter_state filters intersect rather than replace each other, total_count always reports the filtered population (not the page), and has_more is driven by offset + returned < total_count: with 4 institutions the default page returns all 4 with has_more false, while limit=2 offset=2 returns the tail page with has_more false and total_count still 4."
        test_recipe:
          setup:
            - "four institutions exist: 61066 (DE), 61067 (DE), 61068 (NY), 61069 (NY), all created in this order so the default ordering is stable."
            - "61066 also received one readiness submission, so its status is READINESS_COLLECTION while the other three are still PRE_FAILURE_MONITORING."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T09:00:00Z" }
              as: ClosingManager
            - call: "POST /institutions"
              payload: { cert_number: "61066", legal_name: "Page One Bank", charter_state: "DE", book_asset_value_cents: 5000000, estimated_liquidation_recovery_cents: 2000000 }
              as: ClosingManager
              captures: { pg_a: $.data.id }
            - call: "POST /institutions"
              payload: { cert_number: "61067", legal_name: "Page Two Bank", charter_state: "DE", book_asset_value_cents: 5000000, estimated_liquidation_recovery_cents: 2000000 }
              as: ClosingManager
              captures: { pg_b: $.data.id }
            - call: "POST /institutions"
              payload: { cert_number: "61068", legal_name: "Page Three Bank", charter_state: "NY", book_asset_value_cents: 5000000, estimated_liquidation_recovery_cents: 2000000 }
              as: ClosingManager
              captures: { pg_c: $.data.id }
            - call: "POST /institutions"
              payload: { cert_number: "61069", legal_name: "Page Four Bank", charter_state: "NY", book_asset_value_cents: 5000000, estimated_liquidation_recovery_cents: 2000000 }
              as: ClosingManager
              captures: { pg_d: $.data.id }
            - call: "POST /institutions/${pg_a}/readiness-submissions"
              payload: { file_format: "FDIC_STANDARD_V2", record_count: 1, malformed_record_count: 0, reported_deposit_total_cents: 0 }
              as: ClosingManager
          trigger:
            - call: "GET /institutions"
              as: ClosingManager
            - call: "GET /institutions"
              payload: { status: "PRE_FAILURE_MONITORING" }
              as: ClosingManager
            - call: "GET /institutions"
              payload: { charter_state: "DE" }
              as: ClosingManager
            - call: "GET /institutions"
              payload: { charter_state: "DE", status: "READINESS_COLLECTION" }
              as: ClosingManager
            - call: "GET /institutions"
              payload: { limit: 2, offset: 0 }
              as: ClosingManager
            - call: "GET /institutions"
              payload: { limit: 2, offset: 2 }
              as: ClosingManager
            - call: "GET /institutions"
              payload: { charter_state: "NY", limit: 1, offset: 0 }
              as: ClosingManager
            - call: "GET /institutions"
              payload: { charter_state: "AK" }
              as: ClosingManager
          assert:
            - "trigger[0]: 4 rows returned, total_count == 4, limit == 10 (default), offset == 0, has_more == false"
            - "trigger[1]: 3 rows returned, total_count == 3 — 61066 is filtered out by status"
            - "trigger[2]: 2 rows returned, total_count == 2"
            - "trigger[3]: 1 row returned, total_count == 1, that row's cert_number == '61066' — the two filters intersect"
            - "trigger[4]: 2 rows returned, total_count == 4, has_more == true"
            - "trigger[5]: 2 rows returned, total_count == 4, has_more == false, and the two ids are disjoint from trigger[4]'s ids"
            - "trigger[6]: 1 row returned, total_count == 2, has_more == true — total_count reflects the filtered population, not the page"
            - "trigger[7]: 0 rows returned, total_count == 0, has_more == false"

      - name: deposit_account_listing_filters_across_the_three_independent_status_dimensions
        claim_type: standard_crud
        grounds:
          - endpoints[GET /deposit-accounts]
          - entities.DepositAccount.fields.insurance_status
          - entities.DepositAccount.fields.hold_status
        distinguishing_aspect: "The three status dimensions are independent filter axes on the same collection: certifying only Gita's determination leaves her account insurance_status DETERMINED / hold_status HELD while Hikaru's stays PENDING / NONE, so insurance_status, hold_status, primary_depositor_id and ownership_category each select a different subset of the same two rows and a filter on an unused enum member returns an empty page rather than an error."
        test_recipe:
          setup:
            - "Institution 61070 is CLOSED_IN_RECEIVERSHIP with two depositors: Gita (account AC-0001, SINGLE, 30000000) and Hikaru (account AC-0002, SINGLE, 5000000); the readiness submission reported 35000000 over 2 records."
            - "Gita's determination was prepared with AGGREGATE_BY_CATEGORY and certified: insured min(30000000, 25000000) = 25000000, uninsured 5000000, so AC-0001 is insurance_status DETERMINED, hold_status HELD, held_amount_cents 5000000."
            - "Hikaru's accounts were never determined, so AC-0002 is insurance_status PENDING, hold_status NONE, held_amount_cents 0."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T09:00:00Z" }
