            - call: "POST /car-share/members/{id}/application-decision"
              payload: { decision: "APPROVE" }
              as: PodOperator
          trigger:
            - call: "POST /car-share/memberships"
              payload: { member_id: "${m_rb_id}", department_code: "OPS", tier: "PLUS", primary_flag: false }
              as: PodOperator
              captures: { err_rbac2: $.data.error_id }
          assert:
            - "${err_rbac2} == \"ERR_FORBIDDEN\""
            - "GET /car-share/members/${m_rb_id}/memberships returns exactly 1 row"

      - name: party_split_denied_to_anonymous_caller
        claim_type: rbac_denial
        grounds:
          - roles.Anonymous
          - errors[ERR_UNAUTHENTICATED]
          - endpoints.POST /car-share/incidents/{id}/party-split
        distinguishing_aspect: "A party split issued without a role header is refused with ERR_UNAUTHENTICATED, which precedes the segregation-of-duties check."
        test_recipe:
          setup: ["One approved member with an ACTIVE membership, a CONFIRMED reservation and an OPEN DAMAGE incident"]
          setup_api_calls:
            - call: "POST /car-share/member-registrations"
              payload: { full_name: "Auth Split", email: "auth.split@x.com", kind: "INDIVIDUAL" }
              as: Anonymous
              captures: { m_auth_id: $.data.id }
            - call: "POST /car-share/members/{id}/driving-record-reports"
              payload: { license_state: "CA", license_years_held: 5 }
              as: Member
              as_user_id: "${m_auth_id}"
            - call: "POST /car-share/driving-record-reports/{id}/decision"
              payload: { report_decision: "CLEAR" }
              as: PodOperator
            - call: "POST /car-share/members/{id}/application-decision"
              payload: { decision: "APPROVE" }
              as: PodOperator
            - call: "POST /car-share/pods"
              payload: { name: "Auth Lot", site_type: "CAMPUS", capacity: 3, fuel_floor_pct: 20 }
              as: FleetAdmin
              captures: { pod_auth_id: $.data.id }
            - call: "POST /car-share/vehicles"
              payload: { pod_id: "${pod_auth_id}", vin: "VIN3160U1", model: "Altroz", capacity_seats: 5, next_service_miles: 49000 }
              as: FleetAdmin
              captures: { veh_cu1_id: $.data.id, veh_cu1_ver: $.data.version }
            - call: "POST /car-share/reservations"
              payload: { member_id: "${m_auth_id}", pod_id: "${pod_auth_id}", vehicle_id: "${veh_cu1_id}", start_at: "2026-09-05T09:00:00Z", end_at: "2026-09-05T13:00:00Z", reserved_hours: 4, expected_vehicle_version: "${veh_cu1_ver}" }
              as: Member
              as_user_id: "${m_auth_id}"
              captures: { res_cu1_id: $.data.id }
            - call: "POST /car-share/incidents"
              payload: { reservation_id: "${res_cu1_id}", vehicle_id: "${veh_cu1_id}", member_id: "${m_auth_id}", incident_type: "DAMAGE", repair_cost_cents: 4000 }
              as: PodOperator
              captures: { inc_cu1_id: $.data.id, inc_cu1_ver: $.data.version }
          trigger:
            - call: "POST /car-share/incidents/{id}/party-split"
              payload: { expected_incident_version: "${inc_cu1_ver}" }
              as: Anonymous
              captures: { err_auth1: $.data.error_id }
          assert:
            - "${err_auth1} == \"ERR_UNAUTHENTICATED\""
            - "Incident.${inc_cu1_id}.status == OPEN"

      - name: member_cannot_return_another_members_reservation
        claim_type: rbac_denial
        grounds:
          - roles.Member
          - validations[priority=2]
          - errors[ERR_FORBIDDEN]
