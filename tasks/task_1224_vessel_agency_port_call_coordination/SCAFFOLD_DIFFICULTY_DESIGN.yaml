  - rule_id: priority_pair_validation_conflict
    instances:
      - name: sailing_state_vs_funding_priority
        grounds:
          - validations[priority=6]
          - validations[priority=11]
        distinguishing_aspect: |
          Category pair (state, business_fiscal): record-sailing on a NOMINATED call whose DA would also fail the
          funding gate returns ERR_INVALID_STATE (priority 6), never ERR_FUNDING_SHORTFALL (priority 11).
        test_recipe:
          setup:
            - "Call NOMINATED; DA PRO_FORMA with no advances (would be short if evaluated); one REQUESTED berth window of this call"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: AgencyAdmin }
            - { call: "POST /principals", payload: { name: "Apex Shipping", contact_email: "ops@apex.example", credit_limit_cents: 0 }, as: AgencyAdmin, captures: { p_id: "$.data.id" } }
            - { call: "POST /port-calls", payload: { principal_id: "${p_id}", vessel_name: "SS Rye", imo_number: "9000020", vessel_gt: 5000, flag_state: "PA", port_code: "NODUE", eta: "2026-06-10T20:00:00Z", etd: "2026-06-13T01:00:00Z", cargo_description: "general" }, as: AgencyOps, as_user_id: "ops-1", captures: { pc_id: "$.data.id", pc_v: "$.data.version" } }
            - { call: "POST /disbursement-accounts", payload: { port_call_id: "${pc_id}", expected_port_call_version: "${pc_v}" }, as: AgencyOps, as_user_id: "ops-1", captures: { da_id: "$.data.id" } }
            - { call: "POST /berth-windows", payload: { port_call_id: "${pc_id}", berth_code: "B4", start_at: "2026-06-10T18:00:00Z", end_at: "2026-06-14T06:00:00Z" }, as: AgencyOps, captures: { bw_id: "$.data.id" } }
          trigger:
            - { call: "POST /port-calls/${pc_id}/record-sailing", payload: { berth_window_id: "${bw_id}" }, as: AgencyOps, captures: { err: "$.data.error_id" } }
          assert:
            - "error_id == ERR_INVALID_STATE with http 409 (state precedes fiscal)"
            - "PortCall.${pc_id}.ops_status still NOMINATED; DisbursementAccount.${da_id}.status still PRO_FORMA; no side effects fired"
