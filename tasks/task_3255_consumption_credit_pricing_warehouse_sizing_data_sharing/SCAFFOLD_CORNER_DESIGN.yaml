  - section: rbac
    instances:
      - name: data_engineer_cannot_publish_a_share
        claim_type: exclusive_operation_denial
        grounds:
          - roles.DataEngineer
          - roles.ShareAdmin
          - errors[ERR_FORBIDDEN_ROLE]
        distinguishing_aspect: "Publishing is exclusive to the share admin role, so the engineering role's attempt is a 403 even though it may create the share's consumers' usage events."
        test_recipe:
          setup: ["one DRAFT share"]
          setup_api_calls:
            - call: "POST /v1/accounts"
              payload: { org_name: "Rbac Publish P", account_locator: "rp5001", cloud_provider: "SAME_CLOUD", region: "us-east-1", monitor_scope: "ACCOUNT_ONLY" }
              as: PlatformOperator
              captures: { acct_rp2: $.data.id }
            - call: "POST /v1/accounts"
              payload: { org_name: "Rbac Publish C", account_locator: "rp5002", cloud_provider: "SAME_CLOUD", region: "us-east-1", monitor_scope: "ACCOUNT_ONLY" }
              as: PlatformOperator
              captures: { acct_rpc: $.data.id }
            - call: "POST /v1/data-shares"
              payload: { provider_account_id: "${acct_rp2}", name: "SHARE_RB", objects_exposed: 2, consumer_account_ids: ["${acct_rpc}"] }
              as: ShareAdmin
              as_user_id: "${acct_rp2}"
              captures: { share_rb: $.data.id }
          trigger:
            - call: "POST /v1/data-shares/${share_rb}/publish"
              payload: {}
              as: DataEngineer
              captures: { err_rb: $.data.error_id }
          assert:
            - "${err_rb} == ERR_FORBIDDEN_ROLE"
            - "DataShare.${share_rb}.status == DRAFT and no publish happened"
            - "the same call as ShareAdmin succeeds, isolating the role as the cause"
      - name: finance_controller_cannot_create_a_warehouse
        claim_type: exclusive_operation_denial
        grounds:
          - roles.FinanceController
          - errors[ERR_FORBIDDEN_ROLE]
        distinguishing_aspect: "Warehouse creation is exclusive to the engineering role, so the finance role that may activate contracts and reset monitors cannot provision the warehouse those artefacts govern."
        test_recipe:
          setup: ["one account"]
