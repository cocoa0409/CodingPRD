  - section: endpoints
    instances:
      - name: response_envelope_success_and_error_shape
        claim_type: envelope
        grounds: [response_envelope]
        distinguishing_aspect: "A success body wraps data with meta.api_request_id + response_type object; an error body has response_type error and data.error_id/data.message."
        test_recipe:
          setup: ["One taxpayer exists"]
          setup_api_calls:
            - { call: "POST /identity-protection/taxpayers", payload: { tin: "100000160", full_name: "Env Elope", date_of_birth: "1980-01-01" }, as: SystemAdmin, captures: { tp: $.data.id } }
          trigger:
            - { call: "GET /identity-protection/taxpayers/${tp}", payload: {}, as: SystemAdmin, captures: { okId: $.data.id } }
            - { call: "GET /identity-protection/taxpayers/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2", payload: {}, as: SystemAdmin, captures: { err: $.data.error_id } }
          assert:
            - "success response: response_type == object, meta.api_request_id present, data.id == captured tp"
            - "error response: response_type == error, captured err == ERR_TAXPAYER_NOT_FOUND, data.message present"
