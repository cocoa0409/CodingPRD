# =============================================================================
# 1.8 Scaffold Difficulty Design (Test Targeting Index)
# task_2664_gluten_free_certification_facility_audit
#
# Nine Difficulty Rules x 2 instances = 18 instances. Every instance grounds in
# SCAFFOLD.yaml 1.1-1.7 only; every numeric assert below was computed by executing the
# declared formula against its declared constants. The logical clock starts at
# 2026-08-01T00:00:00Z (see POST /gfco/_clock/set_current_utc) and every chain moves it
# explicitly.
#
# Canonical actor ids used throughout:
#   rev-1 / rev-2  CertificationReviewer     dm-1 / dm-2  CertificationDecisionMaker
#   aud-1 / aud-2  FieldAuditor              lab-1        LabTechnician
#   ProgramAdministrator calls omit as_user_id; ApplicantContact always passes
#   as_user_id: "${app_id}" because its identity is entity_backed:Applicant.
# =============================================================================
scaffold_difficulty_design:

  - rule_id: dual_variant_calc
    instances:
      - name: audit_score_provisional_frozen_vs_final_recomputed_after_ca_verification
        grounds:
          - calculations.audit_compliance_score
          - entities.Audit.fields.provisional_score
          - entities.Audit.fields.final_score
          - entities.Nonconformance.fields.ca_verified
          - state_machines.Audit.IN_PROGRESS_to_CLOSED_CONDITIONAL
          - state_machines.Nonconformance.CA_ACCEPTED_to_CLOSED
        distinguishing_aspect: |
          The two variants live on the Audit domain: PROVISIONAL_ONSITE is frozen at close and
          selects the outcome branch, while FINAL_ADJUDICATED is recomputed after close and halves
          the deduction of every ca_verified finding, so the same audit reads provisional_score ==
          86 and final_score == 92 simultaneously while status stays CLOSED_CONDITIONAL.
        test_recipe:
          setup:
            - "One applicant with one facility whose sanitation validation is current (swab 4.0 ppm on 2026-08-03, so sanitation_expires_on is 2027-08-03)."
            - "One INITIAL audit occupying [2026-08-10T08:00:00Z, 2026-08-10T16:00:00Z) on that facility, started at 09:00 and closed at 17:00."
            - "Two nonconformances raised at 2026-08-10T09:00:00Z against that audit: MAJOR/SHARED_EQUIPMENT and MINOR/DOCUMENTATION; both created before onsite_end_at so both are inside the PROVISIONAL_ONSITE population."
            - "The MAJOR finding has an accepted corrective action plan awaiting on-site effectiveness verification."
          setup_api_calls:
            - call: "POST /gfco/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T00:00:00Z" }
              as: ProgramAdministrator
            - call: "POST /gfco/applicants"
              payload: { legal_name: "Northgate Bakehouse Ltd", contact_email: "qa@northgate.example", country_code: "US" }
              as: ProgramAdministrator
              captures: { app_id: $.data.id }
            - call: "POST /gfco/facilities"
              payload: { applicant_id: "${app_id}", site_name: "Plant 4", air_handling_class: "FILTERED_ZONED", shared_equipment_present: true, gluten_containing_operations: "ADJACENT_LINES" }
              as: ApplicantContact
              as_user_id: "${app_id}"
              captures: { fac_id: $.data.id }
            - call: "POST /gfco/facilities/${fac_id}/sanitation-validation"
              payload: { swab_ppm: 4.0, method: "R5_ELISA", validated_on: "2026-08-03T00:00:00Z" }
              as: FieldAuditor
              as_user_id: "aud-1"
            - call: "POST /gfco/audits"
              payload: { facility_id: "${fac_id}", audit_type: "INITIAL", onsite_start_at: "2026-08-10T08:00:00Z", onsite_end_at: "2026-08-10T16:00:00Z" }
              as: FieldAuditor
              as_user_id: "aud-1"
              captures: { aud_id: $.data.id }
            - call: "POST /gfco/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T09:00:00Z" }
              as: ProgramAdministrator
            - call: "POST /gfco/audits/${aud_id}/start"
              payload: {}
              as: FieldAuditor
              as_user_id: "aud-1"
            - call: "POST /gfco/nonconformances"
              payload: { applicant_id: "${app_id}", source_type: "AUDIT", audit_id: "${aud_id}", category: "SHARED_EQUIPMENT", severity: "MAJOR", description: "Changeover wipe-down record incomplete on shared sheeter." }
              as: FieldAuditor
              as_user_id: "aud-1"
              captures: { nc_major_id: $.data.id, nc_major_v: $.data.version }
            - call: "POST /gfco/nonconformances"
              payload: { applicant_id: "${app_id}", source_type: "AUDIT", audit_id: "${aud_id}", category: "DOCUMENTATION", severity: "MINOR", description: "Training log missing two signatures." }
              as: FieldAuditor
              as_user_id: "aud-1"
              captures: { nc_minor_id: $.data.id }
            - call: "POST /gfco/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T17:00:00Z" }
              as: ProgramAdministrator
            - call: "POST /gfco/audits/${aud_id}/close"
              payload: { shared_equipment_verified: true, air_handling_verified: true, sanitation_validation_reviewed: true }
              as: FieldAuditor
              as_user_id: "aud-1"
            - call: "POST /gfco/nonconformances/${nc_major_id}/corrective-action-plan"
              payload: { expected_nonconformance_version: "${nc_major_v}", ca_plan_text: "Dedicated sheeter changeover SOP plus verification swab per changeover." }
              as: ApplicantContact
              as_user_id: "${app_id}"
            - call: "POST /gfco/nonconformances/${nc_major_id}/corrective-action-decision"
              payload: { decision: "ACCEPT" }
              as: CertificationReviewer
              as_user_id: "rev-1"
          trigger:
            - call: "POST /gfco/nonconformances/${nc_major_id}/verification"
              payload: { effectiveness_confirmed: true }
              as: FieldAuditor
              as_user_id: "aud-1"
          assert:
            - "Audit.${aud_id}.status == \"CLOSED_CONDITIONAL\""
            - "Audit.${aud_id}.provisional_score == 86"
            - "Audit.${aud_id}.final_score == 92"
            - "Audit.${aud_id}.finding_count == 2"
            - "Audit.${aud_id}.critical_finding_count == 0"
            - "Nonconformance.${nc_major_id}.status == \"CLOSED\""
            - "Nonconformance.${nc_major_id}.ca_verified == true"
            - "Nonconformance.${nc_minor_id}.status == \"OPEN\""
            - "Applicant.${app_id}.open_nc_penalty_points == 2"

      - name: applicant_posture_rolling_window_vs_certification_cycle_window
        grounds:
          - calculations.applicant_compliance_posture
          - entities.Applicant.fields.posture_score_rolling_12m
          - entities.Applicant.fields.posture_score_cycle
          - entities.Applicant.fields.current_cycle_started_on
          - entities.Applicant.fields.substantiated_complaint_count_cycle
          - state_machines.ConsumerComplaint.INVESTIGATING_to_SUBSTANTIATED
          - state_machines.Nonconformance.OPEN_to_ESCALATED
        distinguishing_aspect: |
          The two variants live on the Applicant domain and differ only in their window: at clock
          2027-10-01 the rolling window [2026-10-01, 2027-10-01] has forgotten both the 2026-09-05
          nonconformance and the 2026-09-05 substantiated complaint, so posture_score_rolling_12m
          == 100 while the certification cycle that opened at issuance still counts them and
          posture_score_cycle == 77, which is the figure that drives compliance_posture to WATCH.
        test_recipe:
          setup:
            - "The canonical certified product: applicant, facility (shared equipment, ADJACENT_LINES, sanitation validated 2026-08-03), one INHERENTLY_GF ingredient with a verified ALLERGEN_STATEMENT, one product at 40 pct inclusion with threshold_ppm 10, an INITIAL audit closed CLOSED_PASS, and a certificate issued at 2026-08-11T00:00:00Z, so current_cycle_started_on is 2026-08-11T00:00:00Z."
            - "A MILD consumer complaint reported at 2026-09-05T00:00:00Z, triaged (no lot tests exist so recall_action is ADVISORY_ONLY), substantiated, and its complaint-sourced MAJOR nonconformance carried all the way to CLOSED so it contributes no penalty points."
            - "A separate MAJOR audit-sourced nonconformance raised at 2026-09-05T00:00:00Z with no certificate_id, left OPEN with ca_due_on 2026-10-05T00:00:00Z."
            - "The clock is moved to 2027-10-01T00:00:00Z, which is inside the certificate's 60-day surveillance grace window (surveillance_due_on 2027-08-11, grace end 2027-10-10)."
          setup_api_calls:
            - call: "POST /gfco/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T00:00:00Z" }
              as: ProgramAdministrator
            - call: "POST /gfco/applicants"
              payload: { legal_name: "Northgate Bakehouse Ltd", contact_email: "qa@northgate.example", country_code: "US" }
              as: ProgramAdministrator
              captures: { app_id: $.data.id }
            - call: "POST /gfco/facilities"
              payload: { applicant_id: "${app_id}", site_name: "Plant 4", air_handling_class: "FILTERED_ZONED", shared_equipment_present: true, gluten_containing_operations: "ADJACENT_LINES" }
              as: ApplicantContact
              as_user_id: "${app_id}"
              captures: { fac_id: $.data.id }
            - call: "POST /gfco/facilities/${fac_id}/sanitation-validation"
              payload: { swab_ppm: 4.0, method: "R5_ELISA", validated_on: "2026-08-03T00:00:00Z" }
              as: FieldAuditor
              as_user_id: "aud-1"
            - call: "POST /gfco/suppliers"
              payload: { name: "Prairie Mills", country_code: "CA", gluten_handling_disclosed: false }
              as: ProgramAdministrator
              captures: { sup_id: $.data.id }
            - call: "POST /gfco/ingredients"
              payload: { applicant_id: "${app_id}", supplier_id: "${sup_id}", name: "Brown Rice Flour", risk_class: "INHERENTLY_GF" }
              as: ApplicantContact
              as_user_id: "${app_id}"
              captures: { ing_id: $.data.id }
            - call: "POST /gfco/supplier-documents"
              payload: { supplier_id: "${sup_id}", ingredient_id: "${ing_id}", doc_type: "ALLERGEN_STATEMENT", issued_on: "2026-07-01T00:00:00Z", expires_on: "2028-07-01T00:00:00Z" }
              as: ApplicantContact
              as_user_id: "${app_id}"
              captures: { doc_id: $.data.id }
            - call: "POST /gfco/supplier-documents/${doc_id}/verification"
              payload: { decision: "APPROVE" }
              as: CertificationReviewer
              as_user_id: "rev-1"
            - call: "POST /gfco/ingredients/${ing_id}/submission"
              payload: {}
              as: ApplicantContact
              as_user_id: "${app_id}"
            - call: "POST /gfco/ingredients/${ing_id}/review"
              payload: { decision: "APPROVE" }
              as: CertificationReviewer
              as_user_id: "rev-1"
            - call: "POST /gfco/products"
              payload: { applicant_id: "${app_id}", facility_id: "${fac_id}", name: "Rice Sandwich Loaf", sku: "RSL-001", requested_mark_tier: "STANDARD" }
              as: ApplicantContact
              as_user_id: "${app_id}"
              captures: { prod_id: $.data.id }
            - call: "POST /gfco/product-ingredients"
              payload: { product_id: "${prod_id}", ingredient_id: "${ing_id}", inclusion_pct: 40 }
              as: ApplicantContact
              as_user_id: "${app_id}"
            - call: "POST /gfco/products/${prod_id}/formula-review"
              payload: { decision: "CLEAR" }
              as: CertificationReviewer
              as_user_id: "rev-1"
              captures: { prod_v1: $.data.version }
            - call: "POST /gfco/products/${prod_id}/testing-plan"
              payload: { expected_product_version: "${prod_v1}" }
              as: CertificationReviewer
              as_user_id: "rev-1"
            - call: "POST /gfco/products/${prod_id}/label-review"
              payload: { decision: "APPROVE", mark_tier_granted: "STANDARD" }
              as: CertificationReviewer
              as_user_id: "rev-1"
              captures: { prod_v3: $.data.version }
            - call: "POST /gfco/audits"
              payload: { facility_id: "${fac_id}", audit_type: "INITIAL", onsite_start_at: "2026-08-10T08:00:00Z", onsite_end_at: "2026-08-10T16:00:00Z" }
              as: FieldAuditor
              as_user_id: "aud-1"
              captures: { aud_id: $.data.id }
            - call: "POST /gfco/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T09:00:00Z" }
              as: ProgramAdministrator
            - call: "POST /gfco/audits/${aud_id}/start"
              payload: {}
              as: FieldAuditor
              as_user_id: "aud-1"
            - call: "POST /gfco/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T17:00:00Z" }
              as: ProgramAdministrator
            - call: "POST /gfco/audits/${aud_id}/close"
              payload: { shared_equipment_verified: true, air_handling_verified: true, sanitation_validation_reviewed: true }
              as: FieldAuditor
              as_user_id: "aud-1"
            - call: "POST /gfco/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-11T00:00:00Z" }
              as: ProgramAdministrator
            - call: "POST /gfco/certificates"
              payload: { product_id: "${prod_id}", expected_product_version: "${prod_v3}" }
              as: CertificationDecisionMaker
              as_user_id: "dm-1"
              captures: { cert_id: $.data.id }
            - call: "POST /gfco/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-05T00:00:00Z" }
              as: ProgramAdministrator
            - call: "POST /gfco/consumer-complaints"
              payload: { certificate_id: "${cert_id}", exposure_date: "2026-09-01T00:00:00Z", symptom_severity: "MILD" }
              as: ProgramAdministrator
              captures: { cx_id: $.data.id }
            - call: "POST /gfco/consumer-complaints/${cx_id}/triage"
              payload: {}
              as: CertificationReviewer
              as_user_id: "rev-1"
            - call: "POST /gfco/consumer-complaints/${cx_id}/investigation-outcome"
              payload: { outcome: "SUBSTANTIATED", outcome_evidence: "CROSS_CONTACT" }
              as: CertificationReviewer
              as_user_id: "rev-1"
            - call: "GET /gfco/nonconformances"
              payload: { complaint_id: "${cx_id}" }
              as: ProgramAdministrator
              captures: { nc_cx_id: "$.data[0].id", nc_cx_v: "$.data[0].version" }
            - call: "POST /gfco/nonconformances/${nc_cx_id}/corrective-action-plan"
              payload: { expected_nonconformance_version: "${nc_cx_v}", ca_plan_text: "Segregate the packaging line and retrain on allergen changeover." }
              as: ApplicantContact
              as_user_id: "${app_id}"
            - call: "POST /gfco/nonconformances/${nc_cx_id}/corrective-action-decision"
              payload: { decision: "ACCEPT" }
              as: CertificationReviewer
              as_user_id: "rev-2"
            - call: "POST /gfco/nonconformances/${nc_cx_id}/verification"
              payload: { effectiveness_confirmed: true }
              as: FieldAuditor
              as_user_id: "aud-1"
            - call: "POST /gfco/nonconformances"
              payload: { applicant_id: "${app_id}", source_type: "AUDIT", audit_id: "${aud_id}", category: "SANITATION", severity: "MAJOR", description: "Post-sanitation swab records not retained for two shifts." }
              as: FieldAuditor
              as_user_id: "aud-1"
              captures: { nc_open_id: $.data.id }
            - call: "POST /gfco/_clock/set_current_utc"
              payload: { to_iso8601: "2027-10-01T00:00:00Z" }
              as: ProgramAdministrator
          trigger:
            - call: "POST /gfco/surveillance-runs"
              payload: {}
              as: ProgramAdministrator
          assert:
            - "Applicant.${app_id}.posture_score_rolling_12m == 100"
            - "Applicant.${app_id}.posture_score_cycle == 77"
            - "Applicant.${app_id}.compliance_posture == \"WATCH\""
            - "Applicant.${app_id}.current_cycle_started_on == \"2026-08-11T00:00:00Z\""
            - "Applicant.${app_id}.substantiated_complaint_count_rolling == 0"
            - "Applicant.${app_id}.substantiated_complaint_count_cycle == 1"
            - "Applicant.${app_id}.open_nc_penalty_points == 8"
            - "Nonconformance.${nc_open_id}.status == \"ESCALATED\""
            - "ConsumerComplaint.${cx_id}.status == \"CLOSED\""
            - "Certificate.${cert_id}.status == \"ISSUED\""
            - "Certificate.${cert_id}.surveillance_status == \"DUE\""

  - rule_id: combinatorial_formula
    instances:
      - name: sampling_frequency_per_line_round_half_up_before_summation
        grounds:
          - calculations.threshold_standard_selection
          - calculations.lot_sampling_frequency
          - entities.Product.fields.threshold_ppm
          - entities.Product.fields.sampling_lots_per_year
          - entities.Product.fields.sampling_exclusion_days
          - endpoints."POST /gfco/products/{productId}/testing-plan"
        distinguishing_aspect: |
          Two ProductIngredient lines each evaluate to exactly 1.5 raw lots, so ROUND_HALF_UP per
          line gives 2 + 2 == 4 while the forbidden sum-first reading gives ROUND_HALF_UP(3.0) ==
          3; the two lines reach 1.5 by different routes (risk weight 0.25 at full inclusion vs
          risk weight 0.5 halved by an inclusion_pct below 2), and the shared threshold_multiplier
          1.5 itself depends on threshold_ppm landing exactly on the 10 ppm band edge, which is
          in turn the minimum of five independent caps.
        test_recipe:
          setup:
            - "One applicant, one facility with shared_equipment_present true, gluten_containing_operations ADJACENT_LINES and a current sanitation validation."
            - "One INHERENTLY_GF ingredient (risk weight 0.25) approved with its ALLERGEN_STATEMENT verified, and one GF_PROCESSED ingredient (risk weight 0.5) approved with both ALLERGEN_STATEMENT and PROCESS_FLOW verified."
            - "One product requesting the STANDARD mark, linked to the INHERENTLY_GF ingredient at inclusion_pct 40 (factor 1.0) and to the GF_PROCESSED ingredient at inclusion_pct 1.0 (below LOW_INCLUSION_PCT, factor 0.5), with formula_status CLEARED."
            - "Caps: program 20, tier STANDARD 20, ingredient min(20, 15) = 15, shared equipment 10, ADJACENT_LINES 10, no SAME_LINE penalty, so threshold_ppm = 10 and threshold_multiplier = 1.5."
          setup_api_calls:
            - call: "POST /gfco/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T00:00:00Z" }
              as: ProgramAdministrator
            - call: "POST /gfco/applicants"
              payload: { legal_name: "Northgate Bakehouse Ltd", contact_email: "qa@northgate.example", country_code: "US" }
              as: ProgramAdministrator
              captures: { app_id: $.data.id }
            - call: "POST /gfco/facilities"
              payload: { applicant_id: "${app_id}", site_name: "Plant 4", air_handling_class: "FILTERED_ZONED", shared_equipment_present: true, gluten_containing_operations: "ADJACENT_LINES" }
              as: ApplicantContact
              as_user_id: "${app_id}"
              captures: { fac_id: $.data.id }
            - call: "POST /gfco/facilities/${fac_id}/sanitation-validation"
              payload: { swab_ppm: 4.0, method: "R5_ELISA", validated_on: "2026-08-03T00:00:00Z" }
              as: FieldAuditor
              as_user_id: "aud-1"
            - call: "POST /gfco/suppliers"
              payload: { name: "Prairie Mills", country_code: "CA", gluten_handling_disclosed: false }
              as: ProgramAdministrator
              captures: { sup_id: $.data.id }
            - call: "POST /gfco/ingredients"
              payload: { applicant_id: "${app_id}", supplier_id: "${sup_id}", name: "Brown Rice Flour", risk_class: "INHERENTLY_GF" }
              as: ApplicantContact
              as_user_id: "${app_id}"
              captures: { ing_a: $.data.id }
            - call: "POST /gfco/supplier-documents"
              payload: { supplier_id: "${sup_id}", ingredient_id: "${ing_a}", doc_type: "ALLERGEN_STATEMENT", issued_on: "2026-07-01T00:00:00Z", expires_on: "2028-07-01T00:00:00Z" }
              as: ApplicantContact
              as_user_id: "${app_id}"
              captures: { doc_a: $.data.id }
            - call: "POST /gfco/supplier-documents/${doc_a}/verification"
              payload: { decision: "APPROVE" }
              as: CertificationReviewer
              as_user_id: "rev-1"
            - call: "POST /gfco/ingredients/${ing_a}/submission"
              payload: {}
              as: ApplicantContact
              as_user_id: "${app_id}"
            - call: "POST /gfco/ingredients/${ing_a}/review"
              payload: { decision: "APPROVE" }
              as: CertificationReviewer
              as_user_id: "rev-1"
            - call: "POST /gfco/ingredients"
              payload: { applicant_id: "${app_id}", supplier_id: "${sup_id}", name: "Purity Protocol Oat Flour", risk_class: "GF_PROCESSED" }
              as: ApplicantContact
              as_user_id: "${app_id}"
              captures: { ing_b: $.data.id }
            - call: "POST /gfco/supplier-documents"
              payload: { supplier_id: "${sup_id}", ingredient_id: "${ing_b}", doc_type: "ALLERGEN_STATEMENT", issued_on: "2026-07-01T00:00:00Z", expires_on: "2028-07-01T00:00:00Z" }
              as: ApplicantContact
              as_user_id: "${app_id}"
              captures: { doc_b1: $.data.id }
            - call: "POST /gfco/supplier-documents/${doc_b1}/verification"
              payload: { decision: "APPROVE" }
              as: CertificationReviewer
              as_user_id: "rev-1"
            - call: "POST /gfco/supplier-documents"
              payload: { supplier_id: "${sup_id}", ingredient_id: "${ing_b}", doc_type: "PROCESS_FLOW", issued_on: "2026-07-01T00:00:00Z", expires_on: "2028-07-01T00:00:00Z" }
              as: ApplicantContact
              as_user_id: "${app_id}"
              captures: { doc_b2: $.data.id }
            - call: "POST /gfco/supplier-documents/${doc_b2}/verification"
              payload: { decision: "APPROVE" }
              as: CertificationReviewer
              as_user_id: "rev-1"
            - call: "POST /gfco/ingredients/${ing_b}/submission"
              payload: {}
              as: ApplicantContact
              as_user_id: "${app_id}"
            - call: "POST /gfco/ingredients/${ing_b}/review"
              payload: { decision: "APPROVE" }
              as: CertificationReviewer
              as_user_id: "rev-1"
            - call: "POST /gfco/products"
              payload: { applicant_id: "${app_id}", facility_id: "${fac_id}", name: "Multigrain Rice Loaf", sku: "MRL-001", requested_mark_tier: "STANDARD" }
              as: ApplicantContact
              as_user_id: "${app_id}"
              captures: { prod_id: $.data.id }
            - call: "POST /gfco/product-ingredients"
              payload: { product_id: "${prod_id}", ingredient_id: "${ing_a}", inclusion_pct: 40 }
              as: ApplicantContact
              as_user_id: "${app_id}"
            - call: "POST /gfco/product-ingredients"
              payload: { product_id: "${prod_id}", ingredient_id: "${ing_b}", inclusion_pct: 1.0 }
              as: ApplicantContact
              as_user_id: "${app_id}"
            - call: "POST /gfco/products/${prod_id}/formula-review"
              payload: { decision: "CLEAR" }
              as: CertificationReviewer
              as_user_id: "rev-1"
              captures: { prod_v1: $.data.version }
          trigger:
            - call: "POST /gfco/products/${prod_id}/testing-plan"
              payload: { expected_product_version: "${prod_v1}" }
              as: CertificationReviewer
              as_user_id: "rev-1"
          assert:
            - "response.status == 200"
            - "Product.${prod_id}.threshold_ppm == 10"
            - "Product.${prod_id}.sampling_lots_per_year == 4"
            - "Product.${prod_id}.sampling_exclusion_days == 91"
            - "Product.${prod_id}.linked_ingredient_count == 2"
            - "Product.${prod_id}.formula_status == \"CLEARED\""

      - name: fee_tier_selected_on_base_fee_so_larger_base_bills_less
        grounds:
          - calculations.certification_fee_schedule
          - entities.Certificate.fields.base_fee_cents
          - entities.Certificate.fields.surveillance_surcharge_cents
          - entities.Certificate.fields.total_fee_cents
          - entities.Applicant.fields.fee_balance_cents
          - entities.Product.fields.linked_ingredient_count
