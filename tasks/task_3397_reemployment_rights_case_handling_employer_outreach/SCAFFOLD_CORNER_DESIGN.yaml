  - section: calculations
    instances:
      - name: health_continuation_cap_boundary_at_24_months
        claim_type: Correct Result
        grounds:
          - calculations.health_continuation_months
        distinguishing_aspect: "The 24-month cap is a min() applied after rounding: 731 service days round to 24.01 and are capped to exactly 24, while 730 days round to 23.98 and pass through uncapped."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z. One employer; member X with one 731-day period, member Y with one 730-day period; each with a BENEFITS case."
          setup_api_calls:
            - *c_clock
            - *c_emp
            - call: "POST /reemployment/members"
              payload: { full_name: "Xu Lan", email: "xu@example.com", branch: "ARMY", component: "ARMY_RESERVE" }
              as: Anonymous
              captures: { mx_id: $.data.id }
            - call: "POST /reemployment/service-periods"
              payload: { member_id: "${mx_id}", employer_id: "${emp_id}", start_date: "2024-01-01T00:00:00Z", end_date: "2026-01-01T00:00:00Z", orders_type: "ACTIVE_DUTY" }
              as: ServiceMember
              as_user_id: "${mx_id}"
            - call: "POST /reemployment/cases"
              payload: { member_id: "${mx_id}", employer_id: "${emp_id}", issue_type: "BENEFITS", description: "Health continuation at cap" }
              as: ServiceMember
              as_user_id: "${mx_id}"
              captures: { cx_id: $.data.id }
            - call: "POST /reemployment/members"
              payload: { full_name: "Yan Mei", email: "yan@example.com", branch: "ARMY", component: "ARMY_RESERVE" }
              as: Anonymous
              captures: { my_id: $.data.id }
            - call: "POST /reemployment/service-periods"
              payload: { member_id: "${my_id}", employer_id: "${emp_id}", start_date: "2024-01-01T00:00:00Z", end_date: "2025-12-31T00:00:00Z", orders_type: "ACTIVE_DUTY" }
              as: ServiceMember
              as_user_id: "${my_id}"
            - call: "POST /reemployment/cases"
              payload: { member_id: "${my_id}", employer_id: "${emp_id}", issue_type: "BENEFITS", description: "Health continuation below cap" }
              as: ServiceMember
              as_user_id: "${my_id}"
              captures: { cy_id: $.data.id }
          trigger:
            - call: "POST /reemployment/benefit-assessments"
              payload: { case_id: "${cx_id}" }
              as: ProgramCoordinator
            - call: "POST /reemployment/benefit-assessments"
              payload: { case_id: "${cy_id}" }
              as: ProgramCoordinator
          assert:
            - "member X (731 days): health_continuation_months == 24 (24.01 capped)"
            - "member Y (730 days): health_continuation_months == 23.98 (uncapped)"
            - "member X pension_credit_months_official == 24.01 (pension is not capped — only health is)"

      - name: exempt_orders_excluded_from_cumulative_cap
        claim_type: Input Set Filtering
        grounds:
          - calculations.cumulative_chargeable_service_days
          - entities.ServicePeriod.fields.chargeable
        distinguishing_aspect: "A 1000-day NATIONAL_EMERGENCY period is excluded from the cap sum (chargeable == false), so a member with 1900 raw days but 900 chargeable days is service_limit_ok true."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z. Employer; member with a 1000-day NATIONAL_EMERGENCY period and a 900-day ACTIVE_DUTY period; REEMPLOYMENT case."
          setup_api_calls:
            - *c_clock
            - *c_emp
            - *c_mem
            - call: "POST /reemployment/service-periods"
              payload: { member_id: "${mem_id}", employer_id: "${emp_id}", start_date: "2020-01-01T00:00:00Z", end_date: "2022-09-27T00:00:00Z", orders_type: "NATIONAL_EMERGENCY" }
              as: ServiceMember
              as_user_id: "${mem_id}"
            - call: "POST /reemployment/service-periods"
              payload: { member_id: "${mem_id}", employer_id: "${emp_id}", start_date: "2023-01-01T00:00:00Z", end_date: "2025-06-19T00:00:00Z", orders_type: "ACTIVE_DUTY", notice_given_at: "2022-12-01T00:00:00Z" }
              as: ServiceMember
              as_user_id: "${mem_id}"
            - call: "POST /reemployment/cases"
              payload: { member_id: "${mem_id}", employer_id: "${emp_id}", issue_type: "REEMPLOYMENT", description: "Cap-exempt service dispute", application_submitted_at: "2025-08-01T00:00:00Z" }
              as: ServiceMember
              as_user_id: "${mem_id}"
              captures: { case_id: $.data.id, case_v: $.data.version }
          trigger:
            - call: "POST /reemployment/cases/${case_id}/eligibility-analysis"
              payload: { variant: "STRICT", expected_case_version: "${case_v}" }
              as: ProgramCoordinator
          assert:
            - "cumulative_chargeable_days == 900 (the 1000-day NATIONAL_EMERGENCY period is excluded)"
            - "service_limit_ok == true even though raw service totals 1900 days"
            - "disputed_period_duration_days == 900, duration_band == LONG, application_deadline_days == 90"
            - "overall_eligible == true"

      - name: disputed_period_selector_prefers_latest_completed
