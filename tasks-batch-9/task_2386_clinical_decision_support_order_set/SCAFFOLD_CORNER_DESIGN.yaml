      - name: error_vendor_release_stage_guards_reject_empty_analysis_repeat_analysis_and_early_activation
        claim_type: error_triggerable
        grounds:
          - errors.ERR_VENDOR_RELEASE_NOT_RECEIVED
          - errors.ERR_VENDOR_RELEASE_NOT_ANALYZED
        distinguishing_aspect: "Running impact analysis on a release with zero deltas and re-running it after the fork both return ERR_VENDOR_RELEASE_NOT_RECEIVED, while activating or dispositioning a release that is still RECEIVED returns the different code ERR_VENDOR_RELEASE_NOT_ANALYZED."
        test_recipe:
          setup:
