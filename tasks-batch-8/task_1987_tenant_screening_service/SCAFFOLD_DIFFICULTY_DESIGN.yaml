# =============================================================================
# Task 1987 — Tenant Screening Service
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# Two instances per §0.5 Difficulty Rule; every instance grounds in SCAFFOLD.yaml §1.1–§1.7.
# =============================================================================

scaffold_difficulty_design:
  # ---------------------------------------------------------------------------
  - rule_id: dual_variant_calc
    instances:
      - name: soi_adjusted_ratio_vs_standard_ratio
        grounds:
          - calculations.rent_to_income_ratio
          - entities.ScreeningApplication.fields.voucher_monthly_amount_cents
          - entities.JurisdictionRule.fields.source_of_income_protected
          - entities.ScreeningCriteria.fields.accepts_voucher_income
        distinguishing_aspect: |
          Different entity domain from the guarantor instance: on the ScreeningApplication income domain,
          identical inputs (income 500000, rent 200000, voucher 100000) yield affordability_passes == true
          in CA (SOI-adjusted variant tests 500000 >= round_half_up(3.0 * 100000) = 300000) but
          affordability_passes == false in TX (no rule row -> standard variant tests 500000 >= 600000).
          Variant selection is jurisdiction-driven, not caller-driven.
        test_recipe:
          setup:
            - "Landlord with published criteria CR1 (min_credit_score 650, income_multiplier 3.0, COMBINED_ALLOWED, accepts_voucher_income true, window covers 2026-08-01)"
            - "JurisdictionRule CA with source_of_income_protected true; TX has NO rule row (defaults apply, SOI false)"
            - "Two applications, each rent 200000, stated income 500000, voucher 100000, credit 700, no records, verified income 500000; appCA in CA, appTX in TX; both in SCREENING with income verification resolved"
          setup_api_calls:
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: ComplianceAdmin }
            - call: "POST /api/landlords"
              payload: { name: "L SOI", contact_email: "lsoi@x.com" }
              as: ComplianceAdmin
              captures: { ll: "$.data.id", ll_v: "$.data.version" }
            - call: "POST /api/jurisdiction-rules"
              payload: { state_code: "CA", criminal_lookback_years: 7, eviction_lookback_years: 7, source_of_income_protected: true, portable_report_acceptance_required: true, effective_from: "2020-01-01T00:00:00Z" }
              as: ComplianceAdmin
            - call: "POST /api/criteria"
              payload: { name: "CR1", disclosure_summary: "Standard criteria v1", min_credit_score: 650, income_multiplier: 3.0, guarantor_policy: "COMBINED_ALLOWED", guarantor_income_multiplier: 4.0, accepts_portable_reports: true, accepts_voucher_income: true, effective_from: "2026-01-01T00:00:00Z", effective_to: "2026-12-31T00:00:00Z" }
              as: Landlord
              as_user_id: "${ll}"
              captures: { cr: "$.data.id" }
            - { call: "POST /api/criteria/${cr}/publish", payload: { expected_landlord_version: "${ll_v}" }, as: Landlord, as_user_id: "${ll}" }
            - call: "POST /api/applicants"
              payload: { full_name: "Ann CA", dob: "1990-01-01T00:00:00Z", email: "ann@x.com", ssn_last4: "1111", residence_state: "CA" }
              as: Screener
              captures: { ap1: "$.data.id" }
            - call: "POST /api/applications"
              payload: { applicant_id: "${ap1}", unit_state_code: "CA", monthly_rent_cents: 200000, stated_monthly_income_cents: 500000, voucher_monthly_amount_cents: 100000 }
              as: Landlord
              as_user_id: "${ll}"
              captures: { appCA: "$.data.id" }
            - { call: "POST /api/applications/${appCA}/consent", payload: {}, as: Applicant, as_user_id: "${ap1}" }
            - { call: "POST /api/applications/${appCA}/verify-identity", payload: { method: "KNOWLEDGE_BASED", evidence_score: 85 }, as: Screener }
            - { call: "POST /api/applications/${appCA}/submit", payload: {}, as: Landlord, as_user_id: "${ll}" }
            - { call: "POST /api/applications/${appCA}/record-searches", payload: { credit_score: 700, records: [] }, as: Screener }
            - call: "POST /api/applications/${appCA}/income-verifications"
              payload: { employer_name: "Acme" }
              as: Screener
              captures: { ivCA: "$.data.id" }
            - { call: "POST /api/income-verifications/${ivCA}/resolve", payload: { outcome: "VERIFIED", verified_monthly_income_cents: 500000 }, as: Screener }
            - call: "POST /api/applicants"
              payload: { full_name: "Tim TX", dob: "1991-01-01T00:00:00Z", email: "tim@x.com", ssn_last4: "2222", residence_state: "TX" }
              as: Screener
              captures: { ap2: "$.data.id" }
            - call: "POST /api/applications"
              payload: { applicant_id: "${ap2}", unit_state_code: "TX", monthly_rent_cents: 200000, stated_monthly_income_cents: 500000, voucher_monthly_amount_cents: 100000 }
              as: Landlord
              as_user_id: "${ll}"
              captures: { appTX: "$.data.id" }
            - { call: "POST /api/applications/${appTX}/consent", payload: {}, as: Applicant, as_user_id: "${ap2}" }
            - { call: "POST /api/applications/${appTX}/verify-identity", payload: { method: "KNOWLEDGE_BASED", evidence_score: 85 }, as: Screener }
            - { call: "POST /api/applications/${appTX}/submit", payload: {}, as: Landlord, as_user_id: "${ll}" }
            - { call: "POST /api/applications/${appTX}/record-searches", payload: { credit_score: 700, records: [] }, as: Screener }
            - call: "POST /api/applications/${appTX}/income-verifications"
              payload: { employer_name: "Acme" }
              as: Screener
              captures: { ivTX: "$.data.id" }
            - { call: "POST /api/income-verifications/${ivTX}/resolve", payload: { outcome: "VERIFIED", verified_monthly_income_cents: 500000 }, as: Screener }
          trigger:
            - { call: "POST /api/applications/${appCA}/score", payload: {}, as: Screener }
            - { call: "POST /api/applications/${appTX}/score", payload: {}, as: Screener }
          assert:
            - "ScreeningApplication.${appCA}.affordability_passes == true   (SOI variant: applicable rent 100000, threshold 300000, 500000 >= 300000)"
            - "ScreeningApplication.${appCA}.recommendation == RECOMMEND_APPROVE"
            - "ScreeningApplication.${appTX}.affordability_passes == false  (standard variant: threshold 600000, 500000 < 600000)"
            - "ScreeningApplication.${appTX}.recommendation == RECOMMEND_DENY"

      - name: guarantor_policy_combined_vs_independent
        grounds:
          - calculations.guarantor_qualification
          - entities.Guarantor.fields.qualification_policy_used
          - entities.ScreeningCriteria.fields.guarantor_policy
        distinguishing_aspect: |
          Different entity domain from the ratio instance: on the Guarantor domain, identical incomes
          (applicant verified 400000, guarantor verified 300000, rent 200000) yield APPROVED under
          COMBINED_ALLOWED (pooled 700000 >= round_half_up(3.0 * 200000) = 600000) but DECLINED under
          INDEPENDENT_ONLY (standalone 300000 < round_half_up(4.0 * 200000) = 800000). Variant selection
          is criteria-driven (guarantor_policy).
        test_recipe:
          setup:
            - "Two landlords: ll1 with published COMBINED_ALLOWED criteria, ll2 with published INDEPENDENT_ONLY criteria (both windows cover 2026-08-01; multiplier 3.0, guarantor multiplier 4.0)"
            - "Each landlord has one TX application (rent 200000) whose income verification is VERIFIED at 400000; each application has one PENDING guarantor (stated 300000)"
          setup_api_calls:
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: ComplianceAdmin }
            - call: "POST /api/landlords"
              payload: { name: "L Combined", contact_email: "lc@x.com" }
              as: ComplianceAdmin
              captures: { ll1: "$.data.id", ll1_v: "$.data.version" }
            - call: "POST /api/criteria"
              payload: { name: "CR-COMB", disclosure_summary: "Combined guarantor policy", min_credit_score: 650, income_multiplier: 3.0, guarantor_policy: "COMBINED_ALLOWED", guarantor_income_multiplier: 4.0, accepts_portable_reports: true, accepts_voucher_income: true, effective_from: "2026-01-01T00:00:00Z", effective_to: "2026-12-31T00:00:00Z" }
              as: Landlord
              as_user_id: "${ll1}"
              captures: { cr1: "$.data.id" }
            - { call: "POST /api/criteria/${cr1}/publish", payload: { expected_landlord_version: "${ll1_v}" }, as: Landlord, as_user_id: "${ll1}" }
            - call: "POST /api/applicants"
              payload: { full_name: "Ann One", dob: "1990-01-01T00:00:00Z", email: "a1@x.com", ssn_last4: "1111", residence_state: "TX" }
              as: Screener
              captures: { ap1: "$.data.id" }
            - call: "POST /api/applications"
              payload: { applicant_id: "${ap1}", unit_state_code: "TX", monthly_rent_cents: 200000, stated_monthly_income_cents: 400000 }
              as: Landlord
              as_user_id: "${ll1}"
              captures: { app1: "$.data.id" }
            - { call: "POST /api/applications/${app1}/consent", payload: {}, as: Applicant, as_user_id: "${ap1}" }
            - { call: "POST /api/applications/${app1}/verify-identity", payload: { method: "KNOWLEDGE_BASED", evidence_score: 85 }, as: Screener }
            - { call: "POST /api/applications/${app1}/submit", payload: {}, as: Landlord, as_user_id: "${ll1}" }
            - call: "POST /api/applications/${app1}/income-verifications"
              payload: { employer_name: "Acme" }
              as: Screener
              captures: { iv1: "$.data.id" }
            - { call: "POST /api/income-verifications/${iv1}/resolve", payload: { outcome: "VERIFIED", verified_monthly_income_cents: 400000 }, as: Screener }
            - call: "POST /api/applications/${app1}/guarantors"
              payload: { full_name: "Gill One", stated_monthly_income_cents: 300000 }
              as: Landlord
              as_user_id: "${ll1}"
              captures: { g1: "$.data.id" }
            - call: "POST /api/landlords"
              payload: { name: "L Independent", contact_email: "li@x.com" }
              as: ComplianceAdmin
              captures: { ll2: "$.data.id", ll2_v: "$.data.version" }
            - call: "POST /api/criteria"
              payload: { name: "CR-IND", disclosure_summary: "Independent guarantor policy", min_credit_score: 650, income_multiplier: 3.0, guarantor_policy: "INDEPENDENT_ONLY", guarantor_income_multiplier: 4.0, accepts_portable_reports: true, accepts_voucher_income: true, effective_from: "2026-01-01T00:00:00Z", effective_to: "2026-12-31T00:00:00Z" }
              as: Landlord
              as_user_id: "${ll2}"
              captures: { cr2: "$.data.id" }
            - { call: "POST /api/criteria/${cr2}/publish", payload: { expected_landlord_version: "${ll2_v}" }, as: Landlord, as_user_id: "${ll2}" }
            - call: "POST /api/applicants"
              payload: { full_name: "Bob Two", dob: "1991-01-01T00:00:00Z", email: "b2@x.com", ssn_last4: "2222", residence_state: "TX" }
              as: Screener
              captures: { ap2: "$.data.id" }
            - call: "POST /api/applications"
              payload: { applicant_id: "${ap2}", unit_state_code: "TX", monthly_rent_cents: 200000, stated_monthly_income_cents: 400000 }
              as: Landlord
              as_user_id: "${ll2}"
              captures: { app2: "$.data.id" }
            - { call: "POST /api/applications/${app2}/consent", payload: {}, as: Applicant, as_user_id: "${ap2}" }
            - { call: "POST /api/applications/${app2}/verify-identity", payload: { method: "KNOWLEDGE_BASED", evidence_score: 85 }, as: Screener }
            - { call: "POST /api/applications/${app2}/submit", payload: {}, as: Landlord, as_user_id: "${ll2}" }
            - call: "POST /api/applications/${app2}/income-verifications"
              payload: { employer_name: "Acme" }
              as: Screener
              captures: { iv2: "$.data.id" }
            - { call: "POST /api/income-verifications/${iv2}/resolve", payload: { outcome: "VERIFIED", verified_monthly_income_cents: 400000 }, as: Screener }
            - call: "POST /api/applications/${app2}/guarantors"
              payload: { full_name: "Gill Two", stated_monthly_income_cents: 300000 }
              as: Landlord
              as_user_id: "${ll2}"
              captures: { g2: "$.data.id" }
          trigger:
            - { call: "POST /api/guarantors/${g1}/evaluate", payload: { verified_monthly_income_cents: 300000, credit_score: 720 }, as: Screener }
            - { call: "POST /api/guarantors/${g2}/evaluate", payload: { verified_monthly_income_cents: 300000, credit_score: 720 }, as: Screener }
          assert:
            - "Guarantor.${g1}.status == APPROVED and qualification_policy_used == COMBINED_ALLOWED   (400000 + 300000 = 700000 >= 600000)"
            - "Guarantor.${g2}.status == DECLINED and qualification_policy_used == INDEPENDENT_ONLY   (300000 < 800000)"

  # ---------------------------------------------------------------------------
  - rule_id: combinatorial_formula
    instances:
      - name: recommendation_decision_table_guarantor_rescue
        grounds:
          - calculations.screening_recommendation
          - entities.Guarantor.fields.status
          - entities.ScreeningApplication.fields.recommendation
        distinguishing_aspect: |
          Mode (a) combinatorial: >= 3 inputs (credit_score, included record counts, affordability,
          guarantor presence) with pinned branch order. An affordability-failing application with an
          APPROVED guarantor lands on branch 5 (RECOMMEND_CONDITIONAL) while an identical application
          without a guarantor falls through to branch 6 (RECOMMEND_DENY) — proving the guarantor branch
          sits between affordability and the default.
        test_recipe:
          setup:
            - "Landlord with published COMBINED_ALLOWED criteria (multiplier 3.0, guarantor multiplier 4.0, min credit 650)"
            - "appA (TX, rent 200000): credit 700, no records, verified income 400000 (affordability fails: 400000 < 600000), guarantor approved via combined pooling (400000 + 300000 >= 600000)"
            - "appB (TX, rent 200000): identical to appA but NO guarantor"
          setup_api_calls:
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: ComplianceAdmin }
            - call: "POST /api/landlords"
              payload: { name: "L Rescue", contact_email: "lr@x.com" }
              as: ComplianceAdmin
              captures: { ll: "$.data.id", ll_v: "$.data.version" }
            - call: "POST /api/criteria"
              payload: { name: "CR1", disclosure_summary: "Standard criteria", min_credit_score: 650, income_multiplier: 3.0, guarantor_policy: "COMBINED_ALLOWED", guarantor_income_multiplier: 4.0, accepts_portable_reports: true, accepts_voucher_income: true, effective_from: "2026-01-01T00:00:00Z", effective_to: "2026-12-31T00:00:00Z" }
              as: Landlord
              as_user_id: "${ll}"
              captures: { cr: "$.data.id" }
            - { call: "POST /api/criteria/${cr}/publish", payload: { expected_landlord_version: "${ll_v}" }, as: Landlord, as_user_id: "${ll}" }
            - call: "POST /api/applicants"
              payload: { full_name: "Ann A", dob: "1990-01-01T00:00:00Z", email: "a@x.com", ssn_last4: "1111", residence_state: "TX" }
              as: Screener
              captures: { ap1: "$.data.id" }
            - call: "POST /api/applications"
              payload: { applicant_id: "${ap1}", unit_state_code: "TX", monthly_rent_cents: 200000, stated_monthly_income_cents: 400000 }
              as: Landlord
              as_user_id: "${ll}"
              captures: { appA: "$.data.id" }
            - { call: "POST /api/applications/${appA}/consent", payload: {}, as: Applicant, as_user_id: "${ap1}" }
            - { call: "POST /api/applications/${appA}/verify-identity", payload: { method: "KNOWLEDGE_BASED", evidence_score: 85 }, as: Screener }
            - { call: "POST /api/applications/${appA}/submit", payload: {}, as: Landlord, as_user_id: "${ll}" }
            - { call: "POST /api/applications/${appA}/record-searches", payload: { credit_score: 700, records: [] }, as: Screener }
            - call: "POST /api/applications/${appA}/income-verifications"
              payload: { employer_name: "Acme" }
              as: Screener
              captures: { ivA: "$.data.id" }
            - { call: "POST /api/income-verifications/${ivA}/resolve", payload: { outcome: "VERIFIED", verified_monthly_income_cents: 400000 }, as: Screener }
            - call: "POST /api/applications/${appA}/guarantors"
              payload: { full_name: "Gill G", stated_monthly_income_cents: 300000 }
              as: Landlord
              as_user_id: "${ll}"
              captures: { gA: "$.data.id" }
            - { call: "POST /api/guarantors/${gA}/evaluate", payload: { verified_monthly_income_cents: 300000, credit_score: 720 }, as: Screener }
            - call: "POST /api/applicants"
              payload: { full_name: "Bob B", dob: "1991-01-01T00:00:00Z", email: "b@x.com", ssn_last4: "2222", residence_state: "TX" }
              as: Screener
              captures: { ap2: "$.data.id" }
            - call: "POST /api/applications"
              payload: { applicant_id: "${ap2}", unit_state_code: "TX", monthly_rent_cents: 200000, stated_monthly_income_cents: 400000 }
              as: Landlord
              as_user_id: "${ll}"
              captures: { appB: "$.data.id" }
            - { call: "POST /api/applications/${appB}/consent", payload: {}, as: Applicant, as_user_id: "${ap2}" }
            - { call: "POST /api/applications/${appB}/verify-identity", payload: { method: "KNOWLEDGE_BASED", evidence_score: 85 }, as: Screener }
            - { call: "POST /api/applications/${appB}/submit", payload: {}, as: Landlord, as_user_id: "${ll}" }
            - { call: "POST /api/applications/${appB}/record-searches", payload: { credit_score: 700, records: [] }, as: Screener }
            - call: "POST /api/applications/${appB}/income-verifications"
              payload: { employer_name: "Acme" }
              as: Screener
              captures: { ivB: "$.data.id" }
            - { call: "POST /api/income-verifications/${ivB}/resolve", payload: { outcome: "VERIFIED", verified_monthly_income_cents: 400000 }, as: Screener }
          trigger:
            - { call: "POST /api/applications/${appA}/score", payload: {}, as: Screener }
            - { call: "POST /api/applications/${appB}/score", payload: {}, as: Screener }
          assert:
            - "ScreeningApplication.${appA}.affordability_passes == false  (400000 < 600000)"
            - "ScreeningApplication.${appA}.recommendation == RECOMMEND_CONDITIONAL  (branch 5: APPROVED guarantor exists)"
            - "ScreeningApplication.${appB}.affordability_passes == false"
            - "ScreeningApplication.${appB}.recommendation == RECOMMEND_DENY  (branch 6: fall-through)"

      - name: screening_fee_round_per_component_then_sum
        grounds:
          - calculations.screening_fee
          - entities.ScreeningApplication.fields.fee_charged_cents
          - entities.Landlord.fields.fee_balance_cents
        distinguishing_aspect: |
          Mode (b) nested rounding — different mode from the decision-table instance: each per-search-type
          surcharge is rounded half-up to integer cents BEFORE summation (round(0.125 * 2500) = 313 per type),
          so a CA three-search fee is 2500 + 313 + 313 + 313 = 3439, NOT the sum-then-round 3438
          (2500 + round(937.5)). The NY rule (criminal_lookback_years 0) removes the criminal search, giving
          2500 + 313 + 313 = 3126, under the NY cap of 3200.
        test_recipe:
          setup:
            - "JurisdictionRules: CA (criminal 7, eviction 7, no cap), NY (criminal 0 -> criminal search prohibited, eviction 5, cap 3200)"
            - "Two landlords, each with a published criteria (window covers 2026-08-01) and one fully-consented application in SUBMITTED: appCA (unit CA) under llCA, appNY (unit NY) under llNY"
          setup_api_calls:
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: ComplianceAdmin }
            - { call: "POST /api/jurisdiction-rules", payload: { state_code: "CA", criminal_lookback_years: 7, eviction_lookback_years: 7, source_of_income_protected: false, portable_report_acceptance_required: false, effective_from: "2020-01-01T00:00:00Z" }, as: ComplianceAdmin }
            - { call: "POST /api/jurisdiction-rules", payload: { state_code: "NY", criminal_lookback_years: 0, eviction_lookback_years: 5, source_of_income_protected: false, portable_report_acceptance_required: false, max_screening_fee_cents: 3200, effective_from: "2020-01-01T00:00:00Z" }, as: ComplianceAdmin }
            - call: "POST /api/landlords"
              payload: { name: "L CA", contact_email: "lca@x.com" }
              as: ComplianceAdmin
              captures: { llCA: "$.data.id", llCA_v: "$.data.version" }
            - call: "POST /api/criteria"
              payload: { name: "CR-CA", disclosure_summary: "CA criteria", min_credit_score: 650, income_multiplier: 3.0, guarantor_policy: "COMBINED_ALLOWED", guarantor_income_multiplier: 4.0, accepts_portable_reports: true, accepts_voucher_income: true, effective_from: "2026-01-01T00:00:00Z", effective_to: "2026-12-31T00:00:00Z" }
              as: Landlord
              as_user_id: "${llCA}"
              captures: { crCA: "$.data.id" }
            - { call: "POST /api/criteria/${crCA}/publish", payload: { expected_landlord_version: "${llCA_v}" }, as: Landlord, as_user_id: "${llCA}" }
            - call: "POST /api/applicants"
              payload: { full_name: "Ann CA", dob: "1990-01-01T00:00:00Z", email: "aca@x.com", ssn_last4: "1111", residence_state: "CA" }
              as: Screener
              captures: { apCA: "$.data.id" }
            - call: "POST /api/applications"
              payload: { applicant_id: "${apCA}", unit_state_code: "CA", monthly_rent_cents: 200000, stated_monthly_income_cents: 600000 }
              as: Landlord
              as_user_id: "${llCA}"
              captures: { appCA: "$.data.id" }
            - { call: "POST /api/applications/${appCA}/consent", payload: {}, as: Applicant, as_user_id: "${apCA}" }
            - { call: "POST /api/applications/${appCA}/verify-identity", payload: { method: "KNOWLEDGE_BASED", evidence_score: 85 }, as: Screener }
            - { call: "POST /api/applications/${appCA}/submit", payload: {}, as: Landlord, as_user_id: "${llCA}" }
            - call: "POST /api/landlords"
              payload: { name: "L NY", contact_email: "lny@x.com" }
              as: ComplianceAdmin
              captures: { llNY: "$.data.id", llNY_v: "$.data.version" }
            - call: "POST /api/criteria"
              payload: { name: "CR-NY", disclosure_summary: "NY criteria", min_credit_score: 650, income_multiplier: 3.0, guarantor_policy: "COMBINED_ALLOWED", guarantor_income_multiplier: 4.0, accepts_portable_reports: true, accepts_voucher_income: true, effective_from: "2026-01-01T00:00:00Z", effective_to: "2026-12-31T00:00:00Z" }
              as: Landlord
              as_user_id: "${llNY}"
              captures: { crNY: "$.data.id" }
            - { call: "POST /api/criteria/${crNY}/publish", payload: { expected_landlord_version: "${llNY_v}" }, as: Landlord, as_user_id: "${llNY}" }
            - call: "POST /api/applicants"
              payload: { full_name: "Ned NY", dob: "1991-01-01T00:00:00Z", email: "nny@x.com", ssn_last4: "2222", residence_state: "NY" }
              as: Screener
              captures: { apNY: "$.data.id" }
            - call: "POST /api/applications"
              payload: { applicant_id: "${apNY}", unit_state_code: "NY", monthly_rent_cents: 200000, stated_monthly_income_cents: 600000 }
              as: Landlord
              as_user_id: "${llNY}"
              captures: { appNY: "$.data.id" }
            - { call: "POST /api/applications/${appNY}/consent", payload: {}, as: Applicant, as_user_id: "${apNY}" }
            - { call: "POST /api/applications/${appNY}/verify-identity", payload: { method: "KNOWLEDGE_BASED", evidence_score: 85 }, as: Screener }
            - { call: "POST /api/applications/${appNY}/submit", payload: {}, as: Landlord, as_user_id: "${llNY}" }
          trigger:
            - { call: "POST /api/applications/${appCA}/record-searches", payload: { credit_score: 700, records: [] }, as: Screener }
