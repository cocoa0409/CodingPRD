          assert:
            - "cascade link 1 — WorkingCapitalPlan.${plan_id}.spent_total == 20000.00, unspent_amount == 280000.00, pacing_shortfall == 280000.00, last_checkpoint_month_index == 3, status == BLOWN"
            - "cascade link 2 — QOZBusiness.${biz_id}.wcsh_protected_amount == 0.00, blown_unspent_amount == 280000.00, nqfp_amount == 280000.00"
            - "cascade link 3 — BusinessTest.${bt2_id}.nqfp_amount_measured == 280000.00, nqfp_pct == 28.0000, nqfp_prong == FAIL, status == MEASURED (re-measured in place, not certified)"
            - "cascade link 4 — QOZBusiness.${biz_id}.qualification_status == DISQUALIFIED and FundAsset.${eq_id}.qualification == NONQUALIFIED"
            - "Fund.${fund_id}.aggregate_asset_basis == 900000.00 and aggregate_qualified_basis == 0.00"
            - "BusinessTest.${bt1_id}.status == PASSED with nqfp_pct == 0.0000 (the already-certified test is not retroactively re-measured)"

  - rule_id: priority_pair_validation_conflict
    instances:
      - name: fund_state_gate_precedes_180_day_window
        grounds:
          - validations[priority=11]
          - validations[priority=19]
          - calculations.eligible_gain_investment_deadline
        distinguishing_aspect: |
          Pair (11, 19) = state vs business_temporal. A DRAFT fund plus a gain
          whose 180-day window has already closed violates both rules at once;
          only the fund-certification gate may answer, so the response is
          ERR_FUND_NOT_CERTIFIED (409) and never ERR_180_DAY_WINDOW_CLOSED (422).
          Different error-category pair from the other two instances in this rule.
        test_recipe:
          setup:
            - "One ATTESTED Investor."
            - "One Fund left in certification_status DRAFT (never self-certified); its version is captured at creation."
            - "One EligibleGain of 100000.00 realized 2026-01-01 on SALE_DATE basis, so investment_deadline is 2026-06-30 and the clock date 2026-08-01 is 212 days past the basis — the window is closed."
          setup_api_calls:
            - call: "POST /qof/investors"
              payload: { legal_name: "Gate Order Investor", taxpayer_type: "INDIVIDUAL", compliance_attestation_status: "ATTESTED" }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { inv_id: $.data.id }
            - call: "POST /qof/funds"
              payload: { name: "Still Draft Fund", entity_type: "CORPORATION", manager_user_id: "mgr-fund-1" }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { fund_id: $.data.id, fund_v: $.data.version }
            - call: "POST /qof/eligible-gains"
              payload: { investor_id: "${inv_id}", gain_character: "LONG_TERM_CAPITAL", eligible_amount: 100000.00, realization_date: "2026-01-01T00:00:00Z", deadline_basis: "SALE_DATE" }
              as: Investor
              as_user_id: "${inv_id}"
              captures: { gain_id: $.data.id, deadline: $.data.investment_deadline }
          trigger:
            - call: "POST /qof/deferral-elections"
              payload: { eligible_gain_id: "${gain_id}", fund_id: "${fund_id}", elected_amount: 100000.00, expected_fund_version: "${fund_v}" }
              as: Investor
              as_user_id: "${inv_id}"
              captures: { err: $.data.error_id }
          assert:
            - "${deadline} == 2026-06-30T00:00:00Z"
            - "${err} == ERR_FUND_NOT_CERTIFIED"
            - "HTTP status is 409, not the 422 that ERR_180_DAY_WINDOW_CLOSED would produce"
            - "EligibleGain.${gain_id}.status == ELIGIBLE, elected_amount == 0.00, unelected_amount == 100000.00"
            - "Fund.${fund_id}.deferred_gain_committed == 0.00 and certification_status == DRAFT"
            - "Investor.${inv_id}.deferred_gain_outstanding == 0.00"

      - name: attestation_gate_precedes_amount_ceiling
        grounds:
          - validations[priority=16]
          - validations[priority=35]
          - entities.Investor.fields.compliance_attestation_status
        distinguishing_aspect: |
          Pair (16, 35) = business_safety vs business_fiscal, a different
          error-category pair from instance 1 and from instance 3. The same
          request violates the attestation gate and the elected-amount ceiling;
          the safety gate wins first, and only after the investor is attested
          does the ceiling surface — proving the second rule was reachable and
          genuinely masked rather than absent.
        test_recipe:
          setup:
            - "One Investor left in compliance_attestation_status PENDING."
            - "One SELF_CERTIFIED Fund whose version is captured at self-certification."
            - "One EligibleGain of 100000.00 realized 2026-07-01 on SALE_DATE basis, so the window is wide open on the clock date 2026-08-01."
          setup_api_calls:
            - call: "POST /qof/investors"
              payload: { legal_name: "Unattested Investor", taxpayer_type: "TRUST" }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { inv_id: $.data.id, attest_before: $.data.compliance_attestation_status }
            - call: "POST /qof/funds"
              payload: { name: "Ceiling Fund", entity_type: "CORPORATION", manager_user_id: "mgr-fund-1" }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { fund_id: $.data.id }
            - call: "POST /qof/funds/${fund_id}/self-certify"
              payload: { first_taxable_month_iso8601: "2026-01-01T00:00:00Z" }
              as: FundManager
              as_user_id: "mgr-fund-1"
              captures: { fund_v: $.data.version }
            - call: "POST /qof/eligible-gains"
              payload: { investor_id: "${inv_id}", gain_character: "SHORT_TERM_CAPITAL", eligible_amount: 100000.00, realization_date: "2026-07-01T00:00:00Z", deadline_basis: "SALE_DATE" }
              as: Investor
              as_user_id: "${inv_id}"
              captures: { gain_id: $.data.id }
          trigger:
            - call: "POST /qof/deferral-elections"
              payload: { eligible_gain_id: "${gain_id}", fund_id: "${fund_id}", elected_amount: 250000.00, expected_fund_version: "${fund_v}" }
              as: Investor
              as_user_id: "${inv_id}"
              captures: { err_first: $.data.error_id }
            - call: "PATCH /qof/investors/${inv_id}/attestation"
              payload: { compliance_attestation_status: "ATTESTED" }
              as: PlatformAdmin
              as_user_id: "admin-1"
            - call: "POST /qof/deferral-elections"
              payload: { eligible_gain_id: "${gain_id}", fund_id: "${fund_id}", elected_amount: 250000.00, expected_fund_version: "${fund_v}" }
              as: Investor
              as_user_id: "${inv_id}"
              captures: { err_second: $.data.error_id }
          assert:
            - "${attest_before} == PENDING"
            - "${err_first} == ERR_INVESTOR_NOT_ATTESTED with HTTP 422 (priority 16 wins even though the amount also exceeds the gain)"
            - "${err_second} == ERR_ELECTED_AMOUNT_EXCEEDS_GAIN with HTTP 422 (priority 35 was reachable, merely masked)"
            - "no DeferralElection row exists for EligibleGain.${gain_id}"
            - "EligibleGain.${gain_id}.status == ELIGIBLE and unelected_amount == 100000.00"
            - "Fund.${fund_id}.version == ${fund_v} (neither rejected write bumped the fund)"
            - "Fund.${fund_id}.deferred_gain_committed == 0.00"

      - name: segregation_of_duties_precedes_terminal_check
        grounds:
          - validations[priority=10]
          - validations[priority=14]
          - state_machines.AssetTest.MEASURED_to_CERTIFIED_PASS
          - roles.ComplianceOfficer
        distinguishing_aspect: |
          Pair (10, 14) = auth vs state, the third distinct error-category pair.
          Re-certifying an already CERTIFIED_PASS test as the officer who
          measured it violates segregation of duties AND terminal lockdown; the
          auth-category rule must answer with 403, so an implementation that
          checks the state machine before authority returns 409 and fails.
        test_recipe:
          setup:
            - "One SELF_CERTIFIED Fund with a single QUALIFIED asset of 1000000.00 so the ratio measures 100.0000."
            - "One AssetTest over [2026-01-01, 2026-07-01) measured by co-measurer-1 and certified by co-certifier-1, leaving it in the terminal status CERTIFIED_PASS."
          setup_api_calls:
            - call: "POST /qof/funds"
              payload: { name: "Duties Fund", entity_type: "CORPORATION", manager_user_id: "mgr-fund-1" }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { fund_id: $.data.id }
            - call: "POST /qof/funds/${fund_id}/self-certify"
              payload: { first_taxable_month_iso8601: "2026-01-01T00:00:00Z" }
              as: FundManager
              as_user_id: "mgr-fund-1"
            - call: "POST /qof/fund-assets"
              payload: { fund_id: "${fund_id}", asset_class: "QOZ_BUSINESS_PROPERTY", acquisition_date: "2026-01-10T00:00:00Z", unadjusted_cost_basis: 1000000.00, afs_fair_value: 1000000.00, original_use_in_zone: true }
              as: FundManager
              as_user_id: "mgr-fund-1"
            - call: "POST /qof/funds/${fund_id}/asset-tests"
              payload: { measurement_date: "2026-06-30T00:00:00Z", period_start: "2026-01-01T00:00:00Z", period_end: "2026-07-01T00:00:00Z" }
              as: ComplianceOfficer
              as_user_id: "co-measurer-1"
              captures: { test_id: $.data.id }
            - call: "POST /qof/asset-tests/${test_id}/measure"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "co-measurer-1"
            - call: "POST /qof/asset-tests/${test_id}/certify"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "co-certifier-1"
              captures: { status_after_certify: $.data.status }
          trigger:
            - call: "POST /qof/asset-tests/${test_id}/certify"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "co-measurer-1"
              captures: { err: $.data.error_id }
          assert:
            - "${status_after_certify} == CERTIFIED_PASS"
            - "${err} == ERR_SEGREGATION_OF_DUTIES"
            - "HTTP status is 403, not the 409 that ERR_ALREADY_TERMINAL would produce"
            - "AssetTest.${test_id}.certified_by_user_id == co-certifier-1 (unchanged)"
            - "AssetTest.${test_id}.status == CERTIFIED_PASS and result == PASS"
            - "Fund.${fund_id}.compliance_posture == COMPLIANT and consecutive_failed_tests == 0"

  - rule_id: boundary_precision_check
    instances:
      - name: asset_test_ratio_exactly_ninety_passes
        grounds:
          - calculations.semiannual_asset_test_ratio
          - validations[priority=13]
          - entities.AssetTest.fields.ratio_pct
          - entities.AssetTest.fields.shortfall_amount
        distinguishing_aspect: |
          Metric: the 90-percent asset-test RATIO measured to 4 dp, at the
          POST /qof/asset-tests/{id}/measure endpoint. Two sibling funds sit one
          hundredth of a percentage point apart (90.0000 vs 89.9900) across the
          inclusive threshold, so an implementation using > instead of >=, or
          rounding the ratio to 2 dp, flips the verdict.
        test_recipe:
          setup:
            - "Fund A, SELF_CERTIFIED, holding exactly 900000.00 of QUALIFIED QOZ_BUSINESS_PROPERTY and 100000.00 of CASH, so the ratio lands exactly on the threshold."
            - "Fund B, SELF_CERTIFIED, holding 899900.00 of QUALIFIED QOZ_BUSINESS_PROPERTY and 100100.00 of CASH, one hundredth of a point below."
            - "One DRAFT AssetTest per fund over [2026-01-01, 2026-07-01) with measurement_date 2026-06-30, both under UNADJUSTED_COST_BASIS."
          setup_api_calls:
            - call: "POST /qof/funds"
              payload: { name: "Boundary Fund A", entity_type: "CORPORATION", manager_user_id: "mgr-fund-1", asset_test_valuation_method: "UNADJUSTED_COST_BASIS" }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { fund_a: $.data.id }
            - call: "POST /qof/funds/${fund_a}/self-certify"
              payload: { first_taxable_month_iso8601: "2026-01-01T00:00:00Z" }
              as: FundManager
              as_user_id: "mgr-fund-1"
            - call: "POST /qof/fund-assets"
              payload: { fund_id: "${fund_a}", asset_class: "QOZ_BUSINESS_PROPERTY", acquisition_date: "2026-01-15T00:00:00Z", unadjusted_cost_basis: 900000.00, afs_fair_value: 900000.00, original_use_in_zone: true }
              as: FundManager
              as_user_id: "mgr-fund-1"
            - call: "POST /qof/fund-assets"
              payload: { fund_id: "${fund_a}", asset_class: "CASH", acquisition_date: "2026-01-15T00:00:00Z", unadjusted_cost_basis: 100000.00, afs_fair_value: 100000.00 }
              as: FundManager
              as_user_id: "mgr-fund-1"
            - call: "POST /qof/funds"
              payload: { name: "Boundary Fund B", entity_type: "CORPORATION", manager_user_id: "mgr-fund-1", asset_test_valuation_method: "UNADJUSTED_COST_BASIS" }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { fund_b: $.data.id }
            - call: "POST /qof/funds/${fund_b}/self-certify"
              payload: { first_taxable_month_iso8601: "2026-01-01T00:00:00Z" }
              as: FundManager
              as_user_id: "mgr-fund-1"
            - call: "POST /qof/fund-assets"
              payload: { fund_id: "${fund_b}", asset_class: "QOZ_BUSINESS_PROPERTY", acquisition_date: "2026-01-15T00:00:00Z", unadjusted_cost_basis: 899900.00, afs_fair_value: 899900.00, original_use_in_zone: true }
              as: FundManager
              as_user_id: "mgr-fund-1"
            - call: "POST /qof/fund-assets"
              payload: { fund_id: "${fund_b}", asset_class: "CASH", acquisition_date: "2026-01-15T00:00:00Z", unadjusted_cost_basis: 100100.00, afs_fair_value: 100100.00 }
              as: FundManager
              as_user_id: "mgr-fund-1"
            - call: "POST /qof/funds/${fund_a}/asset-tests"
              payload: { measurement_date: "2026-06-30T00:00:00Z", period_start: "2026-01-01T00:00:00Z", period_end: "2026-07-01T00:00:00Z" }
              as: ComplianceOfficer
              as_user_id: "co-measurer-1"
              captures: { test_a: $.data.id }
            - call: "POST /qof/funds/${fund_b}/asset-tests"
              payload: { measurement_date: "2026-06-30T00:00:00Z", period_start: "2026-01-01T00:00:00Z", period_end: "2026-07-01T00:00:00Z" }
              as: ComplianceOfficer
              as_user_id: "co-measurer-1"
              captures: { test_b: $.data.id }
          trigger:
            - call: "POST /qof/asset-tests/${test_a}/measure"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "co-measurer-1"
            - call: "POST /qof/asset-tests/${test_b}/measure"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "co-measurer-1"
          assert:
            - "AssetTest.${test_a}.ratio_pct == 90.0000 (exactly at the inclusive threshold)"
            - "AssetTest.${test_a}.result == PASS"
            - "AssetTest.${test_a}.shortfall_amount == 0.00"
            - "AssetTest.${test_a}.failed_month_count == 0"
            - "AssetTest.${test_b}.ratio_pct == 89.9900 (one hundredth of a point below; not rounded up to 90.00)"
            - "AssetTest.${test_b}.result == FAIL"
            - "AssetTest.${test_b}.shortfall_amount == 100.00"
            - "AssetTest.${test_b}.failed_month_count == 6"
            - "both tests report included_asset_count == 2 and total_denominator == 1000000.00"

      - name: deferral_election_day_180_boundary
        grounds:
          - calculations.eligible_gain_investment_deadline
          - validations[priority=19]
          - entities.DeferralElection.fields.days_from_basis
          - entities.EligibleGain.fields.investment_deadline
        distinguishing_aspect: |
          Metric: the 180-DAY INVESTMENT WINDOW measured in whole calendar days,
          at the POST /qof/deferral-elections endpoint — a different metric and
          a different endpoint from the ratio instance. Day 180 is the last
          legal day and day 181 is closed, so an off-by-one on the inclusive
          upper bound is caught in both directions from the same clock instant.
        test_recipe:
          setup:
            - "One ATTESTED Investor and one SELF_CERTIFIED Fund; the fund version is captured at self-certification."
            - "EligibleGain 1 of 100000.00 realized 2026-02-02 on SALE_DATE basis, so investment_deadline is 2026-08-01 and the clock date 2026-08-01 is day 180 exactly."
            - "EligibleGain 2 of 100000.00 realized 2026-02-01 on SALE_DATE basis, so investment_deadline is 2026-07-31 and the clock date is day 181 — one day too late."
          setup_api_calls:
            - call: "POST /qof/investors"
              payload: { legal_name: "Day 180 Investor", taxpayer_type: "INDIVIDUAL", compliance_attestation_status: "ATTESTED" }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { inv_id: $.data.id }
            - call: "POST /qof/funds"
              payload: { name: "Window Boundary Fund", entity_type: "CORPORATION", manager_user_id: "mgr-fund-1" }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { fund_id: $.data.id }
            - call: "POST /qof/funds/${fund_id}/self-certify"
              payload: { first_taxable_month_iso8601: "2026-01-01T00:00:00Z" }
              as: FundManager
              as_user_id: "mgr-fund-1"
              captures: { fund_v1: $.data.version }
            - call: "POST /qof/eligible-gains"
              payload: { investor_id: "${inv_id}", gain_character: "LONG_TERM_CAPITAL", eligible_amount: 100000.00, realization_date: "2026-02-02T00:00:00Z", deadline_basis: "SALE_DATE" }
              as: Investor
              as_user_id: "${inv_id}"
              captures: { gain_on_time: $.data.id, deadline_on_time: $.data.investment_deadline }
            - call: "POST /qof/eligible-gains"
              payload: { investor_id: "${inv_id}", gain_character: "LONG_TERM_CAPITAL", eligible_amount: 100000.00, realization_date: "2026-02-01T00:00:00Z", deadline_basis: "SALE_DATE" }
              as: Investor
              as_user_id: "${inv_id}"
              captures: { gain_late: $.data.id, deadline_late: $.data.investment_deadline }
          trigger:
            - call: "POST /qof/deferral-elections"
              payload: { eligible_gain_id: "${gain_on_time}", fund_id: "${fund_id}", elected_amount: 50000.00, expected_fund_version: "${fund_v1}" }
              as: Investor
              as_user_id: "${inv_id}"
              captures: { elect_id: $.data.id, days_on_time: $.data.days_from_basis }
            - call: "GET /qof/funds/${fund_id}"
              as: FundManager
              as_user_id: "mgr-fund-1"
              captures: { fund_v2: $.data.version }
            - call: "POST /qof/deferral-elections"
              payload: { eligible_gain_id: "${gain_late}", fund_id: "${fund_id}", elected_amount: 50000.00, expected_fund_version: "${fund_v2}" }
              as: Investor
              as_user_id: "${inv_id}"
              captures: { err_late: $.data.error_id }
          assert:
            - "${deadline_on_time} == 2026-08-01T00:00:00Z"
            - "${deadline_late} == 2026-07-31T00:00:00Z"
            - "${days_on_time} == 180 (the last legal day is accepted, HTTP 201)"
            - "DeferralElection.${elect_id}.status == DEFERRED and elected_amount == 50000.00"
            - "EligibleGain.${gain_on_time}.status == PARTIALLY_INVESTED with unelected_amount == 50000.00"
            - "${err_late} == ERR_180_DAY_WINDOW_CLOSED with HTTP 422 (day 181 is rejected)"
            - "EligibleGain.${gain_late}.status == ELIGIBLE with elected_amount == 0.00"
            - "Fund.${fund_id}.version == ${fund_v2} (the rejected election did not bump the fund again)"
            - "Fund.${fund_id}.deferred_gain_committed == 50000.00"

      - name: wcsh_pacing_shortfall_exactly_at_tolerance_survives
        grounds:
          - calculations.wcsh_pacing_compliance
          - state_machines.WorkingCapitalPlan.ACTIVE_to_BLOWN
          - entities.WorkingCapitalPlan.fields.pacing_shortfall
          - entities.QOZBusiness.fields.blown_unspent_amount
        distinguishing_aspect: |
          Metric: the WCSH PACING SHORTFALL in dollars at 2 dp against a
          10-percent tolerance, at the POST /qof/wcsh-plans/{id}/evaluate-checkpoint
          endpoint — a third metric (money, not percentage or days) at a third
          distinct endpoint. The comparison is strictly greater-than, so a
          shortfall of exactly 10000.00 survives while 10000.01 blows the plan,
          and a single cent decides whether unspent capital becomes NQFP.
        test_recipe:
          setup:
            - "One SELF_CERTIFIED Fund with two QOZBusinesses, each declared_nqfp_amount 0.00, total_asset_value 1000000.00 and total_tangible_property_basis 900000.00."
            - "One ACTIVE WorkingCapitalPlan per business, covered_amount 300000.00, window_start 2026-01-01, 3-month schedule of 100000.00 per month, so checkpoint 1 requires 100000.00 and tolerance is 10000.00."
            - "Plan A has spent exactly 90000.00 of OPERATING_WORKING_CAPITAL; plan B has spent 89999.99, one cent less."
          setup_api_calls:
            - call: "POST /qof/funds"
              payload: { name: "Tolerance Fund", entity_type: "PARTNERSHIP", manager_user_id: "mgr-fund-1" }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { fund_id: $.data.id }
            - call: "POST /qof/funds/${fund_id}/self-certify"
              payload: { first_taxable_month_iso8601: "2026-01-01T00:00:00Z" }
              as: FundManager
              as_user_id: "mgr-fund-1"
            - call: "POST /qof/qoz-businesses"
              payload: { fund_id: "${fund_id}", legal_name: "On Pace LLC", zone_tract_code: "12345678904", declared_nqfp_amount: 0.00, total_asset_value: 1000000.00, total_tangible_property_basis: 900000.00 }
              as: FundManager
              as_user_id: "mgr-fund-1"
              captures: { biz_a: $.data.id }
            - call: "POST /qof/qoz-businesses"
              payload: { fund_id: "${fund_id}", legal_name: "One Cent Short LLC", zone_tract_code: "12345678905", declared_nqfp_amount: 0.00, total_asset_value: 1000000.00, total_tangible_property_basis: 900000.00 }
              as: FundManager
              as_user_id: "mgr-fund-1"
              captures: { biz_b: $.data.id }
            - call: "POST /qof/wcsh-plans"
              payload: { qoz_business_id: "${biz_a}", window_start: "2026-01-01T00:00:00Z", covered_amount: 300000.00, written_plan_reference: "WCSH-TOL-A", schedule_month_count: 3, spend_schedule: [ { month_index: 1, planned_amount: 100000.00 }, { month_index: 2, planned_amount: 100000.00 }, { month_index: 3, planned_amount: 100000.00 } ] }
              as: FundManager
              as_user_id: "mgr-fund-1"
              captures: { plan_a: $.data.id }
            - call: "POST /qof/wcsh-plans"
              payload: { qoz_business_id: "${biz_b}", window_start: "2026-01-01T00:00:00Z", covered_amount: 300000.00, written_plan_reference: "WCSH-TOL-B", schedule_month_count: 3, spend_schedule: [ { month_index: 1, planned_amount: 100000.00 }, { month_index: 2, planned_amount: 100000.00 }, { month_index: 3, planned_amount: 100000.00 } ] }
              as: FundManager
              as_user_id: "mgr-fund-1"
              captures: { plan_b: $.data.id }
            - call: "POST /qof/wcsh-plans/${plan_a}/activate"
              payload: {}
              as: FundManager
              as_user_id: "mgr-fund-1"
            - call: "POST /qof/wcsh-plans/${plan_b}/activate"
              payload: {}
              as: FundManager
              as_user_id: "mgr-fund-1"
            - call: "POST /qof/wcsh-plans/${plan_a}/expenditures"
              payload: { amount: 90000.00, expenditure_kind: "OPERATING_WORKING_CAPITAL" }
              as: FundManager
              as_user_id: "mgr-fund-1"
            - call: "POST /qof/wcsh-plans/${plan_b}/expenditures"
              payload: { amount: 89999.99, expenditure_kind: "OPERATING_WORKING_CAPITAL" }
              as: FundManager
              as_user_id: "mgr-fund-1"
          trigger:
            - call: "POST /qof/wcsh-plans/${plan_a}/evaluate-checkpoint"
              payload: { checkpoint_month_index: 1 }
              as: ComplianceOfficer
              as_user_id: "co-measurer-1"
            - call: "POST /qof/wcsh-plans/${plan_b}/evaluate-checkpoint"
              payload: { checkpoint_month_index: 1 }
              as: ComplianceOfficer
              as_user_id: "co-measurer-1"
          assert:
            - "WorkingCapitalPlan.${plan_a}.spent_total == 90000.00 and pacing_shortfall == 10000.00 (exactly the tolerance)"
            - "WorkingCapitalPlan.${plan_a}.status == ACTIVE (strict greater-than, so equality survives)"
            - "WorkingCapitalPlan.${plan_a}.unspent_amount == 210000.00 and last_checkpoint_month_index == 1"
            - "QOZBusiness.${biz_a}.wcsh_protected_amount == 210000.00, blown_unspent_amount == 0.00, nqfp_amount == 0.00"
            - "WorkingCapitalPlan.${plan_b}.spent_total == 89999.99 and pacing_shortfall == 10000.01 (one cent over)"
            - "WorkingCapitalPlan.${plan_b}.status == BLOWN"
            - "WorkingCapitalPlan.${plan_b}.unspent_amount == 210000.01 and last_checkpoint_month_index == 1"
            - "QOZBusiness.${biz_b}.wcsh_protected_amount == 0.00, blown_unspent_amount == 210000.01, nqfp_amount == 210000.01"

  - rule_id: cross_entity_state_dependency
    instances:
      - name: asset_test_measure_requires_self_certified_fund
        grounds:
          - validations[priority=11]
          - state_machines.AssetTest.DRAFT_to_MEASURED
          - state_machines.Fund.DRAFT_to_SELF_CERTIFIED
          - calculations.semiannual_asset_test_ratio
        distinguishing_aspect: |
          Entity pair ASSETTEST -> FUND (certification dimension): the same
          measure request is refused while the parent fund is DRAFT and accepted
          once the fund reaches SELF_CERTIFIED, with nothing about the AssetTest
          itself changing in between. The dependency is on the fund's
          certification_status, not on the test's own status.
        test_recipe:
          setup:
            - "One Fund left in certification_status DRAFT, managed by mgr-fund-1."
            - "One DRAFT AssetTest on that fund over [2026-01-01, 2026-07-01) with measurement_date 2026-06-30 — creation is allowed, measurement is not."
            - "The fund holds no FundAssets at all, so once measurement is permitted the ratio is the empty-denominator case."
          setup_api_calls:
            - call: "POST /qof/funds"
              payload: { name: "Gate Fund", entity_type: "CORPORATION", manager_user_id: "mgr-fund-1", asset_test_valuation_method: "UNADJUSTED_COST_BASIS" }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { fund_id: $.data.id }
            - call: "POST /qof/funds/${fund_id}/asset-tests"
              payload: { measurement_date: "2026-06-30T00:00:00Z", period_start: "2026-01-01T00:00:00Z", period_end: "2026-07-01T00:00:00Z" }
              as: ComplianceOfficer
              as_user_id: "co-measurer-1"
              captures: { test_id: $.data.id, status_at_create: $.data.status }
          trigger:
            - call: "POST /qof/asset-tests/${test_id}/measure"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "co-measurer-1"
              captures: { err: $.data.error_id }
            - call: "POST /qof/funds/${fund_id}/self-certify"
              payload: { first_taxable_month_iso8601: "2026-01-01T00:00:00Z" }
              as: FundManager
              as_user_id: "mgr-fund-1"
            - call: "POST /qof/asset-tests/${test_id}/measure"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "co-measurer-1"
          assert:
            - "${status_at_create} == DRAFT"
            - "${err} == ERR_FUND_NOT_CERTIFIED with HTTP 409 on the first measure attempt"
            - "after the refusal, AssetTest.${test_id}.status == DRAFT and measured_by_user_id == null"
            - "after self-certification the identical request succeeds: AssetTest.${test_id}.status == MEASURED"
            - "AssetTest.${test_id}.included_asset_count == 0, total_denominator == 0.00, qualified_numerator == 0.00"
            - "AssetTest.${test_id}.ratio_pct == 0.0000 and result == FAIL"
            - "AssetTest.${test_id}.shortfall_amount == 0.00 (nothing to make up on an empty denominator) and failed_month_count == 6"
            - "AssetTest.${test_id}.measured_by_user_id == co-measurer-1"
            - "Fund.${fund_id}.last_test_measurement_date == 2026-06-30T00:00:00Z and compliance_posture == UNTESTED"

      - name: deferral_election_blocked_by_investor_attestation
        grounds:
          - validations[priority=16]
          - entities.Investor.fields.compliance_attestation_status
          - state_machines.EligibleGain.ELIGIBLE_to_FULLY_INVESTED
          - calculations.eligible_gain_investment_deadline
        distinguishing_aspect: |
          Entity pair DEFERRALELECTION -> INVESTOR: a different pair from the
          AssetTest/Fund and StepUpElection/Fund instances, and the depended-on
          state is an attestation flag on the acting identity rather than a
          lifecycle status. BLOCKED refuses, ATTESTED admits, byte-identical
          payload both times.
        test_recipe:
          setup:
            - "One Investor created with compliance_attestation_status BLOCKED."
            - "One SELF_CERTIFIED Fund whose version is captured at self-certification."
            - "One EligibleGain of 100000.00 realized 2026-07-01 on SALE_DATE basis, so the clock date 2026-08-01 is day 31 of the window."
          setup_api_calls:
            - call: "POST /qof/investors"
              payload: { legal_name: "Blocked Investor", taxpayer_type: "C_CORPORATION", compliance_attestation_status: "BLOCKED" }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { inv_id: $.data.id }
            - call: "POST /qof/funds"
              payload: { name: "Attestation Fund", entity_type: "CORPORATION", manager_user_id: "mgr-fund-1" }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { fund_id: $.data.id }
            - call: "POST /qof/funds/${fund_id}/self-certify"
              payload: { first_taxable_month_iso8601: "2026-01-01T00:00:00Z" }
              as: FundManager
              as_user_id: "mgr-fund-1"
              captures: { fund_v: $.data.version }
            - call: "POST /qof/eligible-gains"
              payload: { investor_id: "${inv_id}", gain_character: "SECTION_1231_NET", eligible_amount: 100000.00, realization_date: "2026-07-01T00:00:00Z", deadline_basis: "SALE_DATE" }
              as: Investor
              as_user_id: "${inv_id}"
              captures: { gain_id: $.data.id }
          trigger:
            - call: "POST /qof/deferral-elections"
              payload: { eligible_gain_id: "${gain_id}", fund_id: "${fund_id}", elected_amount: 100000.00, expected_fund_version: "${fund_v}" }
              as: Investor
              as_user_id: "${inv_id}"
              captures: { err: $.data.error_id }
            - call: "PATCH /qof/investors/${inv_id}/attestation"
              payload: { compliance_attestation_status: "ATTESTED" }
              as: PlatformAdmin
              as_user_id: "admin-1"
            - call: "POST /qof/deferral-elections"
              payload: { eligible_gain_id: "${gain_id}", fund_id: "${fund_id}", elected_amount: 100000.00, expected_fund_version: "${fund_v}" }
              as: Investor
              as_user_id: "${inv_id}"
              captures: { elect_id: $.data.id, days: $.data.days_from_basis }
          assert:
            - "${err} == ERR_INVESTOR_NOT_ATTESTED with HTTP 422 while the investor is BLOCKED"
            - "the refused attempt created no DeferralElection and left Fund.${fund_id}.version == ${fund_v}"
            - "${days} == 31 on the accepted attempt (HTTP 201)"
            - "DeferralElection.${elect_id}.status == DEFERRED, initial_basis == 0.00, current_basis == 0.00, step_up_applied_pct == 0.0000, holding_tier == UNDER_FIVE"
            - "EligibleGain.${gain_id}.status == FULLY_INVESTED, elected_amount == 100000.00, unelected_amount == 0.00"
            - "Investor.${inv_id}.deferred_gain_outstanding == 100000.00"
            - "Fund.${fund_id}.deferred_gain_committed == 100000.00"

      - name: step_up_denied_because_fund_decertified
        grounds:
          - calculations.ten_year_step_up_grant
          - state_machines.Fund.SELF_CERTIFIED_to_DECERTIFIED
          - entities.StepUpElection.fields.denial_reason
          - calculations.inclusion_event_amount
        distinguishing_aspect: |
          Entity pair STEPUPELECTION -> FUND (certification dimension read at
          request time, ten years after the election was made): a third distinct
          pair, and the dependency is evaluated in a pinned order — the hold
          length is satisfied at exactly 3653 days, so the denial can only come
          from the fund's DECERTIFIED status, and it outranks the
          PRIOR_FULL_INCLUSION reason that the decertification itself created.
        test_recipe:
          setup:
            - "One ATTESTED Investor and one SELF_CERTIFIED Fund."
            - "One EligibleGain of 400000.00 realized 2026-07-01, fully elected on the clock date 2026-08-01, so investment_date is 2026-08-01."
            - "The logical clock is then advanced to 2036-08-01, exactly 3653 days later."
            - "A ComplianceOfficer decertifies the fund at that instant, which mints a FUND_DECERTIFICATION InclusionEvent on the election."
          setup_api_calls:
            - call: "POST /qof/investors"
              payload: { legal_name: "Ten Year Investor", taxpayer_type: "INDIVIDUAL", compliance_attestation_status: "ATTESTED" }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { inv_id: $.data.id }
            - call: "POST /qof/funds"
              payload: { name: "Decert Step Up Fund", entity_type: "CORPORATION", manager_user_id: "mgr-fund-1" }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { fund_id: $.data.id }
            - call: "POST /qof/funds/${fund_id}/self-certify"
              payload: { first_taxable_month_iso8601: "2026-01-01T00:00:00Z" }
              as: FundManager
              as_user_id: "mgr-fund-1"
              captures: { fund_v: $.data.version }
            - call: "POST /qof/eligible-gains"
              payload: { investor_id: "${inv_id}", gain_character: "LONG_TERM_CAPITAL", eligible_amount: 400000.00, realization_date: "2026-07-01T00:00:00Z", deadline_basis: "SALE_DATE" }
              as: Investor
              as_user_id: "${inv_id}"
              captures: { gain_id: $.data.id }
            - call: "POST /qof/deferral-elections"
              payload: { eligible_gain_id: "${gain_id}", fund_id: "${fund_id}", elected_amount: 400000.00, expected_fund_version: "${fund_v}" }
              as: Investor
              as_user_id: "${inv_id}"
              captures: { elect_id: $.data.id }
            - call: "POST /qof/_clock/set_current_utc"
              payload: { current_utc: "2036-08-01T00:00:00Z" }
              as: PlatformAdmin
              as_user_id: "admin-1"
            - call: "POST /qof/funds/${fund_id}/decertify"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "co-certifier-1"
            - call: "GET /qof/deferral-elections/${elect_id}/inclusion-events"
              as: Investor
              as_user_id: "${inv_id}"
              captures: { ie_id: "$.data[0].id", ie_type: "$.data[0].event_type" }
          trigger:
            - call: "POST /qof/deferral-elections/${elect_id}/step-up-elections"
              payload: { claimed_fmv: 900000.00 }
              as: Investor
              as_user_id: "${inv_id}"
              captures: { su_id: $.data.id, su_status: $.data.status, su_reason: $.data.denial_reason }
          assert:
            - "${su_status} == DENIED and ${su_reason} == FUND_DECERTIFIED (HTTP 201 — the row is recorded, not rejected)"
            - "StepUpElection.${su_id}.holding_period_days == 3653 (the ten-year hold IS met, so HOLD_UNDER_TEN_YEARS is not the reason)"
            - "StepUpElection.${su_id}.stepped_up_basis == 0.00 and election_date == 2036-08-01T00:00:00Z"
            - "the denial_reason is FUND_DECERTIFIED and not PRIOR_FULL_INCLUSION, because the fund check precedes the inclusion check in the pinned order"
            - "DeferralElection.${elect_id}.status == INCLUDED_FULL, current_basis == 0.00, step_up_applied_pct == 0.0000"
            - "${ie_type} == FUND_DECERTIFICATION; InclusionEvent.${ie_id}.holding_days == 3653, holding_tier_applied == TEN_YEAR, basis_offset_amount == 60000.00, gross_inclusion_amount == 400000.00, net_inclusion_amount == 340000.00, is_full == true"
            - "Investor.${inv_id}.deferred_gain_outstanding == 0.00"
            - "Fund.${fund_id}.certification_status == DECERTIFIED"

  - rule_id: resource_temporal_overlap
    instances:
      - name: asset_test_period_half_open_adjacency_allowed
        grounds:
          - validations[priority=21]
          - entities.AssetTest.fields.period_start
          - entities.AssetTest.fields.period_end
        distinguishing_aspect: |
          Resource: the FUND, with HALF-OPEN interval semantics
          [period_start, period_end). Adjacency is LEGAL — back-to-back
          semiannual periods share the boundary instant — while any interior
          intersection collides and a zero-width period is refused. Different
          resource and opposite adjacency rule from the ImprovementProject
          instance below.
        test_recipe:
          setup:
            - "One SELF_CERTIFIED Fund managed by mgr-fund-1, with no AssetTest rows yet."
          setup_api_calls:
            - call: "POST /qof/funds"
              payload: { name: "Half Open Fund", entity_type: "CORPORATION", manager_user_id: "mgr-fund-1" }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { fund_id: $.data.id }
            - call: "POST /qof/funds/${fund_id}/self-certify"
              payload: { first_taxable_month_iso8601: "2026-01-01T00:00:00Z" }
              as: FundManager
              as_user_id: "mgr-fund-1"
            - call: "POST /qof/funds/${fund_id}/asset-tests"
              payload: { measurement_date: "2026-06-30T00:00:00Z", period_start: "2026-01-01T00:00:00Z", period_end: "2026-07-01T00:00:00Z" }
              as: ComplianceOfficer
              as_user_id: "co-measurer-1"
              captures: { test_h1: $.data.id }
          trigger:
            - call: "POST /qof/funds/${fund_id}/asset-tests"
              payload: { measurement_date: "2026-12-31T00:00:00Z", period_start: "2026-07-01T00:00:00Z", period_end: "2027-01-01T00:00:00Z" }
              as: ComplianceOfficer
              as_user_id: "co-measurer-1"
              captures: { test_h2: $.data.id }
            - call: "POST /qof/funds/${fund_id}/asset-tests"
              payload: { measurement_date: "2026-07-31T00:00:00Z", period_start: "2026-06-01T00:00:00Z", period_end: "2026-08-01T00:00:00Z" }
              as: ComplianceOfficer
              as_user_id: "co-measurer-1"
              captures: { err_interior: $.data.error_id }
            - call: "POST /qof/funds/${fund_id}/asset-tests"
              payload: { measurement_date: "2027-01-01T00:00:00Z", period_start: "2027-01-01T00:00:00Z", period_end: "2027-01-01T00:00:00Z" }
              as: ComplianceOfficer
              as_user_id: "co-measurer-1"
              captures: { err_zero_width: $.data.error_id }
          assert:
            - "AssetTest.${test_h2}.status == DRAFT (HTTP 201 — period_start equal to the previous period_end is accepted under half-open semantics)"
            - "AssetTest.${test_h2}.period_start == 2026-07-01T00:00:00Z and period_end == 2027-01-01T00:00:00Z"
            - "${err_interior} == ERR_TESTING_PERIOD_OVERLAP with HTTP 409 (the [2026-06-01, 2026-08-01) window intersects both existing periods)"
            - "${err_zero_width} == ERR_TESTING_PERIOD_OVERLAP with HTTP 409 (period_start must be strictly before period_end)"
            - "exactly 2 AssetTest rows exist for Fund.${fund_id}, ${test_h1} and ${test_h2}"

      - name: improvement_window_closed_interval_adjacency_collides
        grounds:
          - validations[priority=22]
          - calculations.substantial_improvement_ratio
          - state_machines.ImprovementProject.OPEN_to_SATISFIED
          - state_machines.FundAsset.HELD_to_IMPROVING
          - concurrency_rules[improvement-expenditure-stale-project]
        distinguishing_aspect: |
          Resource: the FUNDASSET, with CLOSED interval semantics
          [window_start, window_end - 1 day]. Adjacency is REJECTED — the exact
          inverse of the half-open AssetTest rule on the Fund resource — so a
          new window starting on the previous window's last inclusive day
          collides while one starting a day later is legal.
        test_recipe:
          setup:
            - "One SELF_CERTIFIED Fund managed by mgr-fund-1."
            - "One QOZ_BUSINESS_PROPERTY FundAsset with original_use_in_zone false and unadjusted_cost_basis 500000.00, so substantial improvement applies."
            - "One ImprovementProject on that asset, ASSET_BY_ASSET, window_start 2026-01-01 so window_end is 2028-07-01 and the closed window is [2026-01-01, 2028-06-30]; its version is captured for the OCC expenditure write."
            - "A single CAPITALIZED_IMPROVEMENT expenditure of 600000.00 is posted and the project is evaluated to SATISFIED, which returns the asset to HELD."
          setup_api_calls:
            - call: "POST /qof/funds"
              payload: { name: "Closed Window Fund", entity_type: "CORPORATION", manager_user_id: "mgr-fund-1" }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { fund_id: $.data.id }
            - call: "POST /qof/funds/${fund_id}/self-certify"
              payload: { first_taxable_month_iso8601: "2026-01-01T00:00:00Z" }
              as: FundManager
              as_user_id: "mgr-fund-1"
            - call: "POST /qof/fund-assets"
              payload: { fund_id: "${fund_id}", asset_class: "QOZ_BUSINESS_PROPERTY", acquisition_date: "2026-01-01T00:00:00Z", unadjusted_cost_basis: 500000.00, afs_fair_value: 500000.00, original_use_in_zone: false }
              as: FundManager
              as_user_id: "mgr-fund-1"
              captures: { asset_id: $.data.id }
            - call: "POST /qof/improvement-projects"
              payload: { fund_asset_id: "${asset_id}", window_start: "2026-01-01T00:00:00Z", aggregation_method: "ASSET_BY_ASSET" }
              as: FundManager
              as_user_id: "mgr-fund-1"
              captures: { p1_id: $.data.id, p1_v: $.data.version, p1_end: $.data.window_end }
            - call: "POST /qof/improvement-projects/${p1_id}/expenditures"
              payload: { amount: 600000.00, expenditure_kind: "CAPITALIZED_IMPROVEMENT", expected_project_version: "${p1_v}" }
              as: FundManager
              as_user_id: "mgr-fund-1"
            - call: "POST /qof/improvement-projects/${p1_id}/evaluate"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "co-measurer-1"
          trigger:
            - call: "POST /qof/improvement-projects"
              payload: { fund_asset_id: "${asset_id}", window_start: "2028-06-30T00:00:00Z", aggregation_method: "ASSET_BY_ASSET" }
              as: FundManager
              as_user_id: "mgr-fund-1"
              captures: { err_adjacent: $.data.error_id }
            - call: "POST /qof/improvement-projects"
              payload: { fund_asset_id: "${asset_id}", window_start: "2028-07-01T00:00:00Z", aggregation_method: "ASSET_BY_ASSET" }
              as: FundManager
              as_user_id: "mgr-fund-1"
              captures: { p2_id: $.data.id, p2_end: $.data.window_end }
          assert:
            - "${p1_end} == 2028-07-01T00:00:00Z (30 calendar months, exclusive)"
            - "ImprovementProject.${p1_id}.qualified_additions_total == 600000.00, basis_at_acquisition == 500000.00, improvement_ratio_pct == 120.0000, status == SATISFIED"
            - "after the SATISFIED evaluation FundAsset.${asset_id}.status == HELD and qualification == QUALIFIED"
            - "${err_adjacent} == ERR_IMPROVEMENT_WINDOW_OVERLAP with HTTP 409 (window_start 2028-06-30 is the previous window's last inclusive day; a SATISFIED project still blocks)"
            - "the accepted project is created with HTTP 201: ${p2_end} == 2031-01-01T00:00:00Z"
            - "ImprovementProject.${p2_id}.status == OPEN and improvement_ratio_pct == 0.0000"
            - "FundAsset.${asset_id}.status == IMPROVING and qualification == IMPROVEMENT_PENDING again"

      - name: wcsh_aggregate_capacity_over_overlapping_plans
        grounds:
          - validations[priority=36]
          - entities.WorkingCapitalPlan.fields.covered_amount
          - entities.QOZBusiness.fields.total_asset_value
        distinguishing_aspect: |
          Resource: the QOZBUSINESS, with AGGREGATE-CAPACITY semantics rather
          than pairwise interval comparison: overlapping windows are perfectly
          legal, and only the summed covered_amount over the months a window
          touches is capped at 31 percent of total_asset_value. Two overlapping
          plans pass, the third breaches the aggregate, and a smaller third plan
          landing exactly on the cap is admitted.
        test_recipe:
          setup:
            - "One SELF_CERTIFIED Fund and one QOZBusiness with total_asset_value 1000000.00, so the aggregate cap is 310000.00."
            - "Two DRAFT WorkingCapitalPlans of covered_amount 150000.00 each with deliberately overlapping windows (window_start 2026-01-01 and 2026-02-01), summing to 300000.00 of committed capacity."
          setup_api_calls:
            - call: "POST /qof/funds"
              payload: { name: "Aggregate Cap Fund", entity_type: "PARTNERSHIP", manager_user_id: "mgr-fund-1" }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { fund_id: $.data.id }
            - call: "POST /qof/funds/${fund_id}/self-certify"
              payload: { first_taxable_month_iso8601: "2026-01-01T00:00:00Z" }
              as: FundManager
              as_user_id: "mgr-fund-1"
            - call: "POST /qof/qoz-businesses"
              payload: { fund_id: "${fund_id}", legal_name: "Capacity Works LLC", zone_tract_code: "12345678906", declared_nqfp_amount: 0.00, total_asset_value: 1000000.00, total_tangible_property_basis: 900000.00 }
              as: FundManager
              as_user_id: "mgr-fund-1"
              captures: { biz_id: $.data.id }
            - call: "POST /qof/wcsh-plans"
              payload: { qoz_business_id: "${biz_id}", window_start: "2026-01-01T00:00:00Z", covered_amount: 150000.00, written_plan_reference: "WCSH-CAP-1", schedule_month_count: 3, spend_schedule: [ { month_index: 1, planned_amount: 50000.00 }, { month_index: 2, planned_amount: 50000.00 }, { month_index: 3, planned_amount: 50000.00 } ] }
              as: FundManager
              as_user_id: "mgr-fund-1"
              captures: { plan_1: $.data.id }
            - call: "POST /qof/wcsh-plans"
              payload: { qoz_business_id: "${biz_id}", window_start: "2026-02-01T00:00:00Z", covered_amount: 150000.00, written_plan_reference: "WCSH-CAP-2", schedule_month_count: 3, spend_schedule: [ { month_index: 1, planned_amount: 50000.00 }, { month_index: 2, planned_amount: 50000.00 }, { month_index: 3, planned_amount: 50000.00 } ] }
              as: FundManager
              as_user_id: "mgr-fund-1"
              captures: { plan_2: $.data.id }
          trigger:
            - call: "POST /qof/wcsh-plans"
              payload: { qoz_business_id: "${biz_id}", window_start: "2026-03-01T00:00:00Z", covered_amount: 20000.00, written_plan_reference: "WCSH-CAP-3-TOO-BIG", schedule_month_count: 1, spend_schedule: [ { month_index: 1, planned_amount: 20000.00 } ] }
              as: FundManager
              as_user_id: "mgr-fund-1"
              captures: { err_cap: $.data.error_id }
            - call: "POST /qof/wcsh-plans"
              payload: { qoz_business_id: "${biz_id}", window_start: "2026-03-01T00:00:00Z", covered_amount: 10000.00, written_plan_reference: "WCSH-CAP-4-EXACT", schedule_month_count: 1, spend_schedule: [ { month_index: 1, planned_amount: 10000.00 } ] }
              as: FundManager
              as_user_id: "mgr-fund-1"
              captures: { plan_4: $.data.id }
          assert:
            - "WorkingCapitalPlan.${plan_1}.status == DRAFT and WorkingCapitalPlan.${plan_2}.status == DRAFT (overlapping windows are legal on their own)"
            - "${err_cap} == ERR_WCSH_AGGREGATE_CAP_EXCEEDED with HTTP 422 (300000.00 + 20000.00 = 320000.00 exceeds the 310000.00 cap in the overlapped months)"
            - "the fourth plan is accepted with HTTP 201: WorkingCapitalPlan.${plan_4}.covered_amount == 10000.00, bringing the overlapped-month total to exactly 310000.00"
            - "WorkingCapitalPlan.${plan_4}.status == DRAFT and schedule_month_count == 1"
            - "exactly 3 WorkingCapitalPlan rows exist for QOZBusiness.${biz_id}"
            - "QOZBusiness.${biz_id}.wcsh_protected_amount == 0.00 (no plan is ACTIVE yet) and nqfp_amount == 0.00"

  - rule_id: compensating_invariant
    instances:
      - name: eligible_gain_dollars_conserved_across_revocation
        grounds:
          - calculations.eligible_gain_conservation_invariant
          - state_machines.DeferralElection.DEFERRED_to_REVOKED
          - state_machines.EligibleGain.FULLY_INVESTED_to_PARTIALLY_INVESTED
          - state_machines.EligibleGain.PARTIALLY_INVESTED_to_ELIGIBLE
        distinguishing_aspect: |
          Conserved quantity: DOLLARS of eligible gain on one EligibleGain row
          (a money quantity). Two forward elections are unwound one at a time by
          the compensating revoke action, and both the gain's split and the
          Investor / Fund rollups return bit-identically to their pre-election
          values with no cent of drift.
        test_recipe:
          setup:
            - "One ATTESTED Investor and one SELF_CERTIFIED Fund whose version is captured at self-certification."
            - "One EligibleGain of 400000.00 realized 2026-07-01 on SALE_DATE basis, window wide open at the clock date 2026-08-01."
            - "Two elections against that single gain — 250000.00 then 150000.00 — with the fund version re-read between them because the first election bumps Fund.version."
          setup_api_calls:
            - call: "POST /qof/investors"
              payload: { legal_name: "Conservation Investor", taxpayer_type: "INDIVIDUAL", compliance_attestation_status: "ATTESTED" }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { inv_id: $.data.id }
            - call: "POST /qof/funds"
              payload: { name: "Conservation Fund", entity_type: "CORPORATION", manager_user_id: "mgr-fund-1" }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { fund_id: $.data.id }
            - call: "POST /qof/funds/${fund_id}/self-certify"
              payload: { first_taxable_month_iso8601: "2026-01-01T00:00:00Z" }
              as: FundManager
              as_user_id: "mgr-fund-1"
              captures: { fund_v1: $.data.version }
            - call: "POST /qof/eligible-gains"
              payload: { investor_id: "${inv_id}", gain_character: "LONG_TERM_CAPITAL", eligible_amount: 400000.00, realization_date: "2026-07-01T00:00:00Z", deadline_basis: "SALE_DATE" }
              as: Investor
              as_user_id: "${inv_id}"
              captures: { gain_id: $.data.id, unelected_before: $.data.unelected_amount }
            - call: "POST /qof/deferral-elections"
              payload: { eligible_gain_id: "${gain_id}", fund_id: "${fund_id}", elected_amount: 250000.00, expected_fund_version: "${fund_v1}" }
              as: Investor
              as_user_id: "${inv_id}"
              captures: { elect_1: $.data.id }
            - call: "GET /qof/funds/${fund_id}"
              as: FundManager
              as_user_id: "mgr-fund-1"
              captures: { fund_v2: $.data.version }
            - call: "POST /qof/deferral-elections"
              payload: { eligible_gain_id: "${gain_id}", fund_id: "${fund_id}", elected_amount: 150000.00, expected_fund_version: "${fund_v2}" }
              as: Investor
              as_user_id: "${inv_id}"
              captures: { elect_2: $.data.id }
          trigger:
            - call: "POST /qof/deferral-elections/${elect_2}/revoke"
              payload: { revoked_reason_code: "INVESTOR_WITHDRAWAL" }
              as: Investor
              as_user_id: "${inv_id}"
            - call: "POST /qof/deferral-elections/${elect_1}/revoke"
              payload: { revoked_reason_code: "INVESTOR_WITHDRAWAL" }
              as: Investor
              as_user_id: "${inv_id}"
          assert:
            - "${unelected_before} == 400000.00"
            - "after the forward pair — EligibleGain.${gain_id}.status was FULLY_INVESTED with elected_amount 400000.00 and unelected_amount 0.00"
            - "after the first revoke — EligibleGain.${gain_id}.status == PARTIALLY_INVESTED, elected_amount == 250000.00, unelected_amount == 150000.00; Investor.${inv_id}.deferred_gain_outstanding == 250000.00; Fund.${fund_id}.deferred_gain_committed == 250000.00"
            - "after the second revoke — EligibleGain.${gain_id}.status == ELIGIBLE, elected_amount == 0.00, unelected_amount == 400000.00 == ${unelected_before} (bit-identical to the pre-forward value)"
            - "DeferralElection.${elect_1}.status == REVOKED with revoked_reason_code == INVESTOR_WITHDRAWAL and deferred_remaining == 0.00"
            - "DeferralElection.${elect_2}.status == REVOKED with revoked_reason_code == INVESTOR_WITHDRAWAL and deferred_remaining == 0.00"
            - "Investor.${inv_id}.deferred_gain_outstanding == 0.00 and included_gain_total == 0.00 (a revocation is not an inclusion)"
            - "Fund.${fund_id}.deferred_gain_committed == 0.00"
            - "the invariant holds at every step: eligible_amount == unelected_amount + sum(elected_amount of non-REVOKED elections)"

      - name: noncompliance_months_conserved_across_cure_approval
        grounds:
          - calculations.noncompliance_month_conservation_invariant
          - calculations.penalty_cure_credit_netting
          - state_machines.PenaltyAssessment.CURE_REQUESTED_to_CURED
          - state_machines.Fund.CURE_PENDING_to_COMPLIANT
        distinguishing_aspect: |
          Conserved quantity: WHOLE MONTHS of noncompliance on one Fund (an
          integer count, not a money amount — a different quantity type from the
          eligible-gain dollars instance). The forward action is a certified
          failing asset test and the compensating action is an APPROVED cure,
          which must remove exactly the months it added while the underlying
          CERTIFIED_FAIL test remains on the record.
        test_recipe:
          setup:
            - "One SELF_CERTIFIED Fund holding 800000.00 of QUALIFIED QOZ_BUSINESS_PROPERTY and 200000.00 of CASH, so a test measures 80.0000 with shortfall 100000.00."
            - "One AssetTest over [2026-01-01, 2026-07-01) measured by co-measurer-1 and certified FAIL by co-certifier-1, which mints a PenaltyAssessment with failed_month_count 6 and gross_penalty_amount 4000.02 and drives Fund.cumulative_penalty_months to 6."
            - "A cure request on REASONABLE_CAUSE basis, leaving the assessment CURE_REQUESTED and the fund CURE_PENDING."
          setup_api_calls:
            - call: "POST /qof/funds"
              payload: { name: "Month Conservation Fund", entity_type: "CORPORATION", manager_user_id: "mgr-fund-1", asset_test_valuation_method: "UNADJUSTED_COST_BASIS" }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { fund_id: $.data.id }
            - call: "POST /qof/funds/${fund_id}/self-certify"
              payload: { first_taxable_month_iso8601: "2026-01-01T00:00:00Z" }
              as: FundManager
              as_user_id: "mgr-fund-1"
            - call: "GET /qof/funds/${fund_id}"
              as: FundManager
              as_user_id: "mgr-fund-1"
              captures: { months_before: $.data.cumulative_penalty_months }
            - call: "POST /qof/fund-assets"
              payload: { fund_id: "${fund_id}", asset_class: "QOZ_BUSINESS_PROPERTY", acquisition_date: "2026-01-15T00:00:00Z", unadjusted_cost_basis: 800000.00, afs_fair_value: 800000.00, original_use_in_zone: true }
              as: FundManager
              as_user_id: "mgr-fund-1"
            - call: "POST /qof/fund-assets"
              payload: { fund_id: "${fund_id}", asset_class: "CASH", acquisition_date: "2026-01-15T00:00:00Z", unadjusted_cost_basis: 200000.00, afs_fair_value: 200000.00 }
              as: FundManager
              as_user_id: "mgr-fund-1"
            - call: "POST /qof/funds/${fund_id}/asset-tests"
              payload: { measurement_date: "2026-06-30T00:00:00Z", period_start: "2026-01-01T00:00:00Z", period_end: "2026-07-01T00:00:00Z" }
              as: ComplianceOfficer
              as_user_id: "co-measurer-1"
              captures: { test_id: $.data.id }
            - call: "POST /qof/asset-tests/${test_id}/measure"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "co-measurer-1"
            - call: "POST /qof/asset-tests/${test_id}/certify"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "co-certifier-1"
            - call: "GET /qof/penalty-assessments?fund_id=${fund_id}"
              as: ComplianceOfficer
              as_user_id: "co-certifier-1"
              captures: { pa_id: "$.data[0].id", months_added: "$.data[0].failed_month_count" }
            - call: "POST /qof/penalty-assessments/${pa_id}/cure-requests"
              payload: { cure_basis: "REASONABLE_CAUSE", narrative_reference: "MEMO-CURE-APPROVE-01" }
              as: FundManager
              as_user_id: "mgr-fund-1"
          trigger:
            - call: "POST /qof/penalty-assessments/${pa_id}/cure-decisions"
              payload: { decision: "APPROVE" }
              as: ComplianceOfficer
              as_user_id: "co-certifier-1"
          assert:
            - "${months_before} == 0 and ${months_added} == 6"
            - "after the forward action — PenaltyAssessment.${pa_id}.gross_penalty_amount == 4000.02, monthly_penalty_amount == 666.67, Fund.${fund_id}.cumulative_penalty_months == 6"
            - "PenaltyAssessment.${pa_id}.status == CURED"
            - "PenaltyAssessment.${pa_id}.cure_credit_amount == 2400.01 (60 percent of the GROSS figure, tier taken from gross)"
            - "PenaltyAssessment.${pa_id}.net_penalty_amount == 1600.01"
            - "PenaltyAssessment.${pa_id}.cure_attempt_count == 1 and cure_basis == REASONABLE_CAUSE"
            - "Fund.${fund_id}.cumulative_penalty_months == 0 == ${months_before} (exactly the 6 months added are removed, no drift)"
            - "Fund.${fund_id}.compliance_posture == COMPLIANT and consecutive_failed_tests == 0"
            - "AssetTest.${test_id}.status == CERTIFIED_FAIL with result FAIL and failed_month_count 6 (the historical record is not rewritten)"
            - "the invariant holds: cumulative_penalty_months == sum(failed_month_count over PenaltyAssessments in ASSESSED / CURE_REQUESTED / UPHELD), and the CURED row is excluded"
