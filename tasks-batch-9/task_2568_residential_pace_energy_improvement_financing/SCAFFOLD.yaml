    applies_to: ["POST /pace/applications", "POST /pace/disbursements", "POST /pace/disbursements/{id}/release"]
  - id: ERR_INVALID_SUPERSEDE_TARGET
    http_status: 422
    condition: "supersedes_application_id is on another parcel or its status is not DECLINED/WITHDRAWN"
