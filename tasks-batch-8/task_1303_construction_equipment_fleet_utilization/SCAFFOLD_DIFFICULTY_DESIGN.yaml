  # ===========================================================================
  # Rule 8 — resource_temporal_overlap (2 instances, different interval semantics)
  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: assignment_half_open_adjacency_allowed_overlap_rejected
        grounds:
          - calculations.transport_overlap
          - validations[priority=10]
          - errors[ERR_ASSIGNMENT_OVERLAP]
        distinguishing_aspect: |
          Resource Equipment, HALF-OPEN day-granularity semantics
          ([start_date, end_date)): with a non-terminal SUSPENDED assignment
          occupying [08-03, 08-10) on the unit, a new window [08-05, 08-12) is
          rejected ERR_ASSIGNMENT_OVERLAP while the adjacent window
          [08-10, 08-15) (start == existing end) is ACCEPTED — adjacency is
          not overlap under half-open semantics.
        test_recipe:
          setup:
            - "Class C19 daily_rate_cents=10000 service_interval_hours=10000; Project P19 budget 100000000; Equipment E19 OWNED"
            - "Assignment A19 [2026-08-03, 2026-08-10) ACTIVE on 08-03, then P19 SUSPENDED, then E19 marked DOWN (A19 SUSPENDED), then REPAIR WorkOrder completed: E19 back to IDLE but A19 STAYS SUSPENDED because P19 is not OPEN — the only way IDLE coexists with a non-terminal assignment"
          setup_api_calls:
            - call: "POST /fleet/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T09:00:00Z" }
              as: FleetAdmin
            - call: "POST /fleet/equipment-classes"
              payload: { class_code: "EXC-490", daily_rate_cents: 10000, external_daily_rate_cents: 12000, weekend_multiplier_bp: 5000, idle_day_multiplier_bp: 5000, service_interval_hours: 10000, idle_alert_utilization_bp: 3000, expected_life_hours: 10000, salvage_value_cents: 500000 }
              as: FleetAdmin
              captures: { c19_id: $.data.id }
            - call: "POST /fleet/projects"
              payload: { project_code: "PRJ-P", name: "Project P", equipment_budget_cents: 100000000 }
              as: FleetAdmin
              captures: { p19_id: $.data.id }
            - call: "POST /fleet/equipment"
              payload: { unit_tag: "UNIT-19", class_id: "${c19_id}", ownership: "OWNED", acquisition_cost_cents: 10000000, acquisition_date: "2026-01-01", useful_life_months: 60 }
              as: FleetAdmin
              captures: { e19_id: $.data.id, e19_v: $.data.version }
            - call: "POST /fleet/assignments"
              payload: { equipment_id: "${e19_id}", project_id: "${p19_id}", start_date: "2026-08-03", end_date: "2026-08-10", expected_equipment_version: "${e19_v}" }
              as: FleetAdmin
              captures: { a19_id: $.data.id }
            - call: "POST /fleet/assignments/${a19_id}/activate"
              as: FleetAdmin
            - call: "POST /fleet/projects/${p19_id}/suspend"
              as: FleetAdmin
            - call: "POST /fleet/equipment/${e19_id}/mark-down"
              as: FleetAdmin
            - call: "POST /fleet/mechanics"
              payload: { mechanic_code: "MECH-19", name: "Mac Nineteen", home_project_id: "${p19_id}" }
              as: FleetAdmin
              captures: { m19_id: $.data.id }
            - call: "POST /fleet/work-orders"
              payload: { equipment_id: "${e19_id}", kind: "REPAIR", notes: "w19" }
              as: FleetAdmin
              captures: { w19_id: $.data.id }
            - call: "POST /fleet/work-orders/${w19_id}/dispatch"
              payload: { mechanic_id: "${m19_id}" }
              as: FleetAdmin
            - call: "POST /fleet/work-orders/${w19_id}/start"
              as: Mechanic
              as_user_id: "${m19_id}"
            - call: "POST /fleet/work-orders/${w19_id}/complete"
              as: Mechanic
              as_user_id: "${m19_id}"
            - call: "GET /fleet/equipment/${e19_id}"
              as: FleetAdmin
              captures: { e19_v_now: $.data.version }
          trigger:
            - call: "POST /fleet/assignments"
              payload: { equipment_id: "${e19_id}", project_id: "${p19_id}", start_date: "2026-08-05", end_date: "2026-08-12", expected_equipment_version: "${e19_v_now}" }
              as: FleetAdmin
              captures: { err: $.data.error_id }
            - call: "POST /fleet/assignments"
              payload: { equipment_id: "${e19_id}", project_id: "${p19_id}", start_date: "2026-08-10", end_date: "2026-08-15", expected_equipment_version: "${e19_v_now}" }
              as: FleetAdmin
              captures: { a19b_id: $.data.id, a19b_status: $.data.status }
          assert:
            - "Overlapping window [08-05, 08-12): error_id == ERR_ASSIGNMENT_OVERLAP, http 409 (08-05 < 08-10 and 08-03 < 08-12)"
            - "Adjacent window [08-10, 08-15): 201, status == RESERVED — end_date == other.start_date does NOT overlap under half-open semantics"
            - "The rejected attempt left version untouched, so the second create with the same captured version succeeds"
            - "Assignment.${a19_id}.status == SUSPENDED throughout (P19 SUSPENDED blocked reactivation at repair time)"

      - name: lowboy_buffered_interval_exact_departure_allowed
        grounds:
          - calculations.transport_overlap
          - validations[priority=11]
          - errors[ERR_TRANSPORT_CONFLICT]
        distinguishing_aspect: |
          Resource Lowboy, CLOSED timestamp interval + 4h TURNAROUND buffer,
          half-open at the buffered end — a DIFFERENT geometry from the
          assignment half-open day window: with job T1 occupying
          [08-10T08:00Z, 12:00Z + 4h), a job departing 15:59Z conflicts
          (ERR_TRANSPORT_CONFLICT) while departure at EXACTLY 16:00Z (the
          buffered end) is allowed.
        test_recipe:
          setup:
            - "Class C20; Projects P_SRC and P_DST OPEN budget 100000000; Lowboy L20 AVAILABLE capacity 1"
            - "Equipments E20a and E20b each completed an assignment at P_SRC (both IDLE, current_site_id == P_SRC)"
          setup_api_calls:
            - call: "POST /fleet/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T09:00:00Z" }
              as: FleetAdmin
            - call: "POST /fleet/equipment-classes"
              payload: { class_code: "EXC-500", daily_rate_cents: 10000, external_daily_rate_cents: 12000, weekend_multiplier_bp: 5000, idle_day_multiplier_bp: 5000, service_interval_hours: 10000, idle_alert_utilization_bp: 3000, expected_life_hours: 10000, salvage_value_cents: 500000 }
              as: FleetAdmin
              captures: { c20_id: $.data.id }
            - call: "POST /fleet/projects"
              payload: { project_code: "PRJ-SRC", name: "Source Yard", equipment_budget_cents: 100000000 }
              as: FleetAdmin
              captures: { p_src_id: $.data.id }
            - call: "POST /fleet/projects"
              payload: { project_code: "PRJ-D2", name: "Dest Two", equipment_budget_cents: 100000000 }
              as: FleetAdmin
              captures: { p_dst20_id: $.data.id }
            - call: "POST /fleet/lowboys"
              payload: { lowboy_code: "LB-20", capacity_units: 1 }
              as: Dispatcher
              captures: { l20_id: $.data.id }
            - call: "POST /fleet/equipment"
              payload: { unit_tag: "UNIT-20A", class_id: "${c20_id}", ownership: "OWNED", acquisition_cost_cents: 10000000, acquisition_date: "2026-01-01", useful_life_months: 60 }
              as: FleetAdmin
              captures: { e20a_id: $.data.id, e20a_v: $.data.version }
            - call: "POST /fleet/equipment"
              payload: { unit_tag: "UNIT-20B", class_id: "${c20_id}", ownership: "OWNED", acquisition_cost_cents: 10000000, acquisition_date: "2026-01-01", useful_life_months: 60 }
              as: FleetAdmin
              captures: { e20b_id: $.data.id, e20b_v: $.data.version }
            - call: "POST /fleet/assignments"
              payload: { equipment_id: "${e20a_id}", project_id: "${p_src_id}", start_date: "2026-08-03", end_date: "2026-08-10", expected_equipment_version: "${e20a_v}" }
              as: FleetAdmin
              captures: { a20a_id: $.data.id }
            - call: "POST /fleet/assignments/${a20a_id}/activate"
              as: FleetAdmin
            - call: "POST /fleet/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-04T09:00:00Z" }
              as: FleetAdmin
            - call: "POST /fleet/assignments/${a20a_id}/close"
              payload: { close_reason: "COMPLETED" }
              as: FleetAdmin
            - call: "POST /fleet/assignments"
              payload: { equipment_id: "${e20b_id}", project_id: "${p_src_id}", start_date: "2026-08-03", end_date: "2026-08-10", expected_equipment_version: "${e20b_v}" }
              as: FleetAdmin
              captures: { a20b_id: $.data.id }
            - call: "POST /fleet/assignments/${a20b_id}/activate"
              as: FleetAdmin
            - call: "POST /fleet/assignments/${a20b_id}/close"
              payload: { close_reason: "COMPLETED" }
              as: FleetAdmin
          trigger:
            - call: "POST /fleet/transport-jobs"
              payload: { equipment_id: "${e20a_id}", from_project_id: "${p_src_id}", to_project_id: "${p_dst20_id}", lowboy_id: "${l20_id}", depart_at: "2026-08-10T08:00:00Z", arrive_at: "2026-08-10T12:00:00Z" }
              as: Dispatcher
              captures: { t1_id: $.data.id, t1_status: $.data.status }
            - call: "POST /fleet/transport-jobs"
              payload: { equipment_id: "${e20b_id}", from_project_id: "${p_src_id}", to_project_id: "${p_dst20_id}", lowboy_id: "${l20_id}", depart_at: "2026-08-10T15:59:00Z", arrive_at: "2026-08-10T18:00:00Z" }
              as: Dispatcher
              captures: { err: $.data.error_id }
            - call: "POST /fleet/transport-jobs"
              payload: { equipment_id: "${e20b_id}", from_project_id: "${p_src_id}", to_project_id: "${p_dst20_id}", lowboy_id: "${l20_id}", depart_at: "2026-08-10T16:00:00Z", arrive_at: "2026-08-10T20:00:00Z" }
              as: Dispatcher
              captures: { t3_id: $.data.id, t3_status: $.data.status }
          assert:
            - "T1 created PLANNED (E20a -> IN_TRANSIT); lowboy occupied over closed [08:00, 12:00+4h) = [08:00, 16:00)"
            - "Depart 15:59:00Z: error_id == ERR_TRANSPORT_CONFLICT, http 409 (15:59 < 12:00+4h buffered end)"
            - "Depart EXACTLY 16:00:00Z: 201 PLANNED — the buffered interval is half-open at its buffered end, exact adjacency allowed"
            - "Equipment.${e20b_id}.availability_status == IN_TRANSIT after the 16:00 create (unchanged by the 15:59 rejection)"

  # ===========================================================================
  # Rule 9 — compensating_invariant (3 instances, different conserved quantities)
  # ===========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: reading_accept_void_pair_conserves_engine_meter
        grounds:
          - calculations.service_threshold
          - entities.Equipment.fields.engine_hours_milli
          - entities.TelematicsReading.fields.status
        distinguishing_aspect: |
          Conserved quantity: Equipment.engine_hours_milli (the milli-hour
          meter). Forward action POST reading (+12345 milli) paired with its
          compensating action POST /fleet/readings/{id}/void (-12345 milli)
          leaves the meter EXACTLY at its pre-pair value 0 — no drift, and
          only the voided row flips to VOIDED.
        test_recipe:
          setup:
            - "Class C21 service_interval_hours=10000; Equipment E21 OWNED IDLE, engine_hours_milli == 0"
          setup_api_calls:
            - call: "POST /fleet/equipment-classes"
              payload: { class_code: "EXC-510", daily_rate_cents: 10000, external_daily_rate_cents: 12000, weekend_multiplier_bp: 5000, idle_day_multiplier_bp: 5000, service_interval_hours: 10000, idle_alert_utilization_bp: 3000, expected_life_hours: 10000, salvage_value_cents: 500000 }
              as: FleetAdmin
              captures: { c21_id: $.data.id }
            - call: "POST /fleet/equipment"
              payload: { unit_tag: "UNIT-21", class_id: "${c21_id}", ownership: "OWNED", acquisition_cost_cents: 10000000, acquisition_date: "2026-01-01", useful_life_months: 60 }
              as: FleetAdmin
              captures: { e21_id: $.data.id, e21_hours0: $.data.engine_hours_milli }
          trigger:
            - call: "POST /fleet/equipment/${e21_id}/readings"
              payload: { recorded_date: "2026-08-03", engine_hours_delta_milli: 12345, fuel_used_milliliters: 6000 }
              as: FleetAdmin
              captures: { r21_id: $.data.id }
            - call: "GET /fleet/equipment/${e21_id}"
              as: FleetAdmin
              captures: { e21_hours_mid: $.data.engine_hours_milli }
            - call: "POST /fleet/readings/${r21_id}/void"
              payload: { void_reason: "duplicate feed" }
              as: FleetAdmin
            - call: "GET /fleet/equipment/${e21_id}"
              as: FleetAdmin
              captures: { e21_hours_end: $.data.engine_hours_milli }
          assert:
            - "Pre-pair meter == 0; after accept == 12345; after void == 0 (meter conserved exactly under accept+void)"
            - "TelematicsReading.${r21_id}.status == VOIDED with void_reason stored"
            - "Equipment.${e21_id}.maintenance_status == SERVICE_OK (threshold never engaged below 10000 h interval)"

      - name: dispatch_cancel_pair_conserves_mechanic_capacity
        grounds:
          - state_machines.WorkOrder.OPEN_to_DISPATCHED
          - state_machines.WorkOrder.DISPATCHED_to_CANCELLED
          - entities.Mechanic.fields.active_work_order_count
        distinguishing_aspect: |
          Conserved quantity: Mechanic.active_work_order_count (and the
          derived status). Dispatch (+1) paired with compensating cancel of
          the DISPATCHED order (-1, mechanic_id cleared) restores count == 0
          and status == AVAILABLE — a different conserved quantity from the
          engine-hour meter of instance 1.
        test_recipe:
          setup:
            - "Class C22, Project P22 OPEN, Equipment E22 OWNED, Mechanic M22 AVAILABLE count 0; OPEN REPAIR WorkOrder W22"
          setup_api_calls:
            - call: "POST /fleet/equipment-classes"
              payload: { class_code: "EXC-520", daily_rate_cents: 10000, external_daily_rate_cents: 12000, weekend_multiplier_bp: 5000, idle_day_multiplier_bp: 5000, service_interval_hours: 10000, idle_alert_utilization_bp: 3000, expected_life_hours: 10000, salvage_value_cents: 500000 }
              as: FleetAdmin
              captures: { c22_id: $.data.id }
            - call: "POST /fleet/projects"
              payload: { project_code: "PRJ-Q", name: "Project Q", equipment_budget_cents: 100000000 }
              as: FleetAdmin
              captures: { p22_id: $.data.id }
            - call: "POST /fleet/equipment"
              payload: { unit_tag: "UNIT-22", class_id: "${c22_id}", ownership: "OWNED", acquisition_cost_cents: 10000000, acquisition_date: "2026-01-01", useful_life_months: 60 }
              as: FleetAdmin
              captures: { e22_id: $.data.id }
            - call: "POST /fleet/mechanics"
              payload: { mechanic_code: "MECH-22", name: "Mac 22", home_project_id: "${p22_id}" }
              as: FleetAdmin
              captures: { m22_id: $.data.id }
            - call: "POST /fleet/work-orders"
              payload: { equipment_id: "${e22_id}", kind: "REPAIR", notes: "w22" }
              as: FleetAdmin
              captures: { w22_id: $.data.id }
          trigger:
            - call: "POST /fleet/work-orders/${w22_id}/dispatch"
              payload: { mechanic_id: "${m22_id}" }
              as: FleetAdmin
            - call: "GET /fleet/mechanics/${m22_id}"
              as: FleetAdmin
              captures: { m22_count_mid: $.data.active_work_order_count }
            - call: "POST /fleet/work-orders/${w22_id}/cancel"
              as: FleetAdmin
              captures: { w22_status: $.data.status, w22_mech: $.data.mechanic_id }
            - call: "GET /fleet/mechanics/${m22_id}"
              as: FleetAdmin
              captures: { m22_count_end: $.data.active_work_order_count, m22_status_end: $.data.status }
          assert:
            - "After dispatch: active_work_order_count == 1; after cancel: == 0 and status == AVAILABLE (capacity conserved)"
            - "WorkOrder.${w22_id}.status == CANCELLED and mechanic_id == null (cleared by the compensating cancel)"
            - "Equipment.${e22_id}.maintenance_status == SERVICE_OK (cancel of a DISPATCHED repair leaves maintenance unchanged)"

      - name: reserve_cancel_pair_conserves_project_ledger
        grounds:
          - state_machines.Assignment.RESERVED_to_CANCELLED
          - entities.Project.fields.billed_total_cents
          - state_machines.Equipment.RESERVED_terminal_via_cancel
        distinguishing_aspect: |
          Conserved quantity: Project.billed_total_cents (the fiscal ledger).
          Assignment create (RESERVED) paired with compensating cancel posts
          NO AssignmentCharge row and leaves billed_total_cents == 0 and the
          equipment IDLE — a fiscal conserved quantity, distinct from the
          meter and capacity invariants above.
        test_recipe:
          setup:
            - "Class C23; Project P23 OPEN budget 100000000; Equipment E23 OWNED IDLE"
          setup_api_calls:
            - call: "POST /fleet/equipment-classes"
              payload: { class_code: "EXC-530", daily_rate_cents: 10000, external_daily_rate_cents: 12000, weekend_multiplier_bp: 5000, idle_day_multiplier_bp: 5000, service_interval_hours: 10000, idle_alert_utilization_bp: 3000, expected_life_hours: 10000, salvage_value_cents: 500000 }
              as: FleetAdmin
              captures: { c23_id: $.data.id }
            - call: "POST /fleet/projects"
              payload: { project_code: "PRJ-R", name: "Project R", equipment_budget_cents: 100000000 }
              as: FleetAdmin
              captures: { p23_id: $.data.id }
            - call: "POST /fleet/equipment"
              payload: { unit_tag: "UNIT-23", class_id: "${c23_id}", ownership: "OWNED", acquisition_cost_cents: 10000000, acquisition_date: "2026-01-01", useful_life_months: 60 }
              as: FleetAdmin
              captures: { e23_id: $.data.id, e23_v: $.data.version }
          trigger:
            - call: "POST /fleet/assignments"
              payload: { equipment_id: "${e23_id}", project_id: "${p23_id}", start_date: "2026-08-03", end_date: "2026-08-10", expected_equipment_version: "${e23_v}" }
              as: FleetAdmin
              captures: { a23_id: $.data.id }
            - call: "POST /fleet/assignments/${a23_id}/cancel"
              as: FleetAdmin
              captures: { a23_status: $.data.status }
            - call: "GET /fleet/projects/${p23_id}"
              as: FleetAdmin
              captures: { p23_billed: $.data.billed_total_cents }
            - call: "GET /fleet/assignments/${a23_id}/charges"
              as: FleetAdmin
            - call: "GET /fleet/equipment/${e23_id}"
              as: FleetAdmin
              captures: { e23_avail: $.data.availability_status }
          assert:
            - "Assignment.${a23_id}.status == CANCELLED"
            - "Project.${p23_id}.billed_total_cents == 0 (ledger conserved: reservation+cancel posts nothing)"
            - "GET /fleet/assignments/${a23_id}/charges returns an empty array (0 AssignmentCharge rows)"
            - "Equipment.${e23_id}.availability_status == IDLE (RESERVED side effect fully compensated)"
