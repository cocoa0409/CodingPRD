              captures: { c3b: "$.data.match_confidence_bps", s3b: "$.data.match_status" }
          assert:
            - "ABOVE the auto threshold: line 1 match_confidence_bps 10000, match_status AUTO_MATCHED, work_id == the 'Midnight Ledger' recording — the ISRC wins even though reported_title is wrong."
            - "EXACTLY AT the auto threshold: line 2 match_confidence_bps 7500 == AUTO_MATCH_MIN_CONFIDENCE_BPS, match_status AUTO_MATCHED, work_id == the 'Midnight Ledger' recording (title/artist normalization collapsed '  MIDNIGHT   LEDGER!! ' to 'midnight ledger')."
            - "BELOW the auto threshold: line 3 match_confidence_bps 5000, match_status UNMATCHED, work_id null."
            - "Batch forked to PARTIALLY_MATCHED with matched_play_count 450000 and unmatched_play_count 50000."
            - "Work.provisional_match_by_user_id is 'analyst-fuzzy-1' on the 'Midnight Ledger' recording (a sub-10000 match was attached) and null on the 'Neon Ledger' recording (nothing was attached to it)."
            - "EXACTLY AT the claim threshold: after the approval cascade, line 3 match_confidence_bps 5000 == CLAIM_MATCH_MIN_CONFIDENCE_BPS and match_status CLAIM_MATCHED — the identical score that failed the 7500 bound satisfies the 5000 bound."

      - name: revenue_share_exactly_equals_minimum_pool
        grounds:
          - calculations.pool_distributable_amount
          - entities.RoyaltyPool.fields.allocation_basis
          - entities.RoyaltyPool.fields.minimum_pool_cents
        distinguishing_aspect: |
          The basis chain tests revenue_share_pool_cents >= minimum_pool_cents with a
          NON-strict comparison, so a pool whose two candidates are exactly equal (700000 vs
          700000 at 1400 subscribers) must report REVENUE_SHARE, while one extra subscriber
          (700000 vs 700500) flips both the amount and the basis.
        test_recipe:
          setup:
            - "Two EFFECTIVE WORLD schedules, FAMILY and STUDENT, each with revenue_share_bps 7000, per_subscriber_minimum_cents 500 and statutory_floor_per_play_millicents 100."
            - "Period 2026-06 with a sealed, matched batch carrying one GB/FAMILY line and one GB/STUDENT line, 200000 plays each, both matched by exact ISRC."
            - "Two GB pools with identical gross_revenue_cents 1000000 (revenue share 700000 in both) differing only in subscriber_count: 1400 and 1401."
          setup_api_calls:
            - call: "POST /royalties/rate-schedules"
              payload: { proceeding_ref: "CRB-2026-FAM", territory_code: "WORLD", subscription_tier: "FAMILY", revenue_share_bps: 7000, per_subscriber_minimum_cents: 500, mechanical_share_bps: 4000, performance_share_bps: 6000, statutory_floor_per_play_millicents: 100, effective_from: "2026-01-01", effective_to: "2026-12-31" }
              as: RegulatoryOfficer
              captures: { rsf: "$.data.id" }
            - call: "POST /royalties/rate-schedules/${rsf}/promulgate"
              payload: {}
              as: RegulatoryOfficer
            - call: "POST /royalties/rate-schedules"
              payload: { proceeding_ref: "CRB-2026-STU", territory_code: "WORLD", subscription_tier: "STUDENT", revenue_share_bps: 7000, per_subscriber_minimum_cents: 500, mechanical_share_bps: 4000, performance_share_bps: 6000, statutory_floor_per_play_millicents: 100, effective_from: "2026-01-01", effective_to: "2026-12-31" }
              as: RegulatoryOfficer
              captures: { rss: "$.data.id" }
            - call: "POST /royalties/rate-schedules/${rss}/promulgate"
              payload: {}
              as: RegulatoryOfficer
            - call: "POST /royalties/periods"
              payload: { label: "2026-06", usage_start: "2026-06-01", usage_end: "2026-06-30" }
              as: RoyaltyAdmin
              captures: { per: "$.data.id" }
            - call: "POST /royalties/works"
              payload: { work_type: "RECORDING", identifier: "GBABC2600001", title: "Midnight Ledger", artist_credit: "The Reconcilers" }
              as: RightsOpsAnalyst
              captures: { w1: "$.data.id" }
            - call: "POST /royalties/usage-batches"
              payload: { period_id: "${per}", source_label: "UK client feed" }
              as: RightsOpsAnalyst
              captures: { ub: "$.data.id" }
            - call: "POST /royalties/usage-batches/${ub}/lines"
              payload: { reported_isrc: "GBABC2600001", reported_title: "Midnight Ledger", territory_code: "GB", subscription_tier: "FAMILY", play_count: 200000 }
              as: RightsOpsAnalyst
            - call: "POST /royalties/usage-batches/${ub}/lines"
              payload: { reported_isrc: "GBABC2600001", reported_title: "Midnight Ledger", territory_code: "GB", subscription_tier: "STUDENT", play_count: 200000 }
              as: RightsOpsAnalyst
            - call: "POST /royalties/usage-batches/${ub}/seal"
              payload: {}
              as: RightsOpsAnalyst
            - call: "POST /royalties/usage-batches/${ub}/match"
              payload: {}
              as: RightsOpsAnalyst
              as_user_id: "analyst-fuzzy-1"
            - call: "POST /royalties/pools"
              payload: { period_id: "${per}", territory_code: "GB", subscription_tier: "FAMILY", subscriber_count: 1400, gross_revenue_cents: 1000000 }
              as: RoyaltyAdmin
              captures: { pl_at: "$.data.id" }
            - call: "POST /royalties/pools"
              payload: { period_id: "${per}", territory_code: "GB", subscription_tier: "STUDENT", subscriber_count: 1401, gross_revenue_cents: 1000000 }
              as: RoyaltyAdmin
              captures: { pl_over: "$.data.id" }
          trigger:
            - call: "POST /royalties/pools/${pl_at}/calculate"
              payload: {}
              as: RoyaltyAdmin
              captures: { at_rev: "$.data.revenue_share_pool_cents", at_min: "$.data.minimum_pool_cents", at_dist: "$.data.distributable_cents", at_basis: "$.data.allocation_basis" }
            - call: "POST /royalties/pools/${pl_over}/calculate"
              payload: {}
              as: RoyaltyAdmin
              captures: { ov_rev: "$.data.revenue_share_pool_cents", ov_min: "$.data.minimum_pool_cents", ov_dist: "$.data.distributable_cents", ov_basis: "$.data.allocation_basis" }
          assert:
            - "EXACTLY EQUAL (1400 subscribers): revenue_share_pool_cents 700000, minimum_pool_cents 700000, statutory_floor_cents 20000, distributable_cents 700000, allocation_basis REVENUE_SHARE — the non-strict >= resolves the tie in favour of the revenue share."
            - "ONE OVER (1401 subscribers): revenue_share_pool_cents 700000, minimum_pool_cents 700500, distributable_cents 700500, allocation_basis PER_SUBSCRIBER_MINIMUM."
            - "A strict > comparison in the basis chain would report PER_SUBSCRIBER_MINIMUM for the 1400 pool while still returning 700000 — the basis field, not the amount, is what discriminates."
            - "The cap never binds in either pool: MAX_POOL_CAP_MULTIPLE * minimum_pool_cents is 2100000 and 2101500 respectively."

