          Enrollment confirmation depends on Family.status: when the family is DELINQUENT (driven by a PAST_DUE
          invoice), a new enrollment cannot CONFIRM -> ERR_FAMILY_DELINQUENT. Entity pair: Enrollment->Family.
        test_recipe:
