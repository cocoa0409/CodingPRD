            - { call: "POST /cemetery-mgmt/deeds", payload: { plot_id: "${plot_id}", holder_id: "${holder1_id}", purchase_price_cents: 1000000, sale_type: "NEW_SALE", expected_plot_version: "${plot_v}" }, as: Registrar, captures: { deed_id: "$.data.id", saleInv_id: "$.data.sale_invoice_id" } }
