            - "${m_status} == VACATED and ${m_reason} == CLERICAL_ERROR  # DRAFT -> VACATED is a declared transition"
            - "${e9} == ERR_INVALID_ORDER_STATUS  # VACATED is terminal"
            - "all nine refusals carry HTTP 409"
            - "${cs_status} == ENTERED and ${cs_monthly} == 75000  # the ENTERED order was untouched by the four refused triggers"

      - name: locate_referral_self_loop_exhausts_at_three_attempts
        claim_type: side_effect_execution
        grounds:
          - "state_machines.SupportCase.case_status"
          - "entities.Participant.fields.locate_status"
          - "entities.Participant.fields.locate_attempt_count"
          - "entities.SupportCase.fields.locate_referral_count"
          - "endpoints[POST /child-support/cases/{case_id}/locate-referrals]"
          - "validations[priority 28]"
          - "errors[ERR_LOCATE_ATTEMPTS_EXHAUSTED]"
          - "errors[ERR_INVALID_CASE_STATUS]"
        distinguishing_aspect: >
          Each locate referral applies all four declared side effects at once — case
          OPENED/LOCATE -> LOCATE, locate_referral_count += 1, NCP locate_status :=
          PENDING and locate_attempt_count += 1 — and the third one additionally
          flips locate_status to UNLOCATABLE, after which a fourth referral is
          ERR_LOCATE_ATTEMPTS_EXHAUSTED and a referral on the closed case is
          ERR_INVALID_CASE_STATUS.
        test_recipe:
          setup:
            - "DIRECT_APPLICATION case with good_cause_claim false whose NCP has never been located, so locate_status is still NOT_NEEDED and locate_attempt_count is 0."
            - "No paternity action exists (none can, while the NCP is unlocated)."
          setup_api_calls:
            - call: "POST /child-support/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /child-support/participants"
              payload: { role_type: "CUSTODIAL_PARTY", full_name: "Dana Ruiz", ssn_last4: "4343", residence_state_code: "MN", monthly_gross_income_cents: 200000, income_verification_source: "VERIFIED_WAGE_RECORD" }
              as: CaseWorker
              captures: { cp_id: "$.data.id" }
            - call: "POST /child-support/participants"
              payload: { role_type: "NONCUSTODIAL_PARTY", full_name: "Alex Ruiz", ssn_last4: "4444", residence_state_code: "MN", monthly_gross_income_cents: 300000, income_verification_source: "VERIFIED_WAGE_RECORD", supports_second_family: false, has_valid_drivers_license: true }
              as: CaseWorker
              captures: { ncp_id: "$.data.id" }
            - call: "POST /child-support/cases"
              payload: { case_type: "DIRECT_APPLICATION", custodial_party_id: "${cp_id}", noncustodial_party_id: "${ncp_id}", child_count: 2, tanf_assistance: false, good_cause_claim: false }
              as: CaseWorker
              captures: { case_id: "$.data.id" }
          trigger:
            - call: "POST /child-support/cases/${case_id}/locate-referrals"
              payload: { locate_source: "FEDERAL_PLS" }
              as: CaseWorker
              captures: { c1_status: "$.data.case_status", c1_count: "$.data.locate_referral_count" }
            - call: "GET /child-support/participants/${ncp_id}"
              as: CaseWorker
              captures: { n1_ls: "$.data.locate_status", n1_ct: "$.data.locate_attempt_count" }
            - call: "POST /child-support/cases/${case_id}/locate-referrals"
              payload: { locate_source: "STATE_DIRECTORY_OF_NEW_HIRES" }
              as: CaseWorker
              captures: { c2_status: "$.data.case_status", c2_count: "$.data.locate_referral_count" }
            - call: "GET /child-support/participants/${ncp_id}"
              as: CaseWorker
              captures: { n2_ls: "$.data.locate_status", n2_ct: "$.data.locate_attempt_count" }
            - call: "POST /child-support/cases/${case_id}/locate-referrals"
              payload: { locate_source: "CREDIT_BUREAU" }
              as: CaseWorker
              captures: { c3_status: "$.data.case_status", c3_count: "$.data.locate_referral_count" }
            - call: "GET /child-support/participants/${ncp_id}"
              as: CaseWorker
              captures: { n3_ls: "$.data.locate_status", n3_ct: "$.data.locate_attempt_count" }
            - call: "POST /child-support/cases/${case_id}/locate-referrals"
              payload: { locate_source: "EMPLOYER_TIP" }
              as: CaseWorker
              captures: { e_exhausted: "$.data.error_id" }
            - call: "POST /child-support/cases/${case_id}/closure"
              payload: { closed_reason: "CP_REQUEST" }
              as: SupervisingAttorney
              captures: { c4_status: "$.data.case_status", c4_reason: "$.data.closed_reason", c4_at: "$.data.closed_at" }
            - call: "POST /child-support/cases/${case_id}/locate-referrals"
              payload: { locate_source: "FEDERAL_PLS" }
              as: CaseWorker
              captures: { e_closed: "$.data.error_id" }
          assert:
            - "${c1_status} == LOCATE and ${c1_count} == 1; ${n1_ls} == PENDING and ${n1_ct} == 1"
            - "${c2_status} == LOCATE and ${c2_count} == 2; ${n2_ls} == PENDING and ${n2_ct} == 2  # the LOCATE -> LOCATE self-loop is legal"
            - "${c3_status} == LOCATE and ${c3_count} == 3; ${n3_ct} == 3"
            - "${n3_ls} == UNLOCATABLE  # only the referral that reaches MAX_LOCATE_ATTEMPTS (3) flips the status; attempts 1 and 2 leave it PENDING"
            - "${e_exhausted} == ERR_LOCATE_ATTEMPTS_EXHAUSTED with HTTP 409, and locate_referral_count stays 3"
            - "${c4_status} == CLOSED, ${c4_reason} == CP_REQUEST, ${c4_at} == 2026-08-01T00:00:00Z"
            - "${e_closed} == ERR_INVALID_CASE_STATUS with HTTP 409  # a CLOSED case rejects every write"

      - name: paternity_exclusion_shifts_the_genetic_cost_and_closes_the_case
        claim_type: cross_entity
        grounds:
          - "state_machines.PaternityAction"
          - "state_machines.SupportCase.case_status"
          - "entities.PaternityAction.fields.genetic_cost_liable_party"
          - "endpoints[POST /child-support/paternity-actions/{paternity_action_id}/genetic-test-order]"
          - "endpoints[POST /child-support/paternity-actions/{paternity_action_id}/specimen-collection]"
          - "endpoints[POST /child-support/paternity-actions/{paternity_action_id}/genetic-result]"
          - "errors[ERR_INVALID_CASE_STATUS]"
        distinguishing_aspect: >
          A genetic probability below the 99.0 threshold does not merely mark the
          action EXCLUDED: in the same request it moves genetic_cost_liable_party
          from NONE to STATE and drives the parent case PATERNITY_PENDING -> CLOSED
          with closed_reason NO_JURISDICTION, after which every case write is
          refused.
        test_recipe:
          setup:
            - "DIRECT_APPLICATION case, NCP LOCATED, good_cause_claim false; case_status PATERNITY_PENDING."
            - "A GENETIC_TEST PaternityAction ordered at 2026-08-01 with collection_appointment_at 2026-08-20T00:00:00Z, genetic_cost_cents 48000 and genetic_cost_liable_party still NONE."
            - "The specimen was collected at 2026-08-20 with chain_of_custody_ok true, leaving the action GENETIC_COLLECTED."
          setup_api_calls:
            - call: "POST /child-support/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /child-support/participants"
              payload: { role_type: "CUSTODIAL_PARTY", full_name: "Dana Ruiz", ssn_last4: "4545", residence_state_code: "MN", monthly_gross_income_cents: 200000, income_verification_source: "VERIFIED_WAGE_RECORD" }
              as: CaseWorker
              captures: { cp_id: "$.data.id" }
            - call: "POST /child-support/participants"
              payload: { role_type: "NONCUSTODIAL_PARTY", full_name: "Alex Ruiz", ssn_last4: "4646", residence_state_code: "MN", monthly_gross_income_cents: 300000, income_verification_source: "VERIFIED_WAGE_RECORD", supports_second_family: false, has_valid_drivers_license: true }
              as: CaseWorker
              captures: { ncp_id: "$.data.id" }
            - call: "POST /child-support/participants/${ncp_id}/locate-results"
              payload: { locate_outcome: "LOCATED" }
              as: CaseWorker
            - call: "POST /child-support/cases"
              payload: { case_type: "DIRECT_APPLICATION", custodial_party_id: "${cp_id}", noncustodial_party_id: "${ncp_id}", child_count: 2, tanf_assistance: false, good_cause_claim: false }
              as: CaseWorker
              captures: { case_id: "$.data.id" }
            - call: "POST /child-support/cases/${case_id}/paternity-actions"
              payload: { method: "GENETIC_TEST" }
              as: CaseWorker
              captures: { pa_id: "$.data.id" }
            - call: "POST /child-support/paternity-actions/${pa_id}/genetic-test-order"
              payload: { collection_appointment_at: "2026-08-20T00:00:00Z" }
              as: SupervisingAttorney
              captures: { g_status: "$.data.status", g_cost: "$.data.genetic_cost_cents", g_method: "$.data.method" }
            - call: "POST /child-support/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-20T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /child-support/paternity-actions/${pa_id}/specimen-collection"
              payload: { chain_of_custody_ok: true }
              as: CaseWorker
              captures: { s_status: "$.data.status", s_at: "$.data.specimen_collected_at" }
          trigger:
            - call: "POST /child-support/paternity-actions/${pa_id}/genetic-result"
              payload: { genetic_probability_pct: 98.5 }
              as: SupervisingAttorney
              captures: { x_status: "$.data.status", x_pct: "$.data.genetic_probability_pct", x_liable: "$.data.genetic_cost_liable_party", x_est: "$.data.established_at", x_em: "$.data.established_method" }
            - call: "GET /child-support/cases/${case_id}"
              as: CaseWorker
              captures: { c_status: "$.data.case_status", c_reason: "$.data.closed_reason", c_at: "$.data.closed_at" }
            - call: "POST /child-support/cases/${case_id}/locate-referrals"
              payload: { locate_source: "FEDERAL_PLS" }
              as: CaseWorker
              captures: { e_locate: "$.data.error_id" }
            - call: "POST /child-support/cases/${case_id}/orders"
              payload: { order_type: "CURRENT_SUPPORT", origin_state_code: "MN", effective_date: "2026-09-01" }
              as: CaseWorker
              captures: { e_order: "$.data.error_id" }
          assert:
            - "${g_status} == GENETIC_ORDERED, ${g_cost} == 48000, ${g_method} == GENETIC_TEST"
            - "${s_status} == GENETIC_COLLECTED and ${s_at} == 2026-08-20T00:00:00Z  # collection at exactly the appointment instant is allowed"
            - "${x_status} == EXCLUDED and ${x_pct} == 98.5  # 98.5 < the 99.0 establishment threshold"
            - "${x_liable} == STATE  # exclusion moves the 48000 test cost from the NCP to the state"
            - "${x_est} == null and ${x_em} == null  # nothing was established"
            - "${c_status} == CLOSED, ${c_reason} == NO_JURISDICTION, ${c_at} == 2026-08-20T00:00:00Z"
            - "${e_locate} == ERR_INVALID_CASE_STATUS with HTTP 409"
            - "${e_order} == ERR_INVALID_CASE_STATUS with HTTP 409  # on POST /cases/{case_id}/orders this rule fires for exactly one reason: the case is CLOSED"

      - name: charge_voidance_reconciles_the_case_ledger_and_the_interest_base
        claim_type: ledger_sync
        grounds:
          - "state_machines.ObligationCharge"
          - "endpoints[POST /child-support/charges/{charge_id}/voidance]"
          - "entities.SupportCase.fields.total_charged_principal_cents"
          - "entities.SupportCase.fields.arrears_principal_cents"
          - "entities.SupportCase.fields.interest_receivable_cents"
          - "calculations.arrears_interest_accrual"
          - "validations[priority 45]"
          - "errors[ERR_CHARGE_PARTIALLY_PAID]"
        distinguishing_aspect: >
          Voiding the older, wholly unpaid charge reconciles three ancestor figures
          in one request — total_charged_principal_cents 150000 -> 75000,
          arrears_principal_cents 130000 -> 55000 and interest_receivable_cents 375
          -> 0 because the voided charge leaves the accrual base retroactively —
          while the part-paid charge is protected by ERR_CHARGE_PARTIALLY_PAID.
        test_recipe:
          setup:
            - "DIRECT_APPLICATION case, PRESUMED_MARITAL paternity, ENTERED CURRENT_SUPPORT order at 75000 effective 2026-08-01."
            - "Two OPEN CURRENT_SUPPORT charges of 75000: charge 1 for 2026-08-01/2026-09-01 due 2026-08-15 and charge 2 for 2026-09-01/2026-10-01 due 2026-09-15."
            - "Clock at 2026-09-20; a DIRECT_PAY payment of 20000 has landed on charge 2 (the period containing 2026-09-20), leaving charge 2 with paid_cents 20000 and charge 1 with paid_cents 0."
