      - the first FINALIZE returns 200 with AfterActionReview.${aar_id}.status == FINALIZED
      - AfterActionReview.${aar_id}.finalized_by_user_id == "director-1"
      - SecurityEvent.${event_id}.status == DEBRIEFED, cascaded from the finalize
      - the second FINALIZE returns 409 with data.error_id == "ERR_INVALID_STATE"
      - the RETURN returns 409 with data.error_id == "ERR_INVALID_STATE"
      - the event CLOSE returns 409 with data.error_id == "ERR_INVALID_STATE" — DEBRIEFED has no outgoing lifecycle edge
      - AfterActionReview.${aar_id}.status is still FINALIZED and SecurityEvent.${event_id}.status is still DEBRIEFED after all three rejections
  - name: guard_rejected_then_disqualified_reaches_terminal_state
    claim_type: terminal_state_lockdown
    grounds:
    - state_machines.Guard.UNVERIFIED_to_PENDING_REVIEW
    - state_machines.Guard.PENDING_REVIEW_to_REJECTED
    - state_machines.Guard.REJECTED_to_DISQUALIFIED
    - state_machines.Guard.terminal_states
    - validations[priority=12]
    distinguishing_aspect: |
      DISQUALIFIED is the only terminal state in §1.2 that is reachable from exactly ONE predecessor (REJECTED), and Guard is otherwise the most cyclic machine in the scaffold — every other credential state can loop back to PENDING_REVIEW. The claim is that disqualification is the one exit from that loop: even the re-certification path that works from VERIFIED, REJECTED and EXPIRED is refused here.
    test_recipe:
      setup:
      - logical clock at 2026-09-01T00:00:00Z
      - one EMPLOYEE Guard GC-4002 in UNVERIFIED at credential_level 2, credential_expires_on 2026-12-31T00:00:00Z, base_hourly_rate_cents 2200, with no assignments
      setup_api_calls:
      - call: POST /_clock/set_current_utc
        payload:
          to_iso8601: '2026-09-01T00:00:00Z'
        as: SystemOperator
      - call: POST /event-security/guards
        payload:
          full_name: Gale Two
          employment_type: EMPLOYEE
          credential_level: 2
          license_number: GC-4002
          credential_expires_on: '2026-12-31T00:00:00Z'
          base_hourly_rate_cents: 2200
        as: StaffingCoordinator
        captures:
          g1_id: $.data.id
      trigger:
      - call: POST /event-security/guards/${g1_id}/credential-verification
        payload:
          action: SUBMIT_FOR_REVIEW
        as: StaffingCoordinator
      - call: POST /event-security/guards/${g1_id}/credential-verification
        payload:
          action: REJECT
        as: CredentialAuditor
      - call: POST /event-security/guards/${g1_id}/credential-verification
        payload:
          action: DISQUALIFY
        as: CredentialAuditor
      - call: POST /event-security/guards/${g1_id}/credential-verification
        payload:
          action: VERIFY
        as: CredentialAuditor
      - call: POST /event-security/guards/${g1_id}/credential-verification
        payload:
          action: SUBMIT_FOR_REVIEW
        as: StaffingCoordinator
      assert:
      - 'after SUBMIT_FOR_REVIEW: Guard.${g1_id}.verification_status == PENDING_REVIEW and version == 2'
      - 'after REJECT: Guard.${g1_id}.verification_status == REJECTED, verified_at == null and version == 3'
      - 'after DISQUALIFY: Guard.${g1_id}.verification_status == DISQUALIFIED and version == 4'
      - the VERIFY against the DISQUALIFIED guard returns 409 with data.error_id == "ERR_INVALID_STATE"
      - the SUBMIT_FOR_REVIEW against the DISQUALIFIED guard returns 409 with data.error_id == "ERR_INVALID_STATE"
      - Guard.${g1_id}.verification_status is still DISQUALIFIED and version is still 4 after both rejections
  - name: subcontractor_terminated_is_terminal_and_approve_is_rejected
    claim_type: terminal_state_lockdown
    grounds:
    - state_machines.Subcontractor.PENDING_to_TERMINATED
    - state_machines.Subcontractor.terminal_states
    - validations[priority=12]
    - endpoints[POST /event-security/subcontractors/{id}/decision]
    distinguishing_aspect: |
      Subcontractor is the only machine in §1.2 whose terminal state is reachable from EVERY other state, so the lockdown claim is taken from the shortest of those three paths (straight out of PENDING, skipping APPROVED entirely): once TERMINATED, the cyclic APPROVED <-> SUSPENDED pair that the vendor never entered is permanently out of reach.
    test_recipe:
      setup:
      - logical clock at 2026-09-01T00:00:00Z
      - one Subcontractor "Vanguard Protective" in PENDING with license_number SC-3001, insurance_expires_on 2027-06-30T00:00:00Z and markup_pct 0.18
      setup_api_calls:
      - call: POST /_clock/set_current_utc
        payload:
          to_iso8601: '2026-09-01T00:00:00Z'
        as: SystemOperator
      - call: POST /event-security/subcontractors
        payload:
          company_name: Vanguard Protective
          license_number: SC-3001
          insurance_expires_on: '2027-06-30T00:00:00Z'
          markup_pct: 0.18
        as: CredentialAuditor
        captures:
          sub_id: $.data.id
      trigger:
      - call: POST /event-security/subcontractors/${sub_id}/decision
        payload:
          action: TERMINATE
        as: CredentialAuditor
      - call: POST /event-security/subcontractors/${sub_id}/decision
        payload:
          action: APPROVE
        as: CredentialAuditor
      - call: POST /event-security/subcontractors/${sub_id}/decision
        payload:
          action: SUSPEND
        as: CredentialAuditor
      assert:
      - 'after TERMINATE: Subcontractor.${sub_id}.status == TERMINATED and version == 2'
      - the APPROVE against the TERMINATED vendor returns 409 with data.error_id == "ERR_INVALID_STATE"
      - the SUSPEND against the TERMINATED vendor returns 409 with data.error_id == "ERR_INVALID_STATE"
      - Subcontractor.${sub_id}.status is still TERMINATED and version is still 2
      - Subcontractor.${sub_id}.verified_guard_count is still 0
  - name: check_in_before_brief_returns_guard_not_briefed
    claim_type: precondition_enforcement
    grounds:
    - state_machines.PostAssignment.BRIEFED_to_ON_POST
