  - rule_id: compensating_invariant
    instances:

      - name: escrow_mapping_rollback_restores_custodial_funds_without_drift
        grounds:
          - state_machines.ServicingTransfer.transitions[data_status ESCROW_MAPPED -> data_status MAPPED]
          - entities.Loan.fields.escrow_balance_at_mapping_cents
          - entities.Loan.fields.suspense_balance_at_mapping_cents
          - entities.ServicingTransfer.fields.escrow_transferred_cents
          - entities.ServicingTransfer.fields.suspense_transferred_cents
          - entities.ServicingPortfolio.fields.custodial_funds_total_cents
        distinguishing_aspect: |
          The conserved quantity is CUSTODIAL CASH held across two different entity types: the sum of
          every included loan's escrow plus suspense, plus whatever the ServicingTransfer holds, must
          equal 500000 before mapping, after mapping (when the loans are zeroed and the transfer holds
          400000 + 100000) and after the rollback. The compensation is a genuine restore-from-snapshot
          rather than a subtraction, because the per-loan split is recovered from the
          escrow_balance_at_mapping_cents and suspense_balance_at_mapping_cents stamps — an
          implementation that merely divided the pooled 400000 across four loans would pass the total
          and fail the per-loan check.
        test_recipe:
          setup:
            - "Fixture T is settled; its four loans each hold escrow 100000 and suspense 25000, so custodial_funds_total_cents is 500000."
            - "The data dimension is advanced to MAPPED and then ESCROW_MAPPED, sweeping all custodial cash to the transfer."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
