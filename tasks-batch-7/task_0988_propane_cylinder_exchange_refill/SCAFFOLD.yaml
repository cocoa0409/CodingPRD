# =============================================================================
# Task 988: Propane Cylinder Exchange & Refill — scaffold seed tables
# =============================================================================

scenario: |
  generate task hard than expert level! 988. Propane Cylinder Exchange & Refill: cage inventory & exchange, refill vs swap & pricing, cylinder certification/recert & condemn, DOT/handling compliance, restock route & par, host-site commission, safety/leak, reconciliation

domain_name: propane-cylinder-exchange
api_prefix: ""

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: ledger_reconciliation
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers
  entity_topology: flat            # peer entities joined by FK references; no URL nesting
  state_machine_shape: cyclic      # cert recert cycle, reweigh loop, recount loop, dispute loop
  relationship_patterns: [one_to_many, cross_aggregate]
  role_model: segregation_of_duties
  consistency_model: immediate

# =============================================================================
# Table 1: Entity-Relationship Table
# All ids are server-minted UUIDs (no type prefix). All timestamps ISO 8601 UTC
# with three fractional digits. `version` starts at 1 and increments by one on
# every mutation of that row. All dates ("*_on", "*_date") are ISO calendar
# dates derived from the logical clock (see POST /_clock/set_current_utc).
# =============================================================================
entities:
  - name: HostSite
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Site display name" }
      - { name: address, type: string, source: input, description: "Street address", default: "" }
      - { name: status, type: enum, source: system, description: "ACTIVE | SUSPENDED | DECOMMISSIONED", default: "ACTIVE" }
      - { name: cage_capacity_cylinders, type: integer, source: input, description: "Physical cage capacity in cylinders; > 0" }
      - { name: par_level_full, type: integer, source: input, description: "Desired full-cylinder stock level; 1 <= par <= cage_capacity_cylinders" }
      - { name: reorder_floor_full, type: integer, source: computed, description: "= ceil(par_level_full * PAR_FLOOR_RATIO); restock alert threshold" }
      - { name: opening_float_cents, type: integer, source: input, description: "Declared cash drawer opening float", default: 20000 }
      - { name: commission_rate_bps, type: integer, source: input, description: "Base commission rate in basis points; 0..3000" }
      - { name: commission_tier_threshold_cents, type: integer, source: input, description: "Cumulative base above which tier-2 rate applies marginally", default: 100000 }
      - { name: commission_tier2_bonus_bps, type: integer, source: input, description: "Additional bps applied marginally above the tier threshold", default: 100 }
      - { name: commission_basis, type: enum, source: input, description: "GROSS | NET — selects commission variant", default: "GROSS" }
      - { name: recon_basis, type: enum, source: input, description: "BOOK | PHYSICAL — selects reconciliation opening-baseline variant", default: "BOOK" }
      - { name: hazmat_fee_cents, type: integer, source: input, description: "Flat per-refill hazmat handling fee", default: 0 }
      - { name: promo_waives_hazmat, type: boolean, source: input, description: "When true, hazmat fee is waived on refills", default: false }
      - { name: full_on_hand, type: integer, source: computed, description: "Count of Cylinder rows: owner_kind=FLEET, current_site_id=this, in_transit_run_id IS NULL, fill_status=FULL, cert_status != CONDEMNED" }
      - { name: empty_on_hand, type: integer, source: computed, description: "Same filter with fill_status=EMPTY" }
      - { name: quarantined_on_hand, type: integer, source: computed, description: "Same filter with fill_status=QUARANTINED" }
      - { name: sales_posture, type: enum, source: computed, description: "SALES_OPEN | SALES_BLOCKED — derived from confirmed quarantining LeakReports" }
      - { name: restock_alert, type: boolean, source: computed, description: "true iff full_on_hand <= reorder_floor_full" }

  - name: PricingPolicy
    parent: null
    common_fields: true
    fields:
      - { name: site_id, type: string, source: input, description: "FK -> HostSite.id; policy scope" }
      - { name: swap_price_cents, type: integer, source: input, description: "Flat swap price before tax; >= 0" }
      - { name: core_deposit_cents, type: integer, source: input, description: "Deposit charged when no cylinder is returned; >= 0" }
      - { name: tax_rate_bps, type: integer, source: input, description: "Sales tax in basis points applied to swap subtotal; 0..2000" }
      - { name: refill_tier1_cents_per_lb, type: integer, source: input, description: "Per-pound rate for the first refill tier; >= 0" }
      - { name: refill_tier1_max_lbs, type: number, source: input, description: "Upper bound of tier 1 in pounds, 2dp; > 0" }
      - { name: refill_tier2_cents_per_lb, type: integer, source: input, description: "Marginal per-pound rate above tier 1; >= 0" }
      - { name: effective_from, type: string, source: input, description: "ISO date; half-open window start (inclusive)" }
      - { name: effective_to, type: string, source: input, description: "ISO date; half-open window end (exclusive); null = open-ended", default: null }
      - { name: is_current, type: boolean, source: computed, description: "true iff effective_from <= current date AND (effective_to IS NULL OR current date < effective_to)" }

  - name: Driver
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Driver name" }
      - { name: license_number, type: string, source: input, description: "CDL license number; unique across drivers" }
      - { name: dot_medical_expires_on, type: string, source: input, description: "ISO date of DOT medical card expiry" }
      - { name: vehicle_max_payload_lbs, type: integer, source: input, description: "Vehicle maximum legal payload in pounds; > 0" }
      - { name: status, type: enum, source: system, description: "ACTIVE | SUSPENDED", default: "ACTIVE" }

  - name: Technician
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Technician name" }
      - { name: cert_level, type: enum, source: input, description: "VISUAL_ONLY | FULL — FULL required for HYDROSTATIC method and for CONDEMN requests" }
      - { name: status, type: enum, source: system, description: "ACTIVE | SUSPENDED", default: "ACTIVE" }

  - name: Cylinder
    parent: null
    common_fields: true
    fields:
      - { name: serial_number, type: string, source: input, description: "Stamped serial; unique across cylinders" }
      - { name: owner_kind, type: enum, source: input, description: "FLEET | CUSTOMER; CUSTOMER cylinders are refill-only and never count in site stock" }
      - { name: water_capacity_lbs, type: number, source: input, description: "Stamped water capacity (WC), 2dp; > 0" }
      - { name: tare_weight_lbs, type: number, source: input, description: "Stamped empty tare weight (TW), 2dp; > 0" }
      - { name: manufacture_date, type: string, source: input, description: "ISO date stamped on the collar" }
      - { name: certified_on, type: string, source: system, description: "ISO date of most recent passed certification; = manufacture_date at registration" }
      - { name: certification_expires_on, type: string, source: computed, description: "certified_on + INITIAL_CERT_YEARS (initial) or + VISUAL/HYDROSTATIC_RECERT_YEARS after a PASS recert" }
      - { name: cert_method_last, type: enum, source: system, description: "INITIAL | VISUAL | HYDROSTATIC", default: "INITIAL" }
      - { name: cert_status, type: enum, source: system, description: "CERTIFIED | RECERT_DUE | CONDEMNED", default: "CERTIFIED" }
      - { name: fill_status, type: enum, source: system, description: "FULL | EMPTY | QUARANTINED; initial value from registration initial_fill" }
      - { name: current_site_id, type: string, source: system, description: "FK -> HostSite.id; null when with customer, at depot, or in transit", default: null }
      - { name: in_transit_run_id, type: string, source: system, description: "FK -> RestockRun.id; non-null while assigned to a dispatched run", default: null }

  - name: ExchangeOrder
    parent: null
    common_fields: true
    fields:
      - { name: site_id, type: string, source: input, description: "FK -> HostSite.id; sale site" }
      - { name: clerk_id, type: string, source: system, description: "X-User-ID of the creating SiteClerk" }
      - { name: returned_cylinder_id, type: string, source: input, description: "FK -> Cylinder.id; the empty the customer hands over; null = core deposit applies", default: null }
      - { name: issued_cylinder_id, type: string, source: system, description: "FK -> Cylinder.id; full cylinder selected at completion (see cylinder_issue_selector)", default: null }
      - { name: unit_price_cents, type: integer, source: computed, description: "Swap price pinned from the site pricing policy at creation" }
      - { name: core_deposit_cents, type: integer, source: computed, description: "Pinned deposit; 0 when returned_cylinder_id provided" }
      - { name: tax_cents, type: integer, source: computed, description: "round_half_up((unit_price_cents + core_deposit_cents) * tax_rate_bps / 10000) to whole cents, computed at creation" }
      - { name: total_cents, type: integer, source: computed, description: "unit_price_cents + core_deposit_cents + tax_cents" }
      - { name: payment_cash_cents, type: integer, source: system, description: "Cash tendered at completion; null until then", default: null }
      - { name: change_due_cents, type: integer, source: computed, description: "payment_cash_cents - total_cents; null until completion", default: null }
      - { name: business_date, type: string, source: system, description: "ISO date (logical clock) stamped at completion; null until then", default: null }
      - { name: sale_seq, type: integer, source: system, description: "Per-site monotone sale sequence assigned at completion (shared counter with refill closes); null until then", default: null }
      - { name: refunded_on, type: string, source: system, description: "ISO date of refund; null unless REFUNDED", default: null }
      - { name: void_reason, type: enum, source: system, description: "MANUAL | SAFETY; null unless VOIDED", default: null }
      - { name: idempotency_key, type: string, source: input, description: "Client idempotency key; unique per clerk", default: null }
      - { name: status, type: enum, source: system, description: "DRAFT | COMPLETED | VOIDED | REFUNDED", default: "DRAFT" }

  - name: RefillTicket
    parent: null
    common_fields: true
    fields:
      - { name: site_id, type: string, source: input, description: "FK -> HostSite.id; refill site" }
      - { name: cylinder_id, type: string, source: input, description: "FK -> Cylinder.id; must be owner_kind=CUSTOMER" }
      - { name: clerk_id, type: string, source: system, description: "X-User-ID of the creating SiteClerk" }
      - { name: pre_weight_lbs, type: number, source: input, description: "Scale reading of the cylinder as received, 2dp" }
      - { name: measured_tare_lbs, type: number, source: system, description: "Empty scale reading recorded at weigh; null until WEIGHED", default: null }
      - { name: post_weight_lbs, type: number, source: system, description: "Scale reading after fill; null until FILLED", default: null }
      - { name: propane_lbs, type: number, source: computed, description: "post_weight_lbs - pre_weight_lbs, 2dp; null until FILLED", default: null }
      - { name: max_fill_lbs, type: number, source: computed, description: "round_half_up(water_capacity_lbs * PROPANE_FILL_FACTOR, 2) computed at creation" }
      - { name: tier1_cents_per_lb, type: integer, source: computed, description: "Tier-1 rate pinned from policy at fill; null until FILLED", default: null }
      - { name: tier2_cents_per_lb, type: integer, source: computed, description: "Tier-2 rate pinned from policy at fill; null until FILLED", default: null }
      - { name: tier1_max_lbs, type: number, source: computed, description: "Tier-1 bound pinned from policy at fill; null until FILLED", default: null }
      - { name: propane_charge_cents, type: integer, source: computed, description: "Per-tier round_half_up to whole cents, then summed; null until FILLED", default: null }
      - { name: hazmat_fee_cents, type: integer, source: computed, description: "Site hazmat fee; 0 when promo_waives_hazmat; null until FILLED", default: null }
      - { name: total_cents, type: integer, source: computed, description: "propane_charge_cents + hazmat_fee_cents; null until FILLED", default: null }
      - { name: payment_cash_cents, type: integer, source: system, description: "Cash tendered at close; null until CLOSED", default: null }
      - { name: change_due_cents, type: integer, source: computed, description: "payment_cash_cents - total_cents; null until CLOSED", default: null }
      - { name: business_date, type: string, source: system, description: "ISO date stamped at close; null until CLOSED", default: null }
      - { name: sale_seq, type: integer, source: system, description: "Per-site monotone sale sequence assigned at close; null until CLOSED", default: null }
      - { name: status, type: enum, source: system, description: "OPEN | WEIGHED | FILLED | CLOSED | VOIDED", default: "OPEN" }

  - name: CertificationRecord
    parent: null
    common_fields: true
    fields:
      - { name: cylinder_id, type: string, source: input, description: "FK -> Cylinder.id; subject cylinder" }
      - { name: technician_id, type: string, source: system, description: "FK -> Technician.id; X-User-ID of the recording Technician" }
      - { name: method, type: enum, source: input, description: "VISUAL | HYDROSTATIC" }
      - { name: outcome, type: enum, source: input, description: "PASS | CONDEMN" }
      - { name: performed_on, type: string, source: system, description: "ISO date (logical clock) of record creation" }
      - { name: previous_expires_on, type: string, source: system, description: "Cylinder.certification_expires_on snapshot before this record" }
      - { name: new_expires_on, type: string, source: computed, description: "PASS: performed_on + VISUAL_RECERT_YEARS or HYDROSTATIC_RECERT_YEARS; CONDEMN: null", default: null }
      - { name: confirmer_technician_id, type: string, source: system, description: "FK -> Technician.id; second technician on condemn decision; null until confirm/reject", default: null }
      - { name: note, type: string, source: input, description: "Free-text note", default: "" }
      - { name: status, type: enum, source: system, description: "RECORDED (PASS, immediately effective) | PENDING_SECOND (CONDEMN awaiting second signature) | CONFIRMED | REJECTED" }

  - name: LeakReport
    parent: null
    common_fields: true
    fields:
      - { name: site_id, type: string, source: input, description: "FK -> HostSite.id; affected site" }
      - { name: cylinder_id, type: string, source: input, description: "FK -> Cylinder.id; suspect cylinder if known", default: null }
      - { name: severity, type: enum, source: input, description: "MINOR | MAJOR; MAJOR always engages cage quarantine on confirm" }
      - { name: quarantine_cage, type: boolean, source: input, description: "Reporter recommends cage quarantine", default: false }
      - { name: reporter_clerk_id, type: string, source: system, description: "X-User-ID of the reporting SiteClerk" }
      - { name: note, type: string, source: input, description: "Free-text description", default: "" }
      - { name: confirmed_by, type: string, source: system, description: "X-User-ID of confirming ComplianceOfficer; null until CONFIRMED", default: null }
      - { name: confirmed_on, type: string, source: system, description: "ISO date of confirmation; null until CONFIRMED", default: null }
      - { name: resolved_by, type: string, source: system, description: "X-User-ID of resolving ComplianceOfficer; null until RESOLVED", default: null }
      - { name: resolution_note, type: string, source: system, description: "Resolution note; null until RESOLVED", default: null }
      - { name: false_alarm_reason, type: string, source: system, description: "Reason text; null unless FALSE_ALARM", default: null }
      - { name: status, type: enum, source: system, description: "REPORTED | CONFIRMED | RESOLVED | FALSE_ALARM", default: "REPORTED" }

  - name: RestockRun
    parent: null
    common_fields: true
    fields:
      - { name: site_id, type: string, source: input, description: "FK -> HostSite.id; destination site (exactly one site per run)" }
      - { name: driver_id, type: string, source: input, description: "FK -> Driver.id; assigned driver" }
      - { name: planned_date, type: string, source: input, description: "ISO date the run is planned for" }
      - { name: planned_full_count, type: integer, source: computed, description: "restock_suggested_qty evaluated at creation" }
      - { name: planned_empty_pickup_count, type: integer, source: computed, description: "Site empty_on_hand snapshot at creation" }
      - { name: assigned_cylinder_count, type: integer, source: computed, description: "Count of cylinders with in_transit_run_id = this run; 0 until dispatch", default: 0 }
      - { name: delivered_full_count, type: integer, source: system, description: "Actual fulls delivered, recorded at complete; null until COMPLETED", default: null }
      - { name: picked_up_empty_count, type: integer, source: system, description: "Actual empties picked up, recorded at complete; null until COMPLETED", default: null }
      - { name: variance_full_count, type: integer, source: computed, description: "delivered_full_count - planned_full_count; null until COMPLETED", default: null }
      - { name: verified_by, type: string, source: system, description: "X-User-ID of verifier; null until VERIFIED", default: null }
      - { name: status, type: enum, source: system, description: "DRAFT | DISPATCHED | IN_PROGRESS | COMPLETED | VERIFIED | CANCELLED", default: "DRAFT" }

  - name: CommissionStatement
    parent: null
    common_fields: true
    fields:
      - { name: site_id, type: string, source: input, description: "FK -> HostSite.id; statement site" }
      - { name: period_start, type: string, source: input, description: "ISO date; closed interval start (inclusive)" }
      - { name: period_end, type: string, source: input, description: "ISO date; closed interval end (inclusive); period length <= MAX_STATEMENT_PERIOD_DAYS" }
      - { name: basis_used, type: enum, source: system, description: "GROSS | NET — HostSite.commission_basis copied at creation" }
      - { name: gross_sales_cents, type: integer, source: computed, description: "Sum of total_cents over the commission input set (see commission_settlement)" }
      - { name: refunds_cents, type: integer, source: computed, description: "Sum of total_cents of orders whose refunded_on falls inside the period" }
      - { name: base_cents, type: integer, source: computed, description: "GROSS: gross_sales_cents; NET: gross_sales_cents - refunds_cents" }
      - { name: commission_cents, type: integer, source: computed, description: "Tiered marginal commission, per-sale rounded half-up then summed (see commission_settlement)" }
      - { name: leak_count, type: integer, source: computed, description: "Count of LeakReports with status CONFIRMED or RESOLVED and confirmed_on inside the period" }
      - { name: leak_deduction_cents, type: integer, source: computed, description: "leak_count * LEAK_PENALTY_CENTS" }
      - { name: net_payable_cents, type: integer, source: computed, description: "max(0, commission_cents - leak_deduction_cents)" }
      - { name: finalized_on, type: string, source: system, description: "ISO date of finalization; null until FINALIZED", default: null }
      - { name: paid_on, type: string, source: system, description: "ISO date of payment; null until PAID", default: null }
      - { name: dispute_note, type: string, source: system, description: "Host-site dispute note; null unless DISPUTED", default: null }
      - { name: status, type: enum, source: system, description: "DRAFT | FINALIZED | DISPUTED | PAID", default: "DRAFT" }

  - name: ReconciliationSession
    parent: null
    common_fields: true
    fields:
      - { name: site_id, type: string, source: input, description: "FK -> HostSite.id; session site" }
      - { name: business_date, type: string, source: input, description: "ISO date being reconciled; unique per site" }
      - { name: clerk_id, type: string, source: system, description: "X-User-ID of the creating SiteClerk (shift clerk)" }
      - { name: basis, type: enum, source: system, description: "BOOK | PHYSICAL — HostSite.recon_basis copied at creation" }
      - { name: opening_baseline_cents, type: integer, source: computed, description: "BOOK: site.opening_float_cents; PHYSICAL: counted_cash_cents of the site's most recent prior BALANCED/RESOLVED session (by business_date), else opening_float_cents" }
      - { name: expected_cash_cents, type: integer, source: computed, description: "opening_baseline_cents + cash events on business_date (exchange completes +total_cents, refill closes +total_cents, refunds -total_cents); snapshotted at creation, recomputed on count/recount" }
      - { name: expected_full_cylinders, type: integer, source: computed, description: "Site full_on_hand snapshot at session creation" }
      - { name: expected_empty_cylinders, type: integer, source: computed, description: "Site empty_on_hand snapshot at session creation" }
      - { name: counted_cash_cents, type: integer, source: system, description: "Physical cash count; null until count", default: null }
      - { name: counted_full_cylinders, type: integer, source: system, description: "Physical full count; null until count", default: null }
      - { name: counted_empty_cylinders, type: integer, source: system, description: "Physical empty count; null until count", default: null }
      - { name: cash_variance_cents, type: integer, source: computed, description: "counted_cash_cents - expected_cash_cents; null until count", default: null }
      - { name: full_variance, type: integer, source: computed, description: "counted_full_cylinders - expected_full_cylinders; null until count", default: null }
      - { name: empty_variance, type: integer, source: computed, description: "counted_empty_cylinders - expected_empty_cylinders; null until count", default: null }
      - { name: escalated_by, type: string, source: system, description: "X-User-ID of escalator; null until ESCALATED", default: null }
      - { name: resolved_by, type: string, source: system, description: "X-User-ID of resolver; null until RESOLVED", default: null }
      - { name: resolution_note, type: string, source: system, description: "Resolution note; null until RESOLVED", default: null }
      - { name: idempotency_key, type: string, source: input, description: "Client idempotency key; unique per clerk", default: null }
      - { name: status, type: enum, source: system, description: "OPEN | BALANCED | VARIANCE_FLAGGED | ESCALATED | RESOLVED", default: "OPEN" }

# =============================================================================
# Table 2: State Machine Table
# =============================================================================
state_machines:
  - entity: HostSite
    initial_state: ACTIVE
    terminal_states: [DECOMMISSIONED]
    transitions:
      - from: ACTIVE
        to: SUSPENDED
        trigger: "PATCH /sites/{siteId} with status=SUSPENDED"
        actor: PlatformAdmin
        preconditions: []
        side_effects:
          - "increments HostSite.version by 1"
      - from: SUSPENDED
        to: ACTIVE
        trigger: "PATCH /sites/{siteId} with status=ACTIVE"
        actor: PlatformAdmin
        preconditions: []
        side_effects:
          - "increments HostSite.version by 1"
      - from: SUSPENDED
        to: DECOMMISSIONED
        trigger: "PATCH /sites/{siteId} with status=DECOMMISSIONED"
        actor: PlatformAdmin
        preconditions:
          - "full_on_hand + empty_on_hand + quarantined_on_hand == 0 (else ERR_SITE_NOT_EMPTY)"
          - "no RestockRun for this site in DRAFT, DISPATCHED, IN_PROGRESS, or COMPLETED (else ERR_SITE_NOT_EMPTY)"
        side_effects:
          - "increments HostSite.version by 1"

  - entity: Cylinder
    initial_state: "fill_status=FULL or EMPTY (from registration initial_fill); cert_status=CERTIFIED"
    terminal_states: ["cert_status=CONDEMNED"]
    transitions:
      - from: "cert_status=CERTIFIED"
        to: "cert_status=RECERT_DUE"
        trigger: "system (POST /_clock/set_current_utc advance: current date > certification_expires_on)"
        actor: system
        preconditions: []
        side_effects: []
        note: "Boundary: on the date equal to certification_expires_on the cylinder is still CERTIFIED; it becomes RECERT_DUE only when current date is strictly greater."
      - from: "cert_status=RECERT_DUE"
        to: "cert_status=CERTIFIED"
        trigger: "POST /certification-records with outcome=PASS (immediately RECORDED)"
        actor: Technician
        preconditions:
          - "technician status ACTIVE"
          - "method=HYDROSTATIC requires technician cert_level=FULL (else ERR_FORBIDDEN)"
        side_effects:
          - "Cylinder.certified_on = performed_on; certification_expires_on = new_expires_on; cert_method_last = method"
      - from: "cert_status=CERTIFIED"
        to: "cert_status=CERTIFIED"
        trigger: "POST /certification-records with outcome=PASS (voluntary recertification)"
        actor: Technician
        preconditions:
          - "technician status ACTIVE"
          - "method=HYDROSTATIC requires technician cert_level=FULL (else ERR_FORBIDDEN)"
        side_effects:
          - "Cylinder.certified_on = performed_on; certification_expires_on = new_expires_on; cert_method_last = method"
      - from: "cert_status in {CERTIFIED, RECERT_DUE}"
        to: "cert_status=CONDEMNED"
        trigger: "POST /certification-records/{recordId}/confirm on a PENDING_SECOND CONDEMN record"
        actor: Technician
        preconditions:
          - "record status PENDING_SECOND"
          - "confirming technician status ACTIVE and cert_level FULL"
          - "confirming technician_id != record.technician_id (else ERR_SEGREGATION_OF_DUTIES)"
        side_effects:
          - "Cylinder.cert_status = CONDEMNED (cascade hop 1)"
          - "Because the cylinder left the sellable population, its former site's full_on_hand/empty_on_hand recompute (cascade hop 2)"
          - "Because full_on_hand recomputed, if the cylinder was FULL at a site and full_on_hand now <= reorder_floor_full, HostSite.restock_alert flips to true (cascade hop 3)"
      - from: "fill_status=FULL"
        to: "fill_status=FULL (site cleared)"
        trigger: "POST /exchange-orders/{orderId}/complete (cylinder issued to customer)"
        actor: SiteClerk
        preconditions: []
        side_effects:
          - "Cylinder.current_site_id = null (with customer); site full_on_hand recomputes (drops by 1)"
      - from: "fill_status=EMPTY (off-site)"
        to: "fill_status=EMPTY (at site)"
        trigger: "POST /exchange-orders/{orderId}/complete (returned cylinder received into cage)"
        actor: SiteClerk
        preconditions: []
        side_effects:
          - "returned Cylinder.current_site_id = order.site_id; owner_kind = FLEET (absorbed into fleet); site empty_on_hand recomputes (rises by 1)"
      - from: "fill_status in {FULL, EMPTY}"
        to: "fill_status=QUARANTINED"
        trigger: "POST /cylinders/{cylinderId}/quarantine; or system cascade from LeakReport confirm (MAJOR or quarantine_cage) for all FLEET cylinders at the affected site; or POST /exchange-orders/{orderId}/refund for the issued cylinder"
        actor: "ComplianceOfficer | system | SiteClerk (refund)"
        preconditions: []
        side_effects:
          - "site full_on_hand/empty_on_hand recompute and quarantined_on_hand rises; restock_alert recomputes"
      - from: "fill_status=QUARANTINED"
        to: "fill_status=EMPTY"
        trigger: "POST /cylinders/{cylinderId}/release-quarantine"
        actor: ComplianceOfficer
        preconditions:
          - "Cylinder.cert_status == CERTIFIED (else ERR_CYLINDER_NOT_CERTIFIED)"
        side_effects:
          - "site quarantined_on_hand drops; empty_on_hand rises; restock_alert recomputes"
      - from: "fill_status=FULL (depot: current_site_id null, in_transit null)"
        to: "fill_status=FULL (in transit)"
        trigger: "POST /restock-runs/{runId}/dispatch (depot selector assigns planned_full_count cylinders)"
        actor: PlatformAdmin
        preconditions: []
        side_effects:
          - "Cylinder.in_transit_run_id = run id; run.assigned_cylinder_count recomputes"
      - from: "fill_status=FULL (in transit)"
        to: "fill_status=FULL (at site)"
        trigger: "POST /restock-runs/{runId}/complete (delivered units)"
        actor: Driver
        preconditions: []
        side_effects:
          - "delivered cylinders: current_site_id = run.site_id, in_transit_run_id = null; undelivered assigned cylinders return to depot (in_transit_run_id = null); site full_on_hand recomputes"
      - from: "fill_status=EMPTY (at site)"
        to: "fill_status=EMPTY (in transit)"
        trigger: "POST /restock-runs/{runId}/complete (picked-up units)"
        actor: Driver
        preconditions: []
        side_effects:
          - "picked-up cylinders: in_transit_run_id = run id, current_site_id = null; site empty_on_hand recomputes"
      - from: "fill_status=EMPTY (in transit)"
        to: "fill_status=EMPTY (depot)"
        trigger: "POST /restock-runs/{runId}/verify (pickup accepted at depot)"
        actor: "PlatformAdmin | SiteClerk"
        preconditions: []
        side_effects:
          - "picked-up cylinders: in_transit_run_id = null (back at depot)"

  - entity: ExchangeOrder
    initial_state: DRAFT
    terminal_states: [VOIDED, REFUNDED]
    transitions:
      - from: DRAFT
        to: COMPLETED
        trigger: "POST /exchange-orders/{orderId}/complete"
        actor: SiteClerk
        preconditions:
          - "order status DRAFT (else ERR_INVALID_STATE)"
          - "cylinder_issue_selector finds a cylinder (else ERR_NO_STOCK)"
          - "payment_cash_cents >= total_cents (else ERR_INSUFFICIENT_PAYMENT)"
        side_effects:
          - "issued cylinder (selector: FLEET, CERTIFIED, FULL, current_site_id=site, in_transit null; rank certified_on ASC; tie-break created_at ASC) leaves site"
          - "if returned_cylinder_id present: returned cylinder enters site as EMPTY FLEET"
          - "business_date = current date; sale_seq assigned; change_due_cents computed"
          - "today's OPEN ReconciliationSession expected_cash_cents is recomputed to include +total_cents"
      - from: DRAFT
        to: VOIDED
        trigger: "POST /exchange-orders/{orderId}/void; or system cascade from LeakReport confirm"
        actor: "SiteClerk | system"
        preconditions: []
        side_effects:
          - "void_reason = MANUAL (clerk) or SAFETY (leak cascade)"
          - "no cash movement (no payment was captured)"
      - from: COMPLETED
        to: REFUNDED
        trigger: "POST /exchange-orders/{orderId}/refund"
        actor: SiteClerk
        preconditions:
          - "order status COMPLETED (else ERR_INVALID_STATE)"
          - "order.business_date == current date (else ERR_REFUND_WINDOW_CLOSED)"
          - "today's ReconciliationSession for the site, if one exists, is in OPEN or VARIANCE_FLAGGED (else ERR_REFUND_WINDOW_CLOSED)"
        side_effects:
          - "refunded_on = current date"
          - "issued cylinder returns to the site as fill_status=QUARANTINED (returned-goods inspection); site counts and restock_alert recompute (cascade)"
          - "today's ReconciliationSession expected_cash_cents recomputes to include -total_cents (cash compensation)"

  - entity: RefillTicket
    initial_state: OPEN
    terminal_states: [CLOSED, VOIDED]
    transitions:
      - from: OPEN
        to: WEIGHED
        trigger: "POST /refill-tickets/{ticketId}/weigh"
        actor: SiteClerk
        preconditions:
          - "ticket status OPEN (else ERR_INVALID_STATE)"
          - "|measured_tare_lbs - cylinder.tare_weight_lbs| <= TARE_TOLERANCE_LBS (else ERR_TARE_MISMATCH)"
          - "pre_weight_lbs >= measured_tare_lbs (else ERR_TARE_MISMATCH)"
        side_effects:
          - "measured_tare_lbs recorded"
      - from: WEIGHED
        to: OPEN
        trigger: "POST /refill-tickets/{ticketId}/reweigh"
        actor: SiteClerk
        preconditions: []
        side_effects:
          - "pre_weight_lbs = new value; measured_tare_lbs reset to null"
        note: "reweigh loop: OPEN -> WEIGHED -> OPEN is allowed repeatedly"
      - from: WEIGHED
        to: FILLED
        trigger: "POST /refill-tickets/{ticketId}/fill"
        actor: SiteClerk
        preconditions:
          - "ticket status WEIGHED (else ERR_INVALID_STATE)"
          - "cylinder.cert_status == CERTIFIED: CONDEMNED -> ERR_CYLINDER_CONDEMNED; RECERT_DUE -> ERR_CYLINDER_NOT_CERTIFIED"
          - "cylinder.fill_status != QUARANTINED (else ERR_CYLINDER_QUARANTINED)"
          - "post_weight_lbs - pre_weight_lbs <= max_fill_lbs (else ERR_OVERFILL_RISK); equality is allowed"
        side_effects:
          - "propane_lbs, tier rates pinned from current policy, propane_charge_cents, hazmat_fee_cents, total_cents computed (refill_charge)"
      - from: FILLED
        to: CLOSED
        trigger: "POST /refill-tickets/{ticketId}/close"
        actor: SiteClerk
        preconditions:
          - "ticket status FILLED (else ERR_INVALID_STATE)"
          - "payment_cash_cents >= total_cents (else ERR_INSUFFICIENT_PAYMENT)"
        side_effects:
          - "cylinder.fill_status = FULL; business_date = current date; sale_seq assigned; change_due_cents computed"
          - "today's OPEN ReconciliationSession expected_cash_cents recomputes to include +total_cents"
      - from: OPEN
        to: VOIDED
        trigger: "POST /refill-tickets/{ticketId}/void; or system cascade from LeakReport confirm"
        actor: "SiteClerk | system"
        preconditions: []
        side_effects: []
      - from: WEIGHED
        to: VOIDED
        trigger: "POST /refill-tickets/{ticketId}/void; or system cascade from LeakReport confirm"
        actor: "SiteClerk | system"
        preconditions: []
        side_effects: []
        note: "FILLED tickets cannot be voided (propane already dispensed); they must be closed"

  - entity: CertificationRecord
    initial_state: "RECORDED (outcome=PASS) or PENDING_SECOND (outcome=CONDEMN)"
    terminal_states: [RECORDED, CONFIRMED, REJECTED]
    transitions:
      - from: PENDING_SECOND
        to: CONFIRMED
        trigger: "POST /certification-records/{recordId}/confirm"
        actor: Technician
        preconditions:
          - "record status PENDING_SECOND (else ERR_INVALID_STATE)"
          - "cylinder cert_status != CONDEMNED (else ERR_CYLINDER_CONDEMNED)"
          - "confirming technician status ACTIVE, cert_level FULL (else ERR_FORBIDDEN)"
          - "confirmer != record.technician_id (else ERR_SEGREGATION_OF_DUTIES)"
        side_effects:
          - "confirmer_technician_id set; cylinder CONDEMNED cascade (see Cylinder machine)"
      - from: PENDING_SECOND
        to: REJECTED
        trigger: "POST /certification-records/{recordId}/reject"
        actor: Technician
        preconditions:
          - "record status PENDING_SECOND (else ERR_INVALID_STATE)"
          - "rejecting technician status ACTIVE, cert_level FULL (else ERR_FORBIDDEN)"
          - "rejecter != record.technician_id (else ERR_SEGREGATION_OF_DUTIES)"
        side_effects:
          - "confirmer_technician_id set; cylinder unchanged"

  - entity: LeakReport
    initial_state: REPORTED
    terminal_states: [RESOLVED, FALSE_ALARM]
    transitions:
      - from: REPORTED
        to: CONFIRMED
        trigger: "POST /leak-reports/{reportId}/confirm"
        actor: ComplianceOfficer
        preconditions:
          - "report status REPORTED (else ERR_INVALID_STATE)"
        side_effects:
          - "confirmed_by = actor, confirmed_on = current date (cascade hop 1)"
          - "if severity == MAJOR or quarantine_cage == true: all FLEET cylinders with current_site_id = site and fill_status FULL or EMPTY become QUARANTINED; because cylinder fill_status changed, site full_on_hand/empty_on_hand/quarantined_on_hand recompute (cascade hop 2); because full_on_hand recomputed, restock_alert flips when full_on_hand <= reorder_floor_full (cascade hop 3)"
          - "because the site now has a confirmed quarantining leak, HostSite.sales_posture recomputes to SALES_BLOCKED; because posture became SALES_BLOCKED, every DRAFT ExchangeOrder and every OPEN or WEIGHED RefillTicket at the site is auto-VOIDED with void_reason SAFETY (cascade hop 2'); because those tickets/orders carried no captured cash, today's ReconciliationSession expected_cash_cents is unchanged but recomputed (cascade hop 3')"
      - from: REPORTED
        to: FALSE_ALARM
        trigger: "POST /leak-reports/{reportId}/false-alarm"
        actor: ComplianceOfficer
        preconditions:
          - "report status REPORTED (else ERR_INVALID_STATE)"
        side_effects: []
      - from: CONFIRMED
        to: RESOLVED
        trigger: "POST /leak-reports/{reportId}/resolve"
        actor: ComplianceOfficer
        preconditions:
          - "report status CONFIRMED (else ERR_INVALID_STATE)"
          - "if quarantine engaged (severity MAJOR or quarantine_cage): at least one CertificationRecord with outcome=PASS, status=RECORDED, performed_on >= confirmed_on exists for a FLEET cylinder whose current_site_id == site (else ERR_REINSPECTION_REQUIRED)"
          - "resolver X-User-ID != reporter_clerk_id (else ERR_SEGREGATION_OF_DUTIES)"
        side_effects:
          - "resolved_by, resolution_note set; HostSite.sales_posture recomputes (SALES_OPEN when no other confirmed quarantining leak remains)"

  - entity: RestockRun
    initial_state: DRAFT
    terminal_states: [VERIFIED, CANCELLED]
    transitions:
      - from: DRAFT
        to: CANCELLED
        trigger: "POST /restock-runs/{runId}/cancel; or system supersede (a new DRAFT run created for the same site auto-cancels the older DRAFT)"
        actor: "PlatformAdmin | system"
        preconditions: []
        side_effects: []
      - from: DRAFT
        to: DISPATCHED
        trigger: "POST /restock-runs/{runId}/dispatch"
        actor: PlatformAdmin
        preconditions:
          - "run status DRAFT (else ERR_INVALID_STATE)"
          - "site status ACTIVE (else ERR_SITE_NOT_ACTIVE)"
          - "driver status ACTIVE (else ERR_INVALID_STATE)"
          - "planned_date <= driver.dot_medical_expires_on (else ERR_DRIVER_CERT_EXPIRED)"
          - "no other run for the same driver with the same planned_date in DISPATCHED or IN_PROGRESS (else ERR_DRIVER_ROUTE_CONFLICT)"
          - "planned_full_count * FULL_CYLINDER_LBS + planned_empty_pickup_count * EMPTY_CYLINDER_LBS <= driver.vehicle_max_payload_lbs (else ERR_DOT_PAYLOAD_EXCEEDED)"
          - "planned_full_count + planned_empty_pickup_count > 0 (else ERR_EMPTY_ROUTE)"
          - "depot pool (FLEET, CERTIFIED, FULL, current_site_id null, in_transit_run_id null) has at least planned_full_count cylinders (else ERR_DEPOT_STOCK_LOW)"
        side_effects:
          - "depot selector assigns planned_full_count cylinders (rank certified_on ASC; tie-break created_at ASC): in_transit_run_id = run id"
      - from: DISPATCHED
        to: IN_PROGRESS
        trigger: "POST /restock-runs/{runId}/arrive"
        actor: Driver
        preconditions:
          - "run status DISPATCHED (else ERR_INVALID_STATE)"
          - "actor X-User-ID == run.driver_id (else ERR_FORBIDDEN)"
          - "current date == planned_date (else ERR_INVALID_STATE)"
        side_effects: []
      - from: IN_PROGRESS
        to: COMPLETED
        trigger: "POST /restock-runs/{runId}/complete"
        actor: Driver
        preconditions:
          - "run status IN_PROGRESS (else ERR_INVALID_STATE)"
          - "actor X-User-ID == run.driver_id (else ERR_FORBIDDEN)"
          - "0 <= delivered_full_count <= assigned_cylinder_count (else ERR_VALIDATION)"
          - "0 <= picked_up_empty_count <= site empty_on_hand (else ERR_VALIDATION)"
        side_effects:
          - "delivered cylinders move to site (full_on_hand rises); undelivered assigned cylinders return to depot"
          - "picked-up empties leave site into transit (empty_on_hand drops); variance_full_count computed"
          - "site restock_alert recomputes"
      - from: COMPLETED
        to: VERIFIED
        trigger: "POST /restock-runs/{runId}/verify"
        actor: "PlatformAdmin | SiteClerk"
        preconditions:
          - "run status COMPLETED (else ERR_INVALID_STATE)"
          - "verifier X-User-ID != run.driver_id (else ERR_SEGREGATION_OF_DUTIES)"
        side_effects:
          - "verified_by set; picked-up cylinders reach depot (in_transit_run_id = null)"
      - from: DISPATCHED
        to: CANCELLED
        trigger: "POST /restock-runs/{runId}/cancel"
        actor: PlatformAdmin
        preconditions: []
        side_effects:
          - "all assigned cylinders return to depot (in_transit_run_id = null)"

  - entity: CommissionStatement
    initial_state: DRAFT
    terminal_states: [PAID]
    transitions:
      - from: DRAFT
        to: FINALIZED
        trigger: "POST /commission-statements/{statementId}/finalize"
        actor: PlatformAdmin
        preconditions:
          - "statement status DRAFT (else ERR_INVALID_STATE)"
          - "period_end < current date (else ERR_PERIOD_NOT_CLOSED)"
          - "every calendar date in [period_start, period_end] has at least one ReconciliationSession for the site in BALANCED or RESOLVED (else ERR_RECONCILIATION_UNRESOLVED)"
        side_effects:
          - "commission_settlement computed: gross_sales_cents, refunds_cents, base_cents, commission_cents, leak_count, leak_deduction_cents, net_payable_cents; finalized_on set"
      - from: FINALIZED
        to: DISPUTED
        trigger: "POST /commission-statements/{statementId}/dispute"
        actor: HostSiteManager
        preconditions:
          - "statement status FINALIZED (else ERR_INVALID_STATE)"
          - "actor X-User-ID == statement.site_id (else ERR_FORBIDDEN)"
        side_effects:
          - "dispute_note set"
      - from: DISPUTED
        to: FINALIZED
        trigger: "POST /commission-statements/{statementId}/finalize"
        actor: PlatformAdmin
        preconditions:
          - "statement status DISPUTED (else ERR_INVALID_STATE)"
          - "same period/reconciliation preconditions as DRAFT -> FINALIZED"
        side_effects:
          - "commission_settlement recomputed from current data; finalized_on refreshed"
        note: "dispute loop: FINALIZED -> DISPUTED -> FINALIZED is allowed repeatedly"
      - from: FINALIZED
        to: PAID
        trigger: "POST /commission-statements/{statementId}/pay"
        actor: PlatformAdmin
        preconditions:
          - "statement status FINALIZED (else ERR_INVALID_STATE)"
        side_effects:
          - "paid_on set"

  - entity: ReconciliationSession
    initial_state: OPEN
    terminal_states: [RESOLVED, BALANCED]
    transitions:
      - from: OPEN
        to: BALANCED
        trigger: "POST /reconciliation-sessions/{sessionId}/count"
        actor: SiteClerk
        preconditions:
          - "session status OPEN (else ERR_INVALID_STATE)"
          - "variance rule: |cash_variance_cents| < VARIANCE_TOLERANCE_CENTS AND full_variance == 0 AND empty_variance == 0"
        side_effects:
          - "variances computed and stored"
      - from: OPEN
        to: VARIANCE_FLAGGED
        trigger: "POST /reconciliation-sessions/{sessionId}/count"
        actor: SiteClerk
        preconditions:
          - "session status OPEN (else ERR_INVALID_STATE)"
          - "|cash_variance_cents| >= VARIANCE_TOLERANCE_CENTS OR full_variance != 0 OR empty_variance != 0"
        side_effects:
          - "variances computed and stored"
        note: "boundary: exactly VARIANCE_TOLERANCE_CENTS (500) of cash variance flags the session"
      - from: VARIANCE_FLAGGED
        to: OPEN
        trigger: "POST /reconciliation-sessions/{sessionId}/recount"
        actor: SiteClerk
        preconditions: []
        side_effects:
          - "counted_* and variance fields reset to null; session accepts a fresh count"
        note: "recount loop: OPEN -> VARIANCE_FLAGGED -> OPEN is allowed repeatedly"
      - from: VARIANCE_FLAGGED
        to: ESCALATED
        trigger: "POST /reconciliation-sessions/{sessionId}/escalate"
        actor: "PlatformAdmin | ComplianceOfficer"
        preconditions:
          - "session status VARIANCE_FLAGGED (else ERR_INVALID_STATE)"
        side_effects:
          - "escalated_by set"
      - from: ESCALATED
        to: RESOLVED
        trigger: "POST /reconciliation-sessions/{sessionId}/resolve"
        actor: "PlatformAdmin | ComplianceOfficer"
        preconditions:
          - "session status ESCALATED (else ERR_INVALID_STATE)"
          - "resolver X-User-ID != session.clerk_id (else ERR_SEGREGATION_OF_DUTIES)"
        side_effects:
          - "resolved_by, resolution_note set"

  - entity: Driver
    initial_state: ACTIVE
    terminal_states: []
    transitions:
      - from: ACTIVE
        to: SUSPENDED
        trigger: "PATCH /drivers/{driverId} with status=SUSPENDED"
        actor: PlatformAdmin
        preconditions: []
        side_effects: []
      - from: SUSPENDED
        to: ACTIVE
        trigger: "PATCH /drivers/{driverId} with status=ACTIVE"
        actor: PlatformAdmin
        preconditions: []
        side_effects: []

  - entity: Technician
    initial_state: ACTIVE
    terminal_states: []
    transitions:
      - from: ACTIVE
        to: SUSPENDED
        trigger: "PATCH /technicians/{technicianId} with status=SUSPENDED"
        actor: PlatformAdmin
        preconditions: []
        side_effects: []
      - from: SUSPENDED
        to: ACTIVE
        trigger: "PATCH /technicians/{technicianId} with status=ACTIVE"
        actor: PlatformAdmin
        preconditions: []
        side_effects: []

# =============================================================================
# 1.2.1 Concurrency Rules (true races only — OCC on parent version)
# =============================================================================
concurrency_rules:
  - rule_id: restock-run-create-stale-site
    parent_entity: HostSite
    write_endpoint: "POST /restock-runs"
    occ_field: expected_site_version
    description: |
      Creating a RestockRun against a HostSite whose version has advanced since
      the client last observed it is rejected. Creating a run auto-cancels any
      existing DRAFT run for the same site (supersede), so a client holding a
      stale site view must re-read before its create is accepted.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: pricing-policy-create-stale-site
    parent_entity: HostSite
    write_endpoint: "POST /pricing-policies"
    occ_field: expected_site_version
    description: |
      Creating a PricingPolicy with supersede_current=true clips the current
      policy's effective_to; a client whose view of the site predates another
      policy write holds a stale picture of which window is open and is
      rejected via expected_site_version mismatch.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: site-config-patch-stale-version
    parent_entity: HostSite
    write_endpoint: "PATCH /sites/{siteId}"
    occ_field: expected_site_version
    description: |
      A PATCH that changes site configuration (par level, rates, status) is
      rejected when expected_site_version does not match the site's current
      version, because another accepted write has advanced the configuration
      since the client last read it.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# Table 3: Calculation Rules Table
# =============================================================================
calculations:
  - name: cylinder_certification_expiry
    trigger: "cylinder registration; CertificationRecord PASS; POST /_clock/set_current_utc (RECERT_DUE sweep)"
    algorithm: threshold
    formula: |
      initial: certification_expires_on = manufacture_date + INITIAL_CERT_YEARS years
      PASS recert: new_expires_on = performed_on + VISUAL_RECERT_YEARS years (method=VISUAL)
                                 or performed_on + HYDROSTATIC_RECERT_YEARS years (method=HYDROSTATIC)
      RECERT_DUE sweep: cert_status CERTIFIED -> RECERT_DUE iff current_date > certification_expires_on
      (strictly greater; on the expiry date itself the cylinder remains CERTIFIED through end of day)
    input_set: "all cylinders with cert_status=CERTIFIED"
    constants:
      INITIAL_CERT_YEARS: 12
      VISUAL_RECERT_YEARS: 5
      HYDROSTATIC_RECERT_YEARS: 7
    precision: "date granularity (ISO calendar days, UTC)"

  - name: swap_charge
    trigger: "POST /exchange-orders (prices pinned at creation)"
    algorithm: tiered_pricing
    formula: |
      policy = site's PricingPolicy where effective_from <= current_date AND (effective_to IS NULL OR current_date < effective_to)
      unit_price_cents = policy.swap_price_cents
      core_deposit_cents = 0 if returned_cylinder_id provided else policy.core_deposit_cents
      subtotal = unit_price_cents + core_deposit_cents
      tax_cents = round_half_up(subtotal * policy.tax_rate_bps / 10000) to whole cents
      total_cents = subtotal + tax_cents
    input_set: "the creating order plus the site's current PricingPolicy"
    precision: "whole cents, round_half_up; tax rounded once on the subtotal"
    variants:
      - name: with_return
        when: "returned_cylinder_id present"
        difference: "core_deposit_cents = 0"
      - name: without_return
        when: "returned_cylinder_id null"
        difference: "core_deposit_cents = policy.core_deposit_cents"

  - name: refill_charge
    trigger: "POST /refill-tickets/{ticketId}/fill"
    algorithm: tiered_pricing
    formula: |
      max_fill_lbs = round_half_up(water_capacity_lbs * PROPANE_FILL_FACTOR, 2)   # at ticket creation
      propane_lbs = round_half_up(post_weight_lbs - pre_weight_lbs, 2)
      reject ERR_OVERFILL_RISK iff propane_lbs > max_fill_lbs (equality allowed)
      tier1_lbs = min(propane_lbs, tier1_max_lbs)
      tier2_lbs = propane_lbs - tier1_lbs
      tier1_cents = round_half_up(tier1_lbs * tier1_cents_per_lb) to whole cents   # per-tier rounding FIRST
      tier2_cents = round_half_up(tier2_lbs * tier2_cents_per_lb) to whole cents
      propane_charge_cents = tier1_cents + tier2_cents                              # then summed
      hazmat_fee_cents = 0 if site.promo_waives_hazmat else site.hazmat_fee_cents
      total_cents = propane_charge_cents + hazmat_fee_cents
    input_set: "the ticket, its cylinder, the site's current PricingPolicy (pinned at fill), and the site's hazmat config"
    constants:
      PROPANE_FILL_FACTOR: 0.42
      TARE_TOLERANCE_LBS: 0.10
    precision: "pounds 2dp round_half_up; cents whole, round_half_up per tier BEFORE summing"

  - name: commission_settlement
    trigger: "POST /commission-statements/{statementId}/finalize"
    algorithm: tiered_pricing
    formula: |
      sales = (ExchangeOrder status COMPLETED or REFUNDED with business_date in [period_start, period_end] inclusive)
              UNION (RefillTicket status CLOSED with business_date in [period_start, period_end] inclusive)
              ordered by sale_seq ASC
      gross_sales_cents = sum(total_cents over sales)
      refunds_cents = sum(total_cents over sales that are REFUNDED with refunded_on in period)
      base set B = if basis_used == GROSS: sales
                   if basis_used == NET:   sales minus orders refunded within the period
      base_cents = if GROSS: gross_sales_cents else gross_sales_cents - refunds_cents
      cumulative = 0
      commission_cents = 0
      for each sale s in B (sale_seq ASC):
        rate portion below threshold: below = max(0, min(cumulative + s.total_cents, tier_threshold) - cumulative)
        above = s.total_cents - below
        sale_commission = round_half_up(below * rate_bps / 10000 + above * (rate_bps + tier2_bonus_bps) / 10000) to whole cents
        commission_cents += sale_commission            # per-sale rounding THEN sum (pinned order)
        cumulative += s.total_cents
      leak_count = count of LeakReport with confirmed_on in [period_start, period_end] and status in {CONFIRMED, RESOLVED}
      leak_deduction_cents = leak_count * LEAK_PENALTY_CENTS
      net_payable_cents = max(0, commission_cents - leak_deduction_cents)
    input_set: "COMPLETED/REFUNDED exchanges and CLOSED refills with business_date inside the closed period; leaks confirmed inside the period; DRAFT/VOIDED orders and non-CLOSED refills are excluded"
    constants:
      LEAK_PENALTY_CENTS: 25000
      MAX_STATEMENT_PERIOD_DAYS: 62
    precision: "whole cents, round_half_up per sale BEFORE summing"
    variants:
      - name: gross_basis
        when: "site commission_basis = GROSS"
        difference: "refunded-in-period sales remain in the commissioned set"
      - name: net_basis
        when: "site commission_basis = NET"
        difference: "refunded-in-period sales are excluded from the commissioned set, so identical raw sales produce a smaller base and smaller commission"

  - name: reconciliation_expected_cash
    trigger: "POST /reconciliation-sessions (snapshot), POST .../count and .../recount (recompute), plus any cash event on an OPEN session's business_date"
    algorithm: aggregation
    formula: |
      cash_events on business_date D = exchange completes (+total_cents) + refill closes (+total_cents) + refunds (-total_cents)
      expected_cash_cents = opening_baseline_cents + sum(cash_events)
      opening_baseline_cents:
        BOOK:     site.opening_float_cents
        PHYSICAL: counted_cash_cents of the site's most recent prior session (largest business_date < D)
                  with status in {BALANCED, RESOLVED}; if none, site.opening_float_cents
      outcome at count: |counted_cash_cents - expected_cash_cents| >= VARIANCE_TOLERANCE_CENTS
                        OR full/empty count variance != 0  -> VARIANCE_FLAGGED, else BALANCED
    input_set: "cash events whose stamped business_date equals the session's business_date; prior sessions of the same site only"
    constants:
      VARIANCE_TOLERANCE_CENTS: 500
    precision: "whole cents; threshold comparison is inclusive (>=)"
    variants:
      - name: book_baseline
        when: "site recon_basis = BOOK"
        difference: "baseline is the declared opening float; prior-day counted over/short is NOT carried"
      - name: physical_baseline
        when: "site recon_basis = PHYSICAL"
        difference: "baseline carries the prior closed session's counted cash, so identical same-day events yield a different expected value whenever a prior day closed with any nonzero variance"

  - name: site_cage_counts
    trigger: "any Cylinder mutation touching current_site_id, in_transit_run_id, fill_status, cert_status, or owner_kind; computed on read"
    algorithm: aggregation
    formula: |
      full_on_hand        = count(Cylinder: owner_kind=FLEET AND current_site_id=site AND in_transit_run_id IS NULL AND fill_status=FULL AND cert_status != CONDEMNED)
      empty_on_hand       = same with fill_status=EMPTY
      quarantined_on_hand = same with fill_status=QUARANTINED
    input_set: "FLEET cylinders only; CUSTOMER cylinders never counted; CONDEMNED excluded from all three counts"

  - name: restock_suggested_qty
    trigger: "POST /restock-runs (planned_full_count computed at creation); planned_empty_pickup_count = site empty_on_hand snapshot at creation"
    algorithm: forward_looking
    formula: |
      # evaluation order is pinned (circular-looking dependency made explicit):
      # (1) trailing average uses completed sales INCLUDING days made possible by prior restocks
      swaps_in_window = count(ExchangeOrder status COMPLETED with site_id=site
                              and business_date in [current_date - FORECAST_WINDOW_DAYS, current_date) )  # half-open
      avg_daily_swaps = swaps_in_window / FORECAST_WINDOW_DAYS
      # (2) forecast demand until delivery
      days_until = max(0, planned_date - current_date)   # in whole days
      forecast = ceil(avg_daily_swaps * days_until)
      # (3) project stock at arrival
      projected_full = full_on_hand - forecast           # may go negative
      # (4) clamp into cage free space
      suggested = min(cage_capacity_cylinders - full_on_hand, max(0, par_level_full - projected_full))
    input_set: "completed exchanges of this site in the trailing half-open 14-day window; site cage fields"
    constants:
      FORECAST_WINDOW_DAYS: 14
    precision: "avg_daily_swaps exact rational; forecast ceil to integer; suggested integer"

  - name: driver_payload_check
    trigger: "POST /restock-runs/{runId}/dispatch"
    algorithm: threshold
    formula: |
      payload_lbs = planned_full_count * FULL_CYLINDER_LBS + planned_empty_pickup_count * EMPTY_CYLINDER_LBS
      reject ERR_DOT_PAYLOAD_EXCEEDED iff payload_lbs > driver.vehicle_max_payload_lbs   # equality allowed
    input_set: "the run's planned counts and the assigned driver"
    constants:
      FULL_CYLINDER_LBS: 37
      EMPTY_CYLINDER_LBS: 17
    precision: "integer pounds; inclusive upper bound (<=)"

  - name: site_sales_posture
    trigger: "LeakReport confirm / resolve / false-alarm; computed on read"
    algorithm: aggregation
    formula: |
      SALES_BLOCKED iff exists LeakReport for site with status=CONFIRMED AND (severity=MAJOR OR quarantine_cage=true)
      else SALES_OPEN
      restock_alert = (full_on_hand <= reorder_floor_full)   # inclusive threshold
      reorder_floor_full = ceil(par_level_full * PAR_FLOOR_RATIO)
    input_set: "leak reports of the site; cage counts"
    constants:
      PAR_FLOOR_RATIO: 0.5

  - name: cylinder_issue_selector
    trigger: "POST /exchange-orders/{orderId}/complete"
    algorithm: constraint_propagation
    formula: |
      candidates = Cylinder: owner_kind=FLEET AND cert_status=CERTIFIED AND fill_status=FULL
                   AND current_site_id=order.site_id AND in_transit_run_id IS NULL
      rank: certified_on ASC; tie-break: created_at ASC
      selected = first candidate; empty candidate set -> ERR_NO_STOCK
      (same selector shape is used at restock dispatch with current_site_id IS NULL for the depot pool;
       empty depot pool -> ERR_DEPOT_STOCK_LOW)
    input_set: "as filtered above; RECERT_DUE and QUARANTINED cylinders are excluded even though full_on_hand counts RECERT_DUE stock"

# =============================================================================
# Table 4: Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present and role is a declared role"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all endpoints"
  - priority: 2
    category: auth
    check: "role permitted for this endpoint; ownership rules (Driver acts on own runs, HostSiteManager on own site, clerk FLEET-cylinder registration forbidden, technician cert_level gates HYDROSTATIC/CONDEMN)"
    error_id: ERR_FORBIDDEN
    http_status: 403
    applies_to: "all endpoints"
  - priority: 3
    category: existence
    check: "path resource ids exist, validated left-to-right"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all endpoints with path ids"
  - priority: 4
    category: existence
    check: "body-referenced ids exist (site_id, cylinder_id, driver_id, returned_cylinder_id)"
    error_id: ERR_REFERENCE_NOT_FOUND
    http_status: 422
    applies_to: "creation endpoints with body FKs"
  - priority: 5
    category: business_constraint
    check: "optimistic concurrency: expected_site_version matches the site's current version"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /restock-runs, POST /pricing-policies, PATCH /sites/{siteId}"
  - priority: 6
    category: state
    check: "target resource in a valid from-state for the requested transition; terminal-state lockdown; site ACTIVE for sales/dispatch; arrive date matches planned_date"
    error_id: "ERR_INVALID_STATE | ERR_SITE_NOT_ACTIVE"
    http_status: 409
    applies_to: "all action endpoints"
  - priority: 7
    category: business_safety
    check: "condemned or quarantined cylinders are rejected before any other business check"
    error_id: "ERR_CYLINDER_CONDEMNED | ERR_CYLINDER_QUARANTINED"
    http_status: 409
    applies_to: "POST /refill-tickets/{id}/fill, POST /exchange-orders (condemned return), POST /certification-records, POST /cylinders/{id}/release-quarantine (ERR_CYLINDER_NOT_CERTIFIED)"
  - priority: 8
    category: business_safety
    check: "certification currency for regulated handling (refill fill requires CERTIFIED)"
    error_id: ERR_CYLINDER_NOT_CERTIFIED
    http_status: 409
    applies_to: "POST /refill-tickets/{id}/fill"
  - priority: 9
    category: business_safety
    check: "leak-blocked site gates all sales; DOT driver medical currency and vehicle payload limit gate dispatch"
    error_id: "ERR_SALES_BLOCKED | ERR_DRIVER_CERT_EXPIRED | ERR_DOT_PAYLOAD_EXCEEDED"
    http_status: 409
    applies_to: "POST /exchange-orders, POST /refill-tickets, POST /restock-runs/{id}/dispatch"
  - priority: 10
    category: business_temporal
    check: "policy effective_from not before current date; commission period fully in the past"
    error_id: "ERR_POLICY_WINDOW_IN_PAST | ERR_PERIOD_NOT_CLOSED"
    http_status: 422
    applies_to: "POST /pricing-policies, POST /commission-statements/{id}/finalize"
  - priority: 11
    category: business_constraint
    check: "uniqueness and overlap: pricing half-open windows per site; one DRAFT restock run per site (supersede); one open leak per site; one reconciliation session per (site, business_date); driver single run per planned_date; serial/license uniqueness; idempotency-key reuse with different payload; refill only on CUSTOMER cylinders; tare tolerance; overfill; non-empty route; selector stock; decommission emptiness"
    error_id: "ERR_POLICY_WINDOW_OVERLAP | ERR_DRIVER_ROUTE_CONFLICT | ERR_LEAK_ALREADY_OPEN | ERR_SESSION_EXISTS | ERR_VALIDATION | ERR_IDEMPOTENCY_CONFLICT | ERR_NOT_REFILLABLE | ERR_TARE_MISMATCH | ERR_OVERFILL_RISK | ERR_EMPTY_ROUTE | ERR_NO_STOCK | ERR_DEPOT_STOCK_LOW | ERR_SITE_NOT_EMPTY"
    http_status: 409
    applies_to: "per-error endpoints (see error catalog)"
  - priority: 12
    category: business_referential
    check: "cross-entity state gates: commission finalize requires all period dates reconciled; refund requires same-day and open reconciliation; leak resolution requires re-inspection evidence; sales require a current pricing policy"
    error_id: "ERR_RECONCILIATION_UNRESOLVED | ERR_REFUND_WINDOW_CLOSED | ERR_REINSPECTION_REQUIRED | ERR_NO_ACTIVE_POLICY"
    http_status: 409
    applies_to: "POST /commission-statements/{id}/finalize, POST /exchange-orders/{id}/refund, POST /leak-reports/{id}/resolve, POST /exchange-orders, POST /refill-tickets"
  - priority: 13
    category: business_fiscal
    check: "payment sufficiency (tendered cash >= total)"
    error_id: ERR_INSUFFICIENT_PAYMENT
    http_status: 402
    applies_to: "POST /exchange-orders/{id}/complete, POST /refill-tickets/{id}/close"
  - priority: 14
    category: auth
    check: "segregation of duties: restock verifier != run driver; reconciliation resolver != shift clerk; condemn confirmer/rejecter != requesting technician; leak resolver != reporter"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /restock-runs/{id}/verify, POST /reconciliation-sessions/{id}/resolve, POST /certification-records/{id}/confirm, POST /certification-records/{id}/reject, POST /leak-reports/{id}/resolve"

# =============================================================================
# 1.0 Response Envelope (FIXED)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# Table 5: API Endpoint Table
# =============================================================================
endpoints:
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Advance the logical clock. Startup default (before any call) is exactly 2026-05-01T00:00:00Z and never wall-clock time. Side effect: RECERT_DUE sweep over all CERTIFIED cylinders whose certification_expires_on is strictly before the new current date."
    roles: [PlatformAdmin]
    code: 200
    input: [to_iso8601]
    output: "{ current_utc: string }"
    side_effects:
      - "Cylinder CERTIFIED -> RECERT_DUE sweep per cylinder_certification_expiry"

  - method: POST
    path: "/sites"
    description: "Create a host site"
    roles: [PlatformAdmin]
    code: 201
    input: [name, cage_capacity_cylinders, par_level_full, commission_rate_bps, "address?", "opening_float_cents?", "commission_tier_threshold_cents?", "commission_tier2_bonus_bps?", "commission_basis?", "recon_basis?", "hazmat_fee_cents?", "promo_waives_hazmat?"]
    output: HostSite
    side_effects: ["status=ACTIVE; computed counts start at 0; sales_posture=SALES_OPEN"]

  - method: GET
    path: "/sites/{siteId}"
    description: "Read a site including computed cage counts, sales_posture, restock_alert"
    roles: [PlatformAdmin, SiteClerk, HostSiteManager, Driver, Technician, ComplianceOfficer]
    code: 200
    input: []
    output: HostSite
    side_effects: []

  - method: GET
    path: "/sites"
    description: "List sites with pagination"
    roles: [PlatformAdmin, ComplianceOfficer]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: "HostSite[]"
    side_effects: []

  - method: PATCH
    path: "/sites/{siteId}"
    description: "Update site configuration or status (ACTIVE/SUSPENDED/DECOMMISSIONED); OCC-guarded"
    roles: [PlatformAdmin]
    code: 200
    input: [expected_site_version, "name?", "cage_capacity_cylinders?", "par_level_full?", "commission_rate_bps?", "commission_tier_threshold_cents?", "commission_tier2_bonus_bps?", "commission_basis?", "recon_basis?", "hazmat_fee_cents?", "promo_waives_hazmat?", "opening_float_cents?", "status?"]
    output: HostSite
    side_effects: ["increments HostSite.version by 1"]

  - method: POST
    path: "/pricing-policies"
    description: "Create a pricing policy for a site; supersede_current=true clips the current open-ended/overlapping policy's effective_to to the new effective_from (requires new effective_from strictly after the current policy's effective_from, else ERR_POLICY_WINDOW_OVERLAP); without supersede any overlap is rejected. OCC-guarded."
    roles: [PlatformAdmin]
    code: 201
    input: [site_id, expected_site_version, swap_price_cents, core_deposit_cents, tax_rate_bps, refill_tier1_cents_per_lb, refill_tier1_max_lbs, refill_tier2_cents_per_lb, effective_from, "effective_to?", "supersede_current?"]
    output: PricingPolicy
    side_effects: ["increments HostSite.version by 1", "optional clip of the superseded policy's effective_to"]

  - method: GET
    path: "/pricing-policies/{policyId}"
    description: "Read a pricing policy"
    roles: [PlatformAdmin, HostSiteManager]
    code: 200
    input: []
    output: PricingPolicy
    side_effects: []

  - method: GET
    path: "/pricing-policies"
    description: "List pricing policies, filterable by site"
    roles: [PlatformAdmin, HostSiteManager]
    code: 200
    input: ["site_id?", "limit?", "offset?"]
    output: "PricingPolicy[]"
    side_effects: []

  - method: POST
    path: "/drivers"
    description: "Register a driver"
    roles: [PlatformAdmin]
    code: 201
    input: [name, license_number, dot_medical_expires_on, vehicle_max_payload_lbs]
    output: Driver
    side_effects: ["status=ACTIVE"]

  - method: GET
    path: "/drivers/{driverId}"
    description: "Read a driver"
    roles: [PlatformAdmin, Driver]
    code: 200
    input: []
    output: Driver
    side_effects: []

  - method: PATCH
    path: "/drivers/{driverId}"
    description: "Update driver status or DOT fields"
    roles: [PlatformAdmin]
    code: 200
    input: ["status?", "dot_medical_expires_on?", "vehicle_max_payload_lbs?"]
    output: Driver
    side_effects: []

  - method: POST
    path: "/technicians"
    description: "Register a technician"
    roles: [PlatformAdmin]
    code: 201
    input: [name, cert_level]
    output: Technician
    side_effects: ["status=ACTIVE"]

  - method: GET
    path: "/technicians/{technicianId}"
    description: "Read a technician"
    roles: [PlatformAdmin, Technician]
    code: 200
    input: []
    output: Technician
    side_effects: []

  - method: PATCH
    path: "/technicians/{technicianId}"
    description: "Update technician status or cert level"
    roles: [PlatformAdmin]
    code: 200
    input: ["status?", "cert_level?"]
    output: Technician
    side_effects: []

  - method: POST
    path: "/cylinders"
    description: "Register a cylinder. FLEET registration requires PlatformAdmin (SiteClerk -> ERR_FORBIDDEN). CUSTOMER cylinders must have current_site_id null (else ERR_VALIDATION). certification_expires_on = manufacture_date + 12 years."
    roles: [PlatformAdmin, SiteClerk]
    code: 201
    input: [serial_number, owner_kind, water_capacity_lbs, tare_weight_lbs, manufacture_date, initial_fill, "current_site_id?"]
    output: Cylinder
    side_effects: ["cert_status=CERTIFIED; certified_on=manufacture_date; cert_method_last=INITIAL; no HostSite mutation (counts are computed)"]

  - method: GET
    path: "/cylinders/{cylinderId}"
    description: "Read a cylinder"
    roles: [PlatformAdmin, SiteClerk, Technician, ComplianceOfficer, Driver]
    code: 200
    input: []
    output: Cylinder
    side_effects: []

  - method: GET
    path: "/cylinders"
    description: "List cylinders with filters"
    roles: [PlatformAdmin, SiteClerk, Technician, ComplianceOfficer]
    code: 200
    input: ["current_site_id?", "in_transit_run_id?", "fill_status?", "cert_status?", "owner_kind?", "limit?", "offset?"]
    output: "Cylinder[]"
    side_effects: []

  - method: POST
    path: "/cylinders/{cylinderId}/quarantine"
    description: "Quarantine a cylinder (fill_status -> QUARANTINED)"
    roles: [ComplianceOfficer]
    code: 200
    input: ["note?"]
    output: Cylinder
    side_effects: ["site counts and restock_alert recompute"]

  - method: POST
    path: "/cylinders/{cylinderId}/release-quarantine"
    description: "Release a quarantined cylinder to EMPTY; requires cert_status CERTIFIED"
    roles: [ComplianceOfficer]
    code: 200
    input: []
    output: Cylinder
    side_effects: ["fill_status=EMPTY; site counts and restock_alert recompute"]

  - method: POST
    path: "/exchange-orders"
    description: "Create a swap order (prices pinned from current policy). Idempotent on idempotency_key per clerk: same key + same payload returns the original order; same key + different payload -> ERR_IDEMPOTENCY_CONFLICT."
    roles: [SiteClerk]
    code: 201
    input: [site_id, "returned_cylinder_id?", "idempotency_key?"]
    output: ExchangeOrder
    side_effects: ["status=DRAFT; swap_charge computed and pinned"]

  - method: GET
    path: "/exchange-orders/{orderId}"
    description: "Read an exchange order"
    roles: [SiteClerk, PlatformAdmin, HostSiteManager]
    code: 200
    input: []
    output: ExchangeOrder
    side_effects: []

  - method: GET
    path: "/exchange-orders"
    description: "List exchange orders with filters"
    roles: [SiteClerk, PlatformAdmin, HostSiteManager]
    code: 200
    input: ["site_id?", "issued_cylinder_id?", "returned_cylinder_id?", "status?", "business_date?", "limit?", "offset?"]
    output: "ExchangeOrder[]"
    side_effects: []

  - method: POST
    path: "/exchange-orders/{orderId}/complete"
    description: "Complete a swap: selector issues the oldest-certified full fleet cylinder, cash captured"
    roles: [SiteClerk]
    code: 200
    input: [payment_cash_cents]
    output: ExchangeOrder
    side_effects: ["issued cylinder leaves site; returned cylinder absorbed as EMPTY FLEET; business_date and sale_seq stamped; open reconciliation session expected cash recomputed"]

  - method: POST
    path: "/exchange-orders/{orderId}/void"
    description: "Void a DRAFT order (no cash was captured)"
    roles: [SiteClerk]
    code: 200
    input: []
    output: ExchangeOrder
    side_effects: ["status=VOIDED, void_reason=MANUAL"]

  - method: POST
    path: "/exchange-orders/{orderId}/refund"
    description: "Refund a COMPLETED order (same business day, reconciliation still open); issued cylinder returns QUARANTINED"
    roles: [SiteClerk]
    code: 200
    input: []
    output: ExchangeOrder
    side_effects: ["status=REFUNDED; issued cylinder -> QUARANTINED at site; expected cash recomputed (-total_cents)"]

  - method: POST
    path: "/refill-tickets"
    description: "Open a refill ticket for a CUSTOMER cylinder"
    roles: [SiteClerk]
    code: 201
    input: [site_id, cylinder_id, pre_weight_lbs]
    output: RefillTicket
    side_effects: ["status=OPEN; max_fill_lbs computed from cylinder water capacity"]

  - method: GET
    path: "/refill-tickets/{ticketId}"
    description: "Read a refill ticket"
    roles: [SiteClerk, PlatformAdmin]
    code: 200
    input: []
    output: RefillTicket
    side_effects: []

  - method: GET
    path: "/refill-tickets"
    description: "List refill tickets with filters"
    roles: [SiteClerk, PlatformAdmin]
    code: 200
    input: ["site_id?", "cylinder_id?", "status?", "limit?", "offset?"]
    output: "RefillTicket[]"
    side_effects: []

  - method: POST
    path: "/refill-tickets/{ticketId}/weigh"
    description: "Record empty-scale reading and verify tare tolerance"
    roles: [SiteClerk]
    code: 200
    input: [measured_tare_lbs]
    output: RefillTicket
    side_effects: ["status=WEIGHED"]

  - method: POST
    path: "/refill-tickets/{ticketId}/reweigh"
    description: "Reweigh: WEIGHED -> OPEN with a new pre_weight_lbs"
    roles: [SiteClerk]
    code: 200
    input: [pre_weight_lbs]
    output: RefillTicket
    side_effects: ["status=OPEN; measured_tare_lbs reset to null"]

  - method: POST
    path: "/refill-tickets/{ticketId}/fill"
    description: "Record post-fill weight; enforces certification and the 80% fill rule; computes refill_charge"
    roles: [SiteClerk]
    code: 200
    input: [post_weight_lbs]
    output: RefillTicket
    side_effects: ["status=FILLED; tier rates pinned; propane_charge_cents, hazmat_fee_cents, total_cents computed"]

  - method: POST
    path: "/refill-tickets/{ticketId}/close"
    description: "Take payment and close a FILLED ticket"
    roles: [SiteClerk]
    code: 200
    input: [payment_cash_cents]
    output: RefillTicket
    side_effects: ["status=CLOSED; cylinder fill_status=FULL; business_date and sale_seq stamped; open reconciliation session expected cash recomputed"]

  - method: POST
    path: "/refill-tickets/{ticketId}/void"
    description: "Void an OPEN or WEIGHED ticket"
    roles: [SiteClerk]
    code: 200
    input: []
    output: RefillTicket
    side_effects: ["status=VOIDED"]

  - method: POST
    path: "/certification-records"
    description: "Record a certification outcome. PASS is immediately RECORDED and extends expiry. CONDEMN requires cert_level FULL and creates a PENDING_SECOND record awaiting a second technician."
    roles: [Technician]
    code: 201
    input: [cylinder_id, method, outcome, "note?"]
    output: CertificationRecord
    side_effects: ["PASS: cylinder certified_on/expires/method updated, cert_status=CERTIFIED; CONDEMN: status=PENDING_SECOND"]

  - method: GET
    path: "/certification-records/{recordId}"
    description: "Read a certification record"
    roles: [Technician, PlatformAdmin, ComplianceOfficer]
    code: 200
    input: []
    output: CertificationRecord
    side_effects: []

  - method: GET
    path: "/certification-records"
    description: "List certification records with filters"
    roles: [Technician, PlatformAdmin, ComplianceOfficer]
    code: 200
    input: ["cylinder_id?", "technician_id?", "confirmer_technician_id?", "outcome?", "status?", "limit?", "offset?"]
    output: "CertificationRecord[]"
    side_effects: []

  - method: POST
    path: "/certification-records/{recordId}/confirm"
    description: "Second-signature confirm of a PENDING_SECOND condemn (different FULL technician)"
    roles: [Technician]
    code: 200
    input: ["note?"]
    output: CertificationRecord
    side_effects: ["status=CONFIRMED; cylinder CONDEMNED cascade"]

  - method: POST
    path: "/certification-records/{recordId}/reject"
    description: "Second-signature reject of a PENDING_SECOND condemn (different FULL technician)"
    roles: [Technician]
    code: 200
    input: ["note?"]
    output: CertificationRecord
    side_effects: ["status=REJECTED; cylinder unchanged"]

  - method: POST
    path: "/leak-reports"
    description: "Report a leak at a site; at most one REPORTED or CONFIRMED leak per site (else ERR_LEAK_ALREADY_OPEN)"
    roles: [SiteClerk]
    code: 201
    input: [site_id, severity, "quarantine_cage?", "cylinder_id?", "note?"]
    output: LeakReport
    side_effects: ["status=REPORTED"]

  - method: GET
    path: "/leak-reports/{reportId}"
    description: "Read a leak report"
    roles: [SiteClerk, PlatformAdmin, ComplianceOfficer, HostSiteManager]
    code: 200
    input: []
    output: LeakReport
    side_effects: []

  - method: GET
    path: "/leak-reports"
    description: "List leak reports with filters"
    roles: [SiteClerk, PlatformAdmin, ComplianceOfficer, HostSiteManager]
    code: 200
    input: ["site_id?", "cylinder_id?", "status?", "limit?", "offset?"]
    output: "LeakReport[]"
    side_effects: []

  - method: POST
    path: "/leak-reports/{reportId}/confirm"
    description: "Confirm a leak; MAJOR or quarantine_cage engages cage quarantine cascade"
    roles: [ComplianceOfficer]
    code: 200
    input: []
    output: LeakReport
    side_effects: ["status=CONFIRMED; quarantine cascade; sales_posture -> SALES_BLOCKED; open sales auto-VOIDED"]

  - method: POST
    path: "/leak-reports/{reportId}/resolve"
    description: "Resolve a confirmed leak; resolver != reporter; quarantining leaks require post-confirmation PASS re-inspection evidence"
    roles: [ComplianceOfficer]
    code: 200
    input: [resolution_note]
    output: LeakReport
    side_effects: ["status=RESOLVED; sales_posture recomputed"]

  - method: POST
    path: "/leak-reports/{reportId}/false-alarm"
    description: "Mark a REPORTED leak as false alarm"
    roles: [ComplianceOfficer]
    code: 200
    input: [reason]
    output: LeakReport
    side_effects: ["status=FALSE_ALARM"]

  - method: POST
    path: "/restock-runs"
    description: "Create a restock run for one site; supersedes (auto-cancels) any existing DRAFT run for the site. OCC-guarded by expected_site_version."
    roles: [PlatformAdmin]
    code: 201
    input: [site_id, driver_id, planned_date, expected_site_version]
    output: RestockRun
    side_effects: ["increments HostSite.version by 1", "planned_full_count = restock_suggested_qty; planned_empty_pickup_count = empty_on_hand snapshot", "existing DRAFT run for the site -> CANCELLED"]

  - method: GET
    path: "/restock-runs/{runId}"
    description: "Read a restock run"
    roles: [PlatformAdmin, Driver, SiteClerk]
    code: 200
    input: []
    output: RestockRun
    side_effects: []

  - method: GET
    path: "/restock-runs"
    description: "List restock runs with filters"
    roles: [PlatformAdmin, Driver, SiteClerk]
    code: 200
    input: ["site_id?", "driver_id?", "status?", "planned_date?", "limit?", "offset?"]
    output: "RestockRun[]"
    side_effects: []

  - method: POST
    path: "/restock-runs/{runId}/dispatch"
    description: "Dispatch a DRAFT run: DOT checks, depot selector assigns cylinders"
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: RestockRun
    side_effects: ["status=DISPATCHED; depot cylinders assigned (in_transit_run_id set)"]

  - method: POST
    path: "/restock-runs/{runId}/arrive"
    description: "Driver marks arrival on the planned date"
    roles: [Driver]
    code: 200
    input: []
    output: RestockRun
    side_effects: ["status=IN_PROGRESS"]

  - method: POST
    path: "/restock-runs/{runId}/complete"
    description: "Driver records actual delivered/picked-up counts"
    roles: [Driver]
    code: 200
    input: [delivered_full_count, picked_up_empty_count]
    output: RestockRun
    side_effects: ["status=COMPLETED; cylinders moved; variance_full_count computed; site counts and restock_alert recompute"]

  - method: POST
    path: "/restock-runs/{runId}/verify"
    description: "Verify a completed run (verifier != driver); picked-up empties reach depot"
    roles: [PlatformAdmin, SiteClerk]
    code: 200
    input: []
    output: RestockRun
    side_effects: ["status=VERIFIED; picked-up cylinders in_transit_run_id = null"]

  - method: POST
    path: "/restock-runs/{runId}/cancel"
    description: "Cancel a DRAFT or DISPATCHED run; assigned cylinders return to depot"
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: RestockRun
    side_effects: ["status=CANCELLED; assigned cylinders released"]

  - method: POST
    path: "/commission-statements"
    description: "Create a commission statement (period <= 62 days, end >= start else ERR_VALIDATION); basis snapshot from site"
    roles: [PlatformAdmin]
    code: 201
    input: [site_id, period_start, period_end]
    output: CommissionStatement
    side_effects: ["status=DRAFT; basis_used copied from site.commission_basis"]

  - method: GET
    path: "/commission-statements/{statementId}"
    description: "Read a commission statement"
    roles: [PlatformAdmin, HostSiteManager]
    code: 200
    input: []
    output: CommissionStatement
    side_effects: []

  - method: GET
    path: "/commission-statements"
    description: "List commission statements; HostSiteManager sees only own site"
    roles: [PlatformAdmin, HostSiteManager]
    code: 200
    input: ["site_id?", "status?", "limit?", "offset?"]
    output: "CommissionStatement[]"
    side_effects: []

  - method: POST
    path: "/commission-statements/{statementId}/finalize"
    description: "Finalize: computes commission_settlement; requires closed period and all dates reconciled"
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: CommissionStatement
    side_effects: ["status=FINALIZED; all computed money fields set"]

  - method: POST
    path: "/commission-statements/{statementId}/dispute"
    description: "Host site disputes a FINALIZED statement (own site only)"
    roles: [HostSiteManager]
    code: 200
    input: [note]
    output: CommissionStatement
    side_effects: ["status=DISPUTED; dispute_note set"]

  - method: POST
    path: "/commission-statements/{statementId}/pay"
    description: "Mark a FINALIZED statement paid"
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: CommissionStatement
    side_effects: ["status=PAID; paid_on set"]

  - method: POST
    path: "/reconciliation-sessions"
    description: "Open a reconciliation session for (site, business_date); one per pair (ERR_SESSION_EXISTS). Idempotent on idempotency_key per clerk."
    roles: [SiteClerk]
    code: 201
    input: [site_id, business_date, "idempotency_key?"]
    output: ReconciliationSession
    side_effects: ["status=OPEN; basis copied; opening_baseline_cents, expected_cash_cents, expected cylinder counts snapshotted"]

  - method: GET
    path: "/reconciliation-sessions/{sessionId}"
    description: "Read a reconciliation session"
    roles: [SiteClerk, PlatformAdmin, ComplianceOfficer]
    code: 200
    input: []
    output: ReconciliationSession
    side_effects: []

  - method: GET
    path: "/reconciliation-sessions"
    description: "List reconciliation sessions with filters"
    roles: [SiteClerk, PlatformAdmin, ComplianceOfficer]
    code: 200
    input: ["site_id?", "business_date?", "status?", "limit?", "offset?"]
    output: "ReconciliationSession[]"
    side_effects: []

  - method: POST
    path: "/reconciliation-sessions/{sessionId}/count"
    description: "Submit physical counts; transitions to BALANCED or VARIANCE_FLAGGED"
    roles: [SiteClerk]
    code: 200
    input: [counted_cash_cents, counted_full_cylinders, counted_empty_cylinders]
    output: ReconciliationSession
    side_effects: ["expected cash recomputed; variances stored; status set per threshold rule"]

  - method: POST
    path: "/reconciliation-sessions/{sessionId}/recount"
    description: "Reset a VARIANCE_FLAGGED session back to OPEN for a fresh count"
    roles: [SiteClerk]
    code: 200
    input: []
    output: ReconciliationSession
    side_effects: ["status=OPEN; counted_* and variances reset to null"]

  - method: POST
    path: "/reconciliation-sessions/{sessionId}/escalate"
    description: "Escalate a VARIANCE_FLAGGED session"
    roles: [PlatformAdmin, ComplianceOfficer]
    code: 200
    input: ["note?"]
    output: ReconciliationSession
    side_effects: ["status=ESCALATED; escalated_by set"]

  - method: POST
    path: "/reconciliation-sessions/{sessionId}/resolve"
    description: "Resolve an ESCALATED session (resolver != shift clerk)"
    roles: [PlatformAdmin, ComplianceOfficer]
    code: 200
    input: [resolution_note]
    output: ReconciliationSession
    side_effects: ["status=RESOLVED; resolved_by, resolution_note set"]

# =============================================================================
# Table 6: Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "Missing/invalid X-User-Role or X-User-ID headers" }
  - { id: ERR_FORBIDDEN, http: 403, condition: "Role not permitted, ownership violation (driver on another's run, host manager on another site), clerk registering FLEET cylinder, or technician cert_level insufficient for method/outcome" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Path resource id does not exist" }
  - { id: ERR_REFERENCE_NOT_FOUND, http: 422, condition: "Body-referenced id (site_id, cylinder_id, driver_id, returned_cylinder_id) does not exist" }
  - { id: ERR_VALIDATION, http: 400, condition: "Malformed request: missing required field, invalid enum, bad date, out-of-range value, negative counts at restock complete, period_end < period_start or period > 62 days, CUSTOMER cylinder created with a site" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_site_version does not match the site's current version (OCC)" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Target resource in wrong state for the transition; terminal-state lockdown; arrive on wrong date; driver suspended" }
  - { id: ERR_SITE_NOT_ACTIVE, http: 409, condition: "Site is SUSPENDED or DECOMMISSIONED for sales/dispatch operations" }
  - { id: ERR_SITE_NOT_EMPTY, http: 409, condition: "Decommission requires zero on-hand cylinders and no open restock runs" }
  - { id: ERR_SALES_BLOCKED, http: 409, condition: "Site sales_posture is SALES_BLOCKED by a confirmed quarantining leak" }
  - { id: ERR_NO_ACTIVE_POLICY, http: 409, condition: "No pricing policy is current for the site at the present logical date" }
  - { id: ERR_NO_STOCK, http: 409, condition: "Cylinder issue selector found no eligible full certified fleet cylinder at the site" }
  - { id: ERR_DEPOT_STOCK_LOW, http: 409, condition: "Depot pool has fewer eligible full certified fleet cylinders than planned_full_count" }
  - { id: ERR_CYLINDER_CONDEMNED, http: 409, condition: "Cylinder cert_status is CONDEMNED (terminal) — no fill, return-accept, or new certification" }
  - { id: ERR_CYLINDER_NOT_CERTIFIED, http: 409, condition: "Cylinder cert_status is RECERT_DUE where CERTIFIED is required (refill fill, quarantine release)" }
  - { id: ERR_CYLINDER_QUARANTINED, http: 409, condition: "Cylinder fill_status is QUARANTINED where handling requires non-quarantined" }
  - { id: ERR_NOT_REFILLABLE, http: 409, condition: "Refill ticket references a FLEET cylinder; refills are CUSTOMER cylinders only" }
  - { id: ERR_TARE_MISMATCH, http: 422, condition: "Measured tare deviates from stamped tare beyond TARE_TOLERANCE_LBS, or pre_weight below measured tare" }
  - { id: ERR_OVERFILL_RISK, http: 422, condition: "propane_lbs exceeds max_fill_lbs (80% fill rule); equality allowed, any excess rejected" }
  - { id: ERR_INSUFFICIENT_PAYMENT, http: 402, condition: "Tendered cash is below the order/ticket total" }
  - { id: ERR_DOT_PAYLOAD_EXCEEDED, http: 409, condition: "Planned payload exceeds the driver's vehicle_max_payload_lbs" }
  - { id: ERR_DRIVER_CERT_EXPIRED, http: 409, condition: "planned_date is after driver.dot_medical_expires_on" }
  - { id: ERR_DRIVER_ROUTE_CONFLICT, http: 409, condition: "Driver already has a DISPATCHED or IN_PROGRESS run on the same planned_date" }
  - { id: ERR_POLICY_WINDOW_OVERLAP, http: 409, condition: "New policy window overlaps an existing window for the site (half-open; adjacency allowed) and supersede_current is false or invalid" }
  - { id: ERR_POLICY_WINDOW_IN_PAST, http: 422, condition: "effective_from is strictly before the current logical date" }
  - { id: ERR_EMPTY_ROUTE, http: 422, condition: "Dispatch with planned_full_count + planned_empty_pickup_count == 0" }
  - { id: ERR_SESSION_EXISTS, http: 409, condition: "A reconciliation session already exists for (site, business_date)" }
  - { id: ERR_RECONCILIATION_UNRESOLVED, http: 409, condition: "Commission finalize: some date in the period lacks a BALANCED or RESOLVED session" }
  - { id: ERR_PERIOD_NOT_CLOSED, http: 422, condition: "Commission finalize: period_end is not strictly before the current logical date" }
  - { id: ERR_REFUND_WINDOW_CLOSED, http: 409, condition: "Refund attempted after the order's business date, or after the day's reconciliation reached BALANCED/ESCALATED/RESOLVED" }
  - { id: ERR_LEAK_ALREADY_OPEN, http: 409, condition: "Site already has a REPORTED or CONFIRMED leak report" }
  - { id: ERR_REINSPECTION_REQUIRED, http: 409, condition: "Resolving a quarantining leak without a post-confirmation PASS certification on a site fleet cylinder" }
  - { id: ERR_SEGREGATION_OF_DUTIES, http: 403, condition: "Same actor forbidden: verifier==driver, resolver==shift clerk, confirmer==condemn requester, leak resolver==reporter" }
  - { id: ERR_IDEMPOTENCY_CONFLICT, http: 409, condition: "Idempotency key reused with a different payload" }

# =============================================================================
# Table 7: RBAC Matrix
# =============================================================================
roles:
  - name: PlatformAdmin
    description: "Operator back-office; configures sites, pricing, fleet, drivers, technicians; runs restock planning, commission lifecycle, clock"
    identity: opaque
    exclusive_operations:
      - "POST /sites, PATCH /sites/{id}, GET /sites"
      - "POST /pricing-policies"
      - "POST /drivers, PATCH /drivers/{id}"
      - "POST /technicians, PATCH /technicians/{id}"
      - "POST /restock-runs, POST /restock-runs/{id}/dispatch, POST /restock-runs/{id}/cancel"
      - "POST /commission-statements, POST /commission-statements/{id}/finalize, POST /commission-statements/{id}/pay"
      - "POST /_clock/set_current_utc"
    shared_operations:
      - "GET reads across entities"
      - "POST /cylinders (FLEET registration)"
      - "POST /restock-runs/{id}/verify (shared with SiteClerk, SoD applies)"
      - "POST /reconciliation-sessions/{id}/escalate, POST /reconciliation-sessions/{id}/resolve (shared with ComplianceOfficer, SoD applies)"

  - name: SiteClerk
    description: "Store clerk operating the till at a host site; X-User-ID is recorded as clerk_id for segregation-of-duties checks"
    identity: opaque
    exclusive_operations:
      - "POST /exchange-orders, POST /exchange-orders/{id}/complete, /void, /refund"
      - "POST /refill-tickets and all ticket actions (weigh/reweigh/fill/close/void)"
      - "POST /leak-reports"
      - "POST /reconciliation-sessions, POST /reconciliation-sessions/{id}/count, /recount"
    shared_operations:
      - "POST /cylinders (CUSTOMER registration only)"
      - "POST /restock-runs/{id}/verify (shared with PlatformAdmin, SoD applies)"
      - "GET reads per endpoint table"

  - name: Driver
    description: "Restock driver; X-User-ID equals the Driver entity id"
    identity: "entity_backed:Driver"
    exclusive_operations:
      - "POST /restock-runs/{id}/arrive"
      - "POST /restock-runs/{id}/complete"
    shared_operations:
      - "GET /restock-runs, GET /restock-runs/{id}, GET /drivers/{id} (self), GET /cylinders/{id}, GET /sites/{id}"

  - name: Technician
    description: "Cylinder certification technician; X-User-ID equals the Technician entity id"
    identity: "entity_backed:Technician"
    exclusive_operations:
      - "POST /certification-records (as recording technician)"
      - "POST /certification-records/{id}/confirm, /reject (as second technician)"
    shared_operations:
      - "GET /certification-records, GET /cylinders, GET /sites/{id}, GET /technicians/{id} (self)"

  - name: ComplianceOfficer
    description: "Safety/compliance officer; owns leak lifecycle and quarantine; co-owns reconciliation escalation"
    identity: opaque
    exclusive_operations:
      - "POST /leak-reports/{id}/confirm, /resolve, /false-alarm"
      - "POST /cylinders/{id}/quarantine, /release-quarantine"
    shared_operations:
      - "POST /reconciliation-sessions/{id}/escalate, /resolve (shared with PlatformAdmin, SoD applies)"
      - "GET reads per endpoint table"

  - name: HostSiteManager
    description: "Host-site owner login; X-User-ID equals the HostSite entity id; sees only own site"
    identity: "entity_backed:HostSite"
    exclusive_operations:
      - "POST /commission-statements/{id}/dispute (own site only)"
    shared_operations:
      - "GET /sites/{id} (own), GET /pricing-policies, GET /commission-statements (+/{id}), GET /exchange-orders (+/{id}), GET /leak-reports (+/{id}) — all scoped to own site"
