  # =========================================================================
  # Rule 5 — Validation priority conflicts across different error-category pairs
  # =========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: state_beats_fiscal_on_assign_zone
        grounds:
          - validations[priority=6]
          - validations[priority=12]
          - state_machines.Fixture.PLANNED_to_PLANNED
        distinguishing_aspect: |
          Category pair state(6) vs business_fiscal(12): an assign-zone on an already-INSTALLED fixture
          targeting a zone whose transformer is already full returns ERR_INVALID_STATE (the
          higher-priority state check wins over ERR_TRANSFORMER_CAPACITY_EXCEEDED).
        test_recipe:
          setup:
            - "Installed project; a 300VA transformer at usable 240 (three 80W INSTALLED fixtures fxa/fxb/fxc in one zone). fxc is INSTALLED, and re-assigning it would also exceed capacity."
          setup_api_calls:
