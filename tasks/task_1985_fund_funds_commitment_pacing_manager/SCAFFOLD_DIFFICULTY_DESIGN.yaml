          - state_machines.Commitment.PENDING_DOCS_to_EXECUTED
          - entities.FoFProgram.fields.max_vintage_band_years
        distinguishing_aspect: |
          Interval semantics: sliding-band containment — the "resource" is the
          program's vintage span [min EXECUTED vintage, max EXECUTED vintage];
          a new execution is rejected when it would push the total span beyond
