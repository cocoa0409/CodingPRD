# =============================================================================
# §1.8 Scaffold Difficulty Design — Test Targeting Index
# Task 1416: Seasonal Tree & Holiday Material Recycling
# Shared fixture dates: window 2027-01-02T00:00:00Z .. 2027-01-16T23:59:59Z
# =============================================================================
scaffold_difficulty_design:
  # ---------------------------------------------------------------------------
  - rule_id: dual_variant_calc
    instances:
      - name: route_projection_provisional_vs_actual
        grounds:
          - calculations.route_tonnage_projection
          - entities.ServiceZone.fields.projected_tons_provisional
          - entities.ServiceZone.fields.collected_tons_actual
        distinguishing_aspect: |
          Dual-variant tonnage on the CURBSIDE-LOGISTICS entity domain (ServiceZone):
          PROVISIONAL counts CONFIRMED bookings at estimated weight (forward-looking),
          ACTUAL counts SERVICED bookings preferring scale actual_tons. Same zone,
          same moment, two valid algorithms -> 0.100 vs 0.040.
        test_recipe:
          setup:
            - "Program ACTIVE with window 2027-01-02..2027-01-16; zone NW-1 collection_date 2027-01-09, capacity 10"
            - "H1 booking B1: 2 LARGE, CONFIRMED; H2 booking B2: 1 MEDIUM, SERVICED with actual_tons 0.040"
          setup_api_calls:
            - call: "POST /programs"
              payload: { name: "TreeCycle 2027", season_label: "Winter 2027", window_start: "2027-01-02T00:00:00Z", window_end: "2027-01-16T23:59:59Z" }
              as: ProgramAdmin
              captures: { pid: $.data.id, p_v: $.data.version }
            - call: "POST /sites"
              payload: { program_id: "${pid}", name: "North Lot", address: "1 Pine Ave", capacity_cy: 100, open_date: "2027-01-02T00:00:00Z", close_date: "2027-01-16T23:59:59Z" }
              as: ProgramAdmin
              captures: { sid: $.data.id }
            - call: "POST /zones"
              payload: { program_id: "${pid}", zone_code: "NW-1", collection_date: "2027-01-09T00:00:00Z", daily_tree_capacity: 10 }
              as: ProgramAdmin
              captures: { zid: $.data.id }
            - call: "PATCH /programs/${pid}"
              payload: { status: "PUBLISHED", expected_program_version: "${p_v}" }
              as: ProgramAdmin
              captures: { p_v2: $.data.version }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2027-01-02T00:00:00Z" }
              as: ProgramAdmin
            - call: "PATCH /programs/${pid}"
              payload: { status: "ACTIVE", expected_program_version: "${p_v2}" }
              as: ProgramAdmin
            - call: "POST /households"
              payload: { program_id: "${pid}", zone_id: "${zid}", address: "10 Oak St", contact_email: "h1@x.com" }
              as: Anonymous
              captures: { h1: $.data.id }
            - call: "POST /bookings"
              payload: { household_id: "${h1}", zone_id: "${zid}", tree_count: 2, size_class: "LARGE", prep_attestation: true }
              as: Resident
              as_user_id: "${h1}"
              captures: { b1: $.data.id }
            - call: "POST /households"
              payload: { program_id: "${pid}", zone_id: "${zid}", address: "22 Oak St", contact_email: "h2@x.com" }
              as: Anonymous
              captures: { h2: $.data.id }
            - call: "POST /bookings"
              payload: { household_id: "${h2}", zone_id: "${zid}", tree_count: 1, size_class: "MEDIUM", prep_attestation: true }
              as: Resident
              as_user_id: "${h2}"
              captures: { b2: $.data.id }
            - call: "POST /bookings/${b2}/record-outcome"
              payload: { outcome: "SERVICED", actual_tons: 0.040 }
              as: SiteSupervisor
          trigger:
            - call: "GET /zones/${zid}"
              as: ProgramAdmin
          assert:
            - "ServiceZone.${zid}.projected_tons_provisional == 0.1  (2 * 0.050; CONFIRMED bookings only)"
            - "ServiceZone.${zid}.collected_tons_actual == 0.04  (SERVICED only, actual_tons preferred over the 0.035 estimate)"
            - "ServiceZone.${zid}.projected_tons_provisional != ServiceZone.${zid}.collected_tons_actual (variant divergence on identical zone data)"

      - name: chipping_yield_theoretical_vs_measured
        grounds:
          - calculations.chipping_yield
          - state_machines.ChippingRun.SCHEDULED_to_COMPLETED
        distinguishing_aspect: |
          Dual-variant yield on the PROCESSING entity domain (ChippingRun), distinct
          from the curbside-logistics domain of route_projection_provisional_vs_actual:
          THEORETICAL = round2(10.0 * 2.2 * (1 - 0.1)) = 19.80 vs operator-supplied
          MEASURED = 18.50; unrounded variance ratio 0.0657 <= 0.08 so completion succeeds
          without the review flag.
        test_recipe:
          setup:
            - "Program ACTIVE; site OPEN with stockpile 6.00 cy (20 MEDIUM trees, no contamination)"
            - "ChippingRun scheduled 2027-01-17T08:00:00Z-10:00:00Z MIXED_CONIFER; clock at 2027-01-17T08:30:00Z"
          setup_api_calls:
            - call: "POST /programs"
              payload: { name: "TreeCycle 2027", season_label: "Winter 2027", window_start: "2027-01-02T00:00:00Z", window_end: "2027-01-16T23:59:59Z" }
              as: ProgramAdmin
              captures: { pid: $.data.id, p_v: $.data.version }
            - call: "POST /sites"
              payload: { program_id: "${pid}", name: "North Lot", address: "1 Pine Ave", capacity_cy: 100, open_date: "2027-01-02T00:00:00Z", close_date: "2027-01-16T23:59:59Z" }
              as: ProgramAdmin
              captures: { sid: $.data.id, s_v: $.data.version }
            - call: "POST /zones"
              payload: { program_id: "${pid}", zone_code: "NW-1", collection_date: "2027-01-09T00:00:00Z", daily_tree_capacity: 10 }
              as: ProgramAdmin
            - call: "PATCH /programs/${pid}"
              payload: { status: "PUBLISHED", expected_program_version: "${p_v}" }
              as: ProgramAdmin
              captures: { p_v2: $.data.version }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2027-01-02T00:00:00Z" }
              as: ProgramAdmin
            - call: "PATCH /programs/${pid}"
              payload: { status: "ACTIVE", expected_program_version: "${p_v2}" }
              as: ProgramAdmin
            - call: "PATCH /sites/${sid}"
              payload: { status: "OPEN", expected_site_version: "${s_v}" }
              as: ProgramAdmin
            - call: "POST /intake-events"
              payload: { site_id: "${sid}", source_type: "RESIDENT_SELF_HAUL", tree_count: 20, size_class: "MEDIUM" }
              as: SiteSupervisor
            - call: "POST /chipping-runs"
              payload: { program_id: "${pid}", site_id: "${sid}", scheduled_start: "2027-01-17T08:00:00Z", scheduled_end: "2027-01-17T10:00:00Z", material_class: "MIXED_CONIFER" }
              as: ProgramAdmin
              captures: { rid: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2027-01-17T08:30:00Z" }
              as: ProgramAdmin
          trigger:
            - call: "POST /chipping-runs/${rid}/complete"
              payload: { input_cy: 5.0, measured_input_tons: 10.0, contaminated_input_tons: 1.0, measured_output_cy: 18.5 }
              as: HaulerPartner
          assert:
            - "ChippingRun.${rid}.theoretical_output_cy == 19.8  (round2(10.0 * 2.2 * (1 - 1.0/10.0)))"
            - "ChippingRun.${rid}.measured_output_cy == 18.5  (operator variant, stored as given)"
            - "ChippingRun.${rid}.variance_pct == 0.0657  (round4(1.3/19.8))"
            - "ChippingRun.${rid}.status == COMPLETED"
            - "DropOffSite.${sid}.stockpile_cy == 1.0  (6.0 - 5.0)"
            - "Program.${pid}.mulch_produced_cy == 18.5"

  # ---------------------------------------------------------------------------
  - rule_id: combinatorial_formula
    instances:
      - name: mulch_allocation_tiered_minmax
        grounds:
          - calculations.mulch_claim_allocation
          - entities.Program.fields.participant_remaining_cy
          - entities.Program.fields.general_remaining_cy
          - entities.MulchClaim.fields.allocated_cy
        distinguishing_aspect: |
          Mode (a) combinatorial: >=3 inputs (requested_cy, per_household_cap_cy,
          tier_remaining) with non-linear interaction (tier branch selects WHICH pool,
          nested min caps the allocation, 0.5 threshold routes to WAITLISTED).
          participant_pool = round2(0.6*10.00) = 6.00, general_pool = 4.00.
        test_recipe:
          setup:
            - "Program ACTIVE; site OPEN; mulch pool produced = 10.00 cy (run: 5.0 t MIXED_LOAD, measured_output 10.00)"
            - "Household HP has a SERVICED booking (tier PARTICIPANT); HG1/HG2/HG3 have none (GENERAL)"
            - "MulchEvent OPEN; clock inside claim window 2027-01-18T00:00:00Z..2027-01-22T23:59:59Z"
          setup_api_calls:
            - call: "POST /programs"
              payload: { name: "TreeCycle 2027", season_label: "Winter 2027", window_start: "2027-01-02T00:00:00Z", window_end: "2027-01-16T23:59:59Z" }
              as: ProgramAdmin
              captures: { pid: $.data.id, p_v: $.data.version }
            - call: "POST /sites"
              payload: { program_id: "${pid}", name: "North Lot", address: "1 Pine Ave", capacity_cy: 100, open_date: "2027-01-02T00:00:00Z", close_date: "2027-01-16T23:59:59Z" }
              as: ProgramAdmin
              captures: { sid: $.data.id, s_v: $.data.version }
            - call: "POST /zones"
              payload: { program_id: "${pid}", zone_code: "NW-1", collection_date: "2027-01-09T00:00:00Z", daily_tree_capacity: 10 }
              as: ProgramAdmin
              captures: { zid: $.data.id }
            - call: "PATCH /programs/${pid}"
              payload: { status: "PUBLISHED", expected_program_version: "${p_v}" }
              as: ProgramAdmin
              captures: { p_v2: $.data.version }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2027-01-02T00:00:00Z" }
              as: ProgramAdmin
            - call: "PATCH /programs/${pid}"
              payload: { status: "ACTIVE", expected_program_version: "${p_v2}" }
              as: ProgramAdmin
            - call: "PATCH /sites/${sid}"
              payload: { status: "OPEN", expected_site_version: "${s_v}" }
              as: ProgramAdmin
            - call: "POST /households"
              payload: { program_id: "${pid}", zone_id: "${zid}", address: "10 Oak St", contact_email: "hp@x.com" }
              as: Anonymous
              captures: { hp: $.data.id }
            - call: "POST /bookings"
              payload: { household_id: "${hp}", zone_id: "${zid}", tree_count: 1, size_class: "SMALL", prep_attestation: true }
              as: Resident
              as_user_id: "${hp}"
              captures: { bp: $.data.id }
            - call: "POST /bookings/${bp}/record-outcome"
              payload: { outcome: "SERVICED" }
              as: SiteSupervisor
            - call: "POST /intake-events"
              payload: { site_id: "${sid}", source_type: "CITY_CREW", tree_count: 20, size_class: "MEDIUM" }
              as: SiteSupervisor
            - call: "POST /chipping-runs"
              payload: { program_id: "${pid}", site_id: "${sid}", scheduled_start: "2027-01-17T08:00:00Z", scheduled_end: "2027-01-17T10:00:00Z", material_class: "MIXED_LOAD" }
              as: ProgramAdmin
              captures: { rid: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2027-01-17T08:30:00Z" }
              as: ProgramAdmin
            - call: "POST /chipping-runs/${rid}/complete"
              payload: { input_cy: 5.0, measured_input_tons: 5.0, contaminated_input_tons: 0, measured_output_cy: 10.0 }
              as: HaulerPartner
            - call: "POST /mulch-events"
              payload: { program_id: "${pid}", name: "Mulch Day", claim_open_at: "2027-01-18T00:00:00Z", claim_close_at: "2027-01-22T23:59:59Z", pickup_start: "2027-01-23T09:00:00Z", pickup_end: "2027-01-23T15:00:00Z" }
              as: ProgramAdmin
              captures: { eid: $.data.id }
            - call: "PATCH /mulch-events/${eid}"
              payload: { status: "OPEN" }
              as: ProgramAdmin
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2027-01-18T12:00:00Z" }
              as: ProgramAdmin
            - call: "POST /households"
              payload: { program_id: "${pid}", zone_id: "${zid}", address: "1 Elm St", contact_email: "g1@x.com" }
              as: Anonymous
              captures: { hg1: $.data.id }
            - call: "POST /households"
              payload: { program_id: "${pid}", zone_id: "${zid}", address: "2 Elm St", contact_email: "g2@x.com" }
              as: Anonymous
              captures: { hg2: $.data.id }
            - call: "POST /households"
              payload: { program_id: "${pid}", zone_id: "${zid}", address: "3 Elm St", contact_email: "g3@x.com" }
              as: Anonymous
              captures: { hg3: $.data.id }
          trigger:
            - call: "POST /mulch-claims"
              payload: { event_id: "${eid}", household_id: "${hp}", requested_cy: 2.0 }
              as: Resident
              as_user_id: "${hp}"
              captures: { c_p: $.data.id }
            - call: "POST /mulch-claims"
              payload: { event_id: "${eid}", household_id: "${hg1}", requested_cy: 2.0 }
              as: Resident
              as_user_id: "${hg1}"
              captures: { c_g1: $.data.id }
            - call: "POST /mulch-claims"
              payload: { event_id: "${eid}", household_id: "${hg2}", requested_cy: 2.0 }
              as: Resident
              as_user_id: "${hg2}"
              captures: { c_g2: $.data.id }
            - call: "POST /mulch-claims"
              payload: { event_id: "${eid}", household_id: "${hg3}", requested_cy: 1.0 }
              as: Resident
              as_user_id: "${hg3}"
              captures: { c_g3: $.data.id }
          assert:
            - "MulchClaim.${c_p}: tier == PARTICIPANT, allocated_cy == 2.0, status == CONFIRMED  (min(2.0, 2.0, 6.00))"
            - "MulchClaim.${c_g1}: tier == GENERAL, allocated_cy == 2.0, status == CONFIRMED  (min(2.0, 2.0, 4.00))"
            - "MulchClaim.${c_g2}: tier == GENERAL, allocated_cy == 2.0, status == CONFIRMED  (general pool exhausted to 0.00)"
            - "MulchClaim.${c_g3}: tier == GENERAL, allocated_cy == 0, status == WAITLISTED  (0 < MIN_CLAIM_CY 0.5)"
            - "Program.${pid}.participant_remaining_cy == 4.0"
            - "Program.${pid}.general_remaining_cy == 0.0"

      - name: diversion_rollup_round_per_source
        grounds:
          - calculations.diversion_rate_rollup
          - entities.DiversionReport.fields.collected_tons
          - entities.DiversionReport.fields.diversion_rate
          - entities.DiversionReport.fields.grade
        distinguishing_aspect: |
          Mode (b) combinatorial: nested rounding ORDER is pinned — each source rounded
          to 3dp THEN summed. Two SERVICED bookings at 0.0204 t each plus a 0.0300 t
          weighed intake give collected = 0.020+0.020+0.030 = 0.070; the rejected
          sum-then-round order would give round3(0.0708) = 0.071. Rate 0.063/0.070
          = 0.9000 lands exactly on the inclusive grade-A threshold.
        test_recipe:
          setup:
            - "Program ACTIVE; site OPEN; two SERVICED bookings with actual_tons 0.0204 each"
            - "One RECORDED intake (1 MEDIUM, weighed_tons 0.0300); one COMPLETED run input 0.063 t / contaminated 0 / input_cy 0.30 (== stockpile, equality admitted)"
          setup_api_calls:
            - call: "POST /programs"
              payload: { name: "TreeCycle 2027", season_label: "Winter 2027", window_start: "2027-01-02T00:00:00Z", window_end: "2027-01-16T23:59:59Z" }
              as: ProgramAdmin
              captures: { pid: $.data.id, p_v: $.data.version }
            - call: "POST /sites"
              payload: { program_id: "${pid}", name: "North Lot", address: "1 Pine Ave", capacity_cy: 100, open_date: "2027-01-02T00:00:00Z", close_date: "2027-01-16T23:59:59Z" }
              as: ProgramAdmin
              captures: { sid: $.data.id, s_v: $.data.version }
            - call: "POST /zones"
              payload: { program_id: "${pid}", zone_code: "NW-1", collection_date: "2027-01-09T00:00:00Z", daily_tree_capacity: 10 }
              as: ProgramAdmin
              captures: { zid: $.data.id }
            - call: "PATCH /programs/${pid}"
              payload: { status: "PUBLISHED", expected_program_version: "${p_v}" }
              as: ProgramAdmin
              captures: { p_v2: $.data.version }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2027-01-02T00:00:00Z" }
              as: ProgramAdmin
            - call: "PATCH /programs/${pid}"
              payload: { status: "ACTIVE", expected_program_version: "${p_v2}" }
              as: ProgramAdmin
            - call: "PATCH /sites/${sid}"
              payload: { status: "OPEN", expected_site_version: "${s_v}" }
              as: ProgramAdmin
            - call: "POST /households"
              payload: { program_id: "${pid}", zone_id: "${zid}", address: "10 Oak St", contact_email: "h1@x.com" }
              as: Anonymous
              captures: { h1: $.data.id }
            - call: "POST /households"
              payload: { program_id: "${pid}", zone_id: "${zid}", address: "22 Oak St", contact_email: "h2@x.com" }
              as: Anonymous
              captures: { h2: $.data.id }
            - call: "POST /bookings"
              payload: { household_id: "${h1}", zone_id: "${zid}", tree_count: 1, size_class: "MEDIUM", prep_attestation: true }
              as: Resident
              as_user_id: "${h1}"
              captures: { b1: $.data.id }
            - call: "POST /bookings"
              payload: { household_id: "${h2}", zone_id: "${zid}", tree_count: 1, size_class: "MEDIUM", prep_attestation: true }
              as: Resident
              as_user_id: "${h2}"
              captures: { b2: $.data.id }
            - call: "POST /bookings/${b1}/record-outcome"
              payload: { outcome: "SERVICED", actual_tons: 0.0204 }
              as: SiteSupervisor
            - call: "POST /bookings/${b2}/record-outcome"
              payload: { outcome: "SERVICED", actual_tons: 0.0204 }
              as: SiteSupervisor
            - call: "POST /intake-events"
              payload: { site_id: "${sid}", source_type: "COMMERCIAL_LANDSCAPER", tree_count: 1, size_class: "MEDIUM", weighed_tons: 0.03 }
              as: SiteSupervisor
            - call: "POST /chipping-runs"
              payload: { program_id: "${pid}", site_id: "${sid}", scheduled_start: "2027-01-17T08:00:00Z", scheduled_end: "2027-01-17T10:00:00Z", material_class: "MIXED_LOAD" }
              as: ProgramAdmin
              captures: { rid: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2027-01-17T08:30:00Z" }
              as: ProgramAdmin
            - call: "POST /chipping-runs/${rid}/complete"
              payload: { input_cy: 0.3, measured_input_tons: 0.063, contaminated_input_tons: 0, measured_output_cy: 0.126 }
              as: HaulerPartner
            - call: "GET /programs/${pid}"
              as: ProgramAdmin
              captures: { p_v_now: $.data.version }
          trigger:
            - call: "POST /diversion-reports"
              payload: { program_id: "${pid}", expected_program_version: "${p_v_now}" }
              as: ProgramAdmin
              captures: { rep: $.data.id }
          assert:
            - "DiversionReport.${rep}.collected_tons == 0.07  (round3(0.0204)+round3(0.0204)+round3(0.0300) = 0.020+0.020+0.030; sum-then-round would give 0.071)"
            - "DiversionReport.${rep}.diverted_tons == 0.063"
            - "DiversionReport.${rep}.disposed_tons == 0.007"
            - "DiversionReport.${rep}.diversion_rate == 0.9  (round4(0.063/0.070))"
            - "DiversionReport.${rep}.grade == A  (rate >= 0.9000 inclusive)"
            - "DiversionReport.${rep}.below_target == false  (0.9000 < target 0.9 is false)"
            - "DiversionReport.${rep}.status == DRAFT"
  # ---------------------------------------------------------------------------
  - rule_id: non_linear_state_machine
    instances:
      - name: booking_missed_reconfirm_cycle
        grounds:
          - state_machines.CurbsideBooking.CONFIRMED_to_MISSED
          - state_machines.CurbsideBooking.MISSED_to_CONFIRMED
          - state_machines.CurbsideBooking.CONFIRMED_to_SERVICED
          - calculations.route_capacity_consumption
        distinguishing_aspect: |
          CYCLIC machine on CurbsideBooking: CONFIRMED -> MISSED (ops-run expiry) ->
          CONFIRMED (makeup-day reschedule after the zone's past date is moved) ->
          SERVICED. Capacity is released on MISSED and re-reserved on re-confirmation.
        test_recipe:
          setup:
            - "Program ACTIVE; zone NW-1 collection_date 2027-01-09 capacity 5; H1 booking 2 trees CONFIRMED (reserved 2)"
            - "Clock advanced to 2027-01-10T00:00:00Z (day after service); ops-run expires the booking"
            - "Zone collection_date moved to makeup day 2027-01-12 (legal because the current date is past)"
          setup_api_calls:
            - call: "POST /programs"
              payload: { name: "TreeCycle 2027", season_label: "Winter 2027", window_start: "2027-01-02T00:00:00Z", window_end: "2027-01-16T23:59:59Z" }
              as: ProgramAdmin
              captures: { pid: $.data.id, p_v: $.data.version }
            - call: "POST /sites"
              payload: { program_id: "${pid}", name: "North Lot", address: "1 Pine Ave", capacity_cy: 100, open_date: "2027-01-02T00:00:00Z", close_date: "2027-01-16T23:59:59Z" }
              as: ProgramAdmin
            - call: "POST /zones"
              payload: { program_id: "${pid}", zone_code: "NW-1", collection_date: "2027-01-09T00:00:00Z", daily_tree_capacity: 5 }
              as: ProgramAdmin
              captures: { zid: $.data.id, z_v: $.data.version }
            - call: "PATCH /programs/${pid}"
              payload: { status: "PUBLISHED", expected_program_version: "${p_v}" }
              as: ProgramAdmin
              captures: { p_v2: $.data.version }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2027-01-02T00:00:00Z" }
              as: ProgramAdmin
            - call: "PATCH /programs/${pid}"
              payload: { status: "ACTIVE", expected_program_version: "${p_v2}" }
              as: ProgramAdmin
            - call: "POST /households"
              payload: { program_id: "${pid}", zone_id: "${zid}", address: "10 Oak St", contact_email: "h1@x.com" }
              as: Anonymous
              captures: { h1: $.data.id }
            - call: "POST /bookings"
              payload: { household_id: "${h1}", zone_id: "${zid}", tree_count: 2, size_class: "MEDIUM", prep_attestation: true }
              as: Resident
              as_user_id: "${h1}"
              captures: { b1: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2027-01-10T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /programs/${pid}/ops-run"
              payload: {}
              as: ProgramAdmin
            - call: "PATCH /zones/${zid}"
              payload: { collection_date: "2027-01-12T00:00:00Z", expected_zone_version: "${z_v}" }
              as: ProgramAdmin
          trigger:
            - call: "POST /bookings/${b1}/reschedule"
              payload: { new_service_date: "2027-01-12T00:00:00Z" }
              as: Resident
              as_user_id: "${h1}"
            - call: "POST /bookings/${b1}/record-outcome"
              payload: { outcome: "SERVICED", actual_tons: 0.07 }
              as: SiteSupervisor
