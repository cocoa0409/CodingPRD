# =============================================================================
# SCAFFOLD_CORNER_DESIGN — task_0687_batting_cage_sports_training
# §1.9 Breadth probe. Walks references/claim-extraction-guide.md against §1.1–§1.7.
# Default clock 2026-04-01T00:00:00Z; facility hours [480,1320); PEAK [1020,1260).
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:
      - name: create_facility_returns_defaults_and_system_fields
        claim_type: Creation
        grounds: [entities.Facility.fields.posture, entities.Facility.fields.epoch_index]
        distinguishing_aspect: "POST /v1/facilities with only name -> 201; posture=OPEN, epoch_index=0, open_incident_count=0, version=1, hourly_rate_cents default 4000, token_price_cents default 500."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /v1/facilities"
              payload: { name: "Fac" }
              as: FacilityManager
              captures: { fac_id: $.data.id }
          assert:
            - "response.status == 201"
            - "Facility.${fac_id}.posture == OPEN"
            - "Facility.${fac_id}.epoch_index == 0"
            - "Facility.${fac_id}.token_price_cents == 500"
            - "Facility.${fac_id}.version == 1"

      - name: get_lane_returns_stored_data
        claim_type: Retrieval
        grounds: [entities.Lane.fields.label, entities.Lane.fields.kind]
        distinguishing_aspect: "GET /v1/lanes/{lane_id} returns the lane with label, kind, maint_status=AVAILABLE, version=1."
        test_recipe:
          setup: ["One facility, one lane CAGE buffer 0."]
          setup_api_calls:
            - call: "POST /v1/facilities"
              payload: { name: "Fac" }
              as: FacilityManager
              captures: { fac_id: $.data.id }
            - call: "POST /v1/lanes"
              payload: { label: "Cage 1", kind: "CAGE", buffer_minutes: 0, facility_id: "${fac_id}" }
              as: FacilityManager
              captures: { lane_id: $.data.id }
          trigger:
            - call: "GET /v1/lanes/${lane_id}"
              payload: {}
              as: FacilityManager
          assert:
            - "response.data.label == 'Cage 1'"
            - "response.data.maint_status == AVAILABLE"

      - name: list_members_paginated_envelope
        claim_type: Listing
        grounds: [entities.Member.fields.facility_id]
        distinguishing_aspect: "GET /v1/members returns array with pagination meta total_count and has_more for two registered members."
        test_recipe:
          setup: ["One facility, two members."]
          setup_api_calls:
            - call: "POST /v1/facilities"
              payload: { name: "Fac" }
              as: FacilityManager
              captures: { fac_id: $.data.id }
            - call: "POST /v1/members"
              payload: { full_name: "A", tier: "NONE", facility_id: "${fac_id}" }
              as: FacilityManager
            - call: "POST /v1/members"
              payload: { full_name: "B", tier: "NONE", facility_id: "${fac_id}" }
              as: FacilityManager
          trigger:
            - call: "GET /v1/members"
              payload: { limit: 10, offset: 0 }
              as: FacilityManager
          assert:
            - "response.response_type == 'array'"
            - "response.meta.total_count == 2"
            - "response.meta.has_more == false"

      - name: get_member_nonexistent_returns_not_found
        claim_type: Not Found
        grounds:
          - "errors[ERR_NOT_FOUND]"
          - "entities.Member.fields.id"
        distinguishing_aspect: "GET /v1/members/{random-uuid} -> 404 ERR_NOT_FOUND."
        test_recipe:
          setup: ["One facility."]
          setup_api_calls:
            - call: "POST /v1/facilities"
              payload: { name: "Fac" }
              as: FacilityManager
              captures: { fac_id: $.data.id }
          trigger:
            - call: "GET /v1/members/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: FacilityManager
          assert:
            - "response.status == 404"
            - "response.data.error_id == ERR_NOT_FOUND"

      - name: create_lane_missing_kind_required_field
        claim_type: Required Fields
        grounds:
          - "entities.Lane.fields.kind"
          - "validations[priority=4]"
          - "errors[ERR_INVALID_REQUEST]"
        distinguishing_aspect: "POST /v1/lanes with kind=null (required field absent/empty) -> 400 ERR_INVALID_REQUEST (kind has source input, no default)."
        test_recipe:
          setup: ["One facility."]
          setup_api_calls:
            - call: "POST /v1/facilities"
              payload: { name: "Fac" }
              as: FacilityManager
              captures: { fac_id: $.data.id }
          trigger:
            - call: "POST /v1/lanes"
              payload: { label: "Cage 1", kind: null, buffer_minutes: 0, facility_id: "${fac_id}" }
              as: FacilityManager
          assert:
            - "response.status == 400"
            - "response.data.error_id == ERR_INVALID_REQUEST"

      - name: member_tier_defaults_to_none
        claim_type: Defaults
        grounds: [entities.Member.fields.tier]
        distinguishing_aspect: "POST /v1/members omitting tier -> tier defaults to NONE; token_balance 0, waiver_ok false."
        test_recipe:
          setup: ["One facility."]
          setup_api_calls:
            - call: "POST /v1/facilities"
              payload: { name: "Fac" }
              as: FacilityManager
              captures: { fac_id: $.data.id }
          trigger:
            - call: "POST /v1/members"
              payload: { full_name: "Defaulty", facility_id: "${fac_id}" }
              as: FacilityManager
              captures: { mem_id: $.data.id }
          assert:
            - "Member.${mem_id}.tier == NONE"
            - "Member.${mem_id}.token_balance == 0"
            - "Member.${mem_id}.waiver_ok == false"

      - name: booking_quoted_cost_computed_input_ignored
        claim_type: Computed Fields
        grounds: [entities.Booking.fields.quoted_cost_cents, calculations.booking_quote]
        distinguishing_aspect: "quoted_cost_cents is computed from booking_quote, not from request body; a 60-min OPEN_SLOT off-peak HOURLY booking (lane rate 4000) has quoted_cost_cents == 4000 regardless of any client-sent value."
        test_recipe:
          setup: ["One facility, one lane, one member tier NONE."]
          setup_api_calls:
            - call: "POST /v1/facilities"
              payload: { name: "Fac", hourly_rate_cents: 4000, token_price_cents: 500 }
              as: FacilityManager
              captures: { fac_id: $.data.id }
            - call: "POST /v1/lanes"
              payload: { label: "Cage 1", kind: "CAGE", buffer_minutes: 0, facility_id: "${fac_id}" }
              as: FacilityManager
              captures: { lane_id: $.data.id }
            - call: "POST /v1/members"
              payload: { full_name: "Q", tier: "NONE", facility_id: "${fac_id}" }
              as: FacilityManager
              captures: { mem_id: $.data.id }
          trigger:
            - call: "POST /v1/bookings"
              payload: { lane_id: "${lane_id}", member_id: "${mem_id}", kind: "OPEN_SLOT", pay_mode: "HOURLY", start_utc: "2026-04-02T09:00:00Z", end_utc: "2026-04-02T10:00:00Z", facility_id: "${fac_id}" }
              as: Member
              as_user_id: "${mem_id}"
              captures: { bk_id: $.data.id }
          assert:
            - "Booking.${bk_id}.quoted_cost_cents == 4000"
            - "Booking.${bk_id}.status == REQUESTED"

      - name: booking_invalid_kind_enum_rejected
        claim_type: Type Constraints
        grounds:
          - "entities.Booking.fields.kind"
          - "validations[priority=4]"
          - "errors[ERR_INVALID_REQUEST]"
        distinguishing_aspect: "POST /v1/bookings with kind=GOLF (not in OPEN_SLOT|LESSON|TEAM_BLOCK|PARTY) -> 400 ERR_INVALID_REQUEST."
        test_recipe:
          setup: ["One facility, one lane, one member."]
          setup_api_calls:
            - call: "POST /v1/facilities"
              payload: { name: "Fac" }
              as: FacilityManager
              captures: { fac_id: $.data.id }
            - call: "POST /v1/lanes"
              payload: { label: "Cage 1", kind: "CAGE", buffer_minutes: 0, facility_id: "${fac_id}" }
              as: FacilityManager
              captures: { lane_id: $.data.id }
            - call: "POST /v1/members"
              payload: { full_name: "K", tier: "NONE", facility_id: "${fac_id}" }
              as: FacilityManager
              captures: { mem_id: $.data.id }
          trigger:
            - call: "POST /v1/bookings"
              payload: { lane_id: "${lane_id}", member_id: "${mem_id}", kind: "GOLF", pay_mode: "HOURLY", start_utc: "2026-04-02T09:00:00Z", end_utc: "2026-04-02T10:00:00Z", facility_id: "${fac_id}" }
              as: Member
              as_user_id: "${mem_id}"
          assert:
            - "response.status == 400"
            - "response.data.error_id == ERR_INVALID_REQUEST"

      - name: waiver_immutable_no_version_field
        claim_type: Immutability
        grounds: [entities.Waiver.fields.status, entities.Waiver.fields.signed_at]
        distinguishing_aspect: "Waiver is common_fields:false — it has id+created_at only, no version; it is created via sign and only transitions to VOID via the dedicated void endpoint, never PUT."
        test_recipe:
          setup: ["One facility, one member, one signed waiver."]
          setup_api_calls:
            - call: "POST /v1/facilities"
              payload: { name: "Fac" }
              as: FacilityManager
              captures: { fac_id: $.data.id }
            - call: "POST /v1/members"
              payload: { full_name: "W", tier: "NONE", facility_id: "${fac_id}" }
              as: FacilityManager
              captures: { mem_id: $.data.id }
            - call: "POST /v1/waivers"
              payload: { facility_id: "${fac_id}", member_id: "${mem_id}" }
              as: Member
              as_user_id: "${mem_id}"
              captures: { wv_id: $.data.id }
          trigger:
            - call: "GET /v1/waivers"
              payload: {}
              as: Member
              as_user_id: "${mem_id}"
          assert:
            - "response.data[0].status == SIGNED"
            - "response.data[0].id == ${wv_id}"

      - name: machine_requires_existing_lane_parent
        claim_type: Parent Relationships
        grounds:
          - "entities.PitchingMachine.fields.lane_id"
          - "errors[ERR_NOT_FOUND]"
        distinguishing_aspect: "POST /v1/machines with a lane_id that does not exist -> 404 ERR_NOT_FOUND."
        test_recipe:
          setup: ["One facility, no lanes."]
          setup_api_calls:
            - call: "POST /v1/facilities"
              payload: { name: "Fac" }
              as: FacilityManager
              captures: { fac_id: $.data.id }
          trigger:
            - call: "POST /v1/machines"
              payload: { lane_id: "00000000-0000-4000-8000-000000000000", model: "WHEEL", facility_id: "${fac_id}" }
              as: FacilityManager
          assert:
            - "response.status == 404"
            - "response.data.error_id == ERR_NOT_FOUND"

  # ===========================================================================
  - section: state_machines
    instances:
      - name: confirm_already_confirmed_invalid_state
        claim_type: Invalid Transitions
        grounds:
          - "state_machines.Booking.REQUESTED_to_CONFIRMED"
          - "errors[ERR_INVALID_STATE]"
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / invalid_state_beats_lane_time_conflict
          rationale: "Re-confirming an already-CONFIRMED booking returns ERR_INVALID_STATE is asserted by that §1.8 instance."

      - name: reject_after_confirmed_invalid_state
        claim_type: Invalid Transitions
        grounds:
          - "state_machines.Booking.REQUESTED_to_REJECTED"
          - "errors[ERR_INVALID_STATE]"
        distinguishing_aspect: "REJECT is only valid from REQUESTED; rejecting a CONFIRMED booking -> 409 ERR_INVALID_STATE."
        test_recipe:
          setup: ["Facility, lane, member waiver SIGNED wallet 100; one CONFIRMED OPEN_SLOT booking."]
          setup_api_calls:
            - call: "POST /v1/facilities"
              payload: { name: "Fac", hourly_rate_cents: 4000, token_price_cents: 500 }
              as: FacilityManager
              captures: { fac_id: $.data.id }
            - call: "POST /v1/lanes"
              payload: { label: "Cage 1", kind: "CAGE", buffer_minutes: 0, facility_id: "${fac_id}" }
              as: FacilityManager
              captures: { lane_id: $.data.id, lane_ver: $.data.version }
            - call: "POST /v1/members"
              payload: { full_name: "R", tier: "NONE", facility_id: "${fac_id}" }
              as: FacilityManager
              captures: { mem_id: $.data.id }
            - call: "POST /v1/waivers"
              payload: { facility_id: "${fac_id}", member_id: "${mem_id}" }
              as: Member
              as_user_id: "${mem_id}"
            - call: "POST /v1/members/${mem_id}/wallet/top-up"
              payload: { tokens: 100 }
              as: FrontDesk
            - call: "POST /v1/bookings"
              payload: { lane_id: "${lane_id}", member_id: "${mem_id}", kind: "OPEN_SLOT", pay_mode: "TOKEN", start_utc: "2026-04-02T09:00:00Z", end_utc: "2026-04-02T10:00:00Z", facility_id: "${fac_id}" }
              as: Member
              as_user_id: "${mem_id}"
              captures: { bk_id: $.data.id }
            - call: "POST /v1/bookings/${bk_id}/confirm"
              payload: { expected_lane_version: "${lane_ver}" }
              as: Member
              as_user_id: "${mem_id}"
          trigger:
            - call: "POST /v1/bookings/${bk_id}/reject"
              payload: {}
              as: FacilityManager
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_INVALID_STATE"

      - name: complete_from_confirmed_without_checkin_invalid_state
        claim_type: Invalid Transitions
        grounds:
          - "state_machines.Booking.CHECKED_IN_to_COMPLETED"
          - "errors[ERR_INVALID_STATE]"
        distinguishing_aspect: "COMPLETE requires CHECKED_IN; completing a CONFIRMED (not checked-in) booking -> 409 ERR_INVALID_STATE."
        test_recipe:
          setup: ["Facility, lane, member waiver SIGNED wallet 100; one CONFIRMED OPEN_SLOT booking (not checked in)."]
          setup_api_calls:
            - call: "POST /v1/facilities"
              payload: { name: "Fac", hourly_rate_cents: 4000, token_price_cents: 500 }
              as: FacilityManager
              captures: { fac_id: $.data.id }
            - call: "POST /v1/lanes"
              payload: { label: "Cage 1", kind: "CAGE", buffer_minutes: 0, facility_id: "${fac_id}" }
              as: FacilityManager
              captures: { lane_id: $.data.id, lane_ver: $.data.version }
            - call: "POST /v1/members"
              payload: { full_name: "C", tier: "NONE", facility_id: "${fac_id}" }
              as: FacilityManager
              captures: { mem_id: $.data.id }
            - call: "POST /v1/waivers"
              payload: { facility_id: "${fac_id}", member_id: "${mem_id}" }
              as: Member
              as_user_id: "${mem_id}"
            - call: "POST /v1/members/${mem_id}/wallet/top-up"
              payload: { tokens: 100 }
              as: FrontDesk
            - call: "POST /v1/bookings"
              payload: { lane_id: "${lane_id}", member_id: "${mem_id}", kind: "OPEN_SLOT", pay_mode: "TOKEN", start_utc: "2026-04-02T09:00:00Z", end_utc: "2026-04-02T10:00:00Z", facility_id: "${fac_id}" }
              as: Member
              as_user_id: "${mem_id}"
              captures: { bk_id: $.data.id }
            - call: "POST /v1/bookings/${bk_id}/confirm"
              payload: { expected_lane_version: "${lane_ver}" }
              as: Member
              as_user_id: "${mem_id}"
          trigger:
            - call: "POST /v1/bookings/${bk_id}/complete"
              payload: {}
              as: FrontDesk
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_INVALID_STATE"

      - name: booking_initial_state_requested
        claim_type: Initial State
        grounds: [entities.Booking.fields.status, state_machines.Booking.initial_state]
        distinguishing_aspect: "A freshly created booking starts in REQUESTED with final_cost_cents 0."
        test_recipe:
          setup: ["Facility, lane, member."]
          setup_api_calls:
            - call: "POST /v1/facilities"
              payload: { name: "Fac", hourly_rate_cents: 4000, token_price_cents: 500 }
              as: FacilityManager
              captures: { fac_id: $.data.id }
            - call: "POST /v1/lanes"
              payload: { label: "Cage 1", kind: "CAGE", buffer_minutes: 0, facility_id: "${fac_id}" }
              as: FacilityManager
              captures: { lane_id: $.data.id }
            - call: "POST /v1/members"
              payload: { full_name: "I", tier: "NONE", facility_id: "${fac_id}" }
              as: FacilityManager
              captures: { mem_id: $.data.id }
          trigger:
            - call: "POST /v1/bookings"
              payload: { lane_id: "${lane_id}", member_id: "${mem_id}", kind: "OPEN_SLOT", pay_mode: "HOURLY", start_utc: "2026-04-02T09:00:00Z", end_utc: "2026-04-02T10:00:00Z", facility_id: "${fac_id}" }
              as: Member
              as_user_id: "${mem_id}"
              captures: { bk_id: $.data.id }
          assert:
            - "Booking.${bk_id}.status == REQUESTED"
            - "Booking.${bk_id}.final_cost_cents == 0"

      - name: cancel_completed_booking_terminal_lockdown
        claim_type: Terminal State Lockdown
        grounds:
          - "state_machines.Booking.terminal_states"
          - "errors[ERR_INVALID_STATE]"
        distinguishing_aspect: "COMPLETED is terminal; cancelling a COMPLETED booking -> 409 ERR_INVALID_STATE."
        test_recipe:
          setup: ["Facility, lane, member waiver SIGNED wallet 100; a booking run REQUESTED->CONFIRMED->CHECKED_IN->COMPLETED."]
          setup_api_calls:
            - call: "POST /v1/facilities"
              payload: { name: "Fac", hourly_rate_cents: 4000, token_price_cents: 500 }
              as: FacilityManager
              captures: { fac_id: $.data.id }
            - call: "POST /v1/lanes"
              payload: { label: "Cage 1", kind: "CAGE", buffer_minutes: 0, facility_id: "${fac_id}" }
              as: FacilityManager
              captures: { lane_id: $.data.id, lane_ver: $.data.version }
            - call: "POST /v1/members"
              payload: { full_name: "T", tier: "NONE", facility_id: "${fac_id}" }
              as: FacilityManager
              captures: { mem_id: $.data.id }
            - call: "POST /v1/waivers"
              payload: { facility_id: "${fac_id}", member_id: "${mem_id}" }
              as: Member
              as_user_id: "${mem_id}"
            - call: "POST /v1/members/${mem_id}/wallet/top-up"
              payload: { tokens: 100 }
              as: FrontDesk
            - call: "POST /v1/bookings"
              payload: { lane_id: "${lane_id}", member_id: "${mem_id}", kind: "OPEN_SLOT", pay_mode: "TOKEN", start_utc: "2026-04-01T09:00:00Z", end_utc: "2026-04-01T10:00:00Z", facility_id: "${fac_id}" }
              as: Member
              as_user_id: "${mem_id}"
              captures: { bk_id: $.data.id }
            - call: "POST /v1/bookings/${bk_id}/confirm"
              payload: { expected_lane_version: "${lane_ver}" }
              as: Member
              as_user_id: "${mem_id}"
            - call: "POST /v1/bookings/${bk_id}/check-in"
              payload: {}
              as: FrontDesk
            - call: "POST /v1/bookings/${bk_id}/complete"
              payload: {}
              as: FrontDesk
          trigger:
            - call: "POST /v1/bookings/${bk_id}/cancel"
              payload: {}
              as: Member
              as_user_id: "${mem_id}"
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_INVALID_STATE"

      - name: no_show_sweep_via_run_ops_bubble_up_strike
        claim_type: Side Effect Execution
        grounds: [state_machines.Booking.CONFIRMED_to_NO_SHOW, entities.Member.fields.no_show_strikes]
        distinguishing_aspect: "run-ops past a CONFIRMED booking's end_utc with no check-in flips it to NO_SHOW and increments member.no_show_strikes; but run-ops ALSO resets strikes to 0 at epoch boundary, so after the sweep strikes==0 (reset applied after the sweep) — pin: NO_SHOW status set."
        test_recipe:
          setup: ["Facility, lane, member waiver SIGNED wallet 100; CONFIRMED booking 09:00-10:00 on 2026-04-01; clock advanced past end."]
          setup_api_calls:
            - call: "POST /v1/facilities"
              payload: { name: "Fac", hourly_rate_cents: 4000, token_price_cents: 500 }
              as: FacilityManager
              captures: { fac_id: $.data.id }
            - call: "POST /v1/lanes"
              payload: { label: "Cage 1", kind: "CAGE", buffer_minutes: 0, facility_id: "${fac_id}" }
              as: FacilityManager
              captures: { lane_id: $.data.id, lane_ver: $.data.version }
            - call: "POST /v1/members"
              payload: { full_name: "N", tier: "NONE", facility_id: "${fac_id}" }
              as: FacilityManager
              captures: { mem_id: $.data.id }
            - call: "POST /v1/waivers"
              payload: { facility_id: "${fac_id}", member_id: "${mem_id}" }
              as: Member
              as_user_id: "${mem_id}"
            - call: "POST /v1/members/${mem_id}/wallet/top-up"
              payload: { tokens: 100 }
              as: FrontDesk
            - call: "POST /v1/bookings"
              payload: { lane_id: "${lane_id}", member_id: "${mem_id}", kind: "OPEN_SLOT", pay_mode: "TOKEN", start_utc: "2026-04-01T09:00:00Z", end_utc: "2026-04-01T10:00:00Z", facility_id: "${fac_id}" }
              as: Member
              as_user_id: "${mem_id}"
              captures: { bk_id: $.data.id }
            - call: "POST /v1/bookings/${bk_id}/confirm"
              payload: { expected_lane_version: "${lane_ver}" }
              as: Member
              as_user_id: "${mem_id}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-04-01T11:00:00Z" }
              as: FacilityManager
          trigger:
            - call: "POST /v1/facilities/${fac_id}/run-ops"
              payload: {}
              as: FacilityManager
          assert:
            - "Booking.${bk_id}.status == NO_SHOW"
            - "Facility.${fac_id}.epoch_index == 1"

      - name: critical_maintenance_cascade_lane_closed
        claim_type: Side Effect Execution
        grounds: [state_machines.Lane.AVAILABLE_to_CLOSED]
        excluded_because:
          difficulty_instance: transitive_cascade / critical_maintenance_cascades_lane_facility_and_booking
          rationale: "Lane CLOSED + cascade cancel + posture shift are all asserted by that §1.8 instance."

  # ===========================================================================
  - section: calculations
    instances:
      - name: party_pricing_offpeak_bronze_wheel_correct
        claim_type: Correct Result
        grounds: [calculations.booking_charge, entities.Booking.fields.party_guests]
        distinguishing_aspect: "PARTY 120-min off-peak, BRONZE (0.10), WHEEL machine, 10 guests, lane rate 4000: final_cost_cents == 32220 (gross 8000+0+800+(15000+12000)=35800; *0.90=32220)."
        test_recipe:
          setup: ["Facility, lane, WHEEL machine, member BRONZE waiver SIGNED wallet 100 tokens."]
          setup_api_calls:
            - call: "POST /v1/facilities"
              payload: { name: "Fac", hourly_rate_cents: 4000, token_price_cents: 500 }
              as: FacilityManager
              captures: { fac_id: $.data.id }
            - call: "POST /v1/lanes"
              payload: { label: "Cage 1", kind: "CAGE", buffer_minutes: 0, facility_id: "${fac_id}" }
              as: FacilityManager
              captures: { lane_id: $.data.id, lane_ver: $.data.version }
            - call: "POST /v1/machines"
              payload: { lane_id: "${lane_id}", model: "WHEEL", facility_id: "${fac_id}" }
              as: FacilityManager
              captures: { mach_id: $.data.id }
            - call: "POST /v1/members"
              payload: { full_name: "P", tier: "BRONZE", facility_id: "${fac_id}" }
              as: FacilityManager
              captures: { mem_id: $.data.id }
