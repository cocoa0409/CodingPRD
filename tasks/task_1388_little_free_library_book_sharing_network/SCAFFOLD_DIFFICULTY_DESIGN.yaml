            - { call: "POST /library-network/boxes/${box}/status", payload: { target_status: "CHARTERED" }, as: NetworkAdmin, as_user_id: "admin-1" }
            - { call: "POST /library-network/boxes/${box}/inspections", payload: { result: "CONFIRMED" }, as: Moderator, as_user_id: "mod-1" }
            - { call: "POST /library-network/boxes/${box}/status", payload: { target_status: "ACTIVE" }, as: NetworkAdmin, as_user_id: "admin-1" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2027-01-27T00:00:00Z" }, as: NetworkAdmin, as_user_id: "admin-1" }
          trigger:
            - { call: "POST /library-network/map/sweeps", payload: {}, as: NetworkAdmin, as_user_id: "admin-1", captures: { sweep1_susp: "$.data.suspended_box_count" } }
            - { call: "GET /library-network/boxes/${box}", payload: {}, as: NetworkAdmin, as_user_id: "admin-1", captures: { d179_posture: "$.data.listing_posture", d179_days: "$.data.days_since_activity" } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2027-01-28T00:00:00Z" }, as: NetworkAdmin, as_user_id: "admin-1" }
            - { call: "POST /library-network/map/sweeps", payload: {}, as: NetworkAdmin, as_user_id: "admin-1", captures: { sweep2_susp: "$.data.suspended_box_count" } }
            - { call: "GET /library-network/boxes/${box}", payload: {}, as: NetworkAdmin, as_user_id: "admin-1" }
          assert:
            - "At 179 days (2027-01-27): sweep suspended_box_count == 0 (captured ${sweep1_susp}); box.days_since_activity == 179 (${d179_days}); posture == FLAGGED (${d179_posture}); charter_status still ACTIVE"
            - "At exactly 180 days (2027-01-28): sweep suspended_box_count == 1 (captured ${sweep2_susp})"
            - "Box.charter_status == SUSPENDED, box.listing_posture == DELISTED, box.days_since_activity == 180 — the >= 180 boundary is inclusive"

  # ===========================================================================
  # Rule 7 — cross_entity_state_dependency (different entity pairs)
  # ===========================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: run_confirm_rejected_when_planned_box_flagged
        grounds:
          - state_machines.DistributionRun.DRAFT_to_CONFIRMED
          - calculations.box_listing_posture
          - errors[ERR_PLAN_STALE]
        distinguishing_aspect: |
          Entity pair DistributionRun x LibraryBox: a run's DRAFT -> CONFIRMED transition
          re-validates every planned box's charter_status == ACTIVE and listing_posture ==
          LISTED; a single upheld complaint (posture LISTED -> FLAGGED) between plan and
          confirm makes the confirm fail with ERR_PLAN_STALE. Distinct pair from the sibling's
          TrainingCompletion x TrainingModule.
        test_recipe:
          setup:
            - "ACTIVE steward with ACTIVE LISTED box (capacity 10)"
            - "Batch with 2 graded items SORTED; run created (plan covers the box with quantity 2), still DRAFT"
            - "One complaint filed, triaged, responded, and resolved UPHELD -> box posture FLAGGED"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: NetworkAdmin, as_user_id: "admin-1" }
            - { call: "POST /library-network/training-modules", payload: { code: "ORIENTATION", title: "Orientation", level: 1 }, as: NetworkAdmin, as_user_id: "admin-1", captures: { mod_ori: "$.data.id" } }
            - { call: "POST /library-network/stewards", payload: { full_name: "Marie Curie", email: "marie@example.org", region_code: "OR" }, as: Anonymous, captures: { stw: "$.data.id" } }
            - { call: "POST /library-network/stewards/${stw}/training-completions", payload: { module_id: "${mod_ori}", score: 90 }, as: Steward, as_user_id: "${stw}" }
            - { call: "POST /library-network/stewards/${stw}/activate", payload: {}, as: NetworkAdmin, as_user_id: "admin-1" }
            - { call: "POST /library-network/boxes", payload: { steward_id: "${stw}", name: "Fir Box", latitude: 45.52, longitude: -122.68, capacity_books: 10, region_code: "OR" }, as: Steward, as_user_id: "${stw}", captures: { box: "$.data.id" } }
            - { call: "POST /library-network/boxes/${box}/status", payload: { target_status: "CHARTERED" }, as: NetworkAdmin, as_user_id: "admin-1" }
            - { call: "POST /library-network/boxes/${box}/inspections", payload: { result: "CONFIRMED" }, as: Moderator, as_user_id: "mod-1" }
            - { call: "POST /library-network/boxes/${box}/status", payload: { target_status: "ACTIVE" }, as: NetworkAdmin, as_user_id: "admin-1" }
            - { call: "POST /library-network/batches", payload: { source_type: "PUBLIC_DROP", region_code: "OR" }, as: HubCoordinator, as_user_id: "hub-1", captures: { batch: "$.data.id" } }
            - { call: "POST /library-network/batches/${batch}/items", payload: { items: [ { title: "Q1", category: "FICTION", condition_grade: "A" }, { title: "Q2", category: "FICTION", condition_grade: "B" } ] }, as: HubCoordinator, as_user_id: "hub-1" }
            - { call: "POST /library-network/batches/${batch}/sort-complete", payload: {}, as: HubCoordinator, as_user_id: "hub-1", captures: { b_v: "$.data.version" } }
            - { call: "POST /library-network/batches/${batch}/distribution-runs", payload: { expected_batch_version: "${b_v}" }, as: HubCoordinator, as_user_id: "hub-1", captures: { run: "$.data.id" } }
            - { call: "POST /library-network/complaints", payload: { box_id: "${box}", category: "COMMERCIAL_SPAM", description: "Promo leaflets" }, as: Anonymous, captures: { cmp: "$.data.id" } }
            - { call: "POST /library-network/complaints/${cmp}/triage", payload: {}, as: Moderator, as_user_id: "mod-1" }
            - { call: "POST /library-network/complaints/${cmp}/respond", payload: { response_text: "Removed them." }, as: Steward, as_user_id: "${stw}" }
            - { call: "POST /library-network/complaints/${cmp}/resolve", payload: { outcome: "UPHELD" }, as: Moderator, as_user_id: "mod-2" }
          trigger:
            - { call: "POST /library-network/distribution-runs/${run}/confirm", payload: {}, as: HubCoordinator, as_user_id: "hub-1", captures: { err: "$.data.error_id" } }
            - { call: "GET /library-network/distribution-runs/${run}", payload: {}, as: HubCoordinator, as_user_id: "hub-1" }
            - { call: "GET /library-network/distribution-runs/${run}/allocations", payload: {}, as: HubCoordinator, as_user_id: "hub-1" }
            - { call: "GET /library-network/book-items?batch_id=${batch}", payload: {}, as: HubCoordinator, as_user_id: "hub-1" }
          assert:
            - "Confirm is rejected with error_id == ERR_PLAN_STALE (captured ${err}) and HTTP 409 because the planned box's listing_posture is FLAGGED, not LISTED"
            - "DistributionRun.${run}.status remains DRAFT"
            - "The run has 0 Allocations (list total_count == 0)"
            - "Both BookItems remain AVAILABLE with box_id == null"

      - name: completion_rejected_without_prerequisite_pass
        grounds:
          - entities.TrainingModule.fields.prerequisite_module_id
          - calculations.training_level
          - errors[ERR_PREREQUISITE_NOT_MET]
          - validations[priority=9]
        distinguishing_aspect: |
          Entity pair TrainingCompletion x TrainingModule: creating a completion for CURATION
          requires a PASSED completion of its prerequisite ORIENTATION module; without one the
          create is rejected with ERR_PREREQUISITE_NOT_MET, and once ORIENTATION is PASSED the
          identical request succeeds. Distinct entity pair from the sibling's
          DistributionRun x LibraryBox.
        test_recipe:
          setup:
            - "Modules: ORIENTATION (no prerequisite) and CURATION with prerequisite_module_id == ORIENTATION"
            - "Steward registered (APPLIED) with zero completions"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: NetworkAdmin, as_user_id: "admin-1" }
            - { call: "POST /library-network/training-modules", payload: { code: "ORIENTATION", title: "Orientation", level: 1 }, as: NetworkAdmin, as_user_id: "admin-1", captures: { mod_ori: "$.data.id" } }
            - { call: "POST /library-network/training-modules", payload: { code: "CURATION", title: "Curation", level: 2, prerequisite_module_id: "${mod_ori}" }, as: NetworkAdmin, as_user_id: "admin-1", captures: { mod_cur: "$.data.id" } }
            - { call: "POST /library-network/stewards", payload: { full_name: "Sofia Reyes", email: "sofia@example.org", region_code: "WA" }, as: Anonymous, captures: { stw: "$.data.id" } }
          trigger:
            - { call: "POST /library-network/stewards/${stw}/training-completions", payload: { module_id: "${mod_cur}", score: 95 }, as: Steward, as_user_id: "${stw}", captures: { err: "$.data.error_id" } }
            - { call: "POST /library-network/stewards/${stw}/training-completions", payload: { module_id: "${mod_ori}", score: 85 }, as: Steward, as_user_id: "${stw}" }
            - { call: "POST /library-network/stewards/${stw}/training-completions", payload: { module_id: "${mod_cur}", score: 95 }, as: Steward, as_user_id: "${stw}", captures: { comp: "$.data.id", comp_result: "$.data.result" } }
            - { call: "GET /library-network/stewards/${stw}", payload: {}, as: NetworkAdmin, as_user_id: "admin-1" }
          assert:
            - "First CURATION attempt rejected with error_id == ERR_PREREQUISITE_NOT_MET (captured ${err})"
            - "After ORIENTATION PASSED, the identical CURATION request succeeds with result == PASSED (captured ${comp_result})"
            - "Steward.${stw}.training_level == 2 (two distinct PASSED modules)"

  # ===========================================================================
  # Rule 8 — resource_temporal_overlap (different interval semantics)
  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: drive_window_half_open_overlap_rules
        grounds:
          - validations[priority=8]
          - errors[ERR_DRIVE_WINDOW_OVERLAP]
          - entities.BookDrive.fields.starts_at
          - entities.BookDrive.fields.ends_at
        distinguishing_aspect: |
          Half-open interval semantics [starts_at, ends_at) on the School resource: a drive
          starting exactly when another ends (zero-gap adjacency) is accepted, while a truly
          overlapping window is rejected with ERR_DRIVE_WINDOW_OVERLAP. Distinct semantics from
          the sibling's minimum-gap buffer on LibraryBox inspections.
        test_recipe:
          setup:
            - "ACTIVE steward; ACTIVE school; drive1 PROPOSED with window [2026-09-01T00:00:00Z, 2026-10-01T00:00:00Z)"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: NetworkAdmin, as_user_id: "admin-1" }
            - { call: "POST /library-network/training-modules", payload: { code: "ORIENTATION", title: "Orientation", level: 1 }, as: NetworkAdmin, as_user_id: "admin-1", captures: { mod_ori: "$.data.id" } }
            - { call: "POST /library-network/stewards", payload: { full_name: "Omar Farouk", email: "omar@example.org", region_code: "OR" }, as: Anonymous, captures: { stw: "$.data.id" } }
            - { call: "POST /library-network/stewards/${stw}/training-completions", payload: { module_id: "${mod_ori}", score: 90 }, as: Steward, as_user_id: "${stw}" }
            - { call: "POST /library-network/stewards/${stw}/activate", payload: {}, as: NetworkAdmin, as_user_id: "admin-1" }
            - { call: "POST /library-network/schools", payload: { name: "Sunnyside High", district_code: "D-5", contact_email: "front@sunnyside.edu", region_code: "OR", restricted_categories: [] }, as: NetworkAdmin, as_user_id: "admin-1", captures: { sch: "$.data.id" } }
            - { call: "POST /library-network/schools/${sch}/status", payload: { target_status: "ACTIVE" }, as: NetworkAdmin, as_user_id: "admin-1" }
            - { call: "POST /library-network/drives", payload: { school_id: "${sch}", goal_books: 50, starts_at: "2026-09-01T00:00:00Z", ends_at: "2026-10-01T00:00:00Z" }, as: Steward, as_user_id: "${stw}", captures: { d1: "$.data.id" } }
          trigger:
            - { call: "POST /library-network/drives", payload: { school_id: "${sch}", goal_books: 30, starts_at: "2026-10-01T00:00:00Z", ends_at: "2026-11-01T00:00:00Z" }, as: Steward, as_user_id: "${stw}", captures: { d2: "$.data.id" } }
            - { call: "POST /library-network/drives", payload: { school_id: "${sch}", goal_books: 20, starts_at: "2026-09-15T00:00:00Z", ends_at: "2026-10-15T00:00:00Z" }, as: Steward, as_user_id: "${stw}", captures: { err: "$.data.error_id" } }
            - { call: "GET /library-network/drives?school_id=${sch}", payload: {}, as: NetworkAdmin, as_user_id: "admin-1" }
          assert:
            - "Adjacent drive [2026-10-01, 2026-11-01) is accepted (id ${d2} returned, HTTP 201): under half-open semantics [2026-09-01, 2026-10-01) and [2026-10-01, 2026-11-01) share no instant"
            - "Overlapping drive [2026-09-15, 2026-10-15) is rejected with error_id == ERR_DRIVE_WINDOW_OVERLAP (captured ${err})"
            - "Exactly 2 drives exist for the school (list total_count == 2)"

      - name: inspection_minimum_gap_buffer_30_days
        grounds:
          - validations[priority=8]
          - errors[ERR_INSPECTION_TOO_SOON]
          - entities.InspectionRecord.fields.result
        distinguishing_aspect: |
          Minimum-gap buffer semantics on the LibraryBox resource: a new CONFIRMED inspection
          requires >= 30 days since the previous CONFIRMED inspection — 29 days is rejected
          with ERR_INSPECTION_TOO_SOON, exactly 30 days succeeds. A buffer-gap rule, distinct
          from the sibling's half-open overlap semantics (adjacency allowed there; here even
          zero-overlap records are rejected inside the buffer).
        test_recipe:
          setup:
            - "Box CHARTERED at 2026-08-01T00:00:00Z with its first CONFIRMED inspection at that timestamp, then activated"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: NetworkAdmin, as_user_id: "admin-1" }
            - { call: "POST /library-network/training-modules", payload: { code: "ORIENTATION", title: "Orientation", level: 1 }, as: NetworkAdmin, as_user_id: "admin-1", captures: { mod_ori: "$.data.id" } }
            - { call: "POST /library-network/stewards", payload: { full_name: "Priya Nair", email: "priya@example.org", region_code: "OR" }, as: Anonymous, captures: { stw: "$.data.id" } }
            - { call: "POST /library-network/stewards/${stw}/training-completions", payload: { module_id: "${mod_ori}", score: 90 }, as: Steward, as_user_id: "${stw}" }
            - { call: "POST /library-network/stewards/${stw}/activate", payload: {}, as: NetworkAdmin, as_user_id: "admin-1" }
            - { call: "POST /library-network/boxes", payload: { steward_id: "${stw}", name: "Juniper Box", latitude: 45.52, longitude: -122.68, capacity_books: 10, region_code: "OR" }, as: Steward, as_user_id: "${stw}", captures: { box: "$.data.id" } }
            - { call: "POST /library-network/boxes/${box}/status", payload: { target_status: "CHARTERED" }, as: NetworkAdmin, as_user_id: "admin-1" }
            - { call: "POST /library-network/boxes/${box}/inspections", payload: { result: "CONFIRMED" }, as: Moderator, as_user_id: "mod-1", captures: { insp1: "$.data.id" } }
            - { call: "POST /library-network/boxes/${box}/status", payload: { target_status: "ACTIVE" }, as: NetworkAdmin, as_user_id: "admin-1" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-30T00:00:00Z" }, as: NetworkAdmin, as_user_id: "admin-1" }
          trigger:
            - { call: "POST /library-network/boxes/${box}/inspections", payload: { result: "CONFIRMED" }, as: Moderator, as_user_id: "mod-1", captures: { err: "$.data.error_id" } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-31T00:00:00Z" }, as: NetworkAdmin, as_user_id: "admin-1" }
            - { call: "POST /library-network/boxes/${box}/inspections", payload: { result: "CONFIRMED" }, as: Moderator, as_user_id: "mod-1", captures: { insp2: "$.data.id" } }
            - { call: "GET /library-network/boxes/${box}", payload: {}, as: NetworkAdmin, as_user_id: "admin-1" }
          assert:
            - "At +29 days (2026-08-30): CONFIRMED inspection rejected with error_id == ERR_INSPECTION_TOO_SOON (captured ${err})"
            - "At exactly +30 days (2026-08-31): CONFIRMED inspection succeeds (id ${insp2} returned) — the buffer is inclusive at 30 days"
            - "LibraryBox.${box}.last_activity_at == 2026-08-31T00:00:00Z after the successful inspection"

  # ===========================================================================
  # Rule 9 — compensating_invariant (different conserved quantities)
  # ===========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: book_pool_conserved_under_confirm_then_cancel_all
        grounds:
          - state_machines.BookItem.AVAILABLE_to_ALLOCATED
          - state_machines.BookItem.ALLOCATED_to_AVAILABLE
          - state_machines.Allocation.RESERVED_to_CANCELLED
          - state_machines.DistributionRun.CONFIRMED_to_COMPLETED
        distinguishing_aspect: |
          Conserved quantity: the per-batch book pool — DonationBatch.item_count and the
          per-status partition of its items. Forward action (confirm: 3 items AVAILABLE ->
          ALLOCATED) paired with its compensating action (cancel all 3 allocations) restores
          AVAILABLE == 3 with zero drift; batch.item_count == 3 throughout. Distinct conserved
          quantity from the sibling's per-box stock equality.
        test_recipe:
          setup:
            - "ACTIVE steward with ACTIVE LISTED box (capacity 10)"
            - "Batch with 3 graded items SORTED; run created in DRAFT with planned_item_count == 3"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: NetworkAdmin, as_user_id: "admin-1" }
            - { call: "POST /library-network/training-modules", payload: { code: "ORIENTATION", title: "Orientation", level: 1 }, as: NetworkAdmin, as_user_id: "admin-1", captures: { mod_ori: "$.data.id" } }
            - { call: "POST /library-network/stewards", payload: { full_name: "Kenji Mori", email: "kenji@example.org", region_code: "OR" }, as: Anonymous, captures: { stw: "$.data.id" } }
            - { call: "POST /library-network/stewards/${stw}/training-completions", payload: { module_id: "${mod_ori}", score: 90 }, as: Steward, as_user_id: "${stw}" }
            - { call: "POST /library-network/stewards/${stw}/activate", payload: {}, as: NetworkAdmin, as_user_id: "admin-1" }
            - { call: "POST /library-network/boxes", payload: { steward_id: "${stw}", name: "Hemlock Box", latitude: 45.52, longitude: -122.68, capacity_books: 10, region_code: "OR" }, as: Steward, as_user_id: "${stw}", captures: { box: "$.data.id" } }
            - { call: "POST /library-network/boxes/${box}/status", payload: { target_status: "CHARTERED" }, as: NetworkAdmin, as_user_id: "admin-1" }
            - { call: "POST /library-network/boxes/${box}/inspections", payload: { result: "CONFIRMED" }, as: Moderator, as_user_id: "mod-1" }
            - { call: "POST /library-network/boxes/${box}/status", payload: { target_status: "ACTIVE" }, as: NetworkAdmin, as_user_id: "admin-1" }
            - { call: "POST /library-network/batches", payload: { source_type: "PUBLIC_DROP", region_code: "OR" }, as: HubCoordinator, as_user_id: "hub-1", captures: { batch: "$.data.id" } }
            - { call: "POST /library-network/batches/${batch}/items", payload: { items: [ { title: "K1", category: "FICTION", condition_grade: "A" }, { title: "K2", category: "FICTION", condition_grade: "B" }, { title: "K3", category: "NONFICTION", condition_grade: "A" } ] }, as: HubCoordinator, as_user_id: "hub-1" }
            - { call: "POST /library-network/batches/${batch}/sort-complete", payload: {}, as: HubCoordinator, as_user_id: "hub-1", captures: { b_v: "$.data.version" } }
            - { call: "POST /library-network/batches/${batch}/distribution-runs", payload: { expected_batch_version: "${b_v}" }, as: HubCoordinator, as_user_id: "hub-1", captures: { run: "$.data.id" } }
          trigger:
            - { call: "POST /library-network/distribution-runs/${run}/confirm", payload: {}, as: HubCoordinator, as_user_id: "hub-1" }
            - { call: "GET /library-network/distribution-runs/${run}/allocations", payload: {}, as: HubCoordinator, as_user_id: "hub-1", captures: { a0: "$.data[0].id", a1: "$.data[1].id", a2: "$.data[2].id" } }
            - { call: "POST /library-network/allocations/${a0}/cancel", payload: {}, as: HubCoordinator, as_user_id: "hub-1" }
            - { call: "POST /library-network/allocations/${a1}/cancel", payload: {}, as: HubCoordinator, as_user_id: "hub-1" }
            - { call: "POST /library-network/allocations/${a2}/cancel", payload: {}, as: HubCoordinator, as_user_id: "hub-1" }
            - { call: "GET /library-network/book-items?batch_id=${batch}", payload: {}, as: HubCoordinator, as_user_id: "hub-1" }
            - { call: "GET /library-network/batches/${batch}", payload: {}, as: HubCoordinator, as_user_id: "hub-1" }
            - { call: "GET /library-network/distribution-runs/${run}", payload: {}, as: HubCoordinator, as_user_id: "hub-1" }
          assert:
            - "Immediately after confirm (before any cancel): all 3 BookItems are ALLOCATED and 3 Allocations are RESERVED"
            - "After the three compensating cancels: all 3 BookItems are AVAILABLE with box_id == null and all 3 Allocations are CANCELLED"
            - "DonationBatch.${batch}.item_count == 3 before, between, and after the forward/compensating pair — no book is created or destroyed"
            - "DistributionRun.${run}.status == COMPLETED (bubble-up: all allocations terminal)"
            - "LibraryBox.${box}.current_stock == 0"

      - name: box_stock_conserved_under_receive_then_decommission
        grounds:
          - state_machines.Allocation.DISPATCHED_to_PLACED
          - state_machines.Allocation.PLACED_to_REMOVED
          - state_machines.LibraryBox.ACTIVE_to_DECOMMISSIONED
          - entities.LibraryBox.fields.current_stock
        distinguishing_aspect: |
          Conserved quantity: the per-box stock equality current_stock == count(Allocations
          with box_id == box and status == PLACED). Forward action (2 receives: stock 0 -> 2)
          paired with the compensating decommission (2 PLACED -> REMOVED) returns stock to 0
          with the equality holding at every observation. Distinct conserved quantity from the
          sibling's per-batch book pool.
        test_recipe:
          setup:
            - "ACTIVE steward with ACTIVE LISTED box (capacity 10)"
            - "Batch with 2 graded items SORTED; run confirmed and dispatched; allocations a0/a1 DISPATCHED to the box"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: NetworkAdmin, as_user_id: "admin-1" }
            - { call: "POST /library-network/training-modules", payload: { code: "ORIENTATION", title: "Orientation", level: 1 }, as: NetworkAdmin, as_user_id: "admin-1", captures: { mod_ori: "$.data.id" } }
            - { call: "POST /library-network/stewards", payload: { full_name: "Lucia Fernandez", email: "lucia@example.org", region_code: "OR" }, as: Anonymous, captures: { stw: "$.data.id" } }
            - { call: "POST /library-network/stewards/${stw}/training-completions", payload: { module_id: "${mod_ori}", score: 90 }, as: Steward, as_user_id: "${stw}" }
            - { call: "POST /library-network/stewards/${stw}/activate", payload: {}, as: NetworkAdmin, as_user_id: "admin-1" }
            - { call: "POST /library-network/boxes", payload: { steward_id: "${stw}", name: "Chestnut Box", latitude: 45.52, longitude: -122.68, capacity_books: 10, region_code: "OR" }, as: Steward, as_user_id: "${stw}", captures: { box: "$.data.id" } }
            - { call: "POST /library-network/boxes/${box}/status", payload: { target_status: "CHARTERED" }, as: NetworkAdmin, as_user_id: "admin-1" }
            - { call: "POST /library-network/boxes/${box}/inspections", payload: { result: "CONFIRMED" }, as: Moderator, as_user_id: "mod-1" }
            - { call: "POST /library-network/boxes/${box}/status", payload: { target_status: "ACTIVE" }, as: NetworkAdmin, as_user_id: "admin-1" }
            - { call: "POST /library-network/batches", payload: { source_type: "PUBLIC_DROP", region_code: "OR" }, as: HubCoordinator, as_user_id: "hub-1", captures: { batch: "$.data.id" } }
            - { call: "POST /library-network/batches/${batch}/items", payload: { items: [ { title: "L1", category: "FICTION", condition_grade: "A" }, { title: "L2", category: "FICTION", condition_grade: "B" } ] }, as: HubCoordinator, as_user_id: "hub-1" }
            - { call: "POST /library-network/batches/${batch}/sort-complete", payload: {}, as: HubCoordinator, as_user_id: "hub-1", captures: { b_v: "$.data.version" } }
            - { call: "POST /library-network/batches/${batch}/distribution-runs", payload: { expected_batch_version: "${b_v}" }, as: HubCoordinator, as_user_id: "hub-1", captures: { run: "$.data.id" } }
            - { call: "POST /library-network/distribution-runs/${run}/confirm", payload: {}, as: HubCoordinator, as_user_id: "hub-1" }
            - { call: "GET /library-network/distribution-runs/${run}/allocations", payload: {}, as: HubCoordinator, as_user_id: "hub-1", captures: { a0: "$.data[0].id", a1: "$.data[1].id" } }
            - { call: "POST /library-network/distribution-runs/${run}/dispatch", payload: {}, as: HubCoordinator, as_user_id: "hub-1" }
          trigger:
            - { call: "POST /library-network/allocations/${a0}/receive", payload: {}, as: Steward, as_user_id: "${stw}" }
            - { call: "POST /library-network/allocations/${a1}/receive", payload: {}, as: Steward, as_user_id: "${stw}" }
            - { call: "GET /library-network/boxes/${box}", payload: {}, as: NetworkAdmin, as_user_id: "admin-1", captures: { mid_stock: "$.data.current_stock" } }
            - { call: "POST /library-network/boxes/${box}/status", payload: { target_status: "DECOMMISSIONED" }, as: NetworkAdmin, as_user_id: "admin-1" }
            - { call: "GET /library-network/boxes/${box}", payload: {}, as: NetworkAdmin, as_user_id: "admin-1" }
            - { call: "GET /library-network/allocations?box_id=${box}", payload: {}, as: NetworkAdmin, as_user_id: "admin-1" }
            - { call: "GET /library-network/book-items?batch_id=${batch}", payload: {}, as: HubCoordinator, as_user_id: "hub-1" }
          assert:
            - "After the two receives: box.current_stock == 2 (captured ${mid_stock}) and exactly 2 Allocations with box_id == ${box} are PLACED — equality holds"
            - "After decommission: box.current_stock == 0 and both Allocations are REMOVED (0 PLACED) — equality holds again"
            - "Both BookItems are RECYCLED with box_id == null"
            - "LibraryBox.${box}.charter_status == DECOMMISSIONED and listing_posture == DELISTED"
            - "DistributionRun.${run}.status == COMPLETED and remains so (terminal state is not re-opened by the REMOVED cascade)"
