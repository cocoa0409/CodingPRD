scenario: "2308. News Paywall & Digital Subscription Management (news publisher consumer revenue): meter design with free article allowances, registration walls and dynamic paywall rules by content and user propensity, subscription offer architecture with introductory pricing, step-up schedules and bundle configurations, churn management with cancellation flows, save offers and pause options compliant with cancellation regulations, payment failure recovery with retry logic and card updater services, print-digital bundle fulfillment with delivery interruptions and vacation holds, group and institutional subscriptions with authentication and seat management, engagement scoring to predict churn with editorial and product interventions, price increase communication and grandfathering policy"
domain_name: "news-paywall-subscription-management"
api_prefix: "/paywall"

complexity_profile:
  primary_archetype: pricing_engine
  secondary_archetype: compliance_audit
  complexity_layers:
    - optimistic_concurrency
    - rate_threshold_triggers
    - cascading_side_effects
    - dual_variant_calculation

  entity_topology: graph
  # Seat is a true junction between GroupAccount and Reader; OfferPlan / PaywallRule /
  # Article are cross-aggregate configuration referenced by Subscription and ReaderEvent;
  # URL paths stay flat (collections + FK-filtered lists), no deep nesting beyond one hop.

  state_machine_shape: parallel
  # Subscription carries three independent state dimensions (lifecycle_status ×
  # dunning_status × print_fulfillment_status), each with its own cycles;
  # CancellationRequest is a branching fork with divergent side-effect sets;
  # OfferPlan.price_change_state is a guarded compliance pipeline.

  relationship_patterns:
    - one_to_many          # Subscription -> Invoice -> PaymentAttempt
    - many_to_many         # Reader <-> GroupAccount via Seat
    - cross_aggregate      # ReaderEvent -> Article / PaywallRule; Subscription -> OfferPlan
    - polymorphic          # Hold.hold_type selects PAUSE_BILLING | VACATION_DELIVERY | DELIVERY_INTERRUPTION semantics

  role_model: segregation_of_duties
  # RevenueManager may SCHEDULE a price change but may never send notices or apply it;
  # ComplianceOfficer sends notices and applies, but may never author plans or rules.

  consistency_model: immediate
  # Every derived field (engagement_score, entitlement_source, seats_assigned_count,
  # pending_credit_cents, next_cycle_price_cents) is recomputed inside the mutating
  # request. The billing run is not eventual consistency: it is an explicit
  # operator-triggered epoch advance whose effects are also immediate.

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

entities:
  - name: OfferPlan
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: Commercial name of the offer, e.g. "Digital Plus".
        constraints: 1-120 chars, unique across OfferPlan
      - name: bundle_type
        type: enum
        source: input
        description: Bundle configuration this plan sells.
        constraints: "DIGITAL_ONLY | PRINT_DIGITAL | INSTITUTIONAL_SEAT"
      - name: status
        type: enum
        source: system
        description: Plan lifecycle; only ACTIVE plans accept new subscriptions. DRAFT plans are authored but not sellable.
        default: DRAFT
        constraints: "DRAFT | ACTIVE"
      - name: intro_price_cents
        type: integer
        source: input
        description: Introductory all-inclusive price charged for cycles 1..intro_cycles.
        constraints: ">= 0"
      - name: intro_cycles
        type: integer
        source: input
        description: Number of leading billing cycles priced at intro_price_cents.
        constraints: ">= 0"
      - name: step_up_schedule
        type: array
        source: input
        description: Ordered step-up entries, each an object { from_cycle, price_cents }.
        constraints: "from_cycle strictly increasing, all > intro_cycles and < standard_from_cycle; price_cents non-decreasing"
      - name: standard_from_cycle
        type: integer
        source: input
        description: First cycle index billed at standard_price_cents.
        constraints: "> intro_cycles and > every step_up_schedule.from_cycle"
      - name: standard_price_cents
        type: integer
        source: input
        description: All-inclusive price from standard_from_cycle onward; mutated by a price change apply.
        constraints: ">= 0"
      - name: cycle_days
        type: integer
        source: input
        description: Fixed length of one billing cycle in days (no calendar-month drift).
        default: 30
        constraints: "1..92"
      - name: print_component_cents
        type: integer
        source: input
        description: Portion of the cycle price attributable to print delivery; base for vacation credits.
        default: 0
        constraints: "0 unless bundle_type == PRINT_DIGITAL; <= standard_price_cents"
      - name: print_delivery_days
        type: array
        source: input
        description: Weekday codes on which print copies are delivered.
        default: []
        constraints: "subset of [MON,TUE,WED,THU,FRI,SAT,SUN]; empty unless PRINT_DIGITAL"
      - name: print_deliveries_per_cycle
        type: integer
        source: input
        description: Contractual number of print deliveries per billing cycle; divisor for the daily print rate.
        default: 0
        constraints: ">= 1 when bundle_type == PRINT_DIGITAL, else 0"
      - name: per_seat_price_cents
        type: integer
        source: input
        description: Per-seat charge per cycle for INSTITUTIONAL_SEAT plans.
        default: 0
        constraints: ">= 0; must be > 0 when bundle_type == INSTITUTIONAL_SEAT"
      - name: price_change_state
        type: enum
        source: system
        description: Compliance pipeline for a scheduled price increase.
        default: NONE
        constraints: "NONE | SCHEDULED | NOTICE_SENT | APPLIED"
      - name: pending_price_cents
        type: integer
        source: input
        description: Scheduled new standard price; null while price_change_state == NONE.
        constraints: "> standard_price_cents at scheduling time"
      - name: pending_effective_on
        type: string
        source: input
        description: ISO date (YYYY-MM-DD) on which the pending price becomes billable.
        constraints: "must be >= clock_date + 1 day at scheduling time"
      - name: notice_sent_on
        type: string
        source: system
        description: ISO date the subscriber notices were dispatched; null until NOTICE_SENT.
      - name: notice_sent_by_user_id
        type: string
        source: system
        description: X-User-ID of the ComplianceOfficer who dispatched the notices; the segregation-of-duties comparand when the increase is applied. Null until NOTICE_SENT.
      - name: grandfather_policy
        type: enum
        source: input
        description: Which existing subscriptions keep the old price when the change is applied.
        default: NONE
        constraints: "NONE | TENURE_12_CYCLES | ALL_EXISTING"
      - name: active_subscription_count
        type: integer
        source: computed
        description: Count of Subscription rows on this plan with lifecycle_status IN {PENDING_ACTIVATION, ACTIVE, PAUSED, CANCEL_SCHEDULED}.
        default: 0

  - name: PaywallRule
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: Operator-facing rule label.
        constraints: 1-120 chars
      - name: status
        type: enum
        source: input
        description: Only ACTIVE rules enter the candidate pool of the access decision selector.
        default: ACTIVE
        constraints: "ACTIVE | INACTIVE"
      - name: content_type_match
        type: enum
        source: input
        description: Article content type this rule matches, or ANY.
        default: ANY
        constraints: "NEWS | OPINION | INVESTIGATION | LIVE_BLOG | ANY"
      - name: section_match
        type: string
        source: input
        description: Article section slug this rule matches, or the literal "ANY".
        default: ANY
        constraints: lowercase slug or "ANY"
      - name: propensity_band_match
        type: enum
        source: input
        description: Reader propensity band this rule matches, or ANY.
        default: ANY
        constraints: "HIGH | MEDIUM | LOW | ANY"
      - name: action
        type: enum
        source: input
        description: Gate applied when this rule is selected.
        constraints: "ALLOW_FREE | METER | REGISTRATION_WALL | HARD_PAYWALL"
      - name: meter_allowance_override
        type: integer
        source: input
        description: Base free-article allowance for this rule; null falls back to SITE_DEFAULT_METER_ALLOWANCE.
        constraints: ">= 0 when present"
      - name: priority
        type: integer
        source: input
        description: Operator-assigned tie-break weight; lower wins when specificity_score ties.
        constraints: "1..999; unique per (content_type_match, section_match, propensity_band_match) triple"
      - name: specificity_score
        type: integer
        source: computed
        description: "100*(content_type_match != ANY) + 10*(section_match != ANY) + 1*(propensity_band_match != ANY); primary ranking key (DESC)."

  - name: Article
    parent: null
    common_fields: true
    fields:
      - name: headline
        type: string
        source: input
        description: Article headline.
        constraints: 1-240 chars
      - name: content_type
        type: enum
        source: input
        description: Editorial content type used by paywall rule matching.
        constraints: "NEWS | OPINION | INVESTIGATION | LIVE_BLOG"
      - name: section
        type: string
        source: input
        description: Section slug used by paywall rule matching.
        constraints: lowercase slug, 1-40 chars
      - name: access_class
        type: enum
        source: input
        description: Article-level override evaluated before any PaywallRule.
        default: METERED
        constraints: "OPEN | METERED | PREMIUM"
      - name: published_at
        type: datetime
        source: input
        description: Publication instant; defaults to the logical clock at creation.

  - name: Reader
    parent: null
    common_fields: true
    fields:
      - name: email
        type: string
        source: input
        description: Reader email; null for unregistered device records.
        constraints: "must be present when is_registered == true; unique when present"
      - name: is_registered
        type: boolean
        source: input
        description: True once the reader has completed registration (email captured).
        default: false
      - name: propensity_band
        type: enum
        source: input
        description: Subscription-propensity band from the offline model; refreshed by ENGAGEMENT_ONLY/FULL billing runs.
        default: MEDIUM
        constraints: "HIGH | MEDIUM | LOW"
      - name: engagement_score
        type: number
        source: computed
        description: Decayed 30-day engagement score, 2 decimal places.
        default: 0.00
      - name: churn_risk_band
        type: enum
        source: computed
        description: Churn band derived from engagement_score with a dunning override.
        default: SEVERE
        constraints: "SEVERE | HIGH | MEDIUM | LOW"
      - name: metered_article_ids
        type: array
        source: computed
        description: Distinct Article ids charged against the meter in the current meter period, in grant order.
        default: []
      - name: metered_distinct_article_count
        type: integer
        source: computed
        description: Length of metered_article_ids; the meter counter compared against the effective allowance.
        default: 0
      - name: meter_period_started_on
        type: string
        source: system
        description: ISO date the current 30-day meter period began; set to the clock date at creation and on each lazy reset.
      - name: entitlement_source
        type: enum
        source: computed
        description: Strongest live entitlement; SUBSCRIPTION outranks SEAT.
        default: NONE
        constraints: "NONE | SUBSCRIPTION | SEAT"
      - name: tenure_days
        type: integer
        source: computed
        description: "floor((clock_utc - created_at) / 86400s); denominator of the cohort_normalized engagement variant."
        default: 0
      - name: intervention_count_in_period
        type: integer
        source: computed
        description: Count of ReaderEvent rows with event_type IN {INTERVENTION_EDITORIAL, INTERVENTION_PRODUCT} whose occurred_at >= meter_period_started_on.
        default: 0
      - name: card_last4
        type: string
        source: input
        description: Last four digits of the stored card; null when no card on file.
        constraints: exactly 4 digits when present
      - name: card_exp_month
        type: integer
        source: input
        description: Stored card expiry month.
        constraints: "1..12; required when card_last4 present"
      - name: card_exp_year
        type: integer
        source: input
        description: Stored card expiry year; incremented by CARD_UPDATER_EXTENSION_YEARS when the updater succeeds.
        constraints: "2020..2099; required when card_last4 present"
      - name: card_status
        type: enum
        source: computed
        description: "MISSING when card_last4 is null; EXPIRED when (card_exp_year, card_exp_month) < (clock year, clock month); else CURRENT."
        default: MISSING
        constraints: "MISSING | CURRENT | EXPIRED"
      - name: card_updater_registered
        type: boolean
        source: input
        description: Whether the card is enrolled with the network card-updater service.
        default: false
      - name: card_updater_status
        type: enum
        source: system
        description: Outcome of the last card-updater sweep during dunning.
        default: NOT_APPLICABLE
        constraints: "NOT_APPLICABLE | PENDING | UPDATED | UNAVAILABLE"

  - name: Subscription
    parent: Reader
    common_fields: true
    fields:
      - name: reader_id
        type: string
        source: input
        description: FK -> Reader.id; the paying/entitled reader.
      - name: offer_plan_id
        type: string
        source: input
        description: FK -> OfferPlan.id; the plan whose price ladder governs this subscription.
      - name: group_account_id
        type: string
        source: input
        description: FK -> GroupAccount.id; set only for the institutional subscription that funds a group's seats, else null.
      - name: lifecycle_status
        type: enum
        source: system
        description: Primary state dimension.
        default: PENDING_ACTIVATION
        constraints: "PENDING_ACTIVATION | ACTIVE | PAUSED | CANCEL_SCHEDULED | CANCELLED | CANCELLED_NONPAY"
      - name: dunning_status
        type: enum
        source: system
        description: Payment-recovery state dimension, independent of lifecycle_status.
        default: CURRENT
        constraints: "CURRENT | RETRYING | RECOVERED | FAILED_FINAL"
      - name: print_fulfillment_status
        type: enum
        source: system
        description: Print delivery state dimension; NOT_APPLICABLE for non PRINT_DIGITAL plans.
        default: NOT_APPLICABLE
        constraints: "NOT_APPLICABLE | SCHEDULED | HELD | INTERRUPTED | STOPPED_AT_CYCLE_END | STOPPED"
      - name: cycle_index
        type: integer
        source: system
        description: 1-based index of the cycle currently being served.
        default: 1
      - name: cycle_start_on
        type: string
        source: system
        description: ISO date the current cycle began; set to the clock date at creation.
      - name: paid_through_on
        type: string
        source: system
        description: ISO date through which service is paid; advanced by cycle_days each time an invoice is PAID.
      - name: access_until
        type: string
        source: system
        description: ISO date after which entitlement lapses; set from paid_through_on when a cancellation is confirmed, else null.
      - name: next_cycle_price_cents
        type: integer
        source: computed
        description: Forward-looking preview_quote variant of cycle_base_price_resolution for cycle_index + 1.
        default: 0
      - name: locked_price_cents
        type: integer
        source: system
        description: Grandfathered price honoured while cycle_index <= grandfathered_until_cycle; null when not grandfathered.
      - name: grandfathered_until_cycle
        type: integer
        source: system
        description: Last cycle index covered by locked_price_cents; null when not grandfathered.
      - name: retention_discount_pct
        type: number
        source: system
        description: Accepted save-offer discount fraction applied to the cycle subtotal.
        default: 0
        constraints: "0..0.40"
      - name: retention_discount_cycles_remaining
        type: integer
        source: system
        description: Remaining cycles the retention discount applies to; decremented once per generated invoice.
        default: 0
      - name: pending_credit_cents
        type: integer
        source: computed
        description: "Sum of Hold.credit_cents over holds on this subscription with status IN {SCHEDULED, ACTIVE, COMPLETED} and credit_applied == false."
        default: 0
      - name: lifetime_credit_cents
        type: integer
        source: computed
        description: Sum of Hold.credit_cents over holds with credit_applied == true; never decreases.
        default: 0
      - name: dunning_first_failed_on
        type: string
        source: system
        description: ISO date of the first failed attempt of the current dunning episode; null when dunning_status == CURRENT.
      - name: next_retry_on
        type: string
        source: system
        description: Earliest ISO date a further payment attempt may be recorded; null outside a dunning episode.
      - name: payment_attempt_count
        type: integer
        source: computed
        description: Count of PaymentAttempt rows on the open dunning episode's invoice.
        default: 0
      - name: max_payment_attempts
        type: integer
        source: computed
        description: "DUNNING_MAX_ATTEMPTS, plus CARD_UPDATER_BONUS_ATTEMPTS when reader.card_updater_status == UPDATED."
        default: 4
      - name: vacation_days_used_365
        type: integer
        source: computed
        description: "Sum of (end_date - start_date + 1) over VACATION_DELIVERY holds with status IN {SCHEDULED, ACTIVE, COMPLETED} whose start_date >= clock_date - 365 days."
        default: 0
      - name: tenure_cycles
        type: integer
        source: computed
        description: Number of PAID invoices on this subscription; input to the TENURE_12_CYCLES grandfather policy.
        default: 0
      - name: cancel_effective_on
        type: string
        source: system
        description: ISO date the confirmed cancellation takes effect (equals paid_through_on at confirmation); null otherwise.

  - name: Invoice
    parent: Subscription
    common_fields: true
    fields:
      - name: subscription_id
        type: string
        source: system
        description: FK -> Subscription.id; the billed subscription.
      - name: cycle_index
        type: integer
        source: system
        description: Cycle this invoice bills.
        constraints: unique per (subscription_id, cycle_index)
      - name: status
        type: enum
        source: system
        description: Invoice payment state.
        default: OPEN
        constraints: "OPEN | PAID | PAST_DUE | WRITTEN_OFF | VOID"
      - name: price_source
        type: enum
        source: computed
        description: Which rung of the price ladder produced base_line_cents.
        constraints: "INTRO | STEP_UP | STANDARD | GRANDFATHERED | PRORATED_SEGMENTS"
      - name: base_line_cents
        type: integer
        source: computed
        description: Cycle base charge from cycle_base_price_resolution (billed_amount variant).
        default: 0
      - name: seat_line_cents
        type: integer
        source: computed
        description: Sum of per-seat prorated lines from seat_charge_assembly; 0 for non-institutional subscriptions.
        default: 0
      - name: discount_line_cents
        type: integer
        source: computed
        description: Retention discount deducted, computed from the pre-credit subtotal.
        default: 0
      - name: credit_line_cents
        type: integer
        source: computed
        description: Sum of unapplied COMPLETED hold credits swept onto this invoice.
        default: 0
      - name: total_cents
        type: integer
        source: computed
        description: "max(0, subtotal - discount_line_cents - credit_line_cents) per invoice_total_assembly."
        default: 0
      - name: due_on
        type: string
        source: system
        description: ISO date the invoice is due (generation date).
      - name: paid_on
        type: string
        source: system
        description: ISO date the invoice reached PAID; null otherwise.

  - name: PaymentAttempt
    parent: Invoice
    common_fields: false
    fields:
      - name: invoice_id
        type: string
        source: system
        description: FK -> Invoice.id; the invoice this attempt charged.
      - name: attempt_no
        type: integer
        source: computed
        description: 1-based ordinal of this attempt on the invoice.
      - name: outcome
        type: enum
        source: input
        description: Processor result reported for this attempt.
        constraints: "SUCCEEDED | SOFT_DECLINE | HARD_DECLINE"
      - name: amount_cents
        type: integer
        source: input
        description: Amount tendered in cents; MUST equal the invoice's total_cents (no partial tenders).
        constraints: ">= 0"
      - name: decline_code
        type: string
        source: input
        description: Processor decline reason; null on SUCCEEDED.
        constraints: "1-40 chars when present"
      - name: is_final
        type: boolean
        source: computed
        description: "True when outcome == HARD_DECLINE, or outcome == SOFT_DECLINE and attempt_no >= subscription.max_payment_attempts."
        default: false
      - name: attempted_on
        type: string
        source: system
        description: ISO date of the attempt (logical clock date).
      - name: card_last4_snapshot
        type: string
        source: system
        description: Reader card_last4 at attempt time; null when no card on file.

  - name: ReaderEvent
    parent: Reader
    common_fields: false
    fields:
      - name: reader_id
        type: string
        source: system
        description: FK -> Reader.id; the reader this signal belongs to.
      - name: article_id
        type: string
        source: system
        description: FK -> Article.id; set only for ARTICLE_VIEW_GRANTED / ARTICLE_VIEW_BLOCKED events, else null.
      - name: applied_rule_id
        type: string
        source: computed
        description: FK -> PaywallRule.id; the rule the selector picked, null when the selector pool was empty or an article-level override decided.
      - name: event_type
        type: enum
        source: input
        description: Signal class; ARTICLE_VIEW_* and PRICE_INCREASE_NOTICE are system-only.
        constraints: "ARTICLE_VIEW_GRANTED | ARTICLE_VIEW_BLOCKED | NEWSLETTER_OPEN | APP_OPEN | COMMENT_POST | INTERVENTION_EDITORIAL | INTERVENTION_PRODUCT | PRICE_INCREASE_NOTICE"
      - name: decision
        type: enum
        source: computed
        description: Paywall verdict; null for non ARTICLE_VIEW_* events.
        constraints: "GRANTED_FREE | GRANTED_ENTITLED | GRANTED_METERED | BLOCKED_REGISTRATION | BLOCKED_METER | BLOCKED_PAYWALL"
      - name: meter_index
        type: integer
        source: computed
        description: 1-based position of the article inside metered_article_ids after this decision; null when the meter was not consulted.
      - name: effective_allowance
        type: integer
        source: computed
        description: Allowance actually applied by paywall_access_decision; null when the meter was not consulted.
      - name: weight
        type: number
        source: computed
        description: Engagement weight of this event class; 0 for ARTICLE_VIEW_BLOCKED, INTERVENTION_* and PRICE_INCREASE_NOTICE.
        default: 0
      - name: occurred_at
        type: datetime
        source: input
        description: Instant the signal occurred; defaults to the logical clock. Backfill (past instants) is accepted only from SubscriptionOpsAgent.

  - name: CancellationRequest
    parent: Subscription
    common_fields: true
    fields:
      - name: subscription_id
        type: string
        source: system
        description: FK -> Subscription.id; the subscription the reader asked to cancel.
      - name: status
        type: enum
        source: system
        description: Regulated cancellation-flow state.
        default: INITIATED
        constraints: "INITIATED | SAVE_OFFER_PRESENTED | SAVE_OFFER_ACCEPTED | CONFIRMED | COMPLETED | ABANDONED"
      - name: reason_code
        type: enum
        source: input
        description: Reader-stated cancellation reason.
        constraints: "PRICE | CONTENT | TECHNICAL | LIFE_CHANGE | OTHER"
      - name: save_offer_count
        type: integer
        source: computed
        description: Number of SaveOffer rows on this request; capped by MAX_SAVE_OFFERS_PER_REQUEST.
        default: 0
      - name: projected_engagement_score
        type: number
        source: computed
        description: cohort_normalized variant of engagement_score frozen at request creation, 2 decimals.
        default: 0.00
      - name: eligible_save_offer_tier
        type: enum
        source: computed
        description: "Tier from projected_engagement_score: RICH when >= 20, STANDARD when >= 8, MINIMAL below 8."
        constraints: "RICH | STANDARD | MINIMAL"
      - name: confirmed_on
        type: string
        source: system
        description: ISO date the reader confirmed the cancellation; null until CONFIRMED.
      - name: effective_on
        type: string
        source: system
        description: ISO date service ends (subscription.paid_through_on at confirmation); null until CONFIRMED.
      - name: retained
        type: boolean
        source: computed
        description: True once status == SAVE_OFFER_ACCEPTED.
        default: false

  - name: SaveOffer
    parent: CancellationRequest
    common_fields: true
    fields:
      - name: cancellation_request_id
        type: string
        source: system
        description: FK -> CancellationRequest.id; the flow this offer was presented in.
      - name: offer_type
        type: enum
        source: input
        description: Retention instrument presented to the reader.
        constraints: "RETENTION_DISCOUNT | PAUSE | DOWNGRADE"
      - name: discount_pct
        type: number
        source: input
        description: Discount fraction for RETENTION_DISCOUNT / DOWNGRADE offers.
        default: 0
        constraints: "0..0.40; required and > 0 for RETENTION_DISCOUNT"
      - name: duration_cycles
        type: integer
        source: input
        description: Number of cycles the accepted discount applies to.
        default: 0
        constraints: "1..12 for RETENTION_DISCOUNT / DOWNGRADE"
      - name: pause_days
        type: integer
        source: input
        description: Length of the PAUSE_BILLING hold created when a PAUSE offer is accepted.
        default: 0
        constraints: "1..90; required for PAUSE"
      - name: status
        type: enum
        source: system
        description: Offer decision state.
        default: PRESENTED
        constraints: "PRESENTED | ACCEPTED | DECLINED | EXPIRED"
      - name: presented_on
        type: string
        source: system
        description: ISO date the offer was presented.
      - name: decided_on
        type: string
        source: system
        description: ISO date the reader accepted or declined; null while PRESENTED.

  - name: Hold
    parent: Subscription
    common_fields: true
    fields:
      - name: subscription_id
        type: string
        source: system
        description: FK -> Subscription.id; the subscription whose service window is occupied.
      - name: hold_type
        type: enum
        source: input
        description: Semantics of the occupation; each type has its own overlap and credit rules.
        constraints: "PAUSE_BILLING | VACATION_DELIVERY | DELIVERY_INTERRUPTION"
      - name: start_date
        type: string
        source: input
        description: ISO first day of the closed occupation interval.
      - name: end_date
        type: string
        source: input
        description: ISO last day of the closed occupation interval (inclusive).
        constraints: ">= start_date"
      - name: status
        type: enum
        source: system
        description: Hold lifecycle.
        default: SCHEDULED
        constraints: "SCHEDULED | ACTIVE | COMPLETED | RELEASED"
      - name: delivery_days_credited
        type: integer
        source: computed
        description: Count of dates d in [start_date, end_date] whose weekday is in plan.print_delivery_days.
        default: 0
      - name: credit_cents
        type: integer
        source: computed
        description: "delivery_days_credited * daily_print_rate_cents; 0 for PAUSE_BILLING."
        default: 0
      - name: credit_applied
        type: boolean
        source: system
        description: True once this hold's credit has been swept onto an invoice.
        default: false
      - name: credit_applied_cycle_index
        type: integer
        source: system
        description: cycle_index of the invoice that absorbed the credit; null while credit_applied == false.

  - name: GroupAccount
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: Institution name.
        constraints: 1-160 chars
      - name: admin_email
        type: string
        source: input
        description: Institutional administrator contact; an opaque credential, not a Reader row.
      - name: allowed_email_domain
        type: string
        source: input
        description: Email domain a reader must carry to claim a seat, e.g. "univ.edu".
        constraints: lowercase host, 3-80 chars
      - name: seat_capacity
        type: integer
        source: input
        description: Maximum number of concurrently occupied seats.
        constraints: "1..10000"
      - name: offer_plan_id
        type: string
        source: input
        description: FK -> OfferPlan.id; must be an INSTITUTIONAL_SEAT plan.
      - name: status
        type: enum
        source: system
        description: Group state; SUSPENDED when the funding subscription is non-paying.
        default: ACTIVE
        constraints: "ACTIVE | SUSPENDED"
      - name: seats_assigned_count
        type: integer
        source: computed
        description: "Peak concurrent occupancy of Seat rows with status IN {INVITED, ACTIVE} over their half-open intervals (group_seat_concurrency max_concurrent), NOT the raw row count - three staggered seats can occupy at most two slots at once."
        default: 0
      - name: seats_available_count
        type: integer
        source: computed
        description: "seat_capacity - seats_assigned_count; never negative and never stale (admission guarantees seats_assigned_count <= seat_capacity)."
        default: 0

  - name: Seat
    parent: GroupAccount
    common_fields: true
    fields:
      - name: group_account_id
        type: string
        source: system
        description: FK -> GroupAccount.id; the institution holding the seat.
      - name: reader_id
        type: string
        source: input
        description: FK -> Reader.id; the reader invited to occupy the seat.
      - name: status
        type: enum
        source: system
        description: Seat lifecycle.
        default: INVITED
        constraints: "INVITED | ACTIVE | RECLAIMED | EXPIRED"
      - name: starts_on
        type: string
        source: input
        description: ISO first day of the half-open occupancy interval [starts_on, ends_on).
      - name: ends_on
        type: string
        source: input
        description: ISO exclusive end of the occupancy interval; null means open-ended (treated as the cycle end when prorating).
        constraints: "> starts_on when present"
      - name: invited_on
        type: string
        source: system
        description: ISO date the invitation was issued (clock date).
      - name: invite_expires_on
        type: string
        source: system
        description: "invited_on + SEAT_INVITE_EXPIRY_DAYS; the EXPIRY_ONLY billing pass expires unclaimed invites on/after this date."
      - name: claimed_on
        type: string
        source: system
        description: ISO date the reader authenticated and activated the seat; null while INVITED.

state_machines:
  # ---------------------------------------------------------------- OfferPlan
  - entity: OfferPlan
    initial_state: DRAFT                     # status dimension
    terminal_states: []
    transitions:
      - from: DRAFT
        to: ACTIVE
        trigger: "POST /paywall/offer-plans/{id}/activate"
        actor: RevenueManager
        preconditions:
          - "status == DRAFT"
          - "step_up_schedule passes the monotonicity rule (see validations priority 36)"
        side_effects:
          - "status = ACTIVE"
          - "increments OfferPlan.version by 1"
        note: "Plans are never re-opened or closed; ACTIVE is absorbing for the status dimension."

  - entity: OfferPlan
    initial_state: NONE                      # price_change_state dimension (parallel to status)
    terminal_states: [APPLIED]
    transitions:
      - from: NONE
        to: SCHEDULED
        trigger: "POST /paywall/offer-plans/{id}/price-change"
        actor: RevenueManager
        preconditions:
          - "status == ACTIVE"
          - "price_change_state == NONE"
          - "pending_price_cents > standard_price_cents"
          - "pending_effective_on >= clock_date + 1 day"
          - "expected_offer_plan_version == OfferPlan.version"
        side_effects:
          - "pending_price_cents, pending_effective_on, grandfather_policy persisted"
          - "price_change_state = SCHEDULED"
          - "for every Subscription on this plan with lifecycle_status IN {PENDING_ACTIVATION, ACTIVE, PAUSED}: recompute next_cycle_price_cents via cycle_base_price_resolution/preview_quote (forward-looking: a SCHEDULED change already shows up in the preview once pending_effective_on <= the next cycle start)"
          - "increments OfferPlan.version by 1"
      - from: SCHEDULED
        to: NOTICE_SENT
        trigger: "POST /paywall/offer-plans/{id}/price-change/notices"
        actor: ComplianceOfficer
        preconditions:
          - "price_change_state == SCHEDULED"
          - "pending_effective_on - clock_date >= PRICE_NOTICE_WINDOW_DAYS (30)"
        side_effects:
          - "notice_sent_on = clock_date"
          - "price_change_state = NOTICE_SENT"
          - "creates one ReaderEvent{event_type: PRICE_INCREASE_NOTICE, weight: 0} per Reader holding a Subscription on this plan with lifecycle_status IN {PENDING_ACTIVATION, ACTIVE, PAUSED, CANCEL_SCHEDULED}"
          - "increments OfferPlan.version by 1"
      - from: NOTICE_SENT
        to: APPLIED
        trigger: "POST /paywall/offer-plans/{id}/price-change/apply"
        actor: ComplianceOfficer
        preconditions:
          - "price_change_state == NOTICE_SENT"
          - "clock_date >= pending_effective_on"
        side_effects:
          - "standard_price_cents = pending_price_cents; price_change_state = APPLIED"
          - "CASCADE hop 1 -> hop 2: for every Subscription on this plan with lifecycle_status IN {PENDING_ACTIVATION, ACTIVE, PAUSED, CANCEL_SCHEDULED}, grandfathering is resolved per grandfather_policy: ALL_EXISTING grandfathers every subscription created on or before notice_sent_on; TENURE_12_CYCLES grandfathers those with tenure_cycles >= GRANDFATHER_TENURE_CYCLES (12); NONE grandfathers none. Grandfathered rows get locked_price_cents = the pre-change standard price and grandfathered_until_cycle = cycle_index + GRANDFATHER_LOCK_CYCLES (12)"
          - "CASCADE hop 2 -> hop 3: each subscription mutated in hop 2 recomputes next_cycle_price_cents (preview_quote) from its new locked/standard basis and bumps its own version"
          - "increments OfferPlan.version by 1"
        note: "Segregation of duties: the RevenueManager who scheduled the change can neither send notices nor apply it."

  # ------------------------------------------------- Subscription (dimension 1)
  - entity: Subscription
    initial_state: PENDING_ACTIVATION        # lifecycle_status dimension
    terminal_states: [CANCELLED, CANCELLED_NONPAY]
    transitions:
      - from: PENDING_ACTIVATION
        to: ACTIVE
        trigger: "POST /paywall/invoices/{id}/payment-attempts with outcome == SUCCEEDED on the cycle-1 invoice"
        actor: SubscriptionOpsAgent
        preconditions:
          - "Invoice.status == OPEN and Invoice.cycle_index == 1"
          - "Invoice.subscription_id == this subscription"
        side_effects:
          - "Invoice.status = PAID, Invoice.paid_on = clock_date"
          - "paid_through_on = cycle_start_on + plan.cycle_days"
          - "print_fulfillment_status NOT_APPLICABLE -> SCHEDULED when plan.bundle_type == PRINT_DIGITAL"
          - "tenure_cycles recomputed (count of PAID invoices)"
          - "Reader.entitlement_source recomputed -> SUBSCRIPTION"
          - "next_cycle_price_cents recomputed via cycle_base_price_resolution/preview_quote"
      - from: ACTIVE
        to: PAUSED
        trigger: "system: HOLDS pass of POST /paywall/billing-runs (scope FULL | HOLDS_ONLY) when a PAUSE_BILLING Hold reaches start_date"
        actor: system
        preconditions:
          - "Hold.hold_type == PAUSE_BILLING and Hold.status == SCHEDULED and Hold.start_date <= clock_date"
          - "lifecycle_status == ACTIVE"
        side_effects:
          - "Hold.status = ACTIVE"
          - "lifecycle_status = PAUSED"
          - "Reader.entitlement_source recomputed (PAUSED is NOT an entitling status, so a reader with no seat drops to NONE)"
      - from: PAUSED
        to: ACTIVE
        trigger: "system: HOLDS pass of POST /paywall/billing-runs when clock_date > Hold.end_date, or POST /paywall/holds/{id}/release"
        actor: system
        preconditions:
          - "the PAUSE_BILLING Hold that caused the pause is the only ACTIVE PAUSE_BILLING hold on this subscription"
        side_effects:
          - "Hold.status = COMPLETED (billing-run path) or RELEASED (release path)"
          - "lifecycle_status = ACTIVE"
          - "cycle_start_on shifted forward by the number of paused days, so paused days are never billed"
          - "Reader.entitlement_source recomputed -> SUBSCRIPTION"
        note: "This is the lifecycle cycle ACTIVE -> PAUSED -> ACTIVE; a subscription may pause repeatedly."
      - from: ACTIVE
        to: CANCEL_SCHEDULED
        trigger: "POST /paywall/cancellation-requests/{id}/confirm"
        actor: Reader
        preconditions:
          - "CancellationRequest.status IN {INITIATED, SAVE_OFFER_PRESENTED}"
          - "lifecycle_status == ACTIVE"
        side_effects:
          - "CASCADE hop 1: CancellationRequest.status = CONFIRMED, confirmed_on = clock_date, effective_on = subscription.paid_through_on; any SaveOffer with status == PRESENTED on that request -> EXPIRED"
          - "CASCADE hop 1 -> hop 2: subscription lifecycle_status = CANCEL_SCHEDULED, access_until = paid_through_on, cancel_effective_on = paid_through_on, and print_fulfillment_status SCHEDULED|HELD|INTERRUPTED -> STOPPED_AT_CYCLE_END"
          - "CASCADE hop 2 -> hop 3: because print fulfilment is now stopping, every Hold on this subscription with status == SCHEDULED and start_date > access_until -> RELEASED (a hold can no longer be served after service ends)"
          - "CASCADE hop 3 -> hop 4: each hold released in hop 3 drops out of the pending_credit_cents input set, so Subscription.pending_credit_cents is recomputed downward by exactly the sum of those holds' credit_cents (lifetime_credit_cents unchanged)"
      - from: CANCEL_SCHEDULED
        to: CANCELLED
        trigger: "system: EXPIRY pass of POST /paywall/billing-runs (scope FULL | EXPIRY_ONLY) when clock_date > cancel_effective_on"
        actor: system
        preconditions:
          - "lifecycle_status == CANCEL_SCHEDULED and clock_date > cancel_effective_on"
        side_effects:
          - "lifecycle_status = CANCELLED"
          - "print_fulfillment_status STOPPED_AT_CYCLE_END -> STOPPED"
          - "linked CancellationRequest (CancellationRequest.subscription_id == this subscription, status == CONFIRMED) -> COMPLETED"
          - "Reader.entitlement_source recomputed -> NONE unless an ACTIVE Seat entitles the reader"
      - from: ACTIVE
        to: CANCELLED_NONPAY
        trigger: "POST /paywall/invoices/{id}/payment-attempts whose PaymentAttempt.is_final == true"
        actor: SubscriptionOpsAgent
        preconditions:
          - "Invoice.status IN {OPEN, PAST_DUE}"
          - "PaymentAttempt.is_final == true"
        side_effects:
          - "CASCADE hop 1: PaymentAttempt persisted with is_final = true"
          - "CASCADE hop 1 -> hop 2: Invoice.status -> WRITTEN_OFF"
          - "CASCADE hop 2 -> hop 3: the write-off closes the dunning episode unsuccessfully, so dunning_status -> FAILED_FINAL, next_retry_on = null, and lifecycle_status -> CANCELLED_NONPAY with access_until = clock_date"
          - "CASCADE hop 3 -> hop 4: the terminal subscription releases its service occupations and seats - every Hold with status IN {SCHEDULED, ACTIVE} -> RELEASED; when group_account_id is set, GroupAccount.status -> SUSPENDED and every Seat under it with status IN {INVITED, ACTIVE} -> RECLAIMED with ends_on = clock_date"
          - "CASCADE hop 4 -> hop 5: the released holds leave the pending_credit_cents input set (pending_credit_cents -> 0) and the reclaimed seats leave seats_assigned_count (GroupAccount.seats_assigned_count / seats_available_count recomputed); Reader.entitlement_source -> NONE and Reader.churn_risk_band recomputed -> SEVERE (dunning override)"

  # ------------------------------------------------- Subscription (dimension 2)
  - entity: Subscription
    initial_state: CURRENT                   # dunning_status dimension, independent of lifecycle
    terminal_states: [FAILED_FINAL]
    transitions:
      - from: CURRENT
        to: RETRYING
        trigger: "POST /paywall/invoices/{id}/payment-attempts with outcome == SOFT_DECLINE and is_final == false"
        actor: SubscriptionOpsAgent
        preconditions:
          - "Invoice.status IN {OPEN, PAST_DUE}"
          - "clock_date >= next_retry_on when next_retry_on is not null"
        side_effects:
          - "Invoice.status -> PAST_DUE"
          - "dunning_first_failed_on = clock_date on the first failure of the episode"
          - "next_retry_on = dunning_first_failed_on + DUNNING_RETRY_OFFSET_DAYS[attempt_no - 1]"
          - "Reader.card_updater_status NOT_APPLICABLE -> PENDING when reader.card_updater_registered == true and reader.card_status == EXPIRED, else -> UNAVAILABLE"
          - "Reader.churn_risk_band recomputed -> SEVERE (dunning override in churn_risk_band)"
      - from: RETRYING
        to: RETRYING
        trigger: "POST /paywall/invoices/{id}/payment-attempts with outcome == SOFT_DECLINE and is_final == false (subsequent retries)"
        actor: SubscriptionOpsAgent
        preconditions:
          - "clock_date >= next_retry_on"
          - "attempt_no < max_payment_attempts"
        side_effects:
          - "next_retry_on = dunning_first_failed_on + DUNNING_RETRY_OFFSET_DAYS[attempt_no - 1]"
          - "payment_attempt_count recomputed"
        note: "Self-loop: the retry ladder is walked without leaving RETRYING until success or is_final."
      - from: RETRYING
        to: RECOVERED
        trigger: "POST /paywall/invoices/{id}/payment-attempts with outcome == SUCCEEDED"
        actor: SubscriptionOpsAgent
        preconditions:
          - "Invoice.status == PAST_DUE"
        side_effects:
          - "Invoice.status = PAID, paid_on = clock_date"
          - "dunning_status = RECOVERED, next_retry_on = null"
          - "paid_through_on advanced by plan.cycle_days; tenure_cycles recomputed"
          - "Reader.churn_risk_band recomputed from engagement_score (the dunning override is lifted)"
      - from: RECOVERED
        to: CURRENT
        trigger: "system: DUNNING pass of POST /paywall/billing-runs (scope FULL | DUNNING_ONLY)"
        actor: system
        preconditions:
          - "dunning_status == RECOVERED and no Invoice on this subscription has status == PAST_DUE"
        side_effects:
          - "dunning_status = CURRENT, dunning_first_failed_on = null"
        note: "Closes the dunning cycle CURRENT -> RETRYING -> RECOVERED -> CURRENT."
      - from: RETRYING
        to: FAILED_FINAL
        trigger: "POST /paywall/invoices/{id}/payment-attempts whose PaymentAttempt.is_final == true"
        actor: SubscriptionOpsAgent
        preconditions:
          - "outcome == HARD_DECLINE, or outcome == SOFT_DECLINE with attempt_no >= max_payment_attempts"
        side_effects:
          - "see the CANCELLED_NONPAY cascade on the lifecycle dimension (hops 1-5)"

  # ------------------------------------------------- Subscription (dimension 3)
  - entity: Subscription
    initial_state: NOT_APPLICABLE            # print_fulfillment_status dimension
    terminal_states: [STOPPED]
    transitions:
      - from: NOT_APPLICABLE
        to: SCHEDULED
        trigger: "POST /paywall/invoices/{id}/payment-attempts with outcome == SUCCEEDED on the cycle-1 invoice of a PRINT_DIGITAL plan"
        actor: SubscriptionOpsAgent
        preconditions:
          - "plan.bundle_type == PRINT_DIGITAL"
        side_effects:
          - "print_fulfillment_status = SCHEDULED"
      - from: SCHEDULED
        to: HELD
        trigger: "system: HOLDS pass of POST /paywall/billing-runs when a VACATION_DELIVERY Hold reaches start_date"
        actor: system
        preconditions:
          - "Hold.hold_type == VACATION_DELIVERY, status == SCHEDULED, start_date <= clock_date"
        side_effects:
          - "Hold.status = ACTIVE"
          - "print_fulfillment_status = HELD"
      - from: SCHEDULED
        to: INTERRUPTED
        trigger: "POST /paywall/subscriptions/{id}/holds with hold_type == DELIVERY_INTERRUPTION and start_date <= clock_date"
        actor: SubscriptionOpsAgent
        preconditions:
          - "print_fulfillment_status == SCHEDULED"
        side_effects:
          - "Hold.status = ACTIVE (publisher-caused interruptions start immediately)"
          - "print_fulfillment_status = INTERRUPTED"
          - "pending_credit_cents increased by Hold.credit_cents"
      - from: HELD
        to: SCHEDULED
        trigger: "system: HOLDS pass of POST /paywall/billing-runs when clock_date > Hold.end_date, or POST /paywall/holds/{id}/release"
        actor: system
        preconditions:
          - "no other Hold with hold_type IN {VACATION_DELIVERY, DELIVERY_INTERRUPTION} is ACTIVE on this subscription"
        side_effects:
          - "Hold.status = COMPLETED (run path, credit retained) or RELEASED (release path, credit reversed)"
          - "print_fulfillment_status = SCHEDULED"
      - from: INTERRUPTED
        to: SCHEDULED
        trigger: "system: HOLDS pass of POST /paywall/billing-runs when clock_date > Hold.end_date, or POST /paywall/holds/{id}/release"
        actor: system
        preconditions:
          - "no other Hold with hold_type IN {VACATION_DELIVERY, DELIVERY_INTERRUPTION} is ACTIVE on this subscription"
        side_effects:
          - "Hold.status = COMPLETED or RELEASED"
          - "print_fulfillment_status = SCHEDULED"
      - from: SCHEDULED
        to: STOPPED_AT_CYCLE_END
        trigger: "POST /paywall/cancellation-requests/{id}/confirm"
        actor: Reader
        preconditions:
          - "print_fulfillment_status IN {SCHEDULED, HELD, INTERRUPTED}"
        side_effects:
          - "print_fulfillment_status = STOPPED_AT_CYCLE_END (see the confirm cascade, hops 2-4)"
      - from: STOPPED_AT_CYCLE_END
        to: STOPPED
        trigger: "system: EXPIRY pass of POST /paywall/billing-runs when clock_date > cancel_effective_on"
        actor: system
        preconditions:
          - "lifecycle_status transitions CANCEL_SCHEDULED -> CANCELLED in the same pass"
        side_effects:
          - "print_fulfillment_status = STOPPED"

  # -------------------------------------------------------------- Invoice
  - entity: Invoice
    initial_state: OPEN
    terminal_states: [PAID, WRITTEN_OFF, VOID]
    transitions:
      - from: OPEN
        to: VOID
        trigger: "system: BILLING pass of POST /paywall/billing-runs, at generation time"
        actor: system
        preconditions:
          - "total_cents == 0 after invoice_total_assembly"
        side_effects:
          - "status = VOID at creation; paid_through_on advanced by plan.cycle_days without any payment attempt"
          - "credits swept onto this invoice are marked credit_applied = true"
      - from: OPEN
        to: PAID
        trigger: "POST /paywall/invoices/{id}/payment-attempts with outcome == SUCCEEDED"
        actor: SubscriptionOpsAgent
        preconditions:
          - "status == OPEN"
        side_effects:
          - "paid_on = clock_date; subscription.paid_through_on advanced; tenure_cycles recomputed"
      - from: OPEN
        to: PAST_DUE
        trigger: "POST /paywall/invoices/{id}/payment-attempts with outcome == SOFT_DECLINE and is_final == false"
        actor: SubscriptionOpsAgent
        preconditions:
          - "status == OPEN"
        side_effects:
          - "subscription.dunning_status -> RETRYING (see dimension 2)"
      - from: PAST_DUE
        to: PAID
        trigger: "POST /paywall/invoices/{id}/payment-attempts with outcome == SUCCEEDED"
        actor: SubscriptionOpsAgent
        preconditions:
          - "status == PAST_DUE and clock_date >= subscription.next_retry_on"
        side_effects:
          - "subscription.dunning_status -> RECOVERED"
      - from: PAST_DUE
        to: WRITTEN_OFF
        trigger: "POST /paywall/invoices/{id}/payment-attempts whose PaymentAttempt.is_final == true"
        actor: SubscriptionOpsAgent
        preconditions:
          - "status IN {OPEN, PAST_DUE}"
        side_effects:
          - "subscription lifecycle -> CANCELLED_NONPAY (cascade hops 2-5)"

  # ---------------------------------------------------- CancellationRequest
  - entity: CancellationRequest
    initial_state: INITIATED
    terminal_states: [COMPLETED, ABANDONED]
    transitions:
      - from: INITIATED
        to: SAVE_OFFER_PRESENTED
        trigger: "POST /paywall/cancellation-requests/{id}/save-offers"
        actor: SubscriptionOpsAgent
        preconditions:
          - "status == INITIATED"
          - "save_offer_count < MAX_SAVE_OFFERS_PER_REQUEST (1)"
          - "SaveOffer.discount_pct <= SAVE_OFFER_DISCOUNT_CAP_PCT (0.40)"
        side_effects:
          - "SaveOffer created with status = PRESENTED, presented_on = clock_date"
          - "status = SAVE_OFFER_PRESENTED; save_offer_count recomputed"
      - from: SAVE_OFFER_PRESENTED
        to: SAVE_OFFER_ACCEPTED
        trigger: "POST /paywall/save-offers/{id}/decision with decision == ACCEPTED"
        actor: Reader
        preconditions:
          - "SaveOffer.status == PRESENTED"
          - "subscription.lifecycle_status == ACTIVE"
        side_effects:
          - "BRANCH A (retention): SaveOffer.status = ACCEPTED, decided_on = clock_date; status = SAVE_OFFER_ACCEPTED; retained = true"
          - "BRANCH A, offer_type == RETENTION_DISCOUNT or DOWNGRADE: subscription.retention_discount_pct = SaveOffer.discount_pct and retention_discount_cycles_remaining = SaveOffer.duration_cycles; next_cycle_price_cents recomputed"
          - "BRANCH A, offer_type == PAUSE: a Hold{hold_type: PAUSE_BILLING, start_date: subscription.paid_through_on, end_date: paid_through_on + pause_days - 1, status: SCHEDULED, credit_cents: 0} is created; next_cycle_price_cents recomputed"
          - "subscription.lifecycle_status stays ACTIVE (nothing is cancelled on this branch)"
      - from: SAVE_OFFER_PRESENTED
        to: INITIATED
        trigger: "POST /paywall/save-offers/{id}/decision with decision == DECLINED"
        actor: Reader
        preconditions:
          - "SaveOffer.status == PRESENTED"
        side_effects:
          - "BRANCH B (decline): SaveOffer.status = DECLINED, decided_on = clock_date"
          - "status returns to INITIATED so the reader can confirm; save_offer_count stays 1, so no second offer may ever be presented (regulatory single-offer rule)"
        note: "Cycle SAVE_OFFER_PRESENTED -> INITIATED; the fork rejoins the cancel path here."
      - from: INITIATED
        to: CONFIRMED
        trigger: "POST /paywall/cancellation-requests/{id}/confirm"
        actor: Reader
        preconditions:
          - "status IN {INITIATED, SAVE_OFFER_PRESENTED}"
          - "subscription.lifecycle_status == ACTIVE"
        side_effects:
          - "BRANCH C (cancel): see the CANCEL_SCHEDULED cascade (hops 1-4). Confirm is reachable directly from INITIATED and from SAVE_OFFER_PRESENTED without deciding the offer - the regulated one-step exit."
      - from: SAVE_OFFER_PRESENTED
        to: CONFIRMED
        trigger: "POST /paywall/cancellation-requests/{id}/confirm"
        actor: Reader
        preconditions:
          - "status == SAVE_OFFER_PRESENTED"
        side_effects:
          - "the PRESENTED SaveOffer -> EXPIRED, then the CANCEL_SCHEDULED cascade (hops 1-4) runs"
      - from: CONFIRMED
        to: COMPLETED
        trigger: "system: EXPIRY pass of POST /paywall/billing-runs when clock_date > effective_on"
        actor: system
        preconditions:
          - "status == CONFIRMED and clock_date > effective_on"
        side_effects:
          - "status = COMPLETED; subscription lifecycle_status -> CANCELLED"
      - from: INITIATED
        to: ABANDONED
        trigger: "system: EXPIRY pass of POST /paywall/billing-runs when clock_date - created_at >= CANCELLATION_REQUEST_EXPIRY_DAYS (30)"
        actor: system
        preconditions:
          - "status IN {INITIATED, SAVE_OFFER_PRESENTED}"
        side_effects:
          - "status = ABANDONED; any PRESENTED SaveOffer -> EXPIRED; the subscription is untouched"

  # -------------------------------------------------------------- Hold
  - entity: Hold
    initial_state: SCHEDULED
    terminal_states: [COMPLETED, RELEASED]
    transitions:
      - from: SCHEDULED
        to: ACTIVE
        trigger: "POST /paywall/subscriptions/{id}/holds with start_date <= clock_date, or the HOLDS pass of POST /paywall/billing-runs"
        actor: system
        preconditions:
          - "subscription.lifecycle_status IN {ACTIVE, PAUSED}"
        side_effects:
          - "see the Subscription print/lifecycle dimensions for the paired transition"
      - from: ACTIVE
        to: COMPLETED
        trigger: "system: HOLDS pass of POST /paywall/billing-runs when clock_date > end_date"
        actor: system
        preconditions:
          - "status == ACTIVE and clock_date > end_date"
        side_effects:
          - "credit stays in pending_credit_cents until the next BILLING pass sweeps it onto an invoice"
      - from: SCHEDULED
        to: RELEASED
        trigger: "POST /paywall/holds/{id}/release"
        actor: SubscriptionOpsAgent
        preconditions:
          - "status IN {SCHEDULED, ACTIVE}"
          - "credit_applied == false"
        side_effects:
          - "status = RELEASED"
          - "COMPENSATION: subscription.pending_credit_cents recomputed downward by exactly this hold's credit_cents; lifetime_credit_cents unchanged"
          - "print_fulfillment_status HELD|INTERRUPTED -> SCHEDULED and lifecycle_status PAUSED -> ACTIVE when this hold was the ACTIVE one"
      - from: ACTIVE
        to: RELEASED
        trigger: "POST /paywall/holds/{id}/release"
        actor: SubscriptionOpsAgent
        preconditions:
          - "status == ACTIVE and credit_applied == false"
        side_effects:
          - "same compensation as SCHEDULED -> RELEASED"

  # -------------------------------------------------------------- Seat
  - entity: Seat
    initial_state: INVITED
    terminal_states: [RECLAIMED, EXPIRED]
    transitions:
      - from: INVITED
        to: ACTIVE
        trigger: "POST /paywall/seats/{id}/activate"
        actor: Reader
        preconditions:
          - "status == INVITED and clock_date <= invite_expires_on"
          - "Reader.email ends with '@' + GroupAccount.allowed_email_domain"
          - "the GroupAccount's funding Subscription (Subscription.group_account_id == GroupAccount.id) has lifecycle_status == ACTIVE and dunning_status != FAILED_FINAL"
        side_effects:
          - "status = ACTIVE, claimed_on = clock_date"
          - "Reader.entitlement_source recomputed -> SEAT when the reader has no entitling subscription"
      - from: INVITED
        to: RECLAIMED
        trigger: "POST /paywall/seats/{id}/reclaim"
        actor: GroupAdmin
        preconditions:
          - "status == INVITED (the institution revokes a pending invite before it is claimed)"
        side_effects:
          - "status = RECLAIMED, ends_on = clock_date"
          - "COMPENSATION: GroupAccount.seats_assigned_count and seats_available_count recomputed so that seat_capacity == seats_assigned_count + seats_available_count still holds"
          - "Reader.entitlement_source recomputed -> NONE unless a subscription entitles the reader"
      - from: ACTIVE
        to: RECLAIMED
        trigger: "POST /paywall/seats/{id}/reclaim"
        actor: GroupAdmin
        preconditions:
          - "status IN {INVITED, ACTIVE}"
        side_effects:
          - "status = RECLAIMED, ends_on = clock_date"
          - "COMPENSATION: GroupAccount.seats_assigned_count and seats_available_count recomputed so that seat_capacity == seats_assigned_count + seats_available_count still holds"
          - "Reader.entitlement_source recomputed -> NONE unless a subscription entitles the reader"
      - from: INVITED
        to: EXPIRED
        trigger: "system: EXPIRY pass of POST /paywall/billing-runs when clock_date > invite_expires_on"
        actor: system
        preconditions:
          - "status == INVITED and clock_date > invite_expires_on"
        side_effects:
          - "status = EXPIRED; GroupAccount.seats_assigned_count / seats_available_count recomputed"

concurrency_rules:
  - rule_id: subscription-create-stale-plan
    parent_entity: OfferPlan
    write_endpoint: "POST /paywall/subscriptions"
    occ_field: "expected_offer_plan_version"
    description: |
      Creating a Subscription against an OfferPlan whose version has advanced since
      the client last observed it is rejected. The plan's version advances whenever a
      price change is scheduled, notices are dispatched, the change is applied, or
      another subscription is created against the plan (active_subscription_count is a
      derived field on the plan), so a stale version means the client is subscribing on
      a price ladder it can no longer see.
    error_id: ERR_STALE_OFFER_PLAN_VERSION
    http_status: 412
  - rule_id: seat-assign-stale-group
    parent_entity: GroupAccount
    write_endpoint: "POST /paywall/group-accounts/{id}/seats"
    occ_field: "expected_group_account_version"
    description: |
      Assigning a Seat against a GroupAccount whose version has advanced since the
      administrator last read it is rejected. seats_assigned_count and seats_available_count
      are derived fields on the group, so any prior seat assignment, reclaim or expiry
      advances the version and invalidates the capacity picture the administrator based
      this assignment on.
    error_id: ERR_STALE_GROUP_ACCOUNT_VERSION
    http_status: 412

calculations:
  - name: paywall_rule_selection
    trigger: "Step 4 of paywall_access_decision, i.e. every POST /paywall/access-decisions on an Article with access_class == METERED"
    algorithm: selector_policy
    formula: |
      candidates = [ r for r in PaywallRule
                     if r.status == 'ACTIVE'
                     and r.content_type_match in (article.content_type, 'ANY')
                     and r.section_match in (article.section, 'ANY')
                     and r.propensity_band_match in (reader.propensity_band, 'ANY') ]
      # ranking: specificity first, then operator priority, then age
      sort key = ( -r.specificity_score, r.priority, r.created_at )   # ASC on the tuple
      selected  = candidates[0] if candidates else None
      if selected is None:                     # empty-pool fallback (NOT an error)
          action    = 'METER'
          allowance_base = SITE_DEFAULT_METER_ALLOWANCE
          applied_rule_id = null
      else:
          action    = selected.action
          allowance_base = selected.meter_allowance_override
                           if selected.meter_allowance_override is not null
                           else SITE_DEFAULT_METER_ALLOWANCE
          applied_rule_id = selected.id
    input_set: "PaywallRule rows with status == ACTIVE only; INACTIVE rules are excluded even when they match perfectly."
    constants:
      SITE_DEFAULT_METER_ALLOWANCE: 4
    precision: "integer allowance; specificity_score is an integer"
    variants: []
    note: "specificity_score = 100*(content_type_match != ANY) + 10*(section_match != ANY) + 1*(propensity_band_match != ANY). Tie-break chain is specificity DESC, priority ASC, created_at ASC - never id."

  - name: paywall_access_decision
    trigger: "POST /paywall/access-decisions"
    algorithm: threshold
    formula: |
      # 0. lazy meter period reset (also performed by the ENGAGEMENT pass of a billing run)
      if clock_date - reader.meter_period_started_on >= METER_PERIOD_DAYS:
          reader.metered_article_ids = []
          reader.metered_distinct_article_count = 0
          reader.meter_period_started_on = clock_date

      # 1..3 article-level and entitlement-level overrides, in this exact order
      if article.access_class == 'OPEN':            return GRANTED_FREE       # meter untouched
      if reader.entitlement_source != 'NONE':       return GRANTED_ENTITLED   # meter untouched
      if article.access_class == 'PREMIUM':         return BLOCKED_PAYWALL

      # 4. rule selection (paywall_rule_selection)
      action, allowance_base, applied_rule_id = paywall_rule_selection(reader, article)
      if action == 'ALLOW_FREE':                    return GRANTED_FREE
      if action == 'HARD_PAYWALL':                  return BLOCKED_PAYWALL
      if action == 'REGISTRATION_WALL' and not reader.is_registered:
                                                    return BLOCKED_REGISTRATION

      # 5. effective allowance: 3 inputs interacting non-linearly
      effective_allowance = max(METER_ALLOWANCE_FLOOR,
                                allowance_base + PROPENSITY_ALLOWANCE_DELTA[reader.propensity_band])

      # 6. registration wall for unregistered readers, checked BEFORE the meter
      if not reader.is_registered and reader.metered_distinct_article_count >= REGISTRATION_WALL_THRESHOLD:
          return BLOCKED_REGISTRATION

      # 7. re-reads are free: the meter counts DISTINCT articles
      if article.id in reader.metered_article_ids:
          return GRANTED_METERED with meter_index = index_of(article.id) + 1   # no increment

      # 8. the allowance boundary
      if reader.metered_distinct_article_count >= effective_allowance:
          return BLOCKED_METER
      reader.metered_article_ids.append(article.id)
      return GRANTED_METERED with meter_index = len(reader.metered_article_ids)
    input_set: "Only Article rows that exist; only the acting Reader's own meter state. Entitlement uses Subscription rows with lifecycle_status IN {ACTIVE, CANCEL_SCHEDULED} and dunning_status != FAILED_FINAL and (access_until is null or access_until >= clock_date), plus Seat rows with status == ACTIVE and starts_on <= clock_date < (ends_on or +inf). PAUSED and PENDING_ACTIVATION subscriptions do NOT entitle."
    constants:
      SITE_DEFAULT_METER_ALLOWANCE: 4
      METER_ALLOWANCE_FLOOR: 1
      METER_PERIOD_DAYS: 30
      REGISTRATION_WALL_THRESHOLD: 2
      PROPENSITY_ALLOWANCE_DELTA: { HIGH: -2, MEDIUM: 0, LOW: 2 }
    precision: "integer counts; comparisons are >= (an allowance of 4 grants exactly 4 distinct articles)"
    variants: []
    note: "Every call appends exactly one ReaderEvent: event_type ARTICLE_VIEW_GRANTED for GRANTED_*, ARTICLE_VIEW_BLOCKED for BLOCKED_*, carrying decision, meter_index, effective_allowance and applied_rule_id. GRANTED_* events recompute Reader.engagement_score and churn_risk_band; BLOCKED_* events carry weight 0 and leave the score unchanged."

  - name: cycle_base_price_resolution
    trigger: "Computed as Subscription.next_cycle_price_cents on every subscription mutation and on every OfferPlan price-change transition (preview_quote variant); computed as Invoice.base_line_cents by the BILLING pass of POST /paywall/billing-runs and by POST /paywall/subscriptions for cycle 1 (billed_amount variant)."
    algorithm: tiered_pricing
    formula: |
      def tier_price(plan, n, sub):                       # n = cycle index
          if sub.locked_price_cents is not null and n <= sub.grandfathered_until_cycle:
              return sub.locked_price_cents, 'GRANDFATHERED'
          if n <= plan.intro_cycles:
              return plan.intro_price_cents, 'INTRO'
          if n >= plan.standard_from_cycle:
              return plan.standard_price_cents, 'STANDARD'
          steps = [ s for s in plan.step_up_schedule if s.from_cycle <= n ]
          if steps:
              return max(steps, key=from_cycle).price_cents, 'STEP_UP'
          return plan.standard_price_cents, 'STANDARD'
    input_set: "One Subscription and its OfferPlan. Grandfathering is checked before every other rung. Only the plan's own step_up_schedule entries participate."
    constants:
      GRANDFATHER_LOCK_CYCLES: 12
      GRANDFATHER_TENURE_CYCLES: 12
    precision: "integer cents; no rounding at this stage"
    variants:
      - name: preview_quote
        when: "Written to Subscription.next_cycle_price_cents (forward-looking, before the cycle is billed)."
        difference: |
          Evaluates tier_price for n = cycle_index + 1 and, when the resolved rung is
          'STANDARD' and plan.price_change_state IN {SCHEDULED, NOTICE_SENT} and
          plan.pending_effective_on <= (cycle_start_on + (cycle_index + 1 - cycle_index) * plan.cycle_days),
          i.e. the next cycle's start date, it substitutes plan.pending_price_cents -
          a not-yet-applied increase is assumed to land. It then applies
          retention_discount_pct when retention_discount_cycles_remaining >= 1
          (round_half_up per line) and IGNORES all hold credits, because unrealised
          credits are not money yet.
      - name: billed_amount
        when: "Written to Invoice.base_line_cents when an invoice is generated (chronological, at run time)."
        difference: |
          Evaluates tier_price for n = the cycle actually being billed using only prices
          already APPLIED (a SCHEDULED or NOTICE_SENT change is invisible here), and
          prorates when plan.price_change_state == APPLIED with
          cycle_start_on < plan.pending_effective_on < cycle_start_on + plan.cycle_days:
          segment_a = round_half_up(old_price * days_before_effective / plan.cycle_days),
          segment_b = round_half_up(new_price * days_from_effective / plan.cycle_days),
          base_line_cents = segment_a + segment_b with price_source = 'PRORATED_SEGMENTS'
          (per-segment rounding, then sum - never sum-then-round). Realised credits are
          swept in by invoice_total_assembly.
    note: "The two variants deliberately disagree for the same subscription: preview_quote answers 'what will the reader be charged next time if nothing changes', billed_amount answers 'what did this cycle actually cost'."

  - name: seat_charge_assembly
    trigger: "BILLING pass of POST /paywall/billing-runs, for a Subscription whose group_account_id is not null; result stored as Invoice.seat_line_cents"
    algorithm: aggregation
    formula: |
      cycle_start = sub.cycle_start_on
      cycle_end   = cycle_start + plan.cycle_days            # exclusive
      lines = []
      for seat in sorted(Seat where group_account_id == sub.group_account_id
                         and status IN {ACTIVE, RECLAIMED}
                         and starts_on < cycle_end
                         and (ends_on is null or ends_on > cycle_start),
                         key = (starts_on ASC, created_at ASC)):
          occ_start = max(seat.starts_on, cycle_start)
          occ_end   = min(seat.ends_on or cycle_end, cycle_end)      # half-open
          active_days = (occ_end - occ_start).days                   # 0 when they coincide
          lines.append( round_half_up(plan.per_seat_price_cents * active_days / plan.cycle_days) )
      seat_line_cents = sum(lines)                                   # ROUND PER LINE, THEN SUM
    input_set: "Seat rows on the subscription's GroupAccount with status IN {ACTIVE, RECLAIMED} whose half-open occupancy [starts_on, ends_on) intersects the half-open cycle window; INVITED and EXPIRED seats are never billed."
    constants: {}
    precision: "each seat line is rounded to whole cents with ROUND_HALF_UP before summation; the sum is never re-rounded"
    variants: []
    note: "Rounding order is pinned and observable: 3 seats at per_seat_price_cents 400, 8 active days, cycle_days 30 give round_half_up(106.6667) = 107 per line and 321 in total, whereas sum-then-round would give 320."

  - name: invoice_total_assembly
    trigger: "Invoice creation: POST /paywall/subscriptions (cycle 1) and the BILLING pass of POST /paywall/billing-runs (cycle n > 1)"
    algorithm: waterfall_allocation
    formula: |
      # EVALUATION ORDER IS PINNED. The discount tier is keyed on the pre-credit
      # subtotal, so credits can never change the discount percentage even though
      # they reduce the amount the reader pays.
      1. base_line_cents  = cycle_base_price_resolution/billed_amount(sub, plan, n)
      2. seat_line_cents  = seat_charge_assembly(sub, plan)          # 0 when group_account_id is null
      3. subtotal_cents   = base_line_cents + seat_line_cents
      4. pct = sub.retention_discount_pct if sub.retention_discount_cycles_remaining >= 1 else 0
         if pct > 0 and subtotal_cents >= HIGH_VALUE_SUBTOTAL_CENTS:
             pct = min(pct + HIGH_VALUE_UPLIFT_PCT, SAVE_OFFER_DISCOUNT_CAP_PCT)
      5. discount_line_cents = round_half_up(subtotal_cents * pct)
      6. credit_line_cents   = sum(h.credit_cents for h in Hold
                                   where h.subscription_id == sub.id
                                     and h.status == 'COMPLETED'
                                     and h.credit_applied == false
                                   ordered by h.end_date ASC, h.created_at ASC)
      7. total_cents = max(0, subtotal_cents - discount_line_cents - credit_line_cents)
      8. status = 'VOID' if total_cents == 0 else 'OPEN'
         each hold in step 6 -> credit_applied = true, credit_applied_cycle_index = n
         retention_discount_cycles_remaining -= 1 when pct > 0
    input_set: "Only COMPLETED holds with credit_applied == false enter step 6; SCHEDULED, ACTIVE and RELEASED holds never do. Only the subscription's own seats enter step 2."
    constants:
      HIGH_VALUE_SUBTOTAL_CENTS: 1500
      HIGH_VALUE_UPLIFT_PCT: 0.10
      SAVE_OFFER_DISCOUNT_CAP_PCT: 0.40
    precision: "each line rounded to whole cents with ROUND_HALF_UP; total_cents floored at 0"
    variants: []
    note: "Circular-looking but well-defined: the uplift depends on the subtotal, the credits depend on holds, and the total depends on both - the order above is the only legal evaluation order."

  - name: hold_credit_computation
    trigger: "POST /paywall/subscriptions/{id}/holds (and re-evaluated never - the credit is frozen at creation)"
    algorithm: interval_merge
    formula: |
      if hold_type == 'PAUSE_BILLING':
          delivery_days_credited = 0
          credit_cents           = 0        # paused days are not billed at all, so no credit
      else:                                  # VACATION_DELIVERY or DELIVERY_INTERRUPTION
          daily_print_rate_cents = round_half_up(plan.print_component_cents
                                                 / plan.print_deliveries_per_cycle)
          delivery_days_credited = count(d for d in [start_date .. end_date]      # CLOSED interval
                                         if weekday_code(d) in plan.print_delivery_days)
          credit_cents           = daily_print_rate_cents * delivery_days_credited
      # occupation conflict geometry for holds (subscription is the occupied resource):
      # closed intervals PLUS a buffer - a new PAUSE_BILLING or VACATION_DELIVERY hold
      # conflicts with an existing hold on the same subscription with status IN
      # {SCHEDULED, ACTIVE, COMPLETED} when
      #     new.start_date <= existing.end_date + HOLD_BUFFER_DAYS
      # AND existing.start_date <= new.end_date + HOLD_BUFFER_DAYS
      # so back-to-back and near-adjacent holds are both rejected.
      # DELIVERY_INTERRUPTION is exempt from the buffer (publisher-caused) but must not
      # start inside an existing VACATION_DELIVERY hold's closed interval.
    input_set: "Holds on the same subscription with status IN {SCHEDULED, ACTIVE, COMPLETED}; RELEASED holds never block a new hold."
    constants:
      HOLD_BUFFER_DAYS: 2
      ANNUAL_VACATION_DAY_CAP: 28
    precision: "daily_print_rate_cents rounded to whole cents ROUND_HALF_UP once, then multiplied (never rate*days rounded at the end)"
    variants: []
    note: "Example: print_component_cents 700 over 4 deliveries per cycle gives 175/day; a VACATION_DELIVERY hold 2026-09-05..2026-09-14 on a SUN-delivery plan covers 2026-09-06 and 2026-09-13, so credit_cents = 350."

  - name: engagement_score
    trigger: "POST /paywall/readers/{id}/events, the GRANTED_* branch of POST /paywall/access-decisions (both write Reader.engagement_score), the ENGAGEMENT pass of POST /paywall/billing-runs (rescores every Reader against the current clock), and POST /paywall/subscriptions/{id}/cancellation-requests (writes CancellationRequest.projected_engagement_score)"
    algorithm: weighted_scoring
    formula: |
      raw = 0
      for e in ReaderEvent where reader_id == reader.id:
          days_ago = floor((clock_utc - e.occurred_at) / 86400 seconds)
          if days_ago < 0 or days_ago >= ENGAGEMENT_WINDOW_DAYS:   continue   # half-open window
          decay = 0.5 ** floor(days_ago / ENGAGEMENT_DECAY_STEP_DAYS)
          raw  += EVENT_WEIGHTS[e.event_type] * decay
      rolling_30d = round_half_up(raw, 2)
    input_set: "All ReaderEvent rows of the reader whose occurred_at satisfies 0 <= days_ago < 30. ARTICLE_VIEW_BLOCKED, INTERVENTION_EDITORIAL, INTERVENTION_PRODUCT and PRICE_INCREASE_NOTICE carry weight 0, so blocked paywall hits and outbound messages never move the score."
    constants:
      ENGAGEMENT_WINDOW_DAYS: 30
      ENGAGEMENT_DECAY_STEP_DAYS: 10
      EVENT_WEIGHTS: { ARTICLE_VIEW_GRANTED: 3, NEWSLETTER_OPEN: 2, APP_OPEN: 1, COMMENT_POST: 5, ARTICLE_VIEW_BLOCKED: 0, INTERVENTION_EDITORIAL: 0, INTERVENTION_PRODUCT: 0, PRICE_INCREASE_NOTICE: 0 }
    precision: "2 decimal places, round_half_up, applied once after the summation (sum-then-round - deliberately the opposite order from seat_charge_assembly)"
    variants:
      - name: rolling_30d
        when: "Stored on Reader.engagement_score and used by churn_risk_band and propensity_band_refresh."
        difference: "Uses raw as-is: a reader who has existed for 3 days simply has a small score."
      - name: cohort_normalized
        when: "Stored on CancellationRequest.projected_engagement_score at request creation and used to pick eligible_save_offer_tier."
        difference: |
          Projects a short tenure onto the full window:
          cohort_normalized = round_half_up(raw * ENGAGEMENT_WINDOW_DAYS / max(1, reader.tenure_days), 2)
          when reader.tenure_days < ENGAGEMENT_WINDOW_DAYS, otherwise identical to rolling_30d.
          For raw = 5.25 and tenure_days = 7 this yields 22.50 against a rolling_30d of
          5.25 - the same reader is 'MINIMAL/HIGH churn risk' on one variant and
          'RICH tier' on the other.
    note: "Two variants on the Reader domain (engagement), structurally unrelated to the money variants on cycle_base_price_resolution."

  - name: churn_risk_band
    trigger: "Whenever Reader.engagement_score is written, and on every dunning_status transition of any of the reader's subscriptions"
    algorithm: threshold
    formula: |
      if any Subscription of the reader has dunning_status IN {RETRYING, FAILED_FINAL}:
          return 'SEVERE'                      # dunning override wins outright
      s = reader.engagement_score
      if s <  CHURN_SEVERE_BELOW:   return 'SEVERE'    #  s < 5
      if s <  CHURN_HIGH_BELOW:     return 'HIGH'      #  5 <= s < 15
      if s <  CHURN_MEDIUM_BELOW:   return 'MEDIUM'    # 15 <= s < 30
      return 'LOW'                                     # s >= 30
    input_set: "The reader's own engagement_score plus the dunning_status of every Subscription with reader_id == reader.id and lifecycle_status IN {PENDING_ACTIVATION, ACTIVE, PAUSED, CANCEL_SCHEDULED, CANCELLED_NONPAY}."
    constants:
      CHURN_SEVERE_BELOW: 5
      CHURN_HIGH_BELOW: 15
      CHURN_MEDIUM_BELOW: 30
    precision: "compared against the 2-decimal engagement_score with strict < (a score of exactly 15.00 is MEDIUM, 14.99 is HIGH)"
    variants: []
    note: "A brand-new reader with zero events scores 0.00 and is therefore SEVERE - the empty-set edge is a real band, not an error."

  - name: propensity_band_refresh
    trigger: "ENGAGEMENT pass of POST /paywall/billing-runs (scope FULL | ENGAGEMENT_ONLY)"
    algorithm: threshold
    formula: |
      s = reader.engagement_score      # already rescored in the same pass
      reader.propensity_band = 'HIGH'   if s >= PROPENSITY_HIGH_AT
                          else 'MEDIUM' if s >= PROPENSITY_MEDIUM_AT
                          else 'LOW'
    input_set: "Every Reader row; the pass rescores engagement_score first and then re-bands propensity in the same pass, in reader created_at ASC order."
    constants:
      PROPENSITY_HIGH_AT: 30
      PROPENSITY_MEDIUM_AT: 10
    precision: "band comparison with >="
    variants: []
    note: "propensity_band is an input at reader creation (offline model seed) and is overwritten only by this pass - which is why a scoped BILLING_ONLY/DUNNING_ONLY run never disturbs a seeded band."

  - name: dunning_retry_schedule
    trigger: "POST /paywall/invoices/{id}/payment-attempts, and the DUNNING pass of POST /paywall/billing-runs (card updater sweep)"
    algorithm: chronological
    formula: |
      attempt_no = count(PaymentAttempt on this invoice) + 1
      max_attempts = DUNNING_MAX_ATTEMPTS + (CARD_UPDATER_BONUS_ATTEMPTS
                                             if reader.card_updater_status == 'UPDATED' else 0)
      is_final = (outcome == 'HARD_DECLINE') or
                 (outcome == 'SOFT_DECLINE' and attempt_no >= max_attempts)
      if outcome == 'SOFT_DECLINE' and not is_final:
          first_failed = sub.dunning_first_failed_on or clock_date
          offset = DUNNING_RETRY_OFFSET_DAYS[min(attempt_no, len(DUNNING_RETRY_OFFSET_DAYS)) - 1]
          next_retry_on = first_failed + offset days
      # card updater sweep, DUNNING pass only:
      # if sub.dunning_status == 'RETRYING' and reader.card_updater_status == 'PENDING':
      #     if reader.card_updater_registered:
      #         reader.card_exp_year += CARD_UPDATER_EXTENSION_YEARS
      #         reader.card_status = 'CURRENT'; reader.card_updater_status = 'UPDATED'
      #     else:
      #         reader.card_updater_status = 'UNAVAILABLE'
    input_set: "PaymentAttempt rows of the one invoice being charged, counted chronologically by created_at ASC; offsets are measured from dunning_first_failed_on, never from the previous attempt."
    constants:
      DUNNING_RETRY_OFFSET_DAYS: [3, 5, 7]
      DUNNING_MAX_ATTEMPTS: 4
      CARD_UPDATER_BONUS_ATTEMPTS: 1
      CARD_UPDATER_EXTENSION_YEARS: 3
      DUNNING_GRACE_DAYS: 14
    precision: "whole days on the logical clock date"
    variants: []
    note: "Offsets are cumulative from the first failure: failures on day 0 schedule retries on day 3, day 5 and day 7, not day 3, day 8, day 15."

  - name: group_seat_concurrency
    trigger: "POST /paywall/group-accounts/{id}/seats (capacity admission) and whenever GroupAccount.seats_assigned_count is recomputed"
    algorithm: interval_merge
    formula: |
      # Seats occupy HALF-OPEN intervals [starts_on, ends_on) on the GroupAccount.
      # Adjacency is legal: an existing seat ending 2026-09-09 and a candidate starting
      # 2026-09-09 do not conflict. Admission is by AGGREGATE concurrency, not pairwise.
      intervals = [ (s.starts_on, s.ends_on or DATE_MAX) for s in Seat
                    where group_account_id == group.id and status IN {'INVITED','ACTIVE'} ]
      intervals += [ (candidate.starts_on, candidate.ends_on or DATE_MAX) ]
      boundaries = sorted(set(all starts and ends))
      max_concurrent = max over consecutive boundary pairs (b_i, b_{i+1}) of
                       count(intervals covering [b_i, b_{i+1}))
      admit only when max_concurrent <= group.seat_capacity
      # the derived counters use the SAME peak-occupancy measure as admission, which is
      # what keeps the conservation invariant true even when three staggered seat rows
      # exist on a capacity-2 group:
      seats_assigned_count  = max_concurrent over INVITED|ACTIVE seats only (candidate excluded)
      seats_available_count = max(0, group.seat_capacity - seats_assigned_count)
    input_set: "Seat rows with status IN {INVITED, ACTIVE}; RECLAIMED and EXPIRED seats free their capacity immediately."
    constants:
      SEAT_INVITE_EXPIRY_DAYS: 14
    precision: "integer day boundaries; the interval geometry is half-open, in deliberate contrast to the closed-plus-buffer geometry of hold_credit_computation"
    variants: []
    note: "Invariant maintained by every seat transition: seat_capacity == seats_assigned_count + seats_available_count."

validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers are present and X-User-Role is one of the five declared roles"
    error_id: ERR_MISSING_AUTH_HEADERS
    http_status: 401
    applies_to: all
  - priority: 2
    category: auth
    check: "The acting role is listed in the endpoint's roles, and for entity_backed roles the acting X-User-ID owns the target resource (Reader must be the subscription's reader_id / the event's reader_id / the seat's reader_id; GroupAdmin's X-User-ID must equal the GroupAccount.id in the path)"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: all
  - priority: 3
    category: auth
    check: "Segregation of duties on the regulated price-increase pipeline: the ComplianceOfficer X-User-ID applying a price change must differ from OfferPlan.notice_sent_by_user_id, the officer who dispatched the subscriber notices"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /paywall/offer-plans/{id}/price-change/apply"
  - priority: 4
    category: business_constraint
    check: "Request body shape: every required field present, enum fields inside their declared value set, integer fields non-negative, date fields ISO YYYY-MM-DD, datetime fields RFC3339 with Z, discount fractions in [0, 1], billing-run scope inside its enum"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all write endpoints"
  - priority: 5
    category: existence
    check: "OfferPlan in the path exists"
    error_id: ERR_OFFER_PLAN_NOT_FOUND
    http_status: 404
    applies_to: "GET /paywall/offer-plans/{id}, POST /paywall/offer-plans/{id}/activate, POST /paywall/offer-plans/{id}/price-change, POST /paywall/offer-plans/{id}/price-change/notices, POST /paywall/offer-plans/{id}/price-change/apply"
  - priority: 6
    category: existence
    check: "PaywallRule in the path exists"
    error_id: ERR_PAYWALL_RULE_NOT_FOUND
    http_status: 404
    applies_to: "GET /paywall/paywall-rules/{id}"
  - priority: 7
    category: existence
    check: "Article in the path exists"
    error_id: ERR_ARTICLE_NOT_FOUND
    http_status: 404
    applies_to: "GET /paywall/articles/{id}"
  - priority: 8
    category: existence
    check: "Reader in the path exists"
    error_id: ERR_READER_NOT_FOUND
    http_status: 404
    applies_to: "GET /paywall/readers/{id}, POST /paywall/readers/{id}/card, POST /paywall/readers/{id}/events"
  - priority: 9
    category: existence
    check: "Subscription in the path exists"
    error_id: ERR_SUBSCRIPTION_NOT_FOUND
    http_status: 404
    applies_to: "GET /paywall/subscriptions/{id}, GET /paywall/subscriptions/{id}/invoices, GET /paywall/subscriptions/{id}/holds, GET /paywall/subscriptions/{id}/cancellation-requests, POST /paywall/subscriptions/{id}/holds, POST /paywall/subscriptions/{id}/cancellation-requests"
  - priority: 10
    category: existence
    check: "Invoice in the path exists"
    error_id: ERR_INVOICE_NOT_FOUND
    http_status: 404
    applies_to: "GET /paywall/invoices/{id}, GET /paywall/invoices/{id}/payment-attempts, POST /paywall/invoices/{id}/payment-attempts"
  - priority: 11
    category: existence
    check: "CancellationRequest in the path exists"
    error_id: ERR_CANCELLATION_REQUEST_NOT_FOUND
    http_status: 404
    applies_to: "GET /paywall/cancellation-requests/{id}, GET /paywall/cancellation-requests/{id}/save-offers, POST /paywall/cancellation-requests/{id}/save-offers, POST /paywall/cancellation-requests/{id}/confirm"
  - priority: 12
    category: existence
    check: "SaveOffer in the path exists"
    error_id: ERR_SAVE_OFFER_NOT_FOUND
    http_status: 404
    applies_to: "GET /paywall/save-offers/{id}, POST /paywall/save-offers/{id}/decision"
  - priority: 13
    category: existence
    check: "Hold in the path exists"
    error_id: ERR_HOLD_NOT_FOUND
    http_status: 404
    applies_to: "GET /paywall/holds/{id}, POST /paywall/holds/{id}/release"
  - priority: 14
    category: existence
    check: "GroupAccount in the path exists"
    error_id: ERR_GROUP_ACCOUNT_NOT_FOUND
    http_status: 404
    applies_to: "GET /paywall/group-accounts/{id}, POST /paywall/group-accounts/{id}/seats"
  - priority: 15
    category: existence
    check: "Seat in the path exists"
    error_id: ERR_SEAT_NOT_FOUND
    http_status: 404
    applies_to: "GET /paywall/seats/{id}, POST /paywall/seats/{id}/activate, POST /paywall/seats/{id}/reclaim"
  - priority: 16
    category: business_referential
    check: "reader_id in the body references an existing Reader"
    error_id: ERR_READER_NOT_FOUND
    http_status: 404
    applies_to: "POST /paywall/access-decisions, POST /paywall/subscriptions, POST /paywall/group-accounts/{id}/seats"
  - priority: 17
    category: business_referential
    check: "offer_plan_id in the body references an existing OfferPlan"
    error_id: ERR_OFFER_PLAN_NOT_FOUND
    http_status: 404
    applies_to: "POST /paywall/subscriptions, POST /paywall/group-accounts"
  - priority: 18
    category: business_referential
    check: "article_id references an existing Article and group_account_id, when supplied, references an existing GroupAccount"
    error_id: ERR_ARTICLE_NOT_FOUND
    http_status: 404
    applies_to: "POST /paywall/access-decisions, POST /paywall/readers/{id}/events, POST /paywall/subscriptions"
  - priority: 19
    category: state
    check: "expected_offer_plan_version equals the OfferPlan's current version (stale-view guard on the price ladder)"
    error_id: ERR_STALE_OFFER_PLAN_VERSION
    http_status: 412
    applies_to: "POST /paywall/subscriptions, POST /paywall/offer-plans/{id}/price-change"
  - priority: 20
    category: state
    check: "expected_group_account_version equals the GroupAccount's current version (stale-view guard on the seat capacity picture)"
    error_id: ERR_STALE_GROUP_ACCOUNT_VERSION
    http_status: 412
    applies_to: "POST /paywall/group-accounts/{id}/seats"
  - priority: 21
    category: state
    check: "The OfferPlan is ACTIVE before it may take a new subscription, fund a group account, or receive a scheduled price change"
    error_id: ERR_PLAN_NOT_ACTIVE
    http_status: 409
    applies_to: "POST /paywall/subscriptions, POST /paywall/group-accounts, POST /paywall/offer-plans/{id}/price-change"
  - priority: 22
    category: state
    check: "An OfferPlan already in status ACTIVE cannot be activated again"
    error_id: ERR_PLAN_ALREADY_ACTIVE
    http_status: 409
    applies_to: "POST /paywall/offer-plans/{id}/activate"
  - priority: 23
    category: state
    check: "price_change_state is in the state the requested step requires: NONE to schedule, SCHEDULED to dispatch notices, and IN {SCHEDULED, NOTICE_SENT} to apply - a SCHEDULED change that reaches apply passes this check and is refused by priority 35 instead, so the notice-not-sent error is reachable"
    error_id: ERR_PRICE_CHANGE_STATE_INVALID
    http_status: 409
    applies_to: "POST /paywall/offer-plans/{id}/price-change, POST /paywall/offer-plans/{id}/price-change/notices, POST /paywall/offer-plans/{id}/price-change/apply"
  - priority: 24
    category: state
    check: "The Subscription is not in a terminal lifecycle_status (CANCELLED, CANCELLED_NONPAY). Payment attempts are deliberately NOT covered here: an attempt against a non-pay-cancelled subscription is answered by the dunning-episode rule at priority 26, which is what makes ERR_DUNNING_EXHAUSTED reachable"
    error_id: ERR_SUBSCRIPTION_TERMINAL
    http_status: 409
    applies_to: "POST /paywall/subscriptions/{id}/holds, POST /paywall/subscriptions/{id}/cancellation-requests"
  - priority: 25
    category: state
    check: "The Subscription is ACTIVE: holds, cancellation requests, save-offer acceptance and cancellation confirmation all require a live, non-paused subscription"
    error_id: ERR_SUBSCRIPTION_NOT_ACTIVE
    http_status: 409
    applies_to: "POST /paywall/subscriptions/{id}/holds, POST /paywall/subscriptions/{id}/cancellation-requests, POST /paywall/save-offers/{id}/decision, POST /paywall/cancellation-requests/{id}/confirm"
  - priority: 26
    category: state
    check: "The dunning episode is still open: dunning_status is not FAILED_FINAL and attempt_no does not exceed max_payment_attempts. This runs BEFORE the invoice-status rule at priority 27 on purpose, so that a further attempt against the written-off invoice of a non-pay-cancelled subscription answers ERR_DUNNING_EXHAUSTED rather than ERR_INVOICE_NOT_PAYABLE"
    error_id: ERR_DUNNING_EXHAUSTED
    http_status: 409
    applies_to: "POST /paywall/invoices/{id}/payment-attempts"
  - priority: 27
    category: state
    check: "The Invoice status is OPEN or PAST_DUE (a PAID or VOID invoice takes no further payment attempt on a subscription whose dunning episode is still open)"
    error_id: ERR_INVOICE_NOT_PAYABLE
    http_status: 409
    applies_to: "POST /paywall/invoices/{id}/payment-attempts"
  - priority: 28
    category: state
    check: "When next_retry_on is set, clock_date >= next_retry_on (a retry before the scheduled retry date is refused)"
    error_id: ERR_RETRY_TOO_EARLY
    http_status: 409
    applies_to: "POST /paywall/invoices/{id}/payment-attempts"
  - priority: 29
    category: state
    check: "The CancellationRequest is still open (INITIATED or SAVE_OFFER_PRESENTED); CONFIRMED, COMPLETED and ABANDONED requests accept nothing further"
    error_id: ERR_CANCELLATION_REQUEST_CLOSED
    http_status: 409
    applies_to: "POST /paywall/cancellation-requests/{id}/save-offers, POST /paywall/cancellation-requests/{id}/confirm"
  - priority: 30
    category: state
    check: "The SaveOffer is still PRESENTED (an ACCEPTED, DECLINED or EXPIRED offer cannot be decided again)"
    error_id: ERR_SAVE_OFFER_ALREADY_DECIDED
    http_status: 409
    applies_to: "POST /paywall/save-offers/{id}/decision"
  - priority: 31
    category: state
    check: "The Hold status is SCHEDULED or ACTIVE and credit_applied is false (a credit already swept onto an invoice cannot be reversed by releasing the hold)"
    error_id: ERR_HOLD_NOT_RELEASABLE
    http_status: 409
    applies_to: "POST /paywall/holds/{id}/release"
  - priority: 32
    category: state
    check: "The Seat status is INVITED before activation"
    error_id: ERR_SEAT_NOT_INVITED
    http_status: 409
    applies_to: "POST /paywall/seats/{id}/activate"
  - priority: 33
    category: state
    check: "clock_date <= Seat.invite_expires_on"
    error_id: ERR_SEAT_INVITE_EXPIRED
    http_status: 409
    applies_to: "POST /paywall/seats/{id}/activate"
  - priority: 34
    category: business_safety
    check: "Cancellation-regulation notice window: pending_effective_on - clock_date >= PRICE_NOTICE_WINDOW_DAYS (30) at the moment the subscriber notices are dispatched"
    error_id: ERR_PRICE_NOTICE_WINDOW_TOO_SHORT
    http_status: 422
    applies_to: "POST /paywall/offer-plans/{id}/price-change/notices"
  - priority: 35
    category: business_safety
    check: "A price increase may not be applied unless notices were dispatched (notice_sent_on is not null)"
    error_id: ERR_PRICE_NOTICE_NOT_SENT
    http_status: 409
    applies_to: "POST /paywall/offer-plans/{id}/price-change/apply"
  - priority: 36
    category: business_constraint
    check: "step_up_schedule monotonicity: from_cycle values are strictly increasing, every from_cycle satisfies intro_cycles < from_cycle < standard_from_cycle, price_cents values are strictly increasing, the first step price is >= intro_price_cents and the last step price is <= standard_price_cents"
    error_id: ERR_STEP_UP_SCHEDULE_INVALID
    http_status: 422
    applies_to: "POST /paywall/offer-plans, POST /paywall/offer-plans/{id}/activate"
  - priority: 37
    category: business_safety
    check: "clock_date >= pending_effective_on before the new price may be applied"
    error_id: ERR_PRICE_CHANGE_NOT_EFFECTIVE_YET
    http_status: 409
    applies_to: "POST /paywall/offer-plans/{id}/price-change/apply"
  - priority: 38
    category: business_safety
    check: "Single-save-offer rule: save_offer_count < MAX_SAVE_OFFERS_PER_REQUEST (1). A declined offer still counts, so a reader who declines can never be re-pitched inside the same cancellation flow"
    error_id: ERR_SAVE_OFFER_LIMIT_EXCEEDED
    http_status: 409
    applies_to: "POST /paywall/cancellation-requests/{id}/save-offers"
  - priority: 39
    category: business_constraint
    check: "discount_pct <= SAVE_OFFER_DISCOUNT_CAP_PCT (0.40) and duration_cycles between 1 and 12 for RETENTION_DISCOUNT / DOWNGRADE offers; pause_days between 7 and 90 for PAUSE offers"
    error_id: ERR_SAVE_OFFER_DISCOUNT_CAP
    http_status: 422
    applies_to: "POST /paywall/cancellation-requests/{id}/save-offers"
  - priority: 40
    category: business_referential
    check: "Institutional authentication: Reader.email ends with '@' + GroupAccount.allowed_email_domain"
    error_id: ERR_SEAT_DOMAIN_MISMATCH
    http_status: 422
    applies_to: "POST /paywall/seats/{id}/activate"
  - priority: 41
    category: business_referential
    check: "The GroupAccount's funding Subscription (the Subscription whose group_account_id is this group) exists with lifecycle_status == ACTIVE and dunning_status != FAILED_FINAL"
    error_id: ERR_GROUP_SUBSCRIPTION_NOT_ACTIVE
    http_status: 422
    applies_to: "POST /paywall/group-accounts/{id}/seats, POST /paywall/seats/{id}/activate"
  - priority: 42
    category: business_referential
    check: "An editorial or product intervention may only be logged for a reader whose churn_risk_band is HIGH or SEVERE, and only when intervention_count_in_period < 2"
    error_id: ERR_INTERVENTION_NOT_WARRANTED
    http_status: 422
    applies_to: "POST /paywall/readers/{id}/events"
  - priority: 43
    category: business_constraint
    check: "event_type is reader-reportable: ARTICLE_VIEW_GRANTED, ARTICLE_VIEW_BLOCKED and PRICE_INCREASE_NOTICE are system-generated and cannot be posted directly"
    error_id: ERR_EVENT_TYPE_SYSTEM_ONLY
    http_status: 422
    applies_to: "POST /paywall/readers/{id}/events"
  - priority: 44
    category: business_constraint
    check: "The Reader has is_registered == true and a non-null email before a subscription may be opened"
    error_id: ERR_READER_NOT_REGISTERED
    http_status: 422
    applies_to: "POST /paywall/subscriptions"
  - priority: 45
    category: business_constraint
    check: "Article.published_at <= clock_utc (an embargoed article yields no access decision)"
    error_id: ERR_ARTICLE_UNPUBLISHED
    http_status: 422
    applies_to: "POST /paywall/access-decisions"
  - priority: 46
    category: business_constraint
    check: "VACATION_DELIVERY and DELIVERY_INTERRUPTION holds require plan.bundle_type == PRINT_DIGITAL with print_deliveries_per_cycle >= 1"
    error_id: ERR_PLAN_NOT_PRINT_BUNDLE
    http_status: 422
    applies_to: "POST /paywall/subscriptions/{id}/holds"
  - priority: 47
    category: business_constraint
    check: "A GroupAccount must be funded by a plan with bundle_type == INSTITUTIONAL_SEAT and per_seat_price_cents >= 1"
    error_id: ERR_PLAN_NOT_INSTITUTIONAL
    http_status: 422
    applies_to: "POST /paywall/group-accounts"
  - priority: 48
    category: business_temporal
    check: "VACATION_DELIVERY and PAUSE_BILLING holds must be future-dated: start_date > clock_date"
    error_id: ERR_HOLD_START_NOT_FUTURE
    http_status: 422
    applies_to: "POST /paywall/subscriptions/{id}/holds"
  - priority: 49
    category: business_temporal
    check: "DELIVERY_INTERRUPTION holds may start today but never in the past: start_date >= clock_date"
    error_id: ERR_HOLD_START_IN_PAST
    http_status: 422
    applies_to: "POST /paywall/subscriptions/{id}/holds"
  - priority: 50
    category: business_temporal
    check: "end_date >= start_date, and the closed interval spans at most 90 days"
    error_id: ERR_HOLD_INTERVAL_INVALID
    http_status: 422
    applies_to: "POST /paywall/subscriptions/{id}/holds"
  - priority: 51
    category: business_temporal
    check: "Buffered occupation conflict on the subscription: for VACATION_DELIVERY and PAUSE_BILLING holds, no existing Hold on the same subscription with status IN {SCHEDULED, ACTIVE, COMPLETED} may satisfy new.start_date <= existing.end_date + HOLD_BUFFER_DAYS AND existing.start_date <= new.end_date + HOLD_BUFFER_DAYS. For DELIVERY_INTERRUPTION the buffer is 0 but the start_date must not fall inside an existing VACATION_DELIVERY closed interval"
    error_id: ERR_HOLD_BUFFER_VIOLATION
    http_status: 409
    applies_to: "POST /paywall/subscriptions/{id}/holds"
  - priority: 52
    category: business_fiscal
    check: "Aggregate vacation quota: vacation_days_used_365 + (end_date - start_date + 1) <= ANNUAL_VACATION_DAY_CAP (28)"
    error_id: ERR_VACATION_DAY_CAP_EXCEEDED
    http_status: 422
    applies_to: "POST /paywall/subscriptions/{id}/holds"
  - priority: 53
    category: business_constraint
    check: "At most MAX_PAUSES_PER_YEAR (2) PAUSE_BILLING holds with status IN {SCHEDULED, ACTIVE, COMPLETED} may exist on a subscription with start_date within the trailing 365 days"
    error_id: ERR_PAUSE_LIMIT_EXCEEDED
    http_status: 409
    applies_to: "POST /paywall/subscriptions/{id}/holds"
  - priority: 54
    category: business_temporal
    check: "Seat interval sanity: starts_on >= clock_date and, when ends_on is supplied, ends_on > starts_on (half-open interval, so a zero-length seat is rejected)"
    error_id: ERR_SEAT_INTERVAL_INVALID
    http_status: 422
    applies_to: "POST /paywall/group-accounts/{id}/seats"
  - priority: 55
    category: business_constraint
    check: "The same reader may not hold two overlapping seats on the same GroupAccount: no existing Seat with the same reader_id and status IN {INVITED, ACTIVE} whose half-open interval intersects the candidate's"
    error_id: ERR_SEAT_READER_DUPLICATE
    http_status: 409
    applies_to: "POST /paywall/group-accounts/{id}/seats"
  - priority: 56
    category: business_fiscal
    check: "Aggregate seat capacity: the maximum number of simultaneously occupied half-open seat intervals (existing INVITED/ACTIVE seats plus the candidate) must not exceed GroupAccount.seat_capacity - adjacency at a shared boundary date is not an overlap"
    error_id: ERR_SEAT_CAPACITY_EXCEEDED
    http_status: 409
    applies_to: "POST /paywall/group-accounts/{id}/seats"
  - priority: 57
    category: business_fiscal
    check: "amount_cents equals Invoice.total_cents exactly (partial tenders are not accepted)"
    error_id: ERR_PAYMENT_AMOUNT_MISMATCH
    http_status: 422
    applies_to: "POST /paywall/invoices/{id}/payment-attempts"
  - priority: 58
    category: business_temporal
    check: "The logical clock never moves backwards: current_utc >= the clock's current value"
    error_id: ERR_CLOCK_NOT_MONOTONIC
    http_status: 422
    applies_to: "POST /paywall/_clock/set_current_utc"

endpoints:
  - method: POST
    path: "/paywall/offer-plans"
    description: "Author a new offer plan (price ladder, bundle configuration, print economics, per-seat price). Created in status DRAFT."
    roles: [RevenueManager]
    code: 201
    input: [name, bundle_type, intro_price_cents, intro_cycles, standard_price_cents, standard_from_cycle, "cycle_days?", "step_up_schedule?", "print_component_cents?", "print_delivery_days?", "print_deliveries_per_cycle?", "per_seat_price_cents?", "grandfather_policy?"]
    output: OfferPlan
    side_effects: ["status = DRAFT", "specificity/ladder validation per validations priority 36", "active_subscription_count = 0"]
  - method: POST
    path: "/paywall/offer-plans/{id}/activate"
    description: "Move a DRAFT plan to ACTIVE so it can accept subscriptions and fund group accounts."
    roles: [RevenueManager]
    code: 200
    input: []
    output: OfferPlan
    side_effects: ["status DRAFT -> ACTIVE", "increments OfferPlan.version by 1"]
  - method: POST
    path: "/paywall/offer-plans/{id}/price-change"
    description: "Schedule a standard-price increase with an effective date and a grandfathering policy."
    roles: [RevenueManager]
    code: 200
    input: [pending_price_cents, pending_effective_on, grandfather_policy, expected_offer_plan_version]
    output: OfferPlan
    side_effects: ["price_change_state NONE -> SCHEDULED", "pending_price_cents / pending_effective_on / grandfather_policy persisted", "recomputes next_cycle_price_cents (preview_quote) on every non-terminal Subscription of the plan", "increments OfferPlan.version by 1"]
  - method: POST
    path: "/paywall/offer-plans/{id}/price-change/notices"
    description: "Dispatch the regulated advance notices to every affected subscriber. Enforces the 30-day notice window."
    roles: [ComplianceOfficer]
    code: 200
    input: []
    output: OfferPlan
    side_effects: ["price_change_state SCHEDULED -> NOTICE_SENT", "notice_sent_on = clock_date, notice_sent_by_user_id = X-User-ID", "creates one ReaderEvent{event_type: PRICE_INCREASE_NOTICE, weight: 0} per affected reader", "increments OfferPlan.version by 1"]
  - method: POST
    path: "/paywall/offer-plans/{id}/price-change/apply"
    description: "Apply the noticed price increase on or after its effective date, resolving grandfathering for existing subscriptions. Must be performed by a different officer than the one who sent the notices."
    roles: [ComplianceOfficer]
    code: 200
    input: []
    output: OfferPlan
    side_effects: ["standard_price_cents = pending_price_cents; price_change_state NOTICE_SENT -> APPLIED", "grandfathering cascade hops 2-3 (locked_price_cents, grandfathered_until_cycle, next_cycle_price_cents, per-subscription version bumps)", "increments OfferPlan.version by 1"]
  - method: POST
    path: "/paywall/paywall-rules"
    description: "Create a dynamic paywall rule matching content type, section and reader propensity band."
    roles: [RevenueManager]
    code: 201
    input: [name, action, priority, "content_type_match?", "section_match?", "propensity_band_match?", "meter_allowance_override?", "status?"]
    output: PaywallRule
    side_effects: ["specificity_score computed from the three matchers"]
  - method: POST
    path: "/paywall/articles"
    description: "Publish an article with its editorial metadata and article-level access class."
    roles: [RevenueManager]
    code: 201
    input: [headline, section, content_type, "access_class?", "published_at?"]
    output: Article
    side_effects: ["published_at defaults to the logical clock"]
  - method: POST
    path: "/paywall/readers"
    description: "Create a reader record (anonymous device record or registered reader) with its propensity seed and optional card on file."
    roles: [SubscriptionOpsAgent]
    code: 201
    input: ["email?", "is_registered?", "propensity_band?", "card_last4?", "card_exp_month?", "card_exp_year?", "card_updater_registered?"]
    output: Reader
    side_effects: ["meter_period_started_on = clock_date", "engagement_score = 0.00, churn_risk_band = SEVERE", "card_status computed from the card fields and the clock", "entitlement_source = NONE"]
  - method: POST
    path: "/paywall/readers/{id}/card"
    description: "Replace the reader's stored card (self-service update or agent-assisted), re-arming the card-updater pipeline."
    roles: [Reader, SubscriptionOpsAgent]
    code: 200
    input: [card_last4, card_exp_month, card_exp_year, "card_updater_registered?"]
    output: Reader
    side_effects: ["card_status recomputed against the clock", "card_updater_status reset to NOT_APPLICABLE", "increments Reader.version by 1"]
  - method: POST
    path: "/paywall/readers/{id}/events"
    description: "Record an engagement signal or a targeted editorial/product intervention for a reader."
    roles: [Reader, SubscriptionOpsAgent]
    code: 201
    input: [event_type, "occurred_at?", "article_id?"]
    output: ReaderEvent
    side_effects: ["occurred_at defaults to the logical clock; backdated instants are accepted", "weight assigned from EVENT_WEIGHTS", "Reader.engagement_score recomputed (rolling_30d) and churn_risk_band re-derived", "Reader.intervention_count_in_period recomputed"]
  - method: POST
    path: "/paywall/access-decisions"
    description: "Evaluate the paywall for one reader/article pair: rule selection, registration wall, meter accounting and entitlement override. Returns the ReaderEvent carrying the verdict."
    roles: [Reader, SubscriptionOpsAgent]
    code: 201
    input: [reader_id, article_id]
    output: ReaderEvent
    side_effects: ["lazy meter-period reset when clock_date - meter_period_started_on >= 30", "paywall_rule_selection then paywall_access_decision", "Reader.metered_article_ids / metered_distinct_article_count updated on a fresh metered grant only", "creates one ReaderEvent with decision, meter_index, effective_allowance and applied_rule_id", "Reader.engagement_score and churn_risk_band recomputed on GRANTED_* verdicts"]
  - method: POST
    path: "/paywall/subscriptions"
    description: "Open a subscription on an ACTIVE plan and generate the cycle-1 invoice. Institutional subscriptions carry group_account_id."
    roles: [SubscriptionOpsAgent]
    code: 201
    input: [reader_id, offer_plan_id, expected_offer_plan_version, "group_account_id?"]
    output: Subscription
    side_effects: ["lifecycle_status = PENDING_ACTIVATION, dunning_status = CURRENT, cycle_index = 1, cycle_start_on = clock_date", "print_fulfillment_status = NOT_APPLICABLE until the first payment succeeds", "creates the cycle-1 Invoice via invoice_total_assembly (status VOID when total_cents == 0)", "next_cycle_price_cents computed via cycle_base_price_resolution/preview_quote", "OfferPlan.active_subscription_count recomputed and increments OfferPlan.version by 1"]
  - method: POST
    path: "/paywall/subscriptions/{id}/holds"
    description: "Create a service hold: a reader vacation hold, a billing pause, or a publisher-caused delivery interruption. Credits are frozen at creation."
    roles: [Reader, SubscriptionOpsAgent]
    code: 201
    input: [hold_type, start_date, end_date]
    output: Hold
    side_effects: ["hold_credit_computation freezes delivery_days_credited and credit_cents", "status = SCHEDULED, or ACTIVE immediately for a DELIVERY_INTERRUPTION starting today", "Subscription.pending_credit_cents recomputed upward", "Subscription.vacation_days_used_365 recomputed for VACATION_DELIVERY holds", "print_fulfillment_status SCHEDULED -> INTERRUPTED for an immediate DELIVERY_INTERRUPTION"]
  - method: POST
    path: "/paywall/holds/{id}/release"
    description: "Release a hold early and reverse its frozen credit (compensating action)."
    roles: [SubscriptionOpsAgent]
    code: 200
    input: []
    output: Hold
    side_effects: ["status SCHEDULED|ACTIVE -> RELEASED", "COMPENSATION: Subscription.pending_credit_cents recomputed downward by exactly credit_cents; lifetime_credit_cents unchanged", "print_fulfillment_status HELD|INTERRUPTED -> SCHEDULED and lifecycle_status PAUSED -> ACTIVE when this hold was the active one", "Subscription.vacation_days_used_365 recomputed"]
  - method: POST
    path: "/paywall/subscriptions/{id}/cancellation-requests"
    description: "Start the regulated cancellation flow. Freezes the cohort_normalized engagement projection used to size the save offer."
    roles: [Reader, SubscriptionOpsAgent]
    code: 201
    input: [reason_code]
    output: CancellationRequest
    side_effects: ["status = INITIATED", "projected_engagement_score computed via engagement_score/cohort_normalized", "eligible_save_offer_tier derived from projected_engagement_score", "save_offer_count = 0, retained = false"]
  - method: POST
    path: "/paywall/cancellation-requests/{id}/save-offers"
    description: "Present the single permitted save offer (retention discount, downgrade or pause) inside an open cancellation flow."
    roles: [SubscriptionOpsAgent]
    code: 201
    input: [offer_type, "discount_pct?", "duration_cycles?", "pause_days?"]
    output: SaveOffer
    side_effects: ["SaveOffer status = PRESENTED, presented_on = clock_date", "CancellationRequest.status INITIATED -> SAVE_OFFER_PRESENTED, save_offer_count recomputed"]
  - method: POST
    path: "/paywall/save-offers/{id}/decision"
    description: "Reader accepts or declines the presented save offer. Accepting retains the subscription; declining returns the flow to INITIATED without unlocking a second offer."
    roles: [Reader]
    code: 200
    input: [decision]
    output: SaveOffer
    side_effects: ["BRANCH A (ACCEPTED): SaveOffer -> ACCEPTED, request -> SAVE_OFFER_ACCEPTED, retained = true; retention_discount_pct / retention_discount_cycles_remaining set for RETENTION_DISCOUNT and DOWNGRADE, or a SCHEDULED PAUSE_BILLING Hold created for PAUSE; next_cycle_price_cents recomputed", "BRANCH B (DECLINED): SaveOffer -> DECLINED, request -> INITIATED, save_offer_count stays 1"]
  - method: POST
    path: "/paywall/cancellation-requests/{id}/confirm"
    description: "Confirm the cancellation. Schedules service to end at the paid-through date and cascades through print fulfilment, holds and credits."
    roles: [Reader, ComplianceOfficer]
    code: 200
    input: []
    output: CancellationRequest
    side_effects: ["status INITIATED|SAVE_OFFER_PRESENTED -> CONFIRMED with confirmed_on and effective_on", "any PRESENTED SaveOffer -> EXPIRED", "cascade hops 2-4: subscription -> CANCEL_SCHEDULED with access_until / cancel_effective_on, print_fulfillment_status -> STOPPED_AT_CYCLE_END, SCHEDULED holds after access_until -> RELEASED, pending_credit_cents recomputed downward"]
  - method: POST
    path: "/paywall/invoices/{id}/payment-attempts"
    description: "Record a processor result against an invoice. Drives activation, dunning retries, recovery, and the non-payment cancellation cascade."
    roles: [SubscriptionOpsAgent]
    code: 201
    input: [outcome, amount_cents, "decline_code?"]
    output: PaymentAttempt
    side_effects: ["attempt_no and is_final computed via dunning_retry_schedule", "SUCCEEDED: Invoice -> PAID, paid_through_on advanced, lifecycle PENDING_ACTIVATION -> ACTIVE or dunning RETRYING -> RECOVERED, tenure_cycles recomputed", "SOFT_DECLINE non-final: Invoice -> PAST_DUE, dunning -> RETRYING, next_retry_on set from DUNNING_RETRY_OFFSET_DAYS, card_updater_status armed", "final decline: 5-hop cascade to WRITTEN_OFF / FAILED_FINAL / CANCELLED_NONPAY / released holds / reclaimed seats / recomputed counters"]
  - method: POST
    path: "/paywall/group-accounts"
    description: "Create an institutional account with its authentication domain and seat capacity, funded by an INSTITUTIONAL_SEAT plan."
    roles: [SubscriptionOpsAgent]
    code: 201
    input: [name, admin_email, allowed_email_domain, seat_capacity, offer_plan_id]
    output: GroupAccount
    side_effects: ["status = ACTIVE", "seats_assigned_count = 0, seats_available_count = seat_capacity"]
  - method: POST
    path: "/paywall/group-accounts/{id}/seats"
    description: "Invite a reader to occupy a seat over a half-open date interval, subject to aggregate concurrency capacity."
    roles: [GroupAdmin]
    code: 201
    input: [reader_id, starts_on, expected_group_account_version, "ends_on?"]
    output: Seat
    side_effects: ["group_seat_concurrency admission check against seat_capacity", "status = INVITED, invited_on = clock_date, invite_expires_on = invited_on + SEAT_INVITE_EXPIRY_DAYS", "GroupAccount.seats_assigned_count / seats_available_count recomputed (invariant: capacity == assigned + available)", "increments GroupAccount.version by 1"]
  - method: POST
    path: "/paywall/seats/{id}/activate"
    description: "Reader authenticates against the institution's email domain and claims the invited seat."
    roles: [Reader]
    code: 200
    input: []
    output: Seat
    side_effects: ["status INVITED -> ACTIVE, claimed_on = clock_date", "Reader.entitlement_source recomputed -> SEAT when no subscription entitles the reader"]
  - method: POST
    path: "/paywall/seats/{id}/reclaim"
    description: "Institution reclaims a seat, freeing capacity immediately."
    roles: [GroupAdmin]
    code: 200
    input: []
    output: Seat
    side_effects: ["status INVITED|ACTIVE -> RECLAIMED, ends_on = clock_date", "COMPENSATION: GroupAccount.seats_assigned_count / seats_available_count recomputed so capacity == assigned + available holds", "Reader.entitlement_source recomputed", "increments GroupAccount.version by 1"]
  - method: POST
    path: "/paywall/billing-runs"
    description: "Run the nightly batch at the current logical clock. Passes execute in the pinned order HOLDS -> EXPIRY -> BILLING -> DUNNING -> ENGAGEMENT; scope restricts which passes run."
    roles: [SubscriptionOpsAgent]
    code: 200
    input: [scope]
    output: "{ run_id: string, scope: string, holds_activated: string_array, holds_completed: string_array, subscriptions_paused: string_array, subscriptions_resumed: string_array, cancellations_completed: string_array, seats_expired: string_array, invoices_created: string_array, subscriptions_cancelled_nonpay: string_array, cards_updated: string_array, readers_rescored: string_array }"
    side_effects: ["HOLDS pass: SCHEDULED holds reaching start_date -> ACTIVE (pausing or holding print), ACTIVE holds past end_date -> COMPLETED (resuming service, shifting cycle_start_on for pauses)", "EXPIRY pass: CANCEL_SCHEDULED -> CANCELLED past cancel_effective_on, CONFIRMED requests -> COMPLETED, open requests older than 30 days -> ABANDONED, INVITED seats past invite_expires_on -> EXPIRED", "BILLING pass: subscriptions whose paid_through_on <= clock_date get the next cycle invoice via invoice_total_assembly, sweeping unapplied COMPLETED hold credits and decrementing retention_discount_cycles_remaining", "DUNNING pass: card-updater sweep (card_exp_year += 3 / card_updater_status), RECOVERED -> CURRENT", "ENGAGEMENT pass: engagement_score rescored (rolling_30d) against the current clock, churn_risk_band re-derived, propensity_band refreshed, meter periods reset"]
  - method: POST
    path: "/paywall/_clock/set_current_utc"
    description: "Test-driving endpoint: set the server's logical clock. Before any call the logical clock reads exactly 2026-08-01T00:00:00Z and never falls back to wall-clock time. The clock is monotonic - moving it backwards is rejected."
    roles: [SubscriptionOpsAgent, RevenueManager, ComplianceOfficer, Reader, GroupAdmin]
    code: 200
    input: [current_utc]
    output: "{ current_utc: string }"
    side_effects: ["logical clock advanced; no entity is mutated by this call"]
  - method: GET
