      - name: clock_expires_authorization_threshold
        claim_type: rate_threshold_triggers
        grounds: [state_machines.Authorization.ACTIVE_to_EXPIRED, endpoints]
        distinguishing_aspect: "Setting the clock to exactly valid_until expires the authorization (status EXPIRED), and the clock response lists it in expired_authorization_ids."
        test_recipe:
          setup: ["An ACTIVE authorization valid_until 2026-06-15T00:00:00Z."]
          setup_api_calls:
