      - name: route_shape_is_checked_before_bond_eligibility
        claim_type: cascading_validation
        grounds:
          - validations[priority=13].ERR_ROUTE_TYPE_MISMATCH
          - validations[priority=14].ERR_NO_ELIGIBLE_BOND
        distinguishing_aspect: "An IE filing between two different ports by a carrier with no bond at all violates priority 13 and priority 14 together; the reply must be ERR_ROUTE_TYPE_MISMATCH (422), proving the route check runs before the selector is consulted."
        test_recipe:
          setup:
            - "Ports 4601 (NE) and 3901 (MW); carrier ACTIVE with NO CustomsBond rows at all; clock 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: CBPOfficer
              as_user_id: "OFF-1"
