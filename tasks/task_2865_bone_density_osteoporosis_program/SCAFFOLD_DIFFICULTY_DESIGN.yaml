      - name: densitometer_qc_hold_release_requires_two_passes_not_one
        grounds:
          - state_machines.Densitometer.ACTIVE_to_QC_HOLD
          - state_machines.Densitometer.QC_HOLD_to_ACTIVE
          - calculations.qc_deviation_and_result
          - entities.Densitometer.fields.consecutive_qc_pass_count
          - entities.Densitometer.fields.qc_hold_reason_code
          - endpoints["POST /bone-density/densitometers/{id}/qc-runs"]
        distinguishing_aspect: |
          The QC_HOLD -> ACTIVE edge is not taken by the event that would naively trigger it: the
          first PASS after the FAIL leaves the device in QC_HOLD with consecutive_qc_pass_count 1,
          and only the second consecutive PASS crosses QC_RELEASE_PASS_STREAK and clears the hold
          fields. The same endpoint with the same payload therefore has two different state outcomes
          depending on an accumulated counter rather than on the request.
        test_recipe:
          setup:
            - "Logical clock at 2026-03-05T08:00:00Z."
            - "One Densitometer HLG-0001 with phantom_baseline_bmd_g_cm2 1.0000 and phantom_baseline_sd_g_cm2 0.0100, status ACTIVE."
            - "One DAILY_QC run with phantom_bmd_g_cm2 1.0200, giving deviation_sd_units 2.000 and result FAIL, which drives the device to QC_HOLD with qc_hold_reason_code OUT_OF_CONTROL_FAIL."
          setup_api_calls:
            - call: "POST /bone-density/_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-05T08:00:00Z" }
              as: ProgramAdmin
            - call: "POST /bone-density/densitometers"
              payload: { serial_number: "HLG-0001", manufacturer: "HOLOGIC", model: "Horizon A", site_code: "MAIN", phantom_baseline_bmd_g_cm2: 1.0000, phantom_baseline_sd_g_cm2: 0.0100, appointment_buffer_minutes: 15, daily_scan_capacity: 12 }
              as: ProgramAdmin
              captures: { dev_a_id: $.data.id }
            - call: "POST /bone-density/densitometers/${dev_a_id}/qc-runs"
              payload: { purpose: "DAILY_QC", phantom_bmd_g_cm2: 1.0200, scan_mode: "ARRAY" }
              as: Technologist
              as_user_id: "tech-001"
              captures: { qc_fail_id: $.data.id }
          trigger:
            - call: "POST /bone-density/densitometers/${dev_a_id}/qc-runs"
              payload: { purpose: "DAILY_QC", phantom_bmd_g_cm2: 1.0000, scan_mode: "ARRAY" }
              as: Technologist
              as_user_id: "tech-001"
              captures: { qc_pass1_id: $.data.id }
            - call: "POST /bone-density/densitometers/${dev_a_id}/qc-runs"
              payload: { purpose: "DAILY_QC", phantom_bmd_g_cm2: 1.0000, scan_mode: "ARRAY" }
              as: Technologist
              as_user_id: "tech-001"
              captures: { qc_pass2_id: $.data.id }
          assert:
            - "QcRun.${qc_fail_id}.deviation_g_cm2 == 0.0200"
            - "QcRun.${qc_fail_id}.deviation_sd_units == 2.000"
            - "QcRun.${qc_fail_id}.result == FAIL"
            - "QcRun.${qc_fail_id}.shift_detected == false"
            - "QcRun.${qc_pass1_id}.deviation_g_cm2 == 0.0000"
            - "QcRun.${qc_pass1_id}.deviation_sd_units == 0.000"
            - "QcRun.${qc_pass1_id}.result == PASS"
            - "QcRun.${qc_pass1_id}.shift_detected == false"
            - "immediately after the first PASS a GET of the densitometer still shows status QC_HOLD, qc_hold_reason_code OUT_OF_CONTROL_FAIL and consecutive_qc_pass_count 1"
            - "QcRun.${qc_pass2_id}.result == PASS"
            - "Densitometer.${dev_a_id}.status == ACTIVE"
            - "Densitometer.${dev_a_id}.consecutive_qc_pass_count == 2"
            - "Densitometer.${dev_a_id}.qc_hold_reason_code == null"
            - "Densitometer.${dev_a_id}.qc_hold_started_at == null"
            - "Densitometer.${dev_a_id}.last_qc_result == PASS"

  - rule_id: transitive_cascade
    instances:
      - name: report_finalize_cascades_four_levels_to_cancel_a_future_appointment
        grounds:
          - state_machines.DiagnosticReport.DRAFT_to_FINALIZED
          - state_machines.ScanOrder.SCHEDULED_to_DENIED
          - state_machines.ScanAppointment.BOOKED_to_CANCELLED
          - calculations.order_frequency_eligibility
          - entities.Patient.fields.next_eligible_scan_date
          - entities.Patient.fields.open_scheduled_order_count
          - endpoints["POST /bone-density/diagnostic-reports/{id}/finalize"]
        distinguishing_aspect: |
          One finalize call propagates through four distinct entities in order: the DiagnosticReport
          flips DRAFT -> FINALIZED (link 1), which writes Patient.next_eligible_scan_date 2028-03-10
          (link 2), which makes the already-SCHEDULED second order newly ineligible and drives it to
          DENIED with INTERVAL_REVISED_BY_REPORT (link 3), which cancels that order's BOOKED
          appointment with ORDER_DENIED and returns Patient.open_scheduled_order_count to 0 (link 4).
          Nothing in the finalize request mentions the second order or its appointment, and the
          denial ignores PayerPolicy.appeal_allowed even though appeal_allowed would have let the
          order be created in DENIED rather than rejected at creation time.
        test_recipe:
          setup:
            - "Logical clock at 2026-03-10T09:05:00Z, PayerPolicy PAY-STD with a 24-month baseline floor, repeat_scan_grace_days 30 and appeal_allowed false."
