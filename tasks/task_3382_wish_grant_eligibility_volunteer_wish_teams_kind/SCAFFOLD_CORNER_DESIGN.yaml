        distinguishing_aspect: "OCC on Wish.version: after team1 creation advances the wish to version 2, a second team create carrying the stale expected_wish_version == 1 is rejected with 412 ERR_STALE_VERSION; re-reading and retrying with the fresh version succeeds."
