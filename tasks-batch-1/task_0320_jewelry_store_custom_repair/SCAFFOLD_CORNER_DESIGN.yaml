# =============================================================================
# §1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# Jewelry Store & Custom/Repair — EXPERT tier
# Breadth probe across the claim-extraction guide's nine sections.
# Same seven-point recipe contract as §1.8; excluded_because stubs cite §1.8 instances.
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:
      - name: create_customer_returns_201_with_defaults
        claim_type: Creation
        grounds: [entities.Customer.fields.status, entities.Customer.fields.store_credit_balance_cents]
        distinguishing_aspect: "POST /customers with all required fields -> 201; status=ACTIVE, store_credit_balance_cents=0, version=1 on the response."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /customers"
              payload: { full_name: "Ann Beryl", email: "ann.create@x.com", phone: "555-1001" }
              as: SalesAssociate
              captures: { cust_id: $.data.id }
          assert:
            - "response.status == 201"
            - "Customer.${cust_id}.status == ACTIVE"
            - "Customer.${cust_id}.store_credit_balance_cents == 0"
            - "Customer.${cust_id}.version == 1"

      - name: get_customer_not_found_returns_404
        claim_type: Not Found
        grounds: [entities.Customer.fields.id, "errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "GET /customers/{unknown-uuid} -> 404 ERR_NOT_FOUND."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "GET /customers/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: SalesAssociate
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 404"
            - "response.data.error_id == ERR_NOT_FOUND"

      - name: create_inventory_item_missing_required_returns_invalid_request
        claim_type: Required Fields
        grounds: [entities.InventoryItem.fields.list_price_cents, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "POST /inventory-items missing list_price_cents -> 422 ERR_INVALID_REQUEST."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /inventory-items"
              payload: { sku: "NO-PRICE", title: "Ring", metal_karat: "K18" }
              as: StoreManager
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 422"
            - "response.data.error_id == ERR_INVALID_REQUEST"

      - name: create_inventory_item_invalid_enum_karat_returns_invalid_request
        claim_type: Type Constraints
        grounds: [entities.InventoryItem.fields.metal_karat, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "POST /inventory-items with metal_karat='K10' (not in {K14,K18,K24}) -> 422 ERR_INVALID_REQUEST."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /inventory-items"
              payload: { sku: "BAD-K", title: "Ring", metal_karat: "K10", list_price_cents: 100000 }
              as: StoreManager
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 422"
            - "response.data.error_id == ERR_INVALID_REQUEST"

      - name: duplicate_customer_email_returns_409
        claim_type: Type Constraints
        grounds: [entities.Customer.fields.email, "validations[priority=6]", "errors[ERR_DUPLICATE]"]
        distinguishing_aspect: "Second POST /customers with an already-used email -> 409 ERR_DUPLICATE."
        test_recipe:
          setup: ["a customer with email dup@x.com exists"]
          setup_api_calls:
            - call: "POST /customers"
              payload: { full_name: "First Dup", email: "dup@x.com", phone: "555-1002" }
              as: SalesAssociate
              captures: { c1: $.data.id }
          trigger:
            - call: "POST /customers"
              payload: { full_name: "Second Dup", email: "dup@x.com", phone: "555-1003" }
              as: SalesAssociate
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_DUPLICATE"

      - name: duplicate_inventory_sku_returns_409
        claim_type: Type Constraints
        grounds: [entities.InventoryItem.fields.sku, "validations[priority=6]", "errors[ERR_DUPLICATE]"]
        distinguishing_aspect: "Second POST /inventory-items reusing an existing sku -> 409 ERR_DUPLICATE."
        test_recipe:
          setup: ["an item with sku SKU-DUP exists"]
          setup_api_calls:
            - call: "POST /inventory-items"
              payload: { sku: "SKU-DUP", title: "A", metal_karat: "K14", list_price_cents: 100000 }
              as: StoreManager
              captures: { i1: $.data.id }
          trigger:
            - call: "POST /inventory-items"
              payload: { sku: "SKU-DUP", title: "B", metal_karat: "K14", list_price_cents: 200000 }
              as: StoreManager
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_DUPLICATE"

      - name: create_custom_order_unknown_customer_returns_fk_not_found
        claim_type: Parent Relationships
        grounds: [entities.CustomDesignOrder.fields.customer_id, "validations[priority=4]", "errors[ERR_FK_NOT_FOUND]"]
        distinguishing_aspect: "POST /custom-orders with a non-existent customer_id -> 404 ERR_FK_NOT_FOUND (body FK, not path)."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /custom-orders"
              payload: { customer_id: "00000000-0000-0000-0000-000000000000", description: "X", estimated_materials_cents: 100000, design_fee_cents: 0 }
              as: SalesAssociate
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 404"
            - "response.data.error_id == ERR_FK_NOT_FOUND"

      - name: list_customers_pagination_envelope
        claim_type: Listing
        grounds: [endpoints./customers, entities.Customer.fields.id]
        distinguishing_aspect: "GET /customers returns array response_type with pagination fields total_count and has_more."
        test_recipe:
          setup: ["two customers exist"]
          setup_api_calls:
            - call: "POST /customers"
              payload: { full_name: "P One", email: "p1@x.com", phone: "555-1004" }
              as: SalesAssociate
            - call: "POST /customers"
              payload: { full_name: "P Two", email: "p2@x.com", phone: "555-1005" }
              as: SalesAssociate
          trigger:
            - call: "GET /customers"
              payload: {}
              as: SalesAssociate
          assert:
            - "response.response_type == array"
            - "response.data.total_count >= 2"
            - "response.data.has_more is present"

      - name: appraisal_immutable_after_void_no_version_on_payment
        claim_type: Immutability
        grounds: [entities.Payment.fields.outcome, entities.Payment.fields.id]
        distinguishing_aspect: "Payment is common_fields:false (no version field); a created Payment has id and outcome=SUCCEEDED and no version/updated_at semantics."
        test_recipe:
          setup: ["a quoted custom order exists"]
          setup_api_calls:
            - call: "POST /customers"
              payload: { full_name: "Im Mutable", email: "im@x.com", phone: "555-1006" }
              as: SalesAssociate
              captures: { cust_id: $.data.id }
            - call: "POST /custom-orders"
              payload: { customer_id: "${cust_id}", description: "Ring", estimated_materials_cents: 100000, design_fee_cents: 0 }
              as: SalesAssociate
              captures: { co_id: $.data.id, co_v0: $.data.version }
            - call: "POST /custom-orders/${co_id}/quote"
              payload: { expected_version: "${co_v0}" }
              as: SalesAssociate
          trigger:
            - call: "POST /payments"
              payload: { target_type: "CUSTOM_ORDER", custom_order_id: "${co_id}", amount_cents: 1000 }
              as: SalesAssociate
              captures: { pay_id: $.data.id, pay_outcome: $.data.outcome }
          assert:
            - "response.status == 201"
            - "Payment.${pay_id}.outcome == SUCCEEDED"

  # ===========================================================================
  - section: state_machines
    instances:
      - name: quote_from_already_quoted_returns_invalid_state
        claim_type: Invalid Transitions
        grounds: [state_machines.CustomDesignOrder.QUOTED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Calling /quote a second time on an already-QUOTED order -> 409 ERR_INVALID_STATE; no totals recomputed."
        test_recipe:
          setup: ["a QUOTED custom order exists"]
          setup_api_calls:
            - call: "POST /customers"
              payload: { full_name: "Q One", email: "q1@x.com", phone: "555-1007" }
              as: SalesAssociate
              captures: { cust_id: $.data.id }
            - call: "POST /custom-orders"
              payload: { customer_id: "${cust_id}", description: "Ring", estimated_materials_cents: 100000, design_fee_cents: 0 }
              as: SalesAssociate
              captures: { co_id: $.data.id, co_v0: $.data.version }
            - call: "POST /custom-orders/${co_id}/quote"
              payload: { expected_version: "${co_v0}" }
              as: SalesAssociate
              captures: { co_v1: $.data.version }
          trigger:
            - call: "POST /custom-orders/${co_id}/quote"
              payload: { expected_version: "${co_v1}" }
              as: SalesAssociate
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_INVALID_STATE"

      - name: cancel_repair_from_picked_up_terminal_returns_invalid_state
        claim_type: Terminal State Lockdown
        grounds: [state_machines.RepairTicket.READY_to_PICKED_UP, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Cancelling a PICKED_UP (terminal) repair ticket -> 409 ERR_INVALID_STATE."
        test_recipe:
          setup: ["a repair ticket driven to PICKED_UP"]
          setup_api_calls:
            - call: "POST /customers"
              payload: { full_name: "T Erm", email: "term@x.com", phone: "555-1008" }
              as: SalesAssociate
              captures: { cust_id: $.data.id }
            - call: "POST /repair-tickets"
              payload: { customer_id: "${cust_id}", repair_kind: "POLISH", rush: false, promised_at: "2026-07-04T17:00:00Z" }
              as: SalesAssociate
              captures: { rt_id: $.data.id, rt_v0: $.data.version }
            - call: "POST /repair-tickets/${rt_id}/assess"
              payload: { parts_cents: 0, labor_cents: 5000, expected_version: "${rt_v0}" }
              as: Goldsmith
              captures: { rt_v1: $.data.version }
            - call: "POST /repair-tickets/${rt_id}/start-repair"
              payload: { expected_version: "${rt_v1}" }
              as: Goldsmith
              captures: { rt_v2: $.data.version }
            - call: "POST /repair-tickets/${rt_id}/submit-qc"
              payload: { expected_version: "${rt_v2}" }
              as: Goldsmith
              captures: { rt_v3: $.data.version }
            - call: "POST /repair-tickets/${rt_id}/pass-qc"
              payload: { expected_version: "${rt_v3}" }
              as: StoreManager
              captures: { rt_v4: $.data.version }
            - call: "POST /repair-tickets/${rt_id}/pickup"
              payload: { expected_version: "${rt_v4}" }
              as: SalesAssociate
              captures: { rt_v5: $.data.version }
          trigger:
            - call: "POST /repair-tickets/${rt_id}/cancel"
              payload: { expected_version: "${rt_v5}" }
              as: StoreManager
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_INVALID_STATE"

      - name: order_parts_with_zero_parts_returns_no_parts_needed
        claim_type: Precondition Enforcement
        grounds: [state_machines.RepairTicket.ASSESSED_to_AWAITING_PARTS, "validations[priority=12]", "errors[ERR_NO_PARTS_NEEDED]"]
        distinguishing_aspect: "order-parts on an ASSESSED ticket with parts_cents=0 -> 409 ERR_NO_PARTS_NEEDED."
        test_recipe:
          setup: ["a repair ticket assessed with parts_cents=0"]
          setup_api_calls:
            - call: "POST /customers"
              payload: { full_name: "Z Parts", email: "zp@x.com", phone: "555-1009" }
              as: SalesAssociate
              captures: { cust_id: $.data.id }
            - call: "POST /repair-tickets"
              payload: { customer_id: "${cust_id}", repair_kind: "POLISH", rush: false, promised_at: "2026-07-05T17:00:00Z" }
              as: SalesAssociate
              captures: { rt_id: $.data.id, rt_v0: $.data.version }
            - call: "POST /repair-tickets/${rt_id}/assess"
              payload: { parts_cents: 0, labor_cents: 9000, expected_version: "${rt_v0}" }
              as: Goldsmith
              captures: { rt_v1: $.data.version }
          trigger:
            - call: "POST /repair-tickets/${rt_id}/order-parts"
              payload: { expected_version: "${rt_v1}" }
              as: Goldsmith
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_NO_PARTS_NEEDED"

      - name: warranty_approve_without_finalized_appraisal_returns_no_coverage
        claim_type: Precondition Enforcement
        grounds: [state_machines.WarrantyClaim.SUBMITTED_to_APPROVED, "validations[priority=9]", "errors[ERR_NO_COVERAGE]"]
        distinguishing_aspect: "Approving a warranty claim on an item with no FINALIZED appraisal -> 409 ERR_NO_COVERAGE; no repair ticket spawned."
        test_recipe:
          setup: ["an item without any FINALIZED appraisal; a SUBMITTED warranty claim on it"]
          setup_api_calls:
            - call: "POST /customers"
              payload: { full_name: "No Cov", email: "nc@x.com", phone: "555-1010" }
              as: SalesAssociate
              captures: { cust_id: $.data.id }
            - call: "POST /inventory-items"
              payload: { sku: "NOCOV-1", title: "Ring", metal_karat: "K18", list_price_cents: 200000 }
              as: StoreManager
              captures: { item_id: $.data.id }
            - call: "POST /warranty-claims"
              payload: { inventory_item_id: "${item_id}", customer_id: "${cust_id}", defect_description: "Crack" }
              as: SalesAssociate
              captures: { wc_id: $.data.id, wc_v0: $.data.version }
          trigger:
            - call: "POST /warranty-claims/${wc_id}/approve"
              payload: { expected_version: "${wc_v0}" }
              as: StoreManager
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_NO_COVERAGE"

      - name: max_revisions_reached_returns_error
        claim_type: cyclic
        grounds: [state_machines.CustomDesignOrder.DESIGN_REVIEW_to_IN_DESIGN, "validations[priority=10]", "errors[ERR_MAX_REVISIONS_REACHED]"]
        distinguishing_aspect: "request-revision when revision_count has already reached MAX_REVISIONS -> 409 ERR_MAX_REVISIONS_REACHED (cycle termination condition respected)."
        test_recipe:
          setup: ["a DESIGN_REVIEW order whose revision_count == MAX_REVISIONS already (loop exhausted)"]
          setup_api_calls:
            - call: "POST /customers"
              payload: { full_name: "Max Rev", email: "mr@x.com", phone: "555-1011" }
              as: SalesAssociate
              captures: { cust_id: $.data.id }
            - call: "POST /custom-orders"
              payload: { customer_id: "${cust_id}", description: "Ring", estimated_materials_cents: 100000, design_fee_cents: 0 }
              as: SalesAssociate
              captures: { co_id: $.data.id, co_v0: $.data.version }
            - call: "POST /custom-orders/${co_id}/quote"
              payload: { expected_version: "${co_v0}" }
              as: SalesAssociate
              captures: { co_v1: $.data.version }
            - call: "POST /payments"
              payload: { target_type: "CUSTOM_ORDER", custom_order_id: "${co_id}", amount_cents: 36000 }
              as: SalesAssociate
            - call: "POST /custom-orders/${co_id}/start-design"
              payload: { expected_version: "${co_v1}" }
              as: Goldsmith
              captures: { co_v2: $.data.version }
            - call: "POST /custom-orders/${co_id}/submit-review"
              payload: { expected_version: "${co_v2}" }
              as: Goldsmith
              captures: { co_v3: $.data.version }
            - call: "POST /custom-orders/${co_id}/request-revision"
              payload: { expected_version: "${co_v3}" }
              as: SalesAssociate
              captures: { co_v4: $.data.version }
            - call: "POST /custom-orders/${co_id}/submit-review"
              payload: { expected_version: "${co_v4}" }
              as: Goldsmith
              captures: { co_v5: $.data.version }
            - call: "POST /custom-orders/${co_id}/request-revision"
              payload: { expected_version: "${co_v5}" }
              as: SalesAssociate
              captures: { co_v6: $.data.version }
            - call: "POST /custom-orders/${co_id}/submit-review"
              payload: { expected_version: "${co_v6}" }
              as: Goldsmith
              captures: { co_v7: $.data.version }
            - call: "POST /custom-orders/${co_id}/request-revision"
              payload: { expected_version: "${co_v7}" }
              as: SalesAssociate
              captures: { co_v8: $.data.version }
            - call: "POST /custom-orders/${co_id}/submit-review"
              payload: { expected_version: "${co_v8}" }
              as: Goldsmith
              captures: { co_v9: $.data.version }
          trigger:
            - call: "POST /custom-orders/${co_id}/request-revision"
              payload: { expected_version: "${co_v9}" }
              as: SalesAssociate
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_MAX_REVISIONS_REACHED"

      - name: approve_design_empty_line_items_returns_error
        claim_type: Precondition Enforcement
        grounds: [state_machines.CustomDesignOrder.DESIGN_REVIEW_to_APPROVED, "validations[priority=11]", "errors[ERR_LINE_ITEMS_REQUIRED]"]
        distinguishing_aspect: "approve-design with an empty line_items array -> 422 ERR_LINE_ITEMS_REQUIRED."
        test_recipe:
          setup: ["a DESIGN_REVIEW custom order exists"]
          setup_api_calls:
            - call: "POST /customers"
              payload: { full_name: "Empty LI", email: "eli2@x.com", phone: "555-1012" }
              as: SalesAssociate
              captures: { cust_id: $.data.id }
            - call: "POST /custom-orders"
              payload: { customer_id: "${cust_id}", description: "Ring", estimated_materials_cents: 100000, design_fee_cents: 0 }
              as: SalesAssociate
              captures: { co_id: $.data.id, co_v0: $.data.version }
            - call: "POST /custom-orders/${co_id}/quote"
              payload: { expected_version: "${co_v0}" }
              as: SalesAssociate
              captures: { co_v1: $.data.version }
            - call: "POST /payments"
              payload: { target_type: "CUSTOM_ORDER", custom_order_id: "${co_id}", amount_cents: 36000 }
              as: SalesAssociate
            - call: "POST /custom-orders/${co_id}/start-design"
              payload: { expected_version: "${co_v1}" }
              as: Goldsmith
              captures: { co_v2: $.data.version }
            - call: "POST /custom-orders/${co_id}/submit-review"
              payload: { expected_version: "${co_v2}" }
              as: Goldsmith
              captures: { co_v3: $.data.version }
          trigger:
            - call: "POST /custom-orders/${co_id}/approve-design"
              payload: { line_items: [], expected_version: "${co_v3}" }
              as: SalesAssociate
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 422"
            - "response.data.error_id == ERR_LINE_ITEMS_REQUIRED"

      - name: special_order_place_without_deposit_returns_deposit_required
        claim_type: Precondition Enforcement
        grounds: [state_machines.SpecialOrder.REQUESTED_to_PLACED, "validations[priority=13]", "errors[ERR_DEPOSIT_REQUIRED]"]
        distinguishing_aspect: "place a REQUESTED special order with deposit_paid_cents < deposit_required_cents -> 402 ERR_DEPOSIT_REQUIRED."
        test_recipe:
          setup: ["a REQUESTED special order with no payments"]
          setup_api_calls:
            - call: "POST /customers"
              payload: { full_name: "Dep Less", email: "dl@x.com", phone: "555-1013" }
              as: SalesAssociate
              captures: { cust_id: $.data.id }
            - call: "POST /special-orders"
              payload: { customer_id: "${cust_id}", vendor_name: "Acme", catalog_ref: "C-1", quoted_price_cents: 400000 }
              as: SalesAssociate
              captures: { so_id: $.data.id, so_v0: $.data.version }
          trigger:
            - call: "POST /special-orders/${so_id}/place"
              payload: { expected_version: "${so_v0}" }
              as: SalesAssociate
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 402"
            - "response.data.error_id == ERR_DEPOSIT_REQUIRED"

      - name: appraisal_finalize_on_sold_item_returns_item_sold
        claim_type: Precondition Enforcement
        grounds: [state_machines.Appraisal.DRAFT_to_FINALIZED, "validations[priority=9]", "errors[ERR_ITEM_SOLD]"]
        distinguishing_aspect: "Finalizing a DRAFT appraisal whose item is SOLD (via a delivered special order) -> 409 ERR_ITEM_SOLD."
        test_recipe:
          setup: ["an InventoryItem created via a special order then delivered (SOLD), with a DRAFT appraisal booked on it"]
          setup_api_calls:
            - call: "POST /customers"
              payload: { full_name: "Sold It", email: "si@x.com", phone: "555-1014" }
              as: SalesAssociate
              captures: { cust_id: $.data.id }
            - call: "POST /special-orders"
              payload: { customer_id: "${cust_id}", vendor_name: "Acme", catalog_ref: "C-9", quoted_price_cents: 300000 }
              as: SalesAssociate
              captures: { so_id: $.data.id, so_v0: $.data.version }
            - call: "POST /payments"
              payload: { target_type: "SPECIAL_ORDER", special_order_id: "${so_id}", amount_cents: 90000 }
              as: SalesAssociate
            - call: "POST /special-orders/${so_id}/place"
              payload: { expected_version: "${so_v0}" }
              as: SalesAssociate
              captures: { so_v1: $.data.version }
            - call: "POST /special-orders/${so_id}/receive"
              payload: { sku: "SO-RCV", metal_karat: "K18", expected_version: "${so_v1}" }
              as: SalesAssociate
              captures: { so_v2: $.data.version, recv_item_id: $.data.received_inventory_item_id }
            - call: "POST /special-orders/${so_id}/deliver"
              payload: { expected_version: "${so_v2}" }
              as: SalesAssociate
            - call: "POST /appraisals"
              payload: { inventory_item_id: "${recv_item_id}", appraiser_name: "GIA-SOLD", appointment_start: "2026-06-03T09:00:00Z", appointment_end: "2026-06-03T09:30:00Z", market_value_cents: 300000 }
              as: StoreManager
              captures: { apr_id: $.data.id }
            - call: "GET /inventory-items/${recv_item_id}"
              payload: {}
              as: StoreManager
              captures: { item_v: $.data.version }
          trigger:
            - call: "POST /appraisals/${apr_id}/finalize"
              payload: { expected_inventory_item_version: "${item_v}" }
              as: StoreManager
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_ITEM_SOLD"

  # ===========================================================================
  - section: calculations
    instances:
      - name: insurance_replacement_value_default_factor
        claim_type: Correct Result
        grounds: [calculations.insurance_replacement_value, entities.Appraisal.fields.replacement_value_cents, entities.Appraisal.fields.replacement_factor]
        distinguishing_aspect: "Appraisal with market_value_cents=1000000 and default replacement_factor=1.30 -> replacement_value_cents=1300000."
        test_recipe:
          setup: ["an item exists"]
          setup_api_calls:
            - call: "POST /inventory-items"
              payload: { sku: "REPL-1", title: "Ring", metal_karat: "K18", list_price_cents: 1000000 }
              as: StoreManager
              captures: { item_id: $.data.id }
          trigger:
