            - { call: "POST /bookings", payload: { client_id: "${cl2}", package_product_id: "${pkg2}", channel: "CORPORATE", units: 5 }, as: ClientServiceAgent, as_user_id: u_csa, captures: { bk2: "$.data.id" } }
          trigger:
            - { call: "POST /_clock/set_current_utc", payload: { current_utc: "2026-09-02T00:00:00Z" }, as: OperationsManager, as_user_id: u_ops }
            - { call: "POST /operations/daily-run", payload: {}, as: OperationsManager, as_user_id: u_ops, captures: { run_at: "$.data.run_at", lapsed: "$.data.lapsed_tranche_count", overdue: "$.data.overdue_installment_count", shortfalls: "$.data.shortfall_deal_count", changes: "$.data.client_status_change_count" } }
            - { call: "GET /release-tranches/${tr1}", payload: {}, as: RightsManager, as_user_id: u_rights, captures: { t1_st: "$.data.tranche_state", t1_lapsed: "$.data.lapsed_at" } }
            - { call: "GET /release-tranches/${tr2}", payload: {}, as: RightsManager, as_user_id: u_rights, captures: { t2_st: "$.data.tranche_state" } }
            - { call: "GET /rights-deals/${deal1}", payload: {}, as: FinanceController, as_user_id: u_fin, captures: { d1_st: "$.data.deal_status", d1_sf: "$.data.shortfall_units", d1_ml: "$.data.minimum_liability_cents" } }
            - { call: "GET /clients/${cl2}", payload: {}, as: FinanceController, as_user_id: u_fin, captures: { cl2_st: "$.data.client_status", cl2_oc: "$.data.overdue_installment_count" } }
            - { call: "POST /operations/daily-run", payload: {}, as: OperationsManager, as_user_id: u_ops, captures: { lapsed2: "$.data.lapsed_tranche_count", overdue2: "$.data.overdue_installment_count", shortfalls2: "$.data.shortfall_deal_count", changes2: "$.data.client_status_change_count" } }
            - { call: "GET /release-tranches/${tr1}", payload: {}, as: RightsManager, as_user_id: u_rights, captures: { t1_st2: "$.data.tranche_state", t1_lapsed2: "$.data.lapsed_at" } }
          assert: >-
            One call sweeps both events: ${run_at} ==
            "2026-09-02T00:00:00.000Z", ${lapsed} == 2, ${overdue} == 2,
            ${shortfalls} == 2 and ${changes} == 2.
            The swept rows: ${t1_st} == ${t2_st} == "LAPSED" with
            ${t1_lapsed} == "2026-09-02T00:00:00.000Z"; the deal behind the first
            is now ${d1_st} == "SHORTFALL_DECLARED" with ${d1_sf} == 20 and
            ${d1_ml} == 96000 (= 20 * round_half_up(8000 * 0.60)); the second
            client reads ${cl2_st} == "ON_HOLD" with ${cl2_oc} == 1.
            The immediately repeated call reports ${lapsed2} == 0,
            ${overdue2} == 0, ${shortfalls2} == 0 and ${changes2} == 0 — the
            counters are per-run transition counts — while the swept rows are
            untouched: ${t1_st2} == "LAPSED" and ${t1_lapsed2} ==
            "2026-09-02T00:00:00.000Z", i.e. lapsed_at was not restamped.

      - name: the_margin_report_is_a_pure_computed_read
        claim_type: computed_read
        grounds: >-
          endpoints "GET /events/{id}/margin-report" (input ["variant?"], output
          the ten-field report object, side_effects []) and its description
          ("`variant` defaults to PROVISIONAL while the event is live ... and may
          be overridden").
        distinguishing_aspect: >-
          The claim is the ABSENCE of effects: the report is read three times
          around a real mutation and the event's own version and risk fields are
          shown to move only because of the mutation, never because of a read.
          The report is also not an entity — it has no id, no version and no
          created_at — so an implementation that persists a report row and returns
          it fails the repeated-read equality.
        test_recipe:
          setup: >-
            Canonical event with a committed 20-unit deal guaranteeing 20 units
            (minimum_liability 96000 before any release) and no builds, packages
            or bookings.
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { current_utc: "2026-08-01T00:00:00Z" }, as: OperationsManager, as_user_id: u_ops }
            - { call: "POST /events", payload: { name: "Continental Cup Final", sport: "FOOTBALL", venue_name: "Meridian Stadium", hospitality_zone_codes: ["ZONE_A", "ZONE_B"], event_date: "2027-02-01T15:00:00.000Z" }, as: RightsManager, as_user_id: u_rights, captures: { ev_id: "$.data.id" } }
            - { call: "POST /rights-deals", payload: { event_id: "${ev_id}", rights_holder_name: "Meridian FC", inventory_type: "TICKET", contracted_units: 20, guaranteed_minimum_units: 20, unit_cost_cents: 8000 }, as: RightsManager, as_user_id: u_rights, captures: { deal_id: "$.data.id" } }
            - { call: "POST /rights-deals/${deal_id}/commit", payload: {}, as: RightsManager, as_user_id: u_rights }
          trigger:
            - { call: "GET /events/${ev_id}", payload: {}, as: FinanceController, as_user_id: u_fin, captures: { ev_v1: "$.data.version", ev_sc1: "$.data.fulfillment_risk_score" } }
            - { call: "GET /events/${ev_id}/margin-report", payload: {}, as: FinanceController, as_user_id: u_fin, captures: { r1_var: "$.data.variant", r1_rev: "$.data.revenue_cents", r1_rights: "$.data.rights_cost_cents", r1_build: "$.data.build_cost_cents", r1_cost: "$.data.cost_cents", r1_unsold: "$.data.unsold_units", r1_exp: "$.data.unsold_exposure_cents", r1_m: "$.data.margin_cents", r1_nm: "$.data.net_margin_cents", r1_pct: "$.data.margin_pct" } }
            - { call: "GET /events/${ev_id}/margin-report", payload: {}, as: CommercialDirector, as_user_id: u_director, captures: { r2_var: "$.data.variant", r2_cost: "$.data.cost_cents", r2_nm: "$.data.net_margin_cents", r2_pct: "$.data.margin_pct" } }
            - { call: "GET /events/${ev_id}", payload: {}, as: FinanceController, as_user_id: u_fin, captures: { ev_v2: "$.data.version", ev_sc2: "$.data.fulfillment_risk_score" } }
            - { call: "POST /hospitality-builds", payload: { event_id: "${ev_id}", zone_code: "ZONE_A", service_window_start: "2027-02-01T09:00:00.000Z", service_window_end: "2027-02-01T20:00:00.000Z", space_units: 30, catering_covers: 20, staff_count: 5, build_cost_cents: 120000, catering_cost_cents: 60000, staffing_cost_cents: 40000 }, as: OperationsManager, as_user_id: u_ops, captures: { hb: "$.data.id" } }
            - { call: "POST /hospitality-builds/${hb}/approve", payload: {}, as: FinanceController, as_user_id: u_fin }
            - { call: "GET /events/${ev_id}/margin-report", payload: { variant: "PROVISIONAL" }, as: FinanceController, as_user_id: u_fin, captures: { r3_build: "$.data.build_cost_cents", r3_cost: "$.data.cost_cents", r3_nm: "$.data.net_margin_cents", r3_pct: "$.data.margin_pct" } }
          assert: >-
            The first read on a fixture with no revenue answers 200 with
            ${r1_var} == "PROVISIONAL", ${r1_rev} == 0, ${r1_rights} == 96000
            (the committed deal's shortfall liability), ${r1_build} == 0,
            ${r1_cost} == 96000, ${r1_unsold} == 0 (nothing released yet),
            ${r1_exp} == 0, ${r1_m} == -96000, ${r1_nm} == -96000 and
            ${r1_pct} == 0.0000 (revenue 0 leaves the ratio at the declared zero
            rather than dividing by zero).
            Reading it again — under a different authorized role — is
            byte-identical: ${r2_var} == "PROVISIONAL", ${r2_cost} == 96000,
            ${r2_nm} == -96000, ${r2_pct} == 0.0000. The report object carries no
            id, no version and no created_at field at all.
            Nothing moved on the event across the two reads: ${ev_v2} == ${ev_v1}
            and ${ev_sc2} == ${ev_sc1} == 0.
            Only the APPROVED build changes the third read: ${r3_build} ==
            220000, ${r3_cost} == 316000, ${r3_nm} == -316000 and
            ${r3_pct} == 0.0000.

      - name: filtered_list_gets_are_the_only_reverse_path_from_a_child_to_its_parent
        claim_type: cross_reference_link
        grounds: >-
          §1.5 header ("every FK declared in §1.1 is reverse-reachable through
          the matching filtered-list GET") with endpoints "GET /bookings"
          (allocation_block_id?, client_id?, package_product_id?),
          "GET /payment-installments" (booking_id?), "GET /host-assignments"
          (booking_id?, hospitality_build_id?, on_site_host_id?) and
          "GET /package-components" (package_product_id?); flat entity_topology
          (no nested paths).
        distinguishing_aspect: >-
          The fixture creates children of two different parents and then walks
          BACKWARDS from each parent id, so a filter that is silently ignored
          returns the other parent's children too and fails the count. Every hop
          is a root-level collection with a query parameter — there is no
          /bookings/{id}/payment-installments style path to fall back on — and the
          installments were never returned by the call that created them, so the
          filtered list is the only way to discover them at all.
        test_recipe:
          setup: >-
            Canonical event, a fully released 40-unit deal with a CORPORATE block,
            a published two-component BRONZE package, two clients, one 5-unit
            booking each; the first booking is allocated, the second is not.
