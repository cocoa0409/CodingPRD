scenario: |
  Generate task harder than expert level!

  2471. Athletic Field Turf Management & Certification (sports turf management department): field inventory with surface type, age and warranty status for natural and synthetic surfaces, natural turf agronomic program with aeration, overseeding, fertility and irrigation scheduling around usage, synthetic field maintenance including grooming, infill redistribution and seam inspection, safety testing with impact attenuation measurement against thresholds and remediation triggers, field usage allocation and rest periods with rain-out and closure decisions, striping, goal anchoring and equipment safety inspection, field certification documentation for sanctioned competition, replacement planning with capital budgeting and disposal of synthetic materials

domain_name: athletic-field-turf-management
api_prefix: "/turf"

complexity_profile:
  primary_archetype: posture-driven gating
  secondary_archetype: temporal windowing
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers

  entity_topology: flat
  # Ten peer entities linked by foreign keys declared on the child; no nested URL
  # paths. Field is the gating hub every other entity references by `field_id`.

  state_machine_shape: parallel
  # ReplacementPlan carries two independent axes (funding_status x disposal_status);
  # CertificationPacket and RemediationOrder are cyclic; UsageBooking branches.

  relationship_patterns:
    - one_to_many
    - cross_aggregate
    - self_referential

  role_model: segregation_of_duties
  # StaffMember.roles is an array, so one person can be dual-hatted. Every
  # decide/verify step forbids the acting X-User-ID from being the submitter (or,
  # for certification, the inspector who produced the governing assessment).

  consistency_model: immediate

  difficulty_level: above-expert
  # Deliberately above the §0.4 Expert band (10 entities / 40 endpoints /
  # 47 error codes / 13 calculations / 10 state machines) because the scenario
  # explicitly asks for a task harder than expert level. Density, not padding:
  # every entity except CapitalBudget hangs off Field's derived posture, and the
  # posture is what gates usage, certification and replacement.

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# 1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Field
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: human-readable field name used on certification paperwork
        constraints: 1..120 chars, unique across non-retired fields
      - name: surface_type
        type: enum
        source: input
        description: physical surface family that determines which maintenance task types apply
        constraints: NATURAL_GRASS | SYNTHETIC_TURF
      - name: installed_on_date
        type: datetime
        source: input
        description: ISO 8601 UTC instant the surface was placed in service; drives age_years
      - name: expected_life_years
        type: integer
        source: input
        description: manufacturer/agronomic service life in whole years used by the age component
        constraints: 1..30
      - name: area_sq_ft
        type: integer
        source: input
        description: playing surface area in square feet, used by replacement cost estimation
        constraints: 1..400000
      - name: sanctioned_level
        type: enum
        source: input
        description: highest sanctioning body level this field is presented for
        constraints: NONE | LOCAL | REGIONAL | STATE
      - name: warranty_expires_on
        type: datetime
        source: input
        description: ISO 8601 UTC instant the surface warranty lapses; null means no warranty was ever issued
        default: null
      - name: infill_depth_mm
        type: number
        source: input
        description: measured synthetic infill depth in millimetres; required when surface_type is SYNTHETIC_TURF, must be null otherwise
        default: null
        constraints: 0.0..80.0, one decimal place
      - name: predecessor_field_id
        type: string
        source: input
        description: "FK -> Field.id; the retired field this field replaced, null for an original installation (self-referential)"
        default: null
      - name: age_years
        type: number
        source: computed
        description: computed by calculations.field_age_and_warranty_status from installed_on_date and the logical clock
      - name: warranty_status
        type: enum
        source: computed
        description: computed by calculations.field_age_and_warranty_status
        constraints: ACTIVE | EXPIRED | NONE
      - name: admin_closure_active
        type: boolean
        source: computed
        description: true while a CLOSE_ADMIN closure order is in force; cleared by REOPEN_ADMIN
        default: false
      - name: admin_closure_reason_code
        type: string
        source: computed
        description: reason_code recorded by the most recent CLOSE_ADMIN closure order, null when no closure is in force
        default: null
      - name: retired_at
        type: datetime
        source: computed
        description: instant the field was retired by a completed ReplacementPlan disposal, null while in service
        default: null
      - name: play_status
        type: enum
        source: computed
        description: derived gating posture computed by calculations.field_play_status; gates every UsageBooking operation
        constraints: OPEN | RESTRICTED | CLOSED_ADMIN | CLOSED_UNSAFE | RETIRED
      - name: certification_status
        type: enum
        source: computed
        description: derived certification posture computed by calculations.field_certification_status
        constraints: NOT_CERTIFIED | PENDING_REVIEW | CERTIFIED | EXPIRED
      - name: certified_until_utc
        type: datetime
        source: computed
        description: expiry instant copied from the currently APPROVED CertificationPacket, null when none
        default: null
      - name: latest_gmax_mean_value
        type: number
        source: computed
        description: gmax_mean_value of the RECORDED IMPACT_ATTENUATION SafetyAssessment on this field, null when none exists
        default: null
      - name: cumulative_wear_units
        type: number
        source: computed
        description: computed by calculations.field_cumulative_wear_units as the sum of UsageLedgerEntry.wear_units_delta for this field
        default: 0.00
      - name: usage_hours_ytd
        type: number
        source: computed
        description: sum of actual_duration_hours over this field's bookings with status PLAYED whose closed_out_at_utc falls in the current calendar year
        default: 0.00
      - name: rest_debt_hours
        type: number
        source: computed
        description: computed by calculations.field_rest_debt_hours; positive value forces the RESTRICTED posture
        default: 0.00
      - name: nitrogen_applied_ytd_lb_per_1000_sq_ft
        type: number
        source: computed
        description: sum of nitrogen_lb_per_1000_sq_ft over this field's COMPLETED FERTILITY MaintenanceTasks whose completed_at_utc falls in the current calendar year
        default: 0.00
      - name: condition_index_agronomic
        type: number
        source: computed
        description: computed by calculations.field_condition_index using the AGRONOMIC variant
      - name: open_mandatory_remediation_count
        type: integer
        source: computed
        description: count of this field's RemediationOrders with severity MANDATORY and status IN {OPEN, VERIFICATION_SUBMITTED}
        default: 0
      - name: open_advisory_remediation_count
        type: integer
        source: computed
        description: count of this field's RemediationOrders with severity ADVISORY and status IN {OPEN, VERIFICATION_SUBMITTED}
        default: 0
      - name: open_certification_packet_count
        type: integer
        source: computed
        description: count of this field's CertificationPackets with status IN {DRAFT, SUBMITTED, RETURNED}
        default: 0
      - name: open_replacement_plan_count
        type: integer
        source: computed
        description: count of this field's ReplacementPlans with funding_status IN {DRAFT, SUBMITTED, DEFERRED, APPROVED}
        default: 0
      - name: unsafe_cancellation_count
        type: integer
        source: computed
        description: count of this field's UsageBookings with status CANCELLED_UNSAFE
        default: 0

  - name: StaffMember
    parent: null
    common_fields: true
    fields:
      - name: full_name
        type: string
        source: input
        description: staff member name recorded on inspection and certification paperwork
        constraints: 1..120 chars
      - name: roles
        type: array
        source: input
        description: RBAC role names this person may act as; a person may be dual-hatted, which is what makes the segregation-of-duties checks bite
        constraints: non-empty subset of {FieldOperationsCoordinator, TurfAgronomist, SafetyInspector, CertificationOfficer, FacilitiesDirector}, no duplicates
      - name: employment_status
        type: enum
        source: input
        description: whether the person may currently act at all
        default: ACTIVE
        constraints: ACTIVE | INACTIVE

  - name: MaintenanceTask
    parent: null
    common_fields: true
    fields:
      - name: field_id
        type: string
        source: input
        description: "FK -> Field.id; the field this task is performed on"
      - name: assigned_staff_member_id
        type: string
        source: input
        description: "FK -> StaffMember.id; the person occupying the scheduled window"
      - name: task_type
        type: enum
        source: input
        description: agronomic or synthetic maintenance operation; must match the field's surface class
        constraints: AERATION | OVERSEEDING | FERTILITY | IRRIGATION | GROOMING | INFILL_REDISTRIBUTION | SEAM_INSPECTION
      - name: scheduled_start_utc
        type: datetime
        source: input
        description: ISO 8601 UTC start of the maintenance window (inclusive)
      - name: scheduled_end_utc
        type: datetime
        source: input
        description: ISO 8601 UTC end of the maintenance window (inclusive); must be strictly after scheduled_start_utc
      - name: planned_for_certification_window
        type: boolean
        source: input
        description: true when this task is part of the documented agronomic program counted by the certification completeness score
        default: false
      - name: nitrogen_lb_per_1000_sq_ft
        type: number
        source: input
        description: nitrogen application rate; required when task_type is FERTILITY, must be null for every other task_type
        default: null
        constraints: 0.00..6.00, two decimal places
      - name: surface_class
        type: enum
        source: computed
        description: copied from the referenced Field.surface_type at creation and frozen
        constraints: NATURAL_GRASS | SYNTHETIC_TURF
      - name: recovery_credit_hours
        type: number
        source: computed
        description: rest-hour credit this task grants once COMPLETED, materialised at creation from calculations.field_rest_debt_hours constant RECOVERY_CREDIT_HOURS[task_type]
      - name: status
        type: enum
        source: computed
        description: lifecycle state driven by POST /turf/maintenance-tasks/{id}/transition
        constraints: SCHEDULED | IN_PROGRESS | COMPLETED | CANCELLED
      - name: started_at_utc
        type: datetime
        source: computed
        description: logical-clock instant of the START transition, null before it
        default: null
      - name: completed_at_utc
        type: datetime
        source: computed
        description: completion instant supplied to the COMPLETE transition, null before it
        default: null
      - name: cancellation_reason
        type: string
        source: computed
        description: reason recorded by the CANCEL transition, null otherwise
        default: null

  - name: SafetyAssessment
    parent: null
    common_fields: true
    fields:
      - name: field_id
        type: string
        source: input
        description: "FK -> Field.id; the field that was tested or inspected"
      - name: inspector_staff_member_id
        type: string
        source: input
        description: "FK -> StaffMember.id; the SafetyInspector who performed the test"
      - name: assessment_type
        type: enum
        source: input
        description: which safety surface is being evidenced
        constraints: IMPACT_ATTENUATION | GOAL_ANCHORING | STRIPING_LAYOUT
      - name: assessed_at_utc
        type: datetime
        source: input
        description: ISO 8601 UTC instant the test was performed; must not be after the logical clock
      - name: gmax_readings
        type: array
        source: input
        description: exactly three g-max drop readings in g; required when assessment_type is IMPACT_ATTENUATION, must be null otherwise
        default: null
        constraints: array of exactly 3 numbers, each 50.0..400.0, one decimal place
      - name: declared_result
        type: enum
        source: input
        description: inspector verdict for the non-instrumented inspections; required when assessment_type is GOAL_ANCHORING or STRIPING_LAYOUT, must be null otherwise
        default: null
        constraints: PASS | FAIL
      - name: gmax_mean_value
        type: number
        source: computed
        description: computed by calculations.impact_attenuation_result as the one-decimal mean of gmax_readings, null for non-instrumented types
        default: null
      - name: result
        type: enum
        source: computed
        description: computed by calculations.impact_attenuation_result for IMPACT_ATTENUATION, copied from declared_result otherwise
        constraints: PASS | ADVISORY | FAIL
      - name: status
        type: enum
        source: computed
        description: RECORDED until superseded by a newer assessment of the same assessment_type on the same field, or voided
        constraints: RECORDED | SUPERSEDED | VOIDED
      - name: superseded_at_utc
        type: datetime
        source: computed
        description: instant this assessment was superseded, null while RECORDED or VOIDED
        default: null
      - name: void_reason
        type: string
        source: computed
        description: reason recorded by POST /turf/safety-assessments/{id}/void, null otherwise
        default: null

  - name: RemediationOrder
    parent: null
    common_fields: true
    fields:
      - name: field_id
        type: string
        source: input
        description: "FK -> Field.id; cascade-copied from the source assessment, never client-supplied"
      - name: source_assessment_id
        type: string
        source: input
        description: "FK -> SafetyAssessment.id; the FAIL or ADVISORY assessment that opened this order, cascade-set at creation"
      - name: verification_assessment_id
        type: string
        source: input
        description: "FK -> SafetyAssessment.id; the re-test offered as evidence of remediation, null until a verification is submitted"
        default: null
      - name: submitted_by_staff_member_id
        type: string
        source: input
        description: "FK -> StaffMember.id; the TurfAgronomist who submitted the verification, null until then and cleared on rejection"
        default: null
      - name: severity
        type: enum
        source: computed
        description: MANDATORY when the source assessment result is FAIL, ADVISORY when it is ADVISORY
        constraints: MANDATORY | ADVISORY
      - name: status
        type: enum
        source: computed
        description: remediation lifecycle; returns to OPEN when a verification is rejected
        constraints: OPEN | VERIFICATION_SUBMITTED | CLOSED_VERIFIED | CANCELLED
      - name: opened_at_utc
        type: datetime
        source: computed
        description: logical-clock instant the cascade created this order
      - name: remediation_notes
        type: string
        source: computed
        description: notes supplied with the most recent verification submission, null before the first submission
        default: null
      - name: rejection_count
        type: integer
        source: computed
        description: number of times a submitted verification has been rejected, incremented on each REJECT decision
        default: 0
      - name: closed_at_utc
        type: datetime
        source: computed
        description: instant the order reached CLOSED_VERIFIED or CANCELLED, null while open
        default: null

  - name: UsageBooking
    parent: null
    common_fields: true
    fields:
      - name: field_id
        type: string
        source: input
        description: "FK -> Field.id; the field being allocated"
      - name: requested_by_staff_member_id
        type: string
        source: input
        description: "FK -> StaffMember.id; the coordinator who requested the allocation"
      - name: activity_type
        type: enum
        source: input
        description: intensity class of the activity; drives the wear intensity multiplier and the posture gate
        constraints: PRACTICE | GAME | TOURNAMENT | COMMUNITY
      - name: window_start_utc
        type: datetime
        source: input
        description: ISO 8601 UTC start of the half-open occupation interval [window_start_utc, window_end_utc)
      - name: window_end_utc
        type: datetime
        source: input
        description: ISO 8601 UTC end of the half-open occupation interval; must be strictly after window_start_utc
      - name: expected_participant_count
        type: integer
        source: input
        description: forecast participant headcount used only for capacity screening, not for wear
        constraints: 1..500
      - name: status
        type: enum
        source: computed
        description: booking lifecycle; branches at close-out into three outcomes and can be cascade-cancelled
        constraints: SCHEDULED | CONFIRMED | PLAYED | RAINED_OUT | CANCELLED_LATE | CANCELLED_UNSAFE
      - name: started_with_rest_debt
        type: boolean
        source: computed
        description: stamped at CONFIRM as (Field.rest_debt_hours > 0.00); counted by the certification usage-rest component
        default: null
      - name: confirmed_at_utc
        type: datetime
        source: computed
        description: logical-clock instant of the CONFIRM transition, null before it
        default: null
      - name: outcome
        type: enum
        source: computed
        description: close-out outcome copied from the close-out request, null before close-out
        default: null
        constraints: PLAYED | RAINED_OUT | CANCELLED_LATE
      - name: actual_duration_hours
        type: number
        source: computed
        description: played duration in hours supplied at close-out, null before close-out
        default: null
      - name: actual_participant_count
        type: integer
        source: computed
        description: observed headcount supplied at close-out, null before close-out
        default: null
      - name: weather_condition
        type: enum
        source: computed
        description: weather class supplied at close-out, null before close-out
        default: null
        constraints: DRY | WET
      - name: wear_load_units
        type: number
        source: computed
        description: computed by calculations.wear_load_units at close-out, null before close-out
        default: null
      - name: rest_requirement_hours
        type: number
        source: computed
        description: computed by calculations.rest_requirement_hours at close-out, null before close-out
        default: null
      - name: closed_out_at_utc
        type: datetime
        source: computed
        description: logical-clock instant of the close-out transition, null before it
        default: null

  - name: UsageLedgerEntry
    parent: null
    common_fields: false
    fields:
      - name: field_id
        type: string
        source: input
        description: "FK -> Field.id; the field whose wear balance this entry moves"
      - name: booking_id
        type: string
        source: input
        description: "FK -> UsageBooking.id; the booking that produced this entry, null for maintenance-sourced entries"
        default: null
      - name: maintenance_task_id
        type: string
        source: input
        description: "FK -> MaintenanceTask.id; the completed task that produced this entry, null for booking-sourced entries"
        default: null
      - name: entry_type
        type: enum
        source: computed
        description: which side-effect appended this immutable entry
        constraints: PLAY_WEAR | RAIN_OUT_RELIEF | LATE_CANCEL_WEAR | UNSAFE_CANCELLATION | RECOVERY_CREDIT
      - name: wear_units_delta
        type: number
        source: computed
        description: signed wear-unit movement; the conserved quantity Field.cumulative_wear_units must always equal the sum of this column for the field
      - name: rest_requirement_hours
        type: number
        source: computed
        description: rest hours this entry obligates, 0.00 for every entry_type other than PLAY_WEAR
        default: 0.00
      - name: rest_credit_hours
        type: number
        source: computed
        description: rest hours this entry credits back, non-zero only for RECOVERY_CREDIT
        default: 0.00
      - name: rest_window_end_utc
        type: datetime
        source: computed
        description: booking window_end_utc plus rest_requirement_hours, null for every entry_type other than PLAY_WEAR
        default: null
      - name: effective_at_utc
        type: datetime
        source: computed
        description: logical-clock instant the entry was appended; ledger replay order is effective_at_utc ASC then created_at ASC
      - name: running_balance_after
        type: number
        source: computed
        description: Field.cumulative_wear_units immediately after this entry was applied
      - name: note
        type: string
        source: computed
        description: short machine-generated audit note naming the triggering transition

  - name: CertificationPacket
    parent: null
    common_fields: true
    fields:
      - name: field_id
        type: string
        source: input
        description: "FK -> Field.id; the field being certified for sanctioned competition"
      - name: governing_assessment_id
        type: string
        source: input
        description: "FK -> SafetyAssessment.id; the IMPACT_ATTENUATION assessment this packet rests on"
      - name: submitted_by_staff_member_id
        type: string
        source: input
        description: "FK -> StaffMember.id; the CertificationOfficer who submitted the packet, null while DRAFT"
        default: null
      - name: decided_by_staff_member_id
        type: string
        source: input
        description: "FK -> StaffMember.id; the CertificationOfficer who decided the packet, null before a decision"
        default: null
      - name: competition_season_label
        type: string
        source: input
        description: season label printed on the certification document
        constraints: 1..40 chars
      - name: status
        type: enum
        source: computed
        description: cyclic packet lifecycle; RETURNED packets may be resubmitted
        constraints: DRAFT | SUBMITTED | APPROVED | RETURNED | SUPERSEDED
      - name: documentation_completeness_score
        type: number
        source: computed
        description: computed by calculations.certification_document_completeness_score at each submission, null while DRAFT
        default: null
      - name: condition_index_certification
        type: number
        source: computed
        description: computed by calculations.field_condition_index using the CERTIFICATION variant at each submission, null while DRAFT
        default: null
      - name: submitted_at_utc
        type: datetime
        source: computed
        description: logical-clock instant of the most recent submission, null while DRAFT
        default: null
      - name: decided_at_utc
        type: datetime
        source: computed
        description: logical-clock instant of the most recent decision, null before any decision
        default: null
      - name: certified_until_utc
        type: datetime
        source: computed
        description: decided_at_utc plus CERTIFICATION_VALID_DAYS, set only on APPROVE
        default: null
      - name: decision_notes
        type: string
        source: computed
        description: notes recorded with the most recent decision, null before any decision
        default: null
      - name: return_count
        type: integer
        source: computed
        description: number of RETURN decisions taken on this packet
        default: 0

  - name: CapitalBudget
    parent: null
    common_fields: true
    fields:
      - name: fiscal_year
        type: integer
        source: input
        description: fiscal year this authorisation covers
        constraints: 2020..2040, unique across CapitalBudget
      - name: total_authorized_amount_cents
        type: integer
        source: input
        description: total capital authorisation in integer cents
        constraints: 1..99999999999
      - name: committed_amount_cents
        type: integer
        source: computed
        description: computed by calculations.capital_budget_commitment as the sum of plan_funding_amount_cents over this budget's APPROVED ReplacementPlans
        default: 0
      - name: available_amount_cents
        type: integer
        source: computed
        description: total_authorized_amount_cents minus committed_amount_cents
      - name: lock_threshold_amount_cents
        type: integer
        source: computed
        description: computed by calculations.capital_budget_commitment as round_half_up(total_authorized_amount_cents * BUDGET_LOCK_TRIGGER_RATIO)
      - name: status
        type: enum
        source: computed
        description: OPEN while committed_amount_cents is below lock_threshold_amount_cents, LOCKED at or above it
        constraints: OPEN | LOCKED

  - name: ReplacementPlan
    parent: null
    common_fields: true
    fields:
      - name: field_id
        type: string
        source: input
        description: "FK -> Field.id; the field to be replaced"
      - name: capital_budget_id
        type: string
        source: input
        description: "FK -> CapitalBudget.id; the authorisation this plan draws against"
      - name: submitted_by_staff_member_id
        type: string
        source: input
        description: "FK -> StaffMember.id; the FacilitiesDirector who submitted the plan, null while DRAFT"
        default: null
      - name: decided_by_staff_member_id
        type: string
        source: input
        description: "FK -> StaffMember.id; the FacilitiesDirector who decided the plan, null before a decision"
        default: null
      - name: target_surface_type
        type: enum
        source: input
        description: surface family to be installed by this replacement
        constraints: NATURAL_GRASS | SYNTHETIC_TURF
      - name: area_sq_ft
        type: integer
        source: input
        description: area to be replaced in square feet, priced by COST_PER_SQ_FT_CENTS
        constraints: 1..400000
      - name: priority_basis
        type: enum
        source: input
        description: selects which variant of calculations.replacement_priority_score scores this plan
        constraints: REMAINING_LIFE | CONDITION_RISK
      - name: planned_install_year
        type: integer
        source: input
        description: calendar year the replacement is planned for
        constraints: 2026..2040
      - name: base_construction_cents
        type: integer
        source: computed
        description: area_sq_ft multiplied by COST_PER_SQ_FT_CENTS[target_surface_type]
      - name: disposal_cents
        type: integer
        source: computed
        description: synthetic removal and disposal cost, 0 when the existing Field.surface_type is NATURAL_GRASS
      - name: pre_contingency_subtotal_cents
        type: integer
        source: computed
        description: base_construction_cents plus disposal_cents; the value the contingency tier is keyed on
      - name: contingency_rate
        type: number
        source: computed
        description: tier rate selected from CONTINGENCY_TIERS by pre_contingency_subtotal_cents
      - name: contingency_cents
        type: integer
        source: computed
        description: round_half_up(pre_contingency_subtotal_cents * contingency_rate) in integer cents
      - name: plan_funding_amount_cents
        type: integer
        source: computed
        description: computed by calculations.plan_funding_amount_cents as pre_contingency_subtotal_cents plus contingency_cents
      - name: replacement_priority_score
        type: number
        source: computed
        description: computed by calculations.replacement_priority_score using the variant named by priority_basis
      - name: funding_status
        type: enum
        source: computed
        description: first independent state axis - the capital approval lifecycle
        constraints: DRAFT | SUBMITTED | APPROVED | REJECTED | RESCINDED | DEFERRED
      - name: disposal_status
        type: enum
        source: computed
        description: second independent state axis - synthetic material disposal lifecycle, NOT_APPLICABLE when the existing Field.surface_type is NATURAL_GRASS
        constraints: NOT_APPLICABLE | PENDING | MANIFESTED | COMPLETED
      - name: manifest_reference
        type: string
        source: computed
        description: waste manifest reference recorded by the disposal-manifest transition, null before it
        default: null
      - name: disposal_facility_name
        type: string
        source: computed
        description: receiving facility recorded by the disposal-manifest transition, null before it
        default: null
      - name: diverted_tonnage
        type: number
        source: computed
        description: tonnage diverted from landfill recorded by the disposal-manifest transition, null before it
        default: null
      - name: total_tonnage
        type: number
        source: computed
        description: total tonnage removed recorded by the disposal-manifest transition, null before it
        default: null
      - name: diversion_ratio
        type: number
        source: computed
        description: round_half_up(diverted_tonnage / total_tonnage, 2), null before the disposal-manifest transition
        default: null
      - name: submitted_at_utc
        type: datetime
        source: computed
        description: logical-clock instant of the SUBMIT transition, null before it
        default: null
      - name: decided_at_utc
        type: datetime
        source: computed
        description: logical-clock instant of the most recent funding decision, null before any decision
        default: null
      - name: completed_at_utc
        type: datetime
        source: computed
        description: completion instant supplied to the disposal COMPLETE transition, null before it
        default: null
      - name: decision_notes
        type: string
        source: computed
        description: notes recorded with the most recent funding decision, null before any decision
        default: null

# =============================================================================
# 1.2 State Machine Table
# =============================================================================
state_machines:
  # ---------------------------------------------------------------- Field posture
  - entity: Field
    state_field: play_status
    initial_state: OPEN
    terminal_states: [RETIRED]
    note: |
      Derived gating posture. Every transition below is a system recomputation of
      calculations.field_play_status after some other entity changed; there is no
      endpoint that writes play_status directly. Precedence is strict:
      RETIRED > CLOSED_UNSAFE > CLOSED_ADMIN > RESTRICTED > OPEN.
    transitions:
      - from: OPEN
        to: RESTRICTED
        trigger: "system: recompute field_play_status after Field.rest_debt_hours or Field.open_advisory_remediation_count changed"
        actor: system
        preconditions:
          - "Field.retired_at IS NULL"
          - "Field.open_mandatory_remediation_count == 0"
          - "Field.admin_closure_active == false"
          - "Field.rest_debt_hours > 0.00 OR Field.open_advisory_remediation_count > 0"
        side_effects:
          - "UsageBooking creation and confirmation for activity_type IN {GAME, TOURNAMENT} on this field now fail with ERR_FIELD_RESTRICTED_FOR_ACTIVITY"
          - "activity_type IN {PRACTICE, COMMUNITY} remains permitted"
      - from: RESTRICTED
        to: OPEN
        trigger: "system: recompute field_play_status after Field.rest_debt_hours reached 0.00 and Field.open_advisory_remediation_count reached 0"
        actor: system
        preconditions:
          - "Field.retired_at IS NULL"
          - "Field.open_mandatory_remediation_count == 0"
          - "Field.admin_closure_active == false"
          - "Field.rest_debt_hours == 0.00 AND Field.open_advisory_remediation_count == 0"
        side_effects:
          - "all four activity_type values become bookable again"
      - from: OPEN
        to: CLOSED_UNSAFE
        trigger: "system: recompute field_play_status after Field.open_mandatory_remediation_count became > 0"
        actor: system
        preconditions:
          - "Field.retired_at IS NULL"
          - "Field.open_mandatory_remediation_count > 0"
        side_effects:
          - "cascade hop 4: every UsageBooking on this field with status IN {SCHEDULED, CONFIRMED} and window_start_utc >= current_utc transitions to CANCELLED_UNSAFE (ordered by window_start_utc ASC, then created_at ASC)"
          - "cascade hop 5: each such cancellation appends a UsageLedgerEntry with entry_type UNSAFE_CANCELLATION and wear_units_delta 0.00, increments Field.unsafe_cancellation_count by 1, and forces a recompute of Field.rest_debt_hours"
          - "no UsageBooking already in a terminal status is touched"
      - from: RESTRICTED
        to: CLOSED_UNSAFE
        trigger: "system: recompute field_play_status after Field.open_mandatory_remediation_count became > 0"
        actor: system
        preconditions:
          - "Field.retired_at IS NULL"
          - "Field.open_mandatory_remediation_count > 0"
        side_effects:
          - "identical cascade to the OPEN -> CLOSED_UNSAFE transition"
      - from: CLOSED_UNSAFE
        to: OPEN
        trigger: "system: recompute field_play_status after the last MANDATORY RemediationOrder reached CLOSED_VERIFIED or CANCELLED"
        actor: system
        preconditions:
          - "Field.open_mandatory_remediation_count == 0"
          - "Field.admin_closure_active == false"
          - "Field.rest_debt_hours == 0.00 AND Field.open_advisory_remediation_count == 0"
        side_effects:
          - "already CANCELLED_UNSAFE bookings are NOT reinstated"
      - from: CLOSED_UNSAFE
        to: RESTRICTED
        trigger: "system: recompute field_play_status after the last MANDATORY RemediationOrder closed while rest debt or an advisory order remains"
        actor: system
        preconditions:
          - "Field.open_mandatory_remediation_count == 0"
          - "Field.admin_closure_active == false"
          - "Field.rest_debt_hours > 0.00 OR Field.open_advisory_remediation_count > 0"
        side_effects:
          - "already CANCELLED_UNSAFE bookings are NOT reinstated"
      - from: OPEN
        to: CLOSED_ADMIN
        trigger: "POST /turf/fields/{id}/closure-order with action CLOSE_ADMIN"
        actor: FacilitiesDirector
        preconditions:
          - "Field.retired_at IS NULL"
          - "Field.admin_closure_active == false"
          - "Field.open_mandatory_remediation_count == 0"
        side_effects:
          - "Field.admin_closure_active := true; Field.admin_closure_reason_code := reason_code"
          - "Field.version increments by 1"
          - "DELIBERATE DIVERGENCE from CLOSED_UNSAFE: existing UsageBookings are NOT cancelled by an administrative closure, they simply cannot be created or confirmed while the closure is in force"
      - from: RESTRICTED
        to: CLOSED_ADMIN
        trigger: "POST /turf/fields/{id}/closure-order with action CLOSE_ADMIN"
        actor: FacilitiesDirector
        preconditions:
          - "Field.retired_at IS NULL"
          - "Field.admin_closure_active == false"
          - "Field.open_mandatory_remediation_count == 0"
        side_effects:
          - "identical to the OPEN -> CLOSED_ADMIN transition"
      - from: CLOSED_ADMIN
        to: OPEN
        trigger: "POST /turf/fields/{id}/closure-order with action REOPEN_ADMIN"
        actor: FacilitiesDirector
        preconditions:
          - "Field.admin_closure_active == true"
          - "Field.open_mandatory_remediation_count == 0"
          - "Field.rest_debt_hours == 0.00 AND Field.open_advisory_remediation_count == 0"
        side_effects:
          - "Field.admin_closure_active := false; Field.admin_closure_reason_code := null"
          - "Field.version increments by 1"
      - from: CLOSED_ADMIN
        to: RESTRICTED
        trigger: "POST /turf/fields/{id}/closure-order with action REOPEN_ADMIN while rest debt or an advisory order remains"
        actor: FacilitiesDirector
        preconditions:
          - "Field.admin_closure_active == true"
          - "Field.open_mandatory_remediation_count == 0"
          - "Field.rest_debt_hours > 0.00 OR Field.open_advisory_remediation_count > 0"
        side_effects:
          - "Field.admin_closure_active := false; Field.admin_closure_reason_code := null"
          - "Field.version increments by 1"
      - from: OPEN
        to: RETIRED
        trigger: "POST /turf/replacement-plans/{id}/complete"
        actor: FacilitiesDirector
        preconditions:
          - "the completing ReplacementPlan.field_id == Field.id"
          - "ReplacementPlan.funding_status == APPROVED"
          - "ReplacementPlan.disposal_status == MANIFESTED"
        side_effects:
          - "Field.retired_at := completed_at_utc"
          - "every UsageBooking on this field with status IN {SCHEDULED, CONFIRMED} transitions to CANCELLED_UNSAFE with an UNSAFE_CANCELLATION ledger entry"
          - "Field.version increments by 1"
      - from: RESTRICTED
        to: RETIRED
        trigger: "POST /turf/replacement-plans/{id}/complete"
        actor: FacilitiesDirector
        preconditions:
          - "same as the OPEN -> RETIRED transition"
        side_effects:
          - "same as the OPEN -> RETIRED transition"
      - from: CLOSED_UNSAFE
        to: RETIRED
        trigger: "POST /turf/replacement-plans/{id}/complete"
        actor: FacilitiesDirector
        preconditions:
          - "same as the OPEN -> RETIRED transition"
        side_effects:
          - "same as the OPEN -> RETIRED transition"
      - from: CLOSED_ADMIN
        to: RETIRED
        trigger: "POST /turf/replacement-plans/{id}/complete"
        actor: FacilitiesDirector
        preconditions:
          - "same as the OPEN -> RETIRED transition"
        side_effects:
          - "same as the OPEN -> RETIRED transition"

  # -------------------------------------------------------- Field certification
  - entity: Field
    state_field: certification_status
    initial_state: NOT_CERTIFIED
    terminal_states: []
    note: |
      Cyclic derived posture recomputed by calculations.field_certification_status
      after any CertificationPacket transition and on every clock advance. A field
      may cycle NOT_CERTIFIED -> PENDING_REVIEW -> CERTIFIED -> EXPIRED ->
      PENDING_REVIEW indefinitely.
    transitions:
      - from: NOT_CERTIFIED
        to: PENDING_REVIEW
        trigger: "POST /turf/certification-packets/{id}/submit"
        actor: CertificationOfficer
        preconditions:
          - "at least one CertificationPacket on this field has status SUBMITTED"
        side_effects:
          - "Field.version increments by 1"
      - from: PENDING_REVIEW
        to: CERTIFIED
        trigger: "POST /turf/certification-packets/{id}/decide with decision APPROVE"
        actor: CertificationOfficer
        preconditions:
          - "the approved packet's certified_until_utc > current_utc"
        side_effects:
          - "Field.certified_until_utc := approved packet certified_until_utc"
          - "TOURNAMENT bookings on this field may now be confirmed"
      - from: PENDING_REVIEW
        to: NOT_CERTIFIED
        trigger: "POST /turf/certification-packets/{id}/decide with decision RETURN"
        actor: CertificationOfficer
        preconditions:
          - "no other CertificationPacket on this field has status SUBMITTED"
          - "no CertificationPacket on this field has status APPROVED with certified_until_utc > current_utc"
        side_effects:
          - "Field.certified_until_utc stays null"
      - from: PENDING_REVIEW
        to: CERTIFIED
        trigger: "POST /turf/certification-packets/{id}/decide with decision RETURN while a still-valid APPROVED packet exists"
        actor: CertificationOfficer
        preconditions:
          - "a CertificationPacket on this field has status APPROVED with certified_until_utc > current_utc"
        side_effects:
          - "Field.certified_until_utc is unchanged"
        note: "a returned resubmission never revokes an in-force certification"
      - from: CERTIFIED
        to: EXPIRED
        trigger: "POST /_clock/set_current_utc advancing current_utc to or past Field.certified_until_utc"
        actor: system
        preconditions:
          - "Field.certified_until_utc <= current_utc"
          - "no CertificationPacket on this field has status SUBMITTED"
        side_effects:
          - "TOURNAMENT bookings on this field can no longer be confirmed"
      - from: EXPIRED
        to: PENDING_REVIEW
        trigger: "POST /turf/certification-packets/{id}/submit"
        actor: CertificationOfficer
        preconditions:
          - "at least one CertificationPacket on this field has status SUBMITTED"
        side_effects:
          - "Field.version increments by 1"
      - from: CERTIFIED
        to: PENDING_REVIEW
        trigger: "POST /turf/certification-packets/{id}/submit for a later season while the current certification is still in force"
        actor: CertificationOfficer
        preconditions:
          - "at least one CertificationPacket on this field has status SUBMITTED"
          - "Field.certified_until_utc > current_utc"
        side_effects:
          - "Field.certified_until_utc is retained until the new packet is approved"

  # ------------------------------------------------------------ MaintenanceTask
  - entity: MaintenanceTask
    state_field: status
    initial_state: SCHEDULED
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - from: SCHEDULED
        to: IN_PROGRESS
        trigger: "POST /turf/maintenance-tasks/{id}/transition with action START"
        actor: TurfAgronomist
        preconditions:
          - "MaintenanceTask.status == SCHEDULED"
          - "Field.play_status != RETIRED"
        side_effects:
          - "MaintenanceTask.started_at_utc := current_utc"
      - from: IN_PROGRESS
        to: COMPLETED
        trigger: "POST /turf/maintenance-tasks/{id}/transition with action COMPLETE"
        actor: TurfAgronomist
        preconditions:
          - "MaintenanceTask.status == IN_PROGRESS"
          - "completed_at_utc is present and >= MaintenanceTask.started_at_utc and <= current_utc"
        side_effects:
          - "MaintenanceTask.completed_at_utc := completed_at_utc"
          - "Field.rest_debt_hours recomputed by calculations.field_rest_debt_hours"
          - "when the capped recovery credit is > 0.00, a UsageLedgerEntry with entry_type RECOVERY_CREDIT, wear_units_delta 0.00 and rest_credit_hours equal to that capped credit is appended; when the capped credit is exactly 0.00 no entry is appended"
          - "when task_type == FERTILITY, Field.nitrogen_applied_ytd_lb_per_1000_sq_ft increases by nitrogen_lb_per_1000_sq_ft"
          - "Field.play_status recomputed"
          - "Field.version increments by 1"
      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /turf/maintenance-tasks/{id}/transition with action CANCEL"
        actor: TurfAgronomist
        preconditions:
          - "MaintenanceTask.status == SCHEDULED"
          - "cancellation_reason is present"
        side_effects:
          - "MaintenanceTask.cancellation_reason := cancellation_reason"
          - "the task no longer occupies its window for the staff-capacity check"
          - "the task leaves the certification agronomic-program denominator"
      - from: IN_PROGRESS
        to: CANCELLED
        trigger: "POST /turf/maintenance-tasks/{id}/transition with action CANCEL"
        actor: TurfAgronomist
        preconditions:
          - "MaintenanceTask.status == IN_PROGRESS"
          - "cancellation_reason is present"
        side_effects:
          - "MaintenanceTask.cancellation_reason := cancellation_reason"
          - "no rest credit is granted"

  # ----------------------------------------------------------- SafetyAssessment
  - entity: SafetyAssessment
    state_field: status
    initial_state: RECORDED
    terminal_states: [SUPERSEDED, VOIDED]
    transitions:
      - from: RECORDED
        to: SUPERSEDED
        trigger: "POST /turf/safety-assessments creating a newer assessment of the same assessment_type on the same field"
        actor: SafetyInspector
        preconditions:
          - "the new assessment has the same field_id and assessment_type"
          - "the new assessment's assessed_at_utc >= this assessment's assessed_at_utc"
        side_effects:
          - "SafetyAssessment.superseded_at_utc := current_utc"
          - "when assessment_type == IMPACT_ATTENUATION, Field.latest_gmax_mean_value := the new assessment's gmax_mean_value and Field.condition_index_agronomic is recomputed"
      - from: RECORDED
        to: VOIDED
        trigger: "POST /turf/safety-assessments/{id}/void"
        actor: SafetyInspector
        preconditions:
          - "SafetyAssessment.status == RECORDED"
          - "no CertificationPacket with status IN {SUBMITTED, APPROVED} names this assessment as governing_assessment_id"
        side_effects:
          - "SafetyAssessment.void_reason := void_reason"
          - "every RemediationOrder whose source_assessment_id is this assessment and whose status IN {OPEN, VERIFICATION_SUBMITTED} transitions to CANCELLED"
          - "Field.open_mandatory_remediation_count / open_advisory_remediation_count decremented accordingly and Field.play_status recomputed"
          - "when assessment_type == IMPACT_ATTENUATION, Field.latest_gmax_mean_value falls back to the next most recent RECORDED IMPACT_ATTENUATION assessment on the field ordered by assessed_at_utc DESC then created_at DESC, or null when none remains"

  # ---------------------------------------------------------- RemediationOrder
  - entity: RemediationOrder
    state_field: status
    initial_state: OPEN
    terminal_states: [CLOSED_VERIFIED, CANCELLED]
    note: "Cyclic: a rejected verification returns the order to OPEN so the loop OPEN -> VERIFICATION_SUBMITTED -> OPEN can repeat."
    transitions:
      - from: OPEN
        to: VERIFICATION_SUBMITTED
        trigger: "POST /turf/remediation-orders/{id}/submit-verification"
        actor: TurfAgronomist
        preconditions:
          - "RemediationOrder.status == OPEN"
          - "the referenced verification SafetyAssessment has status RECORDED, the same field_id, the same assessment_type as the source assessment, and assessed_at_utc >= RemediationOrder.opened_at_utc"
          - "X-User-ID != RemediationOrder.source_assessment.inspector_staff_member_id"
        side_effects:
          - "RemediationOrder.verification_assessment_id := verification_assessment_id"
          - "RemediationOrder.submitted_by_staff_member_id := submitted_by_staff_member_id"
          - "RemediationOrder.remediation_notes := remediation_notes"
          - "the order still counts toward Field.open_mandatory_remediation_count, so Field.play_status does not change"
      - from: VERIFICATION_SUBMITTED
        to: CLOSED_VERIFIED
        trigger: "POST /turf/remediation-orders/{id}/decide-verification with decision ACCEPT"
        actor: SafetyInspector
        preconditions:
          - "RemediationOrder.status == VERIFICATION_SUBMITTED"
          - "the verification SafetyAssessment.result == PASS"
          - "X-User-ID != RemediationOrder.submitted_by_staff_member_id"
        side_effects:
          - "RemediationOrder.closed_at_utc := current_utc"
          - "Field.open_mandatory_remediation_count or open_advisory_remediation_count decrements by 1"
          - "Field.play_status recomputed - CLOSED_UNSAFE lifts once the count reaches 0"
          - "Field.version increments by 1"
      - from: VERIFICATION_SUBMITTED
        to: OPEN
        trigger: "POST /turf/remediation-orders/{id}/decide-verification with decision REJECT"
        actor: SafetyInspector
        preconditions:
          - "RemediationOrder.status == VERIFICATION_SUBMITTED"
          - "X-User-ID != RemediationOrder.submitted_by_staff_member_id"
        side_effects:
          - "RemediationOrder.rejection_count increments by 1"
          - "RemediationOrder.verification_assessment_id := null and submitted_by_staff_member_id := null"
          - "RemediationOrder.remediation_notes is retained for audit"
          - "Field.play_status is unchanged"
      - from: OPEN
        to: CANCELLED
        trigger: "POST /turf/safety-assessments/{id}/void on the source assessment"
        actor: SafetyInspector
        preconditions:
          - "the voided assessment is this order's source_assessment_id"
        side_effects:
          - "RemediationOrder.closed_at_utc := current_utc"
          - "Field.open_mandatory_remediation_count or open_advisory_remediation_count decrements by 1 and Field.play_status recomputed"
      - from: VERIFICATION_SUBMITTED
        to: CANCELLED
        trigger: "POST /turf/safety-assessments/{id}/void on the source assessment"
        actor: SafetyInspector
        preconditions:
          - "the voided assessment is this order's source_assessment_id"
        side_effects:
          - "same as the OPEN -> CANCELLED transition"

  # --------------------------------------------------------------- UsageBooking
  - entity: UsageBooking
    state_field: status
    initial_state: SCHEDULED
    terminal_states: [PLAYED, RAINED_OUT, CANCELLED_LATE, CANCELLED_UNSAFE]
    note: "Branching: close-out forks into three outcomes with divergent side-effect sets, and a fourth terminal state is reachable only by cascade."
    transitions:
      - from: SCHEDULED
        to: CONFIRMED
        trigger: "POST /turf/usage-bookings/{id}/confirm"
        actor: FieldOperationsCoordinator
        preconditions:
          - "UsageBooking.status == SCHEDULED"
          - "Field.play_status IN {OPEN, RESTRICTED}"
          - "when Field.play_status == RESTRICTED, activity_type IN {PRACTICE, COMMUNITY}"
          - "when activity_type == TOURNAMENT and Field.sanctioned_level != NONE, Field.certification_status == CERTIFIED"
          - "current_utc < UsageBooking.window_start_utc"
        side_effects:
          - "UsageBooking.confirmed_at_utc := current_utc"
          - "UsageBooking.started_with_rest_debt := (Field.rest_debt_hours > 0.00)"
      - from: CONFIRMED
        to: PLAYED
        trigger: "POST /turf/usage-bookings/{id}/close-out with outcome PLAYED"
        actor: FieldOperationsCoordinator
        preconditions:
          - "UsageBooking.status == CONFIRMED"
          - "current_utc >= UsageBooking.window_end_utc"
          - "actual_duration_hours > 0.00"
        side_effects:
          - "UsageBooking.wear_load_units := calculations.wear_load_units"
          - "UsageBooking.rest_requirement_hours := calculations.rest_requirement_hours"
          - "a UsageLedgerEntry with entry_type PLAY_WEAR is appended carrying wear_units_delta = +wear_load_units, rest_requirement_hours, and rest_window_end_utc = window_end_utc + rest_requirement_hours"
          - "Field.cumulative_wear_units recomputed, Field.usage_hours_ytd increases by actual_duration_hours"
          - "Field.rest_debt_hours recomputed, Field.condition_index_agronomic recomputed, Field.play_status recomputed"
          - "Field.version increments by 1"
      - from: CONFIRMED
        to: RAINED_OUT
        trigger: "POST /turf/usage-bookings/{id}/close-out with outcome RAINED_OUT"
        actor: FieldOperationsCoordinator
        preconditions:
          - "UsageBooking.status == CONFIRMED"
          - "current_utc >= UsageBooking.window_end_utc"
          - "weather_condition == WET"
        side_effects:
          - "UsageBooking.wear_load_units and rest_requirement_hours computed exactly as for PLAYED"
          - "a UsageLedgerEntry with entry_type PLAY_WEAR is appended carrying wear_units_delta = +wear_load_units and the rest obligation"
          - "immediately afterwards a compensating UsageLedgerEntry with entry_type RAIN_OUT_RELIEF is appended carrying wear_units_delta = -wear_load_units, rest_requirement_hours 0.00 and rest_credit_hours 0.00, because sanctioned rain-out policy does not charge the tenant's wear allocation"
          - "the rest obligation from the PLAY_WEAR entry stands - a wet surface still needs its rest window"
          - "Field.cumulative_wear_units therefore returns to its pre-close-out value while Field.rest_debt_hours increases"
          - "Field.usage_hours_ytd increases by actual_duration_hours"
          - "Field.version increments by 1"
      - from: CONFIRMED
        to: CANCELLED_LATE
        trigger: "POST /turf/usage-bookings/{id}/close-out with outcome CANCELLED_LATE"
        actor: FieldOperationsCoordinator
        preconditions:
          - "UsageBooking.status == CONFIRMED"
          - "current_utc >= UsageBooking.window_end_utc"
          - "actual_duration_hours == 0.00"
        side_effects:
          - "UsageBooking.wear_load_units := round_half_up(LATE_CANCEL_WEAR_FRACTION * calculations.wear_load_units evaluated on the booking's expected_participant_count and the full scheduled window duration, 2)"
          - "UsageBooking.rest_requirement_hours := 0.00"
          - "a UsageLedgerEntry with entry_type LATE_CANCEL_WEAR is appended carrying that wear_units_delta, rest_requirement_hours 0.00 and rest_window_end_utc null"
          - "Field.cumulative_wear_units recomputed; Field.usage_hours_ytd unchanged"
          - "Field.condition_index_agronomic recomputed, Field.play_status recomputed"
          - "Field.version increments by 1"
      - from: SCHEDULED
        to: CANCELLED_UNSAFE
        trigger: "system: Field.play_status became CLOSED_UNSAFE or RETIRED"
        actor: system
        preconditions:
          - "UsageBooking.window_start_utc >= current_utc for the CLOSED_UNSAFE cascade; every non-terminal booking for the RETIRED cascade"
        side_effects:
          - "a UsageLedgerEntry with entry_type UNSAFE_CANCELLATION, wear_units_delta 0.00 and rest_requirement_hours 0.00 is appended"
          - "Field.unsafe_cancellation_count increments by 1 and Field.rest_debt_hours is recomputed"
      - from: CONFIRMED
        to: CANCELLED_UNSAFE
        trigger: "system: Field.play_status became CLOSED_UNSAFE or RETIRED"
        actor: system
        preconditions:
          - "same as the SCHEDULED -> CANCELLED_UNSAFE transition"
        side_effects:
          - "same as the SCHEDULED -> CANCELLED_UNSAFE transition"

  # -------------------------------------------------------- CertificationPacket
  - entity: CertificationPacket
    state_field: status
    initial_state: DRAFT
    terminal_states: [SUPERSEDED]
    note: "Cyclic: SUBMITTED -> RETURNED -> SUBMITTED may repeat any number of times, and each resubmission re-evaluates the completeness score against the state of the world at that moment."
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /turf/certification-packets/{id}/submit"
        actor: CertificationOfficer
        preconditions:
          - "CertificationPacket.status == DRAFT"
          - "the governing SafetyAssessment.status == RECORDED"
          - "the governing SafetyAssessment.assessment_type == IMPACT_ATTENUATION and result != FAIL"
          - "Field.play_status != RETIRED"
        side_effects:
          - "CertificationPacket.documentation_completeness_score := calculations.certification_document_completeness_score"
          - "CertificationPacket.condition_index_certification := calculations.field_condition_index CERTIFICATION variant"
          - "CertificationPacket.submitted_at_utc := current_utc and submitted_by_staff_member_id := submitted_by_staff_member_id"
          - "Field.certification_status recomputed to PENDING_REVIEW"
      - from: RETURNED
        to: SUBMITTED
        trigger: "POST /turf/certification-packets/{id}/submit"
        actor: CertificationOfficer
        preconditions:
          - "CertificationPacket.status == RETURNED"
          - "the governing SafetyAssessment.status == RECORDED"
          - "Field.play_status != RETIRED"
        side_effects:
          - "documentation_completeness_score and condition_index_certification are recomputed from scratch, not carried over"
          - "CertificationPacket.submitted_at_utc := current_utc"
          - "Field.certification_status recomputed to PENDING_REVIEW"
      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /turf/certification-packets/{id}/decide with decision APPROVE"
        actor: CertificationOfficer
        preconditions:
          - "CertificationPacket.status == SUBMITTED"
          - "CertificationPacket.documentation_completeness_score >= MIN_CERTIFICATION_COMPLETENESS_SCORE"
          - "CertificationPacket.condition_index_certification >= MIN_CERTIFICATION_CONDITION_INDEX"
          - "Field.open_mandatory_remediation_count == 0"
          - "X-User-ID != CertificationPacket.submitted_by_staff_member_id"
          - "X-User-ID != the governing SafetyAssessment.inspector_staff_member_id"
        side_effects:
          - "CertificationPacket.decided_at_utc := current_utc, decided_by_staff_member_id := decided_by_staff_member_id"
          - "CertificationPacket.certified_until_utc := current_utc + CERTIFICATION_VALID_DAYS days"
          - "any other CertificationPacket on the same field with status APPROVED transitions to SUPERSEDED"
          - "Field.certification_status := CERTIFIED, Field.certified_until_utc := this packet's certified_until_utc"
          - "Field.open_certification_packet_count decrements by 1"
          - "Field.version increments by 1"
      - from: SUBMITTED
        to: RETURNED
        trigger: "POST /turf/certification-packets/{id}/decide with decision RETURN"
        actor: CertificationOfficer
        preconditions:
          - "CertificationPacket.status == SUBMITTED"
          - "X-User-ID != CertificationPacket.submitted_by_staff_member_id"
        side_effects:
          - "CertificationPacket.return_count increments by 1"
          - "CertificationPacket.decided_at_utc := current_utc, decision_notes := decision_notes"
          - "CertificationPacket.submitted_by_staff_member_id := null so a different officer may resubmit"
          - "Field.certification_status recomputed"
      - from: APPROVED
        to: SUPERSEDED
        trigger: "POST /turf/certification-packets/{id}/decide with decision APPROVE on a newer packet for the same field"
        actor: CertificationOfficer
        preconditions:
          - "a different CertificationPacket on the same field has just been APPROVED"
        side_effects:
          - "CertificationPacket.certified_until_utc is retained for audit but no longer drives Field.certified_until_utc"

  # ------------------------------------------- ReplacementPlan - funding axis
  - entity: ReplacementPlan
    state_field: funding_status
    initial_state: DRAFT
    terminal_states: [REJECTED, RESCINDED]
    note: "First of two independent state axes on ReplacementPlan. funding_status and disposal_status advance independently; only the disposal COMPLETE transition reads across the axes."
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /turf/replacement-plans/{id}/submit"
        actor: FacilitiesDirector
        preconditions:
          - "ReplacementPlan.funding_status == DRAFT"
          - "CapitalBudget.status == OPEN"
        side_effects:
          - "ReplacementPlan.submitted_at_utc := current_utc, submitted_by_staff_member_id := submitted_by_staff_member_id"
      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /turf/replacement-plans/{id}/decide with decision APPROVE"
        actor: FacilitiesDirector
        preconditions:
          - "ReplacementPlan.funding_status == SUBMITTED"
          - "CapitalBudget.status == OPEN"
          - "ReplacementPlan.replacement_priority_score >= MIN_APPROVAL_PRIORITY_SCORE"
          - "ReplacementPlan.plan_funding_amount_cents <= CapitalBudget.available_amount_cents"
          - "X-User-ID != ReplacementPlan.submitted_by_staff_member_id"
        side_effects:
          - "cascade hop 2: CapitalBudget.committed_amount_cents increases by plan_funding_amount_cents and available_amount_cents is recomputed"
          - "cascade hop 3: when committed_amount_cents >= CapitalBudget.lock_threshold_amount_cents, CapitalBudget.status transitions OPEN -> LOCKED"
          - "cascade hop 4: because the budget locked, every other ReplacementPlan on the same capital_budget_id with funding_status == DRAFT transitions to DEFERRED (ordered by replacement_priority_score DESC, then created_at ASC)"
          - "ReplacementPlan.decided_at_utc := current_utc, decided_by_staff_member_id := decided_by_staff_member_id"
      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /turf/replacement-plans/{id}/decide with decision REJECT"
        actor: FacilitiesDirector
        preconditions:
          - "ReplacementPlan.funding_status == SUBMITTED"
          - "X-User-ID != ReplacementPlan.submitted_by_staff_member_id"
        side_effects:
          - "no capital is committed; CapitalBudget is untouched"
          - "Field.open_replacement_plan_count decrements by 1 and Field.version increments by 1"
      - from: APPROVED
        to: RESCINDED
        trigger: "POST /turf/replacement-plans/{id}/decide with decision RESCIND"
        actor: FacilitiesDirector
        preconditions:
          - "ReplacementPlan.funding_status == APPROVED"
          - "ReplacementPlan.disposal_status != COMPLETED"
          - "X-User-ID != ReplacementPlan.submitted_by_staff_member_id"
        side_effects:
          - "COMPENSATION: CapitalBudget.committed_amount_cents decreases by exactly plan_funding_amount_cents and available_amount_cents is recomputed"
          - "when committed_amount_cents falls below CapitalBudget.lock_threshold_amount_cents, CapitalBudget.status transitions LOCKED -> OPEN"
          - "every ReplacementPlan on the same capital_budget_id with funding_status == DEFERRED transitions back to DRAFT"
          - "ReplacementPlan.disposal_status transitions to NOT_APPLICABLE when it was PENDING or MANIFESTED"
          - "Field.open_replacement_plan_count decrements by 1 and Field.version increments by 1"
      - from: DRAFT
        to: DEFERRED
        trigger: "system: CapitalBudget.status transitioned OPEN -> LOCKED"
        actor: system
        preconditions:
          - "ReplacementPlan.funding_status == DRAFT"
          - "ReplacementPlan.capital_budget_id == the locked CapitalBudget.id"
        side_effects:
          - "the plan can no longer be submitted until the budget reopens"
      - from: DEFERRED
        to: DRAFT
        trigger: "system: CapitalBudget.status transitioned LOCKED -> OPEN"
        actor: system
        preconditions:
          - "ReplacementPlan.funding_status == DEFERRED"
          - "ReplacementPlan.capital_budget_id == the reopened CapitalBudget.id"
        side_effects:
          - "the plan becomes submittable again"

  # ------------------------------------------ ReplacementPlan - disposal axis
  - entity: ReplacementPlan
    state_field: disposal_status
    initial_state: PENDING
    terminal_states: [COMPLETED, NOT_APPLICABLE]
    note: |
      Second independent state axis. The initial state is PENDING only when the
      existing Field.surface_type == SYNTHETIC_TURF (synthetic infill and carpet
      must be manifested); for a NATURAL_GRASS field the plan is created directly
      in NOT_APPLICABLE. The axis advances without any reference to
      funding_status until the COMPLETE transition, which is the single
      cross-axis guard.
    transitions:
      - from: PENDING
        to: MANIFESTED
        trigger: "POST /turf/replacement-plans/{id}/disposal-manifest"
        actor: FacilitiesDirector
        preconditions:
          - "ReplacementPlan.disposal_status == PENDING"
          - "total_tonnage > 0.00 and diverted_tonnage <= total_tonnage"
          - "round_half_up(diverted_tonnage / total_tonnage, 2) >= MIN_DIVERSION_RATIO"
        side_effects:
          - "ReplacementPlan.manifest_reference, disposal_facility_name, diverted_tonnage, total_tonnage recorded"
          - "ReplacementPlan.diversion_ratio := round_half_up(diverted_tonnage / total_tonnage, 2)"
          - "funding_status is NOT read and NOT changed by this transition"
      - from: MANIFESTED
        to: COMPLETED
        trigger: "POST /turf/replacement-plans/{id}/complete"
        actor: FacilitiesDirector
        preconditions:
          - "ReplacementPlan.disposal_status == MANIFESTED"
          - "CROSS-AXIS GUARD: ReplacementPlan.funding_status == APPROVED"
          - "completed_at_utc <= current_utc"
        side_effects:
          - "ReplacementPlan.completed_at_utc := completed_at_utc"
          - "Field.retired_at := completed_at_utc and Field.play_status transitions to RETIRED"
          - "every non-terminal UsageBooking on the field transitions to CANCELLED_UNSAFE"
          - "Field.version increments by 1"
      - from: PENDING
        to: NOT_APPLICABLE
        trigger: "POST /turf/replacement-plans/{id}/decide with decision RESCIND"
        actor: FacilitiesDirector
        preconditions:
          - "ReplacementPlan.funding_status == APPROVED and transitioning to RESCINDED"
        side_effects:
          - "the disposal obligation is withdrawn with the funding"
      - from: MANIFESTED
        to: NOT_APPLICABLE
        trigger: "POST /turf/replacement-plans/{id}/decide with decision RESCIND"
        actor: FacilitiesDirector
        preconditions:
          - "ReplacementPlan.funding_status == APPROVED and transitioning to RESCINDED"
        side_effects:
          - "the recorded manifest fields are retained for audit but the obligation is withdrawn"

  # --------------------------------------------------------------- CapitalBudget
  - entity: CapitalBudget
    state_field: status
    initial_state: OPEN
    terminal_states: []
    note: "Cyclic two-state machine driven purely by the commitment threshold; both directions are reachable."
    transitions:
      - from: OPEN
        to: LOCKED
        trigger: "system: committed_amount_cents reached lock_threshold_amount_cents after a ReplacementPlan APPROVE"
        actor: system
        preconditions:
          - "CapitalBudget.committed_amount_cents >= CapitalBudget.lock_threshold_amount_cents"
        side_effects:
          - "every ReplacementPlan on this budget with funding_status == DRAFT transitions to DEFERRED"
          - "further POST /turf/replacement-plans/{id}/submit and APPROVE decisions on this budget fail with ERR_BUDGET_LOCKED"
      - from: LOCKED
        to: OPEN
        trigger: "system: committed_amount_cents fell below lock_threshold_amount_cents after a ReplacementPlan RESCIND"
        actor: system
        preconditions:
          - "CapitalBudget.committed_amount_cents < CapitalBudget.lock_threshold_amount_cents"
        side_effects:
          - "every ReplacementPlan on this budget with funding_status == DEFERRED transitions back to DRAFT"

# =============================================================================
# 1.2.1 Concurrency Rules
# =============================================================================
concurrency_rules:
  - rule_id: cert-packet-create-stale-field
    parent_entity: Field
    write_endpoint: "POST /turf/certification-packets"
    occ_field: "expected_field_version"
    description: |
      Creating a CertificationPacket against a Field whose version has advanced
      since the client last read it is rejected with a stale-version error. A new
      packet legitimately supersedes any earlier packet for the same field once
      approved, so the second create would otherwise succeed on identical
      observable state; OCC on Field.version reduces that to a deterministic
      stale-version check.
    error_id: ERR_STALE_FIELD_VERSION
    http_status: 412

  - rule_id: replacement-plan-create-stale-field
    parent_entity: Field
    write_endpoint: "POST /turf/replacement-plans"
    occ_field: "expected_field_version"
    description: |
      Creating a ReplacementPlan against a Field whose version has advanced since
      the client last read it is rejected with a stale-version error. Multiple
      draft plans for the same field are legitimate product behaviour, so the
      second create is not blocked by any state precondition; OCC on Field.version
      is what makes a client working from an outdated view of the field's wear,
      posture and open-plan count fail deterministically.
    error_id: ERR_STALE_FIELD_VERSION
    http_status: 412

# =============================================================================
# 1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: field_age_and_warranty_status
    trigger: "on POST /turf/fields, and for every Field on POST /_clock/set_current_utc"
    algorithm: chronological
    formula: |
      elapsed_days = (current_utc - Field.installed_on_date) in whole and fractional days
      Field.age_years = round_half_up(elapsed_days / DAYS_PER_YEAR, 2)

      if Field.warranty_expires_on IS NULL:
          Field.warranty_status = NONE
      elif current_utc < Field.warranty_expires_on:
          Field.warranty_status = ACTIVE
      else:
          Field.warranty_status = EXPIRED        # boundary is inclusive of expiry: at exactly
                                                # warranty_expires_on the warranty is EXPIRED
    input_set: "the single Field row; the logical clock, which defaults to 2026-08-01T00:00:00Z until POST /_clock/set_current_utc is called"
    constants:
      DAYS_PER_YEAR: 365.25
    precision: "age_years 2 decimal places, round_half_up"

  - name: impact_attenuation_result
    trigger: "on POST /turf/safety-assessments"
    algorithm: threshold
    formula: |
      if assessment_type == IMPACT_ATTENUATION:
          gmax_mean_value = round_half_up((gmax_readings[0] + gmax_readings[1] + gmax_readings[2]) / 3, 1)
          if gmax_mean_value <= GMAX_ADVISORY_LIMIT:      result = PASS
          elif gmax_mean_value <= GMAX_MANDATORY_LIMIT:   result = ADVISORY
          else:                                           result = FAIL
      else:
          gmax_mean_value = null
          result = declared_result                       # PASS or FAIL, never ADVISORY
    input_set: "the three readings supplied on this request only; earlier assessments are never averaged in"
    constants:
      GMAX_ADVISORY_LIMIT: 165.0
      GMAX_MANDATORY_LIMIT: 200.0
    precision: "gmax_mean_value 1 decimal place, round_half_up; both comparisons are <= so a mean of exactly 165.0 is PASS and exactly 200.0 is ADVISORY"
    note: "result FAIL opens a MANDATORY RemediationOrder; result ADVISORY opens an ADVISORY RemediationOrder; result PASS opens none."

  - name: wear_load_units
    trigger: "on POST /turf/usage-bookings/{id}/close-out for every outcome"
    algorithm: weighted_scoring
    formula: |
      # MODE (a) combinatorial: four inputs with non-linear interaction - a capped
      # crowd surcharge nested inside a product of three multipliers.
      duration = (outcome == CANCELLED_LATE)
                 ? hours_between(UsageBooking.window_start_utc, UsageBooking.window_end_utc)
                 : actual_duration_hours
      headcount = (outcome == CANCELLED_LATE)
                 ? UsageBooking.expected_participant_count
                 : actual_participant_count

      base_units    = duration * ACTIVITY_INTENSITY[UsageBooking.activity_type]
      crowd_factor  = 1.00 + min(CROWD_FACTOR_CAP,
                                 max(0, headcount - CROWD_FREE_ALLOWANCE) * CROWD_STEP)
      surface_factor = SURFACE_FACTOR[Field.surface_type]
      weather_factor = (weather_condition == WET) ? WET_FACTOR : 1.00

      raw = base_units * crowd_factor * surface_factor * weather_factor
      if outcome == CANCELLED_LATE:
          wear_load_units = round_half_up(LATE_CANCEL_WEAR_FRACTION * raw, 2)
      else:
          wear_load_units = round_half_up(raw, 2)
    input_set: "the single UsageBooking being closed out plus its Field.surface_type; no other booking participates"
    constants:
      ACTIVITY_INTENSITY: { PRACTICE: 1.00, GAME: 1.50, TOURNAMENT: 2.00, COMMUNITY: 0.75 }
      CROWD_FREE_ALLOWANCE: 40
      CROWD_STEP: 0.01
      CROWD_FACTOR_CAP: 0.50
      SURFACE_FACTOR: { NATURAL_GRASS: 1.20, SYNTHETIC_TURF: 0.80 }
      WET_FACTOR: 1.35
      LATE_CANCEL_WEAR_FRACTION: 0.50
    precision: "2 decimal places, round_half_up, applied once at the very end - the four factors are multiplied at full precision"

  - name: rest_requirement_hours
    trigger: "on POST /turf/usage-bookings/{id}/close-out with outcome PLAYED or RAINED_OUT"
    algorithm: tiered_pricing
    formula: |
      # Marginal (not average) tier rates over wear_load_units.
      remaining = UsageBooking.wear_load_units
      hours = 0.00
      lower = 0.00
      for (upper, rate) in REST_TIERS:                # ordered, upper == null means unbounded
          span = (upper is null) ? max(0, remaining - lower)
                                : max(0, min(remaining, upper) - lower)
          hours = hours + span * rate
          if upper is not null: lower = upper

      if Field.surface_type == SYNTHETIC_TURF:
          hours = hours * SYNTHETIC_REST_MULTIPLIER
      elif weather_condition == WET:
          hours = hours + WET_NATURAL_REST_SURCHARGE_HOURS

      rest_requirement_hours = round_half_up(hours, 2)
      # for outcome CANCELLED_LATE rest_requirement_hours is 0.00 and no rest window is opened
    input_set: "the single UsageBooking's wear_load_units, its Field.surface_type and the close-out weather_condition"
    constants:
      REST_TIERS:
        - { upper: 6.00, rate: 0.50 }
        - { upper: 12.00, rate: 1.00 }
        - { upper: null, rate: 1.75 }
      SYNTHETIC_REST_MULTIPLIER: 0.40
      WET_NATURAL_REST_SURCHARGE_HOURS: 2.00
    precision: "2 decimal places, round_half_up, applied once after the surface multiplier and the wet surcharge"
    note: "the synthetic multiplier and the wet surcharge are mutually exclusive by construction - the surcharge applies only to NATURAL_GRASS."

  - name: field_cumulative_wear_units
    trigger: "on every UsageLedgerEntry append (close-out of any outcome, unsafe cascade cancellation, maintenance recovery credit)"
    algorithm: aggregation
    formula: |
      Field.cumulative_wear_units = round_half_up(
          SUM(UsageLedgerEntry.wear_units_delta
              WHERE UsageLedgerEntry.field_id == Field.id),      # every entry, no status filter:
          2)                                                     # the ledger is immutable
      # replay order for running_balance_after: effective_at_utc ASC, then created_at ASC
      UsageLedgerEntry.running_balance_after = the value of Field.cumulative_wear_units
                                              immediately after this entry was applied
    input_set: "every UsageLedgerEntry row for the field, unconditionally - entries are never deleted or amended, only compensated by a further entry"
    constants: {}
    precision: "2 decimal places, round_half_up"
    note: "CONSERVED QUANTITY: Field.cumulative_wear_units MUST always equal SUM(UsageLedgerEntry.wear_units_delta) for the field. A RAIN_OUT_RELIEF entry is the compensating counterpart of its PLAY_WEAR entry and the pair sums to exactly 0.00."

  - name: field_rest_debt_hours
    trigger: "on POST /turf/usage-bookings/{id}/close-out, on MaintenanceTask COMPLETE, on the CLOSED_UNSAFE / RETIRED cascade, and for every Field on POST /_clock/set_current_utc"
    algorithm: interval_merge
    formula: |
      governing = the UsageLedgerEntry with entry_type == PLAY_WEAR and field_id == Field.id
                  having the greatest rest_window_end_utc
                  (tie-break: greatest effective_at_utc, then greatest created_at)
      if governing IS NULL:
          Field.rest_debt_hours = 0.00
      else:
          outstanding = round_half_up(max(0.00, hours_between(current_utc, governing.rest_window_end_utc)), 2)
          credit = min(outstanding,
                       SUM(MaintenanceTask.recovery_credit_hours
                           WHERE MaintenanceTask.field_id == Field.id
                             AND MaintenanceTask.status == COMPLETED
                             AND MaintenanceTask.completed_at_utc >= governing.effective_at_utc))
          Field.rest_debt_hours = round_half_up(outstanding - credit, 2)
    input_set: "PLAY_WEAR ledger entries for the field (the single greatest rest window wins - overlapping rest windows are merged by taking the maximum, never summed) and COMPLETED MaintenanceTasks whose completed_at_utc is at or after the governing entry's effective_at_utc"
    constants:
      RECOVERY_CREDIT_HOURS:
        AERATION: 12.00
        OVERSEEDING: 24.00
        FERTILITY: 6.00
        IRRIGATION: 4.00
        GROOMING: 3.00
        INFILL_REDISTRIBUTION: 6.00
        SEAM_INSPECTION: 0.00
    precision: "2 decimal places, round_half_up; outstanding is rounded before the credit is capped and subtracted"
    note: "MaintenanceTask.recovery_credit_hours is materialised at creation from RECOVERY_CREDIT_HOURS[task_type]. A SEAM_INSPECTION grants 0.00 and therefore appends no RECOVERY_CREDIT ledger entry."

  - name: field_condition_index
    trigger: "on POST /turf/fields, on POST /turf/safety-assessments, on UsageBooking close-out (PLAYED and CANCELLED_LATE), on POST /_clock/set_current_utc, and on CertificationPacket submit"
    algorithm: weighted_scoring
    formula: |
      wear_component  = round_half_up(max(0.00, 100.00 - Field.cumulative_wear_units / WEAR_UNITS_PER_INDEX_POINT), 2)
      age_component   = round_half_up(max(0.00, 100.00 - (Field.age_years / Field.expected_life_years) * 100.00), 2)
      if Field.latest_gmax_mean_value IS NULL:
          safety_component = NO_DATA_SAFETY_COMPONENT
      else:
          safety_component = round_half_up(
              min(100.00, max(0.00,
                  (GMAX_MANDATORY_LIMIT - Field.latest_gmax_mean_value)
                  / (GMAX_MANDATORY_LIMIT - GMAX_IDEAL_VALUE) * 100.00)), 2)

      # rounding order is pinned: each component is rounded to 2dp FIRST, then weighted
      AGRONOMIC:     round_half_up(wear_component * 0.50 + age_component * 0.20 + safety_component * 0.30, 2)
      CERTIFICATION: value = round_half_up(wear_component * 0.20 + age_component * 0.20 + safety_component * 0.60, 2)
                     result = min(value, safety_component)
    input_set: "the single Field row's cumulative_wear_units, age_years, expected_life_years and latest_gmax_mean_value"
    constants:
      WEAR_UNITS_PER_INDEX_POINT: 4.00
      GMAX_IDEAL_VALUE: 90.0
      GMAX_MANDATORY_LIMIT: 200.0
      NO_DATA_SAFETY_COMPONENT: 50.00
    precision: "components 2 decimal places round_half_up, weighted result 2 decimal places round_half_up"
    variants:
      - name: AGRONOMIC
        when: "written to Field.condition_index_agronomic on every recompute; also the input to the replacement_priority_score CONDITION_RISK variant"
        difference: "weights wear 0.50 / age 0.20 / safety 0.30 and applies no cap - an agronomically excellent surface can score high even with a mediocre g-max reading"
      - name: CERTIFICATION
        when: "written to CertificationPacket.condition_index_certification at each packet submission"
        difference: "weights wear 0.20 / age 0.20 / safety 0.60 AND caps the result at safety_component, because a field presented for sanctioned competition can never be scored above its measured impact attenuation"

  - name: certification_document_completeness_score
    trigger: "on POST /turf/certification-packets/{id}/submit, from DRAFT and from RETURNED alike"
    algorithm: weighted_scoring
    formula: |
      # MODE (b) combinatorial: the rounding ORDER is pinned. Each component is
      # rounded to 2dp and only then summed. Summing at full precision and
      # rounding once produces a different cent value and is WRONG here.
      window_start = submitted_at_utc - CERTIFICATION_WINDOW_DAYS days
      window       = [window_start, submitted_at_utc]      # both bounds inclusive

      safety_ratio = 1.00 if governing SafetyAssessment.status == RECORDED
                             AND .result IN {PASS, ADVISORY}
                             AND .assessed_at_utc IN window
                          else 0.00

      planned = MaintenanceTask WHERE field_id == Field.id
                            AND planned_for_certification_window == true
                            AND status != CANCELLED
                            AND scheduled_start_utc IN window
      agronomic_ratio = 1.00 if COUNT(planned) == 0                     # vacuous compliance
                        else COUNT(planned WHERE status == COMPLETED) / COUNT(planned)

      striping_ratio = 1.00 if a SafetyAssessment on the field with assessment_type == STRIPING_LAYOUT,
                               status == RECORDED, result == PASS and assessed_at_utc IN window exists
                            else 0.00
      goal_ratio     = 1.00 if a SafetyAssessment on the field with assessment_type == GOAL_ANCHORING,
                               status == RECORDED, result == PASS and assessed_at_utc IN window exists
                            else 0.00

      if Field.surface_type == SYNTHETIC_TURF:
          spec_ratio = min(1.00, Field.infill_depth_mm / REQUIRED_INFILL_DEPTH_MM)
      else:
          spec_ratio = min(1.00, Field.nitrogen_applied_ytd_lb_per_1000_sq_ft / REQUIRED_NITROGEN_LB_PER_1000_SQ_FT)

      opened = RemediationOrder WHERE field_id == Field.id AND opened_at_utc IN window
      remediation_ratio = 1.00 if COUNT(opened) == 0                    # vacuous compliance
                          else COUNT(opened WHERE status IN {CLOSED_VERIFIED, CANCELLED}) / COUNT(opened)

      score = round_half_up(30 * safety_ratio, 2)
            + round_half_up(20 * agronomic_ratio, 2)
            + round_half_up(15 * striping_ratio, 2)
            + round_half_up(15 * goal_ratio, 2)
            + round_half_up(10 * spec_ratio, 2)
            + round_half_up(10 * remediation_ratio, 2)
      documentation_completeness_score = round_half_up(score, 2)
    input_set: "MaintenanceTasks, SafetyAssessments and RemediationOrders on the packet's field whose window field falls inside the 180-day inclusive window ending at submitted_at_utc, with the status filters spelled out above; ratios with an empty denominator are 1.00 (vacuous compliance), never 0.00"
    constants:
      CERTIFICATION_WINDOW_DAYS: 180
      COMPONENT_WEIGHTS: { SAFETY_TEST: 30, AGRONOMIC_PROGRAM: 20, STRIPING_LAYOUT: 15, GOAL_ANCHORING: 15, SURFACE_SPEC_COMPLIANCE: 10, REMEDIATION_CLOSURE: 10 }
      REQUIRED_INFILL_DEPTH_MM: 51.0
      REQUIRED_NITROGEN_LB_PER_1000_SQ_FT: 3.00
      MIN_CERTIFICATION_COMPLETENESS_SCORE: 90.00
      MIN_CERTIFICATION_CONDITION_INDEX: 55.00
      CERTIFICATION_VALID_DAYS: 365
    precision: "each weighted component is rounded to 2 decimal places round_half_up BEFORE summation; the sum is then rounded to 2 decimal places round_half_up"

  - name: plan_funding_amount_cents
    trigger: "on POST /turf/replacement-plans"
    algorithm: tiered_pricing
    formula: |
      # MODE (c) combinatorial: the tier looks circular because contingency is part
      # of the plan total, yet the tier is selected on the PRE-contingency subtotal.
      # The evaluation order is pinned; reading the tier off the final total is WRONG.
      base_construction_cents = ReplacementPlan.area_sq_ft * COST_PER_SQ_FT_CENTS[target_surface_type]
      disposal_cents = (Field.surface_type == SYNTHETIC_TURF)
                       ? ReplacementPlan.area_sq_ft * SYNTHETIC_DISPOSAL_CENTS_PER_SQ_FT
                       : 0
      pre_contingency_subtotal_cents = base_construction_cents + disposal_cents

      # STEP 3 - tier keyed on pre_contingency_subtotal_cents, NOT on the final total
      if   pre_contingency_subtotal_cents <  2000000: contingency_rate = 0.10
      elif pre_contingency_subtotal_cents <  5000000: contingency_rate = 0.07
      else:                                          contingency_rate = 0.05

      contingency_cents = round_half_up(pre_contingency_subtotal_cents * contingency_rate)   # integer cents
      plan_funding_amount_cents = pre_contingency_subtotal_cents + contingency_cents
    input_set: "the single ReplacementPlan's area_sq_ft and target_surface_type plus the existing Field.surface_type; no other plan participates"
    constants:
      COST_PER_SQ_FT_CENTS: { NATURAL_GRASS: 22, SYNTHETIC_TURF: 65 }
      SYNTHETIC_DISPOSAL_CENTS_PER_SQ_FT: 5
      CONTINGENCY_TIERS:
        - { subtotal_below_cents: 2000000, rate: 0.10 }
        - { subtotal_below_cents: 5000000, rate: 0.07 }
        - { subtotal_below_cents: null, rate: 0.05 }
    precision: "integer cents throughout; contingency_cents is round_half_up to whole cents, tier boundaries are strict < on the upper bound so a subtotal of exactly 5000000 selects 0.05"

  - name: replacement_priority_score
    trigger: "on POST /turf/replacement-plans"
    algorithm: weighted_scoring
    formula: |
      warranty_penalty = (Field.warranty_status == EXPIRED) ? WARRANTY_EXPIRED_PENALTY : 0.00

      REMAINING_LIFE:
        life_deficit_years = max(0.00, round_half_up(Field.age_years - Field.expected_life_years, 2))
        score = round_half_up(life_deficit_years * AGE_POINTS_PER_YEAR
                              + min(WEAR_POINTS_CAP, Field.cumulative_wear_units / WEAR_UNITS_PER_PRIORITY_POINT)
                              + warranty_penalty, 2)

      CONDITION_RISK:
        mandatory_orders = COUNT(RemediationOrder WHERE field_id == Field.id
                                                    AND severity == MANDATORY
                                                    AND opened_at_utc >= current_utc - PRIORITY_LOOKBACK_DAYS days)
        score = round_half_up((100.00 - Field.condition_index_agronomic) * CONDITION_POINTS_PER_INDEX_POINT
                              + mandatory_orders * MANDATORY_ORDER_POINTS
                              + warranty_penalty, 2)
    input_set: "the plan's Field row (age_years, expected_life_years, cumulative_wear_units, warranty_status, condition_index_agronomic) and, for CONDITION_RISK only, the field's MANDATORY RemediationOrders opened within the lookback window regardless of their current status"
    constants:
      AGE_POINTS_PER_YEAR: 6.00
      WEAR_UNITS_PER_PRIORITY_POINT: 25.00
      WEAR_POINTS_CAP: 20.00
      CONDITION_POINTS_PER_INDEX_POINT: 0.80
      MANDATORY_ORDER_POINTS: 5.00
      WARRANTY_EXPIRED_PENALTY: 8.00
      PRIORITY_LOOKBACK_DAYS: 365
      MIN_APPROVAL_PRIORITY_SCORE: 20.00
    precision: "2 decimal places, round_half_up"
    variants:
      - name: REMAINING_LIFE
        when: "ReplacementPlan.priority_basis == REMAINING_LIFE"
        difference: "scores only how far past its nominal service life the surface has run plus an accumulated-usage term; a surface still inside its nominal life scores almost nothing regardless of how badly it tests"
      - name: CONDITION_RISK
        when: "ReplacementPlan.priority_basis == CONDITION_RISK"
        difference: "ignores nominal life entirely and scores the measured condition shortfall plus recent mandatory safety orders, so the same field can clear MIN_APPROVAL_PRIORITY_SCORE under this basis while failing it under REMAINING_LIFE"

  - name: field_play_status
    trigger: "on POST /turf/fields, POST /turf/fields/{id}/closure-order, every RemediationOrder create/close/cancel, MaintenanceTask COMPLETE, UsageBooking close-out, ReplacementPlan disposal complete, and POST /_clock/set_current_utc"
    algorithm: constraint_propagation
    formula: |
      # strict precedence, first match wins
      if Field.retired_at IS NOT NULL:                     play_status = RETIRED
      elif Field.open_mandatory_remediation_count > 0:      play_status = CLOSED_UNSAFE
      elif Field.admin_closure_active == true:              play_status = CLOSED_ADMIN
      elif Field.rest_debt_hours > 0.00
           OR Field.open_advisory_remediation_count > 0:    play_status = RESTRICTED
      else:                                                 play_status = OPEN

      ALLOWED_ACTIVITIES[OPEN]           = {PRACTICE, GAME, TOURNAMENT, COMMUNITY}
      ALLOWED_ACTIVITIES[RESTRICTED]     = {PRACTICE, COMMUNITY}
      ALLOWED_ACTIVITIES[CLOSED_ADMIN]   = {}
      ALLOWED_ACTIVITIES[CLOSED_UNSAFE]  = {}
      ALLOWED_ACTIVITIES[RETIRED]        = {}
    input_set: "the Field row's own derived counters only; the counters themselves are maintained by the RemediationOrder, MaintenanceTask, UsageBooking and ReplacementPlan side effects"
    constants: {}
    precision: "exact enum, no rounding; the rest-debt comparison is strictly > 0.00 so a debt of exactly 0.00 does NOT restrict the field"

  - name: field_certification_status
    trigger: "on every CertificationPacket transition and for every Field on POST /_clock/set_current_utc"
    algorithm: projection
    formula: |
      approved = the CertificationPacket on this field with status == APPROVED
                 (at most one exists: approving a newer packet supersedes the older)
      if Field.retired_at IS NOT NULL:                                certification_status = NOT_CERTIFIED
      elif approved IS NOT NULL AND approved.certified_until_utc > current_utc:
                                                                      certification_status = CERTIFIED
      elif EXISTS CertificationPacket on this field with status == SUBMITTED:
                                                                      certification_status = PENDING_REVIEW
      elif approved IS NOT NULL:                                      certification_status = EXPIRED
      else:                                                           certification_status = NOT_CERTIFIED

      Field.certified_until_utc = approved.certified_until_utc when certification_status == CERTIFIED, else null
    input_set: "every CertificationPacket on the field with status IN {SUBMITTED, APPROVED}; DRAFT, RETURNED and SUPERSEDED packets are ignored"
    constants:
      CERTIFICATION_VALID_DAYS: 365
    precision: "exact enum; the validity comparison is strictly > current_utc so a certification whose certified_until_utc equals current_utc has already expired"
    note: "CERTIFIED outranks PENDING_REVIEW, so submitting a packet for next season never revokes an in-force certification."

  - name: capital_budget_commitment
    trigger: "on POST /turf/capital-budgets and on every ReplacementPlan funding decision (APPROVE, RESCIND)"
    algorithm: aggregation
    formula: |
      CapitalBudget.lock_threshold_amount_cents =
          round_half_up(CapitalBudget.total_authorized_amount_cents * BUDGET_LOCK_TRIGGER_RATIO)   # integer cents
      CapitalBudget.committed_amount_cents =
          SUM(ReplacementPlan.plan_funding_amount_cents
              WHERE capital_budget_id == CapitalBudget.id
                AND funding_status == APPROVED)                      # only APPROVED plans commit
      CapitalBudget.available_amount_cents =
          CapitalBudget.total_authorized_amount_cents - CapitalBudget.committed_amount_cents
      CapitalBudget.status = (CapitalBudget.committed_amount_cents >= CapitalBudget.lock_threshold_amount_cents)
                             ? LOCKED : OPEN
    input_set: "ReplacementPlans on this budget with funding_status == APPROVED only; DRAFT, SUBMITTED, DEFERRED, REJECTED and RESCINDED plans contribute nothing"
    constants:
      BUDGET_LOCK_TRIGGER_RATIO: 0.90
    precision: "integer cents; the lock comparison is >= so committed_amount_cents exactly equal to lock_threshold_amount_cents LOCKS the budget"
    note: "CONSERVED QUANTITY: available_amount_cents + committed_amount_cents MUST always equal total_authorized_amount_cents, and committed_amount_cents MUST always equal the sum over APPROVED plans. An APPROVE followed by a RESCIND of the same plan leaves all three values at their pre-APPROVE amounts."

# =============================================================================
# 1.4 Validation Rules Table (ordered by priority; lowest number wins)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID request headers are both present and non-empty"
    error_id: ERR_MISSING_AUTH_HEADERS
    http_status: 401
    applies_to: all
  - priority: 2
    category: auth
    check: "X-User-Role names one of the five roles declared in the RBAC matrix"
    error_id: ERR_UNKNOWN_ROLE
    http_status: 401
    applies_to: all
  - priority: 3
    category: auth
    check: "X-User-ID resolves to a StaffMember whose roles array contains X-User-Role and whose employment_status == ACTIVE"
    error_id: ERR_ROLE_IDENTITY_MISMATCH
    http_status: 403
    applies_to: "all except POST /turf/staff-members, which is exempt so the first FacilitiesDirector StaffMember row can be bootstrapped into an empty database"
  - priority: 4
    category: auth
    check: "the resolved role appears in the endpoint's roles list in the API endpoint table"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: all
  - priority: 5
    category: existence
    check: "the {id} path segment of a /turf/fields/... route resolves to a Field"
    error_id: ERR_FIELD_NOT_FOUND
    http_status: 404
    applies_to: "GET /turf/fields/{id}, POST /turf/fields/{id}/closure-order"
  - priority: 6
    category: existence
    check: "the {id} path segment of a /turf/staff-members/... route resolves to a StaffMember"
    error_id: ERR_STAFF_MEMBER_NOT_FOUND
    http_status: 404
    applies_to: "GET /turf/staff-members/{id}"
  - priority: 7
    category: existence
    check: "the {id} path segment resolves to a MaintenanceTask"
    error_id: ERR_MAINTENANCE_TASK_NOT_FOUND
    http_status: 404
    applies_to: "GET /turf/maintenance-tasks/{id}, POST /turf/maintenance-tasks/{id}/transition"
  - priority: 8
    category: existence
    check: "the {id} path segment resolves to a SafetyAssessment"
    error_id: ERR_SAFETY_ASSESSMENT_NOT_FOUND
    http_status: 404
    applies_to: "GET /turf/safety-assessments/{id}, POST /turf/safety-assessments/{id}/void"
  - priority: 9
    category: existence
    check: "the {id} path segment resolves to a RemediationOrder"
    error_id: ERR_REMEDIATION_ORDER_NOT_FOUND
    http_status: 404
    applies_to: "GET /turf/remediation-orders/{id}, POST /turf/remediation-orders/{id}/submit-verification, POST /turf/remediation-orders/{id}/decide-verification"
  - priority: 10
    category: existence
    check: "the {id} path segment resolves to a UsageBooking"
    error_id: ERR_USAGE_BOOKING_NOT_FOUND
    http_status: 404
    applies_to: "GET /turf/usage-bookings/{id}, POST /turf/usage-bookings/{id}/confirm, POST /turf/usage-bookings/{id}/close-out"
  - priority: 11
    category: existence
    check: "the {id} path segment resolves to a UsageLedgerEntry"
    error_id: ERR_LEDGER_ENTRY_NOT_FOUND
    http_status: 404
    applies_to: "GET /turf/usage-ledger-entries/{id}"
  - priority: 12
    category: existence
    check: "the {id} path segment resolves to a CertificationPacket"
    error_id: ERR_CERTIFICATION_PACKET_NOT_FOUND
    http_status: 404
    applies_to: "GET /turf/certification-packets/{id}, POST /turf/certification-packets/{id}/submit, POST /turf/certification-packets/{id}/decide"
  - priority: 13
    category: existence
    check: "the {id} path segment resolves to a CapitalBudget"
    error_id: ERR_CAPITAL_BUDGET_NOT_FOUND
    http_status: 404
    applies_to: "GET /turf/capital-budgets/{id}"
  - priority: 14
    category: existence
    check: "the {id} path segment resolves to a ReplacementPlan"
    error_id: ERR_REPLACEMENT_PLAN_NOT_FOUND
    http_status: 404
    applies_to: "GET /turf/replacement-plans/{id}, POST /turf/replacement-plans/{id}/submit, POST /turf/replacement-plans/{id}/decide, POST /turf/replacement-plans/{id}/disposal-manifest, POST /turf/replacement-plans/{id}/complete"
  - priority: 15
    category: business_safety
    check: |
      Segregation of duties, evaluated before any body parsing so a malformed
      body can never mask a control breach:
      (a) POST /turf/remediation-orders/{id}/submit-verification - X-User-ID must
          not equal the source SafetyAssessment.inspector_staff_member_id;
      (b) POST /turf/remediation-orders/{id}/decide-verification - X-User-ID must
          not equal RemediationOrder.submitted_by_staff_member_id;
      (c) POST /turf/certification-packets/{id}/decide - X-User-ID must not equal
          CertificationPacket.submitted_by_staff_member_id and must not equal the
          governing SafetyAssessment.inspector_staff_member_id;
      (d) POST /turf/replacement-plans/{id}/decide - X-User-ID must not equal
          ReplacementPlan.submitted_by_staff_member_id.
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /turf/remediation-orders/{id}/submit-verification, POST /turf/remediation-orders/{id}/decide-verification, POST /turf/certification-packets/{id}/decide, POST /turf/replacement-plans/{id}/decide"
  - priority: 16
    category: business_constraint
    check: "request body contains every required input field, no unknown fields, correct JSON types, and every enum value is a declared member"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all POST endpoints"
  - priority: 17
    category: business_constraint
    check: "limit is an integer in 1..100 and offset is an integer >= 0"
    error_id: ERR_INVALID_PAGINATION
    http_status: 400
    applies_to: "all list GET endpoints"
  - priority: 18
    category: existence
    check: "field_id in the request body resolves to a Field"
    error_id: ERR_FIELD_NOT_FOUND
    http_status: 404
    applies_to: "POST /turf/maintenance-tasks, POST /turf/safety-assessments, POST /turf/usage-bookings, POST /turf/certification-packets, POST /turf/replacement-plans, POST /turf/fields (predecessor_field_id)"
  - priority: 19
    category: existence
    check: "assigned_staff_member_id, inspector_staff_member_id, requested_by_staff_member_id, submitted_by_staff_member_id or decided_by_staff_member_id in the request body resolves to a StaffMember"
    error_id: ERR_STAFF_MEMBER_NOT_FOUND
    http_status: 404
    applies_to: "POST /turf/maintenance-tasks, POST /turf/safety-assessments, POST /turf/usage-bookings, POST /turf/remediation-orders/{id}/submit-verification, POST /turf/certification-packets/{id}/submit, POST /turf/certification-packets/{id}/decide, POST /turf/replacement-plans/{id}/submit, POST /turf/replacement-plans/{id}/decide"
  - priority: 20
    category: existence
    check: "governing_assessment_id or verification_assessment_id in the request body resolves to a SafetyAssessment"
    error_id: ERR_SAFETY_ASSESSMENT_NOT_FOUND
    http_status: 404
    applies_to: "POST /turf/certification-packets, POST /turf/remediation-orders/{id}/submit-verification"
  - priority: 21
    category: existence
    check: "capital_budget_id in the request body resolves to a CapitalBudget"
    error_id: ERR_CAPITAL_BUDGET_NOT_FOUND
    http_status: 404
    applies_to: "POST /turf/replacement-plans"
  - priority: 22
    category: business_constraint
    check: "Field.name is unique across Fields whose retired_at IS NULL"
    error_id: ERR_FIELD_NAME_DUPLICATE
    http_status: 409
    applies_to: "POST /turf/fields"
  - priority: 23
    category: business_constraint
    check: "CapitalBudget.fiscal_year is unique across all CapitalBudget rows"
    error_id: ERR_FISCAL_YEAR_DUPLICATE
    http_status: 409
    applies_to: "POST /turf/capital-budgets"
  - priority: 24
    category: business_constraint
    check: "roles is a non-empty array of distinct members of {FieldOperationsCoordinator, TurfAgronomist, SafetyInspector, CertificationOfficer, FacilitiesDirector}"
    error_id: ERR_INVALID_ROLE_SET
    http_status: 422
    applies_to: "POST /turf/staff-members"
  - priority: 25
    category: business_constraint
    check: "infill_depth_mm is present when surface_type == SYNTHETIC_TURF and absent (or null) when surface_type == NATURAL_GRASS"
    error_id: ERR_INFILL_DEPTH_REQUIRED
    http_status: 422
    applies_to: "POST /turf/fields"
  - priority: 26
    category: business_constraint
    check: "gmax_readings holds exactly three numbers and declared_result is null when assessment_type == IMPACT_ATTENUATION; gmax_readings is null and declared_result is present when assessment_type IN {GOAL_ANCHORING, STRIPING_LAYOUT}"
    error_id: ERR_ASSESSMENT_METRIC_MISMATCH
    http_status: 422
    applies_to: "POST /turf/safety-assessments"
  - priority: 27
    category: business_constraint
    check: "nitrogen_lb_per_1000_sq_ft is present when task_type == FERTILITY and absent (or null) for every other task_type"
    error_id: ERR_FERTILITY_RATE_MISMATCH
    http_status: 422
    applies_to: "POST /turf/maintenance-tasks"
  - priority: 28
    category: business_constraint
    check: "task_type belongs to the referenced Field's surface class - {AERATION, OVERSEEDING, FERTILITY, IRRIGATION} require NATURAL_GRASS and {GROOMING, INFILL_REDISTRIBUTION, SEAM_INSPECTION} require SYNTHETIC_TURF"
    error_id: ERR_TASK_TYPE_SURFACE_MISMATCH
    http_status: 422
    applies_to: "POST /turf/maintenance-tasks"
  - priority: 29
    category: business_temporal
    check: "scheduled_end_utc > scheduled_start_utc and window_end_utc > window_start_utc"
    error_id: ERR_INVALID_WINDOW
    http_status: 422
    applies_to: "POST /turf/maintenance-tasks, POST /turf/usage-bookings"
  - priority: 30
    category: business_temporal
    check: "assessed_at_utc <= current_utc"
    error_id: ERR_ASSESSMENT_IN_FUTURE
    http_status: 422
    applies_to: "POST /turf/safety-assessments"
  - priority: 31
    category: business_temporal
    check: "to_iso8601 > the current logical clock value - the logical clock never moves backwards"
    error_id: ERR_CLOCK_NOT_MONOTONIC
    http_status: 422
    applies_to: "POST /_clock/set_current_utc"
  - priority: 32
    category: business_referential
    check: "predecessor_field_id, when supplied, references a Field whose retired_at IS NOT NULL"
    error_id: ERR_PREDECESSOR_FIELD_NOT_RETIRED
    http_status: 422
    applies_to: "POST /turf/fields"
  - priority: 33
    category: state
    check: "expected_field_version equals the referenced Field.version (optimistic concurrency per the concurrency rules table)"
    error_id: ERR_STALE_FIELD_VERSION
    http_status: 412
    applies_to: "POST /turf/certification-packets, POST /turf/replacement-plans"
  - priority: 34
    category: state
    check: "the referenced Field.retired_at IS NULL"
    error_id: ERR_FIELD_RETIRED
    http_status: 409
    applies_to: "POST /turf/maintenance-tasks, POST /turf/safety-assessments, POST /turf/usage-bookings, POST /turf/certification-packets, POST /turf/replacement-plans, POST /turf/fields/{id}/closure-order"
  - priority: 35
    category: state
    check: "action START requires status SCHEDULED, action COMPLETE requires status IN_PROGRESS, action CANCEL requires status IN {SCHEDULED, IN_PROGRESS}"
    error_id: ERR_TASK_NOT_TRANSITIONABLE
    http_status: 409
    applies_to: "POST /turf/maintenance-tasks/{id}/transition"
  - priority: 36
    category: state
    check: "SafetyAssessment.status == RECORDED"
    error_id: ERR_ASSESSMENT_NOT_RECORDED
    http_status: 409
    applies_to: "POST /turf/safety-assessments/{id}/void"
  - priority: 37
    category: state
    check: "RemediationOrder.status == OPEN"
    error_id: ERR_ORDER_NOT_OPEN
    http_status: 409
    applies_to: "POST /turf/remediation-orders/{id}/submit-verification"
  - priority: 38
    category: state
    check: "RemediationOrder.status == VERIFICATION_SUBMITTED"
    error_id: ERR_ORDER_NOT_AWAITING_DECISION
    http_status: 409
    applies_to: "POST /turf/remediation-orders/{id}/decide-verification"
  - priority: 39
    category: state
    check: "UsageBooking.status == SCHEDULED"
    error_id: ERR_BOOKING_NOT_SCHEDULED
    http_status: 409
    applies_to: "POST /turf/usage-bookings/{id}/confirm"
  - priority: 40
    category: state
    check: "UsageBooking.status == CONFIRMED"
    error_id: ERR_BOOKING_NOT_CONFIRMED
    http_status: 409
    applies_to: "POST /turf/usage-bookings/{id}/close-out"
  - priority: 41
    category: state
    check: "CertificationPacket.status IN {DRAFT, RETURNED}"
    error_id: ERR_PACKET_NOT_SUBMITTABLE
    http_status: 409
    applies_to: "POST /turf/certification-packets/{id}/submit"
  - priority: 42
    category: state
    check: "CertificationPacket.status == SUBMITTED"
    error_id: ERR_PACKET_NOT_SUBMITTED
    http_status: 409
    applies_to: "POST /turf/certification-packets/{id}/decide"
  - priority: 43
    category: state
    check: "ReplacementPlan.funding_status == DRAFT"
    error_id: ERR_PLAN_NOT_DRAFT
    http_status: 409
    applies_to: "POST /turf/replacement-plans/{id}/submit"
  - priority: 44
    category: state
    check: "ReplacementPlan.funding_status == SUBMITTED when decision IN {APPROVE, REJECT}"
    error_id: ERR_PLAN_NOT_SUBMITTED
    http_status: 409
    applies_to: "POST /turf/replacement-plans/{id}/decide"
  - priority: 45
    category: state
    check: "ReplacementPlan.funding_status == APPROVED and disposal_status != COMPLETED when decision == RESCIND"
    error_id: ERR_PLAN_NOT_APPROVED
    http_status: 409
    applies_to: "POST /turf/replacement-plans/{id}/decide"
  - priority: 46
    category: state
    check: "ReplacementPlan.disposal_status == PENDING"
    error_id: ERR_DISPOSAL_NOT_PENDING
    http_status: 409
    applies_to: "POST /turf/replacement-plans/{id}/disposal-manifest"
  - priority: 47
    category: state
    check: "ReplacementPlan.disposal_status == MANIFESTED and ReplacementPlan.funding_status == APPROVED (the single cross-axis guard between the two parallel state dimensions)"
    error_id: ERR_DISPOSAL_COMPLETION_NOT_PERMITTED
    http_status: 409
    applies_to: "POST /turf/replacement-plans/{id}/complete"
  - priority: 48
    category: state
    check: "action CLOSE_ADMIN requires Field.admin_closure_active == false"
    error_id: ERR_FIELD_ALREADY_CLOSED
    http_status: 409
    applies_to: "POST /turf/fields/{id}/closure-order"
  - priority: 49
    category: state
    check: "action REOPEN_ADMIN requires Field.admin_closure_active == true"
    error_id: ERR_FIELD_NOT_CLOSED
    http_status: 409
    applies_to: "POST /turf/fields/{id}/closure-order"
  - priority: 50
    category: state
    check: "CapitalBudget.status == OPEN"
    error_id: ERR_BUDGET_LOCKED
    http_status: 409
    applies_to: "POST /turf/replacement-plans/{id}/submit, POST /turf/replacement-plans/{id}/decide with decision APPROVE"
  - priority: 51
    category: business_safety
    check: "Field.play_status IN {OPEN, RESTRICTED} - a field that is CLOSED_ADMIN, CLOSED_UNSAFE or RETIRED accepts no booking creation and no confirmation"
    error_id: ERR_FIELD_NOT_PLAYABLE
    http_status: 422
    applies_to: "POST /turf/usage-bookings, POST /turf/usage-bookings/{id}/confirm"
  - priority: 52
    category: business_safety
    check: "activity_type is a member of ALLOWED_ACTIVITIES[Field.play_status] - a RESTRICTED field accepts only PRACTICE and COMMUNITY"
    error_id: ERR_FIELD_RESTRICTED_FOR_ACTIVITY
    http_status: 422
    applies_to: "POST /turf/usage-bookings, POST /turf/usage-bookings/{id}/confirm"
  - priority: 53
    category: business_safety
    check: "Field.open_mandatory_remediation_count == 0 - an administrative closure or reopening may not be layered on top of an unsafe closure"
    error_id: ERR_UNSAFE_CLOSURE_IN_FORCE
    http_status: 409
    applies_to: "POST /turf/fields/{id}/closure-order"
  - priority: 54
    category: business_safety
    check: "Field.open_mandatory_remediation_count == 0 when decision == APPROVE"
    error_id: ERR_OPEN_MANDATORY_REMEDIATION
    http_status: 422
    applies_to: "POST /turf/certification-packets/{id}/decide"
  - priority: 55
    category: business_safety
    check: "no CertificationPacket with status IN {SUBMITTED, APPROVED} names this assessment as governing_assessment_id"
    error_id: ERR_ASSESSMENT_IN_USE
    http_status: 409
    applies_to: "POST /turf/safety-assessments/{id}/void"
  - priority: 56
    category: business_safety
    check: "the RemediationOrder's verification SafetyAssessment.result == PASS when decision == ACCEPT"
    error_id: ERR_VERIFICATION_NOT_PASSING
    http_status: 422
    applies_to: "POST /turf/remediation-orders/{id}/decide-verification"
  - priority: 57
    category: business_referential
    check: "governing_assessment_id references a SafetyAssessment with the same field_id, assessment_type == IMPACT_ATTENUATION, status == RECORDED and result != FAIL"
    error_id: ERR_GOVERNING_ASSESSMENT_NOT_CURRENT
    http_status: 422
    applies_to: "POST /turf/certification-packets, POST /turf/certification-packets/{id}/submit"
  - priority: 58
    category: business_referential
    check: "verification_assessment_id references a SafetyAssessment with the same field_id as the order, the same assessment_type as the order's source assessment, status == RECORDED, and assessed_at_utc >= RemediationOrder.opened_at_utc"
    error_id: ERR_VERIFICATION_ASSESSMENT_INVALID
    http_status: 422
    applies_to: "POST /turf/remediation-orders/{id}/submit-verification"
  - priority: 59
    category: business_referential
    check: "when activity_type == TOURNAMENT and Field.sanctioned_level != NONE, Field.certification_status == CERTIFIED"
    error_id: ERR_FIELD_NOT_CERTIFIED
    http_status: 422
    applies_to: "POST /turf/usage-bookings/{id}/confirm"
  - priority: 60
    category: business_temporal
    check: "current_utc < UsageBooking.window_start_utc"
    error_id: ERR_BOOKING_WINDOW_STARTED
    http_status: 422
    applies_to: "POST /turf/usage-bookings/{id}/confirm"
  - priority: 61
    category: business_temporal
    check: "current_utc >= UsageBooking.window_end_utc"
    error_id: ERR_BOOKING_WINDOW_NOT_ELAPSED
    http_status: 422
    applies_to: "POST /turf/usage-bookings/{id}/close-out"
  - priority: 62
    category: business_temporal
    check: |
      INTERVAL SEMANTICS A - half-open intervals on Field with a symmetric
      changeover buffer. The requested window conflicts with an existing
      UsageBooking on the same field whose status IN {SCHEDULED, CONFIRMED} when
        new.window_start_utc < existing.window_end_utc + CHANGEOVER_BUFFER_MINUTES
        AND existing.window_start_utc < new.window_end_utc + CHANGEOVER_BUFFER_MINUTES
      so back-to-back bookings (gap 0) conflict and a gap of exactly
      CHANGEOVER_BUFFER_MINUTES = 30 is accepted. Terminal-status bookings are
      excluded from the candidate set.
    error_id: ERR_BOOKING_WINDOW_CONFLICT
    http_status: 409
    applies_to: "POST /turf/usage-bookings"
  - priority: 63
    category: business_temporal
    check: |
      INTERVAL SEMANTICS B - closed intervals on StaffMember with aggregate
      capacity. Counting MaintenanceTasks assigned to the same
      assigned_staff_member_id with status IN {SCHEDULED, IN_PROGRESS} whose
      [scheduled_start_utc, scheduled_end_utc] closed interval intersects the
      requested closed interval (touching endpoints DO intersect), the request is
      rejected when that count is already >= MAX_CONCURRENT_STAFF_TASKS = 2.
      Unlike semantics A there is no buffer and a single overlap is permitted -
      it is the aggregate that is capped.
    error_id: ERR_STAFF_TASK_CAPACITY_EXCEEDED
    http_status: 409
    applies_to: "POST /turf/maintenance-tasks"
  - priority: 64
    category: business_temporal
    check: "INTERVAL SEMANTICS C - the requested maintenance closed interval must not strictly overlap the half-open interval of any UsageBooking on the same field with status IN {SCHEDULED, CONFIRMED}; adjacency with zero gap is permitted here, unlike semantics A"
    error_id: ERR_TASK_CONFLICTS_WITH_BOOKING
    http_status: 409
    applies_to: "POST /turf/maintenance-tasks"
  - priority: 65
    category: business_constraint
    check: "total_tonnage > 0.00, diverted_tonnage <= total_tonnage, and round_half_up(diverted_tonnage / total_tonnage, 2) >= MIN_DIVERSION_RATIO = 0.75"
    error_id: ERR_DISPOSAL_DIVERSION_BELOW_MINIMUM
    http_status: 422
    applies_to: "POST /turf/replacement-plans/{id}/disposal-manifest"
  - priority: 66
    category: business_fiscal
    check: "CertificationPacket.documentation_completeness_score >= MIN_CERTIFICATION_COMPLETENESS_SCORE = 90.00 when decision == APPROVE"
    error_id: ERR_CERTIFICATION_DOCUMENTATION_INCOMPLETE
    http_status: 422
    applies_to: "POST /turf/certification-packets/{id}/decide"
  - priority: 67
    category: business_fiscal
    check: "CertificationPacket.condition_index_certification >= MIN_CERTIFICATION_CONDITION_INDEX = 55.00 when decision == APPROVE"
    error_id: ERR_CONDITION_INDEX_BELOW_CERTIFICATION_FLOOR
    http_status: 422
    applies_to: "POST /turf/certification-packets/{id}/decide"
  - priority: 68
    category: business_fiscal
    check: "ReplacementPlan.replacement_priority_score >= MIN_APPROVAL_PRIORITY_SCORE = 20.00 when decision == APPROVE"
    error_id: ERR_PLAN_PRIORITY_BELOW_THRESHOLD
    http_status: 422
    applies_to: "POST /turf/replacement-plans/{id}/decide"
  - priority: 69
    category: business_fiscal
    check: "ReplacementPlan.plan_funding_amount_cents <= CapitalBudget.available_amount_cents when decision == APPROVE"
    error_id: ERR_BUDGET_INSUFFICIENT
    http_status: 422
    applies_to: "POST /turf/replacement-plans/{id}/decide"

# =============================================================================
# 1.5 API Endpoint Table
# =============================================================================
endpoints:
  - method: POST
    path: "/turf/fields"
    description: "Register a field in the inventory. Computes age_years, warranty_status and condition_index_agronomic immediately; play_status starts OPEN and certification_status starts NOT_CERTIFIED."
    roles: [FacilitiesDirector]
    code: 201
    input: [name, surface_type, installed_on_date, expected_life_years, area_sq_ft, sanctioned_level, "warranty_expires_on?", "infill_depth_mm?", "predecessor_field_id?"]
    output: Field
    side_effects:
      - "runs calculations.field_age_and_warranty_status"
      - "runs calculations.field_condition_index AGRONOMIC variant with latest_gmax_mean_value null, so safety_component is NO_DATA_SAFETY_COMPONENT"
      - "runs calculations.field_play_status, yielding OPEN"
      - "all derived counters initialise to 0 and cumulative_wear_units / rest_debt_hours / nitrogen_applied_ytd_lb_per_1000_sq_ft to 0.00"

  - method: GET
    path: "/turf/fields"
    description: "List fields with optional filters; also the reverse-reachability channel for the self-referential predecessor_field_id foreign key."
    roles: [FieldOperationsCoordinator, TurfAgronomist, SafetyInspector, CertificationOfficer, FacilitiesDirector]
    code: 200
    input: ["surface_type?", "play_status?", "certification_status?", "predecessor_field_id?", "limit?", "offset?"]
    output: Field[]
    side_effects: []

  - method: GET
    path: "/turf/fields/{id}"
    description: "Read one field including every derived posture, counter and index."
    roles: [FieldOperationsCoordinator, TurfAgronomist, SafetyInspector, CertificationOfficer, FacilitiesDirector]
    code: 200
    input: []
    output: Field
    side_effects: []

  - method: POST
    path: "/turf/fields/{id}/closure-order"
    description: "Place or lift an administrative closure. action is CLOSE_ADMIN or REOPEN_ADMIN. Deliberately does NOT cancel existing bookings, unlike the unsafe closure cascade."
    roles: [FacilitiesDirector]
    code: 200
    input: [action, reason_code]
    output: Field
    side_effects:
      - "sets or clears Field.admin_closure_active and Field.admin_closure_reason_code"
      - "recomputes Field.play_status"
      - "increments Field.version by 1"
      - "existing UsageBookings are left untouched in SCHEDULED or CONFIRMED"

  - method: POST
    path: "/turf/staff-members"
    description: "Create a staff member. roles is an array, so a person may be dual-hatted; this endpoint is exempt from the role-identity check so the first FacilitiesDirector can be bootstrapped into an empty database."
    roles: [FacilitiesDirector]
    code: 201
    input: [full_name, roles, "employment_status?"]
    output: StaffMember
    side_effects: []

  - method: GET
    path: "/turf/staff-members/{id}"
    description: "Read one staff member including the roles array."
    roles: [FieldOperationsCoordinator, TurfAgronomist, SafetyInspector, CertificationOfficer, FacilitiesDirector]
    code: 200
    input: []
    output: StaffMember
    side_effects: []

  - method: POST
    path: "/turf/maintenance-tasks"
    description: "Schedule an agronomic or synthetic maintenance task. Enforces the surface-class match, the staff aggregate-capacity rule and the booking-overlap rule."
    roles: [TurfAgronomist, FieldOperationsCoordinator]
    code: 201
    input: [field_id, assigned_staff_member_id, task_type, scheduled_start_utc, scheduled_end_utc, "planned_for_certification_window?", "nitrogen_lb_per_1000_sq_ft?"]
    output: MaintenanceTask
    side_effects:
      - "copies Field.surface_type into MaintenanceTask.surface_class"
      - "materialises MaintenanceTask.recovery_credit_hours from RECOVERY_CREDIT_HOURS[task_type]"
      - "status initialises to SCHEDULED"

  - method: GET
    path: "/turf/maintenance-tasks"
    description: "List maintenance tasks; the reverse-reachability channel for field_id and assigned_staff_member_id."
    roles: [FieldOperationsCoordinator, TurfAgronomist, SafetyInspector, CertificationOfficer, FacilitiesDirector]
    code: 200
    input: ["field_id?", "assigned_staff_member_id?", "task_type?", "status?", "planned_for_certification_window?", "limit?", "offset?"]
    output: MaintenanceTask[]
    side_effects: []

  - method: GET
    path: "/turf/maintenance-tasks/{id}"
    description: "Read one maintenance task."
    roles: [FieldOperationsCoordinator, TurfAgronomist, SafetyInspector, CertificationOfficer, FacilitiesDirector]
    code: 200
    input: []
    output: MaintenanceTask
    side_effects: []

  - method: POST
    path: "/turf/maintenance-tasks/{id}/transition"
    description: "Advance a maintenance task. action is START, COMPLETE or CANCEL. completed_at_utc is required for COMPLETE and cancellation_reason for CANCEL."
    roles: [TurfAgronomist, FieldOperationsCoordinator]
    code: 200
    input: [action, "completed_at_utc?", "cancellation_reason?"]
    output: MaintenanceTask
    side_effects:
      - "START stamps started_at_utc"
      - "COMPLETE stamps completed_at_utc, recomputes Field.rest_debt_hours, appends a RECOVERY_CREDIT UsageLedgerEntry when the capped credit is > 0.00, adds FERTILITY nitrogen to Field.nitrogen_applied_ytd_lb_per_1000_sq_ft, recomputes Field.play_status and increments Field.version by 1"
      - "CANCEL stamps cancellation_reason and removes the task from the staff-capacity and certification-program denominators"

  - method: POST
    path: "/turf/safety-assessments"
    description: "Record an impact-attenuation test, goal-anchoring inspection or striping-layout inspection. A FAIL or ADVISORY result opens a RemediationOrder, which is the head of the five-hop safety cascade."
    roles: [SafetyInspector]
    code: 201
    input: [field_id, inspector_staff_member_id, assessment_type, assessed_at_utc, "gmax_readings?", "declared_result?"]
    output: SafetyAssessment
    side_effects:
      - "runs calculations.impact_attenuation_result to derive gmax_mean_value and result"
      - "transitions any prior RECORDED assessment of the same assessment_type on the same field to SUPERSEDED"
      - "for IMPACT_ATTENUATION updates Field.latest_gmax_mean_value and recomputes Field.condition_index_agronomic"
      - "cascade hop 2: result FAIL creates a RemediationOrder with severity MANDATORY and status OPEN; result ADVISORY creates one with severity ADVISORY"
      - "cascade hop 3: the new order increments Field.open_mandatory_remediation_count or open_advisory_remediation_count and Field.play_status is recomputed"
      - "cascade hop 4: a CLOSED_UNSAFE posture cancels every SCHEDULED or CONFIRMED UsageBooking on the field with window_start_utc >= current_utc"
      - "cascade hop 5: each cancellation appends an UNSAFE_CANCELLATION UsageLedgerEntry, increments Field.unsafe_cancellation_count and recomputes Field.rest_debt_hours"
      - "increments Field.version by 1"

  - method: GET
    path: "/turf/safety-assessments"
    description: "List safety assessments; the reverse-reachability channel for field_id and inspector_staff_member_id."
    roles: [FieldOperationsCoordinator, TurfAgronomist, SafetyInspector, CertificationOfficer, FacilitiesDirector]
    code: 200
    input: ["field_id?", "inspector_staff_member_id?", "assessment_type?", "status?", "result?", "limit?", "offset?"]
    output: SafetyAssessment[]
    side_effects: []

  - method: GET
    path: "/turf/safety-assessments/{id}"
    description: "Read one safety assessment including gmax_mean_value and result."
    roles: [FieldOperationsCoordinator, TurfAgronomist, SafetyInspector, CertificationOfficer, FacilitiesDirector]
    code: 200
    input: []
    output: SafetyAssessment
    side_effects: []

  - method: POST
    path: "/turf/safety-assessments/{id}/void"
    description: "Void a mis-recorded assessment. Cancels the RemediationOrders it opened and rolls Field.latest_gmax_mean_value back to the next most recent RECORDED impact test."
    roles: [SafetyInspector]
    code: 200
    input: [void_reason]
    output: SafetyAssessment
    side_effects:
      - "sets status VOIDED and void_reason"
      - "cancels every RemediationOrder whose source_assessment_id is this assessment and whose status IN {OPEN, VERIFICATION_SUBMITTED}"
      - "decrements the matching Field remediation counter and recomputes Field.play_status"
      - "rolls Field.latest_gmax_mean_value back and recomputes Field.condition_index_agronomic"
      - "increments Field.version by 1"

  - method: GET
    path: "/turf/remediation-orders"
    description: "List remediation orders. Orders are created only by the safety cascade, so this is their sole discovery channel and the reverse-reachability channel for all four of their foreign keys."
    roles: [FieldOperationsCoordinator, TurfAgronomist, SafetyInspector, CertificationOfficer, FacilitiesDirector]
    code: 200
    input: ["field_id?", "source_assessment_id?", "verification_assessment_id?", "submitted_by_staff_member_id?", "severity?", "status?", "limit?", "offset?"]
    output: RemediationOrder[]
    side_effects: []

  - method: GET
    path: "/turf/remediation-orders/{id}"
    description: "Read one remediation order."
    roles: [FieldOperationsCoordinator, TurfAgronomist, SafetyInspector, CertificationOfficer, FacilitiesDirector]
    code: 200
    input: []
    output: RemediationOrder
    side_effects: []

  - method: POST
    path: "/turf/remediation-orders/{id}/submit-verification"
    description: "Offer a re-test as evidence that the remediation worked. The submitter must not be the inspector who produced the source assessment."
    roles: [TurfAgronomist]
    code: 200
    input: [verification_assessment_id, submitted_by_staff_member_id, remediation_notes]
    output: RemediationOrder
    side_effects:
      - "status OPEN -> VERIFICATION_SUBMITTED"
      - "records verification_assessment_id, submitted_by_staff_member_id and remediation_notes"
      - "Field.play_status is unchanged because the order still counts as open"

  - method: POST
    path: "/turf/remediation-orders/{id}/decide-verification"
    description: "Accept or reject a submitted verification. decision is ACCEPT or REJECT. REJECT returns the order to OPEN, which is the cycle in this state machine."
    roles: [SafetyInspector]
    code: 200
    input: [decision, "decision_notes?"]
    output: RemediationOrder
    side_effects:
      - "ACCEPT sets status CLOSED_VERIFIED, stamps closed_at_utc, decrements the matching Field remediation counter, recomputes Field.play_status and increments Field.version by 1"
      - "REJECT sets status OPEN, increments rejection_count, clears verification_assessment_id and submitted_by_staff_member_id, and leaves Field.play_status unchanged"

  - method: POST
    path: "/turf/usage-bookings"
    description: "Request a field allocation. Enforces the posture gate, the activity gate and the half-open-with-buffer overlap rule."
    roles: [FieldOperationsCoordinator]
    code: 201
    input: [field_id, requested_by_staff_member_id, activity_type, window_start_utc, window_end_utc, expected_participant_count]
    output: UsageBooking
    side_effects:
      - "status initialises to SCHEDULED and started_with_rest_debt stays null until confirmation"

  - method: GET
    path: "/turf/usage-bookings"
    description: "List bookings; the reverse-reachability channel for field_id and requested_by_staff_member_id, and the discovery channel for cascade-cancelled bookings."
    roles: [FieldOperationsCoordinator, TurfAgronomist, SafetyInspector, CertificationOfficer, FacilitiesDirector]
    code: 200
    input: ["field_id?", "requested_by_staff_member_id?", "activity_type?", "status?", "limit?", "offset?"]
    output: UsageBooking[]
    side_effects: []

  - method: GET
    path: "/turf/usage-bookings/{id}"
    description: "Read one booking including its close-out results."
    roles: [FieldOperationsCoordinator, TurfAgronomist, SafetyInspector, CertificationOfficer, FacilitiesDirector]
    code: 200
    input: []
    output: UsageBooking
    side_effects: []

  - method: POST
    path: "/turf/usage-bookings/{id}/confirm"
    description: "Confirm a scheduled booking. Re-checks the posture and activity gates, applies the tournament certification gate, and stamps started_with_rest_debt."
    roles: [FieldOperationsCoordinator]
    code: 200
    input: []
    output: UsageBooking
    side_effects:
      - "status SCHEDULED -> CONFIRMED"
      - "stamps confirmed_at_utc from the logical clock"
      - "stamps started_with_rest_debt := (Field.rest_debt_hours > 0.00), which feeds no calculation but is retained for audit"

  - method: POST
    path: "/turf/usage-bookings/{id}/close-out"
    description: "Close out a confirmed booking. outcome is PLAYED, RAINED_OUT or CANCELLED_LATE, and the three branches have divergent ledger side effects."
    roles: [FieldOperationsCoordinator]
    code: 200
    input: [outcome, actual_duration_hours, actual_participant_count, weather_condition]
    output: UsageBooking
    side_effects:
      - "runs calculations.wear_load_units and, for PLAYED and RAINED_OUT, calculations.rest_requirement_hours"
      - "PLAYED appends one PLAY_WEAR UsageLedgerEntry"
      - "RAINED_OUT appends a PLAY_WEAR entry and then a compensating RAIN_OUT_RELIEF entry of the exact negative amount, leaving Field.cumulative_wear_units unchanged while the rest obligation stands"
      - "CANCELLED_LATE appends one LATE_CANCEL_WEAR entry at LATE_CANCEL_WEAR_FRACTION of the full-window wear and opens no rest window"
      - "recomputes Field.cumulative_wear_units, Field.rest_debt_hours, Field.condition_index_agronomic and Field.play_status"
      - "increments Field.usage_hours_ytd by actual_duration_hours for PLAYED and RAINED_OUT only"
      - "increments Field.version by 1"

  - method: GET
    path: "/turf/usage-ledger-entries"
    description: "List immutable wear-ledger entries. Entries are appended only by side effects, so this is their sole discovery channel and the reverse-reachability channel for all three of their foreign keys."
    roles: [FieldOperationsCoordinator, TurfAgronomist, SafetyInspector, CertificationOfficer, FacilitiesDirector]
    code: 200
    input: ["field_id?", "booking_id?", "maintenance_task_id?", "entry_type?", "limit?", "offset?"]
    output: UsageLedgerEntry[]
    side_effects: []

  - method: GET
    path: "/turf/usage-ledger-entries/{id}"
    description: "Read one ledger entry including running_balance_after."
    roles: [FieldOperationsCoordinator, TurfAgronomist, SafetyInspector, CertificationOfficer, FacilitiesDirector]
    code: 200
    input: []
    output: UsageLedgerEntry
    side_effects: []

  - method: POST
    path: "/turf/certification-packets"
    description: "Open a certification packet in DRAFT against a governing impact-attenuation assessment. Guarded by optimistic concurrency on Field.version."
    roles: [CertificationOfficer]
    code: 201
    input: [field_id, governing_assessment_id, competition_season_label, expected_field_version]
    output: CertificationPacket
    side_effects:
      - "rejects the request with ERR_STALE_FIELD_VERSION when expected_field_version != Field.version"
      - "increments Field.version by 1"
      - "increments Field.open_certification_packet_count by 1"
      - "status initialises to DRAFT with both scores null"

  - method: GET
    path: "/turf/certification-packets"
    description: "List certification packets; the reverse-reachability channel for all four of their foreign keys."
    roles: [FieldOperationsCoordinator, TurfAgronomist, SafetyInspector, CertificationOfficer, FacilitiesDirector]
    code: 200
    input: ["field_id?", "governing_assessment_id?", "submitted_by_staff_member_id?", "decided_by_staff_member_id?", "status?", "limit?", "offset?"]
    output: CertificationPacket[]
    side_effects: []

  - method: GET
    path: "/turf/certification-packets/{id}"
    description: "Read one certification packet including both computed scores."
    roles: [FieldOperationsCoordinator, TurfAgronomist, SafetyInspector, CertificationOfficer, FacilitiesDirector]
    code: 200
    input: []
    output: CertificationPacket
    side_effects: []

  - method: POST
    path: "/turf/certification-packets/{id}/submit"
    description: "Submit a DRAFT or RETURNED packet for decision. Recomputes both scores from scratch at every submission."
    roles: [CertificationOfficer]
    code: 200
    input: [submitted_by_staff_member_id]
    output: CertificationPacket
    side_effects:
      - "status DRAFT|RETURNED -> SUBMITTED and stamps submitted_at_utc"
      - "runs calculations.certification_document_completeness_score into documentation_completeness_score"
      - "runs calculations.field_condition_index CERTIFICATION variant into condition_index_certification"
      - "recomputes Field.certification_status to PENDING_REVIEW unless a still-valid APPROVED packet keeps it CERTIFIED"
      - "increments Field.version by 1"

  - method: POST
    path: "/turf/certification-packets/{id}/decide"
    description: "Approve or return a submitted packet. decision is APPROVE or RETURN. The deciding officer may be neither the submitter nor the inspector behind the governing assessment."
    roles: [CertificationOfficer]
    code: 200
    input: [decision, decided_by_staff_member_id, "decision_notes?"]
    output: CertificationPacket
    side_effects:
      - "APPROVE sets status APPROVED, stamps decided_at_utc and certified_until_utc = current_utc + 365 days, supersedes any other APPROVED packet on the field, sets Field.certification_status CERTIFIED and Field.certified_until_utc, decrements Field.open_certification_packet_count and increments Field.version by 1"
      - "RETURN sets status RETURNED, increments return_count, clears submitted_by_staff_member_id, recomputes Field.certification_status and increments Field.version by 1"

  - method: POST
    path: "/turf/capital-budgets"
    description: "Authorise a fiscal-year capital budget. Computes lock_threshold_amount_cents at 90 percent of the authorisation."
    roles: [FacilitiesDirector]
    code: 201
    input: [fiscal_year, total_authorized_amount_cents]
    output: CapitalBudget
    side_effects:
      - "runs calculations.capital_budget_commitment, yielding committed_amount_cents 0, available_amount_cents = total_authorized_amount_cents, status OPEN and lock_threshold_amount_cents = round_half_up(total_authorized_amount_cents * 0.90)"

  - method: GET
    path: "/turf/capital-budgets/{id}"
    description: "Read one capital budget including the commitment and lock threshold."
    roles: [FieldOperationsCoordinator, TurfAgronomist, SafetyInspector, CertificationOfficer, FacilitiesDirector]
    code: 200
    input: []
    output: CapitalBudget
    side_effects: []

  - method: POST
    path: "/turf/replacement-plans"
    description: "Draft a replacement plan. Prices the plan, scores it under the variant named by priority_basis, and is guarded by optimistic concurrency on Field.version."
    roles: [FacilitiesDirector]
    code: 201
    input: [field_id, capital_budget_id, target_surface_type, area_sq_ft, priority_basis, planned_install_year, expected_field_version]
    output: ReplacementPlan
    side_effects:
      - "rejects the request with ERR_STALE_FIELD_VERSION when expected_field_version != Field.version"
      - "runs calculations.plan_funding_amount_cents to derive base_construction_cents, disposal_cents, pre_contingency_subtotal_cents, contingency_rate, contingency_cents and plan_funding_amount_cents"
      - "runs calculations.replacement_priority_score under the variant named by priority_basis"
      - "funding_status initialises to DRAFT; disposal_status initialises to PENDING when the existing Field.surface_type == SYNTHETIC_TURF and to NOT_APPLICABLE otherwise"
      - "increments Field.open_replacement_plan_count by 1 and Field.version by 1"

  - method: GET
    path: "/turf/replacement-plans"
    description: "List replacement plans; the reverse-reachability channel for all four of their foreign keys and the discovery channel for cascade-DEFERRED plans."
    roles: [FieldOperationsCoordinator, TurfAgronomist, SafetyInspector, CertificationOfficer, FacilitiesDirector]
    code: 200
    input: ["field_id?", "capital_budget_id?", "submitted_by_staff_member_id?", "decided_by_staff_member_id?", "funding_status?", "disposal_status?", "limit?", "offset?"]
    output: ReplacementPlan[]
    side_effects: []

  - method: GET
    path: "/turf/replacement-plans/{id}"
    description: "Read one replacement plan including both state axes and the full cost breakdown."
    roles: [FieldOperationsCoordinator, TurfAgronomist, SafetyInspector, CertificationOfficer, FacilitiesDirector]
    code: 200
    input: []
    output: ReplacementPlan
    side_effects: []

  - method: POST
    path: "/turf/replacement-plans/{id}/submit"
    description: "Submit a DRAFT plan for a funding decision. Requires the capital budget to be OPEN."
    roles: [FacilitiesDirector]
    code: 200
    input: [submitted_by_staff_member_id]
    output: ReplacementPlan
    side_effects:
      - "funding_status DRAFT -> SUBMITTED, stamps submitted_at_utc and submitted_by_staff_member_id"
      - "disposal_status is untouched"

  - method: POST
    path: "/turf/replacement-plans/{id}/decide"
    description: "Decide a plan's funding. decision is APPROVE, REJECT or RESCIND; RESCIND is the compensating action that releases committed capital. The decider may not be the submitter."
    roles: [FacilitiesDirector]
    code: 200
    input: [decision, decided_by_staff_member_id, "decision_notes?"]
    output: ReplacementPlan
    side_effects:
      - "APPROVE: funding_status -> APPROVED; cascade hop 2 increases CapitalBudget.committed_amount_cents by plan_funding_amount_cents; cascade hop 3 locks the budget when committed_amount_cents >= lock_threshold_amount_cents; cascade hop 4 defers every other DRAFT plan on that budget"
      - "REJECT: funding_status -> REJECTED, no capital movement, decrements Field.open_replacement_plan_count and increments Field.version by 1"
      - "RESCIND: funding_status -> RESCINDED, releases exactly plan_funding_amount_cents from the budget, reopens the budget when the commitment falls back below the threshold, returns every DEFERRED sibling to DRAFT, sets disposal_status to NOT_APPLICABLE, decrements Field.open_replacement_plan_count and increments Field.version by 1"

  - method: POST
    path: "/turf/replacement-plans/{id}/disposal-manifest"
    description: "Record the waste manifest for the synthetic material being removed. Advances only the disposal axis and never reads funding_status."
    roles: [FacilitiesDirector]
    code: 200
    input: [manifest_reference, disposal_facility_name, diverted_tonnage, total_tonnage]
    output: ReplacementPlan
    side_effects:
      - "disposal_status PENDING -> MANIFESTED"
      - "records manifest_reference, disposal_facility_name, diverted_tonnage, total_tonnage and diversion_ratio"
      - "funding_status is neither read nor changed"

  - method: POST
    path: "/turf/replacement-plans/{id}/complete"
    description: "Close out the disposal and retire the old field. This is the single cross-axis guard: it requires disposal_status MANIFESTED AND funding_status APPROVED."
    roles: [FacilitiesDirector]
    code: 200
    input: [completed_at_utc]
    output: ReplacementPlan
    side_effects:
      - "disposal_status MANIFESTED -> COMPLETED and stamps completed_at_utc"
      - "sets Field.retired_at, driving Field.play_status to RETIRED and Field.certification_status to NOT_CERTIFIED"
      - "cancels every non-terminal UsageBooking on the field as CANCELLED_UNSAFE with an UNSAFE_CANCELLATION ledger entry each"
      - "increments Field.version by 1"

  - method: POST
    path: "/_clock/set_current_utc"
    description: "Test-driving endpoint that moves the server's logical clock forward. Before the first call the logical clock reads exactly 2026-08-01T00:00:00Z and never falls back to real wall-clock time. Recomputes every time-dependent derived field on every Field."
    roles: [FacilitiesDirector]
    code: 200
    input: [to_iso8601]
    output: { current_utc: string, fields_recomputed: integer }
    side_effects:
      - "recomputes calculations.field_age_and_warranty_status for every Field"
      - "recomputes calculations.field_rest_debt_hours for every Field"
      - "recomputes calculations.field_certification_status for every Field, expiring certifications whose certified_until_utc has been reached"
      - "recomputes calculations.field_condition_index AGRONOMIC variant and calculations.field_play_status for every Field"
      - "increments Field.version by 1 for every Field whose derived values changed"

# =============================================================================
# 1.6 Error Code Catalog
# =============================================================================
errors:
  # --- authentication and authorisation ---
  - id: ERR_MISSING_AUTH_HEADERS
    http: 401
    condition: "X-User-Role or X-User-ID request header is absent or empty"
  - id: ERR_UNKNOWN_ROLE
    http: 401
    condition: "X-User-Role is not one of the five declared roles"
  - id: ERR_ROLE_IDENTITY_MISMATCH
    http: 403
    condition: "X-User-ID does not resolve to an ACTIVE StaffMember whose roles array contains X-User-Role (POST /turf/staff-members is exempt for bootstrap)"
  - id: ERR_UNAUTHORIZED
    http: 403
    condition: "the acting role is not listed in the endpoint's roles"
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 403
    condition: "the acting X-User-ID is the same staff member who submitted the artefact under decision, or the inspector behind the governing assessment"

  # --- not found ---
  - id: ERR_FIELD_NOT_FOUND
    http: 404
    condition: "a field id in the path or body does not resolve to a Field"
  - id: ERR_STAFF_MEMBER_NOT_FOUND
    http: 404
    condition: "a staff member id in the path or body does not resolve to a StaffMember"
  - id: ERR_MAINTENANCE_TASK_NOT_FOUND
    http: 404
    condition: "the path id does not resolve to a MaintenanceTask"
  - id: ERR_SAFETY_ASSESSMENT_NOT_FOUND
    http: 404
    condition: "an assessment id in the path or body does not resolve to a SafetyAssessment"
  - id: ERR_REMEDIATION_ORDER_NOT_FOUND
    http: 404
    condition: "the path id does not resolve to a RemediationOrder"
  - id: ERR_USAGE_BOOKING_NOT_FOUND
    http: 404
    condition: "the path id does not resolve to a UsageBooking"
  - id: ERR_LEDGER_ENTRY_NOT_FOUND
    http: 404
    condition: "the path id does not resolve to a UsageLedgerEntry"
  - id: ERR_CERTIFICATION_PACKET_NOT_FOUND
    http: 404
    condition: "the path id does not resolve to a CertificationPacket"
  - id: ERR_CAPITAL_BUDGET_NOT_FOUND
    http: 404
    condition: "a budget id in the path or body does not resolve to a CapitalBudget"
  - id: ERR_REPLACEMENT_PLAN_NOT_FOUND
    http: 404
    condition: "the path id does not resolve to a ReplacementPlan"

  # --- request shape and static constraints ---
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "a required body field is missing, an unknown field is present, a JSON type is wrong, or an enum value is not a declared member"
  - id: ERR_INVALID_PAGINATION
    http: 400
    condition: "limit is outside 1..100 or offset is negative"
  - id: ERR_FIELD_NAME_DUPLICATE
    http: 409
    condition: "another Field with retired_at IS NULL already carries this name"
  - id: ERR_FISCAL_YEAR_DUPLICATE
    http: 409
    condition: "a CapitalBudget already exists for this fiscal_year"
  - id: ERR_INVALID_ROLE_SET
    http: 422
    condition: "roles is empty, contains duplicates, or names a role outside the declared five"
  - id: ERR_INFILL_DEPTH_REQUIRED
    http: 422
    condition: "infill_depth_mm is missing for a SYNTHETIC_TURF field or supplied for a NATURAL_GRASS field"
  - id: ERR_ASSESSMENT_METRIC_MISMATCH
    http: 422
    condition: "gmax_readings does not hold exactly three numbers for IMPACT_ATTENUATION, or declared_result is supplied for IMPACT_ATTENUATION, or gmax_readings is supplied for a non-impact assessment_type"
  - id: ERR_FERTILITY_RATE_MISMATCH
    http: 422
    condition: "nitrogen_lb_per_1000_sq_ft is missing for FERTILITY or supplied for a non-FERTILITY task_type"
  - id: ERR_TASK_TYPE_SURFACE_MISMATCH
    http: 422
    condition: "task_type does not belong to the referenced Field's surface class"
  - id: ERR_DISPOSAL_DIVERSION_BELOW_MINIMUM
    http: 422
    condition: "total_tonnage is not positive, diverted_tonnage exceeds total_tonnage, or the rounded diversion ratio is below MIN_DIVERSION_RATIO 0.75"

  # --- temporal ---
  - id: ERR_INVALID_WINDOW
    http: 422
    condition: "the end instant is not strictly after the start instant"
  - id: ERR_ASSESSMENT_IN_FUTURE
    http: 422
    condition: "assessed_at_utc is after the logical clock's current_utc"
  - id: ERR_CLOCK_NOT_MONOTONIC
    http: 422
    condition: "to_iso8601 is not strictly after the current logical clock value"
  - id: ERR_BOOKING_WINDOW_STARTED
    http: 422
    condition: "confirmation is attempted at or after the booking's window_start_utc"
  - id: ERR_BOOKING_WINDOW_NOT_ELAPSED
    http: 422
    condition: "close-out is attempted before the booking's window_end_utc"
  - id: ERR_BOOKING_WINDOW_CONFLICT
    http: 409
    condition: "the requested window, widened by the 30-minute changeover buffer on both sides, overlaps a SCHEDULED or CONFIRMED booking on the same field"
  - id: ERR_STAFF_TASK_CAPACITY_EXCEEDED
    http: 409
    condition: "the assigned staff member already has MAX_CONCURRENT_STAFF_TASKS 2 non-terminal maintenance tasks whose closed intervals intersect the requested closed interval"
  - id: ERR_TASK_CONFLICTS_WITH_BOOKING
    http: 409
    condition: "the requested maintenance interval strictly overlaps a SCHEDULED or CONFIRMED booking on the same field"

  # --- concurrency ---
  - id: ERR_STALE_FIELD_VERSION
    http: 412
    condition: "expected_field_version does not equal the referenced Field's current version"

  # --- state ---
  - id: ERR_FIELD_RETIRED
    http: 409
    condition: "the referenced Field has been retired"
  - id: ERR_TASK_NOT_TRANSITIONABLE
    http: 409
    condition: "the requested maintenance-task action is not permitted from the task's current status"
  - id: ERR_ASSESSMENT_NOT_RECORDED
    http: 409
    condition: "the assessment is already SUPERSEDED or VOIDED"
  - id: ERR_ORDER_NOT_OPEN
    http: 409
    condition: "the remediation order is not OPEN"
  - id: ERR_ORDER_NOT_AWAITING_DECISION
    http: 409
    condition: "the remediation order is not VERIFICATION_SUBMITTED"
  - id: ERR_BOOKING_NOT_SCHEDULED
    http: 409
    condition: "the booking is not SCHEDULED"
  - id: ERR_BOOKING_NOT_CONFIRMED
    http: 409
    condition: "the booking is not CONFIRMED"
  - id: ERR_PACKET_NOT_SUBMITTABLE
    http: 409
    condition: "the certification packet is neither DRAFT nor RETURNED"
  - id: ERR_PACKET_NOT_SUBMITTED
    http: 409
    condition: "the certification packet is not SUBMITTED"
  - id: ERR_PLAN_NOT_DRAFT
    http: 409
    condition: "the replacement plan's funding_status is not DRAFT"
  - id: ERR_PLAN_NOT_SUBMITTED
    http: 409
    condition: "APPROVE or REJECT was requested while the plan's funding_status is not SUBMITTED"
  - id: ERR_PLAN_NOT_APPROVED
    http: 409
    condition: "RESCIND was requested while the plan's funding_status is not APPROVED, or its disposal is already COMPLETED"
  - id: ERR_DISPOSAL_NOT_PENDING
    http: 409
    condition: "the plan's disposal_status is not PENDING"
  - id: ERR_DISPOSAL_COMPLETION_NOT_PERMITTED
    http: 409
    condition: "the plan's disposal_status is not MANIFESTED, or its funding_status is not APPROVED"
  - id: ERR_FIELD_ALREADY_CLOSED
    http: 409
    condition: "CLOSE_ADMIN was requested on a field whose administrative closure is already active"
  - id: ERR_FIELD_NOT_CLOSED
    http: 409
    condition: "REOPEN_ADMIN was requested on a field with no active administrative closure"
  - id: ERR_BUDGET_LOCKED
    http: 409
    condition: "the referenced CapitalBudget is LOCKED"

  # --- safety posture ---
  - id: ERR_FIELD_NOT_PLAYABLE
    http: 422
    condition: "the field's play_status is CLOSED_ADMIN, CLOSED_UNSAFE or RETIRED"
  - id: ERR_FIELD_RESTRICTED_FOR_ACTIVITY
    http: 422
    condition: "the activity_type is not permitted at the field's current play_status - a RESTRICTED field accepts only PRACTICE and COMMUNITY"
  - id: ERR_UNSAFE_CLOSURE_IN_FORCE
    http: 409
    condition: "an administrative closure order was attempted while the field carries an open MANDATORY remediation order"
  - id: ERR_OPEN_MANDATORY_REMEDIATION
    http: 422
    condition: "certification approval was attempted while the field carries an open MANDATORY remediation order"
  - id: ERR_ASSESSMENT_IN_USE
    http: 409
    condition: "the assessment is the governing assessment of a SUBMITTED or APPROVED certification packet"
  - id: ERR_VERIFICATION_NOT_PASSING
    http: 422
    condition: "ACCEPT was requested while the submitted verification assessment's result is not PASS"

  # --- referential business rules ---
  - id: ERR_GOVERNING_ASSESSMENT_NOT_CURRENT
    http: 422
    condition: "the governing assessment belongs to another field, is not IMPACT_ATTENUATION, is not RECORDED, or has result FAIL"
  - id: ERR_VERIFICATION_ASSESSMENT_INVALID
    http: 422
    condition: "the verification assessment belongs to another field, has a different assessment_type from the source assessment, is not RECORDED, or predates the order's opened_at_utc"
  - id: ERR_FIELD_NOT_CERTIFIED
    http: 422
    condition: "a TOURNAMENT booking was confirmed on a field with a non-NONE sanctioned_level whose certification_status is not CERTIFIED"
  - id: ERR_PREDECESSOR_FIELD_NOT_RETIRED
    http: 422
    condition: "predecessor_field_id references a Field that has not been retired"

  # --- fiscal and scoring thresholds ---
  - id: ERR_CERTIFICATION_DOCUMENTATION_INCOMPLETE
    http: 422
    condition: "documentation_completeness_score is below MIN_CERTIFICATION_COMPLETENESS_SCORE 90.00 at approval"
  - id: ERR_CONDITION_INDEX_BELOW_CERTIFICATION_FLOOR
    http: 422
    condition: "condition_index_certification is below MIN_CERTIFICATION_CONDITION_INDEX 55.00 at approval"
  - id: ERR_PLAN_PRIORITY_BELOW_THRESHOLD
    http: 422
    condition: "replacement_priority_score is below MIN_APPROVAL_PRIORITY_SCORE 20.00 at approval"
  - id: ERR_BUDGET_INSUFFICIENT
    http: 422
    condition: "plan_funding_amount_cents exceeds the budget's available_amount_cents at approval"

# =============================================================================
# 1.7 RBAC Matrix
# =============================================================================
roles:
  - name: FieldOperationsCoordinator
    description: "Allocates fields to activities and closes out what actually happened on them."
    identity: "entity_backed:StaffMember"
    exclusive_operations:
      - "POST /turf/usage-bookings"
      - "POST /turf/usage-bookings/{id}/confirm"
      - "POST /turf/usage-bookings/{id}/close-out"
    shared_operations:
      - "POST /turf/maintenance-tasks (shared with TurfAgronomist)"
      - "POST /turf/maintenance-tasks/{id}/transition (shared with TurfAgronomist)"
      - "every GET endpoint"

  - name: TurfAgronomist
    description: "Runs the agronomic and synthetic maintenance programme and offers remediation work for verification."
    identity: "entity_backed:StaffMember"
    exclusive_operations:
      - "POST /turf/remediation-orders/{id}/submit-verification"
    shared_operations:
      - "POST /turf/maintenance-tasks (shared with FieldOperationsCoordinator)"
      - "POST /turf/maintenance-tasks/{id}/transition (shared with FieldOperationsCoordinator)"
      - "every GET endpoint"

  - name: SafetyInspector
    description: "Performs impact-attenuation, goal-anchoring and striping inspections and rules on remediation verifications. Cannot submit the remediation work it then judges."
    identity: "entity_backed:StaffMember"
    exclusive_operations:
      - "POST /turf/safety-assessments"
      - "POST /turf/safety-assessments/{id}/void"
      - "POST /turf/remediation-orders/{id}/decide-verification"
    shared_operations:
      - "every GET endpoint"

  - name: CertificationOfficer
    description: "Assembles and decides certification packets for sanctioned competition. The deciding officer may be neither the packet's submitter nor the inspector behind the governing assessment."
    identity: "entity_backed:StaffMember"
    exclusive_operations:
      - "POST /turf/certification-packets"
      - "POST /turf/certification-packets/{id}/submit"
      - "POST /turf/certification-packets/{id}/decide"
    shared_operations:
      - "every GET endpoint"

  - name: FacilitiesDirector
    description: "Owns the inventory, the staff roster, administrative closures, capital budgets and replacement planning, plus the test-driving logical clock."
    identity: "entity_backed:StaffMember"
    exclusive_operations:
      - "POST /turf/fields"
      - "POST /turf/fields/{id}/closure-order"
      - "POST /turf/staff-members"
      - "POST /turf/capital-budgets"
      - "POST /turf/replacement-plans"
      - "POST /turf/replacement-plans/{id}/submit"
      - "POST /turf/replacement-plans/{id}/decide"
      - "POST /turf/replacement-plans/{id}/disposal-manifest"
      - "POST /turf/replacement-plans/{id}/complete"
      - "POST /_clock/set_current_utc"
    shared_operations:
      - "every GET endpoint"
    note: "SEGREGATION OF DUTIES: role membership alone never authorises a decision. Because StaffMember.roles is an array, one person may hold both CertificationOfficer and SafetyInspector, or both FacilitiesDirector seats in a submit/decide pair; validation priority 15 compares X-User-ID against the artefact's submitter and against the governing assessment's inspector, so a dual-hatted individual is blocked on the second step even though the role check passes."
