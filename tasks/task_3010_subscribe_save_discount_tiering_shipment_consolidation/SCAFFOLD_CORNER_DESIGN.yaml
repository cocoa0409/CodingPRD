        grounds:
          - state_machines.PlanLine.AUTO_SKIPPED_to_SCHEDULED
          - calculations.lock_evaluation_pipeline
        distinguishing_aspect: "Refresh reconciles derived plan state: a PRICE_CAP auto-skipped line returns to SCHEDULED when a new price event brings the current price back under the cap — and active_line_count/tier/estimated totals track it."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01. Customer, product price 1000 stocked, three subscriptions qty 1 (one with cap 1050); plan generated."
            - "Price event 1200 effective 2026-09-02; clock 2026-09-03; first refresh auto-skips the capped line (count 2, tier 0.00, estimated 2400... recomputed to 2 lines x 1200 = 2400)."
            - "Price event 1000 effective 2026-09-04; clock 2026-09-05."
          setup_api_calls:
            - *k_clock
            - &ko3_cust
              call: "POST /sns/customers"
              payload: { email: "ko3@x.com", full_name: "K Recover", region: "US-WEST", preferred_delivery_day: 10 }
              as: PlatformAdmin
              captures: { ko3_cust: $.data.id }
            - &ko3_prod
              call: "POST /sns/products"
              payload: { sku: "K-O3", name: "Recover Product", region: "US-WEST" }
              as: PlatformAdmin
              captures: { ko3_prod: $.data.id }
            - call: "POST /sns/products/${ko3_prod}/price-events"
              payload: { price_cents: 1000, effective_from: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /sns/inventory-placements"
              payload: { product_id: "${ko3_prod}", region: "US-WEST" }
              as: PlatformAdmin
              captures: { ko3_pl: $.data.id }
            - call: "POST /sns/inventory-placements/${ko3_pl}/receive"
              payload: { units: 50 }
              as: PlatformAdmin
            - call: "POST /sns/subscriptions"
              payload: { customer_id: "${ko3_cust}", product_id: "${ko3_prod}", cadence_months: 1, quantity: 1, start_date: "2026-09-10", price_cap_cents: 1050 }
              as: Customer
              as_user_id: "${ko3_cust}"
              captures: { ko3_sub_capped: $.data.id }
            - call: "POST /sns/subscriptions"
              payload: { customer_id: "${ko3_cust}", product_id: "${ko3_prod}", cadence_months: 1, quantity: 1, start_date: "2026-09-10" }
              as: Customer
              as_user_id: "${ko3_cust}"
            - call: "POST /sns/subscriptions"
              payload: { customer_id: "${ko3_cust}", product_id: "${ko3_prod}", cadence_months: 1, quantity: 1, start_date: "2026-09-10" }
              as: Customer
              as_user_id: "${ko3_cust}"
            - call: "POST /sns/ops/generate-plans"
              payload: { delivery_month: "2026-09" }
              as: PlatformAdmin
              captures: { ko3_plan: "$.data[0].id" }
            - call: "POST /sns/products/${ko3_prod}/price-events"
              payload: { price_cents: 1200, effective_from: "2026-09-02T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /sns/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-03T00:00:00Z" }
              as: PlatformAdmin
            - call: "GET /sns/delivery-plans/${ko3_plan}"
              payload: {}
              as: Customer
              as_user_id: "${ko3_cust}"
              captures: { ko3_v1: $.data.version }
            - call: "POST /sns/delivery-plans/${ko3_plan}/refresh"
              payload: { expected_plan_version: "${ko3_v1}" }
              as: Customer
              as_user_id: "${ko3_cust}"
              captures: { ko3_v2: $.data.version }
            - call: "POST /sns/products/${ko3_prod}/price-events"
              payload: { price_cents: 1000, effective_from: "2026-09-04T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /sns/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-05T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /sns/delivery-plans/${ko3_plan}/refresh"
              payload: { expected_plan_version: "${ko3_v2}" }
              as: Customer
              as_user_id: "${ko3_cust}"
            - call: "GET /sns/plan-lines"
              payload: { subscription_id: "${ko3_sub_capped}" }
              as: Customer
              as_user_id: "${ko3_cust}"
              captures: { ko3_capped_line_status: "$.data[0].line_status" }
          assert:
            - "after the first refresh, DeliveryPlan.${ko3_plan}.active_line_count == 2 and tier_discount_pct == 0.00 and estimated_total_cents == 2400"
            - "ko3_capped_line_status == \"SCHEDULED\" after the second refresh (recovered from AUTO_SKIPPED)"
            - "after the second refresh, active_line_count == 3 and tier_discount_pct == 0.05 and estimated_total_cents == 2850"

      - name: plan_lines_filter_by_product_id_returns_only_matching_lines
        claim_type: pagination_with_filtering
        grounds:
          - endpoints.GET_/sns/plan-lines
        distinguishing_aspect: "The filtered list composes filter + pagination: two subscriptions on different products generate one plan each... on one shared plan? No — one customer, two products, two lines on one plan; filtering by product_id returns exactly the matching line."
