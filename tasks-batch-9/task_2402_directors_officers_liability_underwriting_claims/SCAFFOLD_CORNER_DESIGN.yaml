          - endpoints[POST /dno/quotes/{id}/exclusion-terms]
          - entities.ExclusionTerm.fields.round_count
        distinguishing_aspect: |
          A term added by the insurer starts at PROPOSED with round_count 1 and both proposed_by_role
          and last_actor_role set to the creating side — the latter is what makes the very next counter
          have to come from the other party. agreed_variant stays null until a resolve.
        test_recipe:
          setup:
            - "One ELEVATED Vantiq Bio Inc submission with an OFFERED quote; quote creation already auto-attached the mandatory CONDUCT term."
          setup_api_calls:
            - call: "POST /dno/insureds"
