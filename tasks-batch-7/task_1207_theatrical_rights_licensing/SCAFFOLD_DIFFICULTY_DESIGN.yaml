  # ---------------------------------------------------------------------------
  # Rule 8 — resource_temporal_overlap (different interval semantics)
  # ---------------------------------------------------------------------------
  - rule_id: resource_temporal_overlap
    instances:
      - name: territory_restriction_closed_interval_blocks_touching_window
        grounds:
          - calculations.availability_rule
          - entities.TerritoryRestriction
        distinguishing_aspect: |
          Closed interval semantics: TerritoryRestriction [window_start, window_end] is
          INCLUSIVE on both ends, so a requested window that touches the restriction's
          window_end exactly is still blocked. Resource entity: TerritoryRestriction.
        test_recipe:
          setup:
            - "Title T with a BLACKOUT restriction on US-CA covering [2026-06-01, 2026-06-10] (both inclusive)"
            - "Application requests window [2026-06-10, 2026-06-12] — touches the restriction at 2026-06-10"
          setup_api_calls:
            - call: "POST /licensing/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: RightsAdmin
            - call: "POST /licensing/titles"
              payload: { name: "T", author: "A", title_kind: "PLAY", royalty_basis: "PER_PERFORMANCE", base_flat_fee_cents: 50000, gross_percent_bp: 0, restricted_material: false, perusal_fee_cents: 500, rental_deposit_cents: 20000, late_fee_per_day_cents: 500, restricted_late_fee_per_day_cents: 1500, recording_royalty_flat_cents: 30000 }
              as: RightsAdmin
              captures: { title_id: $.data.id }
            - call: "POST /licensing/titles/${title_id}/restrictions"
              payload: { territory_code: "US-CA", restriction_kind: "BLACKOUT", window_start: "2026-06-01T00:00:00Z", window_end: "2026-06-10T00:00:00Z", blocks_classification: "BOTH" }
              as: RightsAdmin
            - call: "POST /licensing/organizations"
              payload: { legal_name: "O", org_kind: "COMMUNITY", home_territory_code: "US-CA" }
              as: RightsAdmin
              captures: { org_id: $.data.id }
            - call: "POST /licensing/applications"
              payload: { title_id: "${title_id}", organization_id: "${org_id}", requested_territory_code: "US-CA", requested_classification: "AMATEUR", venue_seating_capacity: 100, ticket_top_price_cents: 1000, performers_compensated: false, admission_charged: true, projected_gross_cents: 100000, performance_count: 1, first_performance_date: "2026-06-10T19:00:00Z", last_performance_date: "2026-06-12T19:00:00Z" }
              as: Applicant
              as_user_id: "${org_id}"
              captures: { app_id: $.data.id }
            - call: "POST /licensing/applications/${app_id}/submit"
              payload: {}
              as: Applicant
              as_user_id: "${org_id}"
            - call: "POST /licensing/applications/${app_id}/begin_review"
              payload: {}
              as: LicensingOfficer
          trigger:
            - call: "POST /licensing/applications/${app_id}/approve"
              payload: { expected_application_version: "${app_v}" }
              as: LicensingOfficer
              captures: { err: $.data.error_id }
          assert:
            - "error_id IN {ERR_TITLE_UNAVAILABLE, ERR_TERRITORY_RESTRICTED}"
            - "Closed-interval touch at 2026-06-10 counts as overlap"

      - name: exclusive_run_half_open_interval_allows_adjacent_window
        grounds:
          - calculations.availability_rule
          - entities.LicenseAgreement
        distinguishing_aspect: |
          Half-open interval semantics: competing exclusive-run LicenseAgreement uses
          [window_start, window_end) — a new request starting exactly at the prior
          agreement's window_end does NOT conflict. Resource entity: LicenseAgreement.
          Differs from TerritoryRestriction's closed-interval semantics.
        test_recipe:
          setup:
            - "Existing ACTIVE agreement on title T in US-CA covering [2026-06-01, 2026-06-10) with exclusive run"
            - "New application requests window [2026-06-10, 2026-06-15) — starts exactly at prior window_end"
          setup_api_calls:
            - call: "POST /licensing/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: RightsAdmin
            - call: "POST /licensing/titles"
              payload: { name: "T", author: "A", title_kind: "PLAY", royalty_basis: "PER_PERFORMANCE", base_flat_fee_cents: 50000, gross_percent_bp: 0, restricted_material: false, perusal_fee_cents: 500, rental_deposit_cents: 20000, late_fee_per_day_cents: 500, restricted_late_fee_per_day_cents: 1500, recording_royalty_flat_cents: 30000 }
              as: RightsAdmin
              captures: { title_id: $.data.id }
            - call: "POST /licensing/organizations"
              payload: { legal_name: "O1", org_kind: "COMMUNITY", home_territory_code: "US-CA" }
              as: RightsAdmin
              captures: { org1: $.data.id }
            - call: "POST /licensing/organizations"
              payload: { legal_name: "O2", org_kind: "COMMUNITY", home_territory_code: "US-CA" }
              as: RightsAdmin
              captures: { org2: $.data.id }
            - call: "POST /licensing/applications"
              payload: { title_id: "${title_id}", organization_id: "${org1}", requested_territory_code: "US-CA", requested_classification: "AMATEUR", venue_seating_capacity: 100, ticket_top_price_cents: 1000, performers_compensated: false, admission_charged: true, projected_gross_cents: 100000, performance_count: 1, first_performance_date: "2026-06-01T19:00:00Z", last_performance_date: "2026-06-09T19:00:00Z" }
              as: Applicant
              as_user_id: "${org1}"
              captures: { app1: $.data.id }
            - call: "POST /licensing/applications/${app1}/submit"
              payload: {}
              as: Applicant
              as_user_id: "${org1}"
            - call: "POST /licensing/applications/${app1}/begin_review"
              payload: {}
              as: LicensingOfficer
            - call: "POST /licensing/applications/${app1}/approve"
              payload: { expected_application_version: "${app1_v}" }
              as: LicensingOfficer
              captures: { agr1: $.data.id }
            - call: "POST /licensing/agreements/${agr1}/activate"
              payload: {}
              as: RightsAdmin
            - call: "POST /licensing/applications"
              payload: { title_id: "${title_id}", organization_id: "${org2}", requested_territory_code: "US-CA", requested_classification: "AMATEUR", venue_seating_capacity: 100, ticket_top_price_cents: 1000, performers_compensated: false, admission_charged: true, projected_gross_cents: 100000, performance_count: 1, first_performance_date: "2026-06-10T19:00:00Z", last_performance_date: "2026-06-15T19:00:00Z" }
              as: Applicant
              as_user_id: "${org2}"
              captures: { app2: $.data.id }
            - call: "POST /licensing/applications/${app2}/submit"
              payload: {}
              as: Applicant
              as_user_id: "${org2}"
            - call: "POST /licensing/applications/${app2}/begin_review"
              payload: {}
              as: LicensingOfficer
          trigger:
            - call: "POST /licensing/applications/${app2}/approve"
              payload: { expected_application_version: "${app2_v}" }
              as: LicensingOfficer
              captures: { agr2: $.data.id }
          assert:
            - "Approval succeeds (HTTP 201) — half-open semantics mean prior window ending 2026-06-10 does not block new window starting 2026-06-10"
            - "AvailabilitySnapshot.blocking_agreement_ids is empty"

  # ---------------------------------------------------------------------------
  # Rule 9 — compensating_invariant (different conserved quantities)
  # ---------------------------------------------------------------------------
  - rule_id: compensating_invariant
    instances:
      - name: royalty_balance_conserved_across_grant_approve_and_revoke
        grounds:
          - state_machines.RecordingGrant.REQUESTED_to_APPROVED
          - state_machines.RecordingGrant.APPROVED_to_REVOKED
          - entities.LicenseAgreement.fields.royalty_balance_cents
        distinguishing_aspect: |
          Conserved quantity: LicenseAgreement.royalty_balance_cents. Grant approve adds
          recording_royalty_cents; grant revoke (on agreement cancel) subtracts the same
          amount — net zero drift.
        test_recipe:
          setup:
            - "Agreement ACTIVE with royalty_balance_cents = Q; recording grant approved adds R cents"
          setup_api_calls:
            - call: "POST /licensing/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: RightsAdmin
            - call: "POST /licensing/titles"
              payload: { name: "T", author: "A", title_kind: "PLAY", royalty_basis: "PER_PERFORMANCE", base_flat_fee_cents: 50000, gross_percent_bp: 0, restricted_material: false, perusal_fee_cents: 500, rental_deposit_cents: 20000, late_fee_per_day_cents: 500, restricted_late_fee_per_day_cents: 1500, recording_royalty_flat_cents: 30000 }
              as: RightsAdmin
              captures: { title_id: $.data.id }
            - call: "POST /licensing/organizations"
              payload: { legal_name: "O", org_kind: "COMMUNITY", home_territory_code: "US-CA" }
              as: RightsAdmin
              captures: { org_id: $.data.id }
            - call: "POST /licensing/applications"
              payload: { title_id: "${title_id}", organization_id: "${org_id}", requested_territory_code: "US-CA", requested_classification: "AMATEUR", venue_seating_capacity: 100, ticket_top_price_cents: 1000, performers_compensated: false, admission_charged: true, projected_gross_cents: 100000, performance_count: 1, first_performance_date: "2026-06-01T19:00:00Z", last_performance_date: "2026-06-01T19:00:00Z" }
              as: Applicant
              as_user_id: "${org_id}"
              captures: { app_id: $.data.id }
            - call: "POST /licensing/applications/${app_id}/submit"
              payload: {}
              as: Applicant
              as_user_id: "${org_id}"
            - call: "POST /licensing/applications/${app_id}/begin_review"
              payload: {}
              as: LicensingOfficer
            - call: "POST /licensing/applications/${app_id}/approve"
              payload: { expected_application_version: "${app_v}" }
              as: LicensingOfficer
              captures: { agreement_id: $.data.id, q_balance: $.data.royalty_balance_cents }
            - call: "POST /licensing/agreements/${agreement_id}/activate"
              payload: {}
              as: RightsAdmin
            - call: "POST /licensing/recording-grants"
              payload: { agreement_id: "${agreement_id}", grant_kind: "CAST_RECORDING_AUDIO", distribution_scope: "CAST_CREW_ONLY" }
              as: Applicant
              as_user_id: "${org_id}"
              captures: { grant_id: $.data.id }
            - call: "POST /licensing/recording-grants/${grant_id}/approve"
              payload: {}
              as: RightsAdmin
              captures: { grant_royalty: $.data.recording_royalty_cents }
          trigger:
            - call: "POST /licensing/agreements/${agreement_id}/cancel"
              payload: { reason: "Cancel" }
              as: RightsAdmin
          assert:
            - "After approve: royalty_balance_cents == q_balance + grant_royalty"
            - "After cancel (grant auto-revoked): royalty_balance_cents == q_balance (grant_royalty reversed)"
            - "Net drift across approve+revoke == 0"

      - name: deposit_conserved_across_rental_hold_and_return
        grounds:
          - state_machines.MaterialRental
          - calculations.deposit_settlement_rule
          - entities.MaterialRental.fields.deposit_cents
          - entities.MaterialRental.fields.deposit_status
        distinguishing_aspect: |
          Conserved quantity: rental deposit total (deposit_cents == refund + deductions).
          Distinct from royalty balance — different conserved quantity (deposit_cents pool
          vs royalty_balance_cents).
        test_recipe:
          setup:
            - "Rental created with deposit_cents=20000 HELD; no damage, no late fee"
          setup_api_calls:
            - call: "POST /licensing/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: RightsAdmin
            - call: "POST /licensing/titles"
              payload: { name: "T", author: "A", title_kind: "PLAY", royalty_basis: "PER_PERFORMANCE", base_flat_fee_cents: 50000, gross_percent_bp: 0, restricted_material: false, perusal_fee_cents: 500, rental_deposit_cents: 20000, late_fee_per_day_cents: 500, restricted_late_fee_per_day_cents: 1500, recording_royalty_flat_cents: 30000 }
              as: RightsAdmin
              captures: { title_id: $.data.id }
            - call: "POST /licensing/organizations"
              payload: { legal_name: "O", org_kind: "COMMUNITY", home_territory_code: "US-CA" }
              as: RightsAdmin
              captures: { org_id: $.data.id }
            - call: "POST /licensing/applications"
              payload: { title_id: "${title_id}", organization_id: "${org_id}", requested_territory_code: "US-CA", requested_classification: "AMATEUR", venue_seating_capacity: 100, ticket_top_price_cents: 1000, performers_compensated: false, admission_charged: true, projected_gross_cents: 100000, performance_count: 1, first_performance_date: "2026-05-15T19:00:00Z", last_performance_date: "2026-05-15T19:00:00Z" }
              as: Applicant
              as_user_id: "${org_id}"
              captures: { app_id: $.data.id }
            - call: "POST /licensing/applications/${app_id}/submit"
              payload: {}
              as: Applicant
              as_user_id: "${org_id}"
            - call: "POST /licensing/applications/${app_id}/begin_review"
              payload: {}
              as: LicensingOfficer
            - call: "POST /licensing/applications/${app_id}/approve"
              payload: { expected_application_version: "${app_v}" }
              as: LicensingOfficer
              captures: { agreement_id: $.data.id }
            - call: "POST /licensing/agreements/${agreement_id}/activate"
              payload: {}
              as: RightsAdmin
            - call: "POST /licensing/rentals"
              payload: { agreement_id: "${agreement_id}", scripts_qty: 5, scores_qty: 0, due_date: "2026-06-10T00:00:00Z" }
              as: MaterialsClerk
              captures: { rental_id: $.data.id }
            - call: "POST /licensing/rentals/${rental_id}/ship"
              payload: {}
              as: MaterialsClerk
            - call: "POST /licensing/rentals/${rental_id}/mark_received"
              payload: {}
              as: Applicant
              as_user_id: "${org_id}"
            - call: "POST /licensing/rentals/${rental_id}/ship_return"
              payload: {}
              as: Applicant
              as_user_id: "${org_id}"
          trigger:
            - call: "POST /licensing/rentals/${rental_id}/receive_return"
              payload: {}
              as: MaterialsClerk
          assert:
            - "deposit_status == RETURNED"
            - "Invariant: refund_cents + total_deduction_cents == deposit_cents (20000 + 0 == 20000)"
            - "accrued_late_fee_cents == 0"
