              payload: { name: "SEQ-4", chip_version: "V5", status: "ONLINE" }
              as: PlatformAdmin
              captures: { inst: $.data.id }
            - call: "POST /dna/lab-batches"
              payload: { instrument_id: "${inst}", run_start_at: "2026-05-01T02:00:00Z", run_end_at: "2026-05-01T06:00:00Z", sample_ids: ["${sF}"] }
              as: LabTechnician
