        excluded_because:
          difficulty_instance: compensating_invariant / reviewer_open_invitation_count_conserved_by_withdraw
          rationale: "That §1.8 instance already drives the withdraw path and asserts open_invitation_count returns to its pre-invitation value while invited_count is not decremented."

      - name: decision_guarded_by_open_high_severity_ethics_case
        claim_type: guarded_transitions
        grounds:
          - state_machines.Manuscript.DECISION_PENDING_to_IN_PRODUCTION
