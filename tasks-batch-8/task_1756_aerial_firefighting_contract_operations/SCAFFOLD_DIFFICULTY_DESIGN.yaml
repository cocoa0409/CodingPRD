            - "A1 (08:00-10:00) created; A2 (10:00-12:00) on the SAME aircraft created successfully — half-open adjacency is not an overlap"
            - "order1 reaches FILLED with filled_count == 2 after A2"
            - "A3 (09:00-11:00) on the same aircraft is rejected with ERR_ASSIGNMENT_OVERLAP (true intersection with both A1 and A2)"

      - name: pilot_window_minimum_rest_gap
        grounds:
          - validations[priority=10]
          - errors[ERR_DUTY_REST_VIOLATION]
        distinguishing_aspect: |
          Resource = CrewMember (different resource than Aircraft), interval semantics =
          minimum 60-minute gap buffer (different semantics than half-open adjacency):
          a 30-minute gap between windows is rejected with ERR_DUTY_REST_VIOLATION even
          though the windows do not intersect and would be perfectly legal for an
          aircraft; a gap of exactly 60 minutes is allowed (>= boundary inclusive).
        test_recipe:
          setup:
            - "EU contract ACTIVE; aircraft X and Y carded; pilot P1 carded"
            - "order1 ACCEPTED with A1: X, P1, 2026-08-05 08:00-10:00; order2 ACCEPTED (qty 1)"
          setup_api_calls:
            - { call: "POST /contracts", payload: { contract_number: "EU-2026-001", agency: "USFS", contract_type: "EXCLUSIVE_USE", daily_availability_rate_cents: 500000, flight_hour_rate_cents: 300000, season_start_date: "2026-06-01", season_end_date: "2026-09-30", min_daily_available_minutes: 570, season_flight_hour_cap_tenths: 20000, acceptance_window_minutes: 30 }, as: CarrierOps, captures: { c_id: $.data.id } }
            - { call: "POST /contracts/${c_id}/activate", payload: {}, as: CarrierOps }
