          - errors[ERR_INVALID_STATE_TRANSITION]
        distinguishing_aspect: |
          The gated entity pair is ManualRevision -> ProductModel and the gate is the parent's
          terminal support_state: an IN_REVIEW revision with zero coverage gap and a distinct
          reviewer is still refused approval because the model reached SUPPORT_ENDED while the
          revision sat in review.
        test_recipe:
          setup:
            - "Region profile US-CA exists; ProductModel CRX-9400 is TIER_B_GUIDED, market_release_date 2020-01-01, and has no ComplianceObligation rows."
            - "No part is PUBLISHED for the model, so the revision's coverage_gap_sku_count is 0."
            - "A DISASSEMBLY_GUIDE revision authored by u_doc_1 is IN_REVIEW."
            - "The model is then walked ACTIVE_PRODUCTION -> LEGACY_SUPPORT -> SUPPORT_ENDED."
          setup_api_calls:
            - call: "POST /repair-program/compliance-profiles"
              payload: { region_code: "US-CA", min_parts_availability_years: 7, min_documentation_years: 7, requires_public_manual: false, max_documentation_fee_cents: 2000, allows_pairing_restriction: true, self_service_mandate_tier: "MANDATE_FULL" }
