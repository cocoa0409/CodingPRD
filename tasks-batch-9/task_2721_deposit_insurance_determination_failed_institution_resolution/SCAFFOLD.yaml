    check: "POST /institutions/{id}/terminate-receivership requires status == RESOLUTION_COMPLETE, no DECLARED dividend round, and no DepositAccount at hold_status == HELD"
    error_id: ERR_RECEIVERSHIP_NOT_TERMINABLE
