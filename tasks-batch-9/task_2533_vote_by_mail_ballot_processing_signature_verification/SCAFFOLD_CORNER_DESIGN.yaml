        distinguishing_aspect: "The dispatch response already carries actual_postage_cents 141 and status DISPATCHED, and reads issued immediately afterwards — with no intervening clock move or sweep — show the packet MAILED, the request MAILED, the election at MAILING and both transparency entries present; nothing lags."
