    output: Method
    side_effects: ["validation_status initialised to DRAFT; no ExaminationRequest may name the method until it is VALIDATED"]
  - method: POST
    path: "/lab/methods/{method_id}/validate"
    description: "Record a completed method-validation study, moving the method from DRAFT to VALIDATED"
    roles: [QualityManager]
    code: 200
    input: [validation_study_item_count, precision_cv_pct, expires_at_utc]
    output: Method
    side_effects: ["validation_status DRAFT -> VALIDATED", "validated_at_utc stamped and validation_expires_at_utc set from expires_at_utc", "requires validation_study_item_count >= MIN_VALIDATION_STUDY_ITEMS and precision_cv_pct <= MAX_VALIDATION_CV_PCT", "increments Method.version by 1"]
  - method: POST
    path: "/lab/methods/{method_id}/retire"
    description: "Withdraw a VALIDATED method from accreditation scope; queued work on the method is cancelled"
    roles: [QualityManager]
    code: 200
    input: [retirement_reason]
    output: Method
    side_effects: ["validation_status VALIDATED -> RETIRED (terminal), retired_at_utc stamped", "cascade: every ExaminationRequest naming this method with status QUEUED -> CANCELLED, then CASE_RECOMPUTE on each affected case", "requests already past QUEUED are untouched and may finish"]

  # ---------------------------------------------------------------- vendors
  - method: POST
    path: "/lab/vendors"
    description: "Register a vendor laboratory with its accreditation scope, concurrent custody capacity and contract pricing"
    roles: [LabDirector]
    code: 201
