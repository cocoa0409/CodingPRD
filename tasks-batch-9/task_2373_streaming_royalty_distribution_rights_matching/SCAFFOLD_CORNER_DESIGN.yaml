          supersede_overlapping only clears incumbents sharing the SAME (work_id, right_type,
          claimant_id) triple. So the label's own re-filing at 10000 bps is approvable with the flag,
          but a rival distributor setting the identical flag cannot clear the label's row and is
          refused with ERR_SHARE_OVERSUBSCRIBED — the flag is a self-correction tool, not a
          land-grab, and the Work's approved_master_share_bps never exceeds 10000.
        test_recipe:
          setup:
