          trigger:
            - { call: "POST /supply-budgets", payload: { fiscal_year: 2026, total_budget_cents: 60000 }, as: SystemAdmin, captures: { err: $.data.error_id } }
            - { call: "POST /supply-budgets", payload: { fiscal_year: 2027, total_budget_cents: 60000 }, as: SystemAdmin, captures: { b2: $.data.id, b2_av: $.data.available_cents } }
          assert:
            - "err == ERR_DUPLICATE_BUDGET_YEAR (http 409)"
            - "b2 exists and b2_av == 60000 (available initialized to total)"

      - name: rtp_advance_with_symptoms_rejected
        claim_type: violation_to_error
        grounds:
