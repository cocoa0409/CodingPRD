# =============================================================================
# §1.9 Scaffold Corner Design (breadth probe)
# Walks references/claim-extraction-guide.md against SCAFFOLD §1.1–§1.7.
# Every test_recipe conforms to §1.5 (same gates as §1.8). excluded_because
# stubs cite a §1.8 instance by name.
# Fixture vocabulary identical to SCAFFOLD_DIFFICULTY_DESIGN.yaml.
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:
      - name: create_bureau_returns_201_with_defaults
        claim_type: Creation
        grounds: [entities.Bureau, endpoints]
        distinguishing_aspect: "POST /bureaus with name only -> 201; cooldown_buffer_min defaults 15, shift_capacity_minutes defaults 480, version==1, clock_utc set to epoch."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - { call: "POST /bureaus", payload: { name: "B Defaults" }, as: BureauAdmin, captures: { b: $.data.id, cb: $.data.cooldown_buffer_min, sc: $.data.shift_capacity_minutes, v: $.data.version } }
          assert:
            - "Response status 201"
            - "Bureau.cooldown_buffer_min == 15"
            - "Bureau.shift_capacity_minutes == 480"
            - "Bureau.version == 1"

      - name: customer_missing_required_email_returns_invalid_request
        claim_type: Required Fields
        grounds: [entities.Customer.fields.email, "validations[priority=5]", "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "POST /bureaus/customers without email -> 422 ERR_INVALID_REQUEST (email is source:input, no default)."
        test_recipe:
          setup: ["Bureau exists."]
          setup_api_calls:
            - { call: "POST /bureaus", payload: { name: "B E" }, as: BureauAdmin, captures: { b: $.data.id } }
          trigger:
            - { call: "POST /bureaus/customers", payload: { bureau_id: "${b}", display_name: "NoEmail" }, as: BureauAdmin, captures: { err: $.data.error_id } }
          assert:
            - "Response status 422 and data.error_id == ERR_INVALID_REQUEST"

      - name: order_line_quantity_zero_returns_invalid_request
        claim_type: Type Constraints
        grounds: [entities.OrderLine.fields.quantity, "validations[priority=5]", "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "POST /bureaus/order-lines with quantity 0 -> 422 ERR_INVALID_REQUEST (quantity must be >= 1)."
        test_recipe:
          setup: ["Bureau, Customer, Material, File B, DRAFT order."]
          setup_api_calls:
            - { call: "POST /bureaus", payload: { name: "B Q0" }, as: BureauAdmin, captures: { b: $.data.id } }
            - { call: "POST /bureaus/customers", payload: { bureau_id: "${b}", email: "q0@x.com", display_name: "Q0" }, as: BureauAdmin, captures: { cust: $.data.id } }
            - { call: "POST /bureaus/materials", payload: { bureau_id: "${b}", process: "SLA", name: "Tough Resin", density_g_per_cm3: 1.10, material_rate_cents_per_cm3: 35, machine_rate_cents_per_min: 12, setup_fee_cents: 2500, min_wall_thickness_mm: 0.80, max_overhang_deg: 45 }, as: BureauAdmin, captures: { mat: $.data.id } }
            - { call: "POST /bureaus/print-files", payload: { bureau_id: "${b}", customer_id: "${cust}", filename: "B.stl", volume_cm3: 4.00, bbox_x_mm: 20, bbox_y_mm: 20, bbox_z_mm: 20, min_wall_mm: 1.0, max_overhang_deg: 40, is_manifold: true }, as: Customer, as_user_id: "${cust}", captures: { fileB: $.data.id } }
            - { call: "POST /bureaus/orders", payload: { bureau_id: "${b}", customer_id: "${cust}" }, as: Customer, as_user_id: "${cust}", captures: { ord: $.data.id } }
          trigger:
            - { call: "POST /bureaus/order-lines", payload: { order_id: "${ord}", print_file_id: "${fileB}", material_id: "${mat}", layer_height_mm: 0.10, quantity: 0 }, as: Customer, as_user_id: "${cust}", captures: { err: $.data.error_id } }
          assert:
            - "Response status 422 and data.error_id == ERR_INVALID_REQUEST"

      - name: get_customer_nonexistent_returns_not_found
        claim_type: Not Found
        grounds: [entities.Customer, "validations[priority=3]", "errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "GET /bureaus/customers/{nonexistent-uuid} -> 404 ERR_NOT_FOUND."
        test_recipe:
          setup: ["Bureau exists."]
          setup_api_calls:
            - { call: "POST /bureaus", payload: { name: "B NF" }, as: BureauAdmin, captures: { b: $.data.id } }
          trigger:
            - { call: "GET /bureaus/customers/00000000-0000-4000-8000-000000000000", payload: {}, as: BureauAdmin, captures: { err: $.data.error_id } }
          assert:
            - "Response status 404 and data.error_id == ERR_NOT_FOUND"

      - name: create_order_line_unknown_print_file_returns_reference_not_found
        claim_type: Parent Relationships
        grounds: [entities.OrderLine.fields.print_file_id, "validations[priority=4]", "errors[ERR_REFERENCE_NOT_FOUND]"]
        distinguishing_aspect: "POST /bureaus/order-lines with a print_file_id that does not exist -> 404 ERR_REFERENCE_NOT_FOUND (body FK)."
        test_recipe:
          setup: ["Bureau, Customer, Material, DRAFT order; print_file_id is bogus."]
          setup_api_calls:
            - { call: "POST /bureaus", payload: { name: "B RNF" }, as: BureauAdmin, captures: { b: $.data.id } }
            - { call: "POST /bureaus/customers", payload: { bureau_id: "${b}", email: "rnf@x.com", display_name: "RNF" }, as: BureauAdmin, captures: { cust: $.data.id } }
            - { call: "POST /bureaus/materials", payload: { bureau_id: "${b}", process: "SLA", name: "Tough Resin", density_g_per_cm3: 1.10, material_rate_cents_per_cm3: 35, machine_rate_cents_per_min: 12, setup_fee_cents: 2500, min_wall_thickness_mm: 0.80, max_overhang_deg: 45 }, as: BureauAdmin, captures: { mat: $.data.id } }
            - { call: "POST /bureaus/orders", payload: { bureau_id: "${b}", customer_id: "${cust}" }, as: Customer, as_user_id: "${cust}", captures: { ord: $.data.id } }
          trigger:
            - { call: "POST /bureaus/order-lines", payload: { order_id: "${ord}", print_file_id: "11111111-1111-4111-8111-111111111111", material_id: "${mat}", layer_height_mm: 0.10, quantity: 1 }, as: Customer, as_user_id: "${cust}", captures: { err: $.data.error_id } }
          assert:
            - "Response status 404 and data.error_id == ERR_REFERENCE_NOT_FOUND"

      - name: order_system_fields_ignored_on_create
        claim_type: System Fields
        grounds: [entities.Order.fields.fulfillment_status, entities.Order.fields.payment_status]
        distinguishing_aspect: "POST /bureaus/orders ignores client-supplied status; server forces fulfillment_status=DRAFT, payment_status=UNPAID, totals 0, version 1."
        test_recipe:
          setup: ["Bureau, Customer."]
          setup_api_calls:
            - { call: "POST /bureaus", payload: { name: "B SYS" }, as: BureauAdmin, captures: { b: $.data.id } }
            - { call: "POST /bureaus/customers", payload: { bureau_id: "${b}", email: "sys@x.com", display_name: "SYS" }, as: BureauAdmin, captures: { cust: $.data.id } }
          trigger:
            - { call: "POST /bureaus/orders", payload: { bureau_id: "${b}", customer_id: "${cust}", lead_tier: "STANDARD" }, as: Customer, as_user_id: "${cust}", captures: { fs: $.data.fulfillment_status, ps: $.data.payment_status, gt: $.data.grand_total_cents, v: $.data.version } }
          assert:
            - "Order.fulfillment_status == DRAFT"
            - "Order.payment_status == UNPAID"
            - "Order.grand_total_cents == 0"
            - "Order.version == 1"

      - name: spool_computed_grams_remaining_on_create
        claim_type: Computed Fields
        grounds: [entities.Spool.fields.grams_remaining, calculations.spool_conservation]
        distinguishing_aspect: "POST /bureaus/spools with grams_total 250 -> grams_remaining computed 250, grams_committed 0, grams_consumed 0, status LOADED."
        test_recipe:
          setup: ["Bureau, Material."]
          setup_api_calls:
            - { call: "POST /bureaus", payload: { name: "B SP" }, as: BureauAdmin, captures: { b: $.data.id } }
            - { call: "POST /bureaus/materials", payload: { bureau_id: "${b}", process: "SLA", name: "Tough Resin", density_g_per_cm3: 1.10, material_rate_cents_per_cm3: 35, machine_rate_cents_per_min: 12, setup_fee_cents: 2500, min_wall_thickness_mm: 0.80, max_overhang_deg: 45 }, as: BureauAdmin, captures: { mat: $.data.id } }
          trigger:
            - { call: "POST /bureaus/spools", payload: { bureau_id: "${b}", material_id: "${mat}", grams_total: 250 }, as: BureauAdmin, captures: { rem: $.data.grams_remaining, comm: $.data.grams_committed, st: $.data.status } }
          assert:
            - "Spool.grams_remaining == 250"
            - "Spool.grams_committed == 0 and Spool.grams_consumed == 0"
            - "Spool.status == LOADED"

  # ===========================================================================
  - section: state_machines
    instances:
      - name: confirm_already_confirmed_returns_invalid_state
        claim_type: Invalid Transitions
        grounds: [state_machines.Order.QUOTED_to_CONFIRMED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Confirming an Order already CONFIRMED (not QUOTED) -> 409 ERR_INVALID_STATE; no double escrow."
        test_recipe:
          setup: ["Funded customer; order line B confirmed (CONFIRMED/ESCROWED)."]
          setup_api_calls:
            - { call: "POST /bureaus", payload: { name: "B IS" }, as: BureauAdmin, captures: { b: $.data.id } }
            - { call: "POST /bureaus/customers", payload: { bureau_id: "${b}", email: "is@x.com", display_name: "IS" }, as: BureauAdmin, captures: { cust: $.data.id } }
            - { call: "POST /bureaus/customers/${cust}/deposit", payload: { amount_cents: 5000000 }, as: BureauAdmin }
            - { call: "POST /bureaus/materials", payload: { bureau_id: "${b}", process: "SLA", name: "Tough Resin", density_g_per_cm3: 1.10, material_rate_cents_per_cm3: 35, machine_rate_cents_per_min: 12, setup_fee_cents: 2500, min_wall_thickness_mm: 0.80, max_overhang_deg: 45 }, as: BureauAdmin, captures: { mat: $.data.id } }
            - { call: "POST /bureaus/print-files", payload: { bureau_id: "${b}", customer_id: "${cust}", filename: "B.stl", volume_cm3: 4.00, bbox_x_mm: 20, bbox_y_mm: 20, bbox_z_mm: 20, min_wall_mm: 1.0, max_overhang_deg: 40, is_manifold: true }, as: Customer, as_user_id: "${cust}", captures: { fileB: $.data.id } }
            - { call: "POST /bureaus/machines", payload: { bureau_id: "${b}", process: "SLA", label: "Form-A", build_x_mm: 145, build_y_mm: 145, build_z_mm: 185 }, as: BureauAdmin }
            - { call: "POST /bureaus/print-files/${fileB}/check", payload: { material_id: "${mat}" }, as: QAReviewer }
            - { call: "POST /bureaus/orders", payload: { bureau_id: "${b}", customer_id: "${cust}" }, as: Customer, as_user_id: "${cust}", captures: { ord: $.data.id } }
            - { call: "POST /bureaus/order-lines", payload: { order_id: "${ord}", print_file_id: "${fileB}", material_id: "${mat}", layer_height_mm: 0.10, quantity: 1 }, as: Customer, as_user_id: "${cust}", captures: { lineB: $.data.id } }
            - { call: "POST /bureaus/orders/${ord}/quote", payload: {}, as: Customer, as_user_id: "${cust}", captures: { ov: $.data.version } }
            - { call: "POST /bureaus/orders/${ord}/confirm", payload: { expected_order_version: "${ov}" }, as: Customer, as_user_id: "${cust}", captures: { ov2: $.data.version } }
          trigger:
            - { call: "POST /bureaus/orders/${ord}/confirm", payload: { expected_order_version: "${ov2}" }, as: Customer, as_user_id: "${cust}", captures: { err: $.data.error_id } }
          assert:
            - "Response status 409 and data.error_id == ERR_INVALID_STATE"

      - name: ship_before_ready_returns_order_not_ready
        claim_type: Precondition Enforcement
        grounds: [state_machines.Order.READY_to_SHIPPED, "errors[ERR_ORDER_NOT_READY]"]
        distinguishing_aspect: "Ship on a CONFIRMED (not READY) order -> 409 ERR_ORDER_NOT_READY."
        test_recipe:
          setup: ["Funded customer; order line B confirmed (CONFIRMED), no runs done; a Shipment CREATED."]
          setup_api_calls:
            - { call: "POST /bureaus", payload: { name: "B NR" }, as: BureauAdmin, captures: { b: $.data.id } }
            - { call: "POST /bureaus/customers", payload: { bureau_id: "${b}", email: "nr@x.com", display_name: "NR" }, as: BureauAdmin, captures: { cust: $.data.id } }
            - { call: "POST /bureaus/customers/${cust}/deposit", payload: { amount_cents: 5000000 }, as: BureauAdmin }
            - { call: "POST /bureaus/materials", payload: { bureau_id: "${b}", process: "SLA", name: "Tough Resin", density_g_per_cm3: 1.10, material_rate_cents_per_cm3: 35, machine_rate_cents_per_min: 12, setup_fee_cents: 2500, min_wall_thickness_mm: 0.80, max_overhang_deg: 45 }, as: BureauAdmin, captures: { mat: $.data.id } }
            - { call: "POST /bureaus/print-files", payload: { bureau_id: "${b}", customer_id: "${cust}", filename: "B.stl", volume_cm3: 4.00, bbox_x_mm: 20, bbox_y_mm: 20, bbox_z_mm: 20, min_wall_mm: 1.0, max_overhang_deg: 40, is_manifold: true }, as: Customer, as_user_id: "${cust}", captures: { fileB: $.data.id } }
            - { call: "POST /bureaus/machines", payload: { bureau_id: "${b}", process: "SLA", label: "Form-A", build_x_mm: 145, build_y_mm: 145, build_z_mm: 185 }, as: BureauAdmin }
            - { call: "POST /bureaus/print-files/${fileB}/check", payload: { material_id: "${mat}" }, as: QAReviewer }
            - { call: "POST /bureaus/orders", payload: { bureau_id: "${b}", customer_id: "${cust}" }, as: Customer, as_user_id: "${cust}", captures: { ord: $.data.id } }
            - { call: "POST /bureaus/order-lines", payload: { order_id: "${ord}", print_file_id: "${fileB}", material_id: "${mat}", layer_height_mm: 0.10, quantity: 1 }, as: Customer, as_user_id: "${cust}", captures: { lineB: $.data.id } }
            - { call: "POST /bureaus/orders/${ord}/quote", payload: {}, as: Customer, as_user_id: "${cust}", captures: { ov: $.data.version } }
            - { call: "POST /bureaus/orders/${ord}/confirm", payload: { expected_order_version: "${ov}" }, as: Customer, as_user_id: "${cust}", captures: { ov2: $.data.version } }
            - { call: "POST /bureaus/shipments", payload: { order_id: "${ord}", carrier: "UPS", tracking_number: "1Z0" }, as: Operator }
          trigger:
            - { call: "POST /bureaus/orders/${ord}/ship", payload: { expected_order_version: "${ov2}" }, as: Operator, captures: { err: $.data.error_id } }
          assert:
            - "Response status 409 and data.error_id == ERR_ORDER_NOT_READY"

      - name: ship_ready_without_shipment_returns_no_shipment
        claim_type: Precondition Enforcement
        grounds: [state_machines.Order.READY_to_SHIPPED, "errors[ERR_NO_SHIPMENT]"]
        distinguishing_aspect: "Ship a READY order with no CREATED Shipment -> 409 ERR_NO_SHIPMENT."
        test_recipe:
          setup: ["Funded customer; order line B confirmed, run started+completed (-> READY); NO shipment created."]
          setup_api_calls:
            - { call: "POST /bureaus", payload: { name: "B NS" }, as: BureauAdmin, captures: { b: $.data.id } }
            - { call: "POST /bureaus/customers", payload: { bureau_id: "${b}", email: "ns@x.com", display_name: "NS" }, as: BureauAdmin, captures: { cust: $.data.id } }
            - { call: "POST /bureaus/customers/${cust}/deposit", payload: { amount_cents: 5000000 }, as: BureauAdmin }
            - { call: "POST /bureaus/materials", payload: { bureau_id: "${b}", process: "SLA", name: "Tough Resin", density_g_per_cm3: 1.10, material_rate_cents_per_cm3: 35, machine_rate_cents_per_min: 12, setup_fee_cents: 2500, min_wall_thickness_mm: 0.80, max_overhang_deg: 45 }, as: BureauAdmin, captures: { mat: $.data.id } }
            - { call: "POST /bureaus/machines", payload: { bureau_id: "${b}", process: "SLA", label: "Form-A", build_x_mm: 145, build_y_mm: 145, build_z_mm: 185 }, as: BureauAdmin, captures: { mach: $.data.id } }
            - { call: "POST /bureaus/spools", payload: { bureau_id: "${b}", material_id: "${mat}", grams_total: 1000 }, as: BureauAdmin, captures: { spool: $.data.id } }
            - { call: "POST /bureaus/print-files", payload: { bureau_id: "${b}", customer_id: "${cust}", filename: "B.stl", volume_cm3: 4.00, bbox_x_mm: 20, bbox_y_mm: 20, bbox_z_mm: 20, min_wall_mm: 1.0, max_overhang_deg: 40, is_manifold: true }, as: Customer, as_user_id: "${cust}", captures: { fileB: $.data.id } }
            - { call: "POST /bureaus/print-files/${fileB}/check", payload: { material_id: "${mat}" }, as: QAReviewer }
            - { call: "POST /bureaus/orders", payload: { bureau_id: "${b}", customer_id: "${cust}" }, as: Customer, as_user_id: "${cust}", captures: { ord: $.data.id } }
            - { call: "POST /bureaus/order-lines", payload: { order_id: "${ord}", print_file_id: "${fileB}", material_id: "${mat}", layer_height_mm: 0.10, quantity: 1 }, as: Customer, as_user_id: "${cust}", captures: { lineB: $.data.id } }
            - { call: "POST /bureaus/orders/${ord}/quote", payload: {}, as: Customer, as_user_id: "${cust}", captures: { ov: $.data.version } }
            - { call: "POST /bureaus/orders/${ord}/confirm", payload: { expected_order_version: "${ov}" }, as: Customer, as_user_id: "${cust}" }
            - { call: "POST /bureaus/print-runs", payload: { order_line_id: "${lineB}", machine_id: "${mach}", spool_id: "${spool}", start_min: 0, duration_min: 24 }, as: Operator, captures: { run1: $.data.id } }
            - { call: "POST /bureaus/print-runs/${run1}/start", payload: {}, as: Operator }
            - { call: "POST /bureaus/print-runs/${run1}/complete", payload: {}, as: Operator }
            - { call: "GET /bureaus/orders/${ord}", payload: {}, as: Operator, captures: { ov3: $.data.version } }
          trigger:
            - { call: "POST /bureaus/orders/${ord}/ship", payload: { expected_order_version: "${ov3}" }, as: Operator, captures: { err: $.data.error_id } }
          assert:
            - "Response status 409 and data.error_id == ERR_NO_SHIPMENT"

      - name: cancel_confirmed_after_production_started_returns_production_started
        claim_type: guarded transitions
        grounds: [state_machines.Order.CONFIRMED_to_CANCELLED, "errors[ERR_PRODUCTION_STARTED]"]
        distinguishing_aspect: "Cancel a CONFIRMED order whose run is PRINTING -> 409 ERR_PRODUCTION_STARTED (guarded by child run state)."
        test_recipe:
          setup: ["Funded customer; confirmed order line B; run started (PRINTING)."]
          setup_api_calls:
            - { call: "POST /bureaus", payload: { name: "B PS" }, as: BureauAdmin, captures: { b: $.data.id } }
            - { call: "POST /bureaus/customers", payload: { bureau_id: "${b}", email: "ps@x.com", display_name: "PS" }, as: BureauAdmin, captures: { cust: $.data.id } }
            - { call: "POST /bureaus/customers/${cust}/deposit", payload: { amount_cents: 5000000 }, as: BureauAdmin }
            - { call: "POST /bureaus/materials", payload: { bureau_id: "${b}", process: "SLA", name: "Tough Resin", density_g_per_cm3: 1.10, material_rate_cents_per_cm3: 35, machine_rate_cents_per_min: 12, setup_fee_cents: 2500, min_wall_thickness_mm: 0.80, max_overhang_deg: 45 }, as: BureauAdmin, captures: { mat: $.data.id } }
            - { call: "POST /bureaus/machines", payload: { bureau_id: "${b}", process: "SLA", label: "Form-A", build_x_mm: 145, build_y_mm: 145, build_z_mm: 185 }, as: BureauAdmin, captures: { mach: $.data.id } }
            - { call: "POST /bureaus/spools", payload: { bureau_id: "${b}", material_id: "${mat}", grams_total: 1000 }, as: BureauAdmin, captures: { spool: $.data.id } }
            - { call: "POST /bureaus/print-files", payload: { bureau_id: "${b}", customer_id: "${cust}", filename: "B.stl", volume_cm3: 4.00, bbox_x_mm: 20, bbox_y_mm: 20, bbox_z_mm: 20, min_wall_mm: 1.0, max_overhang_deg: 40, is_manifold: true }, as: Customer, as_user_id: "${cust}", captures: { fileB: $.data.id } }
            - { call: "POST /bureaus/print-files/${fileB}/check", payload: { material_id: "${mat}" }, as: QAReviewer }
            - { call: "POST /bureaus/orders", payload: { bureau_id: "${b}", customer_id: "${cust}" }, as: Customer, as_user_id: "${cust}", captures: { ord: $.data.id } }
            - { call: "POST /bureaus/order-lines", payload: { order_id: "${ord}", print_file_id: "${fileB}", material_id: "${mat}", layer_height_mm: 0.10, quantity: 1 }, as: Customer, as_user_id: "${cust}", captures: { lineB: $.data.id } }
            - { call: "POST /bureaus/orders/${ord}/quote", payload: {}, as: Customer, as_user_id: "${cust}", captures: { ov: $.data.version } }
            - { call: "POST /bureaus/orders/${ord}/confirm", payload: { expected_order_version: "${ov}" }, as: Customer, as_user_id: "${cust}" }
            - { call: "POST /bureaus/print-runs", payload: { order_line_id: "${lineB}", machine_id: "${mach}", spool_id: "${spool}", start_min: 0, duration_min: 24 }, as: Operator, captures: { run1: $.data.id } }
            - { call: "POST /bureaus/print-runs/${run1}/start", payload: {}, as: Operator }
          trigger:
            - { call: "POST /bureaus/orders/${ord}/cancel", payload: {}, as: Customer, as_user_id: "${cust}", captures: { err: $.data.error_id } }
          assert:
            - "Response status 409 and data.error_id == ERR_PRODUCTION_STARTED"

      - name: printfile_initial_state_uploaded
        claim_type: Initial State
        grounds: [state_machines.PrintFile, entities.PrintFile.fields.status]
        distinguishing_aspect: "A freshly uploaded PrintFile starts in status UPLOADED."
        test_recipe:
          setup: ["Bureau, Customer."]
          setup_api_calls:
            - { call: "POST /bureaus", payload: { name: "B INIT" }, as: BureauAdmin, captures: { b: $.data.id } }
            - { call: "POST /bureaus/customers", payload: { bureau_id: "${b}", email: "init@x.com", display_name: "INIT" }, as: BureauAdmin, captures: { cust: $.data.id } }
          trigger:
            - { call: "POST /bureaus/print-files", payload: { bureau_id: "${b}", customer_id: "${cust}", filename: "B.stl", volume_cm3: 4.00, bbox_x_mm: 20, bbox_y_mm: 20, bbox_z_mm: 20, min_wall_mm: 1.0, max_overhang_deg: 40, is_manifold: true }, as: Customer, as_user_id: "${cust}", captures: { st: $.data.status } }
          assert:
            - "PrintFile.status == UPLOADED"

      - name: check_rejected_file_is_terminal_lockdown
        claim_type: Terminal State Lockdown
        grounds: [state_machines.PrintFile, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "REJECTED is terminal: /override on a REJECTED file -> 409 ERR_INVALID_STATE (override only from FLAGGED)."
        test_recipe:
          setup: ["Bureau, Customer, Material; non-manifold File checked REJECTED."]
          setup_api_calls:
            - { call: "POST /bureaus", payload: { name: "B REJ" }, as: BureauAdmin, captures: { b: $.data.id } }
            - { call: "POST /bureaus/customers", payload: { bureau_id: "${b}", email: "rej@x.com", display_name: "REJ" }, as: BureauAdmin, captures: { cust: $.data.id } }
            - { call: "POST /bureaus/materials", payload: { bureau_id: "${b}", process: "SLA", name: "Tough Resin", density_g_per_cm3: 1.10, material_rate_cents_per_cm3: 35, machine_rate_cents_per_min: 12, setup_fee_cents: 2500, min_wall_thickness_mm: 0.80, max_overhang_deg: 45 }, as: BureauAdmin, captures: { mat: $.data.id } }
