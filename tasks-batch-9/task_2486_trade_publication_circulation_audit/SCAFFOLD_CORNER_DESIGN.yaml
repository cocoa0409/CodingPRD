              as: CirculationManager
              as_user_id: "mgr-01"
            - call: "POST /circulation/publications/${pub_id}/qualification-rules"
              payload: { dimension: "INDUSTRY", allowed_values: ["MANUFACTURING"], points: 30, is_mandatory: false }
              as: CirculationManager
              as_user_id: "mgr-01"
            - call: "POST /circulation/publications/${pub_id}/qualification-rules"
              payload: { dimension: "PURCHASING_AUTHORITY", allowed_values: ["APPROVES"], points: 25, is_mandatory: false }
              as: CirculationManager
              as_user_id: "mgr-01"
            - call: "POST /circulation/subscribers"
              payload: { publication_id: "${pub_id}", company_name: "Yankee Machining", contact_email: "ya@yankee.test", job_function_code: "ENGINEERING_MGMT", industry_code: "MANUFACTURING", purchasing_authority_level: "APPROVES", subscription_class: "QUALIFIED_NON_PAID", copies: 300 }
              as: CirculationManager
              as_user_id: "mgr-01"
              captures: { sub_xa_id: $.data.id, sub_xa_ver: $.data.version }
            - call: "POST /circulation/subscribers"
              payload: { publication_id: "${pub_id}", company_name: "Zulu Machining", contact_email: "zb@zulu.test", job_function_code: "ENGINEERING_MGMT", industry_code: "MANUFACTURING", purchasing_authority_level: "APPROVES", subscription_class: "QUALIFIED_NON_PAID", copies: 300 }
              as: CirculationManager
              as_user_id: "mgr-01"
              captures: { sub_xb_id: $.data.id }
            - call: "POST /circulation/subscribers/${sub_xa_id}/source-documents"
              payload: { doc_type: "SIGNED_REQUEST_CARD", captured_at: "2026-07-20T00:00:00Z", storage_ref: "s3://circ/xa-card" }
              as: QualificationSpecialist
              as_user_id: "qs-01"
              captures: { doc_xa_id: $.data.id }
            - call: "POST /circulation/qualification-requests"
              payload: { subscriber_id: "${sub_xa_id}", source_document_id: "${doc_xa_id}", request_channel: "DIRECT_MAIL", signed_at: "2026-07-20T00:00:00Z", attested_job_function_code: "ENGINEERING_MGMT", attested_industry_code: "MANUFACTURING", attested_purchasing_authority: "APPROVES", expected_subscriber_version: "${sub_xa_ver}" }
              as: QualificationSpecialist
              as_user_id: "qs-01"
              captures: { req_xa_id: $.data.id }
            - call: "POST /circulation/qualification-requests/${req_xa_id}/review"
              payload: { review_note: "full match" }
