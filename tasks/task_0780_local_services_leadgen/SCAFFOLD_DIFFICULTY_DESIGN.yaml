            - { call: "POST /availability-slots", payload: { pro_id: "${pq}", start_utc: "2026-03-05T13:15:00Z", end_utc: "2026-03-05T14:30:00Z" }, as: Pro, as_user_id: "${pq}", captures: { slot2: "$.data.id" } }
