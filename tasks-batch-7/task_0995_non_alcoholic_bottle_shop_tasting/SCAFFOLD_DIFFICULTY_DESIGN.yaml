scaffold_difficulty_design:

  # ==========================================================================
  # Rule 1 — Dual-variant calculations across different entity domains
  # ==========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: order_total_retail_vs_dtc_divergence
        grounds:
          - calculations.order_total_compose
          - calculations.shipping_charge_compose
          - calculations.order_tax_compose
        distinguishing_aspect: |
          Order domain — same line items (1 SKU @ 1000 cents, qty 2), same member
          (BRONZE tier, 0 redemption): retail_channel variant produces shipping=0
          and uses shop-state CA tax rate; dtc_channel variant produces
          shipping = 500 + 150*2 + state_surcharge and uses destination-state
          tax rate. Two valid variants yield different grand_total_cents.
        test_recipe:
          setup:
            - "Category STANDARD 'sparkling-tea' active"
            - "SKU 'tea-001' under that category, base_price_cents=1000, abv_basis_points=0"
            - "InventoryLot for SKU with qty_remaining=100, expires_on 2027-01-01, status=ACTIVE"
            - "Member BRONZE tier, ATTESTED, home_state='CA', wallet_credit_cents=0, loyalty_points_balance=0"
            - "ShippingStateRule CA: allows_dtc=true, min_age_years=0, abv_cap=500, surcharge=0, tax_rate_bps=1000"
            - "ShippingStateRule WA: allows_dtc=true, min_age_years=0, abv_cap=500, surcharge=300, tax_rate_bps=500"
          setup_api_calls:
            - call: "POST /nabs/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /nabs/categories"
              payload: { code: "sparkling-tea", display_name: "Sparkling Tea", compliance_class: "STANDARD" }
              as: PlatformAdmin
              captures:
                cat_id: "$.data.id"
            - call: "POST /nabs/skus"
              payload: { category_id: "${cat_id}", sku_code: "tea-001", title: "Tea One", base_price_cents: 1000, abv_basis_points: 0 }
              as: PlatformAdmin
              captures:
                sku_id: "$.data.id"
            - call: "POST /nabs/skus/${sku_id}/lots"
              payload: { lot_code: "L1", qty_received: 100, unit_cost_cents: 400, expires_on: "2027-01-01" }
              as: PlatformAdmin
            - call: "POST /nabs/members"
              payload: { email: "m1@x.com", full_name: "M One", date_of_birth: "1990-01-01", home_state_code: "CA" }
              as: PlatformAdmin
              captures:
                member_id: "$.data.id"
            - call: "POST /nabs/shipping-state-rules"
              payload: { state_code: "CA", allows_dtc: true, min_age_years: 0, abv_cap_basis_points: 500, surcharge_cents_per_order: 0, tax_rate_bps: 1000 }
              as: PlatformAdmin
            - call: "POST /nabs/shipping-state-rules"
              payload: { state_code: "WA", allows_dtc: true, min_age_years: 0, abv_cap_basis_points: 500, surcharge_cents_per_order: 300, tax_rate_bps: 500 }
              as: PlatformAdmin
            # Build a RETAIL order (channel=RETAIL)
            - call: "POST /nabs/orders"
              payload: { member_id: "${member_id}", channel: "RETAIL", loyalty_points_redeemed: 0 }
              as: Member
              as_user_id: "${member_id}"
              captures:
                order_retail_id: "$.data.id"
                order_retail_v: "$.data.version"
            - call: "POST /nabs/orders/${order_retail_id}/lines"
              payload: { sku_id: "${sku_id}", qty: 2 }
              as: Member
              as_user_id: "${member_id}"
            - call: "GET /nabs/orders/${order_retail_id}"
              as: Member
              as_user_id: "${member_id}"
              captures:
                order_retail_v2: "$.data.version"
            - call: "POST /nabs/orders/${order_retail_id}/submit"
              payload: { expected_order_version: "${order_retail_v2}" }
              as: Member
              as_user_id: "${member_id}"
            # Build a DTC order (channel=DTC, ship to WA)
            - call: "POST /nabs/orders"
              payload: { member_id: "${member_id}", channel: "DTC", ship_to_state_code: "WA", loyalty_points_redeemed: 0 }
              as: Member
              as_user_id: "${member_id}"
              captures:
                order_dtc_id: "$.data.id"
            - call: "POST /nabs/orders/${order_dtc_id}/lines"
              payload: { sku_id: "${sku_id}", qty: 2 }
              as: Member
              as_user_id: "${member_id}"
            - call: "GET /nabs/orders/${order_dtc_id}"
              as: Member
              as_user_id: "${member_id}"
              captures:
                order_dtc_v: "$.data.version"
            - call: "POST /nabs/orders/${order_dtc_id}/submit"
              payload: { expected_order_version: "${order_dtc_v}" }
              as: Member
              as_user_id: "${member_id}"
          trigger:
            - call: "GET /nabs/orders/${order_retail_id}"
              as: Member
              as_user_id: "${member_id}"
              captures:
                retail_grand: "$.data.grand_total_cents"
                retail_ship: "$.data.shipping_charge_cents"
                retail_tax: "$.data.tax_cents"
            - call: "GET /nabs/orders/${order_dtc_id}"
              as: Member
              as_user_id: "${member_id}"
              captures:
                dtc_grand: "$.data.grand_total_cents"
                dtc_ship: "$.data.shipping_charge_cents"
                dtc_tax: "$.data.tax_cents"
          assert:
            # RETAIL: subtotal=2000, discount=0, shipping=0, tax=round_half_up(2000*1000/10000)=200, grand=2200
            - "Order.${order_retail_id}.shipping_charge_cents == 0"
            - "Order.${order_retail_id}.tax_cents == 200"
            - "Order.${order_retail_id}.grand_total_cents == 2200"
            # DTC to WA: subtotal=2000, shipping=500+150*2+300=1100, taxable=3100, tax=round(3100*500/10000)=155, grand=2000+1100+155=3255
            - "Order.${order_dtc_id}.shipping_charge_cents == 1100"
            - "Order.${order_dtc_id}.tax_cents == 155"
            - "Order.${order_dtc_id}.grand_total_cents == 3255"
            - "Order.${order_retail_id}.grand_total_cents != Order.${order_dtc_id}.grand_total_cents"

      - name: lot_allocation_retail_vs_dtc_quarantine_handling
        grounds:
          - calculations.lot_allocation_walk
          - entities.InventoryLot.fields.status
        distinguishing_aspect: |
          Inventory/domain=Lot — the retail_channel variant of lot_allocation_walk permits
          allocation from QUARANTINED lots with ShopStaff override, while dtc_channel
          variant strictly excludes QUARANTINED lots. Identical SKU/lot pool, different
          variant, different allocation outcome (success vs ERR_INSUFFICIENT_INVENTORY).
        test_recipe:
          setup:
            - "Category STANDARD; SKU sku-rt base 500c abv=0"
            - "InventoryLot L-A qty=5 status=QUARANTINED (sole lot — no ACTIVE lots)"
            - "Member M2, ATTESTED, BRONZE"
            - "ShippingStateRule CA allows_dtc=true abv_cap=500 surcharge=0 tax=0"
          setup_api_calls:
            - call: "POST /nabs/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /nabs/categories"
              payload: { code: "tea2", display_name: "Tea 2", compliance_class: "STANDARD" }
              as: PlatformAdmin
              captures:
                cat2_id: "$.data.id"
            - call: "POST /nabs/skus"
              payload: { category_id: "${cat2_id}", sku_code: "sku-rt", title: "RT", base_price_cents: 500, abv_basis_points: 0 }
              as: PlatformAdmin
              captures:
                sku_rt_id: "$.data.id"
            - call: "POST /nabs/skus/${sku_rt_id}/lots"
              payload: { lot_code: "L-A", qty_received: 5, unit_cost_cents: 100, expires_on: "2027-01-01" }
              as: PlatformAdmin
              captures:
                lot_a_id: "$.data.id"
            - call: "POST /nabs/lots/${lot_a_id}/quarantine"
              payload: { quarantine_reason: "suspect batch" }
              as: ComplianceOfficer
            - call: "POST /nabs/members"
              payload: { email: "m2@x.com", full_name: "M Two", date_of_birth: "1990-01-01", home_state_code: "CA" }
              as: PlatformAdmin
              captures:
                member2_id: "$.data.id"
            - call: "POST /nabs/shipping-state-rules"
              payload: { state_code: "CA", allows_dtc: true, min_age_years: 0, abv_cap_basis_points: 500, surcharge_cents_per_order: 0, tax_rate_bps: 0 }
              as: PlatformAdmin
          trigger:
            # DTC order: strict — only lot is QUARANTINED → must reject
            - call: "POST /nabs/orders"
              payload: { member_id: "${member2_id}", channel: "DTC", ship_to_state_code: "CA" }
              as: Member
              as_user_id: "${member2_id}"
              captures:
                order_dtc_id: "$.data.id"
            - call: "POST /nabs/orders/${order_dtc_id}/lines"
              payload: { sku_id: "${sku_rt_id}", qty: 3 }
              as: Member
              as_user_id: "${member2_id}"
            - call: "GET /nabs/orders/${order_dtc_id}"
              as: Member
              as_user_id: "${member2_id}"
              captures:
                order_dtc_v: "$.data.version"
            - call: "POST /nabs/orders/${order_dtc_id}/submit"
              payload: { expected_order_version: "${order_dtc_v}" }
              as: Member
              as_user_id: "${member2_id}"
              captures:
                dtc_err: "$.data.error_id"
          assert:
            - "DTC submit rejected with ERR_INSUFFICIENT_INVENTORY"
            - "captured dtc_err == 'ERR_INSUFFICIENT_INVENTORY'"
            - "InventoryLot.${lot_a_id}.qty_remaining == 5 (unchanged)"

  # ==========================================================================
  # Rule 2 — Combinatorial formulas across different modes
  # ==========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: order_total_mode_a_nested_min_max
        grounds:
          - calculations.order_total_compose
        distinguishing_aspect: |
          Mode (a) — formula with >= 3 inputs and non-linear interaction: club
          discount_bps (conditional on applied_club_subscription_id presence),
          loyalty_points_redeemed (capped by member balance), shipping (conditional
          on channel and tiered by bottle count), tax (computed after discount).
          The mode-(a) signature is conditional branching on entity state plus
          >= 3 interacting inputs.
        test_recipe:
          setup:
            - "Category, SKU sku-a base=1000, SKU sku-b base=500"
            - "Lots sufficient for both SKUs"
            - "Member m3 ATTESTED GOLD tier, loyalty_points_balance=300 (capped at 300 redeemable)"
            - "ClubPlan with discount_bps_on_retail=1000 (10%), max_active=10"
            - "ClubSubscription ACTIVE binding member m3 to plan (auto-applied at order create)"
            - "ShippingStateRule CA allows_dtc=true abv_cap=500 surcharge=200 tax_rate_bps=800"
          setup_api_calls:
            - call: "POST /nabs/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /nabs/categories"
              payload: { code: "tea3", display_name: "Tea 3", compliance_class: "STANDARD" }
              as: PlatformAdmin
              captures:
                cat3_id: "$.data.id"
            - call: "POST /nabs/skus"
              payload: { category_id: "${cat3_id}", sku_code: "sku-a", title: "A", base_price_cents: 1000, abv_basis_points: 0 }
              as: PlatformAdmin
              captures:
                sku_a_id: "$.data.id"
            - call: "POST /nabs/skus"
              payload: { category_id: "${cat3_id}", sku_code: "sku-b", title: "B", base_price_cents: 500, abv_basis_points: 0 }
              as: PlatformAdmin
              captures:
                sku_b_id: "$.data.id"
            - call: "POST /nabs/skus/${sku_a_id}/lots"
              payload: { lot_code: "LA", qty_received: 50, unit_cost_cents: 100, expires_on: "2027-01-01" }
              as: PlatformAdmin
            - call: "POST /nabs/skus/${sku_b_id}/lots"
              payload: { lot_code: "LB", qty_received: 50, unit_cost_cents: 100, expires_on: "2027-01-01" }
              as: PlatformAdmin
            - call: "POST /nabs/members"
              payload: { email: "m3@x.com", full_name: "M Three", date_of_birth: "1990-01-01", home_state_code: "CA" }
              as: PlatformAdmin
              captures:
                member3_id: "$.data.id"
            - call: "POST /nabs/members/${member3_id}/wallet/adjustments"
              payload: { delta_cents: 0, reason: "noop" }
              as: PlatformAdmin
            # Set loyalty balance to 300 by admin adjustment is not directly supported; assume award via tasting flows.
            # For this test we rely on redemption=0 to keep numbers deterministic; loyalty_points_balance path is covered in priority_pair instance.
            - call: "POST /nabs/club-plans"
              payload: { code: "PLAN-A", cadence: "MONTHLY", bottles_per_shipment: 2, price_cents_per_cycle: 3000, allowed_category_ids: ["${cat3_id}"], discount_bps_on_retail: 1000, max_active_subscriptions: 10 }
              as: PlatformAdmin
              captures:
                plan_a_id: "$.data.id"
                plan_a_v: "$.data.version"
            - call: "POST /nabs/club-subscriptions"
              payload: { plan_id: "${plan_a_id}", member_id: "${member3_id}", started_on: "2026-04-01", expected_plan_version: "${plan_a_v}", trial_days: 0 }
              as: Member
              as_user_id: "${member3_id}"
              captures:
                sub3_id: "$.data.id"
            - call: "POST /nabs/shipping-state-rules"
              payload: { state_code: "CA", allows_dtc: true, min_age_years: 0, abv_cap_basis_points: 500, surcharge_cents_per_order: 200, tax_rate_bps: 800 }
              as: PlatformAdmin
            # Build DTC order with both SKUs
            - call: "POST /nabs/orders"
              payload: { member_id: "${member3_id}", channel: "DTC", ship_to_state_code: "CA", loyalty_points_redeemed: 0, applied_club_subscription_id: "${sub3_id}" }
              as: Member
              as_user_id: "${member3_id}"
              captures:
                order3_id: "$.data.id"
            - call: "POST /nabs/orders/${order3_id}/lines"
              payload: { sku_id: "${sku_a_id}", qty: 3 }
              as: Member
              as_user_id: "${member3_id}"
            - call: "POST /nabs/orders/${order3_id}/lines"
              payload: { sku_id: "${sku_b_id}", qty: 2 }
              as: Member
              as_user_id: "${member3_id}"
            - call: "GET /nabs/orders/${order3_id}"
              as: Member
              as_user_id: "${member3_id}"
              captures:
                order3_v: "$.data.version"
          trigger:
            - call: "POST /nabs/orders/${order3_id}/submit"
              payload: { expected_order_version: "${order3_v}" }
              as: Member
              as_user_id: "${member3_id}"
          assert:
            # Line A: unit = round(1000*9000/10000) = 900; extended = 900*3 = 2700
            # Line B: unit = round(500*9000/10000) = 450; extended = 450*2 = 900
            # subtotal = 3600; bottles=5; shipping = 500+150*5+200 = 1450
            # taxable = 3600+1450 = 5050; tax = round(5050*800/10000) = 404
            # grand = 3600 + 1450 + 404 = 5454
            - "Order.${order3_id}.subtotal_cents == 3600"
            - "Order.${order3_id}.shipping_charge_cents == 1450"
            - "Order.${order3_id}.tax_cents == 404"
            - "Order.${order3_id}.grand_total_cents == 5454"

      - name: per_line_rounding_vs_sum_then_round_mode_b
        grounds:
          - calculations.order_total_compose
          - entities.OrderLine.fields.extended_price_cents
        distinguishing_aspect: |
          Mode (b) — nested rounding where order matters: scaffold pins
          round-per-line-then-sum. Constructed case where per-line rounding and
          sum-then-round diverge: club discount 3333 bps produces
          unit = round_half_up(299 * 6667 / 10000) = round_half_up(199.3433) = 199
          per line, while sum-then-round of (299*6667/10000) * 3 = 598.03 -> 598;
          per-line-sum = 199*3 = 597. Divergence of 1 cent proves mode (b).
        test_recipe:
          setup:
            - "Category tea4; SKU sku-r base_price=299 abv=0; lot 100 units"
            - "Member m4 ATTESTED BRONZE; no redemption"
            - "ClubPlan discount_bps_on_retail=3333 (33.33%); sub ACTIVE"
            - "ShippingStateRule CA allows_dtc=false (force RETAIL to zero out shipping/tax)"
            - "Channel RETAIL; shop home state CA tax_rate_bps=0 (to isolate rounding)"
          setup_api_calls:
            - call: "POST /nabs/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /nabs/categories"
              payload: { code: "tea4", display_name: "Tea 4", compliance_class: "STANDARD" }
              as: PlatformAdmin
              captures:
                cat4_id: "$.data.id"
            - call: "POST /nabs/skus"
              payload: { category_id: "${cat4_id}", sku_code: "sku-r", title: "R", base_price_cents: 299, abv_basis_points: 0 }
              as: PlatformAdmin
              captures:
                sku_r_id: "$.data.id"
            - call: "POST /nabs/skus/${sku_r_id}/lots"
              payload: { lot_code: "LR", qty_received: 100, unit_cost_cents: 50, expires_on: "2027-01-01" }
              as: PlatformAdmin
            - call: "POST /nabs/members"
              payload: { email: "m4@x.com", full_name: "M Four", date_of_birth: "1990-01-01", home_state_code: "CA" }
              as: PlatformAdmin
              captures:
                member4_id: "$.data.id"
            - call: "POST /nabs/club-plans"
              payload: { code: "PLAN-B", cadence: "MONTHLY", bottles_per_shipment: 1, price_cents_per_cycle: 1000, allowed_category_ids: ["${cat4_id}"], discount_bps_on_retail: 3333, max_active_subscriptions: 10 }
              as: PlatformAdmin
              captures:
                plan_b_id: "$.data.id"
                plan_b_v: "$.data.version"
            - call: "POST /nabs/club-subscriptions"
              payload: { plan_id: "${plan_b_id}", member_id: "${member4_id}", started_on: "2026-04-01", expected_plan_version: "${plan_b_v}", trial_days: 0 }
              as: Member
              as_user_id: "${member4_id}"
              captures:
                sub4_id: "$.data.id"
            - call: "POST /nabs/shipping-state-rules"
              payload: { state_code: "CA", allows_dtc: false, min_age_years: 0, abv_cap_basis_points: 500, surcharge_cents_per_order: 0, tax_rate_bps: 0 }
              as: PlatformAdmin
            - call: "POST /nabs/orders"
              payload: { member_id: "${member4_id}", channel: "RETAIL", loyalty_points_redeemed: 0, applied_club_subscription_id: "${sub4_id}" }
              as: Member
              as_user_id: "${member4_id}"
              captures:
                order4_id: "$.data.id"
            - call: "POST /nabs/orders/${order4_id}/lines"
              payload: { sku_id: "${sku_r_id}", qty: 3 }
              as: Member
              as_user_id: "${member4_id}"
            - call: "GET /nabs/orders/${order4_id}"
              as: Member
              as_user_id: "${member4_id}"
              captures:
                order4_v: "$.data.version"
          trigger:
            - call: "POST /nabs/orders/${order4_id}/submit"
              payload: { expected_order_version: "${order4_v}" }
              as: Member
              as_user_id: "${member4_id}"
          assert:
            # unit = round_half_up(299 * (10000-3333) / 10000) = round_half_up(199.3433) = 199
            # extended = 199 * 3 = 597 (per-line rounding wins)
            # sum-then-round would have been round(299*6667/10000 * 3) = round(598.03) = 598 -- NOT the scaffold's rule
            - "Order.${order4_id}.subtotal_cents == 597"
            - "Order.${order4_id}.grand_total_cents == 597"
            # Explicit falsification of sum-then-round interpretation:
            - "Order.${order4_id}.subtotal_cents != 598"

  # ==========================================================================
  # Rule 3 — Non-linear state-machine shape on different entities
  # ==========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: order_parallel_payment_fulfillment_dimensions
        grounds:
          - state_machines.Order
          - entities.Order.fields.payment_status
          - entities.Order.fields.fulfillment_status
        distinguishing_aspect: |
          Order entity carries two parallel state dimensions (payment_status ×
          fulfillment_status) that evolve independently: a DTC order can be in
          (AUTHORIZED, PACKED), then transition to (AUTHORIZED, SHIPPED) on
          shipment creation, then (CAPTURED, DELIVERED) on delivery — the two
          axes are not locked to one another.
        test_recipe:
          setup:
            - "Category, SKU, lot; Member m5; ShippingStateRule CA allows_dtc=true tax=0 surcharge=0"
            - "DTC Order 1 line qty=1, submitted → (AUTHORIZED, PICKING)"
          setup_api_calls:
            - call: "POST /nabs/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /nabs/categories"
              payload: { code: "tea5", display_name: "Tea 5", compliance_class: "STANDARD" }
              as: PlatformAdmin
              captures:
                cat5_id: "$.data.id"
            - call: "POST /nabs/skus"
              payload: { category_id: "${cat5_id}", sku_code: "sku-5", title: "S5", base_price_cents: 800, abv_basis_points: 0 }
              as: PlatformAdmin
              captures:
                sku5_id: "$.data.id"
            - call: "POST /nabs/skus/${sku5_id}/lots"
              payload: { lot_code: "L5", qty_received: 10, unit_cost_cents: 100, expires_on: "2027-01-01" }
              as: PlatformAdmin
            - call: "POST /nabs/members"
              payload: { email: "m5@x.com", full_name: "M Five", date_of_birth: "1990-01-01", home_state_code: "CA" }
              as: PlatformAdmin
              captures:
                member5_id: "$.data.id"
            - call: "POST /nabs/shipping-state-rules"
              payload: { state_code: "CA", allows_dtc: true, min_age_years: 0, abv_cap_basis_points: 500, surcharge_cents_per_order: 0, tax_rate_bps: 0 }
              as: PlatformAdmin
            - call: "POST /nabs/orders"
              payload: { member_id: "${member5_id}", channel: "DTC", ship_to_state_code: "CA" }
              as: Member
              as_user_id: "${member5_id}"
              captures:
                order5_id: "$.data.id"
            - call: "POST /nabs/orders/${order5_id}/lines"
              payload: { sku_id: "${sku5_id}", qty: 1 }
              as: Member
              as_user_id: "${member5_id}"
            - call: "GET /nabs/orders/${order5_id}"
              as: Member
              as_user_id: "${member5_id}"
              captures:
                order5_v: "$.data.version"
            - call: "POST /nabs/orders/${order5_id}/submit"
              payload: { expected_order_version: "${order5_v}" }
              as: Member
              as_user_id: "${member5_id}"
          trigger:
            - call: "POST /nabs/orders/${order5_id}/pack"
              as: ShopStaff
            - call: "GET /nabs/orders/${order5_id}"
              as: ShopStaff
              captures:
                pay_at_packed: "$.data.payment_status"
                ful_at_packed: "$.data.fulfillment_status"
            - call: "POST /nabs/orders/${order5_id}/shipments"
              payload: { carrier: "UPS", tracking_no: "T123", shipped_on: "2026-05-02" }
              as: ShopStaff
              captures:
                ship5_id: "$.data.id"
            - call: "GET /nabs/orders/${order5_id}"
              as: ShopStaff
              captures:
                pay_at_shipped: "$.data.payment_status"
                ful_at_shipped: "$.data.fulfillment_status"
            - call: "POST /nabs/shipments/${ship5_id}/mark-in-transit"
              as: ShopStaff
            - call: "POST /nabs/shipments/${ship5_id}/mark-out-for-delivery"
              as: ShopStaff
            - call: "POST /nabs/shipments/${ship5_id}/mark-delivered"
              payload: { delivered_on: "2026-05-05" }
              as: ShopStaff
            - call: "GET /nabs/orders/${order5_id}"
              as: ShopStaff
              captures:
                pay_final: "$.data.payment_status"
                ful_final: "$.data.fulfillment_status"
          assert:
            - "At PACKED: payment_status == 'AUTHORIZED' AND fulfillment_status == 'PACKED' (parallel axes — payment has not moved)"
            - "At SHIPPED: payment_status == 'AUTHORIZED' AND fulfillment_status == 'SHIPPED'"
            - "Final: payment_status == 'CAPTURED' AND fulfillment_status == 'DELIVERED'"

      - name: member_attestation_cycle_with_revocation
        grounds:
          - state_machines.Member
          - entities.Member.fields.age_attestation_status
        distinguishing_aspect: |
          Member entity carries a cyclic state machine with multiple re-entrant
          paths: UNVERIFIED -> PENDING_REVIEW -> REJECTED -> PENDING_REVIEW ->
          ATTESTED -> REVOKED. The cycle (REJECTED -> PENDING_REVIEW) and the
          terminal-state entry from ATTESTED make this non-linear.
        test_recipe:
          setup:
            - "Member m6 registered (UNVERIFIED)"
          setup_api_calls:
            - call: "POST /nabs/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /nabs/members"
              payload: { email: "m6@x.com", full_name: "M Six", date_of_birth: "1990-01-01", home_state_code: "CA" }
              as: PlatformAdmin
              captures:
                member6_id: "$.data.id"
          trigger:
            # Cycle 1: UNVERIFIED -> PENDING_REVIEW -> REJECTED
            - call: "POST /nabs/members/${member6_id}/attestations"
              payload: { attested_by_user_id: "staff_A", outcome: "APPROVED", attested_on: "2026-05-01", document_reference: "doc1" }
              as: ShopStaff
              captures:
                att1_id: "$.data.id"
            - call: "POST /nabs/members/${member6_id}/attestations/${att1_id}/reject"
              as: ComplianceOfficer
            - call: "GET /nabs/members/${member6_id}"
              as: ShopStaff
              captures:
                status_after_reject: "$.data.age_attestation_status"
            # Cycle 2: REJECTED -> PENDING_REVIEW -> ATTESTED
            - call: "POST /nabs/members/${member6_id}/attestations"
              payload: { attested_by_user_id: "staff_B", outcome: "APPROVED", attested_on: "2026-05-02", document_reference: "doc2" }
              as: ShopStaff
              captures:
                att2_id: "$.data.id"
            - call: "POST /nabs/members/${member6_id}/attestations/${att2_id}/approve"
              as: ComplianceOfficer
            - call: "GET /nabs/members/${member6_id}"
              as: ShopStaff
              captures:
                status_after_approve: "$.data.age_attestation_status"
            # Revoke: ATTESTED -> REVOKED
            - call: "POST /nabs/members/${member6_id}/attestations/revoke"
              as: ComplianceOfficer
            - call: "GET /nabs/members/${member6_id}"
              as: ShopStaff
              captures:
                status_final: "$.data.age_attestation_status"
          assert:
            - "After first reject: age_attestation_status == 'REJECTED'"
            - "After re-attest + approve: age_attestation_status == 'ATTESTED'"
            - "After revoke: age_attestation_status == 'REVOKED'"

