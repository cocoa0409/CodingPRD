scaffold_corner_design:

  # ---------------------------------------------------------------------------
  # Fixture universe is shared with SCAFFOLD_DIFFICULTY_DESIGN.yaml so that a
  # test author can lift a setup chain from either file without re-deriving
  # money figures. Logical clock default is 2026-08-01T00:00:00Z.
  # ---------------------------------------------------------------------------

  - section: entities
    instances:
      - name: client_creation_returns_the_full_declared_field_set
        claim_type: creation
        grounds:
          - entities.Client
          - endpoints[POST /convention-center/clients]
        distinguishing_aspect: |
          Plain creation of the root aggregate that owns money state. Every declared
          field must come back on the 201 body, including the three computed money
          counters and booking_standing, all at their declared defaults.
        test_recipe:
          setup:
            - "no rows exist"
          setup_api_calls: []
          trigger:
            - call: "POST /convention-center/clients"
              payload: { legal_name: "Sunbelt Show Promotions", contact_email: "ssp@example.org", organization_type: "PROMOTER" }
              as: VenueAdmin
              captures: { cl_ssp_id: $.data.id }
          assert:
            - "the trigger returns 201"
            - "Client.${cl_ssp_id}.legal_name == Sunbelt Show Promotions"
            - "Client.${cl_ssp_id}.contact_email == ssp@example.org"
            - "Client.${cl_ssp_id}.organization_type == PROMOTER"
            - "Client.${cl_ssp_id}.total_deposits_paid_cents == 0"
            - "Client.${cl_ssp_id}.credit_balance_cents == 0"
            - "Client.${cl_ssp_id}.outstanding_balance_cents == 0"
            - "Client.${cl_ssp_id}.booking_standing == GOOD"
            - "response_type == object and meta.api_request_id is present"

      - name: space_retrieval_by_id_returns_the_stored_row
        claim_type: retrieval
        grounds:
          - entities.SpaceUnit
          - endpoints[GET /convention-center/spaces/{id}]
        distinguishing_aspect: |
          Read-after-write on the self-referential entity: the child space must report
          its parent_space_id verbatim and its two computed counters at zero, proving
          the GET projects stored state rather than recomputing it.
        test_recipe:
          setup:
            - "Hall A exists and Hall A1 is its child"
          setup_api_calls:
            - call: "POST /convention-center/spaces"
              payload: { name: "Hall A", space_class: "HALL", rentable_sqft: 200000, daily_base_rate_cents: 4800000, rigging_capable: true }
              as: VenueAdmin
              captures: { sp_ha_id: $.data.id }
            - call: "POST /convention-center/spaces"
              payload: { name: "Hall A1", space_class: "HALL", rentable_sqft: 100000, daily_base_rate_cents: 2400000, parent_space_id: "${sp_ha_id}", rigging_capable: true }
              as: VenueAdmin
              captures: { sp_a1_id: $.data.id }
          trigger:
            - call: "GET /convention-center/spaces/${sp_a1_id}"
              payload: {}
              as: FacilitiesPlanner
          assert:
            - "the trigger returns 200"
            - "SpaceUnit.${sp_a1_id}.name == Hall A1"
            - "SpaceUnit.${sp_a1_id}.parent_space_id == ${sp_ha_id}"
            - "SpaceUnit.${sp_a1_id}.daily_base_rate_cents == 2400000"
            - "SpaceUnit.${sp_a1_id}.rigging_capable == true"
            - "SpaceUnit.${sp_a1_id}.committed_space_days == 0"
            - "SpaceUnit.${sp_a1_id}.active_blackout_count == 0"

      - name: booking_listing_filters_by_client_and_paginates
        claim_type: listing
        grounds:
          - endpoints[GET /convention-center/bookings]
          - response_envelope.pagination_fields
        distinguishing_aspect: |
          Three bookings for one client across three spaces. The list must honour the
          client_id filter, the limit/offset pair, and report total_count over the
          filtered set (3) rather than over the page (2), with has_more flipping
          between the two pages.
        test_recipe:
          setup:
            - "Sunbelt Show Promotions holds three CONSUMER_SHOW bookings, one each on Meeting Room 301, Ballroom B and Ballroom C"
          setup_api_calls:
            - call: "POST /convention-center/policy-windows"
              payload: { event_class: "CONSUMER_SHOW", priority_rank: 3, open_months_before: 18, close_months_before: 2, max_holds_per_booking: 2, challenge_response_hours: 48, rental_discount_pct: 0.0, max_challenge_rounds: 1 }
              as: VenueAdmin
            - call: "POST /convention-center/spaces"
              payload: { name: "Meeting Room 301", space_class: "MEETING_ROOM", rentable_sqft: 2600, daily_base_rate_cents: 90900 }
              as: VenueAdmin
              captures: { sp_mr_id: $.data.id }
            - call: "POST /convention-center/spaces"
              payload: { name: "Ballroom B", space_class: "BALLROOM", rentable_sqft: 40000, daily_base_rate_cents: 1200000 }
              as: VenueAdmin
              captures: { sp_bb_id: $.data.id }
            - call: "POST /convention-center/spaces"
              payload: { name: "Ballroom C", space_class: "BALLROOM", rentable_sqft: 42000, daily_base_rate_cents: 1250000 }
              as: VenueAdmin
              captures: { sp_bc_id: $.data.id }
            - call: "POST /convention-center/clients"
              payload: { legal_name: "Sunbelt Show Promotions", contact_email: "ssp@example.org", organization_type: "PROMOTER" }
              as: VenueAdmin
              captures: { cl_ssp_id: $.data.id }
            - call: "POST /convention-center/clients"
              payload: { legal_name: "Riverbend Rotary", contact_email: "rotary@example.org", organization_type: "LOCAL_ORGANIZATION" }
              as: VenueAdmin
              captures: { cl_rr_id: $.data.id }
            - call: "POST /convention-center/bookings"
              payload: { client_id: "${cl_ssp_id}", space_id: "${sp_mr_id}", event_name: "Regional Gem Show", event_class: "CONSUMER_SHOW", move_in_start_date: "2027-03-01", show_start_date: "2027-03-02", show_end_date: "2027-03-04", move_out_end_date: "2027-03-05" }
              as: SalesManager
            - call: "POST /convention-center/bookings"
              payload: { client_id: "${cl_ssp_id}", space_id: "${sp_bb_id}", event_name: "Sunbelt Home Show", event_class: "CONSUMER_SHOW", move_in_start_date: "2027-06-08", show_start_date: "2027-06-10", show_end_date: "2027-06-12", move_out_end_date: "2027-06-13" }
              as: SalesManager
            - call: "POST /convention-center/bookings"
              payload: { client_id: "${cl_ssp_id}", space_id: "${sp_bc_id}", event_name: "Sunbelt Boat Show", event_class: "CONSUMER_SHOW", move_in_start_date: "2027-09-06", show_start_date: "2027-09-08", show_end_date: "2027-09-10", move_out_end_date: "2027-09-12" }
              as: SalesManager
            - call: "POST /convention-center/bookings"
              payload: { client_id: "${cl_rr_id}", space_id: "${sp_mr_id}", event_name: "Rotary Craft Bazaar", event_class: "CONSUMER_SHOW", move_in_start_date: "2027-11-01", show_start_date: "2027-11-03", show_end_date: "2027-11-05", move_out_end_date: "2027-11-06" }
              as: SalesManager
          trigger:
            - call: "GET /convention-center/bookings"
              payload: { client_id: "${cl_ssp_id}", limit: 2, offset: 0 }
              as: SalesManager
            - call: "GET /convention-center/bookings"
              payload: { client_id: "${cl_ssp_id}", limit: 2, offset: 2 }
              as: SalesManager
          assert:
            - "the first trigger returns 200 with response_type == array and exactly 2 rows"
            - "the first trigger reports total_count == 3, limit == 2, offset == 0 and has_more == true"
            - "the second trigger returns exactly 1 row with total_count == 3, offset == 2 and has_more == false"
            - "the Riverbend Rotary booking appears in neither page"

      - name: vendor_retrieval_with_an_unknown_identifier_not_found
        claim_type: not_found
        grounds:
          - endpoints[GET /convention-center/vendors/{id}]
          - errors[ERR_VENDOR_NOT_FOUND]
          - validations[priority=30]
        distinguishing_aspect: |
          A syntactically valid identifier that names no row. Priority 30 runs on every
          templated path segment, so the 404 must be reported even though the vendor
          table is non-empty and the acting role is fully authorised.
        test_recipe:
          setup:
            - "one vendor exists so the table is not empty"
          setup_api_calls:
            - call: "POST /convention-center/vendors"
              payload: { legal_name: "SparkleClean Facility Services", service_category: "CLEANING", vendor_tier: "EXCLUSIVE", coi_expiry_date: "2030-01-01" }
              as: VenueAdmin
          trigger:
            - call: "GET /convention-center/vendors/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: EventServicesManager
          assert:
            - "the trigger returns 404 with data.error_id == ERR_VENDOR_NOT_FOUND"
            - "response_type == error"

      - name: booking_creation_without_show_end_date_rejected
        claim_type: required_fields
        grounds:
          - endpoints[POST /convention-center/bookings]
          - errors[ERR_INVALID_REQUEST]
          - validations[priority=36]
        distinguishing_aspect: |
          A required input field is omitted entirely rather than sent with a bad value.
          The 400 must fire before any of the derived money writes, so no EventBooking
          row and no SpaceUnit.committed_space_days movement may appear.
        test_recipe:
          setup:
            - "the CONSUMER_SHOW window, Meeting Room 301 and Sunbelt Show Promotions exist"
          setup_api_calls:
            - call: "POST /convention-center/policy-windows"
              payload: { event_class: "CONSUMER_SHOW", priority_rank: 3, open_months_before: 18, close_months_before: 2, max_holds_per_booking: 2, challenge_response_hours: 48, rental_discount_pct: 0.0, max_challenge_rounds: 1 }
              as: VenueAdmin
            - call: "POST /convention-center/spaces"
              payload: { name: "Meeting Room 301", space_class: "MEETING_ROOM", rentable_sqft: 2600, daily_base_rate_cents: 90900 }
              as: VenueAdmin
              captures: { sp_mr_id: $.data.id }
            - call: "POST /convention-center/clients"
              payload: { legal_name: "Sunbelt Show Promotions", contact_email: "ssp@example.org", organization_type: "PROMOTER" }
              as: VenueAdmin
              captures: { cl_ssp_id: $.data.id }
          trigger:
            - call: "POST /convention-center/bookings"
              payload: { client_id: "${cl_ssp_id}", space_id: "${sp_mr_id}", event_name: "Regional Gem Show", event_class: "CONSUMER_SHOW", move_in_start_date: "2027-03-01", show_start_date: "2027-03-02", move_out_end_date: "2027-03-05" }
              as: SalesManager
          assert:
            - "the trigger returns 400 with data.error_id == ERR_INVALID_REQUEST"
            - "GET /convention-center/bookings with space_id filter returns total_count == 0"
            - "SpaceUnit.${sp_mr_id}.committed_space_days == 0"

      - name: space_creation_defaults_rigging_capable_to_false
        claim_type: defaults
        grounds:
          - entities.SpaceUnit.fields.rigging_capable
          - entities.SpaceUnit.fields.parent_space_id
          - endpoints[POST /convention-center/spaces]
        distinguishing_aspect: |
          Both optional inputs are omitted. rigging_capable must land on false rather
          than null or true, because validation priority 54 keys a hard rejection on
          exactly that flag; parent_space_id must land on null, making the row a root.
        test_recipe:
          setup:
            - "no spaces exist"
          setup_api_calls: []
          trigger:
            - call: "POST /convention-center/spaces"
              payload: { name: "Ballroom B", space_class: "BALLROOM", rentable_sqft: 40000, daily_base_rate_cents: 1200000 }
              as: FacilitiesPlanner
              captures: { sp_bb_id: $.data.id }
          assert:
            - "the trigger returns 201"
            - "SpaceUnit.${sp_bb_id}.rigging_capable == false"
            - "SpaceUnit.${sp_bb_id}.parent_space_id == null"
            - "SpaceUnit.${sp_bb_id}.committed_space_days == 0"
            - "SpaceUnit.${sp_bb_id}.version == 1"

      - name: booking_creation_computes_the_three_money_fields_and_the_day_count
        claim_type: computed_fields
        grounds:
          - calculations.contracted_rental_charge
          - calculations.space_days_committed
          - entities.EventBooking.fields.gross_rental_cents
          - endpoints[POST /convention-center/bookings]
        distinguishing_aspect: |
          Meeting Room 301 at 90900 per day with one move-in day, three show days and
          one move-out day gives billable_units 4, so gross and contracted coincide at
          363600 under a zero-discount window and deposit_required is 90900. The day
          ledger is a different arithmetic (closed interval, 5 days), so a single
          implementation that reuses billable_units for both is caught here.
        test_recipe:
          setup:
            - "the CONSUMER_SHOW window has rental_discount_pct 0.0"
            - "Meeting Room 301 has daily_base_rate_cents 90900"
          setup_api_calls:
            - call: "POST /convention-center/policy-windows"
              payload: { event_class: "CONSUMER_SHOW", priority_rank: 3, open_months_before: 18, close_months_before: 2, max_holds_per_booking: 2, challenge_response_hours: 48, rental_discount_pct: 0.0, max_challenge_rounds: 1 }
              as: VenueAdmin
              captures: { pw_cs_id: $.data.id }
            - call: "POST /convention-center/spaces"
              payload: { name: "Meeting Room 301", space_class: "MEETING_ROOM", rentable_sqft: 2600, daily_base_rate_cents: 90900 }
              as: VenueAdmin
              captures: { sp_mr_id: $.data.id }
            - call: "POST /convention-center/clients"
              payload: { legal_name: "Sunbelt Show Promotions", contact_email: "ssp@example.org", organization_type: "PROMOTER" }
              as: VenueAdmin
              captures: { cl_ssp_id: $.data.id }
          trigger:
            - call: "POST /convention-center/bookings"
              payload: { client_id: "${cl_ssp_id}", space_id: "${sp_mr_id}", event_name: "Regional Gem Show", event_class: "CONSUMER_SHOW", move_in_start_date: "2027-03-01", show_start_date: "2027-03-02", show_end_date: "2027-03-04", move_out_end_date: "2027-03-05" }
              as: SalesManager
              captures: { bk_id: $.data.id }
          assert:
            - "the trigger returns 201"
            - "EventBooking.${bk_id}.gross_rental_cents == 363600"
            - "EventBooking.${bk_id}.contracted_rental_cents == 363600"
            - "EventBooking.${bk_id}.deposit_required_cents == 90900"
            - "EventBooking.${bk_id}.space_days_committed == 5"
            - "EventBooking.${bk_id}.policy_window_id == ${pw_cs_id}"

      - name: client_creation_mints_identity_timestamps_and_version_one
        claim_type: system_fields
        grounds:
          - entities.Client
          - response_envelope.success
        distinguishing_aspect: |
          The four server-stamped fields are never client-supplied: POST /clients has
          no id or version in its input list, so version must be minted at 1 and the
          two timestamps must be present on the same 201 body.
        test_recipe:
          setup:
            - "no rows exist"
          setup_api_calls: []
          trigger:
            - call: "POST /convention-center/clients"
              payload: { legal_name: "National Widget Association", contact_email: "nwa@example.org", organization_type: "NATIONAL_ASSOCIATION" }
              as: SalesManager
              captures: { cl_nwa_id: $.data.id, cl_nwa_v: $.data.version }
          assert:
            - "the trigger returns 201 with a non-empty data.id"
            - "Client.${cl_nwa_id}.version == 1"
            - "Client.${cl_nwa_id}.created_at is present and equals updated_at"
            - "the captured ${cl_nwa_v} equals 1"

      - name: booking_creation_with_an_unknown_event_class_value_rejected
        claim_type: type_constraints
        grounds:
          - entities.EventBooking.fields.event_class
          - errors[ERR_INVALID_REQUEST]
          - validations[priority=36]
        distinguishing_aspect: |
          Enum membership is checked at priority 36, ahead of the policy-window lookup
          at 34 only for shape errors — here the value TRADE_SHOW is outside the
          declared three-value enum, so the request must be a 400 shape error rather
          than a 422 ERR_POLICY_WINDOW_MISSING for a class nobody published.
        test_recipe:
          setup:
            - "windows exist for all three declared event classes is not required; only CONSUMER_SHOW is published"
          setup_api_calls:
            - call: "POST /convention-center/policy-windows"
              payload: { event_class: "CONSUMER_SHOW", priority_rank: 3, open_months_before: 18, close_months_before: 2, max_holds_per_booking: 2, challenge_response_hours: 48, rental_discount_pct: 0.0, max_challenge_rounds: 1 }
              as: VenueAdmin
            - call: "POST /convention-center/spaces"
              payload: { name: "Meeting Room 301", space_class: "MEETING_ROOM", rentable_sqft: 2600, daily_base_rate_cents: 90900 }
              as: VenueAdmin
              captures: { sp_mr_id: $.data.id }
            - call: "POST /convention-center/clients"
              payload: { legal_name: "Sunbelt Show Promotions", contact_email: "ssp@example.org", organization_type: "PROMOTER" }
              as: VenueAdmin
              captures: { cl_ssp_id: $.data.id }
          trigger:
            - call: "POST /convention-center/bookings"
              payload: { client_id: "${cl_ssp_id}", space_id: "${sp_mr_id}", event_name: "Regional Gem Show", event_class: "TRADE_SHOW", move_in_start_date: "2027-03-01", show_start_date: "2027-03-02", show_end_date: "2027-03-04", move_out_end_date: "2027-03-05" }
              as: SalesManager
          assert:
            - "the trigger returns 400 with data.error_id == ERR_INVALID_REQUEST"
            - "the trigger does not return 422 with data.error_id == ERR_POLICY_WINDOW_MISSING"

      - name: usage_record_cannot_be_updated_and_carries_no_version
        claim_type: immutability
        grounds:
          - entities.SpaceUsageRecord
          - endpoints[POST /convention-center/bookings/{id}/usage-records]
          - endpoints[GET /convention-center/usage-records]
        distinguishing_aspect: |
          SpaceUsageRecord is declared with common_fields false, so it is the only
          child besides SettlementLineItem with no version and no optimistic-concurrency
          surface. The §1.5 table therefore exposes no PATCH, PUT or DELETE for it: an
          attested day can only be superseded by the settlement basis, never edited.
        test_recipe:
          setup:
            - "the Meeting Room 301 booking is IN_HOUSE at logical clock 2027-03-01T08:00:00Z"
            - "one MOVE_IN day has been attested on 2027-03-01 by user esm-1"
          setup_api_calls:
            - call: "POST /convention-center/policy-windows"
              payload: { event_class: "CONSUMER_SHOW", priority_rank: 3, open_months_before: 18, close_months_before: 2, max_holds_per_booking: 2, challenge_response_hours: 48, rental_discount_pct: 0.0, max_challenge_rounds: 1 }
              as: VenueAdmin
            - call: "POST /convention-center/spaces"
              payload: { name: "Meeting Room 301", space_class: "MEETING_ROOM", rentable_sqft: 2600, daily_base_rate_cents: 90900 }
              as: VenueAdmin
              captures: { sp_mr_id: $.data.id }
            - call: "POST /convention-center/clients"
              payload: { legal_name: "Sunbelt Show Promotions", contact_email: "ssp@example.org", organization_type: "PROMOTER" }
              as: VenueAdmin
              captures: { cl_ssp_id: $.data.id }
            - call: "POST /convention-center/clients/${cl_ssp_id}/deposits"
              payload: { amount_cents: 200000 }
              as: VenueAdmin
            - call: "POST /convention-center/bookings"
              payload: { client_id: "${cl_ssp_id}", space_id: "${sp_mr_id}", event_name: "Regional Gem Show", event_class: "CONSUMER_SHOW", move_in_start_date: "2027-03-01", show_start_date: "2027-03-02", show_end_date: "2027-03-04", move_out_end_date: "2027-03-05" }
              as: SalesManager
              captures: { bk_id: $.data.id, bk_v1: $.data.version }
            - call: "POST /convention-center/bookings/${bk_id}/holds"
              payload: { expected_booking_version: "${bk_v1}" }
              as: SalesManager
              captures: { hold_id: $.data.id }
            - call: "POST /convention-center/holds/${hold_id}/confirm-first-option"
              payload: {}
              as: SalesManager
            - call: "POST /convention-center/bookings/${bk_id}/license"
              payload: {}
              as: SalesManager
              captures: { lic_id: $.data.id }
            - call: "POST /convention-center/licenses/${lic_id}/issue"
              payload: {}
              as: SalesManager
            - call: "POST /convention-center/licenses/${lic_id}/countersign"
              payload: {}
              as: Licensee
              as_user_id: "${cl_ssp_id}"
            - call: "POST /convention-center/bookings/${bk_id}/confirm-definite"
              payload: {}
              as: SalesManager
            - call: "POST /convention-center/_clock/set_current_utc"
              payload: { to_iso8601: "2027-03-01T08:00:00Z" }
              as: VenueAdmin
            - call: "POST /convention-center/bookings/${bk_id}/open-show"
              payload: {}
              as: EventServicesManager
            - call: "POST /convention-center/bookings/${bk_id}/usage-records"
              payload: { usage_date: "2027-03-01", usage_kind: "MOVE_IN" }
              as: EventServicesManager
              as_user_id: "esm-1"
          trigger:
            - call: "GET /convention-center/usage-records"
              payload: { booking_id: "${bk_id}" }
              as: SettlementAnalyst
          assert:
            - "the trigger returns 200 with exactly 1 row"
            - "the row carries booking_id, usage_date 2027-03-01, usage_kind MOVE_IN and recorded_by_user_id esm-1"
            - "the row exposes no version field"
            - "the §1.5 endpoint table declares no PATCH, PUT or DELETE whose path contains usage-records"

      - name: child_space_creation_with_an_unknown_parent_space_id_not_found
        claim_type: parent_relationships
        grounds:
          - entities.SpaceUnit.fields.parent_space_id
          - errors[ERR_SPACE_NOT_FOUND]
          - endpoints[POST /convention-center/spaces]
        distinguishing_aspect: |
          The self-referential parent link is a foreign key like any other, so naming a
          missing parent is a 404 rather than a 400 shape error, and no orphan root
          space may be created as a fallback.
        test_recipe:
          setup:
            - "Hall A exists"
          setup_api_calls:
            - call: "POST /convention-center/spaces"
              payload: { name: "Hall A", space_class: "HALL", rentable_sqft: 200000, daily_base_rate_cents: 4800000, rigging_capable: true }
              as: VenueAdmin
          trigger:
            - call: "POST /convention-center/spaces"
              payload: { name: "Hall A9", space_class: "HALL", rentable_sqft: 50000, daily_base_rate_cents: 1200000, parent_space_id: "00000000-0000-4000-8000-000000000000" }
              as: VenueAdmin
          assert:
            - "the trigger returns 404 with data.error_id == ERR_SPACE_NOT_FOUND"
            - "GET /convention-center/spaces returns total_count == 1"

      - name: service_order_junction_links_many_bookings_to_many_vendors
        claim_type: graph_topology
        grounds:
          - entities.ServiceOrder
          - endpoints[GET /convention-center/service-orders]
          - complexity_profile.entity_topology
        distinguishing_aspect: |
          ServiceOrder is the many-to-many junction between EventBooking and Vendor, so
          both projections must be reachable: one booking carrying orders against two
          different vendors, and one vendor carrying orders on two different bookings.
          A one-to-many model keyed only on booking_id fails the vendor_id projection.
        test_recipe:
          setup:
            - "SparkleClean is the EXCLUSIVE CLEANING vendor and Volt Open Utilities is an OPEN UTILITIES vendor; no EXCLUSIVE UTILITIES vendor exists"
            - "two CONSUMER_SHOW bookings exist, one on Ballroom B and one on Ballroom C, both with order_posture OPEN"
          setup_api_calls:
            - call: "POST /convention-center/policy-windows"
              payload: { event_class: "CONSUMER_SHOW", priority_rank: 3, open_months_before: 18, close_months_before: 2, max_holds_per_booking: 2, challenge_response_hours: 48, rental_discount_pct: 0.0, max_challenge_rounds: 1 }
              as: VenueAdmin
            - call: "POST /convention-center/spaces"
              payload: { name: "Ballroom B", space_class: "BALLROOM", rentable_sqft: 40000, daily_base_rate_cents: 1200000 }
              as: VenueAdmin
              captures: { sp_bb_id: $.data.id }
