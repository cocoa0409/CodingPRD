    side_effects: ["status -> CANCELLED and cancel_reason stored", "every loaded module unloaded: shipment_id = null, site_status LOADED -> AT_FACTORY", "loaded_module_count = 0, max_envelope_class = STANDARD, route_survey_state = NOT_REQUIRED, escort_required = false, permit_fee_cents = 0, permit_expires_at = null", "re-derives project.phase", "increments Shipment.version, each ModuleUnit.version and Project.version by 1"]

