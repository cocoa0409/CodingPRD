            - "call 9: 200 — the same normalize the admin was refused succeeds for RebateAnalyst"
            - "the seven refusals mutated nothing: RateCard.${card_id} was still PROPOSED before call 8, batch ${b1_id} stayed RECEIVED with line_count == 0, Member.${m1_id} stayed PENDING, the clock is still 2026-08-01T09:00:00Z, and GET /manufacturer-claims returns total_count == 0"

      - name: member_operator_cannot_act_outside_its_own_member_id
        claim_type: unauthorized_role
        grounds:
          - validations[priority=5]
          - roles.MemberOperator.identity
          - errors.ERR_MEMBER_SCOPE_VIOLATION
        distinguishing_aspect: |
          MemberOperator is entity_backed, so its X-User-ID IS a Member id and the
          scope rule reaches the owning member through three different paths: the
          {member_id} path segment, letter.member_id, and dispute ->
          accrual.member_id. The rule is conditioned on the ROLE, so the same
