              as: PlatformAdmin
              captures: { cust_id: "$.data.id" }
            - call: "POST /subscriptions"
              payload: { customer_id: "${cust_id}", plan_id: "${plan_id}", size: "ORIGINAL", start_date: "2026-03-01T00:00:00Z" }
              as: PlatformAdmin
              captures: { sub_id: "$.data.id" }
            - call: "GET /subscriptions/${sub_id}/shipments"
              as: PlatformAdmin
              captures: { sh0_id: "$.data[0].id" }
          trigger:
            - call: "POST /shipments/${sh0_id}/source"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
              captures: { err: "$.data.error_id" }
          assert:
            - "error_id == ERR_UNAUTHORIZED"

      - name: corner_rbac_customer_cannot_create_plan
        claim_type: peer_roles
        grounds: [roles.PlatformAdmin, "errors[ERR_UNAUTHORIZED]"]
        distinguishing_aspect: "Customer calling POST /plans (PlatformAdmin-exclusive) returns ERR_UNAUTHORIZED."
        test_recipe:
          setup: ["A customer exists to supply a valid acting id."]
          setup_api_calls:
            - call: "POST /customers"
              payload: { email: "rb3@x.com", full_name: "R B Three" }
              as: PlatformAdmin
              captures: { cust_id: "$.data.id" }
          trigger:
            - call: "POST /plans"
              payload: { name: "Sneaky", cadence: "WEEKLY", base_fee_cents: 5000 }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { err: "$.data.error_id" }
          assert:
            - "error_id == ERR_UNAUTHORIZED"

  # =================================================================
  # Cross-Cutting Complexity Layers
  # =================================================================
  - section: cross_cutting
    instances:
      - name: corner_occ_stale_version_change_rejected
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[change-stale-subscription]", "errors[ERR_STALE_VERSION]"]
        distinguishing_aspect: "After one change bumps version 1->2, a second change carrying the original (stale) version returns ERR_STALE_VERSION (412)."
        test_recipe:
          setup: ["A fresh subscription; version 1 captured before any change."]
          setup_api_calls:
            - call: "POST /plans"
              payload: { name: "Weekly Classic", cadence: "WEEKLY", base_fee_cents: 6000 }
              as: PlatformAdmin
              captures: { plan_id: "$.data.id" }
            - call: "POST /customers"
              payload: { email: "occ@x.com", full_name: "O C C" }
              as: PlatformAdmin
              captures: { cust_id: "$.data.id" }
            - call: "POST /subscriptions"
              payload: { customer_id: "${cust_id}", plan_id: "${plan_id}", size: "ORIGINAL", start_date: "2026-03-01T00:00:00Z" }
              as: PlatformAdmin
              captures: { sub_id: "$.data.id" }
            - call: "GET /subscriptions/${sub_id}"
              as: Customer
              as_user_id: "${cust_id}"
              captures: { v0: "$.data.version" }
            - call: "POST /subscriptions/${sub_id}/change"
              payload: { size: "DELUXE", expected_subscription_version: "${v0}" }
              as: Customer
              as_user_id: "${cust_id}"
          trigger:
            - call: "POST /subscriptions/${sub_id}/change"
              payload: { size: "GRAND", expected_subscription_version: "${v0}" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { err: "$.data.error_id" }
          assert:
            - "error_id == ERR_STALE_VERSION (expected_subscription_version ${v0} is stale after the first change bumped it)"

      - name: corner_occ_correct_version_change_succeeds
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[change-stale-subscription]", entities.Subscription.fields.renewal_price_cents]
        distinguishing_aspect: "A change carrying the current version succeeds and increments Subscription.version from 1 to 2."
        test_recipe:
          setup: ["A fresh subscription; version 1 captured."]
          setup_api_calls:
            - call: "POST /plans"
              payload: { name: "Weekly Classic", cadence: "WEEKLY", base_fee_cents: 6000 }
              as: PlatformAdmin
              captures: { plan_id: "$.data.id" }
            - call: "POST /customers"
              payload: { email: "occ2@x.com", full_name: "O C 2" }
              as: PlatformAdmin
              captures: { cust_id: "$.data.id" }
            - call: "POST /subscriptions"
              payload: { customer_id: "${cust_id}", plan_id: "${plan_id}", size: "ORIGINAL", start_date: "2026-03-01T00:00:00Z" }
              as: PlatformAdmin
              captures: { sub_id: "$.data.id" }
            - call: "GET /subscriptions/${sub_id}"
              as: Customer
              as_user_id: "${cust_id}"
              captures: { v0: "$.data.version" }
          trigger:
            - call: "POST /subscriptions/${sub_id}/change"
              payload: { size: "DELUXE", expected_subscription_version: "${v0}" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { nv: "$.data.version", price: "$.data.renewal_price_cents" }
          assert:
            - "change succeeds; Subscription.${sub_id}.version == 2 (was 1)"
            - "Subscription.${sub_id}.renewal_price_cents == 7500 (DELUXE recomputed)"

      - name: corner_cascade_cancel_depth3
        claim_type: cascading_side_effects
        grounds: [state_machines.Subscription.lifecycle=ACTIVE_to_lifecycle=CANCELLED]
        excluded_because:
          difficulty_instance: cancel_subscription_cascade_to_lot_depth3
          rationale: "The 3-level cancel cascade is the named §1.8 instance."

      - name: corner_scheduled_deliveries_created_on_subscribe
        claim_type: scheduled_actions
        grounds: [entities.Shipment.fields.scheduled_delivery_date, entities.Shipment.fields.cycle_index]
        distinguishing_aspect: "Creating a WEEKLY subscription schedules 4 cycle-1 shipments at start+2d then weekly (2026-03-03, -10, -17, -24)."
        test_recipe:
          setup: ["Fresh WEEKLY subscription starting 2026-03-01."]
          setup_api_calls:
            - call: "POST /plans"
              payload: { name: "Weekly Classic", cadence: "WEEKLY", base_fee_cents: 6000 }
              as: PlatformAdmin
              captures: { plan_id: "$.data.id" }
            - call: "POST /customers"
              payload: { email: "sch@x.com", full_name: "S C H" }
              as: PlatformAdmin
              captures: { cust_id: "$.data.id" }
            - call: "POST /subscriptions"
              payload: { customer_id: "${cust_id}", plan_id: "${plan_id}", size: "ORIGINAL", start_date: "2026-03-01T00:00:00Z" }
              as: PlatformAdmin
              captures: { sub_id: "$.data.id" }
          trigger:
            - call: "GET /subscriptions/${sub_id}/shipments"
              as: PlatformAdmin
              captures: { d0: "$.data[0].scheduled_delivery_date", d1: "$.data[1].scheduled_delivery_date" }
          assert:
            - "exactly 4 SCHEDULED cycle-1 shipments exist"
            - "Shipment[0].scheduled_delivery_date == 2026-03-03T00:00:00Z and Shipment[1] == 2026-03-10T00:00:00Z"

  # =================================================================
  # Consistency Model
  # =================================================================
  - section: consistency_model
    instances:
      - name: corner_immediate_renewal_price_visible
        claim_type: immediate
        grounds: [entities.Subscription.fields.renewal_price_cents]
        distinguishing_aspect: "renewal_price_cents computed at create is immediately visible in the same response and on a follow-up GET."
        test_recipe:
          setup: ["A plan and customer exist."]
          setup_api_calls:
            - call: "POST /plans"
              payload: { name: "Weekly Classic", cadence: "WEEKLY", base_fee_cents: 6000 }
              as: PlatformAdmin
              captures: { plan_id: "$.data.id" }
            - call: "POST /customers"
              payload: { email: "imm@x.com", full_name: "I M M" }
              as: PlatformAdmin
              captures: { cust_id: "$.data.id" }
          trigger:
            - call: "POST /subscriptions"
              payload: { customer_id: "${cust_id}", plan_id: "${plan_id}", size: "GRAND", vase_addon: true, start_date: "2026-03-01T00:00:00Z" }
              as: PlatformAdmin
              captures: { sub_id: "$.data.id", price_create: "$.data.renewal_price_cents" }
            - call: "GET /subscriptions/${sub_id}"
              as: PlatformAdmin
              captures: { price_get: "$.data.renewal_price_cents" }
          assert:
            - "create response renewal_price_cents == 10200 (6000 + GRAND 3000 + vase 1200, no discount) equals the follow-up GET value"
