              as: SchedulingCoordinator
              captures: { h1: "$.data.id", h1_v: "$.data.version" }
            - call: "POST /hearings"
              payload: { courthouse_id: "${ch_main}", language_id: "${lang_spa}", case_number: "CR-2026-1402", hearing_type: "MOTION", in_custody: false, scheduled_start: "2026-08-25T09:30:00.000Z", scheduled_end: "2026-08-25T10:30:00.000Z", requested_delivery_mode: "IN_PERSON" }
              as: SchedulingCoordinator
              captures: { h2: "$.data.id", h2_v: "$.data.version" }
            - call: "POST /hearings"
              payload: { courthouse_id: "${ch_main}", language_id: "${lang_spa}", case_number: "CR-2026-1403", hearing_type: "MOTION", in_custody: false, scheduled_start: "2026-08-25T10:00:00.000Z", scheduled_end: "2026-08-25T11:00:00.000Z", requested_delivery_mode: "IN_PERSON" }
              as: SchedulingCoordinator
