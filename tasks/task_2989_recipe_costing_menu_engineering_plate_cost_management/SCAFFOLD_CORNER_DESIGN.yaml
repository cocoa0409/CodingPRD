              payload: { menu_item_id: "${mi_id}", window_start: "2026-10-01T00:00:00.000Z", window_end: "2026-10-15T00:00:00.000Z", promo_price_cents: 380, forecast_units: 500, expected_menu_item_version: "${mi_v3}" }
