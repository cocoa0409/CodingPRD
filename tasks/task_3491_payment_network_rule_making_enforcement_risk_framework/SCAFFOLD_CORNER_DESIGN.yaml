              as: ParticipantOfficer
              as_user_id: "${p1}"
              captures: { e2: $.data.id }
            - call: "POST /network/payment-entries"
              payload: { originator_id: "${o1}", transaction_code_id: "${tc_ppd}", amount_cents: 1000, receiver_account_number_hash: "cap-3", receiver_name: "R", authorization_type: "NONE", same_day: true, settlement_window_id: "${w1}" }
              as: ParticipantOfficer
              as_user_id: "${p1}"
              captures: { err: $.data.error_id }
          assert:
            - "entries ${e1} and ${e2} are created (aggregate reaches exactly the 2500000000 cap — equality allowed)"
            - "the third entry fails 422 with ERR_WINDOW_CAPACITY_EXCEEDED (2500000000 + 1000 > cap)"

      - name: web_entry_with_valid_validation_passes
        claim_type: satisfaction_passes
        grounds:
          - validations[priority=10]
          - entities.AccountValidation.fields.method
        distinguishing_aspect: "A WEB debit to an account hash with a VALID MICRO_DEPOSIT validation, authorized ORAL_RECORDED as the code requires, is admitted 201 — the safety gate opens on the exact (originator, account hash) pair."
        test_recipe:
          setup: ["P1 ACTIVE; O1 APPROVED; WEB code; W1; AccountValidation (MICRO_DEPOSIT) recorded for acct-web-1 on 2026-09-01."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T09:00:00Z" }
              as: PlatformAdmin
            - call: "POST /network/participants"
              payload: { legal_name: "Bank One", participant_type: "ODFI", routing_number: "111000025" }
              as: PlatformAdmin
              captures: { p1: $.data.id }
            - call: "POST /network/participants/${p1}/transition"
              payload: { to_state: "ACTIVE" }
              as: PlatformAdmin
            - call: "POST /network/transaction-codes"
