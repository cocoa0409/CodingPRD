              payload: { operator_id: "${op}", name: "P1", address: "19 Q St" }
              as: TaxAdmin
              captures: { prop: $.data.id }
            - call: "POST /returns"
              payload: { operator_id: "${op}", period_start: "2026-04-01T00:00:00Z", period_end: "2026-04-30T00:00:00Z", line_items: [ { property_id: "${prop}", gross_receipts_cents: 1000000 } ] }
              as: TaxAdmin
              captures: { ret: $.data.id }
            - call: "POST /returns/${ret}/file"
              payload: {}
              as: Operator
              as_user_id: "${op}"
            - call: "POST /remittances"
              payload: { tax_return_id: "${ret}", remitter: "OPERATOR", amount_cents: 120000 }
              as: TaxAdmin
              captures: { rem: $.data.id }
            - call: "POST /remittances/${rem}/clear"
              payload: {}
              as: TaxAdmin
          trigger:
            - call: "POST /remittances/${rem}/reverse"
              payload: {}
              as: TaxAdmin
          assert:
            - "Operator.${op}.account_balance_cents == 120000"
            - "Remittance.${rem}.status == REVERSED"
            - "TaxReturn.${ret}.settlement_status == UNPAID"

      - name: receipts_partition_on_exemption_reject
        grounds:
          - state_machines.ExemptionClaim.VERIFIED_to_REJECTED
          - entities.TaxReturn.fields.taxable_receipts_cents
          - entities.TaxReturn.fields.exempt_receipts_cents
        distinguishing_aspect: >
          Conserved receipts partition: gross_receipts_cents == taxable_receipts_cents +
          exempt_receipts_cents. Rejecting a VERIFIED 300,000 exemption moves it from exempt to
          taxable (700,000->1,000,000 taxable, 300,000->0 exempt) leaving gross 1,000,000 unchanged.
        test_recipe:
          setup:
            - "Active operator; DRAFT return period 2026-04 gross 1,000,000; GOV exemption 300,000 VERIFIED; return FILED (taxable 700,000, exempt 300,000, tax 84,000)"
          setup_api_calls:
