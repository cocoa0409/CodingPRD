        distinguishing_aspect: |
          Empty-set boundary: an AuditBundle whose window contains ZERO
          records must have required_record_count == 0; closing it with
          produced_record_count == 0 must SUCCEED. A different metric
          (count of records, not a timestamp threshold) reachable through
          a different endpoint (close, not validate).
