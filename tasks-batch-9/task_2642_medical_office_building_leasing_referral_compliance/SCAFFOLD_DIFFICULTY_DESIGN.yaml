      - name: daily_close_delinquency_cascades_to_watch_case_concession_lock_and_booking_cancellation
        grounds:
          - state_machines.RentInvoice[ISSUED -> DELINQUENT]
          - calculations.rent_arrears_aging
          - calculations.referral_compliance_risk_score
          - entities.Tenant.fields.compliance_watch_status
          - entities.Lease.fields.rent_concession_locked
          - entities.SharedSpaceBooking.fields.cancellation_source
          - endpoints[POST /_ops/run-daily-close]
        distinguishing_aspect: |
          DEPTH 3 rooted at a different triggering transition — the system
          ISSUED -> DELINQUENT close, not a lease termination. Each link is
          strictly caused by the previous one: 63 days past due assigns tier
          weight 50 (hop 1); only that weight lifts the rolling score to 50
          (hop 2); only a rolling score at or above 45 raises WATCH, which is
          what opens the RENT_DELINQUENCY case and, in the same hop, locks the
          lease's concessions, revokes after-hours access and cancels the
          tenant's future waiting-room booking with cancellation_source
          COMPLIANCE_CASCADE (hop 3). A tenant whose invoice is only 10 days
          late never reaches any of it.
        setup_note: "The booking must be created while the tenant is still CLEAR, because priority 21 refuses new bookings for a tenant on watch."
