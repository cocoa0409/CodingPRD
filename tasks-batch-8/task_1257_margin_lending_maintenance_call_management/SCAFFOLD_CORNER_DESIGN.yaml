scaffold_corner_design:
  # ==========================================================================
  # Section: entities
  # ==========================================================================
  - section: entities
    instances:
      - name: customer_creation_returns_201_and_stored_fields
        claim_type: creation
        grounds:
          - 'endpoints.POST /margin/customers'
          - 'entities.Customer'
        distinguishing_aspect: "POST with all required fields returns 201 and echoes legal_name/email with system id/version 1."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "POST /margin/customers", payload: { legal_name: "Gra Ce", email: "grace@example.com" }, as: MarginAnalyst, captures: { c_id: $.data.id, v: $.data.version } }
          assert:
            - "response code == 201"
            - "Customer.${c_id}.legal_name == 'Gra Ce' and version == 1"

      - name: customer_get_not_found_returns_404
        claim_type: not_found
        grounds:
          - 'endpoints.GET /margin/customers/{id}'
          - 'errors[ERR_CUSTOMER_NOT_FOUND"]'
        distinguishing_aspect: "GET with a well-formed but absent customer id returns ERR_CUSTOMER_NOT_FOUND 404."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "GET /margin/customers/00000000-0000-0000-0000-000000000000", payload: {}, as: MarginSupervisor, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_CUSTOMER_NOT_FOUND and http == 404"

      - name: account_computed_fields_ignore_client_input
        claim_type: computed_fields
        grounds:
          - 'entities.MarginAccount.fields.equity_realtime_cents'
          - 'entities.MarginAccount.fields.cash_balance_cents'
        distinguishing_aspect: "MarginAccount is never directly writable: cash/equity/requirements are system-computed; the only account write endpoints are close/cash-movements/orders."
        test_recipe:
          setup: ["approved account via standard chain, no deposits"]
          setup_api_calls:
            - { call: "POST /margin/customers", payload: { legal_name: "Com Puted", email: "computed@example.com" }, as: MarginAnalyst, captures: { c_id: $.data.id } }
            - { call: "POST /margin/account-applications", payload: { customer_id: "${c_id}", annual_income_cents: 15000000, liquid_net_worth_cents: 50000000, investment_experience_years: 5 }, as: Customer, as_user_id: "${c_id}", captures: { app_id: $.data.id } }
            - { call: "POST /margin/account-applications/${app_id}/review", payload: {}, as: MarginAnalyst, as_user_id: "analyst-1" }
            - { call: "POST /margin/account-applications/${app_id}/approve", payload: {}, as: MarginSupervisor, as_user_id: "sup-1", captures: { acct_id: $.data.account_id } }
          trigger:
            - { call: "GET /margin/accounts/${acct_id}", payload: {}, as: MarginSupervisor, captures: { cash: $.data.cash_balance_cents, eqr: $.data.equity_realtime_cents, eqo: $.data.equity_official_cents, st: $.data.account_status, pdt: $.data.pdt_flag } }
          assert:
            - "cash_balance_cents == 0 and equity_realtime_cents == 0 and equity_official_cents == 0"
            - "account_status == ACTIVE and pdt_flag == false"

      - name: immutable_price_mark_has_no_update_endpoint
        claim_type: immutability
        grounds:
          - 'entities.PriceMark'
        distinguishing_aspect: "PriceMark (common_fields false) exposes only POST/GET; no PUT/PATCH/DELETE exists for it in 1.5."
        test_recipe:
          setup: ["one security with one mark"]
          setup_api_calls:
            - { call: "POST /margin/security-profiles", payload: { symbol: "ABC", marginable: true, house_maint_long_bps: 3000, house_maint_short_bps: 3500, liquidity_tier: 1, concentration_threshold_bps: 6000 }, as: MarginSupervisor, captures: { sec_abc: $.data.id } }
            - { call: "POST /margin/market-marks", payload: { security_id: "${sec_abc}", mark_type: "REALTIME", price_cents: 10000 }, as: MarketDataOps, captures: { mark_id: $.data.id } }
          trigger:
            - { call: "GET /margin/market-marks/${mark_id}", payload: {}, as: MarketDataOps, captures: { px: $.data.price_cents } }
          assert:
            - "mark readable with price_cents == 10000; entity carries no updated_at/version semantics (append-only log)"

      - name: pagination_defaults_on_list_endpoint
        claim_type: listing
        grounds:
          - 'endpoints.GET /margin/security-profiles'
          - 'response_envelope'
        distinguishing_aspect: "List endpoint honors pagination envelope: default limit 10, has_more/total_count present."
        test_recipe:
          setup: ["two security profiles"]
          setup_api_calls:
            - { call: "POST /margin/security-profiles", payload: { symbol: "AAA", marginable: true, house_maint_long_bps: 3000, house_maint_short_bps: 3500, liquidity_tier: 1, concentration_threshold_bps: 6000 }, as: MarginSupervisor }
            - { call: "POST /margin/security-profiles", payload: { symbol: "BBB", marginable: true, house_maint_long_bps: 3000, house_maint_short_bps: 3500, liquidity_tier: 2, concentration_threshold_bps: 6000 }, as: MarginSupervisor }
          trigger:
            - { call: "GET /margin/security-profiles?limit=1&offset=0", payload: {}, as: MarginSupervisor, captures: { first: "$.data[0].id" } }
          assert:
            - "response carries pagination fields; with limit=1 exactly 1 row returned, has_more == true, total_count == 2"

  # ==========================================================================
  # Section: state_machines
  # ==========================================================================
  - section: state_machines
    instances:
      - name: approve_from_submitted_returns_invalid_state
        claim_type: invalid_transition
        grounds:
          - 'state_machines.AccountApplication.COMPLIANCE_REVIEW_to_APPROVED'
          - 'errors[ERR_APPLICATION_INVALID_STATE"]'
        distinguishing_aspect: "Approve without prior review is rejected: SUBMITTED is not a from-state of approve."
        test_recipe:
          setup: ["application freshly SUBMITTED"]
          setup_api_calls:
            - { call: "POST /margin/customers", payload: { legal_name: "Skip Step", email: "skip@example.com" }, as: MarginAnalyst, captures: { c_id: $.data.id } }
            - { call: "POST /margin/account-applications", payload: { customer_id: "${c_id}", annual_income_cents: 15000000, liquid_net_worth_cents: 50000000, investment_experience_years: 5 }, as: Customer, as_user_id: "${c_id}", captures: { app_id: $.data.id } }
          trigger:
            - { call: "POST /margin/account-applications/${app_id}/approve", payload: {}, as: MarginSupervisor, as_user_id: "sup-1", captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_APPLICATION_INVALID_STATE and http == 409"

      - name: waive_from_cured_returns_invalid_state
        claim_type: invalid_transition
        grounds:
          - 'state_machines.MarginCall.OPEN_to_WAIVED'
          - 'errors[ERR_CALL_NOT_OPEN"]'
        distinguishing_aspect: "Waiving an already-terminal (CURED) call is rejected; terminal lockdown."
        test_recipe:
          setup:
            - "Account with HOUSE call 300000 cured by deposit of 300000 (equity back to non-deficient)"
          setup_api_calls:
            - { call: "POST /margin/customers", payload: { legal_name: "Term Inal", email: "term@example.com" }, as: MarginAnalyst, captures: { c_id: $.data.id } }
            - { call: "POST /margin/security-profiles", payload: { symbol: "ABC", marginable: true, house_maint_long_bps: 3000, house_maint_short_bps: 3500, liquidity_tier: 1, concentration_threshold_bps: 6000 }, as: MarginSupervisor, captures: { sec_abc: $.data.id } }
            - { call: "POST /margin/market-marks", payload: { security_id: "${sec_abc}", mark_type: "REALTIME", price_cents: 10000 }, as: MarketDataOps }
            - { call: "POST /margin/market-marks", payload: { security_id: "${sec_abc}", mark_type: "OFFICIAL_CLOSE", price_cents: 10000 }, as: MarketDataOps }
            - { call: "POST /margin/account-applications", payload: { customer_id: "${c_id}", annual_income_cents: 15000000, liquid_net_worth_cents: 50000000, investment_experience_years: 5 }, as: Customer, as_user_id: "${c_id}", captures: { app_id: $.data.id } }
            - { call: "POST /margin/account-applications/${app_id}/review", payload: {}, as: MarginAnalyst, as_user_id: "analyst-1" }
            - { call: "POST /margin/account-applications/${app_id}/approve", payload: {}, as: MarginSupervisor, as_user_id: "sup-1", captures: { acct_id: $.data.account_id } }
            - { call: "GET /margin/accounts/${acct_id}", payload: {}, as: MarginSupervisor, captures: { v0: $.data.version } }
            - { call: "POST /margin/accounts/${acct_id}/cash-movements", payload: { movement_type: "DEPOSIT", amount_cents: 1000000, expected_account_version: "${v0}" }, as: Customer, as_user_id: "${c_id}" }
            - { call: "POST /margin/accounts/${acct_id}/orders", payload: { security_id: "${sec_abc}", side: "BUY", quantity: 200 }, as: Customer, as_user_id: "${c_id}" }
            - { call: "POST /margin/market-marks", payload: { security_id: "${sec_abc}", mark_type: "OFFICIAL_CLOSE", price_cents: 7000 }, as: MarketDataOps }
            - { call: "GET /margin/accounts/${acct_id}/margin-calls", payload: {}, as: MarginSupervisor, captures: { call_id: "$.data[0].id" } }
            - { call: "GET /margin/accounts/${acct_id}", payload: {}, as: MarginSupervisor, captures: { v1: $.data.version } }
            - { call: "POST /margin/accounts/${acct_id}/cash-movements", payload: { movement_type: "DEPOSIT", amount_cents: 300000, expected_account_version: "${v1}" }, as: Customer, as_user_id: "${c_id}" }
          trigger:
            - { call: "POST /margin/margin-calls/${call_id}/waive", payload: {}, as: MarginSupervisor, as_user_id: "sup-1", captures: { err: $.data.error_id } }
          assert:
            - "deposit cascade cured the call: MarginCall.${call_id}.call_status == CURED with cure_method == DEPOSIT"
            - "waive on CURED: error_id == ERR_CALL_NOT_OPEN"

      - name: fill_on_cancelled_order_returns_invalid_state
        claim_type: invalid_transition
        grounds:
          - 'state_machines.LiquidationOrder.PENDING_to_CANCELLED'
          - 'errors[ERR_LIQUIDATION_INVALID_STATE"]'
        distinguishing_aspect: "Fill after cancel hits terminal lockdown ERR_LIQUIDATION_INVALID_STATE."
        test_recipe:
          setup: ["EXPIRED HOUSE call; liquidation order created then cancelled"]
          setup_api_calls:
            - { call: "POST /margin/customers", payload: { legal_name: "Loc Kdown", email: "lock@example.com" }, as: MarginAnalyst, captures: { c_id: $.data.id } }
            - { call: "POST /margin/security-profiles", payload: { symbol: "ABC", marginable: true, house_maint_long_bps: 3000, house_maint_short_bps: 3500, liquidity_tier: 1, concentration_threshold_bps: 6000 }, as: MarginSupervisor, captures: { sec_abc: $.data.id } }
            - { call: "POST /margin/market-marks", payload: { security_id: "${sec_abc}", mark_type: "REALTIME", price_cents: 10000 }, as: MarketDataOps }
            - { call: "POST /margin/market-marks", payload: { security_id: "${sec_abc}", mark_type: "OFFICIAL_CLOSE", price_cents: 10000 }, as: MarketDataOps }
            - { call: "POST /margin/account-applications", payload: { customer_id: "${c_id}", annual_income_cents: 15000000, liquid_net_worth_cents: 50000000, investment_experience_years: 5 }, as: Customer, as_user_id: "${c_id}", captures: { app_id: $.data.id } }
            - { call: "POST /margin/account-applications/${app_id}/review", payload: {}, as: MarginAnalyst, as_user_id: "analyst-1" }
            - { call: "POST /margin/account-applications/${app_id}/approve", payload: {}, as: MarginSupervisor, as_user_id: "sup-1", captures: { acct_id: $.data.account_id } }
            - { call: "GET /margin/accounts/${acct_id}", payload: {}, as: MarginSupervisor, captures: { v0: $.data.version } }
            - { call: "POST /margin/accounts/${acct_id}/cash-movements", payload: { movement_type: "DEPOSIT", amount_cents: 1000000, expected_account_version: "${v0}" }, as: Customer, as_user_id: "${c_id}" }
            - { call: "POST /margin/accounts/${acct_id}/orders", payload: { security_id: "${sec_abc}", side: "BUY", quantity: 200 }, as: Customer, as_user_id: "${c_id}" }
            - { call: "POST /margin/market-marks", payload: { security_id: "${sec_abc}", mark_type: "OFFICIAL_CLOSE", price_cents: 7000 }, as: MarketDataOps }
            - { call: "GET /margin/accounts/${acct_id}/margin-calls", payload: {}, as: MarginSupervisor, captures: { call_id: "$.data[0].id" } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-03T00:00:01Z" }, as: MarketDataOps }
            - { call: "POST /_sweeps/daily", payload: {}, as: MarketDataOps }
            - { call: "GET /margin/accounts/${acct_id}", payload: {}, as: MarginSupervisor, captures: { v1: $.data.version } }
            - { call: "POST /margin/accounts/${acct_id}/liquidation-orders", payload: { call_id: "${call_id}", expected_account_version: "${v1}" }, as: LiquidationDesk, as_user_id: "desk-1", captures: { lo_id: $.data.id } }
            - { call: "POST /margin/liquidation-orders/${lo_id}/cancel", payload: {}, as: LiquidationDesk, as_user_id: "desk-1" }
          trigger:
            - { call: "POST /margin/liquidation-orders/${lo_id}/fill", payload: { filled_quantity: 200, fill_price_cents: 7000 }, as: LiquidationDesk, as_user_id: "desk-2", captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_LIQUIDATION_INVALID_STATE and http == 409"

      - name: dispute_initial_state_is_open_and_call_flips_disputed
        claim_type: initial_state
        grounds:
          - 'state_machines.Dispute'
          - 'state_machines.MarginCall.OPEN_to_DISPUTED'
        distinguishing_aspect: "New dispute starts OPEN; linked call moves OPEN -> DISPUTED atomically at creation."
        test_recipe:
          setup: ["OPEN HOUSE call on account"]
          setup_api_calls:
            - { call: "POST /margin/customers", payload: { legal_name: "Ini Tial", email: "init@example.com" }, as: MarginAnalyst, captures: { c_id: $.data.id } }
            - { call: "POST /margin/security-profiles", payload: { symbol: "ABC", marginable: true, house_maint_long_bps: 3000, house_maint_short_bps: 3500, liquidity_tier: 1, concentration_threshold_bps: 6000 }, as: MarginSupervisor, captures: { sec_abc: $.data.id } }
            - { call: "POST /margin/market-marks", payload: { security_id: "${sec_abc}", mark_type: "REALTIME", price_cents: 10000 }, as: MarketDataOps }
            - { call: "POST /margin/market-marks", payload: { security_id: "${sec_abc}", mark_type: "OFFICIAL_CLOSE", price_cents: 10000 }, as: MarketDataOps }
            - { call: "POST /margin/account-applications", payload: { customer_id: "${c_id}", annual_income_cents: 15000000, liquid_net_worth_cents: 50000000, investment_experience_years: 5 }, as: Customer, as_user_id: "${c_id}", captures: { app_id: $.data.id } }
            - { call: "POST /margin/account-applications/${app_id}/review", payload: {}, as: MarginAnalyst, as_user_id: "analyst-1" }
            - { call: "POST /margin/account-applications/${app_id}/approve", payload: {}, as: MarginSupervisor, as_user_id: "sup-1", captures: { acct_id: $.data.account_id } }
            - { call: "GET /margin/accounts/${acct_id}", payload: {}, as: MarginSupervisor, captures: { v0: $.data.version } }
            - { call: "POST /margin/accounts/${acct_id}/cash-movements", payload: { movement_type: "DEPOSIT", amount_cents: 1000000, expected_account_version: "${v0}" }, as: Customer, as_user_id: "${c_id}" }
            - { call: "POST /margin/accounts/${acct_id}/orders", payload: { security_id: "${sec_abc}", side: "BUY", quantity: 200 }, as: Customer, as_user_id: "${c_id}" }
            - { call: "POST /margin/market-marks", payload: { security_id: "${sec_abc}", mark_type: "OFFICIAL_CLOSE", price_cents: 7000 }, as: MarketDataOps }
            - { call: "GET /margin/accounts/${acct_id}/margin-calls", payload: {}, as: MarginSupervisor, captures: { call_id: "$.data[0].id" } }
          trigger:
            - { call: "POST /margin/disputes", payload: { call_id: "${call_id}", reason: "Dispute the mark" }, as: Customer, as_user_id: "${c_id}", captures: { dsp_id: $.data.id, dst: $.data.dispute_status } }
            - { call: "GET /margin/margin-calls/${call_id}", payload: {}, as: MarginSupervisor, captures: { cst: $.data.call_status } }
          assert:
            - "Dispute.${dsp_id}.dispute_status == OPEN"
            - "MarginCall.${call_id}.call_status == DISPUTED"

      - name: disputed_call_does_not_expire_at_sweep
        claim_type: precondition_enforcement
        grounds:
          - 'state_machines.MarginCall.OPEN_to_EXPIRED'
          - 'state_machines.MarginCall.OPEN_to_DISPUTED'
        distinguishing_aspect: "Sweep past due_at expires OPEN calls but leaves DISPUTED calls untouched (deadline paused while disputed)."
        test_recipe:
          setup: ["HOUSE call (48h) DISPUTED; clock advanced 72h past issuance"]
          setup_api_calls:
            - { call: "POST /margin/customers", payload: { legal_name: "Pau Sed", email: "paused@example.com" }, as: MarginAnalyst, captures: { c_id: $.data.id } }
            - { call: "POST /margin/security-profiles", payload: { symbol: "ABC", marginable: true, house_maint_long_bps: 3000, house_maint_short_bps: 3500, liquidity_tier: 1, concentration_threshold_bps: 6000 }, as: MarginSupervisor, captures: { sec_abc: $.data.id } }
            - { call: "POST /margin/market-marks", payload: { security_id: "${sec_abc}", mark_type: "REALTIME", price_cents: 10000 }, as: MarketDataOps }
            - { call: "POST /margin/market-marks", payload: { security_id: "${sec_abc}", mark_type: "OFFICIAL_CLOSE", price_cents: 10000 }, as: MarketDataOps }
            - { call: "POST /margin/account-applications", payload: { customer_id: "${c_id}", annual_income_cents: 15000000, liquid_net_worth_cents: 50000000, investment_experience_years: 5 }, as: Customer, as_user_id: "${c_id}", captures: { app_id: $.data.id } }
            - { call: "POST /margin/account-applications/${app_id}/review", payload: {}, as: MarginAnalyst, as_user_id: "analyst-1" }
            - { call: "POST /margin/account-applications/${app_id}/approve", payload: {}, as: MarginSupervisor, as_user_id: "sup-1", captures: { acct_id: $.data.account_id } }
            - { call: "GET /margin/accounts/${acct_id}", payload: {}, as: MarginSupervisor, captures: { v0: $.data.version } }
            - { call: "POST /margin/accounts/${acct_id}/cash-movements", payload: { movement_type: "DEPOSIT", amount_cents: 1000000, expected_account_version: "${v0}" }, as: Customer, as_user_id: "${c_id}" }
            - { call: "POST /margin/accounts/${acct_id}/orders", payload: { security_id: "${sec_abc}", side: "BUY", quantity: 200 }, as: Customer, as_user_id: "${c_id}" }
            - { call: "POST /margin/market-marks", payload: { security_id: "${sec_abc}", mark_type: "OFFICIAL_CLOSE", price_cents: 7000 }, as: MarketDataOps }
            - { call: "GET /margin/accounts/${acct_id}/margin-calls", payload: {}, as: MarginSupervisor, captures: { call_id: "$.data[0].id" } }
            - { call: "POST /margin/disputes", payload: { call_id: "${call_id}", reason: "Pause the clock" }, as: Customer, as_user_id: "${c_id}" }
          trigger:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-04T00:00:01Z" }, as: MarketDataOps }
            - { call: "POST /_sweeps/daily", payload: {}, as: MarketDataOps }
            - { call: "GET /margin/margin-calls/${call_id}", payload: {}, as: MarginSupervisor, captures: { cst: $.data.call_status } }
          assert:
            - "MarginCall.${call_id}.call_status == DISPUTED  # not EXPIRED despite clock > due_at"

      - name: account_close_blocked_with_open_positions
        claim_type: precondition_enforcement
        grounds:
          - 'state_machines.MarginAccount.ACTIVE_to_CLOSED'
          - 'errors[ERR_POSITIONS_EXIST"]'
        distinguishing_aspect: "Close with a non-zero position is rejected ERR_POSITIONS_EXIST."
        test_recipe:
          setup: ["account holding 100 ABC"]
          setup_api_calls:
            - { call: "POST /margin/customers", payload: { legal_name: "Clo Se", email: "close@example.com" }, as: MarginAnalyst, captures: { c_id: $.data.id } }
            - { call: "POST /margin/security-profiles", payload: { symbol: "ABC", marginable: true, house_maint_long_bps: 3000, house_maint_short_bps: 3500, liquidity_tier: 1, concentration_threshold_bps: 6000 }, as: MarginSupervisor, captures: { sec_abc: $.data.id } }
            - { call: "POST /margin/market-marks", payload: { security_id: "${sec_abc}", mark_type: "REALTIME", price_cents: 10000 }, as: MarketDataOps }
            - { call: "POST /margin/market-marks", payload: { security_id: "${sec_abc}", mark_type: "OFFICIAL_CLOSE", price_cents: 10000 }, as: MarketDataOps }
            - { call: "POST /margin/account-applications", payload: { customer_id: "${c_id}", annual_income_cents: 50000000, liquid_net_worth_cents: 90000000, investment_experience_years: 7 }, as: Customer, as_user_id: "${c_id}", captures: { app_id: $.data.id } }
            - { call: "POST /margin/account-applications/${app_id}/review", payload: {}, as: MarginAnalyst, as_user_id: "analyst-1" }
            - { call: "POST /margin/account-applications/${app_id}/approve", payload: {}, as: MarginSupervisor, as_user_id: "sup-1", captures: { acct_id: $.data.account_id } }
            - { call: "GET /margin/accounts/${acct_id}", payload: {}, as: MarginSupervisor, captures: { v0: $.data.version } }
            - { call: "POST /margin/accounts/${acct_id}/cash-movements", payload: { movement_type: "DEPOSIT", amount_cents: 1000000, expected_account_version: "${v0}" }, as: Customer, as_user_id: "${c_id}" }
            - { call: "POST /margin/accounts/${acct_id}/orders", payload: { security_id: "${sec_abc}", side: "BUY", quantity: 100 }, as: Customer, as_user_id: "${c_id}" }
          trigger:
            - { call: "POST /margin/accounts/${acct_id}/close", payload: {}, as: Customer, as_user_id: "${c_id}", captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_POSITIONS_EXIST and http == 409"

  # ==========================================================================
  # Section: calculations
  # ==========================================================================
  - section: calculations
    instances:
      - name: call_type_severity_prefers_maintenance_over_house
        claim_type: correct_result
        grounds:
          - 'calculations.call_amount'
        distinguishing_aspect: "Official mark 6000 makes reg excess -100000 AND house excess -400000; issued call is MAINTENANCE with amount max(100000, 400000) == 400000."
        test_recipe:
          setup: ["account with 200 ABC, deposit 1000000, official 10000; drop official to 6000"]
          setup_api_calls:
            - { call: "POST /margin/customers", payload: { legal_name: "Sev Erity", email: "sev@example.com" }, as: MarginAnalyst, captures: { c_id: $.data.id } }
            - { call: "POST /margin/security-profiles", payload: { symbol: "ABC", marginable: true, house_maint_long_bps: 3000, house_maint_short_bps: 3500, liquidity_tier: 1, concentration_threshold_bps: 6000 }, as: MarginSupervisor, captures: { sec_abc: $.data.id } }
            - { call: "POST /margin/market-marks", payload: { security_id: "${sec_abc}", mark_type: "REALTIME", price_cents: 10000 }, as: MarketDataOps }
            - { call: "POST /margin/market-marks", payload: { security_id: "${sec_abc}", mark_type: "OFFICIAL_CLOSE", price_cents: 10000 }, as: MarketDataOps }
            - { call: "POST /margin/account-applications", payload: { customer_id: "${c_id}", annual_income_cents: 15000000, liquid_net_worth_cents: 50000000, investment_experience_years: 5 }, as: Customer, as_user_id: "${c_id}", captures: { app_id: $.data.id } }
            - { call: "POST /margin/account-applications/${app_id}/review", payload: {}, as: MarginAnalyst, as_user_id: "analyst-1" }
            - { call: "POST /margin/account-applications/${app_id}/approve", payload: {}, as: MarginSupervisor, as_user_id: "sup-1", captures: { acct_id: $.data.account_id } }
            - { call: "GET /margin/accounts/${acct_id}", payload: {}, as: MarginSupervisor, captures: { v0: $.data.version } }
            - { call: "POST /margin/accounts/${acct_id}/cash-movements", payload: { movement_type: "DEPOSIT", amount_cents: 1000000, expected_account_version: "${v0}" }, as: Customer, as_user_id: "${c_id}" }
