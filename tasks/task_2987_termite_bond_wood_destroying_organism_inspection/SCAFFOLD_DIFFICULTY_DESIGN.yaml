  # =========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: wdo_report_issued_amended_issued_cycle_pins_first_turnaround
        grounds:
          - state_machines.WdoReport.DRAFT_to_ISSUED
          - state_machines.WdoReport.ISSUED_to_AMENDED
          - state_machines.WdoReport.AMENDED_to_ISSUED
          - calculations.wdo_turnaround_and_form_compliance
          - entities.WdoReport.fields.turnaround_hours
          - entities.WdoReport.fields.amendment_count
        distinguishing_aspect: |
          Entity: WdoReport. Shape: a true CYCLE (ISSUED -> AMENDED -> ISSUED) traversed twice, where
          re-entering a previously occupied state is legal but is NOT a replay: issued_at moves on
          every entry while turnaround_hours and sla_breached stay pinned to the first entry, and the
          amendment window restarts from the most recent issuance rather than the original one.
        test_recipe:
          setup:
            - "P1 in FL (72-hour statutory turnaround, mandatory form FL_DACS_13645)."
            - "A GRAPHED REAL_ESTATE inspection with closing_date 2026-09-15, so every issuance stays 24 h clear of closing."
            - "A DRAFT WdoReport requested at exactly 2026-08-01T10:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T09:00:00Z" }
              as: ComplianceOfficer
            - call: "POST /properties"
              payload: { address_line1: "411 Cypress Row", state_code: "FL", construction_type: "SLAB", square_footage: 2000, linear_footage: 180, year_built: 1995, has_attached_structures: false }
              as: ComplianceOfficer
              captures: { p1: $.data.id }
            - call: "POST /inspectors"
              payload: { full_name: "Rosa Vance", license_number: "FL-10001", license_state: "FL", license_categories: ["WDO_INSPECTOR"], license_expires_on: "2029-06-30" }
              as: ComplianceOfficer
              captures: { insb: $.data.id }
            - call: "POST /inspections"
              payload: { property_id: "${p1}", inspector_id: "${insb}", purpose: "REAL_ESTATE", closing_date: "2026-09-15", scheduled_start_at: "2026-08-01T09:00:00Z", scheduled_end_at: "2026-08-01T10:00:00Z" }
              as: FieldInspector
              as_user_id: "${insb}"
              captures: { reins: $.data.id }
            - call: "POST /inspections/${reins}/graph-complete"
              payload: { no_findings_attested: true }
              as: FieldInspector
              as_user_id: "${insb}"
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T10:00:00Z" }
              as: ComplianceOfficer
            - call: "POST /wdo-reports"
              payload: { inspection_id: "${reins}", form_code: "FL_DACS_13645" }
              as: ComplianceOfficer
              captures: { rep1: $.data.id }
          trigger:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-03T09:30:00Z" }
              as: ComplianceOfficer
            - call: "POST /wdo-reports/${rep1}/issue"
              payload: {}
              as: ComplianceOfficer
            - call: "POST /wdo-reports/${rep1}/issue"
              payload: {}
              as: ComplianceOfficer
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-20T12:00:00Z" }
              as: ComplianceOfficer
            - call: "POST /wdo-reports/${rep1}/amend"
              payload: { amendment_reason_code: "SECONDARY_EVIDENCE_ADDED" }
              as: ComplianceOfficer
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-25T12:00:00Z" }
              as: ComplianceOfficer
            - call: "POST /wdo-reports/${rep1}/issue"
              payload: {}
              as: ComplianceOfficer
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-05T08:00:00Z" }
              as: ComplianceOfficer
            - call: "POST /wdo-reports/${rep1}/amend"
              payload: { amendment_reason_code: "DAMAGE_SCOPE_REVISED" }
              as: ComplianceOfficer
            - call: "POST /wdo-reports/${rep1}/issue"
              payload: {}
              as: ComplianceOfficer
          assert:
            - "at creation: WdoReport.${rep1}.requested_at == 2026-08-01T10:00:00Z and due_at == 2026-08-04T10:00:00Z — requested_at + 72 h for FL"
            - "first issuance at 2026-08-03T09:30:00Z: status == ISSUED, issued_at == 2026-08-03T09:30:00Z, turnaround_hours == 48 — ceil(47.5), and sla_breached == false because 48 is not > 72"
            - "the immediate second issue call is refused with ERR_INVALID_REPORT_STATE (409): ISSUED -> ISSUED is not a declared transition, so the cycle can only be re-entered through AMENDED"
            - "after the first amend: status == AMENDED, amendment_count == 1, amendment_reason_code == SECONDARY_EVIDENCE_ADDED, turnaround_hours still 48"
            - "second issuance at 2026-08-25T12:00:00Z: status == ISSUED and issued_at == 2026-08-25T12:00:00Z, but turnaround_hours == 48 and sla_breached == false are NOT recomputed — a naive recompute would give ceil(578 h) == 578 and sla_breached == true"
            - "second amend at 2026-09-05T08:00:00Z succeeds: it is 11 days after the SECOND issuance, so the 30-day amendment window is measured from the latest issued_at, not from 2026-08-03; amendment_count == 2"
            - "third issuance at 2026-09-05T08:00:00Z: status == ISSUED, issued_at == 2026-09-05T08:00:00Z, turnaround_hours == 48, sla_breached == false, amendment_count == 2"
            - "every issuance stayed inside the closing-lead gate: 2026-09-05T08:00:00Z <= 2026-09-14T00:00:00Z (closing 2026-09-15 minus 24 h)"
            - "loop accounting: the report visited ISSUED three times and AMENDED twice, and version has been incremented once per accepted transition"

