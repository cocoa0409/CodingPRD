      - name: every_role_is_denied_another_roles_exclusive_operation
        claim_type: role_denied_operations
        grounds:
          - errors.ERR_UNAUTHORIZED
          - validations.priority_2
        distinguishing_aspect: "Each of the seven roles is refused ERR_UNAUTHORIZED (403) on an operation exclusive to a different role, and because the role gate sits at priority 2 the refusal arrives even when the path id does not exist, which would otherwise be a 404."
        test_recipe:
