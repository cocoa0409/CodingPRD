            - call: "POST /tdr/sending-parcels"
              payload: { owner_party_id: "${own_id}", sending_area_id: "${sa_id}", apn: "APN-001", gross_acres: 100.00, constrained_acres: 22.00, soil_class: "PRIME", existing_dwelling_units: 2 }
              as: ProgramAdministrator
              captures: { parcel_id: $.data.id }
            - call: "POST /tdr/severance-applications"
              payload: { sending_parcel_id: "${parcel_id}", applicant_party_id: "${own_id}", requested_units: 22 }
              as: Landowner
              as_user_id: "${own_id}"
              captures: { app_id: $.data.id }
            - call: "POST /tdr/severance-applications/${app_id}/screen"
              payload: {}
              as: SeveranceReviewer
              as_user_id: "rev-1"
            - call: "POST /tdr/severance-applications/${app_id}/review-decision"
              payload: { decision: "APPROVE" }
              as: SeveranceReviewer
              as_user_id: "rev-1"
            - call: "POST /tdr/severance-applications/${app_id}/certify"
              payload: {}
              as: ProgramAdministrator
              as_user_id: "admin-1"
              captures: { cert_id: $.data.id, eas_id: $.data.conservation_easement_id }
            - call: "POST /tdr/conservation-easements/${eas_id}/inspections"
              payload: { inspection_date: "2026-08-10", finding: "COMPLIANT", affected_acres: 0.00 }
              as: EasementMonitor
              as_user_id: "mon-1"
              captures: { insp_first: $.data.id }
            - call: "POST /tdr/_clock/set_current_utc"
              payload: { current_utc: "2026-11-08T00:00:00Z" }
              as: ProgramAdministrator
          trigger:
            - call: "POST /tdr/conservation-easements/${eas_id}/inspections"
              payload: { inspection_date: "2026-11-07", finding: "COMPLIANT", affected_acres: 0.00 }
              as: EasementMonitor
              as_user_id: "mon-1"
            - call: "POST /tdr/conservation-easements/${eas_id}/inspections"
              payload: { inspection_date: "2026-11-08", finding: "COMPLIANT", affected_acres: 0.00 }
              as: EasementMonitor
              as_user_id: "mon-1"
              captures: { insp_second: $.data.id }
          assert:
            - "MonitoringInspection.${insp_first}.severity_score == 0.00 and cure_deadline == null and status == CLOSED"
            - "the 2026-11-07 inspection (89 days after 2026-08-10) returns 409 ERR_INSPECTION_WINDOW_CONFLICT"
            - "the refused attempt creates no MonitoringInspection row and leaves ConservationEasement.${eas_id}.last_inspection_at at 2026-08-10"
            - "the 2026-11-08 inspection (exactly 90 days) returns 201"
            - "MonitoringInspection.${insp_second}.severity_score == 0.00 and cure_deadline == null and status == CLOSED"
            - "ConservationEasement.${eas_id}.last_inspection_at == 2026-11-08"
            - "ConservationEasement.${eas_id}.compliance_status == COMPLIANT and prior_violation_count == 0"
            - "GET /tdr/conservation-easements/${eas_id}/inspections returns total_count 2"
            - "Certificate.${cert_id}.market_status == HELD throughout (compliant inspections never freeze rights)"

  - rule_id: compensating_invariant
    instances:

      - name: severed_rights_conserved_across_split_allocate_and_release
        grounds:
          - calculations.rights_ledger_identity
          - entities.ConservationEasement.fields.units_outstanding
          - entities.Certificate.fields.units_split_out
          - entities.Certificate.fields.units_encumbered
          - state_machines.CertificateRedemption.ALLOCATED_to_RELEASED
          - concurrency_rules.certificate-split-stale-certificate
        distinguishing_aspect: |
          Conserved quantity: SEVERED DEVELOPMENT RIGHTS (integer units) against a
          ConservationEasement. Three unit-moving operations run in sequence — a split, a
          redemption allocation, and a release — and none of them may change
          units_issued_total or units_outstanding on the easement, because none of them
          actually redeems or retires anything. The release is the compensating operation:
          it must return the encumbrance to the certificate and the reserve to the area
          exactly, with the split child left untouched.
        test_recipe:
          setup:
            - "logical clock at 2026-08-10T00:00:00Z"
            - "LANDOWNER, DEVELOPER, MUNICIPAL_BANK parties; ACTIVE SA-EAST and NB-EAST appraisal schedule 1234567 / 250 bps"
            - "a 22-unit root certificate sold PRIVATE for 30000000 and settled, so the DEVELOPER holds it; easement units_issued_total 22, units_outstanding 22"
            - "the certificate is re-read after settlement so the OCC version used by the split is the current one"
            - "ACTIVE receiving area RA-CORE: base_density 4.0, max_bonus_pct 0.35, absorption_cap_units 500, design_review_required false"
            - "receiving-site application on 12.00 acres requesting 20 bonus units -> DESIGN_APPROVED at version 1"
          setup_api_calls:
            - call: "POST /tdr/_clock/set_current_utc"
              payload: { current_utc: "2026-08-10T00:00:00Z" }
              as: ProgramAdministrator
            - call: "POST /tdr/parties"
              payload: { kind: "LANDOWNER", legal_name: "Ridge Farm LLC", contact_email: "ridge@example.org", neighborhood_code: "NB-EAST" }
              as: ProgramAdministrator
              captures: { own_id: $.data.id }
            - call: "POST /tdr/parties"
              payload: { kind: "DEVELOPER", legal_name: "Core Block Partners", contact_email: "core@example.org", neighborhood_code: "NB-CORE" }
              as: ProgramAdministrator
              captures: { dev_id: $.data.id, dev_v: $.data.version }
            - call: "POST /tdr/parties"
              payload: { kind: "MUNICIPAL_BANK", legal_name: "City TDR Bank", contact_email: "bank@example.org", neighborhood_code: "NB-CORE" }
              as: ProgramAdministrator
              captures: { bank_id: $.data.id }
            - call: "POST /tdr/sending-areas"
              payload: { code: "SA-EAST", name: "East Ridge", neighborhood_code: "NB-EAST", allocation_formula_version: "V1_NET_ACRE", base_rate_units_per_acre: 0.25, gross_discount_factor: 0.80, equity_tier: "UNDERSERVED", sending_cap_units: 200 }
              as: ProgramAdministrator
              captures: { sa_id: $.data.id }
            - call: "POST /tdr/sending-areas/${sa_id}/activate"
              payload: {}
              as: ProgramAdministrator
            - call: "POST /tdr/appraisal-schedules"
              payload: { neighborhood_code: "NB-EAST", per_unit_value_cents: 1234567, equity_adjustment_bps: 250, effective_from: "2026-01-01", effective_to: "2027-01-01" }
              as: ProgramAdministrator
            - call: "POST /tdr/sending-parcels"
              payload: { owner_party_id: "${own_id}", sending_area_id: "${sa_id}", apn: "APN-001", gross_acres: 100.00, constrained_acres: 22.00, soil_class: "PRIME", existing_dwelling_units: 2 }
              as: ProgramAdministrator
              captures: { parcel_id: $.data.id }
            - call: "POST /tdr/severance-applications"
              payload: { sending_parcel_id: "${parcel_id}", applicant_party_id: "${own_id}", requested_units: 22 }
              as: Landowner
              as_user_id: "${own_id}"
              captures: { app_id: $.data.id }
            - call: "POST /tdr/severance-applications/${app_id}/screen"
              payload: {}
              as: SeveranceReviewer
              as_user_id: "rev-1"
            - call: "POST /tdr/severance-applications/${app_id}/review-decision"
              payload: { decision: "APPROVE" }
              as: SeveranceReviewer
              as_user_id: "rev-1"
            - call: "POST /tdr/severance-applications/${app_id}/certify"
              payload: {}
              as: ProgramAdministrator
              as_user_id: "admin-1"
              captures: { cert_id: $.data.id, eas_id: $.data.conservation_easement_id }
            - call: "POST /tdr/parties/${dev_id}/account-actions"
              payload: { action: "CREDIT", amount_cents: 30000000, expected_party_version: "${dev_v}" }
              as: ProgramAdministrator
            - call: "POST /tdr/market-transactions"
              payload: { certificate_id: "${cert_id}", seller_party_id: "${own_id}", buyer_party_id: "${dev_id}", channel: "PRIVATE", units: 22, conveyance_mode: "WHOLE", agreed_price_cents: 30000000 }
              as: Landowner
              as_user_id: "${own_id}"
              captures: { mtx_id: $.data.id }
            - call: "POST /tdr/market-transactions/${mtx_id}/settle"
              payload: {}
              as: ProgramAdministrator
              as_user_id: "admin-1"
            - call: "GET /tdr/certificates/${cert_id}"
              payload: {}
              as: Developer
              as_user_id: "${dev_id}"
              captures: { cert_v: $.data.version }
            - call: "POST /tdr/receiving-areas"
              payload: { code: "RA-CORE", name: "Core Receiving Area", neighborhood_code: "NB-CORE", base_density_units_per_acre: 4.0, max_bonus_pct: 0.35, absorption_cap_units: 500, design_review_required: false, eligible_sending_area_codes: [] }
              as: ProgramAdministrator
              captures: { ra_id: $.data.id }
            - call: "POST /tdr/receiving-areas/${ra_id}/activate"
              payload: {}
              as: ProgramAdministrator
            - call: "POST /tdr/receiving-site-applications"
              payload: { developer_party_id: "${dev_id}", receiving_area_id: "${ra_id}", site_acres: 12.00, requested_bonus_units: 20 }
              as: Developer
              as_user_id: "${dev_id}"
              captures: { rsa_id: $.data.id, rsa_v: $.data.version }
          trigger:
            - call: "POST /tdr/certificates/${cert_id}/split"
              payload: { units: 8, expected_certificate_version: "${cert_v}" }
              as: Developer
              as_user_id: "${dev_id}"
              captures: { child_id: $.data.id }
            - call: "POST /tdr/receiving-site-applications/${rsa_id}/redemptions"
              payload: { certificate_id: "${cert_id}", units: 5, expected_receiving_site_application_version: "${rsa_v}" }
              as: Developer
              as_user_id: "${dev_id}"
              captures: { red_id: $.data.id }
            - call: "POST /tdr/certificate-redemptions/${red_id}/release"
              payload: { reason: "site plan withdrawn" }
              as: Developer
              as_user_id: "${dev_id}"
          assert:
            - "ConservationEasement.${eas_id}.units_issued_total == 22 (unchanged by all three operations)"
            - "ConservationEasement.${eas_id}.units_redeemed_confirmed == 0"
            - "ConservationEasement.${eas_id}.units_retired == 0"
            - "ConservationEasement.${eas_id}.units_outstanding == 22 (the conserved quantity)"
            - "Certificate.${cert_id}.units_face == 22, units_split_out == 8, units_remaining == 14, split_count == 1"
            - "Certificate.${cert_id}.units_encumbered == 0 after the release"
            - "Certificate.${cert_id}.units_redeemed == 0 and units_retired == 0 and lifecycle_status == ISSUED"
            - "Certificate.${child_id}.parent_certificate_id == ${cert_id} and generation == 2"
            - "Certificate.${child_id}.units_face == 8 and units_remaining == 8 and units_encumbered == 0"
            - "Certificate.${child_id}.conservation_easement_id == ${eas_id} and holder_party_id == ${dev_id}"
            - "Certificate.${cert_id}.units_remaining + Certificate.${child_id}.units_remaining == 22 (lineage sum equals the issuance)"
            - "CertificateRedemption.${red_id}.status == RELEASED with released_at == 2026-08-10T00:00:00Z"
            - "ReceivingSiteApplication.${rsa_id}.pending_backed_units == 0 and backed_units == 0"
            - "ReceivingArea.${ra_id}.reserved_units == 0 and absorbed_units == 0"
            - "Party.${dev_id}.units_held == 22 and certificates_held_count == 2"

      - name: program_cash_conserved_across_settlement_and_reversal
        grounds:
          - calculations.cash_ledger_identity
          - calculations.settlement_split
          - state_machines.MarketTransaction.SETTLED_to_REVERSED
          - entities.Party.fields.cash_balance_cents
          - entities.Party.fields.fee_revenue_cents
          - validations.priority_32_ERR_REVERSAL_WINDOW_EXPIRED
        distinguishing_aspect: |
          A DIFFERENT conserved quantity from instance A: PROGRAM CASH in cents
          (sum of every Party's cash_balance_cents plus fee_revenue_cents), which has no
          external source or sink. A reversal is the compensating operation for a
          settlement and must negate all THREE legs exactly — buyer debit, seller credit,
          and the bank's fee-plus-surcharge revenue — leaving no rounding residue and
          returning title to the seller.
        test_recipe:
          setup:
            - "logical clock at 2026-08-10T00:00:00Z"
            - "LANDOWNER, DEVELOPER, MUNICIPAL_BANK parties; ACTIVE SA-EAST (UNDERSERVED) and NB-EAST appraisal schedule 1234567 / 250 bps"
            - "the developer is credited 30000000 cents; every other party's cash_balance_cents and fee_revenue_cents are 0, so the program-wide total is exactly 30000000"
            - "a 22-unit certificate issued to the landowner off a fully severed parcel; easement RECORDED and COMPLIANT"
            - "a PRIVATE transaction for 22 units at 30000000 is PROPOSED and then SETTLED: fee 600000, surcharge 0, net 29400000"
            - "the clock is still inside the 30-day reversal window"
          setup_api_calls:
            - call: "POST /tdr/_clock/set_current_utc"
              payload: { current_utc: "2026-08-10T00:00:00Z" }
              as: ProgramAdministrator
            - call: "POST /tdr/parties"
              payload: { kind: "LANDOWNER", legal_name: "Ridge Farm LLC", contact_email: "ridge@example.org", neighborhood_code: "NB-EAST" }
              as: ProgramAdministrator
              captures: { own_id: $.data.id }
            - call: "POST /tdr/parties"
              payload: { kind: "DEVELOPER", legal_name: "Core Block Partners", contact_email: "core@example.org", neighborhood_code: "NB-CORE" }
              as: ProgramAdministrator
              captures: { dev_id: $.data.id, dev_v: $.data.version }
            - call: "POST /tdr/parties"
              payload: { kind: "MUNICIPAL_BANK", legal_name: "City TDR Bank", contact_email: "bank@example.org", neighborhood_code: "NB-CORE" }
              as: ProgramAdministrator
              captures: { bank_id: $.data.id }
            - call: "POST /tdr/sending-areas"
              payload: { code: "SA-EAST", name: "East Ridge", neighborhood_code: "NB-EAST", allocation_formula_version: "V1_NET_ACRE", base_rate_units_per_acre: 0.25, gross_discount_factor: 0.80, equity_tier: "UNDERSERVED", sending_cap_units: 200 }
              as: ProgramAdministrator
              captures: { sa_id: $.data.id }
            - call: "POST /tdr/sending-areas/${sa_id}/activate"
              payload: {}
              as: ProgramAdministrator
            - call: "POST /tdr/appraisal-schedules"
              payload: { neighborhood_code: "NB-EAST", per_unit_value_cents: 1234567, equity_adjustment_bps: 250, effective_from: "2026-01-01", effective_to: "2027-01-01" }
              as: ProgramAdministrator
            - call: "POST /tdr/sending-parcels"
              payload: { owner_party_id: "${own_id}", sending_area_id: "${sa_id}", apn: "APN-001", gross_acres: 100.00, constrained_acres: 22.00, soil_class: "PRIME", existing_dwelling_units: 2 }
              as: ProgramAdministrator
              captures: { parcel_id: $.data.id }
            - call: "POST /tdr/severance-applications"
              payload: { sending_parcel_id: "${parcel_id}", applicant_party_id: "${own_id}", requested_units: 22 }
              as: Landowner
              as_user_id: "${own_id}"
              captures: { app_id: $.data.id }
            - call: "POST /tdr/severance-applications/${app_id}/screen"
              payload: {}
              as: SeveranceReviewer
              as_user_id: "rev-1"
            - call: "POST /tdr/severance-applications/${app_id}/review-decision"
              payload: { decision: "APPROVE" }
              as: SeveranceReviewer
              as_user_id: "rev-1"
            - call: "POST /tdr/severance-applications/${app_id}/certify"
              payload: {}
              as: ProgramAdministrator
              as_user_id: "admin-1"
              captures: { cert_id: $.data.id, eas_id: $.data.conservation_easement_id }
            - call: "POST /tdr/parties/${dev_id}/account-actions"
              payload: { action: "CREDIT", amount_cents: 30000000, expected_party_version: "${dev_v}" }
              as: ProgramAdministrator
            - call: "POST /tdr/market-transactions"
              payload: { certificate_id: "${cert_id}", seller_party_id: "${own_id}", buyer_party_id: "${dev_id}", channel: "PRIVATE", units: 22, conveyance_mode: "WHOLE", agreed_price_cents: 30000000 }
              as: Landowner
              as_user_id: "${own_id}"
              captures: { mtx_id: $.data.id }
            - call: "POST /tdr/market-transactions/${mtx_id}/settle"
              payload: {}
              as: ProgramAdministrator
              as_user_id: "admin-1"
          trigger:
            - call: "POST /tdr/market-transactions/${mtx_id}/reverse"
              payload: { reversal_reason: "TITLE_DEFECT" }
              as: ProgramAdministrator
              as_user_id: "admin-1"
          assert:
            - "the reversal returns 200 and MarketTransaction.${mtx_id}.status == REVERSED with reversed_at == 2026-08-10T00:00:00Z and reversal_reason == TITLE_DEFECT"
            - "Party.${dev_id}.cash_balance_cents == 30000000 (the buyer's 30000000 debit is undone exactly)"
            - "Party.${own_id}.cash_balance_cents == 0 (the seller's 29400000 credit is undone exactly)"
            - "Party.${bank_id}.fee_revenue_cents == 0 (the 600000 fee leg is undone exactly)"
            - "the program-wide sum of cash_balance_cents + fee_revenue_cents across all three parties == 30000000, identical to the pre-settlement total"
            - "Certificate.${cert_id}.holder_party_id == ${own_id} and market_status == HELD and units_encumbered == 0"
            - "Certificate.${cert_id}.units_remaining == 22 and units_redeemed == 0 and lifecycle_status == ISSUED"
            - "Party.${own_id}.units_held == 22 and certificates_held_count == 1"
            - "Party.${dev_id}.units_held == 0 and certificates_held_count == 0"
            - "MarketTransaction.${mtx_id}.program_fee_cents == 600000 and net_to_seller_cents == 29400000 are retained as the historical record, not zeroed"
            - "a second POST /tdr/market-transactions/${mtx_id}/reverse returns 409 ERR_TRANSACTION_NOT_SETTLED — the state gate at priority 19 outranks the constraint gate at priority 42, so a REVERSED transaction reports its state, not ERR_REVERSAL_NOT_PERMITTED"
            - "the second attempt moves no cash: the program-wide total is still 30000000 and every per-party balance is unchanged"
