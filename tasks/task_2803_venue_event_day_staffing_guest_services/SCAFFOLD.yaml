# =============================================================================
# PRD Benchmark Scaffold — task_2803 Venue Event-Day Staffing & Guest Services
# §1.0–§1.7. Difficulty design (§1.8) and corner design (§1.9) live in the two
# sibling files SCAFFOLD_DIFFICULTY_DESIGN.yaml / SCAFFOLD_CORNER_DESIGN.yaml.
# =============================================================================

scenario: |
  2803. Venue Event-Day Staffing & Guest Services (stadium guest experience department): event
  staffing plan by expected attendance with ushers, ticket takers, elevator operators and guest
  services positions, part-time workforce scheduling with shift bidding, attendance reliability and
  no-show backfill pools, training and certification on accessibility, evacuation procedures and
  code of conduct enforcement, guest issue resolution with seat relocation, refund authority and
  text-based reporting lines, accessibility services including wheelchair assistance, assistive
  listening and companion seating, lost and found, lost child and medical response protocols, tip
  and gratuity policy for contracted positions, guest satisfaction measurement and staffing model
  refinement

domain_name: venue-event-day-staffing
api_prefix: "/"          # flat topology: every entity owns a top-level collection segment

complexity_profile:
  primary_archetype: quota_allocation
  secondary_archetype: compliance_audit
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers

  entity_topology: flat
  # Peer top-level collections joined by foreign keys; no entity is addressed through a
  # parent path segment except the two reverse-reachability sub-resource reads.

  state_machine_shape: cyclic
  # GuestIssue loops RESOLVED -> REOPENED -> IN_PROGRESS -> RESOLVED; StaffMember loops
  # ACTIVE -> PROBATION -> ACTIVE; PositionSlot loops FILLED -> PARTIALLY_FILLED -> FILLED and
  # UNDERSTAFFED_ESCALATED -> PARTIALLY_FILLED; StaffAssignment carries two independent state
  # dimensions (attendance_status x payout_status); ShiftBid forks SUBMITTED -> {AWARDED,
  # WAITLISTED, DECLINED_BY_SYSTEM, WITHDRAWN} with divergent side-effect sets per branch.

  relationship_patterns:
    - one_to_many          # Event -> StaffingPlan -> PositionSlot -> StaffAssignment
    - many_to_many         # ShiftBid and StaffAssignment join StaffMember x PositionSlot
    - self_referential     # GuestIssue.escalated_from_issue_id -> GuestIssue.id
    - cross_aggregate      # BackfillRequest references a StaffAssignment in another aggregate

  role_model: segregation_of_duties
  # The operator who files a refund request on a GuestIssue and the operator who resolved it may
  # not be the operator who decides it; VOID authority sits only with GuestExperienceDirector.

  consistency_model: immediate

difficulty_level: expert_plus
# 13 entities / 66 endpoints / 43 error codes / 13 calculations (3 of them dual-variant) /
# 24 priority-ordered validations / 10 state machines (8 entities, StaffAssignment carrying two
# independent dimensions), 6 of them non-linear.

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Event
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: "Public event name, e.g. 'Season Opener'"
      - name: event_date
        type: datetime
        source: input
        description: "Scheduled start of the event itself (ISO 8601 UTC)"
      - name: doors_open_at
        type: datetime
        source: input
        description: "Instant guests may enter; staffing shifts are expected to straddle it"
      - name: doors_close_at
        type: datetime
        source: input
        description: "Instant the bowl is cleared; must be strictly after doors_open_at"
      - name: expected_attendance
        type: integer
        source: input
        description: "Forecast paid attendance; drives the FORECAST_BASED staffing variant"
        constraints: ">= 0"
      - name: historical_actual_attendance
        type: integer
        source: input
        default: null
        description: "Turnstile count of the comparable prior event; required by the HISTORICAL_ACTUAL staffing variant"
        constraints: "null or >= 0"
      - name: attendance_tier
        type: enum
        source: computed
        description: "Tier of expected_attendance per calculations.event_attendance_tier"
        constraints: "TIER_1 | TIER_2 | TIER_3 | TIER_4"
      - name: refund_budget_total_cents
        type: integer
        source: input
        default: 100000
        description: "Event-day guest-recovery budget ceiling in cents"
        constraints: ">= 0"
      - name: refund_approved_total_cents
        type: integer
        source: computed
        default: 0
        description: "Sum of GuestIssue.refund_approved_cents over issues of this event whose refund_status IN {APPROVED, PARTIALLY_APPROVED}"
      - name: refund_budget_remaining_cents
        type: integer
        source: computed
        description: "refund_budget_total_cents - refund_approved_total_cents; see calculations.event_refund_budget_ledger"
      - name: gratuity_pool_cents
        type: integer
        source: input
        default: 0
        description: "Pooled gratuity collected for contracted tip-eligible positions, in cents"
        constraints: ">= 0"
      - name: gratuity_allocated_cents
        type: integer
        source: computed
        default: 0
        description: "Cents already distributed by calculations.gratuity_pool_allocation"
      - name: status
        type: enum
        source: system
        default: FORECAST
        description: "Event lifecycle state"
        constraints: "FORECAST | PLANNED | IN_PROGRESS | CLOSED | CANCELLED"

  - name: PositionType
    parent: null
    common_fields: true
    fields:
      - name: code
        type: enum
        source: input
        description: "Guest-experience position family"
        constraints: "USHER | TICKET_TAKER | ELEVATOR_OPERATOR | GUEST_SERVICES_REP"
      - name: display_name
        type: string
        source: input
        description: "Human label used on the staffing sheet"
      - name: base_hourly_rate_cents
        type: integer
        source: input
        description: "Straight-time hourly rate in cents"
        constraints: ">= 0"
      - name: attendance_ratio_per_1000
        type: number
        source: input
        description: "Headcount required per 1000 attendees before the tier multiplier"
        constraints: "> 0"
      - name: min_headcount
        type: integer
        source: input
        description: "Floor applied after the ratio computation, regardless of attendance"
        constraints: ">= 0"
      - name: required_certifications
        type: array
        source: input
        description: "Certification types every staff member working this position must hold as VALID"
        constraints: "subset of {ACCESSIBILITY_SERVICES, EVACUATION_PROCEDURES, CODE_OF_CONDUCT, ELEVATOR_OPERATION}"
      - name: is_tip_eligible
        type: boolean
        source: input
        default: false
        description: "Whether assignments on this position share the event gratuity pool"
      - name: is_contracted_position
        type: boolean
        source: input
        default: false
        description: "Whether the position is staffed by CONTRACTED workers; gratuity eligibility additionally requires this"

  - name: StaffingPlan
    parent: null
    common_fields: true
    fields:
      - name: event_id
        type: string
        source: input
        description: "FK -> Event.id; the event this plan staffs"
      - name: plan_variant
        type: enum
        source: input
        description: "Which attendance basis the headcount math uses"
        constraints: "FORECAST_BASED | HISTORICAL_ACTUAL"
      - name: revision_number
        type: integer
        source: computed
        description: "1 + count of StaffingPlan rows already existing for this event_id at creation time"
      - name: status
        type: enum
        source: system
        default: DRAFT
        description: "Plan lifecycle state"
        constraints: "DRAFT | ACTIVE | SUPERSEDED | LOCKED | VOIDED"
      - name: basis_attendance
        type: integer
        source: computed
        description: "Attendance number selected by plan_variant at activation-independent creation time; see calculations.position_slot_required_headcount"
      - name: basis_attendance_tier
        type: enum
        source: computed
        description: "Tier of basis_attendance per calculations.event_attendance_tier"
        constraints: "TIER_1 | TIER_2 | TIER_3 | TIER_4"
      - name: total_required_headcount
        type: integer
        source: computed
        default: 0
        description: "Sum of PositionSlot.required_headcount over this plan's slots with status != CLOSED"
      - name: base_labor_cost_cents
        type: integer
        source: computed
        default: 0
        description: "Sum of PositionSlot.slot_labor_cost_cents over the same slot set"
      - name: accessibility_surcharge_cents
        type: integer
        source: computed
        default: 0
        description: "Surcharge derived from base_labor_cost_cents and the headcount tier; see calculations.staffing_plan_projected_labor_cost"
      - name: projected_labor_cost_cents
        type: integer
        source: computed
        default: 0
        description: "base_labor_cost_cents + accessibility_surcharge_cents"
      - name: activated_at
        type: datetime
        source: system
        default: null
        description: "Logical-clock instant the plan became ACTIVE, or null"

  - name: PositionSlot
    parent: null
    common_fields: true
    fields:
      - name: plan_id
        type: string
        source: input
        description: "FK -> StaffingPlan.id; owning staffing plan"
      - name: position_type_id
        type: string
        source: input
        description: "FK -> PositionType.id; position family staffed by this slot"
      - name: zone_code
        type: string
        source: input
        description: "Venue zone label, e.g. 'GATE_A', 'TOWER', 'BOWL'"
      - name: shift_start
        type: datetime
        source: input
        description: "Half-open interval start of the shift block"
      - name: shift_end
        type: datetime
        source: input
        description: "Half-open interval end; must be strictly after shift_start"
      - name: required_headcount_override
        type: integer
        source: input
        default: null
        description: "Operator override replacing the ratio-derived headcount; null keeps the ratio result"
        constraints: "null or >= 1"
      - name: ratio_derived_headcount
        type: integer
        source: computed
        description: "Headcount the ratio math yields for the owning plan's basis attendance; always recorded even when overridden"
      - name: required_headcount
        type: integer
        source: computed
        description: "required_headcount_override when non-null, else ratio_derived_headcount"
      - name: filled_headcount
        type: integer
        source: computed
        default: 0
        description: "Count of StaffAssignment rows on this slot with attendance_status IN {SCHEDULED, CHECKED_IN, COMPLETED}"
      - name: shift_minutes
        type: integer
        source: computed
        description: "Whole minutes between shift_start and shift_end"
      - name: slot_labor_cost_cents
        type: integer
        source: computed
        default: 0
        description: "Per-slot straight-time cost; see calculations.staffing_plan_projected_labor_cost step 1"
      - name: status
        type: enum
        source: system
        default: OPEN
        description: "Fill state derived from filled_headcount vs required_headcount, or CLOSED / UNDERSTAFFED_ESCALATED by explicit transition"
        constraints: "OPEN | PARTIALLY_FILLED | FILLED | UNDERSTAFFED_ESCALATED | CLOSED"

  - name: StaffMember
    parent: null
    common_fields: true
    fields:
      - name: full_name
        type: string
        source: input
        description: "Worker name"
      - name: employment_type
        type: enum
        source: input
        description: "Employment relationship; gratuity sharing requires CONTRACTED"
        constraints: "PART_TIME_EMPLOYEE | CONTRACTED"
      - name: seniority_date
        type: datetime
        source: input
        description: "Date of hire; used as the second ranking key in every selector"
      - name: hourly_rate_cents
        type: integer
        source: input
        description: "Personal straight-time rate in cents used for assignment payout"
        constraints: ">= 0"
      - name: in_backfill_pool
        type: boolean
        source: input
        default: true
        description: "Whether the worker opted into the no-show backfill pool"
      - name: status
        type: enum
        source: system
        default: ACTIVE
        description: "Workforce standing"
        constraints: "ACTIVE | PROBATION | SUSPENDED | TERMINATED"
      - name: reliability_score
        type: integer
        source: computed
        default: 100
        description: "ROLLING_WINDOW variant of calculations.staff_member_reliability_score; the only score that gates PROBATION and selector ranking"
        constraints: "0..100"
      - name: season_reliability_score
        type: integer
        source: computed
        default: 100
        description: "SEASON_TO_DATE variant of calculations.staff_member_reliability_score; reported but never gating"
        constraints: "0..100"
      - name: no_show_strikes
        type: integer
        source: computed
        default: 0
        description: "All-time count of this member's StaffAssignment rows with attendance_status == NO_SHOW"
      - name: completed_assignment_count
        type: integer
        source: computed
        default: 0
        description: "All-time count of this member's StaffAssignment rows with attendance_status == COMPLETED"
      - name: last_status_reason
        type: string
        source: system
        default: null
        description: "Reason recorded by the most recent status change, including the automatic PROBATION cascade"

  - name: Certification
    parent: null
    common_fields: true
    fields:
      - name: staff_member_id
        type: string
        source: input
        description: "FK -> StaffMember.id; certified worker"
      - name: cert_type
        type: enum
        source: input
        description: "Training credential"
        constraints: "ACCESSIBILITY_SERVICES | EVACUATION_PROCEDURES | CODE_OF_CONDUCT | ELEVATOR_OPERATION"
      - name: issued_on
        type: datetime
        source: input
        description: "Instant the credential was awarded"
      - name: expires_on
        type: datetime
        source: input
        description: "Instant the credential lapses; must be strictly after issued_on"
      - name: revoked_at
        type: datetime
        source: system
        default: null
        description: "Logical-clock instant of revocation, or null"
      - name: status
        type: enum
        source: computed
        description: "REVOKED when revoked_at is non-null, else EXPIRED when current logical clock > expires_on, else VALID"
        constraints: "VALID | EXPIRED | REVOKED"

  - name: ShiftBid
    parent: null
    common_fields: true
    fields:
      - name: staff_member_id
        type: string
        source: input
        description: "FK -> StaffMember.id; bidding worker"
      - name: position_slot_id
        type: string
        source: input
        description: "FK -> PositionSlot.id; slot bid on"
      - name: submitted_at
        type: datetime
        source: system
        description: "Logical-clock instant of submission"
      - name: rank_score
        type: integer
        source: computed
        default: null
        description: "StaffMember.reliability_score snapshot taken when POST /position-slots/{id}/run-bid-award ranked this bid; null until then"
      - name: decision_reason
        type: string
        source: system
        default: null
        description: "Machine reason recorded on WAITLISTED / DECLINED_BY_SYSTEM outcomes"
      - name: status
        type: enum
        source: system
        default: SUBMITTED
        description: "Bid lifecycle state"
        constraints: "SUBMITTED | AWARDED | WAITLISTED | DECLINED_BY_SYSTEM | WITHDRAWN"

  - name: StaffAssignment
    parent: null
    common_fields: true
    fields:
      - name: position_slot_id
        type: string
        source: input
        description: "FK -> PositionSlot.id; slot worked"
      - name: staff_member_id
        type: string
        source: input
        description: "FK -> StaffMember.id; assigned worker"
      - name: shift_bid_id
        type: string
        source: system
        default: null
        description: "FK -> ShiftBid.id; the awarded bid when source == BID_AWARD, else null"
      - name: source
        type: enum
        source: system
        description: "How the assignment came to exist"
        constraints: "BID_AWARD | MANUAL | BACKFILL"
      - name: attendance_status
        type: enum
        source: system
        default: SCHEDULED
        description: "First independent state dimension: physical attendance"
        constraints: "SCHEDULED | CHECKED_IN | COMPLETED | NO_SHOW | RELEASED | CANCELLED"
      - name: payout_status
        type: enum
        source: system
        default: PENDING
        description: "Second independent state dimension: money owed; advances only through payout runs"
        constraints: "PENDING | ACCRUED | GRATUITY_ALLOCATED | PAID | VOIDED"
      - name: check_in_at
        type: datetime
        source: system
        default: null
        description: "Logical-clock instant of CHECK_IN, or null"
      - name: checked_out_at
        type: datetime
        source: system
        default: null
        description: "Logical-clock instant of CHECK_OUT, or null"
      - name: late_check_in
        type: boolean
        source: computed
        default: false
        description: "True when check_in_at > slot.shift_start + LATE_GRACE_MINUTES; frozen at check-in"
      - name: worked_minutes
        type: integer
        source: computed
        default: 0
        description: "Whole minutes between check_in_at and checked_out_at; 0 unless attendance_status == COMPLETED"
      - name: base_pay_cents
        type: integer
        source: computed
        default: 0
        description: "Straight time plus overtime per calculations.assignment_worked_pay"
      - name: gratuity_cents
        type: integer
        source: computed
        default: 0
        description: "Share of the event gratuity pool per calculations.gratuity_pool_allocation"
      - name: total_payout_cents
        type: integer
        source: computed
        default: 0
        description: "base_pay_cents + gratuity_cents"

  - name: BackfillRequest
    parent: null
    common_fields: true
    fields:
      - name: position_slot_id
        type: string
        source: system
        description: "FK -> PositionSlot.id; slot left short"
      - name: triggering_assignment_id
        type: string
        source: system
        description: "FK -> StaffAssignment.id; the assignment whose NO_SHOW opened this request"
      - name: filled_assignment_id
        type: string
        source: system
        default: null
        description: "FK -> StaffAssignment.id; the BACKFILL assignment created by auto-fill, or null"
      - name: selected_staff_member_id
        type: string
        source: computed
        default: null
        description: "FK -> StaffMember.id; candidate chosen by calculations.backfill_candidate_selection, or null"
      - name: attempt_count
        type: integer
        source: computed
        default: 0
        description: "Number of auto-fill attempts made against this request"
      - name: cancel_reason
        type: string
        source: system
        default: null
        description: "Reason recorded on manual cancellation"
      - name: status
        type: enum
        source: system
        default: OPEN
        description: "Backfill lifecycle state"
        constraints: "OPEN | FILLED | UNFILLABLE | CANCELLED"

  - name: GuestIssue
    parent: null
    common_fields: true
    fields:
      - name: event_id
        type: string
        source: input
        description: "FK -> Event.id; event the guest is attending"
      - name: escalated_from_issue_id
        type: string
        source: system
        default: null
        description: "FK -> GuestIssue.id; parent issue when this row was created by an escalation, else null"
      - name: assigned_staff_member_id
        type: string
        source: system
        default: null
        description: "FK -> StaffMember.id; responder currently owning the issue, or null"
      - name: channel
        type: enum
        source: input
        description: "Reporting line the guest used"
        constraints: "TEXT_LINE | IN_PERSON | KIOSK"
      - name: category
        type: enum
        source: input
        description: "Issue family; drives the permitted resolution set and the protocol certification"
        constraints: "SEAT_RELOCATION | CONDUCT_VIOLATION | ACCESSIBILITY | LOST_FOUND | LOST_CHILD | MEDICAL | OTHER"
      - name: severity
        type: enum
        source: computed
        description: "Client-supplied severity, overridden to CRITICAL when category IN {LOST_CHILD, MEDICAL} or when the row was created by an escalation"
        constraints: "LOW | MEDIUM | HIGH | CRITICAL"
      - name: description
        type: string
        source: input
        description: "Free-text account of the guest's problem"
      - name: seat_reference
        type: string
        source: input
        default: null
        description: "Original seat locator, e.g. '112-R-14'"
      - name: relocation_zone_code
        type: string
        source: system
        default: null
        description: "Zone the guest was relocated to; set only by a SEAT_RELOCATION resolution"
      - name: reported_by_user_id
        type: string
        source: system
        description: "X-User-ID of the operator who filed the issue"
      - name: resolved_by_user_id
        type: string
        source: system
        default: null
        description: "X-User-ID of the operator who resolved the issue, or null"
      - name: resolution_type
        type: enum
        source: system
        default: null
        description: "Resolution recorded by POST /guest-issues/{id}/resolve"
        constraints: "SEAT_RELOCATION | REFUND | COMPLIMENTARY_CREDIT | EJECTION | REUNIFICATION | MEDICAL_TRANSPORT | ITEM_RETURNED | NO_ACTION"
      - name: sla_minutes
        type: integer
        source: computed
        description: "Severity-driven response allowance per calculations.guest_issue_sla"
      - name: sla_clock_started_at
        type: datetime
        source: computed
        description: "created_at, or the escalation instant when severity was raised by an escalation"
      - name: sla_deadline
        type: datetime
        source: computed
        description: "sla_clock_started_at + sla_minutes"
      - name: sla_breached
        type: boolean
        source: computed
        default: false
        description: "(resolved_at when set, else the current logical clock) > sla_deadline, strict"
      - name: resolved_at
        type: datetime
        source: system
        default: null
        description: "Logical-clock instant the issue reached RESOLVED, cleared on reopen"
      - name: reopen_count
        type: integer
        source: computed
        default: 0
        description: "Number of times this issue has entered REOPENED"
      - name: refund_requested_cents
        type: integer
        source: system
        default: 0
        description: "Amount the requesting operator asked for, in cents"
      - name: refund_approved_cents
        type: integer
        source: computed
        default: 0
        description: "Amount authorized per calculations.refund_authorized_amount; reset to 0 on VOID"
      - name: refund_status
        type: enum
        source: system
        default: NONE
        description: "Refund sub-state, independent of the issue status"
        constraints: "NONE | PENDING | APPROVED | PARTIALLY_APPROVED | DENIED | VOIDED"
      - name: refund_requested_by_user_id
        type: string
        source: system
        default: null
        description: "X-User-ID of the operator who filed the refund request, or null"
      - name: refund_decided_by_user_id
        type: string
        source: system
        default: null
        description: "X-User-ID of the operator who decided the refund, or null"
      - name: status
        type: enum
        source: system
        default: OPEN
        description: "Issue lifecycle state"
        constraints: "OPEN | IN_PROGRESS | AWAITING_AUTHORIZATION | RESOLVED | REOPENED | ESCALATED | CLOSED"

  - name: AccessibilityResource
    parent: null
    common_fields: true
    fields:
      - name: event_id
        type: string
        source: input
        description: "FK -> Event.id; event the resource is staged for"
      - name: resource_type
        type: enum
        source: input
        description: "Accessibility service pool"
        constraints: "WHEELCHAIR_ESCORT | ASSISTIVE_LISTENING_UNIT | COMPANION_SEAT_BLOCK"
      - name: zone_code
        type: string
        source: input
        description: "Zone the pool serves"
      - name: unit_count
        type: integer
        source: input
        description: "Simultaneously servable units in the pool"
        constraints: ">= 1"
      - name: peak_committed_units
        type: integer
        source: computed
        default: 0
        description: "Highest simultaneous committed units across the resource's CONFIRMED and IN_SERVICE requests; see calculations.accessibility_peak_occupancy"
      - name: status
        type: enum
        source: system
        default: AVAILABLE
        description: "Pool availability"
        constraints: "AVAILABLE | MAINTENANCE | WITHDRAWN"

  - name: AccessibilityRequest
    parent: null
    common_fields: true
    fields:
      - name: resource_id
        type: string
        source: input
        description: "FK -> AccessibilityResource.id; pool the guest is booked against"
      - name: guest_reference
        type: string
        source: input
        description: "Guest locator, e.g. 'WILL-CALL-88'"
      - name: window_start
        type: datetime
        source: input
        description: "Half-open service interval start"
      - name: window_end
        type: datetime
        source: input
        description: "Half-open service interval end; must be strictly after window_start"
      - name: units_requested
        type: integer
        source: input
        description: "Units the guest occupies for the whole window"
        constraints: ">= 1"
      - name: companion_seats_requested
        type: integer
        source: input
        default: 0
        description: "Companion seats requested alongside the service"
        constraints: ">= 0"
      - name: confirmed_at
        type: datetime
        source: system
        default: null
        description: "Logical-clock instant of confirmation, or null"
      - name: service_started_at
        type: datetime
        source: system
        default: null
        description: "Logical-clock instant service began, or null"
      - name: completed_at
        type: datetime
        source: system
        default: null
        description: "Logical-clock instant service finished, or null"
      - name: denial_reason
        type: string
        source: system
        default: null
        description: "Reason recorded when the supervisor denies the request"
      - name: status
        type: enum
        source: system
        default: REQUESTED
        description: "Request lifecycle state"
        constraints: "REQUESTED | CONFIRMED | IN_SERVICE | COMPLETED | CANCELLED | DENIED"

  - name: SatisfactionResponse
    parent: null
    common_fields: false
    fields:
      - name: event_id
        type: string
        source: input
        description: "FK -> Event.id; event surveyed"
      - name: zone_code
        type: string
        source: input
        description: "Zone the guest sat in"
      - name: score
        type: integer
        source: input
        description: "Guest satisfaction score"
        constraints: "1..5"
      - name: comment
        type: string
        source: input
        default: null
        description: "Optional free-text comment"
      - name: submitted_by_user_id
        type: string
        source: system
        description: "X-User-ID of the operator who keyed the response"

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Event
    initial_state: FORECAST
    terminal_states: [CLOSED, CANCELLED]
    shape: linear_with_cancel_fork
    transitions:
      - from: FORECAST
        to: PLANNED
        trigger: "POST /staffing-plans/{id}/activate (first activation for this event)"
        actor: system
        preconditions:
          - "Event.status == FORECAST"
          - "the activated StaffingPlan.event_id == Event.id"
        side_effects:
          - "increments Event.version by 1 (the same mutation the OCC check guards)"
          - "PATCH /events remains permitted while status == PLANNED"
        note: "A second activation on an already PLANNED event leaves Event.status at PLANNED but still increments Event.version by 1."

      - from: PLANNED
        to: IN_PROGRESS
        trigger: "POST /events/{id}/lifecycle {target_status: IN_PROGRESS}"
        actor: GuestExperienceDirector
        preconditions:
          - "Event.status == PLANNED"
          - "exactly one StaffingPlan with status == ACTIVE exists for this event"
        side_effects:
          - "that StaffingPlan transitions ACTIVE -> LOCKED (see state_machines.StaffingPlan.ACTIVE_to_LOCKED)"
          - "PATCH /events is refused from here on with ERR_EVENT_STATE_INVALID"
          - "check-in, no-show and refund decisions become permitted"

      - from: IN_PROGRESS
        to: CLOSED
        trigger: "POST /events/{id}/lifecycle {target_status: CLOSED}"
        actor: GuestExperienceDirector
        preconditions:
          - "Event.status == IN_PROGRESS"
          - "no StaffAssignment on a PositionSlot of this event's LOCKED plan has attendance_status == CHECKED_IN"
        side_effects:
          - "every StaffAssignment on this event's LOCKED plan with attendance_status == SCHEDULED is set to RELEASED and its payout_status to VOIDED"
          - "every PositionSlot touched by that release has filled_headcount recomputed and status re-derived"
          - "GET /events/{id}/staffing-model-recommendation becomes permitted"

      - from: FORECAST
        to: CANCELLED
        trigger: "POST /events/{id}/lifecycle {target_status: CANCELLED}"
        actor: GuestExperienceDirector
        preconditions:
          - "Event.status == FORECAST"
        side_effects:
          - "every StaffingPlan of this event with status IN {DRAFT, ACTIVE} transitions to VOIDED (cascade link 2)"

      - from: PLANNED
        to: CANCELLED
        trigger: "POST /events/{id}/lifecycle {target_status: CANCELLED}"
        actor: GuestExperienceDirector
        preconditions:
          - "Event.status == PLANNED"
        side_effects:
          - "cascade link 2: every StaffingPlan of this event with status IN {DRAFT, ACTIVE} transitions to VOIDED"
          - "cascade link 3 (caused by link 2): every PositionSlot of each VOIDED plan whose status != CLOSED transitions to CLOSED"
          - "cascade link 4 (caused by link 3): on every newly CLOSED slot, each StaffAssignment with attendance_status IN {SCHEDULED, CHECKED_IN} transitions to CANCELLED with payout_status -> VOIDED, and each ShiftBid with status IN {SUBMITTED, WAITLISTED} transitions to DECLINED_BY_SYSTEM with decision_reason 'EVENT_CANCELLED'"

      - from: IN_PROGRESS
        to: CANCELLED
        trigger: "POST /events/{id}/lifecycle {target_status: CANCELLED}"
        actor: GuestExperienceDirector
        preconditions:
          - "Event.status == IN_PROGRESS"
        side_effects:
          - "identical cascade to PLANNED_to_CANCELLED, applied to the LOCKED plan as well as any DRAFT plan"

  - entity: StaffingPlan
    initial_state: DRAFT
    terminal_states: [SUPERSEDED, LOCKED, VOIDED]
    shape: branching
    transitions:
      - from: DRAFT
        to: ACTIVE
        trigger: "POST /staffing-plans/{id}/activate"
        actor: StaffingCoordinator
        preconditions:
          - "StaffingPlan.status == DRAFT"
          - "Event.status IN {FORECAST, PLANNED}"
          - "request field expected_event_version == Event.version (concurrency_rules.plan-activate-stale-event)"
        side_effects:
          - "any other StaffingPlan of the same event with status == ACTIVE transitions to SUPERSEDED (see StaffingPlan.ACTIVE_to_SUPERSEDED)"
          - "activated_at = current logical clock"
          - "total_required_headcount, base_labor_cost_cents, accessibility_surcharge_cents and projected_labor_cost_cents recomputed per calculations.staffing_plan_projected_labor_cost"
          - "Event.status FORECAST -> PLANNED when applicable, and Event.version incremented by 1 in all cases"

      - from: ACTIVE
        to: SUPERSEDED
        trigger: "POST /staffing-plans/{id}/activate on a different DRAFT plan of the same event"
        actor: system
        preconditions:
          - "StaffingPlan.status == ACTIVE"
          - "the newly activated plan has the same event_id"
        side_effects:
          - "every PositionSlot of this plan with status != CLOSED transitions to CLOSED"
          - "on each such slot, ShiftBid rows with status IN {SUBMITTED, WAITLISTED} transition to DECLINED_BY_SYSTEM with decision_reason 'PLAN_SUPERSEDED'"
          - "on each such slot, StaffAssignment rows with attendance_status IN {SCHEDULED, CHECKED_IN} transition to CANCELLED with payout_status -> VOIDED"
          - "total_required_headcount, base_labor_cost_cents, accessibility_surcharge_cents and projected_labor_cost_cents recomputed over the now-CLOSED slot set, which zeroes all four"

      - from: ACTIVE
        to: LOCKED
        trigger: "POST /events/{id}/lifecycle {target_status: IN_PROGRESS}"
        actor: system
        preconditions:
          - "StaffingPlan.status == ACTIVE"
          - "Event.status transitions PLANNED -> IN_PROGRESS in the same request"
        side_effects:
          - "required_headcount, ratio_derived_headcount and slot_labor_cost_cents of this plan's slots are frozen: PATCH /events can no longer recompute them"

      - from: DRAFT
        to: VOIDED
        trigger: "POST /events/{id}/lifecycle {target_status: CANCELLED}"
        actor: system
        preconditions:
          - "StaffingPlan.status == DRAFT"
        side_effects:
          - "cascade link 3: every PositionSlot of this plan whose status != CLOSED transitions to CLOSED"

      - from: ACTIVE
        to: VOIDED
        trigger: "POST /events/{id}/lifecycle {target_status: CANCELLED}"
        actor: system
        preconditions:
          - "StaffingPlan.status == ACTIVE"
        side_effects:
          - "cascade link 3: every PositionSlot of this plan whose status != CLOSED transitions to CLOSED"
          - "total_required_headcount, base_labor_cost_cents, accessibility_surcharge_cents and projected_labor_cost_cents recomputed to 0"

  - entity: PositionSlot
    initial_state: OPEN
    terminal_states: [CLOSED]
    shape: cyclic
    note: "Outside CLOSED and UNDERSTAFFED_ESCALATED, status is a pure function of (filled_headcount, required_headcount): 0 -> OPEN, 0 < filled < required -> PARTIALLY_FILLED, filled >= required -> FILLED. UNDERSTAFFED_ESCALATED is sticky until filled_headcount next changes."
    transitions:
      - from: OPEN
        to: PARTIALLY_FILLED
        trigger: "any assignment-creating action raising filled_headcount to 0 < filled_headcount < required_headcount"
        actor: system
        preconditions:
          - "PositionSlot.status == OPEN"
          - "required_headcount > 1"
        side_effects:
          - "no other entity mutates"

      - from: PARTIALLY_FILLED
        to: FILLED
        trigger: "any assignment-creating action raising filled_headcount to >= required_headcount"
        actor: system
        preconditions:
          - "PositionSlot.status == PARTIALLY_FILLED"
        side_effects:
          - "later awards on this slot are refused with ERR_SLOT_CAPACITY_FULL"

      - from: OPEN
        to: FILLED
        trigger: "an assignment-creating action on a slot with required_headcount == 1"
        actor: system
        preconditions:
          - "PositionSlot.status == OPEN"
          - "required_headcount == 1"
        side_effects:
          - "later awards on this slot are refused with ERR_SLOT_CAPACITY_FULL"

      - from: FILLED
        to: PARTIALLY_FILLED
        trigger: "NO_SHOW, RELEASE or cascade CANCELLED on an assignment of this slot"
        actor: system
        preconditions:
          - "PositionSlot.status == FILLED"
          - "filled_headcount after the mutation is > 0 and < required_headcount"
        side_effects:
          - "the slot accepts awards again"

      - from: PARTIALLY_FILLED
        to: OPEN
        trigger: "NO_SHOW, RELEASE or cascade CANCELLED reducing filled_headcount to 0"
        actor: system
        preconditions:
          - "PositionSlot.status == PARTIALLY_FILLED"
          - "filled_headcount after the mutation == 0"
        side_effects:
          - "no other entity mutates"

      - from: OPEN
        to: UNDERSTAFFED_ESCALATED
        trigger: "POST /backfill-requests/{id}/auto-fill with an empty candidate set"
        actor: system
        preconditions:
          - "PositionSlot.status IN {OPEN, PARTIALLY_FILLED}"
          - "calculations.backfill_candidate_selection returns no candidate"
        side_effects:
          - "the BackfillRequest transitions OPEN -> UNFILLABLE"
          - "GET /events/{id}/staffing-model-recommendation counts this slot in understaffed_slot_count"

      - from: PARTIALLY_FILLED
        to: UNDERSTAFFED_ESCALATED
        trigger: "POST /backfill-requests/{id}/auto-fill with an empty candidate set"
        actor: system
        preconditions:
          - "PositionSlot.status == PARTIALLY_FILLED"
          - "calculations.backfill_candidate_selection returns no candidate"
        side_effects:
          - "the BackfillRequest transitions OPEN -> UNFILLABLE"

      - from: UNDERSTAFFED_ESCALATED
        to: PARTIALLY_FILLED
        trigger: "POST /staff-assignments or POST /shift-bids/{id}/award raising filled_headcount below required_headcount"
        actor: system
        preconditions:
          - "PositionSlot.status == UNDERSTAFFED_ESCALATED"
          - "filled_headcount after the mutation is > 0 and < required_headcount"
        side_effects:
          - "the escalation flag clears; understaffed_slot_count drops"

      - from: UNDERSTAFFED_ESCALATED
        to: FILLED
        trigger: "POST /staff-assignments or POST /shift-bids/{id}/award raising filled_headcount to >= required_headcount"
        actor: system
        preconditions:
          - "PositionSlot.status == UNDERSTAFFED_ESCALATED"
        side_effects:
          - "the escalation flag clears"

      - from: OPEN
        to: CLOSED
        trigger: "owning StaffingPlan transitioning to SUPERSEDED or VOIDED"
        actor: system
        preconditions:
          - "PositionSlot.status != CLOSED"
        side_effects:
          - "cascade link 4 fires on this slot's bids and assignments (see StaffingPlan.ACTIVE_to_SUPERSEDED)"

      - from: PARTIALLY_FILLED
        to: CLOSED
        trigger: "owning StaffingPlan transitioning to SUPERSEDED or VOIDED"
        actor: system
        preconditions:
          - "PositionSlot.status != CLOSED"
        side_effects:
          - "cascade link 4 fires on this slot's bids and assignments"

      - from: FILLED
        to: CLOSED
        trigger: "owning StaffingPlan transitioning to SUPERSEDED or VOIDED"
        actor: system
        preconditions:
          - "PositionSlot.status != CLOSED"
        side_effects:
          - "cascade link 4 fires on this slot's bids and assignments"

      - from: UNDERSTAFFED_ESCALATED
        to: CLOSED
        trigger: "owning StaffingPlan transitioning to SUPERSEDED or VOIDED"
        actor: system
        preconditions:
          - "PositionSlot.status != CLOSED"
        side_effects:
          - "cascade link 4 fires on this slot's bids and assignments"

  - entity: StaffMember
    initial_state: ACTIVE
    terminal_states: [TERMINATED]
    shape: cyclic
    transitions:
      - from: ACTIVE
        to: PROBATION
        trigger: "system recompute of reliability_score after a NO_SHOW or CHECK_OUT that leaves reliability_score < RELIABILITY_PROBATION_FLOOR"
        actor: system
        preconditions:
          - "StaffMember.status == ACTIVE"
          - "the ROLLING_WINDOW variant of calculations.staff_member_reliability_score < 65 (season_reliability_score is NOT consulted)"
        side_effects:
          - "in_backfill_pool = false"
          - "last_status_reason = 'AUTO_PROBATION_RELIABILITY'"
          - "cascade link 4: every other StaffAssignment of this member with attendance_status == SCHEDULED whose PositionSlot.position_type.required_certifications includes ELEVATOR_OPERATION transitions to CANCELLED with payout_status -> VOIDED"
          - "cascade link 5 (caused by link 4): each PositionSlot touched by link 4 has filled_headcount decremented and status re-derived"

      - from: PROBATION
        to: ACTIVE
        trigger: "POST /staff-members/{id}/status-change {target_status: ACTIVE}"
        actor: StaffingCoordinator
        preconditions:
          - "StaffMember.status == PROBATION"
          - "reliability_score >= 65"
        side_effects:
          - "in_backfill_pool = true"
          - "last_status_reason = the request's reason"

      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /staff-members/{id}/status-change {target_status: SUSPENDED}"
        actor: StaffingCoordinator
        preconditions:
          - "StaffMember.status == ACTIVE"
        side_effects:
          - "in_backfill_pool = false"
          - "every StaffAssignment of this member with attendance_status == SCHEDULED transitions to CANCELLED with payout_status -> VOIDED, and each affected PositionSlot has filled_headcount decremented and status re-derived"
          - "every ShiftBid of this member with status IN {SUBMITTED, WAITLISTED} transitions to DECLINED_BY_SYSTEM with decision_reason 'MEMBER_SUSPENDED'"

      - from: PROBATION
        to: SUSPENDED
        trigger: "POST /staff-members/{id}/status-change {target_status: SUSPENDED}"
        actor: StaffingCoordinator
        preconditions:
          - "StaffMember.status == PROBATION"
        side_effects:
          - "identical removal cascade to ACTIVE_to_SUSPENDED"

      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /staff-members/{id}/status-change {target_status: ACTIVE}"
        actor: StaffingCoordinator
        preconditions:
          - "StaffMember.status == SUSPENDED"
        side_effects:
          - "in_backfill_pool = true"
        note: "Deliberate asymmetry: reinstating from SUSPENDED carries no reliability floor, reinstating from PROBATION does."

      - from: ACTIVE
        to: TERMINATED
        trigger: "POST /staff-members/{id}/status-change {target_status: TERMINATED}"
        actor: StaffingCoordinator
        preconditions:
          - "StaffMember.status == ACTIVE"
        side_effects:
          - "identical removal cascade to ACTIVE_to_SUSPENDED"

      - from: PROBATION
        to: TERMINATED
        trigger: "POST /staff-members/{id}/status-change {target_status: TERMINATED}"
        actor: StaffingCoordinator
        preconditions:
          - "StaffMember.status == PROBATION"
        side_effects:
          - "identical removal cascade to ACTIVE_to_SUSPENDED"

      - from: SUSPENDED
        to: TERMINATED
        trigger: "POST /staff-members/{id}/status-change {target_status: TERMINATED}"
        actor: StaffingCoordinator
        preconditions:
          - "StaffMember.status == SUSPENDED"
        side_effects:
          - "in_backfill_pool = false"

  - entity: ShiftBid
    initial_state: SUBMITTED
    terminal_states: [AWARDED, DECLINED_BY_SYSTEM, WITHDRAWN]
    shape: branching
    transitions:
      - from: SUBMITTED
        to: AWARDED
        trigger: "POST /shift-bids/{id}/award"
        actor: StaffingCoordinator
        preconditions:
          - "ShiftBid.status == SUBMITTED"
          - "PositionSlot.status != CLOSED and its StaffingPlan.status == ACTIVE"
          - "StaffMember.status == ACTIVE (PROBATION, SUSPENDED and TERMINATED are refused with ERR_STAFF_MEMBER_NOT_ACTIVE)"
          - "the member holds a Certification with status == VALID for every code in position_type.required_certifications (else ERR_CERTIFICATION_MISSING)"
          - "the member has no other non-terminal assignment whose shift window violates the 30-minute rest buffer (else ERR_SHIFT_REST_CONFLICT)"
          - "PositionSlot.filled_headcount < PositionSlot.required_headcount (else ERR_SLOT_CAPACITY_FULL)"
        side_effects:
          - "creates a StaffAssignment with source = BID_AWARD, attendance_status = SCHEDULED, payout_status = PENDING and shift_bid_id = this bid"
          - "PositionSlot.filled_headcount += 1 and PositionSlot.status re-derived"
          - "decided_at = current logical clock, decision_reason = 'MANUAL_AWARD'"

      - from: SUBMITTED
        to: WAITLISTED
        trigger: "POST /position-slots/{id}/run-bid-award"
        actor: system
        preconditions:
          - "ShiftBid.status == SUBMITTED"
          - "the bid passes every eligibility check but remaining capacity (required_headcount - filled_headcount) is already exhausted by higher-ranked bids"
        side_effects:
          - "decision_reason = 'CAPACITY_EXHAUSTED', rank_score set to the bid's computed rank position"
          - "no StaffAssignment is created and filled_headcount does not move"

      - from: WAITLISTED
        to: AWARDED
        trigger: "POST /position-slots/{id}/run-bid-award re-run after capacity was freed"
        actor: system
        preconditions:
          - "ShiftBid.status == WAITLISTED"
          - "PositionSlot.filled_headcount < PositionSlot.required_headcount at the time of the re-run"
          - "the bid still passes every eligibility check"
        side_effects:
          - "same effects as SUBMITTED_to_AWARDED, with decision_reason = 'AUTO_AWARD_RERUN'"

      - from: SUBMITTED
        to: DECLINED_BY_SYSTEM
        trigger: "POST /position-slots/{id}/run-bid-award"
        actor: system
        preconditions:
          - "ShiftBid.status == SUBMITTED"
          - "the bid fails at least one eligibility check (member not ACTIVE, missing/expired certification, or rest-buffer conflict)"
        side_effects:
          - "decision_reason records the first failing check in the order MEMBER_NOT_ACTIVE, CERTIFICATION_MISSING, REST_CONFLICT"
          - "the batch run itself still returns 200 and continues with the remaining bids"

      - from: WAITLISTED
        to: DECLINED_BY_SYSTEM
        trigger: "owning PositionSlot transitioning to CLOSED, owning StaffMember transitioning to SUSPENDED or TERMINATED, or a run-bid-award re-run in which the bid has become ineligible"
        actor: system
        preconditions:
          - "ShiftBid.status == WAITLISTED"
        side_effects:
          - "decision_reason set to PLAN_SUPERSEDED, EVENT_CANCELLED, MEMBER_SUSPENDED or the failing eligibility check"

      - from: SUBMITTED
        to: WITHDRAWN
        trigger: "POST /shift-bids/{id}/withdraw"
        actor: StaffMember
        preconditions:
          - "ShiftBid.status == SUBMITTED"
          - "the authenticated StaffMember identity resolves to ShiftBid.staff_member_id (else ERR_NOT_RESOURCE_OWNER)"
        side_effects:
          - "decision_reason = 'WITHDRAWN_BY_MEMBER'; a fresh bid on the same slot is allowed afterwards because ERR_DUPLICATE_BID only considers non-terminal bids"

      - from: WAITLISTED
        to: WITHDRAWN
        trigger: "POST /shift-bids/{id}/withdraw"
        actor: StaffMember
        preconditions:
          - "ShiftBid.status == WAITLISTED"
          - "the authenticated StaffMember identity resolves to ShiftBid.staff_member_id"
        side_effects:
          - "the bid is skipped by every later run-bid-award"

  - entity: StaffAssignment
    dimension: attendance_status
    initial_state: SCHEDULED
    terminal_states: [COMPLETED, NO_SHOW, RELEASED, CANCELLED]
    shape: parallel
    note: "StaffAssignment carries two independent state dimensions; this machine governs attendance_status and the next one governs payout_status."
    transitions:
      - from: SCHEDULED
        to: CHECKED_IN
        trigger: "POST /staff-assignments/{id}/attendance {action: CHECK_IN}"
        actor: StaffingCoordinator or the owning StaffMember
        preconditions:
          - "attendance_status == SCHEDULED"
          - "Event.status == IN_PROGRESS (else ERR_EVENT_STATE_INVALID)"
          - "PositionSlot.status != CLOSED"
        side_effects:
          - "check_in_at = current logical clock"
          - "late_check_in = true when check_in_at > PositionSlot.shift_start + LATE_GRACE_MINUTES (strictly later; exactly at the grace boundary is on time)"
          - "payout_status is untouched and stays PENDING"

      - from: CHECKED_IN
        to: COMPLETED
        trigger: "POST /staff-assignments/{id}/attendance {action: CHECK_OUT}"
        actor: StaffingCoordinator or the owning StaffMember
        preconditions:
          - "attendance_status == CHECKED_IN"
        side_effects:
          - "checked_out_at = current logical clock; worked_minutes = whole minutes between check_in_at and checked_out_at, truncated toward zero"
          - "base_pay_cents (regular plus overtime in one field) and total_payout_cents computed per calculations.assignment_worked_pay"
          - "payout_status PENDING -> ACCRUED (see state_machines.StaffAssignment.PENDING_to_ACCRUED)"
          - "StaffMember.completed_assignment_count += 1 and both reliability variants recomputed"
          - "PositionSlot.filled_headcount is unchanged: COMPLETED still counts as filled"

      - from: SCHEDULED
        to: NO_SHOW
        trigger: "POST /staff-assignments/{id}/attendance {action: NO_SHOW}"
        actor: StaffingCoordinator
        preconditions:
          - "attendance_status == SCHEDULED"
          - "Event.status == IN_PROGRESS (else ERR_EVENT_STATE_INVALID)"
        side_effects:
          - "cascade link 1: attendance_status = NO_SHOW and payout_status -> VOIDED, total_payout_cents = 0"
          - "cascade link 2: PositionSlot.filled_headcount -= 1 and PositionSlot.status re-derived; a BackfillRequest is created with status OPEN, reason NO_SHOW and triggering_assignment_id = this assignment"
          - "cascade link 3: StaffMember.no_show_strikes += 1 and both reliability variants recomputed"
          - "cascade link 4: if the ROLLING_WINDOW reliability score is now < 65 the member transitions ACTIVE -> PROBATION and in_backfill_pool = false"
          - "cascade link 5: on that PROBATION transition, the member's other SCHEDULED assignments on slots requiring ELEVATOR_OPERATION are CANCELLED and their slots' filled_headcount and status re-derived"

      - from: SCHEDULED
        to: RELEASED
        trigger: "POST /staff-assignments/{id}/attendance {action: RELEASE}"
        actor: StaffingCoordinator
        preconditions:
          - "attendance_status == SCHEDULED"
          - "PositionSlot.status != CLOSED"
        side_effects:
          - "payout_status -> VOIDED and total_payout_cents = 0"
          - "PositionSlot.filled_headcount -= 1 and PositionSlot.status re-derived, restoring the invariant filled_headcount == count of assignments in {SCHEDULED, CHECKED_IN, COMPLETED}"
          - "if source == BACKFILL, the originating BackfillRequest transitions FILLED -> OPEN with selected_staff_member_id = null and filled_assignment_id = null (compensation)"
          - "StaffMember.no_show_strikes, reliability_score and season_reliability_score are NOT changed: RELEASED rows are outside the reliability input set"

      - from: SCHEDULED
        to: CANCELLED
        trigger: "cascade from StaffingPlan -> SUPERSEDED/VOIDED, PositionSlot -> CLOSED, or StaffMember -> PROBATION/SUSPENDED/TERMINATED"
        actor: system
        preconditions:
          - "attendance_status == SCHEDULED"
        side_effects:
          - "payout_status -> VOIDED; PositionSlot.filled_headcount -= 1 and status re-derived; no BackfillRequest is opened"

      - from: CHECKED_IN
        to: CANCELLED
        trigger: "cascade from StaffingPlan -> SUPERSEDED/VOIDED or PositionSlot -> CLOSED"
        actor: system
        preconditions:
          - "attendance_status == CHECKED_IN"
        side_effects:
          - "payout_status -> VOIDED even though check_in_at is set; worked_minutes stays null"

      - from: SCHEDULED
        to: RELEASED
        trigger: "POST /events/{id}/lifecycle {target_status: CLOSED}"
        actor: system
        preconditions:
          - "attendance_status == SCHEDULED at the moment the event closes"
        side_effects:
          - "payout_status -> VOIDED; PositionSlot.filled_headcount -= 1 and status re-derived; no BackfillRequest is opened and no reliability recompute happens"

  - entity: StaffAssignment
    dimension: payout_status
    initial_state: PENDING
    terminal_states: [PAID, VOIDED]
    shape: parallel
    transitions:
      - from: PENDING
        to: ACCRUED
        trigger: "POST /staff-assignments/{id}/attendance {action: CHECK_OUT}"
        actor: system
        preconditions:
          - "attendance_status transitions CHECKED_IN -> COMPLETED in the same request"
        side_effects:
          - "base_pay_cents and total_payout_cents are frozen at their computed values"

      - from: ACCRUED
        to: GRATUITY_ALLOCATED
        trigger: "POST /events/{id}/payout-run {phase: GRATUITY_ALLOCATION}"
        actor: GuestExperienceDirector
        preconditions:
          - "payout_status == ACCRUED"
          - "PositionSlot.position_type.is_tip_eligible == true AND StaffMember.employment_type == CONTRACTED"
        side_effects:
          - "gratuity_cents set per calculations.gratuity_pool_allocation and total_payout_cents = base_pay_cents + gratuity_cents"

      - from: ACCRUED
        to: PAID
        trigger: "POST /events/{id}/payout-run {phase: PAYROLL}"
        actor: GuestExperienceDirector
        preconditions:
          - "payout_status == ACCRUED"
          - "the row is not gratuity-eligible, so it never needed the GRATUITY_ALLOCATION phase"
        side_effects:
          - "gratuity_cents stays 0 and total_payout_cents keeps its accrued value"

      - from: GRATUITY_ALLOCATED
        to: PAID
        trigger: "POST /events/{id}/payout-run {phase: PAYROLL}"
        actor: GuestExperienceDirector
        preconditions:
          - "payout_status == GRATUITY_ALLOCATED"
        side_effects:
          - "the row becomes immutable: no further attendance or payout transition is accepted"

      - from: PENDING
        to: VOIDED
        trigger: "attendance transition to NO_SHOW, RELEASED or CANCELLED"
        actor: system
        preconditions:
          - "payout_status == PENDING"
        side_effects:
          - "total_payout_cents = 0 and the row is excluded from every payout-run phase"

  - entity: BackfillRequest
    initial_state: OPEN
    terminal_states: [FILLED, UNFILLABLE, CANCELLED]
    shape: cyclic
    transitions:
      - from: OPEN
        to: FILLED
        trigger: "POST /backfill-requests/{id}/auto-fill"
        actor: StaffingCoordinator
        preconditions:
          - "BackfillRequest.status == OPEN"
          - "PositionSlot.status != CLOSED and its StaffingPlan.status IN {ACTIVE, LOCKED}"
          - "calculations.backfill_candidate_selection returns at least one candidate"
        side_effects:
          - "creates a StaffAssignment with source = BACKFILL, attendance_status = SCHEDULED, payout_status = PENDING for the winning candidate"
          - "selected_staff_member_id and filled_assignment_id set; attempt_count += 1"
          - "PositionSlot.filled_headcount += 1 and PositionSlot.status re-derived"

      - from: OPEN
        to: UNFILLABLE
        trigger: "POST /backfill-requests/{id}/auto-fill with an empty candidate set"
        actor: StaffingCoordinator
        preconditions:
          - "BackfillRequest.status == OPEN"
          - "calculations.backfill_candidate_selection returns no candidate"
        side_effects:
          - "attempt_count += 1; selected_staff_member_id stays null; the response is 200, not an error"
          - "PositionSlot transitions to UNDERSTAFFED_ESCALATED"

      - from: FILLED
        to: OPEN
        trigger: "POST /staff-assignments/{id}/attendance {action: RELEASE} on the assignment this request created"
        actor: system
        preconditions:
          - "BackfillRequest.status == FILLED"
          - "the released assignment's id == filled_assignment_id"
        side_effects:
          - "selected_staff_member_id = null and filled_assignment_id = null; attempt_count is NOT decremented"

      - from: OPEN
        to: CANCELLED
        trigger: "POST /backfill-requests/{id}/cancel"
        actor: StaffingCoordinator
        preconditions:
          - "BackfillRequest.status == OPEN"
        side_effects:
          - "later auto-fill attempts are refused with ERR_BACKFILL_NOT_OPEN"

  - entity: GuestIssue
    initial_state: OPEN
    terminal_states: [CLOSED]
    shape: cyclic
    transitions:
      - from: OPEN
        to: IN_PROGRESS
        trigger: "POST /guest-issues/{id}/assign"
        actor: GuestServicesSupervisor
        preconditions:
          - "GuestIssue.status == OPEN"
          - "Event.status == IN_PROGRESS (else ERR_EVENT_STATE_INVALID)"
          - "the target StaffMember.status == ACTIVE (else ERR_STAFF_MEMBER_NOT_ACTIVE)"
          - "the target member holds a Certification with status == VALID for CODE_OF_CONDUCT (else ERR_CERTIFICATION_MISSING)"
        side_effects:
          - "assigned_staff_member_id set; sla_clock_started_at and sla_deadline are NOT restarted by an assignment"
          - "sla_breached recomputed against the unchanged sla_deadline per calculations.guest_issue_sla"

      - from: IN_PROGRESS
        to: RESOLVED
        trigger: "POST /guest-issues/{id}/resolve"
        actor: GuestServicesSupervisor
        preconditions:
          - "GuestIssue.status == IN_PROGRESS"
          - "resolution_type is permitted for category (else ERR_RESOLUTION_TYPE_MISMATCH)"
          - "when resolution_type == REFUND, refund_status IN {APPROVED, PARTIALLY_APPROVED} (else ERR_REFUND_STATE_INVALID)"
          - "when resolution_type == SEAT_RELOCATION, relocation_zone_code is non-null"
        side_effects:
          - "resolved_at = current logical clock; sla_breached frozen at its computed value"
          - "the issue becomes eligible for GET /events/{id}/satisfaction-summary"

      - from: IN_PROGRESS
        to: AWAITING_AUTHORIZATION
        trigger: "POST /guest-issues/{id}/refund-decision {decision: APPROVE} issued by a GuestServicesSupervisor whose effective cap is below refund_requested_cents"
        actor: system
        preconditions:
          - "GuestIssue.status == IN_PROGRESS"
          - "calculations.refund_authorized_amount yields refund_status == PARTIALLY_APPROVED because the actor's role cap, not the event budget, was the binding constraint"
        side_effects:
          - "refund_approved_cents set to the capped amount and Event.refund_budget_remaining_cents reduced by exactly that amount"
          - "refund_decided_by_user_id = the deciding operator's X-User-ID; resolve is refused from this state with ERR_ISSUE_STATE_INVALID until a Director acts"

      - from: AWAITING_AUTHORIZATION
        to: RESOLVED
        trigger: "POST /guest-issues/{id}/refund-decision {decision: APPROVE} issued by a GuestExperienceDirector"
        actor: GuestExperienceDirector
        preconditions:
          - "GuestIssue.status == AWAITING_AUTHORIZATION"
          - "the recomputed authorized amount under the Director cap is >= the amount already recorded"
        side_effects:
          - "refund_approved_cents is REPLACED (not added to) by the Director-capped amount and Event.refund_budget_remaining_cents is adjusted by the delta only"
          - "refund_status becomes APPROVED when the full request is covered, otherwise stays PARTIALLY_APPROVED"
          - "resolution_type = REFUND and resolved_at = current logical clock"

      - from: OPEN
        to: ESCALATED
        trigger: "POST /guest-issues/{id}/escalate"
        actor: GuestServicesSupervisor
        preconditions:
          - "GuestIssue.status IN {OPEN, IN_PROGRESS}"
          - "sla_breached == true at the current logical clock (else ERR_ISSUE_STATE_INVALID)"
        side_effects:
          - "a NEW GuestIssue is created with escalated_from_issue_id = this issue, severity CRITICAL, sla_minutes 5, status OPEN and the same event_id, category, channel and seat_reference"
          - "only a GuestExperienceDirector may resolve this issue from ESCALATED"

      - from: IN_PROGRESS
        to: ESCALATED
        trigger: "POST /guest-issues/{id}/escalate"
        actor: GuestServicesSupervisor
        preconditions:
          - "GuestIssue.status == IN_PROGRESS"
          - "sla_breached == true at the current logical clock"
        side_effects:
          - "the same child GuestIssue is created; assigned_staff_member_id is retained on the parent"

      - from: ESCALATED
        to: RESOLVED
        trigger: "POST /guest-issues/{id}/resolve"
        actor: GuestExperienceDirector
        preconditions:
          - "GuestIssue.status == ESCALATED"
          - "the same resolution_type and refund preconditions as IN_PROGRESS_to_RESOLVED"
        side_effects:
          - "resolved_at and resolved_by_user_id set; a GuestServicesSupervisor attempting this gets ERR_ROLE_NOT_PERMITTED"

      - from: RESOLVED
        to: REOPENED
        trigger: "POST /guest-issues/{id}/reopen"
        actor: GuestServicesSupervisor
        preconditions:
          - "GuestIssue.status == RESOLVED"
          - "current logical clock - resolved_at <= 1440 minutes (exactly 1440 is still inside the window; else ERR_REOPEN_WINDOW_CLOSED)"
          - "reopen_count < 2 (else ERR_REOPEN_LIMIT_REACHED)"
        side_effects:
          - "reopen_count += 1; resolved_at, resolution_type and resolved_by_user_id reset to null; refund_approved_cents and the event budget are NOT touched"

      - from: REOPENED
        to: IN_PROGRESS
        trigger: "POST /guest-issues/{id}/assign"
        actor: GuestServicesSupervisor
        preconditions:
          - "GuestIssue.status == REOPENED"
          - "the target StaffMember.status == ACTIVE and holds a VALID CODE_OF_CONDUCT certification"
        side_effects:
          - "sla_clock_started_at is preserved from the original filing; sla_breached is recomputed against the unchanged sla_deadline"

      - from: RESOLVED
        to: CLOSED
        trigger: "POST /guest-issues/{id}/close"
        actor: GuestServicesSupervisor
        preconditions:
          - "GuestIssue.status == RESOLVED"
          - "current logical clock - resolved_at > 1440 minutes (strictly outside the reopen window; else ERR_REOPEN_WINDOW_CLOSED)"
        side_effects:
          - "the issue is frozen: reopen, resolve and refund-decision all return ERR_ISSUE_STATE_INVALID afterwards"

  - entity: AccessibilityRequest
    initial_state: REQUESTED
    terminal_states: [COMPLETED, DENIED, CANCELLED]
    shape: branching
    note: "Cancelling an Event deliberately does NOT cascade to accessibility requests; they must be cancelled explicitly, and CONFIRMED rows keep occupying resource capacity until then."
    transitions:
      - from: REQUESTED
        to: CONFIRMED
        trigger: "POST /accessibility-requests/{id}/transition {target_status: CONFIRMED}"
        actor: GuestServicesSupervisor
        preconditions:
          - "AccessibilityRequest.status == REQUESTED"
          - "Event.status IN {PLANNED, IN_PROGRESS} (else ERR_EVENT_STATE_INVALID)"
          - "AccessibilityResource.status == AVAILABLE (else ERR_RESOURCE_NOT_AVAILABLE)"
          - "calculations.accessibility_peak_occupancy over the half-open window [window_start, window_end) stays <= AccessibilityResource.unit_count once this request's units_requested is counted (else ERR_ACCESSIBILITY_CAPACITY_EXCEEDED)"
        side_effects:
          - "confirmed_at = current logical clock; AccessibilityResource.peak_committed_units recomputed with this request's units_requested included"

      - from: CONFIRMED
        to: IN_SERVICE
        trigger: "POST /accessibility-requests/{id}/transition {target_status: IN_SERVICE}"
        actor: GuestServicesSupervisor
        preconditions:
          - "AccessibilityRequest.status == CONFIRMED"
          - "Event.status == IN_PROGRESS (else ERR_EVENT_STATE_INVALID)"
          - "AccessibilityResource.status == AVAILABLE (else ERR_RESOURCE_NOT_AVAILABLE)"
        side_effects:
          - "service_started_at = current logical clock; the request keeps occupying units_requested of the pool"

      - from: IN_SERVICE
        to: COMPLETED
        trigger: "POST /accessibility-requests/{id}/transition {target_status: COMPLETED}"
        actor: GuestServicesSupervisor
        preconditions:
          - "AccessibilityRequest.status == IN_SERVICE"
        side_effects:
          - "completed_at = current logical clock; the request stops counting toward peak_committed_units, so a previously refused overlapping request can now be confirmed"

      - from: REQUESTED
        to: DENIED
        trigger: "POST /accessibility-requests/{id}/transition {target_status: DENIED}"
        actor: GuestServicesSupervisor
        preconditions:
          - "AccessibilityRequest.status == REQUESTED"
          - "denial_reason is non-null"
        side_effects:
          - "the request never counted toward peak_committed_units, so nothing is released"

      - from: REQUESTED
        to: CANCELLED
        trigger: "POST /accessibility-requests/{id}/transition {target_status: CANCELLED}"
        actor: GuestServicesSupervisor
        preconditions:
          - "AccessibilityRequest.status == REQUESTED"
        side_effects:
          - "no capacity is released because a REQUESTED row never held any units"

      - from: CONFIRMED
        to: CANCELLED
        trigger: "POST /accessibility-requests/{id}/transition {target_status: CANCELLED}"
        actor: GuestServicesSupervisor
        preconditions:
          - "AccessibilityRequest.status == CONFIRMED"
        side_effects:
          - "capacity is released immediately: AccessibilityResource.peak_committed_units for the overlapping window drops by units_requested"

# =============================================================================
# §1.2.1 Concurrency Rules (optimistic concurrency control)
# =============================================================================
concurrency_rules:
  - rule_id: plan-activate-stale-event
    parent_entity: Event
    child_entity: StaffingPlan
    write_endpoint: "POST /staffing-plans/{id}/activate"
    occ_field: expected_event_version
    version_source: "Event.version, returned by GET /events/{id}"
    error_id: ERR_STALE_EVENT_VERSION
    http_status: 412
    increments_version: true
    description: >-
      Activating a staffing plan reprices the whole event-day labour commitment and supersedes any
      previously ACTIVE plan, so the request must carry the Event.version the caller last read.
      When expected_event_version != Event.version the request is refused with ERR_STALE_EVENT_VERSION
      (412) and nothing mutates: the plan stays DRAFT, the incumbent plan stays ACTIVE and
      Event.version does not move. A successful activation increments Event.version by exactly 1,
      so a second activation replaying the same expected_event_version is refused.
    checked_after:
      - "authentication (ERR_UNAUTHENTICATED, priority 1)"
      - "role authorization (ERR_ROLE_NOT_PERMITTED, priority 2)"
      - "request schema validation (ERR_VALIDATION_FAILED, priority 3)"
      - "path and body foreign-key existence (priority 4 and 5)"
    checked_before:
      - "plan and event state checks (ERR_PLAN_STATE_INVALID / ERR_EVENT_STATE_INVALID, priority 9)"

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
# Money is integer cents everywhere. Every non-integral intermediate is a Decimal, quantized with
# ROUND_HALF_UP at the step the rule names — never with float arithmetic and never with banker's
# rounding. No calculation, selector, tie-break or allocation order reads a UUID / `id`; the
# deterministic fallback key is always `created_at`.
calculations:
  - name: event_attendance_tier
    trigger: "On Event create and on PATCH /events when expected_attendance changes; also invoked on a StaffingPlan's basis_attendance at plan creation"
    algorithm: threshold
    formula: |
      def attendance_tier(attendance: int) -> (str, Decimal):
          if attendance >= 40000: return ("TIER_4", Decimal("1.45"))
          if attendance >= 25000: return ("TIER_3", Decimal("1.25"))
          if attendance >= 12000: return ("TIER_2", Decimal("1.10"))
          return ("TIER_1", Decimal("1.00"))
      # Event.attendance_tier      = attendance_tier(Event.expected_attendance)[0]
      # StaffingPlan.basis_attendance_tier = attendance_tier(StaffingPlan.basis_attendance)[0]
    input_set: "A single integer attendance number; no entity filtering"
    constants:
      TIER_4_FLOOR: 40000
      TIER_3_FLOOR: 25000
      TIER_2_FLOOR: 12000
      TIER_4_MULTIPLIER: 1.45
      TIER_3_MULTIPLIER: 1.25
      TIER_2_MULTIPLIER: 1.10
      TIER_1_MULTIPLIER: 1.00
    precision: "Multipliers are exact 2-decimal Decimals; comparisons are inclusive at the floor (>=), so 40000 is TIER_4 and 39999 is TIER_3"

  - name: position_slot_required_headcount
    trigger: "On POST /position-slots, on PATCH /position-slots/{id} when the shift window or override changes, and on every recompute triggered by PATCH /events while the owning plan is DRAFT or ACTIVE"
    algorithm: threshold
    formula: |
      # step 1 - basis attendance is fixed by the owning plan's variant, NOT by the event's tier
      basis = StaffingPlan.basis_attendance
      tier, tier_multiplier = attendance_tier(basis)          # calculations.event_attendance_tier
      # step 2 - ratio math in Decimal, quantized to 4dp BEFORE the ceiling
      raw = (Decimal(basis) / Decimal(1000)
             * Decimal(str(PositionType.attendance_ratio_per_1000))
             * tier_multiplier).quantize(Decimal("0.0001"), ROUND_HALF_UP)
      ratio_derived_headcount = int(raw.to_integral_value(ROUND_CEILING))
      # step 3 - the PositionType floor applies to the ratio result, never to the override
      ratio_derived_headcount = max(ratio_derived_headcount, PositionType.min_headcount)
      # step 4 - an operator override replaces the ratio result outright
      required_headcount = (PositionSlot.required_headcount_override
                            if PositionSlot.required_headcount_override is not None
                            else ratio_derived_headcount)
      shift_minutes = int((shift_end - shift_start).total_seconds() // 60)
    input_set: "The owning StaffingPlan (for basis_attendance) and the referenced PositionType; no other slots participate"
    constants:
      RATIO_QUANTIZE_PLACES: 4
      HEADCOUNT_ROUNDING: CEILING
    precision: "4-decimal ROUND_HALF_UP quantize, then ceiling to an integer. The order matters: 46.87504 quantizes to 46.8750 and ceils to 47, while ceiling a raw float first would also give 47 but 47.00004 must quantize to 47.0000 and ceil to 47, not 48."
    variants:
      - name: FORECAST_BASED
        when: "StaffingPlan.plan_variant == FORECAST_BASED"
        difference: "basis_attendance = Event.expected_attendance. Always available, so the plan can be created before any turnstile data exists."
      - name: HISTORICAL_ACTUAL
        when: "StaffingPlan.plan_variant == HISTORICAL_ACTUAL"
        difference: "basis_attendance = Event.historical_actual_attendance, which also re-selects the tier multiplier from that number. When historical_actual_attendance is null the plan cannot be created (ERR_HISTORICAL_ATTENDANCE_MISSING). Identical event + PositionType data therefore yields a different required_headcount per variant: expected 40000 (TIER_4, x1.45) gives an USHER slot 87 while historical 25000 (TIER_3, x1.25) gives 47."

  - name: staffing_plan_projected_labor_cost
    trigger: "On POST /position-slots, PATCH /position-slots/{id}, DELETE /position-slots/{id}, POST /staffing-plans/{id}/activate, and whenever a slot's status changes to or from CLOSED"
    algorithm: tiered_pricing
    formula: |
      # PINNED ORDER - each step consumes the rounded output of the previous one.
      slots = [s for s in plan.position_slots if s.status != "CLOSED"]     # ordered by created_at ASC
      # step 1 - per-slot straight-time cost, rounded to whole cents ONE SLOT AT A TIME
      for s in slots:
          s.slot_labor_cost_cents = int((Decimal(s.required_headcount)
                                         * Decimal(s.position_type.base_hourly_rate_cents)
                                         * Decimal(s.shift_minutes) / Decimal(60)
                                        ).quantize(Decimal("1"), ROUND_HALF_UP))
      # step 2 - sum the ALREADY ROUNDED per-slot costs (never sum the exact products)
      base_labor_cost_cents = sum(s.slot_labor_cost_cents for s in slots)
      # step 3 - headcount total is independent of money
      total_required_headcount = sum(s.required_headcount for s in slots)
      # step 4 - the surcharge tier is chosen from the PLAN-LEVEL headcount total, never per slot
      if   total_required_headcount >= 300: surcharge_bp = 900
      elif total_required_headcount >= 150: surcharge_bp = 600
      elif total_required_headcount >=  60: surcharge_bp = 350
      else:                                 surcharge_bp = 0
      # step 5 - surcharge on the rounded base, rounded again
      accessibility_surcharge_cents = int((Decimal(base_labor_cost_cents) * Decimal(surcharge_bp)
                                          / Decimal(10000)).quantize(Decimal("1"), ROUND_HALF_UP))
      # step 6 - the surcharge NEVER re-enters step 3 or step 4
      projected_labor_cost_cents = base_labor_cost_cents + accessibility_surcharge_cents
    input_set: "PositionSlot rows of this plan whose status != CLOSED; CLOSED slots drop out of all four aggregates, which is why superseding a plan zeroes them"
    constants:
      SURCHARGE_TIER_3_FLOOR: 300
      SURCHARGE_TIER_2_FLOOR: 150
      SURCHARGE_TIER_1_FLOOR: 60
      SURCHARGE_TIER_3_BP: 900
      SURCHARGE_TIER_2_BP: 600
      SURCHARGE_TIER_1_BP: 350
      SURCHARGE_TIER_0_BP: 0
    precision: >-
      Whole cents, ROUND_HALF_UP, applied twice: once per slot in step 1 and once on the plan-level
      surcharge in step 5. Rounding per slot and then summing is observably different from summing
      exact products and rounding once - two slots each costing 20833.3333 cents round to 20833 each
      (sum 41666) whereas the exact sum 41666.6667 would round to 41667.

  - name: staff_member_reliability_score
    trigger: "After every StaffAssignment attendance transition into COMPLETED or NO_SHOW; recomputed for the assignment's staff member only"
    algorithm: weighted_scoring
    formula: |
      # input rows: the member's assignments that actually happened
      rows = [a for a in member.staff_assignments
                if a.attendance_status in ("COMPLETED", "NO_SHOW")]
      rows.sort(key=lambda a: (a.position_slot.shift_start, a.created_at), reverse=True)
      def score(subset):
          no_shows   = sum(1 for a in subset if a.attendance_status == "NO_SHOW")
          completed  = sum(1 for a in subset if a.attendance_status == "COMPLETED")
          lates      = sum(1 for a in subset if a.attendance_status == "COMPLETED" and a.late_check_in)
          raw = 100 - 25 * no_shows - 8 * lates + 3 * completed
          return max(0, min(100, raw))
      member.reliability_score        = score(rows[:3])   # ROLLING_WINDOW
      member.season_reliability_score = score(rows)       # SEASON_TO_DATE
      # PROBATION gate reads reliability_score ONLY
      if member.status == "ACTIVE" and member.reliability_score < 65:
          -> state_machines.StaffMember.ACTIVE_to_PROBATION
    input_set: >-
      Only assignments with attendance_status IN {COMPLETED, NO_SHOW}. SCHEDULED, CHECKED_IN,
      RELEASED and CANCELLED rows are excluded, so releasing a member from a shift never moves
      either score while marking the same shift NO_SHOW moves both.
    constants:
      ROLLING_WINDOW_SIZE: 3
      NO_SHOW_PENALTY: 25
      LATE_PENALTY: 8
      COMPLETED_CREDIT: 3
      SCORE_FLOOR: 0
      SCORE_CEILING: 100
      RELIABILITY_PROBATION_FLOOR: 65
      LATE_GRACE_MINUTES: 5
    precision: "Integer arithmetic, clamped to 0..100. The clamp is observable: five NO_SHOW rows give a raw -25 that is stored as 0, not -25."
    variants:
      - name: ROLLING_WINDOW
        when: "Always computed; stored in StaffMember.reliability_score and used by the PROBATION gate, by ShiftBid.rank_score and by backfill ranking"
        difference: "Considers only the 3 most recent rows ordered by PositionSlot.shift_start DESC, then StaffAssignment.created_at DESC. Older no-shows fall out of the window and stop hurting the member."
      - name: SEASON_TO_DATE
        when: "Always computed; stored in StaffMember.season_reliability_score and reported by GET /staff-members/{id}, never gating"
        difference: >-
          Considers every qualifying row. Identical data diverges: a member whose three most recent
          rows are NO_SHOW, COMPLETED, COMPLETED and whose three older rows are NO_SHOW, NO_SHOW,
          COMPLETED scores 81 rolling (100 - 25 + 6) and 34 season (100 - 75 + 9), so the member
          stays ACTIVE despite a season score far below the 65 floor.

  - name: backfill_candidate_selection
    trigger: "POST /backfill-requests/{id}/auto-fill"
    algorithm: eligibility_ranking
    formula: |
      slot = request.position_slot
      required = slot.position_type.required_certifications
      candidates = []
      for m in all_staff_members:                       # scanned in created_at ASC order
          if m.status != "ACTIVE":                       continue
          if not m.in_backfill_pool:                     continue
          if m.id == request.triggering_assignment.staff_member_id: continue
          if any(not m.has_valid_cert(c) for c in required):        continue
          if m.has_non_terminal_assignment_on(slot):     continue
          if m.violates_rest_buffer(slot):               continue   # see ERR_SHIFT_REST_CONFLICT
          candidates.append(m)
      candidates.sort(key=lambda m: (-m.reliability_score, m.seniority_date, m.created_at))
      winner = candidates[0] if candidates else None
      # empty pool is a legitimate 200 outcome, not an error:
      #   BackfillRequest OPEN -> UNFILLABLE and PositionSlot -> UNDERSTAFFED_ESCALATED
    input_set: >-
      Every StaffMember with status == ACTIVE and in_backfill_pool == true who holds a VALID
      Certification for each of the slot's PositionType.required_certifications, excluding the
      member who no-showed and anyone whose existing non-terminal assignments collide with the
      slot window plus the rest buffer.
    constants:
      REST_BUFFER_MINUTES: 30
    precision: >-
      Ranking keys in order: reliability_score DESC, seniority_date ASC (earlier hire wins),
      created_at ASC. `id` is never consulted, so the winner is reproducible across runs.

  - name: assignment_worked_pay
    trigger: "POST /staff-assignments/{id}/attendance {action: CHECK_OUT}"
    algorithm: threshold
    formula: |
      worked_minutes = int((checked_out_at - check_in_at).total_seconds() // 60)   # truncated
      rate = StaffMember.hourly_rate_cents          # the MEMBER's rate, not the PositionType rate
      regular_minutes  = min(worked_minutes, 480)
      overtime_minutes = max(worked_minutes - 480, 0)
      regular_cents  = int((Decimal(regular_minutes)  * rate / Decimal(60)
                           ).quantize(Decimal("1"), ROUND_HALF_UP))
      overtime_cents = int((Decimal(overtime_minutes) * rate / Decimal(60) * Decimal("1.5")
                           ).quantize(Decimal("1"), ROUND_HALF_UP))
      base_pay_cents    = regular_cents + overtime_cents
      total_payout_cents = base_pay_cents + gratuity_cents     # gratuity_cents is still 0 here
    input_set: "The single assignment being checked out; its member supplies the rate and its slot supplies nothing but the lateness reference"
    constants:
      OVERTIME_THRESHOLD_MINUTES: 480
      OVERTIME_MULTIPLIER: 1.5
    precision: >-
      Whole cents, ROUND_HALF_UP, computed separately for the regular and overtime components and
      then added - not on the blended total. Boundary: exactly 480 worked minutes at 2600 cents/h
      pays 20800 with zero overtime, and 481 minutes pays 20800 + 65 = 20865.

  - name: gratuity_pool_allocation
    trigger: "POST /events/{id}/payout-run {phase: GRATUITY_ALLOCATION}"
    algorithm: waterfall_allocation
    formula: |
      eligible = [a for a in event.staff_assignments
                    if a.payout_status == "ACCRUED"
                   and a.position_slot.position_type.is_tip_eligible
                   and a.position_slot.position_type.is_contracted_position
                   and a.staff_member.employment_type == "CONTRACTED"]
      eligible.sort(key=lambda a: (-a.worked_minutes, a.staff_member.seniority_date, a.created_at))
      total_weight = sum(a.worked_minutes for a in eligible)
      if not eligible or total_weight == 0:
          return   # nothing allocated; Event.gratuity_allocated_cents stays put
      pool = event.gratuity_pool_cents - event.gratuity_allocated_cents
      floors = []
      for a in eligible:
          exact = Decimal(pool) * Decimal(a.worked_minutes) / Decimal(total_weight)
          floors.append(int(exact.to_integral_value(ROUND_FLOOR)))
      remainder = pool - sum(floors)                    # 0 <= remainder < len(eligible)
      for i in range(remainder):                       # ranking order, NOT largest-fraction order
          floors[i] += 1
      # assign, then: a.gratuity_cents = floors[i]; a.total_payout_cents = base_pay_cents + gratuity_cents
      # a.payout_status: ACCRUED -> GRATUITY_ALLOCATED ; event.gratuity_allocated_cents += pool
    input_set: >-
      StaffAssignment rows of the event with payout_status == ACCRUED whose PositionType is both
      is_tip_eligible and is_contracted_position AND whose StaffMember.employment_type ==
      CONTRACTED. PART_TIME_EMPLOYEE members on a tip-eligible position are excluded and receive
      gratuity_cents 0.
    constants:
      REMAINDER_RULE: "ranking_order_first"
    precision: >-
      Every share is floored, then the leftover cents are handed out one each down the ranking
      order (worked_minutes DESC, seniority_date ASC, created_at ASC) - deliberately NOT to the
      largest fractional parts. Pool 50000 over weights 480 and 300 gives exact shares
      30769.2307... and 19230.769..., floors 30769 and 19230, remainder 1, and that cent goes to
      the 480-minute row (30770 / 19230) even though the 300-minute row had the larger fraction.
      Sum of allocated cents always equals the pool exactly.

  - name: refund_authorized_amount
    trigger: "POST /guest-issues/{id}/refund-decision {decision: APPROVE}"
    algorithm: threshold
    formula: |
      role_cap = {"GuestServicesSupervisor": 5000, "GuestExperienceDirector": 50000}[actor_role]
      uplift_bp = {"CRITICAL": 5000, "HIGH": 2500, "MEDIUM": 0, "LOW": 0}[issue.severity]
      effective_cap = role_cap + int((Decimal(role_cap) * Decimal(uplift_bp) / Decimal(10000)
                                     ).quantize(Decimal("1"), ROUND_HALF_UP))
      if issue.category == "SEAT_RELOCATION":
          effective_cap = min(effective_cap, 2500)          # hard cap, applied AFTER the uplift
      # the issue's own previously recorded approval is returned to the pot before re-deciding
      available = event.refund_budget_remaining_cents + issue.refund_approved_cents
      approved = min(issue.refund_requested_cents, effective_cap, available)
      issue.refund_approved_cents = approved
      issue.refund_status = "APPROVED" if approved == issue.refund_requested_cents else "PARTIALLY_APPROVED"
      # ledger, always recomputed from scratch - see calculations.event_refund_budget_ledger
      event.refund_approved_total_cents    = sum(i.refund_approved_cents for i in event.guest_issues
                                                 if i.refund_status in ("APPROVED", "PARTIALLY_APPROVED"))
      event.refund_budget_remaining_cents  = event.refund_budget_total_cents - event.refund_approved_total_cents
      # role-cap-bound partials filed by a supervisor need a director:
      if actor_role == "GuestServicesSupervisor" and effective_cap < min(issue.refund_requested_cents, available):
          -> state_machines.GuestIssue.IN_PROGRESS_to_AWAITING_AUTHORIZATION
    input_set: "The single GuestIssue, its Event budget ledger and the acting role from X-User-Role"
    constants:
      REFUND_CAP_SUPERVISOR_CENTS: 5000
      REFUND_CAP_DIRECTOR_CENTS: 50000
      SEVERITY_UPLIFT_BP_CRITICAL: 5000
      SEVERITY_UPLIFT_BP_HIGH: 2500
      SEVERITY_UPLIFT_BP_MEDIUM: 0
      SEVERITY_UPLIFT_BP_LOW: 0
      SEAT_RELOCATION_HARD_CAP_CENTS: 2500
    precision: >-
      Whole cents, ROUND_HALF_UP on the uplift only. Composition order is pinned: role cap, then
      severity uplift, then the SEAT_RELOCATION hard cap, then the three-way min against the
      request and the available budget. A supervisor on a CRITICAL issue has an effective cap of
      7500 (5000 + 50%), but only 2500 on a SEAT_RELOCATION issue.
    variants:
      - name: SUPERVISOR_DECISION
        when: "X-User-Role == GuestServicesSupervisor"
        difference: "role_cap 5000; a request the cap cannot cover moves the issue to AWAITING_AUTHORIZATION instead of leaving it resolvable."
      - name: DIRECTOR_DECISION
        when: "X-User-Role == GuestExperienceDirector"
        difference: "role_cap 50000; deciding from AWAITING_AUTHORIZATION REPLACES the supervisor's recorded amount (delta-applied to the ledger, never added twice) and resolves the issue in the same request."

  - name: guest_issue_sla
    trigger: "On POST /guest-issues, on POST /guest-issues/{id}/escalate for the child issue, and on every read of a GuestIssue (sla_breached is evaluated against the current logical clock while the issue is unresolved)"
    algorithm: threshold
    formula: |
      # step 1 - severity is computed, never simply stored
      if issue.category in ("LOST_CHILD", "MEDICAL") or issue.escalated_from_issue_id is not None:
          severity = "CRITICAL"                 # the client-supplied severity is discarded
      else:
          severity = client_supplied_severity
      # step 2 - severity picks the allowance
      sla_minutes = {"CRITICAL": 5, "HIGH": 15, "MEDIUM": 45, "LOW": 120}[severity]
      sla_clock_started_at = issue.created_at   # for an escalation child this IS the escalation instant
      sla_deadline = sla_clock_started_at + timedelta(minutes=sla_minutes)
      # step 3 - breach is strict, and freezes at resolution
      reference = issue.resolved_at if issue.resolved_at is not None else current_logical_clock()
      sla_breached = reference > sla_deadline
    input_set: "The single GuestIssue; a REOPENED issue keeps its original sla_clock_started_at, so the clock does not restart"
    constants:
      SLA_MINUTES_CRITICAL: 5
      SLA_MINUTES_HIGH: 15
      SLA_MINUTES_MEDIUM: 45
      SLA_MINUTES_LOW: 120
      REOPEN_WINDOW_MINUTES: 1440
    precision: >-
      Whole minutes, strict comparison. An issue created at 12:00:00Z with severity HIGH has
      sla_deadline 12:15:00Z: resolving at exactly 12:15:00Z leaves sla_breached false, resolving at
      12:16:00Z sets it true. Filing a LOST_CHILD issue with severity LOW stores CRITICAL and
      sla_minutes 5, so the deadline is 12:05:00Z.

  - name: accessibility_peak_occupancy
    trigger: "On AccessibilityRequest transitions into or out of CONFIRMED / IN_SERVICE, and as the capacity gate of REQUESTED -> CONFIRMED"
    algorithm: interval_merge
    formula: |
      def peak(rows):                            # rows = committed requests of ONE resource
          if not rows: return 0
          boundaries = sorted({r.window_start for r in rows} | {r.window_end for r in rows})
          best = 0
          for b in boundaries[:-1]:              # each elementary half-open slice [b, next)
              concurrent = sum(r.units_requested for r in rows
                               if r.window_start <= b < r.window_end)
              best = max(best, concurrent)
          return best
      committed = [r for r in resource.accessibility_requests
                     if r.status in ("CONFIRMED", "IN_SERVICE")]
      resource.peak_committed_units = peak(committed)
      # capacity gate for the candidate request c:
      allowed = peak(committed + [c]) <= resource.unit_count
    input_set: >-
      AccessibilityRequest rows of the same AccessibilityResource with status IN {CONFIRMED,
      IN_SERVICE}. REQUESTED, DENIED, CANCELLED and COMPLETED rows contribute nothing, so completing
      or cancelling a request frees capacity for a previously refused overlapping request.
    constants:
      INTERVAL_SEMANTICS: half_open
    precision: >-
      Half-open intervals [window_start, window_end). Two requests where one ends exactly when the
      other starts are NOT concurrent. On a pool with unit_count 3, three overlapping single-unit
      requests reach peak_committed_units 3 and are all confirmable (<=, not <), while a fourth
      overlapping single-unit request is refused with ERR_ACCESSIBILITY_CAPACITY_EXCEEDED.

  - name: event_refund_budget_ledger
    trigger: "After every POST /guest-issues/{id}/refund-decision (APPROVE, DENY or VOID) and after POST /guest-issues (which files refund_requested_cents without touching the ledger)"
    algorithm: aggregation
    formula: |
      event.refund_approved_total_cents = sum(
          i.refund_approved_cents for i in event.guest_issues
          if i.refund_status in ("APPROVED", "PARTIALLY_APPROVED"))
      event.refund_budget_remaining_cents = (event.refund_budget_total_cents
                                             - event.refund_approved_total_cents)
      # INVARIANT (checked by the compensating-invariant tests):
      #   refund_budget_remaining_cents + refund_approved_total_cents == refund_budget_total_cents
    input_set: >-
      GuestIssue rows of this event with refund_status IN {APPROVED, PARTIALLY_APPROVED}. NONE,
      PENDING, DENIED and VOIDED rows contribute 0, which is what makes an APPROVE followed by a
      VOID restore the ledger to its pre-approval value exactly.
    constants:
      RECOMPUTE_MODE: full_rescan
    precision: "Integer cents; the total is always re-derived by rescanning the event's issues, never adjusted incrementally, so no drift can accumulate across approve / void cycles."

  - name: event_satisfaction_summary
    trigger: "GET /events/{id}/satisfaction-summary"
    algorithm: aggregation
    formula: |
      rows = event.satisfaction_responses                 # immutable, append-only, all counted
      response_count = len(rows)
      if response_count == 0:
          average_score = None; promoter_share_bp = None
      else:
          average_score = (Decimal(sum(r.score for r in rows)) / Decimal(response_count)
                          ).quantize(Decimal("0.01"), ROUND_HALF_UP)
          promoter_share_bp = int((Decimal(sum(1 for r in rows if r.score >= 4)) * Decimal(10000)
                                   / Decimal(response_count)).quantize(Decimal("1"), ROUND_HALF_UP))
      zone_breakdown = [ {"zone_code": z, "response_count": n, "average_score": avg}
                         for z, n, avg in groups ordered by zone_code ASC ]
      issues = event.guest_issues
      resolved_issue_count     = sum(1 for i in issues if i.status in ("RESOLVED", "CLOSED"))
      sla_breached_issue_count = sum(1 for i in issues if i.sla_breached)
    input_set: "Every SatisfactionResponse of the event (there is no soft delete and no update path) plus every GuestIssue of the event for the two issue counters"
    constants:
      PROMOTER_SCORE_FLOOR: 4
    precision: >-
      average_score is quantized to 2 decimals with ROUND_HALF_UP: eight responses summing to 35
      give exactly 4.375, which stores as 4.38 (banker's rounding would give 4.37). An event with no
      responses returns null for average_score and promoter_share_bp, not 0.

  - name: staffing_model_recommendation
    trigger: "GET /events/{id}/staffing-model-recommendation"
    algorithm: aggregation
    formula: |
      require event.status == "CLOSED"                    # else ERR_EVENT_STATE_INVALID
      plan = the event's StaffingPlan with status == "LOCKED"
      slots = [s for s in plan.position_slots if s.status != "CLOSED"]
      understaffed_slot_count = sum(1 for s in plan.position_slots
                                      if s.status == "UNDERSTAFFED_ESCALATED")
      avg = event_satisfaction_summary(event).average_score      # None when no responses
      groups = group slots by position_type_id, emitted ordered by PositionType.code ASC
      for g in groups:
          planned_headcount = sum(s.required_headcount for s in g.slots)
          worked_headcount  = count(assignments on g.slots with attendance_status == "COMPLETED")
          no_show_count     = count(assignments on g.slots with attendance_status == "NO_SHOW")
          fill_rate_bp = int((Decimal(worked_headcount) * Decimal(10000) / Decimal(planned_headcount)
                             ).quantize(Decimal("1"), ROUND_HALF_UP))
          if fill_rate_bp < 8000:
              factor, direction = Decimal("1.10"), "INCREASE"
          elif (no_show_count == 0 and understaffed_slot_count == 0
                and avg is not None and avg >= Decimal("4.5")):
              factor, direction = Decimal("0.95"), "DECREASE"
          else:
              factor, direction = Decimal("1.00"), "HOLD"
          recommended_ratio_per_1000 = (Decimal(str(g.position_type.attendance_ratio_per_1000))
                                        * factor).quantize(Decimal("0.01"), ROUND_HALF_UP)
    input_set: >-
      The event's LOCKED StaffingPlan, its non-CLOSED slots grouped by PositionType, the
      COMPLETED / NO_SHOW assignments on those slots, the plan's UNDERSTAFFED_ESCALATED slot count
      and the event's satisfaction average. Nothing is persisted: this is a pure read.
    constants:
      FILL_RATE_UPLIFT_FLOOR_BP: 8000
      UPLIFT_FACTOR: 1.10
      TRIM_FACTOR: 0.95
      TRIM_SATISFACTION_FLOOR: 4.5
    precision: >-
      fill_rate_bp is whole basis points, ROUND_HALF_UP; the uplift test is strict (< 8000), so a
      slot group with 4 of 5 planned heads worked lands exactly on 8000 and does NOT trigger an
      uplift. recommended_ratio_per_1000 is quantized to 2 decimals ROUND_HALF_UP, so an USHER
      ratio of 1.5 trimmed by 0.95 gives 1.425 -> 1.43 and a GUEST_SERVICES_REP ratio of 0.35
      trimmed gives 0.3325 -> 0.33, while the same ratios uplifted give 1.65 and 0.39.

# =============================================================================
# §1.4 Validation Rules Table (evaluated strictly in ascending priority order)
# =============================================================================
# Exactly one error_id is ever returned: the lowest-priority-number rule whose condition holds.
# Within a single priority, the order stated in `check:` is authoritative (path FKs left to right,
# body FKs in declaration order).
validations:
  - priority: 1
    category: auth
    check: "X-User-Role header present and equal to one of the four roles in §1.7; X-User-ID header present and non-empty on every mutating request"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all

  - priority: 2
    category: auth
    check: "The role in X-User-Role is listed in the endpoint's roles: set"
    error_id: ERR_ROLE_NOT_PERMITTED
    http_status: 403
    applies_to: all

  - priority: 3
    category: validation
    check: "Request body and query schema: required fields present, JSON types correct, enum values in range, integers within their declared constraints (expected_attendance >= 0, units_requested >= 1, score in 1..5, required_headcount_override null or >= 1), pagination limit in 1..100 and offset >= 0"
    error_id: ERR_VALIDATION_FAILED
    http_status: 422
    applies_to: all

  - priority: 4
    category: validation
    check: "Interval fields are strictly ordered: Event.doors_close_at > doors_open_at, PositionSlot.shift_end > shift_start, Certification.expires_on > issued_on, AccessibilityRequest.window_end > window_start"
    error_id: ERR_INVALID_TIME_WINDOW
    http_status: 422
    applies_to: "POST/PATCH /events, POST/PATCH /position-slots, POST /certifications, POST /accessibility-requests"

  - priority: 5
    category: existence
    check: "Every {id} path segment resolves, validated left to right"
    error_id: "ERR_<ENTITY>_NOT_FOUND"
    http_status: 404
    applies_to: "all paths carrying an {id}"

  - priority: 6
    category: existence
    check: "Every foreign key in the request body resolves, validated in the order the fields are declared on the entity in §1.1 (e.g. POST /position-slots checks plan_id before position_type_id)"
    error_id: "ERR_<ENTITY>_NOT_FOUND"
    http_status: 404
    applies_to: "all endpoints whose input carries an FK"

  - priority: 7
    category: auth
    check: "For StaffMember-scoped operations (POST /shift-bids, POST /shift-bids/{id}/withdraw, POST /staff-assignments/{id}/attendance when acted as StaffMember), the identity resolved from X-User-ID must equal the row's staff_member_id"
    error_id: ERR_NOT_RESOURCE_OWNER
    http_status: 403
    applies_to: "POST /shift-bids, POST /shift-bids/{id}/withdraw, POST /staff-assignments/{id}/attendance"

  - priority: 8
    category: auth
    check: "Segregation of duties on refunds: X-User-ID of POST /guest-issues/{id}/refund-decision must differ from GuestIssue.refund_requested_by_user_id and from GuestIssue.reported_by_user_id"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /guest-issues/{id}/refund-decision"

  - priority: 9
    category: concurrency
    check: "expected_event_version equals Event.version (see §1.2.1 plan-activate-stale-event)"
    error_id: ERR_STALE_EVENT_VERSION
    http_status: 412
    applies_to: "POST /staffing-plans/{id}/activate"

  - priority: 10
    category: state
    check: "The target row is in a state from which the requested transition is declared in §1.2: ERR_EVENT_STATE_INVALID (Event lifecycle, PATCH /events after IN_PROGRESS, recommendation read before CLOSED), ERR_PLAN_STATE_INVALID (activate a non-DRAFT plan, add a slot to a non-DRAFT/ACTIVE plan), ERR_SLOT_STATE_INVALID (act on a CLOSED slot), ERR_BID_STATE_INVALID (award/withdraw a terminal bid), ERR_ASSIGNMENT_STATE_INVALID (CHECK_OUT before CHECK_IN, act on a terminal assignment, close an event with a CHECKED_IN assignment), ERR_BACKFILL_NOT_OPEN (auto-fill a non-OPEN request), ERR_ISSUE_STATE_INVALID (assign/resolve/reopen/close/escalate from an undeclared state, escalate without an SLA breach), ERR_ACCESS_REQUEST_STATE_INVALID (undeclared AccessibilityRequest transition)"
    error_id: "ERR_<ENTITY>_STATE_INVALID"
    http_status: 409
    applies_to: "all action endpoints"

  - priority: 11
    category: state
    check: >-
      Cross-entity state gates, evaluated in this order. (a) The parent Event's status permits the
      child operation, else ERR_EVENT_STATE_INVALID: Event.status IN {PLANNED, IN_PROGRESS} for
      POST /shift-bids, POST /shift-bids/{id}/award, POST /staff-assignments,
      POST /backfill-requests/{id}/auto-fill and the REQUESTED -> CONFIRMED accessibility
      transition; exactly IN_PROGRESS for attendance actions CHECK_IN and NO_SHOW, for
      POST /guest-issues/{id}/assign and for the CONFIRMED -> IN_SERVICE transition; unconstrained
      for attendance actions CHECK_OUT and RELEASE, for the remaining accessibility transitions and
      for POST /staff-members/{id}/status-change. (b) Then the referenced StaffMember.status ==
      ACTIVE (ERR_STAFF_MEMBER_NOT_ACTIVE). (c) Then the referenced AccessibilityResource.status ==
      AVAILABLE (ERR_RESOURCE_NOT_AVAILABLE).
    error_id: "ERR_EVENT_STATE_INVALID | ERR_STAFF_MEMBER_NOT_ACTIVE | ERR_RESOURCE_NOT_AVAILABLE"
    http_status: 409
    applies_to: "POST /shift-bids, POST /shift-bids/{id}/award, POST /staff-assignments, POST /staff-assignments/{id}/attendance, POST /backfill-requests/{id}/auto-fill, POST /guest-issues/{id}/assign, POST /accessibility-requests/{id}/transition, POST /staff-members/{id}/status-change"

  - priority: 12
    category: business_safety
    check: "The staff member holds a Certification with status == VALID for every code in the slot's PositionType.required_certifications (and CODE_OF_CONDUCT for a guest-issue responder). Compliance outranks every capacity, temporal and fiscal check below."
    error_id: ERR_CERTIFICATION_MISSING
    http_status: 409
    applies_to: "POST /shift-bids/{id}/award, POST /staff-assignments, POST /guest-issues/{id}/assign"

  - priority: 13
    category: business_constraint
    check: "Uniqueness: no other non-terminal ShiftBid by this member on this slot (ERR_DUPLICATE_BID); no other non-terminal StaffAssignment of this member on this slot (ERR_DUPLICATE_ASSIGNMENT)"
    error_id: "ERR_DUPLICATE_BID | ERR_DUPLICATE_ASSIGNMENT"
    http_status: 409
    applies_to: "POST /shift-bids, POST /staff-assignments, POST /shift-bids/{id}/award"

  - priority: 14
    category: business_temporal
    check: "Rest buffer: the member has no other non-terminal StaffAssignment whose [shift_start, shift_end) comes within REST_BUFFER_MINUTES (30) of the target slot's window. A gap of exactly 30 minutes is allowed; 29 is refused. Checked AFTER the duplicate check, so a second assignment on the very same slot reports ERR_DUPLICATE_ASSIGNMENT rather than the rest conflict it also implies."
    error_id: ERR_SHIFT_REST_CONFLICT
    http_status: 409
    applies_to: "POST /shift-bids/{id}/award, POST /staff-assignments, POST /backfill-requests/{id}/auto-fill (as a candidate filter, not an error)"

  - priority: 15
    category: business_temporal
    check: "Reopen window: POST /guest-issues/{id}/reopen requires current clock - resolved_at <= 1440 minutes; POST /guest-issues/{id}/close requires the mirror condition, strictly > 1440 minutes"
    error_id: ERR_REOPEN_WINDOW_CLOSED
    http_status: 409
    applies_to: "POST /guest-issues/{id}/reopen, POST /guest-issues/{id}/close"

  - priority: 16
    category: business_constraint
    check: "Reopen ceiling: GuestIssue.reopen_count < 2. Checked after the window rule, so an issue that is both past its window and at its ceiling reports ERR_REOPEN_WINDOW_CLOSED."
    error_id: ERR_REOPEN_LIMIT_REACHED
    http_status: 409
    applies_to: "POST /guest-issues/{id}/reopen"

  - priority: 17
    category: business_constraint
    check: "Slot capacity: PositionSlot.filled_headcount < PositionSlot.required_headcount"
    error_id: ERR_SLOT_CAPACITY_FULL
    http_status: 409
    applies_to: "POST /shift-bids/{id}/award, POST /staff-assignments"

  - priority: 18
    category: business_constraint
    check: "Accessibility capacity: calculations.accessibility_peak_occupancy including the candidate's units_requested must stay <= AccessibilityResource.unit_count over the half-open window"
    error_id: ERR_ACCESSIBILITY_CAPACITY_EXCEEDED
    http_status: 409
    applies_to: "POST /accessibility-requests/{id}/transition {target_status: CONFIRMED}"

  - priority: 19
    category: business_constraint
    check: "A HISTORICAL_ACTUAL StaffingPlan requires Event.historical_actual_attendance to be non-null"
    error_id: ERR_HISTORICAL_ATTENDANCE_MISSING
    http_status: 409
    applies_to: "POST /staffing-plans"

  - priority: 20
    category: business_referential
    check: "resolution_type is permitted for the issue's category: SEAT_RELOCATION -> {SEAT_RELOCATION, REFUND, COMPLIMENTARY_CREDIT, NO_ACTION}; CONDUCT_VIOLATION -> {EJECTION, NO_ACTION}; ACCESSIBILITY -> {SEAT_RELOCATION, COMPLIMENTARY_CREDIT, NO_ACTION}; LOST_FOUND -> {ITEM_RETURNED, NO_ACTION}; LOST_CHILD -> {REUNIFICATION}; MEDICAL -> {MEDICAL_TRANSPORT, NO_ACTION}; OTHER -> any"
    error_id: ERR_RESOLUTION_TYPE_MISMATCH
    http_status: 409
    applies_to: "POST /guest-issues/{id}/resolve"

  - priority: 21
    category: business_referential
    check: "A SEAT_RELOCATION resolution's relocation_zone_code must equal the zone_code of at least one non-CLOSED PositionSlot on the event's ACTIVE or LOCKED StaffingPlan - a guest may only be moved into a zone the event actually staffs"
    error_id: ERR_RELOCATION_ZONE_UNSTAFFED
    http_status: 409
    applies_to: "POST /guest-issues/{id}/resolve"

  - priority: 22
    category: business_fiscal
    check: "Refund sub-state: APPROVE requires refund_status IN {NONE, PENDING, PARTIALLY_APPROVED}; VOID requires refund_status IN {APPROVED, PARTIALLY_APPROVED}; a REFUND resolution requires refund_status IN {APPROVED, PARTIALLY_APPROVED}"
    error_id: ERR_REFUND_STATE_INVALID
    http_status: 409
    applies_to: "POST /guest-issues/{id}/refund-decision, POST /guest-issues/{id}/resolve"

  - priority: 23
    category: business_fiscal
    check: "Refund budget: Event.refund_budget_remaining_cents + this issue's already-recorded refund_approved_cents must be > 0 before an APPROVE is attempted"
    error_id: ERR_REFUND_BUDGET_EXHAUSTED
    http_status: 409
    applies_to: "POST /guest-issues/{id}/refund-decision {decision: APPROVE}"

  - priority: 24
    category: business_fiscal
    check: "Payout phase ordering: GRATUITY_ALLOCATION requires Event.status == CLOSED and at least one ACCRUED gratuity-eligible assignment; PAYROLL requires that no ACCRUED gratuity-eligible assignment is still awaiting allocation"
    error_id: ERR_PAYOUT_PHASE_INVALID
    http_status: 409
    applies_to: "POST /events/{id}/payout-run"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
# api_prefix is "/", so every entity owns a top-level collection segment. Reads are open to the
# three operator roles; StaffMember sees only the surfaces a worker needs (own bids, own
# assignments, own certifications, the slots that are open to bidding and the event header).
endpoints:
  # --- logical clock (test-driving endpoint, /_ namespace) --------------------
  - method: POST
    path: "/_clock/set_current_utc"
    description: >-
      Sets the server's logical clock, which every timestamp, deadline, expiry and window rule in
      this domain reads. The clock's startup default is exactly 2026-08-01T00:00:00Z: before any
      call to this endpoint the clock reads that instant and never falls back to wall-clock time.
      Moving the clock never mutates business rows; it only changes what later reads and writes
      compute (Certification.status, GuestIssue.sla_breached, the reopen window, and every *_at
      stamp written afterwards).
    roles: [GuestExperienceDirector, StaffingCoordinator, GuestServicesSupervisor, StaffMember]
    code: 200
    input: [current_utc]
    output: "{ current_utc: datetime }"
    side_effects:
      - "no row is written; Certification.status and GuestIssue.sla_breached are re-derived on their next read"

  # --- Event -----------------------------------------------------------------
  - method: POST
    path: "/events"
    description: "Creates an event in FORECAST with its guest-recovery budget and gratuity pool."
    roles: [GuestExperienceDirector]
    code: 201
    input: [name, event_date, doors_open_at, doors_close_at, expected_attendance, "historical_actual_attendance?", "refund_budget_total_cents?", "gratuity_pool_cents?"]
    output: Event
    side_effects:
      - "attendance_tier computed per calculations.event_attendance_tier"
      - "refund_approved_total_cents = 0 and refund_budget_remaining_cents = refund_budget_total_cents"
      - "status = FORECAST, version = 1"

  - method: GET
    path: "/events/{id}"
    description: "Reads one event including its live refund ledger and gratuity counters."
    roles: [GuestExperienceDirector, StaffingCoordinator, GuestServicesSupervisor, StaffMember]
    code: 200
    input: []
    output: Event
    side_effects: []

  - method: GET
    path: "/events"
    description: "Lists events, newest event_date first, with offset pagination."
    roles: [GuestExperienceDirector, StaffingCoordinator, GuestServicesSupervisor, StaffMember]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: Event[]
    side_effects: []

  - method: PATCH
    path: "/events/{id}"
    description: >-
      Updates the forecast, the historical turnstile count or the money envelopes. Refused with
      ERR_EVENT_STATE_INVALID once status IN {IN_PROGRESS, CLOSED, CANCELLED}, which is what freezes
      a LOCKED plan's headcounts.
    roles: [GuestExperienceDirector]
    code: 200
    input: ["name?", "doors_open_at?", "doors_close_at?", "expected_attendance?", "historical_actual_attendance?", "refund_budget_total_cents?", "gratuity_pool_cents?"]
    output: Event
    side_effects:
      - "attendance_tier recomputed"
      - "for every StaffingPlan of this event with status IN {DRAFT, ACTIVE}: basis_attendance and basis_attendance_tier recomputed, then every non-CLOSED PositionSlot's ratio_derived_headcount, required_headcount, slot_labor_cost_cents and status re-derived, then the plan's four aggregates recomputed per calculations.staffing_plan_projected_labor_cost"
      - "refund_budget_remaining_cents recomputed per calculations.event_refund_budget_ledger"
      - "increments Event.version by 1"

  - method: POST
    path: "/events/{id}/lifecycle"
    description: "Drives the Event state machine: PLANNED -> IN_PROGRESS -> CLOSED, or CANCELLED from any non-terminal state."
    roles: [GuestExperienceDirector]
    code: 200
    input: [target_status, "reason?"]
    output: Event
    side_effects:
      - "IN_PROGRESS: the event's ACTIVE StaffingPlan transitions to LOCKED"
      - "CLOSED: every SCHEDULED StaffAssignment on the LOCKED plan becomes RELEASED with payout_status VOIDED, and each affected PositionSlot's filled_headcount and status are re-derived"
      - "CANCELLED: the 4-link cascade of state_machines.Event.PLANNED_to_CANCELLED (plans VOIDED -> slots CLOSED -> assignments CANCELLED + bids DECLINED_BY_SYSTEM)"
      - "increments Event.version by 1"

  - method: POST
    path: "/events/{id}/payout-run"
    description: >-
      Runs one payout phase for the event. GRATUITY_ALLOCATION distributes the gratuity pool per
      calculations.gratuity_pool_allocation; PAYROLL marks everything PAID. Returns the assignments
      the phase touched, ordered exactly as the allocation ranked them.
    roles: [GuestExperienceDirector]
    code: 200
    input: [phase]
    output: StaffAssignment[]
    side_effects:
      - "GRATUITY_ALLOCATION: eligible ACCRUED rows get gratuity_cents and payout_status GRATUITY_ALLOCATED; Event.gratuity_allocated_cents increases by the whole distributed pool"
      - "PAYROLL: ACCRUED and GRATUITY_ALLOCATED rows become PAID; VOIDED rows are skipped"
      - "refused with ERR_PAYOUT_PHASE_INVALID when the event is not CLOSED or when PAYROLL is run while a gratuity-eligible ACCRUED row is still unallocated"

  - method: GET
    path: "/events/{id}/satisfaction-summary"
    description: "Computed read of calculations.event_satisfaction_summary; no rows are written."
    roles: [GuestExperienceDirector, GuestServicesSupervisor]
    code: 200
    input: ["zone_code?"]
    output: "{ response_count: integer, average_score: number, promoter_share_bp: integer, zone_breakdown: object[], resolved_issue_count: integer, sla_breached_issue_count: integer }"
    side_effects: []

  - method: GET
    path: "/events/{id}/staffing-model-recommendation"
    description: >-
      Computed read of calculations.staffing_model_recommendation. Requires Event.status == CLOSED
      (else ERR_EVENT_STATE_INVALID) because it reconciles planned headcount against what actually
      worked.
    roles: [GuestExperienceDirector, StaffingCoordinator]
    code: 200
    input: []
    output: "{ event_id: string, understaffed_slot_count: integer, average_score: number, position_recommendations: object[] }"
    side_effects: []

  - method: GET
    path: "/events/{id}/satisfaction-responses"
    description: "Lists the event's immutable satisfaction responses (reverse reachability for SatisfactionResponse.event_id)."
    roles: [GuestExperienceDirector, GuestServicesSupervisor]
    code: 200
    input: ["zone_code?", "limit?", "offset?"]
    output: SatisfactionResponse[]
    side_effects: []

  # --- PositionType ----------------------------------------------------------
  - method: POST
    path: "/position-types"
    description: "Registers a guest-experience position family with its ratio, floor, rate and required certifications."
    roles: [StaffingCoordinator]
    code: 201
    input: [code, display_name, base_hourly_rate_cents, attendance_ratio_per_1000, min_headcount, required_certifications, "is_tip_eligible?", "is_contracted_position?"]
    output: PositionType
    side_effects: []

  - method: GET
    path: "/position-types/{id}"
    description: "Reads one position family."
    roles: [GuestExperienceDirector, StaffingCoordinator, GuestServicesSupervisor]
    code: 200
    input: []
    output: PositionType
    side_effects: []

  - method: GET
    path: "/position-types"
    description: "Lists position families ordered by code ASC."
    roles: [GuestExperienceDirector, StaffingCoordinator, GuestServicesSupervisor]
    code: 200
    input: ["code?", "is_tip_eligible?", "limit?", "offset?"]
    output: PositionType[]
    side_effects: []

  - method: PATCH
    path: "/position-types/{id}"
    description: >-
      Retunes a position family. Existing slots are NOT retroactively repriced: only a later
      PATCH /events or PATCH /position-slots recomputes them, which is what makes the frozen
      LOCKED-plan numbers observable.
    roles: [StaffingCoordinator]
    code: 200
    input: ["display_name?", "base_hourly_rate_cents?", "attendance_ratio_per_1000?", "min_headcount?", "required_certifications?", "is_tip_eligible?", "is_contracted_position?"]
    output: PositionType
    side_effects:
      - "no PositionSlot, StaffingPlan or StaffAssignment field changes in this request"

  # --- StaffingPlan ----------------------------------------------------------
  - method: POST
    path: "/staffing-plans"
    description: >-
      Opens a DRAFT plan for an event under one attendance basis. revision_number is 1 + the number
      of plans the event already has, so a superseding plan is identifiable without reading ids.
    roles: [StaffingCoordinator]
    code: 201
    input: [event_id, plan_variant]
    output: StaffingPlan
    side_effects:
      - "basis_attendance selected by plan_variant and basis_attendance_tier computed per calculations.event_attendance_tier"
      - "HISTORICAL_ACTUAL with Event.historical_actual_attendance == null is refused with ERR_HISTORICAL_ATTENDANCE_MISSING"
      - "the four aggregates start at 0 because the plan has no slots yet"

  - method: GET
    path: "/staffing-plans/{id}"
    description: "Reads one plan with its live cost aggregates."
    roles: [GuestExperienceDirector, StaffingCoordinator, GuestServicesSupervisor]
    code: 200
    input: []
    output: StaffingPlan
    side_effects: []

  - method: GET
    path: "/staffing-plans"
    description: "Lists plans, filterable by event and status (reverse reachability for StaffingPlan.event_id)."
    roles: [GuestExperienceDirector, StaffingCoordinator, GuestServicesSupervisor]
    code: 200
    input: ["event_id?", "status?", "plan_variant?", "limit?", "offset?"]
    output: StaffingPlan[]
    side_effects: []

  - method: POST
    path: "/staffing-plans/{id}/activate"
    description: >-
      Activates a DRAFT plan under optimistic concurrency on the parent Event
      (§1.2.1 plan-activate-stale-event). A stale expected_event_version is refused with
      ERR_STALE_EVENT_VERSION (412) and nothing mutates.
    roles: [StaffingCoordinator]
    code: 200
    input: [expected_event_version]
    output: StaffingPlan
    side_effects:
      - "this plan: status DRAFT -> ACTIVE, activated_at stamped, aggregates recomputed"
      - "the event's previously ACTIVE plan: status -> SUPERSEDED, its non-CLOSED slots -> CLOSED, their SUBMITTED/WAITLISTED bids -> DECLINED_BY_SYSTEM, their SCHEDULED/CHECKED_IN assignments -> CANCELLED with payout_status VOIDED, and its four aggregates recomputed to 0"
      - "Event.status FORECAST -> PLANNED when applicable"
      - "increments Event.version by 1"

  # --- PositionSlot ----------------------------------------------------------
  - method: POST
    path: "/position-slots"
    description: >-
      Adds a shift block to a DRAFT or ACTIVE plan. required_headcount is derived from the plan's
      basis attendance unless required_headcount_override is supplied.
    roles: [StaffingCoordinator]
    code: 201
    input: [plan_id, position_type_id, zone_code, shift_start, shift_end, "required_headcount_override?"]
    output: PositionSlot
    side_effects:
      - "shift_minutes, ratio_derived_headcount and required_headcount computed per calculations.position_slot_required_headcount"
      - "slot_labor_cost_cents computed and the owning plan's four aggregates recomputed per calculations.staffing_plan_projected_labor_cost"
      - "status = OPEN, filled_headcount = 0"
      - "refused with ERR_PLAN_STATE_INVALID when the plan is SUPERSEDED, LOCKED or VOIDED"

  - method: GET
    path: "/position-slots/{id}"
    description: "Reads one slot with its live fill counters."
    roles: [GuestExperienceDirector, StaffingCoordinator, GuestServicesSupervisor, StaffMember]
    code: 200
    input: []
    output: PositionSlot
    side_effects: []

  - method: GET
    path: "/position-slots"
    description: "Lists slots (reverse reachability for PositionSlot.plan_id and PositionSlot.position_type_id)."
    roles: [GuestExperienceDirector, StaffingCoordinator, GuestServicesSupervisor, StaffMember]
    code: 200
    input: ["plan_id?", "position_type_id?", "status?", "zone_code?", "limit?", "offset?"]
    output: PositionSlot[]
    side_effects: []

  - method: PATCH
    path: "/position-slots/{id}"
    description: "Retimes or re-sizes a slot on a DRAFT or ACTIVE plan."
    roles: [StaffingCoordinator]
    code: 200
    input: ["zone_code?", "shift_start?", "shift_end?", "required_headcount_override?"]
    output: PositionSlot
    side_effects:
      - "shift_minutes, ratio_derived_headcount, required_headcount and slot_labor_cost_cents recomputed"
      - "status re-derived from filled_headcount vs the new required_headcount, so shrinking a slot can flip PARTIALLY_FILLED -> FILLED"
      - "the owning plan's four aggregates recomputed"
      - "refused with ERR_PLAN_STATE_INVALID when the plan is LOCKED, SUPERSEDED or VOIDED, and with ERR_SLOT_STATE_INVALID when the slot is CLOSED"

  - method: DELETE
    path: "/position-slots/{id}"
    description: "Removes a slot that has no non-terminal assignment or bid; only DRAFT plans allow it."
    roles: [StaffingCoordinator]
    code: 204
    input: []
    output: null
    side_effects:
      - "the owning plan's four aggregates recomputed"
      - "refused with ERR_PLAN_STATE_INVALID unless the plan is DRAFT, and with ERR_SLOT_STATE_INVALID when any non-terminal ShiftBid or StaffAssignment references the slot"

  - method: POST
    path: "/position-slots/{id}/run-bid-award"
    description: >-
      Batch-awards the slot's open bids in one deterministic pass: eligible bids are ranked by
      StaffMember.reliability_score DESC, seniority_date ASC, ShiftBid.created_at ASC, awarded until
      capacity is exhausted, then the remaining eligible bids are WAITLISTED and the ineligible ones
      DECLINED_BY_SYSTEM. Returns every bid the run touched, in ranking order. A run that awards
      nothing is still a 200.
    roles: [StaffingCoordinator]
    code: 200
    input: []
    output: ShiftBid[]
    side_effects:
      - "rank_score stamped on every ranked bid from the member's reliability_score at run time"
      - "one StaffAssignment (source BID_AWARD, attendance SCHEDULED, payout PENDING) per awarded bid"
      - "PositionSlot.filled_headcount increased once per award and status re-derived, clearing UNDERSTAFFED_ESCALATED"
      - "decision_reason recorded as CAPACITY_EXHAUSTED, MEMBER_NOT_ACTIVE, CERTIFICATION_MISSING or REST_CONFLICT"

  # --- StaffMember -----------------------------------------------------------
  - method: POST
    path: "/staff-members"
    description: "Enrols a part-time or contracted worker; both reliability scores start at 100."
    roles: [StaffingCoordinator]
    code: 201
    input: [full_name, employment_type, seniority_date, hourly_rate_cents, "in_backfill_pool?"]
    output: StaffMember
    side_effects:
      - "status = ACTIVE, reliability_score = 100, season_reliability_score = 100, no_show_strikes = 0, completed_assignment_count = 0"

  - method: GET
    path: "/staff-members/{id}"
    description: "Reads one worker including both reliability variants."
    roles: [GuestExperienceDirector, StaffingCoordinator, GuestServicesSupervisor, StaffMember]
    code: 200
    input: []
    output: StaffMember
    side_effects: []

  - method: GET
    path: "/staff-members"
    description: "Lists workers, ordered by seniority_date ASC then created_at ASC."
    roles: [GuestExperienceDirector, StaffingCoordinator, GuestServicesSupervisor]
    code: 200
    input: ["status?", "employment_type?", "in_backfill_pool?", "limit?", "offset?"]
    output: StaffMember[]
    side_effects: []

  - method: PATCH
    path: "/staff-members/{id}"
    description: "Updates a worker's contact data, rate or backfill-pool opt-in. Cannot change status; use the status-change action."
    roles: [StaffingCoordinator]
    code: 200
    input: ["full_name?", "hourly_rate_cents?", "in_backfill_pool?"]
    output: StaffMember
    side_effects:
      - "already-computed StaffAssignment.base_pay_cents values are NOT repriced by a rate change"

  - method: POST
    path: "/staff-members/{id}/status-change"
    description: >-
      Drives the StaffMember state machine (ACTIVE / PROBATION / SUSPENDED / TERMINATED).
      Reinstating from PROBATION requires reliability_score >= 65; reinstating from SUSPENDED does
      not.
    roles: [StaffingCoordinator]
    code: 200
    input: [target_status, reason]
    output: StaffMember
    side_effects:
      - "last_status_reason recorded; in_backfill_pool set to false for SUSPENDED/TERMINATED and true for ACTIVE"
      - "SUSPENDED/TERMINATED: the member's SCHEDULED assignments become CANCELLED with payout_status VOIDED, their slots' filled_headcount and status are re-derived, and the member's SUBMITTED/WAITLISTED bids become DECLINED_BY_SYSTEM"
      - "refused with ERR_STAFF_MEMBER_NOT_ACTIVE from TERMINATED and with ERR_VALIDATION_FAILED when target_status equals the current status"

  - method: GET
    path: "/staff-members/{id}/certifications"
    description: "Sub-resource read of one worker's credentials with their live computed status."
    roles: [GuestExperienceDirector, StaffingCoordinator, GuestServicesSupervisor, StaffMember]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: Certification[]
    side_effects: []

  # --- Certification ---------------------------------------------------------
  - method: POST
    path: "/certifications"
    description: "Records a training credential for a worker."
    roles: [StaffingCoordinator]
    code: 201
    input: [staff_member_id, cert_type, issued_on, expires_on]
    output: Certification
    side_effects:
      - "status computed: REVOKED if revoked_at set, else EXPIRED when the current logical clock is strictly after expires_on, else VALID"

  - method: GET
    path: "/certifications/{id}"
    description: "Reads one credential."
    roles: [GuestExperienceDirector, StaffingCoordinator, GuestServicesSupervisor, StaffMember]
    code: 200
    input: []
    output: Certification
    side_effects: []

  - method: GET
    path: "/certifications"
    description: "Lists credentials (reverse reachability for Certification.staff_member_id)."
    roles: [GuestExperienceDirector, StaffingCoordinator, GuestServicesSupervisor, StaffMember]
    code: 200
    input: ["staff_member_id?", "cert_type?", "status?", "limit?", "offset?"]
    output: Certification[]
    side_effects: []

  - method: POST
    path: "/certifications/{id}/revoke"
    description: "Revokes a credential immediately; the worker's future eligibility checks fail even though existing assignments stand."
    roles: [StaffingCoordinator]
    code: 200
    input: [reason]
    output: Certification
    side_effects:
      - "revoked_at = current logical clock and status becomes REVOKED"
      - "no StaffAssignment or ShiftBid is retro-cancelled: only later eligibility checks change"

  # --- ShiftBid --------------------------------------------------------------
  - method: POST
    path: "/shift-bids"
    description: >-
      Files a bid on an open slot. A StaffMember may only bid for themselves; a StaffingCoordinator
      may file on a worker's behalf.
    roles: [StaffMember, StaffingCoordinator]
    code: 201
    input: [staff_member_id, position_slot_id]
    output: ShiftBid
    side_effects:
      - "status = SUBMITTED, submitted_at = current logical clock, rank_score = null"
      - "refused with ERR_DUPLICATE_BID when the member already has a SUBMITTED or WAITLISTED bid on the slot, and with ERR_NOT_RESOURCE_OWNER when a StaffMember bids for someone else"

  - method: GET
    path: "/shift-bids/{id}"
    description: "Reads one bid with its rank and decision reason."
    roles: [GuestExperienceDirector, StaffingCoordinator, GuestServicesSupervisor, StaffMember]
    code: 200
    input: []
    output: ShiftBid
    side_effects: []

  - method: GET
    path: "/shift-bids"
    description: "Lists bids (reverse reachability for ShiftBid.staff_member_id and ShiftBid.position_slot_id)."
    roles: [GuestExperienceDirector, StaffingCoordinator, GuestServicesSupervisor, StaffMember]
    code: 200
    input: ["staff_member_id?", "position_slot_id?", "status?", "limit?", "offset?"]
    output: ShiftBid[]
    side_effects: []

  - method: POST
    path: "/shift-bids/{id}/award"
    description: "Awards one bid manually, running the same eligibility ladder as the batch pass."
    roles: [StaffingCoordinator]
    code: 200
    input: []
    output: ShiftBid
    side_effects:
      - "creates a StaffAssignment (source BID_AWARD, shift_bid_id set, attendance SCHEDULED, payout PENDING)"
      - "PositionSlot.filled_headcount += 1 and status re-derived"
      - "decision_reason = MANUAL_AWARD"

  - method: POST
    path: "/shift-bids/{id}/withdraw"
    description: "The bidding worker withdraws their own SUBMITTED or WAITLISTED bid."
    roles: [StaffMember]
    code: 200
    input: []
    output: ShiftBid
    side_effects:
      - "status = WITHDRAWN, decision_reason = WITHDRAWN_BY_MEMBER"
      - "a fresh bid on the same slot becomes possible again because ERR_DUPLICATE_BID only looks at non-terminal bids"

  # --- StaffAssignment -------------------------------------------------------
  - method: POST
    path: "/staff-assignments"
    description: >-
      Assigns a worker to a slot directly, bypassing the bid queue. Requires the owning Event.status
      IN {PLANNED, IN_PROGRESS} and the owning StaffingPlan.status IN {ACTIVE, LOCKED} (else
      ERR_EVENT_STATE_INVALID / ERR_PLAN_STATE_INVALID). Runs the full ladder: member ACTIVE,
      certifications VALID, no duplicate on the slot, rest buffer respected, capacity free.
    roles: [StaffingCoordinator]
    code: 201
    input: [position_slot_id, staff_member_id]
    output: StaffAssignment
    side_effects:
      - "source = MANUAL, shift_bid_id = null, attendance_status = SCHEDULED, payout_status = PENDING"
      - "PositionSlot.filled_headcount += 1 and status re-derived, clearing UNDERSTAFFED_ESCALATED"

  - method: GET
    path: "/staff-assignments/{id}"
    description: "Reads one assignment with both state dimensions and its money columns."
    roles: [GuestExperienceDirector, StaffingCoordinator, GuestServicesSupervisor, StaffMember]
    code: 200
    input: []
    output: StaffAssignment
    side_effects: []

  - method: GET
    path: "/staff-assignments"
    description: "Lists assignments (reverse reachability for position_slot_id, staff_member_id and shift_bid_id)."
    roles: [GuestExperienceDirector, StaffingCoordinator, GuestServicesSupervisor, StaffMember]
    code: 200
    input: ["position_slot_id?", "staff_member_id?", "shift_bid_id?", "attendance_status?", "payout_status?", "source?", "limit?", "offset?"]
    output: StaffAssignment[]
    side_effects: []

  - method: POST
    path: "/staff-assignments/{id}/attendance"
    description: >-
      Single entry point for the attendance dimension: CHECK_IN, CHECK_OUT, NO_SHOW or RELEASE.
      CHECK_IN and CHECK_OUT are also available to the owning StaffMember; NO_SHOW and RELEASE are
      coordinator-only and are rejected for a StaffMember with ERR_ROLE_NOT_PERMITTED.
    roles: [StaffingCoordinator, StaffMember]
    code: 200
    input: [action]
    output: StaffAssignment
    side_effects:
      - "CHECK_IN: check_in_at stamped and late_check_in computed against shift_start + LATE_GRACE_MINUTES"
      - "CHECK_OUT: checked_out_at stamped, worked_minutes / base_pay_cents / total_payout_cents computed per calculations.assignment_worked_pay, payout_status PENDING -> ACCRUED, and both of the member's reliability variants recomputed"
      - "NO_SHOW: the 5-link cascade of state_machines.StaffAssignment.SCHEDULED_to_NO_SHOW including a new OPEN BackfillRequest and the possible ACTIVE -> PROBATION demotion"
      - "RELEASE: payout_status -> VOIDED, filled_headcount decremented, and any BackfillRequest whose filled_assignment_id is this row reverts FILLED -> OPEN"

  # --- BackfillRequest (created only by the NO_SHOW cascade) ------------------
  - method: GET
    path: "/backfill-requests/{id}"
    description: "Reads one backfill request with its attempt counter and selected candidate."
    roles: [GuestExperienceDirector, StaffingCoordinator, GuestServicesSupervisor]
    code: 200
    input: []
    output: BackfillRequest
    side_effects: []

  - method: GET
    path: "/backfill-requests"
    description: "Lists backfill requests (reverse reachability for position_slot_id, triggering_assignment_id, filled_assignment_id and selected_staff_member_id)."
    roles: [GuestExperienceDirector, StaffingCoordinator, GuestServicesSupervisor]
    code: 200
    input: ["position_slot_id?", "triggering_assignment_id?", "filled_assignment_id?", "selected_staff_member_id?", "status?", "limit?", "offset?"]
    output: BackfillRequest[]
    side_effects: []

  - method: POST
    path: "/backfill-requests/{id}/auto-fill"
    description: >-
      Runs calculations.backfill_candidate_selection once. A winner fills the request; an empty
      candidate pool is a legitimate 200 that lands the request in UNFILLABLE and escalates the slot.
    roles: [StaffingCoordinator]
    code: 200
    input: []
    output: BackfillRequest
    side_effects:
      - "attempt_count += 1 on both outcomes"
      - "winner: selected_staff_member_id and filled_assignment_id set, a BACKFILL StaffAssignment created, PositionSlot.filled_headcount += 1 and status re-derived"
      - "empty pool: status -> UNFILLABLE and PositionSlot.status -> UNDERSTAFFED_ESCALATED"

  - method: POST
    path: "/backfill-requests/{id}/cancel"
    description: "Abandons an OPEN backfill request; the slot keeps whatever fill state it has."
    roles: [StaffingCoordinator]
    code: 200
    input: [cancel_reason]
    output: BackfillRequest
    side_effects:
      - "status = CANCELLED; later auto-fill attempts return ERR_BACKFILL_NOT_OPEN"

  # --- GuestIssue ------------------------------------------------------------
  - method: POST
    path: "/guest-issues"
    description: >-
      Files a guest issue from the text line, a kiosk or in person. severity is computed: LOST_CHILD
      and MEDICAL are forced to CRITICAL whatever the client sends.
    roles: [GuestServicesSupervisor, GuestExperienceDirector]
    code: 201
    input: [event_id, channel, category, severity, description, "seat_reference?"]
    output: GuestIssue
    side_effects:
      - "severity, sla_minutes, sla_clock_started_at, sla_deadline and sla_breached computed per calculations.guest_issue_sla"
      - "reported_by_user_id = X-User-ID, status = OPEN, refund_status = NONE, refund_requested_cents = 0"

  - method: GET
    path: "/guest-issues/{id}"
    description: "Reads one issue; sla_breached is re-evaluated against the current logical clock while the issue is unresolved."
    roles: [GuestExperienceDirector, StaffingCoordinator, GuestServicesSupervisor]
    code: 200
    input: []
    output: GuestIssue
    side_effects: []

  - method: GET
    path: "/guest-issues"
    description: "Lists issues (reverse reachability for event_id, escalated_from_issue_id and assigned_staff_member_id)."
    roles: [GuestExperienceDirector, StaffingCoordinator, GuestServicesSupervisor]
    code: 200
    input: ["event_id?", "escalated_from_issue_id?", "assigned_staff_member_id?", "status?", "severity?", "category?", "refund_status?", "limit?", "offset?"]
    output: GuestIssue[]
    side_effects: []

  - method: POST
    path: "/guest-issues/{id}/assign"
    description: "Hands the issue to an ACTIVE responder who holds a VALID CODE_OF_CONDUCT credential."
    roles: [GuestServicesSupervisor]
    code: 200
    input: [staff_member_id]
    output: GuestIssue
    side_effects:
      - "assigned_staff_member_id set; status OPEN -> IN_PROGRESS or REOPENED -> IN_PROGRESS"
      - "sla_clock_started_at and sla_deadline are NOT restarted"

  - method: POST
    path: "/guest-issues/{id}/resolve"
    description: >-
      Closes out the guest interaction with a resolution_type permitted for the issue's category.
      From ESCALATED only a GuestExperienceDirector may resolve.
    roles: [GuestServicesSupervisor, GuestExperienceDirector]
    code: 200
    input: [resolution_type, "relocation_zone_code?"]
    output: GuestIssue
    side_effects:
      - "status -> RESOLVED, resolved_at stamped, resolved_by_user_id = X-User-ID, sla_breached frozen"
      - "resolution_type SEAT_RELOCATION stores relocation_zone_code after checking it against the event's staffed zones"
      - "resolution_type REFUND requires refund_status IN {APPROVED, PARTIALLY_APPROVED}"

  - method: POST
    path: "/guest-issues/{id}/escalate"
    description: >-
      Escalates a breached issue: the parent moves to ESCALATED and a CRITICAL child issue is created
      with escalated_from_issue_id pointing back at it. Returns the child.
    roles: [GuestServicesSupervisor]
    code: 201
    input: []
    output: GuestIssue
    side_effects:
      - "parent: status -> ESCALATED, resolvable only by a GuestExperienceDirector"
      - "child: severity CRITICAL, sla_minutes 5, sla_clock_started_at = current logical clock, status OPEN, same event_id / category / channel / seat_reference / description"
      - "refused with ERR_ISSUE_STATE_INVALID when sla_breached is false"

  - method: POST
    path: "/guest-issues/{id}/reopen"
    description: "Reopens a RESOLVED issue inside the 1440-minute window, at most twice."
    roles: [GuestServicesSupervisor]
    code: 200
    input: []
    output: GuestIssue
    side_effects:
      - "status -> REOPENED, reopen_count += 1, resolved_at / resolution_type / resolved_by_user_id cleared"
      - "refund_approved_cents and the event ledger are untouched"

  - method: POST
    path: "/guest-issues/{id}/close"
    description: "Freezes a RESOLVED issue once its reopen window has expired (strictly more than 1440 minutes)."
    roles: [GuestServicesSupervisor]
    code: 200
    input: []
    output: GuestIssue
    side_effects:
      - "status -> CLOSED; reopen, resolve and refund-decision then all return ERR_ISSUE_STATE_INVALID"

  - method: POST
    path: "/guest-issues/{id}/refund-request"
    description: >-
      Files the refund ask on an issue. Recording the requester separately from the decider is what
      makes segregation of duties enforceable.
    roles: [GuestServicesSupervisor]
    code: 200
    input: [refund_requested_cents]
    output: GuestIssue
    side_effects:
      - "refund_requested_cents stored, refund_requested_by_user_id = X-User-ID, refund_status NONE -> PENDING"
      - "no money moves and the event ledger does not change"

  - method: POST
    path: "/guest-issues/{id}/refund-decision"
    description: >-
      APPROVE authorizes up to the role cap per calculations.refund_authorized_amount, DENY refuses
      the ask, VOID reverses an authorization and is GuestExperienceDirector-only. The deciding
      X-User-ID must differ from both the reporter and the requester.
    roles: [GuestServicesSupervisor, GuestExperienceDirector]
    code: 200
    input: [decision]
    output: GuestIssue
    side_effects:
      - "APPROVE: refund_approved_cents set, refund_status APPROVED or PARTIALLY_APPROVED, refund_decided_by_user_id stamped, Event.refund_approved_total_cents and refund_budget_remaining_cents recomputed; a supervisor-cap-bound partial moves the issue to AWAITING_AUTHORIZATION, and a director APPROVE from AWAITING_AUTHORIZATION replaces the amount and resolves the issue"
      - "DENY: refund_status -> DENIED, refund_approved_cents = 0, the ledger unchanged"
      - "VOID: refund_status -> VOIDED, refund_approved_cents reset to 0 and the ledger restored exactly to its pre-approval value"

  # --- AccessibilityResource / AccessibilityRequest ---------------------------
  - method: POST
    path: "/accessibility-resources"
    description: "Stages an accessibility pool (wheelchair escorts, assistive listening units, companion seat blocks) for an event zone."
    roles: [GuestServicesSupervisor]
    code: 201
    input: [event_id, resource_type, zone_code, unit_count]
    output: AccessibilityResource
    side_effects:
      - "status = AVAILABLE, peak_committed_units = 0"

  - method: GET
    path: "/accessibility-resources/{id}"
    description: "Reads one pool with its live peak commitment."
    roles: [GuestExperienceDirector, StaffingCoordinator, GuestServicesSupervisor]
    code: 200
    input: []
    output: AccessibilityResource
    side_effects: []

  - method: GET
    path: "/accessibility-resources"
    description: "Lists pools (reverse reachability for AccessibilityResource.event_id)."
    roles: [GuestExperienceDirector, StaffingCoordinator, GuestServicesSupervisor]
    code: 200
    input: ["event_id?", "resource_type?", "status?", "zone_code?", "limit?", "offset?"]
    output: AccessibilityResource[]
    side_effects: []

  - method: PATCH
    path: "/accessibility-resources/{id}"
    description: >-
      Resizes a pool or takes it out of service. Shrinking unit_count below the current
      peak_committed_units is refused with ERR_ACCESSIBILITY_CAPACITY_EXCEEDED; existing CONFIRMED
      requests are never auto-cancelled.
    roles: [GuestServicesSupervisor]
    code: 200
    input: ["unit_count?", "status?"]
    output: AccessibilityResource
    side_effects:
      - "peak_committed_units recomputed per calculations.accessibility_peak_occupancy"

  - method: POST
    path: "/accessibility-requests"
    description: "Books a guest against an accessibility pool for a half-open service window."
    roles: [GuestServicesSupervisor]
    code: 201
    input: [resource_id, guest_reference, window_start, window_end, units_requested, "companion_seats_requested?"]
    output: AccessibilityRequest
    side_effects:
      - "status = REQUESTED; no capacity is committed until the request is CONFIRMED"

  - method: GET
    path: "/accessibility-requests/{id}"
    description: "Reads one accessibility request."
    roles: [GuestExperienceDirector, StaffingCoordinator, GuestServicesSupervisor]
    code: 200
    input: []
    output: AccessibilityRequest
    side_effects: []

  - method: GET
    path: "/accessibility-requests"
    description: "Lists accessibility requests (reverse reachability for AccessibilityRequest.resource_id)."
    roles: [GuestExperienceDirector, StaffingCoordinator, GuestServicesSupervisor]
    code: 200
    input: ["resource_id?", "status?", "limit?", "offset?"]
    output: AccessibilityRequest[]
    side_effects: []

  - method: POST
    path: "/accessibility-requests/{id}/transition"
    description: >-
      Drives the AccessibilityRequest machine (CONFIRMED, IN_SERVICE, COMPLETED, DENIED, CANCELLED).
      CONFIRMED is the capacity gate; COMPLETED and CANCELLED release capacity.
    roles: [GuestServicesSupervisor]
    code: 200
    input: [target_status, "denial_reason?"]
    output: AccessibilityRequest
    side_effects:
      - "CONFIRMED: confirmed_at stamped and AccessibilityResource.peak_committed_units recomputed with this request's units_requested included"
      - "IN_SERVICE / COMPLETED: service_started_at / completed_at stamped; COMPLETED releases the units"
      - "DENIED requires denial_reason; CANCELLED from CONFIRMED releases the units immediately"

  # --- SatisfactionResponse (append-only, no update or delete path) -----------
  - method: POST
    path: "/satisfaction-responses"
    description: "Records one immutable guest satisfaction response for an event zone."
    roles: [GuestServicesSupervisor, GuestExperienceDirector]
    code: 201
    input: [event_id, zone_code, score, "comment?"]
    output: SatisfactionResponse
    side_effects:
      - "no version field and no update or delete endpoint exists for this entity"
      - "submitted_by_user_id = X-User-ID"

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  # -- auth / authorization ---------------------------------------------------
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "X-User-Role missing or not one of the four declared roles, or X-User-ID missing on a mutating request"
  - id: ERR_ROLE_NOT_PERMITTED
    http: 403
    condition: "The acting role is not in the endpoint's roles set, e.g. a StaffingCoordinator calling POST /events/{id}/lifecycle, a GuestServicesSupervisor resolving an ESCALATED issue, a StaffMember sending action NO_SHOW, or a GuestServicesSupervisor sending decision VOID"
  - id: ERR_NOT_RESOURCE_OWNER
    http: 403
    condition: "A StaffMember acts on a row that is not theirs: bidding for another member, withdrawing another member's bid, or checking in on another member's assignment"
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 403
    condition: "The X-User-ID deciding a refund equals GuestIssue.refund_requested_by_user_id or GuestIssue.reported_by_user_id"

  # -- request validation -----------------------------------------------------
  - id: ERR_VALIDATION_FAILED
    http: 422
    condition: "Missing required field, wrong JSON type, unknown enum value, out-of-range integer (expected_attendance < 0, units_requested < 1, score outside 1..5, required_headcount_override < 1), pagination limit outside 1..100 or offset < 0, or a status-change whose target_status equals the current status"
  - id: ERR_INVALID_TIME_WINDOW
    http: 422
    condition: "doors_close_at <= doors_open_at, shift_end <= shift_start, expires_on <= issued_on, or window_end <= window_start"

  # -- existence --------------------------------------------------------------
  - id: ERR_EVENT_NOT_FOUND
    http: 404
    condition: "No Event with the given path id or body event_id"
  - id: ERR_POSITION_TYPE_NOT_FOUND
    http: 404
    condition: "No PositionType with the given path id or body position_type_id"
  - id: ERR_STAFFING_PLAN_NOT_FOUND
    http: 404
    condition: "No StaffingPlan with the given path id or body plan_id"
  - id: ERR_POSITION_SLOT_NOT_FOUND
    http: 404
    condition: "No PositionSlot with the given path id or body position_slot_id"
  - id: ERR_STAFF_MEMBER_NOT_FOUND
    http: 404
    condition: "No StaffMember with the given path id or body staff_member_id"
  - id: ERR_CERTIFICATION_NOT_FOUND
    http: 404
    condition: "No Certification with the given path id"
  - id: ERR_SHIFT_BID_NOT_FOUND
    http: 404
    condition: "No ShiftBid with the given path id or body shift_bid_id"
  - id: ERR_STAFF_ASSIGNMENT_NOT_FOUND
    http: 404
    condition: "No StaffAssignment with the given path id"
  - id: ERR_BACKFILL_REQUEST_NOT_FOUND
    http: 404
    condition: "No BackfillRequest with the given path id"
  - id: ERR_GUEST_ISSUE_NOT_FOUND
    http: 404
    condition: "No GuestIssue with the given path id"
  - id: ERR_ACCESSIBILITY_RESOURCE_NOT_FOUND
    http: 404
    condition: "No AccessibilityResource with the given path id or body resource_id"
  - id: ERR_ACCESSIBILITY_REQUEST_NOT_FOUND
    http: 404
    condition: "No AccessibilityRequest with the given path id"

  # -- optimistic concurrency -------------------------------------------------
  - id: ERR_STALE_EVENT_VERSION
    http: 412
    condition: "POST /staffing-plans/{id}/activate carries an expected_event_version that no longer equals Event.version (§1.2.1 plan-activate-stale-event); nothing mutates"

  # -- own-entity state -------------------------------------------------------
  - id: ERR_EVENT_STATE_INVALID
    http: 409
    condition: "Undeclared Event lifecycle transition, PATCH /events after IN_PROGRESS, the recommendation read before CLOSED, or a child operation whose parent event is in the wrong state (bidding on a CANCELLED event's slot, checking in before IN_PROGRESS, confirming an accessibility request on a FORECAST event)"
  - id: ERR_PLAN_STATE_INVALID
    http: 409
    condition: "Activating a plan that is not DRAFT, or adding / patching / deleting a slot on a plan that is LOCKED, SUPERSEDED or VOIDED (DELETE additionally requires DRAFT)"
  - id: ERR_SLOT_STATE_INVALID
    http: 409
    condition: "Acting on a CLOSED PositionSlot, or deleting a slot that still has a non-terminal ShiftBid or StaffAssignment"
  - id: ERR_BID_STATE_INVALID
    http: 409
    condition: "Awarding or withdrawing a ShiftBid that is already AWARDED, DECLINED_BY_SYSTEM or WITHDRAWN"
  - id: ERR_ASSIGNMENT_STATE_INVALID
    http: 409
    condition: "CHECK_OUT before CHECK_IN, any attendance action on a COMPLETED / NO_SHOW / RELEASED / CANCELLED row, or closing an event while an assignment is still CHECKED_IN"
  - id: ERR_BACKFILL_NOT_OPEN
    http: 409
    condition: "auto-fill or cancel on a BackfillRequest whose status is FILLED, UNFILLABLE or CANCELLED"
  - id: ERR_ISSUE_STATE_INVALID
    http: 409
    condition: "Assign / resolve / reopen / close / escalate / refund-decision from a GuestIssue state where §1.2 declares no such transition, escalating an issue whose sla_breached is false, or resolving from AWAITING_AUTHORIZATION before a director decision"
  - id: ERR_ACCESS_REQUEST_STATE_INVALID
    http: 409
    condition: "An AccessibilityRequest transition that §1.2 does not declare from the current status, e.g. IN_SERVICE straight from REQUESTED or any transition out of COMPLETED / DENIED / CANCELLED"

  # -- cross-entity state -----------------------------------------------------
  - id: ERR_STAFF_MEMBER_NOT_ACTIVE
    http: 409
    condition: "The referenced StaffMember.status is not ACTIVE when awarding a bid, creating an assignment or assigning a guest issue; also a status-change attempted from TERMINATED"
  - id: ERR_RESOURCE_NOT_AVAILABLE
    http: 409
    condition: "The referenced AccessibilityResource.status is MAINTENANCE or WITHDRAWN when confirming or starting service on a request"

  # -- business: safety / compliance -----------------------------------------
  - id: ERR_CERTIFICATION_MISSING
    http: 409
    condition: "The staff member lacks a Certification with status VALID for a code in the slot's PositionType.required_certifications, or lacks a VALID CODE_OF_CONDUCT credential when taking a guest issue; outranks every capacity, temporal and fiscal check"

  # -- business: temporal -----------------------------------------------------
  - id: ERR_SHIFT_REST_CONFLICT
    http: 409
    condition: "The member's existing non-terminal assignment leaves less than REST_BUFFER_MINUTES (30) between shifts; a gap of exactly 30 minutes is accepted"
  - id: ERR_REOPEN_WINDOW_CLOSED
    http: 409
    condition: "Reopening more than 1440 minutes after resolved_at, or closing at or before that boundary"

  # -- business: constraint / capacity ---------------------------------------
  - id: ERR_DUPLICATE_BID
    http: 409
    condition: "The member already has a SUBMITTED or WAITLISTED ShiftBid on this slot"
  - id: ERR_DUPLICATE_ASSIGNMENT
    http: 409
    condition: "The member already has a SCHEDULED, CHECKED_IN or COMPLETED StaffAssignment on this slot; checked before the rest-buffer rule that the same request also violates"
  - id: ERR_SLOT_CAPACITY_FULL
    http: 409
    condition: "PositionSlot.filled_headcount has already reached required_headcount"
  - id: ERR_ACCESSIBILITY_CAPACITY_EXCEEDED
    http: 409
    condition: "Confirming the request would push the resource's peak concurrent committed units above unit_count over the half-open window, or PATCHing unit_count below the current peak_committed_units"
  - id: ERR_REOPEN_LIMIT_REACHED
    http: 409
    condition: "GuestIssue.reopen_count is already 2; checked after ERR_REOPEN_WINDOW_CLOSED"
  - id: ERR_HISTORICAL_ATTENDANCE_MISSING
    http: 409
    condition: "A HISTORICAL_ACTUAL StaffingPlan is requested while Event.historical_actual_attendance is null"

  # -- business: referential --------------------------------------------------
  - id: ERR_RESOLUTION_TYPE_MISMATCH
    http: 409
    condition: "The resolution_type is not in the permitted set for the issue's category (§1.4 priority 20), e.g. EJECTION on a LOST_CHILD issue"
  - id: ERR_RELOCATION_ZONE_UNSTAFFED
    http: 409
    condition: "A SEAT_RELOCATION resolution names a relocation_zone_code that matches no non-CLOSED PositionSlot zone_code on the event's ACTIVE or LOCKED plan"

  # -- business: fiscal -------------------------------------------------------
  - id: ERR_REFUND_STATE_INVALID
    http: 409
    condition: "APPROVE on an issue whose refund_status is APPROVED, DENIED or VOIDED; VOID on an issue that has no live authorization; or a REFUND resolution while refund_status is not APPROVED / PARTIALLY_APPROVED"
  - id: ERR_REFUND_BUDGET_EXHAUSTED
    http: 409
    condition: "Event.refund_budget_remaining_cents plus this issue's already-recorded refund_approved_cents is 0 when an APPROVE is attempted"
  - id: ERR_PAYOUT_PHASE_INVALID
    http: 409
    condition: "payout-run before the event is CLOSED, GRATUITY_ALLOCATION with no eligible ACCRUED assignment, or PAYROLL while a gratuity-eligible ACCRUED assignment is still unallocated"

# =============================================================================
# §1.7 RBAC Matrix — segregation of duties
# =============================================================================
roles:
  - name: GuestExperienceDirector
    description: >-
      Owns the event itself: creates it, moves its lifecycle, sets the recovery budget and gratuity
      pool, runs payouts, holds the 50000-cent refund cap, is the only role that may VOID an
      authorized refund or resolve an ESCALATED issue, and is the only role that may read the
      staffing-model recommendation together with the coordinator.
    identity: opaque
    exclusive_operations:
      - "POST /events"
      - "PATCH /events/{id}"
      - "POST /events/{id}/lifecycle"
      - "POST /events/{id}/payout-run"
      - "POST /guest-issues/{id}/refund-decision with decision VOID"
      - "POST /guest-issues/{id}/resolve from status ESCALATED"
    shared_operations:
      - "POST /guest-issues, POST /guest-issues/{id}/resolve (non-ESCALATED), POST /guest-issues/{id}/refund-decision with decision APPROVE or DENY (50000-cent cap) - shared with GuestServicesSupervisor"
      - "POST /satisfaction-responses - shared with GuestServicesSupervisor"
      - "GET /events/{id}/staffing-model-recommendation - shared with StaffingCoordinator"
      - "all read endpoints except the StaffMember-only surfaces"

  - name: StaffingCoordinator
    description: >-
      Owns the labour supply side: position families, plans, slots, workers, credentials, bid awards,
      manual assignments, attendance marking and backfill. Has no refund authority and cannot move
      the event lifecycle.
    identity: opaque
    exclusive_operations:
      - "POST /position-types and PATCH /position-types/{id}"
      - "POST /staffing-plans and POST /staffing-plans/{id}/activate"
      - "POST /position-slots, PATCH /position-slots/{id}, DELETE /position-slots/{id}, POST /position-slots/{id}/run-bid-award"
      - "POST /staff-members, PATCH /staff-members/{id}, POST /staff-members/{id}/status-change"
      - "POST /certifications, POST /certifications/{id}/revoke"
      - "POST /shift-bids/{id}/award"
      - "POST /staff-assignments"
      - "POST /staff-assignments/{id}/attendance with action NO_SHOW or RELEASE"
      - "POST /backfill-requests/{id}/auto-fill, POST /backfill-requests/{id}/cancel"
    shared_operations:
      - "POST /shift-bids (on a worker's behalf) - shared with StaffMember"
      - "POST /staff-assignments/{id}/attendance with action CHECK_IN or CHECK_OUT - shared with StaffMember"
      - "GET /events/{id}/staffing-model-recommendation - shared with GuestExperienceDirector"
      - "all read endpoints except the satisfaction summary"

  - name: GuestServicesSupervisor
    description: >-
      Owns the guest-facing side: issues from the text line, kiosks and in person, accessibility
      pools and bookings, satisfaction responses. Holds a 5000-cent refund cap, so a larger ask must
      be escalated to the director through AWAITING_AUTHORIZATION.
    identity: opaque
    exclusive_operations:
      - "POST /guest-issues/{id}/assign"
      - "POST /guest-issues/{id}/escalate"
      - "POST /guest-issues/{id}/reopen"
      - "POST /guest-issues/{id}/close"
      - "POST /guest-issues/{id}/refund-request"
      - "POST /accessibility-resources, PATCH /accessibility-resources/{id}"
      - "POST /accessibility-requests, POST /accessibility-requests/{id}/transition"
    shared_operations:
      - "POST /guest-issues, POST /guest-issues/{id}/resolve (non-ESCALATED), POST /guest-issues/{id}/refund-decision with decision APPROVE or DENY (5000-cent cap) - shared with GuestExperienceDirector"
      - "POST /satisfaction-responses, GET /events/{id}/satisfaction-summary - shared with GuestExperienceDirector"
      - "all read endpoints except the staffing-model recommendation"

  - name: StaffMember
    description: >-
      The worker. X-User-ID is the StaffMember.id, so every write is ownership-checked against the
      row's staff_member_id. May bid, withdraw a bid and check in / out of their own shift; may never
      mark a no-show, release a shift, award a bid or touch guest issues.
    identity: "entity_backed:StaffMember"
    exclusive_operations:
      - "POST /shift-bids/{id}/withdraw (own bid only)"
    shared_operations:
      - "POST /shift-bids for their own staff_member_id - shared with StaffingCoordinator"
      - "POST /staff-assignments/{id}/attendance with action CHECK_IN or CHECK_OUT on their own assignment - shared with StaffingCoordinator"
      - "GET /events, GET /events/{id}, GET /position-slots, GET /position-slots/{id}, GET /shift-bids, GET /shift-bids/{id}, GET /staff-assignments, GET /staff-assignments/{id}, GET /staff-members/{id}, GET /staff-members/{id}/certifications, GET /certifications, GET /certifications/{id}"

conditional_role_rules:
  - rule: "POST /guest-issues/{id}/refund-decision accepts decision VOID only from GuestExperienceDirector; a GuestServicesSupervisor sending VOID gets ERR_ROLE_NOT_PERMITTED (priority 2) before any refund-state check."
  - rule: "POST /guest-issues/{id}/resolve from status ESCALATED accepts only GuestExperienceDirector; a GuestServicesSupervisor gets ERR_ROLE_NOT_PERMITTED even though the same role may resolve the same issue from IN_PROGRESS."
  - rule: "POST /staff-assignments/{id}/attendance accepts action NO_SHOW and RELEASE only from StaffingCoordinator; a StaffMember gets ERR_ROLE_NOT_PERMITTED, and a StaffMember sending CHECK_IN on someone else's assignment gets ERR_NOT_RESOURCE_OWNER (priority 7)."
  - rule: "The X-User-ID that files POST /guest-issues/{id}/refund-request may not be the X-User-ID that decides it, and neither may be the reporter recorded at POST /guest-issues (ERR_SEGREGATION_OF_DUTIES, priority 8)."
