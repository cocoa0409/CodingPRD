  - rule_id: boundary_precision_check
    instances:
      - name: response_window_exclusive_upper_bound
        grounds:
          - calculations.response_window_validation
          - errors[ERR_RESPONSE_WINDOW_CLOSED]
          - endpoints.POST_/survey/invitations/{id}/responses
