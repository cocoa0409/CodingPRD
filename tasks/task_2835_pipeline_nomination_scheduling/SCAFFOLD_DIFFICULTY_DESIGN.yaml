  - rule_id: combinatorial_formula
    instances:
      - name: history_weighted_proration_nested_caps_pools_and_waterfall_tiebreak
        grounds:
          - calculations.capacity_proration
          - calculations.shipper_history_base
          - calculations.effective_capacity
          - entities.Nomination.fields.allocation_class
          - entities.NominationCycle.fields.unallocated_capacity_bbl
        distinguishing_aspect: |
          Mode (a) — one formula whose result depends on four interacting branches: the
          HISTORICAL/NEW_SHIPPER class split driven by MIN_HISTORY_RECORDS=2, the 10% reserve pool,
          the nested min(nominated, history_base) weight cap, and a single waterfall redistribution
          pass whose two candidates tie on shortfall (10000 bbl each) and are separated only by the
          created_at tie-break, so BRAVO reaches 40000 bbl and CHARLIE stops at 10000 bbl.
        test_recipe:
          setup:
            - "Segment HOU-NAS with effective capacity 100000 bbl (101000 nameplate, 1000 transmix reserve, linefill funded)."
            - "ALPHA has two FINAL history rows (30000, 42000) plus one PROVISIONAL row of 90000 bbl that must be excluded: history base 36000 bbl, class HISTORICAL."
            - "BRAVO has two FINAL history rows (20000, 16000): history base 18000 bbl, class HISTORICAL."
            - "CHARLIE has exactly one FINAL history row (12000): history base 12000 bbl but class NEW_SHIPPER because MIN_HISTORY_RECORDS is 2."
            - "Nominations, created in this order: ALPHA 50000 bbl ULSD, BRAVO 40000 bbl CBOB, CHARLIE 20000 bbl ULSD; the cycle is CLOSED."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: TariffAdministrator
            - call: "POST /pipeline/terminals"
              payload: { terminal_code: "HOU", name: "Houston Origin", role_kind: "ORIGIN", shell_capacity_bbl: 500000, min_operating_inventory_bbl: 10000, injection_bays: 2 }
              as: TariffAdministrator
              captures: { org_id: "$.data.id", org_v0: "$.data.version" }
            - call: "POST /pipeline/terminals"
              payload: { terminal_code: "NAS", name: "Nashville Delivery", role_kind: "DESTINATION", shell_capacity_bbl: 400000, min_operating_inventory_bbl: 5000 }
              as: TariffAdministrator
              captures: { dst_id: "$.data.id" }
            - call: "POST /pipeline/product-grades"
              payload: { grade_code: "ULSD", name: "Ultra Low Sulfur Diesel", sequence_rank: 3, max_sulfur_ppm: 15, max_rvp_psi: 12 }
              as: TariffAdministrator
              captures: { ulsd_id: "$.data.id" }
            - call: "POST /pipeline/product-grades"
