    path: "/ugc/users"
    description: "Register a new user"
    roles: [Anonymous]
    code: 201
    input: [username, email, date_of_birth, "parent_user_id?"]
    output: User
    side_effects: ["age_band computed; chat_filter_level computed; AuditLog entry"]

  - method: GET
    path: "/ugc/users/{id}"
    description: "Get user"
    roles: [Anonymous, Creator, PlatformAdmin, SafetyAgent, Moderator, AppealsReviewer, FinanceOfficer]
    code: 200
    input: []
    output: User
    side_effects: []

  - method: GET
    path: "/ugc/users"
    description: "List users"
    roles: [PlatformAdmin, SafetyAgent, Moderator, AppealsReviewer, FinanceOfficer]
    code: 200
    input: ["status?", "age_band?", "parent_user_id?", "limit?", "offset?"]
    output: "User[]"
    side_effects: []

  - method: POST
    path: "/ugc/users/{id}/suspend"
    description: "Suspend user (cascades to experiences, resale listings, devex)"
    roles: [PlatformAdmin, SafetyAgent]
    code: 200
    input: [reason]
    output: User
    side_effects: ["See User state machine; increments version"]

  - method: POST
    path: "/ugc/users/{id}/reinstate"
    description: "Reinstate suspended user"
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: User
    side_effects: ["increments version"]

  - method: POST
    path: "/ugc/users/{id}/parental-controls"
    description: "Create or replace parental controls for a child account"
