        distinguishing_aspect: |
          A third metric (net_rollover_cents against ROLLOVER_SHORTFALL_LIMIT_CENTS 30000)
          on a third endpoint (POST /upgrade-requests/{id}/completion). A low-trade-in-base
          handset makes the rollover huge: payoff 38714 minus a graded credit of only 3700
          leaves gross_rollover_cents 35014, so the customer must bring cash. An
          additional_down_payment_cents of 5013 leaves net 30001 and must be refused with 422;
          exactly 5014 leaves net 30000, which is at the limit and must be accepted because
          the comparison is <=. The same accepted call also pins the top fee tier
          (pre_fee_base_cents 149900 >= ORIGINATION_FEE_TIER_2_MAX 100000 so the fee is 2500)
