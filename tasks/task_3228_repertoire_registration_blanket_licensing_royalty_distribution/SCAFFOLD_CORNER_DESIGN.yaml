          setup_api_calls:
            - call: "POST /pro/affiliates"
              payload: { legal_name: "OV Pub", party_type: PUBLISHER, affiliation_code: "OVP" }
              as: ProRegistrar
              captures: { ov_id: $.data.id }
            - call: "POST /pro/works"
              payload: { title: "OV Song", registered_by_affiliate_id: "${ov_id}" }
              as: Publisher
              as_user_id: "${ov_id}"
              captures: { ov_work: $.data.id }
            - call: "POST /pro/works/${ov_work}/share-claims"
              payload: { affiliate_id: "${ov_id}", role: PUBLISHER, collection_share_bps: 10000, interest_share_bps: 10000 }
              as: Publisher
              as_user_id: "${ov_id}"
            - call: "POST /pro/works/${ov_work}/confirm"
              payload: {}
              as: ProRegistrar
            - call: "POST /pro/licensees"
              payload: { legal_name: "OV Net", category: BROADCASTER, reported_revenue_cents: 300000000000, usage_units: 0 }
              as: ProLicensingAdmin
              captures: { ov_le: $.data.id, ov_le_ver: $.data.version }
            - call: "POST /pro/licensees/${ov_le}/licenses"
              payload: { effective_date: "2026-01-01", expiry_date: "2026-12-31", expected_licensee_version: "${ov_le_ver}" }
              as: ProLicensingAdmin
              captures: { ov_lic: $.data.id }
            - call: "POST /pro/performances"
              payload: { work_id: "${ov_work}", license_id: "${ov_lic}", performance_date: "2026-02-01", medium: TERRESTRIAL_RADIO, daypart: DAY, source: MONITORING, play_count: 10 }
              as: RoyaltyDistributor
              captures: { ov_ev: $.data.id }
            - call: "POST /pro/cycles"
              payload: { label: "OV1", period_start: "2026-01-01", period_end: "2026-03-31" }
              as: RoyaltyDistributor
              captures: { ov_cyc: $.data.id }
            - call: "POST /pro/cycles/${ov_cyc}/open"
              payload: {}
              as: RoyaltyDistributor
            - call: "GET /pro/cycles/${ov_cyc}"
              payload: {}
              as: RoyaltyDistributor
              captures: { ov_ver_stale: $.data.version }
            - call: "POST /pro/cycles/${ov_cyc}/performances/capture"
              payload: { performance_event_ids: ["${ov_ev}"] }
              as: RoyaltyDistributor
          trigger:
            - call: "POST /pro/cycles/${ov_cyc}/close-collection"
              payload: { expected_cycle_version: "${ov_ver_stale}" }
              as: RoyaltyDistributor
          assert:
            - "response error_id == ERR_STALE_VERSION (412) — capture advanced the cycle version after the client read it"
      - name: occ_stale_licensee_version_on_issue
        claim_type: optimistic_concurrency
        grounds: [concurrency_rules.license-issue-stale-licensee]
        distinguishing_aspect: "license issuance with an expected_licensee_version captured before a revenue PATCH recomputed the fee returns ERR_STALE_VERSION (412); retrying with the fresh version pins the NEW fee as fee_basis_cents."
        test_recipe:
          setup: ["licensee created (version v0, fee 86_000_000); client reads version; a PATCH updates revenue (version v0+1, fee recomputed)"]
          setup_api_calls:
            - call: "POST /pro/licensees"
              payload: { legal_name: "OCV Co", category: VENUE, reported_revenue_cents: 10000000000, usage_units: 400 }
