              as: Advertiser
              as_user_id: "${adv_id}"
              captures: { cr_high_id: "$.data.id" }
            - call: "POST /ad-policy/ad-creatives"
              payload: { advertiser_id: "${adv_id}", headline: "Reserve cask offer encore", body_text: "Encore of the reserve cask offer for spirits lovers.", declared_category_codes: ["ALC_SPIRITS"], target_country_codes: ["SE", "US"], landing_page_url: "https://www.belmontcellars.example/l", display_url: "https://www.belmontcellars.example/l", disclaimer_text: "Drink responsibly. 21+" }
