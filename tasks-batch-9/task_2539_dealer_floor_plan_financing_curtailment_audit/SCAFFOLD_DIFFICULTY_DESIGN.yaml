            - "Eighth trigger call returns 201 with ${au18b_type} == \"UNANNOUNCED\" - exactly 14 days after 2026-08-12 is acceptable, and no notice period applies to UNANNOUNCED audits"
            - "Ninth trigger call returns 422 and ${err18d} == \"ERR_UNANNOUNCED_WINDOW_INVALID\" because a 5-day UNANNOUNCED window exceeds the 3-day maximum even though its gap and overlap checks pass"
            - "GET /floorplan/audits?dealer_id=${d18} returns exactly two rows, ${au18a} in RECONCILED_CLEAN and ${au18b} in SCHEDULED"

  # =========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: credit_limit_capacity_identity_survives_a_funding_reversal_without_drift
        grounds:
          - calculations.credit_line_availability
          - state_machines.FundingAdvance.FUNDED_to_REVERSED
          - state_machines.InventoryUnit.FLOORED_to_REGISTERED
          - state_machines.CurtailmentObligation.SCHEDULED_to_CANCELLED
          - validations[priority=106]
          - global_constants.ADVANCE_REVERSAL_WINDOW_DAYS
          - endpoints["POST /floorplan/funding-advances/{id}/reverse"]
        distinguishing_aspect: |
          A MONEY-CONSERVATION identity - credit_limit_cents == available_credit_cents +
          outstanding_principal_cents + charged_off_principal_cents - checked across a
          COMPENSATING transition, with a second funded unit left untouched to prove the
          reversal subtracts exactly its own contribution and does not simply reset the
          line to its opening balance.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z."
            - "One ACTIVE Dealer with one ACTIVE CreditLine: credit_limit_cents 500000000, NEW rate 10000 bps, USED rate 9000 bps, NEW tier [90,unbounded) at 1000 bps and USED tier [90,unbounded) at 1500 bps."
            - "Unit A is a NEW unit with invoice_amount_cents 3000000, funded for 3000000."
            - "Unit B is a USED unit with invoice_amount_cents 2000000, funded for 1800000, and is never touched by the trigger."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: SystemOperator
              as_user_id: "u-sys-1"
            - call: "POST /floorplan/dealers"
              payload: { legal_name: "Ledger Conservation Motors LLC", franchise_type: "FRANCHISE_NEW_CAR", state_code: "KS" }
              as: CreditOfficer
              as_user_id: "u-co-1"
              captures: { d19: "$.data.id" }
            - call: "POST /floorplan/credit-lines"
              payload: { dealer_id: "${d19}", credit_limit_cents: 500000000, advance_rate_bps_new: 10000, advance_rate_bps_used: 9000, advance_rate_bps_demonstrator: 8500, max_unit_advance_cents_new: 20000000, max_unit_advance_cents_used: 10000000, max_unit_advance_cents_demonstrator: 10000000, class_sublimit_cents_used: 100000000, class_sublimit_cents_demonstrator: 50000000, curtailment_grace_days: 5 }
              as: CreditOfficer
              as_user_id: "u-co-1"
              captures: { cl19: "$.data.id" }
            - call: "POST /floorplan/credit-lines/${cl19}/curtailment-tiers"
              payload: { inventory_class: "NEW", age_days_from: 90, age_days_to: null, cumulative_paydown_bps: 1000 }
              as: CreditOfficer
              as_user_id: "u-co-1"
            - call: "POST /floorplan/credit-lines/${cl19}/curtailment-tiers"
              payload: { inventory_class: "USED", age_days_from: 90, age_days_to: null, cumulative_paydown_bps: 1500 }
              as: CreditOfficer
              as_user_id: "u-co-1"
            - call: "POST /floorplan/credit-lines/${cl19}/activate"
              payload: {}
              as: CreditOfficer
              as_user_id: "u-co-1"
            - call: "POST /floorplan/units"
              payload: { dealer_id: "${d19}", credit_line_id: "${cl19}", vin: "1LEDGERUNITA00010", inventory_class: "NEW", invoice_amount_cents: 3000000, invoice_date: "2026-08-01", odometer_miles: 6, title_document_type: "MSO" }
              as: DealerPrincipal
              as_user_id: "${d19}"
              captures: { u19a: "$.data.id" }
            - call: "POST /floorplan/units/${u19a}/title-custody"
              payload: { new_custody_status: "LENDER_HELD", document_reference: "MSO-0019A" }
              as: CreditOfficer
              as_user_id: "u-co-1"
            - call: "POST /floorplan/units/${u19a}/funding-advances"
              payload: { requested_amount_cents: 3000000, dealer_invoice_reference: "INV-0019A" }
              as: DealerPrincipal
              as_user_id: "${d19}"
              captures: { a19a: "$.data.id" }
            - call: "GET /floorplan/credit-lines/${cl19}"
              payload: {}
              as: CreditOfficer
              as_user_id: "u-co-1"
              captures: { cl19_v1: "$.data.version" }
            - call: "POST /floorplan/funding-advances/${a19a}/fund"
              payload: { expected_credit_line_version: "${cl19_v1}", disbursement_reference: "WIRE-0019A" }
              as: CreditOfficer
              as_user_id: "u-co-1"
            - call: "POST /floorplan/units"
              payload: { dealer_id: "${d19}", credit_line_id: "${cl19}", vin: "1LEDGERUNITB00010", inventory_class: "USED", invoice_amount_cents: 2000000, invoice_date: "2026-08-01", odometer_miles: 41000, title_document_type: "TITLE" }
              as: DealerPrincipal
              as_user_id: "${d19}"
              captures: { u19b: "$.data.id" }
            - call: "POST /floorplan/units/${u19b}/title-custody"
              payload: { new_custody_status: "LENDER_HELD", document_reference: "TITLE-0019B" }
              as: CreditOfficer
              as_user_id: "u-co-1"
            - call: "POST /floorplan/units/${u19b}/funding-advances"
              payload: { requested_amount_cents: 2000000, dealer_invoice_reference: "INV-0019B" }
              as: DealerPrincipal
              as_user_id: "${d19}"
              captures: { a19b: "$.data.id" }
            - call: "GET /floorplan/credit-lines/${cl19}"
              payload: {}
              as: CreditOfficer
              as_user_id: "u-co-1"
              captures: { cl19_v2: "$.data.version" }
            - call: "POST /floorplan/funding-advances/${a19b}/fund"
              payload: { expected_credit_line_version: "${cl19_v2}", disbursement_reference: "WIRE-0019B" }
              as: CreditOfficer
              as_user_id: "u-co-1"
            - call: "GET /floorplan/credit-lines/${cl19}"
              payload: {}
              as: CreditOfficer
              as_user_id: "u-co-1"
              captures: { cl19_v3: "$.data.version", cl19_avail_before: "$.data.available_credit_cents", cl19_out_before: "$.data.outstanding_principal_cents" }
          trigger:
            - call: "POST /floorplan/funding-advances/${a19a}/reverse"
              payload: { expected_credit_line_version: "${cl19_v3}", reason_code: "FUNDING_ERROR" }
              as: CreditOfficer
              as_user_id: "u-co-1"
              captures: { a19a_status: "$.data.status", a19a_reason: "$.data.reason_code" }
            - call: "GET /floorplan/credit-lines/${cl19}"
              payload: {}
              as: CreditOfficer
              as_user_id: "u-co-1"
              captures: { cl19_avail_after: "$.data.available_credit_cents", cl19_out_after: "$.data.outstanding_principal_cents", cl19_chg_after: "$.data.charged_off_principal_cents", cl19_used_after: "$.data.class_outstanding_cents_used" }
          assert:
            - "Before the trigger: ${cl19_out_before} == 4800000 and ${cl19_avail_before} == 495200000, so 500000000 == 495200000 + 4800000 + 0"
            - "${a19a_status} == \"REVERSED\" and ${a19a_reason} == \"FUNDING_ERROR\""
            - "After the trigger: ${cl19_out_after} == 1800000, ${cl19_avail_after} == 498200000, ${cl19_chg_after} == 0, so 500000000 == 498200000 + 1800000 + 0 - the identity is restored with no drift"
            - "${cl19_used_after} == 1800000 and CreditLine.${cl19}.class_outstanding_cents_demonstrator == 0 - unit B's contribution is untouched"
            - "InventoryUnit.${u19a}.funding_status == REGISTERED with advance_amount_cents == 0, outstanding_principal_cents == 0, floored_at == null and funded_by_user_id == null"
            - "Every CurtailmentObligation of ${u19a} has status CANCELLED, and GET /floorplan/curtailment-obligations?unit_id=${u19a}&status=SCHEDULED returns total_count 0"
            - "InventoryUnit.${u19b}.funding_status == FLOORED with advance_amount_cents == 1800000 and its SCHEDULED obligation still carries projected_principal_cents == 270000"
            - "CreditLine.${cl19}.eligible_collateral_cents == 1800000 and borrowing_base_deficiency_cents == 0"
            - "A second POST /floorplan/funding-advances/${a19a}/reverse returns 409 ERR_ADVANCE_NOT_PENDING or the advance-state error for a REVERSED advance, never a second credit restoration"

      - name: audit_scope_count_identity_survives_an_abort_that_rolls_the_counters_back
        grounds:
          - state_machines.FloorPlanAudit.IN_PROGRESS_to_ABORTED
          - entities.FloorPlanAudit.fields.units_in_scope_count
          - entities.FloorPlanAudit.fields.units_verified_count
          - entities.FloorPlanAudit.fields.units_exception_count
          - entities.FloorPlanAudit.fields.units_unobserved_count
          - entities.UnitAuditObservation
          - endpoints["POST /floorplan/audits/{id}/abort"]
        distinguishing_aspect: |
          A COUNT-CONSERVATION identity rather than a money one - units_in_scope_count ==
          verified + exception + unobserved - and the compensation is ASYMMETRIC: abort
          rolls the three summands back to 0 / 0 / in_scope while the immutable
          UnitAuditObservation rows survive and stay readable, so the identity holds at
          three distinct points with two different decompositions of the same total.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z."
