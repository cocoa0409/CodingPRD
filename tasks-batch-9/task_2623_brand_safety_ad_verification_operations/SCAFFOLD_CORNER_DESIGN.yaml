              as_user_id: "${adv_id}"
              captures: { e_window: $.data.error_id }
            - call: "POST /refund-claims"
              payload: { campaign_id: "${camp_main}", publisher_id: "${pub_id}", batch_ids: ["${batch_old}", "${batch_recent}"], expected_campaign_version: "${camp_ver}" }
              as: Advertiser
              as_user_id: "${adv_id}"
              captures: { claim_id: $.data.id, claimed: $.data.claimed_impressions, provisional: $.data.provisional_credit_cents }
          assert:
            - "Setup: ${old_status} == QUARANTINED, so nothing but the window can disqualify ${batch_old}"
            - "Trigger 1: HTTP 404 and ${e_deref} == ERR_MEASUREMENT_BATCH_NOT_FOUND - priority 5 dereferences every element of batch_ids before any downstream check, even though the resolvable element is 69 days stale"
            - "Trigger 2: HTTP 422 and ${e_scope} == ERR_BATCH_SCOPE_MISMATCH - priority 15 confines the set to (${camp_main}, ${pub_id}) before priority 33 may read window_end values from it"
            - "Trigger 3: HTTP 422 and ${e_window} == ERR_CLAIM_WINDOW_CLOSED - with the set finally clean, the latest cited window_end is 2026-06-01T01:00:00Z and the clock is 2026-08-10T00:00:00Z, past the 30-day limit"
            - "Trigger 4: HTTP 201; adding ${batch_recent} moves the governing window_end to 2026-08-09T01:00:00Z, inside 30 days, so the identical stale batch that was refused in trigger 3 is now accepted alongside it - the window is a property of the cited SET, not of each batch"
            - "Trigger 4 fiscal figures under variant gross_impression_basis: both cited batches are defective (coverage_rate 0.6000 < the pinned floor 0.7) so ${claimed} == 10000 + 10000 == 20000 and ${provisional} == round_half_up(10000 * 875 / 1000) + round_half_up(10000 * 875 / 1000) == 8750 + 8750 == 17500"
            - "After triggers 1-3: Campaign.${camp_main}.version is still ${camp_ver} and open_claim_count is 0, and both ${batch_old} and ${batch_recent} are still UNBILLED - three refusals settled nothing"
            - "After trigger 4: RefundClaim.${claim_id}.claim_state == SUBMITTED and MeasurementBatch.${batch_old}.settlement_status == MeasurementBatch.${batch_recent}.settlement_status == CLAIMED"

  # From Table 5 (Endpoints)
  - section: endpoints
    instances:
      - name: advertiser_create_read_round_trip_and_unknown_id_lookup
        claim_type: standard_crud
        grounds:
          - endpoints[POST /advertisers]
          - endpoints[GET /advertisers/{id}]
          - entities.Advertiser
          - errors[ERR_ADVERTISER_NOT_FOUND]
        distinguishing_aspect: |
          The Advertiser aggregate is the fiscal root, and the read path must
          expose its two computed ledger fields at their initial values before
          any claim exists - a GET that omits credit_received_cents_total or
          settled_claim_count would still look like a valid entity read. The
          unknown-id probe pins the 404 to ERR_ADVERTISER_NOT_FOUND rather than
          a generic not-found.
        test_recipe:
          setup:
            - "Clock 2026-08-10T00:00:00Z; nothing else exists."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /advertisers"
              payload: { name: "Northwind Media", credit_cap_cents: 250000 }
              as: PlatformAdmin
              captures: { adv_id: $.data.id, adv_ver: $.data.version }
            - call: "GET /advertisers/${adv_id}"
              payload: {}
              as: Advertiser
              as_user_id: "${adv_id}"
              captures: { echo_id: $.data.id }
            - call: "GET /advertisers/33333333-3333-3333-3333-333333333333"
              payload: {}
              as: PlatformAdmin
              captures: { err_missing: $.data.error_id }
          assert:
            - "Trigger 1: HTTP 201; Advertiser.${adv_id}.name == 'Northwind Media', credit_cap_cents == 250000, credit_received_cents_total == 0, settled_claim_count == 0, created_at == 2026-08-10T00:00:00Z, updated_at == 2026-08-10T00:00:00Z, ${adv_ver} == 1"
            - "Trigger 2: HTTP 200 and ${echo_id} == ${adv_id}; every field returned by trigger 1 comes back identical, including version == ${adv_ver}, so the read is not recomputing the ledger"
            - "Trigger 3: HTTP 404 and ${err_missing} == ERR_ADVERTISER_NOT_FOUND"

      - name: publish_action_snapshots_the_list_version_and_stamps_the_clock
        claim_type: action_endpoint
        grounds:
          - endpoints[POST /inventory-lists/{id}/publish]
          - state_machines.InventoryList.DRAFT_to_PUBLISHED
          - entities.InventoryList
        distinguishing_aspect: |
          publish has three distinct side effects that are easy to conflate:
          published_version snapshots the list's version AS OF the publish (the
          pre-increment value), published_at takes the LOGICAL clock (not wall
          time), and only then does version increment. An implementation that
          snapshots after the increment reports published_version one too high,
          which later makes a synced segment's synced_inclusion_version
          disagree with the list it pinned.
        test_recipe:
          setup:
            - "Clock 2026-08-10T00:00:00Z; one advertiser, one ACTIVE publisher, one DRAFT INCLUSION list holding a single PUBLISHER/ALLOW entry naming that publisher. The list version immediately before publish is captured so the snapshot can be checked against it."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /advertisers"
              payload: { name: "Northwind Media", credit_cap_cents: 1000000 }
              as: PlatformAdmin
              captures: { adv_id: $.data.id }
            - call: "POST /publishers"
              payload: { name: "Beacon Digital", primary_domain: "beacon.example.com", sourced_traffic_pct: 0.40 }
              as: PlatformAdmin
              captures: { pub_id: $.data.id }
            - call: "POST /inventory-lists"
              payload: { advertiser_id: "${adv_id}", list_type: "INCLUSION", name: "Beacon Allowlist" }
              as: Advertiser
              as_user_id: "${adv_id}"
              captures: { list_id: $.data.id }
            - call: "POST /inventory-lists/${list_id}/entries"
              payload: { entry_type: "PUBLISHER", entry_value: "${pub_id}" }
              as: Advertiser
              as_user_id: "${adv_id}"
              captures: { entry_id: $.data.id }
            - call: "GET /inventory-lists/${list_id}"
              payload: {}
              as: Advertiser
              as_user_id: "${adv_id}"
              captures: { list_ver_before: $.data.version, entry_count_before: $.data.entry_count }
          trigger:
            - call: "POST /inventory-lists/${list_id}/publish"
              payload: {}
              as: Advertiser
              as_user_id: "${adv_id}"
              captures: { published_version: $.data.published_version, published_at: $.data.published_at }
            - call: "POST /inventory-lists/${list_id}/publish"
              payload: {}
              as: Advertiser
              as_user_id: "${adv_id}"
              captures: { err_second: $.data.error_id }
          assert:
            - "Before the trigger: InventoryList.${list_id}.status == DRAFT, ${entry_count_before} == 1, published_version is null and published_at is null"
            - "ListEntry.${entry_id}.action == ALLOW and specificity_rank == 2, derived from the INCLUSION parent and the PUBLISHER entry_type"
            - "Trigger 1: HTTP 200; status == PUBLISHED, ${published_version} == ${list_ver_before} (the pre-increment snapshot), ${published_at} == 2026-08-10T00:00:00Z, stale_reason is null"
            - "Trigger 1 also increments the list: InventoryList.${list_id}.version == ${list_ver_before} + 1, so version and published_version now differ by exactly 1"
            - "Trigger 2 (publish again from PUBLISHED, which is not a declared transition): HTTP 409 and ${err_second} == ERR_INVALID_LIST_STATE"
            - "After trigger 2: published_version is still ${published_version} and version is still ${list_ver_before} + 1 - the refused republish neither re-snapshotted nor bumped anything"

      - name: claim_batch_ids_is_all_or_nothing_across_every_cited_batch
        claim_type: bulk_action
        grounds:
          - endpoints[POST /refund-claims]
          - validations.priority_6
          - validations.priority_15
          - validations.priority_16
          - errors[ERR_BATCH_SCOPE_MISMATCH]
        distinguishing_aspect: |
          batch_ids is the only bulk input in the API and it is transactional,
          not best-effort: one bad member voids the whole claim, and no partial
          claim, no partially flipped settlement_status and no version bump may
          survive a refusal. The three refusal modes are also distinct - a
