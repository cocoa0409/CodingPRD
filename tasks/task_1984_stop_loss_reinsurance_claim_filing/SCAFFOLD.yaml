scenario: |
  1984. Stop-Loss & Reinsurance Claim Filing (self-funded plans): specific/aggregate deductible tracking per member, claim accumulation & 50% notice reporting, filing deadline (run-in/run-out) compliance, contract terms (lasering/mirroring) & disputed charges, reimbursement receipt & posting to plan, high-cost claimant forecast & renewal underwriting, policy year vs paid-basis contract nuances, audit of claim eligibility

domain_name: stop-loss-reinsurance-claim-filing
api_prefix: /stop-loss

complexity_profile:
  primary_archetype: ledger_reconciliation
  secondary_archetype: compliance_audit
  complexity_layers:
    - dual_variant_calculation
    - derived_field_reconciliation
    - rate_threshold_triggers
    - optimistic_concurrency
  entity_topology: hybrid
  state_machine_shape: branching
  relationship_patterns:
    - one_to_many
    - cross_aggregate
  role_model: segregation_of_duties
  consistency_model: immediate

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Plan
    parent: null
    common_fields: true
    fields:
      - name: plan_name
        type: string
        source: input
        description: Legal name of the self-funded employer health plan
      - name: sponsor_tax_id
        type: string
        source: input
        description: Employer sponsor EIN
      - name: status
        type: enum
        source: system
        description: Plan lifecycle status
        constraints: "one of {ACTIVE, TERMINATED}"
        default: ACTIVE

  - name: StopLossContract
    parent: null
    common_fields: true
    fields:
      - name: plan_id
        type: string
        source: input
        description: "FK -> Plan.id; the self-funded plan this contract insures"
      - name: policy_year_start
        type: datetime
        source: input
        description: ISO8601 UTC start of the policy year (inclusive)
      - name: policy_year_end
        type: datetime
        source: input
        description: ISO8601 UTC end of the policy year (exclusive)
      - name: contract_basis
        type: enum
        source: input
        description: Coverage basis of this contract
        constraints: "one of {POLICY_YEAR, PAID}"
      - name: specific_deductible_cents
        type: integer
        source: input
        description: Per-member specific stop-loss deductible in cents (>= 0)
      - name: aggregate_deductible_cents
        type: integer
        source: input
        description: Plan-wide aggregate stop-loss deductible in cents (>= 0)
      - name: aggregating_specific_deductible_cents
        type: integer
        source: input
        description: Cap on per-member accumulation credited toward the aggregate deductible (>= specific_deductible_cents when present, else null)
      - name: filing_deadline_days
        type: integer
        source: input
        description: Days after policy_year_end within which filings must be submitted (>= 1)
      - name: notice_threshold_pct
        type: number
        source: input
        description: Fraction of specific deductible that triggers the 50% notice obligation; canonical 0.50
        constraints: "0 < value <= 1"
      - name: run_in_days
        type: integer
        source: input
        description: Days before policy_year_start whose PAID claims count toward this contract (>= 0)
      - name: run_out_days
        type: integer
        source: input
        description: Days after policy_year_end whose PAID claims count toward this contract (>= 0)
      - name: status
        type: enum
        source: system
        description: Contract lifecycle
        constraints: "one of {DRAFT, IN_FORCE, EXPIRED, RENEWED}"
        default: DRAFT

  - name: LaseredMemberTerm
    parent: null
    common_fields: true
    fields:
      - name: contract_id
        type: string
        source: input
        description: "FK -> StopLossContract.id; contract carrying the lasered term"
      - name: member_id
        type: string
        source: input
        description: "FK -> Member.id; member subject to a higher (lasered) specific deductible"
      - name: lasered_specific_deductible_cents
        type: integer
        source: input
        description: Override specific deductible for this member; MUST be strictly greater than contract.specific_deductible_cents
      - name: effective_from
        type: datetime
        source: input
        description: Start of laser applicability (inclusive)
      - name: effective_to
        type: datetime
        source: input
        description: End of laser applicability (exclusive)
      - name: status
        type: enum
        source: system
        description: Laser lifecycle
        constraints: "one of {ACTIVE, RESCINDED}"
        default: ACTIVE

  - name: Member
    parent: null
    common_fields: true
    fields:
      - name: plan_id
        type: string
        source: input
        description: "FK -> Plan.id; plan covering this member"
      - name: member_external_id
        type: string
        source: input
        description: Member identifier assigned by the TPA
      - name: date_of_birth
        type: string
        source: input
        description: ISO date YYYY-MM-DD
      - name: coverage_start
        type: datetime
        source: input
        description: Coverage effective date (inclusive)
      - name: coverage_end
        type: datetime
        source: input
        description: Coverage termination date (exclusive); null while active
      - name: notice_status
        type: enum
        source: computed
        description: 50% notice obligation posture for this member under the in-force contract
        constraints: "one of {NONE, NOTICE_PENDING, NOTICE_FILED}"
        default: NONE
      - name: status
        type: enum
        source: system
        description: Member lifecycle
        constraints: "one of {ACTIVE, TERMINATED}"
        default: ACTIVE

  - name: Claim
    parent: null
    common_fields: true
    fields:
      - name: plan_id
        type: string
        source: input
        description: "FK -> Plan.id; plan that paid the claim"
      - name: member_id
        type: string
        source: input
        description: "FK -> Member.id; member who incurred the claim"
      - name: service_date
        type: datetime
        source: input
        description: Date of service (UTC midnight)
      - name: paid_date
        type: datetime
        source: input
        description: Date the plan paid the claim; null until PAID
      - name: billed_amount_cents
        type: integer
        source: input
        description: Provider billed amount (>= 0)
      - name: allowed_amount_cents
        type: integer
        source: input
        description: Plan-allowed amount after repricing (0 <= allowed <= billed)
      - name: paid_amount_cents
        type: integer
        source: input
        description: Amount the plan actually paid (0 <= paid <= allowed)
      - name: claim_type
        type: enum
        source: input
        description: Coverage category
        constraints: "one of {MEDICAL, RX}"
      - name: status
        type: enum
        source: system
        description: Claim lifecycle
        constraints: "one of {SUBMITTED, ADJUDICATED, PAID, REVERSED}"
        default: SUBMITTED

  - name: ClaimAccumulation
    parent: null
    common_fields: true
    fields:
      - name: contract_id
        type: string
        source: input
        description: "FK -> StopLossContract.id; contract scope of the accumulation"
      - name: member_id
        type: string
        source: input
        description: "FK -> Member.id; member whose claims are accumulated (null on the aggregate row)"
      - name: scope
        type: enum
        source: input
        description: Whether this row tracks the specific (per-member) or aggregate (whole-plan) accumulator
        constraints: "one of {SPECIFIC, AGGREGATE}"
      - name: accumulated_cents
        type: integer
        source: computed
        description: Running total of eligible paid claim dollars credited toward the deductible under the contract basis; recomputed on every claim mutation
      - name: excess_cents
        type: integer
        source: computed
        description: max(0, accumulated_cents - applicable_deductible_cents); recomputed on every mutation
      - name: applicable_deductible_cents
        type: integer
        source: computed
        description: Deductible in force for this row (lasered override when scope=SPECIFIC and a laser covers the member, else contract specific deductible; contract aggregate deductible when scope=AGGREGATE)
      - name: notice_triggered
        type: boolean
        source: computed
        description: true iff scope=SPECIFIC and accumulated_cents >= notice_threshold_pct * applicable_deductible_cents
        default: false

  - name: StopLossFiling
    parent: null
    common_fields: true
    fields:
      - name: contract_id
        type: string
        source: input
        description: "FK -> StopLossContract.id; contract this filing claims reimbursement under"
      - name: filing_scope
        type: enum
        source: input
        description: Specific (per-member) or aggregate (whole-plan) filing
        constraints: "one of {SPECIFIC, AGGREGATE}"
      - name: member_id
        type: string
        source: input
        description: "FK -> Member.id; required when filing_scope=SPECIFIC; null when AGGREGATE"
      - name: requested_amount_cents
        type: integer
        source: computed
        description: Sum of FilingLineItem.eligible_excess_cents at submission; recomputed whenever line items change
      - name: approved_amount_cents
        type: integer
        source: computed
        description: Carrier-approved amount after review; null until APPROVED or PAID
      - name: submitted_at
        type: datetime
        source: computed
        description: Server timestamp of the DRAFT->SUBMITTED transition; null while DRAFT
      - name: status
        type: enum
        source: system
        description: Filing lifecycle
        constraints: "one of {DRAFT, SUBMITTED, UNDER_REVIEW, DISPUTED, APPROVED, DENIED, PAID}"
        default: DRAFT

  - name: FilingLineItem
    parent: StopLossFiling
    common_fields: false
    fields:
      - name: filing_id
        type: string
        source: input
        description: "FK -> StopLossFiling.id; filing this line belongs to"
      - name: claim_id
        type: string
        source: input
        description: "FK -> Claim.id; claim contributing to the filing"
      - name: eligible_excess_cents
        type: integer
        source: computed
        description: Portion of this claim's paid dollars that sits above the applicable deductible given the claim's chronological position in the accumulation sweep; recomputed when the filing is rebuilt
      - name: disputed
        type: boolean
        source: input
        description: Carrier flagged this charge as disputed
        default: false

  - name: Reimbursement
    parent: null
    common_fields: true
    fields:
      - name: filing_id
        type: string
        source: input
        description: "FK -> StopLossFiling.id; filing this payment settles"
      - name: received_amount_cents
        type: integer
        source: input
        description: Amount actually wired by the carrier (>= 0)
      - name: received_at
        type: datetime
        source: input
        description: UTC timestamp of receipt
      - name: status
        type: enum
        source: system
        description: Reimbursement lifecycle
        constraints: "one of {RECEIVED, POSTED}"
        default: RECEIVED

  - name: HighCostClaimantForecast
    parent: null
    common_fields: true
    fields:
      - name: plan_id
        type: string
        source: input
        description: "FK -> Plan.id; plan being projected"
      - name: forecast_basis
        type: enum
        source: input
        description: Which projection variant this row holds
        constraints: "one of {PURE_EXPERIENCE, CREDIBILITY_WEIGHTED}"
      - name: projected_excess_cents
        type: integer
        source: computed
        description: Projected stop-loss excess for the upcoming policy year under the variant's algorithm
      - name: projected_member_count
        type: integer
        source: computed
        description: Projected number of members expected to pierce the specific deductible next year
      - name: computed_at
        type: datetime
        source: system
        description: Server timestamp of computation

  - name: AuditReview
    parent: null
    common_fields: true
    fields:
      - name: filing_id
        type: string
        source: input
        description: "FK -> StopLossFiling.id; filing under audit"
      - name: reason
        type: string
        source: input
        description: Free-text audit trigger reason
      - name: adjustment_cents
        type: integer
        source: computed
        description: Net dollar adjustment (negative = clawback from plan); set on RESOLVED
      - name: status
        type: enum
        source: system
        description: Audit lifecycle
        constraints: "one of {OPENED, FINDINGS_ISSUED, RESOLVED}"
        default: OPENED

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: StopLossContract
    initial_state: DRAFT
    terminal_states: [RENEWED]
    transitions:
      - from: DRAFT
        to: IN_FORCE
        trigger: "POST /stop-loss/contracts/{id}/activate"
        actor: PlanAdministrator
        preconditions:
          - "contract.policy_year_start <= current_utc < contract.policy_year_end"
          - "contract.specific_deductible_cents >= 0 AND contract.aggregate_deductible_cents >= 0"
          - "if aggregating_specific_deductible_cents is present, aggregating_specific_deductible_cents >= specific_deductible_cents"
          - "no other StopLossContract for the same plan_id with status == IN_FORCE"
        side_effects:
          - "creates one ClaimAccumulation row with scope=AGGREGATE, member_id=null, accumulated_cents=0"
          - "creates one ClaimAccumulation row with scope=SPECIFIC for every Member with plan_id == contract.plan_id AND status == ACTIVE"
          - "increments StopLossContract.version by 1"
      - from: IN_FORCE
        to: EXPIRED
        trigger: "system clock reaching contract.policy_year_end"
        actor: system
        preconditions:
          - "current_utc >= contract.policy_year_end"
        side_effects:
          - "no further claims accumulate into this contract's ClaimAccumulation rows"
      - from: EXPIRED
        to: RENEWED
        trigger: "POST /stop-loss/contracts/{id}/renew"
        actor: PlanAdministrator
        preconditions:
          - "contract.status == EXPIRED"
          - "payload.new_policy_year_start == contract.policy_year_end"
        side_effects:
          - "creates a successor StopLossContract in DRAFT with the renewed terms"
          - "increments StopLossContract.version by 1"

  - entity: Claim
    initial_state: SUBMITTED
    terminal_states: [REVERSED]
    transitions:
      - from: SUBMITTED
        to: ADJUDICATED
        trigger: "POST /stop-loss/claims/{id}/adjudicate"
        actor: ClaimsExaminer
        preconditions:
          - "claim.status == SUBMITTED"
          - "payload.allowed_amount_cents <= claim.billed_amount_cents"
        side_effects:
          - "sets claim.allowed_amount_cents from payload"
      - from: ADJUDICATED
        to: PAID
        trigger: "POST /stop-loss/claims/{id}/pay"
        actor: ClaimsExaminer
        preconditions:
          - "claim.status == ADJUDICATED"
          - "payload.paid_amount_cents <= claim.allowed_amount_cents"
        side_effects:
          - "sets claim.paid_amount_cents and claim.paid_date"
          - "recalculates every matching ClaimAccumulation row (scope=SPECIFIC for the claim's member, scope=AGGREGATE for the plan) for each IN_FORCE contract of the claim's plan whose accumulation window covers the claim"
          - "if the SPECIFIC ClaimAccumulation.notice_triggered flips false->true, sets Member.notice_status = NOTICE_PENDING"
      - from: PAID
        to: REVERSED
        trigger: "POST /stop-loss/claims/{id}/reverse"
        actor: ClaimsExaminer
        preconditions:
          - "claim.status == PAID"
          - "no FilingLineItem with claim_id == claim.id exists under a StopLossFiling whose status IN {SUBMITTED, UNDER_REVIEW, APPROVED, PAID}"
        side_effects:
          - "recalculates the affected ClaimAccumulation rows, removing this claim's contribution"
          - "if the SPECIFIC ClaimAccumulation.notice_triggered flips true->false AND Member.notice_status == NOTICE_PENDING, resets Member.notice_status = NONE"

  - entity: Member
    initial_state: ACTIVE
    terminal_states: [TERMINATED]
    transitions:
      - from: ACTIVE
        to: TERMINATED
        trigger: "POST /stop-loss/members/{id}/terminate"
        actor: PlanAdministrator
        preconditions:
          - "member.status == ACTIVE"
        side_effects:
          - "sets member.coverage_end = payload.coverage_end"
      - from: NONE
        to: NOTICE_PENDING
        trigger: "system: ClaimAccumulation.notice_triggered flips false -> true"
        actor: system
        preconditions:
          - "SPECIFIC ClaimAccumulation for (contract, member) has notice_triggered == true"
        side_effects:
          - "member.notice_status = NOTICE_PENDING"
      - from: NOTICE_PENDING
        to: NOTICE_FILED
        trigger: "POST /stop-loss/members/{id}/file-notice"
        actor: PlanAdministrator
        preconditions:
          - "member.notice_status == NOTICE_PENDING"
          - "the IN_FORCE contract for member.plan_id exists"
        side_effects:
          - "member.notice_status = NOTICE_FILED"

  - entity: StopLossFiling
    initial_state: DRAFT
    terminal_states: [PAID, DENIED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /stop-loss/filings/{id}/submit"
        actor: StopLossAnalyst
        preconditions:
          - "filing.status == DRAFT"
          - "at least one FilingLineItem with filing_id == filing.id exists"
          - "for every line item, line.claim.status == PAID"
          - "current_utc <= contract.policy_year_end + contract.filing_deadline_days (filing deadline, run-out inclusive)"
          - "filing.requested_amount_cents > 0"
        side_effects:
          - "sets filing.submitted_at = current_utc"
          - "increments StopLossFiling.version by 1"
      - from: SUBMITTED
        to: UNDER_REVIEW
        trigger: "POST /stop-loss/filings/{id}/begin-review"
        actor: CarrierReviewer
        preconditions:
          - "filing.status == SUBMITTED"
        side_effects: []
      - from: UNDER_REVIEW
        to: DISPUTED
        trigger: "POST /stop-loss/filings/{id}/dispute"
        actor: CarrierReviewer
        preconditions:
          - "filing.status == UNDER_REVIEW"
        side_effects:
          - "sets FilingLineItem.disputed = true for each line id in payload.disputed_line_item_ids"
      - from: DISPUTED
        to: UNDER_REVIEW
        trigger: "POST /stop-loss/filings/{id}/resolve-dispute"
        actor: StopLossAnalyst
        preconditions:
          - "filing.status == DISPUTED"
        side_effects:
          - "clears FilingLineItem.disputed on resolved lines and recomputes filing.requested_amount_cents"
      - from: UNDER_REVIEW
        to: APPROVED
        trigger: "POST /stop-loss/filings/{id}/approve"
        actor: CarrierReviewer
        preconditions:
          - "filing.status == UNDER_REVIEW"
          - "no FilingLineItem under this filing has disputed == true"
        side_effects:
          - "sets filing.approved_amount_cents = payload.approved_amount_cents (must be <= filing.requested_amount_cents)"
      - from: UNDER_REVIEW
        to: DENIED
        trigger: "POST /stop-loss/filings/{id}/deny"
        actor: CarrierReviewer
        preconditions:
          - "filing.status == UNDER_REVIEW"
        side_effects: []
      - from: APPROVED
        to: PAID
        trigger: "system: a Reimbursement against this filing transitions to POSTED"
        actor: system
        preconditions:
          - "filing.status == APPROVED"
          - "a Reimbursement with filing_id == filing.id has status == POSTED"
        side_effects: []

  - entity: Reimbursement
    initial_state: RECEIVED
    terminal_states: [POSTED]
    transitions:
      - from: RECEIVED
        to: POSTED
        trigger: "POST /stop-loss/reimbursements/{id}/post"
        actor: PlanAccountant
        preconditions:
          - "reimbursement.status == RECEIVED"
          - "reimbursement.received_amount_cents == filing.approved_amount_cents (exact match — short/over payment cannot post)"
          - "filing.status == APPROVED"
        side_effects:
          - "filing transitions APPROVED -> PAID"
          - "recalculates the plan-level ClaimAccumulation scope=AGGREGATE row to net the reimbursed excess out of unrecovered exposure"

  - entity: AuditReview
    initial_state: OPENED
    terminal_states: [RESOLVED]
    transitions:
      - from: OPENED
        to: FINDINGS_ISSUED
        trigger: "POST /stop-loss/audits/{id}/issue-findings"
        actor: CarrierAuditor
        preconditions:
          - "audit.status == OPENED"
        side_effects: []
      - from: FINDINGS_ISSUED
        to: RESOLVED
        trigger: "POST /stop-loss/audits/{id}/resolve"
        actor: PlanAdministrator
        preconditions:
          - "audit.status == FINDINGS_ISSUED"
          - "the user resolving the audit MUST NOT be the same X-User-ID as the user who filed the underlying StopLossFiling (segregation of duties)"
        side_effects:
          - "sets audit.adjustment_cents from payload"
          - "if adjustment_cents < 0, reduces filing.approved_amount_cents by |adjustment_cents| and recalculates the affected ClaimAccumulation rows"

  - entity: LaseredMemberTerm
    initial_state: ACTIVE
    terminal_states: [RESCINDED]
    transitions:
      - from: ACTIVE
        to: RESCINDED
        trigger: "POST /stop-loss/lasered-terms/{id}/rescind"
        actor: PlanAdministrator
        preconditions:
          - "laser.status == ACTIVE"
        side_effects:
          - "recalculates the SPECIFIC ClaimAccumulation for (contract_id, member_id) with applicable_deductible_cents falling back to the contract base deductible"

# =============================================================================
# §1.2.1 Concurrency Rules
# =============================================================================
concurrency_rules:
  - rule_id: filing-submit-stale-contract
    parent_entity: StopLossContract
    write_endpoint: "POST /stop-loss/filings"
    occ_field: "expected_contract_version"
    description: |
      Creating a StopLossFiling against a contract whose version has advanced
      since the client last observed it is rejected. Captures the case where a
      renewal or laser change has just advanced the contract's version and the
      analyst's view of deductible terms is therefore stale.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: laser-create-stale-contract
    parent_entity: StopLossContract
    write_endpoint: "POST /stop-loss/lasered-terms"
    occ_field: "expected_contract_version"
    description: |
      Creating a LaseredMemberTerm against a contract whose version has
      advanced since the client last observed it is rejected; the laser must be
      priced against current contract terms.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: specific_accumulation_policy_year_basis
    trigger: "on Claim ADJUDICATED->PAID, PAID->REVERSED, and on LaseredMemberTerm ACTIVE->RESCINDED"
    algorithm: chronological
    input_set: "Claims with member_id == accumulation.member_id, status == PAID, and service_date inside [contract.policy_year_start - run_in_days, contract.policy_year_end + run_out_days); evaluated when contract.contract_basis == POLICY_YEAR"
    formula: |
      claims = [c for c in member_claims if c.status == PAID
                and contract.policy_year_start - run_in_days <= c.service_date < contract.policy_year_end + run_out_days]
      claims.sort(key = (service_date ASC, created_at ASC))
      accumulated = sum(c.paid_amount_cents for c in claims)
      applicable_deductible = lasered_deductible if an ACTIVE LaseredMemberTerm covers (member, service window) else contract.specific_deductible_cents
      excess = max(0, accumulated - applicable_deductible)
      notice_triggered = accumulated >= notice_threshold_pct * applicable_deductible
    constants:
      NOTICE_THRESHOLD_DEFAULT: 0.50
    precision: "integer cents; no rounding"
    variants:
      - name: paid_basis
        when: "contract.contract_basis == PAID"
        difference: "the inclusion predicate uses c.paid_date inside the window instead of c.service_date, and sort key is (paid_date ASC, created_at ASC)"

  - name: aggregate_accumulation
    trigger: "on every Claim ADJUDICATED->PAID and PAID->REVERSED for the plan, and on Reimbursement POSTED"
    algorithm: aggregation
    input_set: "Claims with plan_id == contract.plan_id, status == PAID, and inclusion window per contract basis; each member's contribution capped at aggregating_specific_deductible_cents when present, else at specific_deductible_cents (mirroring rule)"
    formula: |
      # evaluation order is PINNED: specific sweep first, then aggregate, so the
      # aggregate cap sees final per-member amounts (circular-looking dependency
      # resolved by fixed order).
      per_member = {}
      for each member with claims in scope:
          per_member[member] = min(member_paid_total, cap)   # cap = aggregating_specific_deductible_cents or specific_deductible_cents
      accumulated_cents = sum(per_member.values())
      excess_cents = max(0, accumulated_cents - contract.aggregate_deductible_cents)
      # rounding order PINNED: per-member caps are applied as integer cents first, then summed; no round-after-sum.
    constants: {}
    precision: "integer cents; per-member cap applied before summation"

  - name: filing_requested_amount
    trigger: "on FilingLineItem create/delete under a DRAFT filing and on DISPUTED->UNDER_REVIEW"
    algorithm: chronological
    input_set: "Claims attached as line items to the filing, status == PAID, ordered by (service_date ASC, created_at ASC)"
    formula: |
      running = applicable_deductible_cents   # start at the deductible
      total_excess = 0
      for line in sorted_lines:
          claim = line.claim
          before = running
          running += claim.paid_amount_cents
          line.eligible_excess_cents = max(0, running - max(before, applicable_deductible_cents)) - max(0, before - applicable_deductible_cents)
          # simplifies to the portion of paid_amount_cents sitting above the deductible given chronological position
          total_excess += line.eligible_excess_cents
      filing.requested_amount_cents = total_excess
    constants: {}
    precision: "integer cents"

  - name: high_cost_claimant_forecast
    trigger: "POST /stop-loss/forecasts"
    algorithm: forward_looking
    input_set: "Members of the plan with status == ACTIVE and at least one PAID claim in the trailing 12 months before current_utc"
    formula: |
      for each member:
          trailing_paid = sum(paid_amount_cents of PAID claims with paid_date in [current_utc - 365d, current_utc))
      # PURE_EXPERIENCE variant
      projected_excess_pure = sum(max(0, trailing_paid_m - next_year_specific_deductible) for each member)
      projected_count_pure = count(members where trailing_paid_m >= next_year_specific_deductible)
      # CREDIBILITY_WEIGHTED variant
      credibility_factor z = min(1.0, member_count / 500)
      manual_rate_excess = member_count * manual_per_member_excess_cents
      projected_excess_cred = z * projected_excess_pure + (1 - z) * manual_rate_excess
      projected_count_cred = round_half_up(z * projected_count_pure + (1 - z) * member_count * manual_hit_rate)
    constants:
      CREDIBILITY_FULL_MEMBER_COUNT: 500
      MANUAL_PER_MEMBER_EXCESS_CENTS: 1200000
      MANUAL_HIT_RATE: 0.04
    precision: "2 decimal places for intermediate z; final integer cents, round_half_up"
    variants:
      - name: pure_experience
        when: "forecast_basis == PURE_EXPERIENCE"
        difference: "uses only the plan's own trailing claims; z is ignored"
      - name: credibility_weighted
        when: "forecast_basis == CREDIBILITY_WEIGHTED"
        difference: "blends plan experience with the manual rate via z"

  - name: notice_threshold_check
    trigger: "on every recompute of a SPECIFIC ClaimAccumulation"
    algorithm: threshold
    input_set: "the single SPECIFIC ClaimAccumulation row being recomputed"
    formula: |
      notice_triggered = (accumulated_cents >= notice_threshold_pct * applicable_deductible_cents)
      # boundary precision: >=, not >. A member whose accumulation equals exactly
      # notice_threshold_pct * deductible HAS triggered the notice obligation.
    constants:
      NOTICE_THRESHOLD_DEFAULT: 0.50
    precision: "percentage computed in rational arithmetic; comparison on integer cents after multiplying both sides"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present; role is declared in §1.7"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all

  - priority: 2
    category: auth
    check: "role is permitted to invoke the endpoint per §1.5 roles"
    error_id: ERR_FORBIDDEN
    http_status: 403
    applies_to: all

  - priority: 3
    category: existence
    check: "every path id and body FK resolves to an existing entity"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: all

  - priority: 4
    category: state
    check: "target entity's current state permits the transition per §1.2"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: all action endpoints

  - priority: 5
    category: business_referential
    check: "claim.member_id belongs to claim.plan_id; filing.member_id belongs to filing.contract's plan; laser.member_id belongs to laser.contract's plan"
    error_id: ERR_CROSS_PLAN_REFERENCE
    http_status: 422
    applies_to: ["POST /stop-loss/claims", "POST /stop-loss/filings", "POST /stop-loss/lasered-terms"]

  - priority: 6
    category: business_temporal
    check: "claim.service_date <= claim.paid_date; member.coverage_start < member.coverage_end when both present; laser.effective_from < laser.effective_to"
    error_id: ERR_INVALID_DATE_RANGE
    http_status: 422
    applies_to: ["POST /stop-loss/claims", "POST /stop-loss/members", "POST /stop-loss/lasered-terms"]

  - priority: 7
    category: business_temporal
    check: "claim falls inside exactly one IN_FORCE contract accumulation window for its plan (run-in/run-out windows of two contracts MUST NOT both cover the same claim)"
    error_id: ERR_CLAIM_WINDOW_AMBIGUITY
    http_status: 422
    applies_to: ["POST /stop-loss/claims/{id}/pay"]

  - priority: 8
    category: business_safety
    check: "notice obligation: a SPECIFIC filing may not be submitted for a member whose notice_status == NOTICE_PENDING (the 50% notice must be filed before any specific reimbursement filing)"
    error_id: ERR_NOTICE_OUTSTANDING
    http_status: 422
    applies_to: ["POST /stop-loss/filings/{id}/submit"]

  - priority: 9
    category: business_constraint
    check: "lasered_specific_deductible_cents > contract.specific_deductible_cents; no overlapping ACTIVE lasers for the same (contract_id, member_id) — [effective_from, effective_to) half-open intervals of two ACTIVE lasers must not intersect"
    error_id: ERR_LASER_CONFLICT
    http_status: 422
    applies_to: ["POST /stop-loss/lasered-terms"]

  - priority: 10
    category: business_fiscal
    check: "filing.requested_amount_cents > 0 at submit; approve payload.approved_amount_cents <= filing.requested_amount_cents"
    error_id: ERR_AMOUNT_OUT_OF_RANGE
    http_status: 422
    applies_to: ["POST /stop-loss/filings/{id}/submit", "POST /stop-loss/filings/{id}/approve"]

  - priority: 11
    category: business_temporal
    check: "filing submission within deadline: current_utc <= contract.policy_year_end + filing_deadline_days"
    error_id: ERR_FILING_DEADLINE_PASSED
    http_status: 422
    applies_to: ["POST /stop-loss/filings/{id}/submit"]

  - priority: 12
    category: business_fiscal
    check: "reimbursement.received_amount_cents == filing.approved_amount_cents exactly at post time"
    error_id: ERR_REIMBURSEMENT_MISMATCH
    http_status: 422
    applies_to: ["POST /stop-loss/reimbursements/{id}/post"]

  - priority: 13
    category: business_constraint
    check: "segregation of duties: X-User-ID resolving an audit MUST differ from X-User-ID that submitted the underlying filing"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: ["POST /stop-loss/audits/{id}/resolve"]

  - priority: 14
    category: business_constraint
    check: "OCC: expected_contract_version matches contract.version on filing create and laser create"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: ["POST /stop-loss/filings", "POST /stop-loss/lasered-terms"]

