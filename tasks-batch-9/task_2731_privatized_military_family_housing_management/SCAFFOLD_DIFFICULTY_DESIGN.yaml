  # ===========================================================================
  # RULE 4 — transitive_cascade
  # Three instances, three different triggers, each hop caused strictly by the
  # previous hop: terminate (depth 3), remediation completion (depth 5),
  # hazard assessment (depth 4).
  # ===========================================================================
  - rule_id: transitive_cascade
    instances:

      - name: lease_termination_cascades_unit_release_to_installation_counters
        grounds:
          - state_machines.Lease.NOTICE_GIVEN_to_TERMINATED
          - state_machines.HousingUnit.OCCUPIED_to_AVAILABLE
          - calculations.unit_inventory_conservation
          - calculations.early_termination_settlement
          - entities.HousingUnit.fields.last_lease_end_date
          - entities.Installation.fields.available_unit_count
        distinguishing_aspect: |
          Depth-3 chain from ONE request: hop 1 moves Lease.occupancy_status
          NOTICE_GIVEN -> TERMINATED and stamps the settlement; hop 2 fires
          BECAUSE the lease terminated, moving HousingUnit.status
          OCCUPIED -> AVAILABLE and stamping last_lease_end_date 2026-11-19;
          hop 3 fires BECAUSE that unit status changed, moving one unit from
          Installation.occupied_unit_count to available_unit_count. The trigger
          is POST /leases/{id}/terminate, distinct from the remediation-
          completion and hazard-assessment triggers of the other two instances.
        test_recipe:
          setup:
