              payload: { model_name: "Ep2 Guitar", category: "GUITAR", condition: "NEW", serial_number: "S-EP2-1", acquisition_cost_cents: 60000, list_price_cents: 120000, monthly_rent_cents: 10000 }
              as: SalesAssociate
              captures: { u: $.data.id, uv: $.data.version }
