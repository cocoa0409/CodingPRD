              captures: { req1: "$.data.id" }
            - call: POST /grain-inspection/inspection-requests
              as: ServiceAdmin
              payload: { applicant_id: "${app}", service_area_id: "${area}", commodity: "SOYBEANS", point_of_service: "LOADING", lot_identifier: "LOT-CAP2", declared_quantity_bushels: 5000, requested_services: ["GRADING", "EXPORT_SUPERVISION"] }
              captures: { req2: "$.data.id" }
            - call: POST /grain-inspection/vessel-watches
              as: SupervisingInspector
              payload: { inspection_request_id: "${req1}", supervisor_inspector_id: "${insp_a}", vessel_name: "MV Charlie", window_start_at: "2026-08-03T08:00:00Z", window_end_at: "2026-08-03T12:00:00Z", holds_declared: 2 }
              captures: { vw1: "$.data.id" }
          trigger:
            - call: POST /grain-inspection/vessel-watches
              as: SupervisingInspector
              payload: { inspection_request_id: "${req2}", supervisor_inspector_id: "${insp_b}", vessel_name: "MV Delta", window_start_at: "2026-08-03T12:00:00Z", window_end_at: "2026-08-03T15:00:00Z", holds_declared: 1 }
              captures: { err: "$.data.error_id" }
          assert:
            - "422 ERR_AREA_WATCH_CAPACITY_EXCEEDED — the new window touches ${vw1} at 12:00:00Z and touching counts as intersecting, so 1 intersecting watch already fills concurrent_watch_capacity 1"
            - "The error is NOT ERR_INSPECTOR_WATCH_OVERLAP: the two watches belong to different inspectors, so the per-inspector buffer rule does not apply and only the area rule can fire"
            - "The same watch with window_start_at 2026-08-03T12:00:01Z -> 201 (one second past the incumbent's end, no intersection)"
            - "GET /grain-inspection/service-areas/${area} -> open_watch_count == 1 after the rejected trigger and 2 after the accepted one"
            - "POST /grain-inspection/vessel-watches/${vw1}/abort drops open_watch_count and a watch 2026-08-03T10:00:00Z to 2026-08-03T12:00:00Z is then accepted, proving terminal watches release capacity"
            - "window_end_at equal to window_start_at -> 422 ERR_WATCH_WINDOW_INVALID (priority 12 window sanity precedes the capacity count)"
        expected_failure_mode_if_naive: "Half-open interval logic accepts the touching window and puts two vessels on a one-berth office; counting terminal watches keeps capacity permanently full."

  - rule_id: compensating_invariant
    rule_summary: "A reversal operation must restore an invariant exactly, with no drift and no double compensation."
    instances:
      - name: payment_waterfall_then_appeal_reversal_conserves_the_applicant_ledger_into_credit
        mechanism: |
          Money flows through three mechanisms that must reconcile: a waterfall payment allocates
          oldest-certificate-first across same-instant certificates ordered by sequence_no, an appeal
          deposit is charged, and a REVISED decision both refunds the deposit and reverses the
          challenged certificate's fee. The invariant open_balance_cents == charges_total_cents -
          credits_total_cents must hold at every step, including when the reversal of an
          already-partly-paid certificate drives the balance NEGATIVE — the office now owes the
          applicant the 12000 it collected against a certificate that no longer exists. The payment
          that exceeds the allocatable balance must also be refused with no mutation at all.
        distinguishing_aspect: "The compensation is monetary and must leave a signed residue (a credit balance) rather than returning to zero; the sibling compensation restores a counting resource exactly to its prior value."
        entities_involved: [Applicant, Certificate, Appeal, AppealVote, GradingResult, WeighingRecord, InspectionRequest]
        grounds:
          - "calculations.payment_waterfall_allocation"
          - "calculations.applicant_balance_ledger"
          - "entities.Certificate.fields.sequence_no"
          - "errors[ERR_PAYMENT_EXCEEDS_ALLOCATABLE]"
          - "state_machines.Certificate.status.UNDER_APPEAL_to_VOIDED"
        test_recipe:
          setup:
            - "A DELEGATED area with ACTIVE GRADING, WEIGHING and APPEAL schedules and an applicant with credit limit 900000."
            - "Two certificates issued at the same logical instant: sequence_no 1 is a WEIGHT certificate of 8000 cents, sequence_no 2 a GRADE certificate of 47500 cents; a payment of 20000 has been allocated oldest-first so the first is PAID and the second stands at fee_paid_cents 12000."
            - "A REINSPECTION on the second certificate is in UNDER_REVIEW with a 20000 deposit charged, a FINAL US_NO_3 regrade recorded and its single required REVISE vote cast."
          setup_api_calls:
            - call: POST /_clock/set_current_utc
              as: ServiceAdmin
              payload: { current_utc: "2026-08-03T09:00:00Z" }
            - call: POST /grain-inspection/service-areas
              as: ServiceAdmin
              payload: { name: "Plains Delegated Office", state_code: "KS", authority_type: "DELEGATED", fee_multiplier_bp: 10000, supervision_required: false }
              captures: { area: "$.data.id" }
            - call: POST /grain-inspection/fee-schedules
              as: ServiceAdmin
              payload: { service_area_id: "${area}", service_class: "GRADING", base_fee_cents: 8000, per_thousand_bushel_rate_cents: 2000, overtime_multiplier_bp: 2000, minimum_fee_cents: 10000, effective_from: "2026-01-01T00:00:00Z" }
              captures: { fs_g: "$.data.id" }
            - call: POST /grain-inspection/fee-schedules/${fs_g}/activate
              as: ServiceAdmin
              payload: {}
            - call: POST /grain-inspection/fee-schedules
              as: ServiceAdmin
              payload: { service_area_id: "${area}", service_class: "WEIGHING", base_fee_cents: 6000, per_thousand_bushel_rate_cents: 1000, overtime_multiplier_bp: 2000, minimum_fee_cents: 8000, effective_from: "2026-01-01T00:00:00Z" }
              captures: { fs_w: "$.data.id" }
            - call: POST /grain-inspection/fee-schedules/${fs_w}/activate
              as: ServiceAdmin
              payload: {}
            - call: POST /grain-inspection/fee-schedules
              as: ServiceAdmin
              payload: { service_area_id: "${area}", service_class: "APPEAL", base_fee_cents: 20000, effective_from: "2026-01-01T00:00:00Z" }
              captures: { fs_a: "$.data.id" }
            - call: POST /grain-inspection/fee-schedules/${fs_a}/activate
              as: ServiceAdmin
              payload: {}
            - call: POST /grain-inspection/applicants
              as: ServiceAdmin
              payload: { name: "Prairie Coop", account_code: "PRC-007", contact_email: "billing@prairie.example", credit_limit_cents: 900000 }
              captures: { app: "$.data.id" }
            - call: POST /grain-inspection/inspectors
              as: ServiceAdmin
              payload: { service_area_id: "${area}", license_number: "L-9301", full_name: "L. Ledger", endorsements: ["SAMPLING", "GRADING", "WEIGHING"], license_expires_at: "2027-06-01T00:00:00Z" }
              captures: { insp: "$.data.id" }
            - call: POST /grain-inspection/inspectors
              as: ServiceAdmin
              payload: { service_area_id: "${area}", license_number: "L-9302", full_name: "R. Reviewer", endorsements: ["GRADING", "SUPERVISION"], license_expires_at: "2027-06-01T00:00:00Z" }
              captures: { insp_r: "$.data.id" }
            - call: POST /grain-inspection/inspectors/${insp_r}/training-records
              as: ServiceAdmin
              payload: { course_code: "SUPERVISION-201", hours: 24 }
            - call: POST /grain-inspection/inspectors/${insp_r}/activate
              as: ServiceAdmin
              payload: {}
            - call: POST /grain-inspection/equipment
              as: ServiceAdmin
              payload: { service_area_id: "${area}", equipment_kind: "SAMPLING_DEVICE", asset_code: "PROBE-L1", model: "Diverter D2" }
              captures: { probe: "$.data.id" }
            - call: POST /grain-inspection/equipment/${probe}/certify
              as: ServiceAdmin
              payload: { certified_until: "2027-01-01T00:00:00Z" }
            - call: POST /grain-inspection/equipment
              as: ServiceAdmin
              payload: { service_area_id: "${area}", equipment_kind: "SCALE", asset_code: "SCALE-L1", model: "HopperMax 400", capacity_lbs: 400000, tolerance_lbs: 20.0 }
              captures: { scale: "$.data.id" }
            - call: POST /grain-inspection/equipment/${scale}/certify
              as: ServiceAdmin
              payload: { certified_until: "2027-01-01T00:00:00Z", test_error_lbs: 5.0 }
            - call: POST /grain-inspection/inspection-requests
              as: ServiceAdmin
              payload: { applicant_id: "${app}", service_area_id: "${area}", commodity: "CORN", point_of_service: "UNLOADING", lot_identifier: "LOT-W500", declared_quantity_bushels: 500, requested_services: ["GRADING", "WEIGHING"] }
              captures: { req_w: "$.data.id" }
            - call: POST /grain-inspection/weighing-records
              as: LicensedInspector
              payload:
                inspection_request_id: "${req_w}"
                scale_id: "${scale}"
                weigher_inspector_id: "${insp}"
                dockage_pct: 0
                drafts:
                  - { gross_lbs: 30000, tare_lbs: 2000 }
              captures: { wr: "$.data.id" }
            - call: POST /grain-inspection/certificates
              as: LicensedInspector
              payload: { inspection_request_id: "${req_w}", issuing_inspector_id: "${insp}", certificate_type: "WEIGHT" }
              captures: { cert_a: "$.data.id" }
            - call: POST /grain-inspection/inspection-requests
              as: ServiceAdmin
              payload: { applicant_id: "${app}", service_area_id: "${area}", commodity: "CORN", point_of_service: "UNLOADING", lot_identifier: "LOT-G20500", declared_quantity_bushels: 20500, requested_services: ["GRADING"] }
              captures: { req_g: "$.data.id" }
            - call: POST /grain-inspection/samples
              as: LicensedInspector
              payload: { inspection_request_id: "${req_g}", sampling_device_id: "${probe}", inspector_id: "${insp}", seal_number: "SEAL-LED", portions_count: 4 }
              captures: { smp: "$.data.id" }
            - call: POST /grain-inspection/grading-results
              as: LicensedInspector
              payload: { inspection_request_id: "${req_g}", sample_id: "${smp}", inspector_id: "${insp}", test_weight_lbs_per_bushel: 55.2, moisture_pct: 14.04, damaged_total_pct: 4.0, heat_damaged_pct: 0.15, foreign_material_pct: 2.5 }
              captures: { gr1: "$.data.id" }
            - call: POST /grain-inspection/certificates
              as: LicensedInspector
              payload: { inspection_request_id: "${req_g}", issuing_inspector_id: "${insp}", certificate_type: "GRADE" }
              captures: { cert_b: "$.data.id", cert_b_v: "$.data.version" }
            - call: POST /grain-inspection/applicants/${app}/payments
              as: ApplicantUser
              payload: { amount_cents: 20000 }
            - call: POST /grain-inspection/appeals
              as: ApplicantUser
              payload: { certificate_id: "${cert_b}", applicant_id: "${app}", appeal_type: "REINSPECTION", expected_certificate_version: "${cert_b_v}" }
              captures: { ap: "$.data.id" }
            - call: POST /grain-inspection/appeals/${ap}/assign-sample
              as: SupervisingInspector
              payload: { sample_id: "${smp}" }
            - call: POST /grain-inspection/grading-results
              as: SupervisingInspector
              payload: { inspection_request_id: "${req_g}", sample_id: "${smp}", inspector_id: "${insp_r}", appeal_id: "${ap}", test_weight_lbs_per_bushel: 53.9, moisture_pct: 16.2, damaged_total_pct: 6.4, heat_damaged_pct: 0.44, foreign_material_pct: 3.9 }
              captures: { gr2: "$.data.id" }
            - call: GET /grain-inspection/appeals/${ap}
              as: SupervisingInspector
              captures: { ap_v: "$.data.version" }
            - call: POST /grain-inspection/appeal-votes
              as: SupervisingInspector
              payload: { appeal_id: "${ap}", inspector_id: "${insp_r}", vote: "REVISE", rationale: "Reinspection confirms US_NO_3", expected_appeal_version: "${ap_v}" }
          trigger:
            - call: POST /grain-inspection/appeals/${ap}/decide
              as: SupervisingInspector
              payload: {}
          assert:
            - "Before the trigger the waterfall had already run: GET /grain-inspection/certificates/${cert_a} -> fee_total_cents == 8000 (pre 7000 floored by minimum 8000), fee_paid_cents == 8000, fee_settlement_status == PAID; GET /grain-inspection/certificates/${cert_b} -> fee_total_cents == 47500 (8000 + 21 * 2000 = 50000, 500bp tier discount 2500), fee_paid_cents == 12000, fee_settlement_status == UNPAID"
            - "Before the trigger a payment of 35501 was refused with 422 ERR_PAYMENT_EXCEEDS_ALLOCATABLE and neither certificate's fee_paid_cents moved (allocatable was exactly 35500)"
            - "200; appeal status == DECIDED_REVISED with required_panel_size 1 satisfied by the single REVISE vote, refund_cents == 20000"
            - "GET /grain-inspection/certificates/${cert_b} -> status == VOIDED, fee_settlement_status == REVERSED, fee_paid_cents still 12000 (the collected cash is not erased, it becomes a credit)"
            - "GET /grain-inspection/applicants/${app} -> charges_total_cents == 75500 (8000 + 47500 + 20000 deposit), credits_total_cents == 87500 (20000 payment + 20000 refund + 47500 reversal), open_balance_cents == -12000"
            - "The invariant open_balance_cents == charges_total_cents - credits_total_cents holds at every intermediate step: after issuance (55500 - 0 = 55500), after the payment (55500 - 20000 = 35500), after the deposit (75500 - 20000 = 55500) and after the decision (75500 - 87500 = -12000)"
            - "A second POST /grain-inspection/appeals/${ap}/decide -> 409 ERR_APPEAL_STATE_INVALID and the ledger does NOT move again (no double refund, no double reversal)"
            - "The new APPEAL_GRADE certificate has fee_total_cents == 0 and fee_settlement_status == PAID, so it never enters the waterfall: a further payment of 1 -> 422 ERR_PAYMENT_EXCEEDS_ALLOCATABLE"
        expected_failure_mode_if_naive: "Implementations clamp open_balance_cents at zero (losing the applicant's 12000), or reverse the fee by zeroing fee_total_cents so the audit trail forgets what was charged, or let the repeated decide call refund the deposit twice."

      - name: calibration_rejection_releases_exactly_one_sample_portion_and_never_twice
        mechanism: |
          Consuming a sample portion is compensated by releasing it when the analysis that consumed it
          is invalidated by an out-of-tolerance instrument. The invariant portions_consumed +
          portions_retained + portions_available == portions_count must hold before, during and after
          the compensation, integrity_status must fall back from CONSUMED to SEALED exactly when
          portions_available returns to a positive number, and the recalibration that returns the
          instrument to APPROVED must NOT release the portion a second time. The freed portion must be
          genuinely reusable by a fresh analysis.
        distinguishing_aspect: "Compensation of a discrete counting resource with an accompanying state-machine reversal (CONSUMED -> SEALED), asserted for idempotence; the sibling compensates monetary ledgers and ends outside its starting value."
        entities_involved: [Sample, ProteinAnalysis, Equipment, GradingResult, InspectionRequest, Inspector]
        grounds:
          - "entities.Sample.fields.portions_consumed"
          - "state_machines.Sample.integrity_status.CONSUMED_to_SEALED"
          - "state_machines.Equipment.approval_status.OUT_OF_TOLERANCE_to_APPROVED"
          - "errors[ERR_SAMPLE_PORTIONS_EXHAUSTED]"
          - "calculations.instrument_comparison_bias"
        test_recipe:
          setup:
            - "A DESIGNATED area with an APPROVED SAMPLING_DEVICE and an APPROVED PROTEIN_INSTRUMENT with no comparison history; no fee schedules exist, so no certificate and no money participate."
            - "A CORN request with GRADING and PROTEIN requested and a sample split into exactly 2 portions."
            - "Both portions are consumed — one by the FINAL grading determination and one by an ACCEPTED protein analysis of 34.52 on OFFICIAL_MOISTURE basis — so portions_available is 0 and integrity_status is CONSUMED."
          setup_api_calls:
            - call: POST /_clock/set_current_utc
              as: ServiceAdmin
              payload: { current_utc: "2026-08-03T09:00:00Z" }
            - call: POST /grain-inspection/service-areas
              as: ServiceAdmin
              payload: { name: "Gulf Designated Office", state_code: "TX", authority_type: "DESIGNATED", supervision_required: false }
              captures: { area: "$.data.id" }
            - call: POST /grain-inspection/applicants
              as: ServiceAdmin
              payload: { name: "Delta River Elevator", account_code: "DRE-008", contact_email: "ops@delta.example" }
              captures: { app: "$.data.id" }
            - call: POST /grain-inspection/inspectors
              as: ServiceAdmin
              payload: { service_area_id: "${area}", license_number: "L-9401", full_name: "C. Calibrator", endorsements: ["SAMPLING", "GRADING", "PROTEIN"], license_expires_at: "2027-06-01T00:00:00Z" }
              captures: { insp: "$.data.id" }
            - call: POST /grain-inspection/equipment
              as: ServiceAdmin
              payload: { service_area_id: "${area}", equipment_kind: "SAMPLING_DEVICE", asset_code: "PROBE-C1", model: "Diverter D2" }
              captures: { probe: "$.data.id" }
            - call: POST /grain-inspection/equipment/${probe}/certify
              as: ServiceAdmin
              payload: { certified_until: "2027-01-01T00:00:00Z" }
            - call: POST /grain-inspection/equipment
              as: ServiceAdmin
              payload: { service_area_id: "${area}", equipment_kind: "PROTEIN_INSTRUMENT", asset_code: "NIR-C1", model: "SpectraGrain 9" }
              captures: { nir: "$.data.id" }
            - call: POST /grain-inspection/equipment/${nir}/certify
              as: ServiceAdmin
              payload: { certified_until: "2027-01-01T00:00:00Z" }
            - call: POST /grain-inspection/inspection-requests
              as: ServiceAdmin
              payload: { applicant_id: "${app}", service_area_id: "${area}", commodity: "CORN", point_of_service: "UNLOADING", lot_identifier: "LOT-CAL", declared_quantity_bushels: 4000, requested_services: ["GRADING", "PROTEIN"] }
              captures: { req: "$.data.id" }
            - call: POST /grain-inspection/samples
              as: LicensedInspector
              payload: { inspection_request_id: "${req}", sampling_device_id: "${probe}", inspector_id: "${insp}", seal_number: "SEAL-CAL", portions_count: 2 }
              captures: { smp: "$.data.id" }
            - call: POST /grain-inspection/grading-results
              as: LicensedInspector
              payload: { inspection_request_id: "${req}", sample_id: "${smp}", inspector_id: "${insp}", test_weight_lbs_per_bushel: 56.0, moisture_pct: 12.8, damaged_total_pct: 2.0, heat_damaged_pct: 0.1, foreign_material_pct: 1.5 }
              captures: { gr: "$.data.id" }
            - call: POST /grain-inspection/protein-analyses
              as: LicensedInspector
              payload: { inspection_request_id: "${req}", sample_id: "${smp}", instrument_id: "${nir}", inspector_id: "${insp}", protein_pct_as_is: 34.60, instrument_moisture_pct: 12.80 }
              captures: { pa1: "$.data.id" }
          trigger:
            - call: POST /grain-inspection/comparison-checks
              as: ServiceAdmin
              payload: { instrument_id: "${nir}", inspector_id: "${insp}", reference_value_pct: 35.00, instrument_reading_pct: 35.65 }
          assert:
            - "Immediately before the trigger: GET /grain-inspection/samples/${smp} -> portions_count 2, portions_consumed 2, portions_retained 0, portions_available 0, integrity_status CONSUMED; the analysis reported protein_reported_pct 34.52 on basis_source OFFICIAL_MOISTURE (grading was already FINAL)"
            - "201; GET /grain-inspection/equipment/${nir} -> approval_status == OUT_OF_TOLERANCE, deviation 0.65, consecutive_out_of_tolerance_checks == 1"
            - "GET /grain-inspection/protein-analyses/${pa1} -> status == REJECTED_CALIBRATION"
            - "GET /grain-inspection/samples/${smp} -> portions_consumed == 1, portions_available == 1, portions_retained == 0, integrity_status == SEALED — exactly one portion released and the invariant 1 + 0 + 1 == 2 holds"
            - "POST /grain-inspection/equipment/${nir}/certify (recalibration, consecutive count 1 < 3) -> 200 approval_status APPROVED, rolling_bias_pct null, recent_deviations_pct empty; the sample is UNCHANGED (portions_consumed still 1) — the compensation is not applied twice"
            - "GET /grain-inspection/protein-analyses/${pa1} -> still REJECTED_CALIBRATION after recalibration (recovery does not resurrect a rejected analysis)"
            - "A fresh POST /grain-inspection/protein-analyses on ${smp} with the recalibrated instrument -> 201 with protein_reported_pct 34.52, and the sample returns to portions_consumed 2, portions_available 0, integrity_status CONSUMED"
            - "A further POST /grain-inspection/protein-analyses -> 422 ERR_SAMPLE_PORTIONS_EXHAUSTED; portions_consumed never exceeds portions_count"
        expected_failure_mode_if_naive: "Implementations either forget the release (the portion is lost forever and the lot must be resampled) or re-release on every subsequent equipment event, driving portions_consumed negative and letting the same physical portion be analysed twice."
