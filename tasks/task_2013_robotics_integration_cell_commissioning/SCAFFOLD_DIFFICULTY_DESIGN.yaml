              payload: { program_name: "MAIN" }
              as: ControlsProgrammer
              as_user_id: "${prog_id}"
              captures: { rp_id: $.data.id }
            - call: "POST /robotics/robot-programs/${rp_id}/code-complete"
              payload: {}
              as: ControlsProgrammer
              as_user_id: "${prog_id}"
            - call: "POST /robotics/robot-programs/${rp_id}/peer-review"
              payload: {}
              as: ControlsProgrammer
              as_user_id: "${prog2_id}"
            - call: "POST /robotics/robot-programs/${rp_id}/simulate"
              payload: {}
              as: ControlsProgrammer
              as_user_id: "${prog_id}"
            - call: "POST /robotics/robot-programs/${rp_id}/simulate/record"
              payload: { measured_sim_cycle_time_s: 9.5 }
              as: ControlsProgrammer
              as_user_id: "${prog_id}"
            - call: "POST /robotics/robot-programs/${rp_id}/release"
              payload: {}
              as: ControlsProgrammer
              as_user_id: "${prog_id}"
            - call: "GET /robotics/cell-projects/${proj_id}"
              payload: {}
              as: ProjectEngineer
              as_user_id: "${eng_id}"
              captures: { v4: $.data.version }
            - call: "POST /robotics/cell-projects/${proj_id}/advance"
              payload: { expected_project_version: "${v4}" }
              as: SiteSupervisor
              as_user_id: "${sup_id}"
              captures: { v5: $.data.version }
            - call: "POST /robotics/cell-projects/${proj_id}/acceptance-tests"
              payload: { phase: "FAT", measured_cycle_time_s: 12.0, measured_oee_pct: 70.0, defects_observed: 5 }
              as: SiteSupervisor
              as_user_id: "${sup_id}"
              captures: { fat_id: $.data.id }
          trigger:
            - call: "POST /robotics/acceptance-tests/${fat_id}/fail"
              payload: {}
              as: SiteSupervisor
              as_user_id: "${sup_id}"
          assert:
            - "CellProject.${proj_id}.status == DESIGN"
            - "CellProject.${proj_id}.rework_count == 1"
            - "RobotProgram.${rp_id}.dev_status == REWORK"
            - "RobotSelection.${rs_id}.selection_status == VALIDATED (un-locked by cascade)"

      - name: robot_program_parallel_dev_and_sim_axes
        grounds:
          - state_machines.RobotProgram
          - entities.RobotProgram.fields.dev_status
          - entities.RobotProgram.fields.sim_status
        distinguishing_aspect: |
          RobotProgram carries two independent state axes on the same row —
          dev_status (OUTLINE->CODED->PEER_REVIEWED->RELEASED, with RELEASED->
          REWORK->CODED cycle) and sim_status (UNSIMULATED->SIM_RUNNING->SIM_
          PASSED/SIM_FAILED->SIM_RUNNING loop): dev transitions do not move the
          sim axis and vice versa, and release requires a join of both axes.
        test_recipe:
          setup:
            - "Project in DESIGN; program MAIN created; sim run executed and failed once while dev still OUTLINE->CODED, proving sim axis moves independently of dev axis"
