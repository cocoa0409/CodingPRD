scaffold_corner_design:

  # =================================================================================
  - section: entities
    instances:
      - name: create_service_area_applies_active_default_and_system_fields
        claim_type: creation
        grounds: [entities.ServiceArea.fields.status, endpoints]
        distinguishing_aspect: "POST /service-areas with the five required fields returns 201, status == ACTIVE, version == 1 and a server-minted UUID id that the client never supplied."
        test_recipe:
          setup: ["Empty database; logical clock at its startup default 2026-05-01T00:00:00Z."]
          setup_api_calls: []
          trigger:
            - call: "POST /service-areas"
              payload: { name: "Bay", center_lat: 37.0, center_lon: -122.0, max_range_km: 12.0, max_payload_g: 2500 }
              as: PlatformAdmin
              captures: { sa_id: $.data.id }
          assert:
            - "response code == 201"
            - "ServiceArea.${sa_id}.status == ACTIVE"
            - "ServiceArea.${sa_id}.version == 1"
            - "ServiceArea.${sa_id}.id is a bare UUID with no type prefix"
            - "response envelope carries meta.api_request_id, meta.api_request_timestamp and response_type == object"

      - name: create_order_missing_payload_weight_returns_invalid_request
        claim_type: required_fields
        grounds: [entities.Order.fields.payload_weight_g, "validations[priority=3]", "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "payload_weight_g has source: input with no default, so omitting it returns 422 ERR_INVALID_REQUEST and creates no Order."
        test_recipe:
          setup: ["Bay service area and customer Ann exist."]
          setup_api_calls:
            - call: "POST /service-areas"
              payload: { name: "Bay", center_lat: 37.0, center_lon: -122.0, max_range_km: 12.0, max_payload_g: 2500 }
              as: PlatformAdmin
              captures: { sa_id: $.data.id }
            - call: "POST /customers"
              payload: { name: "Ann", email: "ann@x.com", dropoff_lat: 37.05, dropoff_lon: -122.0 }
              as: PlatformAdmin
              captures: { cust_id: $.data.id }
          trigger:
            - call: "POST /orders"
              payload: { customer_id: "${cust_id}", service_area_id: "${sa_id}", priority: "STANDARD" }
              as: DispatchOperator
              as_user_id: "op-1"
          assert:
            - "response is 422 with error_id ERR_INVALID_REQUEST"
            - "GET /orders?customer_id=${cust_id} returns an empty array with total_count == 0"

      - name: create_order_omitting_priority_defaults_to_standard
        claim_type: defaults
        grounds: [entities.Order.fields.priority, calculations.order_fee_components]
        distinguishing_aspect: "priority defaults to STANDARD (multiplier 1.0), so a 2000 g order at 5.550 km bills delivery_fee 8.30 rather than an URGENT 11.21."
        test_recipe:
          setup: ["Bay service area and customer Ann (dropoff 5.550 km from the centroid)."]
          setup_api_calls:
            - call: "POST /service-areas"
              payload: { name: "Bay", center_lat: 37.0, center_lon: -122.0, max_range_km: 12.0, max_payload_g: 2500 }
              as: PlatformAdmin
              captures: { sa_id: $.data.id }
            - call: "POST /customers"
              payload: { name: "Ann", email: "ann@x.com", dropoff_lat: 37.05, dropoff_lon: -122.0 }
              as: PlatformAdmin
              captures: { cust_id: $.data.id }
          trigger:
            - call: "POST /orders"
              payload: { customer_id: "${cust_id}", service_area_id: "${sa_id}", payload_weight_g: 2000 }
              as: DispatchOperator
              as_user_id: "op-1"
              captures: { order_id: $.data.id }
          assert:
            - "Order.${order_id}.priority == STANDARD"
            - "Order.${order_id}.delivery_fee == 8.30"
            - "Order.${order_id}.airspace_surcharge == 0.66"
            - "Order.${order_id}.order_total == 8.96"

      - name: order_freezes_customer_dropoff_coordinates
        claim_type: computed_fields
        grounds: [entities.Order.fields.dropoff_lat, entities.Order.fields.dropoff_lon, calculations.order_geometry]
        distinguishing_aspect: "Order.dropoff_lat/dropoff_lon are computed copies of the Customer's coordinates at intake (37.05 / -122.0) and distance_km == 5.550 is derived from them, not supplied by the client."
        test_recipe:
          setup: ["Bay service area (centroid 37.0/-122.0); customer Ann at 37.05/-122.0."]
          setup_api_calls:
            - call: "POST /service-areas"
              payload: { name: "Bay", center_lat: 37.0, center_lon: -122.0, max_range_km: 12.0, max_payload_g: 2500 }
              as: PlatformAdmin
              captures: { sa_id: $.data.id }
            - call: "POST /customers"
              payload: { name: "Ann", email: "ann@x.com", dropoff_lat: 37.05, dropoff_lon: -122.0 }
              as: PlatformAdmin
              captures: { cust_id: $.data.id }
          trigger:
            - call: "POST /orders"
              payload: { customer_id: "${cust_id}", service_area_id: "${sa_id}", payload_weight_g: 2000, priority: "STANDARD" }
              as: DispatchOperator
              as_user_id: "op-1"
              captures: { order_id: $.data.id }
          assert:
            - "Order.${order_id}.dropoff_lat == 37.05 and Order.${order_id}.dropoff_lon == -122.0"
            - "Order.${order_id}.distance_km == 5.550"
            - "Order.${order_id}.status == QUOTED"

      - name: duplicate_tail_number_rejected
        claim_type: type_constraints
        grounds: [entities.Drone.fields.tail_number, "validations[priority=7]", "errors[ERR_DUPLICATE_TAIL_NUMBER]"]
        distinguishing_aspect: "tail_number carries a global uniqueness constraint: a second POST /drones with tail_number N101 returns 409 ERR_DUPLICATE_TAIL_NUMBER even at a different nest."
        test_recipe:
          setup: ["Bay service area with nest N1; drone N101 already registered at N1."]
          setup_api_calls:
            - call: "POST /service-areas"
              payload: { name: "Bay", center_lat: 37.0, center_lon: -122.0, max_range_km: 12.0, max_payload_g: 2500 }
              as: PlatformAdmin
              captures: { sa_id: $.data.id }
            - call: "POST /nests"
              payload: { service_area_id: "${sa_id}", name: "N1", lat: 37.0, lon: -122.0, pad_count: 2, status: "OPEN" }
              as: PlatformAdmin
              captures: { nest_id: $.data.id }
            - call: "POST /drones"
              payload: { home_nest_id: "${nest_id}", tail_number: "N101", airframe_class: "HEAVY", max_payload_g: 2500, cruise_speed_kmh: 60, hours_since_service: 0 }
              as: PlatformAdmin
          trigger:
            - call: "POST /drones"
              payload: { home_nest_id: "${nest_id}", tail_number: "N101", airframe_class: "LIGHT", max_payload_g: 1000, cruise_speed_kmh: 80, hours_since_service: 0 }
              as: PlatformAdmin
          assert:
            - "response is 409 with error_id ERR_DUPLICATE_TAIL_NUMBER"
            - "GET /drones?home_nest_id=${nest_id} returns exactly 1 drone"

      - name: get_order_with_unknown_id_returns_not_found
        claim_type: not_found
        grounds: ["errors[ERR_ORDER_NOT_FOUND]", "validations[priority=4]"]
        distinguishing_aspect: "GET /orders/{id} for a well-formed but unknown UUID returns 404 ERR_ORDER_NOT_FOUND, never 200 with an empty body."
        test_recipe:
          setup: ["Empty database."]
          setup_api_calls: []
          trigger:
            - call: "GET /orders/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: DispatchOperator
              as_user_id: "op-1"
          assert:
            - "response is 404 with error_id ERR_ORDER_NOT_FOUND"
            - "response_type == error"

      - name: nest_create_with_unknown_service_area_returns_not_found
        claim_type: parent_relationships
        grounds: [entities.Nest.fields.service_area_id, "validations[priority=5]", "errors[ERR_SERVICE_AREA_NOT_FOUND]"]
        distinguishing_aspect: "The FK Nest.service_area_id is validated on write: an unknown service_area_id returns 404 ERR_SERVICE_AREA_NOT_FOUND and no Nest is persisted."
        test_recipe:
          setup: ["Empty database."]
          setup_api_calls: []
          trigger:
            - call: "POST /nests"
              payload: { service_area_id: "00000000-0000-4000-8000-000000000000", name: "Ghost", lat: 37.0, lon: -122.0, pad_count: 1, status: "OPEN" }
              as: PlatformAdmin
          assert:
            - "response is 404 with error_id ERR_SERVICE_AREA_NOT_FOUND"

      - name: orders_list_is_paginated_with_envelope_fields
        claim_type: listing
        grounds: [entities.Order.fields.status, endpoints]
        distinguishing_aspect: "GET /orders?limit=2&offset=0 over three orders returns exactly 2 items with total_count == 3 and has_more == true; limit defaults to 10 when omitted."
        test_recipe:
          setup: ["Bay service area; customer Ann; three identical 2000 g STANDARD orders."]
          setup_api_calls:
            - call: "POST /service-areas"
              payload: { name: "Bay", center_lat: 37.0, center_lon: -122.0, max_range_km: 12.0, max_payload_g: 2500 }
              as: PlatformAdmin
              captures: { sa_id: $.data.id }
            - call: "POST /customers"
              payload: { name: "Ann", email: "ann@x.com", dropoff_lat: 37.05, dropoff_lon: -122.0 }
              as: PlatformAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /orders"
              payload: { customer_id: "${cust_id}", service_area_id: "${sa_id}", payload_weight_g: 2000, priority: "STANDARD" }
              as: DispatchOperator
              as_user_id: "op-1"
            - call: "POST /orders"
              payload: { customer_id: "${cust_id}", service_area_id: "${sa_id}", payload_weight_g: 2000, priority: "STANDARD" }
              as: DispatchOperator
              as_user_id: "op-1"
            - call: "POST /orders"
              payload: { customer_id: "${cust_id}", service_area_id: "${sa_id}", payload_weight_g: 2000, priority: "STANDARD" }
              as: DispatchOperator
              as_user_id: "op-1"
          trigger:
            - call: "GET /orders?customer_id=${cust_id}&limit=2&offset=0"
              payload: {}
              as: DispatchOperator
              as_user_id: "op-1"
          assert:
            - "response_type == array and data contains exactly 2 orders"
            - "total_count == 3 and has_more == true"
            - "limit == 2 and offset == 0 are echoed in the pagination fields"

      - name: weather_observation_is_immutable_and_carries_no_version
        claim_type: immutability
        grounds: [entities.WeatherObservation.fields.flyable]
        distinguishing_aspect: "WeatherObservation has common_fields: false — its response carries id and created_at but no version and no updated_at, and no update endpoint exists for it; flyable is computed on write (wind 50 => false)."
        test_recipe:
          setup: ["Bay service area."]
          setup_api_calls:
            - call: "POST /service-areas"
              payload: { name: "Bay", center_lat: 37.0, center_lon: -122.0, max_range_km: 12.0, max_payload_g: 2500 }
              as: PlatformAdmin
              captures: { sa_id: $.data.id }
          trigger:
            - call: "POST /weather-observations"
              payload: { service_area_id: "${sa_id}", observed_at: "2026-06-01T08:00:00Z", wind_kph: 50, gust_kph: 60, visibility_km: 8, precip: "NONE" }
              as: PlatformAdmin
              captures: { obs_id: $.data.id }
          assert:
            - "WeatherObservation.${obs_id}.flyable == false"
            - "the response body has no version field and no updated_at field"
            - "GET /weather-observations?service_area_id=${sa_id} returns exactly 1 observation"

  # =================================================================================
  - section: state_machines
    instances:
      - name: new_flight_starts_planned_and_unfiled
        claim_type: initial_state
        grounds: [state_machines.Order.QUOTED_to_ASSIGNED, entities.Flight.fields.ops_state, entities.Flight.fields.clearance_state]
        distinguishing_aspect: "A dispatched Flight is created with ops_state == PLANNED, clearance_state == UNFILED, version == 1, actual_energy_pct == null and abort_reason == null."
        test_recipe:
          setup: ["Bay + nest N1 (2 pads); drone N101 with a READY 100% pack; a QUOTED 2000 g order."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T09:00:00Z" }
              as: PlatformAdmin
            - call: "POST /service-areas"
              payload: { name: "Bay", center_lat: 37.0, center_lon: -122.0, max_range_km: 12.0, max_payload_g: 2500 }
              as: PlatformAdmin
              captures: { sa_id: $.data.id }
            - call: "POST /nests"
              payload: { service_area_id: "${sa_id}", name: "N1", lat: 37.0, lon: -122.0, pad_count: 2, status: "OPEN" }
              as: PlatformAdmin
              captures: { nest_id: $.data.id }
            - call: "POST /batteries"
              payload: { nest_id: "${nest_id}", serial: "B-1", charge_pct: 100, cycle_count: 0 }
              as: MaintenanceTech
              captures: { bat_id: $.data.id }
            - call: "POST /batteries/${bat_id}/charge"
              payload: { target_charge_pct: 100 }
              as: MaintenanceTech
            - call: "POST /drones"
              payload: { home_nest_id: "${nest_id}", tail_number: "N101", airframe_class: "HEAVY", max_payload_g: 2500, cruise_speed_kmh: 60, hours_since_service: 0 }
              as: PlatformAdmin
              captures: { drone_id: $.data.id }
            - call: "POST /drones/${drone_id}/install-battery"
              payload: { battery_id: "${bat_id}" }
              as: MaintenanceTech
            - call: "POST /customers"
              payload: { name: "Ann", email: "ann@x.com", dropoff_lat: 37.05, dropoff_lon: -122.0 }
              as: PlatformAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /orders"
              payload: { customer_id: "${cust_id}", service_area_id: "${sa_id}", payload_weight_g: 2000, priority: "STANDARD" }
              as: DispatchOperator
              as_user_id: "op-1"
              captures: { order_id: $.data.id, order_v: $.data.version }
          trigger:
            - call: "POST /orders/${order_id}/dispatch"
              payload: { nest_id: "${nest_id}", expected_order_version: "${order_v}" }
              as: DispatchOperator
              as_user_id: "op-1"
              captures: { flight_id: $.data.id }
          assert:
            - "response code == 201"
            - "Flight.${flight_id}.ops_state == PLANNED and Flight.${flight_id}.clearance_state == UNFILED"
            - "Flight.${flight_id}.actual_energy_pct == null and Flight.${flight_id}.abort_reason == null"
            - "Flight.${flight_id}.launch_nest_id == ${nest_id} and Flight.${flight_id}.recovery_nest_id == ${nest_id}"
            - "Flight.${flight_id}.battery_id == ${bat_id} and Flight.${flight_id}.drone_id == ${drone_id}"

      - name: cancel_order_after_dispatch_rejected
        claim_type: invalid_transition
        grounds: [state_machines.Order.QUOTED_to_CANCELLED, "errors[ERR_ORDER_NOT_CANCELLABLE]", "validations[priority=9]"]
        distinguishing_aspect: "Cancel is only legal from QUOTED: an ASSIGNED order returns 409 ERR_ORDER_NOT_CANCELLABLE, its flight is untouched and the funds hold is not released."
        test_recipe:
          setup: ["Bay + nest N1; drone N101 with a READY pack; order 2000 g dispatched (ASSIGNED, held_total 8.96)."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T09:00:00Z" }
              as: PlatformAdmin
            - call: "POST /service-areas"
              payload: { name: "Bay", center_lat: 37.0, center_lon: -122.0, max_range_km: 12.0, max_payload_g: 2500 }
              as: PlatformAdmin
              captures: { sa_id: $.data.id }
            - call: "POST /nests"
              payload: { service_area_id: "${sa_id}", name: "N1", lat: 37.0, lon: -122.0, pad_count: 2, status: "OPEN" }
              as: PlatformAdmin
              captures: { nest_id: $.data.id }
            - call: "POST /batteries"
              payload: { nest_id: "${nest_id}", serial: "B-1", charge_pct: 100, cycle_count: 0 }
              as: MaintenanceTech
              captures: { bat_id: $.data.id }
            - call: "POST /batteries/${bat_id}/charge"
              payload: { target_charge_pct: 100 }
              as: MaintenanceTech
            - call: "POST /drones"
              payload: { home_nest_id: "${nest_id}", tail_number: "N101", airframe_class: "HEAVY", max_payload_g: 2500, cruise_speed_kmh: 60, hours_since_service: 0 }
              as: PlatformAdmin
              captures: { drone_id: $.data.id }
            - call: "POST /drones/${drone_id}/install-battery"
              payload: { battery_id: "${bat_id}" }
              as: MaintenanceTech
            - call: "POST /customers"
              payload: { name: "Ann", email: "ann@x.com", dropoff_lat: 37.05, dropoff_lon: -122.0 }
              as: PlatformAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /orders"
              payload: { customer_id: "${cust_id}", service_area_id: "${sa_id}", payload_weight_g: 2000, priority: "STANDARD" }
              as: DispatchOperator
              as_user_id: "op-1"
              captures: { order_id: $.data.id, order_v: $.data.version }
            - call: "POST /orders/${order_id}/dispatch"
              payload: { nest_id: "${nest_id}", expected_order_version: "${order_v}" }
              as: DispatchOperator
              as_user_id: "op-1"
              captures: { flight_id: $.data.id }
          trigger:
            - call: "POST /orders/${order_id}/cancel"
              payload: {}
              as: DispatchOperator
              as_user_id: "op-1"
          assert:
            - "response is 409 with error_id ERR_ORDER_NOT_CANCELLABLE"
            - "Order.${order_id}.status == ASSIGNED"
            - "Customer.${cust_id}.held_total == 8.96 (unchanged)"
            - "Flight.${flight_id}.ops_state == PLANNED"

      - name: arrive_on_planned_flight_rejected
        claim_type: invalid_transition
        grounds: [state_machines.Flight.LAUNCHED_to_DROPPING, "errors[ERR_FLIGHT_INVALID_STATE]"]
        distinguishing_aspect: "arrive requires ops_state == LAUNCHED; calling it on a PLANNED flight returns 409 ERR_FLIGHT_INVALID_STATE and leaves ops_state at PLANNED."
        test_recipe:
          setup: ["A dispatched flight sitting at ops_state PLANNED (nothing filed, nothing launched)."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T09:00:00Z" }
              as: PlatformAdmin
            - call: "POST /service-areas"
              payload: { name: "Bay", center_lat: 37.0, center_lon: -122.0, max_range_km: 12.0, max_payload_g: 2500 }
              as: PlatformAdmin
              captures: { sa_id: $.data.id }
            - call: "POST /nests"
              payload: { service_area_id: "${sa_id}", name: "N1", lat: 37.0, lon: -122.0, pad_count: 2, status: "OPEN" }
              as: PlatformAdmin
              captures: { nest_id: $.data.id }
            - call: "POST /batteries"
              payload: { nest_id: "${nest_id}", serial: "B-1", charge_pct: 100, cycle_count: 0 }
              as: MaintenanceTech
              captures: { bat_id: $.data.id }
            - call: "POST /batteries/${bat_id}/charge"
              payload: { target_charge_pct: 100 }
              as: MaintenanceTech
            - call: "POST /drones"
              payload: { home_nest_id: "${nest_id}", tail_number: "N101", airframe_class: "HEAVY", max_payload_g: 2500, cruise_speed_kmh: 60, hours_since_service: 0 }
              as: PlatformAdmin
              captures: { drone_id: $.data.id }
            - call: "POST /drones/${drone_id}/install-battery"
              payload: { battery_id: "${bat_id}" }
              as: MaintenanceTech
            - call: "POST /customers"
              payload: { name: "Ann", email: "ann@x.com", dropoff_lat: 37.05, dropoff_lon: -122.0 }
              as: PlatformAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /orders"
              payload: { customer_id: "${cust_id}", service_area_id: "${sa_id}", payload_weight_g: 2000, priority: "STANDARD" }
              as: DispatchOperator
              as_user_id: "op-1"
              captures: { order_id: $.data.id, order_v: $.data.version }
            - call: "POST /orders/${order_id}/dispatch"
              payload: { nest_id: "${nest_id}", expected_order_version: "${order_v}" }
              as: DispatchOperator
              as_user_id: "op-1"
              captures: { flight_id: $.data.id }
          trigger:
            - call: "POST /flights/${flight_id}/arrive"
              payload: {}
              as: DispatchOperator
              as_user_id: "op-1"
          assert:
            - "response is 409 with error_id ERR_FLIGHT_INVALID_STATE"
            - "Flight.${flight_id}.ops_state == PLANNED"

      - name: abort_on_recovered_flight_rejected
        claim_type: terminal_state_lockdown
        grounds: [state_machines.Flight.RETURNING_to_RECOVERED, "errors[ERR_FLIGHT_TERMINAL]"]
        distinguishing_aspect: "RECOVERED is terminal: aborting a recovered flight returns 409 ERR_FLIGHT_TERMINAL and does NOT decrement Nest.reserved_pads a second time (which would drive it negative)."
        test_recipe:
          setup: ["A sortie flown end to end: Flight RECOVERED, Nest.reserved_pads back to 0, Drone IDLE."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T09:00:00Z" }
              as: PlatformAdmin
            - call: "POST /service-areas"
              payload: { name: "Bay", center_lat: 37.0, center_lon: -122.0, max_range_km: 12.0, max_payload_g: 2500 }
              as: PlatformAdmin
              captures: { sa_id: $.data.id }
            - call: "POST /nests"
              payload: { service_area_id: "${sa_id}", name: "N1", lat: 37.0, lon: -122.0, pad_count: 2, status: "OPEN" }
              as: PlatformAdmin
              captures: { nest_id: $.data.id }
            - call: "POST /batteries"
              payload: { nest_id: "${nest_id}", serial: "B-1", charge_pct: 100, cycle_count: 0 }
              as: MaintenanceTech
              captures: { bat_id: $.data.id }
            - call: "POST /batteries/${bat_id}/charge"
              payload: { target_charge_pct: 100 }
              as: MaintenanceTech
            - call: "POST /drones"
              payload: { home_nest_id: "${nest_id}", tail_number: "N101", airframe_class: "HEAVY", max_payload_g: 2500, cruise_speed_kmh: 60, hours_since_service: 0 }
              as: PlatformAdmin
              captures: { drone_id: $.data.id }
            - call: "POST /drones/${drone_id}/install-battery"
              payload: { battery_id: "${bat_id}" }
              as: MaintenanceTech
            - call: "POST /customers"
              payload: { name: "Ann", email: "ann@x.com", dropoff_lat: 37.05, dropoff_lon: -122.0 }
              as: PlatformAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /orders"
              payload: { customer_id: "${cust_id}", service_area_id: "${sa_id}", payload_weight_g: 2000, priority: "STANDARD" }
              as: DispatchOperator
              as_user_id: "op-1"
              captures: { order_id: $.data.id, order_v: $.data.version }
            - call: "POST /orders/${order_id}/dispatch"
              payload: { nest_id: "${nest_id}", expected_order_version: "${order_v}" }
              as: DispatchOperator
              as_user_id: "op-1"
              captures: { flight_id: $.data.id }
            - call: "POST /flights/${flight_id}/file-authorization"
              payload: { grid_cells: ["37N122W-01"], requested_alt_ft: 350, window_start: "2026-06-01T08:00:00Z", window_end: "2026-06-01T12:00:00Z" }
              as: DispatchOperator
              as_user_id: "op-1"
              captures: { auth_id: $.data.id }
            - call: "POST /_laanc/decision"
              payload: { authorization_id: "${auth_id}", outcome: "APPROVED" }
              as: PlatformAdmin
            - call: "POST /flights/${flight_id}/release"
              payload: {}
              as: FlightDirector
              as_user_id: "fd-1"
            - call: "POST /flights/${flight_id}/launch"
              payload: {}
              as: DispatchOperator
              as_user_id: "op-1"
            - call: "POST /flights/${flight_id}/arrive"
