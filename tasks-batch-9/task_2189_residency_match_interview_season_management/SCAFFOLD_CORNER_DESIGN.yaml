      - name: a_slot_starting_before_its_wave_opens_violates_the_slot_timing_rule
        claim_type: violation_to_error
        grounds:
          - validations.priority 9 ERR_SLOT_TIMING_VIOLATION
          - errors.ERR_SLOT_TIMING_VIOLATION
          - entities.InterviewWave.invite_release_at
        distinguishing_aspect: >
          The slot must lie wholly inside its wave's closed [invite_release_at, response_deadline_at]
          window. A slot on 2026-09-30, one day before the wave's 2026-10-01T12:00:00Z release, breaks the
          lower bound even though its own start_at is strictly before its end_at and its wave exists - so
          the failure is 409 ERR_SLOT_TIMING_VIOLATION, not 422 ERR_VALIDATION.
        test_recipe:
          setup:
            - "one PLANNED wave whose window is 2026-10-01T12:00:00Z .. 2026-10-08T12:00:00Z"
