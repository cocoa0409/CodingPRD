              payload: { to_iso8601: "2026-08-02T10:30:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /api/sessions/${session_id}/cancel"
              payload: {}
              as: CastingDirector
              captures: { err: $.data.error_id }
          assert:
