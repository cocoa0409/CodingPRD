              as: AssociationStaff
              captures: { period_id: $.data.id, period_version: $.data.version }
            - call: "POST /mls/associations/${assoc_id}/offices/${office_id}/listings"
              payload: { listing_member_id: "${mb_id}", mls_number: "MLS-TC1", property_address: "8 Cascade Ct", list_price_cents: 22000000 }
              as: Member
              as_user_id: "${mb_id}"
              captures: { listing_id: $.data.id }
