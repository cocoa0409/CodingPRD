scaffold_corner_design:

  - section: entities
    instances:

      - name: tract_creation_returns_201_with_system_defaults
        claim_type: creation
        grounds:
          - entities.Tract
          - entities.Tract.fields.status
          - entities.Tract.fields.suspension_count
          - entities.Tract.fields.move_in_cost_cents
          - endpoints[POST /tracts]
        distinguishing_aspect: |
          A freshly created Tract must come back 201 with status PLANNED, suspension_count 0,
          move_in_cost_cents 0, produced_tons 0 and version 1, and every client-supplied field
          echoed verbatim.
        test_recipe:
          setup:
            - "Empty database; logical clock at its 2026-08-01T00:00:00Z startup default"
          setup_api_calls:
          trigger:
            - call: "POST /tracts"
              payload: { name: "Section 14 NE", legal_description: "T3S R5W Sec 14 NE1/4", gross_acres: 120, planned_volume_tons: 4000, access_class: "ALL_SEASON" }
              as: OperationsManager
              as_user_id: "ops-1"
              captures: { tract_id: $.data.id }
          assert:
            - "response.status == 201"
            - "Tract.${tract_id}.status == PLANNED"
            - "Tract.${tract_id}.access_class == ALL_SEASON"
            - "Tract.${tract_id}.gross_acres == 120"
            - "Tract.${tract_id}.planned_volume_tons == 4000"
            - "Tract.${tract_id}.suspension_count == 0"
            - "Tract.${tract_id}.move_in_cost_cents == 0"
            - "Tract.${tract_id}.produced_tons == 0"
            - "Tract.${tract_id}.version == 1"

      - name: mill_receiving_status_defaults_to_open_when_omitted
        claim_type: defaults
        grounds:
          - entities.Mill.fields.receiving_status
          - endpoints[POST /mills]
        distinguishing_aspect: |
          receiving_status carries default OPEN, so a create body that omits it must still
          produce a mill whose yard accepts loads.
        test_recipe:
          setup:
            - "Empty database"
          setup_api_calls:
          trigger:
            - call: "POST /mills"
              payload: { name: "Cascade Mill A", state_code: "OR" }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { mill_a_id: $.data.id }
          assert:
            - "response.status == 201"
            - "Mill.${mill_a_id}.receiving_status == OPEN"
            - "Mill.${mill_a_id}.state_code == OR"

      - name: mill_contract_overrun_tolerance_defaults_to_five_percent
        claim_type: defaults
        grounds:
          - entities.MillContract.fields.overrun_tolerance_pct
          - entities.MillContract.fields.available_tons
          - endpoints[POST /mill-contracts]
        distinguishing_aspect: |
          overrun_tolerance_pct carries default 0.05 and available_tons initialises to
          quota_tons, so an omitted tolerance must not read as 0.
        test_recipe:
          setup:
            - "Mill A exists"
          setup_api_calls:
            - call: "POST /mills"
              payload: { name: "Cascade Mill A", state_code: "OR", receiving_status: "OPEN" }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { mill_a_id: $.data.id }
          trigger:
            - call: "POST /mill-contracts"
              payload: { mill_id: "${mill_a_id}", species: "WESTERN_HEMLOCK", grade: "PULP", quota_tons: 250, base_rate_cents_per_ton: 2600, period_start: "2026-07-01", period_end: "2026-09-30" }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { mc_id: $.data.id }
          assert:
            - "response.status == 201"
            - "MillContract.${mc_id}.overrun_tolerance_pct == 0.05"
            - "MillContract.${mc_id}.reserved_tons == 0.00"
            - "MillContract.${mc_id}.delivered_tons == 0.00"
            - "MillContract.${mc_id}.available_tons == 250.00"
            - "MillContract.${mc_id}.status == OPEN"

      - name: get_load_with_unknown_id_returns_load_not_found
        claim_type: not_found
        grounds:
          - errors[ERR_LOAD_NOT_FOUND]
          - endpoints[GET /loads/{id}]
        distinguishing_aspect: |
          A syntactically valid but unknown UUID on GET /loads/{id} must return 404 with
          ERR_LOAD_NOT_FOUND, never an empty 200 envelope.
        test_recipe:
          setup:
            - "Empty database"
          setup_api_calls:
          trigger:
            - call: "GET /loads/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: OperationsManager
              as_user_id: "ops-1"
              captures: { err_id: $.data.error_id }
          assert:
            - "response.status == 404"
            - "response.data.error_id == ERR_LOAD_NOT_FOUND"

      - name: create_tract_without_access_class_returns_validation
        claim_type: required_fields
        grounds:
          - errors[ERR_VALIDATION]
          - validations[priority=30]
          - entities.Tract.fields.access_class
        distinguishing_aspect: |
          access_class is source: input with no default, so omitting it must fail schema
          validation at priority 30 rather than silently defaulting to ALL_SEASON.
        test_recipe:
          setup:
            - "Empty database"
          setup_api_calls:
          trigger:
            - call: "POST /tracts"
              payload: { name: "Section 14 NE", legal_description: "T3S R5W Sec 14 NE1/4", gross_acres: 120, planned_volume_tons: 4000 }
              as: OperationsManager
              as_user_id: "ops-1"
              captures: { err_id: $.data.error_id }
          assert:
            - "response.status == 400"
            - "response.data.error_id == ERR_VALIDATION"
            - "no Tract row is created"

      - name: create_truck_with_illegal_axle_config_returns_validation
        claim_type: type_constraints
        grounds:
          - errors[ERR_VALIDATION]
          - entities.Truck.fields.axle_config
          - validations[priority=30]
        distinguishing_aspect: |
          axle_config is a closed enum of FIVE_AXLE, SIX_AXLE and SEVEN_AXLE; EIGHT_AXLE must
          be rejected at priority 30 before any downstream weight maths can see it.
        test_recipe:
          setup:
            - "Carrier Ridgeline Hauling exists with all three coverages ACTIVE"
          setup_api_calls:
            - call: "POST /haul-contractors"
              payload: { name: "Ridgeline Hauling", dot_number: "DOT-771204", base_state_code: "OR" }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { hc_id: $.data.id }
            - call: "POST /haul-contractors/${hc_id}/insurance-certificates"
              payload: { coverage_type: "GENERAL_LIABILITY", effective_on: "2026-01-01", expires_on: "2027-01-01", limit_cents: 100000000 }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { cert_gl_id: $.data.id }
            - call: "POST /haul-contractors/${hc_id}/insurance-certificates"
              payload: { coverage_type: "AUTO_LIABILITY", effective_on: "2026-01-01", expires_on: "2027-01-01", limit_cents: 100000000 }
              as: PlatformAdmin
              as_user_id: "admin-1"
            - call: "POST /haul-contractors/${hc_id}/insurance-certificates"
              payload: { coverage_type: "WORKERS_COMP", effective_on: "2026-01-01", expires_on: "2027-01-01", limit_cents: 100000000 }
              as: PlatformAdmin
              as_user_id: "admin-1"
          trigger:
            - call: "POST /haul-contractors/${hc_id}/trucks"
              payload: { unit_number: "T-99", axle_config: "EIGHT_AXLE", tare_weight_lbs: 31000, permit_class: "STANDARD" }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { err_id: $.data.error_id }
          assert:
            - "response.status == 400"
            - "response.data.error_id == ERR_VALIDATION"
            - "no Truck row is created for unit T-99"

      - name: production_plan_planned_volume_tons_is_computed_not_accepted
        claim_type: computed_fields
        grounds:
          - entities.ProductionPlan.fields.planned_volume_tons
          - endpoints[POST /tracts/{id}/production-plans]
          - concurrency_rules[plan-create-stale-tract]
        distinguishing_aspect: |
          planned_volume_tons is source: computed as target_tons_per_week * plan_horizon_weeks
          rounded to 2 decimals, so 137.5 tons/week over 6 weeks must return exactly 825.00 and
          the field must never be client-settable.
        test_recipe:
          setup:
            - "A PLANNED tract at version 1"
          setup_api_calls:
            - call: "POST /tracts"
              payload: { name: "Section 14 NE", legal_description: "T3S R5W Sec 14 NE1/4", gross_acres: 120, planned_volume_tons: 4000, access_class: "ALL_SEASON" }
              as: OperationsManager
              as_user_id: "ops-1"
              captures: { tract_id: $.data.id, tract_v: $.data.version }
          trigger:
            - call: "POST /tracts/${tract_id}/production-plans"
              payload: { target_tons_per_week: 137.5, plan_horizon_weeks: 6, expected_tract_version: "${tract_v}" }
              as: OperationsManager
              as_user_id: "ops-1"
              captures: { plan_id: $.data.id }
          assert:
            - "response.status == 201"
            - "ProductionPlan.${plan_id}.planned_volume_tons == 825.00"
            - "ProductionPlan.${plan_id}.status == DRAFT"
            - "ProductionPlan.${plan_id}.tract_id == ${tract_id}"
            - "Tract.${tract_id}.version == 2"

      - name: safety_finding_is_immutable_and_carries_no_version_field
        claim_type: immutability
        grounds:
          - entities.SafetyFinding
          - endpoints[POST /haul-contractors/{id}/safety-findings]
          - endpoints[GET /haul-contractors/{id}/safety-findings]
        distinguishing_aspect: |
          SafetyFinding is declared common_fields: false, so it exposes only id and
          created_at, has no version and no update or delete endpoint anywhere in §1.5; the
          append-only log is readable exclusively through the sub-resource listing.
        test_recipe:
          setup:
            - "Carrier Ridgeline Hauling with all three coverages ACTIVE and compliance_score 100"
          setup_api_calls:
            - call: "POST /haul-contractors"
              payload: { name: "Ridgeline Hauling", dot_number: "DOT-771204", base_state_code: "OR" }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { hc_id: $.data.id }
            - call: "POST /haul-contractors/${hc_id}/insurance-certificates"
              payload: { coverage_type: "GENERAL_LIABILITY", effective_on: "2026-01-01", expires_on: "2027-01-01", limit_cents: 100000000 }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { cert_gl_id: $.data.id }
            - call: "POST /haul-contractors/${hc_id}/insurance-certificates"
              payload: { coverage_type: "AUTO_LIABILITY", effective_on: "2026-01-01", expires_on: "2027-01-01", limit_cents: 100000000 }
              as: PlatformAdmin
              as_user_id: "admin-1"
            - call: "POST /haul-contractors/${hc_id}/insurance-certificates"
              payload: { coverage_type: "WORKERS_COMP", effective_on: "2026-01-01", expires_on: "2027-01-01", limit_cents: 100000000 }
              as: PlatformAdmin
              as_user_id: "admin-1"
          trigger:
            - call: "POST /haul-contractors/${hc_id}/safety-findings"
              payload: { severity: "MINOR", points: 5, occurred_on: "2026-07-30", note: "tarp strap frayed" }
              as: SafetyOfficer
              as_user_id: "safety-1"
              captures: { sf_id: $.data.id }
            - call: "GET /haul-contractors/${hc_id}/safety-findings"
              payload: {}
              as: SafetyOfficer
              as_user_id: "safety-1"
              captures: { sf0_id: "$.data[0].id" }
          assert:
            - "response.status == 201 on the finding create"
            - "SafetyFinding.${sf_id}.points == 5"
            - "SafetyFinding.${sf_id}.occurred_on == 2026-07-30"
            - "the SafetyFinding response body contains no version key and no updated_at key"
            - "${sf0_id} == ${sf_id}"
            - "HaulContractor.${hc_id}.compliance_score == 95"

      - name: list_loads_returns_pagination_envelope_with_total_count_and_has_more
        claim_type: listing
        grounds:
          - endpoints[GET /loads]
          - response_envelope.pagination_fields
          - entities.Load
        distinguishing_aspect: |
          GET /loads must honour limit and offset and report total_count and has_more. With
          three dispatched loads and limit 2 offset 0 the page holds 2 rows, total_count is 3
          and has_more is true.
        test_recipe:
          setup:
            - "Mill A, MillContract A with quota 500 tons, ACTIVE tract, compliant carrier and one truck"
            - "Three loads of 10.00 tons each dispatched on non-overlapping closed haul intervals (2026-08-03, 2026-08-04 and 2026-08-05)"
          setup_api_calls:
            - call: "POST /mills"
              payload: { name: "Cascade Mill A", state_code: "OR", receiving_status: "OPEN" }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { mill_a_id: $.data.id }
            - call: "POST /mill-contracts"
              payload: { mill_id: "${mill_a_id}", species: "DOUGLAS_FIR", grade: "SAWLOG_1", quota_tons: 500, base_rate_cents_per_ton: 4200, period_start: "2026-07-01", period_end: "2026-09-30", overrun_tolerance_pct: 0.05 }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { mc_a_id: $.data.id }
            - call: "POST /haul-contractors"
              payload: { name: "Ridgeline Hauling", dot_number: "DOT-771204", base_state_code: "OR" }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { hc_id: $.data.id }
            - call: "POST /haul-contractors/${hc_id}/insurance-certificates"
              payload: { coverage_type: "GENERAL_LIABILITY", effective_on: "2026-01-01", expires_on: "2027-01-01", limit_cents: 100000000 }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { cert_gl_id: $.data.id }
            - call: "POST /haul-contractors/${hc_id}/insurance-certificates"
              payload: { coverage_type: "AUTO_LIABILITY", effective_on: "2026-01-01", expires_on: "2027-01-01", limit_cents: 100000000 }
              as: PlatformAdmin
              as_user_id: "admin-1"
            - call: "POST /haul-contractors/${hc_id}/insurance-certificates"
              payload: { coverage_type: "WORKERS_COMP", effective_on: "2026-01-01", expires_on: "2027-01-01", limit_cents: 100000000 }
              as: PlatformAdmin
              as_user_id: "admin-1"
            - call: "POST /haul-contractors/${hc_id}/trucks"
              payload: { unit_number: "T-18", axle_config: "SIX_AXLE", tare_weight_lbs: 31000, permit_class: "STANDARD" }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { truck_id: $.data.id }
            - call: "POST /crews"
              payload: { name: "Crew Alpha", crew_type: "MECHANIZED_GROUND", equipment_pieces: 4, daily_rate_cents: 480000 }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { crew_id: $.data.id }
            - call: "POST /tracts"
              payload: { name: "Section 14 NE", legal_description: "T3S R5W Sec 14 NE1/4", gross_acres: 120, planned_volume_tons: 4000, access_class: "ALL_SEASON" }
              as: OperationsManager
              as_user_id: "ops-1"
              captures: { tract_id: $.data.id, tract_v: $.data.version }
            - call: "POST /tracts/${tract_id}/production-plans"
              payload: { target_tons_per_week: 600, plan_horizon_weeks: 8, expected_tract_version: "${tract_v}" }
              as: OperationsManager
              as_user_id: "ops-1"
              captures: { plan_id: $.data.id }
            - call: "POST /production-plans/${plan_id}/approve"
              payload: {}
              as: OperationsManager
              as_user_id: "ops-1"
            - call: "POST /tracts/${tract_id}/crew-assignments"
              payload: { crew_id: "${crew_id}", move_in_miles: 40, window_start: "2026-08-01", window_end: "2026-10-15" }
              as: OperationsManager
              as_user_id: "ops-1"
              captures: { ca_id: $.data.id }
            - call: "POST /haul-routes"
              payload: { tract_id: "${tract_id}", mill_id: "${mill_a_id}", distance_miles: 52, legal_gross_weight_lbs: 98000, permit_class_required: "STANDARD", status: "OPEN" }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { route_a_id: $.data.id }
            - call: "POST /tracts/${tract_id}/mobilize"
              payload: {}
              as: OperationsManager
              as_user_id: "ops-1"
            - call: "POST /tracts/${tract_id}/activate"
              payload: {}
              as: OperationsManager
              as_user_id: "ops-1"
            - call: "POST /loads"
              payload: { tract_id: "${tract_id}", mill_contract_id: "${mc_a_id}", haul_route_id: "${route_a_id}", truck_id: "${truck_id}", declared_species: "DOUGLAS_FIR", declared_grade: "SAWLOG_1", estimated_net_tons: 10.0, scheduled_depart_at: "2026-08-03T08:00:00Z", scheduled_arrive_at: "2026-08-03T10:00:00Z" }
              as: OperationsManager
              as_user_id: "ops-1"
              captures: { l1_id: $.data.id, l1_prov: $.data.provisional_haul_pay_cents }
            - call: "POST /loads"
              payload: { tract_id: "${tract_id}", mill_contract_id: "${mc_a_id}", haul_route_id: "${route_a_id}", truck_id: "${truck_id}", declared_species: "DOUGLAS_FIR", declared_grade: "SAWLOG_1", estimated_net_tons: 10.0, scheduled_depart_at: "2026-08-04T08:00:00Z", scheduled_arrive_at: "2026-08-04T10:00:00Z" }
              as: OperationsManager
              as_user_id: "ops-1"
              captures: { l2_id: $.data.id, l2_prov: $.data.provisional_haul_pay_cents }
            - call: "POST /loads"
              payload: { tract_id: "${tract_id}", mill_contract_id: "${mc_a_id}", haul_route_id: "${route_a_id}", truck_id: "${truck_id}", declared_species: "DOUGLAS_FIR", declared_grade: "SAWLOG_1", estimated_net_tons: 10.0, scheduled_depart_at: "2026-08-05T08:00:00Z", scheduled_arrive_at: "2026-08-05T10:00:00Z" }
              as: OperationsManager
              as_user_id: "ops-1"
              captures: { l3_id: $.data.id, l3_prov: $.data.provisional_haul_pay_cents }
          trigger:
            - call: "GET /loads"
              payload: { tract_id: "${tract_id}", limit: 2, offset: 0 }
              as: OperationsManager
              as_user_id: "ops-1"
              captures: { first_id: "$.data[0].id" }
          assert:
            - "response.status == 200"
            - "len(response.data) == 2"
            - "response.meta pagination total_count == 3"
            - "response has_more == true"
            - "MillContract.${mc_a_id}.reserved_tons == 30.00"
            - "MillContract.${mc_a_id}.available_tons == 470.00"

      - name: delivery_ticket_tare_weight_is_copied_from_the_truck
        claim_type: system_fields
        grounds:
          - entities.DeliveryTicket.fields.tare_weight_lbs
          - entities.Truck.fields.tare_weight_lbs
          - calculations.ticket_net_tons
          - endpoints[POST /loads/{id}/delivery-tickets]
        distinguishing_aspect: |
          tare_weight_lbs is source: computed and is copied from Truck.tare_weight_lbs when
          the ticket row is written; the create body has no tare field at all, so the ticket
          must show 31000 and derive net_weight_lbs 59000 from it.
        test_recipe:
          setup:
            - "MillContract A quota 500 tons, ACTIVE tract, 52-mile route, SIX_AXLE truck with tare 31000 lbs"
            - "Load 1 of 26.50 estimated tons is AT_MILL with no ticket yet"
          setup_api_calls:
            - call: "POST /mills"
              payload: { name: "Cascade Mill A", state_code: "OR", receiving_status: "OPEN" }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { mill_a_id: $.data.id }
            - call: "POST /mill-contracts"
              payload: { mill_id: "${mill_a_id}", species: "DOUGLAS_FIR", grade: "SAWLOG_1", quota_tons: 500, base_rate_cents_per_ton: 4200, period_start: "2026-07-01", period_end: "2026-09-30", overrun_tolerance_pct: 0.05 }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { mc_a_id: $.data.id }
            - call: "POST /haul-contractors"
              payload: { name: "Ridgeline Hauling", dot_number: "DOT-771204", base_state_code: "OR" }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { hc_id: $.data.id }
            - call: "POST /haul-contractors/${hc_id}/insurance-certificates"
              payload: { coverage_type: "GENERAL_LIABILITY", effective_on: "2026-01-01", expires_on: "2027-01-01", limit_cents: 100000000 }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { cert_gl_id: $.data.id }
            - call: "POST /haul-contractors/${hc_id}/insurance-certificates"
              payload: { coverage_type: "AUTO_LIABILITY", effective_on: "2026-01-01", expires_on: "2027-01-01", limit_cents: 100000000 }
              as: PlatformAdmin
              as_user_id: "admin-1"
            - call: "POST /haul-contractors/${hc_id}/insurance-certificates"
              payload: { coverage_type: "WORKERS_COMP", effective_on: "2026-01-01", expires_on: "2027-01-01", limit_cents: 100000000 }
              as: PlatformAdmin
              as_user_id: "admin-1"
            - call: "POST /haul-contractors/${hc_id}/trucks"
              payload: { unit_number: "T-18", axle_config: "SIX_AXLE", tare_weight_lbs: 31000, permit_class: "STANDARD" }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { truck_id: $.data.id }
            - call: "POST /crews"
              payload: { name: "Crew Alpha", crew_type: "MECHANIZED_GROUND", equipment_pieces: 4, daily_rate_cents: 480000 }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { crew_id: $.data.id }
            - call: "POST /tracts"
              payload: { name: "Section 14 NE", legal_description: "T3S R5W Sec 14 NE1/4", gross_acres: 120, planned_volume_tons: 4000, access_class: "ALL_SEASON" }
              as: OperationsManager
              as_user_id: "ops-1"
              captures: { tract_id: $.data.id, tract_v: $.data.version }
            - call: "POST /tracts/${tract_id}/production-plans"
              payload: { target_tons_per_week: 600, plan_horizon_weeks: 8, expected_tract_version: "${tract_v}" }
              as: OperationsManager
              as_user_id: "ops-1"
              captures: { plan_id: $.data.id }
            - call: "POST /production-plans/${plan_id}/approve"
              payload: {}
              as: OperationsManager
              as_user_id: "ops-1"
            - call: "POST /tracts/${tract_id}/crew-assignments"
              payload: { crew_id: "${crew_id}", move_in_miles: 40, window_start: "2026-08-01", window_end: "2026-10-15" }
              as: OperationsManager
              as_user_id: "ops-1"
              captures: { ca_id: $.data.id }
            - call: "POST /haul-routes"
              payload: { tract_id: "${tract_id}", mill_id: "${mill_a_id}", distance_miles: 52, legal_gross_weight_lbs: 98000, permit_class_required: "STANDARD", status: "OPEN" }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { route_a_id: $.data.id }
            - call: "POST /tracts/${tract_id}/mobilize"
              payload: {}
              as: OperationsManager
              as_user_id: "ops-1"
            - call: "POST /tracts/${tract_id}/activate"
              payload: {}
              as: OperationsManager
