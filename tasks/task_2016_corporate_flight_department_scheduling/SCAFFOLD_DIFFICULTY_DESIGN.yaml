  # ---------------------------------------------------------------------------
  # Rule 9 — compensating_invariant: different conserved quantities
  # ---------------------------------------------------------------------------
  - rule_id: compensating_invariant
    instances:
      - name: business_unit_allocated_cents_conserved_across_settle
        grounds:
          - calculations.trip_cost_allocation
          - entities.BusinessUnit.fields.allocated_cents
        distinguishing_aspect: |
          Conserved quantity: BusinessUnit.allocated_cents. Settle adds
          allocated_cost_cents to the BU; a compensating flow (hypothetical
          unsettle / trip-cancel-after-settle path is NOT in scope here, so the
          invariant tested is: across a settle followed by a no-op re-settle
          attempt, the BU allocated_cents is unchanged from its post-settle
          value, i.e. the second settle is rejected by state and no double-
          counting occurs). Different conserved quantity from instance 2.
        test_recipe:
          setup:
            - "Full flow trip COMPLETED; settle once with allocated_cost_cents = X"
            - "BU.allocated_cents == X"
            - "Second settle attempt on the same trip is rejected"
            - "BU.allocated_cents remains X (no double-count)"
          setup_api_calls:
            - call: "POST /flight-ops/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: FlightDeptManager
            - call: "POST /flight-ops/business-units"
              payload: { bu_code: "BU-I1", name: "I1", annual_flight_budget_cents: 100000000 }
              as: FinanceAdmin
