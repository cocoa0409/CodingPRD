          setup:
            - "Clock at 2026-08-01T00:00:00Z; loan principal 10,000,000.00 with two OUTSTANDING advances totalling 350,000.00 of principal."
            - "A FORECLOSURE plan executed against a fresh ACCEPTED appraisal, the REO acquired and marketed."
