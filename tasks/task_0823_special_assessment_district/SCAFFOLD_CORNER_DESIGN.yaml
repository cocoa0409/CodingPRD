  # =========================================================================
  # Cross-Cutting Complexity Layers (Optimistic Concurrency)
  # =========================================================================
  - section: cross_cutting_complexity_layers
    instances:
      - name: payoff_quote_stale_parcel_version_conflict
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[payoff-quote-create-stale-parcel]", "errors[ERR_STALE_PARCEL_VERSION]"]
        distinguishing_aspect: "After a first payoff quote bumps the parcel's version, a second create still carrying the pre-bump expected_parcel_version is rejected 412 ERR_STALE_PARCEL_VERSION."
        test_recipe:
          setup: ["District DOCC FORMED single parcel (remaining 1000000), bond term 5 issued; parcel.version read as pv0, first quote created (version now advanced)."]
          setup_api_calls:
            - call: "POST /districts"
              payload: { name: "DOCC", formation_method: "BENEFIT_UNITS", total_project_cost_cents: 1000000 }
              as: DistrictAdministrator
              captures: { docc: "$.data.id" }
            - call: "POST /districts/${docc}/parcels"
              payload: { apn: "OCC-1", owner_name: "O", benefit_units: 100 }
              as: DistrictAdministrator
              captures: { pocc: "$.data.id" }
            - call: "POST /districts/${docc}/open-protest"
              payload: {}
              as: DistrictAdministrator
            - call: "POST /districts/${docc}/close-hearing"
              payload: {}
              as: DistrictAdministrator
            - call: "POST /districts/${docc}/rolls"
              payload: { method: "BENEFIT_UNITS" }
              as: DistrictAdministrator
              captures: { rocc: "$.data.id" }
            - call: "POST /rolls/${rocc}/confirm"
              payload: {}
              as: DistrictAdministrator
            - call: "POST /districts/${docc}/bonds"
              payload: { issuance_date: "2026-07-01T00:00:00Z", coupon_rate_bps: 500, term_years: 5, reserve_fund_pct: 0.10 }
              as: DistrictAdministrator
              captures: { bocc: "$.data.id" }
            - call: "POST /bonds/${bocc}/issue"
              payload: {}
              as: DistrictAdministrator
            - call: "GET /parcels/${pocc}"
              payload: {}
              as: CountyTreasurer
              captures: { pv0: "$.data.version" }
            - call: "POST /parcels/${pocc}/payoff-quotes"
              payload: { quote_mode: "IMMEDIATE", quote_date: "2026-08-01T00:00:00Z", expected_parcel_version: "${pv0}" }
              as: CountyTreasurer
          trigger:
            - call: "POST /parcels/${pocc}/payoff-quotes"
              payload: { quote_mode: "NEXT_CALL_DATE", quote_date: "2026-08-01T00:00:00Z", expected_parcel_version: "${pv0}" }
              as: CountyTreasurer
              captures: { err: "$.data.error_id" }
          assert:
            - "response code == 412"
            - "response error_id == ERR_STALE_PARCEL_VERSION"

