        That instance drives the deepest chain in the scaffold — clock sweep -> Guard EXPIRED -> PostAssignment VOIDED -> Post recount/status -> StaffingPlan ledger and posture -> SecurityEvent gate — and asserts every hop in the same response, which subsumes any shorter end-to-end cascade claim. cancel_confirmed_assignment_cascades_post_plan_event and critical_le_handoff_cascades_ingress_lanes_gate cover the other two cascade origins with the same hop-by-hop assertions.
