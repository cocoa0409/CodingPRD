          - state_machines.ShopEntitlement.initial_state
          - state_machines.PublicationVersion.initial_state
        distinguishing_aspect: |
          Four freshly created rows each start in their declared initial state in a single sweep:
          License DRAFT, Technician UNVERIFIED, ShopEntitlement PENDING/UNSETTLED, and
          PublicationVersion at review_status DRAFT x distribution_status WITHHELD with
