# =============================================================================
# Professional Licensing Exam Prep — Scaffold (§1.0–§1.7)
# Difficulty band: Expert
# =============================================================================

scenario: |
  Professional Licensing Exam Prep (Becker CPA/NCLEX/real-estate style): course &
  content library by license, study-plan & adaptive question bank, mock-exam scoring
  & readiness, pass-guarantee/retake policy, subscription/tiers & financing, CE bundle,
  progress analytics, cohort/live-review

domain_name: licensing-exam-prep
api_prefix: ""   # flat topology: many top-level collections sit at root (/license-programs, /enrollments, /cohorts, ...)

complexity_profile:
  primary_archetype: workflow_orchestration
  secondary_archetype: pricing_engine
  complexity_layers:
    - dual_variant_calculation       # conservative vs projected readiness on Enrollment
    - rate_threshold_triggers        # readiness threshold + activity thresholds for pass-guarantee
    - cascading_side_effects         # cohort drop / enrollment terminal cascades
    - optimistic_concurrency         # OCC on Enrollment.version for financing-restructure supersede
    - derived_field_reconciliation   # readiness / mastery / financing_balance kept consistent
    - temporal_windowing             # cohort live-review sessions, exam-window scheduling

  entity_topology: hybrid
  # Enrollment is the aggregate root (StudyPlanDomain, MockExam, PracticeSession,
  # Installment, CECreditAward nest under it); LicenseProgram / SubscriptionPlan /
  # CEBundle / QuestionItem / Cohort are flat catalog/peer entities referenced by FK.

  state_machine_shape: branching
  # Enrollment forks ACTIVE → {PASSED, FAILED} with divergent side-effects; financing
  # has a parallel dimension; PassGuaranteeClaim branches APPROVED/DENIED; Cohort cyclic
  # membership (JOINED → DROPPED → re-JOINED) is excluded — membership is its own entity.

  relationship_patterns:
    - one_to_many       # Enrollment → its mock exams, practice sessions, installments, domains
    - many_to_many      # CohortMembership junction between Learner-Enrollment and Cohort
    - cross_aggregate   # Enrollment references LicenseProgram, SubscriptionPlan, CEBundle, Cohort

  role_model: peer_roles
  # Learner owns own enrollment-scoped actions; ContentAdmin owns catalog; ExamProctor
  # certifies official exam outcomes; opaque PlatformOps runs clock / batch sweeps.

  consistency_model: immediate

# =============================================================================
# §1.0 Response Envelope (FIXED — verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  # ---------- Catalog / configuration entities ----------
  - name: LicenseProgram
    parent: null
    common_fields: true
    fields:
      - { name: license_code, type: string, source: input, description: "License identifier e.g. CPA-FAR, NCLEX-RN, RE-SALES", constraints: "unique among LicensePrograms" }
      - { name: title, type: string, source: input, description: "Human-readable program title" }
      - { name: passing_scaled_score, type: integer, source: input, description: "Official exam passing scaled score 0..100", constraints: "0 <= passing_scaled_score <= 100" }
      - { name: domain_weights, type: array, source: input, description: "Blueprint domains: array of {domain_code, weight}; weights are fractions that MUST sum to exactly 1.00 (two decimals)", constraints: "sum(weight) == 1.00; each weight > 0; >= 1 domain" }
      - { name: status, type: enum, source: system, description: "DRAFT | PUBLISHED | RETIRED — only PUBLISHED programs accept new enrollments", default: DRAFT, constraints: "DRAFT|PUBLISHED|RETIRED" }

  - name: SubscriptionPlan
    parent: null
    common_fields: true
    fields:
      - { name: tier, type: enum, source: input, description: "BASIC | PLUS | PRO", constraints: "BASIC|PLUS|PRO" }
      - { name: total_price_cents, type: integer, source: input, description: "Full plan price in integer cents", constraints: ">= 0" }
      - { name: down_payment_pct, type: number, source: input, description: "Fraction of price due up-front when financed, two decimals e.g. 0.20", constraints: "0.00 <= down_payment_pct <= 1.00" }
      - { name: financing_months, type: integer, source: input, description: "Number of monthly installments for the financed remainder (interest-free)", constraints: ">= 1 and <= 24" }
      - { name: included_mock_credits, type: integer, source: input, description: "Mock-exam attempts included before per-attempt overage applies", constraints: ">= 0" }
      - { name: pass_guarantee, type: boolean, source: input, description: "Whether this tier carries the pass-guarantee/retake policy", default: false }
      - { name: guarantee_refund_pct, type: number, source: input, description: "Fraction of amount-paid refunded on an approved money-back guarantee claim, two decimals", default: 0.0, constraints: "0.00 <= guarantee_refund_pct <= 1.00" }
      - { name: includes_ce, type: boolean, source: input, description: "Whether this tier bundles a CE package", default: false }
      - { name: status, type: enum, source: system, description: "ACTIVE | ARCHIVED — ARCHIVED plans reject new enrollments", default: ACTIVE, constraints: "ACTIVE|ARCHIVED" }

  - name: CEBundle
    parent: null
    common_fields: true
    fields:
      - { name: license_program_id, type: string, source: input, description: "FK -> LicenseProgram.id; the program this CE bundle accrues credit for" }
      - { name: ce_credits_total, type: integer, source: input, description: "Whole CE credits granted across all modules when fully completed", constraints: ">= 1" }
      - { name: modules_total, type: integer, source: input, description: "Number of CE modules; credits accrue cumulatively per completed module", constraints: ">= 1" }

  - name: QuestionItem
    parent: null
    common_fields: false
    fields:
      - { name: license_program_id, type: string, source: input, description: "FK -> LicenseProgram.id; program this item belongs to" }
      - { name: domain_code, type: string, source: input, description: "Blueprint domain this item maps to; MUST be one of the program's domain_weights domain_code values" }
      - { name: difficulty, type: enum, source: input, description: "EASY | MEDIUM | HARD adaptive difficulty band", constraints: "EASY|MEDIUM|HARD" }
      - { name: correct_choice, type: string, source: input, description: "The key/correct answer label; immutable content (entity has no version)" }

  - name: Cohort
    parent: null
    common_fields: true
    fields:
      - { name: license_program_id, type: string, source: input, description: "FK -> LicenseProgram.id; program the live-review cohort serves" }
      - { name: title, type: string, source: input, description: "Cohort name" }
      - { name: capacity, type: integer, source: input, description: "Maximum confirmed memberships", constraints: ">= 1" }
      - { name: seats_taken, type: integer, source: computed, description: "Count of CohortMemberships in status JOINED on this cohort", default: 0 }
      - { name: status, type: enum, source: system, description: "OPEN | FULL | CLOSED — FULL is derived (seats_taken >= capacity); CLOSED rejects joins", default: OPEN, constraints: "OPEN|FULL|CLOSED" }

  - name: CohortSession
    parent: Cohort
    common_fields: true
    fields:
      - { name: cohort_id, type: string, source: system, description: "FK -> Cohort.id; the live-review cohort this session belongs to" }
      - { name: topic, type: string, source: input, description: "Session topic/title" }
      - { name: session_start_utc, type: datetime, source: input, description: "Session start (inclusive)" }
      - { name: session_end_utc, type: datetime, source: input, description: "Session end (inclusive); MUST be strictly after session_start_utc" }

  # ---------- Aggregate root ----------
  - name: Learner
    parent: null
    common_fields: true
    fields:
      - { name: email, type: string, source: input, description: "Learner login email", constraints: "unique among Learners" }
      - { name: full_name, type: string, source: input, description: "Learner full name" }

  - name: Enrollment
    parent: null
    common_fields: true
    fields:
      - { name: learner_id, type: string, source: input, description: "FK -> Learner.id; the enrolled learner" }
      - { name: license_program_id, type: string, source: input, description: "FK -> LicenseProgram.id; program enrolled in" }
      - { name: subscription_plan_id, type: string, source: input, description: "FK -> SubscriptionPlan.id; plan purchased at enrollment time" }
      - { name: ce_bundle_id, type: string, source: input, description: "FK -> CEBundle.id; CE package linked when plan.includes_ce, else null", default: null }
      - { name: financed, type: boolean, source: input, description: "Whether the plan was financed (installments) vs paid in full", default: false }
      - { name: financing_total_due_cents, type: integer, source: computed, description: "Total amount the learner is obligated to pay (= plan.total_price_cents)", default: 0 }
      - { name: financing_paid_cents, type: integer, source: computed, description: "Sum of Installment.amount_cents for installments in status PAID", default: 0 }
      - { name: financing_balance_cents, type: integer, source: computed, description: "= financing_total_due_cents - financing_paid_cents (>= 0)", default: 0 }
      - { name: questions_answered_total, type: integer, source: computed, description: "Cumulative count of items answered across all completed PracticeSessions", default: 0 }
      - { name: completed_mock_count, type: integer, source: computed, description: "Count of MockExams in status COMPLETED under this enrollment", default: 0 }
      - { name: readiness_score, type: integer, source: computed, description: "CONSERVATIVE readiness 0..100; the gating score used for pass-guarantee eligibility (see calc readiness_score)", default: 0 }
      - { name: projected_readiness_score, type: integer, source: computed, description: "PROJECTED readiness 0..100 (optimistic variant, all-mock average)", default: 0 }
      - { name: exam_outcome, type: enum, source: system, description: "PENDING | PASS | FAIL — certified by ExamProctor", default: PENDING, constraints: "PENDING|PASS|FAIL" }
      - { name: guarantee_eligible, type: boolean, source: computed, description: "Snapshot at FAIL certification: whether activity + readiness thresholds were met within the active window", default: false }
      - { name: status, type: enum, source: system, description: "DRAFT | ACTIVE | PASSED | FAILED | REFUNDED | WITHDRAWN", default: DRAFT, constraints: "DRAFT|ACTIVE|PASSED|FAILED|REFUNDED|WITHDRAWN" }

  - name: Installment
    parent: Enrollment
    common_fields: true
    fields:
      - { name: enrollment_id, type: string, source: system, description: "FK -> Enrollment.id; owning enrollment" }
      - { name: sequence_no, type: integer, source: system, description: "1-based ordinal of this installment in the financing schedule" }
      - { name: amount_cents, type: integer, source: system, description: "Scheduled amount for this installment (last installment absorbs the rounding remainder)" }
      - { name: status, type: enum, source: system, description: "DUE | PAID | VOID", default: DUE, constraints: "DUE|PAID|VOID" }

  - name: StudyPlanDomain
    parent: Enrollment
    common_fields: true
    fields:
      - { name: enrollment_id, type: string, source: system, description: "FK -> Enrollment.id; owning enrollment" }
      - { name: domain_code, type: string, source: system, description: "Blueprint domain code copied from LicenseProgram.domain_weights at enrollment activation" }
      - { name: weight, type: number, source: system, description: "Blueprint weight copied from LicenseProgram.domain_weights (two decimals)" }
      - { name: mastery, type: integer, source: computed, description: "EWMA mastery 0..100 over completed practice batches in this domain (see calc domain_mastery_update)", default: 50 }

  - name: PracticeSession
    parent: Enrollment
    common_fields: true
    fields:
      - { name: enrollment_id, type: string, source: system, description: "FK -> Enrollment.id; owning enrollment" }
      - { name: domain_code, type: string, source: input, description: "Domain the adaptive batch targets; MUST match a StudyPlanDomain of the enrollment" }
      - { name: answered_count, type: integer, source: input, description: "Number of items answered in this batch", constraints: ">= 0" }
      - { name: correct_count, type: integer, source: input, description: "Number answered correctly", constraints: "0 <= correct_count <= answered_count" }
      - { name: batch_pct, type: integer, source: computed, description: "round_half_up(100 * correct_count / answered_count); undefined when answered_count == 0", default: 0 }
      - { name: status, type: enum, source: system, description: "COMPLETED — a session is created already completed (single scoring event)", default: COMPLETED, constraints: "COMPLETED" }

  - name: MockExam
    parent: Enrollment
    common_fields: true
    fields:
      - { name: enrollment_id, type: string, source: system, description: "FK -> Enrollment.id; owning enrollment" }
      - { name: raw_score, type: integer, source: input, description: "Raw items correct on the mock", constraints: ">= 0" }
      - { name: item_count, type: integer, source: input, description: "Items on the mock", constraints: ">= 1" }
      - { name: scaled_score, type: integer, source: computed, description: "round_half_up(100 * raw_score / item_count) scaled 0..100", default: 0 }
      - { name: is_overage, type: boolean, source: computed, description: "True when this attempt exceeds the plan's included_mock_credits (incurs overage)", default: false }
      - { name: completed_at, type: datetime, source: system, description: "Logical-clock time at which the mock was scored; used to pick the latest mock" }
      - { name: status, type: enum, source: system, description: "COMPLETED — created already scored", default: COMPLETED, constraints: "COMPLETED" }

  - name: PassGuaranteeClaim
    parent: Enrollment
    common_fields: true
    fields:
      - { name: enrollment_id, type: string, source: input, description: "FK -> Enrollment.id; the failed enrollment being claimed against" }
      - { name: remedy, type: enum, source: input, description: "RETAKE_EXTENSION | MONEY_BACK requested remedy", constraints: "RETAKE_EXTENSION|MONEY_BACK" }
      - { name: refund_amount_cents, type: integer, source: computed, description: "Computed money-back refund (0 for RETAKE_EXTENSION); per-installment proration of paid amounts", default: 0 }
      - { name: status, type: enum, source: system, description: "SUBMITTED | APPROVED | DENIED", default: SUBMITTED, constraints: "SUBMITTED|APPROVED|DENIED" }

  - name: CECreditAward
    parent: Enrollment
    common_fields: true
    fields:
      - { name: enrollment_id, type: string, source: system, description: "FK -> Enrollment.id; owning enrollment" }
      - { name: ce_bundle_id, type: string, source: system, description: "FK -> CEBundle.id; bundle the award draws from" }
      - { name: modules_completed, type: integer, source: input, description: "Cumulative module count claimed complete at this award", constraints: "1 <= modules_completed <= bundle.modules_total; strictly greater than the prior award's modules_completed" }
      - { name: credits_awarded, type: integer, source: computed, description: "Delta credits granted by this award = cum(modules_completed) - cum(prior_modules_completed)", default: 0 }
      - { name: cumulative_credits, type: integer, source: computed, description: "round_half_up(bundle.ce_credits_total * modules_completed / bundle.modules_total)", default: 0 }

  - name: CohortMembership
    parent: null
    common_fields: true
    fields:
      - { name: cohort_id, type: string, source: input, description: "FK -> Cohort.id; the live-review cohort" }
      - { name: enrollment_id, type: string, source: input, description: "FK -> Enrollment.id; the member enrollment" }
      - { name: status, type: enum, source: system, description: "JOINED | DROPPED", default: JOINED, constraints: "JOINED|DROPPED" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: LicenseProgram
    initial_state: DRAFT
    terminal_states: [RETIRED]
    transitions:
      - from: DRAFT
        to: PUBLISHED
        trigger: "POST /license-programs/{id}/publish"
        actor: ContentAdmin
        preconditions:
          - "domain_weights non-empty and sum(weight) == 1.00 (ERR_BLUEPRINT_WEIGHTS_INVALID)"
          - "at least one QuestionItem exists for the program (ERR_PROGRAM_HAS_NO_ITEMS)"
        side_effects:
          - "status := PUBLISHED"
          - "increments LicenseProgram.version by 1"
      - from: PUBLISHED
        to: RETIRED
        trigger: "POST /license-programs/{id}/retire"
        actor: ContentAdmin
        preconditions:
          - "no Enrollment referencing this program is in status ACTIVE (ERR_PROGRAM_HAS_ACTIVE_ENROLLMENTS)"
        side_effects:
          - "status := RETIRED"
          - "increments LicenseProgram.version by 1"

  - entity: Enrollment
    initial_state: DRAFT
    terminal_states: [PASSED, REFUNDED, WITHDRAWN]
    transitions:
      - from: DRAFT
        to: ACTIVE
        trigger: "POST /enrollments/{id}/activate"
        actor: Learner
        preconditions:
          - "referenced LicenseProgram.status == PUBLISHED (ERR_PROGRAM_NOT_PUBLISHED)"
          - "referenced SubscriptionPlan.status == ACTIVE (ERR_PLAN_ARCHIVED)"
          - "if financed: the down-payment Installment (sequence_no 1) is PAID (ERR_DOWN_PAYMENT_UNPAID)"
        side_effects:
          - "materialize one StudyPlanDomain per LicenseProgram.domain_weights entry (mastery := 50, weight copied)"
          - "financing_total_due_cents := plan.total_price_cents"
          - "recompute readiness_score and projected_readiness_score (calc readiness_score)"
          - "status := ACTIVE"
          - "increments Enrollment.version by 1"
      - from: ACTIVE
        to: PASSED
        trigger: "POST /enrollments/{id}/certify-exam (outcome=PASS)"
        actor: ExamProctor
        preconditions:
          - "exam_outcome == PENDING (ERR_EXAM_ALREADY_CERTIFIED)"
          - "financing_balance_cents == 0 (ERR_BALANCE_OUTSTANDING)"
        side_effects:
          - "exam_outcome := PASS"
          - "status := PASSED"
          - "all CohortMemberships of this enrollment in JOINED → DROPPED (cohort.seats_taken decremented; cohort recompute) [cascade hop 1]"
          - "increments Enrollment.version by 1"
      - from: ACTIVE
        to: FAILED
        trigger: "POST /enrollments/{id}/certify-exam (outcome=FAIL)"
        actor: ExamProctor
        preconditions:
          - "exam_outcome == PENDING (ERR_EXAM_ALREADY_CERTIFIED)"
        side_effects:
          - "exam_outcome := FAIL"
          - "guarantee_eligible := snapshot of pass_guarantee_eligibility (calc) at this instant"
          - "status := FAILED"
          - "increments Enrollment.version by 1"
        note: "FAILED is non-terminal — a PassGuaranteeClaim may be filed from FAILED."
      - from: FAILED
        to: REFUNDED
        trigger: "system: PassGuaranteeClaim APPROVED with remedy MONEY_BACK"
        actor: system
        preconditions:
          - "an approved MONEY_BACK PassGuaranteeClaim exists for this enrollment"
        side_effects:
          - "financing_balance_cents → 0 by voiding all DUE Installments (status := VOID) [cascade hop 2 from claim approval]"
          - "all JOINED CohortMemberships of this enrollment → DROPPED (cohort.seats_taken decremented; cohort recompute) [cascade hop 3]"
          - "status := REFUNDED"
          - "increments Enrollment.version by 1"
      - from: DRAFT
        to: WITHDRAWN
        trigger: "POST /enrollments/{id}/withdraw"
        actor: Learner
        preconditions: []
        side_effects:
          - "all DUE Installments → VOID"
          - "status := WITHDRAWN"
          - "increments Enrollment.version by 1"
      - from: ACTIVE
        to: WITHDRAWN
        trigger: "POST /enrollments/{id}/withdraw"
        actor: Learner
        preconditions:
          - "exam_outcome == PENDING (ERR_EXAM_ALREADY_CERTIFIED)"
        side_effects:
          - "all DUE Installments → VOID"
          - "all JOINED CohortMemberships of this enrollment → DROPPED (cohort.seats_taken decremented; cohort recompute)"
          - "status := WITHDRAWN"
          - "increments Enrollment.version by 1"

  - entity: PassGuaranteeClaim
    initial_state: SUBMITTED
    terminal_states: [APPROVED, DENIED]
    transitions:
      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /pass-guarantee-claims/{id}/decide (decision=APPROVE)"
        actor: ExamProctor
        preconditions:
          - "owning Enrollment.status == FAILED (ERR_INVALID_STATE)"
          - "owning Enrollment.guarantee_eligible == true (ERR_GUARANTEE_NOT_ELIGIBLE)"
        side_effects:
          - "status := APPROVED"
          - "if remedy == MONEY_BACK: compute refund_amount_cents (calc guarantee_refund); drive owning Enrollment FAILED→REFUNDED [cascade origin]"
          - "if remedy == RETAKE_EXTENSION: refund_amount_cents := 0; enrollment stays FAILED (retake window extended)"
          - "increments PassGuaranteeClaim.version by 1"
      - from: SUBMITTED
        to: DENIED
        trigger: "POST /pass-guarantee-claims/{id}/decide (decision=DENY)"
        actor: ExamProctor
        preconditions:
          - "owning Enrollment.status == FAILED (ERR_INVALID_STATE)"
        side_effects:
          - "status := DENIED"
          - "increments PassGuaranteeClaim.version by 1"

  - entity: Installment
    initial_state: DUE
    terminal_states: [PAID, VOID]
    transitions:
      - from: DUE
        to: PAID
        trigger: "POST /enrollments/{eid}/installments/{id}/pay"
        actor: Learner
        preconditions:
          - "owning Enrollment.status in {DRAFT, ACTIVE} (ERR_INVALID_STATE)"
        side_effects:
          - "status := PAID"
          - "recompute Enrollment.financing_paid_cents and financing_balance_cents (calc financing_ledger)"
          - "increments Installment.version by 1"

  - entity: Cohort
    initial_state: OPEN
    terminal_states: [CLOSED]
    transitions:
      - from: OPEN
        to: FULL
        trigger: "system: a CohortMembership JOIN makes seats_taken == capacity"
        actor: system
        preconditions:
          - "seats_taken == capacity after the join"
        side_effects:
          - "status := FULL"
      - from: FULL
        to: OPEN
        trigger: "system: a CohortMembership DROP makes seats_taken < capacity"
        actor: system
        preconditions:
          - "seats_taken < capacity after the drop"
        side_effects:
          - "status := OPEN"
      - from: OPEN
        to: CLOSED
        trigger: "POST /cohorts/{id}/close"
        actor: ContentAdmin
        preconditions: []
        side_effects:
          - "status := CLOSED (rejects new joins)"

  - entity: CohortMembership
    initial_state: JOINED
    terminal_states: [DROPPED]
    transitions:
      - from: JOINED
        to: DROPPED
        trigger: "DELETE /cohorts/{cid}/memberships/{id}  (or cascaded from enrollment terminal transition)"
        actor: Learner
        preconditions: []
        side_effects:
          - "cohort.seats_taken decremented; cohort recompute (FULL→OPEN if seats_taken < capacity)"
          - "status := DROPPED"
          - "increments CohortMembership.version by 1"

# -----------------------------------------------------------------------------
# §1.2.1 Concurrency Rules
# -----------------------------------------------------------------------------
concurrency_rules:
  - rule_id: financing-restructure-stale-enrollment
    parent_entity: Enrollment
    write_endpoint: "POST /enrollments/{id}/restructure-financing"
    occ_field: "expected_enrollment_version"
    description: |
      Restructuring an enrollment's financing schedule rebuilds its Installment
      set, superseding the prior schedule. A restructure carrying an enrollment
      version older than the enrollment's current version is rejected: the prior
      writer already rebuilt the schedule (and bumped the version), so this
      writer's view of the schedule it intends to replace is stale.
    error_id: ERR_STALE_ENROLLMENT_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: financing_schedule
    trigger: "POST /enrollments (when financed=true) and POST /enrollments/{id}/restructure-financing"
    algorithm: waterfall_allocation
    formula: |
      down = round_half_up(plan.total_price_cents * plan.down_payment_pct)
      financed_remainder = plan.total_price_cents - down
      n = plan.financing_months
      base = floor(financed_remainder / n)           # integer cents
      remainder = financed_remainder - base * n
      # Schedule (interest-free): sequence_no 1 carries the down payment,
      # sequence_no 2..n+1 each carry `base`, and the LAST installment
      # (sequence_no n+1) additionally absorbs `remainder`.
      Installment[1].amount_cents = down                       # down payment
      for k in 2..n:   Installment[k].amount_cents = base
      Installment[n+1].amount_cents = base + remainder         # last absorbs remainder
      financing_total_due_cents = plan.total_price_cents
    input_set: "plan.total_price_cents, plan.down_payment_pct, plan.financing_months for the enrollment's SubscriptionPlan"
    constants: {}
    precision: "integer cents; round_half_up on the down payment only; remainder folded into the last installment so sum == total_price_cents exactly"
    variants:
      - name: paid_in_full
        when: "enrollment.financed == false"
        difference: "single Installment sequence_no 1 of amount_cents == total_price_cents, no remainder split"

  - name: financing_ledger
    trigger: "Installment DUE→PAID, DUE→VOID, and enrollment terminal cascades"
    algorithm: aggregation
    formula: |
      financing_paid_cents = sum(Installment.amount_cents WHERE status == PAID)
      financing_balance_cents = financing_total_due_cents - financing_paid_cents
      # VOID installments contribute to neither sum.
    input_set: "Installments under the enrollment, filtered by status"
    constants: {}
    precision: "integer cents; balance floored at 0"

  - name: readiness_score
    trigger: "Enrollment activation, PracticeSession completion, MockExam completion"
    algorithm: weighted_scoring
    formula: |
      weighted_domain_mastery = sum(d.weight * d.mastery for d in StudyPlanDomain of enrollment)
      # CONSERVATIVE variant (the gating readiness_score):
      latest_mock_score = scaled_score of the MockExam with the greatest completed_at
                          (tie-break: created_at ASC, then sequence of creation);
                          0 when no COMPLETED mock exists
      readiness_score = round_half_up(0.60 * weighted_domain_mastery + 0.40 * latest_mock_score)
      # PROJECTED variant (optimistic):
      avg_mock_score = round_half_up(mean(scaled_score over ALL COMPLETED mocks)) ; 0 if none
      projected_readiness_score = round_half_up(0.60 * weighted_domain_mastery + 0.40 * avg_mock_score)
    input_set: "StudyPlanDomain rows (all), MockExams in status COMPLETED"
    constants: { DOMAIN_WEIGHT_COEFF: 0.60, MOCK_WEIGHT_COEFF: 0.40 }
    precision: "round_half_up to integer at the final step of each variant; mean rounded before blending in PROJECTED"
    variants:
      - name: conservative
        when: "gating decisions (pass-guarantee eligibility, readiness display)"
        difference: "uses ONLY the single latest mock's scaled_score for the mock component"
      - name: projected
        when: "forward-looking analytics view"
        difference: "uses the average of ALL completed mocks for the mock component → diverges from conservative whenever the latest mock differs from the mean"

  - name: domain_mastery_update
    trigger: "PracticeSession completion (POST /enrollments/{id}/practice-sessions)"
    algorithm: decay_function
    formula: |
      reject if answered_count == 0  (ERR_EMPTY_SESSION)
      batch_pct = round_half_up(100 * correct_count / answered_count)
      old = StudyPlanDomain.mastery for the session's domain_code
      new_mastery = round_half_up(ALPHA * batch_pct + (1 - ALPHA) * old)
      StudyPlanDomain.mastery := clamp(new_mastery, 0, 100)
    input_set: "the single StudyPlanDomain matching the session's domain_code"
    constants: { ALPHA: 0.40 }
    precision: "round_half_up to integer; EWMA so order of sessions matters"

  - name: pass_guarantee_eligibility
    trigger: "evaluated on Enrollment ACTIVE→FAILED to snapshot guarantee_eligible, and as a precondition on claim APPROVE"
    algorithm: threshold
    formula: |
      eligible = plan.pass_guarantee == true
                 AND questions_answered_total >= MIN_QUESTIONS
                 AND completed_mock_count >= MIN_MOCKS
                 AND readiness_score >= READINESS_THRESHOLD     # conservative variant, >= (inclusive)
      # questions_answered_total = sum(PracticeSession.answered_count over COMPLETED sessions)
    input_set: "enrollment computed counters + plan.pass_guarantee"
    constants: { MIN_QUESTIONS: 200, MIN_MOCKS: 2, READINESS_THRESHOLD: 75 }
    precision: "integer comparisons; READINESS_THRESHOLD boundary is inclusive (75 qualifies, 74 does not)"

  - name: guarantee_refund
    trigger: "PassGuaranteeClaim SUBMITTED→APPROVED when remedy == MONEY_BACK"
    algorithm: aggregation
    formula: |
      paid = [Installment.amount_cents for Installment in PAID status, ordered by sequence_no ASC]
      # ROUNDING ORDER PINNED: round per-installment THEN sum (NOT sum-then-round).
      refund_amount_cents = sum( round_half_up(amount_cents * plan.guarantee_refund_pct) for amount_cents in paid )
    input_set: "Installments of the enrollment in status PAID"
    constants: {}
    precision: "round_half_up per installment first, then sum the per-installment refunds (order is observable when amounts produce .5 cents)"

  - name: ce_credit_accrual
    trigger: "POST /enrollments/{id}/ce-awards"
    algorithm: waterfall_allocation
    formula: |
      cumulative_credits = round_half_up(bundle.ce_credits_total * modules_completed / bundle.modules_total)
      prior_cumulative = cumulative_credits of the most recent prior CECreditAward (by modules_completed), or 0
      credits_awarded = cumulative_credits - prior_cumulative
      # Conserved-quantity invariant: when modules_completed reaches modules_total,
      # sum of all credits_awarded == bundle.ce_credits_total exactly.
    input_set: "bundle totals + prior CECreditAwards of this enrollment"
    constants: {}
    precision: "round_half_up on cumulative; deltas derived so total conserves to ce_credits_total"

  - name: membership_window_overlap
    trigger: "POST /cohorts/{id}/memberships"
    algorithm: interval_merge
    formula: |
      # HALF-OPEN semantics [start, end). Two windows W1=[s1,e1), W2=[s2,e2)
      # overlap iff s1 < e2 AND s2 < e1. Abutting (e1 == s2) does NOT overlap.
      # Checked against every OTHER JOINED CohortMembership of the SAME enrollment
      # (across all cohorts).
      reject (ERR_SESSION_WINDOW_CONFLICT) if any existing JOINED membership window
      W_existing satisfies: new_start < W_existing.end AND W_existing.start < new_end
    input_set: "JOINED CohortMemberships of the same enrollment"
    constants: {}
    precision: "datetime comparison; half-open — equality at the boundary is NOT an overlap"

  - name: session_buffer_overlap
    trigger: "POST /cohorts/{id}/sessions"
    algorithm: interval_merge
    formula: |
      # CLOSED semantics [start, end] PLUS a symmetric buffer. For an existing
      # session E=[es, ee] and new session N=[ns, ne], require a gap of at least
      # SESSION_BUFFER_MINUTES on whichever side is adjacent:
      #   if ns >= ee: gap = ns - ee   (new after existing)
      #   if ne <= es: gap = es - ne   (new before existing)
      #   else: gap = -1 (windows themselves overlap)
      # reject (ERR_SESSION_BUFFER_CONFLICT) if gap < SESSION_BUFFER_MINUTES minutes.
      # A gap of EXACTLY 30 minutes is allowed (>=).
      checked against every OTHER CohortSession of the SAME cohort.
    input_set: "all other CohortSessions of the same cohort"
    constants: { SESSION_BUFFER_MINUTES: 30 }
    precision: "minute-granular datetime; boundary gap == 30 min is allowed (>=), gap < 30 rejected"

  - name: mock_overage
    trigger: "POST /enrollments/{id}/mock-exams"
    algorithm: threshold
    formula: |
      prior_completed = count(MockExam in COMPLETED for enrollment) BEFORE this attempt
      is_overage = (prior_completed >= plan.included_mock_credits)   # >= : the (credits+1)-th attempt is the first overage
    input_set: "count of prior COMPLETED MockExams + plan.included_mock_credits"
    constants: {}
    precision: "integer count; boundary >= (with included_mock_credits == N, attempts 1..N are included, attempt N+1 is the first overage)"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present and well-formed"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all

  - priority: 2
    category: auth
    check: "Acting role is permitted for this endpoint per §1.7 RBAC"
    error_id: ERR_FORBIDDEN_ROLE
    http_status: 403
    applies_to: all

  - priority: 3
    category: existence
    check: "All path/body referenced resources exist, validated left-to-right in the path"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: all

  - priority: 4
    category: auth
    check: "For Learner entity_backed actions, X-User-ID equals the owning Enrollment.learner_id (or Learner.id)"
    error_id: ERR_NOT_RESOURCE_OWNER
    http_status: 403
    applies_to: "Learner-scoped enrollment/installment/practice/mock/cohort-membership actions"

  - priority: 5
    category: business_constraint
    check: "Request body well-formed: required fields present, enums valid, numeric ranges respected"
    error_id: ERR_INVALID_REQUEST
    http_status: 422
    applies_to: all

  - priority: 6
    category: state
    check: "OCC: expected_enrollment_version matches Enrollment.version on restructure-financing"
    error_id: ERR_STALE_ENROLLMENT_VERSION
    http_status: 412
    applies_to: "POST /enrollments/{id}/restructure-financing"

  - priority: 7
    category: state
    check: "Target resource is in a valid state for the requested transition"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all transition endpoints"

  - priority: 8
    category: business_referential
    check: "Cross-entity reference compatibility (CEBundle.license_program_id matches enrollment program; QuestionItem.domain_code in program blueprint; PracticeSession.domain_code is a StudyPlanDomain of the enrollment; Cohort.license_program_id matches enrollment program)"
    error_id: ERR_REFERENCE_INCOMPATIBLE
    http_status: 409
    applies_to: "POST /enrollments, POST /enrollments/{id}/practice-sessions, POST /cohorts/{id}/memberships, POST /license-programs/{id}/items"

  - priority: 9
    category: business_temporal
    check: "Cohort membership session window must not overlap an existing JOINED membership window for the same enrollment (interval semantics: HALF-OPEN [start,end); abutting windows where end == next start are allowed)"
    error_id: ERR_SESSION_WINDOW_CONFLICT
    http_status: 409
    applies_to: "POST /cohorts/{id}/memberships"

  - priority: 9.5
    category: business_temporal
    check: "A new CohortSession must keep a gap of >= SESSION_BUFFER_MINUTES (30) from every existing session of the SAME cohort (interval semantics: CLOSED [start,end] plus a 30-minute buffer on both sides; gap of exactly 30 minutes is allowed)"
    error_id: ERR_SESSION_BUFFER_CONFLICT
    http_status: 409
    applies_to: "POST /cohorts/{id}/sessions"

  - priority: 10
    category: business_safety
    check: "Pass-guarantee eligibility thresholds (activity + readiness) must be met to APPROVE a claim"
    error_id: ERR_GUARANTEE_NOT_ELIGIBLE
    http_status: 409
    applies_to: "POST /pass-guarantee-claims/{id}/decide"

  - priority: 11
    category: business_fiscal
    check: "Enrollment cannot be certified PASS while financing_balance_cents > 0"
    error_id: ERR_BALANCE_OUTSTANDING
    http_status: 409
    applies_to: "POST /enrollments/{id}/certify-exam"

  - priority: 12
    category: business_constraint
    check: "Cohort capacity: a JOIN is rejected when seats_taken >= capacity or cohort status == CLOSED"
    error_id: ERR_COHORT_FULL
    http_status: 409
    applies_to: "POST /cohorts/{id}/memberships"

  - priority: 13
    category: business_constraint
    check: "PracticeSession with answered_count == 0 is rejected (empty batch has no defined batch_pct)"
    error_id: ERR_EMPTY_SESSION
    http_status: 422
    applies_to: "POST /enrollments/{id}/practice-sessions"

  - priority: 14
    category: business_constraint
    check: "CECreditAward.modules_completed must strictly exceed prior award's modules_completed and not exceed bundle.modules_total"
    error_id: ERR_CE_MODULE_REGRESSION
    http_status: 409
    applies_to: "POST /enrollments/{id}/ce-awards"

