            - "BladeDamage.${bd_id}.recorded_by_user == rel-1, the field the rule compares against"
            - "the prioritization by rel-2 returns 200 and BladeDamage.${bd_id}.state == PRIORITIZED with a non-null severity_score and repair_priority_band"
      - name: shared_operations_work_for_every_role_that_declares_them
        claim_type: shared_operation_allowed
