              as_user_id: "${g}"
              captures: { req: $.data.id }
            - call: "POST /exchange-requests/${req}/accept"
              payload: { availability_window_id: "${win}", expected_listing_version: "${lst_v}" }
              as: Member
              as_user_id: "${h}"
              captures: { agr: $.data.id }
          trigger:
            - call: "POST /exchange-agreements/${agr}/cancel"
              payload: {}
              as: Member
              as_user_id: "${g}"
          assert:
            - "ExchangeAgreement.${agr}.status == CANCELLED"
            - "AvailabilityWindow.${win}.status == OPEN"
            - "AvailabilityWindow.${win}.nights == 2"
