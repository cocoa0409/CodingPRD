          rationale: "The named §1.8 instance reconciles open_hold_count, active_schedule_count and auto_reorder_enabled before and after the sweep."
  - section: calculations
    instances:
      - name: order_total_applies_standard_shipping_below_the_free_threshold
        claim_type: correct_result
        grounds:
          - calculations.order_total_cents
        distinguishing_aspect: "A single 3200-cent box gives subtotal_cents 3200, which is below FREE_SHIPPING_THRESHOLD_CENTS 5000, so shipping_cents is 695 and total_cents is 3895 — the ledger records 3895, not 3200."
