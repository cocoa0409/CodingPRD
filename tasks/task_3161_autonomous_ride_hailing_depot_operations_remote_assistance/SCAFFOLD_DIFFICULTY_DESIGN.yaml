  - rule_id: compensating_invariant
    instances:
      - name: if_match_cycle_abort_preserves_readiness_invariant
        grounds:
          - state_machines.DepotCycle.transitions.IN_PROGRESS_to_ABORTED
          - calculations.vehicle_service_status
          - entities.Vehicle.fields.service_status
        distinguishing_aspect: "The conserved quantity is the vehicle's readiness tuple: a CLEAN cycle started and then aborted leaves battery_pct, cleanliness_score, calib_valid, software_version and therefore service_status exactly as they were, so the aborted cycle's compensating action produces zero drift."
        test_recipe:
          setup:
            - "Logical clock at 2026-06-01T00:00:00Z. Territory ACTIVE, Depot M with one charge bay and one cleaning bay, vehicle V1 (battery_pct 50, cleanliness_score 40, calib_valid false, software_version sw-2026.0, target sw-2026.1) staged at Depot M, and a completed CHARGE cycle that already raised its battery_pct to 100."
