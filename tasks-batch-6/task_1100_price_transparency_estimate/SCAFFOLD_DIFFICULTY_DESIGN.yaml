              as: PatientUser
              as_user_id: "${pat_id}"
              captures: { disp_id: $.data.id }
            - call: "POST /disputes/${disp_id}/assign"
              payload: {}
              as: ProviderStaff
          trigger:
            - call: "POST /disputes/${disp_id}/resolve"
              payload: { resolution: "ADJUSTED", adjusted_patient_responsibility_cents: 90000, resolution_note: "Reduced per goodwill" }
              as: ProviderStaff
          assert:
            - "pp_before == 77500"
            - "Estimate.${est_id}.patient_responsibility_cents == 90000"
            - "Estimate.${est_id}.plan_paid_cents == 110000"
            - "Estimate.${est_id}.allowed_amount_cents == 200000"
