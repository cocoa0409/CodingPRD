            - "after trigger[0]: DataChallenge.${ch_id}.status == UNDER_REVIEW"
            - "after trigger[0]: Violation.${v1_id}.status == ACTIVE"
            - "after trigger[0]: Violation.${v1_id}.out_of_service == true"
            - "after trigger[0]: Violation.${v1_id}.time_weighted_severity == 18.0"
            - "after trigger[3]: CitationAdjudication.${adj_id}.court_status == NOT_GUILTY"
            - "after trigger[3]: CitationAdjudication.${adj_id}.superseded == false"
            - "trigger[4] -> 200; DataChallenge.${ch_id}.status == RESOLVED_ACCEPTED"
            - "after trigger[4]: DataChallenge.${ch_id}.resolution_disposition == VIOLATION_REMOVED"
            - "after trigger[4]: Violation.${v1_id}.status == REMOVED"
            - "after trigger[4]: Violation.${v1_id}.under_challenge == false"
            - "after trigger[4]: BasicScore(carrier_id=${c1_id}, basic_category=VEHICLE_MAINTENANCE).total_time_weighted_severity == 0.0"
            - "after trigger[4]: Carrier.${c1_id}.oos_violation_count_24mo == 0"

