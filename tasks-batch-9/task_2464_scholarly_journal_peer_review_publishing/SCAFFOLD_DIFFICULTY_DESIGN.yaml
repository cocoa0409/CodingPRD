  - rule_id: resource_temporal_overlap
    instances:
      - name: reviewer_half_open_window_aggregate_capacity_and_adjacency
        grounds:
          - calculations.reviewer_window_occupancy
          - validations[priority=22]
          - entities.Journal.fields.reviewer_concurrent_window_limit
          - entities.ReviewInvitation.fields.invited_at
          - entities.ReviewInvitation.fields.due_at
          - errors[ERR_REVIEWER_WINDOW_CAPACITY]
        distinguishing_aspect: |
          Resource = Reviewer capacity, interval semantics = HALF-OPEN [invited_at, due_at) with
          AGGREGATE capacity reviewer_concurrent_window_limit: a second invitation whose window
          strictly overlaps the reviewer's open window is rejected with
          ERR_REVIEWER_WINDOW_CAPACITY, while the window that starts exactly at the open
          invitation's due_at (2026-08-22T00:00:00Z) is accepted because touching half-open
          intervals do not overlap.
        test_recipe:
