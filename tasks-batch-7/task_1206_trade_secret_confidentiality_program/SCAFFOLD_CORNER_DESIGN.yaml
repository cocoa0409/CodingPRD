              as: HRPartner
              captures: { tr2: $.data.id }
          trigger:
            - call: "GET /api/employees/${emp_id}"
              as: HRPartner
              captures: { tc1: $.data.training_current }
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-20T00:00:00Z" }
