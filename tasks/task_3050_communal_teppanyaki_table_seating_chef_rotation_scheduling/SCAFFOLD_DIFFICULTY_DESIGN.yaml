  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:

      - name: half_open_table_seating_intervals_abut_without_conflict
        grounds:
          - calculations.turn_over_window
          - state_machines.GrillTable.AVAILABLE_to_SEATED
          - state_machines.TableSeating.ACTIVE_to_ACTIVE
          - validations[priority=6]
        distinguishing_aspect: "The interval is HALF-OPEN, [seated_at, expected_vacate_at): a second seating whose seated_at equals the first's expected_vacate_at is accepted, while one a single minute earlier is rejected. The arithmetic treats adjacency as non-conflict on the grill table, and the same table is the resource both interval rules share."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-03T18:55:00Z. A venue whose T4 tier carries a 60-minute standard turn and whose T2 tier carries a 50-minute standard; one T4 table; two chefs; two parties."
          setup_api_calls:
            - *c_clock
            - *c_venue
            - *c_tier6
            - *c_tier4
            - *c_tier2
            - *c_table1
            - *c_table2
            - *c_table3
            - *c_chef1
            - *c_chef2
            - *c_party_plat
            - *c_party_gold
            - call: "POST /service-floor/reservations"
              payload: { venue_id: "${venue_id}", party_id: "${party_gold_id}", tier_id: "${tier4_id}", party_size: 4, scheduled_time: "2026-09-03T18:55:00Z", payment_mode: "CARD_ONLY", celebration: "NONE" }
              as: Host
              captures: { res_q: $.data.id }
            - call: "POST /service-floor/reservations/${res_q}/events"
              payload: { event_type: "SUBMIT" }
              as: Host
            - call: "GET /service-floor/tables/${table2_id}"
              payload: {}
              as: Host
              captures: { t2_v_q: $.data.version }
            - call: "POST /service-floor/reservations/${res_q}/holds"
              payload: { expected_table_version: "${t2_v_q}", table_id: "${table2_id}" }
              as: Host
            - call: "POST /service-floor/reservations/${res_q}/seat"
              payload: {}
              as: Host
              captures: { res_q_v: $.data.version, res_q_seating: $.data.current_seating_id }
            - call: "POST /service-floor/reservations"
              payload: { venue_id: "${venue_id}", party_id: "${party_plat_id}", tier_id: "${tier2_id}", party_size: 2, scheduled_time: "2026-09-03T19:55:00Z", payment_mode: "CARD_ONLY", celebration: "NONE" }
              as: Host
              captures: { res_r: $.data.id }
            - call: "POST /service-floor/reservations/${res_r}/events"
              payload: { event_type: "SUBMIT" }
              as: Host
          trigger:
            - call: "GET /service-floor/seatings/${res_q_seating}"
              payload: {}
              as: Host
              captures: { q_vacate: $.data.expected_vacate_at, q_seated: $.data.seated_at }
            - call: "GET /service-floor/tables/${table2_id}"
              payload: {}
              as: Host
              captures: { t2_v_r: $.data.version }
            - call: "POST /service-floor/reservations/${res_r}/holds"
              payload: { expected_table_version: "${t2_v_r}", table_id: "${table2_id}" }
              as: Host
              captures: { res_r_status: $.data.status, res_r_hold_until: $.data.hold_until }
          assert:
            - "the first seating opened at 18:55 on the 5-minute grid and its expected_vacate_at is 19:55, i.e. seated_at + the T4 standard of 60 minutes"
            - "the interval is half-open [18:55, 19:55): the instant 19:55 itself belongs to the NEXT occupancy, not to this one"
            - "GrillTable.${table2_id}.guests_seated == 4 after the first seating and the table is not yet full, so it stays AVAILABLE with an active occupancy rather than TURNING"
            - "a hold for a second party whose requested window opens at exactly 19:55 is granted: res_r_status == HELD — adjacency is not an overlap under the half-open rule"
            - "the second hold succeeds against the very same GrillTable.${table2_id} while the first TableSeating row is still ACTIVE, which is exactly what the half-open rule permits"
            - "had the second request been 6 guests it would have failed the capacity check instead with ERR_TABLE_OVER_CAPACITY, so the two rejections are distinguishable by error_id alone"
            - "extending the first occupancy by 30 minutes via POST /seatings/${res_q_seating}/extend moves the vacate instant to 20:25, and the second occupancy then sits strictly inside the extended interval rather than abutting it"

      - name: closed_sushi_counter_intervals_touching_at_an_instant_conflict
        grounds:
          - calculations.sushi_plate_dwell
          - validations[priority=27]
          - errors.ERR_SUSHI_PLATE_LATE
          - entities.SushiTicket.fields.requested_at
        distinguishing_aspect: "The interval is CLOSED on both ends — [requested_at, requested_at + PLATE_DWELL_MINUTES] — which is the opposite convention from the grill table, and it sits on a different resource (the single-capacity sushi counter). Two tickets that share exactly one instant conflict here even though the same geometry is legal on a grill table."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-03T19:00:00Z. A venue with tiers, tables, chefs and a GOLD party; the party is seated and carries two sushi tickets fired three minutes apart."
          setup_api_calls:
            - *c_clock
            - *c_venue
            - *c_tier6
            - *c_tier4
            - *c_tier2
            - *c_table1
            - *c_table2
            - *c_table3
            - *c_chef1
            - *c_chef2
            - *c_party_plat
            - *c_party_gold
            - call: "POST /service-floor/reservations"
              payload: { venue_id: "${venue_id}", party_id: "${party_gold_id}", tier_id: "${tier4_id}", party_size: 4, scheduled_time: "2026-09-03T19:00:00Z", payment_mode: "CARD_ONLY", celebration: "NONE" }
              as: Host
              captures: { res_s: $.data.id }
            - call: "POST /service-floor/reservations/${res_s}/events"
              payload: { event_type: "SUBMIT" }
              as: Host
            - call: "GET /service-floor/tables/${table2_id}"
              payload: {}
              as: Host
              captures: { t2_v_s: $.data.version }
            - call: "POST /service-floor/reservations/${res_s}/holds"
              payload: { expected_table_version: "${t2_v_s}", table_id: "${table2_id}" }
              as: Host
            - call: "POST /service-floor/reservations/${res_s}/seat"
              payload: {}
              as: Host
            - call: "POST /service-floor/sushi-tickets"
              payload: { venue_id: "${venue_id}", reservation_id: "${res_s}", item_code: "CALIFORNIA-ROLL", quantity: 2, requested_at: "2026-09-03T19:05:00Z", unit_price_cents: 1600 }
              as: SushiChef
              captures: { ticket_first: $.data.id }
            - call: "POST /service-floor/sushi-tickets/${ticket_first}/events"
              payload: { event_type: "ADVANCE" }
              as: SushiChef
            - call: "POST /service-floor/sushi-tickets/${ticket_first}/events"
              payload: { event_type: "ADVANCE" }
              as: SushiChef
            - call: "POST /service-floor/sushi-tickets"
              payload: { venue_id: "${venue_id}", reservation_id: "${res_s}", item_code: "SALMON-NIGIRI", quantity: 4, requested_at: "2026-09-03T19:10:00Z", unit_price_cents: 1200 }
              as: SushiChef
              captures: { ticket_second: $.data.id }
            - call: "POST /service-floor/sushi-tickets/${ticket_second}/events"
              payload: { event_type: "ADVANCE" }
              as: SushiChef
          trigger:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-03T19:12:00Z" }
              as: PlatformAdmin
            - call: "POST /service-floor/sushi-tickets/${ticket_second}/events"
              payload: { event_type: "ADVANCE" }
              as: SushiChef
              captures: { err_counter: $.data.error_id }
            - call: "POST /service-floor/sushi-tickets/${ticket_first}/events"
              payload: { event_type: "VOID" }
              as: SushiChef
            - call: "GET /service-floor/sushi-tickets/${ticket_second}"
              payload: {}
              as: SushiChef
              captures: { phase_after_void: $.data.prep_phase }
          assert:
            - "the first ticket was plated at 19:05 and occupies the CLOSED interval [19:05, 19:10]"
            - "the second ticket's own interval is [19:10, 19:15], which shares the single instant 19:10 with the first"
            - "on a closed interval a single shared instant IS a conflict: the advance returns 409 with err_counter == ERR_SUSHI_PLATE_LATE"
            - "the grill-table rule would have allowed the same geometry, which is why the two rules differ in interval semantics rather than only in resource"
            - "voiding the first ticket releases the counter and the second ticket can then be advanced"
            - "the second ticket's requested_at is unchanged by the failed advance — a rejected overlap does not consume the plate slot"

  # ===========================================================================
  - rule_id: compensating_invariant
    instances:

      - name: abandon_then_reopen_keeps_venue_party_credit_debt_at_zero
        grounds:
          - state_machines.Reservation.SEATED_to_ABANDONED
          - state_machines.Reservation.ABANDONED_to_HELD
          - state_machines.VenueLedgerEntry.VOIDED_to_POSTED
          - calculations.credit_application
        distinguishing_aspect: "The conserved quantity is a PARTY-LEVEL CREDIT BALANCE, not a venue money total. Abandoning credits the party by the voided surcharge; reopening re-posts the entry and debits the same amount back, so the balance after the round trip equals the balance before it exactly. It is a different conserved quantity type from the settled-cash invariant on the venue."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-02T12:00:00Z. A venue with tiers, three tables and two chefs, a GOLD party, and a venue-wide ventilation service window to abandon through."
          setup_api_calls:
            - *c_clock
            - *c_venue
            - *c_tier6
            - *c_tier4
            - *c_tier2
            - *c_table1
            - *c_table2
            - *c_table3
            - *c_chef1
            - *c_chef2
            - *c_party_plat
            - *c_party_gold
            - call: "POST /service-floor/reservations"
              payload: { venue_id: "${venue_id}", party_id: "${party_gold_id}", tier_id: "${tier4_id}", party_size: 4, scheduled_time: "2026-09-03T19:00:00Z", payment_mode: "CARD_ONLY", celebration: "NONE" }
              as: Host
              captures: { res_t: $.data.id }
            - call: "POST /service-floor/reservations/${res_t}/events"
              payload: { event_type: "SUBMIT" }
              as: Host
            - call: "GET /service-floor/tables/${table2_id}"
              payload: {}
              as: Host
              captures: { t2_v_t: $.data.version }
            - call: "POST /service-floor/reservations/${res_t}/holds"
              payload: { expected_table_version: "${t2_v_t}", table_id: "${table2_id}" }
              as: Host
            - call: "POST /service-floor/reservations/${res_t}/seat"
              payload: {}
              as: Host
            - call: "GET /service-floor/parties/${party_gold_id}"
              payload: {}
              as: Host
              captures: { credit_before_abandon: $.data.loyalty_credit_cents }
            - call: "POST /service-floor/maintenance-windows"
              payload: { venue_id: "${venue_id}", maintenance_kind: "VENTILATION_SERVICE", planned_start_at: "2026-09-03T09:00:00Z", planned_end_at: "2026-09-03T10:00:00Z" }
              as: FloorManager
              captures: { vent_window_d: $.data.id }
            - call: "POST /service-floor/maintenance-windows/${vent_window_d}/accept"
              payload: {}
              as: FloorManager
          trigger:
            - call: "GET /service-floor/parties/${party_gold_id}"
              payload: {}
              as: Host
              captures: { credit_after_abandon: $.data.loyalty_credit_cents }
            - call: "POST /service-floor/maintenance-windows/${vent_window_d}/reopen"
              payload: {}
              as: FloorManager
            - call: "POST /service-floor/reservations/${res_t}/reopen"
              payload: { table_id: "${table2_id}" }
              as: Host
            - call: "GET /service-floor/parties/${party_gold_id}"
              payload: {}
              as: Host
              captures: { credit_after_reopen: $.data.loyalty_credit_cents }
          assert:
            - "the surcharge was 4800, so credit_after_abandon == credit_before_abandon + 4800"
            - "reopening re-posts the same ledger entry and debits the party by its positive amount"
            - "the invariant: credit_after_reopen == credit_before_abandon, i.e. the round trip conserves the party credit balance exactly"
            - "the same round trip leaves Venue.shortfall_turn_debt_minutes at its pre-abandon value: the abandon vacated the seating and the turn-debt recompute on the reopen restores the same closed-row total"
            - "Party.${party_gold_id}.loyalty_credit_cents is never negative at any point in the round trip"
            - "the ledger entry ends at POSTED, not deleted — the compensation is a state change, not a removal"

      - name: run_ops_recompute_leaves_the_restaurant_charge_a_fixed_point
        grounds:
          - calculations.restaurant_charge
          - endpoints.POST_/service-floor/venues/{venue_id}/run_ops
          - entities.Venue.fields.ops_epoch
        distinguishing_aspect: "The conserved quantity is a PER-EPOCH CASH TOTAL across an epoch boundary, a different quantity type from the party credit balance. Because the restaurant charge is recomputed from scratch rather than accumulated, two consecutive ops runs over an unchanged floor produce an identical charge and zero drift, whereas an accumulator would double it."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-02T12:00:00Z. A venue with one T6 table of capacity 6, one T4 of capacity 4 and one T2 of capacity 2 — twelve assignable seats in total — and a GOLD party."
          setup_api_calls:
            - *c_clock
            - *c_venue
            - *c_tier6
            - *c_tier4
            - *c_tier2
            - *c_table1
            - *c_table2
            - *c_table3
            - *c_chef1
            - *c_chef2
            - *c_party_plat
            - *c_party_gold
            - call: "GET /service-floor/venues/${venue_id}/cost-report"
              payload: {}
              as: FloorManager
              captures: { cost_before: $.data.venue_cost_cents, guests_before: $.data.billable_guest_count }
          trigger:
            - call: "POST /service-floor/venues/${venue_id}/run_ops"
              payload: {}
              as: FloorManager
              captures: { epoch_after_first: $.data.ops_epoch }
            - call: "GET /service-floor/venues/${venue_id}/cost-report"
              payload: {}
              as: FloorManager
              captures: { cost_after_first: $.data.venue_cost_cents }
            - call: "POST /service-floor/venues/${venue_id}/run_ops"
              payload: {}
              as: FloorManager
              captures: { epoch_after_second: $.data.ops_epoch }
            - call: "GET /service-floor/venues/${venue_id}/cost-report"
              payload: {}
              as: FloorManager
              captures: { cost_after_second: $.data.venue_cost_cents }
          assert:
            - "guests_before == min(6, 12) + min(4, 12) + min(2, 12) == 12"
            - "each per-table product is 3200 * 240 == 768000 cents and the sum over three tables is 2304000 cents"
            - "cost_after_first == ceil(2304000 / 100) * 100 == 2304000"
            - "the invariant: cost_after_second == cost_after_first == 2304000, so the second epoch introduced exactly zero drift"
            - "epoch_after_first == 1 and epoch_after_second == 2 — the epoch advanced while the money did not"
            - "the charge is recomputed from the current floor rather than accumulated, so an implementation that added the charge again each epoch would report 46200 and fail this assertion"

      - name: window_reopen_four_hop_cascade_back_to_a_serviceable_floor
        grounds:
          - state_machines.MaintenanceWindow.ACTIVE_to_SCHEDULED
          - state_machines.Venue.VENTILATION_HOLD_to_ACTIVE
          - state_machines.GrillTable.MAINTENANCE_to_AVAILABLE
          - endpoints.POST_/service-floor/maintenance-windows/{window_id}/reopen
        distinguishing_aspect: "A third cascade pattern from a fourth triggering transition, and the only one that runs the opposite direction: releasing an active window unfreezes the venue, which releases each table from maintenance, which restores the floor the tables serve. The hops are caused in the reverse order from the accept cascade, so the same graph is walked backwards."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-03T10:30:00Z. A venue already frozen by an accepted ventilation window, with all three tables in maintenance."
          setup_api_calls:
            - *c_clock
            - *c_venue
            - *c_tier6
            - *c_tier4
            - *c_tier2
            - *c_table1
            - *c_table2
            - *c_table3
            - *c_chef1
            - *c_chef2
            - *c_party_plat
            - *c_party_gold
            - call: "POST /service-floor/maintenance-windows"
              payload: { venue_id: "${venue_id}", maintenance_kind: "VENTILATION_SERVICE", planned_start_at: "2026-09-03T09:00:00Z", planned_end_at: "2026-09-03T12:00:00Z" }
              as: FloorManager
              captures: { vent_window_e: $.data.id }
            - call: "POST /service-floor/maintenance-windows/${vent_window_e}/accept"
              payload: {}
              as: FloorManager
          trigger:
            - call: "POST /service-floor/maintenance-windows/${vent_window_e}/reopen"
              payload: {}
              as: FloorManager
          assert:
            - "before the reopen the venue is VENTILATION_HOLD with occupancy_freeze true and all three tables are MAINTENANCE"
            - "hop 1 (this transition): MaintenanceWindow.${vent_window_e}.status == SCHEDULED"
            - "hop 2 (caused by hop 1): GET /venues/${venue_id} reports status == ACTIVE and occupancy_freeze == false"
            - "hop 3 (caused by hop 2): all three tables report status == AVAILABLE with maintenance_resume_at == null"
            - "hop 4 (caused by hop 3): a hold grant that was refused with ERR_VENTILATION_FREEZE while the venue was frozen now returns 200"
            - "the cascade is not idempotent-with-drift: reopening a window that is already SCHEDULED is refused at priority 4 with 409 ERR_INVALID_STATE rather than re-running the chain"

      - name: resume_at_threshold_five_hop_cascade_to_hood_filter_reset
        grounds:
          - state_machines.GrillTable.MAINTENANCE_to_AVAILABLE
          - state_machines.MaintenanceWindow.SCHEDULED_to_COMPLETED
          - state_machines.Venue.VENTILATION_HOLD_to_ACTIVE
          - state_machines.ChefAssignment.ON_STATION_to_CLEARING
        distinguishing_aspect: "A depth-5 chain whose first hop is a clock threshold rather than a state flag: the clock reaching the table's maintenance_resume_at is what starts the chain. Each table passing that threshold drives its own window to COMPLETE, and the completed rebuild is what resets the venue's hood filter life index, which is the precondition the venue's own unfreeze checks."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-04T08:00:00Z. A venue whose ventilation zone has already been serviced once, a T6 table with an accepted grill-rebuild window resuming at 09:00, and a chef on station."
          setup_api_calls:
            - *c_clock
            - *c_venue
            - *c_tier6
            - *c_tier4
            - *c_tier2
            - *c_table1
            - *c_table2
            - *c_table3
            - *c_chef1
            - *c_chef2
            - *c_party_plat
            - *c_party_gold
            - call: "GET /service-floor/venues/${venue_id}"
              payload: {}
              as: Chef
              captures: { v_venue_ev1: $.data.version }
            - call: "POST /service-floor/chefs/${chef1_id}/events"
              payload: { event_type: "CLOCK_IN", expected_venue_version: "${v_venue_ev1}" }
              as: Chef
              as_user_id: "${chef1_id}"
            - call: "GET /service-floor/venues/${venue_id}"
              payload: {}
              as: FloorManager
              captures: { hood_index_before: $.data.hood_filter_life_index }
            - call: "POST /service-floor/maintenance-windows"
              payload: { venue_id: "${venue_id}", table_id: "${table1_id}", maintenance_kind: "GRILL_REBUILD", planned_start_at: "2026-09-04T08:30:00Z", planned_end_at: "2026-09-04T09:00:00Z" }
              as: FloorManager
              captures: { rebuild_f: $.data.id }
            - call: "POST /service-floor/maintenance-windows/${rebuild_f}/accept"
              payload: {}
              as: FloorManager
            - call: "GET /service-floor/maintenance-windows"
              payload: { venue_id: "${venue_id}", table_id: "${table1_id}", status: "SCHEDULED" }
              as: FloorManager
              captures: { cascaded_rebuild: "$.data[0].id" }
          trigger:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-04T09:30:00Z" }
              as: PlatformAdmin
            - call: "POST /service-floor/venues/${venue_id}/run_ops"
              payload: {}
              as: FloorManager
          assert:
            - "before the clock moves, GrillTable.${table1_id}.status == MAINTENANCE and its maintenance_resume_at == 2026-09-04T09:00:00Z"
            - "hop 1 (the threshold): the clock at 09:30 is past resumed_at, so the table is eligible to leave MAINTENANCE"
            - "hop 2 (caused by hop 1): the SCHEDULED cascaded window ${cascaded_rebuild} is driven to COMPLETED"
            - "hop 3 (caused by hop 2): GET /venues/${venue_id} reports hood_filter_life_index == 0, reset by the completed GRILL_REBUILD"
            - "hop 4 (caused by hop 3): with the index at 0 the venue's own unfreeze precondition is satisfied"
            - "hop 5 (caused by hop 4): the ON_STATION chef is driven to CLEARING by the venue exit transition, so ChefAssignment.${chef1_id}.status == CLEARING"
            - "accepting the window had already cascaded a second GRILL_REBUILD window, so the chain has a producer for every link and no hop is synthetic"
