scaffold_corner_design:
  # ===========================================================================
  # Entities (Table 1 claims)
  # ===========================================================================
  - section: entities
    instances:
      - name: program_creation_defaults
        claim_type: creation
        grounds: [entities.Program, state_machines.Program]
        distinguishing_aspect: "A valid POST /api/v1/programs returns 201 with status DRAFT (initial state), seats_taken 0 (computed default), and version 1."
        test_recipe:
          setup: ["one partner agreement exists (DRAFT is acceptable at program-create time)"]
          setup_api_calls:
            - call: "POST /api/v1/partner-agreements"
              payload: { host_institution: "Universite Lyon", country_code: "FR", effective_from: "2026-01-01T00:00:00Z", effective_to: "2028-12-31T23:59:59Z", credit_conversion_factor: 0.75, insurance_required: true }
              as: ProgramCoordinator
              captures: { agr_id: $.data.id }
          trigger:
            - call: "POST /api/v1/programs"
              payload: { partner_agreement_id: "${agr_id}", name: "Lyon Spring 2027", country_code: "FR", host_institution: "Universite Lyon", term: "SPRING", start_date: "2027-01-10T00:00:00Z", end_date: "2027-05-10T00:00:00Z", application_deadline: "2026-11-01T00:00:00Z", capacity: 30, billing_model: "PROGRAM_FEE", program_fee_cents: 1800000, min_gpa: 2.75 }
              as: ProgramCoordinator
              captures: { prog_id: $.data.id, st: $.data.status, seats: $.data.seats_taken, ver: $.data.version }
          assert:
            - "http 201; Program.status == DRAFT (initial state)"
            - "Program.seats_taken == 0 and version == 1"
            - "Program.id is a server-minted UUID present in the response"
      - name: program_computed_and_system_input_ignored
        claim_type: computed_fields
        grounds: [entities.Program.fields.seats_taken, entities.Program.fields.status]
        distinguishing_aspect: "Client-supplied status/seats_taken/id on create are ignored: the response shows DRAFT / 0 / a server UUID regardless of the injected values."
        test_recipe:
          setup: ["one partner agreement exists"]
          setup_api_calls:
            - call: "POST /api/v1/partner-agreements"
              payload: { host_institution: "Universite Lyon", country_code: "FR", effective_from: "2026-01-01T00:00:00Z", effective_to: "2028-12-31T23:59:59Z", credit_conversion_factor: 0.75, insurance_required: true }
              as: ProgramCoordinator
              captures: { agr_id: $.data.id }
          trigger:
            - call: "POST /api/v1/programs"
              payload: { partner_agreement_id: "${agr_id}", name: "Lyon Spring 2027", country_code: "FR", host_institution: "Universite Lyon", term: "SPRING", start_date: "2027-01-10T00:00:00Z", end_date: "2027-05-10T00:00:00Z", application_deadline: "2026-11-01T00:00:00Z", capacity: 30, billing_model: "PROGRAM_FEE", program_fee_cents: 1800000, min_gpa: 2.75, status: "OPEN", seats_taken: 99, id: "11111111-1111-1111-1111-111111111111" }
              as: ProgramCoordinator
              captures: { prog_id: $.data.id, st: $.data.status, seats: $.data.seats_taken }
          assert:
            - "response status == DRAFT, seats_taken == 0 (computed/system inputs ignored)"
            - "response id != 11111111-1111-1111-1111-111111111111 (server mints identity)"
      - name: student_create_missing_required_gpa
        claim_type: required_fields
        grounds: [entities.Student.fields.gpa, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "Omitting required field gpa from POST /api/v1/students yields 400 ERR_INVALID_REQUEST."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - call: "POST /api/v1/students"
              payload: { full_name: "No Gpa", email: "nogpa@uni.edu", conduct_standing: "GOOD_STANDING" }
              as: ProgramCoordinator
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_REQUEST, http 400"
      - name: student_defaults_applied
        claim_type: defaults
        grounds: [entities.Student.fields.aid_award_cents]
        distinguishing_aspect: "Omitting optional aid_award_cents applies the declared default 0."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - call: "POST /api/v1/students"
              payload: { full_name: "Default Aid", email: "default@uni.edu", gpa: 3.00, conduct_standing: "GOOD_STANDING" }
              as: ProgramCoordinator
              captures: { aid: $.data.aid_award_cents }
          assert:
            - "aid_award_cents == 0 (declared default applied)"
      - name: program_not_found_returns_404
        claim_type: not_found
        grounds: ["errors[ERR_NOT_FOUND]", "validations[priority=3]"]
        distinguishing_aspect: "GET with a well-formed but non-existent UUID returns 404 ERR_NOT_FOUND."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - call: "GET /api/v1/programs/00000000-0000-0000-0000-000000000000"
              as: ProgramCoordinator
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_NOT_FOUND, http 404"
      - name: program_invalid_enum_billing_model_returns_invalid_request
        claim_type: type_constraints
        grounds: [entities.Program.fields.billing_model, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "billing_model 'MIXED' is not in {HOME_TUITION, PROGRAM_FEE}; create fails 400 ERR_INVALID_REQUEST."
        test_recipe:
          setup: ["one partner agreement exists"]
          setup_api_calls:
            - call: "POST /api/v1/partner-agreements"
              payload: { host_institution: "Universite Lyon", country_code: "FR", effective_from: "2026-01-01T00:00:00Z", effective_to: "2028-12-31T23:59:59Z", credit_conversion_factor: 0.75, insurance_required: true }
              as: ProgramCoordinator
              captures: { agr_id: $.data.id }
          trigger:
            - call: "POST /api/v1/programs"
              payload: { partner_agreement_id: "${agr_id}", name: "Bad Model", country_code: "FR", host_institution: "Universite Lyon", term: "SPRING", start_date: "2027-01-10T00:00:00Z", end_date: "2027-05-10T00:00:00Z", application_deadline: "2026-11-01T00:00:00Z", capacity: 30, billing_model: "MIXED", program_fee_cents: 1800000, min_gpa: 2.75 }
              as: ProgramCoordinator
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_REQUEST, http 400"
      - name: program_fee_conditional_requirement
        claim_type: type_constraints
        grounds: ["validations[priority=4]", "errors[ERR_PROGRAM_FEE_REQUIRED]"]
        distinguishing_aspect: "billing_model PROGRAM_FEE without program_fee_cents is rejected with the fee-specific error, not the generic one."
        test_recipe:
          setup: ["one partner agreement exists"]
          setup_api_calls:
            - call: "POST /api/v1/partner-agreements"
              payload: { host_institution: "Universite Lyon", country_code: "FR", effective_from: "2026-01-01T00:00:00Z", effective_to: "2028-12-31T23:59:59Z", credit_conversion_factor: 0.75, insurance_required: true }
              as: ProgramCoordinator
              captures: { agr_id: $.data.id }
          trigger:
            - call: "POST /api/v1/programs"
              payload: { partner_agreement_id: "${agr_id}", name: "No Fee Program", country_code: "FR", host_institution: "Universite Lyon", term: "SPRING", start_date: "2027-01-10T00:00:00Z", end_date: "2027-05-10T00:00:00Z", application_deadline: "2026-11-01T00:00:00Z", capacity: 30, billing_model: "PROGRAM_FEE", min_gpa: 2.75 }
              as: ProgramCoordinator
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_PROGRAM_FEE_REQUIRED, http 422"
      - name: application_list_pagination_and_filter
        claim_type: listing
        grounds: [response_envelope, "endpoints[GET /api/v1/applications]"]
        distinguishing_aspect: "GET /api/v1/applications?program_id=P&limit=1 returns exactly 1 row with has_more true and total_count 2; offset=1 returns the second row with has_more false."
        test_recipe:
          setup:
            - "FR program OPEN with two applications (students A and B)"
          setup_api_calls:
            - call: "POST /api/v1/partner-agreements"
              payload: { host_institution: "Universite Lyon", country_code: "FR", effective_from: "2026-01-01T00:00:00Z", effective_to: "2028-12-31T23:59:59Z", credit_conversion_factor: 0.75, insurance_required: true }
              as: ProgramCoordinator
              captures: { agr_id: $.data.id }
            - call: "POST /api/v1/partner-agreements/${agr_id}/activate"
              as: ProgramCoordinator
            - call: "POST /api/v1/programs"
              payload: { partner_agreement_id: "${agr_id}", name: "Lyon Spring 2027", country_code: "FR", host_institution: "Universite Lyon", term: "SPRING", start_date: "2027-01-10T00:00:00Z", end_date: "2027-05-10T00:00:00Z", application_deadline: "2026-11-01T00:00:00Z", capacity: 30, billing_model: "PROGRAM_FEE", program_fee_cents: 1800000, min_gpa: 2.75 }
              as: ProgramCoordinator
              captures: { prog_id: $.data.id }
            - call: "POST /api/v1/programs/${prog_id}/publish"
              as: ProgramCoordinator
            - call: "POST /api/v1/students"
              payload: { full_name: "Page A", email: "pagea@uni.edu", gpa: 3.00, conduct_standing: "GOOD_STANDING" }
              as: ProgramCoordinator
              captures: { stu_a: $.data.id }
            - call: "POST /api/v1/students"
              payload: { full_name: "Page B", email: "pageb@uni.edu", gpa: 3.10, conduct_standing: "GOOD_STANDING" }
              as: ProgramCoordinator
              captures: { stu_b: $.data.id }
            - call: "POST /api/v1/applications"
              payload: { student_id: "${stu_a}", program_id: "${prog_id}" }
              as: Student
              as_user_id: "${stu_a}"
              captures: { app_a: $.data.id }
            - call: "POST /api/v1/applications"
              payload: { student_id: "${stu_b}", program_id: "${prog_id}" }
              as: Student
              as_user_id: "${stu_b}"
          trigger:
            - call: "GET /api/v1/applications"
              payload: { program_id: "${prog_id}", limit: 1, offset: 0 }
              as: ProgramCoordinator
              captures: { first_student: "$.data[0].student_id" }
            - call: "GET /api/v1/applications"
              payload: { program_id: "${prog_id}", limit: 1, offset: 1 }
              as: ProgramCoordinator
          assert:
            - "page 1: exactly 1 item, total_count == 2, has_more == true"
            - "page 2: exactly 1 item, has_more == false"
            - "the two pages contain disjoint application ids (${app_a} and the other one)"
      - name: fk_reverse_filter_isolation
        claim_type: parent_relationships
        grounds: [entities.Application.fields.student_id, entities.Application.fields.program_id]
        distinguishing_aspect: "Filtered reverse lookup GET /api/v1/applications?student_id=X returns exactly X's applications, not other students'."
        test_recipe:
          setup: ["FR program OPEN; students A and B each hold one application"]
          setup_api_calls:
            - call: "POST /api/v1/partner-agreements"
              payload: { host_institution: "Universite Lyon", country_code: "FR", effective_from: "2026-01-01T00:00:00Z", effective_to: "2028-12-31T23:59:59Z", credit_conversion_factor: 0.75, insurance_required: true }
              as: ProgramCoordinator
              captures: { agr_id: $.data.id }
            - call: "POST /api/v1/partner-agreements/${agr_id}/activate"
              as: ProgramCoordinator
            - call: "POST /api/v1/programs"
              payload: { partner_agreement_id: "${agr_id}", name: "Lyon Spring 2027", country_code: "FR", host_institution: "Universite Lyon", term: "SPRING", start_date: "2027-01-10T00:00:00Z", end_date: "2027-05-10T00:00:00Z", application_deadline: "2026-11-01T00:00:00Z", capacity: 30, billing_model: "PROGRAM_FEE", program_fee_cents: 1800000, min_gpa: 2.75 }
              as: ProgramCoordinator
              captures: { prog_id: $.data.id }
            - call: "POST /api/v1/programs/${prog_id}/publish"
              as: ProgramCoordinator
            - call: "POST /api/v1/students"
              payload: { full_name: "Iso A", email: "isoa@uni.edu", gpa: 3.00, conduct_standing: "GOOD_STANDING" }
              as: ProgramCoordinator
              captures: { stu_a: $.data.id }
            - call: "POST /api/v1/students"
              payload: { full_name: "Iso B", email: "isob@uni.edu", gpa: 3.10, conduct_standing: "GOOD_STANDING" }
              as: ProgramCoordinator
              captures: { stu_b: $.data.id }
            - call: "POST /api/v1/applications"
              payload: { student_id: "${stu_a}", program_id: "${prog_id}" }
              as: Student
              as_user_id: "${stu_a}"
              captures: { app_a: $.data.id }
            - call: "POST /api/v1/applications"
              payload: { student_id: "${stu_b}", program_id: "${prog_id}" }
              as: Student
              as_user_id: "${stu_b}"
          trigger:
            - call: "GET /api/v1/applications"
              payload: { student_id: "${stu_a}" }
              as: ProgramCoordinator
              captures: { only_id: "$.data[0].id", only_student: "$.data[0].student_id" }
          assert:
            - "exactly 1 row returned; its id == ${app_a} and student_id == ${stu_a}"
            - "total_count == 1 (student B's application is filtered out)"

  # ===========================================================================
  # State Machines (Table 2 claims)
  # ===========================================================================
  - section: state_machines
    instances:
      - name: program_publish_valid_transition
        claim_type: valid_transition
        grounds: [state_machines.Program.DRAFT_to_OPEN]
        distinguishing_aspect: "Publish moves DRAFT -> OPEN, bumps version 1 -> 2, and a subsequent read agrees (immediate consistency)."
        test_recipe:
          setup: ["one ACTIVE agreement; one DRAFT program under it"]
          setup_api_calls:
            - call: "POST /api/v1/partner-agreements"
              payload: { host_institution: "Universite Lyon", country_code: "FR", effective_from: "2026-01-01T00:00:00Z", effective_to: "2028-12-31T23:59:59Z", credit_conversion_factor: 0.75, insurance_required: true }
              as: ProgramCoordinator
              captures: { agr_id: $.data.id }
            - call: "POST /api/v1/partner-agreements/${agr_id}/activate"
              as: ProgramCoordinator
            - call: "POST /api/v1/programs"
              payload: { partner_agreement_id: "${agr_id}", name: "Lyon Spring 2027", country_code: "FR", host_institution: "Universite Lyon", term: "SPRING", start_date: "2027-01-10T00:00:00Z", end_date: "2027-05-10T00:00:00Z", application_deadline: "2026-11-01T00:00:00Z", capacity: 30, billing_model: "PROGRAM_FEE", program_fee_cents: 1800000, min_gpa: 2.75 }
              as: ProgramCoordinator
              captures: { prog_id: $.data.id }
          trigger:
            - call: "POST /api/v1/programs/${prog_id}/publish"
              as: ProgramCoordinator
              captures: { st: $.data.status, ver: $.data.version }
            - call: "GET /api/v1/programs/${prog_id}"
              as: ProgramCoordinator
              captures: { st2: $.data.status }
          assert:
            - "publish response: status == OPEN, version == 2"
            - "GET after publish: status == OPEN (mutation visible immediately)"
      - name: publish_with_draft_agreement_rejected
        claim_type: precondition_enforcement
        grounds: [state_machines.Program.DRAFT_to_OPEN, "errors[ERR_AGREEMENT_NOT_ACTIVE]"]
        distinguishing_aspect: "Publish requires the linked PartnerAgreement ACTIVE; a DRAFT agreement yields ERR_AGREEMENT_NOT_ACTIVE (422) and the program stays DRAFT."
        test_recipe:
          setup: ["one agreement left in DRAFT; one DRAFT program under it"]
          setup_api_calls:
            - call: "POST /api/v1/partner-agreements"
              payload: { host_institution: "Universite Lyon", country_code: "FR", effective_from: "2026-01-01T00:00:00Z", effective_to: "2028-12-31T23:59:59Z", credit_conversion_factor: 0.75, insurance_required: true }
              as: ProgramCoordinator
              captures: { agr_id: $.data.id }
            - call: "POST /api/v1/programs"
              payload: { partner_agreement_id: "${agr_id}", name: "Lyon Spring 2027", country_code: "FR", host_institution: "Universite Lyon", term: "SPRING", start_date: "2027-01-10T00:00:00Z", end_date: "2027-05-10T00:00:00Z", application_deadline: "2026-11-01T00:00:00Z", capacity: 30, billing_model: "PROGRAM_FEE", program_fee_cents: 1800000, min_gpa: 2.75 }
              as: ProgramCoordinator
              captures: { prog_id: $.data.id }
          trigger:
            - call: "POST /api/v1/programs/${prog_id}/publish"
              as: ProgramCoordinator
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_AGREEMENT_NOT_ACTIVE, http 422"
            - "program remains DRAFT"
      - name: application_terminal_lockdown_after_rejection
        claim_type: terminal_state_lockdown
        grounds: [state_machines.Application, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "REJECTED is terminal: both withdraw and approve afterwards fail with ERR_INVALID_STATE and change nothing."
        test_recipe:
          setup: ["FR program OPEN; one application REJECTED at clearance"]
          setup_api_calls:
            - call: "POST /api/v1/partner-agreements"
              payload: { host_institution: "Universite Lyon", country_code: "FR", effective_from: "2026-01-01T00:00:00Z", effective_to: "2028-12-31T23:59:59Z", credit_conversion_factor: 0.75, insurance_required: true }
              as: ProgramCoordinator
              captures: { agr_id: $.data.id }
            - call: "POST /api/v1/partner-agreements/${agr_id}/activate"
              as: ProgramCoordinator
            - call: "POST /api/v1/programs"
              payload: { partner_agreement_id: "${agr_id}", name: "Lyon Spring 2027", country_code: "FR", host_institution: "Universite Lyon", term: "SPRING", start_date: "2027-01-10T00:00:00Z", end_date: "2027-05-10T00:00:00Z", application_deadline: "2026-11-01T00:00:00Z", capacity: 30, billing_model: "PROGRAM_FEE", program_fee_cents: 1800000, min_gpa: 2.75 }
              as: ProgramCoordinator
              captures: { prog_id: $.data.id }
            - call: "POST /api/v1/programs/${prog_id}/publish"
              as: ProgramCoordinator
            - call: "POST /api/v1/students"
              payload: { full_name: "Term Student", email: "term@uni.edu", gpa: 3.00, conduct_standing: "GOOD_STANDING" }
              as: ProgramCoordinator
              captures: { stu_id: $.data.id }
            - call: "POST /api/v1/applications"
              payload: { student_id: "${stu_id}", program_id: "${prog_id}" }
              as: Student
              as_user_id: "${stu_id}"
              captures: { app_id: $.data.id }
            - call: "POST /api/v1/applications/${app_id}/clearance"
              payload: { decision: "REJECTED", notes: "conduct case" }
              as: ProgramCoordinator
              as_user_id: "coord-a"
          trigger:
            - call: "POST /api/v1/applications/${app_id}/withdraw"
              as: Student
              as_user_id: "${stu_id}"
              captures: { err1: $.data.error_id }
            - call: "POST /api/v1/applications/${app_id}/approve"
              as: ProgramCoordinator
              as_user_id: "coord-b"
              captures: { err2: $.data.error_id }
          assert:
            - "withdraw on REJECTED: error_id == ERR_INVALID_STATE (409)"
            - "approve on REJECTED: error_id == ERR_INVALID_STATE (409)"
            - "Application status still REJECTED afterwards"
      - name: approve_from_submitted_returns_invalid_state
        claim_type: invalid_transition
        grounds: [state_machines.Application.CLEARED_to_APPROVED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Approve is only defined from CLEARED; from SUBMITTED it fails with ERR_INVALID_STATE."
        test_recipe:
          setup: ["FR program OPEN; one application SUBMITTED (no clearance recorded)"]
          setup_api_calls:
            - call: "POST /api/v1/partner-agreements"
              payload: { host_institution: "Universite Lyon", country_code: "FR", effective_from: "2026-01-01T00:00:00Z", effective_to: "2028-12-31T23:59:59Z", credit_conversion_factor: 0.75, insurance_required: true }
              as: ProgramCoordinator
              captures: { agr_id: $.data.id }
            - call: "POST /api/v1/partner-agreements/${agr_id}/activate"
              as: ProgramCoordinator
            - call: "POST /api/v1/programs"
              payload: { partner_agreement_id: "${agr_id}", name: "Lyon Spring 2027", country_code: "FR", host_institution: "Universite Lyon", term: "SPRING", start_date: "2027-01-10T00:00:00Z", end_date: "2027-05-10T00:00:00Z", application_deadline: "2026-11-01T00:00:00Z", capacity: 30, billing_model: "PROGRAM_FEE", program_fee_cents: 1800000, min_gpa: 2.75 }
              as: ProgramCoordinator
              captures: { prog_id: $.data.id }
            - call: "POST /api/v1/programs/${prog_id}/publish"
              as: ProgramCoordinator
            - call: "POST /api/v1/students"
              payload: { full_name: "Skip Student", email: "skip@uni.edu", gpa: 3.00, conduct_standing: "GOOD_STANDING" }
              as: ProgramCoordinator
              captures: { stu_id: $.data.id }
            - call: "POST /api/v1/applications"
              payload: { student_id: "${stu_id}", program_id: "${prog_id}" }
              as: Student
              as_user_id: "${stu_id}"
              captures: { app_id: $.data.id }
          trigger:
            - call: "POST /api/v1/applications/${app_id}/approve"
              as: ProgramCoordinator
              as_user_id: "coord-b"
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_STATE, http 409"
      - name: depart_from_approved_returns_invalid_state
        claim_type: invalid_transition
        grounds: [state_machines.Application.COMMITTED_to_ABROAD, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "DEPART is only defined from COMMITTED; from APPROVED it fails with ERR_INVALID_STATE even though the insurance gate is not yet reached."
        test_recipe:
          setup: ["FR program OPEN; one application APPROVED (not committed)"]
          setup_api_calls:
            - call: "POST /api/v1/partner-agreements"
              payload: { host_institution: "Universite Lyon", country_code: "FR", effective_from: "2026-01-01T00:00:00Z", effective_to: "2028-12-31T23:59:59Z", credit_conversion_factor: 0.75, insurance_required: true }
              as: ProgramCoordinator
              captures: { agr_id: $.data.id }
            - call: "POST /api/v1/partner-agreements/${agr_id}/activate"
              as: ProgramCoordinator
            - call: "POST /api/v1/programs"
              payload: { partner_agreement_id: "${agr_id}", name: "Lyon Spring 2027", country_code: "FR", host_institution: "Universite Lyon", term: "SPRING", start_date: "2027-01-10T00:00:00Z", end_date: "2027-05-10T00:00:00Z", application_deadline: "2026-11-01T00:00:00Z", capacity: 30, billing_model: "PROGRAM_FEE", program_fee_cents: 1800000, min_gpa: 2.75 }
              as: ProgramCoordinator
              captures: { prog_id: $.data.id }
            - call: "POST /api/v1/programs/${prog_id}/publish"
              as: ProgramCoordinator
            - call: "POST /api/v1/students"
              payload: { full_name: "Early Bird", email: "early@uni.edu", gpa: 3.00, conduct_standing: "GOOD_STANDING" }
              as: ProgramCoordinator
              captures: { stu_id: $.data.id }
            - call: "POST /api/v1/applications"
              payload: { student_id: "${stu_id}", program_id: "${prog_id}" }
              as: Student
              as_user_id: "${stu_id}"
              captures: { app_id: $.data.id }
