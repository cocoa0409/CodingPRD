        grounds:
          - validations[priority 11].ERR_RUBRIC_POINTS_OUT_OF_RANGE
          - validations[priority 23].ERR_OUTCOME_NOT_IN_COURSE
          - validations[priority 30].ERR_DUPLICATE_RUBRIC_SCORE
          - validations[priority 36].ERR_INCOMPLETE_RUBRIC
          - entities.RubricScore.fields.points_awarded
          - endpoints[POST /assessor-assignments/{assignment_id}/rubric-scores]
