              payload: { program_id: "${prog_id}", cohort_basis: "REGISTERED_COHORT" }
              as: RegistrationAgency
              captures: { rep_reg_id: $.data.id, reg_rate: $.data.completion_rate_pct, reg_total: $.data.total_apprentices }
            - call: "POST /apprenticeship/eeo-reports"
              payload: { program_id: "${prog_id}", cohort_basis: "ACTIVE_COHORT" }
              as: RegistrationAgency
              captures: { rep_act_id: $.data.id, act_rate: $.data.completion_rate_pct, act_total: $.data.total_apprentices }
          assert:
            - "EEOReport.${rep_reg_id}.total_apprentices == 4"
            - "EEOReport.${rep_reg_id}.completion_rate_pct == 25.0"
            - "EEOReport.${rep_act_id}.total_apprentices == 3"
            - "EEOReport.${rep_act_id}.completion_rate_pct == 33.33"

  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: journeyman_ratio_capacity_mode_a_nonlinear
        grounds:
          - calculations.journeyman_ratio_capacity
          - entities.ApprenticeshipProgram.fields.available_apprentice_slots
          - entities.ApprenticeshipProgram.fields.journeyman_ratio
          - entities.Journeyworker.fields.status
        distinguishing_aspect: |
          MODE (a): three inputs (qualified count q, probationary count p, ratio) combine
          non-linearly via floor(q*ratio + p*ratio*0.5) then max(0, .. - active). With q=1,
          p=1, ratio=4, active=0 the capacity is floor(6)=6, not the naive q*ratio=4.
        test_recipe:
          setup:
            - "Sponsor S with one QUALIFIED journeyworker and one PROBATIONARY journeyworker."
            - "ACTIVE HOURS_BASED program PROG with journeyman_ratio 4, no agreements yet."
          setup_api_calls:
            - call: "POST /apprenticeship/sponsors"
              payload: { legal_name: "Ratio Co", ein: "33-3333333", contact_email: "r@x.test" }
              as: Sponsor
              captures: { s_id: $.data.id }
            - call: "POST /apprenticeship/journeyworkers"
              payload: { sponsor_id: "${s_id}", full_name: "JW Qualified" }
              as: Sponsor
              as_user_id: "${s_id}"
              captures: { jwq_id: $.data.id }
            - call: "POST /apprenticeship/journeyworkers/${jwq_id}/qualify"
              payload: {}
              as: Sponsor
              as_user_id: "${s_id}"
            - call: "POST /apprenticeship/journeyworkers"
              payload: { sponsor_id: "${s_id}", full_name: "JW Probationary" }
              as: Sponsor
              as_user_id: "${s_id}"
              captures: { jwp_id: $.data.id }
            - call: "POST /apprenticeship/programs"
              payload: { sponsor_id: "${s_id}", occupation_code: "47-2031.00", occupation_title: "Carpenter", completion_type: "HOURS_BASED", ojt_hours_required: 16, rti_hours_required: 8, base_journeyworker_wage_cents: 4000, journeyman_ratio: 4 }
              as: Sponsor
              as_user_id: "${s_id}"
              captures: { prog_id: $.data.id }
            - call: "POST /apprenticeship/wage-steps"
              payload: { program_id: "${prog_id}", step_number: 1, ojt_hours_threshold: 0, wage_pct: 0.50 }
              as: Sponsor
              as_user_id: "${s_id}"
            - call: "POST /apprenticeship/programs/${prog_id}/activate"
              payload: {}
              as: RegistrationAgency
          trigger:
            - call: "GET /apprenticeship/programs/${prog_id}"
              payload: {}
              as: Sponsor
              as_user_id: "${s_id}"
          assert:
            - "ApprenticeshipProgram.${prog_id}.available_apprentice_slots == 6"
            - "ApprenticeshipProgram.${prog_id}.active_agreement_count == 0"

      - name: eeo_largest_remainder_rounding_mode_b
        grounds:
          - calculations.eeo_distribution_largest_remainder
          - entities.EEOReport.fields.gender_distribution_pct
          - entities.EEOReport.fields.race_distribution_pct
        distinguishing_aspect: |
          MODE (b): the per-category whole-percent breakdown depends on a pinned rounding ORDER —
          FLOOR all raw percents, THEN allocate the leftover unit to the largest fractional
          remainder (ties by enum order). For race counts ASIAN=1, BLACK=2, HISPANIC=3 over N=6,
          the result is HISPANIC=50, BLACK=33, ASIAN=17 (sums to 100); naive per-category round()
          would give 17+33+50 here but diverges for the 1/1/1 gender case below.
        test_recipe:
          setup:
            - "ACTIVE HOURS_BASED program PROG (ratio 8) under sponsor S, one QUALIFIED journeyworker."
            - "Six apprentices grouped: race ASIAN x1, BLACK x2, HISPANIC x3; gender MALE x1, FEMALE x1, NONBINARY x1 across the first three."
            - "Six ACTIVE agreements (one per apprentice) so all six are in the ACTIVE cohort."
          setup_api_calls:
            - call: "POST /apprenticeship/sponsors"
              payload: { legal_name: "EEO Co", ein: "44-4444444", contact_email: "e@x.test" }
              as: Sponsor
              captures: { s_id: $.data.id }
            - call: "POST /apprenticeship/journeyworkers"
              payload: { sponsor_id: "${s_id}", full_name: "JW1" }
              as: Sponsor
              as_user_id: "${s_id}"
              captures: { jw_id: $.data.id }
            - call: "POST /apprenticeship/journeyworkers/${jw_id}/qualify"
              payload: {}
              as: Sponsor
              as_user_id: "${s_id}"
            - call: "POST /apprenticeship/apprentices"
              payload: { sponsor_id: "${s_id}", full_name: "A1", gender: "MALE", race_ethnicity: "ASIAN" }
              as: Sponsor
              as_user_id: "${s_id}"
