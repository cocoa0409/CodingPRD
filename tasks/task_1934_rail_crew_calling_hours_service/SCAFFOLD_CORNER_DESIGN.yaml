      - name: occ_stale_job_version_on_accept
        claim_type: stale_version_conflict
        grounds: ["concurrency_rules[job-fill-stale-job]", "errors[ERR_STALE_VERSION]"]
        distinguishing_aspect: "Accept carrying the pre-fill job version after another accept already bumped Job.version -> 412 ERR_STALE_VERSION; two strictly sequential requests, deterministic."
        test_recipe:
          setup: ["Job J crew_required=2; C1 -> E1 and (after C1 accept + C2 issue) C2 -> E2 OFFERED; E2 captured job version BEFORE E1's accept"]
          setup_api_calls:
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: CrewManager
            - call: "POST /api/employees"
