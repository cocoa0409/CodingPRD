# =============================================================================
# Scaffold: auto-repair-shop-management (Expert)
# Scenario 168 — Auto Repair Shop Management
# =============================================================================

scenario: |
  168. Auto Repair Shop Management: estimate/flat-rate labor hours, parts markup
  matrix, repair order status, technician efficiency, warranty/comeback,
  multi-point inspection, declined-work approval, core charge

domain_name: auto-repair-shop-management
api_prefix: ""
# Flat top-level resource surface: customers, vehicles, technicians, service-bays,
# labor-operations, markup-tiers, repair-orders, labor-lines, part-lines,
# core-charges, inspections, recommended-jobs are sibling collections (no single
# nesting prefix), so api_prefix is empty and every path is rooted at "/".

complexity_profile:
  primary_archetype: pricing_engine
  secondary_archetype: workflow_orchestration
  complexity_layers:
    - dual_variant_calculation        # flat-rate vs time-and-materials labor; marginal vs flat-bracket parts markup
    - cascading_side_effects          # approve recommended job -> lines -> core charge -> RO totals
    - rate_threshold_triggers         # markup-matrix tier boundaries; warranty window boundary
    - optimistic_concurrency          # supersede prior customer authorization snapshot via OCC

  entity_topology: hybrid
  # RepairOrder is a small tree (LaborLine/PartLine/CoreCharge/Inspection/RecommendedJob),
  # but Customer/Vehicle/Technician/ServiceBay and the two catalog configs (LaborOperation,
  # MarkupTier) are flat peers wired by FK. Comeback is a self-reference on RepairOrder.

  state_machine_shape: branching
  # RepairOrder carries a cyclic IN_PROGRESS<->ON_HOLD loop; RecommendedJob is a branching
  # fork (PENDING -> {APPROVED, DECLINED, DEFERRED}) with DEFERRED -> APPROVED revisit;
  # CoreCharge branches CHARGED -> {CORE_RETURNED, FORFEITED}; LaborLine cycles via clock.

  relationship_patterns:
    - one_to_many        # RepairOrder -> LaborLine/PartLine; Inspection -> RecommendedJob
    - self_referential   # RepairOrder.comeback_of_ro_id -> RepairOrder.id (warranty comeback)
    - cross_aggregate    # RecommendedJob (under Inspection) materialises lines on RepairOrder

  role_model: peer_roles
  # ServiceAdvisor owns the RO/estimate surface; Technician owns labor/clock/inspection;
  # Customer owns approval/decline of recommended work + authorization; PartsManager owns
  # parts/markup/core; ShopManager is the operational superset with warranty + override.

  consistency_model: immediate

# =============================================================================
# 1.0 Response Envelope (FIXED)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# 1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Customer
    parent: null
    common_fields: true
    fields:
      - { name: full_name, type: string, source: input, description: "Customer name" }
      - { name: phone, type: string, source: input, description: "Contact phone" }
      - { name: email, type: string, source: input, description: "Contact email" }

  - name: Vehicle
    parent: Customer
    common_fields: true
    fields:
      - { name: customer_id, type: string, source: input, description: "FK -> Customer.id; owning customer" }
      - { name: vin, type: string, source: input, description: "Vehicle VIN; unique across all vehicles", constraints: "unique" }
      - { name: make, type: string, source: input, description: "Make" }
      - { name: model, type: string, source: input, description: "Model" }
      - { name: model_year, type: integer, source: input, description: "Model year" }
      - { name: odometer_miles, type: integer, source: input, description: "Current odometer reading in miles; non-negative", constraints: ">= 0" }

  - name: Technician
    parent: null
    common_fields: true
    fields:
      - { name: full_name, type: string, source: input, description: "Technician name" }
      - { name: skill_level, type: enum, source: input, default: "B", description: "Skill grade", constraints: "A | B | C" }
      - { name: clocked_labor_line_id, type: string, source: system, description: "Id of the LaborLine this tech is currently clocked into (back-reference; null when not clocked in). Used to reject double-clocking.", default: null }
      - { name: last_clock_out_at, type: datetime, source: system, description: "Timestamp of this tech's most recent clock-out (anchors the cleanup buffer)", default: null }
      - { name: banked_flat_hours, type: number, source: computed, default: 0, description: "Sum of book_hours of this tech's COMPLETED non-warranty LaborLines, MINUS book_hours debited by warranty comebacks against this tech. Conserved quantity for the technician compensating invariant." }
      - { name: banked_actual_hours, type: number, source: computed, default: 0, description: "Sum of clocked actual_hours over this tech's COMPLETED non-warranty LaborLines" }
      - { name: efficiency_pct, type: number, source: computed, default: null, description: "100 * banked_flat_hours / banked_actual_hours, 1 decimal; null when banked_actual_hours == 0" }

  - name: ServiceBay
    parent: null
    common_fields: true
    fields:
      - { name: bay_name, type: string, source: input, description: "Bay label; unique", constraints: "unique" }
      - { name: bay_type, type: enum, source: input, default: "GENERAL", description: "Bay capability", constraints: "GENERAL | ALIGNMENT | LIFT" }

  - name: LaborOperation
    parent: null
    common_fields: true
    fields:
      - { name: op_code, type: string, source: input, description: "Flat-rate operation code; unique", constraints: "unique" }
      - { name: description, type: string, source: input, description: "Operation description" }
      - { name: book_hours, type: number, source: input, description: "Flat-rate (book) labor hours for this operation; > 0", constraints: "> 0" }
      - { name: default_rate_cents, type: integer, source: input, description: "Default shop labor rate in cents per hour; > 0", constraints: "> 0" }

  - name: MarkupTier
    parent: null
    common_fields: true
    fields:
      - { name: tier_index, type: integer, source: input, description: "Order of this tier within the matrix, ascending by lower_bound_cents; unique", constraints: "unique, >= 0" }
      - { name: lower_bound_cents, type: integer, source: input, description: "Inclusive lower bound of per-unit part cost (cents) this tier covers", constraints: ">= 0" }
      - { name: upper_bound_cents, type: integer, source: input, description: "Exclusive upper bound of per-unit part cost (cents); null = unbounded top tier", default: null }
      - { name: markup_pct, type: number, source: input, description: "Markup applied to the cost slice in this band, e.g. 0.40 for 40%", constraints: ">= 0" }

  - name: RepairOrder
    parent: null
    common_fields: true
    fields:
      - { name: customer_id, type: string, source: input, description: "FK -> Customer.id; billing customer" }
      - { name: vehicle_id, type: string, source: input, description: "FK -> Vehicle.id; vehicle being serviced" }
      - { name: bay_id, type: string, source: input, description: "FK -> ServiceBay.id; assigned bay (set on schedule)", default: null }
      - { name: comeback_of_ro_id, type: string, source: input, description: "FK -> RepairOrder.id; when set, this RO is a warranty comeback of the named original RO", default: null }
      - { name: is_comeback, type: boolean, source: computed, default: false, description: "True iff comeback_of_ro_id is set" }
      - { name: scheduled_start, type: datetime, source: input, description: "Assigned bay window start (ISO 8601 UTC)", default: null }
      - { name: scheduled_end, type: datetime, source: input, description: "Assigned bay window end (ISO 8601 UTC); must be > scheduled_start", default: null }
      - { name: tax_rate, type: number, source: input, default: 0.0, description: "Sales tax rate applied to taxable subtotal, e.g. 0.0825" }
      - { name: labor_total_cents, type: integer, source: computed, default: 0, description: "Sum of per-line rounded labor charges (see calc repair_order_total)" }
      - { name: parts_total_cents, type: integer, source: computed, default: 0, description: "Sum of per-line rounded marked-up part charges over non-RETURNED part lines" }
      - { name: core_deposit_total_cents, type: integer, source: computed, default: 0, description: "Sum of deposit_cents over this RO's CoreCharges in CHARGED status. Conserved quantity for the core compensating invariant." }
      - { name: tax_cents, type: integer, source: computed, default: 0, description: "Rounded tax on the taxable subtotal (labor + parts; core deposits not taxable)" }
      - { name: grand_total_cents, type: integer, source: computed, default: 0, description: "labor_total + parts_total + core_deposit_total + tax" }
      - { name: approved_work_value_cents, type: integer, source: computed, default: 0, description: "Sum of estimated_value_cents over RecommendedJobs in APPROVED status targeting this RO" }
      - { name: authorized_total_cents, type: integer, source: system, description: "grand_total_cents snapshot captured at the most recent authorization; null until authorized", default: null }
      - { name: authorized_version, type: integer, source: system, description: "RepairOrder.version value at the moment of the most recent authorization", default: null }
      - { name: closed_at, type: datetime, source: system, description: "Timestamp the RO entered CLOSED (anchors the warranty window for comebacks)", default: null }
      - { name: close_odometer_miles, type: integer, source: system, description: "vehicle.odometer_miles recorded at close (anchors warranty mileage)", default: null }
      - { name: status, type: enum, source: system, description: "Lifecycle", constraints: "ESTIMATE | APPROVED | IN_PROGRESS | ON_HOLD | COMPLETED | INVOICED | CLOSED | CANCELLED" }

  - name: LaborLine
    parent: RepairOrder
    common_fields: true
    fields:
      - { name: repair_order_id, type: string, source: input, description: "FK -> RepairOrder.id; owning repair order" }
      - { name: labor_operation_id, type: string, source: input, description: "FK -> LaborOperation.id; catalog operation supplying book_hours" }
      - { name: technician_id, type: string, source: input, description: "FK -> Technician.id; assigned technician", default: null }
      - { name: billing_method, type: enum, source: input, default: "FLAT_RATE", description: "Charge basis", constraints: "FLAT_RATE | TIME_AND_MATERIALS" }
      - { name: book_hours, type: number, source: computed, description: "Snapshotted from LaborOperation.book_hours at line creation" }
      - { name: rate_cents, type: integer, source: input, description: "Labor rate cents/hour for this line; defaults to LaborOperation.default_rate_cents when omitted", default: null }
      - { name: actual_hours, type: number, source: computed, default: 0, description: "Accumulated clocked hours (sum of closed clock sessions), 3 decimals" }
      - { name: open_clock_at, type: datetime, source: system, description: "Clock-in timestamp of the currently open session; null when not clocked in", default: null }
      - { name: is_warranty, type: boolean, source: input, default: false, description: "True when this line is warranty rework billed at zero on a comeback RO" }
      - { name: charge_cents, type: integer, source: computed, default: 0, description: "Rounded charge per calc labor_charge: FLAT_RATE set at creation (book_hours*rate), T&M tracks actual_hours (0 until first clock-out, final at complete), warranty=0" }
      - { name: status, type: enum, source: system, description: "Line lifecycle", constraints: "NOT_STARTED | IN_PROGRESS | PAUSED | COMPLETED" }

  - name: PartLine
    parent: RepairOrder
    common_fields: true
    fields:
      - { name: repair_order_id, type: string, source: input, description: "FK -> RepairOrder.id; owning repair order" }
      - { name: part_number, type: string, source: input, description: "Manufacturer part number" }
      - { name: description, type: string, source: input, description: "Part description" }
      - { name: quantity, type: integer, source: input, description: "Number of units; > 0", constraints: "> 0" }
      - { name: unit_cost_cents, type: integer, source: input, description: "Per-unit acquisition cost in cents; >= 0", constraints: ">= 0" }
      - { name: markup_mode, type: enum, source: input, default: "MARGINAL", description: "Markup matrix application mode", constraints: "MARGINAL | FLAT_BRACKET" }
      - { name: has_core, type: boolean, source: input, default: false, description: "True when this part carries a returnable core" }
      - { name: core_deposit_cents, type: integer, source: input, description: "Per-unit core deposit in cents when has_core; >= 0", default: 0, constraints: ">= 0" }
      - { name: is_warranty, type: boolean, source: input, default: false, description: "True when this part is warranty replacement billed at zero on a comeback RO" }
      - { name: extended_charge_cents, type: integer, source: computed, default: 0, description: "Rounded marked-up charge for quantity units per calc parts_markup" }
      - { name: status, type: enum, source: system, description: "Part line lifecycle", constraints: "QUOTED | INSTALLED | RETURNED" }

  - name: CoreCharge
    parent: RepairOrder
    common_fields: true
    fields:
      - { name: repair_order_id, type: string, source: input, description: "FK -> RepairOrder.id; owning repair order" }
      - { name: part_line_id, type: string, source: input, description: "FK -> PartLine.id; the part this core deposit is attached to" }
      - { name: deposit_cents, type: integer, source: computed, description: "Total core deposit = part_line.quantity * part_line.core_deposit_cents at creation" }
      - { name: refunded_cents, type: integer, source: computed, default: 0, description: "Amount refunded when CORE_RETURNED (== deposit_cents); 0 otherwise" }
      - { name: status, type: enum, source: system, description: "Core lifecycle", constraints: "CHARGED | CORE_RETURNED | FORFEITED" }

  - name: Inspection
    parent: RepairOrder
    common_fields: true
    fields:
      - { name: repair_order_id, type: string, source: input, description: "FK -> RepairOrder.id; inspected repair order" }
      - { name: technician_id, type: string, source: input, description: "FK -> Technician.id; performing technician" }
      - { name: items, type: array, source: input, description: "Multi-point items, each { point_name, severity (GREEN|YELLOW|RED), note? }; appended via POST /inspections/{id}/items" }
      - { name: worst_severity, type: enum, source: computed, default: "GREEN", description: "RED if any item RED, else YELLOW if any YELLOW, else GREEN" }
      - { name: red_item_count, type: integer, source: computed, default: 0, description: "Count of items with severity RED" }
      - { name: status, type: enum, source: system, description: "Inspection lifecycle", constraints: "DRAFT | SUBMITTED | REVIEWED" }

  - name: RecommendedJob
    parent: Inspection
    common_fields: true
    fields:
      - { name: inspection_id, type: string, source: input, description: "FK -> Inspection.id; inspection that surfaced this recommendation" }
      - { name: repair_order_id, type: string, source: input, description: "FK -> RepairOrder.id; RO the approved work materialises onto" }
      - { name: labor_operation_id, type: string, source: input, description: "FK -> LaborOperation.id; operation to perform if approved" }
      - { name: part_number, type: string, source: input, description: "Part to install if approved", default: null }
      - { name: part_quantity, type: integer, source: input, default: 0, description: "Quantity of part if approved; >= 0", constraints: ">= 0" }
      - { name: part_unit_cost_cents, type: integer, source: input, default: 0, description: "Per-unit cost of part if approved; >= 0", constraints: ">= 0" }
      - { name: has_core, type: boolean, source: input, default: false, description: "True when the recommended part carries a returnable core" }
      - { name: core_deposit_cents, type: integer, source: input, default: 0, description: "Per-unit core deposit applied if approved and has_core; >= 0", constraints: ">= 0" }
      - { name: estimated_value_cents, type: integer, source: computed, description: "Estimated sell price (FLAT_BRACKET-marked-up parts + flat-rate labor) computed at recommendation time" }
      - { name: severity, type: enum, source: input, default: "YELLOW", description: "Urgency carried from the inspection point", constraints: "YELLOW | RED" }
      - { name: created_labor_line_id, type: string, source: system, description: "Back-reference id of the LaborLine materialised on approval (discover via this RecommendedJob)", default: null }
      - { name: created_part_line_id, type: string, source: system, description: "Back-reference id of the PartLine materialised on approval (discover via this RecommendedJob)", default: null }
      - { name: status, type: enum, source: system, description: "Approval lifecycle", constraints: "PENDING | APPROVED | DECLINED | DEFERRED" }

# =============================================================================
# 1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: RepairOrder
    initial_state: ESTIMATE
    terminal_states: [CLOSED, CANCELLED]
    transitions:
      - from: ESTIMATE
        to: APPROVED
        trigger: "POST /repair-orders/{id}/authorize (customer signs the estimate snapshot)"
        actor: Customer
        preconditions:
          - "RO has at least one LaborLine or PartLine OR at least one APPROVED RecommendedJob (ERR_NOTHING_TO_AUTHORIZE)"
          - "Acting customer owns the RO's vehicle (ERR_FORBIDDEN_FOR_ROLE)"
          - "expected_repair_order_version matches RepairOrder.version (ERR_STALE_VERSION)"
        side_effects:
          - "Snapshot authorized_total_cents = RepairOrder.grand_total_cents; authorized_version = version after this mutation"
          - "RepairOrder.status -> APPROVED"
          - "increments RepairOrder.version by 1"

      - from: APPROVED
        to: IN_PROGRESS
        trigger: "POST /repair-orders/{id}/transition {action: START}"
        actor: ServiceAdvisor
        preconditions:
          - "RO is APPROVED (ERR_INVALID_STATE)"
          - "RO has an assigned bay_id (ERR_BAY_NOT_ASSIGNED)"
        side_effects:
          - "RepairOrder.status -> IN_PROGRESS"

      - from: IN_PROGRESS
        to: ON_HOLD
        trigger: "POST /repair-orders/{id}/transition {action: HOLD}"
        actor: ServiceAdvisor
        preconditions:
          - "RO is IN_PROGRESS (ERR_INVALID_STATE)"
        side_effects:
          - "RepairOrder.status -> ON_HOLD"
          - "Each IN_PROGRESS LaborLine -> PAUSED; if it has an open_clock_at, auto-close that session (actual_hours += now - open_clock_at; open_clock_at=null; that tech.clocked_labor_line_id=null)"

      - from: ON_HOLD
        to: IN_PROGRESS
        trigger: "POST /repair-orders/{id}/transition {action: RESUME}"
        actor: ServiceAdvisor
        preconditions:
          - "RO is ON_HOLD (ERR_INVALID_STATE)"
        side_effects:
          - "RepairOrder.status -> IN_PROGRESS"

      - from: IN_PROGRESS
        to: COMPLETED
        trigger: "POST /repair-orders/{id}/complete"
        actor: Technician
        preconditions:
          - "RO is IN_PROGRESS (ERR_INVALID_STATE)"
          - "Every LaborLine on the RO is COMPLETED (ERR_LABOR_NOT_DONE)"
          - "The RO's Inspection (if one exists) is SUBMITTED or REVIEWED (ERR_INSPECTION_NOT_SUBMITTED)"
          - "If any inspection item is RED, no RED-severity RecommendedJob may still be PENDING (ERR_RED_WORK_UNRESOLVED)"
        side_effects:
          - "RepairOrder.status -> COMPLETED"
          - "Cascade complete-credit (link 1->2: LaborLine credits Technician): for each COMPLETED non-warranty LaborLine with a technician, technician.banked_flat_hours += book_hours, technician.banked_actual_hours += actual_hours, then recompute technician.efficiency_pct"
          - "If RO is a comeback: for each warranty LaborLine, debit the ORIGINAL RO's assigned technician.banked_flat_hours -= that line's book_hours (warranty penalty), then recompute that tech's efficiency_pct"
          - "Recompute repair_order_total"

      - from: COMPLETED
        to: INVOICED
        trigger: "POST /repair-orders/{id}/transition {action: INVOICE}"
        actor: ServiceAdvisor
        preconditions:
          - "RO is COMPLETED (ERR_INVALID_STATE)"
        side_effects:
          - "RepairOrder.status -> INVOICED (grand_total_cents frozen as the invoiced amount)"

      - from: INVOICED
        to: CLOSED
        trigger: "POST /repair-orders/{id}/transition {action: CLOSE}"
        actor: ServiceAdvisor
        preconditions:
          - "RO is INVOICED (ERR_INVALID_STATE)"
          - "No CoreCharge on the RO is still CHARGED (ERR_CORE_OUTSTANDING)"
        side_effects:
          - "RepairOrder.status -> CLOSED; set closed_at = now and close_odometer_miles = vehicle.odometer_miles (anchors warranty window)"

      - from: ESTIMATE
        to: CANCELLED
        trigger: "POST /repair-orders/{id}/transition {action: CANCEL}"
        actor: ServiceAdvisor
        preconditions:
          - "RO is ESTIMATE or APPROVED (ERR_INVALID_STATE)"
        side_effects:
          - "RepairOrder.status -> CANCELLED"
          - "Each CHARGED CoreCharge -> FORFEITED"

      - from: APPROVED
        to: CANCELLED
        trigger: "POST /repair-orders/{id}/transition {action: CANCEL}"
        actor: ServiceAdvisor
        preconditions:
          - "RO is ESTIMATE or APPROVED (ERR_INVALID_STATE)"
        side_effects:
          - "RepairOrder.status -> CANCELLED"
          - "Each CHARGED CoreCharge -> FORFEITED"

  - entity: LaborLine
    initial_state: NOT_STARTED
    terminal_states: [COMPLETED]
    transitions:
      - from: NOT_STARTED
        to: IN_PROGRESS
        trigger: "POST /labor-lines/{id}/clock-in (first session)"
        actor: Technician
        preconditions:
          - "Owning RO is IN_PROGRESS (ERR_INVALID_STATE)"
          - "Acting technician is not already clocked in elsewhere (technician.clocked_labor_line_id is null) (ERR_TECH_DOUBLE_CLOCKED)"
          - "clock_in is at least CLEANUP_BUFFER_MINUTES after technician.last_clock_out_at (ERR_TECH_DOUBLE_CLOCKED)"
        side_effects:
          - "LaborLine.open_clock_at = clock_in; LaborLine.status -> IN_PROGRESS; technician.clocked_labor_line_id = this line"

      - from: IN_PROGRESS
        to: IN_PROGRESS
        trigger: "POST /labor-lines/{id}/clock-out"
        actor: Technician
        preconditions:
          - "LaborLine has an open session (open_clock_at not null) (ERR_INVALID_STATE)"
          - "clock_out > open_clock_at (ERR_INVALID_REQUEST)"
        side_effects:
          - "actual_hours += (clock_out - open_clock_at) in hours; open_clock_at = null; technician.clocked_labor_line_id = null; technician.last_clock_out_at = clock_out"

      - from: IN_PROGRESS
        to: PAUSED
        trigger: "system (owning RO -> ON_HOLD)"
        actor: system
        preconditions: []
        side_effects:
          - "LaborLine.status -> PAUSED; open session (if any) auto-closed and accumulated into actual_hours"

      - from: PAUSED
        to: IN_PROGRESS
        trigger: "POST /labor-lines/{id}/clock-in (re-clock after resume)"
        actor: Technician
        preconditions:
          - "Owning RO is IN_PROGRESS (ERR_INVALID_STATE)"
          - "Acting technician is not already clocked in elsewhere (ERR_TECH_DOUBLE_CLOCKED)"
        side_effects:
          - "LaborLine.open_clock_at = clock_in; LaborLine.status -> IN_PROGRESS; technician.clocked_labor_line_id = this line"

      - from: IN_PROGRESS
        to: COMPLETED
        trigger: "POST /labor-lines/{id}/complete"
        actor: Technician
        preconditions:
          - "LaborLine is IN_PROGRESS or PAUSED (ERR_INVALID_STATE)"
          - "No open session remains (open_clock_at is null) (ERR_OPEN_TIME_ENTRY)"
        side_effects:
          - "LaborLine.status -> COMPLETED; compute charge_cents per calc labor_charge; recompute repair_order_total"

  - entity: RecommendedJob
    initial_state: PENDING
    terminal_states: [DECLINED]
    transitions:
      - from: PENDING
        to: APPROVED
        trigger: "POST /recommended-jobs/{id}/decision {decision: APPROVE}"
        actor: Customer
        preconditions:
          - "Owning RO is ESTIMATE, APPROVED, IN_PROGRESS, or ON_HOLD (ERR_INVALID_STATE)"
          - "Acting customer owns the RO's vehicle (ERR_FORBIDDEN_FOR_ROLE)"
        side_effects:
          - "RecommendedJob.status -> APPROVED"
          - "cascade-approve link 1 (RecommendedJob -> LaborLine): create a LaborLine on the RO from labor_operation_id; set created_labor_line_id"
          - "cascade-approve link 2 (LaborLine/PartLine -> RO totals): if part_number set, create a PartLine on the RO; set created_part_line_id; this PartLine creation recomputes parts_total"
          - "cascade-approve link 3 (PartLine -> CoreCharge -> RO core): if the created PartLine.has_core, its creation cascades a CoreCharge (CHARGED) which itself adds deposit to RepairOrder.core_deposit_total_cents"
          - "Recompute repair_order_total and approved_work_value_cents"

      - from: PENDING
        to: DECLINED
        trigger: "POST /recommended-jobs/{id}/decision {decision: DECLINE}"
        actor: Customer
        preconditions:
          - "Acting customer owns the RO's vehicle (ERR_FORBIDDEN_FOR_ROLE)"
        side_effects:
          - "RecommendedJob.status -> DECLINED"

      - from: PENDING
        to: DEFERRED
        trigger: "POST /recommended-jobs/{id}/decision {decision: DEFER}"
        actor: Customer
        preconditions:
          - "Acting customer owns the RO's vehicle (ERR_FORBIDDEN_FOR_ROLE)"
        side_effects:
          - "RecommendedJob.status -> DEFERRED"

      - from: DEFERRED
        to: APPROVED
        trigger: "POST /recommended-jobs/{id}/decision {decision: APPROVE}"
        actor: Customer
        preconditions:
          - "Owning RO is ESTIMATE, APPROVED, IN_PROGRESS, or ON_HOLD (ERR_INVALID_STATE)"
          - "Acting customer owns the RO's vehicle (ERR_FORBIDDEN_FOR_ROLE)"
        side_effects:
          - "Same materialisation cascade as PENDING -> APPROVED"
          - "Recompute repair_order_total and approved_work_value_cents"

      - from: DEFERRED
        to: DECLINED
        trigger: "POST /recommended-jobs/{id}/decision {decision: DECLINE}"
        actor: Customer
        preconditions:
          - "Acting customer owns the RO's vehicle (ERR_FORBIDDEN_FOR_ROLE)"
        side_effects:
          - "RecommendedJob.status -> DECLINED"

  - entity: CoreCharge
    initial_state: CHARGED
    terminal_states: [CORE_RETURNED, FORFEITED]
    transitions:
      - from: CHARGED
        to: CORE_RETURNED
        trigger: "POST /core-charges/{id}/return"
        actor: PartsManager
        preconditions:
          - "CoreCharge is CHARGED (ERR_INVALID_STATE)"
          - "Owning RO is not CLOSED or CANCELLED (ERR_INVALID_STATE)"
        side_effects:
          - "CoreCharge.status -> CORE_RETURNED; refunded_cents = deposit_cents"
          - "RepairOrder.core_deposit_total_cents -= deposit_cents (compensating action restoring the core invariant); recompute repair_order_total"

      - from: CHARGED
        to: FORFEITED
        trigger: "POST /core-charges/{id}/forfeit OR system (owning RO CANCELLED)"
        actor: PartsManager | system
        preconditions:
          - "CoreCharge is CHARGED (ERR_INVALID_STATE)"
        side_effects:
          - "CoreCharge.status -> FORFEITED (deposit retained by shop; core_deposit_total_cents unchanged — forfeited deposits remain billed)"

  - entity: Inspection
    initial_state: DRAFT
    terminal_states: [REVIEWED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /inspections/{id}/submit"
        actor: Technician
        preconditions:
          - "Inspection is DRAFT (ERR_INVALID_STATE)"
          - "Inspection has at least one item (ERR_INSPECTION_EMPTY)"
        side_effects:
          - "Recompute worst_severity and red_item_count from items"
          - "Inspection.status -> SUBMITTED"

      - from: SUBMITTED
        to: REVIEWED
        trigger: "POST /inspections/{id}/review"
        actor: ServiceAdvisor
        preconditions:
          - "Inspection is SUBMITTED (ERR_INVALID_STATE)"
        side_effects:
          - "Inspection.status -> REVIEWED"

# =============================================================================
# 1.2.1 Concurrency Rules
# =============================================================================
concurrency_rules:
  - rule_id: authorize-supersede-stale-ro
    parent_entity: RepairOrder
    write_endpoint: "POST /repair-orders/{id}/authorize"
    occ_field: "expected_repair_order_version"
    description: |
      Authorizing a RepairOrder whose version has advanced since the client last
      observed it is rejected. A fresh authorization legitimately re-snapshots the
      grand total and supersedes the prior authorization; if another writer has
      already authorized or otherwise mutated the RO — bumping its version — the
      current writer's view of the estimate total is stale and must be refused, so
      the customer never signs against a superseded total.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# 1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: labor_charge
    trigger: "LaborLine creation (FLAT_RATE: charge known immediately); each clock-out (T&M provisional); LaborLine completion (finalize); always recomputed by repair_order_total"
    algorithm: dual_variant
    formula: |
      effective_rate = line.rate_cents if line.rate_cents is not null
                       else labor_operation.default_rate_cents
      if line.is_warranty:
        charge_cents = 0
      elif line.billing_method == "FLAT_RATE":
        # FLAT_RATE charge is fully determined at line creation (book_hours snapshot * rate);
        # it is stable through the estimate, never depends on actual clocked hours.
        charge_cents = round_half_up(line.book_hours   * effective_rate)   # bills BOOK hours, ignores actual
      else:  # TIME_AND_MATERIALS
        # T&M charge tracks actual_hours; it is 0 until the first clock-out, provisional
        # while work proceeds, and final at completion.
        charge_cents = round_half_up(line.actual_hours * effective_rate)   # bills ACTUAL hours, ignores book
    input_set: "Single LaborLine; book_hours snapshotted from LaborOperation; actual_hours = sum of closed clock sessions"
    constants: {}
    precision: "round_half_up to whole cents; book_hours/actual_hours carry 3 decimal places"
    variants:
      - name: flat_rate
        when: "billing_method == FLAT_RATE"
        difference: "Charge = book_hours * rate; actual clocked hours are irrelevant to the bill"
      - name: time_and_materials
        when: "billing_method == TIME_AND_MATERIALS"
        difference: "Charge = actual_hours * rate; book_hours are irrelevant to the bill — same line, different number"

  - name: parts_markup
    trigger: "PartLine creation/install; recomputed by repair_order_total"
    algorithm: tiered_pricing
    formula: |
      if line.is_warranty: extended_charge_cents = 0; return
      c = line.unit_cost_cents                 # per-unit cost drives tier selection
      tiers = MarkupTier rows sorted by tier_index ASC
      if line.markup_mode == "FLAT_BRACKET":
        # the WHOLE per-unit cost is marked up at the single tier whose band
        # [lower_bound_cents, upper_bound_cents) contains c
        t = the tier where lower_bound_cents <= c < (upper_bound_cents or +inf)
        if no such tier: raise ERR_MARKUP_TIER_MISSING
        unit_sell = round_half_up(c * (1 + t.markup_pct))
      else:  # MARGINAL
        # the cost is SLICED across tier bands; each slice marked up at its band rate
        if the tiers do not cover [0, c): raise ERR_MARKUP_TIER_MISSING
        unit_sell = 0
        for t in tiers (ascending by tier_index):
          band_lo = t.lower_bound_cents
          band_hi = t.upper_bound_cents or +inf
          slice = max(0, min(c, band_hi) - band_lo)   # overlap of [0,c) with [band_lo, band_hi)
          if slice > 0:
            unit_sell += round_half_up(slice * (1 + t.markup_pct))   # round per band slice
      extended_charge_cents = unit_sell * line.quantity
    input_set: "Single PartLine + full MarkupTier matrix; tier selection by unit_cost_cents"
    constants: {}
    precision: "round_half_up to whole cents per unit (FLAT_BRACKET) or per band slice (MARGINAL), then multiply by quantity"
    variants:
      - name: flat_bracket
        when: "markup_mode == FLAT_BRACKET"
        difference: "Entire unit cost marked up at the single containing bracket's rate"
      - name: marginal
        when: "markup_mode == MARGINAL"
        difference: "Cost sliced per band, each slice at its own rate — same cost, different sell price"

  - name: repair_order_total
    trigger: "LaborLine/PartLine/CoreCharge mutation; RecommendedJob approval; RO complete"
    algorithm: aggregation
    formula: |
      # ROUNDING ORDER PINNED: round each line FIRST, then sum (round-per-line-then-sum).
      labor_total_cents = sum( line.charge_cents for line in this RO's LaborLines )            # each already rounded
      parts_total_cents = sum( line.extended_charge_cents for line in PartLines where status != RETURNED )  # each already rounded
      core_deposit_total_cents = sum( cc.deposit_cents for cc in CoreCharges where status == CHARGED )
      taxable_subtotal = labor_total_cents + parts_total_cents     # core deposits are NOT taxable
      tax_cents = round_half_up(taxable_subtotal * RepairOrder.tax_rate)   # tax rounded once on the subtotal
      grand_total_cents = labor_total_cents + parts_total_cents + core_deposit_total_cents + tax_cents
    input_set: "All non-RETURNED PartLines, all LaborLines, all CHARGED CoreCharges on the RO"
    constants: {}
    precision: "round_half_up to whole cents; rounding applied per line and once on tax, NOT on the grand sum"

  - name: technician_efficiency
    trigger: "RO complete (credits/debits banked hours); GET /technicians/{id}"
    algorithm: aggregation
    formula: |
      banked_flat_hours   = sum( ll.book_hours   for COMPLETED non-warranty LaborLines credited to tech )
                            - sum( orig.book_hours for warranty-comeback lines debiting this tech )
      banked_actual_hours = sum( ll.actual_hours for COMPLETED non-warranty LaborLines credited to tech )
      if banked_actual_hours == 0:
        efficiency_pct = null            # BOUNDARY: zero actual hours -> undefined (not 0, not div-by-zero)
      else:
        efficiency_pct = round_half_up_1dp( 100 * banked_flat_hours / banked_actual_hours )
    input_set: "COMPLETED LaborLines whose technician_id == tech, minus warranty-comeback debits on the original tech"
    constants: {}
    precision: "efficiency_pct to 1 decimal place, round_half_up; hours to 3 decimals"

  - name: warranty_comeback_window
    trigger: "POST /repair-orders with comeback_of_ro_id; adding is_warranty lines"
    algorithm: threshold
    formula: |
      original = RepairOrder[comeback_of_ro_id]
      The comeback is within warranty iff BOTH hold:
        now <= original.closed_at + WARRANTY_DAYS days                    (INCLUSIVE boundary at exactly +WARRANTY_DAYS)
        comeback.vehicle.odometer_miles <= original.close_odometer_miles + WARRANTY_MILES   (INCLUSIVE)
      Outside either bound: ERR_WARRANTY_EXPIRED. (original must be CLOSED, so closed_at is set.)
      A within-warranty comeback's is_warranty lines bill at 0 (see labor_charge/parts_markup)
      and, on comeback complete, debit the ORIGINAL tech's banked_flat_hours (technician_efficiency).
    input_set: "Original closed RO (closed_at, close_odometer_miles); comeback RO's vehicle odometer; current clock"
    constants:
      WARRANTY_DAYS: 90
      WARRANTY_MILES: 4000
      CLEANUP_BUFFER_MINUTES: 10
    precision: "day arithmetic on ISO timestamps; miles are integers"

# =============================================================================
# 1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers present and well-formed"
    error_id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER
    http_status: 400
    applies_to: all

  - priority: 2
    category: auth
    check: "Role is permitted for this endpoint per RBAC matrix (and customer owns the vehicle for ownership-scoped actions)"
    error_id: ERR_FORBIDDEN_FOR_ROLE
    http_status: 403
    applies_to: all

  - priority: 3
    category: existence
    check: "All path-referenced resources exist (validated left-to-right)"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: all resource endpoints

  - priority: 4
    category: business_referential
    check: "Body-referenced FK targets exist (labor_operation_id, technician_id, customer_id, vehicle_id, bay_id, comeback_of_ro_id)"
    error_id: ERR_REFERENCED_ENTITY_NOT_FOUND
    http_status: 422
    applies_to: "POST creating ROs / lines / recommended jobs / schedule"

  - priority: 5
    category: validation
    check: "Body well-formed: required fields present, numeric fields in range (quantity > 0, hours > 0, costs >= 0, clock_out > clock_in, scheduled_end > scheduled_start), enum action/decision valid"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: all write endpoints

  - priority: 6
    category: state
    check: "Target resource is in a state where this transition is allowed"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: all transition endpoints

  - priority: 7
    category: business_safety
    check: "RO with a RED inspection item cannot be COMPLETED while a RED RecommendedJob is still PENDING"
    error_id: ERR_RED_WORK_UNRESOLVED
    http_status: 409
    applies_to: "POST /repair-orders/{id}/complete"

  - priority: 8
    category: business_temporal
    check: "Assigned bay window must not overlap another RO's window on the same bay (half-open [start,end); touching endpoints allowed)"
    error_id: ERR_BAY_DOUBLE_BOOKED
    http_status: 409
    applies_to: "POST /repair-orders/{id}/schedule"

  - priority: 9
    category: business_temporal
    check: "A technician cannot clock in while already clocked in elsewhere, nor within CLEANUP_BUFFER_MINUTES of their last clock-out (closed intervals + buffer)"
    error_id: ERR_TECH_DOUBLE_CLOCKED
    http_status: 409
    applies_to: "POST /labor-lines/{id}/clock-in"

  - priority: 10
    category: business_constraint
    check: "RO cannot start without an assigned bay"
    error_id: ERR_BAY_NOT_ASSIGNED
    http_status: 409
    applies_to: "POST /repair-orders/{id}/transition {action: START}"

  - priority: 11
    category: business_constraint
    check: "RO cannot complete unless every LaborLine is COMPLETED"
    error_id: ERR_LABOR_NOT_DONE
    http_status: 409
    applies_to: "POST /repair-orders/{id}/complete"

  - priority: 12
    category: business_constraint
    check: "RO cannot complete unless its Inspection (if any) is SUBMITTED or REVIEWED"
    error_id: ERR_INSPECTION_NOT_SUBMITTED
    http_status: 409
    applies_to: "POST /repair-orders/{id}/complete"

  - priority: 13
    category: business_constraint
    check: "LaborLine cannot complete while an open clock session remains"
    error_id: ERR_OPEN_TIME_ENTRY
    http_status: 409
    applies_to: "POST /labor-lines/{id}/complete"

  - priority: 14
    category: business_fiscal
    check: "RO cannot close while any CoreCharge is still CHARGED"
    error_id: ERR_CORE_OUTSTANDING
    http_status: 409
    applies_to: "POST /repair-orders/{id}/transition {action: CLOSE}"

  - priority: 15
    category: business_constraint
    check: "Authorize requires at least one billable line or one APPROVED recommended job"
    error_id: ERR_NOTHING_TO_AUTHORIZE
    http_status: 409
    applies_to: "POST /repair-orders/{id}/authorize"

  - priority: 16
    category: business_temporal
    check: "Comeback/warranty claim honored only within WARRANTY_DAYS and WARRANTY_MILES of the original RO"
    error_id: ERR_WARRANTY_EXPIRED
    http_status: 409
    applies_to: "POST /repair-orders (with comeback_of_ro_id), POST lines with is_warranty=true"

  - priority: 17
    category: business_constraint
    check: "MarkupTier matrix must cover the part's unit cost; gap -> error"
    error_id: ERR_MARKUP_TIER_MISSING
    http_status: 409
    applies_to: "POST /repair-orders/{id}/part-lines"

  - priority: 18
    category: business_constraint
    check: "Lines cannot be added to an RO in COMPLETED/INVOICED/CLOSED/CANCELLED"
    error_id: ERR_RO_NOT_EDITABLE
    http_status: 409
    applies_to: "POST /repair-orders/{id}/labor-lines, POST /repair-orders/{id}/part-lines"

  - priority: 19
    category: concurrency
    check: "expected_repair_order_version must equal RepairOrder.version on authorize"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /repair-orders/{id}/authorize"

# =============================================================================
# 1.5 API Endpoint Table
# =============================================================================
endpoints:
  # --- Customer ---
  - method: POST
    path: "/customers"
    description: "Create a customer"
    roles: [ServiceAdvisor, ShopManager]
    code: 201
    input: [full_name, phone, email]
    output: Customer
    side_effects: []

  - method: GET
    path: "/customers/{id}"
    description: "Get a customer"
    roles: [ServiceAdvisor, ShopManager, PartsManager, Technician, Customer]
    code: 200
    input: []
    output: Customer
    side_effects: []

  - method: GET
    path: "/customers/{id}/vehicles"
    description: "List a customer's vehicles (FK reverse-reachability for Vehicle.customer_id)"
    roles: [ServiceAdvisor, ShopManager, PartsManager, Technician, Customer]
    code: 200
    input: []
    output: "Vehicle[]"
    side_effects: []

  # --- Vehicle ---
  - method: POST
    path: "/vehicles"
    description: "Create a vehicle"
    roles: [ServiceAdvisor, ShopManager]
    code: 201
    input: [customer_id, vin, make, model, model_year, odometer_miles]
    output: Vehicle
    side_effects: ["ERR_DUPLICATE_VIN if vin already exists"]

  - method: GET
    path: "/vehicles/{id}"
    description: "Get a vehicle"
    roles: [ServiceAdvisor, ShopManager, PartsManager, Technician, Customer]
    code: 200
    input: []
    output: Vehicle
    side_effects: []

  # --- Technician ---
  - method: POST
    path: "/technicians"
    description: "Create a technician"
    roles: [ShopManager]
    code: 201
    input: [full_name, "skill_level?"]
    output: Technician
    side_effects: ["banked_flat_hours=0, banked_actual_hours=0, efficiency_pct=null"]

  - method: GET
    path: "/technicians/{id}"
    description: "Get a technician (includes computed efficiency_pct)"
    roles: [ServiceAdvisor, ShopManager, PartsManager, Technician]
    code: 200
    input: []
    output: Technician
    side_effects: ["recompute efficiency_pct from banked hours"]

  # --- ServiceBay ---
  - method: POST
    path: "/service-bays"
    description: "Create a service bay"
    roles: [ShopManager]
    code: 201
    input: [bay_name, "bay_type?"]
    output: ServiceBay
    side_effects: ["ERR_INVALID_REQUEST on duplicate bay_name"]

  # --- LaborOperation (flat-rate catalog) ---
  - method: POST
    path: "/labor-operations"
    description: "Create a flat-rate labor operation (book-hours catalog entry)"
    roles: [ShopManager, ServiceAdvisor]
    code: 201
    input: [op_code, description, book_hours, default_rate_cents]
    output: LaborOperation
    side_effects: ["ERR_INVALID_REQUEST on duplicate op_code or book_hours<=0"]

  # --- MarkupTier (parts markup matrix) ---
  - method: POST
    path: "/markup-tiers"
    description: "Create a parts markup matrix tier"
    roles: [PartsManager, ShopManager]
    code: 201
    input: [tier_index, lower_bound_cents, "upper_bound_cents?", markup_pct]
    output: MarkupTier
    side_effects: ["ERR_INVALID_REQUEST on duplicate tier_index or overlapping band"]

  - method: GET
    path: "/markup-tiers"
    description: "List the markup matrix, ordered by tier_index"
    roles: [PartsManager, ShopManager, ServiceAdvisor]
    code: 200
    input: []
    output: "MarkupTier[]"
    side_effects: []

  # --- RepairOrder ---
  - method: POST
    path: "/repair-orders"
    description: "Create a repair order (ESTIMATE); comeback_of_ro_id flags a warranty comeback"
    roles: [ServiceAdvisor, ShopManager]
    code: 201
    input: [customer_id, vehicle_id, "tax_rate?", "comeback_of_ro_id?"]
    output: RepairOrder
    side_effects:
      - "status=ESTIMATE; is_comeback = comeback_of_ro_id is not null"
      - "If comeback_of_ro_id set: validate warranty window (ERR_WARRANTY_EXPIRED)"

  - method: GET
    path: "/repair-orders/{id}"
    description: "Get a repair order (with computed totals)"
    roles: [ServiceAdvisor, ShopManager, PartsManager, Technician, Customer]
    code: 200
    input: []
    output: RepairOrder
    side_effects: []

  - method: GET
    path: "/repair-orders"
    description: "List repair orders; filter by customer_id, vehicle_id, bay_id, comeback_of_ro_id, status (FK reverse-reachability)"
    roles: [ServiceAdvisor, ShopManager, PartsManager, Technician, Customer]
    code: 200
    input: ["customer_id?", "vehicle_id?", "bay_id?", "comeback_of_ro_id?", "status?"]
    output: "RepairOrder[]"
    side_effects: []

  - method: POST
    path: "/repair-orders/{id}/schedule"
    description: "Assign a bay and time window to the RO"
    roles: [ServiceAdvisor, ShopManager]
    code: 200
    input: [bay_id, scheduled_start, scheduled_end]
    output: RepairOrder
    side_effects:
      - "Validate half-open [scheduled_start, scheduled_end) does not overlap another RO on bay_id (ERR_BAY_DOUBLE_BOOKED)"
      - "Set bay_id, scheduled_start, scheduled_end"

  - method: POST
    path: "/repair-orders/{id}/authorize"
    description: "Customer authorizes the current estimate snapshot (OCC-guarded supersede)"
    roles: [Customer]
    code: 200
    input: [expected_repair_order_version]
    output: RepairOrder
    side_effects:
      - "ERR_STALE_VERSION if expected_repair_order_version != RepairOrder.version"
      - "authorized_total_cents = grand_total_cents; authorized_version = new version"
      - "RepairOrder.status ESTIMATE -> APPROVED; increments RepairOrder.version by 1"

  - method: POST
    path: "/repair-orders/{id}/transition"
    description: "Drive simple RO lifecycle moves: START, HOLD, RESUME, INVOICE, CLOSE, CANCEL"
    roles: [ServiceAdvisor, ShopManager]
    code: 200
    input: [action]
    output: RepairOrder
    side_effects:
      - "action=START: APPROVED -> IN_PROGRESS (requires bay; ERR_BAY_NOT_ASSIGNED)"
      - "action=HOLD: IN_PROGRESS -> ON_HOLD (pause labor lines, auto-close open clocks)"
      - "action=RESUME: ON_HOLD -> IN_PROGRESS"
      - "action=INVOICE: COMPLETED -> INVOICED"
      - "action=CLOSE: INVOICED -> CLOSED (requires no CHARGED core; sets closed_at, close_odometer_miles)"
      - "action=CANCEL: ESTIMATE/APPROVED -> CANCELLED (forfeit CHARGED cores)"

  - method: POST
    path: "/repair-orders/{id}/complete"
    description: "Complete RO (IN_PROGRESS -> COMPLETED); credit/debit technician banked hours"
    roles: [Technician, ShopManager]
    code: 200
    input: []
    output: RepairOrder
    side_effects:
      - "Validate all LaborLines COMPLETED, inspection submitted, no RED PENDING jobs"
      - "Credit each tech's banked hours; warranty comeback debits the original tech"
      - "Recompute repair_order_total; status -> COMPLETED"

  # --- LaborLine ---
  - method: POST
    path: "/repair-orders/{id}/labor-lines"
    description: "Add a labor line to the RO"
    roles: [ServiceAdvisor, ShopManager, Technician]
    code: 201
    input: [labor_operation_id, "technician_id?", "billing_method?", "rate_cents?", "is_warranty?"]
    output: LaborLine
    side_effects:
      - "Snapshot book_hours from LaborOperation; status=NOT_STARTED"
      - "Compute charge_cents via labor_charge: FLAT_RATE -> book_hours*rate immediately; T&M -> 0 (no actual hours yet); is_warranty -> 0"
      - "Recompute repair_order_total"
      - "ERR_RO_NOT_EDITABLE if RO is COMPLETED/INVOICED/CLOSED/CANCELLED"
      - "If is_warranty=true: validate owning RO is a comeback within warranty window (ERR_WARRANTY_EXPIRED)"

  - method: GET
    path: "/repair-orders/{id}/labor-lines"
    description: "List labor lines for an RO (FK reverse-reachability for LaborLine.repair_order_id)"
    roles: [ServiceAdvisor, ShopManager, PartsManager, Technician, Customer]
    code: 200
    input: []
    output: "LaborLine[]"
    side_effects: []

  - method: GET
    path: "/labor-lines/{id}"
    description: "Get a labor line"
    roles: [ServiceAdvisor, ShopManager, Technician]
    code: 200
    input: []
    output: LaborLine
    side_effects: []

  - method: GET
    path: "/labor-lines"
    description: "List labor lines; filter by technician_id or labor_operation_id (FK reverse-reachability)"
    roles: [ServiceAdvisor, ShopManager, Technician]
    code: 200
    input: ["technician_id?", "labor_operation_id?", "repair_order_id?"]
    output: "LaborLine[]"
    side_effects: []

  - method: POST
    path: "/labor-lines/{id}/clock-in"
    description: "Technician clocks in on a labor line (opens a session)"
    roles: [Technician]
    code: 200
    input: [technician_id, clock_in]
    output: LaborLine
    side_effects:
      - "Validate technician not already clocked in and clock_in respects cleanup buffer (ERR_TECH_DOUBLE_CLOCKED)"
      - "open_clock_at=clock_in; status -> IN_PROGRESS; technician.clocked_labor_line_id set"

  - method: POST
    path: "/labor-lines/{id}/clock-out"
    description: "Technician clocks out of the open session"
    roles: [Technician]
    code: 200
    input: [clock_out]
    output: LaborLine
    side_effects: ["actual_hours += (clock_out - open_clock_at); open_clock_at=null; technician.clocked_labor_line_id=null; technician.last_clock_out_at=clock_out; if T&M, recompute charge_cents and repair_order_total"]

  - method: POST
    path: "/labor-lines/{id}/complete"
    description: "Mark a labor line COMPLETED and compute its charge"
    roles: [Technician, ShopManager]
    code: 200
    input: []
    output: LaborLine
    side_effects: ["requires no open session; status -> COMPLETED; compute charge_cents; recompute repair_order_total"]

  # --- PartLine ---
  - method: POST
    path: "/repair-orders/{id}/part-lines"
    description: "Add a part line to the RO (markup computed from matrix)"
    roles: [PartsManager, ServiceAdvisor, ShopManager]
    code: 201
    input: [part_number, description, quantity, unit_cost_cents, "markup_mode?", "has_core?", "core_deposit_cents?", "is_warranty?"]
    output: PartLine
    side_effects:
      - "Compute extended_charge_cents via parts_markup (ERR_MARKUP_TIER_MISSING if matrix gap)"
      - "status=QUOTED; ERR_RO_NOT_EDITABLE if RO terminal"
      - "If has_core: cascade-create a CoreCharge (CHARGED) -> RepairOrder.core_deposit_total_cents += deposit"
      - "Recompute repair_order_total"

  - method: GET
    path: "/repair-orders/{id}/part-lines"
    description: "List part lines for an RO (FK reverse-reachability for PartLine.repair_order_id)"
    roles: [ServiceAdvisor, ShopManager, PartsManager, Technician, Customer]
    code: 200
    input: []
    output: "PartLine[]"
    side_effects: []

  - method: GET
    path: "/part-lines/{id}"
    description: "Get a part line (with computed markup charge)"
    roles: [ServiceAdvisor, ShopManager, PartsManager]
    code: 200
    input: []
    output: PartLine
    side_effects: []

  - method: POST
    path: "/part-lines/{id}/install"
    description: "Mark a part line INSTALLED"
    roles: [Technician, PartsManager, ShopManager]
    code: 200
    input: []
    output: PartLine
    side_effects: ["status QUOTED -> INSTALLED"]

  # --- CoreCharge ---
  - method: GET
    path: "/repair-orders/{id}/core-charges"
    description: "List core charges for an RO (FK reverse-reachability for CoreCharge.repair_order_id)"
    roles: [ServiceAdvisor, ShopManager, PartsManager, Customer]
    code: 200
    input: []
    output: "CoreCharge[]"
    side_effects: []

  - method: GET
    path: "/core-charges/{id}"
    description: "Get a core charge"
    roles: [ServiceAdvisor, ShopManager, PartsManager]
    code: 200
    input: []
    output: CoreCharge
    side_effects: []

  - method: GET
    path: "/core-charges"
    description: "List core charges; filter by part_line_id (FK reverse-reachability for CoreCharge.part_line_id)"
    roles: [ServiceAdvisor, ShopManager, PartsManager]
    code: 200
    input: ["part_line_id?", "repair_order_id?", "status?"]
    output: "CoreCharge[]"
    side_effects: []

  - method: POST
    path: "/core-charges/{id}/return"
    description: "Record the old core returned; refund the deposit"
    roles: [PartsManager, ShopManager]
    code: 200
    input: []
    output: CoreCharge
    side_effects:
      - "status -> CORE_RETURNED; refunded_cents = deposit_cents"
      - "RepairOrder.core_deposit_total_cents -= deposit_cents; recompute repair_order_total"

  - method: POST
    path: "/core-charges/{id}/forfeit"
    description: "Forfeit the core deposit (core not returned)"
    roles: [PartsManager, ShopManager]
    code: 200
    input: []
    output: CoreCharge
    side_effects: ["status -> FORFEITED (deposit retained, remains billed)"]

  # --- Inspection ---
  - method: POST
    path: "/repair-orders/{id}/inspections"
    description: "Create a multi-point inspection (DRAFT) on the RO"
    roles: [Technician, ShopManager]
    code: 201
    input: [technician_id]
    output: Inspection
    side_effects: ["status=DRAFT; items=[]; worst_severity=GREEN; red_item_count=0"]

  - method: GET
    path: "/repair-orders/{id}/inspections"
    description: "List inspections for an RO (FK reverse-reachability for Inspection.repair_order_id)"
    roles: [ServiceAdvisor, ShopManager, Technician, Customer]
    code: 200
    input: []
    output: "Inspection[]"
    side_effects: []

  - method: GET
    path: "/inspections/{id}"
    description: "Get an inspection (with items and computed severity)"
    roles: [ServiceAdvisor, ShopManager, Technician, Customer]
    code: 200
    input: []
    output: Inspection
    side_effects: []

  - method: GET
    path: "/inspections"
    description: "List inspections; filter by technician_id or repair_order_id (FK reverse-reachability for Inspection.technician_id)"
    roles: [ServiceAdvisor, ShopManager, Technician, Customer]
    code: 200
    input: ["technician_id?", "repair_order_id?", "status?"]
    output: "Inspection[]"
    side_effects: []

  - method: POST
    path: "/inspections/{id}/items"
    description: "Append a multi-point item to a DRAFT inspection"
    roles: [Technician, ShopManager]
    code: 200
    input: [point_name, "severity?", "note?"]
    output: Inspection
    side_effects: ["append item; ERR_INVALID_STATE if inspection not DRAFT"]

  - method: POST
    path: "/inspections/{id}/submit"
    description: "Submit inspection (DRAFT -> SUBMITTED); compute severity rollups"
    roles: [Technician, ShopManager]
    code: 200
    input: []
    output: Inspection
    side_effects: ["recompute worst_severity, red_item_count; status -> SUBMITTED"]

  - method: POST
    path: "/inspections/{id}/review"
    description: "Service advisor reviews inspection (SUBMITTED -> REVIEWED)"
    roles: [ServiceAdvisor, ShopManager]
    code: 200
    input: []
    output: Inspection
    side_effects: ["status -> REVIEWED"]

  # --- RecommendedJob (declined-work approval) ---
  - method: POST
    path: "/inspections/{id}/recommended-jobs"
    description: "Create a recommended job from an inspection finding (PENDING)"
    roles: [Technician, ServiceAdvisor, ShopManager]
    code: 201
    input: [repair_order_id, labor_operation_id, "part_number?", "part_quantity?", "part_unit_cost_cents?", "has_core?", "core_deposit_cents?", "severity?"]
    output: RecommendedJob
    side_effects: ["compute estimated_value_cents; status=PENDING"]

  - method: GET
    path: "/inspections/{id}/recommended-jobs"
    description: "List recommended jobs for an inspection (FK reverse-reachability for RecommendedJob.inspection_id)"
    roles: [ServiceAdvisor, ShopManager, Technician, Customer]
    code: 200
    input: []
    output: "RecommendedJob[]"
    side_effects: []

  - method: GET
    path: "/recommended-jobs/{id}"
    description: "Get a recommended job"
    roles: [ServiceAdvisor, ShopManager, Technician, Customer]
    code: 200
    input: []
    output: RecommendedJob
    side_effects: []

  - method: GET
    path: "/recommended-jobs"
    description: "List recommended jobs; filter by repair_order_id or labor_operation_id (FK reverse-reachability)"
    roles: [ServiceAdvisor, ShopManager, Technician, Customer]
    code: 200
    input: ["repair_order_id?", "labor_operation_id?", "status?"]
    output: "RecommendedJob[]"
    side_effects: []

  - method: POST
    path: "/recommended-jobs/{id}/decision"
    description: "Customer approves/declines/defers recommended work; APPROVE materialises lines"
    roles: [Customer]
    code: 200
    input: [decision]
    output: RecommendedJob
    side_effects:
      - "decision=APPROVE: PENDING/DEFERRED -> APPROVED; create LaborLine (+ optional PartLine + CoreCharge); recompute totals"
      - "decision=DECLINE: -> DECLINED"
      - "decision=DEFER: PENDING -> DEFERRED"

  # --- Test-driving clock ---
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Test-driving: set the server's notion of current UTC time (warranty-window and clock checks read it)"
    roles: [ShopManager]
    code: 200
    input: [to_iso8601]
    output: null
    side_effects: ["server now() returns to_iso8601 until next set"]

# =============================================================================
# 1.6 Error Code Catalog
# =============================================================================
errors:
  # --- Auth / request ---
  - id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER
    http: 400
    condition: "X-User-ID or X-User-Role header missing or malformed"
  - id: ERR_FORBIDDEN_FOR_ROLE
    http: 403
    condition: "Role not permitted for endpoint, or customer acting on a vehicle/RO they do not own"
  - id: ERR_NOT_FOUND
    http: 404
    condition: "Path-referenced resource does not exist"
  - id: ERR_REFERENCED_ENTITY_NOT_FOUND
    http: 422
    condition: "A body FK (labor_operation_id, technician_id, customer_id, vehicle_id, bay_id, comeback_of_ro_id) does not resolve"
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "Malformed body: missing required field, quantity<=0, hours<=0, cost<0, clock_out<=open_clock_at, scheduled_end<=scheduled_start, unknown action/decision, duplicate op_code/tier_index/bay_name"
  - id: ERR_INVALID_PAGINATION
    http: 400
    condition: "limit/offset out of allowed range"
  # --- State ---
  - id: ERR_INVALID_STATE
    http: 409
    condition: "Target resource not in a state where the requested transition is allowed"
  # --- RepairOrder business ---
  - id: ERR_BAY_NOT_ASSIGNED
    http: 409
    condition: "Cannot start an RO with no assigned bay"
  - id: ERR_BAY_DOUBLE_BOOKED
    http: 409
    condition: "Bay window overlaps another RO on the same bay (half-open intervals)"
  - id: ERR_LABOR_NOT_DONE
    http: 409
    condition: "RO complete attempted while a LaborLine is not COMPLETED"
  - id: ERR_INSPECTION_NOT_SUBMITTED
    http: 409
    condition: "RO complete attempted while its inspection is still DRAFT"
  - id: ERR_RED_WORK_UNRESOLVED
    http: 409
    condition: "RO complete attempted while a RED-severity RecommendedJob is still PENDING"
  - id: ERR_CORE_OUTSTANDING
    http: 409
    condition: "RO close attempted while a CoreCharge is still CHARGED"
  - id: ERR_NOTHING_TO_AUTHORIZE
    http: 409
    condition: "Authorize attempted with no billable line and no APPROVED recommended job"
  - id: ERR_RO_NOT_EDITABLE
    http: 409
    condition: "Line add attempted on an RO in COMPLETED/INVOICED/CLOSED/CANCELLED"
  # --- Inspection ---
  - id: ERR_INSPECTION_EMPTY
    http: 409
    condition: "Inspection submit attempted with zero items"
  # --- Parts / markup ---
  - id: ERR_MARKUP_TIER_MISSING
    http: 409
    condition: "No MarkupTier band covers the part's unit_cost_cents"
  # --- Technician / time ---
  - id: ERR_TECH_DOUBLE_CLOCKED
    http: 409
    condition: "Technician already clocked in elsewhere, or clock-in within the cleanup buffer of their last clock-out"
  - id: ERR_OPEN_TIME_ENTRY
    http: 409
    condition: "LaborLine complete attempted while an open clock session remains"
  # --- Warranty ---
  - id: ERR_WARRANTY_EXPIRED
    http: 409
    condition: "Comeback/warranty claim outside WARRANTY_DAYS or WARRANTY_MILES of the original RO"
  # --- Uniqueness ---
  - id: ERR_DUPLICATE_VIN
    http: 409
    condition: "Vehicle vin already exists"
  # --- Concurrency ---
  - id: ERR_STALE_VERSION
    http: 412
    condition: "expected_repair_order_version does not match the RepairOrder's current version on authorize"

# =============================================================================
# 1.7 RBAC Matrix
# =============================================================================
roles:
  - name: ServiceAdvisor
    description: "Front-desk writer: creates customers/vehicles/ROs/labor-operations, schedules bays, manages lines, drives the simple RO lifecycle (start/hold/resume/invoice/close/cancel), reviews inspections."
    identity: opaque
    exclusive_operations:
      - "POST /repair-orders/{id}/schedule — assign bay window"
      - "POST /repair-orders/{id}/transition — START/HOLD/RESUME/INVOICE/CLOSE/CANCEL"
      - "POST /inspections/{id}/review — review inspection"
    shared_operations:
      - "POST /customers, POST /vehicles, POST /repair-orders, POST /labor-operations (with ShopManager)"
      - "POST /repair-orders/{id}/labor-lines, POST /repair-orders/{id}/part-lines"
      - "POST /inspections/{id}/recommended-jobs"
      - "All GET reads"

  - name: Technician
    description: "Performs labor: clocks time, completes labor lines, runs inspections, completes ROs. Identified by X-User-ID == Technician.id."
    identity: "entity_backed:Technician"
    exclusive_operations:
      - "POST /labor-lines/{id}/clock-in — clock in"
      - "POST /labor-lines/{id}/clock-out — clock out"
    shared_operations:
      - "POST /labor-lines/{id}/complete (with ShopManager)"
      - "POST /repair-orders/{id}/complete (with ShopManager)"
      - "POST /repair-orders/{id}/inspections, POST /inspections/{id}/items, /submit"
      - "POST /inspections/{id}/recommended-jobs"
      - "POST /repair-orders/{id}/labor-lines, POST /part-lines/{id}/install"

  - name: Customer
    description: "Vehicle owner: approves/declines/defers recommended work and authorizes the estimate. Identified by X-User-ID == Customer.id; must own the RO's vehicle."
    identity: "entity_backed:Customer"
    exclusive_operations:
      - "POST /repair-orders/{id}/authorize — sign the estimate"
      - "POST /recommended-jobs/{id}/decision — approve/decline/defer recommended work"
    shared_operations:
      - "GET reads of own RO, vehicles, inspections, recommended jobs, core charges"

  - name: PartsManager
    description: "Owns parts catalog and markup matrix, adds part lines, manages core charges (return/forfeit)."
    identity: opaque
    exclusive_operations:
      - "POST /markup-tiers — create markup tier"
      - "POST /core-charges/{id}/return — refund core"
      - "POST /core-charges/{id}/forfeit — forfeit core"
    shared_operations:
      - "POST /repair-orders/{id}/part-lines (with ServiceAdvisor, ShopManager)"
      - "POST /part-lines/{id}/install"
      - "GET reads"

  - name: ShopManager
    description: "Operational superset: technician/bay admin, warranty authority, test clock, and may perform any ServiceAdvisor/Technician/PartsManager operation as an override."
    identity: opaque
    exclusive_operations:
      - "POST /technicians — create technician"
      - "POST /service-bays — create bay"
      - "POST /_clock/set_current_utc — test clock control"
    shared_operations:
      - "POST /labor-operations (with ServiceAdvisor)"
      - "Any ServiceAdvisor, Technician, or PartsManager operation (override authority)"
