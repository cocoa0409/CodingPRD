        claim_type: violation_to_error
        grounds: [response_envelope.error, "errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "Error responses carry the fixed envelope: response_type 'error', data.error_id, data.message, and meta.api_request_id all present on a 404."
        test_recipe:
          setup: ["Empty database"]
          setup_api_calls: []
          trigger:
            - call: "GET /jobs/00000000-0000-0000-0000-000000000000"
              as: Dispatcher
              captures: { err: $.data.error_id, msg: $.data.message }
          assert:
            - "response_type == 'error'"
            - "err == ERR_NOT_FOUND and msg is a non-empty string"
            - "meta.api_request_id present (fixed envelope keys)"

