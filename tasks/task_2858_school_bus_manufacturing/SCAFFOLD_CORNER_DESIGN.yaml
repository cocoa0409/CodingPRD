              captures: { pkg_dsl_id: $.data.id }
            - call: "POST /state-spec-profiles"
              payload: { state_code: "TX", school_year: "2026-2027", min_seat_capacity: 71, min_emergency_exit_count: 5, min_joint_strength_kn: 55.0, required_route_range_mi: 400.0, requires_eight_lamp_system: true, requires_crossing_arm: true, required_mirror_config: "CROSSVIEW", terrain_class: "FLAT" }
              as: ComplianceOfficer
              as_user_id: "compliance-01"
              captures: { tx_id: $.data.id }
            - call: "POST /state-spec-profiles/${tx_id}/publish"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "compliance-01"
            - call: "POST /solicitations"
              payload: { solicitation_code: "SOL-TX-123", buyer_type: "DISTRICT", buyer_name: "Plano ISD", spec_profile_id: "${tx_id}", unit_count: 1, required_delivery_date: "2026-12-01", price_cap_cents_per_unit: 40000000 }
              as: SalesEngineer
              as_user_id: "dual-01"
              captures: { sol_id: $.data.id }
            - call: "POST /bids"
              payload: { solicitation_id: "${sol_id}", bus_model_id: "${model_c_id}", propulsion_package_id: "${pkg_dsl_id}", unit_count: 1, offered_seat_capacity: 71, offered_emergency_exit_count: 5, offered_mirror_config: "CROSSVIEW", offered_lap_shoulder_belts: false, offered_eight_lamp_system: true, offered_crossing_arm: true, offered_rollover_reinforcement: false }
              as: SalesEngineer
              as_user_id: "dual-01"
              captures: { bid_id: $.data.id }
            - call: "POST /bids/${bid_id}/submit"
              payload: {}
              as: SalesEngineer
              as_user_id: "dual-01"
              captures: { submitted_by: $.data.submitted_by_user_id, bid_status_submitted: $.data.status }
          trigger:
            - call: "POST /bids/${bid_id}/award"
              payload: { promised_delivery_date: "2026-11-20" }
              as: ContractsAdmin
              as_user_id: "dual-01"
              captures: { err_open: $.data.error_id }
            - call: "POST /solicitations/${sol_id}/close"
              payload: {}
              as: ContractsAdmin
              as_user_id: "contracts-01"
              captures: { sol_status_closed: $.data.status }
            - call: "POST /bids/${bid_id}/award"
              payload: { promised_delivery_date: "2026-11-20" }
              as: ContractsAdmin
              as_user_id: "dual-01"
              captures: { err_sod: $.data.error_id }
            - call: "POST /bids/${bid_id}/award"
              payload: { promised_delivery_date: "2026-11-20" }
