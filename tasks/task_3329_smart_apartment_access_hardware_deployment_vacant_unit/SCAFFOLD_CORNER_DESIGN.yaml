            - call: "POST /properties/${prop_ee}/buildings"
              payload: { name: "EE-B1", network_design: "FIELD_MESH", wifi_rssi_dbm: -60 }
              as: PlatformAdmin
              captures: { bld_ee: $.data.id }
            - call: "POST /devices"
              payload: { device_type: "LEAK_SENSOR", building_id: "${bld_ee}", firmware_version: "OLD", battery_pct: 50 }
