              payload: {}
              as: LqaTester
              as_user_id: "lqa-2"
              captures: { after_fix_density: "$.data.defect_density" }
          assert:
            - "the first close returns HTTP 422 with error_id == ERR_DEFECT_DENSITY_EXCEEDED because 0.0500 is not STRICTLY below the 0.0500 ceiling"
            - "QaPass.${pass_fn}.status stays OPEN, defect_density == 0.0500, weighted_defect_points == 8, closed_at_utc stays null"
            - "QaPass.${pass_ling}.defect_density == 0.0497 (8/161 == 0.04968944... rounded half-up to 4 places), and its close returns HTTP 200 with status CLOSED"
            - "after verifying bug_a, QaPass.${pass_fn}.weighted_defect_points == 4 and defect_density == 0.0250"
            - "the second close of ${pass_fn} returns HTTP 200, status CLOSED and closed_at_utc == 2026-08-01T00:00:00Z"

