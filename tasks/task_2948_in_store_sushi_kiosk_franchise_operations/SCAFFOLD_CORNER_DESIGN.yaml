        claim_type: violation_to_error
        grounds:
          - "errors[ERR_ACIDIFICATION_WINDOW_OVERLAP]"
          - "endpoints[POST /kiosk-ops/rice-batches]"
        excluded_because:
          difficulty_instance: resource_temporal_overlap / rice_hold_window_half_open_adjacency_allowed_on_kiosk
          rationale: "That §1.8 instance pins both sides of the half-open comparison: the shared-endpoint adjacency that must be accepted and the one-minute overlap that must return ERR_ACIDIFICATION_WINDOW_OVERLAP"
      - name: error_settlement_period_overlap_on_create
        claim_type: violation_to_error
        grounds:
          - "errors[ERR_SETTLEMENT_PERIOD_OVERLAP]"
          - "endpoints[POST /kiosk-ops/settlement-statements]"
        excluded_because:
          difficulty_instance: resource_temporal_overlap / settlement_period_closed_interval_shared_endpoint_rejected
          rationale: "That §1.8 instance covers the closed-interval semantics of the same error, including that VOID statements stop occupying the dates, so the error is fully exercised there"
      - name: error_settlement_invalid_state_on_issue_of_void_statement
        claim_type: violation_to_error
        grounds:
