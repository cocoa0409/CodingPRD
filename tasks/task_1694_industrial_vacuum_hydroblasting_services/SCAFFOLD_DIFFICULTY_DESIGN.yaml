          trigger:
            - { call: "POST /v1/manifests/${man_id}/issue", payload: {}, as: ProjectManager, captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_WASTE_PROFILE_NOT_APPROVED (manifest transition gated by WasteProfile.status)"
            - "DisposalManifest.${man_id}.status == DRAFT and facility reserved_tons unchanged at 0"

      - name: generate_invoice_requires_reconciled_manifests
        grounds:
          - state_machines.Job.FIELD_COMPLETE_to_INVOICED
          - validations[priority=24]
          - errors[ERR_MANIFEST_UNRECONCILED]
