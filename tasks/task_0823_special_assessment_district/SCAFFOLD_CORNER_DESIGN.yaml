scaffold_corner_design:
  # =========================================================================
  # Entities
  # =========================================================================
  - section: entities
    instances:
      - name: district_create_returns_201_with_system_fields
        claim_type: Creation
        grounds: [entities.AssessmentDistrict.fields.status, entities.AssessmentDistrict.fields.formation_method]
        distinguishing_aspect: "POST /districts with required fields returns 201, status PROPOSED, version 1, and a server-minted id."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /districts"
              payload: { name: "DE1", formation_method: "BENEFIT_UNITS", total_project_cost_cents: 500000 }
              as: DistrictAdministrator
              captures: { de1: "$.data.id" }
          assert:
            - "response code == 201"
            - "AssessmentDistrict.${de1}.status == PROPOSED"
            - "AssessmentDistrict.${de1}.version == 1"
            - "AssessmentDistrict.${de1}.total_apportioned_principal_cents is 0 or null (unset before roll confirm)"

      - name: district_get_non_existent_returns_not_found
        claim_type: Not Found
        grounds: ["errors[ERR_DISTRICT_NOT_FOUND]"]
        distinguishing_aspect: "GET /districts/{unknown-uuid} returns 404 ERR_DISTRICT_NOT_FOUND."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "GET /districts/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: Auditor
              captures: { err: "$.data.error_id" }
          assert:
            - "response code == 404"
            - "response error_id == ERR_DISTRICT_NOT_FOUND"

      - name: parcel_create_missing_required_apn_rejected
        claim_type: Required Fields
        grounds: [entities.Parcel.fields.apn, "errors[ERR_VALIDATION]"]
        distinguishing_aspect: "POST /districts/{id}/parcels omitting apn is rejected 422 ERR_VALIDATION."
        test_recipe:
          setup: ["District DE2 exists (PROPOSED)."]
          setup_api_calls:
            - call: "POST /districts"
              payload: { name: "DE2", formation_method: "BENEFIT_UNITS", total_project_cost_cents: 500000 }
              as: DistrictAdministrator
              captures: { de2: "$.data.id" }
          trigger:
            - call: "POST /districts/${de2}/parcels"
              payload: { owner_name: "NoApn", benefit_units: 10 }
              as: DistrictAdministrator
              captures: { err: "$.data.error_id" }
          assert:
            - "response code == 422"
            - "response error_id == ERR_VALIDATION"

      - name: district_incidental_cost_defaults_to_zero
        claim_type: Defaults
        grounds: [entities.AssessmentDistrict.fields.incidental_cost_cents]
        distinguishing_aspect: "Omitting incidental_cost_cents applies default 0, so a confirmed roll's total_apportioned_cents equals total_project_cost_cents alone."
        test_recipe:
          setup: ["District DE3 (cost 500000, incidental omitted) FORMED with one parcel; roll confirmed."]
          setup_api_calls:
            - call: "POST /districts"
              payload: { name: "DE3", formation_method: "BENEFIT_UNITS", total_project_cost_cents: 500000 }
              as: DistrictAdministrator
              captures: { de3: "$.data.id" }
            - call: "POST /districts/${de3}/parcels"
              payload: { apn: "E3-1", owner_name: "O", benefit_units: 100 }
              as: DistrictAdministrator
              captures: { pe3: "$.data.id" }
            - call: "POST /districts/${de3}/open-protest"
              payload: {}
              as: DistrictAdministrator
            - call: "POST /districts/${de3}/close-hearing"
              payload: {}
              as: DistrictAdministrator
            - call: "POST /districts/${de3}/rolls"
              payload: { method: "BENEFIT_UNITS" }
              as: DistrictAdministrator
              captures: { re3: "$.data.id" }
          trigger:
            - call: "POST /rolls/${re3}/confirm"
              payload: {}
              as: DistrictAdministrator
          assert:
            - "AssessmentRoll.${re3}.total_apportioned_cents == 500000"
            - "Parcel.${pe3}.assessed_principal_cents == 500000"

  # =========================================================================
  # State Machines
  # =========================================================================
  - section: state_machines
    instances:
      - name: confirm_already_confirmed_roll_returns_invalid_state
        claim_type: Invalid Transitions
        grounds: [state_machines.AssessmentRoll.DRAFT_to_CONFIRMED, "errors[ERR_INVALID_ROLL_STATE]"]
        distinguishing_aspect: "Confirming a roll already CONFIRMED returns 409 ERR_INVALID_ROLL_STATE; no re-apportionment."
        test_recipe:
          setup: ["District DS1 FORMED with one parcel; roll RS1 already CONFIRMED."]
          setup_api_calls:
            - call: "POST /districts"
              payload: { name: "DS1", formation_method: "BENEFIT_UNITS", total_project_cost_cents: 500000 }
              as: DistrictAdministrator
              captures: { ds1: "$.data.id" }
            - call: "POST /districts/${ds1}/parcels"
              payload: { apn: "S1-1", owner_name: "O", benefit_units: 100 }
              as: DistrictAdministrator
            - call: "POST /districts/${ds1}/open-protest"
              payload: {}
              as: DistrictAdministrator
            - call: "POST /districts/${ds1}/close-hearing"
              payload: {}
              as: DistrictAdministrator
            - call: "POST /districts/${ds1}/rolls"
              payload: { method: "BENEFIT_UNITS" }
              as: DistrictAdministrator
              captures: { rs1: "$.data.id" }
            - call: "POST /rolls/${rs1}/confirm"
              payload: {}
              as: DistrictAdministrator
          trigger:
            - call: "POST /rolls/${rs1}/confirm"
              payload: {}
              as: DistrictAdministrator
              captures: { err: "$.data.error_id" }
          assert:
            - "response error_id == ERR_INVALID_ROLL_STATE"

      - name: close_hearing_from_proposed_returns_invalid_state
        claim_type: Invalid Transitions
        grounds: [state_machines.AssessmentDistrict.PROTEST_PERIOD_to_FORMED, "errors[ERR_INVALID_DISTRICT_STATE]"]
        distinguishing_aspect: "close-hearing on a PROPOSED district (protest period never opened) returns 409 ERR_INVALID_DISTRICT_STATE."
        test_recipe:
          setup: ["District DS2 is PROPOSED with one parcel; open-protest not called."]
          setup_api_calls:
            - call: "POST /districts"
              payload: { name: "DS2", formation_method: "BENEFIT_UNITS", total_project_cost_cents: 500000 }
              as: DistrictAdministrator
              captures: { ds2: "$.data.id" }
            - call: "POST /districts/${ds2}/parcels"
              payload: { apn: "S2-1", owner_name: "O", benefit_units: 100 }
              as: DistrictAdministrator
          trigger:
            - call: "POST /districts/${ds2}/close-hearing"
              payload: {}
              as: DistrictAdministrator
              captures: { err: "$.data.error_id" }
          assert:
            - "response error_id == ERR_INVALID_DISTRICT_STATE"

      - name: reissue_issued_bond_terminal_lockdown
        claim_type: Idempotency
        grounds: [state_machines.ImprovementBond.AUTHORIZED_to_ISSUED, "errors[ERR_INVALID_BOND_STATE]"]
        distinguishing_aspect: "Issuing an already-ISSUED bond returns 409 ERR_INVALID_BOND_STATE; installments are not regenerated."
        test_recipe:
          setup: ["District DS3 FORMED, roll confirmed, bond BS3 ISSUED."]
          setup_api_calls:
            - call: "POST /districts"
              payload: { name: "DS3", formation_method: "BENEFIT_UNITS", total_project_cost_cents: 500000 }
              as: DistrictAdministrator
              captures: { ds3: "$.data.id" }
            - call: "POST /districts/${ds3}/parcels"
              payload: { apn: "S3-1", owner_name: "O", benefit_units: 100 }
              as: DistrictAdministrator
            - call: "POST /districts/${ds3}/open-protest"
              payload: {}
              as: DistrictAdministrator
            - call: "POST /districts/${ds3}/close-hearing"
              payload: {}
              as: DistrictAdministrator
            - call: "POST /districts/${ds3}/rolls"
              payload: { method: "BENEFIT_UNITS" }
              as: DistrictAdministrator
              captures: { rs3: "$.data.id" }
            - call: "POST /rolls/${rs3}/confirm"
              payload: {}
              as: DistrictAdministrator
            - call: "POST /districts/${ds3}/bonds"
              payload: { issuance_date: "2026-07-01T00:00:00Z", coupon_rate_bps: 500, term_years: 5, reserve_fund_pct: 0.10 }
              as: DistrictAdministrator
              captures: { bs3: "$.data.id" }
            - call: "POST /bonds/${bs3}/issue"
              payload: {}
              as: DistrictAdministrator
          trigger:
            - call: "POST /bonds/${bs3}/issue"
              payload: {}
              as: DistrictAdministrator
              captures: { err: "$.data.error_id" }
          assert:
            - "response error_id == ERR_INVALID_BOND_STATE"

      - name: pay_scheduled_installment_not_yet_payable
        claim_type: Precondition Enforcement
        grounds: [state_machines.Installment.DUE_to_PAID, "errors[ERR_INSTALLMENT_NOT_PAYABLE]"]
        distinguishing_aspect: "Paying a SCHEDULED installment (clock before due_date, never promoted to DUE) returns 409 ERR_INSTALLMENT_NOT_PAYABLE."
        test_recipe:
          setup: ["District DS4 FORMED single parcel, bond term 1 issued at 2026-07-01; clock at default 2026-03-01 so the installment is still SCHEDULED."]
          setup_api_calls:
            - call: "POST /districts"
              payload: { name: "DS4", formation_method: "BENEFIT_UNITS", total_project_cost_cents: 500000 }
              as: DistrictAdministrator
              captures: { ds4: "$.data.id" }
            - call: "POST /districts/${ds4}/parcels"
              payload: { apn: "S4-1", owner_name: "O", benefit_units: 100 }
              as: DistrictAdministrator
              captures: { ps4: "$.data.id" }
            - call: "POST /districts/${ds4}/open-protest"
              payload: {}
              as: DistrictAdministrator
            - call: "POST /districts/${ds4}/close-hearing"
              payload: {}
              as: DistrictAdministrator
            - call: "POST /districts/${ds4}/rolls"
              payload: { method: "BENEFIT_UNITS" }
              as: DistrictAdministrator
              captures: { rs4: "$.data.id" }
            - call: "POST /rolls/${rs4}/confirm"
              payload: {}
              as: DistrictAdministrator
            - call: "POST /districts/${ds4}/bonds"
              payload: { issuance_date: "2026-07-01T00:00:00Z", coupon_rate_bps: 500, term_years: 1, reserve_fund_pct: 0.10 }
              as: DistrictAdministrator
              captures: { bs4: "$.data.id" }
            - call: "POST /bonds/${bs4}/issue"
              payload: {}
              as: DistrictAdministrator
            - call: "GET /installments"
              payload: { parcel_id: "${ps4}", installment_year: 1 }
              as: Auditor
              captures: { is4: "$.data[0].id" }
          trigger:
            - call: "POST /installments/${is4}/payments"
              payload: { amount_cents: 525000, payment_date: "2026-03-01T00:00:00Z", paid_by: "O" }
              as: CountyTreasurer
              captures: { err: "$.data.error_id" }
          assert:
            - "response error_id == ERR_INSTALLMENT_NOT_PAYABLE"

      - name: honor_expired_quote_returns_invalid_quote_state
        claim_type: Precondition Enforcement
        grounds: [state_machines.PayoffQuote.QUOTED_to_EXPIRED, state_machines.PayoffQuote.QUOTED_to_HONORED, "errors[ERR_INVALID_QUOTE_STATE]"]
        distinguishing_aspect: "A quote whose valid_until (quote_date + 30d) passed has lazily transitioned to EXPIRED; honoring it returns 409 ERR_INVALID_QUOTE_STATE."
        test_recipe:
          setup: ["District DS5 FORMED single parcel (remaining 500000), bond term 5 issued; a quote created (quote_date 2026-08-01, valid_until 2026-08-31); clock advanced to 2026-10-01."]
          setup_api_calls:
            - call: "POST /districts"
              payload: { name: "DS5", formation_method: "BENEFIT_UNITS", total_project_cost_cents: 500000 }
              as: DistrictAdministrator
              captures: { ds5: "$.data.id" }
            - call: "POST /districts/${ds5}/parcels"
              payload: { apn: "S5-1", owner_name: "O", benefit_units: 100 }
              as: DistrictAdministrator
              captures: { ps5: "$.data.id" }
            - call: "POST /districts/${ds5}/open-protest"
              payload: {}
              as: DistrictAdministrator
            - call: "POST /districts/${ds5}/close-hearing"
              payload: {}
              as: DistrictAdministrator
            - call: "POST /districts/${ds5}/rolls"
              payload: { method: "BENEFIT_UNITS" }
              as: DistrictAdministrator
              captures: { rs5: "$.data.id" }
            - call: "POST /rolls/${rs5}/confirm"
              payload: {}
              as: DistrictAdministrator
            - call: "POST /districts/${ds5}/bonds"
              payload: { issuance_date: "2026-07-01T00:00:00Z", coupon_rate_bps: 500, term_years: 5, reserve_fund_pct: 0.10 }
              as: DistrictAdministrator
              captures: { bs5: "$.data.id" }
            - call: "POST /bonds/${bs5}/issue"
              payload: {}
              as: DistrictAdministrator
            - call: "GET /parcels/${ps5}"
              payload: {}
              as: CountyTreasurer
              captures: { pvs5: "$.data.version" }
            - call: "POST /parcels/${ps5}/payoff-quotes"
              payload: { quote_mode: "IMMEDIATE", quote_date: "2026-08-01T00:00:00Z", expected_parcel_version: "${pvs5}" }
              as: CountyTreasurer
              captures: { qs5: "$.data.id" }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-01T00:00:00Z" }
              as: DistrictAdministrator
          trigger:
            - call: "POST /payoff-quotes/${qs5}/honor"
              payload: {}
              as: CountyTreasurer
              captures: { err: "$.data.error_id" }
          assert:
            - "response error_id == ERR_INVALID_QUOTE_STATE"

  # =========================================================================
  # Calculations
  # =========================================================================
  - section: calculations
    instances:
      - name: bond_issue_computes_reserve_and_par
        claim_type: Constants Applied
        grounds: [entities.ImprovementBond.fields.reserve_fund_cents, entities.ImprovementBond.fields.par_amount_cents]
        distinguishing_aspect: "On issue, reserve_fund_cents = round(10000000*0.10) = 1000000 and par_amount_cents = 10000000+1000000+0 = 11000000."
        test_recipe:
          setup: ["District DC1 (cost 10000000) FORMED, roll confirmed; bond authorized reserve 0.10, issuance_cost 0."]
          setup_api_calls:
            - call: "POST /districts"
              payload: { name: "DC1", formation_method: "BENEFIT_UNITS", total_project_cost_cents: 10000000 }
              as: DistrictAdministrator
              captures: { dc1: "$.data.id" }
            - call: "POST /districts/${dc1}/parcels"
              payload: { apn: "C1-1", owner_name: "O", benefit_units: 100 }
              as: DistrictAdministrator
            - call: "POST /districts/${dc1}/open-protest"
              payload: {}
              as: DistrictAdministrator
            - call: "POST /districts/${dc1}/close-hearing"
              payload: {}
              as: DistrictAdministrator
            - call: "POST /districts/${dc1}/rolls"
              payload: { method: "BENEFIT_UNITS" }
              as: DistrictAdministrator
              captures: { rc1: "$.data.id" }
            - call: "POST /rolls/${rc1}/confirm"
              payload: {}
              as: DistrictAdministrator
            - call: "POST /districts/${dc1}/bonds"
              payload: { issuance_date: "2026-07-01T00:00:00Z", coupon_rate_bps: 500, term_years: 10, reserve_fund_pct: 0.10, issuance_cost_cents: 0 }
              as: DistrictAdministrator
              captures: { bc1: "$.data.id" }
          trigger:
            - call: "POST /bonds/${bc1}/issue"
              payload: {}
              as: DistrictAdministrator
          assert:
            - "ImprovementBond.${bc1}.reserve_fund_cents == 1000000"
            - "ImprovementBond.${bc1}.par_amount_cents == 11000000"

      - name: delinquency_penalty_and_redemption_interest_values
        claim_type: Correct Result
        grounds: [calculations.delinquency_charges, entities.Installment.fields.penalty_cents, entities.Installment.fields.redemption_interest_cents]
        distinguishing_aspect: "For a base amount_due 1050000 (principal 1000000 + interest 50000), one month late: penalty 105000, redemption interest 15750, amount_due 1170750."
        test_recipe:
          setup: ["District DC2 single parcel (assessed 1000000), bond term 1 issued (due 2027-07-01); clock at 2027-08-01 (one 30/360 month late), installment DUE."]
          setup_api_calls:
            - call: "POST /districts"
              payload: { name: "DC2", formation_method: "BENEFIT_UNITS", total_project_cost_cents: 1000000 }
              as: DistrictAdministrator
              captures: { dc2: "$.data.id" }
            - call: "POST /districts/${dc2}/parcels"
              payload: { apn: "C2-1", owner_name: "O", benefit_units: 100 }
              as: DistrictAdministrator
              captures: { pc2: "$.data.id" }
            - call: "POST /districts/${dc2}/open-protest"
              payload: {}
              as: DistrictAdministrator
            - call: "POST /districts/${dc2}/close-hearing"
              payload: {}
              as: DistrictAdministrator
            - call: "POST /districts/${dc2}/rolls"
              payload: { method: "BENEFIT_UNITS" }
              as: DistrictAdministrator
              captures: { rc2: "$.data.id" }
            - call: "POST /rolls/${rc2}/confirm"
              payload: {}
              as: DistrictAdministrator
            - call: "POST /districts/${dc2}/bonds"
              payload: { issuance_date: "2026-07-01T00:00:00Z", coupon_rate_bps: 500, term_years: 1, reserve_fund_pct: 0.10 }
              as: DistrictAdministrator
              captures: { bc2: "$.data.id" }
            - call: "POST /bonds/${bc2}/issue"
              payload: {}
              as: DistrictAdministrator
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2027-08-01T00:00:00Z" }
              as: DistrictAdministrator
            - call: "GET /installments"
              payload: { parcel_id: "${pc2}", installment_year: 1 }
              as: Auditor
              captures: { ic2: "$.data[0].id" }
          trigger:
            - call: "POST /installments/${ic2}/mark-delinquent"
              payload: {}
              as: CountyTreasurer
          assert:
            - "Installment.${ic2}.penalty_cents == 105000"
            - "Installment.${ic2}.redemption_interest_cents == 15750"
            - "Installment.${ic2}.amount_due_cents == 1170750"

  # =========================================================================
  # Validations
  # =========================================================================
  - section: validations
    instances:
      - name: duplicate_apn_within_district_rejected
        claim_type: Violation → Error
        grounds: ["validations[priority=7]", "errors[ERR_APN_DUPLICATE]"]
        distinguishing_aspect: "A second parcel with an apn already used in the same district returns 409 ERR_APN_DUPLICATE."
        test_recipe:
          setup: ["District DV1 with a parcel apn V1-1."]
          setup_api_calls:
            - call: "POST /districts"
              payload: { name: "DV1", formation_method: "BENEFIT_UNITS", total_project_cost_cents: 500000 }
              as: DistrictAdministrator
              captures: { dv1: "$.data.id" }
            - call: "POST /districts/${dv1}/parcels"
              payload: { apn: "V1-1", owner_name: "O", benefit_units: 50 }
              as: DistrictAdministrator
          trigger:
            - call: "POST /districts/${dv1}/parcels"
              payload: { apn: "V1-1", owner_name: "O2", benefit_units: 50 }
              as: DistrictAdministrator
              captures: { err: "$.data.error_id" }
          assert:
            - "response error_id == ERR_APN_DUPLICATE"

      - name: subdivide_benefit_units_mismatch_rejected
        claim_type: Violation → Error
        grounds: ["validations[priority=7]", "errors[ERR_BENEFIT_UNITS_MISMATCH]", calculations.subdivision_reallocation]
        distinguishing_aspect: "Subdividing P(60) into children 40+30 (=70 != 60) returns 422 ERR_BENEFIT_UNITS_MISMATCH; no children created."
        test_recipe:
          setup: ["District DV2 with parcel P (benefit_units 60), ACTIVE."]
          setup_api_calls:
            - call: "POST /districts"
              payload: { name: "DV2", formation_method: "BENEFIT_UNITS", total_project_cost_cents: 600000 }
              as: DistrictAdministrator
              captures: { dv2: "$.data.id" }
            - call: "POST /districts/${dv2}/parcels"
              payload: { apn: "V2-1", owner_name: "O", benefit_units: 60 }
              as: DistrictAdministrator
              captures: { pv2: "$.data.id" }
          trigger:
            - call: "POST /parcels/${pv2}/subdivide"
              payload: { children: [ { apn: "V2-1-a", owner_name: "Oa", benefit_units: 40 }, { apn: "V2-1-b", owner_name: "Ob", benefit_units: 30 } ] }
              as: DistrictAdministrator
              captures: { err: "$.data.error_id" }
          assert:
            - "response error_id == ERR_BENEFIT_UNITS_MISMATCH"
            - "Parcel.${pv2}.status == ACTIVE"

  # =========================================================================
  # Endpoints
  # =========================================================================
  - section: endpoints
    instances:
      - name: list_district_parcels_paginated
        claim_type: Standard CRUD
        grounds: [entities.Parcel.fields.district_id]
        distinguishing_aspect: "GET /districts/{id}/parcels returns a Parcel[] envelope with total_count and has_more; both parcels are listed."
        test_recipe:
          setup: ["District DE4 with two parcels."]
          setup_api_calls:
            - call: "POST /districts"
              payload: { name: "DE4", formation_method: "BENEFIT_UNITS", total_project_cost_cents: 500000 }
              as: DistrictAdministrator
              captures: { de4: "$.data.id" }
            - call: "POST /districts/${de4}/parcels"
              payload: { apn: "E4-1", owner_name: "O1", benefit_units: 50 }
              as: DistrictAdministrator
            - call: "POST /districts/${de4}/parcels"
              payload: { apn: "E4-2", owner_name: "O2", benefit_units: 50 }
              as: DistrictAdministrator
          trigger:
            - call: "GET /districts/${de4}/parcels"
              payload: { limit: 10, offset: 0 }
              as: Auditor
          assert:
            - "response total_count == 2"
            - "response has_more == false"

      - name: disclosure_report_reflects_remaining_principal
        claim_type: Computed read
        grounds: [entities.Parcel.fields.remaining_principal_cents]
        distinguishing_aspect: "GET /parcels/{id}/disclosure returns remaining_principal_cents == 1000000 and lien_status RECORDED for a freshly assessed parcel."
        test_recipe:
          setup: ["District DE5 single parcel (assessed 1000000), roll confirmed (ASSESSMENT lien RECORDED)."]
          setup_api_calls:
            - call: "POST /districts"
              payload: { name: "DE5", formation_method: "BENEFIT_UNITS", total_project_cost_cents: 1000000 }
              as: DistrictAdministrator
              captures: { de5: "$.data.id" }
            - call: "POST /districts/${de5}/parcels"
              payload: { apn: "E5-1", owner_name: "O", benefit_units: 100 }
              as: DistrictAdministrator
              captures: { pe5: "$.data.id" }
            - call: "POST /districts/${de5}/open-protest"
              payload: {}
              as: DistrictAdministrator
            - call: "POST /districts/${de5}/close-hearing"
              payload: {}
              as: DistrictAdministrator
            - call: "POST /districts/${de5}/rolls"
              payload: { method: "BENEFIT_UNITS" }
              as: DistrictAdministrator
              captures: { re5: "$.data.id" }
            - call: "POST /rolls/${re5}/confirm"
              payload: {}
              as: DistrictAdministrator
          trigger:
            - call: "GET /parcels/${pe5}/disclosure"
              payload: {}
              as: Auditor
          assert:
            - "response remaining_principal_cents == 1000000"
            - "response lien_status == RECORDED"

  # =========================================================================
  # Errors
  # =========================================================================
  - section: errors
    instances:
      - name: foreclosure_initiate_below_threshold_rejected
        claim_type: Violation → Error
        grounds: ["validations[priority=7]", "errors[ERR_FORECLOSURE_THRESHOLD_NOT_MET]"]
        distinguishing_aspect: "Initiating foreclosure on a parcel with only 1 DELINQUENT installment (< threshold 3) returns 409 ERR_FORECLOSURE_THRESHOLD_NOT_MET; parcel stays ACTIVE."
        test_recipe:
          setup: ["District DER1 single parcel, bond term 1 issued; clock 2027-08-01; the single installment marked DELINQUENT (count 1)."]
          setup_api_calls:
            - call: "POST /districts"
              payload: { name: "DER1", formation_method: "BENEFIT_UNITS", total_project_cost_cents: 1000000 }
              as: DistrictAdministrator
              captures: { der1: "$.data.id" }
