              as: PlatformAdmin
              captures: { m1_id: $.data.id }
            - call: "POST /pattern-assets"
              payload: { pump_model_id: "${m1_id}", foundry_id: "${f1_id}", pattern_code: "PAT-HSC14-A", wear_threshold: 2 }
              as: PlatformAdmin
              captures: { p1_id: $.data.id }
            - call: "POST /casting-lots"
              payload: { pattern_asset_id: "${p1_id}", foundry_id: "${f1_id}", heat_number: "H-9001", alloy_code: "CI_GG25", qty_poured: 4, pour_window_start: "2026-08-05T00:00:00Z", pour_window_end: "2026-08-10T00:00:00Z" }
              as: FoundryPartner
              as_user_id: "${f1_id}"
              captures: { l1_id: $.data.id }
            - call: "POST /casting-lots/${l1_id}/defects"
              payload: { defect_code: "DF-1", defect_type: "SHRINKAGE", severity: "CRITICAL", affected_qty: 1 }
              as: FoundryPartner
              as_user_id: "${f1_id}"
              captures: { df1_id: $.data.id }
            - call: "POST /casting-lots/${l1_id}/inspect"
              payload: {}
              as: QualityInspector
              as_user_id: "qi-301"
            - call: "POST /casting-defects/${df1_id}/disposition"
              payload: { disposition: "USE_AS_IS" }
              as: QualityInspector
              as_user_id: "qi-301"
            - call: "POST /casting-lots/${l1_id}/accept"
              payload: {}
              as: QualityInspector
              as_user_id: "qi-301"
          trigger:
            - call: "POST /pattern-assets/${p1_id}/refurbishment-start"
              payload: {}
              as: PlatformAdmin
            - call: "POST /pattern-assets/${p1_id}/refurbishment-complete"
              payload: {}
              as: PlatformAdmin
            - call: "POST /casting-lots"
              payload: { pattern_asset_id: "${p1_id}", foundry_id: "${f1_id}", heat_number: "H-9002", alloy_code: "CI_GG25", qty_poured: 4, pour_window_start: "2026-08-12T00:00:00Z", pour_window_end: "2026-08-16T00:00:00Z" }
              as: FoundryPartner
              as_user_id: "${f1_id}"
              captures: { l2_id: $.data.id }
          assert:
            - "PatternAsset.${p1_id}.status == QUALIFIED"
            - "PatternAsset.${p1_id}.refurb_cycles == 1"
            - "PatternAsset.${p1_id}.pours_since_refurb == 1"
            - "PatternAsset.${p1_id}.defect_pours_since_refurb == 0"
            - "PatternAsset.${p1_id}.wear_index == 1"
            - "PumpModel.${m1_id}.status == ORDERABLE"
