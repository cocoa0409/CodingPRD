    roles: [Any]
    code: 200
    input: []
    output: "Dispute[]"
    side_effects: []

  - method: POST
    path: "/tenants/{tenantId}/orders/{orderId}/disputes/{disputeId}/start-review"
    description: "Start dispute review"
    roles: [CustomerSupport]
    code: 200
    input: []
    output: Dispute
    side_effects: ["status → UNDER_REVIEW"]

  - method: POST
    path: "/tenants/{tenantId}/orders/{orderId}/disputes/{disputeId}/resolve-customer"
    description: "Resolve in customer favor"
    roles: [CustomerSupport]
    code: 200
    input: [refund_amount_cents, "worker_penalty_cents?"]
    output: Dispute
    side_effects: ["status → RESOLVED_CUSTOMER, order → REFUNDED, worker risk +25"]

  - method: POST
    path: "/tenants/{tenantId}/orders/{orderId}/disputes/{disputeId}/resolve-worker"
    description: "Resolve in worker favor"
    roles: [CustomerSupport]
    code: 200
    input: []
    output: Dispute
    side_effects: ["status → RESOLVED_WORKER, order returns to prior state"]

  - method: POST
    path: "/tenants/{tenantId}/orders/{orderId}/disputes/{disputeId}/withdraw"
    description: "Withdraw dispute"
    roles: [CustomerSupport]
    code: 200
    input: []
    output: Dispute
    side_effects: ["status → CANCELLED, order returns to prior state"]

  # --- Ratings ---
  - method: POST
    path: "/tenants/{tenantId}/orders/{orderId}/ratings"
    description: "Create rating"
    roles: [Dispatcher, CustomerSupport]
    code: 201
    input: [worker_id, rating_value, "comment?"]
    output: Rating
    side_effects: ["status=PENDING_MODERATION"]

  - method: GET
    path: "/tenants/{tenantId}/orders/{orderId}/ratings"
    description: "List ratings"
    roles: [Any]
    code: 200
    input: []
    output: "Rating[]"
    side_effects: []

  - method: POST
    path: "/tenants/{tenantId}/orders/{orderId}/ratings/{ratingId}/moderate"
    description: "Moderate rating"
    roles: [TenantManager]
    code: 200
    input: [action]
    output: Rating
    side_effects: ["status → PUBLISHED, HIDDEN, or REMOVED; first publish records to worker ledger"]

