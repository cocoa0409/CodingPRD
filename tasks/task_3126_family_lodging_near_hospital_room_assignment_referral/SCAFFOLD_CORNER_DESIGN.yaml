              captures: { err: $.data.error_id }
          assert:
            - "the response status is 422 and error_id == ERR_INVALID_DATE_RANGE (end_at must be strictly after start_at)"

      - name: duplicate_meal_shift_rejected
        claim_type: violation_to_error
        grounds: ['validations[priority=6]', errors.ERR_DUPLICATE_MEAL_SHIFT]
