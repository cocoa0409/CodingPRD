              as: Member
              as_user_id: "${pwm}"
              captures: { pw_status: $.data.status }
          assert:
            - "HTTP 200 and Subscription.${pws}.status == PAUSED (adjacency at prior resume boundary is allowed)"

  # ===========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: refund_restores_consumed_credit_balance
        grounds:
          - state_machines.WeeklyBox.PENDING_to_CHARGED
          - state_machines.WeeklyBox.CHARGED_to_REFUNDED
          - calculations.weekly_box_charge
          - entities.Member.fields.credit_balance_cents
        distinguishing_aspect: |
          Conserved quantity: Member.credit_balance_cents. Charge deducts credit_applied; refund adds
          exactly credit_applied back, so after charge+refund credit_balance_cents equals its pre-charge
          value. Invariant: post_refund_credit == pre_charge_credit (no drift).
        test_recipe:
          setup:
            - "Member starts with credit_balance_cents=1500 (from a settled referral)"
            - "Box charged (credit_applied=1500 since after_loyalty 8491 > 1500 < cap) leaving credit 0"
            - "Box refunded; credit restored to 1500"
          setup_api_calls:
            - call: "POST /_clock/set"
              payload: { now_iso8601: "2026-07-01T00:00:00.000Z" }
              as: PlatformAdmin
            - call: "POST /plans"
              payload: { code: "P_CMP", servings_per_meal: 2, meals_per_week: 4 }
              as: PlatformAdmin
