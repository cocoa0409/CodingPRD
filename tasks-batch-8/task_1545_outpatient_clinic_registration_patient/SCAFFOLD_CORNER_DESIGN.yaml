              as: Registrar
              captures: { pol2: $.data.id }
            - call: "POST /patient-access/appointments"
              payload: { patient_id: "${p1}", department_code: "ORTHO", procedure_code: "99213", scheduled_start: "2026-09-10T09:00:00Z", duration_minutes: 30, visit_type: "ESTABLISHED", provider_code: "DRXP" }
