    description: "Propose an allocation of a pallet to a club (OCC-guarded on run version). Validation order inside the endpoint: shape -> existence -> state -> OCC -> safety gates -> cutoff -> same-day -> capacity -> compute score -> persist."
    roles: [DepotPlanner]
    code: 201
    input: [pallet_id, club_id, expected_cross_dock_run_version, "regional_ops_approved?"]
    output: Allocation
    side_effects:
      - "compute allocation_score and floor_slots_reserved"
      - "allocation created PROPOSED with run_version = run.version + 1"
      - "pallet RECEIVED -> ALLOCATED"
      - "club.allocated_slot_count += floor_slots_reserved; club.posture recomputed"
      - "increments CrossDockRun.version by 1"
  - method: GET
