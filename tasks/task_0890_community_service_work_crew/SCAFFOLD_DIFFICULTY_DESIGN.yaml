            - { call: "POST /placements", payload: { referral_id: "${ref2_id}", site_id: "${site_id}", supervisor_id: "${sup_id}" }, as: ProgramCoordinator, as_user_id: "coord-1", captures: { plc2_id: "$.data.id" } }
