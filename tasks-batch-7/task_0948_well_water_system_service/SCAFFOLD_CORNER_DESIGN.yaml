              as: PlatformAdmin
              captures: { prop_id: $.data.id }
            - call: "POST /water-service/well-profiles"
              payload: { property_id: "${prop_id}", jurisdiction_code: "JUR_ALPHA", well_type: "DRILLED", depth_feet: 200.0 }
              as: PlatformAdmin
              captures: { well_id: $.data.id }
            - call: "POST /water-service/maintenance-plans"
              payload: { well_profile_id: "${well_id}", account_id: "${acct_id}" }
              as: PlatformAdmin
              captures: { plan_id: $.data.id, pv0: $.data.version }
          trigger:
            - call: "POST /water-service/maintenance-plans/${plan_id}/salt-deliveries"
              payload: { delivered_lbs: 300.0, expected_maintenance_plan_version: "${pv0}" }
              as: PlatformAdmin
            - call: "GET /water-service/maintenance-plans/${plan_id}"
              payload: {}
              as: PlatformAdmin
              captures: { pv1: $.data.version }
            - call: "POST /water-service/maintenance-plans/${plan_id}/salt-deliveries"
              payload: { delivered_lbs: 40.0, expected_maintenance_plan_version: "${pv1}" }
              as: PlatformAdmin
              captures: { err_cap: $.data.error_id }
            - call: "POST /water-service/maintenance-plans/${plan_id}/salt-deliveries"
              payload: { delivered_lbs: 39.9, expected_maintenance_plan_version: "${pv1}" }
              as: PlatformAdmin
              captures: { err_min: $.data.error_id }
          assert:
            - "MaintenancePlan.${plan_id}.salt_remaining_lbs == 300.0"
            - "MaintenancePlan.${plan_id}.last_salt_delivery_date == 2026-06-01T00:00:00.000Z"
            - "MaintenancePlan.${plan_id}.salt_next_due_date == null"
            - "${err_cap} == ERR_SALT_DELIVERY_EXCEEDS_CAPACITY"
            - "HTTP status is 422 on the capacity-breaching delivery"
            - "${err_min} == ERR_VALIDATION"
            - "HTTP status is 400 on the 39.9 lb delivery"
            - "MaintenancePlan.${plan_id}.version == ${pv1}"

      - name: corner_validation_filter_change_minimum_interval_boundary
        claim_type: Temporal validation
