              as: FarmManager
              captures:
                offA: "$.data.id"
            - call: "POST /bids"
              payload: { offering_id: "${offA}", lease_type: "CASH", cash_bid_per_acre_cents: 25000, cash_equivalent_bid_cents_per_acre: 25000 }
              as: Tenant
              as_user_id: "${tn}"
              captures:
                bidA: "$.data.id"
            - call: "POST /bids/${bidA}/shortlist"
              as: FarmManager
            - call: "POST /offerings/${offA}/close"
              as: FarmManager
            - call: "POST /offerings/${offA}/award"
              payload: { bid_id: "${bidA}" }
              as: Landlord
              as_user_id: "${ld}"
            - call: "POST /leases"
              payload: { bid_id: "${bidA}", term_start_date: "2027-03-01T00:00:00Z", term_end_date: "2028-03-01T00:00:00Z", payment_pattern: "MAR_NOV_50_50", escalation_type: "NONE", conservation_practices: [ { practice_type: "COVER_CROP", due_date: "2027-06-01T00:00:00Z" }, { practice_type: "NO_TILL", due_date: "2027-06-01T00:00:00Z" }, { practice_type: "BUFFER_STRIP", due_date: "2027-06-01T00:00:00Z" }, { practice_type: "NUTRIENT_PLAN", due_date: "2027-06-01T00:00:00Z" } ] }
              as: FarmManager
