# -----------------------------------------------------------------------------
# §1.2 State Machine Table
# -----------------------------------------------------------------------------
state_machines:
  - entity: Membership
    field: status
    initial_state: PENDING_PAYMENT
    terminal_states: [CANCELLED]
    note: "Cyclic: ACTIVE -> GRACE -> ACTIVE via reinstatement renewal (Rule 3)."
    transitions:
      - from: PENDING_PAYMENT
        to: ACTIVE
        trigger: "POST /_payments/settle (target=MEMBERSHIP, outcome=SUCCEEDED)"
        actor: system
        preconditions:
          - "Membership.status == PENDING_PAYMENT"
        side_effects:
          - "Set started_at = clock.now; expires_at = started_at + plan.term_days days"
          - "Mint plan.guest_passes_granted GuestPass rows (status=UNUSED) under this membership"
          - "Set last_paid_fee_cents per renewal_fee calc (variant=initial)"
          - "term_count = 1"

      - from: ACTIVE
        to: GRACE
        trigger: "POST /_jobs/run_expirations (expires_at <= clock.now, auto_renew == false)"
        actor: system
        preconditions:
          - "Membership.status == ACTIVE"
          - "expires_at <= clock.now"
          - "auto_renew == false"
        side_effects:
          - "Set grace_until = expires_at + 30 days"
          - "All GuestPass rows of this membership with status == UNUSED -> EXPIRED (cascade level 1)"

      - from: GRACE
        to: ACTIVE
        trigger: "POST /memberships/{id}/renew (clock.now <= grace_until)"
        actor: Patron
        preconditions:
          - "Membership.status == GRACE"
          - "expected_membership_version matches Membership.version (OCC)"
          - "clock.now <= grace_until"
        side_effects:
          - "Set started_at = clock.now; expires_at = clock.now + plan.term_days days; grace_until = null"
          - "Mint plan.guest_passes_granted fresh GuestPass rows (status=UNUSED)"
          - "Set last_paid_fee_cents per renewal_fee calc (variant=lapsed) — includes plan.reinstatement_fee_cents"
          - "term_count += 1; increments Membership.version by 1"

      - from: ACTIVE
        to: ACTIVE
        trigger: "POST /memberships/{id}/renew (clock.now < expires_at, early renewal) OR POST /_jobs/run_renewals (auto_renew)"
        actor: Patron | system
        preconditions:
          - "Membership.status == ACTIVE"
          - "expected_membership_version matches Membership.version (OCC) — manual renew only"
        side_effects:
          - "Set expires_at = expires_at + plan.term_days days (term extends from prior expiry, no proration)"
          - "Mint plan.guest_passes_granted fresh GuestPass rows (status=UNUSED)"
          - "Set last_paid_fee_cents per renewal_fee calc (variant=early)"
          - "term_count += 1; increments Membership.version by 1"

      - from: GRACE
        to: EXPIRED
        trigger: "POST /_jobs/run_expirations (grace_until < clock.now)"
        actor: system
        preconditions:
          - "Membership.status == GRACE"
          - "grace_until < clock.now"
        side_effects:
          - "All remaining GuestPass rows of this membership with status IN {UNUSED, RESERVED} -> EXPIRED"

      - from: [PENDING_PAYMENT, ACTIVE, GRACE]
        to: CANCELLED
        trigger: "POST /memberships/{id}/cancel"
        actor: Patron
        preconditions:
          - "Membership.status IN {PENDING_PAYMENT, ACTIVE, GRACE}"
        side_effects:
          - "auto_renew = false"
          - "Each GuestPass of this membership with status == RESERVED is released -> UNUSED, then immediately -> EXPIRED; releasing voids its linked AdmissionTicket and decrements the order's slot/session reserved_count (cascade depth 3, Rule 4)"
          - "Each GuestPass of this membership with status == UNUSED -> EXPIRED"

  - entity: AdmissionOrder
    field: status
    initial_state: DRAFT
    terminal_states: [CANCELLED, REFUNDED]
    note: "Branching at CONFIRMED -> {CHECKED_IN, CANCELLED} with divergent side-effect sets (Rule 3)."
    transitions:
      - from: DRAFT
        to: CONFIRMED
        trigger: "POST /admission-orders/{id}/confirm"
        actor: Patron | BoxOffice
        preconditions:
          - "AdmissionOrder.status == DRAFT"
          - "party_size >= 1 (at least one ticket)"
          - "TimedEntrySlot.status == OPEN"
          - "slot.starts_at > clock.now (window has not started)"
          - "reserved_count + party_size <= capacity_total on the slot (>= rejects)"
          - "If exhibit_session_id set: session reserved_count + party_size <= session.capacity_total"
          - "If any MEMBER ticket present: Membership.status == ACTIVE"
          - "No other CONFIRMED/CHECKED_IN order of this patron has a slot window overlapping this slot ([starts_at,ends_at) half-open; adjacency allowed)"
          - "If exhibit_session_id set: no other booked ExhibitSession of this patron lies within buffer_minutes of this session"
        side_effects:
          - "Lock per-ticket price_cents and order.final_total_cents per order_total calc (variant=final)"
          - "slot.reserved_count += party_size; increments TimedEntrySlot.version by 1"
          - "If exhibit_session_id set: session.reserved_count += party_size"
          - "Each GUEST ticket reserves one GuestPass (UNUSED -> RESERVED), reserved_order_id = order.id (Rule 9 forward)"
          - "If donation_cents > 0: create a Donation row (order_id=order.id)"

      - from: CONFIRMED
        to: CHECKED_IN
        trigger: "POST /admission-orders/{id}/check-in"
        actor: BoxOffice | GateScanner
        preconditions:
          - "AdmissionOrder.status == CONFIRMED"
          - "slot.starts_at <= clock.now < slot.ends_at (within the entry window)"
        side_effects:
          - "All AdmissionTicket of this order with state == ACTIVE -> SCANNED"
          - "Each reserved GuestPass (RESERVED) of this order -> REDEEMED"

      - from: CONFIRMED
        to: CANCELLED
        trigger: "POST /admission-orders/{id}/cancel"
        actor: Patron | BoxOffice
        preconditions:
          - "AdmissionOrder.status == CONFIRMED"
        side_effects:
          - "All AdmissionTicket of this order with state == ACTIVE -> VOIDED (cascade level 1)"
          - "Voiding tickets decrements slot.reserved_count by party_size and, if set, session.reserved_count by party_size (cascade level 2, Rule 4; Rule 9 compensation)"
          - "Each GuestPass with status == RESERVED on this order -> UNUSED, reserved_order_id = null (Rule 9 compensation)"

      - from: DRAFT
        to: CANCELLED
        trigger: "POST /admission-orders/{id}/cancel"
        actor: Patron | BoxOffice
        preconditions:
          - "AdmissionOrder.status == DRAFT"
        side_effects:
          - "All AdmissionTicket of this order -> VOIDED (no capacity was held, so no reserved_count change)"

      - from: CHECKED_IN
        to: REFUNDED
        trigger: "POST /admission-orders/{id}/refund"
        actor: BoxOffice
        preconditions:
          - "AdmissionOrder.status == CHECKED_IN"
          - "No AdmissionTicket of this order is in state SCANNED that has been flagged final (all SCANNED tickets are refundable here)"
        side_effects:
          - "All AdmissionTicket of this order -> VOIDED"
          - "slot.reserved_count -= party_size (released post-visit); if session set, session.reserved_count -= party_size"
          - "Each REDEEMED GuestPass of this order -> EXPIRED (a redeemed pass is consumed, not returned)"

  - entity: AdmissionTicket
    field: state
    initial_state: ACTIVE
    terminal_states: [VOIDED]
    note: "Scanned via order check-in; voided via order cancel/refund or guest-pass release cascade."
    transitions:
      - from: ACTIVE
        to: SCANNED
        trigger: "system (order check-in)"
        actor: system
        preconditions:
          - "Parent AdmissionOrder transitions CONFIRMED -> CHECKED_IN"
        side_effects: []

      - from: ACTIVE
        to: VOIDED
        trigger: "system (order cancel, refund, or guest-pass release cascade)"
        actor: system
        preconditions:
          - "Parent order cancelled/refunded OR linked GuestPass released by membership cancel"
        side_effects:
          - "If this is a GUEST ticket voided by guest-pass release, decrement the order's slot reserved_count by 1 (cascade level 3, Rule 4)"

  - entity: GuestPass
    field: status
    initial_state: UNUSED
    terminal_states: [EXPIRED]
    note: "UNUSED -> RESERVED -> REDEEMED forward; RESERVED -> UNUSED compensation; conservation pinned in guest_pass_conservation calc (Rule 9)."
    transitions:
      - from: UNUSED
        to: RESERVED
        trigger: "system (order confirm with a GUEST ticket)"
        actor: system
        preconditions:
          - "GuestPass.status == UNUSED"
          - "At least one UNUSED pass remains on the membership (empty pool rejects, Rule 6)"
        side_effects:
          - "reserved_order_id = order.id"

      - from: RESERVED
        to: REDEEMED
        trigger: "system (order check-in)"
        actor: system
        preconditions:
          - "GuestPass.status == RESERVED"
        side_effects: []

      - from: RESERVED
        to: UNUSED
        trigger: "system (order cancel)"
        actor: system
        preconditions:
          - "GuestPass.status == RESERVED"
        side_effects:
          - "reserved_order_id = null"

      - from: [UNUSED, RESERVED]
        to: EXPIRED
        trigger: "system (membership expire/grace-lapse/cancel cascade)"
        actor: system
        preconditions:
          - "Owning Membership transitions to GRACE, EXPIRED, or CANCELLED"
        side_effects: []

      - from: REDEEMED
        to: EXPIRED
        trigger: "system (order refund)"
        actor: system
        preconditions:
          - "GuestPass.status == REDEEMED and parent order refunded"
        side_effects: []

# -----------------------------------------------------------------------------
# §1.2.1 Concurrency Rules
# -----------------------------------------------------------------------------
concurrency_rules:
  - rule_id: membership-renew-stale-version
    parent_entity: Membership
    write_endpoint: "POST /memberships/{id}/renew"
    occ_field: "expected_membership_version"
    description: |
      Renewing a Membership whose version has advanced since the client last
      observed it is rejected. A renewal mints a fresh term that supersedes the
      prior term under the renewal state machine; when the automatic renewal job
      (or a prior manual renewal) has already advanced the membership, the
      current client's view is stale and its renewal carries an outdated
      expected_membership_version.
    error_id: ERR_STALE_VERSION
    http_status: 412

# -----------------------------------------------------------------------------
# §1.3 Calculation Rules Table
# -----------------------------------------------------------------------------
calculations:
  - name: order_total
    trigger: "order_total(variant=provisional) on DRAFT (POST /admission-orders, POST /admission-orders/{id}/tickets, PATCH /admission-orders/{id}); order_total(variant=final) on POST /admission-orders/{id}/confirm"
    algorithm: tiered_pricing
    formula: |
      # Per-ticket base price by ticket_type (>=3 inputs, nested branches — Mode (a)):
      for each ticket t in order.tickets:
        if t.ticket_type == MEMBER:
            base = plan.member_admission_cents            # requires order.membership_id ACTIVE at confirm
        elif t.ticket_type == NON_MEMBER:
            base = slot.non_member_admission_cents
        elif t.ticket_type == GUEST:
            base = 0                                       # admission covered by a guest pass
        elif t.ticket_type == RECIPROCAL:
            partner = ReciprocalPartner[t.reciprocal_partner_id]
            if partner.benefit_type == FREE:
                base = 0
            else:  # DISCOUNT
                base = round_half_up(slot.non_member_admission_cents * (1 - partner.discount_pct))

        # Special-exhibit surcharge, applied per-ticket then summed (Mode (b) rounding order is PINNED):
        if order.exhibit_session_id is not null:
            sur = exhibit.surcharge_cents
            if t.ticket_type in {MEMBER}:
                if plan.exhibit_surcharge_waived: sur = 0
                else: sur = round_half_up(exhibit.surcharge_cents * (1 - exhibit.member_surcharge_discount_pct))
            # GUEST/NON_MEMBER/RECIPROCAL pay full surcharge_cents
        else:
            sur = 0
        t.price_cents = base + sur     # per-ticket integer cents, rounding already applied per component

      order_admission_subtotal = sum(t.price_cents for t in order.tickets)   # sum AFTER per-ticket rounding
      total = order_admission_subtotal + order.donation_cents
    input_set: "All AdmissionTicket rows on the order (state != VOIDED). GUEST tickets contribute base=0 always."
    constants:
      ROUNDING: round_half_up
    precision: "integer cents; round_half_up applied at each per-component multiplication, never on the final sum"
    variants:
      - name: provisional
        when: "order.status == DRAFT; written to quoted_total_cents"
        difference: "MEMBER tickets are priced at plan.member_admission_cents even if the membership is not yet ACTIVE; the quote is an estimate and is NOT authoritative."
      - name: final
        when: "order.status transitions DRAFT -> CONFIRMED; written to final_total_cents and per-ticket price_cents"
        difference: "MEMBER pricing is only honored if Membership.status == ACTIVE at confirm time (else the confirm is rejected by the cross-entity precondition); RECIPROCAL discount uses the partner's discount_pct at confirm time."

  - name: renewal_fee
    trigger: "Membership activation (POST /_payments/settle target=MEMBERSHIP) and renewal (POST /memberships/{id}/renew, POST /_jobs/run_renewals); writes Membership.last_paid_fee_cents"
    algorithm: threshold
    formula: |
      # Dual-variant fee on a different entity domain than order_total (Rule 1):
      base = plan.annual_fee_cents
      if variant == initial:                       # first activation from PENDING_PAYMENT
          fee = base
      elif variant == early:                       # renew while ACTIVE (clock.now < expires_at) or auto-renew
          fee = base                               # no proration; full annual fee, term extends from prior expiry
      elif variant == lapsed:                       # renew while GRACE (clock.now <= grace_until)
          fee = base + plan.reinstatement_fee_cents   # reinstatement surcharge; term restarts from clock.now
    input_set: "Single Membership and its MembershipPlan."
    constants: {}
    precision: "integer cents"
    variants:
      - name: initial
        when: "PENDING_PAYMENT -> ACTIVE"
        difference: "fee = annual_fee_cents; term begins at activation clock time."
      - name: early
        when: "renew while ACTIVE; manual early renewal or auto_renew job"
        difference: "fee = annual_fee_cents; expires_at extends from the PRIOR expires_at (stacking), not from clock.now."
      - name: lapsed
        when: "renew while GRACE"
        difference: "fee = annual_fee_cents + reinstatement_fee_cents; expires_at restarts at clock.now + term_days."

  - name: slot_reserved_count
    trigger: "order confirm (+party_size), order cancel/refund (-party_size), guest-pass-release cascade (-1 per voided guest ticket)"
    algorithm: aggregation
    formula: |
      slot.reserved_count = sum(o.party_size
                                for o in AdmissionOrder
                                if o.slot_id == slot.id and o.status in {CONFIRMED, CHECKED_IN})
                            - (guest tickets voided by membership-cancel cascade whose order is still CONFIRMED)
    input_set: "AdmissionOrder rows on the slot with status in {CONFIRMED, CHECKED_IN}; cascade-voided guest tickets subtract individually."
    constants: {}
    precision: "non-negative integer; floor at 0"

  - name: guest_pass_conservation
    trigger: "Invariant checked after every GuestPass transition (Rule 9)"
    algorithm: aggregation
    formula: |
      # Conserved quantity: per-term minted guest passes.
      count(status==UNUSED) + count(status==RESERVED) + count(status==REDEEMED) + count(status==EXPIRED)
        == plan.guest_passes_granted * membership.term_count_of_passes_minted
      # During a single term: UNUSED + RESERVED + REDEEMED == guest_passes_granted
      # (EXPIRED only appears after term rollover / cancel cascade).
    input_set: "All GuestPass rows for the membership in the current term."
    constants: {}
    precision: "exact integer counts"

  - name: household_count
    trigger: "POST /memberships/{id}/household-members (add), DELETE /household-members/{id} (remove)"
    algorithm: aggregation
    formula: |
      household_used = count(HouseholdMember where membership_id == m.id and active == true)
      # add is rejected when household_used + 1 > plan.household_max
    input_set: "Active HouseholdMember rows on the membership."
    constants: {}
    precision: "exact integer counts"

# -----------------------------------------------------------------------------
# §1.4 Validation Rules Table (ordered by priority)
# -----------------------------------------------------------------------------
validations:
  - priority: 1
    category: auth
    check: "X-User-Role header present and is a declared role"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all

  - priority: 2
    category: auth
    check: "Role is permitted for this operation per §1.7"
    error_id: ERR_FORBIDDEN_ROLE
    http_status: 403
    applies_to: all

  - priority: 3
    category: auth
    check: "For entity_backed Patron actions on owned resources, X-User-ID equals the resource's owning patron_id / primary_patron_id"
    error_id: ERR_NOT_RESOURCE_OWNER
    http_status: 403
    applies_to: "Patron actions on Membership, AdmissionOrder owned by the caller"

  - priority: 4
    category: existence
    check: "Every path/body resource id resolves (validated left-to-right)"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: all

  - priority: 5
    category: business_constraint
    check: "Request body conforms (required fields present, enums valid, integers >= 0 where specified)"
    error_id: ERR_INVALID_REQUEST
    http_status: 422
    applies_to: all writes

  - priority: 5
    category: business_constraint
    check: "Pagination params in range: 1 <= limit <= 100, offset >= 0"
    error_id: ERR_VALIDATION_PAGINATION
    http_status: 422
    applies_to: "all list (GET collection) endpoints"

  - priority: 6
    category: business_constraint
    check: "Email uniqueness on Patron create"
    error_id: ERR_EMAIL_TAKEN
    http_status: 409
    applies_to: "POST /patrons"

  - priority: 7
    category: state
    check: "Target resource is in a state from which the requested transition is defined"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all transition endpoints"

  - priority: 8
    category: state
    check: "OCC: expected_membership_version equals Membership.version on renew"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /memberships/{id}/renew"

  - priority: 9
    category: business_referential
    check: "On order confirm with a MEMBER ticket, order.membership_id is set and the membership's primary_patron_id (or a household member) matches; GUEST tickets only on orders whose membership is set; RECIPROCAL tickets carry a resolvable reciprocal_partner_id"
    error_id: ERR_TICKET_ELIGIBILITY
    http_status: 409
    applies_to: "POST /admission-orders/{id}/confirm"

  - priority: 10
    category: state
    check: "On order confirm with a MEMBER ticket, the referenced Membership.status == ACTIVE (cross-entity, Rule 7)"
    error_id: ERR_MEMBERSHIP_NOT_ACTIVE
    http_status: 409
    applies_to: "POST /admission-orders/{id}/confirm"

  - priority: 11
    category: business_temporal
    check: "On order confirm, slot.starts_at > clock.now (window has not opened); on check-in, slot.starts_at <= clock.now < slot.ends_at"
    error_id: ERR_SLOT_WINDOW
    http_status: 409
    applies_to: "POST /admission-orders/{id}/confirm, POST /admission-orders/{id}/check-in"

  - priority: 12
    category: business_temporal
    check: "Patron has no other CONFIRMED/CHECKED_IN order whose slot window overlaps this slot ([start,end) half-open; adjacency allowed). Distinct interval semantics from exhibit-session overlap (Rule 8)."
    error_id: ERR_SLOT_OVERLAP
    http_status: 409
    applies_to: "POST /admission-orders/{id}/confirm"

  - priority: 13
    category: business_temporal
    check: "Patron has no other booked ExhibitSession within buffer_minutes of this order's exhibit_session window (buffered closed interval; adjacency within buffer disallowed). Distinct interval semantics from slot overlap (Rule 8)."
    error_id: ERR_EXHIBIT_BUFFER_CONFLICT
    http_status: 409
    applies_to: "POST /admission-orders/{id}/confirm"

  - priority: 14
    category: business_fiscal
    check: "On order confirm, the membership has at least one UNUSED GuestPass per GUEST ticket (empty pool rejects, Rule 6)"
    error_id: ERR_NO_GUEST_PASS
    http_status: 409
    applies_to: "POST /admission-orders/{id}/confirm"

  - priority: 15
    category: business_fiscal
    check: "On order confirm, slot.reserved_count + party_size <= slot.capacity_total (boundary >=, Rule 6); same for exhibit session capacity"
    error_id: ERR_SLOT_CAPACITY
    http_status: 409
    applies_to: "POST /admission-orders/{id}/confirm"

  - priority: 16
    category: business_constraint
    check: "Adding a HouseholdMember does not exceed plan.household_max active members"
    error_id: ERR_HOUSEHOLD_FULL
    http_status: 409
    applies_to: "POST /memberships/{id}/household-members"

# -----------------------------------------------------------------------------
# §1.5 API Endpoint Table
# -----------------------------------------------------------------------------
endpoints:
  # --- Patron ---
  - { method: POST, path: "/patrons", description: "Create a patron account", roles: [BoxOffice, MembershipAdmin], code: 201, input: [email, full_name, "home_partner_id?"], output: Patron, side_effects: ["version=1"] }
  - { method: GET, path: "/patrons/{id}", description: "Read a patron", roles: [Patron, BoxOffice, MembershipAdmin], code: 200, input: [], output: Patron, side_effects: [] }
  - { method: GET, path: "/patrons", description: "List patrons (filter by email or home_partner_id)", roles: [BoxOffice, MembershipAdmin], code: 200, input: ["email?", "home_partner_id?", "limit?", "offset?"], output: "Patron[]", side_effects: [] }

  # --- MembershipPlan (config) ---
  - { method: POST, path: "/membership-plans", description: "Create a membership plan (tier)", roles: [MembershipAdmin], code: 201, input: [tier, annual_fee_cents, household_max, guest_passes_granted, member_admission_cents, "exhibit_surcharge_waived?", "reciprocal_eligible?", "term_days?", "reinstatement_fee_cents?"], output: MembershipPlan, side_effects: [] }
  - { method: GET, path: "/membership-plans/{id}", description: "Read a plan", roles: [Patron, BoxOffice, MembershipAdmin], code: 200, input: [], output: MembershipPlan, side_effects: [] }
  - { method: GET, path: "/membership-plans", description: "List plans", roles: [Patron, BoxOffice, MembershipAdmin], code: 200, input: ["tier?", "limit?", "offset?"], output: "MembershipPlan[]", side_effects: [] }

  # --- Membership ---
  - { method: POST, path: "/memberships", description: "Create a membership (status PENDING_PAYMENT) for a patron on a plan", roles: [Patron, BoxOffice, MembershipAdmin], code: 201, input: [plan_id, primary_patron_id, "auto_renew?", "donation_cents?"], output: Membership, side_effects: ["status=PENDING_PAYMENT"] }
  - { method: GET, path: "/memberships/{id}", description: "Read a membership", roles: [Patron, BoxOffice, MembershipAdmin], code: 200, input: [], output: Membership, side_effects: [] }
  - { method: GET, path: "/memberships", description: "List memberships (filter by plan_id, primary_patron_id, status)", roles: [BoxOffice, MembershipAdmin], code: 200, input: ["plan_id?", "primary_patron_id?", "status?", "limit?", "offset?"], output: "Membership[]", side_effects: [] }
  - { method: POST, path: "/memberships/{id}/renew", description: "Renew a membership (early while ACTIVE, or reinstate while GRACE)", roles: [Patron, BoxOffice], code: 200, input: [expected_membership_version, "donation_cents?"], output: Membership, side_effects: ["expires_at extended or restarted", "fresh guest passes minted", "term_count += 1", "increments Membership.version by 1", "Donation created if donation_cents>0"] }
  - { method: POST, path: "/memberships/{id}/cancel", description: "Cancel a membership", roles: [Patron, BoxOffice], code: 200, input: [], output: Membership, side_effects: ["status=CANCELLED", "guest-pass cascade depth 3"] }
  - { method: PATCH, path: "/memberships/{id}/auto-renew", description: "Toggle auto_renew flag", roles: [Patron, BoxOffice], code: 200, input: [auto_renew], output: Membership, side_effects: ["increments Membership.version by 1"] }

  # --- HouseholdMember ---
  - { method: POST, path: "/memberships/{id}/household-members", description: "Add a household member", roles: [Patron, BoxOffice], code: 201, input: [full_name, relationship], output: HouseholdMember, side_effects: ["counts against plan.household_max"] }
  - { method: GET, path: "/household-members/{id}", description: "Read a household member", roles: [Patron, BoxOffice, MembershipAdmin], code: 200, input: [], output: HouseholdMember, side_effects: [] }
  - { method: GET, path: "/household-members", description: "List household members (filter by membership_id)", roles: [Patron, BoxOffice, MembershipAdmin], code: 200, input: ["membership_id?", "limit?", "offset?"], output: "HouseholdMember[]", side_effects: [] }
  - { method: DELETE, path: "/household-members/{id}", description: "Remove a household member (active=false)", roles: [Patron, BoxOffice], code: 200, input: [], output: HouseholdMember, side_effects: ["active=false; frees a household slot"] }

  # --- GuestPass ---
  - { method: GET, path: "/guest-passes/{id}", description: "Read a guest pass", roles: [Patron, BoxOffice, MembershipAdmin], code: 200, input: [], output: GuestPass, side_effects: [] }
  - { method: GET, path: "/guest-passes", description: "List guest passes (filter by membership_id, status, reserved_order_id)", roles: [Patron, BoxOffice, MembershipAdmin], code: 200, input: ["membership_id?", "status?", "reserved_order_id?", "limit?", "offset?"], output: "GuestPass[]", side_effects: [] }
  - { method: GET, path: "/guest-passes/{id}/tickets", description: "List AdmissionTickets linked to a guest pass", roles: [Patron, BoxOffice, MembershipAdmin], code: 200, input: [], output: "AdmissionTicket[]", side_effects: [] }

  # --- TimedEntrySlot ---
  - { method: POST, path: "/timed-entry-slots", description: "Create a timed-entry slot", roles: [MembershipAdmin], code: 201, input: [starts_at, ends_at, capacity_total, non_member_admission_cents], output: TimedEntrySlot, side_effects: ["status=OPEN", "reserved_count=0"] }
  - { method: GET, path: "/timed-entry-slots/{id}", description: "Read a slot (includes reserved_count)", roles: [Patron, BoxOffice, MembershipAdmin], code: 200, input: [], output: TimedEntrySlot, side_effects: [] }
  - { method: GET, path: "/timed-entry-slots", description: "List slots", roles: [Patron, BoxOffice, MembershipAdmin], code: 200, input: ["status?", "limit?", "offset?"], output: "TimedEntrySlot[]", side_effects: [] }
  - { method: POST, path: "/timed-entry-slots/{id}/close", description: "Close a slot to new bookings", roles: [MembershipAdmin], code: 200, input: [], output: TimedEntrySlot, side_effects: ["status=CLOSED", "increments TimedEntrySlot.version by 1"] }

  # --- SpecialExhibit + ExhibitSession ---
  - { method: POST, path: "/special-exhibits", description: "Create a special exhibit", roles: [MembershipAdmin], code: 201, input: [name, surcharge_cents, "member_surcharge_discount_pct?", "buffer_minutes?"], output: SpecialExhibit, side_effects: [] }
  - { method: GET, path: "/special-exhibits/{id}", description: "Read a special exhibit", roles: [Patron, BoxOffice, MembershipAdmin], code: 200, input: [], output: SpecialExhibit, side_effects: [] }
  - { method: GET, path: "/special-exhibits", description: "List special exhibits", roles: [Patron, BoxOffice, MembershipAdmin], code: 200, input: ["limit?", "offset?"], output: "SpecialExhibit[]", side_effects: [] }
  - { method: POST, path: "/special-exhibits/{id}/sessions", description: "Create a session window under an exhibit", roles: [MembershipAdmin], code: 201, input: [starts_at, ends_at, capacity_total], output: ExhibitSession, side_effects: ["reserved_count=0"] }
  - { method: GET, path: "/special-exhibits/{id}/sessions", description: "List sessions of an exhibit (FK reverse)", roles: [Patron, BoxOffice, MembershipAdmin], code: 200, input: [], output: "ExhibitSession[]", side_effects: [] }
  - { method: GET, path: "/exhibit-sessions/{id}", description: "Read an exhibit session", roles: [Patron, BoxOffice, MembershipAdmin], code: 200, input: [], output: ExhibitSession, side_effects: [] }

  # --- ReciprocalPartner ---
  - { method: POST, path: "/reciprocal-partners", description: "Create a reciprocal-network partner", roles: [MembershipAdmin], code: 201, input: [org_name, benefit_type, "discount_pct?"], output: ReciprocalPartner, side_effects: [] }
  - { method: GET, path: "/reciprocal-partners/{id}", description: "Read a reciprocal partner", roles: [Patron, BoxOffice, MembershipAdmin], code: 200, input: [], output: ReciprocalPartner, side_effects: [] }
  - { method: GET, path: "/reciprocal-partners", description: "List reciprocal partners", roles: [Patron, BoxOffice, MembershipAdmin], code: 200, input: ["limit?", "offset?"], output: "ReciprocalPartner[]", side_effects: [] }

  # --- AdmissionOrder ---
  - { method: POST, path: "/admission-orders", description: "Create a DRAFT admission order", roles: [Patron, BoxOffice], code: 201, input: [patron_id, slot_id, "membership_id?", "exhibit_session_id?", "donation_cents?"], output: AdmissionOrder, side_effects: ["status=DRAFT", "party_size=0", "quoted_total_cents=donation_cents"] }
  - { method: GET, path: "/admission-orders/{id}", description: "Read an order", roles: [Patron, BoxOffice, MembershipAdmin], code: 200, input: [], output: AdmissionOrder, side_effects: [] }
  - { method: GET, path: "/admission-orders", description: "List orders (filter by patron_id, slot_id, membership_id, exhibit_session_id, status)", roles: [BoxOffice, MembershipAdmin], code: 200, input: ["patron_id?", "slot_id?", "membership_id?", "exhibit_session_id?", "status?", "limit?", "offset?"], output: "AdmissionOrder[]", side_effects: [] }
  - { method: POST, path: "/admission-orders/{id}/tickets", description: "Add a ticket to a DRAFT order (one person)", roles: [Patron, BoxOffice], code: 201, input: [ticket_type, person_name, "reciprocal_partner_id?"], output: AdmissionTicket, side_effects: ["party_size += 1", "recompute quoted_total_cents (provisional)"] }
  - { method: PATCH, path: "/admission-orders/{id}", description: "Update donation_cents on a DRAFT order", roles: [Patron, BoxOffice], code: 200, input: [donation_cents], output: AdmissionOrder, side_effects: ["recompute quoted_total_cents (provisional)", "increments AdmissionOrder.version by 1"] }
  - { method: POST, path: "/admission-orders/{id}/confirm", description: "Confirm a DRAFT order (lock pricing, reserve capacity + guest passes)", roles: [Patron, BoxOffice], code: 200, input: [], output: AdmissionOrder, side_effects: ["status=CONFIRMED", "final_total_cents + per-ticket price_cents locked", "slot.reserved_count += party_size", "guest passes RESERVED", "Donation created if donation_cents>0"] }
  - { method: POST, path: "/admission-orders/{id}/check-in", description: "Check in a CONFIRMED order during its window", roles: [BoxOffice, GateScanner], code: 200, input: [], output: AdmissionOrder, side_effects: ["status=CHECKED_IN", "tickets SCANNED", "guest passes REDEEMED"] }
  - { method: POST, path: "/admission-orders/{id}/cancel", description: "Cancel a DRAFT or CONFIRMED order", roles: [Patron, BoxOffice], code: 200, input: [], output: AdmissionOrder, side_effects: ["status=CANCELLED", "tickets VOIDED", "capacity + reserved guest passes released"] }
  - { method: POST, path: "/admission-orders/{id}/refund", description: "Refund a CHECKED_IN order", roles: [BoxOffice], code: 200, input: [], output: AdmissionOrder, side_effects: ["status=REFUNDED", "tickets VOIDED", "capacity released", "redeemed guest passes EXPIRED"] }

  # --- AdmissionTicket ---
  - { method: GET, path: "/admission-tickets/{id}", description: "Read a ticket", roles: [Patron, BoxOffice, MembershipAdmin], code: 200, input: [], output: AdmissionTicket, side_effects: [] }
  - { method: GET, path: "/admission-tickets", description: "List tickets (filter by order_id, guest_pass_id, reciprocal_partner_id)", roles: [Patron, BoxOffice, MembershipAdmin], code: 200, input: ["order_id?", "guest_pass_id?", "reciprocal_partner_id?", "limit?", "offset?"], output: "AdmissionTicket[]", side_effects: [] }

  # --- Donation ---
  - { method: GET, path: "/donations/{id}", description: "Read a donation", roles: [BoxOffice, MembershipAdmin], code: 200, input: [], output: Donation, side_effects: [] }
  - { method: GET, path: "/donations", description: "List donations (filter by order_id, membership_id)", roles: [BoxOffice, MembershipAdmin], code: 200, input: ["order_id?", "membership_id?", "limit?", "offset?"], output: "Donation[]", side_effects: [] }

  # --- Test-driving endpoints (/_*) ---
  - { method: POST, path: "/_clock/set_current_utc", description: "Set the server's logical UTC clock to an arbitrary ISO 8601 instant", roles: [MembershipAdmin], code: 200, input: [to_iso8601], output: "{ now: string }", side_effects: ["clock.now = to_iso8601"] }
  - { method: POST, path: "/_payments/settle", description: "Settle a pending payment for a membership activation (drives PENDING_PAYMENT -> ACTIVE)", roles: [MembershipAdmin], code: 200, input: [target, membership_id, outcome], output: Membership, side_effects: ["on SUCCEEDED: membership ACTIVE, guest passes minted, Donation created if pending"] }
  - { method: POST, path: "/_jobs/run_renewals", description: "Run the auto-renew batch: renew every ACTIVE membership with auto_renew==true whose expires_at <= clock.now", roles: [MembershipAdmin], code: 200, input: [], output: "{ renewed_count: integer, renewed_membership_ids: string }", side_effects: ["each matched membership renewed (variant=early)"] }
  - { method: POST, path: "/_jobs/run_expirations", description: "Run the expiry batch: ACTIVE+!auto_renew past expires_at -> GRACE; GRACE past grace_until -> EXPIRED", roles: [MembershipAdmin], code: 200, input: [], output: "{ graced_count: integer, expired_count: integer }", side_effects: ["membership status transitions + guest-pass cascades"] }

# -----------------------------------------------------------------------------
# §1.6 Error Code Catalog
# -----------------------------------------------------------------------------
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "X-User-Role header missing or not a declared role" }
  - { id: ERR_FORBIDDEN_ROLE, http: 403, condition: "Role not permitted for this operation" }
  - { id: ERR_NOT_RESOURCE_OWNER, http: 403, condition: "Patron acting on a membership/order they do not own" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Referenced resource id does not resolve" }
  - { id: ERR_INVALID_REQUEST, http: 422, condition: "Missing required field, bad enum, or negative integer where >=0 required" }
  - { id: ERR_EMAIL_TAKEN, http: 409, condition: "Patron email already exists" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Resource not in a state from which the requested transition is defined" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_membership_version does not match Membership.version on renew" }
  - { id: ERR_TICKET_ELIGIBILITY, http: 409, condition: "Ticket type not eligible: MEMBER without active membership link, GUEST without membership, RECIPROCAL without resolvable partner" }
  - { id: ERR_MEMBERSHIP_NOT_ACTIVE, http: 409, condition: "Order confirm with MEMBER ticket but referenced membership is not ACTIVE" }
  - { id: ERR_SLOT_WINDOW, http: 409, condition: "Confirm after slot window opened, or check-in outside [starts_at, ends_at)" }
  - { id: ERR_SLOT_OVERLAP, http: 409, condition: "Patron already has a CONFIRMED/CHECKED_IN order whose slot window overlaps this slot" }
  - { id: ERR_EXHIBIT_BUFFER_CONFLICT, http: 409, condition: "Patron has another booked exhibit session within the exhibit's buffer window" }
  - { id: ERR_NO_GUEST_PASS, http: 409, condition: "No UNUSED guest pass available for a requested GUEST ticket" }
  - { id: ERR_SLOT_CAPACITY, http: 409, condition: "Slot or exhibit-session capacity would be exceeded by this party" }
  - { id: ERR_HOUSEHOLD_FULL, http: 409, condition: "Adding a household member would exceed plan.household_max" }
  - { id: ERR_VALIDATION_PAGINATION, http: 422, condition: "limit/offset out of allowed range" }

# -----------------------------------------------------------------------------
# §1.7 RBAC Matrix
# -----------------------------------------------------------------------------
roles:
  - name: Patron
    description: "Account holder; buys admission, manages own membership, household, renewals, and orders"
    identity: "entity_backed:Patron"
    exclusive_operations: []
    shared_operations:
      - "POST /memberships — create own membership (primary_patron_id must equal X-User-ID)"
      - "POST /memberships/{id}/renew — renew own membership"
      - "POST /memberships/{id}/cancel — cancel own membership"
      - "PATCH /memberships/{id}/auto-renew — toggle auto-renew on own membership"
      - "POST /memberships/{id}/household-members — add household member to own membership"
      - "DELETE /household-members/{id} — remove household member from own membership"
      - "POST /admission-orders — create own order (patron_id must equal X-User-ID)"
      - "POST /admission-orders/{id}/tickets — add tickets to own DRAFT order"
      - "PATCH /admission-orders/{id} — edit own DRAFT order donation"
      - "POST /admission-orders/{id}/confirm — confirm own order"
      - "POST /admission-orders/{id}/cancel — cancel own order"
      - "GET reads on own/public resources"

  - name: BoxOffice
    description: "Front-desk operator; sells walk-up admission/memberships, checks in, processes refunds on behalf of patrons"
    identity: "opaque"
    exclusive_operations:
      - "POST /patrons — register a patron"
      - "POST /admission-orders/{id}/refund — refund a checked-in order"
    shared_operations:
      - "POST /memberships, /memberships/{id}/renew, /memberships/{id}/cancel, /memberships/{id}/household-members"
      - "PATCH /memberships/{id}/auto-renew"
      - "DELETE /household-members/{id}"
      - "POST /admission-orders, /admission-orders/{id}/tickets, /admission-orders/{id}/confirm, /admission-orders/{id}/cancel"
      - "PATCH /admission-orders/{id}"
      - "POST /admission-orders/{id}/check-in"
      - "GET reads"

  - name: GateScanner
    description: "Gate device; checks in confirmed orders at the entry window"
    identity: "opaque"
    exclusive_operations: []
    shared_operations:
      - "POST /admission-orders/{id}/check-in — check in during the slot window"

  - name: MembershipAdmin
    description: "Catalog administrator; manages plans, slots, special exhibits/sessions, reciprocal partners; runs operational jobs and the clock"
    identity: "opaque"
    exclusive_operations:
      - "POST /membership-plans — create plans"
      - "POST /timed-entry-slots, /timed-entry-slots/{id}/close — manage slots"
      - "POST /special-exhibits, /special-exhibits/{id}/sessions — manage exhibits"
      - "POST /reciprocal-partners — manage reciprocal network"
      - "POST /_clock/set_current_utc — set logical clock"
      - "POST /_payments/settle — settle membership payment"
      - "POST /_jobs/run_renewals, /_jobs/run_expirations — run batch jobs"
    shared_operations:
      - "POST /patrons — register a patron"
      - "GET reads (including /donations)"
