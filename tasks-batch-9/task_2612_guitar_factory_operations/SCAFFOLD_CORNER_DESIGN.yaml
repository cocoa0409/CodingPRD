      - name: a_second_inspection_round_cannot_be_opened_and_an_open_round_cannot_be_signed
        claim_type: error_triggerable
        grounds: ["errors[ERR_INSPECTION_ROUND_OPEN]", "errors[ERR_INSPECTION_STATE_INVALID]", "state_machines.SetupInspection.transitions"]
        distinguishing_aspect: "The setup-inspections self-loop lets an order already at INSPECTION pass the priority-50 state check, so a second open surfaces the business rule 409 ERR_INSPECTION_ROUND_OPEN rather than ERR_BUILD_STAGE_INVALID. Independently, sign refuses an OPEN round with 409 ERR_INSPECTION_STATE_INVALID because it demands MEASURED, and a second measure on the same round is refused for the mirror reason."
        test_recipe:
          setup: "An order at INSPECTION with round 1 OPEN, opened by luthier lu-eve."
          setup_api_calls: *order_at_inspection
          trigger: "POST /build-orders/${bo1}/setup-inspections as Luthier with X-User-ID lu-eve, then POST /setup-inspections/${insp1}/sign as QualityInspector with X-User-ID qi-frank, then POST /setup-inspections/${insp1}/measure with action_mm_treble 1.60, action_mm_bass 2.20, relief_mm 0.25 and intonation_cents_max 4.0 as Luthier with X-User-ID lu-eve, then POST /setup-inspections/${insp1}/measure with the same numbers again"
          assert:
            second_open_http_status: 409
            second_open_error_id: "ERR_INSPECTION_ROUND_OPEN"
            setup_inspections_total_count_after_refused_open: 1
            sign_while_open_http_status: 409
            sign_while_open_error_id: "ERR_INSPECTION_STATE_INVALID"
            status_after_refused_sign: "OPEN"
            inspector_user_id_after_refused_sign: null
            measure_http_status: 200
            status_after_measure: "MEASURED"
            deviation_score: 0.00
            second_measure_http_status: 409
            second_measure_error_id: "ERR_INSPECTION_STATE_INVALID"
            note: "A signed and PASSED round CAN be followed by a fresh round through the same self-loop — that is how a superseding unsigned round comes to exist — so the refusal here is specifically about a round that is still OPEN or MEASURED."

      - name: the_fourth_inspection_round_is_refused_after_three_failures
        claim_type: error_triggerable
        grounds: ["errors[ERR_MAX_REWORK_EXCEEDED]", "state_machines.BuildOrder.build_stage.transitions", "calculations.build_priority_score"]
        distinguishing_aspect: "MAX_REWORK_ROUNDS (3) is a ceiling on the COUNT of failed rounds, not on the count of rows: after three FAIL signatures rework_round_count is 3 and the fourth open is refused 409 ERR_MAX_REWORK_EXCEEDED, while the order is still parked in SETUP rather than being auto-scrapped. The escalation term also fires on every failure from the second onward, so promised_date has slipped twice by 14 days and priority_score has collapsed to the AT_RISK-only value of 25.00."
        test_recipe:
          setup: "An order at INSPECTION with round 1 OPEN, opened by lu-eve; the clock stands at 2026-08-16T00:00:00Z."
          setup_api_calls: *order_at_inspection
          trigger: "Three times over: POST /setup-inspections/{the open round}/measure with action_mm_treble 1.75, action_mm_bass 2.10, relief_mm 0.20 and intonation_cents_max 4.8 as Luthier with X-User-ID lu-eve, POST /setup-inspections/{that round}/sign as QualityInspector with X-User-ID qi-frank, and POST /build-orders/${bo1}/setup-inspections as Luthier with X-User-ID lu-eve to open the next round — the third re-open being the one that is refused"
          assert:
            round_1_verdict: "FAIL"
            after_round_1_build_stage: "SETUP"
            after_round_1_rework_round_count: 1
            after_round_1_commercial_status: "OPTIONS_LOCKED"
            after_round_1_promised_date: "2026-11-01T00:00:00Z"
            round_2_open_http_status: 200
            round_2_round_number: 2
            after_round_2_rework_round_count: 2
            after_round_2_commercial_status: "AT_RISK"
            after_round_2_promised_date: "2026-11-15T00:00:00Z"
            round_3_open_http_status: 200
            round_3_round_number: 3
            after_round_3_rework_round_count: 3
            after_round_3_commercial_status: "AT_RISK"
            after_round_3_promised_date: "2026-11-29T00:00:00Z"
            fourth_open_http_status: 409
            fourth_open_error_id: "ERR_MAX_REWORK_EXCEEDED"
            setup_inspections_total_count_after: 3
            build_stage_after: "SETUP"
            priority_score_after: 25.00
            note: "Each measurement scores 13.00 > PASS_SCORE_MAX 10.00. The escalation clause reads 'reached REWORK_ESCALATION_THRESHOLD (2) or more', so it applies again on the third failure: 2026-11-01 + 14 + 14 days = 2026-11-29. priority_score = 0 (NONE) + 0 (not custom) + 25 (AT_RISK) + max(0, 90 - 105) * 0.5 = 25.00 at the 2026-08-16 clock. The component-side ceiling MAX_COMPONENT_REWORKS (2) shares this error id but is a different counter."

      - name: the_option_review_verbs_are_single_use_per_row
        claim_type: error_triggerable
        grounds: ["errors[ERR_OPTION_SELECTION_STATE_INVALID]", "state_machines.OptionSelection.transitions", "calculations.custom_shop_quote_total"]
        distinguishing_aspect: "approve is legal exactly once from PENDING_APPROVAL and reject is legal from PENDING_APPROVAL or SELECTED, so a repeat of either is 409 ERR_OPTION_SELECTION_STATE_INVALID; crucially the approve does NOT move the provisional total (both states are inside the PROVISIONAL input set) while the reject does, which separates the two verbs by their observable side effect and not just by their target state."
        test_recipe:
          setup: "A standard OM45 order at base 300000 with INL-DOT and HW-GOLD both PENDING_APPROVAL, created by coordinator cs-gwen."
          setup_api_calls: *order_two_options
          trigger: "POST /option-selections/${selD}/approve as CustomShopCoordinator with X-User-ID cs-hana, then the same approve again, then POST /option-selections/${selD}/reject with reason \"customer changed the inlay\" as CustomShopCoordinator with X-User-ID cs-hana, then the same reject again"
          assert:
            approve_http_status: 200
            selD_status_after_approve: "SELECTED"
            provisional_after_approve: 345910
            second_approve_http_status: 409
            second_approve_error_id: "ERR_OPTION_SELECTION_STATE_INVALID"
            reject_http_status: 200
            selD_status_after_reject: "REJECTED"
            provisional_after_reject: 329705
            selD_line_total_cents_after_reject: 16205
            second_reject_http_status: 409
            second_reject_error_id: "ERR_OPTION_SELECTION_STATE_INVALID"
            selG_status_throughout: "PENDING_APPROVAL"
            note: "The approver must differ from created_by_user_id, which is why cs-hana acts here — cs-gwen approving her own row is the segregation-of-duties case in the rbac section. 345910 = 300000 + 16205 + 29705; 329705 = 300000 + 29705."

      - name: the_shop_authorization_verbs_refuse_repeats_and_wrong_starting_states
        claim_type: error_triggerable
        grounds: ["errors[ERR_SHOP_STATE_INVALID]", "state_machines.RepairShop.transitions", "entities.RepairShop.status"]
        distinguishing_aspect: "The two verbs guard opposite states: authorize is refused on an already AUTHORIZED shop and suspend is refused on a shop that is still APPLIED, both 409 ERR_SHOP_STATE_INVALID. A shop that has never been authorized therefore cannot be suspended at all, and neither refusal changes authorization_level."
        test_recipe:
          setup: "Two AUTHORIZED shops SHP-A (FULL_SERVICE) and SHP-B (WARRANTY_ONLY)."
          setup_api_calls: *two_authorized_shops
          trigger: "POST /repair-shops/${shopA}/authorize with authorization_level CUSTOM_SHOP_CERTIFIED as ServiceNetworkManager, then POST /repair-shops with shop_code SHP-C, shop_name Chugoku Guitar Care and country_code JP as ServiceNetworkManager followed by POST /repair-shops/{SHP-C}/suspend with reason \"never authorised\" as ServiceNetworkManager, then POST /repair-shops/${shopA}/suspend with reason \"audit finding\" as ServiceNetworkManager, then that same suspend again"
          assert:
            re_authorize_http_status: 409
            re_authorize_error_id: "ERR_SHOP_STATE_INVALID"
            shop_a_authorization_level_after: "FULL_SERVICE"
            suspend_applied_shop_http_status: 409
            suspend_applied_shop_error_id: "ERR_SHOP_STATE_INVALID"
            shop_c_status_after: "APPLIED"
            shop_c_authorization_level_after: "NONE"
            first_suspend_http_status: 200
            shop_a_status_after_suspend: "SUSPENDED"
            second_suspend_http_status: 409
            second_suspend_error_id: "ERR_SHOP_STATE_INVALID"
            note: "The refused re-authorize is the tell that authorization_level is not a free-form update channel: raising SHP-A from FULL_SERVICE to CUSTOM_SHOP_CERTIFIED requires a suspend first, and the level survives the refusal unchanged."

      - name: a_voided_warranty_frees_the_instrument_for_a_fresh_registration
        claim_type: error_triggerable
        grounds: ["errors[ERR_WARRANTY_STATE_INVALID]", "errors[ERR_WARRANTY_ALREADY_REGISTERED]", "entities.RepairShop.warranty_claim_count"]
        distinguishing_aspect: "The duplicate guard counts only ACTIVE rows: a second registration while one is ACTIVE is 409 ERR_WARRANTY_ALREADY_REGISTERED, a second void is 409 ERR_WARRANTY_STATE_INVALID, and once the first row is VOID the very same registration payload succeeds with 201 — so the uniqueness is on (build_order_id, status ACTIVE) and not on build_order_id alone. The shop's warranty_claim_count tracks that same ACTIVE population up and back down."
        test_recipe:
          setup: "An order carried to INSPECTION with round 1 OPEN by lu-eve, at the 2026-08-16 clock."
          setup_api_calls: *order_at_inspection
          trigger: "Measure round 1 at 1.60 / 2.20 / 0.25 / 4.0 as lu-eve and sign as qi-frank so the verdict is PASS, then POST /build-orders/${bo1}/assign-serial as CustomShopCoordinator, then POST /repair-shops with shop_code SHP-1, shop_name Kanto Fret Works and country_code JP as ServiceNetworkManager followed by POST /repair-shops/{SHP-1}/authorize with authorization_level FULL_SERVICE, then POST /warranty-registrations with build_order_id ${bo1}, that shop, serial_number OM45-2026-00001, owner_email owner@example.com and purchase_date 2026-08-16T00:00:00Z as ServiceNetworkManager, then the same registration again, then POST /warranty-registrations/{the first row}/void with reason \"registered to the wrong owner\" as ServiceNetworkManager, then that same void again, then the original registration payload once more"
          assert:
            first_registration_http_status: 201
            first_registration_status: "ACTIVE"
            first_registration_coverage_months: 24
            first_registration_coverage_ends_at: "2028-08-16T00:00:00Z"
            shop_warranty_claim_count_after_first: 1
            duplicate_http_status: 409
            duplicate_error_id: "ERR_WARRANTY_ALREADY_REGISTERED"
            void_http_status: 200
            status_after_void: "VOID"
            shop_warranty_claim_count_after_void: 0
            second_void_http_status: 409
            second_void_error_id: "ERR_WARRANTY_STATE_INVALID"
            re_registration_http_status: 201
            warranty_registrations_total_count_after: 2
            shop_warranty_claim_count_after_re_registration: 1
            note: "coverage_months is 24 because is_custom_shop is false; 2026-08-16 plus 24 calendar months lands exactly on 2028-08-16. The VOID row stays in the collection for audit, which is why total_count is 2 while the counter is 1."

      - name: the_climate_posture_code_is_covered_by_the_four_level_cascade_instance
        claim_type: error_triggerable
        grounds: ["errors[ERR_ROOM_CLIMATE_OUT_OF_SPEC]", "validations.priority_60"]
        excluded_because:
          difficulty_instance: climate_excursion_cascades_four_levels_deep
          rationale: "That §1.8 instance drives a booth OUT_OF_SPEC and then attempts the guarded operations, so the code is already triggered inside a richer setting than a standalone probe could build."

      - name: the_cites_verification_code_is_covered_by_the_p2_pair_instance
        claim_type: error_triggerable
        grounds: ["errors[ERR_CITES_PERMIT_UNVERIFIED]", "validations.priority_61"]
        excluded_because:
          difficulty_instance: p2_cites_compliance_outranks_deposit_settlement
          rationale: "The unverified-permit refusal on export release is asserted there together with its precedence over the deposit threshold."

      - name: the_protected_species_and_rework_refusal_codes_are_covered_by_the_lot_rejection_cascade
        claim_type: error_triggerable
        grounds: ["errors[ERR_PROTECTED_SPECIES_QUARANTINED]", "errors[ERR_REWORK_NOT_PERMITTED]"]
        excluded_because:
          difficulty_instance: lot_rejection_cascades_four_levels_through_a_different_spine
          rationale: "Both codes belong to that cascade: a component whose lot was rejected refuses a new cut and refuses a REWORK disposition, and the instance asserts each refusal at the point the cascade creates it."

      - name: the_grade_floor_code_is_covered_by_the_p4_pair_instance
        claim_type: error_triggerable
        grounds: ["errors[ERR_GRADE_BELOW_MINIMUM]", "validations.priority_65"]
        excluded_because:
          difficulty_instance: p4_protected_species_safety_outranks_grade_compatibility
          rationale: "The grade floor is one half of that priority pair and is asserted both alone and in combination with the compliance guard."

      - name: the_reservation_state_code_is_covered_by_the_i3_invariant_instance
        claim_type: error_triggerable
        grounds: ["errors[ERR_RESERVATION_STATE_INVALID]", "state_machines.StationReservation.transitions"]
        excluded_because:
          difficulty_instance: i3_station_minutes_conserved_when_a_hold_is_released
          rationale: "Releasing an already-released hold is the second half of that instance, where the refusal is asserted alongside the proof that the station minute buckets did not move twice."

      - name: the_inspection_signature_gate_code_is_covered_by_the_assign_serial_instance
        claim_type: error_triggerable
        grounds: ["errors[ERR_INSPECTION_NOT_SIGNED]", "validations.priority_68"]
        excluded_because:
          difficulty_instance: assign_serial_requires_the_latest_inspection_signed_and_passing
          rationale: "That instance triggers the code from the hardest available angle — a superseded PASS round plus a newer unsigned round on the same order."

      - name: the_assembly_admission_codes_are_covered_by_the_component_flight_instance
        claim_type: error_triggerable
        grounds: ["errors[ERR_COMPONENTS_NOT_ACCEPTED]", "errors[ERR_COMPONENT_IN_FLIGHT]"]
        excluded_because:
          difficulty_instance: start_assembly_requires_every_component_out_of_flight
          rationale: "Both codes come out of the same start-assembly admission test, which that instance already varies across an empty accepted set and a half-finished sibling part."

      - name: the_booth_and_station_capacity_codes_are_covered_by_the_window_instances
        claim_type: error_triggerable
        grounds: ["errors[ERR_STATION_WINDOW_CONFLICT]", "errors[ERR_BOOTH_CAPACITY_EXCEEDED]", "errors[ERR_BOOTH_FINISH_INCOMPATIBLE]"]
        excluded_because:
          difficulty_instance: station_half_open_window_widened_by_changeover_on_both_sides
          rationale: "The station conflict code is asserted there at the changeover boundary, and the two booth codes are asserted together by p3_booth_finish_incompatibility_outranks_aggregate_capacity; a plain triggerability probe would add nothing to either."

  - section: rbac
    instances:
      - name: the_two_shared_sampling_operations_admit_exactly_their_declared_pairs
        claim_type: can_perform_own_operations
        grounds: ["roles.PlantAdmin.shared_operations", "roles.FinishTech.shared_operations", "roles.WoodBuyer", "endpoints.POST_/storage-rooms/{room_id}/climate-readings", "endpoints.POST_/tonewood-lots/{lot_id}/moisture-readings"]
        distinguishing_aspect: "PlantAdmin is the only role that sits in BOTH sampling pairs, so the two hygrometer and hygrometer-of-wood endpoints have overlapping but unequal role sets: FinishTech may log a room reading but not a lot reading, WoodBuyer may log a lot reading but not a room reading, and PlantAdmin may do both. A probe that only checked one role per endpoint could not tell a correctly-scoped implementation from one that shares every reading endpoint with every role."
        test_recipe:
          setup: "A DRY_STORE room DRY-1 (target 45.0 rh, tolerance 3.0, 21.0 C) and a RECEIVED lot LOT-001 stored in it."
          setup_api_calls: *lot_received
          trigger: "POST /storage-rooms/${dry1}/climate-readings with rh_pct 45.0 and temp_c 21.0 as PlantAdmin, then the same call with rh_pct 46.5 as FinishTech, then the same call as WoodBuyer, then POST /tonewood-lots/${lot1}/moisture-readings with moisture_content_pct 9.0 as WoodBuyer, then the same reading with 8.5 as PlantAdmin, then the same reading as FinishTech"
          assert:
            plant_admin_room_reading_http_status: 200
            finish_tech_room_reading_http_status: 200
            room_latest_rh_pct_after_finish_tech: 46.5
            room_climate_status_after_finish_tech: "IN_SPEC"
            wood_buyer_room_reading_http_status: 403
            wood_buyer_room_reading_error_id: "ERR_ROLE_NOT_PERMITTED"
            room_latest_rh_pct_after_refusal: 46.5
            wood_buyer_moisture_reading_http_status: 200
            plant_admin_moisture_reading_http_status: 200
            lot_moisture_content_pct_after: 8.5
            lot_status_after: "RECEIVED"
            finish_tech_moisture_reading_http_status: 403
            finish_tech_moisture_reading_error_id: "ERR_ROLE_NOT_PERMITTED"
            note: "46.5 is inside 45.0 +/- 3.0 so the room stays IN_SPEC and no cascade fires — the point of the instance is the role sets, not the climate machine. 8.5 sits ABOVE the 6.0-8.0 band, which is legal for a bare reading precisely because the band is only enforced at condition and release."

      - name: the_role_gate_outranks_every_business_check_on_a_peer_s_verb
        claim_type: cannot_perform_other_exclusive_operations
        grounds: ["validations.priority_20", "errors[ERR_ROLE_NOT_PERMITTED]", "roles.Machinist.exclusive_operations", "roles.Luthier.exclusive_operations"]
        distinguishing_aspect: "Each refused call is one the caller would ALSO fail on business grounds, and the assertion is that the priority-20 role check wins every time: a Machinist hand-shaping with a CNC-router reservation gets ERR_ROLE_NOT_PERMITTED rather than ERR_STATION_TYPE_MISMATCH, a Luthier re-routing an already CNC_ROUTED part gets it rather than ERR_COMPONENT_STATE_INVALID, and a QualityInspector confirming an order gets it rather than ERR_DEPOSIT_INSUFFICIENT on a deposit of 1 cent."
        test_recipe:
          setup: "A CNC_ROUTED component CMP-1 on lot LOT-001, with the consumed CNC-1 reservation res1 and an idle HAND_SHAPING station HS-1."
          setup_api_calls: *comp_routed
          trigger: "POST /components/${cmp1}/hand-shape with station_reservation_id ${res1} as Machinist, then POST /components/${cmp1}/route with station_reservation_id ${res1} and measured_thickness_mm 2.90 as Luthier, then POST /components/${cmp1}/qc with verdict ACCEPT and measured_thickness_mm 2.90 as Machinist, then POST /billets with billet_code BLT-009, lot_id ${lot1}, board_feet 5.00, grade AAA and expected_tonewood_lot_version ${lot_v1} as Luthier"
          assert:
            machinist_hand_shape_http_status: 403
            machinist_hand_shape_error_id: "ERR_ROLE_NOT_PERMITTED"
            luthier_route_http_status: 403
            luthier_route_error_id: "ERR_ROLE_NOT_PERMITTED"
            machinist_qc_http_status: 403
            machinist_qc_error_id: "ERR_ROLE_NOT_PERMITTED"
            luthier_billet_http_status: 403
            luthier_billet_error_id: "ERR_ROLE_NOT_PERMITTED"
            component_status_after: "CNC_ROUTED"
            billets_total_count_after: 1
            lot_board_feet_available_after: 69.10
            note: "Machinist and Luthier are peers who share reservations and the selector read but not a single physical verb, so the four refusals also prove that shared_operations does not leak into exclusive_operations. res1 is already CONSUMED, which would have been a second independent reason to refuse the first two calls."

      - name: an_authorized_shop_is_confined_to_its_own_row_and_the_role_gate_precedes_the_identity_gate
        claim_type: cannot_perform_other_exclusive_operations
        grounds: ["roles.AuthorizedShop.denied_operations", "validations.priority_20", "validations.priority_25", "errors[ERR_SHOP_IDENTITY_MISMATCH]"]
        distinguishing_aspect: "The entity_backed role fails in two different ways depending on which gate catches it first: endpoints that simply do not list AuthorizedShop return 403 ERR_ROLE_NOT_PERMITTED at priority 20 (the network list, the build-order list, another shop's authorize), while endpoints that DO list it return 403 ERR_SHOP_IDENTITY_MISMATCH at priority 25 when the named shop is not the caller. Asking the other shop to be authorized is the discriminator — it is both a role violation and an identity violation, and the role error must win."
        test_recipe:
          setup: "Two AUTHORIZED shops, SHP-A at FULL_SERVICE and SHP-B at WARRANTY_ONLY."
          setup_api_calls: *two_authorized_shops
          trigger: "As role AuthorizedShop with X-User-ID ${shopA}: GET /repair-shops/${shopA}, then GET /repair-shops/${shopB}, then GET /repair-shops, then GET /repair-shops?status=AUTHORIZED, then GET /build-orders, then GET /warranty-registrations?registering_shop_id=${shopB}, then GET /warranty-registrations?registering_shop_id=${shopA}, then POST /repair-shops/${shopB}/authorize with authorization_level CUSTOM_SHOP_CERTIFIED"
          assert:
            own_row_http_status: 200
            own_row_shop_code: "SHP-A"
            own_row_authorization_level: "FULL_SERVICE"
            other_row_http_status: 403
            other_row_error_id: "ERR_SHOP_IDENTITY_MISMATCH"
            unfiltered_list_http_status: 403
            unfiltered_list_error_id: "ERR_ROLE_NOT_PERMITTED"
            filtered_shop_list_http_status: 403
            filtered_shop_list_error_id: "ERR_ROLE_NOT_PERMITTED"
            build_order_list_http_status: 403
            build_order_list_error_id: "ERR_ROLE_NOT_PERMITTED"
            other_shops_registrations_http_status: 403
            other_shops_registrations_error_id: "ERR_SHOP_IDENTITY_MISMATCH"
            own_registrations_http_status: 200
            own_registrations_total_count: 0
            authorize_other_shop_http_status: 403
            authorize_other_shop_error_id: "ERR_ROLE_NOT_PERMITTED"
            shop_b_authorization_level_after: "WARRANTY_ONLY"
            note: "The shop list stays forbidden even with a filter that would have returned only the caller's own row, because the containment is by endpoint membership and not by result shape. Its own registration list is legal and simply empty."

      - name: the_signature_must_come_from_a_different_user_id_than_the_measurement
        claim_type: segregation_of_duties
        grounds: ["state_machines.SetupInspection.transitions", "errors[ERR_SEGREGATION_OF_DUTIES]", "entities.SetupInspection.inspector_user_id"]
        distinguishing_aspect: "The two identities are compared across a ROLE boundary, not within one: user lu-eve measures wearing the Luthier role and is then refused the sign while wearing the QualityInspector role, 403 ERR_SEGREGATION_OF_DUTIES, even though that role is exactly the one the sign endpoint demands. A per-request role check alone cannot catch this, and the refusal must leave inspector_user_id null so the round is still signable by someone else."
        test_recipe:
          setup: "An order at INSPECTION with round 1 OPEN, opened by luthier lu-eve."
          setup_api_calls: *order_at_inspection
          trigger: "POST /setup-inspections/${insp1}/measure with action_mm_treble 1.60, action_mm_bass 2.20, relief_mm 0.25 and intonation_cents_max 4.0 as Luthier with X-User-ID lu-eve, then POST /setup-inspections/${insp1}/sign as QualityInspector with X-User-ID lu-eve, then POST /setup-inspections/${insp1}/sign as QualityInspector with X-User-ID qi-frank"
          assert:
            measure_http_status: 200
            performed_by_user_id: "lu-eve"
            deviation_score: 0.00
            status_after_measure: "MEASURED"
            self_sign_http_status: 403
            self_sign_error_id: "ERR_SEGREGATION_OF_DUTIES"
            status_after_self_sign: "MEASURED"
            verdict_after_self_sign: "PENDING"
            inspector_user_id_after_self_sign: null
            other_sign_http_status: 200
            status_after_other_sign: "SIGNED"
            verdict_after_other_sign: "PASS"
            inspector_user_id_after_other_sign: "qi-frank"
            build_stage_after: "INSPECTION"
            rework_round_count_after: 0
            note: "deviation_score 0.00 because 1.60 and 2.20 are the target action figures, relief 0.25 is the target relief and 4.0 is at or under the intonation allowance — a PASS, so the refused self-signature cannot be excused as a merely-cosmetic block on a failing round. The catalog names a third pair behind this same error id — export release versus permit attestation, compared against every contributing lot's attested_by_user_id — which shares this identity-difference shape."

      - name: only_the_luthier_who_opened_the_round_may_measure_it
        claim_type: segregation_of_duties
        grounds: ["state_machines.SetupInspection.transitions", "errors[ERR_MEASUREMENT_OWNER_MISMATCH]", "entities.SetupInspection.performed_by_user_id", "validations.priority_20"]
        distinguishing_aspect: "Ownership of a round is pinned to the user who opened it, so a SECOND luthier — correct role, wrong identity — is refused 403 ERR_MEASUREMENT_OWNER_MISMATCH, which is the mirror image of the sign rule: measure demands identity EQUALITY where sign demands identity DIFFERENCE. The same call made by a machinist carrying lu-eve's id is refused with ERR_ROLE_NOT_PERMITTED instead, proving the role gate at priority 20 runs before the owner comparison."
        test_recipe:
          setup: "An order at INSPECTION with round 1 OPEN, opened by luthier lu-eve."
          setup_api_calls: *order_at_inspection
          trigger: "POST /setup-inspections/${insp1}/measure with action_mm_treble 1.60, action_mm_bass 2.20, relief_mm 0.25 and intonation_cents_max 4.0 as Luthier with X-User-ID lu-zoe, then the same body as Machinist with X-User-ID lu-eve, then the same body as Luthier with X-User-ID lu-eve"
          assert:
            wrong_luthier_http_status: 403
            wrong_luthier_error_id: "ERR_MEASUREMENT_OWNER_MISMATCH"
            status_after_wrong_luthier: "OPEN"
            deviation_score_after_wrong_luthier: null
            wrong_role_right_id_http_status: 403
            wrong_role_right_id_error_id: "ERR_ROLE_NOT_PERMITTED"
            status_after_wrong_role: "OPEN"
            owner_measure_http_status: 200
            status_after_owner_measure: "MEASURED"
            deviation_score_after_owner_measure: 0.00
            performed_by_user_id_throughout: "lu-eve"
            note: "performed_by_user_id is a system field fixed at open, so no request in this instance can move it — the failed measurement must not repoint ownership at lu-zoe."

      - name: the_coordinator_who_configured_an_option_may_not_approve_it_but_may_reject_it
        claim_type: segregation_of_duties
        grounds: ["state_machines.OptionSelection.transitions", "errors[ERR_SEGREGATION_OF_DUTIES]", "entities.OptionSelection.created_by_user_id", "calculations.custom_shop_quote_total"]
        distinguishing_aspect: "The separation is asymmetric by design: approve carries the X-User-ID != created_by_user_id precondition and reject does not, so the very same coordinator who configured a line may withdraw it but may not bless it. A blanket 'creator cannot touch the row' implementation would wrongly refuse the reject, and a blanket 'anyone may act' implementation would wrongly allow the self-approval."
        test_recipe:
          setup: "A standard OM45 order at base 300000 with two PENDING_APPROVAL selections, INL-DOT (16205) and HW-GOLD (29705), both created by coordinator cs-gwen."
          setup_api_calls: *order_two_options
          trigger: "POST /option-selections/${selD}/approve as CustomShopCoordinator with X-User-ID cs-gwen, then POST /option-selections/${selD}/approve as CustomShopCoordinator with X-User-ID cs-hana, then POST /option-selections/${selG}/reject with reason \"customer dropped the gold hardware\" as CustomShopCoordinator with X-User-ID cs-gwen"
          assert:
            self_approve_http_status: 403
            self_approve_error_id: "ERR_SEGREGATION_OF_DUTIES"
            selD_status_after_self_approve: "PENDING_APPROVAL"
            provisional_after_self_approve: 345910
            peer_approve_http_status: 200
            selD_status_after_peer_approve: "SELECTED"
            provisional_after_peer_approve: 345910
            self_reject_http_status: 200
            selG_status_after_self_reject: "REJECTED"
            provisional_after_self_reject: 316205
            selD_created_by_user_id: "cs-gwen"
            selG_created_by_user_id: "cs-gwen"
            note: "The provisional total is unmoved by both the refused approval and the granted one, because PENDING_APPROVAL and SELECTED share the PROVISIONAL input set; only the self-reject moves it, 345910 - 29705 = 316205. That is what makes the two verbs distinguishable by observation rather than by status alone."

  - section: cross_cutting_complexity_layers
    instances:
      - name: a_second_cut_from_one_lot_must_echo_the_version_the_first_cut_produced
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules.billet-cut-stale-tonewood-lot", "errors[ERR_STALE_VERSION]", "calculations.lot_board_feet_ledger", "endpoints.POST_/billets"]
        distinguishing_aspect: "Nothing in the TonewoodLot state machine objects to a second cut — the lot is still RELEASED and still has 69.10 board feet free — so the ONLY thing that refuses the second request is the stale expected_tonewood_lot_version, 412 ERR_STALE_VERSION. The refusal must also be inert: no Billet row, no movement in the four board-foot buckets and no version bump, so the retry succeeds with the very same body once the client re-reads."
        test_recipe:
          setup: "A RELEASED SITKA_SPRUCE lot LOT-001 of 100.00 board feet at 7.0 percent moisture, its post-release version captured as lot_v1."
          setup_api_calls: *lot_released
          trigger: "POST /billets with billet_code BLT-001, lot_id ${lot1}, board_feet 30.00, grade AAA and expected_tonewood_lot_version ${lot_v1} as Machinist, then POST /billets with billet_code BLT-002, lot_id ${lot1}, board_feet 20.00, grade AAA and the SAME expected_tonewood_lot_version ${lot_v1} as Machinist, then GET /tonewood-lots/${lot1} as Machinist to read the current version, then the BLT-002 body again carrying that version"
          assert:
            first_cut_http_status: 201
            first_cut_kerf_loss_board_feet: 0.90
            lot_board_feet_unassigned_after_first_cut: 30.00
            lot_board_feet_available_after_first_cut: 69.10
            lot_version_after_first_cut_differs_from_lot_v1: true
            stale_cut_http_status: 412
            stale_cut_error_id: "ERR_STALE_VERSION"
            billets_total_count_after_stale_cut: 1
            lot_board_feet_available_after_stale_cut: 69.10
            lot_board_feet_kerf_loss_after_stale_cut: 0.90
            lot_status_after_stale_cut: "RELEASED"
            lot_version_after_stale_cut_equals_version_after_first_cut: true
            retry_http_status: 201
            retry_kerf_loss_board_feet: 0.60
            billets_total_count_after_retry: 2
            lot_board_feet_available_after_retry: 48.50
            lot_board_feet_kerf_loss_after_retry: 1.50
            lot_board_feet_unassigned_after_retry: 50.00
            note: "Kerf is 3 percent of the cut, so 30.00 costs 0.90 and 20.00 costs 0.60. board_feet_available — uncut stock only — runs 100.00 -> 69.10 -> 48.50, and invariant I1 closes at every step: 48.50 available + 50.00 unassigned + 0.00 reserved + 0.00 consumed + 0.00 scrapped + 1.50 kerf_loss = 100.00 received. The absolute integer the version field carries depends on how many setup writes touched the row, so the two version claims are stated as comparisons against the captured value rather than as an integer literal."

      - name: stacking_an_option_onto_a_quote_the_client_never_saw_is_refused
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules.option-selection-create-stale-build-order", "errors[ERR_STALE_VERSION]", "calculations.custom_shop_quote_total", "endpoints.POST_/build-orders/{build_order_id}/option-selections"]
        distinguishing_aspect: "Two selections already exist on this order, so multiplicity is plainly legal and no state precondition can be the reason for the refusal; the third create is rejected 412 ERR_STALE_VERSION solely because it echoes bo_v1, the version the order carried before EITHER selection was added. The provisional total is the observable that proves the refusal changed nothing: it must still read 345910 after the 412 and only reach 389115 once the retry carries the current version."
        test_recipe:
          setup: "A standard OM45 order at base 300000 with INL-DOT and HW-GOLD both PENDING_APPROVAL, plus the pre-selection version captured as bo_v1."
          setup_api_calls: *order_two_options
          trigger: "POST /option-catalog with option_code EL-PICKUP, option_group ELECTRONICS, upcharge_cents 32004, complexity_class ARTISAN and lead_time_days 21 as PlantAdmin, then POST /build-orders/${bo1}/option-selections with that option, quantity 1 and expected_build_order_version ${bo_v1} as CustomShopCoordinator with X-User-ID cs-gwen, then GET /build-orders/${bo1} as CustomShopCoordinator to read the current version, then the same selection body carrying that version"
          assert:
            catalog_create_http_status: 201
            stale_selection_http_status: 412
            stale_selection_error_id: "ERR_STALE_VERSION"
            option_selections_total_count_after_stale: 2
            provisional_quote_total_cents_after_stale: 345910
            retry_http_status: 201
            retry_line_total_cents: 43205
            retry_status: "PENDING_APPROVAL"
            option_selections_total_count_after_retry: 3
            provisional_quote_total_cents_after_retry: 389115
            binding_quote_total_cents_after_retry: null
            commercial_status_after_retry: "QUOTED"
            note: "The three ARTISAN lines round independently: 12004 -> 16205, 22004 -> 29705, 32004 -> 43205, subtotal 89115, total 300000 + 89115 = 389115 with no surcharge (not custom shop) and no discount (tier NONE). Summing the raw upcharges first would give 389116, so the retry's total also re-pins the round-then-sum reading."

      - name: the_replacement_finish_run_in_the_refinish_loop_must_prove_a_fresh_version
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules.finish-run-create-stale-build-order", "errors[ERR_STALE_VERSION]", "state_machines.FinishRun.transitions", "state_machines.BuildOrder.build_stage.transitions", "calculations.finish_cure_ready_at"]
        distinguishing_aspect: "This is the OCC rule whose write endpoint is legitimately called twice on the same parent: the cyclic build_stage IN_FINISH -> IN_ASSEMBLY -> IN_FINISH means a second POST /finish-runs is a correct product operation, so a 409 state error would be wrong and only the stale-version check may refuse it. The order's version has moved twice since bo_v3 was captured — once when the first run pushed it into IN_FINISH and once when the rejection pulled it back — which is exactly the obsolete view of finish_system and stage the rule exists to block."
        test_recipe:
          setup: "An order at build_stage IN_ASSEMBLY with one ACCEPTED component, an IN_SPEC finish booth FB-1 at 50.0 rh and 21.0 C, and the post-start-assembly version captured as bo_v3; the clock stands at 2026-08-01T00:00:00Z."
          setup_api_calls: *order_in_assembly
          trigger: "POST /finish-runs with build_order_id ${bo1}, booth_id ${fb1}, finish_system NITRO, coat_count 8 and expected_build_order_version ${bo_v3} as FinishTech, then POST /finish-runs/{that run}/complete-spray as FinishTech, then POST /finish-runs/{that run}/reject with reason \"orange peel across the lower bout\" as QualityInspector, then POST /finish-runs with the same body and the SAME ${bo_v3} as FinishTech, then GET /build-orders/${bo1} as FinishTech to read the current version, then that same body carrying the fresh version"
          assert:
            first_run_http_status: 201
            first_run_status: "SPRAYING"
            build_stage_after_first_run: "IN_FINISH"
            booth_occupied_slots_after_first_run: 1
            complete_spray_http_status: 200
            first_run_status_after_spray: "CURING"
            first_run_cure_hours: 348
            first_run_cure_ready_at: "2026-08-15T12:00:00Z"
            reject_http_status: 200
            first_run_status_after_reject: "REJECTED"
            build_stage_after_reject: "IN_ASSEMBLY"
            refinish_count_after_reject: 1
            booth_occupied_slots_after_reject: 0
            stale_second_run_http_status: 412
            stale_second_run_error_id: "ERR_STALE_VERSION"
            finish_runs_total_count_after_stale: 1
            build_stage_after_stale: "IN_ASSEMBLY"
            booth_occupied_slots_after_stale: 0
            retry_http_status: 201
            retry_status: "SPRAYING"
            finish_runs_total_count_after_retry: 2
            build_stage_after_retry: "IN_FINISH"
            booth_occupied_slots_after_retry: 1
            note: "Cure: NITRO at 8 coats over a booth sampled at 50.0 rh and 21.0 C gives coat_hours 336, one 5-point humidity step above the 45 baseline adds 12 and the temperature relief is 0, so cure_hours is max(240, 348) = 348 and spray at 2026-08-01T00:00:00Z rounds the cure out to 2026-08-15T12:00:00Z. The figure is asserted only to show the first run really was a live cure, not a stub, before it was condemned."

      - name: the_selector_breaks_a_score_tie_by_the_earliest_window_not_by_the_older_order
        claim_type: selector_policy
        grounds: ["calculations.build_priority_score.selector_policy", "endpoints.GET_/stations/{station_id}/next-build-order", "state_machines.StationReservation.transitions"]
        distinguishing_aspect: "BO-2 and BO-3 are deliberately identical in every scoring input, so both stand at 35.50 and the ranking expression cannot separate them; the winner must be BO-3 because its HELD window opens on 2026-08-02 while BO-2's opens on 2026-08-04. BO-3 was created LAST, so an implementation that fell straight through to the created_at fallback — or to the forbidden id ordering — would answer BO-2 and be caught."
        test_recipe:
          setup: "CNC-1 in build room BR-1 with two CONFIRMED orders holding windows on it: BO-1 (SIGNATURE, custom shop, promised 2026-10-01) on 2026-08-03 and BO-2 (NONE, standard, promised 2026-08-20) on 2026-08-04; the clock stands at 2026-08-01T00:00:00Z."
          setup_api_calls: *two_confirmed_orders_on_cnc1
          trigger: "POST /build-orders with order_code BO-3, model_code D28, base_price_cents 300000, promised_date 2026-08-20T00:00:00Z, is_custom_shop false, artist_tier NONE and finish_system NITRO as CustomShopCoordinator, then POST /build-orders/{BO-3}/confirm with deposit_cents 30000, then POST /station-reservations with station_id ${cnc1}, build_order_id {BO-3}, starts_at 2026-08-02T08:00:00Z and ends_at 2026-08-02T09:00:00Z as Machinist, then GET /stations/${cnc1}/next-build-order as Machinist, then POST /station-reservations/${resA}/release as Machinist, then GET /stations/${cnc1}/next-build-order as Machinist, then POST /station-reservations/{BO-3's reservation}/release as Machinist, then GET /stations/${cnc1}/next-build-order as Machinist"
          assert:
            bo3_priority_score: 35.50
            bo2_priority_score: 35.50
            bo1_priority_score: 69.50
            first_read_order_code: "BO-1"
            first_read_priority_score: 69.50
            first_read_starts_at: "2026-08-03T08:00:00Z"
            first_read_eligible_count: 3
            second_read_order_code: "BO-3"
            second_read_priority_score: 35.50
            second_read_starts_at: "2026-08-02T08:00:00Z"
            second_read_eligible_count: 2
            third_read_order_code: "BO-2"
            third_read_priority_score: 35.50
            third_read_starts_at: "2026-08-04T08:00:00Z"
            third_read_eligible_count: 1
            note: "Scores at the 2026-08-01 clock: BO-1 = 40 (SIGNATURE) + 15 (custom shop) + max(0, 90 - 61) * 0.5 = 69.50; BO-2 and BO-3 = 0 + 0 + max(0, 90 - 19) * 0.5 = 35.50. The three windows sit on different days so the changeover-widened overlap rule never fires, and every release shrinks the eligible pool by exactly one because eligibility counts HELD reservations only."

      - name: the_four_level_climate_chain_is_covered_by_the_cascade_instance
        claim_type: cascading_side_effects
        grounds: ["state_machines.StorageRoom.transitions", "state_machines.FinishRun.transitions", "state_machines.BuildOrder.build_stage.transitions"]
        excluded_because:
          difficulty_instance: climate_excursion_cascades_four_levels_deep
          rationale: "That §1.8 instance walks the reading -> room -> finish run -> build order chain end to end and then reverses it, which is the whole of what a layer-level cascade probe would assert."

      - name: the_two_quote_variants_are_covered_by_the_three_axis_divergence_instance
        claim_type: dual_variant_calculation
        grounds: ["calculations.custom_shop_quote_total.variants"]
        excluded_because:
          difficulty_instance: quote_provisional_vs_binding_diverge_on_three_axes
          rationale: "Both variants, their input sets and the delta at lock-options are asserted there on one order; the corner file adds only the nested-rounding and selection-context probes it does not cover."

      - name: the_lot_board_foot_ledger_reconciliation_is_covered_by_the_i1_invariant
        claim_type: derived_field_reconciliation
        grounds: ["calculations.lot_board_feet_ledger"]
        excluded_because:
          difficulty_instance: i1_board_feet_conserved_when_cancel_recovers_reserved_wood
          rationale: "The create / update / release-of-source arc on the derived board-foot buckets is exactly what that conservation instance asserts, including the recovery leg a plain reconciliation probe would omit."

  - section: consistency_model
    instances:
      - name: a_cut_reports_its_ledger_movement_inside_its_own_response
        claim_type: immediate
        grounds: ["complexity_profile.consistency_model", "calculations.lot_board_feet_ledger", "endpoints.POST_/billets", "endpoints.GET_/tonewood-lots/{lot_id}"]
        distinguishing_aspect: "The declared model is immediate, so the parent's derived buckets must already be correct in the child-create response's own transaction — the follow-up GET is required to return byte-identical figures rather than catching up afterwards. An implementation that recomputed the ledger lazily on read would pass the GET and fail the create."
        test_recipe:
          setup: "A RELEASED SITKA_SPRUCE lot LOT-001 of 100.00 board feet at 7.0 percent moisture, its post-release version captured as lot_v1."
          setup_api_calls: *lot_released
          trigger: "POST /billets with billet_code BLT-001, lot_id ${lot1}, board_feet 30.00, grade AAA and expected_tonewood_lot_version ${lot_v1} as Machinist, then GET /tonewood-lots/${lot1} as Machinist, then GET /billets?lot_id=${lot1} as Machinist"
          assert:
            create_http_status: 201
            create_response_kerf_loss_board_feet: 0.90
            create_response_status: "AVAILABLE"
            get_lot_board_feet_unassigned: 30.00
            get_lot_board_feet_reserved: 0.00
            get_lot_board_feet_consumed: 0.00
            get_lot_board_feet_scrapped: 0.00
            get_lot_board_feet_kerf_loss: 0.90
            get_lot_board_feet_available: 69.10
            get_lot_status: "RELEASED"
            reverse_list_total_count: 1
            reverse_list_has_more: false
            reverse_list_first_billet_code: "BLT-001"
            note: "Immediate consistency is claimed against the same figures twice: the 201 body carries the billet's own kerf and the GET carries the parent's six buckets, and 69.10 available + 30.00 unassigned + 0.90 kerf_loss = 100.00 received closes invariant I1 on the strength of a single write. The reverse FK list is the third read of the same write and must already see the row."
