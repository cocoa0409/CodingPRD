            - "the new offer has valid_from == \"2026-08-10T09:40:00Z\" and valid_until == \"2026-08-10T10:40:00Z\""
            - "Booking.${b_id} now owns exactly 2 AncillaryOffer rows: the DECLINED one and the new PRESENTED one"

  - rule_id: cross_entity_state_dependency
    instances:
      - name: ticket_requires_fare_family_published_not_suspended
        grounds:
          - validations.priority_23
          - state_machines.FareFamily.status.PUBLISHED_to_SUSPENDED
          - state_machines.Booking.booking_status.HELD_to_TICKETED
          - errors.ERR_FAMILY_NOT_PUBLISHED
        dependency: |
          Booking HELD -> TICKETED is guarded by the state of a DIFFERENT entity, the
          FareFamily. The booking itself is flawless - disclosure ACKNOWLEDGED, fingerprint
          matching, flight PRESALE / NORMAL, channel COMPLIANT - yet the catalog owner
          suspending the family must block the sale. The channel used here has
          parity_required false, so its content_parity_status stays COMPLIANT and priority 30
          is NOT violated: the refusal can only come from the family's own status.
        test_recipe:
          setup:
            - "clock at 2026-08-10T09:00:00Z; ECO_LITE (BAG_CHECKED_1 INCLUDED q1) is PUBLISHED"
            - "META_NOPARITY (channel_type NDC, parity_required FALSE, supported [BAGGAGE, SEAT]) holds an IN_PARITY publication of ECO_LITE"
            - "one HELD booking on that channel has an ACKNOWLEDGED disclosure whose fingerprint still matches the live family"
            - "the PricingApprover then suspends the family"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T09:00:00Z" }
              as: PricingApprover
              as_user_id: "pa-001"
