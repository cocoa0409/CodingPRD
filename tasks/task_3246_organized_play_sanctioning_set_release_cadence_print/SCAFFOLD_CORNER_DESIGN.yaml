              as: StoreOrganizer
              as_user_id: "${store_id}"
              captures: { app_id: $.data.id }
            - call: "POST /op/judges"
              payload: { judge_ref: "JUDGE-GAMMA", name: "G. Referee", level: "LEVEL_3" }
              as: OpsAdmin
              captures: { jref: $.data.judge_ref }
            - call: "POST /op/enforcement-cases"
              payload: { event_application_id: "${app_id}", player_ref: "PLAYER-REPEAT", judge_ref: "JUDGE-GAMMA", offense_class: "MAJOR", rules_enforcement_level: "COMPETITIVE", repeated_offense: true }
              as: Judge
              captures: { case_rep: $.data.id }
            - call: "POST /op/enforcement-cases"
