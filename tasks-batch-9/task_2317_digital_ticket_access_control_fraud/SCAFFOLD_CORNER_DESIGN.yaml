              payload: { presented_barcode: "${bc_ok}", device_fingerprint: "DEV-ADA", direction: "IN", dedupe_key: "K3" }
              as: GateOperator
              as_user_id: "gate-op-1"
              captures: { r_ok: $.data.result }
          assert:
            - "${err_fake} == ERR_COUNTERFEIT_BARCODE with HTTP 422 — priority 20 decides before the device check at 22 ever runs"
            - "${strikes1} == 0 and ${score1} == 0 — an unresolvable seed identifies no holder, so no strike is bookable"
            - "${err_epoch} == ERR_BARCODE_EPOCH_INVALID with HTTP 422 — epoch 99 is above now_epoch 20, and priority 21 still outranks the device check"
            - "${strikes2} == 1 and ${score2} == 50 — DENIED_STALE_BARCODE maps to a COUNTERFEIT incident, weight 50, and device_rebind_count 1 contributes 0 churn points"
            - "GET /scan-events?scan_session_id=${s1_id} has total_count == 3, with results DENIED_COUNTERFEIT, DENIED_STALE_BARCODE and ADMITTED"
            - "GET /denied-entry-incidents?category=COUNTERFEIT has total_count == 2, the first with ticket_id null and the second with ticket_id ${t_id}"
            - "${r_ok} == ADMITTED and Ticket.${t_id}.admission_status == INSIDE"

      - name: priority_conflict_between_void_and_zone_capacity
        claim_type: priority_ordering
        grounds:
          - validations[priority=10]
          - validations[priority=26]
        excluded_because:
          difficulty_instance: voided_ticket_outranks_zone_capacity_full
          rationale: |
            That instance already stages both violations on one request and additionally
            fires the loser rule on its own, which is the full priority-ordering claim for
            this pair.

      - name: priority_conflict_between_fraud_block_and_price_cap
        claim_type: priority_ordering
        grounds:
          - validations[priority=28]
          - validations[priority=35]
        excluded_because:
          difficulty_instance: fraud_block_outranks_price_cap_exceeded
          rationale: |
            Both rules are violated by a single listing attempt there, the expected winner is
            asserted, and a control call proves the losing rule is implemented at all.

      - name: priority_conflict_between_transfer_limit_and_recipient_verification
        claim_type: priority_ordering
        grounds:
          - validations[priority=30]
          - validations[priority=32]
        excluded_because:
          difficulty_instance: transfer_limit_outranks_recipient_not_verified
          rationale: |
            The pair is exercised there on a ticket that has exhausted its transfer budget
            and an unverified recipient in the same request, with the loser rule fired
            separately afterwards.

      - name: aggregate_credential_window_capacity
        claim_type: aggregate_validation
        grounds:
          - validations[priority=31]
          - calculations.credential_window_overlap_capacity
        excluded_because:
          difficulty_instance: credential_window_capacity_aggregates_only_overlapping_approved_requests
          rationale: |
            Individually valid requests that collectively exceed AccessZone.credential_capacity
            are precisely what that instance stages, including the touching-window case that
            must NOT aggregate.

      - name: transfer_window_temporal_validation
        claim_type: temporal_validation
        grounds:
          - validations[priority=14]
          - errors.ERR_EVENT_STATE_FORBIDS_TRANSFER
        excluded_because:
          difficulty_instance: transfer_blocked_by_event_transfer_window_closing_instant
          rationale: |
            The strict-before comparison against Event.transfer_window_closes_at is tested
            there at the closing instant itself and one second earlier, which is this row's
            temporal claim.

      - name: purchase_depends_on_buyer_verification_state
        claim_type: cross_entity_validation
        grounds:
          - validations[priority=32]
          - errors.ERR_RECIPIENT_NOT_VERIFIED
        excluded_because:
          difficulty_instance: resale_purchase_refused_until_the_buyer_patron_is_identity_verified
          rationale: |
            Both sides of the cross-entity dependency are covered there: refused while the
            buyer is unverified, accepted on the identical request once the Patron record
            flips.

      - name: credential_submission_conditional_on_zone_posture
        claim_type: conditional_validation
        grounds:
          - validations[priority=16]
          - errors.ERR_ZONE_FROZEN
          - calculations.zone_posture
        excluded_because:
          difficulty_instance: credential_submit_refused_while_the_access_zone_posture_is_frozen
          rationale: |
            The rule only bites when the zone's computed posture is FROZEN, and that instance
            drives the zone into and out of that configuration, testing the submission both
            ways.
  # ===========================================================================
  # Table 5 — Endpoints
  # 59 endpoints. Covered here: the one bulk endpoint, the binding action pair,
  # the two computed/derived reads and the gate cross-reference link. Endpoints
  # whose side effects are already walked by §1.8 are recorded as exclusions.
  # ===========================================================================
  - section: endpoints
    instances:
      - name: offline_batch_is_best_effort_per_item_and_then_locks_the_session
        claim_type: bulk_action
        grounds:
          - endpoints[POST /scan-sessions/{id}/offline-batch]
          - endpoints[POST /scan-sessions/{id}/offline-batch].side_effects
          - validations[priority=15]
          - errors.ERR_SESSION_NOT_OPEN
          - calculations.live_occupancy
        distinguishing_aspect: |
          One upload of three items must partially succeed: two admits and one duplicate,
          with accepted_count 2, duplicate_suppressed_count 1 and denied_count 1 (the
          duplicate is counted in both denied_count and duplicate_suppressed_count, so
          accepted + denied == 3), and one persisted ScanEvent per item. Each item's epoch is
          judged against its own scanned_at, not the logical clock, so an epoch-18 cache is
          accepted at clock epoch 20. The batch leaves the session SYNCING, which makes the
          next ONLINE scan ERR_SESSION_NOT_OPEN while the gate is still SCANNING, and it
          moves no GATE_LIVE counter at all.
        test_recipe:
          setup:
            - "Event DOORS_OPEN; AccessZone GA1; Gate G1; Ada and Bob verified with bound PAID tickets; clock at 2026-09-12T18:10:00Z; an OFFLINE_CAPABLE session S1 open on G1."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: VenueAdmin
              as_user_id: "admin-1"
            - call: "POST /events"
              payload:
                name: "Aurora Night"
                venue_name: "Northgate Arena"
                fire_code_capacity: 200
                barcode_anchor_at: "2026-09-12T18:00:00Z"
                doors_open_at: "2026-09-12T18:00:00Z"
                event_start_at: "2026-09-12T19:00:00Z"
                transfer_window_closes_at: "2026-09-12T17:00:00Z"
              as: VenueAdmin
              as_user_id: "admin-1"
              captures: { ev_id: $.data.id }
            - call: "POST /events/${ev_id}/access-zones"
              payload: { zone_code: "GA1", required_entitlement_level: "GA", fire_code_capacity: 150, face_value_reference_cents: 8750 }
              as: VenueAdmin
              as_user_id: "admin-1"
              captures: { z_id: $.data.id }
            - call: "POST /events/${ev_id}/gates"
              payload: { gate_code: "G1", access_zone_id: "${z_id}", throughput_per_minute: 20, lanes_open: 2 }
              as: VenueAdmin
              as_user_id: "admin-1"
              captures: { g1_id: $.data.id, g1_v: $.data.version }
            - call: "POST /events/${ev_id}/advance-status"
              payload: { target_status: "ON_SALE" }
              as: VenueAdmin
              as_user_id: "admin-1"
            - call: "POST /patrons"
              payload: { email: "ada@example.com", display_name: "Ada Lovelace" }
              as: BoxOfficeAgent
              as_user_id: "boa-1"
              captures: { p_ada_id: $.data.id }
            - call: "POST /patrons/${p_ada_id}/verify-identity"
              payload: { document_reference: "DL-ADA-1" }
              as: BoxOfficeAgent
              as_user_id: "boa-1"
            - call: "POST /patrons"
              payload: { email: "bob@example.com", display_name: "Bob Bell" }
              as: BoxOfficeAgent
              as_user_id: "boa-1"
              captures: { p_bob_id: $.data.id }
