              as: ParkingAdmin
              captures: { lot_d: $.data.id }
            - call: "POST /parking/allocations"
              payload: { lot_id: "${lot_d}", permit_code: "GEN", eligible_roles: ["STUDENT"], residency_rule: "ANY", base_fee_cents: 80000, proration_policy: "PRORATED_WEEKLY", term_start: "2026-08-03", term_end: "2026-11-22", quota: 1 }
              as: ParkingAdmin
              captures: { alloc_d: $.data.id }
            - call: "GET /parking/allocations/${alloc_d}"
              as: ParkingAdmin
              captures: { v_d: $.data.version }
            - call: "POST /parking/permits"
              payload: { patron_id: "${occ_id}", allocation_id: "${alloc_d}", plate_number: "O111", expected_allocation_version: "${v_d}" }
              as: ParkingAdmin
            - call: "POST /parking/waitlist-entries"
              payload: { patron_id: "${d_id}", allocation_id: "${alloc_d}" }
              as: Commuter
              as_user_id: "${d_id}"
          trigger:
            - call: "POST /parking/waitlist-entries"
              payload: { patron_id: "${d_id}", allocation_id: "${alloc_d}" }
              as: Commuter
              as_user_id: "${d_id}"
              captures: { err: $.data.error_id }
          assert:
            - "captured err == ERR_ALREADY_WAITLISTED (HTTP 409)"

      - name: second_appeal_rejected_after_upheld
        claim_type: violation_to_error
        grounds: ["validations[priority=11]", "errors[ERR_APPEAL_ALREADY_EXISTS]", "state_machines.Citation.UNDER_APPEAL_to_ISSUED"]
        distinguishing_aspect: "After an UPHELD decision the citation is ISSUED again (state check passes) but appeal_outcome != NONE fires ERR_APPEAL_ALREADY_EXISTS — the once-per-citation constraint outranks nothing yet still blocks."
        test_recipe:
          setup: ["patron with permit plate A222; citation issued, appealed, decided UPHELD"]
          setup_api_calls:
            - call: "POST /parking/patrons"
              payload: { full_name: "A", campus_role: "STAFF", residency: "OFF_CAMPUS", primary_commute_mode: "DRIVE_ALONE" }
              as: ParkingAdmin
              captures: { a_id: $.data.id }
            - call: "POST /parking/lots"
              payload: { lot_code: "LA", name: "Lot A", zone: "CORE", capacity_total: 50 }
              as: ParkingAdmin
              captures: { lot_a: $.data.id }
            - call: "POST /parking/lots"
              payload: { lot_code: "LB", name: "Lot B", zone: "REMOTE", capacity_total: 50 }
              as: ParkingAdmin
              captures: { lot_b: $.data.id }
            - call: "POST /parking/allocations"
              payload: { lot_id: "${lot_a}", permit_code: "GEN", eligible_roles: ["STAFF"], residency_rule: "ANY", base_fee_cents: 80000, proration_policy: "PRORATED_WEEKLY", term_start: "2026-08-03", term_end: "2026-11-22", quota: 5 }
              as: ParkingAdmin
              captures: { alloc_a: $.data.id }
            - call: "GET /parking/allocations/${alloc_a}"
              as: ParkingAdmin
              captures: { v_a: $.data.version }
            - call: "POST /parking/permits"
              payload: { patron_id: "${a_id}", allocation_id: "${alloc_a}", plate_number: "A222", expected_allocation_version: "${v_a}" }
              as: ParkingAdmin
            - call: "POST /parking/citations"
              payload: { lot_id: "${lot_b}", plate_number: "A222", violation_type: "WRONG_ZONE" }
              as: EnforcementOfficer
              as_user_id: "off-1"
              captures: { cit_id: $.data.id }
            - call: "POST /parking/citations/${cit_id}/appeal"
