              captures: { std1_id: $.data.id }
            - call: "POST /playground/standards/${std1_id}/activate"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "officer-1"
            - call: "POST /playground/standards"
              payload: { code: "ASTM_F1487", edition_year: 2027, effective_from: "2026-01-01", min_use_zone_clearance_cm: 213, max_fall_height_cm_toddler: 122, max_fall_height_cm_preschool: 152, max_fall_height_cm_school_age: 244, requires_accessible_route: true }
