              payload: { customer_id: "${cust_id}", jobsite_address: "12 Foundry Way", damage_waiver_elected: false }
              as: RentalCoordinator
              captures: { contract_id: $.data.id, cv: $.data.version }
            - call: "POST /rental-lines"
              payload: { contract_id: "${contract_id}", unit_id: "${unit_id}", requested_start_date: "2026-09-01", requested_end_date: "2026-09-10", required_working_height_ft: 20, expected_contract_version: "${cv}" }
