  # ---------------------------------------------------------------- Rule 7
  - rule_id: cross_entity_state_dependency
    instances:
      - name: finalize_scoring_requires_cycle_scoring_state
        grounds:
          - state_machines.GiftedCase
          - state_machines.ScreeningCycle
          - validations[priority=7]
        distinguishing_aspect: |
          Entity pair GiftedCase x ScreeningCycle: finalize-scoring on a perfectly valid
          SCREENING case is rejected with ERR_INVALID_CYCLE_STATE because the parent cycle is
          still OPEN (not SCORING). The case's own state is correct; the sibling aggregate's
          state gates the transition.
        test_recipe:
          setup:
            - "clock 2026-08-20; site; grade-3 student; cycle P_BAND published, advanced to OPEN only"
            - "case with all three required measures entered (allowed while OPEN)"
          setup_api_calls:
            - { call: "POST /gifted/_clock/set_current_utc", payload: { to_iso8601: "2026-08-20T00:00:00Z" }, as: GiftedCoordinator }
