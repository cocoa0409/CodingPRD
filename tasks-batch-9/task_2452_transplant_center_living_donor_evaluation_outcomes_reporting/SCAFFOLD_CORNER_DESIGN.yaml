  - name: actual_cit_over_the_cap_flags_breach_but_one_breach_keeps_posture_open
    claim_type: threshold
    grounds:
    - calculations.cold_ischemia_time
    - calculations.cold_ischemia_time.constants.MAX_CIT_MINUTES
    - calculations.compliance_posture
    - calculations.compliance_posture.constants.CIT_BREACH_RESTRICT_COUNT
    - entities.TransplantProgram.fields.cit_breach_count
    distinguishing_aspect: The realized interval adds NO cross-match hold, so 1085 whole minutes is the
      stored actual_cit_minutes; it breaches MAX_CIT_MINUTES 1080 yet a single breach leaves compliance_posture
      OPEN because CIT_BREACH_RESTRICT_COUNT is 2.
