  - rule_id: transitive_cascade
    instances:
      - name: request_changes_unwinds_version_siblings_reviewer_counter_and_addenda
        depth: 4
        grounds:
          - state_machines.LegalReview.cascade_A_request_changes_unwind
          - state_machines.PolicyVersion
          - state_machines.JurisdictionAddendum
          - entities.LegalReviewer.fields.open_review_count
          - endpoints[POST /legal-reviews/{legal_review_id}/decision]
        distinguishing_aspect: |
          Downward unwind fanning across three different entity types from one review verdict:
          hop 1 PolicyVersion IN_LEGAL_REVIEW -> DRAFT, hop 2 the untouched sibling NY review
          REQUESTED -> WITHDRAWN, hop 3 that sibling reviewer's open_review_count decrement,
          hop 4 every APPROVED addendum on the version reset to DRAFT. Hops 2-4 are reachable
          only through hop 1, and hop 4 is what forces the whole legal package to be re-earned.
        test_recipe:
          setup:
            - "Jurisdictions CA (min_legal_review_days 10) and NY (min_legal_review_days 20), each with one active reviewer at concurrent_review_limit 3."
            - "PolicyVersion v1 on a CODE_OF_CONDUCT document with required_jurisdiction_ids [CA, NY]."
            - "One addendum per required jurisdiction, both APPROVED by the reviewer of the matching jurisdiction; one LegalReview per required jurisdiction, both REQUESTED."
            - "Version submitted for review (IN_LEGAL_REVIEW); the CA review is started, the NY review is left untouched at REQUESTED so each reviewer's open_review_count is 1."
          setup_api_calls:
            - { call: "POST /jurisdictions", payload: { state_code: "CA", display_name: "California", min_legal_review_days: 10, ack_deadline_days: 30, retention_years: 5, required_language_codes: ["en"], esign_permitted: true, proxy_ack_permitted: false, ack_window_buffer_days: 3 }, as: HRComplianceAdmin, captures: { j_ca: "$.data.id" } }
            - { call: "POST /jurisdictions", payload: { state_code: "NY", display_name: "New York", min_legal_review_days: 20, ack_deadline_days: 14, retention_years: 7, required_language_codes: ["en"], esign_permitted: true, proxy_ack_permitted: false, ack_window_buffer_days: 0 }, as: HRComplianceAdmin, captures: { j_ny: "$.data.id" } }
            - { call: "POST /legal-reviewers", payload: { jurisdiction_id: "${j_ca}", full_name: "Ada Counsel", bar_number: "CA-1", concurrent_review_limit: 3, is_active: true }, as: HRComplianceAdmin, captures: { r_ca: "$.data.id" } }
            - { call: "POST /legal-reviewers", payload: { jurisdiction_id: "${j_ny}", full_name: "Ben Counsel", bar_number: "NY-1", concurrent_review_limit: 3, is_active: true }, as: HRComplianceAdmin, captures: { r_ny: "$.data.id" } }
            - { call: "POST /policy-documents", payload: { title: "Code of Conduct 2026", category: "CODE_OF_CONDUCT", max_ack_deadline_days: 5 }, as: PolicyAuthor, captures: { d1: "$.data.id", d1v: "$.data.version" } }
            - { call: "POST /policy-documents/${d1}/versions", payload: { body_text: "S1 S2 S3 S4", section_count: 4, required_jurisdiction_ids: ["${j_ca}", "${j_ny}"], expected_policy_document_version: "${d1v}" }, as: PolicyAuthor, captures: { v1: "$.data.id" } }
            - { call: "POST /policy-versions/${v1}/addenda", payload: { jurisdiction_id: "${j_ca}", body_text: "CA addendum" }, as: PolicyAuthor, captures: { a_ca: "$.data.id" } }
            - { call: "POST /policy-versions/${v1}/addenda", payload: { jurisdiction_id: "${j_ny}", body_text: "NY addendum" }, as: PolicyAuthor, captures: { a_ny: "$.data.id" } }
            - { call: "POST /addenda/${a_ca}/approve", payload: {}, as: LegalCounsel, as_user_id: "${r_ca}" }
            - { call: "POST /addenda/${a_ny}/approve", payload: {}, as: LegalCounsel, as_user_id: "${r_ny}" }
            - { call: "POST /policy-versions/${v1}/legal-reviews", payload: { jurisdiction_id: "${j_ca}", reviewer_id: "${r_ca}", due_at: "2026-08-20T00:00:00Z" }, as: PolicyAuthor, captures: { lr_ca: "$.data.id" } }
            - { call: "POST /policy-versions/${v1}/legal-reviews", payload: { jurisdiction_id: "${j_ny}", reviewer_id: "${r_ny}", due_at: "2026-08-22T00:00:00Z" }, as: PolicyAuthor, captures: { lr_ny: "$.data.id" } }
            - { call: "POST /policy-versions/${v1}/submit-for-review", payload: {}, as: PolicyAuthor }
            - { call: "POST /legal-reviews/${lr_ca}/start", payload: {}, as: LegalCounsel, as_user_id: "${r_ca}" }
          trigger:
            - { call: "POST /legal-reviews/${lr_ca}/decision", payload: { verdict: "REQUEST_CHANGES", comment: "Section 3 conflicts with CA notice rules." }, as: LegalCounsel, as_user_id: "${r_ca}" }
          assert:
            - "LegalReview.${lr_ca}.status == CHANGES_REQUESTED"
            - "PolicyVersion.${v1}.status == DRAFT"
            - "PolicyVersion.${v1}.revision_round == 1"
            - "LegalReview.${lr_ny}.status == WITHDRAWN"
            - "LegalReviewer.${r_ny}.open_review_count == 0"
            - "LegalReviewer.${r_ca}.open_review_count == 0"
            - "JurisdictionAddendum.${a_ca}.status == DRAFT"
            - "JurisdictionAddendum.${a_ca}.approved_by_reviewer_id == null"
            - "JurisdictionAddendum.${a_ny}.status == DRAFT"
            - "JurisdictionAddendum.${a_ny}.approved_by_reviewer_id == null"
      - name: successor_release_supersedes_voids_and_moots_the_prior_generation
        depth: 4
        grounds:
          - state_machines.ReleasePackage.cascade_B_publish_supersede
          - state_machines.PolicyVersion
          - state_machines.DistributionAssignment
          - state_machines.EscalationCase
          - entities.Employee.fields.open_ack_count
          - entities.Employee.fields.open_escalation_count
          - endpoints[POST /release-packages/{release_package_id}/release]
        distinguishing_aspect: |
          A forward generational cascade (not a review unwind) fired by releasing a successor
          package: hop 1 the prior PublishedVersion is SUPERSEDED and stamped with the successor's
          effective_date as its window_end_date, hop 2 its still-open assignments become VOIDED,
          hop 3 the assignees' open_ack_count is decremented, hop 4 the escalation cases riding
          those assignments close CLOSED_MOOT and flip escalation_state to MOOT. Hop 4 is two
          entities away from the endpoint's subject and is reachable only through hops 1-2.
