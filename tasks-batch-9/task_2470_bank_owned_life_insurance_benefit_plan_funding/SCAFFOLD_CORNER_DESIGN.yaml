      - name: carrier_liaison_cannot_read_another_carriers_records
        claim_type: peer_roles
        grounds:
          - roles.CarrierLiaison.identity
          - validations[priority=3]
          - errors[ERR_CARRIER_SCOPE_VIOLATION]
        distinguishing_aspect: "The CarrierLiaison identity is entity-backed, so its X-User-ID must equal the carrier_id of every addressed resource: reading its own carrier and its own product succeeds while the identical reads against the peer carrier return ERR_CARRIER_SCOPE_VIOLATION (403), which is a scope failure at priority 3 rather than a 404."
        test_recipe:
          setup:
            - "Two carriers, Gable and Harrow, each with one GENERAL product; the acting X-User-ID is the Gable carrier id."
          setup_api_calls:
