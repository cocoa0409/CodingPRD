        grounds: [entities.Facility.fields.acceptance_posture, "errors[ERR_FACILITY_CLOSED]"]
        distinguishing_aspect: "Immediate consistency: right after a 500-ppm gas reading closes the facility, a scale-reservation attempt sees the CLOSED posture in the same session and is rejected ERR_FACILITY_CLOSED."
        test_recipe:
