      - name: peer_confinement_refuses_a_second_investor_on_a_delivery_and_a_second_sponsor_on_a_foreign_project
        claim_type: peer_role_isolation
        grounds:
          - errors[ERR_NOT_RESOURCE_OWNER]
          - roles.Investor.exclusive_operations
          - roles.Developer.exclusive_operations
          - endpoints[POST /investor-deliveries/{id}/accept].roles
          - endpoints[POST /investor-deliveries/{id}/rescind].roles
          - endpoints[POST /unit-restrictions].roles
          - entities.InvestorDelivery.fields.investor_id
          - entities.Project.fields.developer_id
        distinguishing_aspect: |
          Both entity-backed roles are peers of themselves: the second investor and
          the second sponsor hold exactly the right role for the endpoint they call,
          so the only thing standing between them and someone else's money is the
          ownership comparison. The rescind probe is the sharpest cell, because the
          delivery's owning sponsor is reached transitively - delivery to credit
          allocation to project to developer_id - rather than by a column on the
          delivery row itself, so an implementation that only checks the direct
          investor_id lets a foreign sponsor claw back a strip. The rightful investor
          then accepts, proving the ownership rule and not the delivery state was
          the obstacle.
