              as: TaxPreparer
              captures: { run: "$.data.id" }
            - call: "POST /funds/tax-years/${ty}/close-books"
              payload: {}
              as: FundTaxAdmin
          trigger:
            - call: "POST /funds/allocation-runs/${run}/lock"
              payload: {}
              as: TaxReviewer
              captures: { e: "$.data.error_id" }
          assert:
            - "error_id == ERR_INVALID_STATE_TRANSITION (409); run remains COMPUTED, tax year remains BOOKS_CLOSED"

      - name: tax_year_approve_with_stale_run_returns_allocation_stale
        claim_type: violation_to_error
        grounds: ["validations[priority=13]", "errors[ERR_ALLOCATION_STALE]"]
        distinguishing_aspect: "The pure fiscal failure with no state violation: the TaxYear is legitimately UNDER_REVIEW (valid from-state for approve) but its LOCKED run went STALE after a transfer settle, so approve fails with ERR_ALLOCATION_STALE alone."
        test_recipe:
          setup: ["fund with LP1 (9000bps) and GP1 (1000bps); TaxYear 2025 UNDER_REVIEW with LOCKED FINAL run; LP3 admitted; a settled LP1 -> LP3 transfer (100bps, effective 2025-06-01) has staled the run"]
