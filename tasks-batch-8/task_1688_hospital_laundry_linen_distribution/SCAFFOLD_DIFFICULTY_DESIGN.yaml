            - { call: "POST /facilities", payload: { name: "General", rate_per_lb_cents: 40, isolation_surcharge_pct: 0.25, monthly_cap_cents: 500 }, as: LinenManager, as_user_id: "lm-1", captures: { fac: $.data.id } }
