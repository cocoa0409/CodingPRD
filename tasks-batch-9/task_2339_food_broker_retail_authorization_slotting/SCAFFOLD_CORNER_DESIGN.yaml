          setup:
            - "Retailer BIGMART; principal NWF ACTIVE with an ACTIVE FROZEN_SNACKS agreement."
            - "Item I1 VALIDATED, item I2 left in catalog_state SUBMITTED, item I3 VALIDATED but never listed on any presentation."
