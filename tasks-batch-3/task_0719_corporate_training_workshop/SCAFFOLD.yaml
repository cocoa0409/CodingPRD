# =============================================================================
# Corporate Training & Workshop Delivery — seed tables (Expert band)
# =============================================================================

scenario: |
  Corporate Training & Workshop Delivery: catalog & custom-program design, facilitator & cohort
  scheduling, virtual/onsite logistics & materials, registration & seat capacity, assessment &
  certificate/CEU, per-seat vs flat & travel, evaluation/NPS, recurring/enterprise contract

domain_name: corporate-training-workshop
api_prefix: /training

# Primary: Quota / allocation — finite seat pool per cohort competed for by registrations,
#   reserved on enroll, committed on confirm, released on withdraw/cancel, with waitlist promotion.
# Secondary: Workflow orchestration — program design → publish, cohort scheduling → delivery → close,
#   assessment → certificate issuance pipelines with branching and compensation.
complexity_profile:
  primary_archetype: quota_allocation
  secondary_archetype: workflow_orchestration
  complexity_layers:
    - optimistic_concurrency       # OCC on Cohort.version for seat enrollment races
    - dual_variant_calculation     # per-seat vs flat program pricing; provisional vs final invoice
    - cascading_side_effects       # cohort cancel → registrations → certificates; contract draw-down
    - derived_field_reconciliation # Cohort.seats_reserved / seats_confirmed kept consistent

  entity_topology: flat            # peer entities linked by FK; no deep URL nesting
  state_machine_shape: cyclic      # ProgramVersion design loop + Cohort scheduling cycle
  relationship_patterns:
    - one_to_many                  # Program -> ProgramVersion; Cohort -> Session; Cohort -> Registration
    - many_to_many                 # Facilitator <-> Session via SessionAssignment
    - cross_aggregate              # Registration -> EnterpriseContract; Certificate -> Registration
  role_model: peer_roles           # ProgramDesigner / SchedulingCoordinator / Facilitator / Learner / FinanceManager
  consistency_model: immediate

# =============================================================================
# Table 1.0: Response Envelope (FIXED — EMIT VERBATIM)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# Table 1.1: Entity-Relationship Table
# =============================================================================
entities:
  - name: Program
    parent: null
    common_fields: true
    fields:
      - { name: title, type: string, source: input, description: "Catalog program title" }
      - { name: category, type: enum, source: input, description: "LEADERSHIP | TECHNICAL | COMPLIANCE | SALES" }
      - { name: delivery_mode, type: enum, source: input, description: "VIRTUAL | ONSITE | HYBRID" }
      - { name: ceu_credits, type: number, source: input, default: 0, description: "Continuing Education Units awarded on pass; 0..40, one decimal", constraints: "0 <= ceu_credits <= 40" }
      - { name: is_custom, type: boolean, source: input, default: false, description: "true = bespoke client design; false = standard catalog offering" }
      - { name: status, type: enum, source: system, description: "DRAFT | PUBLISHED | RETIRED" }
      - { name: active_version_id, type: string, source: computed, description: "Pointer to the currently APPROVED ProgramVersion.id for this program (computed back-pointer set on approve), or null if none; resolve forward via GET /training/program-versions/{id}" }

  - name: ProgramVersion
    parent: null
    common_fields: true
    fields:
      - { name: program_id, type: string, source: input, description: "FK -> Program.id; owning program" }
      - { name: version_label, type: string, source: input, description: "Author-chosen label e.g. 'v2-2026'" }
      - { name: duration_hours, type: number, source: input, description: "Total instructional hours; > 0", constraints: "duration_hours > 0" }
      - { name: pricing_model, type: enum, source: input, description: "PER_SEAT | FLAT" }
      - { name: per_seat_cents, type: integer, source: input, default: 0, description: "Price per confirmed seat in cents; used when pricing_model=PER_SEAT" }
      - { name: flat_fee_cents, type: integer, source: input, default: 0, description: "Flat delivery fee in cents; used when pricing_model=FLAT" }
      - { name: materials_kit_cents, type: integer, source: input, default: 0, description: "Per-seat printed/onsite materials cost in cents" }
      - { name: min_seats, type: integer, source: input, default: 1, description: "Minimum confirmed seats for the cohort to run", constraints: "min_seats >= 1" }
      - { name: pass_threshold_pct, type: integer, source: input, default: 70, description: "Assessment percent score (0..100) required to PASS", constraints: "0 <= pass_threshold_pct <= 100" }
      - { name: status, type: enum, source: system, description: "DRAFT | IN_REVIEW | APPROVED | SUPERSEDED" }

  - name: Facilitator
    parent: null
    common_fields: true
    fields:
      - { name: full_name, type: string, source: input, description: "Facilitator display name" }
      - { name: email, type: string, source: input, description: "Unique facilitator email", constraints: "unique" }
      - { name: certified_categories, type: array, source: input, description: "Program categories this facilitator may teach, subset of LEADERSHIP/TECHNICAL/COMPLIANCE/SALES" }
      - { name: travel_base_cents, type: integer, source: input, default: 0, description: "Flat travel reimbursement in cents charged per ONSITE/HYBRID cohort this facilitator leads" }
      - { name: status, type: enum, source: system, default: "ACTIVE", description: "ACTIVE | SUSPENDED" }

  - name: Cohort
    parent: null
    common_fields: true
    fields:
      - { name: program_version_id, type: string, source: input, description: "FK -> ProgramVersion.id; the APPROVED version delivered" }
      - { name: lead_facilitator_id, type: string, source: input, description: "FK -> Facilitator.id; primary facilitator" }
      - { name: contract_id, type: string, source: input, description: "FK -> EnterpriseContract.id; sponsoring contract, or null for open-enrollment", constraints: "nullable" }
      - { name: seat_capacity, type: integer, source: input, description: "Maximum total seats (confirmed + reserved)", constraints: "seat_capacity >= 1" }
      - { name: waitlist_capacity, type: integer, source: input, default: 0, description: "Maximum waitlisted registrations", constraints: "waitlist_capacity >= 0" }
      - { name: delivery_mode, type: enum, source: input, description: "VIRTUAL | ONSITE | HYBRID; must be compatible with program delivery_mode" }
      - { name: starts_at, type: datetime, source: input, description: "Cohort start instant (ISO 8601 UTC)" }
      - { name: ends_at, type: datetime, source: input, description: "Cohort end instant; must be > starts_at" }
      - { name: enroll_deadline, type: datetime, source: input, description: "Last instant a learner may enroll; must be <= starts_at" }
      - { name: seats_reserved, type: integer, source: computed, default: 0, description: "Count of Registrations in ENROLLED state for this cohort" }
      - { name: seats_confirmed, type: integer, source: computed, default: 0, description: "Count of Registrations in CONFIRMED or ATTENDED state for this cohort" }
      - { name: seats_waitlisted, type: integer, source: computed, default: 0, description: "Count of Registrations in WAITLISTED state for this cohort" }
      - { name: nps_score, type: integer, source: computed, description: "Net Promoter Score over submitted Evaluations, -100..100; null until cohort CLOSED" }
      - { name: status, type: enum, source: system, description: "SCHEDULED | OPEN | LOCKED | RUNNING | DELIVERED | CLOSED | CANCELLED" }

  - name: Session
    parent: null
    common_fields: true
    fields:
      - { name: cohort_id, type: string, source: input, description: "FK -> Cohort.id; owning cohort" }
      - { name: title, type: string, source: input, description: "Session title" }
      - { name: starts_at, type: datetime, source: input, description: "Session start instant; must be within cohort [starts_at, ends_at]" }
      - { name: ends_at, type: datetime, source: input, description: "Session end instant; must be > starts_at" }
      - { name: room_or_url, type: string, source: input, description: "Onsite room label or virtual meeting URL" }
      - { name: status, type: enum, source: system, default: "PLANNED", description: "PLANNED | HELD | SKIPPED" }

  - name: SessionAssignment
    parent: null
    common_fields: true
    fields:
      - { name: session_id, type: string, source: input, description: "FK -> Session.id; assigned session" }
      - { name: facilitator_id, type: string, source: input, description: "FK -> Facilitator.id; co-facilitator on this session" }
      - { name: role, type: enum, source: input, default: "ASSIST", description: "LEAD | ASSIST" }
      - { name: status, type: enum, source: system, default: "ACTIVE", description: "ACTIVE | RELEASED" }

  - name: Registration
    parent: null
    common_fields: true
    fields:
      - { name: cohort_id, type: string, source: input, description: "FK -> Cohort.id; cohort the learner registers for" }
      - { name: learner_email, type: string, source: input, description: "Learner identifying email; unique per cohort", constraints: "unique within cohort" }
      - { name: learner_name, type: string, source: input, description: "Learner display name" }
      - { name: contract_id, type: string, source: computed, description: "FK -> EnterpriseContract.id; copied from cohort.contract_id at enroll time, or null", constraints: "nullable" }
      - { name: billing_mode, type: enum, source: computed, description: "CONTRACT | SELF_PAY; CONTRACT when cohort has a contract, else SELF_PAY" }
      - { name: seat_price_cents, type: integer, source: computed, default: 0, description: "Per-seat charge locked at CONFIRMED time; 0 for FLAT-priced cohorts" }
      - { name: status, type: enum, source: system, description: "WAITLISTED | ENROLLED | CONFIRMED | ATTENDED | NO_SHOW | WITHDRAWN | CANCELLED" }

  - name: Assessment
    parent: null
    common_fields: true
    fields:
      - { name: registration_id, type: string, source: input, description: "FK -> Registration.id; learner being assessed" }
      - { name: raw_score, type: integer, source: input, description: "Points scored", constraints: "raw_score >= 0" }
      - { name: max_score, type: integer, source: input, description: "Maximum possible points", constraints: "max_score >= 1" }
      - { name: percent_score, type: number, source: computed, description: "100 * raw_score / max_score, round_half_up to 2 decimals" }
      - { name: outcome, type: enum, source: computed, description: "PASS | FAIL; PASS when percent_score >= program_version.pass_threshold_pct" }
      - { name: status, type: enum, source: system, default: "GRADED", description: "GRADED | VOIDED" }

  - name: Certificate
    parent: null
    common_fields: true
    fields:
      - { name: registration_id, type: string, source: input, description: "FK -> Registration.id; learner receiving the certificate" }
      - { name: assessment_id, type: string, source: input, description: "FK -> Assessment.id; the passing assessment" }
      - { name: ceu_awarded, type: number, source: computed, description: "CEU credits granted; copied from program.ceu_credits at issuance" }
      - { name: serial, type: string, source: system, description: "Human-readable certificate serial, monotone per cohort" }
      - { name: status, type: enum, source: system, default: "ISSUED", description: "ISSUED | REVOKED" }

  - name: EnterpriseContract
    parent: null
    common_fields: true
    fields:
      - { name: client_name, type: string, source: input, description: "Sponsoring client organization name" }
      - { name: budget_cents, type: integer, source: input, description: "Total contracted budget in cents", constraints: "budget_cents >= 0" }
      - { name: committed_cents, type: integer, source: computed, default: 0, description: "Sum of finalized cohort invoice totals drawn against this contract" }
      - { name: remaining_cents, type: integer, source: computed, description: "= budget_cents - committed_cents" }
      - { name: is_recurring, type: boolean, source: input, default: false, description: "true = renews automatically each term" }
      - { name: status, type: enum, source: system, description: "ACTIVE | EXHAUSTED | CLOSED" }

  - name: Invoice
    parent: null
    common_fields: true
    fields:
      - { name: cohort_id, type: string, source: input, description: "FK -> Cohort.id; cohort being billed" }
      - { name: contract_id, type: string, source: computed, description: "FK -> EnterpriseContract.id; copied from cohort, or null", constraints: "nullable" }
      - { name: tuition_cents, type: integer, source: computed, description: "Program delivery charge per pricing model" }
      - { name: materials_cents, type: integer, source: computed, description: "Per-confirmed-seat materials charge" }
      - { name: travel_cents, type: integer, source: computed, description: "Facilitator travel reimbursement (ONSITE/HYBRID only)" }
      - { name: total_cents, type: integer, source: computed, description: "tuition_cents + materials_cents + travel_cents" }
      - { name: variant, type: enum, source: system, description: "PROVISIONAL (at LOCKED) | FINAL (at DELIVERED close)" }
      - { name: status, type: enum, source: system, description: "PROVISIONAL | FINAL | VOID" }

  - name: Evaluation
    parent: null
    common_fields: false
    fields:
      - { name: registration_id, type: string, source: input, description: "FK -> Registration.id; learner submitting feedback" }
      - { name: cohort_id, type: string, source: computed, description: "FK -> Cohort.id; copied from registration at submit time" }
      - { name: nps_rating, type: integer, source: input, description: "0..10 likelihood-to-recommend rating", constraints: "0 <= nps_rating <= 10" }
      - { name: comment, type: string, source: input, default: "", description: "Free-text feedback" }

# =============================================================================
# Table 1.2: State Machine Table
# =============================================================================
state_machines:
  - entity: ProgramVersion
    initial_state: DRAFT
    terminal_states: [SUPERSEDED]
    transitions:
      - from: DRAFT
        to: IN_REVIEW
        trigger: "POST /training/program-versions/{id}/submit"
        actor: ProgramDesigner
        preconditions:
          - "duration_hours > 0"
          - "If pricing_model=PER_SEAT then per_seat_cents > 0; if FLAT then flat_fee_cents > 0 (ERR_PRICING_INCOMPLETE)"
        side_effects: []
      - from: IN_REVIEW
        to: DRAFT
        trigger: "POST /training/program-versions/{id}/request-changes"
        actor: ProgramDesigner
        preconditions: []
        side_effects: []
        note: "Revision loop — design cycle (cyclic shape)"
      - from: IN_REVIEW
        to: APPROVED
        trigger: "POST /training/program-versions/{id}/approve"
        actor: ProgramDesigner
        preconditions:
          - "Owning Program.status != RETIRED (ERR_PROGRAM_RETIRED)"
        side_effects:
          - "If another ProgramVersion of the same program is APPROVED, that prior version -> SUPERSEDED"
          - "Program.active_version_id = this version id; Program.status -> PUBLISHED if it was DRAFT"
      - from: APPROVED
        to: SUPERSEDED
        trigger: "system (automatic when a newer ProgramVersion of the same program is APPROVED)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: Cohort
    initial_state: SCHEDULED
    terminal_states: [CLOSED, CANCELLED]
    transitions:
      - from: SCHEDULED
        to: OPEN
        trigger: "POST /training/cohorts/{id}/open"
        actor: SchedulingCoordinator
        preconditions:
          - "Referenced ProgramVersion.status == APPROVED (ERR_VERSION_NOT_APPROVED)"
          - "lead_facilitator.status == ACTIVE and program.category in lead_facilitator.certified_categories (ERR_FACILITATOR_NOT_CERTIFIED)"
          - "cohort.delivery_mode compatible with program.delivery_mode (ERR_DELIVERY_MODE_MISMATCH)"
          - "current_utc < enroll_deadline (ERR_ENROLL_WINDOW_CLOSED)"
        side_effects:
          - "Registrations may now be created"
      - from: OPEN
        to: LOCKED
        trigger: "POST /training/cohorts/{id}/lock"
        actor: SchedulingCoordinator
        preconditions:
          - "seats_confirmed >= program_version.min_seats (ERR_MIN_SEATS_NOT_MET)"
          - "expected_cohort_version matches (OCC)"
        side_effects:
          - "increments Cohort.version by 1"
          - "No further enroll/confirm; PROVISIONAL Invoice created (calc: invoice_totals variant=PROVISIONAL)"
          - "If cohort has contract: reserve PROVISIONAL total against contract (does not yet commit)"
      - from: OPEN
        to: CANCELLED
        trigger: "POST /training/cohorts/{id}/cancel"
        actor: SchedulingCoordinator
        preconditions: []
        side_effects:
          - "Cascade L1: every non-terminal Registration -> CANCELLED"
          - "Cascade L2: each cancelled Registration with an ISSUED Certificate -> that Certificate REVOKED"
          - "Cascade L3: each REVOKED Certificate's CEU award removed (no contract draw for cancelled cohort)"
          - "Any PROVISIONAL/FINAL Invoice -> VOID; released contract reservation restored"
      - from: LOCKED
        to: CANCELLED
        trigger: "POST /training/cohorts/{id}/cancel"
        actor: SchedulingCoordinator
        preconditions: []
        side_effects:
          - "Cascade L1: every non-terminal Registration -> CANCELLED"
          - "Cascade L2: each cancelled Registration with an ISSUED Certificate -> that Certificate REVOKED"
          - "Cascade L3: each REVOKED Certificate's CEU award removed"
          - "PROVISIONAL Invoice -> VOID; contract reservation released (committed_cents unchanged)"
      - from: LOCKED
        to: RUNNING
        trigger: "POST /training/cohorts/{id}/start"
        actor: SchedulingCoordinator
        preconditions:
          - "current_utc >= starts_at (ERR_BEFORE_START)"
        side_effects: []
      - from: RUNNING
        to: DELIVERED
        trigger: "POST /training/cohorts/{id}/deliver"
        actor: SchedulingCoordinator
        preconditions:
          - "current_utc >= ends_at (ERR_BEFORE_END)"
        side_effects:
          - "Every CONFIRMED Registration with no attendance mark -> NO_SHOW; remaining CONFIRMED -> ATTENDED"
      - from: DELIVERED
        to: CLOSED
        trigger: "POST /training/cohorts/{id}/close"
        actor: SchedulingCoordinator
        preconditions: []
        side_effects:
          - "FINAL Invoice computed (calc: invoice_totals variant=FINAL over ATTENDED seats)"
          - "If contract: committed_cents += FINAL total; remaining_cents recomputed; contract -> EXHAUSTED if remaining_cents == 0"
          - "nps_score computed from submitted Evaluations"

  - entity: Registration
    initial_state: ENROLLED
    terminal_states: [ATTENDED, NO_SHOW, WITHDRAWN, CANCELLED]
    transitions:
      - from: WAITLISTED
        to: ENROLLED
        trigger: "system (automatic promotion when a seat frees and cohort still OPEN)"
        actor: system
        preconditions:
          - "seats_reserved + seats_confirmed < seat_capacity"
        side_effects:
          - "Cohort.seats_waitlisted -= 1; Cohort.seats_reserved += 1"
      - from: ENROLLED
        to: CONFIRMED
        trigger: "POST /training/registrations/{id}/confirm"
        actor: Learner
        preconditions:
          - "Cohort.status == OPEN (ERR_COHORT_NOT_OPEN)"
        side_effects:
          - "Cohort.seats_reserved -= 1; Cohort.seats_confirmed += 1"
          - "seat_price_cents locked (calc: seat_price)"
      - from: ENROLLED
        to: WITHDRAWN
        trigger: "POST /training/registrations/{id}/withdraw"
        actor: Learner
        preconditions:
          - "Cohort.status in {OPEN} (ERR_COHORT_NOT_OPEN)"
        side_effects:
          - "Cohort.seats_reserved -= 1"
          - "Promote earliest WAITLISTED registration (by created_at ASC) if any (cascade)"
      - from: CONFIRMED
        to: WITHDRAWN
        trigger: "POST /training/registrations/{id}/withdraw"
        actor: Learner
        preconditions:
          - "Cohort.status in {OPEN} (ERR_COHORT_NOT_OPEN)"
        side_effects:
          - "Cohort.seats_confirmed -= 1"
          - "Promote earliest WAITLISTED registration (by created_at ASC) if any (cascade)"
      - from: CONFIRMED
        to: ATTENDED
        trigger: "POST /training/registrations/{id}/mark-attendance"
        actor: Facilitator
        preconditions:
          - "Cohort.status in {RUNNING, DELIVERED} (ERR_COHORT_NOT_RUNNING)"
        side_effects: []
      - from: CONFIRMED
        to: NO_SHOW
        trigger: "system (automatic at cohort deliver for CONFIRMED with no attendance mark)"
        actor: system
        preconditions: []
        side_effects: []
      - from: ENROLLED
        to: CANCELLED
        trigger: "system (automatic on cohort cancel)"
        actor: system
        preconditions: []
        side_effects: []
      - from: CONFIRMED
        to: CANCELLED
        trigger: "system (automatic on cohort cancel)"
        actor: system
        preconditions: []
        side_effects: []
      - from: WAITLISTED
        to: CANCELLED
        trigger: "system (automatic on cohort cancel)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: Certificate
    initial_state: ISSUED
    terminal_states: [REVOKED]
    transitions:
      - from: ISSUED
        to: REVOKED
        trigger: "POST /training/certificates/{id}/revoke"
        actor: ProgramDesigner
        preconditions:
          - "Linked Registration.status != ATTENDED OR linked Assessment.status == VOIDED (ERR_CERTIFICATE_STILL_VALID)"
        side_effects:
          - "ceu_awarded removed from learner record"
      - from: ISSUED
        to: REVOKED
        trigger: "system (automatic on cohort cancel cascade L2)"
        actor: system
        preconditions: []
        side_effects:
          - "ceu_awarded removed"

  - entity: EnterpriseContract
    initial_state: ACTIVE
    terminal_states: [CLOSED]
    transitions:
      - from: ACTIVE
        to: EXHAUSTED
        trigger: "system (automatic when committed_cents reaches budget_cents on cohort close)"
        actor: system
        preconditions: []
        side_effects: []
      - from: EXHAUSTED
        to: ACTIVE
        trigger: "system (automatic when a cohort close is voided/reversed freeing committed budget)"
        actor: system
        preconditions: []
        side_effects: []
        note: "Compensation reopens an exhausted contract"
      - from: ACTIVE
        to: CLOSED
        trigger: "POST /training/contracts/{id}/close"
        actor: FinanceManager
        preconditions:
          - "No cohort referencing this contract is in {OPEN, LOCKED, RUNNING, DELIVERED} (ERR_CONTRACT_HAS_OPEN_COHORTS)"
        side_effects: []

# -----------------------------------------------------------------------------
# Concurrency Rules (§1.2.1) — OCC on Cohort.version
# -----------------------------------------------------------------------------
concurrency_rules:
  - rule_id: cohort-lock-stale-version
    parent_entity: Cohort
    write_endpoint: "POST /training/cohorts/{id}/lock"
    occ_field: "expected_cohort_version"
    description: |
      Locking a Cohort whose version has advanced since the coordinator last
      observed it is rejected. A confirm/withdraw that mutated seat counts
      legitimately bumped Cohort.version; a lock request still carrying the
      pre-mutation version is therefore acting on a stale view of the seat
      ledger and is refused.
    error_id: ERR_STALE_COHORT_VERSION
    http_status: 412

# =============================================================================
# Table 1.3: Calculation Rules Table
# =============================================================================
calculations:
  - name: assessment_percent_and_outcome
    trigger: "POST /training/registrations/{id}/assessments (assessment creation)"
    algorithm: threshold
    formula: |
      percent_score = round_half_up(100 * raw_score / max_score, 2)
      pv = program_version of the cohort of this registration
      outcome = PASS if percent_score >= pv.pass_threshold_pct else FAIL
    input_set: "single assessment row; pass_threshold_pct from the cohort's ProgramVersion"
    constants: {}
    precision: "percent_score: 2 decimals round_half_up; threshold compare is >= (boundary-inclusive)"

  - name: seat_price
    trigger: "Registration ENROLLED->CONFIRMED (confirm)"
    algorithm: threshold
    formula: |
      pv = cohort.program_version
      if pv.pricing_model == PER_SEAT:
        seat_price_cents = pv.per_seat_cents
      else:   # FLAT
        seat_price_cents = 0   # flat tuition billed once at cohort level, not per seat
    input_set: "single registration at confirm time"
    constants: {}
    precision: "integer cents"

  - name: invoice_totals
    trigger: "Cohort OPEN->LOCKED (PROVISIONAL) and DELIVERED->CLOSED (FINAL)"
    algorithm: aggregation
    formula: |
      pv = cohort.program_version
      lead = cohort.lead_facilitator
      # Seat set differs by variant:
      #   PROVISIONAL: seats = count of Registrations in CONFIRMED (snapshot at LOCKED)
      #   FINAL:       seats = count of Registrations in ATTENDED (snapshot at CLOSE) — NO_SHOW excluded
      if pv.pricing_model == PER_SEAT:
        tuition_cents = pv.per_seat_cents * seats
      else:   # FLAT
        tuition_cents = pv.flat_fee_cents          # independent of seat count
      materials_cents = pv.materials_kit_cents * seats
      if cohort.delivery_mode in {ONSITE, HYBRID}:
        travel_cents = lead.travel_base_cents
      else:
        travel_cents = 0
      total_cents = tuition_cents + materials_cents + travel_cents
    input_set: "Registrations of the cohort filtered by status per variant; pricing & materials from ProgramVersion; travel from lead Facilitator"
    constants: {}
    precision: "integer cents; no rounding (all inputs integer cents)"
    variants:
      - name: PROVISIONAL
        when: "computed at OPEN->LOCKED"
        difference: "seat set = CONFIRMED registrations at lock time; reserved against contract but committed_cents unchanged"
      - name: FINAL
        when: "computed at DELIVERED->CLOSED"
        difference: "seat set = ATTENDED registrations only (NO_SHOW excluded); drawn down: committed_cents += total_cents"

  - name: contract_drawdown
    trigger: "Cohort DELIVERED->CLOSED for a contract-sponsored cohort"
    algorithm: waterfall_allocation
    formula: |
      # Evaluation order is pinned: FINAL invoice total is computed first (depends on ATTENDED seats),
      # THEN drawn against the contract. The draw must not exceed remaining_cents.
      draw = invoice.total_cents
      if draw > contract.remaining_cents:
        reject close with ERR_CONTRACT_BUDGET_EXCEEDED   # boundary: draw == remaining_cents is allowed
      contract.committed_cents += draw
      contract.remaining_cents = contract.budget_cents - contract.committed_cents
      if contract.remaining_cents == 0: contract.status = EXHAUSTED
    input_set: "single FINAL invoice vs sponsoring contract remaining budget"
    constants: {}
    precision: "integer cents; comparison draw > remaining is strict (equality allowed)"
    variants:
      - name: RESERVED
        when: "computed at OPEN->LOCKED on the contract's available budget"
        difference: "reserved = PROVISIONAL invoice total (over CONFIRMED seats); decreases the contract's *available* budget for new cohorts but leaves committed_cents = 0 — a soft hold that is fully released on cancel"
      - name: COMMITTED
        when: "computed at DELIVERED->CLOSED"
        difference: "committed = FINAL invoice total (over ATTENDED seats only); committed_cents += draw permanently and EXHAUSTED is possible — irreversible except by compensation. RESERVED and COMMITTED differ by NO_SHOW seats so a contract that had budget reserved at lock can still close under budget."

  - name: cohort_nps
    trigger: "Cohort DELIVERED->CLOSED"
    algorithm: aggregation
    formula: |
      ratings = nps_rating of all Evaluations whose cohort_id == this cohort
      n = count(ratings)
      if n == 0:
        nps_score = null
      else:
        promoters  = count(r in ratings if r >= 9)
        detractors = count(r in ratings if r <= 6)
        nps_score = round_half_up(100 * (promoters - detractors) / n, 0)   # integer -100..100
    input_set: "all Evaluations linked to the cohort via cohort_id; no status filter (Evaluation is append-only, common_fields:false)"
    constants:
      PROMOTER_MIN: 9
      DETRACTOR_MAX: 6
    precision: "integer; round_half_up; empty set -> null (NOT 0)"

# =============================================================================
# Table 1.4: Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all

  - priority: 2
    category: auth
    check: "Acting role permitted for this operation per RBAC"
    error_id: ERR_FORBIDDEN_ROLE
    http_status: 403
    applies_to: all

  - priority: 3
    category: existence
    check: "All path/body referenced resources exist, validated left-to-right"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: all

  - priority: 4
    category: business_referential
    check: "Body FK fields reference resources of the correct type (e.g. program_version_id is a ProgramVersion)"
    error_id: ERR_INVALID_REFERENCE
    http_status: 422
    applies_to: "create endpoints with FK body fields"

  - priority: 5
    category: state
    check: "Target resource in a state from which the requested transition is defined"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all state-transition endpoints"

  - priority: 6
    category: state
    check: "OCC: expected_cohort_version matches current Cohort.version"
    error_id: ERR_STALE_COHORT_VERSION
    http_status: 412
    applies_to: "POST /training/cohorts/{id}/lock"

  - priority: 7
    category: business_safety
    check: "Facilitator certified for program category and ACTIVE before cohort opens"
    error_id: ERR_FACILITATOR_NOT_CERTIFIED
    http_status: 409
    applies_to: "POST /training/cohorts/{id}/open"

  - priority: 8
    category: business_constraint
    check: "Cohort delivery_mode compatible with program delivery_mode (HYBRID program accepts any; VIRTUAL program rejects ONSITE cohort and vice versa)"
    error_id: ERR_DELIVERY_MODE_MISMATCH
    http_status: 409
    applies_to: "POST /training/cohorts/{id}/open"

  - priority: 9
    category: business_temporal
    check: "Session interval lies within cohort [starts_at, ends_at]"
    error_id: ERR_SESSION_OUT_OF_RANGE
    http_status: 422
    applies_to: "POST /training/cohorts/{id}/sessions"

  - priority: 10
    category: business_temporal
    check: "A facilitator's ACTIVE SessionAssignments must not overlap in time (half-open [starts_at, ends_at); touching at an endpoint is allowed)"
    error_id: ERR_FACILITATOR_DOUBLE_BOOKED
    http_status: 409
    applies_to: "POST /training/sessions/{id}/assignments"

  - priority: 11
    category: business_temporal
    check: "Two Sessions of the same cohort sharing a room_or_url must not overlap (closed-interval; adjacency at a shared boundary instant is also rejected — back-to-back needs a gap)"
    error_id: ERR_ROOM_CONFLICT
    http_status: 409
    applies_to: "POST /training/cohorts/{id}/sessions"

  - priority: 12
    category: business_constraint
    check: "enroll/confirm only while seats available; ENROLLED+CONFIRMED < seat_capacity for a new ENROLLED"
    error_id: ERR_COHORT_FULL
    http_status: 409
    applies_to: "POST /training/cohorts/{id}/registrations"

  - priority: 13
    category: business_constraint
    check: "Waitlist only when seats full and seats_waitlisted < waitlist_capacity"
    error_id: ERR_WAITLIST_FULL
    http_status: 409
    applies_to: "POST /training/cohorts/{id}/registrations"

  - priority: 14
    category: business_temporal
    check: "Enrollment only before enroll_deadline"
    error_id: ERR_ENROLL_WINDOW_CLOSED
    http_status: 409
    applies_to: "POST /training/cohorts/{id}/registrations"

  - priority: 15
    category: business_constraint
    check: "Learner email unique within a cohort"
    error_id: ERR_DUPLICATE_REGISTRATION
    http_status: 409
    applies_to: "POST /training/cohorts/{id}/registrations"

  - priority: 16
    category: business_constraint
    check: "min_seats met before lock"
    error_id: ERR_MIN_SEATS_NOT_MET
    http_status: 409
    applies_to: "POST /training/cohorts/{id}/lock"

  - priority: 17
    category: business_constraint
    check: "Certificate issuance only for an ATTENDED registration whose assessment outcome is PASS"
    error_id: ERR_NOT_ELIGIBLE_FOR_CERTIFICATE
    http_status: 409
    applies_to: "POST /training/registrations/{id}/certificate"

  - priority: 18
    category: business_fiscal
    check: "Contract FINAL draw must not exceed remaining_cents"
    error_id: ERR_CONTRACT_BUDGET_EXCEEDED
    http_status: 409
    applies_to: "POST /training/cohorts/{id}/close"

  - priority: 19
    category: business_constraint
    check: "Pricing fields complete for the chosen pricing_model before submit"
    error_id: ERR_PRICING_INCOMPLETE
    http_status: 422
    applies_to: "POST /training/program-versions/{id}/submit"

  - priority: 20
    category: business_constraint
    check: "Evaluation may be submitted only by an ATTENDED or NO_SHOW registration of a DELIVERED/CLOSED cohort"
    error_id: ERR_EVALUATION_NOT_ALLOWED
    http_status: 409
    applies_to: "POST /training/registrations/{id}/evaluation"

# =============================================================================
# Table 1.5: API Endpoint Table
# =============================================================================
endpoints:
  # ---- Clock (test-driving) ----
  - method: POST
    path: "/training/_clock/set_current_utc"
    description: "Set the logical clock used for all deadline/window/start/end checks. Server startup default is 2026-03-01T00:00:00Z; before any call the clock reads exactly this default and never falls back to wall-clock time."
    roles: [SchedulingCoordinator, FinanceManager, ProgramDesigner]
    code: 200
    input: [to_iso8601]
    output: null
    side_effects: ["logical clock = to_iso8601"]

  # ---- Program ----
  - method: POST
    path: "/training/programs"
    description: "Create a catalog or custom program (DRAFT)"
    roles: [ProgramDesigner]
    code: 201
    input: [title, category, delivery_mode, "ceu_credits?", "is_custom?"]
    output: Program
    side_effects: ["status=DRAFT, active_version_id=null"]
  - method: GET
    path: "/training/programs/{id}"
    description: "Get a program"
    roles: [ProgramDesigner, SchedulingCoordinator, FinanceManager]
    code: 200
    input: []
    output: Program
    side_effects: []
  - method: GET
    path: "/training/programs"
    description: "List programs (paginated)"
    roles: [ProgramDesigner, SchedulingCoordinator, FinanceManager]
    code: 200
    input: ["category?", "status?", "limit?", "offset?"]
    output: Program[]
    side_effects: []
  - method: POST
    path: "/training/programs/{id}/retire"
    description: "Retire a program"
    roles: [ProgramDesigner]
    code: 200
    input: []
    output: Program
    side_effects: ["status=RETIRED"]

  # ---- ProgramVersion ----
  - method: POST
    path: "/training/program-versions"
    description: "Create a draft program version under a program"
    roles: [ProgramDesigner]
    code: 201
    input: [program_id, version_label, duration_hours, pricing_model, "per_seat_cents?", "flat_fee_cents?", "materials_kit_cents?", "min_seats?", "pass_threshold_pct?"]
    output: ProgramVersion
    side_effects: ["status=DRAFT"]
  - method: GET
    path: "/training/program-versions/{id}"
    description: "Get a program version"
    roles: [ProgramDesigner, SchedulingCoordinator, FinanceManager]
    code: 200
    input: []
    output: ProgramVersion
    side_effects: []
  - method: GET
    path: "/training/program-versions"
    description: "List program versions; filter by program_id"
    roles: [ProgramDesigner, SchedulingCoordinator, FinanceManager]
    code: 200
    input: ["program_id?", "status?", "limit?", "offset?"]
    output: ProgramVersion[]
    side_effects: []
  - method: POST
    path: "/training/program-versions/{id}/submit"
    description: "Submit a draft version for review"
    roles: [ProgramDesigner]
    code: 200
    input: []
    output: ProgramVersion
    side_effects: ["status DRAFT->IN_REVIEW"]
  - method: POST
    path: "/training/program-versions/{id}/request-changes"
    description: "Send a version back to DRAFT (revision loop)"
    roles: [ProgramDesigner]
    code: 200
    input: []
    output: ProgramVersion
    side_effects: ["status IN_REVIEW->DRAFT"]
  - method: POST
    path: "/training/program-versions/{id}/approve"
    description: "Approve a version; supersedes prior approved version"
    roles: [ProgramDesigner]
    code: 200
    input: []
    output: ProgramVersion
    side_effects: ["status IN_REVIEW->APPROVED", "prior APPROVED version -> SUPERSEDED", "Program.active_version_id set, Program PUBLISHED"]

  # ---- Facilitator ----
  - method: POST
    path: "/training/facilitators"
    description: "Create a facilitator"
    roles: [SchedulingCoordinator]
    code: 201
    input: [full_name, email, certified_categories, "travel_base_cents?"]
    output: Facilitator
    side_effects: ["status=ACTIVE"]
  - method: GET
    path: "/training/facilitators/{id}"
    description: "Get a facilitator"
    roles: [SchedulingCoordinator, ProgramDesigner, FinanceManager]
    code: 200
    input: []
    output: Facilitator
    side_effects: []
  - method: GET
    path: "/training/facilitators"
    description: "List facilitators (paginated)"
    roles: [SchedulingCoordinator, ProgramDesigner, FinanceManager]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: Facilitator[]
    side_effects: []
  - method: POST
    path: "/training/facilitators/{id}/suspend"
    description: "Suspend a facilitator"
    roles: [SchedulingCoordinator]
    code: 200
    input: []
    output: Facilitator
    side_effects: ["status=SUSPENDED"]

  # ---- EnterpriseContract ----
  - method: POST
    path: "/training/contracts"
    description: "Create an enterprise contract"
    roles: [FinanceManager]
    code: 201
    input: [client_name, budget_cents, "is_recurring?"]
    output: EnterpriseContract
    side_effects: ["status=ACTIVE, committed_cents=0, remaining_cents=budget_cents"]
  - method: GET
    path: "/training/contracts/{id}"
    description: "Get a contract"
    roles: [FinanceManager, SchedulingCoordinator]
    code: 200
    input: []
    output: EnterpriseContract
    side_effects: []
  - method: GET
    path: "/training/contracts"
    description: "List contracts (paginated)"
    roles: [FinanceManager, SchedulingCoordinator]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: EnterpriseContract[]
    side_effects: []
  - method: POST
    path: "/training/contracts/{id}/close"
    description: "Close a contract"
    roles: [FinanceManager]
    code: 200
    input: []
    output: EnterpriseContract
    side_effects: ["status ACTIVE->CLOSED"]

  # ---- Cohort ----
  - method: POST
    path: "/training/cohorts"
    description: "Schedule a cohort for an approved program version"
    roles: [SchedulingCoordinator]
    code: 201
    input: [program_version_id, lead_facilitator_id, "contract_id?", seat_capacity, "waitlist_capacity?", delivery_mode, starts_at, ends_at, enroll_deadline]
    output: Cohort
    side_effects: ["status=SCHEDULED, seats_reserved=0, seats_confirmed=0, seats_waitlisted=0, version=1"]
  - method: GET
    path: "/training/cohorts/{id}"
    description: "Get a cohort (with derived seat counts)"
    roles: [SchedulingCoordinator, ProgramDesigner, FinanceManager, Learner, Facilitator]
    code: 200
    input: []
    output: Cohort
    side_effects: []
  - method: GET
    path: "/training/cohorts"
    description: "List cohorts; filter by contract_id, lead_facilitator_id, program_version_id, status"
    roles: [SchedulingCoordinator, ProgramDesigner, FinanceManager]
    code: 200
    input: ["contract_id?", "lead_facilitator_id?", "program_version_id?", "status?", "limit?", "offset?"]
    output: Cohort[]
    side_effects: []
  - method: POST
    path: "/training/cohorts/{id}/open"
    description: "Open a cohort for enrollment"
    roles: [SchedulingCoordinator]
    code: 200
    input: []
    output: Cohort
    side_effects: ["status SCHEDULED->OPEN"]
  - method: POST
    path: "/training/cohorts/{id}/lock"
    description: "Lock enrollment; emit PROVISIONAL invoice (OCC-guarded)"
    roles: [SchedulingCoordinator]
    code: 200
    input: [expected_cohort_version]
    output: Cohort
    side_effects: ["status OPEN->LOCKED", "increments Cohort.version by 1", "PROVISIONAL Invoice created", "contract reservation if any"]
  - method: POST
    path: "/training/cohorts/{id}/start"
    description: "Start delivery (clock must reach starts_at)"
    roles: [SchedulingCoordinator]
    code: 200
    input: []
    output: Cohort
    side_effects: ["status LOCKED->RUNNING"]
  - method: POST
    path: "/training/cohorts/{id}/deliver"
    description: "Mark delivery complete; settle attendance"
    roles: [SchedulingCoordinator]
    code: 200
    input: []
    output: Cohort
    side_effects: ["status RUNNING->DELIVERED", "CONFIRMED w/o attendance -> NO_SHOW; else ATTENDED"]
  - method: POST
    path: "/training/cohorts/{id}/close"
    description: "Close cohort; emit FINAL invoice, draw contract, compute NPS"
    roles: [SchedulingCoordinator]
    code: 200
    input: []
    output: Cohort
    side_effects: ["status DELIVERED->CLOSED", "FINAL Invoice", "contract committed_cents += total", "nps_score computed"]
  - method: POST
    path: "/training/cohorts/{id}/cancel"
    description: "Cancel a cohort (cascading)"
    roles: [SchedulingCoordinator]
    code: 200
    input: []
    output: Cohort
    side_effects: ["status -> CANCELLED", "cascade registrations/certificates/invoice/contract reservation"]

  # ---- Session (sub-resource of cohort) ----
  - method: POST
    path: "/training/cohorts/{id}/sessions"
    description: "Add a session to a cohort"
    roles: [SchedulingCoordinator]
    code: 201
    input: [title, starts_at, ends_at, room_or_url]
    output: Session
    side_effects: ["status=PLANNED"]
  - method: GET
    path: "/training/cohorts/{id}/sessions"
    description: "List a cohort's sessions (reverse-reachability for Session.cohort_id)"
    roles: [SchedulingCoordinator, ProgramDesigner, FinanceManager, Facilitator]
    code: 200
    input: []
    output: Session[]
    side_effects: []
  - method: GET
    path: "/training/sessions/{id}"
    description: "Get a session"
    roles: [SchedulingCoordinator, ProgramDesigner, FinanceManager, Facilitator]
    code: 200
    input: []
    output: Session
    side_effects: []

  # ---- SessionAssignment (sub-resource of session) ----
  - method: POST
    path: "/training/sessions/{id}/assignments"
    description: "Assign a co-facilitator to a session"
    roles: [SchedulingCoordinator]
    code: 201
    input: [facilitator_id, "role?"]
    output: SessionAssignment
    side_effects: ["status=ACTIVE"]
  - method: GET
    path: "/training/sessions/{id}/assignments"
    description: "List a session's assignments (reverse-reachability for SessionAssignment.session_id)"
    roles: [SchedulingCoordinator, ProgramDesigner, FinanceManager, Facilitator]
    code: 200
    input: []
    output: SessionAssignment[]
    side_effects: []
  - method: GET
    path: "/training/assignments"
    description: "List session assignments; filter by facilitator_id (reverse-reachability for SessionAssignment.facilitator_id)"
    roles: [SchedulingCoordinator, ProgramDesigner, FinanceManager, Facilitator]
    code: 200
    input: ["facilitator_id?", "session_id?", "status?", "limit?", "offset?"]
    output: SessionAssignment[]
    side_effects: []

  # ---- Registration (sub-resource of cohort + flat actions) ----
  - method: POST
    path: "/training/cohorts/{id}/registrations"
    description: "Register a learner; ENROLLED if seats free else WAITLISTED"
    roles: [Learner, SchedulingCoordinator]
    code: 201
    input: [learner_email, learner_name]
    output: Registration
    side_effects: ["status=ENROLLED (seats_reserved+=1) or WAITLISTED (seats_waitlisted+=1)", "billing_mode/contract_id derived"]
  - method: GET
    path: "/training/cohorts/{id}/registrations"
    description: "List a cohort's registrations (reverse-reachability for Registration.cohort_id)"
    roles: [SchedulingCoordinator, ProgramDesigner, FinanceManager, Facilitator]
    code: 200
    input: []
    output: Registration[]
    side_effects: []
  - method: GET
    path: "/training/registrations/{id}"
    description: "Get a registration"
    roles: [SchedulingCoordinator, ProgramDesigner, FinanceManager, Facilitator, Learner]
    code: 200
    input: []
    output: Registration
    side_effects: []
  - method: GET
    path: "/training/registrations"
    description: "List registrations; filter by contract_id (reverse-reachability for Registration.contract_id)"
    roles: [SchedulingCoordinator, FinanceManager]
    code: 200
    input: ["contract_id?", "cohort_id?", "status?", "limit?", "offset?"]
    output: Registration[]
    side_effects: []
  - method: POST
    path: "/training/registrations/{id}/confirm"
    description: "Learner confirms an enrolled seat"
    roles: [Learner]
    code: 200
    input: []
    output: Registration
    side_effects: ["status ENROLLED->CONFIRMED", "seats_reserved-=1, seats_confirmed+=1", "seat_price locked"]
  - method: POST
    path: "/training/registrations/{id}/withdraw"
    description: "Learner withdraws; promotes earliest waitlisted"
    roles: [Learner, SchedulingCoordinator]
    code: 200
    input: []
    output: Registration
    side_effects: ["status -> WITHDRAWN", "seat freed", "waitlist promotion cascade"]
  - method: POST
    path: "/training/registrations/{id}/mark-attendance"
    description: "Facilitator marks a confirmed learner as attended"
    roles: [Facilitator]
    code: 200
    input: []
    output: Registration
    side_effects: ["status CONFIRMED->ATTENDED"]

  # ---- Assessment (sub-resource of registration) ----
  - method: POST
    path: "/training/registrations/{id}/assessments"
    description: "Grade a learner; computes percent_score and PASS/FAIL"
    roles: [Facilitator]
    code: 201
    input: [raw_score, max_score]
    output: Assessment
    side_effects: ["percent_score & outcome computed"]
  - method: GET
    path: "/training/registrations/{id}/assessments"
    description: "List a registration's assessments (reverse-reachability for Assessment.registration_id)"
    roles: [SchedulingCoordinator, ProgramDesigner, FinanceManager, Facilitator, Learner]
    code: 200
    input: []
    output: Assessment[]
    side_effects: []
  - method: GET
    path: "/training/assessments/{id}"
    description: "Get an assessment"
    roles: [SchedulingCoordinator, ProgramDesigner, FinanceManager, Facilitator, Learner]
    code: 200
    input: []
    output: Assessment
    side_effects: []
  - method: POST
    path: "/training/assessments/{id}/void"
    description: "Void an assessment (e.g. integrity issue)"
    roles: [ProgramDesigner, Facilitator]
    code: 200
    input: []
    output: Assessment
    side_effects: ["status=VOIDED"]

  # ---- Certificate ----
  - method: POST
    path: "/training/registrations/{id}/certificate"
    description: "Issue a CEU certificate for a passed, attended learner"
    roles: [ProgramDesigner, SchedulingCoordinator]
    code: 201
    input: [assessment_id]
    output: Certificate
    side_effects: ["status=ISSUED, ceu_awarded set, serial assigned"]
  - method: GET
    path: "/training/registrations/{id}/certificates"
    description: "List a registration's certificates (reverse-reachability for Certificate.registration_id)"
    roles: [SchedulingCoordinator, ProgramDesigner, FinanceManager, Learner]
    code: 200
    input: []
    output: Certificate[]
    side_effects: []
  - method: GET
    path: "/training/certificates/{id}"
    description: "Get a certificate"
    roles: [SchedulingCoordinator, ProgramDesigner, FinanceManager, Learner]
    code: 200
    input: []
    output: Certificate
    side_effects: []
  - method: GET
    path: "/training/certificates"
    description: "List certificates; filter by assessment_id (reverse-reachability for Certificate.assessment_id)"
    roles: [SchedulingCoordinator, ProgramDesigner, FinanceManager]
    code: 200
    input: ["assessment_id?", "registration_id?", "status?", "limit?", "offset?"]
    output: Certificate[]
    side_effects: []
  - method: POST
    path: "/training/certificates/{id}/revoke"
    description: "Revoke a certificate"
    roles: [ProgramDesigner]
    code: 200
    input: []
    output: Certificate
    side_effects: ["status ISSUED->REVOKED, ceu removed"]

  # ---- Invoice ----
  - method: GET
    path: "/training/cohorts/{id}/invoices"
    description: "List a cohort's invoices (reverse-reachability for Invoice.cohort_id)"
    roles: [FinanceManager, SchedulingCoordinator]
    code: 200
    input: []
    output: Invoice[]
    side_effects: []
  - method: GET
    path: "/training/invoices/{id}"
    description: "Get an invoice"
    roles: [FinanceManager, SchedulingCoordinator]
    code: 200
    input: []
    output: Invoice
    side_effects: []
  - method: GET
    path: "/training/invoices"
    description: "List invoices; filter by contract_id (reverse-reachability for Invoice.contract_id)"
    roles: [FinanceManager, SchedulingCoordinator]
    code: 200
    input: ["contract_id?", "cohort_id?", "status?", "limit?", "offset?"]
    output: Invoice[]
    side_effects: []

  # ---- Evaluation ----
  - method: POST
    path: "/training/registrations/{id}/evaluation"
    description: "Submit a post-delivery NPS evaluation"
    roles: [Learner]
    code: 201
    input: [nps_rating, "comment?"]
    output: Evaluation
    side_effects: ["evaluation recorded; feeds cohort NPS at close"]
  - method: GET
    path: "/training/registrations/{id}/evaluations"
    description: "List a registration's evaluations (reverse-reachability for Evaluation.registration_id)"
    roles: [SchedulingCoordinator, ProgramDesigner, FinanceManager]
    code: 200
    input: []
    output: Evaluation[]
    side_effects: []
  - method: GET
    path: "/training/evaluations"
    description: "List evaluations; filter by cohort_id (reverse-reachability for Evaluation.cohort_id)"
    roles: [SchedulingCoordinator, ProgramDesigner, FinanceManager]
    code: 200
    input: ["cohort_id?", "registration_id?", "limit?", "offset?"]
    output: Evaluation[]
    side_effects: []

# =============================================================================
# Table 1.6: Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "Missing X-User-Role / X-User-ID headers" }
  - { id: ERR_FORBIDDEN_ROLE, http: 403, condition: "Acting role not permitted for this operation" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Referenced resource does not exist" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Malformed body, missing required field, or bad type/enum" }
  - { id: ERR_INVALID_REFERENCE, http: 422, condition: "FK body field references a resource of the wrong type or wrong lifecycle" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Resource not in a state from which the requested transition is defined" }
  - { id: ERR_STALE_COHORT_VERSION, http: 412, condition: "expected_cohort_version does not match current Cohort.version (OCC)" }
  - { id: ERR_PRICING_INCOMPLETE, http: 422, condition: "Pricing fields missing for chosen pricing_model on submit" }
  - { id: ERR_PROGRAM_RETIRED, http: 409, condition: "Cannot approve a version of a RETIRED program" }
  - { id: ERR_VERSION_NOT_APPROVED, http: 409, condition: "Cohort references a ProgramVersion that is not APPROVED" }
  - { id: ERR_FACILITATOR_NOT_CERTIFIED, http: 409, condition: "Lead facilitator suspended or not certified for the program category" }
  - { id: ERR_DELIVERY_MODE_MISMATCH, http: 409, condition: "Cohort delivery_mode incompatible with program delivery_mode" }
  - { id: ERR_ENROLL_WINDOW_CLOSED, http: 409, condition: "Operation attempted after enroll_deadline (open/enroll)" }
  - { id: ERR_BEFORE_START, http: 409, condition: "Cohort start attempted before clock reaches starts_at" }
  - { id: ERR_BEFORE_END, http: 409, condition: "Cohort deliver attempted before clock reaches ends_at" }
  - { id: ERR_COHORT_FULL, http: 409, condition: "No free seats for a new ENROLLED registration" }
  - { id: ERR_WAITLIST_FULL, http: 409, condition: "Seats full and waitlist at capacity" }
  - { id: ERR_DUPLICATE_REGISTRATION, http: 409, condition: "learner_email already registered (non-terminal) in this cohort" }
  - { id: ERR_COHORT_NOT_OPEN, http: 409, condition: "Confirm/withdraw attempted while cohort not OPEN" }
  - { id: ERR_COHORT_NOT_RUNNING, http: 409, condition: "Attendance mark attempted while cohort not RUNNING/DELIVERED" }
  - { id: ERR_MIN_SEATS_NOT_MET, http: 409, condition: "Lock attempted with seats_confirmed < min_seats" }
  - { id: ERR_SESSION_OUT_OF_RANGE, http: 422, condition: "Session interval not within cohort window" }
  - { id: ERR_ROOM_CONFLICT, http: 409, condition: "Two same-room sessions overlap or abut (closed interval)" }
  - { id: ERR_FACILITATOR_DOUBLE_BOOKED, http: 409, condition: "Facilitator assignments overlap (half-open interval)" }
  - { id: ERR_NOT_ELIGIBLE_FOR_CERTIFICATE, http: 409, condition: "Registration not ATTENDED or assessment outcome not PASS" }
  - { id: ERR_CERTIFICATE_STILL_VALID, http: 409, condition: "Revoke attempted while registration ATTENDED and assessment not VOIDED" }
  - { id: ERR_CONTRACT_BUDGET_EXCEEDED, http: 409, condition: "FINAL draw exceeds contract remaining_cents" }
  - { id: ERR_CONTRACT_HAS_OPEN_COHORTS, http: 409, condition: "Contract close blocked by an active cohort" }
  - { id: ERR_EVALUATION_NOT_ALLOWED, http: 409, condition: "Evaluation submitted by ineligible registration/cohort state" }

# =============================================================================
# Table 1.7: RBAC Matrix
# =============================================================================
roles:
  - name: ProgramDesigner
    description: "Owns catalog/custom program design and version lifecycle; issues/revokes certificates."
    identity: "opaque"
    exclusive_operations:
      - "POST /training/programs — create program"
      - "POST /training/programs/{id}/retire — retire program"
      - "POST /training/program-versions — create version"
      - "POST /training/program-versions/{id}/submit — submit version"
      - "POST /training/program-versions/{id}/request-changes — revision loop"
      - "POST /training/program-versions/{id}/approve — approve version"
      - "POST /training/certificates/{id}/revoke — revoke certificate"
    shared_operations:
      - "POST /training/registrations/{id}/certificate — issue certificate (with SchedulingCoordinator)"
      - "POST /training/assessments/{id}/void — void assessment (with Facilitator)"
      - "GET endpoints — read access"

  - name: SchedulingCoordinator
    description: "Owns facilitators, cohort scheduling/lifecycle, sessions, assignments, registrations on behalf of learners."
    identity: "opaque"
    exclusive_operations:
      - "POST /training/facilitators — create facilitator"
      - "POST /training/facilitators/{id}/suspend — suspend facilitator"
      - "POST /training/cohorts — schedule cohort"
      - "POST /training/cohorts/{id}/open — open cohort"
      - "POST /training/cohorts/{id}/lock — lock cohort (OCC)"
      - "POST /training/cohorts/{id}/start — start cohort"
      - "POST /training/cohorts/{id}/deliver — deliver cohort"
      - "POST /training/cohorts/{id}/close — close cohort"
      - "POST /training/cohorts/{id}/cancel — cancel cohort"
      - "POST /training/cohorts/{id}/sessions — add session"
      - "POST /training/sessions/{id}/assignments — assign facilitator"
    shared_operations:
      - "POST /training/cohorts/{id}/registrations — register learner (with Learner)"
      - "POST /training/registrations/{id}/withdraw — withdraw (with Learner)"
      - "POST /training/registrations/{id}/certificate — issue certificate (with ProgramDesigner)"
      - "GET endpoints — read access"

  - name: Facilitator
    description: "Delivers sessions; marks attendance; grades assessments."
    identity: "entity_backed:Facilitator"
    exclusive_operations:
      - "POST /training/registrations/{id}/mark-attendance — mark attendance"
      - "POST /training/registrations/{id}/assessments — grade learner"
    shared_operations:
      - "POST /training/assessments/{id}/void — void assessment (with ProgramDesigner)"
      - "GET endpoints — read access"

  - name: Learner
    description: "Registers for cohorts, confirms/withdraws own seat, submits evaluations."
    identity: "opaque"
    exclusive_operations:
      - "POST /training/registrations/{id}/confirm — confirm seat"
      - "POST /training/registrations/{id}/evaluation — submit NPS evaluation"
    shared_operations:
      - "POST /training/cohorts/{id}/registrations — register (with SchedulingCoordinator)"
      - "POST /training/registrations/{id}/withdraw — withdraw (with SchedulingCoordinator)"
      - "GET endpoints — read own registration/cohort/certificate"

  - name: FinanceManager
    description: "Owns enterprise contracts and invoice visibility."
    identity: "opaque"
    exclusive_operations:
      - "POST /training/contracts — create contract"
      - "POST /training/contracts/{id}/close — close contract"
    shared_operations:
      - "GET endpoints — read access (contracts, invoices, cohorts)"
