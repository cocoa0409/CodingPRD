  # ===========================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: medicare_sixty_day_window_day60_on_time_versus_day61_late
        grounds:
          - calculations.medicare_repayment_deadline
          - state_machines.MedicareRepaymentObligation.OPEN_to_REPORTED
          - state_machines.MedicareRepaymentObligation.LATE_to_REPORTED_LATE
          - entities.MedicareRepaymentObligation.fields.penalty_cents
        distinguishing_aspect: |
          Boundary metric 1 — a numeric day-count threshold crossed on the
          POST /medicare-obligations/{obligationId}/report endpoint: reporting at
          exactly 60 whole days (2026-10-14) is on time and lands in REPORTED with
          penalty_cents 0, while reporting at 61 whole days (2026-10-15) lands in
          REPORTED_LATE with days_late 1 and penalty_cents 240.
        test_recipe:
          setup:
            - "A MEDICARE payer and two accounts MB1 and MB2, each charged +50000 on 2026-08-01 and paid -62000 by the PAYER on 2026-08-05."
            - "A single sweep on 2026-08-15 identified a 12000-cent credit on each; both were attributed PROPORTIONAL to payer_portion_cents 12000, creating two MedicareRepaymentObligation rows with reportable_amount_cents 12000, identified_at 2026-08-15 and due_at 2026-10-14, both in state OPEN."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: SystemAdmin
              as_user_id: "sysadmin-1"
