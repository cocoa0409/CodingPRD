          trigger:
            - call: "POST /verifications/${v1_id}/opine"
              payload: { opinion: "POSITIVE", restated_removals_t: 300.000, findings_note: "restated upward" }
              as: Verifier
              as_user_id: "${vb1_id}"
              captures: { blocked_error: $.data.error_id }
            - call: "POST /verifications/${v1_id}/opine"
              payload: { opinion: "QUALIFIED", restated_removals_t: 400.000, findings_note: "material rework needed" }
              as: Verifier
              as_user_id: "${vb1_id}"
            - call: "POST /verifications/${v1_id}/resample"
              payload: { sample_pct: 15.00, site_visit_start: "2026-08-01T00:00:00Z", site_visit_end: "2026-08-03T00:00:00Z" }
              as: Verifier
              as_user_id: "${vb1_id}"
            - call: "POST /verifications/${v1_id}/opine"
              payload: { opinion: "POSITIVE", restated_removals_t: 297.528 }
              as: Verifier
              as_user_id: "${vb1_id}"
            - call: "GET /quantification-runs/${r1_id}"
              payload: {}
              as: ProgramAdmin
          assert:
            - "the run frozen in setup reports net_removals_t == 283.360"
            - "opine 1 (POSITIVE, 300.000): HTTP 409 with error_id ERR_MATERIAL_DISCREPANCY_EXCEEDED — 100 * |300.000 - 283.360| / 283.360 rounds to 5.87 which exceeds MATERIAL_DISCREPANCY_MAX_PCT 5.00; the verification stays PENDING"
            - "opine 2 (QUALIFIED, 400.000): HTTP 200, data.opinion == \"QUALIFIED\", data.material_discrepancy_pct == 41.16 — an 8x-larger discrepancy is accepted because the gate applies to POSITIVE only"
            - "the run is still \"SUBMITTED\" after the QUALIFIED opinion (SUBMITTED self-loop), not REJECTED"
            - "resample: HTTP 200, data.opinion == \"PENDING\", data.sample_pct == 15.00, data.material_discrepancy_pct is reset for the new pass"
            - "opine 3 (POSITIVE, 297.528): HTTP 200, data.material_discrepancy_pct == 5.00 and the opinion is accepted — the threshold is inclusive at exactly 5.00"
            - "the final run read reports status == \"VERIFIED\""

      - name: baseline_variant_divergence_on_identical_history
        claim_type: variant_divergence
        grounds:
          - calculations.baseline_establishment.variants
        excluded_because:
          difficulty_instance: dual_variant_calc / baseline_historical_vs_modeled_divergence
          rationale: "The named §1.8 instance proposes both baseline variants over one history set and asserts the tonnage and uncertainty delta between them."

      - name: quantification_variant_divergence_on_identical_packets
        claim_type: variant_divergence
        grounds:
          - calculations.net_removals_quantification.variants
        excluded_because:
          difficulty_instance: dual_variant_calc / quantification_model_vs_measurement_divergence
          rationale: "The named §1.8 instance runs MODEL and MEASUREMENT over the same PASSED packet set, including the FARM_RECORD drop-out and the sampling curve."

      - name: additionality_weighted_score_terms
        claim_type: correct_result
        grounds:
          - calculations.additionality_screening.formula
        excluded_because:
          difficulty_instance: combinatorial_formula / additionality_score_four_term_combination
          rationale: "The named §1.8 instance combines all four score terms (prior-adoption penalty, telemetry gap, documented-year credit, clamp) in one screening."

      - name: per_acre_band_rounding_order
        claim_type: correct_result
        grounds:
          - calculations.grower_payment_amount.variants
        excluded_because:
          difficulty_instance: combinatorial_formula / per_acre_payment_three_band_pinned_rounding
          rationale: "The named §1.8 instance asserts the per-band round-then-sum order across all three acreage bands plus the holdback."

      - name: issuance_split_evaluation_order
        claim_type: constants_applied
        grounds:
          - calculations.credit_issuance_split.formula
        excluded_because:
          difficulty_instance: combinatorial_formula / issuance_split_pinned_evaluation_order
          rationale: "The named §1.8 instance pins the six-step order, the tier basis read, the ceil-then-subtract invariant and the serial allocation."

      - name: exit_fee_decay_against_settled_payments
        claim_type: correct_result
        grounds:
          - calculations.contract_exit_fee
        excluded_because:
          difficulty_instance: compensating_invariant / termination_conserves_acres_and_cents_across_void_and_exit_fee
          rationale: "The named §1.8 instance drives a mid-commitment termination and asserts the decayed exit fee against the PAID-only settled base."

      - name: reversal_waterfall_buffer_then_grower
        claim_type: correct_result
        grounds:
          - calculations.reversal_assessment
        excluded_because:
          difficulty_instance: transitive_cascade / reversal_assessment_seven_hop_cascade
          rationale: "The named §1.8 instance asserts affected_credits, the buffer draw, the unbacked remainder and the clawback cents of the reversal waterfall."

