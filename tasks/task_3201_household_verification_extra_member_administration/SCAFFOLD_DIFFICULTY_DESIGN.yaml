              as: AccountOwner
              as_user_id: "${owner_id}"
            - call: "POST /hv/members/${owner_id}/downloads"
              payload: { device_id: "${dev_id}", title_id: "t3" }
              as: AccountOwner
              as_user_id: "${owner_id}"
            - call: "POST /hv/members/${owner_id}/downloads"
              payload: { device_id: "${dev_id}", title_id: "t4" }
              as: AccountOwner
              as_user_id: "${owner_id}"
            - call: "POST /hv/members/${owner_id}/downloads"
