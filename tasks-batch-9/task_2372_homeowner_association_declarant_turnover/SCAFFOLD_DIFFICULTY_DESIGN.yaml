      - name: settlement_depends_on_issued_clean_audit_then_locks_the_association
        grounds:
          - state_machines.TurnoverCase.AUDIT_IN_PROGRESS_to_SETTLED
          - state_machines.AuditEngagement.ENGAGED_to_ISSUED
          - entities.AuditEngagement.fields.finding_status
          - entities.TurnoverCase.fields.turnover_posture
          - calculations.turnover_posture_derivation
          - validations[priority=8]
          - errors.ERR_SETTLEMENT_BLOCKED
          - errors.ERR_TURNOVER_SETTLED_LOCKED
        distinguishing_aspect: |
          Settlement of the TurnoverCase is gated on a *sibling* entity reaching a specific state and
          finding: with the governance dimension already at OWNER_CONTROL and the audit merely ENGAGED,
          the advance is refused with ERR_SETTLEMENT_BLOCKED; issuing the report (delta 0, so CLEAN)
          unblocks the identical call, whose success then flips turnover_posture to SETTLED_LOCKED and
          makes an unrelated third entity's creation fail with ERR_TURNOVER_SETTLED_LOCKED.
        test_recipe:
          setup:
            - "Association 'Stonegate' with fixed_turnover_date 2026-07-01T00:00:00Z, already reached at the default clock 2026-08-01T00:00:00Z."
            - "TurnoverCase with total_seats 3, so owner_elected_seats_required is ceil(3*2/3) = 2."
            - "No RecordsTransferItems, so records_transfer_completeness_pct stays at its 100.00 default; no AMENITY components; no VendorContracts; no DefectClaims; no SubsidyEntries, so the audited delta will be exactly 0."
            - "One AuditEngagement in ENGAGED over 2026-01-01..2026-06-30, created by auditor-9."
          setup_api_calls:
            - call: "POST /hoa/associations"
              payload: { name: "Stonegate", total_planned_lots: 12, turnover_threshold_pct: 66.67, fixed_turnover_date: "2026-07-01T00:00:00Z", statute_of_repose_years: 8, reserve_pool_cents: 600000, reserve_claim_pool_cents: 800000, declarant_monthly_subsidy_cents: 60000 }
              as: PlatformAdmin
              captures: { assoc_id: $.data.id }
            - call: "POST /hoa/turnover-cases"
              payload: { association_id: "${assoc_id}", total_seats: 3 }
              as: PlatformAdmin
              captures: { case_id: $.data.id }
            - call: "POST /hoa/audit-engagements"
              payload: { association_id: "${assoc_id}", period_start: "2026-01-01T00:00:00Z", period_end: "2026-06-30T00:00:00Z" }
              as: Auditor
              as_user_id: "auditor-9"
              captures: { eng_id: $.data.id }
            - call: "POST /hoa/turnover-cases/${case_id}/certify-trigger"
              payload: { trigger_basis: "FIXED_DATE" }
              as: TransitionCommittee
              as_user_id: "${assoc_id}"
            - call: "POST /hoa/directors"
              payload: { turnover_case_id: "${case_id}", full_name: "Ana Ruiz", seat_type: "OWNER_ELECTED" }
              as: ElectionInspector
              as_user_id: "inspector-1"
            - call: "POST /hoa/directors"
              payload: { turnover_case_id: "${case_id}", full_name: "Bo Nakamura", seat_type: "OWNER_ELECTED" }
              as: ElectionInspector
              as_user_id: "inspector-1"
            - call: "POST /hoa/turnover-cases/${case_id}/advance"
              payload: { dimension: "GOVERNANCE" }
              as: TransitionCommittee
              as_user_id: "${assoc_id}"
            - call: "POST /hoa/turnover-cases/${case_id}/advance"
              payload: { dimension: "FINANCIAL", subsidy_end_date: "2026-09-01T00:00:00Z" }
              as: TransitionCommittee
              as_user_id: "${assoc_id}"
          trigger:
            - call: "POST /hoa/turnover-cases/${case_id}/advance"
              payload: { dimension: "FINANCIAL" }
              as: TransitionCommittee
              as_user_id: "${assoc_id}"
              captures: { err_blocked: $.data.error_id }
            - call: "POST /hoa/audit-engagements/${eng_id}/issue"
              payload: {}
              as: Auditor
              as_user_id: "auditor-9"
            - call: "POST /hoa/turnover-cases/${case_id}/advance"
              payload: { dimension: "FINANCIAL" }
              as: TransitionCommittee
              as_user_id: "${assoc_id}"
            - call: "POST /hoa/reserve-studies"
              payload: { association_id: "${assoc_id}", funding_method: "CASH_FLOW", planned_annual_contribution_cents: 500000, projected_annual_expenditure_cents: 100000 }
              as: TransitionCommittee
              as_user_id: "${assoc_id}"
              captures: { err_locked: $.data.error_id }
          assert:
            - "TurnoverCase.${case_id}.owner_elected_seats_required == 2 and governance_status == OWNER_CONTROL before the triggers"
            - "TurnoverCase.${case_id}.financial_status == AUDIT_IN_PROGRESS and turnover_posture == OWNER_CONTROL_OPEN before the triggers"
            - "first trigger call returns 409 with error_id ERR_SETTLEMENT_BLOCKED"
            - "second trigger call returns 200 with AuditEngagement.${eng_id}.status == ISSUED, unreconciled_delta_cents == 0 and finding_status == CLEAN"
            - "third trigger call returns 200 with TurnoverCase.${case_id}.financial_status == SETTLED"
            - "TurnoverCase.${case_id}.turnover_posture == SETTLED_LOCKED"
            - "fourth trigger call returns 409 with error_id ERR_TURNOVER_SETTLED_LOCKED"

  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:

      - name: audit_periods_collide_as_closed_intervals_when_endpoints_touch
        grounds:
          - validations[priority=12]
          - errors.ERR_AUDIT_PERIOD_OVERLAP
          - entities.AuditEngagement.fields.period_start
          - entities.AuditEngagement.fields.period_end
          - endpoints[POST /hoa/audit-engagements]
        distinguishing_aspect: |
          Audit periods are compared as CLOSED intervals, so a single shared endpoint day is a collision:
          against an existing engagement 2026-01-01..2026-03-31, a new engagement starting exactly
          2026-03-31 must be refused with ERR_AUDIT_PERIOD_OVERLAP, while starting one day later at
          2026-04-01 must be accepted. A half-open implementation admits the touching period; a
          fully-inclusive-plus-one implementation wrongly rejects the adjacent one.
        test_recipe:
          setup:
            - "Association 'Thornwood'."
            - "One ENGAGED AuditEngagement over 2026-01-01T00:00:00Z..2026-03-31T00:00:00Z."
          setup_api_calls:
            - call: "POST /hoa/associations"
              payload: { name: "Thornwood", total_planned_lots: 16, turnover_threshold_pct: 66.67, fixed_turnover_date: "2027-03-01T00:00:00Z", statute_of_repose_years: 8, reserve_pool_cents: 100000, reserve_claim_pool_cents: 300000, declarant_monthly_subsidy_cents: 25000 }
              as: PlatformAdmin
              captures: { assoc_id: $.data.id }
            - call: "POST /hoa/audit-engagements"
              payload: { association_id: "${assoc_id}", period_start: "2026-01-01T00:00:00Z", period_end: "2026-03-31T00:00:00Z" }
              as: Auditor
              as_user_id: "auditor-9"
              captures: { eng_q1_id: $.data.id }
          trigger:
            - call: "POST /hoa/audit-engagements"
              payload: { association_id: "${assoc_id}", period_start: "2026-03-31T00:00:00Z", period_end: "2026-06-30T00:00:00Z" }
              as: Auditor
              as_user_id: "auditor-9"
              captures: { err_overlap: $.data.error_id }
            - call: "POST /hoa/audit-engagements"
              payload: { association_id: "${assoc_id}", period_start: "2026-04-01T00:00:00Z", period_end: "2026-06-30T00:00:00Z" }
              as: Auditor
              as_user_id: "auditor-9"
              captures: { eng_q2_id: $.data.id }
            - call: "POST /hoa/audit-engagements"
              payload: { association_id: "${assoc_id}", period_start: "2026-06-30T00:00:00Z", period_end: "2026-09-30T00:00:00Z" }
              as: Auditor
              as_user_id: "auditor-9"
              captures: { err_overlap_2: $.data.error_id }
          assert:
            - "first trigger call returns 409 with error_id ERR_AUDIT_PERIOD_OVERLAP because 2026-03-31 is the shared closed endpoint"
            - "second trigger call returns 201 with AuditEngagement.${eng_q2_id}.status == ENGAGED"
            - "third trigger call returns 409 with error_id ERR_AUDIT_PERIOD_OVERLAP, this time against the newly created Q2 engagement"
            - "AuditEngagement.${eng_q1_id}.period_end == 2026-03-31T00:00:00Z, unchanged"
            - "exactly two AuditEngagements exist for the association after all three trigger calls"

      - name: vendor_service_window_conflict_uses_blackout_inflated_end_per_component
        grounds:
          - validations[priority=12]
          - errors.ERR_SERVICE_WINDOW_CONFLICT
          - entities.VendorContract.fields.service_window_start
          - entities.VendorContract.fields.service_window_end
          - endpoints[POST /hoa/vendor-contracts]
        distinguishing_aspect: |
          Vendor windows are half-open [start, end) BUT the incumbent's end is first inflated by
          TRANSITION_BLACKOUT_DAYS = 30: against an incumbent 2026-01-01..2026-04-01 on one component, the
          effective barrier is 2026-05-01, so a new window starting 2026-04-01 (which a naive half-open
          check would accept) must be refused with ERR_SERVICE_WINDOW_CONFLICT, one starting exactly
          2026-05-01 must be accepted, and the refused window must be accepted verbatim on a different
          component — the conflict scope is the component, not the association.
        test_recipe:
          setup:
            - "Association 'Umber Fields' with two CommonAreaComponents, 'Pool Deck' and 'Entry Gate'."
            - "One ACTIVE VendorContract on Pool Deck with service_window_start 2026-01-01T00:00:00Z and service_window_end 2026-04-01T00:00:00Z, so its blackout-inflated end is 2026-05-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /hoa/associations"
              payload: { name: "Umber Fields", total_planned_lots: 20, turnover_threshold_pct: 66.67, fixed_turnover_date: "2027-06-01T00:00:00Z", statute_of_repose_years: 8, reserve_pool_cents: 150000, reserve_claim_pool_cents: 300000, declarant_monthly_subsidy_cents: 28000 }
              as: PlatformAdmin
              captures: { assoc_id: $.data.id }
            - call: "POST /hoa/components"
              payload: { association_id: "${assoc_id}", name: "Pool Deck", category: "AMENITY", replacement_cost_cents: 1500000, useful_life_years: 20, effective_age_years: 2, promised_completion_date: "2027-01-01T00:00:00Z" }
              as: Declarant
              as_user_id: "declarant-1"
              captures: { comp_pool_id: $.data.id }
            - call: "POST /hoa/components"
              payload: { association_id: "${assoc_id}", name: "Entry Gate", category: "INFRASTRUCTURE", replacement_cost_cents: 400000, useful_life_years: 15, effective_age_years: 1, promised_completion_date: "2027-01-01T00:00:00Z" }
              as: Declarant
              as_user_id: "declarant-1"
              captures: { comp_gate_id: $.data.id }
            - call: "POST /hoa/vendor-contracts"
              payload: { association_id: "${assoc_id}", component_id: "${comp_pool_id}", vendor_name: "BlueWave Pools", developer_affiliated: false, annual_cost_cents: 240000, service_window_start: "2026-01-01T00:00:00Z", service_window_end: "2026-04-01T00:00:00Z" }
              as: Declarant
              as_user_id: "declarant-1"
              captures: { contract_incumbent_id: $.data.id }
          trigger:
            - call: "POST /hoa/vendor-contracts"
              payload: { association_id: "${assoc_id}", component_id: "${comp_pool_id}", vendor_name: "Clearwater Service", developer_affiliated: false, annual_cost_cents: 210000, service_window_start: "2026-04-01T00:00:00Z", service_window_end: "2026-08-01T00:00:00Z" }
              as: Declarant
              as_user_id: "declarant-1"
              captures: { err_window: $.data.error_id }
            - call: "POST /hoa/vendor-contracts"
              payload: { association_id: "${assoc_id}", component_id: "${comp_gate_id}", vendor_name: "Clearwater Service", developer_affiliated: false, annual_cost_cents: 210000, service_window_start: "2026-04-01T00:00:00Z", service_window_end: "2026-08-01T00:00:00Z" }
              as: Declarant
              as_user_id: "declarant-1"
              captures: { contract_gate_id: $.data.id }
            - call: "POST /hoa/vendor-contracts"
              payload: { association_id: "${assoc_id}", component_id: "${comp_pool_id}", vendor_name: "Clearwater Service", developer_affiliated: false, annual_cost_cents: 210000, service_window_start: "2026-05-01T00:00:00Z", service_window_end: "2026-09-01T00:00:00Z" }
              as: Declarant
              as_user_id: "declarant-1"
              captures: { contract_after_blackout_id: $.data.id }
          assert:
            - "first trigger call returns 409 with error_id ERR_SERVICE_WINDOW_CONFLICT, because 2026-04-01 falls inside [2026-01-01, 2026-05-01)"
            - "second trigger call returns 201: the identical window is legal on CommonAreaComponent.${comp_gate_id}"
            - "third trigger call returns 201: a start of exactly 2026-05-01 clears the inflated end under the half-open rule"
            - "VendorContract.${contract_incumbent_id}.status == ACTIVE and service_window_end == 2026-04-01T00:00:00Z, never mutated by the inflation"
            - "VendorContract.${contract_after_blackout_id}.status == ACTIVE and assignment_status == NOT_REQUESTED"
            - "exactly three VendorContracts exist for the association"

  # ===========================================================================
  - rule_id: compensating_invariant
    instances:

      - name: claim_reserve_release_conserves_the_association_claim_pool
        grounds:
          - calculations.defect_claim_reserve_amount
          - entities.Association.fields.reserve_claim_pool_cents
          - entities.Association.fields.reserve_claim_committed_cents
          - entities.Association.fields.reserve_claim_available_cents
          - state_machines.DefectClaim.NOTICED_to_RESERVED
          - state_machines.DefectClaim.RESERVED_to_WITHDRAWN
          - validations[priority=15]
          - errors.ERR_CLAIM_RESERVE_INSUFFICIENT
        distinguishing_aspect: |
          reserve_claim_committed_cents + reserve_claim_available_cents must equal
          reserve_claim_pool_cents (3000000) after every single step of a reserve / refuse / release /
          re-reserve sequence. The WITHDRAW compensation must return exactly the 2184000 that was
          committed — fee included, no drift — which is proved by the fact that the same second claim that
          was refused with ERR_CLAIM_RESERVE_INSUFFICIENT for want of 136000 succeeds unchanged
          afterwards, and by the pool landing back on 3000000 to the cent.
        test_recipe:
          setup:
            - "Association 'Vellum Commons' with reserve_claim_pool_cents = 3000000."
            - "One CONVEYED CommonAreaComponent, substantial_completion_date 2024-02-01T00:00:00Z, so both claims carry repose_deadline 2032-02-01T00:00:00Z."
            - "Two DefectClaims, both driven to NOTICED: claim A with repair_cost_estimate_cents 1950000 and claim B with 850000."
          setup_api_calls:
            - call: "POST /hoa/associations"
              payload: { name: "Vellum Commons", total_planned_lots: 24, turnover_threshold_pct: 66.67, fixed_turnover_date: "2027-04-01T00:00:00Z", statute_of_repose_years: 8, reserve_pool_cents: 200000, reserve_claim_pool_cents: 3000000, declarant_monthly_subsidy_cents: 42000 }
              as: PlatformAdmin
              captures: { assoc_id: $.data.id }
            - call: "POST /hoa/components"
              payload: { association_id: "${assoc_id}", name: "Retaining Wall", category: "STRUCTURE", replacement_cost_cents: 2600000, useful_life_years: 30, effective_age_years: 2, promised_completion_date: "2024-02-01T00:00:00Z" }
              as: Declarant
              as_user_id: "declarant-1"
              captures: { comp_id: $.data.id }
            - call: "POST /hoa/components/${comp_id}/milestones"
              payload: { milestone: "BUILD_COMPLETE", effective_date: "2024-02-01T00:00:00Z" }
              as: Declarant
              as_user_id: "declarant-1"
            - call: "POST /hoa/components/${comp_id}/milestones"
              payload: { milestone: "DEED_TENDERED" }
              as: Declarant
              as_user_id: "declarant-1"
            - call: "POST /hoa/components/${comp_id}/milestones"
              payload: { milestone: "CONVEYANCE_ACCEPTED" }
              as: TransitionCommittee
              as_user_id: "${assoc_id}"
            - call: "POST /hoa/defect-claims"
              payload: { association_id: "${assoc_id}", component_id: "${comp_id}", defect_summary: "Wall tilt at panel 4", repair_cost_estimate_cents: 1950000, diminution_value_cents: 1100000 }
              as: TransitionCommittee
              as_user_id: "${assoc_id}"
              captures: { claim_a_id: $.data.id }
            - call: "POST /hoa/defect-claims"
              payload: { association_id: "${assoc_id}", component_id: "${comp_id}", defect_summary: "Weep hole blockage", repair_cost_estimate_cents: 850000, diminution_value_cents: 400000 }
              as: TransitionCommittee
              as_user_id: "${assoc_id}"
              captures: { claim_b_id: $.data.id }
            - call: "POST /hoa/defect-claims/${claim_a_id}/actions"
              payload: { action: "NOTICE" }
              as: TransitionCommittee
              as_user_id: "${assoc_id}"
            - call: "POST /hoa/defect-claims/${claim_b_id}/actions"
              payload: { action: "NOTICE" }
              as: TransitionCommittee
              as_user_id: "${assoc_id}"
          trigger:
            - call: "POST /hoa/defect-claims/${claim_a_id}/actions"
              payload: { action: "RESERVE", valuation_basis: "REPAIR_COST" }
              as: TransitionCommittee
              as_user_id: "${assoc_id}"
            - call: "POST /hoa/defect-claims/${claim_b_id}/actions"
              payload: { action: "RESERVE", valuation_basis: "REPAIR_COST" }
              as: TransitionCommittee
              as_user_id: "${assoc_id}"
              captures: { err_insufficient: $.data.error_id }
            - call: "POST /hoa/defect-claims/${claim_a_id}/actions"
              payload: { action: "WITHDRAW" }
              as: TransitionCommittee
              as_user_id: "${assoc_id}"
            - call: "POST /hoa/defect-claims/${claim_b_id}/actions"
              payload: { action: "RESERVE", valuation_basis: "REPAIR_COST" }
              as: TransitionCommittee
              as_user_id: "${assoc_id}"
          assert:
            - "after the first trigger call: DefectClaim.${claim_a_id}.status == RESERVED, reserve_subtotal_cents == 1950000, litigation_admin_fee_cents == 234000, reserved_amount_cents == 2184000"
            - "after the first trigger call: Association.${assoc_id}.reserve_claim_committed_cents == 2184000 and reserve_claim_available_cents == 816000"
            - "second trigger call returns 422 with error_id ERR_CLAIM_RESERVE_INSUFFICIENT, because claim B needs 952000 against 816000 available"
            - "after the second trigger call: Association.${assoc_id}.reserve_claim_committed_cents == 2184000, unchanged by the refusal"
            - "after the third trigger call: DefectClaim.${claim_a_id}.status == WITHDRAWN and reserved_amount_cents == 0"
            - "after the third trigger call: Association.${assoc_id}.reserve_claim_committed_cents == 0 and reserve_claim_available_cents == 3000000"
            - "fourth trigger call returns 200 with DefectClaim.${claim_b_id}.status == RESERVED, reserve_subtotal_cents == 850000, litigation_admin_fee_cents == 102000, reserved_amount_cents == 952000"
            - "after the fourth trigger call: Association.${assoc_id}.reserve_claim_committed_cents == 952000 and reserve_claim_available_cents == 2048000"
            - "INVARIANT after every one of the four trigger calls: reserve_claim_committed_cents + reserve_claim_available_cents == 3000000"

      - name: board_seat_count_conserved_across_resignation_seating_and_rescission
        grounds:
          - calculations.governance_seat_ledger
          - entities.TurnoverCase.fields.total_seats
          - entities.TurnoverCase.fields.declarant_appointed_seats
          - entities.TurnoverCase.fields.owner_elected_seats
          - entities.TurnoverCase.fields.vacant_seats
          - state_machines.TurnoverCase.ELECTION_CALLED_to_ELECTION_HELD
          - state_machines.TurnoverCase.ELECTION_HELD_to_ELECTION_CALLED
          - state_machines.Director.SEATED_to_RESCINDED
          - validations[priority=14]
          - errors.ERR_SEAT_CAPACITY_EXCEEDED
        distinguishing_aspect: |
          total_seats (5) must always equal the number of SEATED Directors plus vacant_seats — across the
          certify-trigger cascade that resigns both declarant appointees, across five owner-elected
          seatings, across a refused sixth seating, and across two rescissions. The rescissions also prove
          the ledger drives the governance dimension both ways: dropping from 5 to 4 owner-elected seats
          keeps ELECTION_HELD (4 >= 4) while dropping to 3 demotes the case back to ELECTION_CALLED, and
          neither rescission ever changes total_seats.
        test_recipe:
          setup:
            - "Association 'Windrow Estates' with fixed_turnover_date 2026-07-01T00:00:00Z, already reached at the default clock 2026-08-01T00:00:00Z."
            - "TurnoverCase with total_seats 5, so owner_elected_seats_required is ceil(5*2/3) = 4."
            - "Two DECLARANT_APPOINTED Directors seated before the trigger is certified."
            - "certify-trigger on the FIXED_DATE basis, whose cascade resigns both declarant appointees and leaves all 5 seats vacant."
          setup_api_calls:
            - call: "POST /hoa/associations"
              payload: { name: "Windrow Estates", total_planned_lots: 15, turnover_threshold_pct: 66.67, fixed_turnover_date: "2026-07-01T00:00:00Z", statute_of_repose_years: 8, reserve_pool_cents: 90000, reserve_claim_pool_cents: 200000, declarant_monthly_subsidy_cents: 33000 }
              as: PlatformAdmin
              captures: { assoc_id: $.data.id }
            - call: "POST /hoa/turnover-cases"
              payload: { association_id: "${assoc_id}", total_seats: 5 }
              as: PlatformAdmin
              captures: { case_id: $.data.id }
            - call: "POST /hoa/directors"
              payload: { turnover_case_id: "${case_id}", full_name: "Dana Vogel", seat_type: "DECLARANT_APPOINTED" }
              as: Declarant
              as_user_id: "declarant-1"
              captures: { dir_dec_1_id: $.data.id }
            - call: "POST /hoa/directors"
              payload: { turnover_case_id: "${case_id}", full_name: "Eli Prasad", seat_type: "DECLARANT_APPOINTED" }
              as: Declarant
              as_user_id: "declarant-1"
              captures: { dir_dec_2_id: $.data.id }
            - call: "POST /hoa/turnover-cases/${case_id}/certify-trigger"
              payload: { trigger_basis: "FIXED_DATE" }
              as: TransitionCommittee
              as_user_id: "${assoc_id}"
          trigger:
            - call: "POST /hoa/directors"
              payload: { turnover_case_id: "${case_id}", full_name: "Fay Oduya", seat_type: "OWNER_ELECTED" }
              as: ElectionInspector
              as_user_id: "inspector-1"
              captures: { dir_own_1_id: $.data.id }
            - call: "POST /hoa/directors"
              payload: { turnover_case_id: "${case_id}", full_name: "Gil Marchetti", seat_type: "OWNER_ELECTED" }
              as: ElectionInspector
              as_user_id: "inspector-1"
              captures: { dir_own_2_id: $.data.id }
            - call: "POST /hoa/directors"
              payload: { turnover_case_id: "${case_id}", full_name: "Hana Iwu", seat_type: "OWNER_ELECTED" }
              as: ElectionInspector
              as_user_id: "inspector-1"
              captures: { dir_own_3_id: $.data.id }
            - call: "POST /hoa/directors"
              payload: { turnover_case_id: "${case_id}", full_name: "Ivo Salcedo", seat_type: "OWNER_ELECTED" }
              as: ElectionInspector
              as_user_id: "inspector-1"
              captures: { dir_own_4_id: $.data.id }
            - call: "POST /hoa/directors"
              payload: { turnover_case_id: "${case_id}", full_name: "Jo Renwick", seat_type: "OWNER_ELECTED" }
              as: ElectionInspector
              as_user_id: "inspector-1"
              captures: { dir_own_5_id: $.data.id }
            - call: "POST /hoa/directors"
              payload: { turnover_case_id: "${case_id}", full_name: "Kip Halloran", seat_type: "OWNER_ELECTED" }
              as: ElectionInspector
              as_user_id: "inspector-1"
              captures: { err_capacity: $.data.error_id }
            - call: "POST /hoa/directors/${dir_own_5_id}/rescind"
              payload: {}
              as: ElectionInspector
              as_user_id: "inspector-1"
            - call: "POST /hoa/directors/${dir_own_4_id}/rescind"
              payload: {}
              as: ElectionInspector
              as_user_id: "inspector-1"
          assert:
            - "after setup: Director.${dir_dec_1_id}.status == RESIGNED and Director.${dir_dec_2_id}.status == RESIGNED, both with vacated_at == 2026-08-01T00:00:00Z"
            - "after setup: TurnoverCase.${case_id}.declarant_appointed_seats == 0, owner_elected_seats == 0, vacant_seats == 5, owner_elected_seats_required == 4, governance_status == ELECTION_CALLED"
            - "after the third trigger call: owner_elected_seats == 3, vacant_seats == 2, governance_status still ELECTION_CALLED"
            - "after the fourth trigger call: owner_elected_seats == 4, vacant_seats == 1, governance_status == ELECTION_HELD"
            - "after the fifth trigger call: owner_elected_seats == 5, vacant_seats == 0, governance_status still ELECTION_HELD"
            - "sixth trigger call returns 422 with error_id ERR_SEAT_CAPACITY_EXCEEDED and creates no Director"
            - "after the seventh trigger call: Director.${dir_own_5_id}.status == RESCINDED, owner_elected_seats == 4, vacant_seats == 1, governance_status still ELECTION_HELD"
            - "after the eighth trigger call: Director.${dir_own_4_id}.status == RESCINDED, owner_elected_seats == 3, vacant_seats == 2, governance_status demoted back to ELECTION_CALLED"
            - "TurnoverCase.${case_id}.total_seats == 5 at every step"
            - "INVARIANT after every trigger call: total_seats == count(Director WHERE status == SEATED) + vacant_seats"
