                  - {site_contact_id: "${c2}", attempted_at: "2026-02-10T05:03:00Z", outcome: "ANSWERED_UNVERIFIED"}
                audio_video_evidence: false
                guard_on_scene: false
                occurred_at: "2026-02-10T05:00:00Z"
                idempotency_key: "roll-2507-4"
