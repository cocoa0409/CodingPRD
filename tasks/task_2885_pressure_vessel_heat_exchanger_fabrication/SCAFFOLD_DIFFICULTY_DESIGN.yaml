              payload: {}
              as: QCInspector
              as_user_id: "${qc1_id}"
              captures: { ex2_id: "$.data[0].id" }
            - call: "POST /nde-exams/${ex2_id}/result"
              payload: { result: "ACCEPT", examined_coverage_pct: 100, indications_count: 0, exam_date: "2026-08-01" }
              as: QCInspector
              as_user_id: "${qc1_id}"
            - call: "GET /vessel-jobs/${job_id}"
              payload: {}
              as: ShopAdmin
              captures: { count_before_close: $.data.nonconformance_open_count, pct_before_close: $.data.weld_completion_pct }
