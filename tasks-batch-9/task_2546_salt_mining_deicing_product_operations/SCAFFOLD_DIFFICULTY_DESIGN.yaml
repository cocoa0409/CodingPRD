      - name: contract_state_outranks_take_band_fiscal_check_on_order_create
        grounds:
          - validations[priority=11]
          - validations[priority=37]
          - calculations.contract_fulfillment_ledger
          - state_machines.BidContract.SUBMITTED_to_AWARDED
          - concurrency_rules[delivery-order-create-stale-contract]
        distinguishing_aspect: |
          A DIFFERENT category pair on a different endpoint: state (priority 11,
          ERR_CONTRACT_INVALID_STATE) versus business_fiscal (priority 37, ERR_TAKE_BAND_EXCEEDED) on
          POST /salt/delivery-orders — the contract is AWARDED rather than ACTIVE and the request also
          asks for 9000 t against a 5500.00 t take-band ceiling, and the state row's error is returned.
        test_recipe:
          setup:
            - "Clock at 2026-08-10T00:00:00Z."
            - "Depot A (NY, OPEN)."
            - "Contract with City of Buffalo AWARDED but never activated: committed 5000 t at 68.55/t, min_take 80, max_take 110, so the take-band ceiling is 5500.00 t."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T00:00:00Z" }
              as: ContractAdministrator
            - call: "POST /salt/depots"
              payload: { name: "Depot A", state_code: "NY", covered_capacity_tons: 40000, open_pad_capacity_tons: 20000, loadout_rate_tons_per_hour: 500, outbound_freight_rate_per_ton: 4.00 }
              as: LogisticsPlanner
