      - name: wire_lot_listing_stays_consistent_while_statuses_change
        claim_type: pagination_with_filtering
        grounds:
          - endpoints[GET /wire-lots]
          - complexity_layers.pagination_with_filtering
        distinguishing_aspect: >
          The status filter is evaluated at request time, not cached: three DRAWN lots on one heat report
          total_count 3, and after one is released the same query reports 2 while status=RELEASED reports 1
          — with limit 2 / offset 2 returning a single trailing row and has_more false against the
          unfiltered heat query.
        test_recipe:
          setup:
            - "Heat H-77410 VERIFIED with three wire lots W-1, W-2, W-3 (all DRAWN, 200.0 kg each) and heat H-77411 with one wire lot W-4."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T06:00:00Z" }
              as: ProcessEngineer
            - call: "POST /steel-heats"
              payload: { heat_number: "H-77410", mill_code: "MC-A", grade: "SAE_10B21", carbon_pct: 0.21, boron_ppm: 25, gross_mass_kg: 600.0, mill_cert_serial: "MC-2026-000481" }
