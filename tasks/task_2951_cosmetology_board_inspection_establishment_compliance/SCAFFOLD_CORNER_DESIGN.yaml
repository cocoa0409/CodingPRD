      - name: state_machine_hazard_declaration_closes_the_establishment_and_clearance_restores_active
        claim_type: cyclic
        grounds:
          - state_machines.Establishment.license_status.ACTIVE_to_CLOSED_IMMINENT_HAZARD
          - state_machines.Establishment.license_status.CLOSED_IMMINENT_HAZARD_to_ACTIVE
