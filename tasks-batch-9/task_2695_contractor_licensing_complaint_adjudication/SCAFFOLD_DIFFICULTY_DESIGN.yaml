              captures: { cmp_cv_id: $.data.id }
            - call: "POST /licensing/complaints/${cmp_cv_id}/screen"
              payload: { jurisdiction_finding: "ACCEPTED" }
              as: LicensingAnalyst
            - call: "POST /licensing/recovery-fund-claims"
              payload: { fund_account_id: "${fund_id}", complaint_id: "${cmp_cv_id}", basis: "COURT_JUDGMENT", claimed_amount_cents: 900000, judgment_amount_cents: 1000000, judgment_docket_number: "CV-2026-4412", judgment_entered_on: "2026-05-01" }
              as: Consumer
              as_user_id: "${con_cv_id}"
              captures: { clm_cv_id: $.data.id }
            - call: "POST /licensing/recovery-fund-claims/${clm_cv_id}/adjudicate"
              payload: { outcome: "APPROVE" }
              as: FundAdjudicator
              captures: { clm_cv_award: $.data.awarded_amount_cents }
            - call: "GET /licensing/recovery-fund-accounts/${fund_id}"
              payload: {}
              as: BoardAdmin
              captures: { fund_ver: $.data.version }
          trigger:
            - call: "POST /licensing/recovery-fund-claims/${clm_cv_id}/pay"
              payload: { expected_fund_account_version: "${fund_ver}" }
              as: FundAdjudicator
              captures: { clm_cv_paid: $.data.paid_amount_cents }
            - call: "GET /licensing/recovery-fund-accounts/${fund_id}"
              payload: {}
              as: BoardAdmin
              captures: { bal_after_payout: $.data.balance_cents }
            - call: "GET /licensing/licenses/${lc_cv_id}"
              payload: {}
              as: LicensingAnalyst
              captures: { debt_after_payout: $.data.outstanding_recovery_repayment_cents, ver_1: $.data.version }
            - call: "POST /licensing/licenses/${lc_cv_id}/recovery-repayments"
              payload: { repayment_amount_cents: 400000, expected_license_version: "${ver_1}" }
              as: Licensee
              as_user_id: "${lic_cv_id}"
              captures: { debt_after_first: $.data.outstanding_recovery_repayment_cents, status_after_first: $.data.status }
            - call: "GET /licensing/recovery-fund-accounts/${fund_id}"
              payload: {}
              as: BoardAdmin
              captures: { bal_after_first: $.data.balance_cents }
            - call: "GET /licensing/licenses/${lc_cv_id}"
              payload: {}
              as: LicensingAnalyst
              captures: { ver_2: $.data.version }
            - call: "POST /licensing/licenses/${lc_cv_id}/recovery-repayments"
              payload: { repayment_amount_cents: 500000, expected_license_version: "${ver_2}" }
              as: Licensee
              as_user_id: "${lic_cv_id}"
              captures: { debt_after_second: $.data.outstanding_recovery_repayment_cents, status_after_second: $.data.status, odometer: $.data.recovery_paid_to_date_cents }
            - call: "GET /licensing/recovery-fund-accounts/${fund_id}"
              payload: {}
              as: BoardAdmin
              captures: { bal_after_second: $.data.balance_cents }
          assert:
            - "${clm_cv_award} == 900000"
            - "${clm_cv_paid} == 900000"
            - "${bal_after_payout} == 4100000"
            - "${debt_after_payout} == 900000"
            - "${bal_after_payout} + ${debt_after_payout} == 5000000"
            - "${bal_after_first} == 4500000"
            - "${debt_after_first} == 500000"
            - "${bal_after_first} + ${debt_after_first} == 5000000"
            - "${status_after_first} == SUSPENDED"
            - "${bal_after_second} == 5000000"
            - "${debt_after_second} == 0"
            - "${bal_after_second} + ${debt_after_second} == 5000000"
            - "${status_after_second} == ACTIVE"
            - "${odometer} == 900000"
            - "RecoveryFundClaim.${clm_cv_id}.status == REIMBURSED"
            - "RecoveryFundClaim.${clm_cv_id}.repaid_amount_cents == 900000"
            - "License.${lc_cv_id}.suspension_reason == null"
            - "License.${lc_cv_id}.compliance_posture == CONDITIONAL"

      - name: qualifier_slot_count_is_conserved_across_a_payout_and_a_full_repayment
        grounds:
          - state_machines.QualifierAssignment.ACTIVE_to_SUSPENDED_BY_LICENSE
          - state_machines.QualifierAssignment.SUSPENDED_BY_LICENSE_to_ACTIVE
          - entities.QualifyingIndividual.fields.active_qualification_count
          - state_machines.License.SUSPENDED_to_ACTIVE
          - endpoints[POST /licensing/recovery-fund-claims/{id}/pay]
        distinguishing_aspect: |
          A different conserved quantity — the DERIVED COUNTER active_qualification_count, which must always
          equal COUNT(QualifierAssignment WHERE status = ACTIVE) for that person: 1 while the licence is live,
          0 while the payout suspension holds the designation in SUSPENDED_BY_LICENSE, and exactly 1 again
          after a single 900000 repayment restores it — no double-increment and no drift, even though the
          counter was decremented by one cascade and re-incremented by a different one.
        test_recipe:
          setup:
            - "a 2027 fund account opening at 5000000 with per_claim_cap 1500000 and per_license_aggregate_cap 2000000"
            - "one C-20 licence whose approval cascade minted a single RESPONSIBLE_MANAGING_EMPLOYEE designation, so its qualifier's active_qualification_count starts at 1"
            - "at clock 2026-09-01 a complaint screens straight to INVESTIGATION and a ripe COURT_JUDGMENT claim for 900000 is APPROVED"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: BoardAdmin
            - call: "POST /licensing/recovery-fund-accounts"
              payload: { fiscal_year: 2027, initial_balance_cents: 5000000, per_claim_cap_cents: 1500000, per_license_aggregate_cap_cents: 2000000 }
              as: BoardAdmin
              captures: { fund_id: $.data.id }
            - call: "POST /licensing/trade-classifications"
              payload: { code: "C-20", name: "HVAC", hazard_tier: 2, min_experience_months: 48, min_net_worth_cents: 250000, required_bond_amount_cents: 1000000, required_ce_hours: 8, renewal_base_fee_cents: 45000, mediation_required: false }
              as: BoardAdmin
              captures: { cls20_id: $.data.id }
            - call: "POST /licensing/licensees"
              payload: { legal_name: "Slot Conserve Air LLC", entity_type: "LLC", contact_email: "slotc@x.test" }
              as: LicensingAnalyst
              captures: { lic_sc_id: $.data.id }
            - call: "POST /licensing/qualifying-individuals"
              payload: { full_name: "Quincy Slot", verified_experience_months: 60 }
              as: LicensingAnalyst
              captures: { qi_sc_id: $.data.id }
            - call: "POST /licensing/qualifying-individuals/${qi_sc_id}/exam-results"
              payload: { exam_type: "LAW_AND_BUSINESS", score: 90, taken_on: "2025-03-01" }
              as: LicensingAnalyst
            - call: "POST /licensing/qualifying-individuals/${qi_sc_id}/exam-results"
              payload: { exam_type: "TRADE", trade_code: "C-20", score: 85, taken_on: "2025-03-01" }
              as: LicensingAnalyst
            - call: "POST /licensing/license-applications"
              payload: { licensee_id: "${lic_sc_id}", classification_id: "${cls20_id}", qualifying_individual_id: "${qi_sc_id}", application_type: "ORIGINAL", declared_net_worth_cents: 400000 }
              as: Licensee
              as_user_id: "${lic_sc_id}"
              captures: { app_sc_id: $.data.id }
            - call: "POST /licensing/license-applications/${app_sc_id}/submit"
              payload: {}
              as: Licensee
              as_user_id: "${lic_sc_id}"
            - call: "POST /licensing/license-applications/${app_sc_id}/decision"
              payload: { outcome: "APPROVED" }
              as: LicensingAnalyst
            - call: "GET /licensing/licenses?application_id=${app_sc_id}"
              payload: {}
              as: LicensingAnalyst
              captures: { lc_sc_id: "$.data[0].id" }
            - call: "GET /licensing/qualifier-assignments?license_id=${lc_sc_id}"
              payload: {}
              as: LicensingAnalyst
              captures: { qa_sc_id: "$.data[0].id" }
            - call: "POST /licensing/consumers"
              payload: { full_name: "Slot Sufferer", contact_email: "slots@home.test", mailing_state: "CA" }
              as: LicensingAnalyst
              captures: { con_sc_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: BoardAdmin
            - call: "POST /licensing/complaints"
              payload: { consumer_id: "${con_sc_id}", license_id: "${lc_sc_id}", alleged_loss_cents: 1000000, contract_date: "2026-02-05", work_completed_on: "2026-03-01", description: "Ductwork paid for and never delivered" }
              as: Consumer
              as_user_id: "${con_sc_id}"
              captures: { cmp_sc_id: $.data.id }
            - call: "POST /licensing/complaints/${cmp_sc_id}/screen"
              payload: { jurisdiction_finding: "ACCEPTED" }
              as: LicensingAnalyst
            - call: "POST /licensing/recovery-fund-claims"
              payload: { fund_account_id: "${fund_id}", complaint_id: "${cmp_sc_id}", basis: "COURT_JUDGMENT", claimed_amount_cents: 900000, judgment_amount_cents: 950000, judgment_docket_number: "CV-2026-5510", judgment_entered_on: "2026-05-01" }
              as: Consumer
              as_user_id: "${con_sc_id}"
              captures: { clm_sc_id: $.data.id }
            - call: "POST /licensing/recovery-fund-claims/${clm_sc_id}/adjudicate"
              payload: { outcome: "APPROVE" }
              as: FundAdjudicator
            - call: "GET /licensing/qualifying-individuals/${qi_sc_id}"
              payload: {}
              as: LicensingAnalyst
              captures: { count_before: $.data.active_qualification_count }
            - call: "GET /licensing/recovery-fund-accounts/${fund_id}"
              payload: {}
              as: BoardAdmin
              captures: { fund_ver: $.data.version }
          trigger:
            - call: "POST /licensing/recovery-fund-claims/${clm_sc_id}/pay"
              payload: { expected_fund_account_version: "${fund_ver}" }
              as: FundAdjudicator
            - call: "GET /licensing/qualifying-individuals/${qi_sc_id}"
              payload: {}
              as: LicensingAnalyst
              captures: { count_suspended: $.data.active_qualification_count }
            - call: "GET /licensing/qualifier-assignments?qualifying_individual_id=${qi_sc_id}&status=ACTIVE"
              payload: {}
              as: LicensingAnalyst
            - call: "GET /licensing/licenses/${lc_sc_id}"
              payload: {}
              as: LicensingAnalyst
              captures: { ver_sc: $.data.version }
            - call: "POST /licensing/licenses/${lc_sc_id}/recovery-repayments"
              payload: { repayment_amount_cents: 900000, expected_license_version: "${ver_sc}" }
              as: Licensee
              as_user_id: "${lic_sc_id}"
              captures: { status_restored: $.data.status }
            - call: "GET /licensing/qualifying-individuals/${qi_sc_id}"
              payload: {}
              as: LicensingAnalyst
              captures: { count_restored: $.data.active_qualification_count }
          assert:
            - "${count_before} == 1"
            - "${count_suspended} == 0"
            - "trigger call 3 response data is an empty list, so COUNT(ACTIVE assignments) == 0 matches active_qualification_count 0"
            - "${status_restored} == ACTIVE"
            - "${count_restored} == 1"
            - "QualifierAssignment.${qa_sc_id}.status == ACTIVE"
            - "QualifierAssignment.${qa_sc_id}.withdrawn_on == null"
            - "License.${lc_sc_id}.outstanding_recovery_repayment_cents == 0"
            - "License.${lc_sc_id}.recovery_paid_to_date_cents == 900000"
            - "RecoveryFundClaim.${clm_sc_id}.status == REIMBURSED"
            - "RecoveryFundAccount.${fund_id}.balance_cents == 5000000"
