  - section: endpoints
    instances:
      - name: census_day_patch_updates_count_and_reverts_validated_parent
        claim_type: standard_crud
        grounds:
          - endpoints[PATCH /census-days/{id}]
          - state_machines.CensusDay
        distinguishing_aspect: "PATCH recomputes variance_pct and re-runs the parent rollup but is not a reconcile trigger, so an already RECONCILED day keeps its status while carrying a variance of 0.2000, and only a fresh reconcile flips it to DISPUTED."
        test_recipe:
          setup:
            - "A VALIDATED 2026Q2 submission with one RECONCILED census day at resident_count 5 / mds 5 and one payroll-supported 8.00-hour RN shift"
          setup_api_calls:
            - *k_fac
            - *k_per
            - *k_jc_rn
            - *k_jc_split
            - *k_jc_admin
            - *k_w_coord
            - *k_w_admin
            - *k_w_rn
            - *k_sub
            - *k_pr_0401
            - *k_entry_0401
            - *k_census_0401
            - *k_reconcile_c1
            - *k_verify_e1
            - *k_validate
            - call: "GET /submissions/${sub}"
              payload: {}
              as: StaffingCoordinator
              as_user_id: "${w_coord}"
              captures: { pv: $.data.version }
          trigger:
            - call: "PATCH /census-days/${c1}"
              payload: { resident_count: 4 }
              as: StaffingCoordinator
              as_user_id: "${w_coord}"
            - call: "POST /census-days/${c1}/reconcile"
              payload: {}
              as: StaffingCoordinator
              as_user_id: "${w_coord}"
          assert:
            - "the PATCH returns 200 with data.resident_count == 4, mds_resident_count still 5, and variance_pct recomputed to 0.2000 from abs(4 - 5) / 5"
            - "CensusDay.${c1}.status is still RECONCILED after the PATCH, because PATCH is not the reconcile trigger"
            - "QuarterlySubmission.${sub}.status reverted from VALIDATED to DRAFT, total_resident_days == 4, total_direct_care_hours == 8.00, and version == ${pv} + 1"
            - "the follow-up reconcile returns 200 with status DISPUTED, since 0.2000 exceeds CENSUS_VARIANCE_TOLERANCE 0.05, and opens a CENSUS_VARIANCE finding for 2026-04-01"

      - name: submission_reject_records_reason_and_reopen_from_rejected_is_free
        claim_type: action_endpoint
        grounds:
          - endpoints[POST /submissions/{id}/reject]
          - endpoints[POST /submissions/{id}/reopen]
          - calculations.amendment_surcharge
        distinguishing_aspect: "The amendment surcharge is keyed on the status the submission is reopened from, so a reopen out of REJECTED costs 0 cents while still consuming an amendment_index — the escalation counter and the fee are decoupled."
        test_recipe:
          setup:
            - "A SUBMITTED 2026Q2 submission with one SUPPORTED 8.00-hour RN shift and one RECONCILED census day"
          setup_api_calls:
            - *k_fac
            - *k_per
            - *k_jc_rn
            - *k_jc_split
            - *k_jc_admin
            - *k_w_coord
            - *k_w_admin
            - *k_w_rn
            - *k_sub
            - *k_pr_0401
            - *k_entry_0401
            - *k_census_0401
            - *k_reconcile_c1
            - *k_verify_e1
            - *k_validate
            - *k_submit
          trigger:
            - call: "POST /submissions/${sub}/reject"
              payload: { rejection_reason: "Census file does not tie to the MDS extract for the full month." }
              as: StateAuditor
              as_user_id: "auditor-accept-01"
            - call: "POST /submissions/${sub}/reopen"
              payload: {}
              as: StaffingCoordinator
              as_user_id: "${w_coord}"
          assert:
            - "the reject returns 200 with status REJECTED, rejection_reason stored verbatim, and accepted_by_user_id == auditor-accept-01"
            - "the reopen returns 200 with status DRAFT and amendment_index == 1"
            - "QuarterlySubmission.${sub}.amendment_surcharge_cents == 0, since base_fee_cents is 0 when the reopen starts from REJECTED, and late_days is 0 at clock 2026-08-01T00:00:00Z against the 2026-08-14T23:59:59Z deadline"
            - "QuarterlySubmission.${sub}.validated_by_worker_id == null and attested_by_worker_id == null, and Facility.${fac}.outstanding_surcharge_cents == 0"

      - name: vendor_batch_accept_rejects_the_whole_batch_when_one_line_is_bad
        claim_type: bulk_action
        grounds:
          - endpoints[POST /vendor-submissions/{id}/accept]
          - validations[priority 36 ERR_WORK_DATE_OUTSIDE_PERIOD]
          - validations[priority 45 ERR_VENDOR_WORKER_MISMATCH]
          - validations[priority 21 ERR_VENDOR_SUBMISSION_STATE_INVALID]
        distinguishing_aspect: "Batch acceptance is all-or-nothing: one out-of-period line stops the whole synthesis, so the good line produces no HourEntry either, and the roster check at priority 45 fires earlier still — at batch creation rather than at accept."
        test_recipe:
          setup:
            - "An ACTIVE vendor with one AGENCY_CONTRACTOR worker, a DRAFT facility submission, and a SUBMITTED two-line batch whose second line carries work_date 2026-05-20, outside the April period"
          setup_api_calls:
