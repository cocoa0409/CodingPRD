      - name: one_household_cannot_hold_overlapping_rental_assistance_periods_on_two_parcels
        claim_type: cross_entity_validation
        grounds:
          - validations.priority_43
          - calculations.rental_assistance_payment
          - entities.RelocationCase.fields.household_reference
          - entities.RelocationCase.fields.rental_assistance_end_date
        distinguishing_aspect: |
          household_reference is unique only within a parcel, so the same household legitimately holds
          a case on each of two parcels of one project; the overlap check is therefore project-scoped
          and interval-based. The first TENANT_90_DAY case occupies the half-open interval
          [2026-09-01, 2030-03-01) after its 42 months are granted, and the second case starting
