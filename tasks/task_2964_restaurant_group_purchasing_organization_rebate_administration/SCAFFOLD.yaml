  - method: POST
    path: "/manufacturer-deals/{deal_id}/close-period"
    description: "Close a rebate period on this deal: rebase every open accrual from the accrue-time MARGINAL_BATCH variant to the period-wide BLENDED_PERIOD variant, pay the validated ones, and refreeze the member admin-fee snapshot."
    roles: [GpoAdmin]
    code: 200
    input: [period_start, period_end]
    output: ManufacturerDeal
    side_effects:
      - "For every RebateAccrual of this deal's items whose line invoice_date is inside the closed period and whose status IN {ACCRUED, VALIDATED, FLAGGED}: gross_rebate_cents is recomputed by rebate_gross variant BLENDED_PERIOD, final_adjustment_cents = new gross - old gross, basis = BLENDED_PERIOD."
      - "The split is recomputed by rebate_split REUSING the frozen admin_fee_bps_applied; each Member money counter moves by the signed component delta."
      - "Accruals with status == VALIDATED whose Member has payout_hold == false then transition VALIDATED -> PAID."
      - "Member.ytd_net_snapshot_cents is rewritten to the member's post-close attributed net total (accrued_member_share_cents + attributed_gpo_retention_cents), which selects the admin-fee band for all later accruals."
      - "The deal's own status is unchanged; increments ManufacturerDeal.version by 1."

