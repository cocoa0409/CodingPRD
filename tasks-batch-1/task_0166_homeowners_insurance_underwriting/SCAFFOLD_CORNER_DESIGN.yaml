              as: Agent
            - call: "GET /policies/${pol_id}"
              payload: {}
              as: Underwriter
              captures: { stale_pol_v: $.data.version }
            - call: "POST /policies/${pol_id}/lapse"
              payload: { expected_policy_version: "${stale_pol_v}" }
              as: Underwriter
              as_user_id: "${uw_id}"
            - call: "POST /payments"
              payload: { policy_id: "${pol_id}", purpose: "REINSTATEMENT", amount: 1247.50 }
              as: Agent
          trigger:
            - call: "POST /policies/${pol_id}/lapse"
              payload: { expected_policy_version: "${stale_pol_v}" }
              as: Underwriter
              as_user_id: "${uw_id}"
              captures: { err: $.data.error_id }
          assert:
            - "Status 412 and error_id == ERR_STALE_POLICY_VERSION (the policy version advanced through lapse+reinstate after ${stale_pol_v} was observed)"

      - name: bind_cascade_already_covered
        claim_type: cascading_side_effects
        grounds: [state_machines.Application.UNDER_REVIEW_to_BOUND]
        excluded_because:
          difficulty_instance: transitive_cascade / bind_cascade_application_policy_endorsement_ledger
          rationale: "The bind→policy→endorsement→ledger cascade is asserted by the named §1.8 transitive-cascade instance."

  # ===========================================================================
  - section: consistency_model
    instances:
      - name: immediate_visibility_of_premium_balance_after_payment
        claim_type: immediate
        grounds: [entities.Policy.fields.premium_balance, state_machines.Policy.PENDING_PAYMENT_to_ACTIVE]
        distinguishing_aspect: "After the binding payment, the same payment response cycle leaves Policy.premium_balance immediately reading 997.50 on the next GET (immediate consistency)."
        test_recipe:
          setup: ["A bound Policy PENDING_PAYMENT, annual_premium 997.50."]
          setup_api_calls:
            - call: "POST /underwriters"
              payload: { full_name: "Uma UW", authority_limit: 1000000 }
              as: Admin
              captures: { uw_id: $.data.id }
            - call: "POST /inspectors"
              payload: { full_name: "Ivy Insp", license_state: "CA" }
              as: Admin
              captures: { insp_id: $.data.id }
            - call: "POST /properties"
              payload: { street_address: "40 Immed St", state_code: "CA", year_built: 2009, square_footage: 2000, construction_type: "FRAME", roof_age_years: 5, stories: 1 }
              as: Agent
              captures: { prop_id: $.data.id }
            - call: "POST /properties/${prop_id}/estimate-replacement-cost"
              payload: { method: "COMPONENT" }
              as: Agent
            - call: "POST /risk-assessments"
              payload: { property_id: "${prop_id}", wildfire_fuel_density: 60, slope_grade_pct: 40, defensible_space_ft: 100, flood_zone: "X", distance_to_coast_mi: 60 }
              as: Underwriter
            - call: "POST /inspections"
              payload: { property_id: "${prop_id}", inspector_id: "${insp_id}", window_start: 1752300000, window_end: 1752303600 }
              as: Underwriter
              captures: { insp1: $.data.id }
            - call: "POST /inspections/${insp1}/complete"
              payload: { roof_ok: true, electrical_ok: true, plumbing_ok: true, hvac_ok: true }
              as: Inspector
              as_user_id: "${insp_id}"
            - call: "POST /applications"
              payload: { property_id: "${prop_id}", requested_coverage_a: 300000, wind_hail_deductible_pct: 2 }
              as: Agent
              captures: { app_id: $.data.id }
            - call: "POST /applications/${app_id}/submit"
              payload: {}
              as: Agent
            - call: "POST /applications/${app_id}/take-review"
              payload: {}
              as: Underwriter
              as_user_id: "${uw_id}"
              captures: { app_v: $.data.version }
            - call: "POST /applications/${app_id}/bind"
              payload: { effective_date: 1751000000, expiration_date: 1782536000, expected_application_version: "${app_v}" }
              as: Underwriter
              as_user_id: "${uw_id}"
            - call: "GET /policies"
              payload: { application_id: "${app_id}" }
              as: Underwriter
              captures: { pol_id: "$.data[0].id" }
            - call: "POST /payments"
              payload: { policy_id: "${pol_id}", purpose: "BINDING", amount: 997.50 }
              as: Agent
          trigger:
            - call: "GET /policies/${pol_id}"
              payload: {}
              as: Underwriter
              captures: { bal: $.data.premium_balance, st: $.data.status }
          assert:
            - "Policy.${pol_id}.status == ACTIVE and premium_balance == 997.50 immediately on the post-payment GET"
