          The AllocationRun transition PUBLISHED -> CLOSED is legal on the run's own machine yet still refused,
          because the guard reads the state of a different entity family: every ChargebackInvoice of the run must be
          SETTLED or WRITTEN_OFF and no Dispute on them may still be live. The identical close call flips from
