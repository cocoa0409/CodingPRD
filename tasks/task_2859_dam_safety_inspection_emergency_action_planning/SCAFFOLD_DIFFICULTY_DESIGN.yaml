              as: ProgramAdmin
              captures: { insp1_id: "$.data.id" }
          trigger:
            - call: "POST /inspections"
              payload: { dam_id: "${dam2_id}", engineer_id: "${eng_a_id}", inspection_type: "PERIODIC", window_start: "2026-08-05T13:59:00Z", window_end: "2026-08-05T16:00:00Z" }
              as: ProgramAdmin
