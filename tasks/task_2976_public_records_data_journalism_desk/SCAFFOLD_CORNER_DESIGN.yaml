      - name: composite_disclosure_score_rounds_once_then_penalizes_then_clamps
        claim_type: precision
        grounds:
          - calculations.disclosure_risk_score
          - endpoints[GET /records-desk/investigations/{id}/disclosure-risk-preview]
          - entities.FieldDefinition.fields.reidentification_risk
        distinguishing_aspect: |
          The composite variant pins an exact operation order: round_half_up is applied ONCE, after the
          size multiplier and BEFORE the source penalty, and the min(100) clamp is applied last. Density
          5.5 at 5000 records gives 5.5*10*1.25 = 68.75 -> 69, whereas rounding the density first (6 ->
          75) or rounding after the penalty gives a different integer. The 999/1000-record pair pins the
          size-tier boundary, and the 10/10-with-source dataset pins the clamp at exactly 100 rather than
          150.
        test_recipe:
          setup:
            - "Desk, Agency, one RELEASED RecordsRequest, one Investigation with publication_mode FULL_DATA_RELEASE."
            - "Dataset precision-probe: delivered CSV, record_count 5000; fields risk 8 (not source), risk 3 (not source), risk 6 (SOURCE, then suppressed)."
            - "Dataset clamp-probe: delivered CSV, record_count 5000; fields risk 10 (not source) and risk 10 (SOURCE, left unsuppressed)."
            - "Datasets tier-999-probe and tier-1000-probe: delivered CSV, record_count 999 and 1000; each with a single risk-4 non-source field."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T09:00:00Z" }
              as: ManagingEditor
            - call: "POST /records-desk/desks"
              payload: { name: "Metro Investigations Desk", fee_budget_total_cents: 500000, retention_policy_days: 365 }
              as: ManagingEditor
              captures: { desk_id: $.data.id }
            - call: "POST /records-desk/agencies"
              payload: { name: "State Housing Authority", jurisdiction_code: "CA-STATE", statute_name: "CPRA", initial_response_days: 10, deadline_basis: "BUSINESS_DAYS", tolling_allowed: true, appeal_venue: "OMBUDS", appeal_decision_days: 20, search_fee_cents_per_hour: 3500, page_fee_cents: 25, max_waiver_cents: 10000, holiday_dates: ["2026-09-07"] }
              as: RecordsCoordinator
              captures: { agency_id: $.data.id }
            - call: "GET /records-desk/desks/${desk_id}"
              as: RecordsCoordinator
              captures: { desk_v: $.data.version }
            - call: "POST /records-desk/records-requests"
              payload: { desk_id: "${desk_id}", agency_id: "${agency_id}", subject_summary: "Precision probe", requested_format: "CSV", estimated_page_count: 10, waiver_requested: false, public_interest_score: 10, expected_desk_version: "${desk_v}" }
              as: RecordsCoordinator
              captures: { req_id: $.data.id }
            - call: "POST /records-desk/records-requests/${req_id}/submit"
              payload: {}
              as: RecordsCoordinator
            - call: "POST /records-desk/records-requests/${req_id}/agency-decision"
              payload: { outcome: "RELEASED_FULL" }
              as: RecordsCoordinator
            - call: "POST /records-desk/investigations"
              payload: { desk_id: "${desk_id}", headline: "Precision probe", publication_mode: "FULL_DATA_RELEASE" }
              as: ManagingEditor
              captures: { inv_id: $.data.id }
            - call: "POST /records-desk/datasets"
              payload: { request_id: "${req_id}", investigation_id: "${inv_id}", name: "precision-probe", negotiated_format: "CSV", expected_field_count: 3, sensitivity_tier: "CONFIDENTIAL" }
              as: DataReporter
              captures: { ds_prec_id: $.data.id }
            - call: "POST /records-desk/datasets/${ds_prec_id}/delivery"
              payload: { delivered_format: "CSV", record_count: 5000 }
              as: DataReporter
            - call: "POST /records-desk/datasets/${ds_prec_id}/field-definitions"
              payload: { field_name: "permit_holder_zip", data_type: "STRING", null_rate_pct: 0.0, reidentification_risk: 8, is_source_identifying: false }
              as: DataReporter
            - call: "POST /records-desk/datasets/${ds_prec_id}/field-definitions"
