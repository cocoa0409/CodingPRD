              as: PostSupervisor
            - call: "POST /post-production/projects/${proj_id}/activate"
              payload: {}
              as: PostSupervisor
            - call: "POST /post-production/projects/${proj_id}/batches"
              payload: { batch_label: "D1", ingest_window_start: "2026-07-31T00:00:00Z", ingest_window_end: "2026-08-31T23:59:59Z" }
              as: MediaManager
              captures: { batch_id: $.data.id }
            - call: "POST /post-production/projects/${proj_id}/batches/${batch_id}/start-ingest"
              payload: {}
              as: MediaManager
            - call: "POST /post-production/projects/${proj_id}/assets"
              payload: { batch_id: "${batch_id}", reel_name: "A001", clip_name: "C001", source_bytes: 1073741824, duration_frames: 100 }
              as: MediaManager
              captures: { asset_id: $.data.id }
            - call: "GET /post-production/projects/${proj_id}"
              payload: {}
              as: PostSupervisor
              captures: { s1: $.data.storage_used_gb }
            - call: "POST /post-production/projects/${proj_id}/batches/${batch_id}/finish-ingest"
              payload: {}
              as: MediaManager
            - call: "POST /post-production/projects/${proj_id}/assets/${asset_id}/proxy-complete"
              payload: { proxy_bytes: 536870912 }
              as: MediaManager
            - call: "GET /post-production/projects/${proj_id}"
              payload: {}
              as: PostSupervisor
              captures: { s2: $.data.storage_used_gb }
            - call: "POST /post-production/projects/${proj_id}/batches/${batch_id}/purge"
