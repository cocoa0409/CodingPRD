  - rule_id: transitive_cascade
    instances:
      - name: sweep_min_enrollment_cancellation_chain
        grounds:
          - state_machines.ClassSession.PUBLISHED_to_CANCELLED
          - state_machines.Registration.ENROLLED_to_CANCELLED
          - state_machines.PaymentTransaction.PENDING_to_COMPLETED
          - calculations.registration_refund
        distinguishing_aspect: |
          Depth-4 chain originating from the sweep trigger: sweep -> ClassSession CANCELLED ->
          Registration CANCELLED -> REFUND PaymentTransaction created (and auto-COMPLETED below
          threshold) -> Household.account_credit_cents incremented; a parallel branch terminates the
          ACCEPTED contract with payout. Each hop is caused by the previous mutation, not by the
          sweep directly.
