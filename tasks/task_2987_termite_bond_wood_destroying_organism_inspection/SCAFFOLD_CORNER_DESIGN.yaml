          - endpoints[POST /treatment-plans]
        distinguishing_aspect: >-
          Three SLAB properties differing only in square_footage — 1500, 3000, 3001 — pin both
          tier edges of the piecewise rate schedule. The boundary sqft belongs to the LOWER tier
          (min(S, 1500) and min(S, 3000) are inclusive), so 3001 sqft costs exactly one square
          foot of TIER3_RATE more than 3000, i.e. 0.28 cents, not a whole extra tier.
        test_recipe:
          setup:
            - "Three FL SLAB properties, all linear_footage 100, differing only in square_footage: 1500 / 3000 / 3001."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
