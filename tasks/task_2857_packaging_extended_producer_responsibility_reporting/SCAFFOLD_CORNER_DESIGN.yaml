              as: ProducerComplianceOfficer
              as_user_id: "${p1_id}"
              captures: { e_negative: $.data.error_id }
            - call: "POST /epr/fee-schedules"
              payload: { pro_id: "${pro_id}", state_program_id: "${sp_id}", effective_from: "2026-01-01", effective_to: null, membership_fee_cents: 250000, admin_fee_bps_low: 500, admin_fee_bps_high: 2001, material_rates: [{ material_type: "GLASS", tier_min_kg: 0, tier_max_kg: null, rate_cents_per_kg: 9 }] }
              as: ProAdministrator
              as_user_id: "${pro_id}"
              captures: { e_bps: $.data.error_id }
            - call: "GET /epr/producers"
              payload: { limit: 101, offset: 0 }
              as: ProgramRegulator
              captures: { e_limit: $.data.error_id }
            - call: "GET /epr/producers"
              payload: { limit: 10, offset: -1 }
              as: ProgramRegulator
              captures: { e_offset: $.data.error_id }
          assert:
            - "${e_bad_enum} == ERR_INVALID_REQUEST with HTTP 400 (PET_TOYS is not in the product_category enum)"
            - "${e_negative} == ERR_INVALID_REQUEST with HTTP 400 (units_sold_annual_estimate >= 0)"
            - "${e_bps} == ERR_INVALID_REQUEST with HTTP 400 (admin_fee_bps_high must be within 0..2000)"
            - "${e_limit} == ERR_INVALID_REQUEST and ${e_offset} == ERR_INVALID_REQUEST (limit in [1,100], offset >= 0)"
            - "GET /epr/skus?producer_id=${p1_id}&limit=10&offset=0 reports total_count == 0 — neither malformed SKU was persisted"

      - name: sub_resource_appends_require_an_existing_parent_not_found
        claim_type: parent_relationships
        grounds:
          - validations.priority_4
          - endpoints.POST /epr/skus/{id}/components
          - endpoints.POST /epr/state-programs/{id}/reporting-periods
          - endpoints.POST /epr/reports/{id}/lines
          - complexity_profile.entity_topology_note
        distinguishing_aspect: "The three append-style sub-resources (components, reporting-periods, report lines) each answer an absent parent id in the path with the parent's own 404 code, so no orphan child row can be created."
        test_recipe:
          setup:
            - "Empty database apart from one producer, so the parent ids used below are genuinely absent."
          setup_api_calls:
            - call: "POST /epr/producers"
              payload: { legal_name: "Northlake Beverages LLC", brand_owner_flag: true, importer_of_record_flag: false, domestic_licensor_flag: false, annual_gross_revenue_usd: 5000000, contact_email: "compliance@northlake.example" }
              as: ProgramRegulator
              captures: { p1_id: $.data.id }
          trigger:
            - call: "POST /epr/skus/00000000-0000-0000-0000-000000000000/components"
              payload: { material_type: "GLASS", unit_weight_grams: 50.00, recyclability_class: "READILY_RECYCLABLE", pcr_content_pct: 0, is_reusable: false }
              as: ProducerComplianceOfficer
              as_user_id: "${p1_id}"
              captures: { e_sku_parent: $.data.error_id }
            - call: "POST /epr/state-programs/00000000-0000-0000-0000-000000000000/reporting-periods"
              payload: { period_label: "XX-2026-H1", data_start: "2026-07-01", data_end: "2027-01-01", submission_open: "2026-07-01T00:00:00Z", submission_deadline: "2026-12-31T23:59:59Z", correction_window_days: 30 }
              as: ProgramRegulator
              captures: { e_sp_parent: $.data.error_id }
            - call: "POST /epr/reports/00000000-0000-0000-0000-000000000000/lines"
              payload: { sku_id: "00000000-0000-0000-0000-000000000000", units_sold: 110 }
              as: ProducerComplianceOfficer
              as_user_id: "${p1_id}"
              captures: { e_rep_parent: $.data.error_id }
          assert:
            - "${e_sku_parent} == ERR_SKU_NOT_FOUND with HTTP 404"
            - "${e_sp_parent} == ERR_STATE_PROGRAM_NOT_FOUND with HTTP 404"
            - "${e_rep_parent} == ERR_REPORT_NOT_FOUND with HTTP 404 — the path parameter (priority 4) is resolved before the body's sku_id (priority 5)"
            - "GET /epr/report-lines?limit=10&offset=0 reports total_count == 0"

      - name: body_foreign_keys_are_validated_in_declared_input_order_not_found
        claim_type: entity_topology_flat
        grounds:
          - validations.priority_5
          - complexity_profile.entity_topology
          - endpoints.POST /epr/skus
          - endpoints.POST /epr/registrations
          - endpoints.POST /epr/reports
          - endpoints.POST /epr/invoices
        distinguishing_aspect: "With every body FK absent, each endpoint returns the 404 of the FIRST field in its declared input list: producer_id for skus, state_program_id for registrations (after a valid producer_id), registration_id for reports and packaging_report_id — not membership_id — for invoices."
        test_recipe:
          setup:
            - "One producer and one PRO exist; every other id used below is absent."
          setup_api_calls:
            - call: "POST /epr/producers"
              payload: { legal_name: "Northlake Beverages LLC", brand_owner_flag: true, importer_of_record_flag: false, domestic_licensor_flag: false, annual_gross_revenue_usd: 5000000, contact_email: "compliance@northlake.example" }
              as: ProgramRegulator
              captures: { p1_id: $.data.id }
            - call: "POST /epr/pros"
              payload: { name: "Circular Stewardship Alliance", contact_email: "ops@csa.example" }
              as: ProgramRegulator
              captures: { pro_id: $.data.id }
          trigger:
            - call: "POST /epr/skus"
              payload: { producer_id: "00000000-0000-0000-0000-000000000000", gtin: "00000000000055", name: "Orphan SKU", product_category: "FOOD_DRY", units_sold_annual_estimate: 10 }
              as: ProducerComplianceOfficer
              as_user_id: "00000000-0000-0000-0000-000000000000"
              captures: { e_sku_fk: $.data.error_id }
            - call: "POST /epr/registrations"
              payload: { producer_id: "${p1_id}", state_program_id: "00000000-0000-0000-0000-000000000000" }
              as: ProducerComplianceOfficer
              as_user_id: "${p1_id}"
              captures: { e_reg_fk: $.data.error_id }
            - call: "POST /epr/reports"
              payload: { registration_id: "00000000-0000-0000-0000-000000000000", reporting_period_id: "00000000-0000-0000-0000-000000000000" }
              as: ProducerComplianceOfficer
              as_user_id: "${p1_id}"
              captures: { e_rep_fk: $.data.error_id }
            - call: "POST /epr/invoices"
              payload: { packaging_report_id: "00000000-0000-0000-0000-000000000000", membership_id: "00000000-0000-0000-0000-000000000000" }
              as: ProAdministrator
              as_user_id: "${pro_id}"
              captures: { e_inv_fk: $.data.error_id }
          assert:
            - "${e_sku_fk} == ERR_PRODUCER_NOT_FOUND with HTTP 404"
            - "${e_reg_fk} == ERR_STATE_PROGRAM_NOT_FOUND with HTTP 404"
            - "${e_rep_fk} == ERR_REGISTRATION_NOT_FOUND with HTTP 404 (registration_id precedes reporting_period_id in the input list)"
            - "${e_inv_fk} == ERR_REPORT_NOT_FOUND with HTTP 404, NOT ERR_MEMBERSHIP_NOT_FOUND"
            - "No Sku, Registration, PackagingReport or Invoice row exists: each of the four list endpoints reports total_count == 0"

      - name: every_entity_carries_a_version_that_increments_on_each_write
        claim_type: immutability
        grounds:
          - entities.Sku.common_fields
          - entities.Producer.common_fields
          - endpoints.POST /epr/skus/{id}/components
          - endpoints.POST /epr/skus/{id}/activate
          - endpoints.POST /epr/producers/{id}/determine-obligation
        distinguishing_aspect: "No entity in this scaffold is immutable — all twelve declare common_fields, so every write bumps version by exactly one: the SKU walks 1 -> 2 -> 3 across create, component append and activate while the producer walks 1 -> 2 -> 3 across the activate rollup and the determination."
        test_recipe:
          setup:
            - "One producer and one GLASS-mini SKU."
          setup_api_calls:
            - call: "POST /epr/producers"
              payload: { legal_name: "Northlake Beverages LLC", brand_owner_flag: true, importer_of_record_flag: false, domestic_licensor_flag: false, annual_gross_revenue_usd: 5000000, contact_email: "compliance@northlake.example" }
              as: ProgramRegulator
              captures: { p1_id: $.data.id }
            - call: "POST /epr/skus"
              payload: { producer_id: "${p1_id}", gtin: "00000000000017", name: "Sparkling Water 750ml", product_category: "BEVERAGE", units_sold_annual_estimate: 110 }
              as: ProducerComplianceOfficer
              as_user_id: "${p1_id}"
              captures: { sku_id: $.data.id }
            - call: "POST /epr/skus/${sku_id}/components"
              payload: { material_type: "GLASS", unit_weight_grams: 50.00, recyclability_class: "READILY_RECYCLABLE", pcr_content_pct: 0, is_reusable: false }
              as: ProducerComplianceOfficer
              as_user_id: "${p1_id}"
          trigger:
            - call: "POST /epr/skus/${sku_id}/activate"
              payload: {}
              as: ProducerComplianceOfficer
              as_user_id: "${p1_id}"
            - call: "POST /epr/producers/${p1_id}/determine-obligation"
              payload: {}
              as: ProgramRegulator
          assert:
            - "After activate: Sku.${sku_id}.version == 3 and Sku.${sku_id}.status == ACTIVE"
            - "After activate: Producer.${p1_id}.version == 2 and annual_packaging_weight_kg == 5.500"
            - "After activate: Producer.${p1_id}.determination_stale == false because the producer was still DRAFT (the stale flag is only set for an OBLIGATION_DETERMINED producer)"
            - "After determine-obligation: Producer.${p1_id}.version == 3, status == OBLIGATION_DETERMINED, obligated_party_role == BRAND_OWNER, determination_stale == false"
            - "Every entity response body carries id, created_at, updated_at and version; no entity omits version"

  - section: state_machines
    instances:

      - name: producer_initial_state_and_determination_round_trip_on_restatement
        claim_type: initial_state
        grounds:
          - state_machines.Producer.initial_state
          - state_machines.Producer.transitions.DRAFT_to_OBLIGATION_DETERMINED
          - state_machines.Producer.transitions.OBLIGATION_DETERMINED_to_DRAFT
        distinguishing_aspect: "The Producer machine starts in DRAFT, is driven to OBLIGATION_DETERMINED by determine-obligation, and is driven back to DRAFT by restate-revenue with obligated_party_role reset to UNDETERMINED — the only backward edge in the machine."
        test_recipe:
          setup:
            - "One producer with the GLASS-mini SKU ACTIVE and obligation determined."
          setup_api_calls:
            - call: "POST /epr/producers"
              payload: { legal_name: "Northlake Beverages LLC", brand_owner_flag: true, importer_of_record_flag: false, domestic_licensor_flag: false, annual_gross_revenue_usd: 5000000, contact_email: "compliance@northlake.example" }
              as: ProgramRegulator
              captures: { p1_id: $.data.id }
            - call: "POST /epr/skus"
              payload: { producer_id: "${p1_id}", gtin: "00000000000017", name: "Sparkling Water 750ml", product_category: "BEVERAGE", units_sold_annual_estimate: 110 }
              as: ProducerComplianceOfficer
              as_user_id: "${p1_id}"
              captures: { sku_id: $.data.id }
            - call: "POST /epr/skus/${sku_id}/components"
              payload: { material_type: "GLASS", unit_weight_grams: 50.00, recyclability_class: "READILY_RECYCLABLE", pcr_content_pct: 0, is_reusable: false }
              as: ProducerComplianceOfficer
              as_user_id: "${p1_id}"
            - call: "POST /epr/skus/${sku_id}/activate"
              payload: {}
              as: ProducerComplianceOfficer
              as_user_id: "${p1_id}"
            - call: "POST /epr/producers/${p1_id}/determine-obligation"
              payload: {}
              as: ProgramRegulator
          trigger:
            - call: "POST /epr/producers/${p1_id}/restate-revenue"
              payload: { annual_gross_revenue_usd: 900000, reason: "Audited restatement of FY2025 revenue" }
              as: ProgramRegulator
          assert:
            - "Producer.${p1_id}.status == DRAFT (back to the initial state)"
            - "Producer.${p1_id}.obligated_party_role == UNDETERMINED"
            - "Producer.${p1_id}.annual_gross_revenue_usd == 900000"
            - "Producer.${p1_id}.annual_packaging_weight_kg == 5.500 — the weight rollup is not reset by a revenue restatement"
            - "A second POST /epr/producers/${p1_id}/determine-obligation succeeds and returns status OBLIGATION_DETERMINED with obligated_party_role BRAND_OWNER again"

      - name: fee_schedule_second_publish_attempt_is_rejected
        claim_type: idempotency
        grounds:
          - state_machines.FeeSchedule.transitions.DRAFT_to_PUBLISHED
          - validations.priority_7
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "Publishing the same FeeSchedule twice is not idempotent: the second call returns ERR_INVALID_STATE (409) even with a freshly observed expected_pro_version, and neither Pro.version nor FeeSchedule.version moves again."
        test_recipe:
          setup:
            - "One PRO, one CA program and one PUBLISHED open-ended GLASS schedule."
          setup_api_calls:
            - call: "POST /epr/state-programs"
              payload: { state_code: "CA", obligation_basis: "ENTITY_LEVEL", eco_mod_policy: "BONUS_MALUS", fee_rounding_order: "PER_LINE_THEN_SUM", small_producer_revenue_threshold_usd: 1000000, small_producer_tonnage_threshold_kg: 1.000, exempt_product_categories: [], verification_required_threshold_kg: 3000, registration_deadline: "2026-12-31T23:59:59Z" }
              as: ProgramRegulator
              captures: { sp_id: $.data.id }
            - call: "POST /epr/pros"
              payload: { name: "Circular Stewardship Alliance", contact_email: "ops@csa.example" }
              as: ProgramRegulator
              captures: { pro_id: $.data.id }
            - call: "POST /epr/fee-schedules"
              payload: { pro_id: "${pro_id}", state_program_id: "${sp_id}", effective_from: "2026-01-01", effective_to: null, membership_fee_cents: 250000, admin_fee_bps_low: 500, admin_fee_bps_high: 900, material_rates: [{ material_type: "GLASS", tier_min_kg: 0, tier_max_kg: null, rate_cents_per_kg: 9 }] }
              as: ProAdministrator
              as_user_id: "${pro_id}"
              captures: { fs_id: $.data.id }
            - call: "GET /epr/pros/${pro_id}"
              payload: {}
              as: ProAdministrator
              as_user_id: "${pro_id}"
              captures: { pro_ver_1: $.data.version }
            - call: "POST /epr/fee-schedules/${fs_id}/publish"
              payload: { expected_pro_version: "${pro_ver_1}" }
              as: ProAdministrator
              as_user_id: "${pro_id}"
            - call: "GET /epr/pros/${pro_id}"
              payload: {}
              as: ProAdministrator
              as_user_id: "${pro_id}"
              captures: { pro_ver_2: $.data.version }
          trigger:
            - call: "POST /epr/fee-schedules/${fs_id}/publish"
              payload: { expected_pro_version: "${pro_ver_2}" }
              as: ProAdministrator
              as_user_id: "${pro_id}"
              captures: { e_second_publish: $.data.error_id }
          assert:
            - "${pro_ver_1} == 1 and ${pro_ver_2} == 2 — the first publish incremented Pro.version"
            - "${e_second_publish} == ERR_INVALID_STATE with HTTP 409"
            - "FeeSchedule.${fs_id}.status == PUBLISHED and FeeSchedule.${fs_id}.version == 2 (unchanged by the rejected call)"
            - "Pro.${pro_id}.version == 2 (unchanged by the rejected call)"

      - name: registration_rejected_is_terminal_and_locks_every_later_action
        claim_type: terminal_state_lockdown
        grounds:
          - state_machines.Registration.terminal_states
          - state_machines.Registration.transitions.SUBMITTED_to_REJECTED
          - validations.priority_7
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "From the terminal REJECTED state all three remaining registration verbs — decide, suspend and withdraw — return ERR_INVALID_STATE (409), and Registration.version stays at 3 (create, submit, reject)."
        test_recipe:
          setup:
