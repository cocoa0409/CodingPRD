              as: RegistrarClerk
              captures: { em: $.data.id }
            - call: "POST /r2t4/enrollments/${em}/awards"
              payload: { program: "PELL_GRANT", amount_cents: 200000 }
              as: FinancialAidOfficer
              captures: { pm: $.data.id }
            - call: "POST /r2t4/awards/${pm}/disbursements"
              payload: { amount_cents: 200000 }
              as: FinancialAidOfficer
              captures: { dm1: $.data.id }
            - call: "POST /r2t4/disbursements/${dm1}/disburse"
              payload: {}
              as: FinancialAidOfficer
            - call: "POST /r2t4/enrollments/${em}/awards"
              payload: { program: "SUBSIDIZED_LOAN", amount_cents: 300000 }
              as: FinancialAidOfficer
              captures: { lm: $.data.id }
            - call: "POST /r2t4/awards/${lm}/accept"
              payload: {}
              as: Student
              as_user_id: "${sm}"
            - call: "POST /r2t4/awards/${lm}/disbursements"
              payload: { amount_cents: 100000 }
              as: FinancialAidOfficer
              captures: { dm2: $.data.id }
            - call: "POST /r2t4/enrollments/${em}/withdraw"
              payload: { withdrawal_type: "OFFICIAL", notification_date: "2026-09-02" }
