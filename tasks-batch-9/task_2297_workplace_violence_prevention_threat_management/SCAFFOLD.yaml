# =============================================================================
# PRD Benchmark Scaffold — Workplace Violence Prevention & Threat Management
# Difficulty target: above Expert (§0.4) — 13 entities, 57 endpoints,
# 9 state machines / 43 transitions (cyclic + parallel + guarded), 7 calculations,
# 35 ordered validations, 57 error codes, 10 roles.
# =============================================================================

scenario: |
  2297. Workplace Violence Prevention & Threat Management (employer safety and threat assessment program): prevention plan development with hazard identification by work area and job function, incident and threat reporting channels with anti-retaliation protections, multidisciplinary threat assessment team convening with behavioral risk evaluation, protective measures including access restriction, schedule change, security escort and restraining order support, employee training with role-specific scenarios and annual refresh, violent incident log maintenance with required data elements and retention, post-incident response including counseling, debriefing and law enforcement coordination, plan review, drill execution and regulatory inspection readiness.

domain_name: workplace-violence-prevention
api_prefix: ""            # flat topology: /worksites, /prevention-plans, /threat-cases, /case-actions ...

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: multi_party_negotiation
  complexity_layers:
    - cascading_side_effects
    - dual_variant_calculation
    - optimistic_concurrency
    - derived_field_reconciliation
    - ops_run_checkpoint
  entity_topology: flat
  # flat: every entity is a top-level collection joined by explicit FK fields;
  # only two nested read/write paths exist (case-scoped team rosters/ballots,
  # plan-scoped drills), everything else is peer-to-peer with FK bodies.
  state_machine_shape: cyclic
  # ThreatCase: OPEN -> ASSESSING -> DELIBERATION -> ASSESSING (reassessment
  # rounds) with a branch at decide; PreventionPlan: DRAFT <-> IN_REVIEW and
  # ACTIVE -> REVIEW_DUE -> IN_REVIEW; IncidentReport carries two independent
  # state dimensions (triage_status x retaliation_status); ThreatCase.status
  # also auto-advances on aggregate child ballot state (compound).
  relationship_patterns:
    - one_to_many
    - many_to_many        # ThreatCase <-> Employee via TeamAssignment
    - self_referential    # ViolentIncidentLogEntry.supersedes_entry_id
    - cross_aggregate     # CaseAction -> WorkArea / Employee across the case aggregate
  role_model: segregation_of_duties
  # The SafetyOfficer who submits a plan revision may not activate it; the
  # employee who authored a hazard assessment may not validate it.
  consistency_model: immediate

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# 1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Worksite
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Worksite display name", constraints: "1..120 chars" }
      - { name: state_code, type: string, source: input, description: "Two-letter jurisdiction code driving log retention rules", constraints: "exactly 2 uppercase letters" }
      - { name: employee_count, type: integer, source: input, description: "Declared headcount used as the drill participation denominator", constraints: ">= 1" }
      - { name: violent_incident_count_12mo, type: integer, source: computed, default: 0, description: "Count of ViolentIncidentLogEntry rows for this worksite with retention_status ACTIVE, superseded_flag false and incident_at within the trailing 365 days of the logical clock" }
      - { name: high_risk_flag, type: boolean, source: computed, default: false, description: "True when violent_incident_count_12mo >= WORKSITE_HIGH_RISK_INCIDENT_THRESHOLD (1)" }

  - name: WorkArea
    parent: null
    common_fields: true
    fields:
      - { name: worksite_id, type: string, source: input, description: "FK -> Worksite.id; owning worksite" }
      - { name: name, type: string, source: input, description: "Work area label (e.g. Intake Desk)", constraints: "1..120 chars" }
      - { name: job_function, type: enum, source: input, description: "Primary job function performed in this area", constraints: "PATIENT_CARE | CASH_HANDLING | FIELD_SERVICE | WAREHOUSE | SECURITY | ADMIN" }
      - { name: public_access_flag, type: boolean, source: input, default: false, description: "Members of the public can physically enter the area" }
      - { name: lone_worker_flag, type: boolean, source: input, default: false, description: "Staff routinely work alone in the area" }
      - { name: night_shift_flag, type: boolean, source: input, default: false, description: "Area is staffed between 22:00 and 06:00" }
      - { name: occupancy_cap, type: integer, source: input, description: "Maximum staff headcount the area may hold at any instant; drives the access-restriction capacity cap", constraints: ">= 1" }
      - { name: restricted_employee_count, type: integer, source: computed, default: 0, description: "Count of CaseAction rows with action_type ACCESS_RESTRICTION, work_area_id == this area and status IN {SCHEDULED, ACTIVE}" }
      - { name: current_hazard_score, type: number, source: computed, default: null, description: "hazard_score of the non-SUPERSEDED HazardAssessment for this area whose plan_id is the worksite PreventionPlan with status IN {ACTIVE, REVIEW_DUE}; null when the worksite has no such plan or no such assessment" }

  - name: PreventionPlan
    parent: null
    common_fields: true
    fields:
      - { name: worksite_id, type: string, source: input, description: "FK -> Worksite.id; worksite the plan governs" }
      - { name: effective_date, type: datetime, source: input, description: "Date the plan text takes effect (ISO 8601 UTC)" }
      - { name: review_interval_days, type: integer, source: input, default: 365, description: "Days after activation until periodic review falls due", constraints: "30..1095" }
      - { name: plan_revision, type: integer, source: computed, description: "1 + count of PreventionPlan rows for the same worksite_id with created_at < this row's created_at" }
      - { name: status, type: enum, source: computed, default: DRAFT, description: "Lifecycle state", constraints: "DRAFT | IN_REVIEW | ACTIVE | REVIEW_DUE | SUPERSEDED" }
      - { name: compliance_posture, type: enum, source: computed, default: FROZEN, description: "FROZEN when status IN {DRAFT, IN_REVIEW, SUPERSEDED}; RESTRICTED when status == REVIEW_DUE OR worksite.high_risk_flag == true; otherwise OPEN", constraints: "OPEN | RESTRICTED | FROZEN" }
      - { name: submitted_by_employee_id, type: string, source: computed, default: null, description: "FK -> Employee.id; X-User-ID of the SafetyOfficer whose submit call produced the current IN_REVIEW state" }
      - { name: activated_by_employee_id, type: string, source: computed, default: null, description: "FK -> Employee.id; X-User-ID of the SiteManager who activated the plan" }
      - { name: activated_at, type: datetime, source: computed, default: null, description: "Logical clock value at activation" }
      - { name: review_due_date, type: datetime, source: computed, default: null, description: "activated_at + review_interval_days; recomputed on every activation" }
      - { name: hazard_coverage_pct, type: number, source: computed, default: 0, description: "Output of calculation hazard_coverage_pct (2 decimals)" }
      - { name: training_compliance_pct, type: number, source: computed, default: 0, description: "Output of calculation training_compliance_pct (2 decimals)" }
      - { name: log_completeness_pct, type: number, source: computed, default: 100, description: "Output of calculation log_completeness_pct (2 decimals)" }
      - { name: drills_completed_12mo, type: integer, source: computed, default: 0, description: "Count of Drill rows for this plan with status EXECUTED, credited true and executed_at within the trailing 365 days of the logical clock" }
      - { name: unmitigated_hazard_count, type: integer, source: computed, default: 0, description: "Count of HazardAssessment rows for this plan with status != SUPERSEDED, control_tier == TIER_1_ENGINEERING and mitigation_verified == false" }
      - { name: overdue_action_count, type: integer, source: computed, default: 0, description: "Count of CaseAction rows with status OVERDUE whose case_id belongs to a ThreatCase with plan_id == this plan" }
      - { name: readiness_subtotal, type: number, source: computed, default: 0, description: "Step-1 output of calculation inspection_readiness_score before penalty (2 decimals)" }
      - { name: readiness_penalty_band, type: enum, source: computed, default: WEAK, description: "Penalty band selected from readiness_subtotal (never from readiness_score)", constraints: "STRONG | ADEQUATE | WEAK" }
      - { name: readiness_penalty_points, type: number, source: computed, default: 0, description: "Step-2 penalty of calculation inspection_readiness_score (2 decimals)" }
      - { name: readiness_score, type: number, source: computed, default: 0, description: "Final output of calculation inspection_readiness_score (2 decimals)" }
      - { name: inspection_ready, type: boolean, source: computed, default: false, description: "Step-4 output of calculation inspection_readiness_score: false whenever compliance_posture == FROZEN; otherwise readiness_score >= READY_THRESHOLD_RESTRICTED (85.00) when compliance_posture == RESTRICTED and readiness_score >= READY_THRESHOLD_OPEN (75.00) when compliance_posture == OPEN. unmitigated_hazard_count affects this field only through readiness_penalty_points, never as a separate gate" }

  - name: HazardAssessment
    parent: null
    common_fields: true
    fields:
      - { name: plan_id, type: string, source: input, description: "FK -> PreventionPlan.id; plan this assessment belongs to" }
      - { name: work_area_id, type: string, source: input, description: "FK -> WorkArea.id; assessed work area" }
      - { name: authored_by_employee_id, type: string, source: computed, description: "FK -> Employee.id; X-User-ID of the SafetyOfficer who created the assessment" }
      - { name: validated_by_employee_id, type: string, source: computed, default: null, description: "FK -> Employee.id; X-User-ID of the SiteManager who validated the assessment" }
      - { name: status, type: enum, source: computed, default: SCREENING, description: "Assessment lifecycle", constraints: "SCREENING | VALIDATED | SUPERSEDED" }
      - { name: reported_incident_count, type: integer, source: input, description: "Prior incidents reported in this area over the last 12 months", constraints: "0..50" }
      - { name: proximity_factor, type: enum, source: input, description: "Public-proximity exposure grading", constraints: "LOW | MODERATE | HIGH" }
      - { name: cash_on_hand_cents, type: integer, source: input, description: "Typical cash held in the area, in cents", constraints: ">= 0" }
      - { name: min_staff_per_shift, type: integer, source: input, description: "Minimum staff scheduled per shift in the area", constraints: ">= 0" }
      - { name: mitigation_credits, type: integer, source: input, default: 0, description: "Verified administrative controls credited during validation; ignored by the SCREENING variant", constraints: "0..10" }
      - { name: barrier_installed, type: boolean, source: input, default: false, description: "Engineering barrier present; ignored by the SCREENING variant" }
      - { name: hazard_score, type: number, source: computed, description: "Output of calculation hazard_score under score_variant (1 decimal)" }
      - { name: score_variant, type: enum, source: computed, default: SCREENING, description: "Which hazard_score variant produced hazard_score", constraints: "SCREENING | VALIDATED" }
      - { name: control_tier, type: enum, source: computed, description: "TIER_1_ENGINEERING when hazard_score >= 60, TIER_2_ADMINISTRATIVE when hazard_score >= 35, else TIER_3_TRAINING_ONLY", constraints: "TIER_1_ENGINEERING | TIER_2_ADMINISTRATIVE | TIER_3_TRAINING_ONLY" }
      - { name: mitigation_verified, type: boolean, source: computed, default: false, description: "True when status == VALIDATED AND (barrier_installed == true OR mitigation_credits >= 2)" }
      - { name: walkthrough_note, type: string, source: computed, default: null, description: "Validation narrative captured at validate time" }

  - name: Employee
    parent: null
    common_fields: true
    fields:
      - { name: worksite_id, type: string, source: input, description: "FK -> Worksite.id; employing worksite" }
      - { name: work_area_id, type: string, source: input, default: null, description: "FK -> WorkArea.id; home work area, null for roving staff" }
      - { name: full_name, type: string, source: input, description: "Employee display name", constraints: "1..120 chars" }
      - { name: job_function, type: enum, source: input, description: "Job function used for training scope and escort eligibility", constraints: "PATIENT_CARE | CASH_HANDLING | FIELD_SERVICE | WAREHOUSE | SECURITY | ADMIN" }
      - { name: team_discipline, type: enum, source: input, default: null, description: "Threat-assessment discipline this employee may represent", constraints: "HR | SECURITY | LEGAL | CLINICAL | OPERATIONS | null" }
      - { name: employment_status, type: enum, source: computed, default: ACTIVE, description: "Employment lifecycle", constraints: "ACTIVE | SEPARATED" }
      - { name: separated_at, type: datetime, source: computed, default: null, description: "Logical clock value recorded by the separate transition" }
      - { name: escort_committed_minutes, type: integer, source: computed, default: 0, description: "Conserved ledger: sum of duration_minutes over CaseAction rows with action_type SECURITY_ESCORT, escort_employee_id == this employee and status IN {SCHEDULED, ACTIVE}" }
      - { name: active_restriction_count, type: integer, source: computed, default: 0, description: "Count of CaseAction rows with action_type ACCESS_RESTRICTION, subject_employee_id == this employee and status IN {SCHEDULED, ACTIVE}" }
      - { name: training_current, type: boolean, source: computed, default: false, description: "True when, for every TrainingModule whose job_function_scope contains this employee's job_function, a TrainingAssignment exists with status COMPLETED and expires_at > logical clock" }

  - name: TrainingModule
    parent: null
    common_fields: true
    fields:
      - { name: code, type: string, source: input, description: "Module code, unique across modules", constraints: "1..40 chars, unique" }
      - { name: job_function_scope, type: array, source: input, description: "Job functions this module is mandatory for", constraints: "non-empty array of job_function enum values" }
      - { name: scenario_set_version, type: string, source: input, description: "Role-specific scenario pack version presented to learners" }
      - { name: refresh_interval_days, type: integer, source: input, default: 365, description: "Days a completion stays current before annual refresh is due", constraints: "30..1095" }
      - { name: passing_score, type: integer, source: input, default: 80, description: "Minimum score accepted by the complete transition", constraints: "0..100" }
      - { name: required_for_escort, type: boolean, source: input, default: false, description: "Completion of this module is a precondition for acting as a security escort" }

  - name: TrainingAssignment
    parent: null
    common_fields: true
    fields:
      - { name: employee_id, type: string, source: input, description: "FK -> Employee.id; learner" }
      - { name: module_id, type: string, source: input, description: "FK -> TrainingModule.id; assigned module" }
      - { name: due_at, type: datetime, source: input, description: "Deadline for completion (ISO 8601 UTC)" }
      - { name: status, type: enum, source: computed, default: ASSIGNED, description: "Assignment lifecycle", constraints: "ASSIGNED | COMPLETED | EXPIRED | SUPERSEDED" }
      - { name: assigned_at, type: datetime, source: system, description: "Logical clock value at creation" }
      - { name: completed_at, type: datetime, source: computed, default: null, description: "Logical clock value at completion" }
      - { name: score, type: integer, source: computed, default: null, description: "Score submitted to the complete transition", constraints: "0..100" }
      - { name: expires_at, type: datetime, source: computed, default: null, description: "completed_at + module.refresh_interval_days" }
      - { name: scenario_set_version, type: string, source: computed, default: null, description: "TrainingModule.scenario_set_version pinned at completion time" }
      - { name: attempt_count, type: integer, source: computed, default: 0, description: "Number of complete calls accepted or rejected for score on this assignment" }

  - name: IncidentReport
    parent: null
    common_fields: true
    fields:
      - { name: worksite_id, type: string, source: input, description: "FK -> Worksite.id; worksite where the event occurred" }
      - { name: work_area_id, type: string, source: input, description: "FK -> WorkArea.id; work area where the event occurred" }
      - { name: reporter_employee_id, type: string, source: input, default: null, description: "FK -> Employee.id; reporter, null only for channel ANONYMOUS_DROPBOX" }
      - { name: subject_employee_id, type: string, source: input, default: null, description: "FK -> Employee.id; internal person of concern, null when the aggressor is not staff" }
      - { name: triaged_by_employee_id, type: string, source: computed, default: null, description: "FK -> Employee.id; X-User-ID of the SafetyOfficer who triaged the report" }
      - { name: channel, type: enum, source: input, description: "Reporting channel used", constraints: "WEB_FORM | HOTLINE | SUPERVISOR | ANONYMOUS_DROPBOX" }
      - { name: occurred_at, type: datetime, source: input, description: "When the event occurred (ISO 8601 UTC); must be <= logical clock" }
      - { name: narrative, type: string, source: input, description: "Reporter narrative", constraints: "10..4000 chars" }
      - { name: incident_type, type: enum, source: input, description: "Violence typology", constraints: "TYPE_1_CRIMINAL | TYPE_2_CLIENT | TYPE_3_COWORKER | TYPE_4_DOMESTIC" }
      - { name: weapon_involved, type: boolean, source: input, default: false, description: "A weapon was present or used" }
      - { name: injury_level, type: enum, source: input, default: NONE, description: "Worst injury sustained", constraints: "NONE | FIRST_AID | MEDICAL_TREATMENT | LOST_TIME | FATALITY" }
      - { name: severity_points, type: integer, source: computed, description: "Output of calculation incident_severity_classification (integer points)" }
      - { name: severity_class, type: enum, source: computed, description: "CRITICAL when severity_points >= 40, SERIOUS when >= 20, else MINOR", constraints: "MINOR | SERIOUS | CRITICAL" }
      - { name: log_required, type: boolean, source: computed, description: "True when severity_class != MINOR OR injury_level != NONE OR weapon_involved == true" }
      - { name: triage_status, type: enum, source: computed, default: NEW, description: "Dimension 1 of the parallel state machine", constraints: "NEW | ESCALATED | SUBSTANTIATED | CLOSED_NO_ACTION" }
      - { name: retaliation_status, type: enum, source: computed, default: NOT_ALLEGED, description: "Dimension 2 of the parallel state machine; evolves independently of triage_status", constraints: "NOT_ALLEGED | ALLEGED | UNDER_REVIEW | SUBSTANTIATED | UNSUBSTANTIATED" }
      - { name: retaliation_claimant_employee_id, type: string, source: computed, default: null, description: "FK -> Employee.id; employee who raised the retaliation claim" }

  - name: ThreatCase
    parent: null
    common_fields: true
    fields:
      - { name: incident_report_id, type: string, source: input, description: "FK -> IncidentReport.id; escalated report that opened the case" }
      - { name: lead_employee_id, type: string, source: input, description: "FK -> Employee.id; convening threat-team lead" }
      - { name: plan_id, type: string, source: computed, description: "FK -> PreventionPlan.id; copied at creation from the worksite plan whose status IN {ACTIVE, REVIEW_DUE}" }
      - { name: subject_employee_id, type: string, source: computed, default: null, description: "FK -> Employee.id; copied from IncidentReport.subject_employee_id" }
      - { name: protected_employee_id, type: string, source: computed, default: null, description: "FK -> Employee.id; copied from IncidentReport.reporter_employee_id; null for anonymous reports" }
      - { name: status, type: enum, source: computed, default: OPEN, description: "Case lifecycle", constraints: "OPEN | ASSESSING | DELIBERATION | MONITORING | CLOSED" }
      - { name: assessment_round, type: integer, source: computed, default: 1, description: "Current deliberation round; incremented by reassess" }
      - { name: quorum_met, type: boolean, source: computed, default: false, description: "Output of calculation team_quorum_evaluation" }
      - { name: ballot_count_current_round, type: integer, source: computed, default: 0, description: "Count of TeamAssignment rows for this case with status ASSIGNED, role_on_team IN {LEAD, VOTING_MEMBER} and ballot_round == assessment_round" }
      - { name: interim_risk_score, type: number, source: computed, default: null, description: "INTERIM variant of calculation behavioral_risk_score (1 decimal)" }
      - { name: consensus_risk_score, type: number, source: computed, default: null, description: "CONSENSUS variant of calculation behavioral_risk_score (2 decimals)" }
      - { name: risk_band, type: enum, source: computed, default: null, description: "Band of consensus_risk_score when present, otherwise of interim_risk_score", constraints: "LOW | MODERATE | HIGH | IMMINENT | null" }
      - { name: disposition, type: enum, source: computed, default: null, description: "Decision recorded by the decide transition", constraints: "NO_THREAT | MONITOR | ELEVATED_RISK | IMMINENT_RISK | null" }
      - { name: override_justification, type: string, source: computed, default: null, description: "Justification supplied when disposition departs from the band mapping" }
      - { name: protection_window_start, type: datetime, source: computed, default: null, description: "Logical clock at decide, for dispositions other than NO_THREAT" }
      - { name: protection_window_end, type: datetime, source: computed, default: null, description: "protection_window_start + PROTECTION_WINDOW_DAYS (14)" }
      - { name: coverage_gap_hours, type: number, source: computed, default: 0, description: "Output of calculation protective_coverage_gap_hours (2 decimals)" }
      - { name: protection_status, type: enum, source: computed, default: NOT_APPLICABLE, description: "NOT_APPLICABLE when protected_employee_id is null or protection_window_start is null; GAP when coverage_gap_hours > 0; else COVERED", constraints: "NOT_APPLICABLE | COVERED | GAP" }
      - { name: open_action_count, type: integer, source: computed, default: 0, description: "Count of CaseAction rows for this case with action_class POST_INCIDENT and status IN {PENDING, OVERDUE}" }
      - { name: closure_summary, type: string, source: computed, default: null, description: "Narrative recorded by the close transition" }

  - name: TeamAssignment
    parent: null
    common_fields: true
    fields:
      - { name: case_id, type: string, source: input, description: "FK -> ThreatCase.id; case this seat belongs to" }
      - { name: member_employee_id, type: string, source: input, description: "FK -> Employee.id; seated employee" }
      - { name: discipline, type: enum, source: input, description: "Discipline represented by this seat", constraints: "HR | SECURITY | LEGAL | CLINICAL | OPERATIONS" }
      - { name: role_on_team, type: enum, source: input, description: "LEAD and VOTING_MEMBER vote and count toward quorum; ADVISOR does neither", constraints: "LEAD | VOTING_MEMBER | ADVISOR" }
      - { name: status, type: enum, source: computed, default: ASSIGNED, description: "Seat state", constraints: "ASSIGNED | RECUSED" }
      - { name: ballot_value, type: enum, source: computed, default: null, description: "Ballot cast in ballot_round", constraints: "NO_CONCERN | MONITOR | ELEVATED | IMMINENT | null" }
      - { name: ballot_round, type: integer, source: computed, default: null, description: "ThreatCase.assessment_round in force when the ballot was cast" }
      - { name: ballot_weight, type: number, source: computed, default: null, description: "DISCIPLINE_WEIGHT for this seat's discipline, pinned when the ballot is cast (3 decimals)" }
      - { name: ballot_share, type: number, source: computed, default: null, description: "Per-ballot rounded share from calculation behavioral_risk_score CONSENSUS variant (2 decimals)" }
      - { name: ballot_submitted_at, type: datetime, source: computed, default: null, description: "Logical clock at ballot time" }
      - { name: rationale, type: string, source: computed, default: null, description: "Ballot rationale text" }

  - name: CaseAction
    parent: null
    common_fields: true
    fields:
      - { name: case_id, type: string, source: input, description: "FK -> ThreatCase.id; owning case" }
      - { name: action_class, type: enum, source: input, description: "PROTECTIVE actions occupy an interval; POST_INCIDENT actions carry a due date", constraints: "PROTECTIVE | POST_INCIDENT" }
      - { name: action_type, type: enum, source: input, description: "PROTECTIVE: ACCESS_RESTRICTION | SCHEDULE_CHANGE | SECURITY_ESCORT | RESTRAINING_ORDER_SUPPORT. POST_INCIDENT: COUNSELING_REFERRAL | DEBRIEFING | LAW_ENFORCEMENT_COORDINATION | SAFETY_PLAN_REVIEW", constraints: "must belong to the action_class group" }
      - { name: subject_employee_id, type: string, source: input, description: "FK -> Employee.id; employee protected or restricted by the action" }
      - { name: work_area_id, type: string, source: input, default: null, description: "FK -> WorkArea.id; required for ACCESS_RESTRICTION, otherwise null" }
      - { name: escort_employee_id, type: string, source: input, default: null, description: "FK -> Employee.id; required for SECURITY_ESCORT, otherwise null" }
      - { name: assigned_employee_id, type: string, source: input, default: null, description: "FK -> Employee.id; required for POST_INCIDENT actions, otherwise null" }
      - { name: starts_at, type: datetime, source: input, default: null, description: "Interval start, required for PROTECTIVE actions" }
      - { name: ends_at, type: datetime, source: input, default: null, description: "Interval end (exclusive), required for PROTECTIVE actions" }
      - { name: due_at, type: datetime, source: input, default: null, description: "Deadline, required for POST_INCIDENT actions" }
      - { name: note, type: string, source: input, default: null, description: "Free-text justification" }
      - { name: status, type: enum, source: computed, default: null, description: "PROTECTIVE: SCHEDULED -> ACTIVE -> EXPIRED with REVOKED exit. POST_INCIDENT: PENDING -> COMPLETED with OVERDUE detour", constraints: "SCHEDULED | ACTIVE | EXPIRED | REVOKED | PENDING | COMPLETED | OVERDUE" }
      - { name: duration_minutes, type: integer, source: computed, default: 0, description: "(ends_at - starts_at) in whole minutes for PROTECTIVE actions, 0 for POST_INCIDENT actions" }
      - { name: completed_at, type: datetime, source: computed, default: null, description: "Logical clock at completion" }
      - { name: late_flag, type: boolean, source: computed, default: false, description: "True when completed_at > due_at" }
      - { name: revoked_at, type: datetime, source: computed, default: null, description: "Logical clock at revocation" }
      - { name: revocation_reason, type: string, source: computed, default: null, description: "Reason captured by the revoke transition" }
      - { name: auto_generated, type: boolean, source: computed, default: false, description: "True when the row was synthesised by a cascade rather than by POST /case-actions" }

  - name: ViolentIncidentLogEntry
    parent: null
    common_fields: false
    fields:
      - { name: worksite_id, type: string, source: computed, description: "FK -> Worksite.id; worksite the entry is logged against" }
      - { name: incident_report_id, type: string, source: computed, description: "FK -> IncidentReport.id; substantiated report" }
      - { name: case_id, type: string, source: computed, default: null, description: "FK -> ThreatCase.id; case whose decision produced the entry" }
      - { name: supersedes_entry_id, type: string, source: computed, default: null, description: "FK -> ViolentIncidentLogEntry.id; entry this amendment replaces" }
      - { name: incident_at, type: datetime, source: computed, description: "Required element: copied from IncidentReport.occurred_at" }
      - { name: work_area_name, type: string, source: computed, description: "Required element: WorkArea.name snapshot" }
      - { name: incident_type, type: enum, source: computed, description: "Required element: copied from IncidentReport.incident_type" }
      - { name: perpetrator_class, type: enum, source: computed, description: "Required element: STRANGER for TYPE_1_CRIMINAL, CLIENT for TYPE_2_CLIENT, COWORKER for TYPE_3_COWORKER with a non-null subject_employee_id, DOMESTIC_PARTNER for TYPE_4_DOMESTIC, UNKNOWN for TYPE_3_COWORKER with a null subject_employee_id", constraints: "CLIENT | COWORKER | STRANGER | DOMESTIC_PARTNER | UNKNOWN" }
      - { name: injury_level, type: enum, source: computed, description: "Required element: copied from IncidentReport.injury_level" }
      - { name: weapon_involved, type: boolean, source: computed, description: "Contextual detail copied from IncidentReport.weapon_involved; NOT one of the eight required regulatory elements" }
      - { name: law_enforcement_notified, type: boolean, source: computed, description: "Required element: true when a CaseAction with action_type LAW_ENFORCEMENT_COORDINATION and status IN {PENDING, OVERDUE, COMPLETED} exists for case_id at write time" }
      - { name: consequence_narrative, type: string, source: computed, default: null, description: "Required element: outcome and lost-time consequences; null until amended" }
      - { name: controls_summary, type: string, source: computed, default: null, description: "Required element: controls implemented after the incident; null until amended" }
      - { name: required_element_count_present, type: integer, source: computed, description: "Count of the eight required regulatory elements that are non-null on this row. The eight, in order: incident_at, work_area_name, incident_type, perpetrator_class, injury_level, law_enforcement_notified, consequence_narrative, controls_summary. An auto-appended entry therefore carries 6 (consequence_narrative and controls_summary are null until an amendment supplies them)", constraints: "0..8" }
      - { name: amendment_reason, type: string, source: computed, default: null, description: "Reason recorded on an amendment entry" }
      - { name: superseded_flag, type: boolean, source: computed, default: false, description: "Derived on read: true when another entry exists whose supersedes_entry_id equals this row's id" }
      - { name: retention_expiry_date, type: datetime, source: computed, description: "incident_at + RETENTION_YEARS (5)" }
      - { name: retention_status, type: enum, source: computed, default: ACTIVE, description: "Flipped to RETENTION_EXPIRED by the ops run when retention_expiry_date <= logical clock", constraints: "ACTIVE | RETENTION_EXPIRED" }

  - name: Drill
    parent: null
    common_fields: true
    fields:
      - { name: plan_id, type: string, source: input, description: "FK -> PreventionPlan.id; plan the drill exercises" }
      - { name: scenario_type, type: enum, source: input, description: "Drill scenario", constraints: "ACTIVE_ASSAILANT | DE_ESCALATION | LOCKDOWN | EVACUATION" }
      - { name: scheduled_at, type: datetime, source: input, description: "Planned execution time (ISO 8601 UTC)" }
      - { name: status, type: enum, source: computed, default: SCHEDULED, description: "Drill lifecycle", constraints: "SCHEDULED | EXECUTED | MISSED" }
      - { name: executed_at, type: datetime, source: computed, default: null, description: "Logical clock at execution" }
      - { name: participant_count, type: integer, source: computed, default: null, description: "Participants recorded by execute", constraints: "0..worksite.employee_count" }
      - { name: findings_count, type: integer, source: computed, default: null, description: "Findings recorded by execute", constraints: "0..50" }
      - { name: participation_pct, type: number, source: computed, default: null, description: "round(100 * participant_count / worksite.employee_count, 2)" }
      - { name: credited, type: boolean, source: computed, default: false, description: "True when status == EXECUTED AND participation_pct >= DRILL_CREDIT_MIN_PCT (60.00)" }

# =============================================================================
# 1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: PreventionPlan
    initial_state: DRAFT
    terminal_states: [SUPERSEDED]
    transitions:
      - from: DRAFT
        to: IN_REVIEW
        trigger: "POST /prevention-plans/{id}/submit"
        actor: SafetyOfficer
        preconditions:
          - "plan.status == DRAFT"
          - "at least one WorkArea exists for plan.worksite_id"
        side_effects:
          - "sets submitted_by_employee_id = X-User-ID of the caller"
          - "recomputes hazard_coverage_pct, training_compliance_pct, log_completeness_pct, unmitigated_hazard_count, overdue_action_count and calculation inspection_readiness_score"
          - "compliance_posture stays FROZEN (status IN {DRAFT, IN_REVIEW}); inspection_ready forced false"
      - from: REVIEW_DUE
        to: IN_REVIEW
        trigger: "POST /prevention-plans/{id}/submit"
        actor: SafetyOfficer
        preconditions:
          - "plan.status == REVIEW_DUE"
        side_effects:
          - "sets submitted_by_employee_id = X-User-ID of the caller"
          - "clears activated_by_employee_id and review_due_date"
          - "compliance_posture transitions RESTRICTED -> FROZEN, so POST /case-actions on cases pointing at this plan is rejected with ERR_PLAN_POSTURE_FROZEN"
        note: "Periodic-review re-entry closes the DRAFT/REVIEW_DUE <-> IN_REVIEW cycle."
      - from: IN_REVIEW
        to: DRAFT
        trigger: "POST /prevention-plans/{id}/return-for-revision"
        actor: SiteManager
        preconditions:
          - "plan.status == IN_REVIEW"
        side_effects:
          - "clears submitted_by_employee_id so the next submit re-stamps the segregation-of-duties baseline"
        note: "Revision loop; a plan may cycle DRAFT -> IN_REVIEW -> DRAFT any number of times."
      - from: IN_REVIEW
        to: ACTIVE
        trigger: "POST /prevention-plans/{id}/activate"
        actor: SiteManager
        preconditions:
          - "plan.status == IN_REVIEW"
          - "X-User-ID != plan.submitted_by_employee_id (segregation of duties)"
          - "plan.hazard_coverage_pct == 100.00"
          - "plan.training_compliance_pct >= TRAINING_COMPLIANCE_MIN_PCT (80.00)"
        side_effects:
          - "sets activated_by_employee_id = X-User-ID, activated_at = logical clock, review_due_date = activated_at + review_interval_days"
          - "cascade link 1: every other PreventionPlan for the same worksite_id with status IN {ACTIVE, REVIEW_DUE} transitions to SUPERSEDED"
          - "cascade link 2: because that prior plan became SUPERSEDED its compliance_posture becomes FROZEN and its inspection_ready becomes false"
          - "recomputes WorkArea.current_hazard_score for every work area of the worksite (the ACTIVE plan changed)"
          - "recomputes calculation inspection_readiness_score and compliance_posture for this plan"
      - from: ACTIVE
        to: REVIEW_DUE
        trigger: "system: POST /_ops/daily-run step 8 when review_due_date <= logical clock"
        actor: system
        preconditions:
          - "plan.status == ACTIVE"
          - "plan.review_due_date <= logical clock"
        side_effects:
          - "compliance_posture becomes RESTRICTED"
          - "inspection_ready re-evaluated against the RESTRICTED threshold (85.00)"
      - from: ACTIVE
        to: REVIEW_DUE
        trigger: "system: cascade from ViolentIncidentLogEntry append when Worksite.high_risk_flag flips false -> true"
        actor: system
        preconditions:
          - "plan.status == ACTIVE"
          - "worksite.high_risk_flag == true"
        side_effects:
          - "compliance_posture becomes RESTRICTED"
          - "inspection_ready re-evaluated against the RESTRICTED threshold (85.00)"
        note: "Link 4 of the decide cascade; see ThreatCase DELIBERATION -> MONITORING."
      - from: ACTIVE
        to: SUPERSEDED
        trigger: "system: cascade from POST /prevention-plans/{other}/activate for the same worksite"
        actor: system
        preconditions: ["plan.status IN {ACTIVE, REVIEW_DUE}"]
        side_effects:
          - "compliance_posture becomes FROZEN; inspection_ready becomes false"
          - "cases whose plan_id points here can no longer receive CaseAction rows (ERR_PLAN_POSTURE_FROZEN)"
      - from: REVIEW_DUE
        to: SUPERSEDED
        trigger: "system: cascade from POST /prevention-plans/{other}/activate for the same worksite"
        actor: system
        preconditions: ["plan.status IN {ACTIVE, REVIEW_DUE}"]
        side_effects: ["compliance_posture becomes FROZEN; inspection_ready becomes false"]

  - entity: IncidentReport
    initial_state: NEW
    terminal_states: [CLOSED_NO_ACTION, SUBSTANTIATED]
    note: "Dimension 1 of 2 — field triage_status. Evolves independently of retaliation_status."
    transitions:
      - from: NEW
        to: ESCALATED
        trigger: "POST /incident-reports/{id}/triage with disposition ESCALATE"
        actor: SafetyOfficer
        preconditions:
          - "report.triage_status == NEW"
        side_effects:
          - "sets triaged_by_employee_id = X-User-ID"
          - "recomputes severity_points, severity_class and log_required from the stored inputs"
      - from: NEW
        to: CLOSED_NO_ACTION
        trigger: "POST /incident-reports/{id}/triage with disposition NO_ACTION"
        actor: SafetyOfficer
        preconditions:
          - "report.triage_status == NEW"
          - "report.severity_class == MINOR"
        side_effects:
          - "sets triaged_by_employee_id = X-User-ID; no ThreatCase may be opened afterwards"
        note: "Branch point: the two triage dispositions produce disjoint side-effect sets."
      - from: ESCALATED
        to: SUBSTANTIATED
        trigger: "system: cascade from POST /threat-cases/{id}/decide with disposition IN {MONITOR, ELEVATED_RISK, IMMINENT_RISK}"
        actor: system
        preconditions: ["report.triage_status == ESCALATED"]
        side_effects:
          - "cascade link 3: because the report became SUBSTANTIATED and log_required == true, one ViolentIncidentLogEntry is appended and Worksite.violent_incident_count_12mo is recomputed"
          - "cascade link 4: because that count reached WORKSITE_HIGH_RISK_INCIDENT_THRESHOLD, worksite.high_risk_flag flips true and the worksite's ACTIVE plan transitions to REVIEW_DUE"
      - from: ESCALATED
        to: CLOSED_NO_ACTION
        trigger: "system: cascade from POST /threat-cases/{id}/decide with disposition NO_THREAT"
        actor: system
        preconditions: ["report.triage_status == ESCALATED"]
        side_effects:
          - "no ViolentIncidentLogEntry is appended and Worksite.violent_incident_count_12mo is unchanged"

  - entity: IncidentReport
    initial_state: NOT_ALLEGED
    terminal_states: [SUBSTANTIATED, UNSUBSTANTIATED]
    note: "Dimension 2 of 2 — field retaliation_status. A report may sit in triage_status SUBSTANTIATED while retaliation_status is still NOT_ALLEGED, and vice versa."
    transitions:
      - from: NOT_ALLEGED
        to: ALLEGED
        trigger: "POST /incident-reports/{id}/retaliation-updates with action ALLEGE"
        actor: Employee
        preconditions:
          - "report.retaliation_status == NOT_ALLEGED"
          - "report.reporter_employee_id is not null"
          - "X-User-ID == report.reporter_employee_id when the caller role is Employee"
        side_effects:
          - "sets retaliation_claimant_employee_id = report.reporter_employee_id"
          - "anti-retaliation hold engages: POST /case-actions with action_type IN {SCHEDULE_CHANGE, ACCESS_RESTRICTION} and subject_employee_id == reporter is rejected with ERR_ANTI_RETALIATION_HOLD"
      - from: ALLEGED
        to: UNDER_REVIEW
        trigger: "POST /incident-reports/{id}/retaliation-updates with action OPEN_REVIEW"
        actor: HRPartner
        preconditions: ["report.retaliation_status == ALLEGED"]
        side_effects: ["anti-retaliation hold remains engaged"]
      - from: UNDER_REVIEW
        to: SUBSTANTIATED
        trigger: "POST /incident-reports/{id}/retaliation-updates with action SUBSTANTIATE"
        actor: HRPartner
        preconditions: ["report.retaliation_status == UNDER_REVIEW"]
        side_effects:
          - "anti-retaliation hold becomes permanent: adverse actions against the claimant remain rejected in every later state"
      - from: UNDER_REVIEW
        to: UNSUBSTANTIATED
        trigger: "POST /incident-reports/{id}/retaliation-updates with action DISMISS"
        actor: HRPartner
        preconditions: ["report.retaliation_status IN {ALLEGED, UNDER_REVIEW}"]
        side_effects: ["anti-retaliation hold releases: adverse CaseAction rows against the claimant become creatable again"]
      - from: ALLEGED
        to: UNSUBSTANTIATED
        trigger: "POST /incident-reports/{id}/retaliation-updates with action DISMISS"
        actor: HRPartner
        preconditions: ["report.retaliation_status IN {ALLEGED, UNDER_REVIEW}"]
        side_effects: ["anti-retaliation hold releases"]

  - entity: ThreatCase
    initial_state: OPEN
    terminal_states: [CLOSED]
    transitions:
      - from: OPEN
        to: ASSESSING
        trigger: "POST /threat-cases/{id}/convene"
        actor: ThreatTeamLead
        preconditions:
          - "case.status == OPEN"
          - "calculation team_quorum_evaluation returns quorum_met == true"
          - "the plan referenced by case.plan_id has status IN {ACTIVE, REVIEW_DUE}"
        side_effects:
          - "computes calculation behavioral_risk_score INTERIM variant into interim_risk_score and sets risk_band from it"
          - "sets assessment_round = 1"
      - from: ASSESSING
        to: DELIBERATION
        trigger: "system: auto-transition on the POST /threat-cases/{id}/ballots call that makes ballot_count_current_round equal the number of ASSIGNED seats with role_on_team IN {LEAD, VOTING_MEMBER}"
        actor: system
        preconditions:
          - "case.status == ASSESSING"
          - "every ASSIGNED voting seat has ballot_round == case.assessment_round"
        side_effects:
          - "no score is computed yet; consensus_risk_score stays null until decide"
        note: "Compound/aggregate transition: the parent's state is a function of its TeamAssignment children."
      - from: DELIBERATION
        to: ASSESSING
        trigger: "POST /threat-cases/{id}/reassess"
        actor: ThreatTeamLead
        preconditions:
          - "case.status == DELIBERATION"
          - "case.assessment_round < MAX_ASSESSMENT_ROUNDS (3)"
        side_effects:
          - "increments assessment_round by 1"
          - "clears ballot_value, ballot_round, ballot_weight, ballot_share, ballot_submitted_at and rationale on every TeamAssignment of this case, so ballot_count_current_round returns to 0"
          - "leaves interim_risk_score untouched and consensus_risk_score null"
        note: "Cycle: DELIBERATION -> ASSESSING -> DELIBERATION may repeat until assessment_round == 3."
      - from: DELIBERATION
        to: MONITORING
        trigger: "POST /threat-cases/{id}/decide with disposition IN {MONITOR, ELEVATED_RISK, IMMINENT_RISK}"
        actor: ThreatTeamLead
        preconditions:
          - "case.status == DELIBERATION"
          - "disposition matches the risk_band mapping of calculation behavioral_risk_score CONSENSUS variant, or override_justification is supplied and permitted"
        side_effects:
          - "computes calculation behavioral_risk_score CONSENSUS variant into consensus_risk_score, refreshes risk_band and writes TeamAssignment.ballot_share for each counted seat"
          - "sets protection_window_start = logical clock and protection_window_end = start + PROTECTION_WINDOW_DAYS (14)"
          - "recomputes calculation protective_coverage_gap_hours: with no PROTECTIVE CaseAction rows the whole window is a gap and protection_status becomes GAP"
          - "cascade link 1 (ELEVATED_RISK / IMMINENT_RISK / MONITOR): the linked IncidentReport transitions ESCALATED -> SUBSTANTIATED"
          - "cascade link 2: because the report became SUBSTANTIATED with log_required == true, one ViolentIncidentLogEntry is appended with required_element_count_present == 6"
          - "cascade link 3: because that entry exists, Worksite.violent_incident_count_12mo increments and high_risk_flag flips true at threshold 1"
          - "cascade link 4: because high_risk_flag flipped, the worksite plan transitions ACTIVE -> REVIEW_DUE, its compliance_posture becomes RESTRICTED and inspection_ready is re-evaluated against 85.00"
      - from: DELIBERATION
        to: CLOSED
        trigger: "POST /threat-cases/{id}/decide with disposition NO_THREAT"
        actor: ThreatTeamLead
        preconditions:
          - "case.status == DELIBERATION"
          - "risk_band == LOW after the CONSENSUS computation, or override_justification is supplied and permitted"
        side_effects:
          - "computes consensus_risk_score and risk_band"
          - "linked IncidentReport transitions ESCALATED -> CLOSED_NO_ACTION; no log entry is appended and no protection window is opened"
          - "protection_status stays NOT_APPLICABLE and coverage_gap_hours stays 0.00"
        note: "Branch: the NO_THREAT arm skips the entire log/worksite/plan cascade that the other arm runs."
      - from: MONITORING
        to: CLOSED
        trigger: "POST /threat-cases/{id}/close"
        actor: ThreatTeamLead
        preconditions:
          - "case.status == MONITORING"
          - "case.open_action_count == 0"
          - "every non-superseded ViolentIncidentLogEntry with case_id == case.id has required_element_count_present == 8"
        side_effects:
          - "records closure_summary"
          - "every PROTECTIVE CaseAction of this case with status IN {SCHEDULED, ACTIVE} transitions to REVOKED, crediting Employee.escort_committed_minutes and decrementing WorkArea.restricted_employee_count / Employee.active_restriction_count"
          - "recomputes coverage_gap_hours and sets protection_status to NOT_APPLICABLE"

  - entity: CaseAction
    initial_state: SCHEDULED
    terminal_states: [EXPIRED, REVOKED, COMPLETED]
    note: "PROTECTIVE rows start SCHEDULED; POST_INCIDENT rows start PENDING (set at creation from action_class)."
    transitions:
      - from: SCHEDULED
        to: ACTIVE
        trigger: "system: POST /_ops/daily-run step 3 when starts_at <= logical clock < ends_at"
        actor: system
        preconditions: ["action.action_class == PROTECTIVE", "action.status == SCHEDULED"]
        side_effects: ["no ledger movement: SCHEDULED and ACTIVE are both inside the conserved set"]
      - from: ACTIVE
        to: EXPIRED
        trigger: "system: POST /_ops/daily-run step 3 when ends_at <= logical clock"
        actor: system
        preconditions: ["action.status IN {SCHEDULED, ACTIVE}", "action.ends_at <= logical clock"]
        side_effects:
          - "SECURITY_ESCORT: decrements escort_employee.escort_committed_minutes by duration_minutes"
          - "ACCESS_RESTRICTION: decrements work_area.restricted_employee_count and subject_employee.active_restriction_count by 1"
          - "recomputes ThreatCase.coverage_gap_hours and protection_status for the owning case"
      - from: SCHEDULED
        to: EXPIRED
        trigger: "system: POST /_ops/daily-run step 3 when ends_at <= logical clock"
        actor: system
        preconditions: ["action.status == SCHEDULED", "action.ends_at <= logical clock"]
        side_effects: ["same ledger credits as ACTIVE -> EXPIRED"]
      - from: SCHEDULED
        to: REVOKED
        trigger: "POST /case-actions/{id}/revoke"
        actor: SecurityCoordinator
        preconditions: ["action.action_class == PROTECTIVE", "action.status IN {SCHEDULED, ACTIVE}"]
        side_effects: ["identical to the ACTIVE -> REVOKED arm"]
      - from: ACTIVE
        to: REVOKED
        trigger: "POST /case-actions/{id}/revoke"
        actor: SecurityCoordinator
        preconditions: ["action.action_class == PROTECTIVE", "action.status IN {SCHEDULED, ACTIVE}"]
        side_effects:
          - "sets revoked_at and revocation_reason"
          - "compensation link 1: SECURITY_ESCORT credits escort_employee.escort_committed_minutes back by exactly duration_minutes; ACCESS_RESTRICTION decrements work_area.restricted_employee_count and subject_employee.active_restriction_count by 1"
          - "cascade link 2: because the interval left the conserved set, calculation protective_coverage_gap_hours is recomputed for the owning case and protection_status may flip COVERED -> GAP"
          - "cascade link 3: because protection_status became GAP while the case is MONITORING, one POST_INCIDENT CaseAction with action_type SAFETY_PLAN_REVIEW, auto_generated true, assigned_employee_id = case.lead_employee_id and due_at = logical clock + 24h is appended, raising ThreatCase.open_action_count"
          - "cascade link 4: because open_action_count > 0, POST /threat-cases/{id}/close is rejected with ERR_OPEN_ACTIONS_BLOCK_CLOSE"
      - from: PENDING
        to: OVERDUE
        trigger: "system: POST /_ops/daily-run step 4 when due_at < logical clock"
        actor: system
        preconditions: ["action.action_class == POST_INCIDENT", "action.status == PENDING"]
        side_effects:
          - "increments PreventionPlan.overdue_action_count for the plan of the owning case and re-runs calculation inspection_readiness_score"
      - from: PENDING
        to: COMPLETED
        trigger: "POST /case-actions/{id}/complete"
        actor: HRPartner
        preconditions: ["action.action_class == POST_INCIDENT", "action.status IN {PENDING, OVERDUE}"]
        side_effects:
          - "sets completed_at = logical clock and late_flag = completed_at > due_at"
          - "decrements ThreatCase.open_action_count"
      - from: OVERDUE
        to: COMPLETED
        trigger: "POST /case-actions/{id}/complete"
        actor: HRPartner
        preconditions: ["action.action_class == POST_INCIDENT", "action.status IN {PENDING, OVERDUE}"]
        side_effects:
          - "sets completed_at, late_flag true"
          - "decrements PreventionPlan.overdue_action_count and re-runs calculation inspection_readiness_score"

  - entity: TrainingAssignment
    initial_state: ASSIGNED
    terminal_states: [SUPERSEDED]
    transitions:
      - from: ASSIGNED
        to: COMPLETED
        trigger: "POST /training-assignments/{id}/complete"
        actor: Employee
        preconditions:
          - "assignment.status == ASSIGNED"
          - "score >= module.passing_score"
          - "X-User-ID == assignment.employee_id when the caller role is Employee"
        side_effects:
          - "sets completed_at = logical clock, expires_at = completed_at + module.refresh_interval_days, scenario_set_version = module.scenario_set_version (version pinning), increments attempt_count"
          - "recomputes Employee.training_current"
          - "recomputes calculation training_compliance_pct and calculation inspection_readiness_score for every PreventionPlan of the employee's worksite with status != SUPERSEDED"
      - from: ASSIGNED
        to: EXPIRED
        trigger: "system: POST /_ops/daily-run step 1 when due_at < logical clock"
        actor: system
        preconditions: ["assignment.status == ASSIGNED", "assignment.due_at < logical clock"]
        side_effects: ["recomputes Employee.training_current and the worksite plans' training_compliance_pct / readiness"]
      - from: COMPLETED
        to: EXPIRED
        trigger: "system: POST /_ops/daily-run step 1 when expires_at <= logical clock"
        actor: system
        preconditions: ["assignment.status == COMPLETED", "assignment.expires_at <= logical clock"]
        side_effects:
          - "recomputes Employee.training_current (annual refresh lapses)"
          - "an escort whose required_for_escort module lapsed can no longer be named on a new SECURITY_ESCORT action (ERR_ESCORT_NOT_QUALIFIED)"
      - from: ASSIGNED
        to: SUPERSEDED
        trigger: "POST /training-assignments (annual refresh) for the same employee_id and module_id"
        actor: HRPartner
        preconditions: ["prior assignment.status IN {ASSIGNED, COMPLETED, EXPIRED}"]
        side_effects: ["prior row becomes SUPERSEDED and stops counting toward training_compliance_pct"]
      - from: COMPLETED
        to: SUPERSEDED
        trigger: "POST /training-assignments (annual refresh) for the same employee_id and module_id"
        actor: HRPartner
        preconditions: ["prior assignment.status IN {ASSIGNED, COMPLETED, EXPIRED}"]
        side_effects: ["prior row becomes SUPERSEDED; Employee.version increments by 1 on the create"]
      - from: EXPIRED
        to: SUPERSEDED
        trigger: "POST /training-assignments (annual refresh) for the same employee_id and module_id"
        actor: HRPartner
        preconditions: ["prior assignment.status IN {ASSIGNED, COMPLETED, EXPIRED}"]
        side_effects: ["prior row becomes SUPERSEDED"]

  - entity: HazardAssessment
    initial_state: SCREENING
    terminal_states: [SUPERSEDED]
    transitions:
      - from: SCREENING
        to: VALIDATED
        trigger: "POST /hazard-assessments/{id}/validate"
        actor: SiteManager
        preconditions:
          - "assessment.status == SCREENING"
          - "X-User-ID != assessment.authored_by_employee_id (segregation of duties)"
          - "the plan referenced by assessment.plan_id has status IN {DRAFT, IN_REVIEW, ACTIVE, REVIEW_DUE}"
        side_effects:
          - "sets validated_by_employee_id, walkthrough_note, mitigation_credits and barrier_installed from the request"
          - "recomputes hazard_score under the VALIDATED variant, sets score_variant = VALIDATED, refreshes control_tier and mitigation_verified"
          - "recomputes WorkArea.current_hazard_score, PreventionPlan.unmitigated_hazard_count and calculation inspection_readiness_score"
      - from: SCREENING
        to: SUPERSEDED
        trigger: "POST /hazard-assessments for the same plan_id and work_area_id"
        actor: SafetyOfficer
        preconditions: ["prior assessment.status IN {SCREENING, VALIDATED}"]
        side_effects: ["prior row becomes SUPERSEDED; PreventionPlan.version increments by 1 on the create"]
      - from: VALIDATED
        to: SUPERSEDED
        trigger: "POST /hazard-assessments for the same plan_id and work_area_id"
        actor: SafetyOfficer
        preconditions: ["prior assessment.status IN {SCREENING, VALIDATED}"]
        side_effects:
          - "prior row becomes SUPERSEDED and stops counting toward hazard_coverage_pct and unmitigated_hazard_count"
          - "WorkArea.current_hazard_score switches to the new SCREENING row's score"

  - entity: Drill
    initial_state: SCHEDULED
    terminal_states: [EXECUTED, MISSED]
    transitions:
      - from: SCHEDULED
        to: EXECUTED
        trigger: "POST /drills/{id}/execute"
        actor: SafetyOfficer
        preconditions:
          - "drill.status == SCHEDULED"
          - "participant_count <= worksite.employee_count"
          - "the plan referenced by drill.plan_id has status != SUPERSEDED"
        side_effects:
          - "sets executed_at = logical clock, participant_count, findings_count, participation_pct and credited (participation_pct >= 60.00)"
          - "when credited, increments PreventionPlan.drills_completed_12mo and re-runs calculation inspection_readiness_score"
      - from: SCHEDULED
        to: MISSED
        trigger: "system: POST /_ops/daily-run step 2 when scheduled_at < logical clock"
        actor: system
        preconditions: ["drill.status == SCHEDULED", "drill.scheduled_at < logical clock"]
        side_effects: ["drills_completed_12mo unchanged; readiness drill_component may drop on the next recompute"]

  - entity: Employee
    initial_state: ACTIVE
    terminal_states: [SEPARATED]
    transitions:
      - from: ACTIVE
        to: SEPARATED
        trigger: "POST /employees/{id}/separate"
        actor: HRPartner
        preconditions:
          - "employee.employment_status == ACTIVE"
        side_effects:
          - "sets separated_at = logical clock"
          - "cascade link 1: every CaseAction with escort_employee_id == this employee and status IN {SCHEDULED, ACTIVE} transitions to REVOKED, crediting escort_committed_minutes back to 0"
          - "cascade link 2: because those escort intervals left the conserved set, calculation protective_coverage_gap_hours is recomputed for each affected ThreatCase and protection_status may flip COVERED -> GAP"
          - "cascade link 3: because protection_status became GAP on a MONITORING case, an auto_generated SAFETY_PLAN_REVIEW POST_INCIDENT CaseAction is appended (due_at = clock + 24h), raising ThreatCase.open_action_count"
          - "cascade link 4: because open_action_count > 0, close is rejected with ERR_OPEN_ACTIONS_BLOCK_CLOSE"
          - "every TeamAssignment with member_employee_id == this employee and status ASSIGNED becomes RECUSED with its ballot fields cleared, and each affected case's quorum_met and ballot_count_current_round are recomputed"
          - "the employee leaves the training_compliance_pct denominator, so every non-SUPERSEDED plan of the worksite is recomputed"

# =============================================================================
# 1.2.1 Concurrency Rules (OCC on the parent's version — §1.2.1)
# =============================================================================
concurrency_rules:
  - rule_id: hazard-assessment-create-stale-plan
    parent_entity: PreventionPlan
    write_endpoint: "POST /hazard-assessments"
    occ_field: "expected_plan_version"
    description: |
      Creating a HazardAssessment for a (plan_id, work_area_id) pair legitimately
      supersedes the pair's prior non-SUPERSEDED assessment. A create whose
      expected_plan_version no longer equals PreventionPlan.version is rejected:
      the client's view of the plan is stale, so the supersede it is asking for
      would discard an assessment it has never seen.
    error_id: ERR_STALE_PLAN_VERSION
    http_status: 412
  - rule_id: training-assignment-create-stale-employee
    parent_entity: Employee
    write_endpoint: "POST /training-assignments"
    occ_field: "expected_employee_version"
    description: |
      Creating a TrainingAssignment for an (employee_id, module_id) pair
      supersedes that pair's prior assignment as the annual refresh. A create
      whose expected_employee_version no longer equals Employee.version is
      rejected, because the learner record has advanced (a prior refresh, a
      completion or a separation) since the client last read it.
    error_id: ERR_STALE_EMPLOYEE_VERSION
    http_status: 412

# =============================================================================
# 1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: hazard_score
    description: |
      Per-work-area workplace-violence hazard score for one HazardAssessment.
      Six additive risk terms, each individually clamped, are summed; a
      lone-worker floor is then applied with max(), and the result is capped
      with min(). The VALIDATED variant subtracts verified mitigation credit
      from the same base. Drives control_tier and PreventionPlan.unmitigated_hazard_count.
    trigger: "POST /hazard-assessments (SCREENING variant); POST /hazard-assessments/{id}/validate (VALIDATED variant)"
    inputs:
      - "HazardAssessment.reported_incident_count"
      - "HazardAssessment.min_staff_per_shift"
      - "HazardAssessment.cash_on_hand_cents"
      - "HazardAssessment.proximity_factor"
      - "WorkArea.public_access_flag"
      - "WorkArea.night_shift_flag"
      - "WorkArea.lone_worker_flag"
      - "HazardAssessment.mitigation_credits (VALIDATED only)"
      - "HazardAssessment.barrier_installed (VALIDATED only)"
    algorithm: weighted_scoring
    formula: |
      # --- term construction (all six terms always evaluated) ---
      incident_term  = min(reported_incident_count, INCIDENT_TERM_CAP_COUNT) * INCIDENT_TERM_POINTS_EACH
      proximity_term = PROXIMITY_POINTS[assessment.proximity_factor]   # LOW 0 | MODERATE 8 | HIGH 20
      cash_term      = min(CASH_TERM_MAX_POINTS,
                           floor(cash_on_hand_cents / CASH_TERM_BRACKET_CENTS) * CASH_TERM_POINTS_PER_BRACKET)
      staffing_term  = STAFFING_SOLO_POINTS if min_staff_per_shift <= 1
                       else STAFFING_PAIR_POINTS if min_staff_per_shift == 2
                       else 0
      exposure_term  = PUBLIC_ACCESS_POINTS if work_area.public_access_flag else 0
      night_term     = NIGHT_OPERATIONS_POINTS if work_area.night_shift_flag else 0

      raw = incident_term + proximity_term + cash_term + staffing_term + exposure_term + night_term

      # --- nested clamps: the floor is applied BEFORE the cap ---
      if work_area.lone_worker_flag:
          raw = max(raw, LONE_WORKER_FLOOR_POINTS)
      base = min(HAZARD_SCORE_CAP, raw)

      # --- variant split ---
      if variant == SCREENING:
          hazard_score = round(base, 2)
          mitigation_verified = false
      else:  # VALIDATED
          credit = min(mitigation_credits, MITIGATION_CREDIT_CAP_COUNT) * MITIGATION_CREDIT_POINTS_EACH
                   + (BARRIER_CREDIT_POINTS if barrier_installed else 0)
          hazard_score = round(max(0, base - credit), 2)
          mitigation_verified = (mitigation_credits >= 1) or barrier_installed

      control_tier = TIER_1_ENGINEERING      if hazard_score >= CONTROL_TIER_1_MIN
                     else TIER_2_ADMINISTRATIVE if hazard_score >= CONTROL_TIER_2_MIN
                     else TIER_3_TRAINING_ONLY

      # Worked fixtures (pinned):
      #  A) prior=4, HIGH, cash=0, staff=2, public=true, night=true, lone=false
      #     terms 20+20+0+6+10+8 = 74? no: 20+20+0+6+10+8 = 64  -> base 64
      #     SCREENING  -> 64.00, TIER_1_ENGINEERING
      #     VALIDATED with mitigation_credits=3, barrier_installed=true
      #        credit = 3*5 + 10 = 25 -> 39.00, TIER_2_ADMINISTRATIVE (delta 25.00)
      #  B) prior=0, MODERATE, cash=0, staff=3, public=false, night=false, lone=true
      #     terms 0+8+0+0+0+0 = 8 -> lone floor -> max(8,45) = 45 -> 45.00,
      #     TIER_2_ADMINISTRATIVE. Without the floor the score would be 8.00 /
      #     TIER_3_TRAINING_ONLY, so the floor changes the tier.
      #  C) prior=6, HIGH, cash=0, staff=1, public=true, night=true, lone=false
      #     terms 30+20+0+12+10+8 = 80 -> 80.00, TIER_1_ENGINEERING
      #     VALIDATED with mitigation_credits=0, barrier_installed=false
      #        credit = 0 -> 80.00, mitigation_verified = false (still unmitigated TIER_1)
      #     VALIDATED with mitigation_credits=6, barrier_installed=true
      #        credit = min(6,4)*5 + 10 = 30 -> 50.00 (the credit cap binds)
      #  D) prior=8, HIGH, cash=30000000, staff=1, public=true, night=true, lone=false
      #     terms 40+20+20+12+10+8 = 110 -> min(100,110) = 100.00 (cash bracket cap
      #     already bound: floor(30000000/5000000)*4 = 24 -> min(20,24) = 20)
    constants:
      INCIDENT_TERM_CAP_COUNT: 8
      INCIDENT_TERM_POINTS_EACH: 5
      PROXIMITY_POINTS_LOW: 0
      PROXIMITY_POINTS_MODERATE: 8
      PROXIMITY_POINTS_HIGH: 20
      CASH_TERM_BRACKET_CENTS: 5000000
      CASH_TERM_POINTS_PER_BRACKET: 4
      CASH_TERM_MAX_POINTS: 20
      STAFFING_SOLO_POINTS: 12
      STAFFING_PAIR_POINTS: 6
      PUBLIC_ACCESS_POINTS: 10
      NIGHT_OPERATIONS_POINTS: 8
      LONE_WORKER_FLOOR_POINTS: 45
      HAZARD_SCORE_CAP: 100
      MITIGATION_CREDIT_CAP_COUNT: 4
      MITIGATION_CREDIT_POINTS_EACH: 5
      BARRIER_CREDIT_POINTS: 10
      CONTROL_TIER_1_MIN: 60
      CONTROL_TIER_2_MIN: 35
    precision: "2 decimal places, round_half_up"
    variants:
      - name: SCREENING
        when: "HazardAssessment is created (status SCREENING); mitigation inputs are not yet trusted"
        difference: "No mitigation credit is subtracted; mitigation_verified is forced false."
      - name: VALIDATED
        when: "POST /hazard-assessments/{id}/validate by a SiteManager other than the author"
        difference: "credit = min(mitigation_credits,4)*5 + (10 if barrier_installed) is subtracted from the same base and floored at 0; mitigation_verified is derived."

  - name: incident_severity_classification
    description: |
      Classifies an IncidentReport from weapon involvement, injury level and
      incident type, and decides whether the violent incident log must receive
      an entry when the report is later substantiated.
    trigger: "POST /incident-reports; recomputed on POST /incident-reports/{id}/triage"
    inputs:
      - "IncidentReport.weapon_involved"
      - "IncidentReport.injury_level"
      - "IncidentReport.incident_type"
    algorithm: threshold
    formula: |
      severity_points = (WEAPON_POINTS if weapon_involved else 0)
                      + INJURY_POINTS[injury_level]      # NONE 0 | FIRST_AID 8 | MEDICAL_TREATMENT 18 | LOST_TIME 28 | FATALITY 40
                      + TYPE_POINTS[incident_type]       # TYPE_1_CRIMINAL 10 | TYPE_2_CLIENT 6 | TYPE_3_COWORKER 12 | TYPE_4_DOMESTIC 8

      severity_class = CRITICAL if severity_points >= SEVERITY_CRITICAL_MIN
                       else SERIOUS if severity_points >= SEVERITY_SERIOUS_MIN
                       else MINOR

      log_required = (severity_class != MINOR) or weapon_involved or (injury_level != NONE)

      # Worked fixtures (pinned):
      #   weapon=true,  FIRST_AID,         TYPE_3_COWORKER -> 30+8+12 = 50  CRITICAL, log_required true
      #   weapon=false, NONE,              TYPE_2_CLIENT   -> 0+0+6   = 6   MINOR,    log_required false
      #   weapon=false, MEDICAL_TREATMENT, TYPE_2_CLIENT   -> 0+18+6  = 24  SERIOUS,  log_required true
      #   weapon=true,  NONE,              TYPE_1_CRIMINAL -> 30+0+10 = 40  CRITICAL  (exactly at SEVERITY_CRITICAL_MIN)
      #   weapon=false, FIRST_AID,         TYPE_3_COWORKER -> 0+8+12  = 20  SERIOUS   (exactly at SEVERITY_SERIOUS_MIN)
      #   weapon=false, NONE,              TYPE_4_DOMESTIC -> 0+0+8   = 8   MINOR,    log_required false
    constants:
      WEAPON_POINTS: 30
      INJURY_POINTS_NONE: 0
      INJURY_POINTS_FIRST_AID: 8
      INJURY_POINTS_MEDICAL_TREATMENT: 18
      INJURY_POINTS_LOST_TIME: 28
      INJURY_POINTS_FATALITY: 40
      TYPE_POINTS_TYPE_1_CRIMINAL: 10
      TYPE_POINTS_TYPE_2_CLIENT: 6
      TYPE_POINTS_TYPE_3_COWORKER: 12
      TYPE_POINTS_TYPE_4_DOMESTIC: 8
      SEVERITY_SERIOUS_MIN: 20
      SEVERITY_CRITICAL_MIN: 40
    precision: "integer points; classification is exact comparison"

  - name: behavioral_risk_score
    description: |
      Multidisciplinary behavioral risk evaluation for a ThreatCase. The INTERIM
      variant is computed from the incident alone when the team convenes; the
      CONSENSUS variant blends that interim score with the discipline-weighted
      team ballot and is what the final disposition must match.
    trigger: "POST /threat-cases/{id}/convene (INTERIM); POST /threat-cases/{id}/decide (CONSENSUS)"
    inputs:
      - "IncidentReport.severity_points"
      - "IncidentReport.weapon_involved"
      - "ThreatCase.subject_employee_id (prior_case_count is derived from it)"
      - "ThreatCase.interim_risk_score"
      - "ThreatCase.assessment_round"
      - "TeamAssignment.discipline, role_on_team, status, ballot_value, ballot_round"
    algorithm: weighted_scoring
    formula: |
      # ---------------- INTERIM ----------------
      # prior_case_count is DERIVED, not stored: how many earlier cases already
      # named this subject. Ordering uses created_at only — never id.
      prior_case_count = count(other ThreatCase c where
                                 c.subject_employee_id == case.subject_employee_id
                                 and c.subject_employee_id is not null
                                 and c.created_at < case.created_at)

      interim_risk_score = round(
          min(RISK_SCORE_CAP,
              INTERIM_SEVERITY_COEFFICIENT * report.severity_points
            + PRIOR_CASE_POINTS_EACH * min(prior_case_count, PRIOR_CASE_CAP_COUNT)
            + (INTERIM_WEAPON_POINTS if report.weapon_involved else 0)),
          2)

      # ---------------- CONSENSUS ----------------
      counted = TeamAssignment rows of this case with
                  status == ASSIGNED
                  AND role_on_team IN (LEAD, VOTING_MEMBER)
                  AND ballot_round == case.assessment_round
      # W is the EXACT unrounded sum of discipline weights.
      W = sum(DISCIPLINE_WEIGHT[a.discipline] for a in counted)

      # MANDATORY ORDER: round each ballot's share to 2dp FIRST, then add the
      # rounded shares. Summing the unrounded shares and rounding once at the
      # end is a DIFFERENT number and is wrong.
      for a in counted:
          a.ballot_weight = DISCIPLINE_WEIGHT[a.discipline]
          a.ballot_share  = round(BALLOT_POINTS[a.ballot_value] * a.ballot_weight / W, 2)
      weighted_raw = sum(a.ballot_share for a in counted)     # sum of ROUNDED shares

      consensus_risk_score = round(
            INTERIM_BLEND_WEIGHT * case.interim_risk_score
          + BALLOT_BLEND_WEIGHT  * weighted_raw,
          2)

      risk_band = IMMINENT if consensus_risk_score >= RISK_BAND_IMMINENT_MIN
                  else HIGH if consensus_risk_score >= RISK_BAND_HIGH_MIN
                  else MODERATE if consensus_risk_score >= RISK_BAND_MODERATE_MIN
                  else LOW
      # band -> required disposition: LOW->NO_THREAT, MODERATE->MONITOR,
      #                              HIGH->ELEVATED_RISK, IMMINENT->IMMINENT_RISK

      # Worked fixture A (five seated disciplines, rounding order matters):
      #   report: weapon=true, FIRST_AID, TYPE_3_COWORKER -> severity_points 50
      #   prior_case_count = 0
      #   interim = round(min(100, 0.60*50 + 8*0 + 12), 2) = 42.00
      #   ballots (assessment_round 1):
      #     OPERATIONS ELEVATED   weight 0.775  share round(65*0.775/5.125, 2) =  9.83
      #     SECURITY   IMMINENT   weight 1.325  share round(95*1.325/5.125, 2) = 24.56
      #     HR         ELEVATED   weight 1.000  share round(65*1.000/5.125, 2) = 12.68
      #     CLINICAL   MONITOR    weight 1.150  share round(35*1.150/5.125, 2) =  7.85
      #     LEGAL      IMMINENT   weight 0.875  share round(95*0.875/5.125, 2) = 16.22
      #   W = 5.125 ; weighted_raw = 9.83+24.56+12.68+7.85+16.22 = 71.14
      #   consensus = round(0.35*42.00 + 0.65*71.14, 2) = 60.94  -> risk_band HIGH -> ELEVATED_RISK
      #   (Rounding the share sum only once at the end gives 71.15 and 60.95 —
      #    a different score. 60.94 is the correct pinned value.)
      #
      # Worked fixture B (four seated disciplines, MODERATE band):
      #   report: weapon=false, MEDICAL_TREATMENT, TYPE_2_CLIENT -> severity_points 24
      #   interim = round(0.60*24 + 0 + 0, 2) = 14.40
      #   ballots all MONITOR: HR 8.24 | SECURITY 10.91 | OPERATIONS 6.38 | CLINICAL 9.47
      #   W = 4.250 ; weighted_raw = 35.00
      #   consensus = round(0.35*14.40 + 0.65*35.00, 2) = 27.79 -> MODERATE -> MONITOR
      #
      # Worked fixture C (three seated disciplines, LOW band):
      #   report: weapon=false, NONE, TYPE_2_CLIENT -> severity_points 6
      #   interim = round(0.60*6, 2) = 3.60
      #   ballots all NO_CONCERN: HR 1.61 | SECURITY 2.14 | OPERATIONS 1.25
      #   W = 3.100 ; weighted_raw = 5.00
      #   consensus = round(0.35*3.60 + 0.65*5.00, 2) = 4.51 -> LOW -> NO_THREAT
    constants:
      INTERIM_SEVERITY_COEFFICIENT: 0.60
      PRIOR_CASE_POINTS_EACH: 8
      PRIOR_CASE_CAP_COUNT: 4
      INTERIM_WEAPON_POINTS: 12
      RISK_SCORE_CAP: 100
      DISCIPLINE_WEIGHT_SECURITY: 1.325
      DISCIPLINE_WEIGHT_CLINICAL: 1.150
      DISCIPLINE_WEIGHT_HR: 1.000
      DISCIPLINE_WEIGHT_LEGAL: 0.875
      DISCIPLINE_WEIGHT_OPERATIONS: 0.775
      BALLOT_POINTS_NO_CONCERN: 5
      BALLOT_POINTS_MONITOR: 35
      BALLOT_POINTS_ELEVATED: 65
      BALLOT_POINTS_IMMINENT: 95
      INTERIM_BLEND_WEIGHT: 0.35
      BALLOT_BLEND_WEIGHT: 0.65
      RISK_BAND_MODERATE_MIN: 20
      RISK_BAND_HIGH_MIN: 45
      RISK_BAND_IMMINENT_MIN: 70
    precision: "2 decimal places, round_half_up; each ballot_share is rounded to 2 decimal places before summation, and W is never rounded"
    variants:
      - name: INTERIM
        when: "POST /threat-cases/{id}/convene, before any ballot exists"
        difference: "Derived only from the incident's severity_points, the subject's prior case count and weapon involvement; no ballot input; written to interim_risk_score."
      - name: CONSENSUS
        when: "POST /threat-cases/{id}/decide, after every seated voting member has balloted in the current round"
        difference: "Blends interim_risk_score (0.35) with the discipline-weighted, per-ballot-rounded team score (0.65); written to consensus_risk_score and it, not the interim score, gates the disposition."

  - name: team_quorum_evaluation
    description: |
      Decides whether a ThreatCase's multidisciplinary team may convene. The
      required discipline set is conditional on the underlying incident, so the
      same seat roster is a quorum for one case and not for another.
    trigger: "POST /threat-cases/{id}/team-assignments; POST /threat-cases/{id}/convene; recomputed when a TeamAssignment becomes RECUSED"
    inputs:
      - "TeamAssignment.discipline, role_on_team, status for the case"
      - "IncidentReport.injury_level"
      - "IncidentReport.weapon_involved"
      - "IncidentReport.incident_type"
    algorithm: aggregation
    formula: |
      required = {HR, SECURITY, OPERATIONS}
      if report.injury_level != NONE:                                   required |= {CLINICAL}
      if report.weapon_involved or report.incident_type == TYPE_4_DOMESTIC: required |= {LEGAL}

      seated  = { a.discipline : a in TeamAssignment(case) with status == ASSIGNED }   # ADVISOR seats count here
      voting_seat_count = count(a in TeamAssignment(case) with status == ASSIGNED
                                and a.role_on_team IN (LEAD, VOTING_MEMBER))
      lead_count        = count(a in TeamAssignment(case) with status == ASSIGNED
                                and a.role_on_team == LEAD)

      missing_disciplines = sorted(required - seated)          # alphabetical, deterministic
      quorum_met = (missing_disciplines is empty)
                   and voting_seat_count >= MIN_VOTING_SEATS
                   and lead_count == 1

      # Worked fixtures (pinned):
      #  A) weapon=true, FIRST_AID  -> required {CLINICAL, HR, LEGAL, OPERATIONS, SECURITY}
      #     five ASSIGNED seats, one LEAD -> voting_seat_count 5, quorum_met true
      #  B) weapon=false, MEDICAL_TREATMENT, TYPE_2_CLIENT -> required
      #     {CLINICAL, HR, OPERATIONS, SECURITY}; seats HR(LEAD), SECURITY, OPERATIONS,
      #     CLINICAL(ADVISOR) -> voting_seat_count 3, quorum_met true, and only the
      #     three voting seats must ballot before DELIBERATION.
      #  C) weapon=false, NONE, TYPE_2_CLIENT -> required {HR, OPERATIONS, SECURITY};
      #     three ASSIGNED voting seats -> quorum_met true
      #  D) weapon=false, NONE, TYPE_4_DOMESTIC -> required {HR, LEGAL, OPERATIONS,
      #     SECURITY}; the same three seats as (C) -> missing_disciplines ["LEGAL"],
      #     quorum_met false -> ERR_QUORUM_NOT_MET
    constants:
      MIN_VOTING_SEATS: 3
    precision: "exact set comparison; missing_disciplines sorted alphabetically"

  - name: plan_compliance_metrics
    description: |
      The four derived compliance metrics carried on PreventionPlan
      (hazard_coverage_pct, training_compliance_pct, log_completeness_pct,
      unmitigated_hazard_count) plus overdue_action_count. Every one of them is
      an aggregate over rows that may be created, superseded or expired later,
      so all five are recomputed on each triggering write.
    trigger: |
      POST /work-areas; POST /hazard-assessments; POST /hazard-assessments/{id}/validate;
      POST /training-assignments; POST /training-assignments/{id}/complete;
      POST /employees; POST /employees/{id}/separate; POST /prevention-plans/{id}/submit;
      POST /prevention-plans/{id}/activate; POST /violent-incident-log/{id}/amendments;
      POST /case-actions/{id}/complete; POST /_ops/daily-run
    inputs:
      - "WorkArea rows of plan.worksite_id"
      - "HazardAssessment rows of plan_id with status != SUPERSEDED"
      - "Employee rows of plan.worksite_id with employment_status == ACTIVE"
      - "TrainingModule rows and TrainingAssignment rows"
      - "ViolentIncidentLogEntry rows of plan.worksite_id"
      - "CaseAction rows of ThreatCases with plan_id == plan.id"
      - "logical clock"
    algorithm: aggregation
    formula: |
      # ---- hazard_coverage_pct ----
      area_count    = count(WorkArea where worksite_id == plan.worksite_id)
      covered_areas = count(distinct work_area_id among
                            HazardAssessment where plan_id == plan.id and status != SUPERSEDED)
      hazard_coverage_pct = 100.00 if area_count == 0
                            else round(covered_areas / area_count * 100, 2)

      # ---- training_compliance_pct ----
      pairs = { (e, m) : e in Employee where worksite_id == plan.worksite_id
                                        and employment_status == ACTIVE,
                         m in TrainingModule where e.job_function is an element of m.job_function_scope }
      denominator = count(pairs)
      if denominator == 0:
          training_compliance_pct = 100.00          # vacuously compliant
      else:
          numerator = count of (e, m) in pairs for which some TrainingAssignment exists with
                        employee_id == e.id and module_id == m.id
                        and status == COMPLETED
                        and expires_at > logical clock          # STRICT: an assignment
                        #                                        expiring exactly now is stale
          training_compliance_pct = round(numerator / denominator * 100, 2)

      # ---- log_completeness_pct ----
      live_entries = ViolentIncidentLogEntry where worksite_id == plan.worksite_id
                     and superseded_flag == false
      if count(live_entries) == 0:
          log_completeness_pct = 100.00
      else:
          log_completeness_pct = round(
              sum(e.required_element_count_present for e in live_entries)
              / (REQUIRED_LOG_ELEMENT_COUNT * count(live_entries)) * 100, 2)

      # ---- unmitigated_hazard_count ----
      unmitigated_hazard_count = count(HazardAssessment where plan_id == plan.id
                                       and status != SUPERSEDED
                                       and control_tier == TIER_1_ENGINEERING
                                       and mitigation_verified == false)

      # ---- overdue_action_count ----
      overdue_action_count = count(CaseAction where action_class == POST_INCIDENT
                                   and status == OVERDUE
                                   and case.plan_id == plan.id)

      # Worked fixtures (pinned):
      #   1 area, 1 non-superseded assessment            -> hazard_coverage_pct 100.00
      #   3 areas, 1 non-superseded assessment           -> hazard_coverage_pct  33.33
      #   3 areas, 2 non-superseded assessments          -> hazard_coverage_pct  66.67
      #   5 pairs, 4 COMPLETED and unexpired             -> training_compliance_pct 80.00 (exactly at the activation gate)
      #   5 pairs, 3 COMPLETED and unexpired             -> training_compliance_pct 60.00
      #   0 pairs                                        -> training_compliance_pct 100.00
      #   1 live entry with 6 of 8 elements              -> log_completeness_pct 75.00
      #   2 live entries with 6 and 8 elements           -> log_completeness_pct 87.50
      #   0 live entries                                 -> log_completeness_pct 100.00
    constants:
      REQUIRED_LOG_ELEMENT_COUNT: 8
    precision: "2 decimal places, round_half_up; percentages are computed from integer counts, never from other percentages"

  - name: inspection_readiness_score
    description: |
      Regulatory-inspection readiness for a PreventionPlan. Five weighted
      components are summed into a subtotal; the subtotal is ROUNDED and the
      rounded value is what selects the unmitigated-hazard penalty band. The
      band-selection key is therefore the rounded subtotal, not the raw sum.
    trigger: |
      POST /prevention-plans/{id}/submit; POST /prevention-plans/{id}/activate;
      POST /hazard-assessments; POST /hazard-assessments/{id}/validate;
      POST /work-areas; POST /training-assignments/{id}/complete;
      POST /drills/{id}/execute; POST /case-actions/{id}/complete;
      POST /violent-incident-log/{id}/amendments; POST /_ops/daily-run
    inputs:
      - "PreventionPlan.hazard_coverage_pct"
      - "PreventionPlan.training_compliance_pct"
      - "PreventionPlan.log_completeness_pct"
      - "PreventionPlan.drills_completed_12mo"
      - "PreventionPlan.overdue_action_count"
      - "PreventionPlan.unmitigated_hazard_count"
      - "PreventionPlan.status and Worksite.high_risk_flag (via compliance_posture)"
    algorithm: threshold
    formula: |
      hazard_component   = HAZARD_WEIGHT   * hazard_coverage_pct   / 100
      training_component = TRAINING_WEIGHT * min(100, training_compliance_pct) / 100
      log_component      = LOG_WEIGHT      * log_completeness_pct  / 100
      drill_component    = DRILL_WEIGHT    * min(1, drills_completed_12mo / REQUIRED_DRILLS_PER_YEAR)
      action_component   = ACTION_FULL_POINTS   if overdue_action_count == 0
                           else ACTION_PARTIAL_POINTS if overdue_action_count == 1
                           else 0

      # STEP 1 — round the subtotal to 2dp.
      subtotal = round(hazard_component + training_component + log_component
                       + drill_component + action_component, 2)

      readiness_subtotal = subtotal

      # STEP 2 — the ROUNDED subtotal (readiness_subtotal) is the band-selection
      # key. Selecting the band from the unrounded sum can land one band lower
      # and yields a different score.
      readiness_penalty_band = STRONG   if readiness_subtotal >= PENALTY_BAND_STRONG_MIN
                               else ADEQUATE if readiness_subtotal >= PENALTY_BAND_ADEQUATE_MIN
                               else WEAK
      penalty_rate = PENALTY_RATE_STRONG   if readiness_penalty_band == STRONG
                     else PENALTY_RATE_ADEQUATE if readiness_penalty_band == ADEQUATE
                     else PENALTY_RATE_WEAK

      # STEP 3 — the penalty scales with the number of unmitigated TIER_1 hazards.
      readiness_penalty_points = round(readiness_subtotal * penalty_rate
                                       * unmitigated_hazard_count, 2)
      readiness_score = round(max(0, readiness_subtotal - readiness_penalty_points), 2)

      # STEP 4 — readiness flag; the threshold depends on the plan's posture.
      compliance_posture = FROZEN     if plan.status IN (DRAFT, IN_REVIEW, SUPERSEDED)
                           else RESTRICTED if plan.status == REVIEW_DUE
                                              or worksite.high_risk_flag == true
                           else OPEN    # status ACTIVE on a worksite that is not high risk
      inspection_ready = (compliance_posture != FROZEN) and
                         (readiness_score >=
                            (READY_THRESHOLD_OPEN if compliance_posture == OPEN
                             else READY_THRESHOLD_RESTRICTED))

      # Worked fixture A (band key divergence, pinned):
      #   hazard_coverage_pct 33.33, training_compliance_pct 100.00,
      #   log_completeness_pct 75.00, drills_completed_12mo 2, overdue_action_count 0,
      #   unmitigated_hazard_count 1, status REVIEW_DUE
      #     hazard_component   = 30 * 33.33/100 =  9.999
      #     training_component = 25 * 1         = 25
      #     log_component      = 20 * 75.00/100 = 15
      #     drill_component    = 15 * min(1,2/2)= 15
      #     action_component   = 10
      #     raw sum  = 74.999  ->  readiness_subtotal = 75.00
      #     readiness_penalty_band = ADEQUATE (75.00 >= 75), penalty_rate 0.06
      #        [banding on the unrounded 74.999 would give WEAK / 0.12]
      #     readiness_penalty_points = round(75.00 * 0.06 * 1, 2) = 4.50
      #     readiness_score = 70.50 ; posture RESTRICTED, threshold 85.00
      #     -> inspection_ready = false
      #   (The wrong order — banding on the unrounded 74.999 — gives
      #    readiness_penalty_points 9.00 and readiness_score 66.00.)
      #
      # Worked fixture B (exact readiness boundary, pinned):
      #   hazard 100.00, training 100.00, log 100.00, drills 0, overdue 0,
      #   unmitigated 0, status REVIEW_DUE
      #     30.00 + 25 + 20.00 + 0 + 10 = readiness_subtotal 85.00,
      #     readiness_penalty_band ADEQUATE, penalty_rate 0.06,
      #     readiness_penalty_points = round(85.00*0.06*0, 2) = 0.00,
      #     readiness_score 85.00
      #     -> inspection_ready = true (85.00 >= READY_THRESHOLD_RESTRICTED 85.00)
      #
      # Worked fixture C (all green):
      #   hazard 100.00, training 100.00, log 100.00, drills 2, overdue 0,
      #   unmitigated 0, status ACTIVE -> readiness_subtotal 100.00,
      #   readiness_penalty_band STRONG, rate 0.02, readiness_penalty_points 0.00,
      #   readiness_score 100.00, inspection_ready true
      #
      # Worked fixture D (one overdue action):
      #   hazard 100.00, training 100.00, log 75.00, drills 2, overdue 1,
      #   unmitigated 1, status REVIEW_DUE
      #     30.00 + 25 + 15.00 + 15 + 4 = readiness_subtotal 89.00,
      #     readiness_penalty_band ADEQUATE, rate 0.06,
      #     readiness_penalty_points = round(89.00*0.06*1, 2) = 5.34,
      #     readiness_score 83.66, inspection_ready false
    constants:
      HAZARD_WEIGHT: 30
      TRAINING_WEIGHT: 25
      LOG_WEIGHT: 20
      DRILL_WEIGHT: 15
      ACTION_FULL_POINTS: 10
      ACTION_PARTIAL_POINTS: 4
      REQUIRED_DRILLS_PER_YEAR: 2
      PENALTY_BAND_STRONG_MIN: 90
      PENALTY_BAND_ADEQUATE_MIN: 75
      PENALTY_RATE_STRONG: 0.02
      PENALTY_RATE_ADEQUATE: 0.06
      PENALTY_RATE_WEAK: 0.12
      READY_THRESHOLD_OPEN: 75.00
      READY_THRESHOLD_RESTRICTED: 85.00
    precision: "2 decimal places, round_half_up at every labelled step; the rounded subtotal is the band-selection key"

  - name: protective_coverage_gap_hours
    description: |
      Uncovered time inside a ThreatCase's protection window. Protective
      measures are clipped to the window, merged, and subtracted from the window
      length. Restraining-order support is legal assistance rather than physical
      coverage and is excluded from the merge.
    trigger: |
      POST /threat-cases/{id}/decide; POST /case-actions; POST /case-actions/{id}/revoke;
      POST /employees/{id}/separate; POST /threat-cases/{id}/close; POST /_ops/daily-run
    inputs:
      - "ThreatCase.protection_window_start, protection_window_end"
      - "CaseAction rows of the case with action_class == PROTECTIVE"
      - "CaseAction.action_type, starts_at, ends_at, status"
    algorithm: interval_merge
    formula: |
      if protection_window_start is null:
          coverage_gap_hours = 0.00 ; protection_status = NOT_APPLICABLE ; stop

      window = [protection_window_start, protection_window_end)          # HALF-OPEN

      candidates = CaseAction of this case where
                     action_class == PROTECTIVE
                     and status IN (SCHEDULED, ACTIVE)
                     and action_type != RESTRAINING_ORDER_SUPPORT        # excluded

      # clip each candidate to the window, dropping anything that collapses
      clipped = []
      for c in candidates:
          s = max(c.starts_at, window.start)
          e = min(c.ends_at,   window.end)
          if s < e: clipped.append([s, e))                               # empty after clip -> dropped

      # merge; ADJACENT intervals (gap == 0) merge, so touching endpoints are covered
      sort clipped by (start, end)                                       # deterministic, no id tiebreak
      merged = []
      for iv in clipped:
          if merged and iv.start <= merged[-1].end:
              merged[-1].end = max(merged[-1].end, iv.end)
          else:
              merged.append(iv)

      covered_minutes = sum(minutes(iv.end - iv.start) for iv in merged)
      gap_minutes     = minutes(window.end - window.start) - covered_minutes
      coverage_gap_hours = round(gap_minutes / 60, 2)

      protection_status = COVERED if coverage_gap_hours == 0.00 else GAP

      # Worked fixtures, all with window [2026-08-01T00:00:00Z, 2026-08-15T00:00:00Z)
      # = 20160 minutes = 336.00 hours:
      #   no protective measures                                     -> 336.00, GAP
      #   [08-01T00:00, 08-08T00:00) + [08-08T00:00, 08-15T00:00)     ->   0.00, COVERED (adjacent, gap 0, merges)
      #   [08-01T00:00, 08-09T00:00) + [08-07T00:00, 08-15T00:00)     ->   0.00, COVERED (overlapping, merges)
      #   [08-01T00:00, 08-06T00:00) + [08-07T00:00, 08-15T00:00)     ->  24.00, GAP    (disjoint, 1 day uncovered)
      #   [07-25T00:00, 08-02T00:00) only                             -> 312.00, GAP    (clipped to 08-01..08-02 = 24h covered)
      #   RESTRAINING_ORDER_SUPPORT [08-01T00:00, 08-15T00:00) only   -> 336.00, GAP    (excluded from the merge)
      #   [08-01T00:00, 08-15T00:00) then that row is REVOKED         ->   0.00 becomes 336.00, COVERED becomes GAP
    constants:
      PROTECTION_WINDOW_DAYS: 14
      MINUTES_PER_HOUR: 60
    precision: "2 decimal places, round_half_up; intervals are half-open [start, end); adjacent intervals with gap 0 merge"

# =============================================================================
# 1.4 Validation Rules Table (evaluated strictly in ascending priority order;
#     the FIRST violated rule determines the response and no later rule runs)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers are present and X-User-Role is one of the ten declared roles (Anonymous supplies X-User-Role: Anonymous and may omit X-User-ID)"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all
    description: "Runs before everything, including path existence: an unauthenticated request against a non-existent id still returns 401."
  - priority: 2
    category: auth
    check: "X-User-Role is listed in the endpoint's roles"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: all
    description: "Role gate. Wins over every existence, state and business rule, so a wrong-role call on a non-existent id returns 403, not 404."
  - priority: 3
    category: auth
    check: "for a role whose identity is entity_backed:Employee, X-User-ID resolves to an existing Employee row with employment_status ACTIVE"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: "all endpoints whose roles include SafetyOfficer, SiteManager, ThreatTeamLead, ThreatTeamMember, SecurityCoordinator, HRPartner or Employee"
    description: "A SEPARATED employee's id can no longer act. Opaque roles (ComplianceAuditor, Anonymous, ProgramAdmin) skip this rule."
  - priority: 4
    category: existence
    check: "request body and query string parse; every required field is present; every enum value is in range; numbers respect their declared bounds; pagination limit is 1..100 and offset >= 0"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: all
    description: "Pure shape validation with no database access. Unknown extra body fields are ignored, not rejected; computed and system fields supplied by the client are ignored."
  - priority: 5
    category: existence
    check: "every templated {id} in the path resolves to an existing row, validated left to right"
    error_id: "ERR_WORKSITE_NOT_FOUND | ERR_WORK_AREA_NOT_FOUND | ERR_PREVENTION_PLAN_NOT_FOUND | ERR_HAZARD_ASSESSMENT_NOT_FOUND | ERR_EMPLOYEE_NOT_FOUND | ERR_TRAINING_MODULE_NOT_FOUND | ERR_TRAINING_ASSIGNMENT_NOT_FOUND | ERR_INCIDENT_REPORT_NOT_FOUND | ERR_THREAT_CASE_NOT_FOUND | ERR_TEAM_ASSIGNMENT_NOT_FOUND | ERR_CASE_ACTION_NOT_FOUND | ERR_LOG_ENTRY_NOT_FOUND | ERR_DRILL_NOT_FOUND"
    http_status: 404
    applies_to: "all endpoints with a templated path segment"
    description: "Path ids before body ids."
  - priority: 6
    category: existence
    check: "every foreign key supplied in the request body resolves to an existing row, validated in the field order declared by the endpoint's input list"
    error_id: "the matching ERR_<ENTITY>_NOT_FOUND"
    http_status: 404
    applies_to: "POST /work-areas, POST /prevention-plans, POST /hazard-assessments, POST /employees, POST /training-assignments, POST /incident-reports, POST /threat-cases, POST /threat-cases/{threat_case_id}/team-assignments, POST /case-actions, POST /drills"
    description: "Body FKs after path ids, in declared input order, so a request with two bad FKs reports the first one in that order."
  - priority: 7
    category: business_safety
    check: "an actor whose role is Employee may only act on rows that belong to that employee: TrainingAssignment.employee_id for complete, IncidentReport.reporter_employee_id for a retaliation ALLEGE"
    error_id: ERR_NOT_RESOURCE_OWNER
    http_status: 403
    applies_to: "POST /training-assignments/{training_assignment_id}/complete, POST /incident-reports/{incident_report_id}/retaliation-updates"
    description: "Ownership after existence: an Employee acting on someone else's row gets 403 only once the row is known to exist. HRPartner is exempt on the retaliation endpoint."
  - priority: 8
    category: business_constraint
    check: "expected_plan_version equals PreventionPlan.version (concurrency_rules[hazard-assessment-create-stale-plan]); expected_employee_version equals Employee.version (concurrency_rules[training-assignment-create-stale-employee])"
    error_id: "ERR_STALE_PLAN_VERSION | ERR_STALE_EMPLOYEE_VERSION"
    http_status: 412
    applies_to: "POST /hazard-assessments, POST /training-assignments"
    description: "The OCC guard runs before every state and business rule on these two endpoints, so a stale version on a plan in the wrong state still returns 412."
  - priority: 10
    category: state
    check: "the target row is in a state from which the requested transition is declared in §1.2"
    error_id: "ERR_PLAN_INVALID_STATE | ERR_HAZARD_ASSESSMENT_INVALID_STATE | ERR_REPORT_INVALID_STATE | ERR_RETALIATION_INVALID_STATE | ERR_CASE_INVALID_STATE | ERR_ACTION_INVALID_STATE | ERR_TRAINING_INVALID_STATE | ERR_DRILL_INVALID_STATE | ERR_EMPLOYEE_INVALID_STATE"
    http_status: 409
    applies_to: "every action endpoint that drives a transition"
    description: "Also covers idempotent replays: submitting an already IN_REVIEW plan, closing an already CLOSED case, completing an already COMPLETED assignment."
  - priority: 11
    category: state
    check: "ViolentIncidentLogEntry rows are append-only: an amendment may only target an entry whose superseded_flag is false and whose retention_status is ACTIVE"
    error_id: ERR_LOG_ENTRY_IMMUTABLE
    http_status: 409
    applies_to: "POST /violent-incident-log/{log_entry_id}/amendments"
    description: "Amending an already-superseded entry, or one past retention, is rejected; corrections must chain from the newest live entry."
  - priority: 12
    category: state
    check: "the PreventionPlan reached through ThreatCase.plan_id has compliance_posture != FROZEN"
    error_id: ERR_PLAN_POSTURE_FROZEN
    http_status: 409
    applies_to: "POST /case-actions, POST /threat-cases/{threat_case_id}/convene"
    description: "Cross-entity state dependency: the case is in a perfectly legal state, but its governing plan is DRAFT, IN_REVIEW or SUPERSEDED, so no new protective or post-incident measure may be recorded against it."
  - priority: 15
    category: business_temporal
    check: "interval shape: for a PROTECTIVE CaseAction, starts_at and ends_at are both present and starts_at < ends_at; for a POST_INCIDENT CaseAction, due_at is present and starts_at/ends_at are absent"
    error_id: ERR_INVALID_INTERVAL
    http_status: 422
    applies_to: "POST /case-actions"
    description: "Shape of the interval itself, checked before any overlap or window rule so a reversed interval never reaches the merge logic."
  - priority: 20
    category: business_safety
    check: "no adverse protective measure (action_type SCHEDULE_CHANGE or ACCESS_RESTRICTION) may name as subject_employee_id an employee who is the retaliation_claimant_employee_id of any IncidentReport whose retaliation_status is ALLEGED, UNDER_REVIEW or SUBSTANTIATED"
    error_id: ERR_ANTI_RETALIATION_HOLD
    http_status: 409
    applies_to: "POST /case-actions"
    description: "Anti-retaliation protection outranks every scheduling, capacity and window rule: a request that is both retaliatory and outside the protection window returns ERR_ANTI_RETALIATION_HOLD."
  - priority: 22
    category: business_safety
    check: "for action_type SECURITY_ESCORT, escort_employee_id must be an ACTIVE Employee with, for every TrainingModule whose required_for_escort is true, a TrainingAssignment in status COMPLETED whose expires_at > logical clock"
    error_id: ERR_ESCORT_NOT_QUALIFIED
    http_status: 409
    applies_to: "POST /case-actions"
    description: "Cross-entity state dependency on TrainingAssignment: an escort whose annual refresh has lapsed to EXPIRED cannot be assigned, even though the escort row itself is untouched."
  - priority: 24
    category: business_safety
    check: "a TeamAssignment's member_employee_id must not equal the case's subject_employee_id or protected_employee_id, and must not be the reporter_employee_id of the case's IncidentReport"
    error_id: ERR_SUBJECT_CONFLICT_OF_INTEREST
    http_status: 409
    applies_to: "POST /threat-cases/{threat_case_id}/team-assignments"
    description: "Nobody evaluates their own case."
  - priority: 26
    category: business_safety
    check: "segregation of duties: X-User-ID != PreventionPlan.submitted_by_employee_id on activate; X-User-ID != HazardAssessment.authored_by_employee_id on validate"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 409
    applies_to: "POST /prevention-plans/{plan_id}/activate, POST /hazard-assessments/{hazard_assessment_id}/validate"
    description: "Compliance separation, checked before the fiscal coverage and training gates so a self-approval attempt on an under-trained plan returns ERR_SEGREGATION_OF_DUTIES."
  - priority: 30
    category: business_referential
    check: "action_type belongs to the declared action_class group — PROTECTIVE accepts ACCESS_RESTRICTION, SCHEDULE_CHANGE, SECURITY_ESCORT, RESTRAINING_ORDER_SUPPORT; POST_INCIDENT accepts COUNSELING_REFERRAL, DEBRIEFING, LAW_ENFORCEMENT_COORDINATION, SAFETY_PLAN_REVIEW"
    error_id: ERR_ACTION_TYPE_CLASS_MISMATCH
    http_status: 422
    applies_to: "POST /case-actions"
    description: "Discriminated-union integrity for the merged action entity."
  - priority: 31
    category: business_referential
    check: "role-specific field presence per action_type: ACCESS_RESTRICTION requires work_area_id and subject_employee_id; SECURITY_ESCORT requires escort_employee_id and protected_employee context; every POST_INCIDENT type requires assigned_employee_id"
    error_id: ERR_ACTION_FIELD_MISSING
    http_status: 422
    applies_to: "POST /case-actions"
    description: "Conditional required-field validation driven by the action_type discriminator rather than by a static required list."
  - priority: 32
    category: business_referential
    check: "the WorkArea named on a CaseAction must belong to the same worksite as the case's IncidentReport; the WorkArea named on a HazardAssessment must belong to the plan's worksite; the Employee named on a TrainingAssignment must have job_function contained in the module's job_function_scope"
    error_id: "ERR_WORK_AREA_WORKSITE_MISMATCH | ERR_MODULE_SCOPE_MISMATCH"
    http_status: 409
    applies_to: "POST /case-actions, POST /hazard-assessments, POST /training-assignments"
    description: "Cross-aggregate referential integrity: the FKs all resolve, but they point into different worksites or incompatible job functions."
  - priority: 33
    category: business_referential
    check: "reporter_employee_id is required unless channel is ANONYMOUS_DROPBOX, and must be absent when channel is ANONYMOUS_DROPBOX"
    error_id: ERR_REPORTER_REQUIRED
    http_status: 422
    applies_to: "POST /incident-reports"
    description: "Reporting-channel conditional validation; an anonymous report can never later support a retaliation claim because there is no claimant."
  - priority: 34
    category: business_referential
    check: "uniqueness: at most one non-CLOSED ThreatCase per incident_report_id; at most one ASSIGNED TeamAssignment per (case_id, member_employee_id); at most one ASSIGNED TeamAssignment with role_on_team LEAD per case"
    error_id: "ERR_CASE_ALREADY_OPEN_FOR_REPORT | ERR_DUPLICATE_TEAM_ASSIGNMENT | ERR_DUPLICATE_TEAM_LEAD"
    http_status: 409
    applies_to: "POST /threat-cases, POST /threat-cases/{threat_case_id}/team-assignments"
    description: "Uniqueness after referential integrity."
  - priority: 35
    category: business_constraint
    check: "calculation team_quorum_evaluation returns quorum_met true for the case"
    error_id: ERR_QUORUM_NOT_MET
    http_status: 409
    applies_to: "POST /threat-cases/{threat_case_id}/convene"
    description: "Conditional aggregate: the required discipline set depends on the incident's injury_level, weapon_involved and incident_type, so the same roster passes for one case and fails for another. Runs after the priority-10 state check, so convening an already-ASSESSING case without quorum returns ERR_CASE_INVALID_STATE."
  - priority: 36
    category: business_constraint
    check: "the balloting member has an ASSIGNED TeamAssignment on the case with role_on_team LEAD or VOTING_MEMBER, has not already balloted in case.assessment_round, and the case status is ASSESSING"
    error_id: ERR_BALLOT_ROUND_CLOSED
    http_status: 409
    applies_to: "POST /threat-cases/{threat_case_id}/ballots"
    description: "Covers a second ballot in the same round, a ballot from an ADVISOR seat, a ballot from a RECUSED seat and a ballot after the case has auto-advanced to DELIBERATION."
  - priority: 37
    category: business_constraint
    check: "case.assessment_round < MAX_ASSESSMENT_ROUNDS (3)"
    error_id: ERR_MAX_ASSESSMENT_ROUNDS
    http_status: 409
    applies_to: "POST /threat-cases/{threat_case_id}/reassess"
    description: "Terminates the DELIBERATION -> ASSESSING cycle after three rounds so the loop cannot run forever."
  - priority: 38
    category: business_constraint
    check: "the requested disposition equals the mapping of the freshly computed CONSENSUS risk_band (LOW->NO_THREAT, MODERATE->MONITOR, HIGH->ELEVATED_RISK, IMMINENT->IMMINENT_RISK) unless override_justification is supplied"
    error_id: ERR_DISPOSITION_BAND_MISMATCH
    http_status: 409
    applies_to: "POST /threat-cases/{threat_case_id}/decide"
    description: "The consensus score, not the interim score, is authoritative."
  - priority: 39
    category: business_constraint
    check: "an override_justification of at least 40 characters may only raise the disposition one step above the band mapping, and may never be used to lower a disposition below the band mapping"
    error_id: ERR_OVERRIDE_NOT_PERMITTED
    http_status: 409
    applies_to: "POST /threat-cases/{threat_case_id}/decide"
    description: "Safety-directional override: escalation is permitted with a written rationale, de-escalation never is."
  - priority: 40
    category: business_constraint
    check: "score >= TrainingModule.passing_score"
    error_id: ERR_TRAINING_SCORE_BELOW_PASSING
    http_status: 409
    applies_to: "POST /training-assignments/{training_assignment_id}/complete"
    description: "A failed attempt increments attempt_count but leaves the assignment ASSIGNED."
  - priority: 41
    category: business_constraint
    check: "participant_count <= Worksite.employee_count and findings_count <= 50"
    error_id: ERR_PARTICIPANT_COUNT_EXCEEDS_HEADCOUNT
    http_status: 422
    applies_to: "POST /drills/{drill_id}/execute"
    description: "Guards the participation_pct denominator."
  - priority: 45
    category: business_temporal
    check: "a PROTECTIVE CaseAction must overlap the case's protection window: starts_at < protection_window_end AND ends_at > protection_window_start"
    error_id: ERR_MEASURE_OUTSIDE_PROTECTION_WINDOW
    http_status: 409
    applies_to: "POST /case-actions"
    description: "Wholly-outside intervals are rejected; partially overlapping intervals are accepted and clipped by calculation protective_coverage_gap_hours."
  - priority: 46
    category: business_temporal
    check: "for action_type SECURITY_ESCORT, the interval [starts_at - ESCORT_BUFFER_MINUTES, ends_at + ESCORT_BUFFER_MINUTES) must not overlap any other SECURITY_ESCORT CaseAction in status SCHEDULED or ACTIVE with the same escort_employee_id (ESCORT_BUFFER_MINUTES = 30)"
    error_id: ERR_ESCORT_DOUBLE_BOOKED
    http_status: 409
    applies_to: "POST /case-actions"
    description: "Resource-temporal overlap on the escort employee with a symmetric 30-minute travel buffer, so two escorts that merely touch endpoint-to-endpoint still conflict. Scoped across ALL cases, not just the current one."
  - priority: 47
    category: business_constraint
    check: "for action_type ACCESS_RESTRICTION, the count of other ACCESS_RESTRICTION CaseActions in status SCHEDULED or ACTIVE on the same work_area_id whose half-open interval overlaps the requested one must be < floor(WorkArea.occupancy_cap * AREA_RESTRICTION_CAP_RATIO), with AREA_RESTRICTION_CAP_RATIO = 0.25 and a hard minimum of 1"
    error_id: ERR_AREA_RESTRICTION_CAPACITY
    http_status: 409
    applies_to: "POST /case-actions"
    description: "Aggregate resource-temporal ceiling on the WorkArea with plain half-open overlap and no buffer: intervals that merely touch (previous.ends_at == new.starts_at) do NOT conflict here, unlike the escort rule at priority 46."
  - priority: 50
    category: business_fiscal
    check: "PreventionPlan.hazard_coverage_pct == 100.00"
    error_id: ERR_HAZARD_COVERAGE_INCOMPLETE
    http_status: 409
    applies_to: "POST /prevention-plans/{plan_id}/activate"
    description: "Every work area of the worksite must carry a live hazard assessment before the plan may go live. Checked before the training gate, so a plan failing both returns ERR_HAZARD_COVERAGE_INCOMPLETE."
  - priority: 51
    category: business_fiscal
    check: "PreventionPlan.training_compliance_pct >= TRAINING_COMPLIANCE_MIN_PCT (80.00)"
    error_id: ERR_TRAINING_COMPLIANCE_BELOW_THRESHOLD
    http_status: 409
    applies_to: "POST /prevention-plans/{plan_id}/activate"
    description: "Inclusive boundary: exactly 80.00 passes, 79.99 fails."
  - priority: 55
    category: business_safety
    check: "ThreatCase.open_action_count == 0"
    error_id: ERR_OPEN_ACTIONS_BLOCK_CLOSE
    http_status: 409
    applies_to: "POST /threat-cases/{threat_case_id}/close"
    description: "Post-incident counselling, debriefing and law-enforcement coordination must all be completed before a case may close; an auto-generated SAFETY_PLAN_REVIEW created by a coverage gap counts."
  - priority: 56
    category: business_safety
    check: "every live ViolentIncidentLogEntry of the case has required_element_count_present == REQUIRED_LOG_ELEMENT_COUNT (8)"
    error_id: ERR_LOG_ENTRY_REQUIRED_ELEMENT_MISSING
    http_status: 409
    applies_to: "POST /threat-cases/{threat_case_id}/close"
    description: "The auto-appended entry carries only 6 of the 8 regulatory data elements, so the log must be amended before the case can close. Runs after the open-action gate, so a case with both problems returns ERR_OPEN_ACTIONS_BLOCK_CLOSE."

# =============================================================================
# 1.5 API Endpoint Table  (api_prefix is "", so every path below is absolute)
# =============================================================================
endpoints:
  # ---------------------------------------------------------------- worksites
  - method: POST
    path: "/worksites"
    description: "Register a worksite."
    roles: [ProgramAdmin]
    code: 201
    input: [name, state_code, employee_count]
    output: Worksite
    side_effects: ["violent_incident_count_12mo = 0, high_risk_flag = false"]
  - method: GET
    path: "/worksites/{worksite_id}"
    description: "Read one worksite including its rolling incident count and high-risk flag."
    roles: [ProgramAdmin, SafetyOfficer, SiteManager, ThreatTeamLead, ComplianceAuditor]
    code: 200
    input: []
    output: Worksite
    side_effects: []
  - method: GET
    path: "/worksites"
    description: "List worksites."
    roles: [ProgramAdmin, SafetyOfficer, SiteManager, ComplianceAuditor]
    code: 200
    input: ["state_code?", "high_risk_flag?", "limit?", "offset?"]
    output: Worksite[]
    side_effects: []

  # --------------------------------------------------------------- work areas
  - method: POST
    path: "/work-areas"
    description: "Define a work area with its job function and violence-exposure flags."
    roles: [ProgramAdmin]
    code: 201
    input: ["worksite_id", "name", "job_function", "public_access_flag?", "lone_worker_flag?", "night_shift_flag?", "occupancy_cap"]
    output: WorkArea
    side_effects:
      - "recomputes calculation plan_compliance_metrics (hazard_coverage_pct drops) and calculation inspection_readiness_score for every non-SUPERSEDED PreventionPlan of the worksite"
  - method: GET
    path: "/work-areas/{work_area_id}"
    description: "Read one work area including its current hazard score and restriction count."
    roles: [ProgramAdmin, SafetyOfficer, SiteManager, SecurityCoordinator, ThreatTeamLead, ComplianceAuditor]
    code: 200
    input: []
    output: WorkArea
    side_effects: []
  - method: GET
    path: "/work-areas"
    description: "List work areas, filterable by worksite."
    roles: [ProgramAdmin, SafetyOfficer, SiteManager, SecurityCoordinator, ThreatTeamLead, ComplianceAuditor]
    code: 200
    input: ["worksite_id?", "job_function?", "lone_worker_flag?", "limit?", "offset?"]
    output: WorkArea[]
    side_effects: []

  # --------------------------------------------------------- prevention plans
  - method: POST
    path: "/prevention-plans"
    description: "Draft a workplace-violence prevention plan for a worksite."
    roles: [SafetyOfficer]
    code: 201
    input: ["worksite_id", "effective_date", "review_interval_days?"]
    output: PreventionPlan
    side_effects:
      - "status = DRAFT, compliance_posture = FROZEN, inspection_ready = false"
      - "plan_revision = 1 + count of existing PreventionPlan rows for the worksite"
      - "runs calculation plan_compliance_metrics and calculation inspection_readiness_score"
  - method: GET
    path: "/prevention-plans/{plan_id}"
    description: "Read one plan with all derived compliance metrics and readiness fields."
    roles: [SafetyOfficer, SiteManager, ThreatTeamLead, HRPartner, ComplianceAuditor, ProgramAdmin]
    code: 200
    input: []
    output: PreventionPlan
    side_effects: []
  - method: GET
    path: "/prevention-plans"
    description: "List plans, filterable by worksite, status and the two segregation-of-duties actors."
    roles: [SafetyOfficer, SiteManager, ThreatTeamLead, HRPartner, ComplianceAuditor, ProgramAdmin]
    code: 200
    input: ["worksite_id?", "status?", "submitted_by_employee_id?", "activated_by_employee_id?", "inspection_ready?", "limit?", "offset?"]
    output: PreventionPlan[]
    side_effects: []
  - method: POST
    path: "/prevention-plans/{plan_id}/submit"
    description: "Submit a DRAFT or REVIEW_DUE plan for review; stamps the submitter for the segregation-of-duties check."
    roles: [SafetyOfficer]
    code: 200
    input: ["submission_note?"]
    output: PreventionPlan
    side_effects:
      - "state_machines.PreventionPlan DRAFT_to_IN_REVIEW or REVIEW_DUE_to_IN_REVIEW"
      - "sets submitted_by_employee_id from X-User-ID"
      - "recomputes calculation plan_compliance_metrics and calculation inspection_readiness_score"
  - method: POST
    path: "/prevention-plans/{plan_id}/return-for-revision"
    description: "Send an IN_REVIEW plan back to DRAFT, clearing the submitter stamp."
    roles: [SiteManager]
    code: 200
    input: [revision_reason]
    output: PreventionPlan
    side_effects:
      - "state_machines.PreventionPlan IN_REVIEW_to_DRAFT"
      - "clears submitted_by_employee_id"
  - method: POST
    path: "/prevention-plans/{plan_id}/activate"
    description: "Activate an IN_REVIEW plan. Requires a different actor than the submitter, full hazard coverage and training compliance at or above 80.00."
    roles: [SiteManager]
    code: 200
    input: ["activation_note?"]
    output: PreventionPlan
    side_effects:
      - "state_machines.PreventionPlan IN_REVIEW_to_ACTIVE"
      - "supersedes every other ACTIVE or REVIEW_DUE plan of the worksite (state_machines.PreventionPlan ACTIVE_to_SUPERSEDED)"
      - "sets compliance_posture OPEN on this plan and FROZEN on the superseded one"
      - "recomputes WorkArea.current_hazard_score for the worksite and calculation inspection_readiness_score"

  # ------------------------------------------------------- hazard assessments
  - method: POST
    path: "/hazard-assessments"
    description: "Record a screening hazard assessment for one work area under one plan. Supersedes the prior live assessment for the same (plan, work area) pair; guarded by expected_plan_version."
    roles: [SafetyOfficer]
    code: 201
    input: [plan_id, work_area_id, reported_incident_count, proximity_factor, cash_on_hand_cents, min_staff_per_shift, expected_plan_version]
    output: HazardAssessment
    side_effects:
      - "runs calculation hazard_score under the SCREENING variant; sets control_tier and mitigation_verified = false"
      - "sets authored_by_employee_id from X-User-ID"
      - "supersedes the prior live assessment for the pair (state_machines.HazardAssessment SCREENING_to_SUPERSEDED / VALIDATED_to_SUPERSEDED)"
      - "increments PreventionPlan.version by 1"
      - "updates WorkArea.current_hazard_score, calculation plan_compliance_metrics and calculation inspection_readiness_score"
  - method: GET
    path: "/hazard-assessments/{hazard_assessment_id}"
    description: "Read one hazard assessment with its score, variant and control tier."
    roles: [SafetyOfficer, SiteManager, ThreatTeamLead, ComplianceAuditor, ProgramAdmin]
    code: 200
    input: []
    output: HazardAssessment
    side_effects: []
  - method: GET
    path: "/hazard-assessments"
    description: "List hazard assessments, filterable by plan, work area, status and either segregation-of-duties actor."
    roles: [SafetyOfficer, SiteManager, ThreatTeamLead, ComplianceAuditor, ProgramAdmin]
    code: 200
    input: ["plan_id?", "work_area_id?", "status?", "control_tier?", "authored_by_employee_id?", "validated_by_employee_id?", "limit?", "offset?"]
    output: HazardAssessment[]
    side_effects: []
  - method: POST
    path: "/hazard-assessments/{hazard_assessment_id}/validate"
    description: "Validate a SCREENING assessment after a walkthrough by someone other than its author, applying mitigation credit."
    roles: [SiteManager]
    code: 200
    input: ["walkthrough_note", "mitigation_credits?", "barrier_installed?"]
    output: HazardAssessment
    side_effects:
      - "state_machines.HazardAssessment SCREENING_to_VALIDATED"
      - "re-runs calculation hazard_score under the VALIDATED variant; refreshes control_tier and mitigation_verified"
      - "sets validated_by_employee_id from X-User-ID"
      - "updates WorkArea.current_hazard_score, calculation plan_compliance_metrics and calculation inspection_readiness_score"

  # ---------------------------------------------------------------- employees
  - method: POST
    path: "/employees"
    description: "Register an employee, optionally seating them on the threat-assessment team via team_discipline."
    roles: [ProgramAdmin]
    code: 201
    input: ["worksite_id", "work_area_id", "full_name", "job_function", "team_discipline?"]
    output: Employee
    side_effects:
      - "employment_status = ACTIVE, escort_committed_minutes = 0, active_restriction_count = 0, training_current = false"
      - "recomputes calculation plan_compliance_metrics (a new training pair enters the denominator) and calculation inspection_readiness_score"
  - method: GET
    path: "/employees/{employee_id}"
    description: "Read one employee with the escort-minute ledger, restriction counter and training currency."
    roles: [ProgramAdmin, HRPartner, SafetyOfficer, SiteManager, SecurityCoordinator, ThreatTeamLead, ComplianceAuditor]
    code: 200
    input: []
    output: Employee
    side_effects: []
  - method: GET
    path: "/employees"
    description: "List employees, filterable by worksite, work area, job function, team discipline and employment status."
    roles: [ProgramAdmin, HRPartner, SafetyOfficer, SiteManager, SecurityCoordinator, ThreatTeamLead, ComplianceAuditor]
    code: 200
    input: ["worksite_id?", "work_area_id?", "job_function?", "team_discipline?", "employment_status?", "training_current?", "limit?", "offset?"]
    output: Employee[]
    side_effects: []
  - method: POST
    path: "/employees/{employee_id}/separate"
    description: "Separate an employee, unwinding every escort commitment and team seat they hold."
    roles: [HRPartner]
    code: 200
    input: [separation_reason]
    output: Employee
    side_effects:
      - "state_machines.Employee ACTIVE_to_SEPARATED"
      - "revokes every SCHEDULED or ACTIVE SECURITY_ESCORT CaseAction where escort_employee_id is this employee, crediting escort_committed_minutes back to 0"
      - "recomputes calculation protective_coverage_gap_hours for each affected case; a case flipping to GAP gains an auto_generated SAFETY_PLAN_REVIEW action"
      - "marks every ASSIGNED TeamAssignment for this member RECUSED, clears its ballot fields and recomputes quorum_met and ballot_count_current_round"
      - "recomputes calculation plan_compliance_metrics and calculation inspection_readiness_score for every non-SUPERSEDED plan of the worksite"

  # --------------------------------------------------------- training modules
  - method: POST
    path: "/training-modules"
    description: "Publish a role-specific training module with its scenario set version, refresh interval and passing score."
    roles: [ProgramAdmin]
    code: 201
    input: ["code", "job_function_scope", "scenario_set_version", "refresh_interval_days?", "passing_score?", "required_for_escort?"]
    output: TrainingModule
    side_effects:
      - "recomputes calculation plan_compliance_metrics (new (employee, module) pairs enter the denominator) and calculation inspection_readiness_score"
  - method: GET
    path: "/training-modules/{module_id}"
    description: "Read one training module."
    roles: [ProgramAdmin, HRPartner, SafetyOfficer, Employee, ComplianceAuditor]
    code: 200
    input: []
    output: TrainingModule
    side_effects: []
  - method: GET
    path: "/training-modules"
    description: "List training modules."
    roles: [ProgramAdmin, HRPartner, SafetyOfficer, Employee, ComplianceAuditor]
    code: 200
    input: ["required_for_escort?", "limit?", "offset?"]
    output: TrainingModule[]
    side_effects: []

  # ----------------------------------------------------- training assignments
  - method: POST
    path: "/training-assignments"
    description: "Assign or annually refresh a training module for an employee. Supersedes the pair's prior assignment; guarded by expected_employee_version."
    roles: [HRPartner]
    code: 201
    input: [employee_id, module_id, due_at, expected_employee_version]
    output: TrainingAssignment
    side_effects:
      - "status = ASSIGNED, assigned_at = logical clock, attempt_count = 0"
      - "supersedes the pair's prior ASSIGNED, COMPLETED or EXPIRED assignment (state_machines.TrainingAssignment ASSIGNED_to_SUPERSEDED)"
      - "increments Employee.version by 1"
      - "recomputes Employee.training_current, calculation plan_compliance_metrics and calculation inspection_readiness_score"
  - method: GET
    path: "/training-assignments/{training_assignment_id}"
    description: "Read one training assignment with its completion, expiry and pinned scenario set version."
    roles: [ProgramAdmin, HRPartner, SafetyOfficer, Employee, SecurityCoordinator, ComplianceAuditor]
    code: 200
    input: []
    output: TrainingAssignment
    side_effects: []
  - method: GET
    path: "/training-assignments"
    description: "List training assignments, filterable by employee, module and status."
    roles: [ProgramAdmin, HRPartner, SafetyOfficer, Employee, SecurityCoordinator, ComplianceAuditor]
    code: 200
    input: ["employee_id?", "module_id?", "status?", "limit?", "offset?"]
    output: TrainingAssignment[]
    side_effects: []
  - method: POST
    path: "/training-assignments/{training_assignment_id}/complete"
    description: "Record a training completion. The employee may only complete their own assignment; the score must reach the module's passing score."
    roles: [Employee, HRPartner]
    code: 200
    input: [score]
    output: TrainingAssignment
    side_effects:
      - "state_machines.TrainingAssignment ASSIGNED_to_COMPLETED"
      - "sets completed_at = logical clock, expires_at = completed_at + module.refresh_interval_days, scenario_set_version = module.scenario_set_version, increments attempt_count"
      - "recomputes Employee.training_current, calculation plan_compliance_metrics and calculation inspection_readiness_score"

  # --------------------------------------------------------- incident reports
  - method: POST
    path: "/incident-reports"
    description: "File an incident or threat report through any reporting channel, including an anonymous dropbox."
    roles: [Employee, SiteManager, SafetyOfficer, Anonymous]
    code: 201
    input: ["worksite_id", "work_area_id", "reporter_employee_id?", "subject_employee_id?", "channel", "occurred_at", "narrative", "incident_type", "weapon_involved?", "injury_level?"]
    output: IncidentReport
    side_effects:
      - "runs calculation incident_severity_classification, setting severity_points, severity_class and log_required"
      - "triage_status = NEW, retaliation_status = NOT_ALLEGED"
  - method: GET
    path: "/incident-reports/{incident_report_id}"
    description: "Read one incident report with its severity classification and both status dimensions."
    roles: [SafetyOfficer, SiteManager, ThreatTeamLead, ThreatTeamMember, HRPartner, ComplianceAuditor, ProgramAdmin]
    code: 200
    input: []
    output: IncidentReport
    side_effects: []
  - method: GET
    path: "/incident-reports"
    description: "List incident reports, filterable by worksite, work area, every employee role on the report and both status dimensions."
    roles: [SafetyOfficer, SiteManager, ThreatTeamLead, ThreatTeamMember, HRPartner, ComplianceAuditor, ProgramAdmin]
    code: 200
    input: ["worksite_id?", "work_area_id?", "reporter_employee_id?", "subject_employee_id?", "triaged_by_employee_id?", "retaliation_claimant_employee_id?", "channel?", "severity_class?", "triage_status?", "retaliation_status?", "limit?", "offset?"]
    output: IncidentReport[]
    side_effects: []
  - method: POST
    path: "/incident-reports/{incident_report_id}/triage"
    description: "Triage a NEW report: ESCALATE it to the threat assessment team or close it with NO_ACTION (MINOR only)."
    roles: [SafetyOfficer]
    code: 200
    input: ["disposition", "triage_note?"]
    output: IncidentReport
    side_effects:
      - "state_machines.IncidentReport NEW_to_ESCALATED or NEW_to_CLOSED_NO_ACTION"
      - "sets triaged_by_employee_id from X-User-ID"
      - "re-runs calculation incident_severity_classification"
  - method: POST
    path: "/incident-reports/{incident_report_id}/retaliation-updates"
    description: "Drive the report's independent retaliation dimension: ALLEGE (reporter only), OPEN_REVIEW, SUBSTANTIATE or DISMISS (HR only)."
    roles: [Employee, HRPartner]
    code: 200
    input: ["action", "statement?"]
    output: IncidentReport
    side_effects:
      - "state_machines.IncidentReport NOT_ALLEGED_to_ALLEGED, ALLEGED_to_UNDER_REVIEW, UNDER_REVIEW_to_SUBSTANTIATED or UNDER_REVIEW_to_UNSUBSTANTIATED"
      - "ALLEGE sets retaliation_claimant_employee_id and engages the anti-retaliation hold at validations[priority=20]"
      - "DISMISS releases the hold; SUBSTANTIATE makes it permanent"

  # ------------------------------------------------------------- threat cases
  - method: POST
    path: "/threat-cases"
    description: "Open a threat assessment case on an ESCALATED report and name its team lead."
    roles: [ThreatTeamLead, SafetyOfficer]
    code: 201
    input: [incident_report_id, lead_employee_id]
    output: ThreatCase
    side_effects:
      - "status = OPEN, assessment_round = 1, protection_status = NOT_APPLICABLE"
      - "copies plan_id from the ACTIVE or REVIEW_DUE PreventionPlan of the report's worksite, and subject_employee_id / protected_employee_id from the report"
      - "runs calculation team_quorum_evaluation, initialising quorum_met = false"
  - method: GET
    path: "/threat-cases/{threat_case_id}"
    description: "Read one threat case with both risk scores, the ballot counter, the protection window and the coverage gap."
    roles: [ThreatTeamLead, ThreatTeamMember, SafetyOfficer, SecurityCoordinator, HRPartner, ComplianceAuditor, ProgramAdmin]
    code: 200
    input: []
    output: ThreatCase
    side_effects: []
  - method: GET
    path: "/threat-cases"
    description: "List threat cases, filterable by report, plan, every employee role on the case, status and risk band."
    roles: [ThreatTeamLead, ThreatTeamMember, SafetyOfficer, SecurityCoordinator, HRPartner, ComplianceAuditor, ProgramAdmin]
    code: 200
    input: ["incident_report_id?", "plan_id?", "lead_employee_id?", "subject_employee_id?", "protected_employee_id?", "status?", "risk_band?", "protection_status?", "limit?", "offset?"]
    output: ThreatCase[]
    side_effects: []
  - method: POST
    path: "/threat-cases/{threat_case_id}/team-assignments"
    description: "Seat a multidisciplinary team member on the case."
    roles: [ThreatTeamLead]
    code: 201
    input: [member_employee_id, discipline, role_on_team]
    output: TeamAssignment
    side_effects:
      - "status = ASSIGNED with no ballot"
      - "re-runs calculation team_quorum_evaluation, refreshing ThreatCase.quorum_met"
  - method: POST
    path: "/threat-cases/{threat_case_id}/convene"
    description: "Convene the team on an OPEN case once quorum is met, producing the interim behavioral risk score."
    roles: [ThreatTeamLead]
    code: 200
    input: ["convene_note?"]
    output: ThreatCase
    side_effects:
      - "state_machines.ThreatCase OPEN_to_ASSESSING"
      - "runs calculation behavioral_risk_score under the INTERIM variant, setting interim_risk_score and risk_band"
      - "sets assessment_round = 1"
  - method: POST
    path: "/threat-cases/{threat_case_id}/ballots"
    description: "Cast one discipline ballot for the case's current assessment round. When the last seated voting member ballots, the case auto-advances to DELIBERATION."
    roles: [ThreatTeamMember, ThreatTeamLead]
    code: 200
    input: [ballot_value, rationale]
    output: TeamAssignment
    side_effects:
      - "writes ballot_value, ballot_round = case.assessment_round and ballot_submitted_at on the caller's TeamAssignment"
      - "increments ThreatCase.ballot_count_current_round"
      - "state_machines.ThreatCase ASSESSING_to_DELIBERATION when every ASSIGNED LEAD or VOTING_MEMBER seat has balloted this round"
  - method: POST
    path: "/threat-cases/{threat_case_id}/reassess"
    description: "Return a DELIBERATION case to ASSESSING for another ballot round, clearing every ballot."
    roles: [ThreatTeamLead]
    code: 200
    input: [reassess_reason]
    output: ThreatCase
    side_effects:
      - "state_machines.ThreatCase DELIBERATION_to_ASSESSING"
      - "increments assessment_round and resets ballot_count_current_round to 0"
      - "clears ballot_value, ballot_round, ballot_weight, ballot_share, ballot_submitted_at and rationale on every TeamAssignment of the case"
  - method: POST
    path: "/threat-cases/{threat_case_id}/decide"
    description: "Record the team's disposition. Computes the consensus behavioral risk score, opens the protection window and, for any non-NO_THREAT disposition, drives the four-link log/worksite/plan cascade."
    roles: [ThreatTeamLead]
    code: 200
    input: ["disposition", "override_justification?"]
    output: ThreatCase
    side_effects:
      - "runs calculation behavioral_risk_score under the CONSENSUS variant, writing consensus_risk_score, risk_band and each counted TeamAssignment.ballot_share"
      - "state_machines.ThreatCase DELIBERATION_to_MONITORING or DELIBERATION_to_CLOSED"
      - "non-NO_THREAT: opens the 14-day protection window, runs calculation protective_coverage_gap_hours, substantiates the IncidentReport, appends a ViolentIncidentLogEntry with 6 of 8 elements, increments Worksite.violent_incident_count_12mo, flips high_risk_flag and drives the worksite plan ACTIVE -> REVIEW_DUE"
      - "NO_THREAT: closes the IncidentReport with CLOSED_NO_ACTION and appends nothing"
  - method: POST
    path: "/threat-cases/{threat_case_id}/close"
    description: "Close a MONITORING case once every post-incident action is complete and the violent incident log carries all eight required elements."
    roles: [ThreatTeamLead]
    code: 200
    input: [closure_summary]
    output: ThreatCase
    side_effects:
      - "state_machines.ThreatCase MONITORING_to_CLOSED"
      - "revokes every remaining SCHEDULED or ACTIVE PROTECTIVE CaseAction, crediting the escort-minute ledger and the work-area restriction counters"
      - "recomputes calculation protective_coverage_gap_hours and sets protection_status = NOT_APPLICABLE"

  # ---------------------------------------------------------- team assignments
  - method: GET
    path: "/team-assignments/{team_assignment_id}"
    description: "Read one team seat with its ballot, weight and rounded share."
    roles: [ThreatTeamLead, ThreatTeamMember, SafetyOfficer, ComplianceAuditor, ProgramAdmin]
    code: 200
    input: []
    output: TeamAssignment
    side_effects: []
  - method: GET
    path: "/team-assignments"
    description: "List team seats, filterable by case, member, discipline and status."
    roles: [ThreatTeamLead, ThreatTeamMember, SafetyOfficer, ComplianceAuditor, ProgramAdmin]
    code: 200
    input: ["case_id?", "member_employee_id?", "discipline?", "role_on_team?", "status?", "ballot_round?", "limit?", "offset?"]
    output: TeamAssignment[]
    side_effects: []

  # -------------------------------------------------------------- case actions
  - method: POST
    path: "/case-actions"
    description: "Record a protective measure (access restriction, schedule change, security escort, restraining-order support) or a post-incident action (counselling referral, team debrief, law-enforcement coordination, safety-plan review)."
    roles: [SecurityCoordinator, HRPartner]
    code: 201
    input: ["case_id", "action_class", "action_type", "subject_employee_id?", "work_area_id?", "escort_employee_id?", "assigned_employee_id?", "starts_at?", "ends_at?", "due_at?", "note?"]
    output: CaseAction
    side_effects:
      - "PROTECTIVE: status = SCHEDULED, duration_minutes = minutes(ends_at - starts_at)"
      - "SECURITY_ESCORT: increments Employee.escort_committed_minutes by duration_minutes"
      - "ACCESS_RESTRICTION: increments WorkArea.restricted_employee_count and Employee.active_restriction_count by 1"
      - "POST_INCIDENT: status = PENDING, auto_generated = false, increments ThreatCase.open_action_count"
      - "recomputes calculation protective_coverage_gap_hours and ThreatCase.protection_status"
  - method: GET
    path: "/case-actions/{case_action_id}"
    description: "Read one case action."
    roles: [SecurityCoordinator, HRPartner, ThreatTeamLead, SafetyOfficer, ComplianceAuditor, ProgramAdmin]
    code: 200
    input: []
    output: CaseAction
    side_effects: []
  - method: GET
    path: "/case-actions"
    description: "List case actions, filterable by case, every employee role on the action, work area, class and status."
    roles: [SecurityCoordinator, HRPartner, ThreatTeamLead, SafetyOfficer, ComplianceAuditor, ProgramAdmin]
    code: 200
    input: ["case_id?", "subject_employee_id?", "work_area_id?", "escort_employee_id?", "assigned_employee_id?", "action_class?", "action_type?", "status?", "auto_generated?", "limit?", "offset?"]
    output: CaseAction[]
    side_effects: []
  - method: POST
    path: "/case-actions/{case_action_id}/revoke"
    description: "Revoke a SCHEDULED or ACTIVE protective measure, reversing every ledger movement it caused."
    roles: [SecurityCoordinator]
    code: 200
    input: [revocation_reason]
    output: CaseAction
    side_effects:
      - "state_machines.CaseAction SCHEDULED_to_REVOKED or ACTIVE_to_REVOKED"
      - "credits Employee.escort_committed_minutes back by exactly duration_minutes, or decrements WorkArea.restricted_employee_count and Employee.active_restriction_count by 1"
      - "recomputes calculation protective_coverage_gap_hours; a case flipping COVERED -> GAP gains an auto_generated SAFETY_PLAN_REVIEW action and can no longer close"
  - method: POST
    path: "/case-actions/{case_action_id}/complete"
    description: "Complete a PENDING or OVERDUE post-incident action."
    roles: [HRPartner, SecurityCoordinator]
    code: 200
    input: ["completion_note?"]
    output: CaseAction
    side_effects:
      - "state_machines.CaseAction PENDING_to_COMPLETED or OVERDUE_to_COMPLETED"
      - "sets completed_at = logical clock and late_flag = completed_at > due_at"
      - "decrements ThreatCase.open_action_count and, when the action was OVERDUE, PreventionPlan.overdue_action_count"
      - "re-runs calculation inspection_readiness_score"

  # ------------------------------------------------------- violent incident log
  - method: GET
    path: "/violent-incident-log/{log_entry_id}"
    description: "Read one immutable violent-incident log entry with its required-element count and retention status."
    roles: [ComplianceAuditor, SafetyOfficer, SiteManager, ThreatTeamLead, ProgramAdmin]
    code: 200
    input: []
    output: ViolentIncidentLogEntry
    side_effects: []
  - method: GET
    path: "/violent-incident-log"
    description: "List log entries, filterable by worksite, report, case, the superseded chain and retention status."
    roles: [ComplianceAuditor, SafetyOfficer, SiteManager, ThreatTeamLead, ProgramAdmin]
    code: 200
    input: ["worksite_id?", "incident_report_id?", "case_id?", "supersedes_entry_id?", "superseded_flag?", "retention_status?", "limit?", "offset?"]
    output: ViolentIncidentLogEntry[]
    side_effects: []
  - method: POST
    path: "/violent-incident-log/{log_entry_id}/amendments"
    description: "Amend a live log entry by appending a corrected successor entry; the original is never mutated."
    roles: [SafetyOfficer]
    code: 201
    input: ["amendment_reason", "perpetrator_class?", "law_enforcement_notified?", "consequence_narrative?", "controls_summary?"]
    output: ViolentIncidentLogEntry
    side_effects:
      - "creates a new entry with supersedes_entry_id set to the target and sets the target's superseded_flag = true"
      - "recomputes required_element_count_present on the new entry from the eight regulatory elements now present"
      - "recomputes calculation plan_compliance_metrics (log_completeness_pct) and calculation inspection_readiness_score"

  # -------------------------------------------------------------------- drills
  - method: POST
    path: "/drills"
    description: "Schedule a prevention drill against a plan."
    roles: [SafetyOfficer]
    code: 201
    input: [plan_id, scenario_type, scheduled_at]
    output: Drill
    side_effects: ["status = SCHEDULED, credited = false"]
  - method: GET
    path: "/drills/{drill_id}"
    description: "Read one drill with its participation percentage and credit flag."
    roles: [SafetyOfficer, SiteManager, ComplianceAuditor, ProgramAdmin]
    code: 200
    input: []
    output: Drill
    side_effects: []
  - method: GET
    path: "/drills"
    description: "List drills, filterable by plan, scenario type and status."
    roles: [SafetyOfficer, SiteManager, ComplianceAuditor, ProgramAdmin]
    code: 200
    input: ["plan_id?", "scenario_type?", "status?", "credited?", "limit?", "offset?"]
    output: Drill[]
    side_effects: []
  - method: POST
    path: "/drills/{drill_id}/execute"
    description: "Record drill execution and its findings; credits the plan when participation reaches 60.00 percent of worksite headcount."
    roles: [SafetyOfficer]
    code: 200
    input: [participant_count, findings_count]
    output: Drill
    side_effects:
      - "state_machines.Drill SCHEDULED_to_EXECUTED"
      - "sets executed_at = logical clock, participation_pct = round(participant_count / worksite.employee_count * 100, 2) and credited = participation_pct >= 60.00"
      - "when credited, increments PreventionPlan.drills_completed_12mo and re-runs calculation inspection_readiness_score"

  # ------------------------------------------------------ test-driving surface
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the server's logical clock. Before any call to this endpoint the logical clock reads exactly 2026-08-01T00:00:00Z; it never falls back to real wall-clock time."
    roles: [ProgramAdmin]
    code: 200
    input: [current_utc]
    output: "{ current_utc: datetime }"
    side_effects: ["no rows change; only the clock all deadline, expiry and window rules read"]
  - method: POST
    path: "/_ops/daily-run"
    description: "Run the nightly compliance sweep in a fixed, pinned step order."
    roles: [ProgramAdmin]
    code: 200
    input: []
    output: "{ training_expired_count: integer, drills_missed_count: integer, protective_activated_count: integer, protective_expired_count: integer, actions_overdue_count: integer, log_retention_expired_count: integer, plans_review_due_count: integer, plans_rescored_count: integer }"
    side_effects:
      - "step 1: TrainingAssignment ASSIGNED_to_EXPIRED (due_at < clock) and COMPLETED_to_EXPIRED (expires_at <= clock), then Employee.training_current refresh"
      - "step 2: Drill SCHEDULED_to_MISSED (scheduled_at < clock)"
      - "step 3: CaseAction SCHEDULED_to_ACTIVE then ACTIVE_to_EXPIRED / SCHEDULED_to_EXPIRED, releasing escort minutes and area restrictions"
      - "step 4: CaseAction PENDING_to_OVERDUE (due_at < clock), incrementing PreventionPlan.overdue_action_count"
      - "step 5: recompute calculation protective_coverage_gap_hours and protection_status for every non-CLOSED case"
      - "step 6: ViolentIncidentLogEntry retention_status ACTIVE -> RETENTION_EXPIRED (retention_expiry_date <= clock)"
      - "step 7: PreventionPlan ACTIVE_to_REVIEW_DUE (review_due_date <= clock), setting compliance_posture RESTRICTED"
      - "step 8: recompute calculation plan_compliance_metrics and calculation inspection_readiness_score for every non-SUPERSEDED plan; steps never reorder, so a plan that becomes REVIEW_DUE in step 7 is always rescored against the RESTRICTED threshold in step 8"

# =============================================================================
# 1.6 Error Code Catalog
# =============================================================================
errors:
  # -- authentication / authorization ----------------------------------------
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "X-User-Role or X-User-ID header missing, or X-User-Role is not one of the ten declared roles (Anonymous may omit X-User-ID)"
  - id: ERR_UNAUTHORIZED
    http: 403
    condition: "the caller's role is not listed in the endpoint's roles, or an entity_backed role's X-User-ID does not resolve to an ACTIVE Employee"
  - id: ERR_NOT_RESOURCE_OWNER
    http: 403
    condition: "an actor with role Employee completes a TrainingAssignment belonging to another employee, or alleges retaliation on a report they did not file"

  # -- existence -------------------------------------------------------------
  - id: ERR_WORKSITE_NOT_FOUND
    http: 404
    condition: "worksite_id in the path or body matches no Worksite"
  - id: ERR_WORK_AREA_NOT_FOUND
    http: 404
    condition: "work_area_id in the path or body matches no WorkArea"
  - id: ERR_PREVENTION_PLAN_NOT_FOUND
    http: 404
    condition: "plan_id in the path or body matches no PreventionPlan"
  - id: ERR_HAZARD_ASSESSMENT_NOT_FOUND
    http: 404
    condition: "hazard_assessment_id in the path matches no HazardAssessment"
  - id: ERR_EMPLOYEE_NOT_FOUND
    http: 404
    condition: "any employee-valued field (employee_id, lead_employee_id, member_employee_id, subject_employee_id, reporter_employee_id, escort_employee_id, assigned_employee_id) matches no Employee"
  - id: ERR_TRAINING_MODULE_NOT_FOUND
    http: 404
    condition: "module_id in the path or body matches no TrainingModule"
  - id: ERR_TRAINING_ASSIGNMENT_NOT_FOUND
    http: 404
    condition: "training_assignment_id in the path matches no TrainingAssignment"
  - id: ERR_INCIDENT_REPORT_NOT_FOUND
    http: 404
    condition: "incident_report_id in the path or body matches no IncidentReport"
  - id: ERR_THREAT_CASE_NOT_FOUND
    http: 404
    condition: "threat_case_id in the path or case_id in the body matches no ThreatCase"
  - id: ERR_TEAM_ASSIGNMENT_NOT_FOUND
    http: 404
    condition: "team_assignment_id in the path matches no TeamAssignment, or the balloting caller holds no TeamAssignment on the case"
  - id: ERR_CASE_ACTION_NOT_FOUND
    http: 404
    condition: "case_action_id in the path matches no CaseAction"
  - id: ERR_LOG_ENTRY_NOT_FOUND
    http: 404
    condition: "log_entry_id in the path matches no ViolentIncidentLogEntry"
  - id: ERR_DRILL_NOT_FOUND
    http: 404
    condition: "drill_id in the path matches no Drill"

  # -- request shape ---------------------------------------------------------
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "malformed body, missing statically required field, out-of-range enum or number, or pagination limit outside 1..100 / negative offset"
  - id: ERR_INVALID_INTERVAL
    http: 422
    condition: "a PROTECTIVE CaseAction omits starts_at or ends_at or has starts_at >= ends_at, or a POST_INCIDENT CaseAction omits due_at or supplies starts_at / ends_at"
  - id: ERR_ACTION_TYPE_CLASS_MISMATCH
    http: 422
    condition: "action_type does not belong to the declared action_class group"
  - id: ERR_ACTION_FIELD_MISSING
    http: 422
    condition: "the field set required by the specific action_type is incomplete (e.g. ACCESS_RESTRICTION without work_area_id, SECURITY_ESCORT without escort_employee_id, POST_INCIDENT without assigned_employee_id)"
  - id: ERR_REPORTER_REQUIRED
    http: 422
    condition: "reporter_employee_id is missing for a non-anonymous channel, or supplied for channel ANONYMOUS_DROPBOX"
  - id: ERR_PARTICIPANT_COUNT_EXCEEDS_HEADCOUNT
    http: 422
    condition: "drill participant_count exceeds Worksite.employee_count, or findings_count exceeds 50"

  # -- optimistic concurrency ------------------------------------------------
  - id: ERR_STALE_PLAN_VERSION
    http: 412
    condition: "expected_plan_version on POST /hazard-assessments does not equal the PreventionPlan's current version"
  - id: ERR_STALE_EMPLOYEE_VERSION
    http: 412
    condition: "expected_employee_version on POST /training-assignments does not equal the Employee's current version"

  # -- state -----------------------------------------------------------------
  - id: ERR_PLAN_INVALID_STATE
    http: 409
    condition: "the PreventionPlan is not in a state from which the requested transition (submit, return-for-revision, activate) is declared"
  - id: ERR_HAZARD_ASSESSMENT_INVALID_STATE
    http: 409
    condition: "validate is called on an assessment that is already VALIDATED or SUPERSEDED"
  - id: ERR_REPORT_INVALID_STATE
    http: 409
    condition: "triage is called on a report whose triage_status is not NEW, or a NO_ACTION disposition is requested for a SERIOUS or CRITICAL report"
  - id: ERR_RETALIATION_INVALID_STATE
    http: 409
    condition: "the requested retaliation action is not declared from the report's current retaliation_status"
  - id: ERR_CASE_INVALID_STATE
    http: 409
    condition: "convene, ballots, reassess, decide or close is called from a case status that does not declare that transition"
  - id: ERR_ACTION_INVALID_STATE
    http: 409
    condition: "revoke is called on a CaseAction that is not SCHEDULED or ACTIVE, complete is called on one that is not PENDING or OVERDUE, or the action_class does not support the operation"
  - id: ERR_TRAINING_INVALID_STATE
    http: 409
    condition: "complete is called on a TrainingAssignment that is not ASSIGNED"
  - id: ERR_DRILL_INVALID_STATE
    http: 409
    condition: "execute is called on a Drill that is not SCHEDULED, or on a drill whose plan is SUPERSEDED"
  - id: ERR_EMPLOYEE_INVALID_STATE
    http: 409
    condition: "separate is called on an Employee whose employment_status is already SEPARATED"
  - id: ERR_LOG_ENTRY_IMMUTABLE
    http: 409
    condition: "an amendment targets a ViolentIncidentLogEntry whose superseded_flag is already true or whose retention_status is RETENTION_EXPIRED"
  - id: ERR_PLAN_POSTURE_FROZEN
    http: 409
    condition: "a CaseAction create or a convene is attempted while the governing PreventionPlan's compliance_posture is FROZEN (plan DRAFT, IN_REVIEW or SUPERSEDED)"

  # -- safety / compliance ---------------------------------------------------
  - id: ERR_ANTI_RETALIATION_HOLD
    http: 409
    condition: "an adverse protective measure (SCHEDULE_CHANGE or ACCESS_RESTRICTION) names as subject an employee who is the retaliation claimant on a report whose retaliation_status is ALLEGED, UNDER_REVIEW or SUBSTANTIATED"
  - id: ERR_ESCORT_NOT_QUALIFIED
    http: 409
    condition: "the named escort is SEPARATED, or lacks a COMPLETED and unexpired TrainingAssignment for a module whose required_for_escort is true"
  - id: ERR_SUBJECT_CONFLICT_OF_INTEREST
    http: 409
    condition: "a team seat names the case's subject, the protected employee, or the reporter of the underlying report"
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 409
    condition: "the plan's submitter attempts to activate it, or a hazard assessment's author attempts to validate it"
  - id: ERR_OPEN_ACTIONS_BLOCK_CLOSE
    http: 409
    condition: "close is attempted while ThreatCase.open_action_count is greater than 0"
  - id: ERR_LOG_ENTRY_REQUIRED_ELEMENT_MISSING
    http: 409
    condition: "close is attempted while some live ViolentIncidentLogEntry of the case has required_element_count_present below 8"

  # -- referential integrity / uniqueness -----------------------------------
  - id: ERR_WORK_AREA_WORKSITE_MISMATCH
    http: 409
    condition: "the named WorkArea belongs to a different Worksite than the plan or the case's incident report"
  - id: ERR_MODULE_SCOPE_MISMATCH
    http: 409
    condition: "the employee's job_function is not contained in the module's job_function_scope"
  - id: ERR_CASE_ALREADY_OPEN_FOR_REPORT
    http: 409
    condition: "a non-CLOSED ThreatCase already exists for the incident_report_id, or the report's triage_status is not ESCALATED"
  - id: ERR_DUPLICATE_TEAM_ASSIGNMENT
    http: 409
    condition: "the employee already holds an ASSIGNED TeamAssignment on this case"
  - id: ERR_DUPLICATE_TEAM_LEAD
    http: 409
    condition: "a second ASSIGNED TeamAssignment with role_on_team LEAD is requested for the same case"

  # -- business constraints --------------------------------------------------
  - id: ERR_QUORUM_NOT_MET
    http: 409
    condition: "calculation team_quorum_evaluation returns quorum_met false: a conditionally required discipline is unseated, fewer than three voting seats exist, or there is not exactly one LEAD"
  - id: ERR_BALLOT_ROUND_CLOSED
    http: 409
    condition: "the caller has already balloted in the current assessment_round, holds an ADVISOR or RECUSED seat, or the case has left ASSESSING"
  - id: ERR_MAX_ASSESSMENT_ROUNDS
    http: 409
    condition: "reassess is requested when assessment_round has already reached 3"
  - id: ERR_DISPOSITION_BAND_MISMATCH
    http: 409
    condition: "the requested disposition does not match the CONSENSUS risk_band mapping and no override_justification was supplied"
  - id: ERR_OVERRIDE_NOT_PERMITTED
    http: 409
    condition: "override_justification is shorter than 40 characters, skips more than one band, or attempts to de-escalate below the band mapping"
  - id: ERR_TRAINING_SCORE_BELOW_PASSING
    http: 409
    condition: "the submitted score is below the module's passing_score"
  - id: ERR_MEASURE_OUTSIDE_PROTECTION_WINDOW
    http: 409
    condition: "a PROTECTIVE CaseAction's interval lies wholly at or after protection_window_end, or wholly at or before protection_window_start"
  - id: ERR_ESCORT_DOUBLE_BOOKED
    http: 409
    condition: "the escort's requested interval, widened by 30 minutes on each side, overlaps another SCHEDULED or ACTIVE SECURITY_ESCORT for the same escort employee on any case"
  - id: ERR_AREA_RESTRICTION_CAPACITY
    http: 409
    condition: "the number of overlapping SCHEDULED or ACTIVE ACCESS_RESTRICTION measures on the work area would reach max(1, floor(occupancy_cap * 0.25))"
  - id: ERR_HAZARD_COVERAGE_INCOMPLETE
    http: 409
    condition: "activate is attempted while hazard_coverage_pct is below 100.00"
  - id: ERR_TRAINING_COMPLIANCE_BELOW_THRESHOLD
    http: 409
    condition: "activate is attempted while training_compliance_pct is below 80.00"

# =============================================================================
# 1.7 RBAC Matrix  (role_model: segregation_of_duties)
# =============================================================================
roles:
  - name: SafetyOfficer
    description: "Owns plan authorship, hazard screening, incident triage, drills and the violent incident log. Never approves their own work."
    identity: "entity_backed:Employee"
    exclusive_operations:
      - "POST /prevention-plans"
      - "POST /prevention-plans/{plan_id}/submit"
      - "POST /hazard-assessments"
      - "POST /incident-reports/{incident_report_id}/triage"
      - "POST /drills"
      - "POST /drills/{drill_id}/execute"
      - "POST /violent-incident-log/{log_entry_id}/amendments"
    shared_operations:
      - "POST /incident-reports"
      - "POST /threat-cases"
      - "GET /worksites, GET /worksites/{worksite_id}, GET /work-areas, GET /work-areas/{work_area_id}"
      - "GET /prevention-plans, GET /prevention-plans/{plan_id}, GET /hazard-assessments, GET /hazard-assessments/{hazard_assessment_id}"
      - "GET /employees, GET /employees/{employee_id}, GET /training-modules, GET /training-modules/{module_id}"
      - "GET /training-assignments, GET /training-assignments/{training_assignment_id}"
      - "GET /incident-reports, GET /incident-reports/{incident_report_id}, GET /threat-cases, GET /threat-cases/{threat_case_id}"
      - "GET /team-assignments, GET /team-assignments/{team_assignment_id}, GET /case-actions, GET /case-actions/{case_action_id}"
      - "GET /violent-incident-log, GET /violent-incident-log/{log_entry_id}, GET /drills, GET /drills/{drill_id}"
  - name: SiteManager
    description: "Second pair of eyes: returns plans for revision, activates them and validates hazard assessments authored by someone else."
    identity: "entity_backed:Employee"
    exclusive_operations:
      - "POST /prevention-plans/{plan_id}/return-for-revision"
      - "POST /prevention-plans/{plan_id}/activate"
      - "POST /hazard-assessments/{hazard_assessment_id}/validate"
    shared_operations:
      - "POST /incident-reports"
      - "GET /worksites, GET /worksites/{worksite_id}, GET /work-areas, GET /work-areas/{work_area_id}"
      - "GET /prevention-plans, GET /prevention-plans/{plan_id}, GET /hazard-assessments, GET /hazard-assessments/{hazard_assessment_id}"
      - "GET /employees, GET /employees/{employee_id}, GET /incident-reports, GET /incident-reports/{incident_report_id}"
      - "GET /violent-incident-log, GET /violent-incident-log/{log_entry_id}, GET /drills, GET /drills/{drill_id}"
  - name: ThreatTeamLead
    description: "Chairs the multidisciplinary threat assessment team: seats members, convenes, reassesses, decides and closes."
    identity: "entity_backed:Employee"
    exclusive_operations:
      - "POST /threat-cases/{threat_case_id}/team-assignments"
      - "POST /threat-cases/{threat_case_id}/convene"
      - "POST /threat-cases/{threat_case_id}/reassess"
      - "POST /threat-cases/{threat_case_id}/decide"
      - "POST /threat-cases/{threat_case_id}/close"
    shared_operations:
      - "POST /threat-cases"
      - "POST /threat-cases/{threat_case_id}/ballots"
      - "GET /worksites/{worksite_id}, GET /work-areas, GET /work-areas/{work_area_id}"
      - "GET /prevention-plans, GET /prevention-plans/{plan_id}, GET /hazard-assessments, GET /hazard-assessments/{hazard_assessment_id}"
      - "GET /employees, GET /employees/{employee_id}, GET /incident-reports, GET /incident-reports/{incident_report_id}"
      - "GET /threat-cases, GET /threat-cases/{threat_case_id}, GET /team-assignments, GET /team-assignments/{team_assignment_id}"
      - "GET /case-actions, GET /case-actions/{case_action_id}, GET /violent-incident-log, GET /violent-incident-log/{log_entry_id}"
  - name: ThreatTeamMember
    description: "Seated discipline representative who casts exactly one weighted ballot per assessment round."
    identity: "entity_backed:Employee"
    exclusive_operations: []
    shared_operations:
      - "POST /threat-cases/{threat_case_id}/ballots"
      - "GET /incident-reports, GET /incident-reports/{incident_report_id}"
      - "GET /threat-cases, GET /threat-cases/{threat_case_id}"
      - "GET /team-assignments, GET /team-assignments/{team_assignment_id}"
  - name: SecurityCoordinator
    description: "Implements and revokes physical protective measures: access restrictions, schedule changes, escorts and restraining-order support."
    identity: "entity_backed:Employee"
    exclusive_operations:
      - "POST /case-actions/{case_action_id}/revoke"
    shared_operations:
      - "POST /case-actions"
      - "POST /case-actions/{case_action_id}/complete"
      - "GET /work-areas, GET /work-areas/{work_area_id}, GET /employees, GET /employees/{employee_id}"
      - "GET /training-assignments, GET /training-assignments/{training_assignment_id}"
      - "GET /threat-cases, GET /threat-cases/{threat_case_id}, GET /case-actions, GET /case-actions/{case_action_id}"
  - name: HRPartner
    description: "Owns the workforce record and the anti-retaliation review: assigns training, separates employees, and reviews retaliation claims."
    identity: "entity_backed:Employee"
    exclusive_operations:
      - "POST /employees/{employee_id}/separate"
      - "POST /training-assignments"
    shared_operations:
      - "POST /training-assignments/{training_assignment_id}/complete"
      - "POST /incident-reports/{incident_report_id}/retaliation-updates"
      - "POST /case-actions"
      - "POST /case-actions/{case_action_id}/complete"
      - "GET /prevention-plans, GET /prevention-plans/{plan_id}, GET /employees, GET /employees/{employee_id}"
      - "GET /training-modules, GET /training-modules/{module_id}, GET /training-assignments, GET /training-assignments/{training_assignment_id}"
      - "GET /incident-reports, GET /incident-reports/{incident_report_id}, GET /threat-cases, GET /threat-cases/{threat_case_id}"
      - "GET /case-actions, GET /case-actions/{case_action_id}"
  - name: Employee
    description: "Any worker: reports incidents, completes their own training, and alleges retaliation on their own report."
    identity: "entity_backed:Employee"
    exclusive_operations: []
    shared_operations:
      - "POST /incident-reports"
      - "POST /training-assignments/{training_assignment_id}/complete"
      - "POST /incident-reports/{incident_report_id}/retaliation-updates"
      - "GET /training-modules, GET /training-modules/{module_id}"
      - "GET /training-assignments, GET /training-assignments/{training_assignment_id}"
  - name: ComplianceAuditor
    description: "Read-only regulatory inspector. Sees every table, changes nothing."
    identity: "opaque"
    exclusive_operations: []
    shared_operations:
      - "GET /worksites, GET /worksites/{worksite_id}, GET /work-areas, GET /work-areas/{work_area_id}"
      - "GET /prevention-plans, GET /prevention-plans/{plan_id}, GET /hazard-assessments, GET /hazard-assessments/{hazard_assessment_id}"
      - "GET /employees, GET /employees/{employee_id}, GET /training-modules, GET /training-modules/{module_id}"
