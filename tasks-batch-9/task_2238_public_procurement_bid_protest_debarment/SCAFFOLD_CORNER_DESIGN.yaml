          assert:
            - "HTTP 412 with $.data.error_id == ERR_STALE_SOLICITATION_VERSION"
            - "${c_s51_v_fresh} == ${c_s51_v_stale} + 1: the addendum advanced the parent version"
            - "GET /procurement/bids?solicitation_id=${c_s51_id} returns total_count 0 and Solicitation.${c_s51_id}.version == ${c_s51_v_fresh} (the failed create did not advance it)"
            - "the identical body with expected_solicitation_version ${c_s51_v_fresh} returns HTTP 201 and Solicitation.${c_s51_id}.version becomes ${c_s51_v_fresh} + 1"

      - name: corner_occ_rejects_a_second_petition_citing_the_pre_filing_proceeding_version
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[reinstatement-petition-stale-proceeding]
          - errors[ERR_STALE_PROCEEDING_VERSION]
          - endpoints[POST /procurement/debarment-proceedings/{id}/reinstatement-petitions]
        distinguishing_aspect: "Filing a petition itself advances DebarmentProceeding.version, so after the first petition is DENIED the vendor's retry with the originally observed version is refused 412 ERR_STALE_PROCEEDING_VERSION — not ERR_PETITION_ALREADY_PENDING, since the first petition is no longer FILED."
        test_recipe:
          setup:
            - "clock pinned to 2026-08-01T00:00:00Z; one Vendor debarred at 2026-08-16T00:00:00Z with aggravating [REPEATED_NONPERFORMANCE, SAFETY_VIOLATION] (severity 35.00, 12 months, earliest petition 2027-02-16T00:00:00Z)"
            - "at 2027-03-01T00:00:00Z the vendor read the proceeding version, filed a petition with it, and the authority DENIED that petition"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: SystemAdmin
              as_user_id: "U-ADMIN-1"
