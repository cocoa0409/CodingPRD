              as: LoanServicer
              as_user_id: "svc-1"
              captures: { loan_a: $.data.id }
            - call: "POST /v1/loans"
              payload: { borrower_id: "${brw_id}", loan_type: "DIRECT_UNSUBSIDIZED", original_principal_cents: 200000, interest_rate_bps: 0, disbursement_date: "2026-06-01" }
              as: LoanServicer
              as_user_id: "svc-1"
              captures: { loan_b: $.data.id }
            - call: "POST /v1/loans/${loan_a}/servicing-events"
              payload: { event_type: "GRACE_BEGIN", effective_on: "2026-06-01", reason_code: "OTHER" }
              as: LoanServicer
              as_user_id: "svc-1"
            - call: "POST /v1/loans/${loan_a}/servicing-events"
              payload: { event_type: "REPAYMENT_BEGIN", effective_on: "2026-06-01", reason_code: "GRACE_EXPIRY" }
              as: LoanServicer
              as_user_id: "svc-1"
              captures: { va3: $.data.loan_version }
            - call: "POST /v1/repayment-plans"
              payload: { loan_id: "${loan_a}", plan_type: "STANDARD_10YR", state_of_residence: "CONTIGUOUS", expected_loan_version: "${va3}" }
              as: LoanServicer
              as_user_id: "svc-1"
            - call: "POST /v1/loans/${loan_b}/servicing-events"
              payload: { event_type: "GRACE_BEGIN", effective_on: "2026-06-01", reason_code: "OTHER" }
              as: LoanServicer
              as_user_id: "svc-1"
            - call: "POST /v1/loans/${loan_b}/servicing-events"
              payload: { event_type: "REPAYMENT_BEGIN", effective_on: "2026-06-01", reason_code: "GRACE_EXPIRY" }
              as: LoanServicer
              as_user_id: "svc-1"
              captures: { vb3: $.data.loan_version }
            - call: "POST /v1/repayment-plans"
              payload: { loan_id: "${loan_b}", plan_type: "STANDARD_10YR", state_of_residence: "CONTIGUOUS", expected_loan_version: "${vb3}" }
              as: LoanServicer
              as_user_id: "svc-1"
            - call: "POST /v1/payments"
              payload: { loan_id: "${loan_a}", amount_cents: 1000, posted_on: "2026-06-01", source: "ACH" }
              as: LoanServicer
              as_user_id: "svc-1"
            - call: "POST /v1/payments"
              payload: { loan_id: "${loan_b}", amount_cents: 2000, posted_on: "2026-06-01", source: "ACH" }
              as: LoanServicer
              as_user_id: "svc-1"
          trigger:
            - call: "GET /v1/payments?loan_id=${loan_a}"
              payload: {}
              as: LoanServicer
              as_user_id: "svc-1"
          assert:
            - "response.data.length == 1"
            - "response.data[0].loan_id == '${loan_a}'"
            - "response.data[0].amount_cents == 1000"

      - name: clock_advance_idempotent_to_same_time_fails
        claim_type: Action endpoint
        grounds:
          - endpoints["POST /v1/_clock/advance"]
          - errors[ERR_INVALID_CLOCK]
        excluded_because:
          difficulty_instance: boundary_precision_check / payment_backdate_window_15_day_half_open_boundary
          rationale: "Indirectly tested by the clock-window boundary test; the strict 'must be greater than current' invariant is already exercised when chained tests advance the clock."

      - name: response_envelope_success_object_structure
        claim_type: Computed read
        grounds:
          - response_envelope.success
        distinguishing_aspect: "Successful GET response has top-level meta with api_request_id (string starting 'req_') and api_request_timestamp (ISO 8601), plus response_type='object' and a data field."
        test_recipe:
          setup: ["One Borrower."]
          setup_api_calls:
            - call: "POST /v1/_clock/advance"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: LoanServicer
              as_user_id: "svc-1"
            - call: "POST /v1/borrowers"
              payload: { ssn_last4: "2323", full_name: "Env Test", date_of_birth: "1990-01-01", email: "env@example.com" }
              as: LoanServicer
              as_user_id: "svc-1"
              captures: { brw_id: $.data.id }
          trigger:
            - call: "GET /v1/borrowers/${brw_id}"
              payload: {}
              as: LoanServicer
              as_user_id: "svc-1"
          assert:
            - "response.meta.api_request_id starts_with 'req_'"
            - "response.response_type == 'object'"
            - "response.data.id == '${brw_id}'"

      - name: response_envelope_error_structure
        claim_type: Computed read
        grounds:
          - response_envelope.error
        distinguishing_aspect: "Error responses have response_type='error', data.error_id starting 'ERR_', and data.message non-empty."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "GET /v1/borrowers/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: LoanServicer
              as_user_id: "svc-1"
          assert:
            - "response.response_type == 'error'"
            - "response.data.error_id == ERR_NOT_FOUND"
            - "response.data.message is non-empty"

