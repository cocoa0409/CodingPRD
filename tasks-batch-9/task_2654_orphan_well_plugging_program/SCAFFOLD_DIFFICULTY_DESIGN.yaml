            - "hop 3: Well.${w_shallow_id}.status == ORPHAN_CANDIDATE and Well.${w_deep_id}.status == ORPHAN_CANDIDATE"
            - "hop 4: Well.${w_shallow_id}.screening_score == 59.90 and remediation_score == 81.00; Well.${w_deep_id}.screening_score == 50.35 and remediation_score == 39.70"
            - "hop 4: Operator.${op_id}.orphan_candidate_count == 2, active_well_count == 2, required_bond_cents == 1250000"
            - "the FORFEIT_BOND request body named none of the wells, the funding source, or any score"
