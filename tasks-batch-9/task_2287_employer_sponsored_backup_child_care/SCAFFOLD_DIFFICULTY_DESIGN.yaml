# SCAFFOLD_DIFFICULTY_DESIGN.yaml — §1.8 test-targeting index for
# task_2287_employer_sponsored_backup_child_care.
# Nine §0.5 rule_ids x >= 2 instances = 20 instances. Every instance grounds in
# SCAFFOLD.yaml §1.1-§1.7 only; deleting this file leaves declared behavior identical.
# Logical clock default is 2026-08-01T00:00:00Z; every chain sets it explicitly.
scaffold_difficulty_design:

  # =====================================================================
  - rule_id: dual_variant_calc
    instances:

      - name: in_home_day_charge_provisional_one_day_vs_final_two_days
        grounds:
          - calculations.reservation_billable_hours
          - calculations.reservation_day_charge
          - calculations.entitlement_split
          - calculations.reservation_charge_money
          - state_machines.Reservation.OFFERED_to_CONFIRMED
          - state_machines.Reservation.IN_SERVICE_to_COMPLETED
          - entities.Reservation.fields.days_charged_provisional
          - entities.Reservation.fields.days_charged_final
        distinguishing_aspect: |
          This instance's dual variant lives in the Reservation billing domain: the PROVISIONAL
          and FINAL variants of reservation_day_charge read the same plan snapshot and the same
          IN_HOME_HOURS_PER_DAY constant yet return 1 day and 2 days respectively, because the
          requested window is 6.00h and the reported window is 9.50h — a different entity domain
          from the Provider risk-scoring dual variant in provider_rolling_quality_88_80_vs_lifetime_54_00.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z."
            - "Employer Northwind Health with admin_fee_pct 0.085 and overage_billing_enabled true."
            - "ACTIVE BenefitPlan: annual_use_limit_days 10, copay_in_home_cents_per_hour 400, in_home_min_billable_hours 4."
            - "Employee Dana Reed with one ACTIVE CHILD dependent."
            - "IN_HOME provider HomeCare Aides, CREDENTIALED with all four required credentials, max_concurrent_assignments 1."
            - "One OPEN CapacityBlock on 2026-08-10 from 08:00Z to 19:00Z."
            - "One Reservation requesting IN_HOME care 2026-08-10 09:00Z-15:00Z (6.00h) already matched and OFFERED."
          setup_api_calls:
            - call: "POST /backup-care/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: network_admin
              as_user_id: "u_na_1"
            - call: "POST /backup-care/employers"
              payload: { name: "Northwind Health", industry_code: "HOSP", contract_status: "ACTIVE", fiscal_year_start_month: 1, invoicing_cycle: "MONTHLY", admin_fee_pct: 0.085, overage_billing_enabled: true, adult_elder_extension_enabled: true }
              as: network_admin
              as_user_id: "u_na_1"
              captures: { emp_id: $.data.id, emp_v: $.data.version }
            - call: "POST /backup-care/benefit-plans"
              payload: { employer_id: "${emp_id}", expected_employer_version: "${emp_v}", plan_code: "BUC-1", annual_use_limit_days: 10, copay_center_cents_per_day: 1500, copay_in_home_cents_per_hour: 400, in_home_min_billable_hours: 4, eligible_dependent_types: ["CHILD", "ADULT_ELDER"], max_dependents_per_reservation: 3, overage_rate_center_cents_per_day: 20000, overage_rate_in_home_cents_per_hour: 3000, cancellation_window_hours: 24, no_show_charge_cents: 12000, effective_from: "2026-01-01T00:00:00Z" }
              as: benefits_admin
              as_user_id: "u_ba_1"
              captures: { plan_id: $.data.id }
            - call: "POST /backup-care/benefit-plans/${plan_id}/activate"
              payload: {}
              as: benefits_admin
              as_user_id: "u_ba_1"
            - call: "POST /backup-care/employees"
              payload: { employer_id: "${emp_id}", benefit_plan_id: "${plan_id}", employee_external_id: "E-1001", user_id: "u_ee_1", email: "dana@northwind.test", full_name: "Dana Reed", employment_status: "ACTIVE" }
              as: benefits_admin
              as_user_id: "u_ba_1"
              captures: { ee_id: $.data.id }
            - call: "POST /backup-care/employees/${ee_id}/dependents"
              payload: { full_name: "Kai Reed", dependent_type: "CHILD", date_of_birth: "2020-03-04", relationship: "SON", status: "ACTIVE" }
              as: benefits_admin
              as_user_id: "u_ba_1"
              captures: { dep1_id: $.data.id }
            - call: "POST /backup-care/providers"
              payload: { provider_name: "HomeCare Aides", owner_user_id: "u_pm_1", care_mode: "IN_HOME", market_code: "MKT-BOS", postal_code: "02110", daily_capacity_slots: 1, max_concurrent_assignments: 1, same_day_available: true }
              as: network_admin
              as_user_id: "u_na_1"
              captures: { prov_h_id: $.data.id }
            - call: "POST /backup-care/providers/${prov_h_id}/credentials"
              payload: { credential_type: "LICENSE", issued_on: "2026-01-02", expires_on: "2027-01-02", verified_by: "u_na_1" }
              as: network_admin
              as_user_id: "u_na_1"
            - call: "POST /backup-care/providers/${prov_h_id}/credentials"
              payload: { credential_type: "BACKGROUND_CHECK", issued_on: "2026-01-02", expires_on: "2027-01-02", verified_by: "u_na_1" }
              as: network_admin
              as_user_id: "u_na_1"
            - call: "POST /backup-care/providers/${prov_h_id}/credentials"
              payload: { credential_type: "CPR", issued_on: "2026-01-02", expires_on: "2027-01-02", verified_by: "u_na_1" }
              as: network_admin
              as_user_id: "u_na_1"
            - call: "POST /backup-care/providers/${prov_h_id}/credentials"
              payload: { credential_type: "INSURANCE", issued_on: "2026-01-02", expires_on: "2027-01-02", verified_by: "u_na_1" }
              as: network_admin
              as_user_id: "u_na_1"
            - call: "POST /backup-care/providers/${prov_h_id}/credential-review"
              payload: {}
              as: network_admin
              as_user_id: "u_na_1"
            - call: "POST /backup-care/providers/${prov_h_id}/capacity-blocks"
              payload: { start_time_utc: "2026-08-10T08:00:00Z", end_time_utc: "2026-08-10T19:00:00Z", total_slots: 1 }
              as: network_admin
              as_user_id: "u_na_1"
              captures: { blk_h_id: $.data.id, blk_h_v: $.data.version }
            - call: "POST /backup-care/reservations"
              payload: { employee_id: "${ee_id}", requested_care_mode: "IN_HOME", market_code: "MKT-BOS", care_start_utc: "2026-08-10T09:00:00Z", care_end_utc: "2026-08-10T15:00:00Z", dependent_ids: ["${dep1_id}"] }
              as: care_coordinator
              as_user_id: "u_cc_1"
              captures: { res_id: $.data.id }
            - call: "POST /backup-care/reservations/${res_id}/match"
              payload: {}
              as: care_coordinator
              as_user_id: "u_cc_1"
          trigger:
            - call: "POST /backup-care/reservations/${res_id}/confirm"
              payload: { capacity_block_id: "${blk_h_id}", expected_capacity_block_version: "${blk_h_v}" }
              as: care_coordinator
              as_user_id: "u_cc_1"
              captures: { copay_at_confirm: $.data.copay_cents, hours_at_confirm: $.data.billable_hours_provisional }
            - call: "POST /backup-care/_clock/set_current_utc"
              payload: { current_utc: "2026-08-10T08:30:00Z" }
              as: network_admin
              as_user_id: "u_na_1"
            - call: "POST /backup-care/reservations/${res_id}/check-in"
              payload: {}
              as: care_coordinator
              as_user_id: "u_cc_1"
            - call: "POST /backup-care/_clock/set_current_utc"
              payload: { current_utc: "2026-08-10T19:00:00Z" }
              as: network_admin
              as_user_id: "u_na_1"
            - call: "POST /backup-care/reservations/${res_id}/complete"
              payload: { actual_start_utc: "2026-08-10T09:00:00Z", actual_end_utc: "2026-08-10T18:30:00Z" }
              as: care_coordinator
              as_user_id: "u_cc_1"
          assert:
            - "${hours_at_confirm} == 6.00"
            - "${copay_at_confirm} == 2400"
            - "Reservation.${res_id}.billable_hours_provisional == 6.00"
            - "Reservation.${res_id}.days_charged_provisional == 1"
            - "Reservation.${res_id}.billable_hours_final == 9.50"
            - "Reservation.${res_id}.days_charged_final == 2"
            - "Reservation.${res_id}.days_charged_final != Reservation.${res_id}.days_charged_provisional"
            - "Reservation.${res_id}.covered_days == 2"
            - "Reservation.${res_id}.overage_days == 0"
            - "Reservation.${res_id}.overage_tier_multiplier == 1.00"
            - "Reservation.${res_id}.copay_cents == 3800"
            - "Reservation.${res_id}.overage_cents == 0"
            - "Reservation.${res_id}.fulfillment_status == COMPLETED"
            - "Reservation.${res_id}.billing_status == ACCRUED"
            - "Employee.${ee_id}.entitlement_days_used == 2"
            - "Employee.${ee_id}.entitlement_days_reserved == 0"
            - "GET /backup-care/reservations/${res_id}/ledger-entries returns exactly 3 UsageLedgerEntry rows with entry_type in order RESERVE, RELEASE, COMMIT and days_delta 1, -1, 2"

      - name: provider_rolling_quality_88_80_vs_lifetime_54_00
        grounds:
          - calculations.provider_quality_score
          - state_machines.IncidentReport.UNDER_REVIEW_to_SUBSTANTIATED
          - entities.Provider.fields.quality_score
          - entities.Provider.fields.lifetime_quality_score
          - entities.Provider.fields.substantiated_incident_count
        distinguishing_aspect: |
          This instance's dual variant lives in the Provider network-quality domain: ROLLING_90D
          applies the 30/60/90-day decay bands while LIFETIME_UNDECAYED ignores age, so the same
          three SUBSTANTIATED IncidentReport rows yield quality_score 88.80 and
          lifetime_quality_score 54.00 — a different entity domain from the Reservation billing
          dual variant in in_home_day_charge_provisional_one_day_vs_final_two_days.
        test_recipe:
          setup:
            - "Logical clock walked forward 2026-08-01Z -> 2026-09-20Z -> 2026-10-25Z."
            - "One CENTER_BASED provider Bright Start Center, CREDENTIALED, completed_reservation_count 0."
            - "Three SUBSTANTIATED IncidentReport rows with qa_action NONE: SEVERE reported 2026-08-01Z, MODERATE reported 2026-09-20Z, MINOR reported 2026-10-25Z."
            - "Each report is filed by u_cc_1 and resolved by u_na_1 so validation priority 240 never fires."
          setup_api_calls:
            - call: "POST /backup-care/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: network_admin
              as_user_id: "u_na_1"
            - call: "POST /backup-care/providers"
              payload: { provider_name: "Bright Start Center", owner_user_id: "u_pm_2", care_mode: "CENTER_BASED", market_code: "MKT-BOS", postal_code: "02111", daily_capacity_slots: 6, max_concurrent_assignments: 1, same_day_available: true }
              as: network_admin
              as_user_id: "u_na_1"
              captures: { prov_c_id: $.data.id }
            - call: "POST /backup-care/providers/${prov_c_id}/credentials"
              payload: { credential_type: "LICENSE", issued_on: "2026-01-02", expires_on: "2027-06-30", verified_by: "u_na_1" }
              as: network_admin
              as_user_id: "u_na_1"
            - call: "POST /backup-care/providers/${prov_c_id}/credentials"
              payload: { credential_type: "BACKGROUND_CHECK", issued_on: "2026-01-02", expires_on: "2027-06-30", verified_by: "u_na_1" }
              as: network_admin
              as_user_id: "u_na_1"
            - call: "POST /backup-care/providers/${prov_c_id}/credentials"
              payload: { credential_type: "CPR", issued_on: "2026-01-02", expires_on: "2027-06-30", verified_by: "u_na_1" }
              as: network_admin
              as_user_id: "u_na_1"
            - call: "POST /backup-care/providers/${prov_c_id}/credentials"
              payload: { credential_type: "INSURANCE", issued_on: "2026-01-02", expires_on: "2027-06-30", verified_by: "u_na_1" }
              as: network_admin
              as_user_id: "u_na_1"
            - call: "POST /backup-care/providers/${prov_c_id}/credential-review"
              payload: {}
              as: network_admin
              as_user_id: "u_na_1"
            - call: "POST /backup-care/incident-reports"
              payload: { provider_id: "${prov_c_id}", severity: "SEVERE", category: "SUPERVISION", narrative: "Unattended child in the toddler room for 8 minutes." }
              as: care_coordinator
              as_user_id: "u_cc_1"
              captures: { inc1_id: $.data.id }
            - call: "POST /backup-care/incident-reports/${inc1_id}/review"
              payload: {}
              as: care_coordinator
              as_user_id: "u_cc_1"
            - call: "POST /backup-care/incident-reports/${inc1_id}/substantiate"
              payload: { qa_action: "NONE", resolution_reason_code: "COACHING_ISSUED" }
              as: network_admin
              as_user_id: "u_na_1"
            - call: "POST /backup-care/_clock/set_current_utc"
              payload: { current_utc: "2026-09-20T00:00:00Z" }
              as: network_admin
              as_user_id: "u_na_1"
            - call: "POST /backup-care/incident-reports"
              payload: { provider_id: "${prov_c_id}", severity: "MODERATE", category: "FACILITY", narrative: "Playground gate latch found unsecured at drop-off." }
              as: care_coordinator
              as_user_id: "u_cc_1"
              captures: { inc2_id: $.data.id }
            - call: "POST /backup-care/incident-reports/${inc2_id}/review"
              payload: {}
              as: care_coordinator
              as_user_id: "u_cc_1"
            - call: "POST /backup-care/incident-reports/${inc2_id}/substantiate"
              payload: { qa_action: "NONE", resolution_reason_code: "FACILITY_REPAIRED" }
              as: network_admin
              as_user_id: "u_na_1"
            - call: "POST /backup-care/_clock/set_current_utc"
              payload: { current_utc: "2026-10-25T00:00:00Z" }
              as: network_admin
              as_user_id: "u_na_1"
            - call: "POST /backup-care/incident-reports"
              payload: { provider_id: "${prov_c_id}", severity: "MINOR", category: "DOCUMENTATION", narrative: "Sign-out sheet missing a guardian signature." }
              as: care_coordinator
              as_user_id: "u_cc_1"
              captures: { inc3_id: $.data.id }
            - call: "POST /backup-care/incident-reports/${inc3_id}/review"
              payload: {}
              as: care_coordinator
              as_user_id: "u_cc_1"
            - call: "POST /backup-care/incident-reports/${inc3_id}/substantiate"
              payload: { qa_action: "NONE", resolution_reason_code: "PAPERWORK_CORRECTED" }
              as: network_admin
              as_user_id: "u_na_1"
          trigger:
            - call: "POST /backup-care/_clock/set_current_utc"
              payload: { current_utc: "2026-11-01T00:00:00Z" }
              as: network_admin
              as_user_id: "u_na_1"
            - call: "GET /backup-care/providers/${prov_c_id}"
              payload: {}
              as: network_admin
              as_user_id: "u_na_1"
              captures: { q_rolling: $.data.quality_score, q_lifetime: $.data.lifetime_quality_score }
          assert:
            - "${q_rolling} == 88.80"
            - "${q_lifetime} == 54.00"
            - "Provider.${prov_c_id}.quality_score == 88.80"
            - "Provider.${prov_c_id}.lifetime_quality_score == 54.00"
            - "Provider.${prov_c_id}.quality_score != Provider.${prov_c_id}.lifetime_quality_score"
            - "Provider.${prov_c_id}.substantiated_incident_count == 3"
            - "Provider.${prov_c_id}.completed_reservation_count == 0"
            - "Provider.${prov_c_id}.network_status == CREDENTIALED"
            - "IncidentReport.${inc1_id}.incident_status == SUBSTANTIATED and IncidentReport.${inc1_id}.qa_action == NONE"
            - "The SEVERE report is 92 days old at 2026-11-01T00:00:00Z, so its decay factor is 0.00 in ROLLING_90D and 1.00 in LIFETIME_UNDECAYED"

  # =====================================================================
  - rule_id: combinatorial_formula
    instances:

      - name: rank_score_probation_factor_demotes_highest_quality_provider_to_last
        grounds:
          - calculations.match_rank_score
          - calculations.capacity_and_window_admission
          - calculations.provider_quality_score
          - state_machines.Reservation.INTAKE_to_OFFERED
          - state_machines.Provider.CREDENTIALED_to_PROBATION
          - entities.MatchOffer.fields.rank_score
          - entities.MatchOffer.fields.probation_penalty_applied
        distinguishing_aspect: |
          Mode (a) — non-linear interaction of four or more inputs: rank_score combines
          quality_score, a min()-clamped remaining/seats ratio, a branch on requested_care_mode
          versus provider care_mode, a continuity indicator and a multiplicative PROBATION_FACTOR,
          so the provider with the HIGHEST quality_score (100) finishes LAST at 0.4500 while a
          quality-96 provider wins at 0.8820; no monotone function of quality alone reproduces
          this ordering.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z."
            - "Employer + ACTIVE plan with annual_use_limit_days 10; employee with one ACTIVE CHILD dependent."
            - "Provider P1 Alpha Center: CENTER_BASED, quality_score 100, network_status PROBATION, OPEN block on 2026-08-10 with total_slots 10."
            - "Provider P2 Beta Home Aides: IN_HOME, one SUBSTANTIATED MODERATE incident so quality_score 88.00, max_concurrent_assignments 1, OPEN block with total_slots 1."
            - "Provider P3 Gamma Center: CENTER_BASED, one SUBSTANTIATED MINOR incident so quality_score 96.00, OPEN block with total_slots 2."
            - "One Reservation in INTAKE requesting care_mode EITHER for 2026-08-10 09:00Z-13:00Z with one dependent."
          setup_api_calls:
            - call: "POST /backup-care/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: network_admin
              as_user_id: "u_na_1"
            - call: "POST /backup-care/employers"
              payload: { name: "Rankwell Labs", industry_code: "BIOTECH", contract_status: "ACTIVE", admin_fee_pct: 0.085, overage_billing_enabled: true, adult_elder_extension_enabled: true }
              as: network_admin
              as_user_id: "u_na_1"
              captures: { emp_id: $.data.id, emp_v: $.data.version }
            - call: "POST /backup-care/benefit-plans"
              payload: { employer_id: "${emp_id}", expected_employer_version: "${emp_v}", plan_code: "RANK-1", annual_use_limit_days: 10, copay_center_cents_per_day: 1500, copay_in_home_cents_per_hour: 400, in_home_min_billable_hours: 4, eligible_dependent_types: ["CHILD"], max_dependents_per_reservation: 3, overage_rate_center_cents_per_day: 20000, overage_rate_in_home_cents_per_hour: 3000, cancellation_window_hours: 24, no_show_charge_cents: 12000, effective_from: "2026-01-01T00:00:00Z" }
              as: benefits_admin
              as_user_id: "u_ba_1"
              captures: { plan_id: $.data.id }
            - call: "POST /backup-care/benefit-plans/${plan_id}/activate"
              payload: {}
              as: benefits_admin
              as_user_id: "u_ba_1"
            - call: "POST /backup-care/employees"
              payload: { employer_id: "${emp_id}", benefit_plan_id: "${plan_id}", employee_external_id: "E-2001", user_id: "u_ee_2", email: "rho@rankwell.test", full_name: "Rho Patel", employment_status: "ACTIVE" }
              as: benefits_admin
              as_user_id: "u_ba_1"
              captures: { ee_id: $.data.id }
            - call: "POST /backup-care/employees/${ee_id}/dependents"
              payload: { full_name: "Ana Patel", dependent_type: "CHILD", date_of_birth: "2021-05-05", relationship: "DAUGHTER", status: "ACTIVE" }
              as: benefits_admin
              as_user_id: "u_ba_1"
              captures: { dep1_id: $.data.id }
            - call: "POST /backup-care/providers"
              payload: { provider_name: "Alpha Center", owner_user_id: "u_pm_a", care_mode: "CENTER_BASED", market_code: "MKT-BOS", postal_code: "02110", daily_capacity_slots: 10, max_concurrent_assignments: 1, same_day_available: true }
              as: network_admin
              as_user_id: "u_na_1"
              captures: { p1_id: $.data.id }
            - call: "POST /backup-care/providers/${p1_id}/credentials"
              payload: { credential_type: "LICENSE", issued_on: "2026-01-02", expires_on: "2027-06-30", verified_by: "u_na_1" }
              as: network_admin
              as_user_id: "u_na_1"
            - call: "POST /backup-care/providers/${p1_id}/credentials"
              payload: { credential_type: "BACKGROUND_CHECK", issued_on: "2026-01-02", expires_on: "2027-06-30", verified_by: "u_na_1" }
              as: network_admin
              as_user_id: "u_na_1"
            - call: "POST /backup-care/providers/${p1_id}/credentials"
              payload: { credential_type: "CPR", issued_on: "2026-01-02", expires_on: "2027-06-30", verified_by: "u_na_1" }
              as: network_admin
              as_user_id: "u_na_1"
            - call: "POST /backup-care/providers/${p1_id}/credentials"
