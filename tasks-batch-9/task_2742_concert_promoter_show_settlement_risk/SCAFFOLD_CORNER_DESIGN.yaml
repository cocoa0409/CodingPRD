            - call: "POST /shows/${oc_sh_id}/on-sale"
              payload: {}
              as: TalentBuyer
            - call: "GET /shows/${oc_sh_id}"
              payload: {}
              as: TalentBuyer
              captures: { oc_v4: $.data.version }
            - call: "POST /ticket-tiers/${oc_tt_id}/sales"
              payload: { qty: 10 }
              as: TalentBuyer
              captures: { oc_tt_sold: $.data.sold_qty }
            - call: "GET /shows/${oc_sh_id}"
              payload: {}
              as: TalentBuyer
              captures: { oc_v5: $.data.version }
            - call: "POST /ticket-tiers/${oc_tt_id}/price-adjustments"
              payload: { new_price_cents: 6000, expected_show_version: "${oc_v4}", reason: "Stale reader repricing after a sale it never saw" }
              as: TalentBuyer
              captures: { oc_err_3: $.data.error_id }
            - call: "GET /ticket-tiers/${oc_tt_id}"
              payload: {}
              as: TalentBuyer
              captures: { oc_tt_price_a: $.data.price_cents, oc_tt_revs_a: $.data.price_revision_count, oc_tt_last_a: $.data.last_price_cents }
            - call: "POST /ticket-tiers/${oc_tt_id}/price-adjustments"
              payload: { new_price_cents: 6000, expected_show_version: "${oc_v5}", reason: "Demand supports a raise" }
              as: TalentBuyer
              captures: { oc_tt_price_b: $.data.price_cents, oc_tt_revs_b: $.data.price_revision_count, oc_tt_last_b: $.data.last_price_cents }
            # replaying the version that just worked must now fail
            - call: "POST /ticket-tiers/${oc_tt_id}/price-adjustments"
              payload: { new_price_cents: 7000, expected_show_version: "${oc_v5}", reason: "Replay of the request that just succeeded" }
              as: TalentBuyer
              captures: { oc_err_4: $.data.error_id }
            - call: "GET /ticket-tiers/${oc_tt_id}"
              payload: {}
              as: TalentBuyer
              captures: { oc_tt_price_c: $.data.price_cents, oc_tt_revs_c: $.data.price_revision_count }
            - call: "GET /shows/${oc_sh_id}"
              payload: {}
              as: TalentBuyer
              captures: { oc_v6: $.data.version }
          assert:
            - "RULE offer-create-stale-show FIRES — ${oc_err_1} == ERR_STALE_SHOW_VERSION with HTTP 412 for expected_show_version ${oc_v1}, which was the show's REAL version until the exposure override advanced it to ${oc_v2} == ${oc_v1} + 1"
            - "THE REJECTED CREATE WROTE NOTHING — GET /offers?show_id=${oc_sh_id} returns total_count 0 immediately after the 412, and the show is untouched at ${oc_v2_check} == ${oc_v2} with ${oc_status_1} == PLANNED"
            - "THE CURRENT VERSION IS ACCEPTED — the identical body with expected_show_version ${oc_v2} returns 201 with ${oc_of_status} == DRAFT, and after submit and accept ${oc_of_status_acc} == ACCEPTED with ${oc_status_2} == CONFIRMED and ${oc_v3} > ${oc_v2}"
            - "THE GUARDED FIELD IS THE PARENT'S VERSION, ADVANCED BY A SIBLING WRITE — the acceptance of a CHILD offer advanced Show.version from ${oc_v2} to ${oc_v3}, which is exactly why the next create with ${oc_v2} must fail"
            - "412 PREEMPTS 422 — ${oc_err_2} == ERR_STALE_SHOW_VERSION 412 for a request that is BOTH stale (${oc_v2} against current ${oc_v3}) and incoherent (FLAT_GUARANTEE carrying versus_pct, which priority 25 would reject with ERR_DEAL_STRUCTURE_INCOHERENT); priority 16 is lower and therefore wins, and the response is never ERR_DEAL_STRUCTURE_INCOHERENT"
            - "AND THE PREEMPTED CREATE SUPERSEDED NOTHING — GET /offers?show_id=${oc_sh_id} still returns total_count 1 and ${oc_of_status_after} == ACCEPTED; a create that got as far as the supersede side effect before failing would have left the show's only booked deal in SUPERSEDED and the market's exposure detached from reality"
            - "RULE price-adjustment-stale-show FIRES — the sale advanced the show from ${oc_v4} to ${oc_v5} == ${oc_v4} + 1 (${oc_tt_sold} == 10), and repricing with ${oc_v4} returns ${oc_err_3} == ERR_STALE_SHOW_VERSION 412"
            - "THE REJECTED PRICE MOVE LEFT THE FACE PRICE ALONE — ${oc_tt_price_a} == 5000 with ${oc_tt_revs_a} == 0 and ${oc_tt_last_a} == null"
            - "THE CURRENT VERSION REPRICES — with ${oc_v5} the adjustment returns 200 with ${oc_tt_price_b} == 6000, ${oc_tt_revs_b} == 1 and ${oc_tt_last_b} == 5000"
            - "A SUCCESSFUL GUARDED WRITE INVALIDATES ITS OWN TOKEN — replaying ${oc_v5} immediately afterwards returns ${oc_err_4} == ERR_STALE_SHOW_VERSION 412 with ${oc_tt_price_c} == 6000 and ${oc_tt_revs_c} == 1 unchanged, and ${oc_v6} == ${oc_v5} + 1; an implementation that increments Show.version only on show-level writes lets an unbounded stream of stale reprices through"
            - "BOTH DECLARED RULES ARE COVERED — §1.2.1 declares exactly two concurrency_rules (offer-create-stale-show on POST /offers and price-adjustment-stale-show on POST /ticket-tiers/{ticket_tier_id}/price-adjustments), both use occ_field expected_show_version on parent entity Show, and both are exercised here in the rejecting and the accepting direction; §1.4 priority 16 lists exactly those two endpoints, so no other write in the scaffold carries an OCC token"

  # ===========================================================================
  # SECTION 9 — consistency model
  # §1.0 declares consistency_model: immediate. The eventual row is SKIPPED (no
  # denormalized field in §1.1 is allowed to lag: every computed field is
  # declared as recomputed by the triggering request itself) and the saga row is
  # SKIPPED (no multi-request workflow declares compensation on a later
  # failure; the one compensating path in the scaffold, cancellation releasing a
  # guarantee, is a single synchronous request and is covered under
  # state_machines and calculations).
  # ===========================================================================
  - section: consistency model
    instances:
      - name: every_mutation_is_fully_visible_the_moment_its_response_returns
        claim_type: immediate
        grounds:
          - "complexity_profile.consistency_model=immediate"
          - "endpoints[POST /offers/{offer_id}/accept].side_effects"
          - "endpoints[POST /ticket-tiers/{ticket_tier_id}/sales].side_effects"
          - "endpoints[POST /vendor-invoices/{vendor_invoice_id}/approve].side_effects"
        distinguishing_aspect: "Three writes of increasing blast radius are each followed IMMEDIATELY — with no clock movement, no POST /_ops/run and no retry — by reads of every entity the write claims to touch, and the values read back are the final ones. The writes are chosen so that the response body itself can only carry part of the truth: accepting an offer returns an Offer while changing a Show and a Market, a sale returns a TicketTier while changing a Show, and approving an invoice returns a VendorInvoice while changing a BudgetLine, a Show and a Market. Immediate consistency therefore has two halves here, both asserted: the returned row is already final (its own computed fields and its incremented version are in the response, not in a later read), and every OTHER row the cascade names is final on the very next read. The negative form of the claim is what makes it a test at all: there must be no read-after-write staleness anywhere, so an implementation that recomputes derived money in a background pass or only at settlement time fails on the first read."
        test_recipe:
          setup:
            - "Logical clock 2026-08-01T00:00:00Z and it NEVER moves in this instance — anything that appears only after time passes is a bug here, not a delay."
            - "Market Now Market limit 5000000; Venue Now Hall capacity 500, facility fee 0, ticket tax 0; Artist Now Act withholding 0; Show S (event 2026-12-02T02:00Z, RENTAL, rental fee 0) with a SUBMITTED FLAT_GUARANTEE offer of 200000 (deposit 0, expense cap 200000), one GA tier 5000 x 100, and one PRODUCTION budget line budgeted 100000 marked deductible with a VendorInvoice for 130000 already VERIFIED by u_nw_ta1."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00.000Z" }
              as: RiskOfficer
            - call: "POST /markets"
              payload: { name: "Now Market", region_code: "NW", guarantee_exposure_limit_cents: 5000000 }
              as: RiskOfficer
              captures: { nw_mk_id: $.data.id, nw_mk_com_0: $.data.committed_guarantee_cents, nw_mk_risk_0: $.data.at_risk_guarantee_cents }
            - call: "POST /venues"
              payload: { market_id: "${nw_mk_id}", name: "Now Hall", gross_capacity: 500, facility_fee_cents_per_ticket: 0, ticket_tax_pct: 0 }
              as: TalentBuyer
              captures: { nw_vn_id: $.data.id }
            - call: "POST /artists"
              payload: { name: "Now Act", agency: "Now Talent", tier: "THEATER", historical_sellthrough_pct: 64.00, withholding_pct: 0 }
              as: TalentBuyer
              captures: { nw_ar_id: $.data.id }
            - call: "POST /shows"
              payload: { artist_id: "${nw_ar_id}", venue_id: "${nw_vn_id}", event_at: "2026-12-02T02:00:00.000Z", load_in_at: "2026-12-01T14:00:00.000Z", load_out_at: "2026-12-02T08:00:00.000Z", announce_at: "2026-08-01T00:00:00.000Z", venue_arrangement: "RENTAL", rental_fee_cents: 0 }
              as: TalentBuyer
              captures: { nw_sh_id: $.data.id, nw_sh_v1: $.data.version }
            - call: "POST /offers"
              payload: { show_id: "${nw_sh_id}", expected_show_version: "${nw_sh_v1}", deal_structure: "FLAT_GUARANTEE", guarantee_cents: 200000, deposit_cents: 0, expense_cap_cents: 200000 }
              as: TalentBuyer
              captures: { nw_of_id: $.data.id }
            - call: "POST /offers/${nw_of_id}/submit"
              payload: {}
              as: TalentBuyer
            - call: "POST /budget-lines"
              payload: { show_id: "${nw_sh_id}", category: "PRODUCTION", description: "Crew and gear", budgeted_cents: 100000, is_artist_deductible: true }
              as: TourAccountant
              captures: { nw_bl_id: $.data.id }
            - call: "POST /vendor-invoices"
              payload: { show_id: "${nw_sh_id}", budget_line_id: "${nw_bl_id}", vendor_name: "Now Staging", amount_cents: 130000, invoice_date: "2026-08-01", documentation_ref: "NW-INV-1" }
              as: TourAccountant
              captures: { nw_iv_id: $.data.id }
            - call: "POST /vendor-invoices/${nw_iv_id}/verify"
              payload: {}
              as: TourAccountant
              as_user_id: "u_nw_ta1"
          trigger:
            # WRITE 1 — accept: response is an Offer, cascade touches Show and Market
            - call: "POST /offers/${nw_of_id}/accept"
              payload: {}
              as: ArtistRep
              as_user_id: "${nw_ar_id}"
              captures: { nw_of_status: $.data.status, nw_of_accby: $.data.accepted_by_user_id, nw_of_v: $.data.version, nw_of_upd: $.data.updated_at }
            - call: "GET /shows/${nw_sh_id}"
              payload: {}
              as: TalentBuyer
              captures: { nw_sh_status_1: $.data.show_status, nw_sh_com_1: $.data.committed_guarantee_cents, nw_sh_bkv_1: $.data.breakeven_cents, nw_sh_upd_1: $.data.updated_at }
            - call: "GET /markets/${nw_mk_id}"
              payload: {}
              as: RiskOfficer
              captures: { nw_mk_com_1: $.data.committed_guarantee_cents, nw_mk_util_1: $.data.exposure_utilization_pct, nw_mk_post_1: $.data.risk_posture, nw_mk_risk_1: $.data.at_risk_guarantee_cents }
            # WRITE 2 — sale: response is a TicketTier, cascade touches Show
            - call: "POST /ticket-tiers"
              payload: { show_id: "${nw_sh_id}", tier_name: "GA", price_cents: 5000, allocation_qty: 100 }
              as: TalentBuyer
              captures: { nw_tt_id: $.data.id }
            - call: "POST /shows/${nw_sh_id}/on-sale"
              payload: {}
              as: TalentBuyer
            - call: "POST /ticket-tiers/${nw_tt_id}/sales"
              payload: { qty: 10 }
              as: TalentBuyer
              captures: { nw_tt_sold: $.data.sold_qty, nw_tt_gross: $.data.gross_sold_cents, nw_tt_avail: $.data.available_qty, nw_tt_v: $.data.version }
            - call: "GET /shows/${nw_sh_id}"
              payload: {}
              as: TalentBuyer
              captures: { nw_sh_gross_2: $.data.gross_sold_cents, nw_sh_paid_2: $.data.paid_tickets_sold, nw_sh_adj_2: $.data.adjusted_gross_cents, nw_sh_proj_2: $.data.projected_adjusted_gross_cents }
            - call: "GET /markets/${nw_mk_id}"
              payload: {}
              as: RiskOfficer
              captures: { nw_mk_risk_2: $.data.at_risk_guarantee_cents }
            # WRITE 3 — approve: response is a VendorInvoice, cascade touches BudgetLine, Show and Market
            - call: "POST /vendor-invoices/${nw_iv_id}/approve"
              payload: {}
              as: TourAccountant
              as_user_id: "u_nw_ta2"
              captures: { nw_iv_status: $.data.status, nw_iv_appby: $.data.approved_by_user_id, nw_iv_v: $.data.version }
            - call: "GET /budget-lines/${nw_bl_id}"
              payload: {}
              as: TourAccountant
              captures: { nw_bl_actual: $.data.actual_cents, nw_bl_var: $.data.variance_cents, nw_bl_pct: $.data.variance_pct, nw_bl_vstatus: $.data.variance_status, nw_bl_role: $.data.required_approver_role, nw_bl_exp: $.data.settlement_expense_cents }
            - call: "GET /shows/${nw_sh_id}"
              payload: {}
              as: TalentBuyer
              captures: { nw_sh_act_3: $.data.total_actual_expense_cents, nw_sh_bud_3: $.data.total_budgeted_expense_cents, nw_sh_post_3: $.data.budget_posture, nw_sh_bkv_3: $.data.breakeven_cents }
            - call: "GET /markets/${nw_mk_id}"
              payload: {}
              as: RiskOfficer
              captures: { nw_mk_risk_3: $.data.at_risk_guarantee_cents, nw_mk_com_3: $.data.committed_guarantee_cents }
            - call: "GET /shows/${nw_sh_id}/settlement-projection"
              payload: {}
              as: TourAccountant
              captures: { nw_pj_adj: $.data.adjusted_gross_cents, nw_pj_status: $.data.status }
          assert:
            - "THE RETURNED ROW IS ALREADY FINAL — the accept response itself carries ${nw_of_status} == ACCEPTED, ${nw_of_accby} == ${nw_ar_id}, an incremented ${nw_of_v} == 2 and ${nw_of_upd} == 2026-08-01T00:00:00.000Z; no second read is needed to see the effect of the request that just returned"
            - "WRITE 1 CASCADE IS VISIBLE ON THE NEXT READ — ${nw_sh_status_1} == CONFIRMED with ${nw_sh_com_1} == 200000 and ${nw_sh_bkv_1} == 200000 (guarantee plus 0 recognised deductible expense so far), ${nw_sh_upd_1} == 2026-08-01T00:00:00.000Z, and the market moved from ${nw_mk_com_0} == 0 to ${nw_mk_com_1} == 200000 with ${nw_mk_util_1} == 4.00 and ${nw_mk_post_1} == OPEN"
            - "WRITE 2 IS VISIBLE ON BOTH SIDES AT ONCE — the sale response already shows ${nw_tt_sold} == 10, ${nw_tt_gross} == 50000 and ${nw_tt_avail} == 90 with ${nw_tt_v} == 2, and the show read immediately after shows ${nw_sh_gross_2} == 50000, ${nw_sh_paid_2} == 10 and ${nw_sh_adj_2} == 48750 (50000 less the 2.5 percent card fee, tax and facility fee being 0 at this venue)"
            - "THE FORWARD-LOOKING FIELD IS RECOMPUTED IN THE SAME REQUEST TOO — ${nw_sh_proj_2} == 487500, the PROVISIONAL projection of 100 seats less 0 comps and 0 holds at the current 5000 face, adjusted; and ${nw_mk_risk_2} == 151250 == MAX(0, 200000 breakeven - 48750 adjusted gross), so the market's at-risk figure tracked the sale without any settlement being opened"
            - "AT-RISK EXPOSURE STARTED FROM ZERO AND MOVED ONLY BECAUSE OF THESE WRITES — ${nw_mk_risk_0} == 0 and ${nw_mk_risk_1} == 200000 (breakeven 200000 against an adjusted gross of 0 before any ticket sold)"
            - "WRITE 3 IS FINAL AT ALL FOUR LEVELS ON THE NEXT READS — the invoice response shows ${nw_iv_status} == APPROVED with ${nw_iv_appby} == u_nw_ta2 and ${nw_iv_v} == 3 (created, verified, approved); the line reads back ${nw_bl_actual} == 130000, ${nw_bl_var} == 30000, ${nw_bl_pct} == 30.00, ${nw_bl_vstatus} == PENDING_APPROVAL, ${nw_bl_role} == RISK_OFFICER and ${nw_bl_exp} == 100000 (budgeted, because the variance is not yet decided)"
            - "AND THE SHOW AND MARKET ARE FINAL TOO — ${nw_sh_act_3} == 130000, ${nw_sh_bud_3} == 100000, ${nw_sh_post_3} == VARIANCE_PENDING and ${nw_sh_bkv_3} == 300000 (200000 guarantee + MIN(100000 recognised deductible, 200000 expense cap)), so ${nw_mk_risk_3} == 251250 == MAX(0, 300000 - 48750) while ${nw_mk_com_3} == 200000 is unchanged — an approval moves at-risk exposure but never committed exposure"
            - "NO CLOCK MOVEMENT AND NO SWEEP WERE NEEDED — every read above happened at the same logical instant 2026-08-01T00:00:00.000Z as the write it observes; POST /_ops/run was never called, so nothing in this instance can be attributed to housekeeping"
            - "THE DERIVED READ AGREES WITH THE PERSISTED FIELDS IN THE SAME BREATH — GET /shows/{show_id}/settlement-projection returns ${nw_pj_adj} == 48750 == ${nw_sh_adj_2} and ${nw_pj_status} == DRAFT, computed from the very same state the previous reads returned; §1.0 declares consistency_model immediate, so a projection that disagrees with the persisted adjusted gross is a defect rather than a permitted lag"
