# =============================================================================
# §1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# Bearings & Power-Transmission Distribution
# Enumerative coverage of §1.1-§1.7 claims not already probed by §1.8.
# `excluded_because` stubs cite the covering §1.8 instance by name.
# =============================================================================
scaffold_corner_design:

  # ---------------------------------------------------------------------------
  - section: entities
    instances:
      - name: product_create_missing_sku_returns_invalid_request
        claim_type: required_fields
        grounds:
          - "entities.Product.fields.sku"
          - "errors[ERR_INVALID_REQUEST]"
        distinguishing_aspect: "sku is source:input with no default; omitting it fails creation with ERR_INVALID_REQUEST (400)."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /motion/products"
              payload: { description: "No sku", family: "BEARING", list_price_cents: 1000 }
              as: PricingAnalyst
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_INVALID_REQUEST and HTTP 400"

      - name: product_create_defaults_and_system_fields
        claim_type: defaults
        grounds:
          - "entities.Product.fields.status"
          - "entities.Product.fields.last_price_change_at"
        distinguishing_aspect: "Omitted optional fields land on pinned defaults: status ACTIVE, last_price_change_at null, version 1; supersede pointer null."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls:
            - call: "POST /motion/products"
              payload: { sku: "BRG-6000", description: "Ball bearing 6000", family: "BEARING", list_price_cents: 2500 }
              as: PricingAnalyst
              captures: { p_id: $.data.id, p_status: $.data.status, p_lpc: $.data.last_price_change_at, p_v: $.data.version }
          trigger: []
          assert:
            - "p_status == ACTIVE (default applied by system)"
            - "p_lpc == null"
            - "p_v == 1"

      - name: product_create_system_field_input_ignored
        claim_type: system_fields
        grounds:
          - "entities.Product.fields.status"
        distinguishing_aspect: "Client-supplied system field status=OBSOLETE in the create body is ignored; the product is still created ACTIVE."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /motion/products"
              payload: { sku: "BRG-6001", description: "Ball bearing 6001", family: "BEARING", list_price_cents: 2500, status: "OBSOLETE" }
              as: PricingAnalyst
              captures: { p_status: $.data.status }
          assert:
            - "p_status == ACTIVE (client input for system field ignored)"

      - name: product_create_invalid_enum_returns_invalid_request
        claim_type: type_constraints
        grounds:
          - "entities.Product.fields.family"
          - "errors[ERR_INVALID_REQUEST]"
        distinguishing_aspect: "family is a closed enum; WIDGET is not a member and is rejected at the constraint priority."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /motion/products"
              payload: { sku: "XXX-1", description: "Bad family", family: "WIDGET", list_price_cents: 1000 }
              as: PricingAnalyst
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_INVALID_REQUEST and HTTP 400"

      - name: product_get_not_found_returns_404
        claim_type: not_found
        grounds:
          - "errors[ERR_PRODUCT_NOT_FOUND]"
        distinguishing_aspect: "A well-formed but nonexistent UUID on a single-resource GET yields the resource-specific 404."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "GET /motion/products/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: Any
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_PRODUCT_NOT_FOUND and HTTP 404"

      - name: contract_create_body_fk_must_exist
        claim_type: parent_relationships
        grounds:
          - "entities.CustomerContract.fields.customer_id"
          - "errors[ERR_CUSTOMER_NOT_FOUND]"
          - "validations[priority=3]"
        distinguishing_aspect: "Body-supplied FK customer_id is validated for existence (priority 3) before any business rule; a bogus id yields ERR_CUSTOMER_NOT_FOUND (404)."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /motion/contracts"
              payload: { customer_id: "00000000-0000-0000-0000-000000000000", family: "BEARING", price_basis: "LIST_LESS", discount_pct: 0.1, effective_from: "2026-01-01T00:00:00Z", effective_to: "2027-01-01T00:00:00Z" }
              as: ContractAdministrator
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_CUSTOMER_NOT_FOUND and HTTP 404"

      - name: products_list_pagination_envelope
        claim_type: listing
        grounds:
          - "response_envelope"
        distinguishing_aspect: "List endpoint honors limit/offset and reports total_count/has_more: 3 products, limit 1 offset 1 -> exactly 1 row, total_count 3, has_more true."
        test_recipe:
          setup: ["Three products exist"]
          setup_api_calls:
            - call: "POST /motion/products"
              payload: { sku: "PG-1", description: "p1", family: "SEAL", list_price_cents: 100 }
              as: PricingAnalyst
            - call: "POST /motion/products"
              payload: { sku: "PG-2", description: "p2", family: "SEAL", list_price_cents: 100 }
              as: PricingAnalyst
            - call: "POST /motion/products"
              payload: { sku: "PG-3", description: "p3", family: "SEAL", list_price_cents: 100 }
              as: PricingAnalyst
          trigger:
            - call: "GET /motion/products"
              payload: { limit: 1, offset: 1 }
              as: Any
              captures: { n: "$.data.length()", dummy: "$.data[0].id" }
          assert:
            - "Response is an array of length 1"
            - "meta/envelope contains total_count == 3 and has_more == true per response_envelope.pagination_fields"

      - name: interchange_lookup_sizing_envelope_boundaries
        claim_type: computed_fields
        grounds:
          - "entities.InterchangeRecord.fields.requires_engineering_review"
          - "entities.InterchangeRecord.fields.min_shaft_diameter_mm"
        distinguishing_aspect: "Sizing lookup treats the [min,max] shaft envelope as inclusive on both ends (45 and 55 match; 56 does not), and requires_engineering_review is derived from interchange_class (FUNCTIONAL -> true, EXACT -> false)."
        test_recipe:
          setup:
            - "Product exists; interchange record IR1 (EXACT, 45..55) and IR2 (FUNCTIONAL, 45..55)"
          setup_api_calls:
            - call: "POST /motion/products"
              payload: { sku: "BRG-6010", description: "Ball bearing 6010", family: "BEARING", list_price_cents: 2500 }
              as: PricingAnalyst
              captures: { p_id: $.data.id }
            - call: "POST /motion/interchange-records"
              payload: { competitor_part_number: "CMP-10", product_id: "${p_id}", interchange_class: "EXACT", min_shaft_diameter_mm: 45, max_shaft_diameter_mm: 55 }
              as: PricingAnalyst
              captures: { ir1_id: $.data.id, ir1_eng: $.data.requires_engineering_review }
            - call: "POST /motion/interchange-records"
              payload: { competitor_part_number: "CMP-20", product_id: "${p_id}", interchange_class: "FUNCTIONAL", min_shaft_diameter_mm: 45, max_shaft_diameter_mm: 55 }
              as: PricingAnalyst
              captures: { ir2_id: $.data.id, ir2_eng: $.data.requires_engineering_review }
          trigger:
            - call: "GET /motion/interchange-records"
              payload: { shaft_diameter_mm: 45 }
              as: Any
              captures: { hit_min: "$.data.length()" }
            - call: "GET /motion/interchange-records"
              payload: { shaft_diameter_mm: 56 }
              as: Any
              captures: { miss_out: "$.data.length()" }
          assert:
            - "ir1_eng == false and ir2_eng == true (computed from class)"
            - "hit_min == 2 (inclusive lower bound)"
            - "miss_out == 0 (56 > max 55 excluded)"

      - name: branch_create_invalid_hours_returns_invalid_request
        claim_type: type_constraints
        grounds:
          - "entities.Branch.fields.business_close_hour"
          - "errors[ERR_INVALID_REQUEST]"
        distinguishing_aspect: "business_close_hour <= business_open_hour violates the branch hour domain and is rejected."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /motion/branches"
              payload: { code: "BAD-1", timezone_offset_hours: 0, business_open_hour: 17, business_close_hour: 8, expedite_cutoff_hour: 14, after_hours_fee_cents: 20000 }
              as: SystemAdmin
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_INVALID_REQUEST and HTTP 400"

  # ---------------------------------------------------------------------------
  - section: state_machines
    instances:
      - name: order_created_with_parallel_initial_states
        claim_type: initial_state
        grounds:
          - "state_machines.SalesOrder"
        distinguishing_aspect: "New order starts DRAFT x UNBILLED with zeroed computed totals and null priced_at."
        test_recipe:
          setup: ["customer and branch exist"]
          setup_api_calls:
            - call: "POST /motion/branches"
              payload: { code: "INI-01", timezone_offset_hours: 0, business_open_hour: 8, business_close_hour: 17, expedite_cutoff_hour: 14, after_hours_fee_cents: 20000 }
              as: SystemAdmin
              captures: { b_id: $.data.id }
            - call: "POST /motion/customers"
              payload: { name: "Init Plant", credit_limit_cents: 1000000 }
              as: ContractAdministrator
              captures: { c_id: $.data.id }
          trigger:
            - call: "POST /motion/orders"
              payload: { customer_id: "${c_id}", branch_id: "${b_id}" }
              as: CounterSalesRep
              captures: { o_fs: $.data.fulfillment_status, o_bs: $.data.billing_status, o_tot: $.data.total_cents, o_pa: $.data.priced_at, o_pv: $.data.price_variant }
          assert:
            - "o_fs == DRAFT and o_bs == UNBILLED"
            - "o_tot == 0 and o_pa == null"
            - "o_pv == ORDER_DATE (default)"

      - name: ship_line_from_pending_sourcing_rejected
        claim_type: invalid_transition
        grounds:
          - "state_machines.OrderLine.ALLOCATED_to_SHIPPED"
          - "errors[ERR_LINE_NOT_SHIPPABLE]"
        distinguishing_aspect: "Ship is legal only from ALLOCATED; a PENDING_SOURCING line rejects with ERR_LINE_NOT_SHIPPABLE and fires no side effects."
        test_recipe:
          setup: ["confirmed order with one PENDING_SOURCING line"]
          setup_api_calls:
            - call: "POST /motion/products"
              payload: { sku: "BRG-6011", description: "b", family: "BEARING", list_price_cents: 1000 }
              as: PricingAnalyst
              captures: { p_id: $.data.id }
            - call: "POST /motion/branches"
              payload: { code: "INV-02", timezone_offset_hours: 0, business_open_hour: 8, business_close_hour: 17, expedite_cutoff_hour: 14, after_hours_fee_cents: 20000 }
              as: SystemAdmin
              captures: { b_id: $.data.id }
            - call: "POST /motion/customers"
              payload: { name: "Inv Plant", credit_limit_cents: 1000000 }
              as: ContractAdministrator
              captures: { c_id: $.data.id }
            - call: "POST /motion/orders"
              payload: { customer_id: "${c_id}", branch_id: "${b_id}" }
              as: CounterSalesRep
              captures: { o_id: $.data.id }
            - call: "POST /motion/orders/${o_id}/lines"
              payload: { product_id: "${p_id}", qty: 1 }
              as: CounterSalesRep
              captures: { l_id: $.data.id }
            - call: "POST /motion/orders/${o_id}/confirm"
              payload: {}
              as: CounterSalesRep
          trigger:
            - call: "POST /motion/order-lines/${l_id}/ship"
              payload: {}
              as: BranchManager
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_LINE_NOT_SHIPPABLE (409)"
            - "OrderLine.${l_id}.sourcing_status remains PENDING_SOURCING; SalesOrder.${o_id}.fulfillment_status remains CONFIRMED"

      - name: cancelled_order_is_terminal
        claim_type: terminal_state_lockdown
        grounds:
          - "state_machines.SalesOrder"
          - "errors[ERR_ORDER_NOT_CANCELLABLE]"
        distinguishing_aspect: "From CANCELLED no further transition is legal — a second cancel is rejected and nothing mutates."
        test_recipe:
          setup: ["order cancelled from DRAFT"]
          setup_api_calls:
            - call: "POST /motion/products"
              payload: { sku: "BRG-6012", description: "b", family: "BEARING", list_price_cents: 1000 }
              as: PricingAnalyst
              captures: { p_id: $.data.id }
            - call: "POST /motion/branches"
              payload: { code: "TRM-03", timezone_offset_hours: 0, business_open_hour: 8, business_close_hour: 17, expedite_cutoff_hour: 14, after_hours_fee_cents: 20000 }
              as: SystemAdmin
              captures: { b_id: $.data.id }
            - call: "POST /motion/customers"
              payload: { name: "Term Plant", credit_limit_cents: 1000000 }
              as: ContractAdministrator
              captures: { c_id: $.data.id }
            - call: "POST /motion/orders"
              payload: { customer_id: "${c_id}", branch_id: "${b_id}" }
              as: CounterSalesRep
              captures: { o_id: $.data.id }
            - call: "POST /motion/orders/${o_id}/lines"
              payload: { product_id: "${p_id}", qty: 1 }
              as: CounterSalesRep
            - call: "POST /motion/orders/${o_id}/cancel"
              payload: {}
              as: CounterSalesRep
          trigger:
            - call: "POST /motion/orders/${o_id}/cancel"
              payload: {}
              as: CounterSalesRep
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_ORDER_NOT_CANCELLABLE (409)"
            - "SalesOrder.${o_id}.fulfillment_status remains CANCELLED"

      - name: price_file_auto_effectivity_and_supersede_chain
        claim_type: valid_transition
        grounds:
          - "state_machines.PriceFileVersion"
          - "entities.Product.fields.list_price_cents"
        distinguishing_aspect: "Publishing PF2 while PF1 is PENDING supersedes PF1 without touching the price; only when the clock reaches PF2.effective_at does the product price jump (10000 -> 12000) with last_price_change_at stamped."
        test_recipe:
          setup: ["product list 10000; PF1 (11000, effective 2026-08-10) PENDING then superseded by PF2 (12000, effective 2026-08-20)"]
          setup_api_calls:
            - call: "POST /motion/products"
              payload: { sku: "BRG-6013", description: "b", family: "BEARING", list_price_cents: 10000 }
              as: PricingAnalyst
              captures: { p_id: $.data.id, p_v: $.data.version }
            - call: "POST /motion/price-files"
              payload: { product_id: "${p_id}", new_list_price_cents: 11000, effective_at: "2026-08-10T00:00:00Z", expected_product_version: "${p_v}" }
              as: PricingAnalyst
              captures: { pf1_id: $.data.id }
            - call: "GET /motion/products/${p_id}"
              payload: {}
              as: Any
              captures: { p_v2: $.data.version }
            - call: "POST /motion/price-files"
              payload: { product_id: "${p_id}", new_list_price_cents: 12000, effective_at: "2026-08-20T00:00:00Z", expected_product_version: "${p_v2}" }
              as: PricingAnalyst
              captures: { pf2_id: $.data.id }
          trigger:
            - call: "POST /motion/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-20T00:00:00Z" }
              as: SystemAdmin
          assert:
            - "PriceFileVersion.${pf1_id}.status == SUPERSEDED (never became EFFECTIVE; superseded at PF2 publish)"
            - "PriceFileVersion.${pf2_id}.status == EFFECTIVE"
            - "Product.${p_id}.list_price_cents == 12000 and last_price_change_at == 2026-08-20T00:00:00Z"

      - name: contract_auto_expires_at_window_end
        claim_type: valid_transition
        grounds:
          - "state_machines.CustomerContract.ACTIVE_to_EXPIRED"
        distinguishing_aspect: "Clock beyond effective_to flips ACTIVE -> EXPIRED automatically; the half-open window means the contract is still ACTIVE exactly at effective_to minus one second and EXPIRED at effective_to."
        test_recipe:
          setup: ["ACTIVE contract window [2026-01-01, 2026-06-01)"]
          setup_api_calls:
            - call: "POST /motion/customers"
              payload: { name: "Expiry Plant", credit_limit_cents: 1000000 }
              as: ContractAdministrator
              captures: { c_id: $.data.id }
            - call: "POST /motion/contracts"
              payload: { customer_id: "${c_id}", family: "GEARBOX", price_basis: "LIST_LESS", discount_pct: 0.05, effective_from: "2026-01-01T00:00:00Z", effective_to: "2026-06-01T00:00:00Z" }
              as: ContractAdministrator
              captures: { ct_id: $.data.id }
            - call: "POST /motion/contracts/${ct_id}/activate"
              payload: {}
              as: ContractAdministrator
          trigger:
            - call: "POST /motion/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: SystemAdmin
            - call: "GET /motion/contracts/${ct_id}"
              payload: {}
              as: Any
              captures: { st: $.data.status }
          assert:
            - "st == EXPIRED (window end exclusive: at exactly effective_to the contract no longer applies)"

      - name: reservation_release_reverts_line_and_frees_stock
        claim_type: side_effect_execution
        grounds:
          - "state_machines.StockReservation.ACTIVE_to_RELEASED"
          - "state_machines.OrderLine.STOCK_RESERVED_to_PENDING_SOURCING"
          - "calculations.available_stock"
        distinguishing_aspect: "Manual release fires the full compensation chain: reservation RELEASED, line back to PENDING_SOURCING, reserved_qty 4 -> 0 and available_qty 0 -> 4 (only ACTIVE reservations count)."
        test_recipe:
          setup: ["stock on_hand 4; confirmed order line qty 4 reserved (available 0)"]
          setup_api_calls:
            - call: "POST /motion/products"
              payload: { sku: "BRG-6014", description: "b", family: "BEARING", list_price_cents: 1000 }
              as: PricingAnalyst
              captures: { p_id: $.data.id }
            - call: "POST /motion/branches"
              payload: { code: "REL-04", timezone_offset_hours: 0, business_open_hour: 8, business_close_hour: 17, expedite_cutoff_hour: 14, after_hours_fee_cents: 20000 }
              as: SystemAdmin
              captures: { b_id: $.data.id }
            - call: "POST /motion/customers"
              payload: { name: "Release Plant", credit_limit_cents: 1000000 }
              as: ContractAdministrator
              captures: { c_id: $.data.id }
            - call: "POST /motion/branch-stocks"
              payload: { branch_id: "${b_id}", product_id: "${p_id}", on_hand_qty: 4, factory_lead_time_days: 5 }
              as: BranchManager
              captures: { bs_id: $.data.id }
            - call: "POST /motion/orders"
              payload: { customer_id: "${c_id}", branch_id: "${b_id}" }
              as: CounterSalesRep
              captures: { o_id: $.data.id }
            - call: "POST /motion/orders/${o_id}/lines"
              payload: { product_id: "${p_id}", qty: 4 }
              as: CounterSalesRep
              captures: { l_id: $.data.id }
            - call: "POST /motion/orders/${o_id}/confirm"
              payload: {}
              as: CounterSalesRep
            - call: "POST /motion/order-lines/${l_id}/reserve"
              payload: { branch_stock_id: "${bs_id}", qty: 4 }
              as: CounterSalesRep
              captures: { r_id: $.data.id }
          trigger:
            - call: "POST /motion/stock-reservations/${r_id}/release"
              payload: {}
              as: BranchManager
          assert:
            - "StockReservation.${r_id}.status == RELEASED"
            - "OrderLine.${l_id}.sourcing_status == PENDING_SOURCING"
            - "BranchStock.${bs_id}.reserved_qty == 0 and available_qty == 4"
            - "SalesOrder.${o_id}.fulfillment_status == CONFIRMED (FULLY_SOURCED bubble collapsed)"

      - name: consignment_suspend_blocks_then_resume_allows_consumption
        claim_type: precondition_enforcement
        grounds:
          - "state_machines.ConsignmentAgreement.ACTIVE_to_SUSPENDED"
          - "errors[ERR_AGREEMENT_NOT_ACTIVE]"
        distinguishing_aspect: "The consumption endpoint is guarded by agreement state: SUSPENDED rejects with ERR_AGREEMENT_NOT_ACTIVE; after resume the identical report succeeds (cyclic ACTIVE <-> SUSPENDED)."
        test_recipe:
          setup: ["agreement ACTIVE consigned 10 (stock on_hand 10)"]
          setup_api_calls:
            - call: "POST /motion/products"
              payload: { sku: "BRG-6015", description: "b", family: "BEARING", list_price_cents: 1000 }
              as: PricingAnalyst
              captures: { p_id: $.data.id }
            - call: "POST /motion/branches"
              payload: { code: "SUS-05", timezone_offset_hours: 0, business_open_hour: 8, business_close_hour: 17, expedite_cutoff_hour: 14, after_hours_fee_cents: 20000 }
              as: SystemAdmin
              captures: { b_id: $.data.id }
            - call: "POST /motion/customers"
              payload: { name: "Suspend Plant", credit_limit_cents: 1000000 }
              as: ContractAdministrator
              captures: { c_id: $.data.id }
            - call: "POST /motion/branch-stocks"
              payload: { branch_id: "${b_id}", product_id: "${p_id}", on_hand_qty: 10, factory_lead_time_days: 5 }
              as: BranchManager
            - call: "POST /motion/consignment-agreements"
              payload: { customer_id: "${c_id}", branch_id: "${b_id}", product_id: "${p_id}", consigned_qty: 10 }
              as: ContractAdministrator
              captures: { a_id: $.data.id }
            - call: "POST /motion/consignment-agreements/${a_id}/suspend"
              payload: {}
              as: ContractAdministrator
          trigger:
            - call: "POST /motion/consignment-agreements/${a_id}/consumptions"
              payload: { qty: 1 }
              as: CustomerPlant
              as_user_id: "${c_id}"
              captures: { err: $.data.error_id }
            - call: "POST /motion/consignment-agreements/${a_id}/resume"
              payload: {}
              as: ContractAdministrator
            - call: "POST /motion/consignment-agreements/${a_id}/consumptions"
              payload: { qty: 1 }
              as: CustomerPlant
              as_user_id: "${c_id}"
              captures: { cons_id: $.data.id }
          assert:
            - "Suspended attempt: err == ERR_AGREEMENT_NOT_ACTIVE (409)"
            - "After resume: consumption created, ConsignmentAgreement.${a_id}.remaining_qty == 9"

      - name: agreement_close_blocked_by_unbilled_consumption
        claim_type: precondition_enforcement
        grounds:
          - "state_machines.ConsignmentAgreement.ACTIVE_to_CLOSED"
          - "errors[ERR_AGREEMENT_CLOSE_BLOCKED]"
        distinguishing_aspect: "Close is guarded by child state: a REPORTED (unbilled) consumption blocks closing; invoicing the child first unblocks the parent."
        test_recipe:
          setup: ["agreement with one REPORTED consumption qty 2"]
          setup_api_calls:
            - call: "POST /motion/products"
              payload: { sku: "BRG-6016", description: "b", family: "BEARING", list_price_cents: 1000 }
              as: PricingAnalyst
              captures: { p_id: $.data.id }
            - call: "POST /motion/branches"
              payload: { code: "BLK-06", timezone_offset_hours: 0, business_open_hour: 8, business_close_hour: 17, expedite_cutoff_hour: 14, after_hours_fee_cents: 20000 }
              as: SystemAdmin
              captures: { b_id: $.data.id }
            - call: "POST /motion/customers"
              payload: { name: "Block Plant", credit_limit_cents: 1000000 }
              as: ContractAdministrator
              captures: { c_id: $.data.id }
            - call: "POST /motion/branch-stocks"
              payload: { branch_id: "${b_id}", product_id: "${p_id}", on_hand_qty: 10, factory_lead_time_days: 5 }
              as: BranchManager
            - call: "POST /motion/consignment-agreements"
              payload: { customer_id: "${c_id}", branch_id: "${b_id}", product_id: "${p_id}", consigned_qty: 5 }
              as: ContractAdministrator
              captures: { a_id: $.data.id }
            - call: "POST /motion/consignment-agreements/${a_id}/consumptions"
              payload: { qty: 2 }
