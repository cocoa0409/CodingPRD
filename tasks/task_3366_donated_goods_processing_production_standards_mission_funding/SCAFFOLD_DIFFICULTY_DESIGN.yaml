              as_user_id: "${site_id}"
              captures: { don_id: $.data.id }
            - call: "POST /donated-goods/donations/${don_id}/sort"
              payload: { items: [{ category: "TEXTILES", condition_grade: "A", estimated_value_cents: 100, weight_lbs: 5 }, { category: "TEXTILES", condition_grade: "A", estimated_value_cents: 100, weight_lbs: 5 }] }
              as: DonationAttendant
              as_user_id: "${site_id}"
            - call: "GET /donated-goods/donated-items"
              payload: { donation_id: "${don_id}" }
              as: StoreAssociate
              captures: { g1: $.data.0.id, g2: $.data.1.id }
            - call: "POST /donated-goods/donated-items/${g1}/price"
              payload: {}
              as: StoreAssociate
            - call: "POST /donated-goods/donated-items/${g1}/sell"
              payload: {}
              as: StoreAssociate
            - call: "POST /donated-goods/donated-items/${g2}/price"
              payload: {}
