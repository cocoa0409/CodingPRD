        claim_type: Error Triggerable
        grounds:
          - errors.ERR_UNAUTHENTICATED
          - response_envelope
        distinguishing_aspect: "Authentication is checked before existence and before role: a read with no X-User-Role / X-User-ID headers returns 401 ERR_UNAUTHENTICATED even for a program year that exists and is readable by almost every role."
        test_recipe:
          setup:
            - "ProgramYear 2026-27 exists and is WINDOW_OPEN."
          setup_api_calls:
            - call: "POST /esa/program-years"
              payload: { label: "2026-27", residency_state: "TX", total_seats: 2, window_open_at: "2026-08-15T00:00:00Z", window_close_at: "2026-09-30T23:59:59Z", term_start_date: "2026-08-01", term_end_date: "2027-06-30", base_award_cents: 731500, rollover_cap_pct: 0.25, admin_fee_pct: 0.0175, acceptance_deadline_days: 14, min_assessment_percentile: 40, min_portfolio_artifacts: 6 }
              as: ProgramAdmin
              captures: { py_id: $.data.id }
            - call: "POST /esa/program-years/${py_id}/open-window"
              payload: {}
              as: ProgramAdmin
          trigger:
            - call: "GET /esa/program-years/${py_id}"
              as: Anonymous
              captures: { err_id: $.data.error_id, err_msg: $.data.message }
          assert:
            - "the trigger returns HTTP 401 with ${err_id} == ERR_UNAUTHENTICATED"
            - "${err_msg} is a non-empty human-readable string and the envelope carries success false with data null"
            - "no state changed: ProgramYear.${py_id}.status == WINDOW_OPEN"

