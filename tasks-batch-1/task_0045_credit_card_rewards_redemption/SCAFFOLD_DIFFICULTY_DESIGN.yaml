scaffold_difficulty_design:
  # =====================================================================
  # Rule 1 — Dual-variant calculations across different entity domains
  # =====================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: provisional_pending_vs_posted_balance_on_transaction
        grounds:
          - calculations.points_earning
          - entities.CardAccount.fields.pending_points
          - entities.CardAccount.fields.points_balance
          - state_machines.Transaction.PENDING_to_POSTED
        distinguishing_aspect: |
          Same points_earning formula, two variants on the Transaction/CardAccount domain: at create the points
          land in account.pending_points (not redeemable, no lot), and at POST the identical value moves to
          account.points_balance with a PointsLot minted — distinct ledgers, distinct redeemability.
        test_recipe:
          setup:
            - "An ACTIVE product (base 100bps, no fixed/quarterly categories matching OTHER) and an ACTIVE account at tier 0."
            - "Clock at 2026-07-01T00:00:00Z; account opened then."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /products"
              payload: { name: "Cash Visa", base_earn_rate_bps: 100, signup_bonus_points: 10000, signup_bonus_spend_threshold_cents: 100000, signup_bonus_window_days: 90, tier_thresholds: [{ min_annual_spend_cents: 100000, tier_multiplier_bps: 150 }], points_expiry_months: 24 }
              as: ProgramAdmin
              captures: { prod_id: $.data.id }
            - call: "POST /accounts"
              payload: { card_product_id: "${prod_id}", cardholder_name: "Ada" }
              as: ProgramAdmin
              captures: { acct_id: $.data.id }
            - call: "POST /accounts/${acct_id}/activate"
              payload: {}
              as: ProgramAdmin
            - call: "POST /transactions"
              payload: { card_account_id: "${acct_id}", amount_cents: 50000, category_code: "OTHER", transacted_at: "2026-07-02T00:00:00Z" }
              as: ProgramAdmin
              captures: { txn_id: $.data.id }
          trigger:
            - call: "GET /accounts/${acct_id}"
              payload: {}
              as: ProgramAdmin
              captures: { pending_after_create: $.data.pending_points, balance_after_create: $.data.points_balance }
            - call: "POST /transactions/${txn_id}/post"
              payload: {}
              as: ProgramAdmin
            - call: "GET /accounts/${acct_id}"
              payload: {}
              as: ProgramAdmin
          assert:
            - "After create: CardAccount.${acct_id}.pending_points == 500 and CardAccount.${acct_id}.points_balance == 0"
            - "After POST: CardAccount.${acct_id}.pending_points == 0 and CardAccount.${acct_id}.points_balance == 500"
            - "Transaction.${txn_id}.earned_points == 500"

      - name: statement_credit_cents_vs_points_transfer_units_on_redemption
        grounds:
          - calculations.redemption_value
          - entities.Redemption.fields.redeemed_value
          - entities.TransferPartner.fields.transfer_ratio_num
          - state_machines.Redemption.PENDING_to_CONFIRMED
        distinguishing_aspect: |
          Same points_requested = 2500, two variants on the Redemption domain produce DIFFERENT redeemed_value:
          STATEMENT_CREDIT -> 2500 cents (1c/pt), POINTS_TRANSFER @5:4 -> floor(2500*5/4)=3125 partner units.
        test_recipe:
          setup:
            - "ACTIVE account with points_balance >= 5000 (two POSTED OTHER txns each earning 2500)."
            - "An ACTIVE AIRLINE partner with ratio 5:4 and min_transfer_points 1000."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /products"
              payload: { name: "Cash Visa", base_earn_rate_bps: 100, signup_bonus_points: 0, signup_bonus_spend_threshold_cents: 100000, signup_bonus_window_days: 90, tier_thresholds: [], points_expiry_months: 24 }
              as: ProgramAdmin
              captures: { prod_id: $.data.id }
            - call: "POST /transfer-partners"
              payload: { name: "SkyMiles", partner_type: "AIRLINE", transfer_ratio_num: 5, transfer_ratio_den: 4, min_transfer_points: 1000 }
              as: ProgramAdmin
              captures: { partner_id: $.data.id }
            - call: "POST /accounts"
              payload: { card_product_id: "${prod_id}", cardholder_name: "Ada" }
              as: ProgramAdmin
              captures: { acct_id: $.data.id }
            - call: "POST /accounts/${acct_id}/activate"
              payload: {}
              as: ProgramAdmin
            - call: "POST /transactions"
              payload: { card_account_id: "${acct_id}", amount_cents: 250000, category_code: "OTHER", transacted_at: "2026-07-02T00:00:00Z" }
              as: ProgramAdmin
              captures: { txn1_id: $.data.id }
            - call: "POST /transactions/${txn1_id}/post"
              payload: {}
              as: ProgramAdmin
            - call: "POST /transactions"
              payload: { card_account_id: "${acct_id}", amount_cents: 250000, category_code: "OTHER", transacted_at: "2026-07-03T00:00:00Z" }
              as: ProgramAdmin
              captures: { txn2_id: $.data.id }
            - call: "POST /transactions/${txn2_id}/post"
              payload: {}
              as: ProgramAdmin
            - call: "GET /accounts/${acct_id}"
              payload: {}
              as: ProgramAdmin
              captures: { v_pre_sc: $.data.version }
          trigger:
            - call: "POST /redemptions"
              payload: { card_account_id: "${acct_id}", redemption_type: "STATEMENT_CREDIT", points_requested: 2500, expected_card_account_version: "${v_pre_sc}" }
              as: Cardholder
              as_user_id: "${acct_id}"
              captures: { red_sc_id: $.data.id }
            - call: "POST /redemptions/${red_sc_id}/confirm"
              payload: {}
              as: RewardsOps
              captures: { sc_value: $.data.redeemed_value }
            - call: "GET /accounts/${acct_id}"
              payload: {}
              as: ProgramAdmin
              captures: { v_pre_pt: $.data.version }
            - call: "POST /redemptions"
              payload: { card_account_id: "${acct_id}", redemption_type: "POINTS_TRANSFER", points_requested: 2500, transfer_partner_id: "${partner_id}", expected_card_account_version: "${v_pre_pt}" }
              as: Cardholder
              as_user_id: "${acct_id}"
              captures: { red_pt_id: $.data.id }
            - call: "POST /redemptions/${red_pt_id}/confirm"
              payload: {}
              as: RewardsOps
          assert:
            - "Redemption.${red_sc_id}.redeemed_value == 2500"
            - "Redemption.${red_pt_id}.redeemed_value == 3125"
            - "Redemption.${red_sc_id}.redeemed_value != Redemption.${red_pt_id}.redeemed_value for the same points_requested == 2500"

  # =====================================================================
  # Rule 2 — Combinatorial formulas across different modes
  # =====================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: three_input_blend_category_quarterly_cap_tier_mode_a
        grounds:
          - calculations.points_earning
          - entities.QuarterlyCategory.fields.bonus_cap_cents
          - entities.CardProduct.fields.tier_thresholds
          - state_machines.Transaction.PENDING_to_POSTED
        distinguishing_aspect: |
          Mode (a): a single POST blends THREE non-linearly-interacting inputs — base/category rate on the
          uncapped remainder, quarterly multiplier on the cap-limited slice, and a whole-transaction tier
          multiplier — yielding earned_points == 3900 (NOT a single tiered-rate lookup).
        test_recipe:
          setup:
            - "Product base 100bps, tier1 mult 150bps at >=100000 annual spend, quarterly GROCERY 500bps cap 50000 in 2026-Q3."
            - "Account already at tier 1 (>=100000 prior annual spend), quarterly GROCERY activated, zero quarterly cap used."
            - "Clock at 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /products"
              payload: { name: "Tier Visa", base_earn_rate_bps: 100, signup_bonus_points: 0, signup_bonus_spend_threshold_cents: 100000, signup_bonus_window_days: 365, tier_thresholds: [{ min_annual_spend_cents: 100000, tier_multiplier_bps: 150 }], points_expiry_months: 24 }
              as: ProgramAdmin
              captures: { prod_id: $.data.id }
            - call: "POST /quarterly-categories"
              payload: { card_product_id: "${prod_id}", code: "GROCERY", quarter_label: "2026-Q3", window_start: "2026-07-01T00:00:00Z", window_end: "2026-10-01T00:00:00Z", earn_multiplier_bps: 500, bonus_cap_cents: 50000 }
              as: ProgramAdmin
              captures: { qcat_id: $.data.id }
            - call: "POST /accounts"
              payload: { card_product_id: "${prod_id}", cardholder_name: "Ada" }
              as: ProgramAdmin
              captures: { acct_id: $.data.id }
            - call: "POST /accounts/${acct_id}/activate"
              payload: {}
              as: ProgramAdmin
            - call: "POST /category-activations"
              payload: { card_account_id: "${acct_id}", quarterly_category_id: "${qcat_id}" }
              as: Cardholder
              as_user_id: "${acct_id}"
            - call: "POST /transactions"
              payload: { card_account_id: "${acct_id}", amount_cents: 100000, category_code: "OTHER", transacted_at: "2026-07-05T00:00:00Z" }
              as: ProgramAdmin
              captures: { warmup_id: $.data.id }
            - call: "POST /transactions/${warmup_id}/post"
              payload: {}
              as: ProgramAdmin
          trigger:
            - call: "POST /transactions"
              payload: { card_account_id: "${acct_id}", amount_cents: 60000, category_code: "GROCERY", transacted_at: "2026-08-01T00:00:00Z" }
              as: ProgramAdmin
              captures: { gtxn_id: $.data.id }
            - call: "POST /transactions/${gtxn_id}/post"
              payload: {}
              as: ProgramAdmin
          assert:
            - "Transaction.${gtxn_id}.quarterly_bonus_applied_cents == 50000"
            - "Transaction.${gtxn_id}.earned_points == 3900"

      - name: rounding_order_floor_once_not_per_step_mode_b
        grounds:
          - calculations.points_earning
          - entities.CashbackCategory.fields.earn_multiplier_bps
          - state_machines.Transaction.PENDING_to_POSTED
        distinguishing_aspect: |
          Mode (b): rounding-order pin. Two separate 333-cent DINING (300bps) POSTs each floor independently to
          9 points (total 18). A wrong sum-then-floor of 666 cents would yield 19. The scaffold pins floor-once
          per transaction at the end of the formula.
        test_recipe:
          setup:
            - "Product base 100bps, fixed DINING category 300bps, tier 0, no quarterly."
            - "ACTIVE account, clock at 2026-07-02T00:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /products"
              payload: { name: "Dine Visa", base_earn_rate_bps: 100, signup_bonus_points: 0, signup_bonus_spend_threshold_cents: 100000, signup_bonus_window_days: 90, tier_thresholds: [], points_expiry_months: 24 }
              as: ProgramAdmin
              captures: { prod_id: $.data.id }
            - call: "POST /cashback-categories"
              payload: { card_product_id: "${prod_id}", code: "DINING", earn_multiplier_bps: 300 }
              as: ProgramAdmin
            - call: "POST /accounts"
              payload: { card_product_id: "${prod_id}", cardholder_name: "Ada" }
              as: ProgramAdmin
              captures: { acct_id: $.data.id }
            - call: "POST /accounts/${acct_id}/activate"
              payload: {}
              as: ProgramAdmin
            - call: "POST /transactions"
              payload: { card_account_id: "${acct_id}", amount_cents: 333, category_code: "DINING", transacted_at: "2026-07-02T00:00:00Z" }
              as: ProgramAdmin
              captures: { d1_id: $.data.id }
            - call: "POST /transactions"
              payload: { card_account_id: "${acct_id}", amount_cents: 333, category_code: "DINING", transacted_at: "2026-07-02T01:00:00Z" }
              as: ProgramAdmin
              captures: { d2_id: $.data.id }
          trigger:
            - call: "POST /transactions/${d1_id}/post"
              payload: {}
              as: ProgramAdmin
            - call: "POST /transactions/${d2_id}/post"
              payload: {}
              as: ProgramAdmin
            - call: "GET /accounts/${acct_id}"
              payload: {}
              as: ProgramAdmin
          assert:
            - "Transaction.${d1_id}.earned_points == 9 and Transaction.${d2_id}.earned_points == 9"
            - "CardAccount.${acct_id}.points_balance == 18"

  # =====================================================================
  # Rule 3 — Non-linear state-machine shape on different entities
  # =====================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: transaction_branch_posted_vs_declined_plus_refund_revert
        grounds:
          - state_machines.Transaction.PENDING_to_POSTED
          - state_machines.Transaction.PENDING_to_DECLINED
          - state_machines.Transaction.POSTED_to_REFUNDED
        distinguishing_aspect: |
          Transaction is non-linear: PENDING forks to {POSTED, DECLINED} with divergent side-effects (mint lot +
          counters vs release pending only), and POSTED reverts via REFUNDED (clawback). Branch + revert on Transaction.
        test_recipe:
          setup:
            - "ACTIVE account; one PENDING txn to decline, one PENDING txn to post then refund."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /products"
              payload: { name: "Cash Visa", base_earn_rate_bps: 100, signup_bonus_points: 0, signup_bonus_spend_threshold_cents: 100000, signup_bonus_window_days: 90, tier_thresholds: [], points_expiry_months: 24 }
              as: ProgramAdmin
              captures: { prod_id: $.data.id }
            - call: "POST /accounts"
              payload: { card_product_id: "${prod_id}", cardholder_name: "Ada" }
              as: ProgramAdmin
              captures: { acct_id: $.data.id }
            - call: "POST /accounts/${acct_id}/activate"
              payload: {}
              as: ProgramAdmin
            - call: "POST /transactions"
              payload: { card_account_id: "${acct_id}", amount_cents: 50000, category_code: "OTHER", transacted_at: "2026-07-02T00:00:00Z" }
              as: ProgramAdmin
              captures: { decl_id: $.data.id }
            - call: "POST /transactions"
              payload: { card_account_id: "${acct_id}", amount_cents: 30000, category_code: "OTHER", transacted_at: "2026-07-03T00:00:00Z" }
              as: ProgramAdmin
              captures: { ref_id: $.data.id }
          trigger:
            - call: "POST /transactions/${decl_id}/decline"
              payload: {}
              as: ProgramAdmin
            - call: "POST /transactions/${ref_id}/post"
              payload: {}
              as: ProgramAdmin
            - call: "POST /transactions/${ref_id}/refund"
              payload: {}
              as: ProgramAdmin
            - call: "GET /accounts/${acct_id}"
              payload: {}
              as: ProgramAdmin
          assert:
            - "Transaction.${decl_id}.status == DECLINED and Transaction.${ref_id}.status == REFUNDED"
            - "CardAccount.${acct_id}.pending_points == 0 and CardAccount.${acct_id}.points_balance == 0"

      - name: redemption_branch_confirmed_vs_rejected_plus_reverse_revert
        grounds:
          - state_machines.Redemption.PENDING_to_CONFIRMED
          - state_machines.Redemption.PENDING_to_REJECTED
          - state_machines.Redemption.CONFIRMED_to_REVERSED
        distinguishing_aspect: |
          Redemption is non-linear on a DIFFERENT entity: PENDING forks to {CONFIRMED, REJECTED} (consume lots vs
          no-op) and CONFIRMED reverts via REVERSED (restore lots). Branch + revert on Redemption.
        test_recipe:
          setup:
            - "ACTIVE account with points_balance 1000 (one POSTED OTHER txn of 100000 cents)."
            - "Two PENDING redemptions: one to reject, one to confirm then reverse."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /products"
              payload: { name: "Cash Visa", base_earn_rate_bps: 100, signup_bonus_points: 0, signup_bonus_spend_threshold_cents: 999999, signup_bonus_window_days: 90, tier_thresholds: [], points_expiry_months: 24 }
              as: ProgramAdmin
              captures: { prod_id: $.data.id }
            - call: "POST /accounts"
              payload: { card_product_id: "${prod_id}", cardholder_name: "Ada" }
              as: ProgramAdmin
              captures: { acct_id: $.data.id }
            - call: "POST /accounts/${acct_id}/activate"
              payload: {}
              as: ProgramAdmin
            - call: "POST /transactions"
              payload: { card_account_id: "${acct_id}", amount_cents: 100000, category_code: "OTHER", transacted_at: "2026-07-02T00:00:00Z" }
              as: ProgramAdmin
              captures: { txn_id: $.data.id }
            - call: "POST /transactions/${txn_id}/post"
              payload: {}
              as: ProgramAdmin
            - call: "GET /accounts/${acct_id}"
              payload: {}
              as: ProgramAdmin
              captures: { v1: $.data.version }
            - call: "POST /redemptions"
              payload: { card_account_id: "${acct_id}", redemption_type: "STATEMENT_CREDIT", points_requested: 200, expected_card_account_version: "${v1}" }
              as: Cardholder
              as_user_id: "${acct_id}"
              captures: { rej_id: $.data.id }
            - call: "GET /accounts/${acct_id}"
              payload: {}
              as: ProgramAdmin
              captures: { v2: $.data.version }
            - call: "POST /redemptions"
              payload: { card_account_id: "${acct_id}", redemption_type: "STATEMENT_CREDIT", points_requested: 300, expected_card_account_version: "${v2}" }
              as: Cardholder
              as_user_id: "${acct_id}"
              captures: { conf_id: $.data.id }
          trigger:
            - call: "POST /redemptions/${rej_id}/reject"
              payload: {}
              as: RewardsOps
            - call: "POST /redemptions/${conf_id}/confirm"
              payload: {}
              as: RewardsOps
            - call: "POST /redemptions/${conf_id}/reverse"
              payload: {}
              as: RewardsOps
            - call: "GET /accounts/${acct_id}"
              payload: {}
              as: ProgramAdmin
          assert:
            - "Redemption.${rej_id}.status == REJECTED and Redemption.${conf_id}.status == REVERSED"
            - "CardAccount.${acct_id}.points_balance == 1000 (reject consumed nothing; confirm+reverse net zero)"

  # =====================================================================
  # Rule 4 — Transitive cascade chains from different triggers
  # =====================================================================
  - rule_id: transitive_cascade
    instances:
      - name: post_drives_qualifying_spend_then_signup_grant_then_balance_depth3
        grounds:
          - state_machines.Transaction.PENDING_to_POSTED
          - calculations.signup_bonus_progress
          - entities.CardAccount.fields.qualifying_spend_cents
          - entities.CardAccount.fields.signup_bonus_status
          - entities.PointsLot.fields.lot_type
        distinguishing_aspect: |
          Depth-3 cascade from a single POST: (A) txn POST updates account.qualifying_spend_cents -> (B) that
          crossing the threshold flips signup_bonus_status to EARNED and mints a SIGNUP_BONUS PointsLot -> (C) the
          new lot's points fold into points_balance. Each hop is caused by the prior hop.
        test_recipe:
          setup:
            - "Product signup threshold 100000 cents, bonus 10000 points, window 90 days. ACTIVE account opened 2026-07-01."
            - "Account qualifying_spend already 50000 (one POSTED OTHER txn of 50000)."
            - "Clock at 2026-07-10T00:00:00Z, well within window."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /products"
              payload: { name: "Bonus Visa", base_earn_rate_bps: 100, signup_bonus_points: 10000, signup_bonus_spend_threshold_cents: 100000, signup_bonus_window_days: 90, tier_thresholds: [], points_expiry_months: 24 }
              as: ProgramAdmin
              captures: { prod_id: $.data.id }
            - call: "POST /accounts"
              payload: { card_product_id: "${prod_id}", cardholder_name: "Ada" }
              as: ProgramAdmin
              captures: { acct_id: $.data.id }
            - call: "POST /accounts/${acct_id}/activate"
              payload: {}
              as: ProgramAdmin
            - call: "POST /transactions"
              payload: { card_account_id: "${acct_id}", amount_cents: 50000, category_code: "OTHER", transacted_at: "2026-07-05T00:00:00Z" }
              as: ProgramAdmin
              captures: { t1_id: $.data.id }
            - call: "POST /transactions/${t1_id}/post"
              payload: {}
              as: ProgramAdmin
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-10T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /transactions"
              payload: { card_account_id: "${acct_id}", amount_cents: 50000, category_code: "OTHER", transacted_at: "2026-07-10T00:00:00Z" }
              as: ProgramAdmin
              captures: { t2_id: $.data.id }
          trigger:
            - call: "POST /transactions/${t2_id}/post"
              payload: {}
              as: ProgramAdmin
            - call: "GET /accounts/${acct_id}"
              payload: {}
              as: ProgramAdmin
            - call: "GET /points-lots?card_account_id=${acct_id}"
              payload: {}
              as: ProgramAdmin
          assert:
            - "CardAccount.${acct_id}.qualifying_spend_cents == 100000"
            - "CardAccount.${acct_id}.signup_bonus_status == EARNED"
            - "Exactly one PointsLot for the account has lot_type == SIGNUP_BONUS with original_points == 10000"
            - "CardAccount.${acct_id}.points_balance == 11000 (500 from t1 + 500 from t2 + 10000 signup)"

      - name: refund_claws_lot_then_recomputes_balance_depth2
        grounds:
          - state_machines.Transaction.POSTED_to_REFUNDED
          - entities.PointsLot.fields.status
          - entities.CardAccount.fields.points_balance
        distinguishing_aspect: |
          Depth-2 cascade from a DIFFERENT trigger (REFUND, not POST): (A) txn REFUND flips its EARN lot to
          CLAWED_BACK -> (B) account.points_balance recomputes downward by the lot's remaining_points.
        test_recipe:
          setup:
            - "ACTIVE account with one POSTED OTHER txn of 100000 cents (lot of 1000 points, balance 1000)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /products"
              payload: { name: "Cash Visa", base_earn_rate_bps: 100, signup_bonus_points: 0, signup_bonus_spend_threshold_cents: 999999, signup_bonus_window_days: 90, tier_thresholds: [], points_expiry_months: 24 }
              as: ProgramAdmin
              captures: { prod_id: $.data.id }
            - call: "POST /accounts"
              payload: { card_product_id: "${prod_id}", cardholder_name: "Ada" }
              as: ProgramAdmin
              captures: { acct_id: $.data.id }
            - call: "POST /accounts/${acct_id}/activate"
              payload: {}
              as: ProgramAdmin
            - call: "POST /transactions"
              payload: { card_account_id: "${acct_id}", amount_cents: 100000, category_code: "OTHER", transacted_at: "2026-07-02T00:00:00Z" }
              as: ProgramAdmin
              captures: { txn_id: $.data.id }
            - call: "POST /transactions/${txn_id}/post"
              payload: {}
              as: ProgramAdmin
          trigger:
            - call: "POST /transactions/${txn_id}/refund"
              payload: {}
              as: ProgramAdmin
            - call: "GET /points-lots?source_transaction_id=${txn_id}"
              payload: {}
              as: ProgramAdmin
            - call: "GET /accounts/${acct_id}"
              payload: {}
              as: ProgramAdmin
          assert:
            - "The EARN PointsLot with source_transaction_id == ${txn_id} has status == CLAWED_BACK"
            - "CardAccount.${acct_id}.points_balance == 0"

  # =====================================================================
  # Rule 5 — Validation priority conflicts across different error-category pairs
  # =====================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: state_beats_insufficient_points_on_confirm
        grounds:
          - validations[priority=7]
          - validations[priority=13]
          - state_machines.Redemption.PENDING_to_CONFIRMED
        distinguishing_aspect: |
          Category pair STATE (p7) vs BUSINESS_FISCAL (p13): a redemption already REJECTED then re-confirmed with
          points_requested exceeding balance fails with the higher-priority ERR_INVALID_STATE (p7), NOT
          ERR_INSUFFICIENT_POINTS (p13).
        test_recipe:
          setup:
            - "ACTIVE account with points_balance 1000; one redemption REJECTED (not PENDING)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /products"
              payload: { name: "Cash Visa", base_earn_rate_bps: 100, signup_bonus_points: 0, signup_bonus_spend_threshold_cents: 999999, signup_bonus_window_days: 90, tier_thresholds: [], points_expiry_months: 24 }
              as: ProgramAdmin
              captures: { prod_id: $.data.id }
            - call: "POST /accounts"
              payload: { card_product_id: "${prod_id}", cardholder_name: "Ada" }
              as: ProgramAdmin
              captures: { acct_id: $.data.id }
            - call: "POST /accounts/${acct_id}/activate"
              payload: {}
              as: ProgramAdmin
            - call: "POST /transactions"
              payload: { card_account_id: "${acct_id}", amount_cents: 100000, category_code: "OTHER", transacted_at: "2026-07-02T00:00:00Z" }
              as: ProgramAdmin
              captures: { txn_id: $.data.id }
            - call: "POST /transactions/${txn_id}/post"
              payload: {}
              as: ProgramAdmin
            - call: "GET /accounts/${acct_id}"
              payload: {}
              as: ProgramAdmin
              captures: { v1: $.data.version }
            - call: "POST /redemptions"
              payload: { card_account_id: "${acct_id}", redemption_type: "STATEMENT_CREDIT", points_requested: 5000, expected_card_account_version: "${v1}" }
              as: Cardholder
              as_user_id: "${acct_id}"
              captures: { red_id: $.data.id }
            - call: "POST /redemptions/${red_id}/reject"
              payload: {}
              as: RewardsOps
          trigger:
            - call: "POST /redemptions/${red_id}/confirm"
              payload: {}
              as: RewardsOps
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 409"
            - "Redemption.${red_id} response error_id == ERR_INVALID_STATE (state p7 wins over insufficient-points p13)"

      - name: cross_product_beats_duplicate_on_activation
        grounds:
          - validations[priority=8]
          - validations[priority=9]
          - state_machines.CategoryActivation.ACTIVE_to_ACTIVE
        distinguishing_aspect: |
          Category pair BUSINESS_REFERENTIAL (p8) vs BUSINESS_CONSTRAINT (p9) on POST /category-activations: the
          referential cross-product check (p8) is evaluated BEFORE the duplicate-uniqueness check (p9). Activating a
          quarterly category that belongs to a DIFFERENT product than the account fails with ERR_CROSS_PRODUCT_MISMATCH
          (p8); the lower-priority ERR_DUPLICATE_ACTIVATION (p9) is never reached because p8 short-circuits first.
        test_recipe:
          setup:
            - "Two products P1, P2 each ACTIVE. Account opened under P1, ACTIVE."
            - "QuarterlyCategory belongs to P2 (the wrong product)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /products"
              payload: { name: "P1 Visa", base_earn_rate_bps: 100, signup_bonus_points: 0, signup_bonus_spend_threshold_cents: 100000, signup_bonus_window_days: 90, tier_thresholds: [], points_expiry_months: 24 }
              as: ProgramAdmin
              captures: { p1_id: $.data.id }
            - call: "POST /products"
              payload: { name: "P2 Visa", base_earn_rate_bps: 100, signup_bonus_points: 0, signup_bonus_spend_threshold_cents: 100000, signup_bonus_window_days: 90, tier_thresholds: [], points_expiry_months: 24 }
              as: ProgramAdmin
              captures: { p2_id: $.data.id }
            - call: "POST /quarterly-categories"
              payload: { card_product_id: "${p2_id}", code: "GROCERY", quarter_label: "2026-Q3", window_start: "2026-07-01T00:00:00Z", window_end: "2026-10-01T00:00:00Z", earn_multiplier_bps: 500, bonus_cap_cents: 50000 }
              as: ProgramAdmin
              captures: { qcat_p2_id: $.data.id }
            - call: "POST /accounts"
              payload: { card_product_id: "${p1_id}", cardholder_name: "Ada" }
              as: ProgramAdmin
              captures: { acct_id: $.data.id }
            - call: "POST /accounts/${acct_id}/activate"
              payload: {}
              as: ProgramAdmin
          trigger:
            - call: "POST /category-activations"
              payload: { card_account_id: "${acct_id}", quarterly_category_id: "${qcat_p2_id}" }
              as: Cardholder
              as_user_id: "${acct_id}"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 422"
            - "response error_id == ERR_CROSS_PRODUCT_MISMATCH (referential p8 wins over duplicate-constraint p9)"

  # =====================================================================
  # Rule 6 — Boundary-precision checks on different metrics/endpoints
  # =====================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: signup_threshold_ge_exact_on_transaction_post
        grounds:
          - calculations.signup_bonus_progress
          - entities.CardAccount.fields.signup_bonus_status
          - state_machines.Transaction.PENDING_to_POSTED
        distinguishing_aspect: |
          Threshold uses '>=': qualifying_spend reaching EXACTLY 100000 cents flips signup_bonus_status to EARNED;
          one cent short (99999) leaves it NOT_QUALIFIED. Reached via POST /transactions/{id}/post.
        test_recipe:
          setup:
            - "Product signup threshold 100000, bonus 10000, window 90 days. ACTIVE account."
            - "First POST brings qualifying_spend to 99999 (not qualified)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /products"
              payload: { name: "Bonus Visa", base_earn_rate_bps: 100, signup_bonus_points: 10000, signup_bonus_spend_threshold_cents: 100000, signup_bonus_window_days: 90, tier_thresholds: [], points_expiry_months: 24 }
              as: ProgramAdmin
              captures: { prod_id: $.data.id }
            - call: "POST /accounts"
              payload: { card_product_id: "${prod_id}", cardholder_name: "Ada" }
              as: ProgramAdmin
              captures: { acct_id: $.data.id }
            - call: "POST /accounts/${acct_id}/activate"
              payload: {}
              as: ProgramAdmin
            - call: "POST /transactions"
              payload: { card_account_id: "${acct_id}", amount_cents: 99999, category_code: "OTHER", transacted_at: "2026-07-05T00:00:00Z" }
              as: ProgramAdmin
              captures: { t1_id: $.data.id }
            - call: "POST /transactions/${t1_id}/post"
              payload: {}
              as: ProgramAdmin
            - call: "GET /accounts/${acct_id}"
              payload: {}
              as: ProgramAdmin
              captures: { status_at_99999: $.data.signup_bonus_status }
            - call: "POST /transactions"
              payload: { card_account_id: "${acct_id}", amount_cents: 1, category_code: "OTHER", transacted_at: "2026-07-06T00:00:00Z" }
              as: ProgramAdmin
              captures: { t2_id: $.data.id }
          trigger:
            - call: "POST /transactions/${t2_id}/post"
              payload: {}
              as: ProgramAdmin
            - call: "GET /accounts/${acct_id}"
              payload: {}
              as: ProgramAdmin
          assert:
            - "At qualifying_spend == 99999: CardAccount.${acct_id}.signup_bonus_status == NOT_QUALIFIED"
            - "At qualifying_spend == 100000 (exact): CardAccount.${acct_id}.signup_bonus_status == EARNED"

      - name: min_transfer_points_boundary_on_redemption_create
        grounds:
          - validations[priority=11]
          - entities.TransferPartner.fields.min_transfer_points
          - errors[ERR_BELOW_MIN_TRANSFER]
        distinguishing_aspect: |
          A DIFFERENT metric on a DIFFERENT endpoint: POINTS_TRANSFER of exactly 1000 points succeeds at
          min_transfer_points==1000 (>= floor), while 999 is rejected with ERR_BELOW_MIN_TRANSFER. Reached via
          POST /redemptions.
        test_recipe:
          setup:
            - "ACTIVE account with points_balance 2000; ACTIVE AIRLINE partner min_transfer_points 1000, ratio 1:1."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /products"
              payload: { name: "Cash Visa", base_earn_rate_bps: 100, signup_bonus_points: 0, signup_bonus_spend_threshold_cents: 999999, signup_bonus_window_days: 90, tier_thresholds: [], points_expiry_months: 24 }
              as: ProgramAdmin
              captures: { prod_id: $.data.id }
            - call: "POST /transfer-partners"
              payload: { name: "SkyMiles", partner_type: "AIRLINE", transfer_ratio_num: 1, transfer_ratio_den: 1, min_transfer_points: 1000 }
              as: ProgramAdmin
              captures: { partner_id: $.data.id }
            - call: "POST /accounts"
              payload: { card_product_id: "${prod_id}", cardholder_name: "Ada" }
              as: ProgramAdmin
              captures: { acct_id: $.data.id }
            - call: "POST /accounts/${acct_id}/activate"
              payload: {}
              as: ProgramAdmin
            - call: "POST /transactions"
              payload: { card_account_id: "${acct_id}", amount_cents: 200000, category_code: "OTHER", transacted_at: "2026-07-02T00:00:00Z" }
              as: ProgramAdmin
              captures: { txn_id: $.data.id }
            - call: "POST /transactions/${txn_id}/post"
              payload: {}
              as: ProgramAdmin
            - call: "GET /accounts/${acct_id}"
              payload: {}
              as: ProgramAdmin
              captures: { v_below: $.data.version }
          trigger:
            - call: "POST /redemptions"
              payload: { card_account_id: "${acct_id}", redemption_type: "POINTS_TRANSFER", points_requested: 999, transfer_partner_id: "${partner_id}", expected_card_account_version: "${v_below}" }
              as: Cardholder
              as_user_id: "${acct_id}"
              captures: { err: $.data.error_id }
            - call: "POST /redemptions"
              payload: { card_account_id: "${acct_id}", redemption_type: "POINTS_TRANSFER", points_requested: 1000, transfer_partner_id: "${partner_id}", expected_card_account_version: "${v_below}" }
              as: Cardholder
              as_user_id: "${acct_id}"
              captures: { ok_id: $.data.id }
          assert:
            - "999 points: HTTP 422, error_id == ERR_BELOW_MIN_TRANSFER (the rejected create does not advance account.version)"
            - "1000 points at the same ${v_below}: HTTP 201, Redemption.${ok_id}.status == PENDING — exact-boundary >= passes"

  # =====================================================================
  # Rule 7 — Cross-entity state dependencies across different entity pairs
  # =====================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: transaction_post_requires_account_active
        grounds:
          - state_machines.Transaction.PENDING_to_POSTED
          - entities.CardAccount.fields.status
          - validations[priority=7]
        distinguishing_aspect: |
          Entity pair Transaction->CardAccount: posting a PENDING transaction is rejected with ERR_INVALID_STATE
          when the owning CardAccount has been CLOSED (account state gates the transaction transition).
        test_recipe:
          setup:
            - "Account ACTIVE, one PENDING txn created, then account CLOSED."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /products"
              payload: { name: "Cash Visa", base_earn_rate_bps: 100, signup_bonus_points: 0, signup_bonus_spend_threshold_cents: 999999, signup_bonus_window_days: 90, tier_thresholds: [], points_expiry_months: 24 }
              as: ProgramAdmin
              captures: { prod_id: $.data.id }
            - call: "POST /accounts"
              payload: { card_product_id: "${prod_id}", cardholder_name: "Ada" }
              as: ProgramAdmin
              captures: { acct_id: $.data.id }
            - call: "POST /accounts/${acct_id}/activate"
              payload: {}
              as: ProgramAdmin
            - call: "POST /transactions"
              payload: { card_account_id: "${acct_id}", amount_cents: 50000, category_code: "OTHER", transacted_at: "2026-07-02T00:00:00Z" }
              as: ProgramAdmin
              captures: { txn_id: $.data.id }
            - call: "POST /accounts/${acct_id}/close"
              payload: {}
              as: ProgramAdmin
          trigger:
            - call: "POST /transactions/${txn_id}/post"
              payload: {}
              as: ProgramAdmin
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 409, error_id == ERR_INVALID_STATE"
            - "Transaction.${txn_id}.status remains PENDING"

      - name: points_transfer_requires_partner_active
        grounds:
          - state_machines.Redemption.PENDING_to_CONFIRMED
          - entities.TransferPartner.fields.status
          - validations[priority=8]
        distinguishing_aspect: |
          A DIFFERENT entity pair Redemption->TransferPartner: creating a POINTS_TRANSFER redemption to a SUSPENDED
          partner is rejected with ERR_CROSS_PRODUCT_MISMATCH (partner state gates the transfer redemption).
        test_recipe:
          setup:
            - "ACTIVE account with points_balance 2000; an AIRLINE partner that is SUSPENDED."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /products"
              payload: { name: "Cash Visa", base_earn_rate_bps: 100, signup_bonus_points: 0, signup_bonus_spend_threshold_cents: 999999, signup_bonus_window_days: 90, tier_thresholds: [], points_expiry_months: 24 }
              as: ProgramAdmin
              captures: { prod_id: $.data.id }
            - call: "POST /transfer-partners"
              payload: { name: "SkyMiles", partner_type: "AIRLINE", transfer_ratio_num: 1, transfer_ratio_den: 1, min_transfer_points: 100 }
              as: ProgramAdmin
              captures: { partner_id: $.data.id }
            - call: "POST /transfer-partners/${partner_id}/suspend"
              payload: {}
              as: ProgramAdmin
            - call: "POST /accounts"
              payload: { card_product_id: "${prod_id}", cardholder_name: "Ada" }
              as: ProgramAdmin
              captures: { acct_id: $.data.id }
            - call: "POST /accounts/${acct_id}/activate"
              payload: {}
              as: ProgramAdmin
            - call: "POST /transactions"
              payload: { card_account_id: "${acct_id}", amount_cents: 200000, category_code: "OTHER", transacted_at: "2026-07-02T00:00:00Z" }
              as: ProgramAdmin
              captures: { txn_id: $.data.id }
            - call: "POST /transactions/${txn_id}/post"
              payload: {}
              as: ProgramAdmin
            - call: "GET /accounts/${acct_id}"
              payload: {}
              as: ProgramAdmin
              captures: { v_susp: $.data.version }
          trigger:
            - call: "POST /redemptions"
              payload: { card_account_id: "${acct_id}", redemption_type: "POINTS_TRANSFER", points_requested: 1000, transfer_partner_id: "${partner_id}", expected_card_account_version: "${v_susp}" }
              as: Cardholder
              as_user_id: "${acct_id}"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 422, error_id == ERR_CROSS_PRODUCT_MISMATCH"

  # =====================================================================
  # Rule 8 — Resource temporal-overlap conflicts across different interval semantics
  # =====================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: quarterly_window_half_open_calendar_interval
        grounds:
          - entities.QuarterlyCategory.fields.window_start
          - entities.QuarterlyCategory.fields.window_end
          - calculations.points_earning
        distinguishing_aspect: |
          QuarterlyCategory resource uses a FIXED-CALENDAR half-open interval [window_start, window_end): a GROCERY
          txn at transacted_at == window_end (exclusive upper) does NOT earn the quarterly bonus (earns base only),
          while transacted_at == window_start (inclusive lower) does. Geometric treatment = exclusive-upper on a
          fixed calendar window.
        test_recipe:
          setup:
            - "Product base 100bps; quarterly GROCERY 500bps window [2026-07-01T00:00:00Z, 2026-10-01T00:00:00Z) cap 100000; account activated."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-30T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /products"
              payload: { name: "Q Visa", base_earn_rate_bps: 100, signup_bonus_points: 0, signup_bonus_spend_threshold_cents: 999999, signup_bonus_window_days: 365, tier_thresholds: [], points_expiry_months: 24 }
              as: ProgramAdmin
              captures: { prod_id: $.data.id }
            - call: "POST /quarterly-categories"
              payload: { card_product_id: "${prod_id}", code: "GROCERY", quarter_label: "2026-Q3", window_start: "2026-07-01T00:00:00Z", window_end: "2026-10-01T00:00:00Z", earn_multiplier_bps: 500, bonus_cap_cents: 100000 }
              as: ProgramAdmin
              captures: { qcat_id: $.data.id }
            - call: "POST /accounts"
              payload: { card_product_id: "${prod_id}", cardholder_name: "Ada" }
              as: ProgramAdmin
              captures: { acct_id: $.data.id }
            - call: "POST /accounts/${acct_id}/activate"
              payload: {}
              as: ProgramAdmin
            - call: "POST /category-activations"
              payload: { card_account_id: "${acct_id}", quarterly_category_id: "${qcat_id}" }
              as: Cardholder
              as_user_id: "${acct_id}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-02T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /transactions"
              payload: { card_account_id: "${acct_id}", amount_cents: 10000, category_code: "GROCERY", transacted_at: "2026-07-01T00:00:00Z" }
              as: ProgramAdmin
              captures: { in_id: $.data.id }
            - call: "POST /transactions"
              payload: { card_account_id: "${acct_id}", amount_cents: 10000, category_code: "GROCERY", transacted_at: "2026-10-01T00:00:00Z" }
              as: ProgramAdmin
              captures: { out_id: $.data.id }
          trigger:
            - call: "POST /transactions/${in_id}/post"
              payload: {}
              as: ProgramAdmin
            - call: "POST /transactions/${out_id}/post"
              payload: {}
              as: ProgramAdmin
          assert:
            - "Transaction.${in_id} (at window_start, inclusive): quarterly_bonus_applied_cents == 10000, earned_points == 500"
            - "Transaction.${out_id} (at window_end, exclusive): quarterly_bonus_applied_cents == 0, earned_points == 100"

      - name: signup_window_half_open_account_anchored_interval
        grounds:
          - entities.CardAccount.fields.opened_at
          - entities.CardProduct.fields.signup_bonus_window_days
          - calculations.signup_bonus_progress
        distinguishing_aspect: |
          A DIFFERENT resource (CardAccount) with DIFFERENT interval semantics: the signup window is an
          ACCOUNT-ANCHORED ROLLING interval [opened_at, opened_at + window_days) measured from each account's own
          opened_at (not a fixed calendar window). A txn transacted exactly at opened_at + window_days is OUTSIDE
          (exclusive upper) and does not advance qualifying_spend toward the bonus.
        test_recipe:
          setup:
            - "Product threshold 100000, bonus 10000, window 30 days. Account opened 2026-07-01T00:00:00Z."
            - "A txn transacted exactly at opened_at + 30 days = 2026-07-31T00:00:00Z (outside window)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /products"
              payload: { name: "Win Visa", base_earn_rate_bps: 100, signup_bonus_points: 10000, signup_bonus_spend_threshold_cents: 100000, signup_bonus_window_days: 30, tier_thresholds: [], points_expiry_months: 24 }
              as: ProgramAdmin
              captures: { prod_id: $.data.id }
            - call: "POST /accounts"
              payload: { card_product_id: "${prod_id}", cardholder_name: "Ada" }
              as: ProgramAdmin
              captures: { acct_id: $.data.id }
            - call: "POST /accounts/${acct_id}/activate"
              payload: {}
              as: ProgramAdmin
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-31T12:00:00Z" }
              as: ProgramAdmin
            - call: "POST /transactions"
              payload: { card_account_id: "${acct_id}", amount_cents: 100000, category_code: "OTHER", transacted_at: "2026-07-31T00:00:00Z" }
              as: ProgramAdmin
              captures: { edge_id: $.data.id }
          trigger:
            - call: "POST /transactions/${edge_id}/post"
              payload: {}
              as: ProgramAdmin
            - call: "GET /accounts/${acct_id}"
              payload: {}
              as: ProgramAdmin
          assert:
            - "CardAccount.${acct_id}.qualifying_spend_cents == 0 (txn at exclusive upper boundary excluded)"
            - "CardAccount.${acct_id}.signup_bonus_status == NOT_QUALIFIED"

  # =====================================================================
  # Rule 9 — Compensating-action invariants across different conserved quantities
  # =====================================================================
  - rule_id: compensating_invariant
    instances:
      - name: post_then_refund_conserves_account_points_balance
        grounds:
          - state_machines.Transaction.PENDING_to_POSTED
          - state_machines.Transaction.POSTED_to_REFUNDED
          - calculations.points_conservation
          - entities.CardAccount.fields.points_balance
        distinguishing_aspect: |
          Conserved quantity = account.points_balance. POST mints 1000 points; REFUND (the compensating action of
          POST) claws back exactly 1000, leaving points_balance equal to its pre-POST value (0). No drift.
        test_recipe:
          setup:
            - "ACTIVE account, points_balance 0; one PENDING OTHER txn of 100000 cents (will earn 1000)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /products"
              payload: { name: "Cash Visa", base_earn_rate_bps: 100, signup_bonus_points: 0, signup_bonus_spend_threshold_cents: 999999, signup_bonus_window_days: 90, tier_thresholds: [], points_expiry_months: 24 }
              as: ProgramAdmin
              captures: { prod_id: $.data.id }
            - call: "POST /accounts"
              payload: { card_product_id: "${prod_id}", cardholder_name: "Ada" }
              as: ProgramAdmin
              captures: { acct_id: $.data.id }
            - call: "POST /accounts/${acct_id}/activate"
              payload: {}
              as: ProgramAdmin
            - call: "POST /transactions"
              payload: { card_account_id: "${acct_id}", amount_cents: 100000, category_code: "OTHER", transacted_at: "2026-07-02T00:00:00Z" }
              as: ProgramAdmin
              captures: { txn_id: $.data.id }
          trigger:
            - call: "POST /transactions/${txn_id}/post"
              payload: {}
              as: ProgramAdmin
            - call: "GET /accounts/${acct_id}"
              payload: {}
              as: ProgramAdmin
              captures: { bal_after_post: $.data.points_balance }
            - call: "POST /transactions/${txn_id}/refund"
              payload: {}
              as: ProgramAdmin
            - call: "GET /accounts/${acct_id}"
              payload: {}
              as: ProgramAdmin
          assert:
            - "After POST: CardAccount.${acct_id}.points_balance == 1000"
            - "After REFUND: CardAccount.${acct_id}.points_balance == 0 (equal to pre-POST value; net drift 0)"

      - name: confirm_then_reverse_conserves_consumed_lot_points
        grounds:
          - state_machines.Redemption.PENDING_to_CONFIRMED
          - state_machines.Redemption.CONFIRMED_to_REVERSED
          - calculations.points_conservation
          - entities.Redemption.fields.lots_consumed
        distinguishing_aspect: |
          A DIFFERENT conserved quantity = sum of remaining_points across the lots named in Redemption.lots_consumed.
          CONFIRM consumes 1200 points across FIFO lots; REVERSE (the compensating action) restores exactly 1200 to
          those same lots, so the lot-set's remaining_points delta is +1200 and points_balance returns to 1750.
        test_recipe:
          setup:
            - "ACTIVE account with two POSTED OTHER txns earning 1000 (lot A) and 750 (lot B), balance 1750."
            - "A confirmed STATEMENT_CREDIT redemption of 1200 (consumes all of lot A and 200 of lot B)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /products"
              payload: { name: "Cash Visa", base_earn_rate_bps: 100, signup_bonus_points: 0, signup_bonus_spend_threshold_cents: 999999, signup_bonus_window_days: 90, tier_thresholds: [], points_expiry_months: 24 }
              as: ProgramAdmin
              captures: { prod_id: $.data.id }
            - call: "POST /accounts"
              payload: { card_product_id: "${prod_id}", cardholder_name: "Ada" }
              as: ProgramAdmin
              captures: { acct_id: $.data.id }
            - call: "POST /accounts/${acct_id}/activate"
              payload: {}
              as: ProgramAdmin
            - call: "POST /transactions"
              payload: { card_account_id: "${acct_id}", amount_cents: 100000, category_code: "OTHER", transacted_at: "2026-07-02T00:00:00Z" }
              as: ProgramAdmin
              captures: { txnA_id: $.data.id }
            - call: "POST /transactions/${txnA_id}/post"
              payload: {}
              as: ProgramAdmin
            - call: "POST /transactions"
              payload: { card_account_id: "${acct_id}", amount_cents: 75000, category_code: "OTHER", transacted_at: "2026-07-03T00:00:00Z" }
              as: ProgramAdmin
              captures: { txnB_id: $.data.id }
            - call: "POST /transactions/${txnB_id}/post"
              payload: {}
              as: ProgramAdmin
            - call: "GET /accounts/${acct_id}"
              payload: {}
              as: ProgramAdmin
              captures: { v_pre_red: $.data.version }
            - call: "POST /redemptions"
              payload: { card_account_id: "${acct_id}", redemption_type: "STATEMENT_CREDIT", points_requested: 1200, expected_card_account_version: "${v_pre_red}" }
              as: Cardholder
              as_user_id: "${acct_id}"
              captures: { red_id: $.data.id }
            - call: "POST /redemptions/${red_id}/confirm"
              payload: {}
              as: RewardsOps
            - call: "GET /accounts/${acct_id}"
              payload: {}
              as: ProgramAdmin
              captures: { bal_after_confirm: $.data.points_balance }
          trigger:
            - call: "POST /redemptions/${red_id}/reverse"
              payload: {}
              as: RewardsOps
            - call: "GET /accounts/${acct_id}"
              payload: {}
              as: ProgramAdmin
          assert:
            - "After CONFIRM: CardAccount.${acct_id}.points_balance == 550"
            - "After REVERSE: CardAccount.${acct_id}.points_balance == 1750 (restored exactly +1200 to the lots in lots_consumed)"
            - "Redemption.${red_id}.status == REVERSED"
