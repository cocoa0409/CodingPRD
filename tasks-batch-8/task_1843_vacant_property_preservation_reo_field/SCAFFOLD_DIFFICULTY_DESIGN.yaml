  - rule_id: priority_pair_validation_conflict
    instances:
      - name: submit_state_beats_fiscal
        grounds:
          - validations[priority=5]
          - validations[priority=10]
          - state_machines.WorkOrder.IN_PROGRESS_to_SUBMITTED
          - errors[ERR_BID_REQUIRED_OVER_CAP]
        distinguishing_aspect: |
          Pair state-vs-business_fiscal: a second submit on an already-SUBMITTED
          work order carrying a 9000-cent cost (over the 2000-cent bid threshold,
          no bid) violates both p5 state and p10 fiscal; p5 wins with
          ERR_INVALID_STATE, not ERR_BID_REQUIRED_OVER_CAP.
        test_recipe:
          setup:
            - "GRASS_CUT work order (allowable bid threshold 2000) already SUBMITTED with cost 1500"
          setup_api_calls:
            - { call: "POST /preservation/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: VendorAdmin }
            - { call: "POST /preservation/servicers", payload: { name: "Servicer J", code: "SVCJ" }, as: VendorAdmin, captures: { sv: $.data.id } }
            - { call: "POST /preservation/crews", payload: { name: "Crew 11", crew_code: "CR11" }, as: VendorAdmin, captures: { cr: $.data.id } }
