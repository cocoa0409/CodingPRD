      - name: cue_credit_per_cue_rounding_before_summation
        claim_type: precision
        grounds:
          - calculations.cue_performance_credits.precision
          - calculations.performance_royalty_cents.precision
        excluded_because:
          difficulty_instance: combinatorial_formula / cue_credit_round_per_cue_then_sum_and_two_step_writer_rounding
          rationale: "The named §1.8 instance is built precisely on the 3.01-versus-3.00 divergence and the two-step 1882-versus-1881 writer rounding."

      - name: statement_minimum_payout_threshold_boundary
        claim_type: threshold
        grounds:
          - calculations.statement_settlement.constants.MIN_PAYOUT_CENTS
          - validations[priority=47].statement_payable
        excluded_because:
          difficulty_instance: boundary_precision_check / statement_min_payout_boundary_2500_vs_2499
          rationale: "The named §1.8 instance sits on both sides of the 2500 boundary and asserts PAYABLE versus HELD_BELOW_MINIMUM."

      - name: pool_with_empty_eligible_set_retains_distributable
        claim_type: waterfall_allocation
        grounds:
          - calculations.blanket_pool_distribution.formula
        excluded_because:
          difficulty_instance: boundary_precision_check / pool_empty_eligible_set_retains_distributable_with_no_ledger
          rationale: "The named §1.8 instance accepts a report whose only sheet is unregistered, so the eligible set is empty while the pool figures are still computed."

  # ===========================================================================
  - section: validations
    instances:

      - name: agreement_term_consistency_violations_map_to_declared_errors
        claim_type: violation_to_error
        grounds:
          - validations[priority=11].agreement_share_split_sums_100
          - validations[priority=12].work_for_hire_terms_consistent
          - errors[ERR_SHARE_SPLIT_NOT_100]
          - errors[ERR_WORK_FOR_HIRE_TERMS_INVALID]
        distinguishing_aspect: |
          Covers all three shapes of an inconsistent work-for-hire deal (a WFH with a non-zero sync
          share, a WFH with a zero buyout, and a ROYALTY_SPLIT carrying a buyout) plus the split rule,
          and pins their relative priority: a payload violating both rule 11 and rule 12 returns
          ERR_SHARE_SPLIT_NOT_100 because 11 is evaluated first.
        test_recipe:
          setup:
            - "One composer; no agreement yet."
          setup_api_calls:
            - call: "POST /music-library/composers"
              payload: { display_name: "Nadia Okoro", pro_affiliation: "ASCAP" }
              as: CatalogAdmin
              captures: { c1: $.data.id }
          trigger:
            - call: "POST /music-library/composer-agreements"
              payload: { composer_id: "${c1}", agreement_type: "WORK_FOR_HIRE", writer_share_pct: 0.00, publisher_share_pct: 100.00, sync_fee_share_pct: 10.00, buyout_fee_cents: 500000, exclusivity: "EXCLUSIVE", holdback_days: 0, advance_cents: 0, blanket_opt_in: true }
              as: RightsManager
            - call: "POST /music-library/composer-agreements"
              payload: { composer_id: "${c1}", agreement_type: "WORK_FOR_HIRE", writer_share_pct: 0.00, publisher_share_pct: 100.00, sync_fee_share_pct: 0.00, buyout_fee_cents: 0, exclusivity: "EXCLUSIVE", holdback_days: 0, advance_cents: 0, blanket_opt_in: true }
              as: RightsManager
            - call: "POST /music-library/composer-agreements"
              payload: { composer_id: "${c1}", agreement_type: "ROYALTY_SPLIT", writer_share_pct: 50.00, publisher_share_pct: 50.00, sync_fee_share_pct: 40.00, buyout_fee_cents: 250000, exclusivity: "NON_EXCLUSIVE", holdback_days: 0, advance_cents: 0, blanket_opt_in: true }
              as: RightsManager
            - call: "POST /music-library/composer-agreements"
              payload: { composer_id: "${c1}", agreement_type: "ROYALTY_SPLIT", writer_share_pct: 60.00, publisher_share_pct: 30.00, sync_fee_share_pct: 40.00, buyout_fee_cents: 0, exclusivity: "NON_EXCLUSIVE", holdback_days: 0, advance_cents: 0, blanket_opt_in: true }
              as: RightsManager
            - call: "POST /music-library/composer-agreements"
              payload: { composer_id: "${c1}", agreement_type: "WORK_FOR_HIRE", writer_share_pct: 60.00, publisher_share_pct: 30.00, sync_fee_share_pct: 12.00, buyout_fee_cents: 0, exclusivity: "EXCLUSIVE", holdback_days: 0, advance_cents: 0, blanket_opt_in: true }
              as: RightsManager
            - call: "POST /music-library/composer-agreements"
              payload: { composer_id: "${c1}", agreement_type: "WORK_FOR_HIRE", writer_share_pct: 0.00, publisher_share_pct: 100.00, sync_fee_share_pct: 0.00, buyout_fee_cents: 500000, exclusivity: "EXCLUSIVE", holdback_days: 45, advance_cents: 0, blanket_opt_in: false }
              as: RightsManager
              captures: { ag1: $.data.id }
            - call: "GET /music-library/composer-agreements?composer_id=${c1}"
              payload: { composer_id: "${c1}" }
              as: RightsManager
          assert:
            - "Calls 1, 2 and 3 → 422 with data.error_id == \"ERR_WORK_FOR_HIRE_TERMS_INVALID\""
            - "Call 4 → 422 with data.error_id == \"ERR_SHARE_SPLIT_NOT_100\" (60.00 + 30.00 = 90.00)"
            - "Call 5 → 422 with data.error_id == \"ERR_SHARE_SPLIT_NOT_100\", not ERR_WORK_FOR_HIRE_TERMS_INVALID, because priority 11 is evaluated before priority 12"
            - "Call 6 → 201 with status \"DRAFT\", buyout_fee_cents 500000, sync_fee_share_pct 0.00, holdback_days 45, blanket_opt_in false and version 1"
            - "Call 7 → total_count 1 (only the accepted agreement exists; none of the five refused calls persisted a row)"

      - name: cataloging_requires_complete_metadata_then_succeeds_after_patch
        claim_type: satisfaction_to_pass
        grounds:
          - validations[priority=36].metadata_complete_for_cataloging
          - endpoints["PATCH /music-library/compositions/{composition_id}"].side_effects
          - errors[ERR_METADATA_INCOMPLETE]
        distinguishing_aspect: |
          Both halves of the metadata gate are exercised independently on one row: a work ingested with
          empty mood_tags AND empty instrumentation is refused, still refused after only mood_tags is
          filled, and cataloged once instrumentation is filled too — while every PATCH bumps version
          without ever touching either status axis (1 → 2 → 3 → 4).
        test_recipe:
          setup:
            - "One composer with an ACTIVE agreement; one work ingested with mood_tags [] and instrumentation []."
          setup_api_calls:
            - call: "POST /music-library/composers"
              payload: { display_name: "Nadia Okoro", pro_affiliation: "ASCAP" }
              as: CatalogAdmin
              captures: { c1: $.data.id }
            - call: "POST /music-library/composer-agreements"
              payload: { composer_id: "${c1}", agreement_type: "ROYALTY_SPLIT", writer_share_pct: 50.00, publisher_share_pct: 50.00, sync_fee_share_pct: 40.00, buyout_fee_cents: 0, exclusivity: "NON_EXCLUSIVE", holdback_days: 0, advance_cents: 0, blanket_opt_in: true }
              as: RightsManager
              captures: { ag1: $.data.id }
            - call: "POST /music-library/composer-agreements/${ag1}/submit-for-signature"
              payload: {}
              as: RightsManager
            - call: "POST /music-library/composer-agreements/${ag1}/sign"
              payload: { signature_name: "Nadia Okoro" }
              as: Composer
              as_user_id: "${c1}"
            - call: "POST /music-library/compositions"
              payload: { composer_id: "${c1}", agreement_id: "${ag1}", title: "Untagged Bed", duration_sec: 120, tempo_bpm: 100, genre: "AMBIENT", mood_tags: [], instrumentation: [] }
              as: CatalogAdmin
              captures: { compA: $.data.id }
          trigger:
            - call: "POST /music-library/compositions/${compA}/catalog"
              payload: {}
              as: CatalogAdmin
            - call: "PATCH /music-library/compositions/${compA}"
              payload: { mood_tags: ["CALM"] }
              as: CatalogAdmin
            - call: "POST /music-library/compositions/${compA}/catalog"
              payload: {}
              as: CatalogAdmin
            - call: "PATCH /music-library/compositions/${compA}"
              payload: { instrumentation: ["PIANO", "STRINGS"], tempo_bpm: 96 }
              as: CatalogAdmin
            - call: "POST /music-library/compositions/${compA}/catalog"
              payload: {}
              as: CatalogAdmin
          assert:
            - "Call 1 → 409 with data.error_id == \"ERR_METADATA_INCOMPLETE\" and Composition.${compA}.catalog_status stays \"INGESTED\" with version 1"
            - "Call 2 → 200 with mood_tags == [\"CALM\"], version 2, catalog_status \"INGESTED\" and availability_status \"AVAILABLE\""
            - "Call 3 → 409 with data.error_id == \"ERR_METADATA_INCOMPLETE\" (instrumentation is still empty) and version stays 2"
            - "Call 4 → 200 with instrumentation == [\"PIANO\", \"STRINGS\"], tempo_bpm 96 and version 3"
            - "Call 5 → 200 with catalog_status \"CATALOGED\", availability_status \"AVAILABLE\" and version 4"

      - name: tier_scale_media_and_term_range_rules_map_to_declared_errors
        claim_type: violation_to_error
        grounds:
          - validations[priority=27].tier_scale_allowed
          - validations[priority=28].term_within_tier_range
          - errors[ERR_SCALE_NOT_ALLOWED_FOR_TIER]
          - errors[ERR_TERM_OUTSIDE_TIER_RANGE]
        distinguishing_aspect: |
          The tier is deliberately narrow (NATIONAL only, 6–24 months) so all three of its guards fire
          on distinct calls: a scale outside allowed_scales, a media_type that disagrees with the tier,
          and a term outside the range — the last of which is only checked at quote time, so the
          out-of-range request is still created successfully before the quote refuses it.
        test_recipe:
          setup:
            - "ACTIVE agreement, CATALOGED work, tier FILM-NAT (base 600000, FILM, allowed_scales [NATIONAL], min_term 6, max_term 24) and one licensee with a 10000000 limit."
          setup_api_calls:
