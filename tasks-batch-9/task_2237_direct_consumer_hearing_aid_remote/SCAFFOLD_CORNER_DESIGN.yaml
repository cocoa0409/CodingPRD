            - "hop 4: GET /providers/${prov_f} returns data.booked_minutes_on_focus_date == 0 and data.utilization_pct == 0"

      - name: sm_order_payment_pending_auth_to_authorized
        claim_type: valid_transition
        grounds: [state_machines.DeviceOrder.payment_status.transitions.PENDING_AUTH_to_AUTHORIZED, "endpoints.POST /_payments/simulate"]
        distinguishing_aspect: "An AUTHORIZED simulation must move only the payment dimension and must move no cash: captured_cents stays 0 even though total_cents is 215995."
