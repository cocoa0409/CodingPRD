      - name: reassigning_the_incumbent_and_auto_assigning_an_empty_pool_are_rejected
        claim_type: violation_to_error
        grounds:
          - errors[ERR_ANALYST_ALREADY_ASSIGNED]
          - errors[ERR_NO_ELIGIBLE_ANALYST]
          - calculations.analyst_selection_ranking
          - state_machines.ExaminationRequest[ASSIGNED->ASSIGNED]
        distinguishing_aspect: "Reassignment is legal in general but a no-op reassignment to the analyst who already holds the ACTIVE Assignment is refused, so no self-superseding Assignment row is ever created; and auto-assign refuses with its own code when the eligibility filter empties the pool for a discipline nobody covers, rather than falling back to an ineligible analyst. Adding a qualified analyst afterwards makes the identical auto-assign call succeed with assignment_reason AUTO_BALANCED."
