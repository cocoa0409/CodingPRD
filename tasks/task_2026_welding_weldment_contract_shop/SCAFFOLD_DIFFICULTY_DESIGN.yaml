              as: QCManager
              captures: { pqr_id: $.data.id }
            - call: "POST /weld-shop/shops/${shop_id}/pqrs/${pqr_id}/approve"
              payload: {}
              as: QCManager
            - call: "POST /weld-shop/shops/${shop_id}/wps"
              payload: { wps_number: "WPS-6", revision: 1, pqr_id: "${pqr_id}", process: "SMAW", base_metal_spec: "A36", thickness_min_mm: 5, thickness_max_mm: 20 }
              as: QCManager
