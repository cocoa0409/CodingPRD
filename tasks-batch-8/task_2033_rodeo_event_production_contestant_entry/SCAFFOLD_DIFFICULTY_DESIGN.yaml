# =============================================================================
# Task 2033: §1.8 Scaffold Difficulty Design (Test Targeting Index)
# =============================================================================
scaffold_difficulty_design:
  - rule_id: dual_variant_calc
    instances:
      - name: payout_provisional_includes_recorded_vs_final_verified_only
        grounds: [calculations.purse_and_places, entities.Payout.fields.computed_variant, entities.RunResult.fields.status]
        distinguishing_aspect: "On identical stored data, the PROVISIONAL variant ranks RECORDED+VERIFIED results while the FINAL variant ranks VERIFIED only, so an unverified 90-point ride wins place 1 provisionally but disappears from the final placing."
        test_recipe:
          setup:
            - "Rodeo R in IN_PROGRESS with one BULL_RIDING event (go_rounds=1, entry_fee=2000, added_money=100000, slots=10, places=2); purse = 100000 + 4x1160 = 104640; go-round pool 73248; average pool 31392"
            - "Four contestants A,B,C,D all DRAWN into performance P with animals"
            - "Results: A=85 VERIFIED, B=80 VERIFIED, C=75 VERIFIED, D=90 RECORDED (unverified)"
          setup_api_calls:
            - { call: "POST /api/rodeos", payload: { name: "Flagstaff Pro Rodeo", city: "Flagstaff", entries_close_at: "2026-08-10T00:00:00Z" }, as: CommitteeAdmin, captures: { r_id: $.data.id } }
            - { call: "POST /api/rodeo-events", payload: { rodeo_id: "${r_id}", event_code: BULL_RIDING, go_rounds: 1, entry_fee_cents: 2000, added_money_cents: 100000, per_performance_slots: 10, payout_places: 2 }, as: CommitteeAdmin, captures: { ev_id: $.data.id, ev_v: $.data.version } }
            - { call: "POST /api/performances", payload: { rodeo_id: "${r_id}", label: "Friday Night", arena: "Main", starts_at: "2026-08-14T19:00:00Z", ends_at: "2026-08-14T22:00:00Z", arena_capacity: 500 }, as: CommitteeAdmin, captures: { p_id: $.data.id } }
            - { call: "POST /api/rodeos/${r_id}/transition", payload: { action: OPEN_ENTRIES }, as: CommitteeAdmin }
            - { call: "POST /api/contestants", payload: { card_number: "PRCA-101", full_name: "Rider A" }, as: EntryOffice, captures: { c_a: $.data.id } }
            - { call: "POST /api/contestants", payload: { card_number: "PRCA-102", full_name: "Rider B" }, as: EntryOffice, captures: { c_b: $.data.id } }
            - { call: "POST /api/contestants", payload: { card_number: "PRCA-103", full_name: "Rider C" }, as: EntryOffice, captures: { c_c: $.data.id } }
            - { call: "POST /api/contestants", payload: { card_number: "PRCA-104", full_name: "Rider D" }, as: EntryOffice, captures: { c_d: $.data.id } }
            - { call: "POST /api/entries", payload: { contestant_id: "${c_a}", rodeo_event_id: "${ev_id}" }, as: EntryOffice, captures: { e_a: $.data.id } }
            - { call: "POST /api/entries", payload: { contestant_id: "${c_b}", rodeo_event_id: "${ev_id}" }, as: EntryOffice, captures: { e_b: $.data.id } }
            - { call: "POST /api/entries", payload: { contestant_id: "${c_c}", rodeo_event_id: "${ev_id}" }, as: EntryOffice, captures: { e_c: $.data.id } }
            - { call: "POST /api/entries", payload: { contestant_id: "${c_d}", rodeo_event_id: "${ev_id}" }, as: EntryOffice, captures: { e_d: $.data.id } }
            - { call: "POST /api/stock-contracts", payload: { rodeo_id: "${r_id}", contractor_name: "Bar None Ranch", day_rate_cents: 50000, per_out_fee_cents: 4000 }, as: CommitteeAdmin, captures: { k_id: $.data.id } }
            - { call: "POST /api/stock-contracts/${k_id}/transition", payload: { action: ACTIVATE }, as: CommitteeAdmin }
            - { call: "POST /api/stock-animals", payload: { contract_id: "${k_id}", tag_number: "A100", event_code: BULL_RIDING }, as: CommitteeAdmin }
            - { call: "POST /api/stock-animals", payload: { contract_id: "${k_id}", tag_number: "A200", event_code: BULL_RIDING }, as: CommitteeAdmin }
            - { call: "POST /api/stock-animals", payload: { contract_id: "${k_id}", tag_number: "A300", event_code: BULL_RIDING }, as: CommitteeAdmin }
            - { call: "POST /api/stock-animals", payload: { contract_id: "${k_id}", tag_number: "A400", event_code: BULL_RIDING }, as: CommitteeAdmin }
            - { call: "POST /api/rodeos/${r_id}/transition", payload: { action: LOCK_DRAW }, as: CommitteeAdmin }
            - { call: "POST /api/rodeo-events/${ev_id}/draws", payload: { go_round_number: 1, expected_rodeo_event_version: "${ev_v}" }, as: CommitteeAdmin }
            - { call: "POST /api/judges", payload: { card_number: "J-1", full_name: "Judge One", certification: PRCA_GOLD }, as: CommitteeAdmin, captures: { j_id: $.data.id } }
            - { call: "POST /api/judge-assignments", payload: { judge_id: "${j_id}", performance_id: "${p_id}", position: ARENA_1 }, as: CommitteeAdmin }
            - { call: "POST /api/rodeos/${r_id}/transition", payload: { action: START_RODEO }, as: CommitteeAdmin }
            - { call: "GET /api/draw-assignments", payload: { entry_id: "${e_a}" }, as: CommitteeAdmin, captures: { da_a: "$.data[0].id" } }
            - { call: "GET /api/draw-assignments", payload: { entry_id: "${e_b}" }, as: CommitteeAdmin, captures: { da_b: "$.data[0].id" } }
            - { call: "GET /api/draw-assignments", payload: { entry_id: "${e_c}" }, as: CommitteeAdmin, captures: { da_c: "$.data[0].id" } }
            - { call: "GET /api/draw-assignments", payload: { entry_id: "${e_d}" }, as: CommitteeAdmin, captures: { da_d: "$.data[0].id" } }
            - { call: "POST /api/run-results", payload: { draw_assignment_id: "${da_a}", judge_1_score: 43, judge_2_score: 42, qualified_flag: true }, as: Judge, as_user_id: "${j_id}", captures: { rr_a: $.data.id } }
            - { call: "POST /api/run-results", payload: { draw_assignment_id: "${da_b}", judge_1_score: 40, judge_2_score: 40, qualified_flag: true }, as: Judge, as_user_id: "${j_id}", captures: { rr_b: $.data.id } }
            - { call: "POST /api/run-results", payload: { draw_assignment_id: "${da_c}", judge_1_score: 38, judge_2_score: 37, qualified_flag: true }, as: Judge, as_user_id: "${j_id}", captures: { rr_c: $.data.id } }
            - { call: "POST /api/run-results", payload: { draw_assignment_id: "${da_d}", judge_1_score: 45, judge_2_score: 45, qualified_flag: true }, as: Judge, as_user_id: "${j_id}", captures: { rr_d: $.data.id } }
            - { call: "POST /api/run-results/${rr_a}/transition", payload: { action: VERIFY }, as: CommitteeAdmin }
            - { call: "POST /api/run-results/${rr_b}/transition", payload: { action: VERIFY }, as: CommitteeAdmin }
            - { call: "POST /api/run-results/${rr_c}/transition", payload: { action: VERIFY }, as: CommitteeAdmin }
          trigger:
            - { call: "POST /api/payouts/compute", payload: { rodeo_event_id: "${ev_id}", variant: PROVISIONAL }, as: CommitteeAdmin, captures: { pay_id: $.data.id } }
            - { call: "POST /api/payouts/compute", payload: { rodeo_event_id: "${ev_id}", variant: FINAL }, as: CommitteeAdmin }
          assert:
            - "PROVISIONAL compute: Payout.purse_cents == 104640 and place_lines for GO_ROUND_1 are [place1 contestant ${c_d} amount 43949 tied_count 1, place2 contestant ${c_a} amount 29299 tied_count 1]"
            - "PROVISIONAL compute: AVERAGE lines are [place1 ${c_d} 18835, place2 ${c_a} 12557]"
            - "FINAL compute on the same data: GO_ROUND_1 lines are [place1 ${c_a} 43949, place2 ${c_b} 29299] and ${c_d} appears in no line"
            - "FINAL compute: AVERAGE lines are [place1 ${c_a} 18835, place2 ${c_b} 12557]"

      - name: contractor_settlement_day_rate_vs_per_out_basis
        grounds: [calculations.contractor_settlement, entities.StockContract.fields.settlement_basis]
        distinguishing_aspect: "Two valid contractor billing algorithms (day_rate x performance days vs per_out_fee x completed outs) produce different totals for identical contract data (100000 vs 12000); the scaffold pins max() with tie to DAY_RATE."
        test_recipe:
          setup:
            - "Rodeo with two performances on distinct UTC dates (2026-08-14 and 2026-08-15), one BULL_RIDING event (go_rounds=1, fee=2000, added=0, slots=10, places=1)"
            - "Contract: day_rate_cents=50000, per_out_fee_cents=4000, ACTIVE, with 3 BULL_RIDING animals; 3 contestants DRAWN and all 3 results VERIFIED (3 completed outs)"
            - "Rodeo driven to SETTLED"
          setup_api_calls:
            - { call: "POST /api/rodeos", payload: { name: "Prescott Frontier Days", city: "Prescott", entries_close_at: "2026-08-10T00:00:00Z" }, as: CommitteeAdmin, captures: { r_id: $.data.id } }
            - { call: "POST /api/rodeo-events", payload: { rodeo_id: "${r_id}", event_code: BULL_RIDING, go_rounds: 1, entry_fee_cents: 2000, added_money_cents: 0, per_performance_slots: 10, payout_places: 1 }, as: CommitteeAdmin, captures: { ev_id: $.data.id, ev_v: $.data.version } }
            - { call: "POST /api/performances", payload: { rodeo_id: "${r_id}", label: "Day 1", arena: "Main", starts_at: "2026-08-14T19:00:00Z", ends_at: "2026-08-14T22:00:00Z", arena_capacity: 500 }, as: CommitteeAdmin, captures: { p1_id: $.data.id } }
            - { call: "POST /api/performances", payload: { rodeo_id: "${r_id}", label: "Day 2", arena: "Main", starts_at: "2026-08-15T14:00:00Z", ends_at: "2026-08-15T17:00:00Z", arena_capacity: 500 }, as: CommitteeAdmin, captures: { p2_id: $.data.id } }
            - { call: "POST /api/rodeos/${r_id}/transition", payload: { action: OPEN_ENTRIES }, as: CommitteeAdmin }
            - { call: "POST /api/contestants", payload: { card_number: "PRCA-201", full_name: "Rider E" }, as: EntryOffice, captures: { c_e: $.data.id } }
            - { call: "POST /api/contestants", payload: { card_number: "PRCA-202", full_name: "Rider F" }, as: EntryOffice, captures: { c_f: $.data.id } }
            - { call: "POST /api/contestants", payload: { card_number: "PRCA-203", full_name: "Rider G" }, as: EntryOffice, captures: { c_g: $.data.id } }
            - { call: "POST /api/entries", payload: { contestant_id: "${c_e}", rodeo_event_id: "${ev_id}" }, as: EntryOffice, captures: { e_e: $.data.id } }
            - { call: "POST /api/entries", payload: { contestant_id: "${c_f}", rodeo_event_id: "${ev_id}" }, as: EntryOffice, captures: { e_f: $.data.id } }
            - { call: "POST /api/entries", payload: { contestant_id: "${c_g}", rodeo_event_id: "${ev_id}" }, as: EntryOffice, captures: { e_g: $.data.id } }
            - { call: "POST /api/stock-contracts", payload: { rodeo_id: "${r_id}", contractor_name: "C5 Rodeo Co", day_rate_cents: 50000, per_out_fee_cents: 4000 }, as: CommitteeAdmin, captures: { k_id: $.data.id } }
            - { call: "POST /api/stock-contracts/${k_id}/transition", payload: { action: ACTIVATE }, as: CommitteeAdmin }
            - { call: "POST /api/stock-animals", payload: { contract_id: "${k_id}", tag_number: "B100", event_code: BULL_RIDING }, as: CommitteeAdmin }
            - { call: "POST /api/stock-animals", payload: { contract_id: "${k_id}", tag_number: "B200", event_code: BULL_RIDING }, as: CommitteeAdmin }
            - { call: "POST /api/stock-animals", payload: { contract_id: "${k_id}", tag_number: "B300", event_code: BULL_RIDING }, as: CommitteeAdmin }
            - { call: "POST /api/rodeos/${r_id}/transition", payload: { action: LOCK_DRAW }, as: CommitteeAdmin }
            - { call: "POST /api/rodeo-events/${ev_id}/draws", payload: { go_round_number: 1, expected_rodeo_event_version: "${ev_v}" }, as: CommitteeAdmin }
            - { call: "POST /api/judges", payload: { card_number: "J-2", full_name: "Judge Two", certification: PRCA_CARD }, as: CommitteeAdmin, captures: { j_id: $.data.id } }
            - { call: "POST /api/judge-assignments", payload: { judge_id: "${j_id}", performance_id: "${p1_id}", position: ARENA_1 }, as: CommitteeAdmin }
            - { call: "POST /api/rodeos/${r_id}/transition", payload: { action: START_RODEO }, as: CommitteeAdmin }
            - { call: "GET /api/draw-assignments", payload: { entry_id: "${e_e}" }, as: CommitteeAdmin, captures: { da_e: "$.data[0].id" } }
            - { call: "GET /api/draw-assignments", payload: { entry_id: "${e_f}" }, as: CommitteeAdmin, captures: { da_f: "$.data[0].id" } }
            - { call: "GET /api/draw-assignments", payload: { entry_id: "${e_g}" }, as: CommitteeAdmin, captures: { da_g: "$.data[0].id" } }
            - { call: "POST /api/run-results", payload: { draw_assignment_id: "${da_e}", judge_1_score: 42, judge_2_score: 40, qualified_flag: true }, as: Judge, as_user_id: "${j_id}", captures: { rr_e: $.data.id } }
            - { call: "POST /api/run-results", payload: { draw_assignment_id: "${da_f}", judge_1_score: 40, judge_2_score: 40, qualified_flag: true }, as: Judge, as_user_id: "${j_id}", captures: { rr_f: $.data.id } }
            - { call: "POST /api/run-results", payload: { draw_assignment_id: "${da_g}", judge_1_score: 38, judge_2_score: 38, qualified_flag: true }, as: Judge, as_user_id: "${j_id}", captures: { rr_g: $.data.id } }
            - { call: "POST /api/run-results/${rr_e}/transition", payload: { action: VERIFY }, as: CommitteeAdmin }
            - { call: "POST /api/run-results/${rr_f}/transition", payload: { action: VERIFY }, as: CommitteeAdmin }
            - { call: "POST /api/run-results/${rr_g}/transition", payload: { action: VERIFY }, as: CommitteeAdmin }
            - { call: "POST /api/performances/${p1_id}/transition", payload: { action: COMPLETE_PERFORMANCE }, as: CommitteeAdmin }
            - { call: "POST /api/performances/${p2_id}/transition", payload: { action: COMPLETE_PERFORMANCE }, as: CommitteeAdmin }
            - { call: "POST /api/rodeos/${r_id}/transition", payload: { action: COMPLETE_RODEO }, as: CommitteeAdmin }
            - { call: "POST /api/payouts/compute", payload: { rodeo_event_id: "${ev_id}", variant: FINAL }, as: CommitteeAdmin, captures: { pay_id: $.data.id } }
            - { call: "POST /api/payouts/${pay_id}/transition", payload: { action: FINALIZE }, as: CommitteeAdmin }
          trigger:
            - { call: "POST /api/rodeos/${r_id}/transition", payload: { action: SETTLE_RODEO }, as: CommitteeAdmin }
            - { call: "GET /api/stock-contracts/${k_id}", payload: {}, as: CommitteeAdmin }
          assert:
            - "StockContract.day_rate_total_cents == 100000 (50000 x 2 distinct performance days)"
            - "StockContract.per_out_total_cents == 12000 (4000 x 3 completed outs)"
            - "StockContract.settlement_cents == 100000 and settlement_basis == DAY_RATE (max of the two divergent bases)"
            - "StockContract.status == SETTLED and Payout.status == DISBURSED"

  - rule_id: combinatorial_formula
    instances:
      - name: payout_places_tiered_with_two_way_tie_split
        grounds: [calculations.purse_and_places]
        distinguishing_aspect: "Mode (a): pool x tiered place schedule x tie count interacts non-linearly — a 2-way tie at place 1 pools the 60% and 40% tier amounts (43949+29299=73248) and splits them equally, so both tied contestants receive 36624 instead of either tier amount."
        test_recipe:
          setup:
            - "Rodeo IN_PROGRESS, one BULL_RIDING event (go_rounds=1, fee=2000, added=100000, slots=10, places=2); purse 104640; go-round pool 73248; average pool 31392"
            - "Four entries DRAWN; all four results VERIFIED: A=85, D=85, B=80, C=75 (A and D tie at the top)"
          setup_api_calls:
            - { call: "POST /api/rodeos", payload: { name: "Cheyenne Frontier", city: "Cheyenne", entries_close_at: "2026-08-10T00:00:00Z" }, as: CommitteeAdmin, captures: { r_id: $.data.id } }
            - { call: "POST /api/rodeo-events", payload: { rodeo_id: "${r_id}", event_code: BULL_RIDING, go_rounds: 1, entry_fee_cents: 2000, added_money_cents: 100000, per_performance_slots: 10, payout_places: 2 }, as: CommitteeAdmin, captures: { ev_id: $.data.id, ev_v: $.data.version } }
            - { call: "POST /api/performances", payload: { rodeo_id: "${r_id}", label: "Friday Night", arena: "Main", starts_at: "2026-08-14T19:00:00Z", ends_at: "2026-08-14T22:00:00Z", arena_capacity: 500 }, as: CommitteeAdmin, captures: { p_id: $.data.id } }
            - { call: "POST /api/rodeos/${r_id}/transition", payload: { action: OPEN_ENTRIES }, as: CommitteeAdmin }
            - { call: "POST /api/contestants", payload: { card_number: "PRCA-301", full_name: "Rider A3" }, as: EntryOffice, captures: { c_a: $.data.id } }
            - { call: "POST /api/contestants", payload: { card_number: "PRCA-302", full_name: "Rider B3" }, as: EntryOffice, captures: { c_b: $.data.id } }
            - { call: "POST /api/contestants", payload: { card_number: "PRCA-303", full_name: "Rider C3" }, as: EntryOffice, captures: { c_c: $.data.id } }
            - { call: "POST /api/contestants", payload: { card_number: "PRCA-304", full_name: "Rider D3" }, as: EntryOffice, captures: { c_d: $.data.id } }
            - { call: "POST /api/entries", payload: { contestant_id: "${c_a}", rodeo_event_id: "${ev_id}" }, as: EntryOffice, captures: { e_a: $.data.id } }
            - { call: "POST /api/entries", payload: { contestant_id: "${c_b}", rodeo_event_id: "${ev_id}" }, as: EntryOffice, captures: { e_b: $.data.id } }
            - { call: "POST /api/entries", payload: { contestant_id: "${c_c}", rodeo_event_id: "${ev_id}" }, as: EntryOffice, captures: { e_c: $.data.id } }
            - { call: "POST /api/entries", payload: { contestant_id: "${c_d}", rodeo_event_id: "${ev_id}" }, as: EntryOffice, captures: { e_d: $.data.id } }
            - { call: "POST /api/stock-contracts", payload: { rodeo_id: "${r_id}", contractor_name: "Bar None Ranch", day_rate_cents: 50000, per_out_fee_cents: 4000 }, as: CommitteeAdmin, captures: { k_id: $.data.id } }
            - { call: "POST /api/stock-contracts/${k_id}/transition", payload: { action: ACTIVATE }, as: CommitteeAdmin }
            - { call: "POST /api/stock-animals", payload: { contract_id: "${k_id}", tag_number: "C100", event_code: BULL_RIDING }, as: CommitteeAdmin }
            - { call: "POST /api/stock-animals", payload: { contract_id: "${k_id}", tag_number: "C200", event_code: BULL_RIDING }, as: CommitteeAdmin }
            - { call: "POST /api/stock-animals", payload: { contract_id: "${k_id}", tag_number: "C300", event_code: BULL_RIDING }, as: CommitteeAdmin }
            - { call: "POST /api/stock-animals", payload: { contract_id: "${k_id}", tag_number: "C400", event_code: BULL_RIDING }, as: CommitteeAdmin }
            - { call: "POST /api/rodeos/${r_id}/transition", payload: { action: LOCK_DRAW }, as: CommitteeAdmin }
            - { call: "POST /api/rodeo-events/${ev_id}/draws", payload: { go_round_number: 1, expected_rodeo_event_version: "${ev_v}" }, as: CommitteeAdmin }
            - { call: "POST /api/judges", payload: { card_number: "J-3", full_name: "Judge Three", certification: PRCA_GOLD }, as: CommitteeAdmin, captures: { j_id: $.data.id } }
            - { call: "POST /api/judge-assignments", payload: { judge_id: "${j_id}", performance_id: "${p_id}", position: ARENA_1 }, as: CommitteeAdmin }
