          - calculations.production_dates
          - calculations.rental_quote
          - entities.Production.fields.long_run
        distinguishing_aspect: |
          Duration metric through POST /productions/{id}/confirm: run_weeks uses floor(days/7)
          with >= threshold semantics — a 55-day run (closing 2026-10-25) yields run_weeks 7 and
          long_run FALSE (quote 10000), while a 56-day run (closing 2026-10-26) yields run_weeks
