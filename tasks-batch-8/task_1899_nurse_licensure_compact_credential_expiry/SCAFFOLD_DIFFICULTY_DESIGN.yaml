            - "Nurse.${n_id}.open_encumbrance_count == 1 and credential_posture == 'PRACTICE_RESTRICTED' (hop 2, caused by the adjudication)"
            - "ShiftAssignment.${sh_id}.status == 'AUTO_CANCELLED' with cancel_reason == 'POSTURE_PRACTICE_RESTRICTED' (hop 3, caused by the posture flip); Unit.${unit_id}.scheduled_hours_total == 0.0 (hop 4)"
            - "CredentialPacket.${pkt_id}.status == 'VOIDED' (hop 3 sibling effect on the packet aggregate)"

  # ---------------------------------------------------------------------------
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: shift_create_state_beats_safety
        grounds:
          - validations[priority=5]
          - validations[priority=6]
          - errors[ERR_NURSE_NOT_CLEAR]
          - errors[ERR_UNIT_CERT_REQUIREMENT_UNMET]
        distinguishing_aspect: |
          Category pair state vs business_safety: the request violates BOTH the posture state gate
          (nurse SCHEDULING_SUSPENDED after license expiry sweep, priority 5) AND the unit ACLS
          safety requirement (priority 6); the state error ERR_NURSE_NOT_CLEAR MUST win.
        test_recipe:
          setup:
            - "Clock 2026-08-01; mandatory ROLLING requirement; unit ICU requires ACLS; nurse Sven ACTIVE with AZ license expiring 2026-08-20, BLS 2027-03-31, CURRENT competency, NO ACLS cert; clock moves to 2026-08-21 and the sweep expires the license, flipping posture to SCHEDULING_SUSPENDED."
          setup_api_calls:
