    side_effects: ["sets liens_status = CLEAN"]
  - method: GET
    path: "/yacht/vessels/{id}"
    description: "Fetch one vessel"
    roles: [PlatformAdmin, ListingAgent, SellingAgent, ClosingOfficer, EscrowOfficer]
    code: 200
    input: []
    output: Vessel
    side_effects: []
  - method: PUT
    path: "/yacht/vessels/{id}"
    description: "Update vessel descriptive fields"
    roles: [PlatformAdmin, ListingAgent]
    code: 200
    input: ['make?', 'model?', 'current_location_state_code?', 'state_title_no?', 'uscg_official_no?']
    output: Vessel
    side_effects: ["increments vessel.version by 1"]
  - method: GET
    path: "/yacht/vessels/{id}/liens"
    description: "List liens recorded against a vessel"
    roles: [PlatformAdmin, ListingAgent, SellingAgent, ClosingOfficer, EscrowOfficer]
    code: 200
    input: []
    output: LienRecord[]
    side_effects: []
  - method: POST
    path: "/yacht/vessels/{id}/liens"
    description: "Record a discovered lien on the vessel (lien search result)"
    roles: [ListingAgent, ClosingOfficer]
    code: 201
    input: [lienholder_name, instrument_type, amount_cents, priority_rank]
