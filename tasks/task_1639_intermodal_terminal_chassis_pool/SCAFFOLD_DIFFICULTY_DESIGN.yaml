# =============================================================================
# §1.8 Scaffold Difficulty Design — task_1639_intermodal_terminal_chassis_pool
# Nine Difficulty Rules × ≥2 instances each.
# =============================================================================

scaffold_difficulty_design:

  # ---------------------------------------------------------------------------
  # Rule 1 — Dual-variant calculations across different entity domains
  # ---------------------------------------------------------------------------
  - rule_id: dual_variant_calc
    instances:
      - name: per_diem_provisional_vs_final_divergence
        grounds:
          - calculations.per_diem_charge
          - entities.Container.fields.free_time_expires_at
          - entities.BillingLedgerEntry.fields.amount_cents
        distinguishing_aspect: |
          Container-side accrual: same container, same terminal, same clock, but the
          provisional variant (run_ops snapshot at evaluation_time=T1) and the final
          variant (OUT GateTransaction completion at evaluation_time=T2>T1) produce
          different amount_cents on BillingLedgerEntry. This is a Container-domain
          calculation, distinct from the Carrier-domain flip_fee_credit variant below.
        test_recipe:
          setup:
            - "Terminal T1 with gate_free_hours=48, per_diem_rate_cents=15000, storage_rate_cents=8000, flip_fee_cents=5000, max_stack_height=3, yard_slot_count=20, rail_cutoff_minutes_before_departure=60"
            - "YardSlot S1 in T1 (row=A, slot_code=A-01-1, tier_max=3, status=EMPTY)"
            - "Train TR1 in T1 scheduled_departure_utc=2026-08-10T12:00:00Z, marked ARRIVED"
            - "Container C1 on TR1, grounded at clock 2026-08-01T00:00:00Z (free_time_expires_at = 2026-08-03T00:00:00Z)"
            - "Server clock advanced to 2026-08-05T12:00:00Z (60 hours past free-time expiry = 3 days)"
            - "run_ops executed at that clock to produce a provisional PER_DIEM ledger entry"
          setup_api_calls:
            - call: "POST /terminals"
              payload: { terminal_code: "BNSF-LA", rail_cutoff_minutes_before_departure: 60, gate_free_hours: 48, per_diem_rate_cents: 15000, storage_rate_cents: 8000, flip_fee_cents: 5000, max_stack_height: 3, yard_slot_count: 20 }
              as: TerminalManager
              captures: {tid: $.data.id}
            - call: "POST /terminals/${tid}/slots"
              payload: { slot_code: "A-01-1", row: "A", tier_max: 3 }
              as: YardPlanner
            - call: "POST /terminals/${tid}/trains"
              payload: { train_symbol: "Z-ALTCHI", scheduled_departure_utc: "2026-08-10T12:00:00Z" }
              as: RailCoordinator
              captures: {trid: $.data.id}
            - call: "POST /terminals/${tid}/trains/${trid}/mark_arrived"
              payload: {}
              as: RailCoordinator
            - call: "POST /terminals/${tid}/containers"
              payload: { container_number: "BMOU1234567", iso_type: "40FT", planned_train_id: "${trid}" }
              as: RailCoordinator
              captures: {cid: $.data.id}
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: TerminalManager
            - call: "GET /terminals/${tid}"
              payload: {}
              as: TerminalManager
              captures: {t_v: $.data.version}
            - call: "POST /terminals/${tid}/containers/${cid}/ground"
              payload: { expected_terminal_version: "${t_v}" }
              as: YardPlanner
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-05T12:00:00Z" }
              as: TerminalManager
            - call: "POST /terminals/${tid}/run_ops"
              payload: {}
              as: TerminalManager
          trigger:
            - call: "GET /terminals/${tid}/ledger"
              payload: {}
              as: BillingClerk
              captures: {provisional_amount: "$.data[0].amount_cents"}
          assert:
            - "BillingLedgerEntry (provisional PER_DIEM from run_ops at 2026-08-05T12:00:00Z) has amount_cents == 45000 (3 days × 15000 cents)"
            - "If the container is later out-gated at 2026-08-06T12:00:00Z (4 days past expiry), the final variant's amount would be 60000 — provisional and final differ by 15000 for identical container/terminal state"

      - name: flip_fee_membership_credit_vs_ledger_charge
        grounds:
          - calculations.flip_fee_charge
          - entities.ChassisMembership.fields.flip_fee_credit_cents
          - entities.BillingLedgerEntry.fields.amount_cents
        distinguishing_aspect: |
          Carrier-side fiscal: when a carrier's ChassisMembership has
          flip_fee_credit_cents >= terminal.flip_fee_cents, the flip-fee variant
          debits the membership credit and creates NO BillingLedgerEntry; when the
          credit is insufficient, the variant creates a BillingLedgerEntry for the
          full amount and leaves the credit unchanged. Same out-gate action, two
          divergent fiscal outcomes on the Carrier aggregate. This is a
          Carrier/ChassisMembership-domain calculation, distinct from the
          Container-domain per-diem variant above.
        test_recipe:
          setup:
            - "Terminal T1 (gate_free_hours=48, per_diem_rate_cents=15000, storage_rate_cents=8000, flip_fee_cents=5000, max_stack_height=3, yard_slot_count=20, rail_cutoff_minutes_before_departure=60)"
            - "ChassisPool P1, Chassis CH1 (AVAILABLE, ROADABLE)"
            - "Carrier CAR_A with ChassisMembership M_A loaded with flip_fee_credit_cents=10000 (>= 5000)"
            - "Carrier CAR_B with ChassisMembership M_B loaded with flip_fee_credit_cents=0 (< 5000)"
            - "Container C_A grounded for CAR_A booking; Container C_B grounded for CAR_B booking"
            - "Both containers ON_GROUND; both carriers have ACTIVE memberships"
            - "Appointments, check-ins, chassis reservations, and transactions staged for both"
          setup_api_calls:
            - call: "POST /terminals"
              payload: { terminal_code: "BNSF-LA", rail_cutoff_minutes_before_departure: 60, gate_free_hours: 48, per_diem_rate_cents: 15000, storage_rate_cents: 8000, flip_fee_cents: 5000, max_stack_height: 3, yard_slot_count: 20 }
              as: TerminalManager
              captures: {tid: $.data.id}
            - call: "POST /terminals/${tid}/slots"
              payload: { slot_code: "A-01-1", row: "A", tier_max: 3 }
              as: YardPlanner
            - call: "POST /terminals/${tid}/slots"
              payload: { slot_code: "A-02-1", row: "A", tier_max: 3 }
              as: YardPlanner
            - call: "POST /terminals/${tid}/pools"
              payload: { pool_code: "UP-POOL-A" }
              as: PoolAdministrator
              captures: {pid: $.data.id}
            - call: "POST /terminals/${tid}/pools/${pid}/chassis"
              payload: { chassis_number: "CH-001" }
              as: PoolAdministrator
              captures: {ch1: $.data.id}
            - call: "POST /terminals/${tid}/pools/${pid}/chassis"
              payload: { chassis_number: "CH-002" }
              as: PoolAdministrator
              captures: {ch2: $.data.id}
            - call: "POST /carriers"
              payload: { scac_code: "CARA", carrier_name: "Carrier A", billing_credit_limit_cents: 1000000 }
              as: TerminalManager
              captures: {car_a: $.data.id}
            - call: "POST /carriers"
              payload: { scac_code: "CARB", carrier_name: "Carrier B", billing_credit_limit_cents: 1000000 }
              as: TerminalManager
              captures: {car_b: $.data.id}
            - call: "POST /terminals/${tid}/pools/${pid}/memberships"
              payload: { carrier_id: "${car_a}" }
              as: PoolAdministrator
              captures: {m_a: $.data.id}
            - call: "POST /terminals/${tid}/pools/${pid}/memberships"
              payload: { carrier_id: "${car_b}" }
              as: PoolAdministrator
              captures: {m_b: $.data.id}
            - call: "POST /terminals/${tid}/pools/${pid}/memberships/${m_a}/load_flip_credit"
              payload: { credit_cents: 10000 }
              as: BillingClerk
            - call: "POST /terminals/${tid}/trains"
              payload: { train_symbol: "Z-ALTCHI", scheduled_departure_utc: "2026-08-10T12:00:00Z" }
              as: RailCoordinator
              captures: {trid: $.data.id}
            - call: "POST /terminals/${tid}/trains/${trid}/mark_arrived"
              payload: {}
              as: RailCoordinator
            - call: "POST /terminals/${tid}/containers"
              payload: { container_number: "CAAA0000001", iso_type: "40FT", planned_train_id: "${trid}" }
              as: RailCoordinator
              captures: {cid_a: $.data.id}
            - call: "POST /terminals/${tid}/containers"
              payload: { container_number: "CBBB0000002", iso_type: "40FT", planned_train_id: "${trid}" }
              as: RailCoordinator
              captures: {cid_b: $.data.id}
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: TerminalManager
            - call: "GET /terminals/${tid}"
              payload: {}
              as: TerminalManager
              captures: {t_v1: $.data.version}
            - call: "POST /terminals/${tid}/containers/${cid_a}/ground"
              payload: { expected_terminal_version: "${t_v1}" }
              as: YardPlanner
            - call: "GET /terminals/${tid}"
              payload: {}
              as: TerminalManager
              captures: {t_v2: $.data.version}
            - call: "POST /terminals/${tid}/containers/${cid_b}/ground"
              payload: { expected_terminal_version: "${t_v2}" }
              as: YardPlanner
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-02T10:00:00Z" }
              as: TerminalManager
            - call: "POST /terminals/${tid}/appointments"
              payload: { carrier_id: "${car_a}", container_id: "${cid_a}", direction: "OUT", window_start_utc: "2026-08-02T09:00:00Z", window_end_utc: "2026-08-02T11:00:00Z" }
              as: GateSupervisor
              captures: {appt_a: $.data.id}
            - call: "POST /terminals/${tid}/appointments"
              payload: { carrier_id: "${car_b}", container_id: "${cid_b}", direction: "OUT", window_start_utc: "2026-08-02T09:00:00Z", window_end_utc: "2026-08-02T11:00:00Z" }
              as: GateSupervisor
              captures: {appt_b: $.data.id}
            - call: "POST /terminals/${tid}/appointments/${appt_a}/check_in"
              payload: { driver_id: "DRV-A" }
              as: GateClerk
            - call: "POST /terminals/${tid}/appointments/${appt_b}/check_in"
              payload: { driver_id: "DRV-B" }
              as: GateClerk
            - call: "GET /terminals/${tid}/pools/${pid}"
              payload: {}
              as: PoolAdministrator
              captures: {p_v: $.data.version}
            - call: "POST /terminals/${tid}/pools/${pid}/chassis/${ch1}/reserve"
              payload: { appointment_id: "${appt_a}", expected_pool_version: "${p_v}" }
              as: GateSupervisor
            - call: "GET /terminals/${tid}/pools/${pid}"
              payload: {}
              as: PoolAdministrator
              captures: {p_v2: $.data.version}
            - call: "POST /terminals/${tid}/pools/${pid}/chassis/${ch2}/reserve"
              payload: { appointment_id: "${appt_b}", expected_pool_version: "${p_v2}" }
              as: GateSupervisor
            - call: "POST /terminals/${tid}/transactions"
              payload: { appointment_id: "${appt_a}", driver_id: "DRV-A", gate_lane: "L1", chassis_id: "${ch1}" }
              as: GateClerk
              captures: {tx_a: $.data.id}
            - call: "POST /terminals/${tid}/transactions"
              payload: { appointment_id: "${appt_b}", driver_id: "DRV-B", gate_lane: "L2", chassis_id: "${ch2}" }
              as: GateClerk
              captures: {tx_b: $.data.id}
          trigger:
            - call: "POST /terminals/${tid}/transactions/${tx_a}/complete"
              payload: {}
              as: GateClerk
            - call: "POST /terminals/${tid}/transactions/${tx_b}/complete"
              payload: {}
              as: GateClerk
            - call: "GET /terminals/${tid}/ledger"
              payload: {}
              as: BillingClerk
              captures: {ledger_rows: $.data}
            - call: "GET /terminals/${tid}/pools/${pid}/memberships/${m_a}"
              payload: {}
              as: PoolAdministrator
              captures: {m_a_credit_after: $.data.flip_fee_credit_cents}
            - call: "GET /terminals/${tid}/pools/${pid}/memberships/${m_b}"
              payload: {}
              as: PoolAdministrator
              captures: {m_b_credit_after: $.data.flip_fee_credit_cents}
          assert:
            - "Carrier A: ChassisMembership.${m_a}.flip_fee_credit_cents == 5000 (10000 - 5000 debited)"
            - "Carrier A: NO FLIP_FEE BillingLedgerEntry exists where carrier_id == ${car_a}"
            - "Carrier B: ChassisMembership.${m_b}.flip_fee_credit_cents == 0 (unchanged)"
            - "Carrier B: FLIP_FEE BillingLedgerEntry exists where carrier_id == ${car_b} AND amount_cents == 5000"

  # ---------------------------------------------------------------------------
  # Rule 2 — Combinatorial formulas across different modes
  # ---------------------------------------------------------------------------
  - rule_id: combinatorial_formula
    instances:
      - name: per_diem_tiered_boundary_ceil
        grounds:
          - calculations.per_diem_charge
          - entities.BillingLedgerEntry.fields.amount_cents
        distinguishing_aspect: |
          Mode (a) — non-linear interaction: ceil() applied to (evaluation_time -
          free_time_expires_at)/86400 combined with conditional guard (days_overdue
          <= 0 short-circuits to 0) and tiered boundary (24h = 1 day vs 24h+1s = 2
          days). Three inputs (evaluation_time, free_time_expires_at, rate) with
          nested ceil/non-linear interaction.
        test_recipe:
          setup:
            - "Terminal T1 with gate_free_hours=24, per_diem_rate_cents=12000, storage_rate_cents=8000, flip_fee_cents=5000, max_stack_height=3, yard_slot_count=20, rail_cutoff_minutes_before_departure=60"
            - "YardSlot S1"
            - "Train TR1 ARRIVED"
            - "Container C1 grounded at 2026-08-01T00:00:00Z (free_time_expires_at = 2026-08-02T00:00:00Z)"
            - "Server clock advanced to 2026-08-03T00:00:01Z (24h+1s past free-time expiry)"
          setup_api_calls:
            - call: "POST /terminals"
              payload: { terminal_code: "BNSF-LA", rail_cutoff_minutes_before_departure: 60, gate_free_hours: 24, per_diem_rate_cents: 12000, storage_rate_cents: 8000, flip_fee_cents: 5000, max_stack_height: 3, yard_slot_count: 20 }
              as: TerminalManager
              captures: {tid: $.data.id}
            - call: "POST /terminals/${tid}/slots"
              payload: { slot_code: "A-01-1", row: "A", tier_max: 3 }
              as: YardPlanner
            - call: "POST /terminals/${tid}/trains"
              payload: { train_symbol: "Z-ALTCHI", scheduled_departure_utc: "2026-08-10T12:00:00Z" }
              as: RailCoordinator
              captures: {trid: $.data.id}
            - call: "POST /terminals/${tid}/trains/${trid}/mark_arrived"
              payload: {}
              as: RailCoordinator
            - call: "POST /terminals/${tid}/containers"
              payload: { container_number: "BMOU1234567", iso_type: "40FT", planned_train_id: "${trid}" }
              as: RailCoordinator
              captures: {cid: $.data.id}
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: TerminalManager
            - call: "GET /terminals/${tid}"
              payload: {}
              as: TerminalManager
              captures: {t_v: $.data.version}
            - call: "POST /terminals/${tid}/containers/${cid}/ground"
              payload: { expected_terminal_version: "${t_v}" }
              as: YardPlanner
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T00:00:01Z" }
              as: TerminalManager
          trigger:
            - call: "POST /terminals/${tid}/run_ops"
              payload: {}
              as: TerminalManager
            - call: "GET /terminals/${tid}/ledger"
              payload: {}
              as: BillingClerk
              captures: {per_diem_amt: "$.data[0].amount_cents"}
          assert:
            - "BillingLedgerEntry (PER_DIEM) has amount_cents == 24000 (2 days × 12000; 24h+1s rounds up via ceil to 2 days, NOT 1 day)"
            - "Boundary check: at exactly 2026-08-03T00:00:00Z (24h+0s) the same calculation would produce 12000 (1 day), demonstrating the ceil() step at the boundary"

      - name: flip_fee_credit_partial_debit_ordering
        grounds:
          - calculations.flip_fee_charge
          - entities.ChassisMembership.fields.flip_fee_credit_cents
          - entities.BillingLedgerEntry.fields.amount_cents
        distinguishing_aspect: |
          Mode (c) — circular-looking dependency pinned by evaluation order:
          flip_fee_charge decides between (i) debiting
          membership.flip_fee_credit_cents or (ii) creating a BillingLedgerEntry.
          The choice itself depends on comparing flip_fee_credit_cents to
          terminal.flip_fee_cents, but the membership's post-state also feeds back
          into the ChassisPool's fiscal view. The scaffold pins the order: (1)
          compute flip_fee_amount from terminal; (2) read membership credit; (3)
          branch; (4) write. This is NOT a tiered or rounding formula — it is a
          conditional-ordering formula, a different mode from per_diem's ceil()
          tiered structure.
        test_recipe:
          setup:
            - "Terminal T1 (flip_fee_cents=5000)"
            - "ChassisPool P1; Chassis CH1 AVAILABLE/ROADABLE"
            - "Carrier CAR with membership M loaded with flip_fee_credit_cents = 4999 (strictly less than flip_fee_cents)"
            - "Container C grounded; appointment OUT; checked in; chassis reserved; transaction pending"
          setup_api_calls:
            - call: "POST /terminals"
              payload: { terminal_code: "BNSF-LA", rail_cutoff_minutes_before_departure: 60, gate_free_hours: 48, per_diem_rate_cents: 15000, storage_rate_cents: 8000, flip_fee_cents: 5000, max_stack_height: 3, yard_slot_count: 20 }
              as: TerminalManager
              captures: {tid: $.data.id}
            - call: "POST /terminals/${tid}/slots"
              payload: { slot_code: "A-01-1", row: "A", tier_max: 3 }
              as: YardPlanner
            - call: "POST /terminals/${tid}/pools"
              payload: { pool_code: "UP-POOL-A" }
              as: PoolAdministrator
              captures: {pid: $.data.id}
            - call: "POST /terminals/${tid}/pools/${pid}/chassis"
              payload: { chassis_number: "CH-001" }
              as: PoolAdministrator
              captures: {ch1: $.data.id}
            - call: "POST /carriers"
              payload: { scac_code: "CARA", carrier_name: "Carrier A", billing_credit_limit_cents: 1000000 }
              as: TerminalManager
              captures: {car: $.data.id}
            - call: "POST /terminals/${tid}/pools/${pid}/memberships"
              payload: { carrier_id: "${car}" }
              as: PoolAdministrator
              captures: {mid: $.data.id}
            - call: "POST /terminals/${tid}/pools/${pid}/memberships/${mid}/load_flip_credit"
              payload: { credit_cents: 4999 }
              as: BillingClerk
            - call: "POST /terminals/${tid}/trains"
              payload: { train_symbol: "Z-ALTCHI", scheduled_departure_utc: "2026-08-10T12:00:00Z" }
              as: RailCoordinator
              captures: {trid: $.data.id}
            - call: "POST /terminals/${tid}/trains/${trid}/mark_arrived"
              payload: {}
              as: RailCoordinator
            - call: "POST /terminals/${tid}/containers"
              payload: { container_number: "BMOU1234567", iso_type: "40FT", planned_train_id: "${trid}" }
              as: RailCoordinator
              captures: {cid: $.data.id}
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: TerminalManager
            - call: "GET /terminals/${tid}"
              payload: {}
              as: TerminalManager
              captures: {t_v: $.data.version}
            - call: "POST /terminals/${tid}/containers/${cid}/ground"
              payload: { expected_terminal_version: "${t_v}" }
              as: YardPlanner
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-02T10:00:00Z" }
              as: TerminalManager
            - call: "POST /terminals/${tid}/appointments"
              payload: { carrier_id: "${car}", container_id: "${cid}", direction: "OUT", window_start_utc: "2026-08-02T09:00:00Z", window_end_utc: "2026-08-02T11:00:00Z" }
              as: GateSupervisor
              captures: {appt: $.data.id}
            - call: "POST /terminals/${tid}/appointments/${appt}/check_in"
              payload: { driver_id: "DRV-A" }
              as: GateClerk
            - call: "GET /terminals/${tid}/pools/${pid}"
              payload: {}
              as: PoolAdministrator
              captures: {p_v: $.data.version}
            - call: "POST /terminals/${tid}/pools/${pid}/chassis/${ch1}/reserve"
              payload: { appointment_id: "${appt}", expected_pool_version: "${p_v}" }
              as: GateSupervisor
            - call: "POST /terminals/${tid}/transactions"
              payload: { appointment_id: "${appt}", driver_id: "DRV-A", gate_lane: "L1", chassis_id: "${ch1}" }
              as: GateClerk
              captures: {tx: $.data.id}
          trigger:
            - call: "POST /terminals/${tid}/transactions/${tx}/complete"
              payload: {}
              as: GateClerk
            - call: "GET /terminals/${tid}/pools/${pid}/memberships/${mid}"
              payload: {}
              as: PoolAdministrator
              captures: {credit_after: $.data.flip_fee_credit_cents}
            - call: "GET /terminals/${tid}/ledger"
              payload: {}
              as: BillingClerk
              captures: {rows: $.data}
          assert:
            - "ChassisMembership.${mid}.flip_fee_credit_cents == 4999 (unchanged — 4999 < 5000, so credit branch not taken)"
            - "BillingLedgerEntry exists with entry_kind == FLIP_FEE AND amount_cents == 5000 AND carrier_id == ${car}"
            - "The conditional-ordering pin means partial debits do NOT occur — the branch is all-or-nothing"

  # ---------------------------------------------------------------------------
  # Rule 3 — Non-linear state-machine shape on different entities
  # ---------------------------------------------------------------------------
  - rule_id: non_linear_state_machine
    instances:
      - name: chassis_roadability_parallel_dimension
        grounds:
          - state_machines.Chassis
          - entities.Chassis.fields.roadability_status
          - entities.DamageInspection.fields.severity
        distinguishing_aspect: |
          Chassis carries TWO parallel state dimensions: status (AVAILABLE /
          RESERVED / OUT / MAINTENANCE / RETIRED) and roadability_status
          (ROADABLE / UNROADABLE) evolve independently. A MAJOR damage report
          flips roadability_status WITHOUT changing status; a RESERVED chassis
          hit by MAJOR damage transitions status: RESERVED -> AVAILABLE as a
          side effect of the roadability flip (cross-axis cascade).
        test_recipe:
          setup:
            - "Terminal, Pool, Chassis CH1, Carrier, Membership, Container, Appointment, Transaction — chassis RESERVED against a CHECKED_IN OUT appointment"
          setup_api_calls:
            - call: "POST /terminals"
              payload: { terminal_code: "BNSF-LA", rail_cutoff_minutes_before_departure: 60, gate_free_hours: 48, per_diem_rate_cents: 15000, storage_rate_cents: 8000, flip_fee_cents: 5000, max_stack_height: 3, yard_slot_count: 20 }
              as: TerminalManager
              captures: {tid: $.data.id}
            - call: "POST /terminals/${tid}/slots"
              payload: { slot_code: "A-01-1", row: "A", tier_max: 3 }
              as: YardPlanner
            - call: "POST /terminals/${tid}/pools"
              payload: { pool_code: "UP-POOL-A" }
              as: PoolAdministrator
              captures: {pid: $.data.id}
            - call: "POST /terminals/${tid}/pools/${pid}/chassis"
              payload: { chassis_number: "CH-001" }
              as: PoolAdministrator
              captures: {ch1: $.data.id}
            - call: "POST /carriers"
              payload: { scac_code: "CARA", carrier_name: "Carrier A", billing_credit_limit_cents: 1000000 }
              as: TerminalManager
              captures: {car: $.data.id}
            - call: "POST /terminals/${tid}/pools/${pid}/memberships"
              payload: { carrier_id: "${car}" }
              as: PoolAdministrator
            - call: "POST /terminals/${tid}/trains"
              payload: { train_symbol: "Z-ALTCHI", scheduled_departure_utc: "2026-08-10T12:00:00Z" }
