  # ===========================================================================
  # Section: endpoints (action / computed read / filtered list / conditional)
  # ===========================================================================
  - section: endpoints
    instances:
      - name: posture_report_returns_both_variants
        claim_type: computed_read
        grounds: ["endpoints['GET /api/assets/{id}/posture-report']", calculations.reasonable_measures_score]
        distinguishing_aspect: "The posture-report computed read surfaces BOTH score variants plus the per-measure breakdown (weight_points and points_effective per row)."
        test_recipe:
          setup: ["REGISTERED asset with one VERIFIED TECHNICAL measure (25) and one IMPLEMENTED PHYSICAL measure (9 operational / 0 documentary)"]
          setup_api_calls:
            - call: "POST /api/assets"
              payload: { title: "Report probe", description: "x", classification: "RESTRICTED", owner_department: "ENG", exposure_estimate_cents: 1000 }
              as: IPCounsel
              captures: { a_id: $.data.id }
            - call: "POST /api/assets/${a_id}/state"
              payload: { to_status: "REGISTERED" }
              as: IPCounsel
            - call: "POST /api/measures"
              payload: { asset_id: "${a_id}", measure_type: "TECHNICAL", title: "t", evidence_uri: "s3://ev/t.pdf" }
              as: SecurityOfficer
              captures: { m1: $.data.id }
            - call: "POST /api/measures/${m1}/state"
              payload: { to_status: "IMPLEMENTED" }
              as: SecurityOfficer
              as_user_id: "sec_officer_1"
            - call: "POST /api/measures/${m1}/state"
              payload: { to_status: "VERIFIED" }
              as: IPCounsel
              as_user_id: "counsel_1"
            - call: "POST /api/measures"
              payload: { asset_id: "${a_id}", measure_type: "PHYSICAL", title: "p", evidence_uri: "s3://ev/p.pdf" }
              as: SecurityOfficer
              captures: { m2: $.data.id }
            - call: "POST /api/measures/${m2}/state"
              payload: { to_status: "IMPLEMENTED" }
              as: SecurityOfficer
              as_user_id: "sec_officer_1"
          trigger:
            - call: "GET /api/assets/${a_id}/posture-report"
              as: SeniorCounsel
              captures: { rep_op: $.data.score_operational, rep_doc: $.data.score_documentary, rep_posture: $.data.protection_posture }
          assert:
            - "rep_op == 34 (25 + 15*0.6) and rep_doc == 25"
            - "rep_posture == DEFICIENT (34 < 40)"
            - "measures array has 2 entries with weight_points 25 and 15"

      - name: obligations_filtered_by_counterparty
        claim_type: filtered_list
        grounds: ["endpoints['GET /api/obligations']"]
        distinguishing_aspect: "GET /api/obligations?counterparty_id returns only obligations under that counterparty's NDAs (obligation tracking by counterparty), not obligations of other counterparties."
        test_recipe:
          setup: ["two counterparties each with an NDA carrying one obligation"]
          setup_api_calls:
            - call: "POST /api/counterparties"
              payload: { legal_name: "Alpha One", counterparty_type: "VENDOR" }
              as: IPCounsel
              captures: { cp1: $.data.id }
            - call: "POST /api/counterparties"
              payload: { legal_name: "Beta Two", counterparty_type: "PARTNER" }
              as: IPCounsel
              captures: { cp2: $.data.id }
            - call: "POST /api/ndas"
              payload: { counterparty_id: "${cp1}", template_version: "tA", governing_law: "ID", effective_date: "2026-01-01T00:00:00Z", expiry_date: "2027-01-01T00:00:00Z", survival_months: 3, classification_ceiling: "INTERNAL" }
              as: IPCounsel
              captures: { nda1: $.data.id }
            - call: "POST /api/ndas"
              payload: { counterparty_id: "${cp2}", template_version: "tB", governing_law: "ID", effective_date: "2026-01-01T00:00:00Z", expiry_date: "2027-01-01T00:00:00Z", survival_months: 3, classification_ceiling: "INTERNAL" }
              as: IPCounsel
              captures: { nda2: $.data.id }
            - call: "POST /api/obligations"
              payload: { nda_id: "${nda1}", obligation_type: "NON_DISCLOSURE" }
              as: IPCounsel
            - call: "POST /api/obligations"
              payload: { nda_id: "${nda2}", obligation_type: "NON_USE" }
              as: IPCounsel
          trigger:
            - call: "GET /api/obligations"
              payload: { counterparty_id: "${cp1}" }
              as: IPCounsel
          assert:
            - "response total_count == 1 and the single row's nda_id == ${nda1}"
            - "no row with nda_id == ${nda2} is present"

      - name: program_status_reflects_clock_and_policy
        claim_type: computed_read
        grounds: ["endpoints['GET /api/program/status']"]
        distinguishing_aspect: "Program status surfaces the logical clock default 2026-05-01T00:00:00Z and initial policy v1 before any mutation."
        test_recipe:
          setup: ["empty DB, no clock set"]
          setup_api_calls: []
          trigger:
            - call: "GET /api/program/status"
              as: IPCounsel
              captures: { pv: $.data.current_policy_version, now: $.data.now_iso8601 }
          assert:
            - "pv == v1"
            - "now == 2026-05-01T00:00:00Z (fixed default, not wall clock)"

      - name: endorsement_gate_covered_by_difficulty
        claim_type: conditional_action
        grounds: ["endpoints['POST /api/disclosures/{id}/endorse']", "errors[ERR_ENDORSEMENT_REQUIRED]"]
        excluded_because:
          difficulty_instance: "dual_variant_calc / disclosure_risk_provisional_vs_final"
          rationale: "The >= 80 endorsement gate (rejection then endorsed approval) is exercised inside the named §1.8 instance's trigger chain."

      - name: sweep_endpoint_covered_by_calculations
        claim_type: action_endpoint
        grounds: ["endpoints['POST /api/program/sweep']"]
        excluded_because:
          difficulty_instance: "compensating_invariant / obligation_bucket_total_conservation"
          rationale: "Sweep-driven OVERDUE transitions are part of the named §1.8 setup; expiry boundary covered by corner nda_expiry_boundary_exactly_at_expiry_stays_active."

