            - "Reservation.state == MATCHED"
            - "Reservation.allocated_unit_id == ${unit1_id}"
            - "GET /rental-units/${unit1_id} reports availability_state == RESERVED"
            - "GET /rental-units/${unit2_id} reports availability_state == IN_STOCK"
            - "GET /styles/${style_gown_id} reports floor_ready_unit_count == 1 and active_unit_count == 2"
      - name: calc_selector_empty_candidate_pool_waitlists_instead_of_erroring
        claim_type: correct_result
        grounds:
          - "calculations.availability_match_selector"
          - "state_machines.Reservation.transitions.REQUESTED_to_WAITLISTED"
          - "entities.Reservation.fields.waitlist_position"
        distinguishing_aspect: >-
          The empty-pool fallback splits on preferred_unit_id: with no preferred unit named, an empty candidate
          set is NOT an error but a WAITLISTED reservation with allocated_unit_id null and waitlist_position 1.
          Style LUM-DRESS-03 owns no units at all, so the candidate set is empty for structural reasons rather
          than because of a window collision, and an implementation that returns ERR_UNIT_NOT_ALLOCATABLE here has
          confused the two fallback branches.
        test_recipe:
          setup:
            - "logical clock parked at 2026-08-03T09:00:00Z"
            - "membership plan SIG4 exists"
            - "style LUM-DRESS-03 with size_run [S, M] and zero rental units"
            - "member Nora Ellery on SIG4 is ACTIVE with units_out_count 0"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
