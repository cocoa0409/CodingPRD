        excluded_because:
          difficulty_instance: calc_demonstrated_need_institutional_when_school_does_not_require_css_rejected
          rationale: "Already covered as a §1.9 calculation instance; not also enumerated here as a validation duplicate."

  # ==========================================================================
  # Section 5 — Endpoints (Table 5)
  # ==========================================================================
  - section: endpoints
    instances:

      - name: endpoint_patch_applicants_updates_then_flips_to_ready
        claim_type: Standard CRUD
        grounds:
          - endpoints[PATCH /applicants/{id}]
          - entities.Applicant.fields.profile_status
        distinguishing_aspect: "PATCH /applicants/{id} setting full_name (and gpa already set) after a Recommender already exists flips profile_status DRAFT→READY (declared side effect)."
        test_recipe:
          setup:
            - "Applicant registered with gpa=3.0 (full_name='X'), one Recommender invited → profile_status was set when Recommender was created if profile already had full_name and gpa (it does)"
          setup_api_calls:
            - call: "POST /applicants/register"
              payload: { email: "pa@x.com", full_name: "X", gpa: 3.0 }
              as: Anonymous
              captures: { applicant_id: $.data.id }
