  - rule_id: non_linear_state_machine
    instances:

      - name: license_revision_cycle_escalates_to_denied
        grounds:
          - state_machines.Show
          - state_machines.Show.SUBMITTED_to_RETURNED_FOR_CORRECTION
          - state_machines.Show.RETURNED_FOR_CORRECTION_to_SUBMITTED
          - state_machines.Show.SUBMITTED_to_DENIED
          - entities.Show.fields.revision_count
          - validations.priority_3
        distinguishing_aspect: |
          A genuine cycle with a loop counter: SUBMITTED -> RETURNED_FOR_CORRECTION ->
          SUBMITTED can be traversed twice, but the identical third RETURN request routes
          to a completely different target state (DENIED) and fires a two-level cascade
          that closes divisions and voids planned classes. The same endpoint with the same
          payload produces RETURNED_FOR_CORRECTION on calls 1 and 2 and DENIED on call 3.
        test_recipe:
          setup:
            - "One DRAFT show with one ACTIVE division and two PLANNED classes (so the licence submission preconditions are satisfied)."
            - "Logical clock at its 2026-08-01T00:00:00Z startup default."
          setup_api_calls:
            - call: "POST /shows"
              payload: { name: "Autumn Classic", federation_show_id: "FED-2434", venue: "Ridgeline Park", competition_level: "LOCAL", start_utc: "2026-09-10T13:00:00Z", end_utc: "2026-09-13T22:00:00Z", entry_close_utc: "2026-09-01T00:00:00Z", prize_money_pool_cents: 750000, stall_capacity: 40, stall_fee_cents: 7500 }
              as: ShowSecretary
              captures: { show_id: $.data.id }
            - call: "POST /shows/${show_id}/divisions"
              payload: { name: "Open Jumper", discipline: "JUMPER", age_group: "OPEN", min_jump_height_cm: 100, max_jump_height_cm: 130, division_share_bp: 3333, jumpoff_enabled: true }
              as: ShowSecretary
              captures: { div_j_id: $.data.id }
            - call: "POST /divisions/${div_j_id}/classes"
              payload: { class_number: 101, name: "Open Jumper 1.20m", jump_height_cm: 120, entry_fee_cents: 25000, class_share_bp: 1669, max_entries: 30 }
              as: ShowSecretary
              captures: { class1_id: $.data.id }
            - call: "POST /divisions/${div_j_id}/classes"
              payload: { class_number: 102, name: "Open Jumper 1.10m", jump_height_cm: 110, entry_fee_cents: 25000, class_share_bp: 1000, max_entries: 30 }
              as: ShowSecretary
              captures: { class2_id: $.data.id }
            - call: "POST /shows/${show_id}/license-submission"
              payload: {}
              as: ShowSecretary
            - call: "POST /shows/${show_id}/license-decision"
              payload: { decision: "RETURN", correction_note: "Jump heights outside the declared division band." }
              as: FederationOfficer
            - call: "POST /shows/${show_id}/license-submission"
              payload: {}
              as: ShowSecretary
            - call: "POST /shows/${show_id}/license-decision"
              payload: { decision: "RETURN", correction_note: "Prize list still understates the 1.10m purse." }
              as: FederationOfficer
            - call: "POST /shows/${show_id}/license-submission"
              payload: {}
              as: ShowSecretary
          trigger:
            - call: "POST /shows/${show_id}/license-decision"
              payload: { decision: "RETURN", correction_note: "Third cycle." }
              as: FederationOfficer
          assert:
            - "before the trigger, Show.${show_id}.license_status == SUBMITTED and Show.${show_id}.revision_count == 2 (incremented on each RETURNED_FOR_CORRECTION -> SUBMITTED resubmission, not on the initial DRAFT -> SUBMITTED)"
            - "the trigger returns 200 and Show.${show_id}.license_status == DENIED — the identical RETURN request routes to DENIED rather than RETURNED_FOR_CORRECTION once revision_count >= MAX_LICENSE_REVISIONS (2)"
            - "CompetitionDivision.${div_j_id}.status == CLOSED"
            - "ShowClass.${class1_id}.status == VOIDED and ShowClass.${class2_id}.status == VOIDED"
            - "a further POST /shows/${show_id}/license-submission returns 409 ERR_SHOW_LICENSE_NOT_DRAFT — DENIED is terminal and the cycle cannot be re-entered"
            - "a further POST /shows/${show_id}/license-decision with decision APPROVE returns 409 ERR_SHOW_LICENSE_NOT_SUBMITTED"

