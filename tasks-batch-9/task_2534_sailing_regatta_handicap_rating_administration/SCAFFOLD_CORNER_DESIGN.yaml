          trigger:
            - { call: "POST /regatta-ops/jury-panels", payload: { regatta_id: "${reg}", chair_member_id: "${m_jc}" }, as: RegattaChair, as_user_id: "${m_ch}", captures: { pnl: $.data.id } }
            - { call: "POST /regatta-ops/jury-panels/${pnl}/seats", payload: { member_id: "${m_j2}" }, as: RegattaChair, as_user_id: "${m_ch}" }
          assert:
            - "trigger call 1 returns HTTP 201 with JuryPanel.${pnl}.status == FORMING and seated_member_count == 1"
            - "trigger call 2 returns HTTP 200 with JuryPanel.${pnl}.status == SEATED and seated_member_count == 2"
            - "JuryPanel.${pnl}.chair_member_id == ${m_jc} and JuryPanel.${pnl}.version == 2"
            - "JuryPanel.${pnl}.seats holds two elements, ${m_jc} and ${m_j2}, both with recused false"

