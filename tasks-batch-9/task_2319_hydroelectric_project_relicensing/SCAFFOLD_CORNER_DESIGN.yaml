          setup:
            - "Project at STUDY_PHASE (pad_year 2026, base_annual_generation_mwh 250000) with an open settlement."
            - "Measure S: source SETTLEMENT, FISH_PASSAGE, capital 3000000.00, om 200000.00, construction_start_year 2026, flow 200, head 80, days 300 -> PROPOSED."
            - "Measure A: source AGENCY_PRESCRIPTION, WATER_QUALITY, capital 600000.00, om 20000.00, construction_start_year 2026, flow 40, head 60, days 120 -> INCLUDED."
