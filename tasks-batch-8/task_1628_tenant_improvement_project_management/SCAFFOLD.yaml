    input: [occupancy_certificate_ref, issued_on, delay_responsibility]
    output: TIProject
    side_effects: ["Lease abatement fields recomputed", "DRAFT OverageInvoices -> ISSUED", "LeaseSpace -> LEASED", "TIProject.version increments by 1"]
  - method: POST
