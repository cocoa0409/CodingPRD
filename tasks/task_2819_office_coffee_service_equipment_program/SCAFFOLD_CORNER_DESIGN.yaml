# §1.9 Scaffold Corner Design - breadth probe over §1.1-§1.7 of SCAFFOLD.yaml.
# section: / claim_type: vocabulary comes only from references/claim-extraction-guide.md.
# Corners already asserted by SCAFFOLD_DIFFICULTY_DESIGN.yaml appear as excluded_because stubs.
scaffold_corner_design:

  # ===================================================================== ENTITIES
  - section: entities
    instances:

      - name: corner_account_creation_persists_every_input_field_and_stamps_system_fields
        claim_type: creation
        grounds:
          - entities.Account
          - endpoints[POST /ocs/accounts]
          - response_envelope.success
        distinguishing_aspect: "POST /ocs/accounts with all four inputs returns 201 and echoes legal_name, billing_mode, green_index_baseline_micros and price_protection_days, with id / created_at / updated_at / version stamped by the server and every computed field at its declared default."
        test_recipe:
          setup: ["empty database; clock parked at 2026-08-03T08:00:00Z"]
          setup_api_calls:
            - call: "POST /ocs/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T08:00:00Z" }
              as: ProgramAdmin
          trigger:
            - call: "POST /ocs/accounts"
              payload: { legal_name: "Northgate Holdings LLC", billing_mode: "CONSOLIDATED", green_index_baseline_micros: 2000000, price_protection_days: 60 }
              as: AccountManager
              captures: { acct_id: "$.data.id" }
          assert:
            - "the response is HTTP 201 with the envelope { meta: { api_request_id, api_request_timestamp }, response_type: 'object', data: {...} }"
            - "data.legal_name == 'Northgate Holdings LLC', data.billing_mode == 'CONSOLIDATED', data.green_index_baseline_micros == 2000000, data.price_protection_days == 60"
            - "data.program_posture == ONBOARDING, data.green_price_factor_bps == 10000, data.escalated_site_count == 0, data.receivable_balance_cents == 0, data.allied_attachment_bps == 0"
            - "data.price_protection_until == null, data.cancel_reason == null, data.retrieval_due_by == null, data.cancelled_at == null"
            - "data.id, data.created_at, data.updated_at and data.version are all present and were not client-supplied"
            - "GET /ocs/accounts/${acct_id} returns the identical field values"

      - name: corner_optional_inputs_fall_back_to_declared_defaults
        claim_type: defaults
        grounds:
          - entities.Account.fields.price_protection_days
          - entities.ProductItem.fields.green_coffee_linked
          - entities.Route.fields.travel_buffer_minutes
        distinguishing_aspect: "Omitting price_protection_days yields 90, omitting green_coffee_linked yields false, and omitting travel_buffer_minutes yields the declared route default - the request is accepted, not rejected as incomplete."
        test_recipe:
          setup: ["empty database; clock at 2026-08-03T08:00:00Z"]
          setup_api_calls:
            - call: "POST /ocs/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T08:00:00Z" }
              as: ProgramAdmin
          trigger:
            - call: "POST /ocs/accounts"
              payload: { legal_name: "Southgate Partners LLC", billing_mode: "PER_SITE", green_index_baseline_micros: 2000000 }
              as: AccountManager
              captures: { acct_id: "$.data.id" }
            - call: "POST /ocs/product-items"
              payload: { sku: "TEA-BLK-100", category: "TEA", base_unit_price_micros: 1500000, pack_units: 100 }
              as: ProgramAdmin
              captures: { p_tea_id: "$.data.id" }
            - call: "POST /ocs/routes"
              payload: { name: "TUE-NOBUF", service_day: "TUE", capacity_minutes: 300 }
              as: ProgramAdmin
              captures: { route_id: "$.data.id" }
          assert:
            - "Account.${acct_id}.price_protection_days == 90 (the declared default), not null and not 0"
            - "ProductItem.${p_tea_id}.green_coffee_linked == false"
            - "Route.${route_id}.travel_buffer_minutes equals the field's declared default and is an integer, never null"
            - "all three creations are 2xx - an omitted field WITH a default is never an ERR_VALIDATION"

      - name: corner_site_planning_computes_forecast_peak_and_par_rows_from_headcount
        claim_type: computed_fields
        grounds:
          - entities.Site.fields.forecast_cups_per_week
          - entities.Site.fields.required_peak_cups_per_hour
          - entities.Site.fields.recommended_model_id
          - calculations.site_consumption_forecast
          - endpoints[POST /ocs/sites/{site_id}/size-and-plan]
        distinguishing_aspect: "For headcount 40, days_per_week 5 and brew_style DRIP the server computes forecast_cups_per_week 360, required_peak_cups_per_hour 26 and a COFFEE ParLevel row with par_units 65 / reorder_point_units 26; these are computed fields the client never supplies."
        test_recipe:
          setup:
            - "clock at 2026-08-03T08:00:00Z; MON route; one COFFEE product; model URN-30 (band 1-250, capacity 30)"
            - "one account with one site at headcount 40, days_per_week 5, consumption_model HEADCOUNT_MODEL, not yet planned"
          setup_api_calls:
            - call: "POST /ocs/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T08:00:00Z" }
              as: ProgramAdmin
            - call: "POST /ocs/routes"
              payload: { name: "Metro MON", service_day: "MON", capacity_minutes: 480, travel_buffer_minutes: 30 }
              as: ProgramAdmin
              captures: { route_id: "$.data.id" }
            - call: "POST /ocs/product-items"
              payload: { sku: "COF-HOUSE-12OZ", category: "COFFEE", base_unit_price_micros: 4500000, pack_units: 6, green_coffee_linked: true }
              as: ProgramAdmin
              captures: { p_cof_id: "$.data.id" }
            - call: "POST /ocs/equipment-models"
              payload: { model_code: "URN-30", brewer_class: "THERMAL", cups_per_hour_capacity: 30, min_headcount: 1, max_headcount: 250, monthly_rent_cents: 4500, descale_interval_days: 90, list_value_cents: 120000 }
              as: ProgramAdmin
              captures: { model_id: "$.data.id" }
            - call: "POST /ocs/accounts"
              payload: { legal_name: "Northgate Holdings LLC", billing_mode: "CONSOLIDATED", green_index_baseline_micros: 2000000, price_protection_days: 90 }
              as: AccountManager
              captures: { acct_id: "$.data.id" }
            - call: "POST /ocs/sites"
              payload: { account_id: "${acct_id}", route_id: "${route_id}", site_name: "HQ Floor 3", headcount: 40, days_per_week: 5, consumption_model: "HEADCOUNT_MODEL", service_minutes_estimate: 45 }
              as: AccountManager
              captures: { site_id: "$.data.id" }
          trigger:
            - call: "POST /ocs/sites/${site_id}/size-and-plan"
              payload: { brew_style: "DRIP" }
              as: AccountManager
            - call: "GET /ocs/par-levels"
              payload: { site_id: "${site_id}", product_id: "${p_cof_id}" }
              as: AccountManager
              captures: { par_cof_id: "$.data[0].id" }
          assert:
            - "before the trigger Site.${site_id}.forecast_cups_per_week == 0 and recommended_model_id == null"
            - "after the trigger Site.${site_id}.forecast_cups_per_week == 360 (ceil(40 * 1.8 * 5 * 1.00))"
            - "Site.${site_id}.required_peak_cups_per_hour == 26 (ceil(360 / 5 * 0.35))"
            - "Site.${site_id}.recommended_model_id == ${model_id} and brew_style == DRIP"
            - "ParLevel.${par_cof_id}.par_units == 65 (ceil(360 * 2 * 0.09)) and reorder_point_units == 26 (ceil(65 * 0.4))"
            - "ParLevel.${par_cof_id}.source == FORECAST, on_hand_units == 0, cumulative_delivered_units == 0, cumulative_consumed_units == 0 and stock_status == STOCKOUT"

      - name: corner_equipment_model_is_immutable_with_no_update_endpoint
        claim_type: immutability
        grounds:
          - entities.EquipmentModel
          - endpoints[POST /ocs/equipment-models]
          - endpoints[GET /ocs/equipment-models/{model_id}]
        distinguishing_aspect: "EquipmentModel is declared common_fields: false - §1.5 exposes only POST and the two GETs, the read carries no version field, and there is no PATCH route to mutate a catalogued brewer."
        test_recipe:
          setup: ["empty database; clock at 2026-08-03T08:00:00Z"]
          setup_api_calls:
            - call: "POST /ocs/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T08:00:00Z" }
              as: ProgramAdmin
          trigger:
            - call: "POST /ocs/equipment-models"
              payload: { model_code: "URN-30", brewer_class: "THERMAL", cups_per_hour_capacity: 30, min_headcount: 1, max_headcount: 250, monthly_rent_cents: 4500, descale_interval_days: 90, list_value_cents: 120000 }
              as: ProgramAdmin
              captures: { model_id: "$.data.id" }
            - call: "GET /ocs/equipment-models/${model_id}"
              payload: {}
              as: ProgramAdmin
          assert:
            - "the creation is HTTP 201 and GET /ocs/equipment-models/${model_id} is HTTP 200 with model_code 'URN-30' and list_value_cents 120000"
            - "the read payload carries no version key (EquipmentModel is declared common_fields: false)"
            - "no PATCH or DELETE route exists for /ocs/equipment-models/{model_id}: PATCH returns 404/405 and never mutates the row"
            - "GET /ocs/equipment-models?brewer_class=THERMAL returns the model exactly once"

      - name: corner_product_item_listing_paginates_with_total_count_and_has_more
        claim_type: listing
        grounds:
          - endpoints[GET /ocs/product-items]
          - response_envelope.pagination_fields
          - response_envelope.pagination_defaults
        distinguishing_aspect: "With three catalogued products, limit=2&offset=0 returns 2 rows with total_count 3 and has_more true, while offset=2 returns the last row with has_more false; the category filter narrows total_count to 1."
        test_recipe:
          setup: ["clock at 2026-08-03T08:00:00Z; catalog holds exactly three products: one COFFEE, one CREAMER, one TEA"]
          setup_api_calls:
            - call: "POST /ocs/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T08:00:00Z" }
              as: ProgramAdmin
            - call: "POST /ocs/product-items"
              payload: { sku: "COF-HOUSE-12OZ", category: "COFFEE", base_unit_price_micros: 4500000, pack_units: 6, green_coffee_linked: true }
              as: ProgramAdmin
              captures: { p_cof_id: "$.data.id" }
            - call: "POST /ocs/product-items"
              payload: { sku: "CRM-LIQ-QT", category: "CREAMER", base_unit_price_micros: 2000000, pack_units: 12, green_coffee_linked: false }
              as: ProgramAdmin
              captures: { p_crm_id: "$.data.id" }
            - call: "POST /ocs/product-items"
              payload: { sku: "TEA-BLK-100", category: "TEA", base_unit_price_micros: 1500000, pack_units: 100, green_coffee_linked: false }
              as: ProgramAdmin
              captures: { p_tea_id: "$.data.id" }
          trigger:
            - call: "GET /ocs/product-items"
              payload: { limit: 2, offset: 0 }
              as: ProgramAdmin
            - call: "GET /ocs/product-items"
              payload: { limit: 2, offset: 2 }
              as: ProgramAdmin
            - call: "GET /ocs/product-items"
              payload: { category: "CREAMER" }
              as: ProgramAdmin
          assert:
            - "the first list is HTTP 200 with response_type 'array', exactly 2 rows, total_count == 3 and has_more == true"
            - "the second list returns exactly 1 row, total_count == 3 and has_more == false"
            - "the category-filtered list returns exactly 1 row whose id == ${p_crm_id}, with total_count == 1 and has_more == false"
            - "an unfiltered GET /ocs/product-items with no limit returns all 3 rows under the declared default limit of 10"

      - name: corner_par_level_get_with_unknown_id_returns_not_found
        claim_type: not_found
        grounds:
          - validations[priority=5]
          - errors[ERR_PAR_LEVEL_NOT_FOUND]
          - endpoints[GET /ocs/par-levels/{par_level_id}]
        distinguishing_aspect: "A syntactically valid but non-existent par_level_id returns HTTP 404 ERR_PAR_LEVEL_NOT_FOUND, not an empty 200 body and not a 500."
        test_recipe:
          setup: ["clock at 2026-08-03T08:00:00Z; no ParLevel row has ever been created"]
          setup_api_calls:
            - call: "POST /ocs/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T08:00:00Z" }
              as: ProgramAdmin
          trigger:
            - call: "GET /ocs/par-levels/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: AccountManager
              captures: { err: "$.data.error_id" }
          assert:
            - "the response is HTTP 404 with response_type 'error' and data.error_id == ERR_PAR_LEVEL_NOT_FOUND"
            - "data.message is a non-empty string and the envelope still carries meta.api_request_id"
            - "GET /ocs/par-levels returns 0 rows with total_count == 0"

      - name: corner_site_creation_missing_required_headcount_returns_validation_error
        claim_type: required_fields
        grounds:
          - validations[priority=4]
          - errors[ERR_VALIDATION]
          - endpoints[POST /ocs/sites]
        distinguishing_aspect: "headcount is declared with source input and no default, so omitting it returns HTTP 400 ERR_VALIDATION and creates no Site - the server never substitutes a headcount of its own."
        test_recipe:
          setup: ["clock at 2026-08-03T08:00:00Z; one MON route and one account exist"]
          setup_api_calls:
            - call: "POST /ocs/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T08:00:00Z" }
              as: ProgramAdmin
            - call: "POST /ocs/routes"
              payload: { name: "Metro MON", service_day: "MON", capacity_minutes: 480, travel_buffer_minutes: 30 }
              as: ProgramAdmin
              captures: { route_id: "$.data.id" }
            - call: "POST /ocs/accounts"
              payload: { legal_name: "Northgate Holdings LLC", billing_mode: "CONSOLIDATED", green_index_baseline_micros: 2000000, price_protection_days: 90 }
              as: AccountManager
              captures: { acct_id: "$.data.id" }
          trigger:
            - call: "POST /ocs/sites"
              payload: { account_id: "${acct_id}", route_id: "${route_id}", site_name: "HQ Floor 3", days_per_week: 5, consumption_model: "HEADCOUNT_MODEL", service_minutes_estimate: 45 }
              as: AccountManager
              captures: { err: "$.data.error_id" }
          assert:
            - "the response is HTTP 400 with data.error_id == ERR_VALIDATION"
            - "GET /ocs/sites?account_id=${acct_id} returns 0 rows - no partially populated Site was written"
            - "the same request WITH headcount: 40 added is HTTP 201, proving only the missing field caused the rejection"

      - name: corner_equipment_asset_role_enum_rejects_an_undeclared_value
        claim_type: type_constraints
        grounds:
          - entities.EquipmentAsset.fields.asset_role
          - validations[priority=4]
          - errors[ERR_VALIDATION]
        distinguishing_aspect: "asset_role is constrained to PLACEMENT | LOANER, so asset_role 'SPARE' returns HTTP 400 ERR_VALIDATION and registers no asset, while 'LOANER' is accepted."
        test_recipe:
          setup: ["clock at 2026-08-03T08:00:00Z; model URN-30 is catalogued and the fleet is empty"]
          setup_api_calls:
            - call: "POST /ocs/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T08:00:00Z" }
              as: ProgramAdmin
            - call: "POST /ocs/equipment-models"
              payload: { model_code: "URN-30", brewer_class: "THERMAL", cups_per_hour_capacity: 30, min_headcount: 1, max_headcount: 250, monthly_rent_cents: 4500, descale_interval_days: 90, list_value_cents: 120000 }
              as: ProgramAdmin
              captures: { model_id: "$.data.id" }
          trigger:
            - call: "POST /ocs/equipment-assets"
              payload: { model_id: "${model_id}", serial_number: "URN30-0001", asset_role: "SPARE" }
              as: ProgramAdmin
              captures: { err: "$.data.error_id" }
            - call: "POST /ocs/equipment-assets"
              payload: { model_id: "${model_id}", serial_number: "URN30-0001", asset_role: "LOANER" }
              as: ProgramAdmin
              captures: { asset_id: "$.data.id" }
          assert:
            - "the 'SPARE' request is HTTP 400 with data.error_id == ERR_VALIDATION and GET /ocs/equipment-assets returns 0 rows at that point"
            - "the 'LOANER' request is HTTP 201 with asset_role == LOANER, asset_status == IN_STOCK, last_descale_at == 2026-08-03T08:00:00Z and reconditioning_until == null"
            - "the serial number 'URN30-0001' was free for reuse, proving the rejected request wrote nothing"

      - name: corner_placement_body_fk_that_does_not_resolve_returns_asset_not_found
        claim_type: parent_relationships
        grounds:
          - validations[priority=6]
          - errors[ERR_ASSET_NOT_FOUND]
          - complexity_profile.entity_topology
          - endpoints[POST /ocs/equipment-placements]
        distinguishing_aspect: "In the flat topology every parent is an explicit body FK: a placement whose site_id resolves but whose asset_id does not returns HTTP 404 ERR_ASSET_NOT_FOUND, and the Site's version is left untouched."
        test_recipe:
          setup:
            - "clock at 2026-08-03T08:00:00Z; MON route; one COFFEE product; model URN-30; no EquipmentAsset registered at all"
            - "one account with one PLANNED site (size-and-plan has run)"
          setup_api_calls:
            - call: "POST /ocs/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T08:00:00Z" }
              as: ProgramAdmin
            - call: "POST /ocs/routes"
              payload: { name: "Metro MON", service_day: "MON", capacity_minutes: 480, travel_buffer_minutes: 30 }
              as: ProgramAdmin
              captures: { route_id: "$.data.id" }
            - call: "POST /ocs/product-items"
              payload: { sku: "COF-HOUSE-12OZ", category: "COFFEE", base_unit_price_micros: 4500000, pack_units: 6, green_coffee_linked: true }
              as: ProgramAdmin
              captures: { p_cof_id: "$.data.id" }
            - call: "POST /ocs/equipment-models"
              payload: { model_code: "URN-30", brewer_class: "THERMAL", cups_per_hour_capacity: 30, min_headcount: 1, max_headcount: 250, monthly_rent_cents: 4500, descale_interval_days: 90, list_value_cents: 120000 }
              as: ProgramAdmin
              captures: { model_id: "$.data.id" }
            - call: "POST /ocs/accounts"
              payload: { legal_name: "Northgate Holdings LLC", billing_mode: "CONSOLIDATED", green_index_baseline_micros: 2000000, price_protection_days: 90 }
              as: AccountManager
              captures: { acct_id: "$.data.id" }
            - call: "POST /ocs/sites"
              payload: { account_id: "${acct_id}", route_id: "${route_id}", site_name: "HQ Floor 3", headcount: 40, days_per_week: 5, consumption_model: "HEADCOUNT_MODEL", service_minutes_estimate: 45 }
              as: AccountManager
              captures: { site_id: "$.data.id" }
            - call: "POST /ocs/sites/${site_id}/size-and-plan"
              payload: { brew_style: "DRIP" }
              as: AccountManager
              captures: { site_v: "$.data.version" }
          trigger:
            - call: "POST /ocs/equipment-placements"
              payload: { site_id: "${site_id}", asset_id: "00000000-0000-4000-8000-000000000000", terms_type: "RENTAL", minimum_purchase_cents: 60000, min_term_months: 12, expected_site_version: "${site_v}" }
              as: AccountManager
              captures: { err: "$.data.error_id" }
          assert:
            - "the response is HTTP 404 with data.error_id == ERR_ASSET_NOT_FOUND"
            - "Site.${site_id}.version is still ${site_v} - a failed FK resolution never consumes the OCC version"
            - "GET /ocs/equipment-placements?site_id=${site_id} returns 0 rows"

      - name: corner_credit_line_is_reverse_reachable_from_the_line_it_credits
        claim_type: retrieval
        grounds:
          - entities.InvoiceLine.fields.target_line_id
          - complexity_profile.relationship_patterns
          - endpoints[GET /ocs/invoice-lines]
          - endpoints[POST /ocs/consolidated-invoices/{invoice_id}/credit]
        distinguishing_aspect: "InvoiceLine.target_line_id is self-referential, and GET /ocs/invoice-lines?target_line_id=<product line> returns exactly the one CREDIT line pointing at it, with amount_cents -1000 and the target's credits_applied_cents at 1000."
        test_recipe:
          setup:
            - "clock at 2026-08-03T08:00:00Z then 2026-09-01T00:00:00Z; MON route; one COFFEE product at 4500000 micros; one CONSOLIDATED account with one planned site"
            - "one visit on 2026-08-03 delivered 20 COFFEE units, so the 2026-08 invoice carries a PRODUCT line of 9000 cents plus a 2500-cent FREIGHT line and was ISSUED at total 11500"
          setup_api_calls:
            - call: "POST /ocs/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T08:00:00Z" }
              as: ProgramAdmin
            - call: "POST /ocs/routes"
              payload: { name: "Metro MON", service_day: "MON", capacity_minutes: 480, travel_buffer_minutes: 30 }
              as: ProgramAdmin
              captures: { route_id: "$.data.id" }
            - call: "POST /ocs/product-items"
              payload: { sku: "COF-HOUSE-12OZ", category: "COFFEE", base_unit_price_micros: 4500000, pack_units: 6, green_coffee_linked: true }
              as: ProgramAdmin
              captures: { p_cof_id: "$.data.id" }
            - call: "POST /ocs/equipment-models"
              payload: { model_code: "URN-30", brewer_class: "THERMAL", cups_per_hour_capacity: 30, min_headcount: 1, max_headcount: 250, monthly_rent_cents: 4500, descale_interval_days: 90, list_value_cents: 120000 }
              as: ProgramAdmin
              captures: { model_id: "$.data.id" }
            - call: "POST /ocs/accounts"
              payload: { legal_name: "Northgate Holdings LLC", billing_mode: "CONSOLIDATED", green_index_baseline_micros: 2000000, price_protection_days: 90 }
              as: AccountManager
              captures: { acct_id: "$.data.id" }
            - call: "POST /ocs/sites"
              payload: { account_id: "${acct_id}", route_id: "${route_id}", site_name: "HQ Floor 3", headcount: 40, days_per_week: 5, consumption_model: "HEADCOUNT_MODEL", service_minutes_estimate: 45 }
              as: AccountManager
              captures: { site_id: "$.data.id" }
            - call: "POST /ocs/sites/${site_id}/size-and-plan"
              payload: { brew_style: "DRIP" }
              as: AccountManager
            - call: "POST /ocs/service-visits"
              payload: { site_id: "${site_id}", window_start: "2026-08-03T09:00:00Z", window_end: "2026-08-03T09:45:00Z", planned_minutes: 45 }
              as: AccountManager
              captures: { visit_id: "$.data.id" }
            - call: "POST /ocs/service-visits/${visit_id}/lines"
              payload: { product_id: "${p_cof_id}", requested_units: 20 }
              as: RouteTechnician
              as_user_id: "${route_id}"
            - call: "POST /ocs/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T09:30:00Z" }
              as: ProgramAdmin
            - call: "POST /ocs/service-visits/${visit_id}/complete"
              payload: { delivered_lines: [{ product_id: "${p_cof_id}", delivered_units: 20 }] }
              as: RouteTechnician
              as_user_id: "${route_id}"
            - call: "POST /ocs/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "GET /ocs/accounts/${acct_id}"
              payload: {}
              as: BillingSpecialist
              captures: { acct_v: "$.data.version" }
            - call: "POST /ocs/consolidated-invoices"
              payload: { account_id: "${acct_id}", period_start: "2026-08-01T00:00:00Z", period_end: "2026-08-31T23:59:59Z", expected_account_version: "${acct_v}" }
              as: BillingSpecialist
              captures: { inv_id: "$.data.id" }
            - call: "POST /ocs/consolidated-invoices/${inv_id}/issue"
              payload: {}
              as: BillingSpecialist
            - call: "GET /ocs/invoice-lines"
              payload: { invoice_id: "${inv_id}", line_type: "PRODUCT" }
              as: BillingSpecialist
              captures: { product_line_id: "$.data[0].id" }
          trigger:
            - call: "POST /ocs/consolidated-invoices/${inv_id}/credit"
              payload: { target_line_id: "${product_line_id}", amount_cents: 1000, credit_reason: "Two bags short on the delivery" }
              as: BillingSpecialist
              captures: { credit_line_id: "$.data.id" }
