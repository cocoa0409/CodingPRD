      # ---- corners already covered in depth by §1.8 --------------------------
      - name: suitability_variants_diverge_on_identical_data
        claim_type: variant_divergence
        excluded_because:
          difficulty_instance: suitability_tier_prebid_rollup_vs_postbid_page_level
          rationale: |
            The two page_suitability_tier variants returning different tiers for
            one page with one set of stored classifications - pre-bid rollup
            dragged down by a human-confirmed sibling while post-bid reads the
            page's own record - is exactly that §1.8 instance's subject.

      - name: claim_basis_variants_reconcile_at_approval
        claim_type: reconciliation
        excluded_because:
          difficulty_instance: claim_impression_basis_gross_at_intake_vs_net_at_approval
          rationale: |
            The provisional-to-final switch (gross_impression_basis at intake
            and review, net_measured_basis frozen at approval) and the delta
            that lands on both credit ledgers is covered there, including the
            suitability-breach shortcut that makes the two variants agree.

  # =========================================================================
  # From Table 4 (Validations)
  # =========================================================================
  - section: validations
    instances:

      - name: segment_created_with_no_pinned_list_is_rejected
        claim_type: violation_to_error
        grounds:
          - validations.priority_27
          - errors[ERR_SEGMENT_REQUIRES_LIST]
          - errors[ERR_EMPTY_LIST]
        distinguishing_aspect: |
          Both inclusion_list_id and exclusion_list_id are individually
          optional, so a naive required-field check passes a segment that pins
          nothing and would then match every impression. The at-least-one rule
          has its own error id (ERR_SEGMENT_REQUIRES_LIST), distinct from the
          superficially similar ERR_EMPTY_LIST that guards publishing a list
          with zero entries - and this instance pins both so they cannot be
          conflated.
        test_recipe:
          setup:
            - "Clock 2026-08-10T00:00:00Z; one advertiser with one DISPLAY campaign and one EXCLUSION list that has no entries yet."
          setup_api_calls:
