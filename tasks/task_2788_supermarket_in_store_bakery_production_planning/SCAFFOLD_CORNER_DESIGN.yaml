              as: CakeDesk
              captures: { cake_id: $.data.id }
            - call: "POST /bakery/custom-cake-orders/${cake_id}/confirm"
              payload: {}
              as: CakeDesk
            - call: "POST /bakery/custom-cake-orders/${cake_id}/start-decoration"
              payload: {}
              as: Decorator
              as_user_id: "decorator-01"
            - call: "POST /bakery/custom-cake-orders/${cake_id}/request-revision"
              payload: { decoration_complexity: "STANDARD" }
              as: CakeDesk
            - call: "POST /bakery/custom-cake-orders/${cake_id}/start-decoration"
              payload: {}
              as: Decorator
              as_user_id: "decorator-01"
            - call: "POST /bakery/custom-cake-orders/${cake_id}/request-revision"
              payload: { decoration_complexity: "STANDARD" }
              as: CakeDesk
            - call: "POST /bakery/custom-cake-orders/${cake_id}/start-decoration"
              payload: {}
              as: Decorator
              as_user_id: "decorator-01"
          trigger:
            - call: "POST /bakery/custom-cake-orders/${cake_id}/request-revision"
