          assert:
            - "${gc_order_denied} == ERR_UNAUTHORIZED with HTTP 403 and Inmate.${inmate_id}.version still 1"
            - "${gc_inmate_denied} == ERR_UNAUTHORIZED with HTTP 403 - intake is CorrectionalOfficer-exclusive"
            - "${grievance_status} == FILED with HTTP 201 - the coordinator's own exclusive operation works"
            - "${gc_read_booking} == 'BK-R02' - read access is retained where the role is declared on the endpoint"

