  # =========================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: community_approval_exactly_sixty_pct_approves_design
        grounds:
          - calculations.community_approval_pct
          - validations[priority=67]
          - errors.ERR_INSUFFICIENT_COMMUNITY_INPUT
          - state_machines.DesignProject.COMMUNITY_REVIEW_to_DESIGN_APPROVED
          - state_machines.DesignProject.COMMUNITY_REVIEW_to_REVISION_REQUESTED
          - state_machines.DesignRendering.ISSUED_to_WITHDRAWN
        distinguishing_aspect: |
          Three boundaries are crossed in one chain on the same project: the vote-count gate at
          MIN_REVIEW_VOTES-1 (24 votes -> ERR_INSUFFICIENT_COMMUNITY_INPUT) versus 26 votes
          (gate passes), the 1-decimal round_half_up of 100*14/26 = 53.84615... to exactly 53.8,
          and the INCLUSIVE approval comparison where 100*15/25 == 60.0 exactly must APPROVE - an
          implementation using a strict > or truncating instead of rounding half up fails on
          different steps of the same chain.
        test_recipe:
          setup:
            - "PlaygroundStandard ASTM_F1487/2024 ACTIVE; DECK-TDL-122 CERTIFIED."
            - "DesignProject 'Cedar Commons' with one TODDLER_6_23M area 0..2000 depth 30 and one VALIDATED deck placement at x=700."
            - "Rendering R1 ISSUED (round_number 1), project in RENDERED, revision_rounds 0."
          setup_api_calls:
            - call: "POST /playground/standards"
              payload: { code: "ASTM_F1487", edition_year: 2024, effective_from: "2024-01-01", min_use_zone_clearance_cm: 183, max_fall_height_cm_toddler: 122, max_fall_height_cm_preschool: 152, max_fall_height_cm_school_age: 244, requires_accessible_route: false }
              as: ComplianceOfficer
              as_user_id: "officer-1"
              captures: { std1_id: $.data.id }
            - call: "POST /playground/standards/${std1_id}/activate"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "officer-1"
            - call: "POST /playground/component-models"
              payload: { sku: "DECK-TDL-122", category: "DECK", age_group: "TODDLER_6_23M", deck_height_cm: 122, use_zone_footprint_cm: 183, color_options: ["CEDAR", "SKY_BLUE"], unit_price_cents: 64350, hardware_bag_count: 6, warranty_years: 15, parts_support_until_year: 2040, accessible_transfer_ready: true }
              as: ManufacturerAdmin
              as_user_id: "admin-1"
              captures: { m_deck_id: $.data.id }
            - call: "POST /playground/component-models/${m_deck_id}/certify"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "officer-1"
            - call: "POST /playground/projects"
              payload: { client_name: "Cedar Commons", site_length_cm: 3000, site_width_cm: 1200, site_soil_type: "CLAY", budget_cents: 500000, fundraising_deadline: "2026-12-31", required_age_groups: ["TODDLER_6_23M"], accessible_route_required: false }
              as: DesignConsultant
              as_user_id: "consultant-1"
              captures: { proj_id: $.data.id }
            - call: "POST /playground/projects/${proj_id}/start-consultation"
              payload: {}
              as: DesignConsultant
              as_user_id: "consultant-1"
            - call: "POST /playground/projects/${proj_id}/play-areas"
              payload: { age_group: "TODDLER_6_23M", axis_origin_cm: 0, axis_length_cm: 2000, surfacing_material: "ENGINEERED_WOOD_FIBER", surfacing_depth_cm: 30 }
              as: DesignConsultant
              as_user_id: "consultant-1"
              captures: { area_id: $.data.id }
            - call: "POST /playground/play-areas/${area_id}/placements"
              payload: { component_model_id: "${m_deck_id}", color_choice: "SKY_BLUE", x_start_cm: 700, quantity: 1 }
              as: DesignConsultant
              as_user_id: "consultant-1"
              captures: { pl_deck_id: $.data.id }
            - call: "POST /playground/placements/${pl_deck_id}/validate"
              payload: {}
              as: DesignConsultant
              as_user_id: "consultant-1"
            - call: "POST /playground/projects/${proj_id}/renderings"
              payload: { pinned_standard_id: "${std1_id}" }
              as: DesignConsultant
              as_user_id: "consultant-1"
              captures: { r1_id: $.data.id }
          trigger:
            - call: "POST /playground/renderings/${r1_id}/community-votes"
              payload: { yes_votes: 12, no_votes: 12 }
              as: ClientRepresentative
              as_user_id: "client-1"
              captures: { r1_pct_24: $.data.community_approval_pct }
            - call: "POST /playground/renderings/${r1_id}/close-review"
              payload: {}
              as: DesignConsultant
              as_user_id: "consultant-1"
              captures: { err_gate: $.data.error_id }
            - call: "POST /playground/renderings/${r1_id}/community-votes"
              payload: { yes_votes: 2, no_votes: 0 }
              as: ClientRepresentative
              as_user_id: "client-1"
              captures: { r1_pct_26: $.data.community_approval_pct }
            - call: "POST /playground/renderings/${r1_id}/close-review"
              payload: {}
              as: DesignConsultant
              as_user_id: "consultant-1"
            - call: "POST /playground/projects/${proj_id}/renderings"
              payload: { pinned_standard_id: "${std1_id}" }
              as: DesignConsultant
              as_user_id: "consultant-1"
              captures: { r2_id: $.data.id }
            - call: "POST /playground/renderings/${r2_id}/community-votes"
              payload: { yes_votes: 15, no_votes: 10 }
              as: ClientRepresentative
              as_user_id: "client-1"
              captures: { r2_pct: $.data.community_approval_pct }
            - call: "POST /playground/renderings/${r2_id}/close-review"
              payload: {}
              as: DesignConsultant
              as_user_id: "consultant-1"
          assert:
            - "after batch 1: ${r1_pct_24} == 50.0, DesignRendering.${r1_id}.yes_votes == 12, no_votes == 12, and DesignProject.${proj_id}.design_status == COMMUNITY_REVIEW"
            - "close-review at 24 votes: HTTP 422 and ${err_gate} == ERR_INSUFFICIENT_COMMUNITY_INPUT (MIN_REVIEW_VOTES is 25, so 24 is threshold-1)"
            - "DesignProject.${proj_id}.design_status == COMMUNITY_REVIEW and DesignRendering.${r1_id}.status == ISSUED after the rejected close-review"
            - "after batch 2: DesignRendering.${r1_id}.yes_votes == 14, no_votes == 12 and ${r1_pct_26} == 53.8 exactly (100*14/26 = 53.84615..., round_half_up to 1 decimal; NOT 53.85, NOT 53.9, NOT 53.0)"
            - "second close-review: HTTP 200, DesignRendering.${r1_id}.status == WITHDRAWN, DesignProject.${proj_id}.design_status == REVISION_REQUESTED, DesignProject.${proj_id}.revision_rounds == 1"
            - "DesignRendering.${r2_id}.round_number == 2 and DesignRendering.${r1_id}.status == WITHDRAWN (a WITHDRAWN rendering is terminal and is NOT re-marked SUPERSEDED by the new issue)"
            - "after the R2 batch: ${r2_pct} == 60.0 exactly (100*15/25) and total votes == 25 == MIN_REVIEW_VOTES, so the gate passes at exactly the threshold"
            - "third close-review: HTTP 200, DesignProject.${proj_id}.design_status == DESIGN_APPROVED (the comparison is >=, so exactly 60.0 approves)"
            - "DesignRendering.${r2_id}.status == ISSUED after approval (the approving rendering stays ISSUED so it can back a Quote)"
            - "DesignProject.${proj_id}.revision_rounds == 1 (an approval does not increment the revision counter)"

      - name: firm_quote_with_empty_validated_placement_set_rejected
        grounds:
          - calculations.quote_pricing
