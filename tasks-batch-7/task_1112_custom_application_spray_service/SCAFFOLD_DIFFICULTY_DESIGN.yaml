          trigger:
            - { call: "POST /api/work-orders/${wo}/schedule", payload: { applicator_id: "${ap}", equipment_id: "${eq}", scheduled_start: "2026-05-10T08:00:00Z", scheduled_end: "2026-05-10T11:00:00Z" }, as: Dispatcher, captures: { err: $.data.error_id } }
          assert:
            - "trigger error == ERR_PRESCRIPTION_NOT_APPROVED"
            - "WorkOrder.${wo}.status == DRAFT (unchanged)"

      - name: start_blocked_by_field_rei
        grounds:
          - state_machines.WorkOrder.SCHEDULED_to_IN_PROGRESS
