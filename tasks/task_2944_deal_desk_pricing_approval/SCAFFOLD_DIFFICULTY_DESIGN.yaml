              as: DealDeskAnalyst
              captures: { blocked_status: $.data.status, blocked_arr: $.data.booked_arr_cents }
            - call: "GET /accounts/${acct_id}"
              payload: {}
              as: DealDeskAnalyst
              captures: { blocked_acct_arr: $.data.booked_arr_cents }
