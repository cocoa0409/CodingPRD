  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: duplicate_nonterminal_enrollment_same_product_collides
        grounds:
          - validations[priority=15]
          - errors[ERR_DUPLICATE_ENROLLMENT]
          - entities.Enrollment.fields.lifecycle_status
        distinguishing_aspect: |
          An employee may hold at most one non-terminal coverage interval
          (lifecycle in {PENDING, ACTIVE}) per PlanProduct; a second enrollment in
          the same product while the first is still PENDING/ACTIVE collides and is
          rejected with ERR_DUPLICATE_ENROLLMENT. Interval semantics: open-ended
          coverage on (employee, product), on the Enrollment resource — distinct
          from the discrete pay-period point-collision below.
        test_recipe:
          setup:
            - "Employee with one PENDING enrollment in Product A; a second enrollment in Product A is attempted."
          setup_api_calls:
            - call: "POST /benefits/employers"
              payload: { legal_name: "Dup Co", section_125_plan_active: true, pay_periods_per_year: 52 }
              as: BenefitsAdmin
              captures: { emp_id: $.data.id }
            - call: "POST /benefits/plan-products"
