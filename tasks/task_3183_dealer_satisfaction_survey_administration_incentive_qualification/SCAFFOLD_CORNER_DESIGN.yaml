        distinguishing_aspect: "When dealer.posture == SUSPENDED, DealerPrincipal submit of an ActionPlan that is still in DRAFT (e.g. created AFTER suspension cascade already pushed prior DRAFT plans to SUBMITTED) is rejected with ERR_DEALER_SUSPENDED. Weaker: if all plans are auto-SUBMITTED, no DRAFT exists — so this tests the rare path where a plan is created while posture transitions."
