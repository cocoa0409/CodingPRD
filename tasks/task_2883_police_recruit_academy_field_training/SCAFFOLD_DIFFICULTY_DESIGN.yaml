              payload: { academy_class_id: "${class_id}", lesson_plan_id: "${lp_id}", instructor_id: "${instrA}", room_code: "R1", starts_at: "2026-08-10T10:00:00Z", ends_at: "2026-08-10T12:00:00Z", min_enrollment: 1 }
