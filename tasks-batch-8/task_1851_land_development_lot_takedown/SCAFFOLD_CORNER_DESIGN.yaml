              payload: { new_contingency_end_date: "2027-02-01T00:00:00Z", expected_parcel_version: "${oxp_v}" }
              as: DeveloperOperator
              captures: { oxp_end: $.data.contingency_end_date, oxp_v2: $.data.version }
            - call: "POST /api/parcels/${oxp}/extend-contingency"
