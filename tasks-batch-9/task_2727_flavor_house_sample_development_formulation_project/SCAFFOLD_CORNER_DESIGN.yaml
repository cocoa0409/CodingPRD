  - section: rbac
    instances:
      - name: requests_without_a_valid_role_header_are_rejected_before_anything_else
        claim_type: authentication
        grounds:
          - validations[priority=10]
          - errors.ERR_UNAUTHENTICATED
          - response_envelope.error
        distinguishing_aspect: "A missing X-User-Role, a missing X-User-ID and a role string outside the six declared roles all report ERR_UNAUTHENTICATED (401) at priority 10 - ahead of the 403 tier - so an undeclared role never sees the ERR_UNAUTHORIZED path and a header-less create writes nothing."
        test_recipe:
          setup:
            - "Empty database."
            - "Trigger 1 is sent with an X-User-ID but no X-User-Role header (expressed below as as: NONE)."
            - "Trigger 2 is sent with an X-User-Role but no X-User-ID header (expressed below as as: NONE)."
            - "Trigger 3 is sent with X-User-Role: QualityAuditor, a value outside the six declared roles."
          setup_api_calls: []
          trigger:
            - call: "GET /customer-briefs"
              payload: {}
              as: NONE
              captures: { e_no_role: "$.data.error_id" }
            - call: "POST /customer-briefs"
              payload: { brief_code: "BRF-0001", customer_name: "Nordica Dairy", matrix_type: "DAIRY_YOGURT", target_profile: "VANILLA_CREAM", dosage_pct: 1.0, annual_volume_kg: 500, cost_in_use_cap_cents_per_tonne: 100000, confidentiality_tier: "TIER_1_STANDARD" }
              as: NONE
              captures: { e_no_user: "$.data.error_id" }
            - call: "GET /customer-briefs"
              payload: {}
              as: QualityAuditor
              captures: { e_bad_role: "$.data.error_id" }
          assert:
            - "all three trigger calls return HTTP status == 401"
            - "e_no_role == ERR_UNAUTHENTICATED"
            - "e_no_user == ERR_UNAUTHENTICATED"
            - "e_bad_role == ERR_UNAUTHENTICATED"
            - "each error body carries meta.api_request_id, meta.api_request_timestamp, response_type == \"error\" and a non-empty data.message"
            - "no CustomerBrief row was created: the same GET with as: AccountManager returns total_count == 0"

      - name: role_exclusive_operations_cannot_be_invoked_by_a_different_role
        claim_type: authorization
        grounds:
          - roles.AccountManager.exclusive_operations
          - roles.TechnicalDirector.exclusive_operations
          - roles.Flavorist.exclusive_operations
          - roles.LabTech.exclusive_operations
          - roles.PurchasingManager.exclusive_operations
          - validations[priority=20]
          - errors.ERR_UNAUTHORIZED
        distinguishing_aspect: "Five exclusive operations are each attacked by a role that owns a neighbouring step of the same workflow, and every one returns ERR_UNAUTHORIZED (403) with no state change - the peer roles are not a hierarchy, so the TechnicalDirector who approves a formula still cannot record its QC."
