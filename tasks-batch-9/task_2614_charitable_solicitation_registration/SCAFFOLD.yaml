      - "GET /state-registrations/{id}/extension-requests"
      - "GET /registration-documents"
      - "GET /registration-documents/{id}"
      - "GET /professional-fundraisers/{id}"
      - "GET /professional-fundraisers/{id}/registrations"
      - "GET /fundraising-contracts"
      - "GET /fundraising-contracts/{id}"
      - "GET /coventure-promotions"
      - "GET /coventure-promotions/{id}"
      - "GET /enforcement-actions"
      - "GET /enforcement-actions/{id}"
