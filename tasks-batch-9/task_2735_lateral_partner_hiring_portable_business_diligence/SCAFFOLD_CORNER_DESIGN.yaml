      - name: practice_group_read_with_a_missing_or_unknown_role_returns_unauthenticated
        claim_type: violation_to_error
        grounds:
          - errors[ERR_UNAUTHENTICATED]
          - validations[priority=1]
          - roles
        distinguishing_aspect: |
          Priority 1 has two failure shapes that must NOT be split across two status codes:
          headers absent entirely, and an X-User-Role that is syntactically fine but is not
          one of the seven declared roles. Both are 401 ERR_UNAUTHENTICATED, never 403 —
          403 is reserved for a recognised role that simply lacks the route. The target is a
          read that any of the seven roles could legally perform, so the refusal can only be
          coming from rung 1.
        test_recipe:
          setup:
            - "One OPEN PracticeGroup exists so the path resolves to a real row and the 404 rung cannot fire."
          setup_api_calls:
            - call: "POST /lateral-hiring/practice-groups"
              payload: { name: "Corporate & Securities", guarantee_budget_total_usd: 5000000.00, onboarding_capacity: 2, leverage_ratio: 3.20, target_standard_rate_usd: 950.00 }
