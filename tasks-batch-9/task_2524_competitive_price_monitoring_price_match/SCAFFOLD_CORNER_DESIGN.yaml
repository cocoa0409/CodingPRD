            - call: "POST /pricing/matches"
              payload: { product_id: "${p_id}", competitor_id: "${c1_id}", match_method: "IDENTIFIER", identifier_score: 89, attribute_score: 40, image_score: 30, competitor_identifier: "00712345678905" }
              as: PricingAnalyst
              captures: { l_89: $.data.id }
            - call: "POST /pricing/matches"
              payload: { product_id: "${p_id}", competitor_id: "${c2_id}", match_method: "IDENTIFIER", identifier_score: 90, attribute_score: 40, image_score: 30, competitor_identifier: "00712345678912" }
