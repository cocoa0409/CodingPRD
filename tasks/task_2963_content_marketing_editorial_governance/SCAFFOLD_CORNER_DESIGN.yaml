        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / assign_sme_expert_unavailable_outranks_weekly_capacity_exceeded
          rationale: "The same §1.8 instance isolates the capacity violation on an AVAILABLE expert and asserts this code as the losing rule's error when it is the only one violated."

      - name: error_claim_not_substantiated_is_triggered_by_the_difficulty_design
