scenario: |
  1921. Defined Benefit Actuarial Valuation & Funding (pension actuarial firm): participant census data collection & validation, actuarial assumptions (mortality/discount/retirement) selection & review, liability measurement & normal cost calculation, minimum required contribution & maximum deductible range, funding target attainment percentage & benefit restrictions, PBGC premium calculation & filing, asset smoothing & credit balance elections, disclosure for financial statements

domain_name: defined-benefit-actuarial-valuation
api_prefix: "/v1"

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: ledger_reconciliation
  complexity_layers:
    - optimistic_concurrency
    - dual_variant_calculation
    - rate_threshold_triggers
    - cascading_side_effects
  entity_topology: hybrid
  state_machine_shape: cyclic
  relationship_patterns:
    - one_to_many
    - cross_aggregate
  role_model: segregation_of_duties
  consistency_model: immediate

# =============================================================================
# 1.0 Response Envelope (FIXED)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# 1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Plan
    parent: null
    common_fields: true
    fields:
      - name: sponsor_name
        type: string
        source: input
        description: Legal name of the plan sponsor
      - name: plan_year
        type: integer
        source: input
        description: Calendar plan year (e.g. 2028); valuation date is pinned to plan_year-01-01
      - name: accrual_rate
        type: number
        source: input
        description: Benefit accrual rate as a fraction of annual compensation per year of service (e.g. 0.01)
        constraints: "0 < accrual_rate <= 0.10"
      - name: normal_retirement_age
        type: integer
        source: input
        description: Plan normal retirement age used in annuity factors
        constraints: "60 <= normal_retirement_age <= 63 (pinned mortality table domain)"
      - name: prior_aftap_pct
        type: number
        source: input
        description: Prior plan year's certified AFTAP in percent, sponsor-reported; basis for presumed AFTAP
        constraints: "0.00 <= prior_aftap_pct <= 200.00"
      - name: initial_carryover_balance
        type: number
        source: input
        default: 0
        description: Opening carryover balance as of plan_year-01-01; seeds the CreditBalanceLedger
      - name: initial_prefunding_balance
        type: number
        source: input
        default: 0
        description: Opening prefunding balance as of plan_year-01-01; seeds the CreditBalanceLedger
      - name: status
        type: enum
        source: system
        description: "Lifecycle: ACTIVE | TERMINATED"
        constraints: "enum: {ACTIVE, TERMINATED}"
      - name: current_posture
        type: enum
        source: computed
        description: "Benefit-restriction posture derived from certified or presumed AFTAP: UNRESTRICTED | LUMP_SUM_RESTRICTED | ACCRUAL_FROZEN"
        default: UNRESTRICTED
        constraints: "enum: {UNRESTRICTED, LUMP_SUM_RESTRICTED, ACCRUAL_FROZEN}"
      - name: certified_aftap_pct
        type: number
        source: computed
        default: null
        description: AFTAP (percent, 2dp) of the plan's currently CERTIFIED ValuationRun, null when none
      - name: presumed_aftap_pct
        type: number
        source: computed
        default: null
        description: Presumed AFTAP per presumed_aftap calculation; null while a certified AFTAP governs

  - name: Actuary
    parent: null
    common_fields: true
    fields:
      - name: full_name
        type: string
        source: input
        description: Actuary legal name
      - name: credential_id
        type: string
        source: input
        description: Professional credential identifier (e.g. enrollment number)
      - name: enrollment_status
        type: enum
        source: input
        description: "ENROLLED = enrolled actuary authorized to certify; ASSOCIATE = non-enrolled"
        constraints: "enum: {ENROLLED, ASSOCIATE}"

  - name: CensusBatch
    parent: Plan
    common_fields: true
    fields:
      - name: plan_id
        type: string
        source: input
        description: "FK -> Plan.id; owning plan (supplied via path)"
      - name: plan_year
        type: integer
        source: input
        description: Plan year this census covers; must equal the owning plan's plan_year
      - name: source_label
        type: string
        source: input
        description: Free-form label identifying the data extract
      - name: status
        type: enum
        source: system
        description: "UPLOADED | NEEDS_CORRECTION | VALIDATED | LOCKED"
        constraints: "enum: {UPLOADED, NEEDS_CORRECTION, VALIDATED, LOCKED}"
      - name: participant_count
        type: integer
        source: computed
        description: Count of Participant rows attached to this batch
      - name: error_count
        type: integer
        source: computed
        description: Row-level screening errors from the most recent submit-screening
      - name: screening_errors
        type: array
        source: computed
        description: Array of per-row screening error descriptors from the most recent submit-screening

  - name: Participant
    parent: CensusBatch
    common_fields: true
    fields:
      - name: census_batch_id
        type: string
        source: input
        description: "FK -> CensusBatch.id; owning census batch (supplied via path)"
      - name: external_ref
        type: string
        source: input
        description: Sponsor's employee identifier; unique within a census batch
      - name: date_of_birth
        type: datetime
        source: input
        description: ISO date; attained age = plan_year minus birth year (month/day ignored)
      - name: status
        type: enum
        source: input
        description: "ACTIVE | TERMINATED_VESTED | RETIREE"
        constraints: "enum: {ACTIVE, TERMINATED_VESTED, RETIREE}"
      - name: years_of_service
        type: integer
        source: input
        description: Credited service at valuation date; required for ACTIVE, ignored otherwise
        constraints: ">= 0"
      - name: annual_compensation
        type: number
        source: input
        description: Current annualized compensation; required for ACTIVE participants
        constraints: ">= 0"
      - name: deferred_benefit_annual
        type: number
        source: input
        description: Accrued annual benefit deferred to normal retirement age; required for TERMINATED_VESTED
        constraints: ">= 0"
      - name: current_annual_benefit
        type: number
        source: input
        description: Annual benefit in pay status; required for RETIREE
        constraints: ">= 0"

  - name: AssumptionSet
    parent: Plan
    common_fields: true
    fields:
      - name: plan_id
        type: string
        source: input
        description: "FK -> Plan.id; owning plan (supplied via path)"
      - name: plan_year
        type: integer
        source: input
        description: Plan year the assumptions apply to; must equal the owning plan's plan_year
      - name: label
        type: string
        source: input
        description: Human-readable assumption set label
      - name: mortality_table
        type: string
        source: input
        description: "Pinned mortality table identifier; only TEST_TABLE_4AGE is supported"
        constraints: "must equal TEST_TABLE_4AGE"
      - name: funding_discount_rate
        type: number
        source: input
        description: Annual effective discount rate for funding liabilities (e.g. 0.05)
        constraints: "0 < funding_discount_rate <= 0.20"
      - name: disclosure_discount_rate
        type: number
        source: input
        description: Annual effective discount rate for financial-statement PBO (e.g. 0.04)
        constraints: "0 < disclosure_discount_rate <= 0.20"
      - name: retirement_age
        type: integer
        source: input
        description: Assumed retirement age; must equal the plan's normal_retirement_age
      - name: prepared_by_actuary_id
        type: string
        source: system
        description: Actuary id (X-User-ID) who created the set; drives segregation of duties
      - name: approved_by_actuary_id
        type: string
        source: system
        default: null
        description: Actuary id who approved the set; must differ from prepared_by_actuary_id
      - name: status
        type: enum
        source: system
        description: "DRAFT | IN_REVIEW | APPROVED | LOCKED | RETIRED"
        constraints: "enum: {DRAFT, IN_REVIEW, APPROVED, LOCKED, RETIRED}"

  - name: AssetStatement
    parent: Plan
    common_fields: true
    fields:
      - name: plan_id
        type: string
        source: input
        description: "FK -> Plan.id; owning plan (supplied via path)"
      - name: plan_year
        type: integer
        source: input
        description: Plan year of this statement; must equal the owning plan's plan_year
      - name: market_value_begin
        type: number
        source: input
        description: Fair market value of plan assets at plan_year-01-01
        constraints: ">= 0"
      - name: contributions_received
        type: number
        source: input
        description: Cash contributions deposited during the plan year
        constraints: ">= 0"
      - name: benefits_paid
        type: number
        source: input
        description: Benefit payments disbursed during the plan year
        constraints: ">= 0"
      - name: investment_return
        type: number
        source: input
        description: Net investment earnings (may be negative) during the plan year
      - name: market_value_end
        type: number
        source: computed
        description: "market_value_begin + contributions_received - benefits_paid + investment_return (roll-forward invariant)"

  - name: AssetValuation
    parent: Plan
    common_fields: true
    fields:
      - name: plan_id
        type: string
        source: input
        description: "FK -> Plan.id; owning plan (supplied via path)"
      - name: plan_year
        type: integer
        source: input
        description: Plan year valued; must equal the owning plan's plan_year
      - name: market_value
        type: number
        source: computed
        description: Market value of assets from the plan's AssetStatement for the year (market_value_end)
      - name: smoothed_value
        type: number
        source: computed
        description: Actuarial (smoothed, corridor-clamped) value of assets per asset_smoothing_corridor
      - name: unrecognized_gain
        type: number
        source: computed
        description: Deferred (unrecognized) portion of the current-year gain/loss before corridor clamp
      - name: corridor_floor
        type: number
        source: computed
        description: 0.80 x market_value
      - name: corridor_ceiling
        type: number
        source: computed
        description: 1.20 x market_value
      - name: corridor_applied
        type: enum
        source: computed
        description: "NONE | FLOOR | CEILING — which corridor bound (if any) clamped smoothed_value"
        constraints: "enum: {NONE, FLOOR, CEILING}"

  - name: ValuationRun
    parent: Plan
    common_fields: true
    fields:
      - name: plan_id
        type: string
        source: input
        description: "FK -> Plan.id; owning plan (supplied via path)"
      - name: plan_year
        type: integer
        source: input
        description: Plan year valued; must equal the owning plan's plan_year
      - name: census_batch_id
        type: string
        source: input
        description: "FK -> CensusBatch.id; census used for the valuation"
      - name: assumption_set_id
        type: string
        source: input
        description: "FK -> AssumptionSet.id; assumptions used for the valuation"
      - name: asset_valuation_id
        type: string
        source: input
        description: "FK -> AssetValuation.id; asset basis used for the valuation"
      - name: status
        type: enum
        source: system
        description: "INITIATED | COMPUTED | CERTIFIED | SUPERSEDED | VOID"
        constraints: "enum: {INITIATED, COMPUTED, CERTIFIED, SUPERSEDED, VOID}"
      - name: funding_target
        type: number
        source: computed
        description: Sum of per-participant rounded accrued liabilities (funding discount basis)
      - name: normal_cost
        type: number
        source: computed
        description: Sum of per-participant rounded normal cost shares (ACTIVE participants only)
      - name: aftap_pct
        type: number
        source: computed
        default: null
        description: Certified AFTAP percent (2dp) computed at certify time; null before certification
      - name: created_by_actuary_id
        type: string
        source: system
        description: Actuary id (X-User-ID) that created this run; certifier must differ (segregation of duties)
      - name: certified_by_actuary_id
        type: string
        source: system
        default: null
        description: Actuary id that certified this run

  - name: ParticipantAccrual
    parent: ValuationRun
    common_fields: true
    fields:
      - name: valuation_run_id
        type: string
        source: system
        description: "FK -> ValuationRun.id; run that produced this row"
      - name: participant_id
        type: string
        source: system
        description: "FK -> Participant.id; participant valued"
      - name: age_at_valuation
        type: integer
        source: computed
        description: Attained age = plan_year - birth year
      - name: annuity_factor
        type: number
        source: computed
        description: Deferred/immediate annuity factor, rounded half-up to 4 decimal places
      - name: accrued_liability
        type: number
        source: computed
        description: Per-participant liability rounded half-up to cents (pre-aggregation rounding is pinned)
      - name: normal_cost_share
        type: number
        source: computed
        description: Per-participant normal cost (ACTIVE only, else 0.00), rounded half-up to cents
      - name: frozen
        type: boolean
        source: computed
        default: false
        description: True once a certified ACCRUAL_FROZEN posture freezes accruals on this run's rows

  - name: CreditBalanceLedger
    parent: Plan
    common_fields: true
    fields:
      - name: plan_id
        type: string
        source: system
        description: "FK -> Plan.id; owning plan; ledger is auto-created with the plan"
      - name: carryover_balance
        type: number
        source: computed
        description: Remaining carryover balance; drawn down first by elections
      - name: prefunding_balance
        type: number
        source: computed
        description: Remaining prefunding balance; drawn down only after carryover is exhausted
      - name: total_applied_to_date
        type: number
        source: computed
        description: Cumulative credit balance applied to contribution demands (net of revocations)

  - name: CreditBalanceElection
    parent: Plan
    common_fields: true
    fields:
      - name: plan_id
        type: string
        source: input
        description: "FK -> Plan.id; owning plan (supplied via path)"
      - name: contribution_demand_id
        type: string
        source: input
        description: "FK -> ContributionDemand.id; demand the election offsets"
      - name: amount
        type: number
        source: input
        description: Credit amount to apply; must be > 0
      - name: status
        type: enum
        source: system
        description: "EFFECTIVE | REVOKED"
        constraints: "enum: {EFFECTIVE, REVOKED}"
      - name: revoke_deadline
        type: datetime
        source: computed
        description: created_at + 21 days; revocation permitted only while logical clock is strictly before this instant

  - name: ContributionDemand
    parent: Plan
    common_fields: true
    fields:
      - name: plan_id
        type: string
        source: system
        description: "FK -> Plan.id; owning plan; demand is auto-created by run certification"
      - name: plan_year
        type: integer
        source: system
        description: Plan year of the certified run that produced this demand
      - name: valuation_run_id
        type: string
        source: system
        description: "FK -> ValuationRun.id; certified run driving the amounts"
      - name: tentative_minimum
        type: number
        source: computed
        description: Normal cost + shortfall amortization installment (evaluation order pinned in minimum_required_contribution)
      - name: credit_applied
        type: number
        source: computed
        description: Sum of EFFECTIVE credit-balance elections (waterfall order) capped at tentative_minimum
      - name: minimum_due
        type: number
        source: computed
        description: tentative_minimum - credit_applied
      - name: maximum_deductible
        type: number
        source: computed
        description: Maximum deductible contribution per maximum_deductible_contribution
      - name: paid_to_date
        type: number
        source: computed
        description: Sum of ContributionPayment amounts posted against this demand
      - name: outstanding_amount
        type: number
        source: computed
        description: minimum_due - paid_to_date; drives status auto-transitions
      - name: excise_accrued
        type: number
        source: computed
        default: 0
        description: 10% of outstanding_amount, assessed once on transition into DELINQUENT
      - name: due_date
        type: datetime
        source: computed
        description: plan_year-09-15T00:00:00Z — minimum funding deadline
      - name: status
        type: enum
        source: system
        description: "OPEN | PARTIALLY_SATISFIED | SATISFIED | DELINQUENT"
        constraints: "enum: {OPEN, PARTIALLY_SATISFIED, SATISFIED, DELINQUENT}"

  - name: ContributionPayment
    parent: ContributionDemand
    common_fields: false
    fields:
      - name: contribution_demand_id
        type: string
        source: input
        description: "FK -> ContributionDemand.id; demand the payment satisfies (supplied via path)"
      - name: amount
        type: number
        source: input
        description: Cash amount paid; must be > 0 and must not exceed outstanding_amount
      - name: paid_on
        type: datetime
        source: input
        description: Value date of the cash payment (ISO 8601)

  - name: PBGCFiling
    parent: Plan
    common_fields: true
    fields:
      - name: plan_id
        type: string
        source: input
        description: "FK -> Plan.id; owning plan (supplied via path)"
      - name: valuation_run_id
        type: string
        source: input
        description: "FK -> ValuationRun.id; certified run supplying participant count and target"
      - name: plan_year
        type: integer
        source: computed
        description: Copied from the referenced valuation run
      - name: premium_method
        type: enum
        source: input
        default: STANDARD
        description: "STANDARD: UVB vs funding_target; ALTERNATIVE: UVB vs funding_target x 1.05"
        constraints: "enum: {STANDARD, ALTERNATIVE}"
      - name: participant_count
        type: integer
        source: computed
        description: Participant count from the certified run's LOCKED census (all statuses)
      - name: premium_target
        type: number
        source: computed
        description: funding_target (STANDARD) or round(funding_target x 1.05, 2) (ALTERNATIVE)
      - name: market_assets
        type: number
        source: computed
        description: Market (not smoothed) value of assets from the run's AssetValuation
      - name: uvb
        type: number
        source: computed
        description: Unfunded vested benefits = max(0, premium_target - market_assets)
      - name: flat_rate_premium
        type: number
        source: computed
        description: participant_count x FLAT_RATE_PER_PARTICIPANT
      - name: variable_rate_premium
        type: number
        source: computed
        description: min(round(uvb x VARIABLE_RATE_PER_1000 / 1000, 2), participant_count x PER_PARTICIPANT_CAP)
      - name: total_premium
        type: number
        source: computed
        description: flat_rate_premium + variable_rate_premium
      - name: cap_applied
        type: boolean
        source: computed
        description: True when uncapped variable premium >= participant_count x PER_PARTICIPANT_CAP (equality binds the cap)
      - name: status
        type: enum
        source: system
        description: "DRAFT | FILED | AMENDED | VOID"
        constraints: "enum: {DRAFT, FILED, AMENDED, VOID}"
      - name: filed_at
        type: datetime
        source: system
        default: null
        description: Logical-clock timestamp of the most recent DRAFT/AMENDED -> FILED transition

  - name: DisclosureReport
    parent: Plan
    common_fields: true
    fields:
      - name: plan_id
        type: string
        source: input
        description: "FK -> Plan.id; owning plan (supplied via path)"
      - name: valuation_run_id
        type: string
        source: input
        description: "FK -> ValuationRun.id; certified run whose census is re-valued at the disclosure discount rate"
      - name: pbo
        type: number
        source: computed
        description: Projected benefit obligation — same census revalued at disclosure_discount_rate
      - name: fair_value_assets
        type: number
        source: computed
        description: Market value of assets (never smoothed) for financial-statement purposes
      - name: funded_status
        type: number
        source: computed
        description: fair_value_assets - pbo (negative = underfunded)
      - name: status
        type: enum
        source: system
        description: "DRAFT | ACKNOWLEDGED"
        constraints: "enum: {DRAFT, ACKNOWLEDGED}"
      - name: acknowledged_by
        type: string
        source: system
        default: null
        description: Auditor X-User-ID who acknowledged the report

# =============================================================================
# 1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Plan
    initial_state: ACTIVE
    terminal_states: [TERMINATED]
    transitions:
      - from: ACTIVE
        to: TERMINATED
        trigger: "POST /v1/plans/{id}/terminate"
        actor: PlanAdmin
        preconditions:
          - "No ContributionDemand for the plan has outstanding_amount > 0"
        side_effects:
          - "Plan.version increments by 1"
          - "All DRAFT PBGCFilings for the plan transition to VOID"
          - "All non-LOCKED CensusBatches remain unchanged; no new runs may be created (ERR_PLAN_TERMINATED)"

  - entity: CensusBatch
    initial_state: UPLOADED
    terminal_states: [LOCKED]
    transitions:
      - from: UPLOADED
        to: VALIDATED
        trigger: "POST /v1/census-batches/{id}/submit-screening with zero row errors"
        actor: PlanAdmin
        preconditions:
          - "participant_count > 0"
          - "No other CensusBatch of the same plan in {VALIDATED, LOCKED} has plan_year equal to this batch's plan_year"
        side_effects:
          - "error_count set to 0; screening_errors set to []"
      - from: UPLOADED
        to: NEEDS_CORRECTION
        trigger: "POST /v1/census-batches/{id}/submit-screening with one or more row errors"
        actor: PlanAdmin
        preconditions:
          - "participant_count > 0"
        side_effects:
          - "error_count and screening_errors populated from row screening"
      - from: NEEDS_CORRECTION
        to: UPLOADED
        trigger: "POST /v1/census-batches/{id}/participants (corrected rows re-uploaded)"
        actor: PlanAdmin
        preconditions:
          - "Batch is in NEEDS_CORRECTION"
        side_effects:
          - "New participant rows appended; participant_count recomputed; screening_errors cleared to []"
      - from: VALIDATED
        to: LOCKED
        trigger: "POST /v1/census-batches/{id}/lock"
        actor: PlanAdmin
        preconditions:
          - "No other CensusBatch of the same plan is LOCKED for the same plan_year"
        side_effects:
          - "Batch becomes immutable reference data for valuation runs"

  - entity: AssumptionSet
    initial_state: DRAFT
    terminal_states: [RETIRED]
    transitions:
      - from: DRAFT
        to: IN_REVIEW
        trigger: "POST /v1/assumption-sets/{id}/submit"
        actor: Actuary
        preconditions: []
        side_effects: []
      - from: IN_REVIEW
        to: APPROVED
        trigger: "POST /v1/assumption-sets/{id}/approve"
        actor: SeniorActuary
        preconditions:
          - "Acting actuary's Actuary.enrollment_status == ENROLLED"
          - "Acting actuary id != prepared_by_actuary_id (segregation of duties)"
        side_effects:
          - "approved_by_actuary_id set to acting actuary id"
      - from: IN_REVIEW
        to: DRAFT
        trigger: "POST /v1/assumption-sets/{id}/reject"
        actor: SeniorActuary
        preconditions: []
        side_effects:
          - "Set returns to DRAFT for revision (revision loop)"
      - from: APPROVED
        to: LOCKED
        trigger: "POST /v1/assumption-sets/{id}/lock"
        actor: SeniorActuary
        preconditions:
          - "No other AssumptionSet of the same plan is LOCKED for the same plan_year"
        side_effects:
          - "Set becomes eligible as a valuation-run reference"
      - from: APPROVED
        to: DRAFT
        trigger: "POST /v1/assumption-sets/{id}/reopen"
        actor: SeniorActuary
        preconditions:
          - "No ValuationRun in {INITIATED, COMPUTED, CERTIFIED} references this set"
        side_effects:
          - "approved_by_actuary_id cleared to null"
      - from: DRAFT
        to: RETIRED
        trigger: "POST /v1/assumption-sets/{id}/retire"
        actor: Actuary
        preconditions: []
        side_effects: []

  - entity: AssetStatement
    initial_state: FINAL
    terminal_states: [FINAL]
    transitions: []

  - entity: AssetValuation
    initial_state: FINAL
    terminal_states: [FINAL]
    transitions: []

  - entity: ValuationRun
    initial_state: INITIATED
    terminal_states: [SUPERSEDED, VOID]
    transitions:
      - from: INITIATED
        to: COMPUTED
        trigger: "POST /v1/valuation-runs/{id}/compute"
        actor: Actuary
        preconditions:
          - "Referenced CensusBatch.status == LOCKED"
          - "Referenced AssumptionSet.status == LOCKED"
          - "Referenced AssetValuation exists and belongs to the same plan"
        side_effects:
          - "One ParticipantAccrual row created per participant of the referenced census batch"
          - "funding_target and normal_cost computed per funding_target_aggregation"
      - from: COMPUTED
        to: CERTIFIED
        trigger: "POST /v1/valuation-runs/{id}/certify"
        actor: SeniorActuary
        preconditions:
          - "Acting actuary's Actuary.enrollment_status == ENROLLED"
          - "Acting actuary id != created_by_actuary_id (segregation of duties)"
          - "expected_plan_version == Plan.version (OCC)"
        side_effects:
          - "aftap_pct computed per ftap_calculation (certified variant)"
          - "certified_by_actuary_id set to acting actuary id"
          - "Plan.version increments by 1"
          - "Any previously CERTIFIED ValuationRun for the same plan transitions to SUPERSEDED"
          - "Plan.certified_aftap_pct updated; Plan.current_posture recomputed per benefit_restriction_posture"
          - "Cascade hop 2: if new posture == ACCRUAL_FROZEN, every ParticipantAccrual of this run gets frozen=true; if posture != ACCRUAL_FROZEN, frozen flags of this run's rows cleared"
          - "Cascade hop 3: ContributionDemand for the plan_year created (first certification) or recomputed (later certifications); freeze state zeroes/restores the normal-cost component of tentative_minimum"
          - "Cascade hop 4: recomputed outstanding_amount drives ContributionDemand auto-transition (OPEN <-> PARTIALLY_SATISFIED <-> SATISFIED)"
          - "Cascade: every DRAFT or AMENDED PBGCFiling for the plan transitions to VOID (stale premium basis)"
      - from: INITIATED
        to: VOID
        trigger: "POST /v1/valuation-runs/{id}/void"
        actor: Actuary
        preconditions: []
        side_effects: []
      - from: COMPUTED
        to: VOID
        trigger: "POST /v1/valuation-runs/{id}/void"
        actor: Actuary
        preconditions: []
        side_effects:
          - "ParticipantAccrual rows of this run are retained for audit but excluded from all aggregations"

  - entity: CreditBalanceElection
    initial_state: EFFECTIVE
    terminal_states: [REVOKED]
    transitions:
      - from: EFFECTIVE
        to: REVOKED
        trigger: "POST /v1/credit-balance-elections/{id}/revoke"
        actor: PlanAdmin
        preconditions:
          - "Logical clock is strictly before revoke_deadline (created_at + 21 days)"
        side_effects:
          - "CreditBalanceLedger balances restored per credit_balance_waterfall reverse pass; total_applied_to_date reduced by election amount"
          - "ContributionDemand credit_applied / minimum_due / outstanding_amount recomputed; demand auto-transitions out of SATISFIED if outstanding_amount > 0 again (compensation of the original offset)"

  - entity: ContributionDemand
    initial_state: OPEN
    terminal_states: []
    transitions:
      - from: OPEN
        to: PARTIALLY_SATISFIED
        trigger: "POST /v1/contribution-demands/{id}/payments or credit-balance election leaving 0 < outstanding_amount < minimum_due"
        actor: PlanAdmin
        preconditions: []
        side_effects:
          - "outstanding_amount recomputed"
      - from: OPEN
        to: SATISFIED
        trigger: "Payment or election leaving outstanding_amount == 0"
        actor: PlanAdmin
        preconditions: []
        side_effects: []
      - from: PARTIALLY_SATISFIED
        to: SATISFIED
        trigger: "Payment or election leaving outstanding_amount == 0"
        actor: PlanAdmin
        preconditions: []
        side_effects: []
      - from: OPEN
        to: DELINQUENT
        trigger: "system: logical clock reaches a time strictly after due_date while outstanding_amount > 0"
        actor: system
        preconditions: []
        side_effects:
          - "excise_accrued set to round(0.10 x outstanding_amount, 2) per excise_tax_accrual"
      - from: PARTIALLY_SATISFIED
        to: DELINQUENT
        trigger: "system: logical clock strictly after due_date while outstanding_amount > 0"
        actor: system
        preconditions: []
        side_effects:
          - "excise_accrued set to round(0.10 x outstanding_amount, 2)"
      - from: DELINQUENT
        to: SATISFIED
        trigger: "Payment or election leaving outstanding_amount == 0"
        actor: PlanAdmin
        preconditions: []
        side_effects:
          - "excise_accrued remains due (not reversed)"
      - from: SATISFIED
        to: PARTIALLY_SATISFIED
        trigger: "Credit-balance election revocation restoring outstanding_amount > 0"
        actor: PlanAdmin
        preconditions: []
        side_effects:
          - "outstanding_amount recomputed per credit_balance_waterfall reverse pass"

  - entity: PBGCFiling
    initial_state: DRAFT
    terminal_states: [VOID]
    transitions:
      - from: DRAFT
        to: FILED
        trigger: "POST /v1/pbgc-filings/{id}/file"
        actor: PlanAdmin
        preconditions:
          - "Referenced ValuationRun.status == CERTIFIED"
          - "Logical clock is on or before plan_year-10-15T00:00:00Z (filing deadline)"
        side_effects:
          - "filed_at stamped from logical clock"
      - from: FILED
        to: AMENDED
        trigger: "POST /v1/pbgc-filings/{id}/amend"
        actor: PlanAdmin
        preconditions:
          - "The plan's currently CERTIFIED ValuationRun has a different id than the run this filing's premium snapshot references (i.e. a superseding certification occurred after the filing was created)"
        side_effects:
          - "valuation_run_id re-pointed to the currently CERTIFIED run; premium fields recomputed from it; filed_at cleared to null"
      - from: AMENDED
        to: FILED
        trigger: "POST /v1/pbgc-filings/{id}/file"
        actor: PlanAdmin
        preconditions:
          - "Referenced ValuationRun.status == CERTIFIED"
          - "Logical clock is on or before plan_year-10-15T00:00:00Z"
        side_effects:
          - "filed_at stamped from logical clock"
      - from: DRAFT
        to: VOID
        trigger: "POST /v1/pbgc-filings/{id}/void or certification of a newer run (cascade)"
        actor: PlanAdmin
        preconditions: []
        side_effects: []
      - from: AMENDED
        to: VOID
        trigger: "Certification of a newer run (cascade)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: DisclosureReport
    initial_state: DRAFT
    terminal_states: [ACKNOWLEDGED]
    transitions:
      - from: DRAFT
        to: ACKNOWLEDGED
        trigger: "POST /v1/disclosure-reports/{id}/acknowledge"
        actor: Auditor
        preconditions: []
        side_effects:
          - "acknowledged_by set to acting Auditor X-User-ID"

# =============================================================================
# 1.2.1 Concurrency Rules (true races only, OCC on parent version)
# =============================================================================
concurrency_rules:
  - rule_id: certify-run-stale-plan-version
    parent_entity: Plan
    write_endpoint: "POST /v1/valuation-runs/{id}/certify"
    occ_field: "expected_plan_version"
    description: |
      Certifying a ValuationRun against a Plan whose version has advanced since
      the client last observed it is rejected. Certifying a run legitimately
      supersedes the plan's previously certified run, so a certifier working
      from a stale plan snapshot must re-observe the plan before certifying.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: election-create-stale-plan-version
    parent_entity: Plan
    write_endpoint: "POST /v1/plans/{id}/credit-balance-elections"
    occ_field: "expected_plan_version"
    description: |
      Creating a CreditBalanceElection against a Plan whose version has
      advanced since the client last observed it is rejected. An election
      draws down the plan-wide credit-balance pool, so the pool snapshot the
      client priced the election against must still be current.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# 1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: annuity_factor
    trigger: "ParticipantAccrual creation during compute; DisclosureReport generation"
    algorithm: forward_looking
    formula: |
      Attained age: age = plan_year - year(date_of_birth)  (month/day ignored).
      Mortality TEST_TABLE_4AGE: q60=0.20, q61=0.25, q62=0.50, q63=1.00, omega=63.
      survival(age, t) = product over k=0..t-1 of (1 - q[age+k]).
      v = 1 / (1 + discount_rate).
      AF_immediate(x) = sum over t=0..(omega - x) of v^t * survival(x, t).
      AF(age, nra): if age >= nra -> AF_immediate(age)
                    else v^(nra-age) * survival(age, nra-age) * AF_immediate(nra).
      The factor is rounded HALF-UP to 4 decimal places BEFORE benefit multiplication.
      Reference values at 5%: AF(62)=1.4762, AF(63)=1.0000, AF(60 immediate)=2.5653,
      AF_def(60,62)=0.8034, AF_def(61,62)=1.0544. At 4%: AF(62)=1.4808,
      AF_def(60,62)=0.8214, AF(63)=1.0000.
    input_set: "Participant rows of the referenced LOCKED census batch, all statuses"
    constants:
      Q60: 0.20
      Q61: 0.25
      Q62: 0.50
      Q63: 1.00
      OMEGA_AGE: 63
      FACTOR_DECIMALS: 4
    precision: "annuity factor 4 decimal places round_half_up, applied before multiplication"

  - name: participant_accrual_liability
    trigger: "ValuationRun compute, once per census participant"
    algorithm: forward_looking
    formula: |
      ACTIVE:    accrued_liability = round_half_up(accrual_rate * years_of_service * annual_compensation * AF(age, nra), 2)
                 normal_cost_share = round_half_up(accrual_rate * 1 * annual_compensation * AF(age, nra), 2)
      TERMINATED_VESTED: accrued_liability = round_half_up(deferred_benefit_annual * AF(age, nra), 2)
                 normal_cost_share = 0.00
      RETIREE:   accrued_liability = round_half_up(current_annual_benefit * AF_immediate(age), 2)
                 normal_cost_share = 0.00
    input_set: "All participants of the referenced census batch; normal cost only from status == ACTIVE"
    constants: {}
    precision: "2 decimal places, round_half_up, per participant BEFORE aggregation (pinned rounding order)"

  - name: funding_target_aggregation
    trigger: "ValuationRun compute, after all ParticipantAccrual rows exist"
    algorithm: aggregation
    formula: |
      funding_target = sum over ParticipantAccrual rows of accrued_liability (already cent-rounded per row).
      normal_cost    = sum over ParticipantAccrual rows of normal_cost_share.
      Rounding order is PINNED: per-participant round-to-cents first, then sum.
      (Summing unrounded values and rounding once produces different cents and is non-conformant.)
    input_set: "ParticipantAccrual rows of this ValuationRun only"
    constants: {}
    precision: "2 decimal places, round_half_up (per-row, then exact cent sum)"

  - name: asset_smoothing_corridor
    trigger: "POST /v1/plans/{id}/asset-valuations"
    algorithm: threshold
    formula: |
      expected_return = round_half_up(market_value_begin * 0.05, 2)
      gain = investment_return - expected_return
      unrecognized_gain = round_half_up(gain * 2/3, 2)   (one-third of current-year gain recognized)
      smoothed_pre_corridor = market_value_end - unrecognized_gain
      corridor_floor   = round_half_up(0.80 * market_value_end, 2)
      corridor_ceiling = round_half_up(1.20 * market_value_end, 2)
      smoothed_value = min(max(smoothed_pre_corridor, corridor_floor), corridor_ceiling)
      corridor_applied = FLOOR if smoothed_pre_corridor < corridor_floor
                         else CEILING if smoothed_pre_corridor > corridor_ceiling
                         else NONE
    input_set: "The plan's AssetStatement for the same plan_year (exactly one permitted)"
    constants:
      EXPECTED_RETURN_RATE: 0.05
      RECOGNIZED_FRACTION: 0.3333333333333333
      CORRIDOR_LOW: 0.80
      CORRIDOR_HIGH: 1.20
    precision: "2 decimal places, round_half_up at each pinned step"
    variants:
      - name: smoothed_actuarial_value
        when: "Funding context — ValuationRun AFTAP and minimum/maximum contribution calculations"
        difference: "Uses smoothed_value (corridor-clamped)"
      - name: market_value
        when: "PBGC premium context and financial-statement disclosure"
        difference: "Uses market_value (unsmoothed); same inputs, different output whenever unrecognized_gain != 0 or a corridor binds"

  - name: minimum_required_contribution
    trigger: "ContributionDemand creation/recompute on run certification, election application, or revocation"
    algorithm: constraint_propagation
    formula: |
      PINNED EVALUATION ORDER (the credit cap depends on tentative_minimum, so order matters):
      (1) funding_target, normal_cost  (from the CERTIFIED run; normal cost component is 0 when the plan posture froze the run's accruals)
      (2) shortfall = max(0, funding_target - smoothed_value)
      (3) installment = round_half_up(shortfall / 7, 2) when shortfall > 0 else 0.00
      (4) tentative_minimum = normal_cost_component + installment
      (5) credit_applied = min(credit pool drawn by EFFECTIVE elections in waterfall order, tentative_minimum)
      (6) minimum_due = tentative_minimum - credit_applied
      (7) outstanding_amount = minimum_due - paid_to_date
    input_set: "CERTIFIED ValuationRun, AssetValuation (smoothed variant), CreditBalanceLedger, EFFECTIVE CreditBalanceElections"
    constants:
      AMORTIZATION_YEARS: 7
    precision: "2 decimal places, round_half_up"

  - name: maximum_deductible_contribution
    trigger: "ContributionDemand creation/recompute"
    algorithm: threshold
    formula: |
      cushion_basis = round_half_up(1.5 * funding_target, 2) + normal_cost
      maximum_deductible = max(tentative_minimum, cushion_basis - smoothed_value)
    input_set: "Same as minimum_required_contribution"
    constants:
      CUSHION_FACTOR: 1.5
    precision: "2 decimal places, round_half_up"

  - name: ftap_calculation
    trigger: "ValuationRun certify (certified variant); Plan posture read when no certified run governs (presumed variant)"
    algorithm: threshold
    formula: |
      CERTIFIED: aftap_pct = round_half_up(100 * (smoothed_value - (carryover_balance + prefunding_balance)) / funding_target, 2)
      PRESUMED (only when no CERTIFIED run exists for the plan):
        if logical clock >= plan_year-10-01T00:00:00Z -> presumed deemed under 60; posture ACCRUAL_FROZEN
        else if logical clock >= plan_year-04-01T00:00:00Z -> presumed_aftap_pct = prior_aftap_pct - 10.00
        else -> presumed_aftap_pct = prior_aftap_pct (presumed adequate; posture UNRESTRICTED)
    input_set: "CERTIFIED run + ledger (certified) or Plan.prior_aftap_pct + logical clock (presumed)"
    constants:
      PRESUMED_REDUCTION_PP: 10.00
      APRIL_FIRST_CUTOFF: "plan_year-04-01T00:00:00Z"
      OCTOBER_FIRST_DEEMED: "plan_year-10-01T00:00:00Z"
    precision: "percent with 2 decimal places, round_half_up"
    variants:
      - name: certified_aftap
        when: "A CERTIFIED ValuationRun exists for the plan"
        difference: "Computed from measured assets and liabilities"
      - name: presumed_aftap
        when: "No certified run; posture derives from prior year and calendar presumption rules"
        difference: "prior_aftap_pct reduced by 10 percentage points after April 1, deemed under 60% after October 1 — same plan state, different governing percentage"

  - name: benefit_restriction_posture
    trigger: "Run certification (certified AFTAP) and every read of plan posture (presumed fallback)"
    algorithm: threshold
    formula: |
      governing_pct = certified_aftap_pct if a CERTIFIED run exists else presumed percentage
      governing_pct >= 80.00           -> UNRESTRICTED
      60.00 <= governing_pct < 80.00   -> LUMP_SUM_RESTRICTED
      governing_pct < 60.00            -> ACCRUAL_FROZEN
      Boundary precision is PINNED: exactly 80.00 is UNRESTRICTED; exactly 60.00 is LUMP_SUM_RESTRICTED.
    input_set: "ftap_calculation output"
    constants:
      TIER_FULL: 80.00
      TIER_PARTIAL: 60.00
    precision: "comparison on 2-decimal percent"

  - name: pbgc_premium
    trigger: "PBGCFiling creation and amend recomputation"
    algorithm: tiered_pricing
    formula: |
      participant_count = participant_count of the LOCKED census of the referenced CERTIFIED run (all statuses)
      premium_target = funding_target (STANDARD) or round_half_up(funding_target * 1.05, 2) (ALTERNATIVE)
      uvb = max(0, premium_target - market_assets)          (market value, never smoothed)
      flat_rate_premium = participant_count * FLAT_RATE_PER_PARTICIPANT
      uncapped_variable = round_half_up(uvb * VARIABLE_RATE_PER_1000 / 1000, 2)
      cap = participant_count * PER_PARTICIPANT_CAP
      variable_rate_premium = min(uncapped_variable, cap)
      cap_applied = (uncapped_variable >= cap)              (equality binds the cap)
      total_premium = flat_rate_premium + variable_rate_premium
    input_set: "CERTIFIED run's census count, funding_target, and MARKET asset value"
    constants:
      FLAT_RATE_PER_PARTICIPANT: 100
      VARIABLE_RATE_PER_1000: 50
      PER_PARTICIPANT_CAP: 600
      ALTERNATIVE_TARGET_FACTOR: 1.05
    precision: "2 decimal places, round_half_up"
    variants:
      - name: standard_method
        when: "premium_method == STANDARD"
        difference: "UVB measured against funding_target"
      - name: alternative_method
        when: "premium_method == ALTERNATIVE"
        difference: "UVB measured against funding_target x 1.05 — same filing inputs, different UVB and premium"

  - name: credit_balance_waterfall
    trigger: "CreditBalanceElection creation (forward) and revocation (reverse)"
    algorithm: waterfall_allocation
    formula: |
      FORWARD (create): election amount is drawn carryover_balance first, then prefunding_balance:
        from_carryover = min(amount, carryover_balance)
        from_prefunding = min(amount - from_carryover, prefunding_balance)
        amount must be <= carryover_balance + prefunding_balance (else ERR_CREDIT_BALANCE_EXCEEDED)
        carryover_balance -= from_carryover; prefunding_balance -= from_prefunding
        total_applied_to_date += amount
      REVERSE (revoke): pools are restored in the same proportions recorded at draw time;
        total_applied_to_date -= amount.
      CONSERVED QUANTITY (credit pool): carryover_balance + prefunding_balance + total_applied_to_date
      is invariant under any create/revoke pair (no other operation mutates these fields).
    input_set: "CreditBalanceLedger + the election being applied/revoked"
    constants: {}
    precision: "2 decimal places, round_half_up"

  - name: excise_tax_accrual
    trigger: "ContributionDemand transition into DELINQUENT"
    algorithm: threshold
    formula: |
      excise_accrued = round_half_up(0.10 * outstanding_amount, 2), assessed once at the transition.
      Not reversed by later satisfaction.
    input_set: "The demand entering DELINQUENT"
    constants:
      EXCISE_RATE: 0.10
    precision: "2 decimal places, round_half_up"

  - name: disclosure_funded_status
    trigger: "DisclosureReport generation"
    algorithm: forward_looking
    formula: |
      pbo = funding target recomputed participant-by-participant with disclosure_discount_rate
            (same rounding order: per-participant cents, then sum)
      fair_value_assets = market_value of the plan's AssetValuation (never smoothed)
      funded_status = fair_value_assets - pbo
    input_set: "CERTIFIED run's census revalued at disclosure_discount_rate; AssetValuation market value"
    constants: {}
    precision: "2 decimal places, round_half_up"

# =============================================================================
# 1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present; role recognized"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"
  - priority: 2
    category: auth
    check: "Role permitted for the endpoint per RBAC matrix"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: "all"
  - priority: 3
    category: existence
    check: "Path-referenced resources exist, validated left-to-right (plan, then child, then grandchild)"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all"
  - priority: 4
    category: state
    check: "Target entity is in a valid from-state for the requested transition (generic state precondition)"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all action/transition endpoints"
  - priority: 5
    category: state
    check: "Plan is ACTIVE (not TERMINATED) for any child-creating or transition operation"
    error_id: ERR_PLAN_TERMINATED
    http_status: 409
    applies_to: "all plan-scoped mutation endpoints"
  - priority: 6
    category: business_safety
    check: "Segregation of duties: assumption-set approver id != prepared_by_actuary_id; valuation-run certifier id != created_by_actuary_id"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 422
    applies_to: ["POST /v1/assumption-sets/{id}/approve", "POST /v1/valuation-runs/{id}/certify"]
  - priority: 7
    category: business_safety
    check: "Acting actuary's enrollment_status == ENROLLED for approve and certify operations"
    error_id: ERR_ACTUARY_NOT_ENROLLED
    http_status: 422
    applies_to: ["POST /v1/assumption-sets/{id}/approve", "POST /v1/assumption-sets/{id}/lock", "POST /v1/valuation-runs/{id}/certify"]
  - priority: 8
    category: business_temporal
    check: "Logical clock on or before plan_year-10-15T00:00:00Z for PBGC filing"
    error_id: ERR_FILING_DEADLINE_PASSED
    http_status: 422
    applies_to: ["POST /v1/pbgc-filings/{id}/file"]
  - priority: 9
    category: business_temporal
    check: "Logical clock strictly before election revoke_deadline (created_at + 21 days)"
    error_id: ERR_REVOCATION_WINDOW_EXPIRED
    http_status: 422
    applies_to: ["POST /v1/credit-balance-elections/{id}/revoke"]
  - priority: 10
    category: business_temporal
    check: "No other EFFECTIVE election on the same ContributionDemand whose revocation window [created_at, created_at + 21 days) is still open (relative duration-window overlap; adjacency at exactly +21 days permitted)"
    error_id: ERR_ELECTION_WINDOW_CONFLICT
    http_status: 409
    applies_to: ["POST /v1/plans/{id}/credit-balance-elections"]
  - priority: 11
    category: business_referential
    check: "Child's plan_year equals the owning Plan.plan_year; referenced census/assumptions/asset-valuation/run belong to the same plan and matching plan_year"
    error_id: ERR_PLAN_YEAR_MISMATCH
    http_status: 422
    applies_to: ["POST /v1/plans/{id}/census-batches", "POST /v1/plans/{id}/assumption-sets", "POST /v1/plans/{id}/asset-statements", "POST /v1/plans/{id}/asset-valuations", "POST /v1/plans/{id}/valuation-runs", "POST /v1/plans/{id}/pbgc-filings", "POST /v1/plans/{id}/disclosure-reports"]
  - priority: 12
    category: business_referential
    check: "Assumption-set retirement_age equals the plan's normal_retirement_age; mortality_table == TEST_TABLE_4AGE"
    error_id: ERR_ASSUMPTION_MISMATCH
    http_status: 422
    applies_to: ["POST /v1/plans/{id}/assumption-sets"]
  - priority: 13
    category: business_referential
    check: "Referenced CensusBatch is LOCKED, referenced AssumptionSet is LOCKED, referenced AssetValuation belongs to the same plan"
    error_id: ERR_REFERENCE_NOT_LOCKED
    http_status: 422
    applies_to: ["POST /v1/valuation-runs/{id}/compute"]
  - priority: 14
    category: business_referential
    check: "Referenced ValuationRun is CERTIFIED for PBGC filing and disclosure generation"
    error_id: ERR_VALUATION_RUN_NOT_CERTIFIED
    http_status: 422
    applies_to: ["POST /v1/pbgc-filings/{id}/file", "POST /v1/plans/{id}/disclosure-reports"]
  - priority: 15
    category: business_constraint
    check: "Census plan-year uniqueness: no other CensusBatch of the plan in {VALIDATED, LOCKED} for the same plan_year (absolute calendar-year containment; adjacent years permitted)"
    error_id: ERR_CENSUS_YEAR_CONFLICT
    http_status: 409
    applies_to: ["POST /v1/census-batches/{id}/submit-screening", "POST /v1/census-batches/{id}/lock"]
  - priority: 16
    category: business_constraint
    check: "Assumption-set LOCKED uniqueness: no other AssumptionSet of the plan LOCKED for the same plan_year"
    error_id: ERR_ASSUMPTION_YEAR_CONFLICT
    http_status: 409
    applies_to: ["POST /v1/assumption-sets/{id}/lock"]
  - priority: 17
    category: business_constraint
    check: "No ValuationRun in {INITIATED, COMPUTED, CERTIFIED} references an AssumptionSet being reopened; asset statement unique per (plan, plan_year); participant external_ref unique within census batch"
    error_id: ERR_UNIQUENESS_VIOLATION
    http_status: 409
    applies_to: ["POST /v1/assumption-sets/{id}/reopen", "POST /v1/plans/{id}/asset-statements", "POST /v1/census-batches/{id}/participants"]
  - priority: 18
    category: business_constraint
    check: "Census batch has participant_count > 0 before screening; row-level field constraints (attained age within [60, 63] against the pinned mortality domain; non-negative amounts; status-appropriate benefit fields present)"
    error_id: ERR_INVALID_PARTICIPANT_DATA
    http_status: 422
    applies_to: ["POST /v1/census-batches/{id}/submit-screening", "POST /v1/census-batches/{id}/participants"]
  - priority: 19
    category: business_constraint
    check: "The plan's currently CERTIFIED run differs from the filing's referenced run before a PBGC filing may be amended"
    error_id: ERR_NO_AMENDMENT_DELTA
    http_status: 422
    applies_to: ["POST /v1/pbgc-filings/{id}/amend"]
  - priority: 20
    category: business_fiscal
    check: "Election amount <= carryover_balance + prefunding_balance; election amount <= demand outstanding_amount (over-offset)"
    error_id: ERR_CREDIT_BALANCE_EXCEEDED
    http_status: 422
    applies_to: ["POST /v1/plans/{id}/credit-balance-elections"]
  - priority: 21
    category: business_fiscal
    check: "Payment amount <= demand outstanding_amount"
    error_id: ERR_OVERPAYMENT
    http_status: 422
    applies_to: ["POST /v1/contribution-demands/{id}/payments"]
  - priority: 22
    category: business_constraint
    check: "Request body fields present, well-typed, enum values valid, amounts > 0 where required"
    error_id: ERR_VALIDATION
    http_status: 400
    applies_to: "all"

# =============================================================================
# 1.5 API Endpoint Table
# =============================================================================
endpoints:
  - method: POST
    path: "/v1/plans"
    description: "Create a defined-benefit plan; auto-creates the plan's CreditBalanceLedger seeded from initial balances"
    roles: [PlanAdmin]
    code: 201
    input: [sponsor_name, plan_year, accrual_rate, normal_retirement_age, prior_aftap_pct, "initial_carryover_balance?", "initial_prefunding_balance?"]
    output: Plan
    side_effects: ["CreditBalanceLedger auto-created with carryover_balance = initial_carryover_balance, prefunding_balance = initial_prefunding_balance, total_applied_to_date = 0"]
  - method: GET
    path: "/v1/plans"
    description: "List plans with pagination and optional status filter"
    roles: [PlanAdmin, Actuary, SeniorActuary, Auditor, FirmAdmin]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: Plan[]
    side_effects: []
  - method: GET
    path: "/v1/plans/{id}"
    description: "Fetch a single plan including computed posture and certified/presumed AFTAP"
    roles: [PlanAdmin, Actuary, SeniorActuary, Auditor, FirmAdmin]
    code: 200
    input: []
    output: Plan
    side_effects: []
  - method: POST
    path: "/v1/plans/{id}/terminate"
    description: "Terminate an ACTIVE plan (requires all contribution demands fully satisfied)"
    roles: [PlanAdmin]
    code: 200
    input: []
    output: Plan
    side_effects: ["Plan.status -> TERMINATED", "Plan.version increments by 1", "DRAFT PBGCFilings transition to VOID"]

  - method: POST
    path: "/v1/actuaries"
    description: "Register an actuary of the firm (entity backing Actuary and SeniorActuary roles)"
    roles: [FirmAdmin]
    code: 201
    input: [full_name, credential_id, enrollment_status]
    output: Actuary
    side_effects: []
  - method: GET
    path: "/v1/actuaries/{id}"
    description: "Fetch an actuary"
    roles: [PlanAdmin, Actuary, SeniorActuary, Auditor, FirmAdmin]
    code: 200
    input: []
    output: Actuary
    side_effects: []

  - method: POST
    path: "/v1/plans/{id}/census-batches"
    description: "Create a census batch (status UPLOADED) for a plan"
    roles: [PlanAdmin]
    code: 201
    input: [plan_year, source_label]
    output: CensusBatch
    side_effects: []
  - method: GET
    path: "/v1/plans/{id}/census-batches"
    description: "List census batches of a plan (reverse reachability for CensusBatch.plan_id)"
    roles: [PlanAdmin, Actuary, SeniorActuary, Auditor]
    code: 200
    input: ["limit?", "offset?"]
    output: CensusBatch[]
    side_effects: []
  - method: GET
    path: "/v1/census-batches/{id}"
    description: "Fetch a census batch including computed counts and screening errors"
    roles: [PlanAdmin, Actuary, SeniorActuary, Auditor]
    code: 200
    input: []
    output: CensusBatch
    side_effects: []
  - method: POST
    path: "/v1/census-batches/{id}/participants"
    description: "Bulk-append participant rows to an UPLOADED or NEEDS_CORRECTION batch; per-row validation errors are collected, valid rows are still written; posting to a NEEDS_CORRECTION batch returns it to UPLOADED (revision loop)"
    roles: [PlanAdmin]
    code: 200
    input: [participants]
    output: CensusBatch
    side_effects: ["Valid Participant rows appended", "participant_count recomputed", "NEEDS_CORRECTION batch transitions to UPLOADED"]
  - method: GET
    path: "/v1/census-batches/{id}/participants"
    description: "List participants of a census batch (reverse reachability for Participant.census_batch_id)"
    roles: [PlanAdmin, Actuary, SeniorActuary, Auditor]
    code: 200
    input: ["limit?", "offset?"]
    output: Participant[]
    side_effects: []
  - method: GET
    path: "/v1/participants/{id}"
    description: "Fetch a single participant"
    roles: [PlanAdmin, Actuary, SeniorActuary, Auditor]
    code: 200
    input: []
    output: Participant
    side_effects: []
  - method: POST
    path: "/v1/census-batches/{id}/submit-screening"
    description: "Run row-level screening: zero errors -> VALIDATED; any errors -> NEEDS_CORRECTION"
    roles: [PlanAdmin]
    code: 200
    input: []
    output: CensusBatch
    side_effects: ["status transitions per screening outcome", "error_count and screening_errors populated"]
  - method: POST
    path: "/v1/census-batches/{id}/lock"
    description: "Lock a VALIDATED census batch (immutable valuation reference)"
    roles: [PlanAdmin]
    code: 200
    input: []
    output: CensusBatch
    side_effects: ["status -> LOCKED"]

  - method: POST
    path: "/v1/plans/{id}/assumption-sets"
    description: "Create an assumption set (status DRAFT); prepared_by_actuary_id taken from X-User-ID"
    roles: [Actuary, SeniorActuary]
    code: 201
    input: [plan_year, label, mortality_table, funding_discount_rate, disclosure_discount_rate, retirement_age]
    output: AssumptionSet
    side_effects: ["prepared_by_actuary_id set from X-User-ID"]
  - method: GET
    path: "/v1/plans/{id}/assumption-sets"
    description: "List assumption sets of a plan (reverse reachability for AssumptionSet.plan_id)"
    roles: [PlanAdmin, Actuary, SeniorActuary, Auditor]
    code: 200
    input: ["limit?", "offset?"]
    output: AssumptionSet[]
    side_effects: []
  - method: GET
    path: "/v1/assumption-sets/{id}"
    description: "Fetch an assumption set"
    roles: [PlanAdmin, Actuary, SeniorActuary, Auditor]
    code: 200
    input: []
    output: AssumptionSet
    side_effects: []
  - method: POST
    path: "/v1/assumption-sets/{id}/submit"
    description: "Submit a DRAFT assumption set for review (DRAFT -> IN_REVIEW)"
    roles: [Actuary, SeniorActuary]
    code: 200
    input: []
    output: AssumptionSet
    side_effects: ["status -> IN_REVIEW"]
  - method: POST
    path: "/v1/assumption-sets/{id}/approve"
    description: "Approve an IN_REVIEW set; acting actuary must be ENROLLED and not the preparer (segregation of duties)"
    roles: [SeniorActuary]
    code: 200
    input: []
    output: AssumptionSet
    side_effects: ["status -> APPROVED", "approved_by_actuary_id set"]
  - method: POST
    path: "/v1/assumption-sets/{id}/reject"
    description: "Reject an IN_REVIEW set back to DRAFT (revision loop)"
    roles: [SeniorActuary]
    code: 200
    input: []
    output: AssumptionSet
    side_effects: ["status -> DRAFT"]
  - method: POST
    path: "/v1/assumption-sets/{id}/lock"
    description: "Lock an APPROVED set; only one LOCKED set per (plan, plan_year)"
    roles: [SeniorActuary]
    code: 200
    input: []
    output: AssumptionSet
    side_effects: ["status -> LOCKED"]
  - method: POST
    path: "/v1/assumption-sets/{id}/reopen"
    description: "Reopen an APPROVED set to DRAFT; forbidden while referenced by a live valuation run"
    roles: [SeniorActuary]
    code: 200
    input: []
    output: AssumptionSet
    side_effects: ["status -> DRAFT", "approved_by_actuary_id cleared"]
  - method: POST
    path: "/v1/assumption-sets/{id}/retire"
    description: "Retire a DRAFT assumption set (terminal)"
    roles: [Actuary, SeniorActuary]
    code: 200
    input: []
    output: AssumptionSet
    side_effects: ["status -> RETIRED"]

  - method: POST
    path: "/v1/plans/{id}/asset-statements"
    description: "Record the plan-year asset roll-forward statement; unique per (plan, plan_year); market_value_end computed by roll-forward"
    roles: [PlanAdmin]
    code: 201
    input: [plan_year, market_value_begin, contributions_received, benefits_paid, investment_return]
    output: AssetStatement
    side_effects: ["market_value_end computed"]
  - method: GET
    path: "/v1/plans/{id}/asset-statements"
    description: "List asset statements of a plan (reverse reachability for AssetStatement.plan_id)"
    roles: [PlanAdmin, Actuary, SeniorActuary, Auditor]
    code: 200
    input: ["limit?", "offset?"]
    output: AssetStatement[]
    side_effects: []
  - method: POST
    path: "/v1/plans/{id}/asset-valuations"
    description: "Compute the actuarial (smoothed, corridor-clamped) asset valuation for the plan year from the plan's asset statement"
    roles: [Actuary, SeniorActuary]
    code: 201
    input: [plan_year]
    output: AssetValuation
    side_effects: ["asset_smoothing_corridor computed", "market_value, smoothed_value, unrecognized_gain, corridor_floor, corridor_ceiling, corridor_applied populated"]
  - method: GET
    path: "/v1/plans/{id}/asset-valuations"
    description: "List asset valuations of a plan (reverse reachability for AssetValuation.plan_id)"
    roles: [PlanAdmin, Actuary, SeniorActuary, Auditor]
    code: 200
    input: ["limit?", "offset?"]
    output: AssetValuation[]
    side_effects: []

  - method: GET
    path: "/v1/asset-valuations/{id}"
    description: "Fetch a single asset valuation (smoothed value, corridor fields)"
    roles: [PlanAdmin, Actuary, SeniorActuary, Auditor]
    code: 200
    input: []
    output: AssetValuation
    side_effects: []
  - method: POST
    path: "/v1/plans/{id}/valuation-runs"
    description: "Initiate a valuation run referencing a census batch, assumption set, and asset valuation (status INITIATED); created_by_actuary_id taken from X-User-ID"
    roles: [Actuary, SeniorActuary]
    code: 201
    input: [plan_year, census_batch_id, assumption_set_id, asset_valuation_id]
    output: ValuationRun
    side_effects: ["created_by_actuary_id set from X-User-ID"]
  - method: GET
    path: "/v1/plans/{id}/valuation-runs"
    description: "List valuation runs of a plan (reverse reachability for ValuationRun.plan_id)"
    roles: [PlanAdmin, Actuary, SeniorActuary, Auditor]
    code: 200
    input: ["limit?", "offset?"]
    output: ValuationRun[]
    side_effects: []
  - method: GET
    path: "/v1/valuation-runs/{id}"
    description: "Fetch a valuation run including computed funding_target, normal_cost, aftap_pct"
    roles: [PlanAdmin, Actuary, SeniorActuary, Auditor]
    code: 200
    input: []
    output: ValuationRun
    side_effects: []
  - method: POST
    path: "/v1/valuation-runs/{id}/compute"
    description: "Compute the run: creates per-participant ParticipantAccrual rows and aggregates funding target and normal cost"
    roles: [Actuary, SeniorActuary]
    code: 200
    input: []
    output: ValuationRun
    side_effects: ["ParticipantAccrual rows created", "funding_target and normal_cost computed", "status -> COMPUTED"]
  - method: POST
    path: "/v1/valuation-runs/{id}/certify"
    description: "Certify a COMPUTED run (OCC on expected_plan_version); supersedes the plan's prior certified run and fires the posture/demand/filing cascade"
    roles: [SeniorActuary]
    code: 200
    input: [expected_plan_version]
    output: ValuationRun
    side_effects: ["aftap_pct computed", "Plan.version increments by 1", "prior CERTIFIED run -> SUPERSEDED", "plan posture recomputed", "ParticipantAccrual frozen flags updated", "ContributionDemand created/recomputed with status auto-transition", "DRAFT/AMENDED PBGCFilings -> VOID"]
  - method: POST
    path: "/v1/valuation-runs/{id}/void"
    description: "Void an INITIATED or COMPUTED run"
    roles: [Actuary, SeniorActuary]
    code: 200
    input: []
    output: ValuationRun
    side_effects: ["status -> VOID"]
  - method: GET
    path: "/v1/census-batches/{id}/valuation-runs"
    description: "List valuation runs referencing a census batch (reverse reachability for ValuationRun.census_batch_id)"
    roles: [PlanAdmin, Actuary, SeniorActuary, Auditor]
    code: 200
    input: ["limit?", "offset?"]
    output: ValuationRun[]
    side_effects: []
  - method: GET
    path: "/v1/assumption-sets/{id}/valuation-runs"
    description: "List valuation runs referencing an assumption set (reverse reachability for ValuationRun.assumption_set_id)"
    roles: [PlanAdmin, Actuary, SeniorActuary, Auditor]
    code: 200
    input: ["limit?", "offset?"]
    output: ValuationRun[]
    side_effects: []
  - method: GET
    path: "/v1/asset-valuations/{id}/valuation-runs"
    description: "List valuation runs referencing an asset valuation (reverse reachability for ValuationRun.asset_valuation_id)"
    roles: [PlanAdmin, Actuary, SeniorActuary, Auditor]
    code: 200
    input: ["limit?", "offset?"]
    output: ValuationRun[]
    side_effects: []
  - method: GET
    path: "/v1/valuation-runs/{id}/contribution-demands"
    description: "List contribution demands driven by a run (reverse reachability for ContributionDemand.valuation_run_id)"
    roles: [PlanAdmin, Actuary, SeniorActuary, Auditor]
    code: 200
    input: ["limit?", "offset?"]
    output: ContributionDemand[]
    side_effects: []
  - method: GET
    path: "/v1/valuation-runs/{id}/pbgc-filings"
    description: "List PBGC filings referencing a run (reverse reachability for PBGCFiling.valuation_run_id)"
    roles: [PlanAdmin, Actuary, SeniorActuary, Auditor]
    code: 200
    input: ["limit?", "offset?"]
    output: PBGCFiling[]
    side_effects: []
  - method: GET
    path: "/v1/valuation-runs/{id}/disclosure-reports"
    description: "List disclosure reports referencing a run (reverse reachability for DisclosureReport.valuation_run_id)"
    roles: [PlanAdmin, Actuary, SeniorActuary, Auditor]
    code: 200
    input: ["limit?", "offset?"]
    output: DisclosureReport[]
    side_effects: []
  - method: GET
    path: "/v1/valuation-runs/{id}/accruals"
    description: "List participant accrual rows of a run (reverse reachability for ParticipantAccrual.valuation_run_id)"
    roles: [PlanAdmin, Actuary, SeniorActuary, Auditor]
    code: 200
    input: ["limit?", "offset?"]
    output: ParticipantAccrual[]
    side_effects: []
  - method: GET
    path: "/v1/participants/{id}/accruals"
    description: "List accrual rows for a participant across runs (reverse reachability for ParticipantAccrual.participant_id)"
    roles: [PlanAdmin, Actuary, SeniorActuary, Auditor]
    code: 200
    input: ["limit?", "offset?"]
    output: ParticipantAccrual[]
    side_effects: []

  - method: GET
    path: "/v1/plans/{id}/credit-balance-ledger"
    description: "Read the plan's credit-balance ledger (1:1 sub-resource, array of 0-1)"
    roles: [PlanAdmin, Actuary, SeniorActuary, Auditor]
    code: 200
    input: []
    output: CreditBalanceLedger[]
    side_effects: []
  - method: POST
    path: "/v1/plans/{id}/credit-balance-elections"
    description: "Create a credit-balance election (OCC on expected_plan_version); draws down the ledger waterfall and offsets the referenced demand"
    roles: [PlanAdmin]
    code: 201
    input: [contribution_demand_id, amount, expected_plan_version]
    output: CreditBalanceElection
    side_effects: ["Plan.version increments by 1", "credit_balance_waterfall forward pass", "ContributionDemand credit_applied/minimum_due/outstanding recomputed with auto-transition", "revoke_deadline = created_at + 21 days"]
  - method: GET
    path: "/v1/plans/{id}/credit-balance-elections"
    description: "List credit-balance elections of a plan (reverse reachability for CreditBalanceElection.plan_id)"
    roles: [PlanAdmin, Actuary, SeniorActuary, Auditor]
    code: 200
    input: ["limit?", "offset?"]
    output: CreditBalanceElection[]
    side_effects: []
  - method: POST
    path: "/v1/credit-balance-elections/{id}/revoke"
    description: "Revoke an EFFECTIVE election within its 21-day window; reverses the waterfall draw and the demand offset"
    roles: [PlanAdmin]
    code: 200
    input: []
    output: CreditBalanceElection
    side_effects: ["status -> REVOKED", "credit_balance_waterfall reverse pass", "ContributionDemand recomputed; may exit SATISFIED"]
  - method: GET
    path: "/v1/contribution-demands/{id}"
    description: "Fetch a contribution demand including all computed funding amounts"
    roles: [PlanAdmin, Actuary, SeniorActuary, Auditor]
    code: 200
    input: []
    output: ContributionDemand
    side_effects: []
  - method: GET
    path: "/v1/plans/{id}/contribution-demands"
    description: "List contribution demands of a plan (reverse reachability for ContributionDemand.plan_id)"
    roles: [PlanAdmin, Actuary, SeniorActuary, Auditor]
    code: 200
    input: ["limit?", "offset?"]
    output: ContributionDemand[]
    side_effects: []
  - method: GET
    path: "/v1/contribution-demands/{id}/elections"
    description: "List elections applied to a demand (reverse reachability for CreditBalanceElection.contribution_demand_id)"
    roles: [PlanAdmin, Actuary, SeniorActuary, Auditor]
    code: 200
    input: ["limit?", "offset?"]
    output: CreditBalanceElection[]
    side_effects: []
  - method: POST
    path: "/v1/contribution-demands/{id}/payments"
    description: "Post a cash contribution payment against a demand (immutable payment event)"
    roles: [PlanAdmin]
    code: 201
    input: [amount, paid_on]
    output: ContributionPayment
    side_effects: ["ContributionPayment created", "ContributionDemand paid_to_date/outstanding recomputed with auto-transition"]
  - method: GET
    path: "/v1/contribution-demands/{id}/payments"
    description: "List payments posted to a demand (reverse reachability for ContributionPayment.contribution_demand_id)"
    roles: [PlanAdmin, Actuary, SeniorActuary, Auditor]
    code: 200
    input: ["limit?", "offset?"]
    output: ContributionPayment[]
    side_effects: []

  - method: POST
    path: "/v1/plans/{id}/pbgc-filings"
    description: "Create a PBGC premium filing (DRAFT) from a certified run; premium computed per pbgc_premium with market-value assets"
    roles: [PlanAdmin]
    code: 201
    input: [valuation_run_id, "premium_method?"]
    output: PBGCFiling
    side_effects: ["pbgc_premium computed", "participant_count, premium_target, market_assets, uvb, flat_rate_premium, variable_rate_premium, total_premium, cap_applied populated"]
  - method: GET
    path: "/v1/plans/{id}/pbgc-filings"
    description: "List PBGC filings of a plan (reverse reachability for PBGCFiling.plan_id)"
    roles: [PlanAdmin, Actuary, SeniorActuary, Auditor]
    code: 200
    input: ["limit?", "offset?"]
    output: PBGCFiling[]
    side_effects: []
  - method: GET
    path: "/v1/pbgc-filings/{id}"
    description: "Fetch a PBGC filing"
    roles: [PlanAdmin, Actuary, SeniorActuary, Auditor]
    code: 200
    input: []
    output: PBGCFiling
    side_effects: []
  - method: POST
    path: "/v1/pbgc-filings/{id}/file"
    description: "File a DRAFT or AMENDED filing; deadline plan_year-10-15T00:00:00Z; run must be CERTIFIED"
    roles: [PlanAdmin]
    code: 200
    input: []
    output: PBGCFiling
    side_effects: ["status -> FILED", "filed_at stamped"]
  - method: POST
    path: "/v1/pbgc-filings/{id}/amend"
    description: "Amend a FILED filing when a newer certified run changes premium inputs (FILED -> AMENDED with recomputed premium)"
    roles: [PlanAdmin]
    code: 200
    input: []
    output: PBGCFiling
    side_effects: ["status -> AMENDED", "premium fields recomputed", "filed_at cleared"]
  - method: POST
    path: "/v1/pbgc-filings/{id}/void"
    description: "Void a DRAFT filing"
    roles: [PlanAdmin]
    code: 200
    input: []
    output: PBGCFiling
    side_effects: ["status -> VOID"]

  - method: POST
    path: "/v1/plans/{id}/disclosure-reports"
    description: "Generate a financial-statement disclosure report (PBO at disclosure discount rate, market assets, funded status) from a certified run"
    roles: [PlanAdmin, Actuary, SeniorActuary]
    code: 201
    input: [valuation_run_id]
    output: DisclosureReport
    side_effects: ["disclosure_funded_status computed", "pbo, fair_value_assets, funded_status populated"]
  - method: GET
    path: "/v1/plans/{id}/disclosure-reports"
    description: "List disclosure reports of a plan (reverse reachability for DisclosureReport.plan_id)"
    roles: [PlanAdmin, Actuary, SeniorActuary, Auditor]
    code: 200
    input: ["limit?", "offset?"]
    output: DisclosureReport[]
    side_effects: []
  - method: GET
    path: "/v1/disclosure-reports/{id}"
    description: "Fetch a disclosure report"
    roles: [PlanAdmin, Actuary, SeniorActuary, Auditor]
    code: 200
    input: []
    output: DisclosureReport
    side_effects: []
  - method: POST
    path: "/v1/disclosure-reports/{id}/acknowledge"
    description: "Auditor acknowledgment of a DRAFT disclosure report (terminal)"
    roles: [Auditor]
    code: 200
    input: []
    output: DisclosureReport
    side_effects: ["status -> ACKNOWLEDGED", "acknowledged_by set"]

  - method: POST
    path: "/v1/_clock/set_current_utc"
    description: "Test-driving logical clock. Server startup default (before any set call) is exactly 2026-08-01T00:00:00Z and MUST NOT fall back to wall-clock time. All deadline, window, presumption, and delinquency logic reads this clock."
    roles: [FirmAdmin]
    code: 200
    input: [to_iso8601]
    output: { current_utc: datetime }
    side_effects: ["Logical clock advanced; ContributionDemand delinquency re-evaluated (OPEN/PARTIALLY_SATISFIED with outstanding > 0 and due_date < clock -> DELINQUENT with excise assessment)"]

# =============================================================================
# 1.6 Error Code Catalog
# =============================================================================
errors:
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "Missing or unrecognized X-User-Role / X-User-ID headers"
  - id: ERR_UNAUTHORIZED
    http: 403
    condition: "Recognized role is not permitted for the endpoint"
  - id: ERR_NOT_FOUND
    http: 404
    condition: "Path-referenced resource does not exist (plan, batch, participant, assumption set, statement, valuation, run, election, demand, payment, filing, report, actuary)"
  - id: ERR_VALIDATION
    http: 400
    condition: "Malformed body: missing required field, wrong type, invalid enum member, non-positive amount"
  - id: ERR_INVALID_PARTICIPANT_DATA
    http: 422
    condition: "Census row violates field constraints (attained age outside [60,63], negative amounts, status-inappropriate benefit fields) or batch screened with zero participants"
  - id: ERR_INVALID_STATE
    http: 409
    condition: "Entity not in a valid from-state for the requested transition (e.g. paying a SATISFIED demand, computing a COMPUTED run, approving a DRAFT set)"
  - id: ERR_PLAN_TERMINATED
    http: 409
    condition: "Mutation attempted under a TERMINATED plan"
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 422
    condition: "Approver is the assumption set's preparer, or certifier is the valuation run's creator"
  - id: ERR_ACTUARY_NOT_ENROLLED
    http: 422
    condition: "Acting actuary's enrollment_status is not ENROLLED for approve/lock/certify"
  - id: ERR_FILING_DEADLINE_PASSED
    http: 422
    condition: "PBGC filing attempted after plan_year-10-15T00:00:00Z"
  - id: ERR_REVOCATION_WINDOW_EXPIRED
    http: 422
    condition: "Election revocation attempted at or after created_at + 21 days"
  - id: ERR_ELECTION_WINDOW_CONFLICT
    http: 409
    condition: "New election on a demand while another EFFECTIVE election's revocation window [created_at, created_at+21d) is still open"
  - id: ERR_PLAN_YEAR_MISMATCH
    http: 422
    condition: "Child plan_year differs from owning plan's plan_year, or cross-referenced entities belong to different plans/years"
  - id: ERR_ASSUMPTION_MISMATCH
    http: 422
    condition: "retirement_age differs from plan normal_retirement_age, or mortality_table is not TEST_TABLE_4AGE"
  - id: ERR_REFERENCE_NOT_LOCKED
    http: 422
    condition: "Compute attempted with census batch or assumption set not LOCKED, or asset valuation of a different plan"
  - id: ERR_VALUATION_RUN_NOT_CERTIFIED
    http: 422
    condition: "PBGC filing or disclosure generation referencing a run that is not CERTIFIED"
  - id: ERR_CENSUS_YEAR_CONFLICT
    http: 409
    condition: "Another census batch of the plan is already VALIDATED or LOCKED for the same plan_year"
  - id: ERR_ASSUMPTION_YEAR_CONFLICT
    http: 409
    condition: "Another assumption set of the plan is already LOCKED for the same plan_year"
  - id: ERR_UNIQUENESS_VIOLATION
    http: 409
    condition: "Assumption set referenced by a live run on reopen; duplicate asset statement for (plan, plan_year); duplicate participant external_ref within a batch"
  - id: ERR_NO_AMENDMENT_DELTA
    http: 422
    condition: "Amend attempted while the plan's currently CERTIFIED run is the same run the filing already references (no superseding certification since the filing was created)"
  - id: ERR_CREDIT_BALANCE_EXCEEDED
    http: 422
    condition: "Election amount exceeds carryover_balance + prefunding_balance"
  - id: ERR_OVERPAYMENT
    http: 422
    condition: "Payment amount exceeds demand outstanding_amount"
  - id: ERR_STALE_VERSION
    http: 412
    condition: "expected_plan_version does not match the plan's current version (OCC)"

# =============================================================================
# 1.7 RBAC Matrix
# =============================================================================
roles:
  - name: FirmAdmin
    description: "Actuarial firm operations administrator; manages actuary registry and the logical clock"
    identity: opaque
    exclusive_operations:
      - "POST /v1/actuaries"
      - "POST /v1/_clock/set_current_utc"
    shared_operations:
      - "GET read endpoints"
  - name: PlanAdmin
    description: "Plan sponsor administrator; owns census, assets, contributions, elections, PBGC filings, disclosures"
    identity: opaque
    exclusive_operations:
      - "POST /v1/plans"
      - "POST /v1/plans/{id}/terminate"
      - "census batch create/screen/lock and participant upload"
      - "asset statement creation"
      - "credit-balance election create/revoke and contribution payments"
      - "PBGC filing create/file/amend/void"
    shared_operations:
      - "GET read endpoints"
      - "POST /v1/plans/{id}/disclosure-reports"
  - name: Actuary
    description: "Preparing actuary; builds assumption sets and valuation runs but cannot approve or certify"
    identity: "entity_backed:Actuary"
    exclusive_operations:
      - "POST /v1/assumption-sets/{id}/submit"
      - "POST /v1/valuation-runs/{id}/void"
    shared_operations:
      - "assumption set create/retire"
      - "asset valuation computation"
      - "valuation run create/compute"
      - "POST /v1/plans/{id}/disclosure-reports"
      - "GET read endpoints"
  - name: SeniorActuary
    description: "Enrolled reviewing actuary; approves/locks assumption sets and certifies runs; must not be the preparer/creator (segregation of duties)"
    identity: "entity_backed:Actuary"
    exclusive_operations:
      - "POST /v1/assumption-sets/{id}/approve"
      - "POST /v1/assumption-sets/{id}/reject"
      - "POST /v1/assumption-sets/{id}/lock"
      - "POST /v1/assumption-sets/{id}/reopen"
      - "POST /v1/valuation-runs/{id}/certify"
    shared_operations:
      - "assumption set create/retire"
      - "asset valuation computation"
      - "valuation run create/compute"
      - "POST /v1/plans/{id}/disclosure-reports"
      - "GET read endpoints"
  - name: Auditor
    description: "External auditor; read-only plus disclosure acknowledgment"
    identity: opaque
    exclusive_operations:
      - "POST /v1/disclosure-reports/{id}/acknowledge"
    shared_operations:
      - "GET read endpoints"
