      - name: rate_filing_disapproval_records_reviewer_and_note
        claim_type: valid_transition
        grounds:
          - state_machines.RateFiling.FILED_to_DISAPPROVED
          - endpoints[POST /fair-plan/rate-filings/{id}/review]
        distinguishing_aspect: "decision DISAPPROVE moves FILED -> DISAPPROVED, writes reviewed_by_user_id = reg-1 and review_note, and leaves differential_pct at the 0.1250 computed at filing time."
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00Z; one HURRICANE zone; one FILED BASIC_FIRE_EO filing at 900 / 800 effective 2026-08-01 filed by ra-1."
          setup_api_calls:
