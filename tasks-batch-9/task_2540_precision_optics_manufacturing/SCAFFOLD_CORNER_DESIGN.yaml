      - name: design_release_moves_toleranced_to_released_without_touching_the_stack
        claim_type: valid_transition
        grounds:
          - state_machines.OpticalDesign.TOLERANCED_to_RELEASED
          - endpoints.POST_/optics/optical-designs/{id}/release
          - calculations.tolerance_stack_analysis
          - errors.ERR_DESIGN_NOT_RELEASED
        distinguishing_aspect: |
          The release transition has exactly one side effect — design_status becomes RELEASED — so the
          four stack outputs written by the analysis must survive it byte for byte, the version must
          advance by exactly one per write (1 -> 2 -> 3), and the design must immediately stop accepting
          new tolerance allocations with ERR_DESIGN_NOT_RELEASED because priority 13 requires DRAFT.
        test_recipe:
          setup:
            - "A DRAFT design OD-2540-A with a single ACTIVE allocation of 1.5 waves/unit * 0.0250 units = 0.0375 waves."
            - "The tolerance analysis has already run: STATISTICAL, so governing_stack_waves == rss_stack_waves == 0.0375 <= budget 0.0800 and tolerance_verdict == PASS; design_status TOLERANCED, version 2."
            - "The logical clock stays at its start value 2026-08-01T00:00:00Z throughout."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlantAdmin
            - call: "POST /optics/optical-designs"
              payload: { design_code: "OD-2540-A", aperture_mm: 120.0, wavelength_min_nm: 450, wavelength_max_nm: 700, required_rms_wavefront_waves: 0.0400, tolerance_budget_waves: 0.0800, transmitted_wavefront_budget_waves: 0.1050 }
              as: OpticsEngineer
              captures: { d1: $.data.id }
            - call: "POST /optics/optical-designs/${d1}/tolerance-allocations"
              payload: { contributor_type: "SURFACE_IRREGULARITY", sensitivity_waves_per_unit: 1.5, manufacturing_tolerance_units: 0.0250 }
              as: OpticsEngineer
              captures: { t1: $.data.id }
            - call: "POST /optics/optical-designs/${d1}/tolerance-analysis"
              payload: {}
              as: OpticsEngineer
          trigger:
            - call: "POST /optics/optical-designs/${d1}/release"
              payload: {}
              as: OpticsEngineer
            - call: "GET /optics/optical-designs/${d1}"
              payload: {}
              as: OpticsEngineer
            - call: "POST /optics/optical-designs/${d1}/tolerance-allocations"
              payload: { contributor_type: "SURFACE_IRREGULARITY", sensitivity_waves_per_unit: 1.5, manufacturing_tolerance_units: 0.0250 }
              as: OpticsEngineer
            - call: "GET /optics/optical-designs"
              payload: { design_status: "RELEASED", limit: 10, offset: 0 }
              as: OpticsEngineer
          assert:
            - "the release returns HTTP 200"
            - "OpticalDesign.${d1}.design_status == RELEASED"
            - "OpticalDesign.${d1}.rss_stack_waves == 0.0375 and worst_case_stack_waves == 0.0375"
            - "OpticalDesign.${d1}.governing_stack_waves == 0.0375 and allocated_tolerance_waves == 0.0375"
            - "OpticalDesign.${d1}.tolerance_verdict == PASS"
            - "OpticalDesign.${d1}.version == 3"
            - "the second allocation attempt returns HTTP 409 with error_id ERR_DESIGN_NOT_RELEASED"
            - "OpticalDesign.${d1}.version == 3 after the refused allocation"
            - "the filtered list returns total_count == 1 with data[0].id == ${d1}"

