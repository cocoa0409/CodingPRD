      - name: volume_and_count_alerts_are_suppressed_by_the_parent_profile_state_while_ratios_and_the_nested_signal_survive
        grounds:
          - calculations.alert_generation
          - calculations.monitoring_threshold_calibration
          - entities.TransactionMonitoringProfile.fields.calibration_state
          - entities.ActivityObservation.fields.breach_ratio
          - state_machines.TransactionMonitoringProfile.CALIBRATED_to_RECALIBRATION_REQUIRED
        distinguishing_aspect: |
          A different entity pair from the refresh instance: which MonitoringAlert rows an
          ActivityObservation create produces depends on the parent TransactionMonitoringProfile's
          calibration_state, while the observation's own numeric fields do not. The same observation
          payload posted against a CALIBRATED profile yields two alerts (VOLUME_BREACH CRITICAL and
          COUNT_BREACH HIGH) and against a RECALIBRATION_REQUIRED profile yields only the
          NESTED_ACTIVITY_UNDISCLOSED alert - yet usd_threshold_applied, count_threshold_applied and
          breach_ratio are written identically in both cases because REQUIRE_RECALIBRATION retains
          corridor_thresholds. Implementations that gate on the retained thresholds rather than on
          calibration_state raise four alerts; implementations that skip the whole calculation when
          the profile is not CALIBRATED lose the nested signal and write breach_ratio 0.0000.
        test_recipe:
          setup: >
            JurisdictionProfile DE (basel_aml_index 4.0, PERMITTED, fatf_listing NONE, secrecy_flag
            false, corridor_risk_weight 1.00, max_permitted_risk_rating HIGH). Respondent I home DE,
            expected_monthly_volume_usd 1000000.00, expected_monthly_count 40,
            nested_activity_permitted false, licensed ACTIVE/GOOD_STANDING, one VERIFIED
            natural-person owner at 100.00% in DE and eight self_rating 3 rows assessed under
            ONBOARDING_PROVISIONAL: control_score 60.00, control_credit 0.2250,
            inherent_risk_score 8.00 + 0 + 0 + 6 = 14.00, residual round(14.00*0.7750, 2) = 10.85,
            risk_rating LOW. The committee approves at clock 2026-08-01T00:00:00Z. A monitoring
            profile is opened over the CLOSED interval [2026-07-01T00:00:00Z, 2026-12-31T00:00:00Z]
            with tolerance_pct 0.20 and the single corridor DE (expected_monthly_usd 1000000.00,
            expected_monthly_count 40) and calibrated: rating_factor[LOW] = 1.30, so
            usd_threshold = round(1000000.00*1.20*1.30/1.00, 2) = 1560000.00,
            count_threshold = max(5, ceil(40*1.20*1.30)) = ceil(62.4) = 63,
            aggregate_usd_threshold = round(1560000.00*1.10, 2) = 1716000.00 and
            hold_threshold_usd = 171600.00. No NestedRelationship rows exist, so known_nested is 0.
          setup_api_calls:
            - { call: "POST /correspondent-banking/jurisdiction-profiles", payload: { jurisdiction_code: "DE", name: "Germany", basel_aml_index: 4.0, corridor_risk_weight: 1.00, sanctions_status: "PERMITTED", fatf_listing: "NONE", secrecy_flag: false, max_permitted_risk_rating: "HIGH" }, as: PlatformAdmin }
            - { call: "POST /correspondent-banking/respondents", payload: { legal_name: "Rheinstrom Privatbank AG", swift_bic: "RHSTDEM0XXX", home_jurisdiction_code: "DE", relationship_manager_user_id: "user-rm-01", expected_monthly_volume_usd: 1000000.00, expected_monthly_count: 40, nested_activity_permitted: false }, as: FIGRelationshipManager, as_user_id: "user-rm-01", captures: { i_id: $.data.id } }
            - { call: "POST /correspondent-banking/respondents/${i_id}/licensing-verification", payload: { license_status: "ACTIVE", regulator_standing: "GOOD_STANDING", regulator_name: "BaFin" }, as: ComplianceAnalyst, as_user_id: "user-analyst-01" }
            - { call: "POST /correspondent-banking/respondents/${i_id}/beneficial-owners", payload: { owner_name: "Rheinstrom Familienholding", owner_type: "NATURAL_PERSON", ownership_pct: 100.00, country_of_residence: "DE", is_pep: false }, as: ComplianceAnalyst, as_user_id: "user-analyst-01", captures: { i_own: $.data.id } }
            - { call: "POST /correspondent-banking/beneficial-owners/${i_own}/verification", payload: { action: "VERIFY" }, as: ComplianceAnalyst, as_user_id: "user-analyst-01" }
            - { call: "GET /correspondent-banking/respondents/${i_id}", as: ComplianceAnalyst, as_user_id: "user-analyst-01", captures: { iv0: $.data.version } }
            - { call: "POST /correspondent-banking/respondents/${i_id}/questionnaires", payload: { questionnaire_version: 1, expected_respondent_version: "${iv0}", declared_nested_activity: false, declared_downstream_count: 0 }, as: RespondentContact, as_user_id: "${i_id}", captures: { iq: $.data.id } }
            - { call: "POST /correspondent-banking/questionnaires/${iq}/control-assessments", payload: { control_domain: "GOVERNANCE", self_rating: 3 }, as: RespondentContact, as_user_id: "${i_id}" }
            - { call: "POST /correspondent-banking/questionnaires/${iq}/control-assessments", payload: { control_domain: "KYC_ONBOARDING", self_rating: 3 }, as: RespondentContact, as_user_id: "${i_id}" }
            - { call: "POST /correspondent-banking/questionnaires/${iq}/control-assessments", payload: { control_domain: "TRANSACTION_MONITORING", self_rating: 3 }, as: RespondentContact, as_user_id: "${i_id}" }
            - { call: "POST /correspondent-banking/questionnaires/${iq}/control-assessments", payload: { control_domain: "SANCTIONS_SCREENING", self_rating: 3 }, as: RespondentContact, as_user_id: "${i_id}" }
            - { call: "POST /correspondent-banking/questionnaires/${iq}/control-assessments", payload: { control_domain: "PEP_HANDLING", self_rating: 3 }, as: RespondentContact, as_user_id: "${i_id}" }
            - { call: "POST /correspondent-banking/questionnaires/${iq}/control-assessments", payload: { control_domain: "TRAINING", self_rating: 3 }, as: RespondentContact, as_user_id: "${i_id}" }
            - { call: "POST /correspondent-banking/questionnaires/${iq}/control-assessments", payload: { control_domain: "AUDIT", self_rating: 3 }, as: RespondentContact, as_user_id: "${i_id}" }
            - { call: "POST /correspondent-banking/questionnaires/${iq}/control-assessments", payload: { control_domain: "NESTED_CONTROLS", self_rating: 3 }, as: RespondentContact, as_user_id: "${i_id}" }
            - { call: "POST /correspondent-banking/questionnaires/${iq}/submission", payload: {}, as: RespondentContact, as_user_id: "${i_id}" }
            - { call: "POST /correspondent-banking/questionnaires/${iq}/assessment-decision", payload: { action: "ASSESS", variant: "ONBOARDING_PROVISIONAL" }, as: ComplianceAnalyst, as_user_id: "user-analyst-01" }
            - { call: "POST /correspondent-banking/respondents/${i_id}/risk-assessment", payload: { variant: "ONBOARDING_PROVISIONAL" }, as: ComplianceAnalyst, as_user_id: "user-analyst-01" }
            - { call: "POST /correspondent-banking/respondents/${i_id}/approval", payload: { action: "APPROVE" }, as: CommitteeApprover, as_user_id: "user-committee-01" }
            - { call: "GET /correspondent-banking/respondents/${i_id}", as: ComplianceAnalyst, as_user_id: "user-analyst-01", captures: { iv1: $.data.version } }
            - { call: "POST /correspondent-banking/respondents/${i_id}/monitoring-profiles", payload: { effective_from: "2026-07-01T00:00:00Z", effective_to: "2026-12-31T00:00:00Z", tolerance_pct: 0.20, expected_respondent_version: "${iv1}", expected_corridors: [ { jurisdiction_code: "DE", expected_monthly_usd: 1000000.00, expected_monthly_count: 40 } ] }, as: ComplianceAnalyst, as_user_id: "user-analyst-01", captures: { i_prof: $.data.id } }
            - { call: "POST /correspondent-banking/monitoring-profiles/${i_prof}/calibration", payload: { action: "CALIBRATE" }, as: ComplianceAnalyst, as_user_id: "user-analyst-01" }
          trigger:
            - { call: "POST /correspondent-banking/monitoring-profiles/${i_prof}/observations", payload: { period_month: "2026-07", corridor_jurisdiction_code: "DE", aggregate_usd: 5000000.00, txn_count: 130, distinct_downstream_count: 0 }, as: ComplianceAnalyst, as_user_id: "user-analyst-01", captures: { obs_a: $.data.id } }
            - { call: "POST /correspondent-banking/monitoring-profiles/${i_prof}/calibration", payload: { action: "REQUIRE_RECALIBRATION", recalibration_reason: "OFFICER_ACTION" }, as: ComplianceAnalyst, as_user_id: "user-analyst-01" }
            - { call: "POST /correspondent-banking/monitoring-profiles/${i_prof}/observations", payload: { period_month: "2026-08", corridor_jurisdiction_code: "DE", aggregate_usd: 5000000.00, txn_count: 130, distinct_downstream_count: 1 }, as: ComplianceAnalyst, as_user_id: "user-analyst-01", captures: { obs_b: $.data.id } }
          assert:
            - "before the trigger: TransactionMonitoringProfile.${i_prof}.calibration_state == CALIBRATED and aggregate_usd_threshold == 1716000.00 and hold_threshold_usd == 171600.00"
            - "before the trigger: corridor_thresholds == [{jurisdiction_code: DE, usd_threshold: 1560000.00, count_threshold: 63}]"
            - "trigger call 1 HTTP status == 201 and ActivityObservation.${obs_a}.alerts_created_count == 2"
            - "ActivityObservation.${obs_a}.usd_threshold_applied == 1560000.00 and ActivityObservation.${obs_a}.count_threshold_applied == 63"
            - "ActivityObservation.${obs_a}.breach_ratio == 3.2051   # round(5000000.00/1560000.00, 4) = round(3.205128..., 4)"
            - "the MonitoringAlert rows created by trigger call 1, in created_at ASC order, are exactly [VOLUME_BREACH severity CRITICAL breach_ratio 3.2051, COUNT_BREACH severity HIGH breach_ratio null]   # 3.2051 >= 3.0000 and 130 >= 2*63 = 126"
            - "trigger call 2 HTTP status == 200 and TransactionMonitoringProfile.${i_prof}.calibration_state == RECALIBRATION_REQUIRED and recalibration_reason == OFFICER_ACTION"
            - "after trigger call 2: corridor_thresholds, aggregate_usd_threshold and hold_threshold_usd are unchanged (1560000.00 / 63 / 1716000.00 / 171600.00)   # REQUIRE_RECALIBRATION does not clear the calibration output"
            - "trigger call 3 HTTP status == 201 and ActivityObservation.${obs_b}.alerts_created_count == 1"
            - "ActivityObservation.${obs_b}.usd_threshold_applied == 1560000.00 and ActivityObservation.${obs_b}.count_threshold_applied == 63 and ActivityObservation.${obs_b}.breach_ratio == 3.2051   # the numeric fields do not depend on calibration_state"
            - "the only MonitoringAlert row created by trigger call 3 is NESTED_ACTIVITY_UNDISCLOSED with severity CRITICAL and breach_ratio null   # strict >: 1 > known_nested 0, and nested_activity_permitted is false"
            - "GET /correspondent-banking/monitoring-alerts?respondent_bank_id=${i_id} returns exactly 3 rows   # no VOLUME_BREACH or COUNT_BREACH from the second observation"
            - "RespondentBank.${i_id}.risk_rating == LOW and RespondentBank.${i_id}.dd_state == APPROVED   # observations and alerts alone do not restrict the respondent"

  - rule_id: resource_temporal_overlap
    instances:
      - name: monitoring_profile_intervals_are_closed_so_both_shared_endpoints_collide_and_one_second_clear_of_either_is_legal
        grounds:
          - validations[priority=37]
          - entities.TransactionMonitoringProfile.fields.effective_from
          - entities.TransactionMonitoringProfile.fields.effective_to
          - concurrency_rules[monitoring-profile-create-stale-respondent]
          - calculations.monitoring_threshold_calibration
        distinguishing_aspect: |
          CLOSED-interval semantics probed from BOTH ends on the same anchor profile: a create whose
          effective_from equals the anchor's effective_to and a create whose effective_to equals the
          anchor's effective_from must both be 409 ERR_MONITORING_INTERVAL_OVERLAP, while creates one
          second clear of either endpoint succeed. Because the rejected creates must not bump
          RespondentBank.version, the same expected_respondent_version can be replayed across the
          two failures and the following success - an implementation that increments the version on
          a failed create turns the third call into a 412 ERR_STALE_RESPONDENT_VERSION instead of a
          201.
        test_recipe:
          setup: >
            JurisdictionProfile DE (basel_aml_index 4.0, PERMITTED, NONE, secrecy_flag false,
            corridor_risk_weight 1.00, max_permitted_risk_rating HIGH). Respondent J home DE,
            expected_monthly_volume_usd 4000000.00, expected_monthly_count 150,
            nested_activity_permitted false, licensed, one VERIFIED 100.00% DE natural-person owner,
            eight self_rating 3 rows assessed ONBOARDING_PROVISIONAL (control_score 60.00,
            control_credit 0.2250), inherent 8.00 + 0 + 0 + 6 = 14.00, residual 10.85, risk_rating
            LOW, approved by the committee at clock 2026-08-01T00:00:00Z. One anchor monitoring
            profile is opened over the CLOSED interval [2026-01-01T00:00:00Z, 2026-06-30T00:00:00Z]
            with tolerance_pct 0.10 and corridor DE (expected_monthly_usd 4000000.00,
            expected_monthly_count 150) and calibrated: usd_threshold =
            round(4000000.00*1.10*1.30/1.00, 2) = 5720000.00, count_threshold = ceil(214.5) = 215,
            aggregate_usd_threshold = round(5720000.00*1.10, 2) = 6292000.00 and hold_threshold_usd
            = 629200.00.
