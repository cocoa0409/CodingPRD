      - name: run_write_guard_ladder_state_then_reading_count_then_offset_sequence
        claim_type: priority_conflict
        grounds:
          - validations[priority=24]
          - validations[priority=51]
          - validations[priority=52]
          - errors[ERR_RUN_STATE_INVALID]
          - errors[ERR_READING_SEQUENCE_INVALID]
          - errors[ERR_RUN_READINGS_INSUFFICIENT]
          - state_machines.PasteurizationRun.IN_PROGRESS_to_COMPLETED
        distinguishing_aspect: "Completing a SCHEDULED run reports ERR_RUN_STATE_INVALID (priority 24) and not the reading-count failure, because the state gate outranks it; once one reading has started the run the same call reports ERR_RUN_READINGS_INSUFFICIENT; a repeated offset_seconds is refused by the strict-increase rule; and after completion both a second complete and a further reading fall back to ERR_RUN_STATE_INVALID."
