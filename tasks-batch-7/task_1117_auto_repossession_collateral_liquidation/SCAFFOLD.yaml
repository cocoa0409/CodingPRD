# =============================================================================
# Scaffold: Auto Repossession & Collateral Liquidation (auto lender recovery unit)
# §1.0–§1.7 only. §1.8 lives in SCAFFOLD_DIFFICULTY_DESIGN.yaml;
# §1.9 lives in SCAFFOLD_CORNER_DESIGN.yaml.
# =============================================================================

scenario: |
  1117. Auto Repossession & Collateral Liquidation (auto lender recovery unit):
  default determination & right-to-cure notice, repossession assignment & agent
  compliance, personal property inventory & return, redemption period &
  reinstatement quote, auction consignment & reserve pricing, deficiency balance
  calculation & notice requirements, wrongful-repossession complaint handling,
  recovery accounting & vendor performance

domain_name: auto-repossession-liquidation
api_prefix: ""

complexity_profile:
  primary_archetype: compliance_audit        # statutory windows, certification gates, segregation of duties, immutable ledger
  secondary_archetype: ledger_reconciliation # deficiency balance: provisional estimate vs final settled figures
  complexity_layers:
    - dual_variant_calculation   # deficiency PROVISIONAL vs FINAL; agent score LIFETIME vs ROLLING_90D
    - cascading_side_effects     # breach-of-peace suspension cascade; complaint-upheld restitution cascade
    - optimistic_concurrency     # OCC on RecoveryCase.version for supersede-creating notices/quotes
    - selector_policy            # auto-assignment picks one RepoAgent from an eligible pool
  entity_topology: flat                      # peer entities joined by FK references; no nested URL ownership
  state_machine_shape: branching             # fork-heavy pipeline + complaint-review reversion cycle on RecoveryCase
  relationship_patterns:
    - one_to_many
    - cross_aggregate
  role_model: segregation_of_duties          # case opener cannot certify its sale nor adjudicate its complaint
  consistency_model: immediate               # every mutation + cascade is atomic within the request

# =============================================================================
# §1.0 Response Envelope (FIXED — emit verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Borrower
    parent: null
    common_fields: true
    fields:
      - { name: full_name, type: string, source: input, description: "Borrower legal name" }
      - { name: state_code, type: string, source: input, description: "Two-letter US state of borrower residence; drives agent licensing checks" }
      - { name: email, type: string, source: input, description: "Contact email" }

  - name: LoanAccount
    parent: null
    common_fields: true
    fields:
      - { name: borrower_id, type: string, source: input, description: "FK -> Borrower.id; loan owner" }
      - { name: vin, type: string, source: input, description: "Collateral vehicle VIN" }
      - { name: governing_state_code, type: string, source: input, description: "State whose statute governs the loan; used for agent license checks" }
      - { name: principal_balance_cents, type: integer, source: input, description: "Outstanding principal at case opening; never mutated afterwards (payments tracked via paid_to_date_cents)" }
      - { name: apr_bps, type: integer, source: input, description: "Annual percentage rate in basis points, e.g. 1200 = 12%" }
      - { name: monthly_payment_cents, type: integer, source: input, description: "Scheduled installment amount" }
      - { name: missed_installments, type: integer, source: input, default: 0, description: "Count of unpaid scheduled installments at case opening" }
      - { name: accrued_interest_cents, type: integer, source: input, default: 0, description: "Interest arrears at case opening (excludes per-diem accrual after case opening)" }
      - { name: late_fees_cents, type: integer, source: input, default: 0, description: "Unpaid late fees at case opening" }
      - { name: paid_to_date_cents, type: integer, source: computed, default: 0, description: "Cumulative borrower payments net of reversals; every PAYMENT ledger entry increments it, every REVERSAL decrements it" }
      - { name: total_outstanding_cents, type: integer, source: computed, description: "= principal_balance_cents + accrued_interest_cents + late_fees_cents - paid_to_date_cents (per-diem interest NOT included)" }
      - { name: status, type: enum, source: system, description: "CURRENT | IN_DEFAULT | REDEEMED_PAID | CHARGED_OFF", constraints: "CURRENT at creation; IN_DEFAULT on case open; CURRENT again on reinstatement or complaint-upheld restitution; REDEEMED_PAID on redemption; CHARGED_OFF on case close from DEFICIENCY_NOTICED" }

  - name: RecoveryCase
    parent: null
    common_fields: true
    fields:
      - { name: loan_account_id, type: string, source: input, description: "FK -> LoanAccount.id; exactly one non-CLOSED case per loan" }
      - { name: default_reason, type: string, source: input, description: "Free-text default determination rationale" }
      - { name: opened_by_user_id, type: string, source: system, description: "X-User-ID of the RecoveryManager who opened the case; segregation-of-duties anchor" }
      - { name: status, type: enum, source: system, description: "OPENED | CURE_PENDING | CURED | CURE_EXPIRED | REPO_ACTIVE | COLLATERAL_SECURED | REDEMPTION_OPEN | REDEEMED | REINSTATED | CONSIGNMENT_PENDING | IN_AUCTION | SALE_CONFIRMED | DEFICIENCY_NOTICED | COMPLAINT_REVIEW | RESTITUTION | CLOSED" }
      - { name: cure_deadline, type: datetime, source: system, description: "= cure notice sent_at + CURE_PERIOD_DAYS (14); set when notice created" }
      - { name: redemption_deadline, type: datetime, source: system, description: "= first redemption quote issued_at + REDEMPTION_PERIOD_DAYS (10)" }
      - { name: pre_complaint_state, type: enum, source: system, description: "Case status captured when a complaint freezes the case; restored verbatim if complaint DISMISSED" }
      - { name: current_cure_notice_id, type: string, source: system, description: "Pointer to the live CureNotice; repointed (and version bumped) when a new notice supersedes" }
      - { name: current_redemption_quote_id, type: string, source: system, description: "Pointer to the live RedemptionQuote; repointed (and version bumped) when a new quote supersedes" }
      - { name: collateral_secured_at, type: datetime, source: system, description: "Logical-clock timestamp of report-secured; anchors property retention and storage windows" }
      - { name: odometer, type: integer, source: input, description: "Set via POST /repo-assignments/{id}/report-secured payload" }
      - { name: condition_grade, type: enum, source: input, description: "EXCELLENT | GOOD | FAIR | POOR; set via report-secured; drives reserve grade multiplier" }
      - { name: trade_in_value_cents, type: integer, source: input, description: "Clean trade-in appraisal; set via report-secured" }
      - { name: auction_guide_low_cents, type: integer, source: input, description: "Wholesale auction guide low value; set via report-secured" }
      - { name: sold_at, type: datetime, source: system, description: "Logical-clock timestamp of sale certification; anchors the deficiency notice window" }
      - { name: property_item_count, type: integer, source: computed, default: 0, description: "Total PersonalPropertyItem rows ever created for this case; never decremented (custody invariant anchor)" }

  - name: CureNotice
    parent: null
    common_fields: true
    fields:
      - { name: recovery_case_id, type: string, source: system, description: "FK -> RecoveryCase.id; set from path" }
      - { name: status, type: enum, source: system, description: "SENT | CURED | EXPIRED | SUPERSEDED", constraints: "created directly in SENT" }
      - { name: sent_at, type: datetime, source: system, description: "Logical-clock timestamp of creation" }
      - { name: cure_amount_cents, type: integer, source: computed, description: "Snapshot of cure_amount calculation at creation; never recomputed afterwards" }
      - { name: superseded_by_id, type: string, source: system, description: "CureNotice.id of the notice that superseded this one; null unless status SUPERSEDED" }

  - name: RepoAgent
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Vendor legal name" }
      - { name: license_number, type: string, source: input, description: "Repossession license number" }
      - { name: licensed_state_codes, type: array, source: input, description: "Array of two-letter state codes the agent is licensed in" }
      - { name: max_active_assignments, type: integer, source: input, description: "Capacity cap: count of assignments with status IN {ASSIGNED, ACCEPTED} must stay strictly below this" }
      - { name: status, type: enum, source: system, description: "ACTIVE | SUSPENDED", constraints: "ACTIVE at creation; SUSPENDED via manual suspend or score auto-suspension; SUSPENDED is terminal (no reinstatement path)" }
      - { name: performance_score_lifetime, type: integer, source: computed, default: 100, description: "Weighted score over ALL assignments of the agent (see agent_performance_score calc, LIFETIME variant)" }
      - { name: performance_score_rolling, type: integer, source: computed, default: 100, description: "Same formula restricted to assignments created within the trailing 90 days of the logical clock (ROLLING_90D variant); drives auto-suspension and auto-assignment ranking" }

  - name: RepoAssignment
    parent: null
    common_fields: true
    fields:
      - { name: recovery_case_id, type: string, source: system, description: "FK -> RecoveryCase.id; set from path" }
      - { name: agent_id, type: string, source: system, description: "FK -> RepoAgent.id; explicit input agent_id or server-selected" }
      - { name: status, type: enum, source: system, description: "ASSIGNED | ACCEPTED | SECURED | BREACHED_PEACE | EXPIRED | CANCELLED" }
      - { name: field_window_start, type: datetime, source: input, description: "Planned field-operation window start (half-open, inclusive)" }
      - { name: field_window_end, type: datetime, source: input, description: "Planned field-operation window end (half-open, exclusive)" }
      - { name: auto_selected, type: boolean, source: system, description: "True when the server picked the agent via the selector policy" }
      - { name: secured_fast, type: boolean, source: computed, default: false, description: "True when SECURED within FAST_SECURE_DAYS (14) of assignment creation; feeds the +2 score bonus" }

  - name: PersonalPropertyItem
    parent: null
    common_fields: true
    fields:
      - { name: recovery_case_id, type: string, source: system, description: "FK -> RecoveryCase.id; set from path" }
      - { name: description, type: string, source: input, description: "Item description from the inventory" }
      - { name: estimated_value_cents, type: integer, source: input, default: 0, description: "Optional value estimate" }
      - { name: status, type: enum, source: system, description: "INVENTORIED | CLAIMED | RETURNED | DISPOSED" }
      - { name: claimed_by_borrower_id, type: string, source: system, description: "Borrower.id that claimed the item; unclaim clears it" }

  - name: RedemptionQuote
    parent: null
    common_fields: true
    fields:
      - { name: recovery_case_id, type: string, source: system, description: "FK -> RecoveryCase.id; set from path" }
      - { name: quote_type, type: enum, source: input, description: "REDEMPTION (full payoff) | REINSTATEMENT (arrears + costs only)" }
      - { name: status, type: enum, source: system, description: "ISSUED | ACCEPTED | EXPIRED | SUPERSEDED" }
      - { name: issued_at, type: datetime, source: system, description: "Logical-clock timestamp of creation" }
      - { name: valid_until, type: datetime, source: system, description: "= case.redemption_deadline; accept at now <= valid_until is in-window" }
      - { name: quoted_amount_cents, type: integer, source: computed, description: "Snapshot of redemption_quote_amount for quote_type at issuance; never recomputed" }
      - { name: per_diem_cents, type: integer, source: computed, description: "Per-diem interest rate snapshot used for REDEMPTION quotes; 0 on REINSTATEMENT quotes" }
      - { name: superseded_by_id, type: string, source: system, description: "RedemptionQuote.id of the quote that superseded this one; null unless SUPERSEDED" }

  - name: AuctionHouse
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Auction vendor name" }
      - { name: fee_bps, type: integer, source: input, description: "Auction commission in basis points of gross sale, e.g. 500 = 5%" }
      - { name: transport_fee_cents, type: integer, source: input, description: "Flat transport/transport-in fee charged per sold vehicle" }

  - name: Consignment
    parent: null
    common_fields: true
    fields:
      - { name: recovery_case_id, type: string, source: system, description: "FK -> RecoveryCase.id; set from path" }
      - { name: auction_house_id, type: string, source: input, description: "FK -> AuctionHouse.id" }
      - { name: status, type: enum, source: system, description: "DRAFT | LISTED | UNSOLD | SOLD | WITHDRAWN" }
      - { name: reserve_price_cents, type: integer, source: computed, description: "reserve_price calc at creation; recomputed with RELIST_MARKDOWN on each relist" }
      - { name: listing_start, type: datetime, source: input, description: "Auction listing window start (closed interval, inclusive); set by list/relist" }
      - { name: listing_end, type: datetime, source: input, description: "Auction listing window end (closed interval, inclusive); set by list/relist" }
      - { name: relist_count, type: integer, source: system, default: 0, description: "Number of UNSOLD -> LISTED cycles this consignment has undergone" }
      - { name: consignment_seq, type: integer, source: system, description: "Per-case monotonically increasing creation sequence (1 for the first consignment of a case, 2 for the next, ...); the deterministic 'latest consignment' key used by the deficiency estimate — created_at may tie under the logical clock, this never does" }

  - name: SaleRecord
    parent: null
    common_fields: true
    fields:
      - { name: consignment_id, type: string, source: system, description: "FK -> Consignment.id; set from report-sale path; at most one non-VOID SaleRecord per consignment" }
      - { name: gross_sale_cents, type: integer, source: input, description: "Hammer price reported by the auctioneer" }
      - { name: auction_fee_cents, type: integer, source: computed, description: "= round_half_up(gross_sale_cents * fee_bps / 10000) of the consignment's AuctionHouse" }
      - { name: transport_fee_cents, type: integer, source: computed, description: "Snapshot of AuctionHouse.transport_fee_cents at report time" }
      - { name: net_proceeds_cents, type: integer, source: computed, description: "= gross_sale_cents - auction_fee_cents - transport_fee_cents (each fee line rounded to cents individually BEFORE subtraction)" }
      - { name: status, type: enum, source: system, description: "PENDING_CERTIFICATION | CERTIFIED | VOID" }

  - name: DeficiencyNotice
    parent: null
    common_fields: true
    fields:
      - { name: recovery_case_id, type: string, source: system, description: "FK -> RecoveryCase.id; set from path" }
      - { name: status, type: enum, source: system, description: "DRAFT | SENT | DISPUTED | PAID | WAIVED | VOID" }
      - { name: deficiency_amount_cents, type: integer, source: computed, description: "FINAL deficiency_balance variant snapshot at creation; revise adjusts it by adjustment_cents" }
      - { name: surplus_cents, type: integer, source: computed, default: 0, description: "Amount owed TO the borrower when sale proceeds exceed total owed; deficiency_amount_cents is 0 whenever surplus_cents > 0" }
      - { name: paid_cents, type: integer, source: computed, default: 0, description: "Cumulative deficiency payments recorded against this notice" }
      - { name: sent_at, type: datetime, source: system, description: "Logical-clock timestamp of send" }

  - name: Complaint
    parent: null
    common_fields: true
    fields:
      - { name: recovery_case_id, type: string, source: system, description: "FK -> RecoveryCase.id; set from path" }
      - { name: borrower_id, type: string, source: system, description: "FK -> Borrower.id; = X-User-ID of the filer" }
      - { name: category, type: enum, source: input, description: "WRONGFUL_REPOSSESSION | BREACH_OF_PEACE | PROPERTY_LOSS | DEFICIENCY_DISPUTE | NOTICE_DEFECT" }
      - { name: description, type: string, source: input, description: "Complaint narrative" }
      - { name: status, type: enum, source: system, description: "UNDER_REVIEW | UPHELD | DISMISSED", constraints: "created directly in UNDER_REVIEW" }
      - { name: resolved_by_user_id, type: string, source: system, description: "X-User-ID of resolving ComplianceOfficer" }

  - name: RecoveryLedgerEntry
    parent: null
    common_fields: false   # append-only: id + created_at only; no update endpoint, no version
    fields:
      - { name: recovery_case_id, type: string, source: system, description: "FK -> RecoveryCase.id; set from path" }
      - { name: kind, type: enum, source: input, description: "COST_REPO_FEE | COST_STORAGE | COST_TRANSPORT | COST_KEY | COST_OTHER | ADJUSTMENT for manual entries; system-only kinds: PAYMENT | REVERSAL | REFUND", constraints: "manual POST accepts only the COST_* kinds and ADJUSTMENT; PAYMENT/REVERSAL/REFUND are written by system transitions" }
      - { name: amount_cents, type: integer, source: input, description: "Positive amount; direction is implied by kind (COST_*/ADJUSTMENT increase borrower-owed costs; PAYMENT decreases; REVERSAL undoes a PAYMENT; REFUND pays surplus out)" }
      - { name: memo, type: string, source: input, default: "", description: "Optional free-text note" }
      - { name: reverses_entry_id, type: string, source: system, description: "For REVERSAL entries: RecoveryLedgerEntry.id of the PAYMENT being reversed" }

# =============================================================================
# §1.2 State Machine Table
# All "now" references mean the logical clock (POST /_clock/set_current_utc).
# Automatic transitions are applied atomically, in dependency order, by the
# clock-set endpoint; no wall-clock waiting exists anywhere in this scaffold.
# =============================================================================
state_machines:
  - entity: LoanAccount
    initial_state: CURRENT
    terminal_states: [REDEEMED_PAID, CHARGED_OFF]
    transitions:
      - from: CURRENT
        to: IN_DEFAULT
        trigger: "POST /recovery-cases (case creation is the default determination)"
        actor: RecoveryManager
        preconditions:
          - "No other RecoveryCase for this loan in a non-CLOSED status (ERR_DUPLICATE_OPEN_CASE)"
        side_effects:
          - "LoanAccount.version increments"
      - from: IN_DEFAULT
        to: CURRENT
        trigger: "POST /recovery-cases/{id}/cure-payments (full in-window cure), POST /redemption-quotes/{id}/accept with quote_type REINSTATEMENT, or complaint resolve UPHELD (restitution)"
        actor: system
        preconditions:
          - "Cure payment covers cure_amount_cents in full within the window, or reinstatement payment covers quoted_amount_cents in full, or complaint resolved UPHELD"
        side_effects:
          - "On complaint-upheld restitution: paid_to_date_cents decremented by every reversed PAYMENT (net effect: loan restored as if the case's payments never happened)"
      - from: IN_DEFAULT
        to: REDEEMED_PAID
        trigger: "POST /redemption-quotes/{id}/accept with quote_type REDEMPTION"
        actor: system
        preconditions:
          - "Payment covers quoted_amount_cents in full"
        side_effects: []
      - from: IN_DEFAULT
        to: CHARGED_OFF
        trigger: "POST /recovery-cases/{id}/close when case is DEFICIENCY_NOTICED"
        actor: RecoveryManager
        preconditions:
          - "Case status == DEFICIENCY_NOTICED and every DeficiencyNotice of the case is in {PAID, WAIVED, VOID}"
        side_effects: []

  - entity: RecoveryCase
    initial_state: OPENED
    terminal_states: [CLOSED]
    transitions:
      - from: OPENED
        to: CURE_PENDING
        trigger: "POST /recovery-cases/{id}/cure-notices"
        actor: RecoveryManager
        preconditions:
          - "Case status IN {OPENED, CURE_PENDING} (ERR_INVALID_CASE_STATE)"
          - "expected_recovery_case_version == RecoveryCase.version (ERR_STALE_VERSION, 412)"
        side_effects:
          - "CureNotice created in SENT with cure_amount_cents snapshot; case.cure_deadline = sent_at + 14 days"
          - "case.current_cure_notice_id repointed; RecoveryCase.version increments"
      - from: CURE_PENDING
        to: CURE_PENDING
        trigger: "POST /recovery-cases/{id}/cure-notices (re-notice supersedes the live notice)"
        actor: RecoveryManager
        preconditions:
          - "Case status IN {OPENED, CURE_PENDING} (ERR_INVALID_CASE_STATE)"
          - "expected_recovery_case_version == RecoveryCase.version (ERR_STALE_VERSION, 412)"
        side_effects:
          - "Prior SENT CureNotice -> SUPERSEDED (superseded_by_id = new notice); new notice created SENT with freshly computed cure_amount_cents"
          - "case.cure_deadline = new sent_at + 14 days; case.current_cure_notice_id repointed; RecoveryCase.version increments"
      - from: CURE_PENDING
        to: CURED
        trigger: "POST /recovery-cases/{id}/cure-payments"
        actor: Borrower
        preconditions:
          - "Case status == CURE_PENDING (ERR_INVALID_CASE_STATE, priority 5) — note the clock-set auto-transition to CURE_EXPIRED fires the moment now > cure_deadline, so a past-deadline attempt always observes CURE_EXPIRED and fails here"
          - "amount_cents >= current cure notice cure_amount_cents (ERR_PAYMENT_INSUFFICIENT, priority 9)"
        side_effects:
          - "RecoveryLedgerEntry kind=PAYMENT amount=amount_cents created"
          - "LoanAccount.paid_to_date_cents += amount_cents; loan version increments"
          - "Current CureNotice -> CURED"
          - "LoanAccount IN_DEFAULT -> CURRENT (cure restores the loan)"
      - from: CURE_PENDING
        to: CURE_EXPIRED
        trigger: "system (POST /_clock/set_current_utc when resulting now > cure_deadline)"
        actor: system
        preconditions:
          - "Case status == CURE_PENDING and now > cure_deadline"
        side_effects:
          - "Current CureNotice (status SENT) -> EXPIRED"
      - from: CURE_EXPIRED
        to: REPO_ACTIVE
        trigger: "POST /recovery-cases/{id}/repo-assignments"
        actor: RecoveryManager
        preconditions:
          - "Case status IN {CURE_EXPIRED, REPO_ACTIVE} with no assignment of this case in {ASSIGNED, ACCEPTED} (ERR_INVALID_CASE_STATE)"
        side_effects:
          - "RepoAssignment created in ASSIGNED (agent explicit or server-selected)"
      - from: REPO_ACTIVE
        to: COLLATERAL_SECURED
        trigger: "POST /repo-assignments/{id}/report-secured"
        actor: RepoAgent
        preconditions:
          - "Assignment status == ACCEPTED (ERR_INVALID_ASSIGNMENT_STATE)"
          - "Assignment's agent_id == X-User-ID (ERR_FORBIDDEN_OWNERSHIP)"
        side_effects:
          - "Assignment -> SECURED; secured_fast set (created-to-secured <= 14 days)"
          - "case.collateral_secured_at = now; odometer/condition_grade/trade_in_value_cents/auction_guide_low_cents copied onto the case"
          - "agent_performance_score recompute for the agent (both variants)"
      - from: COLLATERAL_SECURED
        to: REDEMPTION_OPEN
        trigger: "POST /recovery-cases/{id}/redemption-quotes (first quote on the case)"
        actor: RecoveryManager
        preconditions:
          - "Case status IN {COLLATERAL_SECURED, REDEMPTION_OPEN} (ERR_INVALID_CASE_STATE)"
          - "expected_recovery_case_version == RecoveryCase.version (ERR_STALE_VERSION, 412)"
        side_effects:
          - "On the first quote only: case.redemption_deadline = issued_at + 10 days"
          - "Quote created ISSUED with quoted_amount_cents snapshot; prior ISSUED quote -> SUPERSEDED"
          - "case.current_redemption_quote_id repointed; RecoveryCase.version increments"
      - from: REDEMPTION_OPEN
        to: REDEMPTION_OPEN
        trigger: "POST /recovery-cases/{id}/redemption-quotes (re-quote supersedes the live quote)"
        actor: RecoveryManager
        preconditions:
          - "Case status IN {COLLATERAL_SECURED, REDEMPTION_OPEN} (ERR_INVALID_CASE_STATE)"
          - "expected_recovery_case_version == RecoveryCase.version (ERR_STALE_VERSION, 412)"
        side_effects:
          - "Prior ISSUED quote -> SUPERSEDED (superseded_by_id = new quote); new quote ISSUED with freshly computed quoted_amount_cents"
          - "case.redemption_deadline is NOT extended (fixed by the first quote); case.current_redemption_quote_id repointed; RecoveryCase.version increments"
      - from: REDEMPTION_OPEN
        to: REDEEMED
        trigger: "POST /redemption-quotes/{id}/accept (quote_type REDEMPTION)"
        actor: Borrower
        preconditions:
          - "Quote status == ISSUED (ERR_INVALID_QUOTE_STATE)"
          - "quote.recovery_case.status == REDEMPTION_OPEN (ERR_INVALID_CASE_STATE) — a complaint-frozen case blocks acceptance even while the quote is still ISSUED"
          - "now <= quote.valid_until (ERR_QUOTE_EXPIRED) — reachable when the case was frozen past the deadline (no auto-expiry fired) and then restored to REDEMPTION_OPEN by a DISMISSED complaint"
          - "payment_amount_cents >= quoted_amount_cents (ERR_PAYMENT_INSUFFICIENT)"
        side_effects:
          - "Quote -> ACCEPTED; ledger PAYMENT entry; LoanAccount.paid_to_date_cents += payment_amount_cents; LoanAccount -> REDEEMED_PAID"
      - from: REDEMPTION_OPEN
        to: REINSTATED
        trigger: "POST /redemption-quotes/{id}/accept (quote_type REINSTATEMENT)"
        actor: Borrower
        preconditions:
          - "Same three preconditions as REDEEMED, same error ids"
        side_effects:
          - "Quote -> ACCEPTED; ledger PAYMENT entry; LoanAccount.paid_to_date_cents += payment_amount_cents; LoanAccount -> CURRENT"
      - from: REDEMPTION_OPEN
        to: CONSIGNMENT_PENDING
        trigger: "system (POST /_clock/set_current_utc when resulting now > redemption_deadline)"
        actor: system
        preconditions:
          - "Case status == REDEMPTION_OPEN and now > redemption_deadline"
        side_effects:
          - "ISSUED quote on the case -> EXPIRED"
      - from: CONSIGNMENT_PENDING
        to: IN_AUCTION
        trigger: "POST /consignments/{id}/list"
        actor: Auctioneer
        preconditions:
          - "Consignment status IN {DRAFT} (ERR_INVALID_CONSIGNMENT_STATE) and consignment.recovery_case.status == CONSIGNMENT_PENDING (ERR_INVALID_CASE_STATE)"
        side_effects:
          - "Consignment -> LISTED with listing window"
      - from: IN_AUCTION
        to: CONSIGNMENT_PENDING
        trigger: "POST /consignments/{id}/report-unsold"
        actor: Auctioneer
        preconditions:
          - "Consignment status == LISTED (ERR_INVALID_CONSIGNMENT_STATE)"
        side_effects:
          - "Consignment -> UNSOLD"
      - from: IN_AUCTION
        to: SALE_CONFIRMED
        trigger: "POST /sale-records/{id}/certify"
        actor: ComplianceOfficer
        preconditions:
          - "SaleRecord status == PENDING_CERTIFICATION (ERR_INVALID_SALE_STATE)"
          - "sale.consignment.recovery_case.status == IN_AUCTION (ERR_INVALID_CASE_STATE)"
          - "X-User-ID != sale.consignment.recovery_case.opened_by_user_id (ERR_SEGREGATION_OF_DUTIES)"
        side_effects:
          - "SaleRecord -> CERTIFIED; Consignment -> SOLD; case.sold_at = now"
      - from: SALE_CONFIRMED
        to: DEFICIENCY_NOTICED
        trigger: "POST /deficiency-notices/{id}/send"
        actor: RecoveryManager
        preconditions:
          - "Notice status == DRAFT (ERR_INVALID_DEFICIENCY_STATE)"
          - "now <= case.sold_at + 30 days (ERR_DEFICIENCY_WINDOW_EXPIRED)"
        side_effects:
          - "Notice -> SENT; notice.sent_at = now"
      - from: CURED
        to: CLOSED
        trigger: "POST /recovery-cases/{id}/close"
        actor: RecoveryManager
        preconditions:
          - "Case status IN {CURED, REDEEMED, REINSTATED, RESTITUTION} (ERR_INVALID_CASE_STATE); DEFICIENCY_NOTICED additionally requires all notices in {PAID, WAIVED, VOID}"
        side_effects:
          - "From REDEEMED: nothing further; from RESTITUTION: nothing further"
      - from: REDEEMED
        to: CLOSED
        trigger: "POST /recovery-cases/{id}/close"
        actor: RecoveryManager
        preconditions: ["Case status IN {CURED, REDEEMED, REINSTATED, RESTITUTION}"]
        side_effects: []
      - from: REINSTATED
        to: CLOSED
        trigger: "POST /recovery-cases/{id}/close"
        actor: RecoveryManager
        preconditions: ["Case status IN {CURED, REDEEMED, REINSTATED, RESTITUTION}"]
        side_effects: []
      - from: DEFICIENCY_NOTICED
        to: CLOSED
        trigger: "POST /recovery-cases/{id}/close"
        actor: RecoveryManager
        preconditions:
          - "Every DeficiencyNotice of the case in {PAID, WAIVED, VOID} (ERR_INVALID_CASE_STATE)"
        side_effects:
          - "LoanAccount -> CHARGED_OFF (unless already REDEEMED_PAID/CURRENT)"
      - from: RESTITUTION
        to: CLOSED
        trigger: "POST /recovery-cases/{id}/close"
        actor: RecoveryManager
        preconditions: ["Case status == RESTITUTION"]
        side_effects: []
      - from: REPO_ACTIVE
        to: COMPLAINT_REVIEW
        trigger: "POST /recovery-cases/{id}/complaints"
        actor: Borrower
        preconditions:
          - "Case status IN {REPO_ACTIVE, COLLATERAL_SECURED, REDEMPTION_OPEN, CONSIGNMENT_PENDING, IN_AUCTION, SALE_CONFIRMED, DEFICIENCY_NOTICED} (ERR_INVALID_CASE_STATE)"
        side_effects:
          - "case.pre_complaint_state = prior status; Complaint created in UNDER_REVIEW"
          - "If a consignment of this case is LISTED: that consignment -> WITHDRAWN"
      - from: COLLATERAL_SECURED
        to: COMPLAINT_REVIEW
        trigger: "POST /recovery-cases/{id}/complaints"
        actor: Borrower
        preconditions: ["Case status in the complaint-eligible set"]
        side_effects: ["Same as REPO_ACTIVE -> COMPLAINT_REVIEW"]
      - from: REDEMPTION_OPEN
        to: COMPLAINT_REVIEW
        trigger: "POST /recovery-cases/{id}/complaints"
        actor: Borrower
        preconditions: ["Case status in the complaint-eligible set"]
        side_effects: ["Same as REPO_ACTIVE -> COMPLAINT_REVIEW"]
      - from: CONSIGNMENT_PENDING
        to: COMPLAINT_REVIEW
        trigger: "POST /recovery-cases/{id}/complaints"
        actor: Borrower
        preconditions: ["Case status in the complaint-eligible set"]
        side_effects: ["Same as REPO_ACTIVE -> COMPLAINT_REVIEW"]
      - from: IN_AUCTION
        to: COMPLAINT_REVIEW
        trigger: "POST /recovery-cases/{id}/complaints"
        actor: Borrower
        preconditions: ["Case status in the complaint-eligible set"]
        side_effects: ["Same as REPO_ACTIVE -> COMPLAINT_REVIEW (LISTED consignment -> WITHDRAWN)"]
      - from: SALE_CONFIRMED
        to: COMPLAINT_REVIEW
        trigger: "POST /recovery-cases/{id}/complaints"
        actor: Borrower
        preconditions: ["Case status in the complaint-eligible set"]
        side_effects: ["Same as REPO_ACTIVE -> COMPLAINT_REVIEW"]
      - from: DEFICIENCY_NOTICED
        to: COMPLAINT_REVIEW
        trigger: "POST /recovery-cases/{id}/complaints"
        actor: Borrower
        preconditions: ["Case status in the complaint-eligible set"]
        side_effects: ["Same as REPO_ACTIVE -> COMPLAINT_REVIEW"]
      - from: COMPLAINT_REVIEW
        to: REPO_ACTIVE
        trigger: "POST /complaints/{id}/resolve with outcome DISMISSED"
        actor: ComplianceOfficer
        preconditions:
          - "Complaint status == UNDER_REVIEW (ERR_INVALID_COMPLAINT_STATE)"
          - "X-User-ID != case.opened_by_user_id (ERR_SEGREGATION_OF_DUTIES)"
        side_effects:
          - "Case returns to pre_complaint_state (this row documents the REPO_ACTIVE restoration; identical restore transitions exist to every complaint-eligible state)"
      - from: COMPLAINT_REVIEW
        to: REDEMPTION_OPEN
        trigger: "POST /complaints/{id}/resolve with outcome DISMISSED"
        actor: ComplianceOfficer
        preconditions: ["Same as DISMISSED restore"]
        side_effects: ["Case returns to pre_complaint_state"]
      - from: COMPLAINT_REVIEW
        to: DEFICIENCY_NOTICED
        trigger: "POST /complaints/{id}/resolve with outcome DISMISSED"
        actor: ComplianceOfficer
        preconditions: ["Same as DISMISSED restore"]
        side_effects: ["Case returns to pre_complaint_state"]
      - from: COMPLAINT_REVIEW
        to: RESTITUTION
        trigger: "POST /complaints/{id}/resolve with outcome UPHELD"
        actor: ComplianceOfficer
        preconditions:
          - "Complaint status == UNDER_REVIEW (ERR_INVALID_COMPLAINT_STATE)"
          - "X-User-ID != case.opened_by_user_id (ERR_SEGREGATION_OF_DUTIES)"
        side_effects:
          - "Complaint -> UPHELD (link 1 of restitution cascade)"
          - "link 2: every DeficiencyNotice of the case in {DRAFT, SENT, DISPUTED} -> VOID; every SaleRecord of the case in {PENDING_CERTIFICATION, CERTIFIED} -> VOID; every Consignment of the case in {DRAFT, LISTED, UNSOLD} -> WITHDRAWN"
          - "link 3: for every ledger PAYMENT entry of the case, a REVERSAL entry with reverses_entry_id pointing at it is created"
          - "link 4: LoanAccount.paid_to_date_cents decremented by the reversed amounts; LoanAccount -> CURRENT; RecoveryCase -> RESTITUTION"

  - entity: CureNotice
    initial_state: SENT
    terminal_states: [CURED, EXPIRED, SUPERSEDED]
    transitions:
      - from: SENT
        to: CURED
        trigger: "POST /recovery-cases/{id}/cure-payments (full in-window payment)"
        actor: Borrower
        preconditions: ["See RecoveryCase CURE_PENDING -> CURED"]
        side_effects: []
      - from: SENT
        to: EXPIRED
        trigger: "system (clock-set past case.cure_deadline)"
        actor: system
        preconditions: ["Notice status == SENT and now > case.cure_deadline"]
        side_effects: []
      - from: SENT
        to: SUPERSEDED
        trigger: "POST /recovery-cases/{id}/cure-notices (a newer notice on the same case)"
        actor: RecoveryManager
        preconditions: ["A prior notice in SENT exists on the case"]
        side_effects:
          - "superseded_by_id = new notice id"

  - entity: RepoAssignment
    initial_state: ASSIGNED
    terminal_states: [SECURED, BREACHED_PEACE, EXPIRED, CANCELLED]
    transitions:
      - from: ASSIGNED
        to: ACCEPTED
        trigger: "POST /repo-assignments/{id}/accept"
        actor: RepoAgent
        preconditions:
          - "Assignment status == ASSIGNED (ERR_INVALID_ASSIGNMENT_STATE)"
          - "assignment.agent_id == X-User-ID (ERR_FORBIDDEN_OWNERSHIP)"
          - "agent.status == ACTIVE (ERR_AGENT_SUSPENDED, priority 6) — cross-entity dependency RepoAssignment x RepoAgent"
        side_effects: []
      - from: ASSIGNED
        to: EXPIRED
        trigger: "system (clock-set beyond created_at + ACCEPT_WINDOW_DAYS (2) while still ASSIGNED)"
        actor: system
        preconditions: ["Assignment status == ASSIGNED and now > created_at + 2 days"]
        side_effects:
          - "agent_performance_score recompute (expired_count + 1; -10); if performance_score_rolling < 40 the agent -> SUSPENDED and the suspension cascade fires (see report-breach side effects, links 2-3)"
      - from: ACCEPTED
        to: SECURED
        trigger: "POST /repo-assignments/{id}/report-secured"
        actor: RepoAgent
        preconditions: ["See RecoveryCase REPO_ACTIVE -> COLLATERAL_SECURED"]
        side_effects: ["See RecoveryCase REPO_ACTIVE -> COLLATERAL_SECURED"]
      - from: ASSIGNED
        to: BREACHED_PEACE
        trigger: "POST /repo-assignments/{id}/report-breach"
        actor: ComplianceOfficer
        preconditions:
          - "Assignment status IN {ASSIGNED, ACCEPTED} (ERR_INVALID_ASSIGNMENT_STATE)"
        side_effects:
          - "link 1: agent_performance_score recompute for the agent (breach_count + 1; -25)"
          - "link 2: if performance_score_rolling < SUSPENSION_THRESHOLD (40), RepoAgent -> SUSPENDED"
          - "link 3: every OTHER assignment of that agent in {ASSIGNED, ACCEPTED} -> CANCELLED"
          - "the case remains REPO_ACTIVE with no live assignment (re-assignment allowed)"
      - from: ACCEPTED
        to: BREACHED_PEACE
        trigger: "POST /repo-assignments/{id}/report-breach"
        actor: ComplianceOfficer
        preconditions: ["Assignment status IN {ASSIGNED, ACCEPTED}"]
        side_effects: ["Same cascade as ASSIGNED -> BREACHED_PEACE"]
      - from: ASSIGNED
        to: CANCELLED
        trigger: "system (suspension cascade only)"
        actor: system
        preconditions: ["Owning agent entered SUSPENDED"]
        side_effects: []
      - from: ACCEPTED
        to: CANCELLED
        trigger: "system (suspension cascade only)"
        actor: system
        preconditions: ["Owning agent entered SUSPENDED"]
        side_effects: []

  - entity: PersonalPropertyItem
    initial_state: INVENTORIED
    terminal_states: [RETURNED, DISPOSED]
    transitions:
      - from: INVENTORIED
        to: CLAIMED
        trigger: "POST /personal-property-items/{id}/claim"
        actor: Borrower
        preconditions:
          - "Item status == INVENTORIED (ERR_INVALID_ITEM_STATE)"
          - "Caller owns the case (case.loan.borrower_id == X-User-ID, ERR_FORBIDDEN_OWNERSHIP)"
        side_effects: ["claimed_by_borrower_id = X-User-ID"]
      - from: CLAIMED
        to: INVENTORIED
        trigger: "POST /personal-property-items/{id}/unclaim"
        actor: Borrower
        preconditions:
          - "Item status == CLAIMED and claimed_by_borrower_id == X-User-ID (ERR_INVALID_ITEM_STATE / ERR_FORBIDDEN_OWNERSHIP)"
        side_effects: ["claimed_by_borrower_id cleared"]
      - from: CLAIMED
        to: RETURNED
        trigger: "POST /personal-property-items/{id}/mark-returned"
        actor: RepoAgent
        preconditions:
          - "Item status == CLAIMED (ERR_INVALID_ITEM_STATE)"
          - "Caller is the agent of the case's SECURED assignment (ERR_FORBIDDEN_OWNERSHIP)"
        side_effects: []
      - from: INVENTORIED
        to: DISPOSED
        trigger: "POST /personal-property-items/{id}/dispose"
        actor: RepoAgent
        preconditions:
          - "Item status == INVENTORIED (ERR_INVALID_ITEM_STATE)"
          - "now >= case.collateral_secured_at + PROPERTY_RETENTION_DAYS (15) (ERR_PROPERTY_RETENTION_ACTIVE, priority 7)"
          - "Caller is the agent of the case's SECURED assignment (ERR_FORBIDDEN_OWNERSHIP)"
        side_effects: []

  - entity: RedemptionQuote
    initial_state: ISSUED
    terminal_states: [ACCEPTED, EXPIRED, SUPERSEDED]
    transitions:
      - from: ISSUED
        to: ACCEPTED
        trigger: "POST /redemption-quotes/{id}/accept"
        actor: Borrower
        preconditions: ["See RecoveryCase REDEMPTION_OPEN -> REDEEMED/REINSTATED"]
        side_effects: ["See RecoveryCase REDEMPTION_OPEN -> REDEEMED/REINSTATED"]
      - from: ISSUED
        to: EXPIRED
        trigger: "system (clock-set past case.redemption_deadline)"
        actor: system
        preconditions:
          - "Quote status == ISSUED and now > valid_until AND quote's case status == REDEMPTION_OPEN"
          - "A quote whose case is frozen in COMPLAINT_REVIEW past the deadline stays ISSUED; accepting it after a DISMISSED restore then fails the temporal check with ERR_QUOTE_EXPIRED"
        side_effects: []
      - from: ISSUED
        to: SUPERSEDED
        trigger: "POST /recovery-cases/{id}/redemption-quotes (a newer quote on the same case)"
        actor: RecoveryManager
        preconditions: ["A prior quote in ISSUED exists on the case"]
        side_effects: ["superseded_by_id = new quote id"]

  - entity: Consignment
    initial_state: DRAFT
    terminal_states: [SOLD, WITHDRAWN]
    transitions:
      - from: DRAFT
        to: LISTED
        trigger: "POST /consignments/{id}/list"
        actor: Auctioneer
        preconditions:
          - "Consignment status == DRAFT (ERR_INVALID_CONSIGNMENT_STATE)"
          - "consignment.auction_house_id == X-User-ID (ERR_FORBIDDEN_OWNERSHIP)"
          - "Case status == CONSIGNMENT_PENDING (ERR_INVALID_CASE_STATE) — cross-entity dependency Consignment x RecoveryCase"
          - "Listing window (closed interval) does not touch or overlap any other LISTED consignment window at the same auction house (ERR_AUCTION_WINDOW_OVERLAP)"
        side_effects: ["Case -> IN_AUCTION"]
      - from: LISTED
        to: SOLD
        trigger: "POST /consignments/{id}/report-sale with gross_sale_cents >= reserve_price_cents, then POST /sale-records/{id}/certify"
        actor: Auctioneer then ComplianceOfficer
        preconditions:
          - "report-sale: consignment status == LISTED (ERR_INVALID_CONSIGNMENT_STATE); gross_sale_cents >= reserve_price_cents (ERR_BID_BELOW_RESERVE, priority 9)"
          - "certify: see RecoveryCase IN_AUCTION -> SALE_CONFIRMED"
        side_effects:
          - "report-sale creates SaleRecord in PENDING_CERTIFICATION with fee lines computed"
      - from: LISTED
        to: UNSOLD
        trigger: "POST /consignments/{id}/report-unsold"
        actor: Auctioneer
        preconditions: ["Consignment status == LISTED (ERR_INVALID_CONSIGNMENT_STATE)"]
        side_effects: ["Case -> CONSIGNMENT_PENDING"]
      - from: UNSOLD
        to: LISTED
        trigger: "POST /consignments/{id}/relist"
        actor: Auctioneer
        preconditions:
          - "Consignment status == UNSOLD (ERR_INVALID_CONSIGNMENT_STATE)"
          - "consignment.auction_house_id == X-User-ID (ERR_FORBIDDEN_OWNERSHIP)"
          - "Case status == CONSIGNMENT_PENDING (ERR_INVALID_CASE_STATE)"
          - "Same closed-interval overlap check as list (ERR_AUCTION_WINDOW_OVERLAP)"
        side_effects:
          - "reserve_price_cents = round_half_up(prior reserve_price_cents * RELIST_MARKDOWN 0.95) — computed BEFORE the transition commits and stored on the consignment"
          - "relist_count += 1; case -> IN_AUCTION"
      - from: LISTED
        to: WITHDRAWN
        trigger: "system (complaint filed on the case, or complaint resolved UPHELD)"
        actor: system
        preconditions: ["Case entered COMPLAINT_REVIEW or RESTITUTION"]
        side_effects: []
      - from: DRAFT
        to: WITHDRAWN
        trigger: "system (complaint resolved UPHELD)"
        actor: system
        preconditions: ["Case entered RESTITUTION"]
        side_effects: []
      - from: UNSOLD
        to: WITHDRAWN
        trigger: "system (complaint resolved UPHELD)"
        actor: system
        preconditions: ["Case entered RESTITUTION"]
        side_effects: []

  - entity: SaleRecord
    initial_state: PENDING_CERTIFICATION
    terminal_states: [CERTIFIED, VOID]
    transitions:
      - from: PENDING_CERTIFICATION
        to: CERTIFIED
        trigger: "POST /sale-records/{id}/certify"
        actor: ComplianceOfficer
        preconditions: ["See RecoveryCase IN_AUCTION -> SALE_CONFIRMED"]
        side_effects: ["See RecoveryCase IN_AUCTION -> SALE_CONFIRMED"]
      - from: PENDING_CERTIFICATION
        to: VOID
        trigger: "system (complaint resolved UPHELD)"
        actor: system
        preconditions: ["Case entered RESTITUTION"]
        side_effects: []
      - from: CERTIFIED
        to: VOID
        trigger: "system (complaint resolved UPHELD)"
        actor: system
        preconditions: ["Case entered RESTITUTION"]
        side_effects: []

  - entity: DeficiencyNotice
    initial_state: DRAFT
    terminal_states: [PAID, WAIVED, VOID]
    transitions:
      - from: DRAFT
        to: SENT
        trigger: "POST /deficiency-notices/{id}/send"
        actor: RecoveryManager
        preconditions:
          - "Notice status == DRAFT (ERR_INVALID_DEFICIENCY_STATE)"
          - "Case status == SALE_CONFIRMED (ERR_INVALID_CASE_STATE)"
          - "now <= case.sold_at + DEFICIENCY_NOTICE_DAYS (30) (ERR_DEFICIENCY_WINDOW_EXPIRED, priority 7)"
        side_effects: ["Case -> DEFICIENCY_NOTICED; sent_at = now"]
      - from: SENT
        to: DISPUTED
        trigger: "POST /deficiency-notices/{id}/dispute"
        actor: Borrower
        preconditions:
          - "Notice status == SENT (ERR_INVALID_DEFICIENCY_STATE)"
          - "Caller owns the case (ERR_FORBIDDEN_OWNERSHIP)"
        side_effects: []
      - from: DISPUTED
        to: SENT
        trigger: "POST /deficiency-notices/{id}/revise"
        actor: RecoveryManager
        preconditions:
          - "Notice status == DISPUTED (ERR_INVALID_DEFICIENCY_STATE)"
        side_effects:
          - "deficiency_amount_cents = max(0, deficiency_amount_cents + adjustment_cents); version increments (SENT -> DISPUTED -> SENT cycle)"
      - from: SENT
        to: PAID
        trigger: "POST /deficiency-notices/{id}/record-payment"
        actor: Borrower
        preconditions:
          - "Notice status IN {SENT, DISPUTED} (ERR_INVALID_DEFICIENCY_STATE)"
        side_effects:
          - "paid_cents += amount_cents; ledger PAYMENT entry; LoanAccount.paid_to_date_cents += amount_cents"
          - "Notice -> PAID only when paid_cents >= deficiency_amount_cents; otherwise remains in its current status (partial payment)"
      - from: DISPUTED
        to: PAID
        trigger: "POST /deficiency-notices/{id}/record-payment"
        actor: Borrower
        preconditions: ["Notice status IN {SENT, DISPUTED}"]
        side_effects: ["Same as SENT -> PAID"]
      - from: SENT
        to: WAIVED
        trigger: "POST /deficiency-notices/{id}/waive"
        actor: ComplianceOfficer
        preconditions:
          - "Notice status IN {SENT, DISPUTED} (ERR_INVALID_DEFICIENCY_STATE)"
        side_effects: ["surplus_cents (if any) is settled by a ledger REFUND entry"]
      - from: DISPUTED
        to: WAIVED
        trigger: "POST /deficiency-notices/{id}/waive"
        actor: ComplianceOfficer
        preconditions: ["Notice status IN {SENT, DISPUTED}"]
        side_effects: ["Same as SENT -> WAIVED"]
      - from: DRAFT
        to: VOID
        trigger: "system (complaint resolved UPHELD)"
        actor: system
        preconditions: ["Case entered RESTITUTION"]
        side_effects: []
      - from: SENT
        to: VOID
        trigger: "system (complaint resolved UPHELD)"
        actor: system
        preconditions: ["Case entered RESTITUTION"]
        side_effects: []
      - from: DISPUTED
        to: VOID
        trigger: "system (complaint resolved UPHELD)"
        actor: system
        preconditions: ["Case entered RESTITUTION"]
        side_effects: []

  - entity: Complaint
    initial_state: UNDER_REVIEW
    terminal_states: [UPHELD, DISMISSED]
    transitions:
      - from: UNDER_REVIEW
        to: UPHELD
        trigger: "POST /complaints/{id}/resolve with outcome=UPHELD"
        actor: ComplianceOfficer
        preconditions:
          - "Complaint status == UNDER_REVIEW (ERR_INVALID_COMPLAINT_STATE)"
          - "X-User-ID != case.opened_by_user_id (ERR_SEGREGATION_OF_DUTIES)"
        side_effects: ["Restitution cascade — see RecoveryCase COMPLAINT_REVIEW -> RESTITUTION"]
      - from: UNDER_REVIEW
        to: DISMISSED
        trigger: "POST /complaints/{id}/resolve with outcome=DISMISSED"
        actor: ComplianceOfficer
        preconditions:
          - "Complaint status == UNDER_REVIEW (ERR_INVALID_COMPLAINT_STATE)"
          - "X-User-ID != case.opened_by_user_id (ERR_SEGREGATION_OF_DUTIES)"
        side_effects: ["Case returns to pre_complaint_state"]

# =============================================================================
# §1.2.1 Concurrency Rules (OCC on parent version only; serially observable)
# =============================================================================
concurrency_rules:
  - rule_id: cure-notice-create-stale-case
    parent_entity: RecoveryCase
    write_endpoint: "POST /recovery-cases/{id}/cure-notices"
    occ_field: "expected_recovery_case_version"
    description: |
      Creating a CureNotice against a RecoveryCase whose version has advanced
      since the client last observed it is rejected. The product legitimately
      allows a new notice to supersede the live one, so a second sequential
      create sees no state-field rejection — only the stale-version check
      protects the client from superseding a notice it never saw.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: redemption-quote-create-stale-case
    parent_entity: RecoveryCase
    write_endpoint: "POST /recovery-cases/{id}/redemption-quotes"
    occ_field: "expected_recovery_case_version"
    description: |
      Creating a RedemptionQuote against a RecoveryCase whose version has
      advanced since the client last observed it is rejected. A new quote
      legitimately supersedes the ISSUED one (quote terms legitimately change
      as costs accrue), so no state field rejects a second sequential create;
      only the OCC check on the case version does.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: cure_amount
    trigger: "CureNotice creation (POST /recovery-cases/{id}/cure-notices); result snapshotted onto CureNotice.cure_amount_cents"
    algorithm: aggregation
    formula: |
      cure_amount_cents =
          loan.missed_installments * loan.monthly_payment_cents
        + loan.late_fees_cents
        + recovery_costs_total(case)
      where recovery_costs_total(case) =
        sum(amount_cents of ledger entries with kind IN {COST_REPO_FEE, COST_STORAGE,
        COST_TRANSPORT, COST_KEY, COST_OTHER, ADJUSTMENT})
        - sum(amount_cents of REVERSAL entries whose reverses_entry_id points at a COST_* entry)
    input_set: "Ledger entries of THIS case only, all statuses (entries are append-only; no status filter needed). Loan fields are the case's loan at creation time."
    precision: "integer cents; no rounding"
    variants: []

  - name: redemption_quote_amount
    trigger: "RedemptionQuote creation; result snapshotted onto quoted_amount_cents"
    algorithm: aggregation
    formula: |
      per_diem_cents = round_half_up(loan.principal_balance_cents * loan.apr_bps / 10000 / 365)
      # PINNED ROUNDING ORDER (mode-b): per_diem is rounded to whole cents FIRST,
      # then multiplied by days. Computing interest single-shot
      # (round_half_up(principal * apr * days / 3650000)) is a DIFFERENT, non-conformant number.
      interest_days = calendar_days_between(case.created_at date, quote.valid_until date)   # UTC dates, end - start
      payoff_cents = loan.total_outstanding_cents + per_diem_cents * interest_days
      REDEMPTION:    quoted_amount_cents = payoff_cents + recovery_costs_total(case)
      REINSTATEMENT: quoted_amount_cents = loan.missed_installments * loan.monthly_payment_cents
                                         + loan.late_fees_cents + recovery_costs_total(case)
    input_set: "The case's loan; ledger COST_*/ADJUSTMENT/REVERSAL entries of this case as of quote creation."
    constants:
      DAYS_PER_YEAR: 365
      REDEMPTION_PERIOD_DAYS: 10
    precision: "integer cents, round_half_up; per_diem rounded before multiplication (pinned order)"
    variants:
      - name: REDEMPTION
        when: "quote_type == REDEMPTION"
        difference: "Full payoff: total_outstanding (principal + arrears - paid_to_date) + per-diem interest through valid_until + costs"
      - name: REINSTATEMENT
        when: "quote_type == REINSTATEMENT"
        difference: "Arrears only: missed installments + late fees + costs; NO principal acceleration, NO per-diem interest"

  - name: reserve_price
    trigger: "Consignment creation (initial); relist (markdown recompute)"
    algorithm: tiered_pricing
    formula: |
      grade_mult = {EXCELLENT: 0.85, GOOD: 0.75, FAIR: 0.60, POOR: 0.45}[case.condition_grade]
      grade_adjusted = round_half_up(case.trade_in_value_cents * grade_mult)
      payoff_estimate = loan.total_outstanding_cents + recovery_costs_total(case)   # at consignment creation
      floor_value = round_half_up(RESERVE_FLOOR_RATIO * payoff_estimate)
      reserve_price_cents = min( grade_adjusted, max(case.auction_guide_low_cents, floor_value) )
      # On relist: reserve_price_cents = round_half_up(prior reserve_price_cents * RELIST_MARKDOWN)
    input_set: "The case's appraisal fields (set by report-secured), the case's loan, the case's ledger. Consignment creation is rejected if condition_grade is unset (ERR_INVALID_CASE_STATE)."
    constants:
      RESERVE_FLOOR_RATIO: 0.50
      RELIST_MARKDOWN: 0.95
    precision: "integer cents, round_half_up; each of grade_adjusted and floor_value rounded independently BEFORE min/max"
    variants: []

  - name: net_sale_proceeds
    trigger: "SaleRecord creation (POST /consignments/{id}/report-sale)"
    algorithm: aggregation
    formula: |
      auction_fee_cents = round_half_up(gross_sale_cents * auction_house.fee_bps / 10000)
      transport_fee_cents = auction_house.transport_fee_cents   # flat, already in cents
      net_proceeds_cents = gross_sale_cents - auction_fee_cents - transport_fee_cents
      # PINNED: each fee line is rounded to cents individually BEFORE subtraction.
    input_set: "The consignment's auction house fee config; the reported gross."
    precision: "integer cents, round_half_up per line, then subtract"
    variants: []

  - name: deficiency_balance
    trigger: "POST /recovery-cases/{id}/deficiency-estimate (PROVISIONAL) and DeficiencyNotice creation (FINAL)"
    algorithm: waterfall_allocation
    formula: |
      # Shared skeleton; the variants differ ONLY in the proceeds term.
      interest_days = calendar_days_between(case.created_at date, as_of date)
      payoff_as_of = loan.total_outstanding_cents + case_per_diem_cents * interest_days
      # case_per_diem_cents = round_half_up(principal * apr_bps / 10000 / 365), same pinned order as quotes
      total_owed = payoff_as_of + recovery_costs_total(case)
      # Sale expenses are NOT added to total_owed: proceeds is the NET figure
      # (gross - auction fee - transport), so expenses are already accounted for there.
      FINAL:       proceeds = sale_record.net_proceeds_cents   (CERTIFIED sale required)
      PROVISIONAL: proceeds = round_half_up(latest_consignment.reserve_price_cents * EST_RECOVERY_RATIO)
      deficiency_amount_cents = max(0, total_owed - proceeds)
      surplus_cents           = max(0, proceeds - total_owed)
      # Waterfall interpretation of "proceeds applied in order": costs, then interest,
      # then principal is EQUIVALENT to the single subtraction above; the waterfall is
      # pinned for audit display only and MUST NOT change the arithmetic.
    input_set: "FINAL: the case's CERTIFIED SaleRecord (exactly one; if absent or not CERTIFIED, notice creation fails ERR_INVALID_CASE_STATE). PROVISIONAL: the case's consignment with the greatest consignment_seq (any status; consignment_seq is the pinned tie-free selector — created_at may tie under the logical clock); if none exists, proceeds = round_half_up(grade-adjusted appraisal * EST_RECOVERY_RATIO) using the same grade table as reserve_price."
    constants:
      EST_RECOVERY_RATIO: 0.9
      DEFICIENCY_NOTICE_DAYS: 30
    precision: "integer cents, round_half_up; per-diem rounded before multiplication"
    variants:
      - name: PROVISIONAL
        when: "GET /recovery-cases/{id}/deficiency-estimate, any time after COLLATERAL_SECURED"
        difference: "Proceeds estimated from reserve (or grade-adjusted appraisal) x 0.9; sale expenses excluded; uses logical-clock 'today' as as_of"
      - name: FINAL
        when: "DeficiencyNotice creation after sale certification"
        difference: "Proceeds = actual certified net_proceeds_cents; sale expenses included; as_of = case.sold_at. Identical ledger data yields a different number than PROVISIONAL whenever actual != estimated proceeds."

  - name: agent_performance_score
    trigger: "Every RepoAssignment terminal transition of the agent (SECURED, BREACHED_PEACE, EXPIRED) and on read of RepoAgent"
    algorithm: weighted_scoring
    formula: |
      score = clamp(0, 100,
          100
        - 25 * count(assignments in window with status BREACHED_PEACE)
        - 10 * count(assignments in window with status EXPIRED)
        +  2 * count(assignments in window with status SECURED and secured_fast == true))
      # Window definition is the ONLY difference between the two variants.
      if performance_score_rolling < SUSPENSION_THRESHOLD: agent auto-transitions to SUSPENDED
    input_set: "LIFETIME: all RepoAssignment rows with agent_id = this agent. ROLLING_90D: only rows whose created_at >= now - 90 days (logical clock). Both counts use the same event weights; tie-free (counts are integers)."
    constants:
      BREACH_PENALTY: 25
      EXPIRED_PENALTY: 10
      FAST_SECURE_BONUS: 2
      FAST_SECURE_DAYS: 14
      SUSPENSION_THRESHOLD: 40
      ROLLING_WINDOW_DAYS: 90
    precision: "integer points; clamped to [0, 100]"
    variants:
      - name: LIFETIME
        when: "Stored as RepoAgent.performance_score_lifetime"
        difference: "All assignments regardless of age"
      - name: ROLLING_90D
        when: "Stored as RepoAgent.performance_score_rolling; drives auto-suspension and auto-assignment ranking"
        difference: "Same weights over the trailing-90-day window; an agent whose violations are all older than 90 days reads 100 while lifetime reads lower"

  - name: agent_auto_select
    trigger: "POST /recovery-cases/{id}/repo-assignments with agent_id omitted"
    algorithm: weighted_scoring
    formula: |
      eligible(agent) :=
            agent.status == ACTIVE
        AND case.loan.governing_state_code IN agent.licensed_state_codes
        AND count(agent.assignments with status IN {ASSIGNED, ACCEPTED}) < agent.max_active_assignments
        AND NOT overlaps_half_open(new [field_window_start, field_window_end),
                                   any window of that agent's assignments with status IN {ASSIGNED, ACCEPTED})
        AND agent has NO assignment on THIS case with status BREACHED_PEACE
      rank: performance_score_rolling DESC, tie-break agent.created_at ASC (earliest first)
      selected = first of ranked eligible pool; empty pool -> ERR_NO_ELIGIBLE_AGENT
    input_set: "All RepoAgent rows. Overlap uses half-open interval semantics: [a_start, a_end) vs [b_start, b_end) overlap iff a_start < b_end AND b_start < a_end; adjacency (a_end == b_start) is NOT overlap."
    precision: "n/a (selection)"
    variants: []

  - name: recovery_costs_total
    trigger: "Referenced by cure_amount, redemption_quote_amount, reserve_price, deficiency_balance"
    algorithm: aggregation
    formula: |
      recovery_costs_total(case) =
          sum(amount_cents where kind IN {COST_REPO_FEE, COST_STORAGE, COST_TRANSPORT, COST_KEY, COST_OTHER, ADJUSTMENT})
        - sum(amount_cents where kind == REVERSAL and reverses_entry_id references a COST_*/ADJUSTMENT entry)
    input_set: "RecoveryLedgerEntry rows of the case (append-only)."
    precision: "integer cents"
    variants: []

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority — first match wins)
# =============================================================================
validations:
  - { priority: 1, category: auth, check: "X-User-Role and X-User-ID headers present; role is one of the five declared roles", error_id: ERR_UNAUTHENTICATED, http_status: 401, applies_to: "all" }
  - { priority: 2, category: auth, check: "Caller role is listed in the endpoint's roles", error_id: ERR_UNAUTHORIZED, http_status: 403, applies_to: "all" }
  - { priority: 3, category: auth, check: "Ownership: Borrower endpoints act only on cases whose loan.borrower_id == X-User-ID; RepoAgent endpoints only on assignments with agent_id == X-User-ID (or items of a case whose SECURED assignment belongs to the agent); Auctioneer endpoints only on consignments with auction_house_id == X-User-ID", error_id: ERR_FORBIDDEN_OWNERSHIP, http_status: 403, applies_to: "POST /recovery-cases/{id}/cure-payments, POST /redemption-quotes/{id}/accept, POST /personal-property-items/{id}/claim|unclaim, POST /repo-assignments/{id}/accept|report-secured, POST /personal-property-items/{id}/mark-returned|dispose (via case assignment), POST /consignments/{id}/list|relist|report-sale|report-unsold, POST /deficiency-notices/{id}/dispute|record-payment, POST /recovery-cases/{id}/complaints" }
  - { priority: 4, category: existence, check: "Every id in the path resolves to an existing resource, validated left-to-right", error_id: ERR_NOT_FOUND, http_status: 404, applies_to: "all" }
  - { priority: 4, category: existence, check: "Request body well-formed: required fields present, types correct, enum values valid, unknown fields rejected, amount fields positive integers", error_id: ERR_INVALID_REQUEST, http_status: 400, applies_to: "all" }
  - { priority: 5, category: state, check: "RecoveryCase status permits the operation (e.g. cure payment only in CURE_PENDING; consignment create only in CONSIGNMENT_PENDING; deficiency notice create only in SALE_CONFIRMED with CERTIFIED sale)", error_id: ERR_INVALID_CASE_STATE, http_status: 409, applies_to: "case-scoped mutations" }
  - { priority: 5, category: state, check: "Assignment status permits the transition", error_id: ERR_INVALID_ASSIGNMENT_STATE, http_status: 409, applies_to: "POST /repo-assignments/{id}/accept|report-secured|report-breach" }
  - { priority: 5, category: state, check: "Quote status == ISSUED for accept. Same-priority tie-break (applies throughout priority 5): the path-target resource's own state is evaluated BEFORE cross-entity preconditions, so an EXPIRED quote on a CONSIGNMENT_PENDING case yields ERR_INVALID_QUOTE_STATE, not ERR_INVALID_CASE_STATE", error_id: ERR_INVALID_QUOTE_STATE, http_status: 409, applies_to: "POST /redemption-quotes/{id}/accept" }
  - { priority: 5, category: state, check: "Item status permits claim/unclaim/return/dispose", error_id: ERR_INVALID_ITEM_STATE, http_status: 409, applies_to: "POST /personal-property-items/{id}/*" }
  - { priority: 5, category: state, check: "Consignment status permits list/relist/report-sale/report-unsold", error_id: ERR_INVALID_CONSIGNMENT_STATE, http_status: 409, applies_to: "POST /consignments/{id}/*" }
  - { priority: 5, category: state, check: "SaleRecord status == PENDING_CERTIFICATION for certify", error_id: ERR_INVALID_SALE_STATE, http_status: 409, applies_to: "POST /sale-records/{id}/certify" }
  - { priority: 5, category: state, check: "DeficiencyNotice status permits send/dispute/revise/waive/record-payment", error_id: ERR_INVALID_DEFICIENCY_STATE, http_status: 409, applies_to: "POST /deficiency-notices/{id}/*" }
  - { priority: 5, category: state, check: "Complaint status == UNDER_REVIEW for resolve", error_id: ERR_INVALID_COMPLAINT_STATE, http_status: 409, applies_to: "POST /complaints/{id}/resolve" }
  - { priority: 6, category: business_safety, check: "Segregation of duties: X-User-ID != case.opened_by_user_id for sale certification and complaint resolution", error_id: ERR_SEGREGATION_OF_DUTIES, http_status: 403, applies_to: "POST /sale-records/{id}/certify, POST /complaints/{id}/resolve" }
  - { priority: 6, category: business_safety, check: "Agent status == ACTIVE when accepting an assignment or being explicitly assigned", error_id: ERR_AGENT_SUSPENDED, http_status: 422, applies_to: "POST /repo-assignments/{id}/accept, POST /recovery-cases/{id}/repo-assignments" }
  - { priority: 6, category: business_safety, check: "Explicit assignment: case loan governing_state_code is in agent.licensed_state_codes", error_id: ERR_AGENT_LICENSE_MISMATCH, http_status: 422, applies_to: "POST /recovery-cases/{id}/repo-assignments (agent_id given)" }
  - { priority: 7, category: business_temporal, check: "Quote accept with now <= quote.valid_until", error_id: ERR_QUOTE_EXPIRED, http_status: 422, applies_to: "POST /redemption-quotes/{id}/accept" }
  - { priority: 7, category: business_temporal, check: "Deficiency notice send with now <= case.sold_at + 30 days", error_id: ERR_DEFICIENCY_WINDOW_EXPIRED, http_status: 422, applies_to: "POST /deficiency-notices/{id}/send" }
  - { priority: 7, category: business_temporal, check: "Dispose only when now >= case.collateral_secured_at + 15 days", error_id: ERR_PROPERTY_RETENTION_ACTIVE, http_status: 422, applies_to: "POST /personal-property-items/{id}/dispose" }
  - { priority: 8, category: business_constraint, check: "No other non-CLOSED RecoveryCase exists for the loan", error_id: ERR_DUPLICATE_OPEN_CASE, http_status: 409, applies_to: "POST /recovery-cases" }
  - { priority: 8, category: business_constraint, check: "Explicit assignment: agent's count of {ASSIGNED, ACCEPTED} assignments < max_active_assignments", error_id: ERR_AGENT_CAPACITY_EXCEEDED, http_status: 422, applies_to: "POST /recovery-cases/{id}/repo-assignments (agent_id given)" }
  - { priority: 8, category: business_constraint, check: "Explicit assignment: new half-open field window does not overlap any {ASSIGNED, ACCEPTED} assignment window of that agent", error_id: ERR_FIELD_WINDOW_OVERLAP, http_status: 409, applies_to: "POST /recovery-cases/{id}/repo-assignments (agent_id given)" }
  - { priority: 8, category: business_constraint, check: "Auto assignment: eligible pool non-empty (see agent_auto_select)", error_id: ERR_NO_ELIGIBLE_AGENT, http_status: 422, applies_to: "POST /recovery-cases/{id}/repo-assignments (agent_id omitted)" }
  - { priority: 8, category: business_constraint, check: "Listing window (closed interval) does not touch or overlap any LISTED consignment window at the same auction house", error_id: ERR_AUCTION_WINDOW_OVERLAP, http_status: 409, applies_to: "POST /consignments/{id}/list, POST /consignments/{id}/relist" }
  - { priority: 9, category: business_fiscal, check: "Payment amount covers the required amount (cure_amount_cents / quoted_amount_cents)", error_id: ERR_PAYMENT_INSUFFICIENT, http_status: 422, applies_to: "POST /recovery-cases/{id}/cure-payments, POST /redemption-quotes/{id}/accept" }
  - { priority: 9, category: business_fiscal, check: "gross_sale_cents >= consignment.reserve_price_cents", error_id: ERR_BID_BELOW_RESERVE, http_status: 422, applies_to: "POST /consignments/{id}/report-sale" }
  - { priority: 10, category: business_constraint, check: "OCC: expected_recovery_case_version == current RecoveryCase.version on supersede-creating endpoints", error_id: ERR_STALE_VERSION, http_status: 412, applies_to: "POST /recovery-cases/{id}/cure-notices, POST /recovery-cases/{id}/redemption-quotes" }

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "Missing or invalid X-User-Role / X-User-ID headers" }
  - { id: ERR_UNAUTHORIZED, http: 403, condition: "Authenticated role is not in the endpoint's allowed roles" }
  - { id: ERR_FORBIDDEN_OWNERSHIP, http: 403, condition: "Caller is authenticated and role-allowed but does not own the target resource (borrower/agent/auctioneer scope)" }
  - { id: ERR_SEGREGATION_OF_DUTIES, http: 403, condition: "Caller is the RecoveryManager who opened the case and attempts to certify its sale or resolve its complaint" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Any path id does not resolve (checked left-to-right)" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Missing required field, wrong type, invalid enum member, unknown field, or non-positive amount" }
  - { id: ERR_INVALID_CASE_STATE, http: 409, condition: "RecoveryCase status does not permit the operation" }
  - { id: ERR_INVALID_ASSIGNMENT_STATE, http: 409, condition: "RepoAssignment status does not permit the transition" }
  - { id: ERR_INVALID_QUOTE_STATE, http: 409, condition: "RedemptionQuote status is not ISSUED for accept" }
  - { id: ERR_INVALID_ITEM_STATE, http: 409, condition: "PersonalPropertyItem status does not permit the transition" }
  - { id: ERR_INVALID_CONSIGNMENT_STATE, http: 409, condition: "Consignment status does not permit the transition" }
  - { id: ERR_INVALID_SALE_STATE, http: 409, condition: "SaleRecord status is not PENDING_CERTIFICATION for certify" }
  - { id: ERR_INVALID_DEFICIENCY_STATE, http: 409, condition: "DeficiencyNotice status does not permit the transition" }
  - { id: ERR_INVALID_COMPLAINT_STATE, http: 409, condition: "Complaint status is not UNDER_REVIEW for resolve" }
  - { id: ERR_DUPLICATE_OPEN_CASE, http: 409, condition: "A non-CLOSED RecoveryCase already exists for the loan" }
  - { id: ERR_FIELD_WINDOW_OVERLAP, http: 409, condition: "New half-open field window overlaps an {ASSIGNED, ACCEPTED} assignment window of the same agent" }
  - { id: ERR_AUCTION_WINDOW_OVERLAP, http: 409, condition: "New closed listing window touches or overlaps a LISTED consignment window at the same auction house" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_recovery_case_version does not match the case's current version (OCC)" }
  - { id: ERR_QUOTE_EXPIRED, http: 422, condition: "Quote accept arrives after quote.valid_until while the quote is still ISSUED (post-complaint-restore path)" }
  - { id: ERR_DEFICIENCY_WINDOW_EXPIRED, http: 422, condition: "Deficiency notice send attempted after case.sold_at + 30 days" }
  - { id: ERR_PROPERTY_RETENTION_ACTIVE, http: 422, condition: "Dispose attempted before case.collateral_secured_at + 15 days" }
  - { id: ERR_AGENT_SUSPENDED, http: 422, condition: "Agent status is SUSPENDED at accept or explicit-assignment time" }
  - { id: ERR_AGENT_LICENSE_MISMATCH, http: 422, condition: "Agent not licensed in the loan's governing state (explicit assignment)" }
  - { id: ERR_AGENT_CAPACITY_EXCEEDED, http: 422, condition: "Agent already holds max_active_assignments assignments in {ASSIGNED, ACCEPTED}" }
  - { id: ERR_NO_ELIGIBLE_AGENT, http: 422, condition: "Auto-assignment pool is empty after eligibility filters" }
  - { id: ERR_PAYMENT_INSUFFICIENT, http: 422, condition: "Payment amount below the required cure/quote amount" }
  - { id: ERR_BID_BELOW_RESERVE, http: 422, condition: "gross_sale_cents < consignment.reserve_price_cents" }

# =============================================================================
# §1.5 API Endpoint Table
# READ_ROLES below = [RecoveryManager, RepoAgent, Auctioneer, ComplianceOfficer, Borrower]
# =============================================================================
endpoints:
  # --- Borrowers ---
  - { method: POST, path: "/borrowers", description: "Register a borrower", roles: [RecoveryManager], code: 201, input: [full_name, state_code, email], output: Borrower, side_effects: [] }
  - { method: GET, path: "/borrowers/{id}", description: "Get one borrower", roles: [RecoveryManager, RepoAgent, Auctioneer, ComplianceOfficer, Borrower], code: 200, input: [], output: Borrower, side_effects: [] }
  - { method: GET, path: "/borrowers/{id}/loan-accounts", description: "List a borrower's loans (FK reverse)", roles: [RecoveryManager, RepoAgent, Auctioneer, ComplianceOfficer, Borrower], code: 200, input: [], output: "LoanAccount[]", side_effects: [] }
  - { method: GET, path: "/borrowers/{id}/complaints", description: "List complaints filed by a borrower (FK reverse)", roles: [RecoveryManager, RepoAgent, Auctioneer, ComplianceOfficer, Borrower], code: 200, input: [], output: "Complaint[]", side_effects: [] }

  # --- Loan accounts ---
  - { method: POST, path: "/loan-accounts", description: "Create a loan account (collateral vehicle financing)", roles: [RecoveryManager], code: 201, input: [borrower_id, vin, governing_state_code, principal_balance_cents, apr_bps, monthly_payment_cents, "missed_installments?", "accrued_interest_cents?", "late_fees_cents?"], output: LoanAccount, side_effects: ["status = CURRENT, paid_to_date_cents = 0"] }
  - { method: GET, path: "/loan-accounts/{id}", description: "Get one loan account", roles: [RecoveryManager, RepoAgent, Auctioneer, ComplianceOfficer, Borrower], code: 200, input: [], output: LoanAccount, side_effects: [] }
  - { method: GET, path: "/loan-accounts/{id}/recovery-cases", description: "List cases of a loan (FK reverse)", roles: [RecoveryManager, RepoAgent, Auctioneer, ComplianceOfficer, Borrower], code: 200, input: [], output: "RecoveryCase[]", side_effects: [] }

  # --- Recovery cases ---
  - { method: POST, path: "/recovery-cases", description: "Open a recovery case on a loan (this IS the default determination)", roles: [RecoveryManager], code: 201, input: [loan_account_id, default_reason], output: RecoveryCase, side_effects: ["LoanAccount -> IN_DEFAULT", "opened_by_user_id = X-User-ID", "status = OPENED"] }
  - { method: GET, path: "/recovery-cases/{id}", description: "Get one recovery case", roles: [RecoveryManager, RepoAgent, Auctioneer, ComplianceOfficer, Borrower], code: 200, input: [], output: RecoveryCase, side_effects: [] }
  - { method: GET, path: "/recovery-cases", description: "List recovery cases with pagination/filtering", roles: [RecoveryManager, RepoAgent, Auctioneer, ComplianceOfficer, Borrower], code: 200, input: ["status?", "loan_account_id?", "limit?", "offset?"], output: "RecoveryCase[]", side_effects: [] }
  - { method: POST, path: "/recovery-cases/{id}/close", description: "Close a settled case", roles: [RecoveryManager], code: 200, input: [], output: RecoveryCase, side_effects: ["Case -> CLOSED; from DEFICIENCY_NOTICED also LoanAccount -> CHARGED_OFF"] }

  # --- Cure notices & payments ---
  - { method: POST, path: "/recovery-cases/{id}/cure-notices", description: "Issue (and immediately send) a right-to-cure notice; supersedes any live SENT notice. OCC-guarded.", roles: [RecoveryManager], code: 201, input: [expected_recovery_case_version], output: CureNotice, side_effects: ["cure_amount snapshot", "cure_deadline = now + 14d", "case OPENED -> CURE_PENDING (first notice)", "prior SENT notice -> SUPERSEDED", "increments RecoveryCase.version by 1"] }
  - { method: GET, path: "/recovery-cases/{id}/cure-notices", description: "List cure notices of a case (FK reverse)", roles: [RecoveryManager, RepoAgent, Auctioneer, ComplianceOfficer, Borrower], code: 200, input: [], output: "CureNotice[]", side_effects: [] }
  - { method: POST, path: "/recovery-cases/{id}/cure-payments", description: "Borrower pays the cure amount", roles: [Borrower], code: 201, input: [amount_cents], output: RecoveryLedgerEntry, side_effects: ["PAYMENT ledger entry", "LoanAccount.paid_to_date_cents += amount_cents", "case -> CURED and notice -> CURED when full and in-window"] }

  # --- Recovery accounting ledger ---
  - { method: POST, path: "/recovery-cases/{id}/ledger-entries", description: "Post a manual cost/adjustment entry (repo fee, storage, transport, key, other, adjustment)", roles: [RecoveryManager], code: 201, input: [kind, amount_cents, "memo?"], output: RecoveryLedgerEntry, side_effects: ["kind restricted to COST_* and ADJUSTMENT; appended immutably"] }
  - { method: GET, path: "/recovery-cases/{id}/ledger-entries", description: "List ledger entries of a case (FK reverse)", roles: [RecoveryManager, RepoAgent, Auctioneer, ComplianceOfficer, Borrower], code: 200, input: [], output: "RecoveryLedgerEntry[]", side_effects: [] }

  # --- Repossession agents ---
  - { method: POST, path: "/repo-agents", description: "Register a repossession agent vendor", roles: [RecoveryManager], code: 201, input: [name, license_number, licensed_state_codes, max_active_assignments], output: RepoAgent, side_effects: ["status = ACTIVE, scores = 100"] }
  - { method: GET, path: "/repo-agents/{id}", description: "Get one agent (both score variants)", roles: [RecoveryManager, RepoAgent, Auctioneer, ComplianceOfficer, Borrower], code: 200, input: [], output: RepoAgent, side_effects: [] }
  - { method: POST, path: "/repo-agents/{id}/suspend", description: "Manually suspend an agent", roles: [ComplianceOfficer], code: 200, input: [], output: RepoAgent, side_effects: ["Agent ACTIVE -> SUSPENDED; the suspension cascade (link 3) CANCELS the agent's {ASSIGNED, ACCEPTED} assignments"] }
  - { method: GET, path: "/repo-agents/{id}/repo-assignments", description: "List assignments of an agent (FK reverse)", roles: [RecoveryManager, RepoAgent, Auctioneer, ComplianceOfficer, Borrower], code: 200, input: [], output: "RepoAssignment[]", side_effects: [] }

  # --- Repossession assignments ---
  - { method: POST, path: "/recovery-cases/{id}/repo-assignments", description: "Assign an agent (explicit agent_id or server auto-selection per agent_auto_select)", roles: [RecoveryManager], code: 201, input: ["agent_id?", field_window_start, field_window_end], output: RepoAssignment, side_effects: ["Case CURE_EXPIRED/REPO_ACTIVE -> REPO_ACTIVE", "assignment created ASSIGNED"] }
  - { method: GET, path: "/recovery-cases/{id}/repo-assignments", description: "List assignments of a case (FK reverse)", roles: [RecoveryManager, RepoAgent, Auctioneer, ComplianceOfficer, Borrower], code: 200, input: [], output: "RepoAssignment[]", side_effects: [] }
  - { method: POST, path: "/repo-assignments/{id}/accept", description: "Agent accepts an assignment", roles: [RepoAgent], code: 200, input: [], output: RepoAssignment, side_effects: ["ASSIGNED -> ACCEPTED"] }
  - { method: POST, path: "/repo-assignments/{id}/report-secured", description: "Agent reports the vehicle secured, with condition/appraisal data", roles: [RepoAgent], code: 200, input: [odometer, condition_grade, trade_in_value_cents, auction_guide_low_cents], output: RepoAssignment, side_effects: ["Assignment -> SECURED", "case -> COLLATERAL_SECURED with appraisal fields copied", "agent score recompute (both variants)"] }
  - { method: POST, path: "/repo-assignments/{id}/report-breach", description: "Compliance records a breach-of-peace finding on an assignment", roles: [ComplianceOfficer], code: 200, input: [], output: RepoAssignment, side_effects: ["Assignment -> BREACHED_PEACE", "agent score recompute (-25)", "auto-suspension cascade when rolling score < 40"] }

  # --- Personal property ---
  - { method: POST, path: "/recovery-cases/{id}/personal-property-items", description: "Inventory a personal property item found in the vehicle", roles: [RepoAgent], code: 201, input: [description, "estimated_value_cents?"], output: PersonalPropertyItem, side_effects: ["case.property_item_count += 1"] }
  - { method: GET, path: "/recovery-cases/{id}/personal-property-items", description: "List property items of a case (FK reverse)", roles: [RecoveryManager, RepoAgent, Auctioneer, ComplianceOfficer, Borrower], code: 200, input: [], output: "PersonalPropertyItem[]", side_effects: [] }
  - { method: POST, path: "/personal-property-items/{id}/claim", description: "Borrower claims an item", roles: [Borrower], code: 200, input: [], output: PersonalPropertyItem, side_effects: ["INVENTORIED -> CLAIMED"] }
  - { method: POST, path: "/personal-property-items/{id}/unclaim", description: "Borrower withdraws a claim", roles: [Borrower], code: 200, input: [], output: PersonalPropertyItem, side_effects: ["CLAIMED -> INVENTORIED"] }
  - { method: POST, path: "/personal-property-items/{id}/mark-returned", description: "Agent marks a claimed item returned", roles: [RepoAgent], code: 200, input: [], output: PersonalPropertyItem, side_effects: ["CLAIMED -> RETURNED"] }
  - { method: POST, path: "/personal-property-items/{id}/dispose", description: "Agent disposes of an unclaimed item after the retention window", roles: [RepoAgent], code: 200, input: [], output: PersonalPropertyItem, side_effects: ["INVENTORIED -> DISPOSED"] }

  # --- Redemption / reinstatement ---
  - { method: POST, path: "/recovery-cases/{id}/redemption-quotes", description: "Issue a redemption or reinstatement quote; supersedes any live ISSUED quote. OCC-guarded.", roles: [RecoveryManager], code: 201, input: [quote_type, expected_recovery_case_version], output: RedemptionQuote, side_effects: ["first quote: case COLLATERAL_SECURED -> REDEMPTION_OPEN, redemption_deadline = now + 10d", "quoted_amount_cents snapshot per variant", "prior ISSUED quote -> SUPERSEDED", "increments RecoveryCase.version by 1"] }
  - { method: GET, path: "/recovery-cases/{id}/redemption-quotes", description: "List quotes of a case (FK reverse)", roles: [RecoveryManager, RepoAgent, Auctioneer, ComplianceOfficer, Borrower], code: 200, input: [], output: "RedemptionQuote[]", side_effects: [] }
  - { method: POST, path: "/redemption-quotes/{id}/accept", description: "Borrower pays and accepts a quote", roles: [Borrower], code: 200, input: [payment_amount_cents], output: RedemptionQuote, side_effects: ["Quote -> ACCEPTED", "PAYMENT ledger entry", "case -> REDEEMED or REINSTATED by quote_type", "loan -> REDEEMED_PAID or CURRENT"] }

  # --- Auction houses & consignments ---
  - { method: POST, path: "/auction-houses", description: "Register an auction house vendor", roles: [RecoveryManager], code: 201, input: [name, fee_bps, transport_fee_cents], output: AuctionHouse, side_effects: [] }
  - { method: GET, path: "/auction-houses/{id}", description: "Get one auction house", roles: [RecoveryManager, RepoAgent, Auctioneer, ComplianceOfficer, Borrower], code: 200, input: [], output: AuctionHouse, side_effects: [] }
  - { method: GET, path: "/auction-houses/{id}/consignments", description: "List consignments of an auction house (FK reverse)", roles: [RecoveryManager, RepoAgent, Auctioneer, ComplianceOfficer, Borrower], code: 200, input: [], output: "Consignment[]", side_effects: [] }
  - { method: POST, path: "/recovery-cases/{id}/consignments", description: "Consign the collateral to an auction house; reserve price computed at creation", roles: [RecoveryManager], code: 201, input: [auction_house_id], output: Consignment, side_effects: ["reserve_price_cents computed per reserve_price calc", "Consignment DRAFT"] }
  - { method: GET, path: "/recovery-cases/{id}/consignments", description: "List consignments of a case (FK reverse)", roles: [RecoveryManager, RepoAgent, Auctioneer, ComplianceOfficer, Borrower], code: 200, input: [], output: "Consignment[]", side_effects: [] }
  - { method: GET, path: "/consignments/{id}", description: "Get one consignment", roles: [RecoveryManager, RepoAgent, Auctioneer, ComplianceOfficer, Borrower], code: 200, input: [], output: Consignment, side_effects: [] }
  - { method: POST, path: "/consignments/{id}/list", description: "List a DRAFT consignment with a closed auction window", roles: [Auctioneer], code: 200, input: [listing_start, listing_end], output: Consignment, side_effects: ["DRAFT -> LISTED", "case -> IN_AUCTION"] }
  - { method: POST, path: "/consignments/{id}/relist", description: "Relist an UNSOLD consignment with markdown reserve", roles: [Auctioneer], code: 200, input: [listing_start, listing_end], output: Consignment, side_effects: ["reserve = round_half_up(prior * 0.95)", "relist_count += 1", "UNSOLD -> LISTED", "case -> IN_AUCTION"] }
  - { method: POST, path: "/consignments/{id}/report-sale", description: "Report a hammer price at or above reserve; creates the SaleRecord", roles: [Auctioneer], code: 201, input: [gross_sale_cents], output: SaleRecord, side_effects: ["SaleRecord PENDING_CERTIFICATION with fee lines and net_proceeds_cents computed", "consignment stays LISTED until certify"] }
  - { method: POST, path: "/consignments/{id}/report-unsold", description: "Report the vehicle did not sell", roles: [Auctioneer], code: 200, input: [], output: Consignment, side_effects: ["LISTED -> UNSOLD", "case -> CONSIGNMENT_PENDING"] }
  - { method: GET, path: "/consignments/{id}/sale-records", description: "List sale records of a consignment (FK reverse; 0 or 1 non-VOID)", roles: [RecoveryManager, RepoAgent, Auctioneer, ComplianceOfficer, Borrower], code: 200, input: [], output: "SaleRecord[]", side_effects: [] }
  - { method: POST, path: "/sale-records/{id}/certify", description: "Compliance certifies the sale as commercially reasonable", roles: [ComplianceOfficer], code: 200, input: [], output: SaleRecord, side_effects: ["PENDING_CERTIFICATION -> CERTIFIED", "consignment -> SOLD", "case -> SALE_CONFIRMED, sold_at = now"] }

  # --- Deficiency ---
  - { method: GET, path: "/recovery-cases/{id}/deficiency-estimate", description: "PROVISIONAL deficiency estimate (reserve x 0.9 as projected proceeds)", roles: [RecoveryManager, RepoAgent, Auctioneer, ComplianceOfficer, Borrower], code: 200, input: [], output: "{ estimated_deficiency_cents: integer, estimated_surplus_cents: integer, basis: string }", side_effects: [] }
  - { method: POST, path: "/recovery-cases/{id}/deficiency-notices", description: "Create a deficiency notice (FINAL deficiency_balance snapshot) after sale certification", roles: [RecoveryManager], code: 201, input: [], output: DeficiencyNotice, side_effects: ["deficiency_amount_cents / surplus_cents computed per FINAL variant", "notice DRAFT"] }
  - { method: GET, path: "/recovery-cases/{id}/deficiency-notices", description: "List deficiency notices of a case (FK reverse)", roles: [RecoveryManager, RepoAgent, Auctioneer, ComplianceOfficer, Borrower], code: 200, input: [], output: "DeficiencyNotice[]", side_effects: [] }
  - { method: POST, path: "/deficiency-notices/{id}/send", description: "Send the deficiency notice within the statutory 30-day window", roles: [RecoveryManager], code: 200, input: [], output: DeficiencyNotice, side_effects: ["DRAFT -> SENT", "case -> DEFICIENCY_NOTICED"] }
  - { method: POST, path: "/deficiency-notices/{id}/dispute", description: "Borrower disputes the deficiency amount", roles: [Borrower], code: 200, input: [], output: DeficiencyNotice, side_effects: ["SENT -> DISPUTED"] }
  - { method: POST, path: "/deficiency-notices/{id}/revise", description: "Manager revises a disputed notice (amount adjusted, back to SENT)", roles: [RecoveryManager], code: 200, input: [adjustment_cents, reason], output: DeficiencyNotice, side_effects: ["deficiency_amount_cents = max(0, prior + adjustment_cents)", "DISPUTED -> SENT", "version increments"] }
  - { method: POST, path: "/deficiency-notices/{id}/waive", description: "Compliance waives the deficiency", roles: [ComplianceOfficer], code: 200, input: [], output: DeficiencyNotice, side_effects: ["SENT/DISPUTED -> WAIVED", "surplus (if any) settled via REFUND entry"] }
  - { method: POST, path: "/deficiency-notices/{id}/record-payment", description: "Borrower pays toward the deficiency", roles: [Borrower], code: 200, input: [amount_cents], output: DeficiencyNotice, side_effects: ["paid_cents += amount_cents", "PAYMENT ledger entry", "loan.paid_to_date_cents += amount_cents", "-> PAID when paid_cents >= deficiency_amount_cents"] }

  # --- Complaints ---
  - { method: POST, path: "/recovery-cases/{id}/complaints", description: "Borrower files a wrongful-repossession complaint; freezes the case into COMPLAINT_REVIEW", roles: [Borrower], code: 201, input: [category, description], output: Complaint, side_effects: ["Complaint UNDER_REVIEW", "case -> COMPLAINT_REVIEW with pre_complaint_state saved", "LISTED consignment (if any) -> WITHDRAWN"] }
  - { method: GET, path: "/recovery-cases/{id}/complaints", description: "List complaints of a case (FK reverse)", roles: [RecoveryManager, RepoAgent, Auctioneer, ComplianceOfficer, Borrower], code: 200, input: [], output: "Complaint[]", side_effects: [] }
  - { method: POST, path: "/complaints/{id}/resolve", description: "Compliance resolves a complaint; UPHELD triggers the restitution cascade", roles: [ComplianceOfficer], code: 200, input: [outcome], output: Complaint, side_effects: ["DISMISSED: case restored to pre_complaint_state", "UPHELD: restitution cascade (notice VOID, sale VOID, consignments WITHDRAWN, ledger REVERSAL entries, loan CURRENT, case RESTITUTION)"] }

  # --- Test-driving logical clock ---
  - { method: POST, path: "/_clock/set_current_utc", description: "Set the logical clock. Startup default (before any call) is exactly 2026-05-01T00:00:00Z; the clock never falls back to wall-clock. Advancing the clock atomically applies every due automatic transition in dependency order: cure notices EXPIRED then cases CURE_EXPIRED; ISSUED quotes EXPIRED then cases CONSIGNMENT_PENDING (quote and case expiry fire only while the case is still REDEMPTION_OPEN — a COMPLAINT_REVIEW-frozen case and its quote are left untouched); stale ASSIGNED assignments EXPIRED (with score recompute and possible suspension cascade).", roles: [RecoveryManager, ComplianceOfficer], code: 200, input: [to_iso8601], output: "{ current_utc: string }", side_effects: ["all due automatic transitions"] }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: RecoveryManager
    description: "Lender recovery-unit operator: opens cases, issues notices and quotes, assigns agents, consigns collateral, posts costs, sends deficiency notices"
    identity: opaque
    exclusive_operations:
      - "POST /borrowers, /loan-accounts, /recovery-cases, /repo-agents, /auction-houses"
      - "POST /recovery-cases/{id}/cure-notices, /ledger-entries, /repo-assignments, /redemption-quotes, /consignments, /deficiency-notices"
      - "POST /deficiency-notices/{id}/send, /revise; POST /recovery-cases/{id}/close"
    shared_operations:
      - "All GET endpoints"
      - "POST /_clock/set_current_utc (shared with ComplianceOfficer)"
  - name: RepoAgent
    description: "Repossession field vendor; X-User-ID is the RepoAgent id"
    identity: "entity_backed:RepoAgent"
    exclusive_operations:
      - "POST /repo-assignments/{id}/accept, /report-secured (own assignments only)"
      - "POST /recovery-cases/{id}/personal-property-items, /personal-property-items/{id}/mark-returned, /dispose (cases where the agent holds the SECURED assignment)"
    shared_operations: ["All GET endpoints"]
  - name: Auctioneer
    description: "Auction house operator; X-User-ID is the AuctionHouse id"
    identity: "entity_backed:AuctionHouse"
    exclusive_operations:
      - "POST /consignments/{id}/list, /relist, /report-sale, /report-unsold (own house's consignments only)"
    shared_operations: ["All GET endpoints"]
  - name: ComplianceOfficer
    description: "Independent compliance adjudicator; segregated from the case-opening RecoveryManager"
    identity: opaque
    exclusive_operations:
      - "POST /repo-agents/{id}/suspend"
      - "POST /repo-assignments/{id}/report-breach"
      - "POST /sale-records/{id}/certify"
      - "POST /deficiency-notices/{id}/waive"
      - "POST /complaints/{id}/resolve"
    shared_operations:
      - "All GET endpoints"
      - "POST /_clock/set_current_utc (shared with RecoveryManager)"
  - name: Borrower
    description: "Loan borrower; X-User-ID is the Borrower id; acts only on cases of own loans"
    identity: "entity_backed:Borrower"
    exclusive_operations:
      - "POST /recovery-cases/{id}/cure-payments, /complaints (own cases)"
      - "POST /redemption-quotes/{id}/accept; POST /personal-property-items/{id}/claim, /unclaim"
      - "POST /deficiency-notices/{id}/dispute, /record-payment (own notices)"
    shared_operations: ["All GET endpoints"]
