      - name: conditional_action_credit_delivery_only_while_credit_remains
        claim_type: conditional_action
        grounds:
          - endpoints[POST /investor-deliveries]
          - validations[priority=116]
          - errors[ERR_NO_UNDELIVERED_CREDIT]
        distinguishing_aspect: |
          The delivery endpoint is conditional in a way that is easy to get backwards:
          an over-ask is NOT refused - it is clamped down to whatever remainder is
          left - so the only thing that closes the gate is the remainder reaching
          exactly zero. That makes the refusal reachable only after the strip that
          consumed the last cent, and it must be a 422 on the remainder rather than a
          409 on the allocation state, because the allocation is still ISSUED and
          perfectly healthy. Rescinding the full strip reopens the condition, so the
          gate has to be evaluated per request against live aggregates rather than
          latched once the allocation has been fully subscribed.
        test_recipe:
          setup:
            - "CF chain to an ISSUED credit allocation: total_credit_cents 71000000, undelivered 71000000, Form 8609 signed by hfa-alloc-3."
