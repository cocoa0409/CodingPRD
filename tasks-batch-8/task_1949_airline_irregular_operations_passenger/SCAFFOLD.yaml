# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  - { method: POST, path: "/irops/_clock/set_current_utc", description: "Set the logical clock (test-driving). Server starts at 2026-08-01T00:00:00Z before any set; never falls back to wall-clock.", roles: [OpsAdmin], code: 200, input: [to_iso8601], output: { current_utc: string }, side_effects: [] }

  - { method: POST, path: "/irops/passengers", description: "Register a passenger", roles: [ReaccommodationAgent, OpsController], code: 201, input: [full_name, contact_email, "loyalty_tier?", "special_service_codes?"], output: Passenger, side_effects: [] }
  - { method: GET, path: "/irops/passengers/{id}", description: "Read one passenger", roles: [ReaccommodationAgent, OpsController, DutyManager, FinanceProcessor, CrewScheduler, OpsAdmin, Passenger], code: 200, input: [], output: Passenger, side_effects: [] }
  - { method: GET, path: "/irops/passengers", description: "List passengers", roles: [ReaccommodationAgent, OpsController, DutyManager, OpsAdmin], code: 200, input: ["loyalty_tier?", "limit?", "offset?"], output: "Passenger[]", side_effects: [] }

  - { method: POST, path: "/irops/flights", description: "Create a flight with its cabin inventories", roles: [OpsController], code: 201, input: [flight_number, origin, destination, sched_dep_utc, sched_arr_utc, distance_km, operating_carrier, cabins], output: Flight, side_effects: ["creates one CabinInventory per entry in cabins (seats_sold = 0, interline_seats_committed = 0)"] }
  - { method: GET, path: "/irops/flights/{id}", description: "Read one flight", roles: [OpsController, DutyManager, ReaccommodationAgent, CrewScheduler, FinanceProcessor, OpsAdmin, Passenger], code: 200, input: [], output: Flight, side_effects: [] }
  - { method: GET, path: "/irops/flights", description: "List flights", roles: [OpsController, DutyManager, ReaccommodationAgent, CrewScheduler, FinanceProcessor, OpsAdmin], code: 200, input: ["flight_status?", "disruption_event_id?", "limit?", "offset?"], output: "Flight[]", side_effects: [] }
  - { method: GET, path: "/irops/flights/{id}/cabin-inventories", description: "List cabin inventories of a flight", roles: [OpsController, DutyManager, ReaccommodationAgent, CrewScheduler, FinanceProcessor, OpsAdmin], code: 200, input: [], output: "CabinInventory[]", side_effects: [] }
  - { method: POST, path: "/irops/flights/{id}/delay", description: "Delay or retime a flight; OCC-guarded; triggers crew legality re-eval and misconnect protection cascade", roles: [OpsController], code: 200, input: [new_sched_dep_utc, new_sched_arr_utc, expected_flight_version, "disruption_event_id?"], output: Flight, side_effects: ["increments Flight.version by 1", "crew_legality_eval", "misconnect cascade to segments/bookings/cases/comms"] }
  - { method: POST, path: "/irops/flights/{id}/cancel", description: "Cancel a flight under a disruption event; OCC-guarded; runs the depth-4 cancellation cascade", roles: [OpsController], code: 200, input: [disruption_event_id, expected_flight_version], output: Flight, side_effects: ["increments Flight.version by 1", "segments CANCELLED", "bookings DISRUPTED", "cases created", "comms queued", "event counters recomputed", "compensation eligibility when event controllable"] }
  - { method: POST, path: "/irops/flights/{id}/depart", description: "Mark departure with actual time", roles: [OpsController], code: 200, input: [act_dep_utc], output: Flight, side_effects: ["increments Flight.version by 1"] }
  - { method: POST, path: "/irops/flights/{id}/record-actuals", description: "Record actual arrival; transitions IN_FLIGHT -> ARRIVED; flows segments; recomputes final compensation", roles: [OpsController], code: 200, input: [act_arr_utc], output: Flight, side_effects: ["increments Flight.version by 1", "segments FLOWN", "booking COMPLETED rollup", "compensation final variant recompute", "arrival-delay eligibility sweep"] }

  - { method: POST, path: "/irops/disruption-events", description: "Open a disruption event (detection)", roles: [DutyManager], code: 201, input: [event_code, hub, classification, cost_cap_cents], output: DisruptionEvent, side_effects: ["detected_at = logical now"] }
  - { method: GET, path: "/irops/disruption-events/{id}", description: "Read one disruption event", roles: [DutyManager, OpsController, ReaccommodationAgent, FinanceProcessor, OpsAdmin], code: 200, input: [], output: DisruptionEvent, side_effects: [] }
  - { method: GET, path: "/irops/disruption-events", description: "List disruption events", roles: [DutyManager, OpsController, ReaccommodationAgent, FinanceProcessor, OpsAdmin], code: 200, input: ["event_status?", "classification?", "limit?", "offset?"], output: "DisruptionEvent[]", side_effects: [] }
