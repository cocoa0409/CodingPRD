            - "Waiver.${wv_id}.status == VOID"

      # --- derived_field_reconciliation already covered by §1.8 ---
      - name: derived_seats_reconciliation_already_covered
        claim_type: derived_field_reconciliation
        grounds: [calculations.window_seats]
        excluded_because:
          difficulty_instance: compensating_invariant / seat_conservation_create_then_cancel
          rationale: "seats_held/committed/available reconciliation on create+cancel is asserted in that §1.8 instance."

      # --- rate_threshold_triggers already covered by §1.8 ---
      - name: group_threshold_trigger_already_covered
        claim_type: rate_threshold_triggers
        grounds: [calculations.group_quote]
        excluded_because:
          difficulty_instance: non_linear_state_machine / group_booking_cyclic_revise_requote_loop
          rationale: "The headcount>=15 group-rate threshold crossing (12 head no-discount -> 30 head discounted) is asserted in that §1.8 instance."

  # ===========================================================================
  - section: consistency_model
    instances:
      - name: closure_cascade_visible_in_same_request_immediate
        claim_type: immediate
        grounds: [state_machines.Farm.OPEN_to_CLOSED]
        excluded_because:
          difficulty_instance: transitive_cascade / closure_cascade_depth3_farm_window_reservation_wallet
          rationale: "Immediate consistency (all cascade effects visible after the single CLOSURE POST) is asserted by reading window/reservation/wallet/ledger in that §1.8 instance."
