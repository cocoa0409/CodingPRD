      - name: overpayment_satisfied_at_exact_total_not_over
        grounds:
          - state_machines.Overpayment.RECOVERING_to_SATISFIED
          - validations[priority=13]
          - entities.Overpayment.fields.recovered_cents
        distinguishing_aspect: |
          Exact-total boundary on a DIFFERENT metric (Overpayment.recovered_cents)
          reached through a DIFFERENT endpoint (POST /recoveries): a recovery that
          makes recovered_cents == total_assessed_cents (40000) flips to SATISFIED,
