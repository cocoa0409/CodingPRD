      - name: zone_capacity_exact_boundary
        grounds:
          - calculations.zone_occupancy
          - errors[ERR_ZONE_AT_CAPACITY]
          - entities.StoreZone.fields.current_count
        distinguishing_aspect: |
          Metric = integer occupancy count via POST /reuse/items/{id}/place: with capacity 2
          the second place succeeds (count becomes 2 == capacity) and the third fails —
          full means current_count >= capacity, an exact-equality rejection.
        test_recipe:
          setup:
            - "Zone ZCAP capacity 2, threshold 0; three PRICED items in BACKROOM"
          setup_api_calls:
            - call: "POST /reuse/categories"
              payload: { code: "WINDOWS", display_name: "Windows", pricing_model: "PER_UNIT", base_rate_cents: 9000, hazmat_risk_flag: false, markdown_after_days: 30, markdown_step_pct: 0.20, markdown_interval_days: 15, max_markdown_steps: 2, floor_price_pct: 0.40, target_turn_days: 45 }
