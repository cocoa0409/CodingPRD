              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
            - call: "POST /demurrage/disputes/${dsp_id}/begin-review"
              payload: {}
              as: DemurrageAdjudicator
              as_user_id: "adj-r3i2-a"
            - call: "POST /demurrage/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-28T09:00:00Z" }
              as: BillingAdmin
            - call: "POST /demurrage/disputes/${dsp_id}/decide"
              payload: { decision: "PARTIALLY_ALLOWED", allowance_pct: 0.65, decision_rationale: "Carrier bears most of the delay." }
              as: DemurrageAdjudicator
              as_user_id: "adj-r3i2-a"
            - call: "POST /demurrage/_clock/set_current_utc"
