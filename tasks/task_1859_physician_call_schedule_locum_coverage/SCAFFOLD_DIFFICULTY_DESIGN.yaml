  - rule_id: transitive_cascade
    instances:
      - name: credentialing_completion_autofill_cascade
        grounds:
          - state_machines.CredentialingCase.IN_PROGRESS_to_CLEARED
          - state_machines.LocumRequisition.READY_to_FILLED
          - state_machines.CallSlot.OPEN_to_ASSIGNED
          - state_machines.CoverageGap.REQUISITIONED_to_RESOLVED
        distinguishing_aspect: |
          Depth-5 chain from complete-item of the fifth checklist item: case -> CLEARED (hop 1)
          causes requisition CREDENTIALING -> READY -> FILLED (hop 2), which causes auto-fill
          CallAssignment creation (hop 3), which causes slot OPEN -> ASSIGNED (hop 4) and gap
          -> RESOLVED plus payroll reserve update (hop 5) — each hop caused by the previous one,
          triggered by complete-item (distinct from the unavailability-approval trigger).
        test_recipe:
          setup:
            - "PUBLISHED program covering only 2026-09-08 with 1 weekday primary; slot OPEN with GENERATION_SHORTFALL gap; requisition SOURCED with LOCUM candidate L1 and case in CREDENTIALING; clock at default 2026-08-01T00:00:00Z (clear_by 2026-09-03T07:00:00Z)"
          setup_api_calls:
            - call: "POST /api/call-programs"
              payload: { name: "Cards AutoFill", service_line: "CARDIOLOGY", period_start: "2026-09-08", period_end: "2026-09-08", payroll_budget_cents: 1000000, weekday_primary_required: 1, weekend_primary_required: 0, holiday_primary_required: 0, weekday_backup_required: 0, weekend_backup_required: 0, holiday_backup_required: 0 }
