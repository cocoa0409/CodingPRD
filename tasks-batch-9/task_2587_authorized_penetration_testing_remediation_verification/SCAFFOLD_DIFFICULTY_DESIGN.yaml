  - rule_id: priority_pair_validation_conflict
    instances:
      - name: excluded_target_outranks_expired_testing_window
        grounds:
          - validations.priority_36_ERR_TARGET_EXCLUDED
          - validations.priority_58_ERR_OUTSIDE_TESTING_WINDOW
          - endpoints.POST_/pentest/findings
          - state_machines.AuthorizedTarget.ACTIVE_to_EXCLUDED
        distinguishing_aspect: |
          Category pair business_safety (priority 36) vs business_temporal (priority 58): one request
          violates BOTH — the asset was explicitly excluded from the rules of engagement AND the clock
          has moved past window_end. The safety error must win, because an operator who excluded a
          target needs to hear about the exclusion rather than about the calendar.
        test_recipe:
          setup:
            - "An EXECUTING, AUTHORIZED engagement on Asset A with window 2026-09-05T00:00:00Z..2026-09-30T23:59:59Z and tester t1 PROVISIONED with Asset A granted."
            - "The single AuthorizedTarget on Asset A has been EXCLUDED, so the document is still SIGNED but active_target_count is 0."
            - "The logical clock is then pushed to 2026-10-05T00:00:00Z, five days past window_end."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /pentest/assets"
              payload: { name: "Payments API", asset_class: "APPLICATION", criticality_tier: 1, compliance_regimes: ["SOC2"], exposure_score: 88, last_tested_at: "2025-10-02T00:00:00Z" }
              as: PlatformAdmin
              captures: { asset_a_id: $.data.id }
