# =============================================================================
# PRD Benchmark Seed Tables — task_2287_employer_sponsored_backup_child_care
# §1.0–§1.7. Difficulty design (§1.8) lives in SCAFFOLD_DIFFICULTY_DESIGN.yaml;
# corner design (§1.9) lives in SCAFFOLD_CORNER_DESIGN.yaml.
# =============================================================================

scenario: |
  2287. Employer-Sponsored Backup Child Care (Bright Horizons back-up care): employer benefit design with annual use limits, copay levels and eligible dependent definitions, reservation intake with center-based versus in-home care matching, provider network capacity, credentialing and same-day availability, care confirmation, cancellation windows and no-show charge rules, usage tracking against employee entitlement with overage billing, adult and elder backup care extension of the benefit, employer invoicing, utilization reporting and renewal analytics, incident reporting and quality assurance across the network

domain_name: employer-backup-care
api_prefix: /backup-care

complexity_profile:
  primary_archetype: quota_allocation
  secondary_archetype: temporal_windowing
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - selector_policy

  entity_topology: graph
  # Providers, employees, dependents and reservations form a many-to-many
  # candidate/assignment graph (Reservation -> MatchOffer -> Provider ->
  # CapacityBlock) with a self-referential supersede edge on BenefitPlan and a
  # polymorphic dependent axis (CHILD vs ADULT_ELDER). No strict ownership tree.

  state_machine_shape: parallel
  # Reservation carries TWO independent dimensions (fulfillment_status ×
  # billing_status). Provider.network_status is cyclic
  # (CREDENTIALED -> PROBATION -> CREDENTIALED, SUSPENDED -> CREDENTIALED) and
  # IncidentReport is branching (UNDER_REVIEW -> {SUBSTANTIATED, DISMISSED} with
  # divergent side-effect sets).

  relationship_patterns:
    - one_to_many        # Employer -> BenefitPlan, Employee -> Dependent
    - many_to_many       # Reservation <-> Provider through MatchOffer
    - self_referential   # BenefitPlan.superseded_by_plan_id -> BenefitPlan.id
    - polymorphic        # Dependent.dependent_type gates plan eligibility
    - cross_aggregate    # Reservation -> CapacityBlock (provider aggregate)

  role_model: peer_roles
  consistency_model: immediate

  difficulty_level: expert_plus
  # 13 entities / 65 endpoints / 73 error codes / 12 calculations (3 dual-variant,
  # 3 combinatorial modes) / 7 state machines across 6 entities (2 non-linear on
  # distinct entities) / 2 OCC concurrency rules / 51 ordered validations.
  # Deliberately above the Expert band (§0.4) on entity count, calculation count
  # and state-machine count. Density target: every calculation reads at least two
  # entities, and every terminal transition compensates a conserved quantity.

# =============================================================================
# §1.0 Response Envelope (FIXED — VERBATIM)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:

  # ---------------------------------------------------------------- Employer --
  - name: Employer
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: Legal name of the sponsoring employer
        constraints: non-empty, max 200 chars
      - name: industry_code
        type: string
        source: input
        description: Employer industry code used only in renewal analytics grouping
        constraints: non-empty, max 16 chars
      - name: contract_status
        type: enum
        source: input
        description: Commercial contract posture of the employer account
        default: ACTIVE
        constraints: one of {ACTIVE, SUSPENDED, TERMINATED}
      - name: fiscal_year_start_month
        type: integer
        source: input
        description: Calendar month (1-12) that starts the employer benefit year used for entitlement resets
        default: 1
        constraints: 1 <= value <= 12
      - name: invoicing_cycle
        type: enum
        source: input
        description: Billing cadence recorded on the account; does not itself schedule invoices
        default: MONTHLY
        constraints: one of {MONTHLY, QUARTERLY}
      - name: admin_fee_pct
        type: number
        source: input
        description: Administrative fee rate applied to an invoice subtotal
        default: 0.085
        constraints: 0 <= value <= 0.5, at most 4 decimal places
      - name: overage_billing_enabled
        type: boolean
        source: input
        description: When false, a reservation that would consume days beyond the employee entitlement is rejected instead of accruing overage
        default: true
      - name: adult_elder_extension_enabled
        type: boolean
        source: input
        description: When false, reservations containing an ADULT_ELDER dependent are rejected regardless of plan eligible_dependent_types
        default: false
      - name: accrued_overage_cents_current_period
        type: integer
        source: computed
        description: Sum of UsageLedgerEntry.cents_delta for entry_type OVERAGE_ACCRUE minus OVERAGE_REVERSE across all employees of this employer whose effective_at falls in the employer benefit year containing the logical clock; read as the tier snapshot by overage_tier_multiplier
        default: 0
      - name: ytd_billed_cents
        type: integer
        source: computed
        description: Sum of EmployerInvoice.total_cents for invoices of this employer with invoice_status IN {ISSUED, PAID}
        default: 0

  # ------------------------------------------------------------- BenefitPlan --
  - name: BenefitPlan
    parent: null
    common_fields: true
    fields:
      - name: employer_id
        type: string
        source: input
        description: FK -> Employer.id; the employer that owns this benefit design
      - name: plan_code
        type: string
        source: input
        description: Human-readable plan identifier
        constraints: unique per employer_id across plans whose status IN {DRAFT, ACTIVE}
      - name: annual_use_limit_days
        type: integer
        source: input
        description: Entitlement days per employee per employer benefit year
        constraints: 1 <= value <= 60
      - name: copay_center_cents_per_day
        type: integer
        source: input
        description: Employee copay charged per covered center-based care day
        constraints: 0 <= value <= 100000
      - name: copay_in_home_cents_per_hour
        type: integer
        source: input
        description: Employee copay charged per covered in-home billable hour
        constraints: 0 <= value <= 100000
      - name: in_home_min_billable_hours
        type: number
        source: input
        description: Minimum billable hours floor applied to any in-home reservation
        default: 4
        constraints: 0 < value <= 12, multiple of 0.25
      - name: eligible_dependent_types
        type: array
        source: input
        description: Dependent types this plan covers
        constraints: non-empty subset of {CHILD, ADULT_ELDER}, no duplicates
      - name: max_dependents_per_reservation
        type: integer
        source: input
        description: Upper bound on dependent_ids length for a single reservation
        default: 3
        constraints: 1 <= value <= 6
      - name: overage_rate_center_cents_per_day
        type: integer
        source: input
        description: Employer-billed rate per overage center-based care day before the tier multiplier
        constraints: 0 <= value <= 500000
      - name: overage_rate_in_home_cents_per_hour
        type: integer
        source: input
        description: Employer-billed rate per overage in-home hour before the tier multiplier
        constraints: 0 <= value <= 500000
      - name: cancellation_window_hours
        type: integer
        source: input
        description: Hours before care_start_utc up to and including which a cancellation is penalty-free
        default: 24
        constraints: 0 <= value <= 168
      - name: no_show_charge_cents
        type: integer
        source: input
        description: Employer-billed charge when a confirmed reservation is marked NO_SHOW
        constraints: 0 <= value <= 200000
      - name: effective_from
        type: datetime
        source: input
        description: Inclusive start of the plan validity window
      - name: effective_to
        type: datetime
        source: input
        description: Exclusive end of the plan validity window; null means open-ended
        default: null
      - name: status
        type: enum
        source: system
        description: Plan lifecycle state
        default: DRAFT
        constraints: one of {DRAFT, ACTIVE, SUPERSEDED}
      - name: superseded_by_plan_id
        type: string
        source: computed
        description: FK -> BenefitPlan.id; set on the outgoing ACTIVE plan when a newer plan of the same employer is activated; null otherwise
        default: null
      - name: enrolled_employee_count
        type: integer
        source: computed
        description: Count of Employee rows whose benefit_plan_id equals this plan id and employment_status IN {ACTIVE, LEAVE}
        default: 0

  # ---------------------------------------------------------------- Employee --
  - name: Employee
    parent: null
    common_fields: true
    fields:
      - name: employer_id
        type: string
        source: input
        description: FK -> Employer.id; sponsoring employer
      - name: benefit_plan_id
        type: string
        source: input
        description: FK -> BenefitPlan.id; the plan this employee is enrolled in at creation time
      - name: employee_external_id
        type: string
        source: input
        description: Employer-side payroll identifier
        constraints: unique per employer_id
      - name: user_id
        type: string
        source: input
        description: X-User-ID that identifies this employee as an employee_user caller; every employee_user request is scoped to the Employee row carrying its own user_id
        constraints: non-empty, max 80 chars, globally unique
      - name: email
        type: string
        source: input
        description: Contact email for care confirmations
        constraints: must contain '@'
      - name: full_name
        type: string
        source: input
        description: Employee full name
        constraints: non-empty, max 200 chars
      - name: employment_status
        type: enum
        source: input
        description: Employment posture gating benefit use
        default: ACTIVE
        constraints: one of {ACTIVE, LEAVE, TERMINATED}
      - name: entitlement_days_used
        type: number
        source: computed
        description: Sum of UsageLedgerEntry.days_delta for entry_type COMMIT for this employee within the current employer benefit year
        default: 0
      - name: entitlement_days_reserved
        type: number
        source: computed
        description: Sum of UsageLedgerEntry.days_delta for entry_type IN {RESERVE, RELEASE} for this employee within the current employer benefit year
        default: 0
      - name: no_show_strike_count
        type: integer
        source: computed
        description: Count of UsageLedgerEntry rows with entry_type NO_SHOW_CHARGE for this employee within the current employer benefit year
        default: 0
      - name: eligibility_status
        type: enum
        source: computed
        description: INELIGIBLE when employment_status != ACTIVE or the employer contract_status != ACTIVE; else RESTRICTED when no_show_strike_count >= NO_SHOW_STRIKE_LIMIT; else ELIGIBLE
        default: ELIGIBLE
        constraints: one of {ELIGIBLE, RESTRICTED, INELIGIBLE}

  # --------------------------------------------------------------- Dependent --
  - name: Dependent
    parent: Employee
    common_fields: true
    fields:
      - name: employee_id
        type: string
        source: input
        description: FK -> Employee.id; the employee this dependent belongs to
      - name: full_name
        type: string
        source: input
        description: Dependent full name
        constraints: non-empty, max 200 chars
      - name: dependent_type
        type: enum
        source: input
        description: Care track for this dependent
        constraints: one of {CHILD, ADULT_ELDER}
      - name: date_of_birth
        type: string
        source: input
        description: ISO 8601 calendar date (YYYY-MM-DD) of birth
      - name: relationship
        type: string
        source: input
        description: Relationship to the employee (e.g. SON, DAUGHTER, PARENT, SPOUSE)
        constraints: non-empty, max 40 chars
      - name: care_notes
        type: string
        source: input
        description: Free-text care instructions forwarded to the matched provider
        default: ""
      - name: status
        type: enum
        source: input
        description: Whether the dependent may appear on new reservations
        default: ACTIVE
        constraints: one of {ACTIVE, INACTIVE}

  # ---------------------------------------------------------------- Provider --
  - name: Provider
    parent: null
    common_fields: true
    fields:
      - name: provider_name
        type: string
        source: input
        description: Network provider name
        constraints: non-empty, max 200 chars
      - name: owner_user_id
        type: string
        source: input
        description: X-User-ID of the provider_manager permitted to act on this provider's capacity, credentials and reservations
        constraints: non-empty, max 80 chars
      - name: care_mode
        type: enum
        source: input
        description: The single care modality this provider delivers
        constraints: one of {CENTER_BASED, IN_HOME}
      - name: market_code
        type: string
        source: input
        description: Service market the provider serves; must equal a reservation market_code to be a match candidate
        constraints: non-empty, max 16 chars
      - name: postal_code
        type: string
        source: input
        description: Postal code of the center or of the caregiver home base
        constraints: non-empty, max 16 chars
      - name: network_status
        type: enum
        source: system
        description: Credentialing and quality posture that gates matching and confirmation
        default: PENDING
        constraints: one of {PENDING, CREDENTIALED, PROBATION, SUSPENDED, DEPROVISIONED}
      - name: daily_capacity_slots
        type: integer
        source: input
        description: Default seat count copied onto new CENTER_BASED capacity blocks when total_slots is omitted
        default: 0
        constraints: 0 <= value <= 500
      - name: max_concurrent_assignments
        type: integer
        source: input
        description: Maximum number of buffer-expanded overlapping active assignments an IN_HOME provider may hold
        default: 1
        constraints: 1 <= value <= 10
      - name: same_day_available
        type: boolean
        source: input
        description: When false the provider is excluded from candidate sets whose reservation care_date equals the logical clock date
        default: false
      - name: quality_score
        type: number
        source: computed
        description: ROLLING_90D variant of provider_quality_score; the value the matching ranker reads
        default: 100
      - name: lifetime_quality_score
        type: number
        source: computed
        description: LIFETIME_UNDECAYED variant of provider_quality_score; the value renewal analytics and network-status review read
        default: 100
      - name: substantiated_incident_count
        type: integer
        source: computed
        description: Count of IncidentReport rows for this provider whose incident_status is SUBSTANTIATED
        default: 0
      - name: completed_reservation_count
        type: integer
        source: computed
        description: Count of Reservation rows whose matched_provider_id equals this provider id and fulfillment_status is COMPLETED
        default: 0
      - name: last_status_reason_code
        type: string
        source: system
        description: Reason code recorded by the most recent network_status transition
        default: null

  # -------------------------------------------------------------- Credential --
  - name: Credential
    parent: Provider
    common_fields: true
    fields:
      - name: provider_id
        type: string
        source: input
        description: FK -> Provider.id; the credentialed provider
      - name: credential_type
        type: enum
        source: input
        description: Credential category
        constraints: one of {LICENSE, BACKGROUND_CHECK, CPR, INSURANCE}
      - name: issued_on
        type: string
        source: input
        description: ISO 8601 calendar date the credential was issued
      - name: expires_on
        type: string
        source: input
        description: ISO 8601 calendar date the credential expires; expiry is evaluated as expires_on < logical clock date
        constraints: must be strictly after issued_on
      - name: verified_by
        type: string
        source: input
        description: Identifier of the operator who verified the document
        constraints: non-empty, max 80 chars
      - name: status
        type: enum
        source: system
        description: Credential validity state
        default: VALID
        constraints: one of {VALID, EXPIRED, REVOKED}
      - name: revoked_reason_code
        type: string
        source: system
        description: Reason code captured when the credential is revoked
        default: null

  # ------------------------------------------------------------ CapacityBlock --
  - name: CapacityBlock
    parent: Provider
    common_fields: true
    fields:
      - name: provider_id
        type: string
        source: input
        description: FK -> Provider.id; provider offering this block of capacity
      - name: service_date
        type: string
        source: computed
        description: UTC calendar date derived from start_time_utc
      - name: start_time_utc
        type: datetime
        source: input
        description: Inclusive start of the block's servable interval
      - name: end_time_utc
        type: datetime
        source: input
        description: Exclusive end of the block's servable interval
        constraints: must be strictly after start_time_utc and on the same UTC calendar date
      - name: total_slots
        type: integer
        source: input
        description: Seat capacity of the block; governs aggregate capacity only when the owning provider care_mode is CENTER_BASED
        constraints: 0 <= value <= 500
      - name: reserved_slots
        type: integer
        source: computed
        description: Sum of Reservation.required_seats over reservations whose matched_capacity_block_id equals this block id and fulfillment_status IN {CONFIRMED, IN_SERVICE}
        default: 0
      - name: committed_slots
        type: integer
        source: computed
        description: Sum of Reservation.required_seats over reservations whose matched_capacity_block_id equals this block id and fulfillment_status IN {COMPLETED, NO_SHOW}
        default: 0
      - name: block_status
        type: enum
        source: computed
        description: CLOSED once the block is past-dated or closed by maintenance; otherwise FULL when the owning provider care_mode is CENTER_BASED and reserved_slots + committed_slots >= total_slots; otherwise OPEN. FULL is unreachable for IN_HOME providers.
        default: OPEN
        constraints: one of {OPEN, FULL, CLOSED}

  # ------------------------------------------------------------- Reservation --
  - name: Reservation
    parent: null
    common_fields: true
    fields:
      - name: employee_id
        type: string
        source: input
        description: FK -> Employee.id; the employee consuming entitlement
      - name: benefit_plan_id
        type: string
        source: computed
        description: FK -> BenefitPlan.id; copied from Employee.benefit_plan_id at intake and never re-read afterwards
      - name: plan_version_pinned
        type: integer
        source: system
        description: BenefitPlan.version observed at intake; all charge math for this reservation uses the plan design as of this version
      - name: requested_care_mode
        type: enum
        source: input
        description: Care modality requested by the employee
        constraints: one of {CENTER_BASED, IN_HOME, EITHER}
      - name: market_code
        type: string
        source: input
        description: Market the care must be delivered in; must equal Provider.market_code for a candidate
        constraints: non-empty, max 16 chars
      - name: care_start_utc
        type: datetime
        source: input
        description: Inclusive start of the requested care window
      - name: care_end_utc
        type: datetime
        source: input
        description: Exclusive end of the requested care window
        constraints: strictly after care_start_utc, same UTC calendar date, duration <= 14 hours
      - name: care_date
        type: string
        source: computed
        description: UTC calendar date derived from care_start_utc
      - name: dependent_ids
        type: array
        source: input
        description: Array of Dependent.id values covered by this reservation; every element must belong to employee_id and have status ACTIVE; membership is validated at intake and frozen thereafter
        constraints: length >= 1 and <= BenefitPlan.max_dependents_per_reservation, no duplicates
      - name: dependent_count
        type: integer
        source: computed
        description: Length of dependent_ids
      - name: dependent_type_mix
        type: enum
        source: computed
        description: CHILD_ONLY when every referenced dependent_type is CHILD; ADULT_ELDER_ONLY when every one is ADULT_ELDER; MIXED otherwise
        constraints: one of {CHILD_ONLY, ADULT_ELDER_ONLY, MIXED}
      - name: required_seats
        type: integer
        source: computed
        description: dependent_count when the matched provider care_mode is CENTER_BASED (or before matching when requested_care_mode is CENTER_BASED); 1 when it is IN_HOME
      - name: fulfillment_status
        type: enum
        source: system
        description: First independent state dimension — sourcing and delivery of care
        default: INTAKE
        constraints: one of {INTAKE, MATCHING, OFFERED, CONFIRMED, IN_SERVICE, COMPLETED, CANCELLED, NO_SHOW, UNFULFILLED}
      - name: billing_status
        type: enum
        source: system
        description: Second independent state dimension — money movement, evolving independently of fulfillment_status
        default: NOT_BILLABLE
        constraints: one of {NOT_BILLABLE, ACCRUED, INVOICED, PAID}
      - name: matched_provider_id
        type: string
        source: computed
        description: FK -> Provider.id; provider of the SELECTED MatchOffer, cleared whenever the reservation returns to MATCHING
        default: null
      - name: matched_capacity_block_id
        type: string
        source: computed
        description: FK -> CapacityBlock.id; block occupied at confirmation, cleared whenever the reservation leaves CONFIRMED for MATCHING
        default: null
      - name: excluded_provider_ids
        type: array
        source: computed
        description: Provider.id values whose MatchOffer for this reservation has offer_status REJECTED; excluded from every later candidate set
        default: []
      - name: billable_hours_provisional
        type: number
        source: computed
        description: Billable hours derived from the requested window; 0 for center-based care
        default: 0
      - name: billable_hours_final
        type: number
        source: computed
        description: Billable hours derived from actual_start_utc/actual_end_utc; null until COMPLETED
        default: null
      - name: days_charged_provisional
        type: number
        source: computed
        description: PROVISIONAL variant output of reservation_day_charge, written at confirmation
        default: 0
      - name: days_charged_final
        type: number
        source: computed
        description: FINAL variant output of reservation_day_charge, written at completion; null until COMPLETED
        default: null
      - name: covered_days
        type: number
        source: computed
        description: Portion of the currently authoritative days_charged that fits inside the remaining employee entitlement
        default: 0
      - name: overage_days
        type: number
        source: computed
        description: Portion of the currently authoritative days_charged beyond the remaining employee entitlement
        default: 0
      - name: overage_tier_multiplier
        type: number
        source: computed
        description: Employer overage volume multiplier snapshotted before this reservation's own overage accrual
        default: 1
      - name: copay_cents
        type: integer
        source: computed
        description: Employee copay for the covered portion under the authoritative variant
        default: 0
      - name: overage_cents
        type: integer
        source: computed
        description: Employer-billed overage for the uncovered portion under the authoritative variant
        default: 0
      - name: penalty_cents
        type: integer
        source: computed
        description: Late-cancellation or no-show charge accrued on this reservation
        default: 0
      - name: cancellation_deadline_utc
        type: datetime
        source: computed
        description: care_start_utc minus BenefitPlan.cancellation_window_hours as pinned at plan_version_pinned
      - name: actual_start_utc
        type: datetime
        source: system
        description: Actual care start reported at completion
        default: null
      - name: actual_end_utc
        type: datetime
        source: system
        description: Actual care end reported at completion
        default: null
      - name: confirmation_code
        type: string
        source: system
        description: Care confirmation reference minted at confirmation and cleared when the reservation returns to MATCHING
        default: null
      - name: unfulfilled_reason_code
        type: string
        source: system
        description: Reason the reservation reached UNFULFILLED
        default: null
      - name: cancel_reason_code
        type: string
        source: system
        description: Reason code supplied at cancellation
        default: null

  # -------------------------------------------------------------- MatchOffer --
  - name: MatchOffer
    parent: Reservation
    common_fields: true
    fields:
      - name: reservation_id
        type: string
        source: computed
        description: FK -> Reservation.id; the reservation this offer was generated for
      - name: provider_id
        type: string
        source: computed
        description: FK -> Provider.id; the candidate provider
      - name: rank_score
        type: number
        source: computed
        description: match_rank_score output, rounded to 4 decimal places
      - name: rank_position
        type: integer
        source: computed
        description: 1-based position of this offer within its generation batch after ranking and tie-break
      - name: quality_component
        type: number
        source: computed
        description: Provider.quality_score divided by 100, rounded to 4 decimals
      - name: capacity_component
        type: number
        source: computed
        description: Remaining-capacity term of match_rank_score, rounded to 4 decimals
      - name: mode_component
        type: number
        source: computed
        description: Modality-fit term of match_rank_score
      - name: continuity_component
        type: number
        source: computed
        description: 1 when this provider already has a COMPLETED reservation for the same employee, else 0
      - name: probation_penalty_applied
        type: boolean
        source: computed
        description: True when the provider network_status was PROBATION at generation time and the 0.5 factor was applied
        default: false
      - name: remaining_slots_at_offer
        type: integer
        source: computed
        description: total_slots minus reserved_slots minus committed_slots of the candidate block chosen by the ranker at generation time
      - name: offer_expires_at
        type: datetime
        source: computed
        description: Logical clock at generation plus OFFER_TTL_HOURS (48), never later than the reservation's care_start_utc; an offer at exactly this instant is still acceptable
      - name: offer_status
        type: enum
        source: system
        description: Offer lifecycle state
        default: PROPOSED
        constraints: one of {PROPOSED, SELECTED, REJECTED, EXPIRED}
      - name: reason_code
        type: string
        source: system
        description: Reason code recorded on rejection or expiry
        default: null

  # -------------------------------------------------------- UsageLedgerEntry --
  - name: UsageLedgerEntry
    parent: Employee
    common_fields: false
    fields:
      - name: employee_id
        type: string
        source: computed
        description: FK -> Employee.id; entitlement owner the entry moves
      - name: reservation_id
        type: string
        source: computed
        description: FK -> Reservation.id; reservation that caused the entry
      - name: entry_type
        type: enum
        source: system
        description: Kind of movement this append-only entry records
        constraints: one of {RESERVE, COMMIT, RELEASE, OVERAGE_ACCRUE, OVERAGE_REVERSE, NO_SHOW_CHARGE, LATE_CANCEL_CHARGE}
      - name: days_delta
        type: number
        source: system
        description: Signed entitlement-day movement; negative for RELEASE, 0 for money-only entries
        default: 0
      - name: cents_delta
        type: number
        source: system
        description: Signed money movement in cents; negative for OVERAGE_REVERSE, 0 for day-only entries
        default: 0
      - name: benefit_year_start
        type: string
        source: system
        description: ISO 8601 calendar date of the employer benefit year this entry is bucketed into
      - name: effective_at
        type: datetime
        source: system
        description: Logical clock reading when the entry was appended; ordering key for chronological replay
      - name: memo
        type: string
        source: system
        description: Short machine-readable note naming the transition that appended the entry

  # ---------------------------------------------------------- EmployerInvoice --
  - name: EmployerInvoice
    parent: Employer
    common_fields: true
    fields:
      - name: employer_id
        type: string
        source: input
        description: FK -> Employer.id; invoiced employer
      - name: period_start
        type: string
        source: input
        description: Inclusive ISO 8601 calendar date starting the billed period
      - name: period_end
        type: string
        source: input
        description: Inclusive ISO 8601 calendar date ending the billed period
        constraints: must be >= period_start
      - name: copay_cents
        type: integer
        source: computed
        description: Sum of InvoiceLine.amount_cents for line_type CARE_COPAY
        default: 0
      - name: overage_cents
        type: integer
        source: computed
        description: Sum of InvoiceLine.amount_cents for line_type CARE_OVERAGE
        default: 0
      - name: penalty_cents
        type: integer
        source: computed
        description: Sum of InvoiceLine.amount_cents for line_type IN {NO_SHOW_CHARGE, LATE_CANCEL_CHARGE}
        default: 0
      - name: subtotal_cents
        type: integer
        source: computed
        description: Sum of InvoiceLine.amount_cents over every line of this invoice, each line already rounded
        default: 0
      - name: admin_fee_cents
        type: integer
        source: computed
        description: Administrative fee computed from the integer subtotal_cents and Employer.admin_fee_pct
        default: 0
      - name: total_cents
        type: integer
        source: computed
        description: subtotal_cents plus admin_fee_cents
        default: 0
      - name: line_count
        type: integer
        source: computed
        description: Number of InvoiceLine rows on this invoice
        default: 0
      - name: reservation_count
        type: integer
        source: computed
        description: Number of distinct reservation_id values across this invoice's lines
        default: 0
      - name: invoice_status
        type: enum
        source: system
        description: Invoice lifecycle state
        default: DRAFT
        constraints: one of {DRAFT, ISSUED, PAID, VOID}
      - name: issued_at
        type: datetime
        source: system
        description: Logical clock reading when the invoice was issued
        default: null
      - name: paid_amount_cents
        type: integer
        source: system
        description: Amount recorded by the payment action
        default: 0
      - name: void_reason_code
        type: string
        source: system
        description: Reason code recorded when the invoice is voided
        default: null

  # -------------------------------------------------------------- InvoiceLine --
  - name: InvoiceLine
    parent: EmployerInvoice
    common_fields: false
    fields:
      - name: employer_invoice_id
        type: string
        source: computed
        description: FK -> EmployerInvoice.id; the invoice this line belongs to
      - name: reservation_id
        type: string
        source: computed
        description: FK -> Reservation.id; the reservation the line bills
      - name: employee_id
        type: string
        source: computed
        description: Denormalized copy of the billed Reservation.employee_id, used for per-employee invoice grouping
      - name: line_type
        type: enum
        source: system
        description: What the line bills
        constraints: one of {CARE_COPAY, CARE_OVERAGE, NO_SHOW_CHARGE, LATE_CANCEL_CHARGE}
      - name: quantity
        type: number
        source: system
        description: Billed quantity — covered days, covered hours, overage days, overage hours, or 1 for a flat penalty
      - name: unit_cents
        type: integer
        source: system
        description: Unit rate as pinned by the reservation's plan_version_pinned, already multiplied by overage_tier_multiplier for CARE_OVERAGE lines
      - name: amount_cents
        type: integer
        source: system
        description: round_half_up(quantity * unit_cents) evaluated independently for this line

  # ------------------------------------------------------------ IncidentReport --
  - name: IncidentReport
    parent: Provider
    common_fields: true
    fields:
      - name: provider_id
        type: string
        source: input
        description: FK -> Provider.id; provider the incident is filed against
      - name: reservation_id
        type: string
        source: input
        description: FK -> Reservation.id; reservation during which the incident occurred; null for a network-level report
        default: null
      - name: severity
        type: enum
        source: input
        description: Severity band driving the quality-score deduction weight
        constraints: one of {MINOR, MODERATE, SEVERE}
      - name: category
        type: enum
        source: input
        description: Incident category for quality-assurance reporting
        constraints: one of {SUPERVISION, FACILITY, MEDICAL, CONDUCT, DOCUMENTATION}
      - name: narrative
        type: string
        source: input
        description: Free-text description of what happened
        constraints: non-empty, max 2000 chars
      - name: reported_by_user_id
        type: string
        source: system
        description: X-User-ID of the caller who filed the report; the same user may not later resolve it
      - name: reported_at
        type: datetime
        source: system
        description: Logical clock reading when the report was filed; the decay-age origin for provider_quality_score
      - name: incident_status
        type: enum
        source: system
        description: Quality-assurance review state
        default: OPEN
        constraints: one of {OPEN, UNDER_REVIEW, SUBSTANTIATED, DISMISSED}
      - name: qa_action
        type: enum
        source: system
        description: Network action applied when the report is substantiated
        default: NONE
        constraints: one of {NONE, PROBATION, SUSPENSION, DEPROVISION}
      - name: reviewed_by
        type: string
        source: system
        description: X-User-ID of the coordinator who moved the report to UNDER_REVIEW
        default: null
      - name: resolution_reason_code
        type: string
        source: system
        description: Reason code recorded at substantiation or dismissal
        default: null

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:

  # ------------------------------------------- Reservation, dimension 1 of 2 --
  - entity: Reservation
    dimension: fulfillment_status
    initial_state: INTAKE
    terminal_states: [COMPLETED, CANCELLED, NO_SHOW]
    note: |
      Dimension 1 of a parallel pair on the same row. It evolves independently of
      billing_status: a reservation may be COMPLETED while billing_status is still
      ACCRUED, and billing_status may reach PAID with no further fulfillment move.
      UNFULFILLED is NOT terminal — POST /backup-care/reservations/{id}/match may
      re-enter OFFERED from it.
    transitions:
      - from: INTAKE
        to: OFFERED
        trigger: "POST /backup-care/reservations/{id}/match"
        actor: CareCoordinator
        preconditions:
          - "Employee.eligibility_status == ELIGIBLE"
          - "BenefitPlan(Reservation.benefit_plan_id).status == ACTIVE"
          - "Reservation.care_start_utc > logical clock current_utc"
          - "match_rank_score candidate set is non-empty"
        side_effects:
          - "Creates one MatchOffer per candidate provider with rank_score, rank_position, and the four component fields written by match_rank_score"
          - "The rank_position == 1 offer gets offer_status SELECTED; every other new offer gets offer_status PROPOSED"
          - "Sets Reservation.matched_provider_id = the SELECTED offer's provider_id"
          - "Recomputes Reservation.required_seats from the SELECTED provider's care_mode (dependent_count for CENTER_BASED, 1 for IN_HOME)"
      - from: INTAKE
        to: UNFULFILLED
        trigger: "POST /backup-care/reservations/{id}/match"
        actor: CareCoordinator
        preconditions:
          - "Employee.eligibility_status == ELIGIBLE"
          - "BenefitPlan(Reservation.benefit_plan_id).status == ACTIVE"
          - "Reservation.care_start_utc > logical clock current_utc"
          - "match_rank_score candidate set is empty"
        side_effects:
          - "Sets Reservation.unfulfilled_reason_code = 'NO_ELIGIBLE_PROVIDER'"
          - "Creates zero MatchOffer rows"
          - "Leaves Reservation.matched_provider_id null"
      - from: MATCHING
        to: OFFERED
        trigger: "POST /backup-care/reservations/{id}/match"
        actor: CareCoordinator
        preconditions:
          - "Employee.eligibility_status == ELIGIBLE"
          - "BenefitPlan(Reservation.benefit_plan_id).status == ACTIVE"
          - "Reservation.care_start_utc > logical clock current_utc"
          - "match_rank_score candidate set, after removing every provider id in Reservation.excluded_provider_ids, is non-empty"
        side_effects:
          - "Every MatchOffer of this reservation with offer_status PROPOSED becomes EXPIRED with reason_code 'REMATCHED'"
          - "Creates a new offer batch; rank_position == 1 becomes SELECTED, the rest PROPOSED"
          - "Sets Reservation.matched_provider_id and recomputes Reservation.required_seats"
        note: "Closes the OFFERED -> MATCHING -> OFFERED cycle."
      - from: MATCHING
        to: UNFULFILLED
        trigger: "POST /backup-care/reservations/{id}/match"
        actor: CareCoordinator
        preconditions:
          - "match_rank_score candidate set, after removing every provider id in Reservation.excluded_provider_ids, is empty"
        side_effects:
          - "Sets Reservation.unfulfilled_reason_code = 'NO_ELIGIBLE_PROVIDER'"
          - "Every MatchOffer of this reservation with offer_status PROPOSED becomes EXPIRED with reason_code 'REMATCHED'"
      - from: UNFULFILLED
        to: OFFERED
        trigger: "POST /backup-care/reservations/{id}/match"
        actor: CareCoordinator
        preconditions:
          - "Reservation.care_start_utc > logical clock current_utc"
          - "match_rank_score candidate set, after removing every provider id in Reservation.excluded_provider_ids, is non-empty"
        side_effects:
          - "Clears Reservation.unfulfilled_reason_code to null"
          - "Creates a new offer batch; rank_position == 1 becomes SELECTED, the rest PROPOSED"
      - from: OFFERED
        to: MATCHING
        trigger: "POST /backup-care/reservations/{id}/reject-offer"
        actor: CareCoordinator
        preconditions:
          - "The MatchOffer named by match_offer_id has reservation_id == this reservation and offer_status == SELECTED"
        side_effects:
          - "The named MatchOffer becomes REJECTED with the supplied reason_code"
          - "Appends that offer's provider_id to Reservation.excluded_provider_ids"
          - "Every other MatchOffer of this reservation with offer_status PROPOSED becomes EXPIRED with reason_code 'OFFER_BATCH_CLOSED'"
          - "Clears Reservation.matched_provider_id to null"
          - "Leaves Reservation.billing_status untouched at NOT_BILLABLE"
      - from: OFFERED
        to: CONFIRMED
        trigger: "POST /backup-care/reservations/{id}/confirm"
        actor: CareCoordinator
        preconditions:
          - "payload capacity_block_id names a CapacityBlock whose provider_id == Reservation.matched_provider_id"
          - "payload expected_capacity_block_version == CapacityBlock.version"
          - "Provider.network_status IN {CREDENTIALED, PROBATION}"
          - "Every credential_type in REQUIRED_CREDENTIAL_TYPES has a Credential of that provider with status == VALID and expires_on >= Reservation.care_date"
          - "CapacityBlock.block_status == OPEN and CapacityBlock.service_date == Reservation.care_date"
          - "capacity_and_window_admission admits the reservation under the provider's care_mode semantics"
          - "Employer.overage_billing_enabled == true OR entitlement_split yields overage_days == 0"
        side_effects:
          - "Sets Reservation.matched_capacity_block_id and mints Reservation.confirmation_code"
          - "Writes billable_hours_provisional, days_charged_provisional, covered_days, overage_days, overage_tier_multiplier, copay_cents, overage_cents from the PROVISIONAL variant of reservation_day_charge"
          - "Appends UsageLedgerEntry{entry_type: RESERVE, days_delta: +days_charged_provisional, cents_delta: 0, memo: 'CONFIRM'}"
          - "Recomputes Employee.entitlement_days_reserved and Employee.eligibility_status"
          - "Recomputes CapacityBlock.reserved_slots and CapacityBlock.block_status, and increments CapacityBlock.version by 1"
          - "Every MatchOffer of this reservation with offer_status PROPOSED becomes EXPIRED with reason_code 'CONFIRMED_ELSEWHERE'"
      - from: INTAKE
        to: CANCELLED
        trigger: "POST /backup-care/reservations/{id}/cancel"
        actor: Employee | BenefitsAdmin | CareCoordinator
        preconditions: ["none beyond the from-state"]
        side_effects:
          - "Sets Reservation.cancel_reason_code; penalty_cents stays 0; billing_status stays NOT_BILLABLE"
      - from: MATCHING
        to: CANCELLED
        trigger: "POST /backup-care/reservations/{id}/cancel"
        actor: Employee | BenefitsAdmin | CareCoordinator
        preconditions: ["none beyond the from-state"]
        side_effects:
          - "Sets Reservation.cancel_reason_code; penalty_cents stays 0; billing_status stays NOT_BILLABLE"
      - from: UNFULFILLED
        to: CANCELLED
        trigger: "POST /backup-care/reservations/{id}/cancel"
        actor: Employee | BenefitsAdmin | CareCoordinator
        preconditions: ["none beyond the from-state"]
        side_effects:
          - "Sets Reservation.cancel_reason_code; penalty_cents stays 0; billing_status stays NOT_BILLABLE"
      - from: OFFERED
        to: CANCELLED
        trigger: "POST /backup-care/reservations/{id}/cancel"
        actor: Employee | BenefitsAdmin | CareCoordinator
        preconditions: ["none beyond the from-state"]
        side_effects:
          - "Every MatchOffer of this reservation with offer_status IN {PROPOSED, SELECTED} becomes EXPIRED with reason_code 'RESERVATION_CANCELLED'"
          - "Clears Reservation.matched_provider_id; penalty_cents stays 0; billing_status stays NOT_BILLABLE"
        note: "No entitlement was reserved before CONFIRMED, so no ledger entry is appended."
      - from: CONFIRMED
        to: CANCELLED
        trigger: "POST /backup-care/reservations/{id}/cancel"
        actor: Employee | BenefitsAdmin | CareCoordinator
        preconditions: ["none beyond the from-state"]
        side_effects:
          - "Appends UsageLedgerEntry{entry_type: RELEASE, days_delta: -days_charged_provisional, cents_delta: 0, memo: 'CANCEL'}"
          - "Recomputes Employee.entitlement_days_reserved"
          - "Recomputes CapacityBlock.reserved_slots and CapacityBlock.block_status on matched_capacity_block_id, and increments that CapacityBlock.version by 1"
          - "Runs cancellation_penalty; when is_late is true, sets penalty_cents, appends UsageLedgerEntry{entry_type: LATE_CANCEL_CHARGE, days_delta: 0, cents_delta: +penalty_cents, memo: 'LATE_CANCEL'} and moves billing_status NOT_BILLABLE -> ACCRUED"
          - "When is_late is false, penalty_cents stays 0, no money entry is appended, and billing_status stays NOT_BILLABLE"
          - "Keeps matched_provider_id and matched_capacity_block_id for audit"
      - from: CONFIRMED
        to: IN_SERVICE
        trigger: "POST /backup-care/reservations/{id}/check-in"
        actor: ProviderManager | CareCoordinator
        preconditions:
          - "logical clock current_utc >= Reservation.care_start_utc minus CHECK_IN_LEAD_MINUTES"
          - "logical clock current_utc < Reservation.care_end_utc"
          - "Provider(matched_provider_id).network_status IN {CREDENTIALED, PROBATION}"
        side_effects:
          - "No ledger entry; CapacityBlock.reserved_slots still counts this reservation"
      - from: IN_SERVICE
        to: COMPLETED
        trigger: "POST /backup-care/reservations/{id}/complete"
        actor: ProviderManager | CareCoordinator
        preconditions:
          - "payload actual_end_utc is strictly after payload actual_start_utc"
          - "payload actual_start_utc and actual_end_utc fall on Reservation.care_date"
          - "logical clock current_utc >= payload actual_end_utc"
        side_effects:
          - "Records actual_start_utc and actual_end_utc"
          - "Writes billable_hours_final and days_charged_final from the FINAL variant of reservation_day_charge, then re-runs entitlement_split and reservation_charge_money, overwriting covered_days, overage_days, overage_tier_multiplier, copay_cents and overage_cents"
          - "Appends UsageLedgerEntry{entry_type: RELEASE, days_delta: -days_charged_provisional, cents_delta: 0, memo: 'COMPLETE_RELEASE'} then UsageLedgerEntry{entry_type: COMMIT, days_delta: +days_charged_final, cents_delta: 0, memo: 'COMPLETE_COMMIT'} in that pinned order"
          - "When overage_days > 0, appends UsageLedgerEntry{entry_type: OVERAGE_ACCRUE, days_delta: 0, cents_delta: +overage_cents, memo: 'COMPLETE_OVERAGE'}"
          - "Recomputes Employee.entitlement_days_used, Employee.entitlement_days_reserved and Employer.accrued_overage_cents_current_period"
          - "Recomputes CapacityBlock.reserved_slots and committed_slots on matched_capacity_block_id, recomputes block_status, and increments that CapacityBlock.version by 1"
          - "Recomputes Provider.completed_reservation_count, Provider.quality_score and Provider.lifetime_quality_score"
          - "Moves billing_status NOT_BILLABLE -> ACCRUED"
      - from: CONFIRMED
        to: NO_SHOW
        trigger: "POST /backup-care/reservations/{id}/no-show"
        actor: ProviderManager | CareCoordinator
        preconditions:
          - "logical clock current_utc >= Reservation.care_start_utc"
        side_effects:
          - "Sets penalty_cents = BenefitPlan.no_show_charge_cents as pinned at plan_version_pinned"
          - "Appends UsageLedgerEntry{entry_type: RELEASE, days_delta: -days_charged_provisional, cents_delta: 0, memo: 'NO_SHOW_RELEASE'} then UsageLedgerEntry{entry_type: COMMIT, days_delta: +days_charged_provisional, cents_delta: 0, memo: 'NO_SHOW_COMMIT'} then UsageLedgerEntry{entry_type: NO_SHOW_CHARGE, days_delta: 0, cents_delta: +penalty_cents, memo: 'NO_SHOW'} in that pinned order"
          - "Recomputes Employee.entitlement_days_used and entitlement_days_reserved"
          - "Recomputes Employee.no_show_strike_count from the count of NO_SHOW_CHARGE entries in the current benefit year"
          - "Recomputes Employee.eligibility_status, which becomes RESTRICTED once no_show_strike_count >= NO_SHOW_STRIKE_LIMIT"
          - "Recomputes CapacityBlock.reserved_slots and committed_slots on matched_capacity_block_id and increments that CapacityBlock.version by 1"
          - "Moves billing_status NOT_BILLABLE -> ACCRUED"
        note: "Depth-4 cascade: reservation -> ledger -> strike count -> eligibility gate on future intake."
      - from: CONFIRMED
        to: NO_SHOW
        trigger: "POST /backup-care/_ops/run-daily-maintenance (step 6)"
        actor: system
        preconditions:
          - "Reservation.care_end_utc < logical clock current_utc"
          - "Reservation.fulfillment_status == CONFIRMED"
        side_effects:
          - "Identical side-effect set to the operator-triggered CONFIRMED -> NO_SHOW transition"
      - from: CONFIRMED
        to: MATCHING
        trigger: "cascade from Provider.network_status entering SUSPENDED or DEPROVISIONED"
        actor: system
        preconditions:
          - "Reservation.matched_provider_id == the transitioning provider"
          - "Reservation.care_start_utc > logical clock current_utc"
        side_effects:
          - "Appends UsageLedgerEntry{entry_type: RELEASE, days_delta: -days_charged_provisional, cents_delta: 0, memo: 'PROVIDER_WITHDRAWN'}"
          - "Recomputes Employee.entitlement_days_reserved"
          - "Recomputes CapacityBlock.reserved_slots and block_status on the vacated block and increments that CapacityBlock.version by 1"
          - "Clears matched_provider_id, matched_capacity_block_id and confirmation_code to null"
          - "Resets days_charged_provisional, covered_days, overage_days, copay_cents and overage_cents to 0 and overage_tier_multiplier to 1"
          - "The withdrawn provider id is NOT appended to excluded_provider_ids"
          - "Leaves billing_status untouched at NOT_BILLABLE"
      - from: INTAKE
        to: UNFULFILLED
        trigger: "POST /backup-care/_ops/run-daily-maintenance (step 3)"
        actor: system
        preconditions: ["Reservation.care_start_utc < logical clock current_utc"]
        side_effects: ["Sets unfulfilled_reason_code = 'CARE_WINDOW_ELAPSED'"]
      - from: MATCHING
        to: UNFULFILLED
        trigger: "POST /backup-care/_ops/run-daily-maintenance (step 3)"
        actor: system
        preconditions: ["Reservation.care_start_utc < logical clock current_utc"]
        side_effects: ["Sets unfulfilled_reason_code = 'CARE_WINDOW_ELAPSED'"]
      - from: OFFERED
        to: UNFULFILLED
        trigger: "POST /backup-care/_ops/run-daily-maintenance (step 3)"
        actor: system
        preconditions: ["Reservation.care_start_utc < logical clock current_utc"]
        side_effects:
          - "Sets unfulfilled_reason_code = 'CARE_WINDOW_ELAPSED'"
          - "Every MatchOffer of this reservation with offer_status IN {PROPOSED, SELECTED} becomes EXPIRED with reason_code 'CARE_WINDOW_ELAPSED'"
          - "Clears matched_provider_id to null"

  # ------------------------------------------- Reservation, dimension 2 of 2 --
  - entity: Reservation
    dimension: billing_status
    initial_state: NOT_BILLABLE
    terminal_states: [PAID]
    note: |
      Dimension 2 of the parallel pair. Every transition here is system-driven and
      none of them read or write fulfillment_status, which is why a COMPLETED
      reservation can sit at ACCUED, INVOICED or PAID without any further
      fulfillment move, and a CANCELLED reservation can be ACCRUED (late) or stay
      NOT_BILLABLE (on time).
    transitions:
      - from: NOT_BILLABLE
        to: ACCRUED
        trigger: "cascade from fulfillment_status entering COMPLETED, NO_SHOW, or CANCELLED with penalty_cents > 0"
        actor: system
        preconditions: ["the originating fulfillment transition completed successfully"]
        side_effects: ["Reservation becomes eligible for InvoiceLine generation by employer_invoice_totals"]
      - from: ACCRUED
        to: INVOICED
        trigger: "POST /backup-care/employers/{id}/invoices"
        actor: system
        preconditions:
          - "Reservation.care_date is inside [period_start, period_end] inclusive on both ends"
          - "Reservation.employee_id belongs to an Employee of the invoiced employer"
        side_effects:
          - "One or more InvoiceLine rows referencing this reservation are created on the DRAFT invoice"
      - from: INVOICED
        to: PAID
        trigger: "POST /backup-care/employer-invoices/{id}/payment"
        actor: system
        preconditions: ["EmployerInvoice.invoice_status == ISSUED and paid_amount_cents == EmployerInvoice.total_cents"]
        side_effects: ["Recomputes Employer.ytd_billed_cents"]
      - from: INVOICED
        to: ACCRUED
        trigger: "POST /backup-care/employer-invoices/{id}/void"
        actor: system
        preconditions: ["EmployerInvoice.invoice_status IN {DRAFT, ISSUED}"]
        side_effects:
          - "Every InvoiceLine of the voided invoice is deleted"
          - "Recomputes Employer.ytd_billed_cents"
          - "No UsageLedgerEntry is appended or removed, so the employer money conservation invariant holds"
        note: "Compensating transition for ACCRUED -> INVOICED."

  # ------------------------------------------------------------------ Provider --
  - entity: Provider
    dimension: network_status
    initial_state: PENDING
    terminal_states: [DEPROVISIONED]
    note: "Cyclic: PROBATION -> CREDENTIALED and SUSPENDED -> CREDENTIALED both re-enter a previously occupied state."
    transitions:
      - from: PENDING
        to: CREDENTIALED
        trigger: "POST /backup-care/providers/{id}/credential-review"
        actor: NetworkAdmin
        preconditions:
          - "For every credential_type in REQUIRED_CREDENTIAL_TYPES there is a Credential of this provider with status == VALID and expires_on >= logical clock date"
        side_effects:
          - "Sets last_status_reason_code = 'CREDENTIAL_REVIEW_PASSED'"
          - "Recomputes quality_score and lifetime_quality_score"
      - from: CREDENTIALED
        to: PROBATION
        trigger: "POST /backup-care/incident-reports/{id}/substantiate with qa_action PROBATION | POST /backup-care/providers/{id}/network-status with target_status PROBATION"
        actor: NetworkAdmin
        preconditions: ["Provider.network_status == CREDENTIALED"]
        side_effects:
          - "Sets last_status_reason_code from the supplied reason_code or 'INCIDENT_SUBSTANTIATED'"
          - "Every later match_rank_score evaluation multiplies this provider's score by 0.5 and sets MatchOffer.probation_penalty_applied = true"
          - "No reservation is withdrawn — PROBATION providers stay confirmable"
      - from: PROBATION
        to: CREDENTIALED
        trigger: "POST /backup-care/providers/{id}/network-status with target_status CREDENTIALED"
        actor: NetworkAdmin
        preconditions:
          - "For every credential_type in REQUIRED_CREDENTIAL_TYPES there is a Credential of this provider with status == VALID and expires_on >= logical clock date"
          - "Provider.lifetime_quality_score >= REINSTATE_MIN_LIFETIME_SCORE"
        side_effects:
          - "Sets last_status_reason_code from the supplied reason_code"
          - "Later match_rank_score evaluations stop applying the 0.5 probation factor"
          - "quality_score and lifetime_quality_score are recomputed but NOT reset — substantiated incidents keep deducting"
      - from: CREDENTIALED
        to: SUSPENDED
        trigger: "POST /backup-care/credentials/{id}/revoke | POST /backup-care/_ops/run-daily-maintenance (step 2) | POST /backup-care/providers/{id}/network-status with target_status SUSPENDED | POST /backup-care/incident-reports/{id}/substantiate with qa_action SUSPENSION"
        actor: NetworkAdmin | system
        preconditions: ["Provider.network_status == CREDENTIALED"]
        side_effects:
          - "Sets last_status_reason_code"
          - "For every Reservation with matched_provider_id == this provider, fulfillment_status == CONFIRMED and care_start_utc > current_utc, drives the CONFIRMED -> MATCHING system transition, which itself appends a RELEASE UsageLedgerEntry, recomputes Employee.entitlement_days_reserved, and recomputes plus version-bumps the vacated CapacityBlock"
          - "Provider is removed from every later match_rank_score candidate set"
      - from: PROBATION
        to: SUSPENDED
        trigger: "POST /backup-care/credentials/{id}/revoke | POST /backup-care/_ops/run-daily-maintenance (step 2) | POST /backup-care/providers/{id}/network-status with target_status SUSPENDED | POST /backup-care/incident-reports/{id}/substantiate with qa_action SUSPENSION"
        actor: NetworkAdmin | system
        preconditions: ["Provider.network_status == PROBATION"]
        side_effects: ["Identical side-effect set to CREDENTIALED -> SUSPENDED"]
      - from: SUSPENDED
        to: CREDENTIALED
        trigger: "POST /backup-care/providers/{id}/network-status with target_status CREDENTIALED"
        actor: NetworkAdmin
        preconditions:
          - "For every credential_type in REQUIRED_CREDENTIAL_TYPES there is a Credential of this provider with status == VALID and expires_on >= logical clock date"
          - "Provider.lifetime_quality_score >= REINSTATE_MIN_LIFETIME_SCORE"
        side_effects:
          - "Sets last_status_reason_code"
          - "Provider re-enters later candidate sets; reservations withdrawn during suspension are NOT re-attached"
      - from: CREDENTIALED
        to: DEPROVISIONED
        trigger: "POST /backup-care/providers/{id}/network-status with target_status DEPROVISIONED | POST /backup-care/incident-reports/{id}/substantiate with qa_action DEPROVISION"
        actor: NetworkAdmin
        preconditions: ["Provider.network_status IN {CREDENTIALED}"]
        side_effects: ["Identical withdrawal cascade to CREDENTIALED -> SUSPENDED, and the provider can never return to any other state"]
      - from: PROBATION
        to: DEPROVISIONED
        trigger: "POST /backup-care/providers/{id}/network-status with target_status DEPROVISIONED | POST /backup-care/incident-reports/{id}/substantiate with qa_action DEPROVISION"
        actor: NetworkAdmin
        preconditions: ["Provider.network_status IN {PROBATION}"]
        side_effects: ["Identical withdrawal cascade to CREDENTIALED -> SUSPENDED"]
      - from: SUSPENDED
        to: DEPROVISIONED
        trigger: "POST /backup-care/providers/{id}/network-status with target_status DEPROVISIONED"
        actor: NetworkAdmin
        preconditions: ["Provider.network_status IN {SUSPENDED}"]
        side_effects: ["Sets last_status_reason_code; no reservation remains CONFIRMED on a SUSPENDED provider so no withdrawal fires"]

  # ---------------------------------------------------------------- Credential --
  - entity: Credential
    dimension: status
    initial_state: VALID
    terminal_states: [EXPIRED, REVOKED]
    transitions:
      - from: VALID
        to: REVOKED
        trigger: "POST /backup-care/credentials/{id}/revoke"
        actor: NetworkAdmin
        preconditions: ["Credential.status == VALID"]
        side_effects:
          - "Sets revoked_reason_code from the payload"
          - "When credential_type is in REQUIRED_CREDENTIAL_TYPES and Provider.network_status IN {CREDENTIALED, PROBATION}, drives the Provider -> SUSPENDED transition, whose own cascade withdraws that provider's future CONFIRMED reservations"
      - from: VALID
        to: EXPIRED
        trigger: "POST /backup-care/_ops/run-daily-maintenance (step 1)"
        actor: system
        preconditions: ["Credential.expires_on < logical clock date"]
        side_effects:
          - "When credential_type is in REQUIRED_CREDENTIAL_TYPES and Provider.network_status IN {CREDENTIALED, PROBATION}, step 2 of the same maintenance run drives the Provider -> SUSPENDED transition and its withdrawal cascade"

  # --------------------------------------------------------------- BenefitPlan --
  - entity: BenefitPlan
    dimension: status
    initial_state: DRAFT
    terminal_states: [SUPERSEDED]
    transitions:
      - from: DRAFT
        to: ACTIVE
        trigger: "POST /backup-care/benefit-plans/{id}/activate"
        actor: BenefitsAdmin
        preconditions:
          - "Employer.contract_status == ACTIVE"
          - "BenefitPlan.effective_from <= logical clock current_utc"
          - "BenefitPlan.effective_to is null OR logical clock current_utc < BenefitPlan.effective_to"
        side_effects:
          - "The employer's other plan with status == ACTIVE, if any, moves ACTIVE -> SUPERSEDED and gets superseded_by_plan_id = this plan id"
          - "Employees already enrolled keep their benefit_plan_id — supersede does not re-enroll anyone"
      - from: ACTIVE
        to: SUPERSEDED
        trigger: "cascade from another BenefitPlan of the same employer entering ACTIVE"
        actor: system
        preconditions: ["BenefitPlan.status == ACTIVE and employer_id matches the newly activated plan"]
        side_effects:
          - "Sets superseded_by_plan_id to the newly activated plan id"
          - "New reservations for employees still enrolled on this plan are rejected because the plan status is no longer ACTIVE"

  # ------------------------------------------------------------ EmployerInvoice --
  - entity: EmployerInvoice
    dimension: invoice_status
    initial_state: DRAFT
    terminal_states: [PAID, VOID]
    transitions:
      - from: DRAFT
        to: ISSUED
        trigger: "POST /backup-care/employer-invoices/{id}/issue"
        actor: NetworkAdmin
        preconditions:
          - "EmployerInvoice.line_count >= 1"
          - "No Reservation billed on this invoice has fulfillment_status == IN_SERVICE"
        side_effects:
          - "Stamps issued_at with the logical clock"
          - "Recomputes Employer.ytd_billed_cents"
      - from: ISSUED
        to: PAID
        trigger: "POST /backup-care/employer-invoices/{id}/payment"
        actor: NetworkAdmin | BenefitsAdmin
        preconditions: ["payload paid_amount_cents == EmployerInvoice.total_cents"]
        side_effects:
          - "Records paid_amount_cents"
          - "Every Reservation billed on this invoice moves billing_status INVOICED -> PAID"
      - from: DRAFT
        to: VOID
        trigger: "POST /backup-care/employer-invoices/{id}/void"
        actor: NetworkAdmin
        preconditions: ["EmployerInvoice.invoice_status == DRAFT"]
        side_effects:
          - "Sets void_reason_code"
          - "Deletes every InvoiceLine of this invoice and zeroes subtotal_cents, admin_fee_cents, total_cents, line_count and reservation_count"
          - "Every Reservation billed on this invoice moves billing_status INVOICED -> ACCRUED"
      - from: ISSUED
        to: VOID
        trigger: "POST /backup-care/employer-invoices/{id}/void"
        actor: NetworkAdmin
        preconditions: ["EmployerInvoice.invoice_status == ISSUED"]
        side_effects:
          - "Identical side-effect set to DRAFT -> VOID, plus recomputing Employer.ytd_billed_cents"

  # ------------------------------------------------------------ IncidentReport --
  - entity: IncidentReport
    dimension: incident_status
    initial_state: OPEN
    terminal_states: [SUBSTANTIATED, DISMISSED]
    note: "Branching fork: UNDER_REVIEW -> {SUBSTANTIATED, DISMISSED} with disjoint side-effect sets."
    transitions:
      - from: OPEN
        to: UNDER_REVIEW
        trigger: "POST /backup-care/incident-reports/{id}/review"
        actor: CareCoordinator
        preconditions: ["Provider.network_status != DEPROVISIONED"]
        side_effects: ["Records reviewed_by from X-User-ID; no score movement"]
      - from: UNDER_REVIEW
        to: SUBSTANTIATED
        trigger: "POST /backup-care/incident-reports/{id}/substantiate"
        actor: NetworkAdmin
        preconditions: ["payload qa_action IN {NONE, PROBATION, SUSPENSION, DEPROVISION}"]
        side_effects:
          - "Sets qa_action and resolution_reason_code"
          - "Recomputes Provider.substantiated_incident_count, Provider.quality_score (ROLLING_90D) and Provider.lifetime_quality_score (LIFETIME_UNDECAYED)"
          - "When qa_action == PROBATION drives Provider CREDENTIALED -> PROBATION"
          - "When qa_action == SUSPENSION drives Provider {CREDENTIALED, PROBATION} -> SUSPENDED and its full withdrawal cascade"
          - "When qa_action == DEPROVISION drives Provider {CREDENTIALED, PROBATION} -> DEPROVISIONED and its full withdrawal cascade"
          - "When qa_action == NONE the provider network_status is untouched and only the scores move"
      - from: UNDER_REVIEW
        to: DISMISSED
        trigger: "POST /backup-care/incident-reports/{id}/dismiss"
        actor: NetworkAdmin
        preconditions: ["payload reason_code is non-empty"]
        side_effects:
          - "Sets resolution_reason_code; qa_action stays NONE"
          - "Provider.substantiated_incident_count, quality_score and lifetime_quality_score are unchanged — a dismissed report never deducts"
          - "Provider.network_status is unchanged"

# =============================================================================
# §1.2.1 Concurrency Rules (OCC on the parent's `version` only)
# =============================================================================
concurrency_rules:
  - rule_id: plan-create-stale-employer
    parent_entity: Employer
    write_endpoint: "POST /backup-care/benefit-plans"
    occ_field: "expected_employer_version"
    description: |
      Creating a BenefitPlan against an Employer whose version has advanced since
      the client last read it is rejected with a stale-version error. A new plan
      legitimately supersedes the employer's current ACTIVE plan on activation, so
      a writer holding an outdated view of the employer's plan portfolio would
      otherwise silently retire a design it never saw.
    error_id: ERR_STALE_EMPLOYER_VERSION
    http_status: 412
  - rule_id: confirm-stale-capacity-block
    parent_entity: CapacityBlock
    write_endpoint: "POST /backup-care/reservations/{id}/confirm"
    occ_field: "expected_capacity_block_version"
    description: |
      Confirming care into a CapacityBlock whose version has advanced since the
      client last read its remaining capacity is rejected with a stale-version
      error. Another confirmation, cancellation or completion legitimately
      consumed or released seats on that block, so the writer's remaining-slot
      view is stale even though a fresh read might still admit the reservation.
    error_id: ERR_STALE_CAPACITY_BLOCK_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:

  - name: reservation_billable_hours
    trigger: "Inside the OFFERED -> CONFIRMED transition (PROVISIONAL) and inside the IN_SERVICE -> COMPLETED transition (FINAL); writes Reservation.billable_hours_provisional / billable_hours_final"
    algorithm: threshold
    formula: |
      # window is [w_start, w_end) — PROVISIONAL uses (care_start_utc, care_end_utc),
      # FINAL uses (actual_start_utc, actual_end_utc).
      if effective_care_mode == CENTER_BASED:
          billable_hours = 0            # center-based care is billed in whole days
      else:
          raw_hours = (w_end - w_start) total seconds / 3600      # exact decimal
          stepped   = ceil(raw_hours / HOUR_ROUNDING_INCREMENT) * HOUR_ROUNDING_INCREMENT
          billable_hours = max(plan.in_home_min_billable_hours, stepped)
      # effective_care_mode = Provider(Reservation.matched_provider_id).care_mode
    input_set: "Exactly one reservation and the BenefitPlan snapshot identified by Reservation.benefit_plan_id at Reservation.plan_version_pinned"
    constants:
      HOUR_ROUNDING_INCREMENT: 0.25
    precision: "hours carried to 2 decimal places, round_half_up; the ceil step is exact, not rounded"

  - name: reservation_day_charge
    trigger: "Inside the OFFERED -> CONFIRMED transition (PROVISIONAL variant) and inside the IN_SERVICE -> COMPLETED transition (FINAL variant); writes Reservation.days_charged_provisional / days_charged_final"
    algorithm: threshold
    formula: |
      if effective_care_mode == CENTER_BASED:
          days_charged = dependent_count * 1          # one entitlement day per dependent per care date
      else:
          days_charged = ceil(billable_hours / IN_HOME_HOURS_PER_DAY)   # one caregiver visit covers all dependents
    input_set: "Reservation.dependent_count, the billable_hours produced by reservation_billable_hours under the same variant, and Provider(matched_provider_id).care_mode"
    constants:
      IN_HOME_HOURS_PER_DAY: 8
    precision: "days are non-negative integers; ceil is exact"
    variants:
      - name: PROVISIONAL
        when: "Evaluated once during OFFERED -> CONFIRMED, from the requested window (care_start_utc, care_end_utc)"
        difference: "Reserves entitlement optimistically from the REQUESTED window; written to days_charged_provisional and RESERVEd on the ledger"
      - name: FINAL
        when: "Evaluated once during IN_SERVICE -> COMPLETED, from the reported window (actual_start_utc, actual_end_utc)"
        difference: "Recomputes from ACTUAL hours; written to days_charged_final and COMMITted on the ledger. A 6.0h requested / 9.5h actual in-home visit yields 1 provisional day and 2 final days from identical plan inputs."

  - name: entitlement_split
    trigger: "Immediately after reservation_day_charge inside OFFERED -> CONFIRMED and inside IN_SERVICE -> COMPLETED; writes Reservation.covered_days, overage_days and overage_tier_multiplier"
    algorithm: waterfall_allocation
    formula: |
      # PINNED EVALUATION ORDER — steps run exactly 1..6 and no step may read a
      # value written by a later step. In particular step 6 reads the employer
      # overage accrual BEFORE this reservation's own OVERAGE_ACCRUE entry exists,
      # so a reservation never influences its own tier multiplier even though the
      # multiplier feeds the accrual the tier is later computed from.
      BY = benefit_year_start(employee)                       # see employee_entitlement_projection
      # step 1
      days_used_before = sum(e.days_delta) for e in UsageLedgerEntry
                         where e.employee_id == R.employee_id
                           and e.benefit_year_start == BY
                           and e.entry_type == COMMIT
                           and e.reservation_id != R.id
                         ordered by e.effective_at ASC, then e.created_at ASC
      # step 2
      days_reserved_before = sum(e.days_delta) for e in UsageLedgerEntry
                         where e.employee_id == R.employee_id
                           and e.benefit_year_start == BY
                           and e.entry_type IN {RESERVE, RELEASE}
                           and e.reservation_id != R.id
                         ordered by e.effective_at ASC, then e.created_at ASC
      # step 3
      remaining = max(0, plan.annual_use_limit_days - days_used_before - days_reserved_before)
      # step 4
      covered_days = min(days_charged, remaining)
      # step 5
      overage_days = days_charged - covered_days
      # step 6  (tier snapshot)
      accrued_before = Employer.accrued_overage_cents_current_period    # excludes R
      if   accrued_before <  OVERAGE_TIER_1_CENTS: overage_tier_multiplier = 1.00
      elif accrued_before <  OVERAGE_TIER_2_CENTS: overage_tier_multiplier = 0.90
      else:                                        overage_tier_multiplier = 0.80
    input_set: "UsageLedgerEntry rows of this employee inside the current benefit year with entry_type IN {COMMIT, RESERVE, RELEASE} and reservation_id != this reservation; plus Employer.accrued_overage_cents_current_period as of before this transition"
    constants:
      OVERAGE_TIER_1_CENTS: 100000
      OVERAGE_TIER_2_CENTS: 500000
    precision: "days carried to 2 decimal places, round_half_up; multiplier is exact to 2 decimals"
    variants:
      - name: AT_CONFIRM
        when: "days_charged is days_charged_provisional"
        difference: "The reservation's own RESERVE entry does not exist yet, so step 2 needs no exclusion in practice"
      - name: AT_COMPLETE
        when: "days_charged is days_charged_final"
        difference: "The reservation's own RESERVE entry already exists, and the reservation_id != R.id filter is what removes it — otherwise the reservation would be charged against its own provisional hold"

  - name: reservation_charge_money
    trigger: "Immediately after entitlement_split inside OFFERED -> CONFIRMED and inside IN_SERVICE -> COMPLETED; writes Reservation.copay_cents and Reservation.overage_cents"
    algorithm: tiered_pricing
    formula: |
      if effective_care_mode == CENTER_BASED:
          copay_cents   = round_half_up(covered_days * plan.copay_center_cents_per_day)
          overage_unit  = round_half_up(plan.overage_rate_center_cents_per_day * overage_tier_multiplier)
          overage_cents = round_half_up(overage_days * overage_unit)
          covered_qty   = covered_days
          overage_qty   = overage_days
      else:
          if days_charged == 0:
              covered_hours = 0 ; overage_hours = 0
          else:
              covered_hours = round_half_up(billable_hours * covered_days / days_charged, 2)
              overage_hours = round_half_up(billable_hours - covered_hours, 2)
          copay_cents   = round_half_up(covered_hours * plan.copay_in_home_cents_per_hour)
          overage_unit  = round_half_up(plan.overage_rate_in_home_cents_per_hour * overage_tier_multiplier)
          overage_cents = round_half_up(overage_hours * overage_unit)
          covered_qty   = covered_hours
          overage_qty   = overage_hours
      # covered_qty / overage_qty / overage_unit are what employer_invoice_totals
      # later writes into InvoiceLine.quantity and InvoiceLine.unit_cents.
    input_set: "The covered_days / overage_days / overage_tier_multiplier written by entitlement_split in the same transition, plus the plan rates pinned at Reservation.plan_version_pinned"
    constants: {}
    precision: "cents are integers, round_half_up; hour quantities carried to 2 decimal places, round_half_up"

  - name: match_rank_score
    trigger: "Inside every POST /backup-care/reservations/{id}/match; writes MatchOffer.rank_score, rank_position and the four component fields"
    algorithm: weighted_scoring
    formula: |
      # ---- (a) ELIGIBILITY FILTER (candidate set) ----
      # Provider P is a candidate iff ALL of:
      #   P.market_code == R.market_code
      #   P.network_status IN {CREDENTIALED, PROBATION}
      #   (R.requested_care_mode == EITHER) OR (P.care_mode == R.requested_care_mode)
      #   P.id NOT IN R.excluded_provider_ids
      #   for every t in REQUIRED_CREDENTIAL_TYPES there is a Credential of P with
      #       status == VALID and expires_on >= R.care_date
      #   (R.care_date != logical clock date) OR (P.same_day_available == true)
      #   candidate_block(P) is not null
      #
      # candidate_block(P): among CapacityBlock rows of P with
      #   block_status == OPEN and service_date == R.care_date and
      #   start_time_utc <= R.care_start_utc and R.care_end_utc <= end_time_utc and
      #   capacity_and_window_admission(P, block, R) == ADMIT,
      # pick the block with the LARGEST (total_slots - reserved_slots - committed_slots);
      # tie-break earliest start_time_utc ASC, then earliest created_at ASC.
      # candidate_block(P) is null when that set is empty.
      #
      # ---- (b) RANKING EXPRESSION ----
      seats            = R.required_seats recomputed for P.care_mode
      remaining        = candidate_block(P).total_slots
                         - candidate_block(P).reserved_slots
                         - candidate_block(P).committed_slots
      quality_component  = round_half_up(P.quality_score / 100, 4)
      capacity_component = round_half_up(min(1.0, remaining / max(1, seats * 2)), 4)
      if R.requested_care_mode == EITHER:
          mode_component = 1.0 if P.care_mode == CENTER_BASED else 0.6
      else:
          mode_component = 1.0
      continuity_component = 1.0 if EXISTS Reservation X with X.employee_id == R.employee_id
                                    and X.matched_provider_id == P.id
                                    and X.fulfillment_status == COMPLETED
                             else 0.0
      base = W_QUALITY    * quality_component
           + W_CAPACITY   * capacity_component
           + W_MODE       * mode_component
           + W_CONTINUITY * continuity_component
      rank_score = round_half_up(base * (PROBATION_FACTOR if P.network_status == PROBATION else 1.0), 4)
      #
      # ---- (c) TIE-BREAK when rank_score ties ----
      #   1. higher P.quality_score wins
      #   2. then earlier P.created_at (ASC) wins
      #   Provider.id is never consulted.
      #
      # ---- (d) EMPTY-POOL FALLBACK ----
      #   Zero candidates -> no MatchOffer rows are created, the reservation moves
      #   to UNFULFILLED with unfulfilled_reason_code 'NO_ELIGIBLE_PROVIDER', and
      #   the request still returns 200.
      #
      # rank_position is 1-based over the candidate list sorted by
      # (rank_score DESC, quality_score DESC, created_at ASC).
    input_set: "Every Provider row (any market), narrowed by the eligibility filter above; every CapacityBlock of each surviving provider on R.care_date with block_status == OPEN; every Credential of each surviving provider; and the COMPLETED reservation history of R.employee_id"
    constants:
      W_QUALITY: 0.45
      W_CAPACITY: 0.30
      W_MODE: 0.15
      W_CONTINUITY: 0.10
      PROBATION_FACTOR: 0.5
      REQUIRED_CREDENTIAL_TYPES: [LICENSE, BACKGROUND_CHECK, CPR, INSURANCE]
    precision: "components and rank_score to 4 decimal places, round_half_up"

  - name: capacity_and_window_admission
    trigger: "Inside match_rank_score's candidate_block selection and again as a precondition of OFFERED -> CONFIRMED"
    algorithm: interval_merge
    formula: |
      contained = block.start_time_utc <= R.care_start_utc
                  and R.care_end_utc  <= block.end_time_utc
      if not contained: return REJECT_WINDOW          # ERR_WINDOW_OUTSIDE_BLOCK
      #
      # ---- semantics A: CENTER_BASED — aggregate seat capacity, half-open ----
      if provider.care_mode == CENTER_BASED:
          seats     = R.dependent_count
          remaining = block.total_slots - block.reserved_slots - block.committed_slots
          # Two reservations whose windows merely touch (one ends exactly when the
          # other starts) coexist freely: only the seat SUM is constrained, and the
          # interval is treated as half-open [start, end).
          return ADMIT if remaining >= seats else REJECT_CAPACITY   # ERR_CAPACITY_EXHAUSTED
      #
      # ---- semantics B: IN_HOME — exclusive occupation, buffer-expanded ----
      else:
          seats = 1
          B = TRAVEL_BUFFER_MINUTES minutes
          conflicts = [ X for X in Reservation
                        where X.matched_provider_id == provider.id
                          and X.fulfillment_status IN {CONFIRMED, IN_SERVICE}
                          and X.id != R.id
                          and R.care_start_utc <  X.care_end_utc  + B
                          and X.care_start_utc <  R.care_end_utc  + B ]
          # A gap of EXACTLY TRAVEL_BUFFER_MINUTES does not conflict
          # (R.care_start_utc == X.care_end_utc + B makes the first test false);
          # a gap of one minute less does. block.total_slots is IGNORED here.
          return ADMIT if len(conflicts) < provider.max_concurrent_assignments
                 else REJECT_CAREGIVER        # ERR_CAREGIVER_WINDOW_CONFLICT
    input_set: "One CapacityBlock, its owning Provider, the candidate Reservation, and — for IN_HOME only — every other Reservation of that provider with fulfillment_status IN {CONFIRMED, IN_SERVICE}"
    constants:
      TRAVEL_BUFFER_MINUTES: 60
    precision: "timestamps compared at whole-second resolution"

  - name: provider_quality_score
    trigger: "Recomputed on UNDER_REVIEW -> SUBSTANTIATED, on PENDING -> CREDENTIALED, on every network_status transition, on IN_SERVICE -> COMPLETED, and on every POST /backup-care/_clock/set_current_utc; writes Provider.quality_score and Provider.lifetime_quality_score"
    algorithm: decay_function
    formula: |
      SEVERITY_WEIGHT = {MINOR: 4, MODERATE: 12, SEVERE: 30}
      deductions = 0
      for I in IncidentReport where I.provider_id == P.id and I.incident_status == SUBSTANTIATED:
          age_days = floor((current_utc - I.reported_at) total seconds / 86400)
          if   variant == LIFETIME_UNDECAYED: decay = 1.00
          elif age_days <= 30:                decay = 1.00
          elif age_days <= 60:                decay = 0.60
          elif age_days <= 90:                decay = 0.30
          else:                               decay = 0.00
          deductions += SEVERITY_WEIGHT[I.severity] * decay
      bonus = min(BONUS_CAP, floor(P.completed_reservation_count / BONUS_EVERY) * BONUS_STEP)
      score = max(0, min(100, round_half_up(100 - deductions + bonus, 2)))
    input_set: "Every IncidentReport of this provider with incident_status == SUBSTANTIATED (OPEN, UNDER_REVIEW and DISMISSED reports are excluded), plus Provider.completed_reservation_count"
    constants:
      BONUS_CAP: 10
      BONUS_EVERY: 5
      BONUS_STEP: 2
    precision: "2 decimal places, round_half_up; floor on age_days and on the bonus step count"
    variants:
      - name: ROLLING_90D
        when: "Written to Provider.quality_score; the only variant match_rank_score reads"
        difference: "Applies the age decay bands, so an incident older than 90 days contributes zero"
      - name: LIFETIME_UNDECAYED
        when: "Written to Provider.lifetime_quality_score; read by the reinstatement precondition and by employer_utilization_report.renewal_risk_band"
        difference: "Ignores age entirely — every substantiated incident deducts at full weight forever. One SEVERE (92 days old), one MODERATE (42 days old) and one MINOR (7 days old) report yield 88.80 rolling and 54.00 lifetime from identical rows."

  - name: cancellation_penalty
    trigger: "Inside every Reservation cancel transition; writes Reservation.penalty_cents and decides the NOT_BILLABLE -> ACCRUED billing move"
    algorithm: threshold
    formula: |
      # cancellation_deadline_utc is written at intake and never recomputed:
      cancellation_deadline_utc = R.care_start_utc - plan.cancellation_window_hours hours
      is_late = current_utc > cancellation_deadline_utc        # strict '>' : exactly at the deadline is ON TIME
      if from_state == CONFIRMED and is_late:
          penalty_cents = round_half_up(plan.no_show_charge_cents * LATE_CANCEL_FACTOR)
      else:
          penalty_cents = 0
      # Cancelling from INTAKE, MATCHING, OFFERED or UNFULFILLED is never penalised,
      # however late it is, because no capacity was ever held.
    input_set: "One reservation, its from-state, its plan snapshot at plan_version_pinned, and the logical clock"
    constants:
      LATE_CANCEL_FACTOR: 0.5
    precision: "cents are integers, round_half_up"

  - name: employee_entitlement_projection
    trigger: "GET /backup-care/employees/{id}/entitlement, and whenever Employee.entitlement_days_used / entitlement_days_reserved / no_show_strike_count / eligibility_status are recomputed"
    algorithm: forward_looking
    formula: |
      m = Employer.fiscal_year_start_month
      Y = year(current_utc) if month(current_utc) >= m else year(current_utc) - 1
      benefit_year_start = date(Y, m, 1)                      # inclusive
      benefit_year_end   = date(Y + 1, m, 1)                  # exclusive
      scope = UsageLedgerEntry rows where employee_id == E.id
                                    and benefit_year_start == that date
      days_used      = sum(e.days_delta for e in scope where e.entry_type == COMMIT)
      days_reserved  = sum(e.days_delta for e in scope where e.entry_type IN {RESERVE, RELEASE})
      days_limit     = BenefitPlan(E.benefit_plan_id).annual_use_limit_days
      days_remaining = max(0, days_limit - days_used - days_reserved)
      overage_days_projected = max(0, days_used + days_reserved - days_limit)
      strikes = count(e for e in scope where e.entry_type == NO_SHOW_CHARGE)
      eligibility_status =
          INELIGIBLE if E.employment_status != ACTIVE or Employer.contract_status != ACTIVE
          else RESTRICTED if strikes >= NO_SHOW_STRIKE_LIMIT
          else ELIGIBLE
    input_set: "Every UsageLedgerEntry of this employee whose benefit_year_start equals the current benefit year; entries in other benefit years are excluded, which is how the annual limit resets"
    constants:
      NO_SHOW_STRIKE_LIMIT: 2
    precision: "days carried to 2 decimal places, round_half_up; counts are integers"

  - name: employer_invoice_totals
    trigger: "Inside POST /backup-care/employers/{id}/invoices; writes every InvoiceLine plus EmployerInvoice.copay_cents, overage_cents, penalty_cents, subtotal_cents, admin_fee_cents, total_cents, line_count and reservation_count"
    algorithm: aggregation
    formula: |
      # ---- billable reservation set ----
      scope = Reservation rows R where
                Employee(R.employee_id).employer_id == invoice.employer_id
                and R.billing_status == ACCRUED
                and R.fulfillment_status IN {COMPLETED, NO_SHOW, CANCELLED}
                and period_start <= R.care_date <= period_end     # inclusive both ends
      # processing order (deterministic):
      order = scope sorted by R.care_date ASC, then R.created_at ASC
      #
      # ---- line generation; a line whose amount_cents == 0 is NOT written ----
      for R in order:
          if R.fulfillment_status IN {COMPLETED, NO_SHOW}:
              emit CARE_COPAY   with quantity = covered_qty(R), unit_cents = copay_unit(R)
              emit CARE_OVERAGE with quantity = overage_qty(R), unit_cents = overage_unit(R)
          if R.fulfillment_status == NO_SHOW:
              emit NO_SHOW_CHARGE     with quantity = 1, unit_cents = R.penalty_cents
          if R.fulfillment_status == CANCELLED and R.penalty_cents > 0:
              emit LATE_CANCEL_CHARGE with quantity = 1, unit_cents = R.penalty_cents
      #
      # ---- ROUNDING ORDER IS PINNED: round each line, THEN sum ----
      amount_cents(line)  = round_half_up(line.quantity * line.unit_cents)
      subtotal_cents      = sum(amount_cents(line) for every line on this invoice)
      admin_fee_cents     = round_half_up(subtotal_cents * Employer.admin_fee_pct)
      total_cents         = subtotal_cents + admin_fee_cents
      # The alternative order — sum the UNROUNDED quantity*unit products and round
      # once at the end — is explicitly NOT used. Two in-home copay lines of
      # 4.25h x 605c each give 2571 + 2571 = 5142, never round(5142.5) = 5143.
      # admin_fee_cents is likewise computed from the INTEGER subtotal, never from
      # the unrounded product sum.
      copay_cents   = sum(amount_cents for lines with line_type == CARE_COPAY)
      overage_cents = sum(amount_cents for lines with line_type == CARE_OVERAGE)
      penalty_cents = sum(amount_cents for lines with line_type IN {NO_SHOW_CHARGE, LATE_CANCEL_CHARGE})
      line_count        = number of lines written
      reservation_count = number of distinct reservation_id values across those lines
    input_set: "Reservations of this employer's employees with billing_status == ACCRUED, fulfillment_status IN {COMPLETED, NO_SHOW, CANCELLED} and care_date inside the inclusive period; reservations already INVOICED or PAID are excluded, which is what prevents double billing"
    constants: {}
    precision: "cents are integers, round_half_up applied per line and again to the admin fee"

  - name: employer_utilization_report
    trigger: "GET /backup-care/employers/{id}/utilization-report"
    algorithm: aggregation
    formula: |
      scope = Reservation rows R where Employee(R.employee_id).employer_id == E.id
                and period_start <= R.care_date <= period_end       # inclusive both ends
      reservations_confirmed  = count(R in scope where R.fulfillment_status IN {CONFIRMED, IN_SERVICE, COMPLETED, NO_SHOW})
      reservations_completed  = count(R in scope where R.fulfillment_status == COMPLETED)
      no_show_count           = count(R in scope where R.fulfillment_status == NO_SHOW)
      days_used     = sum(R.covered_days for R in scope where R.fulfillment_status IN {COMPLETED, NO_SHOW})
      days_overage  = sum(R.overage_days for R in scope where R.fulfillment_status IN {COMPLETED, NO_SHOW})
      unique_employees_served = count(distinct R.employee_id for R in scope where R.fulfillment_status == COMPLETED)
      center_done = count(R in scope where R.fulfillment_status == COMPLETED
                          and Provider(R.matched_provider_id).care_mode == CENTER_BASED)
      center_share_pct  = 0 if reservations_completed == 0
                          else round_half_up(100 * center_done / reservations_completed, 2)
      in_home_share_pct = 0 if reservations_completed == 0
                          else round_half_up(100 - center_share_pct, 2)
      no_show_rate_pct  = 0 if reservations_confirmed == 0
                          else round_half_up(100 * no_show_count / reservations_confirmed, 2)
      min_lifetime = min(Provider(R.matched_provider_id).lifetime_quality_score
                         for R in scope where R.fulfillment_status IN {COMPLETED, NO_SHOW})
                     # null when that set is empty
      # first matching band wins, evaluated top to bottom:
      renewal_risk_band =
          HIGH   if no_show_rate_pct >= RISK_NO_SHOW_HIGH_PCT
                 or (min_lifetime is not null and min_lifetime < RISK_LIFETIME_FLOOR)
          MEDIUM if days_overage > 0 or no_show_rate_pct >= RISK_NO_SHOW_MEDIUM_PCT
          LOW    otherwise
    input_set: "Reservations of this employer's employees whose care_date is inside the inclusive period, in every fulfillment_status; INTAKE / MATCHING / OFFERED / CANCELLED / UNFULFILLED rows contribute to none of the counters above"
    constants:
      RISK_NO_SHOW_HIGH_PCT: 25
      RISK_NO_SHOW_MEDIUM_PCT: 10
      RISK_LIFETIME_FLOOR: 70
    precision: "percentages to 2 decimal places, round_half_up; days to 2 decimal places, round_half_up"

  - name: conserved_quantity_invariants
    trigger: "Not an endpoint calculation — the named invariants every forward/compensating transition pair must preserve; asserted by tests, enforced by the side-effect sets in §1.2"
    algorithm: aggregation
    formula: |
      # I1 — NET_ENTITLEMENT_DAYS(employee, benefit_year)
      NET_ENTITLEMENT_DAYS = sum(e.days_delta for e in UsageLedgerEntry
                                 where e.employee_id == E.id
                                   and e.benefit_year_start == BY)
      #   == Employee.entitlement_days_used + Employee.entitlement_days_reserved
      #   A CONFIRM (+d RESERVE) paired with its compensating CANCEL (-d RELEASE)
      #   or with the provider-withdrawal CONFIRMED -> MATCHING (-d RELEASE) leaves
      #   NET_ENTITLEMENT_DAYS exactly at its pre-confirm value.
      #
      # I2 — BLOCK_OCCUPANCY(capacity_block)
      BLOCK_OCCUPANCY = CapacityBlock.reserved_slots + CapacityBlock.committed_slots
      #   == sum(X.required_seats for X in Reservation
      #          where X.matched_capacity_block_id == block.id
      #            and X.fulfillment_status IN {CONFIRMED, IN_SERVICE, COMPLETED, NO_SHOW})
      #   A CONFIRM paired with its compensating CANCEL or provider withdrawal
      #   returns BLOCK_OCCUPANCY to its pre-confirm value and block_status from
      #   FULL back to OPEN.
      #
      # I3 — EMPLOYER_LEDGER_CENTS(employer, benefit_year)
      EMPLOYER_LEDGER_CENTS = sum(e.cents_delta for e in UsageLedgerEntry
                                  where Employee(e.employee_id).employer_id == E.id
                                    and e.benefit_year_start == BY)
      #   An invoice DRAFT/ISSUE paired with its compensating VOID leaves
      #   EMPLOYER_LEDGER_CENTS unchanged: invoicing only reads the ledger, and
      #   VOID deletes lines without appending or removing any ledger entry.
    input_set: "All UsageLedgerEntry rows in the benefit year, all Reservation rows of the block, and all InvoiceLine rows of the employer"
    constants: {}
    precision: "days to 2 decimal places, cents as integers"

# =============================================================================
# §1.4 Ordered Validation Rules
#
# Priority bands (lower number = evaluated earlier = its error is the one
# returned when several rules are violated by the same request):
#   100-199  schema        request shape / enum membership / numeric domain
#   200-299  auth          role and identity checks
#   300-399  existence     path and body id resolution
#   400-499  state         current lifecycle state of the target entity
#   500-599  business_temporal   clock- and window-relative checks
#   600-699  business_referential  cross-entity ownership / linkage checks
#   700-799  business_fiscal     money and entitlement arithmetic checks
#   800-899  business_constraint capacity, quota and uniqueness checks
#   900-999  business_safety     credentialing / eligibility gates
# Within a band, the lower priority number is evaluated first. No two rules
# share a priority number.
# =============================================================================
validations:

  # ---- schema -----------------------------------------------------------
  - priority: 100
    category: schema
    rule: "Every field marked required in the endpoint's input must be present and of the declared type; unknown enum members are rejected"
    error_id: ERR_INVALID_REQUEST
    applies_to: "every endpoint"
  - priority: 105
    category: schema
    rule: "Every *_cents field, annual_use_limit_days, total_slots, max_concurrent_assignments and dependent count must be an integer >= 0"
    error_id: ERR_INVALID_REQUEST
    applies_to: "POST /backup-care/benefit-plans, POST /backup-care/providers, POST /backup-care/providers/{id}/capacity-blocks, POST /backup-care/employers"
  - priority: 110
    category: schema
    rule: "admin_fee_pct must be a decimal in [0, 0.5] with at most 4 decimal places; fiscal_year_start_month must be an integer in [1, 12]"
    error_id: ERR_INVALID_REQUEST
    applies_to: "POST /backup-care/employers, PATCH /backup-care/employers/{id}"
  - priority: 115
    category: schema
    rule: "care_end_utc must be strictly after care_start_utc, and end_time_utc strictly after start_time_utc"
    error_id: ERR_INVALID_WINDOW
    applies_to: "POST /backup-care/reservations, POST /backup-care/providers/{id}/capacity-blocks"
  - priority: 120
    category: schema
    rule: "period_end must be on or after period_start"
    error_id: ERR_INVALID_PERIOD
    applies_to: "POST /backup-care/employers/{id}/invoices, GET /backup-care/employers/{id}/utilization-report"
  - priority: 125
    category: schema
    rule: "dependent_ids must be a non-empty array of distinct values"
    error_id: ERR_INVALID_REQUEST
    applies_to: "POST /backup-care/reservations"

  # ---- auth -------------------------------------------------------------
  - priority: 200
    category: auth
    rule: "X-User-ID must be present and resolve to a known role identity"
    error_id: ERR_UNAUTHENTICATED
    applies_to: "every endpoint"
  - priority: 210
    category: auth
    rule: "The caller's role must appear in the endpoint's allowed_roles"
    error_id: ERR_UNAUTHORIZED
    applies_to: "every endpoint"
  - priority: 220
    category: auth
    rule: "An employee_user caller may only read or act on reservations, dependents and entitlement belonging to their own employee record"
    error_id: ERR_FORBIDDEN_SCOPE
    applies_to: "GET /backup-care/reservations/{id}, POST /backup-care/reservations, POST /backup-care/reservations/{id}/cancel, GET /backup-care/employees/{id}/entitlement, GET /backup-care/employees/{id}/dependents, GET /backup-care/employees/{id}/reservations, GET /backup-care/employees/{id}/ledger-entries"
  - priority: 230
    category: auth
    rule: "A provider_manager caller may only act on providers they are linked to via Provider.owner_user_id"
    error_id: ERR_FORBIDDEN_SCOPE
    applies_to: "POST /backup-care/providers/{id}/capacity-blocks, POST /backup-care/providers/{id}/credentials, POST /backup-care/reservations/{id}/check-in, POST /backup-care/reservations/{id}/complete, POST /backup-care/reservations/{id}/no-show"
  - priority: 240
    category: auth
    rule: "The X-User-ID that filed an IncidentReport (IncidentReport.reported_by_user_id) may not be the X-User-ID that substantiates or dismisses it"
    error_id: ERR_SEGREGATION_OF_DUTIES
    applies_to: "POST /backup-care/incident-reports/{id}/substantiate, POST /backup-care/incident-reports/{id}/dismiss"

  # ---- existence --------------------------------------------------------
  - priority: 300
    category: existence
    rule: "The path {id} must resolve to an existing row of the endpoint's entity"
    error_id: "ERR_<ENTITY>_NOT_FOUND"
    applies_to: "every endpoint with a path parameter"
  - priority: 310
    category: existence
    rule: "Every id supplied in the request body (employer_id, employee_id, benefit_plan_id, dependent_ids[], provider_id, capacity_block_id, match_offer_id, reservation_id) must resolve to an existing row"
    error_id: "ERR_<ENTITY>_NOT_FOUND"
    applies_to: "POST /backup-care/employees, POST /backup-care/benefit-plans, POST /backup-care/reservations, POST /backup-care/reservations/{id}/reject-offer, POST /backup-care/reservations/{id}/confirm, POST /backup-care/incident-reports"

  # ---- state ------------------------------------------------------------
  - priority: 400
    category: state
    rule: "The target entity's current state must permit the requested transition per §1.2; when the current state is a terminal state of that machine, rule 405 applies instead and this rule stands down"
    error_id: "ERR_<ENTITY>_STATE_INVALID"
    applies_to: "every transition endpoint"
  - priority: 405
    category: state
    rule: "A terminal-state entity accepts no further transitions (Reservation in COMPLETED/CANCELLED/NO_SHOW, BenefitPlan in SUPERSEDED, EmployerInvoice in PAID/VOID, Provider in DEPROVISIONED, IncidentReport in SUBSTANTIATED/DISMISSED)"
    error_id: "ERR_<ENTITY>_TERMINAL"
    applies_to: "every transition endpoint"
  - priority: 410
    category: state
    rule: "An invoice may only be issued while it is in DRAFT, and may only be paid while it is in ISSUED"
    error_id: ERR_INVOICE_STATE_INVALID
    applies_to: "POST /backup-care/employer-invoices/{id}/issue, POST /backup-care/employer-invoices/{id}/payment"
  - priority: 415
    category: state
    rule: "A BenefitPlan may only be attached to a new Employee or Reservation while its status is ACTIVE"
    error_id: ERR_PLAN_NOT_ACTIVE
    applies_to: "POST /backup-care/employees, POST /backup-care/reservations"
  - priority: 417
    category: state
    rule: "A BenefitPlan may only be activated while the owning Employer.contract_status is ACTIVE"
    error_id: ERR_EMPLOYER_CONTRACT_INACTIVE
    applies_to: "POST /backup-care/benefit-plans/{id}/activate"
  - priority: 420
    category: state
    rule: "A CapacityBlock referenced by a confirm must have block_status == OPEN"
    error_id: ERR_BLOCK_NOT_OPEN
    applies_to: "POST /backup-care/reservations/{id}/confirm"
  - priority: 423
    category: state
    rule: "PATCH on a Provider may carry care_mode or market_code only when the supplied value equals the stored value; any attempted change is refused"
    error_id: ERR_PROVIDER_FIELD_IMMUTABLE
    applies_to: "PATCH /backup-care/providers/{id}"
  - priority: 425
    category: state
    rule: "PATCH on a BenefitPlan is only permitted while status == DRAFT; an ACTIVE plan must be superseded instead"
    error_id: ERR_PLAN_NOT_EDITABLE
    applies_to: "PATCH /backup-care/benefit-plans/{id}"

  # ---- business_temporal ------------------------------------------------
  - priority: 500
    category: business_temporal
    rule: "care_start_utc must be strictly after the logical clock at intake"
    error_id: ERR_CARE_WINDOW_IN_PAST
    applies_to: "POST /backup-care/reservations"
  - priority: 505
    category: business_temporal
    rule: "care_start_utc and care_end_utc must fall on the same UTC calendar date, which becomes care_date"
    error_id: ERR_CARE_WINDOW_SPANS_DAYS
    applies_to: "POST /backup-care/reservations"
  - priority: 510
    category: business_temporal
    rule: "The SELECTED MatchOffer may only be confirmed or rejected while the logical clock is at or before its offer_expires_at; exactly at offer_expires_at is still valid"
    error_id: ERR_OFFER_EXPIRED
    applies_to: "POST /backup-care/reservations/{id}/confirm, POST /backup-care/reservations/{id}/reject-offer"
  - priority: 515
    category: business_temporal
    rule: "check-in is only permitted once the logical clock is at or after care_start_utc minus CHECK_IN_LEAD_MINUTES (60), and strictly before care_end_utc"
    error_id: ERR_CHECK_IN_TOO_EARLY
    applies_to: "POST /backup-care/reservations/{id}/check-in"
  - priority: 520
    category: business_temporal
    rule: "no-show may only be reported once the logical clock is at or after care_start_utc"
    error_id: ERR_NO_SHOW_TOO_EARLY
    applies_to: "POST /backup-care/reservations/{id}/no-show"
  - priority: 525
    category: business_temporal
    rule: "actual_end_utc must be after actual_start_utc, and actual_start_utc must be on care_date"
    error_id: ERR_INVALID_ACTUAL_WINDOW
    applies_to: "POST /backup-care/reservations/{id}/complete"
  - priority: 530
    category: business_temporal
    rule: "A capacity block's service_date must equal the UTC date of both start_time_utc and end_time_utc"
    error_id: ERR_BLOCK_DATE_MISMATCH
    applies_to: "POST /backup-care/providers/{id}/capacity-blocks"
  - priority: 535
    category: business_temporal
    rule: "The logical clock may only move forward; a target strictly earlier than the current value is rejected"
    error_id: ERR_CLOCK_MOVES_BACKWARD
    applies_to: "POST /backup-care/_clock/set_current_utc"

  # ---- business_referential --------------------------------------------
  - priority: 600
    category: business_referential
    rule: "Every dependent in dependent_ids must belong to the reservation's employee"
    error_id: ERR_DEPENDENT_NOT_OWNED
    applies_to: "POST /backup-care/reservations"
  - priority: 605
    category: business_referential
    rule: "The employee's benefit_plan_id must belong to the employee's employer"
    error_id: ERR_PLAN_EMPLOYER_MISMATCH
    applies_to: "POST /backup-care/employees, POST /backup-care/benefit-plans"
  - priority: 610
    category: business_referential
    rule: "The accepted match_offer_id must reference a MatchOffer whose reservation_id equals the path reservation"
    error_id: ERR_OFFER_RESERVATION_MISMATCH
    applies_to: "POST /backup-care/reservations/{id}/reject-offer"
  - priority: 615
    category: business_referential
    rule: "The capacity_block_id supplied at confirm must belong to the provider named on the accepted MatchOffer"
    error_id: ERR_BLOCK_PROVIDER_MISMATCH
    applies_to: "POST /backup-care/reservations/{id}/confirm"
  - priority: 620
    category: business_referential
    rule: "An IncidentReport's reservation_id, when present, must reference a reservation whose matched_provider_id equals the report's provider_id"
    error_id: ERR_INCIDENT_PROVIDER_MISMATCH
    applies_to: "POST /backup-care/incident-reports"

  # ---- business_fiscal -------------------------------------------------
  - priority: 700
    category: business_fiscal
    rule: "An invoice with total_cents == 0 (no billable lines in the period) may not be issued"
    error_id: ERR_INVOICE_EMPTY
    applies_to: "POST /backup-care/employer-invoices/{id}/issue"
  - priority: 705
    category: business_fiscal
    rule: "A payment's paid_amount_cents must exactly equal the invoice's total_cents"
    error_id: ERR_PAYMENT_AMOUNT_MISMATCH
    applies_to: "POST /backup-care/employer-invoices/{id}/payment"
  - priority: 710
    category: business_fiscal
    rule: "An invoice may not be voided once its invoice_status is PAID"
    error_id: ERR_INVOICE_NOT_VOIDABLE
    applies_to: "POST /backup-care/employer-invoices/{id}/void"
  - priority: 715
    category: business_fiscal
    rule: "A reservation may not be confirmed when entitlement_split yields overage_days > 0 and the employer has overage_billing_enabled == false"
    error_id: ERR_OVERAGE_NOT_PERMITTED
    applies_to: "POST /backup-care/reservations/{id}/confirm"
  - priority: 720
    category: business_fiscal
    rule: "A new invoice period must not overlap any existing non-VOID invoice period of the same employer"
    error_id: ERR_INVOICE_PERIOD_OVERLAP
    applies_to: "POST /backup-care/employers/{id}/invoices"

  # ---- business_constraint ---------------------------------------------
  - priority: 800
    category: business_constraint
    rule: "The chosen capacity block must admit the reservation per capacity_and_window_admission semantics A (center-based seat sum)"
    error_id: ERR_CAPACITY_EXHAUSTED
    applies_to: "POST /backup-care/reservations/{id}/confirm"
  - priority: 805
    category: business_constraint
    rule: "The reservation window must be fully contained in the chosen capacity block's window"
    error_id: ERR_WINDOW_OUTSIDE_BLOCK
    applies_to: "POST /backup-care/reservations/{id}/confirm"
  - priority: 810
    category: business_constraint
    rule: "An in-home caregiver may not exceed max_concurrent_assignments once TRAVEL_BUFFER_MINUTES (60) is applied to both ends of each existing CONFIRMED/IN_SERVICE window"
    error_id: ERR_CAREGIVER_WINDOW_CONFLICT
    applies_to: "POST /backup-care/reservations/{id}/confirm"
  - priority: 815
    category: business_constraint
    rule: "An employee may hold at most one Reservation with fulfillment_status IN {CONFIRMED, IN_SERVICE} whose care_date equals the requested care_date"
    error_id: ERR_DUPLICATE_CARE_DATE
    applies_to: "POST /backup-care/reservations/{id}/confirm"
  - priority: 820
    category: business_constraint
    rule: "Employer.name is globally unique, Employee.employee_external_id and Employee.user_id are unique (per employer and globally respectively), BenefitPlan.plan_code is unique per employer across plans whose status IN {DRAFT, ACTIVE}, and a Provider may hold at most one non-REVOKED Credential per credential_type"
    error_id: ERR_DUPLICATE_KEY
    applies_to: "POST /backup-care/employers, POST /backup-care/providers, POST /backup-care/employees"
  - priority: 825
    category: business_constraint
    rule: "A CapacityBlock may not overlap another OPEN or FULL block of the same provider on the same service_date; windows are half-open, so a block starting exactly when another ends is accepted"
    error_id: ERR_BLOCK_OVERLAP
    applies_to: "POST /backup-care/providers/{id}/capacity-blocks"
  - priority: 830
    category: business_constraint
    rule: "Supersession only moves forward in time: a DRAFT plan may not be activated while the employer already has an ACTIVE plan whose effective_from is on or after the candidate plan's effective_from, because activating the candidate would leave the later-effective incumbent SUPERSEDED by an earlier-effective plan"
    error_id: ERR_ACTIVE_PLAN_EXISTS
    applies_to: "POST /backup-care/benefit-plans/{id}/activate"

  # ---- business_safety -------------------------------------------------
  - priority: 900
    category: business_safety
    rule: "The employee's eligibility_status must be ELIGIBLE; RESTRICTED (>= NO_SHOW_STRIKE_LIMIT strikes) and INELIGIBLE employees cannot open reservations"
    error_id: ERR_EMPLOYEE_NOT_ELIGIBLE
    applies_to: "POST /backup-care/reservations"
  - priority: 902
    category: business_safety
    rule: "The length of dependent_ids must be <= BenefitPlan.max_dependents_per_reservation of the plan being pinned; exactly at the limit is accepted"
    error_id: ERR_TOO_MANY_DEPENDENTS
    applies_to: "POST /backup-care/reservations"
  - priority: 905
    category: business_safety
    rule: "Every dependent on a reservation must have status ACTIVE and a dependent_type present in the plan's eligible_dependent_types; an ADULT_ELDER dependent additionally requires Employer.adult_elder_extension_enabled == true"
    error_id: ERR_DEPENDENT_NOT_ELIGIBLE
    applies_to: "POST /backup-care/reservations"
  - priority: 910
    category: business_safety
    rule: "A provider may not be credentialed, nor matched, nor confirmed unless it holds a VALID Credential of every type in REQUIRED_CREDENTIAL_TYPES that does not expire before care_date"
    error_id: ERR_PROVIDER_NOT_CREDENTIALED
    applies_to: "POST /backup-care/providers/{id}/credential-review, POST /backup-care/providers/{id}/network-status, POST /backup-care/reservations/{id}/confirm"
  - priority: 915
    category: business_safety
    rule: "A provider whose network_status is PENDING, SUSPENDED or DEPROVISIONED may not be matched or confirmed"
    error_id: ERR_PROVIDER_NOT_IN_NETWORK
    applies_to: "POST /backup-care/reservations/{id}/confirm"
  - priority: 920
    category: business_safety
    rule: "A same-day reservation (care_date == the logical clock's UTC date) may only be confirmed against a provider whose same_day_available is true"
    error_id: ERR_SAME_DAY_UNAVAILABLE
    applies_to: "POST /backup-care/reservations/{id}/confirm"
  - priority: 925
    category: business_safety
    rule: "A SUSPENDED or PROBATION provider may only return to CREDENTIALED when its lifetime_quality_score is >= REINSTATE_MIN_LIFETIME_SCORE (60)"
    error_id: ERR_REINSTATE_SCORE_TOO_LOW
    applies_to: "POST /backup-care/providers/{id}/network-status"

# =============================================================================
# §1.5 API Endpoint Table
#
# Every path is rooted at api_prefix /backup-care. The first path parameter of
# every template is literally {id}; nested collections hang off it.
# Roles: benefits_admin | care_coordinator | network_admin | provider_manager |
#        employee_user  (see §1.7)
# =============================================================================
endpoints:

  # ------------------------------------------------ test-driving / operations --
  - method: POST
    path: /backup-care/_clock/set_current_utc
    purpose: |
      Sets the logical clock every temporal rule in this scaffold reads. The
      clock DEFAULTS to 2026-08-01T00:00:00Z on a cold start and whenever it has
      never been set; every scenario that does not call this endpoint behaves as
      if current_utc == 2026-08-01T00:00:00Z. The clock may only move forward.
      Setting it does NOT itself run maintenance, but it does recompute every
      Credential expiry read, Provider.quality_score decay band and
      Employee.eligibility_status derivation on the next read.
    input: [current_utc]
    roles: [network_admin, benefits_admin, care_coordinator, provider_manager, employee_user]
    output: { current_utc: string, previous_utc: string }
    side_effects:
      - "Recomputes Provider.quality_score and Provider.lifetime_quality_score for every provider (decay bands are clock-relative)"
      - "Recomputes Employee.eligibility_status for every employee"
    errors: [ERR_INVALID_REQUEST, ERR_CLOCK_MOVES_BACKWARD]

  - method: POST
    path: /backup-care/_ops/run-daily-maintenance
    purpose: |
      Single sweep that advances every clock-driven transition, in this PINNED
      step order. A later step observes the writes of every earlier step.
        step 1  Credential VALID -> EXPIRED for every credential whose
                expires_on < current UTC date.
        step 2  Provider {CREDENTIALED, PROBATION} -> SUSPENDED for every
                provider that, after step 1, no longer holds a VALID credential
                of every REQUIRED_CREDENTIAL_TYPES member; each such suspension
                runs its full future-reservation withdrawal cascade.
        step 3  Reservation {INTAKE, MATCHING, OFFERED} -> UNFULFILLED with
                unfulfilled_reason_code 'CARE_WINDOW_ELAPSED' for every
                reservation whose care_start_utc < current_utc.
        step 4  MatchOffer PROPOSED|SELECTED -> EXPIRED with reason_code
                'OFFER_TTL_ELAPSED' for every offer whose offer_expires_at <
                current_utc that survived step 3.
        step 5  CapacityBlock block_status -> CLOSED for every block whose
                service_date < current UTC date.
        step 6  Reservation CONFIRMED -> NO_SHOW for every reservation whose
                care_end_utc < current_utc, with the full no-show side-effect
                set (release, commit, no-show charge, strike, eligibility).
      Steps 1->2 and 3->4 are order-sensitive: reversing either pair changes the
      resulting row set.
    input: []
    roles: [network_admin]
    output: { credentials_expired: integer, providers_suspended: integer, reservations_unfulfilled: integer, offers_expired: integer, blocks_closed: integer, reservations_no_showed: integer, reservations_withdrawn: integer }
    side_effects:
      - "Every side effect of the six transitions named above, applied in the pinned step order"
    errors: [ERR_UNAUTHORIZED]

  # ------------------------------------------------------------------ Employer --
  - method: POST
    path: /backup-care/employers
    purpose: Register a sponsoring employer account.
    input: [name, industry_code, "contract_status?", "fiscal_year_start_month?", "invoicing_cycle?", "admin_fee_pct?", "overage_billing_enabled?", "adult_elder_extension_enabled?"]
    roles: [network_admin, benefits_admin]
    output: Employer
    side_effects: []
    errors: [ERR_INVALID_REQUEST, ERR_UNAUTHENTICATED, ERR_UNAUTHORIZED, ERR_DUPLICATE_KEY]

  - method: GET
    path: /backup-care/employers/{id}
    purpose: Read one employer, including the computed accrued_overage_cents_current_period tier input and ytd_billed_cents.
    input: []
    roles: [network_admin, benefits_admin, care_coordinator]
    output: Employer
    side_effects: []
    errors: [ERR_EMPLOYER_NOT_FOUND, ERR_UNAUTHORIZED]

  - method: GET
    path: /backup-care/employers
    purpose: List employers, optionally narrowed by contract posture.
    input: ["contract_status?", "limit?", "offset?"]
    roles: [network_admin, benefits_admin]
    output: Employer[]
    side_effects: []
    errors: [ERR_INVALID_REQUEST, ERR_UNAUTHORIZED]

  - method: PATCH
    path: /backup-care/employers/{id}
    purpose: |
      Amend the commercial terms of an employer account. Changing contract_status
      away from ACTIVE immediately flips every one of that employer's employees
      to eligibility_status INELIGIBLE without touching employment_status.
    input: ["contract_status?", "admin_fee_pct?", "invoicing_cycle?", "overage_billing_enabled?", "adult_elder_extension_enabled?", "fiscal_year_start_month?"]
    roles: [benefits_admin]
    output: Employer
    side_effects:
      - "Bumps Employer.version by 1, which invalidates any in-flight expected_employer_version held by a plan writer"
      - "Recomputes Employee.eligibility_status for every employee of this employer"
    errors: [ERR_INVALID_REQUEST, ERR_EMPLOYER_NOT_FOUND, ERR_UNAUTHORIZED]

  - method: GET
    path: /backup-care/employers/{id}/benefit-plans
    purpose: Reverse lookup of every benefit plan designed for this employer, newest effective_from first.
    input: ["status?", "limit?", "offset?"]
    roles: [network_admin, benefits_admin, care_coordinator]
    output: BenefitPlan[]
    side_effects: []
    errors: [ERR_EMPLOYER_NOT_FOUND, ERR_UNAUTHORIZED]

  - method: GET
    path: /backup-care/employers/{id}/employees
    purpose: Reverse lookup of the employer's enrolled workforce.
    input: ["employment_status?", "eligibility_status?", "limit?", "offset?"]
    roles: [network_admin, benefits_admin]
    output: Employee[]
    side_effects: []
    errors: [ERR_EMPLOYER_NOT_FOUND, ERR_UNAUTHORIZED]

  - method: GET
    path: /backup-care/employers/{id}/invoices
    purpose: Reverse lookup of the employer's invoices, newest period_start first.
    input: ["invoice_status?", "limit?", "offset?"]
    roles: [network_admin, benefits_admin]
    output: EmployerInvoice[]
    side_effects: []
    errors: [ERR_EMPLOYER_NOT_FOUND, ERR_UNAUTHORIZED]

  - method: POST
    path: /backup-care/employers/{id}/invoices
    purpose: |
      Sweep every ACCRUED reservation of this employer whose care_date falls in
      the inclusive [period_start, period_end] window into a new DRAFT invoice,
      running employer_invoice_totals. Zero-amount lines are not written, so a
      period with only zero-copay covered care yields line_count 0 and cannot be
      issued.
    input: [period_start, period_end]
    roles: [network_admin, benefits_admin]
    output: EmployerInvoice
    side_effects:
      - "Creates one EmployerInvoice in DRAFT plus one InvoiceLine per non-zero billable component, in the pinned care_date ASC then created_at ASC order"
      - "Moves every swept Reservation billing_status ACCRUED -> INVOICED"
      - "Writes copay_cents, overage_cents, penalty_cents, subtotal_cents, admin_fee_cents, total_cents, line_count and reservation_count"
    errors: [ERR_INVALID_REQUEST, ERR_INVALID_PERIOD, ERR_EMPLOYER_NOT_FOUND, ERR_UNAUTHORIZED, ERR_INVOICE_PERIOD_OVERLAP]

  - method: GET
    path: /backup-care/employers/{id}/utilization-report
    purpose: |
      Utilization and renewal analytics over an inclusive care_date window, per
      employer_utilization_report. renewal_risk_band evaluates HIGH before
      MEDIUM before LOW, first match wins.
    input: [period_start, period_end]
    roles: [network_admin, benefits_admin]
    output: { employer_id: string, period_start: string, period_end: string, reservations_confirmed: integer, reservations_completed: integer, no_show_count: integer, no_show_rate_pct: number, days_used: number, days_overage: number, unique_employees_served: integer, center_share_pct: number, in_home_share_pct: number, min_provider_lifetime_score: number, renewal_risk_band: string }
    side_effects: []
    errors: [ERR_INVALID_REQUEST, ERR_INVALID_PERIOD, ERR_EMPLOYER_NOT_FOUND, ERR_UNAUTHORIZED]

  # --------------------------------------------------------------- BenefitPlan --
  - method: POST
    path: /backup-care/benefit-plans
    purpose: |
      Draft a benefit design for an employer. Guarded by OCC on the parent
      Employer: expected_employer_version must equal Employer.version, otherwise
      ERR_STALE_EMPLOYER_VERSION (412).
    input: [employer_id, expected_employer_version, plan_code, annual_use_limit_days, copay_center_cents_per_day, copay_in_home_cents_per_hour, "in_home_min_billable_hours?", eligible_dependent_types, "max_dependents_per_reservation?", overage_rate_center_cents_per_day, overage_rate_in_home_cents_per_hour, "cancellation_window_hours?", no_show_charge_cents, effective_from, "effective_to?"]
    roles: [benefits_admin]
    output: BenefitPlan
    side_effects:
      - "Creates the plan in DRAFT; no employee is enrolled and no existing plan is superseded"
    errors: [ERR_INVALID_REQUEST, ERR_EMPLOYER_NOT_FOUND, ERR_UNAUTHORIZED, ERR_STALE_EMPLOYER_VERSION, ERR_DUPLICATE_KEY, ERR_PLAN_EMPLOYER_MISMATCH]

  - method: GET
    path: /backup-care/benefit-plans/{id}
    purpose: Read one benefit plan design, including status, superseded_by_plan_id and enrolled_employee_count.
    input: []
    roles: [network_admin, benefits_admin, care_coordinator, employee_user]
    output: BenefitPlan
    side_effects: []
    errors: [ERR_BENEFITPLAN_NOT_FOUND, ERR_UNAUTHORIZED]

  - method: GET
    path: /backup-care/benefit-plans
    purpose: |
      List benefit plans. superseded_by_plan_id is filterable, which is how the
      self-referential supersede edge is traversed in reverse (find the plan a
      given plan replaced).
    input: ["employer_id?", "status?", "superseded_by_plan_id?", "limit?", "offset?"]
    roles: [network_admin, benefits_admin, care_coordinator]
    output: BenefitPlan[]
    side_effects: []
    errors: [ERR_INVALID_REQUEST, ERR_UNAUTHORIZED]

  - method: PATCH
    path: /backup-care/benefit-plans/{id}
    purpose: Amend a plan design while it is still DRAFT. An ACTIVE plan is frozen and must be replaced by activating a successor.
    input: ["annual_use_limit_days?", "copay_center_cents_per_day?", "copay_in_home_cents_per_hour?", "in_home_min_billable_hours?", "eligible_dependent_types?", "max_dependents_per_reservation?", "overage_rate_center_cents_per_day?", "overage_rate_in_home_cents_per_hour?", "cancellation_window_hours?", "no_show_charge_cents?", "effective_to?"]
    roles: [benefits_admin]
    output: BenefitPlan
    side_effects:
      - "Bumps BenefitPlan.version by 1, so any reservation later taken against this plan pins the new version"
    errors: [ERR_INVALID_REQUEST, ERR_BENEFITPLAN_NOT_FOUND, ERR_UNAUTHORIZED, ERR_PLAN_NOT_EDITABLE]

  - method: POST
    path: /backup-care/benefit-plans/{id}/activate
    purpose: |
      Promote a DRAFT plan to ACTIVE. At most one ACTIVE plan per employer, so
      the incumbent ACTIVE plan is superseded in the same request.
    input: []
    roles: [benefits_admin]
    output: BenefitPlan
    side_effects:
      - "Moves the incumbent ACTIVE plan of the same employer to SUPERSEDED and sets its superseded_by_plan_id to this plan"
      - "Employees stay enrolled on their existing benefit_plan_id — no re-enrollment cascade"
    errors: [ERR_BENEFITPLAN_NOT_FOUND, ERR_UNAUTHORIZED, ERR_BENEFITPLAN_STATE_INVALID, ERR_BENEFITPLAN_TERMINAL, ERR_PLAN_EFFECTIVE_WINDOW, ERR_EMPLOYER_CONTRACT_INACTIVE]

  # ------------------------------------------------------------------ Employee --
  - method: POST
    path: /backup-care/employees
    purpose: Enrol an employee against an ACTIVE plan of their own employer.
    input: [employer_id, benefit_plan_id, employee_external_id, user_id, email, full_name, "employment_status?"]
    roles: [benefits_admin]
    output: Employee
    side_effects:
      - "Recomputes BenefitPlan.enrolled_employee_count on the named plan"
    errors: [ERR_INVALID_REQUEST, ERR_EMPLOYER_NOT_FOUND, ERR_BENEFITPLAN_NOT_FOUND, ERR_UNAUTHORIZED, ERR_DUPLICATE_KEY, ERR_PLAN_NOT_ACTIVE, ERR_PLAN_EMPLOYER_MISMATCH]

  - method: GET
    path: /backup-care/employees/{id}
    purpose: Read one employee, including the computed entitlement counters and eligibility_status.
    input: []
    roles: [network_admin, benefits_admin, care_coordinator, employee_user]
    output: Employee
    side_effects: []
    errors: [ERR_EMPLOYEE_NOT_FOUND, ERR_UNAUTHORIZED, ERR_FORBIDDEN_SCOPE]

  - method: GET
    path: /backup-care/employees
    purpose: |
      List employees. benefit_plan_id is filterable, which is the reverse
      traversal of Employee.benefit_plan_id -> BenefitPlan.id.
    input: ["employer_id?", "benefit_plan_id?", "employment_status?", "eligibility_status?", "limit?", "offset?"]
    roles: [network_admin, benefits_admin, care_coordinator]
    output: Employee[]
    side_effects: []
    errors: [ERR_INVALID_REQUEST, ERR_UNAUTHORIZED]

  - method: PATCH
    path: /backup-care/employees/{id}
    purpose: |
      Update employment posture or re-enrol the employee on a different ACTIVE
      plan of the same employer. Moving employment_status away from ACTIVE flips
      eligibility_status to INELIGIBLE but leaves already-CONFIRMED reservations
      standing.
    input: ["employment_status?", "benefit_plan_id?", "email?"]
    roles: [benefits_admin]
    output: Employee
    side_effects:
      - "Recomputes eligibility_status"
      - "Recomputes BenefitPlan.enrolled_employee_count on the old and the new plan"
    errors: [ERR_INVALID_REQUEST, ERR_EMPLOYEE_NOT_FOUND, ERR_BENEFITPLAN_NOT_FOUND, ERR_UNAUTHORIZED, ERR_PLAN_NOT_ACTIVE, ERR_PLAN_EMPLOYER_MISMATCH]

  - method: GET
    path: /backup-care/employees/{id}/entitlement
    purpose: |
      Forward-looking entitlement projection for the current employer benefit
      year, per employee_entitlement_projection. days_remaining subtracts BOTH
      committed and still-reserved days, so a CONFIRMED-but-not-completed
      reservation already reduces it.
    input: []
    roles: [network_admin, benefits_admin, care_coordinator, employee_user]
    output: { employee_id: string, benefit_year_start: string, benefit_year_end: string, days_limit: number, days_used: number, days_reserved: number, days_remaining: number, overage_days_projected: number, no_show_strike_count: integer, eligibility_status: string }
    side_effects: []
    errors: [ERR_EMPLOYEE_NOT_FOUND, ERR_UNAUTHORIZED, ERR_FORBIDDEN_SCOPE]

  - method: GET
    path: /backup-care/employees/{id}/dependents
    purpose: Reverse lookup of the employee's eligible dependents.
    input: ["dependent_type?", "status?", "limit?", "offset?"]
    roles: [network_admin, benefits_admin, care_coordinator, employee_user]
    output: Dependent[]
    side_effects: []
    errors: [ERR_EMPLOYEE_NOT_FOUND, ERR_UNAUTHORIZED, ERR_FORBIDDEN_SCOPE]

  - method: POST
    path: /backup-care/employees/{id}/dependents
    purpose: Register a dependent under an employee. dependent_type CHILD or ADULT_ELDER selects the care track.
    input: [full_name, dependent_type, date_of_birth, relationship, "care_notes?", "status?"]
    roles: [benefits_admin, employee_user]
    output: Dependent
    side_effects: []
    errors: [ERR_INVALID_REQUEST, ERR_EMPLOYEE_NOT_FOUND, ERR_UNAUTHORIZED, ERR_FORBIDDEN_SCOPE]

  - method: GET
    path: /backup-care/employees/{id}/reservations
    purpose: Reverse lookup of the employee's reservations across both state dimensions.
    input: ["fulfillment_status?", "billing_status?", "care_date?", "limit?", "offset?"]
    roles: [network_admin, benefits_admin, care_coordinator, employee_user]
    output: Reservation[]
    side_effects: []
    errors: [ERR_EMPLOYEE_NOT_FOUND, ERR_UNAUTHORIZED, ERR_FORBIDDEN_SCOPE]

  - method: GET
    path: /backup-care/employees/{id}/ledger-entries
    purpose: |
      Append-only entitlement ledger of the employee in effective_at ASC then
      created_at ASC order. This is the audit surface for the entitlement-day
      conservation invariant.
    input: ["entry_type?", "benefit_year_start?", "limit?", "offset?"]
    roles: [network_admin, benefits_admin, care_coordinator, employee_user]
    output: UsageLedgerEntry[]
    side_effects: []
    errors: [ERR_EMPLOYEE_NOT_FOUND, ERR_UNAUTHORIZED, ERR_FORBIDDEN_SCOPE]

  # ----------------------------------------------------------------- Dependent --
  - method: GET
    path: /backup-care/dependents/{id}
    purpose: Read one dependent.
    input: []
    roles: [network_admin, benefits_admin, care_coordinator, employee_user]
    output: Dependent
    side_effects: []
    errors: [ERR_DEPENDENT_NOT_FOUND, ERR_UNAUTHORIZED, ERR_FORBIDDEN_SCOPE]

  - method: PATCH
    path: /backup-care/dependents/{id}
    purpose: |
      Amend a dependent record. Setting status to INACTIVE blocks the dependent
      from NEW reservations but never rewrites the frozen dependent_ids of an
      existing reservation.
    input: ["full_name?", "relationship?", "care_notes?", "status?"]
    roles: [benefits_admin, employee_user]
    output: Dependent
    side_effects: []
    errors: [ERR_INVALID_REQUEST, ERR_DEPENDENT_NOT_FOUND, ERR_UNAUTHORIZED, ERR_FORBIDDEN_SCOPE]

  # ------------------------------------------------------------------ Provider --
  - method: POST
    path: /backup-care/providers
    purpose: Onboard a network provider in PENDING. care_mode is fixed for the provider's lifetime and selects which capacity semantics apply.
    input: [provider_name, owner_user_id, care_mode, market_code, postal_code, "daily_capacity_slots?", "max_concurrent_assignments?", "same_day_available?"]
    roles: [network_admin]
    output: Provider
    side_effects: []
    errors: [ERR_INVALID_REQUEST, ERR_UNAUTHORIZED, ERR_DUPLICATE_KEY]

  - method: GET
    path: /backup-care/providers/{id}
    purpose: Read one provider, including both quality-score variants and the current network_status.
    input: []
    roles: [network_admin, benefits_admin, care_coordinator, provider_manager]
    output: Provider
    side_effects: []
    errors: [ERR_PROVIDER_NOT_FOUND, ERR_UNAUTHORIZED]

  - method: GET
    path: /backup-care/providers
    purpose: List providers, filterable on the dimensions the match ranker's eligibility filter uses.
    input: ["market_code?", "care_mode?", "network_status?", "same_day_available?", "limit?", "offset?"]
    roles: [network_admin, benefits_admin, care_coordinator]
    output: Provider[]
    side_effects: []
    errors: [ERR_INVALID_REQUEST, ERR_UNAUTHORIZED]

  - method: PATCH
    path: /backup-care/providers/{id}
    purpose: Amend provider capacity defaults and same-day posture. care_mode and market_code are immutable after creation.
    input: ["provider_name?", "postal_code?", "daily_capacity_slots?", "max_concurrent_assignments?", "same_day_available?", "care_mode?", "market_code?"]
    roles: [network_admin]
    output: Provider
    side_effects: []
    errors: [ERR_INVALID_REQUEST, ERR_PROVIDER_NOT_FOUND, ERR_UNAUTHORIZED, ERR_PROVIDER_FIELD_IMMUTABLE]

  - method: POST
    path: /backup-care/providers/{id}/credentials
    purpose: File a credential document for a provider. At most one non-REVOKED credential per credential_type.
    input: [credential_type, issued_on, expires_on, verified_by]
    roles: [network_admin, provider_manager]
    output: Credential
    side_effects: []
    errors: [ERR_INVALID_REQUEST, ERR_PROVIDER_NOT_FOUND, ERR_UNAUTHORIZED, ERR_FORBIDDEN_SCOPE, ERR_DUPLICATE_KEY]

  - method: GET
    path: /backup-care/providers/{id}/credentials
    purpose: Reverse lookup of the provider's credential file.
    input: ["credential_type?", "status?", "limit?", "offset?"]
    roles: [network_admin, care_coordinator, provider_manager]
    output: Credential[]
    side_effects: []
    errors: [ERR_PROVIDER_NOT_FOUND, ERR_UNAUTHORIZED, ERR_FORBIDDEN_SCOPE]

  - method: POST
    path: /backup-care/providers/{id}/credential-review
    purpose: |
      Admit a PENDING provider into the network. Requires a VALID, unexpired
      credential of EVERY member of REQUIRED_CREDENTIAL_TYPES
      (LICENSE, BACKGROUND_CHECK, CPR, INSURANCE).
    input: ["reason_code?"]
    roles: [network_admin]
    output: Provider
    side_effects:
      - "Sets last_status_reason_code and recomputes quality_score and lifetime_quality_score"
    errors: [ERR_PROVIDER_NOT_FOUND, ERR_UNAUTHORIZED, ERR_PROVIDER_STATE_INVALID, ERR_PROVIDER_TERMINAL, ERR_PROVIDER_NOT_CREDENTIALED]

  - method: POST
    path: /backup-care/providers/{id}/network-status
    purpose: |
      Move a provider along its network_status machine. Entering SUSPENDED or
      DEPROVISIONED runs the withdrawal cascade over that provider's future
      CONFIRMED reservations. Returning to CREDENTIALED from PROBATION or
      SUSPENDED requires a full credential set AND
      lifetime_quality_score >= REINSTATE_MIN_LIFETIME_SCORE.
    input: [target_status, reason_code]
    roles: [network_admin]
    output: Provider
    side_effects:
      - "For every Reservation with matched_provider_id == this provider, fulfillment_status == CONFIRMED and care_start_utc > current_utc, drives CONFIRMED -> MATCHING with its RELEASE ledger entry, Employee counter recompute and CapacityBlock recompute plus version bump"
      - "Sets last_status_reason_code"
    errors: [ERR_INVALID_REQUEST, ERR_PROVIDER_NOT_FOUND, ERR_UNAUTHORIZED, ERR_PROVIDER_STATE_INVALID, ERR_PROVIDER_TERMINAL, ERR_PROVIDER_NOT_CREDENTIALED, ERR_REINSTATE_SCORE_TOO_LOW]

  - method: POST
    path: /backup-care/providers/{id}/capacity-blocks
    purpose: |
      Publish a servable interval. total_slots governs aggregate seat capacity
      only for CENTER_BASED providers; for IN_HOME providers the block bounds the
      window but capacity is governed by max_concurrent_assignments and the
      travel buffer instead. Blocks of the same provider on the same
      service_date may not overlap, treating each interval as half-open.
    input: [start_time_utc, end_time_utc, "total_slots?"]
    roles: [network_admin, provider_manager]
    output: CapacityBlock
    side_effects:
      - "Derives service_date from start_time_utc; total_slots defaults to Provider.daily_capacity_slots when omitted"
    errors: [ERR_INVALID_REQUEST, ERR_INVALID_WINDOW, ERR_PROVIDER_NOT_FOUND, ERR_UNAUTHORIZED, ERR_FORBIDDEN_SCOPE, ERR_BLOCK_DATE_MISMATCH, ERR_BLOCK_OVERLAP, ERR_PROVIDER_TERMINAL]

  - method: GET
    path: /backup-care/providers/{id}/capacity-blocks
    purpose: Reverse lookup of the provider's published capacity, including live reserved_slots and committed_slots.
    input: ["service_date?", "block_status?", "limit?", "offset?"]
    roles: [network_admin, care_coordinator, provider_manager]
    output: CapacityBlock[]
    side_effects: []
    errors: [ERR_PROVIDER_NOT_FOUND, ERR_UNAUTHORIZED, ERR_FORBIDDEN_SCOPE]

  # ---------------------------------------------------------------- Credential --
  - method: GET
    path: /backup-care/credentials/{id}
    purpose: Read one credential document and its validity state.
    input: []
    roles: [network_admin, care_coordinator, provider_manager]
    output: Credential
    side_effects: []
    errors: [ERR_CREDENTIAL_NOT_FOUND, ERR_UNAUTHORIZED, ERR_FORBIDDEN_SCOPE]

  - method: POST
    path: /backup-care/credentials/{id}/revoke
    purpose: |
      Revoke a credential. When the revoked type is a REQUIRED_CREDENTIAL_TYPES
      member and the provider is CREDENTIALED or PROBATION, this drives the
      provider to SUSPENDED, which in turn withdraws every future CONFIRMED
      reservation of that provider, which in turn releases entitlement days and
      capacity slots — a depth-4 cascade from one credential write.
    input: [revoked_reason_code]
    roles: [network_admin]
    output: Credential
    side_effects:
      - "Sets Credential.status = REVOKED and revoked_reason_code"
      - "Drives Provider {CREDENTIALED, PROBATION} -> SUSPENDED when the type is required"
      - "Through that suspension: CONFIRMED -> MATCHING per affected future reservation, one RELEASE UsageLedgerEntry each, Employee.entitlement_days_reserved recompute, CapacityBlock recompute plus version bump"
    errors: [ERR_INVALID_REQUEST, ERR_CREDENTIAL_NOT_FOUND, ERR_UNAUTHORIZED, ERR_CREDENTIAL_TERMINAL]

  # ------------------------------------------------------------- CapacityBlock --
  - method: GET
    path: /backup-care/capacity-blocks/{id}
    purpose: |
      Read one capacity block. The `version` field on this response is the value
      a confirm caller passes as expected_capacity_block_version.
    input: []
    roles: [network_admin, care_coordinator, provider_manager, benefits_admin]
    output: CapacityBlock
    side_effects: []
    errors: [ERR_CAPACITYBLOCK_NOT_FOUND, ERR_UNAUTHORIZED]

  # ------------------------------------------------------------- Reservation --
  - method: POST
    path: /backup-care/reservations
    purpose: |
      Open a backup-care reservation in INTAKE. Pins benefit_plan_id and
      plan_version_pinned from the employee's current enrolment, derives
      care_date, dependent_count, dependent_type_mix, required_seats and
      cancellation_deadline_utc, and consumes nothing yet.
    input: [employee_id, requested_care_mode, market_code, care_start_utc, care_end_utc, dependent_ids]
    roles: [care_coordinator, benefits_admin, employee_user]
    output: Reservation
    side_effects:
      - "Copies Employee.benefit_plan_id into Reservation.benefit_plan_id and BenefitPlan.version into plan_version_pinned"
      - "Computes cancellation_deadline_utc = care_start_utc minus BenefitPlan.cancellation_window_hours, frozen for the reservation's life"
    errors: [ERR_INVALID_REQUEST, ERR_INVALID_WINDOW, ERR_EMPLOYEE_NOT_FOUND, ERR_DEPENDENT_NOT_FOUND, ERR_UNAUTHORIZED, ERR_FORBIDDEN_SCOPE, ERR_CARE_WINDOW_IN_PAST, ERR_CARE_WINDOW_SPANS_DAYS, ERR_DEPENDENT_NOT_OWNED, ERR_PLAN_NOT_ACTIVE, ERR_EMPLOYEE_NOT_ELIGIBLE, ERR_DEPENDENT_NOT_ELIGIBLE, ERR_TOO_MANY_DEPENDENTS]

  - method: GET
    path: /backup-care/reservations/{id}
    purpose: Read one reservation, including both state dimensions and every charge field.
    input: []
    roles: [network_admin, benefits_admin, care_coordinator, provider_manager, employee_user]
    output: Reservation
    side_effects: []
    errors: [ERR_RESERVATION_NOT_FOUND, ERR_UNAUTHORIZED, ERR_FORBIDDEN_SCOPE]

  - method: GET
    path: /backup-care/reservations
    purpose: |
      List reservations. benefit_plan_id, matched_provider_id and
      matched_capacity_block_id are all filterable, which is how those three
      forward references are traversed in reverse; dependent_id searches inside
      the frozen dependent_ids array.
    input: ["employee_id?", "benefit_plan_id?", "matched_provider_id?", "matched_capacity_block_id?", "dependent_id?", "fulfillment_status?", "billing_status?", "care_date?", "market_code?", "limit?", "offset?"]
    roles: [network_admin, benefits_admin, care_coordinator]
    output: Reservation[]
    side_effects: []
    errors: [ERR_INVALID_REQUEST, ERR_UNAUTHORIZED]

  - method: POST
    path: /backup-care/reservations/{id}/match
    purpose: |
      Run match_rank_score and publish an offer batch. Callable from INTAKE,
      MATCHING and UNFULFILLED. An empty candidate pool is NOT an error: the
      reservation lands in UNFULFILLED with unfulfilled_reason_code
      'NO_ELIGIBLE_PROVIDER' and the call still returns 200.
    input: []
    roles: [care_coordinator]
    output: Reservation
    side_effects:
      - "Expires every surviving PROPOSED offer of the previous batch with reason_code 'REMATCHED'"
      - "Creates one MatchOffer per candidate with rank_score, rank_position, offer_expires_at and the four components; rank_position 1 becomes SELECTED and the rest PROPOSED"
      - "Sets matched_provider_id and recomputes required_seats from the selected provider's care_mode"
      - "Clears unfulfilled_reason_code when re-entering OFFERED from UNFULFILLED"
    errors: [ERR_RESERVATION_NOT_FOUND, ERR_UNAUTHORIZED, ERR_RESERVATION_STATE_INVALID, ERR_RESERVATION_TERMINAL, ERR_EMPLOYEE_NOT_ELIGIBLE, ERR_PLAN_NOT_ACTIVE, ERR_CARE_WINDOW_IN_PAST]

  - method: POST
    path: /backup-care/reservations/{id}/reject-offer
    purpose: |
      Decline the SELECTED offer and return the reservation to MATCHING. The
      declined provider is appended to excluded_provider_ids and can never be
      offered for this reservation again, which is what makes the
      OFFERED -> MATCHING -> OFFERED cycle terminate.
    input: [match_offer_id, reason_code]
    roles: [care_coordinator, employee_user]
    output: Reservation
    side_effects:
      - "The named MatchOffer becomes REJECTED with the supplied reason_code"
      - "Appends its provider_id to Reservation.excluded_provider_ids"
      - "Expires every other PROPOSED offer of the batch with reason_code 'OFFER_BATCH_CLOSED'"
      - "Clears matched_provider_id"
    errors: [ERR_INVALID_REQUEST, ERR_RESERVATION_NOT_FOUND, ERR_MATCHOFFER_NOT_FOUND, ERR_UNAUTHORIZED, ERR_FORBIDDEN_SCOPE, ERR_RESERVATION_STATE_INVALID, ERR_RESERVATION_TERMINAL, ERR_OFFER_RESERVATION_MISMATCH, ERR_OFFER_NOT_SELECTED, ERR_OFFER_EXPIRED]

  - method: POST
    path: /backup-care/reservations/{id}/confirm
    purpose: |
      Confirm care into a specific capacity block of the SELECTED offer's
      provider. Guarded by OCC on the parent CapacityBlock:
      expected_capacity_block_version must equal CapacityBlock.version, else
      ERR_STALE_CAPACITY_BLOCK_VERSION (412). Runs the PROVISIONAL variant of
      reservation_day_charge, entitlement_split and reservation_charge_money,
      and reserves both entitlement days and capacity slots.
    input: [capacity_block_id, expected_capacity_block_version]
    roles: [care_coordinator]
    output: Reservation
    side_effects:
      - "Sets matched_capacity_block_id and mints confirmation_code"
      - "Writes billable_hours_provisional, days_charged_provisional, covered_days, overage_days, overage_tier_multiplier, copay_cents and overage_cents"
      - "Appends a RESERVE UsageLedgerEntry of +days_charged_provisional"
      - "Recomputes Employee.entitlement_days_reserved and eligibility_status"
      - "Recomputes CapacityBlock.reserved_slots and block_status and bumps CapacityBlock.version by 1"
      - "Expires every remaining PROPOSED offer with reason_code 'CONFIRMED_ELSEWHERE'"
    errors: [ERR_INVALID_REQUEST, ERR_RESERVATION_NOT_FOUND, ERR_CAPACITYBLOCK_NOT_FOUND, ERR_UNAUTHORIZED, ERR_RESERVATION_STATE_INVALID, ERR_RESERVATION_TERMINAL, ERR_STALE_CAPACITY_BLOCK_VERSION, ERR_OFFER_EXPIRED, ERR_BLOCK_PROVIDER_MISMATCH, ERR_BLOCK_NOT_OPEN, ERR_OVERAGE_NOT_PERMITTED, ERR_WINDOW_OUTSIDE_BLOCK, ERR_CAPACITY_EXHAUSTED, ERR_CAREGIVER_WINDOW_CONFLICT, ERR_DUPLICATE_CARE_DATE, ERR_PROVIDER_NOT_CREDENTIALED, ERR_PROVIDER_NOT_IN_NETWORK, ERR_SAME_DAY_UNAVAILABLE]

  - method: POST
    path: /backup-care/reservations/{id}/cancel
    purpose: |
      Cancel a reservation. Cancelling from CONFIRMED is the compensating
      transition for confirm: it releases exactly the days and slots the confirm
      reserved. Whether a penalty accrues depends on cancellation_penalty, whose
      deadline test is strictly greater-than, so cancelling at exactly
      cancellation_deadline_utc is penalty-free.
    input: [cancel_reason_code]
    roles: [care_coordinator, benefits_admin, employee_user]
    output: Reservation
    side_effects:
      - "From CONFIRMED: appends a RELEASE UsageLedgerEntry of -days_charged_provisional, recomputes Employee.entitlement_days_reserved, recomputes the CapacityBlock and bumps its version by 1"
      - "From CONFIRMED and late: sets penalty_cents, appends a LATE_CANCEL_CHARGE UsageLedgerEntry, and moves billing_status NOT_BILLABLE -> ACCRUED"
      - "From INTAKE, MATCHING, OFFERED or UNFULFILLED: no ledger entry, no penalty, billing_status stays NOT_BILLABLE"
      - "From OFFERED: expires every PROPOSED and SELECTED offer with reason_code 'RESERVATION_CANCELLED' and clears matched_provider_id"
    errors: [ERR_INVALID_REQUEST, ERR_RESERVATION_NOT_FOUND, ERR_UNAUTHORIZED, ERR_FORBIDDEN_SCOPE, ERR_RESERVATION_STATE_INVALID, ERR_RESERVATION_TERMINAL]

  - method: POST
    path: /backup-care/reservations/{id}/check-in
    purpose: Move a CONFIRMED reservation to IN_SERVICE once the check-in window opens (CHECK_IN_LEAD_MINUTES = 60 before care_start_utc).
    input: []
    roles: [care_coordinator, provider_manager]
    output: Reservation
    side_effects:
      - "No ledger movement; the reservation keeps occupying reserved_slots"
    errors: [ERR_RESERVATION_NOT_FOUND, ERR_UNAUTHORIZED, ERR_FORBIDDEN_SCOPE, ERR_RESERVATION_STATE_INVALID, ERR_RESERVATION_TERMINAL, ERR_CHECK_IN_TOO_EARLY, ERR_PROVIDER_NOT_IN_NETWORK]

  - method: POST
    path: /backup-care/reservations/{id}/complete
    purpose: |
      Close out delivered care with the ACTUAL window. Runs the FINAL variant of
      reservation_day_charge, re-runs entitlement_split and
      reservation_charge_money, releases the provisional hold and commits the
      final days, so a longer-than-requested in-home visit can commit more days
      than it reserved.
    input: [actual_start_utc, actual_end_utc]
    roles: [care_coordinator, provider_manager]
    output: Reservation
    side_effects:
      - "Records actual_start_utc, actual_end_utc, billable_hours_final and days_charged_final"
      - "Overwrites covered_days, overage_days, overage_tier_multiplier, copay_cents and overage_cents from the FINAL variant"
      - "Appends a RELEASE entry of -days_charged_provisional then a COMMIT entry of +days_charged_final, in that pinned order, then an OVERAGE_ACCRUE entry when overage_days > 0"
      - "Recomputes Employee.entitlement_days_used, entitlement_days_reserved and Employer.accrued_overage_cents_current_period"
      - "Recomputes CapacityBlock.reserved_slots, committed_slots and block_status and bumps its version by 1"
      - "Recomputes Provider.completed_reservation_count, quality_score and lifetime_quality_score"
      - "Moves billing_status NOT_BILLABLE -> ACCRUED"
    errors: [ERR_INVALID_REQUEST, ERR_RESERVATION_NOT_FOUND, ERR_UNAUTHORIZED, ERR_FORBIDDEN_SCOPE, ERR_RESERVATION_STATE_INVALID, ERR_RESERVATION_TERMINAL, ERR_INVALID_ACTUAL_WINDOW]

  - method: POST
    path: /backup-care/reservations/{id}/no-show
    purpose: |
      Record that the employee did not present for confirmed care. Charges the
      full plan no_show_charge_cents, commits the provisionally reserved days
      anyway, and increments the employee's strike count — which at
      NO_SHOW_STRIKE_LIMIT (2) flips eligibility_status to RESTRICTED and blocks
      all future intake.
    input: ["reason_code?"]
    roles: [care_coordinator, provider_manager]
    output: Reservation
    side_effects:
      - "Sets penalty_cents from the pinned plan no_show_charge_cents"
      - "Appends RELEASE, then COMMIT, then NO_SHOW_CHARGE UsageLedgerEntry rows in that pinned order"
      - "Recomputes Employee.entitlement_days_used, entitlement_days_reserved, no_show_strike_count and eligibility_status"
      - "Recomputes CapacityBlock.reserved_slots, committed_slots and block_status and bumps its version by 1"
      - "Moves billing_status NOT_BILLABLE -> ACCRUED"
    errors: [ERR_RESERVATION_NOT_FOUND, ERR_UNAUTHORIZED, ERR_FORBIDDEN_SCOPE, ERR_RESERVATION_STATE_INVALID, ERR_RESERVATION_TERMINAL, ERR_NO_SHOW_TOO_EARLY]

  - method: GET
    path: /backup-care/reservations/{id}/ledger-entries
    purpose: Reverse lookup of every entitlement and money entry this reservation appended, in pinned replay order.
    input: ["entry_type?", "limit?", "offset?"]
    roles: [network_admin, benefits_admin, care_coordinator]
    output: UsageLedgerEntry[]
    side_effects: []
    errors: [ERR_RESERVATION_NOT_FOUND, ERR_UNAUTHORIZED]

  - method: GET
    path: /backup-care/reservations/{id}/invoice-lines
    purpose: Reverse lookup of every invoice line that has billed this reservation.
    input: ["line_type?", "limit?", "offset?"]
    roles: [network_admin, benefits_admin]
    output: InvoiceLine[]
    side_effects: []
    errors: [ERR_RESERVATION_NOT_FOUND, ERR_UNAUTHORIZED]

  # -------------------------------------------------------------- MatchOffer --
  - method: GET
    path: /backup-care/match-offers/{id}
    purpose: Read one offer with its rank_score, the four scoring components, remaining_slots_at_offer and offer_expires_at.
    input: []
    roles: [network_admin, benefits_admin, care_coordinator, employee_user]
    output: MatchOffer
    side_effects: []
    errors: [ERR_MATCHOFFER_NOT_FOUND, ERR_UNAUTHORIZED]

  - method: GET
    path: /backup-care/match-offers
    purpose: |
      List offers. reservation_id and provider_id are both filterable, which is
      how the many-to-many Reservation <-> Provider candidate graph is traversed
      in either direction. Default order is rank_position ASC within a batch.
    input: ["reservation_id?", "provider_id?", "offer_status?", "limit?", "offset?"]
    roles: [network_admin, benefits_admin, care_coordinator]
    output: MatchOffer[]
    side_effects: []
    errors: [ERR_INVALID_REQUEST, ERR_UNAUTHORIZED]

  # --------------------------------------------------------- EmployerInvoice --
  - method: GET
    path: /backup-care/employer-invoices/{id}
    purpose: Read one invoice with its rounded per-line totals.
    input: []
    roles: [network_admin, benefits_admin]
    output: EmployerInvoice
    side_effects: []
    errors: [ERR_EMPLOYERINVOICE_NOT_FOUND, ERR_UNAUTHORIZED]

  - method: GET
    path: /backup-care/employer-invoices/{id}/lines
    purpose: Reverse lookup of the invoice's lines, each carrying its independently rounded amount_cents.
    input: ["line_type?", "employee_id?", "limit?", "offset?"]
    roles: [network_admin, benefits_admin]
    output: InvoiceLine[]
    side_effects: []
    errors: [ERR_EMPLOYERINVOICE_NOT_FOUND, ERR_UNAUTHORIZED]

  - method: POST
    path: /backup-care/employer-invoices/{id}/issue
    purpose: Issue a DRAFT invoice to the employer. An invoice with no lines cannot be issued.
    input: []
    roles: [network_admin]
    output: EmployerInvoice
    side_effects:
      - "Stamps issued_at from the logical clock and recomputes Employer.ytd_billed_cents"
    errors: [ERR_EMPLOYERINVOICE_NOT_FOUND, ERR_UNAUTHORIZED, ERR_INVOICE_STATE_INVALID, ERR_EMPLOYERINVOICE_TERMINAL, ERR_INVOICE_EMPTY]

  - method: POST
    path: /backup-care/employer-invoices/{id}/payment
    purpose: Record employer payment of an ISSUED invoice. The amount must match total_cents exactly.
    input: [paid_amount_cents]
    roles: [network_admin, benefits_admin]
    output: EmployerInvoice
    side_effects:
      - "Records paid_amount_cents and moves every billed Reservation billing_status INVOICED -> PAID"
      - "Recomputes Employer.ytd_billed_cents"
    errors: [ERR_INVALID_REQUEST, ERR_EMPLOYERINVOICE_NOT_FOUND, ERR_UNAUTHORIZED, ERR_INVOICE_STATE_INVALID, ERR_EMPLOYERINVOICE_TERMINAL, ERR_PAYMENT_AMOUNT_MISMATCH]

  - method: POST
    path: /backup-care/employer-invoices/{id}/void
    purpose: |
      Compensating transition for invoicing. Deletes every line, zeroes the
      totals, and returns each billed reservation to ACCRUED so it can be swept
      into a corrected invoice. Appends and removes no ledger entry, which is
      what preserves the employer money-conservation invariant.
    input: [void_reason_code]
    roles: [network_admin]
    output: EmployerInvoice
    side_effects:
      - "Deletes every InvoiceLine of this invoice and zeroes copay_cents, overage_cents, penalty_cents, subtotal_cents, admin_fee_cents, total_cents, line_count and reservation_count"
      - "Moves every billed Reservation billing_status INVOICED -> ACCRUED"
      - "Recomputes Employer.ytd_billed_cents"
    errors: [ERR_INVALID_REQUEST, ERR_EMPLOYERINVOICE_NOT_FOUND, ERR_UNAUTHORIZED, ERR_INVOICE_NOT_VOIDABLE, ERR_EMPLOYERINVOICE_TERMINAL]

  # ---------------------------------------------------------- IncidentReport --
  - method: POST
    path: /backup-care/incident-reports
    purpose: |
      File a quality-assurance incident against a network provider, optionally
      tied to the reservation it happened on. Filing alone never moves a score —
      only substantiation does.
    input: [provider_id, "reservation_id?", severity, category, narrative]
    roles: [care_coordinator, benefits_admin, employee_user, network_admin]
    output: IncidentReport
    side_effects:
      - "Stamps reported_at from the logical clock and reported_by_user_id from X-User-ID"
      - "Leaves Provider.quality_score, lifetime_quality_score and substantiated_incident_count untouched"
    errors: [ERR_INVALID_REQUEST, ERR_PROVIDER_NOT_FOUND, ERR_RESERVATION_NOT_FOUND, ERR_UNAUTHORIZED, ERR_INCIDENT_PROVIDER_MISMATCH]

  - method: GET
    path: /backup-care/incident-reports/{id}
    purpose: Read one incident report and its review state.
    input: []
    roles: [network_admin, benefits_admin, care_coordinator]
    output: IncidentReport
    side_effects: []
    errors: [ERR_INCIDENTREPORT_NOT_FOUND, ERR_UNAUTHORIZED]

  - method: GET
    path: /backup-care/incident-reports
    purpose: |
      List incident reports. provider_id and reservation_id are both filterable,
      which is how both of IncidentReport's forward references are traversed in
      reverse.
    input: ["provider_id?", "reservation_id?", "incident_status?", "severity?", "category?", "limit?", "offset?"]
    roles: [network_admin, benefits_admin, care_coordinator]
    output: IncidentReport[]
    side_effects: []
    errors: [ERR_INVALID_REQUEST, ERR_UNAUTHORIZED]

  - method: POST
    path: /backup-care/incident-reports/{id}/review
    purpose: Open the quality-assurance review. Records the reviewing coordinator; no score moves yet.
    input: []
    roles: [care_coordinator, network_admin]
    output: IncidentReport
    side_effects:
      - "Records reviewed_by from X-User-ID"
    errors: [ERR_INCIDENTREPORT_NOT_FOUND, ERR_UNAUTHORIZED, ERR_INCIDENTREPORT_STATE_INVALID, ERR_INCIDENTREPORT_TERMINAL, ERR_PROVIDER_NOT_IN_NETWORK]

  - method: POST
    path: /backup-care/incident-reports/{id}/substantiate
    purpose: |
      Uphold the report. Deducts from BOTH quality-score variants (decayed and
      undecayed) and optionally drives the provider's network_status, whose own
      cascade can withdraw future confirmed care. The filer may not substantiate
      their own report.
    input: [qa_action, resolution_reason_code]
    roles: [network_admin]
    output: IncidentReport
    side_effects:
      - "Sets qa_action and resolution_reason_code"
      - "Recomputes Provider.substantiated_incident_count, quality_score (ROLLING_90D) and lifetime_quality_score (LIFETIME_UNDECAYED)"
      - "qa_action PROBATION drives CREDENTIALED -> PROBATION; SUSPENSION and DEPROVISION drive the full withdrawal cascade; NONE touches network_status not at all"
    errors: [ERR_INVALID_REQUEST, ERR_INCIDENTREPORT_NOT_FOUND, ERR_UNAUTHORIZED, ERR_SEGREGATION_OF_DUTIES, ERR_INCIDENTREPORT_STATE_INVALID, ERR_INCIDENTREPORT_TERMINAL, ERR_PROVIDER_STATE_INVALID]

  - method: POST
    path: /backup-care/incident-reports/{id}/dismiss
    purpose: |
      Reject the report. The disjoint branch of the fork: no score movement, no
      network_status movement, qa_action stays NONE. The filer may not dismiss
      their own report.
    input: [resolution_reason_code]
    roles: [network_admin]
    output: IncidentReport
    side_effects:
      - "Sets resolution_reason_code and leaves qa_action at NONE"
      - "Leaves Provider.substantiated_incident_count, quality_score and lifetime_quality_score unchanged"
    errors: [ERR_INVALID_REQUEST, ERR_INCIDENTREPORT_NOT_FOUND, ERR_UNAUTHORIZED, ERR_SEGREGATION_OF_DUTIES, ERR_INCIDENTREPORT_STATE_INVALID, ERR_INCIDENTREPORT_TERMINAL]

# =============================================================================
# §1.6 Error Catalog
# Every code below is reachable from at least one §1.5 endpoint. Templated codes
# in §1.4 (ERR_<ENTITY>_NOT_FOUND / ERR_<ENTITY>_STATE_INVALID /
# ERR_<ENTITY>_TERMINAL) expand to the concrete per-entity codes listed here.
# =============================================================================
errors:

  # ---- generic ---------------------------------------------------------
  - code: ERR_INVALID_REQUEST
    http_status: 400
    when: "A required input field is absent, a field has the wrong type, an enum value is outside its declared set, or a numeric field is outside its declared range"
  - code: ERR_UNAUTHENTICATED
    http_status: 401
    when: "X-User-ID is absent or does not resolve to any known role identity"
  - code: ERR_UNAUTHORIZED
    http_status: 403
    when: "The caller's role is not in the endpoint's roles list"
  - code: ERR_FORBIDDEN_SCOPE
    http_status: 403
    when: "The caller's role is allowed on the endpoint but the target row is outside the caller's own scope — an employee_user reaching another employee's data, or a provider_manager reaching a provider whose owner_user_id is not theirs"
  - code: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    when: "The X-User-ID resolving an incident report is the same X-User-ID recorded in IncidentReport.reported_by_user_id"
  - code: ERR_DUPLICATE_KEY
    http_status: 409
    when: "A uniqueness constraint is violated: Employer.name, Employee.employee_external_id within an employer, Employee.user_id globally, BenefitPlan.plan_code within an employer across DRAFT and ACTIVE plans, or a second non-REVOKED Credential of the same credential_type on one provider"

  # ---- not found -------------------------------------------------------
  - code: ERR_EMPLOYER_NOT_FOUND
    http_status: 404
    when: "The path or body employer_id resolves to no Employer row"
  - code: ERR_BENEFITPLAN_NOT_FOUND
    http_status: 404
    when: "The path or body benefit_plan_id resolves to no BenefitPlan row"
  - code: ERR_EMPLOYEE_NOT_FOUND
    http_status: 404
    when: "The path or body employee_id resolves to no Employee row"
  - code: ERR_DEPENDENT_NOT_FOUND
    http_status: 404
    when: "A dependent_ids element or the path dependent id resolves to no Dependent row"
  - code: ERR_PROVIDER_NOT_FOUND
    http_status: 404
    when: "The path or body provider_id resolves to no Provider row"
  - code: ERR_CREDENTIAL_NOT_FOUND
    http_status: 404
    when: "The path credential id resolves to no Credential row"
  - code: ERR_CAPACITYBLOCK_NOT_FOUND
    http_status: 404
    when: "The path or body capacity_block_id resolves to no CapacityBlock row"
  - code: ERR_RESERVATION_NOT_FOUND
    http_status: 404
    when: "The path or body reservation_id resolves to no Reservation row"
  - code: ERR_MATCHOFFER_NOT_FOUND
    http_status: 404
    when: "The path or body match_offer_id resolves to no MatchOffer row"
  - code: ERR_EMPLOYERINVOICE_NOT_FOUND
    http_status: 404
    when: "The path invoice id resolves to no EmployerInvoice row"
  - code: ERR_INCIDENTREPORT_NOT_FOUND
    http_status: 404
    when: "The path incident report id resolves to no IncidentReport row"

  # ---- state -----------------------------------------------------------
  - code: ERR_RESERVATION_STATE_INVALID
    http_status: 409
    when: "The reservation's fulfillment_status does not permit the requested transition — confirming from INTAKE, checking in from OFFERED, completing from CONFIRMED, rejecting an offer from MATCHING"
  - code: ERR_RESERVATION_TERMINAL
    http_status: 409
    when: "The reservation's fulfillment_status is already COMPLETED, CANCELLED or NO_SHOW"
  - code: ERR_PROVIDER_STATE_INVALID
    http_status: 409
    when: "The requested target_status is not reachable from the provider's current network_status, e.g. PENDING -> PROBATION or SUSPENDED -> PROBATION"
  - code: ERR_PROVIDER_TERMINAL
    http_status: 409
    when: "The provider's network_status is DEPROVISIONED, which accepts no further transition and no new capacity"
  - code: ERR_CREDENTIAL_TERMINAL
    http_status: 409
    when: "The credential is already EXPIRED or REVOKED"
  - code: ERR_BENEFITPLAN_STATE_INVALID
    http_status: 409
    when: "Activation is attempted on a plan whose status is not DRAFT"
  - code: ERR_BENEFITPLAN_TERMINAL
    http_status: 409
    when: "The plan's status is already SUPERSEDED"
  - code: ERR_INVOICE_STATE_INVALID
    http_status: 409
    when: "An issue is attempted on an invoice that is not DRAFT, or a payment on an invoice that is not ISSUED"
  - code: ERR_EMPLOYERINVOICE_TERMINAL
    http_status: 409
    when: "The invoice's invoice_status is already PAID or VOID"
  - code: ERR_INCIDENTREPORT_STATE_INVALID
    http_status: 409
    when: "A review is attempted on a report that is not OPEN, or a substantiate/dismiss on a report that is not UNDER_REVIEW"
  - code: ERR_INCIDENTREPORT_TERMINAL
    http_status: 409
    when: "The report is already SUBSTANTIATED or DISMISSED"
  - code: ERR_PLAN_NOT_ACTIVE
    http_status: 409
    when: "An employee enrolment or a reservation intake names a BenefitPlan whose status is not ACTIVE"
  - code: ERR_PLAN_NOT_EDITABLE
    http_status: 409
    when: "A PATCH targets a BenefitPlan whose status is ACTIVE or SUPERSEDED"
  - code: ERR_BLOCK_NOT_OPEN
    http_status: 409
    when: "The capacity block named at confirm has block_status FULL or CLOSED"
  - code: ERR_EMPLOYER_CONTRACT_INACTIVE
    http_status: 409
    when: "A plan activation is attempted while the owning Employer.contract_status is not ACTIVE"
  - code: ERR_PROVIDER_FIELD_IMMUTABLE
    http_status: 409
    when: "A PATCH attempts to change Provider.care_mode or Provider.market_code"

  # ---- optimistic concurrency -----------------------------------------
  - code: ERR_STALE_EMPLOYER_VERSION
    http_status: 412
    when: "POST /backup-care/benefit-plans carries an expected_employer_version that is not equal to the current Employer.version"
  - code: ERR_STALE_CAPACITY_BLOCK_VERSION
    http_status: 412
    when: "POST /backup-care/reservations/{id}/confirm carries an expected_capacity_block_version that is not equal to the current CapacityBlock.version"

  # ---- temporal --------------------------------------------------------
  - code: ERR_INVALID_WINDOW
    http_status: 400
    when: "care_end_utc is not strictly after care_start_utc, or end_time_utc is not strictly after start_time_utc"
  - code: ERR_INVALID_PERIOD
    http_status: 400
    when: "period_end is earlier than period_start on an invoice sweep or a utilization report"
  - code: ERR_INVALID_ACTUAL_WINDOW
    http_status: 400
    when: "actual_end_utc is not after actual_start_utc, actual_start_utc is not on Reservation.care_date, or the logical clock is earlier than actual_end_utc"
  - code: ERR_CARE_WINDOW_IN_PAST
    http_status: 409
    when: "care_start_utc is at or before the logical clock at intake, or a match is attempted on a reservation whose care_start_utc has already elapsed"
  - code: ERR_CARE_WINDOW_SPANS_DAYS
    http_status: 400
    when: "care_start_utc and care_end_utc fall on different UTC calendar dates, or the window exceeds 14 hours"
  - code: ERR_OFFER_EXPIRED
    http_status: 409
    when: "The SELECTED MatchOffer's offer_expires_at is strictly earlier than the logical clock, or its offer_status is already EXPIRED"
  - code: ERR_CHECK_IN_TOO_EARLY
    http_status: 409
    when: "The logical clock is more than CHECK_IN_LEAD_MINUTES (60) before care_start_utc, or is at or after care_end_utc"
  - code: ERR_NO_SHOW_TOO_EARLY
    http_status: 409
    when: "A no-show is reported while the logical clock is still strictly before care_start_utc"
  - code: ERR_BLOCK_DATE_MISMATCH
    http_status: 400
    when: "A capacity block's start_time_utc and end_time_utc fall on different UTC calendar dates"
  - code: ERR_CLOCK_MOVES_BACKWARD
    http_status: 409
    when: "The requested current_utc is strictly earlier than the clock's present value"
  - code: ERR_PLAN_EFFECTIVE_WINDOW
    http_status: 409
    when: "Activation is attempted before BenefitPlan.effective_from or at or after a non-null BenefitPlan.effective_to"

  # ---- referential -----------------------------------------------------
  - code: ERR_DEPENDENT_NOT_OWNED
    http_status: 409
    when: "A dependent in dependent_ids belongs to a different employee than the reservation's employee_id"
  - code: ERR_PLAN_EMPLOYER_MISMATCH
    http_status: 409
    when: "The named BenefitPlan's employer_id differs from the employee's employer_id"
  - code: ERR_OFFER_RESERVATION_MISMATCH
    http_status: 409
    when: "The named MatchOffer's reservation_id differs from the path reservation"
  - code: ERR_OFFER_NOT_SELECTED
    http_status: 409
    when: "The named MatchOffer's offer_status is not SELECTED, so it is not the offer on the table"
  - code: ERR_BLOCK_PROVIDER_MISMATCH
    http_status: 409
    when: "The capacity block named at confirm belongs to a provider other than Reservation.matched_provider_id"
  - code: ERR_INCIDENT_PROVIDER_MISMATCH
    http_status: 409
    when: "An incident report names both a provider_id and a reservation_id whose matched_provider_id is a different provider"

  # ---- fiscal ----------------------------------------------------------
  - code: ERR_INVOICE_EMPTY
    http_status: 409
    when: "An issue is attempted on an invoice whose line_count is 0 — the period produced no non-zero billable line"
  - code: ERR_PAYMENT_AMOUNT_MISMATCH
    http_status: 409
    when: "paid_amount_cents is not exactly equal to EmployerInvoice.total_cents"
  - code: ERR_INVOICE_NOT_VOIDABLE
    http_status: 409
    when: "A void is attempted on an invoice whose invoice_status is PAID"
  - code: ERR_INVOICE_PERIOD_OVERLAP
    http_status: 409
    when: "The requested [period_start, period_end] overlaps an existing non-VOID invoice period of the same employer"
  - code: ERR_OVERAGE_NOT_PERMITTED
    http_status: 409
    when: "A confirm would produce overage_days > 0 while Employer.overage_billing_enabled is false"

  # ---- constraint ------------------------------------------------------
  - code: ERR_CAPACITY_EXHAUSTED
    http_status: 409
    when: "A CENTER_BASED confirm needs more seats than total_slots minus reserved_slots minus committed_slots leaves"
  - code: ERR_WINDOW_OUTSIDE_BLOCK
    http_status: 409
    when: "The reservation window is not fully contained in the named capacity block's window"
  - code: ERR_CAREGIVER_WINDOW_CONFLICT
    http_status: 409
    when: "An IN_HOME confirm would give the caregiver more than max_concurrent_assignments buffer-expanded overlapping assignments; a gap of exactly TRAVEL_BUFFER_MINUTES (60) does NOT conflict"
  - code: ERR_DUPLICATE_CARE_DATE
    http_status: 409
    when: "The employee already holds a CONFIRMED or IN_SERVICE reservation on the same care_date"
  - code: ERR_BLOCK_OVERLAP
    http_status: 409
    when: "A new capacity block overlaps an OPEN or FULL block of the same provider on the same service_date; touching endpoints do not overlap"
  - code: ERR_ACTIVE_PLAN_EXISTS
    http_status: 409
    when: "Activating a DRAFT plan whose effective_from is at or before the effective_from of the employer's incumbent ACTIVE plan, which would supersede a later-effective plan with an earlier-effective one"
  - code: ERR_TOO_MANY_DEPENDENTS
    http_status: 409
    when: "dependent_ids is longer than BenefitPlan.max_dependents_per_reservation"

  # ---- safety ----------------------------------------------------------
  - code: ERR_EMPLOYEE_NOT_ELIGIBLE
    http_status: 409
    when: "The employee's eligibility_status is RESTRICTED (no_show_strike_count >= NO_SHOW_STRIKE_LIMIT) or INELIGIBLE (employment_status or employer contract_status not ACTIVE)"
  - code: ERR_DEPENDENT_NOT_ELIGIBLE
    http_status: 409
    when: "A dependent's status is INACTIVE, its dependent_type is not in BenefitPlan.eligible_dependent_types, or it is ADULT_ELDER while Employer.adult_elder_extension_enabled is false"
  - code: ERR_PROVIDER_NOT_CREDENTIALED
    http_status: 409
    when: "The provider lacks a VALID, unexpired Credential of some member of REQUIRED_CREDENTIAL_TYPES, evaluated against the logical clock date for credential review and against Reservation.care_date for confirm"
  - code: ERR_PROVIDER_NOT_IN_NETWORK
    http_status: 409
    when: "The provider's network_status is PENDING, SUSPENDED or DEPROVISIONED at match, confirm, check-in or incident review"
  - code: ERR_SAME_DAY_UNAVAILABLE
    http_status: 409
    when: "care_date equals the logical clock's UTC date while the matched provider's same_day_available is false"
  - code: ERR_REINSTATE_SCORE_TOO_LOW
    http_status: 409
    when: "A return to CREDENTIALED is attempted while Provider.lifetime_quality_score is below REINSTATE_MIN_LIFETIME_SCORE (60)"

# =============================================================================
# §1.7 Role / Permission Matrix  (role_model: peer_roles)
#
# Five peer roles. None is a superset of another: benefits_admin owns the demand
# side (employer, plan, employee, dependent), network_admin owns the supply side
# (provider, credential, capacity, invoice issuance), care_coordinator owns the
# matching and delivery workflow, provider_manager owns only its own provider's
# operational surface, and employee_user owns only its own reservations and
# dependents. Cross-role attempts return ERR_UNAUTHORIZED; in-role but
# out-of-scope attempts return ERR_FORBIDDEN_SCOPE.
# =============================================================================
roles:

  - name: benefits_admin
    identity: "X-User-ID of a client-services administrator; not bound to any entity row"
    exclusive_operations:
      - "POST /backup-care/benefit-plans (the only role that may draft a plan, and the only holder of expected_employer_version)"
      - "PATCH /backup-care/benefit-plans/{id}"
      - "POST /backup-care/benefit-plans/{id}/activate"
      - "POST /backup-care/employees"
      - "PATCH /backup-care/employees/{id}"
      - "PATCH /backup-care/employers/{id}"
    shared_operations:
      - "POST /backup-care/employers (with network_admin)"
      - "POST /backup-care/employers/{id}/invoices, POST /backup-care/employer-invoices/{id}/payment (with network_admin)"
      - "GET /backup-care/employers/{id}/utilization-report (with network_admin)"
      - "POST /backup-care/reservations, POST /backup-care/reservations/{id}/cancel (with care_coordinator and employee_user)"
      - "POST /backup-care/employees/{id}/dependents, PATCH /backup-care/dependents/{id} (with employee_user)"
      - "POST /backup-care/incident-reports (with care_coordinator, employee_user and network_admin)"
      - "Every read endpoint on Employer, BenefitPlan, Employee, Dependent, Reservation, MatchOffer, EmployerInvoice, InvoiceLine, UsageLedgerEntry, Provider and IncidentReport"
    forbidden:
      - "Provider, Credential and CapacityBlock writes"
      - "POST /backup-care/providers/{id}/network-status, credential-review, POST /backup-care/credentials/{id}/revoke"
      - "POST /backup-care/reservations/{id}/match, reject-offer, confirm, check-in, complete, no-show"
      - "POST /backup-care/employer-invoices/{id}/issue and /void"
      - "POST /backup-care/incident-reports/{id}/review, substantiate, dismiss"
      - "POST /backup-care/_ops/run-daily-maintenance"

  - name: network_admin
    identity: "X-User-ID of a network operations administrator; not bound to any entity row"
    exclusive_operations:
      - "POST /backup-care/providers"
      - "PATCH /backup-care/providers/{id}"
      - "POST /backup-care/providers/{id}/credential-review"
      - "POST /backup-care/providers/{id}/network-status"
      - "POST /backup-care/credentials/{id}/revoke"
      - "POST /backup-care/employer-invoices/{id}/issue"
      - "POST /backup-care/employer-invoices/{id}/void"
      - "POST /backup-care/incident-reports/{id}/substantiate"
      - "POST /backup-care/incident-reports/{id}/dismiss"
      - "POST /backup-care/_ops/run-daily-maintenance"
    shared_operations:
      - "POST /backup-care/employers (with benefits_admin)"
      - "POST /backup-care/employers/{id}/invoices, POST /backup-care/employer-invoices/{id}/payment (with benefits_admin)"
      - "GET /backup-care/employers/{id}/utilization-report (with benefits_admin)"
      - "POST /backup-care/providers/{id}/credentials, POST /backup-care/providers/{id}/capacity-blocks (with provider_manager)"
      - "POST /backup-care/incident-reports/{id}/review (with care_coordinator)"
      - "POST /backup-care/incident-reports (with care_coordinator, benefits_admin and employee_user)"
      - "Every read endpoint except the employee-scoped GET /backup-care/employees/{id}/entitlement and GET /backup-care/employees/{id}/dependents"
    forbidden:
      - "BenefitPlan writes of any kind, including activation"
      - "POST /backup-care/employees and PATCH /backup-care/employees/{id}"
      - "PATCH /backup-care/employers/{id}"
      - "POST /backup-care/reservations and every reservation transition"
      - "Dependent writes"

  - name: care_coordinator
    identity: "X-User-ID of a care coordinator; not bound to any entity row"
    exclusive_operations:
      - "POST /backup-care/reservations/{id}/match"
      - "POST /backup-care/reservations/{id}/confirm"
    shared_operations:
      - "POST /backup-care/reservations (with benefits_admin and employee_user)"
      - "POST /backup-care/reservations/{id}/reject-offer (with employee_user)"
      - "POST /backup-care/reservations/{id}/cancel (with benefits_admin and employee_user)"
      - "POST /backup-care/reservations/{id}/check-in, complete, no-show (with provider_manager)"
      - "POST /backup-care/incident-reports and POST /backup-care/incident-reports/{id}/review (with network_admin)"
      - "Read endpoints on Employer, BenefitPlan, Employee, Dependent, Provider, Credential, CapacityBlock, Reservation, MatchOffer, UsageLedgerEntry and IncidentReport"
    forbidden:
      - "Every Employer, BenefitPlan, Employee, Dependent and Provider write"
      - "POST /backup-care/providers/{id}/credentials and /capacity-blocks"
      - "Every EmployerInvoice write, including creation, issue, payment and void"
      - "POST /backup-care/incident-reports/{id}/substantiate and /dismiss"
      - "POST /backup-care/_ops/run-daily-maintenance"

  - name: provider_manager
    identity: "X-User-ID equal to Provider.owner_user_id of the provider being acted on; every request is scoped to that provider and its reservations"
    exclusive_operations: []
    shared_operations:
      - "POST /backup-care/providers/{id}/credentials and POST /backup-care/providers/{id}/capacity-blocks (with network_admin), only for its own provider"
      - "POST /backup-care/reservations/{id}/check-in, complete, no-show (with care_coordinator), only for reservations whose matched_provider_id is its own provider"
      - "GET /backup-care/providers/{id}, GET /backup-care/providers/{id}/credentials, GET /backup-care/providers/{id}/capacity-blocks, GET /backup-care/credentials/{id}, GET /backup-care/capacity-blocks/{id}, GET /backup-care/reservations/{id} — all scoped to its own provider"
    forbidden:
      - "Any write or read targeting a provider whose owner_user_id differs — ERR_FORBIDDEN_SCOPE, not ERR_UNAUTHORIZED"
      - "POST /backup-care/providers, PATCH /backup-care/providers/{id}, credential-review, network-status, credential revoke"
      - "Every Employer, BenefitPlan, Employee, Dependent, EmployerInvoice and IncidentReport write"
      - "POST /backup-care/reservations, match, reject-offer, confirm, cancel"
      - "GET /backup-care/employees/{id}/entitlement and every employee-scoped read"

  - name: employee_user
    identity: "X-User-ID equal to Employee.user_id; every request is scoped to that Employee row and its dependents and reservations"
    exclusive_operations: []
    shared_operations:
      - "POST /backup-care/reservations, POST /backup-care/reservations/{id}/cancel (with care_coordinator and benefits_admin), only for its own employee record"
      - "POST /backup-care/reservations/{id}/reject-offer (with care_coordinator), only for its own reservations"
      - "POST /backup-care/employees/{id}/dependents and PATCH /backup-care/dependents/{id} (with benefits_admin), only for its own dependents"
      - "POST /backup-care/incident-reports (with care_coordinator, benefits_admin and network_admin)"
      - "GET /backup-care/employees/{id}, /entitlement, /dependents, /reservations, /ledger-entries, GET /backup-care/dependents/{id}, GET /backup-care/reservations/{id}, GET /backup-care/match-offers/{id}, GET /backup-care/benefit-plans/{id} — all scoped to its own employee record"
    forbidden:
      - "Any read or write targeting another employee's rows — ERR_FORBIDDEN_SCOPE, not ERR_UNAUTHORIZED"
      - "POST /backup-care/reservations/{id}/match and /confirm"
      - "POST /backup-care/reservations/{id}/check-in, complete, no-show"
      - "Every Employer, BenefitPlan, Employee, Provider, Credential, CapacityBlock and EmployerInvoice write"
      - "Every list endpoint that is not scoped by employee id (GET /backup-care/reservations, /backup-care/employees, /backup-care/providers, /backup-care/match-offers, /backup-care/incident-reports)"
      - "POST /backup-care/_ops/run-daily-maintenance"
