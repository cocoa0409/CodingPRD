# =============================================================================
# PRD Benchmark Scaffold — Owner's Representative & Program Management
# =============================================================================

scenario: |
  1134. Owner's Representative & Program Management (owner's rep firm): project
  charter, budget & schedule baseline for the owner, consultant/contractor
  procurement & contract negotiation, monthly owner report with cost-to-complete
  forecast, change order review & recommendation, risk register & contingency
  drawdown management, stakeholder/user group coordination, occupancy & move-in
  planning, closeout & lessons learned

domain_name: owners-rep-program-management
api_prefix: "/"

# =============================================================================
# Complexity Profile (§0.1–§0.4) — beyond-Expert calibration
# =============================================================================
complexity_profile:
  primary_archetype: quota_allocation          # finite contingency pool: reserve/commit/draw/release
  secondary_archetype: ledger_reconciliation   # dual EAC variants vs actuals/commitments
  complexity_layers:
    - optimistic_concurrency     # OCC on Program.version for charter/baseline approve-with-supersede
    - cascading_side_effects     # CO approval: Contract -> Drawdown/Pool -> Posture -> DRAFT reports
    - dual_variant_calculation   # cost-to-complete EAC; move-in readiness
    - rate_threshold_triggers    # risk escalation threshold, posture floors, engagement daily cap
  entity_topology: flat                        # peer collections, FK links in bodies
  state_machine_shape: cyclic                  # revision loops, negotiation rounds, reject-rework loops
  relationship_patterns:
    - one_to_many                # Program -> most entities
    - self_referential           # ChangeOrder.supersedes_id revision chains
    - cross_aggregate            # waves link plan x stakeholder group; drawdowns link risk/CO
  role_model: segregation_of_duties            # negotiator != executor; recommender != decider; submitter != verifier/accepter
  consistency_model: immediate

# =============================================================================
# §1.0 Response Envelope (FIXED — verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table (14 entities)
# common_fields: true expands to id (UUID, no prefix), created_at, updated_at
# (ISO 8601 UTC, 3 fractional digits), version (integer, starts 1, +1 per mutation)
# =============================================================================
entities:
  - name: Program
    parent: null
    common_fields: true
    fields:
      - { name: program_name, type: string, source: input, description: "Program name" }
      - { name: owner_organization, type: string, source: input, description: "Owner organization name" }
      - { name: status, type: enum, source: system, description: "CHARTERING | ACTIVE | CLOSING | CLOSED", constraints: "initial CHARTERING" }
      - { name: current_budget_cents, type: number, source: computed, description: "Current owner budget; set from approved Baseline.total_budget_cents; null until first baseline approval" }
      - { name: contingency_total_cents, type: number, source: computed, description: "Contingency pool total from approved Baseline.contingency_total_cents; 0 before any baseline approval" }
      - { name: contingency_reserved_cents, type: number, source: computed, description: "Sum of amount_cents over ContingencyDrawdown status RESERVED for this program" }
      - { name: contingency_committed_cents, type: number, source: computed, description: "Sum of amount_cents over ContingencyDrawdown status COMMITTED for this program" }
      - { name: contingency_drawn_cents, type: number, source: computed, description: "Sum of amount_cents over ContingencyDrawdown status DRAWN for this program" }
      - { name: contingency_available_cents, type: number, source: computed, description: "= contingency_total_cents - reserved - committed - drawn" }
      - { name: contingency_posture, type: enum, source: computed, description: "NORMAL | WATCH | CRITICAL; derived per calculations.contingency_posture_derivation" }
      - { name: approved_charter_id, type: string, source: computed, description: "id of currently APPROVED Charter; null if none" }
      - { name: approved_baseline_id, type: string, source: computed, description: "id of currently APPROVED Baseline; null if none" }
      - { name: baseline_version_no, type: integer, source: computed, description: "version_no of currently APPROVED Baseline; null if none" }
      - { name: target_finish_date, type: string, source: computed, description: "From approved Baseline.target_finish_date; null if none" }

  - name: Charter
    parent: null
    common_fields: true
    fields:
      - { name: program_id, type: string, source: input, description: "FK -> Program.id; owning program" }
      - { name: version_no, type: integer, source: system, description: "Per-program monotonically increasing charter version, starts at 1" }
      - { name: objectives, type: string, source: input, description: "Charter objectives" }
      - { name: scope_statement, type: string, source: input, description: "Charter scope statement" }
      - { name: status, type: enum, source: system, description: "DRAFT | SUBMITTED | APPROVED | RETURNED | SUPERSEDED", constraints: "initial DRAFT" }
      - { name: submitted_by_user_id, type: string, source: system, description: "X-User-ID that submitted; null until submitted" }
      - { name: decided_by_user_id, type: string, source: system, description: "X-User-ID of Owner decision; null until decided" }
      - { name: return_note, type: string, source: system, description: "Owner note recorded on RETURN decision; null otherwise" }

  - name: Baseline
    parent: null
    common_fields: true
    fields:
      - { name: program_id, type: string, source: input, description: "FK -> Program.id; owning program" }
      - { name: version_no, type: integer, source: system, description: "Per-program monotonically increasing baseline version, starts at 1" }
      - { name: total_budget_cents, type: number, source: input, description: "Total owner budget for the program (integer cents, > 0)" }
      - { name: contingency_total_cents, type: number, source: input, description: "Contingency pool carve-out (integer cents, >= 0, <= total_budget_cents)" }
      - { name: target_finish_date, type: string, source: input, description: "Baseline substantial completion date, YYYY-MM-DD" }
      - { name: lines, type: array, source: input, description: "Cost-code breakdown: array of { cost_code: string, amount_cents: integer > 0 }; amounts must sum to total_budget_cents; cost_code unique within baseline" }
      - { name: status, type: enum, source: system, description: "DRAFT | SUBMITTED | APPROVED | RETURNED | SUPERSEDED", constraints: "initial DRAFT" }
      - { name: submitted_by_user_id, type: string, source: system, description: "X-User-ID that submitted; null until submitted" }
      - { name: decided_by_user_id, type: string, source: system, description: "X-User-ID of Owner decision; null until decided" }
      - { name: return_note, type: string, source: system, description: "Owner note recorded on RETURN decision; null otherwise" }

  - name: Contract
    parent: null
    common_fields: true
    fields:
      - { name: program_id, type: string, source: input, description: "FK -> Program.id; owning program" }
      - { name: vendor_name, type: string, source: input, description: "Consultant/contractor firm name" }
      - { name: contract_type, type: enum, source: input, description: "CONSULTANT | CONTRACTOR" }
      - { name: solicitation_estimate_cents, type: number, source: input, description: "Owner's-rep pre-award estimate (integer cents, > 0)" }
      - { name: status, type: enum, source: system, description: "SOLICITED | UNDER_NEGOTIATION | COUNTERED | EXECUTED | COMPLETED", constraints: "initial SOLICITED" }
      - { name: negotiator_user_id, type: string, source: system, description: "X-User-ID captured at begin-negotiation" }
      - { name: negotiation_rounds, type: integer, source: system, description: "Count of counter transitions applied; starts 0" }
      - { name: latest_counter_amount_cents, type: number, source: system, description: "Most recent countered amount; null until first counter" }
      - { name: awarded_amount_cents, type: number, source: system, description: "Awarded amount captured at execute; null until EXECUTED" }
      - { name: current_commitment_cents, type: number, source: computed, description: "awarded_amount_cents + sum(APPROVED CO amounts) - sum(VOID CO amounts that were previously APPROVED); null until EXECUTED" }
      - { name: executed_by_user_id, type: string, source: system, description: "X-User-ID of OwnerRepExecutive who executed; null until EXECUTED" }

  - name: ChangeOrder
    parent: null
    common_fields: true
    fields:
      - { name: program_id, type: string, source: system, description: "FK -> Program.id; derived from contract at creation" }
      - { name: contract_id, type: string, source: input, description: "FK -> Contract.id; contract this change order modifies" }
      - { name: supersedes_id, type: string, source: input, description: "FK -> ChangeOrder.id; optional predecessor this CO supersedes; predecessor must be UNDER_REVIEW on same contract and is auto-REJECTED", default: null }
      - { name: superseded_by_id, type: string, source: system, description: "FK -> ChangeOrder.id; successor that superseded this CO; null unless superseded" }
      - { name: title, type: string, source: input, description: "Change order title" }
      - { name: reason, type: string, source: input, description: "Change justification" }
      - { name: amount_cents, type: number, source: input, description: "Change amount (integer cents, > 0)" }
      - { name: allocated_lines, type: array, source: computed, description: "Per-cost-code distribution of amount_cents per calculations.change_order_cost_code_distribution; computed at APPROVED; empty until then" }
      - { name: status, type: enum, source: system, description: "DRAFT | UNDER_REVIEW | RECOMMEND_APPROVAL | RECOMMEND_REJECTION | APPROVED | REJECTED | VOID", constraints: "initial DRAFT" }
      - { name: recommended_by_user_id, type: string, source: system, description: "X-User-ID of recommending OwnerRepPM; null until recommended" }
      - { name: decided_by_user_id, type: string, source: system, description: "X-User-ID of Owner decider; null until decided" }
      - { name: linked_drawdown_id, type: string, source: system, description: "FK -> ContingencyDrawdown.id; auto-created COMMITTED draw at approval; null until APPROVED" }
      - { name: revision_note, type: string, source: system, description: "Note from latest request-revision; null until revised" }
      - { name: void_reason, type: string, source: system, description: "Reason recorded at void; null until VOID" }

  - name: RiskEntry
    parent: null
    common_fields: true
    fields:
      - { name: program_id, type: string, source: input, description: "FK -> Program.id; owning program" }
      - { name: title, type: string, source: input, description: "Risk title" }
      - { name: category, type: enum, source: input, description: "SCHEDULE | COST | SCOPE | STAKEHOLDER | SITE" }
      - { name: probability_pct, type: integer, source: input, description: "Probability 1..100" }
      - { name: impact_cents, type: number, source: input, description: "Impact if realized (integer cents, >= 0)" }
      - { name: exposure_cents, type: number, source: computed, description: "= round_half_up(probability_pct * impact_cents / 100); recomputed on create and assess" }
      - { name: status, type: enum, source: system, description: "IDENTIFIED | ASSESSED | MITIGATING | MONITORING | ESCALATED | REALIZED | CLOSED", constraints: "initial IDENTIFIED" }
      - { name: mitigation_plan, type: string, source: system, description: "Recorded at mitigate; null until MITIGATING first reached" }
      - { name: realized_loss_cents, type: number, source: system, description: "Actual loss recorded at realize; null until REALIZED" }
      - { name: linked_drawdown_id, type: string, source: system, description: "FK -> ContingencyDrawdown.id; auto-created COMMITTED draw at realization; null until REALIZED" }

  - name: ContingencyDrawdown
    parent: null
    common_fields: true
    fields:
      - { name: program_id, type: string, source: input, description: "FK -> Program.id; owning program (system-derived when auto-created)" }
      - { name: risk_entry_id, type: string, source: system, description: "FK -> RiskEntry.id; set when source = RISK_REALIZATION; else null" }
      - { name: change_order_id, type: string, source: system, description: "FK -> ChangeOrder.id; set when source = CHANGE_ORDER; else null" }
      - { name: source, type: enum, source: system, description: "MANUAL_RESERVE | RISK_REALIZATION | CHANGE_ORDER" }
      - { name: purpose, type: string, source: input, description: "Purpose note (system-generated text when auto-created)" }
      - { name: amount_cents, type: number, source: input, description: "Draw amount (integer cents, > 0); system-set when auto-created" }
      - { name: status, type: enum, source: system, description: "RESERVED | COMMITTED | DRAWN | RELEASED", constraints: "initial RESERVED for MANUAL_RESERVE; auto-created draws start COMMITTED" }

  - name: OwnerReport
    parent: null
    common_fields: true
    fields:
      - { name: program_id, type: string, source: input, description: "FK -> Program.id; owning program" }
      - { name: period, type: string, source: input, description: "Reporting period YYYY-MM; unique per program across all non-superseded reports" }
      - { name: status, type: enum, source: system, description: "DRAFT | SUBMITTED | ACCEPTED | RETURNED", constraints: "initial DRAFT" }
      - { name: eac_commitment_based_cents, type: number, source: computed, description: "Estimate-at-completion, COMMITMENT_BASED variant (calculations.cost_to_complete_forecast)" }
      - { name: eac_trend_based_cents, type: number, source: computed, description: "Estimate-at-completion, TREND_BASED variant (calculations.cost_to_complete_forecast)" }
      - { name: budget_variance_commitment_cents, type: number, source: computed, description: "= current_budget_cents - eac_commitment_based_cents" }
      - { name: budget_variance_trend_cents, type: number, source: computed, description: "= current_budget_cents - eac_trend_based_cents" }
      - { name: contingency_posture_snapshot, type: enum, source: computed, description: "Program.contingency_posture at last (re)compute" }
      - { name: baseline_version_no_snapshot, type: integer, source: computed, description: "Program.baseline_version_no at last (re)compute; null if no approved baseline" }
      - { name: submitted_by_user_id, type: string, source: system, description: "X-User-ID that last submitted; null until first submit" }
      - { name: accepted_by_user_id, type: string, source: system, description: "X-User-ID of accepting Owner; null until ACCEPTED" }
      - { name: return_note, type: string, source: system, description: "Owner note at return; null until RETURNED" }
      - { name: accepted_at, type: datetime, source: system, description: "Acceptance timestamp; snapshot fields frozen from then on; null until ACCEPTED" }

  - name: StakeholderGroup
    parent: null
    common_fields: true
    fields:
      - { name: program_id, type: string, source: input, description: "FK -> Program.id; owning program" }
      - { name: group_name, type: string, source: input, description: "Stakeholder/user group name" }
      - { name: group_type, type: enum, source: input, description: "USER_GROUP | AUTHORITIES | COMMUNITY | OPERATIONS" }
      - { name: contact_email, type: string, source: input, description: "Primary contact email" }

  - name: EngagementItem
    parent: null
    common_fields: true
    fields:
      - { name: program_id, type: string, source: system, description: "FK -> Program.id; derived from stakeholder group at creation" }
      - { name: stakeholder_group_id, type: string, source: input, description: "FK -> StakeholderGroup.id; group being engaged" }
      - { name: title, type: string, source: input, description: "Engagement title" }
      - { name: scheduled_start, type: datetime, source: input, description: "Planned start (ISO 8601 UTC)" }
      - { name: scheduled_end, type: datetime, source: input, description: "Planned end (ISO 8601 UTC); must be > scheduled_start" }
      - { name: duration_minutes, type: integer, source: computed, description: "= (scheduled_end - scheduled_start) in whole minutes" }
      - { name: status, type: enum, source: system, description: "PROPOSED | SCHEDULED | HELD | CANCELLED", constraints: "initial PROPOSED" }

  - name: OccupancyPlan
    parent: null
    common_fields: true
    fields:
      - { name: program_id, type: string, source: input, description: "FK -> Program.id; owning program" }
      - { name: plan_name, type: string, source: input, description: "Occupancy/move-in plan name" }
      - { name: target_move_month, type: string, source: input, description: "Target move month YYYY-MM" }
      - { name: status, type: enum, source: system, description: "PLANNING | COORDINATING | READY | EXECUTING | COMPLETE", constraints: "initial PLANNING" }
      - { name: readiness_unweighted_pct, type: number, source: computed, description: "UNWEIGHTED variant of calculations.move_in_readiness; recomputed at mark-ready and on wave complete/cancel" }
      - { name: readiness_weighted_pct, type: number, source: computed, description: "WEIGHTED variant of calculations.move_in_readiness; recomputed at mark-ready and on wave complete/cancel" }

  - name: MoveInWave
    parent: null
    common_fields: true
    fields:
      - { name: program_id, type: string, source: system, description: "FK -> Program.id; derived from occupancy plan at creation" }
      - { name: occupancy_plan_id, type: string, source: input, description: "FK -> OccupancyPlan.id; plan this wave belongs to" }
      - { name: stakeholder_group_id, type: string, source: input, description: "FK -> StakeholderGroup.id; group moving in this wave" }
      - { name: wave_name, type: string, source: input, description: "Wave label" }
      - { name: dock_resource, type: enum, source: input, description: "DOCK_A | DOCK_B | DOCK_C; shared loading-dock resource the wave occupies" }
      - { name: move_start, type: datetime, source: input, description: "Dock occupation start (ISO 8601 UTC)" }
      - { name: move_end, type: datetime, source: input, description: "Dock occupation end (ISO 8601 UTC); must be > move_start" }
      - { name: criticality_weight, type: integer, source: input, description: "Weight for weighted readiness (>= 1)" }
      - { name: status, type: enum, source: system, description: "SCHEDULED | CONFIRMED | COMPLETE | CANCELLED", constraints: "initial SCHEDULED" }

  - name: CloseoutItem
    parent: null
    common_fields: true
    fields:
      - { name: program_id, type: string, source: input, description: "FK -> Program.id; owning program" }
      - { name: item_type, type: enum, source: input, description: "PUNCH_LIST | WARRANTY | AS_BUILT | FINAL_ACCOUNT | TRAINING" }
      - { name: title, type: string, source: input, description: "Closeout item title" }
      - { name: status, type: enum, source: system, description: "OPEN | SUBMITTED | VERIFIED", constraints: "initial OPEN" }
      - { name: submitted_by_user_id, type: string, source: system, description: "X-User-ID that submitted; null until first submit" }
      - { name: verified_by_user_id, type: string, source: system, description: "X-User-ID of verifying OwnerRepExecutive; null until VERIFIED" }
      - { name: rejection_note, type: string, source: system, description: "Note recorded at reject; null until rejected" }

  - name: LessonEntry
    parent: null
    common_fields: false   # append-only log: id + created_at only; no update/delete, no version
    fields:
      - { name: program_id, type: string, source: input, description: "FK -> Program.id; owning program" }
      - { name: category, type: enum, source: input, description: "SCHEDULE | COST | SCOPE | STAKEHOLDER | SITE | PROCUREMENT" }
      - { name: lesson_text, type: string, source: input, description: "Lesson learned narrative" }
      - { name: recommendation, type: string, source: input, description: "Recommendation for future programs" }

# =============================================================================
# §1.2 State Machine Table
# Note: every mutation of an entity increments that entity's `version` by 1 and
# refreshes `updated_at` (common_fields rule); side_effects below call out only
# business-relevant mutations and cross-entity effects.
# =============================================================================
state_machines:
  - entity: Program
    initial_state: CHARTERING
    terminal_states: [CLOSED]
    transitions:
      - from: CHARTERING
        to: ACTIVE
        trigger: "POST /programs/{id}/activate"
        actor: OwnerRepPM
        preconditions:
          - "An APPROVED Charter exists for the program (ERR_NO_APPROVED_CHARTER)"
          - "An APPROVED Baseline exists for the program (ERR_NO_APPROVED_BASELINE)"
        side_effects:
          - "Program.status -> ACTIVE"
      - from: ACTIVE
        to: CLOSING
        trigger: "POST /programs/{id}/begin-closing"
        actor: OwnerRepPM
        preconditions:
          - "Zero Contracts in {SOLICITED, UNDER_NEGOTIATION, COUNTERED, EXECUTED} (ERR_PROGRAM_HAS_OPEN_ITEMS)"
          - "Zero ChangeOrders in {DRAFT, UNDER_REVIEW, RECOMMEND_APPROVAL, RECOMMEND_REJECTION, APPROVED} (ERR_PROGRAM_HAS_OPEN_ITEMS)"
          - "Zero RiskEntries in {IDENTIFIED, ASSESSED, MITIGATING, MONITORING, ESCALATED} (ERR_PROGRAM_HAS_OPEN_ITEMS)"
          - "Zero ContingencyDrawdowns in {RESERVED, COMMITTED} (ERR_PROGRAM_HAS_OPEN_ITEMS)"
          - "Zero OwnerReports in {DRAFT, SUBMITTED, RETURNED} (ERR_PROGRAM_HAS_OPEN_ITEMS)"
        side_effects:
          - "Program.status -> CLOSING"
      - from: CLOSING
        to: CLOSED
        trigger: "POST /programs/{id}/close"
        actor: Owner
        preconditions:
          - "Every CloseoutItem of the program is VERIFIED (ERR_CLOSEOUT_INCOMPLETE)"
          - "At least one LessonEntry exists for the program (ERR_LESSON_ENTRIES_REQUIRED)"
        side_effects:
          - "Program.status -> CLOSED"
      - from: CLOSING
        to: ACTIVE
        trigger: "POST /programs/{id}/reopen"
        actor: OwnerRepPM
        preconditions: []
        side_effects:
          - "Program.status -> ACTIVE"

  - entity: Charter
    initial_state: DRAFT
    terminal_states: [SUPERSEDED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /charters/{id}/submit"
        actor: OwnerRepPM
        preconditions:
          - "Program.status in {CHARTERING, ACTIVE} (ERR_INVALID_TRANSITION)"
        side_effects:
          - "submitted_by_user_id := X-User-ID; increments Program.version by 1"
      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /charters/{id}/decide with decision=APPROVE"
        actor: Owner
        preconditions:
          - "expected_program_version == Program.version (ERR_STALE_PROGRAM_VERSION, 412)"
        side_effects:
          - "Prior APPROVED Charter of the same program (if any) -> SUPERSEDED"
          - "Program.approved_charter_id := this charter id"
          - "decided_by_user_id := X-User-ID; increments Program.version by 1"
      - from: SUBMITTED
        to: RETURNED
        trigger: "POST /charters/{id}/decide with decision=RETURN"
        actor: Owner
        preconditions:
          - "expected_program_version == Program.version (ERR_STALE_PROGRAM_VERSION, 412)"
        side_effects:
          - "return_note := payload return_note; decided_by_user_id := X-User-ID; increments Program.version by 1"
      - from: RETURNED
        to: DRAFT
        trigger: "POST /charters/{id}/revise"
        actor: OwnerRepPM
        preconditions: []
        side_effects:
          - "objectives / scope_statement replaced when present in payload; increments Program.version by 1"
      - from: APPROVED
        to: SUPERSEDED
        trigger: "system (automatic when another Charter of the same program is APPROVED)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: Baseline
    initial_state: DRAFT
    terminal_states: [SUPERSEDED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /baselines/{id}/submit"
        actor: OwnerRepPM
        preconditions:
          - "Program.status in {CHARTERING, ACTIVE} (ERR_INVALID_TRANSITION)"
        side_effects:
          - "submitted_by_user_id := X-User-ID; increments Program.version by 1"
      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /baselines/{id}/decide with decision=APPROVE"
        actor: Owner
        preconditions:
          - "expected_program_version == Program.version (ERR_STALE_PROGRAM_VERSION, 412)"
          - "contingency_total_cents >= contingency_reserved_cents + contingency_committed_cents + contingency_drawn_cents (ERR_BASELINE_UNDERCUTS_COMMITMENTS, 402)"
        side_effects:
          - "Prior APPROVED Baseline of the same program (if any) -> SUPERSEDED"
          - "Program.approved_baseline_id := this baseline id; Program.baseline_version_no := this version_no"
          - "Program.current_budget_cents := total_budget_cents; Program.contingency_total_cents := contingency_total_cents; Program.target_finish_date := target_finish_date"
          - "Recompute Program.contingency_available_cents and contingency_posture (calculations.contingency_pool_recompute + contingency_posture_derivation)"
          - "Recompute forecast fields of every OwnerReport in status DRAFT for this program"
          - "decided_by_user_id := X-User-ID; increments Program.version by 1"
      - from: SUBMITTED
        to: RETURNED
        trigger: "POST /baselines/{id}/decide with decision=RETURN"
        actor: Owner
        preconditions:
          - "expected_program_version == Program.version (ERR_STALE_PROGRAM_VERSION, 412)"
        side_effects:
          - "return_note := payload return_note; decided_by_user_id := X-User-ID; increments Program.version by 1"
      - from: RETURNED
        to: DRAFT
        trigger: "POST /baselines/{id}/revise"
        actor: OwnerRepPM
        preconditions: []
        side_effects:
          - "total_budget_cents / contingency_total_cents / target_finish_date / lines replaced when present in payload; increments Program.version by 1"
      - from: APPROVED
        to: SUPERSEDED
        trigger: "system (automatic when another Baseline of the same program is APPROVED)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: Contract
    initial_state: SOLICITED
    terminal_states: [COMPLETED]
    transitions:
      - from: SOLICITED
        to: UNDER_NEGOTIATION
        trigger: "POST /contracts/{id}/begin-negotiation"
        actor: OwnerRepPM
        preconditions: []
        side_effects:
          - "negotiator_user_id := X-User-ID"
      - from: UNDER_NEGOTIATION
        to: COUNTERED
        trigger: "POST /contracts/{id}/counter"
        actor: OwnerRepPM
        preconditions: []
        side_effects:
          - "latest_counter_amount_cents := payload counter_amount_cents; negotiation_rounds += 1"
      - from: COUNTERED
        to: UNDER_NEGOTIATION
        trigger: "POST /contracts/{id}/counter"
        actor: OwnerRepPM
        preconditions: []
        side_effects:
          - "latest_counter_amount_cents := payload counter_amount_cents; negotiation_rounds += 1"
      - from: UNDER_NEGOTIATION
        to: EXECUTED
        trigger: "POST /contracts/{id}/execute"
        actor: OwnerRepExecutive
        preconditions:
          - "X-User-ID != negotiator_user_id (ERR_SEGREGATION_OF_DUTIES, 403)"
          - "awarded_amount_cents <= Program.current_budget_cents - sum(current_commitment_cents over EXECUTED contracts of the program) (ERR_AWARD_EXCEEDS_BUDGET, 402)"
        side_effects:
          - "awarded_amount_cents := payload awarded_amount_cents; current_commitment_cents := awarded_amount_cents"
          - "executed_by_user_id := X-User-ID"
      - from: COUNTERED
        to: EXECUTED
        trigger: "POST /contracts/{id}/execute"
        actor: OwnerRepExecutive
        preconditions:
          - "X-User-ID != negotiator_user_id (ERR_SEGREGATION_OF_DUTIES, 403)"
          - "awarded_amount_cents <= Program.current_budget_cents - sum(current_commitment_cents over EXECUTED contracts of the program) (ERR_AWARD_EXCEEDS_BUDGET, 402)"
        side_effects:
          - "awarded_amount_cents := payload awarded_amount_cents; current_commitment_cents := awarded_amount_cents"
          - "executed_by_user_id := X-User-ID"
      - from: EXECUTED
        to: COMPLETED
        trigger: "POST /contracts/{id}/complete"
        actor: OwnerRepPM
        preconditions:
          - "Zero ChangeOrders of this contract in {DRAFT, UNDER_REVIEW, RECOMMEND_APPROVAL, RECOMMEND_REJECTION, APPROVED} (ERR_OPEN_CHANGE_ORDERS_EXIST)"
        side_effects: []

  - entity: ChangeOrder
    initial_state: DRAFT
    terminal_states: [REJECTED, VOID]
    transitions:
      - from: DRAFT
        to: UNDER_REVIEW
        trigger: "POST /change-orders/{id}/submit"
        actor: OwnerRepPM
        preconditions:
          - "Contract.status == EXECUTED (ERR_CONTRACT_NOT_EXECUTED)"
          - "Program.contingency_posture != CRITICAL (ERR_CONTINGENCY_POSTURE_CRITICAL)"
        side_effects: []
      - from: UNDER_REVIEW
        to: DRAFT
        trigger: "POST /change-orders/{id}/request-revision"
        actor: OwnerRepPM
        preconditions: []
        side_effects:
          - "revision_note := payload revision_note"
      - from: UNDER_REVIEW
        to: RECOMMEND_APPROVAL
        trigger: "POST /change-orders/{id}/recommend with recommendation=APPROVE"
        actor: OwnerRepPM
        preconditions: []
        side_effects:
          - "recommended_by_user_id := X-User-ID"
      - from: UNDER_REVIEW
        to: RECOMMEND_REJECTION
        trigger: "POST /change-orders/{id}/recommend with recommendation=REJECT"
        actor: OwnerRepPM
        preconditions: []
        side_effects:
          - "recommended_by_user_id := X-User-ID"
      - from: RECOMMEND_APPROVAL
        to: APPROVED
        trigger: "POST /change-orders/{id}/decide with decision=APPROVE"
        actor: Owner
        preconditions:
          - "X-User-ID != recommended_by_user_id (ERR_SEGREGATION_OF_DUTIES, 403)"
          - "amount_cents <= Program.contingency_available_cents (ERR_CONTINGENCY_EXCEEDED, 402)"
        side_effects:
          - "Cascade link 1: Contract.current_commitment_cents += amount_cents"
          - "Cascade link 2 (triggered by link 1): auto-create ContingencyDrawdown(source=CHANGE_ORDER, change_order_id=this id, amount_cents=this amount_cents, status=COMMITTED); linked_drawdown_id := new drawdown id"
          - "Cascade link 3 (triggered by link 2's COMMITTED draw): Program.contingency_committed_cents += amount_cents; contingency_available_cents -= amount_cents; recompute Program.contingency_posture"
          - "Cascade link 4 (triggered by link 3's pool/posture change): recompute forecast fields of every OwnerReport in status DRAFT for this program (RETURNED reports are NOT refreshed)"
          - "allocated_lines := calculations.change_order_cost_code_distribution(amount_cents) over the approved baseline's lines"
          - "decided_by_user_id := X-User-ID"
      - from: RECOMMEND_REJECTION
        to: APPROVED
        trigger: "POST /change-orders/{id}/decide with decision=APPROVE (owner override of recommendation)"
        actor: Owner
        preconditions:
          - "X-User-ID != recommended_by_user_id (ERR_SEGREGATION_OF_DUTIES, 403)"
          - "amount_cents <= Program.contingency_available_cents (ERR_CONTINGENCY_EXCEEDED, 402)"
        side_effects:
          - "Same 4-link approval cascade as RECOMMEND_APPROVAL -> APPROVED"
          - "decided_by_user_id := X-User-ID"
      - from: RECOMMEND_APPROVAL
        to: REJECTED
        trigger: "POST /change-orders/{id}/decide with decision=REJECT"
        actor: Owner
        preconditions:
          - "X-User-ID != recommended_by_user_id (ERR_SEGREGATION_OF_DUTIES, 403)"
        side_effects:
          - "decided_by_user_id := X-User-ID"
      - from: RECOMMEND_REJECTION
        to: REJECTED
        trigger: "POST /change-orders/{id}/decide with decision=REJECT"
        actor: Owner
        preconditions:
          - "X-User-ID != recommended_by_user_id (ERR_SEGREGATION_OF_DUTIES, 403)"
        side_effects:
          - "decided_by_user_id := X-User-ID"
      - from: APPROVED
        to: VOID
        trigger: "POST /change-orders/{id}/void"
        actor: Owner
        preconditions: []
        side_effects:
          - "Compensation link 1: Contract.current_commitment_cents -= amount_cents"
          - "Compensation link 2 (triggered by link 1): linked ContingencyDrawdown -> RELEASED"
          - "Compensation link 3 (triggered by link 2's release): Program.contingency_committed_cents -= amount_cents; contingency_available_cents += amount_cents; recompute Program.contingency_posture"
          - "Compensation link 4 (triggered by link 3): recompute forecast fields of every OwnerReport in status DRAFT for this program"
          - "void_reason := payload void_reason"
      - from: UNDER_REVIEW
        to: REJECTED
        trigger: "system (automatic when a successor ChangeOrder with supersedes_id = this id is created)"
        actor: system
        preconditions: []
        side_effects:
          - "superseded_by_id := successor ChangeOrder id"

  - entity: RiskEntry
    initial_state: IDENTIFIED
    terminal_states: [REALIZED, CLOSED]
    transitions:
      - from: IDENTIFIED
        to: ASSESSED
        trigger: "POST /risk-entries/{id}/assess"
        actor: OwnerRepPM
        preconditions:
          - "recomputed exposure_cents < ESCALATION_THRESHOLD_CENTS (else lands ESCALATED)"
        side_effects:
          - "probability_pct / impact_cents := payload values; exposure_cents recomputed"
      - from: IDENTIFIED
        to: ESCALATED
        trigger: "POST /risk-entries/{id}/assess"
        actor: OwnerRepPM
        preconditions:
          - "recomputed exposure_cents >= ESCALATION_THRESHOLD_CENTS"
        side_effects:
          - "probability_pct / impact_cents := payload values; exposure_cents recomputed"
      - from: ASSESSED
        to: ASSESSED
        trigger: "POST /risk-entries/{id}/assess (re-assessment below threshold; self-loop recompute)"
        actor: OwnerRepPM
        preconditions:
          - "recomputed exposure_cents < ESCALATION_THRESHOLD_CENTS"
        side_effects:
          - "probability_pct / impact_cents := payload values; exposure_cents recomputed"
      - from: ASSESSED
        to: ESCALATED
        trigger: "POST /risk-entries/{id}/assess (re-assessment breaches threshold)"
        actor: OwnerRepPM
        preconditions:
          - "recomputed exposure_cents >= ESCALATION_THRESHOLD_CENTS"
        side_effects:
          - "probability_pct / impact_cents := payload values; exposure_cents recomputed"
      - from: ASSESSED
        to: MITIGATING
        trigger: "POST /risk-entries/{id}/mitigate"
        actor: OwnerRepPM
        preconditions: []
        side_effects:
          - "mitigation_plan := payload mitigation_plan"
      - from: ESCALATED
        to: MITIGATING
        trigger: "POST /risk-entries/{id}/mitigate"
        actor: OwnerRepPM
        preconditions: []
        side_effects:
          - "mitigation_plan := payload mitigation_plan"
      - from: MITIGATING
        to: MONITORING
        trigger: "POST /risk-entries/{id}/monitor"
        actor: OwnerRepPM
        preconditions: []
        side_effects: []
      - from: MONITORING
        to: ESCALATED
        trigger: "POST /risk-entries/{id}/assess (re-assessment breaches threshold)"
        actor: OwnerRepPM
        preconditions:
          - "recomputed exposure_cents >= ESCALATION_THRESHOLD_CENTS (else stays MONITORING)"
        side_effects:
          - "probability_pct / impact_cents := payload values; exposure_cents recomputed"
      - from: MONITORING
        to: MONITORING
        trigger: "POST /risk-entries/{id}/assess (re-assessment below threshold; self-loop recompute)"
        actor: OwnerRepPM
        preconditions:
          - "recomputed exposure_cents < ESCALATION_THRESHOLD_CENTS"
        side_effects:
          - "probability_pct / impact_cents := payload values; exposure_cents recomputed"
      - from: ESCALATED
        to: MONITORING
        trigger: "POST /risk-entries/{id}/assess (de-escalation: re-assessment drops below threshold)"
        actor: OwnerRepPM
        preconditions:
          - "recomputed exposure_cents < ESCALATION_THRESHOLD_CENTS"
        side_effects:
          - "probability_pct / impact_cents := payload values; exposure_cents recomputed"
      - from: ESCALATED
        to: ESCALATED
        trigger: "POST /risk-entries/{id}/assess (still at/above threshold; self-loop recompute)"
        actor: OwnerRepPM
        preconditions:
          - "recomputed exposure_cents >= ESCALATION_THRESHOLD_CENTS"
        side_effects:
          - "probability_pct / impact_cents := payload values; exposure_cents recomputed"
      - from: ESCALATED
        to: REALIZED
        trigger: "POST /risk-entries/{id}/realize"
        actor: OwnerRepPM
        preconditions:
          - "actual_loss_cents <= Program.contingency_available_cents (ERR_CONTINGENCY_EXCEEDED, 402)"
        side_effects:
          - "Cascade link 1: realized_loss_cents := payload actual_loss_cents; auto-create ContingencyDrawdown(source=RISK_REALIZATION, risk_entry_id=this id, amount_cents=actual_loss_cents, status=COMMITTED); linked_drawdown_id := new drawdown id"
          - "Cascade link 2 (triggered by link 1's COMMITTED draw): Program.contingency_committed_cents += actual_loss_cents; contingency_available_cents -= actual_loss_cents; recompute Program.contingency_posture"
          - "Cascade link 3 (triggered by link 2's pool/posture change): recompute forecast fields of every OwnerReport in status DRAFT for this program (RETURNED reports are NOT refreshed)"
      - from: MONITORING
        to: REALIZED
        trigger: "POST /risk-entries/{id}/realize"
        actor: OwnerRepPM
        preconditions:
          - "actual_loss_cents <= Program.contingency_available_cents (ERR_CONTINGENCY_EXCEEDED, 402)"
        side_effects:
          - "Same 3-link realization cascade as ESCALATED -> REALIZED"
      - from: ASSESSED
        to: CLOSED
        trigger: "POST /risk-entries/{id}/close"
        actor: OwnerRepPM
        preconditions: []
        side_effects: []
      - from: MITIGATING
        to: CLOSED
        trigger: "POST /risk-entries/{id}/close"
        actor: OwnerRepPM
        preconditions: []
        side_effects: []
      - from: MONITORING
        to: CLOSED
        trigger: "POST /risk-entries/{id}/close"
        actor: OwnerRepPM
        preconditions: []
        side_effects: []

  - entity: ContingencyDrawdown
    initial_state: RESERVED
    terminal_states: [DRAWN, RELEASED]
    transitions:
      - from: RESERVED
        to: COMMITTED
        trigger: "POST /contingency-drawdowns/{id}/commit"
        actor: OwnerRepPM
        preconditions: []
        side_effects:
          - "Program.contingency_reserved_cents -= amount_cents; contingency_committed_cents += amount_cents; recompute Program.contingency_posture; refresh DRAFT OwnerReports"
      - from: COMMITTED
        to: DRAWN
        trigger: "POST /contingency-drawdowns/{id}/draw"
        actor: OwnerRepPM
        preconditions: []
        side_effects:
          - "Program.contingency_committed_cents -= amount_cents; contingency_drawn_cents += amount_cents; recompute Program.contingency_posture; refresh DRAFT OwnerReports"
      - from: RESERVED
        to: RELEASED
        trigger: "POST /contingency-drawdowns/{id}/release"
        actor: OwnerRepPM
        preconditions: []
        side_effects:
          - "Program.contingency_reserved_cents -= amount_cents; contingency_available_cents += amount_cents; recompute Program.contingency_posture; refresh DRAFT OwnerReports"
      - from: COMMITTED
        to: RELEASED
        trigger: "POST /contingency-drawdowns/{id}/release OR system (ChangeOrder void compensation)"
        actor: OwnerRepPM
        preconditions: []
        side_effects:
          - "Program.contingency_committed_cents -= amount_cents; contingency_available_cents += amount_cents; recompute Program.contingency_posture; refresh DRAFT OwnerReports"
    note: "System-created drawdowns (source RISK_REALIZATION or CHANGE_ORDER) are initialized directly in COMMITTED state at creation."

  - entity: OwnerReport
    initial_state: DRAFT
    terminal_states: [ACCEPTED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /owner-reports/{id}/submit"
        actor: OwnerRepPM
        preconditions: []
        side_effects:
          - "Recompute all forecast fields from current program state, then freeze them while SUBMITTED; submitted_by_user_id := X-User-ID"
      - from: RETURNED
        to: SUBMITTED
        trigger: "POST /owner-reports/{id}/submit (resubmission)"
        actor: OwnerRepPM
        preconditions: []
        side_effects:
          - "Recompute all forecast fields from current program state, then freeze; submitted_by_user_id := X-User-ID"
      - from: SUBMITTED
        to: ACCEPTED
        trigger: "POST /owner-reports/{id}/accept"
        actor: Owner
        preconditions:
          - "X-User-ID != submitted_by_user_id (ERR_SEGREGATION_OF_DUTIES, 403)"
        side_effects:
          - "accepted_by_user_id := X-User-ID; accepted_at := now; snapshot permanently frozen"
      - from: SUBMITTED
        to: RETURNED
        trigger: "POST /owner-reports/{id}/return"
        actor: Owner
        preconditions: []
        side_effects:
          - "return_note := payload return_note"

  - entity: EngagementItem
    initial_state: PROPOSED
    terminal_states: [HELD, CANCELLED]
    transitions:
