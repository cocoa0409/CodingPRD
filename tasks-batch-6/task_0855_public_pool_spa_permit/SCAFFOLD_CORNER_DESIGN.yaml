  - section: calculations
    instances:

      - name: annual_permit_fee_full_term_with_feature_surcharges
        claim_type: Correct Result
        grounds: [calculations.permit_fee_assessment, entities.Facility.fields.features]
        distinguishing_aspect: "A CLASS_A_COMPETITION venue of 100000 gallons with SLIDE and DIVING_BOARD assesses 45000 + 20000 + 12500 = 77500 cents under the FULL_TERM variant, with no proration and no penalty."
