            - { call: "POST /household-payroll/registrations/${reg_id}/submit", as: PayrollAdmin }
            - { call: "POST /household-payroll/registrations/${reg_id}/activate", payload: { agency_account_number: "NH-001" }, as: PayrollAdmin }
            - { call: "POST /household-payroll/employers/${e_id}/workers", payload: { full_name: "Page P", work_state_code: "AA", hire_date: "2026-01-05", work_arrangement: "LIVE_OUT" }, as: HouseholdClient, as_user_id: "${e_id}", captures: { w_id: "$.data.id", w_v: "$.data.version" } }
            - { call: "POST /household-payroll/workers/${w_id}/classify", payload: { classification_answers: [ { question_key: "controls_schedule", answer: "EMPLOYER" }, { question_key: "supplies_own_tools", answer: "EMPLOYER" }, { question_key: "hires_own_substitutes", answer: "NOT_ALLOWED" }, { question_key: "paid_by", answer: "HOURLY" } ] }, as: HouseholdClient, as_user_id: "${e_id}", captures: { w_v2: "$.data.version" } }
            - { call: "POST /household-payroll/workers/${w_id}/agreements", payload: { hourly_rate_cents: 3000, pay_method: "HOURLY", effective_from: "2026-01-01", expected_worker_version: "${w_v2}" }, as: HouseholdClient, as_user_id: "${e_id}" }
            - { call: "POST /household-payroll/workers/${w_id}/activate", payload: { new_hire_report_date: "2026-01-06" }, as: HouseholdClient, as_user_id: "${e_id}" }
            - { call: "POST /household-payroll/workers/${w_id}/timesheets", payload: { period_start: "2026-01-05", period_end: "2026-01-12", entries: [ { work_date: "2026-01-05", worked_minutes: 60 } ] }, as: Worker, as_user_id: "${w_id}" }
            - { call: "POST /household-payroll/workers/${w_id}/timesheets", payload: { period_start: "2026-01-12", period_end: "2026-01-19", entries: [ { work_date: "2026-01-12", worked_minutes: 60 } ] }, as: Worker, as_user_id: "${w_id}" }
          trigger:
            - { call: "GET /household-payroll/workers/${w_id}/timesheets", payload: { limit: 1, offset: 0 }, as: PayrollAdmin }
            - { call: "GET /household-payroll/workers/${w_id}/timesheets", payload: { limit: 1, offset: 1 }, as: PayrollAdmin }
          assert:
            - "page 1: data length 1, total_count == 2, has_more == true, response_type == array, meta.api_request_id present"
            - "page 2: data length 1, has_more == false; the two pages return different timesheet ids"
      - name: worker_list_status_filter
        claim_type: listing
        grounds: ["endpoints.GET_/household-payroll/employers/{id}/workers"]
        distinguishing_aspect: "The status filter includes only matching rows: after terminating one of two workers, status=ACTIVE yields total_count 1 and status=TERMINATED yields the terminated worker's id."
        test_recipe:
          setup: ["Employer AA ACTIVE; W1 ACTIVE (agreement+activate), W2 CLASSIFIED only, then W1 terminated"]
          setup_api_calls:
            - { call: "POST /household-payroll/state-rule-packs", payload: { state_code: "AA", min_pay_frequency: "WEEKLY", weekly_ot_threshold_minutes: 2400, daily_ot_threshold_minutes: 0, daily_dt_threshold_minutes: 0, live_in_weekly_ot_eligible: false, live_in_daily_ot_eligible: false, min_wage_cents: 1000, sit_rate: 0.05, suta_rate: 0.02, suta_wage_base_cents: 10000000, workers_comp_required: false, new_hire_report_days: 20, pay_stub_required: true }, as: PayrollAdmin }
            - { call: "POST /household-payroll/employers", payload: { legal_name: "Fam Fil2", primary_state_code: "AA", fein: "123456789", pay_frequency: "WEEKLY" }, as: PayrollAdmin, captures: { e_id: "$.data.id", e_v: "$.data.version" } }
            - { call: "POST /household-payroll/employers/${e_id}/registrations", payload: { state_code: "AA", agency: "NEW_HIRE_DIRECTORY", expected_employer_version: "${e_v}" }, as: PayrollAdmin, captures: { reg_id: "$.data.id" } }
            - { call: "POST /household-payroll/registrations/${reg_id}/submit", as: PayrollAdmin }
