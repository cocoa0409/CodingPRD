    path: "/uscis/_clock/set_current_utc"
    description: "Test-driving: set ClockState.current_utc"
    roles: [FieldOfficeAdmin]
    code: 200
    input: [to_iso8601]
    output: ClockState
    side_effects: ["Mutate ClockState"]

  - method: POST
    path: "/uscis/_ops/sweep-rfe-deadlines"
    description: "Test-driving: ops sweep that expires any RFE whose deadline is breached and abandons its parent case"
    roles: [FieldOfficeAdmin]
    code: 200
    input: []
    output: "{ expired_rfe_count: integer, abandoned_case_count: integer }"
    side_effects: ["See §1.2 RFE_PENDING->ABANDONED cascade"]

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "Missing X-User-Role or X-User-ID on a protected endpoint"
  - id: ERR_INVALID_ROLE
    http: 401
    condition: "X-User-Role is not a recognized role from §1.7"
  - id: ERR_FORBIDDEN
    http: 403
    condition: "Authenticated role is not in the endpoint's authorized roles per §1.7"
  - id: ERR_OWNERSHIP_VIOLATION
    http: 403
    condition: "Applicant or Attorney is not the owner of the case being mutated"
  - id: ERR_NOT_FOUND
    http: 404
    condition: "A path-templated resource id does not resolve"
  - id: ERR_REFERENCED_NOT_FOUND
    http: 404
    condition: "A body-supplied FK does not resolve to an existing resource"
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "Required body field missing or has wrong type/enum value"
  - id: ERR_INVALID_STATE
    http: 409
    condition: "Target entity not in the from-state required by the requested transition"
  - id: ERR_ALREADY_TERMINAL
    http: 409
    condition: "Target entity already in a terminal state and cannot transition further"
  - id: ERR_CASE_TYPE_NOT_APPLICABLE
    http: 422
    condition: "Operation does not apply to this case_type (e.g., biometrics on I-130, interview on non-I-485)"
  - id: ERR_RFE_CAP_EXCEEDED
    http: 422
    condition: "Case.rfe_round_count would exceed MAX_RFE_ROUNDS (=2)"
  - id: ERR_VISA_RETROGRESSED
    http: 422
    condition: "Visa under FINAL_ACTION chart is not CURRENT at the relevant bulletin month for an I-485 interview or approval"
  - id: ERR_APPT_TOO_SOON
    http: 422
    condition: "Appointment scheduled_at is less than ClockState.current_utc + 7 days"
  - id: ERR_APPT_OVERLAP_SAME_CASE
    http: 409
    condition: "A new appointment of the same kind for the same case overlaps an existing SCHEDULED interval [start, start+60min)"
  - id: ERR_ASC_SLOT_TAKEN
    http: 409
    condition: "An ASC location already has an active BiometricsAppointment at the exact scheduled_at instant"
  - id: ERR_RFE_DEADLINE_PASSED
    http: 422
    condition: "ClockState.current_utc >= RFE.response_deadline at submission time"
  - id: ERR_STALE_VERSION
    http: 412
    condition: "expected_case_version does not equal the current Case.version"

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: Anonymous
    description: "Unauthenticated caller; permitted only for self-registration of applicants and attorneys"
    identity: "opaque"
    exclusive_operations:
      - "POST /uscis/applicants/register"
      - "POST /uscis/attorneys/register"
    shared_operations: []

  - name: Applicant
    description: "An alien acting on their own case"
    identity: "entity_backed:Applicant"
    exclusive_operations:
      - "POST /uscis/cases/{id}/file (own case)"
      - "POST /uscis/rfes/{id}/respond (own case's RFE)"
    shared_operations:
      - "POST /uscis/cases"
      - "GET /uscis/applicants/{id}"
      - "GET /uscis/attorneys/{id}"
      - "GET /uscis/cases/{id} (own case)"
      - "GET /uscis/cases/{id}/biometrics (own case)"
      - "GET /uscis/cases/{id}/rfes (own case)"
      - "GET /uscis/cases/{id}/interviews (own case)"
