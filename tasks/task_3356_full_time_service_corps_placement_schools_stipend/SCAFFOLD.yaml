    roles: [SiteDirector, ProgramManager]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: "CorpsMemberApplication[]"
    side_effects: []

  - method: GET
    path: "/corps/sites/{id}/members"
    description: "List CorpsMembers of a Site"
    roles: [SiteDirector, ProgramManager, StipendAdministrator]
    code: 200
    input: ["service_status?", "stipend_status?", "limit?", "offset?"]
    output: "CorpsMember[]"
    side_effects: []

  - method: GET
    path: "/corps/schools/{id}/teams"
    description: "List Teams of a School"
    roles: [SiteDirector, ProgramManager, SchoolLiaison]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: "Team[]"
    side_effects: []

  - method: GET
    path: "/corps/teams/{id}/assignments"
    description: "List TeamAssignments of a Team"
    roles: [SiteDirector, ProgramManager]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: "TeamAssignment[]"
    side_effects: []

  - method: GET
    path: "/corps/members/{id}/assignments"
    description: "List TeamAssignments of a CorpsMember"
    roles: [SiteDirector, ProgramManager, CorpsMember]
