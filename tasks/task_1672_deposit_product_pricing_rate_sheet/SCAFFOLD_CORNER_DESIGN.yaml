        distinguishing_aspect: "List endpoints honor limit/offset with total_count and has_more: 3 products with limit 2 -> 2 rows, total_count 3, has_more true; offset 2 -> 1 row, has_more false. Envelope carries meta.api_request_id and response_type array."
        test_recipe:
          setup: ["three products P1, P2, P3 created"]
          setup_api_calls:
            - { call: "POST /deposit-products", payload: { product_code: "P1", product_class: "SAVINGS", term_months: 0, tier_application: "WHOLE_BALANCE", rate_cap_bp: 500, allows_promos: true, allows_exceptions: true }, as: OperationsAdmin }
