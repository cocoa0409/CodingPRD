        distinguishing_aspect: "Interval semantics B (different resource entity EventProfile, different geometry) — landfall_at must lie INSIDE the closed [event_start_at, event_end_at] window; a landfall after event_end_at is outside and the approval is barred with ERR_LANDFALL_OUTSIDE_WINDOW (a containment test, not the single-instant cutoff of #1)."
