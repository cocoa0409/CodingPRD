  - name: appointment_parallel_dimension_independence
    claim_type: parallel
    grounds:
    - state_machines.Appointment.schedule_status
    - state_machines.Appointment.clearance_status
    excluded_because:
      difficulty_instance: non_linear_state_machine / appointment_clearance_dimension_blocks_and_reclears_independently
      rationale: That instance holds schedule_status at CONFIRMED across a full CLEARED -> BLOCKED -> CLEARED clearance cycle and asserts the check-in refusal in the middle, which is exactly the parallel-dimension independence claim.
  - name: license_cyclic_renewal_and_revision_loops
    claim_type: cyclic
    grounds:
    - state_machines.TherapistLicense
    excluded_because:
      difficulty_instance: non_linear_state_machine / license_reject_resubmit_verify_cycle_swaps_sod_counterparty
      rationale: That instance walks PENDING_REVIEW -> REJECTED -> PENDING_REVIEW -> VERIFIED and asserts the segregation-of-duties inversion across the loop; VERIFIED -> EXPIRED is covered by transitive_cascade / compliance_sweep_license_expiry_five_hop_cascade.
