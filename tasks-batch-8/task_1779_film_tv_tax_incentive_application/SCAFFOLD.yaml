    roles: [FilmOfficeReviewer]
    code: 200
    input: [decision, "rejection_reason?"]
    output: Vendor
    side_effects: ["residency_status transition per Vendor machine", "on VERIFIED: verified_at = now", "on VERIFIED -> REJECTED: cascade disqualifies QUALIFIED entries, recomputes applications, refreshes certificate exposure, auto-opens/updates SPEND_SHORTFALL clawback"]

  # --- SpendEntry ---
  - method: POST
    path: "/api/spend-entries"
    description: "Record a spend entry (PENDING_REVIEW); optional amendment supersedes its target"
    roles: [Producer]
    code: 201
    input: [application_id, vendor_id, external_invoice_ref, category, spend_date, amount_cents, "is_resident_labor?", "amends_entry_id?"]
    output: SpendEntry
    side_effects: ["application.status must be APPROVED or CREDIT_ISSUED (ERR_INVALID_STATE_TRANSITION)", "vendor must belong to the application's production (ERR_VENDOR_PRODUCTION_MISMATCH)", "external_invoice_ref unique per production across all applications (ERR_DUPLICATE_SPEND_INVOICE)", "when amends_entry_id present: target must belong to the same application and be in {PENDING_REVIEW, QUALIFIED, DISQUALIFIED} (ERR_AMENDMENT_TARGET_MISMATCH); target -> SUPERSEDED with totals recompute cascade"]
  - method: GET
    path: "/api/spend-entries"
    description: "List spend entries (filtered; reverse-reachability for application_id, vendor_id, amends_entry_id)"
    roles: [FilmOfficeAdmin, FilmOfficeReviewer, Producer, CPAAuditor, CreditBuyer]
    code: 200
    input: ["application_id?", "vendor_id?", "amends_entry_id?", "status?", "limit?", "offset?"]
    output: "SpendEntry[]"
    side_effects: []
  - method: GET
    path: "/api/spend-entries/{entryId}"
    description: "Get a spend entry"
    roles: [FilmOfficeAdmin, FilmOfficeReviewer, Producer, CPAAuditor, CreditBuyer]
    code: 200
    input: []
    output: SpendEntry
    side_effects: []
  - method: POST
    path: "/api/spend-entries/{entryId}/review"
    description: "Reviewer qualifies or disqualifies a spend entry; fires the totals recompute cascade"
    roles: [FilmOfficeReviewer]
    code: 200
    input: [decision, "disqualify_reason?"]
    output: SpendEntry
    side_effects: ["status transition per SpendEntry machine", "effective_amount_cents computed on QUALIFY (per-entry uplift rounding)", "application totals + certificate exposure recompute; 0 -> >0 exposure auto-opens/updates SPEND_SHORTFALL clawback"]

  # --- AuditPackage ---
  - method: POST
    path: "/api/audit-packages"
    description: "Engage a CPA audit package on an APPROVED application"
    roles: [CPAAuditor]
    code: 201
    input: [application_id]
    output: AuditPackage
    side_effects: ["status=ENGAGED", "cpa_user_id = X-User-ID", "ERR_AUDIT_PACKAGE_EXISTS when a package with status NOT IN {REJECTED} already exists for the application", "ERR_INVALID_STATE_TRANSITION unless application.status == APPROVED"]
  - method: GET
    path: "/api/audit-packages"
    description: "List audit packages (filtered; 1:1 reverse-reachability returns array of 0 or 1)"
    roles: [FilmOfficeAdmin, FilmOfficeReviewer, Producer, CPAAuditor, CreditBuyer]
    code: 200
    input: ["application_id?", "status?", "limit?", "offset?"]
    output: "AuditPackage[]"
    side_effects: []
  - method: GET
    path: "/api/audit-packages/{packageId}"
    description: "Get an audit package"
    roles: [FilmOfficeAdmin, FilmOfficeReviewer, Producer, CPAAuditor, CreditBuyer]
    code: 200
    input: []
    output: AuditPackage
    side_effects: []
  - method: POST
    path: "/api/audit-packages/{packageId}/submit-draft"
    description: "CPA submits the draft audit + documentation package (from ENGAGED or FIELDWORK)"
    roles: [CPAAuditor]
    code: 200
    input: [documentation_complete]
    output: AuditPackage
    side_effects: ["-> DRAFT_SUBMITTED", "documentation_complete recorded", "ERR_NOT_OWNER unless X-User-ID == cpa_user_id"]
  - method: POST
    path: "/api/audit-packages/{packageId}/raise-exceptions"
    description: "Reviewer raises exceptions on a submitted draft, sending it back to FIELDWORK"
    roles: [FilmOfficeReviewer]
    code: 200
    input: [exception_notes]
    output: AuditPackage
    side_effects: ["DRAFT_SUBMITTED -> FIELDWORK", "exception_count += 1"]
  - method: POST
    path: "/api/audit-packages/{packageId}/attest"
    description: "CPA attests qualified spend figures (DRAFT_SUBMITTED only)"
    roles: [CPAAuditor]
    code: 200
    input: [attested_atl_cents, attested_btl_cents, documentation_complete]
    output: AuditPackage
    side_effects: ["DRAFT_SUBMITTED -> ATTESTED", "attested amounts + attested_at recorded", "ERR_AUDIT_PACKAGE_INCOMPLETE unless documentation_complete == true", "ERR_SPEND_ENTRIES_PENDING while any entry of the application is PENDING_REVIEW"]
  - method: POST
    path: "/api/audit-packages/{packageId}/decision"
    description: "Reviewer accepts or rejects an ATTESTED package; decider must differ from the CPA"
    roles: [FilmOfficeReviewer]
    code: 200
    input: [outcome, "decision_reason?"]
    output: AuditPackage
    side_effects: ["ATTESTED -> ACCEPTED | REJECTED", "decided_by_user_id = X-User-ID", "ERR_SEGREGATION_OF_DUTIES when X-User-ID == cpa_user_id", "on ACCEPT: application.final_credit_cents locked = FINAL credit_amount over attested sums"]

