      - name: apprenticeship_variant_selection_stub
        claim_type: variant_selection
        grounds:
          - calculations.apprenticeship_compliance.variants
          - endpoints[POST /solar/projects/{project_id}/labor-compliance-runs]
        excluded_because:
          difficulty_instance: dual_variant_calc / apprenticeship_project_aggregate_qualifies_where_weekly_worst_case_fails
          rationale: "basis_override selecting the variant, and apprenticeship_basis_applied recording the selection without mutating apprenticeship_basis, are asserted there."

      - name: labor_compliance_run_reconciles_restitution_after_a_void
        claim_type: reconciliation
        grounds:
          - calculations.prevailing_wage_restitution
          - entities.Project.fields.wage_restitution_owed_cents
          - entities.Project.fields.wage_liquidated_damages_cents
          - entities.Project.fields.tax_credit_status
        distinguishing_aspect: "The ledger is recomputed, not accumulated: a REMEDIABLE project accrues 40000 cents of restitution and 8000 cents of wage liquidated damages from one underpaid entry and is DISQUALIFIED despite a 20.00% apprentice share; voiding that entry and re-running drops both money fields to 0 and flips tax_credit_status to QUALIFIED."
        test_recipe:
          setup:
            - "One REMEDIABLE project with apprenticeship_min_pct 15.00 on the PROJECT_AGGREGATE basis"
            - "One OPEN payroll week 2026-08-03 with a compliant 20.00-hour apprentice entry and an 80.00-hour journeyworker entry paid 500 cents/hour under its 5000-cent determination"
          setup_api_calls:
            - call: "POST /solar/projects"
              payload: { name: "Reconcile Draw", utility_name: "Basin Power", ac_capacity_kw: 100, dc_capacity_kw: 130, contract_value_cents: 10000000, retainage_pct: 0.05, ld_per_day_cents: 50000, ld_cap_pct: 0.05, sc_deadline_date: "2026-08-01", guaranteed_capacity_kw_ac: 100, guaranteed_performance_ratio: 0.69, prevailing_wage_election: "REMEDIABLE", apprenticeship_basis: "PROJECT_AGGREGATE", apprenticeship_min_pct: 15.00 }
              as: EpcProjectManager
              captures: { proj: $.data.id }
            - call: "POST /solar/projects/${proj}/payroll-weeks"
              payload: { week_start_date: "2026-08-03" }
              as: LaborComplianceOfficer
              captures: { wk: $.data.id }
            - call: "POST /solar/payroll-weeks/${wk}/labor-entries"
              payload: { worker_ref: "W-701", classification: "ELECTRICIAN", is_apprentice: true, hours: 20.00, paid_rate_cents: 4200, fringe_rate_cents: 800, prevailing_rate_cents: 5000, work_date: "2026-08-03" }
              as: LaborComplianceOfficer
              captures: { le_ok: $.data.id }
            - call: "POST /solar/payroll-weeks/${wk}/labor-entries"
              payload: { worker_ref: "W-702", classification: "OPERATOR", is_apprentice: false, hours: 80.00, paid_rate_cents: 4000, fringe_rate_cents: 500, prevailing_rate_cents: 5000, work_date: "2026-08-04" }
              as: LaborComplianceOfficer
              captures: { le_low: $.data.id }
          trigger:
            - call: "POST /solar/projects/${proj}/labor-compliance-runs"
              payload: {}
              as: LaborComplianceOfficer
              captures: { pct1: $.data.apprentice_hours_pct, rest1: $.data.wage_restitution_owed_cents, ld1: $.data.wage_liquidated_damages_cents, tcs1: $.data.tax_credit_status }
            - call: "POST /solar/labor-entries/${le_low}/void"
              payload: { void_reason: "rate table corrected, hours re-posted next week" }
              as: LaborComplianceOfficer
              captures: { vst: $.data.status, vrest: $.data.restitution_cents }
            - call: "POST /solar/projects/${proj}/labor-compliance-runs"
              payload: {}
              as: LaborComplianceOfficer
              captures: { pct2: $.data.apprentice_hours_pct, rest2: $.data.wage_restitution_owed_cents, ld2: $.data.wage_liquidated_damages_cents, tcs2: $.data.tax_credit_status }
          assert:
            - "${pct1} == 20.00 (20.00 / 100.00), so the apprenticeship gate is satisfied at 15.00"
            - "${rest1} == 40000 (shortfall 500 cents/hour * 80.00 hours) and ${ld1} == 8000 (40000 * PW_LD_RATE 0.2)"
            - "${tcs1} == DISQUALIFIED — QUALIFIED requires apprenticeship AND zero restitution"
            - "LaborEntry.${le_low}.shortfall_cents_per_hour == 500 and restitution_cents == 40000 after the first run, while LaborEntry.${le_ok}.restitution_cents == 0"
            - "${vst} == VOIDED and ${vrest} == 0"
            - "${pct2} == 100.00 (20.00 / 20.00), ${rest2} == 0 and ${ld2} == 0 — the ledger is recomputed from POSTED entries, not decremented"
            - "${tcs2} == QUALIFIED"

  - section: validations
    instances:
      - name: bmp_inspection_currency_gate_fires_at_the_interval_edge
        claim_type: violation_to_error
        grounds:
          - validations[priority=13]
          - errors[ERR_BMP_INSPECTION_OVERDUE]
          - calculations.site_condition_gates
          - entities.GradingArea.fields.bmp_last_inspected_at
        distinguishing_aspect: "bmp_last_inspected_at is seeded from the logical clock at area creation, so the currency window is [creation, creation + 14 days] inclusive: a window starting exactly at 2026-08-15T00:00:00Z is admitted and one starting twelve hours later is refused — and a BMP_INSPECTION site event re-opens the same refused window."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z"
            - "One project with one PLANNED grading area, bmp_inspection_interval_days 14 and disturbed_acreage_limit 40.00"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { now: "2026-08-01T00:00:00Z" }
              as: CivilSuperintendent
            - call: "POST /solar/projects"
              payload: { name: "BMP Draw", utility_name: "Basin Power", ac_capacity_kw: 100, dc_capacity_kw: 130, contract_value_cents: 10000000, retainage_pct: 0.05, ld_per_day_cents: 50000, ld_cap_pct: 0.05, sc_deadline_date: "2026-08-01", guaranteed_capacity_kw_ac: 100, guaranteed_performance_ratio: 0.69 }
              as: EpcProjectManager
              captures: { proj: $.data.id }
            - call: "POST /solar/projects/${proj}/grading-areas"
              payload: { area_code: "A1", permit_number: "CGP-2026-118", disturbed_acreage_limit: 40.00, bmp_inspection_interval_days: 14 }
              as: CivilSuperintendent
              captures: { ga: $.data.id, seeded: $.data.bmp_last_inspected_at }
          trigger:
            - call: "POST /solar/grading-areas/${ga}/earthwork-logs"
              payload: { activity_type: "CLEARING", work_start_at: "2026-08-15T00:00:00Z", work_end_at: "2026-08-15T06:00:00Z", acreage_disturbed_delta: 5.00 }
              as: CivilSuperintendent
              captures: { s1: $.data.status, c1: $.data.disturbed_acreage_current }
            - call: "POST /solar/grading-areas/${ga}/earthwork-logs"
              payload: { activity_type: "GRADING", work_start_at: "2026-08-15T12:00:00Z", work_end_at: "2026-08-15T20:00:00Z", acreage_disturbed_delta: 5.00 }
              as: CivilSuperintendent
              captures: { eid: $.data.error_id }
            - call: "POST /solar/grading-areas/${ga}/site-events"
              payload: { event_type: "BMP_INSPECTION", occurred_at: "2026-08-20T00:00:00Z", deficiencies_found: false, note: "quarterly walk" }
              as: CivilSuperintendent
              captures: { insp: $.data.bmp_last_inspected_at, defi: $.data.bmp_deficiency_open, s2: $.data.status }
            - call: "POST /solar/grading-areas/${ga}/earthwork-logs"
              payload: { activity_type: "GRADING", work_start_at: "2026-08-15T12:00:00Z", work_end_at: "2026-08-15T20:00:00Z", acreage_disturbed_delta: 5.00 }
              as: CivilSuperintendent
              captures: { s3: $.data.status, c3: $.data.disturbed_acreage_current }
          assert:
            - "${seeded} == 2026-08-01T00:00:00Z — the area inherits the logical clock, not a null"
            - "the first log returns 200 with ${s1} == CLEARED and ${c1} == 5.00 — work_start_at sits exactly on bmp_last_inspected_at + 14 days and the comparison is >, so the edge is admitted"
            - "the second log returns 422 with ${eid} == ERR_BMP_INSPECTION_OVERDUE — twelve hours past the edge is out of currency"
            - "GradingArea.${ga}.status is still CLEARED and disturbed_acreage_current is still 5.00 after the refusal"
            - "the site event returns 200 with ${insp} == 2026-08-20T00:00:00Z, ${defi} == false and ${s2} == CLEARED (a BMP_INSPECTION is not a status transition)"
            - "the identical replayed log now returns 200 with ${s3} == GRADED and ${c3} == 10.00"

      - name: torque_tube_deviation_at_the_declared_tolerance_is_accepted
        claim_type: satisfaction_to_pass
        grounds:
          - validations[priority=19]
          - errors[ERR_TORQUE_TUBE_TOLERANCE_EXCEEDED]
          - state_machines.Block.PILES_COMPLETE_to_MECH_COMPLETE
        distinguishing_aspect: "The tolerance comparison is <=, so 25.0 mm satisfies the rule and succeeds while 25.1 mm fails; the refused attempt must leave mechanical_status at PILES_COMPLETE and modules_installed_qty null rather than half-applying the completion."
        test_recipe:
