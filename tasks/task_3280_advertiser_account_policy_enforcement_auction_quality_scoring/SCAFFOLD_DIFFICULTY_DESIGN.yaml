            - call: "POST /advertiser-accounts/${acct}/billing-profile"
              payload: { payment_method_type: "CARD" }
              as: Advertiser
              as_user_id: "${acct}"
            - call: "POST /advertiser-accounts/${acct}/identity-verifications"
              payload: { legal_business_name: "Vita Corp LLC", registration_number: "RN-13", document_type: "TAX_CERTIFICATE", disclosure_consent: true, expected_account_version: "${acct_v}" }
              as: Advertiser
              as_user_id: "${acct}"
              captures: { ver: $.data.id }
            - call: "POST /identity-verifications/${ver}/decide"
              payload: { outcome: "APPROVED" }
              as: PlatformAdmin
            - call: "POST /campaigns"
              payload: { account_id: "${acct}", name: "CV", daily_budget_cents: 1000, start_date: "2026-09-01", end_date: "2026-12-31" }
              as: Advertiser
              as_user_id: "${acct}"
              captures: { camp: $.data.id }
            - call: "POST /campaigns/${camp}/activate"
              payload: {}
              as: Advertiser
              as_user_id: "${acct}"
            - call: "POST /campaigns/${camp}/ad-groups"
              payload: { name: "AG" }
              as: Advertiser
              as_user_id: "${acct}"
              captures: { ag: $.data.id }
            - call: "POST /ad-groups/${ag}/ads"
              payload: { headline: "Vitamins Plus", final_url: "https://v.example/v", category: "HEALTHCARE", restricted_category_certified: true, quality_ectr_score: 8, quality_relevance_score: 7, quality_lp_score: 6 }
              as: Advertiser
              as_user_id: "${acct}"
              captures: { ad: $.data.id }
            - call: "POST /ad-groups/${ag}/keywords"
              payload: { text: "vitamins", match_type: "EXACT", max_cpc_cents: 200 }
              as: Advertiser
              as_user_id: "${acct}"
            - call: "POST /ads/${ad}/submit-review"
              payload: {}
              as: Advertiser
              as_user_id: "${acct}"
              captures: { rev: $.data.id, rev_out: $.data.outcome }
          trigger:
            - call: "POST /auctions"
              payload: { query_text: "vitamins", clicked: true }
              as: PlatformAdmin
              captures: { err: $.data.error_id }
            - call: "POST /policy-reviews/${rev}/decide"
              payload: { outcome: "HUMAN_APPROVED" }
              as: PolicyReviewer
            - call: "POST /auctions"
              payload: { query_text: "vitamins", clicked: true }
              as: PlatformAdmin
              captures: { win: $.data.winner_ad_id }
          assert:
            - "rev_out == NEEDS_HUMAN"
            - "err == ERR_NO_ELIGIBLE_AD (keyword matches but Ad.status UNDER_REVIEW blocks eligibility)"
            - "win == ${ad} after the PolicyReview transition (cross-entity gate cleared)"

  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: verification_pending_window_mutual_exclusion
        grounds:
          - validations[priority=8]
          - errors[ERR_DUPLICATE_VERIFICATION_PENDING]
        distinguishing_aspect: |
          Resource: the account's verification slot; semantics: an open-ended
          occupation window [submitted, decision) — any second submission while
          one is pending is rejected, regardless of how much time has passed.
        test_recipe:
          setup:
            - "Clock 2026-09-01. Fresh account (PENDING_VERIFICATION) with one SUBMITTED verification V1; account version observed after V1 creation."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /advertiser-accounts"
              payload: { business_name: "Mutex Corp", country_code: "US" }
              as: Anonymous
              captures: { acct: $.data.id, acct_v0: $.data.version }
            - call: "POST /advertiser-accounts/${acct}/identity-verifications"
              payload: { legal_business_name: "Mutex Corp LLC", registration_number: "RN-14", document_type: "BUSINESS_LICENSE", disclosure_consent: true, expected_account_version: "${acct_v0}" }
              as: Advertiser
              as_user_id: "${acct}"
              captures: { v1: $.data.id }
            - call: "GET /advertiser-accounts/${acct}"
              payload: {}
              as: Advertiser
              as_user_id: "${acct}"
              captures: { acct_v1: $.data.version }
          trigger:
            - call: "POST /advertiser-accounts/${acct}/identity-verifications"
              payload: { legal_business_name: "Mutex Corp LLC Amended", registration_number: "RN-14B", document_type: "TAX_CERTIFICATE", disclosure_consent: true, expected_account_version: "${acct_v1}" }
              as: Advertiser
              as_user_id: "${acct}"
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_DUPLICATE_VERIFICATION_PENDING (V1's pending window is still occupied; OCC version was fresh, so 409 not 412)"

      - name: appeal_cooldown_buffer_after_upheld_decision
        grounds:
          - state_machines.AdvertiserAccount.SUSPENDED_to_APPEAL_PENDING
          - errors[ERR_APPEAL_COOLDOWN]
        distinguishing_aspect: |
          Different resource (the suspension episode's appeal slot) and different
          interval semantics: not open-ended mutual exclusion but a bounded
          post-decision buffer — a new appeal inside [decided_at, decided_at+14d)
          is rejected while one at or after the buffer end (still inside the 30d
          appeal window) succeeds.
        test_recipe:
          setup:
            - "Clock 2026-09-01. Verified ACTIVE account suspended at T0; appeal filed and decided UPHELD at T0+5d."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /advertiser-accounts"
              payload: { business_name: "Cool Corp", country_code: "US" }
              as: Anonymous
              captures: { acct: $.data.id, acct_v: $.data.version }
            - call: "POST /advertiser-accounts/${acct}/identity-verifications"
              payload: { legal_business_name: "Cool Corp LLC", registration_number: "RN-15", document_type: "BUSINESS_LICENSE", disclosure_consent: true, expected_account_version: "${acct_v}" }
              as: Advertiser
              as_user_id: "${acct}"
              captures: { ver: $.data.id }
            - call: "POST /identity-verifications/${ver}/decide"
              payload: { outcome: "APPROVED" }
              as: PlatformAdmin
            - call: "POST /advertiser-accounts/${acct}/suspend"
              payload: { reason_code: "POLICY_VIOLATION" }
              as: PlatformAdmin
            - call: "POST /advertiser-accounts/${acct}/appeals"
              payload: { argument_text: "first appeal" }
              as: Advertiser
              as_user_id: "${acct}"
              captures: { ap1: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-06T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /appeals/${ap1}/decide"
              payload: { outcome: "UPHELD", reviewer_note: "violation confirmed" }
              as: PlatformAdmin
          trigger:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-15T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /advertiser-accounts/${acct}/appeals"
              payload: { argument_text: "inside cooldown" }
              as: Advertiser
              as_user_id: "${acct}"
              captures: { err_cd: $.data.error_id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-20T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /advertiser-accounts/${acct}/appeals"
              payload: { argument_text: "after cooldown, inside window" }
              as: Advertiser
              as_user_id: "${acct}"
              captures: { ap2: $.data.id }
          assert:
            - "err_cd == ERR_APPEAL_COOLDOWN (2026-09-15 < 2026-09-06 + 14d = 2026-09-20)"
            - "appeal at 2026-09-20 succeeds (201): buffer ended AND 2026-09-20 < suspended_at + 30d = 2026-10-01"

  # ===========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: account_fiscal_invariant_across_invoice_and_retroactive_flag
        grounds:
          - calculations.invalid_click_credit
          - calculations.billing_threshold_charge
          - entities.AdvertiserAccount.fields.lifetime_valid_served_cents
          - entities.AdvertiserAccount.fields.lifetime_billed_cents
          - entities.BillingProfile.fields.unbilled_cost_cents
          - entities.BillingProfile.fields.pending_credit_cents
        distinguishing_aspect: |
          Conserved quantity: account-level fiscal balance
          (lifetime_billed + unbilled - pending_credit == lifetime_valid_served
          - lifetime_overdelivery_credit). The forward action (click charged
          500, invoiced) plus its compensating action (flag-invalid reducing the
          unpaid invoice) leave the equation exact at every step.
        test_recipe:
          setup:
            - "Clock 2026-09-01. Verified ACTIVE account; ACTIVE campaign budget 100000. Winner ad W (q 1000, bid 5000, keyword 'gizmo' EXACT) and runner R (q 1000, bid 499) so each click charges 500. One clicked auction recorded, then month 2026-09 closed -> MONTHLY invoice 500 unpaid."
