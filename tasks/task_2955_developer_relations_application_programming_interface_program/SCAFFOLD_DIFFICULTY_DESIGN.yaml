              as: DevRelManager
              as_user_id: "drm-1"
              captures: { d1_snapshot: $.data.trust_score }
          trigger:
            - call: "POST /program-checkpoints"
              payload: {}
              as: PlatformAdmin
              as_user_id: "adm-1"
          assert:
            - "ViolationCase.${vc1_id}.penalty_points == 60"
            - "ViolationCase.${vc1_id}.state == INVESTIGATING"
            - "Developer.${d1_id}.throttled_window_count == 2"
            - "Developer.${d1_id}.trust_score == 71"
            - "Developer.${d1_id}.audited_trust_score == 36"
            - "Developer.${d1_id}.trust_score - Developer.${d1_id}.audited_trust_score == 35"
            - "Developer.${d1_id}.violation_points == 0"

