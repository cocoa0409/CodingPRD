  - section: complexity_layers
    instances:
      - name: occ_invoice_create_stale_version
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[occ-invoice-create-contract]", "validations[priority=6]", "errors[ERR_STALE_VERSION]"]
        distinguishing_aspect: "OCC on Contract.version for POST /contracts/{id}/invoices: after a first invoice creation advances the contract version, a second create carrying the previously observed version fails 412 — deterministic with two strictly sequential calls."
        test_recipe:
          setup: ["EU contract ACTIVE; client observed contract version v (captured before any invoice exists)"]
          setup_api_calls:
            - { call: "POST /contracts", payload: { contract_number: "EU-2026-001", agency: "USFS", contract_type: "EXCLUSIVE_USE", daily_availability_rate_cents: 500000, flight_hour_rate_cents: 300000, season_start_date: "2026-06-01", season_end_date: "2026-09-30", season_flight_hour_cap_tenths: 20000, acceptance_window_minutes: 30 }, as: CarrierOps, captures: { c_id: $.data.id } }
            - { call: "POST /contracts/${c_id}/activate", payload: {}, as: CarrierOps }
            - { call: "GET /contracts/${c_id}", as: CarrierFinance, captures: { c_v: $.data.version } }
            - { call: "POST /contracts/${c_id}/invoices", payload: { period_start: "2026-08-03", period_end: "2026-08-07", expected_contract_version: "${c_v}" }, as: CarrierFinance, captures: { inv1: $.data.id } }
          trigger:
            - { call: "POST /contracts/${c_id}/invoices", payload: { period_start: "2026-08-10", period_end: "2026-08-14", expected_contract_version: "${c_v}" }, as: CarrierFinance, captures: { err: $.data.error_id } }
            - { call: "GET /contracts/${c_id}", as: CarrierFinance, captures: { c_v2: $.data.version } }
            - { call: "POST /contracts/${c_id}/invoices", payload: { period_start: "2026-08-10", period_end: "2026-08-14", expected_contract_version: "${c_v2}" }, as: CarrierFinance, captures: { inv2: $.data.id } }
          assert:
            - "second create with the stale version fails with ERR_STALE_VERSION (412)"
            - "re-reading the contract and retrying with the fresh version succeeds (201, different period_start so no overlap conflict)"
            - "each successful invoice create increments Contract.version by exactly 1"

      - name: occ_assignment_create_stale_version
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[occ-assignment-create-dispatch]", "validations[priority=6]", "errors[ERR_STALE_VERSION]"]
        distinguishing_aspect: "OCC on DispatchOrder.version for POST /dispatch-orders/{id}/assignments on a qty-2 order (capacity remains, so the second sequential create would otherwise legitimately succeed): a create carrying the pre-first-assignment version fails 412."
        test_recipe:
          setup: ["EU contract ACTIVE; carded aircraft + two carded pilots; order qty 2 ACCEPTED at version v; one assignment already created (order version advanced)"]
          setup_api_calls:
            - { call: "POST /contracts", payload: { contract_number: "EU-2026-001", agency: "USFS", contract_type: "EXCLUSIVE_USE", daily_availability_rate_cents: 500000, flight_hour_rate_cents: 300000, season_start_date: "2026-06-01", season_end_date: "2026-09-30", season_flight_hour_cap_tenths: 20000, acceptance_window_minutes: 30 }, as: CarrierOps, captures: { c_id: $.data.id } }
            - { call: "POST /contracts/${c_id}/activate", payload: {}, as: CarrierOps }
            - { call: "POST /aircraft", payload: { tail_number: "N100AF", model: "AT-802F", tank_capacity_gallons: 800, contract_id: "${c_id}" }, as: CarrierOps, captures: { ac_id: $.data.id } }
