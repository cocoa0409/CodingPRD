              captures: { route_v5b: "$.data.id" }
            - call: "POST /route-stops"
              payload: { route_id: "${route_v5b}", venue_id: "${ven_v5}", load_in_start: "2026-09-05T06:00:00Z", open_date: "2026-09-06T12:00:00Z", close_date: "2026-09-09T12:00:00Z", teardown_deadline: "2026-09-10T12:00:00Z" }
