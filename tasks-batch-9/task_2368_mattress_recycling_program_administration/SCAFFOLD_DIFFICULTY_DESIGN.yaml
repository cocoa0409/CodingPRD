  # ---------------------------------------------------------------------------
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: pay_on_draft_remittance_state_error_precedes_payment_amount_mismatch
        grounds:
          - validations[priority=46]
          - validations[priority=92]
          - errors[ERR_REMITTANCE_NOT_PAYABLE]
          - errors[ERR_PAYMENT_AMOUNT_MISMATCH]
        distinguishing_aspect: |
          A single pay request violates a `state` rule (priority 46, remittance is DRAFT not FILED) and a
          `business_fiscal` rule (priority 92, amount_cents 1 != fee_self_assessed_cents 0) at once; the
          response must be exactly ERR_REMITTANCE_NOT_PAYABLE with HTTP 409, never the 422.
        test_recipe:
          setup:
            - "CA program and a registered retailer; no fee rate schedules are needed because the remittance is never filed."
            - "A DRAFT 2026Q4 remittance exists with fee_self_assessed_cents 0."
          setup_api_calls:
            - call: "POST /state-programs"
              payload: { state_code: "CA", program_name: "California Mattress Recycling Program", forecast_annual_cost_cents: 60000000, forecast_annual_units: 60000, forecast_other_revenue_cents: 3000000, reserve_target_months: 3, reserve_opening_cents: 5000000, site_credit_cents_per_unit: 305, volume_bonus_threshold_units: 500, delinquency_alert_threshold: 1 }
              as: ProgramAdministrator
              as_user_id: "admin-1"
              captures: { prog_ca_id: $.data.id }
            - call: "POST /registrants"
              payload: { legal_name: "Golden State Mattress Co", registrant_type: "BOTH", home_state_code: "CA" }
              as: ProgramAdministrator
              as_user_id: "admin-1"
              captures: { reg_id: $.data.id }
            - call: "POST /sales-remittances"
              payload: { registrant_id: "${reg_id}", state_program_id: "${prog_ca_id}", period_code: "2026Q4", units_sold_mattress: 300, units_sold_foundation: 100 }
              as: Registrant
              as_user_id: "${reg_id}"
              captures: { rem_id: $.data.id }
          trigger:
            - call: "POST /sales-remittances/${rem_id}/pay"
              payload: { amount_cents: 1 }
              as: Registrant
              as_user_id: "${reg_id}"
          assert:
            - "Trigger response: HTTP 409 with data.error_id == ERR_REMITTANCE_NOT_PAYABLE"
            - "Trigger response: data.error_id != ERR_PAYMENT_AMOUNT_MISMATCH"
            - "SalesRemittance.${rem_id}.status == DRAFT"
            - "SalesRemittance.${rem_id}.fee_paid_cents == 0"
            - "StateProgram.${prog_ca_id}.fee_collected_cents == 0"

      - name: site_quarantine_safety_precedes_recycler_program_mismatch_referential
        grounds:
          - validations[priority=64]
          - validations[priority=74]
          - errors[ERR_SITE_QUARANTINED]
          - errors[ERR_RECYCLER_PROGRAM_MISMATCH]
          - calculations.load_inspection_disposition
        distinguishing_aspect: |
          A different category pair from the pay conflict: one pickup-order request violates
          `business_safety` (priority 64, site under a 14-day infestation quarantine) and
          `business_referential` (priority 74, recycler belongs to the OR program) simultaneously, and
          returns ERR_SITE_QUARANTINED; after the clock passes the quarantine expiry the identical
