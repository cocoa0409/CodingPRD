        distinguishing_aspect: |
          Pair GarnishmentOrder→Employee: an order in EMPLOYEE_NOTIFIED cannot
          transition to ACTIVE once the linked Employee has termination_date
          set — the legal transition set of the order is narrowed by the state
          of a different entity (employee), not by the order's own fields.
        test_recipe:
          setup:
            - "Employer, employee, one order driven RECEIVED→VALIDATED→EMPLOYEE_NOTIFIED"
            - "Employee is then terminated (termination_date set)"
