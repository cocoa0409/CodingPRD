            - call: "POST /toastmasters/clubs/${club_id}/close-cycle"
              payload: { cycle_opened_at: "2026-10-01T00:00:00Z", cycle_closed_at: "2026-10-01T00:00:00Z" }
              as: WorldHeadquarters
          trigger:
            - call: "POST /toastmasters/clubs/${club_id}/close-cycle"
              payload: { cycle_opened_at: "2027-04-01T00:00:00Z", cycle_closed_at: "2027-04-01T00:00:00Z" }
