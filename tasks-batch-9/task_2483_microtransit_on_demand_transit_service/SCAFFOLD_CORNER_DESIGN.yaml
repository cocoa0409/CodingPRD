              payload: {}
              as: ZoneAdmin
            - call: "POST /virtual-stops"
              payload: { zone_id: "${z_id}", stop_code: "S4", corridor_index: 4, walk_shed_meters: 400, accessibility: "STAIRS_ONLY" }
              as: ZoneAdmin
              captures: { s4_id: $.data.id }
