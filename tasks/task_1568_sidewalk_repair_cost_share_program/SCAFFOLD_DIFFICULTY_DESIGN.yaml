            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-09-16T00:00:00Z" }, as: ProgramCoordinator }
            - { call: "POST /delinquency-sweeps", as: ProgramCoordinator }
            - { call: "POST /bid-batches", payload: { neighborhood_code: "NB-A", work_window_start: "2026-10-01", work_window_end: "2026-11-01", bid_deadline: "2026-09-20T00:00:00Z" }, as: ProgramCoordinator, captures: { batchA: "$.data.id" } }
            - { call: "POST /batch-work-items", payload: { batch_id: "${batchA}", notice_id: "${n1}", scope_sqft: 50, engineer_unit_rate_cents: 1300 }, as: ProgramCoordinator }
