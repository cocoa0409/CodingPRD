            - { call: "GET /safety/jhas/${j}", payload: {}, as: SafetyManager, captures: { j_s: "$.data.status" } }
          assert:
            - "Project.${p}.safety_posture == FROZEN                      # link 1"
            - "Permit.${pm}.status == SUSPENDED with suspension_reason == 'POSTURE_FROZEN'   # link 2, caused by the posture flip"
            - "JobHazardAnalysis.${j}.status == RE_REVIEW_REQUIRED       # link 3, caused by the permit suspension"
            - "Project.${p}.issued_permit_count == 0"

      - name: positive_drug_test_suspension_cascade
        grounds:
          - state_machines.DrugTestRecord.PENDING_RESULT_to_POSITIVE
          - state_machines.Worker.CLEARED_to_SUSPENDED
          - state_machines.Permit.ISSUED_to_SUSPENDED
          - state_machines.JobHazardAnalysis.APPROVED_to_RE_REVIEW_REQUIRED
        distinguishing_aspect: |
          Depth-3 cascade triggered by a DRUG TEST RESULT (different trigger than incident creation):
          POSITIVE result -> Worker SUSPENDED (link 1) -> ISSUED permits listing the worker SUSPENDED with
          reason CREW_MEMBER_SUSPENDED (link 2, caused by the suspension) -> linked JHA RE_REVIEW_REQUIRED
          (link 3, caused by the permit suspension). Posture stays NORMAL — this cascade does not route
          through posture, unlike the incident-freeze instance.
        test_recipe:
          setup:
            - "Project with ACTIVE plan; worker w CLEARED; huddle CONDUCTED; JHA APPROVED; FALL_PROTECTION permit ISSUED with crew [w]; posture NORMAL"
