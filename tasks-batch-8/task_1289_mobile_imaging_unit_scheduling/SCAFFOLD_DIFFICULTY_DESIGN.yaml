      - name: dose_limit_and_cert_mismatch_safety_beats_referential
        grounds:
          - validations[priority=6]
          - validations[priority=9]
          - errors[ERR_DOSE_LIMIT_EXCEEDED]
          - errors[ERR_MODALITY_CERT_MISMATCH]
