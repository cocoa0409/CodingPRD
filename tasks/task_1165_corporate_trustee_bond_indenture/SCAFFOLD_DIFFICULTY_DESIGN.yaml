          Conserved quantity: DISTRIBUTED CASH. Execute + settle moves
          25416667 cents into holder totals (10166667 + 8895833 + 6354167);
          the compensating reverse MUST return every
          NoteholderAccount.total_received_cents to exactly 0 — distinct
          conserved quantity from principal (rule 9 instance 1) and from
          voting support (instance 2).
        test_recipe:
          setup:
            - "Active indenture, tranche, positions A 400000000 / B 350000000 / C 250000000"
            - "INTEREST run [2026-06-15, 2026-12-15) funded 25416667 and executed at clock 2026-05-01 (records PENDING)"
