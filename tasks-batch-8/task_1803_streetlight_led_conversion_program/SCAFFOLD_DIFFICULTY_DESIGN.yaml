    distinguishing_aspect: 'Category pair (state, business_fiscal): the dispatch violates BOTH the route-state

      precondition (route SUSPENDED -> ERR_ROUTE_SUSPENDED, priority 9) AND the fiscal check

      (estimate 4500 > balance 3500 -> ERR_PROGRAM_BUDGET_EXCEEDED, priority 34); the state

