      - name: submit_with_a_revoked_consent_returns_consent_expired
        claim_type: error_triggerable
        grounds:
          - errors[ERR_CONSENT_EXPIRED]
          - state_machines.ConsentRecord.EXECUTED_to_REVOKED
        distinguishing_aspect: "Revocation is distinguished from absence: the record covering 2026-09-01 was genuinely EXECUTED before being revoked, so submit returns the more specific ERR_CONSENT_EXPIRED (422) rather than ERR_CONSENT_MISSING, and a second EXECUTED consent for a later window keeps insurable_interest_status at ESTABLISHED so the priority-11 group cannot be satisfied by the insurable-interest branch instead."
