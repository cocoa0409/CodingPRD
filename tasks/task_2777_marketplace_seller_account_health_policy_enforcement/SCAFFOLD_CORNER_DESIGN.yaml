            - "Seller.${s_id}.lifetime_credited_cents == 100000 and Seller.${s_id}.lifetime_debited_cents == 0"
            - "a FUNDS_HELD Notification exists for ${s_id} with amount_cents 100000"

      - name: state_manual_hold_release_returns_funds_to_the_seller_ledger
        claim_type: ledger_sync
        grounds:
          - "state_machines.DisbursementHold.transitions.ACTIVE_to_RELEASED.side_effects"
          - "endpoints[POST /disbursement-holds/{id}/release].side_effects"
          - "calculations.reserve_requirement_cents"
          - "calculations.risk_tier"
        distinguishing_aspect: |
          A hold is a ledger mirror: creating a TIER_1 ROLLING reserve moves exactly
          round_half_up(200000 x 0.10) = 20000 cents from available to held, and releasing it moves
          the SAME 20000 back — with lifetime_credited_cents / lifetime_debited_cents never moving,
          so available + held == credited - debited holds before and after. Release also bumps the
          seller's version and emits FUNDS_RELEASED carrying amount_cents, while leaving
          enforcement_state ACTIVE (releasing money never relaxes the enforcement dimension) and
          disbursement_state RESERVE_HELD (the investigation is still open).
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00.000Z."
            - "PolicyRule LA-LED-1 (LISTING_ACCURACY, base 2.00, ACCOUNT, requires_poa false)."
            - "One seller credited 200000 cents; a violation is carried to UNDER_INVESTIGATION so disbursement_state is RESERVE_HELD and an explicit reserve hold is authorised."
            - "The seller's balance is 0.00 points, metric_tier null, registration_risk_flag false -> risk_tier TIER_1 -> RESERVE_ROLLING_PCT 0.10."
            - "Seller.version at hold-creation time: 1 (registration) + 1 (credit) + 1 (open-investigation) = 3, re-read from GET /sellers/{id} immediately before the call."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00.000Z" }
              as: ComplianceOfficer
              as_user_id: "co-1"
            - call: "POST /policy-rules"
              payload: { code: "LA-LED-1", category: "LISTING_ACCURACY", base_severity_weight: 2.00, removal_scope: "ACCOUNT", requires_poa: false }
              as: ComplianceOfficer
              as_user_id: "co-1"
              captures: { rule_la: $.data.id }
            - call: "POST /sellers"
              payload: { legal_name: "Harbor Tools LLC", email: "ops@harbor-tools.example", tax_id_hash: "TAX-HT-0001", payout_bank_token: "BANK-HT-0001", address_fingerprint: "ADDR-HT-0001" }
              as: Anonymous
              captures: { s_id: $.data.id }
            - call: "POST /sellers/${s_id}/proceeds-credits"
              payload: { amount_cents: 200000 }
              as: ComplianceOfficer
              as_user_id: "co-1"
            - call: "POST /violations"
              payload: { seller_id: "${s_id}", policy_rule_id: "${rule_la}", reporter_type: "BUYER", evidence_reference: "EV-LED-0001" }
              as: PolicyInvestigator
              as_user_id: "inv-1"
              captures: { v1: $.data.id }
            - call: "POST /violations/${v1}/open-investigation"
              payload: {}
              as: PolicyInvestigator
              as_user_id: "inv-1"
            - call: "GET /sellers/${s_id}"
              payload: {}
              as: PolicyInvestigator
              as_user_id: "inv-1"
              captures: { sv: $.data.version }
            - call: "POST /disbursement-holds"
              payload: { seller_id: "${s_id}", hold_type: "RESERVE", reserve_basis: "ROLLING", coverage_start: "2026-08-01T00:00:00.000Z", coverage_end: "2026-08-15T00:00:00.000Z", expected_seller_version: "${sv}" }
              as: PolicyInvestigator
              as_user_id: "inv-1"
              captures: { h1: $.data.id, h1_amount: $.data.held_amount_cents, h1_tier: $.data.risk_tier }
          trigger:
            - call: "POST /disbursement-holds/${h1}/release"
              payload: { release_reason: "MANUAL" }
              as: ComplianceOfficer
              as_user_id: "co-1"
              captures: { h1_state: $.data.state, h1_reason: $.data.release_reason }
          assert:
            - "${sv} == 3"
            - "${h1_tier} == TIER_1 and ${h1_amount} == 20000   # round_half_up(200000 x 0.10)"
            - "before release: Seller.${s_id}.available_balance_cents == 180000 and held_balance_cents == 20000"
            - "HTTP 200 and ${h1_state} == RELEASED and ${h1_reason} == MANUAL"
            - "DisbursementHold.${h1}.released_at == 2026-08-01T00:00:00.000Z"
            - "Seller.${s_id}.available_balance_cents == 200000 and Seller.${s_id}.held_balance_cents == 0"
            - "Seller.${s_id}.lifetime_credited_cents == 200000 and Seller.${s_id}.lifetime_debited_cents == 0   # a release is not a debit"
            - "available + held == lifetime_credited - lifetime_debited == 200000"
            - "Seller.${s_id}.version == 5   # 3 at read time + 1 for the hold + 1 for the release"
            - "Seller.${s_id}.disbursement_state == RESERVE_HELD   # the violation is still UNDER_INVESTIGATION"
            - "Seller.${s_id}.enforcement_state == ACTIVE   # money movement never touches the enforcement dimension"
            - "a FUNDS_RELEASED Notification exists for ${s_id} with amount_cents 20000"

      - name: state_appeal_blocked_while_the_plan_of_action_was_rejected
        claim_type: precondition_enforcement
        grounds:
          - "state_machines.Appeal.transitions.null_to_SUBMITTED.preconditions"
          - "state_machines.PlanOfAction.transitions.SUBMITTED_to_REJECTED.side_effects"
          - "validations.priority_85"
          - "errors[ERR_POA_NOT_ACCEPTED]"
        distinguishing_aspect: |
          When the snapshotted rule requires a plan, the appeal gate reads the plan's STATE, not
          its existence: a REJECTED plan is present, complete and belongs to the action, yet the
          appeal is refused with ERR_POA_NOT_ACCEPTED (409) because only ACCEPTED satisfies the
          precondition. The refusal leaves no Appeal row at all, so the seller can still be
          measured as "no appeal filed".
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00.000Z."
            - "PolicyRule LA-POA-1 (LISTING_ACCURACY, base 2.00, ACCOUNT) with requires_poa defaulted to true."
            - "One seller with a SUBSTANTIATED violation and an issued WARNING action (issued_by_user_id inv-1)."
            - "The seller submits a complete plan; ComplianceOfficer co-1 (different from inv-1, so segregation of duties passes) reviews it with decision REJECT."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00.000Z" }
              as: ComplianceOfficer
              as_user_id: "co-1"
            - call: "POST /policy-rules"
              payload: { code: "LA-POA-1", category: "LISTING_ACCURACY", base_severity_weight: 2.00, removal_scope: "ACCOUNT" }
              as: ComplianceOfficer
              as_user_id: "co-1"
              captures: { rule_la: $.data.id }
            - call: "POST /sellers"
              payload: { legal_name: "Harbor Tools LLC", email: "ops@harbor-tools.example", tax_id_hash: "TAX-HT-0001", payout_bank_token: "BANK-HT-0001", address_fingerprint: "ADDR-HT-0001" }
              as: Anonymous
              captures: { s_id: $.data.id }
            - call: "POST /violations"
              payload: { seller_id: "${s_id}", policy_rule_id: "${rule_la}", reporter_type: "BUYER", evidence_reference: "EV-POA-0001" }
              as: PolicyInvestigator
              as_user_id: "inv-1"
              captures: { v1: $.data.id }
            - call: "POST /violations/${v1}/open-investigation"
              payload: {}
              as: PolicyInvestigator
              as_user_id: "inv-1"
            - call: "POST /violations/${v1}/adjudicate"
              payload: { outcome: "SUBSTANTIATED" }
              as: PolicyInvestigator
              as_user_id: "inv-1"
            - call: "POST /enforcement-actions"
              payload: { violation_id: "${v1}" }
              as: PolicyInvestigator
              as_user_id: "inv-1"
              captures: { a1: $.data.id }
            - call: "GET /enforcement-actions/${a1}"
              payload: {}
              as: Seller
              as_user_id: "${s_id}"
              captures: { av: $.data.version }
            - call: "POST /plans-of-action"
              payload: { enforcement_action_id: "${a1}", root_cause: "A bulk price-and-title update reused a template that described the previous model year of the tool.", corrective_measures: ["Rewrote the affected titles and bullet points to match the shipped model year."], preventive_measures: ["Template changes now require a second reviewer before they can be applied to live listings."], expected_enforcement_action_version: "${av}" }
              as: Seller
              as_user_id: "${s_id}"
              captures: { p1: $.data.id }
            - call: "POST /plans-of-action/${p1}/review"
              payload: { decision: "REJECT", review_notes: "The root cause does not explain why the template was never verified." }
              as: ComplianceOfficer
              as_user_id: "co-1"
              captures: { p1_state: $.data.state }
          trigger:
            - call: "POST /appeals"
              payload: { enforcement_action_id: "${a1}", plan_of_action_id: "${p1}", grounds: "The rejected plan should not bar review of the underlying warning." }
              as: Seller
              as_user_id: "${s_id}"
              captures: { err_code: $.data.error_id }
          assert:
            - "${p1_state} == REJECTED"
            - "HTTP 409 and ${err_code} == ERR_POA_NOT_ACCEPTED   # priority 85; the plan exists and matches, so it is not ERR_POA_ACTION_MISMATCH"
            - "appeal list for ${a1}: total_count == 0   # nothing was persisted"
            - "EnforcementAction.${a1}.state == ISSUED"
            - "PlanOfAction.${p1}.reviewed_by_user_id == co-1"
            - "Seller.${s_id}.enforcement_state == WATCHLIST and Seller.${s_id}.severity_points_balance == 2.00"

      - name: state_second_poa_decision_notice_supersedes_the_first_and_both_remain_readable
        claim_type: side_effect_execution
        grounds:
          - "state_machines.Notification.transitions.SENT_to_SUPERSEDED"
          - "state_machines.PlanOfAction.transitions.SUBMITTED_to_RETURNED_FOR_REVISION.side_effects"
          - "state_machines.PlanOfAction.transitions.SUBMITTED_to_ACCEPTED.side_effects"
          - "endpoints[GET /sellers/{id}/notifications]"
        distinguishing_aspect: |
          The supersede edge fires on the tuple (seller_id, template_code, related_entity_type,
          related_entity_id). A POA_DECISION notice is about the remediation of an enforcement
          action, so its pointer is (ENFORCEMENT_ACTION, action.id) — which is why the RETURN
          notice and the later ACCEPT notice for the SAME action collide: the first row moves to
          SUPERSEDED while the second stays SENT. Crucially the transparency trail is not
          destroyed: the notification list still returns BOTH rows, newest first, each carrying
          its own decision_rationale copied verbatim from that review's notes.
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00.000Z."
            - "PolicyRule LA-NOTE-1 (LISTING_ACCURACY, base 2.00, ACCOUNT, requires_poa true by default)."
            - "One seller with an issued WARNING action (issued_by_user_id inv-1) and plan p1 SUBMITTED."
            - "co-1 returns p1 for revision (POA_MAX_REVISIONS is 2, so one return is allowed); the seller submits p2, which supersedes p1 and carries revision_count 1; co-1 then accepts p2."
            - "The action's version is re-read from GET /enforcement-actions/{id} immediately before each plan submission so the OCC rule never fires."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00.000Z" }
              as: ComplianceOfficer
              as_user_id: "co-1"
            - call: "POST /policy-rules"
              payload: { code: "LA-NOTE-1", category: "LISTING_ACCURACY", base_severity_weight: 2.00, removal_scope: "ACCOUNT" }
              as: ComplianceOfficer
              as_user_id: "co-1"
              captures: { rule_la: $.data.id }
            - call: "POST /sellers"
              payload: { legal_name: "Harbor Tools LLC", email: "ops@harbor-tools.example", tax_id_hash: "TAX-HT-0001", payout_bank_token: "BANK-HT-0001", address_fingerprint: "ADDR-HT-0001" }
              as: Anonymous
              captures: { s_id: $.data.id }
            - call: "POST /violations"
              payload: { seller_id: "${s_id}", policy_rule_id: "${rule_la}", reporter_type: "BUYER", evidence_reference: "EV-NOTE-0001" }
              as: PolicyInvestigator
              as_user_id: "inv-1"
              captures: { v1: $.data.id }
            - call: "POST /violations/${v1}/open-investigation"
              payload: {}
              as: PolicyInvestigator
              as_user_id: "inv-1"
            - call: "POST /violations/${v1}/adjudicate"
              payload: { outcome: "SUBSTANTIATED" }
              as: PolicyInvestigator
              as_user_id: "inv-1"
            - call: "POST /enforcement-actions"
              payload: { violation_id: "${v1}" }
              as: PolicyInvestigator
              as_user_id: "inv-1"
              captures: { a1: $.data.id }
            - call: "GET /enforcement-actions/${a1}"
              payload: {}
              as: Seller
              as_user_id: "${s_id}"
              captures: { av1: $.data.version }
            - call: "POST /plans-of-action"
              payload: { enforcement_action_id: "${a1}", root_cause: "The catalogue template reused last season's compatibility list for the two affected SKUs.", corrective_measures: ["Corrected both listings and audited the remaining SKUs from the same template."], preventive_measures: ["Compatibility lists are now sourced from the supplier feed instead of the template."], expected_enforcement_action_version: "${av1}" }
              as: Seller
              as_user_id: "${s_id}"
              captures: { p1: $.data.id }
            - call: "POST /plans-of-action/${p1}/review"
              payload: { decision: "RETURN", review_notes: "Explain how the template was allowed to go live without a compatibility check." }
              as: ComplianceOfficer
              as_user_id: "co-1"
              captures: { p1_state: $.data.state }
            - call: "GET /enforcement-actions/${a1}"
              payload: {}
              as: Seller
              as_user_id: "${s_id}"
              captures: { av2: $.data.version }
            - call: "POST /plans-of-action"
              payload: { enforcement_action_id: "${a1}", root_cause: "The template was published without a compatibility check because the review step was optional in the publishing tool.", corrective_measures: ["Corrected both listings and re-audited the whole template batch line by line."], preventive_measures: ["The publishing tool now blocks a template change until a second reviewer signs the compatibility list."], expected_enforcement_action_version: "${av2}" }
              as: Seller
              as_user_id: "${s_id}"
              captures: { p2: $.data.id, p2_rev: $.data.revision_count }
          trigger:
            - call: "POST /plans-of-action/${p2}/review"
              payload: { decision: "ACCEPT", review_notes: "Root cause and preventive control are now specific and verifiable." }
              as: ComplianceOfficer
              as_user_id: "co-1"
              captures: { p2_state: $.data.state }
            - call: "GET /sellers/${s_id}/notifications"
              payload: { template_code: "POA_DECISION", limit: 10 }
              as: Seller
              as_user_id: "${s_id}"
              captures: { newest_state: "$.data[0].state", newest_rationale: "$.data[0].decision_rationale" }
          assert:
            - "${p1_state} == RETURNED_FOR_REVISION and ${p2_rev} == 1"
            - "PlanOfAction.${p1}.state == SUPERSEDED   # the older row stepped aside when p2 was created"
            - "HTTP 200 and ${p2_state} == ACCEPTED"
            - "POA_DECISION notification list: total_count == 2, has_more == false"
            - "${newest_state} == SENT   # newest first"
            - "${newest_rationale} == Root cause and preventive control are now specific and verifiable."
            - "the older POA_DECISION row has state == SUPERSEDED and decision_rationale == Explain how the template was allowed to go live without a compatibility check."
            - "both rows carry related_entity_type == ENFORCEMENT_ACTION and related_entity_id == ${a1}"
            - "both rows carry amount_cents == null and appeal_deadline_at == null   # POA_DECISION discloses only the rationale"
            - "the SUPERSEDED row is still returned by the list endpoint   # the trail is never destroyed"

      - name: state_seller_two_dimensions_move_independently
        claim_type: independent_dimensions
        grounds:
          - "complexity_profile.state_machine_shape (parallel)"
          - "state_machines.Seller.enforcement_state"
          - "state_machines.Seller.disbursement_state"
        excluded_because:
          difficulty_instance: non_linear_state_machine / seller_enforcement_and_disbursement_dimensions_evolve_independently
          rationale: "That §1.8 instance walks both dimensions through four combined states on one seller and asserts the one-way coupling explicitly."

      - name: state_suspension_cascade_reaches_listings_holds_and_balances
        claim_type: cascade_down
        grounds:
          - "state_machines.Seller.enforcement_state.transitions.to_SUSPENDED.side_effects"
          - "state_machines.Seller.disbursement_state.transitions.to_FULL_HOLD.side_effects"
        excluded_because:
          difficulty_instance: transitive_cascade / suspension_cascade_walks_listings_posture_holds_and_balances
          rationale: "That §1.8 instance asserts the full multi-level cascade including the release-then-mint ordering of the FULL_HOLD sweep."

      - name: state_appeal_grant_reverses_every_original_side_effect
        claim_type: compensation
        grounds:
          - "state_machines.EnforcementAction.transitions.to_VACATED.side_effects"
          - "state_machines.Seller.disbursement_state.transitions.FULL_HOLD_to_NORMAL"
        excluded_because:
          difficulty_instance: compensating_invariant / appeal_grant_restores_severity_balance_and_posture_exactly
          rationale: "That §1.8 instance asserts every reversed side effect and the absence of drift after the undo."

      - name: state_breaching_evaluation_mints_a_cross_entity_violation
        claim_type: cross_entity
        grounds:
          - "state_machines.Violation.transitions.null_to_UNDER_INVESTIGATION"
          - "endpoints[POST /sellers/{id}/health-evaluations].side_effects"
        excluded_because:
          difficulty_instance: transitive_cascade / breaching_evaluation_mints_violation_then_reserve_posture
          rationale: "That §1.8 instance asserts the auto-violation's fields, the rule selector's ranking and the resulting RESERVE_HELD posture."

      - name: state_plan_return_and_resubmit_loop_respects_the_revision_cap
        claim_type: valid_transition
        grounds:
          - "state_machines.PlanOfAction.transitions.RETURNED_FOR_REVISION_to_SUPERSEDED"
          - "state_machines.PlanOfAction.note (cyclic shape)"
        excluded_because:
          difficulty_instance: non_linear_state_machine / poa_return_resubmit_cycle_hits_revision_limit
          rationale: "That §1.8 instance drives the cycle to POA_MAX_REVISIONS and asserts the revision_count sequence plus the refusal at the cap."

      - name: state_link_confirmation_bans_the_candidate_account
        claim_type: cross_entity
        grounds:
          - "state_machines.RelatedAccountLink.transitions.DETECTED_to_CONFIRMED.side_effects"
        excluded_because:
          difficulty_instance: transitive_cascade / related_account_confirmation_bans_and_sweeps_candidate
          rationale: "That §1.8 instance asserts the ban, the listing removal sweep and the FULL_HOLD funds sweep in one chain."

  # =========================================================================
  # SECTION 3 — Calculations (§1.3)
  # =========================================================================
  - section: calculations
    instances:

      - name: calc_vacated_actions_leave_the_severity_input_set
        claim_type: input_set_filtering
        grounds:
          - "calculations.severity_points_balance.input_set"
          - "calculations.enforcement_state_target"
          - "entities.Seller.fields.reinstated_count"
        distinguishing_aspect: |
          severity_points_balance sums only actions in ISSUED / ACKNOWLEDGED / UPHELD, so vacating
          the 3.00-point action drops the balance from 5.00 to exactly 2.00 (the surviving action's
          points) and walks the posture back RESTRICTED -> WATCHLIST. The vacated row itself is not
          deleted and its own severity_points_applied is still 3.00 — the filter is on state, not
          on the stored number. reinstated_count stays 0 because the vacated action was a
          LISTING_REMOVAL, not an ACCOUNT_SUSPENSION.
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00.000Z."
            - "PolicyRule LA-SET-1 (LISTING_ACCURACY, base 2.00, ACCOUNT, requires_poa false) and PolicyRule SP-SET-1 (SHIPPING_PERFORMANCE, base 3.00, ACCOUNT, requires_poa false)."
            - "Seller has no listings, so the LISTING_REMOVAL action removes nothing."
            - "Action a1 under LA-SET-1: severity 2.00, post_balance 2.00, rung WARNING."
            - "Action a2 under SP-SET-1: prior_same_category 0 (a1 is a different category) -> repeat_factor 1.00 -> severity 3.00; prior_balance 2.00 -> post_balance 5.00 >= LADDER_RESTRICT_POINTS -> rung LISTING_REMOVAL, seller RESTRICTED."
            - "repeat_offense_count for a2 is 0, so the grant is not blocked."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00.000Z" }
              as: ComplianceOfficer
              as_user_id: "co-1"
            - call: "POST /policy-rules"
              payload: { code: "LA-SET-1", category: "LISTING_ACCURACY", base_severity_weight: 2.00, removal_scope: "ACCOUNT", requires_poa: false }
              as: ComplianceOfficer
              as_user_id: "co-1"
              captures: { rule_la: $.data.id }
            - call: "POST /policy-rules"
              payload: { code: "SP-SET-1", category: "SHIPPING_PERFORMANCE", base_severity_weight: 3.00, removal_scope: "ACCOUNT", requires_poa: false }
              as: ComplianceOfficer
              as_user_id: "co-1"
              captures: { rule_sp: $.data.id }
            - call: "POST /sellers"
              payload: { legal_name: "Harbor Tools LLC", email: "ops@harbor-tools.example", tax_id_hash: "TAX-HT-0001", payout_bank_token: "BANK-HT-0001", address_fingerprint: "ADDR-HT-0001" }
              as: Anonymous
              captures: { s_id: $.data.id }
            - call: "POST /violations"
              payload: { seller_id: "${s_id}", policy_rule_id: "${rule_la}", reporter_type: "BUYER", evidence_reference: "EV-SET-0001" }
              as: PolicyInvestigator
              as_user_id: "inv-1"
              captures: { v1: $.data.id }
            - call: "POST /violations/${v1}/open-investigation"
              payload: {}
              as: PolicyInvestigator
              as_user_id: "inv-1"
            - call: "POST /violations/${v1}/adjudicate"
              payload: { outcome: "SUBSTANTIATED" }
              as: PolicyInvestigator
              as_user_id: "inv-1"
            - call: "POST /enforcement-actions"
              payload: { violation_id: "${v1}" }
              as: PolicyInvestigator
              as_user_id: "inv-1"
              captures: { a1: $.data.id }
            - call: "POST /violations"
              payload: { seller_id: "${s_id}", policy_rule_id: "${rule_sp}", reporter_type: "PLATFORM_AUTOMATION", evidence_reference: "EV-SET-0002" }
              as: PolicyInvestigator
              as_user_id: "inv-1"
              captures: { v2: $.data.id }
            - call: "POST /violations/${v2}/open-investigation"
              payload: {}
              as: PolicyInvestigator
              as_user_id: "inv-1"
            - call: "POST /violations/${v2}/adjudicate"
              payload: { outcome: "SUBSTANTIATED" }
              as: PolicyInvestigator
              as_user_id: "inv-1"
            - call: "POST /enforcement-actions"
              payload: { violation_id: "${v2}" }
              as: PolicyInvestigator
              as_user_id: "inv-1"
              captures: { a2: $.data.id, a2_points: $.data.severity_points_applied, a2_type: $.data.action_type }
            - call: "POST /appeals"
              payload: { enforcement_action_id: "${a2}", grounds: "The late shipments were caused by a carrier outage that the platform itself published a notice about." }
              as: Seller
              as_user_id: "${s_id}"
              captures: { ap2: $.data.id }
            - call: "POST /appeals/${ap2}/start-review"
              payload: {}
              as: AppealReviewer
              as_user_id: "ar-1"
          trigger:
            - call: "POST /appeals/${ap2}/decide"
              payload: { outcome: "GRANTED", rationale: "Carrier outage was outside the seller's control and is documented by the platform." }
              as: AppealReviewer
              as_user_id: "ar-1"
              captures: { ap2_state: $.data.state, reinstated: $.data.reinstatement_granted }
          assert:
            - "${a2_points} == 3.00 and ${a2_type} == LISTING_REMOVAL"
            - "before the grant: Seller.${s_id}.severity_points_balance == 5.00 and enforcement_state == RESTRICTED"
            - "HTTP 200 and ${ap2_state} == GRANTED"
            - "${reinstated} == false   # reinstatement_granted is true only for a vacated ACCOUNT_SUSPENSION"
            - "EnforcementAction.${a2}.state == VACATED and EnforcementAction.${a2}.resolution_reason == APPEAL_GRANTED"
            - "EnforcementAction.${a2}.severity_points_applied == 3.00   # the stored figure is not zeroed; it just leaves the input set"
            - "EnforcementAction.${a1}.state == ISSUED"
            - "Seller.${s_id}.severity_points_balance == 2.00   # exactly a1's points, not 5.00 and not 0.00"
            - "Seller.${s_id}.enforcement_state == WATCHLIST and Seller.${s_id}.disbursement_state == RESERVE_HELD"
            - "Seller.${s_id}.reinstated_count == 0"

      - name: calc_decay_exempt_action_holds_full_weight_while_its_peer_halves
        claim_type: decay_function
        grounds:
          - "calculations.severity_points_balance.formula"
          - "entities.PolicyRule.fields.decay_exempt"
          - "entities.EnforcementAction.fields.decay_exempt"
          - "calculations.severity_points_applied.constants.IP_ESCALATION_MULTIPLIER"
        distinguishing_aspect: |
          Two actions of identical age, one decay_exempt and one not, must diverge: 181 days after
          issuance the LISTING_ACCURACY action counts 2.00 x 0.50 = 1.00 while the
          INTELLECTUAL_PROPERTY action still counts its full 4.50 (3.00 base x the 1.50
          RIGHTS_OWNER multiplier). The recomputed balance is therefore 1.00 + 4.50 + 2.50 = 8.00;
          the wrong reading that decays every row alike yields 5.75. Note also that decay changes
          the BALANCE only — the repeat_factor of the new action still counts the decayed action in
          full (1 prior LISTING_ACCURACY action -> 1.25).
        test_recipe:
          setup:
            - "Clock at 2026-01-01T00:00:00.000Z for both original issuances."
            - "PolicyRule LA-DECAY-1 (LISTING_ACCURACY, base 2.00, ACCOUNT, requires_poa false, decay_exempt false) and PolicyRule IP-DECAY-1 (INTELLECTUAL_PROPERTY, base 3.00, ACCOUNT, requires_poa false, decay_exempt true by derivation)."
            - "a1 under LA-DECAY-1 (BUYER report): severity 2.00, post_balance 2.00."
            - "a2 under IP-DECAY-1 with reporter_type RIGHTS_OWNER: raw = 3.00 x 1.00 x 1.50 = 4.50, severity 4.50, post_balance 6.50, seller RESTRICTED."
            - "Clock then moves to 2026-07-01T00:00:00.000Z: age 181 days for both (>= DECAY_TIER1_DAYS 180, < DECAY_TIER2_DAYS 365)."
            - "A third violation under LA-DECAY-1 is carried to SUBSTANTIATED so its issuance forces the balance recompute at the new clock reading."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-01T00:00:00.000Z" }
              as: ComplianceOfficer
              as_user_id: "co-1"
            - call: "POST /policy-rules"
              payload: { code: "LA-DECAY-1", category: "LISTING_ACCURACY", base_severity_weight: 2.00, removal_scope: "ACCOUNT", requires_poa: false }
              as: ComplianceOfficer
              as_user_id: "co-1"
              captures: { rule_la: $.data.id }
            - call: "POST /policy-rules"
              payload: { code: "IP-DECAY-1", category: "INTELLECTUAL_PROPERTY", base_severity_weight: 3.00, removal_scope: "ACCOUNT", requires_poa: false }
              as: ComplianceOfficer
              as_user_id: "co-1"
              captures: { rule_ip: $.data.id }
            - call: "POST /sellers"
              payload: { legal_name: "Harbor Tools LLC", email: "ops@harbor-tools.example", tax_id_hash: "TAX-HT-0001", payout_bank_token: "BANK-HT-0001", address_fingerprint: "ADDR-HT-0001" }
              as: Anonymous
              captures: { s_id: $.data.id }
            - call: "POST /violations"
              payload: { seller_id: "${s_id}", policy_rule_id: "${rule_la}", reporter_type: "BUYER", evidence_reference: "EV-DECAY-0001" }
              as: PolicyInvestigator
              as_user_id: "inv-1"
              captures: { v1: $.data.id }
            - call: "POST /violations/${v1}/open-investigation"
              payload: {}
              as: PolicyInvestigator
              as_user_id: "inv-1"
            - call: "POST /violations/${v1}/adjudicate"
              payload: { outcome: "SUBSTANTIATED" }
              as: PolicyInvestigator
              as_user_id: "inv-1"
            - call: "POST /enforcement-actions"
              payload: { violation_id: "${v1}" }
              as: PolicyInvestigator
              as_user_id: "inv-1"
              captures: { a1: $.data.id, a1_points: $.data.severity_points_applied }
            - call: "POST /violations"
              payload: { seller_id: "${s_id}", policy_rule_id: "${rule_ip}", reporter_type: "RIGHTS_OWNER", evidence_reference: "EV-DECAY-0002" }
              as: PolicyInvestigator
              as_user_id: "inv-1"
              captures: { v2: $.data.id }
            - call: "POST /violations/${v2}/open-investigation"
              payload: {}
              as: PolicyInvestigator
              as_user_id: "inv-1"
            - call: "POST /violations/${v2}/adjudicate"
              payload: { outcome: "SUBSTANTIATED" }
              as: PolicyInvestigator
              as_user_id: "inv-1"
            - call: "POST /enforcement-actions"
              payload: { violation_id: "${v2}" }
              as: PolicyInvestigator
              as_user_id: "inv-1"
              captures: { a2: $.data.id, a2_points: $.data.severity_points_applied, a2_exempt: $.data.decay_exempt }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-01T00:00:00.000Z" }
              as: ComplianceOfficer
              as_user_id: "co-1"
            - call: "POST /violations"
              payload: { seller_id: "${s_id}", policy_rule_id: "${rule_la}", reporter_type: "BUYER", evidence_reference: "EV-DECAY-0003" }
              as: PolicyInvestigator
