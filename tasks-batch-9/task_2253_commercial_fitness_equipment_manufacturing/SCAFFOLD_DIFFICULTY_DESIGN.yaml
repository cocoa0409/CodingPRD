- rule_id: transitive_cascade
  instances:
  - name: firmware_withdraw_cascade_six_levels
    grounds:
    - state_machines.FirmwareRelease.ACTIVE_to_WITHDRAWN
    - state_machines.FirmwareCertification.CERTIFIED_to_REVOKED
    - state_machines.PMProgram.ACTIVE_to_NEEDS_REVISION
    - state_machines.MaintenanceVisit.SCHEDULED_to_ON_HOLD
    - calculations.asset_support_window
    - calculations.spare_stock_ledger
    - calculations.partner_capacity_rollup
    - entities.SerializedAsset.fields.connectivity_support_status
    - entities.PMProgram.fields.needs_revision_reason
    - endpoints[POST /firmware-releases/{id}/withdraw]
    distinguishing_aspect: One withdraw call propagates through six distinct entity levels in a single request — FirmwareRelease -> FirmwareCertification (REVOKED) -> SerializedAsset (FIRMWARE_REVOKED with
      support_gap_days 1095) -> PMProgram (NEEDS_REVISION / FIRMWARE_REVOKED) -> MaintenanceVisit (ON_HOLD) -> ServicePartner spare-stock ledger (3 reserved units released) — and the asset's support horizon
      collapses to withdrawn_at rather than the revision's sunset commitment.
    test_recipe:
      setup:
      - Logical clock at the default 2026-08-01T00:00:00Z throughout.
      - C700 Connected Bike (CONNECTED / FULL_COMMERCIAL / 561325 cents / 96.5 kg / CONSOLE_T2) has RELEASED revision C700-R1 with CERTIFIED firmware FW-2.1.0.
      - Facility f1 (Z1) took delivery of one C700 unit (order total 639000 cents); asset a1 is IN_SERVICE with FW-2.1.0 loaded and connectivity_support_status SUPPORTED.
      - The revision has never been sunset, so firmware_support_until is null and support_gap_days is 0 before the withdrawal.
      - PMProgram pm1 (PRO, 90-day interval) is ACTIVE for facility f1 with partner p1 and annual_labor_hours_committed 8.75.
      - Partner p1 received 20 spare units and MaintenanceVisit v1 holds 3 of them (SCHEDULED, on_hand 17).
      setup_api_calls:
      - call: POST /equipment-models
        payload: {name: C700 Connected Bike, category: CONNECTED, duty_class: FULL_COMMERCIAL, unit_list_price_cents: 561325, shipping_weight_kg: 96.5, allowed_finish_codes: [GRAPHITE, CUSTOM_BRAND_DECAL],
          console_platform: CONSOLE_T2}
        as: ProductEngineer
        captures: {m1: $.data.id, m1_v: $.data.version}
      - call: POST /model-revisions
        payload: {equipment_model_id: '${m1}', revision_code: C700-R1, target_cycle_count: 600000, expected_equipment_model_version: '${m1_v}'}
        as: ProductEngineer
        captures: {r1: $.data.id}
      - call: POST /model-revisions/${r1}/submit-for-testing
        payload: {}
        as: ProductEngineer
      - call: POST /test-rigs
