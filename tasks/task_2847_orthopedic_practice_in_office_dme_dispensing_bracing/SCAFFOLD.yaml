scenario: "2847. Orthopedic Practice In-Office DME Dispensing & Bracing (orthopedic group): brace and durable medical equipment inventory par levels by clinic and specialty, supplier standards and accreditation requirements for in-office dispensing, patient fitting documentation, medical necessity notes and delivery signature, insurance coverage verification, prior authorization and same-or-similar equipment checks, advance beneficiary notice for non-covered items and cash pricing, product return, restocking and refitting policies, physician self-referral compliance for in-office ancillary services, custom-fabricated device ordering and turnaround"


domain_name: "orthopedic-in-office-dme-dispensing"
api_prefix: "/dme"

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: quota_allocation
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers
    - derived_field_reconciliation

  entity_topology: graph
  # graph: DeviceProduct and Clinic are joined many-to-many through ClinicParLevel;
  # DispenseEncounter carries five outbound references plus a self-referential
  # refit edge (refit_of_encounter_id -> DispenseEncounter.id); ProductReturn and
  # CoverageVerification each carry a second edge back into DispenseEncounter.

  state_machine_shape: parallel
  # DispenseEncounter carries two independent state dimensions on one row
  # (clinical_status x financial_status). CustomFabOrder.status is cyclic
  # (ADJUSTMENT_REQUESTED -> IN_FABRICATION -> READY_FOR_FITTING -> ...),
  # PriorAuthRequest.status is cyclic through appeal rounds, ProductReturn.status
  # is a fork-join diamond (REQUESTED -> {RESTOCKED, DESTROYED} -> REFIT_ISSUED),
  # ClinicParLevel.stock_posture and Clinic.dispensing_status are compound
  # (derived from children).

  relationship_patterns:
    - one_to_many
    - many_to_many
    - self_referential
    - cross_aggregate

  role_model: segregation_of_duties
  # Peer role ownership per resource type, plus two hard segregation rules keyed
  # on X-User-ID: the physician who attests in-office-ancillary-services
  # supervision must not be the ordering physician, and the fitter who issues a
  # refit must not be the fitter who performed the original fitting.

  consistency_model: immediate

  difficulty_level: expert_plus
  # 15 entities / 47 endpoints / 38 error codes / 7 calculations (3 carrying
  # variants) / 8 state machines / 2 OCC rules.

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# ---------------------------------------------------------------------------
# §1.1 Entity-Relationship Table
# ---------------------------------------------------------------------------
entities:
  - name: Clinic
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: "Clinic site name."
        constraints: "1-120 chars, non-blank"
      - name: state_code
        type: string
        source: input
        description: "Two-letter US state code of the dispensing site."
        constraints: "exactly 2 uppercase letters"
      - name: accreditation_body
        type: enum
        source: input
        description: "Accrediting organization that surveyed this site for DMEPOS in-office dispensing."
        constraints: "one of {ABC, BOC, ACHC, NONE}"
      - name: accreditation_expires_on
        type: string
        source: input
        description: "Calendar date on which the site's DMEPOS accreditation lapses; inclusive (valid while accreditation_expires_on >= logical clock date)."
        constraints: "ISO-8601 calendar date YYYY-MM-DD"
      - name: ioas_supervision_level
        type: enum
        source: input
        description: "Highest physician-supervision level the site can furnish for in-office ancillary services (IOAS). DIRECT outranks GENERAL."
        constraints: "one of {DIRECT, GENERAL}"
      - name: dispensing_specialties
        type: array
        source: input
        description: "Specialty lines this site is licensed to stock and dispense; gates par-level creation and encounter creation."
        constraints: "non-empty array of {SPORTS_MEDICINE, SPINE, FOOT_ANKLE, HAND, TOTAL_JOINT}; no duplicates"
      - name: dispensing_status
        type: enum
        source: computed
        description: "Compound posture derived from this clinic's ClinicParLevel children by calculations.clinic_dispensing_posture. Gates child operations."
        default: "ACTIVE"
        constraints: "one of {ACTIVE, RESTRICTED, SUSPENDED}"
      - name: stockout_par_level_count
        type: integer
        source: computed
        description: "Count of this clinic's ClinicParLevel rows whose stock_posture == STOCKOUT; the input to dispensing_status."
        default: 0
        constraints: ">= 0"

  - name: Physician
    parent: Clinic
    common_fields: true
    fields:
      - name: clinic_id
        type: string
        source: input
        description: "FK -> Clinic.id; the site at which this physician orders in-office DME. Taken from the path, not the body."
      - name: full_name
        type: string
        source: input
        description: "Ordering physician name."
        constraints: "1-120 chars, non-blank"
      - name: npi
        type: string
        source: input
        description: "National Provider Identifier."
        constraints: "exactly 10 digits; unique across all Physician rows"
      - name: specialty
        type: enum
        source: input
        description: "Physician's orthopedic sub-specialty; must equal DeviceProduct.specialty on every encounter this physician orders."
        constraints: "one of {SPORTS_MEDICINE, SPINE, FOOT_ANKLE, HAND, TOTAL_JOINT}"
      - name: group_member
        type: boolean
        source: input
        description: "True when the physician is a member of the orthopedic group that owns the clinic (Stark in-office ancillary services exception precondition)."
        default: true
      - name: stark_disclosure_on_file
        type: boolean
        source: input
        description: "True when the physician's written self-referral (Stark) financial-relationship disclosure is on file for this site."
        default: false

  - name: Fitter
    parent: Clinic
    common_fields: true
    fields:
      - name: clinic_id
        type: string
        source: input
        description: "FK -> Clinic.id; the site where this fitter is credentialed. Taken from the path, not the body."
      - name: full_name
        type: string
        source: input
        description: "Fitter / orthotist name."
        constraints: "1-120 chars, non-blank"
      - name: credential
        type: enum
        source: input
        description: "Fitting credential held. NONE means the person may not perform any fitting."
        constraints: "one of {CO, CPO, CFO, CFm, NONE}"
      - name: credential_expires_on
        type: string
        source: input
        description: "Calendar date on which the fitting credential lapses; inclusive (valid while credential_expires_on >= logical clock date)."
        constraints: "ISO-8601 calendar date YYYY-MM-DD"
      - name: privilege_scope
        type: enum
        source: input
        description: "Which DeviceProduct categories this fitter may fit. OFF_SHELF_ONLY covers category OFF_SHELF_PREFAB only; CUSTOM_AND_OFF_SHELF covers all three categories."
        constraints: "one of {OFF_SHELF_ONLY, CUSTOM_AND_OFF_SHELF}"
      - name: fitting_minutes_booked
        type: integer
        source: computed
        description: "Denormalized sum of FittingRecord.fitting_minutes over all FittingRecord rows with this fitter_id; recomputed on every fitting-record creation."
        default: 0
        constraints: ">= 0"

  - name: Supplier
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: "DMEPOS supplier / central fabrication vendor name."
        constraints: "1-120 chars, non-blank"
      - name: accreditation_body
        type: enum
        source: input
        description: "Accrediting organization for the supplier."
        constraints: "one of {ABC, BOC, ACHC, NONE}"
      - name: accreditation_expires_on
        type: string
        source: input
        description: "Calendar date on which the supplier's accreditation lapses; inclusive."
        constraints: "ISO-8601 calendar date YYYY-MM-DD"
      - name: dmepos_standards_attested
        type: boolean
        source: input
        description: "True when the supplier has attested to the DMEPOS supplier standards required for in-office dispensing."
        default: false
      - name: custom_fab_capable
        type: boolean
        source: input
        description: "True when the supplier can accept custom-fabricated device orders."
        default: false
      - name: quality_hold
        type: boolean
        source: input
        description: "True while the practice has placed the supplier on quality hold; set through POST /dme/suppliers/{id}/standards-attestation."
        default: false
      - name: promised_turnaround_days
        type: integer
        source: input
        description: "Contractual calendar-day turnaround the supplier promises for custom fabrication; the baseline of both turnaround-score variants."
        constraints: ">= 1"
      - name: turnaround_score
        type: integer
        source: computed
        description: "Final supplier reliability score produced by calculations.supplier_turnaround_score variant elapsed_basis. 100 until the supplier's first ACCEPTED CustomFabOrder."
        default: 100
        constraints: "0 <= turnaround_score <= 100"
      - name: accepted_fab_order_count
        type: integer
        source: computed
        description: "Count of CustomFabOrder rows for this supplier with status == ACCEPTED; the denominator of turnaround_score."
        default: 0
        constraints: ">= 0"

  - name: DeviceProduct
    parent: null
    common_fields: true
    fields:
      - name: supplier_id
        type: string
        source: input
        description: "FK -> Supplier.id; the supplier of record for this catalog item."
      - name: hcpcs_code
        type: string
        source: input
        description: "HCPCS code billed for this brace / DME item."
        constraints: "1-8 chars, non-blank"
      - name: description
        type: string
        source: input
        description: "Catalog description."
        constraints: "1-200 chars, non-blank"
      - name: category
        type: enum
        source: input
        description: "Dispensing category. OFF_SHELF_PREFAB and CUSTOM_FITTED_PREFAB are drawn from clinic par stock; CUSTOM_FABRICATED must be ordered from a supplier."
        constraints: "one of {OFF_SHELF_PREFAB, CUSTOM_FITTED_PREFAB, CUSTOM_FABRICATED}"
      - name: specialty
        type: enum
        source: input
        description: "Specialty line this item belongs to; must be a member of Clinic.dispensing_specialties and must equal Physician.specialty of the ordering physician."
        constraints: "one of {SPORTS_MEDICINE, SPINE, FOOT_ANKLE, HAND, TOTAL_JOINT}"
      - name: same_or_similar_group
        type: string
        source: input
        description: "Same-or-similar equipment grouping key; two products sharing this value are same-or-similar for the reasonable-useful-lifetime lookback."
        constraints: "1-40 chars, non-blank, uppercase"
      - name: reasonable_useful_lifetime_months
        type: integer
        source: input
        description: "Reasonable useful lifetime (RUL) in whole months; the width of the half-open same-or-similar occupation window."
        constraints: ">= 1"
      - name: allowed_amount_cents
        type: integer
        source: input
        description: "Payer allowed amount per unit, in cents; the basis of the insurance_assigned responsibility variant."
        constraints: ">= 0"
      - name: cash_price_cents
        type: integer
        source: input
        description: "Posted cash (self-pay) price per unit, in cents; the basis of the abn_cash_selfpay responsibility variant and of uncovered excess units."
        constraints: ">= 0"
      - name: unit_cost_cents
        type: integer
        source: input
        description: "Acquisition cost per unit in cents; carried for margin reporting only, never used in patient pricing."
        constraints: ">= 0"
      - name: requires_prior_auth
        type: boolean
        source: input
        description: "True when the payer requires prior authorization before this item may be dispensed under insurance."
        default: false
      - name: ioas_supervision_required
        type: enum
        source: input
        description: "Minimum IOAS supervision level required to furnish this item in office. DIRECT requires both Clinic.ioas_supervision_level == DIRECT and an observed level of DIRECT."
        default: "GENERAL"
        constraints: "one of {DIRECT, GENERAL}"

  - name: ClinicParLevel
    parent: Clinic
    common_fields: true
    fields:
      - name: clinic_id
        type: string
        source: input
        description: "FK -> Clinic.id; the stocking site."
      - name: product_id
        type: string
        source: input
        description: "FK -> DeviceProduct.id; the stocked catalog item."
      - name: par_min_qty
        type: integer
        source: input
        description: "Minimum on-shelf availability the site must maintain; the threshold input of calculations.par_stock_posture."
        constraints: ">= 1"
      - name: par_max_qty
        type: integer
        source: input
        description: "Maximum stocking level for the site; a stock receipt that would push on_hand_qty above it is rejected."
        constraints: ">= par_min_qty"
      - name: on_hand_qty
        type: integer
        source: system
        description: "Physical units on the shelf. Increased by stock receipts and by restocked returns; decreased at dispense."
        default: 0
        constraints: ">= 0"
      - name: reserved_qty
        type: integer
        source: system
        description: "Units committed to encounters whose clinical_status is RESERVED or FITTED but not yet DELIVERED."
        default: 0
        constraints: ">= 0"
      - name: available_qty
        type: integer
        source: computed
        description: "on_hand_qty - reserved_qty; may not be negative."
        default: 0
        constraints: ">= 0"
      - name: stock_posture
        type: enum
        source: computed
        description: "Threshold posture produced by calculations.par_stock_posture from on_hand_qty and par_min_qty. Reservations never move it; only dispenses, stock receipts and restocked returns do."
        default: "STOCKOUT"
        constraints: "one of {OK, BELOW_PAR, CRITICAL, STOCKOUT}"
      - name: lifetime_received_qty
        type: integer
        source: system
        description: "Cumulative units ever received into this par level (initial stock plus every stock receipt); the constant side of the units-accounted invariant."
        default: 0
        constraints: ">= 0"
    constraints: "unique (clinic_id, product_id)"

  - name: Patient
    parent: Clinic
    common_fields: true
    fields:
      - name: clinic_id
        type: string
        source: input
        description: "FK -> Clinic.id; the patient's home site."
      - name: full_name
        type: string
        source: input
        description: "Patient name."
        constraints: "1-120 chars, non-blank"
      - name: dob
        type: string
        source: input
        description: "Patient date of birth."
        constraints: "ISO-8601 calendar date YYYY-MM-DD"
      - name: payer_type
        type: enum
        source: input
        description: "Primary payer class."
        constraints: "one of {MEDICARE, MEDICAID, COMMERCIAL, SELF_PAY}"
      - name: member_id
        type: string
        source: input
        description: "Payer member identifier; null for SELF_PAY."
        default: null
      - name: medicare_beneficiary
        type: boolean
        source: input
        description: "True when the patient is a Medicare beneficiary, which makes an advance beneficiary notice mandatory before any non-covered item may be dispensed."
        default: false

  - name: DispenseEncounter
    parent: null
    common_fields: true
    fields:
      - name: clinic_id
        type: string
        source: input
        description: "FK -> Clinic.id; the dispensing site."
      - name: patient_id
        type: string
        source: input
        description: "FK -> Patient.id; the patient receiving the device."
      - name: product_id
        type: string
        source: input
        description: "FK -> DeviceProduct.id; the catalog item being dispensed."
      - name: ordering_physician_id
        type: string
        source: input
        description: "FK -> Physician.id; the group physician who ordered the device. Supplied in the creation body so a PracticeAdmin can open the encounter on a physician's behalf; the named Physician must belong to the encounter's clinic and its specialty must equal the product's specialty."
      - name: mn_physician_id
        type: string
        source: system
        description: "FK -> Physician.id; stamped from X-User-ID of the OrthoPhysician who signed the medical-necessity note. Null until the note is signed."
        default: null
      - name: ioas_attesting_physician_id
        type: string
        source: system
        description: "FK -> Physician.id; stamped from X-User-ID of the OrthoPhysician who attested IOAS supervision. Must differ from ordering_physician_id."
        default: null
      - name: fitter_id
        type: string
        source: system
        description: "FK -> Fitter.id; stamped from X-User-ID of the DmeFitter who created the encounter's latest FittingRecord. Null until first fitting."
        default: null
      - name: refit_of_encounter_id
        type: string
        source: system
        description: "FK -> DispenseEncounter.id; set only on encounters created by POST /dme/returns/{id}/refit, pointing at the returned encounter. Null on original encounters."
        default: null
      - name: quantity
        type: integer
        source: input
        description: "Units of the product to dispense on this encounter."
        constraints: ">= 1 and <= 20"
      - name: service_date
        type: string
        source: input
        description: "Date of service. Defaults to the logical clock's calendar date at creation."
        default: "logical clock date at creation"
        constraints: "ISO-8601 calendar date YYYY-MM-DD"
      - name: clinical_status
        type: enum
        source: computed
        description: "First independent state dimension: documentation / fitting / delivery progress. Advances only through state_machines.DispenseEncounter clinical dimension."
        default: "DRAFT"
        constraints: "one of {DRAFT, DOCUMENTED, AWAITING_DEVICE, RESERVED, FITTED, DELIVERED, RETURN_PENDING, RETURNED, VOIDED}"
      - name: financial_status
        type: enum
        source: computed
        description: "Second independent state dimension: coverage / authorization / ABN / billing progress. Advances independently of clinical_status."
        default: "UNVERIFIED"
        constraints: "one of {UNVERIFIED, VERIFIED, NON_COVERED, AUTH_PENDING, AUTH_APPROVED, AUTH_DENIED, ABN_ISSUED, SELF_PAY, BILLED, REFUNDED, WRITTEN_OFF}"
      - name: compliance_hold
        type: boolean
        source: system
        description: "True while a cascaded compliance event blocks further progress on this encounter."
        default: false
      - name: hold_reason
        type: enum
        source: system
        description: "Why compliance_hold is true; null when compliance_hold is false."
        default: null
        constraints: "one of {CLINIC_SUSPENDED, SUPPLIER_QUALITY_HOLD} or null"
      - name: mn_diagnosis_code
        type: string
        source: system
        description: "ICD-10 diagnosis code copied from the medical-necessity note body."
        default: null
      - name: mn_functional_deficit
        type: string
        source: system
        description: "Free-text functional deficit statement from the medical-necessity note."
        default: null
      - name: mn_expected_duration_months
        type: integer
        source: system
        description: "Expected months of medical need from the medical-necessity note."
        default: null
      - name: mn_signed_at
        type: datetime
        source: system
        description: "Logical-clock instant at which the medical-necessity note was signed. Null while unsigned."
        default: null
      - name: ioas_attested_at
        type: datetime
        source: system
        description: "Logical-clock instant of the IOAS self-referral supervision attestation. Null while unattested."
        default: null
      - name: ioas_supervision_level_observed
        type: enum
        source: system
        description: "Supervision level the attesting physician observed at the time of furnishing."
        default: null
        constraints: "one of {DIRECT, GENERAL} or null"
      - name: delivered_at
        type: datetime
        source: system
        description: "Logical-clock instant at which the device was handed to the patient (clinical_status -> DELIVERED). Anchors the same-or-similar occupation window and the return windows."
        default: null
      - name: delivery_signature_role
        type: enum
        source: system
        description: "Who signed for delivery. REFUSED blocks the dispense."
        default: null
        constraints: "one of {PATIENT, CAREGIVER, REFUSED} or null"
      - name: covered_units
        type: integer
        source: computed
        description: "Units the payer will cover on this encounter, per calculations.patient_responsibility step 1. Equals quantity when the product needs no prior authorization."
        default: 0
        constraints: "0 <= covered_units <= quantity"
      - name: patient_responsibility_cents
        type: integer
        source: computed
        description: "Patient's out-of-pocket amount in cents, produced by calculations.patient_responsibility at dispense under the variant named in responsibility_variant."
        default: 0
        constraints: ">= 0"
      - name: billable_amount_cents
        type: integer
        source: computed
        description: "Amount claimed from the payer in cents, produced by the same calculation. Zero on self-pay-only paths and reset to 0 when the encounter reaches REFUNDED or WRITTEN_OFF."
        default: 0
        constraints: ">= 0"
      - name: responsibility_variant
        type: enum
        source: computed
        description: "Which variant of calculations.patient_responsibility produced the two money fields. Null until dispense."
        default: null
        constraints: "one of {INSURANCE_ASSIGNED, ABN_CASH_SELFPAY} or null"

  - name: CoverageVerification
    parent: DispenseEncounter
    common_fields: false
    fields:
      - name: encounter_id
        type: string
        source: input
        description: "FK -> DispenseEncounter.id; the encounter whose coverage was verified. Taken from the path, not the body."
      - name: verification_seq
        type: integer
        source: system
        description: "1-based monotonically increasing sequence within the encounter. The encounter's effective verification is the row with the greatest verification_seq; never selected by id."
        constraints: ">= 1"
      - name: covered
        type: boolean
        source: input
        description: "Payer's coverage answer for this item on this patient."
      - name: deductible_remaining_cents
        type: integer
        source: input
        description: "Patient's remaining deductible in cents as quoted by the payer."
        constraints: ">= 0"
      - name: coinsurance_pct
        type: number
        source: input
        description: "Patient coinsurance fraction applied after the deductible is exhausted."
        constraints: "0 <= coinsurance_pct <= 1, at most 4 decimal places"
      - name: valid_for_days
        type: integer
        source: input
        description: "Number of whole days the payer's quote stays usable; sets expires_at."
        constraints: ">= 1 and <= 90"
      - name: allowed_amount_cents_snapshot
        type: integer
        source: computed
        description: "DeviceProduct.allowed_amount_cents captured at verification time; the encounter prices from this snapshot, not from a later catalog edit."
        constraints: ">= 0"
      - name: same_or_similar_conflict
        type: boolean
        source: computed
        description: "True when calculations.same_or_similar_lookback finds a DELIVERED same-group device still inside its reasonable useful lifetime."
        default: false
      - name: prior_delivered_encounter_id
        type: string
        source: computed
        description: "FK -> DispenseEncounter.id; the same-or-similar predecessor selected by calculations.same_or_similar_lookback. Null when the candidate set is empty."
        default: null
      - name: prior_delivered_on
        type: string
        source: computed
        description: "Calendar date of the selected predecessor's delivered_at. Null when the candidate set is empty."
        default: null
      - name: months_since_prior_delivery
        type: integer
        source: computed
        description: "Whole calendar months elapsed from prior_delivered_on to the logical clock date, floored. Null when the candidate set is empty."
        default: null
      - name: verified_at
        type: datetime
        source: system
        description: "Logical-clock instant of verification."
      - name: expires_at
        type: datetime
        source: system
        description: "verified_at plus valid_for_days whole days. The quote is usable while logical clock <= expires_at."

  - name: PriorAuthRequest
    parent: DispenseEncounter
    common_fields: true
    fields:
      - name: encounter_id
        type: string
        source: input
        description: "FK -> DispenseEncounter.id; the encounter this authorization covers. Taken from the path, not the body. At most one PriorAuthRequest per encounter."
      - name: requested_units
        type: integer
        source: input
        description: "Units requested from the payer."
        constraints: ">= 1 and <= 20"
      - name: status
        type: enum
        source: computed
        description: "Authorization lifecycle; cycles back to SUBMITTED on appeal."
        default: "SUBMITTED"
        constraints: "one of {SUBMITTED, APPROVED, DENIED, PENDED, EXPIRED}"
      - name: approved_units
        type: integer
        source: system
        description: "Units the payer approved; null unless status has been APPROVED at least once."
        default: null
        constraints: "0 <= approved_units <= requested_units"
      - name: auth_number
        type: string
        source: system
        description: "Payer authorization number recorded on approval."
        default: null
      - name: appeal_round
        type: integer
        source: system
        description: "How many appeals have been filed. Capped at APPEAL_ROUND_LIMIT."
        default: 0
        constraints: "0 <= appeal_round <= 2"
      - name: decision_at
        type: datetime
        source: system
        description: "Logical-clock instant of the most recent payer decision."
        default: null
      - name: expires_at
        type: datetime
        source: system
        description: "Instant after which an APPROVED authorization is no longer usable; null unless approved."
        default: null

  - name: AbnNotice
    parent: DispenseEncounter
    common_fields: true
    fields:
      - name: encounter_id
        type: string
        source: input
        description: "FK -> DispenseEncounter.id; the encounter the advance beneficiary notice belongs to. Taken from the path, not the body."
      - name: notice_seq
        type: integer
        source: system
        description: "1-based monotonically increasing sequence within the encounter. The effective notice is the row with the greatest notice_seq; issuing a new notice moves every earlier ISSUED row to VOIDED."
        constraints: ">= 1"
      - name: reason_non_covered
        type: enum
        source: input
        description: "Statutory reason the item is expected to be non-covered."
        constraints: "one of {NOT_MEDICALLY_NECESSARY, SAME_OR_SIMILAR_IN_LIFETIME, NON_COVERED_ITEM, AUTH_DENIED, UNITS_EXCEED_AUTH}"
      - name: status
        type: enum
        source: computed
        description: "Notice lifecycle."
        default: "ISSUED"
        constraints: "one of {ISSUED, SIGNED, DECLINED, VOIDED}"
      - name: option_selected
        type: enum
        source: system
        description: "Beneficiary's option box. OPTION_1 = want the item and bill the payer; OPTION_2 = want the item, do not bill the payer; OPTION_3 = do not want the item."
        default: null
        constraints: "one of {OPTION_1, OPTION_2, OPTION_3} or null"
      - name: signed_by
        type: enum
        source: system
        description: "Who signed the notice."
        default: null
        constraints: "one of {PATIENT, CAREGIVER} or null"
      - name: patient_signed_at
        type: datetime
        source: system
        description: "Logical-clock instant of signature."
        default: null
      - name: witness_user_id
        type: string
        source: system
        description: "X-User-ID of the acting InsuranceCoordinator who issued the notice. Opaque operator identifier for audit only; it is not a resolvable foreign key to any entity."
      - name: unit_net_price_cents
        type: integer
        source: computed
        description: "Per-unit cash price after the prompt-pay tier discount, rounded to whole cents. Step 2 of calculations.abn_cash_quote."
        constraints: ">= 0"
      - name: estimated_subtotal_cents
        type: integer
        source: computed
        description: "unit_net_price_cents * encounter.quantity. Step 3 of calculations.abn_cash_quote."
        constraints: ">= 0"
      - name: dispensing_fee_cents
        type: integer
        source: computed
        description: "Flat dispensing fee, waived when estimated_subtotal_cents reaches the waiver threshold. Step 4 of calculations.abn_cash_quote, keyed on the subtotal and never on the total."
        constraints: "0 or 2500"
      - name: estimated_cost_cents
        type: integer
        source: computed
        description: "estimated_subtotal_cents + dispensing_fee_cents; the cash figure disclosed on the notice and the patient responsibility under the abn_cash_selfpay variant."
        constraints: ">= 0"

  - name: FittingRecord
    parent: DispenseEncounter
    common_fields: true
    fields:
      - name: encounter_id
        type: string
        source: input
        description: "FK -> DispenseEncounter.id; the encounter being fitted. Taken from the path, not the body."
      - name: fitter_id
        type: string
        source: system
        description: "FK -> Fitter.id; stamped from X-User-ID of the acting DmeFitter. Never accepted from the body."
      - name: fitting_start_at
        type: datetime
        source: input
        description: "Start instant of the fitting appointment; occupies an interval on the fitter resource."
        constraints: "ISO-8601 UTC instant with three fractional digits"
      - name: fitting_end_at
        type: datetime
        source: input
        description: "End instant of the fitting appointment; must be strictly after fitting_start_at."
        constraints: "ISO-8601 UTC instant with three fractional digits"
      - name: fitting_minutes
        type: integer
        source: computed
        description: "Whole minutes from fitting_start_at to fitting_end_at, rounded up."
        constraints: ">= 1"
      - name: measurement_set
        type: object
        source: input
        description: "Recorded anthropometric measurements; opaque key/value map persisted verbatim as the fitting documentation."
        constraints: "non-empty object"
      - name: fit_outcome
        type: enum
        source: input
        description: "Fitter's verdict. ACCEPTABLE advances the encounter to FITTED; ADJUST_NEEDED leaves the encounter where it was; REJECTED sends it back for a new device decision."
        constraints: "one of {ACCEPTABLE, ADJUST_NEEDED, REJECTED}"
      - name: delivery_signature_role
        type: enum
        source: system
        description: "Delivery signature role captured on this fitting record when the encounter is dispensed."
        default: null
        constraints: "one of {PATIENT, CAREGIVER, REFUSED} or null"
      - name: delivery_signed_at
        type: datetime
        source: system
        description: "Logical-clock instant at which the delivery signature was captured."
        default: null

  - name: CustomFabOrder
    parent: DispenseEncounter
    common_fields: true
    fields:
      - name: encounter_id
        type: string
        source: input
        description: "FK -> DispenseEncounter.id; the encounter awaiting the custom-fabricated device. Taken from the path, not the body."
      - name: supplier_id
        type: string
        source: input
        description: "FK -> Supplier.id; the central-fabrication supplier the order is placed with."
      - name: status
        type: enum
        source: computed
        description: "Fabrication lifecycle. ADJUSTMENT_REQUESTED cycles back to IN_FABRICATION."
        default: "SUBMITTED"
        constraints: "one of {SUBMITTED, IN_FABRICATION, READY_FOR_FITTING, ADJUSTMENT_REQUESTED, ACCEPTED, SUPPLIER_HOLD, CANCELLED}"
      - name: submitted_at
        type: datetime
        source: system
        description: "Logical-clock instant the order was placed; the start of both turnaround measures."
      - name: promised_delivery_on
        type: string
        source: computed
        description: "Calendar date submitted_at plus Supplier.promised_turnaround_days whole days, snapshotted at submission."
        constraints: "ISO-8601 calendar date YYYY-MM-DD"
      - name: promised_turnaround_days_snapshot
        type: integer
        source: computed
        description: "Supplier.promised_turnaround_days captured at submission; both score variants use this snapshot rather than the live supplier field."
        constraints: ">= 1"
      - name: first_delivered_at
        type: datetime
        source: system
        description: "Logical-clock instant of the FIRST delivery of the device to the clinic. Never overwritten by later adjustment deliveries."
        default: null
      - name: accepted_at
        type: datetime
        source: system
        description: "Logical-clock instant at which the fitter accepted the device."
        default: null
      - name: adjustment_rounds
        type: integer
        source: system
        description: "How many times the fitter sent the device back for adjustment. Capped at FAB_ADJUSTMENT_ROUND_LIMIT."
        default: 0
        constraints: "0 <= adjustment_rounds <= 2"
      - name: first_delivery_days
        type: integer
        source: computed
        description: "Whole days from submitted_at to first_delivered_at, rounded up. Input to the promised_basis score variant."
        default: null
      - name: total_elapsed_days
        type: integer
        source: computed
        description: "Whole days from submitted_at to accepted_at, rounded up. Input to the elapsed_basis score variant."
        default: null
      - name: projected_turnaround_score
        type: integer
        source: computed
        description: "Order-level score from calculations.supplier_turnaround_score variant promised_basis; ignores adjustment rounds entirely."
        default: null
        constraints: "0 <= projected_turnaround_score <= 100"
      - name: final_turnaround_score
        type: integer
        source: computed
        description: "Order-level score from variant elapsed_basis; penalizes both total elapsed lateness and each adjustment round. Averaged into Supplier.turnaround_score."
        default: null
        constraints: "0 <= final_turnaround_score <= 100"

  - name: ProductReturn
    parent: DispenseEncounter
    common_fields: true
    fields:
      - name: encounter_id
        type: string
        source: input
        description: "FK -> DispenseEncounter.id; the delivered encounter being returned. Taken from the path, not the body. At most one ProductReturn per encounter."
      - name: reason
        type: enum
        source: input
        description: "Return reason; selects both the return window and the restocking fee tier."
        constraints: "one of {POOR_FIT, DEFECT, WRONG_ITEM, PATIENT_REFUSED}"
      - name: return_note
        type: string
        source: input
        description: "Free-text note from the fitter."
        default: null
      - name: status
        type: enum
        source: computed
        description: "Return lifecycle: REQUESTED forks to RESTOCKED or DESTROYED at inspection, and both branches converge on REFIT_ISSUED when a refit encounter is opened."
        default: "REQUESTED"
        constraints: "one of {REQUESTED, RESTOCKED, DESTROYED, REFIT_ISSUED}"
      - name: quantity_returned
        type: integer
        source: computed
        description: "Units coming back; always equal to the encounter's quantity (partial returns are not supported)."
        constraints: ">= 1"
      - name: condition
        type: enum
        source: system
        description: "Physical condition recorded at inspection."
        default: null
        constraints: "one of {SELLABLE, SOILED, DAMAGED} or null"
      - name: days_since_delivery
        type: integer
        source: computed
        description: "Whole days from encounter.delivered_at to the logical clock at return request, floored; drives both the return window and the POOR_FIT fee tier."
        constraints: ">= 0"
      - name: restock_eligible
        type: boolean
        source: computed
        description: "True only when condition == SELLABLE, DeviceProduct.category != CUSTOM_FABRICATED, and days_since_delivery <= RESTOCK_WINDOW_DAYS."
        default: false
      - name: restock_fee_pct
        type: number
        source: computed
        description: "Restocking fee fraction selected by reason and days_since_delivery per calculations.restock_refund."
        default: 0
      - name: device_component_cents
        type: integer
        source: computed
        description: "Device line of the original patient charge; step 1 of calculations.restock_refund."
        default: 0
      - name: fitting_component_cents
        type: integer
        source: computed
        description: "Fitting line of the original patient charge; step 2 of calculations.restock_refund."
        default: 0
      - name: device_refund_cents
        type: integer
        source: computed
        description: "Device line refund, rounded to cents on its own line; step 3."
        default: 0
      - name: fitting_refund_cents
        type: integer
        source: computed
        description: "Fitting line refund, rounded to cents on its own line; step 4."
        default: 0
      - name: refund_cents
        type: integer
        source: computed
        description: "device_refund_cents + fitting_refund_cents; the pinned round-per-line-then-sum total."
        default: 0
      - name: restock_fee_cents
        type: integer
        source: computed
        description: "encounter.patient_responsibility_cents - refund_cents; the residual the practice keeps."
        default: 0
      - name: inspected_at
        type: datetime
        source: system
        description: "Logical-clock instant of inspection."
        default: null
      - name: refit_encounter_id
        type: string
        source: computed
        description: "FK -> DispenseEncounter.id; the refit encounter opened from this return. Null until a refit is issued."
        default: null

# ---------------------------------------------------------------------------
# §1.2 State Machine Table
#   DispenseEncounter carries TWO independent state dimensions on one row and
#   therefore appears twice below (dimension: clinical_status and
#   dimension: financial_status). The two dimensions never share a state name,
#   so every transition reference is unambiguous.
# ---------------------------------------------------------------------------
state_machines:
  - entity: DispenseEncounter
    dimension: clinical_status
    initial_state: DRAFT
    terminal_states: [RETURNED, VOIDED]
    transitions:
      - from: DRAFT
        to: DOCUMENTED
        trigger: "POST /dme/encounters/{id}/medical-necessity-note"
        actor: OrthoPhysician
        preconditions:
          - "clinical_status == DRAFT"
          - "acting Physician.id == encounter.ordering_physician_id"
          - "Clinic.accreditation_expires_on >= logical clock date"
        side_effects:
          - "sets mn_diagnosis_code, mn_functional_deficit, mn_expected_duration_months from the body"
          - "sets mn_physician_id = X-User-ID and mn_signed_at = logical clock instant"
          - "increments DispenseEncounter.version by 1 and refreshes updated_at"
        note: "financial_status is untouched by this transition."

      - from: DOCUMENTED
        to: RESERVED
        trigger: "POST /dme/encounters/{id}/reservations"
        actor: DmeFitter
        preconditions:
          - "clinical_status == DOCUMENTED"
          - "DeviceProduct.category IN {OFF_SHELF_PREFAB, CUSTOM_FITTED_PREFAB}"
          - "Clinic.dispensing_status != SUSPENDED  (cross-entity guard on Clinic)"
          - "Clinic.accreditation_expires_on >= logical clock date"
          - "a ClinicParLevel exists for (encounter.clinic_id, encounter.product_id)"
          - "ClinicParLevel.available_qty >= encounter.quantity"
          - "request body's expected_par_level_version == ClinicParLevel.version"
        side_effects:
          - "ClinicParLevel.reserved_qty += encounter.quantity; ClinicParLevel.version += 1"
          - "ClinicParLevel.available_qty recomputed by calculations.par_stock_posture; stock_posture is NOT affected because on_hand_qty did not move"
          - "Clinic.dispensing_status is NOT recomputed: calculations.clinic_dispensing_posture only runs when a stock_posture actually changes, and a reservation cannot change it"
          - "increments DispenseEncounter.version by 1"

      - from: DOCUMENTED
        to: AWAITING_DEVICE
        trigger: "POST /dme/encounters/{id}/custom-fab-orders"
        actor: DmeFitter
        preconditions:
          - "clinical_status == DOCUMENTED"
          - "DeviceProduct.category == CUSTOM_FABRICATED"
          - "Supplier.custom_fab_capable == true"
          - "Clinic.dispensing_status != SUSPENDED"
        side_effects:
          - "creates a CustomFabOrder in status SUBMITTED with submitted_at = logical clock instant"
          - "snapshots promised_turnaround_days_snapshot and promised_delivery_on from the Supplier"
          - "increments DispenseEncounter.version by 1"
        note: "No par stock is reserved for custom-fabricated devices; the encounter never touches ClinicParLevel."

      - from: RESERVED
        to: FITTED
        trigger: "POST /dme/encounters/{id}/fitting-records with fit_outcome == ACCEPTABLE"
        actor: DmeFitter
        preconditions:
          - "clinical_status == RESERVED"
          - "acting Fitter.clinic_id == encounter.clinic_id"
          - "Fitter.credential != NONE and Fitter.credential_expires_on >= logical clock date"
          - "if DeviceProduct.category != OFF_SHELF_PREFAB then Fitter.privilege_scope == CUSTOM_AND_OFF_SHELF"
          - "no fitter-slot interval conflict per the ERR_FITTING_SLOT_CONFLICT rule in §1.4"
        side_effects:
          - "creates a FittingRecord with fitter_id = X-User-ID and fitting_minutes computed"
          - "sets DispenseEncounter.fitter_id = X-User-ID"
          - "Fitter.fitting_minutes_booked += FittingRecord.fitting_minutes"
          - "increments DispenseEncounter.version by 1"

      - from: RESERVED
        to: RESERVED
        trigger: "POST /dme/encounters/{id}/fitting-records with fit_outcome == ADJUST_NEEDED"
        actor: DmeFitter
        preconditions:
          - "clinical_status == RESERVED"
          - "same fitter preconditions as RESERVED -> FITTED"
        side_effects:
          - "creates a FittingRecord; the encounter stays RESERVED and the par reservation is retained"
          - "Fitter.fitting_minutes_booked += FittingRecord.fitting_minutes"
          - "increments DispenseEncounter.version by 1"
        note: "Self-loop: the same trigger may be replayed any number of times while the fit is unacceptable."

      - from: RESERVED
        to: DOCUMENTED
        trigger: "POST /dme/encounters/{id}/fitting-records with fit_outcome == REJECTED"
        actor: DmeFitter
        preconditions:
          - "clinical_status == RESERVED"
          - "same fitter preconditions as RESERVED -> FITTED"
        side_effects:
          - "creates a FittingRecord"
          - "releases the reservation: ClinicParLevel.reserved_qty -= encounter.quantity; ClinicParLevel.version += 1"
          - "ClinicParLevel.available_qty recomputed; stock_posture is unchanged because on_hand_qty did not move"
          - "increments DispenseEncounter.version by 1"
        note: "Compensating action for DOCUMENTED -> RESERVED; restores ClinicParLevel.available_qty to its pre-reservation value."

      - from: AWAITING_DEVICE
        to: FITTED
        trigger: "POST /dme/encounters/{id}/fitting-records with fit_outcome == ACCEPTABLE"
        actor: DmeFitter
        preconditions:
          - "clinical_status == AWAITING_DEVICE"
          - "the encounter's CustomFabOrder.status == ACCEPTED  (cross-entity guard on CustomFabOrder)"
          - "compliance_hold == false"
          - "Fitter.privilege_scope == CUSTOM_AND_OFF_SHELF"
          - "no fitter-slot interval conflict per the ERR_FITTING_SLOT_CONFLICT rule in §1.4"
        side_effects:
          - "creates a FittingRecord; sets DispenseEncounter.fitter_id = X-User-ID"
          - "Fitter.fitting_minutes_booked += FittingRecord.fitting_minutes"
          - "increments DispenseEncounter.version by 1"

      - from: FITTED
        to: DELIVERED
        trigger: "POST /dme/encounters/{id}/dispense"
        actor: DmeFitter
        preconditions:
          - "clinical_status == FITTED"
          - "financial_status IN {VERIFIED, AUTH_APPROVED, SELF_PAY}"
          - "mn_signed_at is not null"
          - "ioas_attested_at is not null"
          - "compliance_hold == false"
          - "Clinic.dispensing_status != SUSPENDED and Clinic.accreditation_expires_on >= logical clock date"
          - "the effective CoverageVerification has expires_at >= logical clock instant"
          - "delivery_signature_role in the body != REFUSED"
          - "if DeviceProduct.requires_prior_auth then the encounter's PriorAuthRequest.status == APPROVED"
          - "if quantity > covered_units then an AbnNotice with status == SIGNED and option_selected IN {OPTION_1, OPTION_2} exists"
        side_effects:
          - "sets delivered_at, delivery_signature_role; copies both onto the latest FittingRecord"
          - "runs calculations.patient_responsibility, writing covered_units, patient_responsibility_cents, billable_amount_cents, responsibility_variant"
          - "financial_status advances to BILLED on the same request"
          - "for non-CUSTOM_FABRICATED products: ClinicParLevel.on_hand_qty -= quantity and reserved_qty -= quantity; ClinicParLevel.version += 1 (cascade link 1)"
          - "that quantity change re-runs calculations.par_stock_posture, which may set ClinicParLevel.stock_posture = STOCKOUT (cascade link 2)"
          - "a stock_posture transition into STOCKOUT re-runs calculations.clinic_dispensing_posture, raising Clinic.stockout_par_level_count and possibly setting Clinic.dispensing_status = RESTRICTED or SUSPENDED (cascade link 3)"
          - "a Clinic.dispensing_status transition into SUSPENDED sets compliance_hold = true and hold_reason = CLINIC_SUSPENDED on every OTHER DispenseEncounter of that clinic whose clinical_status == RESERVED (cascade link 4)"
          - "increments DispenseEncounter.version by 1"

      - from: DELIVERED
        to: RETURN_PENDING
        trigger: "POST /dme/encounters/{id}/returns"
        actor: DmeFitter
        preconditions:
          - "clinical_status == DELIVERED"
          - "no ProductReturn already exists for this encounter"
          - "days_since_delivery <= RETURN_WINDOW_DAYS for the submitted reason (30 for POOR_FIT and PATIENT_REFUSED, 90 for DEFECT and WRONG_ITEM)"
        side_effects:
          - "creates a ProductReturn in status REQUESTED with quantity_returned = encounter.quantity and days_since_delivery computed"
          - "increments DispenseEncounter.version by 1"

      - from: RETURN_PENDING
        to: RETURNED
        trigger: "POST /dme/returns/{id}/inspection"
        actor: InventoryManager
        preconditions:
          - "clinical_status == RETURN_PENDING"
          - "ProductReturn.status == REQUESTED"
        side_effects:
          - "ProductReturn.status becomes RESTOCKED when restock_eligible is true, otherwise DESTROYED"
          - "runs calculations.restock_refund, writing the five money fields on the ProductReturn"
          - "financial_status advances BILLED -> REFUNDED and billable_amount_cents is set to 0"
          - "when the branch is RESTOCKED: ClinicParLevel.on_hand_qty += quantity_returned; ClinicParLevel.version += 1; stock_posture recomputed; a departure from STOCKOUT recomputes Clinic.stockout_par_level_count and Clinic.dispensing_status"
          - "a Clinic.dispensing_status transition out of SUSPENDED clears compliance_hold and hold_reason on every DispenseEncounter of that clinic whose hold_reason == CLINIC_SUSPENDED"
          - "increments DispenseEncounter.version by 1"
        note: "Compensating action for FITTED -> DELIVERED on the units axis."

      - from: DRAFT
        to: VOIDED
        trigger: "POST /dme/abn-notices/{id}/signature with option_selected == OPTION_3 (system cascade)"
        actor: system
        preconditions:
          - "clinical_status IN {DRAFT, DOCUMENTED, RESERVED}"
          - "the signed AbnNotice belongs to this encounter and its notice_seq is the greatest for the encounter"
        side_effects:
          - "financial_status advances ABN_ISSUED -> WRITTEN_OFF"
          - "patient_responsibility_cents = 0 and billable_amount_cents = 0"
          - "increments DispenseEncounter.version by 1"

      - from: DOCUMENTED
        to: VOIDED
        trigger: "POST /dme/abn-notices/{id}/signature with option_selected == OPTION_3 (system cascade)"
        actor: system
        preconditions:
          - "clinical_status == DOCUMENTED"
        side_effects:
          - "same as DRAFT -> VOIDED"

      - from: RESERVED
        to: VOIDED
        trigger: "POST /dme/abn-notices/{id}/signature with option_selected == OPTION_3 (system cascade)"
        actor: system
        preconditions:
          - "clinical_status == RESERVED"
        side_effects:
          - "releases the reservation: ClinicParLevel.reserved_qty -= encounter.quantity; ClinicParLevel.version += 1; available_qty restored, stock_posture unchanged"
          - "financial_status advances ABN_ISSUED -> WRITTEN_OFF; both money fields set to 0"
          - "increments DispenseEncounter.version by 1"

  - entity: DispenseEncounter
    dimension: financial_status
    initial_state: UNVERIFIED
    terminal_states: [REFUNDED, WRITTEN_OFF]
    transitions:
      - from: UNVERIFIED
        to: VERIFIED
        trigger: "POST /dme/encounters/{id}/coverage-verifications with covered == true"
        actor: InsuranceCoordinator
        preconditions:
          - "financial_status IN {UNVERIFIED, NON_COVERED}"
          - "clinical_status NOT IN {DELIVERED, RETURN_PENDING, RETURNED, VOIDED}"
          - "calculations.same_or_similar_lookback yields same_or_similar_conflict == false"
        side_effects:
          - "creates an immutable CoverageVerification with verification_seq = previous max + 1"
          - "snapshots allowed_amount_cents_snapshot from the DeviceProduct"
          - "sets verified_at and expires_at = verified_at + valid_for_days days"
          - "increments DispenseEncounter.version by 1"
        note: "clinical_status is untouched; this dimension advances on its own."

      - from: UNVERIFIED
        to: NON_COVERED
        trigger: "POST /dme/encounters/{id}/coverage-verifications with covered == false"
        actor: InsuranceCoordinator
        preconditions:
          - "financial_status IN {UNVERIFIED, NON_COVERED}"
          - "clinical_status NOT IN {DELIVERED, RETURN_PENDING, RETURNED, VOIDED}"
        side_effects:
          - "creates the CoverageVerification as above with covered = false"
          - "increments DispenseEncounter.version by 1"

      - from: VERIFIED
        to: AUTH_PENDING
        trigger: "POST /dme/encounters/{id}/prior-auth-requests"
        actor: InsuranceCoordinator
        preconditions:
          - "financial_status == VERIFIED"
          - "DeviceProduct.requires_prior_auth == true"
          - "no PriorAuthRequest exists for this encounter"
        side_effects:
          - "creates a PriorAuthRequest in status SUBMITTED"
          - "increments DispenseEncounter.version by 1"

      - from: AUTH_PENDING
        to: AUTH_APPROVED
        trigger: "POST /dme/prior-auth-requests/{id}/decision with decision == APPROVED"
        actor: InsuranceCoordinator
        preconditions:
          - "PriorAuthRequest.status IN {SUBMITTED, PENDED}"
          - "financial_status == AUTH_PENDING"
          - "0 < approved_units <= requested_units"
        side_effects:
          - "PriorAuthRequest.status = APPROVED; sets approved_units, auth_number, decision_at, expires_at = decision_at + valid_for_days days"
          - "increments PriorAuthRequest.version and DispenseEncounter.version by 1 each"

      - from: AUTH_PENDING
        to: AUTH_DENIED
        trigger: "POST /dme/prior-auth-requests/{id}/decision with decision == DENIED"
        actor: InsuranceCoordinator
        preconditions:
          - "PriorAuthRequest.status IN {SUBMITTED, PENDED}"
          - "financial_status == AUTH_PENDING"
        side_effects:
          - "PriorAuthRequest.status = DENIED; sets decision_at"
          - "increments PriorAuthRequest.version and DispenseEncounter.version by 1 each"

      - from: AUTH_PENDING
        to: AUTH_PENDING
        trigger: "POST /dme/prior-auth-requests/{id}/decision with decision == PENDED"
        actor: InsuranceCoordinator
        preconditions:
          - "PriorAuthRequest.status == SUBMITTED"
        side_effects:
          - "PriorAuthRequest.status = PENDED; sets decision_at"
          - "increments PriorAuthRequest.version by 1; the encounter dimension stays AUTH_PENDING"
        note: "Self-loop on the encounter dimension while the payer keeps the request pended."

      - from: NON_COVERED
        to: ABN_ISSUED
        trigger: "POST /dme/encounters/{id}/abn-notices"
        actor: InsuranceCoordinator
        preconditions:
          - "financial_status IN {NON_COVERED, AUTH_DENIED, AUTH_APPROVED}"
          - "clinical_status NOT IN {DELIVERED, RETURN_PENDING, RETURNED, VOIDED}"
          - "request body's expected_encounter_version == DispenseEncounter.version"
        side_effects:
          - "every earlier AbnNotice of this encounter with status == ISSUED moves to VOIDED"
          - "creates an AbnNotice with notice_seq = previous max + 1 in status ISSUED"
          - "runs calculations.abn_cash_quote, writing unit_net_price_cents, estimated_subtotal_cents, dispensing_fee_cents, estimated_cost_cents"
          - "increments DispenseEncounter.version by 1"

      - from: AUTH_DENIED
        to: ABN_ISSUED
        trigger: "POST /dme/encounters/{id}/abn-notices"
        actor: InsuranceCoordinator
        preconditions:
          - "financial_status == AUTH_DENIED"
          - "request body's expected_encounter_version == DispenseEncounter.version"
        side_effects:
          - "same as NON_COVERED -> ABN_ISSUED"

      - from: AUTH_APPROVED
        to: ABN_ISSUED
        trigger: "POST /dme/encounters/{id}/abn-notices with reason_non_covered == UNITS_EXCEED_AUTH"
        actor: InsuranceCoordinator
        preconditions:
          - "financial_status == AUTH_APPROVED"
          - "encounter.quantity > PriorAuthRequest.approved_units"
          - "request body's expected_encounter_version == DispenseEncounter.version"
        side_effects:
          - "same as NON_COVERED -> ABN_ISSUED"
        note: "Covers the uncovered excess units only; the approved units stay on the insurance path."

      - from: ABN_ISSUED
        to: ABN_ISSUED
        trigger: "POST /dme/encounters/{id}/abn-notices (re-issuing a corrected notice)"
        actor: InsuranceCoordinator
        preconditions:
          - "financial_status == ABN_ISSUED"
          - "clinical_status NOT IN {DELIVERED, RETURN_PENDING, RETURNED, VOIDED}"
          - "request body's expected_encounter_version == DispenseEncounter.version"
        side_effects:
          - "same as NON_COVERED -> ABN_ISSUED: the previous ISSUED notice moves to VOIDED and the new notice takes notice_seq = previous max + 1"
        note: "Self-loop on the financial dimension. This is the only path that produces a VOIDED AbnNotice and the only path that makes ERR_ABN_SUPERSEDED reachable: the superseded notice can no longer be signed."

      - from: ABN_ISSUED
        to: SELF_PAY
        trigger: "POST /dme/abn-notices/{id}/signature with option_selected IN {OPTION_1, OPTION_2}"
        actor: InsuranceCoordinator
        preconditions:
          - "AbnNotice.status == ISSUED and its notice_seq is the greatest for the encounter"
          - "financial_status == ABN_ISSUED"
        side_effects:
          - "AbnNotice.status = SIGNED; sets option_selected, signed_by, patient_signed_at"
          - "increments AbnNotice.version and DispenseEncounter.version by 1 each"

      - from: ABN_ISSUED
        to: WRITTEN_OFF
        trigger: "POST /dme/abn-notices/{id}/signature with option_selected == OPTION_3"
        actor: InsuranceCoordinator
        preconditions:
          - "AbnNotice.status == ISSUED and its notice_seq is the greatest for the encounter"
          - "financial_status == ABN_ISSUED"
        side_effects:
          - "AbnNotice.status = SIGNED with option_selected = OPTION_3"
          - "clinical_status cascades to VOIDED, releasing any par reservation"
          - "patient_responsibility_cents = 0 and billable_amount_cents = 0"

      - from: ABN_ISSUED
        to: ABN_ISSUED
        trigger: "POST /dme/abn-notices/{id}/signature with a DECLINED signature body (signed_by omitted and option_selected omitted)"
        actor: InsuranceCoordinator
        preconditions:
          - "AbnNotice.status == ISSUED"
        side_effects:
          - "AbnNotice.status = DECLINED; the encounter dimension stays ABN_ISSUED so a replacement notice can be issued"
        note: "A DECLINED notice is not the greatest-seq SIGNED notice, so dispense stays blocked."

      - from: VERIFIED
        to: BILLED
        trigger: "POST /dme/encounters/{id}/dispense"
        actor: DmeFitter
        preconditions:
          - "financial_status IN {VERIFIED, AUTH_APPROVED, SELF_PAY}"
          - "clinical_status == FITTED"
        side_effects:
          - "runs calculations.patient_responsibility under variant INSURANCE_ASSIGNED"
          - "clinical_status advances FITTED -> DELIVERED on the same request"

      - from: AUTH_APPROVED
        to: BILLED
        trigger: "POST /dme/encounters/{id}/dispense"
        actor: DmeFitter
        preconditions:
          - "financial_status == AUTH_APPROVED"
          - "clinical_status == FITTED"
        side_effects:
          - "runs calculations.patient_responsibility under variant INSURANCE_ASSIGNED"

      - from: SELF_PAY
        to: BILLED
        trigger: "POST /dme/encounters/{id}/dispense"
        actor: DmeFitter
        preconditions:
          - "financial_status == SELF_PAY"
          - "clinical_status == FITTED"
        side_effects:
          - "runs calculations.patient_responsibility; the variant is INSURANCE_ASSIGNED when the effective CoverageVerification has covered == true, otherwise ABN_CASH_SELFPAY"

      - from: BILLED
        to: REFUNDED
        trigger: "POST /dme/returns/{id}/inspection"
        actor: InventoryManager
        preconditions:
          - "financial_status == BILLED"
          - "ProductReturn.status == REQUESTED"
        side_effects:
          - "runs calculations.restock_refund"
          - "billable_amount_cents = 0"
          - "clinical_status advances RETURN_PENDING -> RETURNED on the same request"

  - entity: PriorAuthRequest
    initial_state: SUBMITTED
    terminal_states: [EXPIRED]
    transitions:
      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /dme/prior-auth-requests/{id}/decision with decision == APPROVED"
        actor: InsuranceCoordinator
        preconditions: ["status IN {SUBMITTED, PENDED}", "0 < approved_units <= requested_units"]
        side_effects: ["sets approved_units, auth_number, decision_at, expires_at", "encounter financial_status -> AUTH_APPROVED"]
      - from: SUBMITTED
        to: DENIED
        trigger: "POST /dme/prior-auth-requests/{id}/decision with decision == DENIED"
        actor: InsuranceCoordinator
        preconditions: ["status IN {SUBMITTED, PENDED}"]
        side_effects: ["sets decision_at", "encounter financial_status -> AUTH_DENIED"]
      - from: SUBMITTED
        to: PENDED
        trigger: "POST /dme/prior-auth-requests/{id}/decision with decision == PENDED"
        actor: InsuranceCoordinator
        preconditions: ["status == SUBMITTED"]
        side_effects: ["sets decision_at", "encounter dimension stays AUTH_PENDING"]
      - from: PENDED
        to: SUBMITTED
        trigger: "POST /dme/prior-auth-requests/{id}/appeal"
        actor: InsuranceCoordinator
        preconditions: ["status IN {PENDED, DENIED}", "appeal_round < APPEAL_ROUND_LIMIT"]
        side_effects:
          - "appeal_round += 1; decision_at = null"
          - "encounter financial_status returns to AUTH_PENDING"
          - "increments PriorAuthRequest.version and DispenseEncounter.version by 1 each"
        note: "Cycle: PENDED -> SUBMITTED -> {APPROVED, DENIED, PENDED} may run up to APPEAL_ROUND_LIMIT times."
      - from: DENIED
        to: SUBMITTED
        trigger: "POST /dme/prior-auth-requests/{id}/appeal"
        actor: InsuranceCoordinator
        preconditions: ["status == DENIED", "appeal_round < APPEAL_ROUND_LIMIT"]
        side_effects:
          - "appeal_round += 1"
          - "encounter financial_status moves AUTH_DENIED -> AUTH_PENDING"
      - from: APPROVED
        to: EXPIRED
        trigger: "system evaluation at POST /dme/encounters/{id}/dispense when logical clock > expires_at"
        actor: system
        preconditions: ["status == APPROVED", "logical clock instant > expires_at"]
        side_effects:
          - "status = EXPIRED; the dispense that observed the expiry is rejected with ERR_PRIOR_AUTH_REQUIRED"
          - "increments PriorAuthRequest.version by 1"

  - entity: CustomFabOrder
    initial_state: SUBMITTED
    terminal_states: [ACCEPTED, CANCELLED]
    transitions:
      - from: SUBMITTED
        to: IN_FABRICATION
        trigger: "POST /dme/custom-fab-orders/{id}/fabrication-events with event == ACCEPT_ORDER"
        actor: InventoryManager
        preconditions:
          - "status == SUBMITTED"
          - "Supplier.dmepos_standards_attested == true  (cross-entity guard on Supplier)"
          - "Supplier.quality_hold == false"
          - "Supplier.accreditation_expires_on >= logical clock date"
        side_effects: ["increments CustomFabOrder.version by 1"]
      - from: IN_FABRICATION
        to: READY_FOR_FITTING
        trigger: "POST /dme/custom-fab-orders/{id}/fabrication-events with event == DELIVER_TO_CLINIC"
        actor: InventoryManager
        preconditions: ["status == IN_FABRICATION", "Supplier.quality_hold == false"]
        side_effects:
          - "sets first_delivered_at on the FIRST such event only; later adjustment deliveries leave it unchanged"
          - "recomputes first_delivery_days and projected_turnaround_score by calculations.supplier_turnaround_score variant promised_basis"
          - "increments CustomFabOrder.version by 1"
      - from: READY_FOR_FITTING
        to: ADJUSTMENT_REQUESTED
        trigger: "POST /dme/custom-fab-orders/{id}/fitting-check with outcome == REQUEST_ADJUSTMENT"
        actor: DmeFitter
        preconditions: ["status == READY_FOR_FITTING", "adjustment_rounds < FAB_ADJUSTMENT_ROUND_LIMIT"]
        side_effects: ["adjustment_rounds += 1", "increments CustomFabOrder.version by 1"]
      - from: ADJUSTMENT_REQUESTED
        to: IN_FABRICATION
        trigger: "POST /dme/custom-fab-orders/{id}/fabrication-events with event == ACCEPT_ORDER"
        actor: InventoryManager
        preconditions: ["status == ADJUSTMENT_REQUESTED", "Supplier.quality_hold == false"]
        side_effects: ["increments CustomFabOrder.version by 1"]
        note: "Cycle closure: ADJUSTMENT_REQUESTED -> IN_FABRICATION -> READY_FOR_FITTING may repeat up to FAB_ADJUSTMENT_ROUND_LIMIT times."
      - from: READY_FOR_FITTING
        to: ACCEPTED
        trigger: "POST /dme/custom-fab-orders/{id}/fitting-check with outcome == ACCEPT"
        actor: DmeFitter
        preconditions: ["status == READY_FOR_FITTING", "acting Fitter.privilege_scope == CUSTOM_AND_OFF_SHELF"]
        side_effects:
          - "sets accepted_at and total_elapsed_days"
          - "computes final_turnaround_score by calculations.supplier_turnaround_score variant elapsed_basis"
          - "Supplier.accepted_fab_order_count += 1 and Supplier.turnaround_score recomputed as the mean of final_turnaround_score over that supplier's ACCEPTED orders"
          - "increments CustomFabOrder.version and Supplier.version by 1 each"
      - from: SUBMITTED
        to: SUPPLIER_HOLD
        trigger: "POST /dme/suppliers/{id}/standards-attestation with quality_hold == true (system cascade)"
        actor: system
        preconditions: ["status IN {SUBMITTED, IN_FABRICATION, ADJUSTMENT_REQUESTED}"]
        side_effects:
          - "status = SUPPLIER_HOLD (cascade link 2 of the supplier-hold chain)"
          - "that status change sets compliance_hold = true and hold_reason = SUPPLIER_QUALITY_HOLD on the order's DispenseEncounter (cascade link 3)"
          - "increments CustomFabOrder.version and DispenseEncounter.version by 1 each"
      - from: IN_FABRICATION
        to: SUPPLIER_HOLD
        trigger: "POST /dme/suppliers/{id}/standards-attestation with quality_hold == true (system cascade)"
        actor: system
        preconditions: ["status == IN_FABRICATION"]
        side_effects: ["same as SUBMITTED -> SUPPLIER_HOLD"]
      - from: SUPPLIER_HOLD
        to: IN_FABRICATION
        trigger: "POST /dme/suppliers/{id}/standards-attestation with quality_hold == false (system cascade)"
        actor: system
        preconditions: ["status == SUPPLIER_HOLD", "Supplier.dmepos_standards_attested == true"]
        side_effects:
          - "status = IN_FABRICATION"
          - "clears compliance_hold and hold_reason on the order's DispenseEncounter when hold_reason == SUPPLIER_QUALITY_HOLD"
      - from: SUPPLIER_HOLD
        to: CANCELLED
        trigger: "POST /dme/custom-fab-orders/{id}/fitting-check with outcome == CANCEL"
        actor: DmeFitter
        preconditions: ["status == SUPPLIER_HOLD"]
        side_effects:
          - "status = CANCELLED"
          - "the order's DispenseEncounter clinical_status returns AWAITING_DEVICE -> DOCUMENTED and compliance_hold is cleared"
          - "increments CustomFabOrder.version and DispenseEncounter.version by 1 each"

  - entity: ProductReturn
    initial_state: REQUESTED
    terminal_states: [REFIT_ISSUED]
    transitions:
      - from: REQUESTED
        to: RESTOCKED
        trigger: "POST /dme/returns/{id}/inspection with condition == SELLABLE on a non-custom-fabricated product inside RESTOCK_WINDOW_DAYS"
        actor: InventoryManager
        preconditions: ["status == REQUESTED", "encounter.clinical_status == RETURN_PENDING"]
        side_effects:
          - "restock_eligible = true; runs calculations.restock_refund"
          - "ClinicParLevel.on_hand_qty += quantity_returned; ClinicParLevel.version += 1; stock_posture and Clinic.dispensing_status recomputed"
          - "encounter clinical_status -> RETURNED and financial_status BILLED -> REFUNDED"
      - from: REQUESTED
        to: DESTROYED
        trigger: "POST /dme/returns/{id}/inspection with condition IN {SOILED, DAMAGED}, or a CUSTOM_FABRICATED product, or days_since_delivery > RESTOCK_WINDOW_DAYS"
        actor: InventoryManager
        preconditions: ["status == REQUESTED", "encounter.clinical_status == RETURN_PENDING"]
        side_effects:
          - "restock_eligible = false; runs calculations.restock_refund"
          - "ClinicParLevel.on_hand_qty is NOT increased; the units are recorded as destroyed"
          - "encounter clinical_status -> RETURNED and financial_status BILLED -> REFUNDED"
        note: "Fork sibling of REQUESTED -> RESTOCKED; the two branches differ only in the inventory side effect."
      - from: RESTOCKED
        to: REFIT_ISSUED
        trigger: "POST /dme/returns/{id}/refit"
        actor: DmeFitter
        preconditions:
          - "status IN {RESTOCKED, DESTROYED}"
          - "reason IN {POOR_FIT, WRONG_ITEM}"
          - "acting Fitter.id != the returned encounter's fitter_id"
        side_effects:
          - "creates a new DispenseEncounter with refit_of_encounter_id = the returned encounter, clinical_status DOCUMENTED (medical-necessity fields copied), financial_status UNVERIFIED"
          - "sets refit_encounter_id on the ProductReturn"
          - "increments ProductReturn.version by 1"
      - from: DESTROYED
        to: REFIT_ISSUED
        trigger: "POST /dme/returns/{id}/refit"
        actor: DmeFitter
        preconditions: ["status == DESTROYED", "reason IN {POOR_FIT, WRONG_ITEM}", "acting Fitter.id != the returned encounter's fitter_id"]
        side_effects: ["same as RESTOCKED -> REFIT_ISSUED"]
        note: "Join point: both fork branches converge on REFIT_ISSUED."

  - entity: AbnNotice
    initial_state: ISSUED
    terminal_states: [SIGNED, DECLINED, VOIDED]
    transitions:
      - from: ISSUED
        to: SIGNED
        trigger: "POST /dme/abn-notices/{id}/signature with option_selected present"
        actor: InsuranceCoordinator
        preconditions: ["status == ISSUED", "notice_seq is the greatest for the encounter"]
        side_effects: ["sets option_selected, signed_by, patient_signed_at", "encounter financial_status -> SELF_PAY or WRITTEN_OFF per the option"]
      - from: ISSUED
        to: DECLINED
        trigger: "POST /dme/abn-notices/{id}/signature with option_selected omitted"
        actor: InsuranceCoordinator
        preconditions: ["status == ISSUED"]
        side_effects: ["sets patient_signed_at; the encounter financial dimension stays ABN_ISSUED"]
      - from: ISSUED
        to: VOIDED
        trigger: "POST /dme/encounters/{id}/abn-notices (issuing a replacement notice)"
        actor: system
        preconditions: ["status == ISSUED", "a new AbnNotice with a greater notice_seq is being created for the same encounter"]
        side_effects: ["increments AbnNotice.version by 1"]

  - entity: ClinicParLevel
    dimension: stock_posture
    initial_state: STOCKOUT
    terminal_states: []
    transitions:
      - from: STOCKOUT
        to: OK
        trigger: "system recompute after POST /dme/par-levels, POST /dme/par-levels/{id}/stock-receipts, or any reservation/dispense/restock side effect"
        actor: system
        preconditions: ["on_hand_qty >= par_min_qty"]
        side_effects: ["stock_posture = OK", "Clinic.stockout_par_level_count -= 1 and Clinic.dispensing_status recomputed"]
      - from: OK
        to: BELOW_PAR
        trigger: "system recompute after any quantity mutation"
        actor: system
        preconditions: ["on_hand_qty > 0", "ceil(par_min_qty / 2) <= on_hand_qty < par_min_qty"]
        side_effects: ["stock_posture = BELOW_PAR"]
      - from: BELOW_PAR
        to: CRITICAL
        trigger: "system recompute after any quantity mutation"
        actor: system
        preconditions: ["on_hand_qty > 0", "on_hand_qty < ceil(par_min_qty / 2)"]
        side_effects: ["stock_posture = CRITICAL"]
      - from: CRITICAL
        to: STOCKOUT
        trigger: "system recompute after any quantity mutation"
        actor: system
        preconditions: ["on_hand_qty <= 0"]
        side_effects: ["stock_posture = STOCKOUT", "Clinic.stockout_par_level_count += 1 and Clinic.dispensing_status recomputed"]
      - from: OK
        to: STOCKOUT
        trigger: "system recompute after a dispense that consumes the whole shelf"
        actor: system
        preconditions: ["on_hand_qty <= 0"]
        side_effects: ["stock_posture = STOCKOUT", "Clinic.stockout_par_level_count += 1 and Clinic.dispensing_status recomputed"]

  - entity: Clinic
    dimension: dispensing_status
    initial_state: ACTIVE
    terminal_states: []
    transitions:
      - from: ACTIVE
        to: RESTRICTED
        trigger: "system recompute by calculations.clinic_dispensing_posture after any ClinicParLevel.stock_posture change"
        actor: system
        preconditions: ["stockout_par_level_count == 1"]
        side_effects: ["dispensing_status = RESTRICTED", "increments Clinic.version by 1"]
        note: "RESTRICTED blocks reservations only for the stocked-out product; other products remain reservable."
      - from: RESTRICTED
        to: SUSPENDED
        trigger: "system recompute by calculations.clinic_dispensing_posture"
        actor: system
        preconditions: ["stockout_par_level_count >= 2"]
        side_effects:
          - "dispensing_status = SUSPENDED"
          - "sets compliance_hold = true and hold_reason = CLINIC_SUSPENDED on every DispenseEncounter of this clinic whose clinical_status == RESERVED"
          - "increments Clinic.version by 1"
      - from: SUSPENDED
        to: RESTRICTED
        trigger: "system recompute after a stock receipt or restocked return lifts one par level out of STOCKOUT"
        actor: system
        preconditions: ["stockout_par_level_count == 1"]
        side_effects: ["dispensing_status = RESTRICTED", "clears compliance_hold and hold_reason on encounters whose hold_reason == CLINIC_SUSPENDED"]
      - from: RESTRICTED
        to: ACTIVE
        trigger: "system recompute after a stock receipt or restocked return"
        actor: system
        preconditions: ["stockout_par_level_count == 0"]
        side_effects: ["dispensing_status = ACTIVE", "clears compliance_hold and hold_reason on encounters whose hold_reason == CLINIC_SUSPENDED"]
      - from: ACTIVE
        to: SUSPENDED
        trigger: "system recompute when a single mutation drives two par levels to STOCKOUT"
        actor: system
        preconditions: ["stockout_par_level_count >= 2"]
        side_effects: ["same as RESTRICTED -> SUSPENDED"]

# ---------------------------------------------------------------------------
# §1.2.1 Concurrency Rules — OCC on the parent's `version` only
# ---------------------------------------------------------------------------
concurrency_rules:
  - rule_id: reservation-stale-par-level
    parent_entity: ClinicParLevel
    write_endpoint: "POST /dme/encounters/{id}/reservations"
    occ_field: "expected_par_level_version"
    description: |
      Reserving par stock for an encounter against a ClinicParLevel whose
      version has advanced since the fitter last read it is rejected. The
      fitter's availability view is stale: another reservation, a stock
      receipt, a rejected fitting that released units, or a restocked return
      has already changed on_hand_qty or reserved_qty on that shelf, so the
      quantity the fitter believed was free is no longer the quantity the
      shelf reports. The check is on the stored version integer only.
    error_id: ERR_STALE_PAR_LEVEL_VERSION
    http_status: 412

  - rule_id: abn-issue-stale-encounter
    parent_entity: DispenseEncounter
    write_endpoint: "POST /dme/encounters/{id}/abn-notices"
    occ_field: "expected_encounter_version"
    description: |
      Issuing an advance beneficiary notice against a DispenseEncounter whose
      version has advanced since the coordinator last read it is rejected.
      Issuance legitimately supersedes every earlier ISSUED notice on the
      encounter, so the operation would otherwise succeed on a stale view and
      silently void a notice the coordinator never saw — for example one
      issued after a prior-authorization decision landed and changed the
      encounter's financial posture. The check is on the stored version
      integer only.
    error_id: ERR_STALE_ENCOUNTER_VERSION
    http_status: 412

# ---------------------------------------------------------------------------
# §1.3 Calculation Rules Table
#   All money is integer cents. Every rounding site is named explicitly and
#   pinned to an evaluation ORDER; no implementation is free to re-associate
#   the steps. All day/month arithmetic reads the logical clock (default
#   2026-08-01T00:00:00Z).
# ---------------------------------------------------------------------------
calculations:
  - name: patient_responsibility
    trigger: "POST /dme/encounters/{id}/dispense, on the FITTED -> DELIVERED transition"
    algorithm: waterfall_allocation
    formula: |
      # ---- step 1: the effective coverage verification -------------------
      cv = the CoverageVerification of this encounter with the GREATEST
           verification_seq (verification rows are immutable; later rows
           supersede earlier ones, they do not merge)
      # ---- step 2: covered units ----------------------------------------
      if cv.covered == false:
          covered_units = 0
      elif product.requires_prior_auth == true:
          covered_units = min(encounter.quantity, prior_auth.approved_units)
      else:
          covered_units = encounter.quantity
      excess_units = encounter.quantity - covered_units
      # ---- step 3: variant selection ------------------------------------
      variant = ABN_CASH_SELFPAY if covered_units == 0 else INSURANCE_ASSIGNED
      # ---- step 4a: INSURANCE_ASSIGNED ----------------------------------
      # Buckets fill in this order: deductible, then coinsurance, then cash
      # excess. The order is pinned; re-ordering changes the answer whenever
      # the deductible does not cover the whole allowed amount.
      allowed_total       = cv.allowed_amount_cents_snapshot * covered_units
      deductible_applied  = min(cv.deductible_remaining_cents, allowed_total)
      coinsurance_base    = allowed_total - deductible_applied
      coinsurance_cents   = round_half_up(coinsurance_base * cv.coinsurance_pct)
      # excess (non-covered) units are billed at the cash unit price. The
      # multi-unit cash discount is decided by excess_units alone, NOT by
      # encounter.quantity, and the DISPENSING_FEE is NEVER added here --
      # it belongs to a full self-pay ABN quote only.
      if excess_units >= CASH_DISCOUNT_MIN_QTY:
          excess_unit_net = round_half_up(product.cash_price_cents * (1 - CASH_MULTI_UNIT_DISCOUNT_PCT))
      else:
          excess_unit_net = product.cash_price_cents
      excess_cash_cents   = excess_unit_net * excess_units
      patient_responsibility_cents = deductible_applied + coinsurance_cents + excess_cash_cents
      billable_amount_cents        = allowed_total - deductible_applied - coinsurance_cents
      # ---- step 4b: ABN_CASH_SELFPAY ------------------------------------
      # No insurance line at all; the patient owes exactly the amount that
      # was quoted on the SIGNED advance beneficiary notice with the
      # greatest notice_seq. The quote is NOT recomputed at dispense time,
      # so a cash_price_cents change after signature does not move it.
      patient_responsibility_cents = signed_abn.estimated_cost_cents
      billable_amount_cents        = 0
    input_set: |
      Exactly one DispenseEncounter, its effective CoverageVerification
      (greatest verification_seq), its PriorAuthRequest when
      product.requires_prior_auth is true, its greatest-notice_seq AbnNotice
      with status == SIGNED when the variant is ABN_CASH_SELFPAY, and the
      DeviceProduct for cash pricing. VOIDED and DECLINED notices are
      excluded. Encounters of other patients and other encounters of the
      same patient are never included.
    constants:
      CASH_MULTI_UNIT_DISCOUNT_PCT: 0.15
      CASH_DISCOUNT_MIN_QTY: 2
    precision: "integer cents; round_half_up applied separately to the coinsurance line and to the cash unit price; never to their sum"
    variants:
      - name: INSURANCE_ASSIGNED
        when: "covered_units > 0 (the effective verification says covered and, where required, prior authorization approved at least one unit)"
        difference: |
          Fills the deductible bucket, then the coinsurance bucket at
          coinsurance_pct, then charges any units beyond covered_units at the
          cash unit price. billable_amount_cents is the payer's share and is
          non-zero.
      - name: ABN_CASH_SELFPAY
        when: "covered_units == 0 (verification says not covered, or authorization approved zero coverable units)"
        difference: |
          Ignores allowed_amount_cents_snapshot, the deductible and the
          coinsurance percentage entirely and copies the signed notice's
          estimated_cost_cents -- which INCLUDES the dispensing fee -- so the
          same encounter data yields a different patient_responsibility_cents
          than INSURANCE_ASSIGNED would. billable_amount_cents is 0.

  - name: abn_cash_quote
    trigger: "POST /dme/encounters/{id}/abn-notices, when the AbnNotice row is created"
    algorithm: threshold
    formula: |
      # ---- step 1: how many units the notice covers ---------------------
      if reason_non_covered == UNITS_EXCEED_AUTH:
          quoted_units = encounter.quantity - prior_auth.approved_units
      else:
          quoted_units = encounter.quantity
      # ---- step 2: per-unit net price (ROUND FIRST, THEN MULTIPLY) ------
      # The evaluation order is pinned. round_half_up is applied to the
      # single-unit discounted price and the ROUNDED unit price is then
      # multiplied by quoted_units. Multiplying first and rounding the
      # product is a DIFFERENT number and is wrong.
      if quoted_units >= CASH_DISCOUNT_MIN_QTY:
          unit_net_price_cents = round_half_up(product.cash_price_cents * (1 - CASH_MULTI_UNIT_DISCOUNT_PCT))
      else:
          unit_net_price_cents = product.cash_price_cents
      estimated_subtotal_cents = unit_net_price_cents * quoted_units
      # ---- step 3: dispensing fee threshold ----------------------------
      # Waived AT the threshold (>=), charged strictly below it.
      if estimated_subtotal_cents >= FEE_WAIVER_SUBTOTAL_CENTS:
          dispensing_fee_cents = 0
      else:
          dispensing_fee_cents = DISPENSING_FEE_CENTS
      estimated_cost_cents = estimated_subtotal_cents + dispensing_fee_cents
    input_set: |
      One DispenseEncounter, its DeviceProduct (cash_price_cents), and -- only
      when reason_non_covered == UNITS_EXCEED_AUTH -- its PriorAuthRequest
      with status == APPROVED. Superseded (VOIDED) and DECLINED notices on the
      same encounter contribute nothing; each new notice is quoted from
      scratch against the product's current cash_price_cents.
    constants:
      CASH_MULTI_UNIT_DISCOUNT_PCT: 0.15
      CASH_DISCOUNT_MIN_QTY: 2
      DISPENSING_FEE_CENTS: 2500
      FEE_WAIVER_SUBTOTAL_CENTS: 50000
    precision: "integer cents; round_half_up applied once, to the per-unit discounted price only"

  - name: restock_refund
    trigger: "POST /dme/returns/{id}/inspection, when the ProductReturn leaves REQUESTED"
    algorithm: waterfall_allocation
    formula: |
      # ---- step 1: restock eligibility ---------------------------------
      days_since_delivery = whole days from encounter.delivered_at to the
                            logical clock instant (floor)
      restock_eligible = (condition == SELLABLE)
                     AND (product.category != CUSTOM_FABRICATED)
                     AND (days_since_delivery <= RESTOCK_WINDOW_DAYS)
      # ---- step 2: restocking fee percentage ---------------------------
      restock_fee_pct = REASON_FEE_PCT[reason]     # see constants
      if restock_eligible == false AND reason IN {POOR_FIT, PATIENT_REFUSED}:
          restock_fee_pct = NON_SELLABLE_FEE_PCT
      # ---- step 3: split the charge into two ordered buckets -----------
      # The device bucket is filled first at DEVICE_SHARE_PCT of the amount
      # the patient was charged; the fitting bucket takes the exact
      # remainder, so the two buckets always re-sum to the charge with no
      # rounding drift.
      charged = encounter.patient_responsibility_cents
      device_component_cents  = round_half_up(charged * DEVICE_SHARE_PCT)
      fitting_component_cents = charged - device_component_cents
      # ---- step 4: refund each bucket at ITS OWN fee rate --------------
      # The fitting bucket is only half-charged the restocking fee, because
      # the fitting labour is partially recoverable. round_half_up is
      # applied to EACH bucket's refund SEPARATELY and the two rounded
      # refunds are then added. Summing the two unrounded refunds and
      # rounding once is a DIFFERENT number and is wrong.
      device_refund_cents  = round_half_up(device_component_cents  * (1 - restock_fee_pct))
      fitting_refund_cents = round_half_up(fitting_component_cents * (1 - restock_fee_pct * FITTING_FEE_SHARE))
      refund_cents         = device_refund_cents + fitting_refund_cents
      restock_fee_cents    = charged - refund_cents
    input_set: |
      One ProductReturn, its DispenseEncounter (patient_responsibility_cents
      as written by calculations.patient_responsibility at dispense, and
      delivered_at) and the DeviceProduct category. Other returns of the same
      patient or the same product are never included.
    constants:
      RESTOCK_WINDOW_DAYS: 30
      RETURN_WINDOW_DAYS_POOR_FIT: 30
      RETURN_WINDOW_DAYS_PATIENT_REFUSED: 30
      RETURN_WINDOW_DAYS_DEFECT: 90
      RETURN_WINDOW_DAYS_WRONG_ITEM: 90
      REASON_FEE_PCT_DEFECT: 0.00
      REASON_FEE_PCT_WRONG_ITEM: 0.00
      REASON_FEE_PCT_POOR_FIT: 0.10
      REASON_FEE_PCT_PATIENT_REFUSED: 0.20
      NON_SELLABLE_FEE_PCT: 0.25
      DEVICE_SHARE_PCT: 0.85
      FITTING_FEE_SHARE: 0.5
    precision: "integer cents; round_half_up applied to the device component and then separately to each of the two refund lines; never to the sum of the two refunds"

  - name: same_or_similar_lookback
    trigger: "POST /dme/encounters/{id}/coverage-verifications, before the CoverageVerification row is written"
    algorithm: chronological
    formula: |
      candidates = DispenseEncounter rows E where
            E.patient_id == this.patient_id
        AND E.id        != this.id
        AND E.clinical_status == DELIVERED
        AND product_of(E).same_or_similar_group == product_of(this).same_or_similar_group
      # RETURNED, RETURN_PENDING, VOIDED, FITTED, RESERVED, AWAITING_DEVICE
      # and DRAFT encounters are NOT candidates: only a delivered-and-kept
      # device consumes the reasonable useful lifetime.
      if candidates is empty:
          prior_delivered_encounter_id = null
          months_since_prior_delivery  = null
          same_or_similar_conflict     = false
      else:
          prior = candidate with the greatest delivered_at
                  (tie-break: the earliest created_at -- never id)
          # whole CALENDAR months, day-of-month aware
          m = (clock.year - prior.delivered_at.year) * 12
            + (clock.month - prior.delivered_at.month)
          if clock.day < prior.delivered_at.day: m = m - 1
          months_since_prior_delivery = m
          # HALF-OPEN window [0, reasonable_useful_lifetime_months):
          # a conflict exists strictly BELOW the lifetime. At exactly the
          # lifetime the window has closed and there is no conflict.
          same_or_similar_conflict =
              months_since_prior_delivery < product.reasonable_useful_lifetime_months
    input_set: |
      All DELIVERED DispenseEncounters of the SAME Patient whose product
      shares the same same_or_similar_group, across every clinic of the
      practice. Encounters of other patients are excluded even when the
      product matches; encounters of the same patient in any other clinical
      status are excluded even when the product matches.
    constants: {}
    precision: "whole calendar months, day-of-month aware; no fractional months"

  - name: par_stock_posture
    trigger: "any mutation of ClinicParLevel.on_hand_qty or ClinicParLevel.reserved_qty (creation, stock receipt, reservation, reservation release, dispense consumption, restocked return)"
    algorithm: threshold
    formula: |
      # Two DIFFERENT quantities, deliberately not interchangeable:
      #   available_qty  = what is uncommitted  -> drives the sufficiency
      #                    check ERR_INSUFFICIENT_PAR_STOCK only
      #   stock_posture  = what is PHYSICALLY on the shelf -> driven by
      #                    on_hand_qty only
      # A reservation therefore lowers available_qty but NEVER moves
      # stock_posture; only a dispense, a stock receipt or a restocked
      # return moves the posture.
      available_qty  = on_hand_qty - reserved_qty
      critical_floor = ceil(par_min_qty / 2)      # integer: (par_min_qty + 1) // 2
      if on_hand_qty <= 0:                stock_posture = STOCKOUT
      elif on_hand_qty <  critical_floor: stock_posture = CRITICAL
      elif on_hand_qty <  par_min_qty:    stock_posture = BELOW_PAR
      else:                               stock_posture = OK
      # Boundaries are exact: on_hand_qty == critical_floor is BELOW_PAR
      # (not CRITICAL) and on_hand_qty == par_min_qty is OK (not BELOW_PAR).
    input_set: "the single ClinicParLevel row being mutated; sibling par levels of the same clinic or the same product are not consulted"
    constants: {}
    precision: "integer units; ceil on the critical floor only"

  - name: clinic_dispensing_posture
    trigger: "any ClinicParLevel.stock_posture change that enters or leaves STOCKOUT for a par level of this clinic"
    algorithm: aggregation
    formula: |
      # Only a shelf that has ONCE been stocked and is now empty counts
      # against the clinic. A par level created but never received
      # (lifetime_received_qty == 0) sits in stock_posture STOCKOUT yet is
      # NOT a dispensing failure, so it is excluded from the count.
      stockout_par_level_count = count of ClinicParLevel rows P where
            P.clinic_id == clinic.id
        AND P.stock_posture == STOCKOUT
        AND P.lifetime_received_qty > 0
      if stockout_par_level_count == 0:      dispensing_status = ACTIVE
      elif stockout_par_level_count == 1:    dispensing_status = RESTRICTED
      else:                                  dispensing_status = SUSPENDED
      # The count is a full recount over the clinic's par levels, not an
      # increment, so a mutation that flips two par levels in one request
      # lands on SUSPENDED directly.
    input_set: "every ClinicParLevel of this Clinic regardless of product category; par levels of other clinics are excluded even for the same product"
    constants:
      RESTRICTED_STOCKOUT_COUNT: 1
      SUSPENDED_STOCKOUT_COUNT: 2
    precision: "integer count"

  - name: supplier_turnaround_score
    trigger: "POST /dme/custom-fab-orders/{id}/fabrication-events with event == DELIVER_TO_CLINIC (projected score) and POST /dme/custom-fab-orders/{id}/fitting-check with outcome == ACCEPT (final score)"
    algorithm: decay_function
    formula: |
      promised = order.promised_turnaround_days_snapshot
      # ---- variant promised_basis (projected, at first delivery) -------
      first_delivery_days = whole days from order.submitted_at to
                            order.first_delivered_at (floor)
      late_days_projected = max(0, first_delivery_days - promised)
      projected_turnaround_score =
          max(SCORE_FLOOR,
              SCORE_CEILING - LATE_DAY_PENALTY_POINTS * late_days_projected)
      # adjustment rounds are DELIBERATELY not charged in this variant
      # ---- variant elapsed_basis (final, at acceptance) ---------------
      total_elapsed_days = whole days from order.submitted_at to
                           order.accepted_at (floor)
      late_days_final = max(0, total_elapsed_days - promised)
      final_turnaround_score =
          max(SCORE_FLOOR,
              SCORE_CEILING - LATE_DAY_PENALTY_POINTS * late_days_final
                            - ADJUSTMENT_PENALTY_POINTS * order.adjustment_rounds)
      # ---- supplier rollup (only ACCEPTED orders) ---------------------
      accepted = CustomFabOrder rows of this supplier with status == ACCEPTED
      Supplier.accepted_fab_order_count = count(accepted)
      Supplier.turnaround_score =
          SCORE_CEILING if count(accepted) == 0
          else round_half_up(sum(final_turnaround_score over accepted) / count(accepted))
    input_set: |
      One CustomFabOrder for each variant. For the supplier rollup, only that
      supplier's CustomFabOrder rows in status ACCEPTED are included --
      SUBMITTED, IN_FABRICATION, READY_FOR_FITTING, ADJUSTMENT_REQUESTED,
      SUPPLIER_HOLD and CANCELLED orders are excluded, so cancelling a badly
      late order removes it from the supplier's average entirely.
    constants:
      SCORE_CEILING: 100
      SCORE_FLOOR: 0
      LATE_DAY_PENALTY_POINTS: 4
      ADJUSTMENT_PENALTY_POINTS: 6
      FAB_ADJUSTMENT_ROUND_LIMIT: 2
    precision: "integer points, clamped to [0, 100]; round_half_up on the supplier average only"
    variants:
      - name: promised_basis
        when: "written at the first DELIVER_TO_CLINIC event, before the fitter has seen the device"
        difference: |
          Measures submitted_at -> first_delivered_at only and charges no
          adjustment penalty, so it credits a supplier that shipped something
          on time and then needed rework.
      - name: elapsed_basis
        when: "written at ACCEPT, when the fitter accepts the finished device"
        difference: |
          Measures submitted_at -> accepted_at (which includes every
          adjustment round) AND charges ADJUSTMENT_PENALTY_POINTS per
          adjustment round, so for identical order data it is strictly lower
          than promised_basis whenever any rework occurred. Only this variant
          feeds Supplier.turnaround_score.

# ---------------------------------------------------------------------------
# §1.4 Validation Rules Table (evaluated in ascending priority order; the
#      FIRST rule whose condition is violated determines the response)
#      Ladder: 1-4 authentication/authorization, 5 request shape,
#      6-18 existence (path resources left-to-right, then body FKs),
#      19 clinic scoping, 20-25 state preconditions, 26-27 optimistic
#      concurrency, 28-39 regulatory/compliance safety, 40-49 coverage and
#      authorization constraints, 50-59 constraint satisfaction (uniqueness
#      and temporal), 60-62 capacity/inventory last.
# ---------------------------------------------------------------------------
validations:
  - priority: 1
    category: auth
    check: "X-User-Id and X-User-Role headers are both present and non-empty"
    error_id: ERR_MISSING_AUTH_HEADERS
    http_status: 401
    applies_to: "all"

  - priority: 2
    category: auth
    check: "X-User-Role is one of the six roles declared in §1.7"
    error_id: ERR_UNKNOWN_ROLE
    http_status: 401
    applies_to: "all"

  - priority: 3
    category: auth
    check: "the acting role appears in the target endpoint's roles list"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: "all"

  - priority: 4
    category: auth
    check: |
      for the entity-backed roles OrthoPhysician and DmeFitter, X-User-Id is
      the id of an existing Physician or Fitter row respectively; opaque roles
      are not checked. One carve-out keeps the more specific fitter diagnosis
      reachable: on the two endpoints that attribute a record to a fitter
      (POST /dme/encounters/{id}/fitting-records and POST /dme/returns/{id}/refit)
      an unknown Fitter actor is reported as ERR_FITTER_NOT_FOUND (priority 11)
      instead of ERR_ACTOR_NOT_FOUND, so this rule is not evaluated for the
      DmeFitter role on those two paths.
    error_id: ERR_ACTOR_NOT_FOUND
    http_status: 403
    applies_to: "all endpoints whose roles include OrthoPhysician; all endpoints whose roles include DmeFitter except POST /dme/encounters/{id}/fitting-records and POST /dme/returns/{id}/refit"

  - priority: 5
    category: business_constraint
    check: "the request body carries every field the endpoint's input marks required, every value has the declared type, every enum value is a declared member, and integer quantities/money are >= 0"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all POST endpoints"

  - priority: 6
    category: existence
    check: "the Clinic named by the path or by clinic_id in the body exists"
    error_id: ERR_CLINIC_NOT_FOUND
    http_status: 404
    applies_to: "GET /dme/clinics/{id}, GET /dme/clinics/{id}/physicians, GET /dme/clinics/{id}/fitters, GET /dme/clinics/{id}/patients, GET /dme/clinics/{id}/dispensing-summary, POST /dme/clinics/{id}/physicians, POST /dme/clinics/{id}/fitters, POST /dme/clinics/{id}/patients, POST /dme/par-levels, POST /dme/encounters"

  - priority: 7
    category: existence
    check: "the Supplier named by the path or by supplier_id in the body exists"
    error_id: ERR_SUPPLIER_NOT_FOUND
    http_status: 404
    applies_to: "GET /dme/suppliers/{id}, GET /dme/suppliers/{id}/products, POST /dme/suppliers/{id}/standards-attestation, POST /dme/products"

  - priority: 8
    category: existence
    check: "the DeviceProduct named by product_id in the body exists"
    error_id: ERR_PRODUCT_NOT_FOUND
    http_status: 404
    applies_to: "POST /dme/par-levels, POST /dme/encounters"

  - priority: 9
    category: existence
    check: "the Patient named by patient_id in the body exists"
    error_id: ERR_PATIENT_NOT_FOUND
    http_status: 404
    applies_to: "POST /dme/encounters"

  - priority: 10
    category: existence
    check: "the Physician named by ordering_physician_id in the body exists"
    error_id: ERR_PHYSICIAN_NOT_FOUND
    http_status: 404
    applies_to: "POST /dme/encounters"

  - priority: 11
    category: existence
    check: "the Fitter named by the path on GET /dme/fitters/{id} exists, and the Fitter identified by X-User-Id exists on the two endpoints that attribute a record to a fitter; because of the priority-4 carve-out this rule -- not ERR_ACTOR_NOT_FOUND -- is what an unknown DmeFitter actor hits on those two paths"
    error_id: ERR_FITTER_NOT_FOUND
    http_status: 404
    applies_to: "GET /dme/fitters/{id}, POST /dme/encounters/{id}/fitting-records, POST /dme/returns/{id}/refit"

  - priority: 12
    category: existence
    check: "the ClinicParLevel named by the path exists"
    error_id: ERR_PAR_LEVEL_NOT_FOUND
    http_status: 404
    applies_to: "GET /dme/par-levels/{id}, POST /dme/par-levels/{id}/stock-receipts"

  - priority: 13
    category: existence
    check: "the DispenseEncounter named by the path exists"
    error_id: ERR_ENCOUNTER_NOT_FOUND
    http_status: 404
    applies_to: "GET /dme/encounters/{id} and every POST under /dme/encounters/{id}/"

  - priority: 14
    category: existence
    check: "the PriorAuthRequest named by the path exists"
    error_id: ERR_PRIOR_AUTH_NOT_FOUND
    http_status: 404
    applies_to: "POST /dme/prior-auth-requests/{id}/decision, POST /dme/prior-auth-requests/{id}/appeal"

  - priority: 15
    category: existence
    check: "the AbnNotice named by the path exists"
    error_id: ERR_ABN_NOTICE_NOT_FOUND
    http_status: 404
    applies_to: "POST /dme/abn-notices/{id}/signature"

  - priority: 16
    category: existence
    check: "the CustomFabOrder named by the path exists"
    error_id: ERR_FAB_ORDER_NOT_FOUND
    http_status: 404
    applies_to: "GET /dme/custom-fab-orders/{id}, POST /dme/custom-fab-orders/{id}/fabrication-events, POST /dme/custom-fab-orders/{id}/fitting-check"

  - priority: 17
    category: existence
    check: "the ProductReturn named by the path exists"
    error_id: ERR_RETURN_NOT_FOUND
    http_status: 404
    applies_to: "POST /dme/returns/{id}/inspection, POST /dme/returns/{id}/refit"

  - priority: 18
    category: existence
    check: "the FittingRecord named by the path exists"
    error_id: ERR_FITTING_RECORD_NOT_FOUND
    http_status: 404
    applies_to: "GET /dme/fitting-records/{id}"

  - priority: 19
    category: business_referential
    check: |
      every entity referenced by a request belongs to the same Clinic as the
      operation's subject: on POST /dme/encounters the Patient and the
      ordering Physician must both have clinic_id == the body's clinic_id AND
      the ordering Physician's specialty must equal the DeviceProduct's
      specialty; on
      POST /dme/par-levels the DeviceProduct must be dispensable at that
      clinic, meaning product.specialty is a member of the Clinic's
      dispensing_specialties; on POST /dme/encounters/{id}/fitting-records
      and POST /dme/returns/{id}/refit the acting Fitter's clinic_id must
      equal the encounter's clinic_id.
    error_id: ERR_CLINIC_SCOPE_MISMATCH
    http_status: 403
    applies_to: "POST /dme/encounters, POST /dme/par-levels, POST /dme/encounters/{id}/fitting-records, POST /dme/returns/{id}/refit"

  - priority: 20
    category: state
    check: |
      the DispenseEncounter's clinical_status is a declared `from` state of the
      requested transition in §1.2. One carve-out is pinned so that the
      duplicate-return rule stays reachable: on
      POST /dme/encounters/{id}/returns this state check is evaluated only when
      the encounter has no ProductReturn yet, so a second return request against
      an encounter that already has one is diagnosed as
      ERR_RETURN_ALREADY_EXISTS (priority 55) rather than as an invalid
      clinical state, even though RETURN_PENDING and RETURNED are not declared
      `from` states of the return trigger.
      POST /dme/encounters/{id}/ioas-attestation is the one endpoint in the
      list that moves NEITHER dimension -- it only stamps
      ioas_attested_at, ioas_attesting_physician_id and
      ioas_supervision_level_observed -- so for that endpoint this rule reads
      as an explicit state window instead of a transition lookup:
      clinical_status must be DOCUMENTED, AWAITING_DEVICE, RESERVED or FITTED
      (supervision may be attested any time after the note is signed and
      before the device is handed over, and may be re-attested to correct the
      observed level), while DRAFT, DELIVERED, RETURN_PENDING, RETURNED and
      VOIDED are rejected with ERR_INVALID_CLINICAL_STATE.
    error_id: ERR_INVALID_CLINICAL_STATE
    http_status: 409
    applies_to: "POST /dme/encounters/{id}/medical-necessity-note, POST /dme/encounters/{id}/ioas-attestation, POST /dme/encounters/{id}/reservations, POST /dme/encounters/{id}/custom-fab-orders, POST /dme/encounters/{id}/fitting-records, POST /dme/encounters/{id}/dispense, POST /dme/encounters/{id}/returns"

  - priority: 21
    category: state
    check: |
      the DispenseEncounter's financial_status is a declared `from` state of the
      requested transition in §1.2. Two carve-outs are pinned on
      POST /dme/encounters/{id}/dispense so that the more specific fiscal
      diagnoses stay reachable, since neither financial state can be reached
      any other way:
        - financial_status == UNVERIFIED and the encounter has no
          CoverageVerification at all -> ERR_COVERAGE_VERIFICATION_MISSING
          (priority 40)
        - financial_status == ABN_ISSUED (a notice is outstanding or was
          declined) -> ERR_ABN_NOT_SIGNED (priority 48)
      Every other dispensable-state violation -- NON_COVERED, AUTH_PENDING,
      AUTH_DENIED, BILLED, REFUNDED, WRITTEN_OFF -- and every violation on the
      other three endpoints yields ERR_INVALID_FINANCIAL_STATE. The
      clinical-state rule at priority 20 still precedes all of this.
    error_id: ERR_INVALID_FINANCIAL_STATE
    http_status: 409
    applies_to: "POST /dme/encounters/{id}/coverage-verifications, POST /dme/encounters/{id}/prior-auth-requests, POST /dme/encounters/{id}/abn-notices, POST /dme/encounters/{id}/dispense"

  - priority: 22
    category: state
    check: "the PriorAuthRequest's status permits the requested operation: a decision requires SUBMITTED or PENDED; an appeal requires PENDED or DENIED"
    error_id: ERR_INVALID_PRIOR_AUTH_STATE
    http_status: 409
    applies_to: "POST /dme/prior-auth-requests/{id}/decision, POST /dme/prior-auth-requests/{id}/appeal"

  - priority: 23
    category: state
    check: "the AbnNotice's status is ISSUED when a signature is recorded"
    error_id: ERR_INVALID_ABN_STATE
    http_status: 409
    applies_to: "POST /dme/abn-notices/{id}/signature"

  - priority: 24
    category: state
    check: |
      the CustomFabOrder's status is a declared `from` state for the submitted
      event or fitting-check outcome. This rule also carries the cross-entity
      guard on the AWAITING_DEVICE -> FITTED clinical transition: when a fitting
      record is created for an encounter whose clinical_status is
      AWAITING_DEVICE, that encounter's CustomFabOrder.status must be ACCEPTED
      (a device still SUBMITTED, IN_FABRICATION, READY_FOR_FITTING,
      ADJUSTMENT_REQUESTED or SUPPLIER_HOLD has not been handed over yet).
    error_id: ERR_INVALID_FAB_ORDER_STATE
    http_status: 409
    applies_to: "POST /dme/custom-fab-orders/{id}/fabrication-events, POST /dme/custom-fab-orders/{id}/fitting-check, POST /dme/encounters/{id}/fitting-records"

  - priority: 25
    category: state
    check: "the ProductReturn's status is REQUESTED for an inspection and RESTOCKED or DESTROYED for a refit"
    error_id: ERR_INVALID_RETURN_STATE
    http_status: 409
    applies_to: "POST /dme/returns/{id}/inspection, POST /dme/returns/{id}/refit"

  - priority: 26
    category: business_constraint
    check: "expected_par_level_version equals the ClinicParLevel's stored version (§1.2.1 reservation-stale-par-level)"
    error_id: ERR_STALE_PAR_LEVEL_VERSION
    http_status: 412
    applies_to: "POST /dme/encounters/{id}/reservations"

  - priority: 27
    category: business_constraint
    check: "expected_encounter_version equals the DispenseEncounter's stored version (§1.2.1 abn-issue-stale-encounter)"
    error_id: ERR_STALE_ENCOUNTER_VERSION
    http_status: 412
    applies_to: "POST /dme/encounters/{id}/abn-notices"

  - priority: 28
    category: business_safety
    check: "the Clinic's accreditation_expires_on is on or after the logical clock date; a lapsed accreditation blocks every in-office dispensing step, including steps whose stock and coverage are otherwise fine"
    error_id: ERR_CLINIC_ACCREDITATION_EXPIRED
    http_status: 422
    applies_to: "POST /dme/encounters/{id}/medical-necessity-note, POST /dme/encounters/{id}/reservations, POST /dme/encounters/{id}/dispense"

  - priority: 29
    category: business_safety
    check: "the Supplier of the encounter's DeviceProduct has dmepos_standards_attested == true and accreditation_expires_on on or after the logical clock date"
    error_id: ERR_SUPPLIER_STANDARDS_NOT_ATTESTED
    http_status: 422
    applies_to: "POST /dme/encounters/{id}/reservations, POST /dme/encounters/{id}/custom-fab-orders, POST /dme/custom-fab-orders/{id}/fabrication-events, POST /dme/encounters/{id}/dispense"

  - priority: 30
    category: business_safety
    check: "the Supplier of the encounter's DeviceProduct has quality_hold == false"
    error_id: ERR_SUPPLIER_QUALITY_HOLD
    http_status: 422
    applies_to: "POST /dme/encounters/{id}/reservations, POST /dme/encounters/{id}/custom-fab-orders, POST /dme/custom-fab-orders/{id}/fabrication-events"

  - priority: 31
    category: business_safety
    check: "the DispenseEncounter's compliance_hold is false"
    error_id: ERR_COMPLIANCE_HOLD_ACTIVE
    http_status: 409
    applies_to: "POST /dme/encounters/{id}/fitting-records, POST /dme/encounters/{id}/dispense"

  - priority: 32
    category: business_safety
    check: "the encounter carries a non-null ioas_attested_at, and when the DeviceProduct has ioas_supervision_required == DIRECT both the Clinic's ioas_supervision_level and the encounter's ioas_supervision_level_observed are DIRECT (GENERAL is insufficient for that class of item)"
    error_id: ERR_IOAS_SUPERVISION_MISSING
    http_status: 422
    applies_to: "POST /dme/encounters/{id}/dispense"

  - priority: 33
    category: business_safety
    check: "the Physician attesting in-office ancillary supervision (X-User-Id on POST /dme/encounters/{id}/ioas-attestation) is NOT the encounter's ordering_physician_id -- self-referral supervision must be attested by a second group physician"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 409
    applies_to: "POST /dme/encounters/{id}/ioas-attestation"

  - priority: 34
    category: business_safety
    check: "the encounter's ordering Physician has group_member == true and stark_disclosure_on_file == true, and the attesting Physician has group_member == true"
    error_id: ERR_STARK_DISCLOSURE_MISSING
    http_status: 422
    applies_to: "POST /dme/encounters/{id}/medical-necessity-note, POST /dme/encounters/{id}/ioas-attestation, POST /dme/encounters/{id}/dispense"

  - priority: 35
    category: business_safety
    check: |
      the encounter carries a USABLE medical-necessity note at dispense:
      mn_signed_at, mn_diagnosis_code, mn_functional_deficit and
      mn_expected_duration_months are all non-null, AND the note is
      contemporaneous -- the whole days from mn_signed_at to the logical clock
      instant are at most 90 (MN_NOTE_VALIDITY_DAYS). A note signed more than 90
      whole days before delivery is stale and the physician must re-document
      before the device may be handed over.
    error_id: ERR_MEDICAL_NECESSITY_MISSING
    http_status: 422
    applies_to: "POST /dme/encounters/{id}/dispense"

  - priority: 36
    category: business_safety
    check: "the acting Fitter's credential is not NONE and credential_expires_on is on or after the logical clock date"
    error_id: ERR_FITTER_CREDENTIAL_EXPIRED
    http_status: 422
    applies_to: "POST /dme/encounters/{id}/fitting-records, POST /dme/custom-fab-orders/{id}/fitting-check, POST /dme/encounters/{id}/dispense"

  - priority: 37
    category: business_safety
    check: "when the DeviceProduct.category is CUSTOM_FITTED_PREFAB or CUSTOM_FABRICATED, the acting Fitter's privilege_scope is CUSTOM_AND_OFF_SHELF; OFF_SHELF_ONLY fitters may only fit OFF_SHELF_PREFAB devices"
    error_id: ERR_FITTER_PRIVILEGE_SCOPE
    http_status: 403
    applies_to: "POST /dme/encounters/{id}/fitting-records, POST /dme/custom-fab-orders/{id}/fitting-check"

  - priority: 38
    category: business_safety
    check: "the Fitter issuing a refit (X-User-Id on POST /dme/returns/{id}/refit) is NOT the fitter_id of the returned encounter -- a poor fit may not be re-fitted by the fitter who produced it"
    error_id: ERR_REFIT_SAME_FITTER
    http_status: 409
    applies_to: "POST /dme/returns/{id}/refit"

  - priority: 39
    category: business_safety
    check: "delivery_signature_role is present and is not REFUSED; a refused signature cannot complete delivery"
    error_id: ERR_DELIVERY_SIGNATURE_MISSING
    http_status: 422
    applies_to: "POST /dme/encounters/{id}/dispense"

  - priority: 40
    category: business_referential
    check: "at least one CoverageVerification exists for the encounter before it can be dispensed"
    error_id: ERR_COVERAGE_VERIFICATION_MISSING
    http_status: 422
    applies_to: "POST /dme/encounters/{id}/dispense"

  - priority: 41
    category: business_temporal
    check: "the effective CoverageVerification (greatest verification_seq) has expires_at on or after the logical clock instant"
    error_id: ERR_COVERAGE_VERIFICATION_EXPIRED
    http_status: 422
    applies_to: "POST /dme/encounters/{id}/dispense"

  - priority: 42
    category: business_temporal
    check: "calculations.same_or_similar_lookback yields same_or_similar_conflict == false; a device in the same same_or_similar_group delivered to this patient strictly fewer than reasonable_useful_lifetime_months ago blocks a covered verification"
    error_id: ERR_SAME_OR_SIMILAR_CONFLICT
    http_status: 409
    applies_to: "POST /dme/encounters/{id}/coverage-verifications with covered == true"

  - priority: 43
    category: business_constraint
    check: "when the DeviceProduct has requires_prior_auth == true, a PriorAuthRequest with status APPROVED and expires_at on or after the logical clock instant exists for the encounter"
    error_id: ERR_PRIOR_AUTH_REQUIRED
    http_status: 422
    applies_to: "POST /dme/encounters/{id}/dispense"

  - priority: 44
    category: business_constraint
    check: "no PriorAuthRequest already exists for the encounter, and the product actually requires prior authorization"
    error_id: ERR_PRIOR_AUTH_ALREADY_EXISTS
    http_status: 409
    applies_to: "POST /dme/encounters/{id}/prior-auth-requests"

  - priority: 45
    category: business_constraint
    check: "appeal_round is strictly below the appeal limit of 2 before an appeal is accepted"
    error_id: ERR_APPEAL_LIMIT_REACHED
    http_status: 422
    applies_to: "POST /dme/prior-auth-requests/{id}/appeal"

  - priority: 46
    category: business_constraint
    check: "on an APPROVED decision, approved_units is at least 1 and at most requested_units"
    error_id: ERR_APPROVED_UNITS_EXCEED_REQUEST
    http_status: 422
    applies_to: "POST /dme/prior-auth-requests/{id}/decision"

  - priority: 47
    category: business_fiscal
    check: "when encounter.quantity exceeds the covered unit count, an AbnNotice with status SIGNED, the greatest notice_seq, and option_selected in {OPTION_1, OPTION_2} exists for the encounter"
    error_id: ERR_ABN_REQUIRED_FOR_EXCESS_UNITS
    http_status: 422
    applies_to: "POST /dme/encounters/{id}/dispense"

  - priority: 48
    category: business_fiscal
    check: "when financial_status is ABN_ISSUED the encounter cannot be dispensed: the outstanding notice must be signed first"
    error_id: ERR_ABN_NOT_SIGNED
    http_status: 422
    applies_to: "POST /dme/encounters/{id}/dispense"

  - priority: 49
    category: business_constraint
    check: "the AbnNotice being signed has the GREATEST notice_seq for its encounter; a notice superseded by a later issuance cannot be signed"
    error_id: ERR_ABN_SUPERSEDED
    http_status: 409
    applies_to: "POST /dme/abn-notices/{id}/signature"

  - priority: 50
    category: business_constraint
    check: "Physician.npi is unique across the whole practice"
    error_id: ERR_DUPLICATE_NPI
    http_status: 409
    applies_to: "POST /dme/clinics/{id}/physicians"

  - priority: 51
    category: business_constraint
    check: "at most one ClinicParLevel exists per (clinic_id, product_id) pair"
    error_id: ERR_DUPLICATE_PAR_LEVEL
    http_status: 409
    applies_to: "POST /dme/par-levels"

  - priority: 52
    category: business_temporal
    check: |
      the requested fitting interval does not conflict with any existing
      FittingRecord of the SAME Fitter. The fitter's interval is CLOSED and
      padded by a 15-minute changeover buffer on each side: a new interval
      [s, e] conflicts with an existing [s0, e0] when
      s <= e0 + 15min AND e >= s0 - 15min. Touching endpoints therefore
      conflict, and so does a gap of exactly 15 minutes; a gap strictly
      greater than 15 minutes does not.
    error_id: ERR_FITTING_SLOT_CONFLICT
    http_status: 409
    applies_to: "POST /dme/encounters/{id}/fitting-records"

  - priority: 53
    category: business_temporal
    check: "fitting_end_at is strictly after fitting_start_at and neither instant falls on a calendar date strictly after the logical clock date (same-day instants later than the clock time are accepted)"
    error_id: ERR_INVALID_INTERVAL
    http_status: 422
    applies_to: "POST /dme/encounters/{id}/fitting-records"

  - priority: 54
    category: business_temporal
    check: "days_since_delivery is at most the return window for the submitted reason (30 days for POOR_FIT and PATIENT_REFUSED, 90 days for DEFECT and WRONG_ITEM)"
    error_id: ERR_RETURN_WINDOW_EXPIRED
    http_status: 422
    applies_to: "POST /dme/encounters/{id}/returns"

  - priority: 55
    category: business_constraint
    check: "no ProductReturn already exists for the encounter"
    error_id: ERR_RETURN_ALREADY_EXISTS
    http_status: 409
    applies_to: "POST /dme/encounters/{id}/returns"

  - priority: 56
    category: business_constraint
    check: "the ProductReturn's reason is POOR_FIT or WRONG_ITEM; a DEFECT or PATIENT_REFUSED return is not refit-eligible"
    error_id: ERR_REFIT_REASON_NOT_ELIGIBLE
    http_status: 422
    applies_to: "POST /dme/returns/{id}/refit"

  - priority: 57
    category: business_constraint
    check: "adjustment_rounds is strictly below the fabrication adjustment limit of 2 before another adjustment is requested"
    error_id: ERR_ADJUSTMENT_LIMIT_REACHED
    http_status: 422
    applies_to: "POST /dme/custom-fab-orders/{id}/fitting-check"

  - priority: 58
    category: business_constraint
    check: "the Supplier of the product has custom_fab_capable == true when a custom fabrication order is placed"
    error_id: ERR_CUSTOM_FAB_NOT_SUPPORTED
    http_status: 422
    applies_to: "POST /dme/encounters/{id}/custom-fab-orders"

  - priority: 59
    category: business_constraint
    check: "the operation matches the DeviceProduct.category: reservations require OFF_SHELF_PREFAB or CUSTOM_FITTED_PREFAB, custom fabrication orders require CUSTOM_FABRICATED, and a ClinicParLevel may not be created for a CUSTOM_FABRICATED product"
    error_id: ERR_PRODUCT_CATEGORY_MISMATCH
    http_status: 422
    applies_to: "POST /dme/par-levels, POST /dme/encounters/{id}/reservations, POST /dme/encounters/{id}/custom-fab-orders"

  - priority: 60
    category: business_constraint
    check: "the Clinic's dispensing_status is not SUSPENDED, and when it is RESTRICTED the targeted ClinicParLevel's stock_posture is not STOCKOUT"
    error_id: ERR_CLINIC_DISPENSING_SUSPENDED
    http_status: 409
    applies_to: "POST /dme/encounters/{id}/reservations, POST /dme/encounters/{id}/custom-fab-orders, POST /dme/encounters/{id}/dispense"

  - priority: 61
    category: business_constraint
    check: "the ClinicParLevel's available_qty (on_hand_qty - reserved_qty) is at least the encounter's quantity"
    error_id: ERR_INSUFFICIENT_PAR_STOCK
    http_status: 422
    applies_to: "POST /dme/encounters/{id}/reservations"

  - priority: 62
    category: business_constraint
    check: "a stock receipt does not drive on_hand_qty above par_max_qty, and par_min_qty is at most par_max_qty at par-level creation"
    error_id: ERR_PAR_MAX_EXCEEDED
    http_status: 422
    applies_to: "POST /dme/par-levels, POST /dme/par-levels/{id}/stock-receipts"

# ---------------------------------------------------------------------------
# §1.5 API Endpoint Table
#   Every response is wrapped in the §1.0 envelope; `output:` names the entity
#   carried in `data` (or an inline field map for computed reads).
#   Headers X-User-Id and X-User-Role are required on every endpoint.
# ---------------------------------------------------------------------------
endpoints:
  # ---- test-driving: logical clock ---------------------------------------
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Sets the server's logical clock. The clock's startup default is exactly 2026-08-01T00:00:00Z; before any call to this endpoint the server MUST read that instant and MUST NOT fall back to real wall-clock time. Every day/month window in §1.3 and §1.4 is evaluated against this clock."
    roles: [PracticeAdmin, ComplianceOfficer, InventoryManager, InsuranceCoordinator, OrthoPhysician, DmeFitter]
    code: 200
    input: [current_utc]
    output: { current_utc: string, previous_utc: string }
    side_effects: ["advances or rewinds the logical clock used by every date/interval rule; no entity is mutated"]

  # ---- clinics -----------------------------------------------------------
  - method: POST
    path: "/dme/clinics"
    description: "Registers a clinic site of the orthopedic group with its accreditation and in-office ancillary supervision posture."
    roles: [PracticeAdmin]
    code: 201
    input: [name, state_code, accreditation_body, accreditation_expires_on, ioas_supervision_level, dispensing_specialties]
    output: Clinic
    side_effects: ["creates the Clinic with dispensing_status ACTIVE and stockout_par_level_count 0"]

  - method: GET
    path: "/dme/clinics/{id}"
    description: "Reads one clinic including its computed dispensing_status and stockout_par_level_count."
    roles: [PracticeAdmin, ComplianceOfficer, InventoryManager, InsuranceCoordinator, OrthoPhysician, DmeFitter]
    code: 200
    input: []
    output: Clinic
    side_effects: []

  - method: POST
    path: "/dme/clinics/{id}/physicians"
    description: "Adds a group physician to a clinic. npi is unique practice-wide."
    roles: [PracticeAdmin]
    code: 201
    input: [full_name, npi, specialty, "group_member?", "stark_disclosure_on_file?"]
    output: Physician
    side_effects: ["creates the Physician bound to the path clinic"]

  - method: GET
    path: "/dme/clinics/{id}/physicians"
    description: "Lists the physicians of a clinic (reverse reachability for Physician.clinic_id)."
    roles: [PracticeAdmin, ComplianceOfficer, OrthoPhysician]
    code: 200
    input: ["specialty?", "limit?", "offset?"]
    output: Physician[]
    side_effects: []

  - method: POST
    path: "/dme/clinics/{id}/fitters"
    description: "Adds a fitter to a clinic with a credential and a fitting privilege scope."
    roles: [PracticeAdmin]
    code: 201
    input: [full_name, credential, credential_expires_on, privilege_scope]
    output: Fitter
    side_effects: ["creates the Fitter bound to the path clinic with fitting_minutes_booked 0"]

  - method: GET
    path: "/dme/clinics/{id}/fitters"
    description: "Lists the fitters of a clinic (reverse reachability for Fitter.clinic_id)."
    roles: [PracticeAdmin, ComplianceOfficer, DmeFitter]
    code: 200
    input: ["privilege_scope?", "limit?", "offset?"]
    output: Fitter[]
    side_effects: []

  - method: GET
    path: "/dme/fitters/{id}"
    description: "Reads one fitter including the computed fitting_minutes_booked rollup."
    roles: [PracticeAdmin, ComplianceOfficer, DmeFitter]
    code: 200
    input: []
    output: Fitter
    side_effects: []

  - method: POST
    path: "/dme/clinics/{id}/patients"
    description: "Registers a patient at a clinic with a payer type."
    roles: [PracticeAdmin, InsuranceCoordinator]
    code: 201
    input: [full_name, dob, payer_type, "member_id?", "medicare_beneficiary?"]
    output: Patient
    side_effects: ["creates the Patient bound to the path clinic"]

  - method: GET
    path: "/dme/clinics/{id}/patients"
    description: "Lists the patients of a clinic (reverse reachability for Patient.clinic_id)."
    roles: [PracticeAdmin, InsuranceCoordinator]
    code: 200
    input: ["payer_type?", "limit?", "offset?"]
    output: Patient[]
    side_effects: []

  - method: GET
    path: "/dme/clinics/{id}/dispensing-summary"
    description: |
      Computed read reconciling the clinic's two conserved quantities. Every
      field is derived, never stored, and each is pinned as follows so the two
      invariants are unambiguous.

      Unit ledger (all sums over the ClinicParLevel rows of this clinic and the
      DispenseEncounter rows of this clinic, off-shelf and custom-fitted-prefab
      devices only -- CUSTOM_FABRICATED items never touch a shelf and are
      excluded from every unit total):
        units_received_total  = sum of ClinicParLevel.lifetime_received_qty
        units_on_hand_total   = sum of ClinicParLevel.on_hand_qty
        units_reserved_total  = sum of ClinicParLevel.reserved_qty
                                (a SUBSET of on hand, not an addend)
        units_dispensed_total = sum of DispenseEncounter.quantity over
                                encounters whose clinical_status has reached
                                DELIVERED (DELIVERED, RETURN_PENDING, RETURNED)
        units_restocked_total = sum of ProductReturn.quantity_returned over
                                returns in status RESTOCKED or REFIT_ISSUED
                                whose inspection condition was SELLABLE
        units_destroyed_total = sum of ProductReturn.quantity_returned over
                                returns in status DESTROYED or REFIT_ISSUED
                                whose inspection condition was not SELLABLE
        units_accounted_total = units_on_hand_total + units_dispensed_total
                                - units_restocked_total
      INVARIANT U: units_accounted_total == units_received_total at every point
      in the lifecycle. Reserving does not move on_hand_qty, dispensing moves a
      unit from the shelf into units_dispensed_total, a SELLABLE restock puts it
      back on the shelf while it stays counted as dispensed (hence the
      subtraction), and a destroyed unit stays counted as dispensed and is
      reported separately in units_destroyed_total.

      Cash ledger:
        gross_charged_cents        = sum of DispenseEncounter.patient_responsibility_cents
                                     over encounters whose financial_status is
                                     BILLED or REFUNDED (this field is NOT zeroed
                                     by a refund; billable_amount_cents is)
        refunded_cents             = sum of ProductReturn.refund_cents over
                                     returns in status RESTOCKED, DESTROYED or
                                     REFIT_ISSUED
        restock_fee_retained_cents = sum of ProductReturn.restock_fee_cents over
                                     the same set of returns
        net_cash_position_cents    = gross_charged_cents - refunded_cents
      INVARIANT C: for every inspected return, refund_cents + restock_fee_cents
      equals the encounter's patient_responsibility_cents, so once every billed
      encounter of a clinic has been returned and inspected,
      net_cash_position_cents == restock_fee_retained_cents exactly.
    roles: [PracticeAdmin, ComplianceOfficer, InventoryManager]
    code: 200
    input: []
    output:
      clinic_id: string
      dispensing_status: string
      stockout_par_level_count: integer
      units_received_total: integer
      units_on_hand_total: integer
      units_reserved_total: integer
      units_dispensed_total: integer
      units_restocked_total: integer
      units_destroyed_total: integer
      units_accounted_total: integer
      gross_charged_cents: integer
      refunded_cents: integer
      restock_fee_retained_cents: integer
      net_cash_position_cents: integer
    side_effects: []

  # ---- suppliers and products -------------------------------------------
  - method: POST
    path: "/dme/suppliers"
    description: "Registers a DMEPOS supplier with its accreditation and promised custom-fabrication turnaround."
    roles: [PracticeAdmin]
    code: 201
    input: [name, accreditation_body, accreditation_expires_on, promised_turnaround_days, "dmepos_standards_attested?", "custom_fab_capable?", "quality_hold?"]
    output: Supplier
    side_effects: ["creates the Supplier with turnaround_score 100 and accepted_fab_order_count 0"]

  - method: GET
    path: "/dme/suppliers/{id}"
    description: "Reads one supplier including the computed turnaround_score and accepted_fab_order_count."
    roles: [PracticeAdmin, ComplianceOfficer, InventoryManager]
    code: 200
    input: []
    output: Supplier
    side_effects: []

  - method: POST
    path: "/dme/suppliers/{id}/standards-attestation"
    description: "Records or withdraws the supplier's DMEPOS supplier-standards attestation and toggles its quality hold. Raising the hold cascades to the supplier's open fabrication orders and, through them, to the encounters waiting on those orders."
    roles: [ComplianceOfficer]
    code: 200
    input: [dmepos_standards_attested, quality_hold, "accreditation_expires_on?"]
    output: Supplier
    side_effects:
      - "updates dmepos_standards_attested, quality_hold and (when supplied) accreditation_expires_on; increments Supplier.version by 1"
      - "raising quality_hold moves every CustomFabOrder of this supplier in SUBMITTED, IN_FABRICATION or ADJUSTMENT_REQUESTED to SUPPLIER_HOLD"
      - "each such order sets compliance_hold = true and hold_reason = SUPPLIER_QUALITY_HOLD on its DispenseEncounter"
      - "clearing quality_hold returns SUPPLIER_HOLD orders to IN_FABRICATION and clears compliance_hold where hold_reason == SUPPLIER_QUALITY_HOLD"

  - method: POST
    path: "/dme/products"
    description: "Adds a brace or DME item to the catalog under a supplier."
    roles: [PracticeAdmin, InventoryManager]
    code: 201
    input: [supplier_id, hcpcs_code, description, category, specialty, same_or_similar_group, reasonable_useful_lifetime_months, allowed_amount_cents, cash_price_cents, unit_cost_cents, "requires_prior_auth?", "ioas_supervision_required?"]
    output: DeviceProduct
    side_effects: ["creates the DeviceProduct bound to the named supplier"]

  - method: GET
    path: "/dme/products/{id}"
    description: "Reads one catalog item."
    roles: [PracticeAdmin, InventoryManager, InsuranceCoordinator, DmeFitter]
    code: 200
    input: []
    output: DeviceProduct
    side_effects: []

  - method: GET
    path: "/dme/suppliers/{id}/products"
    description: "Lists a supplier's catalog items (reverse reachability for DeviceProduct.supplier_id)."
    roles: [PracticeAdmin, InventoryManager]
    code: 200
    input: ["category?", "limit?", "offset?"]
    output: DeviceProduct[]
    side_effects: []

  # ---- par levels and stock ---------------------------------------------
  - method: POST
    path: "/dme/par-levels"
    description: "Establishes a clinic-and-product par level. The shelf opens empty (on_hand_qty 0, lifetime_received_qty 0), so its stock_posture is STOCKOUT but it does not yet count against the clinic's dispensing posture."
    roles: [InventoryManager]
    code: 201
    input: [clinic_id, product_id, par_min_qty, par_max_qty]
    output: ClinicParLevel
    side_effects:
      - "creates the ClinicParLevel; runs calculations.par_stock_posture (on_hand_qty 0 -> STOCKOUT)"
      - "runs calculations.clinic_dispensing_posture, which excludes never-received shelves, so Clinic.dispensing_status is unchanged"

  - method: GET
    path: "/dme/par-levels/{id}"
    description: "Reads one par level including available_qty and stock_posture."
    roles: [PracticeAdmin, InventoryManager, DmeFitter]
    code: 200
    input: []
    output: ClinicParLevel
    side_effects: []

  - method: GET
    path: "/dme/par-levels"
    description: "Filtered list of par levels (reverse reachability for ClinicParLevel.clinic_id and ClinicParLevel.product_id)."
    roles: [PracticeAdmin, InventoryManager, DmeFitter]
    code: 200
    input: ["clinic_id?", "product_id?", "stock_posture?", "limit?", "offset?"]
    output: ClinicParLevel[]
    side_effects: []

  - method: POST
    path: "/dme/par-levels/{id}/stock-receipts"
    description: "Receives units onto a clinic shelf. Cannot push on_hand_qty above par_max_qty."
    roles: [InventoryManager]
    code: 201
    input: [received_qty]
    output: ClinicParLevel
    side_effects:
      - "on_hand_qty += received_qty and lifetime_received_qty += received_qty; increments ClinicParLevel.version by 1"
      - "runs calculations.par_stock_posture; a departure from STOCKOUT re-runs calculations.clinic_dispensing_posture"
      - "a Clinic.dispensing_status improvement clears compliance_hold and hold_reason on this clinic's encounters whose hold_reason == CLINIC_SUSPENDED"

  # ---- encounters -------------------------------------------------------
  - method: POST
    path: "/dme/encounters"
    description: "Opens a dispensing encounter in clinical_status DRAFT and financial_status UNVERIFIED. service_date defaults to the logical clock date."
    roles: [PracticeAdmin, OrthoPhysician]
    code: 201
    input: [clinic_id, patient_id, product_id, ordering_physician_id, quantity, "service_date?"]
    output: DispenseEncounter
    side_effects: ["creates the DispenseEncounter with both state dimensions at their initial states, compliance_hold false and all money fields 0"]

  - method: GET
    path: "/dme/encounters/{id}"
    description: "Reads one encounter including both state dimensions, the compliance hold and the computed money fields."
    roles: [PracticeAdmin, ComplianceOfficer, InventoryManager, InsuranceCoordinator, OrthoPhysician, DmeFitter]
    code: 200
    input: []
    output: DispenseEncounter
    side_effects: []

  - method: GET
    path: "/dme/encounters"
    description: "Filtered list of encounters. Provides reverse reachability for every DispenseEncounter FK, including the self-referential refit_of_encounter_id."
    roles: [PracticeAdmin, ComplianceOfficer, InsuranceCoordinator, OrthoPhysician, DmeFitter]
    code: 200
    input: ["clinic_id?", "patient_id?", "product_id?", "ordering_physician_id?", "mn_physician_id?", "ioas_attesting_physician_id?", "fitter_id?", "refit_of_encounter_id?", "clinical_status?", "financial_status?", "compliance_hold?", "limit?", "offset?"]
    output: DispenseEncounter[]
    side_effects: []

  - method: POST
    path: "/dme/encounters/{id}/medical-necessity-note"
    description: "The ordering physician signs the medical-necessity note, moving the clinical dimension DRAFT -> DOCUMENTED."
    roles: [OrthoPhysician]
    code: 201
    input: [mn_diagnosis_code, mn_functional_deficit, mn_expected_duration_months]
    output: DispenseEncounter
    side_effects:
      - "stores the three note fields, stamps mn_physician_id from X-User-Id and mn_signed_at from the logical clock"
      - "clinical_status DRAFT -> DOCUMENTED; increments DispenseEncounter.version by 1"

  - method: POST
    path: "/dme/encounters/{id}/ioas-attestation"
    description: "A SECOND group physician attests in-office ancillary-services supervision for the encounter. The attesting physician may not be the ordering physician."
    roles: [OrthoPhysician]
    code: 201
    input: [ioas_supervision_level_observed]
    output: DispenseEncounter
    side_effects:
      - "stamps ioas_attesting_physician_id from X-User-Id, ioas_attested_at from the logical clock and ioas_supervision_level_observed from the body"
      - "increments DispenseEncounter.version by 1; neither state dimension moves"

  - method: POST
    path: "/dme/encounters/{id}/reservations"
    description: "Reserves par stock for a prefabricated device, moving the clinical dimension DOCUMENTED -> RESERVED. Carries the optimistic-concurrency check on the shelf."
    roles: [DmeFitter]
    code: 201
    input: [expected_par_level_version]
    output: DispenseEncounter
    side_effects:
      - "ClinicParLevel.reserved_qty += encounter.quantity; increments ClinicParLevel.version by 1"
      - "runs calculations.par_stock_posture, which recomputes available_qty only; stock_posture and therefore Clinic.dispensing_status are untouched"
      - "clinical_status DOCUMENTED -> RESERVED; increments DispenseEncounter.version by 1"

  - method: POST
    path: "/dme/encounters/{id}/custom-fab-orders"
    description: "Places a custom-fabrication order for a CUSTOM_FABRICATED product, moving the clinical dimension DOCUMENTED -> AWAITING_DEVICE. No par stock is touched."
    roles: [DmeFitter]
    code: 201
    input: [supplier_id]
    output: CustomFabOrder
    side_effects:
      - "creates the CustomFabOrder in SUBMITTED, stamping submitted_at from the logical clock"
      - "snapshots promised_turnaround_days_snapshot from the Supplier and derives promised_delivery_on = submitted_at date + that many days"
      - "clinical_status DOCUMENTED -> AWAITING_DEVICE; increments DispenseEncounter.version by 1"

  - method: POST
    path: "/dme/encounters/{id}/fitting-records"
    description: "Records a patient fitting session. The outcome decides the clinical dimension: ACCEPTABLE advances to FITTED, ADJUST_NEEDED holds the current state, REJECTED reverts RESERVED -> DOCUMENTED and releases the reservation."
    roles: [DmeFitter]
    code: 201
    input: [fitting_start_at, fitting_end_at, measurement_set, fit_outcome]
    output: FittingRecord
    side_effects:
      - "creates the FittingRecord with fitter_id from X-User-Id and fitting_minutes = whole minutes between the two instants"
      - "Fitter.fitting_minutes_booked += fitting_minutes; increments Fitter.version by 1"
      - "on ACCEPTABLE: sets DispenseEncounter.fitter_id and advances clinical_status to FITTED"
      - "on REJECTED: releases ClinicParLevel.reserved_qty by encounter.quantity, increments ClinicParLevel.version, re-runs calculations.par_stock_posture (available_qty restored, stock_posture unchanged) and reverts clinical_status to DOCUMENTED"
      - "increments DispenseEncounter.version by 1"

  - method: GET
    path: "/dme/fitting-records/{id}"
    description: "Reads one fitting record including the computed fitting_minutes and the delivery signature copied down at dispense."
    roles: [PracticeAdmin, ComplianceOfficer, DmeFitter]
    code: 200
    input: []
    output: FittingRecord
    side_effects: []

  - method: GET
    path: "/dme/fitting-records"
    description: "Filtered list of fitting records (reverse reachability for FittingRecord.encounter_id and FittingRecord.fitter_id)."
    roles: [PracticeAdmin, ComplianceOfficer, DmeFitter]
    code: 200
    input: ["encounter_id?", "fitter_id?", "fit_outcome?", "limit?", "offset?"]
    output: FittingRecord[]
    side_effects: []

  - method: POST
    path: "/dme/encounters/{id}/dispense"
    description: "Delivers the device to the patient against a signature, moving the clinical dimension FITTED -> DELIVERED and the financial dimension to BILLED. This is the deepest cascade in the system: it consumes shelf stock, may stock the shelf out, may restrict or suspend the clinic, and may place other encounters of that clinic on a compliance hold."
    roles: [DmeFitter]
    code: 201
    input: [delivery_signature_role]
    output: DispenseEncounter
    side_effects:
      - "stamps delivered_at and delivery_signature_role, and copies both onto the encounter's most recent FittingRecord"
      - "runs calculations.patient_responsibility, writing covered_units, patient_responsibility_cents, billable_amount_cents and responsibility_variant"
      - "clinical_status FITTED -> DELIVERED and financial_status -> BILLED"
      - "for non-CUSTOM_FABRICATED products: ClinicParLevel.on_hand_qty -= quantity and reserved_qty -= quantity; increments ClinicParLevel.version by 1"
      - "runs calculations.par_stock_posture; a STOCKOUT entry runs calculations.clinic_dispensing_posture"
      - "a Clinic.dispensing_status entry into SUSPENDED sets compliance_hold = true and hold_reason = CLINIC_SUSPENDED on the clinic's other RESERVED encounters"
      - "increments DispenseEncounter.version by 1"

  # ---- coverage, authorization, ABN -------------------------------------
  - method: POST
    path: "/dme/encounters/{id}/coverage-verifications"
    description: "Records an immutable insurance coverage verification for the encounter and runs the same-or-similar equipment lookback. Each verification supersedes the previous one by verification_seq; verifications are never updated."
    roles: [InsuranceCoordinator]
    code: 201
    input: [covered, deductible_remaining_cents, coinsurance_pct, valid_for_days]
    output: CoverageVerification
    side_effects:
      - "assigns verification_seq = previous max for this encounter + 1"
      - "snapshots allowed_amount_cents_snapshot from the DeviceProduct and stamps verified_at plus expires_at = verified_at + valid_for_days days"
      - "runs calculations.same_or_similar_lookback, writing same_or_similar_conflict, prior_delivered_encounter_id, prior_delivered_on and months_since_prior_delivery"
      - "financial_status -> VERIFIED when covered is true, NON_COVERED when covered is false; increments DispenseEncounter.version by 1"

  - method: GET
    path: "/dme/encounters/{id}/coverage-verifications"
    description: "Lists the encounter's coverage verifications newest-seq first (reverse reachability for CoverageVerification.encounter_id and CoverageVerification.prior_delivered_encounter_id)."
    roles: [PracticeAdmin, ComplianceOfficer, InsuranceCoordinator]
    code: 200
    input: ["limit?", "offset?"]
    output: CoverageVerification[]
    side_effects: []

  - method: POST
    path: "/dme/encounters/{id}/prior-auth-requests"
    description: "Submits a prior-authorization request for a product that requires it, moving the financial dimension VERIFIED -> AUTH_PENDING."
    roles: [InsuranceCoordinator]
    code: 201
    input: [requested_units]
    output: PriorAuthRequest
    side_effects:
      - "creates the PriorAuthRequest in SUBMITTED with appeal_round 0"
      - "financial_status VERIFIED -> AUTH_PENDING; increments DispenseEncounter.version by 1"

  - method: GET
    path: "/dme/encounters/{id}/prior-auth-requests"
    description: "Lists the encounter's prior-authorization requests (reverse reachability for PriorAuthRequest.encounter_id)."
    roles: [PracticeAdmin, ComplianceOfficer, InsuranceCoordinator]
    code: 200
    input: ["limit?", "offset?"]
    output: PriorAuthRequest[]
    side_effects: []

  - method: POST
    path: "/dme/prior-auth-requests/{id}/decision"
    description: "Records the payer's decision. APPROVED sets approved_units (which may be fewer than requested), DENIED closes the request, PENDED leaves it open for appeal."
    roles: [InsuranceCoordinator]
    code: 201
    input: [decision, "approved_units?", "auth_number?", "valid_for_days?"]
    output: PriorAuthRequest
    side_effects:
      - "sets status, decision_at and, on APPROVED, approved_units, auth_number and expires_at = decision_at + valid_for_days days"
      - "financial_status moves AUTH_PENDING -> AUTH_APPROVED or AUTH_PENDING -> AUTH_DENIED; PENDED leaves it at AUTH_PENDING"
      - "increments PriorAuthRequest.version and DispenseEncounter.version by 1 each"

  - method: POST
    path: "/dme/prior-auth-requests/{id}/appeal"
    description: "Appeals a pended or denied authorization, returning it to SUBMITTED for another decision. Capped at 2 appeal rounds."
    roles: [InsuranceCoordinator]
    code: 201
    input: ["appeal_note?"]
    output: PriorAuthRequest
    side_effects:
      - "status -> SUBMITTED, appeal_round += 1, decision_at cleared"
      - "financial_status returns to AUTH_PENDING; increments PriorAuthRequest.version and DispenseEncounter.version by 1 each"

  - method: POST
    path: "/dme/encounters/{id}/abn-notices"
    description: "Issues an advance beneficiary notice with a cash-price quote for the non-covered units and supersedes any earlier ISSUED notice. Carries the optimistic-concurrency check on the encounter."
    roles: [InsuranceCoordinator]
    code: 201
    input: [reason_non_covered, expected_encounter_version]
    output: AbnNotice
    side_effects:
      - "moves every earlier ISSUED AbnNotice of this encounter to VOIDED and increments each of their versions by 1"
      - "creates the AbnNotice in ISSUED with notice_seq = previous max + 1 and witness_user_id stamped from X-User-Id"
      - "runs calculations.abn_cash_quote, writing unit_net_price_cents, estimated_subtotal_cents, dispensing_fee_cents and estimated_cost_cents"
      - "financial_status -> ABN_ISSUED; increments DispenseEncounter.version by 1"

  - method: GET
    path: "/dme/encounters/{id}/abn-notices"
    description: "Lists the encounter's advance beneficiary notices newest-seq first (reverse reachability for AbnNotice.encounter_id)."
    roles: [PracticeAdmin, ComplianceOfficer, InsuranceCoordinator]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: AbnNotice[]
    side_effects: []

  - method: POST
    path: "/dme/abn-notices/{id}/signature"
    description: "Records the patient's response to the notice. Supplying option_selected signs it (OPTION_1 or OPTION_2 accept self-pay, OPTION_3 refuses the item); omitting option_selected records a declined signature."
    roles: [InsuranceCoordinator]
    code: 201
    input: ["signed_by?", "option_selected?"]
    output: AbnNotice
    side_effects:
      - "status -> SIGNED with option_selected, signed_by and patient_signed_at, or -> DECLINED when option_selected is omitted"
      - "OPTION_1 / OPTION_2: financial_status ABN_ISSUED -> SELF_PAY"
      - "OPTION_3: financial_status ABN_ISSUED -> WRITTEN_OFF, clinical_status -> VOIDED, any par reservation released (reserved_qty lowered, available_qty restored, stock_posture unchanged), and both money fields set to 0"
      - "increments AbnNotice.version and DispenseEncounter.version by 1 each"

  # ---- custom fabrication ------------------------------------------------
  - method: GET
    path: "/dme/custom-fab-orders/{id}"
    description: "Reads one custom-fabrication order including both turnaround scores."
    roles: [PracticeAdmin, InventoryManager, DmeFitter]
    code: 200
    input: []
    output: CustomFabOrder
    side_effects: []

  - method: GET
    path: "/dme/custom-fab-orders"
    description: "Filtered list of custom-fabrication orders (reverse reachability for CustomFabOrder.encounter_id and CustomFabOrder.supplier_id)."
    roles: [PracticeAdmin, InventoryManager, DmeFitter]
    code: 200
    input: ["encounter_id?", "supplier_id?", "status?", "limit?", "offset?"]
    output: CustomFabOrder[]
    side_effects: []

  - method: POST
    path: "/dme/custom-fab-orders/{id}/fabrication-events"
    description: "Drives the supplier side of fabrication. ACCEPT_ORDER starts or resumes fabrication; DELIVER_TO_CLINIC ships the device to the clinic and, on the FIRST delivery only, stamps first_delivered_at and the projected turnaround score."
    roles: [InventoryManager]
    code: 201
    input: [event]
    output: CustomFabOrder
    side_effects:
      - "ACCEPT_ORDER: status SUBMITTED|ADJUSTMENT_REQUESTED|SUPPLIER_HOLD -> IN_FABRICATION"
      - "DELIVER_TO_CLINIC: status IN_FABRICATION -> READY_FOR_FITTING; on the first such event stamps first_delivered_at, derives first_delivery_days and writes projected_turnaround_score via calculations.supplier_turnaround_score variant promised_basis"
      - "increments CustomFabOrder.version by 1"

  - method: POST
    path: "/dme/custom-fab-orders/{id}/fitting-check"
    description: "The fitter inspects the fabricated device. ACCEPT closes the order and scores the supplier; REQUEST_ADJUSTMENT sends it back for rework (max 2 rounds); CANCEL abandons an order stuck on supplier hold."
    roles: [DmeFitter]
    code: 201
    input: [outcome, "note?"]
    output: CustomFabOrder
    side_effects:
      - "ACCEPT: status -> ACCEPTED, stamps accepted_at, derives total_elapsed_days and writes final_turnaround_score via calculations.supplier_turnaround_score variant elapsed_basis"
      - "ACCEPT: Supplier.accepted_fab_order_count += 1 and Supplier.turnaround_score recomputed as the rounded mean of final_turnaround_score over that supplier's ACCEPTED orders; increments Supplier.version by 1"
      - "REQUEST_ADJUSTMENT: status READY_FOR_FITTING -> ADJUSTMENT_REQUESTED and adjustment_rounds += 1"
      - "CANCEL: status SUPPLIER_HOLD -> CANCELLED, the encounter reverts AWAITING_DEVICE -> DOCUMENTED and its compliance_hold is cleared"
      - "increments CustomFabOrder.version by 1"

  # ---- returns, restocking, refits --------------------------------------
  - method: POST
    path: "/dme/encounters/{id}/returns"
    description: "Opens a product return against a delivered encounter, moving the clinical dimension DELIVERED -> RETURN_PENDING. The return window depends on the reason."
    roles: [DmeFitter]
    code: 201
    input: [reason, "return_note?"]
    output: ProductReturn
    side_effects:
      - "creates the ProductReturn in REQUESTED with quantity_returned = encounter.quantity and days_since_delivery derived from delivered_at and the logical clock"
      - "clinical_status DELIVERED -> RETURN_PENDING; increments DispenseEncounter.version by 1"

  - method: GET
    path: "/dme/encounters/{id}/returns"
    description: "Lists the returns opened against an encounter (reverse reachability for ProductReturn.encounter_id and ProductReturn.refit_encounter_id)."
    roles: [PracticeAdmin, ComplianceOfficer, InventoryManager, DmeFitter]
    code: 200
    input: ["limit?", "offset?"]
    output: ProductReturn[]
    side_effects: []

  - method: POST
    path: "/dme/returns/{id}/inspection"
    description: "Inspects a returned device and settles the money. A sellable, non-custom, in-window return is restocked onto the shelf; anything else is destroyed. Either way the refund is computed and the encounter is refunded."
    roles: [InventoryManager]
    code: 201
    input: [condition]
    output: ProductReturn
    side_effects:
      - "stores condition, stamps inspected_at and runs calculations.restock_refund, writing restock_eligible, restock_fee_pct, the two component fields, the two refund lines, refund_cents and restock_fee_cents"
      - "status REQUESTED -> RESTOCKED when restock_eligible is true, otherwise REQUESTED -> DESTROYED"
      - "RESTOCKED only: ClinicParLevel.on_hand_qty += quantity_returned, increments ClinicParLevel.version by 1, re-runs calculations.par_stock_posture and calculations.clinic_dispensing_posture"
      - "a Clinic.dispensing_status improvement clears compliance_hold and hold_reason on this clinic's encounters whose hold_reason == CLINIC_SUSPENDED"
      - "encounter clinical_status RETURN_PENDING -> RETURNED, financial_status BILLED -> REFUNDED, billable_amount_cents set to 0; increments DispenseEncounter.version by 1"

  - method: POST
    path: "/dme/returns/{id}/refit"
    description: "Issues a refit encounter for a poor-fit or wrong-item return. The acting fitter may not be the fitter who performed the original fitting."
    roles: [DmeFitter]
    code: 201
    input: []
    output: DispenseEncounter
    side_effects:
      - "creates a new DispenseEncounter for the same clinic, patient, product, ordering physician and quantity, with refit_of_encounter_id set to the returned encounter"
      - "copies the medical-necessity note fields forward so the refit opens in clinical_status DOCUMENTED with financial_status UNVERIFIED"
      - "sets ProductReturn.refit_encounter_id and moves its status to REFIT_ISSUED; increments ProductReturn.version by 1"

# ---------------------------------------------------------------------------
# §1.6 Error Code Catalog — one entry per §1.4 rule, in priority order
# ---------------------------------------------------------------------------
errors:
  - id: ERR_MISSING_AUTH_HEADERS
    http: 401
    condition: "X-User-Id or X-User-Role is absent or empty on any request"
  - id: ERR_UNKNOWN_ROLE
    http: 401
    condition: "X-User-Role is not one of PracticeAdmin, ComplianceOfficer, InventoryManager, InsuranceCoordinator, OrthoPhysician, DmeFitter"
  - id: ERR_UNAUTHORIZED
    http: 403
    condition: "the acting role is not listed in the target endpoint's roles"
  - id: ERR_ACTOR_NOT_FOUND
    http: 403
    condition: "X-User-Id for the entity-backed role OrthoPhysician or DmeFitter is not the id of an existing Physician or Fitter (on POST /dme/encounters/{id}/fitting-records and POST /dme/returns/{id}/refit the unknown-fitter case is reported as ERR_FITTER_NOT_FOUND instead)"
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "a required input field is missing, a value has the wrong type, an enum value is not a declared member, or a quantity/money field is negative"
  - id: ERR_CLINIC_NOT_FOUND
    http: 404
    condition: "the Clinic named in the path or in clinic_id does not exist"
  - id: ERR_SUPPLIER_NOT_FOUND
    http: 404
    condition: "the Supplier named in the path or in supplier_id does not exist"
  - id: ERR_PRODUCT_NOT_FOUND
    http: 404
    condition: "the DeviceProduct named in product_id does not exist"
  - id: ERR_PATIENT_NOT_FOUND
    http: 404
    condition: "the Patient named in patient_id does not exist"
  - id: ERR_PHYSICIAN_NOT_FOUND
    http: 404
    condition: "the Physician named in ordering_physician_id does not exist"
  - id: ERR_FITTER_NOT_FOUND
    http: 404
    condition: "the Fitter named in the path on GET /dme/fitters/{id} does not exist, or the DmeFitter actor named by X-User-Id on POST /dme/encounters/{id}/fitting-records or POST /dme/returns/{id}/refit does not exist"
  - id: ERR_PAR_LEVEL_NOT_FOUND
    http: 404
    condition: "the ClinicParLevel named in the path does not exist, or the encounter's (clinic, product) pair has no par level at all when one is required"
  - id: ERR_ENCOUNTER_NOT_FOUND
    http: 404
    condition: "the DispenseEncounter named in the path does not exist"
  - id: ERR_PRIOR_AUTH_NOT_FOUND
    http: 404
    condition: "the PriorAuthRequest named in the path does not exist"
  - id: ERR_ABN_NOTICE_NOT_FOUND
    http: 404
    condition: "the AbnNotice named in the path does not exist"
  - id: ERR_FAB_ORDER_NOT_FOUND
    http: 404
    condition: "the CustomFabOrder named in the path does not exist"
  - id: ERR_RETURN_NOT_FOUND
    http: 404
    condition: "the ProductReturn named in the path does not exist"
  - id: ERR_FITTING_RECORD_NOT_FOUND
    http: 404
    condition: "the FittingRecord named in the path does not exist"
  - id: ERR_CLINIC_SCOPE_MISMATCH
    http: 403
    condition: "a referenced Patient, Physician or Fitter belongs to a different clinic than the operation's subject, the ordering physician's specialty does not match the product's specialty, or the product's specialty is not among the clinic's dispensing_specialties"
  - id: ERR_INVALID_CLINICAL_STATE
    http: 409
    condition: "the encounter's clinical_status is not a declared `from` state for the requested transition — includes replaying a one-shot trigger and acting on a terminal RETURNED or VOIDED encounter"
  - id: ERR_INVALID_FINANCIAL_STATE
    http: 409
    condition: "the encounter's financial_status is not a declared `from` state for the requested transition — includes acting on a terminal REFUNDED or WRITTEN_OFF encounter"
  - id: ERR_INVALID_PRIOR_AUTH_STATE
    http: 409
    condition: "a decision is requested on a PriorAuthRequest that is not SUBMITTED or PENDED, or an appeal on one that is not PENDED or DENIED (including a terminal EXPIRED request)"
  - id: ERR_INVALID_ABN_STATE
    http: 409
    condition: "a signature is recorded against an AbnNotice whose status is not ISSUED (already SIGNED, DECLINED, or VOIDED by a later issuance)"
  - id: ERR_INVALID_FAB_ORDER_STATE
    http: 409
    condition: "the submitted fabrication event or fitting-check outcome is not declared from the CustomFabOrder's current status (including a terminal ACCEPTED or CANCELLED order)"
  - id: ERR_INVALID_RETURN_STATE
    http: 409
    condition: "an inspection is requested on a ProductReturn that is not REQUESTED, or a refit on one that is not RESTOCKED or DESTROYED (including a terminal REFIT_ISSUED return)"
  - id: ERR_STALE_PAR_LEVEL_VERSION
    http: 412
    condition: "expected_par_level_version does not equal the ClinicParLevel's stored version (§1.2.1 reservation-stale-par-level)"
  - id: ERR_STALE_ENCOUNTER_VERSION
    http: 412
    condition: "expected_encounter_version does not equal the DispenseEncounter's stored version (§1.2.1 abn-issue-stale-encounter)"
  - id: ERR_CLINIC_ACCREDITATION_EXPIRED
    http: 422
    condition: "the Clinic's accreditation_expires_on is strictly before the logical clock date"
  - id: ERR_SUPPLIER_STANDARDS_NOT_ATTESTED
    http: 422
    condition: "the product's Supplier has dmepos_standards_attested false or an accreditation_expires_on strictly before the logical clock date"
  - id: ERR_SUPPLIER_QUALITY_HOLD
    http: 422
    condition: "the product's Supplier has quality_hold true"
  - id: ERR_COMPLIANCE_HOLD_ACTIVE
    http: 409
    condition: "the encounter carries compliance_hold true (hold_reason CLINIC_SUSPENDED or SUPPLIER_QUALITY_HOLD)"
  - id: ERR_IOAS_SUPERVISION_MISSING
    http: 422
    condition: "a dispense is attempted with ioas_attested_at still null, or the product requires DIRECT in-office ancillary supervision while the clinic level or the observed level is only GENERAL"
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 409
    condition: "the physician attesting IOAS supervision is the encounter's ordering physician"
  - id: ERR_STARK_DISCLOSURE_MISSING
    http: 422
    condition: "the ordering physician is not a group member or has no Stark self-referral disclosure on file, or the attesting physician is not a group member"
  - id: ERR_MEDICAL_NECESSITY_MISSING
    http: 422
    condition: "a dispense is attempted with any medical-necessity field or mn_signed_at still null, or with a note whose mn_signed_at is more than 90 whole days before the logical clock instant (stale note)"
  - id: ERR_FITTER_CREDENTIAL_EXPIRED
    http: 422
    condition: "the acting fitter has credential NONE or a credential_expires_on strictly before the logical clock date"
  - id: ERR_FITTER_PRIVILEGE_SCOPE
    http: 403
    condition: "an OFF_SHELF_ONLY fitter attempts to fit or accept a CUSTOM_FITTED_PREFAB or CUSTOM_FABRICATED device"
  - id: ERR_REFIT_SAME_FITTER
    http: 409
    condition: "the fitter issuing a refit is the fitter recorded on the returned encounter"
  - id: ERR_DELIVERY_SIGNATURE_MISSING
    http: 422
    condition: "delivery_signature_role is REFUSED, or a dispense is attempted without a delivery signature role"
  - id: ERR_COVERAGE_VERIFICATION_MISSING
    http: 422
    condition: "a dispense is attempted on an encounter with no CoverageVerification at all"
  - id: ERR_COVERAGE_VERIFICATION_EXPIRED
    http: 422
    condition: "the effective CoverageVerification's expires_at is strictly before the logical clock instant"
  - id: ERR_SAME_OR_SIMILAR_CONFLICT
    http: 409
    condition: "a covered verification is attempted while the patient already holds a delivered device in the same same_or_similar_group inside its reasonable useful lifetime"
  - id: ERR_PRIOR_AUTH_REQUIRED
    http: 422
    condition: "the product requires prior authorization but no APPROVED and unexpired PriorAuthRequest exists for the encounter"
  - id: ERR_PRIOR_AUTH_ALREADY_EXISTS
    http: 409
    condition: "a second PriorAuthRequest is submitted for the same encounter, or one is submitted for a product that does not require authorization"
  - id: ERR_APPEAL_LIMIT_REACHED
    http: 422
    condition: "an appeal is submitted when appeal_round already equals the limit of 2"
  - id: ERR_APPROVED_UNITS_EXCEED_REQUEST
    http: 422
    condition: "an APPROVED decision carries approved_units below 1 or above requested_units"
  - id: ERR_ABN_REQUIRED_FOR_EXCESS_UNITS
    http: 422
    condition: "a dispense would charge units beyond the covered unit count with no SIGNED greatest-seq advance beneficiary notice electing OPTION_1 or OPTION_2"
  - id: ERR_ABN_NOT_SIGNED
    http: 422
    condition: "a dispense is attempted while financial_status is ABN_ISSUED (the notice is outstanding or was declined)"
  - id: ERR_ABN_SUPERSEDED
    http: 409
    condition: "a signature is recorded against an AbnNotice that is not the greatest notice_seq for its encounter"
  - id: ERR_DUPLICATE_NPI
    http: 409
    condition: "a Physician is created with an npi that already exists anywhere in the practice"
  - id: ERR_DUPLICATE_PAR_LEVEL
    http: 409
    condition: "a second ClinicParLevel is created for an existing (clinic_id, product_id) pair"
  - id: ERR_FITTING_SLOT_CONFLICT
    http: 409
    condition: "the requested fitting interval conflicts with an existing FittingRecord of the same fitter under the closed 15-minute-buffer rule"
  - id: ERR_INVALID_INTERVAL
    http: 422
    condition: "fitting_end_at is not strictly after fitting_start_at, or either instant falls on a calendar date strictly after the logical clock date"
  - id: ERR_RETURN_WINDOW_EXPIRED
    http: 422
    condition: "days_since_delivery exceeds the return window for the submitted reason (30 days for POOR_FIT and PATIENT_REFUSED, 90 days for DEFECT and WRONG_ITEM)"
  - id: ERR_RETURN_ALREADY_EXISTS
    http: 409
    condition: "a second ProductReturn is opened against the same encounter"
  - id: ERR_REFIT_REASON_NOT_ELIGIBLE
    http: 422
    condition: "a refit is requested on a return whose reason is DEFECT or PATIENT_REFUSED"
  - id: ERR_ADJUSTMENT_LIMIT_REACHED
    http: 422
    condition: "an adjustment is requested when adjustment_rounds already equals the limit of 2"
  - id: ERR_CUSTOM_FAB_NOT_SUPPORTED
    http: 422
    condition: "a custom-fabrication order names a Supplier whose custom_fab_capable is false"
  - id: ERR_PRODUCT_CATEGORY_MISMATCH
    http: 422
    condition: "a reservation targets a CUSTOM_FABRICATED product, a fabrication order targets a prefabricated product, or a par level is created for a CUSTOM_FABRICATED product"
  - id: ERR_CLINIC_DISPENSING_SUSPENDED
    http: 409
    condition: "the Clinic's dispensing_status is SUSPENDED, or it is RESTRICTED and the targeted shelf is the stocked-out one"
  - id: ERR_INSUFFICIENT_PAR_STOCK
    http: 422
    condition: "the shelf's available_qty is below the encounter's quantity"
  - id: ERR_PAR_MAX_EXCEEDED
    http: 422
    condition: "a stock receipt would push on_hand_qty above par_max_qty, or a par level is created with par_min_qty above par_max_qty"

# ---------------------------------------------------------------------------
# §1.7 RBAC Matrix — segregation of duties
#   Ordering, compliance attestation, inventory custody, payer coordination
#   and patient fitting are five separate duties held by five different
#   roles; no role holds two of them. Two enforcement rules go further and
#   forbid the SAME USER from holding both ends of one duty pair:
#     - ERR_SEGREGATION_OF_DUTIES: the physician attesting IOAS supervision
#       may not be the encounter's ordering physician.
#     - ERR_REFIT_SAME_FITTER: the fitter issuing a refit may not be the
#       fitter who performed the fitting that failed.
# ---------------------------------------------------------------------------
roles:
  - name: PracticeAdmin
    description: "Practice operations administrator. Owns the master data of the group: clinic sites, physician and fitter rosters, patient registration, supplier onboarding and the device catalog. Has broad read access but performs no clinical, coverage or inventory-custody action."
    identity: "opaque"
    exclusive_operations:
      - "POST /dme/clinics"
      - "POST /dme/clinics/{id}/physicians"
      - "POST /dme/clinics/{id}/fitters"
      - "POST /dme/suppliers"
    shared_operations:
      - "POST /_clock/set_current_utc"
      - "POST /dme/clinics/{id}/patients (with InsuranceCoordinator)"
      - "POST /dme/products (with InventoryManager)"
      - "POST /dme/encounters (with OrthoPhysician)"
      - "every GET in §1.5 except GET /dme/fitting-records role-restricted reads it already holds"

  - name: ComplianceOfficer
    description: "Regulatory compliance officer. Owns supplier-standards and accreditation attestations and audits the dispensing trail. Deliberately holds NO ability to create encounters, verify coverage, move stock or fit patients, so the party that certifies suppliers never also dispenses from them."
    identity: "opaque"
    exclusive_operations:
      - "POST /dme/suppliers/{id}/standards-attestation"
    shared_operations:
      - "POST /_clock/set_current_utc"
      - "GET /dme/clinics/{id}"
      - "GET /dme/clinics/{id}/physicians"
      - "GET /dme/clinics/{id}/fitters"
      - "GET /dme/clinics/{id}/dispensing-summary"
      - "GET /dme/suppliers/{id}"
      - "GET /dme/encounters and GET /dme/encounters/{id}"
      - "GET /dme/encounters/{id}/coverage-verifications"
      - "GET /dme/encounters/{id}/prior-auth-requests"
      - "GET /dme/encounters/{id}/abn-notices"
      - "GET /dme/encounters/{id}/returns"
      - "GET /dme/fitting-records and GET /dme/fitting-records/{id}"

  - name: InventoryManager
    description: "Inventory and custody manager. Owns par levels, stock receipts, the supplier side of custom fabrication and the physical inspection of returned devices. Cannot order, verify coverage, issue notices or fit patients."
    identity: "opaque"
    exclusive_operations:
      - "POST /dme/par-levels"
      - "POST /dme/par-levels/{id}/stock-receipts"
      - "POST /dme/custom-fab-orders/{id}/fabrication-events"
      - "POST /dme/returns/{id}/inspection"
    shared_operations:
      - "POST /_clock/set_current_utc"
      - "POST /dme/products (with PracticeAdmin)"
      - "GET /dme/clinics/{id}"
      - "GET /dme/clinics/{id}/dispensing-summary"
      - "GET /dme/suppliers/{id} and GET /dme/suppliers/{id}/products"
      - "GET /dme/products/{id}"
      - "GET /dme/par-levels and GET /dme/par-levels/{id}"
      - "GET /dme/encounters/{id}"
      - "GET /dme/custom-fab-orders and GET /dme/custom-fab-orders/{id}"
      - "GET /dme/encounters/{id}/returns"

  - name: InsuranceCoordinator
    description: "Insurance and benefits coordinator. Owns coverage verification, prior authorization and appeals, and the advance beneficiary notice lifecycle including its cash quote. Cannot order devices, touch stock or fit patients, so the party that determines what the patient owes never also hands the device over."
    identity: "opaque"
    exclusive_operations:
      - "POST /dme/encounters/{id}/coverage-verifications"
      - "POST /dme/encounters/{id}/prior-auth-requests"
      - "POST /dme/prior-auth-requests/{id}/decision"
      - "POST /dme/prior-auth-requests/{id}/appeal"
      - "POST /dme/encounters/{id}/abn-notices"
      - "POST /dme/abn-notices/{id}/signature"
    shared_operations:
      - "POST /_clock/set_current_utc"
      - "POST /dme/clinics/{id}/patients (with PracticeAdmin)"
      - "GET /dme/clinics/{id} and GET /dme/clinics/{id}/patients"
      - "GET /dme/products/{id}"
      - "GET /dme/encounters and GET /dme/encounters/{id}"
      - "GET /dme/encounters/{id}/coverage-verifications"
      - "GET /dme/encounters/{id}/prior-auth-requests"
      - "GET /dme/encounters/{id}/abn-notices"

  - name: OrthoPhysician
    description: "Group orthopedic physician. Orders devices, signs the medical-necessity note for encounters they ordered, and attests in-office ancillary-services supervision for encounters ordered by a DIFFERENT group physician. X-User-Id is a Physician.id."
    identity: "entity_backed:Physician"
    exclusive_operations:
      - "POST /dme/encounters/{id}/medical-necessity-note"
      - "POST /dme/encounters/{id}/ioas-attestation"
    shared_operations:
      - "POST /_clock/set_current_utc"
      - "POST /dme/encounters (with PracticeAdmin)"
      - "GET /dme/clinics/{id} and GET /dme/clinics/{id}/physicians"
      - "GET /dme/encounters and GET /dme/encounters/{id}"

  - name: DmeFitter
    description: "Certified orthotic fitter. Reserves shelf stock, places custom-fabrication orders, records fitting sessions, accepts fabricated devices, dispenses against a delivery signature, opens returns and issues refits for fittings performed by a DIFFERENT fitter. X-User-Id is a Fitter.id."
    identity: "entity_backed:Fitter"
    exclusive_operations:
      - "POST /dme/encounters/{id}/reservations"
      - "POST /dme/encounters/{id}/custom-fab-orders"
      - "POST /dme/encounters/{id}/fitting-records"
      - "POST /dme/encounters/{id}/dispense"
      - "POST /dme/custom-fab-orders/{id}/fitting-check"
      - "POST /dme/encounters/{id}/returns"
      - "POST /dme/returns/{id}/refit"
    shared_operations:
      - "POST /_clock/set_current_utc"
      - "GET /dme/clinics/{id} and GET /dme/clinics/{id}/fitters"
      - "GET /dme/fitters/{id}"
      - "GET /dme/products/{id}"
      - "GET /dme/par-levels and GET /dme/par-levels/{id}"
      - "GET /dme/encounters and GET /dme/encounters/{id}"
      - "GET /dme/fitting-records and GET /dme/fitting-records/{id}"
      - "GET /dme/custom-fab-orders and GET /dme/custom-fab-orders/{id}"
      - "GET /dme/encounters/{id}/returns"
