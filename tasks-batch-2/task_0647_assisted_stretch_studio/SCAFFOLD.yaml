# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  # ---- Booking: schedule dimension (parallel axis #1) ------------------------
  - entity: Booking
    field: schedule_status
    initial_state: REQUESTED
    terminal_states: [COMPLETED, CANCELLED, LATE_CANCELLED, NO_SHOW]
    note: "Parallel with credit_status. schedule_status governs scheduling lifecycle; credit_status governs wallet."
    transitions:
      - from: REQUESTED
        to: CONFIRMED
        trigger: "POST /bookings/{id}/confirm"
        actor: "FrontDesk | StudioManager | Member"
        preconditions:
          - "Booking.schedule_status == REQUESTED"
          - "Member.status == ACTIVE (cross-entity: Member must not be SUSPENDED)"
          - "Location.status == OPEN"
        side_effects:
          - "schedule_status -> CONFIRMED"
      - from: CONFIRMED
        to: COMPLETED
        trigger: "POST /bookings/{id}/complete"
        actor: "Flexologist | StudioManager"
        preconditions:
          - "Booking.schedule_status == CONFIRMED"
          - "ClockState.current_utc >= session_start_utc"
          - "credit_status == HELD"
        side_effects:
          - "schedule_status -> COMPLETED"
          - "credit_status HELD -> CONSUMED (calc credit_wallet_balance: funding wallet held_credits -= credit_cost, consumed_credits += credit_cost)"
          - "If Service.kind == INTRO: Member.intro_completed -> true; Member.mobility_tier set from assessment_score posted on complete (calc intro_assessment_score)"
      - from: [REQUESTED, CONFIRMED]
        to: CANCELLED
        trigger: "POST /bookings/{id}/cancel (clock strictly earlier than session_start_utc minus cancel_window_hours)"
        actor: "Member | FrontDesk | StudioManager"
        preconditions:
          - "Booking.schedule_status IN {REQUESTED, CONFIRMED}"
          - "ClockState.current_utc <= session_start_utc - Location.cancel_window_hours (free-cancel window; boundary at exactly the window edge is FREE)"
        side_effects:
          - "schedule_status -> CANCELLED"
          - "credit_status HELD -> RELEASED (wallet held_credits -= credit_cost; cascade calc credit_wallet_balance)"
          - "All non-voided AddOn on booking -> voided=true (cascade)"
          - "fee_charged_cents stays 0"
      - from: [REQUESTED, CONFIRMED]
        to: LATE_CANCELLED
        trigger: "POST /bookings/{id}/cancel (clock strictly inside the cancel window)"
        actor: "Member | FrontDesk | StudioManager"
        preconditions:
          - "Booking.schedule_status IN {REQUESTED, CONFIRMED}"
          - "ClockState.current_utc > session_start_utc - Location.cancel_window_hours AND ClockState.current_utc < session_start_utc"
        side_effects:
          - "schedule_status -> LATE_CANCELLED"
          - "credit_status HELD -> FORFEITED (held credit NOT returned: held_credits -= credit_cost, consumed_credits += credit_cost; calc credit_wallet_balance)"
          - "fee_charged_cents = no_show_fee variant=LATE_CANCEL (calc no_show_fee)"
          - "Create NoShowEvent(event_kind=LATE_CANCEL, points=1); this NoShowEvent creation itself triggers Member.strike_score recompute, which itself may trigger Member ACTIVE -> SUSPENDED (depth-3 cascade)"
          - "All non-voided AddOn on booking -> voided=true (cascade)"
      - from: CONFIRMED
        to: NO_SHOW
        trigger: "POST /_ops/no_show_sweep (system; session_end_utc passed and still CONFIRMED)"
        actor: system
        preconditions:
          - "Booking.schedule_status == CONFIRMED"
          - "ClockState.current_utc >= session_end_utc"
        side_effects:
          - "schedule_status -> NO_SHOW"
          - "credit_status HELD -> FORFEITED (held_credits -= credit_cost, consumed_credits += credit_cost; calc credit_wallet_balance)"
          - "fee_charged_cents = no_show_fee variant=NO_SHOW (calc no_show_fee)"
          - "Create NoShowEvent(event_kind=NO_SHOW, points=2); this NoShowEvent creation itself triggers Member.strike_score recompute, which itself may trigger Member ACTIVE -> SUSPENDED (depth-3 cascade)"
          - "All non-voided AddOn on booking -> voided=true (cascade)"

  # ---- Booking: credit dimension (parallel axis #2) --------------------------
  - entity: Booking
    field: credit_status
    initial_state: HELD
    terminal_states: [CONSUMED, RELEASED, FORFEITED]
    note: "Parallel with schedule_status; both fields live on the same Booking row and evolve independently per their own triggers."
    transitions:
      - from: HELD
        to: CONSUMED
        trigger: "system (driven by schedule_status CONFIRMED->COMPLETED)"
        actor: system
        preconditions: ["credit_status == HELD", "schedule_status transitioning to COMPLETED"]
        side_effects: ["funding wallet held_credits -= credit_cost; consumed_credits += credit_cost"]
      - from: HELD
        to: RELEASED
        trigger: "system (driven by free CANCELLED, or freeze cascade, or series cancel)"
        actor: system
        preconditions: ["credit_status == HELD"]
        side_effects: ["funding wallet held_credits -= credit_cost (credits returned to available)"]
      - from: HELD
        to: FORFEITED
        trigger: "system (driven by LATE_CANCELLED or NO_SHOW)"
        actor: system
        preconditions: ["credit_status == HELD"]
        side_effects: ["funding wallet held_credits -= credit_cost; consumed_credits += credit_cost (credit lost, NOT returned)"]

  # ---- Membership: cyclic ACTIVE<->FROZEN (non-linear) -----------------------
  - entity: Membership
    field: status
    initial_state: ACTIVE
    terminal_states: [CANCELLED]
    note: "Cyclic: ACTIVE->FROZEN->ACTIVE may repeat any number of times before CANCELLED."
    transitions:
      - from: ACTIVE
        to: FROZEN
        trigger: "POST /memberships/{id}/freeze"
        actor: "Member | StudioManager"
        preconditions:
          - "Membership.status == ACTIVE"
          - "freeze_end_utc > clock current_utc"
          - "expected_membership_version matches Membership.version (OCC)"
        side_effects:
          - "status -> FROZEN"
          - "increments Membership.version by 1"
          - "freeze_credit_cents += membership_freeze_proration output for the frozen span (calc membership_freeze_proration)"
          - "Cascade: every CONFIRMED/REQUESTED Booking funded by this Membership with session_start_utc inside [freeze_start_utc, freeze_end_utc) -> schedule_status CANCELLED, credit_status HELD->RELEASED, AddOns voided (each released booking's credit_status flip itself recomputes the membership wallet — transitive)"
      - from: FROZEN
        to: ACTIVE
        trigger: "POST /memberships/{id}/unfreeze"
        actor: "Member | StudioManager"
        preconditions:
          - "Membership.status == FROZEN"
          - "expected_membership_version matches Membership.version (OCC)"
        side_effects:
          - "status -> ACTIVE"
          - "increments Membership.version by 1"
      - from: [ACTIVE, FROZEN]
        to: CANCELLED
        trigger: "POST /memberships/{id}/cancel"
        actor: "Member | StudioManager"
        preconditions:
          - "Membership.status IN {ACTIVE, FROZEN}"
          - "expected_membership_version matches Membership.version (OCC)"
        side_effects:
          - "status -> CANCELLED"
          - "increments Membership.version by 1"
          - "Cascade: all HELD Bookings funded by this Membership -> CANCELLED + credit RELEASED + AddOns voided"

  # ---- CreditPack: linear depletion/expiry -----------------------------------
  - entity: CreditPack
    field: status
    initial_state: ACTIVE
    terminal_states: [EXPIRED]
    note: "ACTIVE may bounce to DEPLETED and back to ACTIVE when credits are released; EXPIRED is terminal."
    transitions:
      - from: ACTIVE
        to: DEPLETED
        trigger: "system (available_credits reaches 0 after a hold/consume)"
        actor: system
        preconditions: ["available_credits == 0"]
        side_effects: ["status -> DEPLETED (informational; pack still usable once credits released)"]
      - from: DEPLETED
        to: ACTIVE
        trigger: "system (a booking funded by this pack is RELEASED, available_credits > 0)"
        actor: system
        preconditions: ["available_credits > 0"]
        side_effects: ["status -> ACTIVE"]
      - from: [ACTIVE, DEPLETED]
        to: EXPIRED
        trigger: "POST /_ops/no_show_sweep (system; clock >= expires_utc)"
        actor: system
        preconditions: ["ClockState.current_utc >= expires_utc"]
        side_effects:
          - "status -> EXPIRED"
          - "Remaining available_credits become permanently unusable (held bookings already placed keep their hold)"

  # ---- RecurringSeries: branching DRAFT->ACTIVE->ENDED ------------------------
  - entity: RecurringSeries
    field: status
    initial_state: DRAFT
    terminal_states: [ENDED]
    transitions:
      - from: DRAFT
        to: ACTIVE
        trigger: "POST /recurring-series/{id}/activate"
        actor: "Member | FrontDesk | StudioManager"
        preconditions:
          - "RecurringSeries.status == DRAFT"
          - "Funding wallet (Membership ACTIVE or CreditPack ACTIVE) referenced by funding_id exists and is not FROZEN/CANCELLED/EXPIRED (cross-entity)"
        side_effects:
          - "Materialize up to occurrence_count Bookings at first_start_utc + k*interval_days (calc series_materialization)"
          - "Each materialized Booking holds credit_cost from the funding wallet; occurrences that fail resource-overlap or insufficient-credit checks are SKIPPED, not failed"
          - "generated_count and skipped_count set; status -> ACTIVE"
      - from: ACTIVE
        to: ENDED
        trigger: "POST /recurring-series/{id}/cancel"
        actor: "Member | FrontDesk | StudioManager"
        preconditions: ["RecurringSeries.status == ACTIVE"]
        side_effects:
          - "status -> ENDED"
          - "Cascade: every future (session_start_utc > clock) HELD Booking with series_id == this series -> schedule_status CANCELLED, credit RELEASED, AddOns voided"

# =============================================================================
# §1.2.1 Concurrency Rules (true races only; OCC on parent.version)
# =============================================================================
concurrency_rules:
  - rule_id: freeze-stale-membership
    parent_entity: Membership
    write_endpoint: "POST /memberships/{id}/freeze"
    occ_field: "expected_membership_version"
    description: |
      Freezing a Membership whose version has advanced since the client last
      observed it is rejected. A prior writer may have already frozen, unfrozen,
      or cancelled the membership (each legitimately advances version and
      reshapes wallet state); the current writer's observed version is therefore
      stale and the freeze is refused on the stale-version check.
    error_id: ERR_STALE_MEMBERSHIP_VERSION
    http_status: 412

  - rule_id: cancel-stale-membership
    parent_entity: Membership
    write_endpoint: "POST /memberships/{id}/cancel"
    occ_field: "expected_membership_version"
    description: |
      Cancelling a Membership whose version has advanced since the client last
      observed it is rejected on the stale-version check. The new cancel would
      legitimately supersede the prior membership state, but acts on a stale
      view of the wallet and freeze history, so it is refused.
    error_id: ERR_STALE_MEMBERSHIP_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  # ---- (Rule 2 mode (a): >=3 inputs, tiered, nonlinear) ----------------------
  - name: credit_pack_price
    trigger: "POST /credit-packs (on CreditPack create)"
    algorithm: tiered_pricing
    formula: |
      subtotal_cents = base_unit_price_cents * pack_credits
      discount_pct =
        0.15 if pack_credits >= 20
        else 0.10 if pack_credits >= 10
        else 0.05 if pack_credits >= 5
        else 0.00
      # PINNED ORDER: apply discount, THEN round the discounted subtotal to whole
      # cents (round_half_up), THEN add the flat processing fee. (discount -> round -> fee)
      discounted_cents = round_half_up(subtotal_cents * (1 - discount_pct))
      price_cents = discounted_cents + PROCESSING_FEE_CENTS
    input_set: "Single CreditPack row; inputs base_unit_price_cents, pack_credits, plus constant fee."
    constants:
      PROCESSING_FEE_CENTS: 300
      TIER_5_PCT: 0.05
      TIER_10_PCT: 0.10
      TIER_20_PCT: 0.15
    precision: "whole cents, round_half_up; rounding applied once to the discounted subtotal BEFORE the fee is added"

  # ---- (Rule 1 dual-variant #A — Booking domain; Rule 6 boundary on fee) -----
  - name: no_show_fee
    trigger: "Booking schedule_status -> LATE_CANCELLED (cancel inside window) OR -> NO_SHOW (sweep)"
    algorithm: threshold
    formula: |
      # Two valid variants that produce DIFFERENT cents for the same booking.
      variant NO_SHOW:    fee_charged_cents = Location.no_show_fee_cents              # flat
      variant LATE_CANCEL: fee_charged_cents = round_half_up(Booking.list_price_cents * Location.late_cancel_pct)
      # Boundary that selects the variant (Rule 6, metric = cancel lead-time):
      #   cancel at clock == session_start_utc - cancel_window_hours  -> FREE CANCELLED (fee 0)
      #   cancel at clock  >  that edge AND < session_start_utc        -> LATE_CANCEL (prorated fee)
      #   never arrived, clock >= session_end_utc                      -> NO_SHOW (flat fee)
    input_set: "One Booking row plus its Location config; list_price_cents is the create-time snapshot."
    precision: "whole cents, round_half_up"
    variants:
      - { name: NO_SHOW, when: "no_show_sweep marks a CONFIRMED booking NO_SHOW after session_end_utc", difference: "flat Location.no_show_fee_cents, independent of list price" }
      - { name: LATE_CANCEL, when: "member/desk cancels strictly inside cancel_window_hours", difference: "round_half_up(list_price_cents * late_cancel_pct), scales with the booked service price" }

  # ---- (Rule 1 dual-variant #B — Membership domain; Rule 2 mode (b) ordering) -
  - name: membership_freeze_proration
    trigger: "Membership ACTIVE -> FROZEN (POST /memberships/{id}/freeze)"
    algorithm: forward_looking
    formula: |
      frozen_days = ceil_to_days(freeze_end_utc - freeze_start_utc)   # whole days, ceiling
      # Two valid variants producing DIFFERENT cents for identical inputs:
      variant CALENDAR_30 (forward_looking):
        credit_cents = round_half_up(monthly_fee_cents * frozen_days / 30)
      variant ACTUAL_CYCLE (chronological):
        cycle_days = days_in_cycle(cycle_anchor_utc)   # actual length of the current 1-month cycle
        credit_cents = round_half_up(monthly_fee_cents * frozen_days / cycle_days)
      # PINNED VARIANT: this scaffold uses CALENDAR_30 for the persisted
      # freeze_credit_cents. ACTUAL_CYCLE is the divergent alternative a naive
      # reader might pick; the difference is observable when cycle_days != 30.
    input_set: "One Membership row; monthly_fee_cents and the freeze span."
    constants:
      CALENDAR_DENOMINATOR_DAYS: 30
    precision: "whole cents, round_half_up; division performed in exact decimal before rounding once"
    variants:
      - { name: CALENDAR_30, when: "PERSISTED — always used for freeze_credit_cents", difference: "denominator fixed at 30 days regardless of actual cycle length" }
      - { name: ACTUAL_CYCLE, when: "divergent reading (NOT used)", difference: "denominator = actual days in the billing cycle; diverges from CALENDAR_30 whenever cycle_days != 30" }

  # ---- (Rule 2 mode (c): circular-looking eval order pinned) -----------------
  - name: credit_wallet_balance
    trigger: "Any Booking credit_status transition; Membership renewal; CreditPack create"
    algorithm: aggregation
    formula: |
      # held/consumed are themselves SUMS over the wallet's bookings, while
      # available is derived from them — pinned evaluation order avoids a
      # circular read:
      #   STEP 1  held_credits     = sum(Booking.credit_cost where funding_id==wallet.id AND credit_status == HELD)
      #   STEP 2  consumed_credits = sum(Booking.credit_cost where funding_id==wallet.id AND credit_status IN {CONSUMED, FORFEITED})
      #   STEP 3  granted_credits  = (Membership: included_credits + carried_rollover this cycle) | (CreditPack: pack_credits)
      #   STEP 4  available_credits = max(0, granted_credits - held_credits - consumed_credits)
      # A booking hold is admitted only if, evaluated in this order, available_credits >= Booking.credit_cost.
    input_set: "All Bookings whose funding_id == this wallet, filtered by credit_status as above."
    precision: "integer credits; available_credits floored at 0"

  # ---- (Rule 5 supporting: rolling-window threshold with decay) --------------
  - name: no_show_strike_score
    trigger: "NoShowEvent create; POST /_ops/no_show_sweep"
    algorithm: decay_function
    formula: |
      window_start = ClockState.current_utc - STRIKE_WINDOW_DAYS days
      strike_score = sum(NoShowEvent.points
                         for events where event.member_id == member.id
                         AND event.occurred_utc >= window_start)        # step decay: events older than the window drop to 0
      # Suspension threshold (Rule 6 boundary, metric = strike points):
      #   strike_score >= SUSPENSION_THRESHOLD  -> Member.status SUSPENDED
      #   strike_score <  SUSPENSION_THRESHOLD  -> Member.status ACTIVE (reinstated on next recompute)
    input_set: "NoShowEvents for the member within [now - STRIKE_WINDOW_DAYS, now]."
    constants:
      STRIKE_WINDOW_DAYS: 90
      SUSPENSION_THRESHOLD: 5
      POINTS_NO_SHOW: 2
      POINTS_LATE_CANCEL: 1
    precision: "integer points"

  # ---- (mobility assessment composite; Rule 2 mode (a) candidate alt) --------
  - name: intro_assessment_score
    trigger: "POST /bookings/{id}/complete when Service.kind == INTRO (assessment payload supplied)"
    algorithm: weighted_scoring
    formula: |
      # Four joint sub-scores 0..100; weights sum to 1.0.
      # PINNED ORDER: multiply each sub-score by its weight in exact decimal,
      # SUM the four products, THEN round_half_up ONCE to an integer composite.
      composite = round_half_up( shoulder*0.30 + hip*0.30 + spine*0.25 + ankle*0.15 )
      mobility_tier =
        ADVANCED     if composite >= 80
        else INTERMEDIATE if composite >= 60
        else FOUNDATION
    input_set: "Four sub-scores from the intro completion payload."
    constants:
      W_SHOULDER: 0.30
      W_HIP: 0.30
      W_SPINE: 0.25
      W_ANKLE: 0.15
      TIER_ADVANCED_MIN: 80
      TIER_INTERMEDIATE_MIN: 60
    precision: "integer composite, round_half_up applied once after summation"

  # ---- series materialization (waterfall over occurrences) -------------------
  - name: series_materialization
    trigger: "POST /recurring-series/{id}/activate"
    algorithm: waterfall_allocation
    formula: |
      generated = 0 ; skipped = 0
      for k in 0 .. occurrence_count-1:                          # chronological order, k ascending
        start = first_start_utc + k * interval_days
        if (table overlap on table_id) OR (flexologist overlap on flexologist_id)
           OR (funding wallet available_credits < service.credit_cost):
          skipped += 1                                            # skip this occurrence, continue
        else:
          create Booking(HELD); hold service.credit_cost from wallet; generated += 1
      generated_count = generated ; skipped_count = skipped
    input_set: "occurrence_count prospective slots; the wallet and resource calendars as they stand at activation, evaluated occurrence-by-occurrence in k-ascending order so earlier occurrences consume credits before later ones."
    precision: "integer counts; occurrences evaluated strictly in ascending k (chronological), never by id"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present and X-User-Role is a known role"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all

  - priority: 2
    category: auth
    check: "Acting role is permitted for this operation per §1.7; entity_backed role's X-User-ID matches the owning FK of the target resource where ownership is required"
    error_id: ERR_FORBIDDEN
    http_status: 403
    applies_to: all

  - priority: 3
    category: existence
    check: "Every referenced resource (path id and FK in body) exists; validated left-to-right"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: all

  - priority: 4
    category: business_referential
    check: "Cross-location integrity: service_id, flexologist_id, table_id, and funding wallet all belong to Booking.location_id; funding_id type matches funding_source"
    error_id: ERR_LOCATION_MISMATCH
    http_status: 422
    applies_to: "POST /bookings, POST /recurring-series, POST /recurring-series/{id}/activate"

  - priority: 5
    category: state
    check: "Target resource in a valid state for the requested transition (schedule_status / credit_status / membership / pack / series)"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all state-transition endpoints"

  - priority: 6
    category: business_constraint
    check: "OCC: expected_membership_version equals Membership.version on freeze/unfreeze/cancel"
    error_id: ERR_STALE_MEMBERSHIP_VERSION
    http_status: 412
    applies_to: "POST /memberships/{id}/freeze, /unfreeze, /cancel"

  - priority: 7
    category: business_safety
    check: "Member.status must be ACTIVE (not SUSPENDED) to confirm or create bookings/series"
    error_id: ERR_MEMBER_SUSPENDED
    http_status: 409
    applies_to: "POST /bookings, POST /bookings/{id}/confirm, POST /recurring-series/{id}/activate"

  - priority: 8
    category: business_safety
    check: "Intro gating: a member with intro_completed==false may only book a Service of kind INTRO; non-INTRO booking is rejected until intro completed"
    error_id: ERR_INTRO_REQUIRED
    http_status: 409
    applies_to: "POST /bookings"

  - priority: 9
    category: business_temporal
    check: "session_start_utc strictly in the future (> clock), inside Location open/close minutes, and Service/Flexologist/Table all ACTIVE and at the right Location"
    error_id: ERR_OUTSIDE_BUSINESS_HOURS
    http_status: 422
    applies_to: "POST /bookings, POST /recurring-series"

  - priority: 10
    category: business_temporal
    check: "Table overlap: half-open [start,end); no other non-terminal booking on the same table_id may overlap. Adjacency (end==next.start) is allowed."
    error_id: ERR_TABLE_UNAVAILABLE
    http_status: 409
    applies_to: "POST /bookings"

  - priority: 11
    category: business_temporal
    check: "Flexologist overlap: a new session conflicts if its start is strictly less than (prior non-terminal session end + Location.flexologist_buffer_minutes); i.e., the inter-session gap must be >= buffer. Different interval geometry than the table rule."
    error_id: ERR_FLEXOLOGIST_UNAVAILABLE
    http_status: 409
    applies_to: "POST /bookings"

  - priority: 12
    category: business_constraint
    check: "INTRO booking requires the assigned flexologist to have certified_intro==true"
    error_id: ERR_FLEXOLOGIST_NOT_CERTIFIED
    http_status: 422
    applies_to: "POST /bookings"

  - priority: 13
    category: business_fiscal
    check: "Funding wallet available_credits >= Service.credit_cost (calc credit_wallet_balance); CreditPack also not EXPIRED and session_start_utc < pack.expires_utc"
    error_id: ERR_INSUFFICIENT_CREDITS
    http_status: 409
    applies_to: "POST /bookings"

  - priority: 14
    category: business_constraint
    check: "Membership purchase requires Member.intro_completed==true; one ACTIVE/FROZEN membership per (member, location)"
    error_id: ERR_MEMBERSHIP_NOT_ALLOWED
    http_status: 409
    applies_to: "POST /memberships"

  - priority: 15
    category: business_constraint
    check: "Add-on can only attach to a booking whose schedule_status IN {REQUESTED, CONFIRMED}"
    error_id: ERR_ADDON_NOT_ALLOWED
    http_status: 409
    applies_to: "POST /bookings/{id}/add-ons"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # ---- Catalog: Location -----------------------------------------------------
  - method: POST
    path: "/locations"
    description: "Create a studio location."
    roles: [StudioManager]
    code: 201
    input: [name, "timezone?", "open_minute_of_day?", "close_minute_of_day?", "flexologist_buffer_minutes?", "no_show_fee_cents?", "late_cancel_pct?", "cancel_window_hours?"]
    output: Location
    side_effects: ["status=OPEN"]
  - method: GET
    path: "/locations"
    description: "List locations (paginated)."
    roles: [StudioManager, FrontDesk, Member, Flexologist]
    code: 200
    input: ["limit?", "offset?", "status?"]
    output: Location[]
    side_effects: []
  - method: GET
    path: "/locations/{id}"
    description: "Get a location."
    roles: [StudioManager, FrontDesk, Member, Flexologist]
    code: 200
    input: []
    output: Location
    side_effects: []
  - method: POST
    path: "/locations/{id}/close"
    description: "Close a location to new bookings."
    roles: [StudioManager]
    code: 200
    input: []
    output: Location
    side_effects: ["status -> CLOSED"]

  # ---- Catalog: Flexologist (FK location_id reverse-reachability) ------------
  - method: POST
    path: "/flexologists"
    description: "Create a flexologist."
    roles: [StudioManager]
    code: 201
    input: [location_id, full_name, "certified_intro?"]
    output: Flexologist
    side_effects: ["status=ACTIVE"]
  - method: GET
    path: "/flexologists"
    description: "List/filter flexologists (filtered-list reverse-reachability for Flexologist.location_id)."
    roles: [StudioManager, FrontDesk, Member]
    code: 200
    input: ["location_id?", "status?", "limit?", "offset?"]
    output: Flexologist[]
    side_effects: []
  - method: GET
    path: "/flexologists/{id}"
    description: "Get a flexologist."
    roles: [StudioManager, FrontDesk, Member, Flexologist]
    code: 200
    input: []
    output: Flexologist
    side_effects: []
  - method: POST
    path: "/flexologists/{id}/deactivate"
    description: "Mark a flexologist INACTIVE (cannot be assigned to new bookings)."
    roles: [StudioManager]
    code: 200
    input: []
    output: Flexologist
    side_effects: ["status ACTIVE -> INACTIVE"]

  # ---- Catalog: Table (FK location_id reverse-reachability) ------------------
  - method: POST
    path: "/tables"
    description: "Create a stretch table/room."
    roles: [StudioManager]
    code: 201
    input: [location_id, label]
    output: Table
    side_effects: ["status=ACTIVE"]
  - method: GET
    path: "/tables"
    description: "List/filter tables (filtered-list reverse-reachability for Table.location_id)."
    roles: [StudioManager, FrontDesk, Member]
    code: 200
    input: ["location_id?", "status?", "limit?", "offset?"]
    output: Table[]
    side_effects: []
  - method: GET
    path: "/tables/{id}"
    description: "Get a table."
    roles: [StudioManager, FrontDesk, Member, Flexologist]
    code: 200
    input: []
    output: Table
    side_effects: []
  - method: POST
    path: "/tables/{id}/take-out-of-service"
    description: "Mark a table OUT_OF_SERVICE (cannot accept new bookings)."
    roles: [StudioManager]
    code: 200
    input: []
    output: Table
    side_effects: ["status ACTIVE -> OUT_OF_SERVICE"]

  # ---- Catalog: Service (FK location_id reverse-reachability) ----------------
  - method: POST
    path: "/services"
    description: "Create a service in a location's catalog."
    roles: [StudioManager]
    code: 201
    input: [location_id, name, kind, duration_minutes, credit_cost, list_price_cents]
    output: Service
    side_effects: ["status=ACTIVE"]
  - method: GET
    path: "/services"
    description: "List/filter services (filtered-list reverse-reachability for Service.location_id)."
    roles: [StudioManager, FrontDesk, Member]
    code: 200
    input: ["location_id?", "kind?", "status?", "limit?", "offset?"]
    output: Service[]
    side_effects: []
  - method: GET
    path: "/services/{id}"
    description: "Get a service."
    roles: [StudioManager, FrontDesk, Member, Flexologist]
    code: 200
    input: []
    output: Service
    side_effects: []
