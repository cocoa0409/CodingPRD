  # =========================================================================
  # Rule 6 — boundary_precision_check: two boundaries on DIFFERENT metrics/endpoints
  # =========================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: comparable_adjustment_cap_at_exactly_25_percent
        grounds:
          - calculations.comparable_adjustment_cap
          - validations[priority=13]
          - errors[ERR_ADJUSTMENT_EXCEEDS_CAP]
        distinguishing_aspect: |
          Metric: integer cents; endpoint: POST /comparables. Cap is |adj| <=
          25% of sale_price_cents. Boundary: sale_price_cents=40000001, so
          cap=round_half_up(0.25*40000001)=round_half_up(10000000.25)=10000000.
          |adj| == 10000000 passes (<=); |adj| == 10000001 fails (>).
        test_recipe:
          setup:
            - "Order IN_PROGRESS with broker assigned"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
