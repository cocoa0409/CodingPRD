              as: SupplyPlanner
              as_user_id: "supply-1"
              captures: { b4_id: $.data.id }
            - call: "POST /sop/capacity-blocks"
              payload: { family_id: "${fam_id}", start_date: "2026-09-25", end_date: "2026-09-30", available_hours: 700 }
              as: SupplyPlanner
              as_user_id: "supply-1"
          assert:
            - "Block 2026-09-01..2026-09-10 returns 201; CapacityBlock.${b1_id}.available_hours == 100"
            - "Block starting 2026-09-10 returns 409 with error_id ERR_CAPACITY_BLOCK_OVERLAP — exact adjacency to a half-open end_date is rejected because 2026-09-10 < 2026-09-10 + 2 days"
            - "Block starting 2026-09-11 returns 409 with error_id ERR_CAPACITY_BLOCK_OVERLAP — a one-day gap is still inside CHANGEOVER_BUFFER_DAYS"
            - "Block starting 2026-09-12 returns 201 — exactly end_date + 2 days is the first legal start; CapacityBlock.${b4_id} exists"
            - "Block 2026-09-25..2026-09-30 for 700 hours returns 422 with error_id ERR_FAMILY_MONTHLY_HOURS_EXCEEDED — it clears the buffer rule but 100 + 100 + 700 = 900 exceeds max_monthly_hours 800, so priority 150 fires only once priority 140 has passed"
            - "GET /sop/capacity-blocks?family_id=${fam_id} returns total_count == 2, holding 200 hours in total for 2026-09"

  - rule_id: compensating_invariant
    instances:
      - name: allocation_void_preserves_constrained_units_conservation
        grounds:
          - calculations.inv_allocation_units_conserved
          - calculations.calc_rationing_waterfall
          - state_machines.SupplyPlan.RATIONED_to_STALE
          - state_machines.PlanningCycle.EXECUTIVE_REVIEW_to_DEMAND_REVIEW
          - entities.Allocation.fields.allocated_units
        distinguishing_aspect: |
          Conserved quantity: UNITS of constrained supply on one SupplyPlan. The identity
          sum(Allocation.allocated_units) + SupplyPlan.unallocated_units == constrained_units must
          hold in all three phases of the round trip — before rationing (0 + 900), after rationing
          (900 + 0) and after the cycle reopen voids every allocation (0 + 900) — so the
          compensation is exact rather than approximately reversed, and constrained_units itself is
          never rewritten by either direction.
        test_recipe:
          setup:
            - "One ProductFamily at 100 units/hour with a 9-hour CapacityBlock in the 2026-09 window (900 available units); one MATURE Item with on_hand_units 0, safety_stock_units 330, material_supply_cap_units 100000, unit_price_cents 1000."
            - "Two Customers: C1 priority_rank 1 (protected) and C2 priority_rank 3."
            - "One PlanningCycle over 2026-09..2026-09 with financial_commitment_cents 0, both lines CONSENSUS_LOCKED at 400 and 500 units, a SupplyPlan constrained to 900 units, RATIONED, and the cycle then advanced to EXECUTIVE_REVIEW."
          setup_api_calls:
            - call: "POST /sop/product-families"
              payload: { family_code: "FAM-SOUP", name: "Soups", accountable_planner_user_id: "planner-1", units_per_hour: 100, max_monthly_hours: 800 }
              as: SopAdmin
              captures: { fam_id: $.data.id }
            - call: "POST /sop/items"
              payload: { sku: "SKU-SOUP-1", family_id: "${fam_id}", unit_price_cents: 1000, unit_cost_cents: 400, on_hand_units: 0, material_supply_cap_units: 100000, avg_monthly_demand_units: 1000, service_level_target_pct: 95.0, demand_cv: 0.20, lead_time_days: 30, lifecycle_state: "MATURE" }
              as: SopAdmin
              captures: { item_id: $.data.id }
            - call: "POST /sop/customers"
              payload: { customer_code: "CUST-1", name: "Protected Club", channel: "CLUB", priority_rank: 1 }
              as: SopAdmin
              captures: { c1_id: $.data.id }
            - call: "POST /sop/customers"
              payload: { customer_code: "CUST-2", name: "Big Grocery", channel: "GROCERY", priority_rank: 3 }
              as: SopAdmin
              captures: { c2_id: $.data.id }
            - call: "POST /sop/capacity-blocks"
              payload: { family_id: "${fam_id}", start_date: "2026-09-01", end_date: "2026-09-30", available_hours: 9 }
              as: SupplyPlanner
              as_user_id: "supply-1"
            - call: "POST /sop/planning-cycles"
              payload: { cycle_code: "SOP-CONS-09", horizon_start_month: "2026-09", horizon_end_month: "2026-09", financial_commitment_cents: 0, supply_review_policy: "NET_INVENTORY_FIRST" }
              as: SopAdmin
              captures: { cycle_id: $.data.id }
            - call: "POST /sop/demand-forecasts"
              payload: { cycle_id: "${cycle_id}", item_id: "${item_id}", customer_id: "${c1_id}", month: "2026-09", level_units: 400, trend_units_per_month: 0, seasonal_index: 1.0, causal_uplift_pct: 0 }
              as: DemandPlanner
              as_user_id: "planner-1"
              captures: { fc1_id: $.data.id }
            - call: "POST /sop/demand-forecasts"
              payload: { cycle_id: "${cycle_id}", item_id: "${item_id}", customer_id: "${c2_id}", month: "2026-09", level_units: 500, trend_units_per_month: 0, seasonal_index: 1.0, causal_uplift_pct: 0 }
              as: DemandPlanner
              as_user_id: "planner-1"
              captures: { fc2_id: $.data.id }
            - call: "POST /sop/demand-forecasts/${fc1_id}/transitions"
              payload: { target_status: "UNDER_CONSENSUS" }
              as: DemandPlanner
              as_user_id: "planner-1"
            - call: "POST /sop/demand-forecasts/${fc1_id}/transitions"
              payload: { target_status: "CONSENSUS_LOCKED" }
              as: DemandReviewLead
              as_user_id: "lead-1"
            - call: "POST /sop/demand-forecasts/${fc2_id}/transitions"
              payload: { target_status: "UNDER_CONSENSUS" }
              as: DemandPlanner
              as_user_id: "planner-1"
            - call: "POST /sop/demand-forecasts/${fc2_id}/transitions"
              payload: { target_status: "CONSENSUS_LOCKED" }
              as: DemandReviewLead
              as_user_id: "lead-1"
            - call: "POST /sop/planning-cycles/${cycle_id}/transitions"
              payload: { target_status: "SUPPLY_REVIEW" }
              as: SopAdmin
            - call: "POST /sop/supply-plans"
              payload: { cycle_id: "${cycle_id}", item_id: "${item_id}" }
              as: SupplyPlanner
              as_user_id: "supply-1"
              captures: { plan_id: $.data.id }
            - call: "POST /sop/supply-plans/${plan_id}/ration"
              payload: {}
              as: SupplyPlanner
              as_user_id: "supply-1"
            - call: "POST /sop/planning-cycles/${cycle_id}/transitions"
              payload: { target_status: "SCENARIO_REVIEW" }
              as: SopAdmin
            - call: "POST /sop/planning-cycles/${cycle_id}/transitions"
              payload: { target_status: "EXECUTIVE_REVIEW" }
              as: SopAdmin
          trigger:
            - call: "POST /sop/planning-cycles/${cycle_id}/transitions"
              payload: { target_status: "DEMAND_REVIEW", reopen_reason: "club channel volume withdrawn" }
              as: ExecutiveSponsor
              as_user_id: "exec-1"
          assert:
            - "Before the trigger: SupplyPlan.${plan_id}.constrained_units == 900, status == \"RATIONED\", unallocated_units == 0; the two allocations hold 400 (PROTECTED) and 500 (PRO_RATA); 400 + 500 + 0 == 900"
            - "After the trigger: every Allocation of ${plan_id} has allocation_status \"VOIDED\" and allocated_units == 0"
            - "SupplyPlan.${plan_id}.unallocated_units == 900 and constrained_units == 900 — the units the voided allocations released came back to the plan's own pool, not to nowhere"
            - "0 + 900 == SupplyPlan.${plan_id}.constrained_units 900 — inv_allocation_units_conserved holds after the compensation with zero drift"
            - "SupplyPlan.${plan_id}.status == \"STALE\", requires_replan == true, and no Allocation row was deleted: GET /sop/allocations?supply_plan_id=${plan_id} still returns total_count == 2"
            - "PlanningCycle.${cycle_id}.reopen_count == 1 and plan_value_cents == 0 — the STALE plan no longer contributes value"

      - name: scenario_supersede_restores_residual_gap_identity
        grounds:
          - calculations.inv_gap_closure_cents_conserved
          - calculations.calc_scenario_gap_closure
          - calculations.calc_cycle_financials
          - state_machines.Scenario.SELECTED_to_SUPERSEDED
          - concurrency_rules[scenario-select-stale-cycle]
        distinguishing_aspect: |
          Conserved quantity: MONEY (integer cents of committed gap closure) on one PlanningCycle,
          not units on one SupplyPlan. The forward action is selecting scenario S1 for
          3_588_000 cents; the compensation is implicit — selecting S2 of the same scenario_type
          supersedes S1 inside the same request. The identity residual_gap_cents ==
          financial_commitment_cents - plan_value_cents - sum(SELECTED/EXECUTED closures) must
          land on exactly 7_620_000, proving S1's 3_588_000 was fully backed out rather than
          partially netted, while S1's own net_gap_closure_cents field is left intact at 3_588_000.
        test_recipe:
          setup:
            - "The 10_000_000-cent gap fixture: family at 100 units/hour, MATURE item priced 1000 cents with safety_stock_units 330, a 10-hour CapacityBlock in the 2026-09 window, one CONSENSUS_LOCKED forecast of 7000 units, and a SupplyPlan constrained to 1000 units with shortfall_units 6330 (plan_value_cents 1_000_000, gross_gap_cents 9_000_000)."
            - "Two EVALUATED CAPACITY_INVESTMENT scenarios on that cycle: S1 for 52 hours (net_gap_closure_cents 3_588_000) and S2 for 20 hours (net_gap_closure_cents 1_380_000), both authored by user supply-1."
            - "The cycle advanced to EXECUTIVE_REVIEW with S1 already SELECTED by user exec-1."
          setup_api_calls:
            - call: "POST /sop/product-families"
              payload: { family_code: "FAM-FROZ", name: "Frozen", accountable_planner_user_id: "planner-1", units_per_hour: 100, max_monthly_hours: 800 }
              as: SopAdmin
              captures: { fam_id: $.data.id }
            - call: "POST /sop/items"
              payload: { sku: "SKU-PIZZA-2", family_id: "${fam_id}", unit_price_cents: 1000, unit_cost_cents: 400, on_hand_units: 0, material_supply_cap_units: 100000, avg_monthly_demand_units: 1000, service_level_target_pct: 95.0, demand_cv: 0.20, lead_time_days: 30, lifecycle_state: "MATURE" }
              as: SopAdmin
              captures: { item_id: $.data.id }
            - call: "POST /sop/customers"
              payload: { customer_code: "CUST-A", name: "Alpha Grocery", channel: "GROCERY", priority_rank: 3 }
              as: SopAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /sop/capacity-blocks"
              payload: { family_id: "${fam_id}", start_date: "2026-09-01", end_date: "2026-09-30", available_hours: 10 }
              as: SupplyPlanner
              as_user_id: "supply-1"
            - call: "POST /sop/planning-cycles"
              payload: { cycle_code: "SOP-SUP-09", horizon_start_month: "2026-09", horizon_end_month: "2026-09", financial_commitment_cents: 10000000, supply_review_policy: "NET_INVENTORY_FIRST" }
              as: SopAdmin
              captures: { cycle_id: $.data.id }
            - call: "POST /sop/demand-forecasts"
              payload: { cycle_id: "${cycle_id}", item_id: "${item_id}", customer_id: "${cust_id}", month: "2026-09", level_units: 7000, trend_units_per_month: 0, seasonal_index: 1.0, causal_uplift_pct: 0 }
              as: DemandPlanner
              as_user_id: "planner-1"
              captures: { fc_id: $.data.id }
            - call: "POST /sop/demand-forecasts/${fc_id}/transitions"
              payload: { target_status: "UNDER_CONSENSUS" }
              as: DemandPlanner
              as_user_id: "planner-1"
            - call: "POST /sop/demand-forecasts/${fc_id}/transitions"
              payload: { target_status: "CONSENSUS_LOCKED" }
              as: DemandReviewLead
              as_user_id: "lead-1"
            - call: "POST /sop/planning-cycles/${cycle_id}/transitions"
              payload: { target_status: "SUPPLY_REVIEW" }
              as: SopAdmin
            - call: "POST /sop/supply-plans"
              payload: { cycle_id: "${cycle_id}", item_id: "${item_id}" }
              as: SupplyPlanner
              as_user_id: "supply-1"
              captures: { plan_id: $.data.id }
            - call: "POST /sop/planning-cycles/${cycle_id}/transitions"
              payload: { target_status: "SCENARIO_REVIEW" }
              as: SopAdmin
            - call: "POST /sop/scenarios"
              payload: { cycle_id: "${cycle_id}", scenario_type: "CAPACITY_INVESTMENT", name: "S1 second shift", target_item_id: "${item_id}", added_capacity_hours: 52 }
              as: SupplyPlanner
              as_user_id: "supply-1"
              captures: { s1_id: $.data.id }
            - call: "POST /sop/scenarios/${s1_id}/evaluate"
              payload: {}
              as: SupplyPlanner
              as_user_id: "supply-1"
            - call: "POST /sop/scenarios"
              payload: { cycle_id: "${cycle_id}", scenario_type: "CAPACITY_INVESTMENT", name: "S2 weekend overtime", target_item_id: "${item_id}", added_capacity_hours: 20 }
              as: SupplyPlanner
              as_user_id: "supply-1"
              captures: { s2_id: $.data.id }
            - call: "POST /sop/scenarios/${s2_id}/evaluate"
              payload: {}
              as: SupplyPlanner
              as_user_id: "supply-1"
            - call: "POST /sop/planning-cycles/${cycle_id}/transitions"
              payload: { target_status: "EXECUTIVE_REVIEW" }
              as: SopAdmin
              captures: { cyc_v_exec: $.data.version }
            - call: "POST /sop/scenarios/${s1_id}/select"
              payload: { expected_cycle_version: "${cyc_v_exec}" }
              as: ExecutiveSponsor
              as_user_id: "exec-1"
          trigger:
            - call: "GET /sop/planning-cycles/${cycle_id}"
              payload: {}
              as: ExecutiveSponsor
              as_user_id: "exec-1"
              captures: { cyc_v_after_s1: $.data.version }
            - call: "POST /sop/scenarios/${s2_id}/select"
              payload: { expected_cycle_version: "${cyc_v_after_s1}" }
              as: ExecutiveSponsor
              as_user_id: "exec-1"
          assert:
            - "Before the trigger: Scenario.${s1_id}.net_gap_closure_cents == 3588000 and status == \"SELECTED\"; PlanningCycle.${cycle_id}.selected_closure_cents == 3588000 and residual_gap_cents == 5412000"
            - "Scenario.${s2_id}.incremental_units == 2000, gross_uplift_cents == 2000000, investment_cost_cents == 500000, pre_trade_closure_cents == 1500000, trade_rate_pct == 6.0, trade_spend_cents == 120000, net_gap_closure_cents == 1380000"
            - "After the trigger: Scenario.${s1_id}.status == \"SUPERSEDED\" while Scenario.${s1_id}.net_gap_closure_cents is still 3588000 — the money field is preserved, only its contribution is withdrawn"
            - "Scenario.${s2_id}.status == \"SELECTED\" and selected_by_user_id == \"exec-1\""
            - "PlanningCycle.${cycle_id}.selected_closure_cents == 1380000 — exactly S2, with no residue of S1's 3588000"
            - "PlanningCycle.${cycle_id}.residual_gap_cents == 7620000 == financial_commitment_cents 10000000 - plan_value_cents 1000000 - 1380000, so inv_gap_closure_cents_conserved holds with zero drift"
            - "PlanningCycle.${cycle_id}.version == ${cyc_v_after_s1} + 1 and posture == \"AT_RISK\" (residual_gap_cents > 0)"
