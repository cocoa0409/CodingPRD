      - name: corner_summary_retry_cycle_reaches_undeliverable_on_third_failure
        claim_type: valid_transition
        grounds:
          - state_machines.VisitSummary.QUEUED_to_FAILED
          - state_machines.VisitSummary.FAILED_to_QUEUED
          - state_machines.VisitSummary.QUEUED_to_UNDELIVERABLE
          - calculations.summary_destination_selection
          - endpoints[GET /visit-summaries]
        distinguishing_aspect: "Walks the cyclic retry loop to its cap: MAX_TRANSMIT_ATTEMPTS == 3 means failures 1 and 2 land in FAILED (retry requeues each time without resetting attempt_count) and failure 3 lands in the terminal UNDELIVERABLE, after which retry is refused with ERR_SUMMARY_INVALID_STATE."
