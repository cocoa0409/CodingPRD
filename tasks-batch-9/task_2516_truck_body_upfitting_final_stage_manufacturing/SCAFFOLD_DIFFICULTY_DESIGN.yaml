  - rule_id: priority_pair_validation_conflict
    instances:
      - name: release_rear_gawr_outranks_in_service_date_infeasible
        grounds:
          - validations.priority_51_ERR_REAR_GAWR_EXCEEDED
          - validations.priority_60_ERR_IN_SERVICE_DATE_INFEASIBLE
          - calculations.axle_load_distribution
          - calculations.earliest_feasible_in_service_date
        distinguishing_aspect: |
          One release request violates a business_safety rule at priority 51 and a business_temporal
          rule at priority 60 at the same time: the 16 ft heavy dump body puts 9785 lb on a 9450 lb
          rear axle AND the customer asked for 2026-09-01 when the earliest feasible date is
          2026-09-02. The response must be ERR_REAR_GAWR_EXCEEDED (422), never
          ERR_IN_SERVICE_DATE_INFEASIBLE — an unsafe truck is not merely a late truck.
        test_recipe:
          setup:
            - "ChassisModel F450-SRW-60CA (wheelbase 176 in, front GAWR 5000, rear GAWR 9450, GVWR 14000, PTO FULL at 14 gpm, DISCRETE bus)."
