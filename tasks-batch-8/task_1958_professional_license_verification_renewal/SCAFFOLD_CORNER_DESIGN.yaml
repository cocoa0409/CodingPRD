              as: ComplianceOfficer
              captures: { lic: $.data.id }
            - call: "POST /licensing/licenses/${lic}/verify"
              payload: { verified_on: "2026-08-01", source: "STATE_BOARD_API", outcome: "VERIFIED" }
              as: ComplianceOfficer
              captures: { lic_v: $.data.version }
          trigger:
            - call: "POST /licensing/licenses/${lic}/renewal-requests"
              payload: { claimed_amount_cents: 50000, expected_license_version: "${lic_v}" }
              as: ComplianceOfficer
              captures: { rr1: $.data.id }
            - call: "POST /licensing/licenses/${lic}/renewal-requests"
              payload: { claimed_amount_cents: 60000, expected_license_version: "${lic_v}" }
              as: ComplianceOfficer
              captures: { err: $.data.error_id }
          assert:
            - "rr1 created with status DRAFT  (first writer advances License.version from ${lic_v} to ${lic_v} + 1)"
            - "err == \"ERR_STALE_VERSION\" and HTTP status == 412  (second writer's expected version is now stale)"

      - name: logical_clock_default_is_fixed
        claim_type: scheduled_actions
        grounds:
          - entities.License.fields.expires_on
        distinguishing_aspect: "Before any set_current_utc call the logical clock reads exactly 2026-08-01: a disciplinary event dated 2026-08-02 is future-dated and rejected, while 2026-08-01 is accepted."
        test_recipe:
          setup:
            - "RN type; employee; license (never touches the clock endpoint)"
          setup_api_calls:
            - call: "POST /licensing/license-types"
              payload: { code: "RN", name: "Registered Nurse", ce_hours_required_per_cycle: 30.0, cycle_length_months: 24, verification_frequency_days: 180, grace_period_days: 45, requires_exclusion_screening: true, reimbursement_mode: "RECEIPT_BASED", reimburse_full_up_to_cents: 200000, reimburse_half_up_to_cents: 500000, flat_schedule_amount_cents: 0, hard_claim_cap_cents: 500000 }
              as: ComplianceAdmin
              captures: { lt_rn: $.data.id }
            - call: "POST /licensing/employees"
              payload: { full_name: "Nora Nurse", work_email: "nora.clock@example.com", role_code: "STAFF_NURSE" }
              as: HRPartner
              captures: { emp: $.data.id }
            - call: "POST /licensing/licenses"
              payload: { employee_id: "${emp}", license_type_id: "${lt_rn}", state_code: "CA", license_number: "RN-9602", issued_on: "2026-01-01", expires_on: "2027-06-30" }
              as: ComplianceOfficer
              captures: { lic: $.data.id }
          trigger:
            - call: "POST /licensing/licenses/${lic}/disciplinary-events"
              payload: { board_case_number: "B-81", event_type: "WARNING", effective_on: "2026-08-02", received_via: "BOARD_FEED" }
              as: ComplianceOfficer
              captures: { err: $.data.error_id }
            - call: "POST /licensing/licenses/${lic}/disciplinary-events"
              payload: { board_case_number: "B-82", event_type: "WARNING", effective_on: "2026-08-01", received_via: "BOARD_FEED" }
              as: ComplianceOfficer
              captures: { de_status: $.data.status }
          assert:
            - "err == \"ERR_INVALID_REQUEST\"  (effective_on 2026-08-02 is after the default logical date 2026-08-01)"
            - "de_status == \"RECEIVED\"  (effective_on equal to the default date is accepted)"

      - name: licenses_filter_by_status
        claim_type: pagination_with_filtering
        grounds:
          - calculations.license_expiry_sweep
        distinguishing_aspect: "The license list composes filters: status=ACTIVE returns only the verified license, status=PENDING_VERIFICATION only the unverified one."
        test_recipe:
          setup:
            - "RN and PE types; employee with two licenses, only the RN one verified"
          setup_api_calls:
            - call: "POST /licensing/license-types"
              payload: { code: "RN", name: "Registered Nurse", ce_hours_required_per_cycle: 30.0, cycle_length_months: 24, verification_frequency_days: 180, grace_period_days: 45, requires_exclusion_screening: true, reimbursement_mode: "RECEIPT_BASED", reimburse_full_up_to_cents: 200000, reimburse_half_up_to_cents: 500000, flat_schedule_amount_cents: 0, hard_claim_cap_cents: 500000 }
              as: ComplianceAdmin
              captures: { lt_rn: $.data.id }
            - call: "POST /licensing/license-types"
              payload: { code: "PE", name: "Professional Engineer", ce_hours_required_per_cycle: 0, cycle_length_months: 24, verification_frequency_days: 365, grace_period_days: 30, requires_exclusion_screening: false, reimbursement_mode: "FLAT_SCHEDULE", reimburse_full_up_to_cents: 0, reimburse_half_up_to_cents: 0, flat_schedule_amount_cents: 100000, hard_claim_cap_cents: 500000 }
              as: ComplianceAdmin
              captures: { lt_pe: $.data.id }
            - call: "POST /licensing/employees"
              payload: { full_name: "Nora Nurse", work_email: "nora.filt@example.com", role_code: "STAFF_NURSE" }
              as: HRPartner
              captures: { emp: $.data.id }
            - call: "POST /licensing/licenses"
              payload: { employee_id: "${emp}", license_type_id: "${lt_rn}", state_code: "CA", license_number: "RN-9603", issued_on: "2026-01-01", expires_on: "2027-06-30" }
              as: ComplianceOfficer
              captures: { lic_rn: $.data.id }
            - call: "POST /licensing/licenses"
              payload: { employee_id: "${emp}", license_type_id: "${lt_pe}", state_code: "CA", license_number: "PE-9604", issued_on: "2026-01-01", expires_on: "2027-06-30" }
              as: ComplianceOfficer
            - call: "POST /licensing/licenses/${lic_rn}/verify"
              payload: { verified_on: "2026-08-01", source: "STATE_BOARD_API", outcome: "VERIFIED" }
              as: ComplianceOfficer
          trigger:
            - call: "GET /licensing/licenses"
              payload: { employee_id: "${emp}", status: "ACTIVE" }
              as: ComplianceOfficer
            - call: "GET /licensing/licenses"
              payload: { employee_id: "${emp}", status: "PENDING_VERIFICATION" }
              as: ComplianceOfficer
          assert:
            - "status=ACTIVE filter returns exactly the verified RN license (total_count == 1)"
            - "status=PENDING_VERIFICATION filter returns exactly the PE license (total_count == 1)"

  # ---------------------------------------------------------------------------
  - section: consistency_model
    instances:
      - name: verify_response_immediately_reflects_new_state
        claim_type: immediate_consistency
        grounds:
          - calculations.verification_posture
        distinguishing_aspect: "Immediate consistency: the verify response itself carries status ACTIVE and the computed due date; a follow-up GET returns identical values with no reconciliation lag."
        test_recipe:
          setup:
            - "RN type; employee; PENDING license (expires 2027-06-30)"
          setup_api_calls:
            - call: "POST /licensing/license-types"
              payload: { code: "RN", name: "Registered Nurse", ce_hours_required_per_cycle: 30.0, cycle_length_months: 24, verification_frequency_days: 180, grace_period_days: 45, requires_exclusion_screening: true, reimbursement_mode: "RECEIPT_BASED", reimburse_full_up_to_cents: 200000, reimburse_half_up_to_cents: 500000, flat_schedule_amount_cents: 0, hard_claim_cap_cents: 500000 }
              as: ComplianceAdmin
              captures: { lt_rn: $.data.id }
            - call: "POST /licensing/employees"
              payload: { full_name: "Nora Nurse", work_email: "nora.imm@example.com", role_code: "STAFF_NURSE" }
              as: HRPartner
              captures: { emp: $.data.id }
            - call: "POST /licensing/licenses"
              payload: { employee_id: "${emp}", license_type_id: "${lt_rn}", state_code: "CA", license_number: "RN-9605", issued_on: "2026-01-01", expires_on: "2027-06-30" }
              as: ComplianceOfficer
              captures: { lic: $.data.id }
          trigger:
            - call: "POST /licensing/licenses/${lic}/verify"
              payload: { verified_on: "2026-08-01", source: "STATE_BOARD_API", outcome: "VERIFIED" }
              as: ComplianceOfficer
              captures: { st_resp: $.data.status, due_resp: $.data.next_verification_due_on }
            - call: "GET /licensing/licenses/${lic}"
              as: ComplianceOfficer
              captures: { st_get: $.data.status, due_get: $.data.next_verification_due_on }
          assert:
            - "st_resp == \"ACTIVE\" and due_resp == \"2027-01-28\""
            - "st_get == st_resp and due_get == due_resp"
