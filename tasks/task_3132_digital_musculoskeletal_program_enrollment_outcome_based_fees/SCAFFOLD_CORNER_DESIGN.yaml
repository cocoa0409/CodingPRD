  # ===========================================================================
  # section: consistency_model
  # ===========================================================================
  - section: consistency_model
    instances:

      - name: suspension_side_effects_are_visible_on_the_same_response
        claim_type: immediate
        grounds:
          - complexity_profile.consistency_model
          - state_machines.ClientAccount.ACTIVE_to_SUSPENDED
          - endpoints.POST_/msk/clients/{id}/suspend
        distinguishing_aspect: "Every suspension side effect — the account state, the voided invoices and the ended pending handoffs — is visible on the very first read after the request returns, with no re-read or delay."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. One employer client with one member whose enrollment sits in AWAITING_TRANSITION_REVIEW, one PENDING care transition, and one DRAFT invoice."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: ClinicalOps
            - call: "POST /msk/clients"
              payload: { legal_name: "Halewood Utilities", client_type: "HEALTH_PLAN" }
              as: ClinicalOps
              captures: { hw_id: $.data.id, hw_v: $.data.version }
            - call: "POST /msk/program-tracks"
