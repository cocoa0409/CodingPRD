  - section: endpoints
    instances:
      - name: corner_endpoint_portfolio_summary_computed_read
        claim_type: Computed read
        grounds: ["endpoints[\"GET /clients/{id}/portfolio-summary\"]"]
        excluded_because:
          difficulty_instance: combinatorial_formula / service_fee_volume_discount_uses_pre_insert_open_count
          rationale: "The rollup arithmetic the summary reports is asserted there and again in corner_portfolio_summary_equals_the_sum_of_its_state_parts."
      - name: corner_endpoint_calendar_rebuild_action
        claim_type: Conditional action
        grounds: ["endpoints[\"POST /registrations/{id}/calendar-rebuild\"]"]
        excluded_because:
          difficulty_instance: resource_temporal_overlap / state_rule_effective_interval_must_progress_strictly_forward
