# =============================================================================
# Task 1863 — Real Estate Syndication & Investor Relations
# Seed tables (§1.0–§1.7). Difficulty design and corner design live in their
# sibling files per SKILL.md §1.8 / §1.9.
# =============================================================================

scenario: |
  1863. Real Estate Syndication & Investor Relations (real estate syndicator):
  offering structure & subscription document collection, investor accreditation
  verification & suitability, capital call/funding timeline & escrow,
  distribution calculation per waterfall & preferred return accrual, quarterly
  reporting & property performance updates, K-1 preparation coordination,
  capital event (refinance/sale) distribution, investor portal access &
  transfer requests.

domain_name: real-estate-syndication
api_prefix: ""

# =============================================================================
# §0 Complexity Profile
# =============================================================================
complexity_profile:
  primary_archetype: "Compliance / audit"
  secondary_archetype: "Ledger reconciliation"
  complexity_layers:
    - optimistic_concurrency
    - dual_variant_calculation
    - cascading_side_effects
    - rate_threshold_triggers
    - derived_field_reconciliation

  entity_topology: hierarchical
  # Syndication → Offering → Subscription → CapitalCall/Distribution; Investor
  # and Property are peer entities referenced via FK from Offering/Subscription.

  state_machine_shape: branching
  # Subscription has a review/branching shape: DRAFT→SUBMITTED→
  # ACCREDITATION_VERIFIED→SUITABILITY_APPROVED→FUNDED with explicit reverts
  # (suitability_rejected → accreditation re-verification loop) plus parallel
  # escrow tracking. Distribution and CapitalEvent have their own branches.

  relationship_patterns:
    - one_to_many        # Syndication has many Offerings; Offering has many Subscriptions
    - cross_aggregate    # Subscription references Investor (peer of Syndication subtree)
    - many_to_many       # TransferRequest links two Subscriptions via join entity

  role_model: segregation_of_duties
  # SponsorOperator drafts/operates; ComplianceOfficer verifies accreditation;
  # TransferAgent approves transfers; Investor self-serves via portal. Same
  # user must not hold both SponsorOperator and ComplianceOfficer roles when
  # acting on the same subscription (segregation enforced).

  consistency_model: immediate
  # All cascades within a single request are atomic.

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Syndication
    parent: null
    common_fields: true
    fields:
      - { name: syndication_name, type: string, source: input, description: "Display name of the syndication firm" }
      - { name: sponsor_legal_entity, type: string, source: input, description: "Legal entity name of the sponsor / general partner" }
      - { name: preferred_return_pct_annual, type: number, source: input, description: "Annual preferred-return rate offered across offerings (e.g. 0.08); used as default for new offerings" }
      - { name: carried_interest_pct, type: number, source: input, description: "GP promote share applied in waterfall tiers 3+ (e.g. 0.20)" }
      - { name: status, type: enum, source: system, description: "DRAFT | ACTIVE | SUSPENDED | CLOSED" }

  - name: Investor
    parent: null
    common_fields: true
    fields:
      - { name: full_legal_name, type: string, source: input, description: "Investor's full legal name as it appears on tax records" }
      - { name: tax_id_last4, type: string, source: input, description: "Last 4 of SSN/EIN; used to bind K-1 packages" }
      - { name: email, type: string, source: input, description: "Portal login email; unique per investor" }
      - { name: investor_class, type: enum, source: input, description: "ACCREDITED | QUALIFIED_PURCHASER | NON_ACCREDITED" }
      - { name: portal_access_status, type: enum, source: system, description: "INVITED | ACTIVE | SUSPENDED | REVOKED" }
      - { name: accreditation_expires_on, type: datetime, source: system, description: "System-stamped date 90 days after latest accreditation verification; null until first verification" }

  - name: Property
    parent: null
    common_fields: true
    fields:
      - { name: property_legal_name, type: string, source: input, description: "Legal name of the holding entity" }
      - { name: street_address, type: string, source: input, description: "Street address" }
      - { name: acquisition_price_cents, type: integer, source: input, description: "Purchase price in cents" }
      - { name: status, type: enum, source: system, description: "OWNED | UNDER_CONTRACT_TO_SELL | SOLD" }

  - name: Offering
    parent: Syndication
    common_fields: true
    fields:
      - { name: syndication_id, type: string, source: system, description: "FK -> Syndication.id; owning syndication" }
      - { name: property_id, type: string, source: input, description: "FK -> Property.id; the underlying property this offering funds" }
      - { name: offering_name, type: string, source: input, description: "Human-readable offering title" }
      - { name: target_raise_cents, type: integer, source: input, description: "Total equity target in cents" }
      - { name: min_subscription_cents, type: integer, source: input, description: "Per-investor minimum subscription" }
      - { name: max_non_accredited_count, type: integer, source: input, description: "Rule 506(b) cap on non-accredited investors (typically 35)" }
      - { name: preferred_return_pct_annual, type: number, source: input, description: "Offering-specific override of syndication default; if omitted defaults to syndication's value at activation time" }
      - { name: carried_interest_pct, type: number, source: input, description: "Offering-specific GP promote override; defaults to syndication's value at activation time" }
      - { name: total_committed_cents, type: integer, source: computed, description: "Sum of committed_cents across subscriptions in SUITABILITY_APPROVED or FUNDED status" }
      - { name: total_funded_cents, type: integer, source: computed, description: "Sum of funded_cents across subscriptions in FUNDED status" }
      - { name: total_distributed_cents, type: integer, source: computed, description: "Cumulative cents paid out across all CapitalEvent distributions and Distributions" }
      - { name: unreturned_capital_cents, type: integer, source: computed, description: "total_funded_cents - cumulative return-of-capital paid to LPs" }
      - { name: status, type: enum, source: system, description: "DRAFT | OPEN | CLOSED_TO_NEW_SUBSCRIPTIONS | FINAL_CLOSE | DISSOLVED" }

  - name: Subscription
    parent: Offering
    common_fields: true
    fields:
      - { name: offering_id, type: string, source: system, description: "FK -> Offering.id; owning offering" }
      - { name: investor_id, type: string, source: input, description: "FK -> Investor.id; subscribing investor" }
      - { name: committed_cents, type: integer, source: input, description: "Total LP commitment at subscription" }
      - { name: funded_cents, type: integer, source: computed, description: "Cumulative escrow-released cents against this subscription" }
      - { name: unreturned_capital_cents, type: integer, source: computed, description: "funded_cents - return-of-capital received by this investor across all capital events" }
      - { name: accrued_pref_cents, type: integer, source: computed, description: "Running preferred-return accrual at offering's preferred_return_pct_annual" }
      - { name: ownership_pct, type: number, source: computed, description: "funded_cents / offering.total_funded_cents at snapshot time" }
      - { name: suitability_verified_by, type: string, source: system, description: "X-User-ID of the ComplianceOfficer who last approved suitability; null until approved" }
      - { name: accreditation_verified_by, type: string, source: system, description: "X-User-ID of the ComplianceOfficer who last verified accreditation; null until verified" }
      - { name: accreditation_verified_at, type: datetime, source: system, description: "Timestamp of latest successful accreditation verification" }
      - { name: funded_at, type: datetime, source: system, description: "Timestamp when subscription transitioned to FUNDED; null until funded" }
      - { name: status, type: enum, source: system, description: "DRAFT | SUBMITTED | ACCREDITATION_VERIFIED | SUITABILITY_APPROVED | AWAITING_FUNDING | FUNDED | SUITABILITY_REJECTED | WITHDRAWN" }

  - name: SubscriptionDocument
    parent: Subscription
    common_fields: false
    fields:
      - { name: subscription_id, type: string, source: system, description: "FK -> Subscription.id; owning subscription" }
      - { name: doc_type, type: enum, source: input, description: "SUBSCRIPTION_AGREEMENT | W9 | ACCREDITATION_LETTER | ID_PROOF | SUITABILITY_QUESTIONNAIRE" }
      - { name: file_uri, type: string, source: input, description: "Server-side URI of the uploaded document blob" }
      - { name: received_at, type: datetime, source: system, description: "Server-stamped upload time" }
      - { name: review_status, type: enum, source: system, description: "PENDING_REVIEW | ACCEPTED | REJECTED" }
      - { name: reviewed_by, type: string, source: system, description: "X-User-ID of ComplianceOfficer who reviewed; null while PENDING_REVIEW" }

  - name: CapitalCall
    parent: Offering
    common_fields: true
    fields:
      - { name: offering_id, type: string, source: system, description: "FK -> Offering.id; owning offering" }
      - { name: call_index, type: integer, source: computed, description: "1-based sequence of calls within the offering, assigned on issuance in created_at order" }
      - { name: total_call_cents, type: integer, source: input, description: "Gross call amount across all FUNDED-or-AWAITING_FUNDING subscriptions" }
      - { name: due_date, type: datetime, source: input, description: "Funding due date (ISO 8601 UTC)" }
      - { name: escrow_released_cents, type: integer, source: computed, description: "Cumulative cents released from escrow to operating account against this call" }
      - { name: status, type: enum, source: system, description: "DRAFT | ISSUED | PARTIALLY_FUNDED | FULLY_FUNDED | CANCELLED" }

  - name: CapitalCallContribution
    parent: CapitalCall
    common_fields: true
    fields:
      - { name: capital_call_id, type: string, source: system, description: "FK -> CapitalCall.id; owning capital call" }
      - { name: subscription_id, type: string, source: input, description: "FK -> Subscription.id; contributing subscription" }
      - { name: amount_due_cents, type: integer, source: computed, description: "Pro-rata share: total_call_cents * subscription.committed_cents / offering.total_committed_cents, rounded half-up at the per-line level" }
      - { name: amount_received_cents, type: integer, source: computed, description: "Cents received from investor into escrow" }
      - { name: received_at, type: datetime, source: system, description: "Timestamp of last receipt; null until first receipt" }
      - { name: status, type: enum, source: system, description: "PENDING | ESCROW_RECEIVED | RELEASED | DEFAULTED" }

  - name: QuarterlyReport
    parent: Offering
    common_fields: true
    fields:
      - { name: offering_id, type: string, source: system, description: "FK -> Offering.id; owning offering" }
      - { name: report_year, type: integer, source: input, description: "Calendar year (e.g. 2026)" }
      - { name: report_quarter, type: integer, source: input, description: "1..4" }
      - { name: noi_cents, type: integer, source: input, description: "Net operating income for the quarter" }
      - { name: occupancy_pct, type: number, source: input, description: "Physical occupancy 0..1" }
      - { name: distributable_cash_cents, type: integer, source: computed, description: "noi_cents minus reserves and debt service, computed at finalization" }
      - { name: status, type: enum, source: system, description: "DRAFT | PUBLISHED | AMENDED" }
      - { name: published_at, type: datetime, source: system, description: "Timestamp of PUBLISHED transition" }

  - name: Distribution
    parent: Offering
    common_fields: true
    fields:
      - { name: offering_id, type: string, source: system, description: "FK -> Offering.id; owning offering" }
      - { name: quarterly_report_id, type: string, source: input, required: false, description: "FK -> QuarterlyReport.id; required when distribution_kind=QUARTERLY_OPERATING, must be null when distribution_kind=CAPITAL_EVENT" }
      - { name: capital_event_id, type: string, source: input, required: false, description: "FK -> CapitalEvent.id; required when distribution_kind=CAPITAL_EVENT, must be null when distribution_kind=QUARTERLY_OPERATING" }
      - { name: distribution_kind, type: enum, source: input, description: "QUARTERLY_OPERATING | CAPITAL_EVENT" }
      - { name: total_distributable_cents, type: integer, source: input, description: "Total pool to allocate via waterfall" }
      - { name: status, type: enum, source: system, description: "DRAFT | CALCULATED | APPROVED | PAID | CANCELLED" }
      - { name: calculated_at, type: datetime, source: system, description: "Timestamp of waterfall calculation" }

  - name: DistributionLine
    parent: Distribution
    common_fields: false
    fields:
      - { name: distribution_id, type: string, source: system, description: "FK -> Distribution.id; owning distribution" }
      - { name: subscription_id, type: string, source: system, description: "FK -> Subscription.id; receiving subscription" }
      - { name: return_of_capital_cents, type: integer, source: computed, description: "Tier-1 allocation to this LP" }
      - { name: preferred_return_cents, type: integer, source: computed, description: "Tier-2 allocation to this LP (satisfies accrued_pref)" }
      - { name: profit_split_lp_cents, type: integer, source: computed, description: "Tier-4 LP share (80% of residual after tiers 1-3)" }
      - { name: profit_split_gp_cents, type: integer, source: computed, description: "Tier-3 catch-up + Tier-4 GP share attributable to this LP's pro-rata slice" }
      - { name: total_cents, type: integer, source: computed, description: "Sum of the four allocation components" }
      - { name: paid_at, type: datetime, source: system, description: "Timestamp when line was paid; null until Distribution transitions to PAID" }

  - name: CapitalEvent
    parent: Property
    common_fields: true
    fields:
      - { name: property_id, type: string, source: system, description: "FK -> Property.id; subject property" }
      - { name: event_kind, type: enum, source: input, description: "REFINANCE | SALE" }
      - { name: gross_proceeds_cents, type: integer, source: input, description: "Gross cash available from the event" }
      - { name: debt_payoff_cents, type: integer, source: input, description: "Cents of gross proceeds applied to existing debt payoff" }
      - { name: net_distributable_cents, type: integer, source: computed, description: "gross_proceeds_cents - debt_payoff_cents - closing costs; calculated at execution" }
      - { name: status, type: enum, source: system, description: "ANNOUNCED | EXECUTED | DISTRIBUTED | CANCELLED" }
      - { name: executed_at, type: datetime, source: system, description: "Timestamp of execution; null until EXECUTED" }

  - name: K1Package
    parent: Offering
    common_fields: true
    fields:
      - { name: offering_id, type: string, source: system, description: "FK -> Offering.id; owning offering" }
      - { name: tax_year, type: integer, source: input, description: "Calendar tax year (e.g. 2025)" }
      - { name: preparer_firm, type: string, source: input, description: "External CPA / tax preparer firm" }
      - { name: draft_k1_cents_by_subscription, type: object, source: computed, description: "Map subscription_id -> provisional taxable income cents; computed at PREPARATION" }
      - { name: final_k1_cents_by_subscription, type: object, source: computed, description: "Map subscription_id -> final taxable income cents; computed at FINALIZED" }
      - { name: status, type: enum, source: system, description: "PREPARATION | PARTNER_REVIEW | FINALIZED | DELIVERED" }

  - name: TransferRequest
    parent: Subscription
    common_fields: true
    fields:
      - { name: from_subscription_id, type: string, source: system, description: "FK -> Subscription.id; seller's subscription (parent)" }
      - { name: to_investor_id, type: string, source: input, description: "FK -> Investor.id; prospective buyer (must already exist and be accreditation-verified for this offering)" }
      - { name: transfer_cents, type: integer, source: input, description: "Cents of funded balance to transfer" }
      - { name: status, type: enum, source: system, description: "PENDING_SPONSOR_REVIEW | PENDING_TRANSFER_AGENT | APPROVED | SETTLED | REJECTED | CANCELLED" }
      - { name: settled_at, type: datetime, source: system, description: "Timestamp of SETTLED transition" }

  - name: InvestorPortalSession
    parent: Investor
    common_fields: false
    fields:
      - { name: investor_id, type: string, source: system, description: "FK -> Investor.id; session owner" }
      - { name: session_token, type: string, source: system, description: "Server-minted opaque bearer token for portal access" }
      - { name: issued_at, type: datetime, source: system, description: "Token issue timestamp" }
      - { name: expires_at, type: datetime, source: system, description: "issued_at + 12 hours" }
      - { name: last_accessed_at, type: datetime, source: system, description: "Updated on every portal read" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Syndication
    initial_state: DRAFT
    terminal_states: [CLOSED]
    transitions:
      - from: DRAFT
        to: ACTIVE
        trigger: "POST /syndications/{syndicationId}/activate"
        actor: SponsorOperator
        preconditions: []
        side_effects: []

      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /syndications/{syndicationId}/suspend"
        actor: SponsorOperator
        preconditions: []
        side_effects:
          - "All OPEN Offerings under this Syndication transition to CLOSED_TO_NEW_SUBSCRIPTIONS"

      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /syndications/{syndicationId}/activate"
        actor: SponsorOperator
        preconditions: []
        side_effects: []

      - from: ACTIVE
        to: CLOSED
        trigger: "POST /syndications/{syndicationId}/close"
        actor: SponsorOperator
        preconditions:
          - "Every Offering under this Syndication must be in FINAL_CLOSE or DISSOLVED (ERR_SYNDICATION_HAS_OPEN_OFFERINGS)"
        side_effects:
          - "All non-terminal Subscriptions transition to WITHDRAWN"

  - entity: Investor
    initial_state: ACTIVE
    terminal_states: []
    transitions:
      - from: ACTIVE
        to: ACTIVE
        trigger: "POST /investors/{investorId}/suspend-portal and /revoke-portal (separate portal_access_status dimension)"
        actor: SponsorOperator
        preconditions: []
        side_effects: []
        note: "Investor has no primary status; portal_access_status (INVITED|ACTIVE|SUSPENDED|REVOKED) is a parallel dimension tracked on the entity"

  - entity: Offering
    initial_state: DRAFT
    terminal_states: [DISSOLVED]
    transitions:
      - from: DRAFT
        to: OPEN
        trigger: "POST /syndications/{syndicationId}/offerings/{offeringId}/open"
        actor: SponsorOperator
        preconditions:
          - "Syndication must be ACTIVE (ERR_SYNDICATION_NOT_ACTIVE)"
          - "Property must be OWNED (ERR_PROPERTY_NOT_OWNED)"
        side_effects:
          - "If preferred_return_pct_annual was not set on the Offering, copy it from Syndication.preferred_return_pct_annual"
          - "If carried_interest_pct was not set on the Offering, copy it from Syndication.carried_interest_pct"

      - from: OPEN
        to: CLOSED_TO_NEW_SUBSCRIPTIONS
        trigger: "POST /syndications/{syndicationId}/offerings/{offeringId}/close-to-new"
        actor: SponsorOperator
        preconditions: []
        side_effects: []

      - from: OPEN
        to: CLOSED_TO_NEW_SUBSCRIPTIONS
        trigger: "system (automatic when Syndication suspends)"
        actor: system
        preconditions: []
        side_effects: []

      - from: CLOSED_TO_NEW_SUBSCRIPTIONS
        to: OPEN
        trigger: "POST /syndications/{syndicationId}/offerings/{offeringId}/reopen"
        actor: SponsorOperator
        preconditions:
          - "Syndication must be ACTIVE"
        side_effects: []

      - from: CLOSED_TO_NEW_SUBSCRIPTIONS
        to: FINAL_CLOSE
        trigger: "POST /syndications/{syndicationId}/offerings/{offeringId}/final-close"
        actor: SponsorOperator
        preconditions:
          - "No Subscription under this Offering in DRAFT, SUBMITTED, ACCREDITATION_VERIFIED, SUITABILITY_APPROVED, or AWAITING_FUNDING (ERR_OFFERING_HAS_OPEN_SUBSCRIPTIONS)"
          - "All issued CapitalCalls must be in FULLY_FUNDED or CANCELLED (ERR_OFFERING_HAS_OPEN_CAPITAL_CALLS)"
        side_effects: []

      - from: FINAL_CLOSE
        to: DISSOLVED
        trigger: "POST /syndications/{syndicationId}/offerings/{offeringId}/dissolve"
        actor: SponsorOperator
        preconditions:
          - "unreturned_capital_cents == 0 (ERR_OFFERING_UNRETURNED_CAPITAL)"
          - "Every Distribution under this Offering must be in PAID or CANCELLED (ERR_DISTRIBUTION_NOT_PAID)"
        side_effects:
          - "All FUNDED Subscriptions transition to WITHDRAWN"

  - entity: Subscription
    initial_state: DRAFT
    terminal_states: [FUNDED, WITHDRAWN]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /syndications/{syndicationId}/offerings/{offeringId}/subscriptions/{subscriptionId}/submit"
        actor: Investor
        preconditions:
          - "Offering must be OPEN (ERR_OFFERING_NOT_OPEN)"
          - "committed_cents >= offering.min_subscription_cents (ERR_BELOW_MIN_SUBSCRIPTION)"
          - "All required document types uploaded and ACCEPTED: SUBSCRIPTION_AGREEMENT, W9, SUITABILITY_QUESTIONNAIRE (ERR_MISSING_REQUIRED_DOCUMENTS)"
          - "If investor_class == NON_ACCREDITED, count of existing subscriptions in this offering with investor_class == NON_ACCREDITED in any non-terminal state must be < offering.max_non_accredited_count (ERR_NON_ACCREDITED_CAP_REACHED)"
        side_effects:
          - "Subscription transitions to SUBMITTED"

      - from: SUBMITTED
        to: ACCREDITATION_VERIFIED
        trigger: "POST /syndications/{syndicationId}/offerings/{offeringId}/subscriptions/{subscriptionId}/verify-accreditation"
        actor: ComplianceOfficer
        preconditions:
          - "X-User-ID != subscription's submitting investor_id (segregation of duties — ERR_SELF_VERIFICATION_FORBIDDEN)"
          - "An ACCEPTED ACCREDITATION_LETTER SubscriptionDocument exists on this Subscription (ERR_ACCREDITATION_DOC_MISSING)"
          - "Investor.investor_class must be ACCREDITED or QUALIFIED_PURCHASER if committed_cents >= 100000_00 (ERR_INVESTOR_CLASS_INSUFFICIENT)"
        side_effects:
          - "Subscription.accreditation_verified_by := X-User-ID"
          - "Subscription.accreditation_verified_at := current UTC"
          - "Investor.accreditation_expires_on := current UTC + 90 days"

      - from: ACCREDITATION_VERIFIED
        to: SUITABILITY_APPROVED
        trigger: "POST /syndications/{syndicationId}/offerings/{offeringId}/subscriptions/{subscriptionId}/approve-suitability"
        actor: ComplianceOfficer
        preconditions:
          - "X-User-ID != subscription.accreditation_verified_by (segregation of duties — different officer must approve; ERR_SELF_APPROVAL_FORBIDDEN)"
        side_effects:
          - "Subscription.suitability_verified_by := X-User-ID"
          - "Offering.total_committed_cents += Subscription.committed_cents"
          - "Subscription transitions to AWAITING_FUNDING (chained transition, same request)"

      - from: SUITABILITY_APPROVED
        to: AWAITING_FUNDING
        trigger: "system (chained from approve-suitability; no direct API)"
        actor: system
        preconditions: []
        side_effects:
          - "Subscription enters AWAITING_FUNDING awaiting initial capital call escrow"

      - from: AWAITING_FUNDING
        to: FUNDED
        trigger: "system (automatic when first CapitalCallContribution linked to this subscription reaches RELEASED)"
        actor: system
        preconditions: []
        side_effects:
          - "Subscription.funded_at := current UTC"
          - "Offering.total_funded_cents += Subscription.funded_cents"

      - from: ACCREDITATION_VERIFIED
        to: SUITABILITY_REJECTED
        trigger: "POST /syndications/{syndicationId}/offerings/{offeringId}/subscriptions/{subscriptionId}/reject-suitability"
        actor: ComplianceOfficer
        preconditions: []
        side_effects:
          - "Subscription.accreditation_verified_by := null (forces re-verification on retry)"

      - from: SUITABILITY_REJECTED
        to: SUBMITTED
        trigger: "POST /syndications/{syndicationId}/offerings/{offeringId}/subscriptions/{subscriptionId}/resubmit"
        actor: Investor
        preconditions:
          - "Offering must be OPEN"
        side_effects: []

      - from: DRAFT
        to: WITHDRAWN
        trigger: "POST /syndications/{syndicationId}/offerings/{offeringId}/subscriptions/{subscriptionId}/withdraw"
        actor: Investor
        preconditions:
          - "X-User-ID == subscription.investor_id"
        side_effects: []

      - from: SUBMITTED
        to: WITHDRAWN
        trigger: "POST /syndications/{syndicationId}/offerings/{offeringId}/subscriptions/{subscriptionId}/withdraw"
        actor: Investor
        preconditions:
          - "X-User-ID == subscription.investor_id"
        side_effects: []

      - from: FUNDED
        to: WITHDRAWN
        trigger: "system (automatic on Offering DISSOLVED, or on TransferRequest SETTLED when transfer_cents == subscription.funded_cents)"
        actor: system
        preconditions: []
        side_effects:
          - "Accrued pref and unreturned capital flow into the dissolve/transfer settlement"

  - entity: CapitalCall
    initial_state: DRAFT
    terminal_states: [FULLY_FUNDED, CANCELLED]
    transitions:
      - from: DRAFT
        to: ISSUED
        trigger: "POST /syndications/{syndicationId}/offerings/{offeringId}/capital-calls/{capitalCallId}/issue"
        actor: SponsorOperator
        preconditions:
          - "Offering must be OPEN or CLOSED_TO_NEW_SUBSCRIPTIONS (ERR_OFFERING_NOT_ACCEPTING_CALLS)"
        side_effects:
          - "call_index := next sequence in created_at ASC order"
          - "For each Subscription in SUITABILITY_APPROVED or AWAITING_FUNDING or FUNDED status under this Offering: synthesize a CapitalCallContribution with amount_due_cents computed via pro-rata rule (calc capital_call_prorata_allocation)"

      - from: ISSUED
        to: PARTIALLY_FUNDED
        trigger: "system (automatic when at least one CapitalCallContribution transitions to ESCROW_RECEIVED and at least one other is still PENDING or ESCROW_RECEIVED-but-not-yet-RELEASED)"
        actor: system
        preconditions: []
        side_effects: []

      - from: PARTIALLY_FUNDED
        to: FULLY_FUNDED
        trigger: "system (automatic when every CapitalCallContribution reaches RELEASED)"
        actor: system
        preconditions: []
        side_effects:
          - "For each linked CapitalCallContribution: Subscription.funded_cents += amount_received_cents; Subscription transitions to FUNDED if first release"
          - "Offering.total_funded_cents recomputed as sum over FUNDED subscriptions' funded_cents"

      - from: ISSUED
        to: CANCELLED
        trigger: "POST /syndications/{syndicationId}/offerings/{offeringId}/capital-calls/{capitalCallId}/cancel"
        actor: SponsorOperator
        preconditions:
          - "escrow_released_cents == 0 (ERR_ESCROW_ALREADY_RELEASED)"
        side_effects:
          - "All linked CapitalCallContributions in PENDING or ESCROW_RECEIVED transition to DEFAULTED with amount_received_cents refunded (escrow_released_cents unchanged)"

  - entity: CapitalCallContribution
    initial_state: PENDING
    terminal_states: [RELEASED, DEFAULTED]
    transitions:
      - from: PENDING
        to: ESCROW_RECEIVED
        trigger: "POST /syndications/{syndicationId}/offerings/{offeringId}/capital-calls/{capitalCallId}/contributions/{contributionId}/receive-escrow"
        actor: Investor
        preconditions:
          - "X-User-ID must equal the investor_id of the linked Subscription (ERR_NOT_YOUR_CONTRIBUTION)"
          - "amount_received_cents after this receipt must be <= amount_due_cents (ERR_ESCROW_OVERPAYMENT)"
          - "current UTC <= capital_call.due_date (ERR_ESCROW_PAST_DUE)"
        side_effects:
          - "CapitalCall.escrow_released_cents unchanged (still in escrow)"
          - "CapitalCallContribution.amount_received_cents += input amount_cents"

      - from: ESCROW_RECEIVED
        to: RELEASED
        trigger: "POST /syndications/{syndicationId}/offerings/{offeringId}/capital-calls/{capitalCallId}/contributions/{contributionId}/release-escrow"
        actor: SponsorOperator
        preconditions:
          - "CapitalCall.status in {ISSUED, PARTIALLY_FUNDED}"
          - "amount_received_cents == amount_due_cents (ERR_ESCROW_INCOMPLETE)"
        side_effects:
          - "CapitalCall.escrow_released_cents += amount_received_cents"
          - "Subscription.funded_cents += amount_received_cents"
          - "Subscription.status: if AWAITING_FUNDING then transition to FUNDED (set funded_at); Offering.total_funded_cents recomputed"
          - "Bubble-up: if every other contribution on this call is RELEASED, CapitalCall transitions to FULLY_FUNDED"

      - from: PENDING
        to: DEFAULTED
        trigger: "system (automatic when capital_call.due_date passes with amount_received_cents < amount_due_cents, observed lazily on next read/write against the contribution OR eagerly when the /_clock/set_current_utc test-driving endpoint advances the clock past due_date)"
        actor: system
        preconditions: []
        side_effects:
          - "Investor portal_access_status set to SUSPENDED"
          - "Subscription remains in current status; funded_cents unchanged"

  - entity: QuarterlyReport
    initial_state: DRAFT
    terminal_states: []
    transitions:
      - from: DRAFT
        to: PUBLISHED
        trigger: "POST /syndications/{syndicationId}/offerings/{offeringId}/quarterly-reports/{quarterlyReportId}/publish"
        actor: SponsorOperator
        preconditions:
          - "Offering must be OPEN, CLOSED_TO_NEW_SUBSCRIPTIONS, or FINAL_CLOSE (ERR_OFFERING_NOT_PUBLISHABLE)"
          - "No other PUBLISHED QuarterlyReport for the same (offering_id, report_year, report_quarter) exists (ERR_DUPLICATE_QUARTERLY_REPORT)"
        side_effects:
          - "published_at := current UTC"
          - "distributable_cash_cents computed (calc quarterly_distributable_cash)"

      - from: PUBLISHED
        to: AMENDED
        trigger: "POST /syndications/{syndicationId}/offerings/{offeringId}/quarterly-reports/{quarterlyReportId}/amend"
        actor: SponsorOperator
        preconditions:
          - "No Distribution referencing this report is in APPROVED or PAID (ERR_REPORT_LOCKED_BY_DISTRIBUTION)"
        side_effects:
          - "published_at unchanged; updated_at refreshed"
          - "Recompute distributable_cash_cents"

      - from: AMENDED
        to: PUBLISHED
        trigger: "POST /syndications/{syndicationId}/offerings/{offeringId}/quarterly-reports/{quarterlyReportId}/publish"
        actor: SponsorOperator
        preconditions: []
        side_effects:
          - "Recompute distributable_cash_cents; published_at refreshed"

  - entity: Distribution
    initial_state: DRAFT
    terminal_states: [PAID, CANCELLED]
    transitions:
      - from: DRAFT
        to: CALCULATED
        trigger: "POST /syndications/{syndicationId}/offerings/{offeringId}/distributions/{distributionId}/calculate"
        actor: SponsorOperator
        preconditions:
          - "If distribution_kind == QUARTERLY_OPERATING: linked QuarterlyReport must be PUBLISHED (ERR_REPORT_NOT_PUBLISHED)"
          - "If distribution_kind == CAPITAL_EVENT: linked CapitalEvent must be EXECUTED (ERR_CAPITAL_EVENT_NOT_EXECUTED)"
          - "total_distributable_cents > 0 (ERR_EMPTY_DISTRIBUTION_POOL)"
          - "At least one Subscription under this Offering in FUNDED status (ERR_NO_FUNDED_SUBSCRIPTIONS)"
        side_effects:
          - "calculated_at := current UTC"
          - "Synthesize one DistributionLine per FUNDED Subscription; run calc distribution_waterfall_allocation"

      - from: CALCULATED
        to: APPROVED
        trigger: "POST /syndications/{syndicationId}/offerings/{offeringId}/distributions/{distributionId}/approve"
        actor: SponsorOperator
        preconditions: []
        side_effects: []

      - from: APPROVED
        to: PAID
        trigger: "POST /syndications/{syndicationId}/offerings/{offeringId}/distributions/{distributionId}/pay"
        actor: SponsorOperator
        preconditions: []
        side_effects:
          - "For each DistributionLine: paid_at := current UTC; Subscription.accrued_pref_cents -= preferred_return_cents; Subscription.unreturned_capital_cents -= return_of_capital_cents"
          - "Offering.total_distributed_cents += total_distributable_cents"
          - "Offering.unreturned_capital_cents recomputed"
          - "If distribution_kind == CAPITAL_EVENT and linked CapitalEvent exists: CapitalEvent transitions to DISTRIBUTED"

      - from: DRAFT
        to: CANCELLED
        trigger: "POST /syndications/{syndicationId}/offerings/{offeringId}/distributions/{distributionId}/cancel"
        actor: SponsorOperator
        preconditions: []
        side_effects:
          - "All DistributionLines for this Distribution are discarded"

      - from: CALCULATED
        to: CANCELLED
        trigger: "POST /syndications/{syndicationId}/offerings/{offeringId}/distributions/{distributionId}/cancel"
        actor: SponsorOperator
        preconditions: []
        side_effects:
          - "All DistributionLines for this Distribution are discarded"

  - entity: CapitalEvent
    initial_state: ANNOUNCED
    terminal_states: [DISTRIBUTED, CANCELLED]
    transitions:
      - from: ANNOUNCED
        to: EXECUTED
        trigger: "POST /syndications/{syndicationId}/properties/{propertyId}/capital-events/{capitalEventId}/execute"
        actor: SponsorOperator
        preconditions:
          - "Property.status must be OWNED or UNDER_CONTRACT_TO_SELL (ERR_PROPERTY_NOT_TRANSACTABLE)"
          - "gross_proceeds_cents > debt_payoff_cents (ERR_INSUFFICIENT_PROCEEDS)"
        side_effects:
          - "net_distributable_cents := gross_proceeds_cents - debt_payoff_cents"
          - "executed_at := current UTC"
          - "If event_kind == SALE: Property.status := SOLD"

      - from: EXECUTED
        to: DISTRIBUTED
        trigger: "system (automatic when a Distribution with capital_event_id == this.id reaches PAID)"
        actor: system
        preconditions: []
        side_effects: []

      - from: ANNOUNCED
        to: CANCELLED
        trigger: "POST /syndications/{syndicationId}/properties/{propertyId}/capital-events/{capitalEventId}/cancel"
        actor: SponsorOperator
        preconditions: []
        side_effects: []

  - entity: K1Package
    initial_state: PREPARATION
    terminal_states: [DELIVERED]
    transitions:
      - from: PREPARATION
        to: PARTNER_REVIEW
        trigger: "POST /syndications/{syndicationId}/offerings/{offeringId}/k1-packages/{k1PackageId}/submit-for-review"
        actor: SponsorOperator
        preconditions:
          - "Offering has at least one FUNDED Subscription as of the last day of tax_year (ERR_NO_K1_BASE)"
        side_effects:
          - "draft_k1_cents_by_subscription computed (calc k1_provisional_allocation)"

      - from: PARTNER_REVIEW
        to: FINALIZED
        trigger: "POST /syndications/{syndicationId}/offerings/{offeringId}/k1-packages/{k1PackageId}/finalize"
        actor: SponsorOperator
        preconditions: []
        side_effects:
          - "final_k1_cents_by_subscription computed (calc k1_final_allocation — same inputs, different rounding rule per calc)"
          - "draft_k1_cents_by_subscription unchanged (frozen for delta audit)"

      - from: FINALIZED
        to: DELIVERED
        trigger: "POST /syndications/{syndicationId}/offerings/{offeringId}/k1-packages/{k1PackageId}/deliver"
        actor: SponsorOperator
        preconditions: []
        side_effects:
          - "Each referenced Investor receives a portal-visible K-1 record (InvestorPortalSession last_accessed_at NOT updated; delivery is passive)"

  - entity: TransferRequest
    initial_state: PENDING_SPONSOR_REVIEW
    terminal_states: [SETTLED, REJECTED, CANCELLED]
    transitions:
      - from: PENDING_SPONSOR_REVIEW
        to: PENDING_TRANSFER_AGENT
        trigger: "POST /syndications/{syndicationId}/offerings/{offeringId}/subscriptions/{subscriptionId}/transfer-requests/{transferRequestId}/sponsor-approve"
        actor: SponsorOperator
        preconditions:
          - "from_subscription_id must be FUNDED (ERR_SUBSCRIPTION_NOT_FUNDED)"
          - "transfer_cents <= from_subscription.funded_cents (ERR_TRANSFER_EXCEEDS_FUNDED)"
        side_effects: []

      - from: PENDING_TRANSFER_AGENT
        to: APPROVED
        trigger: "POST /syndications/{syndicationId}/offerings/{offeringId}/subscriptions/{subscriptionId}/transfer-requests/{transferRequestId}/agent-approve"
        actor: TransferAgent
        preconditions:
          - "to_investor has a separate ACCREDITATION_VERIFIED-or-later Subscription on the same Offering (ERR_BUYER_NOT_ONBOARDED)"
          - "to_investor_id != from_subscription.investor_id (ERR_SELF_TRANSFER)"
        side_effects: []

      - from: APPROVED
        to: SETTLED
        trigger: "POST /syndications/{syndicationId}/offerings/{offeringId}/subscriptions/{subscriptionId}/transfer-requests/{transferRequestId}/settle"
        actor: TransferAgent
        preconditions: []
        side_effects:
          - "from_subscription.funded_cents -= transfer_cents"
          - "Locate to_investor's FUNDED Subscription on this Offering; to_subscription.funded_cents += transfer_cents; Offering.total_funded_cents unchanged"
          - "Pro-rata accrued_pref_cents and unreturned_capital_cents transfer with the cents (calc transfer_prorata_carryover)"
          - "If from_subscription.funded_cents == 0 after transfer, from_subscription transitions to WITHDRAWN"

      - from: PENDING_SPONSOR_REVIEW
        to: REJECTED
        trigger: "POST /syndications/{syndicationId}/offerings/{offeringId}/subscriptions/{subscriptionId}/transfer-requests/{transferRequestId}/sponsor-reject"
        actor: SponsorOperator
        preconditions: []
        side_effects: []

      - from: PENDING_TRANSFER_AGENT
        to: REJECTED
        trigger: "POST /syndications/{syndicationId}/offerings/{offeringId}/subscriptions/{subscriptionId}/transfer-requests/{transferRequestId}/agent-reject"
        actor: TransferAgent
        preconditions: []
        side_effects: []

      - from: PENDING_SPONSOR_REVIEW
        to: CANCELLED
        trigger: "POST /syndications/{syndicationId}/offerings/{offeringId}/subscriptions/{subscriptionId}/transfer-requests/{transferRequestId}/cancel"
        actor: Investor
        preconditions:
          - "X-User-ID == from_subscription.investor_id"
        side_effects: []

# =============================================================================
# §1.2.1 Concurrency Rules
# =============================================================================
concurrency_rules:
  - rule_id: transfer-create-stale-subscription
    parent_entity: Subscription
    write_endpoint: "POST /syndications/{syndicationId}/offerings/{offeringId}/subscriptions/{subscriptionId}/transfer-requests"
    occ_field: expected_subscription_version
    description: |
      Creating a TransferRequest against a Subscription whose version has
      advanced since the client last observed it is rejected. This captures
      the case where another writer has just settled a prior TransferRequest
      (which legitimately reduced from_subscription.funded_cents) and the
      current writer's view of the funded balance is therefore stale.
    error_id: ERR_STALE_SUBSCRIPTION_VERSION
    http_status: 412

  - rule_id: distribution-approve-stale-distribution
    parent_entity: Distribution
    write_endpoint: "POST /syndications/{syndicationId}/offerings/{offeringId}/distributions/{distributionId}/approve"
    occ_field: expected_distribution_version
    description: |
      Approving a Distribution whose version has advanced since the client
      last observed it is rejected. This captures the case where another
      writer has recalculated the waterfall (which legitimately re-generated
      DistributionLines) and the current writer's view of the calculated
      lines is therefore stale.
    error_id: ERR_STALE_DISTRIBUTION_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: preferred_return_accrual
    trigger: "Invoked lazily on read of Subscription.accrued_pref_cents, and eagerly at Distribution CALCULATED transition for the input set"
    algorithm: forward_looking
    formula: |
      Let P = subscription.funded_cents (in cents).
      Let r = offering.preferred_return_pct_annual.
      Let Q = number of FULL calendar quarters elapsed between
              subscription.funded_at and the accrual as-of date (current UTC
              on read, or Distribution.calculated_at at calculation time).
              A quarter is "full" if the as-of date is >= the calendar
              quarter-end following funded_at's quarter.
      VARIANT simple:
        accrued_pref_cents = round_half_up( P * r * (Q / 4) )
      VARIANT compounding_quarterly:
        accrued_pref_cents = round_half_up( P * ( (1 + r/4)^Q - 1 ) )
      Variant selection: if offering.carried_interest_pct >= 0.25 then use
      compounding_quarterly, else use simple. (A high-promote deal is assumed
      to use compounding to balance LP economics.)
    input_set: "All Subscriptions under the Offering in FUNDED status; committed-but-unfunded Subscriptions accrue zero"
    constants:
      QUARTERS_PER_YEAR: 4
      COMPOUNDING_CARRY_THRESHOLD: 0.25
    precision: "0 decimal places (integer cents), round_half_up"
    variants:
      - name: simple
        when: "offering.carried_interest_pct < 0.25"
        difference: "Linear accrual P * r * Q/4"
      - name: compounding_quarterly
        when: "offering.carried_interest_pct >= 0.25"
        difference: "Compound accrual P * ((1 + r/4)^Q - 1); grows faster than simple for Q >= 2"

  - name: distribution_waterfall_allocation
    trigger: "Distribution DRAFT -> CALCULATED"
    algorithm: waterfall_allocation
    formula: |
      Inputs:
        pool_cents      = distribution.total_distributable_cents
        LPs             = list of FUNDED Subscriptions on the offering,
                          sorted by funded_at ASC, tie-break by created_at ASC
        r               = offering.preferred_return_pct_annual
        promote         = offering.carried_interest_pct
      For each LP, snapshot:
        unreturned_cap  = subscription.unreturned_capital_cents
        accrued_pref    = preferred_return_accrual(LP, as_of=distribution.calculated_at)
      Tier 1 — Return of capital:
        tier1_pool = min(pool_cents, sum(unreturned_cap over LPs))
        for LP in LPs order:
          lp.tier1 = min(lp.unreturned_cap, tier1_pool_remaining)
          tier1_pool_remaining -= lp.tier1
      Tier 2 — Preferred return:
        tier2_pool = min(pool_cents - sum(tier1), sum(accrued_pref over LPs))
        for LP in LPs order:
          lp.tier2 = min(lp.accrued_pref, tier2_pool_remaining)
          tier2_pool_remaining -= lp.tier2
      Tier 3 — GP catch-up:
        After tier1+tier2, GP receives 100% of the next dollars until
        GP_total == promote * (LP_total_tier2 + GP_total).
        Solving: gp_catch_up_total = round_half_up( promote * sum(tier2) / (1 - promote) )
        tier3_pool = min(pool_cents - sum(tier1) - sum(tier2), gp_catch_up_total)
        Attribute tier3_pool pro-rata across LPs by their tier2 amount:
          for LP in LPs:
            lp.tier3_gp = round_half_up( tier3_pool * lp.tier2 / max(sum(tier2), 1) )
      Tier 4 — Residual profit split:
        residual = pool_cents - sum(tier1) - sum(tier2) - tier3_pool
        LP side total = round_half_up( residual * (1 - promote) )
        GP side total = residual - LP side total
        for LP in LPs order:
          lp.tier4_lp = round_half_up( LP_side_total * lp.funded_cents / max(sum(funded_cents over LPs), 1) )
          lp.tier4_gp = round_half_up( GP_side_total * lp.funded_cents / max(sum(funded_cents over LPs), 1) )
      Per-LP DistributionLine fields:
        return_of_capital_cents = lp.tier1
        preferred_return_cents  = lp.tier2
        profit_split_lp_cents   = lp.tier4_lp
        profit_split_gp_cents   = lp.tier3_gp + lp.tier4_gp
        total_cents             = return_of_capital_cents + preferred_return_cents
                                  + profit_split_lp_cents + profit_split_gp_cents
    input_set: "Subscriptions in FUNDED status at Distribution.calculated_at, sorted by funded_at ASC with created_at ASC tie-break"
    constants:
      DEFAULT_LP_SHARE: 0.80
      DEFAULT_GP_SHARE: 0.20
    precision: "0 decimal places (integer cents), round_half_up per line; lines are rounded individually then summed (per-line-then-sum order is pinned)"

  - name: capital_call_prorata_allocation
    trigger: "CapitalCall DRAFT -> ISSUED (synthesizes CapitalCallContributions)"
    algorithm: waterfall_allocation
    formula: |
      Inputs:
        call_cents      = capital_call.total_call_cents
        eligible_subs   = list of Subscriptions on the offering in
                          {SUITABILITY_APPROVED, AWAITING_FUNDING, FUNDED},
                          sorted by created_at ASC
        committed_total = sum(subscription.committed_cents over eligible_subs)
      Per-subscription raw share:
        raw_share_cents = call_cents * sub.committed_cents / committed_total
      ROUNDING ORDER (pinned): per-line rounding first, then reconciliation.
        line.amount_due_cents = round_half_up(raw_share_cents)
      RECONCILIATION: if sum(line.amount_due_cents) != call_cents, the
      difference (which is at most +/-len(eligible_subs) cents) is allocated
      to the single line with the LARGEST amount_due_cents (ties broken by
      earliest subscription.created_at). This is the "largest-remainder"
      adjustment and ensures the contributions sum exactly to call_cents.
    input_set: "Subscriptions in SUITABILITY_APPROVED, AWAITING_FUNDING, or FUNDED status at CapitalCall issuance"
    precision: "0 decimal places (integer cents), round_half_up per line, then largest-remainder reconciliation"

  - name: quarterly_distributable_cash
    trigger: "QuarterlyReport DRAFT -> PUBLISHED and AMENDED -> PUBLISHED"
    algorithm: aggregation
    formula: |
      distributable_cash_cents = max(0, noi_cents - reserve_withholding_cents - debt_service_cents)
      where
        reserve_withholding_cents = round_half_up( noi_cents * RESERVE_PCT )
        debt_service_cents        = round_half_up( noi_cents * DEBT_SERVICE_PCT )
      Note: this is a forward-looking estimate used for the QUARTERLY_OPERATING
      distribution variant; it diverges from the actual capital-event net
      distributable which is computed separately on CapitalEvent.
    constants:
      RESERVE_PCT: 0.10
      DEBT_SERVICE_PCT: 0.30
    precision: "0 decimal places (integer cents), round_half_up"

  - name: capital_event_net_distributable
    trigger: "CapitalEvent ANNOUNCED -> EXECUTED"
    algorithm: aggregation
    formula: |
      net_distributable_cents = gross_proceeds_cents - debt_payoff_cents
    precision: "0 decimal places (integer cents), exact subtraction"
    note: "This is the ACTUAL cash available post-close; diverges from quarterly_distributable_cash which is a forward estimate. Both feed Distribution, but on different distribution_kind values."

  - name: k1_provisional_allocation
    trigger: "K1Package PREPARATION -> PARTNER_REVIEW"
    algorithm: aggregation
    formula: |
      Inputs:
        offering_noi_cents_for_year = sum(quarterly_report.noi_cents over
          PUBLISHED or AMENDED QuarterlyReports on this offering whose
          report_year == k1_package.tax_year)
        LPs = FUNDED Subscriptions on this offering, sorted by funded_at ASC
              with created_at ASC tie-break
        total_funded_at_year_end = sum(LP.funded_cents) — snapshot at last
              day of tax_year (test fixtures ensure no transfers mid-year)
      Per-LP PROVISIONAL allocation (estimate, used for review):
        draft_k1_cents_by_subscription[sub.id] =
          round_half_up( offering_noi_cents_for_year * sub.funded_cents / total_funded_at_year_end )
      Rounding order: per-line rounding; NO largest-remainder reconciliation
      (provisional — allowed to drift by a few cents from offering_noi_cents_for_year).
    input_set: "QuarterlyReports with status IN {PUBLISHED, AMENDED} and report_year == k1_package.tax_year; FUNDED Subscriptions at year-end"
    precision: "0 decimal places (integer cents), round_half_up per line, no reconciliation pass"

  - name: k1_final_allocation
    trigger: "K1Package PARTNER_REVIEW -> FINALIZED"
    algorithm: aggregation
    formula: |
      Same inputs as k1_provisional_allocation, but with largest-remainder
      reconciliation against the same offering_noi_cents_for_year:
        raw_share = offering_noi_cents_for_year * sub.funded_cents / total_funded_at_year_end
        line      = round_half_up(raw_share)
      Then: diff = offering_noi_cents_for_year - sum(line)
            Allocate diff cents (signed) to the line with the LARGEST funded_cents
            (ties broken by earliest subscription.created_at).
      The two variants therefore differ from each other by AT MOST the
      largest-remainder reconciliation amount — a deliberate dual-variant
      divergence on identical inputs.
    input_set: "Same as k1_provisional_allocation"
    precision: "0 decimal places (integer cents), round_half_up per line, then largest-remainder reconciliation to offering_noi_cents_for_year"
    variants:
      - name: provisional
        when: "K1Package in PARTNER_REVIEW"
        difference: "No reconciliation; sum may drift a few cents from offering NOI"
      - name: final
        when: "K1Package FINALIZED"
        difference: "Largest-remainder reconciliation forces sum to exactly equal offering NOI"

  - name: transfer_prorata_carryover
    trigger: "TransferRequest APPROVED -> SETTLED"
    algorithm: waterfall_allocation
    formula: |
      Let F = from_subscription.funded_cents BEFORE settlement.
      Let T = transfer_cents.
      Let ratio = T / F  (exact rational).
      carryover_pref       = round_half_up( from_subscription.accrued_pref_cents * ratio )
      carryover_unreturned = round_half_up( from_subscription.unreturned_capital_cents * ratio )
      After settlement:
        from_subscription.accrued_pref_cents        -= carryover_pref
        from_subscription.unreturned_capital_cents  -= carryover_unreturned
        to_subscription.accrued_pref_cents          += carryover_pref
        to_subscription.unreturned_capital_cents    += carryover_unreturned
        from_subscription.funded_cents              -= T
        to_subscription.funded_cents                += T
    precision: "0 decimal places (integer cents), round_half_up"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers must be present and well-formed"
    error_id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER
    http_status: 400
    applies_to: "all"

  - priority: 2
    category: auth
    check: "Role is permitted to invoke this endpoint per §1.7"
    error_id: ERR_INSUFFICIENT_PERMISSIONS
    http_status: 403
    applies_to: "all"

  - priority: 3
    category: existence
    check: "Path-template IDs resolve left-to-right: syndication, offering, subscription, then deeper child IDs"
    error_id: "ERR_SYNDICATION_NOT_FOUND | ERR_OFFERING_NOT_FOUND | ERR_SUBSCRIPTION_NOT_FOUND | ERR_INVESTOR_NOT_FOUND | ERR_PROPERTY_NOT_FOUND | ERR_DOCUMENT_NOT_FOUND | ERR_CAPITAL_CALL_NOT_FOUND | ERR_CONTRIBUTION_NOT_FOUND | ERR_QUARTERLY_REPORT_NOT_FOUND | ERR_DISTRIBUTION_NOT_FOUND | ERR_CAPITAL_EVENT_NOT_FOUND | ERR_K1_PACKAGE_NOT_FOUND | ERR_TRANSFER_REQUEST_NOT_FOUND"
    http_status: 404
    applies_to: "all nested endpoints"

  - priority: 4
    category: state
    check: "Target resource is in a state from which the requested transition is allowed per §1.2"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all state-transition endpoints"

  - priority: 5a
    category: state
    check: "Syndication must be ACTIVE for any offering-open, subscription-submit, or capital-call issuance"
    error_id: ERR_SYNDICATION_NOT_ACTIVE
    http_status: 409
    applies_to: "POST /offerings/{id}/open, POST /subscriptions/{id}/submit, POST /capital-calls/{id}/issue"

  - priority: 5b
    category: state
    check: "Offering must be OPEN for new subscriptions, transfer requests, and quarterly report publish"
    error_id: ERR_OFFERING_NOT_OPEN
    http_status: 409
    applies_to: "POST /subscriptions, POST /subscriptions/{id}/submit, POST /transfer-requests, POST /quarterly-reports/{id}/publish"

  - priority: 5c
    category: state
    check: "Property must be in OWNED or UNDER_CONTRACT_TO_SELL to execute a capital event"
    error_id: ERR_PROPERTY_NOT_TRANSACTABLE
    http_status: 409
    applies_to: "POST /capital-events/{id}/execute"

  - priority: 6a
    category: business_safety
    check: "Segregation of duties: ComplianceOfficer cannot verify accreditation on their own submitted subscription"
    error_id: ERR_SELF_VERIFICATION_FORBIDDEN
    http_status: 403
    applies_to: "POST /subscriptions/{id}/verify-accreditation"

  - priority: 6b
    category: business_safety
    check: "Segregation of duties: ComplianceOfficer approving suitability must differ from the officer who verified accreditation"
    error_id: ERR_SELF_APPROVAL_FORBIDDEN
    http_status: 403
    applies_to: "POST /subscriptions/{id}/approve-suitability"

  - priority: 6c
    category: business_safety
    check: "Investor class must be ACCREDITED or QUALIFIED_PURCHASER when committed_cents >= 100000_00"
    error_id: ERR_INVESTOR_CLASS_INSUFFICIENT
    http_status: 422
    applies_to: "POST /subscriptions/{id}/verify-accreditation"

  - priority: 6d
    category: business_safety
    check: "ACCREDITATION_LETTER SubscriptionDocument must exist and be ACCEPTED before accreditation verification"
    error_id: ERR_ACCREDITATION_DOC_MISSING
    http_status: 422
    applies_to: "POST /subscriptions/{id}/verify-accreditation"

  - priority: 7a
    category: business_constraint
    check: "Required documents (SUBSCRIPTION_AGREEMENT, W9, SUITABILITY_QUESTIONNAIRE) must be present with review_status == ACCEPTED"
    error_id: ERR_MISSING_REQUIRED_DOCUMENTS
    http_status: 422
    applies_to: "POST /subscriptions/{id}/submit"

  - priority: 7b
    category: business_constraint
    check: "committed_cents >= offering.min_subscription_cents"
    error_id: ERR_BELOW_MIN_SUBSCRIPTION
    http_status: 422
    applies_to: "POST /subscriptions/{id}/submit"

  - priority: 7c
    category: business_constraint
    check: "Count of NON_ACCREDITED-class subscriptions in non-terminal state on this offering must be < offering.max_non_accredited_count"
    error_id: ERR_NON_ACCREDITED_CAP_REACHED
    http_status: 422
    applies_to: "POST /subscriptions/{id}/submit"

  - priority: 7d
    category: business_constraint
    check: "No other PUBLISHED QuarterlyReport for same (offering_id, report_year, report_quarter)"
    error_id: ERR_DUPLICATE_QUARTERLY_REPORT
    http_status: 409
    applies_to: "POST /quarterly-reports/{id}/publish"

  - priority: 7e
    category: business_constraint
    check: "transfer_cents must be > 0 and <= from_subscription.funded_cents"
    error_id: ERR_TRANSFER_EXCEEDS_FUNDED
    http_status: 422
    applies_to: "POST /transfer-requests/{id}/sponsor-approve"

  - priority: 7f
    category: business_constraint
    check: "Buyer (to_investor_id) must have an ACCREDITATION_VERIFIED-or-later Subscription on the same Offering"
    error_id: ERR_BUYER_NOT_ONBOARDED
    http_status: 422
    applies_to: "POST /transfer-requests/{id}/agent-approve"

  - priority: 7g
    category: business_constraint
    check: "Buyer cannot equal the seller (self-transfer)"
    error_id: ERR_SELF_TRANSFER
    http_status: 422
    applies_to: "POST /transfer-requests/{id}/agent-approve"

  - priority: 7h
    category: business_constraint
    check: "No Distribution referencing this QuarterlyReport is in APPROVED or PAID"
    error_id: ERR_REPORT_LOCKED_BY_DISTRIBUTION
    http_status: 409
    applies_to: "POST /quarterly-reports/{id}/amend"

  - priority: 8a
    category: business_fiscal
    check: "Capital-call escrow receipt: amount_received_cents + new_amount <= amount_due_cents"
    error_id: ERR_ESCROW_OVERPAYMENT
    http_status: 422
    applies_to: "POST /contributions/{id}/receive-escrow"

  - priority: 8b
    category: business_temporal
    check: "Capital-call escrow receipt: current UTC must be <= capital_call.due_date"
    error_id: ERR_ESCROW_PAST_DUE
    http_status: 422
    applies_to: "POST /contributions/{id}/receive-escrow"

  - priority: 8c
    category: business_fiscal
    check: "Escrow release: amount_received_cents must equal amount_due_cents"
    error_id: ERR_ESCROW_INCOMPLETE
    http_status: 422
    applies_to: "POST /contributions/{id}/release-escrow"

  - priority: 8d
    category: business_fiscal
    check: "Capital event execution: gross_proceeds_cents > debt_payoff_cents"
    error_id: ERR_INSUFFICIENT_PROCEEDS
    http_status: 422
    applies_to: "POST /capital-events/{id}/execute"

  - priority: 8e
    category: business_fiscal
    check: "Distribution calculation requires at least one FUNDED Subscription and total_distributable_cents > 0"
    error_id: "ERR_NO_FUNDED_SUBSCRIPTIONS | ERR_EMPTY_DISTRIBUTION_POOL"
    http_status: 422
    applies_to: "POST /distributions/{id}/calculate"

  - priority: 8f
    category: business_fiscal
    check: "Offering FINAL_CLOSE: no unresolved Subscriptions or CapitalCalls"
    error_id: "ERR_OFFERING_HAS_OPEN_SUBSCRIPTIONS | ERR_OFFERING_HAS_OPEN_CAPITAL_CALLS"
    http_status: 409
    applies_to: "POST /offerings/{id}/final-close"

  - priority: 8g
    category: business_fiscal
    check: "Offering DISSOLVE: unreturned_capital_cents == 0 AND no un-PAID Distributions"
    error_id: "ERR_OFFERING_UNRETURNED_CAPITAL | ERR_DISTRIBUTION_NOT_PAID"
    http_status: 409
    applies_to: "POST /offerings/{id}/dissolve"

  - priority: 8h
    category: business_fiscal
    check: "CapitalCall cancel: escrow_released_cents == 0"
    error_id: ERR_ESCROW_ALREADY_RELEASED
    http_status: 409
    applies_to: "POST /capital-calls/{id}/cancel"

  - priority: 8i
    category: business_fiscal
    check: "K1Package submit-for-review: at least one FUNDED Subscription at end of tax_year"
    error_id: ERR_NO_K1_BASE
    http_status: 422
    applies_to: "POST /k1-packages/{id}/submit-for-review"

  - priority: 9
    category: business_temporal
    check: "QuarterlyReport publish: report_year/report_quarter must not be in the future relative to current UTC"
    error_id: ERR_FUTURE_REPORT_PERIOD
    http_status: 422
    applies_to: "POST /quarterly-reports, POST /quarterly-reports/{id}/publish"

  - priority: 10
    category: business_constraint
    check: "CapitalEvent creation: at most one active (ANNOUNCED or EXECUTED) CapitalEvent per property at any time"
    error_id: ERR_PROPERTY_HAS_ACTIVE_CAPITAL_EVENT
    http_status: 409
    applies_to: "POST /properties/{id}/capital-events"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

endpoints:
  # --- Syndication ---
  - method: POST
    path: "/syndications"
    description: "Create a Syndication (sponsor firm)"
    roles: [SponsorOperator]
    code: 201
    input: [syndication_name, sponsor_legal_entity, preferred_return_pct_annual, carried_interest_pct]
    output: Syndication
    side_effects: ["status := DRAFT"]

  - method: GET
    path: "/syndications"
    description: "List syndications"
    roles: [SponsorOperator, ComplianceOfficer, TransferAgent, Investor]
    code: 200
    input: ["limit?", "offset?"]
    output: "Syndication[]"
    side_effects: []

  - method: GET
    path: "/syndications/{syndicationId}"
    description: "Get a specific syndication"
    roles: [SponsorOperator, ComplianceOfficer, TransferAgent, Investor]
    code: 200
    input: []
    output: Syndication
    side_effects: []

  - method: POST
    path: "/syndications/{syndicationId}/activate"
    description: "Activate (or re-activate) a syndication"
    roles: [SponsorOperator]
    code: 200
    input: ["expected_syndication_version?"]
    output: Syndication
    side_effects: ["status DRAFT|SUSPENDED -> ACTIVE", "increments Syndication.version by 1"]

  - method: POST
    path: "/syndications/{syndicationId}/suspend"
    description: "Suspend a syndication; cascades OPEN offerings to CLOSED_TO_NEW_SUBSCRIPTIONS"
    roles: [SponsorOperator]
    code: 200
    input: ["expected_syndication_version?"]
    output: Syndication
    side_effects:
      - "status ACTIVE -> SUSPENDED"
      - "Each child Offering in OPEN transitions to CLOSED_TO_NEW_SUBSCRIPTIONS"
      - "increments Syndication.version by 1"

  - method: POST
    path: "/syndications/{syndicationId}/close"
    description: "Close a syndication; all offerings must be FINAL_CLOSE or DISSOLVED"
    roles: [SponsorOperator]
    code: 200
    input: ["expected_syndication_version?"]
    output: Syndication
    side_effects:
      - "status ACTIVE -> CLOSED"
      - "All non-terminal Subscriptions transition to WITHDRAWN"
      - "increments Syndication.version by 1"

  # --- Investor ---
  - method: POST
    path: "/investors"
    description: "Register an investor"
    roles: [SponsorOperator]
    code: 201
    input: [full_legal_name, tax_id_last4, email, investor_class]
    output: Investor
    side_effects: ["portal_access_status := INVITED"]

  - method: GET
    path: "/investors"
    description: "List investors"
    roles: [SponsorOperator, ComplianceOfficer, TransferAgent]
    code: 200
    input: ["limit?", "offset?"]
    output: "Investor[]"
    side_effects: []

  - method: GET
    path: "/investors/{investorId}"
    description: "Get an investor (self or back-office)"
    roles: [SponsorOperator, ComplianceOfficer, TransferAgent, Investor]
    code: 200
    input: []
    output: Investor
    side_effects: []

  - method: POST
    path: "/investors/{investorId}/suspend-portal"
    description: "Suspend investor portal access"
    roles: [SponsorOperator]
    code: 200
    input: []
    output: Investor
    side_effects: ["portal_access_status := SUSPENDED"]

  - method: POST
    path: "/investors/{investorId}/revoke-portal"
    description: "Revoke investor portal access"
    roles: [SponsorOperator]
    code: 200
    input: []
    output: Investor
    side_effects: ["portal_access_status := REVOKED"]

  # --- InvestorPortalSession ---
  - method: POST
    path: "/investors/{investorId}/portal-sessions"
    description: "Issue a portal session token (used by Investor role)"
    roles: [Investor]
    code: 201
    input: []
    output: InvestorPortalSession
    side_effects:
      - "session_token := server-minted UUID"
      - "issued_at := current UTC; expires_at := issued_at + 12h"
      - "If investor.portal_access_status != ACTIVE, reject with ERR_PORTAL_ACCESS_DENIED"

  - method: GET
    path: "/investors/{investorId}/portal-sessions"
    description: "List an investor's portal sessions"
    roles: [Investor, SponsorOperator, ComplianceOfficer]
    code: 200
    input: ["limit?", "offset?"]
    output: "InvestorPortalSession[]"
    side_effects: []

  # --- Property ---
  - method: POST
    path: "/properties"
    description: "Register a property"
    roles: [SponsorOperator]
    code: 201
    input: [property_legal_name, street_address, acquisition_price_cents]
    output: Property
    side_effects: ["status := OWNED"]

  - method: GET
    path: "/properties"
    description: "List properties"
    roles: [SponsorOperator, ComplianceOfficer, TransferAgent, Investor]
    code: 200
    input: ["limit?", "offset?"]
    output: "Property[]"
    side_effects: []

  - method: GET
    path: "/properties/{propertyId}"
    description: "Get a specific property"
    roles: [SponsorOperator, ComplianceOfficer, TransferAgent, Investor]
    code: 200
    input: []
    output: Property
    side_effects: []

  # --- Offering ---
  - method: POST
    path: "/syndications/{syndicationId}/offerings"
    description: "Create an offering under a syndication"
    roles: [SponsorOperator]
    code: 201
    input: [property_id, offering_name, target_raise_cents, min_subscription_cents, max_non_accredited_count, "preferred_return_pct_annual?", "carried_interest_pct?"]
    output: Offering
    side_effects:
      - "status := DRAFT"
      - "total_committed_cents, total_funded_cents, total_distributed_cents initialized to 0"

  - method: GET
    path: "/syndications/{syndicationId}/offerings"
    description: "List offerings under a syndication"
    roles: [SponsorOperator, ComplianceOfficer, TransferAgent, Investor]
    code: 200
    input: ["limit?", "offset?", "status?"]
    output: "Offering[]"
    side_effects: []

  - method: GET
    path: "/syndications/{syndicationId}/offerings/{offeringId}"
    description: "Get a specific offering"
    roles: [SponsorOperator, ComplianceOfficer, TransferAgent, Investor]
    code: 200
    input: []
    output: Offering
    side_effects: []

  - method: POST
    path: "/syndications/{syndicationId}/offerings/{offeringId}/open"
    description: "Open an offering for subscriptions"
    roles: [SponsorOperator]
    code: 200
    input: ["expected_offering_version?"]
    output: Offering
    side_effects:
      - "status DRAFT -> OPEN"
      - "Copy preferred_return_pct_annual and carried_interest_pct from Syndication if unset on Offering"
      - "increments Offering.version by 1"

  - method: POST
    path: "/syndications/{syndicationId}/offerings/{offeringId}/close-to-new"
    description: "Stop accepting new subscriptions"
    roles: [SponsorOperator]
    code: 200
    input: ["expected_offering_version?"]
    output: Offering
    side_effects: ["status OPEN -> CLOSED_TO_NEW_SUBSCRIPTIONS", "increments Offering.version by 1"]

  - method: POST
    path: "/syndications/{syndicationId}/offerings/{offeringId}/reopen"
    description: "Re-open a closed-to-new offering"
    roles: [SponsorOperator]
    code: 200
    input: ["expected_offering_version?"]
    output: Offering
    side_effects: ["status CLOSED_TO_NEW_SUBSCRIPTIONS -> OPEN", "increments Offering.version by 1"]

  - method: POST
    path: "/syndications/{syndicationId}/offerings/{offeringId}/final-close"
    description: "Move offering to FINAL_CLOSE (no open subscriptions/calls)"
    roles: [SponsorOperator]
    code: 200
    input: ["expected_offering_version?"]
    output: Offering
    side_effects: ["status CLOSED_TO_NEW_SUBSCRIPTIONS -> FINAL_CLOSE", "increments Offering.version by 1"]

  - method: POST
    path: "/syndications/{syndicationId}/offerings/{offeringId}/dissolve"
    description: "Dissolve an offering (all capital returned, all distributions paid)"
    roles: [SponsorOperator]
    code: 200
    input: ["expected_offering_version?"]
    output: Offering
    side_effects:
      - "status FINAL_CLOSE -> DISSOLVED"
      - "All FUNDED Subscriptions transition to WITHDRAWN"
      - "increments Offering.version by 1"

  # --- Subscription ---
  - method: POST
    path: "/syndications/{syndicationId}/offerings/{offeringId}/subscriptions"
    description: "Create a draft subscription"
    roles: [Investor]
    code: 201
    input: [investor_id, committed_cents]
    output: Subscription
    side_effects: ["status := DRAFT", "funded_cents := 0", "accrued_pref_cents := 0", "unreturned_capital_cents := 0"]

  - method: GET
    path: "/syndications/{syndicationId}/offerings/{offeringId}/subscriptions"
    description: "List subscriptions on an offering"
    roles: [SponsorOperator, ComplianceOfficer, TransferAgent, Investor]
    code: 200
    input: ["limit?", "offset?", "status?", "investor_id?"]
    output: "Subscription[]"
    side_effects: []

  - method: GET
    path: "/syndications/{syndicationId}/offerings/{offeringId}/subscriptions/{subscriptionId}"
    description: "Get a specific subscription"
    roles: [SponsorOperator, ComplianceOfficer, TransferAgent, Investor]
    code: 200
    input: []
    output: Subscription
    side_effects: []

  - method: POST
    path: "/syndications/{syndicationId}/offerings/{offeringId}/subscriptions/{subscriptionId}/submit"
    description: "Investor submits subscription (validates documents, min, non-accredited cap)"
    roles: [Investor]
    code: 200
    input: []
    output: Subscription
    side_effects: ["status DRAFT -> SUBMITTED", "increments Subscription.version by 1"]

  - method: POST
    path: "/syndications/{syndicationId}/offerings/{offeringId}/subscriptions/{subscriptionId}/verify-accreditation"
    description: "ComplianceOfficer verifies accreditation"
    roles: [ComplianceOfficer]
    code: 200
    input: []
    output: Subscription
    side_effects:
      - "status SUBMITTED -> ACCREDITATION_VERIFIED"
      - "accreditation_verified_by, accreditation_verified_at set"
      - "Investor.accreditation_expires_on := current UTC + 90 days"
      - "increments Subscription.version by 1"

  - method: POST
    path: "/syndications/{syndicationId}/offerings/{offeringId}/subscriptions/{subscriptionId}/approve-suitability"
    description: "ComplianceOfficer (different from verifier) approves suitability"
    roles: [ComplianceOfficer]
    code: 200
    input: []
    output: Subscription
    side_effects:
      - "status ACCREDITATION_VERIFIED -> SUITABILITY_APPROVED -> AWAITING_FUNDING (chained)"
      - "suitability_verified_by set; must differ from accreditation_verified_by"
      - "Offering.total_committed_cents += committed_cents"
      - "increments Subscription.version by 1; increments Offering.version by 1"

  - method: POST
    path: "/syndications/{syndicationId}/offerings/{offeringId}/subscriptions/{subscriptionId}/reject-suitability"
    description: "Reject suitability; accreditation_verified_by cleared"
    roles: [ComplianceOfficer]
    code: 200
    input: []
    output: Subscription
    side_effects:
      - "status ACCREDITATION_VERIFIED -> SUITABILITY_REJECTED"
      - "accreditation_verified_by := null"
      - "increments Subscription.version by 1"

  - method: POST
    path: "/syndications/{syndicationId}/offerings/{offeringId}/subscriptions/{subscriptionId}/resubmit"
    description: "Investor resubmits after rejection"
    roles: [Investor]
    code: 200
    input: []
    output: Subscription
    side_effects: ["status SUITABILITY_REJECTED -> SUBMITTED", "increments Subscription.version by 1"]

  - method: POST
    path: "/syndications/{syndicationId}/offerings/{offeringId}/subscriptions/{subscriptionId}/withdraw"
    description: "Investor withdraws"
    roles: [Investor]
    code: 200
    input: []
    output: Subscription
    side_effects: ["status DRAFT|SUBMITTED -> WITHDRAWN", "increments Subscription.version by 1"]

  # --- SubscriptionDocument ---
  - method: POST
    path: "/syndications/{syndicationId}/offerings/{offeringId}/subscriptions/{subscriptionId}/documents"
    description: "Upload a subscription document"
    roles: [Investor]
    code: 201
    input: [doc_type, file_uri]
    output: SubscriptionDocument
    side_effects: ["review_status := PENDING_REVIEW", "received_at := current UTC"]

  - method: GET
    path: "/syndications/{syndicationId}/offerings/{offeringId}/subscriptions/{subscriptionId}/documents"
    description: "List documents on a subscription"
    roles: [SponsorOperator, ComplianceOfficer, Investor]
    code: 200
    input: ["limit?", "offset?", "doc_type?", "review_status?"]
    output: "SubscriptionDocument[]"
    side_effects: []

  - method: GET
    path: "/syndications/{syndicationId}/offerings/{offeringId}/subscriptions/{subscriptionId}/documents/{documentId}"
    description: "Get a specific document"
    roles: [SponsorOperator, ComplianceOfficer, Investor]
    code: 200
    input: []
    output: SubscriptionDocument
    side_effects: []

  - method: POST
    path: "/syndications/{syndicationId}/offerings/{offeringId}/subscriptions/{subscriptionId}/documents/{documentId}/accept"
    description: "ComplianceOfficer accepts a document"
    roles: [ComplianceOfficer]
    code: 200
    input: []
    output: SubscriptionDocument
    side_effects: ["review_status := ACCEPTED", "reviewed_by := X-User-ID"]

  - method: POST
    path: "/syndications/{syndicationId}/offerings/{offeringId}/subscriptions/{subscriptionId}/documents/{documentId}/reject"
    description: "ComplianceOfficer rejects a document"
    roles: [ComplianceOfficer]
    code: 200
    input: []
    output: SubscriptionDocument
    side_effects: ["review_status := REJECTED", "reviewed_by := X-User-ID"]

  # --- CapitalCall ---
  - method: POST
    path: "/syndications/{syndicationId}/offerings/{offeringId}/capital-calls"
    description: "Create a capital call (DRAFT)"
    roles: [SponsorOperator]
    code: 201
    input: [total_call_cents, due_date]
    output: CapitalCall
    side_effects: ["status := DRAFT", "escrow_released_cents := 0"]

  - method: GET
    path: "/syndications/{syndicationId}/offerings/{offeringId}/capital-calls"
    description: "List capital calls on an offering"
    roles: [SponsorOperator, ComplianceOfficer, TransferAgent, Investor]
    code: 200
    input: ["limit?", "offset?", "status?"]
    output: "CapitalCall[]"
    side_effects: []

  - method: GET
    path: "/syndications/{syndicationId}/offerings/{offeringId}/capital-calls/{capitalCallId}"
    description: "Get a capital call"
    roles: [SponsorOperator, ComplianceOfficer, TransferAgent, Investor]
    code: 200
    input: []
    output: CapitalCall
    side_effects: []

  - method: POST
    path: "/syndications/{syndicationId}/offerings/{offeringId}/capital-calls/{capitalCallId}/issue"
    description: "Issue a capital call; synthesize pro-rata contributions"
    roles: [SponsorOperator]
    code: 200
    input: []
    output: CapitalCall
    side_effects:
      - "status DRAFT -> ISSUED"
      - "call_index := next sequence in created_at ASC order"
      - "Synthesize CapitalCallContribution per eligible subscription per capital_call_prorata_allocation"

  - method: POST
    path: "/syndications/{syndicationId}/offerings/{offeringId}/capital-calls/{capitalCallId}/cancel"
    description: "Cancel a DRAFT or ISSUED capital call"
    roles: [SponsorOperator]
    code: 200
    input: []
    output: CapitalCall
    side_effects:
      - "status -> CANCELLED"
      - "All PENDING or ESCROW_RECEIVED CapitalCallContributions -> DEFAULTED (refund path)"

  # --- CapitalCallContribution ---
  - method: GET
    path: "/syndications/{syndicationId}/offerings/{offeringId}/capital-calls/{capitalCallId}/contributions"
    description: "List contributions on a call"
    roles: [SponsorOperator, ComplianceOfficer, TransferAgent, Investor]
    code: 200
    input: ["limit?", "offset?", "status?", "subscription_id?"]
    output: "CapitalCallContribution[]"
    side_effects: []

  - method: GET
    path: "/syndications/{syndicationId}/offerings/{offeringId}/capital-calls/{capitalCallId}/contributions/{contributionId}"
    description: "Get a contribution"
    roles: [SponsorOperator, ComplianceOfficer, TransferAgent, Investor]
    code: 200
    input: []
    output: CapitalCallContribution
    side_effects: []

  - method: POST
    path: "/syndications/{syndicationId}/offerings/{offeringId}/capital-calls/{capitalCallId}/contributions/{contributionId}/receive-escrow"
    description: "Investor wires escrow funds (may be partial)"
    roles: [Investor]
    code: 200
    input: [amount_cents]
    output: CapitalCallContribution
    side_effects:
      - "amount_received_cents += amount_cents"
      - "status PENDING -> ESCROW_RECEIVED if amount_received_cents > 0"
      - "CapitalCall may transition ISSUED -> PARTIALLY_FUNDED"

  - method: POST
    path: "/syndications/{syndicationId}/offerings/{offeringId}/capital-calls/{capitalCallId}/contributions/{contributionId}/release-escrow"
    description: "Release escrow to operating account"
    roles: [SponsorOperator]
    code: 200
    input: []
    output: CapitalCallContribution
    side_effects:
      - "status ESCROW_RECEIVED -> RELEASED"
      - "CapitalCall.escrow_released_cents += amount_received_cents"
      - "Subscription.funded_cents += amount_received_cents; Subscription -> FUNDED if first release"
      - "Offering.total_funded_cents recomputed"
      - "Bubble-up: CapitalCall -> FULLY_FUNDED if all contributions RELEASED"

