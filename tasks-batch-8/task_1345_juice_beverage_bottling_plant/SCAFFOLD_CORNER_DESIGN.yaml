            - { call: "POST /v1/shipment-orders", payload: { customer_id: "${cust_id}", formula_id: "${form_id}", channel: "DIRECT_RETAIL", requested_delivery_date: "2026-08-01", units_requested: 100 }, as: CustomerServiceRep, captures: { ok_today: $.data.status } }
