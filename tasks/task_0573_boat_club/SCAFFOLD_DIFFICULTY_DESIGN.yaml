  - rule_id: boundary_precision_check
    instances:
      - name: bp_late_return_grace_15_vs_16
        grounds:
          - calculations.late_return_fee
          - state_machines.Reservation.CHECKED_OUT_to_RETURNED
        distinguishing_aspect: "On the return endpoint, a return exactly 15 minutes late (== LATE_GRACE_MIN) yields NO LATE_RETURN fee, while 16 minutes late (> grace) yields a 2500-cent LATE_RETURN fee; the metric is minutes-late on POST /reservations/{id}/return with strict '>' at 15."
        test_recipe:
          setup:
            - "A SAIL member completes two full non-overlapping trips on two boats; the first is returned at exactly 15 minutes late, the second at 16 minutes late. Fuel is kept above the floor so only the late-fee dimension is exercised."
          setup_api_calls:
            - { call: "POST /membership-tiers", payload: { tier_code: "SAIL", monthly_dues_cents: 25000, max_active_reservations: 2, reservations_per_week: 4, reciprocal_access_allowed: true, advance_booking_days_max: 14 }, as: ClubAdmin }
