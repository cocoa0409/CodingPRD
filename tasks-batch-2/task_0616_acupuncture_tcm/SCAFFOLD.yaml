# =============================================================================
# Acupuncture & Traditional Chinese Medicine Clinic — Scaffold (SCAFFOLD.yaml)
# §1.0–§1.7. Expert difficulty band.
# =============================================================================

scenario: |
  Acupuncture & Traditional Chinese Medicine Clinic: intake & TCM diagnosis
  (tongue/pulse), treatment plan & point prescription, package/series &
  membership, herbal-formula dispensing & inventory, insurance vs cash &
  superbill, recurring scheduling & room/table, cupping/moxa add-on,
  no-show/late.

domain_name: acupuncture-tcm
api_prefix: /

# =============================================================================
# Complexity profile (§0.1–§0.3)
# =============================================================================
complexity_profile:
  primary_archetype: ledger_reconciliation
  secondary_archetype: temporal_windowing
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers
    - derived_field_reconciliation

  entity_topology: flat            # peer entities linked by FK refs; URLs are flat collections, no nesting in paths
  state_machine_shape: parallel    # Appointment carries clinical_status × billing_status; plus cyclic plan
  relationship_patterns:
    - one_to_many
    - cross_aggregate
    - polymorphic
  role_model: peer_roles
  consistency_model: immediate

  entity_count: 13
  state_machine_count: 6        # incl. Appointment's two parallel dimensions (clinical × billing)
  calculation_count: 7
  validation_layers: 16
  endpoint_count: 51            # incl. flat GET list/single + reverse-reachability + test-driving clock
  error_code_count: 34
  role_count: 4

# =============================================================================
# §1.0 Response Envelope (FIXED — verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:

  # ---- Patient (root aggregate; entity_backed Patient role) ----
  - name: Patient
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID, no prefix; identity only." }
      - { name: full_name, type: string, source: input, description: "Patient legal name." }
      - { name: date_of_birth, type: string, source: input, description: "ISO date YYYY-MM-DD." }
      - { name: payer_mode, type: enum, source: input, default: "CASH", description: "Billing mode: CASH | INSURANCE." }
      - { name: insurance_member_id, type: string, source: input, description: "Insurer member id; required when payer_mode=INSURANCE, else null." }
      - { name: coinsurance_rate, type: number, source: input, default: 0.0, description: "Fraction (0..1) of charge the insurer covers; only meaningful when payer_mode=INSURANCE." }
      - { name: intake_status, type: enum, source: system, default: "PENDING_INTAKE", description: "PENDING_INTAKE | INTAKE_COMPLETE; becomes INTAKE_COMPLETE when an Intake is finalized." }
      - { name: membership_status, type: enum, source: system, default: "NONE", description: "NONE | ACTIVE | LAPSED; ACTIVE waives first-strike penalties (see no_show_penalty calc)." }
      - { name: strike_count, type: integer, source: system, default: 0, description: "Cumulative NO_SHOW + LATE_CANCEL strikes; never decremented except by reversal of the producing appointment." }
      - { name: created_at, type: datetime, source: system, description: "ISO8601 UTC, 3 fractional digits." }
      - { name: updated_at, type: datetime, source: system, description: "Refreshed on every mutation incl. cascades." }
      - { name: version, type: integer, source: system, default: 1, description: "OCC version; +1 on every mutation." }

  # ---- Intake / TCM diagnosis (child of Patient) ----
  - name: Intake
    parent: Patient
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "UUID." }
      - { name: patient_id, type: string, source: system, description: "FK -> Patient.id" }
      - { name: chief_complaint, type: string, source: input, description: "Presenting complaint text." }
      - { name: tongue_finding, type: enum, source: input, description: "PALE | RED | PURPLE | NORMAL." }
      - { name: tongue_coating, type: enum, source: input, description: "THIN_WHITE | THICK_YELLOW | NONE | GREASY." }
      - { name: pulse_finding, type: enum, source: input, description: "WIRY | SLIPPERY | THREADY | RAPID | DEEP | FLOATING." }
      - { name: tcm_pattern, type: enum, source: input, description: "Diagnosed pattern: QI_STAGNATION | BLOOD_DEFICIENCY | DAMP_HEAT | YANG_DEFICIENCY | YIN_DEFICIENCY." }
      - { name: status, type: enum, source: system, default: "DRAFT", description: "DRAFT | FINALIZED; finalizing flips Patient.intake_status to INTAKE_COMPLETE." }
      - { name: created_at, type: datetime, source: system, description: "ISO8601 UTC." }
      - { name: updated_at, type: datetime, source: system, description: "Refreshed on mutation." }
      - { name: version, type: integer, source: system, default: 1, description: "OCC version; +1 per mutation." }

  # ---- TreatmentPlan (point prescription; cyclic lifecycle) ----
  - name: TreatmentPlan
    parent: Patient
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "UUID." }
      - { name: patient_id, type: string, source: system, description: "FK -> Patient.id" }
      - { name: practitioner_id, type: string, source: input, description: "FK -> Practitioner.id; the prescribing acupuncturist." }
      - { name: intake_id, type: string, source: input, description: "FK -> Intake.id; the FINALIZED intake this plan derives from." }
      - { name: acupoints, type: array, source: input, description: "Array of point codes (e.g., LI4, ST36); point prescription." }
      - { name: planned_sessions, type: integer, source: input, description: "Intended number of treatment sessions; must be >= 1." }
      - { name: status, type: enum, source: system, default: "ACTIVE", description: "ACTIVE | ON_HOLD | COMPLETED | CANCELLED; ACTIVE<->ON_HOLD is a revision loop." }
      - { name: created_at, type: datetime, source: system, description: "ISO8601 UTC." }
      - { name: updated_at, type: datetime, source: system, description: "Refreshed on mutation incl. cascades." }
      - { name: version, type: integer, source: system, default: 1, description: "OCC version; +1 per mutation incl. cascades." }

  # ---- PackageSeries (credit bundle; provisional vs finalized balance) ----
  - name: PackageSeries
    parent: Patient
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "UUID." }
      - { name: patient_id, type: string, source: system, description: "FK -> Patient.id" }
      - { name: total_credits, type: integer, source: input, description: "Sessions purchased in this series; immutable after purchase; must be >= 1." }
      - { name: price_paid_cents, type: integer, source: input, description: "Amount paid for the series, in integer cents." }
      - { name: reserved_credits, type: integer, source: computed, default: 0, description: "Count of credits held by appointments in clinical_status SCHEDULED or CHECKED_IN booked from this series." }
      - { name: consumed_credits, type: integer, source: computed, default: 0, description: "Count of credits spent by appointments whose clinical_status reached COMPLETED from this series." }
      - { name: provisional_remaining_credits, type: integer, source: computed, default: 0, description: "= total_credits - reserved_credits - consumed_credits (forward-looking balance)." }
      - { name: finalized_remaining_credits, type: integer, source: computed, default: 0, description: "= total_credits - consumed_credits (chronological balance; ignores reservations)." }
      - { name: status, type: enum, source: system, default: "ACTIVE", description: "ACTIVE | EXHAUSTED | CANCELLED; EXHAUSTED when provisional_remaining_credits hits 0." }
      - { name: created_at, type: datetime, source: system, description: "ISO8601 UTC." }
      - { name: updated_at, type: datetime, source: system, description: "Refreshed on mutation incl. cascades." }
      - { name: version, type: integer, source: system, default: 1, description: "OCC version; +1 per mutation incl. cascades." }

  # ---- Practitioner (flat resource; entity_backed Practitioner role) ----
  - name: Practitioner
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "UUID; equals X-User-ID when acting as Practitioner." }
      - { name: full_name, type: string, source: input, description: "Practitioner name." }
      - { name: license_number, type: string, source: input, description: "State acupuncture license; unique." }
      - { name: turnover_buffer_minutes, type: integer, source: input, default: 0, description: "Minutes of mandatory gap this practitioner needs between back-to-back appointments." }
      - { name: created_at, type: datetime, source: system, description: "ISO8601 UTC." }
      - { name: updated_at, type: datetime, source: system, description: "Refreshed on mutation." }
      - { name: version, type: integer, source: system, default: 1, description: "OCC version; +1 per mutation." }

  # ---- TreatmentRoom (flat resource; room/table scheduling) ----
  - name: TreatmentRoom
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "UUID." }
      - { name: room_name, type: string, source: input, description: "Room/table label; unique." }
      - { name: cleanup_buffer_minutes, type: integer, source: input, default: 0, description: "Minutes of mandatory cleanup occupancy AFTER each appointment end before the room frees." }
      - { name: created_at, type: datetime, source: system, description: "ISO8601 UTC." }
      - { name: updated_at, type: datetime, source: system, description: "Refreshed on mutation." }
      - { name: version, type: integer, source: system, default: 1, description: "OCC version; +1 per mutation." }

  # ---- Appointment (parallel state machine: clinical × billing) ----
  - name: Appointment
    parent: Patient
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "UUID." }
      - { name: patient_id, type: string, source: system, description: "FK -> Patient.id" }
      - { name: treatment_plan_id, type: string, source: input, description: "FK -> TreatmentPlan.id; the ACTIVE plan this visit advances." }
      - { name: practitioner_id, type: string, source: input, description: "FK -> Practitioner.id" }
      - { name: room_id, type: string, source: input, description: "FK -> TreatmentRoom.id" }
      - { name: package_series_id, type: string, source: input, description: "FK -> PackageSeries.id; null when this visit is paid per-visit (charge_source=PER_VISIT)." }
      - { name: charge_source, type: enum, source: input, default: "PER_VISIT", description: "PER_VISIT | PACKAGE; PACKAGE consumes one credit instead of generating a Charge." }
      - { name: scheduled_start, type: datetime, source: input, description: "ISO8601 UTC start instant." }
      - { name: scheduled_end, type: datetime, source: input, description: "ISO8601 UTC end instant; must be > scheduled_start." }
      - { name: base_fee_cents, type: integer, source: input, description: "Per-visit base treatment fee in cents (used by billing when PER_VISIT)." }
      - { name: checked_in_at, type: datetime, source: system, description: "Logical-clock instant of check-in; null until check-in." }
      - { name: arrival_class, type: enum, source: computed, default: "PENDING", description: "PENDING | ON_TIME | LATE; LATE when (checked_in_at - scheduled_start) > GRACE_MINUTES (strict)." }
      - { name: clinical_status, type: enum, source: system, default: "SCHEDULED", description: "SCHEDULED | CHECKED_IN | COMPLETED | NO_SHOW | CANCELLED (clinical dimension)." }
      - { name: billing_status, type: enum, source: system, default: "UNBILLED", description: "UNBILLED | BILLED | WAIVED | PENALTY_DUE (billing dimension, evolves independently of clinical_status)." }
      - { name: created_at, type: datetime, source: system, description: "ISO8601 UTC." }
      - { name: updated_at, type: datetime, source: system, description: "Refreshed on mutation incl. cascades." }
      - { name: version, type: integer, source: system, default: 1, description: "OCC version; +1 per mutation incl. cascades." }

  # ---- AddOn (cupping/moxa add-on; child of Appointment) ----
  - name: AddOn
    parent: Appointment
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "UUID." }
      - { name: appointment_id, type: string, source: system, description: "FK -> Appointment.id" }
      - { name: modality, type: enum, source: input, description: "CUPPING | MOXA." }
      - { name: fee_cents, type: integer, source: input, description: "Add-on charge in cents; included in cash/insurance line totals." }
      - { name: status, type: enum, source: system, default: "ATTACHED", description: "ATTACHED | VOIDED; VOIDED when the parent appointment is CANCELLED/NO_SHOW." }
      - { name: created_at, type: datetime, source: system, description: "ISO8601 UTC." }
      - { name: updated_at, type: datetime, source: system, description: "Refreshed on mutation incl. cascades." }
      - { name: version, type: integer, source: system, default: 1, description: "OCC version; +1 per mutation incl. cascades." }

  # ---- HerbalFormula (configuration; recipe of herbs) ----
  - name: HerbalFormula
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "UUID." }
      - { name: formula_name, type: string, source: input, description: "Canonical formula name (e.g., Xiao Yao San); unique." }
      - { name: line_items, type: array, source: input, description: "Array of {herb_item_id, grams_per_dose}; the recipe. grams_per_dose integer >= 1." }
      - { name: created_at, type: datetime, source: system, description: "ISO8601 UTC." }
      - { name: updated_at, type: datetime, source: system, description: "Refreshed on mutation." }
      - { name: version, type: integer, source: system, default: 1, description: "OCC version; +1 per mutation." }

  # ---- HerbItem (inventory; conserved mass) ----
  - name: HerbItem
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "UUID." }
      - { name: herb_name, type: string, source: input, description: "Herb name (e.g., Bai Shao); unique." }
      - { name: initial_grams, type: integer, source: input, description: "Grams stocked at creation; immutable baseline for the conservation invariant." }
      - { name: on_hand_grams, type: integer, source: computed, default: 0, description: "Current grams; = initial_grams - sum(dispensed grams of FILLED dispenses)." }
      - { name: reorder_threshold_grams, type: integer, source: input, default: 0, description: "When on_hand_grams <= this, stock_status becomes LOW_STOCK." }
      - { name: stock_status, type: enum, source: system, default: "IN_STOCK", description: "IN_STOCK | LOW_STOCK; LOW_STOCK when on_hand_grams <= reorder_threshold_grams." }
      - { name: created_at, type: datetime, source: system, description: "ISO8601 UTC." }
      - { name: updated_at, type: datetime, source: system, description: "Refreshed on mutation incl. cascades." }
      - { name: version, type: integer, source: system, default: 1, description: "OCC version; +1 per mutation incl. cascades." }

  # ---- FormulaDispense (dispensing event; decrements inventory) ----
  - name: FormulaDispense
    parent: Patient
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "UUID." }
      - { name: patient_id, type: string, source: system, description: "FK -> Patient.id" }
      - { name: treatment_plan_id, type: string, source: input, description: "FK -> TreatmentPlan.id; the ACTIVE plan authorizing this dispense." }
      - { name: herbal_formula_id, type: string, source: input, description: "FK -> HerbalFormula.id" }
      - { name: doses, type: integer, source: input, description: "Number of doses to dispense; must be >= 1." }
      - { name: total_grams_by_herb, type: object, source: computed, description: "Map herb_item_id -> grams deducted = grams_per_dose * doses; snapshot at FILL." }
      - { name: status, type: enum, source: system, default: "REQUESTED", description: "REQUESTED | FILLED | REVERSED; FILL decrements inventory, REVERSE restores it." }
      - { name: created_at, type: datetime, source: system, description: "ISO8601 UTC." }
      - { name: updated_at, type: datetime, source: system, description: "Refreshed on mutation incl. cascades." }
      - { name: version, type: integer, source: system, default: 1, description: "OCC version; +1 per mutation incl. cascades." }

  # ---- Charge (cash billing ledger; per-visit) ----
  - name: Charge
    parent: Appointment
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "UUID." }
      - { name: appointment_id, type: string, source: system, description: "FK -> Appointment.id" }
      - { name: subtotal_cents, type: integer, source: computed, description: "base_fee_cents + sum(ATTACHED AddOn.fee_cents)." }
      - { name: cash_discount_cents, type: integer, source: computed, default: 0, description: "round_half_up(subtotal_cents * CASH_DISCOUNT_PCT) when patient.payer_mode=CASH, else 0." }
      - { name: total_due_cents, type: integer, source: computed, description: "Patient responsibility (cash: subtotal - discount; insurance: subtotal - insurance_allowed_cents)." }
      - { name: charge_type, type: enum, source: system, default: "VISIT", description: "VISIT | PENALTY; PENALTY charges carry no_show/late fee." }
      - { name: status, type: enum, source: system, default: "OPEN", description: "OPEN | VOID; VOID on appointment cancellation reversal." }
      - { name: created_at, type: datetime, source: system, description: "ISO8601 UTC." }
      - { name: updated_at, type: datetime, source: system, description: "Refreshed on mutation incl. cascades." }
      - { name: version, type: integer, source: system, default: 1, description: "OCC version; +1 per mutation incl. cascades." }

  # ---- Superbill (insurance reconciliation; per-line allowed amounts) ----
  - name: Superbill
    parent: Appointment
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "UUID." }
      - { name: appointment_id, type: string, source: system, description: "FK -> Appointment.id" }
      - { name: line_charges_cents, type: array, source: computed, description: "Ordered cents charges: [base_fee_cents, then each ATTACHED AddOn.fee_cents in created_at ASC order]." }
      - { name: insurance_allowed_cents, type: integer, source: computed, description: "Sum over lines of round_half_up(line * patient.coinsurance_rate) — ROUND PER LINE THEN SUM." }
      - { name: patient_responsibility_cents, type: integer, source: computed, description: "sum(line_charges_cents) - insurance_allowed_cents." }
      - { name: status, type: enum, source: system, default: "ISSUED", description: "ISSUED | VOID; VOID on appointment cancellation reversal." }
      - { name: created_at, type: datetime, source: system, description: "ISO8601 UTC." }
      - { name: updated_at, type: datetime, source: system, description: "Refreshed on mutation incl. cascades." }
      - { name: version, type: integer, source: system, default: 1, description: "OCC version; +1 per mutation incl. cascades." }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:

  # ---- Patient.intake_status (linear gate) ----
  - entity: Patient
    field: intake_status
    initial_state: PENDING_INTAKE
    terminal_states: []
    transitions:
      - from: PENDING_INTAKE
        to: INTAKE_COMPLETE
        trigger: "POST /intakes/{intakeId}/finalize"
        actor: Practitioner
        preconditions:
          - "Intake.status == DRAFT (ERR_INTAKE_NOT_DRAFT)"
          - "tcm_pattern, tongue_finding, pulse_finding all non-null (ERR_INTAKE_INCOMPLETE)"
        side_effects:
          - "Intake.status -> FINALIZED"
          - "Patient.intake_status -> INTAKE_COMPLETE"
          - "increments Patient.version by 1"

  # ---- TreatmentPlan (CYCLIC: ACTIVE<->ON_HOLD) ----
  - entity: TreatmentPlan
    field: status
    initial_state: ACTIVE
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - from: ACTIVE
        to: ON_HOLD
        trigger: "POST /treatment-plans/{planId}/hold"
        actor: Practitioner
        preconditions:
          - "Plan.status == ACTIVE (ERR_PLAN_NOT_ACTIVE)"
        side_effects:
          - "increments TreatmentPlan.version by 1"
        note: "Revision loop: a held plan may be reactivated; no appointments/dispenses may be created while ON_HOLD."
      - from: ON_HOLD
        to: ACTIVE
        trigger: "POST /treatment-plans/{planId}/resume"
        actor: Practitioner
        preconditions:
          - "Plan.status == ON_HOLD (ERR_PLAN_NOT_ON_HOLD)"
        side_effects:
          - "increments TreatmentPlan.version by 1"
      - from: ACTIVE
        to: COMPLETED
        trigger: "POST /treatment-plans/{planId}/complete"
        actor: Practitioner
        preconditions:
          - "Plan.status == ACTIVE (ERR_PLAN_NOT_ACTIVE)"
          - "No Appointment of this plan in clinical_status SCHEDULED or CHECKED_IN (ERR_PLAN_HAS_OPEN_APPOINTMENTS)"
        side_effects:
          - "increments TreatmentPlan.version by 1"
      - from: [ACTIVE, ON_HOLD]
        to: CANCELLED
        trigger: "POST /treatment-plans/{planId}/cancel"
        actor: Practitioner
        preconditions:
          - "Plan.status IN {ACTIVE, ON_HOLD} (ERR_PLAN_NOT_CANCELLABLE)"
          - "expected_treatment_plan_version matches current (ERR_STALE_VERSION)"
        side_effects:
          - "CASCADE: every Appointment of this plan with clinical_status IN {SCHEDULED, CHECKED_IN} -> CANCELLED (system cancel path; fires that appointment's own cancel side-effects)"
          - "increments TreatmentPlan.version by 1"
        note: "Cancel cascade originates the depth>=3 chain documented on Appointment SCHEDULED->CANCELLED."

  # ---- PackageSeries (credit lifecycle) ----
  - entity: PackageSeries
    field: status
    initial_state: ACTIVE
    terminal_states: [CANCELLED]
    transitions:
      - from: ACTIVE
        to: EXHAUSTED
        trigger: "system (provisional_remaining_credits reaches 0 after an appointment is booked from this series)"
        actor: system
        preconditions:
          - "provisional_remaining_credits == 0 after the booking debit"
        side_effects:
          - "increments PackageSeries.version by 1"
      - from: EXHAUSTED
        to: ACTIVE
        trigger: "system (provisional_remaining_credits rises above 0 after a reservation is released)"
        actor: system
        preconditions:
          - "provisional_remaining_credits > 0 after a reservation release"
        side_effects:
          - "increments PackageSeries.version by 1"
      - from: [ACTIVE, EXHAUSTED]
        to: CANCELLED
        trigger: "POST /package-series/{seriesId}/cancel"
        actor: ClinicAdmin
        preconditions:
          - "consumed_credits == 0 (ERR_PACKAGE_HAS_CONSUMED_CREDITS)"
          - "reserved_credits == 0 (ERR_PACKAGE_HAS_RESERVED_CREDITS)"
        side_effects:
          - "increments PackageSeries.version by 1"

  # ---- Appointment.clinical_status (branching with NO_SHOW/CANCELLED) ----
  - entity: Appointment
    field: clinical_status
    initial_state: SCHEDULED
    terminal_states: [COMPLETED, NO_SHOW, CANCELLED]
    transitions:
      - from: SCHEDULED
        to: CHECKED_IN
        trigger: "POST /appointments/{apptId}/check-in"
        actor: ClinicAdmin
        preconditions:
          - "clinical_status == SCHEDULED (ERR_APPT_NOT_SCHEDULED)"
          - "TreatmentPlan.status == ACTIVE (ERR_PLAN_NOT_ACTIVE)"
        side_effects:
          - "Sets checked_in_at = logical clock now"
          - "Computes arrival_class (ON_TIME or LATE) per arrival_class calc"
          - "increments Appointment.version by 1"
      - from: CHECKED_IN
        to: COMPLETED
        trigger: "POST /appointments/{apptId}/complete"
        actor: Practitioner
        preconditions:
          - "clinical_status == CHECKED_IN (ERR_APPT_NOT_CHECKED_IN)"
        side_effects:
          - "If charge_source == PACKAGE: PackageSeries reserved_credits -= 1, consumed_credits += 1, balances recomputed (net provisional unchanged; finalized -1); EXHAUSTED auto-transition re-evaluated"
          - "If charge_source == PER_VISIT: a Charge (charge_type=VISIT) is created via the visit_charge calc; or a Superbill if patient.payer_mode == INSURANCE"
          - "billing_status -> BILLED"
          - "increments Appointment.version by 1"
      - from: SCHEDULED
        to: NO_SHOW
        trigger: "POST /appointments/{apptId}/no-show"
        actor: ClinicAdmin
        preconditions:
          - "clinical_status == SCHEDULED (ERR_APPT_NOT_SCHEDULED)"
        side_effects:
          - "Patient.strike_count += 1 (this appointment recorded as the producing strike); Patient.version += 1"
          - "no_show_penalty calc evaluated; if penalty > 0 a Charge (charge_type=PENALTY) created and billing_status -> PENALTY_DUE; if penalty == 0 billing_status -> WAIVED"
          - "If charge_source == PACKAGE: reserved_credits -= 1 (reservation released, credit NOT consumed); provisional_remaining_credits += 1; EXHAUSTED->ACTIVE re-evaluated"
          - "All ATTACHED AddOns -> VOIDED"
          - "increments Appointment.version by 1"
        note: "Compensating action for booking: reservation released so package credits are conserved."
      - from: [SCHEDULED, CHECKED_IN]
        to: CANCELLED
        trigger: "POST /appointments/{apptId}/cancel  OR  system cascade from TreatmentPlan cancel"
        actor: ClinicAdmin
        preconditions:
          - "clinical_status IN {SCHEDULED, CHECKED_IN} (ERR_APPT_NOT_CANCELLABLE)"
        side_effects:
          - "HOP-1: this Appointment -> CANCELLED; all ATTACHED AddOns -> VOIDED; any OPEN Charge/ISSUED Superbill for this appointment -> VOID"
          - "HOP-2 (cross-entity, caused by HOP-1): if charge_source == PACKAGE the held credit is released — PackageSeries.reserved_credits -= 1; provisional_remaining_credits recomputed; PackageSeries.version += 1"
          - "HOP-3 (caused by HOP-2): if that release lifts provisional_remaining_credits above 0 while PackageSeries.status == EXHAUSTED, PackageSeries auto-transitions EXHAUSTED -> ACTIVE (further version bump)"
          - "If cancelled within LATE_CANCEL_CUTOFF of scheduled_start: Patient.strike_count += 1 and no_show_penalty (late variant) may create a PENALTY Charge; else no strike"
          - "increments Appointment.version by 1"
        note: "Depth>=3 transitive cascade: appt cancel (HOP-1) -> package credit release (HOP-2) -> package EXHAUSTED->ACTIVE (HOP-3)."

  # ---- Appointment.billing_status (parallel dimension — evolves independently) ----
  - entity: Appointment
    field: billing_status
    initial_state: UNBILLED
    terminal_states: []
    transitions:
      - from: UNBILLED
        to: BILLED
        trigger: "system (appointment completed; Charge or Superbill produced)"
        actor: system
        preconditions:
          - "clinical_status transitioned to COMPLETED"
        side_effects:
          - "increments Appointment.version by 1"
      - from: UNBILLED
        to: PENALTY_DUE
        trigger: "system (no-show / late-cancel with penalty > 0)"
        actor: system
        preconditions:
          - "no_show_penalty > 0"
        side_effects:
          - "PENALTY Charge created"
          - "increments Appointment.version by 1"
      - from: UNBILLED
        to: WAIVED
        trigger: "system (no-show / late-cancel with penalty == 0, e.g. ACTIVE membership first strike)"
        actor: system
        preconditions:
          - "no_show_penalty == 0"
        side_effects:
          - "increments Appointment.version by 1"
      - from: [BILLED, PENALTY_DUE]
        to: WAIVED
        trigger: "system (appointment cancellation reversal voids the produced Charge/Superbill)"
        actor: system
        preconditions:
          - "Appointment.clinical_status transitioned to CANCELLED after billing"
        side_effects:
          - "increments Appointment.version by 1"

  # ---- FormulaDispense (inventory lifecycle) ----
  - entity: FormulaDispense
    field: status
    initial_state: REQUESTED
    terminal_states: [REVERSED]
    transitions:
      - from: REQUESTED
        to: FILLED
        trigger: "POST /dispenses/{dispenseId}/fill"
        actor: Pharmacist
        preconditions:
          - "status == REQUESTED (ERR_DISPENSE_NOT_REQUESTED)"
          - "TreatmentPlan.status == ACTIVE (ERR_PLAN_NOT_ACTIVE)"
          - "For every recipe line, HerbItem.on_hand_grams >= grams_per_dose * doses (ERR_INSUFFICIENT_STOCK)"
        side_effects:
          - "HOP-1: snapshot total_grams_by_herb = {herb_item_id: grams_per_dose * doses}"
          - "HOP-2 (caused by HOP-1): each referenced HerbItem.on_hand_grams -= deducted grams; HerbItem.version += 1"
          - "HOP-3 (caused by HOP-2): any HerbItem whose on_hand_grams <= reorder_threshold_grams auto-transitions stock_status IN_STOCK -> LOW_STOCK (further version bump)"
          - "increments FormulaDispense.version by 1"
        note: "Depth>=3 transitive cascade originating from a different trigger than the plan-cancel chain: fill (HOP-1) -> inventory debit (HOP-2) -> LOW_STOCK auto-flag (HOP-3)."
      - from: FILLED
        to: REVERSED
        trigger: "POST /dispenses/{dispenseId}/reverse"
        actor: Pharmacist
        preconditions:
          - "status == FILLED (ERR_DISPENSE_NOT_FILLED)"
          - "expected_formula_dispense_version matches current (ERR_STALE_VERSION)"
        side_effects:
          - "Each referenced HerbItem.on_hand_grams += the grams recorded in total_grams_by_herb (compensating restore); HerbItem.version += 1"
          - "Any HerbItem whose on_hand_grams rises above reorder_threshold_grams auto-transitions LOW_STOCK -> IN_STOCK"
          - "increments FormulaDispense.version by 1"
        note: "Compensating action: inventory mass conserved across fill+reverse."

# -----------------------------------------------------------------------------
# §1.2.1 Concurrency Rules (OCC on parent.version — true CREATE-with-supersede races only)
# -----------------------------------------------------------------------------
concurrency_rules:
  - rule_id: book-appointment-stale-plan
    parent_entity: TreatmentPlan
    write_endpoint: "POST /appointments"
    occ_field: "expected_treatment_plan_version"
    description: |
      Booking an Appointment against a TreatmentPlan whose version has advanced
      since the client last observed it is rejected. A held/cancelled plan (or a
      plan whose latest booking already advanced its version) leaves the current
      writer's view stale; the new booking would legitimately attach to the plan
      under the natural semantics, so the conflict is resolved by stale-version
      check rather than a state precondition.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: dispense-create-stale-plan
    parent_entity: TreatmentPlan
    write_endpoint: "POST /dispenses"
    occ_field: "expected_treatment_plan_version"
    description: |
      Creating a FormulaDispense against a TreatmentPlan whose version advanced
      since the client read it is rejected. The dispense would legitimately
      attach to the plan, but the client's plan view is stale (e.g., another
      dispense or a hold/resume bumped the plan version), so OCC rejects it.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:

  # ---- (Rule 1a) Visit charge — DUAL VARIANT on Appointment/Charge domain (cash vs insurance) ----
  - name: visit_charge
    trigger: "Appointment CHECKED_IN -> COMPLETED, when charge_source == PER_VISIT"
    algorithm: dual_variant
    formula: |
      subtotal_cents = base_fee_cents + sum(fee_cents for AddOn in this appointment with status == ATTACHED)
      # Variant CASH (patient.payer_mode == CASH) -> produce Charge:
      cash_discount_cents = round_half_up(subtotal_cents * CASH_DISCOUNT_PCT)
      total_due_cents = subtotal_cents - cash_discount_cents
      # Variant INSURANCE (patient.payer_mode == INSURANCE) -> produce Superbill:
      # see superbill_reconciliation for the per-line allowed amount.
    input_set: "AddOns of the appointment with status == ATTACHED only; VOIDED add-ons excluded."
    constants:
      CASH_DISCOUNT_PCT: 0.10
    precision: "integer cents, round_half_up"
    variants:
      - name: cash
        when: "patient.payer_mode == CASH"
        difference: "Applies CASH_DISCOUNT_PCT to the full subtotal; produces a Charge with total_due_cents = subtotal - discount."
      - name: insurance
        when: "patient.payer_mode == INSURANCE"
        difference: "No cash discount; produces a Superbill whose patient_responsibility_cents = subtotal - per-line-rounded insurance_allowed; see superbill_reconciliation."

  # ---- (Rule 2b) Superbill reconciliation — ROUNDING ORDER PINNED (round per line then sum) ----
  - name: superbill_reconciliation
    trigger: "Appointment CHECKED_IN -> COMPLETED, when charge_source == PER_VISIT AND patient.payer_mode == INSURANCE"
    algorithm: aggregation
    formula: |
      line_charges_cents = [base_fee_cents] + [addon.fee_cents for AddOn ATTACHED, ordered by created_at ASC]
      # PINNED ORDER: round EACH line, THEN sum. (Round-per-line-then-sum, NOT sum-then-round.)
      insurance_allowed_cents = sum( round_half_up(line * patient.coinsurance_rate) for line in line_charges_cents )
      patient_responsibility_cents = sum(line_charges_cents) - insurance_allowed_cents
    input_set: "ATTACHED add-ons only; line order base_fee first then add-ons in created_at ASC."
    constants: {}
    precision: "integer cents, round_half_up per line BEFORE summation"

  # ---- (Rule 1b) Package credit balance — DUAL VARIANT on PackageSeries domain (provisional vs finalized) ----
  - name: package_credit_balance
    trigger: "Any change to an Appointment booked from a PackageSeries (book, complete, no-show, cancel)"
    algorithm: dual_variant
    formula: |
      reserved_credits  = count(Appointment with package_series_id == series.id AND clinical_status IN {SCHEDULED, CHECKED_IN})
      consumed_credits  = count(Appointment with package_series_id == series.id AND clinical_status == COMPLETED)
      provisional_remaining_credits = total_credits - reserved_credits - consumed_credits
      finalized_remaining_credits   = total_credits - consumed_credits
    input_set: "Appointments of the series filtered by clinical_status; CANCELLED/NO_SHOW appointments excluded from both reserved and consumed."
    constants: {}
    precision: "integer counts"
    variants:
      - name: provisional
        when: "Used to gate new bookings and EXHAUSTED transition (forward-looking; subtracts reservations)."
        difference: "Subtracts BOTH reserved and consumed; a SCHEDULED appointment already lowers it."
      - name: finalized
        when: "Used for billing/refund reconciliation (chronological; only realized completions count)."
        difference: "Subtracts ONLY consumed; a SCHEDULED appointment does not lower it."

  # ---- (Rule 2a) No-show / late-cancel penalty — combinatorial, >=3 inputs, nonlinear ----
  - name: no_show_penalty
    trigger: "Appointment SCHEDULED -> NO_SHOW, or Appointment -> CANCELLED within LATE_CANCEL_CUTOFF of scheduled_start"
    algorithm: threshold
    formula: |
      # prior_strikes = Patient.strike_count BEFORE this appointment's strike is recorded.
      if patient.membership_status == ACTIVE and prior_strikes == 0:
          penalty_cents = 0          # first-strike waiver for active members
      else:
          tier_base = NO_SHOW_BASE_CENTS if (transition == NO_SHOW) else LATE_CANCEL_BASE_CENTS
          strike_mult = 1 + min(prior_strikes, STRIKE_CAP) * STRIKE_STEP
          penalty_cents = round_half_up(tier_base * strike_mult)
    input_set: "Inputs: transition type (NO_SHOW vs LATE_CANCEL), prior_strikes, membership_status. Three interacting inputs with nonlinear branch + capped multiplier."
    constants:
      NO_SHOW_BASE_CENTS: 5000
      LATE_CANCEL_BASE_CENTS: 2500
      STRIKE_STEP: 0.5
      STRIKE_CAP: 3
    precision: "integer cents, round_half_up"

  # ---- arrival_class — boundary precision (> strict) ----
  - name: arrival_class
    trigger: "Appointment SCHEDULED -> CHECKED_IN (check-in)"
    algorithm: threshold
    formula: |
      delta_seconds = (checked_in_at - scheduled_start) in seconds   # negative if early
      if delta_seconds > GRACE_MINUTES * 60:
          arrival_class = LATE
      else:
          arrival_class = ON_TIME
    input_set: "Single appointment; uses logical clock at check-in."
    constants:
      GRACE_MINUTES: 10
    precision: "integer seconds; strictly greater-than at boundary (delta == 600 -> ON_TIME)"

  # ---- inventory_deduction — on_hand recompute + LOW_STOCK threshold ----
  - name: inventory_deduction
    trigger: "FormulaDispense REQUESTED -> FILLED (debit) and FILLED -> REVERSED (restore)"
    algorithm: aggregation
    formula: |
      For each recipe line of the formula:
        deducted = grams_per_dose * doses
      on_hand_grams = initial_grams - sum(deducted grams across all FILLED dispenses that reference this herb)
      stock_status = LOW_STOCK if on_hand_grams <= reorder_threshold_grams else IN_STOCK
    input_set: "FILLED dispenses only; REVERSED dispenses excluded (their grams restored)."
    constants: {}
    precision: "integer grams; LOW_STOCK boundary is <= (on_hand == threshold -> LOW_STOCK)"

  # ---- room_practitioner_availability — temporal overlap (two interval semantics) ----
  - name: room_practitioner_availability
    trigger: "POST /appointments (booking)"
    algorithm: interval_merge
    formula: |
      Treat each non-terminal appointment (clinical_status IN {SCHEDULED, CHECKED_IN}) as a half-open
      interval [scheduled_start, scheduled_end).
      ROOM check (with cleanup buffer AFTER each appointment):
        room interval for an existing appt = [start, end + room.cleanup_buffer_minutes*60)
        reject new booking if [new_start, new_end) intersects any existing room interval on the same room_id.
      PRACTITIONER check (with symmetric turnover buffer, NO cleanup occupancy):
        two appts on the same practitioner_id conflict if the gap between them is strictly less than
        practitioner.turnover_buffer_minutes*60, i.e. reject if
        new_start < existing_end + buffer AND existing_start < new_end + buffer.
    input_set: "Existing appointments with clinical_status IN {SCHEDULED, CHECKED_IN} on the same room_id / practitioner_id."
    constants: {}
    precision: "integer seconds; half-open intervals; adjacency with zero buffer does NOT conflict"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers present and well-formed"
    error_id: ERR_MISSING_AUTH
    http_status: 401
    applies_to: all

  - priority: 2
    category: auth
    check: "Role permitted for this operation per §1.7"
    error_id: ERR_FORBIDDEN_ROLE
    http_status: 403
    applies_to: all

  - priority: 3
    category: auth
    check: "For entity_backed roles acting on a resource they must own (Patient on own resources; Practitioner == treatment_plan.practitioner_id), X-User-ID must match the owning entity id"
    error_id: ERR_OWNERSHIP_MISMATCH
    http_status: 403
    applies_to: "Patient self-service endpoints; Practitioner plan/intake/appointment-complete endpoints"

  - priority: 4
    category: existence
    check: "Path resource ids exist, validated left-to-right (patientId, then nested id)"
    error_id: "ERR_PATIENT_NOT_FOUND / ERR_INTAKE_NOT_FOUND / ERR_PLAN_NOT_FOUND / ERR_PACKAGE_NOT_FOUND / ERR_APPT_NOT_FOUND / ERR_DISPENSE_NOT_FOUND / ERR_PRACTITIONER_NOT_FOUND / ERR_ROOM_NOT_FOUND / ERR_FORMULA_NOT_FOUND / ERR_HERB_NOT_FOUND"
    http_status: 404
    applies_to: all path-parameterized endpoints

  - priority: 5
    category: existence
    check: "Foreign keys in request body reference existing entities"
    error_id: "ERR_PRACTITIONER_NOT_FOUND / ERR_ROOM_NOT_FOUND / ERR_PLAN_NOT_FOUND / ERR_PACKAGE_NOT_FOUND / ERR_INTAKE_NOT_FOUND / ERR_FORMULA_NOT_FOUND"
    http_status: 404
    applies_to: "POST appointments, treatment-plans, dispenses"

  - priority: 6
    category: business_constraint
    check: "Request body well-formed: required fields present, enums valid, scheduled_end > scheduled_start, numeric fields >= their minimums, coinsurance_rate in [0,1]"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: all write endpoints

  - priority: 7
    category: state
    check: "Target resource in correct state for the requested transition"
    error_id: "ERR_APPT_NOT_SCHEDULED / ERR_APPT_NOT_CHECKED_IN / ERR_APPT_NOT_CANCELLABLE / ERR_PLAN_NOT_ACTIVE / ERR_PLAN_NOT_ON_HOLD / ERR_PLAN_NOT_CANCELLABLE / ERR_INTAKE_NOT_DRAFT / ERR_DISPENSE_NOT_REQUESTED / ERR_DISPENSE_NOT_FILLED"
    http_status: 409
    applies_to: all transition endpoints

  - priority: 8
    category: business_referential
    check: "Booking/dispense requires the referenced TreatmentPlan.status == ACTIVE (cross-entity: Appointment->TreatmentPlan, FormulaDispense->TreatmentPlan)"
    error_id: ERR_PLAN_NOT_ACTIVE
    http_status: 409
    applies_to: "POST appointments, POST dispenses"

  - priority: 9
    category: business_referential
    check: "Booking an Appointment requires Patient.intake_status == INTAKE_COMPLETE (cross-entity: Appointment->Patient)"
    error_id: ERR_INTAKE_REQUIRED
    http_status: 409
    applies_to: "POST appointments"

  - priority: 10
    category: business_referential
    check: "A TreatmentPlan may only be created from an Intake whose status == FINALIZED and which belongs to the same patient"
    error_id: ERR_INTAKE_NOT_FINALIZED
    http_status: 409
    applies_to: "POST treatment-plans"

  - priority: 11
    category: business_safety
    check: "FormulaDispense fill requires every recipe line's HerbItem.on_hand_grams >= grams_per_dose*doses (inventory safety before financial steps)"
    error_id: ERR_INSUFFICIENT_STOCK
    http_status: 409
    applies_to: "POST dispenses/{id}/fill"

  - priority: 12
    category: business_temporal
    check: "Room temporal overlap: new appointment's [start,end) must not intersect any existing SCHEDULED/CHECKED_IN appointment's [start, end + room.cleanup_buffer) on the same room_id"
    error_id: ERR_ROOM_CONFLICT
    http_status: 409
    applies_to: "POST appointments"

  - priority: 13
    category: business_temporal
    check: "Practitioner temporal overlap: same practitioner_id may not have two appointments whose gap is strictly less than turnover_buffer (symmetric buffer, no cleanup occupancy)"
    error_id: ERR_PRACTITIONER_CONFLICT
    http_status: 409
    applies_to: "POST appointments"

  - priority: 14
    category: business_fiscal
    check: "Booking from a PackageSeries requires provisional_remaining_credits >= 1 (and series.status != CANCELLED)"
    error_id: ERR_NO_CREDITS_REMAINING
    http_status: 409
    applies_to: "POST appointments (charge_source == PACKAGE)"

  - priority: 15
    category: business_constraint
    check: "OCC: expected_<parent>_version must equal current parent.version for guarded writes"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST appointments, POST dispenses, plan cancel, dispense reverse"

  - priority: 16
    category: business_constraint
    check: "PackageSeries cancel requires consumed_credits == 0 and reserved_credits == 0"
    error_id: "ERR_PACKAGE_HAS_CONSUMED_CREDITS / ERR_PACKAGE_HAS_RESERVED_CREDITS"
    http_status: 409
    applies_to: "POST package-series/{id}/cancel"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:

  # ---- test-driving: logical clock ----
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the server logical clock. Startup default is 2026-01-01T00:00:00Z; before any call the clock reads exactly this default and never falls back to wall-clock time."
    roles: [ClinicAdmin]
    code: 200
    input: [to_iso8601]
    output: "{ current_utc: string }"
    side_effects: ["Logical clock advanced to to_iso8601"]

  # ---- Practitioner ----
  - method: POST
    path: "/practitioners"
    description: "Create a practitioner"
    roles: [ClinicAdmin]
    code: 201
    input: [full_name, license_number, "turnover_buffer_minutes?"]
    output: Practitioner
    side_effects: ["version=1"]

  - method: GET
    path: "/practitioners"
    description: "List practitioners"
    roles: [ClinicAdmin, Practitioner, Pharmacist]
    code: 200
    input: ["limit?", "offset?"]
    output: "Practitioner[]"
    side_effects: []

  - method: GET
    path: "/practitioners/{id}"
    description: "Get a practitioner"
    roles: [ClinicAdmin, Practitioner, Pharmacist]
    code: 200
    input: []
    output: Practitioner
    side_effects: []

  # ---- TreatmentRoom ----
  - method: POST
    path: "/rooms"
    description: "Create a treatment room/table"
    roles: [ClinicAdmin]
    code: 201
    input: [room_name, "cleanup_buffer_minutes?"]
    output: TreatmentRoom
    side_effects: ["version=1"]

  - method: GET
    path: "/rooms"
    description: "List rooms"
    roles: [ClinicAdmin, Practitioner]
    code: 200
    input: ["limit?", "offset?"]
    output: "TreatmentRoom[]"
    side_effects: []

  - method: GET
    path: "/rooms/{id}"
    description: "Get a room"
    roles: [ClinicAdmin, Practitioner]
    code: 200
    input: []
    output: TreatmentRoom
    side_effects: []

  # ---- HerbItem (inventory) ----
  - method: POST
    path: "/herb-items"
    description: "Create an inventory herb item"
    roles: [Pharmacist]
    code: 201
    input: [herb_name, initial_grams, "reorder_threshold_grams?"]
    output: HerbItem
    side_effects: ["on_hand_grams = initial_grams; stock_status computed; version=1"]

  - method: GET
    path: "/herb-items"
    description: "List herb items"
    roles: [Pharmacist, Practitioner, ClinicAdmin]
    code: 200
    input: ["limit?", "offset?"]
    output: "HerbItem[]"
    side_effects: []

  - method: GET
    path: "/herb-items/{id}"
    description: "Get a herb item"
    roles: [Pharmacist, Practitioner, ClinicAdmin]
    code: 200
    input: []
    output: HerbItem
    side_effects: []

  # ---- HerbalFormula ----
  - method: POST
    path: "/formulas"
    description: "Create a herbal formula recipe"
    roles: [Pharmacist, Practitioner]
    code: 201
    input: [formula_name, line_items]
    output: HerbalFormula
    side_effects: ["version=1"]

  - method: GET
    path: "/formulas"
    description: "List formulas"
    roles: [Pharmacist, Practitioner, ClinicAdmin]
    code: 200
    input: ["limit?", "offset?"]
    output: "HerbalFormula[]"
    side_effects: []

  - method: GET
    path: "/formulas/{id}"
    description: "Get a formula"
    roles: [Pharmacist, Practitioner, ClinicAdmin]
    code: 200
    input: []
    output: HerbalFormula
    side_effects: []

  # ---- Patient ----
  - method: POST
    path: "/patients"
    description: "Register a patient"
    roles: [ClinicAdmin]
    code: 201
    input: [full_name, date_of_birth, "payer_mode?", "insurance_member_id?", "coinsurance_rate?"]
    output: Patient
    side_effects: ["intake_status=PENDING_INTAKE, membership_status=NONE, strike_count=0, version=1"]

  - method: GET
    path: "/patients"
    description: "List patients"
    roles: [ClinicAdmin, Practitioner]
    code: 200
    input: ["limit?", "offset?"]
    output: "Patient[]"
    side_effects: []

  - method: GET
    path: "/patients/{id}"
    description: "Get a patient"
    roles: [ClinicAdmin, Practitioner, Patient]
    code: 200
    input: []
    output: Patient
    side_effects: []

  - method: POST
    path: "/patients/{id}/membership"
    description: "Set patient membership status (enroll/lapse)"
    roles: [ClinicAdmin]
    code: 200
    input: [membership_status]
    output: Patient
    side_effects: ["Patient.membership_status updated; version+1"]

  # ---- Intake (flat; patient_id in body / filter) ----
  - method: POST
    path: "/intakes"
    description: "Create a TCM intake (DRAFT)"
    roles: [Practitioner]
    code: 201
    input: [patient_id, chief_complaint, tongue_finding, tongue_coating, pulse_finding, tcm_pattern]
    output: Intake
