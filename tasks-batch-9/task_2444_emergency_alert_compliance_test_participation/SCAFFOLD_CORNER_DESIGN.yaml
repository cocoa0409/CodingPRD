            - "plan_v1 is now status == 'SUPERSEDED' with superseded_at == '2026-08-20T10:00:00Z' and its original activated_at '2026-08-05T09:00:00Z' preserved"
            - "${err} == 'ERR_PLAN_NOT_DRAFT' with HTTP 409 — SUPERSEDED is terminal, so the row cannot return to ACTIVE"
            - "plan_ne is STILL status == 'ACTIVE' with superseded_at == null — hop 1 is scoped to the same state_code"

      - name: device_readiness_recheck_from_ready_stays_ready_and_refreshes_timestamp
        claim_type: valid_transition
        grounds:
          - "§1.2 state_machines.EASDevice READY -> READY, precondition 'status == READY', side effect 'last_readiness_check_at = logical clock now'"
          - "§1.2 state_machines.EASDevice REGISTERED -> REGISTERED (a flag false), side effects ['readiness_check_passed = false', 'last_readiness_check_at = logical clock now', 'status unchanged']"
        distinguishing_aspect: "The READY self-transition refreshes last_readiness_check_at without re-evaluating the flags, and it is reachable only from READY: the same endpoint from REGISTERED with a false flag is the DIFFERENT self-transition that writes readiness_check_passed false — two self-loops with distinct side-effect sets."
        test_recipe:
          setup:
            - "Clock 2026-08-01T00:00:00Z; plan KS 2026-R1 activated; station KWEA; device dev1 created (REGISTERED)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              as: ComplianceAdmin
              as_user_id: adm-1
