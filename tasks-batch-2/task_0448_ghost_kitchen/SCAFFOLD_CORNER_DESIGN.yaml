          difficulty_instance: compensating_invariant / cancel_restores_inventory_grams_conserved
          rationale: "ERR_STALE_VERSION (the OCC failure path of the same concurrency rule whose happy-path cancel drives the named §1.8 conservation instance) is asserted in full by the §1.9 cross_cutting_complexity_layers instance occ_stale_version_cancel_rejected_412."

