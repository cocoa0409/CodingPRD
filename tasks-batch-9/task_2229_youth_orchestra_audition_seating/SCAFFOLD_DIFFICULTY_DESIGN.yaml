  - rule_id: transitive_cascade
    instances:
      - name: placement_accept_seats_to_season_cascade
        grounds:
          - state_machines.Placement.OFFERED_to_ACCEPTED
          - state_machines.SectionQuota.UNDERFILLED_to_FULL
          - state_machines.Ensemble.FORMING_to_SEATED
          - state_machines.Season.PLACEMENT_to_IN_SEASON
          - calculations.chair_ranking
          - calculations.tuition_assessment
        distinguishing_aspect: |
          Depth 4 from a single Guardian acceptance, and each hop is CAUSED by
          the previous one: hop 1 creates the seat and lifts
          SectionQuota.filled_count to 1; ONLY BECAUSE filled_count reached
          target_count does hop 2 flip balance_state to FULL; ONLY BECAUSE that
          was the ensemble's last non-FULL section does hop 3 flip roster_state
          to SEATED; ONLY BECAUSE that was the season's last unseated ensemble
          does hop 4 advance Season.status to IN_SEASON. Trigger is
          POST /placements/{placementId}/accept.
        test_recipe:
          setup:
            - "Season in PLACEMENT owning exactly ONE ensemble (min_total_size 1) with exactly ONE VIOLIN section whose min_count == target_count == 1."
