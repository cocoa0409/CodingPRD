              payload: { full_name: "PK", date_of_birth: "1980-01-01", state_code: "TX" }
              as: PlatformAdmin
              captures: { pt: $.data.id, pt_v: $.data.version }
            - call: "POST /cgm/prescribers"
              payload: { full_name: "DRN", npi: "1234567800", specialty: "ENDOCRINOLOGY" }
              as: PlatformAdmin
              captures: { dr: $.data.id }
            - call: "POST /cgm/sensor-products"
