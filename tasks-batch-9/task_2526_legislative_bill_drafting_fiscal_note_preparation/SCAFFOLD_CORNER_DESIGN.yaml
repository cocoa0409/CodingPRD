              as: ReviewCounsel
              as_user_id: "${rc_id}"
            - call: "POST /bills"
              payload: { drafting_request_id: "${dr1_id}" }
              as: Clerk
              captures: { b1_id: $.data.id }
            - call: "POST /drafting-requests"
              payload: { session_id: "${s_id}", subject: "Counter probe two", summary: "Dies in committee at adjournment.", requested_sections_count: 1, target_code_chapter: "Title 6", confidentiality: "PUBLIC", priority_flag: false, appropriation_requested_cents: 0 }
              as: Member
              as_user_id: "${m1_id}"
              captures: { dr2_id: $.data.id }
            - call: "POST /drafting-requests/${dr2_id}/assign"
              payload: { drafter_id: "${d1_id}", engagement_start_utc: "2026-09-02T06:00:00Z", engagement_end_utc: "2026-09-02T12:00:00Z" }
              as: ReviewCounsel
              as_user_id: "${rc_id}"
            - call: "POST /drafting-requests/${dr2_id}/complete-research"
              payload: { affected_sections_count: 1 }
              as: Drafter
              as_user_id: "${d1_id}"
            - call: "POST /drafting-requests/${dr2_id}/certify-draft"
              payload: { style_findings_count: 0 }
              as: ReviewCounsel
              as_user_id: "${rc_id}"
            - call: "POST /bills"
              payload: { drafting_request_id: "${dr2_id}" }
