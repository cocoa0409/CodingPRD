          - validations[priority=75]
          - errors.ERR_INSUFFICIENT_BALANCE
          - entities.GiftCard.fields.available_balance_cents
          - calculations.card_balance_projection
        distinguishing_aspect: "The fiscal check is against available_balance_cents, not current_balance_cents: with a 4000 ACTIVE hold on a 10000 card, a 7000 redemption is refused with 422 ERR_INSUFFICIENT_BALANCE even though the ledger balance is 10000, while a 6000 redemption — exactly the available amount — is accepted."
        test_recipe:
          setup:
            - "One RetailStore, one INTACT CardRack, one ACTIVE PHYSICAL GiftCard with face value 10000 cents and risk_posture CLEAR."
            - "One ACTIVE RedemptionHold of 4000 cents over 00:00..06:00, so available_balance_cents is 6000."
          setup_api_calls:
            - call: "POST /stores"
              payload: { name: "Available Balance Store", region_code: "SE", address_line: "37 Avail Ave" }
              as: PlatformAdmin
              captures: { store1_id: $.data.id }
            - call: "POST /card-racks"
              payload: { store_id: "${store1_id}", rack_label: "RACK-AB", expected_card_count: 6 }
              as: PlatformAdmin
              captures: { rack1_id: $.data.id }
            - call: "POST /gift-cards"
              payload: { store_id: "${store1_id}", rack_id: "${rack1_id}", card_number_masked: "****-****-****-6601" }
              as: PosAssociate
              captures: { card_id: $.data.id }
            - call: "POST /issuance-requests"
              payload: { channel: "PHYSICAL", face_value_cents: 10000, store_id: "${store1_id}", rack_id: "${rack1_id}", card_id: "${card_id}", pos_terminal_id: "T-66", packaging_seal_intact: true }
              as: PosAssociate
              captures: { ir_id: $.data.id }
            - call: "POST /issuance-requests/${ir_id}/screen"
              payload: {}
              as: PosAssociate
            - call: "GET /gift-cards/${card_id}"
              payload: {}
              as: RiskManager
              as_user_id: "risk-66"
              captures: { cv1: $.data.version }
            - call: "POST /gift-cards/${card_id}/redemption-holds"
              payload: { amount_cents: 4000, hold_start: "2026-08-01T00:00:00Z", hold_expires_at: "2026-08-01T06:00:00Z", expected_gift_card_version: "${cv1}" }
              as: PosAssociate
              captures: { hold_id: $.data.id, avail_after_hold: $.data.state }
          trigger:
            - call: "POST /gift-cards/${card_id}/redemptions"
              payload: { amount_cents: 7000, merchant_store_id: "${store1_id}", pos_terminal_id: "T-66" }
              as: PosAssociate
              captures: { err: $.data.error_id }
            - call: "POST /gift-cards/${card_id}/redemptions"
              payload: { amount_cents: 6000, merchant_store_id: "${store1_id}", pos_terminal_id: "T-66" }
              as: PosAssociate
              captures: { ev_id: $.data.id, ev_amount: $.data.amount_cents }
          assert:
            - "${avail_after_hold} == ACTIVE"
            - "first trigger call: HTTP status == 422 and ${err} == ERR_INSUFFICIENT_BALANCE — 7000 > available 6000 although current_balance_cents is 10000"
            - "after the rejected call, GET /ledger-events?card_id=${card_id}&type=REDEMPTION returns total_count == 0"
            - "second trigger call: HTTP status == 201 and ${ev_amount} == 6000 — exactly at available_balance_cents is accepted"
            - "LedgerEvent.${ev_id}.signed_amount_cents == -6000"
            - "GiftCard.${card_id}.current_balance_cents == 4000"
            - "GiftCard.${card_id}.held_amount_cents == 4000 and available_balance_cents == 0"
            - "GiftCard.${card_id}.activation_state == ACTIVE — the balance is not zero, so it is not DEPLETED"
            - "RedemptionHold.${hold_id}.state == ACTIVE — the redemption did not consume the hold"

      - name: claim_gross_reissue_above_the_cap_is_rejected
        claim_type: violation_to_error
        grounds:
          - validations[priority=77]
          - errors.ERR_REISSUE_LIMIT_EXCEEDED
          - calculations.claim_reissue_amount
          - entities.RiskPolicy.fields.reissue_cap_cents
        distinguishing_aspect: "The cap is tested against gross_reissue_cents BEFORE the min() with disputed_amount_cents: a single 150000 unauthorized line grosses round_half_up(150000 * 8500 / 10000) == 127500, which exceeds reissue_cap_cents 100000, so the approval is refused with 422 and nothing at all is written — no replacement card, no writeoff, and the claim is left SUBMITTED and still deniable."
        test_recipe:
          setup:
            - "One RetailStore, one INTACT CardRack, one ACTIVE PHYSICAL GiftCard with face value 200000 cents and a single redemption of 150000 cents, leaving balance 50000."
            - "One OPEN LiabilityPeriod 2026-08-01..2026-09-01 whose unauthorized_writeoff_cents starts at 0."
            - "One SUBMITTED VictimClaim with both evidence refs and disputed_amount_cents 150000, taken in by analyst-67."
          setup_api_calls:
            - call: "POST /stores"
              payload: { name: "Reissue Cap Store", region_code: "NW", address_line: "38 Cap Ct" }
              as: PlatformAdmin
              captures: { store1_id: $.data.id }
            - call: "POST /card-racks"
              payload: { store_id: "${store1_id}", rack_label: "RACK-RC", expected_card_count: 6 }
              as: PlatformAdmin
              captures: { rack1_id: $.data.id }
            - call: "POST /liability-periods"
              payload: { label: "2026-08 reissue cap", period_start: "2026-08-01T00:00:00Z", period_end: "2026-09-01T00:00:00Z" }
              as: LiabilityAccountant
              as_user_id: "acct-67"
              captures: { period_id: $.data.id }
            - call: "POST /gift-cards"
              payload: { store_id: "${store1_id}", rack_id: "${rack1_id}", card_number_masked: "****-****-****-6701" }
              as: PosAssociate
              captures: { card_id: $.data.id }
            - call: "POST /issuance-requests"
              payload: { channel: "PHYSICAL", face_value_cents: 200000, store_id: "${store1_id}", rack_id: "${rack1_id}", card_id: "${card_id}", pos_terminal_id: "T-67", packaging_seal_intact: true }
              as: PosAssociate
              captures: { ir_id: $.data.id }
            - call: "POST /issuance-requests/${ir_id}/screen"
              payload: {}
              as: PosAssociate
            - call: "POST /gift-cards/${card_id}/redemptions"
              payload: { amount_cents: 150000, merchant_store_id: "${store1_id}", pos_terminal_id: "T-67", memo: "drained in one shot" }
              as: PosAssociate
              captures: { ev_id: $.data.id }
            - call: "POST /victim-claims"
              payload: { card_id: "${card_id}", claimant_name: "Hugo Melnyk", claimant_contact: "hugo@example.test", disputed_amount_cents: 150000, purchased_at: "2026-08-01T00:00:00Z", purchase_receipt_ref: "RCPT-6701", packaging_photo_ref: "PHOTO-6701" }
              as: FraudAnalyst
              as_user_id: "analyst-67"
              captures: { claim_id: $.data.id, claim_v0: $.data.version }
          trigger:
            - call: "POST /victim-claims/${claim_id}/decide"
              payload: { decision: "APPROVE", decision_note: "gross recovery exceeds the cap" }
              as: RiskManager
              as_user_id: "risk-67"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 422"
            - "${err} == ERR_REISSUE_LIMIT_EXCEEDED — gross 127500 > reissue_cap_cents 100000"
            - "VictimClaim.${claim_id}.state == SUBMITTED and version == ${claim_v0}"
            - "VictimClaim.${claim_id}.gross_reissue_cents == null and reissue_amount_cents == null and residual_transfer_cents == null and reissued_card_id == null"
            - "GiftCard.${card_id}.activation_state == ACTIVE and current_balance_cents == 50000 and closed_at == null"
            - "GET /gift-cards?reissued_from_card_id=${card_id} returns total_count == 0"
            - "LiabilityPeriod.${period_id}.unauthorized_writeoff_cents == 0 and state == OPEN"
            - "GET /ledger-events?card_id=${card_id} returns total_count == 2 — the activation load and the one redemption only"

      - name: wellformedness_check_precedes_the_parent_lookup
        claim_type: cascading_validation
        grounds:
          - validations[priority=25]
          - validations[priority=30]
          - errors.ERR_INVALID_REQUEST
          - errors.ERR_STORE_NOT_FOUND
        distinguishing_aspect: "A request that is both malformed (expected_card_count -1) and points at an absent store returns the LOWER-priority-number error: 400 ERR_INVALID_REQUEST at priority 25, not 404 ERR_STORE_NOT_FOUND at priority 30 — the body is checked before any FK is resolved."
        test_recipe:
          setup:
            - "One real RetailStore exists but is not the one referenced by the trigger."
          setup_api_calls:
            - call: "POST /stores"
              payload: { name: "Cascade Order Store", region_code: "MW", address_line: "39 Cascade Cir" }
              as: PlatformAdmin
              captures: { store1_id: $.data.id }
          trigger:
            - call: "POST /card-racks"
              payload: { store_id: "00000000-0000-4000-8000-000000000000", rack_label: "RACK-BAD", expected_card_count: -1 }
              as: PlatformAdmin
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 400"
            - "${err} == ERR_INVALID_REQUEST — priority 25 beats the priority 30 store lookup"
            - "GET /card-racks returns total_count == 0"
            - "RetailStore.${store1_id}.floor_posture == OPEN"

      - name: frozen_card_redemption_outranks_the_fiscal_check
        claim_type: priority_conflict
        excluded_because:
          difficulty_instance: frozen_card_state_error_beats_insufficient_balance_fiscal_error
          rationale: "That §1.8 instance already stages a single request violating both priority 46 (ERR_CARD_FROZEN, 409) and priority 75 (ERR_INSUFFICIENT_BALANCE, 422) and asserts that the state-category error at the lower priority number is the one returned."

      - name: suspended_floor_outranks_the_missing_identity_check
        claim_type: priority_conflict
        excluded_because:
          difficulty_instance: suspended_floor_safety_error_beats_missing_identity_referential_error
          rationale: "That §1.8 instance already stages a bulk approval violating both priority 57 (ERR_STORE_FLOOR_SUSPENDED, 422) and priority 60 (ERR_IDENTITY_VERIFICATION_REQUIRED, 422) — a same-status pair, so only the priority ordering distinguishes them — and asserts the safety error wins."

      - name: rack_tamper_state_blocks_a_physical_screen
        claim_type: cross_entity_validation
        excluded_because:
          difficulty_instance: physical_issuance_screen_blocked_by_suspect_rack_state
          rationale: "That §1.8 instance already covers priority 56 end to end: the rack is driven to SUSPECT by an audit, the screen returns 422 ERR_RACK_TAMPERED, and the IssuanceRequest is asserted to remain SUBMITTED with the card still INACTIVE."

      - name: overlapping_liability_periods_are_rejected
        claim_type: temporal_validation
        excluded_because:
          difficulty_instance: liability_period_half_open_adjacency_allowed_overlap_rejected
          rationale: "That §1.8 instance already covers priority 70: it proves adjacency at the shared instant 2026-09-01 is legal and that a straddling period is refused with 409 ERR_PERIOD_OVERLAP, asserting the surviving total_count of 2."

      - name: aggregate_hold_capacity_over_intersecting_windows
        claim_type: aggregate_validation
        excluded_because:
          difficulty_instance: redemption_hold_aggregate_capacity_over_closed_intervals
          rationale: "That §1.8 instance already covers priority 76: two individually affordable holds sum past the balance, the third is refused with 422 ERR_HOLD_CAPACITY_EXCEEDED, and a hold landing exactly at the 10000 ceiling is accepted."

  # ==========================================================================
  # NOTE ON BULK ACTION ENDPOINTS: §1.5 declares no bulk/batch mutation endpoint.
  # POST /bulk-purchase-orders is a single order row, and approving it mints no
  # cards, so the guide's "Bulk action — partial success/failure semantics" row
  # has no applicable surface in this scaffold and emits no instance.
  # ==========================================================================
  - section: endpoints
    instances:

      - name: risk_policy_put_merges_only_the_supplied_thresholds
        claim_type: standard_crud
        grounds:
          - endpoints[PUT /risk-policy]
          - endpoints[GET /risk-policy]
          - entities.RiskPolicy.fields.inquiry_velocity_threshold
          - entities.RiskPolicy.fields.claim_window_days
        distinguishing_aspect: "Every field on PUT /risk-policy is optional, so the write is a merge and not a replace: a PUT carrying two thresholds leaves the other sixteen at their declared defaults, and a second PUT carrying one threshold does not reset the value written by the first."
        test_recipe:
          setup:
            - "A fresh database, so RiskPolicy sits at every declared default."
          setup_api_calls:
            - call: "GET /risk-policy"
              payload: {}
              as: PlatformAdmin
              captures: { v0: $.data.version, vel0: $.data.inquiry_velocity_threshold, win0: $.data.claim_window_days }
          trigger:
            - call: "PUT /risk-policy"
              payload: { inquiry_velocity_threshold: 3, claim_window_days: 30 }
              as: PlatformAdmin
              captures: { v1: $.data.version, vel1: $.data.inquiry_velocity_threshold, win1: $.data.claim_window_days, watch1: $.data.drain_watch_score_threshold, cap1: $.data.reissue_cap_cents }
            - call: "PUT /risk-policy"
              payload: { inquiry_velocity_threshold: 4 }
              as: PlatformAdmin
              captures: { v2: $.data.version, vel2: $.data.inquiry_velocity_threshold, win2: $.data.claim_window_days }
            - call: "GET /risk-policy"
              payload: {}
              as: FraudAnalyst
              captures: { vel3: $.data.inquiry_velocity_threshold, win3: $.data.claim_window_days, restrict3: $.data.drain_restrict_score_threshold, recovery3: $.data.recovery_factor_bps }
          assert:
            - "${vel0} == 5 and ${win0} == 90 — the declared defaults"
            - "first trigger call: HTTP status == 200 and ${vel1} == 3 and ${win1} == 30"
            - "${watch1} == 40 and ${cap1} == 100000 — untouched fields keep their defaults"
            - "${vel2} == 4 and ${win2} == 30 — the second PUT did not reset claim_window_days"
            - "${v1} == ${v0} + 1 and ${v2} == ${v1} + 1 — every accepted write bumps the singleton's version by exactly 1"
            - "${vel3} == 4 and ${win3} == 30 and ${restrict3} == 70 and ${recovery3} == 8500 — the read-back matches the merged state"

      - name: alert_triage_action_records_the_actor_and_scores_the_card
        claim_type: action_endpoint
        grounds:
          - endpoints[POST /draining-alerts/{id}/triage]
          - state_machines.DrainingAlert.OPEN_to_TRIAGED
          - calculations.card_drain_risk_score
          - entities.DrainingAlert.fields.basis_drain_score
        distinguishing_aspect: "Triage does four separate things in one call: it moves the alert OPEN -> TRIAGED, stamps triaged_by_user_id from X-User-ID, writes the redemption-weighted score into basis_drain_score (45 * 0.40 + 14 * 1 + 6 * 1 == 38), and leaves risk_posture at CLEAR because 38 is below drain_watch_score_threshold 40 — recording a score is not the same as escalating on it."
        test_recipe:
          setup:
            - "One RetailStore, one INTACT CardRack, one ACTIVE PHYSICAL GiftCard with face value 10000 cents."
            - "One redemption of 4000 cents at that same store, leaving balance 6000, drawdown_ratio 0.40, distinct_merchant_count 1 and recent_redemption_count 1."
            - "One OPEN DrainingAlert with detection_basis MANUAL_REVIEW raised by analyst-69."
          setup_api_calls:
            - call: "POST /stores"
              payload: { name: "Triage Action Store", region_code: "NE", address_line: "40 Triage Ter" }
              as: PlatformAdmin
              captures: { store1_id: $.data.id }
            - call: "POST /card-racks"
              payload: { store_id: "${store1_id}", rack_label: "RACK-TA", expected_card_count: 6 }
              as: PlatformAdmin
              captures: { rack1_id: $.data.id }
            - call: "POST /gift-cards"
              payload: { store_id: "${store1_id}", rack_id: "${rack1_id}", card_number_masked: "****-****-****-6901" }
              as: PosAssociate
              captures: { card_id: $.data.id }
            - call: "POST /issuance-requests"
              payload: { channel: "PHYSICAL", face_value_cents: 10000, store_id: "${store1_id}", rack_id: "${rack1_id}", card_id: "${card_id}", pos_terminal_id: "T-69", packaging_seal_intact: true }
              as: PosAssociate
              captures: { ir_id: $.data.id }
            - call: "POST /issuance-requests/${ir_id}/screen"
              payload: {}
              as: PosAssociate
            - call: "POST /gift-cards/${card_id}/redemptions"
              payload: { amount_cents: 4000, merchant_store_id: "${store1_id}", pos_terminal_id: "T-69" }
              as: PosAssociate
            - call: "POST /draining-alerts"
              payload: { card_id: "${card_id}", detection_basis: "MANUAL_REVIEW", note: "walk-in complaint" }
              as: FraudAnalyst
              as_user_id: "analyst-69"
              captures: { alert_id: $.data.id, a_state0: $.data.state, a_exposure: $.data.exposure_cents, a_score0: $.data.basis_drain_score, a_vel0: $.data.basis_velocity_count }
          trigger:
            - call: "POST /draining-alerts/${alert_id}/triage"
              payload: { triage_note: "reviewed the single 4000 redemption", redemption_pattern_reviewed: true }
              as: FraudAnalyst
              as_user_id: "analyst-69"
              captures: { a_state1: $.data.state, a_score1: $.data.basis_drain_score, a_by: $.data.triaged_by_user_id, a_reviewed: $.data.redemption_pattern_reviewed }
          assert:
            - "${a_state0} == OPEN and ${a_exposure} == 6000 and ${a_score0} == 0 and ${a_vel0} == 0"
            - "HTTP status == 200"
            - "${a_state1} == TRIAGED"
            - "${a_by} == analyst-69 and ${a_reviewed} == true"
            - "DrainingAlert.${alert_id}.triage_note == reviewed the single 4000 redemption"
            - "${a_score1} == 38 — round_half_up(45 * 0.40 + 14 * 1 + 6 * 1)"
            - "GiftCard.${card_id}.drain_risk_score_redemption == 38"
            - "GiftCard.${card_id}.risk_posture == CLEAR — 38 < drain_watch_score_threshold 40, so triage escalates nothing"
            - "DrainingAlert.${alert_id}.exposure_cents == 6000 — the creation-time snapshot is never recomputed at triage"
            - "RetailStore.${store1_id}.open_alert_count == 1 and floor_posture == OPEN — 1 < floor_heightened_alert_threshold 2"

      - name: referral_requires_a_confirmed_alert
        claim_type: conditional_action
        grounds:
          - endpoints[POST /law-enforcement-referrals]
          - validations[priority=62]
          - errors.ERR_ALERT_NOT_CONFIRMED
          - state_machines.DrainingAlert.TRIAGED_to_CONFIRMED
          - entities.LawEnforcementReferral.fields.exposure_snapshot_cents
        distinguishing_aspect: "A law-enforcement packet may only be filed against a CONFIRMED alert: the identical POST is refused with 422 ERR_ALERT_NOT_CONFIRMED while the alert is OPEN and again while it is TRIAGED, and succeeds only after resolve CONFIRM — which is also the point at which the card is frozen. The accepted referral copies exposure_cents 6000 into exposure_snapshot_cents."
        test_recipe:
          setup:
            - "One RetailStore, one INTACT CardRack, one ACTIVE PHYSICAL GiftCard with face value 10000 cents and one redemption of 4000, leaving balance 6000."
            - "One OPEN DrainingAlert with detection_basis REDEMPTION_PATTERN raised by analyst-70."
          setup_api_calls:
            - call: "POST /stores"
              payload: { name: "Referral Gate Store", region_code: "MW", address_line: "41 Referral Row" }
              as: PlatformAdmin
              captures: { store1_id: $.data.id }
            - call: "POST /card-racks"
              payload: { store_id: "${store1_id}", rack_label: "RACK-RG", expected_card_count: 6 }
              as: PlatformAdmin
              captures: { rack1_id: $.data.id }
            - call: "POST /gift-cards"
              payload: { store_id: "${store1_id}", rack_id: "${rack1_id}", card_number_masked: "****-****-****-7001" }
              as: PosAssociate
              captures: { card_id: $.data.id }
            - call: "POST /issuance-requests"
              payload: { channel: "PHYSICAL", face_value_cents: 10000, store_id: "${store1_id}", rack_id: "${rack1_id}", card_id: "${card_id}", pos_terminal_id: "T-70", packaging_seal_intact: true }
              as: PosAssociate
              captures: { ir_id: $.data.id }
            - call: "POST /issuance-requests/${ir_id}/screen"
              payload: {}
              as: PosAssociate
            - call: "POST /gift-cards/${card_id}/redemptions"
              payload: { amount_cents: 4000, merchant_store_id: "${store1_id}", pos_terminal_id: "T-70" }
              as: PosAssociate
            - call: "POST /draining-alerts"
              payload: { card_id: "${card_id}", detection_basis: "REDEMPTION_PATTERN", note: "clustered redemptions" }
              as: FraudAnalyst
              as_user_id: "analyst-70"
              captures: { alert_id: $.data.id }
          trigger:
            - call: "POST /law-enforcement-referrals"
              payload: { alert_id: "${alert_id}", agency_name: "State Retail Crime Unit", packet_summary: "filed while still open" }
              as: RiskManager
              as_user_id: "risk-70"
              captures: { err_open: $.data.error_id }
            - call: "POST /draining-alerts/${alert_id}/triage"
              payload: { triage_note: "pattern confirmed against POS logs", redemption_pattern_reviewed: true }
              as: FraudAnalyst
              as_user_id: "analyst-70"
              captures: { a_state1: $.data.state }
            - call: "POST /law-enforcement-referrals"
              payload: { alert_id: "${alert_id}", agency_name: "State Retail Crime Unit", packet_summary: "filed while only triaged" }
              as: RiskManager
              as_user_id: "risk-70"
              captures: { err_triaged: $.data.error_id }
            - call: "POST /draining-alerts/${alert_id}/resolve"
              payload: { resolution: "CONFIRM", resolution_note: "fraud confirmed" }
              as: RiskManager
              as_user_id: "risk-70"
              captures: { a_state2: $.data.state }
            - call: "POST /law-enforcement-referrals"
              payload: { alert_id: "${alert_id}", agency_name: "State Retail Crime Unit", packet_summary: "confirmed drain of a physical rack card", case_reference: "SRCU-7001" }
              as: RiskManager
              as_user_id: "risk-70"
              captures: { ref_id: $.data.id, ref_snapshot: $.data.exposure_snapshot_cents, ref_by: $.data.referred_by_user_id, ref_at: $.data.referred_at }
          assert:
            - "first trigger call: HTTP status == 422 and ${err_open} == ERR_ALERT_NOT_CONFIRMED"
            - "${a_state1} == TRIAGED"
            - "third trigger call: HTTP status == 422 and ${err_triaged} == ERR_ALERT_NOT_CONFIRMED — TRIAGED is still not CONFIRMED"
            - "${a_state2} == CONFIRMED"
            - "GiftCard.${card_id}.risk_posture == FROZEN — the confirm cascade froze the card"
            - "fifth trigger call: HTTP status == 201"
            - "${ref_snapshot} == 6000 — a copy of DrainingAlert.exposure_cents"
            - "${ref_by} == risk-70 and ${ref_at} == 2026-08-01T00:00:00Z"
            - "LawEnforcementReferral.${ref_id}.case_reference == SRCU-7001 and agency_name == State Retail Crime Unit"
            - "GET /draining-alerts/${alert_id}/referrals returns total_count == 1"
            - "the referral response carries no version field — LawEnforcementReferral declares common_fields false"

      - name: exposure_summary_is_a_pure_read_that_stores_nothing
        claim_type: computed_read
        grounds:
          - endpoints[GET /liability-periods/{id}/exposure-summary]
          - calculations.net_funded_liability_invariant
          - calculations.unauthorized_redemption_reserve
          - entities.LiabilityPeriod.fields.final_reserve_cents
        distinguishing_aspect: "The summary is derived on every call and persists nothing: two consecutive reads of a CLOSED period return field-for-field identical bodies, the period's version does not move across either read, and final_reserve_cents is still null because only a restatement writes it."
        test_recipe:
          setup:
            - "One RetailStore, one INTACT CardRack, one ACTIVE PHYSICAL GiftCard with face value 5000 cents and no redemptions."
            - "One LiabilityPeriod 2026-08-01..2026-09-01, closed once with no in-period alerts."
          setup_api_calls:
            - call: "POST /stores"
              payload: { name: "Pure Read Store", region_code: "SE", address_line: "42 Read Rd" }
              as: PlatformAdmin
              captures: { store1_id: $.data.id }
            - call: "POST /card-racks"
              payload: { store_id: "${store1_id}", rack_label: "RACK-PR", expected_card_count: 6 }
              as: PlatformAdmin
              captures: { rack1_id: $.data.id }
            - call: "POST /gift-cards"
              payload: { store_id: "${store1_id}", rack_id: "${rack1_id}", card_number_masked: "****-****-****-7101" }
              as: PosAssociate
              captures: { card_id: $.data.id }
            - call: "POST /issuance-requests"
