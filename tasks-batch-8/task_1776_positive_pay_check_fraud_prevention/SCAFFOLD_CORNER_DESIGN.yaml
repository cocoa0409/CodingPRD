      - name: presented_items_on_closed_account_rejected
        claim_type: precondition_enforcement
        grounds: ["errors[ERR_ACCOUNT_NOT_ACTIVE]"]
        distinguishing_aspect: "Bank-side ingestion is also gated by account lifecycle: items for a CLOSED account are rejected, not matched."
        test_recipe:
