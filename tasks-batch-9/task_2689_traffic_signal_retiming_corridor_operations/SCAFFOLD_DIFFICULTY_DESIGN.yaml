              payload: {}
              as: CertifyingEngineer
              as_user_id: "cert-1"
              captures: { chk4_phase: "$.data[0].phase_number", chk4_speed: "$.data[0].walking_speed_fps", chk4_req_pc: "$.data[0].required_ped_clear_sec", chk4_prov_pc: "$.data[0].provided_ped_clear_sec", chk4_req_walk: "$.data[0].required_walk_sec", chk4_req_len: "$.data[0].required_phase_length_sec", chk4_prov_len: "$.data[0].provided_phase_length_sec", chk4_result: "$.data[0].result", chk4_reason: "$.data[0].failure_reason", chk6_phase: "$.data[1].phase_number", chk6_req_pc: "$.data[1].required_ped_clear_sec", chk6_prov_pc: "$.data[1].provided_ped_clear_sec", chk6_prov_len: "$.data[1].provided_phase_length_sec", chk6_result: "$.data[1].result", chk6_reason: "$.data[1].failure_reason" }
            - call: "POST /signal-ops/timing-plans/${pl1_id}/submit"
              payload: {}
              as: TimingEngineer
              as_user_id: "eng-1"
              captures: { submit_err: $.data.error_id }
          assert:
            - "exactly 2 PedestrianComplianceCheck rows exist, enumerated phase_number ASC: ${chk4_phase} == 4 and ${chk6_phase} == 6"
            - "${chk4_speed} == 3.5"
            - "CEILING to the tenth, not rounding: ${chk4_req_pc} == 17.8 (62.0 / 3.5 == 17.714285..., so 17.7 would be wrong)"
            - "${chk6_req_pc} == 17.8"
            - "${chk4_req_walk} == 4.0"
            - "${chk4_req_len} == 25.8"
            - "${chk4_prov_len} == 27"
            - "${chk6_prov_len} == 27"
            - "EQUALITY PASSES: ${chk4_prov_pc} == 17.8 and ${chk4_result} == PASS and ${chk4_reason} == null"
            - "ONE TENTH BELOW FAILS: ${chk6_prov_pc} == 17.7 and ${chk6_result} == FAIL"
            - "SUB-CHECK ORDER: ${chk6_reason} == PED_CLEAR_SHORT (not PHASE_TOO_SHORT; 27 >= 25.8 holds)"
            - "TimingPlan.${pl1_id}.ped_compliance_state == NON_COMPLIANT"
            - "TimingPlan.${pl1_id}.status == COORDINATED"
            - "submit returns HTTP 409 with ${submit_err} == ERR_PED_CLEARANCE_INSUFFICIENT"

      - name: screen_zero_cardinality_eligible_member_set_rejected
        grounds:
          - validations[priority=75]
          - errors.ERR_NO_ELIGIBLE_MEMBERS
          - calculations.intersection_operational_posture
          - calculations.corridor_avg_plan_age_days
          - state_machines.Corridor.UNSCREENED_to_SCREENED
        distinguishing_aspect: |
          METRIC 2 of 3 — an EMPTY-SET / zero-cardinality boundary on a different quantity (the count of
          eligible corridor members), reached through a different endpoint
          (POST /signal-ops/corridors/{id}/screen). Two structurally different ways of reaching
          cardinality zero are exercised: a corridor with literally no CorridorMember rows, and a
          corridor with one member whose Intersection is BLOCKED and therefore filtered out of the
          screening_variant's included set. The three-way contrast is completed by repairing the
          second corridor to RESTRICTED (comm INTERMITTENT) — cardinality 1 — which must screen
          successfully, proving the eligible predicate is {READY, RESTRICTED} and not {READY}.
        test_recipe:
          setup:
            - "Clock at its startup default 2026-08-01T00:00:00Z."
            - "Corridor cZ (COLLECTOR, annual_volume_change_pct 0.0) has NO members at all."
            - "Corridor cB (COLLECTOR, annual_volume_change_pct 0.0) has exactly one member, intersection iB, whose comm_status is OFFLINE so operational_posture is BLOCKED."
          setup_api_calls:
            - call: "POST /signal-ops/corridors"
              payload: { name: "Zero Member Way", jurisdiction_class: "COLLECTOR", annual_volume_change_pct: 0.0 }
              as: SignalOpsAdmin
              captures: { cz_id: $.data.id, cz_member_count: $.data.member_count, cz_status: $.data.selection_status }
            - call: "POST /signal-ops/intersections"
              payload: { location_name: "Blocked Blvd @ 9th", controller_type: "ATC_CABINET", detection_status: "FULL", comm_status: "OFFLINE", aps_installed: false, walking_speed_standard: "STD_3_5_FPS", max_cycle_length_sec: 150 }
              as: SignalOpsAdmin
              captures: { ib_id: $.data.id, ib_posture: $.data.operational_posture }
            - call: "POST /signal-ops/corridors"
              payload: { name: "Blocked Blvd 9th-11th", jurisdiction_class: "COLLECTOR", annual_volume_change_pct: 0.0 }
              as: SignalOpsAdmin
              captures: { cb_id: $.data.id }
            - call: "POST /signal-ops/corridors/${cb_id}/members"
              payload: { intersection_id: "${ib_id}", sequence_index: 1, distance_from_prev_ft: 0 }
              as: SignalOpsAdmin
          trigger:
            - call: "POST /signal-ops/corridors/${cz_id}/screen"
              payload: {}
              as: SignalOpsAdmin
              captures: { err_zero_members: $.data.error_id }
            - call: "POST /signal-ops/corridors/${cb_id}/screen"
              payload: {}
              as: SignalOpsAdmin
              captures: { err_all_blocked: $.data.error_id }
            - call: "PATCH /signal-ops/intersections/${ib_id}"
              payload: { comm_status: "INTERMITTENT" }
              as: SignalOpsAdmin
              captures: { ib_posture_restricted: $.data.operational_posture }
            - call: "POST /signal-ops/corridors/${cb_id}/screen"
              payload: {}
              as: SignalOpsAdmin
              captures: { cb_score: $.data.priority_score, cb_age: $.data.avg_plan_age_days, cb_members: $.data.member_count, cb_status_after: $.data.selection_status }
          assert:
            - "${cz_member_count} == 0"
            - "${cz_status} == UNSCREENED"
            - "${ib_posture} == BLOCKED"
            - "CARDINALITY 0 (no rows): screening cZ returns HTTP 409 with ${err_zero_members} == ERR_NO_ELIGIBLE_MEMBERS"
            - "Corridor.${cz_id}.selection_status == UNSCREENED (nothing was written)"
            - "Corridor.${cz_id}.priority_score == 0 (still the field default; the refused screen wrote nothing)"
            - "CARDINALITY 0 (one row, filtered out): screening cB returns HTTP 409 with ${err_all_blocked} == ERR_NO_ELIGIBLE_MEMBERS"
            - "Corridor.${cb_id}.selection_status == UNSCREENED"
            - "${ib_posture_restricted} == RESTRICTED"
            - "CARDINALITY 1: the third screen succeeds with ${cb_status_after} == SCREENED"
            - "${cb_members} == 1"
            - "${cb_age} == 3650.00"
            - "${cb_score} == 45.00"

      - name: selection_decision_at_exactly_the_fifty_point_zero_score_threshold
        grounds:
          - validations[priority=76]
          - errors.ERR_SCORE_BELOW_SELECT_THRESHOLD
          - calculations.corridor_priority_score
          - calculations.corridor_complaint_count_12mo
          - state_machines.Corridor.SCREENED_to_SELECTED
        distinguishing_aspect: |
          METRIC 3 of 3 — a two-decimal-place weighted-score threshold with >= semantics, reached
          through yet another endpoint (POST /signal-ops/corridors/{id}/selection-decision). Two
          COLLECTOR corridors sharing the same never-retimed intersection differ only in complaint
          count: 5 complaints put the score at EXACTLY 50.00 (SELECT_SCORE_THRESHOLD, must be
          ACCEPTED) and 4 complaints put it at 49.00 (must be REJECTED). Because the components are
          never individually rounded, an implementation that rounds plan_age_component or
          complaint_component before weighting drifts off 50.00 and flips the accepted case.
        test_recipe:
          setup:
            - "Clock at its startup default 2026-08-01T00:00:00Z; every complaint is received at that instant, well inside the 365-day window."
            - "Intersection i1 is READY and never retimed, so timing_plan_age_days is NEVER_RETIMED_AGE_DAYS 3650 and plan_age_component saturates at 1.0."
            - "Corridor cHit (COLLECTOR, annual_volume_change_pct 0.0, class multiplier 1.00) holds 5 OPEN complaints: 0.45*1.0 + 0.35*0.0 + 0.20*(5/20) == 0.50 -> 50.00."
            - "Corridor cMiss (COLLECTOR, annual_volume_change_pct 0.0) is identical but holds 4 OPEN complaints: 0.45 + 0.20*(4/20) == 0.49 -> 49.00."
            - "Both corridors enrol the SAME intersection i1 (graph topology), so the only differing input is the complaint count."
          setup_api_calls:
            - call: "POST /signal-ops/intersections"
              payload: { location_name: "Main St @ 1st Ave", controller_type: "TS2_CABINET", detection_status: "FULL", comm_status: "ONLINE", aps_installed: false, walking_speed_standard: "STD_3_5_FPS", max_cycle_length_sec: 150 }
              as: SignalOpsAdmin
              captures: { i1_id: $.data.id, i1_age: $.data.timing_plan_age_days }
            - call: "POST /signal-ops/requesters"
              payload: { display_name: "Ada Reyes", email: "ada.reyes@example.org", contact_pref: "EMAIL" }
              as: CitizenLiaison
              as_user_id: "liaison-1"
              captures: { r1_id: $.data.id }
            - call: "POST /signal-ops/corridors"
              payload: { name: "Hit Threshold Ave", jurisdiction_class: "COLLECTOR", annual_volume_change_pct: 0.0 }
              as: SignalOpsAdmin
              captures: { chit_id: $.data.id }
            - call: "POST /signal-ops/corridors/${chit_id}/members"
              payload: { intersection_id: "${i1_id}", sequence_index: 1, distance_from_prev_ft: 0 }
              as: SignalOpsAdmin
            - call: "POST /signal-ops/corridors"
              payload: { name: "Miss Threshold Ave", jurisdiction_class: "COLLECTOR", annual_volume_change_pct: 0.0 }
              as: SignalOpsAdmin
              captures: { cmiss_id: $.data.id }
            - call: "POST /signal-ops/corridors/${cmiss_id}/members"
              payload: { intersection_id: "${i1_id}", sequence_index: 1, distance_from_prev_ft: 0 }
              as: SignalOpsAdmin
            - call: "POST /signal-ops/complaints"
              payload: { requester_id: "${r1_id}", corridor_id: "${chit_id}", category: "COORDINATION", narrative: "Hit corridor complaint 1" }
              as: CitizenLiaison
              as_user_id: "liaison-1"
            - call: "POST /signal-ops/complaints"
              payload: { requester_id: "${r1_id}", corridor_id: "${chit_id}", category: "COORDINATION", narrative: "Hit corridor complaint 2" }
              as: CitizenLiaison
              as_user_id: "liaison-1"
            - call: "POST /signal-ops/complaints"
              payload: { requester_id: "${r1_id}", corridor_id: "${chit_id}", category: "TIMING_OTHER", narrative: "Hit corridor complaint 3" }
              as: CitizenLiaison
              as_user_id: "liaison-1"
            - call: "POST /signal-ops/complaints"
              payload: { requester_id: "${r1_id}", corridor_id: "${chit_id}", category: "PEDESTRIAN", narrative: "Hit corridor complaint 4" }
              as: CitizenLiaison
              as_user_id: "liaison-1"
            - call: "POST /signal-ops/complaints"
              payload: { requester_id: "${r1_id}", corridor_id: "${chit_id}", category: "DETECTION", narrative: "Hit corridor complaint 5" }
              as: CitizenLiaison
              as_user_id: "liaison-1"
            - call: "POST /signal-ops/complaints"
              payload: { requester_id: "${r1_id}", corridor_id: "${cmiss_id}", category: "COORDINATION", narrative: "Miss corridor complaint 1" }
              as: CitizenLiaison
              as_user_id: "liaison-1"
            - call: "POST /signal-ops/complaints"
              payload: { requester_id: "${r1_id}", corridor_id: "${cmiss_id}", category: "COORDINATION", narrative: "Miss corridor complaint 2" }
              as: CitizenLiaison
              as_user_id: "liaison-1"
            - call: "POST /signal-ops/complaints"
              payload: { requester_id: "${r1_id}", corridor_id: "${cmiss_id}", category: "TIMING_OTHER", narrative: "Miss corridor complaint 3" }
              as: CitizenLiaison
              as_user_id: "liaison-1"
            - call: "POST /signal-ops/complaints"
              payload: { requester_id: "${r1_id}", corridor_id: "${cmiss_id}", category: "PEDESTRIAN", narrative: "Miss corridor complaint 4" }
              as: CitizenLiaison
              as_user_id: "liaison-1"
            - call: "POST /signal-ops/corridors/${chit_id}/screen"
              payload: {}
              as: SignalOpsAdmin
              captures: { chit_screen_score: $.data.priority_score, chit_screen_complaints: $.data.complaint_count_12mo, chit_screen_variant: $.data.priority_score_variant }
            - call: "POST /signal-ops/corridors/${cmiss_id}/screen"
              payload: {}
              as: SignalOpsAdmin
              captures: { cmiss_screen_score: $.data.priority_score, cmiss_screen_complaints: $.data.complaint_count_12mo }
          trigger:
            - call: "POST /signal-ops/corridors/${chit_id}/selection-decision"
              payload: { decision: "SELECT", rationale: "Exactly at the programme cut line" }
              as: SignalOpsAdmin
              captures: { chit_sel_status: $.data.selection_status, chit_sel_score: $.data.priority_score, chit_sel_variant: $.data.priority_score_variant }
            - call: "POST /signal-ops/corridors/${cmiss_id}/selection-decision"
              payload: { decision: "SELECT", rationale: "One point short of the cut line" }
              as: SignalOpsAdmin
              captures: { cmiss_err: $.data.error_id }
          assert:
            - "${i1_age} == 3650"
            - "${chit_screen_complaints} == 5"
            - "${cmiss_screen_complaints} == 4"
            - "${chit_screen_score} == 50.00"
            - "${chit_screen_variant} == SCREENING"
            - "${cmiss_screen_score} == 49.00"
            - "AT THE THRESHOLD, ACCEPTED: ${chit_sel_status} == SELECTED with ${chit_sel_score} == 50.00 and ${chit_sel_variant} == PROGRAMMING"
            - "ONE POINT BELOW, REJECTED: HTTP 409 with ${cmiss_err} == ERR_SCORE_BELOW_SELECT_THRESHOLD"
            - "Corridor.${cmiss_id}.selection_status == SCREENED (unchanged by the rejected decision)"
            - "Corridor.${cmiss_id}.priority_score == 49.00 (identical under both variants here, since the single member is READY)"
            - "Corridor.${cmiss_id}.priority_score_variant == SCREENING (the refused decision writes NOTHING: the programming-variant recomputation is discarded together with the transition)"

  # =============================================================================================
  # RULE 7 — cross_entity_state_dependency
  # =============================================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: timing_plan_certification_depends_on_intersection_operational_posture
        grounds:
          - state_machines.TimingPlan.SUBMITTED_to_CERTIFIED
          - calculations.intersection_operational_posture
          - validations[priority=55]
          - errors.ERR_POSTURE_BLOCKS_CERTIFICATION
          - entities.Intersection.fields.detection_status
        distinguishing_aspect: |
          ENTITY PAIR 1: TimingPlan -> Intersection. The plan's SUBMITTED -> CERTIFIED transition is
          gated on a THREE-valued derived state of a different entity, and the gate is `!= BLOCKED`
          rather than `== READY`, so both the failing and the passing side must be probed: the same
          plan is refused while detection_status FAILED (posture BLOCKED) and then certified once
          detection_status is relaxed to PARTIAL (posture RESTRICTED, still degraded but permitted).
          Nothing about the plan itself changes between the two attempts — only the other entity's
          derived state.
        test_recipe:
          setup:
            - "Clock at its startup default 2026-08-01T00:00:00Z."
            - "Project p1 on corridor c1 (single member i1) reaches PLAN_DEVELOPMENT; plan pl1 is COORDINATED at cycle 105 with a PASS pedestrian check and is then SUBMITTED while i1 is still READY."
            - "i1 is PATCHed to detection_status FAILED, so operational_posture becomes BLOCKED."
          setup_api_calls:
            - call: "POST /signal-ops/intersections"
              payload: { location_name: "Main St @ 1st Ave", controller_type: "TS2_CABINET", detection_status: "FULL", comm_status: "ONLINE", aps_installed: false, walking_speed_standard: "STD_3_5_FPS", max_cycle_length_sec: 150 }
              as: SignalOpsAdmin
              captures: { i1_id: $.data.id }
            - call: "POST /signal-ops/corridors"
              payload: { name: "Main St 1st-3rd", jurisdiction_class: "ARTERIAL", annual_volume_change_pct: 20.0 }
              as: SignalOpsAdmin
              captures: { c1_id: $.data.id }
            - call: "POST /signal-ops/corridors/${c1_id}/members"
              payload: { intersection_id: "${i1_id}", sequence_index: 1, distance_from_prev_ft: 0 }
              as: SignalOpsAdmin
            - call: "POST /signal-ops/corridors/${c1_id}/screen"
              payload: {}
              as: SignalOpsAdmin
            - call: "POST /signal-ops/corridors/${c1_id}/selection-decision"
              payload: { decision: "SELECT", rationale: "Oldest arterial timing plans in the program" }
              as: SignalOpsAdmin
            - call: "POST /signal-ops/retiming-projects"
              payload: { corridor_id: "${c1_id}", study_window_start_at: "2026-07-01T00:00:00Z", study_window_days: 180, lead_engineer_user_id: "eng-1" }
              as: TimingEngineer
              as_user_id: "eng-1"
              captures: { p1_id: $.data.id }
            - call: "POST /signal-ops/intersections/${i1_id}/turning-movement-counts"
              payload: { project_id: "${p1_id}", study_role: "BEFORE", count_date: "2026-07-15T00:00:00Z", period: "AM_PEAK", phase_volumes: { "1": 350, "2": 500, "4": 250, "6": 180 } }
              as: FieldTechnician
              as_user_id: "tech-1"
            - call: "POST /signal-ops/retiming-projects/${p1_id}/travel-time-runs"
              payload: { study_role: "BEFORE", direction: "NB", started_at: "2026-07-15T09:00:00Z", duration_sec: 320, stops_count: 5, arrivals_on_green_count: 4, total_arrivals: 12 }
              as: FieldTechnician
              as_user_id: "tech-1"
            - call: "POST /signal-ops/retiming-projects/${p1_id}/advance"
              payload: {}
              as: TimingEngineer
              as_user_id: "eng-1"
              captures: { p1_v_adv: $.data.version }
            - call: "POST /signal-ops/timing-plans"
              payload: { project_id: "${p1_id}", intersection_id: "${i1_id}", tod_period: "AM_PEAK", tod_start_min: 360, tod_end_min: 540, coordination_ref: "MASTER", cycle_length_sec: 90, expected_project_version: "${p1_v_adv}" }
              as: TimingEngineer
              as_user_id: "eng-1"
              captures: { pl1_id: $.data.id }
            - call: "POST /signal-ops/timing-plans/${pl1_id}/phase-splits"
              payload: { phase_number: 1, split_sec: 21, min_green_sec: 10, yellow_sec: 3.0, red_clearance_sec: 1.0 }
              as: TimingEngineer
              as_user_id: "eng-1"
            - call: "POST /signal-ops/timing-plans/${pl1_id}/phase-splits"
              payload: { phase_number: 2, split_sec: 21, min_green_sec: 15, yellow_sec: 3.0, red_clearance_sec: 1.0 }
              as: TimingEngineer
              as_user_id: "eng-1"
            - call: "POST /signal-ops/timing-plans/${pl1_id}/phase-splits"
              payload: { phase_number: 4, split_sec: 22, min_green_sec: 12, yellow_sec: 3.0, red_clearance_sec: 1.0, is_pedestrian_phase: true, walk_sec: 4.0, ped_clear_sec: 17.8, crosswalk_length_ft: 62.0 }
              as: TimingEngineer
              as_user_id: "eng-1"
            - call: "POST /signal-ops/timing-plans/${pl1_id}/phase-splits"
              payload: { phase_number: 6, split_sec: 22, min_green_sec: 10, yellow_sec: 3.0, red_clearance_sec: 1.0 }
              as: TimingEngineer
              as_user_id: "eng-1"
            - call: "POST /signal-ops/retiming-projects/${p1_id}/coordinate"
              payload: {}
              as: TimingEngineer
              as_user_id: "eng-1"
            - call: "POST /signal-ops/timing-plans/${pl1_id}/submit"
              payload: {}
              as: TimingEngineer
              as_user_id: "eng-1"
              captures: { pl1_status_submitted: $.data.status }
            - call: "PATCH /signal-ops/intersections/${i1_id}"
              payload: { detection_status: "FAILED" }
              as: SignalOpsAdmin
              captures: { posture_blocked: $.data.operational_posture }
          trigger:
            - call: "POST /signal-ops/timing-plans/${pl1_id}/certify"
              payload: {}
              as: CertifyingEngineer
              as_user_id: "cert-1"
              captures: { err_blocked: $.data.error_id }
            - call: "PATCH /signal-ops/intersections/${i1_id}"
              payload: { detection_status: "PARTIAL" }
              as: SignalOpsAdmin
              captures: { posture_restricted: $.data.operational_posture }
            - call: "POST /signal-ops/timing-plans/${pl1_id}/certify"
              payload: {}
              as: CertifyingEngineer
              as_user_id: "cert-1"
              captures: { pl1_status_certified: $.data.status, pl1_certifier: $.data.certified_by_user_id }
          assert:
            - "${pl1_status_submitted} == SUBMITTED"
            - "${posture_blocked} == BLOCKED"
            - "while the OTHER entity is BLOCKED: HTTP 409 with ${err_blocked} == ERR_POSTURE_BLOCKS_CERTIFICATION"
            - "TimingPlan.${pl1_id}.status == SUBMITTED immediately after the refusal"
            - "${posture_restricted} == RESTRICTED"
            - "the gate is != BLOCKED, not == READY: with the OTHER entity merely RESTRICTED the same call succeeds, ${pl1_status_certified} == CERTIFIED"
            - "${pl1_certifier} == cert-1"
            - "Intersection.${i1_id}.detection_status == PARTIAL and Intersection.${i1_id}.last_retimed_at == null (certification alone does not retime anything)"

      - name: project_creation_depends_on_corridor_selection_status
        grounds:
          - state_machines.RetimingProject.initial_state
          - validations[priority=78]
          - errors.ERR_CORRIDOR_NOT_SELECTED
          - entities.Corridor.fields.selection_status
          - entities.RetimingProject.fields.corridor_id
        distinguishing_aspect: |
          ENTITY PAIR 2: RetimingProject -> Corridor — a different pair, and a different shape of
          dependency: the gate governs the CREATION of entity A rather than a transition of an existing
          A, and it demands an exact single state (SELECTED) rather than an exclusion. All three
          non-qualifying corridor states are probed on the same corridor as it walks
          UNSCREENED -> SCREENED -> DEFERRED and only the SELECTED state admits the create.
        test_recipe:
          setup:
            - "Clock at its startup default 2026-08-01T00:00:00Z."
            - "Corridor c1 is ARTERIAL with annual_volume_change_pct 20.0 and a single READY member i1, so its score is 91.25 and SELECT is available whenever it is SCREENED."
          setup_api_calls:
            - call: "POST /signal-ops/intersections"
              payload: { location_name: "Main St @ 1st Ave", controller_type: "TS2_CABINET", detection_status: "FULL", comm_status: "ONLINE", aps_installed: false, walking_speed_standard: "STD_3_5_FPS", max_cycle_length_sec: 150 }
              as: SignalOpsAdmin
              captures: { i1_id: $.data.id }
            - call: "POST /signal-ops/corridors"
              payload: { name: "Main St 1st-3rd", jurisdiction_class: "ARTERIAL", annual_volume_change_pct: 20.0 }
              as: SignalOpsAdmin
              captures: { c1_id: $.data.id, c1_status_initial: $.data.selection_status }
            - call: "POST /signal-ops/corridors/${c1_id}/members"
              payload: { intersection_id: "${i1_id}", sequence_index: 1, distance_from_prev_ft: 0 }
              as: SignalOpsAdmin
          trigger:
            - call: "POST /signal-ops/retiming-projects"
              payload: { corridor_id: "${c1_id}", study_window_start_at: "2026-07-01T00:00:00Z", study_window_days: 180, lead_engineer_user_id: "eng-1" }
              as: TimingEngineer
              as_user_id: "eng-1"
              captures: { err_unscreened: $.data.error_id }
            - call: "POST /signal-ops/corridors/${c1_id}/screen"
              payload: {}
              as: SignalOpsAdmin
              captures: { c1_status_screened: $.data.selection_status }
            - call: "POST /signal-ops/retiming-projects"
              payload: { corridor_id: "${c1_id}", study_window_start_at: "2026-07-01T00:00:00Z", study_window_days: 180, lead_engineer_user_id: "eng-1" }
              as: TimingEngineer
              as_user_id: "eng-1"
              captures: { err_screened: $.data.error_id }
            - call: "POST /signal-ops/corridors/${c1_id}/selection-decision"
              payload: { decision: "DEFER", rationale: "Held for next fiscal year" }
              as: SignalOpsAdmin
              captures: { c1_status_deferred: $.data.selection_status }
            - call: "POST /signal-ops/retiming-projects"
              payload: { corridor_id: "${c1_id}", study_window_start_at: "2026-07-01T00:00:00Z", study_window_days: 180, lead_engineer_user_id: "eng-1" }
              as: TimingEngineer
              as_user_id: "eng-1"
              captures: { err_deferred: $.data.error_id }
            - call: "POST /signal-ops/corridors/${c1_id}/screen"
              payload: {}
              as: SignalOpsAdmin
            - call: "POST /signal-ops/corridors/${c1_id}/selection-decision"
              payload: { decision: "SELECT", rationale: "Reinstated for the current programme" }
              as: SignalOpsAdmin
              captures: { c1_status_selected: $.data.selection_status }
            - call: "POST /signal-ops/retiming-projects"
              payload: { corridor_id: "${c1_id}", study_window_start_at: "2026-07-01T00:00:00Z", study_window_days: 180, lead_engineer_user_id: "eng-1" }
              as: TimingEngineer
              as_user_id: "eng-1"
              captures: { p1_id: $.data.id, p1_status: $.data.status, p1_eligible: $.data.eligible_member_count }
          assert:
            - "${c1_status_initial} == UNSCREENED"
            - "UNSCREENED: HTTP 409 with ${err_unscreened} == ERR_CORRIDOR_NOT_SELECTED"
            - "${c1_status_screened} == SCREENED"
            - "SCREENED (scored 91.25, well above the SELECT threshold, but never actually selected): HTTP 409 with ${err_screened} == ERR_CORRIDOR_NOT_SELECTED"
            - "${c1_status_deferred} == DEFERRED"
            - "DEFERRED: HTTP 409 with ${err_deferred} == ERR_CORRIDOR_NOT_SELECTED"
            - "${c1_status_selected} == SELECTED"
            - "SELECTED: the create succeeds with ${p1_status} == DATA_COLLECTION and ${p1_eligible} == 1"
            - "GET /signal-ops/corridors/${c1_id}/retiming-projects returns exactly 1 row (the three refusals created nothing)"

      - name: complaint_link_depends_on_project_corridor_identity_and_terminality
        grounds:
          - state_machines.CitizenComplaint.TRIAGED_to_LINKED
          - validations[priority=63]
          - errors.ERR_COMPLAINT_PROJECT_MISMATCH
          - errors.ERR_PROJECT_TERMINAL
          - entities.CitizenComplaint.fields.linked_project_id
        distinguishing_aspect: |
          ENTITY PAIR 3: CitizenComplaint -> RetimingProject. This pair carries TWO different kinds of
          cross-entity condition on one transition — a referential one (the other entity must hang off
          the same Corridor, 422) and a state one (the other entity must not be terminal, 409) — and
          they must be distinguishable by both error id and HTTP status. The two corridors are
          symmetric, so an implementation that forgets the corridor_id comparison links a complaint to
          a project on a completely unrelated corridor without noticing.
        test_recipe:
          setup:
            - "Clock at its startup default 2026-08-01T00:00:00Z."
            - "Two ARTERIAL corridors cA and cB, each SELECTED with its own READY member intersection, each carrying its own DATA_COLLECTION project pA and pB."
            - "Complaint xA is filed on cA and TRIAGED; complaint xB is filed on cB and TRIAGED."
            - "pB is still in DATA_COLLECTION when the first (referential) link is attempted, so ONLY the corridor mismatch is violated; pB is abandoned mid-trigger to set up the terminality probe."
