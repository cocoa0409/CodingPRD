          substitute_qty_per_car: 4
          decides_material: false
          expected_production_order_version: ${po_v2}
        as: ProductionPlanner
        as_user_id: user-planner-11
        captures:
          se_id: $.data.id
      - call: POST /api/v1/substitution-endorsements/${se_id}/approve
        payload: {}
        as: LeaseAdministrator
        as_user_id: user-lease-11
        captures:
          se_status: $.data.status
      - call: GET /api/v1/production-orders/${po_id}
