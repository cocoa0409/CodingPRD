        as: ShopAdmin
      - call: POST /wheelsets
        payload:
          shop_id: ${s}
          serial_number: WS-001
          flange_thickness_mm: 30.0
          tread_wear_mm: 5.0
        as: PartsClerk
        captures:
          w1: $.data.id
      - call: POST /wheelsets
        payload:
