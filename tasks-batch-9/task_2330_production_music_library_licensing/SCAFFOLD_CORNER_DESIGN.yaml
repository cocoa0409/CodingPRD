              as: CatalogAdmin
            - call: "POST /music-library/license-tiers"
              payload: { code: "FILM-STD", media_type: "FILM", allowed_scales: ["LOCAL", "NATIONAL", "WORLDWIDE"], base_rate_cents: 600000 }
              as: CatalogAdmin
              captures: { t1: $.data.id }
            - call: "POST /music-library/license-tiers"
              payload: { code: "FILM-STD", media_type: "GAME", allowed_scales: ["LOCAL"], base_rate_cents: 250000 }
              as: CatalogAdmin
            - call: "POST /music-library/blanket-agreements"
              payload: { licensee_id: "${lee1}", coverage_start: "2026-09-01T00:00:00Z", coverage_end: "2026-09-01T00:00:00Z", annual_fee_cents: 4800000, reporting_cadence: "MONTHLY", usage_cap_minutes: 60, pool_share_pct: 25.00 }
              as: LicensingAgent
            - call: "POST /music-library/blanket-agreements"
              payload: { licensee_id: "${lee1}", coverage_start: "2026-09-01T00:00:00Z", coverage_end: "2026-08-01T00:00:00Z", annual_fee_cents: 4800000, reporting_cadence: "MONTHLY", usage_cap_minutes: 60, pool_share_pct: 25.00 }
              as: LicensingAgent
            - call: "POST /music-library/license-tiers"
              payload: { code: "HOLO-01", media_type: "HOLOGRAM", allowed_scales: ["LOCAL"], base_rate_cents: 100000 }
              as: CatalogAdmin
            - call: "POST /music-library/licensees"
              payload: { legal_name: "Museum of Sound", licensee_type: "MUSEUM", credit_limit_cents: 10000 }
              as: LicensingAgent
            - call: "POST /music-library/licensees"
              payload: { legal_name: "Negative Credit Studio", licensee_type: "AGENCY", credit_limit_cents: -5 }
              as: LicensingAgent
            - call: "GET /music-library/search-profile"
              payload: {}
              as: CatalogAdmin
          assert:
            - "Calls 1 and 2 → 422 with data.error_id == \"ERR_LEDGER_SOURCE_NOT_MANUAL\" and no ledger row is appended"
            - "Call 3 → 201 with source_type \"ADJUSTMENT\", statement_id null and accrual_recognized_at == cash_recognized_at == \"2026-08-01T00:00:00.000Z\""
            - "Call 4 → 422 with data.error_id == \"ERR_WEIGHTS_NOT_100\" (30 + 30 + 30 + 20 = 110)"
            - "Call 5 → 200 with weight_mood 40, weight_genre 30, weight_instrumentation 20, weight_tempo 10 and tempo_tolerance_bpm 8"
            - "Call 7 → 409 with data.error_id == \"ERR_TIER_CODE_DUPLICATE\" and only one tier row exists"
            - "Calls 8 and 9 → 422 with data.error_id == \"ERR_COVERAGE_DATES_INVALID\" (coverage_end equal to and earlier than coverage_start are both refused)"
            - "Call 10 → 422 with data.error_id == \"ERR_VALIDATION\", not ERR_TIER_CODE_DUPLICATE (HOLOGRAM is not a declared media_type)"
            - "Call 11 → 422 with data.error_id == \"ERR_VALIDATION\" (MUSEUM is not a declared licensee_type)"
            - "Call 12 → 422 with data.error_id == \"ERR_VALIDATION\" (credit_limit_cents is outside its declared non-negative range) and no licensee row is created"
            - "Call 13 → 200 (the profile written by call 5 is readable, so call 4 wrote nothing)"

      - name: statement_held_below_minimum_finalizes_but_cannot_be_paid
        claim_type: violation_to_error
        grounds:
          - validations[priority=47].statement_payable
          - calculations[statement_settlement].constants.MIN_PAYOUT_CENTS
          - errors[ERR_STATEMENT_NOT_PAYABLE]
        distinguishing_aspect: |
          HELD_BELOW_MINIMUM is a payability state, not an activity state: the statement has a line and a
          positive net, so finalization succeeds and only the pay call is refused — and the refusal leaves
          both the FINALIZED status and Composer.lifetime_paid_cents untouched, which distinguishes it from
          the NO_ACTIVITY path that fails one step earlier.
        test_recipe:
          setup:
            - "One composer with tax_withholding_pct 0.00 and a single ADJUSTMENT of 2000 — below the 2500 minimum payout."
          setup_api_calls:
            - call: "POST /music-library/composers"
              payload: { display_name: "Nadia Okoro", pro_affiliation: "ASCAP", payee_country: "US", tax_withholding_pct: 0.00 }
              as: CatalogAdmin
              captures: { c1: $.data.id }
            - call: "POST /music-library/royalty-ledger-entries"
              payload: { composer_id: "${c1}", source_type: "ADJUSTMENT", amount_cents: 2000, memo: "Small catalogue bonus" }
              as: RoyaltyAccountant
            - call: "GET /music-library/composers/${c1}"
              payload: {}
              as: RoyaltyAccountant
              captures: { c1_v: $.data.version }
          trigger:
            - call: "POST /music-library/royalty-statements"
              payload: { composer_id: "${c1}", period_start: "2026-08-01T00:00:00Z", period_end: "2026-08-31T00:00:00Z", basis: "ACCRUAL", expected_composer_version: "${c1_v}" }
              as: RoyaltyAccountant
              captures: { st1: $.data.id }
            - call: "POST /music-library/royalty-statements/${st1}/finalize"
              payload: {}
              as: RoyaltyAccountant
            - call: "POST /music-library/royalty-statements/${st1}/pay"
              payload: { payment_reference: "wire-2026-08-0001" }
              as: RoyaltyAccountant
              as_user_id: "user-treasury-01"
            - call: "GET /music-library/royalty-statements/${st1}"
              payload: {}
              as: RoyaltyAccountant
            - call: "GET /music-library/composers/${c1}"
              payload: {}
              as: RoyaltyAccountant
          assert:
            - "Call 1 → 201 with gross_cents 2000, withholding_cents 0, net_payable_cents 2000, line_count 1 and payout_status \"HELD_BELOW_MINIMUM\""
            - "Call 2 → 200 with status \"FINALIZED\" (the activity rule at priority 46 is satisfied)"
            - "Call 3 → 409 with data.error_id == \"ERR_STATEMENT_NOT_PAYABLE\" (2000 < MIN_PAYOUT_CENTS 2500)"
            - "Call 4 → status still \"FINALIZED\" with paid_at null and paid_by_user_id null"
            - "Call 5 → lifetime_paid_cents 0 and accrued_unpaid_cents 2000 (the held amount stays on the composer's books)"

