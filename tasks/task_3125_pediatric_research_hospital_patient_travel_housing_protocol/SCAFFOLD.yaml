  # --- Protocol holds ----------------------------------------------------------
  - method: POST
    path: "/programs/clinical-protocols/{id}/holds"
    description: "Raise a hold, freezing the protocol and reverting accepted referrals"
    roles: [IRBReviewer]
    code: 201
    input: [hold_reason, initiated_at]
    output: ProtocolHold
    side_effects:
      - "status = ACTIVE"
      - "protocol -> HELD with is_protocol_held true"
      - "accepted referrals on this protocol revert to SUBMITTED and release their reservations"
      - "increments ClinicalProtocol.version by 1"
  - method: POST
    path: "/programs/protocol-holds/{id}/release"
    description: "Release a hold"
    roles: [ProtocolCoordinator]
    code: 200
    input: []
    output: ProtocolHold
    side_effects: ["status -> RELEASED", "released_at stamped", "host protocol returns to OPEN when no ACTIVE hold remains"]
  - method: POST
    path: "/programs/protocol-holds/{id}/escalate"
    description: "Escalate an IRB-review hold into a review lock"
    roles: [IRBReviewer]
    code: 200
    input: []
    output: ProtocolHold
    side_effects: ["status -> ESCALATED", "protocol blocks assent confirmation and enrollment completion"]
  - method: GET
    path: "/programs/protocol-holds"
    description: "List all protocol holds"
    roles: [Any]
    code: 200
    input: ["protocol_id?", "status?"]
    output: "ProtocolHold[]"
    side_effects: []

  # --- Referrals ---------------------------------------------------------------
  - method: POST
    path: "/programs/referrals"
    description: "Submit a referral, or re-open a declined referral by naming it as reopen_source_referral_id"
    roles: [IntakeCoordinator]
    code: 201
    input: [protocol_id, child_name, child_date_of_birth, disease_group, disease_stage, household_state_code, traveling_family_member_count, expected_treatment_days, "is_immunosuppressed?", "insurance_coverage_cents?", "has_febrile_neutropenia_risk?", "one_to_one_care_capability_codes?", "reopen_source_referral_id?"]
    output: Referral
    side_effects:
      - "status = SUBMITTED, or ACCEPTED when a declined source referral is re-opened and every screen precondition holds"
      - "eligibility_alias computed from child_name"
      - "applied_tier = PENDING on a fresh submission"
  - method: GET
    path: "/programs/referrals"
    description: "List referrals"
    roles: [Any]
    code: 200
    input: ["protocol_id?", "enrollment_id?", "status?", "household_state_code?", "limit?", "offset?"]
    output: "Referral[]"
    side_effects: []
  - method: GET
    path: "/programs/referrals/{id}"
    description: "Get a referral"
    roles: [Any]
    code: 200
    input: []
    output: Referral
    side_effects: []
  - method: POST
    path: "/programs/referrals/{id}/screen"
    description: "Screen a referral against its protocol, returning the acceptance or decline outcome"
    roles: [IntakeCoordinator]
    code: 200
    input: [expected_protocol_version]
    output: Referral
    side_effects:
      - "status -> ACCEPTED or DECLINED"
      - "screening_fee_cents charged by screening_fee"
      - "applied_tier set by the housing selector"
      - "ClinicalProtocol.reserved_cents increased on acceptance"
      - "protocol is_budget_saturated recomputed"
      - "increments ClinicalProtocol.version by 1"
  - method: POST
    path: "/programs/referrals/{id}/arrive"
    description: "Mark an accepted referral as arrived, creating the enrollment"
    roles: [IntakeCoordinator]
    code: 200
    input: [expected_referral_version]
    output: Referral
    side_effects:
      - "status -> ARRIVED"
      - "Enrollment created with status PENDING_CONSENT"
      - "assent_state set from is_assent_required"
      - "increments Referral.version by 1"
  - method: POST
    path: "/programs/referrals/{id}/withdraw"
    description: "Withdraw a referral"
    roles: [IntakeCoordinator]
    code: 200
    input: ["withdrawal_reason?"]
    output: Referral
    side_effects:
      - "status -> WITHDRAWN"
      - "ClinicalProtocol.reserved_cents -= the referral's reservation_basis_cents, then reservation_basis_cents reset to 0"
      - "enrollment -> WITHDRAWN, assignments -> CANCELLED, pledges -> VOIDED"
      - "increments ClinicalProtocol.version by 1 when a reservation is released"
  - method: GET
    path: "/programs/referrals/{id}/enrollments"
    description: "List enrollments created from this referral"
    roles: [Any]
    code: 200
    input: []
    output: "Enrollment[]"
    side_effects: []
  - method: GET
    path: "/programs/referrals/{id}/one-to-one-summary"
    description: "Return the one-to-one care eligibility record for this referral"
    roles: [Any]
    code: 200
    input: []
    output: { referral_id: string, traveling_one_to_one_code_count: integer, one_to_one_shortfall: boolean }
    side_effects: []
  - method: GET
    path: "/programs/referrals/{id}/reopens"
    description: "List successor referrals that re-opened this declined referral"
    roles: [Any]
    code: 200
    input: []
    output: "Referral[]"
    side_effects: []

