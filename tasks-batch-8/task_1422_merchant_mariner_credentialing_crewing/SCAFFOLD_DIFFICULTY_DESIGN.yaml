  - rule_id: cross_entity_state_dependency
    instances:
      - name: confirm_gated_by_mariner_posture
        grounds:
          - state_machines.Assignment.PROPOSED_to_CONFIRMED
          - calculations.mariner_readiness_posture
          - errors[ERR_MARINER_NOT_CLEAR]
        distinguishing_aspect: |
          Entity pair Assignment x Mariner: the assignment's PROPOSED -> CONFIRMED transition
          depends on the Mariner aggregate's derived state. Mid-chain posture flip (medical
          expiry via clock sweep) blocks confirm; issuing a fresh medical certificate
          (a CredentialingOfficer write on a THIRD entity) restores CLEAR and the same confirm
          then succeeds.
        test_recipe:
          setup:
            - "M activated CLEAR (medical expiry 2026-09-01 = 31d out at clock 2026-08-01; credential 2030; drug until 2027-01-02)"
            - "Vessel/slot/plan; A PROPOSED sign_on 2026-10-01 relief 2027-01-01 local_join"
          setup_api_calls:
            - { call: "POST /mariners", payload: { full_name: "Gated One", mariner_reference_number: "MRN-CE1-1", home_port_code: "SFO", hire_channel: "DIRECT", rank_track: "DECK", rank_grade: 5, primary_endorsement_code: "DECK_AB" }, as: FleetAdmin, captures: { m_id: $.data.id } }
            - { call: "POST /mariners/${m_id}/medical-certificates", payload: { cert_type: "USCG_MEDICAL", issue_date: "2026-01-01T00:00:00Z", expiry_date: "2026-09-01T00:00:00Z" }, as: CredentialingOfficer }
            - { call: "POST /mariners/${m_id}/credentials", payload: { credential_type: "MMC_BASE", endorsement_code: "DECK_AB", issue_date: "2026-01-01T00:00:00Z", expiry_date: "2030-01-01T00:00:00Z" }, as: CredentialingOfficer }
            - { call: "POST /mariners/${m_id}/drug-tests", payload: { test_type: "PRE_EMPLOYMENT", scheduled_date: "2026-01-02T00:00:00Z" }, as: CredentialingOfficer, captures: { dt_id: $.data.id } }
            - { call: "POST /mariners/${m_id}/drug-tests/${dt_id}/record-result", payload: { result: "NEGATIVE", collected_date: "2026-01-02T00:00:00Z" }, as: CredentialingOfficer }
            - { call: "POST /mariners/${m_id}/activate", payload: {}, as: FleetAdmin, captures: { m_posture_0: $.data.readiness_posture } }
            - { call: "POST /vessels", payload: { vessel_name: "SS Gated", imo_number: "IMO-CE1", vessel_class: "BULK", flag_state: "US" }, as: FleetAdmin, captures: { v_id: $.data.id } }
            - { call: "POST /vessels/${v_id}/manning-slots", payload: { position_code: "AB", rank_track: "DECK", min_rank_grade: 2, required_endorsement_code: "DECK_AB", is_critical_position: false, standard_tour_days: 90 }, as: PortCaptain, captures: { s_id: $.data.id } }
            - { call: "POST /vessels/${v_id}/activate", payload: {}, as: FleetAdmin, captures: { v_ver: $.data.version } }
            - { call: "POST /vessels/${v_id}/rotation-plans", payload: { effective_from: "2026-08-01T00:00:00Z", effective_to: "2027-08-01T00:00:00Z", standard_tour_days: 90, max_handover_overlap_days: 3, expected_vessel_version: "${v_ver}" }, as: CrewingManager }
            - { call: "POST /assignments", payload: { mariner_id: "${m_id}", manning_slot_id: "${s_id}", assignment_channel: "DIRECT_HIRE", sign_on_date: "2026-10-01T00:00:00Z", planned_relief_date: "2027-01-01T00:00:00Z", local_join: true }, as: CrewingManager, captures: { a_id: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-09-02T00:00:00Z" }, as: FleetAdmin }
          trigger:
            - { call: "GET /mariners/${m_id}", as: CrewingManager, captures: { m_posture_1: $.data.readiness_posture, m_reasons_1: $.data.readiness_reasons } }
            - { call: "POST /assignments/${a_id}/confirm", payload: {}, as: CrewingManager, captures: { err: $.data.error_id } }
            - { call: "POST /mariners/${m_id}/medical-certificates", payload: { cert_type: "USCG_MEDICAL", issue_date: "2026-09-02T00:00:00Z", expiry_date: "2027-09-01T00:00:00Z" }, as: CredentialingOfficer }
            - { call: "GET /mariners/${m_id}", as: CrewingManager, captures: { m_posture_2: $.data.readiness_posture } }
            - { call: "POST /assignments/${a_id}/confirm", payload: {}, as: CrewingManager, captures: { a_status: $.data.assignment_status } }
          assert:
            - "m_posture_0 == CLEAR (31 days to medical expiry at activation)"
            - "m_posture_1 == BLOCKED and m_reasons_1 contains NO_VALID_MEDICAL (clock 2026-09-02 swept the certificate to EXPIRED)"
            - "err == ERR_MARINER_NOT_CLEAR (Assignment transition gated by Mariner state)"
            - "m_posture_2 == CLEAR (new medical 2027-09-01 is 365d out; drug 122d; credential years out)"
            - "a_status == CONFIRMED (same transition succeeds once the cross-entity gate reopens)"
      - name: union_dispatch_gated_by_registration_and_dues
        grounds:
          - state_machines.Assignment.PROPOSED_to_CONFIRMED
          - entities.UnionRegistration.fields.status
          - entities.UnionRegistration.fields.dues_current_until
          - errors[ERR_DUES_NOT_CURRENT]
          - errors[ERR_UNION_REGISTRATION_INVALID]
        distinguishing_aspect: |
          Entity pair Assignment x UnionRegistration (different pair than Assignment x Mariner):
          a UNION_DISPATCH assignment is creatable only when the registration's dues cover
          sign_on, and confirmable only while the registration is REGISTERED. Sequence:
          dues stale -> create fails; dues extended -> create succeeds; registration suspended
          -> confirm fails; reinstated -> confirm succeeds.
        test_recipe:
          setup:
            - "UnionHall H; Mariner MU hire_channel UNION_HALL activated; Registration R (REGISTERED, dues_current_until := seniority_date 2026-01-01)"
