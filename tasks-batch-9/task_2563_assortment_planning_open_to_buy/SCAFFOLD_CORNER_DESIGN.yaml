            - "${adopted_status} == ADOPTED with option_slots_assigned 1 and option_slots_open 13 on OptionPlan.${op_id} before the close attempts"
            - "${blocked_error} == ERR_INVALID_STATE (409): ADOPTED is one of the four allowed source states of the collapsed close row, so the failure is the second precondition - a ReceiptCommitment with commit_status PROPOSED still exists for this item"
            - "after the rejected close, AssortmentItem.${item_id}.status is still ADOPTED and OptionPlan.${op_id}.option_slots_open is still 13 - no partial slot release happened"
            - "${rc_commit} == WITHDRAWN, ${rc_fulfil} == VOID, ${rc_cancelled} == 400 and ${rc_open_cost} == 0: withdrawing a PROPOSED commitment sets cancelled_units to the full order and voids fulfillment in the same call"
            - "PlanMonth.${m1_id}.otb_committed_cents == 0, otb_open_cents == 18200000 and version == ${m1_v} after the withdrawal: a PROPOSED commitment never entered the committed bucket, so there is nothing to release and the month row is not even touched"
            - "${closed_status} == CLOSED and OptionPlan.${op_id} now reports option_slots_assigned 0 and option_slots_open 14 with option_slots_total still 14"
            - "GET /otb/receipt-commitments filtered to assortment_item_id ${item_id} and commit_status PROPOSED returns total_count 0, which is exactly the condition the guard reads"

      - name: overlay_expiry_on_clock_advance_recomputes_item_forecast
