# =============================================================================
# SCAFFOLD_DIFFICULTY_DESIGN.yaml - task 2194 New-Teacher Induction & Mentorship
# Section 1.8 test-targeting index. Every instance grounds in elements already
# declared in SCAFFOLD.yaml (1.1-1.7); deleting this file would leave the
# declared behaviour unchanged. The logical clock starts at 2026-08-01T00:00:00Z
# on every fresh database, so every chain below activates its match on that
# instant and only moves the clock forward with POST /_clock/set_current_utc.
# =============================================================================
scaffold_difficulty_design:

  - rule_id: dual_variant_calc
    instances:

      - name: stipend_provisional_vs_final_divergence
        grounds:
          - calculations.mentor_stipend_gross_cents
          - entities.Mentor.fields.stipend_accrued_cents
          - entities.StipendDisbursement.fields.gross_cents
          - entities.StipendDisbursement.fields.eligible_log_count
          - state_machines.ContactLog.SUBMITTED_to_VERIFIED
        distinguishing_aspect: |
          This instance exercises the two variants of mentor_stipend_gross_cents on the
          MENTOR COMPENSATION entity domain (Mentor / ContactLog / StipendDisbursement):
          provisional_accrual counts a still-SUBMITTED log at its projected credited
          minutes and a LIVE tier/multiplier, while final_disbursement counts only
          VERIFIED logs at their PINNED tier/multiplier, so Mentor.stipend_accrued_cents
          (11550) exceeds StipendDisbursement.gross_cents (6300) by exactly the 5250
          cents projected for the unverified log.
        test_recipe:
          setup:
            - "One open Site with a CERTIFIED Mentor endorsed in MATH (18 training hours across FOUNDATIONS, OBSERVATION_PROTOCOL and EQUITY) and one MATH NoviceTeacher on an ACTIVE MentorMatch, so subject_match_tier is EXACT and the pinned rate is 4200 cents per hour."
            - "Clock advanced to 2026-08-03T12:00:00Z so contact dates 2026-08-01 and 2026-08-02 are in the past."
            - "Contact log A: 2026-08-01, ONE_ON_ONE, 90 minutes, VERIFIED -> credited_minutes 90, stipend_cents 6300."
            - "Contact log B: 2026-08-02, MODEL_LESSON, 60 minutes, left SUBMITTED -> projected credited minutes floor(60 * 1.25) = 75, projected 5250 cents."
            - "Clock advanced to 2026-10-05T00:00:00Z so the 2026-Q3 period is closed."
          setup_api_calls:
            - call: "POST /sites"
              payload: { name: "Northgate High", site_code: "NG-001", region_code: "NORTH", mentor_slot_cap: 6 }
              as: ProgramAdmin
              captures: { site_id: $.data.id }
            - call: "POST /cohorts"
              payload: { name: "Induction 2026-27", program_year: 2026, region_code: "NORTH", seminar_sessions_required: 1 }
              as: ProgramAdmin
              captures: { cohort_id: $.data.id }
            - call: "POST /mentors"
              payload: { site_id: "${site_id}", full_name: "Rosa Alvarez", subject_endorsements: ["MATH"], caseload_cap: 2 }
              as: ProgramAdmin
              captures: { mentor_id: $.data.id }
            - call: "POST /mentors/${mentor_id}/training-credits"
              payload: { module_code: "FOUNDATIONS", hours: 8.00, completed_on: "2026-07-10" }
              as: ProgramAdmin
            - call: "POST /mentors/${mentor_id}/training-credits"
              payload: { module_code: "OBSERVATION_PROTOCOL", hours: 6.00, completed_on: "2026-07-11" }
              as: ProgramAdmin
            - call: "POST /mentors/${mentor_id}/training-credits"
              payload: { module_code: "EQUITY", hours: 4.00, completed_on: "2026-07-12" }
              as: ProgramAdmin
            - call: "POST /mentors/${mentor_id}/certification"
              payload: { action: "CERTIFY" }
              as: ProgramAdmin
              captures: { mentor_v1: $.data.version }
            - call: "POST /novice-teachers"
              payload: { site_id: "${site_id}", cohort_id: "${cohort_id}", full_name: "Dana Pike", subject_area: "MATH", induction_year: 1 }
              as: ProgramAdmin
              captures: { novice_id: $.data.id }
            - call: "POST /mentor-matches"
              payload: { novice_id: "${novice_id}", mentor_id: "${mentor_id}", expected_mentor_version: "${mentor_v1}" }
              as: ProgramAdmin
              captures: { match_id: $.data.id }
            - call: "POST /mentor-matches/${match_id}/disposition"
              payload: { decision: "ACTIVATE" }
              as: ProgramAdmin
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-03T12:00:00Z" }
              as: ProgramAdmin
            - call: "POST /contact-logs"
              payload: { match_id: "${match_id}", contact_date: "2026-08-01", minutes: 90, contact_type: "ONE_ON_ONE", description: "Weekly one-on-one planning conference with the novice teacher on unit pacing" }
              as: Mentor
              as_user_id: "${mentor_id}"
              captures: { log_a_id: $.data.id }
            - call: "POST /contact-logs/${log_a_id}/review"
              payload: { decision: "VERIFY", note: "Minutes corroborated by the site sign-in sheet" }
              as: SiteInductionLead
              as_user_id: "${site_id}"
            - call: "POST /contact-logs"
              payload: { match_id: "${match_id}", contact_date: "2026-08-02", minutes: 60, contact_type: "MODEL_LESSON", description: "Model lesson delivered in the novice classroom" }
              as: Mentor
              as_user_id: "${mentor_id}"
              captures: { log_b_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-10-05T00:00:00Z" }
              as: ProgramAdmin
            - call: "GET /mentors/${mentor_id}"
              payload: {}
              as: ProgramAdmin
              captures: { mentor_v2: $.data.version }
          trigger:
            - call: "POST /stipend-disbursements"
              payload: { mentor_id: "${mentor_id}", period_code: "2026-Q3", period_start: "2026-07-01T00:00:00Z", period_end: "2026-09-30T23:59:59Z", expected_mentor_version: "${mentor_v2}" }
              as: ProgramAdmin
              as_user_id: "u-preparer-1"
              captures: { disb_id: $.data.id }
          assert:
            - "ContactLog.${log_a_id}.verification_status == VERIFIED"
            - "ContactLog.${log_a_id}.credited_minutes == 90"
            - "ContactLog.${log_a_id}.stipend_cents == 6300"
            - "ContactLog.${log_b_id}.verification_status == SUBMITTED"
            - "ContactLog.${log_b_id}.credited_minutes == 0"
            - "ContactLog.${log_b_id}.stipend_cents == 0"
            - "Mentor.${mentor_id}.stipend_accrued_cents == 11550"
            - "StipendDisbursement.${disb_id}.gross_cents == 6300"
            - "StipendDisbursement.${disb_id}.eligible_log_count == 1"
            - "StipendDisbursement.${disb_id}.net_cents == 6300"
            - "Mentor.${mentor_id}.stipend_accrued_cents - StipendDisbursement.${disb_id}.gross_cents == 5250"
            - "MentorMatch.${match_id}.accrued_stipend_cents == 6300"

      - name: readiness_live_vs_snapshot_divergence
        grounds:
          - calculations.novice_readiness_index
          - entities.NoviceTeacher.fields.readiness_index_live
          - entities.NoviceTeacher.fields.readiness_index_snapshot
          - entities.MilestoneAttainment.fields.snapshot_contact_minutes
          - state_machines.ContactLog.VERIFIED_to_VOIDED
        distinguishing_aspect: |
          This instance exercises the two variants of novice_readiness_index on the
          NOVICE PROGRESSION entity domain (NoviceTeacher / MilestoneAttainment), a
          different entity domain from the mentor-compensation instance above: after a
          void, readiness_index_live falls to 27.00 from the reduced live counters while
          readiness_index_snapshot stays frozen at 36.00 against the 480 minutes captured
          on the ATTAINED MilestoneAttainment.
        test_recipe:
          setup:
            - "Same open Site, CERTIFIED MATH Mentor and ACTIVE MentorMatch as above."
            - "Clock advanced to 2026-08-06T12:00:00Z."
            - "Three VERIFIED ONE_ON_ONE logs on 2026-08-03 (180 min), 2026-08-04 (180 min) and 2026-08-05 (120 min) -> verified_contact_minutes 480, no observation cycles, no HELD seminar sessions, so readiness_index_live = round(100 * 0.45 * (480/600), 2) = 36.00."
            - "One Milestone M1-CONTACT with required_contact_minutes 300 and all other requirements 0, ATTAINED by the novice, which freezes snapshot_contact_minutes 480 and readiness_index_snapshot 36.00."
            - "The attestation is performed by a ProgramAdmin user distinct from the SiteInductionLead that verified the evidence logs, satisfying the segregation-of-duties rule."
          setup_api_calls:
            - call: "POST /sites"
              payload: { name: "Northgate High", site_code: "NG-001", region_code: "NORTH", mentor_slot_cap: 6 }
              as: ProgramAdmin
              captures: { site_id: $.data.id }
            - call: "POST /cohorts"
              payload: { name: "Induction 2026-27", program_year: 2026, region_code: "NORTH", seminar_sessions_required: 1 }
              as: ProgramAdmin
              captures: { cohort_id: $.data.id }
            - call: "POST /mentors"
              payload: { site_id: "${site_id}", full_name: "Rosa Alvarez", subject_endorsements: ["MATH"], caseload_cap: 2 }
              as: ProgramAdmin
              captures: { mentor_id: $.data.id }
            - call: "POST /mentors/${mentor_id}/training-credits"
              payload: { module_code: "FOUNDATIONS", hours: 8.00, completed_on: "2026-07-10" }
              as: ProgramAdmin
            - call: "POST /mentors/${mentor_id}/training-credits"
              payload: { module_code: "OBSERVATION_PROTOCOL", hours: 6.00, completed_on: "2026-07-11" }
              as: ProgramAdmin
            - call: "POST /mentors/${mentor_id}/training-credits"
              payload: { module_code: "EQUITY", hours: 4.00, completed_on: "2026-07-12" }
              as: ProgramAdmin
            - call: "POST /mentors/${mentor_id}/certification"
              payload: { action: "CERTIFY" }
              as: ProgramAdmin
              captures: { mentor_v1: $.data.version }
            - call: "POST /novice-teachers"
              payload: { site_id: "${site_id}", cohort_id: "${cohort_id}", full_name: "Dana Pike", subject_area: "MATH", induction_year: 1 }
              as: ProgramAdmin
              captures: { novice_id: $.data.id }
            - call: "POST /mentor-matches"
              payload: { novice_id: "${novice_id}", mentor_id: "${mentor_id}", expected_mentor_version: "${mentor_v1}" }
              as: ProgramAdmin
              captures: { match_id: $.data.id }
            - call: "POST /mentor-matches/${match_id}/disposition"
              payload: { decision: "ACTIVATE" }
              as: ProgramAdmin
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-06T12:00:00Z" }
              as: ProgramAdmin
            - call: "POST /contact-logs"
              payload: { match_id: "${match_id}", contact_date: "2026-08-03", minutes: 180, contact_type: "ONE_ON_ONE", description: "Weekly one-on-one planning conference with the novice teacher and formative data review" }
              as: Mentor
              as_user_id: "${mentor_id}"
              captures: { log1_id: $.data.id }
            - call: "POST /contact-logs/${log1_id}/review"
              payload: { decision: "VERIFY", note: "Minutes corroborated by the site sign-in sheet" }
              as: SiteInductionLead
              as_user_id: "${site_id}"
            - call: "POST /contact-logs"
              payload: { match_id: "${match_id}", contact_date: "2026-08-04", minutes: 180, contact_type: "ONE_ON_ONE", description: "Weekly one-on-one planning conference with the novice teacher and formative data review" }
              as: Mentor
              as_user_id: "${mentor_id}"
              captures: { log2_id: $.data.id }
            - call: "POST /contact-logs/${log2_id}/review"
              payload: { decision: "VERIFY", note: "Minutes corroborated by the site sign-in sheet" }
              as: SiteInductionLead
              as_user_id: "${site_id}"
            - call: "POST /contact-logs"
              payload: { match_id: "${match_id}", contact_date: "2026-08-05", minutes: 120, contact_type: "ONE_ON_ONE", description: "Weekly one-on-one planning conference with the novice teacher on assessment design" }
              as: Mentor
              as_user_id: "${mentor_id}"
              captures: { log3_id: $.data.id }
            - call: "POST /contact-logs/${log3_id}/review"
              payload: { decision: "VERIFY", note: "Minutes corroborated by the site sign-in sheet" }
              as: SiteInductionLead
              as_user_id: "${site_id}"
            - call: "POST /milestones"
              payload: { code: "M1-CONTACT", title: "Foundational contact hours", sequence_index: 1, required_contact_minutes: 300, required_observation_cycles: 0, required_credited_seminars: 0, license_stage_unlocked: "PROVISIONAL", gates_license_recommendation: false }
              as: ProgramAdmin
              captures: { m1_id: $.data.id }
            - call: "POST /milestone-attainments"
              payload: { novice_id: "${novice_id}", milestone_id: "${m1_id}", evidence_note: "Contact hour ledger attached for review" }
              as: ProgramAdmin
              as_user_id: "u-program-office-1"
              captures: { att1_id: $.data.id }
            - call: "POST /milestone-attainments/${att1_id}/decision"
              payload: { decision: "ATTAIN", evidence_note: "Verified contact ledger exceeds the 300 minute requirement" }
              as: ProgramAdmin
              as_user_id: "u-program-office-1"
          trigger:
            - call: "POST /contact-logs/${log3_id}/void"
              payload: { void_reason: "Duplicate entry discovered during the monthly ledger audit" }
              as: ProgramAdmin
              as_user_id: "u-program-office-1"
          assert:
            - "ContactLog.${log3_id}.verification_status == VOIDED"
            - "ContactLog.${log3_id}.credited_minutes == 0"
            - "NoviceTeacher.${novice_id}.verified_contact_minutes == 360"
            - "NoviceTeacher.${novice_id}.readiness_index_live == 27.00"
            - "NoviceTeacher.${novice_id}.readiness_index_snapshot == 36.00"
            - "MilestoneAttainment.${att1_id}.snapshot_contact_minutes == 480"
            - "MilestoneAttainment.${att1_id}.status == ATTAINED"
            - "NoviceTeacher.${novice_id}.attained_milestone_count == 1"
            - "NoviceTeacher.${novice_id}.readiness_index_live != NoviceTeacher.${novice_id}.readiness_index_snapshot"

  - rule_id: combinatorial_formula
    instances:

      - name: contact_credit_three_way_interaction
        grounds:
          - calculations.contact_log_credited_minutes
          - calculations.mentor_stipend_gross_cents
          - validations[priority=43]
          - state_machines.ContactLog.SUBMITTED_to_VERIFIED
        distinguishing_aspect: |
          MODE (a) - three independent inputs combine non-linearly in one formula:
          contact_log_credited_minutes multiplies minutes by TYPE_WEIGHT and then clips the
          product against the residual same-day room, so the second log of the day credits
          60 of its 150 weighted minutes purely because of the first log's 120, and the
          third log credits nothing at all; no single input predicts the result.
        test_recipe:
          setup:
            - "Open Site, CERTIFIED MATH Mentor, MATH NoviceTeacher, ACTIVE MentorMatch with subject_match_tier EXACT (rate 4200 cents per hour, multiplier 1.00)."
            - "Clock advanced to 2026-08-07T12:00:00Z."
            - "Three contact logs all dated 2026-08-06 on the same match: L1 ONE_ON_ONE 120 minutes, L2 MODEL_LESSON 120 minutes, L3 DEBRIEF 40 minutes."
            - "L1 already VERIFIED, consuming 120 of the 180 minute daily credit cap: floor(120 * 1.00) = 120, credited 120, stipend round(120/60 * 4200 * 1.00) = 8400."
          setup_api_calls:
            - call: "POST /sites"
              payload: { name: "Northgate High", site_code: "NG-001", region_code: "NORTH", mentor_slot_cap: 6 }
              as: ProgramAdmin
              captures: { site_id: $.data.id }
            - call: "POST /cohorts"
              payload: { name: "Induction 2026-27", program_year: 2026, region_code: "NORTH", seminar_sessions_required: 1 }
              as: ProgramAdmin
              captures: { cohort_id: $.data.id }
            - call: "POST /mentors"
              payload: { site_id: "${site_id}", full_name: "Rosa Alvarez", subject_endorsements: ["MATH"], caseload_cap: 2 }
              as: ProgramAdmin
              captures: { mentor_id: $.data.id }
            - call: "POST /mentors/${mentor_id}/training-credits"
              payload: { module_code: "FOUNDATIONS", hours: 8.00, completed_on: "2026-07-10" }
              as: ProgramAdmin
            - call: "POST /mentors/${mentor_id}/training-credits"
              payload: { module_code: "OBSERVATION_PROTOCOL", hours: 6.00, completed_on: "2026-07-11" }
              as: ProgramAdmin
            - call: "POST /mentors/${mentor_id}/training-credits"
              payload: { module_code: "EQUITY", hours: 4.00, completed_on: "2026-07-12" }
              as: ProgramAdmin
            - call: "POST /mentors/${mentor_id}/certification"
              payload: { action: "CERTIFY" }
              as: ProgramAdmin
              captures: { mentor_v1: $.data.version }
            - call: "POST /novice-teachers"
              payload: { site_id: "${site_id}", cohort_id: "${cohort_id}", full_name: "Dana Pike", subject_area: "MATH", induction_year: 1 }
              as: ProgramAdmin
              captures: { novice_id: $.data.id }
            - call: "POST /mentor-matches"
              payload: { novice_id: "${novice_id}", mentor_id: "${mentor_id}", expected_mentor_version: "${mentor_v1}" }
              as: ProgramAdmin
              captures: { match_id: $.data.id }
            - call: "POST /mentor-matches/${match_id}/disposition"
              payload: { decision: "ACTIVATE" }
              as: ProgramAdmin
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-07T12:00:00Z" }
              as: ProgramAdmin
            - call: "POST /contact-logs"
              payload: { match_id: "${match_id}", contact_date: "2026-08-06", minutes: 120, contact_type: "ONE_ON_ONE", description: "Weekly one-on-one planning conference with the novice teacher on unit pacing" }
              as: Mentor
              as_user_id: "${mentor_id}"
              captures: { l1_id: $.data.id }
            - call: "POST /contact-logs"
              payload: { match_id: "${match_id}", contact_date: "2026-08-06", minutes: 120, contact_type: "MODEL_LESSON", description: "Model lesson delivered in the novice classroom" }
              as: Mentor
              as_user_id: "${mentor_id}"
              captures: { l2_id: $.data.id }
            - call: "POST /contact-logs"
              payload: { match_id: "${match_id}", contact_date: "2026-08-06", minutes: 40, contact_type: "DEBRIEF", description: "Short debrief after the model lesson block" }
              as: Mentor
              as_user_id: "${mentor_id}"
              captures: { l3_id: $.data.id }
            - call: "POST /contact-logs/${l1_id}/review"
              payload: { decision: "VERIFY", note: "Minutes corroborated by the site sign-in sheet" }
              as: SiteInductionLead
              as_user_id: "${site_id}"
          trigger:
            - call: "POST /contact-logs/${l2_id}/review"
              payload: { decision: "VERIFY", note: "Model lesson confirmed by the observing lead" }
              as: SiteInductionLead
              as_user_id: "${site_id}"
            - call: "POST /contact-logs/${l3_id}/review"
              payload: { decision: "VERIFY", note: "Debrief confirmed by the observing lead" }
              as: SiteInductionLead
              as_user_id: "${site_id}"
          assert:
            - "the L2 review returns 200 and the L3 review returns 422 with error_id ERR_DAILY_CREDIT_CAP_REACHED"
            - "ContactLog.${l2_id}.verification_status == VERIFIED"
            - "ContactLog.${l2_id}.credited_minutes == 60"
            - "ContactLog.${l2_id}.stipend_cents == 4200"
            - "ContactLog.${l2_id}.rate_tier_at_verification == EXACT"
            - "ContactLog.${l2_id}.cert_multiplier_at_verification == 1.00"
            - "ContactLog.${l3_id}.verification_status == SUBMITTED"
            - "ContactLog.${l3_id}.credited_minutes == 0"
            - "MentorMatch.${match_id}.verified_minutes_total == 180"
            - "MentorMatch.${match_id}.accrued_stipend_cents == 12600"
            - "NoviceTeacher.${novice_id}.verified_contact_minutes == 180"

      - name: stipend_per_log_rounding_order
        grounds:
          - calculations.mentor_stipend_gross_cents
          - calculations.subject_match_tier
          - entities.ContactLog.fields.stipend_cents
          - entities.StipendDisbursement.fields.gross_cents
        distinguishing_aspect: |
          MODE (b) - nested rounding order, a different mode from the three-way input
          interaction above: three CROSS-tier logs of 7 minutes each round to 327 cents
          individually and sum to 981, whereas summing the unrounded products first and
          rounding once at the end yields 980, so the assertion gross_cents == 981 and
          gross_cents != 980 falsifies the wrong rounding order.
        test_recipe:
          setup:
            - "Open Site, CERTIFIED Mentor endorsed only in SPED, NoviceTeacher whose subject_area is SCIENCE, so subject_match_tier is CROSS (SPED is neither an exact match nor in SCIENCE's adjacency list {MATH, CTE}) and the rate is 2800 cents per hour."
            - "Clock advanced to 2026-08-04T12:00:00Z."
            - "Three ONE_ON_ONE contact logs dated 2026-08-03 of 7 minutes each, all VERIFIED; each credits floor(7 * 1.00) = 7 minutes (21 total, far under the 180 minute daily cap) and each rounds to round_half_up(7/60 * 2800 * 1.00) = 327 cents."
            - "Clock advanced to 2026-10-05T00:00:00Z so period_end 2026-09-30T23:59:59Z is strictly in the past."
          setup_api_calls:
            - call: "POST /sites"
              payload: { name: "Northgate High", site_code: "NG-001", region_code: "NORTH", mentor_slot_cap: 6 }
              as: ProgramAdmin
              captures: { site_id: $.data.id }
            - call: "POST /cohorts"
