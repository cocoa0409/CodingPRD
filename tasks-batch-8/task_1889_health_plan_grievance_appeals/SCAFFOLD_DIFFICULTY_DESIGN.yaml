  # ==========================================================================
  # Rule 4 — transitive_cascade (different triggers, depth >= 3 and >= 2)
  # ==========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: reopening_grant_four_hop_cascade
        grounds:
          - state_machines.Reopening.UNDER_REVIEW_to_GRANTED
          - state_machines.GrievanceAppealCase.CLOSED_to_REOPENED
          - state_machines.ClinicalReview.DETERMINED_to_SUPERSEDED
        distinguishing_aspect: |
          Depth-4 cascade from the reopening-grant trigger: grant mutates
          Reopening -> source Case flips REOPENED -> new Case spawned (Member
          counters increment) -> prior DETERMINED ClinicalReview SUPERSEDED.
          Each link is caused by the previous link, not by the grant directly.
        test_recipe:
          setup:
            - "MEDICARE APPEAL case that went through full clinical review, decided UNFAVORABLE, notified, closed"
            - "ClinicalReview on the source case is DETERMINED"
