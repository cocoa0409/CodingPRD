        grounds:
          - roles.Guest
          - roles.Innkeeper
          - validations[priority=20]
          - errors[ERR_FORBIDDEN]
        distinguishing_aspect: "A Guest calling POST /inns/{inn_id}/rooms (Innkeeper-exclusive) is rejected with ERR_FORBIDDEN."
        test_recipe:
          setup: ["Inn exists."]
          setup_api_calls:
            - call: "POST /inns"
              payload: { name: "Ff Inn", lodging_tax_rate_bps: 0 }
              as: Innkeeper
              captures: { inn_id: $.data.id }
            - call: "POST /inns/${inn_id}/guests"
              payload: { inn_id: "${inn_id}", full_name: "Ss G", email: "ssg@x.com" }
              as: Innkeeper
              captures: { guest_id: $.data.id }
          trigger:
            - call: "POST /inns/${inn_id}/rooms"
              payload: { inn_id: "${inn_id}", name: "Sneaky", base_rate_cents: 10000, max_occupancy: 2 }
              as: Guest
              as_user_id: "${guest_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_FORBIDDEN"
            - "HTTP status == 403"

      - name: guest_cannot_cancel_other_guests_booking
        claim_type: Violation → Error
        grounds:
          - validations[priority=25]
          - errors[ERR_NOT_BOOKING_OWNER]
        distinguishing_aspect: "A Guest cancelling a booking owned by a different guest is rejected with ERR_NOT_BOOKING_OWNER."
        test_recipe:
          setup: ["Inn; two guests; a booking owned by guest A; guest B attempts to cancel."]
          setup_api_calls:
            - call: "POST /inns"
              payload: { name: "Gg Inn", lodging_tax_rate_bps: 0 }
              as: Innkeeper
              captures: { inn_id: $.data.id }
            - call: "POST /inns/${inn_id}/rooms"
              payload: { inn_id: "${inn_id}", name: "G", base_rate_cents: 10000, max_occupancy: 2 }
              as: Innkeeper
              captures: { room_id: $.data.id }
            - call: "POST /inns/${inn_id}/guests"
              payload: { inn_id: "${inn_id}", full_name: "Owner", email: "own@x.com" }
              as: Innkeeper
              captures: { guest_a: $.data.id }
            - call: "POST /inns/${inn_id}/guests"
              payload: { inn_id: "${inn_id}", full_name: "Intruder", email: "intr@x.com" }
              as: Innkeeper
              captures: { guest_b: $.data.id }
            - call: "POST /inns/${inn_id}/bookings"
              payload: { inn_id: "${inn_id}", room_id: "${room_id}", guest_id: "${guest_a}", channel: "DIRECT", checkin_date: "2026-05-10", checkout_date: "2026-05-12", guest_count: 1 }
              as: Guest
              as_user_id: "${guest_a}"
              captures: { bk_id: $.data.id }
          trigger:
            - call: "POST /inns/${inn_id}/bookings/${bk_id}/cancel"
              payload: {}
              as: Guest
              as_user_id: "${guest_b}"
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_NOT_BOOKING_OWNER"
            - "Booking.${bk_id}.reservation_status == PENDING"

      - name: housekeeper_cannot_open_remittance
        claim_type: Violation → Error
        grounds:
          - roles.Housekeeper
          - roles.FinanceManager
          - errors[ERR_FORBIDDEN]
        distinguishing_aspect: "A Housekeeper calling POST /inns/{inn_id}/tax-remittances (FinanceManager-exclusive) is rejected with ERR_FORBIDDEN."
        test_recipe:
          setup: ["Inn exists."]
          setup_api_calls:
            - call: "POST /inns"
              payload: { name: "Hh Inn", lodging_tax_rate_bps: 1000 }
              as: Innkeeper
              captures: { inn_id: $.data.id }
          trigger:
            - call: "POST /inns/${inn_id}/tax-remittances"
              payload: { inn_id: "${inn_id}", period_start: "2026-05-01", period_end: "2026-05-31", variant: "FINAL" }
              as: Housekeeper
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_FORBIDDEN"

  # ===========================================================================
  - section: cross_cutting_complexity_layers
    instances:
      - name: occ_stale_room_version_on_confirm
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[booking-confirm-stale-room]
          - errors[ERR_STALE_ROOM_VERSION]
        distinguishing_aspect: "Confirming with an expected_room_version one behind the room's current version yields ERR_STALE_ROOM_VERSION (412)."
        test_recipe:
          setup: ["A PENDING booking with deposit met; the room's version observed, then advanced by a separate confirm on another booking."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-02-01T00:00:00Z" }
              as: Innkeeper
            - call: "POST /inns"
              payload: { name: "Ii Inn", lodging_tax_rate_bps: 0 }
              as: Innkeeper
              captures: { inn_id: $.data.id }
            - call: "POST /inns/${inn_id}/rooms"
              payload: { inn_id: "${inn_id}", name: "G", base_rate_cents: 10000, max_occupancy: 2 }
              as: Innkeeper
              captures: { room_id: $.data.id }
            - call: "POST /inns/${inn_id}/guests"
              payload: { inn_id: "${inn_id}", full_name: "Tt G", email: "ttg@x.com" }
              as: Innkeeper
              captures: { guest_id: $.data.id }
            # booking 1 (non-overlapping nights) confirmed -> bumps room.version
            - call: "POST /inns/${inn_id}/bookings"
              payload: { inn_id: "${inn_id}", room_id: "${room_id}", guest_id: "${guest_id}", channel: "DIRECT", checkin_date: "2026-04-01", checkout_date: "2026-04-03", guest_count: 1 }
              as: Innkeeper
              captures: { bk1: $.data.id }
            - call: "POST /inns/${inn_id}/gift-certificates"
              payload: { inn_id: "${inn_id}", face_value_cents: 20000 }
              as: FinanceManager
              captures: { gc1: $.data.id, gc1_v: $.data.version }
            - call: "POST /inns/${inn_id}/bookings/${bk1}/redeem-gift"
              payload: { gift_certificate_id: "${gc1}", amount_cents: 10000, expected_gift_certificate_version: "${gc1_v}" }
              as: Innkeeper
            # booking 2 (different nights) -> deposit met
            - call: "POST /inns/${inn_id}/bookings"
              payload: { inn_id: "${inn_id}", room_id: "${room_id}", guest_id: "${guest_id}", channel: "DIRECT", checkin_date: "2026-04-20", checkout_date: "2026-04-22", guest_count: 1 }
              as: Innkeeper
              captures: { bk2: $.data.id }
            - call: "POST /inns/${inn_id}/gift-certificates"
              payload: { inn_id: "${inn_id}", face_value_cents: 20000 }
              as: FinanceManager
              captures: { gc2: $.data.id, gc2_v: $.data.version }
            - call: "POST /inns/${inn_id}/bookings/${bk2}/redeem-gift"
              payload: { gift_certificate_id: "${gc2}", amount_cents: 10000, expected_gift_certificate_version: "${gc2_v}" }
              as: Innkeeper
            # observe room version (stale snapshot) BEFORE the supersede confirm
            - call: "GET /inns/${inn_id}/rooms/${room_id}"
              as: Innkeeper
              captures: { room_v_stale: $.data.version }
            # confirm booking 1 -> room.version advances, making room_v_stale stale for booking 2
            - call: "POST /inns/${inn_id}/bookings/${bk1}/confirm"
              payload: { expected_room_version: "${room_v_stale}" }
              as: Innkeeper
          trigger:
            - call: "POST /inns/${inn_id}/bookings/${bk2}/confirm"
              payload: { expected_room_version: "${room_v_stale}" }
              as: Innkeeper
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_STALE_ROOM_VERSION"
            - "HTTP status == 412"
            - "Booking.${bk2}.reservation_status == PENDING"

      - name: occ_correct_room_version_confirm_succeeds
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[booking-confirm-stale-room]
          - entities.Room.fields.version
        distinguishing_aspect: "Confirming with the room's current expected_room_version succeeds and bumps Room.version by 1."
        test_recipe:
          setup: ["A PENDING booking with deposit met; room version read immediately before confirm."]
          setup_api_calls:
            - call: "POST /inns"
              payload: { name: "Jj Inn", lodging_tax_rate_bps: 0 }
              as: Innkeeper
              captures: { inn_id: $.data.id }
            - call: "POST /inns/${inn_id}/rooms"
              payload: { inn_id: "${inn_id}", name: "G", base_rate_cents: 10000, max_occupancy: 2 }
              as: Innkeeper
              captures: { room_id: $.data.id }
            - call: "POST /inns/${inn_id}/guests"
              payload: { inn_id: "${inn_id}", full_name: "Uu G", email: "uug@x.com" }
              as: Innkeeper
              captures: { guest_id: $.data.id }
            - call: "POST /inns/${inn_id}/bookings"
              payload: { inn_id: "${inn_id}", room_id: "${room_id}", guest_id: "${guest_id}", channel: "DIRECT", checkin_date: "2026-05-10", checkout_date: "2026-05-12", guest_count: 1 }
              as: Innkeeper
              captures: { bk_id: $.data.id }
            - call: "POST /inns/${inn_id}/gift-certificates"
              payload: { inn_id: "${inn_id}", face_value_cents: 20000 }
              as: FinanceManager
              captures: { gc_id: $.data.id, gc_v: $.data.version }
            - call: "POST /inns/${inn_id}/bookings/${bk_id}/redeem-gift"
              payload: { gift_certificate_id: "${gc_id}", amount_cents: 10000, expected_gift_certificate_version: "${gc_v}" }
              as: Innkeeper
            - call: "GET /inns/${inn_id}/rooms/${room_id}"
              as: Innkeeper
              captures: { room_v: $.data.version }
          trigger:
            - call: "POST /inns/${inn_id}/bookings/${bk_id}/confirm"
              payload: { expected_room_version: "${room_v}" }
              as: Innkeeper
              captures: { res: $.data.reservation_status }
            - call: "GET /inns/${inn_id}/rooms/${room_id}"
              as: Innkeeper
              captures: { room_v_after: $.data.version }
          assert:
            - "Booking.${bk_id}.reservation_status == CONFIRMED"
            - "Room.${room_id}.version == ${room_v} + 1"

      - name: occ_stale_gift_version_on_redeem
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[gift-redemption-stale-cert]
          - errors[ERR_STALE_GIFT_VERSION]
        distinguishing_aspect: "A redeem-gift carrying an expected_gift_certificate_version one behind the cert's current version yields ERR_STALE_GIFT_VERSION (412)."
        test_recipe:
          setup: ["A gift cert redeemed once against booking A (version bumped); a second redeem against booking B still carries the pre-redeem version."]
          setup_api_calls:
            - call: "POST /inns"
              payload: { name: "Kk Inn", lodging_tax_rate_bps: 0 }
              as: Innkeeper
              captures: { inn_id: $.data.id }
            - call: "POST /inns/${inn_id}/rooms"
              payload: { inn_id: "${inn_id}", name: "G", base_rate_cents: 10000, max_occupancy: 2 }
              as: Innkeeper
              captures: { room_id: $.data.id }
            - call: "POST /inns/${inn_id}/guests"
              payload: { inn_id: "${inn_id}", full_name: "Vv G", email: "vvg@x.com" }
              as: Innkeeper
              captures: { guest_id: $.data.id }
            - call: "POST /inns/${inn_id}/bookings"
              payload: { inn_id: "${inn_id}", room_id: "${room_id}", guest_id: "${guest_id}", channel: "DIRECT", checkin_date: "2026-05-10", checkout_date: "2026-05-12", guest_count: 1 }
              as: Innkeeper
              captures: { bk_a: $.data.id }
            - call: "POST /inns/${inn_id}/bookings"
              payload: { inn_id: "${inn_id}", room_id: "${room_id}", guest_id: "${guest_id}", channel: "DIRECT", checkin_date: "2026-06-10", checkout_date: "2026-06-12", guest_count: 1 }
              as: Innkeeper
              captures: { bk_b: $.data.id }
            - call: "POST /inns/${inn_id}/gift-certificates"
              payload: { inn_id: "${inn_id}", face_value_cents: 30000 }
              as: FinanceManager
              captures: { gc_id: $.data.id, gc_v_stale: $.data.version }
            - call: "POST /inns/${inn_id}/bookings/${bk_a}/redeem-gift"
              payload: { gift_certificate_id: "${gc_id}", amount_cents: 5000, expected_gift_certificate_version: "${gc_v_stale}" }
              as: Innkeeper
          trigger:
            - call: "POST /inns/${inn_id}/bookings/${bk_b}/redeem-gift"
              payload: { gift_certificate_id: "${gc_id}", amount_cents: 5000, expected_gift_certificate_version: "${gc_v_stale}" }
              as: Innkeeper
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_STALE_GIFT_VERSION"
            - "HTTP status == 412"

      - name: derived_deposit_paid_reconciles_after_redemption
        claim_type: derived_field_reconciliation
        grounds: [entities.Booking.fields.deposit_paid_cents, calculations.gift_restore_on_cancel]
        distinguishing_aspect: "deposit_paid_cents recomputes to the sum of redemption ledger entries after a redeem-gift call."
        test_recipe:
          setup: ["A booking; a gift cert face 20000; two redemptions of 4000 then 3000."]
          setup_api_calls:
            - call: "POST /inns"
              payload: { name: "Ll Inn", lodging_tax_rate_bps: 0 }
              as: Innkeeper
              captures: { inn_id: $.data.id }
            - call: "POST /inns/${inn_id}/rooms"
              payload: { inn_id: "${inn_id}", name: "G", base_rate_cents: 10000, max_occupancy: 2 }
              as: Innkeeper
              captures: { room_id: $.data.id }
            - call: "POST /inns/${inn_id}/guests"
              payload: { inn_id: "${inn_id}", full_name: "Ww G", email: "wwg@x.com" }
              as: Innkeeper
              captures: { guest_id: $.data.id }
            - call: "POST /inns/${inn_id}/bookings"
              payload: { inn_id: "${inn_id}", room_id: "${room_id}", guest_id: "${guest_id}", channel: "DIRECT", checkin_date: "2026-05-10", checkout_date: "2026-05-12", guest_count: 1 }
              as: Innkeeper
              captures: { bk_id: $.data.id }
            - call: "POST /inns/${inn_id}/gift-certificates"
              payload: { inn_id: "${inn_id}", face_value_cents: 20000 }
              as: FinanceManager
              captures: { gc_id: $.data.id, gc_v0: $.data.version }
            - call: "POST /inns/${inn_id}/bookings/${bk_id}/redeem-gift"
              payload: { gift_certificate_id: "${gc_id}", amount_cents: 4000, expected_gift_certificate_version: "${gc_v0}" }
              as: Innkeeper
            - call: "GET /inns/${inn_id}/gift-certificates/${gc_id}"
              as: FinanceManager
              captures: { gc_v1: $.data.version }
          trigger:
            - call: "POST /inns/${inn_id}/bookings/${bk_id}/redeem-gift"
              payload: { gift_certificate_id: "${gc_id}", amount_cents: 3000, expected_gift_certificate_version: "${gc_v1}" }
              as: Innkeeper
              captures: { dp: $.data.deposit_paid_cents }
          assert:
            - "Booking.${bk_id}.deposit_paid_cents == 7000"   # 4000 + 3000

  # ===========================================================================
  - section: consistency_model
    instances:
      - name: immediate_visibility_of_computed_fields_on_create
        claim_type: immediate
        grounds: [entities.Booking.fields.total_cents, calculations.lodging_tax]
        distinguishing_aspect: "All computed money fields are present in the create response (same request), no second read needed."
        test_recipe:
          setup: ["Inn tax 1000; Room base 10000; 2-night DIRECT booking."]
          setup_api_calls:
            - call: "POST /inns"
              payload: { name: "Mm Inn", lodging_tax_rate_bps: 1000 }
              as: Innkeeper
              captures: { inn_id: $.data.id }
            - call: "POST /inns/${inn_id}/rooms"
              payload: { inn_id: "${inn_id}", name: "G", base_rate_cents: 10000, max_occupancy: 2 }
              as: Innkeeper
              captures: { room_id: $.data.id }
            - call: "POST /inns/${inn_id}/guests"
              payload: { inn_id: "${inn_id}", full_name: "Xx G", email: "xxg@x.com" }
              as: Innkeeper
              captures: { guest_id: $.data.id }
          trigger:
            - call: "POST /inns/${inn_id}/bookings"
              payload: { inn_id: "${inn_id}", room_id: "${room_id}", guest_id: "${guest_id}", channel: "DIRECT", checkin_date: "2026-05-10", checkout_date: "2026-05-12", guest_count: 1 }
              as: Innkeeper
              captures: { bk_id: $.data.id, tax: $.data.lodging_tax_cents, total: $.data.total_cents }
          assert:
            - "create response lodging_tax_cents == 2000"   # 20000*1000/10000
            - "create response total_cents == 22000"

  # ===========================================================================
  # Stubs — corners already covered by a §1.8 difficulty instance.
  # ===========================================================================
  - section: state_machines
    instances:
      - name: stub_booking_parallel_axes_full_lifecycle
        claim_type: Side Effect Execution
        grounds: [state_machines.Booking.CHECKED_IN_to_CHECKED_OUT]
        excluded_because:
          difficulty_instance: non_linear_state_machine / booking_parallel_reservation_and_payment_axes
          rationale: "The full PENDING->...->CHECKED_OUT lifecycle and payment_status SETTLED side-effect are asserted by the named §1.8 instance."

      - name: stub_gift_deplete_cycle
        claim_type: Valid Transition
        grounds: [state_machines.GiftCertificate.ACTIVE_to_DEPLETED, state_machines.GiftCertificate.DEPLETED_to_ACTIVE]
        excluded_because:
          difficulty_instance: non_linear_state_machine / gift_certificate_deplete_then_restore_cycle
          rationale: "ACTIVE->DEPLETED on full redemption and DEPLETED->ACTIVE on cancel restore are exercised by the named §1.8 instance."

  - section: calculations
    instances:
      - name: stub_room_charge_round_then_sum
        claim_type: Precision
        grounds: [calculations.room_charge]
        excluded_because:
          difficulty_instance: combinatorial_formula / room_charge_round_per_night_then_sum
          rationale: "Per-night floor-then-sum precision is the subject of the named §1.8 instance."

      - name: stub_deposit_direct_vs_ota
        claim_type: Variant Divergence
        grounds: [calculations.deposit_due]
        excluded_because:
          difficulty_instance: dual_variant_calc / deposit_due_direct_vs_ota_diverge
          rationale: "DIRECT vs OTA deposit divergence is asserted by the named §1.8 instance."

      - name: stub_tax_remittance_variant_divergence
        claim_type: Variant Divergence
        grounds: [calculations.tax_remittance_total]
        excluded_because:
          difficulty_instance: dual_variant_calc / tax_remittance_estimated_vs_final_diverge
          rationale: "ESTIMATED vs FINAL sweep divergence is asserted by the named §1.8 instance."

  - section: cross_cutting_complexity_layers
    instances:
      - name: stub_cascade_checkout_turnover
        claim_type: cascading_side_effects
        grounds: [state_machines.Booking.CHECKED_IN_to_CHECKED_OUT, entities.HousekeepingTask.fields.status]
        excluded_because:
          difficulty_instance: transitive_cascade / checkout_spawns_turnover_and_bumps_room_depth2
          rationale: "Checkout->turnover-task creation cascade is asserted by the named §1.8 instance."

      - name: stub_cascade_cancel_gift_restore
        claim_type: cascading_side_effects
        grounds: [calculations.gift_restore_on_cancel, state_machines.GiftCertificate.DEPLETED_to_ACTIVE]
        excluded_because:
          difficulty_instance: transitive_cascade / cancel_refund_restores_gift_flips_cert_status_depth3
          rationale: "Cancel->refund->gift-restore->cert-status depth-3 cascade is asserted by the named §1.8 instance."
