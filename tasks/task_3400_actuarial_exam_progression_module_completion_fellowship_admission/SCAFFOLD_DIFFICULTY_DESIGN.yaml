# =============================================================================
# 1.8 Scaffold Difficulty Design (Test Targeting Index)
# Two+ instances per Difficulty Rule (§0.5); every recipe drives empty-DB to the
# precondition state using only §1.5 endpoints. Default logical clock at server
# start is 2026-09-01T00:00:00Z (see the /_clock/set_current_utc endpoint).
# =============================================================================
scaffold_difficulty_design:
  # ---------------------------------------------------------------------------
  # Rule 1 — dual-variant calculations across different entity domains
  # ---------------------------------------------------------------------------
  - rule_id: dual_variant_calc
    instances:
      - name: score_projection_diverges_from_official_result
        grounds:
          - calculations.scaled_score
          - entities.ExamRegistration.fields.projected_result
          - entities.ExamRegistration.fields.result
          - state_machines.PassMarkSetting.PROPOSED_to_RATIFIED
          - state_machines.ExamWindow.SCORING_to_RESULTS_PUBLISHED
        distinguishing_aspect: |
          Entity domain ExamRegistration scoring: the projected variant (latest
          non-SUPERSEDED setting's proposed_mark while PROPOSED) yields PASS for
          scaled 6.2 under proposed 6.0, while the official variant at publish
          uses the ratified_mark 6.5 and yields FAIL for the SAME raw_score —
          two valid marks, one registration, opposite outcomes.
        test_recipe:
          setup:
            - "ACTIVE syllabus with prelim exam P (credit_hours 10); window P-2026-10 capacity 30 base_fee 30000 late 7500; candidate registered early (fee 30450), marked SAT by the 2026-10-13 sweep; raw_score 37 recorded (scaled 6.2); PassMarkSetting PROPOSED with proposed_mark 6.0"
          setup_api_calls:
            - call: "POST /actuarial/syllabus-versions"
              payload: { version_code: "2026-A" }
              as: Registrar
              captures: { syl_id: $.data.id }
            - call: "POST /actuarial/exams"
              payload: { exam_code: "P", title: "Probability", credit_hours: 10, syllabus_version_id: "${syl_id}" }
              as: Registrar
              captures: { exam_p_id: $.data.id }
            - call: "POST /actuarial/syllabus-versions/${syl_id}/activate"
              payload: {}
              as: Registrar
            - call: "POST /actuarial/exam-windows"
              payload: { exam_id: "${exam_p_id}", window_code: "P-2026-10", registration_opens_at: "2026-09-01T00:00:00Z", registration_deadline: "2026-10-01T00:00:00Z", testing_starts_at: "2026-10-10T09:00:00Z", testing_ends_at: "2026-10-12T17:00:00Z", capacity: 30, base_fee_cents: 30000, late_surcharge_cents: 7500 }
              as: Registrar
              captures: { win_id: $.data.id }
            - call: "POST /actuarial/candidates"
              payload: { email: "cand1@example.com", full_name: "Cand One" }
              as: Anonymous
              captures: { cand_id: $.data.id }
            - call: "POST /actuarial/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: Registrar
            - call: "POST /actuarial/exam-registrations"
              payload: { exam_window_id: "${win_id}" }
              as: Candidate
              as_user_id: "${cand_id}"
              captures: { reg_id: $.data.id }
            - call: "POST /actuarial/_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-13T00:00:00Z" }
              as: Registrar
            - call: "POST /actuarial/exam-registrations/${reg_id}/record-score"
              payload: { raw_score: 37 }
              as: ExamCommittee
            - call: "GET /actuarial/exam-windows/${win_id}"
              as: Registrar
              captures: { win_ver: $.data.version }
            - call: "POST /actuarial/exam-windows/${win_id}/pass-mark-settings"
              payload: { proposed_mark: 6.0, expected_exam_window_version: "${win_ver}" }
              as: ExamCommittee
              captures: { pms_id: $.data.id }
            - call: "GET /actuarial/candidates/${cand_id}/registrations"
              as: Registrar
              captures: { proj_before: "$.data[0].projected_result", scaled: "$.data[0].scaled_score" }
          trigger:
            - call: "POST /actuarial/pass-mark-settings/${pms_id}/ratify"
              payload: { ratified_mark: 6.5 }
              as: ExamCommittee
            - call: "POST /actuarial/pass-mark-settings/${pms_id}/publish"
              payload: {}
              as: ExamCommittee
            - call: "GET /actuarial/candidates/${cand_id}/registrations"
              as: Registrar
              captures: { official_result: "$.data[0].result", proj_after: "$.data[0].projected_result", grading: "$.data[0].grading_status" }
          assert:
            - "setup capture: ${scaled} == 6.2 (round_half_up(37/60*10, 1))"
            - "setup capture: ${proj_before} == PASS (projected variant, proposed_mark 6.0, 6.2 >= 6.0)"
            - "after publish: ${official_result} == FAIL (official variant, ratified_mark 6.5, 6.2 < 6.5)"
            - "after publish: ${proj_after} == null (projected_result clears once RELEASED) and ${grading} == RELEASED"
      - name: cpd_attested_vs_verified_compliance_diverge
        grounds:
          - calculations.cpd_compliance
          - calculations.cpd_required_hours
          - entities.CPDAttestation.fields.attested_hours
          - entities.CPDAttestation.fields.verified_hours
          - state_machines.CPDAttestation.ATTESTED_to_SHORTFALL
        distinguishing_aspect: |
          Entity domain CPD compliance (different from Rule-1 instance 1's exam
          scoring): the attested (self-report) variant says compliant
          (attested_hours 32 >= required 20) while the verified (evidence)
          variant says SHORTFALL (verified_hours 18 < 20) for the SAME cycle —
          and only the verified variant may drive status.
        test_recipe:
          setup:
            - "Candidate holds ASSOCIATE tier (admitted 2026-10-13, so cycle 2027 is a full-year cycle: required = 30 - min(12, 10) = 20)"
            - "CPDAttestation for cycle 2027 exists with attested_hours 32, carryover_hours 12, required_hours 20, status ATTESTED"
          setup_api_calls:
            - call: "POST /actuarial/syllabus-versions"
              payload: { version_code: "2026-A" }
              as: Registrar
              captures: { syl_id: $.data.id }
            - call: "POST /actuarial/exams"
              payload: { exam_code: "P", title: "Probability", credit_hours: 10, syllabus_version_id: "${syl_id}" }
              as: Registrar
              captures: { exam_p_id: $.data.id }
            - call: "POST /actuarial/syllabus-versions/${syl_id}/activate"
              payload: {}
              as: Registrar
            - call: "POST /actuarial/exam-windows"
              payload: { exam_id: "${exam_p_id}", window_code: "P-2026-10", registration_opens_at: "2026-09-01T00:00:00Z", registration_deadline: "2026-10-01T00:00:00Z", testing_starts_at: "2026-10-10T09:00:00Z", testing_ends_at: "2026-10-12T17:00:00Z", capacity: 30, base_fee_cents: 30000, late_surcharge_cents: 7500 }
              as: Registrar
              captures: { win_id: $.data.id }
            - call: "POST /actuarial/candidates"
              payload: { email: "cand1@example.com", full_name: "Cand One" }
              as: Anonymous
              captures: { cand_id: $.data.id }
            - call: "POST /actuarial/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: Registrar
            - call: "POST /actuarial/exam-registrations"
              payload: { exam_window_id: "${win_id}" }
              as: Candidate
              as_user_id: "${cand_id}"
              captures: { reg_id: $.data.id }
            - call: "POST /actuarial/_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-13T00:00:00Z" }
              as: Registrar
            - call: "POST /actuarial/exam-registrations/${reg_id}/record-score"
              payload: { raw_score: 39 }
              as: ExamCommittee
            - call: "GET /actuarial/exam-windows/${win_id}"
              as: Registrar
              captures: { win_ver: $.data.version }
            - call: "POST /actuarial/exam-windows/${win_id}/pass-mark-settings"
              payload: { proposed_mark: 6.5, expected_exam_window_version: "${win_ver}" }
              as: ExamCommittee
              captures: { pms_id: $.data.id }
            - call: "POST /actuarial/pass-mark-settings/${pms_id}/ratify"
              payload: { ratified_mark: 6.5 }
              as: ExamCommittee
            - call: "POST /actuarial/pass-mark-settings/${pms_id}/publish"
              payload: {}
              as: ExamCommittee
            - call: "POST /actuarial/vee-submissions"
              payload: { topic: "ECONOMICS", university: "State University", course_title: "EC101", grade_points: 3.3 }
              as: Candidate
              as_user_id: "${cand_id}"
              captures: { vee1: $.data.id }
            - call: "POST /actuarial/vee-submissions/${vee1}/review"
              payload: { decision: "APPROVE", reviewer_note: "verified" }
              as: AcademicReviewer
            - call: "POST /actuarial/vee-submissions"
              payload: { topic: "CORPORATE_FINANCE", university: "State University", course_title: "FN201", grade_points: 3.3 }
              as: Candidate
              as_user_id: "${cand_id}"
              captures: { vee2: $.data.id }
            - call: "POST /actuarial/vee-submissions/${vee2}/review"
              payload: { decision: "APPROVE", reviewer_note: "verified" }
              as: AcademicReviewer
            - call: "POST /actuarial/vee-submissions"
              payload: { topic: "APPLIED_STATISTICS", university: "State University", course_title: "ST301", grade_points: 3.3 }
              as: Candidate
              as_user_id: "${cand_id}"
              captures: { vee3: $.data.id }
            - call: "POST /actuarial/vee-submissions/${vee3}/review"
              payload: { decision: "APPROVE", reviewer_note: "verified" }
              as: AcademicReviewer
            - call: "GET /actuarial/candidates/${cand_id}"
              as: Registrar
              captures: { cand_ver: $.data.version }
            - call: "POST /actuarial/credential-applications"
              payload: { credential: "ASA", expected_candidate_version: "${cand_ver}" }
              as: Candidate
              as_user_id: "${cand_id}"
            - call: "POST /actuarial/cpd-attestations"
              payload: { cycle_year: 2027, attested_hours: 32, carryover_hours: 12 }
              as: Candidate
              as_user_id: "${cand_id}"
              captures: { cpd_id: $.data.id, req_hours: $.data.required_hours }
          trigger:
            - call: "POST /actuarial/cpd-attestations/${cpd_id}/verify"
              payload: { verified_hours: 18 }
              as: Registrar
              captures: { status_after: $.data.status, ver_hours: $.data.verified_hours }
          assert:
            - "setup capture: ${req_hours} == 20 (full-year base 30 minus min(12, 10) carryover)"
            - "attested variant would be compliant (attested_hours 32 >= 20) yet ${status_after} == SHORTFALL"
            - "${ver_hours} == 18 — only the verified variant drives status"

  # ---------------------------------------------------------------------------
  # Rule 2 — combinatorial formulas across different modes (a), (b), (c)
  # ---------------------------------------------------------------------------
  - rule_id: combinatorial_formula
    instances:
      - name: registration_fee_rounding_order_pinned
        grounds:
          - calculations.registration_fee_cents
          - entities.ExamRegistration.fields.fee_charged_cents
        distinguishing_aspect: |
          Mode (b) nested rounding: the scaffold pins processing-on-summed-subtotal
          (round once, half-up, then add). With base 20160 and late surcharge 10160
          the pinned order yields 30320 + round_half_up(454.8) = 30775, while the
          alternative per-component order yields 30320 + (302 + 152) = 30774 —
          exactly one cent apart.
        test_recipe:
          setup:
            - "ACTIVE syllabus with prelim exam P; window with base_fee_cents 20160 and late_surcharge_cents 10160, deadline 2026-10-01T00:00:00Z (late threshold 2026-09-17T00:00:00Z); clock at 2026-09-20 (late tier)"
          setup_api_calls:
            - call: "POST /actuarial/syllabus-versions"
              payload: { version_code: "2026-A" }
              as: Registrar
              captures: { syl_id: $.data.id }
            - call: "POST /actuarial/exams"
              payload: { exam_code: "P", title: "Probability", credit_hours: 10, syllabus_version_id: "${syl_id}" }
              as: Registrar
              captures: { exam_p_id: $.data.id }
            - call: "POST /actuarial/syllabus-versions/${syl_id}/activate"
              payload: {}
              as: Registrar
            - call: "POST /actuarial/exam-windows"
              payload: { exam_id: "${exam_p_id}", window_code: "P-2026-10", registration_opens_at: "2026-09-01T00:00:00Z", registration_deadline: "2026-10-01T00:00:00Z", testing_starts_at: "2026-10-10T09:00:00Z", testing_ends_at: "2026-10-12T17:00:00Z", capacity: 30, base_fee_cents: 20160, late_surcharge_cents: 10160 }
              as: Registrar
              captures: { win_id: $.data.id }
            - call: "POST /actuarial/candidates"
              payload: { email: "cand1@example.com", full_name: "Cand One" }
              as: Anonymous
              captures: { cand_id: $.data.id }
            - call: "POST /actuarial/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-20T00:00:00Z" }
              as: Registrar
          trigger:
            - call: "POST /actuarial/exam-registrations"
              payload: { exam_window_id: "${win_id}" }
              as: Candidate
              as_user_id: "${cand_id}"
              captures: { fee: $.data.fee_charged_cents, logistics: $.data.logistics_status }
          assert:
            - "${fee} == 30775 (20160 + 10160 + round_half_up(30320 * 0.015) = 30320 + 455)"
            - "${fee} != 30774 (the per-component rounding order is NOT used)"
            - "${logistics} == REGISTERED"
      - name: cpd_required_hours_proration_carryover_gate
        grounds:
          - calculations.cpd_required_hours
          - entities.CPDAttestation.fields.required_hours
        distinguishing_aspect: |
          Mode (a) >=3 inputs with non-linear interaction: required_hours combines
          a conditional branch (admitted-in-cycle proration by admission month),
          nested min/max (carryover capped at 10, result floored at 0). Candidate 1
          (admitted 2026) gets 30 - min(12,10) = 20; candidate 2 (admitted July
          2027, month 7 -> 6 months) gets ceil(30*6/12) - min(3,10) = 12.
        test_recipe:
          setup:
            - "Two ASSOCIATE-tier candidates: cand1 admitted 2026-10-13 (standard 2026 chain); cand2 admitted 2027-07-15 (2027 window chain, ASA filed at clock 2027-07-15)"
          setup_api_calls:
            - call: "POST /actuarial/syllabus-versions"
              payload: { version_code: "2026-A" }
              as: Registrar
              captures: { syl_id: $.data.id }
            - call: "POST /actuarial/exams"
              payload: { exam_code: "P", title: "Probability", credit_hours: 10, syllabus_version_id: "${syl_id}" }
              as: Registrar
              captures: { exam_p_id: $.data.id }
            - call: "POST /actuarial/syllabus-versions/${syl_id}/activate"
              payload: {}
              as: Registrar
            - call: "POST /actuarial/exam-windows"
              payload: { exam_id: "${exam_p_id}", window_code: "P-2026-10", registration_opens_at: "2026-09-01T00:00:00Z", registration_deadline: "2026-10-01T00:00:00Z", testing_starts_at: "2026-10-10T09:00:00Z", testing_ends_at: "2026-10-12T17:00:00Z", capacity: 30, base_fee_cents: 30000, late_surcharge_cents: 7500 }
              as: Registrar
              captures: { win1_id: $.data.id }
            - call: "POST /actuarial/exam-windows"
              payload: { exam_id: "${exam_p_id}", window_code: "P-2027-06", registration_opens_at: "2027-05-01T00:00:00Z", registration_deadline: "2027-06-01T00:00:00Z", testing_starts_at: "2027-06-10T09:00:00Z", testing_ends_at: "2027-06-12T17:00:00Z", capacity: 30, base_fee_cents: 30000, late_surcharge_cents: 7500 }
              as: Registrar
              captures: { win2_id: $.data.id }
            - call: "POST /actuarial/candidates"
              payload: { email: "cand1@example.com", full_name: "Cand One" }
              as: Anonymous
              captures: { cand1_id: $.data.id }
            - call: "POST /actuarial/candidates"
              payload: { email: "cand2@example.com", full_name: "Cand Two" }
              as: Anonymous
              captures: { cand2_id: $.data.id }
            - call: "POST /actuarial/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: Registrar
            - call: "POST /actuarial/exam-registrations"
              payload: { exam_window_id: "${win1_id}" }
              as: Candidate
              as_user_id: "${cand1_id}"
              captures: { reg1_id: $.data.id }
            - call: "POST /actuarial/_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-13T00:00:00Z" }
              as: Registrar
            - call: "POST /actuarial/exam-registrations/${reg1_id}/record-score"
              payload: { raw_score: 39 }
              as: ExamCommittee
            - call: "GET /actuarial/exam-windows/${win1_id}"
              as: Registrar
              captures: { win1_ver: $.data.version }
            - call: "POST /actuarial/exam-windows/${win1_id}/pass-mark-settings"
              payload: { proposed_mark: 6.5, expected_exam_window_version: "${win1_ver}" }
              as: ExamCommittee
              captures: { pms1_id: $.data.id }
            - call: "POST /actuarial/pass-mark-settings/${pms1_id}/ratify"
              payload: { ratified_mark: 6.5 }
              as: ExamCommittee
            - call: "POST /actuarial/pass-mark-settings/${pms1_id}/publish"
              payload: {}
              as: ExamCommittee
            - call: "POST /actuarial/vee-submissions"
              payload: { topic: "ECONOMICS", university: "State University", course_title: "EC101", grade_points: 3.3 }
              as: Candidate
              as_user_id: "${cand1_id}"
              captures: { v1a: $.data.id }
            - call: "POST /actuarial/vee-submissions/${v1a}/review"
              payload: { decision: "APPROVE", reviewer_note: "ok" }
              as: AcademicReviewer
            - call: "POST /actuarial/vee-submissions"
              payload: { topic: "CORPORATE_FINANCE", university: "State University", course_title: "FN201", grade_points: 3.3 }
              as: Candidate
              as_user_id: "${cand1_id}"
              captures: { v1b: $.data.id }
            - call: "POST /actuarial/vee-submissions/${v1b}/review"
              payload: { decision: "APPROVE", reviewer_note: "ok" }
              as: AcademicReviewer
            - call: "POST /actuarial/vee-submissions"
              payload: { topic: "APPLIED_STATISTICS", university: "State University", course_title: "ST301", grade_points: 3.3 }
              as: Candidate
              as_user_id: "${cand1_id}"
              captures: { v1c: $.data.id }
            - call: "POST /actuarial/vee-submissions/${v1c}/review"
              payload: { decision: "APPROVE", reviewer_note: "ok" }
              as: AcademicReviewer
            - call: "GET /actuarial/candidates/${cand1_id}"
              as: Registrar
              captures: { cand1_ver: $.data.version }
            - call: "POST /actuarial/credential-applications"
              payload: { credential: "ASA", expected_candidate_version: "${cand1_ver}" }
              as: Candidate
              as_user_id: "${cand1_id}"
              captures: { asa1_status: $.data.status }
            - call: "POST /actuarial/_clock/set_current_utc"
              payload: { to_iso8601: "2027-05-01T00:00:00Z" }
              as: Registrar
            - call: "POST /actuarial/exam-registrations"
              payload: { exam_window_id: "${win2_id}" }
              as: Candidate
              as_user_id: "${cand2_id}"
              captures: { reg2_id: $.data.id }
            - call: "POST /actuarial/_clock/set_current_utc"
              payload: { to_iso8601: "2027-06-13T00:00:00Z" }
              as: Registrar
            - call: "POST /actuarial/exam-registrations/${reg2_id}/record-score"
              payload: { raw_score: 39 }
              as: ExamCommittee
            - call: "GET /actuarial/exam-windows/${win2_id}"
              as: Registrar
              captures: { win2_ver: $.data.version }
            - call: "POST /actuarial/exam-windows/${win2_id}/pass-mark-settings"
              payload: { proposed_mark: 6.5, expected_exam_window_version: "${win2_ver}" }
              as: ExamCommittee
              captures: { pms2_id: $.data.id }
            - call: "POST /actuarial/pass-mark-settings/${pms2_id}/ratify"
              payload: { ratified_mark: 6.5 }
              as: ExamCommittee
            - call: "POST /actuarial/pass-mark-settings/${pms2_id}/publish"
              payload: {}
              as: ExamCommittee
            - call: "POST /actuarial/vee-submissions"
              payload: { topic: "ECONOMICS", university: "State University", course_title: "EC101", grade_points: 3.3 }
              as: Candidate
              as_user_id: "${cand2_id}"
              captures: { v2a: $.data.id }
            - call: "POST /actuarial/vee-submissions/${v2a}/review"
              payload: { decision: "APPROVE", reviewer_note: "ok" }
              as: AcademicReviewer
            - call: "POST /actuarial/vee-submissions"
              payload: { topic: "CORPORATE_FINANCE", university: "State University", course_title: "FN201", grade_points: 3.3 }
              as: Candidate
              as_user_id: "${cand2_id}"
              captures: { v2b: $.data.id }
            - call: "POST /actuarial/vee-submissions/${v2b}/review"
              payload: { decision: "APPROVE", reviewer_note: "ok" }
              as: AcademicReviewer
            - call: "POST /actuarial/vee-submissions"
              payload: { topic: "APPLIED_STATISTICS", university: "State University", course_title: "ST301", grade_points: 3.3 }
              as: Candidate
              as_user_id: "${cand2_id}"
              captures: { v2c: $.data.id }
            - call: "POST /actuarial/vee-submissions/${v2c}/review"
              payload: { decision: "APPROVE", reviewer_note: "ok" }
              as: AcademicReviewer
            - call: "POST /actuarial/_clock/set_current_utc"
              payload: { to_iso8601: "2027-07-15T00:00:00Z" }
              as: Registrar
            - call: "GET /actuarial/candidates/${cand2_id}"
              as: Registrar
              captures: { cand2_ver: $.data.version }
            - call: "POST /actuarial/credential-applications"
              payload: { credential: "ASA", expected_candidate_version: "${cand2_ver}" }
              as: Candidate
              as_user_id: "${cand2_id}"
              captures: { asa2_status: $.data.status }
          trigger:
            - call: "POST /actuarial/cpd-attestations"
              payload: { cycle_year: 2027, attested_hours: 5, carryover_hours: 12 }
              as: Candidate
              as_user_id: "${cand1_id}"
              captures: { req1: $.data.required_hours }
            - call: "POST /actuarial/cpd-attestations"
              payload: { cycle_year: 2027, attested_hours: 5, carryover_hours: 3 }
              as: Candidate
              as_user_id: "${cand2_id}"
              captures: { req2: $.data.required_hours }
          assert:
            - "${asa1_status} == APPROVED and ${asa2_status} == APPROVED"
            - "${req1} == 20 (full-year base 30 - min(12, 10))"
            - "${req2} == 12 (admitted month 7 -> ceil(30 * 6 / 12) = 15; 15 - min(3, 10))"
      - name: track_completion_pct_two_phase_evaluation
        grounds:
          - calculations.track_completion_pct
          - entities.TrackEnrollment.fields.completion_pct
          - state_machines.TrackEnrollment.ENROLLED_to_CAPSTONE_ELIGIBLE
          - state_machines.TrackEnrollment.CAPSTONE_ELIGIBLE_to_COMPLETED
