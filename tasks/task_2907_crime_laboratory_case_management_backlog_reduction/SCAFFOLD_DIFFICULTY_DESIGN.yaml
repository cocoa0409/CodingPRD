              as: QualityManager
              captures: { m1: $.data.id }
            - call: "POST /lab/methods/${m1}/validate"
              payload: { validation_study_item_count: 22, precision_cv_pct: 1.00, expires_at_utc: "2027-08-01T00:00:00Z" }
