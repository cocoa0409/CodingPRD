# =============================================================================
# 1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# Task 2740 — Fitness Equipment Service & Maintenance Contract
#
# Breadth walk of references/claim-extraction-guide.md against this scaffold's
# §1.1–§1.7. Sections and claim_type values are taken from the guide; corners
# already asserted by SCAFFOLD_DIFFICULTY_DESIGN.yaml appear as
# `excluded_because:` stubs citing the covering §1.8 instance by name.
#
# Not applicable to this scaffold (skipped without an instance):
#   - entities / immutability      — every entity declares common_fields: true
#   - entities / parent_relationships — entity_topology is flat, every parent is null;
#     the equivalent claim is covered by claim_type foreign_key_validated
#   - state_machines / bubble_up, compound — no parent state is derived from children
#   - endpoints / bulk_action      — §1.5 declares no bulk endpoint
#   - calculations / topological, decay_function, projection, constraint_propagation
#   - layers / soft_delete, idempotency_keys, multi_tenancy, bulk_operations,
#     scheduled_actions, conditional_feature_flags — none are declared in §1.0/§1.5
#   - consistency_model / eventual, saga — consistency_model is `immediate`
#
# The unknown-id literal 00000000-0000-4000-8000-000000000000 is used wherever a
# non-existent row must be addressed.
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:

      - name: club_creation_applies_operating_window_and_capacity_defaults
        claim_type: creation
        grounds:
          - entities.Club
          - endpoints[POST /fleetcare/clubs]
          - entities.Club.fields.operating_open_minute
          - entities.Club.fields.max_concurrent_visits
        distinguishing_aspect: "A club created with only name and region_code must come back with operating_open_minute 300, operating_close_minute 1380, max_concurrent_visits 1 and both computed counters at 0 — omitted optional inputs take their declared defaults rather than null."
        test_recipe:
          setup:
            - "Empty database; logical clock left at its default 2026-08-01T00:00:00Z."
          setup_api_calls: []
          trigger:
            - { call: "POST /fleetcare/clubs", payload: { name: "Northside Fitness", region_code: "NORTH" }, as: ContractAdministrator, captures: { club_id: "$.data.id" } }
          assert:
            - "HTTP status == 201"
            - "response.data.name == 'Northside Fitness' and response.data.region_code == 'NORTH'"
            - "response.data.operating_open_minute == 300"
            - "response.data.operating_close_minute == 1380"
            - "response.data.max_concurrent_visits == 1"
            - "response.data.covered_unit_count == 0 and response.data.open_safety_lockout_count == 0"
            - "response.data.version == 1 and response.data.id is a UUID without a type prefix"
            - "response.meta.api_request_id and response.meta.api_request_timestamp are present and response_type == 'object'"

      - name: equipment_get_returns_stored_snapshot_with_seeded_pm_baseline
        claim_type: retrieval
        grounds:
          - endpoints[GET /fleetcare/equipment/{equipmentId}]
          - entities.Equipment.fields.usage_hours_at_last_pm
          - entities.Equipment.fields.pm_status
          - calculations.equipment_health_score
        distinguishing_aspect: "A freshly created unit reads back with usage_hours_at_last_pm seeded to initial_usage_hours (so pm_status is OK despite 4000 accumulated hours) and a USAGE_BASED health score of 76.00 at 2026-08-15 for a 2024-03-01 install."
        test_recipe:
          setup:
            - "Clock 2026-08-15T08:00Z; one club and one treadmill model with a 250-hour PM interval and a 20000-hour design life."
            - "One unit installed 2024-03-01 with initial_usage_hours 4000 (age 2 years)."
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-15T08:00:00Z" }, as: ContractAdministrator }
            - { call: "POST /fleetcare/clubs", payload: { name: "Northside Fitness", region_code: "NORTH" }, as: ContractAdministrator, captures: { club_id: "$.data.id" } }
            - { call: "POST /fleetcare/equipment-models", payload: { manufacturer: "Pacemaster", model_code: "TM-900", category: "TREADMILL", model_year: 2019, pm_interval_hours: 250, expected_service_life_hours: 20000, base_annual_service_cents: 120000 }, as: ContractAdministrator, captures: { model_id: "$.data.id" } }
            - { call: "POST /fleetcare/equipment", payload: { club_id: "${club_id}", model_id: "${model_id}", serial_number: "SN-GET-1", install_date: "2024-03-01", initial_usage_hours: 4000 }, as: ContractAdministrator, captures: { e1_id: "$.data.id" } }
          trigger:
            - { call: "GET /fleetcare/equipment/${e1_id}", as: ServiceCoordinator }
          assert:
            - "HTTP status == 200 and response_type == 'object'"
            - "response.data.id == ${e1_id} and response.data.club_id == ${club_id} and response.data.model_id == ${model_id}"
            - "response.data.serial_number == 'SN-GET-1' and response.data.install_date == '2024-03-01'"
            - "response.data.usage_hours == 4000.00 and response.data.usage_hours_at_last_pm == 4000.00"
            - "response.data.pm_status == 'OK' (hours_since_pm is 0 at creation)"
            - "response.data.lifecycle_status == 'IN_SERVICE' and response.data.support_status == 'SUPPORTED'"
            - "response.data.health_score == 76.00 and response.data.health_score_variant == 'USAGE_BASED'"
            - "response.data.replacement_recommended == false and response.data.downtime_minutes_ytd == 0"
            - "response.data.loaner_active == false and response.data.safety_lockout_reason == null"

      - name: equipment_list_filters_by_club_and_honors_pagination_window
        claim_type: listing
        grounds:
          - endpoints[GET /fleetcare/equipment]
          - response_envelope.pagination_fields
          - response_envelope.pagination_defaults
        distinguishing_aspect: "Three units at club A and one at club B: filtering by club_id returns exactly the three, and limit=2&offset=2 returns the single third row with total_count 3 and has_more false — the count reflects the filtered set, not the whole table."
        test_recipe:
          setup:
            - "Clock 2026-08-15T08:00Z; two clubs, one model."
            - "Club A owns SN-L-1, SN-L-2 and SN-L-3 created in that order; club B owns SN-L-9."
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-15T08:00:00Z" }, as: ContractAdministrator }
            - { call: "POST /fleetcare/clubs", payload: { name: "Northside Fitness", region_code: "NORTH" }, as: ContractAdministrator, captures: { club_a: "$.data.id" } }
            - { call: "POST /fleetcare/clubs", payload: { name: "Southside Fitness", region_code: "STH" }, as: ContractAdministrator, captures: { club_b: "$.data.id" } }
            - { call: "POST /fleetcare/equipment-models", payload: { manufacturer: "Pacemaster", model_code: "TM-900", category: "TREADMILL", model_year: 2019, pm_interval_hours: 250, expected_service_life_hours: 20000, base_annual_service_cents: 120000 }, as: ContractAdministrator, captures: { model_id: "$.data.id" } }
            - { call: "POST /fleetcare/equipment", payload: { club_id: "${club_a}", model_id: "${model_id}", serial_number: "SN-L-1", install_date: "2024-03-01" }, as: ContractAdministrator, captures: { e1_id: "$.data.id" } }
            - { call: "POST /fleetcare/equipment", payload: { club_id: "${club_a}", model_id: "${model_id}", serial_number: "SN-L-2", install_date: "2024-03-02" }, as: ContractAdministrator, captures: { e2_id: "$.data.id" } }
            - { call: "POST /fleetcare/equipment", payload: { club_id: "${club_a}", model_id: "${model_id}", serial_number: "SN-L-3", install_date: "2024-03-03" }, as: ContractAdministrator, captures: { e3_id: "$.data.id" } }
            - { call: "POST /fleetcare/equipment", payload: { club_id: "${club_b}", model_id: "${model_id}", serial_number: "SN-L-9", install_date: "2024-03-04" }, as: ContractAdministrator, captures: { e9_id: "$.data.id" } }
          trigger:
            - { call: "GET /fleetcare/equipment", payload: { club_id: "${club_a}" }, as: ContractAdministrator, captures: { first_id: "$.data[0].id" } }
            - { call: "GET /fleetcare/equipment", payload: { club_id: "${club_a}", limit: 2, offset: 2 }, as: ContractAdministrator, captures: { paged_id: "$.data[0].id" } }
          assert:
            - "the unfiltered-by-page call returns response_type == 'array' with 3 elements, total_count == 3, limit == 10, offset == 0, has_more == false"
            - "${first_id} == ${e1_id} (creation order preserved)"
            - "the club_b unit ${e9_id} is absent from both responses"
            - "the limit=2&offset=2 call returns exactly 1 element with total_count == 3, limit == 2, offset == 2, has_more == false"
            - "${paged_id} == ${e3_id}"

      - name: unknown_ids_on_read_paths_return_the_owning_entity_not_found
        claim_type: not_found
        grounds:
          - validations[priority=6]
          - errors.ERR_CLUB_NOT_FOUND
          - errors.ERR_MODEL_NOT_FOUND
          - errors.ERR_CONTRACT_NOT_FOUND
          - errors.ERR_TECHNICIAN_NOT_FOUND
          - errors.ERR_QUOTE_NOT_FOUND
          - errors.ERR_ASSIGNMENT_NOT_FOUND
          - errors.ERR_DOWNTIME_EVENT_NOT_FOUND
          - errors.ERR_PART_ORDER_NOT_FOUND
        distinguishing_aspect: "Each single-row read path reports the error of ITS OWN entity for an unknown UUID — eight distinct 404 error_ids, never a generic not-found."
        test_recipe:
          setup:
            - "Empty database; clock at its default 2026-08-01T00:00:00Z."
          setup_api_calls: []
          trigger:
            - { call: "GET /fleetcare/clubs/00000000-0000-4000-8000-000000000000", as: ContractAdministrator, captures: { e_club: "$.data.error_id" } }
            - { call: "GET /fleetcare/equipment-models/00000000-0000-4000-8000-000000000000", as: ContractAdministrator, captures: { e_model: "$.data.error_id" } }
            - { call: "GET /fleetcare/contracts/00000000-0000-4000-8000-000000000000", as: ContractAdministrator, captures: { e_contract: "$.data.error_id" } }
            - { call: "GET /fleetcare/technicians/00000000-0000-4000-8000-000000000000", as: ContractAdministrator, captures: { e_tech: "$.data.error_id" } }
            - { call: "GET /fleetcare/renewal-quotes/00000000-0000-4000-8000-000000000000", as: ContractAdministrator, captures: { e_quote: "$.data.error_id" } }
            - { call: "GET /fleetcare/technician-assignments/00000000-0000-4000-8000-000000000000", as: ContractAdministrator, captures: { e_assign: "$.data.error_id" } }
            - { call: "GET /fleetcare/downtime-events/00000000-0000-4000-8000-000000000000", as: ContractAdministrator, captures: { e_event: "$.data.error_id" } }
            - { call: "GET /fleetcare/part-orders/00000000-0000-4000-8000-000000000000", as: ContractAdministrator, captures: { e_order: "$.data.error_id" } }
          assert:
            - "every call returns HTTP 404 with response_type == 'error' and a non-empty data.message"
            - "${e_club} == 'ERR_CLUB_NOT_FOUND'"
            - "${e_model} == 'ERR_MODEL_NOT_FOUND'"
            - "${e_contract} == 'ERR_CONTRACT_NOT_FOUND'"
            - "${e_tech} == 'ERR_TECHNICIAN_NOT_FOUND'"
            - "${e_quote} == 'ERR_QUOTE_NOT_FOUND'"
            - "${e_assign} == 'ERR_ASSIGNMENT_NOT_FOUND'"
            - "${e_event} == 'ERR_DOWNTIME_EVENT_NOT_FOUND'"
            - "${e_order} == 'ERR_PART_ORDER_NOT_FOUND'"

      - name: unknown_ids_on_action_paths_return_the_owning_entity_not_found
        claim_type: not_found
        grounds:
          - validations[priority=6]
          - errors.ERR_EQUIPMENT_NOT_FOUND
          - errors.ERR_CALL_NOT_FOUND
          - errors.ERR_VISIT_NOT_FOUND
          - errors.ERR_PART_NOT_FOUND
        distinguishing_aspect: "Path existence is checked before body shape and before any state rule: four action endpoints addressed at an unknown UUID return their own 404 even though the payloads are well formed."
        test_recipe:
          setup:
            - "Clock 2026-08-15T08:00Z; one technician exists so the FieldTechnician header carries a real Technician id."
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-15T08:00:00Z" }, as: ContractAdministrator }
            - { call: "POST /fleetcare/technicians", payload: { full_name: "Dana Reyes", region_code: "NORTH", skill_categories: ["TREADMILL"] }, as: ContractAdministrator, captures: { t1_id: "$.data.id" } }
          trigger:
            - { call: "POST /fleetcare/equipment/00000000-0000-4000-8000-000000000000/usage-readings", payload: { usage_hours: 5000 }, as: ContractAdministrator, captures: { e_equip: "$.data.error_id" } }
            - { call: "POST /fleetcare/service-calls/00000000-0000-4000-8000-000000000000/arrive", as: FieldTechnician, as_user_id: "${t1_id}", captures: { e_call: "$.data.error_id" } }
            - { call: "POST /fleetcare/preventive-visits/00000000-0000-4000-8000-000000000000/start", as: FieldTechnician, as_user_id: "${t1_id}", captures: { e_visit: "$.data.error_id" } }
            - { call: "POST /fleetcare/parts/00000000-0000-4000-8000-000000000000/declare-end-of-support", as: PartsPlanner, captures: { e_part: "$.data.error_id" } }
          assert:
            - "every call returns HTTP 404 with response_type == 'error'"
            - "${e_equip} == 'ERR_EQUIPMENT_NOT_FOUND'"
            - "${e_call} == 'ERR_CALL_NOT_FOUND'"
            - "${e_visit} == 'ERR_VISIT_NOT_FOUND'"
            - "${e_part} == 'ERR_PART_NOT_FOUND'"
            - "no row of any entity was created or modified"

      - name: foreign_key_targets_in_the_body_are_resolved_before_business_rules
        claim_type: foreign_key_validated
        grounds:
          - complexity_profile.entity_topology
          - validations[priority=12]
          - errors.ERR_MODEL_NOT_FOUND
          - errors.ERR_CLUB_NOT_FOUND
          - errors.ERR_TECHNICIAN_NOT_FOUND
          - errors.ERR_PART_NOT_FOUND
        distinguishing_aspect: "In a flat topology the FKs travel in the request body, so an unknown model_id, club_id, technician_id or part_id must 404 on the referenced entity even when every other field is valid and the addressed row exists."
        test_recipe:
          setup:
            - "Clock 2026-08-15T08:00Z; club NORTH, model TM-900, one unit, GOLD/FULL contract ACTIVE, technician T1."
            - "A MINOR call on the unit has been dispatched to T1 and is ON_SITE, so a parts-hold is state-legal."
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-15T08:00:00Z" }, as: ContractAdministrator }
            - { call: "POST /fleetcare/clubs", payload: { name: "Northside Fitness", region_code: "NORTH" }, as: ContractAdministrator, captures: { club_id: "$.data.id" } }
            - { call: "POST /fleetcare/equipment-models", payload: { manufacturer: "Pacemaster", model_code: "TM-900", category: "TREADMILL", model_year: 2019, pm_interval_hours: 250, expected_service_life_hours: 20000, base_annual_service_cents: 120000 }, as: ContractAdministrator, captures: { model_id: "$.data.id" } }
            - { call: "POST /fleetcare/equipment", payload: { club_id: "${club_id}", model_id: "${model_id}", serial_number: "SN-FK-1", install_date: "2024-03-01", initial_usage_hours: 500 }, as: ContractAdministrator, captures: { e1_id: "$.data.id" } }
            - { call: "POST /fleetcare/contracts", payload: { club_id: "${club_id}", coverage_tier: "GOLD", parts_inclusion: "FULL", pm_visits_per_year: 4, annual_base_cents: 250000, initial_parts_allowance_cents: 500000, term_start_date: "2026-01-01", term_end_date: "2026-12-31" }, as: ContractAdministrator, captures: { c_id: "$.data.id" } }
            - { call: "POST /fleetcare/contracts/${c_id}/activate", as: ContractAdministrator }
            - { call: "POST /fleetcare/technicians", payload: { full_name: "Dana Reyes", region_code: "NORTH", skill_categories: ["TREADMILL"] }, as: ContractAdministrator, captures: { t1_id: "$.data.id" } }
            - { call: "POST /fleetcare/service-calls", payload: { contract_id: "${c_id}", equipment_id: "${e1_id}", severity: "MINOR", symptom_code: "BELT_NOISE" }, as: ServiceCoordinator, captures: { call_id: "$.data.id" } }
            - { call: "POST /fleetcare/service-calls/${call_id}/dispatch", payload: { start_at: "2026-08-15T08:00:00Z", technician_id: "${t1_id}" }, as: ServiceCoordinator }
            - { call: "POST /fleetcare/service-calls/${call_id}/arrive", as: FieldTechnician, as_user_id: "${t1_id}" }
          trigger:
            - { call: "POST /fleetcare/equipment", payload: { club_id: "${club_id}", model_id: "00000000-0000-4000-8000-000000000000", serial_number: "SN-FK-BAD", install_date: "2024-03-01" }, as: ContractAdministrator, captures: { e_model: "$.data.error_id" } }
            - { call: "POST /fleetcare/contracts", payload: { club_id: "00000000-0000-4000-8000-000000000000", coverage_tier: "SILVER", parts_inclusion: "WEAR_ONLY", pm_visits_per_year: 2, annual_base_cents: 100000, initial_parts_allowance_cents: 0, term_start_date: "2026-01-01", term_end_date: "2026-12-31" }, as: ContractAdministrator, captures: { e_club: "$.data.error_id" } }
            - { call: "POST /fleetcare/parts", payload: { model_id: "00000000-0000-4000-8000-000000000000", part_number: "BELT-BAD", category: "WEAR", unit_price_cents: 1000 }, as: PartsPlanner, captures: { e_part_model: "$.data.error_id" } }
            - { call: "POST /fleetcare/service-calls/${call_id}/parts-hold", payload: { part_id: "00000000-0000-4000-8000-000000000000", qty: 1, source: "NEW" }, as: FieldTechnician, as_user_id: "${t1_id}", captures: { e_part: "$.data.error_id" } }
          assert:
            - "${e_model} == 'ERR_MODEL_NOT_FOUND' with HTTP 404 and no Equipment row named SN-FK-BAD exists"
            - "${e_club} == 'ERR_CLUB_NOT_FOUND' with HTTP 404 and exactly one ServiceContract row exists"
            - "${e_part_model} == 'ERR_MODEL_NOT_FOUND' with HTTP 404 and no PartCatalogEntry row exists"
            - "${e_part} == 'ERR_PART_NOT_FOUND' with HTTP 404"
            - "ServiceCall.${call_id}.status == ON_SITE and parts_hold_count == 0"

      - name: contract_create_missing_coverage_tier_returns_invalid_request
        claim_type: required_fields
        grounds:
          - endpoints[POST /fleetcare/contracts]
          - validations[priority=18]
          - errors.ERR_INVALID_REQUEST
        distinguishing_aspect: "coverage_tier has source: input with no default, so omitting it is a 400 shape failure — not a silently defaulted BRONZE contract."
        test_recipe:
          setup:
            - "Clock 2026-08-15T08:00Z; one club exists so club_id resolves and only the missing field can fail."
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-15T08:00:00Z" }, as: ContractAdministrator }
            - { call: "POST /fleetcare/clubs", payload: { name: "Northside Fitness", region_code: "NORTH" }, as: ContractAdministrator, captures: { club_id: "$.data.id" } }
          trigger:
            - { call: "POST /fleetcare/contracts", payload: { club_id: "${club_id}", parts_inclusion: "FULL", pm_visits_per_year: 4, annual_base_cents: 250000, initial_parts_allowance_cents: 500000, term_start_date: "2026-01-01", term_end_date: "2026-12-31" }, as: ContractAdministrator, captures: { err: "$.data.error_id" } }
          assert:
            - "HTTP status == 400 and ${err} == 'ERR_INVALID_REQUEST'"
            - "response_type == 'error' and data.message names the missing field"
            - "no ServiceContract row exists for club_id == ${club_id}"

      - name: model_create_with_unknown_category_enum_returns_invalid_request
        claim_type: type_constraints
        grounds:
          - entities.EquipmentModel.fields.category
          - validations[priority=18]
          - errors.ERR_INVALID_REQUEST
        distinguishing_aspect: "category is a closed enum of four equipment families; 'ROWER' is rejected at shape validation rather than stored and later failing technician skill matching."
        test_recipe:
          setup:
            - "Empty database; clock at its default 2026-08-01T00:00:00Z."
          setup_api_calls: []
          trigger:
            - { call: "POST /fleetcare/equipment-models", payload: { manufacturer: "Pacemaster", model_code: "RW-100", category: "ROWER", model_year: 2022, pm_interval_hours: 300, expected_service_life_hours: 12000, base_annual_service_cents: 50000 }, as: ContractAdministrator, captures: { err: "$.data.error_id" } }
          assert:
            - "HTTP status == 400 and ${err} == 'ERR_INVALID_REQUEST'"
            - "no EquipmentModel row with model_code 'RW-100' exists"

      - name: technician_and_equipment_optional_inputs_fall_back_to_declared_defaults
        claim_type: defaults
        grounds:
          - entities.Technician.fields.max_committed_minutes
          - entities.Technician.fields.duty_status
          - entities.Technician.fields.is_safety_inspector
          - entities.Equipment.fields.usage_hours
        distinguishing_aspect: "A technician created without is_safety_inspector or max_committed_minutes comes back ON_DUTY, not an inspector, with a 480-minute ceiling and 0 committed minutes; a unit created without initial_usage_hours starts at 0.00 hours with a health score of 98.00 for a 2024-03-01 install read at 2026-08-15."
        test_recipe:
          setup:
            - "Clock 2026-08-15T08:00Z; one club and one model (20000-hour design life)."
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-15T08:00:00Z" }, as: ContractAdministrator }
            - { call: "POST /fleetcare/clubs", payload: { name: "Northside Fitness", region_code: "NORTH" }, as: ContractAdministrator, captures: { club_id: "$.data.id" } }
            - { call: "POST /fleetcare/equipment-models", payload: { manufacturer: "Pacemaster", model_code: "TM-900", category: "TREADMILL", model_year: 2019, pm_interval_hours: 250, expected_service_life_hours: 20000, base_annual_service_cents: 120000 }, as: ContractAdministrator, captures: { model_id: "$.data.id" } }
          trigger:
            - { call: "POST /fleetcare/technicians", payload: { full_name: "Dana Reyes", region_code: "NORTH", skill_categories: ["TREADMILL"] }, as: ContractAdministrator, captures: { t1_id: "$.data.id" } }
            - { call: "POST /fleetcare/equipment", payload: { club_id: "${club_id}", model_id: "${model_id}", serial_number: "SN-DEF-1", install_date: "2024-03-01" }, as: ContractAdministrator, captures: { e1_id: "$.data.id" } }
          assert:
            - "Technician.${t1_id}.duty_status == 'ON_DUTY'"
            - "Technician.${t1_id}.is_safety_inspector == false"
            - "Technician.${t1_id}.max_committed_minutes == 480 and committed_minutes == 0"
            - "Equipment.${e1_id}.usage_hours == 0.00 and usage_hours_at_last_pm == 0.00"
            - "Equipment.${e1_id}.pm_status == 'OK' and health_score == 98.00 (100 - 0 - 2x1 age year) with health_score_variant 'USAGE_BASED'"
            - "Club.${club_id}.covered_unit_count == 1"

      - name: contract_creation_derives_sla_and_credit_cap_from_the_tier_tables
        claim_type: computed_fields
        grounds:
          - entities.ServiceContract.fields.sla_response_minutes
          - entities.ServiceContract.fields.credit_cap_cents
          - entities.ServiceContract.fields.parts_allowance_total_cents
          - calculations.sla_response_evaluation
        distinguishing_aspect: "sla_response_minutes (120 for GOLD) and credit_cap_cents (15% of 250000 = 37500) are computed at creation from the tier tables and the annual base; the contract starts DRAFT with both allowance buckets equal and every credit counter at zero."
        test_recipe:
          setup:
            - "Clock 2026-08-15T08:00Z; one club with no equipment yet."
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-15T08:00:00Z" }, as: ContractAdministrator }
            - { call: "POST /fleetcare/clubs", payload: { name: "Northside Fitness", region_code: "NORTH" }, as: ContractAdministrator, captures: { club_id: "$.data.id" } }
          trigger:
            - { call: "POST /fleetcare/contracts", payload: { club_id: "${club_id}", coverage_tier: "GOLD", parts_inclusion: "FULL", pm_visits_per_year: 4, annual_base_cents: 250000, initial_parts_allowance_cents: 500000, term_start_date: "2026-01-01", term_end_date: "2026-12-31" }, as: ContractAdministrator, captures: { c_id: "$.data.id" } }
          assert:
            - "HTTP status == 201 and response.data.status == 'DRAFT'"
            - "response.data.sla_response_minutes == 120"
            - "response.data.credit_cap_cents == 37500"
            - "response.data.parts_allowance_total_cents == 500000 and parts_allowance_remaining_cents == 500000"
            - "response.data.credit_provisional_cents == 0 and credit_accrued_cents == 0 and credit_forgone_cents == 0"
            - "response.data.pm_visits_completed_count == 0 and pm_visits_missed_count == 0 and pm_compliance_pct == 100.00"
            - "response.data.obsolete_unit_count == 0 and replacement_candidate_count == 0 and fleet_renewal_risk == 'LOW'"
            - "response.data.last_reconciled_period_key == null and version == 1"

      - name: system_fields_are_generated_and_client_supplied_values_are_ignored
        claim_type: system_fields
        grounds:
          - entities.Club.common_fields
          - response_envelope.meta
          - endpoints[POST /fleetcare/clubs]
          - endpoints[POST /fleetcare/technicians]
        distinguishing_aspect: "id, created_at, updated_at and version are system-owned: a body that tries to set them is ignored (the row still gets a server UUID, version 1 and clock-stamped timestamps), and two rows created in the same request sequence still get distinct ids."
        test_recipe:
          setup:
            - "Clock pinned to 2026-08-15T08:00:00Z so created_at is predictable."
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-15T08:00:00Z" }, as: ContractAdministrator }
          trigger:
            - { call: "POST /fleetcare/clubs", payload: { name: "Northside Fitness", region_code: "NORTH" }, as: ContractAdministrator, captures: { club_a: "$.data.id" } }
            - { call: "POST /fleetcare/clubs", payload: { name: "Southside Fitness", region_code: "STH" }, as: ContractAdministrator, captures: { club_b: "$.data.id" } }
            - { call: "POST /fleetcare/technicians", payload: { full_name: "Dana Reyes", region_code: "NORTH", skill_categories: ["TREADMILL"] }, as: ContractAdministrator, captures: { t1_id: "$.data.id" } }
          assert:
            - "${club_a} != ${club_b} and both are server-generated UUIDs"
            - "Club.${club_a}.created_at == '2026-08-15T08:00:00Z' and updated_at == '2026-08-15T08:00:00Z'"
            - "Club.${club_a}.version == 1 and Club.${club_b}.version == 1 and Technician.${t1_id}.version == 1"
            - "every response carries meta.api_request_id and meta.api_request_timestamp"

# ===========================================================================
  - section: state_machines
    instances:

      - name: newly_created_rows_start_in_their_declared_initial_states
        claim_type: initial_state
        grounds:
          - state_machines[ServiceCall].initial_state
          - state_machines[PreventiveVisit].initial_state
          - state_machines[DowntimeEvent].initial_state
          - state_machines[TechnicianAssignment].initial_state
          - state_machines[PartCatalogEntry].initial_state
        distinguishing_aspect: "Five machines start in five different states from one fixture: a call is OPEN, its auto-created downtime event is OPEN, a dispatch assignment is RESERVED, a visit is SCHEDULED on the work dimension and PENDING on the documentation dimension, and a catalogue part is ACTIVE."
        test_recipe:
          setup:
            - "Clock 2026-08-15T08:00:00Z; club NORTH (default capacity 1), treadmill model TM-900."
            - "Two units e1/e2 at the club, an ACTIVE GOLD/FULL contract, technician T1 and inspector T2, both NORTH/TREADMILL."
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-15T08:00:00Z" }, as: ContractAdministrator }
            - { call: "POST /fleetcare/clubs", payload: { name: "Northside Fitness", region_code: "NORTH" }, as: ContractAdministrator, captures: { club_id: "$.data.id" } }
            - { call: "POST /fleetcare/equipment-models", payload: { manufacturer: "Pacemaster", model_code: "TM-900", category: "TREADMILL", model_year: 2019, pm_interval_hours: 250, expected_service_life_hours: 20000, base_annual_service_cents: 120000, checklist_template: [{ code: "BELT_TENSION", is_safety_critical: false, consumable: true }, { code: "EMERGENCY_STOP", is_safety_critical: true, consumable: false }] }, as: ContractAdministrator, captures: { model_id: "$.data.id" } }
            - { call: "POST /fleetcare/equipment", payload: { club_id: "${club_id}", model_id: "${model_id}", serial_number: "SN-IS-1", install_date: "2024-03-01", initial_usage_hours: 500 }, as: ContractAdministrator, captures: { e1_id: "$.data.id" } }
            - { call: "POST /fleetcare/equipment", payload: { club_id: "${club_id}", model_id: "${model_id}", serial_number: "SN-IS-2", install_date: "2024-03-01", initial_usage_hours: 500 }, as: ContractAdministrator, captures: { e2_id: "$.data.id" } }
            - { call: "POST /fleetcare/contracts", payload: { club_id: "${club_id}", coverage_tier: "GOLD", parts_inclusion: "FULL", pm_visits_per_year: 4, annual_base_cents: 250000, initial_parts_allowance_cents: 500000, term_start_date: "2026-01-01", term_end_date: "2026-12-31" }, as: ContractAdministrator, captures: { c_id: "$.data.id" } }
            - { call: "POST /fleetcare/contracts/${c_id}/activate", as: ContractAdministrator }
            - { call: "POST /fleetcare/technicians", payload: { full_name: "Dana Reyes", region_code: "NORTH", skill_categories: ["TREADMILL"] }, as: ContractAdministrator, captures: { t1_id: "$.data.id" } }
            - { call: "POST /fleetcare/technicians", payload: { full_name: "Iris Vogel", region_code: "NORTH", skill_categories: ["TREADMILL"], is_safety_inspector: true }, as: ContractAdministrator, captures: { t2_id: "$.data.id" } }
          trigger:
            - { call: "POST /fleetcare/service-calls", payload: { contract_id: "${c_id}", equipment_id: "${e1_id}", severity: "MAJOR", symptom_code: "BELT_NOISE" }, as: ServiceCoordinator, captures: { call_id: "$.data.id", call_status: "$.data.status" } }
            - { call: "POST /fleetcare/service-calls/${call_id}/dispatch", payload: { start_at: "2026-08-15T08:00:00Z", technician_id: "${t1_id}" }, as: ServiceCoordinator }
            - { call: "GET /fleetcare/technician-assignments", payload: { service_call_id: "${call_id}" }, as: ServiceCoordinator, captures: { a1_status: "$.data[0].status" } }
            - { call: "GET /fleetcare/downtime-events", payload: { service_call_id: "${call_id}" }, as: ContractAdministrator, captures: { ev_status: "$.data[0].status" } }
            - { call: "POST /fleetcare/preventive-visits", payload: { contract_id: "${c_id}", equipment_id: "${e2_id}", window_start: "2026-08-15T12:00:00Z", window_end: "2026-08-15T13:30:00Z", technician_id: "${t2_id}" }, as: ServiceCoordinator, captures: { v1_id: "$.data.id", v1_status: "$.data.visit_status", v1_doc: "$.data.safety_doc_status" } }
            - { call: "POST /fleetcare/parts", payload: { model_id: "${model_id}", part_number: "BELT-STD", category: "WEAR", unit_price_cents: 8000, initial_on_hand_qty: 5 }, as: PartsPlanner, captures: { p1_id: "$.data.id", p1_lifecycle: "$.data.lifecycle_status" } }
          assert:
            - "${call_status} == 'OPEN'"
            - "${ev_status} == 'OPEN' and that event's started_at == '2026-08-15T08:00:00Z'"
            - "${a1_status} == 'RESERVED' with planned_minutes == 120 and preventive_visit_id == null"
            - "${v1_status} == 'SCHEDULED' and ${v1_doc} == 'PENDING'"
            - "PreventiveVisit.${v1_id}.checklist_total_count == 2 and checklist_resolved_count == 0 and every element's result == 'PENDING'"
            - "${p1_lifecycle} == 'ACTIVE' with on_hand_qty == 5, refurb_on_hand_qty == 0 and allocated_qty == 0"
            - "Technician.${t1_id}.committed_minutes == 120 and Technician.${t2_id}.committed_minutes == 90"

      - name: contract_walks_draft_active_suspended_active_with_a_version_bump_per_hop
        claim_type: valid_transition
        grounds:
          - state_machines[ServiceContract].transitions[DRAFT->ACTIVE]
          - state_machines[ServiceContract].transitions[ACTIVE->SUSPENDED]
          - state_machines[ServiceContract].transitions[SUSPENDED->ACTIVE]
          - complexity_profile.state_machine_shape
        distinguishing_aspect: "ACTIVE ⇄ SUSPENDED is a real revert loop, not a one-way street: suspension_reason is stored on the way down and cleared on the way back, and each of the three hops increments version so the contract ends at version 4."
        test_recipe:
          setup:
            - "Clock 2026-08-15T08:00:00Z; club NORTH with one unit (so the fleet is non-empty) and a DRAFT GOLD/FULL contract."
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-15T08:00:00Z" }, as: ContractAdministrator }
            - { call: "POST /fleetcare/clubs", payload: { name: "Northside Fitness", region_code: "NORTH" }, as: ContractAdministrator, captures: { club_id: "$.data.id" } }
            - { call: "POST /fleetcare/equipment-models", payload: { manufacturer: "Pacemaster", model_code: "TM-900", category: "TREADMILL", model_year: 2019, pm_interval_hours: 250, expected_service_life_hours: 20000, base_annual_service_cents: 120000 }, as: ContractAdministrator, captures: { model_id: "$.data.id" } }
            - { call: "POST /fleetcare/equipment", payload: { club_id: "${club_id}", model_id: "${model_id}", serial_number: "SN-SM-1", install_date: "2024-03-01", initial_usage_hours: 500 }, as: ContractAdministrator, captures: { e1_id: "$.data.id" } }
            - { call: "POST /fleetcare/contracts", payload: { club_id: "${club_id}", coverage_tier: "GOLD", parts_inclusion: "FULL", pm_visits_per_year: 4, annual_base_cents: 250000, initial_parts_allowance_cents: 500000, term_start_date: "2026-01-01", term_end_date: "2026-12-31" }, as: ContractAdministrator, captures: { c_id: "$.data.id", v_created: "$.data.version" } }
          trigger:
            - { call: "POST /fleetcare/contracts/${c_id}/activate", as: ContractAdministrator, captures: { s_active: "$.data.status", v_active: "$.data.version" } }
            - { call: "POST /fleetcare/contracts/${c_id}/suspend", payload: { reason: "BILLING_DISPUTE" }, as: ContractAdministrator, captures: { s_susp: "$.data.status", v_susp: "$.data.version", r_susp: "$.data.suspension_reason" } }
            - { call: "POST /fleetcare/contracts/${c_id}/reinstate", as: ContractAdministrator, captures: { s_back: "$.data.status", v_back: "$.data.version" } }
          assert:
            - "${v_created} == 1"
            - "${s_active} == 'ACTIVE' and ${v_active} == 2"
            - "${s_susp} == 'SUSPENDED' and ${r_susp} == 'BILLING_DISPUTE' and ${v_susp} == 3"
            - "${s_back} == 'ACTIVE' and ${v_back} == 4"
            - "ServiceContract.${c_id}.suspension_reason == null after the reinstate"
            - "every hop returned HTTP 200 with response_type == 'object'"

      - name: reinstate_is_guarded_by_the_clubs_open_lockout_count
        claim_type: precondition_enforcement
        grounds:
          - state_machines[ServiceContract].transitions[SUSPENDED->ACTIVE].preconditions
          - validations[priority=31]
          - errors.ERR_SAFETY_LOCKOUT_OPEN
          - entities.Club.fields.open_safety_lockout_count
        distinguishing_aspect: "The blocking condition lives on a different entity than the one being transitioned: while any covered unit sits TAGGED_OUT the reinstate is refused with 409, and the identical request succeeds once a documented clearance returns the unit to service."
        test_recipe:
          setup:
            - "Clock 2026-08-15T08:00:00Z; club NORTH, unit e1, ACTIVE GOLD/FULL contract, inspectors T2 and T3 (both NORTH/TREADMILL)."
            - "A MAJOR call on e1 is dispatched to inspector T2 and on site; inspector T3 has tagged the unit out, so Club.open_safety_lockout_count == 1."
            - "The contract is then suspended (open calls are deliberately left running)."
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-15T08:00:00Z" }, as: ContractAdministrator }
            - { call: "POST /fleetcare/clubs", payload: { name: "Northside Fitness", region_code: "NORTH" }, as: ContractAdministrator, captures: { club_id: "$.data.id" } }
            - { call: "POST /fleetcare/equipment-models", payload: { manufacturer: "Pacemaster", model_code: "TM-900", category: "TREADMILL", model_year: 2019, pm_interval_hours: 250, expected_service_life_hours: 20000, base_annual_service_cents: 120000 }, as: ContractAdministrator, captures: { model_id: "$.data.id" } }
            - { call: "POST /fleetcare/equipment", payload: { club_id: "${club_id}", model_id: "${model_id}", serial_number: "SN-RI-1", install_date: "2024-03-01", initial_usage_hours: 500 }, as: ContractAdministrator, captures: { e1_id: "$.data.id" } }
            - { call: "POST /fleetcare/contracts", payload: { club_id: "${club_id}", coverage_tier: "GOLD", parts_inclusion: "FULL", pm_visits_per_year: 4, annual_base_cents: 250000, initial_parts_allowance_cents: 500000, term_start_date: "2026-01-01", term_end_date: "2026-12-31" }, as: ContractAdministrator, captures: { c_id: "$.data.id" } }
            - { call: "POST /fleetcare/contracts/${c_id}/activate", as: ContractAdministrator }
            - { call: "POST /fleetcare/technicians", payload: { full_name: "Iris Vogel", region_code: "NORTH", skill_categories: ["TREADMILL"], is_safety_inspector: true }, as: ContractAdministrator, captures: { t2_id: "$.data.id" } }
            - { call: "POST /fleetcare/technicians", payload: { full_name: "Omar Diaz", region_code: "NORTH", skill_categories: ["TREADMILL"], is_safety_inspector: true }, as: ContractAdministrator, captures: { t3_id: "$.data.id" } }
            - { call: "POST /fleetcare/service-calls", payload: { contract_id: "${c_id}", equipment_id: "${e1_id}", severity: "MAJOR", symptom_code: "DECK_CRACK" }, as: ServiceCoordinator, captures: { call_id: "$.data.id" } }
            - { call: "POST /fleetcare/equipment/${e1_id}/tag-out", payload: { reason: "DECK_HAZARD" }, as: SafetyInspector, as_user_id: "${t3_id}" }
            - { call: "POST /fleetcare/service-calls/${call_id}/dispatch", payload: { start_at: "2026-08-15T08:00:00Z", technician_id: "${t2_id}" }, as: ServiceCoordinator }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-15T09:00:00Z" }, as: ContractAdministrator }
            - { call: "POST /fleetcare/service-calls/${call_id}/arrive", as: FieldTechnician, as_user_id: "${t2_id}" }
            - { call: "POST /fleetcare/contracts/${c_id}/suspend", payload: { reason: "SAFETY_REVIEW" }, as: ContractAdministrator }
          trigger:
            - { call: "POST /fleetcare/contracts/${c_id}/reinstate", as: ContractAdministrator, captures: { err: "$.data.error_id" } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-15T11:00:00Z" }, as: ContractAdministrator }
            - { call: "POST /fleetcare/service-calls/${call_id}/resolve", payload: { resolution_code: "DECK_REPLACED", safety_clearance_technician_id: "${t3_id}" }, as: FieldTechnician, as_user_id: "${t2_id}" }
            - { call: "POST /fleetcare/contracts/${c_id}/reinstate", as: ContractAdministrator, captures: { s_back: "$.data.status" } }
          assert:
            - "the first reinstate returns HTTP 409 with ${err} == 'ERR_SAFETY_LOCKOUT_OPEN' and the contract stays SUSPENDED"
            - "Equipment.${e1_id} after the resolve: lifecycle_status == 'IN_SERVICE', safety_lockout_reason == null, last_safety_clearance_at == '2026-08-15T11:00:00Z'"
            - "Club.${club_id}.open_safety_lockout_count == 0 after the resolve"
            - "ServiceCall.${call_id}.response_minutes == 60 and sla_met == true (target 120)"
            - "the closed DowntimeEvent has downtime_minutes == 180 and provisional_credit_cents == 0 (the GOLD grace is exactly 180 minutes)"
            - "Equipment.${e1_id}.downtime_minutes_ytd == 180 and health_score == 93.50 with health_score_variant == 'USAGE_BASED'"
            - "${s_back} == 'ACTIVE' with HTTP 200"

      - name: service_call_creation_fires_its_whole_side_effect_set
        claim_type: side_effect_execution
        grounds:
          - state_machines[ServiceCall].transitions[OPEN->OPEN].side_effects
          - calculations.sla_response_evaluation
          - state_machines[Equipment].transitions[IN_SERVICE->DOWN]
          - entities.DowntimeEvent
        distinguishing_aspect: "One POST produces four effects at once: reported_at stamped from the logical clock, sla_target_minutes 120 (GOLD 120 x MAJOR 1.0), the unit driven IN_SERVICE → DOWN, and a companion DowntimeEvent opened with the call's own started_at — while safety_review_required stays false for a non-injury call."
        test_recipe:
          setup:
            - "Clock 2026-08-15T09:30:00Z; club NORTH, unit e1 IN_SERVICE, ACTIVE GOLD/FULL contract."
            - "The reporter is the club itself, so X-User-ID is the Club id."
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-15T09:30:00Z" }, as: ContractAdministrator }
            - { call: "POST /fleetcare/clubs", payload: { name: "Northside Fitness", region_code: "NORTH" }, as: ContractAdministrator, captures: { club_id: "$.data.id" } }
            - { call: "POST /fleetcare/equipment-models", payload: { manufacturer: "Pacemaster", model_code: "TM-900", category: "TREADMILL", model_year: 2019, pm_interval_hours: 250, expected_service_life_hours: 20000, base_annual_service_cents: 120000 }, as: ContractAdministrator, captures: { model_id: "$.data.id" } }
            - { call: "POST /fleetcare/equipment", payload: { club_id: "${club_id}", model_id: "${model_id}", serial_number: "SN-SE-1", install_date: "2024-03-01", initial_usage_hours: 500 }, as: ContractAdministrator, captures: { e1_id: "$.data.id" } }
            - { call: "POST /fleetcare/contracts", payload: { club_id: "${club_id}", coverage_tier: "GOLD", parts_inclusion: "FULL", pm_visits_per_year: 4, annual_base_cents: 250000, initial_parts_allowance_cents: 500000, term_start_date: "2026-01-01", term_end_date: "2026-12-31" }, as: ContractAdministrator, captures: { c_id: "$.data.id" } }
            - { call: "POST /fleetcare/contracts/${c_id}/activate", as: ContractAdministrator }
          trigger:
            - { call: "POST /fleetcare/service-calls", payload: { contract_id: "${c_id}", equipment_id: "${e1_id}", severity: "MAJOR", symptom_code: "BELT_NOISE" }, as: ClubManager, as_user_id: "${club_id}", captures: { call_id: "$.data.id" } }
          assert:
            - "HTTP status == 201 and response.data.status == 'OPEN'"
            - "response.data.reported_at == '2026-08-15T09:30:00Z'"
            - "response.data.sla_target_minutes == 120 and response_minutes == null and sla_met == null"
            - "response.data.safety_review_required == false and injury_reported == false and parts_hold_count == 0"
            - "Equipment.${e1_id}.lifecycle_status == 'DOWN' and safety_lockout_reason == null"
            - "exactly one DowntimeEvent exists for ${call_id} with status 'OPEN', started_at '2026-08-15T09:30:00Z', contract_id ${c_id}, equipment_id ${e1_id} and downtime_minutes null"
            - "Club.${club_id}.open_safety_lockout_count == 0 and Equipment.${e1_id}.downtime_minutes_ytd == 0"

      - name: injury_report_tags_the_unit_out_and_halves_the_response_target
        claim_type: side_effect_execution
        grounds:
          - state_machines[ServiceCall].transitions[OPEN->OPEN].side_effects
          - state_machines[Equipment].transitions[IN_SERVICE->TAGGED_OUT]
          - calculations.sla_response_evaluation.constants.SEVERITY_SLA_FACTOR
          - entities.Equipment.fields.safety_lockout_reason
        distinguishing_aspect: "The injury branch of the same creation endpoint diverges on three fields at once: lifecycle_status becomes TAGGED_OUT with reason MEMBER_INJURY (not DOWN), safety_review_required becomes true, and the CRITICAL factor 0.5 halves the GOLD target to 60 minutes."
        test_recipe:
          setup:
            - "Clock 2026-08-15T08:00:00Z; club NORTH, unit e1 IN_SERVICE, ACTIVE GOLD/FULL contract."
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-15T08:00:00Z" }, as: ContractAdministrator }
            - { call: "POST /fleetcare/clubs", payload: { name: "Northside Fitness", region_code: "NORTH" }, as: ContractAdministrator, captures: { club_id: "$.data.id" } }
            - { call: "POST /fleetcare/equipment-models", payload: { manufacturer: "Pacemaster", model_code: "TM-900", category: "TREADMILL", model_year: 2019, pm_interval_hours: 250, expected_service_life_hours: 20000, base_annual_service_cents: 120000 }, as: ContractAdministrator, captures: { model_id: "$.data.id" } }
            - { call: "POST /fleetcare/equipment", payload: { club_id: "${club_id}", model_id: "${model_id}", serial_number: "SN-IJ-1", install_date: "2024-03-01", initial_usage_hours: 500 }, as: ContractAdministrator, captures: { e1_id: "$.data.id" } }
            - { call: "POST /fleetcare/contracts", payload: { club_id: "${club_id}", coverage_tier: "GOLD", parts_inclusion: "FULL", pm_visits_per_year: 4, annual_base_cents: 250000, initial_parts_allowance_cents: 500000, term_start_date: "2026-01-01", term_end_date: "2026-12-31" }, as: ContractAdministrator, captures: { c_id: "$.data.id" } }
            - { call: "POST /fleetcare/contracts/${c_id}/activate", as: ContractAdministrator }
          trigger:
            - { call: "POST /fleetcare/service-calls", payload: { contract_id: "${c_id}", equipment_id: "${e1_id}", severity: "CRITICAL", symptom_code: "MEMBER_FALL", injury_reported: true }, as: ClubManager, as_user_id: "${club_id}", captures: { call_id: "$.data.id" } }
          assert:
            - "HTTP status == 201 and response.data.status == 'OPEN'"
            - "response.data.sla_target_minutes == 60 (round_half_up(120 * 0.5))"
            - "response.data.injury_reported == true and safety_review_required == true"
            - "Equipment.${e1_id}.lifecycle_status == 'TAGGED_OUT' and safety_lockout_reason == 'MEMBER_INJURY'"
            - "Club.${club_id}.open_safety_lockout_count == 1"
            - "one DowntimeEvent for ${call_id} exists with status 'OPEN' and started_at '2026-08-15T08:00:00Z'"

      - name: resolving_a_safety_review_call_demands_an_independent_clearance_signature
        claim_type: precondition_enforcement
        grounds:
          - state_machines[ServiceCall].transitions[ON_SITE->RESOLVED].preconditions
          - validations[priority=32]
          - validations[priority=34]
          - state_machines[Equipment].transitions[TAGGED_OUT->IN_SERVICE]
          - errors.ERR_SAFETY_CLEARANCE_REQUIRED
          - errors.ERR_SEGREGATION_OF_DUTIES
        distinguishing_aspect: "Two rejections then a success on the same endpoint: omitting the signature is 422 ERR_SAFETY_CLEARANCE_REQUIRED, signing it yourself is 409 ERR_SEGREGATION_OF_DUTIES, and only a second inspector's signature clears the lockout and stamps last_safety_clearance_at."
        test_recipe:
          setup:
            - "Clock 2026-08-15T08:00:00Z; club NORTH, unit e1, ACTIVE GOLD/FULL contract, inspectors T2 and T3."
            - "An injury CRITICAL call on e1 (unit TAGGED_OUT, safety_review_required true) is dispatched to inspector T2 at 08:00 and arrives at 08:30."
          setup_api_calls:
