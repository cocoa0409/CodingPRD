              payload: { store_id: "${store_id}", lines: [ { item_code: "EBT_ONLY_WIRELESS_TERMINAL", qty: 1 } ] }
              as: RetailerOwner
              as_user_id: "${owner_id}"
              captures: { order_early_id: $.data.id }
          trigger:
            - call: "POST /equipment-orders/${order_early_id}/place"
              payload: {}
              as: RetailerOwner
              as_user_id: "${owner_id}"
              captures: { early_place_error_id: $.data.error_id }
            - *k_app
            - *k_submit
            - *k_insp
            - *k_visit
            - *k_start
            - *k_findings
            - *k_decision
            - call: "POST /equipment-orders/${order_early_id}/place"
              payload: {}
              as: RetailerOwner
              as_user_id: "${owner_id}"
            - call: "POST /equipment-orders"
              payload: { store_id: "${store_id}", lines: [ { item_code: "EBT_ONLY_WIRELESS_TERMINAL", qty: 1 } ] }
              as: RetailerOwner
