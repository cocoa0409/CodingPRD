            - call: "POST /mmm/budget-allocations"
              payload: { budget_scenario_id: "${scen}", channel_id: "${chb}", baseline_spend_cents: 2500000 }
              as: BrandPlanner
              as_user_id: "bp-1"
              captures: { alloc_b: "$.data.id" }
          trigger:
            - call: "POST /mmm/budget-scenarios/${scen}/optimize"
              as: BrandPlanner
              as_user_id: "bp-1"
            - call: "POST /mmm/budget-scenarios/${scen}/revert-optimization"
              as: BrandPlanner
              as_user_id: "bp-1"
            - call: "POST /mmm/budget-scenarios/${scen}/optimize"
              as: BrandPlanner
              as_user_id: "bp-1"
          assert:
            - "Call 1 (optimize) returns 200 with status == OPTIMIZED, reallocation_fee_cents == 9000, allocated_total_cents == 3900000, unallocated_cents == 91000 and shifted_total_cents == 1700000, and 3900000 + 9000 + 91000 == 4000000 holds exactly."
            - "The fee is pinned to PASS 1: pass-1 churn 1800000 prices at 9000, while the pass-2 churn actually reported in shifted_total_cents is 1700000, which would have priced at 8500 - the response must show 9000, never 8500."
            - "Call 1 sets A_SEARCH to allocated_cents 2300000 / shifted_cents 800000 / constraint_binding NONE / projected_contribution_units 3561.2903, and B_SOCIAL to allocated_cents 1600000 / shifted_cents 900000 / constraint_binding NONE / projected_contribution_units 2327.2727."
            - "Call 1 sets projected_contribution_units == 5888.5630 (3561.2903 + 2327.2727) and projected_incremental_revenue_cents == round(5888.5630 * 5026, 0) == 29595918."
            - "Call 2 (revert-optimization) returns 200 with status == DRAFT and every computed cent field wound back: allocated_total_cents == 4000000, reallocation_fee_cents == 0, unallocated_cents == 0, shifted_total_cents == 0, projected_contribution_units == 0.0000, projected_incremental_revenue_cents == 0."
            - "After call 2 both allocation rows read allocated_cents == baseline_spend_cents (1500000 and 2500000) with shifted_cents == 0, constraint_binding == NONE and projected_contribution_units == 0.0000 - no per-row drift survives the compensation."
            - "The invariant holds at BOTH observable moments with different summands: 3900000 + 9000 + 91000 == 4000000 after call 1 and 4000000 + 0 + 0 == 4000000 after call 2, so an implementation that merely zeroes the fee without returning the 91000 remainder to allocated_total_cents breaks the identity."
            - "Call 3 (optimize again) returns 200 and reproduces call 1 field for field - reallocation_fee_cents 9000, allocated_total_cents 3900000, unallocated_cents 91000, shifted_total_cents 1700000, A 2300000, B 1600000, projected_contribution_units 5888.5630 - proving the revert restored the exact pre-optimize inputs rather than an approximation of them."
      - name: holdout_population_conservation_restored_by_release_then_sweep
        grounds:
          - "declared invariant holdout_population_conservation - Market.held_out_population == SUM of GeoCell.population over cells whose assignment_state IN {TREATMENT, CONTROL, WASHOUT}, returning to 0 once every experiment is CLOSED and swept"
          - "state_machines GeoCell UNASSIGNED -> TREATMENT / CONTROL (held_out_population += population), TREATMENT / CONTROL -> WASHOUT (held_out_population UNCHANGED), WASHOUT -> UNASSIGNED (held_out_population -= population, skipped when the quarantine has not elapsed)"
          - "state_machines Experiment REJECTED -> DRAFT via release-cells, with redesign_count += 1 and every computed design and readout field reset"
          - "entities Market.celled_population, Market.held_out_population, Market.held_out_population_pct; GeoCell.washout_until_date"
          - "endpoints POST /mmm/experiments/{id}/release-cells and POST /mmm/markets/{id}/washout-sweep (both 200, ExperimentDesigner)"
        distinguishing_aspect: |
          The conserved quantity is held-out POPULATION rather than cents, and the compensation is
          deliberately split in two clock-gated halves: release-cells moves the cells to WASHOUT while
          leaving held_out_population untouched, and only the washout sweep at or after
          end_date + washout_days returns it to 0 - so an implementation that zeroes
          held_out_population at release-cells fails the assert after call 1, and one that sweeps
          without checking washout_until_date fails the assert after call 3.
          
        test_recipe:
          setup:
            - "Market US_CORE with total_population 10000000 and two GeoCells GC01 and GC02, each with population 1000000, so celled_population == 2000000."
            - "One media channel A_SEARCH. No DataWindow exists, so data_posture is RESTRICTED (!= FROZEN) and lock-design is allowed."
            - "One GEO_HOLDOUT / DIFF_IN_DIFF experiment on A_SEARCH, [2026-09-07, 2026-10-05), washout_days 7, mde 5.0, baseline_conversion_rate 0.0200, planned arms 1000000 / 1000000: power_index 5.0508 and computed_power 0.9500 clear the power gate, and (0 + 1000000 + 1000000) * 100 == 200000000 sits exactly on the holdout ceiling."
            - "The experiment is locked, assigned GC01 as treatment and GC02 as control (which pushes held_out_population to 2000000), started at clock 2026-09-07, read out at clock 2026-10-05 with treatment_conversions 5145, control_conversions 4900, pre_treatment_conversions 4655, pre_control_conversions 4900 - giving measured_lift_pct 10.00 with lift_ci_low_pct 6.00 - and then REJECTED by AnalyticsLead al-1, who differs from designer ed-1 so the segregation-of-duties check passes."
            - "A reject deliberately fires NO calibration cascade, so no published run and no market posture change is needed to reach the REJECTED state; redesign_count is still 0, which is < MAX_REDESIGNS 2, so release-cells is permitted."
          setup_api_calls:
            - call: "POST /mmm/markets"
              payload: { market_code: "US_CORE", name: "US Core Brand Market", total_population: 10000000, annual_budget_ceiling_cents: 5000000000, currency_code: "USD" }
              as: DataEngineer
              as_user_id: "de-1"
              captures: { mkt: "$.data.id" }
            - call: "POST /mmm/geo-cells"
              payload: { market_id: "${mkt}", cell_code: "GC01", population: 1000000 }
              as: DataEngineer
              as_user_id: "de-1"
              captures: { gc1: "$.data.id" }
            - call: "POST /mmm/geo-cells"
              payload: { market_id: "${mkt}", cell_code: "GC02", population: 1000000 }
              as: DataEngineer
              as_user_id: "de-1"
              captures: { gc2: "$.data.id" }
            - call: "POST /mmm/media-channels"
              payload: { market_id: "${mkt}", channel_code: "A_SEARCH", channel_type: "SEARCH", adstock_decay_rate: 0.50, adstock_max_lag_periods: 2, saturation_half_point_cents: 200000, response_ceiling_units: 1200, min_spend_cents: 200000, max_spend_cents: 3000000, status: "ACTIVE" }
              as: DataEngineer
              as_user_id: "de-1"
              captures: { cha: "$.data.id" }
            - call: "POST /mmm/experiments"
              payload: { market_id: "${mkt}", channel_id: "${cha}", design_type: "GEO_HOLDOUT", readout_method: "DIFF_IN_DIFF", start_date: "2026-09-07T00:00:00Z", end_date: "2026-10-05T00:00:00Z", washout_days: 7, minimum_detectable_effect_pct: 5.0, baseline_conversion_rate: 0.0200, planned_treatment_population: 1000000, planned_control_population: 1000000 }
              as: ExperimentDesigner
              as_user_id: "ed-1"
              captures: { exp: "$.data.id" }
            - call: "POST /mmm/experiments/${exp}/lock-design"
              as: ExperimentDesigner
              as_user_id: "ed-1"
            - call: "POST /mmm/experiments/${exp}/assign-cells"
              payload: { treatment_cell_ids: ["${gc1}"], control_cell_ids: ["${gc2}"] }
              as: ExperimentDesigner
              as_user_id: "ed-1"
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-07T00:00:00Z" }
              as: ExperimentDesigner
              as_user_id: "ed-1"
            - call: "POST /mmm/experiments/${exp}/start"
              as: ExperimentDesigner
              as_user_id: "ed-1"
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-10-05T00:00:00Z" }
              as: ExperimentDesigner
              as_user_id: "ed-1"
            - call: "POST /mmm/experiments/${exp}/read-out"
              payload: { treatment_conversions: 5145, control_conversions: 4900, pre_treatment_conversions: 4655, pre_control_conversions: 4900 }
              as: ExperimentDesigner
              as_user_id: "ed-1"
            - call: "POST /mmm/experiments/${exp}/reject"
              payload: { rejection_reason: "Geo contamination in two DMAs." }
              as: AnalyticsLead
              as_user_id: "al-1"
          trigger:
            - call: "POST /mmm/experiments/${exp}/release-cells"
              as: ExperimentDesigner
              as_user_id: "ed-1"
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-10-11T00:00:00Z" }
              as: ExperimentDesigner
              as_user_id: "ed-1"
            - call: "POST /mmm/markets/${mkt}/washout-sweep"
              as: ExperimentDesigner
              as_user_id: "ed-1"
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-10-12T00:00:00Z" }
              as: ExperimentDesigner
              as_user_id: "ed-1"
            - call: "POST /mmm/markets/${mkt}/washout-sweep"
              as: ExperimentDesigner
              as_user_id: "ed-1"
          assert:
            - "Immediately before the trigger, GET /mmm/markets/${mkt} shows celled_population == 2000000, held_out_population == 2000000 and held_out_population_pct == 20.00."
            - "Call 1 (release-cells on the REJECTED experiment) returns 200 with status == DRAFT, redesign_count == 1, power_index == null, computed_power == null, treatment_population == 0, control_population == 0 and measured_lift_pct, lift_ci_half_width_pct, lift_ci_low_pct and lift_ci_high_pct all null."
            - "After call 1, GET /mmm/geo-cells/${gc1} and GET /mmm/geo-cells/${gc2} both show assignment_state == WASHOUT with washout_until_date == 2026-10-12 (end_date 2026-10-05 plus washout_days 7) and assigned_experiment_id STILL set to the experiment."
            - "After call 1, GET /mmm/markets/${mkt} still shows held_out_population == 2000000 and held_out_population_pct == 20.00 - release-cells is only half of the compensation, and WASHOUT still counts as held out."
            - "Call 3 (washout-sweep at clock 2026-10-11, one day before the quarantine elapses) returns 200 and changes nothing: both cells are still assignment_state == WASHOUT with washout_until_date == 2026-10-12, and held_out_population is still 2000000. No error is raised - non-elapsed cells are SKIPPED, not rejected."
            - "Call 5 (washout-sweep at clock 2026-10-12, the first instant at which current_utc >= washout_until_date) returns 200 and clears both cells: assignment_state == UNASSIGNED, assigned_experiment_id == null, washout_until_date == null."
            - "After call 5, GET /mmm/markets/${mkt} shows held_out_population == 0 and held_out_population_pct == 0.00, while celled_population is still 2000000 - the conserved quantity returned to its pre-assignment value without destroying either cell."
            - "The DRAFT experiment left by call 1 can be locked again because both cells are UNASSIGNED and held_out_population is back to 0, so the compensation restored capacity and not merely a bookkeeping field."
