              payload: {}
              as: LandlordAssetManager
              captures: { res_pool: "$.data.exhaust_reserved_cfm", avail_pool: "$.data.exhaust_available_cfm", pwr_pool: "$.data.power_available_kw" }
            - call: "POST /hazmat-permits/${hz_id}/decision"
              payload: { decision: "APPROVE" }
              as: AHJPermitOfficer
              captures: { hz_st: "$.data.status" }
            - call: "GET /floors/${f2_id}/hazmat-utilization"
              payload: { hazard_class: "FLAMMABLE_IB", control_area_index: 1 }
              as: AHJPermitOfficer
              captures: { basis: "$.data.per_control_area_basis_gal", util: "$.data.per_control_area_utilization_pct" }
            - call: "POST /phase-packages/${ph_id}/progress"
              payload: { target_status: "COMPLETE" }
              as: LandlordAssetManager
              captures: { ph_st: "$.data.status", ph_committed: "$.data.ti_committed_usd" }
            - call: "GET /leases/${l_id}"
              payload: {}
              as: LandlordAssetManager
              captures: { l_committed: "$.data.ti_committed_usd", l_uncommitted: "$.data.ti_uncommitted_usd" }
            - call: "GET /phase-packages"
              payload: { project_id: "${pr_id}" }
              as: LandlordAssetManager
              captures: { list_committed: "$.data[0].ti_committed_usd" }
          assert:
            - "every trigger call -> HTTP 200 or 201; no assertion requires a re-read, a retry or a delay"
            - "${res_pool} == 12000"
            - "${avail_pool} == 68000"
            - "${pwr_pool} == 620"
            - "${hz_st} == APPROVED"
            - "${basis} == 100.00"
            - "${util} == 55.56"
            - "${ph_st} == COMPLETE"
            - "${ph_committed} == 60000.00"
            - "${l_committed} == 60000.00"
            - "${l_uncommitted} == 140000.00"
            - "${list_committed} == 60000.00"
            - "the value read from GET /buildings equals the pool the reservation response implied, and the value read from GET /leases equals the phase response's ti_committed_usd - one round trip each"
            - "CapacityReservation.${res_id}.status == RESERVED"
            - "Lease.${l_id}.ti_authorized_usd == 200000.00"
