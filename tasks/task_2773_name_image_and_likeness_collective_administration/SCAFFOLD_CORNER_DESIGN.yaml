              payload: { donor_member_id: "${donor_id}", gross_amount_cents: 500000, source_kind: "ONE_TIME_GIFT", designation: "UNRESTRICTED", processor_outcome: "APPROVE" }
              as: TreasuryOfficer
              captures: { contrib_id: $.data.id }
            - call: "POST /nil/athletes"
              payload: { collective_id: "${col_id}", full_name: "Nils Nordic", portal_user_id: "ath-nils", sport: "MENS_BASKETBALL", class_year: 2028, tax_person_kind: "NONRESIDENT_ALIEN" }
              as: CollectiveDirector
              captures: { ath_id: $.data.id, doc_before: $.data.taxpayer_doc_on_file }
            - call: "POST /nil/deal-contracts"
              payload: { collective_id: "${col_id}", athlete_id: "${ath_id}", total_value_cents: 200000, effective_start_at: "2026-08-01T00:00:00Z", effective_end_at: "2026-12-31T00:00:00Z", funding_designation: "UNRESTRICTED" }
              as: CollectiveDirector
              captures: { dc_id: $.data.id }
            - call: "POST /nil/deal-contracts/${dc_id}/compliance-submissions"
              payload: { state_law_citation: "TX-51.9246", association_rule_citation: "NCAA-2024-12.5" }
              as: CollectiveDirector
