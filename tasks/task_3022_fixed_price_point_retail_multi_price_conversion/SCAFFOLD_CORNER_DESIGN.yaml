            - call: "POST /merchandise/aisle-resets/${r_one_id}/begin"
              payload: {}
              as: ResetCalendarPlanner
            - call: "POST /merchandise/aisle-resets/${r_one_id}/execute"
              payload: {}
              as: ResetCalendarPlanner
            - call: "GET /merchandise/stores/${store_id}/aisle-resets"
              payload: {}
              as: MerchandiseAnalyst
          assert:
            - "the coverage read on an unknown project returns 404 and err_proj == ERR_CONVERSION_PROJECT_NOT_FOUND"
            - "the reset list returns exactly 2 rows with statuses EXECUTED and PLANNED"
            - "the recomputed projection is completed_aisle_count 1, projected_convertible_aisle_count 1, adjusted_baseline 1"
            - "coverage_delta_pct == 0.000 and shortfall == false — (1 - 1) / 1 on the rounded 3-decimal value"
            - "no ConversionProject row was written by either read; the projection is derived every time"

      - name: multi_price_issues_rejects_items_foreign_to_the_store_price_point
        claim_type: Conditional action
        grounds:
          - endpoints.POST_/merchandise/multi-price-issues
          - validations[priority=17]
          - errors.ERR_ITEM_NOT_AT_SOURCE_PRICE_POINT
        distinguishing_aspect: "The batch issues only items still sitting at the batch's own from_price_point_id, so an item resting at a different point is a 409 ERR_ITEM_NOT_AT_SOURCE_PRICE_POINT while the compliant item issues — the source point is an explicit request input, not inferred from the store's in-flight conversion."
