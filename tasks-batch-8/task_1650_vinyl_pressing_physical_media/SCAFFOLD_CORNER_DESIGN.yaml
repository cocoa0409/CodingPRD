scaffold_corner_design:
- section: entities
  instances:
  - name: customer_create_applies_defaults
    claim_type: defaults
    grounds:
    - entities.Customer
    distinguishing_aspect: Omitting optional fields yields discount_tier STANDARD, overrun_policy ACCEPT_AND_BILL_10, status ACTIVE, trailing_billed_cents
      0, version 1.
    test_recipe:
      setup:
      - empty DB
      setup_api_calls: []
      trigger:
      - call: POST /customers
        payload:
          name: Defaults Co
          contact_email: d@x.com
          credit_limit_cents: 5000000
        as: CustomerServiceRep
        captures:
          tier: $.data.discount_tier
          pol: $.data.overrun_policy
          st: $.data.status
          tr: $.data.trailing_billed_cents
          v: $.data.version
      assert:
      - discount_tier == STANDARD, overrun_policy == ACCEPT_AND_BILL_10, status == ACTIVE
      - trailing_billed_cents == 0 and version == 1; id is a typeless UUID
  - name: order_intake_computed_fields
    claim_type: computed_fields
    grounds:
    - entities.PressOrder.fields.tolerance_pct
    - entities.PressOrder.fields.color_family
    distinguishing_aspect: Order with [BLACK 500, SPLATTER 500] gets tolerance_pct 5.0 (strictest variant wins) and color_family STANDARD (equal
      quantities -> first variant decides).
    test_recipe:
      setup:
      - customer + release exist
      setup_api_calls:
      - call: POST /_clock/set_current_utc
        payload:
          to_iso8601: '2026-08-01T00:00:00Z'
        as: PlatformAdmin
      - call: POST /customers
        payload:
          name: CC
          contact_email: cc@x.com
          credit_limit_cents: 100000000
        as: CustomerServiceRep
        captures:
          cust: $.data.id
      - call: POST /releases
        payload:
          customer_id: ${cust}
          catalog_number: CC-001
          title: T
          format: LP
          weight_gram: 180
          release_date: '2026-12-01'
        as: CustomerServiceRep
        captures:
          rel: $.data.id
      trigger:
      - call: POST /press-orders
        payload:
          release_id: ${rel}
          quantity_ordered: 1000
          sides: 2
          plating_route: TWO_STEP
          variants:
          - color_config: BLACK
            quantity: 500
          - color_config: SPLATTER
            quantity: 500
        as: CustomerServiceRep
        captures:
          tol: $.data.tolerance_pct
          fam: $.data.color_family
          st: $.data.production_status
          bst: $.data.billing_status
          seq: $.data.intake_seq
      assert:
      - tolerance_pct == 5.0 (min of BLACK 5.0 and SPLATTER 8.0)
      - color_family == STANDARD (500/500 tie -> first variant in array)
      - production_status == DRAFT, billing_status == UNBILLED, intake_seq == 1 (first order)
  - name: resource_not_found_spot_sweep
    claim_type: not_found
    grounds:
    - errors[ERR_CUSTOMER_NOT_FOUND]
    - errors[ERR_RELEASE_NOT_FOUND]
    - errors[ERR_PRESS_ORDER_NOT_FOUND]
    - errors[ERR_PRESS_LINE_NOT_FOUND]
    - errors[ERR_PLATING_BATH_NOT_FOUND]
    - errors[ERR_INVENTORY_LOT_NOT_FOUND]
    - errors[ERR_SHIPMENT_NOT_FOUND]
    - errors[ERR_INVOICE_NOT_FOUND]
    - errors[ERR_TOOLING_JOB_NOT_FOUND]
    - errors[ERR_TEST_PRESSING_NOT_FOUND]
    - errors[ERR_PRINT_JOB_NOT_FOUND]
    - errors[ERR_QC_REPORT_NOT_FOUND]
    distinguishing_aspect: Every single-resource GET with a well-formed but unknown UUID returns 404 with its resource-specific error_id.
    test_recipe:
      setup:
      - empty DB
      setup_api_calls: []
      trigger:
      - call: GET /customers/00000000-0000-0000-0000-000000000000
        as: Any
        captures:
          e1: $.data.error_id
      - call: GET /releases/00000000-0000-0000-0000-000000000000
        as: Any
        captures:
          e2: $.data.error_id
      - call: GET /press-orders/00000000-0000-0000-0000-000000000000
        as: Any
        captures:
          e3: $.data.error_id
      - call: GET /press-lines/00000000-0000-0000-0000-000000000000
        as: Any
        captures:
          e4: $.data.error_id
      - call: GET /plating-baths/00000000-0000-0000-0000-000000000000
        as: Any
        captures:
          e5: $.data.error_id
      - call: GET /inventory-lots/00000000-0000-0000-0000-000000000000
        as: Any
        captures:
          e6: $.data.error_id
      - call: GET /shipments/00000000-0000-0000-0000-000000000000
        as: Any
        captures:
          e7: $.data.error_id
      - call: GET /invoices/00000000-0000-0000-0000-000000000000
        as: Any
        captures:
          e8: $.data.error_id
      - call: POST /tooling-jobs/00000000-0000-0000-0000-000000000000/advance
        payload:
          event: START_CUT
        as: PressOperator
        captures:
          e9: $.data.error_id
      - call: POST /test-pressings/00000000-0000-0000-0000-000000000000/ship
        payload: {}
        as: ProductionPlanner
        captures:
          e10: $.data.error_id
      - call: POST /print-jobs/00000000-0000-0000-0000-000000000000/advance
        payload:
          event: DISPATCH
        as: CustomerServiceRep
        captures:
          e11: $.data.error_id
      - call: POST /qc-reports/00000000-0000-0000-0000-000000000000/decision
        payload:
          decision: ACCEPT
          fault: NONE
        as: ProductionManager
        as_user_id: pm-1
        captures:
          e12: $.data.error_id
      assert:
      - 'error ids in order: ERR_CUSTOMER_NOT_FOUND, ERR_RELEASE_NOT_FOUND, ERR_PRESS_ORDER_NOT_FOUND, ERR_PRESS_LINE_NOT_FOUND, ERR_PLATING_BATH_NOT_FOUND,
        ERR_INVENTORY_LOT_NOT_FOUND, ERR_SHIPMENT_NOT_FOUND, ERR_INVOICE_NOT_FOUND (all HTTP 404)'
    assert:
    - 'error ids in order: ERR_CUSTOMER_NOT_FOUND, ERR_RELEASE_NOT_FOUND, ERR_PRESS_ORDER_NOT_FOUND, ERR_PRESS_LINE_NOT_FOUND, ERR_PLATING_BATH_NOT_FOUND,
      ERR_INVENTORY_LOT_NOT_FOUND, ERR_SHIPMENT_NOT_FOUND, ERR_INVOICE_NOT_FOUND (GETs, HTTP 404)'
    - 'action endpoints with bogus ids: e9 == ERR_TOOLING_JOB_NOT_FOUND, e10 == ERR_TEST_PRESSING_NOT_FOUND, e11 == ERR_PRINT_JOB_NOT_FOUND, e12
      == ERR_QC_REPORT_NOT_FOUND (HTTP 404)'
  - name: body_fk_existence_enforced
    claim_type: parent_relationships
    grounds:
    - validations[priority=3]
    - entities.Release.fields.customer_id
    - entities.PressOrder.fields.release_id
    - entities.Shipment.fields.distributor_customer_id
    distinguishing_aspect: 'Body-referenced FKs are validated at existence priority: bogus customer_id on release create, bogus release_id on
      order create, bogus distributor on shipment create each 404.'
    test_recipe:
      setup:
      - one customer + one release exist for the shipment leg
      setup_api_calls:
      - call: POST /_clock/set_current_utc
        payload:
          to_iso8601: '2026-08-01T00:00:00Z'
        as: PlatformAdmin
      - call: POST /customers
        payload:
          name: FK
          contact_email: fk@x.com
          credit_limit_cents: 1000000
        as: CustomerServiceRep
        captures:
          cust: $.data.id
      - call: POST /releases
        payload:
          customer_id: ${cust}
          catalog_number: FK-001
          title: T
          format: LP
          weight_gram: 140
          release_date: '2026-12-01'
        as: CustomerServiceRep
        captures:
          rel: $.data.id
      trigger:
      - call: POST /releases
        payload:
          customer_id: 00000000-0000-0000-0000-000000000000
          catalog_number: FK-002
          title: T2
          format: LP
          weight_gram: 140
          release_date: '2026-12-01'
        as: CustomerServiceRep
        captures:
          e1: $.data.error_id
      - call: POST /press-orders
        payload:
          release_id: 00000000-0000-0000-0000-000000000000
          quantity_ordered: 100
          sides: 2
          plating_route: TWO_STEP
          variants:
          - color_config: BLACK
            quantity: 100
        as: CustomerServiceRep
        captures:
          e2: $.data.error_id
      - call: POST /shipments
        payload:
          release_id: ${rel}
          distributor_customer_id: 00000000-0000-0000-0000-000000000000
          quantity: 10
          requested_ship_date: '2026-08-15'
        as: CustomerServiceRep
        captures:
          e3: $.data.error_id
      assert:
      - e1 == ERR_CUSTOMER_NOT_FOUND, e2 == ERR_RELEASE_NOT_FOUND, e3 == ERR_CUSTOMER_NOT_FOUND
  - name: delay_notice_append_only_shape
    claim_type: immutability
    grounds:
    - entities.DelayNotice
    distinguishing_aspect: 'DelayNotice (common_fields: false) exposes id + created_at only: no version, no updated_at, and there is no update/delete
      endpoint.'
    test_recipe:
      setup:
      - tight-date release (2026-08-20) with an order approved into QUEUED so a notice is generated
      setup_api_calls:
      - call: POST /_clock/set_current_utc
        payload:
          to_iso8601: '2026-08-01T00:00:00Z'
        as: PlatformAdmin
      - call: POST /customers
        payload:
          name: DN
          contact_email: dn@x.com
          credit_limit_cents: 100000000
        as: CustomerServiceRep
        captures:
          cust: $.data.id
      - call: POST /releases
        payload:
          customer_id: ${cust}
          catalog_number: DN-001
          title: T
          format: LP
          weight_gram: 180
          release_date: '2026-08-20'
        as: CustomerServiceRep
        captures:
          rel: $.data.id
      - call: POST /plating-baths
        payload:
          bath_code: B1
          rinse_gap_minutes: 2
        as: ProductionPlanner
        captures:
          bath: $.data.id
      - call: POST /press-orders
        payload:
          release_id: ${rel}
          quantity_ordered: 100
          sides: 2
          plating_route: TWO_STEP
          variants:
          - color_config: BLACK
            quantity: 100
        as: CustomerServiceRep
        captures:
          ord: $.data.id
          ord_v: $.data.version
      - call: POST /press-orders/${ord}/quotes
        payload:
          expected_press_order_version: ${ord_v}
        as: CustomerServiceRep
        captures:
          ord_v2: $.data.version
      - call: POST /press-orders/${ord}/confirm
        payload:
          expected_press_order_version: ${ord_v2}
        as: Customer
        as_user_id: ${cust}
      - call: POST /press-orders/${ord}/start-tooling
        payload: {}
        as: ProductionPlanner
      - call: GET /press-orders/${ord}/tooling-jobs
        as: Any
        captures:
          tool: $.data[0].id
      - call: POST /tooling-jobs/${tool}/advance
        payload:
          event: START_CUT
        as: PressOperator
      - call: POST /tooling-jobs/${tool}/advance
        payload:
          event: CUT_DONE
        as: PressOperator
      - call: POST /tooling-jobs/${tool}/advance
        payload:
          event: START_PLATING
          plating_bath_id: ${bath}
          plating_start: 2
          plating_end: 6
        as: PressOperator
      - call: POST /tooling-jobs/${tool}/advance
        payload:
          event: PLATING_DONE
        as: PressOperator
      - call: POST /press-orders/${ord}/test-pressings
        payload:
          quantity: 5
        as: PressOperator
        captures:
          tp: $.data.id
      - call: POST /test-pressings/${tp}/ship
        payload: {}
        as: ProductionPlanner
      - call: POST /test-pressings/${tp}/review
        payload:
          decision: APPROVE
        as: Customer
        as_user_id: ${cust}
      trigger:
      - call: GET /releases/${rel}/delay-notices
        as: Any
        captures:
          nid: $.data[0].id
          ncreated: $.data[0].created_at
          ncause: $.data[0].cause
      assert:
      - exactly one notice; it has id and created_at (ISO8601 UTC, 3 fractional digits)
      - notice object has NO version or updated_at keys (append-only), cause == SCHEDULE
- section: state_machines
  instances:
  - name: cancel_at_pressing_rejected
    claim_type: invalid_transition
    grounds:
    - state_machines.PressOrder
    distinguishing_aspect: 'Cancel is only offered pre-PRESSING: an order in PRESSING rejects cancel with ERR_ORDER_INVALID_STATE and no fee invoice
      is created.'
    test_recipe:
      setup:
      - order in PRESSING (slot 2026-08-10, clock advanced)
      setup_api_calls:
      - call: POST /_clock/set_current_utc
        payload:
          to_iso8601: '2026-08-01T00:00:00Z'
        as: PlatformAdmin
      - call: POST /customers
        payload:
          name: SM1
          contact_email: sm1@x.com
          credit_limit_cents: 100000000
