              payload: {}
              as: UtilityCrew
          trigger:
            - call: "POST /markets/${m10_id}/hookups/${h10_id}/energize"
              payload: {}
              as: UtilityCrew
              captures: { h10_err: $.data.error_id }
          assert:
            - "error_id == ERR_PERMIT_REQUIRED (priority 7 beats any referential check)"

  # ============================================================
  # Rule 6 — Boundary-precision checks on different metrics/endpoints
