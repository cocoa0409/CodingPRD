scaffold_difficulty_design:
  # =================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: estimate_quoted_vs_final_footage
        grounds:
          - calculations.footage_estimate_quote
          - entities.Estimate.fields.quoted_total_cents
          - entities.Estimate.fields.final_total_cents
          - state_machines.Estimate.ACCEPTED_to_INVOICED
        distinguishing_aspect: |
          On the Estimate domain: the quoted variant uses estimated_footage (150) giving 93675,
          the final variant uses measured_footage (170) captured at INSTALL completion giving 99425;
          the two totals differ (99425 != 93675) for the same estimate.
        test_recipe:
          setup:
            - "A PERMANENT_PURCHASE contract is ACTIVE for a customer."
            - "An estimate (PERMANENT, estimated_footage 150, MODERATE, 4 accessories) is QUOTED (93675) then ACCEPTED."
            - "An INSTALL job linked to that estimate is booked onto a DISPATCHED route day and started by the crew."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: BillingAdmin
            - call: "POST /customers"
              payload: { name: "Ann Owner", service_address: "1 Elm St", roofline_feet: 220 }
              as: SalesRep
              captures: { cust_id: $.data.id }
            - call: "POST /contracts"
              payload: { customer_id: "${cust_id}", contract_type: "PERMANENT_PURCHASE", season_year: 2026, base_season_fee_cents: 80000, early_bird_cutoff: "2026-08-15T00:00:00Z" }
              as: SalesRep
              captures: { contract_id: $.data.id }
            - call: "POST /contracts/${contract_id}/sign"
              payload: {}
              as: SalesRep
            - call: "POST /estimates"
              payload: { customer_id: "${cust_id}", contract_id: "${contract_id}", product_line: "PERMANENT", estimated_footage: 150, roofline_complexity: "MODERATE", accessory_count: 4 }
              as: SalesRep
              captures: { est_id: $.data.id }
            - call: "POST /estimates/${est_id}/quote"
              payload: {}
              as: SalesRep
            - call: "POST /estimates/${est_id}/accept"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
            - call: "POST /jobs"
              payload: { contract_id: "${contract_id}", job_type: "INSTALL", scheduled_date: "2026-11-01T09:00:00Z", estimate_id: "${est_id}" }
              as: Dispatcher
              captures: { job_id: $.data.id }
            - call: "POST /crews"
              payload: { name: "Crew A", home_zone: "N", daily_stop_capacity: 5 }
              as: Dispatcher
              captures: { crew_id: $.data.id }
            - call: "POST /route-days"
              payload: { crew_id: "${crew_id}", service_date: "2026-11-01T00:00:00Z", zone: "N", max_stops: 5 }
              as: Dispatcher
              captures: { rd_id: $.data.id, rd_v: $.data.version }
            - call: "POST /route-assignments"
              payload: { route_day_id: "${rd_id}", job_id: "${job_id}", window_start: "2026-11-01T09:00:00Z", window_end: "2026-11-01T11:00:00Z", expected_route_day_version: "${rd_v}" }
              as: Dispatcher
            - call: "POST /route-days/${rd_id}/dispatch"
              payload: {}
              as: Dispatcher
            - call: "POST /jobs/${job_id}/start"
              payload: {}
              as: CrewLead
              as_user_id: "${crew_id}"
          trigger:
            - call: "POST /jobs/${job_id}/complete"
              payload: { completed_footage: 170 }
              as: CrewLead
              as_user_id: "${crew_id}"
          assert:
            - "Estimate.${est_id}.quoted_total_cents == 93675"
            - "Estimate.${est_id}.measured_footage == 170"
            - "Estimate.${est_id}.final_total_cents == 99425"
            - "Estimate.${est_id}.final_total_cents != Estimate.${est_id}.quoted_total_cents"
            - "Estimate.${est_id}.status == INVOICED"

      - name: financing_scheduled_vs_early_payoff
        grounds:
          - calculations.financing_payoff_balance
          - entities.FinancingPlan.fields.remaining_principal_cents
          - entities.FinancingPlan.fields.monthly_payment_cents
        distinguishing_aspect: |
          On the FinancingPlan domain (different entity than the estimate variant): after 3 payments the
          scheduled_payoff variant is monthly_payment*remaining_installments = 110000*9 = 990000, while the
          early_payoff variant is remaining_principal + 2% fee = 900000 + 18000 = 918000; they differ.
        test_recipe:
          setup:
            - "A PERMANENT_PURCHASE contract is ACTIVE."
            - "A FinancingPlan (principal 1200000, apr 1000 bps, term 12) has 3 payments of 110000 posted (remaining 900000)."
          setup_api_calls:
            - call: "POST /customers"
              payload: { name: "Bob Owner", service_address: "2 Oak St", roofline_feet: 300 }
              as: SalesRep
              captures: { cust_id: $.data.id }
            - call: "POST /contracts"
              payload: { customer_id: "${cust_id}", contract_type: "PERMANENT_PURCHASE", season_year: 2026, base_season_fee_cents: 80000, early_bird_cutoff: "2027-01-01T00:00:00Z" }
              as: SalesRep
              captures: { contract_id: $.data.id }
            - call: "POST /contracts/${contract_id}/sign"
              payload: {}
              as: SalesRep
            - call: "POST /financing-plans"
              payload: { contract_id: "${contract_id}", original_principal_cents: 1200000, apr_bps: 1000, term_months: 12 }
              as: BillingAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /financing-plans/${plan_id}/payments"
              payload: { amount_cents: 110000 }
              as: BillingAdmin
            - call: "POST /financing-plans/${plan_id}/payments"
              payload: { amount_cents: 110000 }
              as: BillingAdmin
            - call: "POST /financing-plans/${plan_id}/payments"
              payload: { amount_cents: 110000 }
              as: BillingAdmin
          trigger:
            - call: "GET /financing-plans/${plan_id}/payoff-quote"
              payload: {}
              as: BillingAdmin
              captures: { sched: $.data.scheduled_remaining_cents, early: $.data.early_payoff_cents }
          assert:
            - "payoff_quote.scheduled_remaining_cents == 990000"
            - "payoff_quote.early_payoff_cents == 918000"
            - "payoff_quote.scheduled_remaining_cents != payoff_quote.early_payoff_cents"
            - "FinancingPlan.${plan_id}.remaining_principal_cents == 900000"

  # =================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: footage_quote_tiered_multiplier_mode_a
        grounds:
          - calculations.footage_estimate_quote
          - entities.Estimate.fields.quoted_total_cents
        distinguishing_aspect: |
          Mode (a): >=3 inputs with non-linear interaction — marginal tier selection on footage
          (30000 + 12500 = 42500), a complexity multiplier applied to the footage cost only
          (round_half_up(42500*1.15)=48875), plus per-accessory cost (4800) and a product base (40000):
          40000 + 48875 + 4800 = 93675.
        test_recipe:
          setup:
            - "A customer exists; a DRAFT estimate (PERMANENT, footage 150, MODERATE, 4 accessories)."
          setup_api_calls:
            - call: "POST /customers"
              payload: { name: "Cara Owner", service_address: "3 Pine St", roofline_feet: 150 }
              as: SalesRep
              captures: { cust_id: $.data.id }
            - call: "POST /estimates"
              payload: { customer_id: "${cust_id}", product_line: "PERMANENT", estimated_footage: 150, roofline_complexity: "MODERATE", accessory_count: 4 }
              as: SalesRep
              captures: { est_id: $.data.id }
          trigger:
            - call: "POST /estimates/${est_id}/quote"
              payload: {}
              as: SalesRep
          assert:
            - "Estimate.${est_id}.quoted_total_cents == 93675"
            - "Estimate.${est_id}.status == QUOTED"

      - name: invoice_per_line_tax_rounding_mode_b
        grounds:
          - calculations.invoice_total_rounding
          - entities.Invoice.fields.tax_cents
          - entities.Invoice.fields.total_cents
        distinguishing_aspect: |
          Mode (b): rounding order is pinned to per-line-then-sum. Three taxable lines of 1010 at 500 bps
          give round_half_up(50.5)=51 each -> 153, which diverges from sum-then-round (round_half_up(3030*0.05)=152).
          The scaffold pins per-line; the correct tax is 153, total 3183.
        test_recipe:
          setup:
            - "A customer exists."
          setup_api_calls:
            - call: "POST /customers"
              payload: { name: "Dan Owner", service_address: "4 Fir St", roofline_feet: 100 }
              as: SalesRep
              captures: { cust_id: $.data.id }
          trigger:
            - call: "POST /invoices"
              payload: { customer_id: "${cust_id}", source_type: "MANUAL", tax_rate_bps: 500, line_items: [ { description: "L1", amount_cents: 1010, taxable: true }, { description: "L2", amount_cents: 1010, taxable: true }, { description: "L3", amount_cents: 1010, taxable: true } ] }
              as: BillingAdmin
              captures: { inv_id: $.data.id }
          assert:
            - "Invoice.${inv_id}.subtotal_cents == 3030"
            - "Invoice.${inv_id}.tax_cents == 153"
            - "Invoice.${inv_id}.total_cents == 3183"

      - name: early_bird_tier_on_subtotal_mode_c
        grounds:
          - calculations.early_bird_contract_pricing
          - entities.SeasonalContract.fields.subtotal_cents
          - entities.SeasonalContract.fields.discount_cents
          - entities.SeasonalContract.fields.contract_price_cents
        distinguishing_aspect: |
          Mode (c): circular-looking dependency pinned by evaluation order. subtotal = 80000 + 25000 = 105000
          is computed first; the discount tier is keyed on the PRE-discount subtotal (105000 >= 100000 -> 10%)
          giving discount 10500 and price 94500 — NOT keyed on the final price 94500 (which would be < 100000
          -> 5%). The pinned order yields discount_cents == 10500, not 5250 or 4725.
        test_recipe:
          setup:
            - "Clock at 2026-06-01. A DRAFT SEASONAL_RENTAL contract with base 80000, storage included (surcharge 25000), cutoff 2026-08-15."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: SalesRep
            - call: "POST /customers"
              payload: { name: "Eve Owner", service_address: "5 Ash St", roofline_feet: 180 }
              as: SalesRep
              captures: { cust_id: $.data.id }
            - call: "POST /contracts"
              payload: { customer_id: "${cust_id}", contract_type: "SEASONAL_RENTAL", season_year: 2026, base_season_fee_cents: 80000, early_bird_cutoff: "2026-08-15T00:00:00Z", storage_included: true, storage_surcharge_cents: 25000 }
              as: SalesRep
              captures: { contract_id: $.data.id }
          trigger:
            - call: "POST /contracts/${contract_id}/sign"
              payload: {}
              as: SalesRep
          assert:
            - "SeasonalContract.${contract_id}.subtotal_cents == 105000"
            - "SeasonalContract.${contract_id}.early_bird == true"
            - "SeasonalContract.${contract_id}.discount_cents == 10500"
            - "SeasonalContract.${contract_id}.contract_price_cents == 94500"

  # =================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: job_weather_reschedule_cycle
        grounds:
          - state_machines.Job.SCHEDULED_to_RESCHEDULED
          - state_machines.Job.RESCHEDULED_to_SCHEDULED
          - entities.Job.fields.reschedule_count
        distinguishing_aspect: |
          On the Job entity: a genuine cycle SCHEDULED -> RESCHEDULED -> SCHEDULED (weather loop). After
          weather-hold then reschedule the job is back in SCHEDULED with reschedule_count == 1 and a new
          scheduled_date — not a one-way linear pipeline.
        test_recipe:
          setup:
            - "An ACTIVE SEASONAL_RENTAL contract; a SCHEDULED TAKEDOWN job."
          setup_api_calls:
            - call: "POST /customers"
              payload: { name: "Fay Owner", service_address: "6 Bay St", roofline_feet: 120 }
              as: SalesRep
              captures: { cust_id: $.data.id }
            - call: "POST /contracts"
              payload: { customer_id: "${cust_id}", contract_type: "SEASONAL_RENTAL", season_year: 2026, base_season_fee_cents: 50000, early_bird_cutoff: "2027-01-01T00:00:00Z" }
              as: SalesRep
              captures: { contract_id: $.data.id }
            - call: "POST /contracts/${contract_id}/sign"
              payload: {}
              as: SalesRep
            - call: "POST /jobs"
              payload: { contract_id: "${contract_id}", job_type: "TAKEDOWN", scheduled_date: "2026-12-01T09:00:00Z" }
              as: Dispatcher
              captures: { job_id: $.data.id }
          trigger:
            - call: "POST /jobs/${job_id}/weather-hold"
              payload: {}
              as: Dispatcher
            - call: "POST /jobs/${job_id}/reschedule"
              payload: { new_scheduled_date: "2026-12-05T09:00:00Z" }
              as: Dispatcher
          assert:
            - "Job.${job_id}.status == SCHEDULED"
            - "Job.${job_id}.reschedule_count == 1"
            - "Job.${job_id}.scheduled_date == 2026-12-05T09:00:00Z"

      - name: service_call_warranty_vs_billable_branch
        grounds:
          - state_machines.ServiceCall.OPEN_to_CLASSIFIED
          - state_machines.ServiceCall.SCHEDULED_to_RESOLVED
          - entities.ServiceCall.fields.classification
        distinguishing_aspect: |
          On the ServiceCall entity (different entity than Job): a branch fork at classify (WARRANTY|BILLABLE)
          with divergent resolve side-effects — the BILLABLE branch creates an ISSUED Invoice of 8000 and bumps
          Customer.outstanding_balance_cents, whereas the WARRANTY branch creates no invoice.
        test_recipe:
          setup:
            - "An ACTIVE contract; a service call OPEN with service_fee_cents 8000, classified BILLABLE, then scheduled (SERVICE job spawned)."
          setup_api_calls:
            - call: "POST /customers"
              payload: { name: "Gil Owner", service_address: "7 Cove St", roofline_feet: 90 }
              as: SalesRep
              captures: { cust_id: $.data.id }
            - call: "POST /contracts"
              payload: { customer_id: "${cust_id}", contract_type: "SEASONAL_RENTAL", season_year: 2026, base_season_fee_cents: 50000, early_bird_cutoff: "2027-01-01T00:00:00Z" }
              as: SalesRep
              captures: { contract_id: $.data.id }
            - call: "POST /contracts/${contract_id}/sign"
              payload: {}
              as: SalesRep
            - call: "POST /service-calls"
              payload: { contract_id: "${contract_id}", reported_issue: "wind damage", cause: "WEATHER", service_fee_cents: 8000 }
              as: BillingAdmin
              captures: { sc_id: $.data.id }
            - call: "POST /service-calls/${sc_id}/classify"
              payload: { classification: "BILLABLE" }
              as: BillingAdmin
            - call: "POST /service-calls/${sc_id}/schedule"
              payload: { scheduled_date: "2026-12-10T09:00:00Z" }
              as: Dispatcher
          trigger:
            - call: "POST /service-calls/${sc_id}/resolve"
              payload: {}
              as: BillingAdmin
          assert:
            - "ServiceCall.${sc_id}.status == RESOLVED"
            - "ServiceCall.${sc_id}.classification == BILLABLE"
            - "exactly one Invoice exists with customer_id == ${cust_id}, source_type == SERVICE, total_cents == 8000"
            - "Customer.${cust_id}.outstanding_balance_cents == 8000"

  # =================================================================
  - rule_id: transitive_cascade
    instances:
      - name: contract_cancel_cascade_depth3
        grounds:
          - state_machines.SeasonalContract.ACTIVE_to_CANCELLED
          - state_machines.Job.SCHEDULED_to_CANCELLED
          - state_machines.RouteAssignment.BOOKED_to_RELEASED
          - entities.RouteDay.fields.booked_stops
        distinguishing_aspect: |
          Depth-3 chain from contract cancel: Contract ACTIVE->CANCELLED mutates the Job (SCHEDULED->CANCELLED);
          that Job cancellation releases its RouteAssignment (BOOKED->RELEASED); that release decrements
          RouteDay.booked_stops (1 -> 0). Each hop is caused by the prior mutation, not by the cancel directly.
        test_recipe:
          setup:
            - "An ACTIVE contract with one SCHEDULED INSTALL job booked (BOOKED) onto a route day (booked_stops 1)."
          setup_api_calls:
            - call: "POST /customers"
              payload: { name: "Hal Owner", service_address: "8 Dune St", roofline_feet: 140 }
              as: SalesRep
              captures: { cust_id: $.data.id }
            - call: "POST /contracts"
              payload: { customer_id: "${cust_id}", contract_type: "SEASONAL_RENTAL", season_year: 2026, base_season_fee_cents: 50000, early_bird_cutoff: "2027-01-01T00:00:00Z" }
              as: SalesRep
              captures: { contract_id: $.data.id }
            - call: "POST /contracts/${contract_id}/sign"
              payload: {}
              as: SalesRep
            - call: "POST /jobs"
              payload: { contract_id: "${contract_id}", job_type: "INSTALL", scheduled_date: "2026-11-15T09:00:00Z" }
              as: Dispatcher
              captures: { job_id: $.data.id }
            - call: "POST /crews"
              payload: { name: "Crew B", home_zone: "S", daily_stop_capacity: 5 }
              as: Dispatcher
              captures: { crew_id: $.data.id }
            - call: "POST /route-days"
              payload: { crew_id: "${crew_id}", service_date: "2026-11-15T00:00:00Z", zone: "S", max_stops: 5 }
              as: Dispatcher
              captures: { rd_id: $.data.id, rd_v: $.data.version }
            - call: "POST /route-assignments"
              payload: { route_day_id: "${rd_id}", job_id: "${job_id}", window_start: "2026-11-15T09:00:00Z", window_end: "2026-11-15T11:00:00Z", expected_route_day_version: "${rd_v}" }
              as: Dispatcher
              captures: { ra_id: $.data.id }
          trigger:
            - call: "POST /contracts/${contract_id}/cancel"
              payload: {}
              as: SalesRep
          assert:
            - "SeasonalContract.${contract_id}.status == CANCELLED"
            - "Job.${job_id}.status == CANCELLED"
            - "RouteAssignment.${ra_id}.status == RELEASED"
            - "RouteDay.${rd_id}.booked_stops == 0"

      - name: service_resolve_billable_cascade_depth2
        grounds:
          - state_machines.ServiceCall.SCHEDULED_to_RESOLVED
          - state_machines.Invoice.ISSUED_to_VOID
          - entities.Customer.fields.outstanding_balance_cents
        distinguishing_aspect: |
          Depth-2 chain from a different trigger (service resolve, not contract cancel): resolving a BILLABLE
          ServiceCall creates an ISSUED Invoice (hop1) of 12000; the Invoice creation recomputes
          Customer.outstanding_balance_cents to 12000 (hop2).
        test_recipe:
          setup:
            - "An ACTIVE contract; a BILLABLE service call (fee 12000) scheduled (SERVICE job spawned)."
          setup_api_calls:
            - call: "POST /customers"
              payload: { name: "Ida Owner", service_address: "9 Reef St", roofline_feet: 110 }
              as: SalesRep
              captures: { cust_id: $.data.id }
            - call: "POST /contracts"
              payload: { customer_id: "${cust_id}", contract_type: "SEASONAL_RENTAL", season_year: 2026, base_season_fee_cents: 50000, early_bird_cutoff: "2027-01-01T00:00:00Z" }
              as: SalesRep
              captures: { contract_id: $.data.id }
            - call: "POST /contracts/${contract_id}/sign"
              payload: {}
              as: SalesRep
            - call: "POST /service-calls"
              payload: { contract_id: "${contract_id}", reported_issue: "bulb string out", cause: "DEFECT", service_fee_cents: 12000 }
              as: BillingAdmin
              captures: { sc_id: $.data.id }
            - call: "POST /service-calls/${sc_id}/classify"
              payload: { classification: "BILLABLE" }
              as: BillingAdmin
            - call: "POST /service-calls/${sc_id}/schedule"
              payload: { scheduled_date: "2026-12-20T09:00:00Z" }
              as: Dispatcher
          trigger:
            - call: "POST /service-calls/${sc_id}/resolve"
              payload: {}
              as: BillingAdmin
          assert:
            - "exactly one Invoice exists with customer_id == ${cust_id}, source_type == SERVICE, total_cents == 12000, status == ISSUED"
            - "Customer.${cust_id}.outstanding_balance_cents == 12000"

  # =================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: payment_state_vs_overpayment_conflict
        grounds:
          - validations[priority=8]
          - validations[priority=14]
          - errors[ERR_PLAN_NOT_ACTIVE]
          - errors[ERR_OVERPAYMENT]
        distinguishing_aspect: |
          Error-category pair state (priority 8) x business_fiscal (priority 14). A payment against a PAID_OFF
          plan (remaining 0) violates BOTH the state precondition (plan not ACTIVE) and the fiscal overpayment
          rule (principal 100000 > remaining 0); the higher-priority state error ERR_PLAN_NOT_ACTIVE is returned,
          NOT ERR_OVERPAYMENT.
        test_recipe:
          setup:
            - "A PERMANENT_PURCHASE contract ACTIVE; a plan (principal 200000, apr 0, term 2) fully paid off by 2 payments of 100000 (status PAID_OFF, remaining 0)."
          setup_api_calls:
            - call: "POST /customers"
              payload: { name: "Jim Owner", service_address: "10 Key St", roofline_feet: 130 }
              as: SalesRep
              captures: { cust_id: $.data.id }
            - call: "POST /contracts"
              payload: { customer_id: "${cust_id}", contract_type: "PERMANENT_PURCHASE", season_year: 2026, base_season_fee_cents: 80000, early_bird_cutoff: "2027-01-01T00:00:00Z" }
              as: SalesRep
              captures: { contract_id: $.data.id }
            - call: "POST /contracts/${contract_id}/sign"
              payload: {}
              as: SalesRep
            - call: "POST /financing-plans"
              payload: { contract_id: "${contract_id}", original_principal_cents: 200000, apr_bps: 0, term_months: 2 }
              as: BillingAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /financing-plans/${plan_id}/payments"
              payload: { amount_cents: 100000 }
              as: BillingAdmin
            - call: "POST /financing-plans/${plan_id}/payments"
              payload: { amount_cents: 100000 }
              as: BillingAdmin
          trigger:
            - call: "POST /financing-plans/${plan_id}/payments"
              payload: { amount_cents: 100000 }
              as: BillingAdmin
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "response.error_id == ERR_PLAN_NOT_ACTIVE"
            - "response.error_id != ERR_OVERPAYMENT"
            - "FinancingPlan.${plan_id}.status == PAID_OFF"

      - name: assignment_referential_vs_temporal_conflict
        grounds:
          - validations[priority=10]
          - validations[priority=11]
          - errors[ERR_JOB_NOT_BOOKABLE]
          - errors[ERR_WINDOW_OVERLAP]
        distinguishing_aspect: |
          Error-category pair business_referential (priority 10) x business_temporal (priority 11), a different
          pair than payment_state_vs_overpayment_conflict. Booking a CANCELLED job onto a window that also
          overlaps an existing assignment violates both; the higher-priority referential error
          ERR_JOB_NOT_BOOKABLE is returned, NOT ERR_WINDOW_OVERLAP.
        test_recipe:
          setup:
            - "An ACTIVE contract; a route day with assignment A booked at [09:00,11:00); a second job B created then CANCELLED (no assignment)."
          setup_api_calls:
            - call: "POST /customers"
              payload: { name: "Kim Owner", service_address: "11 Bluff St", roofline_feet: 160 }
              as: SalesRep
              captures: { cust_id: $.data.id }
            - call: "POST /contracts"
              payload: { customer_id: "${cust_id}", contract_type: "SEASONAL_RENTAL", season_year: 2026, base_season_fee_cents: 50000, early_bird_cutoff: "2027-01-01T00:00:00Z" }
              as: SalesRep
              captures: { contract_id: $.data.id }
            - call: "POST /contracts/${contract_id}/sign"
              payload: {}
              as: SalesRep
            - call: "POST /crews"
              payload: { name: "Crew C", home_zone: "E", daily_stop_capacity: 5 }
              as: Dispatcher
              captures: { crew_id: $.data.id }
            - call: "POST /route-days"
